# Svenska översättningar av katalogtexten (våg 12); stegtexterna kommer senare.
Egyptian conquest of Darfur: Egyptens erövring av Darfur
? The end of the independent Keira sultanate of Darfur at the hands of al-Zubayr Rahma Mansur, a Ja’ali merchant prince from the Nile who had built a private empire of trading and slave-raiding stations (zaribas) in Bahr el-Ghazal, and of the Egyptian government of Sudan. The sultans of Darfur controlled the trade routes north from Bahr el-Ghazal, and quarrels over caravans and a grain embargo led al-Zubayr to fight the Rizeigat Baggara, Darfur’s clients, and to occupy Shakka in August 1873. Khedive Ismail made him governor of Shakka and Bahr el-Ghazal in November 1873, and in 1874 his army of slave riflemen (bazinqir) invaded Darfur from the south while the governor-general Ismail Ayyub Pasha advanced from Kordofan. On 25 October 1874 (23 or 30 October in other accounts) Sultan Ibrahim Qarad was defeated and killed at Manawashi, south of El Fasher; al-Zubayr entered El Fasher on 2 November and Ismail Ayyub two days later. Darfur became an Egyptian province, but members of the Keira family led resistance from Jebel Marra for years. Al-Zubayr went to Cairo in 1875 to press his claims and was not allowed to return; his son Sulayman was killed after a revolt in 1879, and his lieutenant Rabih az-Zubayr went west to found his own state. Egyptian rule in Darfur ended with the Mahdist rising in 1883.
: Slutet för det självständiga keirasultanatet i Darfur, som föll för al-Zubayr Rahma Mansur, en ja’ali-köpmannafurste från Nilen som hade byggt upp ett privat välde av handels- och slavjaktsstationer (zaribas) i Bahr el-Ghazal, och för Sudans egyptiska regering. Darfurs sultaner kontrollerade handelsvägarna norrut från Bahr el-Ghazal, och tvister om karavaner och ett spannmålsembargo fick al-Zubayr att strida mot rizeigat-baggara, Darfurs klienter, och att ockupera Shakka i augusti 1873. Khediven Ismail gjorde honom till guvernör över Shakka och Bahr el-Ghazal i november 1873, och 1874 invaderade hans armé av slavsoldater med gevär (bazinqir) Darfur söderifrån, medan generalguvernören Ismail Ayyub pasha ryckte fram från Kordofan. Den 25 oktober 1874 (den 23 eller 30 oktober enligt andra uppgifter) besegrades och dödades sultan Ibrahim Qarad vid Manawashi, söder om El Fasher; al-Zubayr tågade in i El Fasher den 2 november och Ismail Ayyub två dagar senare. Darfur blev en egyptisk provins, men medlemmar av keirasläkten ledde i åratal motståndet från Jebel Marra. Al-Zubayr reste till Kairo 1875 för att driva sina anspråk och fick inte återvända; hans son Sulayman dödades efter ett uppror 1879, och hans underbefälhavare Rabih az-Zubayr drog västerut för att grunda en egen stat. Det egyptiska styret i Darfur upphörde med mahdistresningen 1883.
