# Svenska översättningar av katalogtexten (våg 12); stegtexterna kommer senare.
Egyptian conquest of Sudan: Egyptens erövring av Sudan
"The conquest of the Nile valley south of Egypt and of Kordofan by the armies of Muhammad Ali, the Ottoman governor of Egypt, which began sixty years of Turco-Egyptian rule, the Turkiyya. Muhammad Ali wanted slaves to build a new army and hoped to find gold. In 1820 his son Ismail Kamil Pasha led about 4,000 men up the Nile, defeated the Shayqiyya at Korti and received the submission of Berber and Shendi; on 14 June 1821 the last Funj sultan, Badi VII, surrendered Sennar. A second army under the defterdar Muhammad Bey Khusraw took Kordofan from the Sultanate of Darfur after a battle at Bara. Heavy taxes and demands for slaves provoked a rising: in late 1822 Mek Nimr of the Ja’aliyyin had Ismail and his staff burned to death at Shendi, and the defterdar’s reprisals killed some 30,000 people. Tens of thousands of Sudanese were marched north as slaves for the army, most of whom died. Khartoum, at the meeting of the Blue and White Niles, became the seat of the new government.": "Erövringen av Nildalen söder om Egypten och av Kordofan, genomförd av arméer som Egyptens osmanske guvernör Muhammad Ali sände ut; den inledde sextio år av turkisk-egyptiskt styre, den så kallade Turkiyya. Muhammad Ali ville ha slavar för att bygga upp en ny armé och hoppades finna guld. År 1820 ledde hans son Ismail Kamil pasha omkring 4 000 man uppför Nilen, besegrade shayqiyya vid Korti och tog emot underkastelse från Berber och Shendi; den 14 juni 1821 överlämnade den siste funjsultanen, Badi VII, Sennar. En andra armé under defterdaren Muhammad Bey Khusraw tog Kordofan från Darfursultanatet efter ett slag vid Bara. Tunga skatter och krav på slavar framkallade en resning: i slutet av 1822 lät Mek Nimr av ja’aliyyin bränna ihjäl Ismail och hans stab i Shendi, och defterdarens repressalier dödade omkring 30 000 människor. Tiotusentals sudaneser fördes norrut som slavar till armén, och de flesta av dem dog. Khartoum, där Blå och Vita Nilen flyter samman, blev säte för den nya regeringen."
