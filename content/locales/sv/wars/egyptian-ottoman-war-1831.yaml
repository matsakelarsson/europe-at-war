Egyptian–Ottoman War of 1831–1833: Egyptisk-osmanska kriget 1831–1833
A war in which Muhammad Ali, the Ottoman governor of Egypt, sent his son Ibrahim Pasha to conquer Syria from the Sultan. Ibrahim took Acre and Damascus, beat the Ottoman armies at Homs, Belen and Konya and advanced to Kütahya, until Russian intervention and pressure from Britain and France brought a settlement in May 1833 that left Egypt ruling Syria and Adana under nominal Ottoman sovereignty.: Ett krig där Muhammad Ali, den osmanske guvernören i Egypten, sände sin son Ibrahim pasha för att erövra Syrien från sultanen. Ibrahim intog Akko och Damaskus, besegrade de osmanska härarna vid Homs, Belen och Konya och ryckte fram till Kütahya, tills rysk intervention och påtryckningar från Storbritannien och Frankrike ledde till en uppgörelse i maj 1833 som lät Egypten styra Syrien och Adana under nominell osmansk överhöghet.
