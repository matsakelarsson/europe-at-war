Also called the First Syrian War or the First Turko-Egyptian War. Egypt was formally an Ottoman province, but Muhammad Ali ruled it as his own state, with an army and fleet trained on French lines.: Kallas även första syriska kriget eller första turkisk-egyptiska kriget. Egypten var formellt en osmansk provins, men Muhammad Ali styrde det som sin egen stat, med en armé och en flotta som utbildats efter franskt mönster.
Accounts differ on the dates of several battles in 1832 and on the size of the armies; numbers given here are estimates.: Uppgifterna går isär om datumen för flera slag 1832 och om arméernas storlek; siffrorna här är uppskattningar.
