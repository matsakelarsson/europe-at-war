Sultan Mahmud II raised a new army of more than 50,000 men under the grand vizier, Reşid Mehmed Pasha. Ibrahim crossed the Taurus and entered Konya unopposed in November. On 21 December 1832, in thick fog on the plain outside the town, his smaller army found a gap in the Ottoman line and broke it; the grand vizier, riding forward to rally his left wing, was taken prisoner. The Egyptians lost fewer than 800 men, the Ottomans about 3,000 dead, many prisoners and much of their artillery. No army now stood between Ibrahim and Constantinople, and by February 1833 he was at Kütahya.: Sultan Mahmud II satte upp en ny armé på mer än 50 000 man under storvesiren Reşid Mehmed pasha. Ibrahim gick över Taurus och tågade utan motstånd in i Konya i november. Den 21 december 1832, i tät dimma på slätten utanför staden, fann hans mindre armé en lucka i den osmanska linjen och bröt igenom; storvesiren, som red fram för att samla sin vänstra flygel, togs till fånga. Egyptierna förlorade färre än 800 man, osmanerna omkring 3 000 döda, många fångar och en stor del av sitt artilleri. Ingen armé stod nu mellan Ibrahim och Konstantinopel, och i februari 1833 var han i Kütahya.
Turned down by Britain and France, the Sultan accepted help from Russia. A Russian squadron anchored in the Bosporus in February, and Russian troops, by various estimates from 18,000 to 40,000 men, landed on its Asian shore at Hünkâr İskelesi. Alarmed, Britain and France pressed both sides to settle. In May 1833 the Sultan confirmed Muhammad Ali as governor of Egypt and Crete and gave him the provinces of Syria, with Adana for Ibrahim, and the Egyptian army withdrew behind the Taurus. On 8 July Russia and the Ottomans signed the Treaty of Hünkâr İskelesi, a defensive alliance whose secret article alarmed Britain. Egyptian conscription and taxes soon provoked risings in Syria, among them the Palestinian peasants’ revolt of 1834.: Sedan Storbritannien och Frankrike avvisat honom tog sultanen emot hjälp från Ryssland. En rysk eskader ankrade i Bosporen i februari, och ryska trupper, enligt olika uppskattningar från 18 000 till 40 000 man, landsteg på dess asiatiska strand vid Hünkâr İskelesi. Oroade pressade Storbritannien och Frankrike båda sidor att komma överens. I maj 1833 bekräftade sultanen Muhammad Ali som guvernör över Egypten och Kreta och gav honom de syriska provinserna, med Adana åt Ibrahim, och den egyptiska armén drog sig tillbaka bakom Taurus. Den 8 juli undertecknade Ryssland och osmanerna fördraget i Hünkâr İskelesi, en defensiv allians vars hemliga artikel oroade Storbritannien. Egyptisk utskrivning och egyptiska skatter framkallade snart uppror i Syrien, bland dem det palestinska bondeupproret 1834.
