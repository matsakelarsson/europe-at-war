Muhammad Ali had sent his army and fleet to fight the Greek revolt for the Sultan, and had received only Crete for it. He wanted Syria, with its timber, revenues and men. His pretext was a quarrel with Abdullah Pasha, governor of Acre, who had taken in thousands of Egyptian peasants fleeing conscription and taxes. At the end of October 1831 an army of about 30,000 men marched across Sinai, while Ibrahim Pasha sailed to Jaffa. Jaffa, Jerusalem, Sidon, Beirut and Tripoli submitted, and on 26 November Ibrahim laid siege to Acre, whose walls had defied Napoleon in 1799.: Muhammad Ali hade sänt sin armé och flotta för att bekämpa det grekiska upproret för sultanens räkning och hade bara fått Kreta i ersättning. Han ville ha Syrien, med dess timmer, inkomster och manskap. Förevändningen var en tvist med Abdullah pasha, guvernör i Akko, som hade tagit emot tusentals egyptiska bönder som flydde undan utskrivning och skatter. I slutet av oktober 1831 marscherade en armé på omkring 30 000 man över Sinai, medan Ibrahim pasha seglade till Jaffa. Jaffa, Jerusalem, Sidon, Beirut och Tripoli underkastade sig, och den 26 november belägrade Ibrahim Akko, vars murar hade trotsat Napoleon 1799.
Abdullah’s garrison beat off bombardments and assaults for six months, while the Sultan declared Muhammad Ali a rebel and gathered an army against him. On 27 May 1832 Ibrahim led the final storm in person; the ruined town was plundered and Abdullah was sent to Egypt as a prisoner. Damascus opened its gates in June. In July Ibrahim beat the Ottoman vanguard at Homs and took Aleppo, and at the end of the month he routed the main army of Ağa Hüseyin Pasha in the Belen pass above Alexandretta, then crossed into Cilicia and took Adana and Tarsus.: Abdullahs garnison slog tillbaka bombardemang och stormningar i sex månader, medan sultanen förklarade Muhammad Ali för upprorsman och samlade en armé mot honom. Den 27 maj 1832 ledde Ibrahim personligen den sista stormningen; den förstörda staden plundrades och Abdullah sändes som fånge till Egypten. Damaskus öppnade sina portar i juni. I juli slog Ibrahim den osmanska förtruppen vid Homs och tog Aleppo, och i slutet av månaden krossade han Ağa Hüseyin pashas huvudarmé i Belenpasset ovanför Alexandretta, gick sedan in i Kilikien och tog Adana och Tarsus.
