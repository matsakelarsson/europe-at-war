Neither side accepted the settlement of 1833 as final. Muhammad Ali wanted his rule over Egypt and Syria made hereditary and spoke openly of independence, while Mahmud II rebuilt his army with the help of Prussian officers, among them Captain Helmuth von Moltke, the future chief of the Prussian general staff. In April 1839 an Ottoman army under Hafiz Mehmed Pasha crossed the Euphrates at Birecik into Egyptian-held Syria. Ibrahim Pasha marched north from Aleppo to meet it, with the former French officer Soliman Pasha commanding his right wing.: Ingen av parterna godtog uppgörelsen 1833 som slutgiltig. Muhammad Ali ville göra sitt styre över Egypten och Syrien ärftligt och talade öppet om självständighet, medan Mahmud II byggde upp sin armé på nytt med hjälp av preussiska officerare, bland dem kapten Helmuth von Moltke, den blivande chefen för den preussiska generalstaben. I april 1839 gick en osmansk armé under Hafiz Mehmed pasha över Eufrat vid Birecik in i det egyptiskkontrollerade Syrien. Ibrahim pasha marscherade norrut från Aleppo för att möta den, med den förre franske officeren Soliman pasha som befälhavare för sin högra flygel.
Hafiz had been ordered to wait in strong positions, and Moltke urged him to attack or move, but he did neither. Ibrahim marched round the Ottoman camp, forcing Hafiz to turn his army about overnight, and on 24 June near Nezib the Egyptian artillery and infantry broke it. The Ottomans fled, leaving their guns and thousands of prisoners. Mahmud II died on 1 July, leaving the throne to his 16-year-old son Abdülmecid I, and in July the Kapudan Pasha, Ahmed Fevzi, sailed the Ottoman fleet to Alexandria and handed it over to Muhammad Ali.: Hafiz hade beordrats att vänta i starka ställningar, och Moltke uppmanade honom att anfalla eller förflytta sig, men han gjorde ingetdera. Ibrahim marscherade runt det osmanska lägret och tvingade Hafiz att vända sin armé under natten, och den 24 juni nära Nezib bröt det egyptiska artilleriet och infanteriet den. Osmanerna flydde och lämnade kvar sina kanoner och tusentals fångar. Mahmud II dog den 1 juli och lämnade tronen åt sin 16-årige son Abdülmecid I, och i juli seglade kapudan pasha Ahmed Fevzi den osmanska flottan till Alexandria och överlämnade den till Muhammad Ali.
