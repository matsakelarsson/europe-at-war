By the Convention of London of 15 July 1840 Britain, Austria, Prussia and Russia agreed with the Ottomans to offer Muhammad Ali hereditary rule of Egypt and lifelong rule of southern Syria if he accepted within ten days, and to force him out if he did not. Counting on France, which had been left out and talked of war, he refused. In Lebanon, Druze and Maronite mountaineers had already risen against Egyptian conscription and disarmament. In September British, Austrian and Ottoman ships under Admiral Robert Stopford bombarded Beirut and landed troops at Jounieh. Commodore Charles Napier took Sidon, the Egyptians abandoned Beirut on 3 October, and Ibrahim’s troops were beaten in the hills at Boharsef.: Genom Londonkonventionen den 15 juli 1840 kom Storbritannien, Österrike, Preussen och Ryssland överens med osmanerna om att erbjuda Muhammad Ali ärftligt styre över Egypten och livstida styre över södra Syrien om han accepterade inom tio dagar, och att driva ut honom om han inte gjorde det. I förlitan på Frankrike, som hållits utanför och talade om krig, vägrade han. I Libanon hade drusiska och maronitiska bergsbor redan rest sig mot egyptisk utskrivning och avväpning. I september bombarderade brittiska, österrikiska och osmanska fartyg under amiral Robert Stopford Beirut och landsatte trupper vid Jounieh. Kommendör Charles Napier tog Sidon, egyptierna övergav Beirut den 3 oktober, och Ibrahims trupper besegrades i bergen vid Boharsef.
On 3 November the fleet bombarded Acre. A shell blew up the main magazine, killing about 1,100 men, and the garrison left that night; the British lost 18 killed. Napier sailed on to Alexandria and on 27 November, on his own authority, agreed a convention with Muhammad Ali. Ibrahim’s army marched back to Egypt through Syria that winter, losing many men. Firmans of 1841 gave Muhammad Ali and his heirs hereditary rule of Egypt under Ottoman sovereignty and limited his army to 18,000 men; he gave up Syria, Adana, Crete and the Hijaz and returned the Ottoman fleet.: Den 3 november bombarderade flottan Akko. En granat sprängde huvudkrutförrådet och dödade omkring 1 100 man, och garnisonen lämnade staden samma natt; britterna förlorade 18 döda. Napier seglade vidare till Alexandria och slöt den 27 november, på eget bevåg, en konvention med Muhammad Ali. Ibrahims armé marscherade samma vinter tillbaka till Egypten genom Syrien och förlorade många man. Firmaner från 1841 gav Muhammad Ali och hans arvingar ärftligt styre över Egypten under osmansk överhöghet och begränsade hans armé till 18 000 man; han avstod från Syrien, Adana, Kreta och Hijaz och återlämnade den osmanska flottan.
