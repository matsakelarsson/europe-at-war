Egyptian–Ottoman War of 1839–1841: Egyptisk-osmanska kriget 1839–1841
A second war between Muhammad Ali’s Egypt and the Ottoman Empire, opened by Sultan Mahmud II to win back Syria. Ibrahim Pasha routed the Ottoman army at Nezib in 1839 and the Ottoman fleet went over to Egypt, but Britain, Austria, Prussia and Russia took the Sultan’s side; British and Austrian ships took Beirut, Sidon and Acre in 1840, and Muhammad Ali gave up Syria, Adana and Crete in return for hereditary rule of Egypt.: Ett andra krig mellan Muhammad Alis Egypten och Osmanska riket, inlett av sultan Mahmud II för att återvinna Syrien. Ibrahim pasha krossade den osmanska hären vid Nezib 1839 och den osmanska flottan gick över till Egypten, men Storbritannien, Österrike, Preussen och Ryssland ställde sig på sultanens sida; brittiska och österrikiska fartyg intog Beirut, Sidon och Akko 1840, och Muhammad Ali gav upp Syrien, Adana och Kreta i utbyte mot ärftligt styre över Egypten.
