# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
Eight Trigrams uprising: De åtta trigrammens uppror
? A millenarian rising in northern China by the Eight Trigrams, a network of sects of the Heavenly Principle (Tianli) teaching, related to the White Lotus tradition, whose followers expected the Eternal Venerable Mother to bring the end of the age. Its leaders, Lin Qing near Beijing and Li Wencheng in Hua county in northern Henan, planned simultaneous risings for the 15th day of the ninth lunar month of 1813 (8 October), when the Jiaqing Emperor was due back from his autumn hunt. Li Wencheng was arrested beforehand, and on 30 September his followers rose early, stormed Hua county town and freed him; sects in southern Zhili and Shandong took Caoxian and Dingtao. On 8 October some 80 of Lin Qing’s followers, guided by sympathetic palace eunuchs, broke into the Forbidden City in Beijing; they were driven back by guards and princes, among them the future Daoguang Emperor, Mianning, who shot two of them with a musket, and Lin Qing was captured and executed. Qing armies under Nayancheng retook the towns in Shandong and Zhili, Li Wencheng burned himself to death when surrounded at Sizhai in Hui county, and Hua county fell after a siege on 1 January 1814. More than 20,000 sect members were killed or executed, and some 70,000 people are estimated to have died in the disorder.
: En millenaristisk resning i norra Kina av De åtta trigrammen, ett nätverk av sekter inom läran om den himmelska principen (Tianli), besläktad med Vita lotus-traditionen, vars anhängare väntade att Den eviga vördnadsvärda modern skulle föra tidsåldern till dess slut. Dess ledare, Lin Qing nära Peking och Li Wencheng i Hua härad i norra Henan, planerade samtidiga resningar till den 15:e dagen i den nionde månmånaden 1813 (8 oktober), då Jiaqingkejsaren väntades tillbaka från sin höstjakt. Li Wencheng greps i förväg, och den 30 september reste sig hans anhängare i förtid, stormade häradsstaden Hua och befriade honom; sekter i södra Zhili och Shandong intog Caoxian och Dingtao. Den 8 oktober bröt sig omkring 80 av Lin Qings anhängare, vägledda av sympatiserande palatseunucker, in i Förbjudna staden i Peking; de drevs tillbaka av vakter och prinsar, bland dem den blivande Daoguangkejsaren, Mianning, som sköt två av dem med en musköt, och Lin Qing tillfångatogs och avrättades. Qingarméer under Nayancheng återtog städerna i Shandong och Zhili, Li Wencheng brände sig till döds när han omringats vid Sizhai i Hui härad, och Hua föll efter en belägring den 1 januari 1814. Mer än 20 000 sektmedlemmar dödades eller avrättades, och omkring 70 000 människor beräknas ha omkommit i oroligheterna.
