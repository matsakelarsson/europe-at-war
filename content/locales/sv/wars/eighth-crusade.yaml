Eighth Crusade: Åttonde korståget
The second crusade of Louis IX of France, which was diverted to Tunis, perhaps in the hope of converting its Hafsid ruler, of gaining a base against Mamluk Egypt, or at the urging of Louis’s brother Charles of Anjou, king of Sicily. The army landed near the ruins of Carthage in July 1270 and was struck by disease, and Louis died in his camp on 25 August. Charles arrived the same day, and after some fighting the crusaders made a treaty with the emir Muhammad al-Mustansir, who paid an indemnity and tribute, and sailed home in November.: Ludvig IX av Frankrikes andra korståg, som leddes om till Tunis, kanske i hopp om att omvända dess hafsidiske härskare, vinna en bas mot mamlukernas Egypten eller på uppmaning av Ludvigs bror Karl av Anjou, kung av Sicilien. Hären landsteg nära Karthagos ruiner i juli 1270 och drabbades av sjukdom, och Ludvig dog i sitt läger den 25 augusti. Karl anlände samma dag, och efter vissa strider slöt korsfararna ett fördrag med emiren Muhammad al-Mustansir, som betalade krigsskadestånd och tribut, och seglade hem i november.
