Louis’s son and heir Philip III, who was with the army, was proclaimed king at Carthage. Louis was canonised in 1297. The Lord Edward of England arrived after the treaty and sailed on to Acre; his expedition is counted as the Ninth Crusade.: Ludvigs son och arvinge Filip III, som var med hären, utropades till kung i Kartago. Ludvig helgonförklarades 1297. Lord Edvard av England anlände efter fördraget och seglade vidare till Akko; hans expedition räknas som det nionde korståget.
