The siege of Ostend, the last rebel foothold on the Flemish coast, began on 5 July 1601 and became one of the longest and bloodiest of the age. Supplied by sea, the garrison was relieved in turns while the besiegers dug and stormed in the dunes; more than 100,000 people may have been killed, wounded or died of disease. The Genoese commander Ambrogio Spinola finally took the ruins on 20 September 1604, but Maurice had meanwhile captured Sluis, a better harbour. England, under James I, had made peace with Spain in the Treaty of London that August.: Belägringen av Oostende, rebellernas sista fäste på den flamländska kusten, inleddes den 5 juli 1601 och blev en av tidens längsta och blodigaste. Garnisonen, som försörjdes sjövägen, avlöstes växelvis medan belägrarna grävde och stormade i dynerna; mer än 100 000 människor kan ha dödats, sårats eller dött av sjukdom. Den genuesiske befälhavaren Ambrogio Spinola intog till slut ruinerna den 20 september 1604, men Moritz hade under tiden erövrat Sluis, en bättre hamn. England under Jakob I hade slutit fred med Spanien genom Londonfördraget i augusti samma år.
Spinola carried the war across the great rivers in 1605–1606, taking Oldenzaal, Lingen, Groenlo and Rheinberg, but Spain’s money ran out. In April 1607 a Dutch fleet under Jacob van Heemskerk destroyed a Spanish fleet in the bay of Gibraltar, and that autumn the Spanish crown suspended its payments. On 9 April 1609 the two sides signed the Twelve Years’ Truce in Antwerp. Spain treated the United Provinces as free states over which it claimed no authority, though it did not formally recognise their independence, and each side kept what it held.: Spinola förde 1605–1606 kriget över de stora floderna och tog Oldenzaal, Lingen, Groenlo och Rheinberg, men Spaniens pengar tog slut. I april 1607 förintade en nederländsk flotta under Jacob van Heemskerk en spansk flotta i Gibraltarbukten, och samma höst ställde den spanska kronan in sina betalningar. Den 9 april 1609 undertecknade parterna tolvåriga stilleståndet i Antwerpen. Spanien behandlade de förenade provinserna som fria stater över vilka det inte gjorde anspråk på någon myndighet, även om det inte formellt erkände deras självständighet, och båda sidor behöll vad de innehade.
