Haarlem held out for seven months. When hunger forced it to surrender on 13 July 1573, the townspeople bought themselves free, but most of the garrison was executed. Alkmaar then beat off Don Fadrique after the rebels flooded the land around his camp, the Sea Beggars beat a royal fleet on the Zuiderzee in October, and Alba was recalled. His successor, Luis de Requesens, destroyed a relief army at Mookerheyde on 14 April 1574, where Louis and Henry of Nassau were killed. But Leiden, besieged from May, was saved on 3 October when the rebels cut the dykes and sailed flat-bottomed boats across the flooded fields.: Haarlem höll stånd i sju månader. När hungern tvingade staden att kapitulera den 13 juli 1573 köpte sig invånarna fria, men större delen av garnisonen avrättades. Alkmaar slog sedan tillbaka Don Fadrique sedan rebellerna satt landet kring hans läger under vatten, sjögeuserna besegrade en kunglig flotta på Zuiderzee i oktober, och Alba kallades hem. Hans efterträdare Luis de Requesens förintade en undsättningshär vid Mookerheyde den 14 april 1574, där Ludvig och Henrik av Nassau stupade. Men Leiden, som belägrats sedan maj, räddades den 3 oktober när rebellerna genombröt vallarna och seglade flatbottnade båtar över de översvämmade fälten.
Unpaid for years, the Spanish troops mutinied again and again. Requesens died in March 1576, leaving no one in charge, and on 4 November mutineers sacked Antwerp, the richest city in northern Europe; at least 7,000 people were killed in the “Spanish Fury”. Four days later the States General of the loyal provinces and the rebels of Holland and Zeeland signed the Pacification of Ghent. They agreed to drive out the Spanish troops together and to suspend the heresy laws, leaving the question of religion for later.: De spanska trupperna, som inte fått sold på flera år, gjorde myteri gång på gång. Requesens dog i mars 1576 utan att någon tog över befälet, och den 4 november plundrade myterister Antwerpen, norra Europas rikaste stad; minst 7 000 människor dödades under ”det spanska raseriet”. Fyra dagar senare undertecknade de lojala provinsernas generalstater och rebellerna i Holland och Zeeland pacifikationen i Gent. De enades om att tillsammans driva ut de spanska trupperna och att upphäva kättarlagarna, medan religionsfrågan sköts upp till senare.
