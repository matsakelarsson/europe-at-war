In 1588 Parma’s army waited on the Flemish coast to cross to England, but the Spanish Armada, beaten off Gravelines and scattered by storms, never collected it, and Dutch flyboats blockaded the shallow coast. Philip then sent Parma into France against Henry IV, which gave the Dutch a breathing space. William’s son Maurice of Nassau and his cousin William Louis drilled their small, regularly paid army in volley fire and siege work. In March 1590 soldiers hidden in a peat barge took Breda; Zutphen, Deventer and Nijmegen fell in 1591, Steenwijk and Coevorden in 1592, and Groningen in July 1594.: År 1588 väntade Parmas här på den flamländska kusten på att gå över till England, men den spanska armadan, som slogs tillbaka utanför Gravelines och skingrades av stormar, hämtade den aldrig, och nederländska flöjter blockerade den grunda kusten. Filip sände sedan Parma in i Frankrike mot Henrik IV, vilket gav nederländarna ett andrum. Vilhelms son Moritz av Nassau och hans kusin Vilhelm Ludvig drillade sin lilla, regelbundet avlönade armé i salveld och belägringsarbete. I mars 1590 intog soldater som gömt sig i en torvpråm Breda; Zutphen, Deventer och Nijmegen föll 1591, Steenwijk och Coevorden 1592 och Groningen i juli 1594.
In January 1597 Maurice’s cavalry routed a Spanish force at Turnhout, and that summer he took the towns along the eastern border, from Rheinberg to Lingen. In 1598, shortly before his death, Philip II handed the Netherlands to his daughter Isabella and her husband, Archduke Albert. In 1600 the States General sent Maurice into Flanders to take Dunkirk, the base of the privateers who preyed on Dutch shipping. Albert caught him on the beach at Nieuwpoort on 2 July; the Dutch and English won a hard-fought battle, but Maurice had to withdraw, and Dunkirk was never taken.: I januari 1597 krossade Moritz kavalleri en spansk styrka vid Turnhout, och samma sommar tog han städerna längs den östra gränsen, från Rheinberg till Lingen. År 1598, strax före sin död, överlät Filip II Nederländerna åt sin dotter Isabella och hennes make, ärkehertig Albrekt. År 1600 sände generalstaterna Moritz in i Flandern för att ta Dunkerque, basen för de kapare som angrep nederländsk sjöfart. Albrekt hann upp honom på stranden vid Nieuwpoort den 2 juli; nederländarna och engelsmännen vann ett hårt slag, men Moritz måste dra sig tillbaka, och Dunkerque intogs aldrig.
