4 November 1576: 4 november 1576
Mutinous soldiers sacked Antwerp for three days. At least 7,000 people died; an English witness put the toll at 17,000.: Myteriska soldater plundrade Antwerpen i tre dagar. Minst 7 000 människor dog; ett engelskt vittne uppgav dödssiffran till 17 000.
The provinces agreed to expel the Spanish troops and to suspend the persecution of Protestants.: Provinserna enades om att driva ut de spanska trupperna och att upphöra med förföljelsen av protestanter.
Held by the rebels, 1574 (approximate): I rebellernas händer, 1574 (ungefärligt)
The new governor, Philip’s half-brother Don John of Austria, accepted the Pacification in February 1577 and sent the Spanish troops away, but soon seized the citadel of Namur and called them back. On 31 January 1578 he and his nephew Alexander Farnese, later Duke of Parma, routed the army of the States General at Gembloux. Don John died that October, and Parma, a skilled soldier and diplomat, took over. The rebels were divided too. Calvinists seized power in Ghent, Brussels and other cities, alarming the Catholic nobles and the Walloon provinces.: Den nye ståthållaren, Filips halvbror Don Juan av Österrike, godtog pacifikationen i februari 1577 och skickade bort de spanska trupperna, men intog snart citadellet i Namur och kallade tillbaka dem. Den 31 januari 1578 krossade han och hans brorson Alessandro Farnese, senare hertig av Parma, generalstaternas här vid Gembloux. Don Juan dog i oktober samma år, och Parma, en skicklig soldat och diplomat, tog över. Även rebellerna var splittrade. Kalvinister tog makten i Gent, Bryssel och andra städer, vilket oroade de katolska adelsmännen och de vallonska provinserna.
On 6 January 1579 Artois, Hainaut and the town of Douai formed the Union of Arras, and in May they made peace with Philip on condition that only Catholicism be allowed. On 23 January Holland, Zeeland, Utrecht, Guelders and the Groningen countryside formed the Union of Utrecht, later joined by Friesland, Overijssel, Drenthe and the great cities of Flanders and Brabant. Parma took Maastricht by storm in June after a four-month siege. Philip outlawed William in 1580, and on 26 July 1581 the States General renounced Philip as their sovereign in the Act of Abjuration.: Den 6 januari 1579 bildade Artois, Hainaut och staden Douai Arrasunionen, och i maj slöt de fred med Filip på villkor att endast katolicismen skulle tillåtas. Den 23 januari bildade Holland, Zeeland, Utrecht, Gelderland och Groningens landsbygd Utrechtunionen, som senare fick sällskap av Friesland, Overijssel, Drenthe och de stora städerna i Flandern och Brabant. Parma tog Maastricht med storm i juni efter en fyra månader lång belägring. Filip förklarade Vilhelm fredlös 1580, och den 26 juli 1581 avsade sig generalstaterna Filip som sin suverän genom avsättningsakten.
