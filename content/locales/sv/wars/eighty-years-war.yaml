The truce expired in April 1621, as the Thirty Years’ War was spreading through Germany. Spain’s chief minister, the Count-Duke of Olivares, hoped economic war would bring better terms. Dutch ships were banned from Spanish ports, and privateers from Dunkirk took hundreds of Dutch merchantmen and fishing boats. On land Spain took the Dutch-held fortress of Jülich in February 1622, but Spinola failed before Bergen op Zoom, which the Dutch supplied by water and relieved in October.: Stilleståndet löpte ut i april 1621, när trettioåriga kriget bredde ut sig i Tyskland. Spaniens ledande minister, greve-hertigen av Olivares, hoppades att ekonomisk krigföring skulle ge bättre villkor. Nederländska fartyg förbjöds i spanska hamnar, och kapare från Dunkerque tog hundratals nederländska handelsfartyg och fiskebåtar. Till lands tog Spanien den nederländskkontrollerade fästningen Jülich i februari 1622, men Spinola misslyckades inför Bergen op Zoom, som nederländarna försörjde sjövägen och undsatte i oktober.
In August 1624 Spinola laid siege to Breda, the Nassau family’s town in Brabant, surrounding it with lines too strong to break. Maurice died in The Hague on 23 April 1625, aged 57, while his armies tried in vain to relieve it, and his half-brother Frederick Henry succeeded him. Breda surrendered on 5 June 1625 after eleven months, and its garrison marched out with full honours, a scene Diego Velázquez painted about ten years later as The Surrender of Breda. It was the high point of Spanish fortunes in the later war.: I augusti 1624 belägrade Spinola Breda, familjen Nassaus stad i Brabant, och omgav den med linjer som var för starka för att brytas. Moritz dog i Haag den 23 april 1625, 57 år gammal, medan hans arméer förgäves försökte undsätta staden, och hans halvbror Fredrik Henrik efterträdde honom. Breda kapitulerade den 5 juni 1625 efter elva månader, och garnisonen tågade ut med full militär heder, en scen som Diego Velázquez målade omkring tio år senare som Bredas överlämnande. Det var höjdpunkten för Spaniens framgångar i krigets senare skede.
