In the 1560s the seventeen provinces of the Netherlands were governed from Brussels for Philip II of Spain, who enforced harsh laws against Protestants and sidelined the great nobles. In April 1566 several hundred lesser nobles petitioned the regent, Margaret of Parma, to suspend the heresy laws; a courtier is said to have called them beggars (gueux), and they took up the name. That summer Calvinist preachers drew huge crowds, and on 10 August a sermon near Steenvoorde in Flanders was followed by an attack on a church. Within weeks the Beeldenstorm, the iconoclastic fury, had stripped hundreds of churches of their images from Flanders to Groningen.: På 1560-talet styrdes Nederländernas sjutton provinser från Bryssel för Filip II av Spaniens räkning, och han tillämpade stränga lagar mot protestanter och sköt de stora adelsmännen åt sidan. I april 1566 inlämnade flera hundra lågadelsmän en petition till regenten, Margareta av Parma, om att upphäva kättarlagarna; en hovman ska ha kallat dem tiggare (gueux), och de antog namnet. Den sommaren drog kalvinistiska predikanter väldiga folkmassor, och den 10 augusti följdes en predikan nära Steenvoorde i Flandern av ett angrepp på en kyrka. Inom några veckor hade bildstormen rensat hundratals kyrkor från deras bilder från Flandern till Groningen.
Philip sent the Duke of Alba, who reached Brussels in August 1567 with about 10,000 veteran troops. His Council of Troubles condemned almost 9,000 people, most in their absence, and about 1,000 were executed, among them the counts of Egmont and Horn. William of Orange, the greatest noble of the Netherlands, had withdrawn to Germany and raised armies. His brother Louis of Nassau beat a royal force at Heiligerlee on 23 May 1568, usually taken as the start of the war, but Alba destroyed Louis’s army at Jemmingen on the Ems on 21 July, and William’s invasion of Brabant that autumn ran out of money.: Filip sände hertigen av Alba, som nådde Bryssel i augusti 1567 med omkring 10 000 krigsvana soldater. Hans blodsråd dömde nästan 9 000 människor, de flesta i deras frånvaro, och omkring 1 000 avrättades, bland dem grevarna Egmont och Horn. Vilhelm av Oranien, Nederländernas mäktigaste adelsman, hade dragit sig tillbaka till Tyskland och värvat härar. Hans bror Ludvig av Nassau slog en kunglig styrka vid Heiligerlee den 23 maj 1568, vilket vanligen räknas som krigets början, men Alba förintade Ludvigs här vid Jemmingen vid Ems den 21 juli, och Vilhelms invasion av Brabant samma höst rann ut i sanden av brist på pengar.
