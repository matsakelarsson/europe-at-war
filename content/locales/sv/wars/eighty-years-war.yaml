Eighty Years’ War: Åttioåriga kriget
The revolt of the Netherlands against Philip II of Spain, which grew out of Calvinist iconoclasm and the Duke of Alba’s repression into a long war between Spain and the northern provinces, interrupted by the Twelve Years’ Truce of 1609–1621. The Peace of Münster in 1648 recognised the independence of the Dutch Republic, while the southern provinces stayed under Spanish rule.: Nederländernas uppror mot Filip II av Spanien, som ur kalvinistisk bildstorm och hertigen av Albas förtryck växte till ett långt krig mellan Spanien och de nordliga provinserna, avbrutet av tolvåriga stilleståndet 1609–1621. Freden i Münster 1648 erkände Nederländska republikens självständighet, medan de sydliga provinserna förblev under spanskt styre.
