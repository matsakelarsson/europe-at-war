The Peace of Münster: Freden i Münster
The war is usually dated from the Battle of Heiligerlee on 23 May 1568 to the ratification of the Peace of Münster on 15 May 1648. It paused during the Twelve Years’ Truce of 1609–1621, and from 1621 it merged with the Thirty Years’ War and, from 1635, the Franco-Spanish War.: Kriget dateras vanligen från slaget vid Heiligerlee den 23 maj 1568 till ratificeringen av freden i Münster den 15 maj 1648. Det gjorde uppehåll under tolvåriga stilleståndet 1609–1621, och från 1621 flöt det samman med trettioåriga kriget och, från 1635, det fransk-spanska kriget.
Dates are New Style (Gregorian). The Spanish Netherlands, Holland and Zeeland adopted it in 1582–1583, but several northern provinces and England kept the Julian calendar, ten days behind, until 1700 or later.: Datum anges enligt den nya stilen (gregoriansk kalender). Spanska Nederländerna, Holland och Zeeland införde den 1582–1583, men flera nordliga provinser och England behöll den julianska kalendern, som låg tio dagar efter, till 1700 eller senare.
Places are named in the forms usual in English, with the Dutch name where it differs, such as Brill (Den Briel), Flushing (Vlissingen) and ’s-Hertogenbosch (Den Bosch). The “States General” was the assembly of the provinces’ delegates; the “States” of a province was its own assembly.: Orter anges i de former som är brukliga på svenska, med det nederländska namnet där det skiljer sig, som Brielle (Den Briel), Vlissingen och ’s-Hertogenbosch (Den Bosch). ”Generalstaterna” var församlingen av provinsernas ombud; en provins ”stater” var dess egen församling.
