Alba’s demand for a permanent sales tax, the Tenth Penny, turned even loyal towns against him. On 1 April 1572 the Sea Beggars, Calvinist privateers sailing under William’s commission who had just been expelled from English ports, seized the little port of Brill at the mouth of the Maas. Flushing rose within days, and over the summer most towns of Holland and Zeeland let the rebels in, often under pressure from armed Calvinist minorities. In July the States of Holland met at Dordrecht and recognised William as their stadtholder.: Albas krav på en permanent omsättningsskatt, tionde penningen, vände till och med lojala städer mot honom. Den 1 april 1572 intog sjögeuserna, kalvinistiska kapare som seglade med kaparbrev från Vilhelm och just hade utvisats från engelska hamnar, den lilla hamnstaden Brielle vid Maas mynning. Vlissingen reste sig inom några dagar, och under sommaren släppte de flesta städer i Holland och Zeeland in rebellerna, ofta under tryck från beväpnade kalvinistiska minoriteter. I juli sammanträdde Hollands stater i Dordrecht och erkände Vilhelm som sin ståthållare.
The rebels counted on France. Louis of Nassau surprised Mons in Hainaut on 24 May with Huguenot help, and William invaded Brabant from Germany. But the Massacre of St Bartholomew in Paris on 24 August killed the Huguenot leaders and any hope of French aid. Mons surrendered to Alba in September, and his son Don Fadrique marched north to punish the rebel towns. Mechelen was sacked in October, and many of the people of Zutphen and Naarden were massacred in November and December. William withdrew to Holland, resolved, he wrote, to make his grave there.: Rebellerna räknade med Frankrike. Ludvig av Nassau överrumplade Mons i Hainaut den 24 maj med hugenottisk hjälp, och Vilhelm invaderade Brabant från Tyskland. Men Bartolomeinatten i Paris den 24 augusti dödade hugenotternas ledare och allt hopp om fransk hjälp. Mons kapitulerade inför Alba i september, och hans son Don Fadrique tågade norrut för att straffa de upproriska städerna. Mechelen plundrades i oktober, och många av invånarna i Zutphen och Naarden massakrerades i november och december. Vilhelm drog sig tillbaka till Holland, fast besluten, skrev han, att göra det till sin grav.
