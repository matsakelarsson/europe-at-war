Union of Arras: Arrasunionen
6 January 1579: 6 januari 1579
The Walloon provinces of Artois and Hainaut and the town of Douai united to defend the Catholic faith; their peace with Philip followed in May.: De vallonska provinserna Artois och Hainaut och staden Douai enade sig för att försvara den katolska tron; deras fred med Filip följde i maj.
The northern provinces agreed to act together in war, taxation and foreign affairs “as if they were one province”. The union became the constitution of the Dutch Republic.: De nordliga provinserna enades om att handla gemensamt i fråga om krig, beskattning och utrikes angelägenheter ”som om de vore en provins”. Unionen blev Nederländska republikens författning.
Maastricht: Maastricht
March–June 1579: mars–juni 1579
Parma’s army stormed the city on 29 June after a four-month siege, and many of the inhabitants were killed in the sack.: Parmas här stormade staden den 29 juni efter en fyra månader lång belägring, och många av invånarna dödades under plundringen.
Meeting in The Hague, the States General declared that a prince who oppressed his subjects could be deposed, and renounced Philip II.: Generalstaterna, som sammanträdde i Haag, förklarade att en furste som förtryckte sina undersåtar kunde avsättas, och avsade sig Filip II.
Union of Utrecht, northern provinces (approximate): Utrechtunionen, nordliga provinser (ungefärligt)
