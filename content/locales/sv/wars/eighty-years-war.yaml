In February 1635 the Republic allied with France to conquer and divide the Spanish Netherlands. In May a French army beat the Spaniards at Les Avins and joined Frederick Henry, but their armies sacked Tienen and then failed before Leuven, and the people of the south rallied to the new governor, Philip IV’s brother, the Cardinal-Infante Ferdinand. Spanish troops even seized the Dutch fortress of Schenkenschans on the Rhine in July 1635; it took nine months to win back. Frederick Henry retook Breda in October 1637, but a Dutch attack on Antwerp ended in defeat at Kallo in June 1638.: I februari 1635 allierade sig republiken med Frankrike för att erövra och dela Spanska Nederländerna. I maj slog en fransk armé spanjorerna vid Les Avins och förenade sig med Fredrik Henrik, men deras arméer plundrade Tienen och misslyckades sedan inför Leuven, och folket i söder slöt upp kring den nye ståthållaren, Filip IV:s bror kardinalinfanten Ferdinand. Spanska trupper intog till och med den nederländska fästningen Schenkenschans vid Rhen i juli 1635; det tog nio månader att återta den. Fredrik Henrik återtog Breda i oktober 1637, men ett nederländskt anfall mot Antwerpen slutade med nederlag vid Kallo i juni 1638.
With French armies astride the Spanish Road through Alsace, Spain tried to reinforce Flanders by sea. In September 1639 a fleet under Antonio de Oquendo, about 50 warships and 30 transports carrying some 9,000 soldiers, was attacked in the Channel by Maarten Tromp and took shelter in the Downs off the Kent coast, in neutral English waters. Most of the troops were ferried to Dunkirk in small, fast ships, but on 21 October Tromp attacked with fireships. About ten Spanish ships were captured or destroyed and a dozen more ran aground. Spain never again sent a great fleet into the North Sea.: Med franska arméer över den spanska vägen genom Elsass försökte Spanien förstärka Flandern sjövägen. I september 1639 anfölls en flotta under Antonio de Oquendo, omkring 50 krigsfartyg och 30 transportfartyg med omkring 9 000 soldater ombord, i Engelska kanalen av Maarten Tromp och sökte skydd på Downs utanför Kents kust, i neutrala engelska farvatten. De flesta trupperna fördes över till Dunkerque i små, snabba fartyg, men den 21 oktober anföll Tromp med brandskepp. Omkring tio spanska fartyg erövrades eller förstördes och ytterligare ett dussin gick på grund. Spanien sände aldrig mer en stor flotta in i Nordsjön.
