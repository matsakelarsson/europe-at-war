Frederick Henry, who earned the name “taker of towns”, began with Groenlo in 1627. In September 1628 Piet Hein of the Dutch West India Company captured the Spanish silver fleet off Matanzas in Cuba, and the booty helped pay for the next campaign. In April 1629 Frederick Henry surrounded ’s-Hertogenbosch, a fortress city guarded by marshes, with miles of siege lines, and drained the water around it. A Spanish and imperial army struck into the Veluwe and took Amersfoort in August, but the Dutch surprised Wesel, its supply base, on 19 August, and ’s-Hertogenbosch surrendered on 14 September.: Fredrik Henrik, som fick namnet ”städernas erövrare”, började med Groenlo 1627. I september 1628 erövrade Piet Hein från Nederländska Västindiska kompaniet den spanska silverflottan utanför Matanzas på Kuba, och bytet bidrog till att bekosta nästa fälttåg. I april 1629 omgav Fredrik Henrik ’s-Hertogenbosch, en fästningsstad skyddad av träsk, med milslånga belägringslinjer och dränerade vattnet runt den. En spansk och kejserlig armé trängde in i Veluwe och tog Amersfoort i augusti, men nederländarna överrumplade Wesel, dess förrådsbas, den 19 augusti, och ’s-Hertogenbosch kapitulerade den 14 september.
In September 1631 a Spanish flotilla carrying troops to invade Zeeland was destroyed among the islands at the Slaak. The next summer Frederick Henry marched up the Maas, taking Venlo and Roermond and, on 22 August 1632, Maastricht, while nobles in the Spanish Netherlands plotted with him. The loyal provinces called their own States General and opened peace talks, which failed in 1633. Frederick Henry took Rheinberg that year, and the war in the north settled into a stalemate along the rivers.: I september 1631 förintades en spansk flottilj som förde trupper för att invadera Zeeland bland öarna vid Slaak. Följande sommar tågade Fredrik Henrik uppför Maas och tog Venlo och Roermond och, den 22 augusti 1632, Maastricht, medan adelsmän i Spanska Nederländerna konspirerade med honom. De lojala provinserna sammankallade sina egna generalstater och inledde fredsförhandlingar, som misslyckades 1633. Fredrik Henrik tog Rheinberg samma år, och kriget i norr övergick i ett dödläge längs floderna.
