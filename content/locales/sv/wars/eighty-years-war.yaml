With Spanish troops back from 1582, Parma took the rebel towns of Flanders and Brabant one by one, by siege, blockade and generous terms. The States had invited Francis, Duke of Anjou, brother of the French king, to be their sovereign, but his attempt to seize Antwerp by force, the “French Fury” of 17 January 1583, failed and discredited him. On 10 July 1584 William of Orange was shot dead in his house in Delft by Balthasar Gérard, a Catholic who hoped for the reward Philip had offered. Ypres, Bruges and Ghent fell to Parma in 1584, Brussels and Mechelen in 1585.: Med spanska trupper tillbaka från 1582 tog Parma de upproriska städerna i Flandern och Brabant en efter en, genom belägring, blockad och generösa villkor. Staterna hade inbjudit Frans, hertig av Anjou, den franske kungens bror, att bli deras suverän, men hans försök att ta Antwerpen med våld, ”det franska raseriet” den 17 januari 1583, misslyckades och misskrediterade honom. Den 10 juli 1584 sköts Vilhelm av Oranien till döds i sitt hus i Delft av Balthasar Gérard, en katolik som hoppades på den belöning Filip hade utlovat. Ypern, Brygge och Gent föll för Parma 1584, Bryssel och Mechelen 1585.
Parma cut Antwerp off from the sea with a fortified bridge of boats across the Scheldt. In April 1585 the defenders sent fireships packed with explosives, the “hellburners”, against it, killing hundreds of soldiers, but the bridge was repaired, and the city surrendered on 17 August. Protestants were given four years to leave, and of about 100,000 inhabitants only some 40,000 remained; many merchants and craftsmen moved north to Amsterdam and Middelburg. Alarmed, Elizabeth I of England agreed in the Treaty of Nonsuch to send several thousand soldiers under the Earl of Leicester, bringing England openly into the war with Spain.: Parma skar av Antwerpen från havet med en befäst båtbro över Schelde. I april 1585 sände försvararna brandskepp fyllda med sprängämnen, ”helvetesbrännarna”, mot den och dödade hundratals soldater, men bron reparerades, och staden kapitulerade den 17 augusti. Protestanterna fick fyra år på sig att lämna staden, och av omkring 100 000 invånare stannade bara omkring 40 000 kvar; många köpmän och hantverkare flyttade norrut till Amsterdam och Middelburg. Oroad gick Elisabet I av England genom fördraget i Nonsuch med på att sända flera tusen soldater under earlen av Leicester, vilket öppet förde in England i kriget mot Spanien.
