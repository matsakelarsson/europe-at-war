Oquendo: Oquendo
In 1640 Catalonia and Portugal rose against Philip IV, and Spain, fighting France on several fronts, could no longer hope to win in the Netherlands. The Dutch were tiring of the war too. Frederick Henry took Sas van Gent in 1644 and Hulst in 1645, winning the strip of Flanders south of the Scheldt, but Holland’s merchants now feared a powerful France more than a weakened Spain. Peace talks opened at Münster in Westphalia, beside the congress that was ending the Thirty Years’ War, and the Dutch envoys made peace without waiting for France.: År 1640 reste sig Katalonien och Portugal mot Filip IV, och Spanien, som bekämpade Frankrike på flera fronter, kunde inte längre hoppas på seger i Nederländerna. Även nederländarna började tröttna på kriget. Fredrik Henrik tog Sas van Gent 1644 och Hulst 1645 och vann därmed den del av Flandern som ligger söder om Schelde, men Hollands köpmän fruktade nu ett mäktigt Frankrike mer än ett försvagat Spanien. Fredsförhandlingar inleddes i Münster i Westfalen, vid sidan av den kongress som avslutade trettioåriga kriget, och de nederländska sändebuden slöt fred utan att invänta Frankrike.
The treaty was signed on 30 January 1648 and sworn in Münster’s town hall on 15 May. Spain recognised the seven United Provinces as free and sovereign states. The Republic kept the lands it had conquered in Brabant, Flanders and around Maastricht, ruled directly by the States General as the Generality Lands. The Scheldt stayed closed to shipping, to Amsterdam’s benefit and Antwerp’s cost, and the Dutch kept their conquests in Asia and the Americas. Frederick Henry, who had died in March 1647, did not see the peace.: Fördraget undertecknades den 30 januari 1648 och besvors i Münsters rådhus den 15 maj. Spanien erkände de sju förenade provinserna som fria och suveräna stater. Republiken behöll de landområden den hade erövrat i Brabant, Flandern och kring Maastricht, som styrdes direkt av generalstaterna som Generalitetsländerna. Schelde förblev stängd för sjöfart, till Amsterdams fördel och Antwerpens nackdel, och nederländarna behöll sina erövringar i Asien och Amerika. Fredrik Henrik, som hade dött i mars 1647, fick inte uppleva freden.
