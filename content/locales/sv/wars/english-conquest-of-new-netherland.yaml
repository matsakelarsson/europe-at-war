English conquest of New Netherland: Den engelska erövringen av Nya Nederländerna
? The English seizure of the Dutch colony of New Netherland in 1664, its brief Dutch recapture in 1673–1674 and its final return to England. In March 1664 Charles II granted the land between the Connecticut and the Delaware to his brother James, Duke of York, and sent four ships with some 450 men under Richard Nicolls, though England and the Dutch Republic were at peace. Outnumbered, short of powder and pressed by the townspeople, Peter Stuyvesant surrendered New Amsterdam without a fight on 8 September 1664; it became New York, Fort Orange became Albany, and in October Sir Robert Carr took New Amstel on the Delaware by storm. The seizure was one of the causes of the Second Anglo-Dutch War, and at the Peace of Breda in 1667 the Dutch let England keep the colony while they kept Suriname. In the Third Anglo-Dutch War a Dutch squadron under Cornelis Evertsen the Youngest and Jacob Binckes retook New York on 9 August 1673 and renamed it New Orange, but the Treaty of Westminster gave it back, and the Dutch governor Anthony Colve handed it over to Edmund Andros on 10 November 1674. The Dutch colonists kept their property, religion and inheritance customs under the English.
: Englands erövring av den nederländska kolonin Nya Nederländerna 1664, nederländarnas kortvariga återerövring 1673–1674 och koloniens slutliga återlämnande till England. I mars 1664 förlänade Karl II landet mellan Connecticut och Delaware åt sin bror Jakob, hertig av York, och sände fyra skepp med omkring 450 man under Richard Nicolls, trots att England och Nederländska republiken levde i fred. Underlägsen i antal, med brist på krut och pressad av stadsborna överlämnade Peter Stuyvesant Nya Amsterdam utan strid den 8 september 1664; staden blev New York, Fort Orange blev Albany, och i oktober stormade Sir Robert Carr Nya Amstel vid Delawarefloden. Erövringen var en av orsakerna till det andra engelsk-nederländska kriget, och vid freden i Breda 1667 lät nederländarna England behålla kolonin medan de själva behöll Surinam. Under det tredje engelsk-nederländska kriget återtog en nederländsk eskader under Cornelis Evertsen den yngste och Jacob Binckes New York den 9 augusti 1673 och döpte om staden till Nya Oranien, men freden i Westminster gav tillbaka den, och den nederländske guvernören Anthony Colve överlämnade den till Edmund Andros den 10 november 1674. De nederländska kolonisterna behöll under engelskt styre sin egendom, sin religion och sina arvsseder.
