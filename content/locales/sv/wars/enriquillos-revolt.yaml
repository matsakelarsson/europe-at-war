# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
Enriquillo’s revolt: Enriquillos uppror
? The war of the Taíno cacique Enriquillo against the Spanish colony of Hispaniola, fought from the Bahoruco mountains in the south-west of the island from 1519 to 1533. Enriquillo, whom most historians identify with Guarocuya, a nephew of Anacaona of Xaraguá, had been raised by Franciscan friars and was held in encomienda near San Juan de la Maguana; when his encomendero Andrés de Valenzuela took his mare and abused his wife Mencía, and the colony’s courts gave him no redress, he led his people into the mountains. For fourteen years the rebels, joined by other Taíno and by Africans who had escaped slavery, beat off expedition after expedition and raided the settlements, at a cost to the colony of tens of thousands of gold pesos, while enslaved Wolof Africans rose on Diego Colón’s sugar estate in 1521 in the first recorded African revolt in the Americas. In 1533 Charles V sent Francisco de Barrionuevo with a royal letter, and Enriquillo agreed to a peace that gave his people freedom, a pardon and land of their own, in return for submission to the Crown and help in catching runaways. He died in 1535. Enriquillo is a national hero of the Dominican Republic, and the lake below the Bahoruco bears his name.
: Taínokaziken Enriquillos krig mot den spanska kolonin Hispaniola, fört från Bahorucobergen i öns sydvästra del 1519–1533. Enriquillo, som de flesta historiker identifierar med Guarocuya, en nevö till Anacaona av Xaraguá, hade uppfostrats av franciskanermunkar och hölls i encomienda nära San Juan de la Maguana; när hans encomendero Andrés de Valenzuela tog hans sto och förgrep sig på hans hustru Mencía, och kolonins domstolar inte gav honom upprättelse, ledde han sitt folk upp i bergen. I fjorton år slog rebellerna, till vilka andra taíno och afrikaner som hade flytt från slaveriet anslöt sig, tillbaka den ena expeditionen efter den andra och gjorde räder mot bosättningarna, vilket kostade kolonin tiotusentals guldpesos, samtidigt som förslavade afrikanska wolofer reste sig på Diego Colóns sockerplantage 1521 i det första dokumenterade afrikanska upproret i Amerika. År 1533 sände Karl V Francisco de Barrionuevo med ett kungligt brev, och Enriquillo gick med på en fred som gav hans folk frihet, amnesti och egen jord, i utbyte mot underkastelse under kronan och hjälp med att fånga rymlingar. Han dog 1535. Enriquillo är nationalhjälte i Dominikanska republiken, och sjön nedanför Bahoruco bär hans namn.
