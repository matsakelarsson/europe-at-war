Epirote–Bulgarian war: Epirotisk-bulgariska kriget
A short war in which Theodore Komnenos Doukas, ruler of Epirus and emperor at Thessalonica, broke his alliance with Tsar Ivan Asen II of Bulgaria and invaded Bulgaria in 1230, intending to go on to take Constantinople. At Klokotnitsa, near Haskovo, Asen routed his army on 9 March 1230 and took him prisoner. Bulgaria then occupied most of Thrace, Macedonia and Albania, becoming the leading power in the Balkans, and Theodore’s empire was reduced to Thessalonica, Thessaly and Epirus under his brother Manuel.: Ett kort krig där Theodoros Komnenos Doukas, härskare över Epirus och kejsare i Thessalonike, bröt sin allians med tsar Ivan Asen II av Bulgarien och invaderade Bulgarien 1230 i avsikt att sedan inta Konstantinopel. Vid Klokotnitsa nära Chaskovo krossade Asen hans här den 9 mars 1230 och tog honom till fånga. Bulgarien ockuperade därefter större delen av Thrakien, Makedonien och Albanien och blev den ledande makten på Balkan, och Theodoros rike krympte till Thessalonike, Thessalien och Epirus under hans bror Manuel.
