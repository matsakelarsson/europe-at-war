Asen treated his prisoners well and freed the common soldiers, which helped him win over the towns of Theodore’s lands. Theodore was later blinded after plotting against Asen; he was released in 1237 when Asen married his daughter.: Asen behandlade sina fångar väl och frigav de menige soldaterna, vilket hjälpte honom att vinna över städerna i Theodoros land. Theodoros bländades senare sedan han konspirerat mot Asen; han frigavs 1237 när Asen gifte sig med hans dotter.
