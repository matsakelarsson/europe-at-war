# Svenska översättningar av katalogtexten (våg 12); stegtexterna kommer senare.
Eritrean–Ethiopian War: Eritreansk-etiopiska kriget
? A border war between Eritrea and Ethiopia, whose ruling fronts, the EPLF and the TPLF, had fought together against the Derg until 1991. Disputes over trade, Eritrea’s new currency and the unmarked colonial border came to a head in May 1998 when fighting broke out at Badme, a small town administered by Ethiopia and claimed by Eritrea, and Eritrean forces occupied it. The war was fought in trenches along three fronts, with mass infantry assaults, tanks, artillery and aircraft on both sides; tens of thousands of soldiers were killed, and each country expelled tens of thousands of the other’s nationals. Ethiopia retook Badme in Operation Sunset in February 1999, and in May 2000 its offensive broke the western front and occupied a strip of western and southern Eritrea. A ceasefire was signed on 18 June 2000 and a peace agreement in Algiers on 12 December 2000. The boundary commission set up by the agreement awarded Badme to Eritrea in 2002, but Ethiopia would not withdraw, and the two countries stayed in a state of “no war, no peace” until Prime Minister Abiy Ahmed accepted the ruling in 2018. Estimates of the dead range from about 70,000 to 100,000, and some go far higher.
: Ett gränskrig mellan Eritrea och Etiopien, vars styrande fronter, EPLF och TPLF, hade kämpat tillsammans mot Derg fram till 1991. Tvister om handel, Eritreas nya valuta och den outmärkta kolonialgränsen ställdes på sin spets i maj 1998, när strider bröt ut vid Badme, en liten stad som förvaltades av Etiopien och som Eritrea gjorde anspråk på, och eritreanska styrkor ockuperade den. Kriget utkämpades i skyttegravar längs tre fronter, med massiva infanterianfall, stridsvagnar, artilleri och flyg på båda sidor; tiotusentals soldater dödades, och vardera landet utvisade tiotusentals av det andra landets medborgare. Etiopien återtog Badme i Operation Sunset i februari 1999, och i maj 2000 bröt landets offensiv igenom den västra fronten och ockuperade en remsa av västra och södra Eritrea. Ett eldupphör undertecknades den 18 juni 2000 och ett fredsavtal i Alger den 12 december 2000. Den gränskommission som avtalet inrättade tilldömde Eritrea Badme 2002, men Etiopien vägrade dra sig tillbaka, och de två länderna förblev i ett tillstånd av ”varken krig eller fred” tills premiärminister Abiy Ahmed godtog avgörandet 2018. Uppskattningarna av antalet döda varierar från omkring 70 000 till 100 000, och vissa ligger betydligt högre.
