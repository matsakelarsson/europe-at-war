# Svenska översättningar av katalogtexten (våg 12); stegtexterna kommer senare.
Eritrean War of Independence: Eritreanska självständighetskriget
? "Thirty years of war in which Eritrean fronts fought for independence from Ethiopia. The former Italian colony was federated with Ethiopia by the United Nations in 1952; as Emperor Haile Selassie dismantled its autonomy, the Eritrean Liberation Front (ELF), founded in Cairo in 1960, began an armed struggle on 1 September 1961, and in 1962 Ethiopia annexed Eritrea as a province. Ethiopian counter-insurgency, with massacres of villagers, swelled the fronts, which split in the early 1970s: the Eritrean People’s Liberation Front (EPLF) of Isaias Afwerki broke away and the two fought each other. After the revolution of 1974 the military government, the Derg, lost almost all of Eritrea to the fronts by 1977, then won most of it back in 1978 with Soviet arms. The EPLF held its mountain base around Nakfa through repeated offensives, drove the ELF out in 1981 and from 1988, after its victory at Afabet, went over to the attack. It took Massawa in 1990 and entered Asmara on 24 May 1991, as the Derg fell to the EPLF’s Tigrayan allies; Eritrea became independent after a referendum in April 1993. Estimates of the dead range widely: some 65,000–70,000 Eritrean fighters, tens of thousands of Ethiopian soldiers and between 90,000 and 280,000 civilians."
: "Trettio år av krig, där eritreanska fronter kämpade för självständighet från Etiopien. Den forna italienska kolonin hade 1952 genom FN:s beslut förenats med Etiopien i en federation; när kejsar Haile Selassie monterade ned dess självstyre inledde Eritreanska befrielsefronten (ELF), grundad i Kairo 1960, en väpnad kamp den 1 september 1961, och 1962 annekterade Etiopien Eritrea som provins. Den etiopiska upprorsbekämpningen, med massakrer på bybor, fick fronterna att växa, och i början av 1970-talet splittrades de: Isaias Afwerkis Eritreanska folkets befrielsefront (EPLF) bröt sig ur, och de två bekämpade varandra. Efter revolutionen 1974 hade militärregeringen, Derg, 1977 förlorat nästan hela Eritrea till fronterna, men den vann tillbaka större delen 1978 med sovjetiska vapen. EPLF höll sin bergsbas kring Nakfa genom upprepade offensiver, drev ut ELF 1981 och gick från 1988, efter sin seger vid Afabet, över till anfall. Fronten intog Massawa 1990 och tågade in i Asmara den 24 maj 1991, samtidigt som Derg föll för EPLF:s tigrayanska allierade; Eritrea blev självständigt efter en folkomröstning i april 1993. Uppskattningarna av antalet döda varierar kraftigt: omkring 65 000–70 000 eritreanska kämpar, tiotusentals etiopiska soldater och mellan 90 000 och 280 000 civila."
