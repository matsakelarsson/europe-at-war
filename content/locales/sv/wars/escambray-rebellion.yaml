# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
Escambray rebellion: Escambrayupproret
? "The guerrilla war against Fidel Castro’s government in the Escambray Mountains of central Cuba, which the government called the struggle against bandits (Lucha Contra Bandidos). Within months of the revolution of January 1959, former fighters of the Second National Front of the Escambray, which had fought Batista in the same mountains, former soldiers of Batista’s army, anti-communist students and local peasants (guajiros) took up arms against the new government’s turn towards communism and its land reform. Among their leaders were Plinio Prieto, Evelio Duque, Osvaldo Ramírez, Tomás San Gil and Julio Emilio Carretero; William Alexander Morgan, an American comandante of the Second Front, was executed in March 1961 for helping them. The CIA supplied some bands with arms and money in 1960–1961, but its support faded after the Bay of Pigs. The government answered with tens of thousands of militiamen and soldiers, who swept the mountains in tightening rings of encirclement, the largest in the winter of 1960–1961, and from July 1962 with special counter-insurgency units of the Lucha Contra Bandidos under Raúl Menéndez Tomassevich; it also moved peasant families suspected of helping the rebels out of the mountains, many of them to new settlements in Pinar del Río. Ramírez was killed in April 1962 and San Gil in 1963, and smaller bands fought in Matanzas, Pinar del Río, Camagüey and Oriente. The last bands were wiped out in 1965. Estimates of the insurgents range from about 2,000 to 4,000 at different times, in some 170–180 bands, with several thousand collaborators. Figures for the dead vary widely: Raúl Castro put the government’s losses at about 500 in 1970, and estimates of all deaths range from about 1,000 to 7,000."
: "Gerillakriget mot Fidel Castros regering i Escambraybergen på centrala Kuba, som regeringen kallade kampen mot banditerna (Lucha Contra Bandidos). Inom några månader efter revolutionen i januari 1959 grep före detta kämpar från Escambrays andra nationella front, som hade bekämpat Batista i samma berg, före detta soldater ur Batistas armé, antikommunistiska studenter och lokala bönder (guajiros) till vapen mot den nya regeringens vändning mot kommunismen och mot dess jordreform. Bland deras ledare fanns Plinio Prieto, Evelio Duque, Osvaldo Ramírez, Tomás San Gil och Julio Emilio Carretero; William Alexander Morgan, en amerikansk comandante i Andra fronten, avrättades i mars 1961 för att ha hjälpt dem. CIA försåg vissa band med vapen och pengar 1960–1961, men stödet avtog efter invasionen i Grisbukten. Regeringen svarade med tiotusentals milismän och soldater, som genomsökte bergen i allt snävare inringningar, den största vintern 1960–1961, och från juli 1962 med särskilda förband för upprorsbekämpning inom Lucha Contra Bandidos under Raúl Menéndez Tomassevich; den flyttade också bondefamiljer som misstänktes hjälpa rebellerna ut ur bergen, många av dem till nya bosättningar i Pinar del Río. Ramírez dödades i april 1962 och San Gil 1963, och mindre band stred i Matanzas, Pinar del Río, Camagüey och Oriente. De sista banden utplånades 1965. Uppskattningarna av antalet upprorsmän varierar från omkring 2 000 till 4 000 vid olika tidpunkter, i omkring 170–180 band, med flera tusen medhjälpare. Uppgifterna om antalet döda varierar kraftigt: Raúl Castro angav 1970 regeringens förluster till omkring 500, och uppskattningarna av samtliga döda varierar från omkring 1 000 till 7 000."
