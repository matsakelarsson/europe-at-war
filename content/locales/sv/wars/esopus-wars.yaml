# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
Esopus Wars: Esopuskrigen
? Two wars between New Netherland and the Esopus, a Munsee-speaking Lenape people of the mid-Hudson valley around what is now Kingston, New York, over the spread of Dutch farms onto their cornlands. They followed the Peach War of September 1655, when some five hundred Munsee entered New Amsterdam and, after fighting broke out, raided Pavonia and Staten Island, killing some forty colonists and taking about a hundred captive; afterwards Director Peter Stuyvesant made the scattered colonists gather in stockaded villages, among them Wiltwijck at Esopus in 1658. The first war began on 20 September 1659, when colonists fired on a group of Esopus men who had been drinking brandy given to them as wages. The Esopus burned farms and besieged Wiltwijck for weeks; the Dutch burned Esopus fields and stores, and Stuyvesant sent some captured Esopus men as slaves to Curaçao. Peace on 15 July 1660 cost the Esopus land. On 7 June 1663, angered by the land losses and the enslaved captives, Esopus warriors entered Wiltwijck as if to trade, set it on fire and destroyed the new village of Nieuw Dorp (Hurley), killing some twenty colonists and taking about forty-five captive, mostly women and children. Dutch soldiers and militia under Captain Martin Cregier, guided by Mohawk and Wappinger allies, burned the Esopus fields and in September 1663 stormed their new fort near the Shawangunk Mountains, killing the sachem Papequanaehen and freeing many of the captives. A peace in May 1664 ceded more land; under English rule the Esopus sold the rest of their lands over the following decades and many moved away.
: Två krig mellan Nya Nederländerna och esopus, ett munseetalande lenapefolk i mellersta Hudsondalen kring nuvarande Kingston i delstaten New York, om de nederländska gårdarnas utbredning över deras majsfält. De följde på persikokriget i september 1655, då omkring femhundra munsee tågade in i Nya Amsterdam och, sedan strider hade brutit ut, gjorde räder mot Pavonia och Staten Island, dödade ett fyrtiotal kolonister och tog omkring hundra till fånga; därefter lät direktören Peter Stuyvesant de spridda kolonisterna samlas i byar omgärdade av palissader, bland dem Wiltwijck vid Esopus 1658. Det första kriget började den 20 september 1659, när kolonister öppnade eld mot en grupp esopusmän som hade druckit brännvin som de fått som lön. Esopus brände gårdar och belägrade Wiltwijck i flera veckor; nederländarna brände esopusfolkets fält och förråd, och Stuyvesant sände några tillfångatagna esopusmän som slavar till Curaçao. Freden den 15 juli 1660 kostade esopus land. Den 7 juni 1663 tog sig esopuskrigare, förbittrade över landförlusterna och de förslavade fångarna, in i Wiltwijck som för att handla, satte eld på byn och förstörde den nya byn Nieuw Dorp (Hurley), dödade ett tjugotal kolonister och tog omkring fyrtiofem till fånga, mest kvinnor och barn. Nederländska soldater och milis under kapten Martin Cregier, vägledda av allierade mohawker och wappinger, brände esopusfolkets fält och stormade i september 1663 deras nya fort nära Shawangunkbergen, där de dödade sachem Papequanaehen och befriade många av fångarna. En fred i maj 1664 kostade ytterligare land; under engelskt styre sålde esopus resten av sina landområden under de följande årtiondena, och många flyttade bort.
