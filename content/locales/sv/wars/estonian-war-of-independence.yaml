In the spring the Red Army attacked again along the Narva river and in the south-east, and Narva was heavily shelled, but the Estonian lines held. On 13 May the White Russian Northern Corps, based in Estonia and under Estonian command, went on the offensive along the Gulf of Finland, and Estonian forces took Pskov on 25 May. Estonian divisions also advanced into northern Latvia as the Red Army withdrew. There they met a new enemy, the Baltische Landeswehr of Baltic Germans and the German Iron Division under General Rüdiger von der Goltz, which had taken Riga on 22 May and was pushing north.: På våren anföll Röda armén på nytt längs Narvafloden och i sydost, och Narva besköts kraftigt, men de estniska linjerna höll. Den 13 maj gick den vitryska Nordkåren, som var baserad i Estland och stod under estniskt befäl, till offensiv längs Finska viken, och estniska styrkor tog Pskov den 25 maj. Estniska divisioner ryckte också fram i norra Lettland i takt med att Röda armén drog sig tillbaka. Där mötte de en ny fiende, Baltische Landeswehr bestående av balttyskar och den tyska Järndivisionen under general Rüdiger von der Goltz, som hade tagit Riga den 22 maj och trängde norrut.
The Germans attacked Estonian armoured trains on 5 June and took Cēsis the next day. After a short truce, the Iron Division and the Landeswehr attacked the Estonian 3rd Division and the North Latvian Brigade near Cēsis on 19 June. On 23 June the Estonians and Latvians counter-attacked, took Cēsis and drove the Germans back towards Riga; the day is Estonia’s Victory Day. On 3 July, with Estonian troops on the outskirts of Riga, an armistice was signed at Strazdumuiža under Allied pressure, and Kārlis Ulmanis’s Latvian government returned to Riga a few days later.: Tyskarna anföll estniska pansartåg den 5 juni och tog Cēsis dagen därpå. Efter ett kort stillestånd anföll Järndivisionen och Landeswehr den estniska 3:e divisionen och den nordlettiska brigaden nära Cēsis den 19 juni. Den 23 juni gick esterna och letterna till motanfall, tog Cēsis och drev tyskarna tillbaka mot Riga; dagen är Estlands segerdag. Den 3 juli, med estniska trupper i Rigas utkanter, undertecknades ett vapenstillestånd i Strazdumuiža under tryck från ententen, och Kārlis Ulmanis lettiska regering återvände till Riga några dagar senare.
