Estonian War of Independence: Estniska frihetskriget
A war in which the newly proclaimed Republic of Estonia, helped by Finnish volunteers and the British navy, drove out the Red Army in 1918–1919 and defeated the Baltic German Landeswehr in northern Latvia. It ended with the Treaty of Tartu of 2 February 1920, in which Soviet Russia recognised Estonia’s independence in perpetuity.: Ett krig där den nyutropade Republiken Estland, med hjälp av finländska frivilliga och den brittiska flottan, drev ut Röda armén 1918–1919 och besegrade den balttyska Landeswehr i norra Lettland. Det avslutades med freden i Tartu den 2 februari 1920, där Sovjetryssland för all framtid erkände Estlands självständighet.
