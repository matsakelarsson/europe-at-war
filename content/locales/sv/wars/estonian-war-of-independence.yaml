In October 1919 Nikolai Yudenich’s Northwestern Army advanced from Estonia on Petrograd, while Estonian forces attacked the coastal fort of Krasnaya Gorka, but the Whites were beaten back in November and fled to the Estonian border, where they were disarmed and interned; thousands of soldiers and refugees died of typhus that winter. Soviet Russia had offered Estonia peace talks. As they went on in Tartu, the Red 7th and 15th Armies attacked the fortified lines at Narva through November and December, and on 16 December some units crossed the river, but the Estonian defence held.: I oktober 1919 ryckte Nikolaj Judenitjs Nordvästarmé fram från Estland mot Petrograd, medan estniska styrkor anföll kustfortet Krasnaja Gorka, men de vita slogs tillbaka i november och flydde till den estniska gränsen, där de avväpnades och internerades; tusentals soldater och flyktingar dog i tyfus den vintern. Sovjetryssland hade erbjudit Estland fredsförhandlingar. Medan de pågick i Tartu anföll de röda 7:e och 15:e arméerna de befästa linjerna vid Narva under hela november och december, och den 16 december tog sig några förband över floden, men det estniska försvaret höll.
A ceasefire came into force on 3 January 1920, and on 2 February the Treaty of Tartu was signed. Soviet Russia recognised Estonia’s independence, renounced all claims to its territory in perpetuity and agreed to pay 15 million gold roubles from the old empire’s reserves. Estonia kept a strip east of the Narva river and the Petseri district in the south-east, both with many Russian or Setu inhabitants. About 3,600 Estonian soldiers had been killed. A land reform passed during the war broke up the estates of the Baltic German nobility, and much of the land went to veterans.: Ett eldupphör trädde i kraft den 3 januari 1920, och den 2 februari undertecknades freden i Tartu. Sovjetryssland erkände Estlands självständighet, avsade sig för all framtid alla anspråk på dess territorium och gick med på att betala 15 miljoner guldrubel ur det gamla imperiets reserver. Estland behöll en remsa öster om Narvafloden och Petseridistriktet i sydost, båda med många ryska eller setukesiska invånare. Omkring 3 600 estniska soldater hade stupat. En jordreform som genomfördes under kriget styckade den balttyska adelns gods, och mycket av jorden gick till veteraner.
