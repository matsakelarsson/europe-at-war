Estonia had declared independence on 24 February 1918, a day before German troops entered Tallinn, and its Provisional Government took over only as the Germans began to leave in November. On 28 November the Red Army attacked Narva, where Estonian Bolsheviks proclaimed the Estonian Workers’ Commune. Soviet forces, many of them Latvian Riflemen, took Valga and Tartu at Christmas and by early January stood about 34 km from Tallinn. The new Estonian army, short of men and weapons, relied on volunteers, armoured trains and outside help. A British squadron reached Tallinn on 31 December with rifles and guns, and Finnish volunteers arrived from early January.: Estland hade förklarat sig självständigt den 24 februari 1918, en dag innan tyska trupper gick in i Tallinn, och dess provisoriska regering tog över först när tyskarna började lämna landet i november. Den 28 november anföll Röda armén Narva, där estniska bolsjeviker utropade Estlands arbetande folks kommun. Sovjetiska styrkor, många av dem lettiska skyttar, tog Valga och Tartu vid jul och stod i början av januari omkring 34 km från Tallinn. Den nya estniska armén, som saknade både manskap och vapen, förlitade sig på frivilliga, pansartåg och hjälp utifrån. En brittisk eskader nådde Tallinn den 31 december med gevär och kanoner, och finländska frivilliga anlände från början av januari.
Under Colonel Johan Laidoner, the Estonians counter-attacked on 7 January 1919. Armoured trains and partisan units retook Tartu on 14 January, and Narva fell on 18 January after Estonian and Finnish troops landed behind the Soviet lines at Utria. At Paju near Valga on 31 January, Julius Kuperjanov’s partisans and Finnish volunteers drove back the Red Latvian Riflemen in a hard fight in which Kuperjanov was mortally wounded. By late February the Red Army had been pushed out of almost all of Estonia, and the front settled along the Narva river and the south-eastern border.: Under överste Johan Laidoner gick esterna till motanfall den 7 januari 1919. Pansartåg och partisanförband återtog Tartu den 14 januari, och Narva föll den 18 januari sedan estniska och finländska trupper landstigit bakom de sovjetiska linjerna vid Utria. Vid Paju nära Valga den 31 januari drev Julius Kuperjanovs partisaner och finländska frivilliga tillbaka de röda lettiska skyttarna i en hård strid där Kuperjanov blev dödligt sårad. I slutet av februari hade Röda armén trängts ut ur nästan hela Estland, och fronten stabiliserades längs Narvafloden och den sydöstra gränsen.
