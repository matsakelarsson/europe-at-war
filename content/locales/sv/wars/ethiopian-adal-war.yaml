# Svenska översättningar av katalogtexten (våg 12); stegtexterna kommer senare.
Ethiopian–Adal War: Kriget mellan Etiopien och Adal
? The conquest of most of the Christian Ethiopian highlands by the sultanate of Adal under Imam Ahmad ibn Ibrahim al-Ghazi, and their recovery with Portuguese help. Ahmad, a commander who had taken power in Adal from its sultans and made Harar his base, refused tribute to the emperor and declared a jihad. His army of Harari, Somali, Afar and Harla fighters, with matchlocks and a few cannon, defeated Emperor Lebna Dengel at Shimbra Kure in 1529 and at Antukyah and Amba Sel in 1531, and in the next years overran Dawaro, Shewa, Amhara, Lasta and much of Tigray, burning churches and monasteries, taking captives and converting many Christians. Lebna Dengel died a fugitive in 1540. In 1541 a Portuguese fleet landed about 400 musketeers under Cristóvão da Gama at Massawa; they won at Baçente and Jarte in 1542 but were overwhelmed at Wofla, where da Gama was captured and killed, after Ahmad had received Ottoman musketeers from Yemen. The survivors joined the new emperor Gelawdewos, and at Wayna Daga near Lake Tana on 21 February 1543 Ahmad was shot and killed and his army broke up. The war exhausted both states and opened the way for the Oromo expansion.
: Adalsultanatets erövring under imam Ahmad ibn Ibrahim al-Ghazi av större delen av det kristna etiopiska höglandet, och höglandets återerövring med portugisisk hjälp. Ahmad, en befälhavare som hade tagit makten i Adal från dess sultaner och gjort Harar till sin bas, vägrade betala tribut till kejsaren och utlyste jihad. Hans armé av harari-, somali-, afar- och harlakrigare, med luntlåsgevär och några kanoner, besegrade kejsar Lebna Dengel vid Shimbra Kure 1529 och vid Antukyah och Amba Sel 1531, och under de följande åren överskred den Dawaro, Shewa, Amhara, Lasta och stora delar av Tigray, brände kyrkor och kloster, tog fångar och omvände många kristna. Lebna Dengel dog på flykt 1540. År 1541 landsatte en portugisisk flotta omkring 400 musketörer under Cristóvão da Gama vid Massawa; de segrade vid Baçente och Jarte 1542 men överväldigades vid Wofla, där da Gama tillfångatogs och dödades, sedan Ahmad hade fått osmanska musketörer från Jemen. De överlevande anslöt sig till den nye kejsaren Gelawdewos, och vid Wayna Daga nära Tanasjön sköts Ahmad ihjäl den 21 februari 1543, varpå hans armé upplöstes. Kriget utmattade båda staterna och öppnade vägen för oromoexpansionen.
