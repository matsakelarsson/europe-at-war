# Svenska översättningar av katalogtexten (våg 12); stegtexterna kommer senare.
Ethiopian wars with Ifat and Adal (1415–1445): Etiopiens krig mot Ifat och Adal (1415–1445)
Wars between the Solomonic emperors of Ethiopia and the Walashma sultans, first of Ifat and then of Adal, in the first half of the 15th century. Sa’ad ad-Din II, the last great sultan of Ifat, was besieged and killed at Zeila by an Ethiopian army, in 1403 under Dawit I according to al-Maqrizi, or in 1415 under Yeshaq according to a Walashma chronicle, and Ifat was overrun. His sons fled to the Rasulid court in Yemen, returned, and rebuilt their state farther east as the sultanate of Adal, from which they raided the Christian provinces for decades. Emperor Yeshaq (r. 1414–1429/1430) fought them for most of his reign and may have died in battle against Jamal ad-Din II. The wars ended for a generation when Zara Yaqob defeated and killed Sultan Badlay at Gomit in Dawaro on 25 December 1445.: Krig mellan Etiopiens salomoniska kejsare och walashmasultanerna, först i Ifat och sedan i Adal, under första hälften av 1400-talet. Sa’ad ad-Din II, Ifats siste store sultan, belägrades och dödades i Zeila av en etiopisk armé, antingen 1403 under Dawit I, enligt al-Maqrizi, eller 1415 under Yeshaq, enligt en walashmakrönika, och Ifat överskreds. Hans söner flydde till rasulidernas hov i Jemen, återvände och byggde upp sin stat på nytt längre österut som Adalsultanatet, varifrån de i årtionden gjorde räder mot de kristna provinserna. Kejsar Yeshaq (reg. 1414–1429/1430) bekämpade dem under större delen av sin regeringstid och kan ha stupat i strid mot Jamal ad-Din II. Krigen upphörde för en generation när Zara Yaqob besegrade och dödade sultan Badlay vid Gomit i Dawaro den 25 december 1445.
