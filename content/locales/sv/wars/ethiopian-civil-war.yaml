# Svenska översättningar av katalogtexten (våg 12); stegtexterna kommer senare.
Ethiopian Civil War: Etiopiska inbördeskriget
? "The seventeen years of war that followed the overthrow of Emperor Haile Selassie by the Derg, a committee of army officers and soldiers, in September 1974. Under Mengistu Haile Mariam the Derg declared Ethiopia a Marxist–Leninist state, nationalised the land, and fought a long list of opponents with Soviet and Cuban support: the Eritrean fronts, the Tigray People’s Liberation Front (TPLF), the Oromo Liberation Front, the Western Somali Liberation Front and Somalia, the monarchist Ethiopian Democratic Union, and in the cities the Ethiopian People’s Revolutionary Party, which it crushed in the Red Terror of 1976–1978. The famine of 1983–1985, worsened by war and by the government’s counterinsurgency, killed some 400,000 to a million people. From 1988 the rebels gained the upper hand: the Eritrean People’s Liberation Front destroyed a Derg army at Afabet, the TPLF drove the government out of Tigray after the battle of Shire in 1989, and the TPLF-led Ethiopian People’s Revolutionary Democratic Front (EPRDF) advanced on Addis Ababa. Mengistu fled on 21 May 1991, the EPLF took Asmara on 24 May and the EPRDF entered the capital on 28 May. At least 1.4 million people died in the war and the famines, and Eritrea became independent in 1993."
: "De sjutton år av krig som följde på att Derg, en kommitté av arméofficerare och soldater, störtade kejsar Haile Selassie i september 1974. Under Mengistu Haile Mariam utropade Derg Etiopien till en marxist-leninistisk stat, förstatligade jorden och bekämpade med sovjetiskt och kubanskt stöd en lång rad motståndare: de eritreanska fronterna, Tigrayfolkets befrielsefront (TPLF), Oromos befrielsefront, Västsomaliska befrielsefronten och Somalia, den monarkistiska Etiopiska demokratiska unionen och i städerna Etiopiska folkets revolutionära parti, som krossades i den röda terrorn 1976–1978. Hungersnöden 1983–1985, som förvärrades av kriget och av regeringens upprorsbekämpning, dödade omkring 400 000 till en miljon människor. Från 1988 fick rebellerna övertaget: Eritreanska folkets befrielsefront förintade en av Dergs arméer vid Afabet, TPLF drev ut regeringen ur Tigray efter slaget vid Shire 1989, och den TPLF-ledda Etiopiska folkets revolutionära demokratiska front (EPRDF) ryckte fram mot Addis Abeba. Mengistu flydde den 21 maj 1991, EPLF intog Asmara den 24 maj och EPRDF tågade in i huvudstaden den 28 maj. Minst 1,4 miljoner människor dog i kriget och hungersnöderna, och Eritrea blev självständigt 1993."
