Ethiopian–Egyptian War: Etiopisk-egyptiska kriget
"Khedive Isma’il of Egypt’s attempt to extend his African empire into the Ethiopian highlands. Egypt had taken over Massawa from the Ottomans in 1865 and occupied the Bogos country around Keren in 1872, and in 1875 its forces took Zeila, Berbera and the emirate of Harar. In the autumn of 1875 two columns marched inland against Ethiopia: Werner Munzinger’s from Tadjoura was destroyed by the forces of the sultan of Aussa, and Colonel Arendrup’s from Massawa was annihilated by Emperor Yohannes IV’s army at Gundet near the Mareb on 16 November 1875. A larger army under Ratib Pasha, with the American general William Loring as chief of staff, entrenched on the plain of Gura and was defeated on 7–9 March 1876. No peace was signed; Egypt kept Massawa, Bogos and Harar for some years, and the war’s cost added to the debts that led to Isma’il’s fall in 1879. Shalaqa Alula, the hero of both battles, became Ras Alula and governor of the northern frontier.": "Den egyptiske khediven Isma’ils försök att utvidga sitt afrikanska välde till det etiopiska höglandet. Egypten hade övertagit Massawa från osmanerna 1865 och ockuperat Bogoslandet kring Keren 1872, och 1875 intog dess styrkor Zeila, Berbera och emiratet Harar. Hösten 1875 marscherade två kolonner inåt landet mot Etiopien: Werner Munzingers kolonn från Tadjoura förintades av styrkor under sultanen av Aussa, och överste Arendrups kolonn från Massawa tillintetgjordes av kejsar Yohannes IV:s armé vid Gundet nära Mareb den 16 november 1875. En större armé under Ratib pasha, med den amerikanske generalen William Loring som stabschef, grävde ned sig på Guraslätten och besegrades den 7–9 mars 1876. Ingen fred slöts; Egypten behöll Massawa, Bogos och Harar i några år, och krigets kostnader ökade de skulder som ledde till Isma’ils fall 1879. Shalaqa Alula, hjälten i båda slagen, blev ras Alula och guvernör över gränslandet i norr."
