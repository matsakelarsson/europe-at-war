# Svenska översättningar av katalogtexten (våg 12); stegtexterna kommer senare.
Ethiopian resistance to Italian rule: Etiopiska motståndet mot det italienska styret
? Five years of guerrilla war against the Italian occupation of Ethiopia. After the fall of Addis Ababa in May 1936, nobles, soldiers and peasants fought on as the Arbegnoch, the Patriots. Their first attempts, an attack on the capital in July 1936 and the stand of Ras Imru and the Black Lions in the west, ended in surrender and executions, and after the attempt on Viceroy Graziani’s life in February 1937 the Italians answered with mass killings in Addis Ababa and at the monastery of Debre Libanos. The killings drove more people to the Patriots. From 1937 risings in Lasta, Begemder and Gojjam, and the bands of Abebe Aregai in Shewa, kept large parts of the highlands out of Italian control; a more conciliatory viceroy, the Duke of Aosta, could not end the war, and Italian troops used gas in the Zeret cave in 1939. When Italy entered the Second World War in June 1940, Britain armed the Patriots, and in January 1941 Haile Selassie re-entered Ethiopia with Gideon Force. He returned to Addis Ababa on 5 May 1941, five years to the day after the Italians had taken it, escorted by thousands of Patriots.
: Fem års gerillakrig mot den italienska ockupationen av Etiopien. Efter Addis Abebas fall i maj 1936 fortsatte adelsmän, soldater och bönder att kämpa som arbegnoch, patrioterna. Deras första försök, ett anfall mot huvudstaden i juli 1936 och ras Imrus och Svarta lejonens motstånd i väster, slutade med kapitulation och avrättningar, och efter attentatet mot vicekungen Graziani i februari 1937 svarade italienarna med massmord i Addis Abeba och vid klostret Debre Libanos. Morden drev fler människor till patrioterna. Från 1937 höll resningar i Lasta, Begemder och Gojjam, och Abebe Aregais skaror i Shewa, stora delar av höglandet utanför italiensk kontroll; en mer försonlig vicekung, hertigen av Aosta, kunde inte få slut på kriget, och italienska trupper använde gas i Zeretgrottan 1939. När Italien gick in i andra världskriget i juni 1940 beväpnade Storbritannien patrioterna, och i januari 1941 gick Haile Selassie åter in i Etiopien med Gideon Force. Han återvände till Addis Abeba den 5 maj 1941, på dagen fem år efter att italienarna hade intagit staden, eskorterad av tusentals patrioter.
