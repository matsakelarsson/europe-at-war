# Svenska översättningar av katalogtexten (våg 12); stegtexterna kommer senare.
Ethiopian–Somali Border War: Etiopisk-somaliska gränskriget
? A short border war between Ethiopia and the Somali Republic over the Ogaden, the Somali-inhabited east of Ethiopia that Somalia claimed as part of a Greater Somalia. In June 1963 Ogaden Somalis led by Mukhtar Dahir (“Nasrallah”) rose against Ethiopian tax collection; Ethiopia accused Somalia of arming them, which Somalia denied, and answered with reprisals against herders and villages. After clashes from mid-January 1964, both governments declared states of emergency on 8 February. Ethiopia, with some 55,000–60,000 troops and F-86 Sabre jets, against about 9,000–11,000 Somali soldiers and up to 3,000 Ogaden fighters, fought tank and artillery battles around Tog Wajaale (Togochale) on the northern border and bombed Feerfeer, Galkayo, Buuhoodle and other Somali towns, and the war spread south to Dolow on the Kenyan border. Ceasefires called by the Soviet Union and the Organisation of African Unity failed; Sudan’s president Ibrahim Abboud mediated a ceasefire on 30 March, and fighting ended on 2 April 1964, followed by an accord in Khartoum to withdraw troops and stop hostile propaganda. Both sides claimed victory, and neither gained ground; an estimated 1,000–2,000 people were killed. Somalia rejected the OAU’s Cairo declaration of July 1964 that colonial borders should stand, and the dispute led to the Ogaden War of 1977–1978.
: Ett kort gränskrig mellan Etiopien och Somaliska republiken om Ogaden, det somaliskbefolkade östra Etiopien som Somalia gjorde anspråk på som en del av ett Storsomalia. I juni 1963 reste sig ogadensomalier under ledning av Mukhtar Dahir (”Nasrallah”) mot den etiopiska skatteindrivningen; Etiopien anklagade Somalia för att beväpna dem, vilket Somalia förnekade, och svarade med repressalier mot herdar och byar. Efter sammandrabbningar från mitten av januari 1964 utlyste båda regeringarna undantagstillstånd den 8 februari. Etiopien, med omkring 55 000–60 000 soldater och jetplan av typen F-86 Sabre, mot omkring 9 000–11 000 somaliska soldater och upp till 3 000 kämpar från Ogaden, utkämpade stridsvagns- och artilleristrider kring Tog Wajaale (Togochale) vid den norra gränsen och bombade Feerfeer, Galkayo, Buuhoodle och andra somaliska städer, och kriget spred sig söderut till Dolow vid gränsen mot Kenya. Vapenvilor som Sovjetunionen och Organisationen för afrikansk enhet manade till misslyckades; Sudans president Ibrahim Abboud medlade fram ett eldupphör den 30 mars, och striderna upphörde den 2 april 1964, följda av en överenskommelse i Khartoum om att dra tillbaka trupperna och upphöra med fientlig propaganda. Båda sidor gjorde anspråk på seger, och ingen av dem vann terräng; uppskattningsvis 1 000–2 000 människor dödades. Somalia förkastade OAU:s Kairodeklaration från juli 1964 om att kolonialgränserna skulle bestå, och tvisten ledde till Ogadenkriget 1977–1978.
