On the night of 18–19 August Garibaldi crossed the Strait of Messina with about 3,700 men, landed near Melito and took Reggio on 21 August. The Bourbon army in Calabria, demoralised and badly led, surrendered or melted away, and Garibaldi advanced so fast that he outran most of his troops. King Francis II left Naples on 6 September for the fortress of Gaeta, and the next day Garibaldi arrived in the capital by train with a few companions and was greeted by cheering crowds.: Natten mellan den 18 och 19 augusti gick Garibaldi över Messinasundet med omkring 3 700 man, landsteg nära Melito och tog Reggio den 21 augusti. Den bourbonska armén i Kalabrien, demoraliserad och dåligt ledd, kapitulerade eller löstes upp, och Garibaldi ryckte fram så snabbt att han lämnade de flesta av sina trupper bakom sig. Kung Frans II lämnade Neapel den 6 september för fästningen Gaeta, och dagen därpå anlände Garibaldi till huvudstaden med tåg tillsammans med några följeslagare och hälsades av jublande folkmassor.
Francis II still had a large and loyal army on the Volturno, around the fortress of Capua. On 1–2 October it attacked Garibaldi’s volunteers along the river in the largest battle of the campaign, and was beaten back with help from Sardinian troops landed at Naples. Plebiscites on 21 October approved union with Sardinia by huge majorities, though voting was public and critics doubted the result. On 26 October Garibaldi met Victor Emmanuel near Teano and greeted him as King of Italy. He handed over his conquests and on 9 November sailed home to the island of Caprera.: Frans II hade fortfarande en stor och lojal armé vid Volturno, kring fästningen Capua. Den 1–2 oktober anföll den Garibaldis frivilliga längs floden i fälttågets största slag och slogs tillbaka med hjälp av sardiska trupper som landsatts i Neapel. Folkomröstningar den 21 oktober godkände union med Sardinien med överväldigande majoriteter, även om röstningen var offentlig och kritiker betvivlade resultatet. Den 26 oktober mötte Garibaldi Viktor Emanuel nära Teano och hälsade honom som kung av Italien. Han överlämnade sina erövringar och seglade den 9 november hem till ön Caprera.
