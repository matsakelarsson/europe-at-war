Expedition of the Thousand: De tusens expedition
The campaign in which Giuseppe Garibaldi and about a thousand volunteers landed in Sicily in May 1860 and, joined by Sicilian insurgents and thousands more volunteers, overthrew the Bourbon Kingdom of the Two Sicilies. The Sardinian army meanwhile took the Marche and Umbria from the Papal States and besieged King Francis II in Gaeta, which surrendered in February 1861; the south was joined to the new Kingdom of Italy, proclaimed on 17 March 1861.: Det fälttåg där Giuseppe Garibaldi och omkring tusen frivilliga landsteg på Sicilien i maj 1860 och, förstärkta av sicilianska upprorsmän och tusentals fler frivilliga, störtade bourbonernas Kungariket Bägge Sicilierna. Den sardinska armén tog under tiden Marche och Umbrien från Kyrkostaten och belägrade kung Frans II i Gaeta, som kapitulerade i februari 1861; södern förenades med det nya Kungariket Italien, som utropades den 17 mars 1861.
