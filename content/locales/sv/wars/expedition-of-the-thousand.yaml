A revolt in Palermo on 4 April 1860 was quickly put down but lived on in the countryside. Garibaldi gathered volunteers near Genoa, and Cavour, Sardinia’s prime minister, neither stopped nor openly helped him. On the night of 5–6 May about 1,100 men, most of them from Lombardy, Venetia and Liguria and many of them students and artisans, sailed from Quarto in two steamers and landed at Marsala on 11 May. At Salemi Garibaldi declared himself dictator of Sicily in the name of King Victor Emmanuel II. On 15 May at Calatafimi his volunteers, with Sicilian irregulars, drove a larger Neapolitan force off a terraced hill.: Ett uppror i Palermo den 4 april 1860 slogs snabbt ned men levde vidare på landsbygden. Garibaldi samlade frivilliga nära Genua, och Cavour, Sardiniens premiärminister, varken stoppade eller hjälpte honom öppet. Natten mellan den 5 och 6 maj seglade omkring 1 100 man, de flesta från Lombardiet, Venetien och Ligurien och många av dem studenter och hantverkare, från Quarto i två ångfartyg och landsteg i Marsala den 11 maj. I Salemi utropade sig Garibaldi till diktator över Sicilien i kung Viktor Emanuel II:s namn. Den 15 maj vid Calatafimi drev hans frivilliga, tillsammans med sicilianska irreguljära styrkor, en större neapolitansk styrka från en terrasserad kulle.
Garibaldi feinted towards Corleone, then broke into Palermo on 27 May. After three days of street fighting, while Bourbon warships and the fortress shelled the city, the garrison of some 20,000 men agreed to an armistice and in June left by sea. Volunteers poured in from the north, and on 20 July Garibaldi defeated the Neapolitans at Milazzo; Messina was given up at the end of July, though its citadel held out. Peasants who rose against their landlords in the hope of land met harsh repression, and at Bronte in August Garibaldi’s lieutenant Nino Bixio had five men shot after a summary trial.: Garibaldi gjorde en skenmanöver mot Corleone och bröt sedan in i Palermo den 27 maj. Efter tre dagars gatustrider, medan bourbonska krigsfartyg och fästningen besköt staden, gick garnisonen på omkring 20 000 man med på ett vapenstillestånd och lämnade i juni staden sjövägen. Frivilliga strömmade till från norr, och den 20 juli besegrade Garibaldi neapolitanerna vid Milazzo; Messina utrymdes i slutet av juli, även om dess citadell höll stånd. Bönder som reste sig mot sina godsägare i hopp om jord möttes av hårt förtryck, och i Bronte i augusti lät Garibaldis underbefälhavare Nino Bixio skjuta fem män efter en summarisk rättegång.
