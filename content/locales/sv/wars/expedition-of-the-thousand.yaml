To keep Garibaldi from marching on Rome, which would have meant war with France, and to take his revolution in hand, Cavour sent the Sardinian army into the Papal Marche and Umbria on 11 September, with Napoleon III’s tacit consent. On 18 September General Enrico Cialdini defeated the Papal army of the French general Christophe de Lamoricière, which included Catholic volunteers from France, Belgium and Ireland, at Castelfidardo near Loreto, and on 29 September Ancona surrendered after a siege by land and sea. Victor Emmanuel then led his army south through the Abruzzi into the Kingdom of Naples.: För att hindra Garibaldi från att tåga mot Rom, vilket skulle ha inneburit krig med Frankrike, och för att ta hand om hans revolution sände Cavour den sardiska armén in i de påvliga provinserna Marche och Umbrien den 11 september, med Napoleon III:s tysta medgivande. Den 18 september besegrade general Enrico Cialdini den påvliga armén under den franske generalen Christophe de Lamoricière, som omfattade katolska frivilliga från Frankrike, Belgien och Irland, vid Castelfidardo nära Loreto, och den 29 september kapitulerade Ancona efter en belägring till lands och sjöss. Viktor Emanuel ledde sedan sin armé söderut genom Abruzzerna in i Kungariket Neapel.
Francis II and Queen Maria Sophia held out in Gaeta with what remained of the Bourbon army. Cialdini besieged the fortress from 5 November; a French squadron kept the sea open until January 1861, and on 13 February, short of supplies and struck by typhus after weeks of bombardment, the garrison surrendered. The royal couple went into exile in Rome. The first Italian parliament proclaimed Victor Emmanuel King of Italy on 17 March 1861, and the last Bourbon strongholds, the citadel of Messina and Civitella del Tronto, surrendered in March. Rome and Venetia remained outside the new kingdom, and in the south a long guerrilla war began.: Frans II och drottning Maria Sofia höll stånd i Gaeta med det som återstod av den bourbonska armén. Cialdini belägrade fästningen från den 5 november; en fransk eskader höll sjövägen öppen till januari 1861, och den 13 februari kapitulerade garnisonen, som led brist på förnödenheter och drabbats av tyfus efter veckor av bombardemang. Kungaparet gick i exil i Rom. Det första italienska parlamentet utropade Viktor Emanuel till kung av Italien den 17 mars 1861, och de sista bourbonska fästena, citadellet i Messina och Civitella del Tronto, kapitulerade i mars. Rom och Venetien förblev utanför det nya kungariket, och i söder inleddes ett långt gerillakrig.
