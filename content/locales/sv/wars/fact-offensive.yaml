# Svenska översättningar av katalogtexten (våg 12); stegtexterna kommer senare.
FACT offensive in Chad: FACT:s offensiv i Tchad
? An invasion of northern Chad from Libya by the Front for Change and Concord in Chad (FACT), during which President Idriss Déby was killed. FACT, led by Mahamat Mahdi Ali and drawing many of its fighters from the Goran (Daza) of the north, had been based in southern Libya, where a UN panel of experts placed it at the al-Jufra air base used by the forces of Khalifa Haftar and by the Russian Wagner Group. On 11 April 2021, the day of the presidential election in which Déby sought a sixth term, FACT columns of pickup trucks attacked a border post in the Tibesti and drove south through the desert towards N’Djamena. On 19 April, as the army fought them in Kanem near Nokou and Mao, some 250–300 km north of the capital, Déby was wounded at the front; his death was announced on 20 April, a day after provisional results had given him about 79 per cent of the vote. A Transitional Military Council under his son, General Mahamat Idriss Déby, suspended the constitution and dissolved parliament, and France, Chad’s main ally, accepted the takeover as necessary in exceptional circumstances; at least six protesters were killed in N’Djamena and the south when people demanded a civilian transition. The army drove the rebels back towards Niger and Libya and declared victory on 9 May; by its own figures it had killed some 540 rebels and captured about 210, and gave its own losses as 11 killed and 58 wounded; none of these figures could be checked. FACT refused to sign the peace agreement that the junta and some forty other rebel groups signed in Doha in August 2022. In March 2023 a court in N’Djamena sentenced more than 400 FACT members to life imprisonment for the attack; Mahamat Déby pardoned 380 of them days later, but not Mahamat Mahdi Ali, who was sentenced in his absence. Mahamat Déby was elected president in May 2024.
: En invasion av norra Tchad från Libyen, genomförd av Fronten för förändring och samförstånd i Tchad (FACT), under vilken president Idriss Déby dödades. FACT, som leddes av Mahamat Mahdi Ali och rekryterade många av sina stridande bland goran (daza) i norr, hade haft sina baser i södra Libyen, där en FN-expertpanel placerade gruppen vid flygbasen al-Jufra, som användes av Khalifa Haftars styrkor och den ryska Wagnergruppen. Den 11 april 2021, dagen för det presidentval där Déby sökte en sjätte mandatperiod, anföll FACT:s kolonner av pickuper en gränspost i Tibesti och körde söderut genom öknen mot N’Djamena. Den 19 april, när armén stred mot dem i Kanem nära Nokou och Mao, omkring 250–300 km norr om huvudstaden, sårades Déby vid fronten; hans död tillkännagavs den 20 april, en dag efter att preliminära resultat hade gett honom omkring 79 procent av rösterna. Ett militärt övergångsråd under hans son, general Mahamat Idriss Déby, upphävde författningen och upplöste parlamentet, och Frankrike, Tchads främsta allierade, godtog maktövertagandet som nödvändigt under exceptionella omständigheter; minst sex demonstranter dödades i N’Djamena och i landets södra del när människor krävde en civil övergång. Armén drev tillbaka rebellerna mot Niger och Libyen och förklarade sig segrande den 9 maj; enligt egna uppgifter hade den dödat omkring 540 rebeller och tillfångatagit omkring 210, och den uppgav sina egna förluster till 11 döda och 58 sårade; ingen av dessa siffror gick att kontrollera. FACT vägrade att underteckna det fredsavtal som juntan och ett fyrtiotal andra rebellgrupper undertecknade i Doha i augusti 2022. I mars 2023 dömde en domstol i N’Djamena mer än 400 FACT-medlemmar till livstids fängelse för angreppet; Mahamat Déby benådade 380 av dem några dagar senare, men inte Mahamat Mahdi Ali, som hade dömts i sin frånvaro. Mahamat Déby valdes till president i maj 2024.
