Known in Argentina as the Malvinas War (Guerra de las Malvinas). Neither country formally declared war. The islands lie far outside the map.: Kallas i Argentina Malvinaskriget (Guerra de las Malvinas). Inget av länderna förklarade formellt krig. Öarna ligger långt utanför kartan.
