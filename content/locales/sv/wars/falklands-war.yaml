Falklands War: Falklandskriget
A ten-week war between Argentina and the United Kingdom over the Falkland Islands and South Georgia in the South Atlantic, British territories that Argentina claims as the Malvinas. Argentina’s military government invaded the Falklands on 2 April 1982 and South Georgia the next day. Britain sent a naval task force, retook South Georgia on 25 April and declared an exclusion zone around the Falklands. On 2 May a British submarine sank the Argentine cruiser General Belgrano, with the loss of 323 lives, and Argentine aircraft went on to sink several British ships, among them the destroyer HMS Sheffield. British troops landed at San Carlos on 21 May, won at Goose Green and in the hills around Stanley, and the Argentine garrison surrendered on 14 June. In all 649 Argentine and 255 British servicemen and three islanders were killed. The defeat brought down the Argentine junta, and democracy returned to Argentina in 1983; Argentina still claims the islands.: Ett tio veckor långt krig mellan Argentina och Storbritannien om Falklandsöarna och Sydgeorgien i södra Atlanten, brittiska territorier som Argentina gör anspråk på som Malvinas. Argentinas militärregering invaderade Falklandsöarna den 2 april 1982 och Sydgeorgien dagen därpå. Storbritannien sände en marin insatsstyrka, återtog Sydgeorgien den 25 april och utlyste en spärrzon kring Falklandsöarna. Den 2 maj sänkte en brittisk ubåt den argentinska kryssaren General Belgrano, varvid 323 människor omkom, och argentinskt flyg sänkte därefter flera brittiska fartyg, bland dem jagaren HMS Sheffield. Brittiska trupper landsteg vid San Carlos den 21 maj, segrade vid Goose Green och i bergen kring Stanley, och den argentinska garnisonen kapitulerade den 14 juni. Sammanlagt dödades 649 argentinska och 255 brittiska militärer samt tre öbor. Nederlaget fällde den argentinska juntan, och demokratin återvände till Argentina 1983; Argentina gör fortfarande anspråk på öarna.
