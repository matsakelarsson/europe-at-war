Venetian, Genoese and some Byzantine ships cut through the boom and sailed away with refugees while the Ottoman sailors, ashore to loot, could not stop them.: Venetianska, genuesiska och några bysantinska fartyg bröt igenom bommen och seglade bort med flyktingar medan de osmanska sjömännen, som gått i land för att plundra, inte kunde hindra dem.
