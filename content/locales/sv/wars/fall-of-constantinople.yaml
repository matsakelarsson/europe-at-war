The Genoese colony stayed officially neutral. Some of its men crossed to fight for the city, while others traded with the Ottoman camp.: Den genuesiska kolonin förblev officiellt neutral. En del av dess män gick över för att strida för staden, medan andra handlade med det osmanska lägret.
