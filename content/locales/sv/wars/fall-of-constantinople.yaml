After a day of rest and prayer in the Ottoman camp, and a last service of both Greeks and Latins in Hagia Sophia on the evening of 28 May, the general assault began after midnight on Tuesday 29 May. Mehmed sent in his irregular troops first, then the Anatolian regiments, against the breach in the Lycus valley and the weaker walls at Blachernae; both waves were thrown back. As the janissaries came on in the third wave towards dawn, Giustiniani was badly wounded and carried to a ship, and his men began to fall back. By one account Ottoman soldiers also found a small gate, the Kerkoporta, left open and raised their flag on a tower.: Efter en dag av vila och bön i det osmanska lägret, och en sista gudstjänst för både greker och latiner i Hagia Sofia på kvällen den 28 maj, började den allmänna stormningen efter midnatt tisdagen den 29 maj. Mehmed sände först in sina irreguljära trupper och sedan de anatoliska regementena mot bräschen i Lykosdalen och de svagare murarna vid Blachernai; båda vågorna kastades tillbaka. När janitsjarerna ryckte fram i den tredje vågen mot gryningen blev Giustiniani svårt sårad och bars till ett fartyg, och hans män började dra sig tillbaka. Enligt en skildring hittade osmanska soldater också en liten port, Kerkoporta, som lämnats öppen, och hissade sin flagga på ett torn.
The janissaries broke in near the Gate of St Romanus. Constantine XI threw himself into the fighting and was never seen again; his fate is unknown. By midday the city was in Ottoman hands, and some Venetian, Genoese and Byzantine ships escaped from the harbour crowded with refugees. Mehmed had promised his soldiers three days of plunder; the city was sacked, thousands of people were killed and some 30,000, by one estimate, were enslaved. Mehmed rode to Hagia Sophia and had it turned into a mosque, and he is said to have stopped the looting early. The grand duke Loukas Notaras was executed a few days later.: Janitsjarerna bröt sig in nära Romanosporten. Konstantin XI kastade sig in i striden och sågs aldrig mer; hans öde är okänt. Vid middagstid var staden i osmanska händer, och några venetianska, genuesiska och bysantinska fartyg flydde ur hamnen fullastade med flyktingar. Mehmed hade lovat sina soldater tre dagars plundring; staden skövlades, tusentals människor dödades och omkring 30 000 förslavades enligt en uppskattning. Mehmed red till Hagia Sofia och lät göra om den till moské, och han sägs ha stoppat plundringen i förtid. Storhertigen Loukas Notaras avrättades några dagar senare.
