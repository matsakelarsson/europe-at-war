Fall of Constantinople: Konstantinopels fall
The siege and capture of Constantinople, capital of the Byzantine Empire for more than a thousand years, by the Ottoman sultan Mehmed II. After blocking the Bosporus with the fortress of Rumeli Hisarı in 1452, Mehmed besieged the city from 6 April 1453 with a large army, a fleet and great bronze guns; its few thousand Greek and Italian defenders held out for 53 days until the final assault of 29 May, in which Emperor Constantine XI was killed. Mehmed made the city his capital, and the last Byzantine states in the Morea and at Trebizond fell by 1461.: Den osmanske sultanen Mehmed II:s belägring och erövring av Konstantinopel, Bysantinska rikets huvudstad i mer än tusen år. Sedan Mehmed 1452 hade spärrat Bosporen med fästningen Rumeli Hisarı belägrade han staden från den 6 april 1453 med en stor här, en flotta och väldiga bronskanoner; dess några tusen grekiska och italienska försvarare höll stånd i 53 dagar fram till slutstormningen den 29 maj, då kejsar Konstantin XI stupade. Mehmed gjorde staden till sin huvudstad, och de sista bysantinska staterna på Morea och i Trapezunt föll senast 1461.
