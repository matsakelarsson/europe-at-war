On 20 April three Genoese ships hired by the pope and a Byzantine grain transport came up the Sea of Marmara. Baltoğlu’s galleys swarmed around them in full view of the walls and of the sultan, who rode his horse into the shallows, but the tall sailing ships, fighting from above, held them off and slipped behind the chain at nightfall. Mehmed had Baltoğlu flogged and dismissed. Two days later he had some seventy ships hauled on greased rollers from the Bosporus at the Double Columns over the hill behind Pera and launched into the Golden Horn at the Valley of the Springs.: Den 20 april kom tre genuesiska fartyg som påven hyrt och ett bysantinskt spannmålsfartyg uppför Marmarasjön. Baltoğlus galärer svärmade kring dem i full syn från murarna och från sultanen, som red ut i grundvattnet, men de höga segelfartygen, som stred ovanifrån, höll dem stången och gled vid mörkrets inbrott in bakom kedjan. Mehmed lät prygla och avsätta Baltoğlu. Två dagar senare lät han dra omkring sjuttio fartyg på smorda rullar från Bosporen vid Dubbelkolonnerna över kullen bakom Pera och sjösätta dem i Gyllene hornet vid Källornas dal.
The defenders now had to man the harbour walls too. A night attack with fireships on 28 April, led by the Venetian Giacomo Coco, was betrayed and failed; Mehmed had captured sailors impaled in sight of the walls, and the defenders beheaded some 260 Turkish prisoners on the ramparts. The Ottomans built a pontoon bridge across the upper harbour. Serbian miners from Novo Brdo dug tunnels towards the walls at Blachernae, but an engineer named Johannes Grant countermined and destroyed them between 16 and 25 May, and a great siege tower was burnt. On 21 May Mehmed offered terms; Constantine refused to give up the city.: Försvararna måste nu också bemanna hamnmurarna. Ett nattligt anfall med brännare den 28 april, lett av venetianen Giacomo Coco, förråddes och misslyckades; Mehmed lät spetsa tillfångatagna sjömän på påle inom synhåll från murarna, och försvararna halshögg omkring 260 turkiska fångar på vallarna. Osmanerna byggde en pontonbro över den inre hamnen. Serbiska gruvarbetare från Novo Brdo grävde tunnlar mot murarna vid Blachernai, men en ingenjör vid namn Johannes Grant grävde motminor och förstörde dem mellan den 16 och 25 maj, och ett stort belägringstorn brändes. Den 21 maj erbjöd Mehmed villkor; Konstantin vägrade att ge upp staden.
