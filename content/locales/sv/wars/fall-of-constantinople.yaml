The Ottoman army camped before the land walls on 2 April, and Mehmed arrived on 5 April; the siege is counted from the next day. Modern historians estimate his army at 50,000 to 100,000 men, with a fleet of more than a hundred vessels under Baltoğlu Süleyman. Constantine could muster about 7,000 men, some 2,000 of them foreigners, to hold some 20 km of walls. The Theodosian land walls, a double line with a moat, ran for about 6 km from the Golden Horn to the Sea of Marmara, and a chain floated on logs closed the mouth of the Golden Horn.: Den osmanska hären slog läger framför landmurarna den 2 april, och Mehmed anlände den 5 april; belägringen räknas från dagen därpå. Moderna historiker uppskattar hans här till 50 000–100 000 man, med en flotta på mer än hundra fartyg under Baltoğlu Süleyman. Konstantin kunde mönstra omkring 7 000 man, varav ungefär 2 000 utlänningar, för att försvara omkring 20 km murar. De theodosianska landmurarna, en dubbel mur med vallgrav, sträckte sig omkring 6 km från Gyllene hornet till Marmarasjön, och en kedja som flöt på stockar stängde inloppet till Gyllene hornet.
Constantine took charge of the Mesoteichion, where the walls dipped into the valley of the Lycus stream, the weakest stretch; Giustiniani stood first at the Charisian Gate and later moved beside the emperor. Mehmed pitched his tent opposite, near the Gate of St Romanus, and his guns pounded the walls day after day, though the defenders rebuilt each breach by night with timber, earth and barrels. Detachments took the outlying castles at Therapia and Stoudios, and the fleet took the Princes’ Islands. An assault on the Lycus breach on 18 April was beaten back.: Konstantin tog befälet över Mesoteichion, där murarna sänkte sig ner i Lykosbäckens dal, den svagaste sträckan; Giustiniani stod först vid Charisiosporten och flyttade senare till kejsarens sida. Mehmed slog upp sitt tält mitt emot, nära Romanosporten, och hans kanoner bombarderade murarna dag efter dag, men försvararna byggde om varje bräsch nattetid med timmer, jord och tunnor. Avdelningar intog de avlägsna borgarna vid Therapia och Stoudios, och flottan intog Prinsöarna. En stormning mot bräschen vid Lykos den 18 april slogs tillbaka.
