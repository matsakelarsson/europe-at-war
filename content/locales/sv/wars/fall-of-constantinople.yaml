Dates are Julian, as usual for the period. The main eyewitness accounts, by the Venetian ship’s doctor Nicolò Barbaro, the Byzantine official George Sphrantzes and others, disagree on many details, and the later Greek historians Doukas, Kritoboulos and Chalkokondyles add stories of their own, such as the open postern of the Kerkoporta.: Datumen anges enligt den julianska kalendern, som var brukligt för perioden. De viktigaste ögonvittnesskildringarna, av den venetianske skeppsläkaren Nicolò Barbaro, den bysantinske ämbetsmannen Georgios Sphrantzes och andra, går isär i många detaljer, och de senare grekiska historikerna Doukas, Kritoboulos och Chalkokondyles lägger till egna berättelser, som den om den öppna lönnporten Kerkoporta.
Numbers are uncertain. Contemporaries gave the Ottomans 160,000 men or more; modern estimates range from about 50,000 to 100,000, against some 7,000 defenders.: Siffrorna är osäkra. Samtida uppgav att osmanerna hade 160 000 man eller fler; moderna uppskattningar varierar mellan omkring 50 000 och 100 000, mot ungefär 7 000 försvarare.
The Ottomans called the city Kostantiniyye as well as Istanbul, the name that became official in the 20th century. The Genoese colony of Pera (Galata), across the Golden Horn, was officially neutral during the siege.: Osmanerna kallade staden Kostantiniyye men också Istanbul, det namn som blev officiellt på 1900-talet. Den genuesiska kolonin Pera (Galata), på andra sidan Gyllene hornet, var officiellt neutral under belägringen.
