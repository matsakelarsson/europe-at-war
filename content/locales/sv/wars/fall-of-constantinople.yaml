Mehmed II became sultan for the second time in February 1451, aged 19, and set out to take Constantinople, by then a shrunken city of perhaps 50,000 people surrounded by Ottoman lands. In the spring of 1452 he had a fortress built on the European shore of the Bosporus at its narrowest point, opposite the Anadolu Hisarı of his great-grandfather Bayezid I. Finished in about four months, Rumeli Hisarı, which the Turks called Boğazkesen, the cutter of the strait or of the throat, let his guns control all shipping to and from the Black Sea. In November a Venetian ship that refused to stop was sunk and its captain, Antonio Rizzo, impaled.: Mehmed II blev sultan för andra gången i februari 1451, 19 år gammal, och föresatte sig att inta Konstantinopel, vid det laget en krympt stad med kanske 50 000 invånare, omgiven av osmanskt land. Våren 1452 lät han bygga en fästning på Bosporens europeiska strand där sundet är som smalast, mitt emot Anadolu Hisarı som hans farfars far Bayezid I hade uppfört. Rumeli Hisarı, som turkarna kallade Boğazkesen, ”den som skär av sundet” eller ”strupen”, stod färdig efter omkring fyra månader och gjorde det möjligt för hans kanoner att kontrollera all sjöfart till och från Svarta havet. I november sänktes ett venetianskt fartyg som vägrade stanna, och dess kapten, Antonio Rizzo, spetsades på påle.
Emperor Constantine XI looked to the West for help. To win it, the union of the Orthodox and Catholic churches agreed at Florence in 1439 was proclaimed in Hagia Sophia on 12 December 1452, to the anger of many Greeks. The help was small. In January 1453 the Genoese soldier Giovanni Giustiniani Longo arrived with about 700 men, and Venetian ships in the harbour agreed to stay and fight, but the fleet voted by Venice in February sailed too late. Meanwhile Orban, a Hungarian gun-founder, cast huge bronze guns for Mehmed at Adrianople, and Turahan Bey invaded the Morea to keep the emperor’s brothers busy.: Kejsar Konstantin XI sökte hjälp i väst. För att vinna den utropades den union mellan den ortodoxa och den katolska kyrkan som man enats om i Florens 1439 i Hagia Sofia den 12 december 1452, till många greker ilska. Hjälpen blev liten. I januari 1453 anlände den genuesiske krigaren Giovanni Giustiniani Longo med omkring 700 man, och venetianska fartyg i hamnen gick med på att stanna och strida, men den flotta som Venedig beslutade om i februari seglade för sent. Under tiden göt Orban, en ungersk kanongjutare, väldiga bronskanoner åt Mehmed i Adrianopel, och Turahan bej invaderade Morea för att hålla kejsarens bröder sysselsatta.
