Mehmed made Constantinople his capital. Genoese Pera surrendered and on 1 June received a charter protecting its people’s property and trade. To fill the half-empty city he brought in settlers, Muslim, Christian and Jewish, from across his lands, many of them by force, and in January 1454 he installed the monk Gennadios Scholarios, an opponent of church union, as patriarch and head of the Orthodox community. The Old Palace was built, and from 1459 the Topkapı palace on the old acropolis. The city remained the Ottoman capital until 1922.: Mehmed gjorde Konstantinopel till sin huvudstad. Det genuesiska Pera kapitulerade och fick den 1 juni ett privilegiebrev som skyddade invånarnas egendom och handel. För att fylla den halvtomma staden förde han dit nybyggare, muslimer, kristna och judar, från hela sitt rike, många av dem med tvång, och i januari 1454 insatte han munken Gennadios Scholarios, en motståndare till kyrkounionen, som patriark och överhuvud för den ortodoxa gemenskapen. Gamla palatset byggdes, och från 1459 Topkapıpalatset på den gamla akropolen. Staden förblev osmansk huvudstad fram till 1922.
The rest of the Byzantine world soon followed. The Ottomans took Athens in 1456 and its Acropolis in 1458, and in 1458–1460 Mehmed conquered the Despotate of the Morea, ruled by Constantine’s quarrelling brothers; Mystras surrendered on 29 May 1460, seven years to the day after Constantinople. Trebizond, the empire of the Komnenoi on the Black Sea, fell on 15 August 1461. Greek scholars carried manuscripts and learning to Italy. The fall shocked western Europe, but Pope Pius II died at Ancona in 1464 waiting for a crusade that never sailed.: Resten av den bysantinska världen följde snart efter. Osmanerna intog Aten 1456 och dess Akropolis 1458, och 1458–1460 erövrade Mehmed despotatet Morea, som styrdes av Konstantins grälande bröder; Mystras kapitulerade den 29 maj 1460, på dagen sju år efter Konstantinopel. Trapezunt, komnenernas kejsardöme vid Svarta havet, föll den 15 augusti 1461. Grekiska lärde förde handskrifter och lärdom till Italien. Fallet chockade Västeuropa, men påven Pius II dog i Ancona 1464 i väntan på ett korståg som aldrig avseglade.
