# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
Fall of Jayakarta and the founding of Batavia: Jayakartas fall och grundandet av Batavia
? "The struggle for the port of Jayakarta (Jakarta), at the mouth of the Ciliwung in western Java, between the Dutch East India Company (VOC), the English East India Company, the town’s ruler and the sultanate of Banten, which ended with the Dutch destruction of the town and the founding of Batavia, the Company’s capital in Asia for more than three centuries. Governor-General Jan Pieterszoon Coen had turned the Company’s warehouses at Jayakarta into a fort. In December 1618 an English fleet under Sir Thomas Dale arrived, and after inconclusive fighting at sea Coen sailed to the Moluccas for reinforcements. The prince of Jayakarta, Wijayakrama, and the English besieged the Dutch fort and seized its commander, Pieter van den Broecke, at talks, and the garrison agreed to surrender to the English. But Banten, Jayakarta’s overlord, would not let the English have the fort: in February 1619 its regent, Pangeran Arya Ranamanggala, sent troops who removed the prince and pushed the English out, and the Dutch held on, naming their fort Batavia. Coen returned with about 1,000 men and 16 ships on 28 May 1619, stormed Jayakarta on 30 May and burned it to the ground. On its site the Company built the castle and walled town of Batavia, settled with people from elsewhere, while Banten remained hostile for decades."
: "Kampen om hamnstaden Jayakarta (Jakarta), vid Ciliwungs mynning på västra Java, mellan Nederländska ostindiska kompaniet (VOC), Engelska Ostindiska Kompaniet, stadens härskare och sultanatet Banten, som slutade med att nederländarna förstörde staden och grundade Batavia, kompaniets huvudstad i Asien i mer än tre sekel. Generalguvernör Jan Pieterszoon Coen hade gjort om kompaniets magasin i Jayakarta till ett fort. I december 1618 anlände en engelsk flotta under Sir Thomas Dale, och efter oavgjorda strider till sjöss seglade Coen till Moluckerna efter förstärkningar. Jayakartas furste, Wijayakrama, och engelsmännen belägrade det nederländska fortet och grep dess befälhavare, Pieter van den Broecke, under förhandlingar, och garnisonen gick med på att kapitulera för engelsmännen. Men Banten, Jayakartas överherre, ville inte låta engelsmännen få fortet: i februari 1619 sände dess regent, Pangeran Arya Ranamanggala, trupper som avsatte fursten och trängde ut engelsmännen, och nederländarna höll ut och gav sitt fort namnet Batavia. Coen återvände med omkring 1 000 man och 16 fartyg den 28 maj 1619, stormade Jayakarta den 30 maj och brände staden till grunden. På dess plats byggde kompaniet borgen och den muromgärdade staden Batavia, som befolkades med människor från andra håll, medan Banten förblev fientligt i årtionden."
