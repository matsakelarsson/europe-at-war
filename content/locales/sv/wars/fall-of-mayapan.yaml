# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
Fall of Mayapan: Mayapáns fall
? "The revolt that destroyed Mayapan, the walled city in northern Yucatán that had been the seat of a league of Maya lords since about 1220. The Cocom lineage ruled the city, with the lords of the provinces living there and mercenaries from Tabasco, whom the Maya called Ah Canul, keeping order. According to Diego de Landa and the Maya chronicles, the Xiu lineage, led by Ah Xiu Xupan, rose against the Cocom ruler, whom they accused of tyranny and of bringing in the foreign troops, and in about 1441 killed every Cocom lord in the city except one son who was away trading in Honduras. Mayapan was sacked, burned and abandoned. Excavations have found burned buildings and a mass grave at the foot of the Temple of Kukulcan with bodies that show stab wounds and other violence, radiocarbon-dated to the mid-1400s; a stalagmite from a cave under the temple records a drought from the late 1300s, and the city’s population was already falling. After the fall, northern Yucatán broke up into some sixteen to eighteen independent provinces ruled by lineages: the Xiu at Maní, the surviving Cocom at Sotuta, the Chel at Tecoh and others. Their rivalries, above all the feud between the Xiu and the Cocom, were still alive when the Spaniards came in the 1520s."
: "Det uppror som förstörde Mayapán, den befästa staden i norra Yucatán som sedan omkring 1220 hade varit säte för ett förbund av mayafurstar. Ätten Cocom styrde staden, där provinsernas furstar bodde och där legosoldater från Tabasco, som mayafolket kallade Ah Canul, höll ordning. Enligt Diego de Landa och mayakrönikorna reste sig ätten Xiu under ledning av Ah Xiu Xupan mot Cocomhärskaren, som de anklagade för tyranni och för att ha fört in de främmande trupperna, och omkring 1441 dödade de alla Cocomfurstar i staden utom en son som var bortrest på handelsresa i Honduras. Mayapán plundrades, brändes och övergavs. Vid utgrävningar har man funnit nedbrända byggnader och en massgrav vid foten av Kukulcantemplet med kroppar som bär spår av sticksår och annat våld, kol-14-daterade till mitten av 1400-talet; en stalagmit från en grotta under templet vittnar om en torka från slutet av 1300-talet, och stadens befolkning minskade redan. Efter fallet splittrades norra Yucatán i omkring sexton till arton självständiga provinser som styrdes av olika ätter: Xiu i Maní, de överlevande Cocom i Sotuta, Chel i Tecoh med flera. Deras rivalitet, framför allt fejden mellan Xiu och Cocom, levde fortfarande när spanjorerna kom på 1520-talet."
