# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
Fall of Medang and Airlangga’s reconquest: Medangs fall och Airlanggas återerövring
? "The destruction of the East Javanese kingdom of Medang (Mataram) and its rebuilding by Airlangga. In 1016 Haji Wurawari of Lwaram, a vassal king, fell on the capital, Wwatan, during a royal wedding; King Dharmawangsa Teguh was killed with much of his court, and the kingdom broke up into rival lordships. Many historians see Srivijaya behind the attack, as revenge for Dharmawangsa’s naval attack on Palembang in about 990, but the Javanese sources do not say so. Airlangga, Dharmawangsa’s nephew and the bridegroom, a son of King Udayana of Bali, escaped with his servant Narottama and lived among hermits at Vanagiri (Wonogiri). From 1019 former officials of Medang rallied to him, and between 1028 and 1035 he fought the kings who had taken parts of the old kingdom: Wisnuprabhawa of Wuratan, Wijayawarma of Wengker and Panuda of Lewa in 1029–1031; a queen of the south, remembered as Dyah Tulodong of Lodoyong, who sacked his capital Watan Mas in 1031 and was defeated in 1032; Wurawari himself at the end of 1032; and Wengker again in 1035, whose king fled and was killed by his own people. By 1037 Airlangga ruled eastern Java from his new capital Kahuripan in the Brantas delta. He made peace with Srivijaya, which the Chola raid of 1025 had weakened, and before his death in 1049 divided the kingdom between his sons as Janggala and Kediri (Panjalu)."
: "Förstörelsen av det östjavanesiska kungariket Medang (Mataram) och Airlanggas återuppbyggnad av det. År 1016 föll Haji Wurawari av Lwaram, en vasallkung, över huvudstaden Wwatan under ett kungligt bröllop; kung Dharmawangsa Teguh dödades tillsammans med stora delar av sitt hov, och riket splittrades i rivaliserande herradömen. Många historiker ser Srivijaya bakom anfallet, som hämnd för Dharmawangsas sjöanfall mot Palembang omkring 990, men de javanesiska källorna säger inget om det. Airlangga, Dharmawangsas systerson och brudgummen, en son till kung Udayana av Bali, flydde med sin tjänare Narottama och levde bland eremiter i Vanagiri (Wonogiri). Från 1019 samlades före detta ämbetsmän från Medang kring honom, och mellan 1028 och 1035 bekämpade han de kungar som hade tagit delar av det gamla riket: Wisnuprabhawa av Wuratan, Wijayawarma av Wengker och Panuda av Lewa 1029–1031; en drottning i söder, ihågkommen som Dyah Tulodong av Lodoyong, som plundrade hans huvudstad Watan Mas 1031 och besegrades 1032; Wurawari själv i slutet av 1032; och åter Wengker 1035, vars kung flydde och dödades av sitt eget folk. År 1037 härskade Airlangga över östra Java från sin nya huvudstad Kahuripan i Brantasdeltat. Han slöt fred med Srivijaya, som Cholarikets räd 1025 hade försvagat, och före sin död 1049 delade han riket mellan sina söner i två delar, Janggala och Kediri (Panjalu)."
