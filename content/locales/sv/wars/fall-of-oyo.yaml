# Svenska översättningar av katalogtexten (våg 13); stegtexterna kommer senare.
Fall of the Oyo Empire: Oyorikets fall
? The collapse of Oyo, the Yoruba empire that had dominated the savanna and forest between the Niger and the coast of the Bight of Benin since the 17th century. Weakened by decades of conflict between its kings, the alaafins, and its chiefs, Oyo lost its northern stronghold of Ilorin in 1817, when Afonja, the commander of its army, rebelled and called in Muslim allies; by the 1820s Ilorin had become an emirate of the Sokoto Caliphate and was raiding the heart of the empire. Dahomey threw off Oyo’s overlordship, and in the south the Owu war and the destruction of the Egba towns uprooted whole populations. In about 1835 Alaafin Oluewu and his Borgu allies were defeated and killed outside Ilorin in the Eleduwe war, and the capital, Oyo-Ile, was abandoned. Refugees and war chiefs built new towns further south, Ibadan, Abeokuta, Ijaye and a new Oyo, whose rivalries shaped the Yoruba wars of the rest of the century. Captives taken in these wars were sold in great numbers into the Atlantic slave trade through Lagos and Porto-Novo, above all to Brazil and Cuba.
: Sammanbrottet för Oyo, det yorubarike som sedan 1600-talet hade dominerat savannen och skogen mellan Niger och Beninbuktens kust. Försvagat av årtionden av konflikter mellan sina kungar, alaafinerna, och sina hövdingar förlorade Oyo sitt nordliga fäste Ilorin 1817, när Afonja, befälhavaren för dess armé, gjorde uppror och kallade in muslimska bundsförvanter; på 1820-talet hade Ilorin blivit ett emirat under Sokotokalifatet och gjorde räder in i rikets kärnområden. Dahomey skakade av sig Oyos överhöghet, och i söder ryckte Owukriget och förstörelsen av egbastäderna upp hela befolkningar. Omkring 1835 besegrades och dödades alaafin Oluewu och hans bundsförvanter från Borgu utanför Ilorin i Eleduwekriget, och huvudstaden Oyo-Ile övergavs. Flyktingar och krigshövdingar byggde nya städer längre söderut, Ibadan, Abeokuta, Ijaye och ett nytt Oyo, vars rivalitet präglade yorubakrigen under resten av århundradet. Fångar som togs i dessa krig såldes i stort antal till den atlantiska slavhandeln via Lagos och Porto-Novo, framför allt till Brasilien och Kuba.
