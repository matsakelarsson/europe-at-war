# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
Banten’s conquest of Sunda (fall of Pajajaran): Bantens erövring av Sunda (Pajajarans fall)
? The end of the Hindu kingdom of Sunda in western Java, whose capital, Pakuan Pajajaran, near today’s Bogor, was taken and destroyed by the Muslim sultanate of Banten in 1579. Sunda had lost its main ports to the forces of Demak and Cirebon in 1527, when Fatahillah took Sunda Kelapa and renamed it Jayakarta, and Banten, until then a Sundanese port, became the seat of a new sultanate under Hasanuddin, a son of Sunan Gunungjati of Cirebon. The Sundanese king Surawisesa is credited with fifteen battles against the Muslim forces before a peace of 1531, but the attacks resumed under his successors. In the 1550s Hasanuddin sent his son Maulana Yusuf against Pakuan; its walls and moats held, but the kings of Sunda often could not live there. The last king, Raja Mulya (Prabu Surya Kencana, the Nusiya Mulya of the Carita Parahyangan), moved his court west to Pulasari on the slopes of Mount Pulasari, and after 1576 the kingdom fell apart under Banten’s pressure. In 1579 Maulana Yusuf, sultan since 1570, took Pakuan, according to tradition after a guard opened the gates; the city was razed, and the sacred stone that served as the throne of the Sundanese kings was carried to Banten to become the throne of its sultans. Banten took over most of Sunda’s lands, while the regalia of the Sundanese kings were taken to Sumedang Larang in the east, whose ruler, Geusan Ulun, claimed Sunda’s succession until Mataram absorbed his principality. The Baduy of the Banten highlands, former subjects of Sunda, were left to keep their old religion.
: Slutet för det hinduiska kungariket Sunda på västra Java, vars huvudstad, Pakuan Pajajaran, nära dagens Bogor, intogs och förstördes av det muslimska sultanatet Banten 1579. Sunda hade förlorat sina viktigaste hamnar till Demaks och Cirebons styrkor 1527, när Fatahillah intog Sunda Kelapa och döpte om det till Jayakarta, och Banten, dittills en sundanesisk hamn, blev säte för ett nytt sultanat under Hasanuddin, en son till Sunan Gunungjati av Cirebon. Den sundanesiske kungen Surawisesa tillskrivs femton slag mot de muslimska styrkorna före en fred 1531, men anfallen återupptogs under hans efterträdare. På 1550-talet sände Hasanuddin sin son Maulana Yusuf mot Pakuan; dess murar och vallgravar höll, men Sundas kungar kunde ofta inte bo där. Den siste kungen, Raja Mulya (Prabu Surya Kencana, Carita Parahyangans Nusiya Mulya), flyttade sitt hov västerut till Pulasari på sluttningarna av berget Pulasari, och efter 1576 föll riket sönder under trycket från Banten. År 1579 intog Maulana Yusuf, sultan sedan 1570, Pakuan, enligt traditionen sedan en vakt hade öppnat portarna; staden jämnades med marken, och den heliga sten som hade tjänat som de sundanesiska kungarnas tron fördes till Banten för att bli dess sultaners tron. Banten övertog större delen av Sundas länder, medan de sundanesiska kungarnas regalier fördes till Sumedang Larang i öster, vars härskare, Geusan Ulun, gjorde anspråk på Sundas tronföljd tills Mataram uppslukade hans furstendöme. Baduyfolket i Bantens högland, Sundas forna undersåtar, fick behålla sin gamla religion.
