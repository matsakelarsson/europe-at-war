# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
Fall of Pegu and the Portuguese at Syriam: Pegus fall och portugiserna i Syriam
? The break-up of the Toungoo empire of Bayinnaung and its restoration from Ava. After the defeat at Nong Sarai (1593) Nanda Bayin lost the Tenasserim coast and the Mon country to Siam, Naresuan besieged Pegu in 1595, and Prome, Toungoo, Ava, Lan Na and Lan Xang broke away. In 1599 the lord of Toungoo, Minye Thihathu II, and King Min Razagyi of Arakan, whose fleet carried Portuguese mercenaries, besieged Pegu; Nanda surrendered on 19 December 1599 and was taken to Toungoo, where he was killed in 1600. The Arakanese burned the city and carried off its people and treasures, and a Siamese army arriving too late besieged Toungoo in vain. Filipe de Brito, the Portuguese whom Arakan left as governor of the port of Syriam, made it a Portuguese fort in 1603. Meanwhile Nyaungyan, Nanda’s half-brother, rebuilt the kingdom from Ava; his son Anaukpetlun took Prome (1608) and Toungoo (1610), and in 1613 took Syriam after a 36-day siege and had de Brito executed. Lower Burma was again united with the Irrawaddy valley, now ruled from Ava.
: Upplösningen av Bayinnaungs Toungoorike och dess återupprättande från Ava. Efter nederlaget vid Nong Sarai (1593) förlorade Nanda Bayin Tenasserimkusten och monernas land till Siam, Naresuan belägrade Pegu 1595, och Prome, Toungoo, Ava, Lan Na och Lan Xang bröt sig loss. År 1599 belägrade herren över Toungoo, Minye Thihathu II, och kung Min Razagyi av Arakan, vars flotta förde portugisiska legosoldater, Pegu; Nanda kapitulerade den 19 december 1599 och fördes till Toungoo, där han dödades 1600. Arakaneserna brände staden och förde bort dess invånare och skatter, och en siamesisk armé som kom för sent belägrade Toungoo förgäves. Filipe de Brito, den portugis som Arakan lämnade kvar som guvernör i hamnen Syriam, gjorde den till ett portugisiskt fort 1603. Under tiden byggde Nyaungyan, Nandas halvbror, upp riket igen från Ava; hans son Anaukpetlun intog Prome (1608) och Toungoo (1610), tog 1613 Syriam efter en belägring på 36 dagar och lät avrätta de Brito. Nedre Burma var åter förenat med Irrawaddydalen, som nu styrdes från Ava.
