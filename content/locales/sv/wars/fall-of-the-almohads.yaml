# Svenska översättningar av katalogtexten (våg 12); stegtexterna kommer senare.
Fall of the Almohads: Almohadernas fall
? "The break-up of the Almohad Caliphate, which had ruled the Maghreb and al-Andalus from Marrakesh, into the three kingdoms that shared North Africa for the next three centuries. After the defeat at Las Navas de Tolosa (1212) and the death of the young caliph Yusuf II in 1224, members of the ruling family fought each other for the throne. Idris al-Ma’mun brought the Almohad army over from Spain in 1228 with Castilian mercenaries, took Marrakesh and renounced the movement’s founding doctrine that Ibn Tumart had been the Mahdi. His governors and the Zenata Berber tribes used the chance to break away: the Hafsid governor Abu Zakariya made Ifriqiya an independent kingdom from Tunis in 1229, Yaghmurasen ibn Zayyan ruled Tlemcen from 1236, and the Marinids, who had been raiding north-eastern Morocco since about 1215, took Meknes (1244) and, after the caliph al-Said was killed near Oujda in 1248, Fez. The caliphs were left with Marrakesh and the High Atlas, until the Marinid Abu Yusuf Yaqub took Marrakesh in September 1269; the last Almohads were defeated at Tinmel in 1275."
: "Upplösningen av det almohadiska kalifatet, som från Marrakech hade härskat över Maghreb och al-Andalus, i de tre kungariken som delade Nordafrika mellan sig under de följande tre århundradena. Efter nederlaget vid Las Navas de Tolosa (1212) och den unge kalifen Yusuf II:s död 1224 stred medlemmar av härskarhuset med varandra om tronen. Idris al-Ma’mun förde 1228 över den almohadiska armén från Spanien med kastilianska legosoldater, intog Marrakech och tog avstånd från rörelsens grundläggande lära att Ibn Tumart hade varit mahdi. Hans guvernörer och de zenataberbiska stammarna tog tillfället i akt att bryta sig loss: den hafsidiske guvernören Abu Zakariya gjorde 1229 Ifriqiya till ett självständigt kungarike, styrt från Tunis, Yaghmurasen ibn Zayyan härskade över Tlemcen från 1236, och mariniderna, som sedan omkring 1215 hade gjort räder i nordöstra Marocko, intog Meknes (1244) och, sedan kalifen al-Said dödats nära Oujda 1248, Fès. Kaliferna hade kvar Marrakech och Höga Atlas, tills mariniden Abu Yusuf Yaqub intog Marrakech i september 1269; de sista almohaderna besegrades vid Tinmel 1275."
