# Svenska översättningar av katalogtexten (våg 12); stegtexterna kommer senare.
Fall of the Marinids: Marinidernas fall
? The overthrow of the last Marinid sultan of Morocco and the struggle for Fez that brought the Wattasids to power. From 1420 the Marinid sultan Abd al-Haqq II, put on the throne as a small child, was a figurehead for regents of the Wattasid family, a related Zenata lineage. In 1458 he massacred most of the Wattasids and ruled through a Jewish vizier, Harun ibn Battash, while the Portuguese held Ceuta and Ksar es-Seghir and Castile took Gibraltar in 1462. In May 1465, while the sultan was away, an insult to a woman of a sharifian (Prophet-descended) family started a riot in Fez; a preacher called for action against the Jews, the senior mufti approved a revolt, the Jewish quarter was attacked and the governor killed. The sharif Muhammad ibn Imran (al-Juti) was installed as ruler of the city, and when Abd al-Haqq returned he was killed, on 18 May 1465 according to one chronicler (23 May according to another). Whether a general massacre of the Jews of Fez took place is debated, since no Jewish source mentions it before the 19th century. Muhammad ibn Imran ruled Fez for six years and kept the surviving Wattasids out. One of them, Muhammad al-Shaykh, governor of Asilah, fought for the city from the north; to free his hands he made a truce with Portugal after it took Asilah and Tangier in August 1471, and he entered Fez in 1471 or 1472, founding the Wattasid sultanate.
: Störtandet av Marockos siste marinidiske sultan och kampen om Fès som förde wattasiderna till makten. Från 1420 var den marinidiske sultanen Abd al-Haqq II, som hade satts på tronen som litet barn, en gallionsfigur för regenter ur wattasidsläkten, en besläktad zenataätt. År 1458 lät han massakrera de flesta av wattasiderna och styrde genom en judisk vesir, Harun ibn Battash, medan portugiserna höll Ceuta och Ksar es-Seghir och Kastilien intog Gibraltar 1462. I maj 1465, medan sultanen var borta, utlöste en förolämpning mot en kvinna ur en sharifisk familj (ättlingar till Profeten) upplopp i Fès; en predikant manade till aktion mot judarna, den högste muftin godkände ett uppror, judekvarteret angreps och guvernören dödades. Sharifen Muhammad ibn Imran (al-Juti) insattes som stadens härskare, och när Abd al-Haqq återvände dödades han, den 18 maj 1465 enligt en krönikör (den 23 maj enligt en annan). Huruvida en allmän massaker på judarna i Fès ägde rum är omstritt, eftersom ingen judisk källa nämner den före 1800-talet. Muhammad ibn Imran härskade över Fès i sex år och höll de överlevande wattasiderna borta. En av dem, Muhammad al-Shaykh, guvernör i Asilah, kämpade om staden från norr; för att få fria händer slöt han stillestånd med Portugal sedan det hade intagit Asilah och Tanger i augusti 1471, och han tågade in i Fès 1471 eller 1472 och grundade det wattasidiska sultanatet.
