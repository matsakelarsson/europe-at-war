Fall of the Serbian Despotate: Serbiska despotatets fall
Mehmed II’s campaigns that ended medieval Serbia. In July 1454 he invaded the despotate of Đurađ Branković and besieged Smederevo, but withdrew when John Hunyadi approached; Hunyadi and the Serbs then beat the Ottoman force left at Kruševac, and the voivode Nikola Skobaljić won near Leskovac before he was defeated and executed in November. In 1455 the Ottomans took the south of the country, including the silver-mining town of Novo Brdo after a forty-day bombardment, and in 1456 they failed before Belgrade. After the deaths of Đurađ (1456) and his son Lazar (1458) the despotate was torn by quarrels among his heirs and squeezed by Hungary and Bosnia; Ottoman armies invaded again in 1458. In 1459 Stephen Tomašević, son of the Bosnian king, became despot, and when Mehmed arrived at Smederevo he handed the capital over without a fight on 20 June 1459.: Mehmed II:s fälttåg som gjorde slut på det medeltida Serbien. I juli 1454 invaderade han Đurađ Brankovićs despotat och belägrade Smederevo, men drog sig tillbaka när Johan Hunyadi närmade sig; Hunyadi och serberna slog sedan den osmanska styrka som lämnats kvar vid Kruševac, och vojvoden Nikola Skobaljić segrade nära Leskovac innan han besegrades och avrättades i november. År 1455 intog osmanerna landets södra del, däribland silvergruvstaden Novo Brdo efter fyrtio dagars beskjutning, och 1456 misslyckades de framför Belgrad. Efter Đurađs (1456) och hans son Lazars (1458) död slets despotatet sönder av strider mellan arvingarna och klämdes mellan Ungern och Bosnien; osmanska härar invaderade igen 1458. År 1459 blev Stefan Tomašević, son till den bosniske kungen, despot, och när Mehmed anlände till Smederevo överlämnade han huvudstaden utan strid den 20 juni 1459.
