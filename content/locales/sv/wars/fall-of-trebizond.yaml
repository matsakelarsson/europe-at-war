Fall of Trebizond: Trapezunts fall
Mehmed II’s campaign of 1461 against the Empire of Trebizond, the last Byzantine Greek state, on the Black Sea coast of Anatolia. Emperor David Megas Komnenos had refused tribute and relied on alliances with the Aq Qoyunlu ruler Uzun Hasan, Georgia and the Turkish lords of the north. Mehmed’s fleet sailed along the coast while his army forced the Candarid lord of Sinope to give up his realm, marched east, made peace with Uzun Hasan and crossed the Pontic mountains. Trebizond was blockaded by land and sea, and on 15 August 1461 David surrendered the city on terms. He and his family were given estates near Serres in Macedonia but were executed in Constantinople in 1463; many of the city’s people were deported to Constantinople or enslaved, and boys were taken for the janissaries.: Mehmed II:s fälttåg 1461 mot kejsardömet Trapezunt, den sista bysantinsk-grekiska staten, vid Anatoliens Svartahavskust. Kejsar David Megas Komnenos hade vägrat betala tribut och förlitat sig på allianser med Aq Qoyunlu-härskaren Uzun Hasan, Georgien och de turkiska furstarna i norr. Mehmeds flotta seglade längs kusten medan hans här tvingade den candaridiske herren av Sinope att ge upp sitt rike, tågade österut, slöt fred med Uzun Hasan och gick över de pontiska bergen. Trapezunt blockerades till lands och sjöss, och den 15 augusti 1461 överlämnade David staden på villkor. Han och hans familj fick gods nära Serres i Makedonien men avrättades i Konstantinopel 1463; många av stadens invånare deporterades till Konstantinopel eller förslavades, och pojkar togs till janitsjarkåren.
