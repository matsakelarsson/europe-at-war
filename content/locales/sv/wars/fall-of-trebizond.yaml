The Genoese port of Amasra (Amastris) was taken in 1459 or 1460, before the campaign; dates for the march differ between sources.: Den genuesiska hamnstaden Amasra (Amastris) intogs 1459 eller 1460, före fälttåget; dateringarna av marschen skiljer sig mellan källorna.
