# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
Fang La rebellion: Fang Las uppror
? The great rising in the lower Yangtze region led by Fang La, the owner of a lacquer-tree plantation from Qingxi county in Muzhou (today’s Chun’an in Zhejiang) or from neighbouring Shezhou. Under the emperor Huizong, the people of the region were burdened with heavy taxes and with the requisitions of the “flower and rock convoys”, which shipped rare plants and stones to the emperor’s gardens in Kaifeng. On 1 November 1120 Fang La rose, calling himself the Sage Lord and proclaiming an era of his own, Yongle. His followers, soon tens of thousands strong, destroyed a government army of 5,000, took Qingxi, Muzhou and Shezhou, and in late December 1120 took Hangzhou, where they killed the regional officials. At its height the rising held six prefectures and 52 counties in Zhejiang, Anhui and Jiangxi. The court called off the convoys and sent the eunuch Tong Guan south with the army gathered for the war against the Liao. In 1121 the government armies retook Hangzhou and the other towns and trapped Fang La in the Bangyuan caves near Qingxi, where Han Shizhong, a junior officer, captured him in the spring or early summer of 1121. He was executed in Kaifeng that autumn, and the last of his followers were defeated in eastern Zhejiang in the spring of 1122. Song writers said two million people died, a figure that is probably exaggerated. The rising delayed the Song attack on the Liao and was later linked, probably wrongly, with the Manichaeans.
: Den stora resningen i området kring nedre Yangtze, ledd av Fang La, ägare till en lackträdsplantage i Qingxis härad i Muzhou (dagens Chun’an i Zhejiang) eller i grannprefekturen Shezhou. Under kejsar Huizong tyngdes befolkningen i regionen av höga skatter och av rekvisitionerna för ”blomster- och stenkonvojerna”, som fraktade sällsynta växter och stenar till kejsarens trädgårdar i Kaifeng. Den 1 november 1120 reste sig Fang La, tog titeln Den vise herren och utropade en egen era, Yongle. Hans anhängare, snart tiotusentals, förintade en regeringsarmé på 5 000 man, intog Qingxi, Muzhou och Shezhou och i slutet av december 1120 Hangzhou, där de dödade de regionala ämbetsmännen. På sin höjdpunkt behärskade resningen sex prefekturer och 52 härad i Zhejiang, Anhui och Jiangxi. Hovet ställde in konvojerna och sände eunucken Tong Guan söderut med den armé som hade samlats för kriget mot Liao. År 1121 återtog regeringsarméerna Hangzhou och de andra städerna och stängde in Fang La i Bangyuangrottorna nära Qingxi, där Han Shizhong, en lägre officer, tillfångatog honom på våren eller försommaren 1121. Han avrättades i Kaifeng samma höst, och de sista av hans anhängare besegrades i östra Zhejiang våren 1122. Songförfattare uppgav att två miljoner människor dog, en siffra som troligen är överdriven. Resningen fördröjde Songrikets angrepp på Liao och sattes senare, troligen felaktigt, i samband med manikeerna.
