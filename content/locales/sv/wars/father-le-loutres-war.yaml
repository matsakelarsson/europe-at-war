# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
Father Le Loutre’s War: Fader Le Loutres krig
? A war in Nova Scotia between the British and the Mi’kmaq, Wolastoqiyik (Maliseet) and many Acadians, encouraged by New France and by the missionary Jean-Louis Le Loutre, in the years of nominal peace between Britain and France after 1748. In June 1749 Edward Cornwallis arrived with some 2,500 settlers and founded Halifax on Mi’kmaq land at Chebucto without any treaty with them; in September the Mi’kmaq wrote to him, through the missionary Pierre Maillard, that the land was theirs, and attacked woodcutters at Dartmouth. On 2 October 1749 Cornwallis’s council offered a bounty of ten guineas for every Mi’kmaq killed or captured, raised to fifty in 1750. Le Loutre urged the Acadians to leave British territory, and in 1750 he and his Mi’kmaq allies burned the village of Beaubassin so its people would move across the Missaguash River into French-held land. The British built Fort Lawrence on the Chignecto isthmus and the French faced it from Fort Beauséjour. Raids struck the new settlements around Halifax, Dartmouth (where about 20 settlers were killed in May 1751) and Lunenburg; the British officer Edward How was killed under a flag of truce in October 1750. Governor Peregrine Hopson made a peace treaty with the Mi’kmaq leader Jean-Baptiste Cope in 1752, but it did not hold. Between a third and almost half of the Acadians of the peninsula, by different estimates, moved to French-held Île Saint-Jean, Île Royale and the Chignecto isthmus. The war ended when a British and New England force took Fort Beauséjour on 16 June 1755, at the start of the French and Indian War, and the expulsion of the Acadians followed.
: Ett krig i Nova Scotia mellan britterna och mi’kmaq, wolastoqiyik (maliseet) och många akadier, uppmuntrade av Nya Frankrike och av missionären Jean-Louis Le Loutre, under åren av nominell fred mellan Storbritannien och Frankrike efter 1748. I juni 1749 anlände Edward Cornwallis med omkring 2 500 nybyggare och grundade Halifax på mi’kmaqfolkets land vid Chebucto utan något fördrag med dem; i september skrev mi’kmaq till honom, genom missionären Pierre Maillard, att landet var deras, och anföll skogshuggare vid Dartmouth. Den 2 oktober 1749 utlovade Cornwallis råd en belöning på tio guineas för varje mi’kmaq som dödades eller tillfångatogs, en summa som höjdes till femtio 1750. Le Loutre uppmanade akadierna att lämna brittiskt territorium, och 1750 brände han och hans allierade bland mi’kmaq byn Beaubassin för att dess invånare skulle flytta över Missaguashfloden till område som Frankrike behärskade. Britterna byggde Fort Lawrence på Chignectonäset, och fransmännen stod mot dem från Fort Beauséjour. Räder drabbade de nya bosättningarna kring Halifax, Dartmouth (där omkring 20 nybyggare dödades i maj 1751) och Lunenburg; den brittiske officeren Edward How dödades under parlamentärflagg i oktober 1750. Guvernör Peregrine Hopson slöt ett fredsfördrag med mi’kmaqledaren Jean-Baptiste Cope 1752, men det höll inte. Mellan en tredjedel och nästan hälften av halvöns akadier, enligt olika uppskattningar, flyttade till de franskkontrollerade områdena Île Saint-Jean, Île Royale och Chignectonäset. Kriget slutade när en brittisk styrka med trupper från New England intog Fort Beauséjour den 16 juni 1755, i början av fransk-indianska kriget, och fördrivningen av akadierna följde.
