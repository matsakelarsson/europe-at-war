# Svenska översättningar av katalogtexten (våg 12); stegtexterna kommer senare.
Fatimid conquest of Egypt: Fatimidernas erövring av Egypten
"The Fatimid caliphs’ fifty-year effort to take Egypt, the gateway to Syria and Iraq, from the Abbasid caliphate and its governors. Two invasions led by the heir al-Qa’im took Barqa and Alexandria and reached the Fayyum, but failed before Fustat, the capital: the Kutama army was beaten at Giza in December 914 and January 915, and in 919–921 its fleet was destroyed off Abukir and the army had to retreat across the desert. Half a century later, with Egypt weakened by years of low Nile floods and famine and leaderless after the death of the regent Kafur in 968, the caliph al-Mu’izz sent his general Jawhar with a large, well-paid army. It left Ifriqiya in February 969, occupied Alexandria without a fight, forced the crossing of the Nile at Giza on 3 July and took Fustat on 6 July. Jawhar founded a new palace city beside it, which became al-Qahira, Cairo; al-Mu’izz moved there in 973, and Egypt was the centre of the Fatimid caliphate until 1171.": "Fatimidkalifernas femtioåriga strävan att ta Egypten, porten till Syrien och Irak, från det abbasidiska kalifatet och dess guvernörer. Två invasioner under tronarvingen al-Qa’im intog Barqa och Alexandria och nådde Fayyum, men misslyckades framför huvudstaden Fustat: kutamaarmén besegrades vid Giza i december 914 och januari 915, och 919–921 förintades dess flotta utanför Abukir och armén tvingades retirera genom öknen. Ett halvsekel senare, när Egypten var försvagat av flera år av låga nilöversvämningar och hungersnöd och stod utan ledare efter regenten Kafurs död 968, sände kalifen al-Mu’izz sin fältherre Jawhar med en stor och välavlönad armé. Den lämnade Ifriqiya i februari 969, besatte Alexandria utan strid, forcerade Nilen vid Giza den 3 juli och intog Fustat den 6 juli. Jawhar grundade en ny palatsstad intill, som blev al-Qahira, Kairo; al-Mu’izz flyttade dit 973, och Egypten var det fatimidiska kalifatets centrum fram till 1171."
