# Svenska översättningar av katalogtexten (våg 12); stegtexterna kommer senare.
Fatimid conquest of Ifriqiya: Fatimidernas erövring av Ifriqiya
"The overthrow of the Aghlabid emirs of Ifriqiya by the Ismaili missionary Abu Abdallah al-Shi’i and the Kutama Berbers of Lesser Kabylia, which brought the Fatimid caliphate to power. Abu Abdallah had lived among the Kutama since 893, preaching the coming of the Mahdi, a hidden imam descended from the Prophet’s daughter Fatima. From 902 his Kutama army took the Aghlabid fortress towns of the west one by one: Mila, Sétif (904), Tobna (906), Belezma and Baghaya (907). On 18 March 909 it destroyed the last Aghlabid army at al-Urbus (Laribus); the emir Ziyadat Allah III fled to Egypt, and a week later Abu Abdallah entered the palace city of Raqqada. In the summer he marched west, ended the Rustamid imamate of Tahert and on 26 August 909 freed the Ismaili imam Abdallah from house arrest at Sijilmasa. Proclaimed caliph as al-Mahdi, Abdallah reached Raqqada in January 910; in 911 he had Abu Abdallah killed. The dynasty he founded would rule Ifriqiya and Sicily and, from 969, Egypt.": "Störtandet av Ifriqiyas aghlabidiska emirer genom den ismailitiske missionären Abu Abdallah al-Shi’i och kutamaberberna i Lilla Kabylien, som förde det fatimidiska kalifatet till makten. Abu Abdallah hade levt bland kutamaberberna sedan 893 och predikat att mahdin skulle komma, en dold imam som härstammade från Profetens dotter Fatima. Från 902 intog hans kutamaarmé en efter en de aghlabidiska fästningsstäderna i väster: Mila, Sétif (904), Tobna (906), Belezma och Baghaya (907). Den 18 mars 909 förintade den den sista aghlabidiska armén vid al-Urbus (Laribus); emiren Ziyadat Allah III flydde till Egypten, och en vecka senare tågade Abu Abdallah in i palatsstaden Raqqada. Under sommaren marscherade han västerut, gjorde slut på rustamidernas imamat i Tahert och befriade den 26 augusti 909 den ismailitiske imamen Abdallah ur husarrest i Sijilmasa. Abdallah, som utropades till kalif under namnet al-Mahdi, nådde Raqqada i januari 910; 911 lät han döda Abu Abdallah. Den dynasti han grundade skulle komma att härska över Ifriqiya och Sicilien och från 969 över Egypten."
