# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
Fédon’s Rebellion: Fédons uppror
? The rising of 1795–1796 against British rule in Grenada, led by Julien Fédon, a planter of mixed African and French descent who owned the Belvidere estate in the mountains of the interior. Grenada had been French until 1763 and again in 1779–1783, and its French-speaking Catholic and free coloured inhabitants suffered under British laws that excluded them from office and restricted their rights. Encouraged and armed by Victor Hugues, the commissioner of the French Republic in Guadeloupe, which had abolished slavery in 1794, Fédon and his followers attacked Grenville and Gouyave on the night of 2 March 1795 and captured the lieutenant governor, Ninian Home. Thousands of enslaved people joined them; the historian Kit Candlin estimates about 12,500, half of the enslaved population. After a failed British attack on his fortified camp on 8 April, Fédon had most of his hostages killed, among them Home. For more than a year the insurgents held almost all the island except St George’s, beating off attacks on Belvidere and taking the British posts on the east coast in early 1796. British reinforcements under Brigadier-General Oliver Nicolls began to turn the war in March 1796, and when Sir Ralph Abercromby’s expedition arrived in June, British troops stormed Fédon’s camp on 19 June 1796. Fédon was never found. Dozens of leaders were executed after summary trials, and hundreds more were condemned; about 7,000 enslaved people, a quarter of the island’s enslaved population, died in the revolt, and damage was put at £2.5 million.
: Resningen 1795–1796 mot det brittiska styret på Grenada, ledd av Julien Fédon, en plantageägare av blandad afrikansk och fransk härkomst som ägde plantagen Belvidere i bergen i inlandet. Grenada hade varit franskt fram till 1763 och åter 1779–1783, och öns franskspråkiga katolska och fria färgade invånare led under brittiska lagar som utestängde dem från ämbeten och inskränkte deras rättigheter. Uppmuntrade och beväpnade av Victor Hugues, kommissarie på Guadeloupe för Franska republiken, som hade avskaffat slaveriet 1794, anföll Fédon och hans anhängare Grenville och Gouyave natten den 2 mars 1795 och tillfångatog viceguvernören Ninian Home. Tusentals förslavade anslöt sig till dem; historikern Kit Candlin uppskattar omkring 12 500, hälften av den förslavade befolkningen. Efter ett misslyckat brittiskt anfall mot hans befästa läger den 8 april lät Fédon döda större delen av gisslan, bland dem Home. I mer än ett år behärskade upprorsmännen nästan hela ön utom St George’s, slog tillbaka anfall mot Belvidere och tog de brittiska posteringarna på östkusten i början av 1796. Brittiska förstärkningar under brigadgeneral Oliver Nicolls började vända kriget i mars 1796, och när sir Ralph Abercrombys expedition anlände i juni stormade brittiska trupper Fédons läger den 19 juni 1796. Fédon återfanns aldrig. Dussintals ledare avrättades efter summariska rättegångar, och hundratals fler dömdes; omkring 7 000 förslavade, en fjärdedel av öns förslavade befolkning, dog under upproret, och skadorna beräknades till 2,5 miljoner pund.
