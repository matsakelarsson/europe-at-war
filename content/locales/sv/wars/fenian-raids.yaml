# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
Fenian raids: Feniernas räder
? Armed raids from the United States into British North America by the Fenian Brotherhood, an Irish-American organisation that aimed to seize Canada and hold it hostage to force Britain to grant Ireland its independence. Many Fenians were veterans of the American Civil War. After a failed attempt on Campobello Island in New Brunswick in April 1866, John O’Neill crossed the Niagara River on 1 June 1866 with about a thousand men, defeated the Canadian militia at Ridgeway and Fort Erie the next day, and withdrew to the United States, where the US Navy intercepted his men. A second force entered Quebec at Pigeon Hill on 7 June and retreated within two days. The US government, which had tolerated the Fenians’ preparations, then enforced its neutrality laws. In May 1870 Canadian militia beat back Fenian raids at Eccles Hill and Trout River, and in October 1871 a small party under O’Neill seized a Hudson’s Bay Company post at Pembina, on the border of the new province of Manitoba, which turned out to be on American soil, and was arrested by US troops. The raids cost several dozen lives on both sides, and the danger they showed helped bring about the confederation of Canada in 1867.
: Väpnade räder från USA in i Brittiska Nordamerika av Feniska brödraskapet (Fenian Brotherhood), en irländsk-amerikansk organisation som ville erövra Kanada och hålla det som gisslan för att tvinga Storbritannien att ge Irland dess självständighet. Många fenier var veteraner från amerikanska inbördeskriget. Efter ett misslyckat försök mot Campobello Island i New Brunswick i april 1866 gick John O’Neill över Niagarafloden den 1 juni 1866 med omkring tusen man, besegrade den kanadensiska milisen vid Ridgeway och Fort Erie dagen därpå och drog sig tillbaka till USA, där den amerikanska flottan genskjöt hans män. En andra styrka gick in i Québec vid Pigeon Hill den 7 juni och drog sig tillbaka inom två dagar. Den amerikanska regeringen, som hade tolererat feniernas förberedelser, började då upprätthålla sina neutralitetslagar. I maj 1870 slog kanadensisk milis tillbaka feniernas räder vid Eccles Hill och Trout River, och i oktober 1871 intog en liten grupp under O’Neill en handelsstation tillhörande Hudson’s Bay Company i Pembina, vid gränsen till den nya provinsen Manitoba, som visade sig ligga på amerikansk mark, och greps av amerikanska trupper. Räderna kostade flera dussin liv på båda sidor, och den fara de blottlade bidrog till att Kanadas konfederation kom till stånd 1867.
