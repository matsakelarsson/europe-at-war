Fernandine Wars: Fernandinska krigen
Three wars between Ferdinand I of Portugal and the Trastámara kings of Castile, fought over Ferdinand’s claim to the Castilian throne after the murder of Peter I in 1369 and tied to the Hundred Years’ War. The first (1369–1371) ended with the Peace of Alcoutim. In the second (1372–1373), after Ferdinand allied with John of Gaunt, Henry II invaded Portugal, besieged Lisbon and burned part of the city; by the Treaty of Santarém Portugal had to side with Castile and France, and Ferdinand built new walls around Lisbon. In the third (1381–1382) an English army under the Earl of Cambridge came to Portugal, but the Castilian fleet destroyed the Portuguese at Saltés in July 1381, and Ferdinand made peace at Elvas in 1382. His daughter Beatrice was married to John I of Castile, which led to the crisis of 1383–1385.: Tre krig mellan Ferdinand I av Portugal och Kastiliens kungar av huset Trastámara, som fördes om Ferdinands anspråk på den kastilianska tronen efter mordet på Peter I 1369 och var knutna till hundraåriga kriget. Det första (1369–1371) slutade med freden i Alcoutim. I det andra (1372–1373), sedan Ferdinand allierat sig med Johan av Gent, invaderade Henrik II Portugal, belägrade Lissabon och brände en del av staden; genom fördraget i Santarém tvingades Portugal ställa sig på Kastiliens och Frankrikes sida, och Ferdinand lät bygga nya murar kring Lissabon. I det tredje (1381–1382) kom en engelsk här under earlen av Cambridge till Portugal, men den kastilianska flottan förintade den portugisiska vid Saltés i juli 1381, och Ferdinand slöt fred i Elvas 1382. Hans dotter Beatrix gifte sig med Johan I av Kastilien, vilket ledde till krisen 1383–1385.
