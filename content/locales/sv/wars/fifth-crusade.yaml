The crusade called at the Fourth Lateran Council of 1215 began in 1217, when Andrew II of Hungary and Leopold VI of Austria led an army to Acre and raided Ayyubid lands in Galilee and beyond the Jordan without lasting result. In May 1218, joined by fleets from Frisia and the Rhineland, the crusaders sailed for Egypt, the centre of Ayyubid power, under John of Brienne, king of Jerusalem, and besieged Damietta at the mouth of the Nile. On 24 August they took the Chain Tower that barred the river, news that is said to have hastened the death of Sultan al-Adil a week later.: Korståget som utlystes vid fjärde Laterankonciliet 1215 inleddes 1217, när Andreas II av Ungern och Leopold VI av Österrike ledde en här till Akko och härjade ayyubidiska länder i Galileen och bortom Jordan utan bestående resultat. I maj 1218 seglade korsfararna, förstärkta av flottor från Frisland och Rhenlandet, till Egypten, centrum för den ayyubidiska makten, under Johan av Brienne, kung av Jerusalem, och belägrade Damietta vid Nilens mynning. Den 24 augusti intog de Kedjetornet som spärrade floden, en nyhet som sägs ha påskyndat sultanen al-Adils död en vecka senare.
The siege lasted more than a year, through floods and disease. The papal legate Pelagius, who arrived in September 1218, claimed the leadership and rejected the new sultan al-Kamil’s offer to give up Jerusalem and much of the old kingdom in exchange for Damietta. An attack on the Egyptian camp at Fariskur on 29 August 1219 was beaten back with heavy losses. Francis of Assisi crossed the lines that autumn to preach before al-Kamil, who received him courteously. On 5 November 1219 the crusaders entered Damietta to find most of its people dead of hunger and disease.: Belägringen varade i mer än ett år, genom översvämningar och sjukdomar. Den påvlige legaten Pelagius, som anlände i september 1218, gjorde anspråk på ledarskapet och avvisade den nye sultanen al-Kamils erbjudande att ge upp Jerusalem och stora delar av det gamla kungariket i utbyte mot Damietta. Ett anfall mot det egyptiska lägret vid Fariskur den 29 augusti 1219 slogs tillbaka med svåra förluster. Franciskus av Assisi gick den hösten över linjerna för att predika inför al-Kamil, som tog emot honom artigt. Den 5 november 1219 gick korsfararna in i Damietta och fann att de flesta av invånarna hade dött av svält och sjukdomar.
