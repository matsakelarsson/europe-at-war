Frisian and German crusaders took the tower in the Nile, which held a chain across the river, from ships fitted with a siege ladder.: Frisiska och tyska korsfarare intog tornet i Nilen, som höll en kedja tvärs över floden, från fartyg utrustade med en stormstege.
29 August 1219: 29 augusti 1219
The crusaders marched on al-Kamil’s camp in the heat of summer; when part of the army broke, the Egyptians counter-attacked and killed or captured thousands.: Korsfararna marscherade mot al-Kamils läger i sommarhettan; när en del av hären bröt samman gick egyptierna till motanfall och dödade eller tillfångatog tusentals.
The starving city fell almost without resistance. Of tens of thousands of inhabitants only a few thousand were still alive.: Den svältande staden föll nästan utan motstånd. Av tiotusentals invånare var bara några tusen fortfarande i livet.
