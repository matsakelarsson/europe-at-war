al-Kamil: al-Kamil
For a year and a half the crusaders waited at Damietta for the emperor Frederick II, who had promised to come. Instead he sent troops under Duke Louis of Bavaria, who arrived in May 1221. In July, against John of Brienne’s advice, Pelagius led the army south towards Cairo, just as the Nile began its annual flood. Al-Kamil’s army waited behind a branch of the Nile at al-Mansurah, the camp town he had founded, and his brothers brought reinforcements from Syria.: I ett och ett halvt år väntade korsfararna i Damietta på kejsar Fredrik II, som hade lovat att komma. I stället sände han trupper under hertig Ludvig av Bayern, som anlände i maj 1221. I juli ledde Pelagius, mot Johan av Briennes råd, hären söderut mot Kairo, just som Nilen började sin årliga översvämning. Al-Kamils här väntade bakom en gren av Nilen vid al-Mansura, den lägerstad han hade grundat, och hans bröder förde förstärkningar från Syrien.
By late August the crusaders were trapped. The Egyptians broke the dykes and flooded the land around them, and their ships cut the river behind. Starving and stuck in the mud, the army surrendered on about 30 August 1221. In return for being allowed to leave, the crusaders gave up Damietta and agreed to an eight-year truce, and al-Kamil promised to return the relic of the True Cross, which could not be found. The crusaders sailed away in September having gained nothing, and many blamed Frederick for staying away.: I slutet av augusti var korsfararna instängda. Egyptierna bröt upp dammvallarna och dränkte landet runt dem, och deras fartyg skar av floden bakom dem. Svältande och fast i gyttjan kapitulerade hären omkring den 30 augusti 1221. I utbyte mot att få ge sig av överlämnade korsfararna Damietta och gick med på ett åttaårigt stillestånd, och al-Kamil lovade att återlämna reliken av det sanna korset, som inte gick att finna. Korsfararna seglade bort i september utan att ha vunnit något, och många skyllde på Fredrik för att han uteblivit.
