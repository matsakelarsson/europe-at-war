Dates are Julian. The crusade had no single leader. John of Brienne, king of Jerusalem, commanded in the field, but the papal legate Pelagius of Albano claimed authority over the army, and their disputes shaped its decisions.: Datumen anges enligt den julianska kalendern. Korståget hade ingen enskild ledare. Johan av Brienne, kung av Jerusalem, förde befälet i fält, men den påvlige legaten Pelagius av Albano gjorde anspråk på myndighet över hären, och deras tvister präglade dess beslut.
The Hungarian and Austrian campaign of 1217–1218 in Syria under Andrew II of Hungary and Leopold VI of Austria is often counted as the first part of the crusade.: Det ungerska och österrikiska fälttåget 1217–1218 i Syrien under Andreas II av Ungern och Leopold VI av Österrike räknas ofta som korstågets första del.
