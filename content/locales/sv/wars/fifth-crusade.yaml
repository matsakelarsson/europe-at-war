Fifth Crusade: Femte korståget
A crusade called by Pope Innocent III to recover Jerusalem by conquering Egypt. After a Hungarian and Austrian expedition in Syria in 1217, the crusaders took Damietta in the Nile delta in 1219 after a siege of a year and a half, refusing the sultan al-Kamil’s offer to trade it for Jerusalem. Their march on Cairo in 1221 was trapped by the Nile flood near al-Mansurah, and they gave up Damietta in exchange for their freedom and an eight-year truce.: Ett korståg som påven Innocentius III utlyste för att återvinna Jerusalem genom att erövra Egypten. Efter en ungersk och österrikisk expedition i Syrien 1217 intog korsfararna Damietta i Nildeltat 1219 efter en belägring på ett och ett halvt år och avvisade sultanen al-Kamils erbjudande att byta staden mot Jerusalem. Deras marsch mot Kairo 1221 fångades av Nilens översvämning nära al-Mansura, och de gav upp Damietta i utbyte mot sin frihet och ett åttaårigt stillestånd.
