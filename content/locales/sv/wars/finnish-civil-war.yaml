The war has had several names in Finland, among them the War of Liberation, the Red Rebellion, the Class War and the Civil War, depending on the speaker’s side.: Kriget har haft flera namn i Finland, bland dem frihetskriget, det röda upproret, klasskriget och inbördeskriget, beroende på vilken sida den talande stod på.
Places are named in Finnish. Viipuri is today Vyborg in Russia, Tammisaari is Ekenäs in Swedish, and Helsinki was Helsingfors to Swedish speakers.: Orterna anges här med sina svenska namn. Viborg (Viipuri) ligger i dag i Ryssland, Ekenäs heter Tammisaari på finska och Helsingfors heter Helsinki på finska.
