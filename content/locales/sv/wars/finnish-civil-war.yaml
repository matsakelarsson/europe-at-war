Finland had declared independence on 6 December 1917, but the country was split. Workers’ Red Guards and the bourgeois Civil Guards, the Whites, had armed themselves through 1917, and tens of thousands of Russian soldiers were still in the country, though few would fight. On 27 January 1918 the Reds lit a red lantern in the tower of the Helsinki Workers’ Hall as a signal and took over the capital, and a People’s Delegation under Kullervo Manner replaced the Senate. The same night Mannerheim’s Whites began disarming the Russian garrisons in Ostrobothnia, and part of the Senate escaped to Vaasa, which became the White capital.: Finland hade förklarat sig självständigt den 6 december 1917, men landet var splittrat. Arbetarnas röda garden och de borgerliga skyddskårerna, de vita, hade beväpnat sig under 1917, och tiotusentals ryska soldater fanns fortfarande i landet, även om få av dem ville strida. Den 27 januari 1918 tände de röda en röd lykta i tornet på Arbetarhuset i Helsingfors som signal och tog över huvudstaden, och en folkdelegation under Kullervo Manner ersatte senaten. Samma natt började Mannerheims vita avväpna de ryska garnisonerna i Österbotten, och en del av senaten flydde till Vasa, som blev de vitas huvudstad.
The front soon settled across southern Finland, from the Gulf of Bothnia north of Pori past Tampere and along the lakes to the Karelian Isthmus. The Reds held the industrial south, with Helsinki, Turku, Tampere and Viipuri, and the Whites the rural north and centre. Both sides lacked trained officers. The Whites had Swedish volunteers and the Jäger battalion trained in Germany, most of whom landed at Vaasa on 25 February, while the Reds got weapons and some help from Russian soldiers. Both sides killed opponents behind the lines, and after taking Varkaus the Whites shot Red prisoners on the ice at Huruslahti, some reportedly chosen by lot.: Fronten stabiliserades snart tvärs över södra Finland, från Bottniska viken norr om Björneborg förbi Tammerfors och längs sjöarna till Karelska näset. De röda höll det industrialiserade södra Finland med Helsingfors, Åbo, Tammerfors och Viborg, och de vita den agrara norra och mellersta delen. Båda sidor saknade utbildade officerare. De vita hade svenska frivilliga och den i Tyskland utbildade jägarbataljonen, vars flesta medlemmar landsteg i Vasa den 25 februari, medan de röda fick vapen och viss hjälp av ryska soldater. Båda sidor dödade motståndare bakom linjerna, och sedan de vita intagit Varkaus sköt de röda fångar på isen vid Huruslahti, en del enligt uppgift utvalda genom lottdragning.
