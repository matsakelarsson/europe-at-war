Finnish Civil War: Finska inbördeskriget
A war between the socialist Reds and the conservative Whites for the leadership of newly independent Finland, fought from January to May 1918. The Whites under Carl Gustaf Emil Mannerheim, helped by German troops, won; about 38,000 people died, among them some 12,500 Red prisoners who perished in camps after the fighting.: Ett krig mellan de socialistiska röda och de konservativa vita om ledningen av det nyss självständiga Finland, utkämpat från januari till maj 1918. De vita under Carl Gustaf Emil Mannerheim segrade med hjälp av tyska trupper; omkring 38 000 människor dog, bland dem omkring 12 500 röda fångar som omkom i läger efter striderna.
