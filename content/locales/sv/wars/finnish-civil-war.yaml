In mid-March Mannerheim attacked Tampere, Finland’s main industrial town, held by about 15,000 Red Guards. Some 16,000 Whites, among them Jägers and Swedish volunteers, surrounded the town and fought their way in street by street in the bloodiest battle of the war. Red attempts to break the siege along the railway from the south failed, and on 6 April the last Reds surrendered at Pyynikki and Pispala. About 11,000 were captured and hundreds shot, and much of the town lay in ruins.: I mitten av mars anföll Mannerheim Tammerfors, Finlands viktigaste industristad, som hölls av omkring 15 000 rödgardister. Omkring 16 000 vita, bland dem jägare och svenska frivilliga, omringade staden och kämpade sig in gata för gata i krigets blodigaste slag. Röda försök att bryta belägringen längs järnvägen från söder misslyckades, och den 6 april kapitulerade de sista röda vid Pyynikki och Pispala. Omkring 11 000 togs till fånga och hundratals sköts, och stora delar av staden låg i ruiner.
The White government had asked Germany for help. On 3 April the Baltic Sea Division of about 10,000 men under General Rüdiger von der Goltz landed at Hanko and marched on Helsinki, which it took on 12–13 April with the help of local Whites. On 7 April another 3,000 Germans under Colonel Otto von Brandenstein landed at Loviisa and struck inland. Germany expected influence in return. In October 1918 a Finnish parliament without its socialist members elected a German prince, Frederick Charles of Hesse, king, but he gave up the throne after Germany’s defeat.: Den vita regeringen hade bett Tyskland om hjälp. Den 3 april landsteg Östersjödivisionen, omkring 10 000 man under general Rüdiger von der Goltz, i Hangö och marscherade mot Helsingfors, som den intog den 12–13 april med hjälp av lokala vita. Den 7 april landsteg ytterligare 3 000 tyskar under överste Otto von Brandenstein i Lovisa och gick till anfall inåt landet. Tyskland väntade sig inflytande i gengäld. I oktober 1918 valde en finsk riksdag utan sina socialistiska ledamöter en tysk prins, Fredrik Karl av Hessen, till kung, men han avsade sig tronen efter Tysklands nederlag.
