As the Red front collapsed, columns of Red Guards and their families tried to escape east towards Russia. German troops had taken Lahti on 19 April, and around it some 30,000 people were trapped and surrendered on 1–2 May. In Karelia the Whites stormed Viipuri on 29 April, after the Red leaders had fled by sea to Petrograd. In Viipuri the Whites shot hundreds of captured Reds and, in the following days, some 360–420 Russian civilians and soldiers, killed for being Russian. The last Reds gave up in Kymenlaakso in early May, and on 16 May Mannerheim led a victory parade through Helsinki.: När den röda fronten bröt samman försökte kolonner av rödgardister och deras familjer fly österut mot Ryssland. Tyska trupper hade intagit Lahtis den 19 april, och i trakten där blev omkring 30 000 människor instängda och kapitulerade den 1–2 maj. I Karelen stormade de vita Viborg den 29 april, sedan de röda ledarna flytt sjövägen till Petrograd. I Viborg sköt de vita hundratals tillfångatagna röda och under de följande dagarna omkring 360–420 ryska civila och soldater, som dödades för att de var ryssar. De sista röda gav upp i Kymmenedalen i början av maj, och den 16 maj ledde Mannerheim en segerparad genom Helsingfors.
About 80,000 Reds, among them women, children and Russians, were held in camps such as Suomenlinna, Tammisaari, Hämeenlinna, Lahti and Tampere. Hunger and disease swept the camps, and about 12,500 prisoners died there. The White Terror killed about 9,000 Reds, and the Red Terror about 1,500 Whites. Some 38,000 people died in the war in all, in a country of three million. Most prisoners were released on parole within a year or two, but the bitterness between the two sides marked Finnish politics for a generation.: Omkring 80 000 röda, bland dem kvinnor, barn och ryssar, hölls i läger som Sveaborg, Ekenäs, Tavastehus, Lahtis och Tammerfors. Svält och sjukdomar härjade i lägren, och omkring 12 500 fångar dog där. Den vita terrorn dödade omkring 9 000 röda och den röda terrorn omkring 1 500 vita. Sammanlagt dog omkring 38 000 människor i kriget, i ett land med tre miljoner invånare. De flesta fångar friades villkorligt inom ett eller två år, men bitterheten mellan de två sidorna präglade finsk politik i en generation.
