Finnish War: Finska kriget
A war in which Russia, then allied with Napoleon, conquered Finland from Sweden, while Denmark–Norway attacked Sweden from the west. By the Treaty of Fredrikshamn in 1809 Sweden lost Finland and Åland, which became a grand duchy under the Russian tsar.: Ett krig där Ryssland, då allierat med Napoleon, erövrade Finland från Sverige, medan Danmark–Norge angrep Sverige från väster. Genom freden i Fredrikshamn 1809 förlorade Sverige Finland och Åland, som blev ett storfurstendöme under den ryske tsaren.
