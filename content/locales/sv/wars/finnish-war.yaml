"In March 1809 Russian armies crossed the frozen Gulf of Bothnia: to Åland, across the Kvarken to Umeå under Barclay de Tolly, and around the north of the gulf at Torneå. In Stockholm, officers overthrew Gustav IV Adolf on 7 March, and his uncle became king as Charles XIII.": "I mars 1809 gick ryska arméer över den frusna Bottniska viken: till Åland, över Kvarken till Umeå under Barclay de Tolly och runt vikens norra del vid Torneå. I Stockholm störtade officerare Gustav IV Adolf den 7 mars, och hans farbror blev kung som Karl XIII."
A last Swedish counterstroke landed at Ratan north of Umeå, but after hard fighting at Sävar and Ratan on 19–20 August, the last battles fought in Sweden, the Swedes withdrew. By the Treaty of Fredrikshamn on 17 September 1809 Sweden gave up all of Finland and Åland, about a third of its territory. Peace with Denmark followed at Jönköping in December.: En sista svensk motstöt landsteg vid Ratan norr om Umeå, men efter hårda strider vid Sävar och Ratan den 19–20 augusti, de sista slagen som utkämpats i Sverige, drog sig svenskarna tillbaka. Genom freden i Fredrikshamn den 17 september 1809 avträdde Sverige hela Finland och Åland, ungefär en tredjedel av sitt territorium. Freden med Danmark följde i Jönköping i december.
