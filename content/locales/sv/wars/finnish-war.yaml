After the Peace of Tilsit, Russia, now Napoleon’s ally, invaded Finland on 21 February 1808 to force Sweden into his blockade of Britain. The Swedish army fell back north, and in May the great sea fortress of Sveaborg outside Helsingfors surrendered after a short siege. Its commander, Carl Olof Cronstedt, was branded a traitor.: Efter freden i Tilsit invaderade Ryssland, nu Napoleons allierade, Finland den 21 februari 1808 för att tvinga Sverige att ansluta sig till hans blockad av Storbritannien. Den svenska armén drog sig tillbaka norrut, och i maj kapitulerade den stora sjöfästningen Sveaborg utanför Helsingfors efter en kort belägring. Dess befälhavare, Carl Olof Cronstedt, stämplades som förrädare.
In the north the Swedish-Finnish army struck back, winning at Siikajoki and Revolax in April and at Lapua in July, but on 14 September 1808 the Russians won the war’s bloodiest battle at Oravais. Denmark–Norway had also declared war on Sweden in March. On the Norwegian border the Swedes won at Lier in April but lost at Prestebakke in June.: I norr slog den svensk-finska armén tillbaka med segrar vid Siikajoki och Revolax i april och vid Lappo i juli, men den 14 september 1808 vann ryssarna krigets blodigaste slag vid Oravais. Danmark–Norge hade också förklarat Sverige krig i mars. Vid den norska gränsen segrade svenskarna vid Lier i april men förlorade vid Prestebakke i juni.
