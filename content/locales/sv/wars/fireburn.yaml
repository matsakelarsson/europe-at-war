# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
Fireburn: Fireburn
? "A rising of plantation labourers on Saint Croix in the Danish West Indies, now part of the United States Virgin Islands. Denmark had abolished slavery in its West Indian islands in 1848, but the Labour Act of 1849 bound the freed people to the estates on yearly contracts at a fixed day wage and let them change employer only once a year, on Contract Day, 1 October. On that day in 1878 crowds of labourers who had come into Frederiksted heard a rumour, which proved false, that Henry Trotman, a labourer injured by the police, had died in hospital. The police and soldiers withdrew into the fort, which the crowd failed to storm, and that night buildings across the town were set on fire and shops were looted. Soldiers arrived from Christiansted the next morning, but for days fires spread across the western part of the island, and about 50 plantations and more than half of Frederiksted were destroyed. The governor, Janus August Garde, declined help offered by British, French and American warships, and by mid-October the rising was over. About 100 labourers were killed, most of them shot by soldiers, against two soldiers and one planter; 12 men were sentenced to death and shot at once, and about 40 people were convicted later. Among them were the women remembered as the leaders, the “queens”: Mary Thomas (“Queen Mary”), Axeline Elizabeth Salomon (“Queen Agnes”) and Mathilda McBean (“Queen Mathilda”), with Susanna Abrahamson. Their death sentences were commuted by the king, and several served their terms in the women’s prison of Christianshavn in Copenhagen in 1882–1887. The rising brought slightly higher wages; Denmark sold the islands to the United States in 1917. In 2018 a statue of Mary Thomas, I Am Queen Mary, was unveiled in Copenhagen."
: "En resning bland plantagearbetare på Saint Croix i Danska Västindien, i dag en del av Amerikanska Jungfruöarna. Danmark hade avskaffat slaveriet på sina västindiska öar 1848, men arbetslagen från 1849 band de frigivna vid plantagerna genom årskontrakt till en fast dagslön och lät dem byta arbetsgivare bara en gång om året, på kontraktsdagen den 1 oktober. Den dagen 1878 hörde folkmassor av arbetare som hade kommit in till Frederiksted ett rykte, som visade sig vara falskt, om att Henry Trotman, en arbetare som hade skadats av polisen, hade dött på sjukhuset. Polisen och soldaterna drog sig tillbaka in i fortet, som folkmassan misslyckades med att storma, och samma natt sattes byggnader runtom i staden i brand och butiker plundrades. Soldater anlände från Christiansted nästa morgon, men i flera dagar spred sig bränderna över öns västra del, och omkring 50 plantager och mer än halva Frederiksted förstördes. Guvernören, Janus August Garde, avböjde den hjälp som erbjöds av brittiska, franska och amerikanska örlogsfartyg, och i mitten av oktober var resningen över. Omkring 100 arbetare dödades, de flesta skjutna av soldater, mot två soldater och en plantageägare; 12 män dömdes till döden och sköts omedelbart, och omkring 40 personer dömdes senare. Bland dem fanns de kvinnor som ihågkoms som ledarna, ”drottningarna”: Mary Thomas (”Queen Mary”), Axeline Elizabeth Salomon (”Queen Agnes”) och Mathilda McBean (”Queen Mathilda”), samt Susanna Abrahamson. Deras dödsdomar omvandlades av kungen, och flera avtjänade sina straff i kvinnofängelset på Christianshavn i Köpenhamn 1882–1887. Resningen gav något högre löner; Danmark sålde öarna till USA 1917. År 2018 avtäcktes en staty av Mary Thomas, I Am Queen Mary, i Köpenhamn."
