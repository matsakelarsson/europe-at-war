# Svenska översättningar av katalogtexten (våg 7); stegtexterna kommer senare.
First Anglo-Afghan War: Första anglo-afghanska kriget
The British East India Company’s invasion of Afghanistan to replace the Barakzai emir of Kabul, Dost Mohammad Khan, with the exiled Sadozai king Shah Shuja, whom it believed would keep Russian and Persian influence away from India. The Army of the Indus took Kandahar, stormed Ghazni and entered Kabul in 1839, and Dost Mohammad surrendered in 1840. But Shah Shuja’s rule depended on British bayonets and subsidies, and in November 1841 Kabul rose. The British envoy was killed, and in January 1842 the Kabul garrison of about 4,500 soldiers and 12,000 camp followers was destroyed on its retreat through the snowbound passes; only a handful reached Jalalabad. In 1842 two British armies fought their way back to Kabul, freed the hostages and destroyed much of the city and nearby towns before withdrawing. Shah Shuja had been killed, and Dost Mohammad returned to rule until 1863.: Brittiska Ostindiska kompaniets invasion av Afghanistan för att ersätta den barakzaiske emiren av Kabul, Dost Mohammad Khan, med den landsflyktige sadozaikungen Shah Shuja, som kompaniet trodde skulle hålla ryskt och persiskt inflytande borta från Indien. Indusarmén intog Kandahar, stormade Ghazni och tågade in i Kabul 1839, och Dost Mohammad kapitulerade 1840. Men Shah Shujas styre vilade på brittiska bajonetter och subsidier, och i november 1841 reste sig Kabul. Det brittiska sändebudet dödades, och i januari 1842 förintades Kabulgarnisonen, omkring 4 500 soldater och 12 000 personer ur trossen, under återtåget genom de igensnöade passen; bara en handfull nådde Jalalabad. År 1842 kämpade sig två brittiska arméer tillbaka till Kabul, befriade gisslan och förstörde stora delar av staden och närliggande städer innan de drog sig tillbaka. Shah Shuja hade dödats, och Dost Mohammad återvände och härskade till 1863.
