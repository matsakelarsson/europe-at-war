# Svenska översättningar av katalogtexten (våg 13); stegtexterna kommer senare.
First Anglo-Ashanti War: Första anglo-ashantiska kriget
? The first war between the Asante Empire and Britain over the Gold Coast, now Ghana. Asante, the strongest state of the forest country, had conquered the Fante coast between 1807 and 1816 and claimed the rents of the European forts. In 1821 the British government took over its forts from the African Company of Merchants and put them under Sir Charles MacCarthy, the governor of Sierra Leone, who backed the Fante and refused to accept Asante’s claims. War broke out in 1823. On 21 January 1824 MacCarthy’s small army was destroyed at Nsamankow, and he was killed; on the same day the Asantehene Osei Bonsu died in Kumasi. Two years later, on 7 August 1826, a coalition of the British, the Danes at Christiansborg and the coastal and southern Akan states defeated the new Asantehene, Osei Yaw Akoto, at Katamanso near Dodowa, helped by the terror of Congreve rockets. In a treaty of 1831, negotiated by George Maclean, Asante gave up its claims to the states south of the Pra river, which became the core of a British sphere on the coast.
: Det första kriget mellan Ashantiriket och Storbritannien om Guldkusten, i dagens Ghana. Ashanti, den starkaste staten i skogslandet, hade erövrat Fantekusten mellan 1807 och 1816 och gjorde anspråk på de avgifter som betalades för de europeiska forten. År 1821 tog den brittiska regeringen över sina fort från African Company of Merchants och ställde dem under sir Charles MacCarthy, guvernören i Sierra Leone, som stödde fante och vägrade erkänna Ashantis anspråk. Kriget bröt ut 1823. Den 21 januari 1824 förintades MacCarthys lilla armé vid Nsamankow, och han själv dödades; samma dag dog asantehene Osei Bonsu i Kumasi. Två år senare, den 7 augusti 1826, besegrade en koalition av britterna, danskarna i Christiansborg och akanstaterna vid kusten och i söder den nye asantehene, Osei Yaw Akoto, vid Katamanso nära Dodowa, med hjälp av den skräck som Congreveraketerna spred. Genom ett fördrag 1831, förhandlat av George Maclean, avstod Ashanti från sina anspråk på staterna söder om floden Pra, som blev kärnan i en brittisk intressesfär vid kusten.
