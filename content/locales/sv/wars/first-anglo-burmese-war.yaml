# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
First Anglo-Burmese War: Första anglo-burmesiska kriget
? The first of three wars in which the British conquered Burma, and one of the longest and most expensive wars of British India. The Konbaung kingdom had conquered Arakan, Manipur and Assam, and its frontier with the East India Company’s Bengal ran from the Brahmaputra to the Naf river. After clashes on that frontier, in Cachar and on the island of Shahpuri, Governor-General Lord Amherst declared war on 5 March 1824. Burma’s leading general, Maha Bandula, won at Ramu near Chittagong in May, but a Company army under Sir Archibald Campbell had already landed at Rangoon (Yangon). Bandula’s great attack on it failed in December 1824, he was killed at Danubyu in April 1825, and another army took Arakan. After failed peace talks and a last Burmese attempt to retake Prome, Campbell advanced up the Irrawaddy to Yandabo, about 80 km from the capital Ava. By the Treaty of Yandabo (24 February 1826) Burma ceded Arakan and Tenasserim, gave up Assam and Manipur and paid an indemnity of one million pounds. Of some 40,000 British and Indian troops about 15,000 died, most of them of disease; Burmese losses are not known.
: Det första av tre krig genom vilka britterna erövrade Burma, och ett av Brittiska Indiens längsta och dyraste krig. Konbaungriket hade erövrat Arakan, Manipur och Assam, och dess gräns mot Brittiska ostindiska kompaniets Bengalen sträckte sig från Brahmaputra till floden Naf. Efter sammandrabbningar längs den gränsen, i Cachar och på ön Shahpuri, förklarade generalguvernören lord Amherst krig den 5 mars 1824. Burmas främste general, Maha Bandula, segrade vid Ramu nära Chittagong i maj, men en av kompaniets arméer under sir Archibald Campbell hade redan landstigit i Rangoon (Yangon). Bandulas stora anfall mot den misslyckades i december 1824, han stupade vid Danubyu i april 1825, och en annan armé intog Arakan. Efter misslyckade fredsförhandlingar och ett sista burmesiskt försök att återta Prome ryckte Campbell fram uppför Irrawaddy till Yandabo, omkring 80 km från huvudstaden Ava. Genom fördraget i Yandabo (24 februari 1826) avträdde Burma Arakan och Tenasserim, avstod från Assam och Manipur och betalade ett skadestånd på en miljon pund. Av omkring 40 000 brittiska och indiska soldater dog omkring 15 000, de flesta av sjukdomar; de burmesiska förlusterna är inte kända.
