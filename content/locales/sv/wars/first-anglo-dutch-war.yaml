First Anglo-Dutch War: Första engelsk-nederländska kriget
A naval war between the Commonwealth of England and the Dutch Republic, caused mainly by trade rivalry and the English Navigation Act of 1651. The fleets fought a series of great battles in the Channel and the North Sea; after English victories at the Gabbard and Scheveningen, where the Dutch admiral Maarten Tromp was killed, and a costly blockade of the Dutch coast, the Treaty of Westminster of 1654 ended the war on terms that settled little.: Ett sjökrig mellan Englands samvälde och Nederländska republiken, främst orsakat av handelsrivalitet och den engelska navigationsakten 1651. Flottorna utkämpade en rad stora slag i Engelska kanalen och Nordsjön; efter engelska segrar vid Gabbard och Scheveningen, där den nederländske amiralen Maarten Tromp stupade, och en kostsam blockad av den nederländska kusten avslutades kriget genom freden i Westminster 1654 på villkor som löste föga.
