Battle of Dover: Slaget vid Dover
19 May 1652: 19 maj 1652
Blake and Tromp fought until dark. The Dutch lost two ships, but historians disagree on who had the better of it.: Blake och Tromp stred till mörkret föll. Nederländarna förlorade två fartyg, men historikerna är oeniga om vem som hade övertaget.
Battle of Plymouth: Slaget vid Plymouth
16 August 1652: 16 augusti 1652
De Ruyter, escorting a large outward-bound convoy, fought off Sir George Ayscue’s squadron and brought the merchant ships safely into the Atlantic.: De Ruyter, som eskorterade en stor utgående konvoj, slog tillbaka sir George Ayscues eskader och förde handelsfartygen i säkerhet ut i Atlanten.
28 September 1652: 28 september 1652
Fought near a shoal off the Thames estuary. Several Dutch captains held back, and the fleet withdrew after losing two ships.: Utkämpades nära ett grund utanför Themsens mynning. Flera nederländska kaptener höll sig tillbaka, och flottan drog sig undan efter att ha förlorat två fartyg.
30 November 1652: 30 november 1652
Tromp, escorting a convoy with a much larger fleet, beat Blake, who lost several ships. The defeat led to reforms of the English navy.: Tromp, som eskorterade en konvoj med en mycket större flotta, besegrade Blake, som förlorade flera fartyg. Nederlaget ledde till reformer av den engelska flottan.
De Ruyter’s convoy: De Ruyters konvoj
In February 1653 Tromp was bringing a large homeward convoy up the Channel when Blake attacked it off Portland. In three days of running battle the Dutch lost a number of warships and dozens of merchant ships, but saved most of the convoy. In June the English fleet under George Monck and Richard Deane, joined later by Blake, won a clear victory off the Gabbard shoal, helped by its heavier ships and new instructions to fight in a line. The English then blockaded the Dutch coast. Trade almost stopped, ships lay idle in the harbours, and there was hunger and unrest in the Dutch towns.: I februari 1653 förde Tromp en stor hemgående konvoj uppför kanalen när Blake anföll den utanför Portland. Under tre dagars rörliga strider förlorade nederländarna ett antal örlogsfartyg och dussintals handelsfartyg men räddade större delen av konvojen. I juni vann den engelska flottan under George Monck och Richard Deane, som senare fick förstärkning av Blake, en klar seger utanför Gabbardgrundet, hjälpt av sina tyngre fartyg och nya instruktioner om att strida i linje. Engelsmännen blockerade sedan den nederländska kusten. Handeln stannade nästan av, fartyg låg overksamma i hamnarna, och det rådde svält och oro i de nederländska städerna.
On 31 July Tromp came out to break the blockade, and the fleets met off Scheveningen. Tromp was killed by a musket ball early in the battle, and the Dutch lost heavily, but the battered English fleet withdrew to refit and the blockade was lifted. Both sides were exhausted, and Oliver Cromwell, Lord Protector from December 1653, wanted peace with a fellow Protestant republic. By the Treaty of Westminster of 5 April 1654 the Dutch agreed to salute the English flag and to pay compensation, and in a secret annex the province of Holland undertook never to appoint the young William III of Orange, nephew of the exiled Charles II, as its stadtholder.: Den 31 juli gick Tromp ut för att bryta blockaden, och flottorna möttes utanför Scheveningen. Tromp dödades av en muskötkula tidigt i slaget, och nederländarna led svåra förluster, men den illa tilltygade engelska flottan drog sig tillbaka för reparation och blockaden hävdes. Båda sidor var utmattade, och Oliver Cromwell, lordprotektor från december 1653, ville ha fred med en protestantisk republik som England. Genom freden i Westminster den 5 april 1654 gick nederländarna med på att salutera den engelska flaggan och att betala skadestånd, och i en hemlig bilaga förband sig provinsen Holland att aldrig utse den unge Vilhelm III av Oranien, brorson till den landsflyktige Karl II, till sin ståthållare.
