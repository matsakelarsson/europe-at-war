Dates are Old Style, as used in England. The Dutch used the Gregorian calendar, ten days ahead, so Dutch accounts date the battle of Scheveningen to 10 August 1653.: Datumen anges enligt den julianska kalendern, som användes i England. Nederländerna använde den gregorianska kalendern, som låg tio dagar före, så nederländska skildringar daterar slaget vid Scheveningen till den 10 augusti 1653.
The war was fought almost entirely at sea; battle markers show the approximate area of each action. Fighting in the Mediterranean, where a Dutch squadron destroyed an English one off Livorno in March 1653, is left to the text.: Kriget utkämpades nästan helt till sjöss; slagmarkeringarna visar det ungefärliga området för varje drabbning. Striderna i Medelhavet, där en nederländsk eskader förintade en engelsk utanför Livorno i mars 1653, behandlas endast i texten.
