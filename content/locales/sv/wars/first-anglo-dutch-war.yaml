5 April 1654: 5 april 1654
The Three Days’ Battle, fought along the Channel from Portland towards Cap Gris-Nez. Both sides claimed victory, but the English took or sank many more ships.: Tredagarsslaget, som utkämpades längs kanalen från Portland mot Cap Gris-Nez. Båda sidor gjorde anspråk på segern, men engelsmännen tog eller sänkte betydligt fler fartyg.
2–3 June 1653: 2–3 juni 1653
Off the Suffolk coast, the English fleet in line of battle beat Tromp’s fleet, and Blake’s arrival on the second day turned defeat into a rout. Deane was killed.: Utanför Suffolks kust besegrade den engelska flottan i slaglinje Tromps flotta, och Blakes ankomst den andra dagen förvandlade nederlaget till en flykt. Deane stupade.
Battle of Scheveningen: Slaget vid Scheveningen
31 July 1653: 31 juli 1653
Also called the battle of Ter Heijde. The death of Tromp, the most famous Dutch admiral of his day, ended the battle.: Kallas även slaget vid Ter Heijde. Tromps död, sin tids mest berömde nederländske amiral, avgjorde slaget.
Westminster: Westminster
The treaty restored peace but left the trade disputes unresolved. They led to a second war in 1665.: Freden återställde lugnet men lämnade handelstvisterna olösta. De ledde till ett andra krig 1665.
