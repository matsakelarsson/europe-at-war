The Dutch carried much of Europe’s seaborne trade, and the English resented it. In October 1651 the Commonwealth, victorious in the civil wars, passed a Navigation Act that barred goods from being brought to England in third countries’ ships, a blow aimed at the Dutch, and English warships and privateers began seizing Dutch merchantmen. England also demanded that foreign ships salute its flag in the seas around Britain. On 19 May 1652 Lieutenant-Admiral Maarten Tromp, at sea off Dover with a Dutch fleet, was slow to dip his flag, and Robert Blake opened fire. The fight began a war that neither government had quite decided on.: Nederländerna stod för en stor del av Europas sjöburna handel, något som engelsmännen ogillade. I oktober 1651 antog samväldet, som segrat i inbördeskrigen, en navigationsakt som förbjöd att varor fördes till England på tredje lands fartyg, ett slag riktat mot nederländarna, och engelska örlogsfartyg och kapare började uppbringa nederländska handelsfartyg. England krävde också att utländska fartyg skulle salutera dess flagga i farvattnen kring Brittiska öarna. Den 19 maj 1652 var löjtnantamiral Maarten Tromp, till sjöss utanför Dover med en nederländsk flotta, sen med att stryka sin flagga, och Robert Blake öppnade eld. Striden inledde ett krig som ingen av regeringarna egentligen hade bestämt sig för.
Dutch trade had to pass through the Channel or go the long way round Scotland, and both fleets fought for the sea lanes. In August Michiel de Ruyter beat off an English squadron near Plymouth and saw a convoy through. On 28 September Blake beat a divided Dutch fleet under Witte de With at the Kentish Knock, and the English, thinking the war as good as won, sent ships away to the Mediterranean. On 30 November Tromp, back in command, defeated Blake off Dungeness and held the Channel through the winter. Denmark, a Dutch ally, closed the Sound to English ships.: Den nederländska handeln måste passera genom Engelska kanalen eller ta den långa vägen runt Skottland, och båda flottorna kämpade om sjövägarna. I augusti slog Michiel de Ruyter tillbaka en engelsk eskader nära Plymouth och förde en konvoj i säkerhet. Den 28 september besegrade Blake en splittrad nederländsk flotta under Witte de With vid Kentish Knock, och engelsmännen, som trodde att kriget var så gott som vunnet, sände fartyg till Medelhavet. Den 30 november besegrade Tromp, åter i befäl, Blake utanför Dungeness och behärskade kanalen under vintern. Danmark, en nederländsk allierad, stängde Öresund för engelska fartyg.
