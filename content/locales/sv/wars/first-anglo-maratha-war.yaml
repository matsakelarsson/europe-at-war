# Svenska översättningar av katalogtexten (våg 8); stegtexterna kommer senare.
First Anglo-Maratha War: Första anglo-marathiska kriget
The first war between the British East India Company and the Maratha state. After the murder of the Peshwa Narayanrao in 1773, the Company’s Bombay government backed his uncle Raghunathrao against the regency council of Nana Phadnavis, which ruled in the name of the infant Peshwa Madhavrao II. Bombay’s first intervention was disowned by Calcutta in the Treaty of Purandar (1776), and its second ended in the surrender of its army at Wadgaon in January 1779. Warren Hastings then sent an army across India under Thomas Goddard, which took Ahmedabad and Bassein, while another force stormed Gwalior. Neither side could win, and with Hyder Ali of Mysore at war with the Company, Mahadji Scindia mediated the Treaty of Salbai (1782). The Company kept Salsette, gave up Raghunathrao and returned its other conquests, and peace held for twenty years.: Det första kriget mellan Brittiska ostindiska kompaniet och marathastaten. Efter mordet på peshwan Narayanrao 1773 stödde kompaniets regering i Bombay hans farbror Raghunathrao mot Nana Phadnavis förmyndarråd, som styrde i den späde peshwan Madhavrao II:s namn. Bombays första intervention desavouerades av Calcutta i fördraget i Purandar (1776), och den andra slutade med att Bombayarmén kapitulerade vid Wadgaon i januari 1779. Warren Hastings sände då en armé tvärs över Indien under Thomas Goddard, som intog Ahmedabad och Bassein, medan en annan styrka stormade Gwalior. Ingen av sidorna kunde vinna, och eftersom Hyder Ali av Mysore låg i krig med kompaniet medlade Mahadji Scindia fram fördraget i Salbai (1782). Kompaniet behöll Salsette, övergav Raghunathrao och återlämnade sina övriga erövringar, och freden höll i tjugo år.
