First Anglo-Sikh War: Första anglo-sikhiska kriget
The first war between the East India Company and the Sikh Empire, fought along the Sutlej river six years after Maharaja Ranjit Singh’s death had left the Punjab in the hands of rival court factions and a powerful, self-governing army. The Sikh army crossed the Sutlej in December 1845 and fought four hard battles, at Mudki, Ferozeshah, Aliwal and Sobraon, all won by the British at heavy cost. By the Treaty of Lahore of March 1846 the Sikh state lost the Jullundur Doab, paid a large indemnity and gave up Kashmir, which the Company sold a week later to Gulab Singh of Jammu by the Treaty of Amritsar. A British Resident took control of the government in Lahore.: Det första kriget mellan Brittiska ostindiska kompaniet och sikhriket, utkämpat längs floden Sutlej sex år efter att maharadja Ranjit Singhs död hade lämnat Punjab i händerna på rivaliserande hovfraktioner och en mäktig, självstyrande armé. Sikharmén gick över Sutlej i december 1845 och utkämpade fyra hårda slag, vid Mudki, Ferozeshah, Aliwal och Sobraon, som britterna vann alla till ett högt pris. Genom fördraget i Lahore i mars 1846 förlorade sikhstaten Jullundurdoaben, betalade ett stort skadestånd och avstod Kashmir, som kompaniet en vecka senare sålde till Gulab Singh av Jammu genom fördraget i Amritsar. En brittisk resident tog kontroll över regeringen i Lahore.
