Ignoring Russian warnings to keep out of Constantinople, the Bulgarians attacked the Çatalca lines, which ran for some 30 kilometres from the Black Sea to the Sea of Marmara, on 17–18 November. The Ottoman defenders, reinforced from Asia and supported by the guns of their warships, threw them back, while cholera spread through both armies. On 3 December Bulgaria, for itself, Serbia and Montenegro, agreed an armistice with the Ottomans. Greece refused to sign so that its fleet could keep up the blockade, and the sieges of Adrianople, Ioannina and Scutari went on.: Utan att bry sig om ryska varningar att hålla sig borta från Konstantinopel anföll bulgarerna den 17–18 november Çatalcalinjerna, som sträckte sig omkring 30 kilometer från Svarta havet till Marmarasjön. De osmanska försvararna, förstärkta från Asien och understödda av sina örlogsfartygs kanoner, kastade tillbaka dem, medan koleran spreds i båda arméerna. Den 3 december slöt Bulgarien, för egen del och för Serbien och Montenegro, vapenstillestånd med osmanerna. Grekland vägrade underteckna för att dess flotta skulle kunna upprätthålla blockaden, och belägringarna av Adrianopel, Ioannina och Scutari fortsatte.
Peace talks opened in London on 16 December, alongside a conference of the Great Powers’ ambassadors that agreed on an autonomous Albania. When the government of Kâmil Pasha seemed ready to give up Adrianople, Enver Bey and other officers of the Committee of Union and Progress stormed the Sublime Porte on 23 January 1913 and shot the war minister, Nazım Pasha. The new government rejected the terms, and fighting resumed on 3 February. On 8 February an Ottoman attack at Bulair, at the neck of the Gallipoli peninsula, failed with heavy losses, and troops landed behind the Bulgarians at Şarköy soon re-embarked.: Fredsförhandlingar inleddes i London den 16 december, parallellt med en konferens mellan stormakternas ambassadörer som enades om ett autonomt Albanien. När Kâmil pashas regering tycktes beredd att ge upp Adrianopel stormade Enver bej och andra officerare ur Kommittén för enighet och framsteg Höga porten den 23 januari 1913 och sköt krigsministern, Nazım pasha. Den nya regeringen avvisade villkoren, och striderna återupptogs den 3 februari. Den 8 februari misslyckades ett osmanskt anfall vid Bulair, vid Gallipolihalvöns smalaste del, med svåra förluster, och trupper som landsatts bakom bulgarerna vid Şarköy gick snart ombord igen.
