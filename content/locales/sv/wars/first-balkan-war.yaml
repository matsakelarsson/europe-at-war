As Serbian, Montenegrin and Greek troops occupied most of the land Albanians lived in, Albanian delegates meeting at Vlorë declared independence on 28 November 1912, with Ismail Qemali at the head of a provisional government. Austria-Hungary and Italy, unwilling to see Serbia on the Adriatic, backed an Albanian state, and in December the ambassadors in London accepted it in principle. Montenegro had besieged Scutari, the largest town of northern Albania, since 28 October, with Serbian help from February, but its costly assaults on the hills around the town failed.: När serbiska, montenegrinska och grekiska trupper ockuperade större delen av de områden där albaner bodde förklarade albanska delegater, samlade i Vlorë, landet självständigt den 28 november 1912, med Ismail Qemali i spetsen för en provisorisk regering. Österrike-Ungern och Italien, som inte ville se Serbien vid Adriatiska havet, stödde en albansk stat, och i december godtog ambassadörerna i London den i princip. Montenegro hade belägrat Scutari, norra Albaniens största stad, sedan den 28 oktober, från februari med serbisk hjälp, men dess kostsamma stormningar mot kullarna kring staden misslyckades.
The powers awarded Scutari to Albania, and in April an international fleet blockaded the Montenegrin coast. Even so, the garrison commander, Essad Pasha Toptani, surrendered the town to Montenegro on 23 April, in return for leaving with his troops and arms. Under threat of war from Austria-Hungary, King Nicholas gave it up, and an international force took over on 14 May. By the Treaty of London of 30 May the Ottomans ceded everything west of a line from Enos to Midia, as well as Crete, and left Albania and the Aegean islands to the powers. The victors had still to divide the spoils, and quarrelled at once.: Stormakterna tilldelade Albanien Scutari, och i april blockerade en internationell flotta den montenegrinska kusten. Trots detta överlämnade garnisonens befälhavare, Essad pasha Toptani, staden till Montenegro den 23 april mot att han fick dra bort med sina trupper och vapen. Under hot om krig från Österrike-Ungern gav kung Nikola upp den, och en internationell styrka tog över den 14 maj. Genom Londonfreden den 30 maj avträdde osmanerna allt väster om en linje från Enos till Midia samt Kreta och överlät åt stormakterna att avgöra frågan om Albanien och de egeiska öarna. Segrarna hade ännu inte delat bytet och började genast gräla.
