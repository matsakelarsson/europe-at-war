In Epirus the Greeks had stood since December before the fortified heights of Bizani, which guarded Ioannina. Crown Prince Constantine brought divisions over from Macedonia, and after a heavy bombardment the Greek army broke through on 5 March. The next day Esad Pasha surrendered the city and its garrison. Greek forces went on north into southern Albania, which Greeks called Northern Epirus, where they had taken Korçë in December, and occupied Gjirokastër and the country around it. Their presence there would be one of the hardest questions for the powers drawing Albania’s borders.: I Epirus hade grekerna sedan december stått framför de befästa höjderna vid Bizani, som skyddade Ioannina. Kronprins Konstantin förde över divisioner från Makedonien, och efter ett kraftigt bombardemang bröt den grekiska armén igenom den 5 mars. Dagen därpå överlämnade Esad pasha staden och dess garnison. Grekiska styrkor fortsatte norrut in i södra Albanien, som grekerna kallade Nordepirus, där de hade intagit Korçë i december, och ockuperade Gjirokastër med omgivningar. Deras närvaro där skulle bli en av de svåraste frågorna för de makter som drog upp Albaniens gränser.
Adrianople had been besieged since November by the Bulgarian Second Army and two Serbian divisions, and in the war’s first air raids Bulgarian airmen dropped bombs on the city. On the night of 24–25 March the allies stormed the forts, and on 26 March Mehmed Şükrü Pasha surrendered with tens of thousands of men. Turkish accounts say that thousands of prisoners kept on the river island of Sarayiçi died of hunger and cold. The loss of the old Ottoman capital ended Ottoman hopes, and in April the Porte accepted the powers’ terms.: Adrianopel hade sedan november belägrats av den bulgariska andra armén och två serbiska divisioner, och i krigets första flyganfall släppte bulgariska flygare bomber över staden. Natten mellan den 24 och 25 mars stormade de allierade forten, och den 26 mars kapitulerade Mehmed Şükrü pasha med tiotusentals man. Enligt turkiska skildringar dog tusentals fångar som hölls på flodön Sarayiçi av svält och köld. Förlusten av den gamla osmanska huvudstaden gjorde slut på osmanernas förhoppningar, och i april godtog Höga porten stormakternas villkor.
