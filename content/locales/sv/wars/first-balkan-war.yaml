Italy’s war for Libya and a wave of Albanian revolts had shown how weak Ottoman rule in Europe had become. On 13 March 1912 Bulgaria and Serbia signed an alliance whose secret annex divided Macedonia, the prize both wanted. Serbia was to have the north, Bulgaria the land south-east of a line from Kriva Palanka to Ohrid, and the Tsar of Russia was to arbitrate the zone between. Greece allied with Bulgaria on 29 May without any agreement on borders, and in late summer Montenegro came to terms with Bulgaria and Serbia, completing what became known as the Balkan League.: Italiens krig om Libyen och en våg av albanska revolter hade visat hur svagt det osmanska styret i Europa hade blivit. Den 13 mars 1912 undertecknade Bulgarien och Serbien en allians vars hemliga bilaga delade Makedonien, det byte som båda ville ha. Serbien skulle få norra delen, Bulgarien landet sydost om en linje från Kriva Palanka till Ohrid, och Rysslands tsar skulle avgöra tillhörigheten för zonen däremellan. Grekland allierade sig med Bulgarien den 29 maj utan någon överenskommelse om gränser, och på sensommaren kom Montenegro överens med Bulgarien och Serbien, vilket fullbordade det som blev känt som Balkanförbundet.
The allies mobilised at the end of September, although the Great Powers warned that they would accept no change to the map. Montenegro declared war first, on 8 October, and its troops crossed into northern Albania and the Sandžak of Novi Pazar. On 13 October Bulgaria, Serbia and Greece demanded autonomy for the Christian provinces of European Turkey under their supervision, knowing it would be refused. The Ottoman Empire, which was making peace with Italy, declared war on Bulgaria and Serbia on 17 October, and Greece declared war the next day.: De allierade mobiliserade i slutet av september, trots att stormakterna varnade för att de inte skulle godta några ändringar av kartan. Montenegro förklarade krig först, den 8 oktober, och dess trupper gick in i norra Albanien och sandjaken Novi Pazar. Den 13 oktober krävde Bulgarien, Serbien och Grekland självstyre för de kristna provinserna i Europeiska Turkiet under deras överinseende, väl medvetna om att kravet skulle avvisas. Osmanska riket, som höll på att sluta fred med Italien, förklarade Bulgarien och Serbien krig den 17 oktober, och Grekland förklarade krig dagen därpå.
