The main Serbian force, the First Army under Crown Prince Alexander, advanced up the Morava towards Skopje, the centre of Ottoman power in Kosovo and Macedonia. Zeki Pasha’s Vardar Army attacked it near Kumanovo on 23 October and after two days of fighting broke and retreated, leaving much of its artillery behind. Serbian troops entered Skopje on 26 October. The Serbian Third Army took Pristina and Prizren in Kosovo, while Serbian and Montenegrin troops divided the Sandžak and Montenegrins took Peć and Gjakova. Foreign reporters and the later Carnegie Commission described killings of Albanian civilians and burned villages in their wake.: Den serbiska huvudstyrkan, första armén under kronprins Alexander, ryckte fram uppför Morava mot Skopje, centrum för den osmanska makten i Kosovo och Makedonien. Zeki pashas Vardararmé anföll den nära Kumanovo den 23 oktober och bröt efter två dagars strider samman och retirerade, med lämnande av en stor del av sitt artilleri. Serbiska trupper tågade in i Skopje den 26 oktober. Den serbiska tredje armén intog Priština och Prizren i Kosovo, medan serbiska och montenegrinska trupper delade sandjaken mellan sig och montenegrinerna intog Peć och Gjakova. Utländska reportrar och den senare Carnegiekommissionen beskrev dödande av albanska civila och nedbrända byar i deras spår.
The Ottoman army fell back south. The Serbs beat it again at Prilep on 3–5 November, and on 16–19 November, in the biggest battle of the Macedonian campaign, they broke its last stand before Bitola, the seat of the Manastır vilayet. The remnants fled into Albania. Meanwhile, the Serbian Third Army marched west from Kosovo across the Albanian mountains and reached the Adriatic, taking Durrës on 28 November. Austria-Hungary and Italy, determined that Serbia should not have a port on the Adriatic, warned that they would not let it stay.: Den osmanska armén föll tillbaka söderut. Serberna besegrade den igen vid Prilep den 3–5 november, och den 16–19 november, i det största slaget under det makedonska fälttåget, bröt de dess sista motstånd framför Bitola, säte för vilajetet Manastır. Resterna flydde in i Albanien. Under tiden marscherade den serbiska tredje armén västerut från Kosovo över de albanska bergen och nådde Adriatiska havet, där den intog Durrës den 28 november. Österrike-Ungern och Italien, fast beslutna att Serbien inte skulle få någon hamn vid Adriatiska havet, varnade för att de inte skulle låta det stanna.
