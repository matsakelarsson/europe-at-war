Bulgaria sent most of its army into Thrace, the shortest way to Constantinople. While the Second Army under General Nikola Ivanov closed on the fortress of Adrianople, the First and Third Armies pushed south-east past it. The Ottoman Eastern Army attacked them in the hills around Kirk Kilisse on 22 October and was routed within three days, its reserve units breaking under fire, and the Bulgarians entered the abandoned town on 24 October. From 3 November Adrianople, held by some 60,000 men under Mehmed Şükrü Pasha, was cut off and besieged.: Bulgarien sände större delen av sin armé in i Thrakien, den kortaste vägen till Konstantinopel. Medan andra armén under general Nikola Ivanov närmade sig fästningen Adrianopel trängde första och tredje armén förbi den mot sydost. Den osmanska östarmén anföll dem i kullarna kring Kirk Kilisse den 22 oktober och var slagen på flykten inom tre dagar, då dess reservförband bröt samman under eld, och bulgarerna tågade in i den övergivna staden den 24 oktober. Från den 3 november var Adrianopel, som hölls av omkring 60 000 man under Mehmed Şükrü pasha, avskuret och belägrat.
The Ottomans rallied on a line from Lule Burgas to Pınarhisar, and from 28 October to 2 November well over 200,000 men fought there, the largest battle in Europe between 1871 and 1914. The Ottoman army, short of food and shells and soon struck by cholera, gave way and fell back in disorder to the Çatalca lines, the last defences of Constantinople. Further west, Bulgarian columns crossed the Rhodopes, reached the Aegean at Dedeagach on 19 November, and in late November forced the surrender of Yaver Pasha’s corps of about 10,000 men near the Maritsa.: Osmanerna samlade sig på en linje från Lule Burgas till Pınarhisar, och från den 28 oktober till den 2 november stred långt över 200 000 man där, det största slaget i Europa mellan 1871 och 1914. Den osmanska armén, med brist på livsmedel och granater och snart drabbad av kolera, gav vika och drog sig i oordning tillbaka till Çatalcalinjerna, Konstantinopels sista försvarsverk. Längre västerut gick bulgariska kolonner över Rhodopebergen, nådde Egeiska havet vid Dedeagach den 19 november och tvingade i slutet av november Yaver pashas kår på omkring 10 000 man att kapitulera nära Maritsa.
