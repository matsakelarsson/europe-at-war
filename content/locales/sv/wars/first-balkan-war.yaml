First Balkan War: Första Balkankriget
A war in which the Balkan League of Bulgaria, Serbia, Greece and Montenegro drove the Ottoman Empire out of almost all its remaining lands in Europe. In eight months the allies won at Kirk Kilisse, Lule Burgas, Kumanovo and Bitola, took Thessaloniki, Ioannina, Adrianople and Scutari, and by the Treaty of London of May 1913 the Ottomans gave up everything west of a line from Enos to Midia, while the Great Powers created an independent Albania.: Ett krig där Balkanförbundet – Bulgarien, Serbien, Grekland och Montenegro – drev ut Osmanska riket ur nästan alla dess återstående länder i Europa. På åtta månader segrade de allierade vid Kirk Kilisse, Lule Burgas, Kumanovo och Bitola och intog Thessaloniki, Ioannina, Adrianopel och Scutari, och genom Londonfreden i maj 1913 avstod osmanerna allt väster om en linje från Enos till Midia, medan stormakterna skapade ett självständigt Albanien.
