The Greek Army of Thessaly under Crown Prince Constantine crossed the frontier on 18 October and forced the Sarantaporo pass on 22–23 October. Constantine wanted to turn west towards Bitola, but the prime minister, Eleftherios Venizelos, insisted that Thessaloniki, the great port that Bulgaria also wanted, must come first. After a victory at Yenidje on 1–2 November the Greeks closed on the city, and on 8 November Hasan Tahsin Pasha surrendered it with about 26,000 men. A Bulgarian division arrived a day later, and the two allies shared the city uneasily. Meanwhile a separate Greek division in western Macedonia was routed at Sorovich.: Den grekiska Thessalienarmén under kronprins Konstantin gick över gränsen den 18 oktober och forcerade Sarantaporopasset den 22–23 oktober. Konstantin ville vända västerut mot Bitola, men premiärministern Eleftherios Venizelos insisterade på att Thessaloniki, den stora hamnstaden som även Bulgarien ville ha, måste komma först. Efter en seger vid Yenidje den 1–2 november närmade sig grekerna staden, och den 8 november överlämnade Hasan Tahsin pasha den med omkring 26 000 man. En bulgarisk division anlände en dag senare, och de två allierade delade staden under spänningar. Under tiden slogs en separat grekisk division i västra Makedonien på flykten vid Sorovich.
At sea, the Greek navy kept Ottoman reinforcements from Asia off the European front. It took Lemnos on 21 October and made the bay of Moudros its base; Thasos, Imbros, Samothrace, Tenedos, Lesbos and Chios followed by early January. Rear Admiral Pavlos Kountouriotis, in the fast armoured cruiser Georgios Averof, beat the Ottoman fleet when it came out of the Dardanelles at Elli on 16 December and again off Lemnos on 18 January 1913, after which it stayed in the straits.: Till sjöss höll den grekiska flottan osmanska förstärkningar från Asien borta från den europeiska fronten. Den intog Lemnos den 21 oktober och gjorde Moudrosbukten till sin bas; Thasos, Imbros, Samothrake, Tenedos, Lesbos och Chios följde före början av januari. Konteramiral Pavlos Kountouriotis besegrade med den snabba pansarkryssaren Georgios Averof den osmanska flottan när den kom ut ur Dardanellerna vid Elli den 16 december och igen utanför Lemnos den 18 januari 1913, varefter den stannade i sunden.
