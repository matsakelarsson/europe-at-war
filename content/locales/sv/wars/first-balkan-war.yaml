Bulgaria, Serbia, Montenegro and Greece still used the Julian (Old Style) calendar, 13 days behind the Gregorian; Greek and Bulgarian accounts often give Old Style dates (Thessaloniki surrendered on 26 October Old Style, 8 November New Style). All dates here are New Style.: Bulgarien, Serbien, Montenegro och Grekland använde fortfarande den julianska kalendern, som låg 13 dagar efter den gregorianska; grekiska och bulgariska skildringar anger ofta datum enligt den julianska kalendern (Thessaloniki kapitulerade den 26 oktober enligt den julianska och den 8 november enligt den gregorianska kalendern). Alla datum här anges enligt den gregorianska kalendern.
Places are named as in most English accounts of the war, with today’s names where they differ; Kirk Kilisse is Kırklareli, Lule Burgas is Lüleburgaz, Adrianople is Edirne, Monastir is Bitola, Üsküp is Skopje, Scutari is Shkodër, Yenidje is Giannitsa and Dedeagach is Alexandroupoli.: Orterna har de namn som används i de flesta skildringar av kriget, med dagens namn där de skiljer sig; Kirk Kilisse är Kırklareli, Lule Burgas är Lüleburgaz, Adrianopel är Edirne, Monastir är Bitola, Üsküp är Skopje, Scutari är Shkodër, Yenidje är Giannitsa och Dedeagach är Alexandroupolis.
The base map keeps Ottoman borders until the Treaty of London; the allied occupations of 1912–1913 are shown as approximate areas.: Baskartan behåller de osmanska gränserna fram till Londonfreden; de allierades ockupationer 1912–1913 visas som ungefärliga områden.
The war’s violence fell heavily on civilians. Muslim villagers in Macedonia, Kosovo and Thrace were killed or driven out by allied troops and irregulars, Christian villages suffered at the hands of retreating Ottoman troops and irregulars, and hundreds of thousands of refugees fled; the international Carnegie Commission described many of these crimes in 1914.: Krigets våld drabbade civilbefolkningen hårt. Muslimska bybor i Makedonien, Kosovo och Thrakien dödades eller fördrevs av allierade trupper och irreguljära styrkor, kristna byar led under retirerande osmanska trupper och irreguljära styrkor, och hundratusentals flyktingar flydde; den internationella Carnegiekommissionen beskrev många av dessa brott 1914.
