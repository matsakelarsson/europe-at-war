# Svenska översättningar av katalogtexten (våg 12); stegtexterna kommer senare.
First Barbary War: Första barbareskkriget
? The war between the United States and the Regency of Tripoli under Yusuf Karamanli. Like the European powers, the United States had paid the North African regencies for safe passage for its ships; when President Jefferson refused Yusuf’s demand for more money, Yusuf declared war in May 1801 by having the flagstaff of the American consulate cut down. American squadrons, at first alongside a Swedish one, blockaded Tripoli with mixed success. In October 1803 the frigate Philadelphia ran aground off Tripoli and her crew of about 300 were taken captive; in February 1804 Stephen Decatur burned her in the harbour, and Edward Preble’s squadron bombarded the town through the summer of 1804. In 1805 the former consul William Eaton led a small force of Greek, Arab and Berber soldiers and a handful of US Marines from Egypt across the desert to take Derna for Yusuf’s exiled brother Hamet. Yusuf made peace on 4 June 1805; the United States paid $60,000 to ransom the prisoners and abandoned Hamet. Tribute to Algiers went on until the Second Barbary War of 1815.
: Kriget mellan USA och regentskapet Tripoli under Yusuf Karamanli. Liksom de europeiska makterna hade USA betalat de nordafrikanska regentskapen för fri lejd för sina fartyg; när president Jefferson avvisade Yusufs krav på mer pengar förklarade Yusuf krig i maj 1801 genom att låta hugga ned flaggstången vid det amerikanska konsulatet. Amerikanska eskadrar, till en början tillsammans med en svensk, blockerade Tripoli med växlande framgång. I oktober 1803 gick fregatten Philadelphia på grund utanför Tripoli och dess besättning på omkring 300 man togs till fånga; i februari 1804 brände Stephen Decatur fartyget i hamnen, och Edward Prebles eskader bombarderade staden under hela sommaren 1804. År 1805 ledde den förre konsuln William Eaton en liten styrka av grekiska, arabiska och berbiska soldater och en handfull amerikanska marinkårssoldater från Egypten genom öknen för att inta Derna åt Yusufs landsflyktige bror Hamet. Yusuf slöt fred den 4 juni 1805; USA betalade 60 000 dollar i lösen för fångarna och övergav Hamet. Tributen till Alger fortsatte fram till andra barbareskkriget 1815.
