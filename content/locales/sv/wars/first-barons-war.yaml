First Barons’ War: Första baronkriget
A civil war in England that broke out after King John repudiated Magna Carta. The rebel barons offered the crown to Prince Louis of France, who invaded in 1216 and held London and much of the south-east, but after John’s death the regents of the boy king Henry III won the barons back, beat Louis’s forces at Lincoln and at sea off Sandwich in 1217, and paid him to leave.: Ett inbördeskrig i England som bröt ut sedan kung Johan förkastat Magna Carta. De upproriska baronerna erbjöd kronan åt prins Ludvig av Frankrike, som invaderade 1216 och höll London och stora delar av sydöstra England, men efter Johans död vann förmyndarna för den unge kungen Henrik III tillbaka baronerna, besegrade Ludvigs styrkor vid Lincoln och till sjöss utanför Sandwich 1217 och betalade honom för att lämna landet.
