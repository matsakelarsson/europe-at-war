Louis: Ludvig
John, October 1216: Johan, oktober 1216
John’s son Henry III, aged nine, was crowned at Gloucester on 28 October 1216, since London was in Louis’s hands. The elderly William Marshal became regent, and on 12 November Magna Carta was reissued in Henry’s name. With John gone, the barons began to drift back to the crown. Louis went to France for reinforcements early in 1217 and on his return began a second siege of Dover. Meanwhile a rebel and French army was besieging Lincoln castle, held for the king by its castellan, Nicola de la Haye. On 20 May Marshal’s army broke into the city and routed it. Its commander, the count of Perche, was killed, many rebel barons were captured, and the royalists sacked the city.: Johans son Henrik III, nio år gammal, kröntes i Gloucester den 28 oktober 1216, eftersom London var i Ludvigs händer. Den åldrade William Marshal blev regent, och den 12 november utfärdades Magna Carta på nytt i Henriks namn. När Johan var borta började baronerna glida tillbaka till kronan. Ludvig for till Frankrike efter förstärkningar i början av 1217 och inledde vid sin återkomst en andra belägring av Dover. Under tiden belägrade en här av rebeller och fransmän Lincolns borg, som hölls för kungens räkning av dess kastellan, Nicola de la Haye. Den 20 maj bröt sig Marshals här in i staden och slog belägrarna på flykten. Deras befälhavare, greven av Perche, stupade, många upproriska baroner tillfångatogs och rojalisterna plundrade staden.
On 24 August a French fleet under the former monk and pirate Eustace sailed to bring Louis reinforcements. Off Sandwich, Hubert de Burgh’s ships attacked from windward and captured the flagship, and Eustace was beheaded on its deck. Louis had to negotiate. By the treaty agreed near Kingston and confirmed at Lambeth on 20 September 1217, he gave up his claim and left England, the rebels were pardoned, and he was paid 10,000 marks. In November the charter was issued again, with a new Charter of the Forest.: Den 24 augusti seglade en fransk flotta under den förre munken och piraten Eustace för att föra förstärkningar till Ludvig. Utanför Sandwich anföll Hubert de Burghs fartyg från lovartssidan och erövrade flaggskeppet, och Eustace halshöggs på dess däck. Ludvig måste förhandla. Genom fördraget som slöts nära Kingston och bekräftades i Lambeth den 20 september 1217 avstod han från sitt anspråk och lämnade England, rebellerna benådades och han fick 10 000 mark. I november utfärdades stadgan på nytt, tillsammans med en ny skogsstadga, Charter of the Forest.
