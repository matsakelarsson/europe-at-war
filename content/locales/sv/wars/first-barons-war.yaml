The rebels were also joined by Alexander II of Scotland, who took Carlisle in 1216, and by Llywelyn ab Iorwerth of Gwynedd, who took castles in south Wales. Philip II officially disowned his son’s expedition, and the pope excommunicated Louis.: Rebellerna fick också stöd av Alexander II av Skottland, som intog Carlisle 1216, och av Llywelyn ab Iorwerth av Gwynedd, som intog borgar i södra Wales. Filip II tog officiellt avstånd från sin sons expedition, och påven bannlyste Ludvig.
The chief chronicler of the war, Roger of Wendover, was hostile to John. The peace of September 1217 is called the Treaty of Lambeth or of Kingston, after the places where it was negotiated and confirmed.: Krigets främste krönikör, Roger av Wendover, var fientligt inställd till Johan. Freden i september 1217 kallas fördraget i Lambeth eller i Kingston, efter de platser där den förhandlades fram och bekräftades.
