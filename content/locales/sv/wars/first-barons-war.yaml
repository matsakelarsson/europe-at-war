Success for the rebels and Louis: Rebellernas och Ludvigs framgångar
The loss of Normandy and Anjou, heavy taxes and a long quarrel with the church turned many barons against King John. At Runnymede in June 1215 they forced him to accept Magna Carta, but neither side kept to it. Pope Innocent III annulled the charter in August, and by September the country was at war. The rebels held London. John besieged Rochester castle from 11 October; his miners brought down a corner of the keep by burning its props with the fat of forty pigs, and the starving garrison surrendered on 30 November. Over the winter John’s mercenaries ravaged the rebels’ lands in the north and East Anglia, and the rebels offered the crown to Prince Louis, son of Philip II of France.: Förlusten av Normandie och Anjou, tunga skatter och en lång strid med kyrkan vände många baroner mot kung Johan. Vid Runnymede i juni 1215 tvingade de honom att godta Magna Carta, men ingen av parterna höll sig till den. Påven Innocentius III upphävde stadgan i augusti, och i september rådde krig i landet. Rebellerna höll London. Johan belägrade Rochesters borg från den 11 oktober; hans minörer fick ett hörn av kärntornet att rasa genom att bränna dess stöttor med fettet från fyrtio grisar, och den svältande garnisonen kapitulerade den 30 november. Under vintern härjade Johans legosoldater rebellernas länder i norr och i East Anglia, och rebellerna erbjöd kronan åt prins Ludvig, son till Filip II av Frankrike.
Louis landed in Kent in May 1216. John fell back to Winchester, and Louis entered London without a fight and was proclaimed king at St Paul’s, though never crowned. He took Winchester after a ten-day siege and soon held more than half the kingdom, and Alexander II of Scotland came south to do homage to him. But Dover castle, defended by Hubert de Burgh, held out against a long siege, and so did Windsor. In October John, campaigning in the east, lost part of his baggage crossing the estuaries of the Wash, fell ill with dysentery and died at Newark on the night of 18–19 October.: Ludvig landsteg i Kent i maj 1216. Johan drog sig tillbaka till Winchester, och Ludvig tågade in i London utan strid och utropades till kung i S:t Pauls katedral, men kröntes aldrig. Han intog Winchester efter tio dagars belägring och höll snart mer än halva riket, och Alexander II av Skottland kom söderut för att hylla honom. Men Dovers borg, som försvarades av Hubert de Burgh, höll stånd mot en lång belägring, och detsamma gjorde Windsor. I oktober förlorade Johan, som förde krig i öster, en del av sin tross vid övergången av mynningsvikarna vid The Wash, insjuknade i dysenteri och dog i Newark natten mellan den 18 och 19 oktober.
