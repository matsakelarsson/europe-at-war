# Svenska översättningar av katalogtexten (våg 13); stegtexterna kommer senare.
First Boer War: Första boerkriget
? The short war in which the Boers of the Transvaal won back the independence of the South African Republic, which Britain had annexed in 1877. After three years of petitions, a mass meeting at Paardekraal proclaimed the republic restored in December 1880 under a triumvirate of Paul Kruger, Piet Joubert and Marthinus Wessel Pretorius. Boer commandos besieged the seven small British garrisons in the Transvaal, destroyed a column of the 94th Regiment at Bronkhorstspruit on 20 December, and held the Natal border against the relief force of Major-General Sir George Colley, beating it at Laing’s Nek (28 January 1881) and Schuinshoogte (8 February) and killing Colley on Majuba Hill on 27 February. Gladstone’s government made peace on 23 March 1881. By the Pretoria Convention of August 1881 the Transvaal became self-governing under British suzerainty, which the London Convention of 1884 reduced to a British veto on its treaties. Some 400 British soldiers and about 40 Boers were killed. Afrikaners call it the First War of Independence.
: Det korta krig där boerna i Transvaal återvann självständigheten för Sydafrikanska republiken, som Storbritannien hade annekterat 1877. Efter tre år av petitioner utropade ett massmöte vid Paardekraal i december 1880 republiken som återupprättad under ett triumvirat bestående av Paul Kruger, Piet Joubert och Marthinus Wessel Pretorius. Boerkommandon belägrade de sju små brittiska garnisonerna i Transvaal, förintade en kolonn ur 94:e regementet vid Bronkhorstspruit den 20 december och höll gränsen mot Natal mot generalmajor Sir George Colleys undsättningsstyrka; de slog den vid Laing’s Nek (28 januari 1881) och Schuinshoogte (8 februari) och dödade Colley på Majuba Hill den 27 februari. Gladstones regering slöt fred den 23 mars 1881. Genom Pretoriakonventionen i augusti 1881 blev Transvaal självstyrande under brittisk överhöghet, som Londonkonventionen 1884 begränsade till ett brittiskt veto mot dess fördrag. Omkring 400 brittiska soldater och omkring 40 boer stupade. Afrikanderna kallar kriget det första frihetskriget.
