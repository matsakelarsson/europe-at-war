The city recruited mercenaries and strengthened its defences. There was no major battle.: Staden värvade legosoldater och stärkte sitt försvar. Inget större slag utkämpades.
First Stade Recess: Första recessen i Stade
28 November 1654: 28 november 1654
Sweden kept the occupied districts of Bederkesa and Lehe, and Bremen swore allegiance to Charles X Gustav on 6 December.: Sverige behöll de ockuperade områdena Bederkesa och Lehe, och den 6 december svor Bremen Karl X Gustav trohet.
Christina abdicates: Kristina abdikerar
6 June 1654: 6 juni 1654
In the great hall of Uppsala Castle the queen, aged 27, handed the crown to her cousin and soon left Sweden to become a Catholic.: I rikssalen på Uppsala slott överlämnade den 27-åriga drottningen kronan till sin kusin. Kort därefter lämnade hon Sverige och övergick till katolicismen.
