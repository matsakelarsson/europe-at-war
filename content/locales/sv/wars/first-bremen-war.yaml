First Bremen War: Första bremiska kriget
A brief conflict in which Sweden tried to force the city of Bremen to accept Swedish rule as part of the duchies of Bremen-Verden. In the First Stade Recess the city did homage to the Swedish king but kept its walls.: Ett kort krig där Sverige försökte tvinga staden Bremen att godta svenskt styre som en del av hertigdömena Bremen-Verden. Genom den första recessen i Stade hyllade staden den svenske kungen men fick behålla sina murar.
