Swedish wars on Bremen (Wikipedia): De svenska krigen mot Bremen (Wikipedia)
Bremen, and a new king: Bremen och en ny kung
The city of Bremen insisted it was a free imperial city, not part of Swedish Bremen-Verden. In 1654 Swedish troops under Königsmarck occupied part of the city’s lands without attacking the town itself.: Bremen hävdade att staden var en fri riksstad och stod utanför svenska Bremen-Verden. År 1654 besatte svenska trupper under Königsmarck en del av Bremens landområden utan att angripa själva staden.
"In the First Stade Recess of 28 November 1654, Bremen pledged allegiance to the Swedish king while keeping its walls, and Sweden kept the districts it had seized. That king was new: Queen Christina had given up the throne at Uppsala on 6 June 1654 in favour of her cousin, Charles X Gustav.": I den första recessen i Stade den 28 november 1654 lovade Bremen den svenske kungen trohet men fick behålla sina murar. Sverige behöll de områden som trupperna hade tagit. Kungen hade nyligen tillträtt. Drottning Kristina hade avsagt sig tronen i Uppsala den 6 juni 1654 till förmån för sin kusin, Karl X Gustav.
