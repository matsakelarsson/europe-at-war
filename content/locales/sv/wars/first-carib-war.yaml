# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
First Carib War: Första karibkriget
? "The war in which the Garifuna (the “Black Caribs”) and Kalinago of Saint Vincent defended their lands against British settlement. When France ceded Saint Vincent to Britain in 1763, most of the island, above all the fertile windward side, was held by the Garifuna, a people of Kalinago and African descent, and the British commissioners set out to survey it and sell it to planters. In 1769 the Garifuna under their chiefs, among them Joseph Chatoyer, stopped a road-building party escorted by the 32nd Regiment and held it hostage, and they obtained arms from French Martinique. In 1772 the British government sent regiments from North America and the other islands, and Major-General William Dalrymple advanced north from Kingstown and landed troops at Grand Sable; but the Garifuna, some 1,500 to 3,000 fighters, ambushed the columns in the forested mountains, and fever killed many soldiers. With the war unpopular in Parliament, Dalrymple and the Garifuna chiefs signed a treaty on 17 February 1773: the Garifuna acknowledged the British king and kept the northern third of the island, from the Wallilabou River in the west to the Byera River in the east. It was the first treaty Britain had signed with a non-European people in the Caribbean since the Jamaican Maroon treaties of 1739."
: "Det krig i vilket garifuna (de ”svarta karibierna”) och kalinago på Saint Vincent försvarade sin jord mot brittisk kolonisering. När Frankrike avträdde Saint Vincent till Storbritannien 1763 hölls större delen av ön, framför allt den bördiga lovartssidan, av garifuna, ett folk av kalinago- och afrikansk härkomst, och de brittiska kommissionärerna gav sig i kast med att mäta upp den och sälja den till plantageägare. År 1769 stoppade garifuna under sina hövdingar, bland dem Joseph Chatoyer, ett vägbyggarlag som eskorterades av 32:a regementet och höll det som gisslan, och de skaffade vapen från det franska Martinique. År 1772 sände den brittiska regeringen regementen från Nordamerika och de andra öarna, och generalmajor William Dalrymple ryckte fram norrut från Kingstown och landsatte trupper vid Grand Sable; men garifuna, omkring 1 500 till 3 000 kämpar, lade bakhåll för kolonnerna i de skogklädda bergen, och febern dödade många soldater. Eftersom kriget var impopulärt i parlamentet undertecknade Dalrymple och garifunahövdingarna ett fördrag den 17 februari 1773: garifuna erkände den brittiske kungen och behöll öns norra tredjedel, från Wallilabou River i väster till Byera River i öster. Det var det första fördrag som Storbritannien hade slutit med ett icke-europeiskt folk i Karibien sedan maronfördragen på Jamaica 1739."
