First Carlist War: Första carlistkriget
A civil war in Spain between the supporters of the child queen Isabella II and her mother, the regent Maria Christina, and those of Ferdinand VII’s brother Don Carlos, who claimed the throne as Carlos V and stood for absolute monarchy, the Church and the old regional rights (fueros). Fought mainly in the Basque provinces, Navarre, the Maestrazgo and Catalonia, it ended with the Convention of Vergara in 1839 and the defeat of the last Carlist armies in the east in 1840.: Ett inbördeskrig i Spanien mellan anhängarna till den unga drottningen Isabella II och hennes mor, regenten Maria Kristina, och anhängarna till Ferdinand VII:s bror Don Carlos, som gjorde anspråk på tronen som Carlos V och stod för envälde, kyrkan och de gamla regionala rättigheterna (fueros). Kriget utkämpades främst i de baskiska provinserna, Navarra, Maestrazgo och Katalonien och slutade med Vergarakonventionen 1839 och nederlaget för de sista carlistiska härarna i öster 1840.
