The Liberals were also called Cristinos or Isabelinos. Britain, France and Portugal backed them under the Quadruple Alliance of 1834 with loans, ships and troops, among them the British Legion of volunteers under George de Lacy Evans, the French Foreign Legion and a Portuguese division.: Liberalerna kallades också cristinos eller isabelinos. Storbritannien, Frankrike och Portugal stödde dem genom fyrfaldiga alliansen 1834 med lån, fartyg och trupper, bland dem den brittiska frivilliglegionen under George de Lacy Evans, Franska främlingslegionen och en portugisisk division.
Estimates of the dead vary widely, from about 100,000 to over 300,000 including civilians. Both sides shot prisoners and took reprisals on civilians, among them the mother of the Carlist general Ramón Cabrera, executed by the Liberals in 1836.: Uppskattningarna av antalet döda varierar kraftigt, från omkring 100 000 till över 300 000 inklusive civila. Båda sidor sköt fångar och tog repressalier mot civila, bland dem den karlistiske generalen Ramón Cabreras mor, som avrättades av liberalerna 1836.
