In the east Cabrera, a former seminarian whose ruthlessness matched that of his enemies, made the mountain town of Morella his base in January 1838 and beat off a Liberal siege that summer. In the north the war ground on in exhaustion. The Carlist camp split between hardline courtiers and generals ready to make peace. In February 1839 the Carlist commander, General Rafael Maroto, had several of his rivals shot at Estella, and he then negotiated with Espartero.: I öster gjorde Cabrera, en före detta prästseminarist vars hänsynslöshet matchade hans fienders, bergsstaden Morella till sin bas i januari 1838 och slog tillbaka en liberal belägring samma sommar. I norr fortsatte kriget i utmattning. Det karlistiska lägret splittrades mellan kompromisslösa hovmän och generaler som var beredda att sluta fred. I februari 1839 lät den karlistiske befälhavaren, general Rafael Maroto, skjuta flera av sina rivaler i Estella, och han förhandlade sedan med Espartero.
On 31 August 1839, by the Convention of Vergara, Maroto’s army laid down its arms. Its officers kept their ranks in the royal army, and Espartero promised to recommend that the government respect the fueros. The two generals embraced before their troops. Don Carlos crossed into France in September. Espartero then turned east, took Morella on 30 May 1840 and Berga in Catalonia in early July, and Cabrera led his last men into France. The fueros of the Basque provinces and Navarre were cut back in 1839–41, and Espartero soon replaced Maria Christina as regent.: Den 31 augusti 1839, genom Vergarakonventionen, nedlade Marotos armé vapnen. Dess officerare fick behålla sina grader i den kungliga armén, och Espartero lovade att rekommendera regeringen att respektera fueros. De två generalerna omfamnade varandra inför sina trupper. Don Carlos gick över till Frankrike i september. Espartero vände sig sedan österut, intog Morella den 30 maj 1840 och Berga i Katalonien i början av juli, och Cabrera ledde sina sista män in i Frankrike. De baskiska provinsernas och Navarras fueros beskars 1839–1841, och Espartero efterträdde snart Maria Kristina som regent.
