In 1830 Ferdinand VII set aside the law that barred women from the throne so that his daughter Isabella could succeed him. When he died on 29 September 1833 she became queen at the age of three, with her mother Maria Christina as regent, and his brother Don Carlos, then in Portugal, proclaimed himself king. Carlist risings broke out in October in Talavera, Bilbao, Vitoria and across the north. Most of the army and the cities stayed loyal to Isabella, and the regent turned to the liberals for support, but Carlism took hold in the countryside of the Basque provinces and Navarre, where the fueros were at stake, and in parts of Aragon and Catalonia.: År 1830 satte Ferdinand VII ur kraft den lag som utestängde kvinnor från tronen, så att hans dotter Isabella kunde efterträda honom. När han dog den 29 september 1833 blev hon drottning vid tre års ålder, med sin mor Maria Kristina som regent, och hans bror Don Carlos, då i Portugal, utropade sig till kung. Karlistiska resningar bröt ut i oktober i Talavera, Bilbao, Vitoria och över hela norra Spanien. Större delen av armén och städerna förblev lojala mot Isabella, och regenten sökte stöd hos liberalerna, men karlismen slog rot på landsbygden i de baskiska provinserna och Navarra, där fueros stod på spel, och i delar av Aragonien och Katalonien.
In Navarre Colonel Tomás de Zumalacárregui turned the Carlist bands into a disciplined army, which used the mountains to ambush and defeat government columns. Don Carlos, shipped to Britain after the Liberal victory in Portugal, crossed France in disguise and joined him in July 1834. Both sides shot their prisoners until a British envoy, Lord Eliot, arranged an agreement on exchanging them in April 1835. Don Carlos wanted a city to win foreign recognition and ordered Zumalacárregui to besiege Bilbao. He was wounded there in June and died on 24 June 1835. In July the Liberals won at Mendigorría, but the Carlists kept their hold on the countryside.: I Navarra gjorde översten Tomás de Zumalacárregui de karlistiska banden till en disciplinerad armé, som utnyttjade bergen för att lägga bakhåll för och besegra regeringens kolonner. Don Carlos, som skeppats till Storbritannien efter den liberala segern i Portugal, tog sig förklädd genom Frankrike och anslöt sig till honom i juli 1834. Båda sidor sköt sina fångar tills ett brittiskt sändebud, lord Eliot, i april 1835 förmedlade en överenskommelse om fångutväxling. Don Carlos ville ha en stad för att vinna erkännande utomlands och beordrade Zumalacárregui att belägra Bilbao. Han sårades där i juni och dog den 24 juni 1835. I juli segrade liberalerna vid Mendigorría, men karlisterna behöll greppet om landsbygden.
