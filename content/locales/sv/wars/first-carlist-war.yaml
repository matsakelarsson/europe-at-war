The Liberals were divided, and in August 1836 a mutiny of the guard at La Granja forced the regent to restore the constitution of 1812, while the minister Juan Álvarez Mendizábal sold off Church lands to pay for the war. The Carlists, unable to break out of the north, sent raiding columns across Spain. In 1836 General Miguel Gómez marched as far as Galicia and Andalusia and back, but held nothing. That autumn they besieged Bilbao again, and on the night of 23–24 December 1836 General Baldomero Espartero broke the siege in a snowstorm at the bridge of Luchana, with help from British ships and sailors.: Liberalerna var splittrade, och i augusti 1836 tvingade ett myteri bland gardet i La Granja regenten att återinföra 1812 års konstitution, medan ministern Juan Álvarez Mendizábal sålde ut kyrkans jord för att bekosta kriget. Karlisterna, som inte kunde bryta sig ut ur norr, skickade plundringskolonner genom Spanien. År 1836 marscherade general Miguel Gómez ända till Galicien och Andalusien och tillbaka, men höll ingenting. Den hösten belägrade de Bilbao igen, och natten mellan den 23 och 24 december 1836 bröt general Baldomero Espartero belägringen i en snöstorm vid Luchanabron, med hjälp av brittiska fartyg och sjömän.
In May 1837 Don Carlos himself left Estella with his best troops in the Royal Expedition, hoping to take Madrid or force a settlement with the regent. He won at Huesca and Barbastro, crossed the Ebro to join Ramón Cabrera’s forces from the Maestrazgo, was checked at Chiva in July, and in September reached the outskirts of Madrid, while a second Carlist column had taken Segovia. Expected support in the capital never came, and when Espartero’s army approached, Don Carlos turned back. The retreat to the north, harried all the way, broke Carlist morale and prestige.: I maj 1837 lämnade Don Carlos själv Estella med sina bästa trupper i den kungliga expeditionen, i hopp om att inta Madrid eller tvinga fram en uppgörelse med regenten. Han segrade vid Huesca och Barbastro, gick över Ebro för att förena sig med Ramón Cabreras styrkor från Maestrazgo, hejdades vid Chiva i juli och nådde i september Madrids utkanter, medan en andra karlistisk kolonn hade intagit Segovia. Det väntade stödet i huvudstaden uteblev, och när Esparteros armé närmade sig vände Don Carlos tillbaka. Återtåget norrut, ansatt hela vägen, bröt karlisternas moral och anseende.
