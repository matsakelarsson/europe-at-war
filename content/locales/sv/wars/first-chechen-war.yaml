Chechnya is shown as part of Russia on the map, as it is internationally recognised; no member of the United Nations recognised Ichkeria.: Tjetjenien visas på kartan som en del av Ryssland, eftersom det är internationellt erkänt som sådant; ingen medlemsstat i FN erkände Itjkerien.
Casualty figures vary widely. Russia’s official count of its military dead is about 5,500; estimates of civilian deaths range from about 30,000 to 100,000.: Uppgifterna om förluster varierar kraftigt. Rysslands officiella siffra för stupade militärer är omkring 5 500; uppskattningarna av antalet civila döda varierar från omkring 30 000 till 100 000.
