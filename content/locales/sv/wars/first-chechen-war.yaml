On 14 June 1995 Shamil Basayev and more than 100 fighters drove into Budyonnovsk in southern Russia and seized its hospital with well over 1,500 hostages. Two assaults by special forces failed; Prime Minister Viktor Chernomyrdin then negotiated with Basayev by telephone, promised a ceasefire and talks, and let the gunmen return to Chechnya with volunteer hostages. At least 129 people died. The talks broke down by the end of the year, and in January 1996 Salman Raduyev’s raid on Kizlyar in Dagestan ended in a battle at Pervomayskoye. On 21 April Dudayev was killed by a Russian missile.: Den 14 juni 1995 körde Sjamil Basajev och mer än 100 kämpar in i Budjonnovsk i södra Ryssland och besatte stadens sjukhus med långt över 1 500 gisslan. Två stormningar av specialstyrkor misslyckades; premiärminister Viktor Tjernomyrdin förhandlade sedan med Basajev per telefon, lovade vapenvila och samtal och lät de beväpnade männen återvända till Tjetjenien med frivilliga gisslan. Minst 129 människor dog. Samtalen bröt samman före årets slut, och i januari 1996 slutade Salman Radujevs räd mot Kizljar i Dagestan i ett slag vid Pervomajskoje. Den 21 april dödades Dudajev av en rysk robot.
On 6 August 1996, days before Yeltsin began his second term, Chechen fighters under Aslan Maskhadov infiltrated Grozny and cut off the Russian garrisons there. Yeltsin’s new security chief, Alexander Lebed, then negotiated with Maskhadov, and on 31 August they agreed the Khasavyurt Accord in Dagestan. Russian forces withdrew by the end of the year, and the question of Chechnya’s status was put off until the end of 2001. More than half a million people had been driven from their homes.: Den 6 augusti 1996, några dagar innan Jeltsin inledde sin andra mandatperiod, infiltrerade tjetjenska kämpar under Aslan Maschadov Groznyj och skar av de ryska garnisonerna där. Jeltsins nye säkerhetschef, Aleksandr Lebed, förhandlade sedan med Maschadov, och den 31 augusti enades de om Chasavjurtavtalet i Dagestan. De ryska styrkorna drogs tillbaka före årets slut, och frågan om Tjetjeniens status sköts upp till slutet av 2001. Mer än en halv miljon människor hade drivits från sina hem.
