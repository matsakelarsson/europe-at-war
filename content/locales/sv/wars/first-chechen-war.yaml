In November 1991, as the Soviet Union broke up, the former Soviet air force general Dzhokhar Dudayev, newly elected president of Chechnya, declared it independent. Russia never accepted this, and three years of uneasy separation followed. In 1994 Moscow armed an anti-Dudayev opposition, but its attack on Grozny on 26 November, with Russian soldiers secretly hired as tank crews, failed, and some of the Russians were captured. On 11 December Boris Yeltsin sent about 40,000 troops into Chechnya from the north, the west and the east.: I november 1991, när Sovjetunionen föll sönder, förklarade den förre sovjetiske flygvapengeneralen Dzjochar Dudajev, nyvald president i Tjetjenien, landet självständigt. Ryssland godtog aldrig detta, och tre år av spänd åtskillnad följde. År 1994 beväpnade Moskva en opposition mot Dudajev, men dess anfall mot Groznyj den 26 november, med ryska soldater som i hemlighet hyrts in som stridsvagnsbesättningar, misslyckades, och en del av ryssarna tillfångatogs. Den 11 december sände Boris Jeltsin omkring 40 000 soldater in i Tjetjenien från norr, väster och öster.
The assault on Grozny on New Year’s Eve was a disaster for Russia. Armoured columns sent into the city with little infantry were destroyed in its streets, among them the 131st Maikop Brigade at the railway station. Russia then pounded the city with artillery and bombing, took the ruins of the presidential palace on 19 January 1995 and the last districts in early March. Yeltsin’s human rights adviser Sergei Kovalev estimated that about 27,000 civilians died in the first five weeks. In April interior troops killed scores of civilians in the village of Samashki, and in June Russian forces took Vedeno and Shatoy in the mountains.: Stormningen av Groznyj på nyårsafton blev en katastrof för Ryssland. Pansarkolonner som skickades in i staden med lite infanteri förintades på dess gator, bland dem 131:a Majkopbrigaden vid järnvägsstationen. Ryssland bombarderade sedan staden med artilleri och flyg, intog ruinerna av presidentpalatset den 19 januari 1995 och de sista stadsdelarna i början av mars. Jeltsins rådgivare i mänskliga rättigheter Sergej Kovaljov uppskattade att omkring 27 000 civila dog under de första fem veckorna. I april dödade inrikestrupper dussintals civila i byn Samasjki, och i juni intog ryska styrkor Vedeno och Sjatoj i bergen.
