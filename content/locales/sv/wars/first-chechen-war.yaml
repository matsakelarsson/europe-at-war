First Chechen War: Första Tjetjenienkriget
A war in which Russia tried to end the independence that Chechnya had declared in 1991. Russian forces took a ruined Grozny in early 1995 at a heavy cost in civilian lives, but Chechen fighters fought on, and after they retook Grozny in August 1996 the Khasavyurt Accord brought a Russian withdrawal and left Chechnya’s status undecided.: Ett krig där Ryssland försökte göra slut på den självständighet som Tjetjenien hade utropat 1991. Ryska styrkor intog ett sönderskjutet Groznyj i början av 1995 till ett högt pris i civila liv, men tjetjenska kämpar stred vidare, och sedan de återtagit Groznyj i augusti 1996 ledde Chasavjurtavtalet till ett ryskt tillbakadragande och lämnade Tjetjeniens status oavgjord.
