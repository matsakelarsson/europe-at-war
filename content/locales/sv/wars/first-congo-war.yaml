# Svenska översättningar av katalogtexten (våg 13); stegtexterna kommer senare.
First Congo War: Första Kongokriget
? The war in which Rwanda, Uganda and their allies overthrew Mobutu Sese Seko, who had ruled Zaire since 1965. After the genocide of 1994, more than a million Rwandan Hutu refugees, among them the soldiers and militiamen who had carried out the genocide, settled in camps along Zaire’s eastern border, from which they raided Rwanda and attacked Congolese Tutsi. In October 1996 Rwanda’s army and Congolese Tutsi fighters attacked the camps, under the cover of a new rebel coalition, the Alliance of Democratic Forces for the Liberation of Congo-Zaire (AFDL), led by the veteran rebel Laurent-Désiré Kabila. Several hundred thousand refugees went home; others fled west across the country, where AFDL and Rwandan troops hunted them down and killed tens of thousands, killings a UN report of 2010 said might be classed as genocide if proven in court. Joined by Uganda, Burundi and Angola, the AFDL crossed Zaire in seven months against a collapsing army. Mobutu fled Kinshasa on 16 May 1997, and the next day Kabila declared himself president of the Democratic Republic of the Congo. His break with his Rwandan and Ugandan backers led to the Second Congo War in 1998.
: Det krig där Rwanda, Uganda och deras allierade störtade Mobutu Sese Seko, som hade styrt Zaire sedan 1965. Efter folkmordet 1994 slog sig mer än en miljon rwandiska hutuflyktingar, bland dem de soldater och milismän som hade utfört folkmordet, ned i läger längs Zaires östra gräns, varifrån de gjorde räder in i Rwanda och angrep kongolesiska tutsier. I oktober 1996 anföll Rwandas armé och kongolesiska tutsikämpar lägren, under täckmantel av en ny rebellkoalition, Alliansen av demokratiska krafter för Kongo-Zaires befrielse (AFDL), ledd av den mångårige rebellen Laurent-Désiré Kabila. Flera hundra tusen flyktingar återvände hem; andra flydde västerut genom landet, där AFDL:s och Rwandas trupper jagade dem och dödade tiotusentals, dödanden som enligt en FN-rapport från 2010 skulle kunna betecknas som folkmord om de bevisades inför domstol. Med stöd av Uganda, Burundi och Angola korsade AFDL Zaire på sju månader mot en armé i upplösning. Mobutu flydde från Kinshasa den 16 maj 1997, och dagen därpå utropade Kabila sig till president i Demokratiska republiken Kongo. Hans brytning med sina rwandiska och ugandiska uppbackare ledde till andra Kongokriget 1998.
