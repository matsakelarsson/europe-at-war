Dates are Julian. Most of what is known comes from Latin chronicles written by participants (the anonymous Gesta Francorum, Raymond of Aguilers, Fulcher of Chartres), from Anna Komnene’s Alexiad, written decades later, and from Arabic historians such as Ibn al-Athir, writing a century later. Numbers of soldiers and of the dead come from these chroniclers and are uncertain.: Datumen anges enligt den julianska kalendern. Det mesta av vad vi vet kommer från latinska krönikor skrivna av deltagare (den anonyma Gesta Francorum, Raimond av Aguilers, Fulcher av Chartres), från Anna Komnenas Alexiaden, skriven årtionden senare, och från arabiska historiker som Ibn al-Athir, som skrev ett sekel senare. Antalet soldater och döda kommer från dessa krönikörer och är osäkert.
Places have the names usual in histories of the crusades, with modern names where they help, such as Nicaea (İznik), Dorylaeum (near Eskişehir), Iconium (Konya), Edessa (Şanlıurfa), Antioch (Antakya), Ma‘arra (Maarat al-Numan) and Ascalon (Ashkelon).: Orterna har de namn som är vanliga i korstågshistoriken, med moderna namn där det underlättar, som Nicaea (İznik), Dorylaion (nära Eskişehir), Ikonion (Konya), Edessa (Şanlıurfa), Antiochia (Antakya), Ma‘arra (Maarat al-Numan) och Askalon (Ashkelon).
The Crusade of 1101, the Byzantine recovery of western Anatolia and the Second Crusade have their own entries. Robert Guiscard’s and Bohemond’s earlier war against Alexios, with the battle of Dyrrhachium in 1081, is told under the Norman conquest of southern Italy.: Korståget 1101, Bysans återerövring av västra Anatolien och andra korståget har egna artiklar. Robert Guiscards och Bohemunds tidigare krig mot Alexios, med slaget vid Dyrrachion 1081, berättas under den normandiska erövringen av södra Italien.
