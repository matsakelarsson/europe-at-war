The first pitched battle of the crusade. The crusaders lost heavily but held their ground, and the Turks never again tried to stop them in open battle in Anatolia.: Korstågets första fältslag. Korsfararna led svåra förluster men höll stånd, och turkarna försökte aldrig mer stoppa dem i öppen strid i Anatolien.
