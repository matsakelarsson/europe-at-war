In March 1095 envoys of the Byzantine emperor Alexios I Komnenos asked Pope Urban II for soldiers to fight the Seljuk Turks, who since the 1070s had overrun most of Anatolia and taken much of Syria and Palestine. On 27 November 1095, at Clermont in France, Urban called on the knights of the West to go east, help the Christians there and free Jerusalem, promising that the journey would count as full penance for their sins. Preachers carried the call across France and Germany, and the response went far beyond anything the pope had planned.: I mars 1095 bad sändebud från den bysantinske kejsaren Alexios I Komnenos påven Urban II om soldater för att bekämpa seldjukturkarna, som sedan 1070-talet hade lagt under sig större delen av Anatolien och intagit stora delar av Syrien och Palestina. Den 27 november 1095, i Clermont i Frankrike, uppmanade Urban Västerlandets riddare att dra österut, hjälpa de kristna där och befria Jerusalem, och lovade att färden skulle gälla som full bot för deras synder. Predikanter förde budskapet vidare genom Frankrike och Tyskland, och gensvaret blev långt större än något påven hade tänkt sig.
The first to set out were crowds of poor people and minor knights, stirred by preachers such as Peter the Hermit. In May and June 1096 bands led by Count Emicho and others massacred the Jews of Speyer, Worms, Mainz and Cologne; King Coloman of Hungary later scattered several of these bands. Peter’s followers crossed Hungary, fought the Byzantine garrison at Niš and reached Constantinople on 1 August. Alexios ferried them over to Civetot in Asia Minor. A German group seized the fort of Xerigordos and was starved into surrender, and on 21 October the Turks of Kilij Arslan I destroyed the main body near Civetot.: De första som gav sig av var skaror av fattigt folk och lågadliga riddare, uppeggade av predikanter som Peter Eremiten. I maj och juni 1096 massakrerade band under greve Emicho och andra judarna i Speyer, Worms, Mainz och Köln; kung Koloman av Ungern skingrade senare flera av dessa band. Peters följeslagare tog sig genom Ungern, stred mot den bysantinska garnisonen i Niš och nådde Konstantinopel den 1 augusti. Alexios lät föra dem över till Civetot i Mindre Asien. En tysk grupp intog fortet Xerigordos och svältes till kapitulation, och den 21 oktober förintade Kilij Arslan I:s turkar huvudstyrkan nära Civetot.
The armies of the great lords followed. Godfrey of Bouillon, Duke of Lower Lorraine, came through Hungary and reached Constantinople on 23 December 1096. Bohemond of Taranto, Raymond of Saint-Gilles, Count of Toulouse, Robert of Normandy, Robert of Flanders and Stephen of Blois came by way of Italy, Dalmatia and the old Roman road across the Balkans, the Via Egnatia, in the spring of 1097. How many took part is uncertain, but these were the largest armies the Latin West had ever sent east, with many non-combatants among them.: De stora herrarnas härar följde efter. Gottfrid av Bouillon, hertig av Nedre Lothringen, kom genom Ungern och nådde Konstantinopel den 23 december 1096. Bohemund av Taranto, Raimond av Saint-Gilles, greve av Toulouse, Robert av Normandie, Robert av Flandern och Stefan av Blois kom våren 1097 via Italien, Dalmatien och den gamla romerska vägen över Balkan, Via Egnatia. Hur många som deltog är osäkert, men det var de största härar det latinska Västerlandet någonsin hade sänt österut, och bland dem fanns många icke-stridande.
