The leaders swore their oaths to Alexios here. Godfrey of Bouillon held out for months, and his men fought imperial troops outside the walls before he gave way.: Ledarna svor sina eder till Alexios här. Gottfrid av Bouillon vägrade i månader, och hans män stred mot kejserliga trupper utanför murarna innan han gav med sig.
