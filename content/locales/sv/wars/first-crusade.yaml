Lake Askania: Askaniasjön
June 1097: juni 1097
Byzantine boats, dragged overland from the Gulf of Nicomedia, were launched on the lake and closed the city’s western side.: Bysantinska båtar, som släpats över land från Nikomediabukten, sjösattes på sjön och stängde stadens västra sida.
Crusader armies: Korsfararhärar
Kilij Arslan I: Kilij Arslan I
The army left Nicaea at the end of June in two groups, a day’s march apart. On 1 July 1097, near Dorylaeum, Kilij Arslan, now allied with the Danishmendid emir Gazi Gümüshtigin, surrounded the leading group under Bohemond, Robert of Normandy and Stephen of Blois. For hours Turkish horse archers shot into the knights and the crowded camp. The crusaders held on until Godfrey and Raymond came up with the second group and the papal legate, Bishop Adhemar of Le Puy, fell on the Turks from behind. The Turks fled, leaving their camp and treasure.: Hären lämnade Nicaea i slutet av juni i två grupper, en dagsmarsch från varandra. Den 1 juli 1097, nära Dorylaion, omringade Kilij Arslan, nu allierad med den danishmendidiske emiren Gazi Gümüshtigin, den främre gruppen under Bohemund, Robert av Normandie och Stefan av Blois. I timmar sköt turkiska beridna bågskyttar in bland riddarna och i det trånga lägret. Korsfararna höll ut tills Gottfrid och Raimond kom fram med den andra gruppen och den påvlige legaten, biskop Adhémar av Le Puy, föll turkarna i ryggen. Turkarna flydde och lämnade sitt läger och sina skatter.
Kilij Arslan stripped the country ahead of the crusaders. Their march across the dry Anatolian plateau in July and August cost many lives and most of the horses; knights went on foot, and oxen, goats and even dogs carried the baggage. They passed Philomelion and Iconium, beat another Turkish force at Heraclea in September and turned north-east by Caesarea and over the Anti-Taurus to Marash, reaching Antioch on 20 October. Meanwhile Tancred and Baldwin of Boulogne, Godfrey’s brother, crossed into Cilicia and quarrelled over Tarsus, which Baldwin took; Tancred went on to Adana and Mamistra.: Kilij Arslan skövlade landet framför korsfararna. Deras marsch över den torra anatoliska högplatån i juli och augusti kostade många liv och de flesta hästarna; riddare gick till fots, och oxar, getter och till och med hundar bar packningen. De passerade Philomelion och Ikonion, besegrade en annan turkisk styrka vid Herakleia i september och vände mot nordost förbi Caesarea och över Antitauros till Marash och nådde Antiochia den 20 oktober. Under tiden tog sig Tankred och Balduin av Boulogne, Gottfrids bror, in i Kilikien och grälade om Tarsos, som Balduin intog; Tankred fortsatte till Adana och Mamistra.
