9 February 1098: 9 februari 1098
With the few hundred knights who still had horses, Bohemond ambushed and routed the relief army of Ridwan of Aleppo between the Orontes and the lake.: Med de få hundra riddare som fortfarande hade hästar överföll Bohemund Ridwan av Aleppos undsättningshär mellan Orontes och sjön och slog den på flykten.
St Symeon: S:t Symeon
March 1098: mars 1098
Antioch’s port on the Orontes estuary, where Genoese and English ships landed supplies for the besiegers.: Antiochias hamn vid Orontes mynning, där genuesiska och engelska fartyg landsatte förnödenheter åt belägrarna.
Antioch: Antiochia
One of the longest sieges of the crusades. The city fell by treachery after more than seven months.: En av korstågens längsta belägringar. Staden föll genom förräderi efter mer än sju månader.
Baldwin of Boulogne: Balduin av Boulogne
Ridwan of Aleppo: Ridwan av Aleppo
Within days of taking the city, the crusaders were themselves besieged. Kerbogha, the atabeg of Mosul, had gathered an army of Turkish and Arab emirs, among them Duqaq of Damascus, and on the way had spent three weeks trying in vain to take Edessa. Trapped between his army and the citadel, the crusaders starved, and many let themselves down the walls on ropes and fled. One of them, Stephen of Blois, met Alexios at Philomelion as the emperor marched to help and persuaded him that the crusade was lost. Alexios turned back, which the crusaders never forgave.: Inom några dagar efter att ha intagit staden blev korsfararna själva belägrade. Kerbogha, atabeg av Mosul, hade samlat en här av turkiska och arabiska emirer, bland dem Duqaq av Damaskus, och hade på vägen ägnat tre veckor åt att förgäves försöka inta Edessa. Instängda mellan hans här och citadellet svalt korsfararna, och många firade ner sig från murarna med rep och flydde. En av dem, Stefan av Blois, mötte Alexios i Philomelion när kejsaren var på väg till undsättning och övertygade honom om att korståget var förlorat. Alexios vände tillbaka, något som korsfararna aldrig förlät honom.
On 14 June, after a poor Provençal pilgrim, Peter Bartholomew, reported visions of St Andrew, a spearhead said to be the Holy Lance that had pierced Christ was dug up in the cathedral of St Peter. Their spirits raised, the crusaders marched out on 28 June under Bohemond’s command. Kerbogha let them deploy, but his coalition, divided by rivalries and fears of his ambitions, fell apart; several emirs left the field and the rest of the army fled. The citadel surrendered the same day.: Den 14 juni, sedan en fattig provensalsk pilgrim, Peter Bartholomeus, berättat om syner av aposteln Andreas, grävdes en spjutspets fram i Petruskatedralen, som sades vara den heliga lansen som hade genomborrat Kristus. Med höjd stridsmoral marscherade korsfararna ut den 28 juni under Bohemunds befäl. Kerbogha lät dem formera sig, men hans koalition, splittrad av rivalitet och farhågor för hans ambitioner, föll sönder; flera emirer lämnade slagfältet och resten av hären flydde. Citadellet kapitulerade samma dag.
The victory saved the crusade, but the leaders did not march on. An epidemic broke out, killing Adhemar of Le Puy on 1 August, and Bohemond and Raymond quarrelled over Antioch, which Bohemond claimed in spite of the oath to Alexios. In late November the army besieged Ma‘arrat al-Nu‘man. It fell on 12 December and its people were massacred, and crusader chroniclers wrote that starving soldiers ate the bodies of the dead.: Segern räddade korståget, men ledarna marscherade inte vidare. En epidemi bröt ut, som den 1 augusti kostade Adhémar av Le Puy livet, och Bohemund och Raimond grälade om Antiochia, som Bohemund gjorde anspråk på trots eden till Alexios. I slutet av november belägrade hären Ma‘arrat al-Nu‘man. Staden föll den 12 december och invånarna massakrerades, och korsfararkrönikörer skrev att svältande soldater åt de dödas kroppar.
Holy Lance found: Den heliga lansen hittas
14 June 1098: 14 juni 1098
Battle of Antioch: Slaget vid Antiochia
28 June 1098, crusader victory: 28 juni 1098, korsfararseger
Ma‘arra taken: Ma‘arra intas
12 December 1098: 12 december 1098
May 1098: maj 1098
Kerbogha besieged Baldwin’s new county for three weeks before giving up and marching on to Antioch, a delay that gave the crusaders time to take the city.: Kerbogha belägrade Balduins nya grevskap i tre veckor innan han gav upp och tågade vidare mot Antiochia, ett dröjsmål som gav korsfararna tid att inta staden.
Philomelion: Philomelion
late June 1098: slutet av juni 1098
Alexios, marching to relieve Antioch, met deserters here and, believing the crusaders lost, withdrew and laid waste the country behind him to slow the Turks.: Alexios, på väg för att undsätta Antiochia, mötte desertörer här och drog sig, i tron att korsfararna var förlorade, tillbaka och ödelade landet bakom sig för att bromsa turkarna.
28 June 1098: 28 juni 1098
The crusaders came out of the city in six divisions, with the Holy Lance carried before them. Kerbogha’s army broke up almost without a fight.: Korsfararna drog ut ur staden i sex avdelningar med den heliga lansen buren framför sig. Kerboghas här föll sönder nästan utan strid.
Ma‘arrat al-Nu‘man: Ma‘arrat al-Nu‘man
The town was stormed after a two-week siege. Its inhabitants were killed or sold into slavery, and the episode of cannibalism was long remembered in the Muslim world.: Staden stormades efter en två veckor lång belägring. Invånarna dödades eller såldes som slavar, och kannibalismen mindes länge i den muslimska världen.
Kerbogha: Kerbogha
Alexios I: Alexios I
Pressed by his own soldiers, Raymond of Toulouse led the march south from Ma‘arra on 13 January 1099, barefoot as a pilgrim; Bohemond stayed in Antioch. The emirs of Shaizar, Homs and Tripoli bought peace with food and money. From February to May the crusaders besieged Arqa in vain, and Peter Bartholomew, whose Holy Lance many now doubted, died after walking through fire to prove it genuine. Giving up Arqa, the army marched quickly down the coast past Beirut, Tyre and Acre, and turned inland at Arsuf to Ramla.: Pressad av sina egna soldater ledde Raimond av Toulouse marschen söderut från Ma‘arra den 13 januari 1099, barfota som en pilgrim; Bohemund stannade i Antiochia. Emirerna av Shaizar, Homs och Tripoli köpte fred med livsmedel och pengar. Från februari till maj belägrade korsfararna förgäves Arqa, och Peter Bartholomeus, vars heliga lans många nu tvivlade på, dog sedan han gått genom eld för att bevisa att den var äkta. Hären gav upp Arqa, marscherade snabbt ner längs kusten förbi Beirut, Tyros och Akko och vände inåt landet vid Arsuf mot Ramla.
The Fatimid caliphate of Egypt had taken Jerusalem from the Turks in August 1098 and offered the crusaders free access for unarmed pilgrims, but the leaders would accept nothing less than the city. They reached it on 7 June 1099 with perhaps 1,300 knights and 12,000 foot. The governor, Iftikhar al-Dawla, had poisoned the wells outside and expelled the city’s Christians. An early assault failed for lack of ladders. Genoese sailors who had landed at Jaffa brought timber, and the crusaders built siege towers; on 8 July they walked barefoot in procession around the walls.: Det fatimidiska kalifatet i Egypten hade tagit Jerusalem från turkarna i augusti 1098 och erbjöd korsfararna fritt tillträde för obeväpnade pilgrimer, men ledarna godtog inget mindre än staden. De nådde den den 7 juni 1099 med kanske 1 300 riddare och 12 000 fotsoldater. Guvernören, Iftikhar al-Dawla, hade förgiftat brunnarna utanför staden och fördrivit stadens kristna. En tidig stormning misslyckades i brist på stegar. Genuesiska sjömän som landstigit i Jaffa kom med timmer, och korsfararna byggde belägringstorn; den 8 juli gick de barfota i procession runt murarna.
In the assault of 13–15 July, Godfrey’s tower reached the northern wall and his men broke into the city. The governor surrendered the Tower of David to Raymond and was allowed to leave, but the crusaders killed most of the Muslims they found, including many who had taken refuge in the al-Aqsa Mosque, and many of the Jews, though some were captured and later ransomed. The death toll is disputed. Ibn al-Athir gave 70,000; some modern historians estimate about 3,000. On 22 July the leaders chose Godfrey as ruler; he took the title Advocate of the Holy Sepulchre.: Vid stormningen den 13–15 juli nådde Gottfrids torn den norra muren och hans män bröt sig in i staden. Guvernören överlämnade Davids torn till Raimond och fick lämna staden, men korsfararna dödade de flesta muslimer de fann, däribland många som hade sökt skydd i al-Aqsamoskén, och många av judarna, även om en del tillfångatogs och senare löstes ut. Dödstalet är omstritt. Ibn al-Athir uppgav 70 000; en del moderna historiker uppskattar det till omkring 3 000. Den 22 juli valde ledarna Gottfrid till härskare; han antog titeln Den heliga gravens försvarare.
Siege of Arqa: Belägringen av Arqa
14 February – 13 May 1099, abandoned: 14 februari – 13 maj 1099, avbruten
Siege of Jerusalem: Belägringen av Jerusalem
7 June – 15 July 1099: 7 juni – 15 juli 1099
Godfrey chosen as ruler: Gottfrid väljs till härskare
22 July 1099: 22 juli 1099
Arqa: Arqa
14 February – 13 May 1099: 14 februari – 13 maj 1099
The town held out for three months against the crusaders, who wanted to force the emir of Tripoli to pay more. Its defenders were left in peace when the army moved on.: Staden höll stånd i tre månader mot korsfararna, som ville tvinga emiren av Tripoli att betala mer. Försvararna lämnades i fred när hären drog vidare.
Ramla: Ramla
3 June 1099: 3 juni 1099
The crusaders found the town abandoned and made the nearby church of St George at Lydda the seat of the first Latin bishop in the Holy Land.: Korsfararna fann staden övergiven och gjorde den närbelägna Sankt Georgskyrkan i Lydda till säte för den förste latinske biskopen i Heliga landet.
Jaffa: Jaffa
17 June 1099: 17 juni 1099
Genoese ships put in at the abandoned port. Their crews brought the timber and skills to build siege engines.: Genuesiska fartyg lade till i den övergivna hamnen. Deras besättningar kom med timret och kunnandet för att bygga belägringsmaskiner.
Jerusalem: Jerusalem
15 July 1099: 15 juli 1099
Godfrey’s men crossed from their tower onto the northern wall near the Gate of Flowers. The city was taken after a siege of five weeks.: Gottfrids män tog sig från sitt torn över på den norra muren nära Blomsterporten. Staden intogs efter fem veckors belägring.
In August 1099 the Fatimid vizier al-Afdal Shahanshah brought an army from Egypt to Ascalon to recover Jerusalem. The crusaders marched out to meet him, and at dawn on 12 August they surprised his camp outside the town and routed his army. Ascalon itself wanted to surrender to Raymond, but Godfrey would not let him have it, and it stayed in Fatimid hands until 1153. Most of the crusaders now went home, leaving Godfrey with a few hundred knights.: I augusti 1099 förde den fatimidiske vesiren al-Afdal Shahanshah en här från Egypten till Askalon för att återta Jerusalem. Korsfararna marscherade ut för att möta honom, och i gryningen den 12 augusti överraskade de hans läger utanför staden och slog hans här på flykten. Askalon självt ville kapitulera för Raimond, men Gottfrid lät honom inte få staden, och den förblev i fatimidiska händer till 1153. De flesta korsfararna for nu hem och lämnade Gottfrid med några hundra riddare.
The crusade had created three Latin states, known together in the West as Outremer, “the land beyond the sea”. When Godfrey died in July 1100, his brother Baldwin of Edessa came south and was crowned King of Jerusalem in Bethlehem on Christmas Day 1100. With fleets from Genoa, Pisa and Venice the Franks took the coastal towns, among them Caesarea in 1101, Acre in 1104, Tripoli in 1109 after a long siege, Beirut and Sidon in 1110 and Tyre in 1124. Tripoli became a fourth state, a county ruled by Raymond of Toulouse’s heirs.: Korståget hade skapat tre latinska stater, i väst gemensamt kallade Outremer, ”landet bortom havet”. När Gottfrid dog i juli 1100 kom hans bror Balduin av Edessa söderut och kröntes till kung av Jerusalem i Betlehem på juldagen 1100. Med flottor från Genua, Pisa och Venedig intog frankerna kuststäderna, bland dem Caesarea 1101, Akko 1104, Tripoli 1109 efter en lång belägring, Beirut och Sidon 1110 och Tyros 1124. Tripoli blev en fjärde stat, ett grevskap som styrdes av Raimond av Toulouses arvingar.
Bohemond, who had kept Antioch against his oath to Alexios, was captured by the Danishmendids in 1100, and the armies of the Crusade of 1101 were destroyed in Anatolia. A Turkish victory at Harran in 1104 stopped the Franks’ advance towards Mesopotamia. Bohemond went to Europe to raise an army against Byzantium, but failed to take Dyrrhachium and in the Treaty of Devol (1108) had to accept Alexios as his overlord. The treaty was never carried out.: Bohemund, som hade behållit Antiochia i strid med sin ed till Alexios, tillfångatogs av danishmendiderna 1100, och härarna i korståget 1101 förintades i Anatolien. En turkisk seger vid Harran 1104 stoppade frankernas framryckning mot Mesopotamien. Bohemund for till Europa för att samla en här mot Bysans, men misslyckades med att inta Dyrrachion och måste i fördraget i Devol (1108) erkänna Alexios som sin överherre. Fördraget genomfördes aldrig.
