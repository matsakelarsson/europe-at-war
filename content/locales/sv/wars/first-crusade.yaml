First Crusade: Första korståget
The first of the great expeditions from Latin Europe to the eastern Mediterranean, called by Pope Urban II at Clermont in 1095 after the Byzantine emperor Alexios I asked for help against the Seljuk Turks. After the People’s Crusade was destroyed in Anatolia, the armies of the princes took Nicaea for Byzantium, beat the Turks at Dorylaeum, took Antioch after an eight-month siege and stormed Jerusalem in July 1099, killing much of its population. They founded the County of Edessa, the Principality of Antioch and the Kingdom of Jerusalem, later joined by the County of Tripoli.: Den första av de stora expeditionerna från det latinska Europa till östra Medelhavet, utlyst av påven Urban II i Clermont 1095 sedan den bysantinske kejsaren Alexios I bett om hjälp mot seldjukturkarna. Sedan folkkorståget förintats i Anatolien intog furstarnas härar Nicaea åt Bysans, besegrade turkarna vid Dorylaion, intog Antiochia efter en åtta månader lång belägring och stormade Jerusalem i juli 1099, varvid en stor del av befolkningen dödades. De grundade grevskapet Edessa, furstendömet Antiochia och kungariket Jerusalem, som senare fick sällskap av grevskapet Tripoli.
