Alexios had hoped for soldiers he could command, not independent armies led by great lords, one of whom, Bohemond, had invaded the empire with his father Robert Guiscard in 1081. He supplied the crusaders but asked each leader to swear to return to the empire any former imperial lands they took. Most did, some only after armed clashes outside the walls. Raymond of Toulouse swore only to respect the emperor’s life and honour, and Bohemond’s nephew Tancred slipped across the Bosporus to avoid swearing at all.: Alexios hade hoppats på soldater som han kunde föra befäl över, inte självständiga härar ledda av stora herrar, av vilka en, Bohemund, hade invaderat riket tillsammans med sin far Robert Guiscard 1081. Han försåg korsfararna med förnödenheter men bad varje ledare svära att återlämna till riket alla tidigare kejserliga länder som de intog. De flesta gjorde det, en del först efter väpnade sammandrabbningar utanför murarna. Raimond av Toulouse svor endast att respektera kejsarens liv och ära, och Bohemunds brorson Tankred smet över Bosporen för att slippa svära alls.
In May 1097 the armies besieged Nicaea, the capital of Kilij Arslan’s Sultanate of Rum, beside Lake Askania. Kilij Arslan, who had been away fighting the Danishmendids, came back and attacked on 16 May, but was beaten off with heavy losses. Alexios had boats hauled overland to the lake to cut the city off. Seeing no hope, the garrison secretly negotiated with the Byzantine commander Manuel Boutoumites, and on 19 June the crusaders woke to find imperial banners on the walls. Many resented losing the plunder, though Alexios rewarded the leaders generously.: I maj 1097 belägrade härarna Nicaea, huvudstaden i Kilij Arslans sultanat Rum, vid Askaniasjön. Kilij Arslan, som hade varit borta och krigat mot danishmendiderna, återvände och anföll den 16 maj men slogs tillbaka med svåra förluster. Alexios lät dra båtar över land till sjön för att skära av staden. Utan hopp förhandlade garnisonen i hemlighet med den bysantinske befälhavaren Manuel Boutoumites, och den 19 juni vaknade korsfararna och fann kejserliga fanor på murarna. Många var förbittrade över att gå miste om bytet, även om Alexios belönade ledarna frikostigt.
