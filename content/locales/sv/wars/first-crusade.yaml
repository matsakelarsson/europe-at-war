Battle of Heraclea: Slaget vid Herakleia
September 1097: september 1097
Bohemond scattered a Turkish force waiting at the town, opening the roads into Cilicia and towards Caesarea.: Bohemund skingrade en turkisk styrka som väntade vid staden och öppnade vägarna in i Kilikien och mot Caesarea.
Tarsus: Tarsos
Tancred reached the town first, but Baldwin, with the larger force, made him leave. Baldwin then refused to let 300 of Bohemond’s men in, and the Turks killed them outside the walls.: Tankred nådde staden först, men Balduin, med den större styrkan, tvingade honom att ge sig av. Balduin vägrade sedan släppa in 300 av Bohemunds män, och turkarna dödade dem utanför murarna.
Marash: Marash
October 1097: oktober 1097
The army rested in this Armenian town after a hard crossing of the Anti-Taurus mountains, where many men and animals fell from the narrow paths.: Hären vilade i denna armeniska stad efter en svår övergång av Antitaurosbergen, där många män och djur störtade från de smala stigarna.
Main army: Huvudhären
Tancred and Baldwin: Tankred och Balduin
At Marash Baldwin of Boulogne left the main army with a small force and rode east towards the Euphrates, where Armenian Christians welcomed him and helped him take Turbessel and Ravendel. Thoros, the Armenian lord of Edessa, hard pressed by his Turkish neighbours, invited him in and adopted him as his son. On 9 March 1098 Thoros was killed by a mob, which Baldwin may have encouraged, and the next day Baldwin took over the city. The County of Edessa, a mainly Armenian land astride the Euphrates, was the first crusader state.: I Marash lämnade Balduin av Boulogne huvudhären med en liten styrka och red österut mot Eufrat, där armeniska kristna välkomnade honom och hjälpte honom att inta Turbessel och Ravendel. Thoros, den armeniske herren över Edessa, hårt ansatt av sina turkiska grannar, bjöd in honom och adopterade honom som sin son. Den 9 mars 1098 dödades Thoros av en folkmassa, som Balduin kan ha uppmuntrat, och dagen därpå tog Balduin över staden. Grevskapet Edessa, ett huvudsakligen armeniskt land på båda sidor om Eufrat, var den första korsfararstaten.
Antioch, the great city of northern Syria, had been Byzantine until 1084. Its Turkish governor, Yaghi-Siyan, held walls that climbed the steep mountain behind the city and could not be fully surrounded, and the crusaders blockaded it from 20 October 1097. That winter they starved. Foraging parties had to go far afield; Bohemond and Robert of Flanders beat a relief army from Damascus on 31 December, and on 9 February 1098 Bohemond routed one from Aleppo. Many deserted, and the Byzantine contingent under Tatikios left in February.: Antiochia, norra Syriens stora stad, hade varit bysantinsk fram till 1084. Dess turkiske guvernör, Yaghi-Siyan, höll murar som klättrade uppför det branta berget bakom staden och som inte kunde omringas helt, och korsfararna blockerade den från den 20 oktober 1097. Den vintern svalt de. Furagerande avdelningar måste gå långt bort; Bohemund och Robert av Flandern besegrade en undsättningshär från Damaskus den 31 december, och den 9 februari 1098 slog Bohemund en från Aleppo på flykten. Många deserterade, och den bysantinska kontingenten under Tatikios gav sig av i februari.
In March an English fleet landed timber and supplies at the port of St Symeon, and the crusaders built forts to close the city’s gates. Bohemond secretly won over Firuz, who commanded towers on the walls. On the night of 2–3 June 1098 crusaders climbed into the city by a rope ladder and opened the gates, and in the darkness killed many of its people, Christians as well as Muslims. Yaghi-Siyan fled and was killed; his son held out in the citadel high above the town.: I mars landsatte en engelsk flotta timmer och förnödenheter i hamnen S:t Symeon, och korsfararna byggde fort för att stänga stadens portar. Bohemund vann i hemlighet över Firuz, som förde befäl över torn på murarna. Natten mellan den 2 och 3 juni 1098 klättrade korsfarare in i staden på en repstege och öppnade portarna, och i mörkret dödade de många av invånarna, kristna såväl som muslimer. Yaghi-Siyan flydde och dödades; hans son höll ut i citadellet högt ovanför staden.
