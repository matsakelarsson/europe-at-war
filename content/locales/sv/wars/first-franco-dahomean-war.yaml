# Svenska översättningar av katalogtexten (våg 13); stegtexterna kommer senare.
First Franco-Dahomean War: Första fransk-dahomeyska kriget
? A short war between France and the Kingdom of Dahomey over the coast of what is now Benin. France had claimed a protectorate over Porto-Novo, a rival kingdom long raided by Dahomey, since 1863 (renewed in 1882 under King Toffa I), and claimed the port of Cotonou under treaties of 1868 and 1878 signed by Dahomey’s officials at Ouidah, while Dahomey went on collecting customs there and raiding villages in the Ouémé valley under French protection. A French mission to Abomey in late 1889 achieved nothing, and the new king, Béhanzin, who succeeded his father Glele at the end of December 1889, refused to give up his rights. On 21 February 1890 the French arrested Dahomey’s officials in Cotonou and fortified the town. On 4 March a Dahomean army of several thousand, women soldiers among them, stormed the stockade before dawn and fought for four hours before withdrawing with several hundred dead, 129 of them inside the French lines. On 20 April, at Atchoupa north of Porto-Novo, Toffa’s warriors fled under fire, but a French column of about 350 men in squares held off repeated attacks, and Béhanzin withdrew to Abomey. By a treaty of 3 October 1890 Dahomey recognised the French protectorate over Porto-Novo and French rule in Cotonou in return for 20,000 francs a year. Both sides rearmed, and war came again in 1892.
: Ett kort krig mellan Frankrike och kungariket Dahomey om kusten i det som i dag är Benin. Frankrike hade sedan 1863 gjort anspråk på ett protektorat (förnyat 1882 under kung Toffa I) över Porto-Novo, ett rivaliserande kungarike som Dahomey länge hade härjat, och gjorde anspråk på hamnen Cotonou med stöd av fördrag från 1868 och 1878 som undertecknats av Dahomeys ämbetsmän i Ouidah, medan Dahomey fortsatte att ta upp tull där och att göra räder mot byar i Ouémédalen under franskt beskydd. En fransk beskickning till Abomey i slutet av 1889 uppnådde ingenting, och den nye kungen Béhanzin, som efterträdde sin far Glele i slutet av december 1889, vägrade att ge upp sina rättigheter. Den 21 februari 1890 arresterade fransmännen Dahomeys ämbetsmän i Cotonou och befäste staden. Den 4 mars stormade en dahomeysk armé på flera tusen, bland dem kvinnliga soldater, palissaden före gryningen och stred i fyra timmar innan den drog sig tillbaka med flera hundra döda, 129 av dem innanför de franska linjerna. Den 20 april, vid Atchoupa norr om Porto-Novo, flydde Toffas krigare under beskjutning, men en fransk kolonn på omkring 350 man i fyrkanter slog tillbaka upprepade anfall, och Béhanzin drog sig tillbaka till Abomey. Genom ett fördrag den 3 oktober 1890 erkände Dahomey det franska protektoratet över Porto-Novo och det franska styret i Cotonou mot 20 000 franc om året. Båda sidor rustade upp, och kriget kom tillbaka 1892.
