# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
First Indochina War: Första Indokinakriget
? The war between France and the Viet Minh, the Communist-led front that had proclaimed the independence of Vietnam as the Democratic Republic of Vietnam in September 1945, fought mainly in Vietnam but also in Laos and Cambodia. After Japan’s surrender the Viet Minh took power in Hanoi in the August Revolution, while British troops helped the French back into Saigon and Chinese troops occupied the north. A compromise of March 1946 broke down, and after the French bombardment of Haiphong in November the Viet Minh attacked the French in Hanoi on 19 December 1946. The French held the cities and the Red River delta; the Viet Minh held the hills of the Việt Bắc and much of central Vietnam and waged guerrilla war everywhere else. France set up the State of Vietnam under the former emperor Bảo Đại in 1949. From 1950 China armed and advised the Viet Minh and the United States paid an ever larger share of France’s costs. Võ Nguyên Giáp’s regular divisions drove the French from the Chinese border in 1950, were beaten back from the delta in 1951, and took the north-west and pushed into Laos in 1952–1953. The fall of the French garrison at Điện Biên Phủ on 7 May 1954 led to the Geneva agreements of 21 July, which divided Vietnam at the 17th parallel. Estimates of the dead range from about 400,000 to over 800,000 soldiers and civilians.
: Kriget mellan Frankrike och Viet Minh, den kommunistledda front som i september 1945 hade utropat Vietnams självständighet som Demokratiska republiken Vietnam, utkämpat främst i Vietnam men också i Laos och Kambodja. Efter Japans kapitulation tog Viet Minh makten i Hanoi i augustirevolutionen, medan brittiska trupper hjälpte fransmännen tillbaka in i Saigon och kinesiska trupper ockuperade norra delen av landet. En kompromiss i mars 1946 bröt samman, och efter det franska bombardemanget av Haiphong i november anföll Viet Minh fransmännen i Hanoi den 19 december 1946. Fransmännen höll städerna och Röda flodens delta; Viet Minh höll bergen i Việt Bắc och stora delar av centrala Vietnam och förde gerillakrig överallt annars. Frankrike upprättade staten Vietnam under förre kejsaren Bảo Đại 1949. Från 1950 beväpnade och rådgav Kina Viet Minh, och USA betalade en allt större del av Frankrikes kostnader. Võ Nguyên Giáps reguljära divisioner drev bort fransmännen från den kinesiska gränsen 1950, slogs tillbaka från deltat 1951 och intog nordvästra Vietnam och trängde in i Laos 1952–1953. Den franska garnisonens fall vid Điện Biên Phủ den 7 maj 1954 ledde till Genèveavtalen den 21 juli, som delade Vietnam vid 17:e breddgraden. Uppskattningarna av antalet döda sträcker sig från omkring 400 000 till över 800 000 soldater och civila.
