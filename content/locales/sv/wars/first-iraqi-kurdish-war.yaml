First Iraqi–Kurdish War: Första irakisk-kurdiska kriget
The Kurdish revolt in northern Iraq led by Mustafa Barzani and the Kurdistan Democratic Party (KDP) against the governments of Abd al-Karim Qasim, the Arif brothers and, from 1968, the Ba’ath party. It began in September 1961, after Qasim, who had welcomed Barzani home from Soviet exile in 1958, refused Kurdish demands for autonomy. The Kurdish Peshmerga held the mountains along the Iranian and Turkish borders against repeated offensives, interrupted by ceasefires in 1963, 1964 and 1966; their victory at Mount Handrin in May 1966 was the largest of the war. Iran, and secretly Israel, came to support the Kurds. The war ended with the agreement of 11 March 1970, in which the Ba’athist government promised the Kurds autonomy within four years. Estimates of the dead range from about 10,000 to as many as 100,000.: Det kurdiska upproret i norra Irak under ledning av Mustafa Barzani och Kurdistans demokratiska parti (KDP) mot de regeringar som leddes av Abd al-Karim Qasim, bröderna Arif och från 1968 Baathpartiet. Det började i september 1961, sedan Qasim, som 1958 hade välkomnat Barzani hem från exilen i Sovjetunionen, hade avvisat de kurdiska kraven på självstyre. Den kurdiska peshmergan höll bergen längs gränserna mot Iran och Turkiet mot upprepade offensiver, avbrutna av vapenvilor 1963, 1964 och 1966; dess seger vid berget Handrin i maj 1966 var krigets största. Iran, och i hemlighet Israel, kom att stödja kurderna. Kriget slutade med avtalet den 11 mars 1970, där den baathistiska regeringen lovade kurderna självstyre inom fyra år. Uppskattningarna av antalet döda varierar från omkring 10 000 till så många som 100 000.
