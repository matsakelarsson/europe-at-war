Italian historians call Charles Albert’s two campaigns against Austria the “royal war” and the risings in Milan, Venice, Rome, Tuscany and Sicily the “popular war”. The Papal States, Tuscany and the Two Sicilies sent troops to fight Austria in spring 1848 but soon withdrew them; many of their volunteers fought on.: Italienska historiker kallar Karl Alberts två fälttåg mot Österrike för det ”kungliga kriget” och resningarna i Milano, Venedig, Rom, Toscana och på Sicilien för det ”folkliga kriget”. Kyrkostaten, Toscana och Bägge Sicilierna sände trupper för att bekämpa Österrike våren 1848 men drog snart tillbaka dem; många av deras frivilliga stred vidare.
The revolutions in Vienna and the German states are told in German revolutions of 1848–1849, and the revolution in Paris in French Revolution of 1848.: Revolutionerna i Wien och de tyska staterna berättas under Tyska revolutionerna 1848–1849, och revolutionen i Paris under Franska revolutionen 1848.
