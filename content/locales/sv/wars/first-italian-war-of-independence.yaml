Under pressure from democrats at home, Charles Albert ended the armistice in March 1849 and sent his army, now under the Polish general Wojciech Chrzanowski, against Lombardy. Radetzky struck first. On 20 March he crossed the Ticino at Pavia, where a Piedmontese division under General Gerolamo Ramorino had failed to guard the crossings; Ramorino was later shot for disobedience. The Austrians beat the Piedmontese at Mortara on 21 March and at Novara on 23 March. That evening Charles Albert abdicated in favour of his son, Victor Emmanuel II, and left for exile in Portugal, where he died in July.: Under tryck från demokraterna i hemlandet sade Karl Albert upp vapenstilleståndet i mars 1849 och sände sin armé, nu under den polske generalen Wojciech Chrzanowski, mot Lombardiet. Radetzky slog först. Den 20 mars gick han över Ticino vid Pavia, där en piemontesisk division under general Gerolamo Ramorino hade underlåtit att bevaka övergångarna; Ramorino arkebuserades senare för ordervägran. Österrikarna slog piemonteserna vid Mortara den 21 mars och vid Novara den 23 mars. Samma kväll abdikerade Karl Albert till förmån för sin son Viktor Emanuel II och gick i landsflykt i Portugal, där han dog i juli.
Victor Emmanuel agreed an armistice with Radetzky at Vignale the next day, accepting an Austrian occupation of part of Piedmont until peace was made. In Lombardy the people of Brescia had risen on 23 March, not knowing of Novara, and held out for ten days until General Julius Haynau’s troops stormed the city; about 1,000 defenders and civilians were killed. In Genoa a republican revolt in April was crushed by Piedmontese troops under Alfonso La Marmora, who bombarded the city. By the Peace of Milan of 6 August 1849 Sardinia paid Austria an indemnity of 65 million francs but kept its territory and its constitution.: Viktor Emanuel enades dagen därpå med Radetzky om ett vapenstillestånd i Vignale och godtog en österrikisk ockupation av en del av Piemonte tills fred slutits. I Lombardiet hade invånarna i Brescia rest sig den 23 mars, ovetande om Novara, och höll ut i tio dagar tills general Julius Haynaus trupper stormade staden; omkring 1 000 försvarare och civila dödades. I Genua slogs en republikansk revolt i april ner av piemontesiska trupper under Alfonso La Marmora, som bombarderade staden. Genom freden i Milano den 6 augusti 1849 betalade Sardinien Österrike ett skadestånd på 65 miljoner francs men behöll sitt territorium och sin författning.
