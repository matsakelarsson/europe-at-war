First Italian War of Independence: Första italienska frihetskriget
The first war of the Risorgimento, fought in 1848–1849 by the Kingdom of Sardinia, Italian volunteers and the revolutionary governments of Milan, Venice, Rome and Sicily against Austria and the rulers it backed. Austria’s Field Marshal Radetzky defeated Sardinia at Custoza in 1848 and at Novara in 1849, France destroyed the Roman Republic, the Bourbons retook Sicily and Venice surrendered in August 1849. The old order returned everywhere, but Sardinia kept its constitution and became the hope of Italian liberals.: Risorgimentos första krig, som 1848–1849 fördes av Kungariket Sardinien, italienska frivilliga och de revolutionära regeringarna i Milano, Venedig, Rom och på Sicilien mot Österrike och de furstar det stödde. Österrikes fältmarskalk Radetzky besegrade Sardinien vid Custoza 1848 och vid Novara 1849, Frankrike krossade Romerska republiken, bourbonerna återtog Sicilien och Venedig kapitulerade i augusti 1849. Den gamla ordningen återvände överallt, men Sardinien behöll sin författning och blev de italienska liberalernas hopp.
