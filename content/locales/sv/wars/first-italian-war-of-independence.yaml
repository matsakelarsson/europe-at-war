In April and May an Austrian relief army under Laval Nugent marched from the Isonzo through Friuli and Venetia, retaking the towns that had risen, and joined Radetzky at Verona. Radetzky then swung south around the Piedmontese flank. On 29 May Tuscan and Neapolitan volunteers, many of them students, held him for a day at Curtatone and Montanara. On 30 May the Piedmontese beat him at Goito, and the same day the fortress of Peschiera surrendered to them; Lombardy, the duchies and later Venice voted to join Sardinia. But the King of the Two Sicilies, after crushing a rising in Naples on 15 May, recalled his army, and on 10 June Radetzky took Vicenza from Papal troops.: I april och maj marscherade en österrikisk undsättningsarmé under Laval Nugent från Isonzo genom Friuli och Venetien, återtog de städer som rest sig och förenade sig med Radetzky vid Verona. Radetzky svängde sedan söderut runt den piemontesiska flanken. Den 29 maj höll toskanska och neapolitanska frivilliga, många av dem studenter, honom stången en dag vid Curtatone och Montanara. Den 30 maj slog piemonteserna honom vid Goito, och samma dag kapitulerade fästningen Peschiera för dem; Lombardiet, hertigdömena och senare Venedig röstade för anslutning till Sardinien. Men kungen av Bägge Sicilierna kallade hem sin armé sedan han slagit ner ett uppror i Neapel den 15 maj, och den 10 juni tog Radetzky Vicenza från påvliga trupper.
In July Radetzky, now reinforced, attacked the Piedmontese line, which stretched for about 70 km along the Mincio. Around the hills of Custoza, south-west of Verona, he defeated Charles Albert’s main army on 24–25 July, and it fell back in disorder to Milan. Charles Albert agreed to give up the city on 4 August; crowds who felt betrayed fired on his residence, and he left under escort in the night. The armistice signed by General Carlo Canera di Salasco on 9 August returned Lombardy to Austria. Giuseppe Garibaldi, back from exile in South America, fought on with about a thousand volunteers near Lake Maggiore, winning a skirmish at Luino on 15 August, before escaping to Switzerland.: I juli anföll Radetzky, nu förstärkt, den piemontesiska linjen, som sträckte sig omkring 70 km längs Mincio. Kring kullarna vid Custoza, sydväst om Verona, besegrade han Karl Alberts huvudarmé den 24–25 juli, och den drog sig i oordning tillbaka till Milano. Karl Albert gick med på att överlämna staden den 4 augusti; folkmassor som kände sig förrådda sköt mot hans residens, och han lämnade staden under eskort i natten. Vapenstilleståndet som general Carlo Canera di Salasco undertecknade den 9 augusti återlämnade Lombardiet till Österrike. Giuseppe Garibaldi, som återvänt från landsflykt i Sydamerika, stred vidare med omkring tusen frivilliga nära Lago Maggiore och vann en skärmytsling vid Luino den 15 augusti innan han flydde till Schweiz.
