After the Salasco armistice Venice restored its republic under Manin and held out alone. Austrian troops under Haynau laid siege to the fort of Marghera on the mainland on 28 April 1849, and after more than three weeks of bombardment its 2,000 defenders withdrew to the city on 26 May. The Austrians then shelled Venice itself across the lagoon from late July; earlier they had launched balloons carrying bombs, an early attempt at bombing from the air, but the wind blew them away. Short of food and struck by cholera, which killed nearly 2,800 people, the city surrendered on 22 August. Manin and other leaders went into exile.: Efter vapenstilleståndet i Salasco återupprättade Venedig sin republik under Manin och höll ut på egen hand. Österrikiska trupper under Haynau belägrade fortet Marghera på fastlandet den 28 april 1849, och efter mer än tre veckors bombardemang drog sig dess 2 000 försvarare tillbaka till staden den 26 maj. Österrikarna besköt sedan Venedig självt över lagunen från slutet av juli; tidigare hade de sänt upp ballonger med bomber, ett tidigt försök till bombning från luften, men vinden blåste bort dem. Med brist på livsmedel och drabbad av kolera, som dödade nästan 2 800 människor, kapitulerade staden den 22 augusti. Manin och andra ledare gick i landsflykt.
Sicily had risen against Bourbon rule in January 1848 and declared King Ferdinand II deposed. In September his troops bombarded and stormed Messina, earning him the nickname “King Bomba”, and after a truce arranged by Britain and France broke down, General Carlo Filangieri took Catania on 7 April 1849 and entered Palermo on 15 May. Across Italy the old rulers returned, with Austrian garrisons in the Legations, Tuscany and the duchies and a French garrison in Rome. Piedmont alone kept a constitution, and thousands of exiles from the other states found refuge there.: Sicilien hade rest sig mot det bourbonska styret i januari 1848 och förklarat kung Ferdinand II avsatt. I september bombarderade och stormade hans trupper Messina, vilket gav honom öknamnet ”kung Bomba”, och sedan ett stillestånd som Storbritannien och Frankrike förmedlat brutit samman intog general Carlo Filangieri Catania den 7 april 1849 och tågade in i Palermo den 15 maj. Över hela Italien återvände de gamla härskarna, med österrikiska garnisoner i legationerna, Toscana och hertigdömena och en fransk garnison i Rom. Piemonte ensamt behöll en författning, och tusentals landsflyktiga från de andra staterna fann en fristad där.
