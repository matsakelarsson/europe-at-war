In Rome the Pope’s chief minister, Pellegrino Rossi, was stabbed to death on 15 November 1848, and Pius IX fled in disguise to the Neapolitan fortress of Gaeta. An elected assembly proclaimed the Roman Republic on 9 February 1849, and Giuseppe Mazzini led it in a triumvirate with Carlo Armellini and Aurelio Saffi. In Tuscany the Grand Duke Leopold II also fled, and a democratic government held Florence until April. The Pope appealed to the Catholic powers. France, whose president, Louis Napoleon Bonaparte, wanted Catholic support at home and to keep Austria out of central Italy, sent an army under General Charles Oudinot, which landed at Civitavecchia on 24 April.: I Rom knivhöggs påvens förste minister, Pellegrino Rossi, till döds den 15 november 1848, och Pius IX flydde förklädd till den neapolitanska fästningen Gaeta. En vald församling utropade Romerska republiken den 9 februari 1849, och Giuseppe Mazzini ledde den i ett triumvirat med Carlo Armellini och Aurelio Saffi. I Toscana flydde också storhertig Leopold II, och en demokratisk regering höll Florens till april. Påven vädjade till de katolska makterna. Frankrike, vars president Louis Napoleon Bonaparte ville ha katolskt stöd i hemlandet och hålla Österrike borta från mellersta Italien, sände en armé under general Charles Oudinot, som landsteg i Civitavecchia den 24 april.
On 30 April Oudinot’s attack on Rome was beaten back by Giuseppe Garibaldi’s legion and other defenders, and in May Garibaldi drove off a Neapolitan army at Palestrina and Velletri, while Austrian troops took Bologna and Ancona. French reinforcements opened a siege on 3 June. After a month of shelling and fighting on the Janiculum hill, the assembly gave up the defence, and the French entered Rome on 3 July. Garibaldi left with about 4,000 men, hoping to reach Venice. Pursued by French and Austrian troops, he disbanded them in San Marino at the end of July, and his wife Anita died during his flight through the marshes near Ravenna.: Den 30 april slogs Oudinots anfall mot Rom tillbaka av Giuseppe Garibaldis legion och andra försvarare, och i maj drev Garibaldi bort en neapolitansk armé vid Palestrina och Velletri, medan österrikiska trupper intog Bologna och Ancona. Franska förstärkningar inledde en belägring den 3 juni. Efter en månad av beskjutning och strider på Gianicolokullen gav församlingen upp försvaret, och fransmännen tågade in i Rom den 3 juli. Garibaldi lämnade staden med omkring 4 000 man i hopp om att nå Venedig. Förföljd av franska och österrikiska trupper upplöste han styrkan i San Marino i slutet av juli, och hans hustru Anita dog under hans flykt genom träskmarkerna nära Ravenna.
