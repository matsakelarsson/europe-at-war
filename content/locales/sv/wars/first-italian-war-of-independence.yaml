News of the revolution in Vienna reached Milan, the capital of Austrian Lombardy, on 17 March 1848, and the next day the city rose against its garrison. For five days the Milanese fought from barricades, directed by a council of war under the federalist Carlo Cattaneo, and on the night of 22 March Field Marshal Joseph Radetzky, then 81, withdrew his troops from the city. About 400 Milanese and 180 Austrian soldiers had been killed. In Venice crowds freed the lawyer Daniele Manin from prison, the Austrian garrison left, and on 22 March Manin proclaimed the Republic of San Marco. Towns across Lombardy and Venetia rose, and the dukes of Parma and Modena fled.: Nyheten om revolutionen i Wien nådde Milano, huvudstad i det österrikiska Lombardiet, den 17 mars 1848, och dagen därpå reste sig staden mot sin garnison. I fem dagar stred milaneserna från barrikader, ledda av ett krigsråd under federalisten Carlo Cattaneo, och natten till den 23 mars drog fältmarskalk Joseph Radetzky, då 81 år, ut sina trupper ur staden. Omkring 400 milaneser och 180 österrikiska soldater hade dödats. I Venedig befriade folkmassor advokaten Daniele Manin ur fängelset, den österrikiska garnisonen lämnade staden, och den 22 mars utropade Manin Republiken San Marco. Städer över hela Lombardiet och Venetien reste sig, och hertigarna av Parma och Modena flydde.
On 23 March King Charles Albert of Sardinia declared war on Austria, partly to forestall a republican revolution, and his army crossed the Ticino into Lombardy. The Pope, the Grand Duke of Tuscany and the King of the Two Sicilies, pressed by liberal opinion, sent troops and volunteers. Radetzky fell back to the Quadrilateral, the fortresses of Peschiera, Verona, Mantua and Legnago, and waited for reinforcements down the Adige valley. The Piedmontese forced the Mincio at Goito on 8 April and drove the Austrians from Pastrengo on 30 April, but moved slowly. On 29 April Pope Pius IX declared that he could not make war on Catholic Austria.: Den 23 mars förklarade kung Karl Albert av Sardinien Österrike krig, delvis för att förekomma en republikansk revolution, och hans armé gick över Ticino in i Lombardiet. Påven, storhertigen av Toscana och kungen av Bägge Sicilierna sände under tryck från den liberala opinionen trupper och frivilliga. Radetzky drog sig tillbaka till fästningsfyrkanten, fästningarna Peschiera, Verona, Mantua och Legnago, och väntade på förstärkningar nerför Adigedalen. Piemonteserna forcerade Mincio vid Goito den 8 april och drev österrikarna från Pastrengo den 30 april, men rörde sig långsamt. Den 29 april förklarade påven Pius IX att han inte kunde föra krig mot det katolska Österrike.
