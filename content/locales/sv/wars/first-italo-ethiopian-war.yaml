# Svenska översättningar av katalogtexten (våg 12); stegtexterna kommer senare.
First Italo-Ethiopian War: Första italiensk-etiopiska kriget
? Italy’s attempt to impose a protectorate on Ethiopia, which ended in its defeat at Adwa. From Massawa, occupied in 1885, Italy had built the colony of Eritrea, and it read the Treaty of Wuchale, signed with Menelik II in 1889, as making Ethiopia its protectorate, a reading Menelik rejected. In December 1894 a revolt against Italian rule in Eritrea led to war with Ras Mengesha of Tigray; the Italians under General Oreste Baratieri defeated him at Coatit and Senafe in January 1895 and occupied Tigray. Menelik called out the whole empire, and an army of more than 100,000 destroyed an Italian force at Amba Alagi on 7 December 1895, forced the surrender of the fort at Mekele in January 1896 and, on 1 March 1896, routed Baratieri’s army of about 17,700 at Adwa, killing or capturing more than half of it. By the Treaty of Addis Ababa of 26 October 1896 Italy annulled the Treaty of Wuchale and recognised Ethiopia’s full independence, keeping Eritrea. Adwa made Ethiopia the one African state to defeat a European colonial army decisively and keep its independence through the Scramble for Africa, and it became a symbol across Africa and its diaspora.
: Italiens försök att påtvinga Etiopien ett protektorat, som slutade med det italienska nederlaget vid Adwa. Från Massawa, som ockuperades 1885, hade Italien byggt upp kolonin Eritrea, och landet tolkade Wuchalefördraget, som undertecknades med Menelik II 1889, som att Etiopien blev dess protektorat, en tolkning som Menelik avvisade. I december 1894 ledde en revolt mot det italienska styret i Eritrea till krig med ras Mengesha av Tigray; italienarna under general Oreste Baratieri besegrade honom vid Coatit och Senafe i januari 1895 och ockuperade Tigray. Menelik kallade hela riket under vapen, och en armé på mer än 100 000 man förintade en italiensk styrka vid Amba Alagi den 7 december 1895, tvingade fortet i Mekele att kapitulera i januari 1896 och slog den 1 mars 1896 Baratieris armé på omkring 17 700 man på flykten vid Adwa, varvid mer än hälften av den dödades eller tillfångatogs. Genom Addis Abeba-fördraget den 26 oktober 1896 annullerade Italien Wuchalefördraget och erkände Etiopiens fulla självständighet, och behöll Eritrea. Adwa gjorde Etiopien till den enda afrikanska stat som avgörande besegrade en europeisk kolonialarmé och behöll sin självständighet genom kapplöpningen om Afrika, och slaget blev en symbol i hela Afrika och dess diaspora.
