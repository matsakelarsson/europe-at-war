# Svenska översättningar av katalogtexten (våg 13); stegtexterna kommer senare.
First Ivorian Civil War: Första inbördeskriget i Elfenbenskusten
? The war that split Côte d’Ivoire into a rebel-held north and a government-held south. After the death of the country’s founding president, Félix Houphouët-Boigny, in 1993, the idea of “Ivoirité”, Ivorian identity, was used to exclude northerners and the opposition leader Alassane Ouattara from politics, and a coup in 1999 and a disputed election in 2000 brought Laurent Gbagbo to power. On 19 September 2002 soldiers attacked Abidjan, Bouaké and Korhogo; the attack on Abidjan failed, but the rebels, later the Forces Nouvelles under Guillaume Soro, took the north, and two further rebel groups took the far west with Liberian fighters. French troops of Operation Licorne and later a United Nations force held a buffer zone between the two halves. Power-sharing agreements at Linas-Marcoussis in 2003 and Pretoria in 2005 broke down; in November 2004 an Ivorian air raid killed nine French soldiers at Bouaké, and France destroyed the Ivorian air force. The Ouagadougou agreement of 4 March 2007 made Soro prime minister and ended the war. Estimates of the dead range from about 900 to 4,000, and some 750,000 people were displaced.
: Det krig som delade Elfenbenskusten i ett rebellkontrollerat norr och ett regeringskontrollerat söder. Efter landets grundande president Félix Houphouët-Boignys död 1993 användes idén om ”ivoirité”, ivoriansk identitet, för att utestänga nordbor och oppositionsledaren Alassane Ouattara från politiken, och en kupp 1999 och ett omstritt val 2000 förde Laurent Gbagbo till makten. Den 19 september 2002 anföll soldater Abidjan, Bouaké och Korhogo; anfallet mot Abidjan misslyckades, men rebellerna, senare Forces Nouvelles under Guillaume Soro, intog norra delen av landet, och ytterligare två rebellgrupper intog den västligaste delen med hjälp av liberianska krigare. Franska trupper ur Operation Licorne och senare en FN-styrka höll en buffertzon mellan de två halvorna. Maktdelningsavtalen i Linas-Marcoussis 2003 och Pretoria 2005 bröt samman; i november 2004 dödade en ivoriansk flygräd nio franska soldater i Bouaké, och Frankrike förstörde det ivorianska flygvapnet. Ouagadougouavtalet den 4 mars 2007 gjorde Soro till premiärminister och avslutade kriget. Uppskattningarna av antalet döda sträcker sig från omkring 900 till 4 000, och omkring 750 000 människor fördrevs.
