# Svenska översättningar av katalogtexten (våg 13); stegtexterna kommer senare.
First Liberian Civil War: Första liberianska inbördeskriget
? The war that began when Charles Taylor’s National Patriotic Front of Liberia (NPFL) crossed from Côte d’Ivoire into Nimba County on 24 December 1989 to overthrow President Samuel Doe. Thousands of Gio and Mano, whom Doe’s mostly Krahn army had persecuted, joined the rebels, and by mid-1990 they had overrun most of the country and besieged Monrovia, where government soldiers massacred some 600 refugees in a Lutheran church. A breakaway faction under Prince Johnson captured and killed Doe on 9 September 1990, soon after the West African intervention force ECOMOG landed at Monrovia. Taylor ruled most of the country from Gbarnga as “Greater Liberia”, while an interim government sat in Monrovia under ECOMOG’s protection. New factions, ULIMO and the Liberia Peace Council, fought the NPFL; Taylor’s assault on Monrovia, Operation Octopus, was beaten back in 1992; and more than a dozen peace agreements failed before the Abuja accords of 1995 and 1996. After fighting devastated Monrovia again in April 1996, the factions disarmed, and Taylor won the election of July 1997 by a landslide. The war killed tens of thousands of people, by many estimates up to about 200,000, drove about a million from their homes and used thousands of child soldiers.
: Det krig som började när Charles Taylors National Patriotic Front of Liberia (NPFL) gick över gränsen från Elfenbenskusten in i Nimba County den 24 december 1989 för att störta president Samuel Doe. Tusentals gio och mano, som Does huvudsakligen krahniska armé hade förföljt, anslöt sig till rebellerna, och i mitten av 1990 hade de överskridit större delen av landet och belägrat Monrovia, där regeringssoldater massakrerade omkring 600 flyktingar i en luthersk kyrka. En utbrytarfraktion under Prince Johnson tillfångatog och dödade Doe den 9 september 1990, strax efter att den västafrikanska interventionsstyrkan Ecomog hade landstigit i Monrovia. Taylor styrde större delen av landet från Gbarnga som ”Stor-Liberia”, medan en interimsregering satt i Monrovia under Ecomogs beskydd. Nya fraktioner, ULIMO och Liberia Peace Council, bekämpade NPFL; Taylors anfall mot Monrovia, Operation Octopus, slogs tillbaka 1992; och mer än ett dussin fredsavtal misslyckades innan Abujaavtalen 1995 och 1996 slöts. Sedan striderna åter hade ödelagt Monrovia i april 1996 avväpnades fraktionerna, och Taylor vann valet i juli 1997 med en jordskredsseger. Kriget dödade tiotusentals människor, enligt många uppskattningar upp till omkring 200 000, drev omkring en miljon från sina hem, och tusentals barnsoldater användes i det.
