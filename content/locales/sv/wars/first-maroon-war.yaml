# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
First Maroon War: Första maronkriget
? "The war between the British colony of Jamaica and the Maroons, free communities of Africans and their descendants who had escaped slavery and lived in the island’s mountains. The Windward Maroons of the Blue Mountains, led by Nanny and Quao, and the Leeward Maroons of the Cockpit Country in the west, led by Cudjoe (Kojo), raided plantations, freed enslaved people and ambushed the troops sent against them. From 1728 Governor Robert Hunter, reinforced by regular regiments, sent expeditions into the mountains; the militia took Nanny Town more than once, the last time in 1734, but each time the Maroons slipped away and fought on, while the cost of the war, martial law and the flight of planters weakened the colony. In 1739 Governor Edward Trelawny made peace: Cudjoe signed a treaty with John Guthrie on 1 March 1739 (Old Style), and Quao one with Robert Bennett later that year or in 1740. The treaties recognised the Maroons’ freedom and their lands, about 1,500 acres for Cudjoe’s people, with self-government under their own leaders and a British superintendent, in return for returning runaways, helping to put down revolts and defending the island against invaders. Nanny received a grant of 500 acres in 1740, where Moore Town now stands. She is today Jamaica’s only female National Hero."
: "Kriget mellan den brittiska kolonin Jamaica och maronerna, fria samhällen av afrikaner och deras ättlingar som hade flytt från slaveriet och levde i öns berg. Windwardmaronerna i Blue Mountains, ledda av Nanny och Quao, och Leewardmaronerna i Cockpit Country i väster, ledda av Cudjoe (Kojo), gjorde räder mot plantagerna, befriade förslavade och lade bakhåll för de trupper som sändes mot dem. Från 1728 sände guvernören Robert Hunter, förstärkt med reguljära regementen, expeditioner upp i bergen; milisen intog Nanny Town mer än en gång, sista gången 1734, men varje gång slank maronerna undan och fortsatte striden, medan krigets kostnader, krigslagarna och plantageägarnas flykt försvagade kolonin. År 1739 slöt guvernören Edward Trelawny fred: Cudjoe undertecknade ett fördrag med John Guthrie den 1 mars 1739 (enligt gamla stilen), och Quao ett med Robert Bennett senare samma år eller 1740. Fördragen erkände maronernas frihet och deras land, omkring 1 500 acres för Cudjoes folk, med självstyre under egna ledare och en brittisk tillsyningsman, i utbyte mot att de lämnade ut förrymda slavar, hjälpte till att slå ned uppror och försvarade ön mot inkräktare. Nanny fick 1740 en jordförläning på 500 acres, där Moore Town nu ligger. Hon är i dag Jamaicas enda kvinnliga nationalhjälte."
