# Svenska översättningar av katalogtexten (våg 13); stegtexterna kommer senare.
First Matabele War: Första matabelekriget
? The British South Africa Company’s conquest of the Ndebele kingdom (Mthwakazi) of King Lobengula, in what is now western Zimbabwe. Cecil Rhodes’s company had obtained a mining concession from Lobengula in 1888, received a royal charter in 1889 and occupied Mashonaland, east of the kingdom, in 1890, among Shona chiefdoms the Ndebele regarded as their tributaries. After an Ndebele raid near Fort Victoria in July 1893, the company’s administrator, Leander Starr Jameson, recruited volunteers with promises of land, gold claims and captured cattle and invaded the kingdom in October with two columns and about five Maxim guns, while a third column of Bechuanaland police and Khama III’s Bangwato came from the south-west. The Ndebele regiments attacked the columns’ wagon laagers at Shangani (Bonko) on 25 October and Bembesi (Egodade) on 1 November and were cut down by machine-gun and rifle fire. Lobengula abandoned and burned his capital, Bulawayo, and fled north; on 4 December his rearguard wiped out Major Allan Wilson’s patrol of 34 men at Pupu on the Shangani River. The king died in January 1894, the izinDuna (chiefs) made peace, and the company took Matabeleland, its land and most of its cattle, grievances that led to the rising of 1896.
: Brittiska Sydafrikakompaniets erövring av kung Lobengulas Ndebelerike (Mthwakazi) i det som nu är västra Zimbabwe. Cecil Rhodes kompani hade fått en gruvkoncession av Lobengula 1888, fick ett kungligt privilegiebrev 1889 och ockuperade 1890 Mashonaland, öster om riket, bland shonahövdingadömen som ndebele betraktade som sina tributpliktiga. Efter en ndebeleräd nära Fort Victoria i juli 1893 värvade kompaniets administratör, Leander Starr Jameson, frivilliga med löften om land, guldinmutningar och erövrad boskap och invaderade riket i oktober med två kolonner och omkring fem maximkulsprutor, medan en tredje kolonn av polis från Bechuanaland och Khama III:s bangwato kom från sydväst. Ndebeleregementena anföll kolonnernas vagnborgar vid Shangani (Bonko) den 25 oktober och vid Bembesi (Egodade) den 1 november och mejades ned av kulsprute- och gevärseld. Lobengula övergav och brände sin huvudstad Bulawayo och flydde norrut; den 4 december utplånade hans eftertrupp major Allan Wilsons patrull på 34 man vid Pupu vid Shanganifloden. Kungen dog i januari 1894, izinDuna (hövdingarna) slöt fred, och kompaniet tog Matabeleland, dess land och större delen av dess boskap, oförrätter som ledde till resningen 1896.
