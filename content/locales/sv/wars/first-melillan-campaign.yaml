The war was formally declared on 9 November 1893, after the first attacks of 3 October. The settlement is called the Treaty of Fez in some sources and the Treaty of Marrakesh in others.: Kriget förklarades formellt den 9 november 1893, efter de första anfallen den 3 oktober. Uppgörelsen kallas i vissa källor fördraget i Fez och i andra fördraget i Marrakech.
