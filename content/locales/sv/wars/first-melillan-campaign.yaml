First Melillan campaign: Första Melillafälttåget
A war between Spain and the Rifian tribes around Melilla, also called the Margallo War. It began in October 1893 when tribesmen attacked the garrison over new forts that Spain was building outside the city, near a shrine and cemetery, and on 28 October the governor of Melilla, General Juan García y Margallo, was killed in the fighting. Spain sent some 25,000 troops under General Arsenio Martínez Campos, the tribes were brought to terms with the help of the Sultan, Hassan I, and in 1894 a treaty with Morocco confirmed Melilla’s boundaries and obliged the Sultan to pay Spain an indemnity.: Ett krig mellan Spanien och rifstammarna kring Melilla, även kallat Margallokriget. Det började i oktober 1893 när stammedlemmar angrep garnisonen på grund av nya fort som Spanien byggde utanför staden, nära en helgedom och en begravningsplats, och den 28 oktober stupade Melillas guvernör, general Juan García y Margallo, i striderna. Spanien sände omkring 25 000 man under general Arsenio Martínez Campos, stammarna tvingades till en uppgörelse med hjälp av sultanen Hassan I, och 1894 bekräftade ett fördrag med Marocko Melillas gränser och ålade sultanen att betala Spanien skadestånd.
