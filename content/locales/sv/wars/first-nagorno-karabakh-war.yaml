First Nagorno-Karabakh War: Första Nagorno-Karabach-kriget
A war between Azerbaijan and the Armenians of Nagorno-Karabakh, backed by Armenia, over the Armenian-majority region inside Soviet Azerbaijan. It began as a campaign for union with Armenia in 1988, accompanied by pogroms and mutual expulsions, and became a full war as the Soviet Union collapsed. When a ceasefire took effect in May 1994, Armenian forces held Nagorno-Karabakh and seven surrounding Azerbaijani districts, and about a million people on both sides had been driven from their homes.: Ett krig mellan Azerbajdzjan och armenierna i Nagorno-Karabach, med stöd av Armenien, om den region med armenisk majoritet som låg inom sovjetiska Azerbajdzjan. Det började 1988 som en kampanj för union med Armenien, åtföljd av pogromer och ömsesidiga fördrivningar, och blev ett fullskaligt krig när Sovjetunionen föll samman. När ett eldupphör trädde i kraft i maj 1994 kontrollerade armeniska styrkor Nagorno-Karabach och sju omgivande azerbajdzjanska distrikt, och omkring en miljon människor på båda sidor hade drivits från sina hem.
