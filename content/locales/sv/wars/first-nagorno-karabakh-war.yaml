Nagorno-Karabakh, a mountainous autonomous region of Soviet Azerbaijan where about three-quarters of the people were Armenians, had long sought to join Soviet Armenia. Encouraged by Mikhail Gorbachev’s reforms, its regional soviet voted on 20 February 1988 to ask for the transfer, and vast crowds demonstrated in Yerevan for miatsum, “unification”. Moscow refused. Two young Azerbaijanis were killed in a clash near Askeran on 22 February, and from 27 to 29 February mobs in the industrial city of Sumgait, north of Baku, attacked Armenians; officially 32 people died, most of them Armenians, while Armenian sources put the toll much higher.: Nagorno-Karabach, en bergig autonom region i sovjetiska Azerbajdzjan där omkring tre fjärdedelar av invånarna var armenier, hade länge velat ansluta sig till Sovjetarmenien. Uppmuntrat av Michail Gorbatjovs reformer röstade dess regionala sovjet den 20 februari 1988 för att begära överföringen, och väldiga folkmassor demonstrerade i Jerevan för miatsum, ”enande”. Moskva vägrade. Två unga azerbajdzjaner dödades i en sammandrabbning nära Askeran den 22 februari, och den 27–29 februari angrep folkmassor armenier i industristaden Sumgait norr om Baku; officiellt dog 32 människor, de flesta armenier, medan armeniska källor anger betydligt högre siffror.
Over the next two years almost all Azerbaijanis left Armenia, and most Armenians left Azerbaijan outside Karabakh, often under threat of violence. In January 1990 a pogrom in Baku killed dozens of Armenians; on the night of 19–20 January Soviet troops stormed the city, officially to restore order and protect the Soviet authorities from the Popular Front, and killed about 130–150 civilians. In spring 1991, in Operation Ring, Soviet troops and Azerbaijani special police deported thousands of Armenians from villages around Karabakh. On 2 September 1991 the Karabakh Armenians proclaimed the Nagorno-Karabakh Republic; Azerbaijan abolished the region’s autonomy, and as Soviet troops withdrew the conflict became a war.: Under de följande två åren lämnade nästan alla azerbajdzjaner Armenien, och de flesta armenier lämnade Azerbajdzjan utanför Karabach, ofta under hot om våld. I januari 1990 dödades dussintals armenier i en pogrom i Baku; natten mellan den 19 och 20 januari stormade sovjetiska trupper staden, officiellt för att återställa ordningen och skydda de sovjetiska myndigheterna från Folkfronten, och dödade omkring 130–150 civila. Våren 1991, i Operation Ring, deporterade sovjetiska trupper och azerbajdzjansk specialpolis tusentals armenier från byar kring Karabach. Den 2 september 1991 utropade karabacharmenierna Republiken Nagorno-Karabach; Azerbajdzjan avskaffade regionens autonomi, och när de sovjetiska trupperna drogs tillbaka blev konflikten ett krig.
