Nagorno-Karabakh and the surrounding districts are shown as part of Azerbaijan on the map, as they are internationally recognised. The self-proclaimed Nagorno-Karabakh Republic (later the Republic of Artsakh) was recognised by no member of the United Nations.: Nagorno-Karabach och de omgivande distrikten visas på kartan som en del av Azerbajdzjan, eftersom de är internationellt erkända som sådana. Den självutropade Republiken Nagorno-Karabach (senare Republiken Artsach) erkändes inte av någon medlemsstat i FN.
Many places have both Armenian and Azerbaijani names, such as Stepanakert (Khankendi), Shusha (Shushi), Mardakert (Aghdara) and Lachin (Berdzor). The more common English forms are used here.: Många orter har både armeniska och azerbajdzjanska namn, som Stepanakert (Chankändi), Sjusja (Sjusji), Mardakert (Ağdərə) och Latjin (Berdzor). De vanligaste formerna används här.
Numbers of dead and displaced are estimates and are disputed; both sides’ official figures differ from independent ones.: Antalet döda och fördrivna är uppskattningar och omstridda; båda sidors officiella siffror skiljer sig från oberoende uppgifter.
