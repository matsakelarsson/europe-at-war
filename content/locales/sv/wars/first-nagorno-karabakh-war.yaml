In spring 1993 Armenian forces broke out of Karabakh to the west. Kalbajar fell on 3 April, and about 60,000 Azerbaijani and Kurdish inhabitants fled over the mountains; the UN Security Council demanded a withdrawal in Resolution 822. Azerbaijan’s army was weakened by turmoil at home. In June a rebel colonel, Surat Huseynov, marched on Baku from Ganja, President Elchibey fled, and Heydar Aliyev, the former Soviet Azerbaijani leader, took power. Armenian forces took Agdam in July, then Fuzuli, Jabrayil and Qubadli in August and Zangilan in October, reaching the Iranian border, and three more UN resolutions followed.: Våren 1993 bröt armeniska styrkor ut ur Karabach västerut. Kälbäcär föll den 3 april, och omkring 60 000 azerbajdzjanska och kurdiska invånare flydde över bergen; FN:s säkerhetsråd krävde ett tillbakadragande i resolution 822. Azerbajdzjans armé var försvagad av oroligheter i hemlandet. I juni marscherade en upprorisk överste, Surat Husejnov, mot Baku från Ganja, president Eltjibej flydde, och Hejdar Alijev, Sovjetazerbajdzjans förre ledare, tog makten. Armeniska styrkor intog Agdam i juli, därefter Füzuli, Cäbrayıl och Qubadlı i augusti och Zängilan i oktober och nådde den iranska gränsen, och ytterligare tre FN-resolutioner följde.
Azerbaijan’s winter offensive, from December 1993, retook Horadiz on the Araxes, but failed with heavy losses in the snow at the Omar Pass above Kalbajar. Russian mediation produced the Bishkek Protocol in May 1994, and a ceasefire took effect on 12 May. Armenian forces held almost all of Nagorno-Karabakh and all or part of seven Azerbaijani districts around it. Estimates of the dead range from about 20,000 to more than 30,000. Some 724,000 Azerbaijanis had been driven from Armenia, Karabakh and the occupied districts, and 300,000–500,000 Armenians from Azerbaijan.: Azerbajdzjans vinteroffensiv från december 1993 återtog Horadiz vid Araxes men misslyckades med svåra förluster i snön vid Omarpasset ovanför Kälbäcär. Rysk medling ledde till Bisjkekprotokollet i maj 1994, och ett eldupphör trädde i kraft den 12 maj. Armeniska styrkor höll nästan hela Nagorno-Karabach och hela eller delar av sju azerbajdzjanska distrikt runt omkring. Uppskattningarna av antalet döda varierar från omkring 20 000 till mer än 30 000. Omkring 724 000 azerbajdzjaner hade fördrivits från Armenien, Karabach och de ockuperade distrikten, och 300 000–500 000 armenier från Azerbajdzjan.
