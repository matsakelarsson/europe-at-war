Through the winter of 1991–92 Azerbaijani forces bombarded Stepanakert with Grad rockets from Shusha, the old Azerbaijani-majority town on the heights above it, while Armenian fighters took Azerbaijani villages around the city. On 25–26 February 1992 Armenian forces, helped by some troops of the former Soviet 366th Regiment, took Khojaly, the site of the region’s airport. Civilians fleeing through the snow towards Agdam were shot down near Nakhichevanik. Azerbaijan gives the dead as 613; Human Rights Watch called it the largest massacre of the conflict and held Karabakh Armenian forces directly responsible. In April Azerbaijani forces killed dozens of Armenian villagers at Maraga.: Under vintern 1991–1992 besköt azerbajdzjanska styrkor Stepanakert med Grad-raketer från Sjusja, den gamla staden med azerbajdzjansk majoritet på höjderna ovanför, medan armeniska kämpar intog azerbajdzjanska byar kring staden. Den 25–26 februari 1992 intog armeniska styrkor, med hjälp av en del soldater från det forna sovjetiska 366:e regementet, Chodzjaly, där regionens flygplats låg. Civila som flydde genom snön mot Agdam sköts ner nära Nachitjevanik. Azerbajdzjan anger antalet döda till 613; Human Rights Watch kallade det konfliktens största massaker och höll karabacharmeniska styrkor direkt ansvariga. I april dödade azerbajdzjanska styrkor dussintals armeniska bybor i Maraga.
On 8–9 May Armenian forces stormed Shusha, ending the bombardment, and on 18 May they took Lachin, opening a road to Armenia; the Azerbaijani inhabitants of both towns fled. The defeats cost President Ayaz Mutalibov his post, and in June the Popular Front leader Abulfaz Elchibey was elected president of Azerbaijan. That month Azerbaijan struck back with tanks inherited from the Soviet army, overrunning the Shahumyan district north of Karabakh and much of Mardakert, which fell on 4 July, and their Armenian inhabitants fled.: Den 8–9 maj stormade armeniska styrkor Sjusja, vilket gjorde slut på beskjutningen, och den 18 maj intog de Latjin och öppnade en väg till Armenien; de azerbajdzjanska invånarna i båda städerna flydde. Nederlagen kostade president Ajaz Mutalibov hans post, och i juni valdes Folkfrontens ledare Abulfaz Eltjibej till Azerbajdzjans president. Samma månad slog Azerbajdzjan tillbaka med stridsvagnar som ärvts från sovjetarmén och tog distriktet Sjahumjan norr om Karabach och stora delar av Mardakert, som föll den 4 juli, och deras armeniska invånare flydde.
