A pogrom against Armenians began on 13 January. A week later Soviet troops entered the city and killed about 130–150 civilians, mostly Azerbaijanis, in what became known as Black January.: En pogrom mot armenier började den 13 januari. En vecka senare gick sovjetiska trupper in i staden och dödade omkring 130–150 civila, de flesta azerbajdzjaner, i det som blev känt som Svarta januari.
