# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
First Opium War: Första opiumkriget
A war between Britain and Qing China over the opium trade and the terms of foreign trade at Guangzhou (Canton). In 1839 the imperial commissioner Lin Zexu forced British and other merchants to surrender more than 20,000 chests of opium, which he destroyed at Humen. Britain, which defended the merchants’ claims and wanted wider trade and diplomatic equality, sent an expedition that took Zhoushan in 1840, forced the forts of the Pearl River and occupied Hong Kong Island in 1841, and then took Xiamen (Amoy), Ningbo and Zhenjiang and sailed up the Yangtze to Nanjing. The Treaty of Nanking of 29 August 1842 ceded Hong Kong Island, opened five ports to British trade and residence and made China pay an indemnity of 21 million silver dollars. It was the first of the treaties later called the unequal treaties in China.: Ett krig mellan Storbritannien och Qingriket om opiumhandeln och villkoren för utrikeshandeln i Kanton (Guangzhou). År 1839 tvingade den kejserlige kommissarien Lin Zexu brittiska och andra köpmän att lämna ut mer än 20 000 kistor opium, som han förstörde vid Humen. Storbritannien, som försvarade köpmännens krav och ville ha friare handel och diplomatisk jämlikhet, sände en expedition som intog Zhoushan 1840, forcerade fästena vid Pärlfloden och ockuperade Hongkongön 1841 och därefter intog Xiamen (Amoy), Ningbo och Zhenjiang och seglade uppför Yangtze till Nanking. Genom fördraget i Nanking den 29 augusti 1842 avträddes Hongkongön, fem hamnar öppnades för brittisk handel och bosättning och Kina tvingades betala ett skadestånd på 21 miljoner silverdollar. Det var det första av de fördrag som senare kallades de ojämlika fördragen i Kina.
