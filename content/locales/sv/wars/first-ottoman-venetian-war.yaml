After the fall of the Morea in 1460, Venice’s ports at Koroni, Methoni and Nafplio bordered Ottoman land. A quarrel over a runaway slave led to Ottoman attacks, and on 3 April 1463 the Ottoman governor took Venetian Argos by treachery. Urged on by Cardinal Bessarion and the pope, the Venetian Senate voted for war on 28 July and allied with Matthias Corvinus of Hungary, who invaded Bosnia. In August a Venetian army retook Argos, rebuilt the Hexamilion wall across the Isthmus of Corinth with many cannon and besieged the Acrocorinth.: Efter Moreas fall 1460 gränsade Venedigs hamnar i Koroni, Methoni och Nafplio till osmanskt land. En tvist om en förrymd slav ledde till osmanska angrepp, och den 3 april 1463 intog den osmanske guvernören det venetianska Argos genom förräderi. Pådriven av kardinal Bessarion och påven röstade den venetianska senaten för krig den 28 juli och allierade sig med Mattias Corvinus av Ungern, som invaderade Bosnien. I augusti återtog en venetiansk här Argos, byggde upp Hexamilionmuren över Korinthiska näset igen med många kanoner och belägrade Akrokorinth.
On 20 October 1463 the besiegers were badly beaten, and their commander Bertoldo d’Este was mortally wounded. When the grand vizier Mahmud Pasha arrived with an army, the Venetians, weakened by dysentery, abandoned the Hexamilion and sailed away; the Ottomans razed the wall and retook Argos. In 1464 Sigismondo Malatesta, lord of Rimini, besieged Mistra without success, and the war in the peninsula settled into raids from the Venetian fortresses, while the countryside was emptied. In 1466 Vettore Cappello attacked Athens but failed to take the Acropolis, and the Venetian siege of Patras ended in a heavy defeat.: Den 20 oktober 1463 led belägrarna ett svårt nederlag, och deras befälhavare Bertoldo d’Este blev dödligt sårad. När storvesiren Mahmud pasha anlände med en här övergav venetianerna, försvagade av dysenteri, Hexamilion och seglade bort; osmanerna raserade muren och återtog Argos. År 1464 belägrade Sigismondo Malatesta, herre över Rimini, Mistra utan framgång, och kriget på halvön övergick i plundringståg från de venetianska fästningarna, medan landsbygden avfolkades. År 1466 angrep Vettore Cappello Aten men lyckades inte inta Akropolis, och den venetianska belägringen av Patras slutade i ett svårt nederlag.
