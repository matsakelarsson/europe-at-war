In 1470 Mehmed II struck at Negroponte (Chalcis), the Venetian capital of Euboea and its main base in the Aegean. A large fleet under Mahmud Pasha sailed from Gallipoli while the sultan led an army overland, and the Ottomans built a bridge of boats across the narrow Euripus strait to bring their guns onto the island. The Venetian fleet under Niccolò Canal, sent to relieve the town, failed to break the bridge or the blockade.: År 1470 slog Mehmed II till mot Negroponte (Chalkis), den venetianska huvudstaden på Euboia och republikens främsta bas i Egeiska havet. En stor flotta under Mahmud pasha seglade från Gallipoli medan sultanen ledde en här landvägen, och osmanerna byggde en bro av båtar över det smala Euripossundet för att föra över sina kanoner till ön. Den venetianska flottan under Niccolò Canal, som sänts för att undsätta staden, lyckades inte bryta bron eller blockaden.
"After several costly assaults the city was stormed in July. It had refused to surrender, so by the custom of the time it was given over to plunder: the men were killed and the women and children enslaved, and the whole island passed to the Ottomans. Canal was disgraced and exiled. Venice now looked for allies in the east, and in 1472 its fleet under Pietro Mocenigo raided the Anatolian coast, sacking Smyrna, while it waited for Uzun Hasan of the Aq Qoyunlu to attack the Ottomans by land.": "Efter flera kostsamma stormningar intogs staden med storm i juli. Den hade vägrat kapitulera, och enligt tidens sed lämnades den därför åt plundring: männen dödades och kvinnorna och barnen förslavades, och hela ön tillföll osmanerna. Canal föll i onåd och förvisades. Venedig sökte nu allierade i öster, och 1472 härjade dess flotta under Pietro Mocenigo den anatoliska kusten och plundrade Smyrna, medan republiken väntade på att Uzun Hasan av Aq Qoyunlu skulle angripa osmanerna till lands."
