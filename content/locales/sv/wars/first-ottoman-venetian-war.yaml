First Ottoman–Venetian War: Första osmansk-venetianska kriget
Sixteen years of war between the Republic of Venice and Mehmed II, fought in the Morea, the Aegean, Albania and finally on Venice’s own doorstep in Friuli. Venice began with hopes of a crusade alongside Hungary and the pope, but its offensive in the Peloponnese failed, it lost Negroponte, its chief base in the Aegean, in 1470, and after the fall of Krujë and the long siege of Shkodër it made peace in 1479, giving up Shkodër, Lemnos and the Mani and paying for its trading rights.: Sexton års krig mellan Republiken Venedig och Mehmed II, utkämpat på Morea, i Egeiska havet, i Albanien och slutligen vid Venedigs egen tröskel i Friuli. Venedig inledde kriget i hopp om ett korståg tillsammans med Ungern och påven, men dess offensiv på Peloponnesos misslyckades, 1470 förlorade republiken Negroponte, sin främsta bas i Egeiska havet, och efter Krujës fall och den långa belägringen av Shkodër slöt den fred 1479, avstod Shkodër, Lemnos och Mani och betalade för sina handelsrättigheter.
