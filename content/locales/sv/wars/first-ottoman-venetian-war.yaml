In 1474 Hadım Süleyman Pasha besieged Venetian Shkodër (Scutari) in Albania from May to August without success. In November 1477 Ottoman raiders under Ömer Bey crossed the Isonzo into Friuli, killed the Venetian commanders who rode out against them, and burned villages as far as the Tagliamento, within sight of Venice; they came again in 1478. With the plague in the city, no allies left and its trade with the Levant cut off, Venice sought peace.: År 1474 belägrade Hadım Süleyman pasha det venetianska Shkodër (Scutari) i Albanien från maj till augusti utan framgång. I november 1477 gick osmanska plundrare under Ömer bej över Isonzo in i Friuli, dödade de venetianska befälhavare som red ut mot dem och brände byar ända till Tagliamento, inom synhåll från Venedig; de kom tillbaka 1478. Med pesten i staden, inga allierade kvar och handeln med Levanten avskuren sökte Venedig fred.
"Mehmed raised his terms. In 1478 he came to Albania in person: Krujë surrendered in June after a year’s blockade, Drisht and Lezhë were stormed, and Shkodër withstood a great siege and was left under blockade. On 25 January 1479 Giovanni Dario signed the Treaty of Constantinople. Venice gave up Shkodër, the island of Lemnos and the Mani, accepted the loss of Negroponte and Krujë, and agreed to pay 100,000 ducats and 10,000 ducats a year for the right to trade freely in the Ottoman Empire. In April the defenders of Shkodër left for Venice, and later in 1479 the Ottomans took the Ionian islands of Lefkada, Cephalonia and Zakynthos from the Tocco family.": "Mehmed skärpte sina villkor. År 1478 kom han själv till Albanien: Krujë kapitulerade i juni efter ett års blockad, Drisht och Lezhë stormades, och Shkodër motstod en stor belägring och lämnades under blockad. Den 25 januari 1479 undertecknade Giovanni Dario freden i Konstantinopel. Venedig avstod Shkodër, ön Lemnos och Mani, godtog förlusten av Negroponte och Krujë och gick med på att betala 100 000 dukater och 10 000 dukater om året för rätten att idka fri handel i Osmanska riket. I april lämnade Shkodërs försvarare staden för Venedig, och senare under 1479 tog osmanerna de joniska öarna Lefkas, Kefalonia och Zakynthos från släkten Tocco."
