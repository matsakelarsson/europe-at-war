Venice’s allies came and went. Hungary attacked Bosnia in 1463–1464, Pope Pius II died at Ancona in 1464 before his crusade could sail, and Venice later sought help from Uzun Hasan of the Aq Qoyunlu, who was beaten by Mehmed in 1473. Skanderbeg and other Albanian and Montenegrin lords fought alongside Venice in Albania.: Venedigs allierade kom och gick. Ungern angrep Bosnien 1463–1464, påven Pius II dog i Ancona 1464 innan hans korståg hann avsegla, och Venedig sökte senare hjälp hos Uzun Hasan av Aq Qoyunlu, som besegrades av Mehmed 1473. Skanderbeg och andra albanska och montenegrinska herrar stred vid Venedigs sida i Albanien.
The siege of Negroponte is dated 14 June – 12 July 1470 in some accounts and 10 July – 5 August in others. The legend that its commander Paolo Erizzo was sawn in half is contradicted by an eyewitness who says he died in the fighting.: Belägringen av Negroponte dateras i vissa skildringar till 14 juni – 12 juli 1470 och i andra till 10 juli – 5 augusti. Legenden om att dess befälhavare Paolo Erizzo sågades itu motsägs av ett ögonvittne som uppger att han stupade i striderna.
