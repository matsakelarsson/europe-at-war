# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
First Portuguese–Ming war: Första kriget mellan Portugal och Mingriket
? The first armed clashes between China and a European power, fought at the mouth of the Pearl River. Portuguese ships from Malacca, which Portugal had taken in 1511 from a sultan who sent tribute to the Ming, reached Guangdong in 1513, and in 1517 Fernão Pires de Andrade brought an embassy under Tomé Pires to Guangzhou (Canton). In 1519 his brother Simão de Andrade built a fort at Tunmen (Tamão), kept other foreign traders away, struck a Ming official and was accused of buying or kidnapping Chinese children to sell as slaves in Malacca. Envoys of the exiled sultan of Malacca also complained of the Portuguese. After the Zhengde Emperor died on 20 April 1521 the court rejected the embassy and ordered the Portuguese out. Wang Hong, the coastal defence commander, blockaded the Portuguese ships at Tunmen with some fifty junks and fire ships in 1521; the Portuguese lost two ships and many men before a storm let the rest escape to Malacca. In August 1522 a new squadron under Martim Afonso de Melo Coutinho was beaten at Xicaowan, losing two ships and 42 men taken prisoner; 23 Portuguese prisoners were executed in Guangzhou in September 1523. Tomé Pires and his companions were held in Guangzhou, where Pires probably died in about 1524. The Ming copied the captured breech-loading guns as folangji, and the Portuguese traded illegally on the coast of Fujian and Zhejiang until officials in Guangdong let them settle at Macau in the 1550s.
: De första väpnade sammandrabbningarna mellan Kina och en europeisk makt, utkämpade vid Pärlflodens mynning. Portugisiska fartyg från Malacka, som Portugal 1511 hade tagit från en sultan som sände tribut till Mingriket, nådde Guangdong 1513, och 1517 förde Fernão Pires de Andrade en beskickning under Tomé Pires till Guangzhou (Kanton). År 1519 byggde hans bror Simão de Andrade ett fort vid Tunmen (Tamão), höll andra utländska handelsmän borta, slog en Mingämbetsman och anklagades för att köpa eller röva kinesiska barn för att sälja dem som slavar i Malacka. Sändebud från Malackas landsflyktige sultan klagade också över portugiserna. Sedan Zhengdekejsaren hade dött den 20 april 1521 avvisade hovet beskickningen och beordrade portugiserna att ge sig av. Wang Hong, befälhavare för kustförsvaret, blockerade 1521 de portugisiska fartygen vid Tunmen med ett femtiotal djonker och brännare; portugiserna förlorade två fartyg och många man innan en storm lät resten fly till Malacka. I augusti 1522 slogs en ny eskader under Martim Afonso de Melo Coutinho vid Xicaowan och förlorade två fartyg, och 42 man togs till fånga; 23 portugisiska fångar avrättades i Guangzhou i september 1523. Tomé Pires och hans följeslagare hölls kvar i Guangzhou, där Pires troligen dog omkring 1524. Mingriket kopierade de erövrade bakladdade kanonerna som folangji, och portugiserna bedrev olaglig handel längs Fujians och Zhejiangs kust tills ämbetsmän i Guangdong lät dem slå sig ned i Macao på 1550-talet.
