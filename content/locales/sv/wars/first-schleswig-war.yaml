The Danish king ruled the duchies of Schleswig and Holstein, but they were not part of the kingdom. Holstein, entirely German-speaking, belonged to the German Confederation; Schleswig had Danish, German and Frisian speakers. Danish liberals wanted Schleswig joined to Denmark up to the river Eider, while German nationalists wanted the two duchies kept together, inside Germany. In March 1848, as revolution swept Europe, a new government in Copenhagen took up the Eider programme.: Den danske kungen styrde hertigdömena Slesvig och Holstein, men de var inte en del av kungariket. Holstein, helt tyskspråkigt, tillhörde Tyska förbundet; i Slesvig talades danska, tyska och frisiska. Danska liberaler ville förena Slesvig med Danmark ända upp till Ejdern, medan tyska nationalister ville hålla samman de två hertigdömena inom Tyskland. I mars 1848, när revolutionen svepte över Europa, antog en ny regering i Köpenhamn Ejderprogrammet.
On 24 March German-minded leaders in Kiel formed a provisional government for Schleswig-Holstein, and the Prince of Noer walked into the fortress of Rendsburg with a rifle corps and some Kiel students and won its garrison over. A volunteer army of about 7,000 moved north and took Flensburg. On 9 April a Danish army landed east of the town and beat it at Bov, and the Schleswig-Holsteiners fell back to Rendsburg.: Den 24 mars bildade tysksinnade ledare i Kiel en provisorisk regering för Slesvig-Holstein, och prinsen av Noer gick in i fästningen Rendsburg med en skyttekår och några studenter från Kiel och vann över garnisonen. En frivilligarmé på omkring 7 000 man ryckte norrut och intog Flensburg. Den 9 april landsteg en dansk armé öster om staden och besegrade den vid Bov, och slesvig-holsteinarna drog sig tillbaka till Rendsburg.
