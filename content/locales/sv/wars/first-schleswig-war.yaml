On 12 April the German Confederation recognised the provisional government and asked Prussia to act for it. A much larger Prussian and federal army under General Wrangel crossed into Schleswig, beat the Danes at Schleswig town on 23 April, and pushed on into Jutland, occupying Fredericia in early May and demanding money from the Jutland towns. The Danish army withdrew to the islands of Als and Funen, from where it struck back, winning at Dybbøl on 5 June.: Den 12 april erkände Tyska förbundet den provisoriska regeringen och bad Preussen att handla å dess vägnar. En betydligt större preussisk och förbundsarmé under general Wrangel gick in i Slesvig, besegrade danskarna vid staden Slesvig den 23 april och trängde vidare in i Jylland, ockuperade Fredericia i början av maj och krävde pengar av de jylländska städerna. Den danska armén drog sig tillbaka till öarna Als och Fyn, varifrån den slog tillbaka och segrade vid Dybbøl den 5 juni.
The Danish navy blockaded German ports, and the other powers would not see Denmark broken up. Russia sent warships and warned Prussia, Britain threatened to step in, and a Swedish–Norwegian force landed on Funen to back the Danes. Prussia gave way. On 26 August it signed a seven-month armistice at Malmö which met most Danish demands, to the fury of the German National Assembly in Frankfurt, which nonetheless had to accept it.: Den danska flottan blockerade tyska hamnar, och de andra makterna ville inte se Danmark styckat. Ryssland sände örlogsfartyg och varnade Preussen, Storbritannien hotade att ingripa och en svensk-norsk styrka landsteg på Fyn till stöd för danskarna. Preussen gav vika. Den 26 augusti undertecknade det ett sju månader långt vapenstillestånd i Malmö som tillgodosåg de flesta danska krav, till ursinne för Tyska nationalförsamlingen i Frankfurt, som ändå måste godta det.
