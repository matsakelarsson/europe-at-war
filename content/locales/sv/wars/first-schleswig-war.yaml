First Schleswig War: Första slesvigska kriget
A war over the duchies of Schleswig and Holstein, fought between Denmark and a German-minded provisional government in the duchies, which Prussia and the German Confederation backed until 1850. Denmark won on the battlefield, and the great powers’ London Protocol of 1852 kept the duchies under the Danish king.: Ett krig om hertigdömena Slesvig och Holstein mellan Danmark och en tysksinnad provisorisk regering i hertigdömena, som Preussen och Tyska förbundet stödde fram till 1850. Danmark segrade på slagfältet, och stormakternas Londonprotokoll 1852 behöll hertigdömena under den danske kungen.
