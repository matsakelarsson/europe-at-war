Talks in London failed, and fighting resumed on 3 April 1849, this time with a reorganised Schleswig-Holstein army alongside Prussian and federal troops. Two days later a Danish squadron attacked the shore batteries at Eckernförde. It was a disaster. The ship of the line Christian VIII caught fire and blew up, the frigate Gefion was captured, and over a thousand Danes were killed, wounded or taken prisoner, against a handful of German casualties.: Förhandlingarna i London misslyckades, och striderna återupptogs den 3 april 1849, denna gång med en omorganiserad slesvig-holsteinsk armé vid sidan av preussiska trupper och förbundstrupper. Två dagar senare anföll en dansk eskader strandbatterierna vid Eckernförde. Det blev en katastrof. Linjeskeppet Christian VIII fattade eld och sprang i luften, fregatten Gefion erövrades, och över tusen danskar dödades, sårades eller togs till fånga, mot en handfull tyska förluster.
On land the Schleswig-Holsteiners won at Kolding on 23 April and laid siege to the fortress of Fredericia, while Prussian troops pushed north through Jutland. Then on 6 July the Danish garrison, reinforced by sea, broke out of Fredericia and stormed the siege lines. The besiegers lost about 3,000 men, many of them taken prisoner, and the Danes about 1,900; General Rye, one of the Danish commanders, was killed. Four days later Prussia signed a new armistice.: Till lands segrade slesvig-holsteinarna vid Kolding den 23 april och belägrade fästningen Fredericia, medan preussiska trupper trängde norrut genom Jylland. Den 6 juli bröt sedan den danska garnisonen, förstärkt sjövägen, ut ur Fredericia och stormade belägringslinjerna. Belägrarna förlorade omkring 3 000 man, många av dem tillfångatagna, och danskarna omkring 1 900; general Rye, en av de danska befälhavarna, stupade. Fyra dagar senare undertecknade Preussen ett nytt vapenstillestånd.
