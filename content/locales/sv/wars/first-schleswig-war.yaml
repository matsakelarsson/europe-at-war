Under heavy pressure from Russia, Prussia made peace with Denmark in Berlin on 2 July 1850 and withdrew, leaving Schleswig-Holstein to fight alone. Three weeks later about 37,000 Danish troops met some 27,000 Schleswig-Holsteiners at Idstedt, north of Schleswig town. It was the largest battle ever fought in the Nordic countries until the Winter War of 1939–1940. In fog and rain the fighting swung back and forth for two days before the Schleswig-Holsteiners retreated.: Under starkt tryck från Ryssland slöt Preussen fred med Danmark i Berlin den 2 juli 1850 och drog sig tillbaka, och Slesvig-Holstein fick strida ensamt. Tre veckor senare möttes omkring 37 000 danska soldater och omkring 27 000 slesvig-holsteinare vid Idstedt, norr om staden Slesvig. Det var det största slag som någonsin utkämpats i Norden fram till vinterkriget 1939–1940. I dimma och regn böljade striden fram och tillbaka i två dagar innan slesvig-holsteinarna drog sig tillbaka.
The Danish victory was costly and the war dragged on into the autumn, with failed Schleswig-Holstein attacks on Missunde and Friedrichstadt. In January 1851 Austria and Prussia, acting for the restored German Confederation, made the duchies give up the fight, and their army was disbanded on 1 April.: Den danska segern var kostsam och kriget drog ut till hösten, med misslyckade slesvig-holsteinska anfall mot Missunde och Friedrichstadt. I januari 1851 tvingade Österrike och Preussen, som handlade för det återupprättade Tyska förbundet, hertigdömena att ge upp kampen, och deras armé upplöstes den 1 april.
The London Protocol of 8 May 1852, signed by the great powers, Sweden–Norway and Denmark, kept the Danish monarchy whole and named Christian of Glücksburg heir to it and to the duchies. Denmark promised not to bind Schleswig more closely to the kingdom than Holstein. The question was left unsolved.: Londonprotokollet av den 8 maj 1852, undertecknat av stormakterna, Sverige-Norge och Danmark, bevarade den danska monarkin hel och utsåg Kristian av Glücksburg till arvinge till den och till hertigdömena. Danmark lovade att inte knyta Slesvig närmare till kungariket än Holstein. Frågan lämnades olöst.
