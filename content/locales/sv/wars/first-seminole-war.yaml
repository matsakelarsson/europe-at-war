# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
First Seminole War: Första seminolkriget
? The first war between the United States and the Seminoles of Spanish Florida, in 1817–1818. After the Creek War of 1813–1814 thousands of Red Stick Creeks had fled into Florida and joined the Seminole and Miccosukee towns, and Black people who had escaped slavery in Georgia and the Carolinas lived beside them as free communities, the Black Seminoles. In July 1816 a US expedition destroyed the fort at Prospect Bluff on the Apalachicola that the British had left to former Colonial Marines and maroons. In November 1817 US troops attacked the Miccosukee town of Fowltown in Georgia, and Seminole warriors in turn attacked a US supply boat on the Apalachicola. In March 1818 Andrew Jackson invaded Florida with about 4,000 regulars, militia and Lower Creek warriors, burned the Miccosukee and Red Stick towns, seized the Spanish fort of St. Marks, attacked Bowlegs Town on the Suwannee, executed two British subjects and took Pensacola. Spain, unable to defend Florida, ceded it to the United States by the Adams–Onís Treaty of 1819, which took effect in 1821.
: Det första kriget mellan USA och seminolerna i Spanska Florida, 1817–1818. Efter creekkriget 1813–1814 hade tusentals Red Stick-creeker flytt till Florida och slutit sig till seminolernas och miccosukeernas byar, och svarta som hade flytt från slaveriet i Georgia och North och South Carolina levde bredvid dem i fria samhällen, de svarta seminolerna. I juli 1816 förstörde en amerikansk expedition fortet vid Prospect Bluff vid Apalachicolafloden, som britterna hade lämnat åt före detta Colonial Marines och maroner. I november 1817 anföll amerikanska trupper miccosukeernas by Fowltown i Georgia, och seminolkrigare anföll i sin tur en amerikansk försörjningsbåt på Apalachicola. I mars 1818 invaderade Andrew Jackson Florida med omkring 4 000 reguljära soldater, milismän och krigare från de nedre creekerna, brände miccosukeernas och Red Stick-creekernas byar, intog det spanska fortet S:t Marks, anföll Bowlegs Town vid Suwanneefloden, avrättade två brittiska undersåtar och intog Pensacola. Spanien, som inte kunde försvara Florida, avträdde det till USA genom Adams–Onís-fördraget 1819, som trädde i kraft 1821.
