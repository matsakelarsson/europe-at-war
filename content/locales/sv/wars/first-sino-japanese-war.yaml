# Svenska översättningar av katalogtexten (våg 10); stegtexterna kommer senare.
First Sino-Japanese War: Första kinesisk-japanska kriget
? "The war between Qing China and Japan in 1894–1895 for control of Korea, a tributary state of the Qing. Both powers sent troops to Korea in June 1894 during the Donghak peasant rising. On 23 July Japanese troops seized the royal palace in Seoul and installed a government that asked them to expel the Chinese; two days later the Japanese navy attacked a Chinese convoy off Pungdo and sank the troopship Kowshing, and on 1 August both countries declared war. Japan’s modern army and navy won every major battle: Seonghwan, Pyongyang and the naval battle of the Yalu in 1894, then Port Arthur (Lüshun), where Japanese troops killed thousands of soldiers and civilians after taking the town, and the naval base of Weihaiwei in February 1895. By the Treaty of Shimonoseki of 17 April 1895 China recognised Korea’s independence, ceded Taiwan, the Penghu Islands and the Liaodong peninsula and agreed to pay 200 million taels; within days Russia, Germany and France forced Japan to give back Liaodong. The war ended China’s suzerainty over Korea and made Japan the leading power in East Asia. Japan lost about 13,300 dead, most of them to disease; Chinese losses are uncertain and are usually estimated at some 35,000 killed and wounded."
: "Kriget mellan Qingriket och Japan 1894–1895 om kontrollen över Korea, en tributstat under Qingdynastin. Båda makterna sände trupper till Korea i juni 1894 under Donghakrörelsens bonderesning. Den 23 juli intog japanska trupper kungapalatset i Seoul och tillsatte en regering som bad dem driva ut kineserna; två dagar senare angrep den japanska flottan en kinesisk konvoj utanför Pungdo och sänkte trupptransportfartyget Kowshing, och den 1 augusti förklarade båda länderna krig. Japans moderna armé och flotta vann varje större slag: Seonghwan, Pyongyang och sjöslaget vid Yalu 1894, därefter Port Arthur (Lüshun), där japanska trupper dödade tusentals soldater och civila sedan de intagit staden, och flottbasen Weihaiwei i februari 1895. Genom freden i Shimonoseki den 17 april 1895 erkände Kina Koreas självständighet, avträdde Taiwan, Penghuöarna och Liaodonghalvön och gick med på att betala 200 miljoner tael; inom några dagar tvingade Ryssland, Tyskland och Frankrike Japan att lämna tillbaka Liaodong. Kriget gjorde slut på Kinas överhöghet över Korea och gjorde Japan till den ledande makten i Östasien. Japans förluster uppgick till omkring 13 300 döda, de flesta genom sjukdomar; de kinesiska förlusterna är osäkra och brukar uppskattas till omkring 35 000 dödade och sårade."
