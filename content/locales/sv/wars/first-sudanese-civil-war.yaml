# Svenska översättningar av katalogtexten (våg 12); stegtexterna kommer senare.
First Sudanese Civil War: Första sudanesiska inbördeskriget
? The war between the government of Sudan and southern Sudanese rebels, the first of the two civil wars that led to South Sudan’s independence. Under British rule the south had been governed apart from the Arabic-speaking, Muslim north, and when Sudan moved towards independence southerners feared domination by northern officials. On 18 August 1955 southern soldiers of the Equatoria Corps mutinied at Torit and killed northern officers, traders and their families. After independence in 1956, and especially under the military regime of Ibrahim Abboud (1958–1964), which pressed Arabic and Islam on the south and expelled foreign missionaries, scattered resistance grew into a guerrilla war led from 1963 by the Anyanya. Massacres of southern civilians by government troops in Juba and Wau in 1965 deepened it. From 1969 Israel armed the rebels, and in 1971 Joseph Lagu united them as the Southern Sudan Liberation Movement. Gaafar Nimeiry’s government made peace by the Addis Ababa Agreement of 1972, which gave the south self-government as one region. Estimates of the dead run from 500,000 to a million, most of them civilians, and hundreds of thousands fled to neighbouring countries.
: Kriget mellan Sudans regering och rebeller i södra Sudan, det första av de två inbördeskrig som ledde till Sydsudans självständighet. Under det brittiska styret hade södern förvaltats skilt från den arabisktalande, muslimska norden, och när Sudan gick mot självständighet fruktade befolkningen i södern att bli dominerad av ämbetsmän från norr. Den 18 augusti 1955 gjorde soldater från södern ur Ekvatoriakåren myteri i Torit och dödade officerare, handelsmän och deras familjer från norr. Efter självständigheten 1956, och särskilt under Ibrahim Abbouds militärregim (1958–1964), som tvingade på södern arabiska och islam och utvisade utländska missionärer, växte spritt motstånd till ett gerillakrig som från 1963 leddes av Anyanya. Regeringstruppernas massakrer på civila från södern i Juba och Wau 1965 fördjupade det. Från 1969 beväpnade Israel rebellerna, och 1971 enade Joseph Lagu dem i Sydsudans befrielserörelse. Gaafar Nimeirys regering slöt fred genom Addis Abeba-avtalet 1972, som gav södern självstyre som en enda region. Uppskattningarna av antalet döda går från 500 000 till en miljon, de flesta av dem civila, och hundratusentals flydde till grannländerna.
