# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
First Taiwan Strait Crisis: Första Taiwansundskrisen
An armed confrontation in 1954–1955 between the People’s Republic of China and the Republic of China on Taiwan over the islands the ROC still held off the mainland coast. The PLA shelled Kinmen (Quemoy) from 3 September 1954 and later Matsu and the Dachen islands; the United States and the ROC signed a mutual defence treaty in December. On 18–19 January 1955 the PLA took the Yijiangshan islands in its first joint operation of land, sea and air forces, and the US Congress passed the Formosa Resolution. In February the US Seventh Fleet covered the evacuation of the Dachens, which the PLA then occupied. After American leaders spoke openly of using nuclear weapons, Zhou Enlai offered talks at the Bandung Conference in April, and the shelling stopped on 1 May 1955. Kinmen and Matsu stayed with the ROC.: En väpnad konfrontation 1954–1955 mellan Folkrepubliken Kina och Republiken Kina på Taiwan om de öar utanför fastlandskusten som Republiken Kina fortfarande höll. Folkets befrielsearmé besköt Kinmen (Quemoy) från den 3 september 1954 och senare Matsu och Dachenöarna; USA och Republiken Kina undertecknade ett ömsesidigt försvarsfördrag i december. Den 18–19 januari 1955 intog Folkets befrielsearmé Yijiangshanöarna i sin första samordnade operation med land-, sjö- och flygstridskrafter, och den amerikanska kongressen antog Formosaresolutionen. I februari skyddade USA:s sjunde flotta evakueringen av Dachenöarna, som Folkets befrielsearmé därefter besatte. Sedan amerikanska ledare öppet hade talat om att använda kärnvapen erbjöd Zhou Enlai förhandlingar vid Bandungkonferensen i april, och beskjutningen upphörde den 1 maj 1955. Kinmen och Matsu förblev hos Republiken Kina.
