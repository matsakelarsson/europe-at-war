# Svenska översättningar av katalogtexten (våg 12); stegtexterna kommer senare.
First Tuareg rebellion: Första tuaregrebellionen
? "A rising of the Kel Adagh Tuareg of the Adrar des Ifoghas, around Kidal in the far north-east of Mali, against the new Malian state, remembered in Tamasheq as Alfellaga. When French rule ended in 1960, the Tuareg and Arab nomads of the north found themselves governed from Bamako by the socialist government of Modibo Keïta and by officials from the south, who brought new taxes, controls on herds and trade, and plans to settle the nomads; some northern notables had asked France in the late 1950s not to place them under a state ruled from the south. Small hit-and-run raids on posts and patrols began in 1962 and grew in 1963. The rebels had no single leadership or plan, rode camels, carried old rifles and probably never numbered more than about 1,500. The Malian army, newly equipped with Soviet weapons, answered with a harsh counter-insurgency: it executed suspected rebels and civilians, among them religious and clan leaders, and its commandant at Kidal, Diby Sillas Diarra, became notorious for public executions. Between November 1963 and February 1964 Keïta won the support of Algeria and Morocco, which let Malian troops pursue rebels across the border; the rebel leaders Zeyd ag Attaher and Ilyas ag Ayyuba were arrested in Algeria in November 1963 and handed over to Mali, Mohamed Ali ag Attaher was arrested in Morocco and the military leader Elledi ag Alla in Algeria in March 1964. By the end of 1964 the revolt had been crushed and the north was placed under military administration. No reliable count of the dead exists. Many Tuareg fled to Algeria and Libya, the development promised for the north never came, and the memory of the repression fed the rebellions of 1990 and 2012."
: "En resning bland Kel Adagh-tuaregerna i Adrar des Ifoghas, kring Kidal i Malis yttersta nordost, mot den nya maliska staten, ihågkommen på tamasheq som Alfellaga. När det franska styret upphörde 1960 fann sig tuaregerna och de arabiska nomaderna i norr styrda från Bamako av Modibo Keïtas socialistiska regering och av ämbetsmän från söder, som förde med sig nya skatter, kontroll av hjordar och handel och planer på att göra nomaderna bofasta; några notabiliteter i norr hade i slutet av 1950-talet bett Frankrike att inte ställa dem under en stat som styrdes från söder. Små blixtanfall mot posteringar och patruller började 1962 och tilltog 1963. Rebellerna hade ingen samlad ledning eller plan, red på kameler, bar gamla gevär och var troligen aldrig fler än omkring 1 500. Den maliska armén, nyss utrustad med sovjetiska vapen, svarade med hård upprorsbekämpning: den avrättade misstänkta rebeller och civila, bland dem religiösa ledare och klanledare, och dess befälhavare i Kidal, Diby Sillas Diarra, blev ökänd för offentliga avrättningar. Mellan november 1963 och februari 1964 vann Keïta stöd från Algeriet och Marocko, som lät maliska trupper förfölja rebeller över gränsen; rebelledarna Zeyd ag Attaher och Ilyas ag Ayyuba greps i Algeriet i november 1963 och överlämnades till Mali, Mohamed Ali ag Attaher greps i Marocko och den militäre ledaren Elledi ag Alla i Algeriet i mars 1964. Vid slutet av 1964 hade revolten krossats, och norra Mali ställdes under militär förvaltning. Någon tillförlitlig räkning av de döda finns inte. Många tuareger flydde till Algeriet och Libyen, den utveckling som hade utlovats för norr kom aldrig, och minnet av förtrycket gav näring åt rebellionerna 1990 och 2012."
