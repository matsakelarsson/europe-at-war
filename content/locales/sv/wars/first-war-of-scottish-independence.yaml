When Alexander III died in 1286 and his granddaughter and heir Margaret, the Maid of Norway, died in 1290, thirteen claimants came forward for the Scottish crown. Edward I of England, asked to judge between them, first made them accept him as overlord, and in 1292 he chose John Balliol. Edward then treated Scotland as a dependency, hearing appeals against Scottish courts and demanding Scottish service in his war with France. In 1295 the Scots took the government out of Balliol’s hands, gave it to a council of twelve and made an alliance with Philip IV of France, the beginning of what was later called the Auld Alliance.: "När Alexander III dog 1286 och hans sondotter och arvinge Margareta, ”jungfrun av Norge”, dog 1290 gjorde tretton tronpretendenter anspråk på den skotska kronan. Edvard I av England, som ombads döma mellan dem, fick dem först att erkänna honom som överherre och valde 1292 Johan Balliol. Därefter behandlade Edvard Skottland som ett lydland: han tog upp överklaganden mot skotska domstolar och krävde skotsk krigstjänst i sitt krig mot Frankrike. År 1295 tog skottarna styret ur Balliols händer, lade det hos ett råd på tolv personer och slöt förbund med Filip IV av Frankrike, början på det som senare kallades Auld Alliance."
Edward invaded in March 1296. On 30 March his army stormed Berwick, then Scotland’s richest town, and killed a large part of its people; chroniclers’ figures run into thousands. On 27 April the Earl of Surrey routed the Scottish army near Dunbar, and the castles of Roxburgh, Edinburgh and Stirling soon surrendered. In July Balliol submitted at Stracathro near Montrose and gave up his kingdom; the royal arms were torn from his surcoat, which earned him the nickname Toom Tabard, “empty coat”. Edward marched as far as Elgin, sent the Stone of Scone, on which Scottish kings were inaugurated, to Westminster, and at Berwick in August took oaths of fealty from the Scottish landholders, recorded in the Ragman Roll.: Edvard gick till anfall i mars 1296. Den 30 mars stormade hans här Berwick, då Skottlands rikaste stad, och dödade en stor del av invånarna; krönikörernas siffror går upp i tusental. Den 27 april slog earlen av Surrey den skotska hären nära Dunbar, och borgarna i Roxburgh, Edinburgh och Stirling kapitulerade snart. I juli underkastade sig Balliol vid Stracathro nära Montrose och avsade sig sitt kungarike; det kungliga vapnet slets av hans vapenrock, vilket gav honom öknamnet Toom Tabard, ”tom rock”. Edvard marscherade ända till Elgin, skickade Scones sten, på vilken skotska kungar installerades, till Westminster och tog i augusti i Berwick emot tro- och lydnadseder från de skotska jordägarna, upptecknade i Ragman Roll.
