On 10 February 1306 Robert Bruce met John Comyn in the church of the Greyfriars at Dumfries and killed him, probably in a quarrel rather than by plan. With nothing left to lose, Bruce had himself crowned at Scone on 25 March. Edward I, now old and ill, ordered that no mercy be shown. On 19 June Aymer de Valence surprised Bruce’s army in its camp at Methven, and in the west John MacDougall of Lorne, a kinsman of Comyn, beat him again at Dalrigh. Bruce became a fugitive, probably in the Hebrides or Ireland. Three of his brothers were executed, and his sister Mary and Isabella, Countess of Buchan, who had crowned him, were kept in cages at Roxburgh and Berwick.: Den 10 februari 1306 mötte Robert Bruce John Comyn i gråbrödernas kyrka i Dumfries och dödade honom, troligen i ett gräl snarare än planerat. Utan något kvar att förlora lät Bruce kröna sig i Scone den 25 mars. Edvard I, nu gammal och sjuk, befallde att ingen nåd skulle visas. Den 19 juni överraskade Aymer de Valence Bruces här i dess läger vid Methven, och i väster slog John MacDougall av Lorne, en släkting till Comyn, honom på nytt vid Dalrigh. Bruce blev en flykting, troligen på Hebriderna eller Irland. Tre av hans bröder avrättades, och hans syster Mary och Isabella, grevinna av Buchan, som hade krönt honom, hölls i burar i Roxburgh och Berwick.
In February 1307 Bruce landed in his own earldom of Carrick and fought a guerrilla war in the hills of the south-west. He ambushed an English force at Glen Trool in April and on 10 May beat Valence at Loudoun Hill. Edward I set out north once more but died at Burgh by Sands on the Solway on 7 July 1307, and his son Edward II soon went home. Bruce turned on his Scottish enemies, defeating the Earl of Buchan near Inverurie on 23 May 1308 and laying waste his lands, the “harrying of Buchan”, and then breaking the MacDougalls in Argyll. In 1309 he held his first parliament, at St Andrews.: I februari 1307 landsteg Bruce i sitt eget grevskap Carrick och förde gerillakrig i bergen i sydväst. Han lade ett bakhåll för en engelsk styrka vid Glen Trool i april och slog den 10 maj Valence vid Loudoun Hill. Edvard I drog ännu en gång norrut men dog vid Burgh by Sands vid Solway den 7 juli 1307, och hans son Edvard II vände snart hem. Bruce vände sig mot sina skotska fiender, besegrade earlen av Buchan nära Inverurie den 23 maj 1308 och ödelade hans marker, ”härjningen av Buchan”, och krossade sedan familjen MacDougall i Argyll. År 1309 höll han sitt första parlament, i St Andrews.
