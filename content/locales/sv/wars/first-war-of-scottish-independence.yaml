The war was also a Scottish civil war. Many Scots fought for the English at different times, above all the Comyns and their allies after Bruce killed John Comyn in 1306.: Kriget var också ett skotskt inbördeskrig. Många skottar stred vid olika tillfällen på engelsk sida, framför allt familjen Comyn och dess allierade sedan Bruce dödat John Comyn 1306.
Much of what is popularly told about William Wallace comes from The Wallace, a poem by Blind Harry written about 170 years after his death. Little is known for certain about his early life.: Mycket av det som populärt berättas om William Wallace kommer från The Wallace, en dikt av Blind Harry skriven omkring 170 år efter hans död. Om hans tidiga liv vet man lite med säkerhet.
