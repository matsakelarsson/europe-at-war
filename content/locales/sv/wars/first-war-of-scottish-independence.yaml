Edward II, at odds with his barons, made only one real campaign in Scotland before 1314, in 1310–1311, and it found no one to fight. Bruce took the war into northern England, burning towns and selling truces to communities for large sums. One by one the English-held castles fell, often to night attacks, and Bruce had them pulled down so they could not be used against him. Perth was taken on 8 January 1313, Roxburgh by James Douglas in February 1314 and Edinburgh in March by Thomas Randolph, whose men climbed the castle rock. Edward Bruce, the king’s brother, besieged Stirling, and its commander agreed to surrender if it was not relieved by midsummer 1314.: Edvard II, i strid med sina baroner, genomförde bara ett verkligt fälttåg i Skottland före 1314, 1310–1311, och det fann ingen att strida mot. Bruce förde kriget in i norra England, brände städer och sålde stillestånd till bygder mot stora summor. En efter en föll de engelskkontrollerade borgarna, ofta genom nattliga anfall, och Bruce lät riva dem så att de inte kunde användas mot honom. Perth intogs den 8 januari 1313, Roxburgh av James Douglas i februari 1314 och Edinburgh i mars av Thomas Randolph, vars män klättrade uppför borgklippan. Edward Bruce, kungens bror, belägrade Stirling, och dess befälhavare gick med på att kapitulera om borgen inte undsattes före midsommar 1314.
Edward II came north with the largest army England had yet sent into Scotland. He had summoned 25,000 foot and 2,000 horse; historians think fewer came, but the army was still much larger than Bruce’s, perhaps 6,000–7,000 men. On 23 June, as the English approached Stirling, Bruce killed the knight Henry de Bohun in single combat in front of the armies, and English attempts to get past the Scots were beaten back. That night the English camped on the low ground by the Bannock Burn. Next morning the Scottish schiltrons advanced and pinned them between the streams; the English army broke, and many drowned in the Forth or the burn.: Edvard II drog norrut med den största här som England dittills hade sänt in i Skottland. Han hade kallat in 25 000 fotsoldater och 2 000 ryttare; historikerna tror att färre kom, men hären var ändå mycket större än Bruces, som kanske räknade 6 000–7 000 man. Den 23 juni, när engelsmännen närmade sig Stirling, dödade Bruce riddaren Henry de Bohun i envig inför härarna, och engelska försök att ta sig förbi skottarna slogs tillbaka. Den natten slog engelsmännen läger på låglandet vid bäcken Bannock Burn. Nästa morgon ryckte de skotska schiltronerna fram och trängde in dem mellan vattendragen; den engelska hären bröt samman, och många drunknade i Forth eller i bäcken.
The Earl of Gloucester was among the dead, and Edward II fled to Dunbar and from there by boat to Berwick. Stirling Castle surrendered, and prisoners such as the Earl of Hereford were exchanged for Bruce’s wife, daughter and sister and Bishop Wishart, held in England since 1306. Bannockburn made Bruce’s rule in Scotland secure, but England did not give up its claim.: Earlen av Gloucester var bland de stupade, och Edvard II flydde till Dunbar och därifrån med båt till Berwick. Stirling Castle kapitulerade, och fångar som earlen av Hereford byttes ut mot Bruces hustru, dotter och syster och biskop Wishart, som hade hållits i England sedan 1306. Bannockburn tryggade Bruces styre i Skottland, men England gav inte upp sitt anspråk.
