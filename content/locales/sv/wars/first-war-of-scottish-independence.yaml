The truce was agreed at the Archbishop of York’s palace and ratified by Bruce at Berwick in June.: Stilleståndet avtalades i ärkebiskopen av Yorks palats och ratificerades av Bruce i Berwick i juni.
Stanhope Park: Stanhope Park
