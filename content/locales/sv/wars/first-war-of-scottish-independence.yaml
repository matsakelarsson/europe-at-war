First War of Scottish Independence: Första skotska frihetskriget
The war in which Scotland resisted English rule after Edward I deposed King John Balliol in 1296. Led first by William Wallace and Andrew Moray and then by Robert the Bruce, who made himself king in 1306 and beat Edward II at Bannockburn in 1314, the Scots won recognition of their independence in the Treaty of Edinburgh–Northampton in 1328.: Kriget där Skottland gjorde motstånd mot engelskt styre sedan Edvard I avsatt kung Johan Balliol 1296. Under ledning först av William Wallace och Andrew Moray och sedan av Robert Bruce, som gjorde sig till kung 1306 och besegrade Edvard II vid Bannockburn 1314, vann skottarna erkännande av sin självständighet genom freden i Edinburgh–Northampton 1328.
