Bruce’s raids: Bruces härjningståg
In 1315 the king’s brother Edward Bruce invaded Ireland, opening a second front that lasted until his death in 1318. In April 1318 the Scots took Berwick, the last English stronghold in Scotland, and held it against Edward II’s siege the next year. To draw him away, Randolph and Douglas raided deep into Yorkshire and on 20 September 1319 routed a hastily raised force, led by the Archbishop of York and including many clergy, at Myton. Scottish raids reached Yorkshire and Lancashire, and the north of England paid heavily for truces.: År 1315 invaderade kungens bror Edward Bruce Irland och öppnade en andra front som bestod fram till hans död 1318. I april 1318 tog skottarna Berwick, det sista engelska fästet i Skottland, och höll det mot Edvard II:s belägring året därpå. För att dra bort honom gjorde Randolph och Douglas ett härjningståg djupt in i Yorkshire och slog den 20 september 1319 vid Myton en hastigt uppbådad styrka som leddes av ärkebiskopen av York och omfattade många präster. Skotska härjningståg nådde Yorkshire och Lancashire, och norra England fick betala dyrt för stillestånd.
Bruce was still excommunicated, and the pope would not call him king. In April 1320 the Scottish barons sent Pope John XXII the letter known as the Declaration of Arbroath, asking him to persuade Edward to leave the Scots in peace and declaring that “as long as but a hundred of us remain alive, never will we on any conditions be brought under English rule”. In 1322 Edward invaded again, found the Lowlands stripped of food and withdrew; the Scots followed and nearly captured him at Old Byland in Yorkshire on 14 October. In May 1323 the two kingdoms agreed a thirteen-year truce at Bishopthorpe.: Bruce var fortfarande bannlyst, och påven ville inte kalla honom kung. I april 1320 sände de skotska baronerna påven Johannes XXII det brev som kallas Arbroathdeklarationen, där de bad honom förmå Edvard att lämna skottarna i fred och förklarade att ”så länge blott hundra av oss är vid liv skall vi aldrig på några villkor låta oss underkastas engelskt styre”. År 1322 invaderade Edvard igen, fann Lowlands tömda på livsmedel och drog sig tillbaka; skottarna följde efter och tog honom nästan till fånga vid Old Byland i Yorkshire den 14 oktober. I maj 1323 kom de två rikena överens om ett trettonårigt stillestånd i Bishopthorpe.
Edward II was deposed in January 1327, and the Scots attacked at once. That summer they outmanoeuvred the young Edward III’s army in Weardale, and in a night raid on the English camp at Stanhope Park Douglas nearly took the king prisoner. The regents, Queen Isabella and Roger Mortimer, made peace. By the treaty sealed at Edinburgh on 17 March 1328 and confirmed by the English parliament at Northampton on 1 May, England recognised Scotland as an independent kingdom under Robert I and his heirs, with the border as it had been under Alexander III, in return for £20,000. Bruce’s son David married Edward’s sister Joan, and Bruce died in June 1329.: Edvard II avsattes i januari 1327, och skottarna anföll genast. Den sommaren utmanövrerade de den unge Edvard III:s här i Weardale, och vid ett nattligt anfall mot det engelska lägret vid Stanhope Park tog Douglas nästan kungen till fånga. Förmyndarna, drottning Isabella och Roger Mortimer, slöt fred. Genom fördraget som beseglades i Edinburgh den 17 mars 1328 och bekräftades av det engelska parlamentet i Northampton den 1 maj erkände England Skottland som ett självständigt kungarike under Robert I och hans arvingar, med gränsen som den hade varit under Alexander III, mot 20 000 pund. Bruces son David gifte sig med Edvards syster Johanna, och Bruce dog i juni 1329.
