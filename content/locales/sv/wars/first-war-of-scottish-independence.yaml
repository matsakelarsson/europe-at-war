English rule soon met resistance. In May 1297 William Wallace, a younger son of a minor landholder, killed the English sheriff of Lanark, while in the north Andrew Moray led a rising that drove the English from most of the castles beyond the Forth. Joining forces, they faced the Earl of Surrey and the treasurer Hugh de Cressingham at Stirling on 11 September. The English began to cross the narrow bridge over the Forth, and when part of their army was over, the Scots charged down from the slopes above and cut it off. Cressingham was among the many killed and, it is said, flayed. Moray died of his wounds later that year.: Det engelska styret mötte snart motstånd. I maj 1297 dödade William Wallace, yngre son till en mindre jordägare, den engelske sheriffen i Lanark, medan Andrew Moray i norr ledde ett uppror som drev engelsmännen från de flesta borgarna norr om Forth. De förenade sina styrkor och mötte earlen av Surrey och skattmästaren Hugh de Cressingham vid Stirling den 11 september. Engelsmännen började gå över den smala bron över Forth, och när en del av hären hade kommit över stormade skottarna ned från sluttningarna ovanför och skar av den. Cressingham var en av de många som dödades och, enligt uppgift, flåddes. Moray dog av sina sår senare samma år.
Wallace raided Northumberland and Cumberland that autumn and was made Guardian of Scotland in the name of King John. In July 1298 Edward I invaded with a large army, perhaps 25,000 foot, many of them Welsh. On 22 July at Falkirk Wallace drew up his spearmen in schiltrons, tight rings bristling with spears, which held off the English cavalry until Edward’s archers and crossbowmen shot gaps in them; the knights then broke in, and many Scots were killed. Edward lacked the supplies to hold the country and withdrew, but Wallace gave up the guardianship.: Wallace härjade i Northumberland och Cumberland den hösten och utsågs till Skottlands väktare i kung Johans namn. I juli 1298 invaderade Edvard I med en stor här, kanske 25 000 fotsoldater, många av dem walesare. Den 22 juli vid Falkirk ställde Wallace upp sina spjutbärare i schiltroner, täta ringar som strittade av spjut, och de höll stånd mot det engelska kavalleriet tills Edvards bågskyttar och armborstskyttar sköt upp luckor i dem; riddarna bröt sig då in, och många skottar dödades. Edvard saknade förråd för att hålla landet och drog sig tillbaka, men Wallace lämnade väktarämbetet.
