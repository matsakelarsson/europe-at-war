An English burgess helped the Scots over the walls at night. Edward II’s attempt to win the town back in 1319 failed.: En engelsk borgare hjälpte skottarna över murarna om natten. Edvard II:s försök att återta staden 1319 misslyckades.
Battle of Myton: Slaget vid Myton
20 September 1319: 20 september 1319
So many priests were killed that the rout was mocked as the Chapter of Myton.: Så många präster dödades att nederlaget hånfullt kallades ”Mytons kapitel”.
Arbroath: Arbroath
The letter was dated at the abbey. It was probably drafted by its abbot, Bernard, who was also Bruce’s chancellor.: Brevet var daterat i klostret. Det skrevs troligen av dess abbot Bernard, som också var Bruces kansler.
Battle of Old Byland: Slaget vid Old Byland
14 October 1322: 14 oktober 1322
The Scots stormed an English position on a ridge near Rievaulx Abbey, where Edward II was staying. He fled, leaving his baggage and treasure behind.: Skottarna stormade en engelsk ställning på en ås nära Rievaulx Abbey, där Edvard II vistades. Han flydde och lämnade sin tross och sin skatt efter sig.
