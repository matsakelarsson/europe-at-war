Scotland was now governed by Guardians, among them Robert Bruce, Earl of Carrick, grandson of one of the claimants of 1291, and his rival John Comyn of Badenoch, Balliol’s nephew. They could not work together, and Bruce resigned in 1300 and later made his peace with Edward. Edward campaigned in Scotland almost every year, while Scottish envoys worked in Rome and Paris to restore Balliol, now released into papal keeping. On 24 February 1303 the Scots under Comyn beat an English force at Roslin, but that May Philip IV made peace with England and left Scotland out of it.: Skottland styrdes nu av väktare, bland dem Robert Bruce, earl av Carrick, sonson till en av tronpretendenterna från 1291, och hans rival John Comyn av Badenoch, Balliols brorson. De kunde inte samarbeta, och Bruce avgick 1300 och slöt senare fred med Edvard. Edvard förde fälttåg i Skottland nästan varje år, medan skotska sändebud arbetade i Rom och Paris för att återinsätta Balliol, som nu släppts i påvens förvar. Den 24 februari 1303 slog skottarna under Comyn en engelsk styrka vid Roslin, men i maj samma år slöt Filip IV fred med England och lämnade Skottland utanför.
In 1303 Edward marched up the east as far as Moray and wintered at Dunfermline, and in February 1304 Comyn and most of the Scottish leaders submitted. Stirling Castle held out for three months against the largest siege train Edward could gather, including a giant trebuchet called the War Wolf, which he insisted on trying out after the garrison had offered to surrender. Wallace refused to submit. Betrayed near Glasgow in August 1305, he was taken to London, tried for treason and on 23 August hanged, drawn and quartered at Smithfield; his limbs were displayed at Newcastle, Berwick, Stirling and Perth. In September Edward issued an ordinance for governing Scotland as a land of the English crown.: År 1303 marscherade Edvard upp längs östkusten ända till Moray och övervintrade i Dunfermline, och i februari 1304 underkastade sig Comyn och de flesta skotska ledarna. Stirling Castle höll ut i tre månader mot det största belägringståg Edvard kunde uppbåda, däribland en jättelik trebuchet kallad War Wolf, som han envisades med att pröva sedan garnisonen redan erbjudit sig att kapitulera. Wallace vägrade att underkasta sig. Han förråddes nära Glasgow i augusti 1305, fördes till London, dömdes för förräderi och blev den 23 augusti hängd, släpad och fyrdelad vid Smithfield; hans kroppsdelar ställdes ut i Newcastle, Berwick, Stirling och Perth. I september utfärdade Edvard en förordning om att Skottland skulle styras som ett land under den engelska kronan.
