Douglas led a night raid into the English camp in Weardale and, it is said, cut the ropes of the king’s tent. The Scots then slipped away.: Douglas ledde ett nattligt anfall in i det engelska lägret i Weardale och skar, enligt uppgift, av linorna till kungens tält. Skottarna smet sedan undan.
