First War of Villmergen: Första Villmergenkriget
A short war between the Protestant cantons of Zürich and Bern and the five Catholic cantons of central Switzerland, set off when Schwyz executed four Protestants from Arth whose fellow believers had fled to Zürich in 1655. Zürich and Bern declared war on 6 January 1656, hoping to overturn the Catholic advantage written into the Second Peace of Kappel of 1531. Zürich’s army under Hans Rudolf Werdmüller laid siege to Rapperswil, but on 24 January Lucerne and Zug troops under Christoph Pfyffer surprised and routed the Bernese army of Sigmund von Erlach at Villmergen in the Freie Ämter. After Werdmüller’s assault on Rapperswil failed on 3 February, Bern and then Zürich sought peace, and the Third Peace of Baden on 7 March 1656 restored the old order, confirming each canton’s right to decide its own religion.: Ett kort krig mellan de protestantiska kantonerna Zürich och Bern och de fem katolska kantonerna i centrala Schweiz, utlöst när Schwyz avrättade fyra protestanter från Arth, vars trosfränder hade flytt till Zürich 1655. Zürich och Bern förklarade krig den 6 januari 1656 i hopp om att upphäva det katolska övertag som skrivits in i andra Kappelfreden 1531. Zürichs här under Hans Rudolf Werdmüller belägrade Rapperswil, men den 24 januari överrumplade och skingrade trupper från Luzern och Zug under Christoph Pfyffer Sigmund von Erlachs bernska här vid Villmergen i Freie Ämter. Sedan Werdmüllers stormning av Rapperswil misslyckats den 3 februari sökte Bern och därefter Zürich fred, och tredje Badenfreden den 7 mars 1656 återställde den gamla ordningen och bekräftade varje kantons rätt att själv bestämma sin religion.
