Peace in the east let Germany bring dozens of divisions west, and Erich Ludendorff resolved to win before the Americans arrived in strength. On 21 March 1918 Operation Michael struck the British Fifth and Third Armies near Saint-Quentin after a five-hour bombardment by some 6,600 guns. Storm troops slipped through the fog-bound defences, and within two weeks the Germans had advanced up to 60 kilometres, the largest gains in the west since 1914. The Allies named Ferdinand Foch to coordinate their armies, and the advance was stopped before Amiens in early April.: Freden i öster gjorde det möjligt för Tyskland att föra dussintals divisioner västerut, och Erich Ludendorff beslöt att vinna innan amerikanerna anlände i full styrka. Den 21 mars 1918 slog Operation Michael till mot den brittiska femte och tredje armén nära Saint-Quentin efter en fem timmar lång beskjutning med omkring 6 600 kanoner. Stormtrupper tog sig igenom de dimhöljda försvarslinjerna, och inom två veckor hade tyskarna ryckt fram upp till 60 kilometer, de största vinsterna i väster sedan 1914. De allierade utsåg Ferdinand Foch att samordna deras arméer, och framryckningen hejdades framför Amiens i början av april.
Further attacks followed on the Lys in Flanders in April, when Haig ordered his men to fight on “with our backs to the wall”, on the Chemin des Dames on 27 May, where the Germans broke through and reached the Marne at Château-Thierry, and on the Matz in June. American troops, arriving by the summer at some 10,000 a day, fought at Cantigny and Belleau Wood. Each offensive won ground but cost the Germans their best troops, and left them holding long, exposed salients. A last attack on both sides of Reims on 15 July crossed the Marne but was stopped within three days.: "Fler anfall följde: vid Lys i Flandern i april, då Haig beordrade sina män att strida vidare ”med ryggen mot muren”, vid Chemin des Dames den 27 maj, där tyskarna bröt igenom och nådde Marne vid Château-Thierry, och vid Matz i juni. Amerikanska trupper, som på sommaren anlände i en takt av omkring 10 000 om dagen, stred vid Cantigny och Belleau Wood. Varje offensiv vann terräng men kostade tyskarna deras bästa trupper och lämnade dem kvar i långa, utsatta utbuktningar. Ett sista anfall på båda sidor om Reims den 15 juli gick över Marne men hejdades inom tre dagar."
