French troops entered the city after the armistice. Alsace-Lorraine, annexed by Germany in 1871, returned to France.: Franska trupper gick in i staden efter vapenstilleståndet. Elsass-Lothringen, som Tyskland hade annekterat 1871, återgick till Frankrike.
Saarbrücken: Saarbrücken
The Saar territory was governed by the League of Nations, with its coal mines owned by France, until a plebiscite returned it to Germany in 1935.: Saarområdet styrdes av Nationernas förbund, med kolgruvorna i fransk ägo, tills en folkomröstning återförde det till Tyskland 1935.
Eupen: Eupen
Eupen and Malmedy passed to Belgium after a public consultation in which those who objected had to sign their names in a register.: Eupen och Malmedy övergick till Belgien efter en folkkonsultation där de som motsatte sig måste skriva sina namn i ett register.
Northern Schleswig: Nordslesvig
February – March 1920: februari – mars 1920
In two plebiscite zones the northern one voted for Denmark and the southern one, with Flensburg, for Germany. The new border took effect on 15 June 1920.: I två omröstningszoner röstade den norra för Danmark och den södra, med Flensburg, för Tyskland. Den nya gränsen trädde i kraft den 15 juni 1920.
Danzig: Danzig
The mainly German port became a free city under the League of Nations, with rights for Poland; the Polish Corridor separated East Prussia from the rest of Germany.: Den till övervägande del tyska hamnstaden blev en fri stad under Nationernas förbund, med rättigheter för Polen; den polska korridoren skilde Ostpreussen från resten av Tyskland.
Memel: Memel
The territory north of the Neman was put under Allied administration, run by France; Lithuania seized it in 1923.: Området norr om Njemen ställdes under allierad förvaltning, som sköttes av Frankrike; Litauen tog det 1923.
Upper Silesia: Övre Schlesien
A plebiscite in March 1921 was followed by a Polish rising. On the League of Nations’ advice the industrial district was divided between Germany and Poland, taking effect in 1922.: En folkomröstning i mars 1921 följdes av ett polskt uppror. På Nationernas förbunds inrådan delades industridistriktet mellan Tyskland och Polen, med verkan från 1922.
Rhineland, occupied by the Allies from December 1918: Rhenlandet, ockuperat av de allierade från december 1918
