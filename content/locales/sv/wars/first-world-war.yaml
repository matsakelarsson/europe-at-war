In September 1915 Bulgaria, promised Serbian Macedonia, joined the Central Powers. On 6 October German and Austro-Hungarian armies under August von Mackensen crossed the Danube and the Sava, and Belgrade fell on 9 October after fierce street fighting. On 14 October the Bulgarian army attacked from the east, cutting the railway to Salonika and taking Skopje on 22 October and Niš on 5 November. At the invitation of the Greek prime minister, Eleftherios Venizelos, French and British troops had begun landing at Salonika on 5 October, but King Constantine forced him to resign and Greece stayed neutral. The Anglo-French force that advanced up the Vardar was too late to help, and in December the Bulgarians pushed it back into Greece.: I september 1915 anslöt sig Bulgarien, som utlovats serbiska Makedonien, till centralmakterna. Den 6 oktober gick tyska och österrikisk-ungerska arméer under August von Mackensen över Donau och Sava, och Belgrad föll den 9 oktober efter hårda gatustrider. Den 14 oktober anföll den bulgariska armén från öster, skar av järnvägen till Saloniki och tog Skopje den 22 oktober och Niš den 5 november. På inbjudan av den grekiske premiärministern Eleftherios Venizelos hade franska och brittiska trupper börjat landstiga i Saloniki den 5 oktober, men kung Konstantin tvingade honom att avgå, och Grekland förblev neutralt. Den brittisk-franska styrka som ryckte fram uppför Vardar kom för sent för att hjälpa, och i december trängde bulgarerna tillbaka den in i Grekland.
Rather than surrender, the Serbian army, the old King Peter and the government set out on 25 November across the snow-covered mountains of Montenegro and Albania to the Adriatic, with civilians and Austro-Hungarian prisoners. Frost, hunger, disease and attacks by Albanian irregulars killed tens of thousands on the way and after they reached the coast. From January 1916 Italian, French and British ships carried more than 250,000 people from the Albanian ports, the soldiers mostly to Corfu; rebuilt there, the army returned to fight on the Salonika front. Austria-Hungary overran Montenegro in January, when King Nicholas went into exile, and occupied northern and central Albania, while Bulgaria took Macedonia and eastern Serbia.: Hellre än att kapitulera gav sig den serbiska armén, den gamle kung Peter och regeringen den 25 november av över de snötäckta bergen i Montenegro och Albanien mot Adriatiska havet, tillsammans med civila och österrikisk-ungerska fångar. Köld, svält, sjukdomar och anfall av albanska irreguljära styrkor dödade tiotusentals under vägen och sedan de nått kusten. Från januari 1916 förde italienska, franska och brittiska fartyg mer än 250 000 människor från de albanska hamnarna, soldaterna mestadels till Korfu; där byggdes armén upp på nytt och återvände sedan för att strida vid Salonikifronten. Österrike-Ungern erövrade Montenegro i januari, då kung Nikola gick i landsflykt, och ockuperade norra och mellersta Albanien, medan Bulgarien tog Makedonien och östra Serbien.
