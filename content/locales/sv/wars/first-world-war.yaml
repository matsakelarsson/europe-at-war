In the autumn of 1917 Germany sent divisions to help the hard-pressed Austro-Hungarians on the Isonzo. On 24 October the new Fourteenth Army under General Otto von Below attacked in the upper Isonzo valley around Caporetto, today’s Kobarid, after a short bombardment with gas and high explosive, and its storm troops pushed along the valleys behind the Italian positions. Among them was Lieutenant Erwin Rommel, whose company took Monte Matajur. The Italian Second Army collapsed. Cadorna ordered a retreat to the Tagliamento and then to the Piave, which the armies reached by 10 November, abandoning Udine, all of Friuli and much of the Veneto.: Hösten 1917 sände Tyskland divisioner för att hjälpa de hårt pressade österrikarna och ungrarna vid Isonzo. Den 24 oktober anföll den nya fjortonde armén under general Otto von Below i övre Isonzodalen kring Caporetto, dagens Kobarid, efter en kort beskjutning med gas och spränggranater, och dess stormtrupper trängde fram längs dalarna bakom de italienska ställningarna. Bland dem fanns löjtnant Erwin Rommel, vars kompani tog Monte Matajur. Den italienska andra armén bröt samman. Cadorna beordrade reträtt till Tagliamento och sedan till Piave, som arméerna nådde den 10 november, och övergav Udine, hela Friuli och stora delar av Veneto.
Italy lost some 13,000 killed, 30,000 wounded and 265,000–275,000 taken prisoner, and hundreds of thousands of soldiers and civilians fled west. General Armando Diaz replaced Cadorna, British and French divisions arrived, and at Rapallo the Allies set up a Supreme War Council. The new line on the Piave and Monte Grappa held through November and December. In June 1918 Austria-Hungary attacked across the Piave and on the Asiago plateau in its last great offensive, but in eight days of fighting the Italians and their allies drove it back across the river with heavy losses.: Italien förlorade omkring 13 000 stupade, 30 000 sårade och 265 000–275 000 tillfångatagna, och hundratusentals soldater och civila flydde västerut. General Armando Diaz ersatte Cadorna, brittiska och franska divisioner anlände, och i Rapallo inrättade de allierade ett högsta krigsråd. Den nya linjen vid Piave och Monte Grappa höll under november och december. I juni 1918 anföll Österrike-Ungern över Piave och på Asiagoplatån i sin sista stora offensiv, men efter åtta dagars strider drev italienarna och deras allierade tillbaka den över floden med svåra förluster.
