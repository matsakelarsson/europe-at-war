The Allies had planned a joint offensive astride the Somme for 1916. Verdun cut the French share, and the main attack fell to the British, many of them volunteers of Kitchener’s New Army. A week-long bombardment of about 1.5 million shells failed to cut much of the barbed wire or destroy the deep German dugouts, and when the British Fourth Army attacked on 1 July 1916 the defenders were ready. The British suffered 57,470 casualties that day, 19,240 of them killed, the worst day in the British army’s history. Only in the south, around Mametz and Montauban and beside the French, were the objectives taken.: De allierade hade planerat en gemensam offensiv på båda sidor om Somme 1916. Verdun minskade den franska andelen, och huvudanfallet föll på britterna, många av dem frivilliga i Kitcheners nya armé. En veckolång beskjutning med omkring 1,5 miljoner granater lyckades inte klippa upp mycket av taggtråden eller förstöra de djupa tyska skyddsrummen, och när den brittiska fjärde armén anföll den 1 juli 1916 var försvararna beredda. Britterna förlorade 57 470 man den dagen, varav 19 240 stupade, den värsta dagen i den brittiska arméns historia. Endast i söder, kring Mametz och Montauban och vid sidan av fransmännen, nåddes målen.
The battle became a slow struggle of attrition. Australian troops took Pozières in July, South Africans held Delville Wood, and on 15 September tanks went into action for the first time, at Flers–Courcelette. Thiepval fell at the end of September and Beaumont-Hamel in November, before rain and mud ended the offensive on 18 November. The Allies had advanced up to about ten kilometres. British losses were about 420,000 and French about 200,000; estimates of German losses vary widely, from about 240,000 to 600,000. The battle relieved Verdun and wore down the German army, and historians still debate whether that justified its cost.: Slaget blev en långsam utnötningskamp. Australiska trupper tog Pozières i juli, sydafrikaner höll Delville Wood, och den 15 september sattes stridsvagnar in för första gången, vid Flers–Courcelette. Thiepval föll i slutet av september och Beaumont-Hamel i november, innan regn och lera avslutade offensiven den 18 november. De allierade hade ryckt fram upp till omkring tio kilometer. De brittiska förlusterna var omkring 420 000 och de franska omkring 200 000; uppskattningarna av de tyska förlusterna varierar kraftigt, från omkring 240 000 till 600 000. Slaget avlastade Verdun och nötte ned den tyska armén, och historikerna diskuterar fortfarande om det rättfärdigade kostnaden.
