An Anglo-Indian force had landed at the head of the Persian Gulf in November 1914 to protect Britain’s oil supplies and taken Basra. In 1915 General Charles Townshend’s division advanced up the Tigris towards Baghdad, but after a costly battle at Ctesiphon in November it fell back to Kut, where Ottoman forces besieged it from 7 December. Relief attempts failed, and on 29 April 1916 Townshend surrendered with about 13,000 British and Indian soldiers, many of whom died of heat, disease and neglect on the march into captivity and in the camps. A larger and better supplied army under General Stanley Maude advanced again in December 1916, retook Kut and entered Baghdad on 11 March 1917.: En brittisk-indisk styrka hade landstigit vid Persiska vikens innersta del i november 1914 för att skydda Storbritanniens oljeförsörjning och tagit Basra. År 1915 ryckte general Charles Townshends division fram uppför Tigris mot Bagdad, men efter ett kostsamt slag vid Ktesifon i november föll den tillbaka till Kut, där osmanska styrkor belägrade den från den 7 december. Undsättningsförsöken misslyckades, och den 29 april 1916 kapitulerade Townshend med omkring 13 000 brittiska och indiska soldater, av vilka många dog av hetta, sjukdomar och vanvård under marschen i fångenskap och i lägren. En större och bättre försörjd armé under general Stanley Maude ryckte fram på nytt i december 1916, återtog Kut och gick in i Bagdad den 11 mars 1917.
In June 1916 Sharif Hussein of Mecca, promised British support for Arab independence, rose against Ottoman rule in the Hejaz. With British advisers such as T. E. Lawrence, the Arab forces of his son Faisal raided the Hejaz railway and took Aqaba in July 1917. Further west the British had beaten off an Ottoman attack on the Suez Canal in 1915 and crossed Sinai, but failed twice at Gaza in 1917. Under General Edmund Allenby they broke the Gaza–Beersheba line from 31 October, and on 9 December Jerusalem surrendered. Meanwhile Britain and France had secretly agreed, in the Sykes–Picot agreement of 1916, to divide the Arab lands between them, and the Balfour Declaration of November 1917 promised British support for a Jewish national home in Palestine.: I juni 1916 reste sig sharif Husayn av Mecka, som utlovats brittiskt stöd för arabisk självständighet, mot det osmanska styret i Hijaz. Med brittiska rådgivare som T. E. Lawrence angrep hans son Faisals arabiska styrkor Hijazbanan och tog Aqaba i juli 1917. Längre västerut hade britterna slagit tillbaka ett osmanskt anfall mot Suezkanalen 1915 och gått över Sinai, men misslyckades två gånger vid Gaza 1917. Under general Edmund Allenby bröt de Gaza–Beersheba-linjen från den 31 oktober, och den 9 december kapitulerade Jerusalem. Samtidigt hade Storbritannien och Frankrike i hemlighet kommit överens, i Sykes–Picot-avtalet 1916, om att dela de arabiska länderna mellan sig, och Balfourdeklarationen i november 1917 utlovade brittiskt stöd för ett judiskt nationalhem i Palestina.
On 19 September 1918, at Megiddo, Allenby’s infantry broke through on the coastal plain and his cavalry swept round behind the Ottoman armies, which collapsed. Australian and Arab troops entered Damascus on 1 October, and Aleppo fell later that month. War, blockade, requisitions and locusts also brought famine to Syria and Lebanon, where by some estimates about 200,000 people died of hunger and disease in Mount Lebanon alone.: Den 19 september 1918, vid Megiddo, bröt Allenbys infanteri igenom på kustslätten och hans kavalleri svepte runt bakom de osmanska arméerna, som bröt samman. Australiska och arabiska trupper gick in i Damaskus den 1 oktober, och Aleppo föll senare samma månad. Krig, blockad, rekvisitioner och gräshoppor förde också svält till Syrien och Libanon, där enligt vissa uppskattningar omkring 200 000 människor dog av svält och sjukdomar enbart i Libanonberget.
