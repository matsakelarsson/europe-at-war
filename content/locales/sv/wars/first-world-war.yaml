The French and British armies fell back for two weeks, and on 2 September the French government left Paris for Bordeaux. But the German right wing was overstretched, and Alexander von Kluck’s First Army turned south-east to pass east of Paris, exposing its flank to a new French army gathered in the capital. On 5 September the French commander-in-chief, Joseph Joffre, attacked along the whole line, and some reinforcements reached the front in Paris taxis. When the British advanced into a gap between the German First and Second Armies, the Germans withdrew on 9 September to the heights north of the Aisne.: De franska och brittiska arméerna föll tillbaka i två veckor, och den 2 september lämnade den franska regeringen Paris för Bordeaux. Men den tyska högerflygeln var överansträngd, och Alexander von Klucks första armé svängde mot sydost för att passera öster om Paris och blottade därmed sin flank för en ny fransk armé som samlats i huvudstaden. Den 5 september anföll den franske överbefälhavaren Joseph Joffre längs hela linjen, och en del förstärkningar nådde fronten i parisiska taxibilar. När britterna ryckte in i en lucka mellan den tyska första och andra armén drog sig tyskarna den 9 september tillbaka till höjderna norr om Aisne.
Moltke was replaced by Erich von Falkenhayn. Each side then tried to outflank the other to the north, in what became known as the race to the sea. Antwerp fell on 10 October, and the Belgian army held the last corner of its country on the Yser by flooding the land in front of it. At Ypres, British, French and Belgian troops beat off German attacks from 19 October to 22 November. By the end of the year a line of trenches ran from the North Sea to Switzerland, and Germany held most of Belgium and ten French departments, with much of France’s coal and heavy industry.: Moltke ersattes av Erich von Falkenhayn. Därefter försökte båda sidor kringgå varandra i norr, i det som kom att kallas kapplöpningen mot havet. Antwerpen föll den 10 oktober, och den belgiska armén höll det sista hörnet av sitt land vid Yser genom att sätta marken framför sig under vatten. Vid Ypres slog brittiska, franska och belgiska trupper tillbaka tyska anfall från den 19 oktober till den 22 november. Vid årets slut löpte en linje av skyttegravar från Nordsjön till Schweiz, och Tyskland höll större delen av Belgien och tio franska departement med en stor del av Frankrikes kol och tunga industri.
