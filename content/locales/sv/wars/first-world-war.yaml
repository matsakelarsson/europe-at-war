On 28 June 1914 Gavrilo Princip, a young Bosnian Serb nationalist armed with the help of members of the Serbian secret society known as the Black Hand, shot dead Archduke Franz Ferdinand, the heir to the Austro-Hungarian throne, and his wife Sophie in Sarajevo. Assured of German support, Austria-Hungary sent Serbia an ultimatum on 23 July. Serbia accepted most of its demands but not all, and on 28 July Austria-Hungary declared war. Russia mobilised in support of Serbia, and Germany declared war on Russia on 1 August and on France, Russia’s ally, on 3 August.: Den 28 juni 1914 sköt Gavrilo Princip, en ung bosnienserbisk nationalist som beväpnats med hjälp av medlemmar av det serbiska hemliga sällskapet Svarta handen, ihjäl ärkehertig Frans Ferdinand, arvtagaren till den österrikisk-ungerska tronen, och hans hustru Sophie i Sarajevo. Försäkrat om tyskt stöd sände Österrike-Ungern den 23 juli ett ultimatum till Serbien. Serbien godtog de flesta men inte alla krav, och den 28 juli förklarade Österrike-Ungern krig. Ryssland mobiliserade till stöd för Serbien, och Tyskland förklarade krig mot Ryssland den 1 augusti och mot Frankrike, Rysslands allierade, den 3 augusti.
Germany’s war plan, drawn up under Alfred von Schlieffen and revised by Helmuth von Moltke, sent most of its army through Luxembourg and neutral Belgium, round the French border fortresses, to defeat France within weeks. Belgium refused free passage. When German troops crossed its border on 4 August, Britain, a guarantor of Belgian neutrality since 1839, declared war on Germany. The forts of Liège held out until 16 August, Brussels fell on 20 August, and the Belgian army withdrew to the fortress of Antwerp.: Tysklands krigsplan, utarbetad under Alfred von Schlieffen och reviderad av Helmuth von Moltke, sände huvuddelen av armén genom Luxemburg och det neutrala Belgien, runt de franska gränsfästningarna, för att besegra Frankrike inom några veckor. Belgien vägrade att ge fri passage. När tyska trupper gick över dess gräns den 4 augusti förklarade Storbritannien, som sedan 1839 hade garanterat Belgiens neutralitet, krig mot Tyskland. Forten i Liège höll ut till den 16 augusti, Bryssel föll den 20 augusti och den belgiska armén drog sig tillbaka till fästningen Antwerpen.
In the Battle of the Frontiers the French offensives in Lorraine and the Ardennes were thrown back with enormous losses; on 22 August alone some 27,000 French soldiers were killed. The French Fifth Army was beaten at Charleroi, the British Expeditionary Force fought a delaying action at Mons on 23 August, and both began a long retreat. Convinced that civilians were firing on them, German troops killed some 6,500 Belgian and French civilians between August and October, among them 674 at Dinant, and burned much of Leuven.: I gränsslagen kastades de franska offensiverna i Lothringen och Ardennerna tillbaka med enorma förluster; enbart den 22 augusti stupade omkring 27 000 franska soldater. Den franska femte armén besegrades vid Charleroi, Brittiska expeditionsstyrkan utkämpade en fördröjningsstrid vid Mons den 23 augusti, och båda inledde en lång reträtt. I övertygelsen att civila sköt på dem dödade tyska trupper omkring 6 500 belgiska och franska civila mellan augusti och oktober, bland dem 674 i Dinant, och brände stora delar av Leuven.
