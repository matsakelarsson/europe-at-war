In 1915 the French and British tried to break through the German trenches, while Germany stood mostly on the defensive in the west and sent its reserves east. A British attack at Neuve Chapelle in March took the village but could go no further. On 22 April, north of Ypres, the Germans released more than 150 tonnes of chlorine against French colonial and territorial troops, the first large-scale use of lethal gas. The line gave way over several kilometres, but Canadian and French troops closed the gap, and by late May the salient had shrunk to within a few kilometres of the town.: År 1915 försökte fransmännen och britterna bryta igenom de tyska skyttegravarna, medan Tyskland mest höll sig på defensiven i väster och sände sina reserver österut. Ett brittiskt anfall vid Neuve Chapelle i mars tog byn men kom inte längre. Den 22 april, norr om Ypres, släppte tyskarna ut mer än 150 ton klorgas mot franska kolonial- och territorialtrupper, den första storskaliga användningen av dödlig gas. Linjen gav vika på flera kilometer, men kanadensiska och franska trupper slöt luckan, och i slutet av maj hade frontutbuktningen krympt till några kilometer från staden.
French offensives in Artois in May and September took the Lorette spur and the villages below Vimy Ridge, whose crest they reached only to be driven off, and cost the French over 100,000 casualties in the spring alone. On 25 September the British, using gas themselves for the first time, attacked at Loos while the French attacked in Champagne. Both offensives gained a few kilometres before they were stopped. The year’s attacks cost the French and British far more men than the defenders, and in December Sir Douglas Haig replaced Sir John French as commander of the British forces in France.: Franska offensiver i Artois i maj och september tog Lorettehöjden och byarna nedanför Vimyåsen, vars krön de nådde bara för att drivas därifrån, och kostade fransmännen över 100 000 man i förluster enbart under våren. Den 25 september anföll britterna, som för första gången själva använde gas, vid Loos, medan fransmännen anföll i Champagne. Båda offensiverna vann några kilometer innan de hejdades. Årets anfall kostade fransmännen och britterna betydligt fler man än försvararna, och i december ersatte sir Douglas Haig sir John French som befälhavare för de brittiska styrkorna i Frankrike.
