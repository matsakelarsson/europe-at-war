To open the straits to Russia and knock the Ottoman Empire out of the war, Britain and France tried to force the Dardanelles. Their warships began bombarding the forts at the entrance on 19 February 1915, and on 18 March the battleships attacked the Narrows in force. A line of mines laid ten days earlier sank the French Bouvet and the British Irresistible and Ocean and crippled others, and the fleet withdrew. The Allies decided to land an army on the Gallipoli peninsula instead. On 25 April British troops landed at Cape Helles and the Australian and New Zealand Army Corps further north, at what became Anzac Cove, while the French made a diversion at Kum Kale on the Asian shore.: För att öppna sunden för Ryssland och slå ut Osmanska riket ur kriget försökte Storbritannien och Frankrike forcera Dardanellerna. Deras krigsfartyg började bombardera forten vid inloppet den 19 februari 1915, och den 18 mars anföll slagskeppen sundets smalaste del, the Narrows, med full styrka. En minlinje som lagts ut tio dagar tidigare sänkte franska Bouvet och brittiska Irresistible och Ocean och satte andra ur stridbart skick, och flottan drog sig tillbaka. De allierade beslöt i stället att landsätta en armé på Gallipolihalvön. Den 25 april landsteg brittiska trupper vid Kap Helles och den australisk-nyzeeländska armékåren längre norrut, vid det som blev Anzac Cove, medan fransmännen gjorde en avledningsmanöver vid Kum Kale på den asiatiska stranden.
Ottoman troops, among them a division under Lieutenant-Colonel Mustafa Kemal, held the heights above the beaches, and the fighting sank into trench warfare amid heat, flies and dysentery. In August a new landing at Suvla Bay and an offensive on the Sari Bair ridge briefly reached the summit of Chunuk Bair but failed. In December the Allies decided to leave, and they evacuated Anzac and Suvla by 20 December and Helles by 9 January 1916 almost without loss. Each side lost some 250,000–300,000 men killed, wounded, captured or sick, with perhaps 43,000–61,000 Allied and 57,000–87,000 Ottoman dead. The campaign became a founding story of national identity in Australia, New Zealand and Turkey.: Osmanska trupper, bland dem en division under överstelöjtnant Mustafa Kemal, höll höjderna ovanför stränderna, och striderna stelnade i skyttegravskrig mitt i hetta, flugor och dysenteri. I augusti nådde en ny landstigning vid Suvla Bay och en offensiv mot åsen Sari Bair för en kort stund toppen av Chunuk Bair men misslyckades. I december beslöt de allierade att lämna halvön, och de evakuerade Anzac och Suvla till den 20 december och Helles till den 9 januari 1916 nästan utan förluster. Vardera sidan förlorade omkring 250 000–300 000 man i stupade, sårade, tillfångatagna eller sjuka, med kanske 43 000–61 000 allierade och 57 000–87 000 osmanska döda. Fälttåget blev en grundberättelse för den nationella identiteten i Australien, Nya Zeeland och Turkiet.
