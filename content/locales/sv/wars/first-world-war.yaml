After a day-long bombardment, Serbian, French and Greek troops stormed the Bulgarian trenches on the ridge and broke the front open.: Efter en daglång beskjutning stormade serbiska, franska och grekiska trupper de bulgariska skyttegravarna på bergsryggen och bröt upp fronten.
Battle of Doiran: Slaget vid Dojran
18–19 September 1918: 18–19 september 1918
British and Greek attacks on the Bulgarian hill positions west of the lake failed with heavy losses, but the Bulgarians soon had to retreat.: Brittiska och grekiska anfall mot de bulgariska höjdställningarna väster om sjön misslyckades med svåra förluster, men bulgarerna tvingades snart retirera.
French cavalry under General Jouinot-Gambetta reached the town after a ride through the mountains, cutting the Bulgarian and German line of retreat.: Franskt kavalleri under general Jouinot-Gambetta nådde staden efter en ritt genom bergen och skar av bulgarernas och tyskarnas reträttväg.
Armistice of Salonika: Vapenstilleståndet i Saloniki
Bulgaria agreed to demobilise and evacuate the Greek and Serbian lands it held. The ceasefire took effect at noon the next day.: Bulgarien gick med på att demobilisera och utrymma de grekiska och serbiska områden landet höll. Eldupphöret trädde i kraft vid middagstid följande dag.
1 November 1918: 1 november 1918
The Serbian First Army re-entered the capital after a rapid advance from the Salonika front, pushing back German and Austro-Hungarian rearguards.: Den serbiska första armén återvände in i huvudstaden efter en snabb framryckning från Salonikifronten och trängde tillbaka tyska och österrikisk-ungerska eftertrupper.
Armistice of Mudros: Vapenstilleståndet i Mudros
30 October 1918: 30 oktober 1918
Signed in the harbour of Lemnos. The Ottoman Empire opened the straits and agreed to demobilise its army.: Undertecknades i hamnen på Lemnos. Osmanska riket öppnade sunden och gick med på att demobilisera sin armé.
After days of hard fighting on Monte Grappa and the Piave, the Italians reached Vittorio on 30 October, splitting the Austro-Hungarian armies.: Efter dagar av hårda strider på Monte Grappa och vid Piave nådde italienarna Vittorio den 30 oktober och splittrade de österrikisk-ungerska arméerna.
Armistice of Villa Giusti: Vapenstilleståndet i Villa Giusti
3 November 1918: 3 november 1918
Signed at a villa outside Padua. The fighting stopped at 15:00 on 4 November.: Undertecknades i en villa utanför Padua. Striderna upphörde kl. 15.00 den 4 november.
