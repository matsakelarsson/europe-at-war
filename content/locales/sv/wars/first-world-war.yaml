In March 1916 a Russian offensive at Lake Naroch, launched to relieve the French at Verdun, failed with heavy losses. In the south-west General Aleksei Brusilov prepared a different kind of attack, striking on a wide front after short bombardments so that the enemy could not tell where the main blow would fall. On 4 June his four armies broke the Austro-Hungarian lines. Lutsk fell within days, and in the south the Russians took Chernivtsi and most of Bukovina and advanced to the Carpathians.: "I mars 1916 misslyckades en rysk offensiv vid Narotjsjön, som inletts för att avlasta fransmännen vid Verdun, med svåra förluster. I sydväst förberedde general Aleksej Brusilov ett anfall av ett annat slag: han slog till på en bred front efter korta beskjutningar så att fienden inte kunde avgöra var huvudstöten skulle komma. Den 4 juni bröt hans fyra arméer igenom de österrikisk-ungerska linjerna. Lutsk föll inom några dagar, och i söder tog ryssarna Tjernivtsi och större delen av Bukovina och ryckte fram till Karpaterna."
German reserves stopped the advance short of Kovel and Lemberg, and the offensive ended in late September. The Austro-Hungarian army lost hundreds of thousands of men, among them some 400,000 prisoners, and never fully recovered; Russian losses were also enormous and drained the army’s strength. The victory encouraged Romania to enter the war on the Entente side in August, but by December German, Austro-Hungarian, Bulgarian and Ottoman forces had taken Bucharest and most of the country.: Tyska reserver hejdade framryckningen före Kovel och Lemberg, och offensiven upphörde i slutet av september. Den österrikisk-ungerska armén förlorade hundratusentals man, bland dem omkring 400 000 fångar, och återhämtade sig aldrig helt; de ryska förlusterna var också enorma och tärde på arméns styrka. Segern uppmuntrade Rumänien att i augusti gå in i kriget på ententens sida, men i december hade tyska, österrikisk-ungerska, bulgariska och osmanska styrkor tagit Bukarest och större delen av landet.
