Austria-Hungary declared war on Serbia on 28 July 1914, a month after the assassination of Archduke Franz Ferdinand in Sarajevo, and its river monitors shelled Belgrade from the Danube. On 12 August General Oskar Potiorek’s armies crossed the Drina and the Sava into north-western Serbia, expecting a short punitive campaign. Marshal Radomir Putnik’s Serbian army, hardened by the Balkan Wars, met them around Mount Cer and in a week of fighting drove them back across the rivers by 24 August, the first Allied victory of the war. In the towns and villages of the Mačva, among them Šabac, Austro-Hungarian troops shot and hanged many civilians as alleged guerrillas.: Österrike-Ungern förklarade krig mot Serbien den 28 juli 1914, en månad efter mordet på ärkehertig Frans Ferdinand i Sarajevo, och dess flodmonitorer besköt Belgrad från Donau. Den 12 augusti gick general Oskar Potioreks arméer över Drina och Sava in i nordvästra Serbien i väntan på ett kort straffälttåg. Fältmarskalk Radomir Putniks serbiska armé, härdad av Balkankrigen, mötte dem kring berget Cer och drev efter en veckas strider tillbaka dem över floderna till den 24 augusti, krigets första allierade seger. I städerna och byarna i Mačva, bland dem Šabac, sköt och hängde österrikisk-ungerska trupper många civila som påstådda gerillakrigare.
A second invasion in September won a foothold across the Drina after weeks of bloody fighting. A third, in November, pushed the exhausted Serbs, short of shells, back beyond the Kolubara, and on 2 December Austro-Hungarian troops entered Belgrade. The next day General Živojin Mišić’s First Army, with fresh ammunition, counter-attacked from the Suvobor heights. Within two weeks the Serbs had routed the invaders and retaken Belgrade on 15 December. The campaign cost Austria-Hungary some 270,000 men killed, wounded, captured or sick, and Serbia about 165,000. In the winter a typhus epidemic swept the country and killed tens of thousands of soldiers, civilians and prisoners.: En andra invasion i september vann efter veckor av blodiga strider fotfäste på andra sidan Drina. En tredje, i november, trängde de utmattade serberna, som led brist på granater, tillbaka bortom Kolubara, och den 2 december gick österrikisk-ungerska trupper in i Belgrad. Dagen därpå gick general Živojin Mišićs första armé, med ny ammunition, till motanfall från Suvoborhöjderna. Inom två veckor hade serberna slagit inkräktarna på flykten och den 15 december återtagit Belgrad. Fälttåget kostade Österrike-Ungern omkring 270 000 man i stupade, sårade, tillfångatagna eller sjuka, och Serbien omkring 165 000. Under vintern svepte en tyfusepidemi över landet och dödade tiotusentals soldater, civila och fångar.
