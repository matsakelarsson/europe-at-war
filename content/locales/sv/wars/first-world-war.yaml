On 18 July French and American divisions, led by tanks, struck the western flank of the German salient on the Marne near Soissons, and by early August the Germans had fallen back to the Vesle. On 8 August the British Fourth Army, with Canadian and Australian corps in the lead and some 500 tanks, attacked east of Amiens and advanced about eleven kilometres in a day, taking thousands of prisoners. Ludendorff called it “the black day of the German army”. Further Allied offensives followed, and on 12 September the American First Army under John J. Pershing cut off the Saint-Mihiel salient.: Den 18 juli slog franska och amerikanska divisioner, med stridsvagnar i täten, till mot västra flanken av den tyska utbuktningen vid Marne nära Soissons, och i början av augusti hade tyskarna fallit tillbaka till Vesle. Den 8 augusti anföll den brittiska fjärde armén, med kanadensiska och australiska kårer i täten och omkring 500 stridsvagnar, öster om Amiens och ryckte fram omkring elva kilometer på en dag och tog tusentals fångar. Ludendorff kallade det ”den tyska arméns svarta dag”. Fler allierade offensiver följde, och den 12 september skar den amerikanska första armén under John J. Pershing av utbuktningen vid Saint-Mihiel.
In late September the Allies attacked from Flanders to the Meuse. Americans and French advanced in the Meuse–Argonne; British, Australian and American divisions crossed the Saint-Quentin canal, where the Hindenburg Line was broken on 29 September; and Belgian, British and French forces attacked in Flanders. The same day Bulgaria signed an armistice, and Ludendorff told the Kaiser that Germany must seek peace. A new government under Prince Max of Baden asked President Woodrow Wilson for an armistice on 4 October. The German army fell back fighting, and Ludendorff resigned on 26 October.: I slutet av september anföll de allierade från Flandern till Maas. Amerikaner och fransmän ryckte fram i Meuse–Argonne; brittiska, australiska och amerikanska divisioner gick över Saint-Quentinkanalen, där Hindenburglinjen bröts den 29 september; och belgiska, brittiska och franska styrkor anföll i Flandern. Samma dag undertecknade Bulgarien ett vapenstillestånd, och Ludendorff meddelade kejsaren att Tyskland måste söka fred. En ny regering under prins Max av Baden bad president Woodrow Wilson om vapenstillestånd den 4 oktober. Den tyska armén föll tillbaka under strid, och Ludendorff avgick den 26 oktober.
Mutiny and revolution spread through Germany in early November, and on 9 November William II’s abdication was announced. Early on 11 November German delegates signed the armistice in Foch’s railway carriage in the forest of Compiègne, and the guns fell silent at 11 a.m. Germany had to leave occupied France, Belgium, Luxembourg and Alsace-Lorraine within 15 days, give up its submarines and much of its weaponry, have its main fleet interned and accept Allied occupation of the Rhineland, while the blockade went on until peace was signed.: Myteri och revolution spred sig genom Tyskland i början av november, och den 9 november tillkännagavs Vilhelm II:s abdikation. Tidigt den 11 november undertecknade tyska delegater vapenstilleståndet i Fochs järnvägsvagn i skogen vid Compiègne, och kanonerna tystnade klockan 11. Tyskland måste lämna det ockuperade Frankrike, Belgien, Luxemburg och Elsass-Lothringen inom 15 dagar, lämna ifrån sig sina ubåtar och en stor del av sina vapen, låta internera sin huvudflotta och godta allierad ockupation av Rhenlandet, medan blockaden fortsatte tills fred hade slutits.
