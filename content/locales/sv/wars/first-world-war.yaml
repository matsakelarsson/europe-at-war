In February and March 1917 the Germans gave up the great bulge between Arras and Soissons and withdrew to the shorter, heavily fortified Hindenburg Line, destroying villages, roads, bridges and wells and removing most of the inhabitants as they went. On 9 April the British attacked at Arras, and the Canadian Corps took Vimy Ridge. On 16 April the new French commander-in-chief, Robert Nivelle, who had promised a breakthrough within days, attacked the Chemin des Dames. The offensive gained little and cost the French well over 100,000 casualties, and Nivelle was replaced by Pétain.: I februari och mars 1917 gav tyskarna upp den stora utbuktningen mellan Arras och Soissons och drog sig tillbaka till den kortare, starkt befästa Hindenburglinjen, och förstörde under tiden byar, vägar, broar och brunnar och förde bort de flesta invånarna. Den 9 april anföll britterna vid Arras, och den kanadensiska kåren tog Vimyåsen. Den 16 april anföll den nye franske överbefälhavaren Robert Nivelle, som hade utlovat ett genombrott inom några dagar, Chemin des Dames. Offensiven vann föga och kostade fransmännen långt över 100 000 man i förluster, och Nivelle ersattes av Pétain.
In May and June mutinies broke out in about half the divisions of the French army; soldiers refused to attack, though most were still willing to hold the line. Pétain restored order with better leave and food, an end to hopeless attacks and courts-martial that passed over 500 death sentences, of which a few dozen were carried out. The British took over the main burden. Their mines blew the Germans off Messines Ridge on 7 June, and from 31 July Haig’s offensive at Ypres ground on through rain and mud until Canadian troops took the ruins of Passchendaele in November.: I maj och juni bröt myterier ut i ungefär hälften av den franska arméns divisioner; soldaterna vägrade att anfalla, även om de flesta fortfarande var villiga att hålla linjen. Pétain återställde ordningen med bättre permissioner och mat, ett slut på hopplösa anfall och krigsrätter som avkunnade över 500 dödsdomar, varav några dussin verkställdes. Britterna tog över huvudbördan. Deras minor sprängde bort tyskarna från Messinesåsen den 7 juni, och från den 31 juli malde Haigs offensiv vid Ypres vidare genom regn och lera tills kanadensiska trupper tog ruinerna av Passchendaele i november.
The Third Battle of Ypres gained about eight kilometres, and estimates of each side’s losses run from about 200,000 to over 400,000. On 20 November at Cambrai the British attacked with some 380 tanks and broke into the Hindenburg Line, but German counter-attacks from 30 November retook most of the ground. By then Russia was leaving the war and Italy had been routed at Caporetto, and Germany could bring its armies from the east.: Tredje slaget vid Ypres vann omkring åtta kilometer, och uppskattningarna av vardera sidans förluster sträcker sig från omkring 200 000 till över 400 000. Den 20 november vid Cambrai anföll britterna med omkring 380 stridsvagnar och bröt in i Hindenburglinjen, men tyska motanfall från den 30 november återtog större delen av marken. Vid det laget höll Ryssland på att lämna kriget och Italien hade slagits på flykten vid Caporetto, och Tyskland kunde föra över sina arméer från öster.
