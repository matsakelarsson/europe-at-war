The Ottoman Empire entered the war beside Germany in November 1914. Its war minister, Enver Pasha, led the Third Army through the snow-covered mountains to encircle the Russian army at Sarikamish. Many of his men lacked winter clothing, and about 25,000 are thought to have frozen to death before the main battle. Between 22 December 1914 and 17 January 1915 the Russians beat off the attack and destroyed most of the Ottoman force. Enver blamed the Armenians for the defeat.: Osmanska riket gick in i kriget på Tysklands sida i november 1914. Dess krigsminister Enver pascha förde tredje armén genom de snötäckta bergen för att omringa den ryska armén vid Sarıkamış. Många av hans soldater saknade vinterkläder, och omkring 25 000 tros ha frusit ihjäl före huvudslaget. Mellan den 22 december 1914 och den 17 januari 1915 slog ryssarna tillbaka anfallet och förintade större delen av den osmanska styrkan. Enver gav armenierna skulden för nederlaget.
From April 1915 the Ottoman government arrested Armenian leaders and deported the Armenian population of Anatolia towards the Syrian desert, with mass killings and death marches. Around a million Armenians died in what most historians and many states recognise as the Armenian genocide; the Turkish government rejects the term. Armenians in Van resisted until Russian troops arrived in May. In 1916 General Nikolai Yudenich’s army took Erzurum in February and Trabzon in April, and by the summer it held much of eastern Anatolia.: Från april 1915 lät den osmanska regeringen gripa armeniska ledare och deportera den armeniska befolkningen i Anatolien mot den syriska öknen, med massmord och dödsmarscher. Omkring en miljon armenier dog i det som de flesta historiker och många stater erkänner som folkmordet på armenier; den turkiska regeringen avvisar begreppet. Armenierna i Van gjorde motstånd tills ryska trupper anlände i maj. År 1916 tog general Nikolaj Judenitjs armé Erzurum i februari och Trabzon i april, och på sommaren höll den stora delar av östra Anatolien.
