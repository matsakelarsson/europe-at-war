On 2 May 1915 a German and Austro-Hungarian army under General August von Mackensen broke through the Russian front between Gorlice and Tarnów after a heavy bombardment. The Russian armies, short of shells and rifles, fell back across Galicia. Przemyśl was retaken on 3 June and Lemberg on 22 June. In July the Central Powers attacked Russian Poland from the north and south, and the Russian command ordered a withdrawal.: Den 2 maj 1915 bröt en tysk och österrikisk-ungersk armé under general August von Mackensen igenom den ryska fronten mellan Gorlice och Tarnów efter en kraftig beskjutning. De ryska arméerna, som led brist på granater och gevär, föll tillbaka genom Galizien. Przemyśl återtogs den 3 juni och Lemberg den 22 juni. I juli anföll centralmakterna Ryska Polen från norr och söder, och det ryska överkommandot beordrade reträtt.
Warsaw fell on 5 August, followed by the fortresses of Kovno, Novogeorgievsk and Brest-Litovsk. Vilna was lost in September, when the front settled from the Gulf of Riga to the Romanian border. By some estimates Russia lost about two million men killed, wounded or captured in 1915, and Nicholas II took over as commander-in-chief. Retreating Russian troops burned villages and forced people east, and the army deported hundreds of thousands of Jews and ethnic Germans. Some estimates put the number of refugees in Russia at over three million by the end of 1915.: Warszawa föll den 5 augusti, följt av fästningarna Kovno, Novogeorgievsk och Brest-Litovsk. Vilna gick förlorat i september, då fronten stabiliserades från Rigabukten till den rumänska gränsen. Enligt vissa uppskattningar förlorade Ryssland omkring två miljoner man i stupade, sårade eller tillfångatagna 1915, och Nikolaj II tog själv över som överbefälhavare. Retirerande ryska trupper brände byar och tvingade befolkningen österut, och armén deporterade hundratusentals judar och etniska tyskar. Enligt vissa uppskattningar fanns det vid slutet av 1915 över tre miljoner flyktingar i Ryssland.
