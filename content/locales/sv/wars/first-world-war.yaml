Peace talks opened at Brest-Litovsk in December 1917. The Central Powers demanded that Russia give up the lands they occupied, and in February 1918 they signed a separate peace with the Ukrainian People’s Republic. When Leon Trotsky broke off the talks without accepting their terms, German and Austro-Hungarian troops advanced from 18 February almost unopposed, taking Dvinsk, Minsk, Pskov and Tallinn and entering Kyiv on 1 March.: Fredsförhandlingar inleddes i Brest-Litovsk i december 1917. Centralmakterna krävde att Ryssland skulle avstå de områden de ockuperade, och i februari 1918 slöt de separatfred med Ukrainska folkrepubliken. När Lev Trotskij bröt förhandlingarna utan att godta deras villkor ryckte tyska och österrikisk-ungerska trupper från den 18 februari fram nästan utan motstånd, tog Dvinsk, Minsk, Pskov och Tallinn och gick in i Kyiv den 1 mars.
Lenin insisted on accepting the even harsher terms that followed. By the treaty signed on 3 March 1918, Soviet Russia gave up Poland, Lithuania, Courland and Riga, agreed to leave Livonia and Estonia, recognised the independence of Finland and Ukraine, and ceded Kars, Ardahan and Batumi to the Ottoman Empire, whose troops took them in April. The lost lands held about a third of the empire’s population. Germany’s defeat in November 1918 brought the annulment of the treaty, but the new states it had helped to create remained.: Lenin drev igenom att man skulle godta de ännu hårdare villkor som följde. Genom fördraget som undertecknades den 3 mars 1918 avstod Sovjetryssland från Polen, Litauen, Kurland och Riga, gick med på att lämna Livland och Estland, erkände Finlands och Ukrainas självständighet och avträdde Kars, Ardahan och Batumi till Osmanska riket, vars trupper tog dem i april. De förlorade områdena rymde omkring en tredjedel av rikets befolkning. Tysklands nederlag i november 1918 ledde till att fördraget annullerades, men de nya stater det hade bidragit till att skapa bestod.
