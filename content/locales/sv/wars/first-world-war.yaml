On the Salonika front a mixed Allied army of French, British, Serbian, Italian and, since Greece entered the war in June 1917, Greek troops had faced the Bulgarians and Germans across the mountains of Macedonia since 1916. On 15 September 1918 General Louis Franchet d’Espèrey attacked. Serbian, French and Greek troops broke the Bulgarian line on the mountain ridge of Dobro Pole, while a British and Greek attack at Lake Doiran failed with heavy losses. The breach widened, Bulgarian units mutinied, and French cavalry entered Skopje on 29 September. That day Bulgaria signed an armistice in Salonika, the first of the Central Powers to leave the war. The Serbian army pressed north and re-entered Belgrade on 1 November.: Vid Salonikifronten hade en blandad allierad armé av franska, brittiska, serbiska, italienska och, sedan Grekland gått in i kriget i juni 1917, grekiska trupper sedan 1916 stått mot bulgarerna och tyskarna i Makedoniens berg. Den 15 september 1918 anföll general Louis Franchet d’Espèrey. Serbiska, franska och grekiska trupper bröt den bulgariska linjen på bergsryggen Dobro Pole, medan ett brittiskt och grekiskt anfall vid Dojransjön misslyckades med svåra förluster. Brytningen vidgades, bulgariska förband gjorde myteri, och franskt kavalleri gick in i Skopje den 29 september. Samma dag undertecknade Bulgarien ett vapenstillestånd i Saloniki, den första av centralmakterna att lämna kriget. Den serbiska armén trängde norrut och återvände in i Belgrad den 1 november.
With Bulgaria out, the way to Constantinople lay open. The Ottoman Empire, also beaten in Syria and Mesopotamia, signed an armistice aboard the British battleship Agamemnon at Mudros on 30 October, and Allied fleets passed the Dardanelles in November. On the Piave the Italians, with British, French and American units, attacked on 24 October towards Vittorio Veneto. The Austro-Hungarian army, whose peoples were already declaring their own states, held for a few days and then fell apart, and hundreds of thousands of its soldiers were taken prisoner. Austria-Hungary signed an armistice at Villa Giusti near Padua on 3 November, to take effect the next day, and Italian troops entered Trento and Trieste. Germany followed on 11 November.: Med Bulgarien utslaget låg vägen till Konstantinopel öppen. Osmanska riket, som också hade besegrats i Syrien och Mesopotamien, undertecknade ett vapenstillestånd ombord på det brittiska slagskeppet Agamemnon vid Mudros den 30 oktober, och allierade flottor passerade Dardanellerna i november. Vid Piave anföll italienarna, med brittiska, franska och amerikanska förband, den 24 oktober mot Vittorio Veneto. Den österrikisk-ungerska armén, vars folk redan höll på att utropa egna stater, höll stånd i några dagar och föll sedan sönder, och hundratusentals av dess soldater togs till fånga. Österrike-Ungern undertecknade ett vapenstillestånd i Villa Giusti nära Padua den 3 november, med verkan från följande dag, och italienska trupper gick in i Trento och Trieste. Tyskland följde den 11 november.
