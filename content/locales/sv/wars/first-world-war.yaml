From the start of the war the Royal Navy blockaded Germany, closing the Channel and the northern exits of the North Sea and stopping food as well as war materials. Germany answered with submarines. In February 1915 it declared the waters around the British Isles a war zone in which merchant ships could be sunk without warning, and on 7 May a U-boat sank the British liner Lusitania off Ireland, killing nearly 1,200 people, among them 128 Americans. American protests led Germany to restrict its submarine campaign.: Från krigets början blockerade Royal Navy Tyskland genom att stänga Engelska kanalen och Nordsjöns norra utlopp och stoppade livsmedel såväl som krigsmateriel. Tyskland svarade med ubåtar. I februari 1915 förklarade landet farvattnen kring Brittiska öarna som krigszon där handelsfartyg kunde sänkas utan förvarning, och den 7 maj sänkte en ubåt den brittiska oceanångaren Lusitania utanför Irland, varvid nästan 1 200 människor omkom, bland dem 128 amerikaner. Amerikanska protester fick Tyskland att begränsa sitt ubåtskrig.
The German High Seas Fleet, smaller than the British Grand Fleet, hoped to trap and destroy part of it. On 31 May and 1 June 1916 the two fleets met off Jutland in the largest naval battle of the war, with about 250 ships. The British lost 14 ships and over 6,000 men, the Germans 11 ships and some 2,500 men, and both sides claimed victory. But the High Seas Fleet returned to port and never again seriously challenged British control of the North Sea.: Den tyska Högsjöflottan, som var mindre än den brittiska Grand Fleet, hoppades kunna locka i fälla och förinta en del av den. Den 31 maj och 1 juni 1916 möttes de två flottorna utanför Jylland i krigets största sjöslag, med omkring 250 fartyg. Britterna förlorade 14 fartyg och över 6 000 man, tyskarna 11 fartyg och omkring 2 500 man, och båda sidor gjorde anspråk på segern. Men Högsjöflottan återvände till hamn och utmanade aldrig mer på allvar den brittiska kontrollen över Nordsjön.
As the blockade brought growing hunger in Germany, its leaders gambled that unrestricted submarine warfare could starve Britain into submission before American help could arrive. It began on 1 February 1917, and in April U-boats sank some 860,000 tons of shipping. Together with the Zimmermann telegram, in which Germany offered Mexico an alliance against the United States, the sinkings led the United States to declare war on Germany on 6 April 1917. Convoys, introduced from the summer, cut the losses sharply.: När blockaden förde med sig en tilltagande svält i Tyskland satsade dess ledare på att ett oinskränkt ubåtskrig skulle kunna svälta Storbritannien till underkastelse innan amerikansk hjälp hann fram. Det inleddes den 1 februari 1917, och i april sänkte ubåtarna omkring 860 000 ton fartyg. Tillsammans med Zimmermanntelegrammet, där Tyskland erbjöd Mexiko en allians mot USA, ledde sänkningarna till att USA förklarade krig mot Tyskland den 6 april 1917. Konvojer, som infördes från sommaren, minskade förlusterna kraftigt.
