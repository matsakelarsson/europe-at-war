After the assassination of Archduke Franz Ferdinand in Sarajevo, Austria-Hungary declared war on Serbia on 28 July 1914. Russia mobilised in support of Serbia, and Germany declared war on Russia on 1 August and on France two days later. To help France, Russia invaded East Prussia before its mobilisation was complete. General Paul von Rennenkampf’s First Army advanced from the east and won a battle at Gumbinnen on 20 August, while General Alexander Samsonov’s Second Army marched north from Russian Poland.: Efter mordet på ärkehertig Frans Ferdinand i Sarajevo förklarade Österrike-Ungern krig mot Serbien den 28 juli 1914. Ryssland mobiliserade till stöd för Serbien, och Tyskland förklarade krig mot Ryssland den 1 augusti och mot Frankrike två dagar senare. För att hjälpa Frankrike invaderade Ryssland Ostpreussen innan mobiliseringen var fullbordad. General Paul von Rennenkampfs första armé ryckte fram från öster och vann ett slag vid Gumbinnen den 20 augusti, medan general Aleksandr Samsonovs andra armé marscherade norrut från Ryska Polen.
The new German commanders, Paul von Hindenburg and Erich Ludendorff, moved most of their troops by rail against Samsonov. Russian radio orders sent without code helped them. Near Tannenberg on 26–30 August the Second Army was surrounded and destroyed; some 90,000 Russians were captured, and Samsonov shot himself. In September the Germans turned on Rennenkampf at the Masurian Lakes and drove him out of East Prussia with heavy losses. Hundreds of thousands of East Prussians had fled from the invasion.: De nya tyska befälhavarna, Paul von Hindenburg och Erich Ludendorff, förde huvuddelen av sina trupper med järnväg mot Samsonov. Ryska radioorder som sändes okodade hjälpte dem. Nära Tannenberg den 26–30 augusti omringades och förintades andra armén; omkring 90 000 ryssar togs till fånga, och Samsonov sköt sig. I september vände sig tyskarna mot Rennenkampf vid Masuriska sjöarna och drev honom ut ur Ostpreussen med svåra förluster. Hundratusentals ostpreussare hade flytt undan invasionen.
