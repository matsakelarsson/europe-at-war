Hunger, war-weariness and the losses at the front led to strikes and mutinies in Petrograd in March 1917, and on 15 March Nicholas II abdicated. The Provisional Government kept Russia in the war. On 1 July its war minister, Alexander Kerensky, launched an offensive in Galicia. General Lavr Kornilov’s Eighth Army broke through and took Kalush and Halych, but many units refused to fight on, and a German counter-attack from 19 July drove the Russians out of nearly all of eastern Galicia and Bukovina.: Svält, krigströtthet och förlusterna vid fronten ledde till strejker och myterier i Petrograd i mars 1917, och den 15 mars abdikerade Nikolaj II. Den provisoriska regeringen höll kvar Ryssland i kriget. Den 1 juli inledde dess krigsminister Aleksandr Kerenskij en offensiv i Galizien. General Lavr Kornilovs åttonde armé bröt igenom och tog Kalusj och Halytj, men många förband vägrade att strida vidare, och ett tyskt motanfall från den 19 juli drev ut ryssarna ur nästan hela östra Galizien och Bukovina.
On 1 September the German Eighth Army crossed the Daugava at Ikšķile using new infiltration tactics, and on 3 September it entered Riga; most of the Russian army escaped. In October German landings took the islands of Saaremaa, Muhu and Hiiumaa. On 7 November the Bolsheviks seized power in Petrograd and called for an immediate peace. Fighting stopped with a ceasefire, and an armistice was signed at Brest-Litovsk on 15 December.: Den 1 september gick den tyska åttonde armén över Daugava vid Ikšķile med hjälp av ny infiltrationstaktik, och den 3 september gick den in i Riga; huvuddelen av den ryska armén kom undan. I oktober tog tyska landstigningar öarna Saaremaa, Muhu och Hiiumaa. Den 7 november tog bolsjevikerna makten i Petrograd och krävde omedelbar fred. Striderna upphörde genom en eldupphör, och ett vapenstillestånd undertecknades i Brest-Litovsk den 15 december.
