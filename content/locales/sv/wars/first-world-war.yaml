The peace conference opened in Paris on 18 January 1919. It was dominated by the leaders of France, Britain, the United States and Italy, Georges Clemenceau, David Lloyd George, Woodrow Wilson and Vittorio Emanuele Orlando, and the defeated powers were not invited to negotiate. Germany received the terms in May and, after bitter protests and a change of government, signed the Treaty of Versailles in the Hall of Mirrors on 28 June 1919, five years to the day after the assassination in Sarajevo. It came into force on 10 January 1920, the day the League of Nations was founded.: Fredskonferensen öppnades i Paris den 18 januari 1919. Den dominerades av ledarna för Frankrike, Storbritannien, USA och Italien, Georges Clemenceau, David Lloyd George, Woodrow Wilson och Vittorio Emanuele Orlando, och de besegrade makterna inbjöds inte att förhandla. Tyskland fick villkoren i maj och undertecknade, efter bittra protester och ett regeringsskifte, Versaillesfreden i Spegelsalen den 28 juni 1919, på dagen fem år efter mordet i Sarajevo. Den trädde i kraft den 10 januari 1920, samma dag som Nationernas förbund grundades.
Germany lost about 13 per cent of its European territory and a tenth of its population. Alsace-Lorraine returned to France. Poland received most of Posen and West Prussia, giving it a corridor to the sea; Danzig became a free city, the Memel territory was placed under the Allies, and the Saar was put under the League of Nations for fifteen years, with its coal mines given to France. Plebiscites gave northern Schleswig to Denmark in 1920 and divided Upper Silesia in 1921, and Eupen-Malmedy passed to Belgium.: Tyskland förlorade omkring 13 procent av sitt europeiska territorium och en tiondel av sin befolkning. Elsass-Lothringen återgick till Frankrike. Polen fick större delen av Posen och Västpreussen, vilket gav landet en korridor till havet; Danzig blev en fri stad, Memelområdet ställdes under de allierade och Saar ställdes under Nationernas förbund i femton år, med kolgruvorna överlämnade till Frankrike. Folkomröstningar gav Nordslesvig till Danmark 1920 och delade Övre Schlesien 1921, och Eupen-Malmedy övergick till Belgien.
Germany’s army was limited to 100,000 men, without tanks, military aircraft or submarines. The Rhineland was occupied by Allied troops for up to fifteen years and was to remain demilitarised, and Article 231 made Germany accept responsibility for the loss and damage caused by the war, the basis for reparations, set in 1921 at 132 billion gold marks. Most Germans saw the treaty as a dictated peace. Separate treaties with Austria (Saint-Germain), Bulgaria (Neuilly), Hungary (Trianon) and the Ottoman Empire (Sèvres, later replaced by Lausanne) redrew the map of central and south-eastern Europe.: Tysklands armé begränsades till 100 000 man, utan stridsvagnar, militära flygplan eller ubåtar. Rhenlandet ockuperades av allierade trupper i upp till femton år och skulle förbli demilitariserat, och artikel 231 tvingade Tyskland att ta på sig ansvaret för de förluster och skador som kriget orsakat, grunden för krigsskadeståndet, som 1921 fastställdes till 132 miljarder guldmark. De flesta tyskar såg fördraget som en diktatfred. Separata fördrag med Österrike (Saint-Germain), Bulgarien (Neuilly), Ungern (Trianon) och Osmanska riket (Sèvres, senare ersatt av Lausanne) ritade om kartan över Central- och Sydösteuropa.
