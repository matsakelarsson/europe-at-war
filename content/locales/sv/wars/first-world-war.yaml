In Galicia the Austro-Hungarian army attacked into Russian Poland and won early battles at Kraśnik and Komarów, but the Russians broke its eastern wing and took Lemberg on 3 September 1914. Austria-Hungary lost perhaps 400,000 men killed, wounded or captured in the first weeks and fell back to the Carpathians, leaving the fortress of Przemyśl besieged. In the autumn German and Austro-Hungarian offensives towards Warsaw and around Łódź were held, and the front in Poland settled along the Bzura and the Rawka.: I Galizien anföll den österrikisk-ungerska armén in i Ryska Polen och vann tidiga slag vid Kraśnik och Komarów, men ryssarna bröt dess östra flygel och tog Lemberg den 3 september 1914. Österrike-Ungern förlorade kanske 400 000 man i stupade, sårade eller tillfångatagna under de första veckorna och föll tillbaka till Karpaterna och lämnade fästningen Przemyśl belägrad. Under hösten hejdades tyska och österrikisk-ungerska offensiver mot Warszawa och kring Łódź, och fronten i Polen stabiliserades längs Bzura och Rawka.
Through the winter the Austro-Hungarians tried to relieve Przemyśl by attacking over the Carpathian passes in snow and ice, and lost hundreds of thousands of men. On 22 March 1915 the starving garrison destroyed its guns and surrendered, and some 120,000 men went into captivity. In occupied Galicia the Russian authorities treated the land as a future part of Russia, pressed the Greek Catholic church and deported many Jews and Ukrainian activists; Jews also suffered pogroms by Russian troops.: Under vintern försökte österrikarna och ungrarna undsätta Przemyśl genom anfall över Karpaternas pass i snö och is och förlorade hundratusentals man. Den 22 mars 1915 förstörde den svältande garnisonen sina kanoner och kapitulerade, och omkring 120 000 man gick i fångenskap. I det ockuperade Galizien behandlade de ryska myndigheterna landet som en framtida del av Ryssland, satte press på den grekisk-katolska kyrkan och deporterade många judar och ukrainska aktivister; judarna utsattes också för pogromer av ryska trupper.
