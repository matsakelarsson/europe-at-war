Romania stayed neutral in 1914. Encouraged by the Brusilov offensive and promised Transylvania, Bukovina and the Banat by the Entente, it declared war on Austria-Hungary on 27 August 1916 and sent its armies over the Carpathians into Transylvania. The Central Powers answered quickly. Field Marshal August von Mackensen’s German, Bulgarian and Ottoman army invaded Dobruja from the south and stormed the Danube fortress of Turtucaia on 6 September, while Erich von Falkenhayn’s Ninth Army drove the Romanians out of Transylvania at Sibiu and Brașov. In November Falkenhayn forced the mountain passes and Mackensen crossed the Danube at Svishtov, and on 6 December, after a battle on the Argeș, they entered Bucharest.: Rumänien förblev neutralt 1914. Uppmuntrat av Brusilovoffensiven och med löfte från ententen om Transsylvanien, Bukovina och Banatet förklarade det krig mot Österrike-Ungern den 27 augusti 1916 och sände sina arméer över Karpaterna in i Transsylvanien. Centralmakterna svarade snabbt. Fältmarskalk August von Mackensens tyska, bulgariska och osmanska armé invaderade Dobrudzja från söder och stormade Donaufästningen Turtucaia den 6 september, medan Erich von Falkenhayns nionde armé drev ut rumänerna ur Transsylvanien vid Sibiu och Brașov. I november forcerade Falkenhayn bergspassen och Mackensen gick över Donau vid Svisjtov, och den 6 december, efter ett slag vid Argeș, gick de in i Bukarest.
The king, the government and the remains of the army withdrew to Moldavia, where typhus and hunger killed many soldiers and refugees that winter, and with Russian help held a front along the Carpathians and the Siret. Rebuilt with French help, the army won at Mărăști in July 1917 and in August stopped Mackensen’s offensive at Mărășești. But Russia’s collapse left Romania alone, and it signed an armistice at Focșani on 9 December 1917. In April 1918 Bessarabia’s assembly voted to join Romania, and on 7 May Romania accepted the Treaty of Bucharest, which gave Dobruja to Bulgaria and the Central Powers, the mountain passes to Austria-Hungary and its oil to Germany on a 90-year lease. King Ferdinand refused to sign it, and Romania re-entered the war on 10 November 1918.: Kungen, regeringen och resterna av armén drog sig tillbaka till Moldavien, där tyfus och svält dödade många soldater och flyktingar den vintern, och höll med rysk hjälp en front längs Karpaterna och Siret. Armén byggdes upp på nytt med fransk hjälp, segrade vid Mărăști i juli 1917 och hejdade i augusti Mackensens offensiv vid Mărășești. Men Rysslands sammanbrott lämnade Rumänien ensamt, och det undertecknade ett vapenstillestånd i Focșani den 9 december 1917. I april 1918 röstade Bessarabiens församling för anslutning till Rumänien, och den 7 maj godtog Rumänien freden i Bukarest, som gav Dobrudzja till Bulgarien och centralmakterna, bergspassen till Österrike-Ungern och landets olja till Tyskland på ett 90-årigt arrende. Kung Ferdinand vägrade att underteckna den, och Rumänien gick åter in i kriget den 10 november 1918.
