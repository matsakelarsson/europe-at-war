On the night of 24 April 1915 the Ottoman authorities arrested about 235–270 Armenian intellectuals and community leaders in Constantinople; most were later deported and killed. The ruling Committee of Union and Progress, which blamed the Armenians for the defeat at Sarikamish and feared they would side with Russia, then turned on the whole Armenian population of Anatolia. Armenian soldiers had already been disarmed and put into labour battalions, where many were killed. From late May, under a deportation law, Armenians were driven from their towns and villages towards the Syrian desert. Men were often shot soon after leaving; women, children and old people were marched for weeks, robbed, raped and attacked by gendarmes, irregulars and the paramilitary Special Organisation, and many died of hunger and exhaustion or were abducted.: Natten till den 24 april 1915 grep de osmanska myndigheterna omkring 235–270 armeniska intellektuella och samhällsledare i Konstantinopel; de flesta deporterades senare och dödades. Det styrande partiet Kommittén för enhet och framsteg, som gav armenierna skulden för nederlaget vid Sarıkamış och fruktade att de skulle ställa sig på Rysslands sida, vände sig därefter mot hela den armeniska befolkningen i Anatolien. Armeniska soldater hade redan avväpnats och placerats i arbetsbataljoner, där många dödades. Från slutet av maj drevs armenier med stöd av en deportationslag från sina städer och byar mot den syriska öknen. Männen sköts ofta strax efter avfärden; kvinnor, barn och gamla tvingades marschera i veckor, blev rånade, våldtagna och angripna av gendarmer, irreguljära styrkor och den paramilitära Specialorganisationen, och många dog av svält och utmattning eller fördes bort.
Survivors were held in camps along the Euphrates and around Deir ez-Zor, where most were killed in a second wave of massacres in 1916. Estimates of the Armenian dead range from about 600,000 to 1.5 million, with around one million most often cited; Assyrian and Greek Christians were also killed and deported in large numbers. Some Armenians resisted, at Van and on Musa Dagh, and some Muslim officials and families sheltered them. After the war an Ottoman court-martial sentenced the regime’s leaders to death in their absence. Most genocide scholars and 36 states, among them Germany, France and the United States, recognise the killings as genocide. Turkey accepts that many Armenians died but rejects the term, attributing the deaths to war, disease, relocation and intercommunal fighting.: De överlevande hölls i läger längs Eufrat och kring Deir ez-Zor, där de flesta dödades i en andra våg av massakrer 1916. Uppskattningarna av antalet döda armenier sträcker sig från omkring 600 000 till 1,5 miljoner, med omkring en miljon som den oftast angivna siffran; även assyriska och grekiska kristna dödades och deporterades i stort antal. En del armenier gjorde motstånd, i Van och på Musa Dagh, och en del muslimska ämbetsmän och familjer gav dem skydd. Efter kriget dömde en osmansk krigsrätt regimens ledare till döden i deras frånvaro. De flesta folkmordsforskare och 36 stater, bland dem Tyskland, Frankrike och USA, erkänner dödandet som folkmord. Turkiet medger att många armenier dog men avvisar begreppet och tillskriver dödsfallen kriget, sjukdomar, förflyttningar och strider mellan folkgrupperna.
