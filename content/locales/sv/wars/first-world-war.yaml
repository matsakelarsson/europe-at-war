"The steps follow all the main fronts in date order: the Western Front and the war at sea, the Eastern and Caucasus fronts, Serbia and Salonika, Gallipoli, Italy, Romania, and Mesopotamia and Palestine. Each step is tagged with the countries it involves, so a country view shows only its own fronts.": "Stegen följer alla de viktigaste fronterna i datumordning: västfronten och kriget till sjöss, öst- och Kaukasusfronterna, Serbien och Saloniki, Gallipoli, Italien, Rumänien samt Mesopotamien och Palestina. Varje steg är märkt med de länder det berör, så att en landvy bara visar landets egna fronter."
Dates are New Style (Gregorian). Russia used the Julian calendar, 13 days behind, until February 1918, so its revolutions of 1917 are named after February and October although they took place in March and November by the Western calendar. Serbia, Montenegro, Romania and Greece also used the Julian calendar throughout the war, and Bulgaria until 1916; the Ottoman Empire used its own Rumi calendar.: Datumen följer den nya stilen (gregorianska kalendern). Ryssland använde den julianska kalendern, 13 dagar efter, fram till februari 1918, och därför är dess revolutioner 1917 uppkallade efter februari och oktober, trots att de ägde rum i mars och november enligt västerländsk kalender. Serbien, Montenegro, Rumänien och Grekland använde också den julianska kalendern under hela kriget, och Bulgarien fram till 1916; Osmanska riket använde sin egen rumikalender.
Numbers of dead, prisoners and refugees are estimates and vary widely between sources. Most genocide scholars and many states recognise the killing of the Armenians in 1915–1916 as genocide; the Turkish government rejects the term.: Antalet döda, fångar och flyktingar är uppskattningar och varierar kraftigt mellan källorna. De flesta folkmordsforskare och många stater erkänner dödandet av armenierna 1915–1916 som folkmord; den turkiska regeringen avvisar begreppet.
On the Western Front, places in Flanders are named in the forms used in most English accounts of the war, such as Ypres (Ieper), Passchendaele (Passendale) and Messines (Mesen).: På västfronten anges orter i Flandern med de namnformer som används i de flesta engelskspråkiga skildringar av kriget, till exempel Ypres (Ieper), Passchendaele (Passendale) och Messines (Mesen).
"In the south and east, places are named as in most English accounts, with today’s names where they differ: Salonika is Thessaloniki, Monastir is Bitola, Caporetto is Kobarid, Turtucaia is Tutrakan and Constantinople is Istanbul.": "I söder och öster anges orter som i de flesta engelskspråkiga skildringar, med dagens namn där de skiljer sig: Saloniki är Thessaloniki, Monastir är Bitola, Caporetto är Kobarid, Turtucaia är Tutrakan och Konstantinopel är Istanbul."
The base map shows the borders recognised at the time. Occupied territory and the front lines are drawn as approximate areas from general accounts.: Bakgrundskartan visar de gränser som var erkända vid tiden. Ockuperade områden och frontlinjer är ritade som ungefärliga områden utifrån översiktliga skildringar.
