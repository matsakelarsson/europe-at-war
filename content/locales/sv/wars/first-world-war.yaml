Falkenhayn chose to attack at Verdun, a fortress city in a salient of the French line that he believed France would defend at any cost. He later wrote that he had meant to bleed the French army white; historians still debate whether that was his plan from the start. On 21 February 1916, after a bombardment by some 1,200 guns, the German Fifth Army under Crown Prince Wilhelm attacked on the right bank of the Meuse. Fort Douaumont, the largest of the forts and almost unmanned, fell on 25 February.: Falkenhayn valde att anfalla vid Verdun, en fästningsstad i en utbuktning av den franska linjen som han trodde att Frankrike skulle försvara till varje pris. Han skrev senare att han hade velat förblöda den franska armén; historikerna diskuterar fortfarande om det var hans plan från början. Den 21 februari 1916, efter en beskjutning med omkring 1 200 kanoner, anföll den tyska femte armén under kronprins Wilhelm på Maas högra strand. Fort Douaumont, det största av forten och nästan obemannat, föll den 25 februari.
General Philippe Pétain took over the defence. He rotated divisions through the battle and kept a single road from Bar-le-Duc, later called the Voie Sacrée, open for thousands of lorries a day. The Germans extended their attack to the left bank, where Le Mort Homme and Hill 304 were fought over for months, took Fort Vaux on 7 June and Fleury on 23 June, but were stopped short of Fort Souville in July. From October French counter-attacks retook Douaumont and Vaux, and by 18 December much of the lost ground on the right bank. About three-quarters of the French army passed through Verdun.: General Philippe Pétain tog över försvaret. Han lät divisionerna rotera genom slaget och höll en enda väg från Bar-le-Duc, senare kallad Voie Sacrée, öppen för tusentals lastbilar om dagen. Tyskarna utvidgade anfallet till vänstra stranden, där man stred om Le Mort Homme och Höjd 304 i månader, tog Fort Vaux den 7 juni och Fleury den 23 juni, men hejdades före Fort Souville i juli. Från oktober återtog franska motanfall Douaumont och Vaux, och till den 18 december en stor del av den förlorade marken på högra stranden. Omkring tre fjärdedelar av den franska armén passerade genom Verdun.
