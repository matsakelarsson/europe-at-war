Italy, allied with Germany and Austria-Hungary before the war, stayed neutral in 1914. By the secret Treaty of London of 26 April 1915 Britain, France and Russia promised it Trentino, South Tyrol up to the Brenner, Trieste, Istria and much of Dalmatia, and on 23 May Italy declared war on Austria-Hungary. Its chief of staff, General Luigi Cadorna, attacked eastwards across the Isonzo towards Gorizia and Trieste. The Austro-Hungarians held the mountains and the bare limestone plateau of the Karst, and in four battles in 1915 the Italians gained little ground at a heavy cost.: Italien, som före kriget var allierat med Tyskland och Österrike-Ungern, förblev neutralt 1914. Genom det hemliga Londonfördraget den 26 april 1915 lovade Storbritannien, Frankrike och Ryssland Italien Trentino, Sydtyrolen upp till Brenner, Trieste, Istrien och stora delar av Dalmatien, och den 23 maj förklarade Italien krig mot Österrike-Ungern. Dess generalstabschef, general Luigi Cadorna, anföll österut över Isonzo mot Gorizia och Trieste. Österrikarna och ungrarna höll bergen och Karsts kala kalkstensplatå, och i fyra slag 1915 vann italienarna föga terräng till ett högt pris.
In May 1916 the Austro-Hungarian chief of staff, Franz Conrad von Hötzendorf, struck from Trentino across the Asiago plateau to cut off the Italian armies in the east. His offensive took Asiago by 28 May, but Italian reserves stopped it short of the plain, and the Russian Brusilov offensive forced him to send troops east. In August the Italians took Gorizia in the sixth battle of the Isonzo, and Italy declared war on Germany. Five more battles followed; in the eleventh, in August and September 1917, the Italians took most of the Bainsizza plateau. The battles had cost hundreds of thousands of lives on each side, and the Austro-Hungarian army was near breaking point.: I maj 1916 slog den österrikisk-ungerske generalstabschefen Franz Conrad von Hötzendorf till från Trentino över Asiagoplatån för att skära av de italienska arméerna i öster. Hans offensiv tog Asiago den 28 maj, men italienska reserver stoppade den innan den nått slätten, och den ryska Brusilovoffensiven tvingade honom att sända trupper österut. I augusti tog italienarna Gorizia i det sjätte slaget vid Isonzo, och Italien förklarade krig mot Tyskland. Ytterligare fem slag följde; i det elfte, i augusti och september 1917, tog italienarna större delen av Bainsizzaplatån. Slagen hade kostat hundratusentals liv på vardera sidan, och den österrikisk-ungerska armén var nära bristningsgränsen.
