First World War: Första världskriget
A world war fought from 1914 to 1918 between the Entente powers, among them France, Britain, Russia, Italy and later the United States, and the Central Powers, Germany, Austria-Hungary, the Ottoman Empire and Bulgaria. It killed some nine to ten million soldiers and millions of civilians, and brought down the Russian, German, Austro-Hungarian and Ottoman empires. In the west the German invasion of Belgium and France was stopped on the Marne in 1914, and four years of trench warfare followed, at Ypres, Verdun, the Somme and Passchendaele, until the Allied offensives of 1918 forced Germany to sign the armistice of 11 November. The Treaty of Versailles and the other Paris peace treaties of 1919–1920 redrew the map of Europe.: Ett världskrig som utkämpades 1914–1918 mellan ententemakterna, bland dem Frankrike, Storbritannien, Ryssland, Italien och senare USA, och centralmakterna Tyskland, Österrike-Ungern, Osmanska riket och Bulgarien. Det dödade omkring nio till tio miljoner soldater och miljontals civila och fällde det ryska, det tyska, det österrikisk-ungerska och det osmanska riket. I väster hejdades den tyska invasionen av Belgien och Frankrike vid Marne 1914, och fyra års skyttegravskrig följde, vid Ypres, Verdun, Somme och Passchendaele, tills de allierades offensiver 1918 tvingade Tyskland att underteckna vapenstilleståndet den 11 november. Versaillesfreden och de andra fredsfördragen i Paris 1919–1920 ritade om Europas karta.
