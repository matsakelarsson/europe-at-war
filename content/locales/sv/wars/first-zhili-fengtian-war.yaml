# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
First Zhili–Fengtian War: Första Zhili–Fengtian-kriget
? A war for control of the Beijing government between the Zhili clique of Cao Kun and Wu Peifu and the Fengtian clique of Zhang Zuolin, the former allies of 1920. Their quarrel came to a head when Zhang had his candidate, Liang Shiyi, made premier in December 1921 and Wu forced him out. Each side brought about 100,000–120,000 men into Zhili (today Hebei), and fighting began at the end of April 1922. On the western front, along the railway south-west of Beijing at Changxindian and Liulihe, Wu Peifu ambushed and outflanked the Fengtian army and broke it in early May; on the eastern front, near Machang and Junliangcheng south and east of Tianjin, Zhili reinforcements arriving by rail defeated the Fengtian reserves. The Fengtian army lost about 20,000 dead and 40,000 captured or surrendered, and Zhang withdrew beyond the Shanhai Pass, which became the line between the two cliques. A British consul arranged talks, and peace was signed on 18 June aboard a British warship off Qinhuangdao. Zhang went on to govern the three north-eastern provinces independently of Beijing and to rebuild his army, while the Zhili clique dominated the Beijing government until 1924.
: Ett krig om kontrollen över regeringen i Peking mellan Cao Kuns och Wu Peifus Zhiliklick och Zhang Zuolins Fengtianklick, de forna bundsförvanterna från 1920. Deras konflikt ställdes på sin spets när Zhang fick sin kandidat, Liang Shiyi, utnämnd till premiärminister i december 1921 och Wu tvingade bort honom. Vardera sidan förde omkring 100 000–120 000 man till Zhili (dagens Hebei), och striderna började i slutet av april 1922. På västfronten, längs järnvägen sydväst om Peking vid Changxindian och Liulihe, överföll Wu Peifu Fengtianarmén från bakhåll, kringgick den och krossade den i början av maj; på östfronten, nära Machang och Junliangcheng söder och öster om Tianjin, besegrade Zhiliförstärkningar som anlände med järnväg Fengtianreserverna. Fengtianarmén förlorade omkring 20 000 döda och 40 000 tillfångatagna eller kapitulerade, och Zhang drog sig tillbaka bortom Shanhaipasset, som blev gränslinjen mellan de två klickerna. En brittisk konsul ordnade förhandlingar, och fred slöts den 18 juni ombord på ett brittiskt krigsfartyg utanför Qinhuangdao. Zhang styrde därefter de tre nordöstra provinserna oberoende av Peking och byggde upp sin armé på nytt, medan Zhiliklicken dominerade Pekingregeringen fram till 1924.
