# Svenska översättningar av katalogtexten (våg 8); stegtexterna kommer senare.
Firuz Shah Tughlaq’s Bengal campaigns: Firuz Shah Tughlaqs fälttåg mot Bengalen
Two attempts by Firuz Shah Tughlaq, sultan of Delhi, to win back Bengal, which had broken away under Muhammad bin Tughluq and been united in 1352 by Shamsuddin Ilyas Shah, who had also raided Nepal and Odisha. In November 1353 Firuz marched east with a large army, occupied Ilyas’s capital Pandua and besieged him in Ekdala, a mud fort ringed by rivers and marshes. After about two months, and a battle in which the Bengal army, pursuing a feigned retreat, suffered heavy losses, Firuz withdrew before the rains in 1354 without taking the fort. In 1358–1359, after Ilyas’s death, he marched again, founding the city of Jaunpur on the way, and besieged Ilyas’s son Sikandar Shah in Ekdala. Again the fort held, and a peace was made with an exchange of gifts. Bengal remained an independent sultanate, ruled from Pandua and later Gaur, until the 16th century.: Två försök av Firuz Shah Tughlaq, sultan av Delhi, att vinna tillbaka Bengalen, som hade brutit sig loss under Muhammad bin Tughluq och 1352 enats av Shamsuddin Ilyas Shah, som också hade företagit plundringståg mot Nepal och Odisha. I november 1353 marscherade Firuz österut med en stor armé, besatte Ilyas Shahs huvudstad Pandua och belägrade honom i Ekdala, ett lerfort omgivet av floder och träsk. Efter omkring två månader, och ett slag där den bengaliska armén led svåra förluster när den förföljde en fingerad reträtt, drog sig Firuz tillbaka före regntiden 1354 utan att ha intagit fortet. Åren 1358–1359, efter Ilyas Shahs död, marscherade han på nytt, grundade staden Jaunpur på vägen och belägrade Ilyas Shahs son Sikandar Shah i Ekdala. Återigen höll fortet, och fred slöts med ett utbyte av gåvor. Bengalen förblev ett självständigt sultanat, styrt från Pandua och senare Gaur, fram till 1500-talet.
