Fitna of al-Andalus: Fitnan i al-Andalus
The civil war that destroyed the caliphate of Córdoba. A coup against Almanzor’s son in 1009 set the people of Córdoba, the Berber troops and the Slav generals against each other, with Castilian and Catalan armies hired by rival caliphs; Córdoba and the palace city of Madinat al-Zahra were sacked, and after two decades in which Umayyad and Hammudid caliphs came and went, the caliphate was abolished in 1031 and al-Andalus broke up into taifa kingdoms.: Inbördeskriget som krossade kalifatet Córdoba. En kupp mot Almansors son 1009 ställde Córdobas invånare, de berberiska trupperna och de slaviska generalerna mot varandra, med kastilianska och katalanska härar som anlitades av rivaliserande kalifer; Córdoba och palatsstaden Madinat al-Zahra plundrades, och efter två decennier då umayyadiska och hammudidiska kalifer kom och gick avskaffades kalifatet 1031 och al-Andalus splittrades i taifarikena.
