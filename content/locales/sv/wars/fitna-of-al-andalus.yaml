Córdoba: Córdoba
The caliphal capital, perhaps the largest city in western Europe, changed hands four times in four years and was plundered each time, worst of all by the Berbers in 1013.: Kalifatets huvudstad, kanske den största staden i Västeuropa, bytte ägare fyra gånger på fyra år och plundrades varje gång, värst av berberna 1013.
Madinat al-Zahra: Madinat al-Zahra
The Berbers plundered and burned Abd al-Rahman III’s palace city. Its ruins were quarried for building stone for centuries.: Berberna plundrade och brände Abd al-Rahman III:s palatsstad. Ruinerna användes i århundraden som stenbrott för byggnadssten.
Barcelona: Barcelona
Count Ramon Borrell led a Catalan army to Córdoba for al-Mahdi. His brother Ermengol, count of Urgell, was killed in the campaign.: Greve Ramon Borrell förde en katalansk här till Córdoba för al-Mahdis räkning. Hans bror Ermengol, greve av Urgell, dödades under fälttåget.
