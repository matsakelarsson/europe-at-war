Fitna is Arabic for strife or civil war. The sources, written later and mostly by Andalusi authors hostile to the Berbers, disagree on many dates; those given here are the ones most historians accept.: Fitna är arabiska för strid eller inbördeskrig. Källorna, som skrevs senare och mestadels av andalusiska författare fientligt inställda till berberna, är oense om många datum; de som anges här är de som flest historiker godtar.
The Slavs (Saqaliba) were soldiers and officials of European, often slave, origin. The Berbers were North African troops brought over in large numbers by Almanzor.: Slaverna (saqaliba) var soldater och ämbetsmän av europeiskt ursprung, ofta med bakgrund som slavar. Berberna var nordafrikanska trupper som Almansor hade fört över i stort antal.
The war is part of the longer story told in the Reconquista.: Kriget är en del av den längre berättelse som skildras i reconquistan.
