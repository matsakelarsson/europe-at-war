Almanzor’s son Abd al-Malik ruled al-Andalus in the name of the caliph Hisham II until he died in 1008. His brother Abd al-Rahman, nicknamed Sanchuelo, went further and made the childless caliph name him heir, outraging the Umayyad family and the people of Córdoba. While he was campaigning against Castile early in 1009, an Umayyad prince, Muhammad, seized Córdoba, forced Hisham to abdicate and took the title al-Mahdi. Sanchuelo was killed in March, and the palace city of Almanzor’s family, Madinat al-Zahira, was plundered and destroyed.: Almansors son Abd al-Malik styrde al-Andalus i kalifen Hisham II:s namn tills han dog 1008. Hans bror Abd al-Rahman, med öknamnet Sanchuelo, gick längre och fick den barnlöse kalifen att utse honom till arvinge, vilket upprörde umayyadsläkten och Córdobas invånare. Medan han var ute på fälttåg mot Kastilien i början av 1009 tog en umayyadisk prins, Muhammad, makten i Córdoba, tvingade Hisham att abdikera och antog titeln al-Mahdi. Sanchuelo dödades i mars, och Almansors familjs palatsstad Madinat al-Zahira plundrades och förstördes.
The Berber troops whom Almanzor had brought over were hated in the city, and they set up a caliph of their own, another Umayyad, Sulayman. With help from Count Sancho García of Castile they beat al-Mahdi outside Córdoba and took the city that autumn. Al-Mahdi and the Slav general Wadih then hired the counts of Barcelona and Urgell, whose troops helped retake Córdoba in 1010 and plundered it. Al-Mahdi was murdered that July and Hisham II restored, but the Berbers sacked Madinat al-Zahra and blockaded Córdoba until they stormed it in May 1013, killing and plundering. Sulayman was caliph again, and Hisham II disappeared.: De berberiska trupper som Almansor hade fört över var hatade i staden, och de insatte en egen kalif, ännu en umayyad, Sulayman. Med hjälp av greve Sancho García av Kastilien slog de al-Mahdi utanför Córdoba och tog staden samma höst. Al-Mahdi och den slaviske generalen Wadih anlitade då grevarna av Barcelona och Urgell, vars trupper hjälpte till att återta Córdoba 1010 och plundrade staden. Al-Mahdi mördades i juli samma år och Hisham II återinsattes, men berberna plundrade Madinat al-Zahra och blockerade Córdoba tills de stormade staden i maj 1013 under dödande och plundring. Sulayman blev kalif igen, och Hisham II försvann.
