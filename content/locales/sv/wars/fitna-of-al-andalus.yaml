Sulayman and Sancho García, 1009: Sulayman och Sancho García 1009
Sulayman ruled a shrunken realm. Slav generals had taken over the east around Almería, Denia and Valencia, and Berber chiefs held much of the south. In 1016 Ali ibn Hammud, governor of Ceuta and a descendant of the Prophet’s family, claimed that the vanished Hisham II had named him heir, took Córdoba, executed Sulayman and made himself caliph. For fifteen years Hammudids and Umayyads followed one another on the throne, some for only weeks, while real power passed to local rulers.: Sulayman styrde ett krympt rike. Slaviska generaler hade tagit över östra delen kring Almería, Denia och Valencia, och berberhövdingar höll stora delar av södern. År 1016 hävdade Ali ibn Hammud, guvernör i Ceuta och ättling till Profetens familj, att den försvunne Hisham II hade utsett honom till arvinge, tog Córdoba, lät avrätta Sulayman och gjorde sig till kalif. I femton år avlöste hammudider och umayyader varandra på tronen, en del bara i några veckor, medan den verkliga makten gick över till lokala härskare.
On 30 November 1031 the notables of Córdoba deposed the last Umayyad caliph, Hisham III, abolished the caliphate and governed the city as a council. Al-Andalus was left as a patchwork of taifa kingdoms. The Abbadids ruled Seville, the Aftasids Badajoz and the Dhul-Nunids Toledo; Zaragoza went to the Tujibids and then the Hudids, Granada to the Zirid Berbers, and the east to Slav rulers. Their rivalries let the Christian kingdoms demand tribute from them and, in time, conquer them.: Den 30 november 1031 avsatte Córdobas notabiliteter den siste umayyadiske kalifen, Hisham III, avskaffade kalifatet och styrde staden genom ett råd. Al-Andalus lämnades som ett lapptäcke av taifariken. Abbadiderna styrde Sevilla, aftasiderna Badajoz och dhul-nuniderna Toledo; Zaragoza gick till tujibiderna och sedan hudiderna, Granada till de ziridiska berberna och östra delen till slaviska härskare. Deras rivalitet gjorde det möjligt för de kristna rikena att kräva tribut av dem och med tiden erövra dem.
