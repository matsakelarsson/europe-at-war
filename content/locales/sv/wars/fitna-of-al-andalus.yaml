Ali ibn Hammud set out from Ceuta, where he was governor. His brother al-Qasim held Algeciras across the Strait.: Ali ibn Hammud utgick från Ceuta, där han var guvernör. Hans bror al-Qasim höll Algeciras på andra sidan sundet.
Ali ibn Hammud entered the palace and had Sulayman executed. The city deposed its last caliph in 1031.: Ali ibn Hammud gick in i palatset och lät avrätta Sulayman. Staden avsatte sin siste kalif 1031.
