Sancho García of Castile won back the Duero fortresses Almanzor had taken, among them Gormaz, Osma and San Esteban, as the price of his help or his neutrality.: Sancho García av Kastilien vann tillbaka de fästningar vid Duero som Almansor hade tagit, bland dem Gormaz, Osma och San Esteban, som pris för sin hjälp eller sin neutralitet.
