# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
Flower wars: Blomsterkrigen
? "The xochiyaoyotl or “flower wars” fought for some seventy years between the Aztec Triple Alliance and the Nahua city-states of the Puebla–Tlaxcala valley east of the volcanoes: Tlaxcala, Huexotzinco and Cholula, with smaller towns such as Atlixco. The Texcocan chronicler Fernando de Alva Ixtlilxochitl, writing about 1600, says they began after the drought and famine of 1450–1454, when the rulers agreed to fight regular battles so that captives could be sacrificed to the gods. Unlike the empire’s wars of conquest, they were fought by appointment on a chosen field, with equal numbers on each side, mostly nobles, and with hand weapons rather than darts and slings, so that warriors could show their skill and take prisoners; they could be fought at any time of year. Moctezuma II told one of Cortés’s captains, Andrés de Tapia, that the empire could have conquered Tlaxcala but kept the war going to train its warriors and supply captives. Historians disagree on how far to believe this: Ross Hassig sees the flower wars as a cheap way of wearing down enemies too strong to conquer at once while the empire surrounded them, and the Tlaxcalan historian Diego Muñoz Camargo records that the Aztecs besieged Tlaxcalan towns and cut off their trade. Over time the wars became bloodier, the alliance of the valley towns frayed, and in about 1517 Cholula left the Tlaxcalan alliance and went over to the Aztecs. Tlaxcala’s long war with the Triple Alliance made it the Spaniards’ most important ally in 1519."
: "Xochiyaoyotl eller ”blomsterkrigen”, som under omkring sjuttio år utkämpades mellan aztekernas trippelallians och nahuastadsstaterna i Puebla–Tlaxcala-dalen öster om vulkanerna: Tlaxcala, Huexotzinco och Cholula, med mindre städer som Atlixco. Krönikören Fernando de Alva Ixtlilxochitl från Texcoco, som skrev omkring 1600, säger att de började efter torkan och hungersnöden 1450–1454, då härskarna kom överens om att utkämpa regelbundna slag så att fångar kunde offras åt gudarna. Till skillnad från rikets erövringskrig utkämpades de efter överenskommelse på ett utvalt fält, med lika många på varje sida, mest adelsmän, och med handvapen i stället för kastspjut och slungor, så att krigarna kunde visa sin skicklighet och ta fångar; de kunde utkämpas när som helst på året. Moctezuma II sade till en av Cortés kaptener, Andrés de Tapia, att riket hade kunnat erövra Tlaxcala men höll kriget vid liv för att öva sina krigare och skaffa fångar. Historikerna är oeniga om hur mycket av detta man ska tro: Ross Hassig ser blomsterkrigen som ett billigt sätt att nöta ned fiender som var för starka för att erövras på en gång medan riket omringade dem, och den tlaxcaltekiske historikern Diego Muñoz Camargo berättar att aztekerna belägrade tlaxcaltekiska städer och skar av deras handel. Med tiden blev krigen blodigare, alliansen mellan städerna i dalen började lösas upp, och omkring 1517 lämnade Cholula alliansen med Tlaxcala och gick över till aztekerna. Tlaxcalas långa krig mot trippelalliansen gjorde det till spanjorernas viktigaste allierade 1519."
