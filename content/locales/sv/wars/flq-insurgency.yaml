# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
FLQ insurgency and the October Crisis: FLQ:s uppror och oktoberkrisen
? "The bombing and kidnapping campaign of the Front de libération du Québec (FLQ), a clandestine movement of small, loosely linked cells that sought an independent, socialist Quebec by armed struggle, and the October Crisis of 1970 that ended it. Its first attacks, firebombs against army buildings in Montreal on the night of 7 March 1963, were followed by bombs in mailboxes and at federal buildings; on 20 April 1963 a bomb at an army recruiting centre killed a 65-year-old night watchman, William Vincent O’Neill. Pierre Vallières and Charles Gagnon, whose group joined the FLQ in 1965, gave it its manifesto writings. Over seven years the FLQ was blamed for more than 160 bombings, armed robberies and other attacks, the largest of which, at the Montreal Stock Exchange on 13 February 1969, injured 27 people; in all about eight people were killed. On 5 October 1970 the Liberation cell kidnapped the British trade commissioner, James Cross, in Montreal, and on 10 October the Chénier cell kidnapped Quebec’s labour minister, Pierre Laporte. At the request of the Quebec government and the city of Montreal, the army was sent into Quebec on 15 October, and early on 16 October Pierre Trudeau’s federal government invoked the War Measures Act, the only time it was used in peacetime: civil liberties were suspended and some 450–500 people, among them singers, poets and union leaders, were arrested without charge, nearly all of them later released. Laporte was found dead in the trunk of a car on 17 October. Cross was freed on 3 December 1970 in exchange for safe passage to Cuba for five members of the Liberation cell, and on 28 December police found Paul and Jacques Rose and Francis Simard of the Chénier cell in a farmhouse at Saint-Luc; Paul Rose and Simard were convicted of Laporte’s murder, and Jacques Rose, acquitted of kidnapping and murder, of being an accessory after the fact. The FLQ lost what public sympathy it had and did not act again, and the movement for independence turned to the Parti Québécois, which won the Quebec election of 1976."
: "Den kampanj av bombattentat och kidnappningar som fördes av Front de libération du Québec (FLQ), en hemlig rörelse av små, löst sammanlänkade celler som genom väpnad kamp ville skapa ett självständigt, socialistiskt Québec, och oktoberkrisen 1970 som gjorde slut på den. Rörelsens första attentat, brandbomber mot arméns byggnader i Montréal natten den 7 mars 1963, följdes av bomber i brevlådor och vid federala byggnader; den 20 april 1963 dödade en bomb vid ett av arméns rekryteringskontor en 65-årig nattvakt, William Vincent O’Neill. Pierre Vallières och Charles Gagnon, vars grupp anslöt sig till FLQ 1965, gav rörelsen dess programskrifter. Under sju år fick FLQ skulden för mer än 160 bombattentat, väpnade rån och andra attentat, av vilka det största, mot Montréalbörsen den 13 februari 1969, skadade 27 personer; sammanlagt dödades omkring åtta personer. Den 5 oktober 1970 kidnappade cellen Libération den brittiske handelskommissionären James Cross i Montréal, och den 10 oktober kidnappade cellen Chénier Québecs arbetsminister Pierre Laporte. På begäran av Québecs regering och staden Montréal sändes armén in i Québec den 15 oktober, och tidigt den 16 oktober åberopade Pierre Trudeaus federala regering War Measures Act, den enda gången lagen tillämpades i fredstid: medborgerliga fri- och rättigheter sattes ur kraft, och omkring 450–500 personer, bland dem sångare, poeter och fackföreningsledare, greps utan åtal; nästan alla släpptes senare. Laporte hittades död i bagageutrymmet på en bil den 17 oktober. Cross släpptes den 3 december 1970 i utbyte mot fri lejd till Kuba för fem medlemmar av cellen Libération, och den 28 december fann polisen Paul och Jacques Rose och Francis Simard från cellen Chénier på en bondgård i Saint-Luc; Paul Rose och Simard dömdes för mordet på Laporte, och Jacques Rose, som friades från kidnappning och mord, för medhjälp efter brottet. FLQ förlorade den sympati rörelsen hade haft hos allmänheten och agerade aldrig mer, och självständighetsrörelsen vände sig i stället till Parti Québécois, som vann valet i Québec 1976."
