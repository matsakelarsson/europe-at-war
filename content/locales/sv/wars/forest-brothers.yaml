Tallinn: Tallinn
22 September 1944: 22 september 1944
Taken by the Red Army days after the Germans withdrew; an Estonian government proclaimed in the interval was soon dispersed.: Intogs av Röda armén några dagar efter att tyskarna dragit sig tillbaka; en estnisk regering som utropats under mellantiden skingrades snart.
Riga: Riga
13 October 1944: 13 oktober 1944
The Red Army entered the city, while German forces held out in the Courland Pocket in western Latvia until May 1945.: Röda armén gick in i staden, medan tyska styrkor höll ut i Kurlandfickan i västra Lettland till maj 1945.
2–3 March 1945: 2–3 mars 1945
NKVD troops and a destruction battalion attacked a camp of some 350 partisans in the Stompaki bog. Most broke out in a snowstorm at night, but 28 were killed.: NKVD-trupper och en förintelsebataljon anföll ett läger med omkring 350 partisaner i Stompakimossen. De flesta bröt sig ut under en snöstorm om natten, men 28 dödades.
16 May 1945: 16 maj 1945
Between about 60 and 120 partisans, by different counts, fought a much larger NKVD border regiment in the Kalniškės forest. About 44 were killed and some 20 broke out of the encirclement.: Mellan omkring 60 och 120 partisaner, enligt olika uppgifter, stred mot ett mycket större NKVD-gränsregemente i Kalniškėskogen. Omkring 44 dödades och ett tjugotal bröt sig ut ur inringningen.
Võru County: Võrumaa
The Estonian Forest Brothers were most active here in the south-east and in western Estonia, carrying out hundreds of attacks by 1947.: De estniska skogsbröderna var mest aktiva här i sydost och i västra Estland och genomförde hundratals anfall fram till 1947.
In February 1949 Lithuanian partisan commanders met in a bunker at Minaičiai and united as the Union of Lithuanian Freedom Fighters under Jonas Žemaitis, declaring on 16 February that they were the lawful authority of an independent, democratic Lithuania. Five weeks later, on 25–28 March, Soviet security forces carried out Operation Priboi. More than 90,000 people, about 20,000 from Estonia, 42,000 from Latvia and 29,000–32,000 from Lithuania, were loaded onto freight trains and sent to settlements in Siberia as “kulaks”, “nationalists” and families of “bandits”. Over 70 per cent were women and children under 16.: I februari 1949 möttes litauiska partisanbefälhavare i en bunker i Minaičiai och enades i Litauiska frihetskämparnas förbund under Jonas Žemaitis, och den 16 februari förklarade de att de var den lagliga myndigheten i ett självständigt, demokratiskt Litauen. Fem veckor senare, den 25–28 mars, genomförde sovjetiska säkerhetsstyrkor Operation Priboj. Mer än 90 000 människor, omkring 20 000 från Estland, 42 000 från Lettland och 29 000–32 000 från Litauen, lastades på godståg och sändes till bosättningar i Sibirien som ”kulaker”, ”nationalister” och familjer till ”banditer”. Över 70 procent var kvinnor och barn under 16 år.
The deportations drove the remaining farmers into collective farms and stripped the partisans of food and shelter. Agents planted among them, and the betrayal of British intelligence operations to the Soviets, destroyed many bands. Žemaitis was captured in 1953 and shot in Moscow in 1954, and the partisan commander Adolfas Ramanauskas was arrested in Kaunas in October 1956 and executed the next year. After amnesties following Stalin’s death many survivors gave up, although a few held out for decades. The resistance cost at least 50,000 lives, most of them in Lithuania.: Deportationerna drev de återstående bönderna in i kollektivjordbruk och berövade partisanerna mat och skydd. Agenter som planterats bland dem, och förräderiet som avslöjade brittiska underrättelseoperationer för sovjeterna, förintade många grupper. Žemaitis tillfångatogs 1953 och sköts i Moskva 1954, och partisanbefälhavaren Adolfas Ramanauskas greps i Kaunas i oktober 1956 och avrättades året därpå. Efter amnestierna som följde på Stalins död gav många överlevande upp, även om några höll ut i årtionden. Motståndet kostade minst 50 000 liv, de flesta i Litauen.
