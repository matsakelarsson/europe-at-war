Deportations from Estonia: Deportationer från Estland
About 20,000 people were deported from Estonia, among them families from the islands of Saaremaa and Hiiumaa, taken to the trains by ship.: Omkring 20 000 människor deporterades från Estland, bland dem familjer från öarna Saaremaa och Hiiumaa som fördes till tågen med fartyg.
Deportations from Latvia: Deportationer från Lettland
About 42,000 people, the largest group, were deported from Latvia. By the end of the year 93 per cent of Latvian farms had been collectivised.: Omkring 42 000 människor, den största gruppen, deporterades från Lettland. Vid årets slut hade 93 procent av de lettiska jordbruken kollektiviserats.
Deportations from Lithuania: Deportationer från Litauen
Between 29,000 and 32,000 people were deported from Lithuania, which had already lost about 40,000 people in the deportations of May 1948.: Mellan 29 000 och 32 000 människor deporterades från Litauen, som redan hade förlorat omkring 40 000 människor i deportationerna i maj 1948.
Kaunas: Kaunas
