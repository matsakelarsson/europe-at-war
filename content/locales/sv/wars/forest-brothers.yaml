The Red Army drove the Germans out of most of the Baltic states in 1944, taking Vilnius in July, Tallinn in September and Riga in October, and Soviet rule, first imposed in 1940, returned with arrests and conscription. Tens of thousands of men, and some women, went into the forests. Some were former soldiers of German-raised units, others had fled call-up into the Red Army, and many hoped that the Western Allies, who had never recognised the annexation, would restore independence. Estimates put the armed partisans at about 30,000 in Lithuania at the end of 1945 and some 10,000–15,000 each in Latvia and Estonia.: Röda armén drev ut tyskarna ur större delen av de baltiska staterna 1944 och tog Vilnius i juli, Tallinn i september och Riga i oktober, och det sovjetiska styret, som första gången hade påtvingats 1940, återkom med arresteringar och tvångsrekrytering. Tiotusentals män, och en del kvinnor, gick ut i skogarna. En del var före detta soldater i förband som tyskarna hade satt upp, andra hade flytt undan inkallelse till Röda armén, och många hoppades att västmakterna, som aldrig hade erkänt annekteringen, skulle återupprätta självständigheten. Enligt uppskattningar fanns det i slutet av 1945 omkring 30 000 väpnade partisaner i Litauen och omkring 10 000–15 000 vardera i Lettland och Estland.
The resistance was largest and best organised in Lithuania, where partisan districts held much of the countryside after dark until 1949. They ambushed troops, killed Soviet officials and people they regarded as collaborators, among them civilians, and printed underground newspapers. In the biggest battles partisans fought NKVD regiments from fortified forest camps, as at Stompaki in Latvia in March 1945 and at Kalniškės in southern Lithuania that May. The NKVD and local “destruction battalions” answered with sweeps, informers and reprisals against families, and laid out the bodies of dead partisans in town squares. In May 1948 about 40,000 Lithuanians were deported in Operation Vesna.: Motståndet var störst och bäst organiserat i Litauen, där partisandistrikt behärskade stora delar av landsbygden efter mörkrets inbrott fram till 1949. De lade bakhåll för trupper, dödade sovjetiska tjänstemän och personer som de betraktade som kollaboratörer, bland dem civila, och tryckte illegala tidningar. I de största striderna kämpade partisaner mot NKVD-regementen från befästa skogsläger, som vid Stompaki i Lettland i mars 1945 och vid Kalniškės i södra Litauen i maj samma år. NKVD och lokala ”förintelsebataljoner” svarade med genomsökningar, angivare och repressalier mot familjer, och de lade ut stupade partisaners kroppar på torgen. I maj 1948 deporterades omkring 40 000 litauer i Operation Vesna.
