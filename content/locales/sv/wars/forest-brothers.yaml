Forest Brothers: Skogsbröderna
An armed resistance against Soviet rule in Estonia, Latvia and Lithuania after the Red Army returned in 1944. Tens of thousands of partisans, the “Forest Brothers”, fought from forest bases, strongest in Lithuania, until mass deportations such as Operation Priboi in March 1949, forced collectivisation and infiltration by the security services broke the movement by the mid-1950s.: Ett väpnat motstånd mot sovjetiskt styre i Estland, Lettland och Litauen efter Röda arméns återkomst 1944. Tiotusentals partisaner, ”skogsbröderna”, stred från baser i skogarna, starkast i Litauen, tills massdeportationer som Operation Priboj i mars 1949, tvångskollektivisering och säkerhetstjänsternas infiltration bröt rörelsen vid mitten av 1950-talet.
