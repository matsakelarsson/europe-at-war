Into the forests: Till skogarna
Deportations and defeat: Deportationer och nederlag
The Soviet Union annexed the Baltic states in 1940, and the map shows them as Soviet republics. Most Western states never recognised the annexation.: Sovjetunionen annekterade de baltiska staterna 1940, och kartan visar dem som sovjetrepubliker. De flesta västländer erkände aldrig annekteringen.
Numbers of partisans, dead and deported come from Soviet records and later research, and differ between sources; they are given as estimates.: Antalet partisaner, döda och deporterade kommer från sovjetiska arkiv och senare forskning och skiljer sig mellan källorna; de anges som uppskattningar.
The partisans were called metsavennad in Estonia, mežabrāļi in Latvia and partizanai or žaliukai in Lithuania.: Partisanerna kallades metsavennad i Estland, mežabrāļi i Lettland och partizanai eller žaliukai i Litauen.
