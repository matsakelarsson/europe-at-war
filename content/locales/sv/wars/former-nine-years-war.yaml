# Svenska översättningar av katalogtexten (våg 10); stegtexterna kommer senare.
Former Nine Years’ War: Det tidigare nioårskriget
? "The war in which the governor of Mutsu, Minamoto no Yoriyoshi, destroyed the Abe, a family of Emishi descent who ruled the six districts of the Kitakami basin in northern Honshu almost as an independent power. After the Abe defeated a governor at Onikiribe around 1051, the court sent Yoriyoshi, a warrior of the Kawachi branch of the Minamoto, as governor and later frontier commander. Peace held until 1056, when an attack on his officials at the Akuto River, blamed on Abe no Sadato, led to open war. Abe no Yoritoki was killed in 1057, but his son Sadato routed Yoriyoshi at Kinomi in a snowstorm that winter, and for five years the Abe collected taxes south of their border while the governor could do nothing. In 1062 Yoriyoshi won over the Kiyohara, an Emishi-descended family of Dewa, whose 10,000 men turned the war: within six weeks the allies took the Abe forts one after another, and on the 17th day of the ninth month of 1062 Kuriyagawa, near today’s Morioka, fell to fire. Sadato died of his wounds, and his brother-in-law Fujiwara no Tsunekiyo was beheaded. The Kiyohara inherited the Abe lands, and the victory became a founding legend of the Minamoto warrior house."
: "Kriget där guvernören i Mutsu, Minamoto no Yoriyoshi, krossade Abeklanen, en släkt av emishihärkomst som styrde Kitakamibäckenets sex distrikt i norra Honshu nästan som en självständig makt. Sedan Abeklanen omkring 1051 hade besegrat en guvernör vid Onikiribe sände hovet Yoriyoshi, en krigare ur Minamotoklanens Kawachigren, som guvernör och senare som gränsbefälhavare. Freden höll till 1056, då ett angrepp på hans ämbetsmän vid Akutofloden, som skylldes på Abe no Sadato, ledde till öppet krig. Abe no Yoritoki dödades 1057, men hans son Sadato slog Yoriyoshi på flykten vid Kinomi i en snöstorm samma vinter, och i fem år drev Abeklanen in skatt söder om sin gräns utan att guvernören kunde göra något. År 1062 vann Yoriyoshi över Kiyoharaklanen, en släkt av emishihärkomst i Dewa, vars 10 000 man vände kriget: inom sex veckor intog de allierade Abeklanens fästen ett efter ett, och den 17:e dagen i nionde månaden 1062 föll Kuriyagawa, nära dagens Morioka, sedan det satts i brand. Sadato dog av sina sår, och hans svåger Fujiwara no Tsunekiyo halshöggs. Kiyoharaklanen ärvde Abeklanens landområden, och segern blev en grundlegend för krigarätten Minamoto."
