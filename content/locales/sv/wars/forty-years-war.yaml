# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
Forty Years’ War: Fyrtioårskriget
? "The intermittent war between Ava, the Burmese kingdom of Upper Burma, and Hanthawaddy, the Mon-speaking kingdom of Lower Burma with its capital at Pegu, fought between 1385 and 1423 in four rounds separated by truces. Ava’s kings, who saw themselves as heirs of Pagan, tried to bring the south under their rule; Hanthawaddy’s king Razadarit, who came to the throne in 1384 at sixteen, defended its independence and carried the war up the Irrawaddy. Ava was first invited in by a rebel viceroy in the delta, which Razadarit then conquered (1385–1391). He took his fleet up the Irrawaddy as far as Ava in 1401–1403; the two kingdoms then fought over Arakan, which changed hands several times, while the Ming court and the Shan state of Hsenwi opened a northern front against Ava. Ava’s crown prince Minye Kyawswa overran the delta in 1414–1415 but was killed at Dala in March 1415, and after his death the war lost its force. Both kings died in 1421, and a last campaign ended in 1423 with a marriage of state. Neither side gained lasting territory: Hanthawaddy kept its independence, and Ava’s attempt to restore the realm of Pagan failed."
: "Det periodvisa kriget mellan Ava, det burmesiska kungariket i Övre Burma, och Hanthawaddy, det monspråkiga kungariket i Nedre Burma med huvudstad i Pegu, som utkämpades mellan 1385 och 1423 i fyra omgångar åtskilda av vapenvilor. Avas kungar, som såg sig som Pagans arvtagare, försökte föra södern under sitt välde; Hanthawaddys kung Razadarit, som besteg tronen 1384 vid sexton års ålder, försvarade dess självständighet och förde kriget uppför Irrawaddy. Ava bjöds först in av en upprorisk vicekung i deltat, som Razadarit därefter erövrade (1385–1391). Han förde sin flotta uppför Irrawaddy ända till Ava 1401–1403; de två kungarikena stred sedan om Arakan, som bytte ägare flera gånger, medan Minghovet och shanstaten Hsenwi öppnade en nordlig front mot Ava. Avas kronprins Minye Kyawswa överskred deltat 1414–1415 men stupade vid Dala i mars 1415, och efter hans död förlorade kriget sin kraft. Båda kungarna dog 1421, och ett sista fälttåg slutade 1423 med ett politiskt äktenskap. Ingen av sidorna vann bestående landområden: Hanthawaddy behöll sin självständighet, och Avas försök att återupprätta Pagans rike misslyckades."
