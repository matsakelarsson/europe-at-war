Fourth Anglo-Ashanti War: Fjärde anglo-ashantiska kriget
? The British occupation of Kumasi in 1896 and the exile of the Asantehene, Prempeh I. After the war of 1873–1874 the Asante Empire had lost its southern provinces and gone through years of civil war, but Prempeh, enstooled in 1888, restored much of its unity. Britain, anxious to keep France and Germany out of the interior and its gold and rubber, offered him a protectorate in 1891, which he declined, and pressed for a British resident in Kumasi and payment of the indemnity left from 1874. An Asante embassy led by John Owusu Ansa went to London in 1895 to negotiate but was refused a hearing, and a British expedition under Colonel Sir Francis Scott, with British and West India Regiment troops, Gold Coast Hausa police and a levy raised by Major Robert Baden-Powell, left Cape Coast in December 1895. Prempeh ordered his people not to resist, and Scott entered Kumasi on 17 January 1896 without a shot being fired. On 20 January Prempeh made his formal submission; when he could not pay the indemnity demanded, he was arrested with the queen mother, Yaa Akyaa, and other leading chiefs. They were held at Elmina, then in Sierra Leone, and from 1900 in the Seychelles; Prempeh returned only in 1924. Disease killed some 18 Europeans of the expedition, among them Queen Victoria’s son-in-law Prince Henry of Battenberg. Britain declared a protectorate over Asante, built a fort in Kumasi and stationed a resident there, and four years later its demand for the Golden Stool led to the War of the Golden Stool.
: Den brittiska ockupationen av Kumasi 1896 och förvisningen av asantehene Prempeh I. Efter kriget 1873–1874 hade Ashantiriket förlorat sina sydliga provinser och genomgått flera år av inbördeskrig, men Prempeh, som insattes på stolen 1888, återställde mycket av dess enhet. Storbritannien, som ville hålla Frankrike och Tyskland borta från inlandet och dess guld och gummi, erbjöd honom 1891 ett protektorat, vilket han avböjde, och krävde en brittisk resident i Kumasi och betalning av det skadestånd som återstod sedan 1874. En ashantisk beskickning under John Owusu Ansa reste till London 1895 för att förhandla men nekades företräde, och en brittisk expedition under överste sir Francis Scott, med brittiska trupper och trupper ur West India Regiment, hausapolis från Guldkusten och ett uppbåd som rests av major Robert Baden-Powell, lämnade Cape Coast i december 1895. Prempeh beordrade sitt folk att inte göra motstånd, och Scott tågade in i Kumasi den 17 januari 1896 utan att ett skott avlossades. Den 20 januari underkastade sig Prempeh formellt; när han inte kunde betala det skadestånd som krävdes arresterades han tillsammans med drottningmodern Yaa Akyaa och andra ledande hövdingar. De hölls fångna i Elmina, sedan i Sierra Leone och från 1900 på Seychellerna; Prempeh återvände först 1924. Sjukdomar dödade omkring 18 européer i expeditionen, bland dem drottning Viktorias svärson prins Henrik av Battenberg. Storbritannien utropade ett protektorat över Ashanti, byggde ett fort i Kumasi och stationerade en resident där, och fyra år senare ledde dess krav på Gyllene stolen till kriget om Gyllene stolen.
