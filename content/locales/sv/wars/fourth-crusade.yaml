Fourth Crusade: Fjärde korståget
A crusade called by Pope Innocent III to recover Jerusalem by way of Egypt, which instead sacked the Christian city of Zara in 1202 and, after taking up the cause of the exiled Byzantine prince Alexios Angelos, captured and sacked Constantinople in April 1204. The crusaders and Venice divided the Byzantine Empire among themselves, founding the Latin Empire and Latin lordships in Greece, while Byzantine successor states arose at Nicaea, Trebizond and in Epirus. The Latin emperor Baldwin was captured by the Bulgarians at Adrianople in 1205.: Ett korståg som påven Innocentius III utlyste för att återvinna Jerusalem via Egypten, men som i stället plundrade den kristna staden Zara 1202 och, sedan det tagit sig an den landsflyktige bysantinske prinsen Alexios Angelos sak, intog och plundrade Konstantinopel i april 1204. Korsfararna och Venedig delade Bysantinska riket mellan sig och grundade Latinska kejsardömet och latinska herradömen i Grekland, medan bysantinska efterträdarstater uppstod i Nicaea, Trapezunt och Epirus. Den latinske kejsaren Balduin tillfångatogs av bulgarerna vid Adrianopel 1205.
