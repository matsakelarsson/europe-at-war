In January 1204 a revolt in the city ended the crusaders’ hopes of payment. The courtier Alexios Doukas, known as Mourtzouphlos, seized the throne as Alexios V, had Alexios IV strangled on 8 February (Isaac II had already died) and broke with the Latins. Short of food and camped outside the walls, the crusaders and Venetians decided to take the city for themselves, and their clergy told them the war against the schismatic Greeks was just. In March they agreed how to share the conquest. Six Venetians and six crusaders would elect a Latin emperor, who would have a quarter of the empire, and the rest would be divided equally between Venice and the crusaders.: I januari 1204 gjorde ett uppror i staden slut på korsfararnas förhoppningar om betalning. Hovmannen Alexios Dukas, kallad Murtzuflos, tog tronen som Alexios V, lät strypa Alexios IV den 8 februari (Isak II hade redan dött) och bröt med latinerna. Korsfararna och venetianerna, som led brist på mat och låg i läger utanför murarna, beslöt att ta staden för egen räkning, och deras präster förklarade att kriget mot de schismatiska grekerna var rättfärdigt. I mars kom de överens om hur erövringen skulle delas. Sex venetianer och sex korsfarare skulle välja en latinsk kejsare, som skulle få en fjärdedel av riket, och resten skulle delas lika mellan Venedig och korsfararna.
A first assault from the ships on the Golden Horn on 9 April was driven off. On 12 April the attack was renewed; ships lashed together in pairs reached the towers, and knights forced their way through a walled-up gate. Alexios V fled in the night, and on the morning of 13 April the city lay open. For three days it was sacked. Soldiers killed and raped, churches and monasteries were plundered, and the altar of Hagia Sophia was broken up for its silver, as the historian Niketas Choniates, who fled the city, recorded.: En första stormning från fartygen i Gyllene hornet den 9 april slogs tillbaka. Den 12 april förnyades anfallet; fartyg som surrats ihop parvis nådde tornen, och riddare trängde sig igenom en igenmurad port. Alexios V flydde under natten, och på morgonen den 13 april låg staden öppen. I tre dagar plundrades den. Soldater dödade och våldtog, kyrkor och kloster plundrades, och altaret i Hagia Sofia slogs sönder för silvrets skull, som historikern Niketas Choniates, som flydde från staden, nedtecknade.
Much of the loot was melted down, and relics and treasures went west, among them the four bronze horses now at St Mark’s in Venice. Innocent III, who had forbidden attacks on Christians, condemned the crusaders’ violence, though he accepted the new Latin Church in Constantinople. The sack deepened the hostility between Greek and Latin Christians for centuries; in 2001 and 2004 Pope John Paul II expressed sorrow for it.: En stor del av bytet smältes ned, och reliker och skatter fördes västerut, bland dem de fyra bronshästar som nu finns vid Markuskyrkan i Venedig. Innocentius III, som hade förbjudit angrepp på kristna, fördömde korsfararnas våld, men godtog den nya latinska kyrkan i Konstantinopel. Plundringen fördjupade fiendskapen mellan grekiska och latinska kristna i århundraden; 2001 och 2004 uttryckte påven Johannes Paulus II sorg över den.
