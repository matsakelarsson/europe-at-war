The Greek nobles of Thrace, ill treated by their new lords, rose early in 1205 and called on Kaloyan, ruler of the Bulgarians, whose offers of alliance the Latins had scorned. Baldwin besieged Adrianople, and on 14 April 1205 Kaloyan’s army, with many Cuman horsemen, drew the Latin knights into a reckless pursuit and destroyed them. Louis of Blois was killed and Baldwin taken prisoner; he died in Bulgarian captivity. Dandolo, who helped Villehardouin lead the survivors back, died at Constantinople that summer and was buried in Hagia Sophia.: Thrakiens grekiska adel, som behandlades illa av sina nya herrar, reste sig i början av 1205 och kallade på Kalojan, bulgarernas härskare, vars erbjudanden om förbund latinerna hade försmått. Balduin belägrade Adrianopel, och den 14 april 1205 lockade Kalojans här, med många kumanska ryttare, de latinska riddarna till en vårdslös förföljelse och förintade dem. Ludvig av Blois dödades och Balduin togs till fånga; han dog i bulgarisk fångenskap. Dandolo, som hjälpte Villehardouin att föra de överlevande tillbaka, dog i Konstantinopel samma sommar och begravdes i Hagia Sofia.
Baldwin’s brother Henry, crowned in 1206, steadied the Latin Empire, but it remained weak, squeezed between the Bulgarians and the Greeks of Nicaea, until the Byzantines recovered Constantinople in 1261. The crusade never reached the Holy Land. Venice gained an empire of ports and islands in the Aegean that lasted for centuries, and Latin lordships in Greece outlived the Latin Empire by many years. The restored Byzantine Empire never regained its former strength, which, many historians argue, eased the Ottoman conquest of the Balkans.: Balduins bror Henrik, krönt 1206, stabiliserade Latinska kejsardömet, men det förblev svagt, inklämt mellan bulgarerna och grekerna i Nicaea, tills bysantinerna återtog Konstantinopel 1261. Korståget nådde aldrig det heliga landet. Venedig vann ett välde av hamnar och öar i Egeiska havet som bestod i århundraden, och latinska herradömen i Grekland överlevde Latinska kejsardömet med många år. Det återupprättade Bysantinska riket återfick aldrig sin forna styrka, vilket enligt många historiker underlättade osmanernas erövring av Balkan.
