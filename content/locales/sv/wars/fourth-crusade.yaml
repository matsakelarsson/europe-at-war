The citizens hung crosses on the walls to remind the besiegers that they too were Christians. The city surrendered after two weeks and was sacked and divided between the Venetians and the crusaders.: Invånarna hängde kors på murarna för att påminna belägrarna om att även de var kristna. Staden kapitulerade efter två veckor och plundrades och delades mellan venetianerna och korsfararna.
Crusader fleet: Korsfararflottan
The fleet called at Durazzo and Corfu, sailed up the Dardanelles and on 24 June 1203 anchored off Constantinople, the largest city in Christendom. The crusaders camped on the Asian shore, then on 5 July landed at Galata across the Golden Horn, took the tower that held the chain across the harbour and let the Venetian ships into the Horn. The city’s people showed no wish to welcome the young Alexios. On 17 July the crusaders attacked; the French assault near the Blachernae palace was beaten back by the Varangian Guard, but the Venetians, with the doge at their head, seized some 25 towers of the sea walls and set fire to the houses behind.: Flottan anlöpte Durazzo och Korfu, seglade uppför Dardanellerna och ankrade den 24 juni 1203 utanför Konstantinopel, kristenhetens största stad. Korsfararna slog läger på den asiatiska stranden och landsteg sedan den 5 juli i Galata på andra sidan Gyllene hornet, tog tornet som höll kedjan tvärs över hamnen och släppte in de venetianska fartygen i Gyllene hornet. Stadens invånare visade ingen vilja att välkomna den unge Alexios. Den 17 juli anföll korsfararna; den franska stormningen nära Blachernaipalatset slogs tillbaka av väringagardet, men venetianerna, med dogen i spetsen, erövrade omkring 25 torn i sjömuren och satte eld på husen bakom.
Alexios III led his army out but would not fight, and that night he fled with his treasure. The courtiers restored the blind Isaac II, and on 1 August his son was crowned co-emperor as Alexios IV. He paid part of what he had promised but could not raise the rest, and his efforts to bring the Church under Rome angered his subjects. In August a group of crusaders attacked a mosque in the city; the fire they started burned for days and destroyed a large part of Constantinople, and relations between the Latins and the citizens went from bad to worse.: Alexios III förde ut sin här men ville inte strida, och samma natt flydde han med sin skatt. Hovmännen återinsatte den blinde Isak II, och den 1 augusti kröntes hans son till medkejsare som Alexios IV. Han betalade en del av det han hade lovat men kunde inte skaffa fram resten, och hans försök att ställa kyrkan under Rom väckte hans undersåtars vrede. I augusti angrep en grupp korsfarare en moské i staden; branden de anlade rasade i flera dagar och förstörde en stor del av Konstantinopel, och förhållandet mellan latinerna och invånarna blev allt sämre.
