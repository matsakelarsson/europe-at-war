April 1204: april 1204
Soldiers stripped the great church, smashed its altar and loaded its treasures onto mules led into the sanctuary.: Soldater skövlade den stora kyrkan, slog sönder dess altare och lastade dess skatter på mulor som leddes in i helgedomen.
On 9 May 1204 the electors chose Count Baldwin of Flanders rather than Boniface as emperor; he was crowned in Hagia Sophia on 16 May, and a Venetian, Thomas Morosini, became Latin patriarch. A treaty of partition gave the emperor Constantinople and the lands around it, and Venice three-eighths of the empire, from which it chose ports and islands for its trade. Boniface took Thessalonica as a kingdom under the emperor and sold Venice his claim to Crete. Much of this had still to be conquered.: Den 9 maj 1204 valde elektorerna greve Balduin av Flandern hellre än Bonifatius till kejsare; han kröntes i Hagia Sofia den 16 maj, och en venetianare, Tommaso Morosini, blev latinsk patriark. Ett delningsfördrag gav kejsaren Konstantinopel och områdena runt staden och Venedig tre åttondelar av riket, ur vilka republiken valde ut hamnar och öar för sin handel. Bonifatius tog Thessalonike som ett kungarike under kejsaren och sålde sitt anspråk på Kreta till Venedig. Mycket av detta återstod ännu att erövra.
That autumn the Franks spread out. Boniface marched through Thessaly into Greece; Othon de la Roche became lord of Athens and Thebes, and William of Champlitte and Geoffrey of Villehardouin, nephew of the chronicler, conquered most of the Peloponnese, beating local forces at the olive grove of Kountouras in 1205 and founding the Principality of Achaea. In Asia Minor Latin knights beat Theodore Laskaris at Poimanenon in December 1204. But Greek states survived at Nicaea under Laskaris, at Trebizond, where the Komnenos brothers had taken power with Georgian help in April 1204, and in Epirus under Michael Komnenos Doukas.: Den hösten spred sig frankerna ut. Bonifatius marscherade genom Thessalien in i Grekland; Othon de la Roche blev herre över Aten och Thebe, och Guillaume de Champlitte och Geoffroy de Villehardouin, krönikörens brorson, erövrade större delen av Peloponnesos, slog lokala styrkor vid olivlunden i Kountouras 1205 och grundade furstendömet Achaia. I Mindre Asien slog latinska riddare Theodoros Laskaris vid Poimanenon i december 1204. Men grekiska stater överlevde i Nicaea under Laskaris, i Trapezunt, där bröderna Komnenos med georgisk hjälp hade tagit makten i april 1204, och i Epirus under Mikael Komnenos Dukas.
