Dates are Julian. The main eyewitness accounts are by two crusaders, Geoffrey of Villehardouin, one of the leaders, and the knight Robert of Clari, and by the Byzantine official and historian Niketas Choniates, who lived through the sack.: Datumen följer den julianska kalendern. De viktigaste ögonvittnesskildringarna är skrivna av två korsfarare, Geoffroy de Villehardouin, en av ledarna, och riddaren Robert de Clari, samt av den bysantinske ämbetsmannen och historikern Niketas Choniates, som upplevde plundringen.
Historians have long argued whether the diversion to Constantinople was planned, by Venice or by the leaders, or was the result of debt, accident and opportunism. Most now favour the second view.: Historikerna har länge diskuterat om omvägen till Konstantinopel var planerad, av Venedig eller av ledarna, eller om den var resultatet av skulder, tillfälligheter och opportunism. De flesta förordar i dag den senare uppfattningen.
The wars of the Latin Empire with Bulgaria and with Nicaea have their own entries.: Latinska kejsardömets krig mot Bulgarien och mot Nicaea har egna uppslag.
