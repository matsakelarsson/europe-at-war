Pope Innocent III called a new crusade in 1198 to recover Jerusalem, this time by attacking Egypt, the centre of Ayyubid power. Its leaders, mostly French and Flemish nobles under Boniface of Montferrat, agreed in 1201 that Venice would build a fleet to carry 33,500 men and 4,500 horses for 85,000 marks of silver. Venice put much of its trade aside for a year to build and crew the ships. But in the summer of 1202 only about a third of the expected army came to Venice, and the crusaders could not pay.: Påven Innocentius III utlyste 1198 ett nytt korståg för att återvinna Jerusalem, denna gång genom ett angrepp på Egypten, centrum för ayyubidernas makt. Dess ledare, mestadels franska och flamländska adelsmän under Bonifatius av Montferrat, kom 1201 överens om att Venedig skulle bygga en flotta som kunde föra 33 500 man och 4 500 hästar för 85 000 mark silver. Venedig lade stora delar av sin handel åt sidan i ett år för att bygga och bemanna fartygen. Men sommaren 1202 kom bara omkring en tredjedel av den väntade hären till Venedig, och korsfararna kunde inte betala.
The aged and nearly blind doge, Enrico Dandolo, offered to put off the debt if the crusaders helped Venice recover Zara (Zadar), a Dalmatian port that had rebelled against Venice and put itself under the King of Hungary, who had himself taken the cross. Despite the pope’s ban, the fleet sailed in October 1202, reached Zara on 10 November and took it on 24 November; the city was sacked. Some crusaders, among them Simon de Montfort, refused to take part. Innocent excommunicated the army, then absolved the crusaders but not the Venetians.: Den åldrige och nästan blinde dogen Enrico Dandolo erbjöd sig att skjuta upp skulden om korsfararna hjälpte Venedig att återvinna Zara (Zadar), en dalmatisk hamnstad som hade gjort uppror mot Venedig och ställt sig under kungen av Ungern, som själv hade tagit korset. Trots påvens förbud seglade flottan i oktober 1202, nådde Zara den 10 november och intog staden den 24 november; den plundrades. En del korsfarare, bland dem Simon de Montfort, vägrade att delta. Innocentius bannlyste hären, men gav sedan korsfararna absolution, dock inte venetianerna.
At Zara envoys came from Alexios Angelos, son of the Byzantine emperor Isaac II, whom his brother Alexios III had deposed and blinded in 1195. If he were put on the throne, the young Alexios promised 200,000 marks, 10,000 soldiers for the crusade, 500 knights to guard the Holy Land and the submission of the Greek Church to Rome. Most of the leaders accepted, though many crusaders objected and some left for Syria on their own, and in April 1203 the fleet sailed for Constantinople.: I Zara kom sändebud från Alexios Angelos, son till den bysantinske kejsaren Isak II, som hans bror Alexios III hade avsatt och bländat 1195. Om han sattes på tronen lovade den unge Alexios 200 000 mark, 10 000 soldater till korståget, 500 riddare för att försvara det heliga landet och den grekiska kyrkans underkastelse under Rom. De flesta av ledarna antog erbjudandet, trots att många korsfarare protesterade och en del begav sig på egen hand till Syrien, och i april 1203 seglade flottan mot Konstantinopel.
