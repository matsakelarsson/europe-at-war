# Svenska översättningar av katalogtexten (våg 7); stegtexterna kommer senare.
Fourth Fitna: Fjärde fitnan
The Abbasid civil war between two sons of Harun al-Rashid, al-Amin, caliph in Baghdad, and his half-brother al-Ma’mun, governor of Khorasan at Merv. When al-Amin tried to cut al-Ma’mun out of the succession, war broke out in 811. Al-Ma’mun’s general Tahir ibn al-Husayn beat al-Amin’s armies at Rayy and Hamadan and, after a siege of more than a year that wrecked much of Baghdad, took the city in September 813, and al-Amin was killed. Al-Ma’mun stayed in Merv, and revolts in Iraq, Arabia, Syria and Egypt and the proclamation of a rival caliph in Baghdad in 817 kept the caliphate divided until he entered Baghdad in August 819.: Det abbasidiska inbördeskriget mellan två av Harun al-Rashids söner, al-Amin, kalif i Bagdad, och hans halvbror al-Ma’mun, guvernör över Khorasan i Merv. När al-Amin försökte utesluta al-Ma’mun ur tronföljden bröt kriget ut 811. Al-Ma’muns fältherre Tahir ibn al-Husayn slog al-Amins arméer vid Rayy och Hamadan och intog staden i september 813, efter en belägring på mer än ett år som ödelade stora delar av Bagdad, och al-Amin dödades. Al-Ma’mun stannade i Merv, och uppror i Irak, Arabien, Syrien och Egypten samt utropandet av en rivaliserande kalif i Bagdad 817 höll kalifatet splittrat tills han tågade in i Bagdad i augusti 819.
