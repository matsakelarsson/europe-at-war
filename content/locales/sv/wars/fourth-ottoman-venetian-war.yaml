Dates are Julian. Figures for the fleets and the dead at Lepanto vary; the commonest estimates are about 7,500 dead on the League side and about 30,000 on the Ottoman side, and some sources give more.: Datumen följer den julianska kalendern. Uppgifterna om flottorna och de döda vid Lepanto varierar; de vanligaste uppskattningarna är omkring 7 500 döda på ligans sida och omkring 30 000 på osmansk sida, och en del källor anger fler.
The Holy League was formed in May 1571 by Pope Pius V; besides Venice, Spain and the Papal States, it included Genoa, Savoy, Tuscany, the Knights of Malta and smaller Italian states. Its fleet is shown here as a separate side from Venice’s own forces on Cyprus.: Heliga ligan bildades i maj 1571 av påven Pius V; utöver Venedig, Spanien och Kyrkostaten omfattade den Genua, Savojen, Toscana, Malteserorden och mindre italienska stater. Dess flotta visas här som en egen sida, skild från Venedigs egna styrkor på Cypern.
