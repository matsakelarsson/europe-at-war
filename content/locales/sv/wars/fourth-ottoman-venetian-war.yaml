The city surrendered after almost a year’s siege. Its commander, Bragadin, was put to death in breach of the terms.: Staden kapitulerade efter nästan ett års belägring. Dess befälhavare Bragadin avrättades i strid mot villkoren.
Rome: Rom
Pope Pius V brought Spain and Venice together in the Holy League against the Ottomans.: Påven Pius V förde samman Spanien och Venedig i Heliga ligan mot osmanerna.
The League fleet gathered at Messina under Don John of Austria, Philip II’s half-brother, and sailed in mid-September, still unaware that Famagusta had fallen. It had about 206 galleys and six Venetian galleasses, heavy gun-ships, against the Ottoman admiral Müezzinzade Ali Pasha’s 210 or so galleys and some 60 galliots, which lay at Lepanto. On 7 October the fleets met at the mouth of the Gulf of Patras. The galleasses broke up the Ottoman line, and after hours of fighting at close quarters Ali Pasha was killed and his flagship taken. Only the squadron of Uluç Ali, governor of Algiers, escaped in good order.: Ligans flotta samlades i Messina under Don Juan av Österrike, Filip II:s halvbror, och seglade i mitten av september, fortfarande ovetande om att Famagusta hade fallit. Den hade omkring 206 galärer och sex venetianska galeasser, tunga kanonskepp, mot den osmanske amiralen Müezzinzade Ali paschas omkring 210 galärer och ett sextiotal galioter, som låg vid Lepanto. Den 7 oktober möttes flottorna vid mynningen av Patrasviken. Galeasserna splittrade den osmanska linjen, och efter timmar av närstrid dödades Ali pascha och hans flaggskepp togs. Endast eskadern under Uluç Ali, guvernör i Alger, tog sig undan i god ordning.
The League captured about 117 galleys and sank or burned many others; some 30,000 Ottomans and 7,500 of the allies are thought to have died, and thousands of Christian galley slaves were freed. Among the wounded was Miguel de Cervantes. The victory was celebrated across Catholic Europe, but it was not followed up. Over the winter the Ottomans built a new fleet, and in 1572 Uluç Ali, now called Kılıç Ali, avoided battle off Modon. Venice made a separate peace on 7 March 1573, giving up Cyprus and paying 300,000 ducats.: Ligan erövrade omkring 117 galärer och sänkte eller brände många andra; omkring 30 000 osmaner och 7 500 av de allierade tros ha dött, och tusentals kristna galärslavar befriades. Bland de sårade fanns Miguel de Cervantes. Segern firades i hela det katolska Europa, men den följdes inte upp. Under vintern byggde osmanerna en ny flotta, och 1572 undvek Uluç Ali, nu kallad Kılıç Ali, strid utanför Modon. Venedig slöt separatfred den 7 mars 1573, avstod Cypern och betalade 300 000 dukater.
