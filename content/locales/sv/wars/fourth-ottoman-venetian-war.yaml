Fourth Ottoman–Venetian War: Fjärde osmansk-venetianska kriget
The War of Cyprus, in which Sultan Selim II took Venice’s richest colony. Nicosia fell in September 1570 and Famagusta in August 1571 after a siege of almost a year. Two months later the fleet of the Holy League of Spain, Venice and the pope destroyed the Ottoman fleet at Lepanto, the largest galley battle in history, but the Ottomans rebuilt their navy and Venice made a separate peace in 1573, giving up Cyprus.: Cypernkriget, där sultan Selim II tog Venedigs rikaste koloni. Nicosia föll i september 1570 och Famagusta i augusti 1571 efter en nästan årslång belägring. Två månader senare förintade Heliga ligans flotta – Spanien, Venedig och påven – den osmanska flottan vid Lepanto, historiens största galärslag, men osmanerna byggde upp sin flotta igen och Venedig slöt separatfred 1573 och avstod Cypern.
