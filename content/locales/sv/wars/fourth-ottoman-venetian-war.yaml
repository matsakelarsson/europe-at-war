Cyprus had been Venetian since 1489, and Venice paid the sultan a tribute for it, but the island lay deep in Ottoman waters and its harbours sheltered Christian corsairs. Selim II and his war party, against the advice of the grand vizier Sokollu Mehmed Pasha, decided to take it. In March 1570 an envoy demanded that Venice give up the island; the Senate refused. On 3 July a large Ottoman army under the sultan’s old tutor Lala Mustafa Pasha, carried by Piyale Pasha’s fleet, landed unopposed at Salines, near Larnaca, and marched on the capital, Nicosia.: Cypern hade varit venetianskt sedan 1489, och Venedig betalade sultanen tribut för ön, men den låg djupt inne i osmanska farvatten och dess hamnar gav skydd åt kristna kapare. Selim II och hans krigsparti beslöt, mot storvesiren Sokollu Mehmed paschas råd, att ta ön. I mars 1570 krävde ett sändebud att Venedig skulle avstå ön; senaten vägrade. Den 3 juli landsteg en stor osmansk här under sultanens gamle lärare Lala Mustafa pascha, överförd av Piyale paschas flotta, utan motstånd vid Salines nära Larnaca och marscherade mot huvudstaden Nicosia.
Nicosia had new star-shaped walls but too few trained soldiers. The siege began on 22 July, and on 9 September the Ottomans stormed the city. Some 20,000 of its people are thought to have been killed, and many women and children were sold as slaves. Kyrenia then surrendered without a fight, and on 15 September Ottoman cavalry appeared before Famagusta, the last Venetian stronghold. A relief fleet of Venetian, papal and Spanish galleys, assembled late at Crete, heard of Nicosia’s fall at sea and turned back.: Nicosia hade nya stjärnformade murar men för få utbildade soldater. Belägringen inleddes den 22 juli, och den 9 september stormade osmanerna staden. Omkring 20 000 av dess invånare tros ha dödats, och många kvinnor och barn såldes som slavar. Kyrenia kapitulerade därefter utan strid, och den 15 september dök osmanskt kavalleri upp framför Famagusta, det sista venetianska fästet. En undsättningsflotta av venetianska, påvliga och spanska galärer, som samlats sent på Kreta, fick till sjöss höra om Nicosias fall och vände om.
