Famagusta was held by Marco Antonio Bragadin with about 8,500 men and 90 guns. In January 1571 Venetian ships slipped through the blockade with men and supplies, and Selim recalled Piyale Pasha in anger, leaving Lala Mustafa in sole command. From 12 May the Ottomans bombarded the walls without pause, dug mines and made repeated assaults. Meanwhile Pope Pius V brought Venice and a reluctant Philip II of Spain together in a Holy League, concluded in May, but its fleet was not ready in time to save the city.: Famagusta försvarades av Marco Antonio Bragadin med omkring 8 500 man och 90 kanoner. I januari 1571 tog sig venetianska fartyg igenom blockaden med manskap och förnödenheter, och Selim kallade i vredesmod hem Piyale pascha och lämnade Lala Mustafa ensam i befälet. Från den 12 maj besköt osmanerna murarna oavbrutet, grävde minor och gjorde upprepade stormningar. Under tiden förde påven Pius V samman Venedig och en motvillig Filip II av Spanien i en helig liga, som slöts i maj, men dess flotta blev inte klar i tid för att rädda staden.
On 1 August, with powder and food exhausted and few men left fit to fight, Bragadin surrendered on terms that let the survivors leave for Crete. A few days later, after an angry meeting in which Lala Mustafa accused him of killing Muslim prisoners, Bragadin was arrested, his officers were executed, and he was mutilated and flayed alive; his stuffed skin was later sent to Constantinople. The siege had cost the Ottomans very heavy losses, by some estimates tens of thousands of dead.: Den 1 augusti, när krut och mat var slut och få män återstod som kunde strida, kapitulerade Bragadin på villkor som lät de överlevande resa till Kreta. Några dagar senare, efter ett upprört möte där Lala Mustafa anklagade honom för att ha dödat muslimska fångar, greps Bragadin, hans officerare avrättades och han själv stympades och flåddes levande; hans uppstoppade hud skickades senare till Konstantinopel. Belägringen hade kostat osmanerna mycket svåra förluster, enligt vissa uppskattningar tiotusentals döda.
