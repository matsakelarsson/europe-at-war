# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
Fox Wars: Foxkrigen
? Two wars between the Meskwaki (Fox) and New France with its many Native allies in the western Great Lakes and the Illinois country. The Meskwaki held the Fox–Wisconsin waterway between Lake Michigan and the Mississippi and fought the French over trade and over French arms sales to their enemies. In 1712 a large Meskwaki and Mascouten community that had settled at Detroit was besieged by the French and their Odawa, Potawatomi, Wendat and Illinois allies; when it broke out it was destroyed, with about 1,000 people killed or enslaved. A French expedition under Louvigny forced a peace in 1716, but war resumed in the 1720s, and Governor Beauharnois set out to destroy the Meskwaki as a people. In 1730, as they tried to reach refuge with the Seneca, the Meskwaki were besieged on the prairie of Illinois and hundreds were killed or captured in their breakout. Survivors found shelter with the Sauk, who killed the French commander Coulon de Villiers at La Baye (Green Bay) in 1733. Beauharnois finally pardoned the Meskwaki in 1737–1738; reduced to a few hundred people, they lived on alongside the Sauk.
: Två krig mellan meskwaki (fox) och Nya Frankrike med dess många ursprungsamerikanska allierade kring de västra Stora sjöarna och i Illinoislandet. Meskwaki behärskade vattenvägen Fox–Wisconsin mellan Michigansjön och Mississippi och stred mot fransmännen om handeln och om de franska vapenförsäljningarna till deras fiender. År 1712 belägrades ett stort samhälle av meskwaki och mascouten som hade slagit sig ned vid Detroit av fransmännen och deras allierade bland odawa, potawatomi, wendat och illinois; när det bröt sig ut förintades det, och omkring 1 000 människor dödades eller förslavades. En fransk expedition under Louvigny framtvingade en fred 1716, men kriget blossade upp igen på 1720-talet, och guvernör Beauharnois föresatte sig att utplåna meskwaki som folk. År 1730, när de försökte nå en tillflykt hos seneca, belägrades meskwaki på Illinoisprärien, och hundratals dödades eller tillfångatogs när de bröt sig ut. De överlevande fann skydd hos sauk, som dödade den franske befälhavaren Coulon de Villiers vid La Baye (Green Bay) 1733. Beauharnois benådade slutligen meskwaki 1737–1738; de var då reducerade till några hundra personer och levde vidare sida vid sida med sauk.
