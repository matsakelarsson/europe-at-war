In June 1673 Louis took Maastricht after a siege directed by Vauban, in which the musketeer d’Artagnan was killed. But France’s gains alarmed Europe. The Emperor, Spain and the Duke of Lorraine allied with the Dutch, William retook Naarden and, with the imperial army, Bonn, and in 1674 the French left almost all of the Republic. England made peace in February 1674. That spring Louis conquered Franche-Comté from Spain, and in August William and the Prince of Condé fought the bloody battle of Seneffe, both claiming victory.: I juni 1673 tog Ludvig Maastricht efter en belägring som leddes av Vauban och där musketören d’Artagnan dödades. Men Frankrikes vinster väckte oro i Europa. Kejsaren, Spanien och hertigen av Lothringen allierade sig med nederländarna, Vilhelm återtog Naarden och, tillsammans med den kejserliga armén, Bonn, och 1674 lämnade fransmännen nästan hela republiken. England slöt fred i februari 1674. Den våren erövrade Ludvig Franche-Comté från Spanien, och i augusti utkämpade Vilhelm och prinsen av Condé det blodiga slaget vid Seneffe, där båda gjorde anspråk på segern.
On the Rhine Marshal Turenne faced larger imperial armies. He beat them at Sinsheim on 16 June 1674 and then laid waste much of the Palatinate. In the autumn the allies took up winter quarters in Alsace, but Turenne marched south behind the Vosges in midwinter, came out at Belfort and surprised them at Turckheim on 5 January 1675, driving them back over the Rhine. On 27 July 1675, while manoeuvring against the imperial general Raimondo Montecuccoli near Sasbach in Baden, Turenne was killed by a cannonball.: Vid Rhen stod marskalk Turenne mot större kejserliga arméer. Han slog dem vid Sinsheim den 16 juni 1674 och ödelade sedan stora delar av Pfalz. Under hösten gick de allierade i vinterkvarter i Elsass, men Turenne marscherade söderut bakom Vogeserna mitt i vintern, kom fram vid Belfort och överraskade dem vid Turckheim den 5 januari 1675 och drev dem tillbaka över Rhen. Den 27 juli 1675, när han manövrerade mot den kejserlige generalen Raimondo Montecuccoli nära Sasbach i Baden, dödades Turenne av en kanonkula.
