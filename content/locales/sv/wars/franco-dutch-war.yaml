Louis XIV meant to punish the Dutch for checking his conquests in the Spanish Netherlands in 1668. Having bought England’s alliance in the secret Treaty of Dover and isolated the Republic, he declared war on 6 April 1672 and marched down the Meuse with well over 100,000 men, bypassing Maastricht. On 12 June his army crossed the Rhine at Tolhuis near Lobith, outflanking the Dutch defences on the IJssel, and Utrecht opened its gates. France’s allies, the Bishop of Münster and the Elector of Cologne, overran Overijssel and Drenthe and laid siege to Groningen.: Ludvig XIV ville straffa nederländarna för att de 1668 hade hejdat hans erövringar i Spanska Nederländerna. Sedan han köpt Englands allians genom det hemliga Doverfördraget och isolerat republiken förklarade han krig den 6 april 1672 och marscherade nedför Maas med långt över 100 000 man, förbi Maastricht. Den 12 juni gick hans här över Rhen vid Tolhuis nära Lobith och kringgick därmed det nederländska försvaret vid IJssel, och Utrecht öppnade sina portar. Frankrikes allierade, biskopen av Münster och kurfursten av Köln, överskred Overijssel och Drenthe och belägrade Groningen.
The Dutch remember 1672 as the Rampjaar, the disaster year, when the people were said to be irrational, the government desperate and the country beyond saving. They saved Holland by opening the sluices of the Water Line from Muiden to Gorinchem, flooding a belt of land the French could not cross. At sea de Ruyter attacked the Anglo-French fleet at Solebay on 7 June and prevented a landing. In the panic the young William III was made stadtholder and captain-general, and on 20 August a mob in The Hague murdered Johan de Witt and his brother Cornelis.: Nederländarna minns 1672 som Rampjaar, katastrofåret, då folket sades vara förnuftslöst, regeringen desperat och landet bortom räddning. De räddade Holland genom att öppna slussarna i vattenlinjen från Muiden till Gorinchem och sätta ett bälte av land under vatten som fransmännen inte kunde ta sig över. Till sjöss angrep de Ruyter den engelsk-franska flottan vid Solebay den 7 juni och förhindrade en landstigning. Under paniken blev den unge Vilhelm III ståthållare och generalkapten, och den 20 augusti mördade en folkmassa i Haag Johan de Witt och hans bror Cornelis.
