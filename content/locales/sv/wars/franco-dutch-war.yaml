France’s allies were England (until February 1674, in the Third Anglo-Dutch War), the Prince-Bishop of Münster and the Elector of Cologne (until 1674) and Sweden (from 1675). The Dutch were joined by Brandenburg (1672–1673 and again from 1674), the Emperor, Spain and the Duke of Lorraine (1673), the Empire (1674) and Denmark–Norway (1675). For the war in the north, see the Scanian War.: Frankrikes allierade var England (fram till februari 1674, i tredje engelsk-nederländska kriget), furstbiskopen av Münster och kurfursten av Köln (fram till 1674) samt Sverige (från 1675). Nederländerna fick stöd av Brandenburg (1672–1673 och åter från 1674), kejsaren, Spanien och hertigen av Lothringen (1673), riket (1674) och Danmark–Norge (1675). För kriget i norr, se Skånska kriget.
Dates are New Style (Gregorian). Some Dutch provinces, such as Groningen, still used the Julian calendar, ten days behind.: Datumen följer den nya stilen (gregorianska kalendern). En del nederländska provinser, som Groningen, använde fortfarande den julianska kalendern, tio dagar efter.
