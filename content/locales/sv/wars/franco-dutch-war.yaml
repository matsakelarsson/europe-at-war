Franco-Dutch War: Fransk-nederländska kriget
A war launched by Louis XIV against the Dutch Republic, which nearly fell in the disaster year of 1672 before flooding Holland and finding allies in Spain, the Emperor and Brandenburg. The war spread to the Rhine, the Spanish Netherlands and the Baltic, where it was fought as the Scanian War. The Peace of Nijmegen in 1678 left the Republic intact but gave France Franche-Comté and a string of towns in the Spanish Netherlands.: Ett krig som Ludvig XIV inledde mot Nederländska republiken, som nästan föll under katastrofåret 1672 innan den satte Holland under vatten och fann bundsförvanter i Spanien, kejsaren och Brandenburg. Kriget spred sig till Rhen, Spanska Nederländerna och Östersjön, där det utkämpades som skånska kriget. Freden i Nijmegen 1678 lämnade republiken intakt men gav Frankrike Franche-Comté och en rad städer i Spanska Nederländerna.
