The war became a contest of sieges in the Spanish Netherlands, which Louis waged with Vauban’s engineering. Valenciennes was taken by storm on 17 March 1677, and Cambrai and Saint-Omer fell that spring. When William marched to relieve Saint-Omer, the King’s brother, Philippe of Orléans, beat him at Cassel on 11 April. In November 1677 William married Mary, daughter of the Duke of York, drawing England closer to the Dutch, and in March 1678 the French took Ghent and Ypres.: Kriget blev en kamp om belägringar i Spanska Nederländerna, som Ludvig förde med Vaubans ingenjörskonst. Valenciennes togs med storm den 17 mars 1677, och Cambrai och Saint-Omer föll samma vår. När Vilhelm marscherade för att undsätta Saint-Omer slog kungens bror, Filip av Orléans, honom vid Cassel den 11 april. I november 1677 gifte sig Vilhelm med Maria, dotter till hertigen av York, vilket förde England närmare nederländarna, och i mars 1678 tog fransmännen Gent och Ypres.
Dutch merchants wanted peace, and the Republic made a separate treaty with France at Nijmegen on 10 August 1678. It lost no territory, Maastricht was handed back, and France lowered its tariffs. Four days later William, who may already have known of the peace, attacked the French at Saint-Denis near Mons. Spain made peace on 17 September and paid for the war. France gained Franche-Comté and a belt of towns in the south, among them Valenciennes, Cambrai, Maubeuge, Saint-Omer, Ypres and Cassel, but returned others such as Charleroi, Oudenaarde, Courtrai and Ghent. The Emperor followed in February 1679.: Nederländska köpmän ville ha fred, och republiken slöt ett separat fördrag med Frankrike i Nijmegen den 10 augusti 1678. Den förlorade inget territorium, Maastricht lämnades tillbaka och Frankrike sänkte sina tullar. Fyra dagar senare anföll Vilhelm, som kanske redan kände till freden, fransmännen vid Saint-Denis nära Mons. Spanien slöt fred den 17 september och fick betala för kriget. Frankrike vann Franche-Comté och ett bälte av städer i söder, bland dem Valenciennes, Cambrai, Maubeuge, Saint-Omer, Ypres och Cassel, men lämnade tillbaka andra som Charleroi, Oudenaarde, Courtrai och Gent. Kejsaren följde efter i februari 1679.
