Dates are Julian. Places in Belgium are given their Dutch names, with the French form where it is common in English, such as Courtrai for Kortrijk and Furnes for Veurne.: Datumen följer den julianska kalendern. Orter i Belgien anges med sina nederländska namn, med den franska formen där den är vanlig på engelska, som Courtrai för Kortrijk och Furnes för Veurne.
In Flanders the battle of Courtrai is known as the Guldensporenslag, and 11 July is the official holiday of the Flemish Community in Belgium.: I Flandern kallas slaget vid Courtrai Guldensporenslag, och den 11 juli är den flamländska gemenskapens officiella helgdag i Belgien.
The war ran alongside the Anglo-French Gascon War of 1294–1303 and the first years of the First War of Scottish Independence.: Kriget pågick samtidigt som det engelsk-franska Gascognekriget 1294–1303 och de första åren av det första skotska frihetskriget.
