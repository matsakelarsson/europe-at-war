Guy of Dampierre, Count of Flanders, was caught between his overlord Philip IV, who pressed royal justice and taxes on the county, and its great cloth towns, which lived on English wool. In January 1297 he allied with Edward I of England and renounced his homage. A French army besieged Lille, Robert of Artois beat the Flemish at Furnes on 20 August, and Lille, Bruges and Kortrijk gave in. Edward landed with a small army but, with Scotland in revolt, made a truce and went home. When it ran out in 1300, Charles of Valois overran the rest of the county; Guy surrendered and was imprisoned, and Philip annexed Flanders to the royal domain.: Guido av Dampierre, greve av Flandern, stod klämd mellan sin länsherre Filip IV, som drev igenom kunglig rättskipning och skatter i grevskapet, och dess stora klädesstäder, som levde på engelsk ull. I januari 1297 allierade han sig med Edvard I av England och sade upp sin länsed. En fransk här belägrade Lille, Robert av Artois besegrade flamländarna vid Furnes den 20 augusti, och Lille, Brygge och Kortrijk gav upp. Edvard landsteg med en liten här men slöt, med Skottland i uppror, ett stillestånd och återvände hem. När det löpte ut år 1300 erövrade Karl av Valois resten av grevskapet; Guido kapitulerade och fängslades, och Filip införlivade Flandern med kronans domäner.
The new governor, Jacques de Châtillon, ruled harshly with the support of the town patricians, the Leliaerts or “men of the lily”, and raised new taxes. At dawn on 18 May 1302, in the Matins of Bruges, the guildsmen of Bruges led by the weaver Pieter de Coninck killed the French soldiers quartered in the town; tradition says that anyone who could not say the Flemish words “schild en vriend” was cut down. Led by Guy’s son Guy of Namur and his grandson William of Jülich, the rebels then besieged the French garrison in the castle of Kortrijk.: Den nye guvernören, Jacques de Châtillon, styrde hårt med stöd av städernas patricier, leliaerts eller ”liljans män”, och tog ut nya skatter. I gryningen den 18 maj 1302, vid Brygges morgonmässa, dödade skråmännen i Brygge under ledning av vävaren Pieter de Coninck de franska soldater som var inkvarterade i staden; enligt traditionen höggs den ned som inte kunde uttala de flamländska orden ”schild en vriend”. Under ledning av Guidos son Guido av Namur och hans sonson Wilhelm av Jülich belägrade rebellerna sedan den franska garnisonen i Kortrijks borg.
On 11 July Robert of Artois attacked them outside the town with a royal army of about 8,000, including some 2,500 mounted men-at-arms. The Flemish, perhaps 9,000 townsmen and peasants on foot, armed with pikes and the spiked club called the goedendag, stood behind streams and ditches. The French cavalry floundered in the marshy ground and was slaughtered, since the militiamen took few prisoners. Robert and hundreds of knights were killed, and some 500 pairs of golden spurs were hung in the Church of Our Lady in Kortrijk.: Den 11 juli anföll Robert av Artois dem utanför staden med en kunglig här på omkring 8 000 man, däribland omkring 2 500 beridna krigare. Flamländarna, kanske 9 000 borgare och bönder till fots, beväpnade med pikar och den piggförsedda klubba som kallades goedendag, stod bakom bäckar och diken. Det franska rytteriet fastnade i den sanka marken och slaktades, eftersom milissoldaterna tog få fångar. Robert och hundratals riddare dödades, och omkring 500 par gyllene sporrar hängdes upp i Vår Frus kyrka i Kortrijk.
