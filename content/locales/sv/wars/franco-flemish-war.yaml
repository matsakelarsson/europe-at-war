After Courtrai the rebels took Lille, Douai and the rest of Flanders, and the guilds took over the town governments. Philip led an army to the border in September 1302 but withdrew without fighting, and in April 1303 the Flemish held off a French attack at Arques near Saint-Omer. Guy of Namur took the war into Zeeland, which the counts of Flanders claimed against the counts of Holland, but on 10–11 August 1304 a French fleet under the Genoese Rainier Grimaldi, with ships from Holland, defeated his fleet off Zierikzee and took him prisoner.: Efter Courtrai intog rebellerna Lille, Douai och resten av Flandern, och skråna tog över stadsstyrelserna. Filip förde en här till gränsen i september 1302 men drog sig tillbaka utan strid, och i april 1303 slog flamländarna tillbaka ett franskt anfall vid Arques nära Saint-Omer. Guido av Namur förde kriget in i Zeeland, som grevarna av Flandern gjorde anspråk på i strid med grevarna av Holland, men den 10–11 augusti 1304 besegrade en fransk flotta under genuesen Rainier Grimaldi, med fartyg från Holland, hans flotta utanför Zierikzee och tog honom till fånga.
A week later, on 18 August 1304, Philip IV fought the Flemish militias at Mons-en-Pévèle, south of Lille. After a long, hot day in which the king himself was nearly killed, the Flemish left the field, with William of Jülich among the dead. Both sides claimed victory, and when the Flemish raised a new army to relieve Lille, Philip agreed a truce. By the Treaty of Athis-sur-Orge, sealed on 23 June 1305, Guy’s son Robert of Béthune was restored as count, but Flanders had to pay huge fines, pull down the walls of its great towns, send 3,000 men of Bruges on pilgrimage and hand Lille, Douai and Orchies to the king. A further agreement in 1312 made the cession permanent.: En vecka senare, den 18 augusti 1304, mötte Filip IV de flamländska milisstyrkorna vid Mons-en-Pévèle, söder om Lille. Efter en lång och het dag då kungen själv nära nog dödades lämnade flamländarna slagfältet, och bland de döda fanns Wilhelm av Jülich. Båda sidor gjorde anspråk på segern, och när flamländarna samlade en ny här för att undsätta Lille gick Filip med på ett stillestånd. Genom fördraget i Athis-sur-Orge, beseglat den 23 juni 1305, återinsattes Guidos son Robert av Béthune som greve, men Flandern måste betala väldiga böter, riva murarna kring sina stora städer, sända 3 000 män från Brygge på pilgrimsfärd och lämna Lille, Douai och Orchies till kungen. En ytterligare överenskommelse 1312 gjorde avträdelsen permanent.
