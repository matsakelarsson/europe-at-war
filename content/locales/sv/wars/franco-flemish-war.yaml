Franco-Flemish War: Fransk-flamländska kriget
A war between Philip IV of France and the County of Flanders, whose count had allied with England. France overran Flanders and annexed it by 1300, but in 1302 the towns rose and their militias destroyed a French army of knights at Courtrai, the Battle of the Golden Spurs. After the hard-fought battle of Mons-en-Pévèle in 1304, the Treaty of Athis-sur-Orge restored the count as a French vassal at the price of heavy payments and the towns of Walloon Flanders.: Ett krig mellan Filip IV av Frankrike och grevskapet Flandern, vars greve hade allierat sig med England. Frankrike erövrade Flandern och hade annekterat det år 1300, men 1302 reste sig städerna och deras milisstyrkor förintade en fransk riddarhär vid Courtrai, i guldsporrarnas slag. Efter det hårda slaget vid Mons-en-Pévèle 1304 återinsatte fördraget i Athis-sur-Orge greven som fransk vasall, till priset av tunga betalningar och städerna i Vallonska Flandern.
