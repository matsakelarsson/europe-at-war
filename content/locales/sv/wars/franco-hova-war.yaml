# Svenska översättningar av katalogtexten (våg 13); stegtexterna kommer senare.
Franco-Hova War: Fransk-hovakriget
? "The first French war against the Merina kingdom of Madagascar, called the Hova by the French. France pressed old claims: to a protectorate over the Sakalava of the north-west, whose chiefs had signed treaties with France in 1840–1841, and to the estates of the French businessman Jean Laborde and the concessions Radama II had granted to Joseph-François Lambert. In May 1883 Admiral Pierre bombarded the Merina posts on the north-west coast and occupied Majunga, and when Queen Ranavalona II’s government rejected his ultimatum he bombarded and occupied Tamatave in June. The queen died in July; Ranavalona III and her prime minister and husband Rainilaiarivony fought on. For two years the French blockaded and raided the coasts but could not break the Merina lines at Farafaty outside Tamatave. The Treaty of Tamatave of 17 December 1885 gave France the bay of Diego Suarez, 10 million francs to settle French and other foreign claims, and a resident at Antananarivo to handle Madagascar’s foreign relations; France called it a protectorate, the Merina government did not, and the dispute led to the French conquest of 1895."
: "Frankrikes första krig mot Merinariket på Madagaskar, som fransmännen kallade hova. Frankrike drev gamla anspråk: på ett protektorat över sakalava i nordväst, vars hövdingar hade undertecknat fördrag med Frankrike 1840–1841, och på den franske affärsmannen Jean Labordes egendomar och de koncessioner som Radama II hade beviljat Joseph-François Lambert. I maj 1883 bombarderade amiral Pierre merinafolkets poster på nordvästkusten och besatte Majunga, och när drottning Ranavalona II:s regering förkastade hans ultimatum bombarderade och besatte han Tamatave i juni. Drottningen dog i juli; Ranavalona III och hennes premiärminister och make Rainilaiarivony fortsatte kampen. I två år blockerade fransmännen kusterna och gjorde räder mot dem men kunde inte bryta merinafolkets linjer vid Farafaty utanför Tamatave. Fördraget i Tamatave den 17 december 1885 gav Frankrike bukten vid Diego Suarez, 10 miljoner franc för att reglera franska och andra utländska anspråk och en resident i Antananarivo som skulle sköta Madagaskars utrikesförbindelser; Frankrike kallade det ett protektorat, merinaregeringen gjorde det inte, och tvisten ledde till den franska erövringen 1895."
