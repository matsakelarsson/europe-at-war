Franco-Moroccan War: Fransk-marockanska kriget
? A short war between France and Morocco over Abd al-Qadir, who carried on his war against the French conquest of Algeria from Moroccan territory with the support of many Moroccans. After clashes at the French post of Lalla Maghnia on the undefined border in May and June 1844, a French squadron under the Prince de Joinville bombarded Tangier on 6 August. On 14 August Marshal Bugeaud, with about 11,000 men, defeated a much larger Moroccan army, mostly cavalry, under the sultan’s son Sidi Mohammed on the Isly river near Oujda and took its camp; by Moroccan and French counts Morocco lost more than a thousand dead and France a few dozen. On 15–16 August the French bombarded Mogador (Essaouira) and occupied its island. Sultan Abd al-Rahman made peace by the Treaty of Tangier on 10 September 1844, agreeing to outlaw Abd al-Qadir, reduce the garrison at Oujda and mark the border. The Treaty of Lalla Maghnia of March 1845 drew the line from the coast to Teniet el-Sassi but left the desert border undefined, which led to disputes for more than a century.
: Ett kort krig mellan Frankrike och Marocko om Abd al-Qadir, som med stöd av många marockaner förde sitt krig mot den franska erövringen av Algeriet från marockanskt territorium. Efter sammandrabbningar vid den franska posteringen Lalla Maghnia vid den odefinierade gränsen i maj och juni 1844 bombarderade en fransk eskader under prinsen av Joinville Tanger den 6 augusti. Den 14 augusti besegrade marskalk Bugeaud med omkring 11 000 man en mycket större marockansk armé, mestadels kavalleri, under sultanens son Sidi Mohammed vid floden Isly nära Oujda och intog dess läger; enligt marockanska och franska uppgifter förlorade Marocko mer än tusen döda och Frankrike några dussin. Den 15–16 augusti bombarderade fransmännen Mogador (Essaouira) och besatte dess ö. Sultan Abd al-Rahman slöt fred genom fördraget i Tanger den 10 september 1844 och gick med på att förklara Abd al-Qadir fredlös, minska garnisonen i Oujda och märka ut gränsen. Fördraget i Lalla Maghnia i mars 1845 drog gränslinjen från kusten till Teniet el-Sassi men lämnade gränsen i öknen odefinierad, vilket ledde till tvister i mer än ett sekel.
France: Frankrike
Morocco: Marocko
