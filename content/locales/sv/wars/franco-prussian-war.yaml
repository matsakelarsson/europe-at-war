In July 1870 the Spanish throne was offered to Prince Leopold of Hohenzollern-Sigmaringen, a relative of the King of Prussia. France protested and the candidacy was withdrawn, but the French ambassador, Vincent Benedetti, then asked King William at the spa of Ems for a promise that it would never be renewed. William politely refused. Bismarck shortened the king’s telegraphed report of the meeting, the Ems dispatch, so that it read as a snub, and published it on 13 July. Outraged opinion in Paris pushed Napoleon III’s government into declaring war on 19 July, and the south German states joined Prussia under their alliances of 1866.: I juli 1870 erbjöds den spanska tronen prins Leopold av Hohenzollern-Sigmaringen, en släkting till kungen av Preussen. Frankrike protesterade och kandidaturen drogs tillbaka, men den franske ambassadören Vincent Benedetti bad sedan kung Vilhelm i kurorten Ems om ett löfte att den aldrig skulle förnyas. Vilhelm avböjde artigt. Bismarck kortade ned kungens telegraferade redogörelse för mötet, Emsdepeschen, så att den lästes som en avsnäsning, och offentliggjorde den den 13 juli. Den upprörda opinionen i Paris drev Napoleon III:s regering att förklara krig den 19 juli, och de sydtyska staterna anslöt sig till Preussen enligt sina allianser från 1866.
The German armies mobilised faster and in greater numbers, carried to the frontier by rail and directed again by Moltke. On 4 August the Third Army under Crown Prince Frederick William surprised a French division at Wissembourg, and on 6 August it crushed Marshal Patrice de MacMahon’s corps at Frœschwiller and Wörth, while further west Prussian troops stormed the heights of Spicheren near Saarbrücken. MacMahon fell back across the Vosges towards Châlons. The French had the better rifle, the Chassepot, but the Germans’ steel Krupp breech-loading guns outclassed the French artillery.: De tyska arméerna mobiliserade snabbare och i större antal, fördes till gränsen med järnväg och leddes återigen av Moltke. Den 4 augusti överrumplade tredje armén under kronprins Fredrik Vilhelm en fransk division vid Wissembourg, och den 6 augusti krossade den marskalk Patrice de MacMahons kår vid Frœschwiller och Wörth, medan preussiska trupper längre västerut stormade höjderna vid Spicheren nära Saarbrücken. MacMahon drog sig tillbaka över Vogeserna mot Châlons. Fransmännen hade det bättre geväret, Chassepot, men tyskarnas bakladdade Kruppkanoner av stål var överlägsna det franska artilleriet.
