The garrison marched out with the honours of war, and the town and its territory remained French in the peace.: Garnisonen tågade ut under militära hedersbetygelser, och staden och dess område förblev franska i freden.
The Treaty of Frankfurt, signed on 10 May 1871, confirmed the preliminary peace. France ceded Alsace, except Belfort, and the north-east of Lorraine with Metz, with about 1.5 million inhabitants, to the German Empire as the imperial territory of Alsace-Lorraine. People there could keep French nationality until 1 October 1872 if they moved to France, and tens of thousands did. France had to pay an indemnity of five billion francs, and German troops occupied the north-east of the country until it was paid. France paid ahead of time, and the last German troops left in September 1873.: Freden i Frankfurt, undertecknad den 10 maj 1871, bekräftade preliminärfreden. Frankrike avträdde Elsass, utom Belfort, och nordöstra Lothringen med Metz, med omkring 1,5 miljoner invånare, till Tyska riket som riksområdet Elsass-Lothringen. Invånarna där kunde behålla franskt medborgarskap till den 1 oktober 1872 om de flyttade till Frankrike, och tiotusentals gjorde det. Frankrike måste betala ett krigsskadestånd på fem miljarder franc, och tyska trupper ockuperade landets nordöstra del tills det var betalt. Frankrike betalade i förtid, och de sista tyska trupperna lämnade landet i september 1873.
The war had cost about 139,000 French and 45,000 German lives, counting deaths from disease, and some 380,000 French soldiers had been taken prisoner. While the peace was being negotiated, Paris rose against the government in March 1871 and formed the Commune. Government troops retook the city in the “Bloody Week” of 21–28 May, and thousands of Communards were killed in the fighting and in mass shootings, with estimates from about 7,000 to 20,000 or more. The loss of Alsace-Lorraine left a lasting bitterness in France, and the new German Empire was now the strongest power on the continent.: Kriget hade kostat omkring 139 000 franska och 45 000 tyska liv, dödsfall i sjukdom inräknade, och omkring 380 000 franska soldater hade tagits till fånga. Medan freden förhandlades reste sig Paris mot regeringen i mars 1871 och bildade kommunen. Regeringstrupper återtog staden under den ”blodiga veckan” 21–28 maj, och tusentals kommunarder dödades i striderna och vid massarkebuseringar, med uppskattningar från omkring 7 000 till 20 000 eller fler. Förlusten av Elsass-Lothringen lämnade en bestående bitterhet i Frankrike, och det nya Tyska riket var nu kontinentens starkaste makt.
