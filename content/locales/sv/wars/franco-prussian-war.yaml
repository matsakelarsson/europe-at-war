Marshal François Achille Bazaine, now in command of the main French army, the Army of the Rhine, began to withdraw from Metz towards Verdun, and the Germans caught up with him. On 16 August at Mars-la-Tour the Prussian III Corps under Constantin von Alvensleben blocked the road west in a day of costly fighting that included Bredow’s cavalry charge, the “death ride”. On 18 August, at Gravelotte and St Privat, in the largest battle of the war, the Germans attacked well-entrenched French positions and lost about 20,000 men against some 12,000 French. Bazaine then withdrew into the fortress of Metz instead of breaking out.: Marskalk François Achille Bazaine, som nu förde befälet över den franska huvudarmén, Rhenarmén, började dra sig tillbaka från Metz mot Verdun, och tyskarna hann upp honom. Den 16 augusti vid Mars-la-Tour spärrade den preussiska III. kåren under Constantin von Alvensleben vägen västerut under en dag av kostsamma strider, bland annat Bredows kavallerichock, ”dödsritten”. Den 18 augusti vid Gravelotte och S:t Privat, i krigets största slag, anföll tyskarna väl förskansade franska ställningar och förlorade omkring 20 000 man mot omkring 12 000 franska. Bazaine drog sig sedan in i fästningen Metz i stället för att bryta sig ut.
Prince Frederick Charles’s army besieged Metz, and attempts to break out at Noisseville on 31 August and at Bellevue on 7 October failed. Further south, Strasbourg was bombarded from late August, which killed many civilians and burned the city’s library with its medieval manuscripts, and it surrendered on 28 September. In Metz the food ran out in October, and on 27 October Bazaine surrendered the fortress and his whole army, more than 140,000 men, the largest surrender of the war. In 1873 a French court martial sentenced him to death for it, a sentence commuted to imprisonment.: Prins Fredrik Karls armé belägrade Metz, och försöken att bryta sig ut vid Noisseville den 31 augusti och vid Bellevue den 7 oktober misslyckades. Längre söderut bombarderades Strasbourg från slutet av augusti, vilket dödade många civila och brände stadens bibliotek med dess medeltida handskrifter, och staden kapitulerade den 28 september. I Metz tog maten slut i oktober, och den 27 oktober överlämnade Bazaine fästningen och hela sin armé, mer än 140 000 man, krigets största kapitulation. År 1873 dömde en fransk krigsrätt honom till döden för detta, ett straff som omvandlades till fängelse.
