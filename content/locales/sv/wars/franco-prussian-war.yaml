The war completed what 1866 had begun. In November 1870 Bismarck concluded treaties with Baden, Hesse-Darmstadt, Bavaria and Württemberg, which joined the North German Confederation in a German Empire from 1 January 1871. Bavaria and Württemberg kept special rights, among them their own railways and postal services, and Bavaria its own army in peacetime. King Ludwig II of Bavaria, secretly paid by Bismarck, wrote the letter inviting William to take the imperial title. On 18 January 1871, the anniversary of the first Prussian coronation in 1701, William was proclaimed German Emperor in the Hall of Mirrors of the palace of Versailles, before princes and officers.: Kriget fullbordade det som 1866 hade påbörjat. I november 1870 slöt Bismarck fördrag med Baden, Hessen-Darmstadt, Bayern och Württemberg, som förenades med Nordtyska förbundet i ett tyskt kejsarrike från den 1 januari 1871. Bayern och Württemberg behöll särskilda rättigheter, bland dem egna järnvägar och postväsen, och Bayern en egen armé i fredstid. Kung Ludvig II av Bayern, som i hemlighet fick pengar av Bismarck, skrev det brev som uppmanade Vilhelm att anta kejsartiteln. Den 18 januari 1871, på årsdagen av den första preussiska kröningen 1701, utropades Vilhelm till tysk kejsare i Spegelsalen i slottet i Versailles, inför furstar och officerare.
Ten days later, with Paris starving, the French government signed an armistice at Versailles. Paris paid 200 million francs and gave up its forts, but German troops stayed outside the city. Elections on 8 February returned a National Assembly with a monarchist majority, which met in Bordeaux and chose Adolphe Thiers to lead the government. Thiers negotiated the preliminary peace signed at Versailles on 26 February, and German troops held a short victory parade in Paris on 1 March. Belfort, whose garrison had surrendered with honours, stayed French; by many accounts Thiers accepted the parade as its price.: Tio dagar senare, när Paris svalt, undertecknade den franska regeringen ett vapenstillestånd i Versailles. Paris betalade 200 miljoner franc och lämnade ifrån sig sina fort, men de tyska trupperna stannade utanför staden. Valen den 8 februari gav en nationalförsamling med monarkistisk majoritet, som sammanträdde i Bordeaux och valde Adolphe Thiers att leda regeringen. Thiers förhandlade fram preliminärfreden som undertecknades i Versailles den 26 februari, och tyska trupper höll en kort segerparad i Paris den 1 mars. Belfort, vars garnison hade kapitulerat under hedersbetygelser, förblev franskt; enligt många framställningar godtog Thiers paraden som priset för det.
