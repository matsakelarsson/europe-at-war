German armies surrounded Paris on 19 September, shutting in some two million people. Gambetta left the city by balloon on 7 October to raise new armies from Tours, and the republic called up hundreds of thousands of men, many of them barely trained. The Army of the Loire won at Coulmiers on 9 November and retook Orléans, but the fall of Metz freed Prince Frederick Charles’s army, which beat the French at Loigny on 2 December, took Orléans again and in January reached Le Mans. In the north General Louis Faidherbe fought on until his defeat at St Quentin on 19 January.: Tyska arméer omringade Paris den 19 september och stängde in omkring två miljoner människor. Gambetta lämnade staden med ballong den 7 oktober för att från Tours sätta upp nya arméer, och republiken kallade in hundratusentals män, många av dem knappt utbildade. Loirearmén segrade vid Coulmiers den 9 november och återtog Orléans, men Metz fall frigjorde prins Fredrik Karls armé, som slog fransmännen vid Loigny den 2 december, tog Orléans på nytt och i januari nådde Le Mans. I norr fortsatte general Louis Faidherbe att strida tills han besegrades vid S:t Quentin den 19 januari.
Sorties from Paris failed, at Champigny in early December and at Buzenval on 19 January. Food ran short, and Parisians ate horses, cats, rats and the animals of the zoo; from 5 January German siege guns shelled the city. In the east General Charles Bourbaki’s army, sent to relieve besieged Belfort, was beaten on the Lisaine in mid-January. Driven against the Swiss border, about 87,000 of his men crossed into Switzerland on 1 February and were interned. Behind the German lines irregular francs-tireurs attacked supply lines, and the Germans answered with reprisals against villages and the taking of hostages.: Utfallen från Paris misslyckades, vid Champigny i början av december och vid Buzenval den 19 januari. Maten blev knapp, och parisarna åt hästar, katter, råttor och djuren i djurparken; från den 5 januari besköt tyskt belägringsartilleri staden. I öster besegrades general Charles Bourbakis armé, som skickats för att undsätta det belägrade Belfort, vid Lisaine i mitten av januari. Pressade mot den schweiziska gränsen gick omkring 87 000 av hans män över till Schweiz den 1 februari och internerades. Bakom de tyska linjerna angrep irreguljära franc-tireurs underhållslinjerna, och tyskarna svarade med repressalier mot byar och tagande av gisslan.
