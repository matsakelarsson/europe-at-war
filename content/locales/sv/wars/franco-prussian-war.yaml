Franco-Prussian War: Fransk-tyska kriget
A war between France and the German states led by Prussia, which destroyed the armies of the Second Empire at Sedan and Metz, besieged Paris and defeated the new French republic’s armies in the provinces. The southern German states joined Prussia in a German Empire proclaimed at Versailles in January 1871, and by the Treaty of Frankfurt France ceded Alsace and part of Lorraine and paid an indemnity of five billion francs.: Ett krig mellan Frankrike och de tyska staterna under ledning av Preussen, som förintade andra kejsardömets arméer vid Sedan och Metz, belägrade Paris och besegrade den nya franska republikens arméer i landsorten. De sydtyska staterna förenades med Preussen i ett tyskt kejsarrike som utropades i Versailles i januari 1871, och genom freden i Frankfurt avträdde Frankrike Elsass och en del av Lothringen och betalade ett krigsskadestånd på fem miljarder franc.
