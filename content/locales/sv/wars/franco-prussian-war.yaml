In France it is usually called the War of 1870 (la guerre de 1870), and in Germany the German–French War (Deutsch-Französischer Krieg). On the German side fought the North German Confederation, led by Prussia, with Bavaria, Württemberg, Baden and Hesse-Darmstadt as allies; together they formed the German Empire from 1 January 1871.: I Frankrike kallas det vanligen 1870 års krig (la guerre de 1870) och i Tyskland det tysk-franska kriget (Deutsch-Französischer Krieg). På tysk sida stred Nordtyska förbundet under ledning av Preussen, med Bayern, Württemberg, Baden och Hessen-Darmstadt som allierade; tillsammans bildade de Tyska riket från den 1 januari 1871.
Numbers of soldiers, prisoners and dead are estimates, and the sources differ, especially for the French side.: Antalet soldater, fångar och döda är uppskattningar, och källorna skiljer sig åt, särskilt för den franska sidan.
