At Châlons MacMahon gathered a new army of about 120,000 men, and Napoleon III joined it. Under pressure from Paris it set off on 23 August on a wide northern sweep to relieve Bazaine in Metz. Moltke turned the Third Army and a new Army of the Meuse north to meet it. The Germans surprised a French corps at Beaumont on 30 August and drove the army into a loop of the Meuse around the small fortress of Sedan, near the Belgian border. On 1 September they closed the ring. Their guns on the heights shelled the trapped army, and French cavalry charges at Floing failed to break out.: Vid Châlons samlade MacMahon en ny armé på omkring 120 000 man, och Napoleon III anslöt sig till den. Under tryck från Paris gav den sig av den 23 augusti på en vid sväng norrut för att undsätta Bazaine i Metz. Moltke vände tredje armén och en ny Maasarmé norrut för att möta den. Tyskarna överrumplade en fransk kår vid Beaumont den 30 augusti och drev armén in i en slinga av Maas kring den lilla fästningen Sedan, nära den belgiska gränsen. Den 1 september slöt de ringen. Deras kanoner på höjderna besköt den instängda armén, och franska kavallerichocker vid Floing lyckades inte bryta sig ut.
In Bazeilles Bavarian troops fought French marines from house to house and burned most of the village, and dozens of civilians were killed or wounded. On 2 September Napoleon III surrendered with about 104,000 men and went into captivity in Germany. When the news reached Paris, crowds invaded the legislature on 4 September, and Léon Gambetta and others proclaimed a republic at the Hôtel de Ville. A Government of National Defence under General Louis Trochu resolved to fight on; its foreign minister, Jules Favre, declared that France would yield “not an inch of our territory, not a stone of our fortresses”.: I Bazeilles stred bayerska trupper hus för hus mot franska marininfanterister och brände större delen av byn, och dussintals civila dödades eller sårades. Den 2 september kapitulerade Napoleon III med omkring 104 000 man och fördes i fångenskap till Tyskland. När nyheten nådde Paris trängde folkmassor in i den lagstiftande församlingen den 4 september, och Léon Gambetta och andra utropade republiken i Hôtel de Ville. En regering för det nationella försvaret under general Louis Trochu beslöt att fortsätta kampen; dess utrikesminister Jules Favre förklarade att Frankrike inte skulle ge upp ”en tum av vårt territorium, en sten av våra fästningar”.
