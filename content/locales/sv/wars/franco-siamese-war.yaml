Franco-Siamese crisis of 1893: Fransk-siamesiska krisen 1893
? A short war between France and Siam over the lands east of the Mekong, which Siam held as overlord of the Lao principalities and France claimed as heir to Vietnam’s rights. In April 1893 French columns from Indochina moved into the disputed country; a French officer was captured in the Khone islands, and on 5 June a French police inspector, Grosgurin, was killed with seventeen Vietnamese militiamen at Keng Kert in Khammouane. On 13 July two French warships forced their way past the forts at Paknam at the mouth of the Chao Phraya and anchored off Bangkok. France sent an ultimatum on 20 July and blockaded the coast from 29 July to 3 August, and Siam, finding that Britain would not support it, gave way. By the treaty of 3 October 1893 Siam ceded all its lands east of the Mekong, accepted a demilitarised zone 25 km wide on the west bank and the French occupation of Chanthaburi, and paid an indemnity of three million francs. Later treaties, in 1904 and 1907, gave France the right-bank parts of Luang Prabang and Champasak and the Cambodian provinces of Battambang, Siem Reap and Sisophon, in return for the evacuation of Chanthaburi, Trat and Dan Sai.
: Ett kort krig mellan Frankrike och Siam om landet öster om Mekong, som Siam innehade som överherre över de laotiska furstendömena och som Frankrike gjorde anspråk på som arvtagare till Vietnams rättigheter. I april 1893 ryckte franska kolonner från Indokina in i det omstridda området; en fransk officer tillfångatogs på Khoneöarna, och den 5 juni dödades en fransk polisinspektör, Grosgurin, tillsammans med sjutton vietnamesiska milismän vid Keng Kert i Khammouane. Den 13 juli tvingade sig två franska krigsfartyg förbi fästena vid Paknam vid Chao Phrayas mynning och ankrade utanför Bangkok. Frankrike sände ett ultimatum den 20 juli och blockerade kusten från den 29 juli till den 3 augusti, och Siam, som insåg att Storbritannien inte skulle stödja landet, gav vika. Genom fördraget den 3 oktober 1893 avträdde Siam alla sina landområden öster om Mekong, godtog en 25 km bred demilitariserad zon på västra stranden och den franska ockupationen av Chanthaburi och betalade ett skadestånd på tre miljoner franc. Senare fördrag, 1904 och 1907, gav Frankrike de delar av Luang Prabang och Champasak som låg på högra stranden och de kambodjanska provinserna Battambang, Siem Reap och Sisophon, i utbyte mot att Chanthaburi, Trat och Dan Sai utrymdes.
