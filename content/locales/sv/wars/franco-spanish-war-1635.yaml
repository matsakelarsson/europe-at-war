Franco-Spanish War of 1635–1659: Fransk-spanska kriget 1635–1659
The long war between Bourbon France and Habsburg Spain that began as part of the Thirty Years’ War and went on for eleven years after the Peace of Westphalia. France won at Rocroi in 1643 and Lens in 1648, Spain recovered ground while France was torn by the Fronde, and an Anglo-French victory at the Dunes in 1658 led to the Treaty of the Pyrenees, which gave France Roussillon and Artois and marked the shift of power in Europe from Spain to France.: Det långa kriget mellan bourbonernas Frankrike och habsburgarnas Spanien, som började som en del av trettioåriga kriget och fortsatte i elva år efter westfaliska freden. Frankrike segrade vid Rocroi 1643 och Lens 1648, Spanien återvann terräng medan Frankrike slets sönder av fronden, och en engelsk-fransk seger i slaget vid dynerna 1658 ledde till pyreneiska freden, som gav Frankrike Roussillon och Artois och markerade maktförskjutningen i Europa från Spanien till Frankrike.
