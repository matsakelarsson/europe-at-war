The war’s first years, France’s entry in 1635–1636 and its campaigns in Germany, are told in the Thirty Years’ War. Spain also faced the revolts of Catalonia (the Reapers’ War, 1640–1652), in which the Catalans placed themselves under the French crown, and of Portugal (1640–1668), which France supported. Fighting in northern Italy is left out here.: Krigets första år, Frankrikes inträde 1635–1636 och dess fälttåg i Tyskland, berättas under trettioåriga kriget. Spanien mötte också upproren i Katalonien (skördemännens krig, 1640–1652), där katalanerna ställde sig under den franska kronan, och i Portugal (1640–1668), som Frankrike stödde. Striderna i norra Italien är utelämnade här.
Dates are New Style. The English, allies of France from 1657, still used the Julian calendar, ten days behind.: Datumen följer den nya stilen. Engelsmännen, Frankrikes allierade från 1657, använde fortfarande den julianska kalendern, tio dagar efter.
Louis, Duke of Enghien, became Prince of Condé on his father’s death in 1646 and is known as the Great Condé. He won Rocroi and Lens for France, and from 1651 to 1659 fought for Spain.: Ludvig, hertig av Enghien, blev prins av Condé när hans far dog 1646 och är känd som den store Condé. Han vann Rocroi och Lens åt Frankrike och stred 1651–1659 för Spanien.
