After the Spanish invasion of Picardy in 1636 was thrown back, the war slowly turned France’s way. The French took Hesdin in 1639 and Arras, the capital of Artois, after a long siege in 1640. That year Catalonia and Portugal rose against Philip IV’s government; the Catalans put themselves under Louis XIII, and French troops helped them, taking Perpignan in 1642 and with it Roussillon. Cardinal Richelieu died in December 1642 and Louis XIII on 14 May 1643, leaving a four-year-old king, Louis XIV, under the regency of his mother, Anne of Austria, and Cardinal Mazarin.: Sedan den spanska invasionen av Pikardiet 1636 slagits tillbaka vände kriget långsamt till Frankrikes fördel. Fransmännen intog Hesdin 1639 och Arras, Artois huvudstad, efter en lång belägring 1640. Det året reste sig Katalonien och Portugal mot Filip IV:s regering; katalanerna ställde sig under Ludvig XIII, och franska trupper hjälpte dem och intog 1642 Perpignan och därmed Roussillon. Kardinal Richelieu dog i december 1642 och Ludvig XIII den 14 maj 1643, och efterlämnade en fyraårig kung, Ludvig XIV, under förmynderskap av hans mor Anna av Österrike och kardinal Mazarin.
Spain’s commander in the Netherlands, Francisco de Melo, hoped to exploit the change of reign. In May 1643 he invaded through the Ardennes and besieged the small fortress of Rocroi. The 21-year-old Duke of Enghien marched to relieve it and attacked on 19 May. His cavalry routed the Spanish horse on one wing and then fell on the Spanish infantry, the famous tercios, which beat off several attacks before they were broken; Spanish losses in dead and prisoners were very heavy. Rocroi ended the tercios’ reputation for invincibility, and Enghien went on to take Thionville in August.: Spaniens befälhavare i Nederländerna, Francisco de Melo, hoppades kunna utnyttja tronskiftet. I maj 1643 trängde han in genom Ardennerna och belägrade den lilla fästningen Rocroi. Den 21-årige hertigen av Enghien marscherade för att undsätta den och anföll den 19 maj. Hans kavalleri jagade det spanska rytteriet på flykten på ena flygeln och kastade sig sedan över det spanska infanteriet, de berömda tercios, som slog tillbaka flera anfall innan de bröts; de spanska förlusterna i döda och fångar var mycket stora. Rocroi gjorde slut på tercios rykte om oövervinnlighet, och Enghien fortsatte med att inta Thionville i augusti.
