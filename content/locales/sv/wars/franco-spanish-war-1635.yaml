With the Fronde over, Turenne took the offensive. On 25 August 1654 he broke the lines of the Spanish army besieging Arras, though Condé beat him in turn at Valenciennes in 1656. Mazarin then allied with Oliver Cromwell’s England, at war with Spain since 1655, and in 1657 some 6,000 English soldiers joined Turenne, with Dunkirk promised to England. On 14 June 1658 a Spanish army under Don Juan José of Austria and Condé, with English Royalist exiles, tried to relieve besieged Dunkirk and was routed in the dunes east of the town. Dunkirk surrendered on 25 June and was handed to England, and that summer Gravelines, Oudenaarde and Ypres fell to the French.: När fronden var över gick Turenne till offensiv. Den 25 augusti 1654 bröt han linjerna för den spanska armé som belägrade Arras, men Condé besegrade honom i sin tur vid Valenciennes 1656. Mazarin allierade sig då med Oliver Cromwells England, som låg i krig med Spanien sedan 1655, och 1657 anslöt sig omkring 6 000 engelska soldater till Turenne, med löfte om Dunkerque åt England. Den 14 juni 1658 försökte en spansk armé under don Juan José av Österrike och Condé, med engelska rojalistiska landsflyktingar, undsätta det belägrade Dunkerque och slogs på flykten i dynerna öster om staden. Dunkerque kapitulerade den 25 juni och överlämnades till England, och den sommaren föll Gravelines, Oudenaarde och Ypern för fransmännen.
Both crowns were exhausted, and Mazarin and Philip IV’s minister Luis de Haro negotiated for months on Pheasant Island in the Bidasoa, on the border. The Treaty of the Pyrenees, signed on 7 November 1659, gave France Roussillon and northern Cerdagne, most of Artois and a string of fortresses in Flanders, Hainaut and Luxembourg, among them Gravelines, Thionville and Montmédy. France gave up Catalonia, and Condé was pardoned. Louis XIV married Philip’s daughter Maria Theresa, who renounced her claim to the Spanish throne in return for a dowry that Spain never paid.: Båda kronorna var utmattade, och Mazarin och Filip IV:s minister Luis de Haro förhandlade i månader på Fasanön i Bidasoa, vid gränsen. Pyreneiska freden, undertecknad den 7 november 1659, gav Frankrike Roussillon och norra Cerdagne, större delen av Artois och en rad fästningar i Flandern, Hainaut och Luxemburg, bland dem Gravelines, Thionville och Montmédy. Frankrike gav upp Katalonien, och Condé benådades. Ludvig XIV gifte sig med Filips dotter Maria Teresia, som avstod från sitt anspråk på den spanska tronen mot en hemgift som Spanien aldrig betalade.
