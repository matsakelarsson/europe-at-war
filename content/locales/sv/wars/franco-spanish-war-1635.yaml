France pushed into Flanders and took Dunkirk in October 1646, with the Dutch fleet blockading the port. But in January 1648 the Dutch made a separate peace with Spain at Münster, and the Peace of Westphalia that October ended France’s war with the Emperor, not with Spain. On 20 August 1648 Condé, as Enghien now was, beat Archduke Leopold Wilhelm’s army at Lens, the last great battle of the Thirty Years’ War. Days later Paris rose against Mazarin and his war taxes, and barricades went up in the streets. It was the start of the Fronde, a series of revolts that lasted until 1653.: Frankrike trängde in i Flandern och intog Dunkerque i oktober 1646, medan den nederländska flottan blockerade hamnen. Men i januari 1648 slöt nederländarna separatfred med Spanien i Münster, och westfaliska freden i oktober samma år avslutade Frankrikes krig mot kejsaren, inte mot Spanien. Den 20 augusti 1648 besegrade Condé, som Enghien nu hette, ärkehertig Leopold Wilhelms armé vid Lens, trettioåriga krigets sista stora slag. Några dagar senare reste sig Paris mot Mazarin och hans krigsskatter, och barrikader restes på gatorna. Det var början på fronden, en rad revolter som varade till 1653.
The Paris Parlement’s revolt was settled in 1649, but the great nobles took up the fight. Condé, arrested in 1650 and freed in 1651, rebelled and allied with Spain. On 2 July 1652 Turenne, now loyal to the crown, nearly destroyed Condé’s army against the walls of Paris, until the king’s cousin, the Grande Mademoiselle, had the gates opened and the guns of the Bastille fired on the royal troops. Spain used France’s disorder to retake Dunkirk and Gravelines in 1652, and Barcelona surrendered to Philip IV that October, ending the Catalan revolt. Louis XIV returned to Paris the same month, and Condé went over to Spain.: Parisparlamentets revolt bilades 1649, men högadeln tog upp kampen. Condé, som arresterades 1650 och frigavs 1651, gjorde uppror och allierade sig med Spanien. Den 2 juli 1652 förintade Turenne, som nu var lojal mot kronan, nära nog Condés armé mot Paris murar, tills kungens kusin, la Grande Mademoiselle, lät öppna portarna och Bastiljens kanoner beskjuta de kungliga trupperna. Spanien utnyttjade oredan i Frankrike till att återta Dunkerque och Gravelines 1652, och Barcelona kapitulerade för Filip IV i oktober samma år, vilket avslutade det katalanska upproret. Ludvig XIV återvände till Paris samma månad, och Condé gick över till Spanien.
