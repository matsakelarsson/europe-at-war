# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
Franco-Thai War: Fransk-thailändska kriget
? A war between Thailand and the Vichy French administration of Indochina over the lands Siam had ceded to France in 1893, 1904 and 1907. After France’s defeat in Europe in June 1940 and Japan’s entry into northern Indochina in September, the government of Plaek Phibunsongkhram demanded the return of the right bank of the Mekong in Laos and of the Cambodian provinces of Battambang and Siem Reap. Clashes and air raids across the border from November 1940 were followed on 5 January 1941 by a Thai offensive into Cambodia and Laos. The Thai army held off a French counter-attack at Yang Dang Khum and Phum Préav (Ban Phrao) on 16 January, but the next day a French naval squadron sank or disabled three Thai warships off Ko Chang. Japan, which had bases in Indochina and courted Thailand, imposed a ceasefire on 28 January and mediated a settlement. By the Tokyo convention of 9 May 1941 France ceded Battambang, Siem Reap and the lands north of the Dangrek range in Cambodia, and Sainyabuli and the right bank of Champasak in Laos. Thailand celebrated a victory and built the Victory Monument in Bangkok, but returned the territories to France after the Second World War, in November 1946.
: Ett krig mellan Thailand och Vichyfrankrikes förvaltning i Indokina om de landområden som Siam hade avträtt till Frankrike 1893, 1904 och 1907. Efter Frankrikes nederlag i Europa i juni 1940 och Japans inmarsch i norra Indokina i september krävde Plaek Phibunsongkhrams regering att få tillbaka Mekongs högra strand i Laos och de kambodjanska provinserna Battambang och Siem Reap. Sammandrabbningar och flygräder över gränsen från november 1940 följdes den 5 januari 1941 av en thailändsk offensiv in i Kambodja och Laos. Den thailändska armén höll stånd mot ett franskt motanfall vid Yang Dang Khum och Phum Préav (Ban Phrao) den 16 januari, men dagen därpå sänkte eller försatte en fransk flotteskader tre thailändska krigsfartyg ur stridbart skick utanför Ko Chang. Japan, som hade baser i Indokina och uppvaktade Thailand, påtvingade parterna ett eldupphör den 28 januari och medlade fram en uppgörelse. Genom Tokyokonventionen den 9 maj 1941 avträdde Frankrike Battambang, Siem Reap och landområdena norr om Dangrekbergen i Kambodja samt Sainyabuli och den del av Champasak som låg på högra stranden i Laos. Thailand firade en seger och byggde Segermonumentet i Bangkok, men lämnade tillbaka områdena till Frankrike efter andra världskriget, i november 1946.
