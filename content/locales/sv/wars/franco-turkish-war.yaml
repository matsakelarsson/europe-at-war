Treaty of Ankara (1921) (Wikipedia): Ankaraavtalet (1921) (Wikipedia)
Known in France as the Cilicia campaign and in Turkey as the Southern Front of the War of Independence. French troops took over the region from the British in late 1919, and many Armenian survivors of the deportations had returned there.: I Frankrike kallas det Kilikienfälttåget och i Turkiet frihetskrigets sydfront. Franska trupper tog över regionen från britterna i slutet av 1919, och många armeniska överlevande från deportationerna hade återvänt dit.
Maraş is today’s Kahramanmaraş and Aintab today’s Gaziantep, both renamed after the war in honour of their defence.: Maraş är dagens Kahramanmaraş och Aintab dagens Gaziantep, båda omdöpta efter kriget för att hedra deras försvar.
