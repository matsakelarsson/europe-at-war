Franco-Turkish War: Fransk-turkiska kriget
The war between French occupation forces, including the Armenian Legion, and Turkish nationalists in Cilicia and south-eastern Anatolia after the First World War, in which the French gave up Maraş after street fighting in early 1920 that killed thousands of Armenian civilians, and later Urfa, but held Adana and took Aintab after a long siege. Wishing to cut costs and secure Syria, France made peace with the Ankara government in the Agreement of Ankara of 20 October 1921 and left Cilicia by January 1922, and most of the region’s Armenians left with it.: Kriget mellan franska ockupationsstyrkor, däribland Armeniska legionen, och turkiska nationalister i Kilikien och sydöstra Anatolien efter första världskriget, där fransmännen gav upp Maraş efter gatustrider i början av 1920 som dödade tusentals armeniska civila, och senare Urfa, men höll Adana och intog Aintab efter en lång belägring. För att minska kostnaderna och säkra Syrien slöt Frankrike fred med Ankararegeringen genom Ankaraavtalet den 20 oktober 1921 och lämnade Kilikien senast i januari 1922, och de flesta av regionens armenier lämnade området tillsammans med fransmännen.
France and the Armenian Legion: Frankrike och Armeniska legionen
Turkish nationalists (Ankara government): Turkiska nationalister (Ankararegeringen)
