In June 1247 exiled Guelphs seized Parma, an imperial city on the road between Frederick’s allies in Lombardy and the south. Frederick, on his way to Lyon, turned back to besiege it and built a fortified camp outside the walls, a whole town of wooden houses and churches which he named Vittoria, “victory”. On 18 February 1248, while he was out hawking, the hungry Parmesans and their allies sallied, broke into Vittoria and burned it. Thousands of the emperor’s men were killed or captured, his justiciar Thaddeus of Suessa was killed, and his treasury and crown fell into the townspeople’s hands.: I juni 1247 grep landsflyktiga guelfer makten i Parma, en kejserlig stad på vägen mellan Fredriks bundsförvanter i Lombardiet och södern. Fredrik, som var på väg till Lyon, vände om för att belägra staden och byggde ett befäst läger utanför murarna, en hel stad av trähus och kyrkor som han kallade Vittoria, ”seger”. Den 18 februari 1248, medan han var ute på falkjakt, gjorde de hungriga parmesanerna och deras bundsförvanter ett utfall, bröt sig in i Vittoria och brände det. Tusentals av kejsarens män dödades eller tillfångatogs, hans justitiarie Thaddeus av Suessa dödades, och hans skattkammare och krona föll i stadsbornas händer.
The defeat broke the spell of Frederick’s power. His chief minister, Pier della Vigna, was arrested for treason in 1249 and died in prison. On 26 May 1249 the Bolognese beat an imperial army at Fossalta near Modena and captured Enzo, who spent the last 23 years of his life a prisoner in Bologna. Frederick still held much of Italy, and his fortunes were recovering, when he died of dysentery at Castel Fiorentino in Apulia on 13 December 1250. The League broke up, and the papacy carried on the struggle against his sons Conrad IV and Manfred.: Nederlaget bröt förtrollningen kring Fredriks makt. Hans främste minister, Pier della Vigna, arresterades för förräderi 1249 och dog i fängelset. Den 26 maj 1249 besegrade bolognesarna en kejserlig här vid Fossalta nära Modena och tillfångatog Enzo, som tillbringade de sista 23 åren av sitt liv som fånge i Bologna. Fredrik höll fortfarande stora delar av Italien, och hans lycka höll på att vända, när han dog i dysenteri i Castel Fiorentino i Apulien den 13 december 1250. Förbundet upplöstes, och påvedömet fortsatte kampen mot hans söner Konrad IV och Manfred.
