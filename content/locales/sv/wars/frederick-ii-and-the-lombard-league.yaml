Frederick II, Barbarossa’s grandson, was emperor, King of Sicily and, by marriage, King of Jerusalem. The Lombard cities, led by Milan, had renewed their League in 1226 to resist his plans to restore imperial power in the north, and Pope Gregory IX, who feared being surrounded by Frederick’s lands, was their natural ally. Having made peace with the pope in 1230 and put down a revolt by his own son Henry in Germany in 1235, Frederick came to Italy in August 1236. With Ezzelino da Romano, the Ghibelline master of Verona, he took and sacked Vicenza on 1 November.: Fredrik II, Barbarossas sonson, var kejsare, kung av Sicilien och genom giftermål kung av Jerusalem. De lombardiska städerna under Milanos ledning hade förnyat sitt förbund 1226 för att stå emot hans planer på att återupprätta den kejserliga makten i norr, och påven Gregorius IX, som fruktade att omringas av Fredriks länder, var deras naturliga bundsförvant. Sedan Fredrik slutit fred med påven 1230 och slagit ned ett uppror av sin egen son Henrik i Tyskland 1235 kom han till Italien i augusti 1236. Tillsammans med Ezzelino da Romano, ghibellinernas herre i Verona, intog och plundrade han Vicenza den 1 november.
In November 1237 Frederick, with German knights, Saracen archers from Lucera and troops from Cremona and other allied cities, caught the Milanese army crossing the Oglio near Cortenuova. The League’s cavalry fled; its infantry made a stand round the carroccio, the city’s standard-cart, until nightfall and then scattered. Thousands were killed or taken, among them the Milanese podestà Pietro Tiepolo, son of the doge of Venice, and Frederick sent the carroccio to Rome as a trophy. But he demanded unconditional surrender, and Milan and its allies fought on. In 1238 he besieged Brescia from July and withdrew in October, having failed to take it.: I november 1237 överraskade Fredrik, med tyska riddare, saracenska bågskyttar från Lucera och trupper från Cremona och andra allierade städer, den milanesiska hären när den gick över Oglio nära Cortenuova. Förbundets kavalleri flydde; dess fotfolk höll stånd kring carroccion, stadens fanvagn, till nattens inbrott och skingrades sedan. Tusentals dödades eller togs till fånga, bland dem Milanos podestà Pietro Tiepolo, son till dogen av Venedig, och Fredrik skickade carroccion till Rom som trofé. Men han krävde villkorslös kapitulation, och Milano och dess bundsförvanter fortsatte kampen. År 1238 belägrade han Brescia från juli och drog sig tillbaka i oktober utan att ha lyckats inta staden.
