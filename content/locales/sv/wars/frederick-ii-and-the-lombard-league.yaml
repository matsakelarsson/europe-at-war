The party names Guelph and Ghibelline, from the Welf dynasty and the Hohenstaufen castle of Waiblingen, came into use in Italy in these years for the papal and imperial sides. Many cities and lords changed sides; Cremona, Pavia and, under Ezzelino da Romano, Verona and Padua mostly stood by the emperor.: Partinamnen guelfer och ghibelliner, efter welfiska ätten och hohenstaufiska borgen Waiblingen, kom under dessa år i bruk i Italien för den påvliga och den kejserliga sidan. Många städer och herrar bytte sida; Cremona, Pavia och, under Ezzelino da Romano, Verona och Padua stod för det mesta på kejsarens sida.
Frederick had already been excommunicated in 1227 for delaying his crusade, and papal troops invaded his kingdom while he was in the Holy Land (the War of the Keys, 1228–1230). That conflict ended with the Peace of San Germano in 1230 and is not told here.: Fredrik hade redan bannlysts 1227 för att han dröjde med sitt korståg, och påvliga trupper föll in i hans kungarike medan han var i Heliga landet (nyckelkriget, 1228–1230). Den konflikten avslutades med freden i San Germano 1230 och berättas inte här.
