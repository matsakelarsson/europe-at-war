Gregory IX excommunicated Frederick again on 20 March 1239, and Genoa and Venice joined the League. Frederick made his son Enzo, newly married to the heiress of Torres and Gallura in Sardinia, his legate for Italy, and occupied the papal duchy of Spoleto and March of Ancona. He took Ravenna in 1240 and Faenza in April 1241, after an eight-month siege. When Gregory called a council to Rome to depose him, a Sicilian and Pisan fleet intercepted the Genoese galleys carrying the prelates off the island of Giglio on 3 May 1241 and captured two cardinals and about a hundred bishops and abbots.: Gregorius IX bannlyste Fredrik på nytt den 20 mars 1239, och Genua och Venedig anslöt sig till förbundet. Fredrik gjorde sin son Enzo, nygift med arvtagerskan till Torres och Gallura på Sardinien, till sin legat för Italien och ockuperade det påvliga hertigdömet Spoleto och Anconamarken. Han intog Ravenna 1240 och Faenza i april 1241, efter en åtta månader lång belägring. När Gregorius sammankallade ett koncilium i Rom för att avsätta honom genskjöt en siciliansk och pisansk flotta de genuesiska galärer som förde prelaterna, utanför ön Giglio den 3 maj 1241, och tillfångatog två kardinaler och omkring hundra biskopar och abbotar.
Frederick’s army closed on Rome, but Gregory died on 22 August 1241 and Frederick drew back. The next pope, Innocent IV, elected in 1243, proved a harder opponent still. That year Viterbo, urged on by Cardinal Raniero Capocci, rose against its imperial garrison and beat off Frederick’s siege, and in 1244 Innocent escaped by sea to Genoa and went on to Lyon, beyond Frederick’s reach. On 17 July 1245 the Council of Lyon declared Frederick deposed and released his subjects from their oaths, and the pope had a crusade preached against him.: Fredriks här närmade sig Rom, men Gregorius dog den 22 augusti 1241 och Fredrik drog sig tillbaka. Nästa påve, Innocentius IV, vald 1243, visade sig bli en ännu svårare motståndare. Det året reste sig Viterbo, påeggat av kardinal Raniero Capocci, mot sin kejserliga garnison och slog tillbaka Fredriks belägring, och 1244 flydde Innocentius sjövägen till Genua och fortsatte till Lyon, utom räckhåll för Fredrik. Den 17 juli 1245 förklarade konciliet i Lyon Fredrik avsatt och löste hans undersåtar från deras eder, och påven lät predika ett korståg mot honom.
