Frederick II’s war with the Lombard League: Fredrik II:s krig mot Lombardiska förbundet
The war between the emperor Frederick II, also King of Sicily, and the Lombard League led by Milan, allied with Popes Gregory IX and Innocent IV. Frederick crushed the Milanese at Cortenuova in 1237 but could not take Brescia or Milan; excommunicated and declared deposed, he lost his siege camp at Parma in 1248 and his son Enzo at Fossalta in 1249, and the war ended with his death in 1250.: Kriget mellan kejsar Fredrik II, tillika kung av Sicilien, och Lombardiska förbundet under Milanos ledning, allierat med påvarna Gregorius IX och Innocentius IV. Fredrik krossade milaneserna vid Cortenuova 1237 men kunde inte inta Brescia eller Milano; bannlyst och förklarad avsatt förlorade han sitt belägringsläger vid Parma 1248 och sin son Enzo vid Fossalta 1249, och kriget upphörde med hans död 1250.
