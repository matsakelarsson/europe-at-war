# Svenska översättningar av katalogtexten (våg 13); stegtexterna kommer senare.
Free State–Basotho wars: Krigen mellan Oranjefristaten och basotho
? Three wars between the Orange Free State and the Basotho kingdom of Moshoeshoe over the fertile lowlands of the Caledon valley. Moshoeshoe had built his kingdom around the mountain stronghold of Thaba Bosiu in the 1820s, and his people farmed the lowlands on both sides of the Caledon, where white farmers also settled from the 1830s. British attempts to draw a boundary, the Warden Line of 1849, failed; the Basotho defeated a British force at Viervoet in 1851 and fought another to a standstill at Berea in 1852, and in 1854 Britain withdrew and left the Orange Free State to deal with the Basotho. In Senekal’s War of 1858 Free State commandos failed to take Thaba Bosiu and the governor of the Cape, Sir George Grey, mediated a peace. In the Seqiti War of 1865–1866 the Free State, under President Jan Brand, again failed to storm Thaba Bosiu but destroyed crops and seized cattle until Moshoeshoe, short of food, ceded most of his arable land. When war resumed in 1867 the Free State overran almost everything but Thaba Bosiu, and Moshoeshoe asked for British protection. On 12 March 1868 Britain proclaimed Basutoland British territory, and the Convention of Aliwal North of 1869 fixed the border that Lesotho has today, leaving the Conquered Territory west of the Caledon to the Free State.
: Tre krig mellan Oranjefristaten och Moshoeshoes Basothorike om de bördiga lågländerna i Caledondalen. Moshoeshoe hade byggt upp sitt rike kring bergsfästet Thaba Bosiu på 1820-talet, och hans folk odlade lågländerna på båda sidor om Caledon, där även vita farmare slog sig ned från 1830-talet. Brittiska försök att dra en gräns, Wardenlinjen 1849, misslyckades; basotho besegrade en brittisk styrka vid Viervoet 1851 och tvingade en annan till ett dödläge vid Berea 1852, och 1854 drog sig Storbritannien tillbaka och lämnade åt Oranjefristaten att hantera basotho. I Senekals krig 1858 misslyckades fristatens kommandon med att inta Thaba Bosiu, och Kapkolonins guvernör, Sir George Grey, medlade fram en fred. I Seqitikriget 1865–1866 misslyckades fristaten, under president Jan Brand, åter med att storma Thaba Bosiu men förstörde grödor och tog boskap tills Moshoeshoe, som led brist på mat, avträdde större delen av sin odlingsbara mark. När kriget återupptogs 1867 erövrade fristaten nästan allt utom Thaba Bosiu, och Moshoeshoe bad om brittiskt beskydd. Den 12 mars 1868 proklamerade Storbritannien Basutoland som brittiskt territorium, och konventionen i Aliwal North 1869 fastställde den gräns som Lesotho har i dag och lämnade det erövrade territoriet (Conquered Territory) väster om Caledon åt fristaten.
