# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
French and Indian War: Fransk-indianska kriget
? The war in North America between Great Britain and France, with their colonies and Native allies, that began two years before the Seven Years’ War in Europe and decided the fate of New France. It started in 1754 in the Ohio country, claimed by both empires and home to the Lenape, Shawnee and Mingo, when George Washington’s Virginians and Tanaghrisson’s Mingo attacked a French party at Jumonville Glen and were forced to surrender at Fort Necessity. In 1755 a British army under Edward Braddock was destroyed on the Monongahela by French troops and Native warriors, and the British began the expulsion of the Acadians from Nova Scotia. Under Montcalm the French took Oswego in 1756 and Fort William Henry in 1757, where Native warriors attacked the surrendered garrison, and beat a far larger British army at Carillon in 1758. But William Pitt poured troops, ships and money into America, the Royal Navy cut New France off from France, and the treaty of Easton drew the Ohio nations out of the war. The British took Louisbourg, Fort Frontenac and Fort Duquesne in 1758, Niagara, Ticonderoga and Quebec in 1759, after Wolfe’s victory on the Plains of Abraham, and in 1760, after a last French victory at Sainte-Foy, three British armies converged on Montreal, where Governor Vaudreuil surrendered Canada. France gave Louisiana west of the Mississippi to Spain by the secret Treaty of Fontainebleau of 1762, and by the Treaty of Paris of 1763 ceded Canada and its lands east of the river to Britain, while Spain ceded Florida to Britain. The Native nations, not consulted, rose within months in Pontiac’s War.
: Kriget i Nordamerika mellan Storbritannien och Frankrike, med deras kolonier och ursprungsamerikanska allierade, som började två år före sjuårskriget i Europa och avgjorde Nya Frankrikes öde. Det började 1754 i Ohiolandet, som båda imperierna gjorde anspråk på och där lenape, shawnee och mingo hade sina hem, när George Washingtons män från Virginia och Tanaghrissons mingo anföll en fransk trupp vid Jumonville Glen och sedan tvingades kapitulera vid Fort Necessity. År 1755 förintades en brittisk armé under Edward Braddock vid Monongahela av franska trupper och ursprungsamerikanska krigare, och britterna inledde fördrivningen av akadierna från Nova Scotia. Under Montcalm intog fransmännen Oswego 1756 och Fort William Henry 1757, där ursprungsamerikanska krigare anföll den garnison som hade kapitulerat, och slog en långt större brittisk armé vid Carillon 1758. Men William Pitt pumpade in trupper, skepp och pengar i Amerika, Royal Navy skar av förbindelserna mellan Nya Frankrike och Frankrike, och fördraget i Easton fick Ohionationerna att lämna kriget. Britterna intog Louisbourg, Fort Frontenac och Fort Duquesne 1758, Niagara, Ticonderoga och Québec 1759, efter Wolfes seger på Abrahamsslätten, och 1760, efter en sista fransk seger vid Sainte-Foy, drog tre brittiska arméer samman mot Montréal, där guvernör Vaudreuil överlämnade Kanada. Frankrike gav Louisiana väster om Mississippi till Spanien genom det hemliga fördraget i Fontainebleau 1762 och avträdde genom freden i Paris 1763 Kanada och sina landområden öster om floden till Storbritannien, medan Spanien avträdde Florida till Storbritannien. Ursprungsnationerna, som inte hade rådfrågats, reste sig inom några månader i Pontiacs krig.
Great Britain, British America and their Native allies (Mohawk and, from 1759, other Haudenosaunee; Cherokee and Catawba; Stockbridge Mohican): Storbritannien, Brittiska Amerika och deras ursprungsamerikanska allierade (mohawker och från 1759 andra haudenosaunee; cherokeser och catawba; stockbridgemohikaner)
France, New France and their Native allies (the nations of the Great Lakes and the Ohio, the Wabanaki, the Seven Nations of Canada), with Acadian militia: Frankrike, Nya Frankrike och deras ursprungsamerikanska allierade (nationerna vid Stora sjöarna och Ohio, wabanaki, Kanadas sju nationer), med akadisk milis
