French campaign against Korea: Franska fälttåget mot Korea
? A French punitive expedition to Korea, called Byeongin Yangyo in Korean (“the Western disturbance of 1866”). Early in 1866 the government of the regent Heungseon Daewongun executed nine French Catholic missionaries and thousands of Korean converts. Rear Admiral Pierre-Gustave Roze, commander of the French squadron in the Far East, surveyed the Han River up to the outskirts of Hanseong in September and returned in October with seven ships and about 800 men. His marines took the town of Ganghwa on 16 October and held it for nearly four weeks, carrying off silver, weapons and books from the royal library there. But a landing at Munsusanseong on the mainland was driven back on 26 October, and on 9 November Korean tiger hunters under Yang Heon-su repulsed an attack on Jeongjoksanseong. Roze burned the government buildings of Ganghwa and withdrew on 11 November. The Daewongun treated the outcome as a victory and hardened Korea’s isolation; the looted royal protocols were returned to Korea on a renewable loan in 2011.
: En fransk straffexpedition till Korea, på koreanska kallad Byeongin Yangyo (”den västerländska oron 1866”). I början av 1866 avrättade regenten Heungseon Daewonguns regering nio franska katolska missionärer och tusentals koreanska konvertiter. Konteramiral Pierre-Gustave Roze, befälhavare för den franska eskadern i Fjärran Östern, kartlade Hanfloden upp till utkanten av Hanseong i september och återvände i oktober med sju fartyg och omkring 800 man. Hans marinsoldater intog staden Ganghwa den 16 oktober och höll den i nästan fyra veckor, och de förde bort silver, vapen och böcker från det kungliga biblioteket där. Men en landstigning vid Munsusanseong på fastlandet slogs tillbaka den 26 oktober, och den 9 november slog koreanska tigerjägare under Yang Heon-su tillbaka ett angrepp på Jeongjoksanseong. Roze brände regeringsbyggnaderna i Ganghwa och drog sig tillbaka den 11 november. Daewongun framställde utgången som en seger och skärpte Koreas isolering; de plundrade kungliga protokollen återlämnades till Korea som ett förnybart lån 2011.
