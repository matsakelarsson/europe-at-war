# Svenska översättningar av katalogtexten (våg 12); stegtexterna kommer senare.
French conquest of Algeria: Frankrikes erövring av Algeriet
? The seventy-year war in which France conquered Algeria. A quarrel over debts and the dey’s blow with a fly-whisk in 1827 led to a blockade and, in June 1830, to a landing at Sidi Ferruch; Algiers capitulated on 5 July and Ottoman rule ended. France held only a few coastal towns at first. In the west Abd al-Qadir, chosen emir in 1832, built a state that France recognised by the treaties of 1834 and 1837, and in the east Ahmed Bey held Constantine until it was stormed in 1837. From 1840 Marshal Bugeaud fought a war of destruction, with mobile columns burning crops and villages and seizing herds; Abd al-Qadir lost his capitals and his mobile camp, and after Morocco was defeated at Isly in 1844 he surrendered in 1847. The oases, the high plateaus and Kabylia (1857) followed, the great Mokrani revolt of 1871 was crushed and punished with land confiscations, and between 1881 and 1903 French columns took the oases of the Sahara and defeated the Tuareg of the Hoggar. Estimates of the Algerian dead between 1830 and the 1860s, from war, famine and disease, range from about 500,000 to a million, out of some three million people.
: Det sjuttioåriga krig genom vilket Frankrike erövrade Algeriet. En tvist om skulder och dejens slag med en flugviska 1827 ledde till en blockad och i juni 1830 till en landstigning vid Sidi Ferruch; Alger kapitulerade den 5 juli och det osmanska styret upphörde. Till en början behärskade Frankrike bara några kuststäder. I väster byggde Abd al-Qadir, som valdes till emir 1832, upp en stat som Frankrike erkände genom fördragen 1834 och 1837, och i öster höll Ahmed bej Constantine tills staden stormades 1837. Från 1840 förde marskalk Bugeaud ett förödelsekrig, där rörliga kolonner brände grödor och byar och rövade boskapshjordar; Abd al-Qadir förlorade sina huvudstäder och sitt rörliga läger, och sedan Marocko besegrats vid Isly 1844 kapitulerade han 1847. Oaserna, högplatåerna och Kabylien (1857) följde, det stora Mokraniupproret 1871 slogs ned och straffades med jordkonfiskationer, och mellan 1881 och 1903 intog franska kolonner Saharas oaser och besegrade tuaregerna i Hoggar. Uppskattningarna av antalet döda algerier mellan 1830 och 1860-talet, genom krig, hungersnöd och sjukdomar, varierar från omkring 500 000 till en miljon, av en befolkning på omkring tre miljoner.
