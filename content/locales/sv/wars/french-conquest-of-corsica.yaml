Borgo and Ponte Novu: Borgo och Ponte Novu
May 1768 – June 1769: maj 1768 – juni 1769
The Corsican Republic, proclaimed in 1755, was never recognised by the European powers, so the base map shows Corsica as Genoese until the Treaty of Versailles and French after it.: Den korsikanska republiken, utropad 1755, erkändes aldrig av de europeiska makterna, så baskartan visar Korsika som genuesiskt fram till fördraget i Versailles och som franskt därefter.
Places are given in their Italian or French forms of the time; Ponte Novu is Corsican for “new bridge” (Ponte Nuovo in Italian).: Orterna anges i sina dåtida italienska eller franska former; Ponte Novu är korsikanska för ”ny bro” (Ponte Nuovo på italienska).
