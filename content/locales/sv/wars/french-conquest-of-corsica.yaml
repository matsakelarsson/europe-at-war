French conquest of Corsica: Frankrikes erövring av Korsika
The war in which France, having acquired Genoa’s rights to Corsica in 1768, conquered the island from Pasquale Paoli’s Corsican Republic. The Corsicans beat a French force at Borgo in October 1768, but a much larger French army under the Comte de Vaux broke their resistance at Ponte Novu in May 1769, and Paoli went into exile in Britain.: Kriget där Frankrike, som 1768 hade förvärvat Genuas rättigheter till Korsika, erövrade ön från Pasquale Paolis korsikanska republik. Korsikanerna besegrade en fransk styrka vid Borgo i oktober 1768, men en mycket större fransk armé under greven av Vaux bröt deras motstånd vid Ponte Novu i maj 1769, och Paoli gick i exil i Storbritannien.
