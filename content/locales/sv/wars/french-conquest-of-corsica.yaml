French success: Franska framgångar
Genoa had ruled Corsica since the Middle Ages, but from 1729 the islanders were in almost constant revolt, and in 1755 Pasquale Paoli set up an independent republic with its own constitution, written in Italian, and a capital and later a university at Corte. By the 1760s the Genoese held only a few walled coastal towns, garrisoned by French troops. Unable to subdue the island or to repay its debts to France, Genoa handed Corsica over by the Treaty of Versailles of 15 May 1768, and French troops began to occupy the interior. Paoli called the Corsicans to resist. On 8 October 1768 at Borgo, south of Bastia, his men surrounded a French garrison of some 700 men, beat off the troops sent from Bastia to relieve it, and forced it to surrender.: Genua hade styrt Korsika sedan medeltiden, men från 1729 var öborna i nästan ständigt uppror, och 1755 upprättade Pasquale Paoli en självständig republik med en egen författning, skriven på italienska, och med huvudstad och senare ett universitet i Corte. På 1760-talet höll genueserna bara några befästa kuststäder, med franska garnisoner. Eftersom Genua varken kunde kuva ön eller betala tillbaka sina skulder till Frankrike överlämnade republiken Korsika genom fördraget i Versailles den 15 maj 1768, och franska trupper började ockupera det inre av ön. Paoli uppmanade korsikanerna att göra motstånd. Den 8 oktober 1768 vid Borgo, söder om Bastia, omringade hans män en fransk garnison på omkring 700 man, slog tillbaka de trupper som skickades från Bastia för att undsätta den och tvingade den att kapitulera.
Louis XV briefly considered giving up, but his minister Choiseul sent reinforcements that raised the French army on the island to about 24,000 men, under the Comte de Vaux. In May 1769 de Vaux advanced up the Golo valley towards Corte. On 8–9 May the Corsicans tried to hold the river crossing at Ponte Novu; caught between the French and the fire of foreign mercenaries holding the bridge behind them, they were cut down in large numbers. Resistance collapsed, and in June Paoli sailed into exile in Britain. France made Corsica a province in 1770, though guerrilla resistance went on for years. Napoleon Bonaparte was born at Ajaccio on 15 August 1769, to parents who had fought with Paoli.: Ludvig XV övervägde en kort tid att ge upp, men hans minister Choiseul sände förstärkningar som ökade den franska armén på ön till omkring 24 000 man, under greven av Vaux. I maj 1769 ryckte de Vaux fram uppför Golodalen mot Corte. Den 8–9 maj försökte korsikanerna hålla flodövergången vid Ponte Novu; fångade mellan fransmännen och elden från utländska legosoldater som höll bron bakom dem, höggs de ned i stort antal. Motståndet bröt samman, och i juni seglade Paoli i exil till Storbritannien. Frankrike gjorde Korsika till en provins 1770, även om gerillamotståndet fortsatte i flera år. Napoleon Bonaparte föddes i Ajaccio den 15 augusti 1769, son till föräldrar som hade kämpat på Paolis sida.
