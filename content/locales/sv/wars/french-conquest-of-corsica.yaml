After ten hours of fighting the relief force fell back to Bastia and the French garrison surrendered. Corsicans still sing of the victory.: Efter tio timmars strid föll undsättningsstyrkan tillbaka till Bastia och den franska garnisonen kapitulerade. Korsikanerna sjunger än i dag om segern.
Bastia: Bastia
The old Genoese capital and main port was the French base for the conquest.: Den gamla genuesiska huvudstaden och främsta hamnen var den franska basen för erövringen.
8–9 May 1769: 8–9 maj 1769
The defeat at the Genoese bridge over the Golo opened the road to Corte and ended the Corsican Republic. How the Corsicans came under fire from their own side is still disputed.: Nederlaget vid den genuesiska bron över Golo öppnade vägen till Corte och gjorde slut på den korsikanska republiken. Hur korsikanerna kom att beskjutas av sin egen sida är fortfarande omstritt.
