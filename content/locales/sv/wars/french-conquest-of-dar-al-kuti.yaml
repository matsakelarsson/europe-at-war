# Svenska översättningar av katalogtexten (våg 13); stegtexterna kommer senare.
French conquest of Dar al-Kuti: Frankrikes erövring av Dar al-Kuti
? "The rise and fall of Dar al-Kuti under Muhammad al-Sanusi and its conquest by France. Dar al-Kuti, in the north of today’s Central African Republic, began about 1830 as a frontier province of Dar Runga and its overlord, the sultanate of Wadai, from which horsemen raided the Banda and other peoples to the south for captives. In 1890 Rabih az-Zubayr, then the strongest power in the region, deposed its governor Kobur and installed Kobur’s nephew Muhammad al-Sanusi, born in Wadai about 1850 and a member of the Sanusiyya Sufi order, whose daughter married Rabih’s son Fadlallah. On 9 April 1891 al-Sanusi’s men killed the French explorer Paul Crampel and his companions, who were trying to open a route from the Ubangi to Lake Chad. In October 1894 a Wadai army destroyed al-Sanusi’s capital, Chá; after two years on the move he built a new fortified town (tata) at N’Délé, from which his armies raided the Banda and other peoples of the Ubangi–Chari watershed on a large scale. Captives were sold north through Wadai into the trans-Saharan trade or kept in Dar al-Kuti, and a French resident later described wide tracts of empty, devastated land; the historian Dennis Cordell places Dar al-Kuti among the last states that fed the trans-Saharan slave trade, while noting that the number of people it enslaved cannot be calculated. Al-Sanusi chose to deal with France: on 28 August 1897 he signed a treaty of trade and protectorate with Émile Gentil, revised on 18 February 1903 and 26 January 1908, and kept his independence in practice. After France took Wadai’s capital, Abéché, in 1909, it set out to rule Dar al-Kuti directly. Al-Sanusi died at N’Délé on 12 January 1911, killed by French troops; some accounts say he fell fighting, others that he was assassinated. His son Kamun withdrew east to Ouanda Djallé and resisted until Captain Souclier took the town on 17 December 1912, when Kamun went into exile in the Anglo-Egyptian Sudan. Dar al-Kuti became a district of Ubangi-Shari; it is now the prefecture of Bamingui-Bangoran, and al-Sanusi’s descendants still hold the title of sultan at N’Délé."
: "Dar al-Kutis uppgång och fall under Muhammad al-Sanusi och Frankrikes erövring av riket. Dar al-Kuti, i norra delen av dagens Centralafrikanska republiken, uppstod omkring 1830 som en gränsprovins under Dar Runga och dess överherre, sultanatet Wadai, varifrån ryttare gjorde räder mot banda och andra folk i söder för att ta fångar. År 1890 avsatte Rabih az-Zubayr, då den starkaste makten i regionen, dess guvernör Kobur och insatte Koburs nevö Muhammad al-Sanusi, född i Wadai omkring 1850 och medlem av sufiorden Sanusiyya; hans dotter gifte sig med Rabihs son Fadlallah. Den 9 april 1891 dödade al-Sanusis män den franske upptäcktsresanden Paul Crampel och hans följeslagare, som försökte öppna en väg från Ubangi till Tchadsjön. I oktober 1894 förstörde en armé från Wadai al-Sanusis huvudstad Chá; efter två år på vandring byggde han en ny befäst stad (tata) i N’Délé, varifrån hans arméer i stor skala plundrade banda och andra folk vid vattendelaren mellan Ubangi och Chari. Fångarna såldes norrut genom Wadai till den transsahariska handeln eller hölls kvar i Dar al-Kuti, och en fransk resident beskrev senare vidsträckta områden av tomt, ödelagt land; historikern Dennis Cordell räknar Dar al-Kuti till de sista stater som försåg den transsahariska slavhandeln, men påpekar samtidigt att antalet människor som riket förslavade inte går att beräkna. Al-Sanusi valde att förhandla med Frankrike: den 28 augusti 1897 undertecknade han ett handels- och protektoratsfördrag med Émile Gentil, reviderat den 18 februari 1903 och den 26 januari 1908, och behöll i praktiken sin självständighet. Sedan Frankrike hade intagit Wadais huvudstad Abéché 1909 inriktade det sig på att styra Dar al-Kuti direkt. Al-Sanusi dog i N’Délé den 12 januari 1911, dödad av franska trupper; enligt vissa framställningar stupade han i strid, enligt andra mördades han. Hans son Kamun drog sig österut till Ouanda Djallé och gjorde motstånd tills kapten Souclier intog staden den 17 december 1912, då Kamun gick i exil i Anglo-egyptiska Sudan. Dar al-Kuti blev ett distrikt i Ubangi-Shari; i dag är det prefekturen Bamingui-Bangoran, och al-Sanusis ättlingar bär fortfarande sultantiteln i N’Délé."
