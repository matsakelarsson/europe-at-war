# Svenska översättningar av katalogtexten (våg 13); stegtexterna kommer senare.
French conquest of Futa Jallon: Den franska erövringen av Futa Jallon
? The French campaign that ended the independence of the Imamate of Futa Jallon, the Fulbe Muslim state of the Guinea highlands founded in the jihad of the 1720s. Futa Jallon was a federation of provinces under an almami at Timbo, chosen in turn from two rival houses, the Alfaya and the Soriya; it took subsidies from the British in Sierra Leone as well as dealing with the French, and helped Samori Touré in his wars with France. The Anglo-French agreement of 1889 put it in the French sphere. Bokar Biro of the Soriya seized power in 1890 by killing his brother and fought the provincial chiefs, among them Alfa Yaya of Labé, who wanted more autonomy; some of them asked the French for help. In March 1896 the French envoy Raoul de Beeckman came to Timbo with troops and demanded the right to build roads, to keep a resident and to approve the provincial chiefs. Bokar Biro appeared to sign, but where his signature should have been he had written “Bismillah”, “in the name of God”. When his term ended in April 1896 he refused to hand over office, and Futa Jallon drifted towards civil war. At the end of the rains French columns from Senegal, French Guinea and the French Sudan converged on the country and took Timbo on 3 November. Few chiefs joined Bokar Biro, and on 13 November 1896 his army was destroyed by tirailleurs and artillery, fighting alongside the Fulbe of his rival Umaru Bademba, on the plain of Porédaka. Bokar Biro escaped from the field but was caught and killed by men of a rival chief. France made Umaru Bademba almami of a reduced state, recognised Alfa Yaya’s Labé as separate, and a few months later imposed a protectorate treaty; in 1904 it removed the chiefs’ remaining powers, and in 1905 it arrested Alfa Yaya and sent him into exile.
: Det franska fälttåg som gjorde slut på självständigheten för imamatet Futa Jallon, den muslimska fulbestaten i Guineas högland som hade grundats genom jihaden på 1720-talet. Futa Jallon var en federation av provinser under en almami i Timbo, som valdes växelvis ur två rivaliserande hus, alfaya och soriya; staten tog emot understöd från britterna i Sierra Leone och förhandlade samtidigt med fransmännen, och den hjälpte Samori Touré i hans krig mot Frankrike. Det brittisk-franska avtalet 1889 placerade den i den franska intressesfären. Bokar Biro av soriya tog makten 1890 genom att döda sin bror och stred mot provinshövdingarna, bland dem Alfa Yaya av Labé, som ville ha större självstyre; några av dem bad fransmännen om hjälp. I mars 1896 kom det franska sändebudet Raoul de Beeckman till Timbo med trupper och krävde rätt att bygga vägar, att hålla en resident och att godkänna provinshövdingarna. Bokar Biro tycktes skriva under, men där hans namnteckning skulle ha stått hade han skrivit ”Bismillah”, ”i Guds namn”. När hans mandatperiod löpte ut i april 1896 vägrade han att lämna ifrån sig ämbetet, och Futa Jallon gled mot inbördeskrig. I slutet av regntiden ryckte franska kolonner från Senegal, Franska Guinea och Franska Sudan från olika håll in i landet och intog Timbo den 3 november. Få hövdingar anslöt sig till Bokar Biro, och den 13 november 1896 förintades hans armé på slätten vid Porédaka av tiraljörer och artilleri, som stred sida vid sida med hans rival Umaru Badembas fulbe. Bokar Biro flydde från slagfältet men infångades och dödades av en rivaliserande hövdings män. Frankrike gjorde Umaru Bademba till almami över en beskuren stat, erkände Alfa Yayas Labé som separat och påtvingade några månader senare ett protektoratsfördrag; 1904 tog Frankrike ifrån hövdingarna deras återstående makt, och 1905 arresterade det Alfa Yaya och sände honom i landsflykt.
