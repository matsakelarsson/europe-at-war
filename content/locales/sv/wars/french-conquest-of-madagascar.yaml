# Svenska översättningar av katalogtexten (våg 13); stegtexterna kommer senare.
French conquest of Madagascar: Frankrikes erövring av Madagaskar
? The French invasion that ended the independence of the Merina kingdom of Madagascar, and the Menalamba rising that followed. After Queen Ranavalona III’s government refused a full French protectorate in October 1894, French forces occupied Tamatave in December and Majunga in January 1895. An expeditionary corps of about 15,000 men under General Jacques Duchesne landed at Majunga and marched up the Betsiboka, building a road for its carts as it went; malaria and other diseases killed more than 5,700 of its men, while only 25 died in combat. From Andriba a flying column of some 4,250 men pushed through to Antananarivo, shelled the royal palace on 30 September 1895 and forced the queen to accept a protectorate. In November 1895 the Menalamba (“red shawls”), a rural rising against the French, the Christian court and its forced labour, broke out around the capital and by mid-1896 besieged it. France annexed Madagascar in August 1896 and sent General Joseph Gallieni, who executed leading Merina nobles, crushed the rising by mid-1897, deposed and exiled the queen and abolished the monarchy on 28 February 1897. Resistance continued in other parts of the island for some years; estimates of the Malagasy dead in the rising and its suppression run up to about 100,000.
: Den franska invasion som gjorde slut på Merinarikets självständighet på Madagaskar, och det menalambauppror som följde. Sedan drottning Ranavalona III:s regering i oktober 1894 hade vägrat godta ett fullständigt franskt protektorat besatte franska styrkor Tamatave i december och Majunga i januari 1895. En expeditionskår på omkring 15 000 man under general Jacques Duchesne landsteg i Majunga och marscherade uppför Betsiboka medan den byggde en väg för sina kärror; malaria och andra sjukdomar dödade mer än 5 700 av dess män, medan endast 25 stupade i strid. Från Andriba trängde en flygande kolonn på omkring 4 250 man fram till Antananarivo, besköt kungapalatset den 30 september 1895 och tvingade drottningen att godta ett protektorat. I november 1895 bröt menalamba (”röda sjalar”), ett landsbygdsuppror mot fransmännen, det kristna hovet och dess tvångsarbete, ut kring huvudstaden, och i mitten av 1896 belägrade upprorsmännen den. Frankrike annekterade Madagaskar i augusti 1896 och sände general Joseph Gallieni, som avrättade ledande merinaadelsmän, krossade upproret i mitten av 1897, avsatte drottningen och skickade henne i exil och avskaffade monarkin den 28 februari 1897. Motståndet fortsatte i andra delar av ön i några år; uppskattningarna av antalet döda malagasser i upproret och när det slogs ned uppgår till som mest omkring 100 000.
