# Svenska översättningar av katalogtexten (våg 12); stegtexterna kommer senare.
French conquest of Mauritania: Frankrikes erövring av Mauretanien
? The French occupation of the emirates of the western Sahara north of the Senegal river, which became the colony of Mauritania. Moorish (Bidan) society was divided between the warrior (hassane) lineages who ruled the emirates of Trarza, Brakna, Tagant and Adrar and the scholarly (zawaya) lineages whose marabouts led the Sufi brotherhoods, and both lived partly from the labour of slaves and dependants. Xavier Coppolani, a Corsican official from Algeria who knew Arabic and the brotherhoods, won over two great marabouts, Shaykh Sidiyya Baba and Shaykh Saad Bouh, by promising to protect the zawaya from the warriors’ raids, and with their help and some force brought Trarza, Brakna and Tagant under French rule in 1902–1905; France made Mauritania a territory of its own in 1904. A third marabout, Shaykh Ma al-Aynayn, Saad Bouh’s brother, who had built a base at Smara in the north with the help of the sultan of Morocco, proclaimed a holy war in 1904. Coppolani was killed at Tidjikja in May 1905. In 1908–1909 Colonel Henri Gouraud marched into the Adrar and took Atar, the emirs submitted, and Ma al-Aynayn withdrew to Morocco, where he died in 1910. Resistance in the Adrar ended by 1912, but raids by the northern nomads went on until 1934. The French ruled through the emirs and marabouts and left slavery largely in place; Morocco later based part of its claim to Mauritania on Ma al-Aynayn’s allegiance to the sultan.
: Den franska ockupationen av emiraten i västra Sahara norr om Senegalfloden, som blev kolonin Mauretanien. Det moriska (bidan) samhället var delat mellan krigarsläkterna (hassane), som härskade över emiraten Trarza, Brakna, Tagant och Adrar, och de lärda släkterna (zawaya), vars marabouter ledde de sufiska brödraskapen, och båda levde delvis av slavars och beroende människors arbete. Xavier Coppolani, en korsikansk ämbetsman från Algeriet som kunde arabiska och kände brödraskapen, vann över två stora marabouter, shejk Sidiyya Baba och shejk Saad Bouh, genom att lova att skydda zawaya mot krigarnas räder, och med deras hjälp och visst våld förde han Trarza, Brakna och Tagant under franskt styre 1902–1905; Frankrike gjorde Mauretanien till ett eget territorium 1904. En tredje marabout, shejk Ma al-Aynayn, Saad Bouhs bror, som med hjälp av sultanen av Marocko hade byggt upp en bas i Smara i norr, utropade heligt krig 1904. Coppolani dödades i Tidjikja i maj 1905. Åren 1908–1909 marscherade överste Henri Gouraud in i Adrar och intog Atar, emirerna underkastade sig, och Ma al-Aynayn drog sig tillbaka till Marocko, där han dog 1910. Motståndet i Adrar upphörde senast 1912, men räderna från nomaderna i norr fortsatte fram till 1934. Fransmännen styrde genom emirerna och marabouterna och lät slaveriet i stort sett bestå; Marocko grundade senare en del av sina anspråk på Mauretanien på Ma al-Aynayns trohet mot sultanen.
