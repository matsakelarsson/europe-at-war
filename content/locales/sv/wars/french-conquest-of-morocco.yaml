? The French conquest of Morocco, from the occupation of Oujda in 1907 to the last campaigns in the Anti-Atlas in 1934. France, which already ruled Algeria, used the murder of a French doctor in Marrakesh and the killing of European workers at Casablanca in 1907 to occupy Oujda and bombard and land at Casablanca. The crisis helped Abd al-Hafid overthrow his brother Abd al-Aziz in the name of resistance, but he could not stop the French, who relieved Fez in 1911 and imposed the Treaty of Fez on 30 March 1912, making Morocco a protectorate; Spain received a zone in the north. Ahmed al-Hiba, proclaimed sultan in the south, took Marrakesh and was defeated at Sidi Bou Othman in September 1912. Under the first resident-general, Hubert Lyautey, France ruled through the sultan and the great qaids of the south while its columns, increasingly made up of Moroccan goumiers and colonial troops, fought the Zaian confederation of the Middle Atlas, the Rif Republic and the mountain tribes of the High Atlas, the Saghro and the Anti-Atlas. France declared the country conquered in 1934. The French army officially counted about 8,600 dead, and some 12,000 Moroccan auxiliaries died on the French side; Moroccan losses were never counted, but one estimate puts them at about 100,000.
: Den franska erövringen av Marocko, från ockupationen av Oujda 1907 till de sista fälttågen i Antiatlas 1934. Frankrike, som redan styrde Algeriet, använde mordet på en fransk läkare i Marrakech och dödandet av europeiska arbetare i Casablanca 1907 som anledning att ockupera Oujda och att bombardera Casablanca och landstiga där. Krisen hjälpte Abd al-Hafid att i motståndets namn störta sin bror Abd al-Aziz, men han kunde inte hejda fransmännen, som undsatte Fès 1911 och den 30 mars 1912 påtvingade landet fördraget i Fès, som gjorde Marocko till protektorat; Spanien fick en zon i norr. Ahmed al-Hiba, som utropades till sultan i söder, intog Marrakech och besegrades vid Sidi Bou Othman i september 1912. Under den förste generalresidenten, Hubert Lyautey, styrde Frankrike genom sultanen och de stora kaiderna i söder, medan dess kolonner, i allt högre grad bestående av marockanska goumiers och kolonialtrupper, bekämpade zaianförbundet i Mellersta Atlas, Rifrepubliken och bergsstammarna i Höga Atlas, Saghro och Antiatlas. Frankrike förklarade landet erövrat 1934. Den franska armén räknade officiellt omkring 8 600 döda, och omkring 12 000 marockanska hjälptrupper dog på fransk sida; de marockanska förlusterna räknades aldrig, men en uppskattning anger omkring 100 000.
