# Svenska översättningar av katalogtexten (våg 13); stegtexterna kommer senare.
French conquest of Senegal: Den franska erövringen av Senegal
? The wars by which France turned its trading towns at Saint-Louis and Gorée into the colony of Senegal, between the Plan of 1854 and the fall of the last Wolof kingdom in 1890. Under Governor Louis Faidherbe (1854–1865) France conquered Waalo, pushed the Moorish emirs of Trarza and Brakna north of the Senegal river, built a chain of forts up the river and turned back Umar Tall’s jihad at Médine, took Dakar, and fought the Serer kingdoms of Sine and Saloum and the Wolof kingdom of Cayor. It created the tirailleurs sénégalais, African soldiers who did most of the fighting, many of them slaves bought from their owners. The French advance became entangled with the Muslim reform movements of the time, led by Umar Tall, Maba Diakhou Bâ and Shaikh Amadou Ba, which fought the old warrior aristocracies as well as France, and France allied with whichever side served it. Its long contest with Lat Dior of Cayor ended after the Dakar–Saint-Louis railway was built across his kingdom, with his death at Dekhelé in 1886; in 1890 a French column took Yang-Yang, the capital of Jolof, and in 1891 the last strongman of Futa Toro, Abdul Bokar Kan, was killed in flight. By then the colony had almost its present borders; in 1895 it became part of French West Africa.
: De krig genom vilka Frankrike förvandlade sina handelsstäder Saint-Louis och Gorée till kolonin Senegal, mellan planen från 1854 och det sista wolofrikets fall 1890. Under guvernör Louis Faidherbe (1854–1865) erövrade Frankrike Waalo, trängde de moriska emirerna i Trarza och Brakna norr om Senegalfloden, byggde en kedja av fort uppför floden och slog tillbaka Umar Talls jihad vid Médine, intog Dakar och stred mot sererrikena Sine och Saloum och wolofriket Cayor. Frankrike skapade tirailleurs sénégalais, afrikanska soldater som utkämpade det mesta av striderna och av vilka många var slavar som köpts från sina ägare. Den franska framryckningen trasslades in i tidens muslimska reformrörelser, ledda av Umar Tall, Maba Diakhou Bâ och shejk Amadou Ba, som bekämpade de gamla krigararistokratierna lika väl som Frankrike, och Frankrike allierade sig med den sida som för tillfället gagnade det. Dess långa kamp mot Lat Dior av Cayor slutade, sedan järnvägen Dakar–Saint-Louis hade byggts genom hans rike, med hans död vid Dekhelé 1886; 1890 intog en fransk kolonn Yang-Yang, Jolofs huvudstad, och 1891 dödades Futa Toros siste starke man, Abdul Bokar Kan, under flykt. Vid det laget hade kolonin nästan sina nuvarande gränser; 1895 blev den en del av Franska Västafrika.
