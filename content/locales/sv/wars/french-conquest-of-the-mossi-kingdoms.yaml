# Svenska översättningar av katalogtexten (våg 12); stegtexterna kommer senare.
French conquest of the Mossi kingdoms: Frankrikes erövring av mossirikena
? The French conquest of Ouagadougou, the leading Mossi kingdom on the upper Volta, in today’s Burkina Faso. The Mossi kingdoms (Ouagadougou, Yatenga, Tenkodogo, Fada N’Gourma and Boussouma among them) had kept their independence for centuries with their cavalry, but by the 1890s they were divided, Yatenga by civil war, and France, Britain and Germany were racing to sign treaties with them. The Mogho Naba Wobgo (Boukary Koutou), king of Ouagadougou since 1890, turned away the French officer Parfait-Louis Monteil in 1891 and signed a treaty of friendship with George Ekem Ferguson, a Fante agent of the British Gold Coast, in 1894; Yatenga accepted a French protectorate in 1895–1896. In 1896 a French column of tirailleurs under Captain Paul Voulet and Lieutenant Julien Chanoine marched from the Niger bend; Wobgo’s horsemen could not stop it, and Voulet entered Ouagadougou in September 1896 and burned the town. In January 1897 Voulet installed Wobgo’s brother Kouka as Mogho Naba under the name Sighiri, who signed a protectorate treaty. Wobgo appealed to the British in vain and, after further fighting, withdrew to Zongoiri, just across the border in the British Gold Coast, where he died in 1904. Voulet and Chanoine went on to campaign in the Gurunsi country in 1897, and in 1899 led the mission to Lake Chad whose killings made them notorious. France ruled the Mossi through their own kings, made Ouagadougou the capital of the colony of Upper Volta in 1919, and drew heavily on Mossi labour and soldiers.
: Frankrikes erövring av Ouagadougou, det ledande mossiriket vid övre Volta, i dagens Burkina Faso. Mossirikena (bland dem Ouagadougou, Yatenga, Tenkodogo, Fada N’Gourma och Boussouma) hade i århundraden bevarat sin självständighet med hjälp av sitt kavalleri, men på 1890-talet var de splittrade, Yatenga av inbördeskrig, och Frankrike, Storbritannien och Tyskland tävlade om att sluta fördrag med dem. Mogho Naba Wobgo (Boukary Koutou), kung av Ouagadougou sedan 1890, avvisade den franske officeren Parfait-Louis Monteil 1891 och slöt 1894 ett vänskapsfördrag med George Ekem Ferguson, en fanti som var agent för den brittiska Guldkusten; Yatenga godtog ett franskt protektorat 1895–1896. År 1896 marscherade en fransk kolonn av tirailleurer under kapten Paul Voulet och löjtnant Julien Chanoine från Nigerkröken; Wobgos ryttare kunde inte stoppa den, och Voulet tågade in i Ouagadougou i september 1896 och brände staden. I januari 1897 insatte Voulet Wobgos bror Kouka som mogho naba under namnet Sighiri, och denne undertecknade ett protektoratsfördrag. Wobgo vädjade förgäves till britterna och drog sig efter ytterligare strider tillbaka till Zongoiri, strax på andra sidan gränsen i den brittiska Guldkusten, där han dog 1904. Voulet och Chanoine fortsatte med ett fälttåg i gurunsiernas land 1897 och ledde 1899 den expedition till Tchadsjön vars mord gjorde dem ökända. Frankrike styrde mossifolket genom dess egna kungar, gjorde 1919 Ouagadougou till huvudstad i kolonin Övre Volta och tog i stor utsträckning mossifolkets arbetskraft och soldater i anspråk.
