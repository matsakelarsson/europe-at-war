# Svenska översättningar av katalogtexten (våg 12); stegtexterna kommer senare.
French conquest of the Western Sudan: Frankrikes erövring av Västra Sudan
? The campaigns by which France took the lands between the upper Senegal and the Niger bend, today’s Mali, which it called the Western or French Sudan. From the colony of Senegal, officers of the marine troops led by Gustave Borgnis-Desbordes, Joseph Gallieni and Louis Archinard pushed a line of forts from Kayes to Kita (1881) and Bamako (1883), on the route of a planned railway to the Niger, often ahead of orders from Paris. The states in their way were the Toucouleur Empire of Ahmadu Tall, the son of Umar Tall, at Ségou and Nioro; the Wassoulou Empire of Samori Touré to the south; and smaller kingdoms and chiefdoms that made treaties with one side or the other. After a decade of treaties made to buy time on both sides, Archinard took Koundian (1889), Ségou (1890) and Nioro (1891), and in 1893 Djenné and Bandiagara, driving Ahmadu into exile. A column reached Timbuktu in December 1893, where the Tuareg destroyed Eugène Bonnier’s column in January 1894. The conquest ended with the storming of Sikasso, capital of Kénédougou, on 1 May 1898 and the capture of Samori in September. The armies that won it were mostly African, Senegalese tirailleurs and allied or conscripted auxiliaries under French officers; captives were distributed among the victors, and the violence of Archinard’s campaigns was criticised in France at the time.
: De fälttåg genom vilka Frankrike tog länderna mellan övre Senegalfloden och Nigerkröken, dagens Mali, som fransmännen kallade Västra eller Franska Sudan. Från kolonin Senegal drev officerare ur marintrupperna under ledning av Gustave Borgnis-Desbordes, Joseph Gallieni och Louis Archinard fram en kedja av fort från Kayes till Kita (1881) och Bamako (1883), längs sträckningen för en planerad järnväg till Niger, ofta innan Paris hade gett order om det. De stater som stod i vägen var Toucouleurriket under Ahmadu Tall, Umar Talls son, i Ségou och Nioro; Samori Tourés Wassoulourike i söder; och mindre kungadömen och hövdingadömen som slöt fördrag med den ena eller andra sidan. Efter ett årtionde av fördrag som båda sidor slöt för att vinna tid intog Archinard Koundian (1889), Ségou (1890) och Nioro (1891) och 1893 Djenné och Bandiagara, och drev Ahmadu i landsflykt. En kolonn nådde Timbuktu i december 1893, där tuaregerna i januari 1894 tillintetgjorde Eugène Bonniers kolonn. Erövringen avslutades med stormningen av Sikasso, Kénédougous huvudstad, den 1 maj 1898 och tillfångatagandet av Samori i september. De arméer som vann den var till största delen afrikanska, senegalesiska tirailleurer och allierade eller tvångsrekryterade hjälptrupper under franska officerare; fångar fördelades bland segrarna, och våldet under Archinards fälttåg kritiserades redan på sin tid i Frankrike.
