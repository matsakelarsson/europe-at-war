# Svenska översättningar av katalogtexten (våg 12); stegtexterna kommer senare.
French conquest of Tunisia: Frankrikes erövring av Tunisien
The French invasion that made Tunisia a protectorate. Using raids by the Kroumir tribes across the Algerian border as a pretext, France sent about 24,000 men from Algeria into north-western Tunisia on 24 April 1881 and landed another force at Bizerte on 1 May. On 12 May Muhammad III as-Sadiq, the bey of Tunis, signed the Treaty of Bardo, which gave France control of the regency’s foreign relations and the right to station troops. In June the south and centre rose against the occupation and the bey who had accepted it. French ships bombarded and stormed Sfax in July, a second, larger expedition took Kairouan without a fight in October, and the last resistance ended in December, while many of the tribes that had risen fled to Ottoman Tripolitania. The conventions of La Marsa in 1883 completed the protectorate, under which the beys reigned until 1957.: Den franska invasion som gjorde Tunisien till protektorat. Med kroumirstammarnas räder över den algeriska gränsen som förevändning sände Frankrike den 24 april 1881 omkring 24 000 man från Algeriet in i nordvästra Tunisien och landsatte den 1 maj ytterligare en styrka i Bizerte. Den 12 maj undertecknade Muhammad III as-Sadiq, bej av Tunis, fördraget i Bardo, som gav Frankrike kontroll över regentskapets utrikesförbindelser och rätt att stationera trupper. I juni reste sig södern och de centrala delarna av landet mot ockupationen och mot bejen som hade godtagit den. Franska fartyg bombarderade och stormade Sfax i juli, en andra och större expedition intog Kairouan utan strid i oktober, och det sista motståndet upphörde i december, medan många av de stammar som hade rest sig flydde till det osmanska Tripolitanien. Konventionerna i La Marsa 1883 fullbordade protektoratet, under vilket bejerna regerade fram till 1957.
