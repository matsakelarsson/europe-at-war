# Svenska översättningar av katalogtexten (våg 12); stegtexterna kommer senare.
French conquest of Wadai: Frankrikes erövring av Wadai
? The French conquest of Wadai, the strongest sultanate of the eastern Sahel, in what is now eastern Chad. After the defeat of Rabih in 1900 France pushed east from Lake Chad and Baguirmi. Wadai, ruled from Abéché by the kolak Muhammad Salih, known as Dud Murra (“the lion of Murra”), was allied with the Senussi order, whose caravans linked it with Kufra and Benghazi, and drew its wealth from that trade and from slave raiding to the south. France backed his cousin Adam Asil as a rival, and in June 1909 a column under Captain Jean-Joseph Fiegenschuh took Abéché and installed Asil. Dud Murra withdrew to the north and then to Dar Masalit, whose sultan Taj ad-Din destroyed Fiegenschuh’s column in January 1910 and defeated another under Lieutenant-Colonel Henri Moll at Doroté in November 1910, where both Moll and Taj ad-Din were killed. Colonel Emmanuel Largeau, returned to command, pressed on, and Dud Murra surrendered at Abéché in October 1911; the French deposed Asil, abolished the sultanate and in 1913 took the Senussi lodge of Aïn Galakka in Borkou. Dar Masalit joined the Anglo-Egyptian Sudan in 1919, and the sultanate of Wadai was restored under French rule in 1935.
: Frankrikes erövring av Wadai, det starkaste sultanatet i östra Sahel, i det som i dag är östra Tchad. Efter Rabihs nederlag 1900 trängde Frankrike österut från Tchadsjön och Baguirmi. Wadai, som styrdes från Abéché av kolak Muhammad Salih, kallad Dud Murra (”lejonet från Murra”), var allierat med senussiorden, vars karavaner förband landet med Kufra och Benghazi, och hämtade sin rikedom från denna handel och från slavräder söderut. Frankrike stödde hans kusin Adam Asil som rival, och i juni 1909 intog en kolonn under kapten Jean-Joseph Fiegenschuh Abéché och insatte Asil. Dud Murra drog sig tillbaka norrut och sedan till Dar Masalit, vars sultan Taj ad-Din tillintetgjorde Fiegenschuhs kolonn i januari 1910 och i november 1910 besegrade en annan under överstelöjtnant Henri Moll vid Doroté, där både Moll och Taj ad-Din stupade. Överste Emmanuel Largeau, som åter hade fått befälet, fortsatte framryckningen, och Dud Murra kapitulerade i Abéché i oktober 1911; fransmännen avsatte Asil, avskaffade sultanatet och intog 1913 senussiordens ordenshus i Aïn Galakka i Borkou. Dar Masalit anslöts till Anglo-egyptiska Sudan 1919, och sultanatet Wadai återupprättades under franskt styre 1935.
