# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
French intervention in Mexico: Franska interventionen i Mexiko
? The invasion of Mexico by Napoleon III’s France and the war between the Mexican Republic of Benito Juárez and the empire France set up under Maximilian of Habsburg. When Juárez’s government, bankrupt after the Reform War, suspended payments on its foreign debts in July 1861, Spain, Britain and France sent troops to Veracruz. Spain and Britain withdrew in April 1862 when it became clear that Napoleon meant to overthrow the republic. On 5 May 1862 Ignacio Zaragoza’s army beat the French at Puebla, the victory remembered as Cinco de Mayo, but a much larger French army took Puebla after a siege in 1863 and entered Mexico City. Mexican conservatives offered the throne to Maximilian, who arrived in 1864. Juárez’s government retreated to the far north and fought on with guerrilla and regular forces. After the American Civil War the United States pressed France to leave, and Napoleon, facing Prussia in Europe, withdrew his army in 1866–1867. The republicans besieged Maximilian at Querétaro, which fell on 15 May 1867; he was shot with his generals Miguel Miramón and Tomás Mejía on 19 June, and Mexico City surrendered two days later.
: Frankrikes invasion av Mexiko under Napoleon III och kriget mellan Benito Juárez mexikanska republik och det kejsardöme som Frankrike upprättade under Maximilian av Habsburg. När Juárez regering, bankrutt efter reformkriget, i juli 1861 ställde in betalningarna på sina utlandsskulder sände Spanien, Storbritannien och Frankrike trupper till Veracruz. Spanien och Storbritannien drog sig tillbaka i april 1862 när det stod klart att Napoleon tänkte störta republiken. Den 5 maj 1862 slog Ignacio Zaragozas armé fransmännen vid Puebla, den seger som lever kvar i minnet som Cinco de Mayo, men en mycket större fransk armé intog Puebla efter en belägring 1863 och tågade in i Mexico City. Mexikanska konservativa erbjöd tronen åt Maximilian, som anlände 1864. Juárez regering drog sig tillbaka till det yttersta norr och fortsatte kampen med gerillastyrkor och reguljära styrkor. Efter amerikanska inbördeskriget pressade USA Frankrike att lämna landet, och Napoleon, som stod inför Preussen i Europa, drog tillbaka sin armé 1866–1867. Republikanerna belägrade Maximilian i Querétaro, som föll den 15 maj 1867; han arkebuserades tillsammans med sina generaler Miguel Miramón och Tomás Mejía den 19 juni, och Mexico City kapitulerade två dagar senare.
