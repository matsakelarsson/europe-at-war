Dates are New Style (Gregorian). Russia used the Julian calendar, then 12 days behind, so Russian sources date the crossing of the Niemen to 12 June and the Battle of Borodino to 26 August 1812.: Datumen följer den nya stilen (gregorianska kalendern). Ryssland använde den julianska kalendern, då 12 dagar efter, så ryska källor daterar övergången av Njemen till den 12 juni och slaget vid Borodino till den 26 augusti 1812.
The size of the Grande Armée and its losses are estimates, and sources differ widely. Only about half of it was French; the rest came from the Duchy of Warsaw, the German states, Italy, Austria, Prussia, Switzerland and elsewhere. Napoleon called the campaign the Second Polish War.: Grande Armées storlek och förluster är uppskattningar, och källorna skiljer sig kraftigt åt. Bara omkring hälften av den var fransk; resten kom från hertigdömet Warszawa, de tyska staterna, Italien, Österrike, Preussen, Schweiz och andra håll. Napoleon kallade fälttåget det andra polska kriget.
The Napoleonic Wars as a whole are told in another story; this one covers only the Russian campaign of 1812. Places are named in their present-day forms.: Napoleonkrigen som helhet berättas i en annan berättelse; denna omfattar bara det ryska fälttåget 1812. Orterna anges med sina nutida namn.
