Battles of Krasnoi: Slagen vid Krasnoj
15–18 November 1812: 15–18 november 1812
The French kept the burned-out town, but Kutuzov’s army barred the road to Kaluga, forcing Napoleon back onto the devastated Smolensk road.: Fransmännen behöll den utbrända staden, men Kutuzovs armé spärrade vägen till Kaluga och tvingade Napoleon tillbaka till den ödelagda Smolenskvägen.
Miloradovich attacked the French rearguard under Davout, which lost heavily before it got through the town.: Miloradovitj anföll den franska eftertruppen under Davout, som led svåra förluster innan den tog sig igenom staden.
9–14 November 1812: 9–14 november 1812
The starving army found too little food and looted the stores. Many units no longer existed except on paper.: Den svältande armén fann för lite mat och plundrade förråden. Många förband fanns inte längre utom på papperet.
Kutuzov’s attacks cost the Grande Armée tens of thousands of men killed, captured or scattered.: Kutuzovs anfall kostade Grande Armée tiotusentals man i döda, tillfångatagna eller skingrade.
The retreat: Reträtten
Two more Russian armies closed in on the Berezina, Admiral Pavel Chichagov’s from the south and Wittgenstein’s from the north, and on 21 November Chichagov took the bridge at Borisov. Napoleon feinted downstream while his engineers under General Jean-Baptiste Éblé, working in the icy river, built two trestle bridges near the village of Studzianka. From 26 to 29 November the army crossed under attack from both banks. When the bridges were burned on the morning of 29 November, thousands of stragglers and camp followers were still on the eastern bank. Tens of thousands were killed, drowned or captured, but most of the remaining fighting troops got across.: Ytterligare två ryska arméer närmade sig Berezina, amiral Pavel Tjitjagovs från söder och Wittgensteins från norr, och den 21 november intog Tjitjagov bron vid Borisov. Napoleon gjorde en skenmanöver nedströms medan hans ingenjörer under general Jean-Baptiste Éblé, som arbetade i den iskalla floden, byggde två bockbroar nära byn Studzianka. Den 26–29 november gick armén över under anfall från båda stränderna. När broarna brändes på morgonen den 29 november befann sig ännu tusentals eftersläntrare och trosspersonal på den östra stranden. Tiotusentals dödades, drunknade eller tillfångatogs, men de flesta av de återstående stridande trupperna kom över.
On 5 December Napoleon left the army at Smorgon and hurried to Paris to raise a new one. Temperatures fell to about −30 °C, and thousands more died on the road to Vilnius and in the city itself. Around 14 December the last of the main army, with Ney’s rearguard, crossed the Niemen at Kaunas. Of the more than 600,000 men who had entered Russia, only a small fraction came back. Russian losses were also enormous, and many civilians died. On 30 December the Prussian general Ludwig Yorck agreed at Tauroggen to take his corps out of the war, and Prussia soon changed sides.: Den 5 december lämnade Napoleon armén i Smorgon och skyndade till Paris för att sätta upp en ny. Temperaturen sjönk till omkring −30 °C, och ytterligare tusentals dog på vägen till Vilnius och i själva staden. Omkring den 14 december gick det sista av huvudarmén, med Neys eftertrupp, över Njemen vid Kaunas. Av de mer än 600 000 man som hade dragit in i Ryssland kom bara en liten bråkdel tillbaka. Även de ryska förlusterna var enorma, och många civila dog. Den 30 december gick den preussiske generalen Ludwig Yorck i Tauroggen med på att föra sin kår ut ur kriget, och Preussen bytte snart sida.
