French Invasion of Russia: Napoleons ryska fälttåg
Napoleon’s invasion of the Russian Empire in 1812 with a multinational Grande Armée of more than 600,000 men, known in Russia as the Patriotic War of 1812. The Russian armies retreated, fought at Smolensk and Borodino and gave up Moscow, which burned; after five weeks Napoleon turned back, and hunger, cold, disease and Russian attacks destroyed most of his army before the survivors recrossed the Niemen in December.: Napoleons invasion av Ryska riket 1812 med en multinationell Grande Armée på mer än 600 000 man, i Ryssland känd som fosterländska kriget 1812. De ryska arméerna drog sig tillbaka, stred vid Smolensk och Borodino och gav upp Moskva, som brann; efter fem veckor vände Napoleon tillbaka, och hunger, kyla, sjukdomar och ryska anfall förintade större delen av hans armé innan de överlevande åter gick över Njemen i december.
