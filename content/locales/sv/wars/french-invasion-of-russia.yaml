The French took the Russian earthworks at great cost but did not destroy Kutuzov’s army, which withdrew in good order.: Fransmännen intog de ryska jordverken till ett högt pris men förintade inte Kutuzovs armé, som drog sig tillbaka i god ordning.
Mozhaysk: Mozjajsk
8 September 1812: 8 september 1812
The Russian army retreated through the town towards Moscow, leaving thousands of its wounded behind.: Den ryska armén retirerade genom staden mot Moskva och lämnade tusentals av sina sårade efter sig.
Council at Fili: Krigsrådet i Fili
13 September 1812: 13 september 1812
Kutuzov told his generals that losing Moscow did not mean losing Russia, and ordered the army to march through the city and out.: Kutuzov sade till sina generaler att förlusten av Moskva inte innebar förlusten av Ryssland och beordrade armén att marschera genom staden och ut ur den.
Kutuzov: Kutuzov
Napoleon entered Moscow on 14 September, but most of its roughly 270,000 people had left with the army. That night fires broke out across the city and burned until 18 September, destroying about three-quarters of it. The governor, Fyodor Rostopchin, had taken away the fire pumps, and many historians believe he ordered the city burned, though looting soldiers and accidents also played a part. Napoleon settled in the Kremlin and sent three offers of peace to Alexander, who did not reply.: Napoleon tågade in i Moskva den 14 september, men de flesta av stadens omkring 270 000 invånare hade gett sig av med armén. Den natten bröt bränder ut över hela staden och brann till den 18 september och förstörde omkring tre fjärdedelar av den. Guvernören Fjodor Rostoptjin hade fört bort brandsprutorna, och många historiker anser att han beordrade att staden skulle brännas, även om plundrande soldater och olyckor också bidrog. Napoleon slog sig ned i Kreml och sände tre fredserbjudanden till Alexander, som inte svarade.
Kutuzov’s army slipped away south-west to a camp at Tarutino, where it rested and grew while it covered the arsenal at Tula and the grain lands of the south. Cossacks, army raiders and armed peasants attacked French foragers and killed stragglers. On 18 October the Russians surprised Murat’s advance guard at Tarutino. The next day Napoleon left Moscow with about 100,000 men and a long train of loot, heading south-west for Kaluga, and the troops left behind blew up part of the Kremlin as they followed.: Kutuzovs armé slank undan sydväst till ett läger vid Tarutino, där den vilade och växte medan den skyddade arsenalen i Tula och spannmålsområdena i söder. Kosacker, arméns strövkårer och beväpnade bönder angrep franska furageringstrupper och dödade eftersläntrare. Den 18 oktober överraskade ryssarna Murats förtrupp vid Tarutino. Dagen därpå lämnade Napoleon Moskva med omkring 100 000 man och en lång tross av byte, på väg sydväst mot Kaluga, och de trupper som lämnats kvar sprängde en del av Kreml när de följde efter.
Napoleon in Moscow: Napoleon i Moskva
