Russian success: Ryska framgångar
The alliance that Napoleon and Alexander I had made at Tilsit in 1807 broke down over the Continental System, his blockade of British trade, which Russia had given up, and over Poland. Napoleon gathered the largest army Europe had yet seen, roughly 450,000 men in the first wave and more than 600,000 in all. On 24 June 1812 its main body began crossing the Niemen from the Duchy of Warsaw on pontoon bridges near Kaunas. The two Russian armies in the west, under Mikhail Barclay de Tolly and Pyotr Bagration, had together some 180,000–220,000 men, and they fell back rather than be destroyed one at a time.: Den allians som Napoleon och Alexander I hade slutit i Tilsit 1807 bröt samman på grund av kontinentalsystemet, hans blockad av den brittiska handeln, som Ryssland hade övergett, och på grund av Polen. Napoleon samlade den största armé som Europa dittills hade sett, omkring 450 000 man i den första vågen och mer än 600 000 sammanlagt. Den 24 juni 1812 började dess huvudstyrka gå över Njemen från hertigdömet Warszawa på pontonbroar nära Kaunas. De två ryska arméerna i väster, under Michail Barclay de Tolly och Pjotr Bagration, hade tillsammans omkring 180 000–220 000 man, och de drog sig tillbaka hellre än att förintas var för sig.
Napoleon entered Vilnius on 28 June and stayed there for more than two weeks. A provisional government of Lithuania was set up, and in Warsaw a confederation proclaimed the restoration of the Kingdom of Poland. Heat, storms, bad roads and the failure of the supply trains cost the Grande Armée tens of thousands of men and horses before any great battle. Bagration escaped Marshal Davout after a fight at Saltanovka near Mogilev, Barclay’s rearguard fought at Ostrovno near Vitebsk, and in early August the two Russian armies joined at Smolensk.: Napoleon tågade in i Vilnius den 28 juni och stannade där i mer än två veckor. En provisorisk regering för Litauen inrättades, och i Warszawa utropade en konfederation återupprättandet av kungariket Polen. Hetta, oväder, dåliga vägar och underhållstrossernas misslyckande kostade Grande Armée tiotusentals man och hästar innan något stort slag hade utkämpats. Bagration undkom marskalk Davout efter en strid vid Saltanovka nära Mogiljov, Barclays eftertrupp stred vid Ostrovno nära Vitebsk, och i början av augusti förenades de två ryska arméerna vid Smolensk.
