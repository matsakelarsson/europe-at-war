Moscow: Moskva
14 September 1812: 14 september 1812
The French entered a nearly empty city. Fires that broke out the same night destroyed most of its wooden houses.: Fransmännen tågade in i en nästan tom stad. Bränder som bröt ut samma natt förstörde de flesta av dess trähus.
18 October 1812: 18 oktober 1812
Kutuzov’s attack on Murat’s camp on the Chernishnya river showed that the Russian army was ready to fight again.: Kutuzovs anfall mot Murats läger vid floden Tjernisjnja visade att den ryska armén var redo att strida igen.
Napoleon, 19 October: Napoleon, 19 oktober
Napoleon hoped to reach the stores at Kaluga by the unravaged southern road. On 24 October his Italian corps under Prince Eugène met Dokhturov’s troops at Maloyaroslavets, and the town changed hands several times and burned. The French held it, but Kutuzov blocked the road south. After a narrow escape from Cossacks the next morning, Napoleon turned north to the Smolensk road, along which his army had stripped the country bare on its way east, and passed the unburied dead of Borodino.: Napoleon hoppades nå förråden i Kaluga längs den oskövlade södra vägen. Den 24 oktober mötte hans italienska kår under prins Eugène Dochturovs trupper vid Malojaroslavets, och staden bytte ägare flera gånger och brann. Fransmännen behöll den, men Kutuzov spärrade vägen söderut. Sedan Napoleon med nöd och näppe undkommit kosacker följande morgon vände han norrut mot Smolenskvägen, längs vilken hans armé hade skövlat landet på väg österut, och passerade de obegravda döda vid Borodino.
Kutuzov followed on a parallel road to the south while Cossacks and partisans attacked the columns. At Vyazma on 3 November Miloradovich mauled the rearguard. Hard frosts came in early November, horses died in thousands, guns and wagons were abandoned and discipline broke down. At Smolensk the stores were too small and were looted. At Krasnoi on 15–18 November Russian attacks cut the strung-out army into pieces; Ney’s rearguard was cut off and escaped across the frozen Dnieper with only a few hundred men.: Kutuzov följde efter på en parallell väg i söder medan kosacker och partisaner angrep kolonnerna. Vid Vjazma den 3 november tilltygade Miloradovitj eftertruppen svårt. Hård frost kom i början av november, hästar dog i tusental, kanoner och vagnar övergavs och disciplinen bröt samman. I Smolensk var förråden för små och plundrades. Vid Krasnoj den 15–18 november skar ryska anfall den utdragna armén i stycken; Neys eftertrupp blev avskuren och undkom över den isbelagda Dnepr med bara några hundra man.
Battle of Maloyaroslavets: Slaget vid Malojaroslavets
24 October 1812: 24 oktober 1812
Battle of Vyazma: Slaget vid Vjazma
