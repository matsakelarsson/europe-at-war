Napoleon tried to swing south of the Russians and seize Smolensk behind them. On 14 August at Krasnoi, General Dmitry Neverovsky’s division of about 7,000 men held off Murat’s cavalry in a fighting retreat, buying a day for the city to be reinforced. On 16 and 17 August the French attacked Smolensk, whose old walls were held first by Nikolay Raevsky’s corps and then by Dmitry Dokhturov’s. The city caught fire, and on the night of 17–18 August Barclay ordered it abandoned, blew up the powder stores and burned the bridge over the Dnieper.: Napoleon försökte svänga söder om ryssarna och ta Smolensk bakom dem. Den 14 augusti vid Krasnoj höll general Dmitrij Neverovskijs division på omkring 7 000 man stånd mot Murats kavalleri under en stridande reträtt och vann en dag så att staden kunde förstärkas. Den 16 och 17 augusti anföll fransmännen Smolensk, vars gamla murar först hölls av Nikolaj Rajevskijs kår och sedan av Dmitrij Dochturovs. Staden fattade eld, och natten mellan den 17 och 18 augusti beordrade Barclay att den skulle överges, sprängde krutförråden och brände bron över Dnepr.
Both sides lost many thousands of men, and much of the city was destroyed. On 19 August at Valutino the Russian rearguard held off Ney and Murat while the army escaped along the Moscow road. The long retreat had made Barclay, a general of Baltic German descent, deeply unpopular, and on 20 August Alexander gave the supreme command to the 67-year-old Mikhail Kutuzov. He joined the army at the end of the month and kept falling back towards Moscow while looking for a place to fight.: Båda sidor förlorade många tusen man, och stora delar av staden förstördes. Den 19 augusti vid Valutino höll den ryska eftertruppen Ney och Murat stången medan armén undkom längs Moskvavägen. Den långa reträtten hade gjort Barclay, en general av balttysk härkomst, djupt impopulär, och den 20 augusti gav Alexander överbefälet åt den 67-årige Michail Kutuzov. Han anslöt sig till armén i slutet av månaden och fortsatte att retirera mot Moskva medan han sökte en plats att ta strid.
