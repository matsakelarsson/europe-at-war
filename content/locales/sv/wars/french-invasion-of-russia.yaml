Neverovsky’s infantry formed squares and retreated for miles under repeated cavalry charges, delaying the French advance on Smolensk.: Neverovskijs infanteri formerade karréer och retirerade flera mil under upprepade kavallerichocker, vilket fördröjde den franska framryckningen mot Smolensk.
The French stormed the suburbs but not the walls. The Russians left the burning city on the third night.: Fransmännen stormade förstäderna men inte murarna. Ryssarna lämnade den brinnande staden den tredje natten.
A hard rearguard fight east of Smolensk. The French held the field, but the Russian army got away.: En hård eftertruppsstrid öster om Smolensk. Fransmännen behöll slagfältet, men den ryska armén kom undan.
Barclay and Bagration: Barclay och Bagration
Kutuzov made his stand near the village of Borodino, about 110 km west of Moscow, with roughly 120,000 men, including militia and Cossacks, against some 130,000 under Napoleon. On 5 September the French took the Shevardino redoubt in front of the Russian left. At dawn on 7 September they attacked the earthworks known as the Bagration flèches, which changed hands several times before they fell. Bagration was mortally wounded. In the afternoon French cavalry and infantry took the Great Redoubt in the centre, held by Raevsky’s corps.: Kutuzov tog strid nära byn Borodino, omkring 110 km väster om Moskva, med omkring 120 000 man, däribland milis och kosacker, mot omkring 130 000 under Napoleon. Den 5 september intog fransmännen Sjevardinoskansen framför den ryska vänsterflygeln. I gryningen den 7 september anföll de de jordverk som kallades Bagrations flescher, som bytte ägare flera gånger innan de föll. Bagration blev dödligt sårad. På eftermiddagen intog franskt kavalleri och infanteri den stora skansen i centrum, som hölls av Rajevskijs kår.
The Russians fell back a short way to a new line, but their army was not broken, and Napoleon refused to send in his Imperial Guard. Some 70,000 or more men were killed or wounded in one day, about 30,000–35,000 of them French and allied and 40,000–45,000 Russian by most estimates, the bloodiest single day of the Napoleonic Wars. Kutuzov withdrew towards Moscow. At a council of war in the village of Fili on 13 September he decided to give up the city rather than risk the army.: Ryssarna drog sig en kort bit tillbaka till en ny linje, men deras armé var inte bruten, och Napoleon vägrade att sätta in sitt kejserliga garde. Omkring 70 000 man eller fler dödades eller sårades på en enda dag, enligt de flesta uppskattningar omkring 30 000–35 000 av dem franska och allierade och 40 000–45 000 ryska, Napoleonkrigens blodigaste enskilda dag. Kutuzov drog sig tillbaka mot Moskva. Vid ett krigsråd i byn Fili den 13 september beslöt han att ge upp staden hellre än att riskera armén.
Battle of Borodino: Slaget vid Borodino
