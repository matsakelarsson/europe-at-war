In January 1820 an army revolt led by Lieutenant Colonel Rafael del Riego forced King Ferdinand VII to restore the liberal constitution of 1812, and for three years Spain was governed by liberal ministers and an elected Cortes. Royalist bands, calling themselves the Army of the Faith, rose in the north and in 1822 set up a regency at La Seu d’Urgell, and Ferdinand secretly appealed to the other monarchies. At the Congress of Verona the great powers, over British objections, agreed that France should intervene, and in January 1823 Louis XVIII announced that a hundred thousand Frenchmen were ready to march to save the throne of Spain.: I januari 1820 tvingade ett militärt uppror under överstelöjtnant Rafael del Riego kung Ferdinand VII att återinföra 1812 års liberala författning, och i tre år styrdes Spanien av liberala ministrar och en vald cortes. Rojalistiska band, som kallade sig Trons armé, reste sig i norr och inrättade 1822 en regentskapsregering i La Seu d’Urgell, och Ferdinand vädjade i hemlighet till de andra monarkierna. Vid Veronakongressen enades stormakterna, trots brittiska invändningar, om att Frankrike skulle ingripa, och i januari 1823 meddelade Ludvig XVIII att hundratusen fransmän stod redo att marschera för att rädda Spaniens tron.
On 7 April a French army under the king’s nephew, the Duke of Angoulême, crossed the Bidasoa together with Spanish royalist troops. Unlike in 1808, most Spaniards did not resist, and in many places they welcomed the French as defenders of the king and the Church. The French left the fortresses behind them under blockade and entered Madrid on 24 May, where a royalist regency was set up. The Cortes had already moved to Seville, taking the king with them. On 11 June, when he refused to go further, they declared him temporarily unfit to rule and carried him off to Cádiz.: Den 7 april gick en fransk armé under kungens brorson, hertigen av Angoulême, över Bidasoa tillsammans med spanska rojalistiska trupper. Till skillnad från 1808 gjorde de flesta spanjorer inget motstånd, och på många håll välkomnade de fransmännen som försvarare av kungen och kyrkan. Fransmännen lämnade fästningarna bakom sig under blockad och tågade in i Madrid den 24 maj, där en rojalistisk regentskapsregering inrättades. Cortes hade redan flyttat till Sevilla och tagit kungen med sig. Den 11 juni, när han vägrade att resa längre, förklarade de honom tillfälligt oförmögen att regera och förde honom till Cádiz.
