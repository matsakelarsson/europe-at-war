French invasion of Spain (1823): Frankrikes invasion av Spanien (1823)
The French intervention of 1823, approved by the great powers at the Congress of Verona, which overthrew Spain’s liberal constitutional government and restored King Ferdinand VII as an absolute monarch. A French army under the Duke of Angoulême, popularly called the Hundred Thousand Sons of Saint Louis, met little resistance, took Madrid in May and forced the surrender of Cádiz, the last refuge of the Cortes, after storming the Trocadero fort in August.: Den franska interventionen 1823, godkänd av stormakterna vid Veronakongressen, som störtade Spaniens liberala konstitutionella regering och återinsatte kung Ferdinand VII som enväldig monark. En fransk armé under hertigen av Angoulême, i folkmun kallad den helige Ludvigs hundratusen söner, mötte föga motstånd, intog Madrid i maj och tvingade Cádiz, Cortes sista tillflykt, att kapitulera sedan den stormat fortet Trocadero i augusti.
