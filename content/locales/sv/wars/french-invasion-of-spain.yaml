French columns pursued the constitutional armies across the country. General Francisco Ballesteros surrendered in Andalusia on 4 August, and A Coruña, Pamplona and San Sebastián gave up in August and September. Cádiz, the refuge of the Cortes, was besieged from late June. On the night of 31 August French infantry waded across the channel in front of the Trocadero fort, which guarded the inner bay, and stormed it; the Place du Trocadéro in Paris is named after the victory. After the fort of Sancti Petri fell and the city was bombarded, the Cortes gave in and released the king, who crossed to the French camp at El Puerto de Santa María on 1 October.: Franska kolonner förföljde de konstitutionella arméerna över hela landet. General Francisco Ballesteros kapitulerade i Andalusien den 4 augusti, och A Coruña, Pamplona och San Sebastián gav upp i augusti och september. Cádiz, Cortes tillflykt, belägrades från slutet av juni. Natten till den 31 augusti vadade franskt infanteri över kanalen framför fortet Trocadero, som skyddade den inre bukten, och stormade det; Place du Trocadéro i Paris är uppkallad efter segern. Sedan fortet Sancti Petri fallit och staden bombarderats gav Cortes upp och släppte kungen, som den 1 oktober for över till det franska lägret i El Puerto de Santa María.
Ferdinand at once annulled every act of the constitutional government since 1820, despite his promise of an amnesty, and began a decade of repression. Riego, captured in September, was hanged in Madrid on 7 November. Thousands of liberals were imprisoned or executed, or went into exile, many of them to Britain. In Catalonia General Francisco Espoz y Mina held Barcelona until 2 November. French troops stayed in Spain until 1828, partly to restrain the king’s ultra-royalist supporters.: Ferdinand upphävde genast varje beslut som den konstitutionella regeringen fattat sedan 1820, trots sitt löfte om amnesti, och inledde ett decennium av förtryck. Riego, som tillfångatagits i september, hängdes i Madrid den 7 november. Tusentals liberaler fängslades eller avrättades eller gick i exil, många av dem till Storbritannien. I Katalonien höll general Francisco Espoz y Mina Barcelona till den 2 november. Franska trupper stannade i Spanien till 1828, delvis för att hålla tillbaka kungens ultrarojalistiska anhängare.
