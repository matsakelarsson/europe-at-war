In French the campaign is called l’expédition d’Espagne. Despite its popular name, the French army had between 60,000 and 95,000 men. The years of liberal rule it ended, 1820–1823, are known in Spain as the Trienio Liberal, and the years of absolutism that followed, to 1833, as the Ominous Decade.: På franska kallas fälttåget l’expédition d’Espagne. Trots det folkliga namnet hade den franska armén mellan 60 000 och 95 000 man. De år av liberalt styre som den gjorde slut på, 1820–1823, kallas i Spanien Trienio Liberal, och de år av envälde som följde, fram till 1833, det olycksbådande decenniet.
