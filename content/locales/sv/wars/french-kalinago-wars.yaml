# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
French–Kalinago wars: Krigen mellan fransmän och kalinago
? The wars in which French colonists took Guadeloupe, Martinique and Grenada from the Kalinago (Island Caribs) between 1635 and 1660. The Compagnie des Îles de l’Amérique, founded under Cardinal Richelieu, sent Charles Liénard de l’Olive and Jean du Plessis to Guadeloupe with 554 people in June 1635; short of food, they turned on the Kalinago, and a war of raids and reprisals lasted until a peace of 1640, after which the Kalinago withdrew from most of the island. On Martinique, settled from Saint Kitts by Pierre Belain d’Esnambuc in September 1635, his nephew Jacques Dyel du Parquet agreed a truce in 1637 that left the Kalinago the windward side, the Cabesterre. In 1649 du Parquet landed on Grenada, where an agreement with the Kalinago leader Kairouane soon gave way to five years of war; in 1650 or 1651 Kalinago fighters cornered at Sauteurs in the north threw themselves from the cliff rather than surrender, and by 1654 Kalinago resistance on the island had been crushed. Kalinago from Saint Vincent and Dominica attacked Martinique and Saint Lucia in 1654–1657, and after du Parquet’s death in 1658 the colonists drove the remaining Kalinago from the Cabesterre. On 31 March 1660, at Basse-Terre on Guadeloupe, the French governor Charles Houël and English representatives signed a treaty with Kalinago leaders that left them Dominica and Saint Vincent, which became their last refuges; the English and French later broke it.
: De krig genom vilka franska kolonister tog Guadeloupe, Martinique och Grenada från kalinagofolket (ökaribierna) mellan 1635 och 1660. Compagnie des Îles de l’Amérique, som hade grundats under kardinal Richelieu, sände Charles Liénard de l’Olive och Jean du Plessis till Guadeloupe med 554 personer i juni 1635; när maten tröt vände de sig mot kalinagofolket, och ett krig av räder och repressalier varade fram till en fred 1640, varefter kalinagofolket drog sig tillbaka från större delen av ön. På Martinique, som Pierre Belain d’Esnambuc koloniserade från Saint Kitts i september 1635, slöt hans nevö Jacques Dyel du Parquet 1637 ett stillestånd som lämnade lovartssidan, Cabesterre, åt kalinagofolket. År 1649 landsteg du Parquet på Grenada, där en överenskommelse med kalinagoledaren Kairouane snart avlöstes av fem års krig; 1650 eller 1651 kastade sig inringade kalinagokrigare vid Sauteurs i norr utför klippan hellre än att ge sig, och 1654 hade kalinagofolkets motstånd på ön krossats. Kalinago från Saint Vincent och Dominica anföll Martinique och Saint Lucia 1654–1657, och efter du Parquets död 1658 drev kolonisterna ut de sista kalinago från Cabesterre. Den 31 mars 1660 undertecknade den franske guvernören Charles Houël och engelska representanter i Basse-Terre på Guadeloupe ett fördrag med kalinagoledare som lämnade Dominica och Saint Vincent åt dem, och dessa öar blev deras sista tillflykt; engelsmännen och fransmännen bröt senare fördraget.
