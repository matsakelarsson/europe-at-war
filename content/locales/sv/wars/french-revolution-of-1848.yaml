Also called the February Revolution. In February republicans and workers fought the July Monarchy’s troops and Municipal Guard; in June workers fought the army and guards of the republic that the February revolution had created.: Kallas också februarirevolutionen. I februari stred republikaner och arbetare mot julimonarkins trupper och stadsgardet; i juni stred arbetare mot armén och gardena i den republik som februarirevolutionen hade skapat.
Figures for the dead of the June Days vary widely between sources.: Siffrorna för de döda under junidagarna varierar kraftigt mellan källorna.
