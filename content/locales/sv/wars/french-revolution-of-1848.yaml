French Revolution of 1848: Franska revolutionen 1848
? The revolution that overthrew King Louis Philippe and founded the Second French Republic, and the workers’ rising of the June Days that followed. Protests in Paris began on 22 February 1848, after the government banned a banquet held by the reform movement, and turned into insurrection when soldiers fired on a crowd on the Boulevard des Capucines on 23 February, killing about 50 people. Paris was covered with barricades overnight, the National Guard largely sided with the crowds, and on 24 February Louis Philippe abdicated and fled to England. A provisional government proclaimed the republic, introduced universal male suffrage, abolished slavery in the colonies and set up National Workshops for the unemployed; the news set off revolutions across Europe. When the conservative assembly elected in April decided to close the workshops, the workers of eastern Paris rose on 23 June. General Louis-Eugène Cavaignac crushed the rising in four days of street fighting. By one count some 4,500 people were killed or wounded, among them the Archbishop of Paris, shot while trying to make peace at a barricade, and many captured insurgents were shot; more than 4,000 were deported to Algeria. In December 1848 Louis-Napoléon Bonaparte was elected president.
: Revolutionen som störtade kung Ludvig Filip och grundade Andra franska republiken, och det arbetaruppror under junidagarna som följde. Protesterna i Paris började den 22 februari 1848, sedan regeringen förbjudit en bankett som reformrörelsen anordnade, och övergick i uppror när soldater sköt mot en folkmassa på Boulevard des Capucines den 23 februari och dödade omkring 50 människor. Paris täcktes av barrikader över natten, nationalgardet ställde sig till stor del på folkmassornas sida, och den 24 februari abdikerade Ludvig Filip och flydde till England. En provisorisk regering utropade republiken, införde allmän rösträtt för män, avskaffade slaveriet i kolonierna och inrättade nationalverkstäder för de arbetslösa; nyheten utlöste revolutioner över hela Europa. När den konservativa församling som valts i april beslöt att stänga verkstäderna reste sig arbetarna i östra Paris den 23 juni. General Louis-Eugène Cavaignac slog ned upproret under fyra dagars gatustrider. Enligt en beräkning dödades eller sårades omkring 4 500 människor, bland dem ärkebiskopen av Paris, som sköts när han försökte mäkla fred vid en barrikad, och många tillfångatagna upprorsmän arkebuserades; mer än 4 000 deporterades till Algeriet. I december 1848 valdes Louis-Napoléon Bonaparte till president.
