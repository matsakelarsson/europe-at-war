In 1796 the Directory sent two armies across the Rhine into Germany, under Jourdan and Moreau, and gave a third, the small and ragged Army of Italy, to the 26-year-old Napoleon Bonaparte. In Germany the Archduke Charles, the Emperor’s brother, used his central position to beat Jourdan at Amberg in August and Würzburg in September, and both French armies fell back across the Rhine. In Italy Bonaparte split the Austrians from the Piedmontese at Montenotte in April, forced Sardinia out of the war within a month, and then beat the Austrians at Lodi on 10 May and entered Milan.: År 1796 sände direktoriet två arméer över Rhen in i Tyskland, under Jourdan och Moreau, och gav en tredje, den lilla och trasiga Italienarmén, åt den 26-årige Napoleon Bonaparte. I Tyskland utnyttjade ärkehertig Karl, kejsarens bror, sin centrala ställning till att besegra Jourdan vid Amberg i augusti och Würzburg i september, och båda de franska arméerna föll tillbaka över Rhen. I Italien skilde Bonaparte österrikarna från piemonteserna vid Montenotte i april, tvingade Sardinien ur kriget inom en månad och besegrade sedan österrikarna vid Lodi den 10 maj och tågade in i Milano.
He besieged Mantua, Austria’s great fortress in Italy, and beat four Austrian attempts to relieve it, at Castiglione in August, Bassano in September, Arcole in November and Rivoli in January 1797; Mantua surrendered on 2 February. He then crossed the Alps towards Vienna, and on 18 April the Austrians agreed to preliminaries of peace at Leoben. In May Bonaparte put an end to the Republic of Venice, and he made Lombardy the core of a new Cisalpine Republic. By the Treaty of Campo Formio on 17 October 1797 Austria gave up Belgium and Lombardy and recognised the Cisalpine Republic, and received Venice, Istria and Dalmatia; secretly it agreed that France should have most of the left bank of the Rhine.: Han belägrade Mantua, Österrikes stora fästning i Italien, och slog tillbaka fyra österrikiska försök att undsätta den, vid Castiglione i augusti, Bassano i september, Arcole i november och Rivoli i januari 1797; Mantua kapitulerade den 2 februari. Han gick sedan över Alperna mot Wien, och den 18 april gick österrikarna med på ett preliminärt fredsavtal i Leoben. I maj gjorde Bonaparte slut på Republiken Venedig, och han gjorde Lombardiet till kärnan i en ny cisalpinsk republik. Genom freden i Campo Formio den 17 oktober 1797 gav Österrike upp Belgien och Lombardiet och erkände Cisalpinska republiken, och fick Venedig, Istrien och Dalmatien; i hemlighet gick det med på att Frankrike skulle få större delen av Rhens vänstra strand.
