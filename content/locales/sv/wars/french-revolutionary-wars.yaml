In the hard winter of 1794–1795 the rivers froze, and Pichegru’s army crossed them on the ice into the Dutch Republic. The British retreated through the eastern provinces to Germany in bitter cold, losing thousands of men, and the stadtholder William V fled to England on 18 January. Dutch Patriots, many back from exile in France, took over the towns and proclaimed the Batavian Republic on 19 January. On 23 January French hussars captured the Dutch fleet, frozen into the ice off Den Helder. By the Treaty of The Hague on 16 May the new republic became France’s ally, ceded Maastricht, Venlo and Zeelandic Flanders, and agreed to pay 100 million guilders and to keep a French army.: Under den hårda vintern 1794–1795 frös floderna, och Pichegrus armé gick över dem på isen in i Nederländska republiken. Britterna drog sig i bitande kyla tillbaka genom de östra provinserna till Tyskland och förlorade tusentals man, och ståthållaren Vilhelm V flydde till England den 18 januari. Nederländska patrioter, många hemkomna från exil i Frankrike, tog över städerna och utropade Bataviska republiken den 19 januari. Den 23 januari tillfångatog franska husarer den nederländska flottan, som låg infrusen i isen utanför Den Helder. Genom fördraget i Haag den 16 maj blev den nya republiken Frankrikes bundsförvant, avträdde Maastricht, Venlo och Zeeländska Flandern och gick med på att betala 100 miljoner gulden och att underhålla en fransk armé.
The coalition fell apart. Prussia, more interested in its share of Poland, made peace at Basel on 5 April, accepting in a secret article that France would keep the left bank of the Rhine until a general peace, and northern Germany became neutral behind a demarcation line. Spain made peace on 22 July, ceding its half of Hispaniola, and Hesse-Kassel in August. The fortress of Luxembourg surrendered on 7 June after a long blockade, and in July General Hoche crushed a British-backed landing of émigrés at Quiberon in Brittany. On 1 October the Convention annexed the Austrian Netherlands and Liège to France, and at the end of the month it handed power to a new government, the Directory. Austria and Britain fought on.: Koalitionen föll sönder. Preussen, som var mer intresserat av sin andel av Polen, slöt fred i Basel den 5 april och godtog i en hemlig artikel att Frankrike skulle behålla Rhens vänstra strand fram till en allmän fred, och norra Tyskland blev neutralt bakom en demarkationslinje. Spanien slöt fred den 22 juli och avträdde sin halva av Hispaniola, och Hessen-Kassel i augusti. Fästningen Luxemburg kapitulerade den 7 juni efter en lång blockad, och i juli krossade general Hoche en brittiskstödd landstigning av emigranter vid Quiberon i Bretagne. Den 1 oktober annekterade konventet Österrikiska Nederländerna och Liège till Frankrike, och i slutet av månaden lämnade det över makten till en ny regering, direktoriet. Österrike och Storbritannien fortsatte kriget.
