In 1798 France set up a Roman Republic, occupied Switzerland, which became the Helvetic Republic, and sent Bonaparte with an army to Egypt. He took Malta on the way and Cairo in July, but on 1 August Nelson destroyed his fleet in Aboukir Bay, in the Battle of the Nile. Britain, Russia, Austria, Naples, Portugal and the Ottoman Empire formed a Second Coalition. Naples attacked first and lost its own capital, where the French set up a Parthenopean Republic in January 1799. In the spring the Archduke Charles beat Jourdan at Ostrach and Stockach, and an Austrian and Russian army under Alexander Suvorov drove the French out of most of Italy, winning at Cassano, on the Trebbia and at Novi.: År 1798 upprättade Frankrike en romersk republik, ockuperade Schweiz, som blev Helvetiska republiken, och sände Bonaparte med en armé till Egypten. Han intog Malta på vägen och Kairo i juli, men den 1 augusti förintade Nelson hans flotta i Abukirbukten, i slaget vid Nilen. Storbritannien, Ryssland, Österrike, Neapel, Portugal och Osmanska riket bildade en andra koalition. Neapel anföll först och förlorade sin egen huvudstad, där fransmännen upprättade en parthenopeisk republik i januari 1799. På våren besegrade ärkehertig Karl Jourdan vid Ostrach och Stockach, och en österrikisk och rysk armé under Aleksandr Suvorov drev fransmännen ut ur större delen av Italien med segrar vid Cassano, vid Trebbia och vid Novi.
Switzerland became a battlefield. The Archduke pushed Masséna out of Zürich in June, but when he was sent north to the Rhine, Masséna attacked the Russians under Alexander Korsakov at Zürich on 25–26 September and routed them. Suvorov, marching north from Italy over the St Gotthard Pass to join Korsakov, arrived too late and had to lead his army out over high Alpine passes in October. In Holland a British and Russian army under the Duke of York landed on 27 August, and the Dutch fleet surrendered to the British, but after battles around Bergen and Castricum York agreed at Alkmaar on 18 October to withdraw. Russia left the coalition, and on 9 November Bonaparte, back from Egypt, seized power in Paris.: Schweiz blev ett slagfält. Ärkehertigen trängde ut Masséna ur Zürich i juni, men när han sändes norrut till Rhen anföll Masséna ryssarna under Aleksandr Korsakov vid Zürich den 25–26 september och slog dem på flykten. Suvorov, som marscherade norrut från Italien över Sankt Gotthardspasset för att förena sig med Korsakov, kom för sent och måste i oktober leda sin armé ut över höga alppass. I Holland landsteg en brittisk och rysk armé under hertigen av York den 27 augusti, och den nederländska flottan kapitulerade för britterna, men efter strider kring Bergen och Castricum gick York i Alkmaar den 18 oktober med på att dra sig tillbaka. Ryssland lämnade koalitionen, och den 9 november grep Bonaparte, hemkommen från Egypten, makten i Paris.
