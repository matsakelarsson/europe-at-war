Revolutionary France declared war on Austria on 20 April 1792, and Prussia joined Austria. An early French advance into the Austrian Netherlands collapsed in panic. In July the allied commander, the Duke of Brunswick, threatened Paris with destruction if the royal family were harmed, which helped bring down the monarchy on 10 August. His Prussian, Austrian and Hessian army, with French émigrés, crossed the border, took Longwy and Verdun and advanced into Champagne. On 20 September at Valmy the armies of Dumouriez and Kellermann stood firm under Prussian cannon fire, and Brunswick, his army sick with dysentery and short of supplies, broke off and retreated. The next day the National Convention abolished the monarchy.: Det revolutionära Frankrike förklarade Österrike krig den 20 april 1792, och Preussen anslöt sig till Österrike. En tidig fransk framryckning in i Österrikiska Nederländerna slutade i panik. I juli hotade den allierade befälhavaren, hertigen av Braunschweig, att förstöra Paris om kungafamiljen skadades, vilket bidrog till monarkins fall den 10 augusti. Hans preussiska, österrikiska och hessiska armé, med franska emigranter, gick över gränsen, intog Longwy och Verdun och ryckte fram in i Champagne. Den 20 september vid Valmy stod Dumouriez och Kellermanns arméer fast under preussisk artillerield, och Braunschweig, vars armé var sjuk i dysenteri och led brist på förnödenheter, avbröt och drog sig tillbaka. Dagen därpå avskaffade nationalkonventet monarkin.
The French now went over to the attack everywhere. An Austrian bombardment of Lille failed in October. In the south French armies occupied Savoy and Nice, lands of the King of Sardinia, and on the Rhine General Custine took Speyer, Worms and Mainz. In the north Dumouriez beat the Austrians at Jemappes, near Mons, on 6 November, the first great battle won by the Republic’s new armies, and by the end of the year the French held almost all of the Austrian Netherlands and Liège. On 19 November the Convention offered help to all peoples who wished to recover their liberty, and in December it ordered revolutionary government in the lands it occupied.: Fransmännen gick nu till anfall överallt. Ett österrikiskt bombardemang av Lille misslyckades i oktober. I söder ockuperade franska arméer Savojen och Nice, som tillhörde kungen av Sardinien, och vid Rhen intog general Custine Speyer, Worms och Mainz. I norr besegrade Dumouriez österrikarna vid Jemappes, nära Mons, den 6 november, det första stora slag som republikens nya arméer vann, och vid årets slut höll fransmännen nästan hela Österrikiska Nederländerna och Liège. Den 19 november erbjöd konventet hjälp åt alla folk som ville återvinna sin frihet, och i december beordrade det revolutionärt styre i de länder det ockuperade.
