Bonaparte, now First Consul, offered peace, which Austria and Britain refused. In the spring of 1800 the Austrians under Michael von Melas besieged Masséna in Genoa, while Moreau crossed the upper Rhine and pushed the Austrians in Swabia back to Ulm. Bonaparte led a new Reserve Army over the Great St Bernard Pass in May and came down into Lombardy behind Melas, entering Milan on 2 June. Genoa, starving, surrendered two days later.: Bonaparte, nu förste konsul, erbjöd fred, vilket Österrike och Storbritannien avvisade. Våren 1800 belägrade österrikarna under Michael von Melas Masséna i Genua, medan Moreau gick över övre Rhen och trängde tillbaka österrikarna i Schwaben till Ulm. Bonaparte ledde i maj en ny reservarmé över Stora Sankt Bernhardspasset och kom ned i Lombardiet bakom Melas, och tågade in i Milano den 2 juni. Det svältande Genua kapitulerade två dagar senare.
On 14 June Melas attacked Bonaparte’s army at Marengo, near Alessandria, and by the afternoon the French were retreating. Then General Desaix arrived with fresh troops; he was killed leading the counter-attack that, with a cavalry charge by Kellermann, broke the Austrians. The next day Melas agreed to withdraw east of the Mincio, leaving northern Italy to the French and Bonaparte more secure in power at home. Austria still would not make peace. On 3 December, in snowy forests east of Munich, Moreau destroyed the army of Archduke John at Hohenlinden and advanced towards Vienna, and on 25 December Austria agreed an armistice at Steyr.: Den 14 juni anföll Melas Bonapartes armé vid Marengo, nära Alessandria, och på eftermiddagen var fransmännen på reträtt. Då anlände general Desaix med friska trupper; han stupade när han ledde det motanfall som, tillsammans med en kavallerichock av Kellermann, bröt österrikarna. Dagen därpå gick Melas med på att dra sig tillbaka öster om Mincio, vilket lämnade norra Italien åt fransmännen och gjorde Bonapartes makt på hemmaplan säkrare. Österrike ville ändå inte sluta fred. Den 3 december, i snöiga skogar öster om München, förintade Moreau ärkehertig Johans armé vid Hohenlinden och ryckte fram mot Wien, och den 25 december gick Österrike med på ett vapenstillestånd i Steyr.
