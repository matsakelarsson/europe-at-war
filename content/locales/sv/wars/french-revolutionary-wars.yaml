French Revolutionary Wars: Franska revolutionskrigen
The wars between Revolutionary France and two coalitions of European monarchies, led by Austria, Prussia, Britain and Russia. Saved at Valmy in 1792 and by mass conscription in 1793, the Republic conquered Belgium, the Dutch Republic, the left bank of the Rhine and northern Italy, ringing itself with sister republics, and after Bonaparte’s victories at Marengo and Hohenlinden the treaties of Lunéville and Amiens in 1801–1802 left France the dominant power on the Continent.: Krigen mellan det revolutionära Frankrike och två koalitioner av europeiska monarkier under ledning av Österrike, Preussen, Storbritannien och Ryssland. Räddad vid Valmy 1792 och genom massutskrivningen 1793 erövrade republiken Belgien, Nederländska republiken, Rhens vänstra strand och norra Italien och omgav sig med en ring av systerrepubliker, och efter Bonapartes segrar vid Marengo och Hohenlinden lämnade fredsfördragen i Lunéville och Amiens 1801–1802 Frankrike som den dominerande makten på kontinenten.
