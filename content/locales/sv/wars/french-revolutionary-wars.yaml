By the Treaty of Lunéville on 9 February 1801 Austria, signing also for the Holy Roman Empire, confirmed the terms of Campo Formio. France gained the whole left bank of the Rhine, and Austria recognised the Batavian, Helvetic, Cisalpine and Ligurian republics. The German princes who lost land on the left bank were to be compensated with church lands and free cities on the right bank, which led to the great redrawing of the German map in 1803. Naples made peace at Florence in March. Britain fought on alone; in Egypt a British army landed at Aboukir in March 1801 and forced the French army, which Bonaparte had left behind in 1799, to surrender at Cairo and Alexandria by September.: Genom freden i Lunéville den 9 februari 1801 bekräftade Österrike, som också undertecknade för tysk-romerska riket, villkoren från Campo Formio. Frankrike vann hela Rhens vänstra strand, och Österrike erkände den bataviska, helvetiska, cisalpinska och liguriska republiken. De tyska furstar som förlorade land på vänstra stranden skulle kompenseras med kyrkliga områden och fria städer på högra stranden, vilket ledde till den stora omritningen av Tysklands karta 1803. Neapel slöt fred i Florens i mars. Storbritannien fortsatte ensamt kriget; i Egypten landsteg en brittisk armé vid Abukir i mars 1801 och tvingade den franska armé som Bonaparte hade lämnat kvar 1799 att kapitulera i Kairo och Alexandria senast i september.
Exhausted by nine years of war, Britain and France made peace at Amiens on 25 March 1802, together with Spain and the Batavian Republic. Britain returned most of its conquests overseas except Trinidad, taken from Spain, and Ceylon, taken from the Dutch, and promised to give Malta back to the Knights of St John; France agreed to leave southern Italy, and Egypt went back to the Ottoman Empire. In August Bonaparte was made First Consul for life. The peace lasted only fourteen months. Quarrels over Malta and French expansion in Switzerland, Italy and the Netherlands led Britain to declare war again in May 1803, the beginning of the Napoleonic Wars.: Utmattade av nio års krig slöt Storbritannien och Frankrike fred i Amiens den 25 mars 1802, tillsammans med Spanien och Bataviska republiken. Storbritannien återlämnade de flesta av sina erövringar över haven utom Trinidad, taget från Spanien, och Ceylon, taget från nederländarna, och lovade att lämna tillbaka Malta till johanniterorden; Frankrike gick med på att lämna södra Italien, och Egypten återgick till Osmanska riket. I augusti blev Bonaparte förste konsul på livstid. Freden varade bara fjorton månader. Tvister om Malta och den franska expansionen i Schweiz, Italien och Nederländerna fick Storbritannien att åter förklara krig i maj 1803, början på Napoleonkrigen.
