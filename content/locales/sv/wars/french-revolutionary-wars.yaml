Dates are given by the Gregorian calendar. From late 1793 to 1805 the French Republic used its own Revolutionary calendar, so French sources date Bonaparte’s seizure of power 18 Brumaire Year VIII (9 November 1799).: Datumen anges enligt den gregorianska kalendern. Från slutet av 1793 till 1805 använde Franska republiken sin egen revolutionskalender, så franska källor daterar Bonapartes maktövertagande till den 18 brumaire år VIII (9 november 1799).
The wars are usually divided into the War of the First Coalition (1792–1797) and the War of the Second Coalition (1798–1802). Spain fought France in 1793–1795 and was its ally from 1796; Prussia left the war in 1795, and Russia fought only in 1799. The war in the Pyrenees, at sea, in the colonies and in Egypt is only outlined here; the War in the Vendée and the Irish Rebellion of 1798 have their own stories.: Krigen brukar delas in i första koalitionskriget (1792–1797) och andra koalitionskriget (1798–1802). Spanien stred mot Frankrike 1793–1795 och var dess bundsförvant från 1796; Preussen lämnade kriget 1795, och Ryssland stred bara 1799. Kriget i Pyrenéerna, till sjöss, i kolonierna och i Egypten skisseras bara här; kriget i Vendée och irländska upproret 1798 har egna berättelser.
“Belgium” here means the Austrian Netherlands and the Prince-Bishopric of Liège, which France annexed in 1795.: ”Belgien” betyder här Österrikiska Nederländerna och furstbiskopsdömet Liège, som Frankrike annekterade 1795.
