In the spring of 1794 the allies tried once more to break into France from Flanders, but at Tourcoing on 18 May the French under Joseph Souham beat a poorly coordinated attack by the Austrians and the Duke of York. On the Sambre the French crossed the river and were thrown back four times before Jourdan, with the new Army of the Sambre-and-Meuse, took Charleroi on 25 June. The next day Coburg attacked him at Fleurus, where the French watched his movements from an observation balloon, and after a long struggle the Austrians withdrew. At sea the British won the battle of the Glorious First of June, but the grain convoy from America that the French fleet had sailed out to protect reached France.: Våren 1794 försökte de allierade ännu en gång bryta in i Frankrike från Flandern, men vid Tourcoing den 18 maj slog fransmännen under Joseph Souham tillbaka ett dåligt samordnat anfall av österrikarna och hertigen av York. Vid Sambre gick fransmännen över floden och kastades tillbaka fyra gånger innan Jourdan med den nya Sambre-et-Meuse-armén intog Charleroi den 25 juni. Dagen därpå anföll Coburg honom vid Fleurus, där fransmännen följde hans rörelser från en observationsballong, och efter en lång kamp drog sig österrikarna tillbaka. Till sjöss vann britterna slaget ”den ärorika första juni”, men den spannmålskonvoj från Amerika som den franska flottan hade seglat ut för att skydda nådde Frankrike.
The Austrians gave up the Netherlands. The French entered Brussels on 10 July, and Antwerp and Liège later that month. Jourdan beat the Austrians on the Ourthe in September and on the Roer in early October and reached the Rhine at Cologne and Koblenz, and Maastricht surrendered on 4 November. In the north Pichegru drove the British, Hanoverians and Dutch back across the great rivers. In Paris Robespierre fell on 27 July, and the Terror came to an end, but the occupied lands were stripped of food, money and works of art to pay for the war.: Österrikarna gav upp Nederländerna. Fransmännen tågade in i Bryssel den 10 juli och i Antwerpen och Liège senare samma månad. Jourdan besegrade österrikarna vid Ourthe i september och vid Roer i början av oktober och nådde Rhen vid Köln och Koblenz, och Maastricht kapitulerade den 4 november. I norr drev Pichegru britterna, hannoveranerna och nederländarna tillbaka över de stora floderna. I Paris föll Robespierre den 27 juli och skräckväldet tog slut, men de ockuperade länderna plundrades på livsmedel, pengar och konstverk för att betala kriget.
