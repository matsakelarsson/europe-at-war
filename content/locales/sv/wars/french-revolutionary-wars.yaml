After the execution of Louis XVI on 21 January 1793 France declared war on Britain and the Dutch Republic, and soon Spain, Portugal, Naples and the Holy Roman Empire were at war with it too, in what became known as the First Coalition. Dumouriez invaded the Dutch Republic in February, but an Austrian army under the Prince of Saxe-Coburg drove the French back and beat them at Neerwinden on 18 March. Belgium was lost, and in April Dumouriez, having failed to turn his army against the Convention, went over to the Austrians. The allies besieged and took the frontier fortresses of Condé and Valenciennes, and the Prussians retook Mainz in July. Inside France revolts broke out in the Vendée, Lyon, Marseille and Toulon.: Efter avrättningen av Ludvig XVI den 21 januari 1793 förklarade Frankrike krig mot Storbritannien och Nederländska republiken, och snart låg också Spanien, Portugal, Neapel och tysk-romerska riket i krig med landet, i det som kom att kallas den första koalitionen. Dumouriez föll in i Nederländska republiken i februari, men en österrikisk armé under prinsen av Sachsen-Coburg drev tillbaka fransmännen och besegrade dem vid Neerwinden den 18 mars. Belgien gick förlorat, och i april gick Dumouriez, sedan han misslyckats med att vända sin armé mot konventet, över till österrikarna. De allierade belägrade och intog gränsfästningarna Condé och Valenciennes, och preussarna återtog Mainz i juli. Inne i Frankrike bröt uppror ut i Vendée, Lyon, Marseille och Toulon.
The Republic answered with the Terror and with mass mobilisation. The levée en masse of 23 August 1793 put the whole nation at the service of the war and called up all unmarried men aged 18 to 25; by 1794 the armies, organised by Lazare Carnot, numbered some 750,000 men. Generals who failed were guillotined, among them Houchard, who beat the Duke of York’s Hanoverians at Hondschoote in September, saving Dunkirk, but did not follow up. Jourdan beat Coburg at Wattignies in October. At Toulon, which royalists had handed to an Anglo-Spanish fleet in August, a young artillery officer, Napoleon Bonaparte, helped plan the attack that forced the allies out on 19 December; hundreds of Toulonnais were shot in reprisal.: Republiken svarade med skräckväldet och med massmobilisering. Levée en masse den 23 augusti 1793 ställde hela nationen i krigets tjänst och kallade in alla ogifta män mellan 18 och 25 år; 1794 räknade arméerna, organiserade av Lazare Carnot, omkring 750 000 man. Generaler som misslyckades giljotinerades, bland dem Houchard, som besegrade hertigen av Yorks hannoveraner vid Hondschoote i september och räddade Dunkerque, men inte följde upp segern. Jourdan besegrade Coburg vid Wattignies i oktober. Vid Toulon, som rojalister hade överlämnat till en engelsk-spansk flotta i augusti, hjälpte en ung artilleriofficer, Napoleon Bonaparte, till att planera det anfall som tvingade ut de allierade den 19 december; hundratals invånare i Toulon arkebuserades som repressalie.
