French Wars of Religion: Franska religionskrigen
A series of civil wars between French Catholics and Protestants (Huguenots), tangled with the rivalry of great noble families and foreign intervention by Spain, England and German princes. Begun with the massacre at Vassy in 1562 and marked by the St Bartholomew’s Day massacre of 1572, they ended when the Protestant Henry of Navarre, heir to the throne from 1584, became a Catholic, won over the Catholic League, granted the Huguenots toleration in the Edict of Nantes and made peace with Spain at Vervins in 1598.: En rad inbördeskrig mellan franska katoliker och protestanter (hugenotter), sammanflätade med rivaliteten mellan stora adelsätter och utländsk intervention från Spanien, England och tyska furstar. De började med massakern i Vassy 1562, präglades av Bartolomeinatten 1572 och upphörde när protestanten Henrik av Navarra, tronarvinge från 1584, blev katolik, vann över Katolska ligan, gav hugenotterna religionsfrihet genom ediktet i Nantes och slöt fred med Spanien i Vervins 1598.
