Jacques Clément, a Dominican friar who had gained an audience, stabbed the king in his camp outside Paris. Henry III died the next day, the last of the Valois kings.: Jacques Clément, en dominikanmunk som hade fått audiens, knivhögg kungen i hans läger utanför Paris. Henrik III dog dagen därpå, den siste av valoiskungarna.
