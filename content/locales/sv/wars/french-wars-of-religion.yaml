The peace did not last. In 1567 the Huguenot leaders tried to seize the young Charles IX at Meaux, and after an indecisive battle at Saint-Denis a second war ended in March 1568. That summer the crown moved to arrest Condé and Admiral Gaspard de Coligny, who escaped to La Rochelle, and a third war began. On 13 March 1569, at Jarnac on the Charente, the royal army under the king’s brother Henry, Duke of Anjou, routed the Huguenots. Condé, injured and captured, was shot dead by one of Anjou’s officers. Coligny took command in the name of two boys, Condé’s son and Henry of Navarre.: Freden varade inte. År 1567 försökte hugenotternas ledare gripa den unge Karl IX i Meaux, och efter ett oavgjort slag vid Saint-Denis upphörde ett andra krig i mars 1568. Den sommaren försökte kronan arrestera Condé och amiral Gaspard de Coligny, som flydde till La Rochelle, och ett tredje krig började. Den 13 mars 1569 vid Jarnac vid Charente slog den kungliga armén under kungens bror Henrik, hertig av Anjou, hugenotterna på flykten. Condé, skadad och tillfångatagen, sköts ihjäl av en av Anjous officerare. Coligny tog befälet i två pojkars namn, Condés son och Henrik av Navarra.
Joined by German mercenaries, Coligny won at La Roche-l’Abeille in June and besieged Poitiers, which held out under the young Henry of Guise. On 3 October Anjou crushed the Huguenot army at Moncontour. Coligny led its remnant on a long march through the south, wintered in Languedoc, and came back north up the Rhône into Burgundy, where he beat a royal army at Arnay-le-Duc in June 1570. The court, short of money, made peace at Saint-Germain-en-Laye on 8 August. The Huguenots gained freedom of worship in named places and, for two years, the fortified towns of La Rochelle, Cognac, Montauban and La Charité.: Förstärkt med tyska legosoldater segrade Coligny vid La Roche-l’Abeille i juni och belägrade Poitiers, som höll ut under den unge Henrik av Guise. Den 3 oktober krossade Anjou hugenottarmén vid Moncontour. Coligny ledde dess rester på en lång marsch genom södern, övervintrade i Languedoc och vände tillbaka norrut uppför Rhône in i Burgund, där han besegrade en kunglig armé vid Arnay-le-Duc i juni 1570. Hovet, som hade ont om pengar, slöt fred i Saint-Germain-en-Laye den 8 augusti. Hugenotterna fick religionsfrihet på angivna platser och, för två år, de befästa städerna La Rochelle, Cognac, Montauban och La Charité.
