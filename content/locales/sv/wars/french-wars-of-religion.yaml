Most Catholics would not accept a Protestant king. The League proclaimed Navarre’s elderly uncle, the Cardinal of Bourbon, king as “Charles X”, and Guise’s brother, the Duke of Mayenne, marched to crush Henry IV in Normandy. Henry beat him at Arques near Dieppe in September 1589, and on 14 March 1590 won a full victory at Ivry. He then blockaded Paris, burning the mills and cutting off its food. The city, ruled by radical Leaguers, held out through the summer; an estimated 40,000–50,000 people died, most of starvation. In late August Spain’s commander in the Netherlands, the Duke of Parma, marched in, took Lagny and reopened supply routes, and Henry withdrew.: De flesta katoliker ville inte godta en protestantisk kung. Ligan utropade Navarras åldrige farbror, kardinalen av Bourbon, till kung som ”Karl X”, och Guises bror, hertigen av Mayenne, marscherade för att krossa Henrik IV i Normandie. Henrik besegrade honom vid Arques nära Dieppe i september 1589 och vann den 14 mars 1590 en fullständig seger vid Ivry. Han blockerade sedan Paris, brände kvarnarna och skar av stadens livsmedelstillförsel. Staden, som styrdes av radikala ligister, höll ut hela sommaren; uppskattningsvis 40 000–50 000 människor dog, de flesta av svält. I slutet av augusti marscherade Spaniens befälhavare i Nederländerna, hertigen av Parma, in, intog Lagny och öppnade försörjningsvägarna igen, och Henrik drog sig tillbaka.
The war spread across France. Spanish troops landed in Brittany to help the League’s governor, the Duke of Mercœur, Savoy invaded Provence, and England sent soldiers to Normandy and Brittany. Parma relieved Rouen too in 1592, but died that December. Weary of war and of Spain’s influence, many Catholics drifted to Henry, especially when the League’s Estates in Paris discussed a Spanish princess for the throne. On 25 July 1593 Henry heard Mass at Saint-Denis and abjured Protestantism. He was crowned at Chartres in February 1594, and on 22 March Paris opened its gates; the Spanish garrison marched out.: Kriget spred sig över Frankrike. Spanska trupper landsteg i Bretagne för att hjälpa ligans guvernör, hertigen av Mercœur, Savojen föll in i Provence, och England sände soldater till Normandie och Bretagne. Parma undsatte också Rouen 1592 men dog i december samma år. Trötta på kriget och på Spaniens inflytande drog sig många katoliker över till Henrik, särskilt när ligans ständer i Paris diskuterade en spansk prinsessa för tronen. Den 25 juli 1593 bevistade Henrik mässan i Saint-Denis och avsvor sig protestantismen. Han kröntes i Chartres i februari 1594, och den 22 mars öppnade Paris sina portar; den spanska garnisonen tågade ut.
