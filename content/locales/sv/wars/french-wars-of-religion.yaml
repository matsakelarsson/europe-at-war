Historians usually count eight wars between 1562 and 1598, separated by edicts of pacification that rarely held for long. The Huguenot risings of the 1620s, ended by the Peace of Alès in 1629, are sometimes counted as a continuation.: Historiker brukar räkna åtta krig mellan 1562 och 1598, åtskilda av pacificeringsedikt som sällan höll länge. Hugenotternas resningar på 1620-talet, som avslutades med freden i Alès 1629, räknas ibland som en fortsättning.
France adopted the Gregorian calendar in December 1582; dates after that are New Style. Contemporary English accounts are ten days behind.: Frankrike införde den gregorianska kalendern i december 1582; datum efter det följer den nya stilen. Samtida engelska redogörelser ligger tio dagar efter.
The Huguenots’ princely leaders came from the house of Bourbon, kings of Navarre and lords of Béarn, which is shown as their land. After Henry of Navarre became king in 1589, his royalists and the Huguenots fought on the same side against the League and Spain.: Hugenotternas furstliga ledare kom från huset Bourbon, kungar av Navarra och herrar över Béarn, som visas som deras land. Sedan Henrik av Navarra blivit kung 1589 stred hans rojalister och hugenotterna på samma sida mot ligan och Spanien.
Numbers killed in the massacres and sieges are uncertain and disputed. The wars as a whole are thought to have cost between two and four million lives, through violence, famine and disease.: Antalet dödade i massakrerna och belägringarna är osäkert och omstritt. Krigen som helhet antas ha kostat mellan två och fyra miljoner människoliv genom våld, svält och sjukdomar.
