In January 1595 Henry declared war on Spain, hoping to unite the French against a foreign enemy. On 5 June he routed a Spanish and League force at Fontaine-Française in Burgundy, the pope lifted his excommunication that autumn, and Mayenne made his peace. In the north Spain did better. It took Cambrai in 1595 and Calais in April 1596, and in March 1597 Spanish soldiers disguised as peasants surprised Amiens. Henry besieged Amiens with a large army and retook it in September. One by one the League’s leaders made terms, the last, Mercœur in Brittany, in March 1598.: I januari 1595 förklarade Henrik Spanien krig i hopp om att ena fransmännen mot en utländsk fiende. Den 5 juni slog han en spansk och ligistisk styrka på flykten vid Fontaine-Française i Burgund, påven hävde hans bannlysning samma höst, och Mayenne slöt fred med honom. I norr gick det bättre för Spanien. Det intog Cambrai 1595 och Calais i april 1596, och i mars 1597 överrumplade spanska soldater utklädda till bönder Amiens. Henrik belägrade Amiens med en stor armé och återtog staden i september. En efter en slöt ligans ledare avtal, den siste, Mercœur i Bretagne, i mars 1598.
At Nantes in April 1598 Henry issued an edict for the Huguenots. It gave them freedom of conscience, public worship in named places, equal civil rights, special courts and, for eight years, control of many fortified towns. On 2 May the Peace of Vervins with Spain restored the borders of 1559; Spain gave back Calais and the other towns it had taken. The edict ended the wars but not the conflict. Huguenot risings in the 1620s ended with the loss of their fortresses, and Louis XIV revoked the edict in 1685.: I Nantes utfärdade Henrik i april 1598 ett edikt för hugenotterna. Det gav dem samvetsfrihet, offentlig gudstjänst på angivna platser, lika medborgerliga rättigheter, särskilda domstolar och, för åtta år, kontroll över många befästa städer. Den 2 maj återställde freden i Vervins med Spanien gränserna från 1559; Spanien lämnade tillbaka Calais och de andra städer det hade intagit. Ediktet gjorde slut på krigen men inte på konflikten. Hugenotternas resningar på 1620-talet slutade med att de förlorade sina fästningar, och Ludvig XIV upphävde ediktet 1685.
