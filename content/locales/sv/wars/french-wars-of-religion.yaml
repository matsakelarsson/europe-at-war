By 1560 perhaps a tenth of the French, among them many nobles, belonged to the Reformed church founded on John Calvin’s teaching; its members were called Huguenots. After Henry II’s death in 1559 the crown passed to boy kings, and the Catholic Guise family and the Protestant Bourbon princes competed for power, while the queen mother, Catherine de’ Medici, sought a compromise. Her Edict of January 1562 allowed Protestants to worship outside town walls. On 1 March the Duke of Guise’s men attacked a Protestant service in a barn at Vassy in Champagne and killed about fifty people. Louis, Prince of Condé, called the Huguenots to arms and seized Orléans on 2 April.: År 1560 tillhörde kanske en tiondel av fransmännen, bland dem många adelsmän, den reformerta kyrka som grundats på Jean Calvins lära; dess medlemmar kallades hugenotter. Efter Henrik II:s död 1559 övergick kronan till barnkungar, och den katolska familjen Guise och de protestantiska bourbonska furstarna tävlade om makten, medan änkedrottningen Katarina av Medici sökte en kompromiss. Hennes januariedikt 1562 tillät protestanterna att hålla gudstjänst utanför stadsmurarna. Den 1 mars anföll hertigen av Guises män en protestantisk gudstjänst i en lada i Vassy i Champagne och dödade omkring femtio människor. Ludvig, prins av Condé, kallade hugenotterna till vapen och intog Orléans den 2 april.
Protestants took Rouen, Lyon and many other towns, and both sides looked abroad. Condé promised Le Havre to Elizabeth I of England in return for troops and money; Spain and the pope helped the crown. The royal army retook Rouen in October. On 19 December the armies met at Dreux, where the Catholics won a hard battle in which each side’s commander was captured, Condé by the royalists and Constable Montmorency by the Huguenots. Guise then besieged Orléans, and there a Huguenot shot him in February 1563. The Edict of Amboise (19 March) allowed limited Protestant worship, and in July French Catholics and Protestants together drove the English from Le Havre.: Protestanterna intog Rouen, Lyon och många andra städer, och båda sidor sökte hjälp utomlands. Condé lovade Le Havre åt Elisabet I av England i utbyte mot trupper och pengar; Spanien och påven hjälpte kronan. Den kungliga armén återtog Rouen i oktober. Den 19 december möttes arméerna vid Dreux, där katolikerna vann ett hårt slag i vilket båda sidors befälhavare tillfångatogs, Condé av rojalisterna och konnetabeln Montmorency av hugenotterna. Guise belägrade sedan Orléans, och där sköts han av en hugenott i februari 1563. Ediktet i Amboise (19 mars) tillät begränsad protestantisk gudstjänst, och i juli drev franska katoliker och protestanter tillsammans ut engelsmännen ur Le Havre.
