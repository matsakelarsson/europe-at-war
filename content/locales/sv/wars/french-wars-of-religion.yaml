The hilltop town held out for months; the pastor Jean de Léry described the famine inside. It surrendered on terms in August.: Staden på kullen höll ut i månader; prästen Jean de Léry beskrev hungersnöden innanför murarna. Den kapitulerade på villkor i augusti.
Charles IX died in 1574, and his brother Henry of Anjou came home from Poland to reign as Henry III; wars and uneasy peaces followed. When the king’s last brother, Francis, died on 10 June 1584, the heir to the childless king became the Protestant Henry of Navarre. Catholic nobles led by Henry, Duke of Guise, revived the Catholic League, made a secret treaty with Philip II of Spain at Joinville on 31 December 1584 and raised the towns. In July 1585, by the Treaty of Nemours, Henry III gave in to them, outlawed Protestantism and excluded Navarre from the succession. The War of the Three Henrys, the king, Guise and Navarre, had begun.: Karl IX dog 1574, och hans bror Henrik av Anjou kom hem från Polen för att regera som Henrik III; krig och osäkra fredsperioder följde. När kungens siste bror, Frans, dog den 10 juni 1584 blev protestanten Henrik av Navarra arvinge till den barnlöse kungen. Katolska adelsmän under ledning av Henrik, hertig av Guise, återupplivade Katolska ligan, slöt ett hemligt fördrag med Filip II av Spanien i Joinville den 31 december 1584 och fick städerna att resa sig. I juli 1585, genom fördraget i Nemours, gav Henrik III efter för dem, förbjöd protestantismen och uteslöt Navarra från tronföljden. De tre Henrikarnas krig, kungens, Guises och Navarras, hade börjat.
On 20 October 1587 Navarre won his first great victory at Coutras, where the king’s favourite, the Duke of Joyeuse, was killed, but Guise destroyed a German army coming to help the Huguenots. Guise was now the hero of Catholic Paris, and on 12 May 1588, the Day of the Barricades, the city rose against royal troops and the king fled. At the Estates-General in Blois Henry III had Guise killed by his guards on 23 December, and his brother the cardinal the next day. The League declared the king deposed; he allied with Navarre, and the two besieged Paris. On 1 August 1589 a friar, Jacques Clément, stabbed Henry III; dying, he recognised Navarre as his heir.: Den 20 oktober 1587 vann Navarra sin första stora seger vid Coutras, där kungens gunstling hertigen av Joyeuse stupade, men Guise förintade en tysk armé som var på väg för att hjälpa hugenotterna. Guise var nu det katolska Paris hjälte, och den 12 maj 1588, barrikadernas dag, reste sig staden mot de kungliga trupperna och kungen flydde. Vid generalständerna i Blois lät Henrik III sina livvakter döda Guise den 23 december, och hans bror kardinalen dagen därpå. Ligan förklarade kungen avsatt; han allierade sig med Navarra, och de två belägrade Paris. Den 1 augusti 1589 knivhögg munken Jacques Clément Henrik III; döende erkände kungen Navarra som sin arvinge.
