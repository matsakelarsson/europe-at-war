Coligny returned to court after the peace, gained the young king’s ear and urged war on Spain in the Netherlands. To seal the peace, Catherine arranged the marriage of her daughter Margaret to the Protestant Henry of Navarre, and Huguenot nobles crowded into Catholic Paris for the wedding on 18 August 1572. On 22 August a gunman wounded Coligny. Fearing Huguenot revenge, the king and his council decided to kill their leaders. Before dawn on 24 August, St Bartholomew’s Day, Guise’s men murdered Coligny in his lodgings, and the killing spread as Paris militiamen and crowds murdered Protestant men, women and children over several days.: Coligny återvände till hovet efter freden, vann den unge kungens öra och förordade krig mot Spanien i Nederländerna. För att besegla freden ordnade Katarina giftermål mellan sin dotter Margareta och protestanten Henrik av Navarra, och hugenottiska adelsmän strömmade till det katolska Paris för bröllopet den 18 augusti 1572. Den 22 augusti sårade en skytt Coligny. Av rädsla för hugenotternas hämnd beslöt kungen och hans råd att döda deras ledare. Före gryningen den 24 augusti, Bartolomeidagen, mördade Guises män Coligny i hans bostad, och dödandet spred sig när Paris borgarmilis och folkmassor under flera dagar mördade protestantiska män, kvinnor och barn.
In the following weeks there were massacres in Orléans, Lyon, Rouen, Bordeaux, Toulouse and other towns. Modern estimates put the dead at about 3,000 in Paris and several thousand more elsewhere, though figures vary widely; many survivors converted or fled abroad, Navarre and the young Condé among those who converted to save their lives. Protestant Europe was horrified, while the pope had a Te Deum sung. The Huguenots of the south and west took up arms again. La Rochelle withstood a royal siege until July 1573, and Sancerre was starved into surrender in August; the Edict of Boulogne allowed Protestant worship only in La Rochelle, Montauban and Nîmes.: Under de följande veckorna skedde massakrer i Orléans, Lyon, Rouen, Bordeaux, Toulouse och andra städer. Moderna uppskattningar anger omkring 3 000 döda i Paris och flera tusen till på andra håll, men siffrorna varierar kraftigt; många överlevande konverterade eller flydde utomlands, och Navarra och den unge Condé var bland dem som konverterade för att rädda livet. Det protestantiska Europa förskräcktes, medan påven lät sjunga ett Te Deum. Hugenotterna i söder och väster grep åter till vapen. La Rochelle stod emot en kunglig belägring till juli 1573, och Sancerre svältes till kapitulation i augusti; ediktet i Boulogne tillät protestantisk gudstjänst bara i La Rochelle, Montauban och Nîmes.
