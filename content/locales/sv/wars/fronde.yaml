The Fronde: Fronden
A series of civil wars in France during the minority of Louis XIV, against the government of the Queen Regent, Anne of Austria, and her chief minister, Cardinal Mazarin, whose taxes for the war with Spain had become unbearable. When the government arrested leaders of the Parlement of Paris in August 1648, barricades went up in the streets; the court fled the capital in January 1649 and the Prince of Condé blockaded it until the Peace of Rueil in March. Mazarin then had Condé and other princes arrested, setting off the “Fronde of the princes”, in which Condé allied with Spain. Turenne, now fighting for the crown, met Condé at the Faubourg Saint-Antoine outside Paris on 2 July 1652, where the guns of the Bastille covered Condé’s retreat into the city. Louis XIV re-entered Paris in October 1652 and Mazarin returned in February 1653; Bordeaux, the last centre of revolt, surrendered in the summer of 1653. Condé fought for Spain until 1659, and the young king never forgot the humiliations of these years.: En rad inbördeskrig i Frankrike under Ludvig XIV:s minderårighet, riktade mot regeringen under drottning Anna av Österrike som regent och hennes förste minister, kardinal Mazarin, vars skatter för kriget mot Spanien hade blivit outhärdliga. När regeringen i augusti 1648 arresterade ledare för parlamentet i Paris restes barrikader på gatorna; hovet flydde huvudstaden i januari 1649 och prinsen av Condé blockerade den fram till freden i Rueil i mars. Mazarin lät därefter arrestera Condé och andra prinsar, vilket utlöste ”prinsarnas fronde”, där Condé allierade sig med Spanien. Turenne, som nu stred för kronan, mötte Condé vid Faubourg Saint-Antoine utanför Paris den 2 juli 1652, där Bastiljens kanoner täckte Condés reträtt in i staden. Ludvig XIV återvände till Paris i oktober 1652 och Mazarin i februari 1653; Bordeaux, upprorets sista fäste, kapitulerade sommaren 1653. Condé stred för Spanien till 1659, och den unge kungen glömde aldrig dessa års förödmjukelser.
The crown (Anne of Austria and Mazarin): Kronan (Anna av Österrike och Mazarin)
The Frondeurs (the Parlement of Paris and the princes): Frondörerna (parlamentet i Paris och prinsarna)
Spain (allied with Condé): Spanien (allierat med Condé)
Fronde (Wikipedia): Fronden (Wikipedia)
Fronde (Britannica): Fronden (Britannica)
Battle of the Faubourg St Antoine (Wikipedia): Slaget vid Faubourg Saint-Antoine (Wikipedia)
The name comes from the fronde, a sling used by Paris street boys. Historians distinguish the Fronde of the Parlement (1648–1649) and the Fronde of the princes (1650–1653). Turenne fought against the court in 1650 and for it from 1651.: Namnet kommer från fronde, en slunga som Paris gatpojkar använde. Historiker skiljer mellan parlamentets fronde (1648–1649) och prinsarnas fronde (1650–1653). Turenne stred mot hovet 1650 och för det från 1651.
