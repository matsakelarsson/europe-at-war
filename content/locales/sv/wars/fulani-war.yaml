# Svenska översättningar av katalogtexten (våg 13); stegtexterna kommer senare.
Fulani War: Fulanikriget
? The jihad of Usman dan Fodio, which overthrew the Hausa kingdoms of what is now northern Nigeria and created the Sokoto Caliphate, the largest state in West Africa in the 19th century. Usman, a Fulani scholar who had preached reform in Gobir and its neighbours for thirty years, was driven from his community at Degel by King Yunfa of Gobir, his former pupil, and on 21 February 1804 led his followers into exile at Gudu, where they swore allegiance to him as Commander of the Faithful. His army, Fulani, Hausa and Tuareg, beat Gobir’s cavalry at Tabkin Kwatto in June 1804, survived a heavy defeat at Tsuntua in December, took Kebbi in 1805 and made Gwandu its base. Leaders who received flags from Usman rose across Hausaland and took Katsina, Kano and Zazzau between 1805 and 1808, and the Gobir capital Alkalawa fell in October 1808. In Bornu the jihadists sacked the capital, Ngazargamu, in 1808, but the scholar Muhammad al-Amin al-Kanemi rallied the old empire, which survived under his family. By 1812 the new state was divided between Usman’s brother Abdullahi at Gwandu and his son Muhammad Bello at Sokoto, and new emirates were growing in the south and east, in Adamawa, Nupe and, from the 1820s, Ilorin. The wars enslaved many thousands of captives, and the caliphate became one of the largest slave societies of the century.
: Usman dan Fodios jihad, som störtade hausarikena i det som i dag är norra Nigeria och skapade Sokotokalifatet, den största staten i Västafrika under 1800-talet. Usman, en lärd fulani som i trettio år hade predikat reform i Gobir och dess grannländer, drevs bort från sin gemenskap i Degel av kung Yunfa av Gobir, hans forne elev, och ledde den 21 februari 1804 sina anhängare i landsflykt till Gudu, där de svor honom trohet som de troendes befälhavare. Hans armé av fulani, hausa och tuareger slog Gobirs kavalleri vid Tabkin Kwatto i juni 1804, överlevde ett svårt nederlag vid Tsuntua i december, intog Kebbi 1805 och gjorde Gwandu till sin bas. Ledare som hade fått fanor av Usman reste sig över hela Hausaland och intog Katsina, Kano och Zazzau mellan 1805 och 1808, och Gobirs huvudstad Alkalawa föll i oktober 1808. I Bornu plundrade jihadisterna huvudstaden Ngazargamu 1808, men den lärde Muhammad al-Amin al-Kanemi samlade det gamla riket, som överlevde under hans släkt. År 1812 var den nya staten delad mellan Usmans bror Abdullahi i Gwandu och hans son Muhammad Bello i Sokoto, och nya emirat växte fram i söder och öster, i Adamawa, Nupe och, från 1820-talet, Ilorin. Krigen förslavade många tusentals fångar, och kalifatet blev ett av århundradets största slavsamhällen.
