# Svenska översättningar av katalogtexten (våg 12); stegtexterna kommer senare.
Funj and Abdallab conquest of Alwa: Funjernas och abdallabernas erövring av Alwa
? "The end of Alwa (Alodia), the last of the Christian Nubian kingdoms, whose capital Soba stood on the Blue Nile just above its meeting with the White Nile, and the rise of the Funj Sultanate of Sennar. By the 15th century Arab Bedouin had settled much of the central Nile valley and Alwa was in decline. Sudanese tradition credits its fall to an alliance between Abdallah Jamma, the ancestor of the Abdallab, who led Arab groups from his seat at Qerri, and Amara Dunqas, king of the Funj, cattle-keepers from the south who founded Sennar on the Blue Nile. The dates are uncertain: the Tabaqat of Wad Dayfallah (about 1700) puts the Funj victory over the “kingdom of the Nuba” in 1504–1505, documents from Shendi give 1509 for the destruction of Soba after an attack in 1474, and the 19th-century Funj Chronicle gives an earlier date. Most modern scholars think Arabs rather than the Funj destroyed Soba, around 1500. When the traveller David Reubeni passed in 1523 he found Soba in ruins, though he still heard of a “kingdom of Soba”, and tradition says Alwan princes held out in the Fazughli hills until the Funj took them in 1685. The Abdallab became vassals of the Funj, who ruled the Gezira from Sennar while the Abdallab governed the north from Qerri, and the Funj Sultanate lasted until the Egyptian conquest of 1821."
: "Slutet för Alwa (Alodia), det sista av de kristna nubiska kungarikena, vars huvudstad Soba låg vid Blå Nilen strax ovanför dess sammanflöde med Vita Nilen, och uppkomsten av Funjsultanatet i Sennar. På 1400-talet hade arabiska beduiner bosatt sig i stora delar av den centrala Nildalen, och Alwa var på nedgång. Enligt sudanesisk tradition föll riket genom en allians mellan Abdallah Jamma, abdallabernas stamfar, som ledde arabiska grupper från sitt säte i Qerri, och Amara Dunqas, kung över funjerna, boskapsskötare från söder som grundade Sennar vid Blå Nilen. Dateringarna är osäkra: Wad Dayfallahs Tabaqat (omkring 1700) förlägger funjernas seger över ”nubafolkets kungarike” till 1504–1505, dokument från Shendi anger 1509 för Sobas förstörelse efter ett anfall 1474, och Funjkrönikan från 1800-talet anger ett tidigare år. De flesta moderna forskare anser att det var araber snarare än funjer som förstörde Soba, omkring 1500. När resenären David Reubeni passerade 1523 fann han Soba i ruiner, även om han fortfarande hörde talas om ett ”kungarike Soba”, och enligt traditionen höll alwanska furstar ut i Fazughlibergen tills funjerna kuvade dem 1685. Abdallaberna blev funjernas vasaller; funjerna styrde Gezira från Sennar medan abdallaberna styrde norra delen från Qerri, och Funjsultanatet bestod fram till den egyptiska erövringen 1821."
