# Svenska översättningar av katalogtexten (våg 13); stegtexterna kommer senare.
Futa Jallon jihad: Jihaden i Futa Jallon
? "The holy war by which Muslim Fulbe and their allies took power in the Futa Jallon highlands of today’s Guinea and founded the Imamate of Futa Jallon, the first of the Fulbe Islamic states of West Africa. About 1725 Muslim leaders meeting at Fugumba called for jihad against the non-Muslim Yalunka (Jallonke) and Fulbe chiefs; led by the scholar Ibrahima Sambegu, known as Karamokho Alfa, and the commander Ibrahima Sori, they won a battle at Talansan, dated by most sources to about 1727, and founded a federation of nine provinces under an almami (imam) at Timbo, checked by a council of elders at Fugumba. Many Yalunka and Susu left the highlands. After Karamokho Alfa’s death in 1751 Ibrahima Sori fought on, allied with the Yalunka kingdom of Solima to raid for captives, was defeated in Wasulu in 1762 and nearly lost Fugumba to Konde Burama of Sankaran, and finally defeated Solima in 1776. The wars produced captives in large numbers: many were sold to European traders on the coast for cloth, iron and guns, and many more were settled as slaves in farming villages that fed the Fulbe elite."
: "Det heliga krig genom vilket muslimska fulbe och deras bundsförvanter tog makten i Futa Jallons högland i dagens Guinea och grundade imamatet Futa Jallon, den första av de islamiska fulbestaterna i Västafrika. Omkring 1725 samlades muslimska ledare i Fugumba och manade till jihad mot icke-muslimska yalunka (jallonke) och fulbehövdingar; under ledning av den lärde Ibrahima Sambegu, känd som Karamokho Alfa, och befälhavaren Ibrahima Sori vann de ett slag vid Talansan, som de flesta källor daterar till omkring 1727, och grundade en federation av nio provinser under en almami (imam) i Timbo, med ett äldsteråd i Fugumba som motvikt. Många yalunka och susu lämnade höglandet. Efter Karamokho Alfas död 1751 fortsatte Ibrahima Sori striden, allierade sig med yalunkariket Solima för att röva fångar, besegrades i Wasulu 1762, var nära att förlora Fugumba till Konde Burama av Sankaran och besegrade slutligen Solima 1776. Krigen gav fångar i stort antal: många såldes till europeiska handlare vid kusten mot tyg, järn och gevär, och ännu fler sattes som slavar i jordbruksbyar som försörjde fulbeeliten."
