# Svenska översättningar av katalogtexten (våg 8); stegtexterna kommer senare.
Conquests of Kapilendra Deva: Kapilendra Devas erövringar
? The wars of Kapilendra Deva, who seized the throne of Odisha from the last Eastern Ganga king in 1434–1435 and founded the Suryavamsi Gajapati dynasty. After putting down rebellious vassals, he turned south against the Reddi kingdoms of coastal Andhra and their ally Vijayanagara. His son Hamvira took Rajahmundry by 1448, and by 1454 the Gajapatis held Kondavidu and the other Reddi lands south to the Krishna. He fought the Bengal Sultanate in the north, took the fort of Mahur during a campaign against Malwa (1457) and defeated the Bahmanis at Devarakonda in 1458, after which he called himself lord of Kalaburagi (Gulbarga); a march on Bidar in 1461 ended when Husain Shah Sharqi of Jaunpur invaded Odisha. From 1460 Hamvira’s generals took Udayagiri and Chandragiri from Vijayanagara and raided as far south as Tiruchirappalli, and in 1464 Kapilendra’s inscriptions claim an empire from the Ganges to the Kaveri. After his death in 1466 or 1467 his sons fought over the throne, and the southern conquests were soon lost to Vijayanagara and the Bahmanis.
: Krigen under Kapilendra Deva, som 1434–1435 tog Odishas tron från den siste kungen av östra gangadynastin och grundade Suryavamsi-gajapatidynastin. Sedan han slagit ned upproriska vasaller vände han sig söderut mot reddirikena i kustlandet Andhra och deras bundsförvant Vijayanagara. Hans son Hamvira intog Rajahmundry senast 1448, och 1454 behärskade gajapatikungarna Kondavidu och de övriga reddiländerna söderut till Krishna. Han bekämpade Bengalsultanatet i norr, intog fortet Mahur under ett fälttåg mot Malwa (1457) och besegrade bahmanierna vid Devarakonda 1458, varefter han kallade sig herre över Kalaburagi (Gulbarga); en marsch mot Bidar 1461 avbröts när Husain Shah Sharqi av Jaunpur invaderade Odisha. Från 1460 tog Hamviras generaler Udayagiri och Chandragiri från Vijayanagara och företog plundringståg ända söderut till Tiruchirappalli, och i inskrifter från 1464 gör Kapilendra anspråk på ett rike från Ganges till Kaveri. Efter hans död 1466 eller 1467 stred hans söner om tronen, och erövringarna i söder gick snart förlorade till Vijayanagara och bahmanierna.
