# Svenska översättningar av katalogtexten (våg 13); stegtexterna kommer senare.
Gambian coup attempt and Senegalese intervention (1981): Kuppförsöket i Gambia och den senegalesiska interventionen (1981)
? An attempt to overthrow President Dawda Jawara of the Gambia, crushed by Senegalese troops. On 30 July 1981, while Jawara was in London for the wedding of Prince Charles and Lady Diana Spencer, Kukoi Samba Sanyang, a left-wing former politician, and members of the paramilitary Field Force seized the Field Force depot at Bakau, the radio station and key points in Banjul, proclaimed a National Revolutionary Council and released and armed prisoners; members of Jawara’s family were among the hostages they took. Jawara flew to Dakar and invoked a defence agreement with Senegal, whose troops entered the Gambia from 31 July in an operation the Senegalese named Fodé Kaba II and, after several days of fighting in and around Banjul and Serrekunda, retook the country by 5 August; a small team of British SAS soldiers helped free the hostages. Estimates of the dead range from about 500 to over 1,000, many of them civilians killed in the fighting and in looting. Kukoi escaped abroad. The coup led to the Senegambia Confederation, agreed on 12 December 1981 and in force from 1 February 1982, which joined the two countries’ armed forces and foreign policy but was dissolved in 1989; Senegalese troops guarded Jawara’s government for much of the 1980s.
: Ett försök att störta Gambias president Dawda Jawara, som krossades av senegalesiska trupper. Den 30 juli 1981, medan Jawara befann sig i London för prins Charles och lady Diana Spencers bröllop, tog Kukoi Samba Sanyang, en vänsterinriktad före detta politiker, och medlemmar av den paramilitära Field Force kontroll över Field Force-depån i Bakau, radiostationen och viktiga punkter i Banjul, utropade ett nationellt revolutionsråd och släppte och beväpnade fångar; medlemmar av Jawaras familj fanns bland den gisslan de tog. Jawara flög till Dakar och åberopade ett försvarsavtal med Senegal, vars trupper från den 31 juli gick in i Gambia i en operation som senegaleserna kallade Fodé Kaba II och som efter flera dagars strider i och omkring Banjul och Serrekunda hade återtagit landet den 5 augusti; en liten grupp brittiska SAS-soldater hjälpte till att befria gisslan. Uppskattningarna av antalet döda sträcker sig från omkring 500 till över 1 000, många av dem civila som dödades i striderna och vid plundring. Kukoi flydde utomlands. Kuppen ledde till konfederationen Senegambia, som avtalades den 12 december 1981 och trädde i kraft den 1 februari 1982 och som förenade de två ländernas försvarsmakter och utrikespolitik men upplöstes 1989; senegalesiska trupper vaktade Jawaras regering under en stor del av 1980-talet.
