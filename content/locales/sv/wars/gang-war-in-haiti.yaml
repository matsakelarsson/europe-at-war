# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
Gang war in Haiti: Gängkriget i Haiti
? The armed conflict between Haiti’s gangs and the Haitian state and the foreign forces sent to help it, which has left most of Port-au-Prince and large parts of the countryside under gang control. Armed groups tied to politicians and businessmen had long held the capital’s poor districts; from 2018, as protests against corruption shook President Jovenel Moïse’s government, they fought over territory and attacked residents, beginning with the massacre at La Saline in November 2018. In 2020 the former police officer Jimmy Chérizier, “Barbecue”, united nine gangs as the G9, opposed by the rival G-Pèp. Moïse was assassinated in July 2021, and under Prime Minister Ariel Henry, who governed without elections, kidnappings, massacres and blockades multiplied. In February and March 2024 the G9 and G-Pèp joined forces as Viv Ansanm, stormed the two largest prisons, closed the airport and forced Henry to resign; a Transitional Presidential Council took over, and from June 2024 a Kenyan-led Multinational Security Support mission (MSS), authorised by the United Nations, arrived to help the police. The gangs spread into the Artibonite and Centre departments, where the Gran Grif gang killed more than 100 people at Pont-Sondé in October 2024. In September 2025 the UN Security Council turned the under-strength mission into a larger Gang Suppression Force (GSF). The United Nations counted more than 4,700 people killed in 2023, 5,601 in 2024 and 5,915 in 2025, and nearly 1.5 million Haitians had been driven from their homes by 2026. In late 2026 the GSF, the police, the small Haitian army, private contractors with drones and some 2,500 Salvadoran troops were fighting to retake districts of the capital, while elections planned for December 2026 were postponed indefinitely.
: Den väpnade konflikten mellan Haitis gäng å ena sidan och den haitiska staten och de utländska styrkor som har sänts för att hjälpa den å den andra, en konflikt som har lämnat större delen av Port-au-Prince och stora delar av landsbygden under gängens kontroll. Väpnade grupper med band till politiker och affärsmän hade länge behärskat huvudstadens fattiga stadsdelar; från 2018, när protester mot korruptionen skakade president Jovenel Moïses regering, stred de om territorium och angrep invånare, med början i massakern i La Saline i november 2018. År 2020 enade den före detta polisen Jimmy Chérizier, ”Barbecue”, nio gäng i G9, som motarbetades av det rivaliserande G-Pèp. Moïse mördades i juli 2021, och under premiärminister Ariel Henry, som styrde utan val, mångdubblades kidnappningarna, massakrerna och blockaderna. I februari och mars 2024 gick G9 och G-Pèp samman som Viv Ansanm, stormade de två största fängelserna, stängde flygplatsen och tvingade Henry att avgå; ett presidentråd för övergångsperioden tog över, och från juni 2024 anlände en kenyanskt ledd multinationell säkerhetsstödsinsats (MSS), bemyndigad av FN, för att hjälpa polisen. Gängen spred sig till departementen Artibonite och Centre, där gänget Gran Grif dödade mer än 100 människor i Pont-Sondé i oktober 2024. I september 2025 omvandlade FN:s säkerhetsråd den underbemannade insatsen till en större styrka för gängbekämpning, Gang Suppression Force (GSF). FN registrerade mer än 4 700 dödade under 2023, 5 601 under 2024 och 5 915 under 2025, och 2026 hade nästan 1,5 miljoner haitier drivits från sina hem. I slutet av 2026 kämpade GSF, polisen, den lilla haitiska armén, privata säkerhetsentreprenörer med drönare och omkring 2 500 salvadoranska soldater för att återta stadsdelar i huvudstaden, medan de val som hade planerats till december 2026 sköts upp på obestämd tid.
Haitian government and National Police, with the Kenyan-led MSS (from 2025 the Gang Suppression Force) and, from October 2026, troops of El Salvador: Haitis regering och nationella polis, med den kenyanskt ledda MSS (från 2025 Gang Suppression Force) och, från oktober 2026, trupper från El Salvador
