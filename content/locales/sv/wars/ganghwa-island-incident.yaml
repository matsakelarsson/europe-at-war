# Svenska översättningar av katalogtexten (våg 10); stegtexterna kommer senare.
Ganghwa Island incident: Incidenten vid Ganghwaön
? A clash between the Japanese gunboat Un’yō and the Korean forts at the mouth of the Han River, which Japan used to force Korea to open its ports. After the Meiji Restoration Korea had refused to accept letters from the new Japanese government because they used titles reserved for the Chinese emperor, and talks at Busan in 1875 had failed. In September 1875 the Un’yō, under Inoue Yoshika, was surveying the Korean coast. On 20 September a boat from the ship approached the fort of Chojijin on Ganghwa Island, said to be looking for water, and the fort fired on it. The next day the Un’yō shelled Chojijin, and on 22 September it bombarded the fort of Yeongjongjin on Yeongjong Island and landed marines, who burned the town and carried off its cannon. Thirty-five Koreans were killed and sixteen captured; two Japanese were wounded. In February 1876 Japan sent Kuroda Kiyotaka with warships and troops to Ganghwa to demand redress, and on 26 February the Korean envoy Sin Heon signed the Japan–Korea Treaty of Amity, the Treaty of Ganghwa. It declared Korea an independent state with the same sovereign rights as Japan, opened Busan and two more ports (Wonsan and Incheon) to Japanese trade, gave Japanese subjects extraterritorial rights and allowed Japan to survey the Korean coast. It was the first of the unequal treaties that opened Korea.
: En sammandrabbning mellan den japanska kanonbåten Un’yō och de koreanska fästningarna vid Hanflodens mynning, som Japan använde för att tvinga Korea att öppna sina hamnar. Efter Meijirestaurationen hade Korea vägrat att ta emot skrivelser från den nya japanska regeringen eftersom de använde titlar som var förbehållna den kinesiske kejsaren, och förhandlingar i Busan 1875 hade misslyckats. I september 1875 kartlade Un’yō, under Inoue Yoshika, den koreanska kusten. Den 20 september närmade sig en båt från fartyget fästningen Chojijin på Ganghwaön, enligt uppgift för att leta efter vatten, och fästningen öppnade eld mot den. Dagen därpå besköt Un’yō Chojijin, och den 22 september bombarderade fartyget fästningen Yeongjongjin på Yeongjongön och landsatte marinsoldater, som brände staden och förde bort dess kanoner. Trettiofem koreaner dödades och sexton tillfångatogs; två japaner sårades. I februari 1876 sände Japan Kuroda Kiyotaka med krigsfartyg och trupper till Ganghwa för att kräva gottgörelse, och den 26 februari undertecknade det koreanska sändebudet Sin Heon det japansk-koreanska vänskapsfördraget, Ganghwafördraget. Det förklarade Korea vara en självständig stat med samma suveräna rättigheter som Japan, öppnade Busan och ytterligare två hamnar (Wonsan och Incheon) för japansk handel, gav japanska undersåtar exterritoriella rättigheter och tillät Japan att kartlägga den koreanska kusten. Det var det första av de ojämlika fördrag som öppnade Korea.
