# Svenska översättningar av katalogtexten (våg 10); stegtexterna kommer senare.
Gangyō rebellion: Gangyōupproret
? A rising of the Emishi of northern Dewa against the officials of Akita Castle, the court’s frontier headquarters on the Sea of Japan coast. After years of harsh rule and a famine, Emishi living under the court’s authority (fushū) attacked Akita Castle in the third month of 878; its commander and the governor of Dewa fled, and the rebels burned the castle and the settlements around it. An army of 5,000 men from Mutsu and Dewa sent against them was routed at Akita in the sixth month, losing hundreds of suits of armour, its rice and some 1,500 horses. Twelve Emishi villages north of the Akita River joined the rising, with support from the Emishi of Tsugaru and Watarishima, and the rebels demanded that the land north of the river be recognised as their own. The regent Fujiwara no Mototsune sent Fujiwara no Yasunori, a governor known for good administration, as acting governor of Dewa, with the soldier Ono no Harukaze as frontier commander. Yasunori kept his troops on the defensive, opened the state granaries and offered pardons; from the eighth month the rebel groups came in to surrender, and in the third month of 879 the court called off the campaign. The settlement showed that the court could no longer impose its rule in the north by force. Akita Castle was rebuilt under a strengthened commander, the Akita-jō no suke.
: Ett uppror bland emishi i norra Dewa mot ämbetsmännen i Akitaborgen, hovets högkvarter vid gränsen, på kusten mot Japanska havet. Efter år av hårt styre och en hungersnöd angrep emishi som levde under hovets överhöghet (fushū) Akitaborgen i tredje månaden 878; dess befälhavare och guvernören i Dewa flydde, och rebellerna brände borgen och bosättningarna runt den. En armé på 5 000 man från Mutsu och Dewa som sändes mot dem slogs på flykten vid Akita i sjätte månaden och förlorade hundratals rustningar, sitt ris och omkring 1 500 hästar. Tolv emishibyar norr om Akitafloden anslöt sig till upproret, med stöd från emishi i Tsugaru och Watarishima, och rebellerna krävde att landet norr om floden skulle erkännas som deras eget. Regenten Fujiwara no Mototsune sände Fujiwara no Yasunori, en guvernör känd för god förvaltning, som tillförordnad guvernör i Dewa, med krigaren Ono no Harukaze som gränsbefälhavare. Yasunori höll sina trupper på defensiven, öppnade statens spannmålsmagasin och erbjöd amnesti; från åttonde månaden kom rebellgrupperna in för att kapitulera, och i tredje månaden 879 avblåste hovet fälttåget. Uppgörelsen visade att hovet inte längre kunde genomdriva sitt styre i norr med våld. Akitaborgen byggdes upp igen under en befälhavare med stärkt ställning, Akita-jō no suke.
