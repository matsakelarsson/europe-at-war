# Svenska översättningar av katalogtexten (våg 10); stegtexterna kommer senare.
Gapsin coup: Gapsinkuppen
? A failed coup in Hanseong by the young reformers of the Enlightenment Party (Gaehwadang), named after the year 1884, gapsin in the sixty-year cycle. Kim Ok-gyun, Pak Yeong-hyo, Hong Yeong-sik, Seo Gwang-beom and Seo Jae-pil wanted to end Korea’s dependence on China and reform the state on the model of Meiji Japan, and were losing ground to the pro-Chinese faction around Queen Min. When half of the Chinese garrison left for the war with France, they planned a coup with the promised help of the Japanese minister Takezoe Shin’ichirō. On the evening of 4 December 1884, at a banquet for the opening of the new post office, which Hong Yeong-sik headed, their men set a fire as a signal and wounded the queen’s nephew Min Yeong-ik. The plotters took King Gojong to the Gyeongugung palace, guarded by about 140 Japanese legation troops, and killed six conservative ministers. On 5 December they announced a new government and a programme of reform, including the end of tribute to China, equal rights for all and the abolition of the yangban’s privileges. On 6 December some 1,500 Chinese troops under Yuan Shikai attacked the palace, by then Changdeokgung, together with Korean soldiers; the Japanese troops withdrew, Hong Yeong-sik was killed, and crowds burned the Japanese legation and killed some forty Japanese. Kim Ok-gyun, Pak Yeong-hyo and the others escaped to Japan, and their relatives were executed. Japan obtained an apology and compensation in the Treaty of Hanseong of 9 January 1885, and in the Convention of Tianjin of 18 April 1885 Japan and China agreed to withdraw their troops from Korea and to notify each other before sending them again.
: En misslyckad kupp i Hanseong, genomförd av de unga reformivrarna i Upplysningspartiet (Gaehwadang) och uppkallad efter året 1884, gapsin i sextioårscykeln. Kim Ok-gyun, Pak Yeong-hyo, Hong Yeong-sik, Seo Gwang-beom och Seo Jae-pil ville göra slut på Koreas beroende av Kina och reformera staten efter Meijijapans förebild, och de höll på att förlora mark till den kinavänliga fraktionen kring drottning Min. När halva den kinesiska garnisonen avgick till kriget mot Frankrike planerade de en kupp med utlovad hjälp av den japanske ministern Takezoe Shin’ichirō. På kvällen den 4 december 1884, vid en bankett för invigningen av det nya postverket, som leddes av Hong Yeong-sik, anlade deras män en brand som signal och sårade drottningens brorson Min Yeong-ik. Konspiratörerna förde kung Gojong till palatset Gyeongugung, som bevakades av omkring 140 soldater från den japanska legationen, och dödade sex konservativa ministrar. Den 5 december tillkännagav de en ny regering och ett reformprogram, som bland annat omfattade slutet på tributen till Kina, lika rättigheter för alla och avskaffandet av yangbanklassens privilegier. Den 6 december angrep omkring 1 500 kinesiska soldater under Yuan Shikai palatset, då Changdeokgung, tillsammans med koreanska soldater; de japanska trupperna drog sig tillbaka, Hong Yeong-sik dödades, och folkmassor brände den japanska legationen och dödade ett fyrtiotal japaner. Kim Ok-gyun, Pak Yeong-hyo och de andra flydde till Japan, och deras anhöriga avrättades. Japan fick en ursäkt och skadestånd genom Hanseongfördraget den 9 januari 1885, och i Tianjinkonventionen den 18 april 1885 kom Japan och Kina överens om att dra tillbaka sina trupper från Korea och att underrätta varandra innan de sände dit trupper igen.
Enlightenment Party: Upplysningspartiet
Japan: Japan
Qing China: Qingriket
