Gascon War: Gascognekriget
A war between Philip IV of France and Edward I of England over the Duchy of Aquitaine, which Edward held as Philip’s vassal. After years of clashes between Norman and Gascon and English sailors, Philip summoned Edward to his court; Edward’s brother Edmund agreed in secret to a token French occupation of the duchy’s strongholds, but the Parlement of Paris declared the fief forfeit on 19 May 1294, and French armies under Charles of Valois and Robert of Artois took most of Gascony, including Bordeaux. English expeditions held only Bayonne and a few other places, and Edward’s alliance with Count Guy of Flanders and German princes achieved little; the Flemings were beaten at Furnes in August 1297 and a truce followed that October. By the Treaty of Montreuil of 1299 Edward married Philip’s sister Margaret, and after the French defeat by the Flemings at Courtrai in 1302 the Treaty of Paris of 20 May 1303 gave Gascony back to Edward.: Ett krig mellan Filip IV av Frankrike och Edvard I av England om hertigdömet Aquitanien, som Edvard innehade som Filips vasall. Efter flera års sammandrabbningar mellan normandiska sjömän och gaskognska och engelska sjömän kallade Filip Edvard inför sitt hov; Edvards bror Edmund gick i hemlighet med på en symbolisk fransk ockupation av hertigdömets fästen, men parlamentet i Paris förklarade länet förverkat den 19 maj 1294, och franska härar under Karl av Valois och Robert av Artois intog större delen av Gascogne, däribland Bordeaux. Engelska expeditioner höll endast Bayonne och några andra platser, och Edvards allians med greve Guido av Flandern och tyska furstar uträttade föga; flamländarna besegrades vid Furnes i augusti 1297 och ett stillestånd följde i oktober samma år. Genom fördraget i Montreuil 1299 gifte sig Edvard med Filips syster Margareta, och efter det franska nederlaget mot flamländarna vid Courtrai 1302 gav freden i Paris den 20 maj 1303 Gascogne tillbaka till Edvard.
