Portuguese campaign against Gaza: Portugals fälttåg mot Gaza
? The Portuguese conquest of the Gaza kingdom of Ngungunhane (Gungunhana) in southern Mozambique in 1895. The kingdom, founded in the 1820s by Nguni from Zululand under Soshangane, ruled Tsonga, Chopi and Ndau subjects between the Incomati and the Save; Ngungunhane had played Portugal against Cecil Rhodes’s British South Africa Company, but the Anglo-Portuguese treaty of 1891 placed all of it in Portugal’s sphere. In 1894 Ronga chiefdoms near Lourenço Marques (Maputo), under Portuguese overlordship, rose against taxes and abuses and attacked the town. Portugal sent an expedition under the royal commissioner António Enes, which defeated the Ronga at Marracuene on 2 February 1895. When Ngungunhane sheltered their chiefs and refused Portugal’s terms, Portuguese columns, fighting in squares with machine guns and modern rifles, won at Magul (8 September) and at Coolela near his capital Mandlakazi (Manjacaze) on 7 November, and burned the capital. On 28 December Joaquim Mouzinho de Albuquerque seized Ngungunhane at Chaimite. The king died in exile in the Azores in 1906; a last rising under his general Maguiguana was crushed in 1897.
: Den portugisiska erövringen av Ngungunhanes (Gungunhanas) Gazarike i södra Moçambique 1895. Riket, som grundats på 1820-talet av nguni från Zululand under Soshangane, härskade över tsonga-, chopi- och ndauundersåtar mellan Incomati och Save; Ngungunhane hade spelat ut Portugal mot Brittiska Sydafrikakompaniet under Cecil Rhodes, men det anglo-portugisiska fördraget 1891 placerade hela riket i Portugals intressesfär. 1894 reste sig rongahövdingadömen nära Lourenço Marques (Maputo), som stod under portugisisk överhöghet, mot skatter och övergrepp och angrep staden. Portugal sände en expedition under den kunglige kommissarien António Enes, som besegrade ronga vid Marracuene den 2 februari 1895. När Ngungunhane gav deras hövdingar skydd och vägrade godta Portugals villkor segrade portugisiska kolonner, som stred i fyrkanter med kulsprutor och moderna gevär, vid Magul (8 september) och vid Coolela nära hans huvudstad Mandlakazi (Manjacaze) den 7 november, och brände huvudstaden. Den 28 december grep Joaquim Mouzinho de Albuquerque Ngungunhane i Chaimite. Kungen dog i exil på Azorerna 1906; en sista resning under hans general Maguiguana slogs ned 1897.
