# Svenska översättningar av katalogtexten (våg 10); stegtexterna kommer senare.
General Sherman incident: General Sherman-incidenten
? The destruction of the American-owned armed merchant schooner General Sherman on the Taedong River at Pyongyang. The ship sailed from Yantai on 9 August 1866 with a cargo of cotton cloth, glass and tinware, intending to open trade with Korea despite its closed-door policy. On board were its owner W. B. Preston, an American captain and mate, the British supercargo George Hogarth, the Welsh missionary Robert Jermain Thomas as interpreter, and a Chinese and Malay crew. It entered the Taedong on 16 August and went up to Pyongyang, ignoring officials’ orders to leave. The regent Heungseon Daewongun, who took it for a French warship come to avenge the executed missionaries, told the governor of Pyongan, Bak Gyu-su, to drive it away. When the crew seized a Korean officer, Yi Hyeon-ik, whose boat had been shadowing them, crowds gathered on the banks and attacked the ship, which had run aground on a sandbank as the river fell, and its cannon killed several people on the shore. On 2 September Korean troops sent fire ships down on it; the ship burned and everyone on board, about twenty people, was killed as they reached the bank. The United States learned of their fate only gradually, and in 1871 sent a naval expedition to Korea, in part because of the incident. North Korean accounts later credited Kim Il Sung’s great-grandfather Kim Ung-u with leading the attack, for which there is no historical evidence.
: Förstörelsen av den amerikanskägda beväpnade handelsskonaren General Sherman på Taedongfloden vid Pyongyang. Fartyget avseglade från Yantai den 9 augusti 1866 med en last av bomullstyg, glas och bleckvaror, i avsikt att öppna handel med Korea trots landets isoleringspolitik. Ombord fanns ägaren W. B. Preston, en amerikansk kapten och styrman, den brittiske superkargören George Hogarth, den walesiske missionären Robert Jermain Thomas som tolk samt en kinesisk och malajisk besättning. Fartyget seglade in i Taedong den 16 augusti och gick upp till Pyongyang utan att bry sig om ämbetsmännens order att ge sig av. Regenten Heungseon Daewongun, som trodde att det var ett franskt krigsfartyg som kommit för att hämnas de avrättade missionärerna, beordrade guvernören i Pyongan, Bak Gyu-su, att driva bort det. När besättningen grep en koreansk officer, Yi Hyeon-ik, vars båt hade skuggat dem, samlades folkmassor på stränderna och angrep fartyget, som hade gått på grund på en sandbank när vattnet i floden sjönk, och dess kanoner dödade flera människor på stranden. Den 2 september sände koreanska trupper brännare nedför floden mot det; fartyget brann och alla ombord, omkring tjugo personer, dödades när de nådde stranden. USA fick bara gradvis veta vad som hänt dem och sände 1871 en flottexpedition till Korea, delvis på grund av incidenten. Nordkoreanska framställningar tillskrev senare Kim Il Sungs farfars far Kim Ung-u ledningen av angreppet, något som det saknas historiska belägg för.
