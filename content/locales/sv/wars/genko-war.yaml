# Svenska översättningar av katalogtexten (våg 10); stegtexterna kommer senare.
Genkō War: Genkōkriget
? The war in which Emperor Go-Daigo and the warriors who rallied to him overthrew the Kamakura shogunate and the Hōjō family that had ruled it as regents for more than a century. Go-Daigo, determined to rule in person rather than through retired emperors or the shogunate, was betrayed by an adviser in 1331, fled to the mountain temple of Kasagi and was captured; Kamakura enthroned his rival Kōgon and exiled him to the Oki Islands in 1332. His son Prince Morinaga and Kusunoki Masashige, a warrior of Kawachi, kept up the fight, and Masashige’s defence of Chihaya against a huge besieging army in 1333 encouraged risings across the country. Go-Daigo escaped from Oki and raised his banner at Mount Senjō in Hōki. The shogunate sent Ashikaga Takauji, head of a great Minamoto branch family, against him, but Takauji changed sides and took Rokuhara, the shogunate’s headquarters in Kyoto, on 19 June 1333. Days later Nitta Yoshisada rose in Kōzuke, defeated the Hōjō armies on the plains of Musashi and broke into Kamakura, where the regent Hōjō Takatoki and some 800 of his family and followers killed themselves on 4 July 1333. The shogunate’s headquarters in Kyushu fell three days later, and Go-Daigo returned to Kyoto to begin the Kenmu Restoration.
: Kriget där kejsar Go-Daigo och de krigare som slöt upp kring honom störtade Kamakurashogunatet och Hōjōsläkten, som hade styrt det som regenter i mer än ett sekel. Go-Daigo, som var fast besluten att regera personligen i stället för genom abdikerade kejsare eller shogunatet, förråddes av en rådgivare 1331, flydde till bergstemplet Kasagi och tillfångatogs; Kamakura satte hans rival Kōgon på tronen och förvisade honom till Okiöarna 1332. Hans son prins Morinaga och Kusunoki Masashige, en krigare från Kawachi, fortsatte kampen, och Masashiges försvar av Chihaya mot en väldig belägringsarmé 1333 uppmuntrade resningar över hela landet. Go-Daigo flydde från Oki och reste sitt baner på berget Senjō i Hōki. Shogunatet sände Ashikaga Takauji, överhuvud för en stor sidogren av Minamotoklanen, mot honom, men Takauji bytte sida och intog Rokuhara, shogunatets högkvarter i Kyoto, den 19 juni 1333. Några dagar senare reste sig Nitta Yoshisada i Kōzuke, besegrade Hōjōs arméer på Musashis slätter och bröt sig in i Kamakura, där regenten Hōjō Takatoki och omkring 800 av hans släktingar och anhängare tog livet av sig den 4 juli 1333. Shogunatets högkvarter på Kyushu föll tre dagar senare, och Go-Daigo återvände till Kyoto för att inleda Kenmurestaurationen.
