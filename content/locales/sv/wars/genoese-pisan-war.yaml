Genoese–Pisan War, 1282–1290: Genuesisk-pisanska kriget 1282–1290
A war between the maritime republics of Genoa and Pisa for Corsica, Sardinia and the trade of the Tyrrhenian Sea, which began in 1282 when Pisa backed a Corsican lord’s revolt against Genoa. On 6 August 1284, off the islet of Meloria near Livorno, the Genoese fleet under Oberto Doria, with a second squadron under Benedetto Zaccaria, destroyed the Pisan fleet led by the podestà Albertino Morosini and Count Ugolino della Gherardesca; some 5,000 Pisans were killed and about 9,000 taken to Genoa, where many died in captivity. Florence, Lucca and other Guelph cities then joined the war against Pisa. Ugolino, who ruled Pisa after the battle, gave castles to Florence and Lucca to break up the alliance; overthrown in 1288, he was starved to death in a tower with his sons and grandsons, a story made famous by Dante. By 1290 Genoese raids had wrecked Porto Pisano, the city’s harbour, and Pisa never recovered its power at sea.: Ett krig mellan sjörepublikerna Genua och Pisa om Korsika, Sardinien och handeln på Tyrrenska havet, som började 1282 när Pisa stödde en korsikansk herres revolt mot Genua. Den 6 augusti 1284, utanför holmen Meloria nära Livorno, förintade den genuesiska flottan under Oberto Doria, med en andra eskader under Benedetto Zaccaria, den pisanska flottan under podestàn Albertino Morosini och greve Ugolino della Gherardesca; omkring 5 000 pisaner dödades och omkring 9 000 fördes till Genua, där många dog i fångenskap. Florens, Lucca och andra guelfiska städer anslöt sig därefter till kriget mot Pisa. Ugolino, som styrde Pisa efter slaget, gav borgar åt Florens och Lucca för att splittra alliansen; han störtades 1288 och lämnades att svälta ihjäl i ett torn tillsammans med sina söner och sonsöner, en historia som Dante gjorde berömd. År 1290 hade genuesiska härjningståg ödelagt Porto Pisano, stadens hamn, och Pisa återvann aldrig sin makt till sjöss.
