# Svenska översättningar av katalogtexten (våg 10); stegtexterna kommer senare.
Genpei War: Genpeikriget
? "The civil war between the Taira and the Minamoto, the two great warrior houses of late Heian Japan, which ended the Taira’s hold on the court and led to the first warrior government in Kamakura. Taira no Kiyomori had dominated the court since the Heiji rebellion, and in 1179–1180 he put the retired emperor Go-Shirakawa under arrest and placed his own infant grandson Antoku on the throne. Prince Mochihito’s call to arms against him failed at Uji in June 1180, but it set off risings across the east: Minamoto no Yoritomo, after a defeat at Ishibashiyama, made himself master of the Kantō from Kamakura, and his cousin Minamoto no Yoshinaka rose in Shinano. After two years of famine, Yoshinaka destroyed the main Taira army at Kurikara in 1183 and drove the Taira, with the boy emperor and the imperial regalia, out of the capital. Yoshinaka then fell out with Go-Shirakawa and Yoritomo and was killed by Yoritomo’s brothers Yoshitsune and Noriyori early in 1184. Yoshitsune defeated the Taira at Ichi-no-Tani in 1184 and Yashima in 1185 and destroyed their fleet at Dan-no-ura on 25 April 1185, where Antoku drowned. Yoritomo was given the right to appoint military governors and stewards across the country at the end of 1185, and in 1192 he became shōgun."
: "Inbördeskriget mellan Taira och Minamoto, de två stora krigarhusen i Japan under den sena Heianperioden, som bröt Tairas grepp om hovet och ledde till den första krigarregeringen i Kamakura. Taira no Kiyomori hade dominerat hovet sedan Heijiupproret, och 1179–1180 satte han den abdikerade kejsaren Go-Shirakawa i arrest och satte sitt eget späda barnbarn Antoku på tronen. Prins Mochihitos uppmaning till väpnad kamp mot honom misslyckades vid Uji i juni 1180, men den utlöste resningar över hela östra Japan: Minamoto no Yoritomo gjorde sig efter ett nederlag vid Ishibashiyama till herre över Kantō från Kamakura, och hans kusin Minamoto no Yoshinaka reste sig i Shinano. Efter två års hungersnöd förintade Yoshinaka Tairas huvudarmé vid Kurikara 1183 och drev Taira, med barnkejsaren och de kejserliga regalierna, ut ur huvudstaden. Yoshinaka blev sedan osams med Go-Shirakawa och Yoritomo och dödades av Yoritomos bröder Yoshitsune och Noriyori i början av 1184. Yoshitsune besegrade Taira vid Ichi-no-Tani 1184 och vid Yashima 1185 och förintade deras flotta vid Dan-no-ura den 25 april 1185, där Antoku drunknade. Yoritomo fick i slutet av 1185 rätten att utse militärguvernörer och godsförvaltare i hela landet, och 1192 blev han shogun."
