4 April 1525: 4 april 1525
The League’s army, some 7,000 foot and 1,500 horse, scattered the band camped by the Danube. Hundreds were cut down or drowned trying to escape across the river.: Förbundets här, omkring 7 000 fotsoldater och 1 500 ryttare, skingrade skaran som slagit läger vid Donau. Hundratals höggs ned eller drunknade när de försökte fly över floden.
Weinsberg: Weinsberg
16 April 1525: 16 april 1525
On Easter Sunday the band under Jäcklein Rohrbach stormed the town and killed the Habsburg governor, Count Ludwig of Helfenstein, with the nobles captured with him. The killings turned many, including Luther, against the rebels.: På påskdagen stormade skaran under Jäcklein Rohrbach staden och dödade den habsburgske ståthållaren greve Ludwig av Helfenstein tillsammans med de adelsmän som tillfångatagits med honom. Dödandet vände många, däribland Luther, mot rebellerna.
Facing the bands’ larger numbers, the Truchsess promised to hear their grievances, and the Lake Constance and Allgäu bands went home.: Inför skarornas större antal lovade truchsessen att höra deras klagomål, och Bodensjö- och Allgäuskarorna gick hem.
Truchsess: Truchsessen
