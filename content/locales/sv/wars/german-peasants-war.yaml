In May 1525 the rising reached the Alps. In Tyrol peasants and miners sacked the bishop’s palace at Brixen and the abbey of Neustift, and chose as their leader Michael Gaismair, the bishop’s former secretary. Archduke Ferdinand calmed the county by calling a diet at Innsbruck and making concessions. In Salzburg, miners from Hallein and peasants from the mountain valleys entered the city at the end of May and besieged Archbishop Matthäus Lang in the Hohensalzburg fortress. On 3 July they beat a Styrian army at Schladming, the only large battle won by rebels in the war.: I maj 1525 nådde upproret Alperna. I Tyrolen plundrade bönder och gruvarbetare biskopspalatset i Brixen och klostret Neustift och valde till sin ledare Michael Gaismair, biskopens förre sekreterare. Ärkehertig Ferdinand lugnade grevskapet genom att sammankalla en lantdag i Innsbruck och göra eftergifter. I Salzburg tågade gruvarbetare från Hallein och bönder från bergsdalarna in i staden i slutet av maj och belägrade ärkebiskop Matthäus Lang i fästningen Hohensalzburg. Den 3 juli besegrade de en steiermärkisk här vid Schladming, det enda stora slag som rebeller vann i kriget.
A Swabian League army faced the Salzburg rebels in August, but instead of a battle there was a truce on 31 August. In the spring of 1526 the Pinzgau rose again, and Gaismair, who had escaped to Switzerland and drafted a constitution for a Tyrolean peasant republic without nobles or church lords, came to lead it. The rebels failed to take Radstadt, which the League relieved, and in July Gaismair led the last 2,000 fighters over the Tauern into Venetian territory. Ferdinand put a price on his head, and he was murdered in Padua in 1532.: En här från Schwabiska förbundet ställdes mot Salzburgrebellerna i augusti, men i stället för ett slag blev det ett stillestånd den 31 augusti. Våren 1526 reste sig Pinzgau på nytt, och Gaismair, som hade flytt till Schweiz och utarbetat en författning för en tyrolsk bonderepublik utan adel och kyrkliga herrar, kom för att leda resningen. Rebellerna misslyckades med att inta Radstadt, som förbundet undsatte, och i juli ledde Gaismair de sista 2 000 kämparna över Tauern in på venetianskt område. Ferdinand satte ett pris på hans huvud, och han mördades i Padua 1532.
