Peasants here refused their lord’s demands for labour, the first spark of the war. Under Hans Müller of Bulgenbach the Black Forest bands later spread the rising to the Breisgau.: Bönderna här vägrade att utföra det arbete som deras herre krävde, krigets första gnista. Under Hans Müller från Bulgenbach spred Schwarzwaldskarorna senare upproret till Breisgau.
