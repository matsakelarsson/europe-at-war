7 March 1525: 7 mars 1525
The three Upper Swabian bands formed a Christian Association in the imperial city and adopted the Twelve Articles, probably drafted by the furrier Sebastian Lotzer and the preacher Christoph Schappeler.: De tre oberschwabiska skarorna bildade en kristlig förening i den fria riksstaden och antog de tolv artiklarna, troligen författade av körsnären Sebastian Lotzer och predikanten Christoph Schappeler.
