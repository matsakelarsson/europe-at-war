The rebel armies were known as Haufen, “bands”, named after their home districts. Numbers of rebels and of dead are uncertain; about 100,000 dead is the figure most often given.: De upproriska härarna kallades Haufen, ”skaror”, och fick namn efter sina hembygder. Antalet upprorsmän och döda är osäkert; omkring 100 000 döda är den siffra som oftast anges.
Württemberg was ruled by the Habsburgs from 1520 to 1534, after the Swabian League had driven out Duke Ulrich, and Archduke Ferdinand governed it at the time of the war.: Württemberg styrdes av habsburgarna 1520–1534, sedan Schwabiska förbundet hade drivit bort hertig Ulrich, och ärkehertig Ferdinand förvaltade det vid tiden för kriget.
