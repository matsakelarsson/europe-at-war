German Peasants’ War: Tyska bondekriget
The largest popular rising in Europe before the French Revolution, in which peasants, miners and townspeople across southern and central Germany and the Austrian Alps rose against their lords in 1524–1525, many of them inspired by the Reformation and the Twelve Articles. The armies of the Swabian League and the princes crushed the bands one after another, and by common estimates about 100,000 people were killed.: Det största folkupproret i Europa före franska revolutionen, där bönder, gruvarbetare och stadsbor i södra och mellersta Tyskland och de österrikiska Alperna reste sig mot sina herrar 1524–1525, många av dem inspirerade av reformationen och de tolv artiklarna. Schwabiska förbundets och furstarnas härar krossade de upproriska skarorna en efter en, och enligt vanliga uppskattningar dödades omkring 100 000 människor.
