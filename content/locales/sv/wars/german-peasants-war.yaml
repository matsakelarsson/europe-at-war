In the summer of 1524 peasants in the landgraviate of Stühlingen, on the southern edge of the Black Forest, refused the services their lord demanded, and over the winter unrest spread through the Black Forest and the Hegau. Behind it lay rising dues, a tightening of serfdom and lords’ claims on common woods and pastures, sharpened by Reformation preaching that measured every authority against Scripture. In February 1525 Upper Swabia rose, and on 7 March the Baltringen, Lake Constance and Allgäu bands, tens of thousands strong, formed a Christian Association at Memmingen.: Sommaren 1524 vägrade bönder i lantgrevskapet Stühlingen, i södra utkanten av Schwarzwald, att utföra de tjänster som deras herre krävde, och under vintern spred sig oron genom Schwarzwald och Hegau. Bakom den låg stigande avgifter, en skärpt livegenskap och herrarnas anspråk på gemensamma skogar och betesmarker, förstärkta av en reformatorisk predikan som mätte varje överhet mot Skriften. I februari 1525 reste sig Oberschwaben, och den 7 mars bildade skarorna från Baltringen, Bodensjön och Allgäu, tiotusentals man starka, en kristlig förening i Memmingen.
There they adopted the Twelve Articles, which demanded that each community choose its own pastor, that serfdom end, and that woods, water and game be free to all. Printed some 25,000 times in two months, they became the programme of the rising. The Swabian League’s army under Georg Truchsess von Waldburg routed the Leipheim band on 4 April, and on 17 April he made peace with the Lake Constance and Allgäu bands at Weingarten. The day before, the Neckar valley band had taken Weinsberg and made the Count of Helfenstein and his companions run a gauntlet of pikes to their deaths.: Där antog de de tolv artiklarna, som krävde att varje församling skulle välja sin egen präst, att livegenskapen skulle upphöra och att skog, vatten och vilt skulle vara fritt för alla. De trycktes i omkring 25 000 exemplar på två månader och blev upprorets program. Schwabiska förbundets här under Georg Truchsess von Waldburg slog Leipheimskaran på flykten den 4 april, och den 17 april slöt han fred med Bodensjö- och Allgäuskarorna i Weingarten. Dagen innan hade Neckardalens skara intagit Weinsberg och låtit greven av Helfenstein och hans följeslagare löpa gatlopp mellan pikar till döds.
