By late April the rising had spread to Franconia, Alsace and Thuringia. At Mühlhausen the radical preacher Thomas Müntzer, who had broken with Luther, called for a holy war against the godless. On 15 May the armies of Landgrave Philip of Hesse, Duke George of Saxony and Duke Henry of Brunswick-Wolfenbüttel attacked some 6,000 rebels in their wagon fort above Frankenhausen during a truce. Thousands were killed while the princes lost only a handful of men. Müntzer was captured, tortured and beheaded outside Mühlhausen on 27 May.: I slutet av april hade upproret spridit sig till Franken, Elsass och Thüringen. I Mühlhausen manade den radikale predikanten Thomas Müntzer, som hade brutit med Luther, till heligt krig mot de gudlösa. Den 15 maj anföll lantgreve Filip av Hessens, hertig Georg av Sachsens och hertig Henrik av Braunschweig-Wolfenbüttels härar omkring 6 000 rebeller i deras vagnborg ovanför Frankenhausen under ett stillestånd. Tusentals dödades medan furstarna förlorade bara en handfull man. Müntzer tillfångatogs, torterades och halshöggs utanför Mühlhausen den 27 maj.
In the south the Truchsess destroyed the Württemberg band at Böblingen on 12 May, then marched north into Franconia, where the bands had besieged the Marienberg fortress at Würzburg in vain. He beat them at Königshofen on 2 June and near Würzburg two days later. In Alsace, Duke Antoine of Lorraine massacred thousands of peasants at Saverne after they had surrendered. By midsummer only the Alpine risings were left, and victorious lords punished their subjects with executions, fines and the burning of villages.: I söder förintade truchsessen den württembergska skaran vid Böblingen den 12 maj och marscherade sedan norrut in i Franken, där skarorna förgäves hade belägrat fästningen Marienberg i Würzburg. Han besegrade dem vid Königshofen den 2 juni och nära Würzburg två dagar senare. I Elsass massakrerade hertig Anton av Lothringen tusentals bönder vid Saverne sedan de hade kapitulerat. Vid midsommar återstod bara upproren i Alperna, och de segrande herrarna straffade sina undersåtar med avrättningar, böter och nedbränning av byar.
