Most of what is known comes from the chronicle of Thietmar, bishop of Merseburg, a contemporary who was hostile to Bolesław. Dates and details are often uncertain.: Det mesta av det vi vet kommer från krönikan av Thietmar, biskop av Merseburg, en samtida som var fientligt inställd till Bolesław. Datum och detaljer är ofta osäkra.
Milsko (Milzenerland) was the land around Bautzen, later called Upper Lusatia; Lusatia proper was later Lower Lusatia.: Milsko (Milzenerland) var landet kring Bautzen, senare kallat Oberlausitz; det egentliga Lausitz blev senare Niederlausitz.
