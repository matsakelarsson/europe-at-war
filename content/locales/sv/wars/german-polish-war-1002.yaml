War broke out again in 1007. Bolesław retook Lusatia and Milsko and raided as far as the neighbourhood of Magdeburg, and German campaigns in 1010 and 1012 achieved little. At Merseburg in 1013 he did homage to Henry and kept the two lands as fiefs. But he did not help Henry in Italy as promised, and in 1015 the king, again with the Lutici, invaded once more. He got no further than Krosno on the Oder, and in the fighting Margrave Gero and some 200 knights were killed.: Kriget bröt ut igen 1007. Bolesław återtog Lausitz och Milsko och härjade ända in i trakten av Magdeburg, och de tyska fälttågen 1010 och 1012 uträttade föga. I Merseburg 1013 svor han Henrik länsed och behöll de två länderna som län. Men han hjälpte inte Henrik i Italien som han hade lovat, och 1015 föll kungen, återigen tillsammans med luticerna, in i landet ännu en gång. Han kom inte längre än till Krosno vid Oder, och i striderna dödades markgreve Gero och omkring 200 riddare.
In 1017 Henry marched to Głogów, found it too strong to besiege and turned on Niemcza instead. Its defenders held out, and with sickness in his army he withdrew through Bohemia. Peace was made at Bautzen on 30 January 1018. Bolesław kept Lusatia and Milsko, whether as imperial fiefs or outright is still debated, and married Oda, a daughter of Eckard of Meissen. That summer, with German and Hungarian help, he marched on Kiev, entered it on 14 August and restored his son-in-law Sviatopolk to its throne.: År 1017 marscherade Henrik till Głogów, fann staden för stark för att belägra och vände sig i stället mot Niemcza. Dess försvarare höll ut, och med sjukdom i hären drog han sig tillbaka genom Böhmen. Fred slöts i Bautzen den 30 januari 1018. Bolesław behöll Lausitz och Milsko, om som kejserliga län eller med full äganderätt är fortfarande omstritt, och gifte sig med Oda, en dotter till Eckard av Meissen. Samma sommar marscherade han med tysk och ungersk hjälp mot Kiev, tågade in i staden den 14 augusti och återinsatte sin svärson Svjatopolk på dess tron.
