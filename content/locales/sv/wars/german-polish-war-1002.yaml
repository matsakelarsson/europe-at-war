Henry II’s invasion stalled here on the Oder. In the fighting Margrave Gero and some 200 German knights were killed, many by Polish bowmen.: Henrik II:s invasion körde fast här vid Oder. I striderna dödades markgreve Gero och omkring 200 tyska riddare, många av polska bågskyttar.
Głogów: Głogów
Bolesław waited here with his army. Henry judged the town too strongly fortified to attack.: Bolesław väntade här med sin här. Henrik bedömde staden som alltför starkt befäst för att anfalla.
Late summer 1017: sensommaren 1017
Reinforcements twice slipped into the besieged town. Even Thietmar, no friend of the Poles, praised the defenders’ courage.: Förstärkningar lyckades två gånger ta sig in i den belägrade staden. Till och med Thietmar, ingen vän av polackerna, prisade försvararnas mod.
Agreed by Henry’s envoys and Bolesław. Thietmar called it a peace “not as it should have been, but as it could be made”.: Överenskommen av Henriks sändebud och Bolesław. Thietmar kallade den en fred ”inte som den borde ha varit, utan som den kunde slutas”.
