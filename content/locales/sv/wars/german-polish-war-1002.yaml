Henry II granted Bolesław Lusatia and Milsko as fiefs. Afterwards Bolesław was ambushed and escaped only with the help of Saxon friends.: Henrik II förlänade Bolesław Lausitz och Milsko. Efteråt överfölls Bolesław och undkom bara med hjälp av sachsiska vänner.
