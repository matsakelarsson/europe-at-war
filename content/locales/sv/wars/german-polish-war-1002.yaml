German–Polish War, 1002–1018: Tysk-polska kriget 1002–1018
A series of wars between Bolesław I the Brave of Poland and the German king Henry II over Lusatia, Meissen and Bohemia. Bolesław briefly ruled Bohemia and lost Lusatia in 1005, but held off three German invasions and kept Lusatia and Milsko under the Peace of Bautzen in 1018.: En rad krig mellan Bolesław I den tappre av Polen och den tyske kungen Henrik II om Lausitz, Meissen och Böhmen. Bolesław styrde en kort tid Böhmen och förlorade Lausitz 1005, men stod emot tre tyska invasioner och behöll Lausitz och Milsko genom freden i Bautzen 1018.
