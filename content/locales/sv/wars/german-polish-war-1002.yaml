Bolesław had been a friend and ally of Emperor Otto III, who visited him at Gniezno in 1000. When Otto died without an heir in January 1002 and Margrave Eckard of Meissen, a claimant to the throne, was murdered that April, Bolesław moved into the eastern marches. He occupied Lusatia and Milsko, the land around Bautzen, and took Meissen. At Merseburg in July the new king, Henry II, let him keep Lusatia and Milsko as fiefs but not Meissen. As Bolesław left, armed men attacked him; he blamed Henry.: Bolesław hade varit vän och bundsförvant till kejsar Otto III, som besökte honom i Gniezno år 1000. När Otto dog utan arvinge i januari 1002 och markgreve Eckard av Meissen, en tronpretendent, mördades i april samma år ryckte Bolesław in i de östra markerna. Han ockuperade Lausitz och Milsko, landet kring Bautzen, och intog Meissen. I Merseburg i juli lät den nye kungen, Henrik II, honom behålla Lausitz och Milsko som län, men inte Meissen. När Bolesław lämnade platsen angreps han av beväpnade män; han gav Henrik skulden.
Early in 1003 Bolesław intervened in Bohemia, had its duke, Boleslaus III, blinded and ruled the country himself, refusing to do homage to Henry for it. Henry made an alliance with the pagan Lutici, which shocked many Saxon churchmen, and in 1004 drove the Poles out of Bohemia, installed Duke Jaromír and took Bautzen. In 1005 he crossed the Oder and marched to Poznań. Bolesław avoided battle and harried the invaders, but in the peace that followed he gave up Lusatia and Milsko, though he kept Moravia.: I början av 1003 ingrep Bolesław i Böhmen, lät blinda dess hertig Boleslav III och styrde landet själv, utan att vilja svära Henrik länsed för det. Henrik slöt en allians med de hedniska luticerna, vilket chockerade många sachsiska kyrkomän, och drev 1004 ut polackerna ur Böhmen, insatte hertig Jaromír och intog Bautzen. År 1005 gick han över Oder och marscherade till Poznań. Bolesław undvek strid och ansatte inkräktarna, men i den fred som följde gav han upp Lausitz och Milsko, även om han behöll Mähren.
