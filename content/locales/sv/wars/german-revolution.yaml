The sides changed as the revolution went on. The Social Democrats who led the new government in November 1918 came to power on the back of the revolution, but from December they relied on the old army and on Freikorps volunteers against the radical left.: Sidorna förändrades under revolutionens gång. Socialdemokraterna som ledde den nya regeringen i november 1918 kom till makten på revolutionens våg, men från december förlitade de sig på den gamla armén och på frivilliga i Freikorps mot den radikala vänstern.
The First World War, which ended with the armistice of 11 November 1918, is told separately.: Första världskriget, som avslutades med vapenstilleståndet den 11 november 1918, berättas separat.
