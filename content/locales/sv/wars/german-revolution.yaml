German Revolution of 1918–1919: Tyska revolutionen 1918–1919
The revolution that ended the German Empire in the last days of the First World War. A naval mutiny at Kiel spread across Germany, the Kaiser and the other German princes abdicated, and a Social Democrat-led government took power; it then used the army and Freikorps volunteers to crush the radical left in Berlin and the Bavarian Soviet Republic, and the Weimar Constitution of August 1919 founded a parliamentary republic.: Revolutionen som gjorde slut på det tyska kejsarriket under första världskrigets sista dagar. Ett flottmyteri i Kiel spred sig över Tyskland, kejsaren och de andra tyska furstarna abdikerade, och en socialdemokratiskt ledd regering tog makten; den använde sedan armén och frivilliga i Freikorps för att krossa den radikala vänstern i Berlin och Bayerska rådsrepubliken, och Weimarförfattningen i augusti 1919 grundade en parlamentarisk republik.
