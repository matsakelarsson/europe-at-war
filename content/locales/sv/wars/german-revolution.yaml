By October 1918 Germany’s generals knew the war was lost, and Prince Max of Baden’s new government had asked President Wilson for an armistice. The naval command nonetheless planned a last sortie against the British fleet. In the Schillig Roads off Wilhelmshaven crews on several battleships refused orders, and the operation was called off. One squadron was sent back to Kiel, where sailors demanded the release of comrades arrested for the mutiny. On 3 November a patrol fired on their demonstration, killing seven men. The next day sailors and workers took control of the port and elected councils.: I oktober 1918 visste Tysklands generaler att kriget var förlorat, och prins Max av Badens nya regering hade bett president Wilson om vapenstillestånd. Marinledningen planerade ändå ett sista utfall mot den brittiska flottan. På Schillig-redden utanför Wilhelmshaven vägrade besättningarna på flera slagskepp att lyda order, och operationen avblåstes. En eskader skickades tillbaka till Kiel, där sjömännen krävde att kamrater som arresterats för myteriet skulle friges. Den 3 november sköt en patrull mot deras demonstration och dödade sju män. Dagen därpå tog sjömän och arbetare kontroll över hamnen och valde råd.
Sailors spread the revolt by rail, and by 7 November workers’ and soldiers’ councils held Hamburg, Bremen, Lübeck, Cologne and many other cities. In Munich, on the night of 7–8 November, the Independent Socialist Kurt Eisner proclaimed a Bavarian republic, and the king fled. On 9 November, with Berlin on general strike, Prince Max announced the Kaiser’s abdication on his own authority and handed over to the Social Democrat Friedrich Ebert. Philipp Scheidemann proclaimed a republic from the Reichstag, and Karl Liebknecht a socialist republic at the palace. William II left for the Netherlands the next day; the armistice followed on 11 November.: Sjömän spred revolten med järnväg, och den 7 november höll arbetar- och soldatråd Hamburg, Bremen, Lübeck, Köln och många andra städer. I München utropade den oavhängige socialisten Kurt Eisner natten mellan den 7 och 8 november en bayersk republik, och kungen flydde. Den 9 november, medan Berlin var i generalstrejk, tillkännagav prins Max på eget bevåg kejsarens abdikation och lämnade över makten till socialdemokraten Friedrich Ebert. Philipp Scheidemann utropade republiken från riksdagshuset, och Karl Liebknecht en socialistisk republik vid slottet. Vilhelm II reste till Nederländerna dagen därpå; vapenstilleståndet följde den 11 november.
