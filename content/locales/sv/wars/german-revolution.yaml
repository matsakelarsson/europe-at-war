Ebert’s Council of People’s Deputies, formed with the Independent Socialists (USPD) on 10 November, wanted elections to a National Assembly, and Ebert secretly agreed with General Wilhelm Groener that the army would back the government. After troops attacked revolutionary sailors in Berlin at Christmas, the USPD left the government and the Spartacists founded the Communist Party. On 5 January 1919, after Berlin’s left-wing police chief was dismissed, armed workers occupied newspaper offices, among them the SPD’s Vorwärts. Gustav Noske, the minister responsible for the army, sent in troops and Freikorps volunteers, who crushed this “Spartacist uprising” by 12 January; some 150–200 people were killed.: Folkombudsrådet under Ebert (Rat der Volksbeauftragten), bildat tillsammans med de oavhängiga socialisterna (USPD) den 10 november, ville ha val till en nationalförsamling, och Ebert kom i hemlighet överens med general Wilhelm Groener om att armén skulle stödja regeringen. Sedan trupper anfallit revolutionära sjömän i Berlin vid jul lämnade USPD regeringen, och spartakisterna grundade kommunistpartiet. Den 5 januari 1919, efter att Berlins vänsterinriktade polischef avsatts, ockuperade beväpnade arbetare tidningsredaktioner, bland dem SPD:s Vorwärts. Gustav Noske, den minister som ansvarade för armén, satte in trupper och frivilliga ur Freikorps, som krossade detta ”spartakistuppror” senast den 12 januari; omkring 150–200 människor dödades.
On 15 January Freikorps officers murdered Rosa Luxemburg and Karl Liebknecht. Elections on 19 January, the first in which German women voted, gave the SPD and its Catholic and liberal allies a large majority, and the National Assembly met at Weimar. In Munich Eisner was shot dead by a nationalist on 21 February. On 6–7 April anarchists and Independent Socialists proclaimed a Bavarian Soviet Republic, which the communists took over a week later. Army and Freikorps troops took Munich on 1–3 May, after its Red Guards had shot ten hostages; at least 606 people were killed, 335 of them civilians. The Weimar Constitution was signed on 11 August 1919.: Den 15 januari mördade officerare ur Freikorps Rosa Luxemburg och Karl Liebknecht. Valet den 19 januari, det första där tyska kvinnor röstade, gav SPD och dess katolska och liberala bundsförvanter en stor majoritet, och nationalförsamlingen sammanträdde i Weimar. I München sköts Eisner ihjäl av en nationalist den 21 februari. Den 6–7 april utropade anarkister och oavhängiga socialister en bayersk rådsrepublik, som kommunisterna tog över en vecka senare. Arméförband och Freikorps intog München den 1–3 maj, sedan stadens röda garde hade skjutit tio gisslan; minst 606 människor dödades, 335 av dem civila. Weimarförfattningen undertecknades den 11 augusti 1919.
