The old powers recovered first in the Austrian Empire. In June an uprising in Prague was crushed by Prince Alfred Windischgrätz, who bombarded the city. On 6 October, as troops were leaving Vienna to fight the revolution in Hungary, workers, students and mutinous soldiers tried to stop them. The war minister, Count Latour, was lynched, and the emperor fled to Olmütz. Windischgrätz and Josip Jelačić, the Ban of Croatia, surrounded Vienna with more than 70,000 troops, beat a Hungarian relief army at Schwechat on 30 October and stormed the city the next day. About 2,000 people were killed in the fighting.: De gamla makterna återtog kontrollen först i Kejsardömet Österrike. I juni slogs ett uppror i Prag ned av furst Alfred Windischgrätz, som bombarderade staden. Den 6 oktober, när trupper skulle lämna Wien för att bekämpa revolutionen i Ungern, försökte arbetare, studenter och myterister hindra dem. Krigsministern greve Latour lynchades, och kejsaren flydde till Olmütz. Windischgrätz och Josip Jelačić, ban av Kroatien, omringade Wien med mer än 70 000 man, besegrade en ungersk undsättningsarmé vid Schwechat den 30 oktober och stormade staden dagen därpå. Omkring 2 000 människor dödades i striderna.
Robert Blum, a left-wing deputy who had come from Frankfurt to join the defence, was shot on 9 November despite his parliamentary immunity, and other leaders of the defence were executed. On 2 December the Emperor Ferdinand abdicated in favour of his 18-year-old nephew, Francis Joseph. In Prussia Frederick William IV moved the Prussian National Assembly out of Berlin to Brandenburg an der Havel, and on 10 November General Friedrich von Wrangel’s troops marched back into the capital unopposed. On 5 December the king dissolved the assembly and issued a constitution of his own.: Robert Blum, en vänsterledamot som hade kommit från Frankfurt för att delta i försvaret, arkebuserades den 9 november trots sin parlamentariska immunitet, och andra ledare för försvaret avrättades. Den 2 december abdikerade kejsar Ferdinand till förmån för sin 18-årige brorson Frans Josef. I Preussen flyttade Fredrik Vilhelm IV den preussiska nationalförsamlingen från Berlin till Brandenburg an der Havel, och den 10 november marscherade general Friedrich von Wrangels trupper tillbaka in i huvudstaden utan motstånd. Den 5 december upplöste kungen församlingen och utfärdade en egen författning.
