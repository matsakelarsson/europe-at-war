News of the February revolution in Paris set off meetings and petitions across the German states. A meeting at Mannheim on 27 February demanded a free press, trial by jury, a citizens’ militia and an all-German parliament, and these “March demands” spread from state to state. Most princes gave way and appointed liberal ministers. In Vienna students and workers rose on 13 March, and Metternich, the symbol of the old order, resigned and fled. In Berlin troops fought townspeople at the barricades on 18 March, and more than 250 people, most of them civilians, were killed before Frederick William IV withdrew the army from the city.: Nyheten om februarirevolutionen i Paris utlöste möten och petitioner i hela de tyska staterna. Ett möte i Mannheim den 27 februari krävde tryckfrihet, juryrättegångar, ett medborgargarde och ett allmäntyskt parlament, och dessa ”marskrav” spred sig från stat till stat. De flesta furstar gav efter och utnämnde liberala ministrar. I Wien reste sig studenter och arbetare den 13 mars, och Metternich, den gamla ordningens symbol, avgick och flydde. I Berlin stred trupper mot stadsbor vid barrikaderna den 18 mars, och mer än 250 människor, de flesta civila, dödades innan Fredrik Vilhelm IV drog tillbaka armén från staden.
A pre-parliament met in Frankfurt at the end of March and called elections across the German Confederation, including the Austrian lands, on a broad male franchise. On 18 May the National Assembly opened in St Paul’s Church, its benches filled with lawyers, professors and officials. In Baden the radical Friedrich Hecker, impatient for a republic, led an armed column that was routed at Kandern on 20 April. When the Assembly accepted the armistice Prussia had made with Denmark at Malmö, riots broke out in Frankfurt on 18 September; two conservative deputies were murdered, and Prussian and Austrian troops restored order.: Ett förparlament sammanträdde i Frankfurt i slutet av mars och utlyste val i hela Tyska förbundet, inklusive de österrikiska länderna, med bred rösträtt för män. Den 18 maj öppnades nationalförsamlingen i Paulskyrkan, med bänkarna fyllda av jurister, professorer och ämbetsmän. I Baden ledde radikalen Friedrich Hecker, otålig att få en republik, en väpnad kolonn som slogs på flykten vid Kandern den 20 april. När församlingen godtog det vapenstillestånd som Preussen hade slutit med Danmark i Malmö bröt upplopp ut i Frankfurt den 18 september; två konservativa ledamöter mördades, och preussiska och österrikiska trupper återställde ordningen.
