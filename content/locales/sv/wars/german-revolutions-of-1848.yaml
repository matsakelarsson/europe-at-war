The revolutions were many separate risings, and this story follows only the main ones. The Hungarian Revolution of 1848–1849, the war in northern Italy of 1848–1849 and the First Schleswig War are told as separate wars.: Revolutionerna bestod av många separata uppror, och denna berättelse följer bara de viktigaste. Ungerska revolutionen 1848–1849, kriget i norra Italien 1848–1849 och första slesvigska kriget berättas som separata krig.
The Frankfurt National Assembly stood between the two sides. It sought a constitutional German state by agreement with the princes, had no army of its own, and relied on Prussian and Austrian troops when it was threatened from the left.: Nationalförsamlingen i Frankfurt stod mellan de två sidorna. Den sökte en konstitutionell tysk stat i samförstånd med furstarna, hade ingen egen armé och förlitade sig på preussiska och österrikiska trupper när den hotades från vänster.
