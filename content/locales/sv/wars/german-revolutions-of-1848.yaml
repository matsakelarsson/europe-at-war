On 28 March 1849 the National Assembly passed a constitution for a German empire without Austria and elected Frederick William IV of Prussia emperor. He refused a crown offered by a parliament, and Austria and Prussia recalled their deputies. Twenty-eight smaller governments had accepted the constitution, and in May risings to enforce it broke out in Saxony, the Prussian Rhineland and Westphalia, the Bavarian Palatinate and Baden. In Dresden, barricade fighting from 3 to 9 May, in which Richard Wagner and Mikhail Bakunin took part, was crushed by Saxon and Prussian troops; about 200 insurgents were killed.: Den 28 mars 1849 antog nationalförsamlingen en författning för ett tyskt kejsarrike utan Österrike och valde Fredrik Vilhelm IV av Preussen till kejsare. Han avböjde en krona som erbjöds av ett parlament, och Österrike och Preussen kallade hem sina ledamöter. Tjugoåtta mindre regeringar hade godtagit författningen, och i maj bröt uppror för att genomdriva den ut i Sachsen, preussiska Rhenlandet och Westfalen, Bayerska Pfalz och Baden. I Dresden slogs barrikadstriderna den 3–9 maj, i vilka Richard Wagner och Michail Bakunin deltog, ned av sachsiska och preussiska trupper; omkring 200 upprorsmän dödades.
In Baden the army itself went over to the revolution. The garrison of the federal fortress of Rastatt mutinied, Grand Duke Leopold fled, and a provisional government under Lorenz Brentano took power, allied with the insurgents in the Palatinate. Prussian and other federal troops under Prince William of Prussia, the future emperor, beat the revolutionary army under the Polish general Ludwik Mierosławski at Waghäusel on 21 June. Württemberg troops dispersed the last of the National Assembly, which had moved to Stuttgart, on 18 June. Rastatt surrendered on 23 July; courts martial sentenced 27 men to death, and thousands of Badeners emigrated.: I Baden gick armén själv över till revolutionen. Garnisonen i förbundsfästningen Rastatt gjorde myteri, storhertig Leopold flydde, och en provisorisk regering under Lorenz Brentano tog makten, allierad med upprorsmännen i Pfalz. Preussiska och andra förbundstrupper under prins Vilhelm av Preussen, den blivande kejsaren, besegrade den revolutionära armén under den polske generalen Ludwik Mierosławski vid Waghäusel den 21 juni. Württembergska trupper skingrade den sista resten av nationalförsamlingen, som hade flyttat till Stuttgart, den 18 juni. Rastatt kapitulerade den 23 juli; krigsrätter dömde 27 män till döden, och tusentals badensare emigrerade.
