German revolutions of 1848–1849: Tyska revolutionerna 1848–1849
A wave of risings across the German Confederation and the Austrian Empire, set off by the February Revolution in Paris, which forced the princes to grant liberal governments and brought about an elected National Assembly in Frankfurt. The old powers recovered in Vienna and Berlin in late 1848; when the King of Prussia refused the crown offered by the Assembly, the risings of May 1849 to enforce its constitution were crushed by Prussian and other troops, ending with the fall of Rastatt in July 1849.: En våg av uppror i hela Tyska förbundet och Kejsardömet Österrike, utlöst av februarirevolutionen i Paris, som tvingade furstarna att tillsätta liberala regeringar och ledde till en vald nationalförsamling i Frankfurt. De gamla makterna återtog kontrollen i Wien och Berlin i slutet av 1848; när kungen av Preussen avböjde den krona som församlingen erbjöd honom slogs upproren i maj 1849 för att genomdriva dess författning ned av preussiska och andra trupper, vilket slutade med Rastatts fall i juli 1849.
