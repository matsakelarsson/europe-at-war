Ghaznavid campaigns in India: Ghaznavidernas fälttåg i Indien
The raids and conquests of Mahmud of Ghazni in north-western and northern India. Between 1000 and 1027 the Ghaznavid sultan led some seventeen expeditions across the Indus. He broke the Hindu Shahi kingdom in battles from Peshawar (1001) to Nandana (1014), took Multan from its Ismaili rulers, plundered the temple towns of Nagarkot, Thanesar and Mathura, received the submission of the Pratihara king of Kannauj in 1018 and of the kings of Gwalior and Kalinjar in 1022–1023, and in January 1026 sacked the temple of Somnath on the coast of Gujarat. The treasure and captives paid for his wars in Central Asia and his buildings in Ghazni. The lasting conquest was the Punjab, which his successors ruled from Lahore until the Ghurids took it in 1186.: Mahmud av Ghaznis plundringståg och erövringar i nordvästra och norra Indien. Mellan 1000 och 1027 ledde den ghaznavidiske sultanen ett sjuttontal expeditioner över Indus. Han krossade hindushahiriket i slag från Peshawar (1001) till Nandana (1014), tog Multan från dess ismailitiska härskare, plundrade tempelstäderna Nagarkot, Thanesar och Mathura, fick pratiharakungen av Kannauj att underkasta sig 1018 och kungarna av Gwalior och Kalinjar att göra detsamma 1022–1023, och i januari 1026 plundrade han templet i Somnath vid Gujarats kust. Skatterna och fångarna bekostade hans krig i Centralasien och hans byggnader i Ghazni. Den bestående erövringen var Punjab, som hans efterträdare styrde från Lahore tills ghuriderna tog det 1186.
