# Svenska översättningar av katalogtexten (våg 7); stegtexterna kommer senare.
Ghaznavid–Karakhanid war: Ghaznavidisk-karakhanidiska kriget
The war over Khorasan between Mahmud of Ghazni and the Kara-Khanid ruler Nasr, the Ilig Khan, who had divided the lands of the Samanids between them along the Oxus in 999. In 1006, while Mahmud was campaigning at Multan in India, the Ilig Khan sent two armies across the river; Chaghartigin took Balkh and Subashitigin took Herat. Mahmud hurried back and drove them out within months. In 1008 the Ilig Khan returned with his kinsman Yusuf Qadir Khan and a large army, but on 5 January 1008, on the plain of Katar about 20 km from Balkh, Mahmud’s army and its war elephants routed them, and many Kara-Khanid soldiers drowned in the Oxus as they fled. The frontier stayed on the Oxus, and relations improved under the Ilig Khan’s successors.: Kriget om Khorasan mellan Mahmud av Ghazni och den karakhanidiske härskaren Nasr, Ilig khan, som 999 hade delat samanidernas länder mellan sig längs Oxus. År 1006, medan Mahmud förde krig vid Multan i Indien, sände Ilig khan två arméer över floden; Chaghartigin intog Balkh och Subashitigin Herat. Mahmud skyndade tillbaka och drev ut dem inom några månader. År 1008 kom Ilig khan tillbaka med sin frände Yusuf Qadir Khan och en stor armé, men den 5 januari 1008, på slätten vid Katar omkring 20 km från Balkh, slog Mahmuds armé och dess krigselefanter dem på flykten, och många karakhanidiska soldater drunknade i Oxus när de flydde. Gränsen låg kvar vid Oxus, och förbindelserna förbättrades under Ilig khans efterträdare.
