# Svenska översättningar av katalogtexten (våg 7); stegtexterna kommer senare.
Ghaznavid–Seljuk war: Ghaznavidisk-seldjukiska kriget
The war in which the Seljuk Turkmen, led by the brothers Tughril and Chaghri, took Khorasan from the Ghaznavid sultan Mas’ud I. After crossing the Oxus in 1035 they beat a Ghaznavid army at Nasa and were granted grazing lands on the edge of the Karakum desert. They then took Merv and, in 1038, Nishapur, where Tughril was proclaimed sultan. Mas’ud’s great campaign of 1039–1040 ended in his defeat at Dandanaqan, between Sarakhs and Merv, on 23 May 1040, which gave the Seljuks Khorasan and opened the way to their conquest of Iran.: Kriget där seldjukturkmenerna, ledda av bröderna Tughril och Chaghri, tog Khorasan från den ghaznavidiske sultanen Mas’ud I. Sedan de gått över Oxus 1035 slog de en ghaznavidisk armé vid Nasa och fick betesmarker i utkanten av Karakumöknen. Därefter intog de Merv och 1038 Nishapur, där Tughril utropades till sultan. Mas’uds stora fälttåg 1039–1040 slutade med hans nederlag vid Dandanaqan, mellan Sarakhs och Merv, den 23 maj 1040, vilket gav seldjukerna Khorasan och öppnade vägen för deras erövring av Iran.
