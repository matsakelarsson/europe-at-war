# Svenska översättningar av katalogtexten (våg 8); stegtexterna kommer senare.
Ghurid campaigns in India: Ghuridernas fälttåg i Indien
The conquest of northern India by Mu’izz al-Din Muhammad of Ghor, known as Muhammad Ghori, and his commanders. From Ghazni he took Multan and Uch in 1175, was defeated by the Chaulukyas of Gujarat at Kasahrada in 1178 and took the last Ghaznavid lands in the Punjab by 1186. Beaten by the Chahamana king Prithviraj III at the first battle of Tarain in 1191, he returned the next year and destroyed Prithviraj’s army on the same field. His slave commander Qutb al-Din Aibak then took Delhi, the Gahadavala king Jayachandra was killed at Chandawar in 1194, and Gwalior, Anhilwara, Kalinjar and, under Bakhtiyar Khalji, Bihar and Bengal followed. When Mu’izz al-Din was killed in 1206, his Indian conquests passed to Aibak and the other commanders, and the Delhi Sultanate grew out of them.: Erövringen av norra Indien genom Mu’izz al-Din Muhammad av Ghor, känd som Muhammad Ghori, och hans befälhavare. Från Ghazni intog han Multan och Uch 1175, besegrades av chaulukyadynastin i Gujarat vid Kasahrada 1178 och tog de sista ghaznavidiska länderna i Punjab senast 1186. Sedan han slagits av chahamanakungen Prithviraj III i det första slaget vid Tarain 1191 återvände han året därpå och förintade Prithvirajs armé på samma slagfält. Hans slavbefälhavare Qutb al-Din Aibak intog därefter Delhi, gahadavalakungen Jayachandra stupade vid Chandawar 1194, och Gwalior, Anhilwara, Kalinjar och, under Bakhtiyar Khalji, Bihar och Bengalen följde. När Mu’izz al-Din dödades 1206 övergick hans indiska erövringar till Aibak och de andra befälhavarna, och ur dem växte Delhisultanatet fram.
