Ghurid–Ghaznavid wars: Ghuridisk-ghaznavidiska krigen
The wars in which the Ghurids, chiefs of the mountain land of Ghor in central Afghanistan, overthrew the Ghaznavid dynasty they had once served. In revenge for the killing of two of his brothers by the Ghaznavid sultan Bahram Shah, Ala al-Din Husayn took Ghazni in 1150 and burned it, earning the name Jahansuz, “world-burner”. After an interval in which Oghuz Turkmen held Ghazni, his nephews Ghiyath al-Din and Mu’izz al-Din took the city in 1173, and from there Mu’izz al-Din conquered the last Ghaznavid lands in the Punjab, taking Lahore and the last sultan, Khusrau Malik, in 1186.: De krig under vilka ghuriderna, hövdingar i bergslandet Ghor i centrala Afghanistan, störtade den ghaznavidiska dynasti som de en gång hade tjänat. Som hämnd för att den ghaznavidiske sultanen Bahram Shah hade dödat två av hans bröder intog Ala al-Din Husayn Ghazni 1150 och brände staden, vilket gav honom namnet Jahansuz, ”världsbrännaren”. Efter ett mellanspel då oguzturkmener höll Ghazni intog hans brorsöner Ghiyath al-Din och Mu’izz al-Din staden 1173, och därifrån erövrade Mu’izz al-Din de sista ghaznavidiska länderna i Punjab och tog 1186 Lahore och den siste sultanen, Khusrau Malik.
