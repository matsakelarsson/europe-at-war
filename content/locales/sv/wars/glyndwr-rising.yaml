Glyndŵr Rising: Glyndŵrupproret
The last great Welsh revolt against English rule, led by Owain Glyndŵr, who was proclaimed Prince of Wales in 1400. At its height in 1404–1405 he controlled most of Wales, held a parliament at Machynlleth and allied with France, but English armies and an economic blockade wore the rising down. After Harlech fell in 1409 Glyndŵr became a fugitive, and he disappeared around 1415.: Det sista stora walesiska upproret mot engelskt styre, lett av Owain Glyndŵr, som utropades till furste av Wales år 1400. På sin höjdpunkt 1404–1405 kontrollerade han större delen av Wales, höll ett parlament i Machynlleth och allierade sig med Frankrike, men engelska härar och en ekonomisk blockad nötte ned upproret. Sedan Harlech fallit 1409 blev Glyndŵr flykting, och han försvann omkring 1415.
