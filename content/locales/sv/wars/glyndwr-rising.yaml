In 1404 Owain took the great castles of Harlech and Aberystwyth, held a parliament of all Wales at Machynlleth and made a treaty with Charles VI of France. In February 1405, in the Tripartite Indenture, he, Mortimer and the Earl of Northumberland agreed to divide England and Wales between them, with Wales stretching to the Severn and the Mersey. That August a French army of some 2,500 men landed at Milford Haven, took Carmarthen with the Welsh and marched into England as far as Woodbury Hill near Worcester, where it faced the king’s army for several days before turning back.: År 1404 intog Owain de stora borgarna Harlech och Aberystwyth, höll ett parlament för hela Wales i Machynlleth och slöt ett fördrag med Karl VI av Frankrike. I februari 1405 kom han, Mortimer och earlen av Northumberland i trepartsavtalet överens om att dela England och Wales mellan sig, med ett Wales som skulle sträcka sig till Severn och Mersey. I augusti samma år landsteg en fransk här på omkring 2 500 man vid Milford Haven, intog Carmarthen tillsammans med walesarna och tågade in i England ända till Woodbury Hill nära Worcester, där den under flera dagar stod mot kungens här innan den vände tillbaka.
But the tide was turning. Owain’s forces were beaten at Grosmont in March 1405 and at Pwll Melyn near Usk in May, where his brother Tudur was killed and his son Gruffudd captured; Adam of Usk says 300 prisoners were beheaded. In 1406 Owain’s letter from Pennal offered to bring the Welsh church under the pope at Avignon and set out plans for two Welsh universities, but French help was drying up. Prince Henry, the future Henry V, used the castles still in English hands to blockade the country, and one district after another submitted and paid fines.: Men vinden höll på att vända. Owains styrkor slogs vid Grosmont i mars 1405 och vid Pwll Melyn nära Usk i maj, där hans bror Tudur stupade och hans son Gruffudd tillfångatogs; enligt Adam av Usk halshöggs 300 fångar. I sitt brev från Pennal 1406 erbjöd sig Owain att ställa den walesiska kyrkan under påven i Avignon och lade fram planer på två walesiska universitet, men det franska stödet höll på att sina. Prins Henrik, den blivande Henrik V, använde de borgar som fortfarande var i engelska händer för att blockera landet, och det ena distriktet efter det andra underkastade sig och betalade böter.
Anglesey was lost in 1406, Aberystwyth fell in 1408 and Harlech in February 1409, where Mortimer died and Owain’s wife and daughters were captured; Catrin and her children died in captivity in London. After a failed raid into Shropshire in 1410 Owain went into hiding. He never accepted Henry V’s offers of pardon and probably died around 1415; his son Maredudd accepted a pardon in 1421.: Anglesey gick förlorat 1406, Aberystwyth föll 1408 och Harlech i februari 1409, då Mortimer dog och Owains hustru och döttrar tillfångatogs; Catrin och hennes barn dog i fångenskap i London. Efter ett misslyckat plundringståg in i Shropshire 1410 gick Owain under jorden. Han godtog aldrig Henrik V:s erbjudanden om nåd och dog troligen omkring 1415; hans son Maredudd tog emot nåd 1421.
