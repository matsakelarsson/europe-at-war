Owain Glyndŵr, lord of Glyndyfrdwy and Cynllaith and a descendant of the princes of Powys and Deheubarth, had served English kings in war. A land dispute with his neighbour Reginald Grey, Lord of Ruthin, came to a head after Henry IV deposed Richard II, who had been well liked in Wales. On 16 September 1400 a small band of followers proclaimed Owain Prince of Wales at Glyndyfrdwy. Two days later they sacked Ruthin, and within a week they had burned the English towns of north-east Wales from Denbigh and Flint to Oswestry and Welshpool. Henry IV marched round north Wales but found no one to fight.: Owain Glyndŵr, herre till Glyndyfrdwy och Cynllaith och ättling till furstarna av Powys och Deheubarth, hade tjänat engelska kungar i krig. En jordtvist med grannen Reginald Grey, herre till Ruthin, ställdes på sin spets sedan Henrik IV avsatt Rikard II, som varit omtyckt i Wales. Den 16 september 1400 utropade en liten skara anhängare Owain till furste av Wales i Glyndyfrdwy. Två dagar senare plundrade de Ruthin, och inom en vecka hade de bränt de engelska städerna i nordöstra Wales från Denbigh och Flint till Oswestry och Welshpool. Henrik IV tågade runt norra Wales men fann ingen att strida mot.
The revolt spread in 1401. Owain’s cousins Rhys and Gwilym ap Tudur seized Conwy Castle on Good Friday while most of its garrison was at church, and Owain beat a much larger force from Pembrokeshire at Mynydd Hyddgen. Parliament answered with harsh laws barring Welshmen from office, from bearing arms and from buying land in England. In 1402 Owain captured Grey and held him for ransom, and on 22 June at Bryn Glas, near Pilleth, he routed the levies of Herefordshire and took Sir Edmund Mortimer prisoner. Mortimer married Owain’s daughter Catrin and joined him.: Upproret spred sig 1401. Owains kusiner Rhys och Gwilym ap Tudur intog Conwy Castle på långfredagen medan större delen av garnisonen var i kyrkan, och Owain slog en mycket större styrka från Pembrokeshire vid Mynydd Hyddgen. Parlamentet svarade med hårda lagar som förbjöd walesare att inneha ämbeten, bära vapen och köpa jord i England. År 1402 tillfångatog Owain Grey och höll honom mot lösen, och den 22 juni vid Bryn Glas, nära Pilleth, krossade han uppbådet från Herefordshire och tog Sir Edmund Mortimer till fånga. Mortimer gifte sig med Owains dotter Catrin och gick över till honom.
In July 1403 Owain swept down the Tywi valley, where castles and towns fell or surrendered, and took Carmarthen. That month Henry “Hotspur” Percy, who had fought the Welsh for the king, rebelled in Cheshire with Welsh support, but he was killed fighting Henry IV and his son Prince Henry at Shrewsbury on 21 July. Owain, far away in the south, took no part in the battle.: I juli 1403 drog Owain ned genom Tywidalen, där borgar och städer föll eller kapitulerade, och intog Carmarthen. Samma månad gjorde Henry ”Hotspur” Percy, som hade bekämpat walesarna för kungens räkning, uppror i Cheshire med walesiskt stöd, men han stupade i striden mot Henrik IV och dennes son prins Henrik vid Shrewsbury den 21 juli. Owain, som befann sig långt borta i söder, deltog inte i slaget.
