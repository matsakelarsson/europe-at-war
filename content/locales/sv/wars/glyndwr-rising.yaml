Dates are Julian. Many events of the rising are known only from a few chronicles, above all that of Adam of Usk, and several dates are uncertain, among them those of the battles of Grosmont and Pwll Melyn, usually put in March and May 1405.: Datumen följer den julianska kalendern. Många händelser under upproret är kända bara från ett fåtal krönikor, framför allt Adam av Usks, och flera datum är osäkra, bland dem för slagen vid Grosmont och Pwll Melyn, som vanligen förläggs till mars och maj 1405.
Owain’s name is also written Owen Glendower in older English. The date and place of his death are unknown; a Welsh annal records it under 1415.: Owains namn skrivs i äldre engelska även Owen Glendower. Datum och plats för hans död är okända; en walesisk annal för den under år 1415.
