# Svenska översättningar av katalogtexten (våg 8); stegtexterna kommer senare.
Gorkha conquest of the Kathmandu Valley: Gorkhas erövring av Katmandudalen
The wars in which Prithvi Narayan Shah, king of the small hill state of Gorkha, conquered the rich Newar kingdoms of the Kathmandu Valley and founded the Kingdom of Nepal. Starting in 1743, he took the fort of Nuwakot above the valley in 1744 and then, over two decades, cut the valley off from its trade routes to Tibet and India. He took Makwanpur in 1762, beat off an army sent by the Nawab of Bengal, Mir Qasim, in 1763, and finally took Kirtipur after two failed assaults. In 1767 the British East India Company sent a small expedition under Captain George Kinloch to help Jaya Prakash Malla, king of Kathmandu, but it was driven back from the hills. Prithvi Narayan took Kathmandu in September 1768, Lalitpur soon after and Bhaktapur in 1769, and made Kathmandu his capital. The conquests of his successors in the east and west are not part of this story.: Krigen där Prithvi Narayan Shah, kung av den lilla bergsstaten Gorkha, erövrade Katmandudalens rika newarkungadömen och grundade kungariket Nepal. Han inledde sina fälttåg 1743, intog fästningen Nuwakot ovanför dalen 1744 och skar sedan under två årtionden av dalens handelsvägar till Tibet och Indien. Han intog Makwanpur 1762, slog 1763 tillbaka en armé som nawaben av Bengalen, Mir Qasim, hade sänt och intog till slut Kirtipur efter två misslyckade stormningar. År 1767 sände Brittiska ostindiska kompaniet en liten expedition under kapten George Kinloch till undsättning för Jaya Prakash Malla, kung av Katmandu, men den drevs tillbaka från bergen. Prithvi Narayan intog Katmandu i september 1768, Lalitpur kort därefter och Bhaktapur 1769, och gjorde Katmandu till sin huvudstad. Hans efterträdares erövringar i öster och väster ingår inte i denna berättelse.
