# Svenska översättningar av katalogtexten (våg 10); stegtexterna kommer senare.
Goryeo–Jurchen war: Kriget mellan Goryeo och jurchenerna
Goryeo’s war with the Jurchens of the north-east, then being united by the Wanyan clan. In 1104 Wanyan forces under Wuyashu reached Goryeo’s border near Jeongju, the eastern end of the Thousand-li Wall, and defeated two Goryeo armies. The general Yun Gwan then built up a new force, the Byeolmuban, with cavalry, infantry and a corps of monks, and at the end of 1107 he and O Yeon-chong crossed the wall with an army of 170,000. They overran the Jurchen villages of the north-eastern coastal plain and built nine fortresses, from Hamju (Hamhung) northwards. The Jurchens counterattacked again and again, the forts proved hard to hold and supply, and in 1109 the Goryeo court gave them back in return for promises of peace and tribute. Six years later Wuyashu’s brother Aguda founded the Jin empire, which destroyed Liao and in 1126 made Goryeo accept it as overlord.: Goryeos krig mot jurchenerna i nordost, som då höll på att enas under Wanyanklanen. År 1104 nådde Wanyanstyrkor under Wuyashu Goryeos gräns nära Jeongju, den östra änden av Tusen li-muren, och besegrade två av Goryeos arméer. Generalen Yun Gwan byggde då upp en ny styrka, Byeolmuban, med kavalleri, infanteri och en kår av munkar, och i slutet av 1107 gick han och O Yeon-chong över muren med en armé på 170 000 man. De överskred jurchenernas byar på den nordöstra kustslätten och byggde nio fästningar, från Hamju (Hamhung) och norrut. Jurchenerna gick gång på gång till motanfall, fästningarna visade sig svåra att hålla och försörja, och 1109 lämnade Goryeos hov tillbaka dem mot löften om fred och tribut. Sex år senare grundade Wuyashus bror Aguda Jinriket, som krossade Liao och 1126 tvingade Goryeo att erkänna det som överherre.
