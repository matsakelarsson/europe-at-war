# Svenska översättningar av katalogtexten (våg 10); stegtexterna kommer senare.
Goryeo–Khitan War: Kriget mellan Goryeo och khitanerna
? Three invasions of Goryeo by the Khitan Liao empire, which ended with a Goryeo victory at Gwiju and a lasting peace. Goryeo had been hostile to the Khitans since they destroyed Balhae in 926, and it traded and exchanged envoys with Song China, Liao’s rival. In 993 a Liao army under Xiao Sunning crossed the Yalu; the Goryeo envoy Seo Hui negotiated a settlement in which Goryeo became a Liao tributary but gained the land up to the Yalu, where it built six fortified garrisons. In 1010 Emperor Shengzong invaded in person, using a palace coup in Goryeo as his pretext; he defeated and killed the general Kang Jo, and early in 1011 burned the capital, Kaegyong, while King Hyeonjong fled to Naju, but his army was harassed all the way home. When Goryeo refused to hand back the garrisons, Liao attacked again, and in 1018–1019 Xiao Paiya’s army marched almost to Kaegyong before Kang Gam-chan destroyed it at Gwiju on 10 March 1019. Goryeo remained a nominal tributary of Liao, kept the land up to the Yalu, and guarded its north with a long wall built between 1033 and 1044.
: Tre invasioner av Goryeo genomförda av khitanernas Liaorike, som slutade med en seger för Goryeo vid Gwiju och en varaktig fred. Goryeo hade varit fientligt mot khitanerna sedan de förintade Balhae 926, och det handlade och utväxlade sändebud med Songdynastins Kina, Liaos rival. År 993 gick en Liaoarmé under Xiao Sunning över Yalufloden; Goryeos sändebud Seo Hui förhandlade fram en uppgörelse där Goryeo blev tributpliktigt under Liao men fick landet upp till Yalu, där det byggde sex befästa garnisoner. År 1010 invaderade kejsar Shengzong personligen och använde en palatskupp i Goryeo som förevändning; han besegrade och dödade generalen Kang Jo och brände i början av 1011 huvudstaden Kaegyong medan kung Hyeonjong flydde till Naju, men hans armé ansattes hela vägen hem. När Goryeo vägrade att lämna tillbaka garnisonerna anföll Liao igen, och 1018–1019 marscherade Xiao Paiyas armé nästan ända fram till Kaegyong innan Kang Gam-chan förintade den vid Gwiju den 10 mars 1019. Goryeo förblev nominellt tributpliktigt under Liao, behöll landet upp till Yalu och skyddade sin norra gräns med en lång mur som byggdes mellan 1033 och 1044.
