# Svenska översättningar av katalogtexten (våg 10); stegtexterna kommer senare.
Goryeo’s Liaodong campaigns: Goryeos fälttåg i Liaodong
Goryeo’s two attempts to push into Liaodong as the Yuan empire collapsed, the second of which ended in Yi Seong-gye’s coup. After breaking with the Yuan in 1356 and retaking the north-east, King Gongmin sent armies across the Yalu in 1370 against the Yuan forces left in Liaodong. Yi Seong-gye took the mountain fortress of Uraseong (Wunu shan) in the first month, and in the eleventh month he and Ji Yong-su took Liaoyang, the main city of the region, but withdrew for lack of supplies. In the following years the new Ming dynasty took over Liaodong. In 1388, when the Ming announced that it would claim the lands north of Cheollyeong, King U and his chief minister Choe Yeong sent an army of nearly 39,000 to attack Liaodong. Yi Seong-gye, one of its two commanders, had argued against the war; when the army reached Wihwado, an island in the Yalu, in the rains, he and Jo Min-su turned it around, marched on Kaegyong, exiled Choe Yeong and deposed the king. Four years later Yi Seong-gye founded the Joseon dynasty.: Goryeos två försök att tränga in i Liaodong när Yuanriket föll samman, av vilka det andra slutade med Yi Seong-gyes kupp. Sedan kung Gongmin 1356 hade brutit med Yuan och återtagit landets nordöstra del sände han 1370 arméer över Yalufloden mot de Yuanstyrkor som fanns kvar i Liaodong. Yi Seong-gye intog bergsfästningen Uraseong (Wunu shan) i första månaden, och i elfte månaden intog han och Ji Yong-su Liaoyang, områdets främsta stad, men drog sig tillbaka i brist på förnödenheter. Under de följande åren tog den nya Mingdynastin över Liaodong. År 1388, när Ming tillkännagav att man skulle göra anspråk på landen norr om Cheollyeong, sände kung U och hans förste minister Choe Yeong en armé på nästan 39 000 man för att anfalla Liaodong. Yi Seong-gye, en av dess två befälhavare, hade argumenterat mot kriget; när armén i regnen nådde Wihwado, en ö i Yalu, vände han och Jo Min-su om med den, marscherade mot Kaegyong, förvisade Choe Yeong och avsatte kungen. Fyra år senare grundade Yi Seong-gye Joseondynastin.
