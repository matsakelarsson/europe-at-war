# Svenska översättningar av katalogtexten (våg 10); stegtexterna kommer senare.
Military coup of 1170 and the risings against it: Militärkuppen 1170 och resningarna mot den
? The seizure of power by Goryeo’s military officers and the risings that followed. Under King Uijong, military officers were kept below civil officials in rank and treated with contempt. In the eighth month of 1170, during a royal outing to the Bohyeonwon hostel near Kaegyong, the generals Jeong Jung-bu, Yi Ui-bang and Yi Go had the guards kill the civil officials and eunuchs in the king’s party; more than fifty officials were killed in the capital. Uijong was exiled to Geoje and his brother was made king as Myeongjong. In the eighth month of 1173 Kim Bo-dang, a civil official commanding the north-eastern frontier, rose to restore Uijong; his allies brought the former king from Geoje to Gyeongju, but they were defeated, Kim Bo-dang was executed, and in the tenth month Yi Ui-min killed Uijong at Gyeongju. Many more civil officials were killed in reprisal. In the ninth month of 1174 Jo Wi-chong, governor of the Western Capital (Pyongyang), rose with more than forty towns of the north-west; his army reached Kaegyong but was driven back, and Seogyeong held out until the sixth month of 1176, when it fell and he was killed. Meanwhile, in the first month of 1176, Mangi and Mangsoi led the people of Myeonghak-so, a settlement of bound craftsmen in Gongju (today in Daejeon), in a rising that took Gongju; the court raised Myeonghak-so to a county to win them over, but they rose again in 1177 and surrendered in the sixth month. The officers kept power, under a succession of military strongmen, for a century.
: Goryeos militärofficerares maktövertagande och de resningar som följde. Under kung Uijong hölls militärofficerarna under de civila ämbetsmännen i rang och behandlades med förakt. I åttonde månaden 1170, under en kunglig utflykt till härbärget Bohyeonwon nära Kaegyong, lät generalerna Jeong Jung-bu, Yi Ui-bang och Yi Go vakterna döda de civila ämbetsmännen och eunuckerna i kungens följe; mer än femtio ämbetsmän dödades i huvudstaden. Uijong förvisades till Geoje och hans bror sattes på tronen som Myeongjong. I åttonde månaden 1173 reste sig Kim Bo-dang, en civil ämbetsman som förde befälet över den nordöstra gränsen, för att återinsätta Uijong; hans allierade förde den förre kungen från Geoje till Gyeongju, men de besegrades, Kim Bo-dang avrättades, och i tionde månaden dödade Yi Ui-min Uijong i Gyeongju. Många fler civila ämbetsmän dödades som hämnd. I nionde månaden 1174 reste sig Jo Wi-chong, guvernör i Västra huvudstaden (Pyongyang), med mer än fyrtio städer i nordväst; hans armé nådde Kaegyong men drevs tillbaka, och Seogyeong höll stånd till sjätte månaden 1176, då staden föll och han dödades. Under tiden, i första månaden 1176, ledde Mangi och Mangsoi folket i Myeonghak-so, en bosättning av ofria hantverkare i Gongju (i dag i Daejeon), i en resning som intog Gongju; hovet upphöjde Myeonghak-so till distrikt för att vinna dem över, men de reste sig igen 1177 och kapitulerade i sjätte månaden. Officerarna behöll makten under en rad militära makthavare i ett sekel.
