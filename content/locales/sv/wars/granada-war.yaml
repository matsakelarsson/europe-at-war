In March 1483 a large Castilian raiding force of nobles and knights of the military orders, led by the Master of Santiago and the Marquis of Cádiz, rode into the Ajarquía, the hill country east of Málaga, to plunder it. Lost in the ravines at night, they were ambushed by the local people and by troops under Abu’l-Hasan’s brother Muhammad, known as al-Zagal. Hundreds were killed and many more captured. It was the worst Castilian defeat of the war.: I mars 1483 red en stor kastiliansk plundringsstyrka av adelsmän och riddare ur de andliga riddarordnarna, ledd av stormästaren för Santiagoorden och markisen av Cádiz, in i Ajarquía, bergslandet öster om Málaga, för att plundra det. Vilse i ravinerna om natten hamnade de i bakhåll av lokalbefolkningen och av trupper under Abu’l-Hasans bror Muhammad, känd som al-Zagal. Hundratals dödades och många fler tillfångatogs. Det var kastilianernas värsta nederlag under kriget.
A month later Boabdil, wanting a victory of his own, attacked Lucena with his father-in-law Ali al-Attar. The Count of Cabra and his nephew, the alcaide of the Donceles, beat his army near the town; Ali al-Attar was killed and Boabdil himself was captured. Ferdinand and Isabella saw the value of a divided Granada. By the Pact of Córdoba that August they freed him as their vassal, promising him help against his father and uncle in return for tribute and his son as a hostage. From then on the war ran alongside a Nasrid civil war.: En månad senare angrep Boabdil, som ville ha en egen seger, Lucena tillsammans med sin svärfar Ali al-Attar. Greven av Cabra och hans brorson, alcaiden för Donceles, slog hans här nära staden; Ali al-Attar stupade och Boabdil själv tillfångatogs. Ferdinand och Isabella insåg värdet av ett splittrat Granada. Genom pakten i Córdoba i augusti samma år frigav de honom som sin vasall och lovade honom hjälp mot hans far och farbror i utbyte mot tribut och hans son som gisslan. Från och med då löpte kriget parallellt med ett nasridiskt inbördeskrig.
