By 1481 the Nasrid emirate of Granada was the last Muslim state in the Iberian Peninsula, a mountainous land with the ports of Málaga and Almería and the city of Granada itself, crowned by the Alhambra. Its emir, Abu’l-Hasan Ali, had stopped paying tribute to Castile. Isabella of Castile and Ferdinand of Aragon, married since 1469 and secure after the War of the Castilian Succession, were ready to end its independence. In late December 1481, in reprisal for a Christian raid, Granadan troops surprised the Castilian border town of Zahara by night and carried off its people as captives.: År 1481 var det nasridiska emiratet Granada den sista muslimska staten på Iberiska halvön, ett bergigt land med hamnstäderna Málaga och Almería och själva staden Granada, krönt av Alhambra. Dess emir, Abu’l-Hasan Ali, hade slutat betala tribut till Kastilien. Isabella av Kastilien och Ferdinand av Aragonien, gifta sedan 1469 och säkra efter det kastilianska tronföljdskriget, var redo att göra slut på dess självständighet. I slutet av december 1481 överrumplade granadiska trupper, som vedergällning för en kristen räd, den kastilianska gränsstaden Zahara om natten och förde bort dess invånare som fångar.
Castile struck back on 28 February 1482, when Rodrigo Ponce de León, Marquis of Cádiz, scaled the walls of Alhama, a rich town on the road between Granada and Málaga, and took it after hard street fighting. Abu’l-Hasan besieged it twice, and the Catholic Monarchs made its defence a royal cause; Ferdinand himself took command there in May. In July he besieged Loja and was driven off. On the day Loja was relieved, Abu’l-Hasan’s son Abu Abdallah, Boabdil, rose against his father and took the Alhambra, splitting Granada between rival emirs.: Kastilien slog tillbaka den 28 februari 1482, då Rodrigo Ponce de León, markis av Cádiz, besteg murarna i Alhama, en rik stad vid vägen mellan Granada och Málaga, och intog den efter hårda gatustrider. Abu’l-Hasan belägrade den två gånger, och de katolska monarkerna gjorde dess försvar till en kunglig angelägenhet; Ferdinand tog själv befälet där i maj. I juli belägrade han Loja men drevs bort. Samma dag som Loja undsattes gjorde Abu’l-Hasans son Abu Abdallah, Boabdil, uppror mot sin far och tog Alhambra, vilket splittrade Granada mellan rivaliserande emirer.
