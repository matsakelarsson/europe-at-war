Al-Zagal: Al-Zagal
In 1488 the Monarchs turned east, where Vera, Mojácar and other towns submitted without a fight. In June 1489 a large army besieged Baza, al-Zagal’s strongest fortress, defended by his kinsman Sidi Yahya al-Nayar. The city was hard to surround and the guns were of little use against it, so the siege dragged on through the autumn rains, at enormous cost. Queen Isabella came to the camp in November to show that it would not be lifted, and Baza surrendered on generous terms on 4 December 1489.: År 1488 vände sig monarkerna österut, där Vera, Mojácar och andra städer underkastade sig utan strid. I juni 1489 belägrade en stor här Baza, al-Zagals starkaste fästning, som försvarades av hans släkting Sidi Yahya al-Nayar. Staden var svår att omringa och kanonerna gjorde liten nytta mot den, så belägringen drog ut genom höstregnen till enorma kostnader. Drottning Isabella kom till lägret i november för att visa att belägringen inte skulle hävas, och Baza kapitulerade på generösa villkor den 4 december 1489.
Sidi Yahya went over to the Christians and helped persuade al-Zagal that further resistance was hopeless. In December al-Zagal handed over Almería and Guadix in return for a lordship in the Alpujarras and a pension; he later left for North Africa. Now only the city of Granada and the mountains of the Alpujarras remained to Boabdil, who had promised to surrender Granada once his uncle was beaten. Unhappy with his rewards, he refused and broke with the Monarchs, and the war entered its last phase.: Sidi Yahya gick över till de kristna och hjälpte till att övertyga al-Zagal om att fortsatt motstånd var hopplöst. I december överlämnade al-Zagal Almería och Guadix mot ett herresäte i Alpujarras och en pension; senare reste han till Nordafrika. Nu återstod bara staden Granada och bergen i Alpujarras för Boabdil, som hade lovat att överlämna Granada när hans farbror väl var besegrad. Missnöjd med sin belöning vägrade han och bröt med monarkerna, och kriget gick in i sitt sista skede.
