Through 1490 Castilian armies burned the crops of the Vega, while Boabdil, hoping for help from North Africa and Egypt that never came, struck back at nearby castles and tried to win back an outlet to the sea. In April 1491 Ferdinand camped before Granada with a large army. When fire destroyed the camp that July, the Monarchs rebuilt it in stone as a town, Santa Fe, a sign that they would stay until the city fell. Hunger grew inside, Boabdil’s advisers quarrelled, and secret talks began.: Under 1490 brände kastilianska härar skördarna på Vega, medan Boabdil, i hopp om hjälp från Nordafrika och Egypten som aldrig kom, slog tillbaka mot närliggande borgar och försökte återvinna ett utlopp mot havet. I april 1491 slog Ferdinand läger framför Granada med en stor här. När en brand förstörde lägret i juli byggde monarkerna upp det igen i sten som en stad, Santa Fe, ett tecken på att de skulle stanna tills staden föll. Svälten ökade innanför murarna, Boabdils rådgivare grälade och hemliga förhandlingar inleddes.
By the Treaty of Granada of 25 November 1491 the city was to surrender on generous terms. Its Muslims would keep their property, laws, mosques and religion, and could emigrate freely. Boabdil handed over the Alhambra on 2 January 1492, received a lordship in the Alpujarras and left for Morocco in October 1493. The terms did not last. The Jews of Castile and Aragon were ordered that March to convert or leave, and after forced conversions provoked a revolt in 1499–1501, the Muslims of Granada had to choose between baptism and exile.: Genom fördraget i Granada den 25 november 1491 skulle staden kapitulera på generösa villkor. Dess muslimer skulle behålla sin egendom, sina lagar, moskéer och sin religion och fick fritt emigrera. Boabdil överlämnade Alhambra den 2 januari 1492, fick ett herresäte i Alpujarras och reste till Marocko i oktober 1493. Villkoren bestod inte. Judarna i Kastilien och Aragonien beordrades i mars samma år att konvertera eller lämna landet, och sedan tvångsomvändelser framkallat ett uppror 1499–1501 fick Granadas muslimer välja mellan dop och landsflykt.
