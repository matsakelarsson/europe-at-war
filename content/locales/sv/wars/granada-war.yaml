In April 1487 Ferdinand marched on Málaga, the emirate’s great port, by way of Vélez-Málaga to the east. Al-Zagal came down from Granada to relieve Vélez, but while he was away Boabdil’s supporters seized the capital, and al-Zagal fell back to Guadix. Vélez surrendered on 27 April. With the coast road open, the Castilians besieged Málaga by land and sea from 7 May. Its commander, Hamet el Zegrí, with North African troops and Christian renegades, refused all terms, and the city held out for three months while famine set in.: I april 1487 tågade Ferdinand mot Málaga, emiratets stora hamnstad, via Vélez-Málaga i öster. Al-Zagal kom ned från Granada för att undsätta Vélez, men medan han var borta tog Boabdils anhängare huvudstaden, och al-Zagal drog sig tillbaka till Guadix. Vélez kapitulerade den 27 april. Med kustvägen öppen belägrade kastilianerna Málaga till lands och sjöss från den 7 maj. Dess befälhavare, Hamet el Zegrí, med nordafrikanska trupper och kristna renegater, avvisade alla villkor, och staden höll ut i tre månader medan svälten bredde ut sig.
Málaga surrendered on 18 August 1487. Ferdinand refused terms, having offered them twice, and as punishment most of its people, many thousands, were enslaved; some were sold, some given away and some allowed to ransom themselves. The city’s Jews were ransomed by the Jews of Castile, and renegades were put to death. The fall of Málaga cut Granada off from North Africa. Boabdil held Granada as the Monarchs’ vassal, and al-Zagal was left with the east of the emirate around Guadix, Baza and Almería.: Málaga kapitulerade den 18 augusti 1487. Ferdinand vägrade att ge villkor, eftersom han redan erbjudit dem två gånger, och som straff gjordes de flesta av invånarna, många tusen, till slavar; en del såldes, en del skänktes bort och en del fick friköpa sig själva. Stadens judar friköptes av Kastiliens judar, och renegaterna avrättades. Málagas fall skar av Granada från Nordafrika. Boabdil höll Granada som monarkernas vasall, och al-Zagal hade kvar emiratets östra del kring Guadix, Baza och Almería.
