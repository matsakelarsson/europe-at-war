Castile now fought a war of sieges, town by town. Its decisive weapon was artillery. The Monarchs hired gunners and founders from France, Burgundy and Italy, and trains of heavy bombards were dragged along mountain roads that labourers built ahead of them. Álora fell in 1484 and Setenil that September. In May 1485, after a bombardment of about two weeks and talks with its leaders, Ronda surrendered, and Marbella and the western hills followed. That year al-Zagal pushed aside his ageing brother, who died soon after, and fought both the Christians and his nephew Boabdil.: Kastilien förde nu ett belägringskrig, stad för stad. Dess avgörande vapen var artilleriet. Monarkerna anställde kanonjärer och gjutare från Frankrike, Burgund och Italien, och trängar av tunga bombarder släpades längs bergsvägar som arbetare byggde framför dem. Álora föll 1484 och Setenil i september samma år. I maj 1485, efter omkring två veckors bombardemang och förhandlingar med dess ledare, kapitulerade Ronda, och Marbella och de västra bergstrakterna följde efter. Samma år sköt al-Zagal undan sin åldrande bror, som dog kort därefter, och bekämpade både de kristna och sin brorson Boabdil.
In May 1486 Ferdinand besieged Loja again, where Boabdil, who had come to terms with his uncle and broken with the Monarchs, had joined the defence. English volunteers under Lord Scales were among the besiegers. The town surrendered at the end of May, and Boabdil was captured and released once more. Íllora and Moclín, fortresses guarding the approaches to Granada, fell that summer. The western half of the emirate was gone, and Castile’s armies could reach the Vega, the fertile plain around the capital.: I maj 1486 belägrade Ferdinand Loja på nytt, där Boabdil, som hade gjort upp med sin farbror och brutit med monarkerna, hade anslutit sig till försvaret. Engelska frivilliga under lord Scales fanns bland belägrarna. Staden kapitulerade i slutet av maj, och Boabdil tillfångatogs och släpptes ännu en gång. Íllora och Moclín, fästningar som vaktade vägarna till Granada, föll samma sommar. Emiratets västra halva var förlorad, och Kastiliens härar kunde nå Vega, den bördiga slätten kring huvudstaden.
