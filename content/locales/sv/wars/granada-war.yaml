Granada War: Granadakriget
The ten-year war in which Isabella of Castile and Ferdinand of Aragon conquered the Nasrid emirate of Granada, the last Muslim state in western Europe. Helped by a civil war within the Nasrid family and by their siege artillery, the Catholic Monarchs took Granada’s towns one by one, among them Ronda, Málaga and Baza, until Boabdil surrendered the city and the Alhambra on 2 January 1492, completing the Reconquista.: Det tioåriga krig genom vilket Isabella av Kastilien och Ferdinand av Aragonien erövrade det nasridiska emiratet Granada, den sista muslimska staten i Västeuropa. Med hjälp av ett inbördeskrig inom den nasridiska ätten och sitt belägringsartilleri intog de katolska monarkerna Granadas städer en efter en, bland dem Ronda, Málaga och Baza, tills Boabdil överlämnade staden och Alhambra den 2 januari 1492, vilket fullbordade reconquistan.
