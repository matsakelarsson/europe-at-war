Spanish sources call the emir Abu’l-Hasan Ali “Muley Hacén”, his son Abu Abdallah Muhammad “Boabdil” and his brother Muhammad “el Zagal”, the valiant. Historians number these last two differently as Muhammad XI, XII or XIII.: Spanska källor kallar emiren Abu’l-Hasan Ali ”Muley Hacén”, hans son Abu Abdallah Muhammad ”Boabdil” och hans bror Muhammad ”el Zagal”, den tappre. Historikerna numrerar de två senare olika, som Muhammad XI, XII eller XIII.
The chronicles give the Castilian armies as 50,000 or more in the main campaigns and the Granadan ones as tens of thousands. Some modern historians think the real numbers were much smaller, perhaps 8,000–20,000 Castilian soldiers and a few thousand Granadans.: Krönikorna anger de kastilianska härarna till 50 000 man eller mer under de stora fälttågen och de granadiska till tiotusentals. Vissa moderna historiker tror att de verkliga siffrorna var mycket lägre, kanske 8 000–20 000 kastilianska soldater och några tusen granadier.
Dates are Julian. The centuries before 1482 are told in the Reconquista.: Datumen följer den julianska kalendern. Århundradena före 1482 skildras under Reconquista.
