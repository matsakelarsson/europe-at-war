Grand Mosque seizure: Ockupationen av Stora moskén i Mecka
? The two-week occupation of the Great Mosque of Mecca, Islam’s holiest site, by armed followers of Juhayman al-Otaybi, a former Saudi National Guard corporal and preacher who denounced the Saudi royal family as corrupt and Westernised. At dawn prayers on 20 November 1979, the first day of the Islamic year 1400, between 300 and 600 men seized the mosque with tens of thousands of worshippers inside, and proclaimed Juhayman’s brother-in-law, Mohammed Abdullah al-Qahtani, to be the Mahdi, the redeemer expected at the end of time. After the senior clergy issued a ruling allowing force in the sanctuary, Saudi troops and National Guardsmen fought for the mosque and then for the cellars beneath it, with advice and gas from a small team of French GIGN commandos and help from Pakistani special forces, until the last militants surrendered on 4 December. Al-Qahtani was killed in the fighting. Official figures gave 127 soldiers, 117 militants and 26 pilgrims killed, though diplomats believed the toll was higher. Juhayman and 62 of his followers were beheaded on 9 January 1980 in eight Saudi cities. Afterwards the government gave the conservative clergy greater influence over Saudi society.
: Den två veckor långa ockupationen av Stora moskén i Mecka, islams heligaste plats, av beväpnade anhängare till Juhayman al-Otaybi, en före detta korpral i det saudiska nationalgardet och predikant som fördömde den saudiska kungafamiljen som korrumperad och västerniserad. Vid gryningsbönen den 20 november 1979, den första dagen i det islamiska året 1400, intog mellan 300 och 600 män moskén med tiotusentals bedjande därinne och utropade Juhaymans svåger, Mohammed Abdullah al-Qahtani, till Mahdi, den frälsare som väntas vid tidens slut. Sedan landets ledande religiösa lärda hade utfärdat ett utlåtande som tillät våld i helgedomen, stred saudiska soldater och nationalgardister om moskén och sedan om källarna under den, med råd och gas från en liten grupp kommandosoldater ur franska GIGN och med hjälp av pakistanska specialstyrkor, tills de sista militanterna kapitulerade den 4 december. Al-Qahtani dödades i striderna. Enligt officiella siffror dödades 127 soldater, 117 militanter och 26 pilgrimer, men diplomater trodde att dödssiffran var högre. Juhayman och 62 av hans anhängare halshöggs den 9 januari 1980 i åtta saudiska städer. Efteråt gav regeringen de konservativa religiösa lärda större inflytande över det saudiska samhället.
