In late 870 the army invaded Wessex and fortified a camp at Reading. In the winter of 871 the West Saxons fought it again and again. King Æthelred and his brother Alfred won at Ashdown in January but lost several other battles, and in April Æthelred died. Alfred, now king, paid the Vikings to leave. They wintered in London, then at Torksey and in 873 at Repton, in the heart of Mercia, where they drove King Burgred into exile and put Ceolwulf, a Mercian thegn, in his place.: I slutet av 870 invaderade hären Wessex och befäste ett läger vid Reading. Vintern 871 drabbade västsaxarna samman med den gång på gång. Kung Æthelred och hans bror Alfred segrade vid Ashdown i januari men förlorade flera andra slag, och i april dog Æthelred. Alfred, nu kung, betalade vikingarna för att ge sig av. De övervintrade i London, sedan i Torksey och 873 i Repton, i hjärtat av Mercia, där de drev kung Burgred i landsflykt och satte Ceolwulf, en merciansk thegn, i hans ställe.
In 874 the army split. Halfdan took his men north, and in 876 he shared out the land of Northumbria among them; the Chronicle says they “were ploughing and providing for themselves”. Guthrum and two other kings went to Cambridge, then slipped into Wessex, holding Wareham and Exeter in 875–877. In 877 they divided Mercia, settling its eastern half and leaving the west to Ceolwulf.: År 874 delade hären på sig. Halvdan förde sina män norrut, och 876 fördelade han Northumbrias jord bland dem; krönikan säger att de ”plöjde och försörjde sig själva”. Guthrum och två andra kungar drog till Cambridge och tog sig sedan in i Wessex, där de höll Wareham och Exeter 875–877. År 877 delade de Mercia, bosatte sig i dess östra halva och lämnade den västra åt Ceolwulf.
