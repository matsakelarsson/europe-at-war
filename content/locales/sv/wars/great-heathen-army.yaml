The main source is the Anglo-Saxon Chronicle, written at Alfred’s court and partisan to Wessex. Its years began at Christmas or in September, so some events are a year earlier or later in other reckonings.: Huvudkällan är Anglosaxiska krönikan, som skrevs vid Alfreds hov och tar parti för Wessex. Dess år började vid jul eller i september, så vissa händelser hamnar ett år tidigare eller senare med andra tideräkningar.
The name comes from the Chronicle’s “mycel hæþen here”. The army’s size is unknown; estimates range from a few hundred to several thousand men.: Namnet kommer från krönikans ”mycel hæþen here”. Härens storlek är okänd; uppskattningarna varierar från några hundra till flera tusen man.
