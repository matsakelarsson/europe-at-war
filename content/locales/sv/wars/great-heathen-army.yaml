Great Heathen Army: Stora hednahären
A large Scandinavian army, mostly Danish, which invaded England in 865 and over fifteen years destroyed the kingdoms of Northumbria, East Anglia and Mercia. Stopped by Alfred of Wessex at Edington in 878, its leaders settled the conquered lands, the area later called the Danelaw.: En stor skandinavisk här, mestadels dansk, som invaderade England 865 och under femton år krossade kungarikena Northumbria, East Anglia och Mercia. Sedan den hejdats av Alfred av Wessex vid Edington 878 slog sig dess ledare ned i de erövrade länderna, det område som senare kallades Danelagen.
