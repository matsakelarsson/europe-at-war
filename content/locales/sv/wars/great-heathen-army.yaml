In midwinter 878, just after Twelfth Night, Guthrum fell on the royal estate of Chippenham. Much of Wessex submitted and Alfred fled with a small band to the marshes of Athelney in Somerset, from where he raided the Danes. In May he called out the men of Somerset, Wiltshire and part of Hampshire, and at Edington he defeated Guthrum’s army, then besieged it in Chippenham until it surrendered.: Mitt i vintern 878, strax efter trettondagen, föll Guthrum över kungsgården Chippenham. Stora delar av Wessex underkastade sig, och Alfred flydde med en liten skara till träskmarkerna vid Athelney i Somerset, varifrån han angrep danerna. I maj kallade han ut männen från Somerset, Wiltshire och en del av Hampshire, och vid Edington besegrade han Guthrums här och belägrade den sedan i Chippenham tills den kapitulerade.
Guthrum agreed to leave Wessex and to be baptised, with Alfred as his godfather. In 879 his army moved to East Anglia, where he ruled as king under his baptismal name, Æthelstan. A treaty between the two kings, probably from the 880s, set the border along the Thames, the Lea and Watling Street. North and east of it lay the region of Danish law and settlement later called the Danelaw, where Scandinavian place names such as those ending in -by and -thorpe still abound.: Guthrum gick med på att lämna Wessex och att låta döpa sig, med Alfred som gudfar. År 879 flyttade hans här till East Anglia, där han regerade som kung under sitt dopnamn, Æthelstan. Ett fördrag mellan de båda kungarna, troligen från 880-talet, drog gränsen längs Themsen, Lea och Watling Street. Norr och öster om den låg området med dansk lag och bosättning, senare kallat Danelagen, där skandinaviska ortnamn, som de som slutar på -by och -thorpe, fortfarande är vanliga.
