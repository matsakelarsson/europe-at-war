Viking raids on England had gone on for seventy years, but the force that landed in East Anglia in 865 came to stay. The Chronicle calls it the “great heathen army”; its leaders are said to have included Ivar the Boneless and Halfdan, sons of the legendary Ragnar Lothbrok. The East Anglians bought peace with horses. In November 866 the army rode north and took York, while the Northumbrians were divided by civil war. In March 867 the two rival kings, Osberht and Ælla, attacked the city together and were both killed.: Vikingatågen mot England hade pågått i sjuttio år, men den styrka som landsteg i East Anglia 865 hade kommit för att stanna. Krönikan kallar den ”den stora hednahären”; bland dess ledare ska ha funnits Ivar Benlös och Halvdan, söner till den legendariske Ragnar Lodbrok. East Anglias invånare köpte fred med hästar. I november 866 red hären norrut och intog York, medan northumbrierna var splittrade av inbördeskrig. I mars 867 angrep de två rivaliserande kungarna, Osberht och Ælla, staden tillsammans och stupade båda.
The Vikings set up an English puppet king in Northumbria and moved into Mercia, taking Nottingham. A joint army of Mercia and Wessex besieged them there without result, and the Mercians paid them to leave. In 869 the army returned to East Anglia and took up winter quarters at Thetford. King Edmund fought it and was defeated, captured and killed. He was soon venerated as a martyr, St Edmund.: Vikingarna insatte en engelsk marionettkung i Northumbria och drog in i Mercia, där de intog Nottingham. En gemensam här från Mercia och Wessex belägrade dem där utan resultat, och mercierna betalade dem för att ge sig av. År 869 återvände hären till East Anglia och gick i vinterkvarter i Thetford. Kung Edmund bekämpade den och besegrades, tillfångatogs och dödades. Han vördades snart som martyr, den helige Edmund.
