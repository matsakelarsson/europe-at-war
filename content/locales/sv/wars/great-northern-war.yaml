Denmark–Norway, Saxony–Poland and Russia agreed to attack the young Charles XII from three sides. In February 1700 Saxon troops of Augustus II, Elector of Saxony and King of Poland, invaded Livonia and tried to take Riga. In March the Danes marched into Holstein-Gottorp, Sweden’s ally, and besieged Tönning.: Danmark–Norge, Sachsen–Polen och Ryssland kom överens om att anfalla den unge Karl XII från tre håll. I februari 1700 invaderade sachsiska trupper under August II, kurfurste av Sachsen och kung av Polen, Livland och försökte inta Riga. I mars marscherade danskarna in i Holstein-Gottorp, Sveriges allierade, och belägrade Tönning.
Charles, aged 18, struck at Denmark first. With English and Dutch ships covering the crossing, he landed at Humlebæk on Zealand on 4 August, and Frederick IV made peace at Travendal two weeks later. Charles then shipped his army to Pernau and marched on the Russians besieging Narva. On 30 November, in a snowstorm, about 10,500 Swedes routed an army more than three times their size.: Karl, 18 år gammal, slog först till mot Danmark. Med engelska och nederländska fartyg som skyddade överfarten landsteg han vid Humlebæk på Själland den 4 augusti, och Fredrik IV slöt fred i Travendal två veckor senare. Karl skeppade sedan sin armé till Pernau och marscherade mot ryssarna som belägrade Narva. Den 30 november slog omkring 10 500 svenskar i en snöstorm en armé som var mer än tre gånger så stor.
