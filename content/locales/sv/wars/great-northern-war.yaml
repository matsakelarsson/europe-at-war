Attacking with the snow at their backs, the Swedes broke through the Russian siege lines. Many Russians drowned when a bridge over the river collapsed under the fleeing troops.: Svenskarna anföll med snön i ryggen och bröt igenom de ryska belägringslinjerna. Många ryssar drunknade när en bro över floden rasade under de flyende trupperna.
