Great Northern War dates are New Style throughout. Sweden itself used a calendar of its own, one day ahead of Old Style, from 1700 to 1712.: Datumen för Stora nordiska kriget följer genomgående nya stilen. Sverige självt använde 1700–1712 en egen kalender som låg en dag före gamla stilen.
