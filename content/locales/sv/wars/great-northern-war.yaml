Under cover of smoke from burning straw, the Swedes crossed the wide river in boats and drove off the Saxon army.: I skydd av röken från brinnande halm tog sig svenskarna över den breda floden i båtar och drev bort den sachsiska armén.
Warsaw: Warszawa
May 1702: Maj 1702
Charles entered the Polish capital. Two years later his candidate, Stanisław Leszczyński, was elected king here.: Karl tågade in i den polska huvudstaden. Två år senare valdes hans kandidat, Stanisław Leszczyński, till kung här.
Battle of Kliszów: Slaget vid Kliszów
19 July 1702: 19 juli 1702
Charles beat a larger Saxon-Polish army led by Augustus himself.: Karl slog en större sachsisk-polsk armé som leddes av August själv.
Battle of Pułtusk: Slaget vid Pułtusk
1 May 1703: 1 maj 1703
