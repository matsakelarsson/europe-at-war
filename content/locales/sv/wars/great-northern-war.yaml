Great Northern War: Stora nordiska kriget
Denmark–Norway, Saxony–Poland and Russia attacked Sweden in 1700. Charles XII beat them one by one and drove Augustus II from the Polish throne, but his invasion of Russia ended in disaster at Poltava in 1709. By the peace of Nystad in 1721 Sweden had lost its Baltic provinces and most of its German lands, and Russia had taken its place as the great power of the north.: Danmark–Norge, Sachsen–Polen och Ryssland anföll Sverige år 1700. Karl XII besegrade dem en efter en och drev bort August II från den polska tronen, men hans invasion av Ryssland slutade i katastrof vid Poltava 1709. Genom freden i Nystad 1721 hade Sverige förlorat sina baltiska provinser och större delen av sina tyska besittningar, och Ryssland hade tagit dess plats som Nordens stormakt.
