On 19 July 1701 Charles forced a crossing of the Düna near Riga, drove the Saxons out of Livonia and occupied Courland. Instead of turning on Russia, he set out to drive Augustus off the Polish throne.: Den 19 juli 1701 forcerade Karl Düna nära Riga, drev ut sachsarna ur Livland och ockuperade Kurland. I stället för att vända sig mot Ryssland gav han sig i kast med att driva bort August från den polska tronen.
He took Warsaw in May 1702, beat the Saxons and their Polish allies at Kliszów on 19 July and went on to Kraków. In 1703 he won again at Pułtusk and starved Thorn into surrender after a siege of nearly five months. In July 1704 a Swedish-backed assembly in Warsaw elected Stanisław Leszczyński king of Poland, but Augustus fought on.: Han intog Warszawa i maj 1702, slog sachsarna och deras polska allierade vid Kliszów den 19 juli och fortsatte till Kraków. År 1703 segrade han igen vid Pułtusk och svalt ut Thorn till kapitulation efter en belägring på nästan fem månader. I juli 1704 valde en svenskstödd församling i Warszawa Stanisław Leszczyński till kung av Polen, men August fortsatte kampen.
