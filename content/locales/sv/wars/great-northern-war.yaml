The southernmost point of the 1719 raids. Much of the town was burned.: Den sydligaste punkten för härjningarna 1719. Stora delar av staden brändes.
Battle of Stäket: Slaget vid Stäket
August 1719: Augusti 1719
Swedish troops beat back a Russian landing at the narrow strait on the waterway to Stockholm.: Svenska trupper slog tillbaka en rysk landstigning vid det smala sundet i farleden till Stockholm.
Battle of Grengam: Slaget vid Grengam
August 1720: Augusti 1720
Russian galleys trapped a Swedish squadron among the islands and captured four frigates.: Ryska galärer stängde in en svensk eskader bland öarna och erövrade fyra fregatter.
Umeå: Umeå
Russian troops burned the town.: Ryska trupper brände staden.
Sundsvall: Sundsvall
One of five Norrland towns burned in the last summer of the war.: En av fem norrländska städer som brändes under krigets sista sommar.
Piteå: Piteå
The northernmost town reached by the raids.: Den nordligaste stad som härjningarna nådde.
Galley fleet, 1719: Galärflottan 1719
Charles XII’s sister Ulrika Eleonora, and then her husband Frederick I, made peace on the best terms they could get. In the Treaties of Stockholm Sweden gave up Bremen-Verden to Hanover (November 1719) and Pomerania south of the Peene, with Stettin, Usedom and Wolin, to Prussia (February 1720). At Frederiksborg in July 1720 Denmark–Norway handed back Stralsund, Rügen and Wismar for 600,000 riksdaler, but Sweden lost its exemption from the Sound Dues and its alliance with Holstein-Gottorp.: Karl XII:s syster Ulrika Eleonora och därefter hennes make Fredrik I slöt fred på de bästa villkor de kunde få. Genom freden i Stockholm avträdde Sverige Bremen-Verden till Hannover (november 1719) och Pommern söder om Peene, med Stettin, Usedom och Wollin, till Preussen (februari 1720). I Frederiksborg i juli 1720 lämnade Danmark–Norge tillbaka Stralsund, Rügen och Wismar mot 600 000 riksdaler, men Sverige förlorade sin frihet från Öresundstullen och sitt förbund med Holstein-Gottorp.
Peace with Russia came last, at Nystad on 10 September 1721. Sweden gave up Livonia, Estonia with Ösel, Ingria and south-eastern Finland with Viborg and Kexholm. Russia returned the rest of Finland and paid 2 million riksdaler. Sweden’s time as a great power was over, and Russia had taken its place.: Freden med Ryssland kom sist, i Nystad den 10 september 1721. Sverige avträdde Livland, Estland med Ösel, Ingermanland och sydöstra Finland med Viborg och Kexholm. Ryssland lämnade tillbaka resten av Finland och betalade 2 miljoner riksdaler. Sveriges tid som stormakt var över, och Ryssland hade tagit dess plats.
