In Courland, Adam Ludwig Lewenhaupt beat Sheremetev at Gemauerthof on 26 July 1705. Early in 1706 Charles hemmed a Russian army into Grodno, while in the west Carl Gustaf Rehnskiöld destroyed a much larger Saxon-Russian army at Fraustadt on 13 February 1706.: I Kurland slog Adam Ludwig Lewenhaupt Sjeremetev vid Gemauerthof den 26 juli 1705. I början av 1706 stängde Karl in en rysk armé i Grodno, medan Carl Gustaf Rehnskiöld i väster förintade en mycket större sachsisk-rysk armé vid Fraustadt den 13 februari 1706.
In August Charles marched straight into Saxony, Augustus’s home. At Altranstädt near Leipzig on 24 September 1706 Augustus gave up the Polish crown and his alliance with the tsar. Even so, on 29 October a Russian-Saxon army beat a Swedish-Polish force at Kalisz, an embarrassment for Augustus, who had secretly made peace. The Swedish army stayed in Saxony for a year and set out against Russia in September 1707.: I augusti marscherade Karl rakt in i Sachsen, Augusts hemland. I Altranstädt nära Leipzig avsade sig August den 24 september 1706 den polska kronan och sitt förbund med tsaren. Ändå slog en rysk-sachsisk armé den 29 oktober en svensk-polsk styrka vid Kalisz, en pinsamhet för August, som i hemlighet hade slutit fred. Den svenska armén stannade i Sachsen i ett år och bröt upp mot Ryssland i september 1707.
Fraustadt: Fraustadt
Swedish victory over a Saxon-Russian army almost twice its size: Svensk seger över en sachsisk-rysk armé nästan dubbelt så stor
Treaty of Altranstädt: Freden i Altranstädt
Augustus II gives up the Polish crown: August II avsäger sig den polska kronan
Battle of Gemauerthof: Slaget vid Gemauerthof
26 July 1705: 26 juli 1705
Lewenhaupt’s smaller army beat Sheremetev in Courland, south of Riga.: Lewenhaupts mindre armé slog Sjeremetev i Kurland, söder om Riga.
Grodno: Grodno
January – April 1706: Januari – april 1706
Charles blockaded the main Russian army in the town through the winter, but it slipped away in the spring.: Karl blockerade den ryska huvudarmén i staden under vintern, men den lyckades smita undan på våren.
Battle of Fraustadt: Slaget vid Fraustadt
13 February 1706: 13 februari 1706
Rehnskiöld’s army of about 10,000 destroyed a Saxon-Russian army almost twice its size.: Rehnskiölds armé på omkring 10 000 man förintade en sachsisk-rysk armé nästan dubbelt så stor.
24 September 1706: 24 september 1706
Signed at the Swedish headquarters near Leipzig. Augustus recognised Stanisław as king of Poland.: Undertecknad vid det svenska högkvarteret nära Leipzig. August erkände Stanisław som kung av Polen.
Battle of Kalisz: Slaget vid Kalisz
29 October 1706: 29 oktober 1706
A Russian-Saxon army beat a Swedish-Polish force under Arvid Axel Mardefelt.: En rysk-sachsisk armé slog en svensk-polsk styrka under Arvid Axel Mardefelt.
Charles marched east through Poland and Lithuania in 1708 and won at Holowczyn on 14 July. The Russians burned the land ahead of him, so instead of heading for Moscow he turned south into Ukraine, where the Cossack hetman Ivan Mazepa had promised help. On 9 October the Russians caught Lewenhaupt’s relief column at Lesnaya and destroyed the supplies it was bringing from Riga. Mazepa brought only a few thousand Cossacks, and Menshikov razed his capital, Baturyn.: Karl marscherade österut genom Polen och Litauen 1708 och segrade vid Holowczyn den 14 juli. Ryssarna brände landet framför honom, så i stället för att gå mot Moskva vände han söderut in i Ukraina, där kosackhetmanen Ivan Mazepa hade lovat hjälp. Den 9 oktober hann ryssarna upp Lewenhaupts undsättningskolonn vid Lesnaja och förstörde förnödenheterna som den förde med sig från Riga. Mazepa kom med bara några tusen kosacker, och Mensjikov jämnade hans huvudstad Baturyn med marken.
After one of the coldest winters in memory, Charles besieged Poltava. He had been wounded in the foot, so Rehnskiöld commanded when, on 8 July 1709, about 22,700 Swedes attacked Peter’s fortified camp and were crushed. Three days later most of the survivors surrendered at Perevolochna on the Dnieper. Charles and Mazepa escaped to Ottoman territory at Bender.: Efter en av de kallaste vintrarna i mannaminne belägrade Karl Poltava. Han hade sårats i foten, så det var Rehnskiöld som förde befälet när omkring 22 700 svenskar den 8 juli 1709 anföll Peters befästa läger och krossades. Tre dagar senare kapitulerade de flesta av de överlevande vid Perevolotjna vid Dnepr. Karl och Mazepa flydde till osmanskt område vid Bender.
Poltava: Poltava
About 22,700 Swedes against 50,000–55,000 Russians: Omkring 22 700 svenskar mot 50 000–55 000 ryssar
Swedish commander: Svensk befälhavare
Carl Gustaf Rehnskiöld, as Charles XII was wounded: Carl Gustaf Rehnskiöld, eftersom Karl XII var sårad
Battle of Holowczyn: Slaget vid Holowczyn
14 July 1708: 14 juli 1708
Charles led his men across a marshy river at dawn and drove off the Russians, his last big victory in the field.: Karl ledde sina män över en sank flod i gryningen och drev bort ryssarna, hans sista stora seger i fält.
Battle of Lesnaya: Slaget vid Lesnaja
9 October 1708: 9 oktober 1708
Peter attacked Lewenhaupt’s column and its wagon train. Lewenhaupt reached the king with about half his men and none of the supplies.: Peter anföll Lewenhaupts kolonn och dess tross. Lewenhaupt nådde kungen med omkring hälften av sina män och inga av förnödenheterna.
Baturyn razed: Baturyn jämnas med marken
November 1708: November 1708
Menshikov stormed Mazepa’s capital before the Swedes could get there, and many of its people were killed.: Mensjikov stormade Mazepas huvudstad innan svenskarna hann dit, och många av dess invånare dödades.
Battle of Poltava: Slaget vid Poltava
8 July 1709: 8 juli 1709
The Swedish infantry advanced past Russian redoubts against a much larger army with far more guns, and was shattered.: Det svenska infanteriet ryckte fram förbi ryska skansar mot en mycket större armé med betydligt fler kanoner och krossades.
Surrender at Perevolochna: Kapitulationen vid Perevolotjna
11 July 1709: 11 juli 1709
With too few boats to cross the Dnieper, Lewenhaupt surrendered the rest of the army.: Med för få båtar för att ta sig över Dnepr kapitulerade Lewenhaupt med resten av armén.
Lewenhaupt: Lewenhaupt
Charles flees: Karl flyr
Poltava revived the coalition. Augustus took back the Polish throne and Denmark–Norway declared war again. In November 1709 a Danish army of 15,000 landed at Råå, took Helsingborg and marched through Scania into Blekinge. Magnus Stenbock raised a new army, largely of fresh recruits, and on 10 March 1710 beat the Danes outside Helsingborg. They left Scania for good.: Poltava väckte koalitionen till liv igen. August återtog den polska tronen och Danmark–Norge förklarade krig på nytt. I november 1709 landsteg en dansk armé på 15 000 man vid Råå, intog Helsingborg och marscherade genom Skåne in i Blekinge. Magnus Stenbock satte upp en ny armé, till stor del av nyrekryter, och slog danskarna utanför Helsingborg den 10 mars 1710. De lämnade Skåne för gott.
The east was lost. In 1710 the Russians took Viborg in June, Riga in July, Pernau in August and Reval in the autumn, and the nobles and towns of Livonia and Estonia submitted to the tsar. Plague swept through the besieged towns and on into Sweden itself.: Östern var förlorad. År 1710 intog ryssarna Viborg i juni, Riga i juli, Pernau i augusti och Reval på hösten, och adeln och städerna i Livland och Estland underkastade sig tsaren. Pesten drog fram genom de belägrade städerna och vidare in i själva Sverige.
Battle of Helsingborg: Slaget vid Helsingborg
Two armies of about 14,000 each; Swedish victory: Två arméer på omkring 14 000 man vardera; svensk seger
Lost to Russia in 1710: Förlorat till Ryssland 1710
Viborg, Kexholm, Riga, Pernau, Ösel, Reval: Viborg, Kexholm, Riga, Pernau, Ösel, Reval
10 March 1710: 10 mars 1710
On the Ringstorp heights just outside the town, Stenbock routed the Danish army that had landed at Råå the previous November. It was the last major battle of the war on Swedish soil.: På Ringstorpshöjderna strax utanför staden slog Stenbock den danska armé som hade landstigit vid Råå i november året innan. Det var krigets sista stora slag på svensk mark.
Viborg: Viborg
June 1710: Juni 1710
The fortress guarding south-eastern Finland fell after a siege of nearly three months.: Fästningen som skyddade sydöstra Finland föll efter en belägring på nästan tre månader.
July 1710: Juli 1710
After a siege of about eight months, with plague raging inside the walls, the capital of Livonia surrendered to Sheremetev.: Efter en belägring på omkring åtta månader, med pesten rasande innanför murarna, kapitulerade Livlands huvudstad för Sjeremetev.
Pernau: Pernau
August 1710: Augusti 1710
The Livonian port surrendered after a short siege.: Den livländska hamnstaden kapitulerade efter en kort belägring.
Reval: Reval
Autumn 1710: Hösten 1710
The capital of Estonia gave up after plague had ravaged the town and its garrison.: Estlands huvudstad gav upp sedan pesten härjat staden och dess garnison.
Stenbock: Stenbock
From his camp near Bender, Charles worked to bring the Ottoman Empire into the war, and late in 1710 it declared war on Russia. Peter marched into Moldavia, and in July 1711 a huge Ottoman army trapped him on the Pruth. To Charles’s fury, the grand vizier let the tsar go in return for giving back Azov.: Från sitt läger nära Bender arbetade Karl för att få in Osmanska riket i kriget, och i slutet av 1710 förklarade det Ryssland krig. Peter marscherade in i Moldavien, och i juli 1711 stängde en väldig osmansk armé in honom vid Prut. Till Karls raseri lät storvesiren tsaren gå mot att han lämnade tillbaka Azov.
In time the sultan wanted his troublesome guest gone. On 1 February 1713 Ottoman troops and Tatars stormed Charles’s house at Bender, a fight remembered as the Kalabalik. In the autumn of 1714 he finally left, riding in disguise across the Habsburg lands and Germany, and reached Stralsund in about two weeks, in November 1714.: Med tiden ville sultanen bli av med sin besvärlige gäst. Den 1 februari 1713 stormade osmanska trupper och tatarer Karls hus i Bender, en strid som gått till eftervärlden som kalabaliken. Hösten 1714 gav han sig slutligen av, red förklädd genom de habsburgska länderna och Tyskland och nådde Stralsund efter omkring två veckor, i november 1714.
Pruth campaign: Prutfälttåget
About 38,000 Russians against about 130,000 Ottomans: Omkring 38 000 ryssar mot omkring 130 000 osmaner
The ride home: Ritten hem
About 14 days and nights, autumn 1714: Omkring 14 dygn, hösten 1714
Bender and the Kalabalik: Bender och kalabaliken
Charles lived near this Ottoman fortress on the Dniester for more than three years. In February 1713 he and his small household fought off Ottoman troops for hours before he was captured.: Karl bodde i mer än tre år nära denna osmanska fästning vid Dnestr. I februari 1713 värjde han och hans lilla hovstat sig i timmar mot osmanska trupper innan han tillfångatogs.
July 1711: Juli 1711
Surrounded by a much larger Ottoman army, Peter had to make peace and hand back Azov, which Russia had won in 1696.: Omringad av en mycket större osmansk armé tvingades Peter sluta fred och lämna tillbaka Azov, som Ryssland hade erövrat 1696.
Arrival at Stralsund: Ankomsten till Stralsund
November 1714: November 1714
Charles and a single companion reached the gates of the Swedish fortress on a dark November night, filthy from the road.: Karl och en enda följeslagare nådde porten till den svenska fästningen en mörk novembernatt, smutsiga efter resan.
Peter: Peter
Charles rides home, 1714: Karl rider hem 1714
With Charles away, Danish, Saxon and Russian troops attacked Swedish Pomerania in 1711 and began a long blockade of Stralsund. In 1712 Denmark and Hanover occupied Bremen-Verden between them, and Stade surrendered to the Danes in September.: Medan Karl var borta anföll danska, sachsiska och ryska trupper Svenska Pommern 1711 och inledde en lång blockad av Stralsund. År 1712 ockuperade Danmark och Hannover tillsammans Bremen-Verden, och Stade kapitulerade för danskarna i september.
Magnus Stenbock crossed to Pomerania with a new army and on 20 December 1712 beat the Danes and Saxons at Gadebusch, the last great Swedish victory of the war. Pursued by Russian and Saxon forces, he burned the Danish town of Altona in January 1713 and took refuge in the Holstein-Gottorp fortress of Tönning, where he had to surrender on 16 May 1713. That autumn the Russians took Stettin and handed it to Prussia to hold.: Magnus Stenbock gick över till Pommern med en ny armé och slog den 20 december 1712 danskarna och sachsarna vid Gadebusch, krigets sista stora svenska seger. Förföljd av ryska och sachsiska styrkor brände han den danska staden Altona i januari 1713 och sökte skydd i den holstein-gottorpska fästningen Tönning, där han tvingades kapitulera den 16 maj 1713. Samma höst intog ryssarna Stettin och överlämnade det åt Preussen att hålla.
Gadebusch: Gadebusch
14,000 Swedes against 16,000 Danes and 3,000 Saxons: 14 000 svenskar mot 16 000 danskar och 3 000 sachsare
Died a prisoner in Copenhagen in 1717: Dog som fånge i Köpenhamn 1717
Stralsund: Stralsund
Blockaded on and off from 1711, the fortress held out for four years.: Fästningen, som blockerades med avbrott från 1711, höll ut i fyra år.
Stade: Stade
September 1712: September 1712
The Danes bombarded and took the capital of Bremen-Verden.: Danskarna bombarderade och intog Bremen-Verdens huvudstad.
Battle of Gadebusch: Slaget vid Gadebusch
20 December 1712: 20 december 1712
Stenbock attacked the Danish and Saxon army at Wakenstädt near Gadebusch and won decisively.: Stenbock anföll den danska och sachsiska armén vid Wakenstädt nära Gadebusch och vann en avgörande seger.
Altona burned: Altona bränns
January 1713: Januari 1713
Stenbock had the Danish town next to Hamburg burned down in midwinter, which badly damaged his reputation.: Stenbock lät bränna ned den danska staden intill Hamburg mitt i vintern, vilket skadade hans eftermäle svårt.
Surrender at Tönning: Kapitulationen i Tönning
16 May 1713: 16 maj 1713
Trapped by Danish, Russian and Saxon forces, Stenbock’s army surrendered to Frederick IV. Another Swedish field army was gone.: Instängd av danska, ryska och sachsiska styrkor kapitulerade Stenbocks armé för Fredrik IV. Ännu en svensk fältarmé var borta.
Stettin: Stettin
September 1713: September 1713
Taken by Russian and Saxon troops and then placed under Prussian control.: Intogs av ryska och sachsiska trupper och ställdes sedan under preussisk kontroll.
In May 1713 Peter’s galley fleet appeared off Helsingfors, and over the summer Russian troops occupied southern Finland, including Åbo. That August Carl Gustaf Armfeldt took command of a starving, ragged army.: I maj 1713 dök Peters galärflotta upp utanför Helsingfors, och under sommaren ockuperade ryska trupper södra Finland, däribland Åbo. I augusti samma år tog Carl Gustaf Armfeldt befälet över en svältande och trasig armé.
On 2 March 1714 the Russians under Mikhail Golitsyn crushed Armfeldt’s army at Storkyro in Ostrobothnia. That summer the Swedish fleet tried to block the coastal route at Hangö, but on 7 August 1714 Russian galleys slipped past and captured a squadron under Rear Admiral Nils Ehrenskiöld in the Battle of Gangut. Åland fell, and all of Finland stayed under Russian occupation until 1721, years Finns remember as the Great Wrath.: Den 2 mars 1714 krossade ryssarna under Michail Golitsyn Armfeldts armé vid Storkyro i Österbotten. Samma sommar försökte den svenska flottan spärra kustleden vid Hangö, men den 7 augusti 1714 tog sig ryska galärer förbi och erövrade en eskader under konteramiral Nils Ehrenskiöld i slaget vid Gangut (Rilax). Åland föll, och hela Finland förblev under rysk ockupation till 1721, år som finländarna minns som stora ofreden.
Storkyro: Storkyro
2 March 1714, the last land battle in Finland: 2 mars 1714, det sista landslaget i Finland
Finnish name for the occupation: Finskt namn på ockupationen
Isoviha, the Great Wrath (1714–1721): Isoviha, stora ofreden (1714–1721)
Helsingfors: Helsingfors
May 1713: Maj 1713
Peter’s galley fleet landed troops here, and the defenders were driven inland.: Peters galärflotta landsatte trupper här, och försvararna drevs inåt landet.
Åbo: Åbo
Autumn 1713: Hösten 1713
Finland’s chief town, seat of its bishop and university, was occupied.: Finlands främsta stad, säte för dess biskop och universitet, ockuperades.
Battle of Storkyro: Slaget vid Storkyro
2 March 1714: 2 mars 1714
Armfeldt’s outnumbered army was crushed, ending organised resistance in Finland.: Armfeldts underlägsna armé krossades, vilket gjorde slut på det organiserade motståndet i Finland.
Battle of Gangut: Slaget vid Gangut
7 August 1714: 7 augusti 1714
Russia’s first major naval victory, later celebrated as a “Poltava at sea”.: Rysslands första stora sjöseger, senare firad som ”ett Poltava till sjöss”.
Åland: Åland
August 1714: Augusti 1714
After Gangut the Russians occupied the islands, within striking distance of Stockholm.: Efter Gangut ockuperade ryssarna öarna, inom räckhåll för Stockholm.
Galley fleet: Galärflottan
Golitsyn: Golitsyn
Charles found new enemies waiting. Prussia, already holding Stettin, and Hanover, whose elector was now King George I of Great Britain and had been promised Bremen-Verden by Denmark, both declared war on Sweden in 1715.: Nya fiender väntade på Karl. Preussen, som redan höll Stettin, och Hannover, vars kurfurste nu var kung Georg I av Storbritannien och som av Danmark hade blivit lovat Bremen-Verden, förklarade båda Sverige krig 1715.
From July 1715 an allied army of some 55,000 besieged Stralsund, held by about 11,500 men. On 16 November Prussian, Danish and Saxon troops landed on Rügen at Stresow, and Charles’s counterattack failed. He escaped by boat just before Christmas and the town surrendered. Wismar, Sweden’s last foothold in Germany, fell in April 1716.: Från juli 1715 belägrade en allierad armé på omkring 55 000 man Stralsund, som försvarades av omkring 11 500 man. Den 16 november landsteg preussiska, danska och sachsiska trupper på Rügen vid Stresow, och Karls motanfall misslyckades. Han flydde med båt strax före jul och staden kapitulerade. Wismar, Sveriges sista fäste i Tyskland, föll i april 1716.
Allied army: Allierad armé
55,000–58,000 men: 55 000–58 000 man
Swedish garrison: Svensk garnison
About 11,500 men: Omkring 11 500 man
Usedom: Usedom
April – August 1715: April – augusti 1715
Charles seized the island in a pre-emptive strike in April, but the Prussians took it back in the summer.: Karl tog ön i ett förebyggande anfall i april, men preussarna återtog den under sommaren.
Battle of Rügen: Sjöslaget vid Rügen
August 1715: Augusti 1715
The Swedish and Danish fleets clashed off Rügen without a clear winner.: Den svenska och den danska flottan drabbade samman utanför Rügen utan klar segrare.
Landing at Stresow: Landstigningen vid Stresow
16 November 1715: 16 november 1715
Allied troops came ashore on Rügen. Charles attacked them at once with about 2,000 men and was beaten back.: Allierade trupper gick i land på Rügen. Karl anföll dem genast med omkring 2 000 man och slogs tillbaka.
Stralsund falls: Stralsund faller
December 1715: December 1715
With Rügen lost the town could not hold. Charles slipped out by boat, and the whole garrison went into captivity.: Sedan Rügen gått förlorat kunde staden inte hålla stånd. Karl tog sig ut med båt, och hela garnisonen gick i fångenskap.
Wismar: Wismar
April 1716: April 1716
Danish, Hanoverian and Prussian troops took Sweden’s last German town.: Danska, hannoveranska och preussiska trupper intog Sveriges sista tyska stad.
Back in Sweden, Charles attacked Norway to strike at Denmark. He crossed the border in March 1716 and briefly occupied Christiania, but could not take Akershus fortress. An assault on Fredrikshald failed, and on 8 July Tordenskjold destroyed the Swedish supply fleet at Dynekilen, ending the campaign.: Tillbaka i Sverige anföll Karl Norge för att slå mot Danmark. Han gick över gränsen i mars 1716 och ockuperade kortvarigt Christiania men kunde inte inta Akershus fästning. En stormning av Fredrikshald misslyckades, och den 8 juli förstörde Tordenskjold den svenska förrådsflottan vid Dynekilen, vilket gjorde slut på fälttåget.
In the autumn of 1718 Charles invaded again with about 36,000 men in three armies and besieged Fredriksten. On the evening of 11 December 1718, while inspecting the siege trenches, he was shot through the head. Further north, Carl Gustaf Armfeldt had failed to take Trondheim. Ordered home, his army was caught by a blizzard in the Tydal mountains in January 1719, and thousands froze to death.: Hösten 1718 invaderade Karl på nytt med omkring 36 000 man i tre arméer och belägrade Fredriksten. På kvällen den 11 december 1718, medan han inspekterade belägringslöpgravarna, sköts han genom huvudet. Längre norrut hade Carl Gustaf Armfeldt misslyckats med att inta Trondheim. Hans armé, som beordrats hem, överraskades av en snöstorm i Tydalsfjällen i januari 1719, och tusentals frös ihjäl.
Charles XII killed: Karl XII stupar
11 December 1718, aged 36: 11 december 1718, 36 år gammal
The death march: Dödsmarschen
About 3,000 of Armfeldt’s men died: Omkring 3 000 av Armfeldts män dog
Christiania: Christiania
March – April 1716: Mars – april 1716
The Swedes held the town for some weeks, but Akershus fortress held out and they withdrew.: Svenskarna höll staden i några veckor, men Akershus fästning höll stånd och de drog sig tillbaka.
Fredriksten: Fredriksten
1716 and 1718: 1716 och 1718
The fortress above Fredrikshald beat off the Swedes in 1716. During the second siege Charles XII was killed in the trenches on 11 December 1718, and his army went home.: Fästningen ovanför Fredrikshald slog tillbaka svenskarna 1716. Under den andra belägringen stupade Karl XII i löpgravarna den 11 december 1718, och hans armé vände hem.
Battle of Dynekilen: Slaget vid Dynekilen
8 July 1716: 8 juli 1716
Peter Tordenskjold sailed into the narrow fjord and captured or destroyed most of the Swedish transport ships supplying the army.: Peter Tordenskjold seglade in i den smala fjorden och erövrade eller förstörde de flesta av de svenska transportfartyg som försörjde armén.
Trondheim: Trondheim
Autumn 1718: Hösten 1718
Armfeldt’s army of about 10,000 advanced on the city but could not take it.: Armfeldts armé på omkring 10 000 man ryckte fram mot staden men kunde inte inta den.
The Carolean Death March: Karolinernas dödsmarsch
January 1719: Januari 1719
Retreating across the mountains toward Jämtland, Armfeldt’s men were caught by a storm. Thousands froze to death.: Under återtåget över fjällen mot Jämtland överraskades Armfeldts män av en storm. Tusentals frös ihjäl.
Charles XII, 1716: Karl XII 1716
Tordenskjold: Tordenskjold
Armfeldt: Armfeldt
After Charles’s death Sweden made peace with Hanover, Prussia and Denmark, but Russia kept up the pressure to force it to give up the Baltic provinces. In the summer of 1719 Russian galleys landed troops along the coasts of Uppland and Södermanland, burning towns, manors and ironworks from near Gävle down to Norrköping. A thrust toward Stockholm was stopped at Stäket in August.: Efter Karls död slöt Sverige fred med Hannover, Preussen och Danmark, men Ryssland fortsatte att sätta press för att tvinga landet att avstå Östersjöprovinserna. Sommaren 1719 landsatte ryska galärer trupper längs kusterna i Uppland och Södermanland och brände städer, herrgårdar och bruk från trakten av Gävle ned till Norrköping. En stöt mot Stockholm hejdades vid Stäket i augusti.
A British fleet came to Sweden’s aid in 1720 but could not stop the galleys. Russian troops burned Umeå that year, and in 1721 Sundsvall, Härnösand, Hudiksvall, Söderhamn and Piteå. Among the islands of Åland, Russian galleys defeated a Swedish squadron at Grengam in August 1720. On the west coast, Tordenskjold had taken Marstrand in 1719.: En brittisk flotta kom Sverige till hjälp 1720 men kunde inte stoppa galärerna. Ryska trupper brände Umeå det året och 1721 Sundsvall, Härnösand, Hudiksvall, Söderhamn och Piteå. I Ålands skärgård besegrade ryska galärer en svensk eskader vid Grengam i augusti 1720. På västkusten hade Tordenskjold intagit Marstrand 1719.
Swedish name: Svenskt namn
Rysshärjningarna, the Russian ravages: Rysshärjningarna
Towns burned: Brända städer
Norrköping, Södertälje, Umeå, Sundsvall, Härnösand, Piteå and others: Norrköping, Södertälje, Umeå, Sundsvall, Härnösand, Piteå med flera
Norrköping: Norrköping
