The Swedish fort at the mouth of the Neva fell after a few days. Within weeks Peter laid the foundations of the Peter and Paul Fortress nearby, the start of his new city.: Den svenska skansen vid Nevas mynning föll efter några dagar. Inom några veckor lade Peter grunden till Peter-Paulfästningen i närheten, början på hans nya stad.
