Siege of Thorn: Belägringen av Thorn
May – October 1703: Maj – oktober 1703
The Saxon garrison of the fortress on the Vistula surrendered after nearly five months.: Den sachsiska garnisonen i fästningen vid Weichsel kapitulerade efter nästan fem månader.
With the main army in Poland, small Swedish forces had to hold the Baltic provinces. Russian armies under Boris Sheremetev beat Wolmar Anton von Schlippenbach at Erastfer in January 1702 and at Hummelshof that July, then laid waste to much of Livonia and Estonia.: Med huvudarmén i Polen fick små svenska styrkor försvara Östersjöprovinserna. Ryska arméer under Boris Sjeremetev slog Wolmar Anton von Schlippenbach vid Erastfer i januari 1702 och vid Hummelshof i juli samma år och ödelade sedan stora delar av Livland och Estland.
Peter the Great’s real goal was the sea. In October 1702 he took Nöteborg, where the Neva leaves Lake Ladoga, and in May 1703 Nyenskans near its mouth. On 27 May 1703 he founded St Petersburg there. In the summer of 1704 the Russians stormed Dorpat and then Narva, the town they had failed to take four years before.: Peter den stores verkliga mål var havet. I oktober 1702 intog han Nöteborg, där Neva rinner ut ur Ladoga, och i maj 1703 Nyenskans nära flodens mynning. Den 27 maj 1703 grundade han Sankt Petersburg där. Sommaren 1704 stormade ryssarna Dorpat och sedan Narva, den stad de hade misslyckats med att inta fyra år tidigare.
