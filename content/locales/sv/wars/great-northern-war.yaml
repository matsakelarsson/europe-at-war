Charles XII’s first battle. About 4,900 Swedes stormed ashore against some 700 defenders, a day’s march from Copenhagen.: Karl XII:s första strid. Omkring 4 900 svenskar stormade i land mot ungefär 700 försvarare, en dagsmarsch från Köpenhamn.
