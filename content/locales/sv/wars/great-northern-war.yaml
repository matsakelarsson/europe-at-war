Kept: Behölls
Finland, Wismar, and Pomerania north of the Peene: Finland, Wismar och Pommern norr om Peene
Treaties of Stockholm: Freden i Stockholm
Peace with Hanover in November 1719 and with Prussia in February 1720. Hanover paid 1 million riksdaler and Prussia 2 million thalers.: Fred med Hannover i november 1719 och med Preussen i februari 1720. Hannover betalade 1 miljon riksdaler och Preussen 2 miljoner thaler.
Treaty of Frederiksborg: Freden i Frederiksborg
July 1720: Juli 1720
Peace with Denmark–Norway, named after the castle at Hillerød. Sweden also stopped backing the Duke of Holstein-Gottorp, whose part of Schleswig Denmark kept.: Fred med Danmark–Norge, uppkallad efter slottet i Hillerød. Sverige upphörde också att stödja hertigen av Holstein-Gottorp, vars del av Slesvig Danmark behöll.
Treaty of Nystad: Freden i Nystad
10 September 1721: 10 september 1721
Signed in a small town on the Finnish coast. Russia kept its conquests on the eastern Baltic and handed back the rest of Finland within weeks.: Undertecknad i en liten stad på den finländska kusten. Ryssland behöll sina erövringar längs Östersjöns östra kust och lämnade tillbaka resten av Finland inom några veckor.
Lost by Sweden in this peace: Förlorat av Sverige vid denna fred
