Also called the Saxon Rebellion or Saxon War. The main narrative, by Lambert of Hersfeld, is hostile to Henry IV; Bruno’s Saxon War is openly partisan for the rebels.: Kallas även Sachsiska upproret eller Sachsiska kriget. Huvudberättelsen, av Lambert av Hersfeld, är fientlig mot Henrik IV; Brunos Sachsiska kriget tar öppet parti för upprorsmännen.
The surrender at Spier near Sondershausen on 27 October 1075 came just as the quarrel with Pope Gregory VII began. The Saxons rose again in 1077 and backed the anti-kings Rudolf of Rheinfelden and Hermann of Salm, a war usually treated as part of the Investiture Controversy.: Kapitulationen vid Spier nära Sondershausen den 27 oktober 1075 kom just som striden med påven Gregorius VII inleddes. Sachsarna reste sig igen 1077 och stödde motkungarna Rudolf av Rheinfelden och Hermann av Salm, ett krig som vanligen räknas som en del av investiturstriden.
