Great Saxon Revolt: Stora sachsiska upproret
A rising of the Saxon nobles and peasants, led by Otto of Northeim and Bishop Burchard II of Halberstadt, against King Henry IV, whose castles around the Harz and their garrisons of Swabian ministeriales were resented as an occupation. Henry escaped from the besieged Harzburg in August 1073 and had to agree to slight his castles at Gerstungen in February 1074, but when peasants razed the Harzburg and desecrated the royal graves there, the princes rallied to him. He crushed the Saxon army at Homburg on the Unstrut, near Langensalza, on 9 June 1075, and the Saxon leaders surrendered unconditionally that October.: Ett uppror bland sachsiska adelsmän och bönder, lett av Otto av Northeim och biskop Burchard II av Halberstadt, mot kung Henrik IV, vars borgar kring Harz med garnisoner av schwabiska ministerialer uppfattades som en ockupation. Henrik flydde från det belägrade Harzburg i augusti 1073 och tvingades i februari 1074 i Gerstungen gå med på att rasera sina borgar, men när bönder jämnade Harzburg med marken och skändade de kungliga gravarna där slöt furstarna upp bakom honom. Han krossade den sachsiska hären vid Homburg vid Unstrut, nära Langensalza, den 9 juni 1075, och de sachsiska ledarna kapitulerade villkorslöst i oktober samma år.
