The Knights of St John, driven from Rhodes by the Ottomans in 1522, had held Malta since 1530, and their galleys preyed on Muslim shipping. In 1565 Sultan Suleiman sent a fleet of about 200 ships under Piyale Pasha with an army under Mustafa Pasha, perhaps 30,000 or more fighting men. Grand Master Jean de Valette had about 500 knights and some 6,000 soldiers, Maltese militia, Spanish and Italian troops, behind the walls of Birgu and Senglea, two promontories on the Grand Harbour, with Fort St Elmo guarding its mouth.: Johanniterriddarna, som osmanerna drivit från Rhodos 1522, hade innehaft Malta sedan 1530, och deras galärer jagade muslimsk sjöfart. År 1565 sände sultan Süleyman en flotta på omkring 200 fartyg under Piyale pasha med en här under Mustafa pasha, kanske 30 000 stridande man eller fler. Stormästaren Jean de Valette hade omkring 500 riddare och ungefär 6 000 soldater, maltesisk milis samt spanska och italienska trupper, bakom murarna i Birgu och Senglea, två uddar vid Grand Harbour, med Fort St Elmo som vaktade inloppet.
The fleet anchored at Marsaxlokk, and the Ottomans chose to take St Elmo first, to open Marsamxett harbour to their ships. From late May guns on Mount Sciberras pounded the small fort to rubble, but Valette ferried in fresh men each night. The corsair Turgut Reis (Dragut) was mortally wounded by a cannon shot. St Elmo fell on 23 June; almost all of its more than 1,500 defenders were killed, and the Ottomans had lost perhaps 6,000 men. Mustafa is said to have floated the bodies of knights across the harbour, and Valette to have answered by firing the heads of Turkish prisoners from his guns.: Flottan ankrade vid Marsaxlokk, och osmanerna valde att först inta St Elmo för att öppna hamnen Marsamxett för sina fartyg. Från slutet av maj sköt kanoner på Mount Sciberras det lilla fortet i spillror, men Valette färjade över nya män varje natt. Korsaren Turgut Reis (Dragut) blev dödligt sårad av ett kanonskott. St Elmo föll den 23 juni; nästan alla dess fler än 1 500 försvarare dödades, och osmanerna hade förlorat kanske 6 000 man. Mustafa ska ha låtit riddarnas lik flyta över hamnen, och Valette ska ha svarat med att skjuta ut huvudena av turkiska fångar ur sina kanoner.
