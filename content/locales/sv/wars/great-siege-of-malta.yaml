Great Siege of Malta: Stora belägringen av Malta
The Ottoman attempt to take Malta from the Knights of St John in 1565. A large Ottoman army besieged the knights, the Maltese and their Spanish and Italian soldiers for nearly four months, taking Fort St Elmo at great cost but failing against Birgu and Senglea, until a relief army from Sicily landed in September and the invaders sailed away.: Osmanernas försök 1565 att ta Malta från johanniterorden. En stor osmansk här belägrade riddarna, malteserna och deras spanska och italienska soldater i nästan fyra månader. Den intog Fort St Elmo till ett högt pris men misslyckades mot Birgu och Senglea, tills en undsättningshär från Sicilien landsteg i september och angriparna seglade bort.
