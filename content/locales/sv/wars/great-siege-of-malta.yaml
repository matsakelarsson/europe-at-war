The two fortified towns, with Fort St Angelo and Fort St Michael, withstood four months of bombardment and assaults; at the end they were largely in ruins.: De två befästa städerna, med Fort St Angelo och Fort St Michael, stod emot fyra månaders beskjutning och stormningar; till slut låg de till stor del i ruiner.
Marsa: Marsa
Cavalry from Mdina under Vincenzo Anastagi attacked the lightly guarded Ottoman camp and field hospital, killing the sick and wounded, and broke off the great assault.: Kavalleri från Mdina under Vincenzo Anastagi angrep det glest bevakade osmanska lägret och fältsjukhuset, dödade de sjuka och sårade och fick den stora stormningen att avbrytas.
early September 1565: början av september 1565
When the Ottomans marched on the old capital, its guns opened fire at long range, a bluff that made it seem well supplied, and they turned back.: När osmanerna tågade mot den gamla huvudstaden öppnade dess kanoner eld på långt avstånd, en bluff som fick staden att verka väl försedd, och de vände tillbaka.
The great relief: Den stora undsättningen
García de Toledo’s relief army, the Gran Soccorso, landed unopposed in the north of the island and marched inland to Mdina.: García de Toledos undsättningshär, Gran Soccorso, landsteg utan motstånd på öns norra del och tågade inåt landet till Mdina.
