Dates are Julian, as usual for the period. In Malta the end of the siege is celebrated on 8 September, the day the Ottomans began to embark; their last attack came on 11 September, and their forces had left the islands by 13 September.: Datumen följer, som vanligt för perioden, den julianska kalendern. På Malta firas belägringens slut den 8 september, dagen då osmanerna började gå ombord; deras sista anfall kom den 11 september, och deras styrkor hade lämnat öarna den 13 september.
The size of the Ottoman army is uncertain. One knight who fought in the siege, Francisco Balbi di Correggio, counted about 48,000; letters written during the siege give 22,000 or fewer, and most historians suggest 30,000–40,000 including sailors.: Den osmanska härens storlek är osäker. En riddare som deltog i belägringen, Francisco Balbi di Correggio, räknade till omkring 48 000; brev skrivna under belägringen anger 22 000 eller färre, och de flesta historiker föreslår 30 000–40 000 inklusive sjömän.
The Knights Hospitaller, a military religious order, held Malta from 1530 as a fief of the Kingdom of Sicily, paying a yearly falcon to its king. The new capital, Valletta, is named after Grand Master Jean de Valette.: Johanniterorden, en andlig riddarorden, innehade Malta från 1530 som län under kungariket Sicilien och betalade en årlig falk till dess kung. Den nya huvudstaden Valletta är uppkallad efter stormästaren Jean de Valette.
