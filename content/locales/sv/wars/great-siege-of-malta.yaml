The Ottoman fleet anchored in this bay in the south-east of the island. The army set up its main camp at Marsa, at the head of the Grand Harbour.: Den osmanska flottan ankrade i denna vik på öns sydöstra sida. Hären slog upp sitt huvudläger vid Marsa, i inre änden av Grand Harbour.
The star-shaped fort at the tip of Mount Sciberras held for a month against continuous bombardment and repeated assaults. Nine knights were taken alive by corsairs.: Det stjärnformade fortet på spetsen av Mount Sciberras höll ut i en månad mot oavbruten beskjutning och upprepade stormningar. Nio riddare togs levande av korsarer.
Birgu and Senglea: Birgu och Senglea
May–June 1565: Maj–juni 1565
Valette directed the defence from Birgu, at the foot of Fort St Angelo, and sent men across the harbour to St Elmo by night.: Valette ledde försvaret från Birgu, vid foten av Fort St Angelo, och skickade nattetid män över hamnen till St Elmo.
Mdina: Mdina
The old walled capital in the centre of the island stayed in Maltese and Christian hands, and its cavalry raided the Ottoman lines.: Den gamla befästa huvudstaden mitt på ön förblev i maltesiska och kristna händer, och dess kavalleri gjorde räder mot de osmanska linjerna.
Piyale Pasha: Piyale pasha
Turgut Reis: Turgut Reis
Next the Ottomans turned on Birgu and Senglea, ringing them with some 65 guns. A small relief of about 600 men slipped into Birgu in early July. On 15 July Mustafa sent boats, dragged overland into the Grand Harbour, against Senglea, while corsairs stormed Fort St Michael; a battery hidden at the foot of Fort St Angelo sank most of the boats. On 7 August, with the walls breached, a great double assault was close to success when cavalry from Mdina fell on the Ottoman camp at Marsa, and the attackers, thinking a relief army had come, drew back.: Därefter vände sig osmanerna mot Birgu och Senglea och omringade dem med omkring 65 kanoner. En liten undsättning på omkring 600 man tog sig in i Birgu i början av juli. Den 15 juli sände Mustafa båtar, som släpats över land in i Grand Harbour, mot Senglea, medan korsarer stormade Fort St Michael; ett dolt batteri vid foten av Fort St Angelo sänkte de flesta båtarna. Den 7 augusti, med murarna genombrutna, var en stor dubbel stormning nära att lyckas när kavalleri från Mdina föll över det osmanska lägret vid Marsa, och angriparna, som trodde att en undsättningshär hade kommit, drog sig tillbaka.
Through August the defenders beat off assaults, mines and siege towers. Valette, about seventy, fought in the breach himself and refused to abandon the towns for Fort St Angelo. On 7 September García de Toledo, viceroy of Sicily, landed about 8,000 men in the north of the island. The Ottomans began to embark, turned back to attack the relief army, were routed near St Paul’s Bay on 11 September and sailed away. About a third of the knights and of Malta’s people had died; the Ottomans had lost perhaps 25,000 or more. In March 1566 Valette laid the first stone of a new fortified city on Mount Sciberras, Valletta.: Under hela augusti slog försvararna tillbaka stormningar, minor och belägringstorn. Valette, omkring sjuttio år gammal, stred själv i bräschen och vägrade att överge städerna för Fort St Angelo. Den 7 september landsatte García de Toledo, vicekung av Sicilien, omkring 8 000 man på öns norra del. Osmanerna började gå ombord, vände tillbaka för att angripa undsättningshären, drevs på flykten nära St Paul’s Bay den 11 september och seglade bort. Omkring en tredjedel av riddarna och av Maltas befolkning hade dött; osmanerna hade förlorat kanske 25 000 man eller fler. I mars 1566 lade Valette grundstenen till en ny befäst stad på Mount Sciberras, Valletta.
