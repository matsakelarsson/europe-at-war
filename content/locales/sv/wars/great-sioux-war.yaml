# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
Great Sioux War of 1876: Stora siouxkriget 1876
? The war of 1876–1877 in which the United States took the Black Hills from the Lakota and forced the free bands of the Lakota and Northern Cheyenne onto reservations. The Treaty of Fort Laramie of 1868 had given the Lakota the Great Sioux Reservation, including the Black Hills (Paha Sapa), which are sacred to them, and left the Powder River country beyond it as unceded Indian territory. After George Armstrong Custer’s expedition of 1874 found gold in the Black Hills, thousands of miners poured in, the Lakota refused to sell, and President Grant’s government ordered all Lakota to come in to the agencies by 31 January 1876 and turned those who did not over to the army. Bands following Sitting Bull and Crazy Horse, joined by many from the agencies, gathered in the largest camp the northern plains had known. Three army columns converged on them; the Lakota and Cheyenne fought George Crook’s column to a standstill on the Rosebud on 17 June 1876, and on 25 June at the Little Bighorn they destroyed Custer and five companies of the 7th Cavalry, killing 268 soldiers, scouts and civilians in all. The army, heavily reinforced, then campaigned through the winter, destroying villages and food at Slim Buttes, the Red Fork of the Powder River and elsewhere, while Congress cut off the agencies’ rations until the Lakota gave up the Black Hills, which it annexed on 28 February 1877. Crazy Horse surrendered in May 1877 and was killed at Camp Robinson in September; Sitting Bull led his people to Canada and surrendered in 1881. In 1980 the Supreme Court ruled that the Black Hills had been taken illegally; the Lakota have refused the compensation and ask for the land.
: Kriget 1876–1877 där USA tog Black Hills från lakota och tvingade de fria grupperna av lakota och nordcheyenner att flytta in på reservat. Fördraget i Fort Laramie 1868 hade gett lakota Stora siouxreservatet, inklusive Black Hills (Paha Sapa), som är heliga för dem, och lämnat Powder River-landet utanför reservatet som icke avträtt indianskt territorium. Sedan George Armstrong Custers expedition 1874 hade funnit guld i Black Hills strömmade tusentals gruvletare in, lakota vägrade sälja, och president Grants regering beordrade alla lakota att infinna sig vid agenturerna senast den 31 januari 1876 och överlämnade dem som inte gjorde det åt armén. Grupper som följde Sitting Bull och Crazy Horse, förstärkta av många från agenturerna, samlades i det största läger som de norra prärierna hade skådat. Tre armékolonner ryckte fram mot dem; lakota och cheyenner stoppade George Crooks kolonn i ett oavgjort slag vid Rosebud den 17 juni 1876, och den 25 juni vid Little Bighorn förintade de Custer och fem kompanier ur 7:e kavalleriregementet och dödade sammanlagt 268 soldater, spanare och civila. Armén, kraftigt förstärkt, förde sedan fälttåg under hela vintern och förstörde byar och livsmedel vid Slim Buttes, vid Red Fork av Powder River och på andra platser, medan kongressen stoppade agenturernas ransoner tills lakota gav upp Black Hills, som kongressen annekterade den 28 februari 1877. Crazy Horse gav upp i maj 1877 och dödades i Camp Robinson i september; Sitting Bull ledde sitt folk till Kanada och gav upp 1881. År 1980 slog Högsta domstolen fast att Black Hills hade tagits olagligt; lakota har vägrat ta emot ersättningen och begär att få landet tillbaka.
