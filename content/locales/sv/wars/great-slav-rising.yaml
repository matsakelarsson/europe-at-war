Great Slav Rising: Stora slaviska upproret
A rising of the pagan Polabian Slavs between the Elbe and the Oder, led by the Lutici and joined by the Obotrites, against the German rule and Christian mission imposed on them by Henry I and Otto I. In 983, while Otto II was in Italy after his defeat at Stilo, they destroyed the bishops’ seats of Havelberg and Brandenburg and sacked Hamburg; the Northern March and the Billung March were lost, and German expansion east of the Elbe stopped for more than 150 years.: Ett uppror bland de hedniska polabiska slaverna mellan Elbe och Oder, lett av liutizerna och med obodriterna som anslöt sig, mot det tyska styre och den kristna mission som Henrik I och Otto I hade påtvingat dem. År 983, medan Otto II befann sig i Italien efter sitt nederlag vid Stilo, förstörde de biskopssätena Havelberg och Brandenburg och plundrade Hamburg. Nordmark och Billungska marken gick förlorade, och den tyska expansionen öster om Elbe avstannade i mer än 150 år.
