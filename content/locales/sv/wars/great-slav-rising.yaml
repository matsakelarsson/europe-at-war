Also called the Slavic revolt of 983. The main source is the chronicle of Thietmar of Merseburg, written a generation later. Havelberg was taken on 29 June 983 and Brandenburg three days later.: Kallas även Slaviska upproret 983. Huvudkällan är Thietmar av Merseburgs krönika, skriven en generation senare. Havelberg intogs den 29 juni 983 och Brandenburg tre dagar senare.
Saxon campaigns in the following years, some of them with the Polish dukes Mieszko I and Bolesław I, failed to win the land back; the bishoprics of Havelberg and Brandenburg existed only in name until the 12th century.: Sachsiska fälttåg under de följande åren, en del av dem tillsammans med de polska hertigarna Mieszko I och Bolesław I, lyckades inte återvinna landet; biskopsdömena Havelberg och Brandenburg existerade bara till namnet fram till 1100-talet.
