Dates are Julian (Old Style). The Russian sources disagree on many details, and the size of both armies is unknown.: Datumen följer den julianska kalendern (gamla stilen). De ryska källorna går isär i många detaljer, och storleken på båda härarna är okänd.
The Great Horde was the core of the old Golden Horde on the lower Volga, after the Kazan, Crimean and other khanates had broken away. Moscow was allied with the Crimean khan Mengli Giray, and Akhmat with King Casimir IV of Poland and Lithuania, whose lands then began just west of the Ugra.: Stora horden var kärnan i den gamla Gyllene horden vid nedre Volga, sedan Kazan, Krim och andra khanat hade brutit sig loss. Moskva var allierat med krimkhanen Mengli Giray, och Achmat med kung Kasimir IV av Polen och Litauen, vars länder då började strax väster om Ugra.
