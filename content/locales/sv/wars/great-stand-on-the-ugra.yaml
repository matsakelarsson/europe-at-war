For a month the two armies watched each other across the river while envoys came and went. Ivan made peace with his brothers, whose troops came to join him, and sent the exiled Crimean prince Nur Devlet and Prince Vasily Nozdrovaty down the Volga to raid the Horde’s lands behind Akhmat. Archbishop Vassian of Rostov urged Ivan in a famous letter to stand firm. As the river began to freeze and could no longer stop cavalry, Ivan pulled his troops back on 26 October to Kremenets and then to Borovsk, where they could cover Moscow and strike wherever the Tatars crossed.: I en månad iakttog de båda härarna varandra över floden medan sändebud kom och gick. Ivan slöt fred med sina bröder, vars trupper anslöt sig till honom, och sände den landsflyktige krimtatariske prinsen Nur Devlet och furst Vasilij Nozdrovatyj nedför Volga för att plundra hordens länder bakom Achmat. Ärkebiskop Vassian av Rostov uppmanade i ett berömt brev Ivan att stå fast. När floden började frysa och inte längre kunde hejda kavalleri drog Ivan den 26 oktober tillbaka sina trupper till Kremenets och sedan till Borovsk, där de kunde skydda Moskva och slå till var tatarerna än tog sig över.
Akhmat did not follow. With winter coming, his horses short of fodder and no sign of Casimir, he began to withdraw on 8 November, plundering a dozen Lithuanian towns, among them Mtsensk, on his way. Ivan returned to Moscow on 28 November. On 6 January 1481 Akhmat was killed in the steppe by Ibak, khan of Tyumen, and the Nogais. No khan again claimed a say over who ruled in Moscow, and Russian historians have long dated the end of the “Tatar yoke” to the Ugra, though some modern historians think the standoff itself changed little.: Achmat följde inte efter. Med vintern i antågande, brist på foder åt hästarna och inga tecken på Kasimir började han den 8 november dra sig tillbaka och plundrade på vägen ett dussin litauiska städer, bland dem Mtsensk. Ivan återvände till Moskva den 28 november. Den 6 januari 1481 dödades Achmat på stäppen av Ibak, khan av Tiumen, och nogajerna. Ingen khan gjorde därefter anspråk på att bestämma vem som styrde i Moskva, och ryska historiker har länge daterat slutet på ”tataroket” till Ugra, även om vissa moderna historiker anser att själva konfrontationen förändrade föga.
