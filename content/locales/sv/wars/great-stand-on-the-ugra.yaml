Great Stand on the Ugra: Stora ståndet vid Ugra
A standoff in the autumn of 1480 between Ivan III of Moscow and Khan Akhmat of the Great Horde, who had marched north to restore the Horde’s overlordship. After failing to cross the Ugra river, Akhmat waited in vain for his Lithuanian allies and withdrew in November; the event is traditionally seen as the end of Mongol rule over Russia.: En konfrontation hösten 1480 mellan Ivan III av Moskva och khan Achmat av Stora horden, som hade marscherat norrut för att återupprätta hordens överhöghet. Sedan han misslyckats med att ta sig över floden Ugra väntade Achmat förgäves på sina litauiska allierade och drog sig tillbaka i november. Händelsen ses traditionellt som slutet på det mongoliska väldet över Ryssland.
