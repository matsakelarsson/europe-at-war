Ivan III of Moscow had stopped paying tribute to the Horde in the 1470s and allied with the Crimean khan, Mengli Giray. Khan Akhmat of the Great Horde allied in turn with Casimir IV of Poland and Lithuania, and in 1480, while Ivan was quarrelling with two of his brothers, he led north what may have been the largest Tatar army of the century. Ivan held the line of the Oka, the river that had long been Moscow’s southern frontier, with his son Ivan the Young at Serpukhov and himself at Kolomna.: Ivan III av Moskva hade slutat betala tribut till horden på 1470-talet och allierat sig med krimkhanen Mengli Giray. Khan Achmat av Stora horden allierade sig i sin tur med Kasimir IV av Polen och Litauen, och 1480, medan Ivan låg i strid med två av sina bröder, ledde han norrut vad som kan ha varit århundradets största tatariska här. Ivan höll linjen längs Oka, den flod som länge varit Moskvas sydgräns, med sin son Ivan den unge i Serpuchov och sig själv i Kolomna.
Akhmat did not try the Oka but moved west between the upper Don and the Oka, towards the mouth of the Ugra near Kaluga, hoping to meet Casimir’s army. Casimir never came; he was tied down by a Crimean raid on Podolia and unrest at home. Ivan sent his treasury and family north to Beloozero and set up his headquarters at Kremenets, behind the Ugra. On 8 October the Tatars tried to force a crossing near the river’s mouth. For four days they were driven back by Russian guns and arrows, and a later attempt to cross upstream at Opakov was also blocked.: Achmat försökte inte ta sig över Oka utan drog västerut mellan övre Don och Oka, mot Ugras mynning nära Kaluga, i hopp om att möta Kasimirs här. Kasimir kom aldrig; han var bunden av ett krimtatariskt plundringståg mot Podolien och oroligheter i hemlandet. Ivan sände sin skattkammare och sin familj norrut till Beloozero och upprättade sitt högkvarter i Kremenets, bakom Ugra. Den 8 oktober försökte tatarerna tvinga sig över floden nära dess mynning. I fyra dagar drevs de tillbaka av ryska kanoner och pilar, och ett senare försök att ta sig över längre uppströms vid Opakov blockerades också.
