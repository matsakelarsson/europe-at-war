In 1688 the Elector of Bavaria crossed the Sava and took Belgrade by storm on 6 September. Weeks later Louis XIV invaded the Rhineland, and many imperial troops were sent west. Even so, in 1689 Louis William of Baden beat the Ottomans at Batočina and at Niš on 24 September and took Vidin. General Enea Silvio Piccolomini pushed on into Kosovo and Macedonia with a small force, joined by Serbian and Albanian volunteers and by the rising of the outlaw Karposh around Kumanovo. In late October Piccolomini burned Skopje, reportedly for fear of plague, and in November he died of plague at Prizren.: År 1688 gick kurfursten av Bayern över Sava och tog Belgrad med storm den 6 september. Några veckor senare invaderade Ludvig XIV Rhenlandet, och många kejserliga trupper sändes västerut. Ändå slog Ludwig Wilhelm av Baden 1689 osmanerna vid Batočina och vid Niš den 24 september och intog Vidin. General Enea Silvio Piccolomini trängde med en liten styrka vidare in i Kosovo och Makedonien, förstärkt av serbiska och albanska frivilliga och av den fredlöse Karposjs uppror kring Kumanovo. I slutet av oktober brände Piccolomini Skopje, enligt uppgift av rädsla för pest, och i november dog han själv i pest i Prizren.
The new grand vizier, Fazıl Mustafa Pasha, struck back. On 2 January 1690 an Ottoman and Tatar army destroyed the imperial and Serbian force at Kačanik, and Christian villages suffered harsh reprisals. In 1690 the Ottomans retook Niš and, on 8 October, Belgrade, after its powder magazine exploded. Thousands of Serbs, with some Albanians, fled north with Patriarch Arsenije III of Peć and settled in Habsburg Hungary, where Leopold I granted them church autonomy. Arsenije wrote of more than 30,000 people; Serbian tradition speaks of 37,000 families. How far this Great Migration changed the population of Kosovo is still debated by Serbian and Albanian historians.: Den nye storvesiren, Fazıl Mustafa pasha, slog tillbaka. Den 2 januari 1690 förintade en osmansk och tatarisk armé den kejserliga och serbiska styrkan vid Kačanik, och kristna byar drabbades av hårda repressalier. År 1690 återtog osmanerna Niš och, den 8 oktober, Belgrad, sedan dess krutmagasin exploderat. Tusentals serber, och en del albaner, flydde norrut med patriarken Arsenije III av Peć och bosatte sig i det habsburgska Ungern, där Leopold I gav dem kyrkligt självstyre. Arsenije skrev om mer än 30 000 människor; serbisk tradition talar om 37 000 familjer. I vilken mån denna stora utvandring förändrade Kosovos befolkning debatteras fortfarande av serbiska och albanska historiker.
