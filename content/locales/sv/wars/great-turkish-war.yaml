The Ottoman recovery went on. On 21 August 1690 Thököly, with Ottoman and Tatar troops, defeated an imperial force at Zărnești and was proclaimed prince of Transylvania, though Louis William of Baden drove him out within weeks. In 1691 Fazıl Mustafa Pasha led about 50,000 men up the Danube to win back Hungary. On 19 August Louis of Baden, with about 33,000, attacked him at Slankamen, where the Tisza joins the Danube. It was one of the bloodiest battles of the century; late in the day the grand vizier was killed by a bullet, and his army broke, leaving its guns and treasury behind.: Den osmanska återhämtningen fortsatte. Den 21 augusti 1690 besegrade Thököly med osmanska och tatariska trupper en kejserlig styrka vid Zărnești och utropades till furste av Transsylvanien, även om Ludwig Wilhelm av Baden drev ut honom inom några veckor. År 1691 ledde Fazıl Mustafa pasha omkring 50 000 man uppför Donau för att återvinna Ungern. Den 19 augusti anföll Ludwig av Baden honom med omkring 33 000 man vid Slankamen, där Tisza flyter ut i Donau. Det var ett av århundradets blodigaste slag; sent på dagen dödades storvesiren av en kula, och hans armé bröts och lämnade sina kanoner och sin krigskassa efter sig.
Leopold I’s Diploma Leopoldinum, published in December 1691, made Transylvania a Habsburg land with its own estates and laws. Nagyvárad fell after a long blockade in 1692 and Gyula in 1695. But the main imperial armies were fighting France in the Nine Years’ War, and the war in the south stalled. From 1695 Sultan Mustafa II led his army in person, and on 21 September 1695 he defeated an imperial corps near Lugos in the Banat, where its general, Federico Veterani, was mortally wounded.: Leopold I:s Diploma Leopoldinum, som utfärdades i december 1691, gjorde Transsylvanien till ett habsburgskt land med egna ständer och lagar. Nagyvárad föll efter en lång blockad 1692 och Gyula 1695. Men de kejserliga huvudarméerna kämpade mot Frankrike i pfalziska tronföljdskriget, och kriget i söder stannade av. Från 1695 ledde sultan Mustafa II sin armé personligen, och den 21 september 1695 besegrade han en kejserlig kår nära Lugos i Banatet, där dess general, Federico Veterani, blev dödligt sårad.
