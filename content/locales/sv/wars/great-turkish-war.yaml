After Zenta the Ottomans accepted the mediation of England and the Dutch Republic, whose ambassadors, Lord Paget and Jacob Colyer, wanted the emperor free to face France. In November 1698 envoys of all the warring powers met at Karlowitz, on the Danube below Petrovaradin; the Ottoman side was led by Rami Mehmed Efendi and the dragoman Alexander Mavrocordatos. The talks took more than two months. They were based on uti possidetis, the principle that each side kept what it held, and the treaties were signed on 26 January 1699, for twenty-five years.: Efter Zenta godtog osmanerna medling av England och Nederländska republiken, vars ambassadörer, lord Paget och Jacob Colyer, ville att kejsaren skulle få händerna fria mot Frankrike. I november 1698 möttes sändebud från alla de krigförande makterna i Karlowitz, vid Donau nedanför Petrovaradin; den osmanska sidan leddes av Rami Mehmed efendi och tolken Alexander Mavrokordatos. Förhandlingarna tog mer än två månader. De byggde på uti possidetis, principen att varje sida behöll det den höll, och fördragen undertecknades den 26 januari 1699, på tjugofem år.
The emperor kept all of Hungary except the Banat of Temesvár, together with Transylvania, Slavonia and most of Croatia; the Ottomans kept Belgrade and the Banat. Venice kept the Morea and its new conquests in Dalmatia, and Poland–Lithuania regained Podolia. Ragusa had the Ottoman border brought down to the sea at Neum and Sutorina, so that Venetian land would not surround it. It was the first time the Ottoman Empire gave up so much by treaty, and the border was marked on the ground in the following years. Thököly and his followers went into exile in the Ottoman Empire.: Kejsaren behöll hela Ungern utom Banatet Temesvár, tillsammans med Transsylvanien, Slavonien och större delen av Kroatien; osmanerna behöll Belgrad och Banatet. Venedig behöll Morea och sina nya erövringar i Dalmatien, och Polen–Litauen återfick Podolien. Ragusa lät föra den osmanska gränsen ned till havet vid Neum och Sutorina, så att venetianskt land inte skulle omringa staden. Det var första gången Osmanska riket avträdde så mycket genom ett fördrag, och gränsen märktes ut i terrängen under de följande åren. Thököly och hans anhängare gick i exil i Osmanska riket.
