After Vienna, the imperial army under Charles of Lorraine moved down the Danube. Esztergom was taken in October 1683, and in 1684 Lorraine besieged Buda for more than three months, but disease and the autumn rains forced him to give up. In August 1685 he beat an Ottoman army near Esztergom and stormed Érsekújvár, the great fortress north of the Danube, killing most of its garrison. That autumn the Ottomans, blaming him for their defeats, arrested Imre Thököly, and many of his Hungarian kuruc rebels made terms with the emperor.: Efter Wien drog den kejserliga armén under Karl av Lothringen nedför Donau. Esztergom intogs i oktober 1683, och 1684 belägrade Lothringen Buda i mer än tre månader, men sjukdom och höstregn tvingade honom att ge upp. I augusti 1685 slog han en osmansk armé nära Esztergom och stormade Érsekújvár, den stora fästningen norr om Donau, varvid större delen av garnisonen dödades. Samma höst arresterade osmanerna Imre Thököly, som de gav skulden för sina nederlag, och många av hans ungerska kurucrebeller gjorde upp med kejsaren.
On 18 June 1686 the siege of Buda began again, with an army of perhaps 65,000–75,000 under Lorraine and Maximilian II Emanuel of Bavaria, joined by volunteers from across Europe. The garrison under the veteran governor Abdurrahman Abdi Pasha held out for eleven weeks, and a relief army under the grand vizier could not break through. The city was stormed on 2 September; Abdurrahman died fighting. The soldiers sacked it for days, killing over 3,000 Muslims and about half of its Jewish community. Szeged, Pécs and other towns fell that autumn.: Den 18 juni 1686 inleddes belägringen av Buda på nytt, med en armé på kanske 65 000–75 000 man under Lothringen och Maximilian II Emanuel av Bayern, förstärkt av frivilliga från hela Europa. Garnisonen under den erfarne guvernören Abdurrahman Abdi pasha höll ut i elva veckor, och en undsättningsarmé under storvesiren kunde inte bryta igenom. Staden stormades den 2 september; Abdurrahman stupade i striden. Soldaterna plundrade den i flera dagar och dödade över 3 000 muslimer och omkring hälften av den judiska församlingen. Szeged, Pécs och andra städer föll samma höst.
