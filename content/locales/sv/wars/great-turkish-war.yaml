Great Turkish War: Stora turkiska kriget
After the failed Ottoman siege of Vienna in 1683, the Habsburg Monarchy, Poland–Lithuania, Venice and later Russia formed the Holy League against the Ottoman Empire. Sixteen years of war ended at Karlowitz in 1699 with the Ottomans giving up Hungary and Transylvania to the Habsburgs and Podolia to Poland–Lithuania.: Efter osmanernas misslyckade belägring av Wien 1683 bildade habsburgska monarkin, Polen–Litauen, Venedig och senare Ryssland Heliga ligan mot Osmanska riket. Sexton års krig slutade i Karlowitz 1699, där osmanerna avstod Ungern och Transsylvanien till habsburgarna och Podolien till Polen–Litauen.
