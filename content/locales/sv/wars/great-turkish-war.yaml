In 1695 the young Peter I turned instead against Azov, the Ottoman fortress at the mouth of the Don. About 31,000 men under Franz Lefort, Patrick Gordon and Avtonom Golovin besieged it from midsummer, with Peter himself serving as a bombardier. They could not stop supplies coming in by river, two assaults failed, and the siege was lifted in October. A larger army under Boris Sheremetev, with Mazepa’s Cossacks, took the Ottoman forts on the lower Dnieper, among them Gazi-Kerman, whose powder magazine blew up.: År 1695 vände sig den unge Peter I i stället mot Azov, den osmanska fästningen vid Dons mynning. Omkring 31 000 man under Franz Lefort, Patrick Gordon och Avtonom Golovin belägrade den från midsommar, med Peter själv som bombardör. De kunde inte hindra förnödenheter från att komma in längs floden, två stormningar misslyckades, och belägringen hävdes i oktober. En större armé under Boris Sjeremetev, med Mazepas kosacker, intog de osmanska forten vid nedre Dnepr, bland dem Gazi-Kerman, vars krutmagasin exploderade.
Over the winter Peter had galleys, fire ships and two ships of the line built at Voronezh. In May 1696 about 75,000 men under Aleksei Shein came down the Don, and the new fleet under Lefort closed the river mouth and drove off an Ottoman relief squadron. After a heavy bombardment and a Cossack attack on the outer rampart, the garrison surrendered on 29 July. It was the first great Russian victory over the Ottomans, and it showed Peter what a fleet could do.: Under vintern lät Peter bygga galärer, brännare och två linjeskepp i Voronezj. I maj 1696 kom omkring 75 000 man under Aleksej Sjein nedför Don, och den nya flottan under Lefort stängde flodmynningen och drev bort en osmansk undsättningseskader. Efter ett kraftigt bombardemang och ett kosackanfall mot den yttre vallen kapitulerade garnisonen den 29 juli. Det var den första stora ryska segern över osmanerna, och den visade Peter vad en flotta kunde åstadkomma.
Peter chose Taganrog, along the coast, for a naval base. When his allies made peace with the Ottomans at Karlowitz in 1699, Russia agreed only a truce. But in the Treaty of Constantinople of 14 July 1700 the sultan recognised Russian rule over Azov and Taganrog. The Dnieper forts, razed by the Russians, went back to the Ottomans, and Russia no longer had to pay a yearly tribute to the Crimean khan.: Peter valde Taganrog, längre längs kusten, till flottbas. När hans allierade slöt fred med osmanerna i Karlowitz 1699 gick Ryssland bara med på ett stillestånd. Men i freden i Konstantinopel den 14 juli 1700 erkände sultanen ryskt styre över Azov och Taganrog. Dneprforten, som ryssarna raserat, gick tillbaka till osmanerna, och Ryssland behövde inte längre betala en årlig tribut till krimkhanen.
