Russia joined the Holy League through the Eternal Peace of May 1686, in which Poland–Lithuania recognised Russian rule over Kyiv and left-bank Ukraine. Its task was to tie down the Crimean Tatars. In May 1687 Prince Vasily Golitsyn, chief minister of the regent Sophia, set out from Okhtyrka with about 90,000 men, and some 50,000 Cossacks under Hetman Ivan Samoilovych joined him on the Dnieper. The huge column of men, wagons and horses crawled south in the summer heat. The Tatars set fire to the steppe, and with the horses starving and water short the army turned back in late June, still far from Perekop.: Ryssland anslöt sig till Heliga ligan genom eviga freden i maj 1686, där Polen–Litauen erkände ryskt styre över Kyiv och Ukraina på vänstra Dneprstranden. Dess uppgift var att binda krimtatarerna. I maj 1687 bröt furst Vasilij Golitsyn, regentinnan Sofias främste minister, upp från Ochtyrka med omkring 90 000 man, och ungefär 50 000 kosacker under hetman Ivan Samojlovytj anslöt sig till honom vid Dnepr. Den väldiga kolonnen av män, vagnar och hästar kröp söderut i sommarhettan. Tatarerna satte eld på stäppen, och med svältande hästar och ont om vatten vände armén i slutet av juni, fortfarande långt från Perekop.
Samoilovych was made the scapegoat and exiled to Siberia, and the Cossack officers elected Ivan Mazepa hetman in his place. Golitsyn set out again in the spring of 1689 with about 112,000 men and 350 guns, joined by 30,000–40,000 Cossacks under Mazepa. Marching in separate columns, they beat off Tatar attacks in late May and reached the Perekop isthmus on 30 May. There was no grass or drinking water, and a deep ditch barred the way into the peninsula, so Golitsyn turned back the next day. The failure helped to bring down Sophia’s government later that year, when the young Peter I took power and Golitsyn was exiled.: Samojlovytj gjordes till syndabock och förvisades till Sibirien, och kosackofficerarna valde Ivan Mazepa till hetman i hans ställe. Golitsyn bröt upp igen våren 1689 med omkring 112 000 man och 350 kanoner, förstärkt av 30 000–40 000 kosacker under Mazepa. De marscherade i skilda kolonner, slog tillbaka tatariska anfall i slutet av maj och nådde Perekopnäset den 30 maj. Där fanns varken gräs eller dricksvatten, och en djup grav spärrade vägen in på halvön, så Golitsyn vände dagen därpå. Misslyckandet bidrog till att fälla Sofias regering senare samma år, då den unge Peter I tog makten och Golitsyn förvisades.
