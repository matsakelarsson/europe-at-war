In 1697 Mustafa II marched again from Belgrade, crossed the Danube, took Titel and turned up the Tisza towards Transylvania. Prince Eugene of Savoy, newly given command in Hungary at the age of 34, followed from Petrovaradin with about 50,000 men. On the afternoon of 11 September his cavalry found the Ottoman army crossing the Tisza at Zenta on a bridge of boats, with the sultan and part of the army already on the eastern bank and the rest behind earthworks on the western one.: År 1697 marscherade Mustafa II på nytt från Belgrad, gick över Donau, intog Titel och vek av uppför Tisza mot Transsylvanien. Prins Eugen av Savojen, som vid 34 års ålder nyss fått befälet i Ungern, följde efter från Petrovaradin med omkring 50 000 man. På eftermiddagen den 11 september fann hans kavalleri den osmanska armén i färd med att gå över Tisza vid Zenta på en pontonbro, med sultanen och en del av armén redan på den östra stranden och resten bakom jordverk på den västra.
With only a few hours of daylight left, Eugene attacked at once. His wings worked round the earthworks to the river and cut the defenders off from the bridge, which broke under the fleeing crowd. Estimates of the Ottoman dead run from about 20,000 to 30,000, many of them drowned, among them the grand vizier Elmas Mehmed Pasha; the imperial army reported fewer than 500 casualties. Eugene took the army’s treasury and the sultan’s seal. In October he raided Bosnia with 6,000 horsemen, and after his envoys were killed he let his troops plunder and burn Sarajevo.: Med bara några timmars dagsljus kvar anföll Eugen genast. Hans flyglar tog sig runt jordverken ned till floden och skar av försvararna från bron, som brast under den flyende massan. Uppskattningarna av de osmanska döda varierar från omkring 20 000 till 30 000, många av dem drunknade, bland dem storvesiren Elmas Mehmed pasha; den kejserliga armén rapporterade färre än 500 förluster. Eugen tog arméns krigskassa och sultanens sigill. I oktober gjorde han ett plundringståg in i Bosnien med 6 000 ryttare, och sedan hans sändebud dödats lät han sina trupper plundra och bränna Sarajevo.
