In the summer of 1687 Charles of Lorraine, with about 40,000 men, and the Elector of Bavaria, with about 20,000, advanced on Osijek, where the grand vizier Sarı Süleyman Pasha had entrenched some 60,000 men to guard the long wooden bridge across the Drava marshes. Lorraine turned away north, and on 12 August, near Mount Harsány, not far from the battlefield of 1526, the Ottomans attacked his marching columns. The imperial wings held and counter-attacked, and the Ottoman army broke, losing perhaps 10,000 dead and most of its guns. It then mutinied; the grand vizier fled, and on 8 November Sultan Mehmed IV was deposed in favour of his brother Suleiman II.: Sommaren 1687 ryckte Karl av Lothringen med omkring 40 000 man och kurfursten av Bayern med omkring 20 000 fram mot Osijek, där storvesiren Sarı Süleyman pasha hade förskansat ungefär 60 000 man för att skydda den långa träbron över Dravas träskmarker. Lothringen vek av norrut, och den 12 augusti, nära berget Harsány, inte långt från slagfältet från 1526, anföll osmanerna hans marscherande kolonner. De kejserliga flyglarna höll stånd och gick till motanfall, och den osmanska armén bröts och förlorade kanske 10 000 döda och de flesta av sina kanoner. Den gjorde sedan myteri; storvesiren flydde, och den 8 november avsattes sultan Mehmed IV till förmån för sin bror Süleyman II.
Imperial troops took Osijek and most of Slavonia that autumn, and Eger surrendered in December after a long blockade. Lorraine marched into Transylvania, and Prince Michael I Apafi had to accept imperial garrisons in his towns. At Eperjes the imperial general Antonio Caraffa set up a court that tortured and executed more than twenty Hungarian nobles and burghers suspected of backing Thököly. In the autumn the Hungarian diet at Pozsony accepted the Habsburgs as hereditary kings and gave up the nobles’ old right to resist an unlawful ruler, and Archduke Joseph was crowned on 9 December.: Kejserliga trupper intog Osijek och större delen av Slavonien samma höst, och Eger kapitulerade i december efter en lång blockad. Lothringen marscherade in i Transsylvanien, och fursten Mikael I Apafi tvingades godta kejserliga garnisoner i sina städer. I Eperjes upprättade den kejserlige generalen Antonio Caraffa en domstol som torterade och avrättade mer än tjugo ungerska adelsmän och borgare som misstänktes för att stödja Thököly. På hösten godtog den ungerska riksdagen i Pozsony habsburgarna som ärftliga kungar och avstod från adelns gamla rätt att göra motstånd mot en olaglig härskare, och ärkehertig Josef kröntes den 9 december.
