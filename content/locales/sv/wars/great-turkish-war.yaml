Poland–Lithuania gained much less than its allies from the long war that followed. Its armies blockaded Ottoman-held Kamianets but could not take it, and Sobieski’s campaigns into Moldavia in 1686 and 1691 achieved little. To bring Russia into the League, the Commonwealth signed the Eternal Peace of 1686, giving up its claim to Kyiv. Sobieski died in 1696, and in 1698 Feliks Potocki beat a large Tatar army at Podhajce in one of the last battles of the war.: Polen–Litauen vann mycket mindre än sina allierade på det långa krig som följde. Dess arméer blockerade det osmanskt hållna Kamjanets men kunde inte inta det, och Sobieskis fälttåg in i Moldavien 1686 och 1691 uträttade föga. För att få in Ryssland i ligan undertecknade samväldet eviga freden 1686 och avstod från sitt anspråk på Kyiv. Sobieski dog 1696, och 1698 slog Feliks Potocki en stor tatarisk här vid Podhajce i ett av krigets sista slag.
The great victories were Habsburg ones, in Hungary and the Balkans, and the war ended with the Treaty of Karlowitz on 26 January 1699. The Ottomans returned Podolia and Kamianets to Poland–Lithuania and gave up their claims to Ukraine west of the Dnieper. The Habsburgs gained almost all of Hungary and Transylvania, and Venice the Morea. It was the first time the Ottoman Empire had given up so much territory by treaty.: De stora segrarna var habsburgska, i Ungern och på Balkan, och kriget slutade med freden i Karlowitz den 26 januari 1699. Osmanerna lämnade tillbaka Podolien och Kamjanets till Polen–Litauen och avstod från sina anspråk på Ukraina väster om Dnepr. Habsburgarna fick nästan hela Ungern och Transsylvanien, och Venedig Morea. Det var första gången Osmanska riket avträdde så mycket land genom ett fördrag.
