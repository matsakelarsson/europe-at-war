For once Venice declared war on the Ottomans rather than the other way round, joining the Holy League in 1684 to win back what it had lost in Greece. Francesco Morosini, the defender of Candia in the Cretan War, sailed with papal, Tuscan and Maltese galleys and took Lefkada in August 1684. In 1685 his army, strengthened with Hanoverian and Saxon mercenaries, landed at Koroni; the fortress surrendered on 11 August, but its garrison was massacred during the talks. The Maniots rose again, and in 1686 the Swedish marshal Otto Wilhelm Königsmarck took Navarino, Modon and, on 29 August, Nauplia, the capital of the Morea.: För en gångs skull var det Venedig som förklarade osmanerna krig och inte tvärtom; republiken anslöt sig 1684 till Heliga ligan för att återvinna det den hade förlorat i Grekland. Francesco Morosini, Candias försvarare under Kretakriget, seglade med påvliga, toskanska och maltesiska galärer och intog Lefkada i augusti 1684. År 1685 landsteg hans armé, förstärkt med hannoveranska och sachsiska legosoldater, vid Koroni; fästningen kapitulerade den 11 augusti, men dess garnison massakrerades under förhandlingarna. Manioterna reste sig på nytt, och 1686 intog den svenske fältmarskalken Otto Wilhelm Königsmarck Navarino, Modon och, den 29 augusti, Nauplia, Moreas huvudstad.
In July 1687 the Venetians routed the Ottoman army at Patras, and within weeks all of the Peloponnese except Monemvasia was theirs. In September Königsmarck landed near Athens and besieged the Acropolis. On the evening of 26 September a Venetian mortar shell hit the Parthenon, which the garrison used as a powder store; the explosion killed about 300 people and wrecked the temple. The garrison surrendered two days later, but Athens was abandoned in April 1688, and some 4,000–5,000 Athenians left with the Venetians. A siege of Negroponte that summer failed, with about 9,000 men lost to battle and plague, Königsmarck among them. In Dalmatia Venetian troops took Herceg Novi in 1687 and Knin in 1688.: I juli 1687 slog venetianarna den osmanska armén på flykt vid Patras, och inom några veckor var hela Peloponnesos utom Monemvasia deras. I september landsteg Königsmarck nära Aten och belägrade Akropolis. På kvällen den 26 september träffade en venetiansk mörsargranat Parthenon, som garnisonen använde som krutförråd; explosionen dödade omkring 300 människor och förstörde templet. Garnisonen kapitulerade två dagar senare, men Aten övergavs i april 1688, och omkring 4 000–5 000 atenare följde med venetianarna. En belägring av Negroponte samma sommar misslyckades, och omkring 9 000 man gick förlorade i strid och genom pest, bland dem Königsmarck. I Dalmatien intog venetianska trupper Herceg Novi 1687 och Knin 1688.
