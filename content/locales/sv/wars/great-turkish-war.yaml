In 1683 the grand vizier Kara Mustafa Pasha marched up the Danube with the main Ottoman army and on 14 July laid siege to Vienna, the Habsburg capital. Count Ernst Rüdiger von Starhemberg held the city with soldiers and armed citizens through two months of mining and assaults, while disease and hunger spread inside the walls. Emperor Leopold I had signed an alliance with Poland–Lithuania in March, and John III Sobieski came south with his army to join Imperial, Bavarian, Saxon and other German troops at Tulln.: År 1683 marscherade storvesiren Kara Mustafa pasha uppför Donau med den osmanska huvudarmén och belägrade den 14 juli Wien, den habsburgska huvudstaden. Greve Ernst Rüdiger von Starhemberg höll staden med soldater och beväpnade borgare genom två månader av minering och stormningar, medan sjukdom och svält spred sig innanför murarna. Kejsar Leopold I hade i mars undertecknat ett förbund med Polen–Litauen, och Johan III Sobieski kom söderut med sin armé för att förena sig med kejserliga, bayerska, sachsiska och andra tyska trupper vid Tulln.
The relief army, some 70,000–80,000 men under Sobieski’s overall command, came down from the Kahlenberg on 12 September. Late in the afternoon a huge cavalry charge, led by the Polish hussars, broke the Ottoman army, which fled leaving its camp behind. Sobieski followed up with a victory at Párkány on the Danube in October, after a defeat there two days before. Kara Mustafa was executed at Belgrade on the sultan’s orders that December, and in 1684 the Emperor, Poland, Venice and the Pope formed the Holy League.: Undsättningsarmén, omkring 70 000–80 000 man under Sobieskis överbefäl, kom ned från Kahlenberg den 12 september. Sent på eftermiddagen bröt en väldig kavallerichock, ledd av de polska husarerna, den osmanska armén, som flydde och lämnade sitt läger bakom sig. Sobieski följde upp med en seger vid Párkány vid Donau i oktober, efter ett nederlag där två dagar tidigare. Kara Mustafa avrättades i Belgrad på sultanens order i december samma år, och 1684 bildade kejsaren, Polen, Venedig och påven Heliga ligan.
