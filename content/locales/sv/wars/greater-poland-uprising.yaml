Greater Poland Uprising: Storpolska upproret
A Polish rising against German rule in the Prussian Province of Posen, which broke out in Poznań on 27 December 1918, the day after a patriotic speech there by Ignacy Paderewski. By mid-January 1919 the insurgents held most of the province; fighting ended with the renewed Allied–German armistice of Trier on 16 February, and the Treaty of Versailles gave most of the region to Poland.: Ett polskt uppror mot det tyska styret i den preussiska provinsen Posen, som bröt ut i Poznań den 27 december 1918, dagen efter ett patriotiskt tal där av Ignacy Paderewski. I mitten av januari 1919 kontrollerade upprorsmännen större delen av provinsen. Striderna upphörde med det förnyade allierat-tyska vapenstilleståndet i Trier den 16 februari, och Versaillesfreden gav större delen av regionen till Polen.
Polish insurgents: Polska upprorsmän
Germany: Tyskland
