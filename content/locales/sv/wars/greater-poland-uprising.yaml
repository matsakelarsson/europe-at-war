The Treaty of Versailles, signed on 28 June 1919, came into force on 10 January 1920, when the transfer of the province to Poland was completed.: Versaillesfreden, som undertecknades den 28 juni 1919, trädde i kraft den 10 januari 1920, då överföringen av provinsen till Polen fullbordades.
