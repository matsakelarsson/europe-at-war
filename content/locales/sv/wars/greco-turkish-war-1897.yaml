Greece used the Julian (Old Style) calendar, 12 days behind the Gregorian in the 19th century, and Greek accounts often give Old Style dates. All dates here are New Style.: Grekland använde den julianska kalendern (gamla stilen), som under 1800-talet låg 12 dagar efter den gregorianska, och grekiska framställningar anger ofta datum enligt gamla stilen. Alla datum här följer nya stilen.
The war is said to have been the first filmed by a cameraman, although the footage is lost.: Kriget sägs ha varit det första som filmades av en filmfotograf, men filmen har gått förlorad.
