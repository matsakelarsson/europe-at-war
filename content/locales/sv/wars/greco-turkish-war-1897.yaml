On 5 May the Ottomans attacked Farsala and forced the Greeks back to Domokos, and Volos fell on 8 May. At Domokos about 40,000 Greek soldiers, joined by some 2,000 Italian volunteers under Ricciotti Garibaldi, held a strong position, but on 17 May the Ottomans turned the Greek right and the army retreated again. The road to Athens was open. The powers stepped in, and after Tsar Nicholas II telegraphed the sultan, an armistice came into force on 20 May.: Den 5 maj anföll osmanerna Farsala och tvingade grekerna tillbaka till Domokos, och Volos föll den 8 maj. Vid Domokos höll omkring 40 000 grekiska soldater, förstärkta av ungefär 2 000 italienska frivilliga under Ricciotti Garibaldi, en stark ställning, men den 17 maj kringgick osmanerna den grekiska högerflanken och armén retirerade på nytt. Vägen till Aten låg öppen. Stormakterna ingrep, och sedan tsar Nikolaj II telegraferat till sultanen trädde ett vapenstillestånd i kraft den 20 maj.
The Treaty of Constantinople of 4 December 1897 made Greece pay an indemnity of four million Ottoman pounds, under an international commission that took control of part of its revenue, and gave the Ottomans small strips of the Thessalian frontier. Yet Crete was lost to the sultan. After Ottoman troops and Muslim mobs killed British soldiers and Christians in Heraklion in September 1898, the powers expelled the Ottoman army, and in December Prince George of Greece arrived as high commissioner of an autonomous Cretan State.: Freden i Konstantinopel den 4 december 1897 tvingade Grekland att betala ett krigsskadestånd på fyra miljoner osmanska pund, under en internationell kommission som tog kontroll över en del av landets inkomster, och gav osmanerna smala remsor längs gränsen i Thessalien. Men Kreta gick förlorat för sultanen. Sedan osmanska trupper och muslimska folkmassor dödat brittiska soldater och kristna i Heraklion i september 1898 drev stormakterna ut den osmanska armén, och i december anlände prins Georg av Grekland som högkommissarie för en autonom kretensisk stat.
