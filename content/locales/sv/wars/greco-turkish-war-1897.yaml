Greco-Turkish War (1897): Grekisk-turkiska kriget (1897)
A short war, also called the Thirty Days’ War, that grew out of a Christian revolt on Ottoman Crete and Greek efforts to annex the island. The Ottoman army routed the Greeks in Thessaly and won at Domokos before the powers imposed an armistice; Greece paid an indemnity and lost a strip of its northern frontier, but the powers then made Crete an autonomous state under a Greek prince.: Ett kort krig, även kallat trettiodagarskriget, som växte fram ur ett kristet uppror på det osmanska Kreta och grekiska försök att annektera ön. Den osmanska armén slog grekerna på flykt i Thessalien och segrade vid Domokos innan stormakterna tvingade fram ett vapenstillestånd. Grekland fick betala krigsskadestånd och förlorade en remsa av sin norra gräns, men stormakterna gjorde därefter Kreta till en autonom stat under en grekisk prins.
