Crete’s Christian majority had risen again and again against Ottoman rule, and in early 1897 fighting broke out in Chania. Swept along by public opinion and the nationalist Ethniki Etaireia (National Society), the Greek government sent warships and, on 14 February, landed two battalions under Colonel Timoleon Vassos, who proclaimed the island’s union with Greece. The six Great Powers had already sent an international squadron; they landed troops in the towns, shelled insurgent positions and blockaded Crete, and promised the island autonomy under Ottoman rule.: Kretas kristna majoritet hade gång på gång rest sig mot det osmanska styret, och i början av 1897 bröt strider ut i Chania. Driven av den allmänna opinionen och det nationalistiska Ethniki Etaireia (Nationella sällskapet) sände den grekiska regeringen krigsfartyg och landsatte den 14 februari två bataljoner under överste Timoleon Vassos, som utropade öns förening med Grekland. De sex stormakterna hade redan sänt en internationell eskader; de landsatte trupper i städerna, besköt upprorsmännens ställningar och blockerade Kreta samt lovade ön självstyre under osmanskt styre.
In April Greek irregulars crossed into Ottoman Macedonia, and on 18 April the Ottoman Empire declared war. Its army in Thessaly under Edhem Pasha, larger and better armed and trained by German officers, broke through the frontier passes. On the night of 23–24 April the Greek army under Crown Prince Constantine fell back in panic, and Larissa was occupied on 27 April. Only at Velestino did a brigade under Colonel Konstantinos Smolenskis hold, from 27 to 30 April. On the Epirus front, Greek attacks across the Arta river made little progress.: I april gick grekiska irreguljära styrkor in i det osmanska Makedonien, och den 18 april förklarade Osmanska riket krig. Dess armé i Thessalien under Edhem pasha, större, bättre beväpnad och utbildad av tyska officerare, bröt igenom passen vid gränsen. Natten mellan den 23 och 24 april drog sig den grekiska armén under kronprins Konstantin tillbaka i panik, och Larissa ockuperades den 27 april. Bara vid Velestino höll en brigad under överste Konstantinos Smolenskis stånd, från den 27 till den 30 april. På fronten i Epirus gjorde grekiska anfall över floden Arta små framsteg.
