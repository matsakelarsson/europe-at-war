British troops faced Turkish cavalry across the wire of the neutral zone, but the British commander, General Charles Harington, held back an ultimatum and talks followed.: Brittiska trupper stod mot turkiskt kavalleri på var sin sida om den neutrala zonens taggtråd, men den brittiske befälhavaren, general Charles Harington, höll inne med ett ultimatum och förhandlingar följde.
Signed by Turkey, Britain, France and Italy; the Greek army had 15 days to leave Eastern Thrace, and Greek civilians left with it.: Undertecknat av Turkiet, Storbritannien, Frankrike och Italien; den grekiska armén fick 15 dagar på sig att lämna Östthrakien, och grekiska civila lämnade området med den.
