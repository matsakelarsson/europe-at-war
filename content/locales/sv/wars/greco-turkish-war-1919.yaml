A peace conference opened at Lausanne in November 1922, with İsmet Pasha leading the Turkish delegation. On 30 January 1923 Greece and Turkey agreed to a compulsory exchange of populations defined by religion, the first of its kind. About 1.2 million Orthodox Christians, most of whom had already fled, lost their homes in Turkey, and some 400,000 Muslims had to leave Greece. The Greeks of Constantinople, Imbros and Tenedos and the Muslims of Western Thrace were exempted. Refugees made up about a fifth of Greece’s population and transformed Macedonia and the cities, where many lived in poverty for decades.: En fredskonferens öppnades i Lausanne i november 1922, med İsmet pasha som ledare för den turkiska delegationen. Den 30 januari 1923 enades Grekland och Turkiet om ett tvångsmässigt befolkningsutbyte definierat efter religion, det första i sitt slag. Omkring 1,2 miljoner ortodoxa kristna, av vilka de flesta redan hade flytt, förlorade sina hem i Turkiet, och omkring 400 000 muslimer tvingades lämna Grekland. Grekerna i Konstantinopel, på Imbros och Tenedos och muslimerna i Västthrakien undantogs. Flyktingarna utgjorde omkring en femtedel av Greklands befolkning och förvandlade Makedonien och städerna, där många levde i fattigdom i årtionden.
The Treaty of Lausanne, signed on 24 July 1923, replaced Sèvres. Turkey kept all of Anatolia and Eastern Thrace up to the Maritsa, with Imbros, Tenedos and Karaağaç, a suburb of Adrianople, ceded by Greece instead of reparations; Greece kept the other Aegean islands and Italy the Dodecanese. The Straits were demilitarised, and the foreign privileges of the capitulations were abolished. The last Allied troops left Constantinople in early October, Ankara became the capital, and on 29 October 1923 the Assembly proclaimed the Republic of Turkey with Mustafa Kemal as its president.: Freden i Lausanne, som undertecknades den 24 juli 1923, ersatte Sèvres. Turkiet behöll hela Anatolien och Östthrakien fram till Maritsa, med Imbros, Tenedos och Karaağaç, en förstad till Adrianopel, som Grekland avträdde i stället för krigsskadestånd; Grekland behöll de övriga öarna i Egeiska havet och Italien Dodekanesos. Sunden demilitariserades, och kapitulationernas privilegier för utlänningar avskaffades. De sista allierade trupperna lämnade Konstantinopel i början av oktober, Ankara blev huvudstad, och den 29 oktober 1923 utropade församlingen Republiken Turkiet med Mustafa Kemal som president.
