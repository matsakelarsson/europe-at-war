After the Ottoman surrender at Mudros in October 1918, Allied troops occupied the Straits and Constantinople, Italy landed at Antalya, and British and then French troops took over Cilicia. The Greek prime minister, Eleftherios Venizelos, claimed Smyrna and its region, where Greeks were numerous, and Britain’s David Lloyd George persuaded the peace conference in Paris to let Greece occupy it, partly to forestall Italy. On 15 May 1919 Greek troops landed under the guns of Allied warships. A shot fired at them set off shooting and lynchings in which many Turkish soldiers and civilians were killed, and an Allied inquiry later blamed the Greek command.: Sedan osmanerna kapitulerat i Mudros i oktober 1918 ockuperade allierade trupper sunden och Konstantinopel, Italien landsteg i Antalya, och brittiska och därefter franska trupper tog över Kilikien. Den grekiske premiärministern Eleftherios Venizelos gjorde anspråk på Smyrna med omnejd, där grekerna var talrika, och Storbritanniens David Lloyd George övertalade fredskonferensen i Paris att låta Grekland ockupera området, delvis för att komma före Italien. Den 15 maj 1919 landsteg grekiska trupper i skydd av allierade krigsfartygs kanoner. Ett skott som avlossades mot dem utlöste skottlossning och lynchningar där många turkiska soldater och civila dödades, och en allierad undersökning lade senare skulden på det grekiska befälet.
The Greeks spread out to Manisa, Ayvalık and Aydın, where Turkish irregulars retook the town at the end of June and it was burned amid massacres of Greek and Turkish civilians. The landing turned scattered Turkish resistance into a national movement. Mustafa Kemal Pasha, sent to the Black Sea as an army inspector, landed at Samsun on 19 May, broke with the sultan’s government, and at congresses in Erzurum and Sivas that summer rallied the resistance behind a programme of keeping the Turkish-majority lands undivided.: Grekerna spred sig till Manisa, Ayvalık och Aydın, där turkiska irreguljära återtog staden i slutet av juni och den brändes under massakrer på grekiska och turkiska civila. Landstigningen förvandlade det spridda turkiska motståndet till en nationell rörelse. Mustafa Kemal pasha, som sänts till Svarta havet som arméinspektör, landsteg i Samsun den 19 maj, bröt med sultanens regering och samlade under kongresser i Erzurum och Sivas samma sommar motståndet kring ett program om att hålla de områden där turkarna var i majoritet odelade.
