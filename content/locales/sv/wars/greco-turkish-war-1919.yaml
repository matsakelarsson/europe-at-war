Greco-Turkish War (1919–1922): Grekisk-turkiska kriget (1919–1922)
The war that followed the Greek landing at Smyrna in May 1919, when Greece, backed at first by Britain, tried to win western Anatolia and Eastern Thrace from the defeated Ottoman Empire. The Turkish nationalist movement led by Mustafa Kemal stopped the Greek army at the Sakarya in 1921 and routed it in August 1922; Smyrna burned, the Armistice of Mudanya ended the fighting, and the Treaty of Lausanne and the exchange of populations of 1923 uprooted some 1.6 million people.: Kriget som följde på den grekiska landstigningen i Smyrna i maj 1919, då Grekland, till en början med stöd av Storbritannien, försökte vinna västra Anatolien och Östthrakien från det besegrade Osmanska riket. Den turkiska nationalistiska rörelsen under Mustafa Kemal stoppade den grekiska armén vid Sakarya 1921 och slog den på flykt i augusti 1922. Smyrna brann, vapenstilleståndet i Mudanya avslutade striderna, och freden i Lausanne och befolkningsutbytet 1923 drev omkring 1,6 miljoner människor från sina hem.
