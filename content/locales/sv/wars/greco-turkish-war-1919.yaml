The new Greek government kept up the war, hoping to break the nationalists before the Allies made peace without Greece. In January 1921 a Greek corps advancing from Bursa towards the railway junction of Eskişehir was stopped at İnönü by the new regular army of İsmet Pasha. Talks in London failed, and in late March the Greeks attacked again on two fronts; at İnönü they were beaten back after a week of fighting, and in the south they took Afyonkarahisar but soon gave it up. The battles made the nationalists’ name, and İsmet later took İnönü as his surname.: Den nya grekiska regeringen fortsatte kriget i hopp om att krossa nationalisterna innan de allierade slöt fred utan Grekland. I januari 1921 hejdades en grekisk kår som ryckte fram från Bursa mot järnvägsknuten Eskişehir vid İnönü av İsmet pashas nya reguljära armé. Förhandlingar i London misslyckades, och i slutet av mars anföll grekerna på nytt på två fronter; vid İnönü slogs de tillbaka efter en veckas strider, och i söder intog de Afyonkarahisar men gav snart upp staden. Striderna gjorde nationalisterna kända, och İsmet tog senare İnönü som efternamn.
Abroad, the Ankara government gained ground. It signed a treaty of friendship with Soviet Russia in March, which brought gold and arms, and Italy began to pull out of its zone. In July the Greek Army of Asia Minor under General Anastasios Papoulas launched its largest offensive yet. In the battles of Kütahya–Eskişehir it took Afyonkarahisar on 13 July, Kütahya on 17 July and Eskişehir on 19 July. Mustafa Kemal ordered his army to fall back east of the Sakarya river, trading land for time.: Utomlands vann Ankararegeringen terräng. Den undertecknade i mars ett vänskapsfördrag med Sovjetryssland, som gav guld och vapen, och Italien började dra sig ur sin zon. I juli inledde den grekiska armén i Mindre Asien under general Anastasios Papoulas sin dittills största offensiv. I striderna vid Kütahya–Eskişehir intog den Afyonkarahisar den 13 juli, Kütahya den 17 juli och Eskişehir den 19 juli. Mustafa Kemal beordrade sin armé att falla tillbaka öster om floden Sakarya och bytte därmed land mot tid.
