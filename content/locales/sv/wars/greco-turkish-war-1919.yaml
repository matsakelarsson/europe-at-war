Known in Greece as the Asia Minor Campaign, ending in the Asia Minor Catastrophe, and in Turkey as the western front of the War of Independence (Kurtuluş Savaşı). Greece adopted the Gregorian calendar in 1923, and Greek accounts often give Old Style dates for 1919–1922; all dates here are New Style.: I Grekland kallat fälttåget i Mindre Asien, som slutade med katastrofen i Mindre Asien, och i Turkiet västfronten i frihetskriget (Kurtuluş Savaşı). Grekland införde den gregorianska kalendern 1923, och grekiska framställningar anger ofta datum enligt gamla stilen för 1919–1922; alla datum här följer nya stilen.
The base map shows the Ottoman Empire until the sultanate was abolished on 1 November 1922. From 1920 most of Anatolia was held by the Grand National Assembly in Ankara, whose government became the Republic of Turkey in October 1923; the Greek, Allied, Italian and French zones are shown as approximate areas.: Grundkartan visar Osmanska riket fram till att sultanatet avskaffades den 1 november 1922. Från 1920 hölls större delen av Anatolien av Stora nationalförsamlingen i Ankara, vars regering blev Republiken Turkiet i oktober 1923; den grekiska, den allierade, den italienska och den franska zonen visas som ungefärliga områden.
Places are named in their present-day forms, with the names used at the time where accounts usually give them; Smyrna is İzmir, Brusa is Bursa, Afyon Karahisar is Afyonkarahisar and Chanak is Çanakkale.: Platserna anges med sina nutida namn, med de namn som användes på den tiden där framställningarna brukar ge dem; Smyrna är İzmir, Brusa är Bursa, Afyon Karahisar är Afyonkarahisar och Chanak är Çanakkale.
Civilians suffered on all sides. Greek troops and irregulars killed Turkish villagers and burned towns, above all during the retreat of 1922; Turkish forces and irregulars killed and deported Greek and Armenian civilians, including the Pontic Greeks of the Black Sea coast; and the burning of Smyrna and the expulsions that followed ended three thousand years of Greek life in Anatolia. Greece and a number of scholars regard the killings and deportations of Ottoman Greeks from 1914 to 1923 as genocide, which Turkey rejects. Numbers are disputed and the subject is still bitterly contested.: Civilbefolkningen led på alla sidor. Grekiska trupper och irreguljära styrkor dödade turkiska bybor och brände städer, framför allt under reträtten 1922; turkiska styrkor och irreguljära dödade och deporterade grekiska och armeniska civila, däribland de pontiska grekerna vid Svartahavskusten; och Smyrnas brand och de utvisningar som följde gjorde slut på tre tusen år av grekiskt liv i Anatolien. Grekland och ett antal forskare betraktar dödandet och deportationerna av osmanska greker 1914–1923 som folkmord, vilket Turkiet tillbakavisar. Siffrorna är omstridda och ämnet är fortfarande mycket infekterat.
