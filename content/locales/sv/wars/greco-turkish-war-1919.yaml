With King Constantine at the front, the Greek army set out in mid-August to destroy the Turkish army and take Ankara. Its columns crossed a waterless salt steppe, with supply lines stretching back hundreds of kilometres, and met Turkish positions in the hills east of the Sakarya river, some 80 kilometres from Ankara. The Assembly had made Mustafa Kemal commander-in-chief. The battle lasted from 23 August to 13 September along a front of about 100 kilometres; the Greeks took several ridges, but each side lost more than 20,000 men killed or wounded, and the Greeks could go no further.: Med kung Konstantin vid fronten bröt den grekiska armén upp i mitten av augusti för att förinta den turkiska armén och inta Ankara. Dess kolonner tog sig över en vattenlös saltstäpp, med försörjningslinjer som sträckte sig hundratals kilometer bakåt, och mötte turkiska ställningar i bergen öster om floden Sakarya, omkring 80 kilometer från Ankara. Församlingen hade gjort Mustafa Kemal till överbefälhavare. Slaget pågick från den 23 augusti till den 13 september längs en front på omkring 100 kilometer; grekerna intog flera höjdryggar, men vardera sidan förlorade mer än 20 000 man i döda och sårade, och grekerna kom inte längre.
The Greek army fell back to a line running from Eskişehir to Afyonkarahisar, burning villages as it went, and the front stayed there for almost a year. The Assembly gave Mustafa Kemal the title of Gazi, “the victorious”. France made peace with Ankara in the Ankara Agreement of 20 October 1921 and left Cilicia, Soviet Russia settled the eastern border in the Treaty of Kars, and Italy was withdrawing its troops. Greece was left alone, short of money and without Allied support, to hold a long front deep in Anatolia.: Den grekiska armén föll tillbaka till en linje från Eskişehir till Afyonkarahisar och brände byar på vägen, och fronten låg kvar där i nästan ett år. Församlingen gav Mustafa Kemal titeln gazi, ”den segerrike”. Frankrike slöt fred med Ankara genom Ankaraavtalet den 20 oktober 1921 och lämnade Kilikien, Sovjetryssland reglerade den östra gränsen i freden i Kars, och Italien höll på att dra tillbaka sina trupper. Grekland lämnades ensamt, med ont om pengar och utan allierat stöd, att hålla en lång front djupt inne i Anatolien.
