In July 1922 Greece moved troops from Anatolia to Thrace and asked the Allies to let it occupy Constantinople, which they refused. Mustafa Kemal had spent months building up his army in secret. Before dawn on 26 August his artillery opened fire on the Greek positions south of Afyonkarahisar, and Turkish infantry broke through on the heights. Cavalry poured through the gap behind the Greek lines. In the battle at Dumlupınar on 30 August the main Greek force was surrounded and destroyed, and on 2 September its commander, General Nikolaos Trikoupis, was taken prisoner.: I juli 1922 flyttade Grekland trupper från Anatolien till Thrakien och bad de allierade om att få ockupera Konstantinopel, vilket de vägrade. Mustafa Kemal hade i månader i hemlighet byggt upp sin armé. Före gryningen den 26 augusti öppnade hans artilleri eld mot de grekiska ställningarna söder om Afyonkarahisar, och turkiskt infanteri bröt igenom på höjderna. Kavalleri strömmade genom luckan bakom de grekiska linjerna. I slaget vid Dumlupınar den 30 augusti omringades och förintades den grekiska huvudstyrkan, och den 2 september togs dess befälhavare, general Nikolaos Trikoupis, till fånga.
The Greek army fell apart and retreated more than 300 kilometres to the coast in two weeks. Retreating troops and irregulars burned towns and villages on their way, among them Uşak, Alaşehir and Manisa, and killed Turkish civilians. Turkish troops and irregulars following them killed Greek civilians and prisoners. Greek soldiers and tens of thousands of refugees crowded into the ports of Smyrna and Çeşme, from which the army was shipped away. Turkish cavalry rode into Smyrna on 9 September.: Den grekiska armén föll samman och retirerade mer än 300 kilometer till kusten på två veckor. Retirerande trupper och irreguljära brände städer och byar på vägen, bland dem Uşak, Alaşehir och Manisa, och dödade turkiska civila. Turkiska trupper och irreguljära som följde efter dödade grekiska civila och fångar. Grekiska soldater och tiotusentals flyktingar trängdes i hamnarna i Smyrna och Çeşme, varifrån armén skeppades bort. Turkiskt kavalleri red in i Smyrna den 9 september.
