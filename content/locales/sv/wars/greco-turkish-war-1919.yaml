When the Ottoman parliament declared its support for the national movement, Allied troops formally occupied Constantinople on 16 March 1920, arrested nationalist deputies and sent many to Malta. The nationalists answered by opening a Grand National Assembly in Ankara on 23 April, which claimed to govern in the sultan’s name while he was a prisoner of the Allies. That summer, with British approval, the Greek army struck out of its zone, took Bursa on 8 July and pushed east as far as Uşak, while another Greek force occupied Eastern Thrace and entered Adrianople on 25 July.: När det osmanska parlamentet förklarade sitt stöd för den nationella rörelsen ockuperade allierade trupper formellt Konstantinopel den 16 mars 1920, arresterade nationalistiska deputerade och skickade många av dem till Malta. Nationalisterna svarade med att den 23 april öppna en stor nationalförsamling i Ankara, som gjorde anspråk på att regera i sultanens namn medan han var de allierades fånge. Samma sommar bröt den grekiska armén med brittiskt godkännande ut ur sin zon, intog Bursa den 8 juli och trängde österut ända till Uşak, medan en annan grekisk styrka ockuperade Östthrakien och tågade in i Adrianopel den 25 juli.
On 10 August the sultan’s government signed the Treaty of Sèvres. Greece was to have Eastern Thrace and to govern Smyrna for five years before a plebiscite, the Straits were put under international control, and Armenia and a possible Kurdistan were carved from the east. The Ankara government rejected the treaty, and it was never ratified. Then fortune turned against Venizelos. King Alexander died of a monkey bite in October, Venizelos lost the elections of November, and King Constantine, whom the Allies distrusted, returned in December.: Den 10 augusti undertecknade sultanens regering freden i Sèvres. Grekland skulle få Östthrakien och förvalta Smyrna i fem år före en folkomröstning, sunden ställdes under internationell kontroll, och Armenien och ett möjligt Kurdistan skulle skäras ut ur östra delen. Ankararegeringen förkastade fördraget, och det ratificerades aldrig. Sedan vände lyckan för Venizelos. Kung Alexander dog av ett apbett i oktober, Venizelos förlorade valet i november, och kung Konstantin, som de allierade misstrodde, återvände i december.
