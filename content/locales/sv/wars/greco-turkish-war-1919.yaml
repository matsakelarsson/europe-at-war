In Smyrna, Turkish troops and mobs killed Greeks and Armenians, and the Orthodox metropolitan, Chrysostomos, was handed over to a crowd and murdered. On 13 September fire broke out in the Armenian quarter and destroyed the Greek, Armenian and European quarters over the next days, while hundreds of thousands of refugees were trapped on the quayside and Allied warships looked on. Most eyewitnesses blamed Turkish soldiers, while Turkish accounts blamed Armenians and Greeks. Estimates of the dead run from about 10,000 to 100,000 or more; ships organised by Greece and an American, Asa Jennings, carried the survivors away.: I Smyrna dödade turkiska trupper och folkmassor greker och armenier, och den ortodoxe metropoliten Chrysostomos överlämnades åt en folkmassa och mördades. Den 13 september bröt en brand ut i det armeniska kvarteret och förstörde under de följande dagarna de grekiska, armeniska och europeiska kvarteren, medan hundratusentals flyktingar var instängda på kajen och allierade krigsfartyg såg på. De flesta ögonvittnen gav turkiska soldater skulden, medan turkiska framställningar skyllde på armenier och greker. Uppskattningarna av antalet döda varierar från omkring 10 000 till 100 000 eller fler; fartyg som organiserades av Grekland och av amerikanen Asa Jennings förde bort de överlevande.
Turkish troops then advanced on the neutral zone of the Straits, where British troops held Chanak (Çanakkale), and for some days Britain came close to war. On 11 October the Armistice of Mudanya gave Eastern Thrace up to the Maritsa back to Turkish rule, and Greece accepted it three days later. In Greece, army officers had forced King Constantine to abdicate, and six politicians and generals blamed for the defeat were shot in November. On 1 November the Assembly abolished the sultanate, and Mehmed VI left on a British warship.: Turkiska trupper ryckte därefter fram mot den neutrala zonen vid sunden, där brittiska trupper höll Chanak (Çanakkale), och under några dagar var Storbritannien nära krig. Den 11 oktober återförde vapenstilleståndet i Mudanya Östthrakien fram till Maritsa under turkiskt styre, och Grekland godtog det tre dagar senare. I Grekland hade arméofficerare tvingat kung Konstantin att abdikera, och sex politiker och generaler som fick skulden för nederlaget arkebuserades i november. Den 1 november avskaffade församlingen sultanatet, och Mehmed VI lämnade landet på ett brittiskt krigsfartyg.
