Greek Civil War: Grekiska inbördeskriget
A war between the Greek government, backed first by Britain and then by the United States, and the Democratic Army of Greece led by the Communist Party (KKE), with bases in Yugoslavia, Albania and Bulgaria. Rooted in the wartime split of the resistance and the December 1944 fighting in Athens, it was fought mainly in the northern mountains and ended with the government victories at Grammos and Vitsi in August 1949, after tens of thousands of deaths and the uprooting of some 700,000 people.: Ett krig mellan den grekiska regeringen, med stöd först av Storbritannien och sedan av USA, och Greklands demokratiska armé under kommunistpartiet (KKE), med baser i Jugoslavien, Albanien och Bulgarien. Kriget hade sina rötter i motståndsrörelsens splittring under världskriget och striderna i Aten i december 1944. Det utkämpades främst i bergen i norr och slutade med regeringens segrar vid Grammos och Vitsi i augusti 1949, efter tiotusentals döda och sedan omkring 700 000 människor drivits från sina hem.
