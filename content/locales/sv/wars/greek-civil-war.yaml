Greek governments called the conflict the “bandit war” (Symmoritopolemos) until 1989, when a law recognised it as a civil war. The Democratic Army is often called by its Greek initials, DSE.: Grekiska regeringar kallade konflikten ”banditkriget” (Symmoritopolemos) fram till 1989, då en lag erkände den som ett inbördeskrig. Demokratiska armén kallas ofta efter sina grekiska initialer, DSE.
Many Slavic-speaking Macedonians of northern Greece fought in the Democratic Army, some in the National Liberation Front (NOF), and thousands of them left Greece for good after 1949; the place of this community in the war is still disputed between Greece and North Macedonia.: Många slaviskspråkiga makedonier i norra Grekland stred i Demokratiska armén, en del i Nationella befrielsefronten (NOF), och tusentals av dem lämnade Grekland för gott efter 1949; denna folkgrupps roll i kriget är fortfarande omstridd mellan Grekland och Nordmakedonien.
Figures for fighters, deaths, children and refugees vary widely between sources and between the two sides’ accounts; the numbers here are approximate.: Siffrorna för stridande, döda, barn och flyktingar varierar kraftigt mellan källorna och mellan de båda sidornas framställningar; siffrorna här är ungefärliga.
