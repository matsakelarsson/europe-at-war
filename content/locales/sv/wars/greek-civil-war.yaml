In June 1948 the government army opened Operation Koronis against Grammos, with aircraft and heavy artillery. After two months of fighting the Democratic Army slipped away through Albania to Vitsi and in the autumn beat off attacks there. The split between Tito and Stalin that summer divided the communist camp. The KKE sided with Moscow, its leader Nikos Zachariadis removed Markos Vafiadis and committed the Democratic Army to holding ground in pitched battles. In January 1949 Marshal Alexandros Papagos took command of the government army, which first cleared the Peloponnese and central Greece.: I juni 1948 inledde regeringsarmén Operation Koronis mot Grammos, med flyg och tungt artilleri. Efter två månaders strider tog sig Demokratiska armén undan genom Albanien till Vitsi och slog under hösten tillbaka anfall där. Brytningen mellan Tito och Stalin samma sommar splittrade det kommunistiska lägret. KKE ställde sig på Moskvas sida, och partiledaren Nikos Zachariadis avsatte Markos Vafiadis och band Demokratiska armén vid att hålla terräng i öppna fältslag. I januari 1949 tog fältmarskalk Alexandros Papagos befälet över regeringsarmén, som först rensade Peloponnesos och centrala Grekland.
In July 1949 Yugoslavia closed its border to the Democratic Army. In August the government army, now far larger and supported by American-supplied aircraft dropping bombs and napalm, launched Operation Pyrsos (“Torch”). It took Vitsi between 10 and 16 August and then Grammos between 24 and 30 August. The surviving guerrillas, several thousand men and women, crossed into Albania, whose government threatened to cut off their supplies if they went back into Greece.: I juli 1949 stängde Jugoslavien sin gräns för Demokratiska armén. I augusti inledde regeringsarmén, nu mycket större och understödd av amerikanskt levererat flyg som fällde bomber och napalm, Operation Pyrsos (”Facklan”). Den intog Vitsi mellan den 10 och 16 augusti och därefter Grammos mellan den 24 och 30 augusti. De överlevande gerillasoldaterna, flera tusen män och kvinnor, gick över gränsen till Albanien, vars regering hotade att strypa deras försörjning om de återvände till Grekland.
