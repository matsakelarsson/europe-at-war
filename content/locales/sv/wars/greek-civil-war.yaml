When the Germans left Greece in October 1944, the left-wing National Liberation Front (EAM) and its army, ELAS, controlled most of the countryside. The government of national unity under Georgios Papandreou came back from exile with British troops under General Ronald Scobie. A dispute over disarming the resistance armies led EAM’s ministers to resign, and on 3 December police fired on an EAM demonstration in Syntagma Square in Athens, killing more than 28 people. Weeks of fighting followed in Athens and Piraeus between ELAS on one side and government forces and British troops, reinforced and backed by aircraft, on the other. Both sides killed prisoners and hostages.: När tyskarna lämnade Grekland i oktober 1944 kontrollerade den vänsterorienterade Nationella befrielsefronten (EAM) och dess armé, ELAS, större delen av landsbygden. Den nationella samlingsregeringen under Georgios Papandreou återvände från exilen med brittiska trupper under general Ronald Scobie. En tvist om avväpningen av motståndsarméerna fick EAM:s ministrar att avgå, och den 3 december öppnade polisen eld mot en EAM-demonstration på Syntagmatorget i Aten och dödade mer än 28 människor. Därefter följde veckor av strider i Aten och Pireus mellan ELAS å ena sidan och regeringsstyrkor och brittiska trupper, förstärkta och understödda av flyg, å den andra. Båda sidor dödade fångar och gisslan.
ELAS agreed to a truce in January 1945, and by the Varkiza Agreement of 12 February it handed in its weapons in return for an amnesty for political offences and the promise of a plebiscite and elections. The amnesty was hardly kept. In what the left called the White Terror, gendarmes and right-wing bands such as Grivas’s Organisation X killed, beat and imprisoned thousands of leftists, while some former ELAS fighters hid their weapons or fled to Yugoslavia. The KKE boycotted the elections of March 1946, and a plebiscite in September brought back King George II.: ELAS gick med på ett stillestånd i januari 1945, och genom Varkizaavtalet den 12 februari lämnade organisationen in sina vapen i utbyte mot amnesti för politiska brott och löften om folkomröstning och val. Amnestin hölls knappast. Under det som vänstern kallade den vita terrorn dödade, misshandlade och fängslade gendarmer och högerband som Grivas Organisation X tusentals vänsteranhängare, medan en del tidigare ELAS-soldater gömde sina vapen eller flydde till Jugoslavien. KKE bojkottade valet i mars 1946, och en folkomröstning i september förde tillbaka kung Georg II.
