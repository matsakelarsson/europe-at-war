The Democratic Army’s attempt to take a town for its Provisional Democratic Government failed after two weeks in the snow.: Demokratiska arméns försök att inta en stad åt sin provisoriska demokratiska regering misslyckades efter två veckor i snön.
Yugoslav border: Jugoslaviska gränsen
Fighters and supplies crossed from camps and hospitals in Yugoslavia, Albania and Bulgaria, out of reach of the Greek army.: Stridande och förnödenheter kom över gränsen från läger och sjukhus i Jugoslavien, Albanien och Bulgarien, utom räckhåll för den grekiska armén.
At its height in 1948 the Democratic Army had more than 20,000 fighters, many of them women and some conscripted in the villages it held. It controlled the mountains from Grammos and Vitsi on the northern border down the Pindus to Agrafa, with bands on Olympus, in Central Greece and the Peloponnese. It raided towns, mined roads and executed people it saw as informers. The government army, enlarged and re-equipped by the United States, cleared villagers from the mountains to cut the guerrillas off from food and recruits, and by 1949 about 700,000 people had been uprooted inside Greece.: På sin höjdpunkt 1948 hade Demokratiska armén mer än 20 000 stridande, många av dem kvinnor och en del tvångsrekryterade i de byar den höll. Den kontrollerade bergen från Grammos och Vitsi vid den norra gränsen ned längs Pindos till Agrafa, med band på Olympen, i Mellersta Grekland och på Peloponnesos. Den angrep städer, minerade vägar och avrättade människor som den såg som angivare. Regeringsarmén, som utökats och omutrustats av USA, tömde bergen på bybor för att skära av gerillan från mat och rekryter, och 1949 hade omkring 700 000 människor drivits från sina hem inom Grekland.
From March 1948 the Democratic Army took about 25,000 children from the areas it held to Yugoslavia, Albania, Bulgaria and other communist countries. The KKE called it a rescue from the war; the government and most Greeks called it the paidomazoma, a seizure of children. The government in turn placed thousands of children in homes run under Queen Frederica. Tens of thousands of leftists and suspects were sent to island camps such as Makronisos, and courts martial passed thousands of death sentences. In January and February 1949 the Democratic Army raided Naousa and Karpenisi but failed to take Florina.: Från mars 1948 förde Demokratiska armén omkring 25 000 barn från de områden den höll till Jugoslavien, Albanien, Bulgarien och andra kommunistiska länder. KKE kallade det en räddning undan kriget; regeringen och de flesta greker kallade det paidomazoma, ett barnrov. Regeringen placerade i sin tur tusentals barn i hem som drevs under drottning Fredrika. Tiotusentals vänsteranhängare och misstänkta skickades till ö-läger som Makronisos, och krigsrätter avkunnade tusentals dödsdomar. I januari och februari 1949 angrep Demokratiska armén Naousa och Karpenisi men misslyckades med att inta Florina.
