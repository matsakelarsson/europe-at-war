On the night before the elections of 31 March 1946, about 30 former ELAS fighters attacked the police station at Litochoro, below Mount Olympus, the event usually taken as the start of the civil war. Armed bands, many formed by men escaping persecution, regrouped in the northern mountains with bases and supplies across the border in Yugoslavia, Albania and Bulgaria. In October 1946 the KKE set up a general headquarters under Markos Vafiadis, renamed the Democratic Army of Greece in December. By the end of the year it had about 16,000 fighters.: Natten före valet den 31 mars 1946 anföll omkring 30 tidigare ELAS-soldater polisstationen i Litochoro, nedanför berget Olympen, en händelse som vanligen räknas som inbördeskrigets början. Väpnade band, många bildade av män som undkommit förföljelse, omgrupperade i bergen i norr med baser och förnödenheter på andra sidan gränsen i Jugoslavien, Albanien och Bulgarien. I oktober 1946 upprättade KKE ett generalhögkvarter under Markos Vafiadis, som i december döptes om till Greklands demokratiska armé. Vid årets slut hade den omkring 16 000 stridande.
Britain, short of money, told Washington in February 1947 that it could no longer support Greece. On 12 March President Harry Truman asked Congress for aid to Greece and Turkey, and American money, weapons and military advisers took Britain’s place. On 24 December 1947 the KKE announced a Provisional Democratic Government in the mountains, and the government in Athens outlawed the party. The next day the Democratic Army attacked Konitsa, near the Albanian border, hoping to make it a capital, but was beaten off with heavy losses by early January.: Storbritannien, som saknade pengar, meddelade Washington i februari 1947 att landet inte längre kunde stödja Grekland. Den 12 mars bad president Harry Truman kongressen om bistånd till Grekland och Turkiet, och amerikanska pengar, vapen och militära rådgivare tog Storbritanniens plats. Den 24 december 1947 utropade KKE en provisorisk demokratisk regering i bergen, och regeringen i Aten förbjöd partiet. Dagen därpå anföll Demokratiska armén Konitsa, nära den albanska gränsen, i hopp om att göra staden till huvudstad, men slogs tillbaka med svåra förluster i början av januari.
