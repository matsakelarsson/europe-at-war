On 16 October 1949 the KKE’s radio station announced a “ceasefire”, presenting it as a pause rather than a defeat, and the war was over. Most estimates put the dead of 1946–1949 at around 50,000 soldiers, guerrillas and civilians, and some much higher. Thousands of fighters and party members, with their families and the children taken in 1948, went into exile in the Soviet Union and Eastern Europe, many of them for decades. Those captured in Greece faced courts martial and island camps; some, such as the communist Nikos Beloyannis in 1952, were executed.: Den 16 oktober 1949 meddelade KKE:s radiostation ett ”eldupphör”, som framställdes som ett uppehåll snarare än ett nederlag, och kriget var över. De flesta uppskattningar anger de döda 1946–1949 till omkring 50 000 soldater, gerillasoldater och civila, och vissa betydligt fler. Tusentals stridande och partimedlemmar gick, med sina familjer och de barn som förts bort 1948, i exil i Sovjetunionen och Östeuropa, många av dem i årtionden. De som tillfångatogs i Grekland ställdes inför krigsrätt och skickades till ö-läger; en del, som kommunisten Nikos Belojannis 1952, avrättades.
The victory kept Greece in the Western camp, and it joined NATO in 1952, but it also left a deeply divided country. For a quarter of a century the left was shut out of public life by certificates of political reliability, internal exile and the ban on the KKE, which the military dictatorship of 1967–1974 tightened. The KKE was legalised after the junta fell in 1974. In 1982 political refugees “Greek by birth” were allowed back, a rule that excluded many Slavic Macedonians, and in 1989 parliament recognised the war officially as a civil war.: Segern höll kvar Grekland i det västliga lägret, och landet gick med i Nato 1952, men den lämnade också efter sig ett djupt splittrat land. Under ett kvarts sekel stängdes vänstern ute från det offentliga livet genom intyg om politisk pålitlighet, intern förvisning och förbudet mot KKE, som militärdiktaturen 1967–1974 skärpte. KKE legaliserades sedan juntan fallit 1974. År 1982 fick politiska flyktingar som var ”greker till börden” återvända, en regel som uteslöt många slaviska makedonier, och 1989 erkände parlamentet officiellt kriget som ett inbördeskrig.
