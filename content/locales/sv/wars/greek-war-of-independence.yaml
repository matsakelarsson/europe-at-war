With the immediate danger past, the Greek leaders fell out. The captains and notables of the Peloponnese around Kolokotronis opposed the islanders and Roumeliots, and by early 1824 there were rival governments at Tripolitsa and Kranidi. The government of Georgios Kountouriotis won two short civil wars in 1824, helped by loans raised in London, and in early 1825 imprisoned Kolokotronis on Hydra. Lord Byron, who had come to Greece with money and supplies, died of fever at Missolonghi on 19 April 1824. Sultan Mahmud II, meanwhile, turned to Muhammad Ali of Egypt, whose French-trained army had already crushed the rising in Crete.: När den omedelbara faran var över blev de grekiska ledarna osams. Peloponnesos kaptener och notabler kring Kolokotronis stod mot öborna och rumelioterna, och i början av 1824 fanns rivaliserande regeringar i Tripolitsa och Kranidi. Georgios Kountouriotis regering vann två korta inbördeskrig 1824, med hjälp av lån som tagits upp i London, och fängslade i början av 1825 Kolokotronis på Hydra. Lord Byron, som hade kommit till Grekland med pengar och förnödenheter, dog i feber i Missolonghi den 19 april 1824. Sultan Mahmud II vände sig under tiden till Muhammad Ali av Egypten, vars fransktränade armé redan hade krossat upproret på Kreta.
In June 1824 an Egyptian fleet took Kasos, and in the summer an Ottoman fleet stormed Psara; thousands of islanders were killed or enslaved, and the last defenders blew up the island’s fort with themselves and their attackers. A Greek victory at Gerontas in September saved Samos. In February 1825 Muhammad Ali’s son Ibrahim Pasha landed at Methoni. He took Sphacteria and Navarino in May, killed Papaflessas and his men at Maniaki on 1 June, and entered Tripolitsa and Argos, but was held at the mills of Lerna outside Nafplio. The government released Kolokotronis, but by the end of the year Ibrahim held much of the western Peloponnese and was burning the countryside.: I juni 1824 intog en egyptisk flotta Kasos, och under sommaren stormade en osmansk flotta Psara; tusentals öbor dödades eller förslavades, och de sista försvararna sprängde öns fort i luften med sig själva och angriparna. En grekisk seger vid Gerontas i september räddade Samos. I februari 1825 landsteg Muhammad Alis son Ibrahim pasha i Methoni. Han intog Sfaktiria och Navarino i maj, dödade Papaflessas och hans män vid Maniaki den 1 juni och tågade in i Tripolitsa och Argos, men hejdades vid kvarnarna i Lerna utanför Nafplio. Regeringen släppte Kolokotronis, men vid årets slut höll Ibrahim stora delar av västra Peloponnesos och brände landsbygden.
