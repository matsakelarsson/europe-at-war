Greek War of Independence: Grekiska frihetskriget
A war in which Greek revolutionaries rose against Ottoman rule in 1821 and, after years of fighting, massacres on both sides and the near collapse of the revolt under Egyptian attack, won independence through the intervention of Britain, France and Russia at Navarino in 1827 and in the Morea in 1828. The London Protocol recognised Greece in 1830, and in 1832 its border was fixed on the Arta–Volos line, with Otto of Bavaria as king.: Ett krig där grekiska revolutionärer reste sig mot det osmanska styret 1821. Efter år av strider, massakrer på båda sidor och upprorets nära sammanbrott under egyptiska angrepp vann de självständighet genom Storbritanniens, Frankrikes och Rysslands ingripande vid Navarino 1827 och på Morea 1828. Londonprotokollet erkände Grekland 1830, och 1832 fastställdes gränsen längs linjen Arta–Volos, med Otto av Bayern som kung.
