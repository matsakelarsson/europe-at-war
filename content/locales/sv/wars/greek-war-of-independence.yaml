The Filiki Eteria (Society of Friends), a secret society founded by three Greek merchants in Odessa in 1814, planned a rising of the Balkan Christians against Ottoman rule. In 1820 it chose as its leader Alexander Ypsilantis, a Phanariot Greek and general in the Russian army. On 6 March 1821 he crossed the Prut from Russian Bessarabia into Moldavia with a few hundred followers and at Iași called on Greeks and all Christians to rise, hinting at Russian support. Michael Soutzos, the prince of Moldavia and himself a member of the society, put his guard at Ypsilantis’s disposal, while Eterists killed Ottoman soldiers and merchants at Galați and elsewhere.: Filiki Eteria (Vänskapssällskapet), ett hemligt sällskap som grundats av tre grekiska köpmän i Odessa 1814, planerade ett uppror bland Balkans kristna mot det osmanska styret. År 1820 valde det till sin ledare Alexandros Ypsilantis, en fanariotisk grek och general i den ryska armén. Den 6 mars 1821 gick han med några hundra anhängare över Prut från ryska Bessarabien in i Moldavien och uppmanade i Iași greker och alla kristna att resa sig, med antydningar om ryskt stöd. Michael Soutzos, furste av Moldavien och själv medlem av sällskapet, ställde sin livvakt till Ypsilantis förfogande, medan eterister dödade osmanska soldater och köpmän i Galați och på andra håll.
Tsar Alexander I disowned the rising and struck Ypsilantis off the army list, and the Patriarch in Constantinople excommunicated him. In Bucharest Ypsilantis fell out with Tudor Vladimirescu, leader of a rising of Wallachian peasants and Pandurs, whom Eterists seized and killed on 7 June. Ottoman troops had entered the principalities in May. At Drăgășani on 19 June they routed Ypsilantis’s army and destroyed the Sacred Band, a corps of young Greek volunteers. Ypsilantis fled to Austria and was held prisoner there until 1827. In Constantinople Patriarch Gregory V, though he had condemned the revolt, was hanged on Easter Sunday, 22 April, and many Greeks there and in Smyrna were killed.: Tsar Alexander I tog avstånd från upproret och strök Ypsilantis ur arméns rullor, och patriarken i Konstantinopel bannlyste honom. I Bukarest blev Ypsilantis osams med Tudor Vladimirescu, ledare för ett uppror bland valakiska bönder och pandurer, som eteristerna grep och dödade den 7 juni. Osmanska trupper hade gått in i furstendömena i maj. Vid Drăgășani den 19 juni slog de Ypsilantis armé på flykt och förintade Heliga bataljonen, en kår av unga grekiska frivilliga. Ypsilantis flydde till Österrike och hölls fången där till 1827. I Konstantinopel hängdes patriarken Gregorios V, trots att han hade fördömt revolten, på påskdagen den 22 april, och många greker där och i Smyrna dödades.
