Held by Ibrahim’s army, end of 1825 (approximate): Hållet av Ibrahims armé i slutet av 1825 (ungefärligt)
In April 1825 Mehmed Reşid Pasha besieged Missolonghi, the rebels’ stronghold in western Greece, for the third time. Protected by its lagoon and earthworks and supplied by Miaoulis’s ships, the town held out until Ibrahim joined the siege and, in the spring of 1826, took the islets of the lagoon. Starving, the garrison and townspeople tried to break out together on the night of 22–23 April 1826. The besiegers had been warned; perhaps 1,800 got through, most of the rest were killed or enslaved, and some who stayed behind blew up the powder magazine with themselves and their attackers.: I april 1825 belägrade Mehmed Reşid pasha för tredje gången Missolonghi, rebellernas fäste i västra Grekland. Skyddad av sin lagun och sina jordverk och försörjd av Miaoulis fartyg höll staden ut tills Ibrahim anslöt sig till belägringen och våren 1826 intog lagunens holmar. Svältande försökte garnisonen och stadsborna bryta sig ut tillsammans natten mellan den 22 och 23 april 1826. Belägrarna hade blivit varnade; kanske 1 800 tog sig igenom, de flesta av de övriga dödades eller förslavades, och en del som stannat kvar sprängde krutmagasinet i luften med sig själva och angriparna.
The fall of Missolonghi caused an outcry across Europe. Britain and Russia had already agreed, in the Protocol of St Petersburg of 4 April 1826, to mediate for an autonomous Greece. Ibrahim tried to break into the Mani that summer but was beaten back at Vergas and at Diros, where Maniot women helped repel a landing. Reşid marched east and by August besieged the Acropolis of Athens. Georgios Karaiskakis destroyed an Ottoman force at Arachova in November, but every attempt to relieve the Acropolis failed. The Greeks gave command of their army to the British general Sir Richard Church and of their fleet to Lord Cochrane.: Missolonghis fall väckte ramaskri i hela Europa. Storbritannien och Ryssland hade redan i Sankt Petersburgsprotokollet den 4 april 1826 kommit överens om att medla för ett autonomt Grekland. Ibrahim försökte samma sommar bryta sig in i Mani men slogs tillbaka vid Vergas och vid Diros, där maniotiska kvinnor hjälpte till att slå tillbaka en landstigning. Reşid marscherade österut och belägrade i augusti Akropolis i Aten. Georgios Karaiskakis förintade en osmansk styrka vid Arachova i november, men varje försök att undsätta Akropolis misslyckades. Grekerna gav befälet över sin armé till den brittiske generalen Sir Richard Church och över sin flotta till lord Cochrane.
