Maison: Maison
Kapodistrias ruled with a firm hand and made many enemies. In August 1831, during a revolt of the Hydriots, Miaoulis blew up the flagship Hellas and other ships at Poros rather than let them fall into government hands. On 9 October 1831 Kapodistrias was shot and stabbed at a church door in Nafplio by the brother and son of Petros Mavromichalis, whom he had imprisoned. Greece slid into civil war between the government of his brother Augustinos and the Roumeliot captains, while the powers looked for a king. Prince Leopold of Saxe-Coburg had turned the throne down in 1830, objecting among other things to the narrow frontier.: Kapodistrias styrde med fast hand och skaffade sig många fiender. I augusti 1831, under ett uppror bland hydrioterna, sprängde Miaoulis flaggskeppet Hellas och andra fartyg vid Poros hellre än att låta dem falla i regeringens händer. Den 9 oktober 1831 sköts och knivhöggs Kapodistrias vid en kyrkdörr i Nafplio av bror och son till Petros Mavromichalis, som han hade låtit fängsla. Grekland gled in i inbördeskrig mellan hans bror Augustinos regering och de rumeliotiska kaptenerna, medan stormakterna sökte efter en kung. Prins Leopold av Sachsen-Coburg hade avböjt tronen 1830, bland annat med invändningar mot den snäva gränsen.
At the London Conference the powers chose Otto, the 17-year-old son of King Ludwig I of Bavaria, and by a treaty of 7 May 1832 made Greece a kingdom under their guarantee. By the Treaty of Constantinople of 21 July 1832 the Sultan accepted a wider border on the line from the Gulf of Arta to the Gulf of Volos, in return for an indemnity of 40 million piastres. Otto landed at Nafplio on 6 February 1833 with a Bavarian regency and some 3,500 Bavarian troops. The new kingdom had about 800,000 people, less than a third of the Greeks of the Ottoman Empire, and the hope of uniting the rest, the Megali Idea, long shaped its politics.: Vid Londonkonferensen valde stormakterna Otto, 17-årig son till kung Ludwig I av Bayern, och gjorde genom ett fördrag den 7 maj 1832 Grekland till ett kungarike under sin garanti. Genom fördraget i Konstantinopel den 21 juli 1832 godtog sultanen en vidare gräns längs linjen från Artaviken till Volosviken, mot ett skadestånd på 40 miljoner piastrar. Otto landsteg i Nafplio den 6 februari 1833 med en bayersk förmyndarregering och omkring 3 500 bayerska soldater. Det nya kungariket hade omkring 800 000 invånare, mindre än en tredjedel av grekerna i Osmanska riket, och förhoppningen om att förena de övriga, Megali Idea, präglade länge dess politik.
