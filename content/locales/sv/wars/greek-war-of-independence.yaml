Codrington, de Rigny, Heiden: Codrington, de Rigny, Heiden
Kapodistrias arrived in January 1828 and set up his government on Aegina. With Russia now at war with the Ottomans, Codrington agreed with Muhammad Ali at Alexandria in August that the Egyptian army would leave the Peloponnese. A French expeditionary corps of about 15,000 men under General Nicolas-Joseph Maison landed at Petalidi on 29–30 August. Ibrahim embarked his army in September and October, and the French took over Navarino, Methoni, Koroni and Patras and stormed the Castle of the Morea at Rio on 30 October. The French lost about 1,500 men, mostly to fever and dysentery; a scientific commission came with them in 1829.: Kapodistrias anlände i januari 1828 och upprättade sin regering på Egina. Med Ryssland nu i krig med osmanerna kom Codrington i augusti överens med Muhammad Ali i Alexandria om att den egyptiska armén skulle lämna Peloponnesos. En fransk expeditionskår på omkring 15 000 man under general Nicolas-Joseph Maison landsteg vid Petalidi den 29–30 augusti. Ibrahim skeppade ut sin armé i september och oktober, och fransmännen tog över Navarino, Methoni, Koroni och Patras och stormade Moreaborgen vid Rio den 30 oktober. Fransmännen förlorade omkring 1 500 man, mest i feber och dysenteri; en vetenskaplig kommission följde med dem 1829.
Kapodistrias built a regular army, which advanced into Central Greece, and in September 1829 Dimitrios Ypsilantis, Alexander’s brother, won at Petra in Boeotia, the last battle of the war. The Ottoman troops left the land south of the Spercheios. By the Treaty of Adrianople that month the Sultan accepted the powers’ plan for an autonomous Greece. Britain and France, wary of Russian influence, preferred full independence, and on 3 February 1830 the London Protocol recognised Greece as an independent state under the three powers’ protection, with a northern border from the mouth of the Achelous to the mouth of the Spercheios. Crete stayed outside it and was handed to Muhammad Ali.: Kapodistrias byggde upp en reguljär armé, som ryckte fram in i Mellersta Grekland, och i september 1829 segrade Dimitrios Ypsilantis, Alexandros bror, vid Petra i Boeotien, krigets sista slag. De osmanska trupperna lämnade landet söder om Spercheios. Genom freden i Adrianopel samma månad godtog sultanen stormakternas plan för ett autonomt Grekland. Storbritannien och Frankrike, som var på sin vakt mot ryskt inflytande, föredrog full självständighet, och den 3 februari 1830 erkände Londonprotokollet Grekland som en självständig stat under de tre stormakternas beskydd, med en nordgräns från Acheloos mynning till Spercheios mynning. Kreta lämnades utanför och överlämnades till Muhammad Ali.
