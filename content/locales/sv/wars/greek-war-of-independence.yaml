Karaiskakis trapped an Ottoman column of about 2,000 men below Parnassus and destroyed most of it.: Karaiskakis stängde in en osmansk kolonn på omkring 2 000 man nedanför Parnassos och förintade större delen av den.
Reşid Pasha: Reşid pasha
On 6 May 1827 a Greek army trying to relieve the Acropolis was routed at Phaleron, two days after Karaiskakis had been mortally wounded, and on 5 June the garrison surrendered on terms. The National Assembly at Troezen elected Ioannis Kapodistrias, a Corfiot who had been Russia’s foreign minister, as governor of Greece. By the Treaty of London of 6 July Britain, France and Russia agreed to demand an armistice and to impose one if either side refused. The Greeks accepted, but the Porte rejected the demand, and the allied admirals Edward Codrington, Henri de Rigny and Lodewijk van Heiden were sent to stop supplies reaching Ibrahim.: Den 6 maj 1827 slogs en grekisk armé som försökte undsätta Akropolis på flykt vid Faleron, två dagar sedan Karaiskakis blivit dödligt sårad, och den 5 juni kapitulerade garnisonen på villkor. Nationalförsamlingen i Troizen valde Ioannis Kapodistrias, en korfiot som varit Rysslands utrikesminister, till Greklands guvernör. Genom Londonfördraget den 6 juli kom Storbritannien, Frankrike och Ryssland överens om att kräva ett vapenstillestånd och att framtvinga ett om någon av sidorna vägrade. Grekerna accepterade, men Höga porten avvisade kravet, och de allierade amiralerna Edward Codrington, Henri de Rigny och Lodewijk van Heiden sändes för att hindra förnödenheter från att nå Ibrahim.
The Ottoman and Egyptian fleet lay at anchor in Navarino Bay. On 20 October the 22 allied ships sailed in, and when a boat was fired on near an Egyptian fire ship a general battle began. In about four hours the heavier allied gunnery destroyed the fleet at anchor; of 78 Ottoman and Egyptian vessels just eight remained seaworthy. By one count about 3,000 Ottoman and Egyptian sailors were killed, against 181 allied dead. It was the last great battle fought entirely by sailing ships. George IV called it an “untoward event”, but it ended any chance of crushing the revolt, and in April 1828 Russia went to war with the Ottomans.: Den osmanska och egyptiska flottan låg för ankar i Navarinobukten. Den 20 oktober seglade de 22 allierade fartygen in, och när en båt besköts nära en egyptisk brännare bröt ett allmänt slag ut. På omkring fyra timmar förstörde det tyngre allierade artilleriet den ankrade flottan; av 78 osmanska och egyptiska fartyg var bara åtta fortfarande sjödugliga. Enligt en beräkning dödades omkring 3 000 osmanska och egyptiska sjömän, mot 181 allierade döda. Det var det sista stora slaget som helt utkämpades av segelfartyg. Georg IV kallade det en ”olycklig händelse”, men det gjorde slut på varje möjlighet att krossa upproret, och i april 1828 gick Ryssland i krig mot osmanerna.
