The Peloponnese, the Morea, rose in late March 1821, while its governor, Hurshid Pasha, and many of his troops were away besieging Ali Pasha at Ioannina. The Maniots under Petros Mavromichalis declared war at Areopoli and, with Theodoros Kolokotronis and the priest Papaflessas, took Kalamata on 4 April; the story that Metropolitan Germanos raised the banner at Agia Lavra on 25 March (Julian) is doubted by historians. Within weeks the Greeks held the countryside. Muslims fled into the fortresses of Patras, Acrocorinth, Nafplio, Monemvasia, Navarino and Tripolitsa, and thousands who could not reach them were killed.: Peloponnesos, Morea, reste sig i slutet av mars 1821, medan dess guvernör, Hurşid pasha, och många av hans trupper var borta och belägrade Ali pasha i Ioannina. Manioterna under Petros Mavromichalis förklarade krig i Areopoli och intog, tillsammans med Theodoros Kolokotronis och prästen Papaflessas, Kalamata den 4 april; berättelsen om att metropoliten Germanos höjde fanan i Agia Lavra den 25 mars (julianska kalendern) betvivlas av historiker. Inom några veckor höll grekerna landsbygden. Muslimer flydde in i fästningarna i Patras, Akrokorinth, Nafplio, Monemvasia, Navarino och Tripolitsa, och tusentals som inte kunde nå dem dödades.
The rising spread to Central Greece and to the islands of Hydra, Spetses and Psara, whose merchant ships, fitted with light guns and fire ships, became the Greek navy. Athanasios Diakos was captured at Alamana and executed, but Odysseas Androutsos held up the Ottoman advance at the Gravia inn, and a relief army was destroyed at Vasilika in August. In the Morea Kolokotronis besieged Tripolitsa, the provincial capital, and beat off a sortie at Valtetsi in May. On 5 October the besiegers broke in and for days slaughtered the town’s Muslim and Jewish inhabitants; estimates of the dead range from about 6,000 to 8,000 or more.: Upproret spred sig till Mellersta Grekland och till öarna Hydra, Spetses och Psara, vars handelsfartyg, försedda med lätta kanoner och brännare, blev den grekiska flottan. Athanasios Diakos tillfångatogs vid Alamana och avrättades, men Odysseas Androutsos hejdade den osmanska framryckningen vid värdshuset i Gravia, och en undsättningsarmé förintades vid Vasilika i augusti. På Morea belägrade Kolokotronis Tripolitsa, provinshuvudstaden, och slog tillbaka ett utfall vid Valtetsi i maj. Den 5 oktober bröt sig belägrarna in och slaktade i flera dagar stadens muslimska och judiska invånare; uppskattningarna av antalet döda varierar från omkring 6 000 till 8 000 eller fler.
