Dates are New Style (Gregorian). The Greeks used the Julian calendar, then twelve days behind, so Greek accounts date the start of the rising in the Peloponnese to 25 March 1821 (6 April New Style), celebrated as Independence Day, and the exodus from Missolonghi to 10 April 1826. Some dates are given in both styles.: Datumen följer nya stilen (den gregorianska kalendern). Grekerna använde den julianska kalendern, som då låg tolv dagar efter, så grekiska framställningar daterar upprorets början på Peloponnesos till den 25 mars 1821 (6 april enligt nya stilen), som firas som självständighetsdagen, och uttåget från Missolonghi till den 10 april 1826. Vissa datum anges enligt båda stilarna.
Numbers of dead in the massacres, Greek and Ottoman alike, are disputed; the figures given are estimates.: Antalet döda i massakrerna, grekiska som osmanska, är omstritt; de angivna siffrorna är uppskattningar.
The Morea is the Peloponnese, Roumeli is Central Greece, Tripolitsa is today’s Tripoli, Navarino is Pylos and Missolonghi is Mesolongi.: Morea är Peloponnesos, Rumelien är Mellersta Grekland, Tripolitsa är dagens Tripoli, Navarino är Pylos och Missolonghi är Mesolongi.
