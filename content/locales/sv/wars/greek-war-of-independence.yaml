In January 1822 the First National Assembly at Epidaurus declared Greece independent and adopted a provisional constitution, with the Phanariot Alexandros Mavrokordatos at the head of the executive. In March armed men from Samos landed on Chios and roused part of the population. In April the Kapudan Pasha, Nasuhzade Ali Pasha, landed troops who over the following weeks killed or enslaved most of the island’s Greeks; estimates of the dead run from about 25,000 upwards, and tens of thousands more were sold as slaves. On the night of 18–19 June Konstantinos Kanaris steered a fire ship against the Ottoman flagship off Chios, and the Kapudan Pasha died with most of those on board.: I januari 1822 förklarade den första nationalförsamlingen i Epidauros Grekland självständigt och antog en provisorisk författning, med fanarioten Alexandros Mavrokordatos i spetsen för den verkställande makten. I mars landsteg beväpnade män från Samos på Chios och fick en del av befolkningen att resa sig. I april landsatte kapudan pasha, Nasuhzade Ali pasha, trupper som under de följande veckorna dödade eller förslavade de flesta av öns greker; uppskattningarna av antalet döda börjar vid omkring 25 000, och ytterligare tiotusentals såldes som slavar. Natten mellan den 18 och 19 juni styrde Konstantinos Kanaris en brännare mot det osmanska flaggskeppet utanför Chios, och kapudan pasha omkom tillsammans med de flesta ombord.
In the west, Mavrokordatos’s army and its battalion of foreign volunteers were routed at Peta near Arta on 16 July. That month Mahmud Dramali Pasha marched south from Larissa with more than 20,000 men, took Corinth and reached Argos, but the Greeks had burned the crops and held the hills. Short of food and water, Dramali turned back, and on 6–8 August Kolokotronis’s men ambushed his army in the Dervenakia defile and the passes near it, destroying much of it and taking its baggage. The Acropolis of Athens had surrendered to the Greeks in June, Nafplio followed in December, and Missolonghi beat off a first siege.: I väster slogs Mavrokordatos armé och dess bataljon av utländska frivilliga på flykt vid Peta nära Arta den 16 juli. Samma månad marscherade Mahmud Dramali pasha söderut från Larissa med mer än 20 000 man, intog Korinth och nådde Argos, men grekerna hade bränt skördarna och höll höjderna. Med brist på mat och vatten vände Dramali, och den 6–8 augusti överföll Kolokotronis män hans armé i Dervenakiapasset och passen i närheten, förintade en stor del av den och tog dess tross. Akropolis i Aten hade kapitulerat för grekerna i juni, Nafplio följde i december, och Missolonghi slog tillbaka en första belägring.
