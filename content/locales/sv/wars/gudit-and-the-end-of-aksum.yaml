# Svenska översättningar av katalogtexten (våg 12); stegtexterna kommer senare.
Gudit and the end of Aksum: Gudit och slutet för Aksum
? The tradition of a queen who destroyed the last Christian kingdom of Aksum in the second half of the 10th century. Ethiopian tradition calls her Gudit or Yodit (Judith) and remembers her as a non-Christian, in some versions Jewish, who burned the churches of Aksum, sacked the monastery of Debre Damo, killed the princes of the royal house and ruled for about forty years. Two outside sources seem to speak of her. The Arab geographer Ibn Hawqal, writing between about 943 and 977, says that a woman had ruled the land of the Habasha for many years, had killed their king, called the hadani, and still held her own country. The History of the Patriarchs of Alexandria tells of a king of Abyssinia who wrote to King George II of Makuria, in the time of Patriarch Philotheos (979–1003), that a queen of the Bani al-Hamwiya had ravaged his country, burned its churches and driven him from place to place, and asked him to obtain a new bishop. Who she was is not known. Scholars have proposed a queen of Damot, a non-Christian kingdom in the south (Carlo Conti Rossini), a Cushitic-speaking queen from the Lake Hayq region (Tekeste Negash) and a convert to Judaism; Steven Kaplan and others doubt that she was Jewish. The sources are few, late and contradictory, and the identification of the Arab writers’ queen with the Gudit of tradition is not certain. Most historians agree that Aksum’s power ended in this period and that the Zagwe dynasty rose in Lasta in the next century and a half.
: Traditionen om en drottning som förstörde det sista kristna kungariket Aksum under andra hälften av 900-talet. Den etiopiska traditionen kallar henne Gudit eller Yodit (Judit) och minns henne som icke-kristen, i vissa versioner judisk, och som den som brände Aksums kyrkor, plundrade klostret Debre Damo, dödade furstarna av kungahuset och regerade i omkring fyrtio år. Två utomstående källor tycks tala om henne. Den arabiske geografen Ibn Hawqal, som skrev mellan omkring 943 och 977, berättar att en kvinna hade härskat över habashas land i många år, hade dödat deras kung, som kallades hadani, och fortfarande behärskade sitt eget land. Alexandrias patriarkers historia berättar om en kung av Abessinien som på patriarken Philotheos tid (979–1003) skrev till kung Georg II av Makuria att en drottning av Bani al-Hamwiya hade härjat hans land, bränt dess kyrkor och drivit honom från plats till plats, och bad honom skaffa en ny biskop. Vem hon var är okänt. Forskare har föreslagit en drottning av Damot, ett icke-kristet kungarike i söder (Carlo Conti Rossini), en kushitisktalande drottning från trakten kring Hayqsjön (Tekeste Negash) och en konvertit till judendomen; Steven Kaplan och andra betvivlar att hon var judisk. Källorna är få, sena och motsägelsefulla, och identifieringen av de arabiska författarnas drottning med traditionens Gudit är inte säker. De flesta historiker är eniga om att Aksums makt upphörde under denna period och att Zagwedynastin växte fram i Lasta under de följande hundrafemtio åren.
