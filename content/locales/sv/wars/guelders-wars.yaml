Guelders Wars: Geldernkrigen
Forty years of intermittent war between the dukes of Guelders and the Habsburg rulers of the Netherlands. Charles of Egmond, who had won back his duchy in 1492, fought Philip the Fair, Margaret of Austria and Charles V with French support, and for a time held Groningen, Friesland and the lands of Utrecht. The wars were mostly raids, ambushes and sieges rather than battles, but civilians suffered badly; the Guelders commander Maarten van Rossum sacked The Hague in 1528 and besieged Antwerp in 1542. Charles V gradually took Friesland, Utrecht and Groningen, and after he destroyed the town of Düren in 1543, Duke William of Jülich-Cleves gave up Guelders and Zutphen in the Treaty of Venlo, bringing all the northern Low Countries under Habsburg rule.: Fyrtio år av återkommande krig mellan hertigarna av Geldern och Nederländernas habsburgska härskare. Karl av Egmond, som hade återvunnit sitt hertigdöme 1492, bekämpade med franskt stöd Filip den sköne, Margareta av Österrike och Karl V och höll en tid Groningen, Friesland och Utrechts länder. Krigen bestod mest av räder, bakhåll och belägringar snarare än fältslag, men civilbefolkningen led svårt; Gelderns befälhavare Maarten van Rossum plundrade Haag 1528 och belägrade Antwerpen 1542. Karl V tog efter hand Friesland, Utrecht och Groningen, och sedan han förstört staden Düren 1543 avstod hertig Vilhelm av Jülich-Kleve Geldern och Zutphen i freden i Venlo, vilket förde hela norra Nederländerna under habsburgskt styre.
