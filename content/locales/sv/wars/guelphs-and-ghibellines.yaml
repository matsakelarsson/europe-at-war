The Guelph families fled without a fight, and the Ghibelline exiles came home with Manfred’s vicar, Guido Novello.: De guelfiska släkterna flydde utan strid, och de ghibellinska landsflyktingarna återvände hem med Manfreds ståthållare Guido Novello.
