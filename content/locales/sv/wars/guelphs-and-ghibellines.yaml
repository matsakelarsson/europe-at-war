The parties took their names from the Welf dynasty and the Hohenstaufen castle of Waiblingen. In Tuscany they were as much about rivalries between cities and feuds between families as about pope and emperor, and the losing party in a city was usually exiled.: Partierna fick sina namn efter welfernas dynasti och hohenstaufernas borg Waiblingen. I Toscana handlade de lika mycket om rivalitet mellan städer och fejder mellan släkter som om påve och kejsare, och det förlorande partiet i en stad landsförvisades vanligen.
Cities changed sides. Siena was Ghibelline until 1269–1270 and Guelph afterwards; Lucca was Guelph until Uguccione della Faggiuola and Castruccio Castracani ruled it (1314–1328). Arezzo and Pisa were the main Ghibelline cities.: Städerna bytte sida. Siena var ghibellinskt fram till 1269–1270 och guelfiskt därefter; Lucca var guelfiskt tills Uguccione della Faggiuola och Castruccio Castracani styrde staden (1314–1328). Arezzo och Pisa var de viktigaste ghibellinska städerna.
The struggles in Lombardy, Romagna and the March of Treviso, and the split of Florence’s Guelphs into Whites and Blacks that exiled Dante in 1302, are not told here.: Striderna i Lombardiet, Romagna och marken Treviso, liksom splittringen av Florens guelfer i vita och svarta som landsförvisade Dante 1302, berättas inte här.
