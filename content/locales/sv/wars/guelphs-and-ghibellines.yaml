After Frederick II’s death the struggle between Guelphs and Ghibellines went on in every city of Tuscany, where it merged with family feuds and rivalries between neighbouring towns. In Florence a new popular government took power in 1250, and in 1258 the Guelphs drove out the leading Ghibelline families, headed by the Uberti, who went to Siena. Siena, Florence’s old rival, was Ghibelline and looked for help to Frederick’s son Manfred, who had made himself King of Sicily in 1258 and sent it German cavalry.: Efter Fredrik II:s död fortsatte kampen mellan guelfer och ghibelliner i varje stad i Toscana, där den flöt samman med släktfejder och rivalitet mellan grannstäder. I Florens tog en ny folklig regering makten 1250, och 1258 drev guelferna ut de ledande ghibellinska släkterna med Uberti i spetsen, som begav sig till Siena. Siena, Florens gamla rival, var ghibellinskt och sökte hjälp hos Fredriks son Manfred, som 1258 hade gjort sig till kung av Sicilien och sände staden tyskt kavalleri.
In 1260 Florence and its Guelph allies, Lucca among them, marched on Siena with a large army. On 4 September, at Montaperti on the Arbia, the Sienese, the Florentine exiles under Farinata degli Uberti and Manfred’s Germans routed them. By tradition the battle turned when Bocca degli Abati, a Ghibelline in the Florentine ranks, cut off the hand of the standard-bearer. Thousands were killed or captured and the Florentine carroccio was taken. The Guelphs fled Florence, and at a meeting of the Ghibelline cities at Empoli, Farinata alone spoke against razing it. After Manfred fell at Benevento in 1266, the Guelphs returned to Florence for good.: År 1260 tågade Florens och dess guelfiska allierade, bland dem Lucca, mot Siena med en stor här. Den 4 september, vid Montaperti vid floden Arbia, slogs de på flykten av sieneserna, de florentinska landsflyktingarna under Farinata degli Uberti och Manfreds tyskar. Enligt traditionen vände slaget när Bocca degli Abati, en ghibellin i de florentinska leden, högg av handen på fanbäraren. Tusentals dödades eller tillfångatogs och den florentinska carroccion erövrades. Guelferna flydde från Florens, och vid ett möte mellan de ghibellinska städerna i Empoli var Farinata ensam om att tala emot att staden skulle jämnas med marken. Sedan Manfred stupat vid Benevento 1266 återvände guelferna till Florens för gott.
