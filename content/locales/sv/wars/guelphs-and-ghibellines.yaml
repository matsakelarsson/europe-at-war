Siena and Pisa wanted Florence destroyed. Farinata’s refusal saved it, as Dante has him recall in the Inferno.: Siena och Pisa ville att Florens skulle förstöras. Farinatas vägran räddade staden, vilket Dante låter honom minnas i Inferno.
Florentine army: Florentinska hären
With Charles of Anjou, the papacy’s champion and now King of Sicily, as their protector, the Guelphs took over most of Tuscany. In June 1269 the Florentines and French knights beat the Sienese at Colle di Val d’Elsa, where Siena’s Ghibelline leader Provenzan Salvani was killed, and Siena itself soon came under Guelph rule. Pisa and Arezzo remained the Ghibellines’ strongholds. Pisa was crippled by its defeat by Genoa at Meloria in 1284, and the Guelph cities joined in the war against it. In Arezzo the Ghibelline nobles, led by the warlike bishop Guglielmino degli Ubertini, drove out the Guelphs in 1287.: Med Karl av Anjou, påvedömets förkämpe och nu kung av Sicilien, som beskyddare tog guelferna kontrollen över större delen av Toscana. I juni 1269 besegrade florentinarna och franska riddare sieneserna vid Colle di Val d’Elsa, där Sienas ghibellinske ledare Provenzan Salvani dödades, och Siena kom snart självt under guelfiskt styre. Pisa och Arezzo förblev ghibellinernas fästen. Pisa lamslogs av sitt nederlag mot Genua vid Meloria 1284, och de guelfiska städerna anslöt sig till kriget mot staden. I Arezzo drev de ghibellinska adelsmännen, ledda av den krigiske biskopen Guglielmino degli Ubertini, ut guelferna 1287.
In June 1289 Florence and its Guelph allies, under the Angevin captain Amerigo of Narbonne, marched over the hills into the Casentino against Arezzo. On 11 June they met the Aretines on the plain of Campaldino below Poppi. The Ghibelline cavalry charged and drove back the Florentine front line, in which the young Dante Alighieri rode, but the Guelph infantry held, and a flank attack by the reserve under Corso Donati decided the day. Bishop Guglielmino and Buonconte da Montefeltro were among the many Aretines killed. Ghibelline power in Tuscany never fully recovered.: I juni 1289 tågade Florens och dess guelfiska allierade under den angevinske befälhavaren Amerigo av Narbonne över bergen in i Casentino mot Arezzo. Den 11 juni mötte de aretinerna på Campaldinoslätten nedanför Poppi. Det ghibellinska kavalleriet anföll och drev tillbaka den florentinska främsta linjen, där den unge Dante Alighieri red, men det guelfiska fotfolket höll stånd, och ett flankanfall av reserven under Corso Donati avgjorde slaget. Biskop Guglielmino och Buonconte da Montefeltro var bland de många aretiner som dödades. Ghibellinernas makt i Toscana återhämtade sig aldrig helt.
