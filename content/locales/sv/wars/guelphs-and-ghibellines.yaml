The Ghibellines’ hopes revived when the King of the Romans, Henry VII, came to Italy in 1310 to be crowned emperor. Florence led the resistance. Henry besieged it in vain in the autumn of 1312 and died near Siena in August 1313, as he was preparing to attack Robert of Anjou, King of Naples. His captain Uguccione della Faggiuola became lord of Pisa and, in 1314, of Lucca. On 29 August 1315, at Montecatini, he routed the army of Florence and its Guelph allies, commanded by Robert’s brother Philip of Taranto; Philip’s brother Peter and his son Charles were among the dead.: Ghibellinernas förhoppningar väcktes på nytt när den romerske kungen Henrik VII kom till Italien 1310 för att krönas till kejsare. Florens ledde motståndet. Henrik belägrade staden förgäves hösten 1312 och dog nära Siena i augusti 1313, när han förberedde ett anfall mot Robert av Anjou, kung av Neapel. Hans befälhavare Uguccione della Faggiuola blev herre över Pisa och 1314 över Lucca. Den 29 augusti 1315 vid Montecatini slog han på flykten den här som Florens och dess guelfiska allierade ställt upp under befäl av Roberts bror Filip av Taranto; Filips bror Peter och hans son Karl var bland de döda.
In 1316 Pisa and Lucca threw out Uguccione, and Lucca came under one of his captains, Castruccio Castracani, a gifted soldier who built up a strong state in western Tuscany. On 23 September 1325 at Altopascio he beat a large Florentine army under the Catalan Ramon de Cardona, who was taken prisoner, and raided up to Florence’s walls, holding races outside its gates in mockery. Florence put itself under Robert’s son Charles of Calabria. The emperor Louis IV made Castruccio Duke of Lucca in 1327, but Castruccio died of fever on 3 September 1328, and his state fell apart.: År 1316 kastade Pisa och Lucca ut Uguccione, och Lucca kom under en av hans befälhavare, Castruccio Castracani, en begåvad krigare som byggde upp en stark stat i västra Toscana. Den 23 september 1325 vid Altopascio besegrade han en stor florentinsk här under katalanen Ramon de Cardona, som togs till fånga, och gjorde räder ända fram till Florens murar, där han till hån höll kapplöpningar utanför stadsportarna. Florens ställde sig under Roberts son Karl av Kalabrien. Kejsar Ludvig IV gjorde Castruccio till hertig av Lucca 1327, men Castruccio dog i feber den 3 september 1328, och hans stat föll sönder.
