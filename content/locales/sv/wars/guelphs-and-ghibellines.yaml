Guelph and Ghibelline wars in Tuscany: Guelfernas och ghibellinernas krig i Toscana
The wars between the Guelph (papal and Angevin) and Ghibelline (imperial) parties in Tuscany after the death of Frederick II, in which Guelph Florence fought Ghibelline Siena, Arezzo, Pisa and Lucca. The Ghibellines won at Montaperti in 1260 and again under Uguccione della Faggiuola and Castruccio Castracani at Montecatini (1315) and Altopascio (1325), but the Guelphs’ victories after 1266 and at Campaldino in 1289 made Florence the leading power in Tuscany.: Krigen mellan guelfernas (påvliga och angevinska) och ghibellinernas (kejserliga) partier i Toscana efter Fredrik II:s död, där det guelfiska Florens kämpade mot det ghibellinska Siena, Arezzo, Pisa och Lucca. Ghibellinerna segrade vid Montaperti 1260 och på nytt under Uguccione della Faggiuola och Castruccio Castracani vid Montecatini (1315) och Altopascio (1325), men guelfernas segrar efter 1266 och vid Campaldino 1289 gjorde Florens till den ledande makten i Toscana.
