# Svenska översättningar av katalogtexten (våg 13); stegtexterna kommer senare.
Guinea-Bissau Civil War: Inbördeskriget i Guinea-Bissau
? The war between President João Bernardo “Nino” Vieira and a military junta led by his former chief of staff, Brigadier Ansumane Mané. Vieira had suspended Mané in January 1998, accusing him of letting weapons from army depots reach the separatist rebels of Casamance in neighbouring Senegal. On 7 June 1998, the day after Vieira dismissed Mané and named a successor, troops loyal to him seized barracks and the airport in Bissau, and most of the army and many veterans of the independence war joined them. About 1,300 Senegalese and 400 Guinean troops intervened on Vieira’s side, and the fighting in and around Bissau drove some 200,000 people from the capital and 350,000 from their homes in all; more than 3,000 foreigners were evacuated. A truce in July and a ceasefire in August were followed by the Abuja accord of 1 November 1998, which provided for a government of national unity, elections and the replacement of the Senegalese and Guinean troops by an ECOMOG force from Togo, Benin, Niger and the Gambia. Fighting resumed briefly in early 1999; the foreign troops left in March, and in early May, in a dispute over disarmament, the junta attacked again and overthrew Vieira on 7 May 1999. He took refuge in the Portuguese embassy, signed an unconditional surrender on 10 May and went into exile in Portugal. At least 655 people were killed. Kumba Ialá won the presidential election of 1999–2000; Mané, who tried to take power again, was killed in November 2000, and Vieira returned to be elected president in 2005.
: Kriget mellan president João Bernardo ”Nino” Vieira och en militärjunta ledd av hans förre stabschef, brigadgeneral Ansumane Mané. Vieira hade stängt av Mané i januari 1998 och anklagat honom för att ha låtit vapen från arméns förråd nå separatistrebellerna i Casamance i grannlandet Senegal. Den 7 juni 1998, dagen efter att Vieira hade avskedat Mané och utsett en efterträdare, intog trupper lojala mot Mané kaserner och flygplatsen i Bissau, och större delen av armén och många veteraner från självständighetskriget anslöt sig till dem. Omkring 1 300 senegalesiska och 400 guineanska soldater ingrep på Vieiras sida, och striderna i och omkring Bissau drev omkring 200 000 människor från huvudstaden och sammanlagt 350 000 från sina hem; mer än 3 000 utlänningar evakuerades. Ett stillestånd i juli och en vapenvila i augusti följdes av Abujaavtalet den 1 november 1998, som föreskrev en regering av nationell enhet, val och att de senegalesiska och guineanska trupperna skulle ersättas av en Ecomogstyrka från Togo, Benin, Niger och Gambia. Striderna blossade kort upp igen i början av 1999; de utländska trupperna lämnade landet i mars, och i början av maj, i en tvist om avväpningen, anföll juntan på nytt och störtade Vieira den 7 maj 1999. Han sökte skydd på den portugisiska ambassaden, undertecknade en villkorslös kapitulation den 10 maj och gick i exil i Portugal. Minst 655 människor dödades. Kumba Ialá vann presidentvalet 1999–2000; Mané, som försökte ta makten igen, dödades i november 2000, och Vieira återvände och valdes till president 2005.
