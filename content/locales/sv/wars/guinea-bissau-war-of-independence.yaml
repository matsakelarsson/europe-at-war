Guinea-Bissau War of Independence: Guinea-Bissaus självständighetskrig
? The war of the African Party for the Independence of Guinea and Cape Verde (PAIGC) against Portuguese rule in Portuguese Guinea, the Guinean theatre of the Portuguese Colonial War. The PAIGC, founded in 1956 by Amílcar Cabral and others, turned to armed struggle after Portuguese police killed striking dockworkers at Pidjiguiti in Bissau in 1959, and opened the war with an attack on the barracks at Tite on 23 January 1963. Its guerrillas, based in neighbouring Guinea and later Senegal, held the island of Como against a large Portuguese offensive in 1964 and by the late 1960s claimed to control two-thirds of the countryside, where the party set up schools, clinics, courts and stores. Portugal kept some 30,000 soldiers in the colony, many of them Africans; from 1968 the governor, General António de Spínola, combined reforms with raids such as the attack on Conakry in 1970. Cabral was assassinated in Conakry in January 1973, but Soviet anti-aircraft missiles ended Portuguese air superiority that spring, and the PAIGC declared independence in the Boé hills on 24 September 1973. After the Carnation Revolution in Lisbon, Portugal recognised Guinea-Bissau on 10 September 1974. About 2,000 Portuguese soldiers, some 6,000 PAIGC fighters and about 5,000 civilians were killed.
: Det krig som Afrikanska partiet för Guineas och Kap Verdes självständighet (PAIGC) förde mot det portugisiska styret i Portugisiska Guinea, den guineanska krigsskådeplatsen i det portugisiska kolonialkriget. PAIGC, som grundades 1956 av Amílcar Cabral och andra, övergick till väpnad kamp sedan portugisisk polis 1959 hade dödat strejkande hamnarbetare i Pidjiguiti i Bissau, och inledde kriget med ett anfall mot kasernen i Tite den 23 januari 1963. Dess gerillasoldater, med baser i grannlandet Guinea och senare i Senegal, höll ön Como mot en stor portugisisk offensiv 1964 och gjorde i slutet av 1960-talet anspråk på att kontrollera två tredjedelar av landsbygden, där partiet inrättade skolor, kliniker, domstolar och butiker. Portugal hade omkring 30 000 soldater i kolonin, många av dem afrikaner; från 1968 kombinerade guvernören, general António de Spínola, reformer med räder som anfallet mot Conakry 1970. Cabral mördades i Conakry i januari 1973, men sovjetiska luftvärnsrobotar gjorde slut på det portugisiska luftherraväldet samma vår, och PAIGC förklarade landet självständigt i Boébergen den 24 september 1973. Efter nejlikerevolutionen i Lissabon erkände Portugal Guinea-Bissau den 10 september 1974. Omkring 2 000 portugisiska soldater, omkring 6 000 PAIGC-krigare och omkring 5 000 civila dödades.
