# Svenska översättningar av katalogtexten (våg 13); stegtexterna kommer senare.
Gukurahundi: Gukurahundi
? The campaign of killings carried out by Zimbabwe’s government in Matabeleland and parts of the Midlands, mainly among the Ndebele-speaking supporters of Joshua Nkomo’s ZAPU. After independence in 1980 the rivalry between Robert Mugabe’s ZANU–PF and ZAPU and between their former armies broke out in clashes at Entumbane in Bulawayo in 1980–1981. In February 1982 the government announced the discovery of arms caches on ZAPU-owned properties, dismissed Nkomo from the cabinet and detained ZIPRA commanders; hundreds of former ZIPRA fighters deserted and took up arms as “dissidents”, whom Nkomo disowned, and who killed several hundred civilians in the following years. In January 1983 the government sent the Fifth Brigade, trained by North Korean instructors, answerable directly to the prime minister’s office and commanded by Perrance Shiri, into Matabeleland North, and later into Matabeleland South and the Midlands. Its soldiers killed villagers in public executions and mass shootings, as on the Cewale river in Lupane in March 1983, burned homesteads, and tortured detainees in camps such as Bhalagwe; in 1984, during a drought, the security forces blocked or tightly controlled food supplies into Matabeleland South, causing hunger. The name, Shona for “the early rain that washes away the chaff before the spring rains”, was the Fifth Brigade’s own. The Catholic Commission for Justice and Peace documented at least 2,000–2,750 deaths and thought the true number might be 8,000 or more; most later estimates are about 20,000, and some local estimates go higher. The killings ended when Mugabe and Nkomo signed the Unity Accord on 22 December 1987, merging ZAPU into ZANU–PF, followed by an amnesty in 1988. Mugabe later called the period “a moment of madness”; no one has been prosecuted, and many scholars and the International Association of Genocide Scholars describe it as genocide. In 2024 the government of Emmerson Mnangagwa, who was minister of state security at the time, began community hearings led by traditional chiefs, which critics say avoid accountability.
: Den kampanj av dödande som Zimbabwes regering genomförde i Matabeleland och delar av Midlands, främst bland ndebeletalande anhängare till Joshua Nkomos ZAPU. Efter självständigheten 1980 bröt rivaliteten mellan Robert Mugabes ZANU–PF och ZAPU och mellan deras tidigare arméer ut i sammandrabbningar i Entumbane i Bulawayo 1980–1981. I februari 1982 meddelade regeringen att man upptäckt vapengömmor på egendomar som ägdes av ZAPU, avskedade Nkomo från regeringen och lät gripa ZIPRA-befälhavare; hundratals före detta ZIPRA-krigare deserterade och grep till vapen som ”dissidenter”, som Nkomo tog avstånd från och som dödade flera hundra civila under de följande åren. I januari 1983 sände regeringen Femte brigaden, som utbildats av nordkoreanska instruktörer, var direkt underställd premiärministerns kansli och leddes av Perrance Shiri, till Matabeleland North och senare till Matabeleland South och Midlands. Dess soldater dödade bybor i offentliga avrättningar och massarkebuseringar, som vid floden Cewale i Lupane i mars 1983, brände gårdar och torterade fångar i läger som Bhalagwe; 1984, under en torka, blockerade eller kontrollerade säkerhetsstyrkorna strängt livsmedelsförsörjningen till Matabeleland South, vilket orsakade svält. Namnet, som på shona betyder ”det tidiga regnet som sköljer bort agnarna före vårregnen”, var Femte brigadens eget. Katolska kommissionen för rättvisa och fred dokumenterade minst 2 000–2 750 dödsfall och ansåg att det verkliga antalet kunde vara 8 000 eller fler; de flesta senare uppskattningar ligger kring 20 000, och vissa lokala uppskattningar är högre. Dödandet upphörde när Mugabe och Nkomo undertecknade enhetsavtalet den 22 december 1987, genom vilket ZAPU uppgick i ZANU–PF; avtalet följdes av en amnesti 1988. Mugabe kallade senare perioden ”ett ögonblick av vansinne”; ingen har åtalats, och många forskare och International Association of Genocide Scholars betecknar det som folkmord. 2024 inledde regeringen under Emmerson Mnangagwa, som vid tiden för dödandet var minister för statens säkerhet, lokala utfrågningar ledda av traditionella hövdingar, vilka enligt kritiker undviker ansvarsutkrävande.
