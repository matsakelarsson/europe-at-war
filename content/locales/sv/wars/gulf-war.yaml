Gulf War: Kuwaitkriget
The war that followed Iraq’s invasion and annexation of Kuwait on 2 August 1990. Saddam Hussein’s government, deep in debt after the war with Iran, accused Kuwait of overproducing oil and drilling into Iraq’s Rumaila field, and revived an old claim to the emirate. The UN Security Council condemned the invasion and imposed sanctions, and a coalition of some 35 countries led by the United States gathered more than 900,000 troops in Saudi Arabia. After Iraq ignored a UN deadline of 15 January 1991, the coalition bombed Iraq and Iraqi forces in Kuwait for five and a half weeks from 17 January, and in a ground offensive of 24–28 February drove them out of Kuwait in about 100 hours. Iraqi forces set fire to more than 600 Kuwaiti oil wells as they left. The ceasefire left Saddam in power, under UN sanctions and weapons inspections. Estimates of Iraqi military dead range from about 8,000 to 50,000 and more; the coalition lost about 300 killed.: Kriget som följde på Iraks invasion och annektering av Kuwait den 2 augusti 1990. Saddam Husseins regering, djupt skuldsatt efter kriget mot Iran, anklagade Kuwait för att överproducera olja och för att borra in i Iraks Rumailafält och väckte till liv ett gammalt anspråk på emiratet. FN:s säkerhetsråd fördömde invasionen och införde sanktioner, och en koalition av omkring 35 länder under ledning av USA samlade mer än 900 000 soldater i Saudiarabien. Sedan Irak hade ignorerat FN:s tidsfrist den 15 januari 1991 bombade koalitionen Irak och de irakiska styrkorna i Kuwait i fem och en halv vecka från den 17 januari, och i en markoffensiv den 24–28 februari drev den ut dem ur Kuwait på omkring 100 timmar. De irakiska styrkorna satte eld på mer än 600 kuwaitiska oljekällor när de drog sig tillbaka. Eldupphöret lämnade Saddam kvar vid makten, under FN-sanktioner och vapeninspektioner. Uppskattningarna av antalet döda irakiska militärer varierar från omkring 8 000 till 50 000 och fler; koalitionen förlorade omkring 300 döda.
