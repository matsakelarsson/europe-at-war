After the Peace of Tilsit in July 1807, the British government feared that Napoleon would force Denmark–Norway into his camp and take over its navy, one of the largest in Europe. Britain demanded that the fleet be handed over for safekeeping until the war was over. Crown Prince Frederick, who ruled for his ailing father, refused. Most of the Danish army was in Holstein, watching the French, when British troops began landing at Vedbæk, north of Copenhagen, on 16 August.: Efter freden i Tilsit i juli 1807 fruktade den brittiska regeringen att Napoleon skulle tvinga in Danmark–Norge i sitt läger och ta över dess flotta, en av de största i Europa. Storbritannien krävde att flottan skulle överlämnas för förvaring tills kriget var över. Kronprins Fredrik, som regerade för sin sjuke far, vägrade. Större delen av den danska armén stod i Holstein för att bevaka fransmännen när brittiska trupper började landstiga vid Vedbæk, norr om Köpenhamn, den 16 augusti.
Copenhagen had about 5,000 regular soldiers and as many militiamen. On 29 August Arthur Wellesley, the future Duke of Wellington, scattered a relief force of militia at Køge. From 2 to 5 September British guns and Congreve rockets bombarded the city, killing roughly 195 civilians and burning over a thousand buildings, among them the Church of Our Lady. On 7 September the city surrendered. The British sailed home in October with almost the whole Danish–Norwegian fleet, and Denmark–Norway allied itself with France.: Köpenhamn hade omkring 5 000 reguljära soldater och lika många milismän. Den 29 augusti skingrade Arthur Wellesley, den blivande hertigen av Wellington, en undsättningsstyrka av milis vid Køge. Från den 2 till den 5 september bombarderade brittiska kanoner och congreveraketer staden, dödade omkring 195 civila och brände ned över tusen byggnader, bland dem Vor Frue Kirke. Den 7 september kapitulerade staden. Britterna seglade hem i oktober med nästan hela den dansk-norska flottan, och Danmark–Norge allierade sig med Frankrike.
