Gunboat War: Kanonbåtskriget
A naval war between Denmark–Norway and Britain, begun by the British seizure of the Danish fleet at Copenhagen in 1807 and fought with gunboats, privateers and blockade until the Treaty of Kiel in 1814. It cut Norway off from Denmark, brought famine to Norway and ended with Norway ceded to the king of Sweden.: Ett sjökrig mellan Danmark–Norge och Storbritannien som inleddes när britterna 1807 tog den danska flottan i Köpenhamn och som fördes med kanonbåtar, kapare och blockad fram till freden i Kiel 1814. Kriget skar av Norge från Danmark, förde med sig hungersnöd i Norge och slutade med att Norge avträddes till Sveriges kung.
