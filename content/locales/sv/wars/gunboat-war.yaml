With its battle fleet gone, Denmark–Norway built gunboats instead, well over 200 of them, rowed by crews of 20 to 80 men and armed with one or two heavy guns. They were cheap, quick to build and hard to hit, and in calm, shallow water they could swarm a becalmed warship. On 22 March 1808 the last Danish ship of the line, Prinds Christian Frederik, was destroyed by two British ships off Zealand Point. After that the war at sea was fought by gunboats, brigs and privateers.: När slagflottan var borta byggde Danmark–Norge i stället kanonbåtar, långt över 200, som roddes av besättningar på 20 till 80 man och var bestyckade med en eller två tunga kanoner. De var billiga, snabba att bygga och svåra att träffa, och i lugnt, grunt vatten kunde de svärma kring ett krigsfartyg som låg i stiltje. Den 22 mars 1808 förstördes det sista danska linjeskeppet, Prinds Christian Frederik, av två brittiska fartyg vid Själlands udde. Därefter fördes kriget till sjöss med kanonbåtar, briggar och kapare.
The gunboats captured several British brigs, and on 9 June 1809 a flotilla off Saltholm took a dozen merchant ships from a British convoy. In Norway, gunboats drove off a British frigate at Bergen. But they could not break British control of Danish waters. Guarded by Admiral Saumarez’s Baltic fleet, convoys of hundreds of merchant ships passed the Sound and the Great Belt every summer, while privateers from Danish and Norwegian ports preyed on British and neutral shipping.: Kanonbåtarna kapade flera brittiska briggar, och den 9 juni 1809 tog en flottilj vid Saltholm ett dussin handelsfartyg ur en brittisk konvoj. I Norge drev kanonbåtar bort en brittisk fregatt vid Bergen. Men de kunde inte bryta britternas kontroll över de danska farvattnen. Under skydd av amiral Saumarez Östersjöflotta passerade konvojer med hundratals handelsfartyg Öresund och Stora Bält varje sommar, medan kapare från danska och norska hamnar jagade brittisk och neutral sjöfart.
