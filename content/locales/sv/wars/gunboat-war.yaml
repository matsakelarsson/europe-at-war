Escorting the last homeward convoy of the year, both ships were driven ashore by a north-westerly storm off Thorsminde. Only a handful of men survived; the Danes treated them well.: Under eskorten av årets sista konvoj hemåt drevs båda fartygen på grund av en nordvästlig storm utanför Thorsminde. Endast en handfull män överlevde; danskarna behandlade dem väl.
Danish landing force: Dansk landstigningsstyrka
By 1813 Denmark–Norway was isolated. The war had ruined its trade and its finances, and in January 1813 the state went bankrupt. Sweden, under its new crown prince Charles John, had been promised Norway by Russia in 1812 and by Britain in 1813. Frederick VI refused to give Norway up and kept his alliance with Napoleon. After Napoleon’s defeat at Leipzig in October 1813, Charles John led a Swedish, Russian and German army north against the Danes in Holstein.: År 1813 var Danmark–Norge isolerat. Kriget hade ruinerat dess handel och finanser, och i januari 1813 gick staten i konkurs. Sverige, under sin nye kronprins Karl Johan, hade lovats Norge av Ryssland 1812 och av Storbritannien 1813. Fredrik VI vägrade att avstå Norge och höll fast vid sitt förbund med Napoleon. Efter Napoleons nederlag vid Leipzig i oktober 1813 ledde Karl Johan en svensk, rysk och tysk armé norrut mot danskarna i Holstein.
At Sehested on 10 December the Danish corps fought its way through to the fortress of Rendsburg, but Holstein and much of Schleswig were overrun. By the Treaty of Kiel on 14 January 1814, Denmark made peace with Sweden and Britain. Frederick VI ceded Norway, though not Iceland, Greenland or the Faroes, to the king of Sweden, and Heligoland to Britain, and received Swedish Pomerania. The Norwegians rejected the treaty and adopted their own constitution at Eidsvoll on 17 May 1814.: Vid Sehested den 10 december slog sig den danska kåren igenom till fästningen Rendsburg, men Holstein och stora delar av Slesvig överskreds. Genom freden i Kiel den 14 januari 1814 slöt Danmark fred med Sverige och Storbritannien. Fredrik VI avträdde Norge, dock inte Island, Grönland eller Färöarna, till Sveriges kung och Helgoland till Storbritannien, och fick Svenska Pommern. Norrmännen förkastade fördraget och antog en egen grundlag i Eidsvoll den 17 maj 1814.
