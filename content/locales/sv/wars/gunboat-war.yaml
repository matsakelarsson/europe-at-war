The war cut Norway off from Denmark. Norway relied on Danish grain and lived by selling timber and fish abroad, above all to Britain; now British warships patrolled the Skagerrak. For the first time in centuries Norway had to be governed from within, by a government commission in Christiania, with Prince Christian August as its president, ran the country from 1807 to 1810. Small boats tried to slip grain across from Jutland at night. Many were taken, and their crews spent years in British prisons.: "Kriget skar av Norge från Danmark. Norge var beroende av dansk spannmål och levde på att sälja timmer och fisk utomlands, framför allt till Storbritannien; nu patrullerade brittiska krigsfartyg Skagerrak. För första gången på århundraden måste Norge styras inifrån: en regeringskommission i Christiania, med prins Kristian August som ordförande, styrde landet 1807–1810. Små båtar försökte smuggla över spannmål från Jylland nattetid. Många togs, och deras besättningar satt i åratal i brittiska fängelser."
Hunger turned into famine in 1808–1809 and again after the harvest failed in 1812, when spring came late and frost early. People in many districts mixed bark into their bread. Henrik Ibsen later set his poem Terje Vigen in these years, about a man who rows to Denmark for grain. The isolation also strengthened Norwegians’ sense of being a country of their own. A Norwegian university was founded in Christiania in 1811.: Hungern övergick i hungersnöd 1808–1809 och på nytt efter missväxten 1812, då våren kom sent och frosten tidigt. I många bygder blandade man bark i brödet. Henrik Ibsen förlade senare sin dikt Terje Vigen till dessa år; den handlar om en man som ror till Danmark efter spannmål. Isoleringen stärkte också norrmännens känsla av att vara ett eget land. Ett norskt universitet grundades i Christiania 1811.
