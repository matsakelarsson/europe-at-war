The British needed the Kattegat to be safe for their convoys. In May 1809 they took the small island of Anholt and relit its lighthouse, which the Danes had put out. On 27 March 1811 about 1,000 Danish soldiers crossed from Jutland in gunboats to retake it. They attacked Fort York without artillery or supplies and were beaten off by some 380 Royal Marines, helped by two frigates. Their commander was killed and more than 500 men were taken prisoner.: Britterna behövde ett säkert Kattegatt för sina konvojer. I maj 1809 intog de den lilla ön Anholt och tände åter dess fyr, som danskarna hade släckt. Den 27 mars 1811 gick omkring 1 000 danska soldater över från Jylland i kanonbåtar för att återta ön. De anföll Fort York utan artilleri och förnödenheter och slogs tillbaka av omkring 380 marinsoldater ur Royal Marines med hjälp av två fregatter. Deras befälhavare dödades och mer än 500 man togs till fånga.
Denmark–Norway’s last frigate, Najaden, was sent to Norway in 1812 to protect the grain traffic. On 6 July a British squadron led by the 64-gun Dictator trapped her among the skerries at Lyngør, and she blew up and sank; 133 of her crew were killed. The weather was a deadlier enemy to the British than the Danes. On 24 December 1811 the ships of the line St George and Defence were wrecked on the Jutland coast, and nearly 1,400 drowned men washed ashore.: Danmark–Norges sista fregatt, Najaden, sändes till Norge 1812 för att skydda spannmålstrafiken. Den 6 juli stängde en brittisk eskader, ledd av 64-kanonersskeppet Dictator, in henne bland skären vid Lyngør, och hon sprang i luften och sjönk; 133 av hennes besättning dödades. Vädret var en dödligare fiende för britterna än danskarna. Den 24 december 1811 förliste linjeskeppen St George och Defence på Jyllands kust, och nästan 1 400 drunknade män flöt i land.
