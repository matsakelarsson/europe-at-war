# Svenska översättningar av katalogtexten (våg 10); stegtexterna kommer senare.
Gwangju uprising: Gwangjuupproret
? A popular uprising in the city of Gwangju in South Korea in May 1980 against the military rule of General Chun Doo-hwan, put down by the army; in South Korea it is called the May 18 Democratization Movement. After President Park Chung-hee was assassinated in October 1979, Chun seized control of the army in a coup on 12 December, and on 17 May 1980 he extended martial law to the whole country, closed the universities and arrested opposition leaders, among them Kim Dae-jung, who came from the region. When students in Gwangju protested on 18 May, special forces paratroopers beat and bayoneted protesters and bystanders, and the city rose. On 21 May troops fired on a crowd in front of the provincial office; citizens took weapons from police stations and reservist armouries and drove the army out of the city, which was then sealed off and run for five days by citizens’ committees. In the early hours of 27 May troops retook the provincial office. The government counted 165 civilians killed and 76 missing, with 22 soldiers and 4 police officers dead; other estimates of the dead range from about 600 to 2,000. The killings shaped the democracy movement that ended military rule in 1987, and Chun was convicted for them in 1996.
: Ett folkligt uppror i staden Gwangju i Sydkorea i maj 1980 mot general Chun Doo-hwans militärstyre, som slogs ned av armén; i Sydkorea kallas det Demokratiseringsrörelsen den 18 maj. Sedan president Park Chung-hee hade mördats i oktober 1979 tog Chun kontrollen över armén genom en kupp den 12 december, och den 17 maj 1980 utvidgade han krigslagarna till hela landet, stängde universiteten och lät gripa oppositionsledare, bland dem Kim Dae-jung, som kom från regionen. När studenter i Gwangju protesterade den 18 maj misshandlade fallskärmsjägare ur specialförbanden demonstranter och åskådare och stack dem med bajonetter, och staden reste sig. Den 21 maj öppnade trupperna eld mot en folkmassa framför provinsregeringens byggnad; invånarna tog vapen från polisstationer och reservisternas vapenförråd och drev ut armén ur staden, som därefter spärrades av och i fem dagar styrdes av medborgarkommittéer. Under de tidiga morgontimmarna den 27 maj återtog trupperna provinsregeringens byggnad. Regeringen räknade 165 dödade civila och 76 saknade, samt 22 döda soldater och 4 döda poliser; andra uppskattningar av antalet döda sträcker sig från omkring 600 till 2 000. Dödandet präglade den demokratirörelse som gjorde slut på militärstyret 1987, och Chun dömdes för det 1996.
