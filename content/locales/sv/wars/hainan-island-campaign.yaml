# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
Battle of Hainan Island: Slaget om Hainan
? The People’s Liberation Army’s capture of Hainan Island from the Republic of China in the spring of 1950, at the end of the Chinese Civil War. The Nationalist general Xue Yue held the coast with forces estimated at 100,000 to 200,000 troops and militia, with about 50 ships and 25 aircraft, while communist guerrillas of the Qiongya Column under Feng Baiju, allied with the Indigenous Hlai, controlled much of the interior. The 40th and 43rd Armies of Deng Hua’s 15th Corps trained for months on the Leizhou peninsula and, from late February and March, slipped small forces across the Qiongzhou Strait in junks to join the guerrillas. On the night of 16 April about 300 junks carried the main force across; it landed on the north-west coast, around Lingao, and took Haikou on 23 April. The defence collapsed, the ROC evacuated about 70,000 troops and civilians to Taiwan, Sanya and Yulin in the south fell within a week, and the PRC declared the island taken on 1 May; the ROC announced its withdrawal the next day. The PLA lost about 4,000 men, most of them during the crossing.
: Folkets befrielsearmés erövring av ön Hainan från Republiken Kina våren 1950, i slutet av det kinesiska inbördeskriget. Nationalistgeneralen Xue Yue höll kusten med styrkor som uppskattas till 100 000 till 200 000 soldater och milismän, med omkring 50 fartyg och 25 flygplan, medan kommunistiska gerillor ur Qiongyakolonnen under Feng Baiju, allierade med urfolket hlai, kontrollerade stora delar av inlandet. 40:e och 43:e armén ur Deng Huas 15:e kår övade i månader på Leizhouhalvön och skickade från slutet av februari och i mars små styrkor i djonker över Qiongzhousundet för att förena sig med gerillan. Natten den 16 april förde omkring 300 djonker över huvudstyrkan; den landsteg på nordvästkusten, kring Lingao, och intog Haikou den 23 april. Försvaret bröt samman, Republiken Kina evakuerade omkring 70 000 soldater och civila till Taiwan, Sanya och Yulin i söder föll inom en vecka, och Folkrepubliken förklarade ön intagen den 1 maj; Republiken Kina tillkännagav sitt tillbakadragande dagen därpå. Folkets befrielsearmé förlorade omkring 4 000 man, de flesta under överfarten.
