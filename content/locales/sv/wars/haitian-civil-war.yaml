# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
Haitian civil war (1807–1820): Haitiska inbördeskriget (1807–1820)
? The war between the north and the south of Haiti after the assassination of Emperor Jean-Jacques Dessalines on 17 October 1806. The constitution drawn up in Port-au-Prince in December 1806 left the elected president, Henri Christophe, with little power and the Senate, led by Alexandre Pétion and the officers of colour of the West and South, with most of it. Christophe marched on Port-au-Prince and beat Pétion at Sibert on 1 January 1807 but could not take the city; he then made the north and the Artibonite a separate State of Haiti, which he proclaimed a kingdom with himself as King Henri I in March 1811, while the Senate made Pétion president of the Republic of Haiti in the West and South. Christophe besieged Port-au-Prince again in 1812 without success, André Rigaud set up a breakaway state in the South in 1810–1812, and in the mountains of the Grand’Anse an insurgent leader called Goman held out against the republic from 1807 to 1820. After 1812 the war settled into a standoff along a front near Saint-Marc. Christophe ruled by forced plantation labour and built the Citadelle Laferrière and the palace of Sans-Souci; Pétion divided state land among soldiers and peasants and gave help to Simón Bolívar in 1815–1816. Pétion died in 1818 and was succeeded by Jean-Pierre Boyer, who crushed Goman in 1820. When Christophe, partly paralysed by a stroke, faced mutinies in his army, he shot himself on 8 October 1820, and in October Boyer reunited Haiti.
: Kriget mellan norra och södra Haiti efter mordet på kejsar Jean-Jacques Dessalines den 17 oktober 1806. Den författning som utarbetades i Port-au-Prince i december 1806 gav den valde presidenten, Henri Christophe, liten makt och senaten, ledd av Alexandre Pétion och de färgade officerarna i väster och söder, större delen av den. Christophe marscherade mot Port-au-Prince och slog Pétion vid Sibert den 1 januari 1807 men kunde inte inta staden; han gjorde sedan norr och Artibonite till en egen stat, staten Haiti, som han i mars 1811 utropade till kungarike med sig själv som kung Henri I, medan senaten gjorde Pétion till president för republiken Haiti i väster och söder. Christophe belägrade Port-au-Prince på nytt 1812 utan framgång, André Rigaud upprättade en utbrytarstat i söder 1810–1812, och i bergen i Grand’Anse höll en upprorsledare vid namn Goman ut mot republiken från 1807 till 1820. Efter 1812 stelnade kriget i ett dödläge längs en front nära Saint-Marc. Christophe styrde genom tvångsarbete på plantagerna och byggde Citadelle Laferrière och palatset Sans-Souci; Pétion delade ut statens jord bland soldater och bönder och gav Simón Bolívar hjälp 1815–1816. Pétion dog 1818 och efterträddes av Jean-Pierre Boyer, som krossade Goman 1820. När Christophe, delvis förlamad efter ett slaganfall, ställdes inför myterier i sin armé sköt han sig den 8 oktober 1820, och i oktober återförenade Boyer Haiti.
