# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
2004 Haitian coup d’état: Statskuppen i Haiti 2004
? The armed revolt that drove President Jean-Bertrand Aristide from Haiti for the second time, and the foreign interventions that followed. After disputed legislative elections in May 2000 and Aristide’s return to the presidency in February 2001, the opposition, backed by much of the business elite and civil society, demanded his resignation, while armed gangs loyal to his Fanmi Lavalas party (the chimères) attacked opponents, and former soldiers raided across the Dominican border. On 5 February 2004 the Gonaïves Resistance Front, a former pro-Aristide gang once called the Cannibal Army that had turned against him after its leader Amiot Métayer was murdered in 2003, seized Gonaïves under Amiot’s brother Buteur Métayer. Former army officers and FRAPH paramilitaries, among them Guy Philippe and Louis-Jodel Chamblain, joined them in what became the National Revolutionary Front for the Liberation and Reconstruction of Haiti (FLRN); the police fled or were overrun across the north, and on 22 February the rebels took Cap-Haïtien. As they threatened Port-au-Prince and pro-Aristide gangs barricaded the capital, the United States and France pressed Aristide to leave. In the early hours of 29 February 2004 he signed a letter of resignation and was flown out on an American plane to the Central African Republic; he has said that he was forced out in a coup and kidnapped, which the US government denies. The chief justice, Boniface Alexandre, became interim president and Gérard Latortue prime minister. The same day UN Security Council Resolution 1529 authorised a Multinational Interim Force of US, French, Canadian and Chilean troops, and on 1 June 2004 it handed over to the UN Stabilization Mission in Haiti (MINUSTAH), led by Brazil, which stayed until 2017. At least 80 people were killed in the revolt, and many more in the reprisals between Lavalas supporters, former soldiers and the police in the months that followed. MINUSTAH fought the gangs of Cité Soleil in 2005–2007, lost its head, Hédi Annabi, and about a hundred of its staff in the earthquake of January 2010, and was blamed for the cholera epidemic that Nepalese peacekeepers brought to Haiti later that year, which killed about 10,000 people; the United Nations apologised in 2016.
: Den väpnade revolt som för andra gången drev president Jean-Bertrand Aristide från Haiti, och de utländska interventioner som följde. Efter omstridda parlamentsval i maj 2000 och Aristides återkomst till presidentposten i februari 2001 krävde oppositionen, med stöd av stora delar av affärseliten och det civila samhället, hans avgång, medan beväpnade gäng lojala mot hans parti Fanmi Lavalas (chimères) angrep motståndare och före detta soldater gjorde räder över gränsen från Dominikanska republiken. Den 5 februari 2004 intog Gonaïves motståndsfront, ett tidigare Aristidevänligt gäng som en gång hade kallats Kannibalarmén och som hade vänt sig mot honom sedan dess ledare Amiot Métayer mördats 2003, staden Gonaïves under Amiots bror Buteur Métayer. Före detta arméofficerare och FRAPH-paramilitärer, bland dem Guy Philippe och Louis-Jodel Chamblain, anslöt sig till dem i det som blev Nationella revolutionära fronten för Haitis befrielse och återuppbyggnad (FLRN); polisen flydde eller överväldigades i hela norra Haiti, och den 22 februari intog rebellerna Cap-Haïtien. När de hotade Port-au-Prince och Aristidevänliga gäng barrikaderade huvudstaden pressade USA och Frankrike Aristide att lämna landet. Under de tidiga morgontimmarna den 29 februari 2004 undertecknade han ett avskedsbrev och flögs ut med ett amerikanskt plan till Centralafrikanska republiken; han har sagt att han tvingades bort genom en kupp och kidnappades, vilket den amerikanska regeringen förnekar. Högsta domstolens ordförande Boniface Alexandre blev interimspresident och Gérard Latortue premiärminister. Samma dag bemyndigade FN:s säkerhetsråds resolution 1529 en multinationell interimsstyrka med amerikanska, franska, kanadensiska och chilenska trupper, och den 1 juni 2004 överlämnade den ansvaret till FN:s stabiliseringsmission i Haiti (MINUSTAH), som leddes av Brasilien och stannade till 2017. Minst 80 människor dödades under revolten, och många fler i repressalierna mellan Lavalasanhängare, före detta soldater och polisen under de följande månaderna. MINUSTAH bekämpade gängen i Cité Soleil 2005–2007, förlorade sin chef Hédi Annabi och ett hundratal av sin personal i jordbävningen i januari 2010 och fick skulden för den koleraepidemi som nepalesiska fredsbevarare förde till Haiti senare samma år och som dödade omkring 10 000 människor; FN bad om ursäkt 2016.
Aristide’s government (the Haitian National Police and Lavalas supporters): Aristides regering (Haitis nationella polis och Lavalasanhängare)
Rebels (Gonaïves Resistance Front, from February 2004 the FLRN, with former soldiers under Guy Philippe): Rebeller (Gonaïves motståndsfront, från februari 2004 FLRN, med före detta soldater under Guy Philippe)
Multinational Interim Force (United States, France, Canada and Chile), from June 2004 MINUSTAH: Multinationella interimsstyrkan (USA, Frankrike, Kanada och Chile), från juni 2004 MINUSTAH
