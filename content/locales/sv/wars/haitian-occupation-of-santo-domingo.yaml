# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
Haitian occupation of Santo Domingo: Haitis ockupation av Santo Domingo
? The rule of Haiti over the whole of Hispaniola from 1822 to 1844, called in Dominican history the Haitian occupation and in Haitian history the unification of the island. Spain had regained its former colony of Santo Domingo from the French in 1809, but neglected it, and on 1 December 1821 José Núñez de Cáceres proclaimed the independent State of Spanish Haiti and sought to join Simón Bolívar’s Gran Colombia. Several frontier towns and many in the Cibao preferred union with Haiti, whose constitution declared the island one and indivisible, and President Jean-Pierre Boyer marched east with an army of about 10,000 to 12,000 men; Núñez de Cáceres handed over the keys of Santo Domingo without a fight on 9 February 1822. Boyer abolished slavery in the east, gave land to freedmen, took over church property and the estates of emigrants, and applied Haitian law, including restrictions on land ownership by whites, the Rural Code and the taxes needed to pay the indemnity that France imposed in 1825 in return for recognising Haiti. Many landowning families emigrated, the university closed, and opposition grew, from a pro-Spanish plot at Los Alcarrizos in 1824 to the secret society La Trinitaria, founded by Juan Pablo Duarte in 1838. After the revolution of 1843 overthrew Boyer, the separatists proclaimed the Dominican Republic on 27 February 1844, which began the Dominican War of Independence. Historians disagree over how far the period was an occupation and how far a union that many easterners at first welcomed.
: Haitis styre över hela Hispaniola 1822–1844, i dominikansk historia kallat den haitiska ockupationen och i haitisk historia öns enande. Spanien hade återfått sin forna koloni Santo Domingo från fransmännen 1809 men försummat den, och den 1 december 1821 utropade José Núñez de Cáceres den självständiga staten Spanska Haiti och sökte ansluta den till Simón Bolívars Storcolombia. Flera gränsstäder och många i Cibao föredrog en union med Haiti, vars författning förklarade ön en och odelbar, och president Jean-Pierre Boyer marscherade österut med en armé på omkring 10 000 till 12 000 man; Núñez de Cáceres överlämnade nycklarna till Santo Domingo utan strid den 9 februari 1822. Boyer avskaffade slaveriet i öster, gav jord åt frigivna, tog över kyrkans egendom och emigranternas gods och införde haitisk lag, däribland inskränkningar i vitas rätt att äga jord, lantbrukslagen och de skatter som behövdes för att betala det skadestånd som Frankrike 1825 ålade Haiti i utbyte mot att erkänna landet. Många jordägande familjer emigrerade, universitetet stängdes, och oppositionen växte, från en spanskvänlig sammansvärjning i Los Alcarrizos 1824 till det hemliga sällskapet La Trinitaria, som Juan Pablo Duarte grundade 1838. Sedan revolutionen 1843 hade störtat Boyer utropade separatisterna Dominikanska republiken den 27 februari 1844, vilket inledde det dominikanska självständighetskriget. Historikerna är oense om i vilken mån perioden var en ockupation och i vilken mån en union som många i öster till en början välkomnade.
