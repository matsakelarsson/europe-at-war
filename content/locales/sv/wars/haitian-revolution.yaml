# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
Haitian Revolution: Haitiska revolutionen
? The revolution in which the enslaved people of Saint-Domingue, the French colony in the western third of Hispaniola and the richest colony in the Americas, overthrew slavery and French rule and founded Haiti, the first independent state in the Americas created by formerly enslaved people. Free people of colour led by Vincent Ogé took up arms for equal rights in 1790; on the night of 22–23 August 1791, about a week after the gathering at Bois Caïman, the enslaved people of the Northern Plain rose. In 1793, with Spain and Britain at war with the French Republic and invading the colony, the French commissioners Léger-Félicité Sonthonax and Étienne Polverel proclaimed the end of slavery, and on 4 February 1794 the National Convention abolished it in all French colonies. Toussaint Louverture, who had fought for Spain, joined the Republic in 1794, drove out the Spanish and, with André Rigaud, the British (1798), defeated Rigaud in the War of the South (1799–1800), took over Spanish Santo Domingo (1801) and gave the colony a constitution that made him governor for life. Napoleon Bonaparte sent an army under Charles Leclerc in 1802; Toussaint was captured and deported and died in a French prison, but when it became clear that France meant to restore slavery, the former slaves and the free people of colour rose again under Jean-Jacques Dessalines, Henri Christophe and Alexandre Pétion. War and yellow fever destroyed the French army, which was defeated at Vertières on 18 November 1803, and Dessalines declared Haiti’s independence on 1 January 1804. In the following months most of the French who remained were killed on his orders. Estimates of the dead range from about 200,000 to 350,000 people of the colony, with tens of thousands of French and British soldiers, most of whom died of disease.
: Revolutionen genom vilken de förslavade i Saint-Domingue, den franska kolonin på Hispaniolas västra tredjedel och den rikaste kolonin i Amerika, störtade slaveriet och det franska styret och grundade Haiti, den första självständiga staten i Amerika som skapats av tidigare förslavade människor. Fria färgade under ledning av Vincent Ogé grep till vapen för lika rättigheter 1790; natten mellan den 22 och 23 augusti 1791, ungefär en vecka efter sammankomsten vid Bois Caïman, reste sig de förslavade på Norra slätten. År 1793, när Spanien och Storbritannien låg i krig med Franska republiken och invaderade kolonin, kungjorde de franska kommissarierna Léger-Félicité Sonthonax och Étienne Polverel slaveriets slut, och den 4 februari 1794 avskaffade Nationalkonventet det i alla franska kolonier. Toussaint Louverture, som hade stridit för Spanien, gick 1794 över till republiken, drev ut spanjorerna och, tillsammans med André Rigaud, britterna (1798), besegrade Rigaud i Sydkriget (1799–1800), tog över spanska Santo Domingo (1801) och gav kolonin en författning som gjorde honom till guvernör på livstid. Napoleon Bonaparte sände en armé under Charles Leclerc 1802; Toussaint tillfångatogs, deporterades och dog i ett franskt fängelse, men när det stod klart att Frankrike tänkte återinföra slaveriet reste sig de forna slavarna och de fria färgade på nytt under Jean-Jacques Dessalines, Henri Christophe och Alexandre Pétion. Krig och gula febern förintade den franska armén, som besegrades vid Vertières den 18 november 1803, och Dessalines förklarade Haiti självständigt den 1 januari 1804. Under de följande månaderna dödades de flesta av de kvarvarande fransmännen på hans order. Uppskattningarna av antalet döda sträcker sig från omkring 200 000 till 350 000 av kolonins invånare, därtill tiotusentals franska och brittiska soldater, av vilka de flesta dog av sjukdomar.
