Hats’ Russian War: Hattarnas ryska krig
Sweden, governed by the Hats party, attacked Russia to win back what it had lost in 1721. Its army was beaten at Villmanstrand and surrendered near Helsingfors, and Russia occupied Finland; at Åbo in 1743 Sweden got Finland back but gave up a strip of the south-east.: Sverige, som styrdes av hattpartiet, anföll Ryssland för att återvinna det som gått förlorat 1721. Den svenska armén besegrades vid Villmanstrand och kapitulerade nära Helsingfors, och Ryssland ockuperade Finland. Genom freden i Åbo 1743 fick Sverige tillbaka Finland men avstod en remsa i sydost.
