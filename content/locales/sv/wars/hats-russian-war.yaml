A Russian army of about 10,000 stormed the small town. The Swedish commander, Carl Henrik Wrangel, was taken prisoner.: En rysk armé på omkring 10 000 man stormade den lilla staden. Den svenske befälhavaren Carl Henrik Wrangel togs till fånga.
Capitulation at Helsingfors: Kapitulationen vid Helsingfors
August 1742: augusti 1742
Cut off by land and sea, the Swedish army surrendered and was shipped home, leaving Finland to the Russians.: Avskuren till lands och sjöss kapitulerade den svenska armén och skeppades hem, och Finland lämnades åt ryssarna.
Russia returned most of Finland, and Sweden accepted the Russian candidate, Adolf Frederick, as heir to the throne.: Ryssland återlämnade större delen av Finland, och Sverige godtog den ryske kandidaten, Adolf Fredrik, som tronföljare.
