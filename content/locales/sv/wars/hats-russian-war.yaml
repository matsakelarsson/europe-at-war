The Hats, the party then in power in Sweden, wanted revenge for the Great Northern War and had French backing. Sweden declared war on Russia in the summer of 1741, but on 3 September a Russian army under Peter Lacy stormed Villmanstrand and routed the Swedish force there.: Hattarna, det parti som då hade makten i Sverige, ville ha revansch för stora nordiska kriget och hade franskt stöd. Sverige förklarade Ryssland krig sommaren 1741, men den 3 september stormade en rysk armé under Peter Lacy Villmanstrand och slog den svenska styrkan där på flykten.
The main army, badly led and ravaged by disease, fell back across Finland. Surrounded near Helsingfors, it capitulated in August 1742, and Russia occupied all of Finland, a time Finns call the Lesser Wrath. At Åbo in August 1743 Sweden got Finland back but gave up a strip of the south-east beyond the Kymi river, with Fredrikshamn, Villmanstrand and Nyslott.: Huvudarmén, som var dåligt ledd och härjades av sjukdomar, drog sig tillbaka genom Finland. Inringad nära Helsingfors kapitulerade den i augusti 1742, och Ryssland ockuperade hela Finland, en tid som finländarna kallar lilla ofreden. Genom freden i Åbo i augusti 1743 fick Sverige tillbaka Finland men avstod en remsa i sydost bortom Kymmene älv, med Fredrikshamn, Villmanstrand och Nyslott.
