# Svenska översättningar av katalogtexten (våg 13); stegtexterna kommer senare.
Wars of the Hausa kingdoms: Krigen mellan hausarikena
? "Wars among the Hausa kingdoms of today’s northern Nigeria and southern Niger, and with the empires around them, from about 1450 to 1650, as the Kano Chronicle and other Hausa, Bornu and Timbuktu writings tell them. Kano, Katsina, Zazzau (Zaria), Gobir and the other walled city-states grew rich on the trade between the forest and the Sahara and fought one another for routes, farmland and tribute, while Zazzau, on the southern frontier, raided southwards and supplied the others with slaves. Bornu claimed overlordship: the Kano Chronicle says that Abdullahi Burja (1438–1452 in its reckoning) paid tribute to Bornu, and that Muhammad Kisoki (1509–1565) raided the Bornu province of Birnin Unguru and beat off a Bornu army that attacked Kano soon after. The same chronicle tells of the first war between Kano and Katsina, under Muhammad Rumfa (1463–1499), which lasted eleven years without a victor. Songhai’s Askia Muhammad led an expedition to Katsina in 1512–1513, and Kanta Kotal of Kebbi broke away from Songhai to found a kingdom in the west (see Askia Muhammad’s wars); Leo Africanus wrote that the askia had conquered the Hausa states, which historians doubt. Hausa tradition remembers Amina, queen of Zazzau, as a conqueror who took tribute as far as Nupe and Kwararafa and built walled camps; the Kano Chronicle places her in the early fifteenth century, other traditions and the historian Abdullahi Smith in the sixteenth, after 1576, and the details of her life are debated. Under Muhammad Zaki (1582–1618), after years in which Katsina harried Kano, a Kano army defeated Katsina at Guraji and took about 400 horses; Kutumbi (1623–1648) besieged Katsina and, by the chronicle’s account, died of wounds after a later battle with it. Pressed by the raids of Kwararafa from the south, Kano and Katsina made peace about 1650."
: "Krig mellan hausarikena i dagens norra Nigeria och södra Niger, och mot de omgivande imperierna, från omkring 1450 till 1650, så som Kanokrönikan och andra skrifter från hausaområdet, Bornu och Timbuktu skildrar dem. Kano, Katsina, Zazzau (Zaria), Gobir och de andra befästa stadsstaterna blev rika på handeln mellan skogslandet och Sahara och stred med varandra om handelsvägar, jordbruksmark och tribut, medan Zazzau vid den södra gränsen gjorde räder söderut och försåg de andra med slavar. Bornu gjorde anspråk på överhögheten: enligt Kanokrönikan betalade Abdullahi Burja (1438–1452 enligt krönikans tideräkning) tribut till Bornu, och Muhammad Kisoki (1509–1565) härjade i Bornuprovinsen Birnin Unguru och slog tillbaka en bornuarmé som strax därefter anföll Kano. Samma krönika berättar om det första kriget mellan Kano och Katsina, under Muhammad Rumfa (1463–1499), som varade i elva år utan att någon av dem segrade. Songhais Askia Muhammad ledde ett fälttåg till Katsina 1512–1513, och Kanta Kotal av Kebbi bröt sig loss från Songhai och grundade ett kungarike i väster (se Askia Muhammads krig); Leo Africanus skrev att askian hade erövrat hausastaterna, vilket historikerna betvivlar. Hausatraditionen minns Amina, drottning av Zazzau, som en erövrare som tog tribut ända bort till Nupe och Kwararafa och byggde befästa läger; Kanokrönikan placerar henne i början av 1400-talet, andra traditioner och historikern Abdullahi Smith på 1500-talet, efter 1576, och detaljerna i hennes liv är omstridda. Under Muhammad Zaki (1582–1618), efter flera år då Katsina hade hemsökt Kano, besegrade en armé från Kano Katsina vid Guraji och tog omkring 400 hästar; Kutumbi (1623–1648) belägrade Katsina och dog enligt krönikan av sår som han fått i ett senare slag mot staden. Under trycket från Kwararafas räder söderifrån slöt Kano och Katsina fred omkring 1650."
