# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
Haw wars: Hawkrigen
? "Wars against armed Chinese bands in the uplands of Laos, northern Vietnam and northern Siam. “Haw” (Ho) is the Thai and Lao name for the Yunnanese Chinese, and was applied to these bands, most of whose men came from Guangxi and Guangdong: they were remnants of the armies of the Taiping and other mid-century risings, pushed south by the Qing from the 1860s. In Tonkin and the hills they formed rival bands under coloured flags (the Black Flags, the Yellow Flags, and later the Red and Striped Flags), which taxed trade, took tribute and raided; the French and Siamese often called them pirates or bandits, while the Vietnamese court at times employed them. In 1873–1874 the Striped Flags took Muang Phuan and the Plain of Jars, routed a force sent by Luang Prabang and Vietnam, and sacked the ruins of Vientiane. Siam, which held Luang Prabang and the Lao principalities as vassals, sent expeditions in 1875, 1884–1885 and 1885–1887; the first two failed against Haw stockades, and the third, under Chamuen Waiwonnat (later Chaophraya Surasak Montri), occupied Hua Phan and the Sipsong Chau Tai and carried off brothers of the Tai lord Đèo Văn Trị of Lai Châu as hostages. In June 1887 Đèo Văn Trị, with Haw and Black Flag fighters, sacked Luang Prabang; the French vice-consul Auguste Pavie got the old king Oun Kham away by boat. French troops from Tonkin then occupied the Sipsong Chau Tai, Đèo Văn Trị went over to the French, who recognised him as lord of the Sipsong Chau Tai in 1889–1890, and the last large bands broke up by about 1890, though raids went on into the mid-1890s. The wars weakened Siam’s hold on the left bank of the Mekong and prepared the ground for the French claims of 1893. In Thailand they are remembered as the suppression of the Haw (Prap Ho)."
: "Krig mot beväpnade kinesiska band i höglandet i Laos, norra Vietnam och norra Siam. ”Haw” (Ho) är det thailändska och laotiska namnet på kineserna från Yunnan, och det användes om dessa band, vars män till största delen kom från Guangxi och Guangdong: de var rester av taipingarméerna och av arméerna från andra resningar vid mitten av seklet, som Qingdynastin trängde söderut från 1860-talet. I Tonkin och bergsområdena bildade de rivaliserande band under färgade fanor (Svarta flaggorna, Gula flaggorna och senare Röda och Randiga flaggorna), som beskattade handeln, tog ut tribut och plundrade; fransmännen och siameserna kallade dem ofta pirater eller banditer, medan det vietnamesiska hovet ibland anlitade dem. Åren 1873–1874 intog Randiga flaggorna Muang Phuan och Krukslätten, krossade en styrka som hade sänts av Luang Prabang och Vietnam och plundrade Vientianes ruiner. Siam, som hade Luang Prabang och de laotiska furstendömena som vasaller, sände expeditioner 1875, 1884–1885 och 1885–1887; de två första misslyckades mot hawbandens palissader, och den tredje, under Chamuen Waiwonnat (senare Chaophraya Surasak Montri), ockuperade Hua Phan och Sipsong Chau Tai och förde bort bröder till taifursten Đèo Văn Trị av Lai Châu som gisslan. I juni 1887 plundrade Đèo Văn Trị Luang Prabang med kämpar från hawbanden och Svarta flaggorna; den franske vicekonsuln Auguste Pavie fick den gamle kungen Oun Kham i säkerhet med båt. Franska trupper från Tonkin ockuperade därefter Sipsong Chau Tai, Đèo Văn Trị gick över till fransmännen, som erkände honom som furste över Sipsong Chau Tai 1889–1890, och de sista stora banden upplöstes omkring 1890, även om räderna fortsatte till mitten av 1890-talet. Krigen försvagade Siams grepp om Mekongs vänstra strand och banade väg för de franska anspråken 1893. I Thailand minns man dem som kuvandet av hawbanden (Prap Ho)."
