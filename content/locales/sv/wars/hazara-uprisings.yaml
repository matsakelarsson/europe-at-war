Hazara uprisings: Hazaraupproren
? The risings of the Hazaras of central Afghanistan against the amir Abdur Rahman Khan, who was bringing the Hazarajat, until then ruled by its own chiefs, under the direct control of Kabul. A first rising in 1888–1890, when Hazara chiefs joined the revolt of the amir’s cousin Mohammad Ishaq Khan, was put down, and Afghan governors, garrisons and taxes followed. In the spring of 1892 a wider revolt, sparked by abuses by Afghan soldiers, spread across the Hazarajat. The amir, with the support of Sunni clerics, declared a holy war against the mostly Shia Hazaras and raised a large army of regular troops and tribal levies, which took the centre of the revolt in Uruzgan in 1892 and crushed a last rising against taxation in 1893. Many thousands of Hazaras were killed, thousands of men, women and children were enslaved and sold in Kabul and Kandahar, much of their land was given to Pashtun nomads and settlers, and large numbers fled to British India (Quetta), Persia (Mashhad) and Russian Turkestan. Historians often estimate that more than half of the Hazara population was killed or driven out; several call it the worst case of ethnic cleansing or genocide in modern Afghan history.
: Hazarernas uppror i centrala Afghanistan mot emiren Abdur Rahman Khan, som höll på att föra Hazarajat, som dittills styrts av sina egna hövdingar, under Kabuls direkta kontroll. Ett första uppror 1888–1890, då hazarahövdingar anslöt sig till det uppror som leddes av emirens kusin Mohammad Ishaq Khan, slogs ned, och afghanska guvernörer, garnisoner och skatter följde. Våren 1892 spred sig ett mer omfattande uppror, utlöst av övergrepp från afghanska soldater, över Hazarajat. Emiren utlyste med stöd av sunnimuslimska religiösa lärde ett heligt krig mot de till största delen shiitiska hazarerna och mönstrade en stor armé av reguljära trupper och stamuppbåd, som 1892 intog upprorets centrum i Uruzgan och 1893 krossade ett sista uppror mot beskattningen. Många tusen hazarer dödades, tusentals män, kvinnor och barn förslavades och såldes i Kabul och Kandahar, stora delar av deras jord gavs till pashtunska nomader och nybyggare, och många flydde till Brittiska Indien (Quetta), Persien (Mashhad) och Ryska Turkestan. Historiker uppskattar ofta att mer än hälften av hazarabefolkningen dödades eller fördrevs; flera betecknar det som det värsta fallet av etnisk rensning eller folkmord i Afghanistans moderna historia.
