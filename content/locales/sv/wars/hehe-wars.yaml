Hehe wars: Hehekrigen
The war of the Hehe kingdom of the southern highlands of Tanzania against the German conquest. The Hehe, united by Munyigumba and his son Mkwawa in the 1870s and 1880s, dominated the country around Iringa and raided their neighbours and the caravan routes to the interior. In 1891 a German column under Emil von Zelewski marched against them, and on 17 August Mkwawa’s warriors ambushed it at Lugalo and killed Zelewski and most of his men, one of the worst defeats of German colonial troops in Africa. In October 1894 Governor Friedrich von Schele stormed Mkwawa’s walled capital at Kalenga, but Mkwawa escaped and fought a guerrilla war for almost four years, while the Germans burned crops and villages and set up a fort at Iringa. Cornered in July 1898, Mkwawa shot himself rather than be captured; his head was taken to Germany, and the Treaty of Versailles required its return. A skull believed to be his was handed back in 1954 and is kept at Kalenga.: Hehekungarikets krig i Tanzanias södra högland mot den tyska erövringen. Hehe, som enades av Munyigumba och hans son Mkwawa på 1870- och 1880-talen, dominerade landet kring Iringa och gjorde räder mot sina grannar och mot karavanvägarna till inlandet. År 1891 marscherade en tysk kolonn under Emil von Zelewski mot dem, och den 17 augusti lade Mkwawas krigare ett bakhåll för den vid Lugalo och dödade Zelewski och de flesta av hans män, ett av de värsta nederlag som tyska kolonialtrupper led i Afrika. I oktober 1894 stormade guvernören Friedrich von Schele Mkwawas murförsedda huvudstad Kalenga, men Mkwawa undkom och förde ett gerillakrig i nästan fyra år, medan tyskarna brände grödor och byar och anlade ett fort i Iringa. Inringad i juli 1898 sköt Mkwawa sig själv hellre än att bli tillfångatagen; hans huvud fördes till Tyskland, och Versaillesfördraget krävde att det skulle lämnas tillbaka. En skalle som tros vara hans lämnades tillbaka 1954 och förvaras i Kalenga.
