# Svenska översättningar av katalogtexten (våg 10); stegtexterna kommer senare.
Heiji rebellion: Heijiupproret
? "A coup and counter-coup in Heian-kyō (Kyoto) that left Taira no Kiyomori the dominant power at court and nearly destroyed the Minamoto. After the Hōgen rebellion, the retired emperor Go-Shirakawa’s adviser Fujiwara no Michinori (Shinzei) favoured Kiyomori, while his rival Fujiwara no Nobuyori found an ally in Minamoto no Yoshitomo, who resented the execution of his father in 1156 and the rewards given to the Taira. When Kiyomori left the capital on a pilgrimage to Kumano, Nobuyori and Yoshitomo struck on the night of 19 January 1160 (the ninth day of the twelfth month of Heiji 1, which began in 1159): they burned Go-Shirakawa’s Sanjō palace, held him and the young emperor Nijō in the imperial palace, and hunted down Shinzei, who was killed. Kiyomori hurried back, the emperor and the retired emperor escaped to his Rokuhara mansion, and on 5 February his son Shigemori lured the Minamoto out of the palace and defeated them at Rokuhara. Nobuyori was executed; Yoshitomo fled east and was murdered by a retainer in Owari, and his eldest sons were killed, but Kiyomori spared the twelve-year-old Yoritomo, who was exiled to Izu, and the infant Yoshitsune. Kiyomori rose to be chancellor in 1167, and the Minamoto rising of 1180 began the Genpei War."
: "En kupp och en motkupp i Heian-kyō (Kyoto) som gjorde Taira no Kiyomori till den dominerande makten vid hovet och nästan utplånade Minamotoklanen. Efter Hōgenupproret gynnade den abdikerade kejsaren Go-Shirakawas rådgivare Fujiwara no Michinori (Shinzei) Kiyomori, medan hans rival Fujiwara no Nobuyori fann en bundsförvant i Minamoto no Yoshitomo, som var förbittrad över avrättningen av sin far 1156 och över de belöningar som Tairaklanen hade fått. När Kiyomori lämnade huvudstaden för en pilgrimsfärd till Kumano slog Nobuyori och Yoshitomo till natten den 19 januari 1160 (den nionde dagen i tolfte månaden Heiji 1, ett år som började 1159): de brände Go-Shirakawas Sanjōpalats, höll honom och den unge kejsaren Nijō fångna i det kejserliga palatset och jagade Shinzei, som dödades. Kiyomori skyndade tillbaka, kejsaren och den abdikerade kejsaren flydde till hans residens i Rokuhara, och den 5 februari lockade hans son Shigemori ut Minamototrupperna ur palatset och besegrade dem vid Rokuhara. Nobuyori avrättades; Yoshitomo flydde österut och mördades av en vasall i Owari, och hans äldsta söner dödades, men Kiyomori skonade den tolvårige Yoritomo, som förvisades till Izu, och spädbarnet Yoshitsune. Kiyomori steg till kansler 1167, och Minamotoklanens resning 1180 inledde Genpeikriget."
