Kinship Wars (Heimosodat): Frändefolkskrigen (heimosodat)
A series of expeditions by Finnish volunteers, and local uprisings they backed, in the Finnic-speaking borderlands of Soviet Russia in 1918–1922; the Viena expedition to White Karelia in 1918, the Petsamo expeditions of 1918 and 1920 and the Aunus expedition to Olonets Karelia in 1919 all failed, and the Treaty of Tartu of 14 October 1920 gave Finland Petsamo but returned the parishes of Repola and Porajärvi to Soviet Russia. An East Karelian uprising supported by Finnish volunteers from November 1921 was crushed by the Red Army in February 1922, and some 30,000 East Karelians fled to Finland.: En serie expeditioner av finländska frivilliga, och lokala uppror som de stödde, i de finskspråkiga gränsområdena i Sovjetryssland 1918–1922. Vienaexpeditionen till Vitkarelen 1918, Petsamoexpeditionerna 1918 och 1920 och Aunusexpeditionen till Olonetskarelen 1919 misslyckades alla, och freden i Tartu den 14 oktober 1920 gav Finland Petsamo men återlämnade socknarna Repola och Porajärvi till Sovjetryssland. Ett östkarelskt uppror med stöd av finländska frivilliga från november 1921 krossades av Röda armén i februari 1922, och omkring 30 000 östkarelare flydde till Finland.
