Herero and Nama war and genocide: Herero- och namakriget och folkmordet
? The war of the Herero (Ovaherero) and Nama against German colonial rule in German South West Africa (Namibia), and the genocide with which Germany answered it. In January 1904 the Herero under Samuel Maharero rose against the loss of their land and cattle and the abuses of traders and settlers, killing more than a hundred German men. After the battle at the Waterberg (Ohamakari) on 11 August 1904 the German commander, General Lothar von Trotha, drove the Herero with their families and herds into the waterless Omaheke and ordered that every Herero found inside the colony be shot. In October 1904 the Nama under Hendrik Witbooi rose in the south and fought a guerrilla war that lasted, under leaders such as Jakob Marengo and Simon Kooper, into 1908. The survivors were held in concentration camps and made to work; about half of the prisoners died. Estimates of the dead range from 40,000 to 80,000 Herero, some 80 percent of the people, and about 10,000 Nama, half of them. The killings are widely regarded as the first genocide of the twentieth century; Germany acknowledged them as genocide in 2015.
: Det krig som herero (ovaherero) och nama förde mot det tyska kolonialstyret i Tyska Sydvästafrika (Namibia), och det folkmord med vilket Tyskland besvarade det. I januari 1904 reste sig herero under Samuel Maharero mot förlusten av sin mark och boskap och mot handelsmäns och nybyggares övergrepp och dödade mer än hundra tyska män. Efter slaget vid Waterberg (Ohamakari) den 11 augusti 1904 drev den tyske befälhavaren, general Lothar von Trotha, herero med deras familjer och hjordar ut i den vattenlösa Omaheke och beordrade att varje herero som påträffades inom kolonin skulle skjutas. I oktober 1904 reste sig nama under Hendrik Witbooi i söder och förde ett gerillakrig som under ledare som Jakob Marengo och Simon Kooper varade in på 1908. De överlevande hölls i koncentrationsläger och tvingades arbeta; omkring hälften av fångarna dog. Uppskattningarna av antalet döda varierar från 40 000 till 80 000 herero, omkring 80 procent av folket, och omkring 10 000 nama, hälften av folket. Dödandet betraktas allmänt som 1900-talets första folkmord; Tyskland erkände det som folkmord 2015.
