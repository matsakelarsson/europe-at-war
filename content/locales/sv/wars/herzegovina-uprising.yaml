Herzegovina Uprising of 1875–1877: Hercegovinaupproret 1875–1877
A rising of Christian peasants, mostly Orthodox Serbs, against their Muslim landlords and Ottoman tax collectors, which began around Nevesinje in Herzegovina in July 1875 and spread to Bosnia. Aided by Montenegro and Serbia, it opened the Great Eastern Crisis that led to the Serbian and Montenegrin wars of 1876, the Russo-Turkish War of 1877–1878 and the Austro-Hungarian occupation of Bosnia and Herzegovina.: Ett uppror bland kristna bönder, mestadels ortodoxa serber, mot deras muslimska godsägare och osmanska skatteindrivare. Det började kring Nevesinje i Hercegovina i juli 1875 och spred sig till Bosnien. Med stöd av Montenegro och Serbien inledde det den stora orientaliska krisen, som ledde till de serbiska och montenegrinska krigen 1876, rysk-turkiska kriget 1877–1878 och Österrike-Ungerns ockupation av Bosnien och Hercegovina.
