Nevesinje and the Great Eastern Crisis: Nevesinje och den stora orientaliska krisen
Dates are New Style (Gregorian); local Orthodox Christians used the Julian calendar, then 12 days behind. Numbers of refugees and dead are contemporary estimates and vary widely.: Datum anges enligt nya stilen (gregorianska kalendern); de lokala ortodoxa kristna använde den julianska kalendern, som då låg 12 dagar efter. Antalet flyktingar och döda bygger på samtida uppskattningar och varierar kraftigt.
Historians of the region still differ over how far the rising was a social revolt of peasants against landlords, a national rising and a religious war, and over the part played by Catholics, most of whom stayed out of it after the first months. Its fighting from June 1876 is told under the Montenegrin–Ottoman and Serbian–Ottoman wars.: Regionens historiker är fortfarande oeniga om i vilken mån upproret var en social revolt av bönder mot godsägare, ett nationellt uppror och ett religionskrig, och om vilken roll katolikerna spelade; de flesta av dem höll sig utanför efter de första månaderna. Striderna från juni 1876 berättas under montenegrinsk-osmanska och serbisk-osmanska krigen.
