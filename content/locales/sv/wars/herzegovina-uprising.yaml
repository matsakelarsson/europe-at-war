Bosnia’s Christian peasants owed up to half their harvest to Muslim landlords, as well as taxes collected by tax farmers, and the bad harvest of 1874 and higher taxes in 1875 made their burden unbearable. In early July 1875 villagers around Nevesinje in Herzegovina clashed with Ottoman troops, and within weeks the revolt spread to Bileća, Stolac, Gacko and the Montenegrin border; Catholics around Gabela also rose, hoping for Austrian intervention. Bands of rebels destroyed border posts and the towers of the beys, and besieged Trebinje in August. In mid-August Serbs in the Bosnian Krajina rose too, around Kozara and Grmeč.: Bosniens kristna bönder var skyldiga muslimska godsägare upp till hälften av sin skörd, utöver skatter som drevs in av skattearrendatorer, och den dåliga skörden 1874 och höjda skatter 1875 gjorde bördan outhärdlig. I början av juli 1875 drabbade bybor kring Nevesinje i Hercegovina samman med osmanska trupper, och inom några veckor hade revolten spritt sig till Bileća, Stolac, Gacko och den montenegrinska gränsen; även katoliker kring Gabela reste sig i hopp om ett österrikiskt ingripande. Rebellgrupper förstörde gränsposteringar och begarnas torn och belägrade Trebinje i augusti. I mitten av augusti reste sig även serberna i Bosniska Krajina, kring Kozara och Grmeč.
Montenegro and Serbia sent arms and volunteers, and Italians, Russians and others came to fight, while refugees fled to Austrian Dalmatia and Croatia and to Montenegro, between 100,000 and 250,000 by the end of 1876. The great powers tried to contain the crisis. The Andrássy Note of December 1875 and the Berlin Memorandum of May 1876 called for reforms, but the rebels would not lay down their arms without guarantees. Villages were burned and civilians driven out by both sides. In June 1876 Serbia and Montenegro went to war, and the rising merged into the wider wars that ended with the Austro-Hungarian occupation of 1878.: Montenegro och Serbien sände vapen och frivilliga, och italienare, ryssar och andra kom för att strida, medan flyktingar flydde till österrikiska Dalmatien och Kroatien och till Montenegro, mellan 100 000 och 250 000 vid slutet av 1876. Stormakterna försökte begränsa krisen. Andrássynoten i december 1875 och Berlinmemorandumet i maj 1876 krävde reformer, men rebellerna ville inte lägga ned vapnen utan garantier. Byar brändes och civila fördrevs av båda sidor. I juni 1876 gick Serbien och Montenegro i krig, och upproret gick upp i de större krig som slutade med Österrike-Ungerns ockupation 1878.
