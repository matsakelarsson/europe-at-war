Nevesinje: Nevesinje
A clash between armed villagers and Ottoman troops on 9 July, remembered in Serbian as the “Nevesinje rifle”, set off the rising across Herzegovina.: En sammandrabbning mellan beväpnade bybor och osmanska trupper den 9 juli, som på serbiska minns som ”Nevesinjegeväret”, utlöste upproret i hela Hercegovina.
Gabela: Gabela
Catholic villagers in the lower Neretva valley rose early in July, but most Catholics soon withdrew when no Austrian help came.: Katolska bybor i nedre Neretvadalen reste sig i början av juli, men de flesta katoliker drog sig snart tillbaka när ingen österrikisk hjälp kom.
Trebinje: Trebinje
August 1875: augusti 1875
Rebels besieged the town until Ottoman battalions landed by sea at Klek relieved it at the end of August.: Rebeller belägrade staden tills osmanska bataljoner som landsatts sjövägen vid Klek undsatte den i slutet av augusti.
Kozara: Kozara
Serbs of the Bosnian Krajina rose here and in the Grmeč hills, cutting Ottoman communications and driving Muslim villagers into the towns.: Serberna i Bosniska Krajina reste sig här och i Grmečbergen, skar av de osmanska förbindelserna och drev muslimska bybor in i städerna.
