# Svenska översättningar av katalogtexten (våg 12); stegtexterna kommer senare.
Hispano-Moroccan War: Spansk-marockanska kriget
? "A war between Spain and Morocco, called the African War (Guerra de África) in Spain and the War of Tetuán in Morocco. After tribesmen of the Anjera destroyed new fortifications outside Ceuta in August 1859, the government of Leopoldo O’Donnell declared war in October and landed an army of about 45,000 men at Ceuta. Through the winter it fought its way south along the coast, winning at Castillejos on 1 January 1860, and on 4–6 February it defeated the army of Mawlay al-Abbas, the sultan’s brother, and entered Tetuán. After a last Spanish victory at Wad-Ras on 23 March, Morocco made peace by the Treaty of Wad-Ras of 26 April 1860: it enlarged the territories of Ceuta and Melilla, promised Spain a fishing post at Santa Cruz de la Mar Pequeña on the Atlantic coast, and agreed to pay an indemnity of 20 million duros, with Tetuán held by Spain until it was paid. Spain lost about 4,000 dead, most of them to cholera and other disease, and Morocco about 6,000. The war was hugely popular in Spain, while in Morocco the indemnity emptied the treasury and opened the way to European loans and control of the customs."
: "Ett krig mellan Spanien och Marocko, i Spanien kallat Afrikakriget (Guerra de África) och i Marocko Tetuánkriget. Sedan stammän från Anjera hade förstört nya befästningar utanför Ceuta i augusti 1859 förklarade Leopoldo O’Donnells regering krig i oktober och landsatte en armé på omkring 45 000 man i Ceuta. Under vintern kämpade den sig söderut längs kusten, segrade vid Castillejos den 1 januari 1860 och besegrade den 4–6 februari den armé som leddes av Mawlay al-Abbas, sultanens bror, och tågade in i Tetuán. Efter en sista spansk seger vid Wad-Ras den 23 mars slöt Marocko fred genom fördraget i Wad-Ras den 26 april 1860: landet utvidgade Ceutas och Melillas territorier, utlovade Spanien en fiskestation vid Santa Cruz de la Mar Pequeña på Atlantkusten och gick med på att betala ett krigsskadestånd på 20 miljoner duros, medan Spanien behöll Tetuán tills summan var betald. Spanien förlorade omkring 4 000 döda, de flesta i kolera och andra sjukdomar, och Marocko omkring 6 000. Kriget var oerhört populärt i Spanien, medan skadeståndet i Marocko tömde statskassan och öppnade vägen för europeiska lån och europeisk kontroll över tullväsendet."
