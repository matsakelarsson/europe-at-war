# Svenska översättningar av katalogtexten (våg 10); stegtexterna kommer senare.
Hōgen rebellion: Hōgenupproret
? "A short clash in Heian-kyō (Kyoto) over the imperial succession and the leadership of the Fujiwara regents’ house, in which warrior bands decided a dispute at court for the first time. When the retired emperor Toba died in the seventh month of 1156, his son the retired emperor Sutoku, whose line had been passed over in favour of his half-brother Go-Shirakawa, joined forces with the Minister of the Left Fujiwara no Yorinaga, who had lost out to his brother, the regent Fujiwara no Tadamichi. Both sides called in warriors, splitting families: Minamoto no Tameyoshi, his son Tametomo and Taira no Tadamasa joined Sutoku, while Tameyoshi’s eldest son Minamoto no Yoshitomo and Tadamasa’s nephew Taira no Kiyomori sided with Go-Shirakawa. Before dawn on 29 July 1156 (the eleventh day of the seventh month) Kiyomori and Yoshitomo attacked Sutoku’s headquarters at the Shirakawa palace with about 600 horsemen and set it on fire. Yorinaga died of an arrow wound; Sutoku was exiled to Sanuki on Shikoku, where he died in 1164; Tameyoshi and Tadamasa were beheaded, the first executions ordered by the court since 810, and Tametomo was exiled to Izu Ōshima. The victory made Kiyomori and Yoshitomo powers at court, and their rivalry led to the Heiji rebellion three years later."
: "En kort sammandrabbning i Heian-kyō (Kyoto) om den kejserliga tronföljden och ledningen av Fujiwararegenternas ätt, där krigarband för första gången avgjorde en strid vid hovet. När den abdikerade kejsaren Toba dog i sjunde månaden 1156 slog sig hans son, den abdikerade kejsaren Sutoku, vars ättelinje hade förbigåtts till förmån för halvbrodern Go-Shirakawa, samman med vänsterministern Fujiwara no Yorinaga, som hade förlorat maktkampen mot sin bror, regenten Fujiwara no Tadamichi. Båda sidor kallade in krigare, vilket splittrade släkter: Minamoto no Tameyoshi, hans son Tametomo och Taira no Tadamasa anslöt sig till Sutoku, medan Tameyoshis äldste son Minamoto no Yoshitomo och Tadamasas brorson Taira no Kiyomori ställde sig på Go-Shirakawas sida. Före gryningen den 29 juli 1156 (den elfte dagen i sjunde månaden) angrep Kiyomori och Yoshitomo Sutokus högkvarter i Shirakawapalatset med omkring 600 ryttare och satte eld på det. Yorinaga dog av ett pilsår; Sutoku förvisades till Sanuki på Shikoku, där han dog 1164; Tameyoshi och Tadamasa halshöggs, de första avrättningar som hovet hade beordrat sedan 810, och Tametomo förvisades till Izu Ōshima. Segern gjorde Kiyomori och Yoshitomo till maktfaktorer vid hovet, och deras rivalitet ledde till Heijiupproret tre år senare."
