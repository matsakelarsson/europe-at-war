# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
Holy Man’s rebellion: Den helige mannens uppror
? A millenarian rising in southern French Laos and north-eastern Siam, led by men who claimed to be phu mi bun, “people of merit” or holy men. In 1901 prophecies spread across the Mekong lands that a time of disaster was coming, when gravel would turn to gold and gold to gravel, and that a holy man would bring a just new order. They fell on ground prepared by French taxes and forced labour in Laos and by Siam’s new centralised provincial government, which was taking power from the old Lao lords of the Khorat plateau. In French Laos the movement was led by Ong Keo, a leader of the Mon-Khmer-speaking upland peoples (Lao Theung) of the Bolaven plateau, and his follower Ong Kommandam, an Alak; about 1,500 men ambushed a French column near Saravane in April 1901, and in April 1902 a crowd that marched on the French post at Savannakhet was fired upon, with about 150 killed. In Siam, Ong Man’s followers took Khemarat on 28 March 1902 and marched on Ubon, where Siamese troops with artillery, sent by the royal commissioner Prince Sanphasitthiprasong, routed them at Ban Saphue on 3–4 April, killing about 300 and capturing about 400; the leaders were executed and the rising in Siam ended that year. In Laos fighting went on in the uplands. Ong Keo was killed in 1910 during talks with the French commissioner, in circumstances the sources describe differently. Ong Kommandam escaped and led resistance from the Bolaven plateau for more than two decades, calling for the end of French rule and passing messages in a secret script he devised, until French troops killed him on 23 September 1936. His son Sithon Kommadam later became a leader of the Pathet Lao.
: En millenaristisk resning i södra Franska Laos och nordöstra Siam, ledd av män som gjorde anspråk på att vara phu mi bun, ”människor med förtjänst” eller heliga män. År 1901 spreds profetior över Mekongländerna om att en tid av katastrofer var nära, då grus skulle förvandlas till guld och guld till grus, och att en helig man skulle införa en ny, rättvis ordning. De föll i jord som hade beretts av franska skatter och tvångsarbete i Laos och av Siams nya centraliserade provinsförvaltning, som tog makten från de gamla laotiska stormännen på Khoratplatån. I Franska Laos leddes rörelsen av Ong Keo, en ledare för de mon-khmerspråkiga bergsfolken (lao theung) på Bolavenplatån, och hans anhängare Ong Kommandam, en alak; omkring 1 500 man överföll en fransk kolonn nära Saravane i april 1901, och i april 1902 öppnades eld mot en folkmassa som marscherade mot den franska posten i Savannakhet, varvid omkring 150 dödades. I Siam intog Ong Mans anhängare Khemarat den 28 mars 1902 och marscherade mot Ubon, där siamesiska trupper med artilleri, sända av den kunglige kommissarien prins Sanphasitthiprasong, krossade dem vid Ban Saphue den 3–4 april, dödade omkring 300 och tog omkring 400 till fånga; ledarna avrättades och resningen i Siam upphörde samma år. I Laos fortsatte striderna i höglandet. Ong Keo dödades 1910 under förhandlingar med den franske kommissarien, under omständigheter som källorna beskriver olika. Ong Kommandam kom undan och ledde motståndet från Bolavenplatån i mer än två årtionden; han krävde ett slut på det franska styret och sände meddelanden i en hemlig skrift som han själv hade skapat, tills franska trupper dödade honom den 23 september 1936. Hans son Sithon Kommadam blev senare en av Pathet Laos ledare.
