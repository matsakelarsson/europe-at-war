Hong Gyeong-nae’s rebellion: Hong Gyeong-naes uppror
A rising in Pyongan province, in north-western Korea, led by Hong Gyeong-nae, an impoverished yangban and geomancer, with discontented local gentry, merchants and miners, after a year of famine. They resented the discrimination of the court in Hanseong against men of the north-west and the burden of compulsory grain loans and taxes, and drew on prophecies of the fall of the Yi dynasty. Rising at Gasan on the night of 31 January 1812, they took eight towns north of the Cheongcheon River within days and opened the government granaries, but were beaten at Songnim near Bakcheon on 11 February and soon after near Gwaksan, and fell back into the walled town of Jeongju. There the rebels and the peasants who had fled to them held out against the government army for about a hundred days, until the wall was blown open by a mine on 29 May 1812. Hong was killed; of 2,983 people taken, 1,917 were executed. The rising is also called the Pyeongan or Gwanseo peasant war.: En resning i provinsen Pyongan i nordvästra Korea, ledd av Hong Gyeong-nae, en utarmad yangban och geomant, tillsammans med missnöjd lokal lantadel, köpmän och gruvarbetare, efter ett år av hungersnöd. De var förbittrade över att hovet i Hanseong diskriminerade män från nordväst och över bördan av tvångslån av spannmål och skatter, och de stödde sig på profetior om Yidynastins fall. De reste sig i Gasan natten den 31 januari 1812, intog inom några dagar åtta städer norr om Cheongcheonfloden och öppnade regeringens spannmålsmagasin, men besegrades vid Songnim nära Bakcheon den 11 februari och kort därefter nära Gwaksan och drog sig tillbaka till den befästa staden Jeongju. Där höll rebellerna och de bönder som hade flytt till dem stånd mot regeringsarmén i omkring hundra dagar, tills muren sprängdes med en mina den 29 maj 1812. Hong dödades; av 2 983 tillfångatagna avrättades 1 917. Resningen kallas också bondekriget i Pyeongan eller Gwanseo.
