# Svenska översättningar av katalogtexten (våg 10); stegtexterna kommer senare.
Honnō-ji Incident and the Oda succession war: Honnō-ji-incidenten och kriget om Odas arv
The killing of Oda Nobunaga by his general Akechi Mitsuhide, and the year of fighting from which Hashiba (later Toyotomi) Hideyoshi emerged as Nobunaga’s heir in all but name. Before dawn on 21 June 1582 Mitsuhide, sent with his army to reinforce Hideyoshi against the Mōri, turned instead on Kyoto and surrounded the temple of Honnō-ji, where Nobunaga was staying with a small escort; Nobunaga died in the burning temple, and his heir Oda Nobutada was killed at the Nijō palace the same morning. Hideyoshi, besieging Takamatsu castle in Bitchū, made peace with the Mōri and marched his army back in about a week, and on 2 July he beat Mitsuhide at Yamazaki; Mitsuhide was killed as he fled. At the Kiyosu conference the Oda generals chose Nobutada’s infant son as heir, but Hideyoshi and Shibata Katsuie, the senior Oda general, soon fell out, and in June 1583 Hideyoshi defeated Shibata’s army at Shizugatake and took his castle of Kitanoshō, where Shibata and his wife Oichi, Nobunaga’s sister, killed themselves.: Dödandet av Oda Nobunaga genom hans general Akechi Mitsuhide, och det år av strider ur vilket Hashiba (senare Toyotomi) Hideyoshi framgick som Nobunagas arvtagare i allt utom namnet. Före gryningen den 21 juni 1582 vände sig Mitsuhide, som sänts med sin armé för att förstärka Hideyoshi mot Mōriklanen, i stället mot Kyoto och omringade templet Honnō-ji, där Nobunaga bodde med en liten eskort; Nobunaga omkom i det brinnande templet, och hans arvinge Oda Nobutada dödades vid Nijōpalatset samma morgon. Hideyoshi, som belägrade Takamatsuborgen i Bitchū, slöt fred med Mōriklanen och förde tillbaka sin armé på ungefär en vecka, och den 2 juli besegrade han Mitsuhide vid Yamazaki; Mitsuhide dödades under flykten. Vid Kiyosukonferensen valde Odas generaler Nobutadas späde son till arvinge, men Hideyoshi och Shibata Katsuie, den främste av Odas generaler, blev snart osams, och i juni 1583 besegrade Hideyoshi Shibatas armé vid Shizugatake och intog hans borg Kitanoshō, där Shibata och hans hustru Oichi, Nobunagas syster, tog livet av sig.
