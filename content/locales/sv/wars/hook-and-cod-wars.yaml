Hook and Cod wars: Hoek- och kabeljauwkrigen
A long series of feuds and civil wars in the County of Holland and Zeeland between two parties, the Hooks (Hoeken), mostly nobles, and the Cods (Kabeljauwen), drawn largely from the towns. They began in 1350 in a struggle between Countess Margaret and her son William V, flared again when Jacqueline of Bavaria fought her uncle John and then Philip the Good of Burgundy for the county, and became a lasting rivalry between factions in the towns. Philip, backed by the Cods, beat Jacqueline’s English allies at Brouwershaven in 1426 and took over Holland in 1433. The last rising, the Hook revolt of Frans van Brederode (1488–1490), ended with his defeat and death.: "En lång rad fejder och inbördeskrig i grevskapet Holland och Zeeland mellan två partier: hoekerna (Hoeken, ”krokarna”), mestadels adelsmän, och kabeljauwerna (Kabeljauwen, ”torskarna”), som till stor del kom från städerna. De började 1350 i en strid mellan grevinnan Margareta och hennes son Vilhelm V, blossade upp igen när Jakoba av Bayern kämpade om grevskapet mot sin farbror Johan och sedan mot Filip den gode av Burgund, och blev en bestående rivalitet mellan fraktioner i städerna. Filip, med stöd av kabeljauwerna, besegrade Jakobas engelska allierade vid Brouwershaven 1426 och tog över Holland 1433. Det sista upproret, Frans van Brederodes hoekska revolt (1488–1490), slutade med hans nederlag och död."
