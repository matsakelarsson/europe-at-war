# Svenska översättningar av katalogtexten (våg 7); stegtexterna kommer senare.
Hotaki Afghan invasion of Persia: Hotaki-afghanernas invasion av Persien
The revolt of the Ghilzai Afghans of Kandahar against Safavid Persia and their conquest of its capital. In 1709 the Hotaki chief Mirwais killed the Persian governor of Kandahar and beat off every army sent against him. His son Mahmud invaded Persia, routed the Safavid army at Gulnabad in March 1722 and starved Isfahan into surrender after a seven-month siege in which tens of thousands died; Shah Sultan Husayn gave him the crown. Russia and the Ottoman Empire seized the north and west of the country, while the Safavid prince Tahmasp held out in the north. Mahmud’s cousin Ashraf beat an Ottoman army in 1726, but from 1729 Tahmasp’s general Nader drove the Afghans out of Persia in a few months, and Ashraf was killed in 1730.: Upproret bland afghanerna av ghilzaistammen i Kandahar mot det safavidiska Persien och deras erövring av rikets huvudstad. År 1709 dödade hotakihövdingen Mirwais den persiske guvernören i Kandahar och slog tillbaka varje här som sändes mot honom. Hans son Mahmud föll in i Persien, slog den safavidiska hären på flykten vid Gulnabad i mars 1722 och svalt ut Isfahan till kapitulation efter en sju månader lång belägring där tiotusentals människor dog; shah Sultan Husayn överlämnade kronan till honom. Ryssland och Osmanska riket bemäktigade sig landets norra och västra delar, medan den safavidiske prinsen Tahmasp höll stånd i norr. Mahmuds kusin Ashraf slog en osmansk här 1726, men från 1729 drev Tahmasps general Nader ut afghanerna ur Persien på några månader, och Ashraf dödades 1730.
