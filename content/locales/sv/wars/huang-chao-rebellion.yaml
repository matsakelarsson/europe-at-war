# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
Huang Chao rebellion: Huang Chaos uppror
? "The great rising against the Tang dynasty led first by Wang Xianzhi and then by Huang Chao, salt smugglers from the eastern plain. Out of famine and heavy taxes, rebel bands formed in 874–875 between the Yellow River and the Huai. After Wang was killed in 878, Huang Chao led his army in a march of thousands of kilometres: across the Yangtze, through Fujian to Guangzhou, which he took in 879, and back north through Hunan and along the Yangtze. In the winter of 880–881 he took Luoyang and Chang’an, the emperor Xizong fled to Chengdu, and Huang proclaimed himself emperor of Qi. Tang armies and the regional governors closed in on Chang’an, where famine followed. In 883 the Shatuo Turk Li Keyong retook the capital, and Huang, pursued across Henan, was killed in a valley in Shandong in July 884. Huge numbers died, in the sack of Guangzhou, the massacres in Chang’an and the famine. The Tang survived in name, but power passed to the generals who had fought the rebels, among them Huang’s former officer Zhu Wen, who ended the dynasty in 907."
: "Det stora upproret mot Tangdynastin, som leddes först av Wang Xianzhi och sedan av Huang Chao, saltsmugglare från den östra slätten. Ur hungersnöd och tunga skatter växte 874–875 rebellband fram mellan Gula floden och Huai. Sedan Wang hade dödats 878 ledde Huang Chao sin armé på en marsch över tusentals kilometer: över Yangtze, genom Fujian till Guangzhou, som han intog 879, och tillbaka norrut genom Hunan och längs Yangtze. Vintern 880–881 intog han Luoyang och Chang’an, kejsar Xizong flydde till Chengdu, och Huang utropade sig till kejsare av Qi. Tangrikets arméer och de regionala guvernörerna drog åt nätet kring Chang’an, där hungersnöd följde. År 883 återtog shatuoturken Li Keyong huvudstaden, och Huang, som förföljdes genom Henan, dödades i en dal i Shandong i juli 884. Ofantligt många dog, vid plundringen av Guangzhou, i massakrerna i Chang’an och i hungersnöden. Tangdynastin levde vidare till namnet, men makten övergick till de fältherrar som hade bekämpat rebellerna, bland dem Huangs förre officer Zhu Wen, som gjorde slut på dynastin 907."
