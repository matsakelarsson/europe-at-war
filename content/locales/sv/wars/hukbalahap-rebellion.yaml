# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
Hukbalahap rebellion: Hukbalahapupproret
? A communist-led peasant rebellion in Central Luzon against the government of the newly independent Philippines. The Hukbalahap (Hukbo ng Bayan Laban sa Hapon, the People’s Army against the Japanese) had been founded in 1942 by the Communist Party of the Philippines (PKP) and the peasant unions of the rice plains around Mount Arayat, where tenant farmers had long struggled with the landlords of the great estates, and it fought the Japanese occupation. After the war it was denied recognition, its elected congressmen, among them its commander Luis Taruc, were unseated in 1946, and the landlords’ private armies and the military police turned on its followers. From mid-1946 the Huks took up arms again, and by 1950, as the People’s Liberation Army (HMB), they had some 11,000–13,000 fighters and raided towns close to Manila. Mass arrests of the party leadership in Manila in October 1950, a reformed army, American aid and the policies of Defence Secretary and later President Ramon Magsaysay, who combined military pressure with offers of land, amnesty and resettlement, broke the movement. Taruc surrendered on 17 May 1954. Army figures give about 9,700 Huks and 1,600 soldiers killed.
: Ett kommunistlett bondeuppror på centrala Luzon mot regeringen i det nyss självständiga Filippinerna. Hukbalahap (Hukbo ng Bayan Laban sa Hapon, Folkets armé mot japanerna) hade grundats 1942 av Filippinernas kommunistiska parti (PKP) och bondefackföreningarna på risslätterna kring berget Arayat, där arrendebönderna länge hade kämpat mot ägarna till de stora godsen, och den bekämpade den japanska ockupationen. Efter kriget nekades rörelsen erkännande, dess valda kongressledamöter, bland dem befälhavaren Luis Taruc, fråntogs sina platser 1946, och godsägarnas privatarméer och militärpolisen vände sig mot dess anhängare. Från mitten av 1946 grep hukerna till vapen igen, och 1950 hade de, nu som Folkets befrielsearmé (HMB), omkring 11 000–13 000 kämpar och gjorde räder mot städer nära Manila. Massarresteringar av partiledningen i Manila i oktober 1950, en reformerad armé, amerikanskt bistånd och den politik som fördes av försvarsministern och senare presidenten Ramon Magsaysay, som kombinerade militära påtryckningar med erbjudanden om jord, amnesti och nya bosättningar, bröt rörelsen. Taruc kapitulerade den 17 maj 1954. Enligt arméns siffror dödades omkring 9 700 huker och 1 600 soldater.
