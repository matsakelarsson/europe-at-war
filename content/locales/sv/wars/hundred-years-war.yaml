In the spring of 1451 French armies under Jean de Dunois entered Guyenne. Blaye, Bourg and Fronsac fell, Bordeaux agreed terms and opened its gates on 30 June, and Bayonne surrendered in August. But the Gascons had been ruled by English kings for three hundred years, their wine trade with England was their living, and many resented the new king’s taxes. Bordeaux invited the English back, and on 23 October 1452 John Talbot, Earl of Shrewsbury, then in his sixties, was let into the city with 3,000 men. Much of western Gascony went over to him.: Våren 1451 tågade franska härar under Jean de Dunois in i Guyenne. Blaye, Bourg och Fronsac föll, Bordeaux gick med på villkor och öppnade sina portar den 30 juni, och Bayonne kapitulerade i augusti. Men gaskognarna hade styrts av engelska kungar i trehundra år, deras vinhandel med England var deras levebröd, och många var missnöjda med den nye kungens skatter. Bordeaux bjöd tillbaka engelsmännen, och den 23 oktober 1452 släpptes John Talbot, earl av Shrewsbury, då i sextioårsåldern, in i staden med 3 000 man. Stora delar av västra Gascogne gick över till honom.
In 1453 three French armies converged on Guyenne. One besieged Castillon on the Dordogne, where Jean Bureau built a fortified camp packed with guns. On 17 July Talbot, told that the French were retreating, attacked the camp before all his troops had come up. His men were cut down by the guns and then routed by Breton cavalry, and Talbot and his son were killed. Bordeaux held out until 19 October 1453.: År 1453 ryckte tre franska härar fram mot Guyenne. En belägrade Castillon vid Dordogne, där Jean Bureau byggde ett befäst läger fullt av kanoner. Den 17 juli anföll Talbot, som fått höra att fransmännen var på reträtt, lägret innan alla hans trupper hunnit fram. Hans män mejades ned av kanonerna och slogs sedan på flykten av bretonskt kavalleri, och Talbot och hans son dödades. Bordeaux höll ut till den 19 oktober 1453.
No peace treaty ended the war, and no one at the time knew it was over. Calais stayed English until 1558, and English and later British monarchs called themselves kings of France until 1801. The war had devastated much of France. Many historians think it strengthened royal power and a sense of nationhood in both kingdoms, and in England defeat helped to bring on the Wars of the Roses, which began within two years.: Inget fredsfördrag avslutade kriget, och ingen på den tiden visste att det var över. Calais förblev engelskt till 1558, och engelska och senare brittiska monarker kallade sig kungar av Frankrike till 1801. Kriget hade ödelagt stora delar av Frankrike. Många historiker anser att det stärkte kungamakten och en känsla av nationell samhörighet i båda rikena, och i England bidrog nederlaget till att utlösa rosornas krig, som bröt ut inom två år.
