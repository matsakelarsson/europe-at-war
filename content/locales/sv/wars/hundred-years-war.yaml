Joan met Charles in the castle and convinced him and his theologians, who questioned her at Poitiers, to let her go to Orléans.: Jeanne mötte Karl på slottet och övertygade honom och hans teologer, som förhörde henne i Poitiers, om att låta henne bege sig till Orléans.
17 July 1429: 17 juli 1429
Charles was anointed and crowned in the cathedral, the traditional place for French coronations, deep in territory held by his enemies.: Karl smordes och kröntes i katedralen, den traditionella platsen för franska kröningar, djupt inne på område som hölls av hans fiender.
