The name Hundred Years’ War was coined in the 19th century. Historians often divide the fighting into an Edwardian phase (1337–1360), a Caroline phase (1369–1389) and a Lancastrian phase (1415–1453), separated by long truces. No peace treaty ended it.: Namnet hundraårskriget myntades på 1800-talet. Historiker delar ofta in striderna i en edvardiansk fas (1337–1360), en karolinsk fas (1369–1389) och en lancastersk fas (1415–1453), åtskilda av långa stillestånd. Inget fredsfördrag avslutade kriget.
Dates are Julian, as was usual at the time. The English year then began on 25 March, but years here begin on 1 January.: Datum anges enligt den julianska kalendern, som var brukligt på den tiden. Det engelska året började då den 25 mars, men åren här börjar den 1 januari.
Chronicles give armies and losses that are often far too large. Numbers here follow modern estimates where they exist, and historians still disagree about many of them, Agincourt’s in particular.: Krönikorna anger ofta alltför stora härar och förluster. Siffrorna här följer moderna uppskattningar där sådana finns, och historikerna är fortfarande oeniga om många av dem, särskilt vid Agincourt.
Sluys is today’s Sluis in the Netherlands and Agincourt is Azincourt. Guyenne was the French name for the English king’s duchy of Aquitaine, which by 1337 meant little more than Gascony around Bordeaux and Bayonne.: Sluys är dagens Sluis i Nederländerna och Agincourt är Azincourt. Guyenne var det franska namnet på den engelske kungens hertigdöme Aquitanien, som 1337 inte omfattade mycket mer än Gascogne kring Bordeaux och Bayonne.
The Breton War of Succession (1341–1365), the Jacquerie (1358) and the Armagnac–Burgundian Civil War (1407–1435) have their own entries.: Bretonska tronföljdskriget (1341–1365), Jacquerien (1358) och inbördeskriget mellan armagnacer och burgunder (1407–1435) har egna artiklar.
