After the plague the war went on in raids, sieges and fights between garrisons, and in 1350 John II succeeded Philip VI. In October 1355 Edward, Prince of Wales, the Black Prince, led an Anglo-Gascon army from Bordeaux on a great raid, a chevauchée, across Languedoc to Narbonne on the Mediterranean. It burned the lower town of Carcassonne and hundreds of villages and returned to Bordeaux in December laden with loot. Such raids were meant to ruin the French king’s lands and revenues, show his subjects he could not protect them and draw him into battle.: Efter pesten fortsatte kriget med räder, belägringar och strider mellan garnisoner, och 1350 efterträddes Filip VI av Johan II. I oktober 1355 ledde Edvard, prins av Wales, den svarte prinsen, en engelsk-gaskognisk här från Bordeaux på ett stort plundringståg, en chevauchée, genom Languedoc till Narbonne vid Medelhavet. Den brände Carcassonnes nedre stad och hundratals byar och återvände till Bordeaux i december tyngd av byte. Sådana räder var avsedda att ödelägga den franske kungens länder och inkomster, visa hans undersåtar att han inte kunde skydda dem och locka honom till strid.
In August 1356 the prince marched north from Bergerac towards the Loire, while Henry of Grosmont, now Duke of Lancaster, raided Normandy. Finding the Loire crossings held near Tours, the prince turned back south, and King John caught up with him near Poitiers. On 19 September about 6,000 Anglo-Gascons, fighting on foot behind hedges and marshy ground, met an attack by some 14,000–16,000 French. They threw back several assaults; then, as the king’s own division attacked, a small mounted force came round the French rear and the army broke. John and his youngest son Philip were taken, with some 2,000 knights and men-at-arms.: I augusti 1356 tågade prinsen norrut från Bergerac mot Loire, medan Henrik av Grosmont, nu hertig av Lancaster, härjade i Normandie. När prinsen fann övergångarna över Loire bevakade nära Tours vände han tillbaka söderut, och kung Johan hann upp honom nära Poitiers. Den 19 september mötte omkring 6 000 engelsmän och gaskognare, som stred till fots bakom häckar och sank mark, ett anfall av omkring 14 000–16 000 fransmän. De slog tillbaka flera stormningar; när sedan kungens egen avdelning anföll tog sig en liten beriden styrka runt till fransmännens rygg, och hären bröts. Johan och hans yngste son Filip tillfångatogs tillsammans med omkring 2 000 riddare och krigare.
The prince took his royal prisoner to Bordeaux, where a two-year truce was agreed in March 1357, and then to London. In France the defeat discredited the nobility and the crown. The king’s son Charles, the dauphin, ruled as lieutenant, facing the Estates-General in Paris, a rival in his cousin Charles II of Navarre, and bands of unemployed soldiers who lived off the countryside.: Prinsen förde sin kunglige fånge till Bordeaux, där ett tvåårigt stillestånd slöts i mars 1357, och därefter till London. I Frankrike misskrediterade nederlaget adeln och kronan. Kungens son Karl, dauphinen, styrde som ståthållare och ställdes mot generalständerna i Paris, en rival i sin kusin Karl II av Navarra och skaror av arbetslösa soldater som levde på landsbygden.
