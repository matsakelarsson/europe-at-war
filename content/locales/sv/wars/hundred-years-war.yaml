30 May 1431: 30 maj 1431
Seat of the English government of Normandy, where Joan was tried and burned. A retrial ordered by the pope declared her innocent in 1456, and she was made a saint in 1920.: Säte för den engelska regeringen i Normandie, där Jeanne ställdes inför rätta och brändes. En ny rättegång på påvens order förklarade henne oskyldig 1456, och hon helgonförklarades 1920.
