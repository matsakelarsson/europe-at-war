Hundred Years’ War: Hundraårskriget
A long series of wars and truces between the kings of England and France, fought over the English king’s lands in France and his claim, from 1340, to the French crown. England won the great battles of Sluys, Crécy, Poitiers and Agincourt and at times ruled much of France, but France recovered its lost lands in the 1370s and again after Joan of Arc and the relief of Orléans in 1429, and by 1453 England held only Calais.: En lång rad krig och stillestånd mellan Englands och Frankrikes kungar, som gällde den engelske kungens besittningar i Frankrike och hans anspråk, från 1340, på den franska kronan. England vann de stora slagen vid Sluys, Crécy, Poitiers och Agincourt och styrde periodvis stora delar av Frankrike, men Frankrike återtog sina förlorade områden på 1370-talet och på nytt efter Jeanne d’Arc och undsättningen av Orléans 1429, och 1453 behöll England endast Calais.
