The French vanguard under La Hire and Poton de Xaintrailles charged before the English were ready, and the archers bore most of the losses. Joan was with the main army, behind.: Den franska förtruppen under La Hire och Poton de Xaintrailles anföll innan engelsmännen var redo, och bågskyttarna fick bära de största förlusterna. Jeanne befann sig med huvudhären längre bak.
