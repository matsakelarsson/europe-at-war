Held for Henry VI, early 1429: Hölls för Henrik VI i början av 1429
On 23 May 1430 Joan was captured by Burgundian troops during a sortie from Compiègne, and John of Luxembourg, in whose hands she was held, sold her to the English. A church court at Rouen, led by Pierre Cauchon, Bishop of Beauvais, tried her for heresy, and she was burned in the city’s market place on 30 May 1431, aged about 19. Henry VI, aged ten, was crowned king of France in Notre-Dame in Paris that December, but the Lancastrian cause was weakening, and Philip the Good was tiring of the alliance.: Den 23 maj 1430 tillfångatogs Jeanne av burgundiska trupper under ett utfall från Compiègne, och Johan av Luxemburg, i vars händer hon hölls, sålde henne till engelsmännen. En kyrklig domstol i Rouen, ledd av Pierre Cauchon, biskop av Beauvais, ställde henne inför rätta för kätteri, och hon brändes på stadens torg den 30 maj 1431, omkring 19 år gammal. Den tioårige Henrik VI kröntes till kung av Frankrike i Notre-Dame i Paris i december samma år, men den lancasterska saken försvagades, och Filip den gode började tröttna på förbundet.
At a peace congress at Arras in 1435 the English would not give up the claim to the French throne and left. On 21 September, a week after Bedford died at Rouen, Philip made a separate peace with Charles VII, who disowned the murder at Montereau and ceded the towns on the Somme and the counties of Mâcon and Auxerre; Philip was released from homage for life. Risings broke out in Normandy, and the French took Dieppe and Harfleur. On 13 April 1436 the Constable, Arthur de Richemont, entered Paris with Burgundian help after the townspeople rose against the English garrison, which withdrew into the Bastille and was allowed to leave. Philip’s attempt to take Calais that summer failed.: Vid en fredskongress i Arras 1435 vägrade engelsmännen att ge upp anspråket på den franska tronen och lämnade kongressen. Den 21 september, en vecka efter att Bedford dött i Rouen, slöt Filip separatfred med Karl VII, som tog avstånd från mordet i Montereau och avträdde städerna vid Somme och grevskapen Mâcon och Auxerre; Filip befriades från länsplikt på livstid. Uppror bröt ut i Normandie, och fransmännen intog Dieppe och Harfleur. Den 13 april 1436 tågade konnetabeln Arthur de Richemont med burgundisk hjälp in i Paris, sedan invånarna rest sig mot den engelska garnisonen, som drog sig tillbaka in i Bastiljen och fick fritt avtåg. Filips försök att inta Calais samma sommar misslyckades.
