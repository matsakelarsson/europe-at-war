The truce did not hold for long. In 1341 the death of Duke John III of Brittany without children set off a war of succession there, with France backing Charles of Blois, husband of the duke’s niece, and England backing the duke’s half-brother John of Montfort; it went on, with English garrisons in Brittany, until 1364. In 1345 Henry of Grosmont, Earl of Derby, won back much of the Dordogne and Garonne valleys for Edward and beat a larger French force at Auberoche. The next spring Philip’s son John, Duke of Normandy, besieged Aiguillon on the Garonne.: Stilleståndet höll inte länge. År 1341 utlöste hertig Johan III av Bretagnes barnlösa död ett tronföljdskrig där, med Frankrike som stödde Karl av Blois, make till hertigens brorsdotter, och England som stödde hertigens halvbror Johan av Montfort; det pågick, med engelska garnisoner i Bretagne, till 1364. År 1345 återvann Henrik av Grosmont, earl av Derby, stora delar av Dordogne- och Garonnedalarna åt Edvard och besegrade en större fransk styrka vid Auberoche. Följande vår belägrade Filips son Johan, hertig av Normandie, Aiguillon vid Garonne.
On 12 July 1346 Edward landed with some 10,000–15,000 men at Saint-Vaast-la-Hougue in the Cotentin. His army burned and plundered its way across Normandy, stormed and sacked Caen on 26 July and marched up the Seine to within sight of Paris before turning north. With Philip’s army in pursuit it forced the ford of Blanchetaque across the tidal Somme on 24 August. Two days later Edward drew up his army on a slope near Crécy-en-Ponthieu, his men-at-arms on foot and his archers on the flanks.: Den 12 juli 1346 landsteg Edvard med omkring 10 000–15 000 man vid Saint-Vaast-la-Hougue på Cotentinhalvön. Hans här brände och plundrade sig fram genom Normandie, stormade och plundrade Caen den 26 juli och tågade uppför Seine till inom synhåll från Paris innan den vände norrut. Med Filips här i hälarna forcerade den vadstället Blanchetaque över tidvattenfloden Somme den 24 augusti. Två dagar senare ställde Edvard upp sin här på en sluttning nära Crécy-en-Ponthieu, med sina krigare till fots och sina bågskyttar på flyglarna.
Late on 26 August the French attacked before they were fully formed. Their Genoese crossbowmen were shot down by English and Welsh longbowmen, and charge after charge of mounted knights broke against the English line until nightfall. By one count more than 1,500 French knights and squires died, among them the blind King John of Bohemia. Edward went on to besiege Calais, which held out for eleven months; Philip came to relieve it but withdrew, and the starving town surrendered on 3 August 1347. Edward expelled most of its people and settled English in their place. A truce followed in September 1347, and the next year the Black Death reached France and England.: Sent den 26 augusti anföll fransmännen innan de var helt uppställda. Deras genuesiska armborstskyttar sköts ned av engelska och walesiska långbågsskyttar, och anfall efter anfall av beridna riddare bröts mot den engelska linjen tills natten föll. Enligt en beräkning dog mer än 1 500 franska riddare och väpnare, bland dem den blinde kung Johan av Böhmen. Edvard gick vidare och belägrade Calais, som höll ut i elva månader; Filip kom för att undsätta staden men drog sig tillbaka, och den svältande staden kapitulerade den 3 augusti 1347. Edvard fördrev de flesta av dess invånare och lät engelsmän bosätta sig i deras ställe. Ett stillestånd följde i september 1347, och året därpå nådde digerdöden Frankrike och England.
