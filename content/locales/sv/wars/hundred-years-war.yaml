The town held out until starved into surrender. Tradition has six leading burghers offering their lives to save the townspeople, spared at Queen Philippa’s plea; Calais stayed English until 1558.: Staden höll ut tills svälten tvingade den att ge upp. Enligt traditionen erbjöd sex ledande borgare sina liv för att rädda invånarna och skonades på drottning Filippas bön; Calais förblev engelskt till 1558.
