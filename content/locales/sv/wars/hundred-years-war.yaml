Henry V: Henrik V
French army: Franska hären
Henry returned in August 1417 to conquer Normandy, landing at Touques. Caen was stormed on 4 September and many of its people killed. Town after town surrendered over the next year, while the Armagnac government was paralysed; in May 1418 the Burgundians seized Paris and killed hundreds of Armagnacs, among them the Count of Armagnac himself. From July 1418 Henry besieged Rouen. The city expelled more than 12,000 of its poor to save food, and Henry would not let them through his lines; many starved in the ditch below the walls. Rouen surrendered on 19 January 1419, and by the end of the year almost all of Normandy was in English hands.: Henrik återvände i augusti 1417 för att erövra Normandie och landsteg vid Touques. Caen stormades den 4 september och många av invånarna dödades. Stad efter stad kapitulerade under det följande året, medan den armagnackiska regeringen var lamslagen; i maj 1418 tog burgunderna Paris och dödade hundratals armagnacer, bland dem greven av Armagnac själv. Från juli 1418 belägrade Henrik Rouen. Staden drev ut mer än 12 000 av sina fattiga för att spara mat, och Henrik vägrade släppa igenom dem genom sina linjer; många svalt ihjäl i vallgraven nedanför murarna. Rouen kapitulerade den 19 januari 1419, och vid årets slut var nästan hela Normandie i engelska händer.
The dauphin Charles and the Duke of Burgundy, John the Fearless, met on the bridge at Montereau on 10 September 1419 to make common cause, and the dauphin’s men killed the duke. His son Philip the Good allied with England. By the Treaty of Troyes, sealed on 21 May 1420, Charles VI recognised Henry as his heir and as regent of France, disinheriting the dauphin, and Henry married the king’s daughter Catherine on 2 June. Henry took Montereau and Melun and entered Paris with Charles VI on 1 December 1420.: Dauphinen Karl och hertigen av Burgund, Johan den orädde, möttes på bron i Montereau den 10 september 1419 för att göra gemensam sak, och dauphinens män dödade hertigen. Hans son Filip den gode förbund sig med England. Genom fördraget i Troyes, beseglat den 21 maj 1420, erkände Karl VI Henrik som sin arvinge och som regent över Frankrike och gjorde dauphinen arvlös, och Henrik gifte sig med kungens dotter Katarina den 2 juni. Henrik intog Montereau och Melun och tågade in i Paris tillsammans med Karl VI den 1 december 1420.
The dauphin still held France south of the Loire, and with Scottish help his army beat the English at Baugé on 22 March 1421, killing Henry’s brother Thomas, Duke of Clarence. Henry came back to take Meaux after a siege of seven months, but he fell ill with dysentery and died at Vincennes on 31 August 1422, aged 35. Charles VI died seven weeks later. Henry’s nine-month-old son was proclaimed Henry VI, king of England and France, and the dauphin took the title Charles VII.: Dauphinen höll fortfarande Frankrike söder om Loire, och med skotsk hjälp besegrade hans här engelsmännen vid Baugé den 22 mars 1421, där Henriks bror Thomas, hertig av Clarence, dödades. Henrik återvände och intog Meaux efter en sju månader lång belägring, men han insjuknade i dysenteri och dog i Vincennes den 31 augusti 1422, 35 år gammal. Karl VI dog sju veckor senare. Henriks nio månader gamle son utropades till Henrik VI, kung av England och Frankrike, och dauphinen antog titeln Karl VII.
