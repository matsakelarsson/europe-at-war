In Paris Étienne Marcel, provost of the merchants, led the Estates’ demands for reform, and on 22 February 1358 his followers murdered two of the dauphin’s marshals in front of him. The dauphin left the city. In late May the peasants of the Beauvaisis rose against the nobles, whom they blamed for the defeat and for the plundering of the countryside. Bands of rebels, the Jacques, burned manor houses and killed noble families. On 9–10 June the nobles struck back. Charles of Navarre routed the main rebel army near Mello, and knights relieved the fortified market of Meaux; thousands of peasants were killed in the reprisals. Marcel was killed in Paris on 31 July.: I Paris ledde Étienne Marcel, köpmännens prost, ständernas krav på reformer, och den 22 februari 1358 mördade hans anhängare två av dauphinens marskalkar inför hans ögon. Dauphinen lämnade staden. I slutet av maj reste sig bönderna i Beauvaisis mot adeln, som de gav skulden för nederlaget och för plundringen av landsbygden. Rebellskaror, jacques, brände herrgårdar och dödade adliga familjer. Den 9–10 juni slog adeln tillbaka. Karl av Navarra slog den främsta rebellhären på flykten nära Mello, och riddare undsatte den befästa marknadsplatsen i Meaux; tusentals bönder dödades i repressalierna. Marcel dödades i Paris den 31 juli.
In London King John agreed to treaties ceding half his kingdom, but the Estates-General rejected the second of them in May 1359. Edward landed at Calais in October with one of the largest armies of the war and besieged Reims, where he probably meant to be crowned, from December to January. The city held. He moved into Burgundy, whose duke paid him to leave, and then towards Paris, but the dauphin would not fight. On 13 April 1360, near Chartres, a violent hailstorm killed many men and horses in the English army, a day remembered as Black Monday.: I London gick kung Johan med på fördrag som avträdde halva hans rike, men generalständerna förkastade det andra av dem i maj 1359. Edvard landsteg i Calais i oktober med en av krigets största härar och belägrade från december till januari Reims, där han troligen tänkte låta kröna sig. Staden höll stånd. Han drog in i Burgund, vars hertig betalade honom för att ge sig av, och sedan mot Paris, men dauphinen vägrade att ta strid. Den 13 april 1360, nära Chartres, dödade ett våldsamt hagelväder många män och hästar i den engelska hären, en dag som minns som svarta måndagen.
At Brétigny near Chartres a treaty was drawn up on 8 May 1360 and ratified at Calais on 24 October. Edward was to give up his claim to the French throne, and John to give up sovereignty over an enlarged Aquitaine, which Edward would hold outright, with Calais, Guînes and Ponthieu. John’s ransom was set at three million gold écus. The two renunciations were put in a separate agreement that was never carried out, which left both kings grounds to reopen the war. John went home, but when a son left as a hostage broke his parole, he returned to captivity in London and died there in 1364.: I Brétigny nära Chartres upprättades ett fördrag den 8 maj 1360, som ratificerades i Calais den 24 oktober. Edvard skulle avstå från sitt anspråk på den franska tronen och Johan från överhögheten över ett utvidgat Aquitanien, som Edvard skulle inneha med full suveränitet, tillsammans med Calais, Guînes och Ponthieu. Johans lösesumma fastställdes till tre miljoner guldécus. De båda avståendena fördes in i en separat överenskommelse som aldrig verkställdes, vilket gav båda kungarna skäl att återuppta kriget. Johan återvände hem, men när en son som lämnats som gisslan bröt sitt hedersord återvände han till fångenskapen i London och dog där 1364.
