The terms were drawn up in a hamlet near Chartres, not far from where Black Monday’s storm had struck the English army.: Villkoren upprättades i en liten by nära Chartres, inte långt från den plats där svarta måndagens oväder hade drabbat den engelska hären.
24 October 1360: 24 oktober 1360
The two kings ratified the treaty at Calais, and John was released on payment of the first part of his ransom.: De två kungarna ratificerade fördraget i Calais, och Johan släpptes mot betalning av den första delen av sin lösesumma.
To Chartres: Mot Chartres
Ceded to Edward III in full sovereignty, 1360: Avträtt till Edvard III med full suveränitet 1360
Charles V, king from 1364, chose to rebuild his kingdom rather than risk great battles. His captain Bertrand du Guesclin, a minor Breton noble, beat the Navarrese at Cocherel in May 1364, but in September an Anglo-Breton victory at Auray, where Charles of Blois was killed, ended the Breton war in favour of John of Montfort. To rid France of the free companies, Du Guesclin led many of them into Castile in 1366 to put Henry of Trastámara on the throne in place of his half-brother Peter. The Black Prince restored Peter by winning at Nájera on 3 April 1367, but Henry won the kingdom in 1369, and Castile became France’s ally.: Karl V, kung från 1364, valde att återuppbygga sitt rike i stället för att riskera stora fältslag. Hans befälhavare Bertrand du Guesclin, en lågadlig bretonare, besegrade navarreserna vid Cocherel i maj 1364, men i september avgjorde en engelsk-bretonsk seger vid Auray, där Karl av Blois dödades, det bretonska kriget till Johan av Montforts fördel. För att befria Frankrike från de fria kompanierna ledde Du Guesclin 1366 många av dem in i Kastilien för att sätta Henrik av Trastámara på tronen i stället för hans halvbror Peter. Den svarte prinsen återinsatte Peter genom segern vid Nájera den 3 april 1367, men Henrik vann riket 1369, och Kastilien blev Frankrikes bundsförvant.
The Nájera campaign left the prince ill and in debt, and a hearth tax he raised in Aquitaine led great Gascon lords to appeal to the king in Paris. Charles accepted the appeals as their overlord, since the renunciations of 1360 had never been made, and in 1369 the war resumed. The French avoided battle, wore down English garrisons and took towns by siege, bribery and persuasion. Du Guesclin, made Constable in 1370, destroyed part of Robert Knolles’s army at Pontvallain that December. The Black Prince retook Limoges, which had gone over to the French, and sacked it; Froissart’s figure of 3,000 dead is now thought much too high.: Nájerafälttåget lämnade prinsen sjuk och skuldsatt, och en härdskatt som han tog ut i Aquitanien fick mäktiga gaskognska herrar att vädja till kungen i Paris. Karl godtog vädjandena i egenskap av deras länsherre, eftersom avståendena från 1360 aldrig hade fullföljts, och 1369 återupptogs kriget. Fransmännen undvek fältslag, nötte ned de engelska garnisonerna och intog städer genom belägring, mutor och övertalning. Du Guesclin, som utnämndes till konnetabel 1370, förintade i december samma år en del av Robert Knolles här vid Pontvallain. Den svarte prinsen återtog Limoges, som hade gått över till fransmännen, och plundrade staden; Froissarts siffra på 3 000 döda anses nu alltför hög.
In June 1372 a Castilian galley fleet destroyed an English fleet off La Rochelle, and Poitou and Saintonge fell to the French within months. John of Gaunt marched from Calais to Bordeaux in 1373 without bringing the French to battle, losing many men and most of his horses. A truce was agreed at Bruges in 1375; the Black Prince died in 1376 and Edward III in 1377. When Du Guesclin died at the siege of Châteauneuf-de-Randon in July 1380, and Charles V that September, England held little more than Calais, Bordeaux and Bayonne with a strip of the Gascon coast, and Brest and Cherbourg.: I juni 1372 förintade en kastiliansk galärflotta en engelsk flotta utanför La Rochelle, och Poitou och Saintonge föll i fransmännens händer inom några månader. Johan av Gent tågade 1373 från Calais till Bordeaux utan att lyckas tvinga fransmännen till strid och förlorade många män och de flesta av sina hästar. Ett stillestånd slöts i Brygge 1375; den svarte prinsen dog 1376 och Edvard III 1377. När Du Guesclin dog under belägringen av Châteauneuf-de-Randon i juli 1380, och Karl V i september samma år, behöll England inte mycket mer än Calais, Bordeaux och Bayonne med en remsa av den gaskognska kusten, samt Brest och Cherbourg.
