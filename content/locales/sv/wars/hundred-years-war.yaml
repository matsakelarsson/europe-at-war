Philip the Good: Filip den gode
Charles VII took Pontoise in 1441. In 1444 a truce was agreed at Tours, and Henry VI married the French queen’s niece, Margaret of Anjou; Henry secretly promised to give up Maine, and Le Mans was handed over, under threat of a siege, in March 1448. Charles used the truce to reform his army, with standing companies of cavalry paid from permanent taxes, archers raised by the parishes and a powerful artillery train under the brothers Jean and Gaspard Bureau.: Karl VII intog Pontoise 1441. År 1444 slöts ett stillestånd i Tours, och Henrik VI gifte sig med den franska drottningens brorsdotter Margareta av Anjou; Henrik lovade i hemlighet att avstå Maine, och Le Mans överlämnades under hot om belägring i mars 1448. Karl utnyttjade stilleståndet till att reformera sin armé, med stående kavallerikompanier som betalades med permanenta skatter, bågskyttar som uppbådades av socknarna och ett kraftfullt artilleri under bröderna Jean och Gaspard Bureau.
In March 1449 a captain in English pay, the Aragonese François de Surienne, sacked the Breton town of Fougères, and that summer Charles reopened the war. Town after town in Normandy surrendered, some to the guns, some to their own citizens. Rouen fell in October, and the Duke of Somerset bought his own freedom by giving up other towns and hostages, among them John Talbot. A relief army under Thomas Kyriell landed at Cherbourg in March 1450, and on 15 April it was caught at Formigny between the Count of Clermont’s army and Richemont’s Breton cavalry; most of the English were killed or captured. Caen surrendered on 1 July and Cherbourg, the last English stronghold in Normandy, on 12 August.: I mars 1449 plundrade en befälhavare i engelsk sold, aragoniern François de Surienne, den bretonska staden Fougères, och samma sommar återupptog Karl kriget. Stad efter stad i Normandie kapitulerade, en del för kanonerna, en del för sina egna invånare. Rouen föll i oktober, och hertigen av Somerset köpte sig fri genom att avstå andra städer och gisslan, bland dem John Talbot. En undsättningshär under Thomas Kyriell landsteg i Cherbourg i mars 1450, och den 15 april blev den fast vid Formigny mellan greven av Clermonts här och Richemonts bretonska kavalleri; de flesta av engelsmännen dödades eller tillfångatogs. Caen kapitulerade den 1 juli och Cherbourg, det sista engelska fästet i Normandie, den 12 augusti.
