Castilian galleys under Ambrosio Boccanegra destroyed the Earl of Pembroke’s fleet, which carried money and men for Aquitaine. Pembroke was captured.: Kastilianska galärer under Ambrosio Boccanegra förintade earlen av Pembrokes flotta, som förde pengar och manskap till Aquitanien. Pembroke tillfångatogs.
