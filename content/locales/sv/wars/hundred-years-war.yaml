The first great European peace congress, with envoys of the pope and the Council of Basel. It ended the Anglo-Burgundian alliance.: Den första stora europeiska fredskongressen, med sändebud från påven och konciliet i Basel. Den gjorde slut på det engelsk-burgundiska förbundet.
