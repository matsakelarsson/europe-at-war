When Charles IV of France died in 1328 without a son, the French nobles chose his cousin Philip of Valois as king, passing over Edward III of England, whose claim came through his mother Isabella, Charles’s sister. Edward, who was also Duke of Aquitaine, did homage to Philip VI for Gascony. But quarrels over the duchy, French help for the Scots and Edward’s shelter of Philip’s enemy Robert of Artois led Philip to confiscate Gascony on 24 May 1337. Edward bought allies in the Low Countries and the Empire, and French and Genoese galleys raided the English coast, burning much of Southampton in October 1338.: När Karl IV av Frankrike dog 1328 utan söner valde de franska stormännen hans kusin Filip av Valois till kung och förbigick Edvard III av England, vars anspråk gick genom hans mor Isabella, Karls syster. Edvard, som också var hertig av Aquitanien, avlade länsed till Filip VI för Gascogne. Men tvister om hertigdömet, franskt stöd till skottarna och Edvards beskydd av Filips fiende Robert av Artois fick Filip att konfiskera Gascogne den 24 maj 1337. Edvard köpte sig allierade i Nederländerna och tysk-romerska riket, och franska och genuesiska galärer härjade den engelska kusten och brände stora delar av Southampton i oktober 1338.
Flanders depended on English wool, but its count was loyal to France. In 1338 the cloth towns, led by Jacob van Artevelde of Ghent, took control of the county and came to terms with Edward. At Ghent on 26 January 1340 Edward took the title King of France, so that the Flemish could support him without breaking their oath to the French crown. On 24 June he attacked the French fleet gathered in the Zwin estuary at Sluys. Its ships, chained together in three lines, were taken one by one; most were captured, both French commanders died, and some 16,000–20,000 men were killed or drowned.: Flandern var beroende av engelsk ull, men dess greve var lojal mot Frankrike. År 1338 tog klädesstäderna, ledda av Jacob van Artevelde från Gent, kontrollen över grevskapet och kom överens med Edvard. I Gent den 26 januari 1340 antog Edvard titeln kung av Frankrike, så att flamländarna kunde stödja honom utan att bryta sin ed till den franska kronan. Den 24 juni anföll han den franska flottan som samlats i Zwins mynning vid Sluys. Dess fartyg, som var kedjade samman i tre linjer, togs ett efter ett; de flesta erövrades, båda de franska befälhavarna dog, och omkring 16 000–20 000 man dödades eller drunknade.
That summer Edward and his allies besieged Tournai, while a Flemish army under Robert of Artois was routed outside Saint-Omer. Tournai held out, Edward ran out of money, and on 25 September 1340 the two kings agreed the Truce of Esplechin. Sluys gave England command of the Channel, but the war had settled nothing.: Samma sommar belägrade Edvard och hans allierade Tournai, medan en flamländsk här under Robert av Artois slogs på flykten utanför Saint-Omer. Tournai höll stånd, Edvard fick slut på pengar, och den 25 september 1340 enades de två kungarna om stilleståndet i Esplechin. Sluys gav England herraväldet över Engelska kanalen, men kriget hade inte avgjort något.
