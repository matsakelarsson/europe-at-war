October 1449: oktober 1449
The citizens rose and let in the French; Somerset, holed up in the castle, capitulated in early November.: Invånarna reste sig och släppte in fransmännen; Somerset, som förskansat sig i borgen, kapitulerade i början av november.
15 April 1450: 15 april 1450
Two French culverins fired on the English from beyond bowshot and drew the archers out of their position; then Richemont’s cavalry came up on their flank.: Två franska kulveriner besköt engelsmännen från utom räckhåll för bågarna och lockade ut bågskyttarna ur deras ställning; sedan kom Richemonts kavalleri upp på deras flank.
