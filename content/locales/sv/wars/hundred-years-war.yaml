For a generation the war went on mostly in truces. One agreed at Leulinghem in 1389 was extended in 1396, when Richard II married the French king’s daughter Isabella. Richard was deposed in 1399 by his cousin Henry of Lancaster, while in France Charles VI suffered bouts of madness from 1392 and his kinsmen fought to control the government. After the Duke of Burgundy’s men murdered the king’s brother, Louis of Orléans, in 1407, the Burgundian and Armagnac factions slid into civil war, and both sought English help. Henry V, king from 1413, revived the claim to the French throne and demanded the Brétigny lands and Normandy.: Under en generation fortsatte kriget mest i form av stillestånd. Ett som slöts i Leulinghem 1389 förlängdes 1396, då Rikard II gifte sig med den franske kungens dotter Isabella. Rikard avsattes 1399 av sin kusin Henrik av Lancaster, medan Karl VI i Frankrike drabbades av anfall av vansinne från 1392 och hans släktingar kämpade om kontrollen över regeringen. Sedan hertigen av Burgunds män 1407 hade mördat kungens bror Ludvig av Orléans gled burgundiska och armagnackiska fraktionerna in i inbördeskrig, och båda sökte engelsk hjälp. Henrik V, kung från 1413, återupplivade anspråket på den franska tronen och krävde Brétignyområdena och Normandie.
On 13 August 1415 Henry landed near Harfleur, at the mouth of the Seine, with about 12,000 men. The town held out until 22 September, and dysentery killed or disabled many of his men. Henry left a garrison and set out with perhaps 6,000–9,000 men to march to Calais. Finding the fords of the Somme guarded, he had to go far upstream before crossing on 19 October, and on 24 October a much larger French army, led by the Constable Charles d’Albret and the great lords of the Armagnac party, blocked his road near Azincourt.: Den 13 augusti 1415 landsteg Henrik nära Harfleur, vid Seines mynning, med omkring 12 000 man. Staden höll ut till den 22 september, och dysenteri dödade eller satte många av hans män ur stridbart skick. Henrik lämnade kvar en garnison och gav sig av med kanske 6 000–9 000 man för att marschera till Calais. När han fann vadställena över Somme bevakade måste han gå långt uppströms innan han kom över den 19 oktober, och den 24 oktober spärrade en betydligt större fransk här, ledd av konnetabeln Charles d’Albret och armagnackpartiets stora herrar, hans väg nära Azincourt.
On 25 October, St Crispin’s Day, the French men-at-arms advanced on foot across a narrow, freshly ploughed and rain-soaked field between two woods. Shot at by archers from both flanks, they crowded together and were cut down or crushed in the mud when they reached the English line. Fearing a renewed attack, Henry ordered many of the prisoners to be killed. Several thousand French died, among them the Constable and the dukes of Alençon, Bar and Brabant, and Charles of Orléans was taken prisoner. The English lost a few hundred at most, among them the Duke of York.: Den 25 oktober, Sankt Crispinus dag, ryckte de franska krigarna fram till fots över ett smalt, nyplöjt och regnindränkt fält mellan två skogar. Beskjutna av bågskyttar från båda flankerna trängdes de samman och höggs ned eller trampades ned i leran när de nådde den engelska linjen. Av fruktan för ett nytt anfall beordrade Henrik att många av fångarna skulle dödas. Flera tusen fransmän dog, bland dem konnetabeln och hertigarna av Alençon, Bar och Brabant, och Karl av Orléans togs till fånga. Engelsmännen förlorade högst några hundra man, bland dem hertigen av York.
