Henry’s brother John, Duke of Bedford, governed Lancastrian France as regent for the infant Henry VI, in alliance with Burgundy. Charles VII, mocked as the “king of Bourges”, held the lands south of the Loire, and Scotland sent him thousands of soldiers. The allies won at Cravant in 1423, and on 17 August 1424 at Verneuil Bedford destroyed a Franco-Scottish army in one of the bloodiest battles of the war; some 6,000 French and Scots were killed, among them the earls of Douglas and Buchan. The English went on to conquer Maine.: Henriks bror Johan, hertig av Bedford, styrde det lancasterska Frankrike som regent för den späde Henrik VI, i förbund med Burgund. Karl VII, hånfullt kallad ”kungen av Bourges”, höll områdena söder om Loire, och Skottland sände honom tusentals soldater. De allierade segrade vid Cravant 1423, och den 17 augusti 1424 vid Verneuil förintade Bedford en fransk-skotsk här i ett av krigets blodigaste slag; omkring 6 000 fransmän och skottar dödades, bland dem earlerna av Douglas och Buchan. Engelsmännen gick vidare och erövrade Maine.
In October 1428 the English laid siege to Orléans, which guarded the crossings of the Loire. The Earl of Salisbury was killed by a cannon shot early in the siege, and in February 1429 John Fastolf beat off an attack on a supply convoy at Rouvray, the Battle of the Herrings. In March a peasant girl from Domrémy, Joan of Arc, who said that the voices of saints had sent her to drive out the English and have the dauphin crowned, won over Charles at Chinon. She entered Orléans with a relief convoy on 29 April, the French took the English forts one by one, and on 8 May the English abandoned the siege.: I oktober 1428 belägrade engelsmännen Orléans, som bevakade övergångarna över Loire. Earlen av Salisbury dödades av ett kanonskott tidigt under belägringen, och i februari 1429 slog John Fastolf tillbaka ett anfall mot en förrådskonvoj vid Rouvray, sillslaget. I mars vann en bondflicka från Domrémy, Jeanne d’Arc, som sade att helgonens röster hade sänt henne för att driva ut engelsmännen och låta kröna dauphinen, Karls förtroende i Chinon. Hon tågade in i Orléans med en undsättningskonvoj den 29 april, fransmännen intog de engelska skansarna en efter en, och den 8 maj övergav engelsmännen belägringen.
In June the French took Jargeau, Meung and Beaugency, and on 18 June they caught the English army in the open at Patay before its archers could set their stakes; John Talbot was among those captured. Charles then marched through enemy-held Champagne, where Troyes and Châlons opened their gates, and on 17 July 1429 he was crowned in Reims Cathedral, with Joan beside him. An attack on Paris that September failed.: I juni intog fransmännen Jargeau, Meung och Beaugency, och den 18 juni överraskade de den engelska hären på öppet fält vid Patay innan dess bågskyttar hann sätta ut sina pålar; John Talbot var bland dem som tillfångatogs. Karl tågade sedan genom det fiendehållna Champagne, där Troyes och Châlons öppnade sina portar, och den 17 juli 1429 kröntes han i katedralen i Reims, med Jeanne vid sin sida. Ett anfall mot Paris i september samma år misslyckades.
