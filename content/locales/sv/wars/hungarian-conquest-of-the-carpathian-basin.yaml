To the Carpathian Basin: Till Karpaterbäckenet
Arnulf, crowned emperor in 896, put the Slav prince Braslav in charge of Pannonia, west of the Danube, while Great Moravia was torn by a war between the sons of Svatopluk I. The Magyars served Arnulf again, and in 899 they invaded Italy, apparently at his urging, and routed King Berengar on the Brenta. Arnulf died in December 899. Coming back from Italy in 900, the Magyars took Pannonia, the old Frankish march around Braslav’s fortress at Mosaburg (Zalavár), and raided Bavaria. On 20 November Margrave Luitpold beat one of their bands on the Danube, and the Bavarians built a fortress on the Enns.: Arnulf, som kröntes till kejsare 896, satte den slaviske fursten Braslav att styra Pannonien, väster om Donau, medan Stormähren slets sönder av ett krig mellan Svatopluk I:s söner. Magyarerna tjänade Arnulf på nytt, och 899 invaderade de Italien, uppenbarligen på hans uppmaning, och slog kung Berengar på flykten vid Brenta. Arnulf dog i december 899. På återvägen från Italien år 900 tog magyarerna Pannonien, den gamla frankiska marken kring Braslavs fästning Mosaburg (Zalavár), och härjade i Bayern. Den 20 november besegrade markgreve Luitpold ett av deras band vid Donau, och bayrarna byggde en fästning vid Enns.
Moravia, already plundered, made peace with East Francia at Regensburg in 901, but it was too late. Under 902 a German chronicle records a war with the Hungarians in Moravia in which “the land succumbed”, and the last Moravian ruler, Mojmír II, is not heard of after about 906. Its strongholds were destroyed and many of its people fled to Bulgaria, Croatia and elsewhere. The Bavarians murdered Kurszán at a banquet in 902 or 904, and the Magyars, now masters of the Carpathian Basin, turned to raiding the West.: Mähren, som redan hade plundrats, slöt fred med Östfrankiska riket i Regensburg 901, men det var för sent. Under år 902 omtalar en tysk krönika ett krig mot ungrarna i Mähren där ”landet gick under”, och den siste mähriske härskaren, Mojmír II, omnämns inte efter omkring 906. Rikets fästen förstördes och många av dess invånare flydde till Bulgarien, Kroatien och andra platser. Bayrarna mördade Kurszán vid en bankett 902 eller 904, och magyarerna, som nu var herrar över Karpaterbäckenet, övergick till att härja i väst.
