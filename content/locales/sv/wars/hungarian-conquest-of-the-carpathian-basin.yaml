Hungarian conquest of the Carpathian Basin: Ungrarnas erövring av Karpaterbäckenet
The migration of the Magyars (Hungarians) from the steppes north of the Black Sea into the Carpathian Basin. Driven out of their homeland by the Bulgarians and the Pechenegs after a war in Bulgaria in 895, they crossed the Carpathians, took Pannonia from the East Franks in 900 and destroyed Great Moravia in the early 900s, founding the Hungarian state. In Hungarian it is called the honfoglalás, the “taking of the homeland”.: Magyarernas (ungrarnas) vandring från stäpperna norr om Svarta havet in i Karpaterbäckenet. Sedan de drivits ut ur sitt hemland av bulgarerna och petjenegerna efter ett krig i Bulgarien 895 gick de över Karpaterna, tog Pannonien från östfrankerna år 900 och krossade Stormähren i början av 900-talet, varvid de grundade den ungerska staten. På ungerska kallas händelsen honfoglalás, ”landtagandet”.
