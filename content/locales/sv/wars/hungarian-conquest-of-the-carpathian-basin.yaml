"In the late 9th century the Magyars, a federation of seven tribes of horsemen joined by the Kabars, lived in Etelköz, the steppe between the Dnieper and the lower Danube. They already raided far to the west: in 892 they fought for the East Frankish king Arnulf against Great Moravia, and in 894 they plundered Pannonia as allies of the Moravians. That year the Byzantine emperor Leo VI hired them against Simeon of Bulgaria. In 895 Byzantine ships carried them across the Danube; they routed Simeon, who took refuge in Dristra, plundered Bulgaria and sold their captives to the Byzantines.": "I slutet av 800-talet levde magyarerna, ett förbund av sju ryttarstammar som kabarerna anslutit sig till, i Etelköz, stäppen mellan Dnepr och nedre Donau. De härjade redan långt västerut: 892 stred de för den östfrankiske kungen Arnulf mot Stormähren, och 894 plundrade de Pannonien som mährernas bundsförvanter. Samma år lejde den bysantinske kejsaren Leo VI dem mot Symeon av Bulgarien. År 895 fördes de över Donau av bysantinska fartyg; de slog Symeon på flykten, som tog sin tillflykt till Dristra, plundrade Bulgarien och sålde sina fångar till bysantinerna."
Simeon took his revenge. While the Magyar warriors were away, the Pechenegs, his allies, fell on their camps in Etelköz and killed or drove off their families, and the Bulgarians defeated the Magyars on the Southern Buh. The survivors crossed the Carpathians in search of new pastures, perhaps through the north-eastern passes such as Verecke, as the Gesta says, or into Transylvania, as the Illuminated Chronicle has it, where the chronicle says their leader Álmos was killed. They settled first along the upper Tisza, in a thinly peopled land on the edges of Bulgaria, Moravia and the Frankish march.: Symeon tog sin hämnd. Medan magyarernas krigare var borta föll hans bundsförvanter petjenegerna över deras läger i Etelköz och dödade eller drev bort deras familjer, och bulgarerna besegrade magyarerna vid Södra Bug. De överlevande gick över Karpaterna på jakt efter nya betesmarker, kanske genom de nordöstra passen som Verecke, som Gesta uppger, eller in i Transsylvanien, som den illuminerade krönikan har det, där deras ledare Álmos enligt krönikan dödades. De slog sig först ned längs övre Tisza, i ett glest befolkat land i utkanterna av Bulgarien, Mähren och den frankiska marken.
