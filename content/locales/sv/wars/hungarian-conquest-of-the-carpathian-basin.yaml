c. 895–896: omkring 895–896
Pannonia and the end of Great Moravia: Pannonien och Stormährens undergång
The near-contemporary sources are foreign, chiefly the Annals of Fulda, Regino of Prüm and the Byzantine emperor Constantine VII; the Hungarian chronicles, the Gesta Hungarorum of about 1200 and the 14th-century Illuminated Chronicle, are much later and partly legendary. Hungary traditionally dates the conquest to 895–896 and celebrated its millennium in 1896.: De närmast samtida källorna är utländska, främst Fuldaannalerna, Regino av Prüm och den bysantinske kejsaren Konstantin VII; de ungerska krönikorna, Gesta Hungarorum från omkring 1200 och den illuminerade krönikan från 1300-talet, är betydligt senare och delvis legendariska. I Ungern dateras erövringen traditionellt till 895–896, och landet firade sitt millennium 1896.
The Magyars were then led by two rulers, the kende and the gyula; Árpád and Kurszán held these offices around 895, but which was which is disputed. Their route over the mountains is also disputed. The Magyars’ western raids and the battle of Pressburg in 907 are told in the Hungarian invasions of Europe, and their part in the Byzantine–Bulgarian war of 894–896 in that war’s own entry.: Magyarerna leddes då av två härskare, kende och gyula; Árpád och Kurszán innehade dessa ämbeten omkring 895, men vem som innehade vilket är omstritt. Även deras väg över bergen är omstridd. Magyarernas räder västerut och slaget vid Pressburg 907 berättas under ungrarnas härjningståg i Europa, och deras roll i det bysantinsk-bulgariska kriget 894–896 i det krigets egen artikel.
