Czechoslovakia declared independence on 28 October 1918 and claimed the Slovak-inhabited north of the Kingdom of Hungary. Small Czechoslovak units crossed into Upper Hungary in early November, and Hungarian troops drove some of them back, but the Allies backed the Czechoslovak claim and drew a demarcation line. In December Czechoslovak forces, among them legionaries returned from Italy, took Žilina, Nitra, Banská Bystrica and, at the end of the month, Košice. On 1 January 1919 they entered Bratislava, whose largely German and Hungarian population had hoped to make it a free city.: Tjeckoslovakien förklarade sig självständigt den 28 oktober 1918 och gjorde anspråk på den slovakiskbefolkade norra delen av Kungariket Ungern. Små tjeckoslovakiska förband gick in i Övre Ungern i början av november, och ungerska trupper drev tillbaka en del av dem, men de allierade stödde det tjeckoslovakiska anspråket och drog upp en demarkationslinje. I december intog tjeckoslovakiska styrkor, bland dem legionärer som återvänt från Italien, Žilina, Nitra, Banská Bystrica och i slutet av månaden Košice. Den 1 januari 1919 ryckte de in i Bratislava, vars till stor del tyska och ungerska befolkning hade hoppats att göra staden till en fristad.
After the Hungarian Soviet Republic was proclaimed in March, its enemies moved together. In late April, as the Romanian army advanced to the Tisza, Czechoslovak troops occupied Subcarpathian Ruthenia with the Romanians and pushed south over the demarcation line into northern Hungary, entering Miskolc on 2 May. The two armies threatened to meet and cut off the young Soviet Republic from the north-east. Instead, Budapest’s government signed a truce with Romania and turned its new Red Army against Czechoslovakia.: Sedan Ungerska rådsrepubliken utropats i mars gick dess fiender samman. I slutet av april, när den rumänska armén ryckte fram till Tisza, ockuperade tjeckoslovakiska trupper Karpatoukraina tillsammans med rumänerna och trängde söderut över demarkationslinjen in i norra Ungern, där de ryckte in i Miskolc den 2 maj. De två arméerna hotade att mötas och skära av den unga rådsrepubliken från nordost. I stället slöt regeringen i Budapest stillestånd med Rumänien och vände sin nya röda armé mot Tjeckoslovakien.
