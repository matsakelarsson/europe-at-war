Known in Hungary as the war for Upper Hungary, and the 1919 offensive as the Northern Campaign (északi hadjárat). Places are named in their present-day forms; Bratislava was Pozsony (Pressburg), Košice was Kassa and Prešov was Eperjes.: I Ungern kallas kriget kriget om Övre Ungern, och offensiven 1919 det nordliga fälttåget (északi hadjárat). Orterna anges med sina nuvarande namn; Bratislava hette Pozsony (Pressburg), Košice hette Kassa och Prešov hette Eperjes.
The base map shows Slovakia as part of Czechoslovakia from 28 October 1918; land the two armies held beyond the demarcation lines is shown as approximate areas.: Baskartan visar Slovakien som en del av Tjeckoslovakien från den 28 oktober 1918; områden som de två arméerna höll bortom demarkationslinjerna visas som ungefärliga områden.
