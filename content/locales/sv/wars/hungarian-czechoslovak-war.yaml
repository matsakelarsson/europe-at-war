Hungarian–Czechoslovak War: Ungersk-tjeckoslovakiska kriget
A war over Upper Hungary, today’s Slovakia, after the break-up of Austria-Hungary. Czechoslovak troops took over Slovakia in the winter of 1918–1919 and pushed into northern Hungary in May 1919, until the Hungarian Soviet Republic’s Northern Campaign drove them back deep into Slovakia; under Allied pressure the Hungarians withdrew in early July, and the Treaty of Trianon confirmed Czechoslovakia’s southern border.: Ett krig om Övre Ungern, dagens Slovakien, efter Österrike-Ungerns upplösning. Tjeckoslovakiska trupper tog kontrollen över Slovakien vintern 1918–1919 och trängde in i norra Ungern i maj 1919, tills Ungerska rådsrepublikens nordliga fälttåg drev dem tillbaka djupt in i Slovakien. Under tryck från de allierade drog sig ungrarna tillbaka i början av juli, och Trianonfreden bekräftade Tjeckoslovakiens södra gräns.
