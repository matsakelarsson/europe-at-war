The Hungarian Red Army, with Colonel Aurél Stromfeld as its chief of staff, attacked in force on 20 May. It retook Miskolc and the industrial towns of the north, then advanced deep into Slovakia, taking Košice on 6 June and pushing on to Prešov and Bardejov, and drove a wedge between the Czechoslovak and Romanian armies. Many former officers of the old army fought for the Soviet Republic in the hope of restoring Hungary’s borders. On 16 June a Slovak Soviet Republic was proclaimed in Prešov, dependent on Budapest.: Ungerska röda armén, med överste Aurél Stromfeld som stabschef, gick till anfall med stor styrka den 20 maj. Den återtog Miskolc och industristäderna i norr, ryckte sedan fram djupt in i Slovakien, intog Košice den 6 juni och trängde vidare till Prešov och Bardejov, och drev in en kil mellan den tjeckoslovakiska och den rumänska armén. Många tidigare officerare i den gamla armén stred för rådsrepubliken i hopp om att återställa Ungerns gränser. Den 16 juni utropades en slovakisk rådsrepublik i Prešov, beroende av Budapest.
The Allies stepped in. In notes of 7 and 13 June, Georges Clemenceau ordered the Hungarians to leave Slovakia and promised that the Romanians would then pull back from the Tisza. Kun accepted, Stromfeld resigned in protest, and by the first days of July the Hungarian Red Army had withdrawn behind the demarcation line. The Slovak Soviet Republic collapsed on 7 July, and the Romanians stayed where they were. The Treaty of Trianon in June 1920 confirmed a border that left about a million Hungarians in Czechoslovakia.: De allierade ingrep. I noter den 7 och 13 juni beordrade Georges Clemenceau ungrarna att lämna Slovakien och lovade att rumänerna då skulle dra sig tillbaka från Tisza. Kun gick med på detta, Stromfeld avgick i protest, och under de första dagarna i juli hade Ungerska röda armén dragit sig tillbaka bakom demarkationslinjen. Slovakiska rådsrepubliken föll samman den 7 juli, och rumänerna stannade där de var. Trianonfreden i juni 1920 bekräftade en gräns som lämnade omkring en miljon ungrare i Tjeckoslovakien.
