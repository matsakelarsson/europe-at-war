Werla: Werla
Henry sheltered in this royal fortress north of the Harz. The capture of a Hungarian leader nearby gave him the means to bargain for a truce.: Henrik sökte skydd i denna kungliga borg norr om Harz. Tillfångatagandet av en ungersk ledare i närheten gav honom möjlighet att förhandla om ett stillestånd.
St. Gallen: Sankt Gallen
May 926: maj 926
The monks had fled with their books and treasures. A party of raiders found the recluse Wiborada, who had refused to leave her cell nearby, and killed her.: Munkarna hade flytt med sina böcker och skatter. En grupp plundrare fann eremitissan Wiborada, som hade vägrat att lämna sin cell i närheten, och dödade henne.
Synod of Erfurt: Synoden i Erfurt
Bishops and nobles backed Henry’s decision to stop paying tribute, which meant war.: Biskopar och stormän stödde Henriks beslut att upphöra med tributen, vilket innebar krig.
15 March 933: 15 mars 933
The site is unknown. Widukind of Corvey names Riade as Henry’s camp, and several villages on the Unstrut claim the battle.: Platsen är okänd. Widukind av Corvey anger Riade som Henriks läger, och flera byar vid Unstrut gör anspråk på slaget.
The last great raids exploited a German civil war. In 954, during the revolt of Otto I’s son Liudolf and son-in-law Conrad the Red against him, a Hungarian army crossed Bavaria and Franconia. Conrad received it at Worms and sent it on into Lorraine against his enemies, and it went on to plunder what is now Belgium and northern France before going home through Burgundy and Italy. The rebels were blamed for inviting it, and the revolt collapsed. In the summer of 955 the Magyars, perhaps 8,000–10,000 strong, invaded Bavaria again and besieged Augsburg, which its bishop, Ulrich, held.: De sista stora räderna utnyttjade ett tyskt inbördeskrig. År 954, under det uppror som Otto I:s son Liudolf och svärson Konrad den röde gjorde mot honom, drog en ungersk här genom Bayern och Franken. Konrad tog emot den i Worms och sände den vidare in i Lothringen mot sina fiender, och den fortsatte med att plundra det som nu är Belgien och norra Frankrike innan den drog hem genom Burgund och Italien. Rebellerna anklagades för att ha bjudit in den, och upproret föll samman. Sommaren 955 invaderade magyarerna, kanske 8 000–10 000 man starka, Bayern på nytt och belägrade Augsburg, som hölls av stadens biskop Ulrik.
Otto came south with a small Saxon force, gathered Bavarians, Swabians, Franconians and a Bohemian contingent, and moved to relieve the city. On 10 August, on the Lechfeld plain by the river Lech, the Magyars routed his rearguard, but Conrad, now reconciled with Otto, drove them off, and Otto’s armoured horsemen broke the main Hungarian army. Conrad was killed by an arrow. Many fleeing Magyars were cut down over the next days, and their leaders were hanged at Regensburg. The raids to the west were over; Otto was crowned emperor in Rome in 962, and Hungary became a Christian kingdom under Stephen I around 1000.: Otto kom söderut med en liten sachsisk styrka, samlade bayrare, schwabare, franker och en böhmisk kontingent och ryckte fram för att undsätta staden. Den 10 augusti, på Lechfeldslätten vid floden Lech, slog magyarerna hans eftertrupp på flykten, men Konrad, som nu hade försonats med Otto, drev bort dem, och Ottos pansrade ryttare krossade den ungerska huvudhären. Konrad dödades av en pil. Många flyende magyarer höggs ned under de följande dagarna, och deras ledare hängdes i Regensburg. Räderna västerut var över; Otto kröntes till kejsare i Rom 962, och Ungern blev ett kristet kungarike under Stefan I omkring år 1000.
