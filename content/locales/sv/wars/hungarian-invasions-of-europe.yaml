The retreating Magyars offered to give back their plunder. When Berengar refused, they attacked his resting army and routed it, then ranged across the Po plain.: De retirerande magyarerna erbjöd sig att lämna tillbaka sitt byte. När Berengar vägrade anföll de hans vilande här och slog den på flykten, och drog sedan fram över Poslätten.
