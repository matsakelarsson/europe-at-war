Hungarian invasions of Europe: Ungrarnas härjningståg i Europa
The raids of the Magyars (Hungarians), who settled in the Danube basin in the 890s and for over half a century raided Germany, Italy, Burgundy and France almost every year. After destroying a Bavarian army at Pressburg in 907 they were held off in Saxony by Henry I at Riade in 933, and Otto I’s victory on the Lechfeld in 955 ended their raids to the west.: Magyarernas (ungrarnas) räder. De slog sig ned i Donaubäckenet på 890-talet och härjade i över ett halvsekel nästan varje år i Tyskland, Italien, Burgund och Frankrike. Sedan de förintat en bayersk här vid Pressburg 907 hölls de tillbaka i Sachsen av Henrik I vid Riade 933, och Otto I:s seger på Lechfeld 955 satte stopp för deras räder västerut.
