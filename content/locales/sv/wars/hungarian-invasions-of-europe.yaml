The sources are almost all written by the Magyars’ victims, above all Liutprand of Cremona, Widukind of Corvey and the annals of Bavarian and Swabian monasteries; numbers and many places are uncertain. Hungarian accounts were written down only centuries later.: Källorna är nästan alla skrivna av magyarernas offer, framför allt Liutprand av Cremona, Widukind av Corvey och annalerna från bayerska och schwabiska kloster; siffror och många platser är osäkra. Ungerska berättelser skrevs ned först århundraden senare.
East Francia, the eastern kingdom of the Franks, is the medieval German kingdom; its kings were crowned emperors from 962. The Magyars also raided the Byzantine Empire, until 970; those raids are not told here.: Östfrankiska riket, frankernas östra kungarike, är det medeltida tyska kungariket; dess kungar kröntes till kejsare från 962. Magyarerna härjade också i Bysantinska riket fram till 970; dessa räder berättas inte här.
