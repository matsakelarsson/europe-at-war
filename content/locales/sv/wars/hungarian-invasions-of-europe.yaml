In 924 a Magyar army rode into Saxony. King Henry I, the Saxon duke who had been elected king of East Francia in 919, took refuge in the fortress of Werla, but his men captured a Hungarian leader, and in 926 Henry bought a nine-year truce with his release and a yearly tribute. The truce protected Henry’s Saxony, not the south. That spring the raiders crossed Swabia, plundered the abbey of St. Gallen and rode on into Alsace and France.: År 924 red en magyarisk här in i Sachsen. Kung Henrik I, den sachsiske hertig som 919 hade valts till kung av Östfrankiska riket, tog sin tillflykt till fästningen Werla, men hans män tillfångatog en ungersk ledare, och 926 köpte Henrik ett nioårigt stillestånd mot hans frigivning och en årlig tribut. Stilleståndet skyddade Henriks Sachsen, inte södern. Samma vår drog plundrarna genom Schwaben, plundrade klostret Sankt Gallen och red vidare in i Elsass och Frankrike.
Henry used the truce to build and garrison strongholds and to train a force of armoured horsemen, which he tried out against the Slavs east of the Elbe. In 932, backed by a church synod at Erfurt, he stopped the tribute. The Magyars invaded the next year, and on 15 March 933 Henry’s army routed them at a place called Riade, somewhere near the Unstrut. Most of the Magyars fled before the horsemen could close with them. Raids on Saxony became rare, but the Magyars went on raiding elsewhere, reaching Reims in 937 and Catalonia in 942.: Henrik utnyttjade stilleståndet till att bygga och bemanna fästen och till att öva upp en styrka av pansrade ryttare, som han prövade mot slaverna öster om Elbe. År 932 upphörde han, med stöd av en kyrkosynod i Erfurt, att betala tributen. Magyarerna invaderade året därpå, och den 15 mars 933 slog Henriks här dem på flykten vid en plats kallad Riade, någonstans nära Unstrut. De flesta magyarerna flydde innan ryttarna hann i kontakt med dem. Räderna mot Sachsen blev sällsynta, men magyarerna fortsatte att härja på andra håll och nådde Reims 937 och Katalonien 942.
