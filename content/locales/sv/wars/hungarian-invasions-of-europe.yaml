A Thuringian army was beaten; Duke Burchard of Thuringia and Bishop Rudolf of Würzburg were killed.: En thüringsk här besegrades; hertig Burkhard av Thüringen och biskop Rudolf av Würzburg dödades.
First battle of the Lechfeld: Första slaget på Lechfeld
The Magyars drew the army of Louis the Child, then sixteen, into a trap near Augsburg and destroyed it.: Magyarerna lockade den då sextonårige Ludvig barnets här i en fälla nära Augsburg och förintade den.
