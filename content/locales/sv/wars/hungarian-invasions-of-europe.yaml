The Magyars were a federation of tribes of mounted archers from the steppes north of the Black Sea. In the 890s, pushed west by the Pechenegs and the Bulgarians, they crossed the Carpathians and took over the plains of the Danube basin. In 899 they rode into Italy and on 24 September routed the army of King Berengar I on the river Brenta. In 900 they took Pannonia from Bavaria, and by about 906 they had broken up Great Moravia, the Slav state to their north.: Magyarerna var ett förbund av stammar av beridna bågskyttar från stäpperna norr om Svarta havet. På 890-talet, när de trängdes västerut av petjenegerna och bulgarerna, gick de över Karpaterna och tog över slätterna i Donaubäckenet. År 899 red de in i Italien och slog den 24 september kung Berengar I:s här på flykten vid floden Brenta. År 900 tog de Pannonien från Bayern, och omkring 906 hade de krossat Stormähren, den slaviska staten norr om dem.
In 907 Margrave Luitpold of Bavaria led a large army down the Danube to drive them out. Near a place called Brezalauspurc, traditionally identified with Pressburg (Bratislava), it was destroyed in fighting that began on 4 July; Luitpold, Archbishop Theotmar of Salzburg and the bishops of Freising and Säben were among the dead. Bavaria lost everything east of the Enns. The Magyars beat the Thuringians near Eisenach in 908 and the army of the young King Louis the Child near Augsburg in 910, and for decades they raided almost at will.: År 907 ledde markgreve Luitpold av Bayern en stor här nedför Donau för att driva ut dem. Nära en plats kallad Brezalauspurc, som traditionellt identifieras med Pressburg (Bratislava), förintades hären i strider som började den 4 juli; Luitpold, ärkebiskop Theotmar av Salzburg och biskoparna av Freising och Säben var bland de döda. Bayern förlorade allt öster om Enns. Magyarerna besegrade thüringarna nära Eisenach 908 och den unge kung Ludvig barnets här nära Augsburg 910, och i årtionden härjade de nästan som de ville.
