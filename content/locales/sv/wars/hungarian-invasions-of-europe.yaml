4 July 907: 4 juli 907
The site is uncertain; some historians place Brezalauspurc near Lake Balaton instead. Few of the Bavarians escaped, and the Magyars followed up with raids deep into Bavaria.: Platsen är osäker; en del historiker placerar i stället Brezalauspurc nära Balatonsjön. Få av bayrarna kom undan, och magyarerna följde upp med räder djupt in i Bayern.
