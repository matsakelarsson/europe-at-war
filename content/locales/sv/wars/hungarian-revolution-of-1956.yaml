Encouraged by the reforms in Poland that month, students in Budapest drew up sixteen demands, among them free elections, the withdrawal of Soviet troops and the return of Imre Nagy, a reform communist expelled from power in 1955. On 23 October a march in support of Poland grew into a crowd of some 200,000 outside parliament. Demonstrators pulled down the huge statue of Stalin, and outside the radio building, where students had gone to broadcast their demands, the state security police (ÁVH) opened fire. By the morning the city was in armed revolt, and Soviet tanks rolled in at the request of the party leadership.: Uppmuntrade av reformerna i Polen samma månad formulerade studenter i Budapest sexton krav, bland dem fria val, de sovjetiska truppernas tillbakadragande och Imre Nagys återkomst, en reformkommunist som hade avsatts från makten 1955. Den 23 oktober växte ett demonstrationståg till stöd för Polen till en folkmassa på omkring 200 000 utanför parlamentet. Demonstranterna drog ned den enorma Stalinstatyn, och utanför radiohuset, dit studenter hade gått för att sända sina krav, öppnade statssäkerhetspolisen (ÁVH) eld. På morgonen var staden i väpnat uppror, och sovjetiska stridsvagnar rullade in på partiledningens begäran.
Nagy was made prime minister, but the fighting spread. Young workers and students with rifles and petrol bombs held out in the narrow streets around the Corvin Passage and Széna Square. On 25 October shooting into a crowd in front of parliament killed dozens, perhaps more than a hundred, and the next day state security men fired on a crowd at Mosonmagyaróvár. Revolutionary councils and workers’ councils took over towns and factories across the country. On 28 October Nagy announced a ceasefire, called the rising a national democratic movement and said Soviet troops would leave Budapest.: Nagy utsågs till premiärminister, men striderna spred sig. Unga arbetare och studenter med gevär och molotovcocktails höll stånd i de smala gatorna kring Corvinpassagen och Szénatorget. Den 25 oktober dödade skottlossning mot en folkmassa framför parlamentet flera dussin, kanske mer än hundra, och dagen därpå sköt statssäkerhetsmän mot en folkmassa i Mosonmagyaróvár. Revolutionära råd och arbetarråd tog över städer och fabriker i hela landet. Den 28 oktober tillkännagav Nagy eldupphör, kallade upproret en nationell demokratisk rörelse och sade att de sovjetiska trupperna skulle lämna Budapest.
