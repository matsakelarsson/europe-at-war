Soviet troops withdrew from Budapest on 30 October, and Nagy announced the end of one-party rule and brought non-communist politicians into his government. The state security police was dissolved, political prisoners such as Cardinal József Mindszenty were freed, and new parties and newspapers appeared. There was also revenge. On 30 October insurgents stormed the Budapest party headquarters on Republic Square and lynched several of its defenders. In Moscow, the Soviet leadership first issued a conciliatory declaration, then on 31 October decided to crush the revolution, at a moment when the West was divided by the Suez crisis.: De sovjetiska trupperna drog sig tillbaka från Budapest den 30 oktober, och Nagy tillkännagav slutet på enpartistyret och tog in icke-kommunistiska politiker i sin regering. Statssäkerhetspolisen upplöstes, politiska fångar som kardinal József Mindszenty släpptes, och nya partier och tidningar dök upp. Det förekom också hämnd. Den 30 oktober stormade upprorsmän partihögkvarteret i Budapest vid Republikens torg och lynchade flera av dess försvarare. I Moskva utfärdade den sovjetiska ledningen först en försonlig deklaration, men beslöt den 31 oktober att krossa revolutionen, i ett läge då västmakterna var splittrade av Suezkrisen.
New Soviet divisions crossed the border from Ukraine and Romania. On 1 November Nagy declared Hungary neutral, announced its withdrawal from the Warsaw Pact and appealed to the United Nations. János Kádár, a member of his government, slipped away to the Soviets, who prepared to install him at the head of a new government. On the night of 3–4 November the defence minister, Pál Maléter, who had gone to talks on the Soviet withdrawal at the Soviet base at Tököl, was arrested there by the KGB.: Nya sovjetiska divisioner gick över gränsen från Ukraina och Rumänien. Den 1 november förklarade Nagy Ungern neutralt, tillkännagav landets utträde ur Warszawapakten och vädjade till FN. János Kádár, medlem av hans regering, tog sig i hemlighet över till sovjeterna, som förberedde att sätta honom i spetsen för en ny regering. Natten mellan den 3 och 4 november greps försvarsministern Pál Maléter, som hade begett sig till förhandlingar om det sovjetiska tillbakadragandet vid den sovjetiska basen i Tököl, där av KGB.
