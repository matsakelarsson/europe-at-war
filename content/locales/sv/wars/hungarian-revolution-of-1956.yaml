At dawn on 4 November Soviet forces attacked Budapest and the other cities. Nagy broadcast a last appeal and took refuge in the Yugoslav embassy, and a radio station announced Kádár’s new government. Armed groups fought on for days at the Corvin Passage, in the industrial district of Csepel and in the new steel town of Sztálinváros, which both held out until 11 November, and in the Mecsek hills near Pécs, but they had no chance against tanks and artillery. Workers’ councils kept up a general strike into December.: I gryningen den 4 november anföll sovjetiska styrkor Budapest och de andra städerna. Nagy sände en sista vädjan i radio och tog sin tillflykt till den jugoslaviska ambassaden, och en radiostation tillkännagav Kádárs nya regering. Väpnade grupper fortsatte att strida i flera dagar vid Corvinpassagen, i industridistriktet Csepel och i den nya stålstaden Sztálinváros, som båda höll ut till den 11 november, och i Mecsekbergen nära Pécs, men de var chanslösa mot stridsvagnar och artilleri. Arbetarråden höll i gång en generalstrejk in i december.
About 2,500 Hungarians, most of them young workers, and some 700 Soviet soldiers were killed. Around 200,000 people fled, most of them across the Austrian border, many over the small bridge at Andau, until the border was closed again. Tens of thousands were arrested. Nagy left the embassy under a promise of safe conduct on 22 November and was seized by Soviet troops; after a secret trial he was hanged with Maléter and others in 1958, among some 230 people executed for their part in the revolution.: Omkring 2 500 ungrare, de flesta unga arbetare, och omkring 700 sovjetiska soldater dödades. Omkring 200 000 människor flydde, de flesta över den österrikiska gränsen, många över den lilla bron vid Andau, tills gränsen stängdes igen. Tiotusentals greps. Nagy lämnade ambassaden den 22 november efter ett löfte om fri lejd och greps av sovjetiska trupper; efter en hemlig rättegång hängdes han tillsammans med Maléter och andra 1958, bland omkring 230 personer som avrättades för sin roll i revolutionen.
