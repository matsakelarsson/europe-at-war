Hungarian Revolution of 1956: Ungernrevolten 1956
A nationwide revolt against Hungary’s communist government and Soviet domination, which began with a student demonstration in Budapest on 23 October 1956, brought the reform communist Imre Nagy to power and briefly ended one-party rule. On 4 November the Soviet army returned in force and crushed it within a week, installing János Kádár; about 2,500 Hungarians and 700 Soviet soldiers were killed, and some 200,000 people fled the country.: Ett landsomfattande uppror mot Ungerns kommunistiska regering och den sovjetiska dominansen. Det började med en studentdemonstration i Budapest den 23 oktober 1956, förde reformkommunisten Imre Nagy till makten och gjorde för en kort tid slut på enpartistyret. Den 4 november återvände den sovjetiska armén med full styrka och krossade upproret inom en vecka och insatte János Kádár. Omkring 2 500 ungrare och 700 sovjetiska soldater dödades, och omkring 200 000 människor flydde landet.
