Casualty figures vary; Hungarian research gives about 2,500–3,000 Hungarians killed, and Soviet figures about 720 Soviet soldiers killed.: Uppgifterna om förlusterna varierar; ungersk forskning anger omkring 2 500–3 000 dödade ungrare, och sovjetiska siffror omkring 720 dödade sovjetiska soldater.
Imre Nagy, Pál Maléter and others were tried in secret and hanged on 16 June 1958. Their reburial on 16 June 1989 helped bring about the end of communist rule, and 23 October is now a national holiday in Hungary.: Imre Nagy, Pál Maléter och andra ställdes inför rätta i hemlighet och hängdes den 16 juni 1958. Deras återbegravning den 16 juni 1989 bidrog till att få slut på det kommunistiska styret, och den 23 oktober är nu nationell helgdag i Ungern.
