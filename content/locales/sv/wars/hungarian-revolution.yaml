6 October 1849: 6 oktober 1849
Orsova: Orsova
August 1849: augusti 1849
Kossuth crossed into Ottoman territory nearby, and Szemere hid the Holy Crown and the regalia in the ground outside the town.: Kossuth gick över till osmanskt område i närheten, och Szemere gömde den heliga kronan och riksregalierna i jorden utanför staden.
Világos: Világos
13 August 1849: 13 augusti 1849
Görgei’s army laid down its arms before Rüdiger’s Russian corps on the fields of Szőlős, ending the war in the field.: Görgeis här lade ned vapnen inför Rüdigers ryska kår på Szőlős fält, vilket avslutade kriget i fält.
Arad: Arad
The thirteen martyrs of Arad, officers of the Hungarian army, were executed in the fortress on Haynau’s orders.: De tretton martyrerna i Arad, officerare i den ungerska armén, avrättades i fästningen på Haynaus order.
Klapka surrendered the fortress on terms that let its defenders go free, the last Hungarian force to give up.: Klapka överlämnade fästningen på villkor som lät dess försvarare gå fria, den sista ungerska styrka som gav upp.
Lajos Batthyány, Hungary’s first prime minister, was shot by firing squad.: Lajos Batthyány, Ungerns förste premiärminister, arkebuserades.
Kossuth into exile: Kossuth i exil
