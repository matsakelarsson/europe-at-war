News of the February revolution in Paris reached the Hungarian diet at Pozsony, where Lajos Kossuth called for a constitution on 3 March 1848. After the rising in Vienna on 13 March, young radicals in Pest, the poet Sándor Petőfi among them, met at the Pilvax café on 15 March, read out twelve demands and Petőfi’s National Song to growing crowds, printed them without the censor’s leave and freed the imprisoned writer Mihály Táncsics. The court gave way without bloodshed. On 17 March Count Lajos Batthyány was appointed prime minister of Hungary, and on 11 April King Ferdinand V signed the laws the diet had passed.: Nyheten om februarirevolutionen i Paris nådde den ungerska riksdagen i Pozsony, där Lajos Kossuth krävde en författning den 3 mars 1848. Efter upproret i Wien den 13 mars samlades unga radikaler i Pest, bland dem poeten Sándor Petőfi, på kaféet Pilvax den 15 mars, läste upp tolv krav och Petőfis Nationalsång för allt större folkmassor, tryckte dem utan censorns tillstånd och befriade den fängslade författaren Mihály Táncsics. Hovet gav efter utan blodsutgjutelse. Den 17 mars utnämndes greve Lajos Batthyány till Ungerns premiärminister, och den 11 april undertecknade kung Ferdinand V de lagar som riksdagen hade antagit.
The April Laws made Hungary a constitutional monarchy with a government answerable to an elected parliament in Pest, ended serfdom and the nobles’ freedom from tax, freed the press and united Transylvania with Hungary. But Hungarian stayed the only language of government in a kingdom where Magyars were fewer than half the people. Josip Jelačić, the new ban of Croatia, broke off relations with Pest. Serbs meeting at Karlóca in May proclaimed a Serbian Vojvodina and took up arms in June, and Romanians meeting at Balázsfalva claimed recognition as a nation and opposed the union with Transylvania, which its diet voted on 29 May. The court, recovering from its shock, began to back the nationalities against Pest.: Aprillagarna gjorde Ungern till en konstitutionell monarki med en regering som var ansvarig inför ett valt parlament i Pest, avskaffade livegenskapen och adelns skattefrihet, gav pressen frihet och förenade Transsylvanien med Ungern. Men ungerskan förblev det enda förvaltningsspråket i ett kungarike där magyarerna var färre än hälften av befolkningen. Josip Jelačić, Kroatiens nye ban, bröt förbindelserna med Pest. Serber som samlades i Karlóca i maj utropade ett serbiskt Vojvodina och grep till vapen i juni, och rumäner som samlades i Balázsfalva krävde erkännande som nation och motsatte sig unionen med Transsylvanien, som dess lantdag röstade för den 29 maj. Hovet, som hämtade sig från chocken, började stödja nationaliteterna mot Pest.
