Dates are New Style (Gregorian). Russian accounts use the Julian calendar, then 12 days behind.: Datum anges enligt nya stilen (gregorianska kalendern). Ryska berättelser använder den julianska kalendern, som då låg 12 dagar efter.
Places are given their Hungarian names of the time, as in most accounts. Pozsony is Bratislava; Kassa is Košice and Nagysalló Tekovské Lužany in Slovakia; Kolozsvár is Cluj, Nagyszeben Sibiu, Segesvár Sighișoara, Piski Simeria, Temesvár Timișoara and Világos Șiria in Romania; Karlóca is Sremski Karlovci and Szenttamás Srbobran in Serbia.: Orterna anges med sina dåtida ungerska namn, som i de flesta framställningar. Pozsony är Bratislava; Kassa är Košice och Nagysalló Tekovské Lužany i Slovakien; Kolozsvár är Cluj, Nagyszeben Sibiu, Segesvár Sighișoara, Piski Simeria, Temesvár Timișoara och Világos Șiria i Rumänien; Karlóca är Sremski Karlovci och Szenttamás Srbobran i Serbien.
The risings in Vienna are told in the German revolutions of 1848–1849, and the revolution in Wallachia in its own entry. The war in Hungary was also a civil war between the kingdom’s nationalities; numbers of civilians killed, especially in Transylvania and the south, are disputed.: Upproren i Wien berättas under de tyska revolutionerna 1848–1849, och revolutionen i Valakiet i en egen artikel. Kriget i Ungern var också ett inbördeskrig mellan kungarikets nationaliteter; antalet dödade civila, särskilt i Transsylvanien och i söder, är omstritt.
