Hungarian Revolution of 1848–1849: Ungerska revolutionen 1848–1849
A revolution in which Hungary won a constitutional government of its own in the spring of 1848 and then fought the Austrian Empire, Croatia and the Serb and Romanian insurgents of the kingdom, declaring independence in April 1849. Its armies drove the imperial forces almost out of the country, but a Russian army of some 200,000 men joined the Austrians that summer, and the Hungarians surrendered at Világos in August 1849, followed by harsh reprisals.: En revolution där Ungern våren 1848 fick en egen konstitutionell regering och sedan bekämpade Kejsardömet Österrike, Kroatien och kungarikets serbiska och rumänska upprorsmän, och i april 1849 förklarade sig självständigt. De ungerska arméerna drev nästan ut de kejserliga styrkorna ur landet, men samma sommar anslöt sig en rysk armé på omkring 200 000 man till österrikarna, och ungrarna kapitulerade vid Világos i augusti 1849, varpå hårda repressalier följde.
