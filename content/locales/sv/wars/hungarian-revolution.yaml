By late summer the court had turned against the Batthyány government, and on 11 September Jelačić crossed the Drava with an army of Croatian border regiments and volunteers. Batthyány resigned, and parliament gave power to a National Defence Committee led by Kossuth, which raised new honvéd battalions and printed its own money. On 28 September a crowd in Pest killed Count Franz Lamberg, sent by the king to take command of all troops in Hungary. The next day General János Móga’s army stopped Jelačić’s advance at Pákozd, near Lake Velence. The fight was small, but Jelačić asked for a three-day truce and slipped away towards Vienna, and on 7 October Artúr Görgei and Mór Perczel forced his rearguard of some 9,000 men to surrender at Ozora.: Mot slutet av sommaren hade hovet vänt sig mot Batthyánys regering, och den 11 september gick Jelačić över Drava med en här av kroatiska gränsregementen och frivilliga. Batthyány avgick, och parlamentet överlämnade makten till en nationell försvarskommitté under ledning av Kossuth, som satte upp nya honvédbataljoner och tryckte egna pengar. Den 28 september dödade en folkmassa i Pest greve Franz Lamberg, som kungen hade sänt för att ta befälet över alla trupper i Ungern. Dagen därpå hejdade general János Mógas här Jelačićs framryckning vid Pákozd, nära Velencesjön. Striden var liten, men Jelačić begärde ett tredagars stillestånd och smet i väg mot Wien, och den 7 oktober tvingade Artúr Görgei och Mór Perczel hans eftertrupp på omkring 9 000 man att kapitulera vid Ozora.
The order sending troops from Vienna against Hungary set off a rising there on 6 October. The Hungarian army crossed the border late and was beaten at Schwechat on 30 October by Jelačić and Prince Alfred Windischgrätz, who took Vienna the next day. On 2 December Ferdinand abdicated in favour of his 18-year-old nephew Francis Joseph, whom the Hungarian parliament refused to recognise as king. In Transylvania, Romanian insurgents and imperial troops took most of the country by November. Both sides killed civilians. Hungarian townspeople were massacred at Zalatna in October and at Nagyenyed in January, and Hungarian troops and courts burned Romanian villages and hanged peasants.: Ordern att sända trupper från Wien mot Ungern utlöste ett uppror där den 6 oktober. Den ungerska hären gick över gränsen för sent och besegrades vid Schwechat den 30 oktober av Jelačić och furst Alfred Windischgrätz, som intog Wien dagen därpå. Den 2 december abdikerade Ferdinand till förmån för sin 18-årige brorson Frans Josef, som det ungerska parlamentet vägrade erkänna som kung. I Transsylvanien tog rumänska upprorsmän och kejserliga trupper större delen av landet i november. Båda sidor dödade civila. Ungerska stadsbor massakrerades i Zalatna i oktober och i Nagyenyed i januari, och ungerska trupper och domstolar brände rumänska byar och hängde bönder.
