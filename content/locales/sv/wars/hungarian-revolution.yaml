Held by the Hungarian government, late May 1849 (approximate): Hållet av den ungerska regeringen i slutet av maj 1849 (ungefärligt)
On 21 May, in Warsaw, Francis Joseph thanked Tsar Nicholas I in person for his promise of help. In mid-June about 200,000 Russian troops under Field Marshal Ivan Paskevich crossed the Carpathians from Galicia, through the Dukla Pass and others, while a second Russian army under General Alexander von Lüders entered Transylvania from Wallachia. In the west the new Austrian commander, Julius Jacob von Haynau, took Győr on 28 June. Together the two empires had well over twice as many men as the Hungarians. Görgei held Haynau before Komárom on 2 July but failed to break through on 11 July, then marched east around the Russians, fighting them at Vác on 15–17 July and drawing them north before turning south towards Arad.: Den 21 maj tackade Frans Josef i Warszawa personligen tsar Nikolaj I för hans löfte om hjälp. I mitten av juni gick omkring 200 000 ryska soldater under fältmarskalk Ivan Paskevitj över Karpaterna från Galizien, genom Duklapasset och andra pass, medan en andra rysk armé under general Alexander von Lüders ryckte in i Transsylvanien från Valakiet. I väster intog den nye österrikiske befälhavaren Julius Jacob von Haynau Győr den 28 juni. Tillsammans hade de två kejsardömena långt mer än dubbelt så många man som ungrarna. Görgei höll Haynau stången framför Komárom den 2 juli men misslyckades med att bryta igenom den 11 juli, och marscherade sedan österut runt ryssarna, stred mot dem vid Vác den 15–17 juli och drog dem norrut innan han vände söderut mot Arad.
The government left Pest for Szeged, where on 28 July parliament passed laws allowing the nationalities to use their own languages in local government and schools and emancipating the Jews, too late to change the war. In Transylvania Lüders beat Bem at Segesvár on 31 July; the poet Petőfi was last seen alive on that battlefield. Haynau crossed the Tisza and beat Dembiński at Szőreg on 5 August, and on 9 August he routed the southern army, now under Bem, at Temesvár. Cholera swept through all the armies, and most of the Russian dead died of disease rather than in battle.: Regeringen lämnade Pest för Szeged, där parlamentet den 28 juli antog lagar som gav nationaliteterna rätt att använda sina egna språk i lokalförvaltning och skolor och emanciperade judarna, för sent för att ändra krigets utgång. I Transsylvanien besegrade Lüders Bem vid Segesvár den 31 juli; poeten Petőfi sågs sista gången vid liv på det slagfältet. Haynau gick över Tisza och besegrade Dembiński vid Szőreg den 5 augusti, och den 9 augusti slog han den södra hären, nu under Bem, på flykten vid Temesvár. Kolera härjade i alla arméerna, och de flesta av de ryska döda dog av sjukdom snarare än i strid.
Russian army: Ryska armén
about 200,000 under Paskevich: omkring 200 000 under Paskevitj
Battle of Segesvár: Slaget vid Segesvár
31 July 1849, Russian victory: 31 juli 1849, rysk seger
Battle of Temesvár: Slaget vid Temesvár
9 August 1849, Austrian victory: 9 augusti 1849, österrikisk seger
Dukla Pass: Duklapasset
June 1849: juni 1849
Paskevich’s main army crossed from Galicia into Hungary through this and neighbouring Carpathian passes.: Paskevitjs huvudarmé gick från Galizien in i Ungern genom detta och närliggande pass i Karpaterna.
Győr: Győr
28 June 1849: 28 juni 1849
Haynau’s offensive began by driving Poeltenberg’s corps out of the town, with Francis Joseph present.: Haynaus offensiv inleddes med att Poeltenbergs kår drevs ut ur staden, i Frans Josefs närvaro.
2 and 11 July 1849: 2 och 11 juli 1849
Görgei’s army fought Haynau to a standstill outside the fortress, but its attempt to break out south-east failed.: Görgeis här höll Haynau stången utanför fästningen, men dess försök att bryta ut åt sydost misslyckades.
15–17 July 1849: 15–17 juli 1849
Görgei fought his way past Paskevich’s army and slipped away north-east, drawing the Russians after him.: Görgei slog sig förbi Paskevitjs armé och smet i väg åt nordost och drog ryssarna efter sig.
Szeged: Szeged
28 July 1849: 28 juli 1849
The last sitting of the Hungarian parliament passed a law on the rights of the nationalities and the emancipation of the Jews.: Det ungerska parlamentets sista sammanträde antog en lag om nationaliteternas rättigheter och judarnas emancipation.
31 July 1849: 31 juli 1849
Lüders’s Russians defeated Bem near Fehéregyháza. Sándor Petőfi went missing in the rout and was probably killed.: Lüders ryssar besegrade Bem nära Fehéregyháza. Sándor Petőfi försvann under den kaotiska reträtten och dödades troligen.
Szőreg: Szőreg
5 August 1849: 5 augusti 1849
Haynau forced the crossing of the Tisza and defeated Dembiński’s army south-east of Szeged.: Haynau forcerade övergången av Tisza och besegrade Dembińskis här sydost om Szeged.
9 August 1849: 9 augusti 1849
Haynau routed the Hungarian southern army and relieved the imperial garrison, which had held the fortress against Hungarian sieges since the autumn of 1848.: Haynau slog den ungerska södra hären på flykten och undsatte den kejserliga garnisonen, som hade hållit fästningen mot ungerska belägringar sedan hösten 1848.
Paskevich: Paskevitj
Lüders: Lüders
Haynau: Haynau
On 11 August Kossuth handed full power to Görgei and fled with other leaders across the Ottoman border; his minister Bertalan Szemere buried the Holy Crown near Orsova, where it was found in 1853. On 13 August, at Világos near Arad, Görgei surrendered his army of about 30,000 men to the Russian general Count Theodor von Rüdiger, choosing to lay down arms before the Russians rather than the Austrians. The Russians handed the prisoners over to the Austrians. The remaining corps and fortresses gave up in the following weeks; Klapka held Komárom until 2 October and won free passage for its garrison.: Den 11 augusti överlämnade Kossuth all makt åt Görgei och flydde med andra ledare över den osmanska gränsen; hans minister Bertalan Szemere grävde ned den heliga kronan nära Orsova, där den hittades 1853. Den 13 augusti, vid Világos nära Arad, kapitulerade Görgei med sin här på omkring 30 000 man inför den ryske generalen greve Theodor von Rüdiger, eftersom han hellre lade ned vapnen inför ryssarna än inför österrikarna. Ryssarna överlämnade fångarna till österrikarna. De återstående kårerna och fästningarna gav upp under de följande veckorna; Klapka höll Komárom till den 2 oktober och utverkade fritt avtåg för garnisonen.
Haynau, given full powers, took harsh revenge. On 6 October, the anniversary of the Vienna rising, twelve generals and a colonel of the Hungarian army were executed at Arad, four by firing squad and nine on the gallows, and the same day Batthyány was shot in Pest. Over a hundred people were executed and many more imprisoned or forced into the imperial army. Görgei was spared at the tsar’s request and interned at Klagenfurt, and many Hungarians called him a traitor. Hungary was ruled as a conquered land until the Compromise of 1867, Kossuth died in exile, and 6 October is a day of mourning in Hungary.: Haynau, som fått oinskränkta befogenheter, tog en hård hämnd. Den 6 oktober, årsdagen av upproret i Wien, avrättades tolv generaler och en överste i den ungerska armén i Arad, fyra arkebuserades och nio hängdes, och samma dag arkebuserades Batthyány i Pest. Över hundra personer avrättades och många fler fängslades eller tvångsinkallades till den kejserliga armén. Görgei skonades på tsarens begäran och internerades i Klagenfurt, och många ungrare kallade honom förrädare. Ungern styrdes som ett erövrat land fram till utjämningen 1867, Kossuth dog i exil, och den 6 oktober är en sorgedag i Ungern.
