In March Bem drove the Austrians and Russians out of Transylvania, taking Nagyszeben on 11 March, and Perczel cleared much of the south of Serb and imperial troops. At the start of April the main army, now led in practice by Görgei, attacked east of Pest and won at Hatvan on 2 April, Tápióbicske on 4 April and Isaszeg on 6 April, where Windischgrätz himself was beaten. It then turned north, took Vác on 10 April, defeated General Ludwig von Wohlgemuth at Nagysalló on 19 April and on 26 April relieved the besieged fortress of Komárom. Windischgrätz was dismissed, and his successor withdrew almost all imperial troops from Hungary, leaving garrisons in Buda castle and a few fortresses.: I mars drev Bem ut österrikarna och ryssarna ur Transsylvanien och intog Nagyszeben den 11 mars, och Perczel rensade stora delar av södern från serbiska och kejserliga trupper. I början av april anföll huvudhären, nu i praktiken ledd av Görgei, öster om Pest och segrade vid Hatvan den 2 april, Tápióbicske den 4 april och Isaszeg den 6 april, där Windischgrätz själv besegrades. Den vände sedan norrut, intog Vác den 10 april, besegrade general Ludwig von Wohlgemuth vid Nagysalló den 19 april och undsatte den 26 april den belägrade fästningen Komárom. Windischgrätz avskedades, och hans efterträdare drog tillbaka nästan alla kejserliga trupper från Ungern och lämnade kvar garnisoner i Budas borg och några fästningar.
On 14 April, in the Great Church of Debrecen, parliament declared the House of Habsburg-Lorraine deposed and Hungary independent, and elected Kossuth governor-president. Görgei, who thought the declaration ruled out a compromise, turned back to besiege Buda rather than follow the enemy towards Vienna, a choice still argued over. The castle’s commander, General Heinrich Hentzi, shelled Pest across the river; Buda was stormed on 21 May after a siege of 17 days, and Hentzi was mortally wounded. It was the height of Hungarian success, but Francis Joseph had already asked the tsar for help.: Den 14 april, i Stora kyrkan i Debrecen, förklarade parlamentet huset Habsburg-Lothringen avsatt och Ungern självständigt och valde Kossuth till riksföreståndare. Görgei, som ansåg att förklaringen uteslöt en kompromiss, vände tillbaka för att belägra Buda i stället för att följa fienden mot Wien, ett val som fortfarande diskuteras. Borgens befälhavare, general Heinrich Hentzi, besköt Pest på andra sidan floden; Buda stormades den 21 maj efter en 17 dagar lång belägring, och Hentzi blev dödligt sårad. Det var höjdpunkten för de ungerska framgångarna, men Frans Josef hade redan bett tsaren om hjälp.
