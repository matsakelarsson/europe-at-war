In mid-December Windischgrätz invaded Hungary with the main imperial army, while other corps closed in from Galicia, Styria, Croatia and the Serbian south. Görgei fell back from the border, and Perczel was beaten at Mór on 30 December. Parliament and the National Defence Committee moved to Debrecen, beyond the Tisza, taking the Holy Crown with them, and on 5 January 1849 Windischgrätz entered Buda and Pest. Görgei led his corps north into the mountains of Upper Hungary, drawing imperial troops after him, forced the Branyiszkó Pass on 5 February and joined György Klapka’s troops at Kassa.: I mitten av december invaderade Windischgrätz Ungern med den kejserliga huvudhären, medan andra kårer ryckte fram från Galizien, Steiermark, Kroatien och den serbiska södern. Görgei drog sig tillbaka från gränsen, och Perczel besegrades vid Mór den 30 december. Parlamentet och den nationella försvarskommittén flyttade till Debrecen, bortom Tisza, och tog med sig den heliga kronan, och den 5 januari 1849 ryckte Windischgrätz in i Buda och Pest. Görgei ledde sin kår norrut in i Övre Ungerns berg och drog kejserliga trupper efter sig, forcerade Branyiszkópasset den 5 februari och förenade sig med György Klapkas trupper vid Kassa.
In Transylvania the Polish general Józef Bem took Kolozsvár at Christmas and, after beating the Austrian commander Anton Puchner at Piski on 9 February, held his own against imperial troops and a Russian detachment called in from Wallachia by the Saxon towns. Kossuth gave command of the main army to another Pole, Henryk Dembiński, whom Windischgrätz defeated at Kápolna on 26–27 February. Believing the war won, the court issued a new constitution, dated 4 March, which made Hungary one crown land among many in a centralised empire and separated Transylvania, Croatia and the Serbian Vojvodina from it. The war became one for independence.: I Transsylvanien intog den polske generalen Józef Bem Kolozsvár vid jul och höll, sedan han besegrat den österrikiske befälhavaren Anton Puchner vid Piski den 9 februari, stånd mot kejserliga trupper och en rysk avdelning som de sachsiska städerna kallat in från Valakiet. Kossuth gav befälet över huvudhären till en annan polack, Henryk Dembiński, som Windischgrätz besegrade vid Kápolna den 26–27 februari. I tron att kriget var vunnet utfärdade hovet en ny författning, daterad den 4 mars, som gjorde Ungern till ett kronland bland många i ett centraliserat kejsardöme och skilde Transsylvanien, Kroatien och Serbiska Vojvodina från det. Kriget blev ett självständighetskrig.
