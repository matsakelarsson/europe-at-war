Hungarian–Romanian War: Ungersk-rumänska kriget
A war fought as the Kingdom of Hungary broke up after the First World War. Romanian troops advanced through Transylvania to the Tisza in the spring of 1919, defeated the Hungarian Soviet Republic’s offensive in July and occupied Budapest in August, staying in Hungary until early 1920; the Treaty of Trianon then gave Romania Transylvania and the lands to its west.: Ett krig som utkämpades när Kungariket Ungern föll sönder efter första världskriget. Rumänska trupper ryckte våren 1919 fram genom Transsylvanien till Tisza, slog tillbaka Ungerska rådsrepublikens offensiv i juli och ockuperade Budapest i augusti, och de stannade i Ungern till början av 1920. Trianonfreden gav sedan Rumänien Transsylvanien och områdena väster därom.
