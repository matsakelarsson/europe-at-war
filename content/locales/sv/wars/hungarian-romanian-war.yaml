The base map follows the borders recognised at the time; land the Romanian army held beyond them is shown as approximate areas. Losses were small compared with the World War, about 3,670 Romanian soldiers killed and, by most estimates, between 2,000 and 6,000 Hungarians.: Baskartan följer de gränser som då var erkända; områden som den rumänska armén höll utanför dem visas som ungefärliga områden. Förlusterna var små jämfört med världskriget, omkring 3 670 dödade rumänska soldater och enligt de flesta uppskattningar mellan 2 000 och 6 000 ungrare.
