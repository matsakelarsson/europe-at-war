As Austria-Hungary collapsed, Romania re-entered the war on 10 November 1918, and its troops crossed into Transylvania three days later. On 1 December an assembly of Transylvanian Romanians at Alba Iulia declared union with Romania, and the Romanian army moved west to lines set by the Allies. Hungary’s new government under Mihály Károlyi had demobilised most of its army. When the Allied Vix note of 20 March 1919 demanded a further Hungarian withdrawal, Károlyi resigned, and on 21 March communists and social democrats proclaimed the Hungarian Soviet Republic, led in practice by Béla Kun.: När Österrike-Ungern föll samman gick Rumänien åter in i kriget den 10 november 1918, och dess trupper gick in i Transsylvanien tre dagar senare. Den 1 december förklarade en församling av transsylvanska rumäner i Alba Iulia union med Rumänien, och den rumänska armén ryckte västerut till linjer som fastställts av de allierade. Ungerns nya regering under Mihály Károlyi hade demobiliserat större delen av armén. När de allierades Vixnot den 20 mars 1919 krävde ett ytterligare ungerskt tillbakadragande avgick Károlyi, och den 21 mars utropade kommunister och socialdemokrater Ungerska rådsrepubliken, i praktiken ledd av Béla Kun.
Kun’s government promised to defend Hungary’s borders and hoped for help from Soviet Russia. On 16 April, before the new Hungarian Red Army was ready, the Romanian army attacked. It took Oradea on 20 April and Debrecen on 23 April, the Székely Division of Transylvanian Hungarians laid down its arms, and by 1 May the Romanians stood along the Tisza. With Czechoslovak troops advancing from the north at the same time, the Soviet Republic seemed close to collapse, but a mass mobilisation of Budapest’s workers saved it.: Kuns regering lovade att försvara Ungerns gränser och hoppades på hjälp från Sovjetryssland. Den 16 april, innan den nya ungerska röda armén var redo, gick den rumänska armén till anfall. Den intog Oradea den 20 april och Debrecen den 23 april, Székelydivisionen av transsylvanska ungrare lade ned vapnen, och den 1 maj stod rumänerna längs Tisza. Med tjeckoslovakiska trupper som samtidigt ryckte fram från norr tycktes rådsrepubliken nära sammanbrott, men en massmobilisering av Budapests arbetare räddade den.
