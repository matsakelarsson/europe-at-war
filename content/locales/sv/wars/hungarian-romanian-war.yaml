After withdrawing from Slovakia under Allied pressure, the Hungarian Red Army turned on the Romanians, whom the Allies had promised to pull back but who had not moved. On 20 July it crossed the Tisza at several points and pushed east for a few days, but the Romanians stopped it, counter-attacked and crossed the river on the night of 29–30 July. The Hungarian army fell apart. Kun’s government resigned on 1 August and its leaders fled to Austria, and on 3–4 August Romanian troops entered Budapest.: Sedan Ungerska röda armén dragit sig tillbaka från Slovakien under tryck från de allierade vände den sig mot rumänerna, som de allierade hade lovat skulle dra sig tillbaka men som inte hade rört sig. Den 20 juli gick den över Tisza på flera ställen och trängde österut i några dagar, men rumänerna hejdade den, gick till motanfall och gick över floden natten mellan den 29 och 30 juli. Den ungerska armén föll samman. Kuns regering avgick den 1 augusti och dess ledare flydde till Österrike, och den 3–4 augusti ryckte rumänska trupper in i Budapest.
The Romanian army occupied Budapest and most of Hungary as far as Győr. It took rolling stock, livestock, grain and factory equipment as reparations, in defiance of protests from the Allied Supreme Council in Paris. Short-lived governments followed in Budapest, while officers of the counter-revolutionary National Army carried out a White Terror against communists, Jews and others. The Romanians left Budapest on 14 November, Admiral Miklós Horthy rode in two days later, and the last Romanian troops left Hungary in March 1920, before the Treaty of Trianon fixed the new border.: Den rumänska armén ockuperade Budapest och större delen av Ungern ända till Győr. Den tog rullande materiel, boskap, spannmål och fabriksutrustning som krigsskadestånd, trots protester från de allierades högsta råd i Paris. Kortlivade regeringar avlöste varandra i Budapest, medan officerare i den kontrarevolutionära Nationella armén genomförde en vit terror mot kommunister, judar och andra. Rumänerna lämnade Budapest den 14 november, amiral Miklós Horthy red in två dagar senare, och de sista rumänska trupperna lämnade Ungern i mars 1920, innan Trianonfreden fastställde den nya gränsen.
