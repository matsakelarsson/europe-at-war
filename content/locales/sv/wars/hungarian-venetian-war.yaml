Hungarian–Venetian War of 1356–1358: Ungersk-venetianska kriget 1356–1358
The war in which Louis I of Hungary took Dalmatia from Venice. Left out of the Venetian–Genoese peace of 1355, Louis claimed the Dalmatian towns as king of Croatia and in 1356 invaded the Venetian mainland with the support of the Patriarch of Aquileia, the Count of Gorizia and Francesco da Carrara of Padua, besieging Treviso, while Croatian and Hungarian forces attacked the coast. Split, Trogir and Šibenik went over to him, and Zadar was taken at the end of 1357. In the Treaty of Zadar of 18 February 1358 Venice gave up Dalmatia from the Kvarner to Durazzo and dropped Dalmatia from the doge’s title, though it kept Istria and its supremacy at sea. Ragusa (Dubrovnik) accepted Hungarian overlordship later that year and became, in practice, an independent republic.: Kriget där Ludvig I av Ungern tog Dalmatien från Venedig. Ludvig, som hade lämnats utanför den venetiansk-genuesiska freden 1355, gjorde som kung av Kroatien anspråk på de dalmatiska städerna och invaderade 1356 Venedigs fastlandsområden med stöd av patriarken av Aquileia, greven av Gorizia och Francesco da Carrara av Padua och belägrade Treviso, medan kroatiska och ungerska styrkor angrep kusten. Split, Trogir och Šibenik gick över till honom, och Zadar intogs i slutet av 1357. Genom freden i Zadar den 18 februari 1358 avstod Venedig Dalmatien från Kvarner till Durazzo och strök Dalmatien ur dogens titel, men behöll Istrien och sin överhöghet till sjöss. Ragusa (Dubrovnik) erkände senare samma år ungersk överhöghet och blev i praktiken en självständig republik.
