Accounts differ on the southern limit of what Venice gave up, given as Durazzo or the Bay of Kotor. Louis I also fought Venice in alliance with Genoa in the War of Chioggia (1378–1381).: Uppgifterna skiljer sig åt om den södra gränsen för det Venedig avstod, som anges som Durazzo eller Kotorbukten. Ludvig I bekämpade också Venedig i förbund med Genua i Chioggiakriget (1378–1381).
