# Svenska översättningar av katalogtexten (våg 8); stegtexterna kommer senare.
Hussain Shah’s conquest of Kamata: Hussain Shahs erövring av Kamata
"The conquest of the Kamata kingdom, in today’s northern West Bengal, western Assam and northern Bangladesh, by Alauddin Hussain Shah, sultan of Bengal. Its last king, Nilambar of the Khen dynasty, had enlarged his realm from Cooch Behar to Kamrup. Helped by a minister of Nilambar who had gone over to him, Hussain invaded with an army said to number 24,000 infantry and cavalry and a war flotilla, defeated the allied local rulers, and sent his general Shah Ismail Ghazi against Nilambar’s capital, Kamatapur. After a long siege the city fell, was sacked and destroyed, and Nilambar was taken prisoner. Hussain annexed Kamata and Kamrup as far as Hajo, near Guwahati, and made his son Danyal governor, styling himself on his coins conqueror of Kamarupa and Kamata. Bengal’s rule did not last: Danyal and his officers were killed by local chiefs, the Baro-Bhuyans, and in the 1510s the Koch kingdom rose in Kamata’s place.": "Bengalens sultan Alauddin Hussain Shahs erövring av kungariket Kamata, i dagens norra Västbengalen, västra Assam och norra Bangladesh. Dess siste kung, Nilambar av khendynastin, hade utvidgat sitt rike från Cooch Behar till Kamrup. Med hjälp av en av Nilambars ministrar som hade gått över till honom föll Hussain in med en armé som sägs ha räknat 24 000 man fotfolk och kavalleri samt en krigsflottilj, besegrade de allierade lokala härskarna och sände sin general Shah Ismail Ghazi mot Nilambars huvudstad Kamatapur. Efter en lång belägring föll staden, plundrades och förstördes, och Nilambar togs till fånga. Hussain annekterade Kamata och Kamrup ända till Hajo nära Guwahati och gjorde sin son Danyal till guvernör, och på sina mynt kallade han sig erövrare av Kamarupa och Kamata. Bengalens välde varade inte: Danyal och hans officerare dödades av lokala hövdingar, baro-bhuyanerna, och på 1510-talet uppstod kochriket i Kamatas ställe."
