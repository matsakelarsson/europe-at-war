The Hussite envoys, among them Prokop, John of Rokycany and the Englishman Peter Payne, debated the Four Articles with the council’s theologians.: De hussitiska sändebuden, bland dem Prokop, Jan av Rokycany och engelsmannen Peter Payne, debatterade de fyra artiklarna med konciliets teologer.
Crusaders, 1431: Korsfarare 1431
Prokop: Prokop
The radicals, unwilling to compromise, had besieged Catholic Plzeň since July 1433 without success. In the spring of 1434 the Utraquist and Catholic lords formed a league, took the New Town of Prague from the radicals in May and forced Prokop to lift the siege. The Taborites and Orphans joined forces east of Prague. On 30 May 1434, near Lipany, the League’s army pretended to retreat and drew them out of their wagon fort; its hidden cavalry then broke in. Prokop the Great and Prokop the Lesser were killed, and hundreds of prisoners were burned to death in barns.: De radikala, som inte ville kompromissa, hade sedan juli 1433 utan framgång belägrat det katolska Plzeň. Våren 1434 bildade de utrakvistiska och katolska herrarna ett förbund, tog Prags Nystad från de radikala i maj och tvingade Prokop att häva belägringen. Taboriterna och de föräldralösa förenade sina styrkor öster om Prag. Den 30 maj 1434, nära Lipany, låtsades förbundets här retirera och lockade ut dem ur deras vagnborg; dess dolda kavalleri bröt sig sedan in. Prokop den store och Prokop den mindre dödades, och hundratals fångar brändes levande i lador.
Lipany broke the radicals, and the moderates came to terms with Sigismund and the Church. On 5 July 1436 at Jihlava the Compacts of Basel were proclaimed, allowing communion in both kinds in Bohemia and Moravia, and the estates accepted Sigismund as king. He entered Prague that August and died the next year. The wars had devastated Bohemia and many neighbouring lands, but the Hussites kept their church; the Utraquist church remained Bohemia’s largest until after the battle of the White Mountain in 1620.: Lipany krossade de radikala, och de moderata kom överens med Sigismund och kyrkan. Den 5 juli 1436 i Jihlava kungjordes Baselkompaktaterna, som tillät nattvard under båda gestalterna i Böhmen och Mähren, och ständerna godtog Sigismund som kung. Han tågade in i Prag i augusti samma år och dog året därpå. Krigen hade ödelagt Böhmen och många grannländer, men hussiterna behöll sin kyrka; den utrakvistiska kyrkan förblev Böhmens största fram till tiden efter slaget vid Vita berget 1620.
