Dates are Julian, as usual for the period. The chronicles give huge numbers for the armies, often tens of thousands; modern historians think they were much smaller.: Datum anges enligt den julianska kalendern, som är brukligt för perioden. Krönikorna anger enorma siffror för härarna, ofta tiotusentals man; moderna historiker anser att de var betydligt mindre.
The Hussites soon split into moderates (Utraquists or Calixtines, strongest in Prague and among the nobles) and radicals (the Taborites, the eastern Bohemian brotherhood known after Žižka’s death as the Orphans, and others). Historians number the crusades differently, and the Hussites fought each other as well as the crusaders.: Hussiterna splittrades snart i moderata (utrakvister eller kalixtiner, starkast i Prag och bland adeln) och radikala (taboriterna, det östböhmiska brödraskap som efter Žižkas död kallades de föräldralösa, och andra). Historikerna numrerar korstågen olika, och hussiterna stred mot varandra lika väl som mot korsfararna.
Places are named in Czech, with the German name where it is often used in English (Kutná Hora/Kuttenberg, Německý Brod/Deutschbrod, Ústí nad Labem/Aussig, Stříbro/Mies, Domažlice/Taus).: Orterna anges med tjeckiska namn, med det tyska namnet där detta ofta används på engelska (Kutná Hora/Kuttenberg, Německý Brod/Deutschbrod, Ústí nad Labem/Aussig, Stříbro/Mies, Domažlice/Taus).
