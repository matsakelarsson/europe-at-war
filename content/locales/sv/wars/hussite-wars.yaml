Battle of Kutná Hora: Slaget vid Kutná Hora
Trapped between the town and the royal army, Žižka broke through at night, using guns on the moving wagons as his main weapon.: Instängd mellan staden och den kungliga hären bröt Žižka igenom nattetid, med kanoner på de rörliga vagnarna som sitt främsta vapen.
10 January 1422: 10 januari 1422
The end of a pursuit from Nebovidy and Habry. The town was sacked and most of the royal army’s rearguard was killed or drowned.: Slutet på en förföljelse från Nebovidy och Habry. Staden plundrades, och större delen av den kungliga härens eftertrupp dödades eller drunknade.
Second crusade: Andra korståget
Without a common enemy in the field, the Hussites fell out. In Prague the radical preacher Želivský was arrested and beheaded in March 1422. Seeking a king of their own faith, the Hussites offered the crown to Władysław II Jagiełło of Poland and then to Grand Duke Vytautas of Lithuania, who sent his nephew Sigismund Korybut to govern. Žižka, now leading the radicals of Tábor and the eastern Bohemian brotherhood of Orebites, beat the Prague Utraquists and their noble allies at Hořice in 1423 and at Malešov on 7 June 1424. He died of illness on 11 October 1424 while besieging Přibyslav; his followers called themselves the Orphans.: Utan en gemensam fiende i fält blev hussiterna osams. I Prag greps den radikale predikanten Želivský och halshöggs i mars 1422. På jakt efter en kung av sin egen tro erbjöd hussiterna kronan till Władysław II Jagiełło av Polen och sedan till storfurst Vytautas av Litauen, som sände sin brorson Sigismund Korybut för att regera. Žižka, som nu ledde de radikala i Tábor och det östböhmiska brödraskapet orebiterna, besegrade utrakvisterna i Prag och deras adliga bundsförvanter vid Hořice 1423 och vid Malešov den 7 juni 1424. Han dog i sjukdom den 11 oktober 1424 under belägringen av Přibyslav; hans anhängare kallade sig de föräldralösa.
Prokop the Great, a married priest, became the leading commander of the radicals. In 1426 an army from Saxony and Meissen came to relieve Ústí nad Labem, an Elbe town that Sigismund had pledged to the Margrave of Meissen and which the Hussites were besieging. On 16 June it attacked the Hussite wagon fort on a hill near the town, broke through the chains between the wagons and was surrounded and cut down. The Hussites gave no quarter. The chronicles speak of tens of thousands; modern historians think the armies were much smaller, but the crusaders’ losses were heavy.: Prokop den store, en gift präst, blev de radikalas främste befälhavare. År 1426 kom en här från Sachsen och Meissen för att undsätta Ústí nad Labem, en stad vid Elbe som Sigismund hade pantsatt till markgreven av Meissen och som hussiterna belägrade. Den 16 juni anföll den hussiternas vagnborg på en kulle nära staden, bröt igenom kedjorna mellan vagnarna och omringades och höggs ned. Hussiterna gav ingen pardon. Krönikorna talar om tiotusentals; moderna historiker anser att härarna var betydligt mindre, men korsfararnas förluster var svåra.
