Jan Hus, the Prague preacher who had attacked the wealth and corruption of the Church, was burned as a heretic at the Council of Constance on 6 July 1415, although King Sigismund had given him a safe conduct. Hundreds of Bohemian and Moravian nobles protested, and his followers took up communion in both kinds, bread and wine; the chalice became their sign. On 30 July 1419 a Hussite crowd led by the priest Jan Želivský stormed Prague’s New Town Hall and threw the councillors from the windows. When King Wenceslaus IV died on 16 August, his heir was his brother Sigismund, king of Hungary and of the Romans.: Jan Hus, predikanten i Prag som hade angripit kyrkans rikedom och korruption, brändes som kättare vid konciliet i Konstanz den 6 juli 1415, trots att kung Sigismund hade gett honom fri lejd. Hundratals böhmiska och mähriska adelsmän protesterade, och hans anhängare började ta nattvarden under båda gestalterna, bröd och vin; kalken blev deras symbol. Den 30 juli 1419 stormade en hussitisk folkmassa ledd av prästen Jan Želivský Nystadens rådhus i Prag och kastade rådsherrarna ut genom fönstren. När kung Wenzel IV dog den 16 augusti var hans arvinge hans bror Sigismund, kung av Ungern och romersk kung.
On 17 March 1420 a papal bull calling a crusade against the Hussites was proclaimed at Breslau, and Sigismund led an army of Germans, Hungarians and others into Bohemia. Radicals gathered at the new hilltop town of Tábor, and their captain, the veteran soldier Jan Žižka, used wagons as a fort to beat royalist cavalry at Sudoměř. The crusaders besieged Prague, but on 14 July Žižka’s men on Vítkov hill threw back their attack and the army broke up. Sigismund had himself crowned in Prague Castle and withdrew; on 1 November the Hussites beat him again below Vyšehrad.: Den 17 mars 1420 kungjordes en påvlig bulla om korståg mot hussiterna i Breslau, och Sigismund ledde en här av tyskar, ungrare och andra in i Böhmen. De radikala samlades i den nya staden Tábor på en kulle, och deras befälhavare, den erfarne krigaren Jan Žižka, använde vagnar som en borg och besegrade det kungliga kavalleriet vid Sudoměř. Korsfararna belägrade Prag, men den 14 juli slog Žižkas män på Vítkovkullen tillbaka deras anfall, och hären upplöstes. Sigismund lät kröna sig på Pragborgen och drog sig tillbaka; den 1 november besegrade hussiterna honom igen nedanför Vyšehrad.
