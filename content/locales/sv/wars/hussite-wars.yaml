Hussite Wars: Hussitkrigen
The wars that followed the burning of the Czech reformer Jan Hus in 1415, in which his followers in Bohemia defended their faith against King Sigismund and five crusades from across the Empire. Using wagon forts and early firearms, Hussite armies under Jan Žižka and Prokop the Great beat every crusade and raided deep into neighbouring lands, until moderate Hussites and Catholics crushed the radicals at Lipany in 1434 and made peace with the Church and Sigismund in the Compacts of 1436.: Krigen som följde på att den tjeckiske reformatorn Jan Hus brändes på bål 1415, och där hans anhängare i Böhmen försvarade sin tro mot kung Sigismund och fem korståg från hela riket. Med vagnborgar och tidiga eldvapen besegrade hussitiska härar under Jan Žižka och Prokop den store varje korståg och gjorde räder djupt in i grannländerna, tills moderata hussiter och katoliker krossade de radikala vid Lipany 1434 och slöt fred med kyrkan och Sigismund genom kompaktaterna 1436.
