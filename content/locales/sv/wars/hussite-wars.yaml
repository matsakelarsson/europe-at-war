Talks between Sigismund and the Hussites came to nothing, and the pope called another crusade. On 1 August 1431 a large army under Frederick of Brandenburg, with the papal legate Cardinal Giuliano Cesarini, crossed into western Bohemia, and on 8 August it began to besiege Domažlice. When a Hussite relief army under Prokop came up on 14 August, the crusaders broke and fled back over the border forest before the battle had properly begun, by tradition at the sound of the Hussite hymn “Ye who are warriors of God”. Cesarini barely escaped, leaving behind his baggage and the papal bull.: Förhandlingarna mellan Sigismund och hussiterna ledde ingenstans, och påven utlyste ett nytt korståg. Den 1 augusti 1431 gick en stor här under Fredrik av Brandenburg, med påvens legat kardinal Giuliano Cesarini, in i västra Böhmen, och den 8 augusti började den belägra Domažlice. När en hussitisk undsättningshär under Prokop kom fram den 14 augusti bröt korsfararna samman och flydde tillbaka över gränsskogen innan slaget egentligen hade börjat, enligt traditionen vid ljudet av den hussitiska psalmen ”Ni som är Guds stridsmän”. Cesarini kom med nöd och näppe undan och lämnade efter sig sin packning och den påvliga bullan.
Cesarini drew his own conclusion. As president of the new Council of Basel he worked for talks, and in May 1432, at Cheb, the council’s envoys accepted the Hussite demand that the Bible and the practice of the early Church should judge between them. A Hussite embassy led by Prokop debated at Basel from January 1433; a council delegation then went to Prague, and in November it agreed terms with the Bohemian diet allowing communion in both kinds. The moderates accepted them; the radicals did not. That year Hussite troops also fought for Poland against the Teutonic Order and reached the Baltic.: Cesarini drog sin egen slutsats. Som ordförande för det nya konciliet i Basel verkade han för förhandlingar, och i maj 1432, i Cheb, godtog konciliets sändebud hussiternas krav på att Bibeln och den tidiga kyrkans praxis skulle döma mellan dem. En hussitisk beskickning ledd av Prokop debatterade i Basel från januari 1433; en delegation från konciliet reste sedan till Prag, och i november enades den med den böhmiska lantdagen om villkor som tillät nattvard under båda gestalterna. De moderata godtog dem; de radikala gjorde det inte. Samma år stred hussitiska trupper också för Polen mot Tyska orden och nådde Östersjön.
Battle of Domažlice: Slaget vid Domažlice
