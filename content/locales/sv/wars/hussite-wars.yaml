With a few hundred followers and a dozen wagons, Žižka held a dyke between two fishponds against royalist cavalry. It was the first pitched battle of the wars.: Med några hundra anhängare och ett dussin vagnar höll Žižka en fördämning mellan två fiskdammar mot kungligt kavalleri. Det var krigens första fältslag.
Tábor: Tábor
Radical Hussites founded a new town on a hill above the Lužnice and named it after the biblical Mount Tabor. It became their capital.: Radikala hussiter grundade en ny stad på en kulle ovanför Lužnice och uppkallade den efter det bibliska berget Tabor. Den blev deras huvudstad.
Kutná Hora: Kutná Hora
The rich silver-mining town, with many German townspeople, held for Sigismund and was his base.: Den rika silvergruvestaden, med många tyska borgare, höll fast vid Sigismund och var hans bas.
14 July 1420: 14 juli 1420
A small force on the hill, joined by men from Prague’s New Town, drove German and Austrian horsemen down the steep slopes. The hill is now called Žižkov.: En liten styrka på kullen, förstärkt med män från Prags Nystad, drev tyska och österrikiska ryttare nedför de branta sluttningarna. Kullen heter i dag Žižkov.
Sigismund: Sigismund
Žižka: Žižka
By the summer of 1421 the Hussites held most of Bohemia, and in June a diet at Čáslav refused to accept Sigismund as king and set up a provisional government. Žižka, already blind in one eye, lost the other at the siege of Rabí castle but went on commanding. A second crusade, from the Rhineland and Saxony, besieged Žatec in September and fled when a Hussite army approached. In December Sigismund invaded from Moravia with Hungarians and Germans. Žižka was camped outside Kutná Hora when its mainly German townspeople turned against the Hussites, and the royal army closed in.: Sommaren 1421 höll hussiterna större delen av Böhmen, och i juni vägrade en lantdag i Čáslav att godta Sigismund som kung och tillsatte en provisorisk regering. Žižka, som redan var blind på ena ögat, förlorade det andra vid belägringen av borgen Rabí men fortsatte att föra befälet. Ett andra korståg, från Rhenlandet och Sachsen, belägrade Žatec i september och flydde när en hussitisk här närmade sig. I december invaderade Sigismund från Mähren med ungrare och tyskar. Žižka låg i läger utanför Kutná Hora när dess huvudsakligen tyska borgare vände sig mot hussiterna, och den kungliga hären ryckte närmare.
On the night of 21–22 December Žižka broke out, his wagons rolling forward with guns firing, and withdrew to Kolín. Sigismund thought the Hussites beaten and sent his troops into winter quarters. Reinforced, Žižka struck back on 6 January 1422, routing the royal army at Nebovidy, and pursued it south. On 10 January he caught it at Německý Brod. Hundreds of fleeing soldiers drowned when the ice of the Sázava broke, and against Žižka’s orders his men stormed the town and killed many of its people.: Natten mellan den 21 och 22 december bröt Žižka ut, med sina vagnar rullande framåt under kanoneld, och drog sig tillbaka till Kolín. Sigismund trodde att hussiterna var besegrade och skickade sina trupper i vinterkvarter. Förstärkt slog Žižka tillbaka den 6 januari 1422, slog den kungliga hären på flykten vid Nebovidy och förföljde den söderut. Den 10 januari hann han upp den vid Německý Brod. Hundratals flyende soldater drunknade när isen på Sázava brast, och mot Žižkas order stormade hans män staden och dödade många av dess invånare.
