Žižka died in the camp during the siege of the castle. Plague used to be blamed, but historians now think a carbuncle more likely.: Žižka dog i lägret under belägringen av borgen. Tidigare fick pesten skulden, men historiker anser nu att en karbunkel är troligare.
16 June 1426: 16 juni 1426
The Saxon relief army, led by Boso of Vitzthum, broke into the wagon fort, but Hussite horsemen took it from behind and it was destroyed.: Den sachsiska undsättningshären, ledd av Boso av Vitzthum, bröt sig in i vagnborgen, men hussitiska ryttare angrep den bakifrån och den förintades.
Saxon army: Sachsiska armén
Prokop and Korybut: Prokop och Korybut
In 1427 a new crusade under the papal legate Cardinal Henry Beaufort and the Elector Frederick of Brandenburg crossed into western Bohemia and besieged Stříbro. When a Hussite army under Prokop approached, the crusaders panicked and fled; on 4 August Beaufort tried and failed to rally them at Tachov. Later that year the Hussites imprisoned Korybut, suspected of plotting with Sigismund. No crusade came again for four years.: År 1427 gick ett nytt korståg under påvens legat kardinal Henry Beaufort och kurfursten Fredrik av Brandenburg in i västra Böhmen och belägrade Stříbro. När en hussitisk här under Prokop närmade sig greps korsfararna av panik och flydde; den 4 augusti försökte Beaufort förgäves samla dem vid Tachov. Senare samma år fängslade hussiterna Korybut, som misstänktes för att konspirera med Sigismund. Inget nytt korståg kom på fyra år.
The Hussites now carried the war abroad, in campaigns they called the beautiful or glorious rides. From 1428 Prokop and other captains led armies into Silesia and Lusatia, Austria, Upper Hungary and Saxony, burning towns and monasteries, taking ransoms and loot and punishing the lands that had sent men to the crusades; they made no attempt at lasting conquest. The greatest ride, in the winter of 1429–30, went through Saxony into Franconia, sacking Plauen and burning Hof and Bayreuth. At Kulmbach on 6 February 1430 Frederick of Brandenburg, burgrave of Nuremberg, agreed terms with Prokop, and the Hussites went home.: Hussiterna förde nu kriget utomlands, i fälttåg som de kallade de sköna eller ärorika ritterna. Från 1428 ledde Prokop och andra befälhavare härar in i Schlesien och Lausitz, Österrike, Övre Ungern och Sachsen, där de brände städer och kloster, tog lösensummor och byte och straffade de länder som hade sänt män till korstågen; de gjorde inga försök till varaktiga erövringar. Den största ritten, vintern 1429–30, gick genom Sachsen in i Franken, där Plauen plundrades och Hof och Bayreuth brändes. I Kulmbach den 6 februari 1430 kom Fredrik av Brandenburg, borggreve av Nürnberg, överens med Prokop, och hussiterna drog hem.
