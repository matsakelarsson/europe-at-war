# Svenska översättningar av katalogtexten (våg 13); stegtexterna kommer senare.
Hut Tax War: Hyddskattekriget
? The armed resistance of 1898 to British rule in the new Protectorate of Sierra Leone, set off by Governor Frederic Cardew’s tax on houses. Britain had ruled the coastal Colony around Freetown since 1808 and in 1896 declared a protectorate over the interior to secure it against other European powers; from 1 January 1898 every house there was to pay five or ten shillings a year, collected by the chiefs under the eye of district commissioners and the Frontier Police. Chiefs petitioned against it as an attack on their authority. In the north the Temne and Loko under Bai Bureh, ruler of Kasseh near Port Loko, fought a guerrilla war from February to November 1898 that tied down British and West Indian troops for months. In the south-east, from late April, Mende chiefs and warriors, organised through the Poro society, rose suddenly and killed several hundred Creole traders, missionaries, officials and others seen as agents of the government, before columns under Lieutenant-Colonel Marshall put the rising down in about two months. British troops burned villages and farms to break the resistance. Bai Bureh was captured on 11 November 1898 and exiled to the Gold Coast with the Mende leaders Nyagua and Kpana Lewis, and 96 men were hanged for murder. A royal commissioner, Sir David Chalmers, found that the tax and the way it was enforced had caused the rising, but the tax stayed.
: Det väpnade motståndet 1898 mot det brittiska styret i det nya protektoratet Sierra Leone, utlöst av guvernör Frederic Cardews skatt på hus. Storbritannien hade sedan 1808 styrt kolonin vid kusten kring Freetown och utropade 1896 ett protektorat över inlandet för att säkra det mot andra europeiska makter; från den 1 januari 1898 skulle varje hus där betala fem eller tio shilling om året, som hövdingarna skulle driva in under uppsikt av distriktskommissarier och gränspolisen. Hövdingarna protesterade i skrivelser mot skatten som ett angrepp på deras auktoritet. I norr förde temne och loko under Bai Bureh, härskare över Kasseh nära Port Loko, ett gerillakrig från februari till november 1898 som band brittiska och västindiska trupper i månader. I sydost reste sig från slutet av april mendehövdingar och krigare, organiserade genom poro-sällskapet, plötsligt och dödade flera hundra kreolska köpmän, missionärer, tjänstemän och andra som sågs som regeringens agenter, innan kolonner under överstelöjtnant Marshall slog ned resningen på ungefär två månader. Brittiska trupper brände byar och odlingar för att bryta motståndet. Bai Bureh tillfångatogs den 11 november 1898 och förvisades till Guldkusten tillsammans med mendeledarna Nyagua och Kpana Lewis, och 96 män hängdes för mord. En kunglig kommissarie, sir David Chalmers, fann att skatten och sättet den drevs in på hade orsakat resningen, men skatten blev kvar.
