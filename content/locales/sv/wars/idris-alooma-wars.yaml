Idris Alooma’s wars: Idris Aloomas krig
The campaigns of Mai Idris b. Ali, called Alooma after his burial place, the most famous king of Bornu. With a reorganised cavalry, a corps of musketeers trained by Turks, camel troops and large boats for crossing rivers and Lake Chad, he fought the peoples of the Bornu heartland who would not submit, expelling some of them and taking towns such as Amsaka by storm, raided as far as Kano, and in a series of expeditions to Kanem broke the power of the Bulala, who had driven his ancestors out two centuries earlier. Kanem was divided, with the Bulala under Bornu’s loose overlordship, and many Kanem peoples were moved to Bornu. Idris exchanged embassies with the Ottoman sultan Murad III and with Ahmad al-Mansur of Morocco, and was killed on campaign near present-day Maiduguri. His imam Ahmad ibn Furtu wrote an account of his first twelve years, the earliest detailed history of a West African king’s wars by a contemporary.: Fälttågen under Bornus mest berömde kung, mai Idris b. Ali, kallad Alooma efter sin gravplats. Med ett omorganiserat kavalleri, en kår av musketerare som utbildats av turkar, kameltrupper och stora båtar för att ta sig över floder och Tchadsjön bekämpade han de folk i Bornus kärnland som vägrade underkasta sig, fördrev en del av dem och tog städer som Amsaka med storm, gjorde räder ända till Kano och bröt i en serie expeditioner till Kanem makten hos bulala, som hade drivit ut hans förfäder två sekler tidigare. Kanem delades, med bulala under Bornus lösa överhöghet, och många av Kanems folk flyttades till Bornu. Idris utväxlade sändebud med den osmanske sultanen Murad III och med Ahmad al-Mansur av Marocko och dödades under ett fälttåg nära dagens Maiduguri. Hans imam Ahmad ibn Furtu skrev en skildring av hans första tolv år, den tidigaste detaljerade historien om en västafrikansk kungs krig skriven av en samtida.
