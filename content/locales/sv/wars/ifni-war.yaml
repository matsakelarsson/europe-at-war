Ifni War: Ifnikriget
A war between Spain and the Moroccan Army of Liberation, irregular forces backed by newly independent Morocco, over the Spanish enclave of Ifni and the Spanish Sahara. In November 1957 the irregulars attacked Sidi Ifni and the Spanish posts inland, and Spain withdrew to a small perimeter around the town, which was besieged; in the Sahara, a joint Spanish–French offensive in February 1958 broke the insurgents. By the Treaty of Angra de Cintra of April 1958 Spain ceded Cape Juby (the Tarfaya Strip) to Morocco, but it kept Sidi Ifni until 1969 and Western Sahara until 1975.: Ett krig mellan Spanien och Marockanska befrielsearmén, irreguljära styrkor med stöd av det nyss självständiga Marocko, om den spanska enklaven Ifni och Spanska Sahara. I november 1957 angrep de irreguljära styrkorna Sidi Ifni och de spanska posteringarna i inlandet, och Spanien drog sig tillbaka till ett litet område runt staden, som belägrades. I Sahara krossade en gemensam spansk-fransk offensiv upprorsmännen i februari 1958. Genom fördraget i Angra de Cintra i april 1958 avträdde Spanien Kap Juby (Tarfayaremsan) till Marocko, men behöll Sidi Ifni till 1969 och Västsahara till 1975.
Spain: Spanien
Moroccan Army of Liberation: Marockanska befrielsearmén
