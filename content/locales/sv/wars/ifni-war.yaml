Ifni War (Wikipedia): Ifnikriget (Wikipedia)
Treaty of Angra de Cintra (Wikipedia): Fördraget i Angra de Cintra (Wikipedia)
? A war between Spain and the Moroccan Army of Liberation, irregular forces that newly independent Morocco tolerated and in part armed, over the Spanish enclave of Ifni and the Spanish Sahara. After Morocco became independent in 1956, the southern units of the Army of Liberation, which had fought the French protectorate, turned on the Spanish territories that the Istiqlal party and the king claimed as part of a Greater Morocco, and many Sahrawi tribesmen joined them. On 23 November 1957 the irregulars attacked Sidi Ifni and the Spanish posts inland; Spain relieved the besieged posts of Tiliouine and Telata with paratroopers and the Legion, then pulled back to a perimeter around the town, which stayed under siege until June 1958. In the Sahara the irregulars drove the Spanish back to the coast, and Spanish legionnaires were ambushed at Edchera in January 1958. In February 1958 some 9,000 Spanish and 5,000 French troops with about 150 aircraft, the Spanish Operation Teide and the French Operation Écouvillon, swept the desert from El Aaiún, Villa Cisneros, Tindouf and Fort Gouraud and broke the irregulars. By the Treaty of Angra de Cintra of 1 April 1958 Spain handed Cape Juby, the Tarfaya Strip, to Morocco, but it kept Sidi Ifni until 1969 and Western Sahara until 1976. Spain lost about 200 dead and 80 missing; the irregulars lost an estimated 800–1,000 dead.
: Ett krig mellan Spanien och Marockanska befrielsearmén, irreguljära styrkor som det nyss självständiga Marocko tolererade och delvis beväpnade, om den spanska enklaven Ifni och Spanska Sahara. Sedan Marocko hade blivit självständigt 1956 vände sig befrielsearméns södra förband, som hade bekämpat det franska protektoratet, mot de spanska territorier som Istiqlalpartiet och kungen gjorde anspråk på som delar av ett Stormarocko, och många sahrawiska stammän anslöt sig till dem. Den 23 november 1957 anföll de irreguljära styrkorna Sidi Ifni och de spanska posteringarna i inlandet; Spanien undsatte de belägrade posteringarna Tiliouine och Telata med fallskärmsjägare och främlingslegionen och drog sig sedan tillbaka till en försvarslinje runt staden, som förblev belägrad till juni 1958. I Sahara drev de irreguljära styrkorna spanjorerna tillbaka till kusten, och spanska legionärer föll i ett bakhåll vid Edchera i januari 1958. I februari 1958 svepte omkring 9 000 spanska och 5 000 franska soldater med omkring 150 flygplan, i den spanska Operation Teide och den franska Operation Écouvillon, genom öknen från El Aaiún, Villa Cisneros, Tindouf och Fort Gouraud och krossade de irreguljära styrkorna. Genom fördraget i Angra de Cintra den 1 april 1958 överlämnade Spanien Kap Juby, Tarfayaremsan, till Marocko, men behöll Sidi Ifni till 1969 och Västsahara till 1976. Spanien förlorade omkring 200 döda och 80 saknade; de irreguljära styrkorna förlorade uppskattningsvis 800–1 000 döda.
