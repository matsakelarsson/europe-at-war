# Svenska översättningar av katalogtexten (våg 13); stegtexterna kommer senare.
Ijaye War: Ijayekriget
? A war among the Yoruba successor states of the Oyo Empire. When Alaafin Atiba died in 1859, his son Adelu succeeded him at New Oyo, against the old custom that the crown prince died with his father. Ibadan, the strongest of the new Yoruba towns, accepted Adelu; Kurunmi, the ruler of Ijaye and holder of Oyo’s highest military title, refused to do homage and seized a party of the alaafin’s men. In April 1860 Ibadan’s war chiefs, led by Balogun Ibikunle and Ogunmola, declared war on Ijaye. Abeokuta and its Egba army came to Ijaye’s help, and Ijebu also took its side, fearing Ibadan’s power. Ibadan besieged the city, which missionaries in the 1850s had estimated at 40,000–100,000 people, and cut off its food supplies; Kurunmi’s five sons were killed and he himself died in June 1861. Ijaye, starving, fell on 17 March 1862 and was destroyed; its survivors fled to Abeokuta, where they settled in a quarter still called Ago Ijaye, while many others were enslaved. The war went on between Ibadan and the Egba and Ijebu over the roads to the coast, which both sides closed to each other’s trade. Britain, which had annexed Lagos in 1861 and wanted the trade routes open, intervened in March 1865, when troops from Lagos drove the Egba from their camp outside Ikorodu, a town under Lagos’s protection. Ibadan emerged as the leading Yoruba military power, and the rivalries left unresolved led to the Kiriji War of 1877–1893.
: Ett krig mellan de yorubastater som efterträdde Oyoriket. När alaafin Atiba dog 1859 efterträddes han i Nya Oyo av sin son Adelu, i strid med den gamla seden att kronprinsen dog med sin far. Ibadan, den starkaste av de nya yorubastäderna, godtog Adelu; Kurunmi, härskaren i Ijaye och innehavare av Oyos högsta militära titel, vägrade att hylla honom och grep en grupp av alaafinens män. I april 1860 förklarade Ibadans krigshövdingar, under ledning av balogun Ibikunle och Ogunmola, krig mot Ijaye. Abeokuta och dess egbaarmé kom Ijaye till hjälp, och även Ijebu ställde sig på dess sida av fruktan för Ibadans makt. Ibadan belägrade staden, vars befolkning missionärer på 1850-talet hade uppskattat till 40 000–100 000 människor, och skar av dess livsmedelsförsörjning; Kurunmis fem söner dödades och han själv dog i juni 1861. Det svältande Ijaye föll den 17 mars 1862 och förstördes; de överlevande flydde till Abeokuta, där de slog sig ned i en stadsdel som fortfarande kallas Ago Ijaye, medan många andra förslavades. Kriget fortsatte mellan Ibadan å ena sidan och egba och Ijebu å den andra om vägarna till kusten, som båda sidor stängde för varandras handel. Storbritannien, som hade annekterat Lagos 1861 och ville hålla handelsvägarna öppna, ingrep i mars 1865, när trupper från Lagos drev egba från deras läger utanför Ikorodu, en stad under Lagos beskydd. Ibadan framstod som den ledande militärmakten bland yoruba, och de olösta rivaliteterna ledde till Kirijikriget 1877–1893.
