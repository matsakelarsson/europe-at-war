# Svenska översättningar av katalogtexten (våg 13); stegtexterna kommer senare.
Ijebu expedition: Ijebuexpeditionen
? A short British campaign from Lagos that conquered the Yoruba kingdom of Ijebu, in what is now south-western Nigeria. Ijebu lay across the roads between the British colony of Lagos and the interior, and it kept the trade in its own merchants’ hands, charging tolls and closing the roads to Lagos traders and missionaries when it chose. In January 1892, after the Awujale (king) of Ijebu had turned back a mission led by the acting governor George Denton the year before, he agreed to open the roads in return for £500 a year in compensation for lost tolls; when a missionary was refused passage soon afterwards, Governor Gilbert Carter’s government treated it as a breach of the agreement. On 12 May 1892 a force of several hundred colonial soldiers, mostly Hausa troops from Lagos and the Gold Coast and men of the West India Regiment, with carriers and some Ibadan irregulars, under Colonel Francis Scott, landed at Epe on the lagoon and marched inland. The Ijebu raised an army of about 8,000 armed mostly with old muskets, and fought hard at the crossing of the Yemoji river near Imagbon, where Maxim guns cut down their ranks; the Ijebu are reported to have lost over 900 men and the British force about 56 killed and 30 wounded. The Awujale submitted, the British flag was raised in Ijebu Ode, and Ijebu toll gates and several shrines were destroyed. Ijebu came under the Lagos government, the roads to Ibadan were opened, and in 1893 Carter toured the interior; treaties with Abeokuta, Oyo and Ibadan that year brought most of Yorubaland under British protection without further war.
: Ett kort brittiskt fälttåg från Lagos som erövrade yorubariket Ijebu, i det som i dag är sydvästra Nigeria. Ijebu låg tvärs över vägarna mellan den brittiska kolonin Lagos och inlandet, och riket höll handeln i sina egna köpmäns händer, tog ut vägtullar och stängde vägarna för köpmän och missionärer från Lagos när det behagade. I januari 1892, sedan awujale (kungen) av Ijebu året innan hade avvisat en beskickning under den tillförordnade guvernören George Denton, gick han med på att öppna vägarna mot 500 pund om året i ersättning för förlorade tullintäkter; när en missionär strax därefter vägrades passage behandlade guvernör Gilbert Carters regering det som ett brott mot överenskommelsen. Den 12 maj 1892 landsteg en styrka på flera hundra kolonialsoldater, mest hausatrupper från Lagos och Guldkusten och män ur West India Regiment, med bärare och några irreguljära från Ibadan, under överste Francis Scott vid Epe vid lagunen och marscherade inåt landet. Ijebu ställde upp en armé på omkring 8 000 man, beväpnade mest med gamla musköter, och stred hårt vid övergången av floden Yemoji nära Imagbon, där Maximkulsprutor mejade ned deras led; ijebu ska ha förlorat över 900 man och den brittiska styrkan omkring 56 döda och 30 sårade. Awujale underkastade sig, den brittiska flaggan hissades i Ijebu Ode, och Ijebus tullbommar och flera helgedomar förstördes. Ijebu kom under regeringen i Lagos, vägarna till Ibadan öppnades, och 1893 reste Carter runt i inlandet; fördrag med Abeokuta, Oyo och Ibadan samma år förde större delen av yorubalandet under brittiskt beskydd utan ytterligare krig.
