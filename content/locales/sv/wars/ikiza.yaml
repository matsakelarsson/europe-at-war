# Svenska översättningar av katalogtexten (våg 13); stegtexterna kommer senare.
Ikiza (1972 killings in Burundi): Ikiza (dödandet i Burundi 1972)
? "A Hutu rising in southern Burundi in April 1972 and the mass killings of Hutu by the Tutsi-dominated army and government that followed, known in Kirundi as the Ikiza (“the catastrophe”) or Ubwicanyi (“the killings”). Since 1966 President Michel Micombero had ruled with a circle of Tutsi officers and officials from Bururi province, the Groupe de Bururi, and Hutu had been pushed out of the army and government after the killings and the attempted coup of 1965. On 30 March 1972 the deposed king Ntare V returned from exile in Uganda and was held at Gitega. Between 20:00 and 21:00 on 29 April Hutu militants, joined by exiled Zairean rebels whom Burundians called “Mulelists”, attacked in Bujumbura and in the south around Rumonge, Nyanza-Lac and Bururi, killing officials and every Tutsi they found and Hutu who would not join them: missionaries estimated 800–1,200 dead. That night Ntare V was killed at Gitega. Zaire’s President Mobutu sent paratroopers to hold Bujumbura airport and Tanzania sent ammunition; the army retook Rumonge on 1 May and Nyanza-Lac on 2 May. It then turned on the Hutu population across the country, above all educated Hutu: teachers, priests, civil servants, soldiers, pupils and university students were taken from lists and killed by the army and the ruling party’s youth wing, the Jeunesses Révolutionnaires Rwagasore, and buried in mass graves. The army declared operations over on 21 June. Conservative estimates of the dead range from 100,000 to 150,000; some go up to 300,000, about 10–15 per cent of Burundi’s Hutu men. Tens of thousands fled, most of them to Tanzania; by mid-1973 about 35,000 had reached Zaire and about 6,000 Rwanda. Historians disagree whether it was a genocide: Jean-Pierre Chrétien and Leo Kuper called it one, René Lemarchand a “selective genocide”, others “organised massacres”; in December 2021 Burundi’s Truth and Reconciliation Commission declared that the state had committed genocide against the Hutu in 1972. The Ikiza’s legacy, and the fear it left on both sides, shaped Burundi’s later crises of 1988 and 1993."
: "Ett hutuuppror i södra Burundi i april 1972 och de massmord på hutuer som den tutsidominerade armén och regeringen sedan begick, på kirundi kallade Ikiza (”katastrofen”) eller Ubwicanyi (”dödandet”). Sedan 1966 hade president Michel Micombero styrt med en krets av tutsiska officerare och ämbetsmän från provinsen Bururi, Groupe de Bururi, och hutuer hade trängts ut ur armén och regeringen efter dödandet och kuppförsöket 1965. Den 30 mars 1972 återvände den avsatte kungen Ntare V från exilen i Uganda och hölls fången i Gitega. Mellan klockan 20.00 och 21.00 den 29 april angrep hutuiska militanta, förstärkta av landsflyktiga zairiska rebeller som burundierna kallade ”mulelister”, i Bujumbura och i söder kring Rumonge, Nyanza-Lac och Bururi och dödade ämbetsmän och alla tutsier de fann samt hutuer som vägrade ansluta sig till dem: missionärer uppskattade antalet döda till 800–1 200. Samma natt dödades Ntare V i Gitega. Zaires president Mobutu sände fallskärmsjägare för att hålla flygplatsen i Bujumbura och Tanzania sände ammunition; armén återtog Rumonge den 1 maj och Nyanza-Lac den 2 maj. Den vände sig sedan mot hutubefolkningen i hela landet, framför allt mot utbildade hutuer: lärare, präster, tjänstemän, soldater, skolelever och universitetsstudenter hämtades enligt listor och dödades av armén och regeringspartiets ungdomsförbund, Jeunesses Révolutionnaires Rwagasore, och begravdes i massgravar. Armén förklarade operationerna avslutade den 21 juni. Försiktiga uppskattningar av antalet döda varierar från 100 000 till 150 000; vissa går upp till 300 000, omkring 10–15 procent av Burundis hutuiska män. Tiotusentals flydde, de flesta till Tanzania; i mitten av 1973 hade omkring 35 000 nått Zaire och omkring 6 000 Rwanda. Historikerna är oeniga om huruvida det var ett folkmord: Jean-Pierre Chrétien och Leo Kuper kallade det folkmord, René Lemarchand ett ”selektivt folkmord”, andra ”organiserade massakrer”; i december 2021 förklarade Burundis sannings- och försoningskommission att staten hade begått folkmord på hutuerna 1972. Arvet efter Ikiza, och den fruktan som massmorden lämnade efter sig på båda sidor, präglade Burundis senare kriser 1988 och 1993."
