# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
Russian occupation of Ili and the Ili crisis: Den ryska ockupationen av Ili och Ilikrisen
? Russia’s ten-year occupation of the Ili valley in northern Xinjiang and the diplomatic crisis over its return. During the Dungan Revolt the Taranchi Muslims of Ili had set up a sultanate at Kulja (Yining). In 1871, fearing that Yakub Beg would take the valley and wanting to secure its trade and frontier, Russia sent troops under General Gerasim Kolpakovsky from Semirechye; after brief fighting they occupied Kulja on 4 July 1871 (22 June in the Julian calendar) and ended the sultanate, promising to hand the region back when the Qing could hold it. After Zuo Zongtang reconquered the rest of Xinjiang in 1877–1878, the Qing envoy Chonghou signed the Treaty of Livadia in 1879, which returned only part of the valley, ceded the Tekes valley and the passes to the south, and gave Russia large trade rights and 5 million roubles. Beijing refused to ratify it and sentenced Chonghou to death; for a time in 1880 war seemed near, with Russian warships sent to Chinese waters and Zuo moving his headquarters to Hami. Under the Treaty of Saint Petersburg, negotiated by Zeng Jize and signed on 24 February 1881, China recovered most of the valley, including the Tekes, for an indemnity of 9 million roubles, while Russia kept a strip in the west for the people who chose to move to Russia. Russian troops left in 1883, and many Taranchis and Dungans resettled in Semirechye.
: Rysslands tioåriga ockupation av Ilidalen i norra Xinjiang och den diplomatiska krisen om dess återlämnande. Under Dunganupproret hade taranchimuslimerna i Ili upprättat ett sultanat i Kulja (Yining). År 1871 sände Ryssland, som fruktade att Yakub Beg skulle ta dalen och ville säkra dess handel och gräns, trupper under general Gerasim Kolpakovskij från Semiretje; efter korta strider ockuperade de Kulja den 4 juli 1871 (22 juni enligt den julianska kalendern) och gjorde slut på sultanatet, med löfte om att lämna tillbaka området när Qing kunde hålla det. Sedan Zuo Zongtang hade återerövrat resten av Xinjiang 1877–1878 undertecknade Qingsändebudet Chonghou fördraget i Livadia 1879, som bara återlämnade en del av dalen, avträdde Tekesdalen och passen i söder och gav Ryssland omfattande handelsrättigheter och 5 miljoner rubel. Peking vägrade ratificera det och dömde Chonghou till döden; en tid 1880 tycktes krig nära, då ryska krigsfartyg sändes till kinesiska vatten och Zuo flyttade sitt högkvarter till Hami. Genom fördraget i Sankt Petersburg, förhandlat av Zeng Jize och undertecknat den 24 februari 1881, återfick Kina större delen av dalen, inklusive Tekes, mot ett skadestånd på 9 miljoner rubel, medan Ryssland behöll en remsa i väster för de människor som valde att flytta till Ryssland. De ryska trupperna lämnade området 1883, och många taranchier och dunganer bosatte sig i Semiretje.
