# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
Ili rebellion: Iliupproret
? A Soviet-backed revolt against Nationalist rule in northern Xinjiang that created the second East Turkestan Republic. On 7 November 1944 Uyghur, Kazakh and other rebels rose in Ghulja (Kulja), the main town of the Ili valley, and on 12 November proclaimed the East Turkestan Republic with the Uzbek scholar Elihan Tore as president. Its Ili National Army, with Soviet officers, arms and aircraft, took the Ili, Tarbagatai (Tacheng) and Altai districts, and in September 1945 reached the Manas River, little more than 100 km from Ürümqi, before Moscow called a halt. Soviet-mediated talks led in 1946 to a coalition provincial government, which broke down in 1947; the Three Districts governed themselves until 1949, while the Kazakh leader Ospan Batyr (Osman Batur) fought them for the Nationalists and clashed with Mongolian and Soviet forces at Beitashan. In 1949 the Ili leaders agreed to join the People’s Republic; five of them died in an air crash on the way to Beijing, and in December 1949 their army became part of the People’s Liberation Army.
: Ett sovjetstött uppror mot nationalisternas styre i norra Xinjiang som skapade den andra republiken Östturkestan. Den 7 november 1944 reste sig uiguriska, kazakiska och andra rebeller i Ghulja (Kulja), huvudorten i Ilidalen, och den 12 november utropade de Republiken Östturkestan med den uzbekiske lärde Elihan Tore som president. Dess nationella Iliarmé, med sovjetiska officerare, vapen och flygplan, intog distrikten Ili, Tarbagatai (Tacheng) och Altai och nådde i september 1945 Manasfloden, knappt mer än 100 km från Ürümqi, innan Moskva beordrade stopp. Förhandlingar med sovjetisk medling ledde 1946 till en provinsiell koalitionsregering, som bröt samman 1947; de tre distrikten styrde sig själva fram till 1949, medan kazakledaren Ospan Batyr (Osman Batur) bekämpade dem för nationalisternas räkning och drabbade samman med mongoliska och sovjetiska styrkor vid Beitashan. År 1949 gick Ilis ledare med på att ansluta sig till Folkrepubliken; fem av dem omkom i en flygolycka på väg till Peking, och i december 1949 blev deras armé en del av Folkets befrielsearmé.
