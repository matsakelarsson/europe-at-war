Ilinden–Preobrazhenie Uprising: Ilinden–Preobrazjenieupproret
A rising against Ottoman rule in Macedonia and the Adrianople region, organised by the Internal Macedonian-Adrianople Revolutionary Organisation. It began on Saint Elijah’s Day (Ilinden), 2 August 1903, when rebels held Kruševo for ten days, spread to the Strandzha mountains on the Feast of the Transfiguration (Preobrazhenie), and was crushed by the autumn with the burning of some 200 villages; it led the powers to impose the Mürzsteg reforms on the Ottoman government.: Ett uppror mot det osmanska styret i Makedonien och Adrianopelregionen, organiserat av Inre makedonsk-adrianopolitanska revolutionära organisationen. Det började på Eliasdagen (Ilinden) den 2 augusti 1903, då rebeller höll Kruševo i tio dagar, spred sig till Strandzjabergen på Kristi förklarings dag (Preobrazjenie) och krossades under hösten, då omkring 200 byar brändes. Upproret fick stormakterna att tvinga på den osmanska regeringen Mürzstegreformerna.
