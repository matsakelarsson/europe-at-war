The revolutionary organisation had been preparing a rising for Macedonian and Thracian autonomy for years, but in 1903 arrests and the death of its best-known leader, Gotse Delchev, in May weakened it. A congress at Smilevo set the date anyway. On the night of 2 August, Saint Elijah’s Day, bands rose across the Manastır vilayet, cutting telegraph lines and attacking Ottoman posts. Some 800 rebels under Nikola Karev and Pitu Guli took the town of Kruševo and set up a provisional government, the Kruševo Republic. Rebels also held Smilevo and villages around Kastoria and Florina, and on 19 August a second rising broke out in the Strandzha mountains.: Den revolutionära organisationen hade i flera år förberett ett uppror för makedonsk och thrakisk autonomi, men 1903 försvagades den av arresteringar och av att dess mest kände ledare, Gotse Deltjev, dog i maj. En kongress i Smilevo fastställde ändå datumet. Natten till den 2 augusti, Eliasdagen, reste sig grupper över hela vilajetet Manastır, skar av telegraflinjer och angrep osmanska posteringar. Omkring 800 rebeller under Nikola Karev och Pitu Guli intog staden Kruševo och upprättade en provisorisk regering, Kruševorepubliken. Rebeller höll också Smilevo och byar kring Kastoria och Florina, och den 19 augusti bröt ett andra uppror ut i Strandzjabergen.
The Ottoman government sent tens of thousands of soldiers, with irregular bashi-bazouks. Kruševo was retaken after ten days, and Pitu Guli fell defending the approaches at Mečkin Kamen. By October the rising had been crushed. By the organisation’s count about 200 villages were burned, more than 4,000 civilians killed and some 70,000 people left homeless, and thousands fled to Bulgaria. The outcry led Austria-Hungary and Russia to agree the Mürzsteg reform programme in October 1903, which put foreign officers in charge of a reformed gendarmerie in Macedonia.: Den osmanska regeringen sände tiotusentals soldater, med irreguljära basjibozuker. Kruševo återtogs efter tio dagar, och Pitu Guli stupade när han försvarade tillfartsvägarna vid Mečkin Kamen. I oktober hade upproret krossats. Enligt organisationens beräkningar brändes omkring 200 byar, mer än 4 000 civila dödades och omkring 70 000 människor blev hemlösa, och tusentals flydde till Bulgarien. Protesterna fick Österrike-Ungern och Ryssland att i oktober 1903 enas om Mürzstegs reformprogram, som ställde utländska officerare i ledningen för ett reformerat gendarmeri i Makedonien.
