August – October 1903: augusti – oktober 1903
The organisation, founded in Thessaloniki in 1893, changed its name several times and is usually called IMRO or IMARO in English. Both Bulgaria and North Macedonia celebrate the uprising as part of their national history, and they disagree over the national identity of its leaders and fighters.: Organisationen, som grundades i Thessaloniki 1893, bytte namn flera gånger och kallas på engelska vanligen IMRO eller IMARO. Både Bulgarien och Nordmakedonien firar upproret som en del av sin nationella historia, och de är oense om den nationella identiteten hos dess ledare och kämpar.
The rising took place under the Julian calendar, by which Ilinden fell on 20 July and Preobrazhenie on 6 August; the dates here are New Style. Figures for villages burned and people killed come mainly from the organisation’s own reports and are approximate.: Upproret ägde rum under den julianska kalendern, enligt vilken Ilinden inföll den 20 juli och Preobrazjenie den 6 augusti; datumen här anges enligt nya stilen. Siffrorna för brända byar och dödade människor kommer främst från organisationens egna rapporter och är ungefärliga.
