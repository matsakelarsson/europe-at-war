# Svenska översättningar av katalogtexten (våg 10); stegtexterna kommer senare.
Japanese invasions of Korea (Imjin War): De japanska invasionerna av Korea (Imjinkriget)
Two invasions of Korea ordered by Toyotomi Hideyoshi, who had just unified Japan and meant to go on to conquer Ming China. In May 1592 about 160,000 men landed at Busan, took Hanseong (Seoul) within three weeks and Pyongyang in July, and pushed into the far north-east. At sea Yi Sun-sin’s fleet cut the Japanese supply route along the south coast, volunteer righteous armies rose behind the Japanese lines, and in February 1593 a Ming army retook Pyongyang. The Japanese fell back to forts on the south coast while Ming and Japanese envoys negotiated for three years. When the talks failed, Hideyoshi sent a second army in 1597; it destroyed the Korean fleet at Chilcheollyang and overran Jeolla, but was stopped short of Hanseong at Jiksan and at sea at Myeongnyang. After Hideyoshi’s death in September 1598 the Japanese withdrew, fighting a last sea battle at Noryang, where Yi Sun-sin was killed. Korea was devastated; estimates of the dead, soldiers and civilians, run to about a million.: Två invasioner av Korea som beordrades av Toyotomi Hideyoshi, som just hade enat Japan och tänkte gå vidare och erövra Mingdynastins Kina. I maj 1592 landsteg omkring 160 000 man i Busan, intog Hanseong (Seoul) inom tre veckor och Pyongyang i juli och trängde in i landets yttersta nordöst. Till sjöss skar Yi Sun-sins flotta av den japanska försörjningslinjen längs sydkusten, frivilliga rättfärdiga arméer reste sig bakom de japanska linjerna, och i februari 1593 återtog en Mingarmé Pyongyang. Japanerna drog sig tillbaka till fästen på sydkusten medan sändebud från Ming och Japan förhandlade i tre år. När förhandlingarna misslyckades sände Hideyoshi en andra armé 1597; den förintade den koreanska flottan vid Chilcheollyang och överskred Jeolla, men stoppades före Hanseong vid Jiksan och till sjöss vid Myeongnyang. Efter Hideyoshis död i september 1598 drog sig japanerna tillbaka och utkämpade ett sista sjöslag vid Noryang, där Yi Sun-sin stupade. Korea ödelades; uppskattningarna av antalet döda, soldater och civila, uppgår till omkring en miljon.
