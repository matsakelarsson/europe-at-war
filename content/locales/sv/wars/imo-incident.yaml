# Svenska översättningar av katalogtexten (våg 10); stegtexterna kommer senare.
Imo incident: Imoincidenten
? A revolt of soldiers in Hanseong in 1882, the imo year of the sixty-year cycle. The soldiers of the old army units, who resented the favour shown to the new Special Skills Force trained by a Japanese officer, had gone unpaid for thirteen months; when they were finally given a month’s rice ration, it had been mixed with sand and husks. On 23 July 1882 they rioted, broke into the house of Min Gyeom-ho, the official in charge of their pay, seized weapons, freed prisoners and were joined by the poor of the city. Crowds killed the Japanese instructor Horimoto Reizō and attacked the Japanese legation; the minister Hanabusa Yoshitada and his staff burned it and fought their way to Incheon, losing several men, and escaped to sea, where a British survey ship picked them up. The next day the rioters entered the palace and killed Min Gyeom-ho and other officials. Queen Min escaped disguised as a court lady, and the king recalled his father, the Heungseon Daewongun, who had sympathised with the soldiers, to power. Japan sent troops and warships with Hanabusa, and the Qing sent about 4,500 troops under Wu Changqing, with Ma Jianzhong and Ding Ruchang. On 26 August the Chinese lured the Daewongun to their camp, arrested him and took him to China, where he was held for three years, and three days later Chinese troops attacked the soldiers’ quarters at Wangsimni and Itaewon. On 30 August Korea signed the Treaty of Chemulpo with Japan, agreeing to punish the culprits, pay an indemnity of 500,000 yen and let Japan station troops at its legation. Chinese troops stayed in Hanseong, and China reasserted its authority over Korea.
: En revolt bland soldater i Hanseong 1882, imoåret i sextioårscykeln. Soldaterna i de gamla arméförbanden, som var förbittrade över den gunst som visades den nya Specialstyrkan, tränad av en japansk officer, hade inte fått någon lön på tretton månader; när de till slut fick en månads risranson hade den blandats med sand och agnar. Den 23 juli 1882 gjorde de upplopp, bröt sig in i huset hos Min Gyeom-ho, den ämbetsman som ansvarade för deras lön, beslagtog vapen, befriade fångar och fick sällskap av stadens fattiga. Folkmassor dödade den japanske instruktören Horimoto Reizō och angrep den japanska legationen; ministern Hanabusa Yoshitada och hans personal brände den och slog sig fram till Incheon, varvid de förlorade flera man, och flydde till sjöss, där ett brittiskt sjömätningsfartyg tog upp dem. Dagen därpå trängde upprorsmännen in i palatset och dödade Min Gyeom-ho och andra ämbetsmän. Drottning Min flydde förklädd till hovdam, och kungen kallade tillbaka sin far, Heungseon Daewongun, som hade sympatiserat med soldaterna, till makten. Japan sände trupper och krigsfartyg med Hanabusa, och Qing sände omkring 4 500 soldater under Wu Changqing, tillsammans med Ma Jianzhong och Ding Ruchang. Den 26 augusti lockade kineserna Daewongun till sitt läger, grep honom och förde honom till Kina, där han hölls i tre år, och tre dagar senare angrep kinesiska trupper soldaternas kvarter i Wangsimni och Itaewon. Den 30 augusti undertecknade Korea Chemulpofördraget med Japan och gick med på att straffa de skyldiga, betala ett skadestånd på 500 000 yen och låta Japan förlägga trupper vid sin legation. Kinesiska trupper stannade i Hanseong, och Kina återhävdade sin överhöghet över Korea.
