Impresa di Fiume: Impresa di Fiume
The seizure of the Adriatic port of Fiume (now Rijeka, Croatia) by the nationalist poet Gabriele D’Annunzio and some 2,500 mutinous Italian soldiers and volunteers in September 1919, to force its annexation to Italy while the peace conference was still deciding its fate. D’Annunzio ruled the city for over a year, proclaiming the Italian Regency of Carnaro in September 1920, and refused to accept the Treaty of Rapallo, by which Italy and Yugoslavia made Fiume a free state. In the “Bloody Christmas” of 24–29 December 1920 the Italian army and navy forced him out, at the cost of about 60 dead.: Den nationalistiske poeten Gabriele D’Annunzios och omkring 2 500 myteriska italienska soldaters och frivilligas maktövertagande i adriatiska hamnstaden Fiume (i dag Rijeka i Kroatien) i september 1919, för att tvinga fram stadens annektering till Italien medan fredskonferensen ännu avgjorde dess öde. D’Annunzio styrde staden i över ett år, utropade Italienska regentskapet Carnaro i september 1920 och vägrade godta Rapallofördraget, genom vilket Italien och Jugoslavien gjorde Fiume till en fristat. Under den ”blodiga julen” 24–29 december 1920 tvingade den italienska armén och flottan bort honom, till priset av omkring 60 döda.
