The regency’s style, with its balcony speeches, black shirts and mass rallies, was later copied by Mussolini’s Fascists. The Free State of Fiume was ended in 1924, when Italy annexed the city by agreement with Yugoslavia.: Regentskapets stil, med balkongtal, svarta skjortor och massmöten, kopierades senare av Mussolinis fascister. Fristaten Fiume upphörde 1924, då Italien annekterade staden genom en överenskommelse med Jugoslavien.
