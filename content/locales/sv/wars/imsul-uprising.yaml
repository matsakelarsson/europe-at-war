Imsul peasant uprisings: Imsulårets bondeuppror
? A wave of peasant risings across southern Korea in 1862, the imsul year of the sixty-year cycle. Under the rule of the in-law Andong Kim clan the three main taxes, the land tax, the military cloth tax and the state grain loans, had become a means of extortion by magistrates and clerks, who added arbitrary levies and forced loans of grain at high interest. After a rising at Danseong on 4 March, peasants of Jinju led by Yu Gye-chun rose on 14 March against the extortions of the provincial army commander Baek Nak-sin. Wearing white headbands and armed with clubs, thousands of them entered the town on 18 March, humiliated the commander, killed several clerks and burned the houses of officials and rich landlords. The court sent Bak Gyu-su to investigate, but the unrest spread in the spring and summer to more than 70 towns in Gyeongsang, Jeolla and Chungcheong, among them Hamyang, Iksan, Gaeryeong, Hampyeong, Gongju and Hoedeok, and in the autumn to Jeju and Hamhung. Each rising was local, attacking the county office and dispersing within days. The government executed the leaders, punished corrupt officials, and set up an office to reform the three taxes, the Samjeong ijeongcheong, but abandoned its reforms within months.
: En våg av bondeuppror i södra Korea 1862, imsulåret i sextioårscykeln. Under den med kungahuset ingifta Andong Kim-klanens styre hade de tre huvudskatterna, jordskatten, den militära tygskatten och statens spannmålslån, blivit ett medel för utpressning i händerna på prefekter och skrivare, som lade till godtyckliga pålagor och tvångslån av spannmål mot hög ränta. Efter en resning i Danseong den 4 mars reste sig bönderna i Jinju under ledning av Yu Gye-chun den 14 mars mot utpressningen från provinsarméns befälhavare Baek Nak-sin. Med vita pannband och beväpnade med klubbor tågade tusentals av dem in i staden den 18 mars, förödmjukade befälhavaren, dödade flera skrivare och brände ämbetsmäns och rika godsägares hus. Hovet sände Bak Gyu-su för att utreda saken, men oroligheterna spred sig under våren och sommaren till mer än 70 städer i Gyeongsang, Jeolla och Chungcheong, bland dem Hamyang, Iksan, Gaeryeong, Hampyeong, Gongju och Hoedeok, och under hösten till Jeju och Hamhung. Varje resning var lokal, angrep distriktets ämbetsbyggnad och skingrades inom några dagar. Regeringen avrättade ledarna, straffade korrumperade ämbetsmän och inrättade ett ämbete för att reformera de tre skatterna, Samjeong ijeongcheong, men övergav sina reformer inom några månader.
