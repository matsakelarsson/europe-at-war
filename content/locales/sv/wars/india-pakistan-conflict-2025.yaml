India–Pakistan conflict of 2025: Indisk-pakistanska konflikten 2025
? Four days of missile, drone and air strikes and artillery fire between India and Pakistan in May 2025, the most serious fighting between the two nuclear-armed states since 1971. On 22 April 2025 gunmen killed 26 people, nearly all of them Hindu tourists, at a meadow near Pahalgam in Indian-administered Kashmir. India blamed militants backed by Pakistan, suspended the Indus Waters Treaty and expelled Pakistani diplomats; Pakistan denied involvement and answered with measures of its own. On 7 May India struck nine sites in Pakistan and Pakistani-administered Kashmir that it called terrorist camps, in what it named Operation Sindoor; Pakistan said civilians and mosques had been hit and claimed to have shot down several Indian fighter jets. After days of shelling along the Line of Control and waves of drones, both sides struck each other’s air bases on 10 May, and that afternoon a ceasefire, first announced by US President Donald Trump, took effect. Officially, 21 civilians and 8 soldiers died on the Indian side and 40 civilians and 13 soldiers on the Pakistani side. Both countries claimed victory.
: Fyra dagar av robot-, drönar- och flyganfall och artilleribeskjutning mellan Indien och Pakistan i maj 2025, de allvarligaste striderna mellan de två kärnvapenmakterna sedan 1971. Den 22 april 2025 dödade beväpnade män 26 människor, nästan alla hinduiska turister, på en äng nära Pahalgam i det indiskt administrerade Kashmir. Indien anklagade militanter med stöd från Pakistan, suspenderade Indusvattenavtalet och utvisade pakistanska diplomater; Pakistan förnekade inblandning och svarade med egna åtgärder. Den 7 maj anföll Indien nio platser i Pakistan och det pakistanskt administrerade Kashmir som landet kallade terroristläger, i vad det benämnde Operation Sindoor; Pakistan uppgav att civila och moskéer hade träffats och hävdade att det hade skjutit ned flera indiska stridsflygplan. Efter flera dagars beskjutning längs kontrollinjen och vågor av drönare anföll båda sidor varandras flygbaser den 10 maj, och samma eftermiddag trädde ett eldupphör i kraft, som först tillkännagavs av USA:s president Donald Trump. Officiellt dog 21 civila och 8 soldater på den indiska sidan och 40 civila och 13 soldater på den pakistanska. Båda länderna utropade sig till segrare.
