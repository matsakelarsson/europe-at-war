India–Pakistan crisis of 2019: Indisk-pakistanska krisen 2019
? A brief military crisis between India and Pakistan, the first in which the two nuclear-armed states carried out air strikes on each other’s territory since 1971. On 14 February 2019 a young Kashmiri suicide bomber drove a car full of explosives into a convoy of the Central Reserve Police Force at Lethpora near Pulwama, killing 40 policemen; Jaish-e-Mohammed (JeM), a group based in Pakistan, claimed the attack. India blamed Pakistan, which denied involvement. On 26 February Indian Mirage 2000 jets bombed a site near Balakot in Khyber Pakhtunkhwa that India said was a large JeM training camp, claiming many militants killed; Pakistan said the bombs fell on empty forest, and satellite images examined by independent analysts showed the buildings still standing. The next day Pakistani aircraft struck open ground near Indian military sites in Jammu and Kashmir, and in the air battle that followed an Indian MiG-21 was shot down and its pilot, Wing Commander Abhinandan Varthaman, captured. India said he had shot down a Pakistani F-16, which Pakistan denied. The same day an Indian Mi-17 helicopter was brought down by an Indian missile over Budgam, killing six airmen and a civilian on the ground. Pakistan released the pilot on 1 March, and the crisis eased, although shelling across the Line of Control went on for weeks.
: En kort militär kris mellan Indien och Pakistan, den första sedan 1971 där de två kärnvapenmakterna genomförde flyganfall mot varandras territorium. Den 14 februari 2019 körde en ung kashmirisk självmordsbombare en bil full med sprängämnen in i en konvoj från Central Reserve Police Force vid Lethpora nära Pulwama och dödade 40 poliser; Jaish-e-Mohammed (JeM), en grupp med bas i Pakistan, tog på sig dådet. Indien anklagade Pakistan, som förnekade inblandning. Den 26 februari bombade indiska Mirage 2000-plan en plats nära Balakot i Khyber Pakhtunkhwa som Indien uppgav var ett stort träningsläger för JeM, och Indien hävdade att många militanter hade dödats; Pakistan uppgav att bomberna hade fallit i tom skog, och satellitbilder som granskades av oberoende analytiker visade att byggnaderna fortfarande stod kvar. Dagen därpå anföll pakistanska flygplan öppen mark nära indiska militära anläggningar i Jammu och Kashmir, och i den luftstrid som följde sköts en indisk MiG-21 ned och dess pilot, överstelöjtnant Abhinandan Varthaman, togs till fånga. Indien uppgav att han hade skjutit ned en pakistansk F-16, vilket Pakistan förnekade. Samma dag sköts en indisk Mi-17-helikopter ned av en indisk robot över Budgam, varvid sex flygare och en civilperson på marken dödades. Pakistan frigav piloten den 1 mars och krisen avtog, även om beskjutningen över kontrollinjen fortsatte i flera veckor.
