# Svenska översättningar av katalogtexten (våg 8); stegtexterna kommer senare.
India–Pakistan standoff of 2001–2002: Indisk-pakistanska konfrontationen 2001–2002
? The largest military confrontation between India and Pakistan since 1971, in which up to a million soldiers faced each other along the border and the Line of Control for ten months. On 13 December 2001 five gunmen attacked the Indian Parliament in New Delhi, killing nine people, most of them security staff, before they were killed. India blamed Lashkar-e-Taiba and Jaish-e-Mohammed, militant groups based in Pakistan, and demanded that Pakistan hand over suspects and shut them down; Pakistan condemned the attack and denied any role. India launched Operation Parakram, its largest mobilisation since 1971, moving some 500,000 troops to the border, and Pakistan answered in kind. Under American and British pressure, President Pervez Musharraf banned the two groups in January 2002, but the tension peaked again after gunmen killed 31 people, most of them soldiers’ wives and children, at an army camp at Kaluchak near Jammu on 14 May 2002. Fears of a war that could turn nuclear led many foreigners to leave both countries, until Pakistan promised to stop militants crossing into Indian-administered Kashmir and tensions eased in June. There was artillery fire across the Line of Control, but no war; India announced the end of its mobilisation on 16 October 2002. India said 798 of its soldiers died during the deployment, most in accidents and mine-laying.
: Den största militära konfrontationen mellan Indien och Pakistan sedan 1971, då upp till en miljon soldater stod mot varandra längs gränsen och kontrollinjen i tio månader. Den 13 december 2001 angrep fem beväpnade män det indiska parlamentet i New Delhi och dödade nio människor, de flesta ur säkerhetspersonalen, innan de själva dödades. Indien anklagade Lashkar-e-Taiba och Jaish-e-Mohammed, militanta grupper med bas i Pakistan, och krävde att Pakistan skulle utlämna misstänkta och slå ned på grupperna; Pakistan fördömde attacken och förnekade all inblandning. Indien inledde Operation Parakram, sin största mobilisering sedan 1971, och förde omkring 500 000 soldater till gränsen, och Pakistan gjorde detsamma. Under amerikanska och brittiska påtryckningar förbjöd president Pervez Musharraf de två grupperna i januari 2002, men spänningen nådde en ny topp sedan beväpnade män den 14 maj 2002 hade dödat 31 människor, de flesta soldaters hustrur och barn, i ett arméläger vid Kaluchak nära Jammu. Fruktan för ett krig som kunde bli ett kärnvapenkrig fick många utlänningar att lämna båda länderna, tills Pakistan lovade att hindra militanter från att ta sig in i det indiskt administrerade Kashmir och spänningarna lättade i juni. Det förekom artillerield över kontrollinjen, men inget krig; Indien tillkännagav den 16 oktober 2002 att mobiliseringen var över. Enligt Indien dog 798 av dess soldater under utplaceringen, de flesta i olyckor och vid minutläggning.
