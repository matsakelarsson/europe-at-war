# Svenska översättningar av katalogtexten (våg 8); stegtexterna kommer senare.
Indian campaigns of Ahmad Shah Durrani: Ahmad Shah Durranis fälttåg i Indien
The invasions of northern India by Ahmad Shah Durrani, the Afghan commander of Nader Shah who made himself king at Kandahar in 1747 and founded the Durrani Empire. Beaten back by a Mughal army at Manupur in 1748, he returned again and again, took the Punjab, Multan and Kashmir from the Mughal Empire by 1752, and in 1757 sacked Delhi, Mathura and Vrindavan. When the Marathas, now the strongest power in India, drove his son out of the Punjab in 1758, he came back, and on 14 January 1761, at the Third Battle of Panipat, his Afghan army and its Rohilla and Awadh allies destroyed the main Maratha army in one of the largest and bloodiest battles of the century. He could not hold the Punjab, however. The Sikh misls fought on through repeated defeats, including the massacre of 1762, took Lahore in 1765 and held the country between the Indus and the Yamuna after his last campaigns.: Invasionerna av norra Indien under Ahmad Shah Durrani, Nader Shahs afghanske befälhavare, som 1747 gjorde sig till kung i Kandahar och grundade Durraniriket. Sedan han 1748 hade slagits tillbaka av en mogularmé vid Manupur återkom han gång på gång, hade 1752 tagit Punjab, Multan och Kashmir från Mogulriket och plundrade 1757 Delhi, Mathura och Vrindavan. När maratherna, nu den starkaste makten i Indien, 1758 drev hans son ut ur Punjab kom han tillbaka, och den 14 januari 1761, i tredje slaget vid Panipat, förintade hans afghanska armé tillsammans med allierade rohillor och trupper från Awadh marathernas huvudarmé i ett av århundradets största och blodigaste slag. Punjab kunde han dock inte behålla. Sikhernas misler fortsatte kampen trots upprepade nederlag, däribland massakern 1762, intog Lahore 1765 och behärskade landet mellan Indus och Yamuna efter hans sista fälttåg.
