Indian Rebellion of 1857: Indiska upproret 1857
The largest armed challenge to British rule in India in the 19th century, also called the Indian Mutiny, the Sepoy Mutiny, the Great Rebellion and the First War of Independence. It began on 10 May 1857 when Indian soldiers (sepoys) of the East India Company’s Bengal Army rose at Meerut and marched to Delhi, where they proclaimed the aged Mughal emperor Bahadur Shah II their leader. Most of the Bengal Army and much of the population of the upper Ganges plain, Awadh, Rohilkhand and Bundelkhand joined them. The Company held Calcutta, Bombay, Madras and the Punjab, retook Delhi in September 1857 after a three-month siege, and recovered Cawnpore, Lucknow and central India by mid-1858. Both sides killed prisoners and civilians, and British reprisals were heavy. In 1858 the British Crown took over the government of India from the Company.: Den största väpnade utmaningen mot det brittiska styret i Indien under 1800-talet, även kallad indiska myteriet, sepoymyteriet, det stora upproret och det första frihetskriget. Det började den 10 maj 1857 när indiska soldater (sepoyer) i Ostindiska kompaniets Bengalarmé reste sig i Meerut och marscherade till Delhi, där de utropade den åldrige mogulkejsaren Bahadur Shah II till sin ledare. Större delen av Bengalarmén och stora delar av befolkningen på övre Gangesslätten, i Awadh, Rohilkhand och Bundelkhand anslöt sig till dem. Kompaniet behöll Calcutta, Bombay, Madras och Punjab, återtog Delhi i september 1857 efter en tre månader lång belägring och hade återvunnit Cawnpore, Lucknow och centrala Indien vid mitten av 1858. Båda sidor dödade fångar och civila, och de brittiska repressalierna var hårda. År 1858 övertog den brittiska kronan styret av Indien från kompaniet.
