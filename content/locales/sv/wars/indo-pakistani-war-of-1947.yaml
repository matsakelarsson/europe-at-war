# Svenska översättningar av katalogtexten (våg 8); stegtexterna kommer senare.
Indo-Pakistani War of 1947–1948: Indisk-pakistanska kriget 1947–1948
The first war between India and Pakistan, also called the First Kashmir War, fought over the princely state of Jammu and Kashmir after the partition of British India. A revolt in Poonch, communal massacres in Jammu and an invasion by Pashtun tribal forces from Pakistan in October 1947 led the Maharaja, Hari Singh, to accede to India, which flew troops into Srinagar. Pakistan disputed the accession, its officers directed the irregular forces and from May 1948 its regular army fought in Kashmir. In the north the Gilgit Scouts rose and joined Pakistan. A UN-arranged ceasefire on 1 January 1949 left India holding about two-thirds of the state, including the Kashmir valley, Jammu and Ladakh, and Pakistan about one-third, Azad Kashmir and Gilgit-Baltistan. The plebiscite both sides accepted in principle was never held, and the ceasefire line, now the Line of Control, still divides Kashmir.: Det första kriget mellan Indien och Pakistan, även kallat första Kashmirkriget, som utkämpades om furstestaten Jammu och Kashmir efter delningen av Brittiska Indien. Ett uppror i Poonch, massakrer mellan religiösa grupper i Jammu och en invasion av pashtunska stamstyrkor från Pakistan i oktober 1947 fick maharadjan, Hari Singh, att ansluta staten till Indien, som flög in trupper till Srinagar. Pakistan bestred anslutningen, dess officerare ledde de irreguljära styrkorna och från maj 1948 stred dess reguljära armé i Kashmir. I norr reste sig Gilgit Scouts och anslöt sig till Pakistan. Ett eldupphör som FN förmedlade den 1 januari 1949 lämnade omkring två tredjedelar av staten, däribland Kashmirdalen, Jammu och Ladakh, i Indiens händer och omkring en tredjedel, Azad Kashmir och Gilgit-Baltistan, i Pakistans. Den folkomröstning som båda sidor i princip hade godtagit hölls aldrig, och eldupphörslinjen, i dag kontrollinjen, delar fortfarande Kashmir.
