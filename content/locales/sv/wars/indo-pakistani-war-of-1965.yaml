# Svenska översättningar av katalogtexten (våg 8); stegtexterna kommer senare.
Indo-Pakistani War of 1965: Indisk-pakistanska kriget 1965
The second war between India and Pakistan over Kashmir, also called the Second Kashmir War. After clashes in the Rann of Kutch in the spring, Pakistan sent several thousand irregulars across the ceasefire line in August 1965 (Operation Gibraltar) in the hope of a rising in Indian-held Kashmir, which did not come. India crossed the line and took the Haji Pir pass, and Pakistan attacked in the Chhamb sector towards Akhnoor. On 6 September India opened a front across the international border towards Lahore and then Sialkot, and great tank battles were fought at Asal Uttar and Chawinda. A UN-demanded ceasefire took effect on 23 September with neither side decisively ahead, and in the Tashkent Declaration of January 1966 both agreed to return to their pre-war positions. Each country still marks the war as a success.: Det andra kriget mellan Indien och Pakistan om Kashmir, även kallat andra Kashmirkriget. Efter sammandrabbningar i Rann of Kutch under våren sände Pakistan i augusti 1965 flera tusen irreguljära kämpar över eldupphörslinjen (Operation Gibraltar) i hopp om ett uppror i det indiskt kontrollerade Kashmir, vilket uteblev. Indien gick över linjen och intog Haji Pir-passet, och Pakistan anföll i Chhambsektorn mot Akhnoor. Den 6 september öppnade Indien en front över den internationella gränsen mot Lahore och sedan Sialkot, och stora pansarslag utkämpades vid Asal Uttar och Chawinda. Ett eldupphör som FN hade krävt trädde i kraft den 23 september utan att någon av sidorna hade fått ett avgörande övertag, och i Tasjkentdeklarationen i januari 1966 enades båda om att återgå till sina ställningar från före kriget. Båda länderna firar fortfarande kriget som en framgång.
