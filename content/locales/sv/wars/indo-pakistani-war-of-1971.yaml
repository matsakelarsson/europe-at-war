# Svenska översättningar av katalogtexten (våg 8); stegtexterna kommer senare.
Indo-Pakistani War of 1971: Indisk-pakistanska kriget 1971
"The third war between India and Pakistan, fought on both of Pakistan’s fronts from 3 to 17 December 1971. It grew out of the Bangladesh Liberation War: after months of Indian support for the Bengali guerrillas, Pakistan struck Indian air bases on 3 December, and India declared war. In the east Indian forces and the Mukti Bahini reached Dhaka in thirteen days, and Pakistan’s Eastern Command surrendered on 16 December; that campaign is told in the Bangladesh Liberation War. In the west the armies fought in Kashmir, the Punjab and the Rajasthan desert, with battles at Chhamb, Longewala and Basantar, and the Indian navy attacked Karachi with missile boats. India declared a ceasefire in the west on 17 December. About 93,000 Pakistani prisoners were taken, and the Simla Agreement of 1972 turned the ceasefire line in Kashmir into the Line of Control.": "Det tredje kriget mellan Indien och Pakistan, som utkämpades på Pakistans båda fronter från den 3 till den 17 december 1971. Det växte fram ur Bangladeshs befrielsekrig: efter flera månader av indiskt stöd till de bengaliska gerillakämparna anföll Pakistan indiska flygbaser den 3 december, och Indien förklarade krig. I öster nådde indiska styrkor och Mukti Bahini Dhaka på tretton dagar, och Pakistans östkommando kapitulerade den 16 december; det fälttåget skildras under Bangladeshs befrielsekrig. I väster stred arméerna i Kashmir, Punjab och Rajasthanöknen, med slag vid Chhamb, Longewala och Basantar, och den indiska flottan anföll Karachi med robotbåtar. Indien förklarade eldupphör i väster den 17 december. Omkring 93 000 pakistanska fångar togs, och genom Simlaavtalet 1972 blev eldupphörslinjen i Kashmir kontrollinjen."
