# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
Indonesia–Malaysia confrontation: Konfrontationen mellan Indonesien och Malaysia
? "The undeclared war Indonesia waged against the creation of Malaysia, known in Indonesia and Malaysia as Konfrontasi. Sukarno denounced the federation of Malaya, Singapore, Sarawak and North Borneo (Sabah) planned by Malaya and Britain as a British neo-colonial scheme, backed the Brunei revolt of December 1962 and on 20 January 1963 announced a policy of confrontation. From April 1963 Indonesian volunteers and then regular troops raided across the jungle border in Borneo, and after Malaysia was proclaimed on 16 September 1963 Sukarno vowed to “crush Malaysia”. British, Gurkha, Malaysian, Australian and New Zealand troops held the border and from 1964 struck back with secret raids into Indonesian Kalimantan; Indonesian landings and parachute drops on the Malay Peninsula in 1964 failed, and bombings in Singapore killed civilians. After the army under General Suharto took power in Indonesia in 1965–1966, it made peace: an agreement signed in Jakarta on 11 August 1966 ended the conflict, and Indonesia recognised Malaysia. British, Australian, New Zealand and Singaporean losses were about 180 killed, besides Malaysian losses; Indonesian dead are estimated at 590 to over 2,000, and 36 civilians were killed."
: "Det oförklarade krig som Indonesien förde mot Malaysias bildande, i Indonesien och Malaysia känt som Konfrontasi. Sukarno fördömde den federation av Malaya, Singapore, Sarawak och Nordborneo (Sabah) som Malaya och Storbritannien planerade som ett brittiskt nykolonialt projekt, stödde revolten i Brunei i december 1962 och tillkännagav den 20 januari 1963 en konfrontationspolitik. Från april 1963 gjorde indonesiska frivilliga och därefter reguljära trupper räder över djungelgränsen på Borneo, och sedan Malaysia utropats den 16 september 1963 lovade Sukarno att ”krossa Malaysia”. Brittiska, malaysiska, australiska och nyzeeländska trupper samt gurkhaförband höll gränsen och slog från 1964 tillbaka med hemliga räder in i indonesiska Kalimantan; indonesiska landstigningar och fallskärmsnedsläpp på Malackahalvön 1964 misslyckades, och bombdåd i Singapore dödade civila. Sedan armén under general Suharto hade tagit makten i Indonesien 1965–1966 slöt den fred: ett avtal som undertecknades i Jakarta den 11 augusti 1966 avslutade konflikten, och Indonesien erkände Malaysia. De brittiska, australiska, nyzeeländska och singaporianska förlusterna uppgick till omkring 180 döda, utöver de malaysiska förlusterna; antalet döda indonesier uppskattas till mellan 590 och över 2 000, och 36 civila dödades."
