# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
Indonesian invasion and occupation of East Timor: Indonesiens invasion och ockupation av Östtimor
? "Indonesia’s invasion of the Portuguese colony of East Timor in December 1975 and its occupation of the territory until 1999. After the Carnation Revolution in Portugal in 1974, East Timorese parties formed to decide the colony’s future; a short civil war in August 1975 left Fretilin, the party of independence, in control, and on 28 November it declared the Democratic Republic of East Timor. Indonesia, which feared a left-wing state in its midst and had already sent troops across the border, invaded on 7 December 1975, a day after President Gerald Ford and Henry Kissinger had visited Jakarta, and in July 1976 annexed the territory as its 27th province. The United Nations never recognised the annexation. Fretilin’s army, Falintil, fought on in the mountains; the Indonesian campaigns of 1977–1979 destroyed its bases and drove hundreds of thousands of people into camps, where many died of famine and disease. A truth commission later counted at least 102,800 conflict-related deaths between 1974 and 1999, out of a population of about 650,000 in 1975, most of them from hunger and illness. The killing of protesters at the Santa Cruz cemetery in Dili in 1991 drew the world’s attention, and after the fall of Suharto Indonesia agreed to a vote: on 30 August 1999, 78.5 per cent of voters chose independence. Militias organised by the Indonesian army then killed some 1,400 people, forced more than 200,000 into West Timor and burned much of the country, until an Australian-led international force (INTERFET) landed on 20 September. Indonesia gave up its claim in October 1999, and after two years of UN administration East Timor became independent as Timor-Leste on 20 May 2002."
: "Indonesiens invasion av den portugisiska kolonin Östtimor i december 1975 och dess ockupation av området fram till 1999. Efter nejlikerevolutionen i Portugal 1974 bildades östtimoresiska partier för att avgöra kolonins framtid; ett kort inbördeskrig i augusti 1975 lämnade kontrollen åt Fretilin, självständighetspartiet, och den 28 november utropade det Demokratiska republiken Östtimor. Indonesien, som fruktade en vänsterstat mitt ibland sig och redan hade skickat trupper över gränsen, invaderade den 7 december 1975, en dag efter att president Gerald Ford och Henry Kissinger hade besökt Jakarta, och annekterade i juli 1976 området som sin 27:e provins. FN erkände aldrig annekteringen. Fretilins armé, Falintil, fortsatte striden i bergen; de indonesiska fälttågen 1977–1979 förstörde dess baser och drev hundratusentals människor in i läger, där många dog av svält och sjukdomar. En sanningskommission räknade senare minst 102 800 konfliktrelaterade dödsfall mellan 1974 och 1999, av en befolkning på omkring 650 000 år 1975, de flesta av dem orsakade av svält och sjukdom. Dödandet av demonstranter på Santa Cruz-kyrkogården i Dili 1991 väckte världens uppmärksamhet, och efter Suhartos fall gick Indonesien med på en omröstning: den 30 augusti 1999 valde 78,5 procent av väljarna självständighet. Miliser organiserade av den indonesiska armén dödade därefter omkring 1 400 människor, tvingade över 200 000 till Västtimor och brände ned stora delar av landet, tills en australiskledd internationell styrka (INTERFET) landsteg den 20 september. Indonesien gav upp sitt anspråk i oktober 1999, och efter två års FN-förvaltning blev Östtimor självständigt som Timor-Leste den 20 maj 2002."
