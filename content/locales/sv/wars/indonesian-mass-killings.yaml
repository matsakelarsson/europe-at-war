# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
30 September Movement and the Indonesian mass killings: 30 september-rörelsen och massmorden i Indonesien
? The failed coup of the 30 September Movement and the mass killings of communists and suspected communists that followed in Indonesia. In the early hours of 1 October 1965 a group of army officers calling itself the 30 September Movement kidnapped and killed six generals of the army high command in Jakarta and announced that it had taken power to protect President Sukarno. Major General Suharto crushed it within a day, and the army blamed the Communist Party of Indonesia (PKI), then the largest communist party outside the communist states. From October 1965 to early 1966 the army, together with civilian militias, Muslim and nationalist youth groups and local vigilantes, killed members and alleged supporters of the PKI and its affiliated unions and peasant, women’s and youth organisations across Java, Bali, Sumatra and other islands. Estimates of the dead range from about 78,500, the official figure of early 1966, to 3 million; most historians accept 500,000 to 1 million. Some 1 to 1.5 million people were imprisoned at one time or another, many for years without trial. The killings destroyed the PKI, which was banned on 12 March 1966, the day after Sukarno signed over much of his authority to Suharto, who went on to rule Indonesia as president until 1998.
: 30 september-rörelsens misslyckade kupp och de massmord på kommunister och misstänkta kommunister som följde i Indonesien. Under de tidiga morgontimmarna den 1 oktober 1965 kidnappade och dödade en grupp arméofficerare som kallade sig 30 september-rörelsen sex generaler i arméns överkommando i Jakarta och tillkännagav att den hade tagit makten för att skydda president Sukarno. Generalmajor Suharto krossade den inom ett dygn, och armén lade skulden på Indonesiens kommunistiska parti (PKI), som då var det största kommunistpartiet utanför de kommunistiska staterna. Från oktober 1965 till början av 1966 dödade armén, tillsammans med civila miliser, muslimska och nationalistiska ungdomsgrupper och lokala självutnämnda ordningsmän, medlemmar och påstådda anhängare av PKI och dess anslutna fackföreningar och bonde-, kvinno- och ungdomsorganisationer över hela Java, Bali, Sumatra och andra öar. Uppskattningarna av antalet döda sträcker sig från omkring 78 500, den officiella siffran från början av 1966, till 3 miljoner; de flesta historiker godtar 500 000 till 1 miljon. Omkring 1 till 1,5 miljoner människor satt fängslade vid något tillfälle, många i åratal utan rättegång. Morden förintade PKI, som förbjöds den 12 mars 1966, dagen efter att Sukarno hade överlåtit en stor del av sin makt till Suharto, som sedan styrde Indonesien som president fram till 1998.
