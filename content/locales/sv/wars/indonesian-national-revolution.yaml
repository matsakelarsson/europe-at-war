# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
Indonesian National Revolution: Indonesiska nationella revolutionen
? The war and the negotiations through which Indonesia won its independence from the Netherlands. Two days after Japan’s surrender, on 17 August 1945, Sukarno and Mohammad Hatta proclaimed the Republic of Indonesia in Jakarta. British and Indian troops landed from late September to take the Japanese surrender, and the Dutch returned with them; in the months that followed, armed youth groups killed thousands of Dutch, Eurasian, Chinese and other civilians in the violence known as the bersiap, and the British fought a three-week battle for Surabaya. After the British left in 1946 the Dutch, who had recognised the Republic’s authority over Java, Madura and Sumatra in the Linggadjati Agreement, launched two great offensives, which they called “police actions”, in July 1947 and December 1948; the second took the Republican capital, Yogyakarta, and its leaders. In between, the Republic put down a communist rising at Madiun. A guerrilla war, the pressure of the United Nations and the United States, and the failure of the Dutch to build a federation without the Republic led to the Round Table Conference in The Hague, and on 27 December 1949 the Netherlands transferred sovereignty over the Indies, except western New Guinea, to the Republic of the United States of Indonesia. About 100,000 Indonesians died, along with some 5,000 Dutch soldiers and several thousand Dutch-side civilians.
: Det krig och de förhandlingar genom vilka Indonesien vann sin självständighet från Nederländerna. Två dagar efter Japans kapitulation, den 17 augusti 1945, utropade Sukarno och Mohammad Hatta Republiken Indonesien i Jakarta. Brittiska och indiska trupper landsteg från slutet av september för att ta emot den japanska kapitulationen, och nederländarna återvände med dem; under de följande månaderna dödade beväpnade ungdomsgrupper tusentals nederländska, eurasiska, kinesiska och andra civila i det våld som kallas bersiap, och britterna utkämpade ett treveckorsslag om Surabaya. Sedan britterna lämnat landet 1946 inledde nederländarna, som i Linggadjatiavtalet hade erkänt republikens myndighet över Java, Madura och Sumatra, två stora offensiver, som de kallade ”polisaktioner”, i juli 1947 och december 1948; den andra intog republikens huvudstad Yogyakarta och tillfångatog dess ledare. Däremellan slog republiken ned en kommunistisk resning i Madiun. Ett gerillakrig, påtryckningar från FN och USA och nederländarnas misslyckande med att bygga upp en federation utan republiken ledde till rundabordskonferensen i Haag, och den 27 december 1949 överlät Nederländerna suveräniteten över Ostindien, utom västra Nya Guinea, till Republiken Indonesiens förenta stater. Omkring 100 000 indonesier dog, tillsammans med omkring 5 000 nederländska soldater och flera tusen civila på den nederländska sidan.
