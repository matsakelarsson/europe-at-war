In Russia’s Time of Troubles, Tsar Vasily Shuisky called in Swedish help against a Polish-backed pretender. In 1609 Jacob De la Gardie’s corps of Swedish and foreign mercenaries joined Prince Skopin-Shuisky’s Russian army and helped relieve Moscow. But on 4 July 1610 the Poles crushed the combined army at Klushino, between Moscow and Smolensk, and the unpaid mercenaries gave up.: Under den ryska oredans tid kallade tsar Vasilij Sjujskij in svensk hjälp mot en tronpretendent som stöddes av Polen. År 1609 förenade sig Jacob De la Gardies kår av svenska och utländska legosoldater med furst Skopin-Sjujskijs ryska armé och hjälpte till att undsätta Moskva. Men den 4 juli 1610 krossade polackerna den förenade armén vid Klusjino, mellan Moskva och Smolensk, och de obetalda legosoldaterna gav upp.
Sweden then turned on Russia. De la Gardie stormed Novgorod on 16 July 1611, and the occupied city even talked of a Swedish prince as tsar. In 1615 the young Gustav II Adolf besieged Pskov but could not take it. At Stolbovo on 27 February 1617 Russia gave Sweden Ingria and Kexholm, cutting itself off from the Baltic, and got Novgorod back.: Sverige vände sig då mot Ryssland. De la Gardie stormade Novgorod den 16 juli 1611, och i den ockuperade staden talade man till och med om en svensk prins som tsar. År 1615 belägrade den unge Gustav II Adolf Pskov men kunde inte inta staden. I Stolbova den 27 februari 1617 avträdde Ryssland Ingermanland och Kexholm till Sverige, och stängde därmed ute sig självt från Östersjön, men fick tillbaka Novgorod.
