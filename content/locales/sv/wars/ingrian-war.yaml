Ingrian War: Ingermanländska kriget
In Russia’s Time of Troubles Sweden first sent troops to help Tsar Vasily Shuisky against Poland, then, after the defeat at Klushino, turned on Russia and occupied Novgorod. The Treaty of Stolbovo in 1617 gave Sweden Ingria and Kexholm and cut Russia off from the Baltic.: Under den ryska oredans tid sände Sverige först trupper för att hjälpa tsar Vasilij Sjujskij mot Polen, men vände sig efter nederlaget vid Klusjino mot Ryssland och ockuperade Novgorod. Freden i Stolbova 1617 gav Sverige Ingermanland och Kexholm och stängde ute Ryssland från Östersjön.
