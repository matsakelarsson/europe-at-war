# Svenska översättningar av katalogtexten (våg 8); stegtexterna kommer senare.
Insurgency in Balochistan: Upproret i Belutjistan
? The armed struggle of Baloch nationalists against the Pakistani state in Balochistan, Pakistan’s largest and poorest province, rich in gas and minerals. It began with a revolt against the accession of the Khanate of Kalat in 1948 and flared in risings in 1958–1959, 1963–1969 and 1973–1977, the last a full-scale war in which the army, helped by Iran, fought tens of thousands of tribal guerrillas. The current insurgency began in the early 2000s, led by the Balochistan Liberation Army (BLA) and the Balochistan Liberation Front (BLF), and gained force after the army killed the tribal leader Akbar Bugti in 2006. The insurgents attack soldiers, police, settlers from other provinces and Chinese-funded projects; the security forces are accused of thousands of enforced disappearances. Pakistan accuses India of backing the insurgents, which India denies. Since 2024 the attacks have grown larger, with the hijacking of a passenger train in 2025 and coordinated offensives across the province. Last updated 27 November 2026.
: Belutjiska nationalisters väpnade kamp mot den pakistanska staten i Belutjistan, Pakistans största och fattigaste provins, rik på gas och mineraler. Den började med ett uppror mot khanatet Kalats anslutning 1948 och blossade upp i resningar 1958–1959, 1963–1969 och 1973–1977, den sista ett fullskaligt krig där armén med iransk hjälp bekämpade tiotusentals gerillakrigare ur stammarna. Det nuvarande upproret började i början av 2000-talet, lett av Belutjistans befrielsearmé (BLA) och Belutjistans befrielsefront (BLF), och fick ökad kraft sedan armén 2006 hade dödat stamledaren Akbar Bugti. Rebellerna angriper soldater, poliser, inflyttade från andra provinser och kinesiskfinansierade projekt; säkerhetsstyrkorna anklagas för tusentals påtvingade försvinnanden. Pakistan anklagar Indien för att stödja rebellerna, vilket Indien förnekar. Sedan 2024 har attackerna blivit större, med kapningen av ett passagerartåg 2025 och samordnade offensiver över hela provinsen. Senast uppdaterad 27 november 2026.
