# Svenska översättningar av katalogtexten (våg 13); stegtexterna kommer senare.
Insurgency in Cabo Delgado: Upproret i Cabo Delgado
? The Islamist insurgency in Mozambique’s northernmost province, Cabo Delgado, waged since October 2017 by the group known locally as al-Shabaab (unrelated to the Somali movement) or Ansar al-Sunna, which has fought since 2019 under the banner of the Islamic State, from 2022 as its Mozambique Province. Rooted in the grievances of young Muslims of the coast, poverty and unemployment in a province rich in rubies and natural gas, and in local religious conflict, the insurgency began with an attack on police stations in Mocímboa da Praia. The insurgents took Mocímboa da Praia in August 2020 and attacked Palma in March 2021, forcing TotalEnergies to halt a $20 billion gas project. Rwanda sent troops in July 2021, followed by a force of the Southern African Development Community (SAMIM), and together with Mozambican forces they retook Mocímboa da Praia in August 2021. The insurgents spread into Niassa and Nampula and fought on in smaller groups; SAMIM left in 2024, and Rwanda, with several thousand troops (over 6,300 by its own count in 2026), became the main foreign force. By late 2026 more than 6,600 people had been killed and about 1.3 million displaced.
: Det islamistiska upproret i Moçambiques nordligaste provins, Cabo Delgado, som sedan oktober 2017 förs av den grupp som lokalt kallas al-Shabaab (utan samband med den somaliska rörelsen) eller Ansar al-Sunna och som sedan 2019 strider under Islamiska statens fana, från 2022 som dess Moçambiqueprovins. Upproret, som har sina rötter i missnöjet bland kustens unga muslimer, i fattigdom och arbetslöshet i en provins rik på rubiner och naturgas och i lokala religiösa konflikter, började med ett anfall mot polisstationer i Mocímboa da Praia. Upprorsmännen intog Mocímboa da Praia i augusti 2020 och anföll Palma i mars 2021, vilket tvingade TotalEnergies att stoppa ett gasprojekt värt 20 miljarder dollar. Rwanda sände trupper i juli 2021, följt av en styrka från Södra Afrikas utvecklingsgemenskap (SAMIM), och tillsammans med moçambikiska styrkor återtog de Mocímboa da Praia i augusti 2021. Upprorsmännen spred sig till Niassa och Nampula och fortsatte striderna i mindre grupper; SAMIM lämnade landet 2024, och Rwanda, med flera tusen soldater (över 6 300 enligt egen uppgift 2026), blev den främsta utländska styrkan. I slutet av 2026 hade mer än 6 600 människor dödats och omkring 1,3 miljoner fördrivits.
