# Svenska översättningar av katalogtexten (våg 8); stegtexterna kommer senare.
Insurgency in Jammu and Kashmir: Upproret i Jammu och Kashmir
? The armed insurgency against Indian rule in Jammu and Kashmir, the Muslim-majority region whose status India and Pakistan have disputed since 1947. It broke out in 1989 after a widely disputed state election, first led by the pro-independence JKLF and then by pro-Pakistan groups such as Hizbul Mujahideen and Pakistan-based organisations such as Lashkar-e-Taiba and Jaish-e-Mohammed. India accuses Pakistan of arming and sending the militants; Pakistan says it gives the Kashmiris only moral, political and diplomatic support. Most of the valley’s Kashmiri Hindus (Pandits) fled in 1990, and both the militants and the Indian security forces were accused of grave abuses. Violence peaked around 2001, fell during the peace process of 2004–2008, and revived in waves of protest and local militancy. In 2019 India revoked the region’s special status and divided the state. The Indian government counted about 41,000 deaths by 2017; other estimates are much higher. In 2026 violence was at its lowest level since 1989, but attacks continued.
: Det väpnade upproret mot det indiska styret i Jammu och Kashmir, den region med muslimsk majoritet vars status Indien och Pakistan har tvistat om sedan 1947. Det bröt ut 1989 efter ett delstatsval vars resultat var allmänt ifrågasatt och leddes först av det självständighetsvänliga JKLF och sedan av Pakistanvänliga grupper som Hizbul Mujahideen och organisationer med bas i Pakistan som Lashkar-e-Taiba och Jaish-e-Mohammed. Indien anklagar Pakistan för att beväpna och skicka in de militanta; Pakistan säger att det bara ger kashmirerna moraliskt, politiskt och diplomatiskt stöd. De flesta av dalens kashmiriska hinduer (panditer) flydde 1990, och både de militanta och de indiska säkerhetsstyrkorna anklagades för grova övergrepp. Våldet nådde sin höjdpunkt omkring 2001, minskade under fredsprocessen 2004–2008 och blossade upp igen i vågor av protester och lokal militans. År 2019 upphävde Indien regionens särskilda status och delade delstaten. Den indiska regeringen räknade med omkring 41 000 döda fram till 2017; andra uppskattningar är betydligt högre. År 2026 var våldet på sin lägsta nivå sedan 1989, men attackerna fortsatte.
