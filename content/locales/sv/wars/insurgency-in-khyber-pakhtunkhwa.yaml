# Svenska översättningar av katalogtexten (våg 8); stegtexterna kommer senare.
Insurgency in Khyber Pakhtunkhwa: Upproret i Khyber Pakhtunkhwa
? The war between the Pakistani state and Islamist militants in the north-west of Pakistan, above all the Pakistani Taliban, Tehrik-i-Taliban Pakistan (TTP). It began in 2004, when the army entered the tribal areas on the Afghan border, where Taliban and al-Qaeda fighters had taken refuge after 2001, and grew after the storming of the Red Mosque in Islamabad in 2007 and the founding of the TTP that year. The militants took over the Swat valley until the army drove them out in 2009, and carried out hundreds of suicide bombings across Pakistan, while American drones struck their leaders. Large army offensives in South and North Waziristan in 2009 and 2014 and the national response to the massacre at the Army Public School in Peshawar pushed the TTP into Afghanistan. After the Afghan Taliban returned to power in 2021 it revived, and in 2024–2026 violence rose to its highest level in a decade and spilled into open war between Pakistan and Afghanistan. Tens of thousands of people have been killed and millions displaced.
: Kriget mellan den pakistanska staten och islamistiska militanta i nordvästra Pakistan, framför allt de pakistanska talibanerna, Tehrik-i-Taliban Pakistan (TTP). Det började 2004, när armén ryckte in i stamområdena vid den afghanska gränsen, där talibaner och al-Qaida-krigare hade sökt skydd efter 2001, och trappades upp efter stormningen av Röda moskén i Islamabad 2007 och grundandet av TTP samma år. De militanta tog kontrollen över Swatdalen tills armén drev ut dem 2009 och utförde hundratals självmordsattentat runt om i Pakistan, medan amerikanska drönare angrep deras ledare. Stora arméoffensiver i Sydwaziristan och Nordwaziristan 2009 och 2014 och den nationella reaktionen på massakern på Army Public School i Peshawar drev TTP in i Afghanistan. Sedan de afghanska talibanerna hade återkommit till makten 2021 fick TTP ny kraft, och 2024–2026 steg våldet till sin högsta nivå på ett decennium och övergick i öppet krig mellan Pakistan och Afghanistan. Tiotusentals människor har dödats och miljoner har fördrivits.
