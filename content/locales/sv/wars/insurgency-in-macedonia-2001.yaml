The country was admitted to the UN in 1993 as “the former Yugoslav Republic of Macedonia” and has been called North Macedonia since 2019. The NLA was known in Albanian as the UÇK (Ushtria Çlirimtare Kombëtare), the same initials as the Kosovo Liberation Army. Places are named in their Macedonian form.: Landet upptogs i FN 1993 som ”f.d. jugoslaviska republiken Makedonien” och heter sedan 2019 Nordmakedonien. NLA kallades på albanska UÇK (Ushtria Çlirimtare Kombëtare), samma initialer som Kosovos befrielsearmé. Orterna anges med sina makedoniska namn.
Whether the NLA aimed at equal rights within Macedonia, as its leaders said, or at secession and a union with Kosovo or Albania, as the government claimed, is still disputed. Casualty figures vary between sources; most give 63–77 dead among the security forces and 64–105 among the NLA, besides civilians.: Om NLA strävade efter lika rättigheter inom Makedonien, som dess ledare sade, eller efter utbrytning och en union med Kosovo eller Albanien, som regeringen hävdade, är fortfarande omstritt. Uppgifterna om förlusterna varierar mellan källorna; de flesta anger 63–77 döda bland säkerhetsstyrkorna och 64–105 inom NLA, utöver civila.
