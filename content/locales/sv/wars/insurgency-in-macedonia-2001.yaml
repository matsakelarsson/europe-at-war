2001 insurgency in Macedonia: Upproret i Makedonien 2001
An armed conflict in the Republic of Macedonia (now North Macedonia) between the security forces and the National Liberation Army (NLA), an ethnic Albanian armed group whose ranks included veterans of the wars in Kosovo and the Preševo Valley. The NLA said it was fighting for equal rights for Albanians, about a quarter of the population; the government called it a terrorist group bent on secession. After fighting around Tetovo, Kumanovo and Skopje, the Ohrid Framework Agreement of 13 August 2001 promised Albanians wider rights in return for the NLA’s disarmament, which NATO oversaw. Some 150–250 people were killed and about 140,000 fled their homes, most of whom returned.: En väpnad konflikt i Republiken Makedonien (i dag Nordmakedonien) mellan säkerhetsstyrkorna och Nationella befrielsearmén (NLA), en etniskt albansk väpnad grupp vars led omfattade veteraner från krigen i Kosovo och Preševodalen. NLA uppgav att den kämpade för lika rättigheter för albanerna, ungefär en fjärdedel av befolkningen; regeringen kallade den en terroristgrupp som strävade efter utbrytning. Efter strider kring Tetovo, Kumanovo och Skopje utlovade Ohridavtalet den 13 augusti 2001 albanerna utvidgade rättigheter i utbyte mot NLA:s avväpning, som Nato övervakade. Omkring 150–250 människor dödades och omkring 140 000 flydde från sina hem; de flesta av dem återvände.
