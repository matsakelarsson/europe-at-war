A ceasefire signed on 5 July and guaranteed by NATO held only in part. In late July fighting broke out again in and around Tetovo; on 8 August an NLA ambush at Karpalak killed ten soldiers, and on 10 August a landmine killed eight more near Ljuboten, north of Skopje. From 10 to 12 August police and irregulars attacked Ljuboten, an Albanian village; Human Rights Watch found that ten civilians were killed and more than 100 men arrested, many of them beaten in custody. The International Criminal Tribunal for the former Yugoslavia later sentenced a police officer, Johan Tarčulovski, to 12 years and acquitted the interior minister, Ljube Boškoski.: Ett eldupphör som undertecknades den 5 juli och garanterades av Nato höll bara delvis. I slutet av juli bröt striderna ut igen i och kring Tetovo; den 8 augusti dödade ett bakhåll av NLA vid Karpalak tio soldater, och den 10 augusti dödade en landmina ytterligare åtta nära Ljuboten, norr om Skopje. Den 10–12 augusti angrep polis och irreguljära styrkor Ljuboten, en albansk by; Human Rights Watch fann att tio civila dödades och mer än 100 män greps, och många av dem misshandlades i förvar. Internationella krigsförbrytartribunalen för f.d. Jugoslavien dömde senare en polisman, Johan Tarčulovski, till 12 års fängelse och frikände inrikesministern Ljube Boškoski.
Talks at Ohrid, mediated by American and European envoys, ended on 13 August with the Ohrid Framework Agreement, signed by the leaders of the main Macedonian and Albanian parties. It promised more Albanians in the police and public service, official use of Albanian where Albanians made up more than a fifth of the population, more local self-government and changes to the constitution, in return for the NLA’s disarmament. In NATO’s Operation Essential Harvest, from 27 August to 26 September, several thousand troops collected nearly 4,000 weapons handed in by the NLA, which then announced that it had disbanded. Parliament adopted the constitutional amendments in November, and in 2002 Ahmeti founded a party, the Democratic Union for Integration.: Förhandlingarna i Ohrid, med amerikanska och europeiska sändebud som medlare, avslutades den 13 augusti med Ohridavtalet, som undertecknades av ledarna för de största makedoniska och albanska partierna. Det utlovade fler albaner inom polisen och den offentliga förvaltningen, officiellt bruk av albanska där albanerna utgjorde mer än en femtedel av befolkningen, utökat lokalt självstyre och ändringar i författningen, i utbyte mot NLA:s avväpning. I Natos Operation Essential Harvest, från den 27 augusti till den 26 september, samlade flera tusen soldater in nästan 4 000 vapen som NLA lämnade in, och gruppen meddelade därefter att den hade upplösts. Parlamentet antog författningsändringarna i november, och 2002 grundade Ahmeti ett parti, Demokratiska unionen för integration.
