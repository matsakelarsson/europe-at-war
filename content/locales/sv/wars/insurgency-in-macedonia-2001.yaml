Albanians, about a quarter of the Republic of Macedonia’s people, had long complained of being second-class citizens. The constitution of 1991 called the state the national state of the Macedonian people, Macedonian was the only official language, and few Albanians served in the police or the army. On 22 January 2001 a new armed group, the National Liberation Army (NLA), led by Ali Ahmeti and drawing on veterans of the Kosovo Liberation Army and the Preševo Valley, attacked the police station at Tearce near Tetovo, killing a policeman. In February and March its fighters held Tanuševci, a village on the Kosovo border, until Macedonian forces drove them out.: Albanerna, ungefär en fjärdedel av befolkningen i Republiken Makedonien, hade länge klagat över att vara andra klassens medborgare. Författningen från 1991 kallade staten det makedoniska folkets nationalstat, makedonska var det enda officiella språket, och få albaner tjänstgjorde inom polisen eller armén. Den 22 januari 2001 angrep en ny väpnad grupp, Nationella befrielsearmén (NLA), ledd av Ali Ahmeti och med veteraner från Kosovos befrielsearmé och Preševodalen i sina led, polisstationen i Tearce nära Tetovo och dödade en polis. I februari och mars höll dess kämpar Tanuševci, en by vid gränsen mot Kosovo, tills makedoniska styrkor drev ut dem.
In mid-March the NLA appeared on the hills above Tetovo, the largest Albanian town, and the army and police shelled the heights from 25 March until they declared the offensive over on 31 March. On 28 April an ambush at Vejce killed eight members of the security forces. From May the NLA held villages north of Kumanovo around Lipkovo, Vaksince and Slupčane, which the army shelled, and on 12 June it took Aračinovo, within reach of Skopje. Under a deal brokered by NATO some 350 fighters left on 25 June with their weapons, escorted by American troops; that night thousands of angry Macedonians stormed the parliament in Skopje.: I mitten av mars dök NLA upp på höjderna ovanför Tetovo, den största albanska staden, och armén och polisen besköt höjderna från den 25 mars tills de förklarade offensiven avslutad den 31 mars. Den 28 april dödades åtta medlemmar av säkerhetsstyrkorna i ett bakhåll vid Vejce. Från maj höll NLA byar norr om Kumanovo kring Lipkovo, Vaksince och Slupčane, som armén besköt, och den 12 juni intog gruppen Aračinovo, inom räckhåll för Skopje. Enligt en överenskommelse som Nato förmedlat lämnade omkring 350 kämpar byn den 25 juni med sina vapen, eskorterade av amerikanska trupper; samma natt stormade tusentals upprörda makedonier parlamentet i Skopje.
