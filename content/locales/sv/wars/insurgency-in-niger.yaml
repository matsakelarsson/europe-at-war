# Svenska översättningar av katalogtexten (våg 12); stegtexterna kommer senare.
Jihadist insurgency in Niger: Det jihadistiska upproret i Niger
? "Last updated 27 November 2026. The jihadist insurgency in Niger, fought on two fronts. In the south-east, Boko Haram crossed from Nigeria into the Diffa region and attacked Bosso and Diffa in February 2015, after Niger joined the regional force against it; the war around Lake Chad has gone on there since, with Boko Haram and the Islamic State West Africa Province (ISWAP), which split from it in 2016. In the west, the Islamic State in the Greater Sahara (ISGS), founded in 2015 by Adnan Abu Walid al-Sahrawi, and later JNIM operated from Mali in the Tillabéri and Tahoua regions along the border, attacking army posts and villages. An ambush at Tongo Tongo on 4 October 2017 killed four American and at least four Nigerien soldiers; attacks on the bases of Inates on 10 December 2019 and Chinagodrar on 9 January 2020 killed 71 and 89 soldiers; six French aid workers and two Nigeriens were killed at Kouré in August 2020; about 100 villagers were killed at Tchoma Bangou and Zaroumdareye on 2 January 2021, and some 141 people in villages of the Tahoua region on 21 March 2021. ISGS became the Islamic State’s Sahel Province (IS Sahel) in 2022. Niger was then the main Western partner in the Sahel, with French troops and an American drone base at Agadez. On 26 July 2023 the presidential guard under General Abdourahamane Tiani overthrew President Mohamed Bazoum. The junta made French troops leave by December 2023 and American troops by September 2024, turned to Russia, whose Africa Corps arrived in April 2024, formed the Alliance of Sahel States with Mali and Burkina Faso and left ECOWAS in January 2025. The violence grew: ACLED recorded some 1,900 deaths in Niger in 2025, more than 1,200 of them in Tillabéri. In 2026 IS Sahel attacked the international airport and Air Base 101 at Niamey on the night of 28–29 January; JNIM overran an army post at Makalondi on 4 February, killing at least 36 soldiers; soldiers who mutinied in Niamey on 29 August attacked the airport, the presidency and the state broadcaster before loyal troops, helped by Russian forces, put the mutiny down. On 26 November 2026 an attack on a National Guard post at Sanam in Tillabéri killed at least 13 guardsmen, two days after an attack attributed to Boko Haram killed 11 soldiers in Diffa. JNIM and IS Sahel also fight each other along the borders with Mali and Burkina Faso. Most figures come from the government and from ACLED’s count of reported deaths and cannot be checked independently; how much of rural Tillabéri the state still controls is uncertain."
: "Senast uppdaterad 27 november 2026. Det jihadistiska upproret i Niger, utkämpat på två fronter. I sydost gick Boko Haram över gränsen från Nigeria in i regionen Diffa och anföll Bosso och Diffa i februari 2015, sedan Niger hade anslutit sig till den regionala styrkan mot gruppen; kriget kring Tchadsjön har sedan dess pågått där, med Boko Haram och Islamiska statens Västafrikaprovins (ISWAP), som bröt sig ur Boko Haram 2016. I väster opererade Islamiska staten i Stora Sahara (ISGS), som grundades 2015 av Adnan Abu Walid al-Sahrawi, och senare JNIM från Mali i regionerna Tillabéri och Tahoua längs gränsen och angrep arméposteringar och byar. Ett bakhåll vid Tongo Tongo den 4 oktober 2017 dödade fyra amerikanska och minst fyra nigeriska soldater; anfallen mot baserna i Inates den 10 december 2019 och Chinagodrar den 9 januari 2020 dödade 71 respektive 89 soldater; sex franska biståndsarbetare och två nigerier dödades vid Kouré i augusti 2020; omkring 100 bybor dödades i Tchoma Bangou och Zaroumdareye den 2 januari 2021, och omkring 141 människor i byar i regionen Tahoua den 21 mars 2021. ISGS blev Islamiska statens Sahelprovins (IS Sahel) 2022. Niger var då västvärldens främsta partner i Sahel, med franska trupper och en amerikansk drönarbas i Agadez. Den 26 juli 2023 störtade presidentgardet under general Abdourahamane Tiani president Mohamed Bazoum. Juntan tvingade de franska trupperna att lämna landet senast i december 2023 och de amerikanska senast i september 2024, vände sig till Ryssland, vars Afrikakår anlände i april 2024, bildade Sahelstaternas allians tillsammans med Mali och Burkina Faso och lämnade Ecowas i januari 2025. Våldet ökade: ACLED registrerade omkring 1 900 dödsfall i Niger 2025, mer än 1 200 av dem i Tillabéri. År 2026 anföll IS Sahel den internationella flygplatsen och flygbas 101 i Niamey natten mellan den 28 och 29 januari; JNIM erövrade en armépostering i Makalondi den 4 februari och dödade minst 36 soldater; soldater som gjorde myteri i Niamey den 29 augusti angrep flygplatsen, presidentpalatset och det statliga radio- och tv-bolaget innan lojala trupper med hjälp av ryska styrkor slog ned myteriet. Den 26 november 2026 dödades minst 13 gardister vid ett anfall mot en postering för nationalgardet i Sanam i Tillabéri, två dagar efter att ett anfall som tillskrivits Boko Haram hade dödat 11 soldater i Diffa. JNIM och IS Sahel strider också mot varandra längs gränserna mot Mali och Burkina Faso. De flesta siffrorna kommer från regeringen och från ACLED:s sammanställning av rapporterade dödsfall och kan inte kontrolleras oberoende; hur stor del av landsbygden i Tillabéri som staten fortfarande kontrollerar är osäkert."
