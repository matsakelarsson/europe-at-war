# Svenska översättningar av katalogtexten (våg 8); stegtexterna kommer senare.
Insurgency in Northeast India: Upproren i nordöstra Indien
The many armed conflicts in India’s north-eastern states, a region of hills and valleys linked to the rest of India only by a narrow corridor and home to peoples with their own languages and histories. The Naga National Council, which declared Naga independence in 1947, took up arms in the mid-1950s, the longest of the insurgencies; it was followed by the Mizo rising of 1966, Meitei insurgents in Manipur, tribal groups in Tripura, the United Liberation Front of Asom (ULFA) and Bodo groups in Assam, and many smaller movements. The Indian army fought them under the Armed Forces (Special Powers) Act, and most of the conflicts ended in ceasefires and accords, though the Naga talks are unresolved and ULFA’s hard-line faction fights on from Myanmar. Since May 2023 ethnic violence between Meitei and Kuki-Zo in Manipur, and from 2026 between Kuki and Naga groups, has killed hundreds and displaced some 60,000 people. Last updated 27 November 2026.: De många väpnade konflikterna i Indiens nordöstra delstater, en region av berg och dalar som bara genom en smal korridor är förbunden med resten av Indien och som är hem för folk med egna språk och egen historia. Naga National Council, som utropade nagafolkets självständighet 1947, grep till vapen i mitten av 1950-talet, och detta är det längsta av upproren; därefter följde mizoupproret 1966, meiteiska rebeller i Manipur, stamgrupper i Tripura, Asoms förenade befrielsefront (ULFA) och bodogrupper i Assam samt många mindre rörelser. Den indiska armén bekämpade dem med stöd av Armed Forces (Special Powers) Act, och de flesta konflikterna slutade med eldupphör och avtal, även om nagaförhandlingarna är olösta och ULFA:s hårdföra falang fortsätter kampen från Myanmar. Sedan maj 2023 har etniskt våld mellan meiteier och kuki-zo i Manipur, och från 2026 mellan kuki- och nagagrupper, dödat hundratals och fördrivit omkring 60 000 människor. Senast uppdaterad 27 november 2026.
