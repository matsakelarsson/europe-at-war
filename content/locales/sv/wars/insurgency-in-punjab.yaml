Insurgency in Punjab: Upproret i Punjab
? The armed movement of Sikh militants for an independent Sikh state, Khalistan, in the Indian state of Punjab, and its suppression. It grew out of the Akali Dal’s campaign for more autonomy for Punjab and the rise of the preacher Jarnail Singh Bhindranwale, who with armed followers made the Golden Temple in Amritsar, the holiest shrine of Sikhism, his base. In June 1984 Prime Minister Indira Gandhi sent the army into the temple in Operation Blue Star, killing Bhindranwale and many militants and pilgrims. In October she was killed by two Sikh bodyguards, and mobs killed thousands of Sikhs in Delhi and other cities. Militant groups then waged a guerrilla war in Punjab, killing thousands of civilians, many of them Hindus and Sikhs who opposed them, and Sikh militants abroad bombed an Air India airliner in 1985, killing 329 people. The police under K. P. S. Gill crushed the insurgency in 1992–1993, with mass arrests and killings of suspects in staged encounters. The killing of Chief Minister Beant Singh in 1995 was its last major attack. About 21,000 people were killed by official figures.
: Sikhiska militanters väpnade rörelse för en självständig sikhisk stat, Khalistan, i den indiska delstaten Punjab, och dess undertryckande. Den växte fram ur Akali Dals kampanj för större självstyre för Punjab och predikanten Jarnail Singh Bhindranwales uppgång; med beväpnade anhängare gjorde han Gyllene templet i Amritsar, sikhismens heligaste helgedom, till sin bas. I juni 1984 sände premiärminister Indira Gandhi in armén i templet i Operation Blue Star, varvid Bhindranwale och många militanta och pilgrimer dödades. I oktober dödades hon av två sikhiska livvakter, och mobbar dödade tusentals sikher i Delhi och andra städer. Militanta grupper förde därefter ett gerillakrig i Punjab och dödade tusentals civila, många av dem hinduer och sikher som motsatte sig dem, och sikhiska militanter utomlands sprängde ett trafikflygplan från Air India 1985, varvid 329 människor dödades. Polisen under K. P. S. Gill krossade upproret 1992–1993, med massarresteringar och dödande av misstänkta i fingerade eldstrider. Mordet på chefsministern Beant Singh 1995 var rörelsens sista stora attack. Omkring 21 000 människor dödades enligt officiella siffror.
