# Svenska översättningar av katalogtexten (våg 12); stegtexterna kommer senare.
Insurgency in the Maghreb: Upprorsrörelsen i Maghreb
? "Last updated 27 November 2026. The jihadist insurgency in Algeria and its neighbours that outlived the Algerian Civil War. Its core was the Salafist Group for Preaching and Combat (GSPC), founded in 1998 by Hassan Hattab and other commanders who broke with the Armed Islamic Group (GIA) over its massacres of civilians and who refused the amnesty of 1999. From the mountains of Kabylia and eastern Algeria it kept up ambushes of soldiers and police, while its Saharan units under Amari Saïfi and Mokhtar Belmokhtar lived from smuggling and from kidnapping Europeans, starting with 32 tourists seized in 2003, and in June 2005 killed 15 Mauritanian soldiers at Lemgheity. Under Abdelmalek Droukdel the GSPC pledged allegiance to al-Qaeda and in January 2007 renamed itself al-Qaeda in the Islamic Maghreb (AQIM). It then turned to suicide bombings in Algiers: on 11 April 2007 against the government palace and a police station (33 dead), and on 11 December 2007 against the Constitutional Council and the UN offices (41 dead, 17 of them UN staff). In Morocco, bombings in Casablanca on 16 May 2003 killed 33 people and the twelve bombers, and a bomb in a Marrakesh café killed 17 in 2011; in Tunisia a truck bomb at the El Ghriba synagogue on Djerba killed 19 in 2002. Driven out of most of northern Algeria by the army, AQIM moved its weight south into the Sahel, where its fighters took part in the war in Mali from 2012 and joined JNIM in 2017. In January 2013 Belmokhtar’s breakaway group seized the Tiguentourine gas plant near In Amenas; when the Algerian army stormed it, 40 hostages, almost all foreign workers, and 29 attackers died. After the Tunisian revolution, AQIM’s Okba Ibn Nafaa Brigade fought the Tunisian army on Mount Chambi near Kasserine from December 2012, and gunmen loyal to the Islamic State killed 22 people at the Bardo museum in Tunis and 38 tourists on the beach at Sousse in 2015, and attacked Ben Guerdane from Libya in March 2016. French troops killed Droukdel in northern Mali in June 2020; his successor was Abu Ubaidah Yusuf al-Annabi. By 2026 attacks in Algeria, Tunisia and Morocco had become rare, though the Algerian army still reported clashes and killings of militants in the mountains each year, as in Tébessa in March 2026, and Tunisian forces still hunted small groups near the Algerian border; AQIM’s main strength lay in the Sahel."
: "Senast uppdaterad 27 november 2026. Den jihadistiska upprorsrörelse i Algeriet och grannländerna som levde vidare efter det algeriska inbördeskriget. Dess kärna var Salafistiska gruppen för predikan och strid (GSPC), som grundades 1998 av Hassan Hattab och andra befälhavare som hade brutit med Väpnade islamiska gruppen (GIA) på grund av dess massakrer på civila och som vägrade godta amnestin 1999. Från bergen i Kabylien och östra Algeriet fortsatte den att lägga bakhåll för soldater och poliser, medan dess saharaförband under Amari Saïfi och Mokhtar Belmokhtar levde på smuggling och på kidnappningar av européer, som inleddes med 32 turister som fördes bort 2003, och i juni 2005 dödade 15 mauretanska soldater vid Lemgheity. Under Abdelmalek Droukdel svor GSPC trohet mot al-Qaida och bytte i januari 2007 namn till al-Qaida i islamiska Maghreb (AQIM). Därefter övergick den till självmordsattentat i Alger: den 11 april 2007 mot regeringspalatset och en polisstation (33 döda) och den 11 december 2007 mot konstitutionsrådet och FN:s kontor (41 döda, av dem 17 FN-anställda). I Marocko dödade bombattentat i Casablanca den 16 maj 2003 33 människor och de tolv attentatsmännen, och en bomb på ett kafé i Marrakech dödade 17 människor 2011; i Tunisien dödade en lastbilsbomb vid El Ghriba-synagogan på Djerba 19 människor 2002. Sedan armén hade drivit ut AQIM ur större delen av norra Algeriet flyttade rörelsen sin tyngdpunkt söderut till Sahel, där dess kämpar deltog i kriget i Mali från 2012 och anslöt sig till JNIM 2017. I januari 2013 intog Belmokhtars utbrytargrupp gasanläggningen Tiguentourine nära In Amenas; när den algeriska armén stormade den dog 40 personer ur gisslan, nästan alla utländska arbetare, och 29 angripare. Efter den tunisiska revolutionen bekämpade AQIM:s Okba Ibn Nafaa-brigad den tunisiska armén på berget Chambi nära Kasserine från december 2012, och beväpnade män lojala mot Islamiska staten dödade 22 människor på Bardomuseet i Tunis och 38 turister på stranden i Sousse 2015 och angrep Ben Guerdane från Libyen i mars 2016. Franska trupper dödade Droukdel i norra Mali i juni 2020; hans efterträdare blev Abu Ubaidah Yusuf al-Annabi. År 2026 hade attentat i Algeriet, Tunisien och Marocko blivit sällsynta, även om den algeriska armén fortfarande varje år rapporterade sammandrabbningar och att militanta dödats i bergen, som i Tébessa i mars 2026, och tunisiska styrkor fortfarande jagade små grupper nära den algeriska gränsen; AQIM:s huvudsakliga styrka fanns i Sahel."
