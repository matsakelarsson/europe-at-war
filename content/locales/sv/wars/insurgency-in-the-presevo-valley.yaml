The UÇPMB wanted the three municipalities, which have large Albanian populations (a majority in Preševo and Bujanovac), joined to Kosovo; Belgrade called it a terrorist group. Casualty and strength figures vary between sources, and the date of the Končulj agreement is given as both 20 and 21 May 2001.: UÇPMB ville att de tre kommunerna, som har en stor albansk befolkning (en majoritet i Preševo och Bujanovac), skulle förenas med Kosovo; Belgrad kallade gruppen en terroristorganisation. Uppgifterna om förluster och styrkor varierar mellan källorna, och Končuljavtalet dateras både till den 20 och den 21 maj 2001.
Many former UÇPMB fighters went on to join the National Liberation Army in the 2001 insurgency in Macedonia. Low-level incidents continued in the valley for years afterwards.: Många tidigare UÇPMB-kämpar anslöt sig senare till Nationella befrielsearmén under upproret i Makedonien 2001. Mindre incidenter fortsatte i dalen i flera år efteråt.
