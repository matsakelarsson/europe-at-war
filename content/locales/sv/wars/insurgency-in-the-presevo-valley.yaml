Insurgency in the Preševo Valley: Upproret i Preševodalen
An ethnic Albanian insurgency in the municipalities of Preševo, Bujanovac and Medveđa in southern Serbia, on the border of Kosovo, after the Kosovo War. The Liberation Army of Preševo, Medveđa and Bujanovac (UÇPMB), many of whose fighters came from the disbanded Kosovo Liberation Army, attacked Serbian police from the 5-kilometre Ground Safety Zone along the boundary, where the Kumanovo Agreement allowed Yugoslav forces to carry only light arms. After the fall of Slobodan Milošević in October 2000, Belgrade offered the Čović plan of amnesty, Albanian recruits for the police and economic development, and NATO let the Yugoslav Army return to the zone sector by sector from March 2001. Under the Končulj agreement of May 2001 the UÇPMB disarmed and disbanded; some 400 fighters gave themselves up to KFOR, and by 1 June the army held the whole zone. Fewer than a hundred people were killed, among them about 18 Serbian police and soldiers and 15 civilians.: Ett etniskt albanskt uppror i kommunerna Preševo, Bujanovac och Medveđa i södra Serbien, vid gränsen mot Kosovo, efter Kosovokriget. Befrielsearmén för Preševo, Medveđa och Bujanovac (UÇPMB), vars kämpar till stor del kom från den upplösta Kosovos befrielsearmé, angrep serbisk polis från den fem kilometer breda säkerhetszonen (Ground Safety Zone) längs gränslinjen, där Kumanovoavtalet endast tillät jugoslaviska styrkor att bära lätta vapen. Efter Slobodan Miloševićs fall i oktober 2000 erbjöd Belgrad Čovićplanen med amnesti, albanska rekryter till polisen och ekonomisk utveckling, och Nato lät från mars 2001 den jugoslaviska armén återvända till zonen sektor för sektor. Enligt Končuljavtalet i maj 2001 avväpnades och upplöstes UÇPMB; omkring 400 kämpar överlämnade sig till KFOR, och den 1 juni kontrollerade armén hela zonen. Färre än hundra människor dödades, bland dem omkring 18 serbiska poliser och soldater och 15 civila.
