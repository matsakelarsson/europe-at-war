# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
Internal conflict in Myanmar: Den interna konflikten i Myanmar
? The armed conflicts that have gone on in Myanmar (Burma) almost without pause since independence, among the longest in the world. Within months of independence in January 1948 the Communist Party of Burma and then the Karen National Union took up arms, and for a time in 1949 the government held little more than Rangoon. Kuomintang troops driven out of China occupied much of the Shan State in the 1950s. From the 1960s, under the military rule of Ne Win, the army fought the communists, who held a base area on the Chinese border until 1989, and a growing number of ethnic armies, Kachin, Karen, Karenni, Shan, Mon and others, seeking independence or a federal union. Ceasefires from 1989 ended much of the fighting but not the conflict. The army crushed the democracy uprising of 1988 and the protests of 2007, and in 2016–2017 drove more than 700,000 Rohingya into Bangladesh in operations that UN investigators said should be examined as genocide, and that the International Court of Justice found in November 2026 to have been genocide. The coup of 1 February 2021 turned the conflict into a nationwide civil war between the military government and the resistance of the National Unity Government and the ethnic armies, which made large gains in 2023–2024; the army won back ground in 2025–2026. Hundreds of thousands have been killed since 1948, and millions displaced.
: De väpnade konflikter som har pågått i Myanmar (Burma) nästan utan avbrott sedan självständigheten, bland de längsta i världen. Inom några månader efter självständigheten i januari 1948 grep Burmas kommunistiska parti och därefter Karen National Union till vapen, och en tid 1949 kontrollerade regeringen inte mycket mer än Rangoon. Kuomintangtrupper som hade drivits ut ur Kina ockuperade stora delar av Shanstaten på 1950-talet. Från 1960-talet, under Ne Wins militärstyre, bekämpade armén kommunisterna, som hade ett basområde vid den kinesiska gränsen fram till 1989, och ett växande antal etniska arméer – bland kachiner, karener, karennier, shaner, moner och andra – som kämpade för självständighet eller en federal union. Vapenvilor från 1989 gjorde slut på en stor del av striderna men inte på konflikten. Armén krossade demokratiupproret 1988 och protesterna 2007, och 2016–2017 drev den över 700 000 rohingyer till Bangladesh i operationer som FN:s utredare ansåg borde granskas som folkmord, och som Internationella domstolen i november 2026 fann vara folkmord. Kuppen den 1 februari 2021 förvandlade konflikten till ett landsomfattande inbördeskrig mellan militärregeringen och motståndet från Nationella enhetsregeringen och de etniska arméerna, som gjorde stora vinster 2023–2024; armén återtog mark 2025–2026. Hundratusentals människor har dödats sedan 1948, och miljoner har drivits på flykt.
