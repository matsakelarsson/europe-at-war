# Svenska översättningar av katalogtexten (våg 13); stegtexterna kommer senare.
Armed struggle against apartheid: Den väpnade kampen mot apartheid
? "The armed struggle of South Africa’s liberation movements against apartheid, and the state’s war against them at home and in neighbouring countries, from the Sharpeville massacre to the suspension of armed struggle in 1990. On 21 March 1960 police at Sharpeville fired on a crowd protesting against the pass laws, killing 69 people; the government banned the African National Congress (ANC) and the Pan Africanist Congress (PAC) on 8 April. Turning to violence after half a century of non-violent protest, ANC and Communist Party leaders, among them Nelson Mandela, formed Umkhonto we Sizwe (MK, the Spear of the Nation) in June 1961; it began a campaign of sabotage against installations on 16 December 1961, while the PAC’s Poqo killed whites and others it saw as collaborators. The police broke both: the leaders of MK were arrested at Liliesleaf Farm in Rivonia on 11 July 1963, and on 12 June 1964 Mandela and seven others were sentenced to life imprisonment. From exile in Tanzania, Zambia and later Angola, MK tried to infiltrate fighters, with ZIPRA in Rhodesia in 1967–1968. The Soweto uprising of 16 June 1976, in which police killed at least 176 people and by some estimates several hundred, sent thousands of young people abroad to join MK, which from 1977 attacked police stations, the Sasol oil-from-coal plants (1980), the Koeberg nuclear power station (1982) and, increasingly, places where civilians died, as in the Church Street car bomb in Pretoria on 20 May 1983 (19 killed). South Africa’s forces raided ANC houses and offices in Matola in Mozambique (1981), Maseru in Lesotho (1982, 42 killed), Gaborone in Botswana (1985, 12 killed) and elsewhere, and its death squads killed activists at home and abroad. From 1984 the townships rose in revolt under the United Democratic Front; the government declared states of emergency in 1985 and 1986, deployed the army in the townships and detained tens of thousands of people, and a bitter conflict between the ANC and Inkatha grew in Natal. President F. W. de Klerk lifted the bans on 2 February 1990 and released Mandela on 11 February; in the Pretoria Minute of 6 August 1990 the ANC suspended its armed struggle. Political violence, much of it between the ANC and Inkatha and fuelled by elements of the security forces, killed some 14,000 more people before the elections of April 1994; a widely cited estimate puts the dead of political violence between 1948 and 1994 at about 21,000."
: "Den väpnade kamp som Sydafrikas befrielserörelser förde mot apartheid, och statens krig mot dem i landet och i grannländerna, från Sharpevillemassakern till att den väpnade kampen ställdes in 1990. Den 21 mars 1960 öppnade polisen i Sharpeville eld mot en folkmassa som protesterade mot passlagarna och dödade 69 människor; regeringen förbjöd African National Congress (ANC) och Pan Africanist Congress (PAC) den 8 april. Efter ett halvt sekel av ickevåldsprotester övergick ledare för ANC och kommunistpartiet, bland dem Nelson Mandela, till våld och bildade Umkhonto we Sizwe (MK, Nationens spjut) i juni 1961; organisationen inledde en sabotagekampanj mot anläggningar den 16 december 1961, medan PAC:s Poqo dödade vita och andra som den betraktade som kollaboratörer. Polisen krossade båda: MK:s ledare greps på Liliesleaf Farm i Rivonia den 11 juli 1963, och den 12 juni 1964 dömdes Mandela och sju andra till livstids fängelse. Från exilen i Tanzania, Zambia och senare Angola försökte MK infiltrera krigare, 1967–1968 tillsammans med ZIPRA i Rhodesia. Sowetoupproret den 16 juni 1976, då polisen dödade minst 176 människor och enligt vissa uppskattningar flera hundra, fick tusentals unga människor att lämna landet för att ansluta sig till MK, som från 1977 angrep polisstationer, Sasols anläggningar för framställning av olja ur kol (1980), kärnkraftverket Koeberg (1982) och i ökande grad platser där civila dog, som vid bilbomben på Church Street i Pretoria den 20 maj 1983 (19 döda). Sydafrikas styrkor gjorde räder mot ANC:s hus och kontor i Matola i Moçambique (1981), Maseru i Lesotho (1982, 42 döda), Gaborone i Botswana (1985, 12 döda) och på andra platser, och dess dödsskvadroner dödade aktivister i landet och utomlands. Från 1984 reste sig de svarta förstäderna (townships) i revolt under United Democratic Front; regeringen utlyste undantagstillstånd 1985 och 1986, satte in armén i förstäderna och internerade tiotusentals människor, och en bitter konflikt mellan ANC och Inkatha växte fram i Natal. President F. W. de Klerk hävde förbuden den 2 februari 1990 och frigav Mandela den 11 februari; i Pretoriaprotokollet den 6 augusti 1990 ställde ANC in sin väpnade kamp. Politiskt våld, till stor del mellan ANC och Inkatha och underblåst av element inom säkerhetsstyrkorna, dödade ytterligare omkring 14 000 människor före valet i april 1994; en ofta citerad uppskattning anger antalet döda i politiskt våld mellan 1948 och 1994 till omkring 21 000."
