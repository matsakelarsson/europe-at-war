# Svenska översättningar av katalogtexten (våg 13); stegtexterna kommer senare.
Invasion of Anjouan: Invasionen av Anjouan
? "The amphibious landing by Comoran and African Union troops on the island of Anjouan (Nzwani) on 25 March 2008, code-named Operation Democracy in Comoros, which removed Colonel Mohamed Bacar, the island’s president, who had refused to leave office. Since independence from France in 1975 the Comoros had seen more than 20 coups and attempted coups, and Anjouan had broken away once before, in 1997. Under the 2001 constitution each island of the Union of the Comoros had its own president; in 2007 Bacar refused to step down at the end of his term, held his own election in June, claimed 90 per cent of the vote against the objections of the federal government and the AU, and declared Anjouan independent in July. After sanctions and talks failed, the AU backed military action. A small Comoran landing near Domoni in mid-March withdrew after a brief clash, and on 19 March a French police helicopter from Mayotte crashed off Anjouan on an unauthorised flight, which led to accusations that France was protecting Bacar. On the morning of 24 March about 1,500 troops sailed from Fomboni on Mohéli: Comoran soldiers with AU contingents from Tanzania, Sudan and Senegal, carried in part by French aircraft and supported by Libya and the United States. About 450 landed at dawn on 25 March on the north side of Anjouan Bay near Ouani, took the airport after some fighting and went on to the capital, Mutsamudu, the port and the second town, Domoni; much of the population welcomed them. Casualty figures were never clearly reported. Bacar escaped by speedboat to the French island of Mayotte on 26 March; France refused him asylum on 15 May but would not hand him over to the Comoros because of the risk of persecution, and in July 2008 flew him from Réunion to Benin. Moussa Toybou won the new island election held in June 2008."
: "Den amfibiska landstigning som komoriska trupper och trupper från Afrikanska unionen genomförde på ön Anjouan (Nzwani) den 25 mars 2008, med kodnamnet Operation Democracy in Comoros, och som avlägsnade överste Mohamed Bacar, öns president, som hade vägrat lämna sitt ämbete. Sedan självständigheten från Frankrike 1975 hade Komorerna upplevt mer än 20 statskupper och kuppförsök, och Anjouan hade brutit sig ut en gång tidigare, 1997. Enligt 2001 års författning hade varje ö i Unionen Komorerna en egen president; 2007 vägrade Bacar avgå vid slutet av sin mandatperiod, höll ett eget val i juni, gjorde anspråk på 90 procent av rösterna trots invändningar från den federala regeringen och Afrikanska unionen och förklarade Anjouan självständigt i juli. Sedan sanktioner och förhandlingar misslyckats ställde sig Afrikanska unionen bakom militära åtgärder. En liten komorisk landstigning nära Domoni i mitten av mars drogs tillbaka efter en kort sammandrabbning, och den 19 mars störtade en fransk polishelikopter från Mayotte i havet utanför Anjouan under en otillåten flygning, vilket ledde till anklagelser om att Frankrike skyddade Bacar. På morgonen den 24 mars avseglade omkring 1 500 soldater från Fomboni på Mohéli: komoriska soldater med kontingenter från Afrikanska unionen från Tanzania, Sudan och Senegal, delvis transporterade av franska flygplan och med stöd från Libyen och USA. Omkring 450 landsteg i gryningen den 25 mars på norra sidan av Anjouanbukten nära Ouani, intog flygplatsen efter vissa strider och fortsatte till huvudstaden Mutsamudu, hamnen och den näst största staden, Domoni; en stor del av befolkningen välkomnade dem. Förlustsiffrorna redovisades aldrig tydligt. Bacar flydde med en snabbgående motorbåt till den franska ön Mayotte den 26 mars; Frankrike vägrade honom asyl den 15 maj men ville inte utlämna honom till Komorerna på grund av risken för förföljelse, och i juli 2008 flög man honom från Réunion till Benin. Moussa Toybou vann det nya val till öns presidentpost som hölls i juni 2008."
