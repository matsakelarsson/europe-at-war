# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
Western Design and the conquest of Jamaica: Western Design och erövringen av Jamaica
? Oliver Cromwell’s attack on Spain’s Caribbean empire, the Western Design, and the five-year war for Jamaica that followed. A fleet under Admiral William Penn and an army under General Robert Venables, swelled in Barbados and the Leeward Islands to some 7,000 to 8,000 poorly trained men, landed on Hispaniola in April 1655 to take Santo Domingo, but the army was routed by a few hundred Spanish militia lancers and lost about a thousand men. Unwilling to return empty-handed, the commanders sailed for lightly defended Jamaica, where they landed in May 1655 and forced Governor Juan Ramírez de Arellano to capitulate. The Spanish colonists had freed many of the people they held in slavery, who formed free communities in the mountains, and under Francisco de Proenza and then Cristóbal Arnaldo de Ysassi the Spanish fought a guerrilla war alongside these maroons, led by Juan de Bolas and Juan de Serras. Disease killed most of the English troops, but Edward D’Oyley defeated Spanish landings from Cuba at Ocho Rios in 1657 and Rio Nuevo in 1658, and in 1660 won over Juan de Bolas, after which Ysassi left the island. Spain recognised English rule in Jamaica in the Treaty of Madrid of 1670.
: Oliver Cromwells angrepp på Spaniens karibiska välde, Western Design, och det femåriga krig om Jamaica som följde. En flotta under amiral William Penn och en armé under general Robert Venables, som på Barbados och Leewardöarna hade vuxit till omkring 7 000 till 8 000 dåligt utbildade man, landsteg på Hispaniola i april 1655 för att inta Santo Domingo, men armén drevs på flykten av några hundra spanska lansiärer ur milisen och förlorade omkring tusen man. Ovilliga att återvända tomhänta seglade befälhavarna till det svagt försvarade Jamaica, där de landsteg i maj 1655 och tvingade guvernören Juan Ramírez de Arellano att kapitulera. De spanska kolonisterna hade frigett många av dem de höll som slavar, och dessa bildade fria samhällen i bergen; under Francisco de Proenza och sedan Cristóbal Arnaldo de Ysassi förde spanjorerna ett gerillakrig tillsammans med dessa maroner, som leddes av Juan de Bolas och Juan de Serras. Sjukdomar dödade de flesta av de engelska soldaterna, men Edward D’Oyley slog tillbaka spanska landstigningar från Kuba vid Ocho Rios 1657 och Rio Nuevo 1658 och vann 1660 över Juan de Bolas på sin sida, varefter Ysassi lämnade ön. Spanien erkände det engelska styret över Jamaica i fördraget i Madrid 1670.
