Campo Tenese, Gaeta and Maida: Campo Tenese, Gaeta och Maida
February – November 1806: februari – november 1806
Part of the War of the Third Coalition, told with the Napoleonic Wars. Ferdinand ruled Naples and Sicily as two kingdoms until 1816; the map keeps the Kingdom of Naples as one polity under its Bourbon and then its Napoleonic kings.: En del av tredje koalitionskriget, som här behandlas tillsammans med Napoleonkrigen. Ferdinand styrde Neapel och Sicilien som två kungariken fram till 1816; kartan visar Kungariket Neapel som en enda statsbildning under dess bourbonska och därefter napoleonska kungar.
The guerrilla war in Calabria lasted until about 1811. Atrocities on both sides were common, and numbers of dead are unknown.: Gerillakriget i Kalabrien pågick till omkring 1811. Grymheter var vanliga på båda sidor, och antalet döda är okänt.
