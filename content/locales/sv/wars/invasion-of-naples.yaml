Neapolitan and British success: Neapolitanska och brittiska framgångar
In 1805 Ferdinand IV of Naples promised Napoleon to stay neutral, and then let some 20,000 British and Russian troops land at Naples. After Austerlitz the Russians sailed away and the British withdrew to Sicily, and on 27 December Napoleon declared that the Bourbon dynasty of Naples had ceased to reign. On 8 February 1806 a French army of more than 40,000 men under Marshal Masséna crossed the border. Ferdinand had already left for Palermo. Masséna entered Naples on 14 February, and on 9 March General Reynier routed the remains of the Neapolitan army in driving snow at Campo Tenese in the Calabrian mountains. Napoleon proclaimed his brother Joseph king of Naples on 30 March. But the fortress of Gaeta, under the hard-drinking Prince Louis of Hesse-Philippsthal, refused to surrender, and in Calabria, plunder and rape by French troops set off a peasant rising.: År 1805 lovade Ferdinand IV av Neapel Napoleon att förbli neutral, men lät sedan omkring 20 000 brittiska och ryska soldater landstiga i Neapel. Efter Austerlitz seglade ryssarna bort och britterna drog sig tillbaka till Sicilien, och den 27 december förklarade Napoleon att den bourbonska dynastin i Neapel hade upphört att regera. Den 8 februari 1806 gick en fransk armé på mer än 40 000 man under marskalk Masséna över gränsen. Ferdinand hade redan rest till Palermo. Masséna tågade in i Neapel den 14 februari, och den 9 mars slog general Reynier resterna av den neapolitanska armén på flykten i yrande snö vid Campo Tenese i de kalabriska bergen. Napoleon utropade sin bror Joseph till kung av Neapel den 30 mars. Men fästningen Gaeta, under den dryckesglade prins Ludvig av Hessen-Philippsthal, vägrade att kapitulera, och i Kalabrien utlöste de franska truppernas plundring och våldtäkter ett bondeuppror.
On 1 July a British force of about 5,200 men under General John Stuart landed in the Gulf of Sant’Eufemia, and on 4 July it beat Reynier’s slightly larger force on the plain below Maida, with heavy French losses. But on 18 July Gaeta, its commander wounded and its walls breached, surrendered after a siege of nearly five months, freeing some 10,000 French troops. Stuart’s men took the French posts on the coast and went back to Sicily, leaving garrisons at Reggio and Scilla that held out until 1808. The French burned villages that resisted, and the guerrillas tortured and killed prisoners. On 8 August Masséna stormed Lauria, a guerrilla stronghold, and gave no quarter. The guerrilla leader Michele Pezza, known as Fra Diavolo, was caught and hanged in Naples in November 1806.: Den 1 juli landsteg en brittisk styrka på omkring 5 200 man under general John Stuart i Sant’Eufemiabukten, och den 4 juli besegrade den Reyniers något större styrka på slätten nedanför Maida, med svåra franska förluster. Men den 18 juli kapitulerade Gaeta, vars befälhavare var sårad och vars murar var genombrutna, efter en belägring på nästan fem månader, vilket frigjorde omkring 10 000 franska soldater. Stuarts män intog de franska posteringarna längs kusten och återvände till Sicilien, men lämnade garnisoner i Reggio och Scilla som höll stånd till 1808. Fransmännen brände byar som gjorde motstånd, och gerillan torterade och dödade fångar. Den 8 augusti stormade Masséna Lauria, ett gerillafäste, och gav ingen pardon. Gerillaledaren Michele Pezza, känd som Fra Diavolo, tillfångatogs och hängdes i Neapel i november 1806.
