Naples: Neapel
Masséna’s troops entered the city without a fight, and Joseph made his entry the next day. Ferdinand had left behind some 200 cannon and large stores of powder.: Massénas trupper tågade in i staden utan strid, och Joseph höll sitt intåg dagen därpå. Ferdinand hade lämnat efter sig omkring 200 kanoner och stora krutförråd.
Gaeta: Gaeta
26 February – 18 July 1806: 26 februari – 18 juli 1806
Hesse shouted to the besiegers that Gaeta was not Ulm. The garrison, supplied by sea, held out until heavy French guns breached the walls, and was allowed to sail to Sicily.: Hessen ropade till belägrarna att Gaeta inte var Ulm. Garnisonen, som försörjdes sjövägen, höll stånd tills tunga franska kanoner bröt igenom murarna, och fick sedan segla till Sicilien.
Battle of Campo Tenese: Slaget vid Campo Tenese
9 March 1806: 9 mars 1806
French light infantry climbed the cliffs on the Neapolitan flank. Some 2,000 Neapolitans were captured, and the army broke up.: Franskt lätt infanteri klättrade uppför klipporna på den neapolitanska flanken. Omkring 2 000 neapolitaner tillfångatogs, och armén upplöstes.
4 July 1806: 4 juli 1806
Stuart’s infantry, in lines two deep, broke Reynier’s attack. The victory gave its name to Maida Vale in London.: Stuarts infanteri, uppställt i linjer två led djupa, slog tillbaka Reyniers anfall. Segern gav namn åt Maida Vale i London.
Lauria: Lauria
8 August 1806: 8 augusti 1806
The guerrilla bands that had gathered here were almost wiped out in a fight without quarter, and the town was sacked.: De gerillaband som samlats här nästan utplånades i en strid utan pardon, och staden plundrades.
Scilla and Reggio: Scilla och Reggio
July 1806 – February 1808: juli 1806 – februari 1808
Taken from the French in July 1806, these two places on the Strait of Messina were held by British garrisons for a year and a half.: Dessa två platser vid Messinasundet togs från fransmännen i juli 1806 och hölls av brittiska garnisoner i ett och ett halvt år.
