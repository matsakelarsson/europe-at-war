French invasion of Naples: Franska invasionen av Neapel
The French conquest of the mainland Kingdom of Naples in 1806, after King Ferdinand IV had broken his neutrality and let British and Russian troops land. Marshal Masséna’s army took Naples in February and crushed the Neapolitan army at Campo Tenese, and Napoleon’s brother Joseph became king. Gaeta held out until July, a British force won at Maida, and a savage peasant war in Calabria went on for years, but Ferdinand kept only Sicily.: Den franska erövringen av fastlandsdelen av Kungariket Neapel 1806, sedan kung Ferdinand IV brutit sin neutralitet och låtit brittiska och ryska trupper landstiga. Marskalk Massénas armé intog Neapel i februari och krossade den neapolitanska armén vid Campo Tenese, och Napoleons bror Joseph blev kung. Gaeta höll stånd till juli, en brittisk styrka segrade vid Maida och ett grymt bondekrig i Kalabrien pågick i flera år, men Ferdinand behöll endast Sicilien.
