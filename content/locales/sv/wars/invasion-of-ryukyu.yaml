# Svenska översättningar av katalogtexten (våg 10); stegtexterna kommer senare.
Invasion of Ryukyu: Invasionen av Ryūkyū
? The conquest of the Ryukyu Kingdom by the Shimazu lords of Satsuma in the spring of 1609, with the permission of the Tokugawa shogunate. King Shō Nei had ignored repeated demands from Satsuma and from Tokugawa Ieyasu that he send an embassy to thank Ieyasu for returning shipwrecked Ryukyuan sailors and acknowledge the new regime, and Satsuma, deep in debt after the Korean wars, wanted a share of Ryukyu’s trade with China. About 3,000 Satsuma soldiers in some 100 ships under Kabayama Hisataka and Hirata Masumune sailed from Yamakawa in early April. They took Amami Ōshima without resistance, overcame armed islanders on Tokunoshima and passed Okinoerabu, then landed at Unten on Okinawa, burned the deserted castle of Nakijin and marched on the capital, Shuri, from the west coast while their ships forced the harbour of Naha. Shō Nei surrendered in early May. He was taken to Kagoshima, brought before Ieyasu at Sunpu and the shogun Hidetada at Edo in 1610, and in 1611 made to swear oaths of loyalty to the Shimazu and accept the Fifteen Injunctions, which put Ryukyu’s foreign trade under Satsuma control. Satsuma annexed the Amami Islands and took a yearly tribute, while the kingdom kept its king, its government and its tribute relations with China, which Satsuma and Ryukyu hid from the Chinese court. This dual subordination lasted until Japan annexed Ryukyu as Okinawa Prefecture in 1879.
: Erövringen av Ryūkyūriket, som genomfördes av Shimazu, herrarna över Satsuma, våren 1609 med Tokugawashogunatets tillstånd. Kung Shō Nei hade struntat i upprepade krav från Satsuma och från Tokugawa Ieyasu på att han skulle sända en ambassad för att tacka Ieyasu för att han återlämnat skeppsbrutna sjömän från Ryūkyū och erkänna den nya regimen, och Satsuma, djupt skuldsatt efter krigen i Korea, ville ha en andel av Ryūkyūs handel med Kina. Omkring 3 000 soldater från Satsuma i ett hundratal fartyg under Kabayama Hisataka och Hirata Masumune avseglade från Yamakawa i början av april. De intog Amami Ōshima utan motstånd, övervann beväpnade öbor på Tokunoshima och passerade Okinoerabu, landsteg sedan vid Unten på Okinawa, brände den övergivna borgen Nakijin och marscherade mot huvudstaden Shuri från västkusten medan deras fartyg forcerade hamnen i Naha. Shō Nei kapitulerade i början av maj. Han fördes till Kagoshima, ställdes 1610 inför Ieyasu i Sunpu och shogunen Hidetada i Edo och tvingades 1611 att svära trohetseder till Shimazu och godta de femton påbuden, som ställde Ryūkyūs utrikeshandel under Satsumas kontroll. Satsuma annekterade Amamiöarna och tog ut en årlig tribut, medan riket behöll sin kung, sin regering och sina tributförbindelser med Kina, som Satsuma och Ryūkyū dolde för det kinesiska hovet. Denna dubbla underordning varade tills Japan annekterade Ryūkyū som Okinawa prefektur 1879.
