# Svenska översättningar av katalogtexten (våg 10); stegtexterna kommer senare.
Toyotomi Invasion of Shikoku: Toyotomis invasion av Shikoku
? Hideyoshi’s conquest of Shikoku from Chōsokabe Motochika. From his home province of Tosa, Motochika had spent the 1570s and early 1580s overrunning Awa, Sanuki and Iyo; Oda Nobunaga had been about to send an army against him when he was killed in 1582, and in 1584 Motochika sided with Tokugawa Ieyasu and Oda Nobukatsu against Hideyoshi. By the spring of 1585, with the surrender of the Kōno of Iyo, he held nearly all of the island. Talks broke down over how much he would give up, and in the sixth month of 1585 Hideyoshi, who was ill, sent his brother Hashiba Hidenaga in his place with an army put at about 113,000 men, carried over the Inland Sea in hundreds of ships. Hidenaga and Hideyoshi’s nephew Hidetsugu crossed by way of Awaji and landed in Awa with some 60,000; Ukita Hideie’s army of about 23,000 landed at Yashima in Sanuki; and the Mōri, now Hideyoshi’s allies, sent 25,000 to 40,000 under Kobayakawa Takakage and Kikkawa Motonaga to Iyo, where they stormed Takao castle and killed Kaneko Motoie, Motochika’s chief ally in the east of the province. Motochika, with 20,000 to 40,000 men, had made his headquarters at Hakuchi castle in the west of Awa, where the four provinces meet, but the invaders came from three sides at once. The castle of Ichinomiya in Awa held out against Hidenaga for weeks until he cut off its water, and other Chōsokabe strongholds fell. Motochika wanted to fight on, but his retainers persuaded him that it was hopeless, and in the seventh month (August 1585) he submitted, keeping Tosa only. Awa went to Hachisuka Iemasa, Sanuki to Sengoku Hidehisa and Sogō Masayasu, and Iyo to Kobayakawa Takakage. Hideyoshi had become imperial regent (kampaku) during the campaign; Motochika and his men served him in Kyushu the next year.
: Hideyoshis erövring av Shikoku från Chōsokabe Motochika. Från sin hemprovins Tosa hade Motochika under 1570-talet och det tidiga 1580-talet lagt under sig Awa, Sanuki och Iyo; Oda Nobunaga hade stått i begrepp att sända en armé mot honom när han dödades 1582, och 1584 ställde sig Motochika på Tokugawa Ieyasus och Oda Nobukatsus sida mot Hideyoshi. Våren 1585, när Kōnoklanen i Iyo hade kapitulerat, behärskade han nästan hela ön. Förhandlingarna bröt samman i frågan om hur mycket han skulle avstå, och i sjätte månaden 1585 sände Hideyoshi, som var sjuk, sin bror Hashiba Hidenaga i sitt ställe med en armé som uppges ha omfattat omkring 113 000 man och som fördes över Japanska innanhavet i hundratals fartyg. Hidenaga och Hideyoshis systerson Hidetsugu gick över via Awaji och landsteg i Awa med omkring 60 000 man; Ukita Hideies armé på omkring 23 000 man landsteg vid Yashima i Sanuki; och Mōriklanen, nu Hideyoshis bundsförvanter, sände 25 000 till 40 000 man under Kobayakawa Takakage och Kikkawa Motonaga till Iyo, där de stormade borgen Takao och dödade Kaneko Motoie, Motochikas främste bundsförvant i provinsens östra del. Motochika, med 20 000 till 40 000 man, hade förlagt sitt högkvarter till borgen Hakuchi i västra Awa, där de fyra provinserna möts, men angriparna kom från tre håll på en gång. Borgen Ichinomiya i Awa höll stånd mot Hidenaga i flera veckor tills han skar av dess vattentillförsel, och andra fästen som tillhörde Chōsokabe föll. Motochika ville fortsätta striden, men hans vasaller övertygade honom om att det var hopplöst, och i sjunde månaden (augusti 1585) underkastade han sig och fick behålla endast Tosa. Awa gick till Hachisuka Iemasa, Sanuki till Sengoku Hidehisa och Sogō Masayasu och Iyo till Kobayakawa Takakage. Hideyoshi hade blivit kejserlig regent (kampaku) under fälttåget; Motochika och hans män tjänade honom på Kyushu året därpå.
