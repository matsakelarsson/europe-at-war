# Svenska översättningar av katalogtexten (våg 10); stegtexterna kommer senare.
Soviet invasion of South Sakhalin: Sovjetunionens invasion av Södra Sachalin
? "The Soviet conquest of Karafuto, the Japanese southern half of Sakhalin, in the last weeks of the Second World War. Japan had held Sakhalin south of the 50th parallel since the Treaty of Portsmouth of 1905, and by 1945 nearly 400,000 Japanese, Koreans and indigenous people lived there. At Yalta the Allies had promised South Sakhalin to the Soviet Union, which declared war on Japan on 8 August 1945. On 11 August the 56th Rifle Corps of the Soviet 16th Army attacked across the border into the fortified zone at Koton, defended by the Japanese 88th Division. Fighting went on after Emperor Hirohito announced Japan’s surrender on 15 August: the Soviet command wanted the island taken quickly, as a step towards a landing on Hokkaido that Stalin called off on 22 August, and the Japanese 5th Area Army in Sapporo ordered the division to keep defending it. The Koton garrison held out until it was ordered to lay down its arms on 19 August; Soviet troops landed at Tōro on 16 August and at Maoka on 20 August, where many civilians died, among them nine telephone operators who took their own lives. Soviet aircraft bombed Toyohara, the capital, on 22 August, the day a ceasefire was signed, and Soviet submarines sank or damaged three ships carrying evacuees off Rumoi on Hokkaido. Toyohara was occupied on 24 August and Ōtomari on 25 August. Japanese civilians in Karafuto also killed Korean neighbours suspected of spying, most notoriously at Mizuho. About 76,000 to 80,000 people had escaped to Hokkaido before the Soviets closed the island; most of the remaining Japanese were repatriated in 1946–1949, while some 43,000 Koreans were left behind. The Soviet Union annexed South Sakhalin on 2 February 1946."
: "Den sovjetiska erövringen av Karafuto, Sachalins japanska södra halva, under andra världskrigets sista veckor. Japan hade innehaft Sachalin söder om 50:e breddgraden sedan freden i Portsmouth 1905, och 1945 bodde där nästan 400 000 japaner, koreaner och människor ur urfolken. I Jalta hade de allierade lovat Södra Sachalin till Sovjetunionen, som förklarade Japan krig den 8 augusti 1945. Den 11 augusti anföll sovjetiska 16:e arméns 56:e skyttekår över gränsen in i den befästa zonen vid Koton, som försvarades av japanska 88:e divisionen. Striderna fortsatte sedan kejsar Hirohito den 15 augusti hade tillkännagett Japans kapitulation: det sovjetiska befälet ville ta ön snabbt, som ett steg mot en landstigning på Hokkaido som Stalin avblåste den 22 augusti, och japanska 5:e områdesarmén i Sapporo beordrade divisionen att fortsätta försvaret. Garnisonen i Koton höll stånd tills den fick order att lägga ned vapnen den 19 augusti; sovjetiska trupper landsteg i Tōro den 16 augusti och i Maoka den 20 augusti, där många civila omkom, bland dem nio telefonister som tog sina egna liv. Sovjetiska flygplan bombade huvudstaden Toyohara den 22 augusti, samma dag som ett eldupphör undertecknades, och sovjetiska ubåtar sänkte eller skadade tre fartyg med evakuerade utanför Rumoi på Hokkaido. Toyohara besattes den 24 augusti och Ōtomari den 25 augusti. Japanska civila i Karafuto dödade också koreanska grannar som misstänktes för spioneri, mest ökänt i Mizuho. Omkring 76 000 till 80 000 människor hade tagit sig till Hokkaido innan sovjeterna stängde ön; de flesta av de kvarvarande japanerna repatrierades 1946–1949, medan omkring 43 000 koreaner lämnades kvar. Sovjetunionen annekterade Södra Sachalin den 2 februari 1946."
