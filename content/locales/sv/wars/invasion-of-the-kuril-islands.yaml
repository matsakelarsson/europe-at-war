# Svenska översättningar av katalogtexten (våg 10); stegtexterna kommer senare.
Soviet invasion of the Kuril Islands: Sovjetunionens invasion av Kurilerna
? The Soviet occupation of the Kuril Islands, the chain of volcanic islands between Kamchatka and Hokkaido, at the very end of the Second World War, and the expulsion of their Japanese inhabitants. The northern Kurils had been Japanese since the Treaty of Saint Petersburg of 1875, the southern islands since the Treaty of Shimoda of 1855, and at Yalta the Allies had promised the Kurils to the Soviet Union. Three days after Japan announced its surrender, on 18 August 1945, Soviet troops from Kamchatka landed on Shumshu, the northernmost island, where the Japanese 91st Division fought back with tanks until it was ordered to lay down its arms; the fighting, the last large battle of the war, ended on 23 August with heavy losses on the Soviet side. Soviet forces then occupied the islands southwards to Urup without resistance, and ships from Sakhalin landed troops on Iturup on 28 August, on Kunashir and Shikotan on 1 September and on the Habomai islets by 5 September, after Japan had signed the instrument of surrender on 2 September. About 50,000 Japanese soldiers were taken prisoner. Of the roughly 17,000 Japanese living on the four southern islands, about half fled to Hokkaido in small boats; the rest were deported to Japan in 1947–1949. The Soviet Union annexed the islands on 2 February 1946. Japan claims the four southern islands, Etorofu (Iturup), Kunashiri, Shikotan and the Habomai islands, as its Northern Territories, while Russia holds that they became Soviet by the post-war settlement; the dispute has prevented a peace treaty between the two countries.
: Den sovjetiska ockupationen av Kurilerna, kedjan av vulkaniska öar mellan Kamtjatka och Hokkaido, i allra sista skedet av andra världskriget, och fördrivningen av deras japanska invånare. De norra Kurilerna hade varit japanska sedan fördraget i Sankt Petersburg 1875, de södra öarna sedan Shimodafördraget 1855, och i Jalta hade de allierade lovat Kurilerna till Sovjetunionen. Tre dagar efter att Japan tillkännagivit sin kapitulation, den 18 augusti 1945, landsteg sovjetiska trupper från Kamtjatka på Shumshu, den nordligaste ön, där den japanska 91:a divisionen gjorde motstånd med stridsvagnar tills den beordrades att lägga ner vapnen; striderna, krigets sista stora slag, upphörde den 23 augusti med svåra förluster på sovjetisk sida. Sovjetiska styrkor ockuperade därefter öarna söderut till Urup utan motstånd, och fartyg från Sachalin landsatte trupper på Iturup den 28 augusti, på Kunashir och Shikotan den 1 september och på Habomaiholmarna senast den 5 september, sedan Japan hade undertecknat kapitulationsdokumentet den 2 september. Omkring 50 000 japanska soldater togs till fånga. Av de ungefär 17 000 japaner som bodde på de fyra sydliga öarna flydde omkring hälften till Hokkaido i små båtar; resten deporterades till Japan 1947–1949. Sovjetunionen annekterade öarna den 2 februari 1946. Japan gör anspråk på de fyra sydliga öarna, Etorofu (Iturup), Kunashiri, Shikotan och Habomaiöarna, som sina norra territorier, medan Ryssland hävdar att de blev sovjetiska genom efterkrigsuppgörelsen; tvisten har förhindrat ett fredsfördrag mellan de två länderna.
