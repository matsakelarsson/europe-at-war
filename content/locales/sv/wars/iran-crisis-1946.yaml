Iran crisis of 1946: Irankrisen 1946
One of the first crises of the Cold War. Soviet troops, who had occupied northern Iran with the British since 1941, stayed on after the war, and under their protection the Azerbaijan Democratic Party of Ja’far Pishevari set up an autonomous Azerbaijan People’s Government in Tabriz in December 1945, while Kurdish nationalists under Qazi Muhammad proclaimed the Republic of Mahabad in January 1946. Iran took its case to the new UN Security Council, and Prime Minister Ahmad Qavam persuaded Stalin to withdraw his troops in return for the promise of an oil concession. Once the Soviet troops had left, in May 1946, the Iranian army moved in; the Tabriz government collapsed and Iranian troops entered Tabriz on 13 December and Mahabad on 15 December 1946. Qazi Muhammad was hanged in 1947, and the Iranian parliament rejected the Soviet oil concession.: En av kalla krigets första kriser. Sovjetiska trupper, som tillsammans med britterna hade ockuperat norra Iran sedan 1941, stannade kvar efter kriget, och under deras beskydd upprättade Ja’far Pishevaris Azerbajdzjans demokratiska parti en autonom regering, Azerbajdzjans folkregering, i Tabriz i december 1945, medan kurdiska nationalister under Qazi Muhammad utropade Republiken Mahabad i januari 1946. Iran förde sin sak inför FN:s nya säkerhetsråd, och premiärminister Ahmad Qavam övertalade Stalin att dra tillbaka sina trupper i utbyte mot löftet om en oljekoncession. Sedan de sovjetiska trupperna hade lämnat landet i maj 1946 ryckte den iranska armén in; regeringen i Tabriz föll samman, och iranska trupper tågade in i Tabriz den 13 december och i Mahabad den 15 december 1946. Qazi Muhammad hängdes 1947, och det iranska parlamentet förkastade den sovjetiska oljekoncessionen.
