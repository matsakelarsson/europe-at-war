# Svenska översättningar av katalogtexten (våg 7); stegtexterna kommer senare.
Iran–Iraq War: Iran–Irakkriget
The war between Iraq under Saddam Hussein and the Islamic Republic of Iran, which Iraq began on 22 September 1980 by invading the Iranian oil province of Khuzestan, hoping to win the Shatt al-Arab waterway and to strike at the new revolutionary government before it could stir up Iraq’s Shia majority. Iran drove the invaders back by 1982 and then fought for six years on Iraqi soil, using waves of young volunteers against Iraqi defences, while Iraq used chemical weapons, attacked Iran’s cities and oil exports and, at home, killed tens of thousands of Kurds in the Anfal campaign. The war spread to Gulf shipping and drew in the US Navy. Iran accepted the UN’s ceasefire resolution in July 1988, after a last series of Iraqi victories, and the fighting stopped on 20 August 1988 with the borders unchanged. Estimates of the dead range from about 300,000 to well over half a million, most of them Iranian.: Kriget mellan Irak under Saddam Hussein och Islamiska republiken Iran, som Irak inledde den 22 september 1980 genom att invadera den iranska oljeprovinsen Khuzestan, i hopp om att vinna farleden Shatt al-Arab och slå till mot den nya revolutionära regeringen innan den hann uppvigla Iraks shiitiska majoritet. Iran hade 1982 drivit tillbaka inkräktarna och stred sedan i sex år på irakisk mark, där landet satte in vågor av unga frivilliga mot det irakiska försvaret, medan Irak använde kemiska vapen, angrep Irans städer och oljeexport och på hemmaplan dödade tiotusentals kurder i Anfalkampanjen. Kriget spred sig till sjöfarten i Persiska viken och drog in den amerikanska flottan. Iran godtog FN:s resolution om eldupphör i juli 1988, efter en sista rad irakiska segrar, och striderna upphörde den 20 augusti 1988 med oförändrade gränser. Uppskattningarna av antalet döda varierar från omkring 300 000 till långt över en halv miljon, de flesta av dem iranier.
