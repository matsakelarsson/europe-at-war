# Svenska översättningar av katalogtexten (våg 7); stegtexterna kommer senare.
2026 Iran war: Irankriget 2026
? A war between Iran and the United States and Israel that began on 28 February 2026, eight months after the Twelve-Day War, when US and Israeli strikes (Operation Epic Fury and Operation Roaring Lion) killed Supreme Leader Ali Khamenei and much of Iran’s military leadership. Iran answered with missiles and drones fired at Israel, at US bases and at the Gulf states that host them, and closed the Strait of Hormuz, causing what the International Energy Agency called the largest oil supply disruption in history. Hezbollah in Lebanon, where Israel invaded the south, armed groups in Iraq and the Houthis in Yemen joined in on Iran’s side, and Khamenei’s son Mojtaba succeeded him as supreme leader. A ceasefire brokered by Pakistan on 7–8 April, failed talks in Islamabad and a US naval blockade of Iranian ports were followed on 17 June by the Islamabad Memorandum, which suspended the fighting for 60 days, but it collapsed in July after attacks on shipping. Since then the blockade and Iran’s closure of the strait have continued, with intermittent strikes and stalled talks. Thousands have been killed, most of them in Iran and Lebanon. Last updated 27 November 2026.
: Ett krig mellan Iran å ena sidan och USA och Israel å den andra, som började den 28 februari 2026, åtta månader efter tolvdagarskriget, när amerikanska och israeliska angrepp (operation Epic Fury och operation Roaring Lion) dödade Irans högste ledare Ali Khamenei och stora delar av landets militära ledning. Iran svarade med robotar och drönare mot Israel, mot amerikanska baser och mot de stater vid Persiska viken som hyser dem, och stängde Hormuzsundet, vilket orsakade det som Internationella energiorganet (IEA) kallade det största avbrottet i oljeförsörjningen i historien. Hizbollah i Libanon, där Israel invaderade landets södra del, väpnade grupper i Irak och huthierna i Jemen gick in i kriget på Irans sida, och Khameneis son Mojtaba efterträdde honom som högste ledare. Efter ett eldupphör som Pakistan förmedlade den 7–8 april, misslyckade förhandlingar i Islamabad och en amerikansk sjöblockad av iranska hamnar kom den 17 juni Islamabadmemorandumet, som avbröt striderna i 60 dagar men bröt samman i juli efter angrepp mot sjöfarten. Sedan dess har blockaden och Irans stängning av sundet fortsatt, med återkommande angrepp och förhandlingar som har kört fast. Tusentals människor har dödats, de flesta i Iran och Libanon. Senast uppdaterad 27 november 2026.
