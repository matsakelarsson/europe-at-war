# Svenska översättningar av katalogtexten (våg 7); stegtexterna kommer senare.
Iranian Revolution: Iranska revolutionen
? The revolution that overthrew Mohammad Reza Shah Pahlavi and made Iran an Islamic republic under Ayatollah Ruhollah Khomeini. Opposition to the Shah’s autocratic rule, his secret police (SAVAK), inequality and rapid Westernisation united clergy, bazaar merchants, students, liberals and leftists. After police fired on seminary students in Qom in January 1978, mourning ceremonies every forty days grew into nationwide protests; a fire at the Cinema Rex in Abadan in August, which killed more than 400 people and was blamed on the government, though Islamist militants were later convicted, and the shooting of demonstrators in Tehran’s Jaleh Square on “Black Friday”, 8 September 1978, turned many against the Shah. Strikes, above all in the oil industry, paralysed the country through the autumn, and millions marched in December. The Shah left Iran on 16 January 1979, Khomeini returned from exile on 1 February, and on 11 February the army declared itself neutral and the monarchy fell after two days of street fighting. An Islamic Republic was proclaimed after a referendum on 1 April 1979.
: Revolutionen som störtade shah Mohammad Reza Pahlavi och gjorde Iran till en islamisk republik under ayatolla Ruhollah Khomeini. Motståndet mot shahens envälde, hans hemliga polis (SAVAK), ojämlikheten och den snabba västerniseringen förenade präster, basarköpmän, studenter, liberaler och vänsteranhängare. Sedan polisen i januari 1978 hade skjutit mot seminariestudenter i Qom växte sorgeceremonier som hölls var fyrtionde dag till landsomfattande protester. En brand på Cinema Rex i Abadan i augusti, som dödade mer än 400 människor och lades regeringen till last, fast islamistiska militanter senare dömdes för den, och skotten mot demonstranter på Jalehtorget i Teheran på ”Svarta fredagen” den 8 september 1978 vände många mot shahen. Strejker, framför allt i oljeindustrin, lamslog landet under hösten, och miljoner demonstrerade i december. Shahen lämnade Iran den 16 januari 1979, Khomeini återvände från exilen den 1 februari, och den 11 februari förklarade sig armén neutral, och monarkin föll efter två dagars gatustrider. En islamisk republik utropades efter en folkomröstning den 1 april 1979.
