# Svenska översättningar av katalogtexten (våg 7); stegtexterna kommer senare.
Iraq War: Irakkriget
The war that began with the invasion of Iraq by the United States, Britain and their allies on 20 March 2003, without the explicit authorisation of the UN Security Council, to overthrow Saddam Hussein, whose government they accused of hiding weapons of mass destruction and of links to terrorism; no such weapons were found. Baghdad fell on 9 April, but the occupation that followed, the dissolution of the Iraqi army and the purge of Ba’ath party members were followed by a Sunni Arab insurgency, uprisings by the Shia cleric Muqtada al-Sadr’s Mahdi Army and, after the bombing of the Shia shrine at Samarra in 2006, a sectarian civil war in which tens of thousands of civilians were killed. A US troop “surge” in 2007 and the turn of Sunni tribes against al-Qaeda in Iraq reduced the violence, and under a 2008 agreement with the elected Iraqi government the last US troops left on 18 December 2011. Estimates of the violent deaths range from about 150,000 to several hundred thousand.: Kriget som började med att USA, Storbritannien och deras allierade invaderade Irak den 20 mars 2003, utan uttryckligt bemyndigande från FN:s säkerhetsråd, för att störta Saddam Hussein, vars regering de anklagade för att dölja massförstörelsevapen och för att ha förbindelser med terrorism; några sådana vapen hittades inte. Bagdad föll den 9 april, men på den ockupation som följde, upplösningen av den irakiska armén och utrensningen av Baathpartiets medlemmar följde ett sunniarabiskt uppror, resningar av den shiitiske prästen Muqtada al-Sadrs Mahdiarmé och, efter bombdådet mot den shiitiska helgedomen i Samarra 2006, ett sekteristiskt inbördeskrig där tiotusentals civila dödades. Ett amerikanskt ”trupptillskott” 2007 och de sunnitiska stammarnas vändning mot al-Qaida i Irak minskade våldet, och enligt ett avtal 2008 med den valda irakiska regeringen lämnade de sista amerikanska trupperna landet den 18 december 2011. Uppskattningarna av antalet våldsamma dödsfall varierar från omkring 150 000 till flera hundra tusen.
