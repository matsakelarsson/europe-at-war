# Svenska översättningar av katalogtexten (våg 7); stegtexterna kommer senare.
Iraqi Kurdish Civil War: Irakisk-kurdiska inbördeskriget
? The war between the two main Kurdish parties of northern Iraq, Masoud Barzani’s Kurdistan Democratic Party (KDP) and Jalal Talabani’s Patriotic Union of Kurdistan (PUK), in the self-governing Kurdish region that had existed since 1991 under Western air protection. Quarrels over land and over the customs revenue from trade with Turkey turned into open fighting in May 1994, and the regional parliament and government split in two. In August 1996 the PUK, with Iranian support, drove towards Erbil, and Barzani called in Saddam Hussein. On 31 August some 30,000 Iraqi troops took Erbil for the KDP and executed many members of the opposition Iraqi National Congress, and the United States answered with cruise missile strikes on southern Iraq. The KDP went on to take Sulaymaniyah, which the PUK retook in October. Fighting flared again in 1997, with the Turkish army entering on the KDP’s side against the PUK and the PKK, until a ceasefire on 24 November 1997. The Washington Agreement of September 1998 ended the war, though the region stayed divided into KDP and PUK zones for years.
: Kriget mellan de två största kurdiska partierna i norra Irak, Masoud Barzanis Kurdistans demokratiska parti (KDP) och Jalal Talabanis Kurdistans patriotiska union (PUK), i den självstyrande kurdiska region som hade funnits sedan 1991 under västligt luftskydd. Gräl om mark och om tullintäkterna från handeln med Turkiet övergick i öppna strider i maj 1994, och det regionala parlamentet och regeringen splittrades i två. I augusti 1996 ryckte PUK med iranskt stöd fram mot Erbil, och Barzani kallade in Saddam Hussein. Den 31 augusti intog omkring 30 000 irakiska soldater Erbil åt KDP och avrättade många medlemmar av den oppositionella Irakiska nationalkongressen, och USA svarade med anfall med kryssningsrobotar mot södra Irak. KDP intog därefter Sulaymaniyya, som PUK återtog i oktober. Striderna blossade upp igen 1997, då den turkiska armén gick in på KDP:s sida mot PUK och PKK, fram till en vapenvila den 24 november 1997. Washingtonavtalet i september 1998 avslutade kriget, men regionen förblev i flera år delad i en KDP-zon och en PUK-zon.
Kurdistan Democratic Party (KDP): Kurdistans demokratiska parti (KDP)
Patriotic Union of Kurdistan (PUK): Kurdistans patriotiska union (PUK)
Iraq (1996, with the KDP): Irak (1996, med KDP)
Iran (with the PUK): Iran (med PUK)
