Iraqi revolt of 1920: Irakiska upproret 1920
A rising against British rule in Iraq, which Britain had conquered from the Ottoman Empire in the First World War and received as a League of Nations mandate in April 1920. Shia clerics, tribal sheikhs of the Euphrates and nationalist former Ottoman officers, Shia and Sunni together, demanded an Arab government. The tribes held most of the middle Euphrates for weeks before British and Indian reinforcements and the Royal Air Force put the revolt down by the end of October. Its cost led Britain to rule Iraq indirectly, through King Faisal I, from 1921.: Ett uppror mot det brittiska styret i Irak, som Storbritannien hade erövrat från Osmanska riket under första världskriget och i april 1920 fått som mandat från Nationernas förbund. Shiitiska religiösa lärde, stamshejker vid Eufrat och nationalistiska före detta osmanska officerare, shiiter och sunniter tillsammans, krävde en arabisk regering. Stammarna behärskade större delen av mellersta Eufrat i flera veckor innan brittiska och indiska förstärkningar och Royal Air Force slog ned upproret före utgången av oktober. Kostnaderna fick Storbritannien att från 1921 styra Irak indirekt, genom kung Faisal I.
