# Svenska översättningar av katalogtexten (våg 7); stegtexterna kommer senare.
1991 Iraqi uprisings: Upproren i Irak 1991
The revolts that broke out across southern and northern Iraq after the Gulf War ceasefire, against Saddam Hussein’s government. Beginning in Basra on 1 March 1991 among soldiers retreating from Kuwait, the uprising spread within days through the Shia cities of the south, and from 5 March the Kurds rose in the north, taking Sulaymaniyah, Erbil and, on 20 March, Kirkuk. At their height the rebels held 14 of Iraq’s 18 provinces. But the Republican Guard had survived the war, the coalition allowed Iraq to fly helicopters, and the United States, which had called on Iraqis to rise, did not intervene. By early April loyal forces had crushed the revolts with great brutality, shelling the shrine cities of Najaf and Karbala and executing thousands. Nearly two million people, most of them Kurds, fled towards Turkey and Iran, and the UN Security Council’s Resolution 688 led to a Western-protected safe haven in the north and, later, Kurdish self-rule.: De revolter mot Saddam Husseins regering som bröt ut över hela södra och norra Irak efter eldupphöret i Kuwaitkriget. Upproret började i Basra den 1 mars 1991 bland soldater som retirerade från Kuwait och spred sig inom några dagar genom de shiitiska städerna i söder, och från den 5 mars reste sig kurderna i norr och intog Sulaymaniyya, Erbil och den 20 mars Kirkuk. När upproret var som störst höll rebellerna 14 av Iraks 18 provinser. Men Republikanska gardet hade överlevt kriget, koalitionen tillät Irak att flyga med helikoptrar, och USA, som hade uppmanat irakierna att resa sig, ingrep inte. I början av april hade regeringstrogna styrkor krossat revolterna med stor brutalitet; de besköt de heliga städerna Najaf och Karbala och avrättade tusentals. Nästan två miljoner människor, de flesta av dem kurder, flydde mot Turkiet och Iran, och FN:s säkerhetsråds resolution 688 ledde till en säker zon under västligt skydd i norr och senare till kurdiskt självstyre.
