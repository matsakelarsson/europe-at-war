The pro-Treaty government was the Provisional Government set up under the Treaty until the Irish Free State came into being on 6 December 1922.: Den fördragsvänliga regeringen var den provisoriska regering som inrättats enligt fördraget, fram till dess att Irländska fristaten kom till den 6 december 1922.
