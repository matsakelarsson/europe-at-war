Irish Civil War: Irländska inbördeskriget
? A war between the government of the new Irish state, which accepted the Anglo-Irish Treaty of 1921, and the republicans of the anti-Treaty IRA, who saw the Treaty as a betrayal of the Irish Republic. Anti-Treaty fighters had occupied the Four Courts in Dublin in April 1922, and on 28 June the National Army began shelling them with field guns lent by Britain. The government took Dublin within a week and the towns of the self-styled “Munster Republic” in the south by August, but a bitter guerrilla war went on for months. Michael Collins, the army’s commander-in-chief, was killed in an ambush at Béal na Bláth in County Cork on 22 August 1922. Republicans killed a member of the Dáil and burned the houses of senators; the government executed 81 republican prisoners, and its troops killed others out of hand, as at Ballyseedy in Kerry. After the IRA’s chief of staff, Liam Lynch, was killed in April 1923, his successor Frank Aiken ordered his men on 24 May to dump their arms. Estimates of the dead range from about 1,500 to just under 2,000. The split shaped Irish politics for generations; Fine Gael and Fianna Fáil both trace their origins to the two sides.
: Ett krig mellan regeringen i den nya irländska staten, som godtog det anglo-irländska fördraget 1921, och republikanerna i den fördragsfientliga IRA, som såg fördraget som ett svek mot Irländska republiken. Fördragsmotståndare hade ockuperat Four Courts i Dublin i april 1922, och den 28 juni började Nationalarmén beskjuta byggnaden med fältkanoner som Storbritannien lånat ut. Regeringen tog Dublin inom en vecka och städerna i den självutnämnda ”Munsterrepubliken” i söder till augusti, men ett bittert gerillakrig fortsatte i månader. Michael Collins, arméns överbefälhavare, dödades i ett bakhåll vid Béal na Bláth i grevskapet Cork den 22 augusti 1922. Republikanerna dödade en ledamot av Dáil och brände senatorers hus; regeringen avrättade 81 republikanska fångar, och dess trupper dödade andra utan rättegång, som vid Ballyseedy i Kerry. Sedan IRA:s stabschef Liam Lynch dödats i april 1923 beordrade hans efterträdare Frank Aiken den 24 maj sina män att gömma undan sina vapen. Uppskattningarna av antalet döda varierar från omkring 1 500 till knappt 2 000. Splittringen präglade irländsk politik i generationer; både Fine Gael och Fianna Fáil härleder sitt ursprung till de två sidorna.
