The government forces were mostly Irish militia and yeomanry, with British regular and fencible regiments and German mercenaries. The rebels were mostly Catholic in Leinster and Connacht and mostly Presbyterian in Ulster; sectarian killings took place on both sides.: Regeringsstyrkorna bestod mest av irländsk milis och yeomanry, med brittiska reguljära regementen och fencibleregementen samt tyska legosoldater. Rebellerna var mestadels katoliker i Leinster och Connacht och mestadels presbyterianer i Ulster; sekteristiska dödsfall förekom på båda sidor.
Estimates of the dead range from about 10,000 to 50,000, most of them rebels and civilians.: Uppskattningarna av antalet döda varierar från omkring 10 000 till 50 000, de flesta av dem rebeller och civila.
