The French Directory sent help too late. On 22 August 1798 General Jean Humbert landed about 1,000 French soldiers at Kilcummin near Killala in County Mayo, and some thousands of local men joined him. On 27 August he routed a larger force of militia and regulars under General Lake at Castlebar, where the government troops fled so fast that the battle became known as the “Races of Castlebar”. A Republic of Connacht was proclaimed, with John Moore as its president. Humbert then marched north-east through County Sligo and turned towards the midlands, where new risings broke out in Longford and Westmeath.: Det franska direktoriet skickade hjälp för sent. Den 22 augusti 1798 landsatte general Jean Humbert omkring 1 000 franska soldater vid Kilcummin nära Killala i grevskapet Mayo, och några tusen män från trakten anslöt sig till honom. Den 27 augusti slog han en större styrka av milis och reguljära trupper under general Lake på flykten vid Castlebar, där regeringstrupperna flydde så snabbt att slaget blev känt som ”Races of Castlebar” (kapplöpningen vid Castlebar). En republik Connacht utropades med John Moore som president. Humbert marscherade sedan nordost genom grevskapet Sligo och vände mot Midlands, där nya uppror bröt ut i Longford och Westmeath.
The new Lord Lieutenant, Lord Cornwallis, closed in with much larger forces. Humbert fought his way past a militia force at Collooney on 5 September, but on 8 September, surrounded at Ballinamuck in County Longford, he surrendered. The French were treated as prisoners of war and sent home; the Irish who had joined them were cut down or hanged. On 12 October a British squadron defeated a second French expedition off Tory Island, and Wolfe Tone, captured on board, was sentenced to death in Dublin and died of a self-inflicted wound on 19 November. The British government now pressed for union, and under the Acts of Union Ireland and Great Britain became the United Kingdom on 1 January 1801.: Den nye lordlöjtnanten, lord Cornwallis, ryckte fram med mycket större styrkor. Humbert slog sig förbi en milisstyrka vid Collooney den 5 september, men den 8 september kapitulerade han, omringad vid Ballinamuck i grevskapet Longford. Fransmännen behandlades som krigsfångar och skickades hem; de irländare som anslutit sig till dem höggs ned eller hängdes. Den 12 oktober besegrade en brittisk eskader en andra fransk expedition utanför Tory Island, och Wolfe Tone, som tillfångatagits ombord, dömdes till döden i Dublin och dog av ett självförvållat sår den 19 november. Den brittiska regeringen drev nu på för en union, och genom unionsakterna blev Irland och Storbritannien Förenade kungariket den 1 januari 1801.
