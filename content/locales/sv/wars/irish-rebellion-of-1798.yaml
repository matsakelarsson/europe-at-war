Irish Rebellion of 1798: Irländska upproret 1798
A rising led by the Society of United Irishmen against British rule in the Kingdom of Ireland, aiming at an independent republic with French help. Risings in Leinster and Ulster in May and June 1798 were crushed, most bloodily in County Wexford, and a small French force that landed in Mayo in August surrendered at Ballinamuck. Tens of thousands died, and the rebellion led to the union of Ireland with Great Britain in 1801.: Ett uppror lett av Society of United Irishmen (Förenade irländarna) mot det brittiska styret i Kungariket Irland, med målet att med fransk hjälp upprätta en självständig republik. Resningarna i Leinster och Ulster i maj och juni 1798 krossades, blodigast i grevskapet Wexford, och en liten fransk styrka som landsteg i Mayo i augusti kapitulerade vid Ballinamuck. Tiotusentals dog, och upproret ledde till Irlands union med Storbritannien 1801.
