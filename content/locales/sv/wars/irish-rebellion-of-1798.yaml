The Society of United Irishmen, founded in Belfast in 1791 mainly by Presbyterian radicals, had turned from reform to republican revolution and sought help from France; a French fleet with Wolfe Tone on board reached Bantry Bay in December 1796 but could not land in the storms. In 1797 and 1798 the government broke up the movement in Ulster and Leinster under martial law, with house-burnings, floggings and pitch-capping, and in March 1798 it arrested most of the Leinster leaders. The rising began on the night of 23 May with attacks around Dublin and in Kildare, Meath and Carlow, which were quickly crushed; prisoners were shot at Dunlavin and Carnew, and the rebels were routed at Tara Hill on 26 May.: Society of United Irishmen, som grundats i Belfast 1791 främst av presbyterianska radikaler, hade gått från reformkrav till republikansk revolution och sökte hjälp från Frankrike; en fransk flotta med Wolfe Tone ombord nådde Bantry Bay i december 1796 men kunde inte landstiga på grund av stormarna. Under 1797 och 1798 slog regeringen sönder rörelsen i Ulster och Leinster under krigslagar, med husbränder, prygel och så kallad pitch-capping, och i mars 1798 arresterade den de flesta av ledarna i Leinster. Upproret började natten till den 23 maj med anfall runt Dublin och i Kildare, Meath och Carlow, som snabbt krossades; fångar sköts vid Dunlavin och Carnew, och rebellerna slogs på flykten vid Tara Hill den 26 maj.
In County Wexford, where Catholic priests such as Father John Murphy led many of them, the rising became a mass revolt. The rebels destroyed a militia detachment at Oulart Hill on 27 May, took Enniscorthy and Wexford town and held most of the county for three weeks. Their attacks on New Ross and Arklow failed with heavy losses. On the day of New Ross rebels killed at least 100 loyalist prisoners, most of them Protestants, at Scullabogue, and more on Wexford bridge on 20 June. In Ulster the rebels of Antrim and Down were beaten at Antrim on 7 June and Ballynahinch on 13 June. On 21 June General Gerard Lake’s army stormed the main rebel camp on Vinegar Hill above Enniscorthy, and government troops killed rebels and civilians in great numbers in the weeks that followed.: I grevskapet Wexford, där katolska präster som fader John Murphy ledde många av rebellerna, blev upproret en massresning. Rebellerna förintade en milisavdelning vid Oulart Hill den 27 maj, intog Enniscorthy och staden Wexford och höll större delen av grevskapet i tre veckor. Deras anfall mot New Ross och Arklow misslyckades med svåra förluster. Samma dag som slaget vid New Ross dödade rebeller minst 100 lojalistiska fångar, de flesta protestanter, i Scullabogue, och fler på bron i Wexford den 20 juni. I Ulster besegrades rebellerna i Antrim och Down vid Antrim den 7 juni och vid Ballynahinch den 13 juni. Den 21 juni stormade general Gerard Lakes armé rebellernas huvudläger på Vinegar Hill ovanför Enniscorthy, och under veckorna som följde dödade regeringstrupperna rebeller och civila i stort antal.
