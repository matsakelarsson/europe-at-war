Irish War of Independence: Irländska frihetskriget
A guerrilla war between the Irish Republican Army, fighting for the Irish Republic declared by Dáil Éireann in January 1919, and British forces, including the police reinforcements known as the Black and Tans and the Auxiliaries. It ended in a truce in July 1921; the Anglo-Irish Treaty of December 1921 created the self-governing Irish Free State, while Northern Ireland, set up earlier that year, stayed in the United Kingdom.: Ett gerillakrig mellan Irish Republican Army (IRA), som kämpade för den irländska republik som Dáil Éireann utropat i januari 1919, och brittiska styrkor, bland dem de polisförstärkningar som kallades Black and Tans och Auxiliaries. Kriget slutade med ett stillestånd i juli 1921. Det anglo-irländska fördraget i december 1921 skapade den självstyrande Irländska fristaten, medan Nordirland, som upprättats tidigare samma år, stannade kvar i Storbritannien.
