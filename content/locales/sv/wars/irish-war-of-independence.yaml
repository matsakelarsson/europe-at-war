In the general election of December 1918 Sinn Féin won 73 of Ireland’s 105 seats. Its members refused to sit at Westminster, and on 21 January 1919 they met in Dublin’s Mansion House as Dáil Éireann and declared independence. The same day, at Soloheadbeg in County Tipperary, Volunteers led by Seán Treacy and Dan Breen, acting on their own initiative, shot dead two policemen guarding a cart of gelignite. Through 1919 the Volunteers, now called the Irish Republican Army, mostly raided for arms and freed prisoners, while Michael Collins’s “Squad” killed police detectives in Dublin. In September the British government banned the Dáil.: I parlamentsvalet i december 1918 vann Sinn Féin 73 av Irlands 105 mandat. Partiets ledamöter vägrade att ta plats i Westminster, och den 21 januari 1919 samlades de i Mansion House i Dublin som Dáil Éireann och förklarade landet självständigt. Samma dag, vid Soloheadbeg i grevskapet Tipperary, sköt frivilliga under ledning av Seán Treacy och Dan Breen, på eget initiativ, ihjäl två poliser som bevakade en kärra med gelignit. Under 1919 genomförde de frivilliga, som nu kallades Irish Republican Army, mest räder efter vapen och befriade fångar, medan Michael Collins ”Squad” dödade polisdetektiver i Dublin. I september förbjöd den brittiska regeringen Dáil.
In 1920 the IRA moved on to attacking police barracks and ambushing patrols, and the RIC abandoned many isolated stations. Britain reinforced it with ex-servicemen recruited in Britain, from March the “Black and Tans” and from July the Auxiliary Division of former officers, who answered IRA attacks by killing suspects and burning creameries, homes and towns, among them Balbriggan. In March Tomás Mac Curtain, the Lord Mayor of Cork, was shot dead at home by men with blackened faces, and in October his successor, Terence MacSwiney, died on hunger strike in Brixton prison in London.: År 1920 övergick IRA till att anfalla poliskaserner och lägga bakhåll för patruller, och RIC övergav många avlägsna stationer. Storbritannien förstärkte poliskåren med före detta soldater som rekryterats i Storbritannien, från mars ”Black and Tans” och från juli Auxiliary Division, bestående av före detta officerare, som besvarade IRA:s anfall genom att döda misstänkta och bränna mejerier, hem och städer, bland dem Balbriggan. I mars sköts Tomás Mac Curtain, borgmästare i Cork, ihjäl i sitt hem av män med svärtade ansikten, och i oktober dog hans efterträdare Terence MacSwiney under en hungerstrejk i Brixtonfängelset i London.
In Ulster the conflict took a sectarian turn. In July 1920 loyalists drove about 8,000 Catholics and left-wing Protestants out of the Belfast shipyards, and rioting, shootings and burnings in the city killed nearly 500 people by 1922, most of them Catholics. A mainly Protestant Ulster Special Constabulary was raised to support the police, and some of its members took part in reprisals.: I Ulster fick konflikten en sekteristisk vändning. I juli 1920 drev lojalister ut omkring 8 000 katoliker och vänsterinriktade protestanter från varven i Belfast, och upplopp, skottlossning och bränder i staden dödade nästan 500 människor fram till 1922, de flesta av dem katoliker. En huvudsakligen protestantisk Ulster Special Constabulary sattes upp till stöd för polisen, och en del av dess medlemmar deltog i repressalier.
