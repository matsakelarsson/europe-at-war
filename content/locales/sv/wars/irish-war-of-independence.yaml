After a police head constable was shot dead, Black and Tans burned dozens of houses and a hosiery factory and killed two local men.: Sedan en polisöverkonstapel skjutits ihjäl brände Black and Tans dussintals hus och en strumpfabrik och dödade två män från orten.
Belfast: Belfast
July 1920: juli 1920
The shipyard expulsions began two years of sectarian violence in the city; many thousands of Catholics were driven from their jobs and homes.: Utdrivningarna från varven inledde två år av sekteristiskt våld i staden; många tusen katoliker drevs från sina arbeten och hem.
On the morning of 21 November 1920, Bloody Sunday, Collins’s men shot dead about 15 men in Dublin, most of them British officers believed to be intelligence agents. That afternoon police and Auxiliaries opened fire on the crowd at a Gaelic football match in Croke Park, killing 14 civilians. A week later Tom Barry’s West Cork flying column wiped out a patrol of Auxiliaries at Kilmichael. Martial law was declared in four Munster counties on 10 December, and the next night, after an ambush in the city, Auxiliaries, Black and Tans and soldiers burned the centre of Cork.: På morgonen den 21 november 1920, Blodiga söndagen, sköt Collins män ihjäl omkring 15 män i Dublin, de flesta brittiska officerare som antogs vara underrättelseagenter. Samma eftermiddag öppnade polis och Auxiliaries eld mot publiken vid en match i gaelisk fotboll på Croke Park och dödade 14 civila. En vecka senare utplånade Tom Barrys flygande kolonn från västra Cork en patrull Auxiliaries vid Kilmichael. Krigslagar infördes i fyra grevskap i Munster den 10 december, och följande natt, efter ett bakhåll i staden, brände Auxiliaries, Black and Tans och soldater centrala Cork.
About 1,000 people were killed between January and July 1921, the worst months of the war, most of them in Munster, Dublin and Belfast. Flying columns ambushed troops, as at Crossbarry in March; Britain executed IRA prisoners and burned houses in reprisal. In May the IRA burned the Custom House in Dublin, but five of its men were killed and more than 80 captured. Under the Government of Ireland Act, Northern Ireland was set up on 3 May 1921, and George V opened its parliament in Belfast on 22 June.: Omkring 1 000 människor dödades mellan januari och juli 1921, krigets värsta månader, de flesta i Munster, Dublin och Belfast. Flygande kolonner lade bakhåll för trupper, som vid Crossbarry i mars; Storbritannien avrättade IRA-fångar och brände hus som repressalier. I maj brände IRA Custom House i Dublin, men fem av dess män dödades och mer än 80 tillfångatogs. Enligt Government of Ireland Act upprättades Nordirland den 3 maj 1921, och Georg V öppnade dess parlament i Belfast den 22 juni.
A truce began on 11 July 1921. Talks in London led to the Anglo-Irish Treaty, signed on 6 December, which created the Irish Free State, a self-governing dominion within the British Empire, and allowed Northern Ireland to opt out. The Dáil approved it on 7 January 1922 by 64 votes to 57, but the split over it, above all over the oath of fidelity to the king, led to civil war. In all, about 2,300 people had been killed, some 900 of them civilians.: Ett stillestånd inleddes den 11 juli 1921. Förhandlingar i London ledde till det anglo-irländska fördraget, undertecknat den 6 december, som skapade Irländska fristaten, ett självstyrande dominion inom Brittiska imperiet, och lät Nordirland stå utanför. Dáil godkände fördraget den 7 januari 1922 med 64 röster mot 57, men splittringen kring det, framför allt kring trohetseden till kungen, ledde till inbördeskrig. Sammanlagt hade omkring 2 300 människor dödats, varav omkring 900 civila.
