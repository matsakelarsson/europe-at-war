Also called the Anglo-Irish War and, in Ireland, the Tan War. Britain did not recognise the Irish Republic, and all of Ireland remained part of the United Kingdom until the Irish Free State was established on 6 December 1922.: Kallas också det anglo-irländska kriget och, på Irland, Tan War. Storbritannien erkände inte Irländska republiken, och hela Irland förblev en del av Förenade kungariket tills Irländska fristaten upprättades den 6 december 1922.
The British forces were the army and the Royal Irish Constabulary (RIC), reinforced by recruits from Britain, and in the north the mainly Protestant Ulster Special Constabulary. The figure of about 2,300 dead is based on research by the historian Eunan O’Halpin; other counts differ.: De brittiska styrkorna utgjordes av armén och Royal Irish Constabulary (RIC), förstärkta med rekryter från Storbritannien, och i norr av den huvudsakligen protestantiska Ulster Special Constabulary. Siffran omkring 2 300 döda bygger på forskning av historikern Eunan O’Halpin; andra sammanräkningar skiljer sig åt.
