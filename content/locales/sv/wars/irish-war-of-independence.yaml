Cork: Cork
20 March 1920: 20 mars 1920
Tomás Mac Curtain was killed in front of his wife at his home. The inquest jury returned a verdict of wilful murder against the British prime minister, Lloyd George, and police officers.: Tomás Mac Curtain dödades inför ögonen på sin hustru i sitt hem. Likskådningsjuryn fällde ett utslag om uppsåtligt mord mot den brittiske premiärministern Lloyd George och polisbefäl.
