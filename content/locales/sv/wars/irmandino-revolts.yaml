Irmandiño Revolts: Irmandiñoupproren
The great rising of the brotherhoods (irmandades) of Galicia against the nobles who ruled the countryside from their castles. With the approval of Henry IV of Castile, peasants, townspeople, lower clergy and some lesser nobles formed a Holy Brotherhood in 1467 and, led by men such as Alonso de Lanzós and Diego de Lemos, destroyed about 130 castles and towers of families like the Andrade, Lemos and Moscoso, while the lords fled to Portugal or Castile. In 1469 Pedro Álvarez de Sotomayor, “Pedro Madruga”, led a counter-attack from Portugal with the archbishop of Santiago, other nobles and support from the kings of Castile and Portugal, and the brotherhoods were crushed. The castles were rebuilt by forced labour, until the Catholic Monarchs curbed the Galician nobility in the 1480s. An earlier rising, the Irmandade Fusquenlla of 1431–1435, had been put down in the same way.: Det stora upproret bland Galiciens brödraskap (irmandades) mot de adelsmän som styrde landsbygden från sina borgar. Med Henrik IV av Kastiliens godkännande bildade bönder, stadsbor, lägre präster och en del lågadel 1467 ett heligt brödraskap och förstörde, under ledning av män som Alonso de Lanzós och Diego de Lemos, omkring 130 borgar och torn tillhörande släkter som Andrade, Lemos och Moscoso, medan herrarna flydde till Portugal eller Kastilien. År 1469 ledde Pedro Álvarez de Sotomayor, ”Pedro Madruga”, ett motangrepp från Portugal tillsammans med ärkebiskopen av Santiago och andra adelsmän och med stöd av Kastiliens och Portugals kungar, och brödraskapen krossades. Borgarna byggdes upp igen med tvångsarbete, tills de katolska monarkerna tyglade den galiciska adeln på 1480-talet. Ett tidigare uppror, Irmandade Fusquenlla 1431–1435, hade slagits ned på samma sätt.
