# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
Isatay Taimanuly’s rebellion: Isatay Taimanulys uppror
? A rising of the herders of the Bukey (Inner) Horde, the Kazakh khanate between the lower Volga and the Ural created under Russian protection in 1801, against Khan Zhangir and the Russian frontier authorities. The best land along the Bolshoy and Maly Uzen and around the Kamysh-Samar lakes had gone to Cossack settlements, the khan and his kinsmen and allies held most of the remaining pastures, the herders were barred from the Ural floodplain, and taxes and livestock losses were heavy. In February 1836 the elder Isatay Taimanuly and the poet Makhambet Utemisuly took the lead of scattered unrest, calling for the seizure of the khan’s and the Cossacks’ lands and herds. From 24 October to 6 November 1837 they besieged the khan’s headquarters (Khan Ordasy) for about two weeks, until troops arrived; Isatay then attacked a Russian detachment at Zhideli. On 15 November 1837 Ural and Astrakhan Cossacks and the khan’s men defeated the rebels at Tastobe. Part of the rebels broke through across the Ural into the lands of the Junior Zhuz, where Isatay’s following grew to 2,000–3,000 men by the spring of 1838, according to the military governor of Orenburg, Vasily Perovsky. On 12 July 1838 a Russian force defeated them on the Akbulak river, and Isatay was killed in the fighting. Makhambet, whose poems are classics of Kazakh literature, went on trying to raise support and was killed in October 1846 by a member of a detachment sent to capture him.
: En resning bland boskapsskötarna i Bukejhorden (Inre horden), det kazakiska khanat mellan nedre Volga och Ural som skapades under ryskt beskydd 1801, mot khan Zhangir och de ryska gränsmyndigheterna. Den bästa marken längs Bolsjoj och Malyj Uzen och kring Kamysj-Samarsjöarna hade gått till kosackbosättningar, khanen och hans släktingar och allierade höll de flesta av de återstående betesmarkerna, boskapsskötarna var utestängda från Urals flodslätt, och skatterna och boskapsförlusterna var tunga. I februari 1836 tog den äldste Isatay Taimanuly och poeten Makhambet Utemisuly ledningen för spridd oro och krävde att khanens och kosackernas land och hjordar skulle tas. Från den 24 oktober till den 6 november 1837 belägrade de khanens högkvarter (Khan Ordasy) i omkring två veckor, tills trupper anlände; Isatay anföll sedan en rysk avdelning vid Zhideli. Den 15 november 1837 besegrade ural- och astrachankosacker och khanens män rebellerna vid Tastobe. En del av rebellerna bröt igenom över Ural in i Yngre zhuzens land, där Isatays anhängarskara växte till 2 000–3 000 man fram till våren 1838, enligt Orenburgs militärguvernör Vasilij Perovskij. Den 12 juli 1838 besegrade en rysk styrka dem vid floden Akbulak, och Isatay stupade i striden. Makhambet, vars dikter är klassiker i den kazakiska litteraturen, fortsatte att försöka samla stöd och dödades i oktober 1846 av en medlem av en avdelning som sänts för att gripa honom.
