# Svenska översättningar av katalogtexten (våg 10); stegtexterna kommer senare.
Ishiyama Hongan-ji War: Ishiyama Hongan-ji-kriget
? "Oda Nobunaga’s ten-year war against the Ishiyama Hongan-ji, the fortified head temple of the Jōdo Shinshū at Osaka, and the leagues of its followers, the Ikkō-ikki. The Hongan-ji had moved to Ishiyama, on the site of today’s Osaka Castle, in 1532, and its abbot commanded the loyalty of hundreds of thousands of farmers, townsmen and local warriors from Kaga to Kii. When Nobunaga, master of Kyoto since 1568, demanded money and the temple’s site, the abbot Kennyo called on his followers to fight in 1570. The war was fought at Osaka, where Oda armies ringed the temple with forts for years, and in the provinces: the leagues of Nagashima in Owari and Ise were wiped out in 1574 and those of Echizen in 1575, with tens of thousands killed. The Mōri kept the temple supplied by sea and beat Nobunaga’s fleet at Kizugawaguchi in 1576, but after Nobunaga’s new fleet fought them again in 1578 and his enemies fell one by one, Kennyo accepted a peace arranged by the emperor in 1580 and left Osaka. The temple burned, and Hideyoshi later built Osaka Castle on its site."
: "Oda Nobunagas tioåriga krig mot Ishiyama Hongan-ji, Jōdo Shinshūs befästa huvudtempel i Osaka, och mot dess anhängares förbund, Ikkō-ikki. Hongan-ji hade 1532 flyttat till Ishiyama, på platsen för dagens Osaka slott, och dess abbot kunde räkna med lojaliteten hos hundratusentals bönder, stadsbor och lokala krigare från Kaga till Kii. När Nobunaga, herre över Kyoto sedan 1568, krävde pengar och templets tomt kallade abboten Kennyo 1570 sina anhängare till strid. Kriget utkämpades i Osaka, där Odas arméer under flera år omringade templet med fästen, och i provinserna: förbunden i Nagashima i Owari och Ise utplånades 1574 och de i Echizen 1575, och tiotusentals dödades. Mōriklanen höll templet försörjt sjövägen och slog Nobunagas flotta vid Kizugawaguchi 1576, men sedan Nobunagas nya flotta åter hade drabbat samman med dem 1578 och hans fiender hade fallit en efter en godtog Kennyo 1580 en fred som kejsaren förmedlat och lämnade Osaka. Templet brann ned, och Hideyoshi byggde senare Osaka slott på platsen."
