Frederick returned in 1158 with a much larger army, refounded Lodi on a new site and besieged Milan, which surrendered in early September. At a second diet at Roncaglia that November, lawyers from Bologna listed the regalia, the rights of the crown, which Frederick now claimed in full, among them tolls, mints and the appointment of magistrates. Imperial officials were sent to govern the cities, and when they reached Milan early in 1159 the city rose again. That autumn the papal election split, and Frederick backed Victor IV against Alexander III, who had the support of the Lombard cities, Sicily and most of Europe.: Fredrik återvände 1158 med en mycket större armé, grundade Lodi på nytt på en ny plats och belägrade Milano, som kapitulerade i början av september. Vid en andra riksdag i Roncaglia i november samma år förtecknade jurister från Bologna regalierna, kronans rättigheter, som Fredrik nu gjorde anspråk på i sin helhet, bland dem tullar, mynträtt och tillsättning av ämbetsmän. Kejserliga ämbetsmän sändes ut för att styra städerna, och när de nådde Milano i början av 1159 reste sig staden på nytt. Samma höst splittrades påvevalet, och Fredrik stödde Victor IV mot Alexander III, som hade stöd av de lombardiska städerna, Sicilien och större delen av Europa.
From July 1159 Frederick besieged Crema, Milan’s ally. Both sides killed prisoners in sight of the walls, and the Germans tied hostages, children among them, to their siege towers. Crema surrendered in January 1160 and was destroyed. The Milanese beat an imperial army at Carcano that August, but Milan was blockaded and its harvests burned, and after a hungry winter it surrendered unconditionally on 1 March 1162. Its people were expelled, and from late March its walls and most of its buildings were pulled down, much of the work done by men from its old rivals Lodi, Cremona, Pavia, Novara and Como.: Från juli 1159 belägrade Fredrik Crema, Milanos bundsförvant. Båda sidor dödade fångar inom synhåll från murarna, och tyskarna band fast gisslan, bland dem barn, vid sina belägringstorn. Crema kapitulerade i januari 1160 och förstördes. Milaneserna besegrade en kejserlig armé vid Carcano i augusti samma år, men Milano blockerades och dess skördar brändes, och efter en vinter av svält kapitulerade staden villkorslöst den 1 mars 1162. Invånarna fördrevs, och från slutet av mars revs dess murar och de flesta av dess byggnader, till stor del av män från dess gamla rivaler Lodi, Cremona, Pavia, Novara och Como.
