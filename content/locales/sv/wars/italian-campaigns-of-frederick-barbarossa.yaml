Frederick now made peace with the pope, his main opponent, partly at the cities’ expense. After preliminary talks at Anagni in November 1176 the parties met in Venice. On 24 July 1177 Frederick, freed from excommunication, knelt before Alexander III at the door of St Mark’s, and on 1 August the peace was sworn. Frederick recognised Alexander and abandoned his own antipope, and he agreed a fifteen-year truce with William II of Sicily and a six-year truce with the Lombard League.: Fredrik slöt nu fred med påven, sin främste motståndare, delvis på städernas bekostnad. Efter preliminära förhandlingar i Anagni i november 1176 möttes parterna i Venedig. Den 24 juli 1177 knäböjde Fredrik, nu befriad från bannlysningen, inför Alexander III vid porten till Markuskyrkan, och den 1 augusti besvors freden. Fredrik erkände Alexander och övergav sin egen motpåve, och han gick med på ett femtonårigt stillestånd med Vilhelm II av Sicilien och ett sexårigt stillestånd med Lombardiska förbundet.
The truce gave time for a lasting settlement. In the Peace of Constance, sealed on 25 June 1183, Frederick granted the League’s cities the regalia within their walls and many outside them, and the right to fortify, to keep their league and to elect their own consuls, who would be invested by the emperor. The cities swore fealty, paid a sum of money and owed the emperor supplies when he came to Italy. Alessandria was refounded as Caesarea, the emperor’s city. The communes stayed in the Empire but governed themselves, and in 1186 Frederick’s son Henry married Constance, heiress to the Kingdom of Sicily, in Milan.: Stilleståndet gav tid för en varaktig uppgörelse. I freden i Konstanz, som beseglades den 25 juni 1183, gav Fredrik förbundets städer regalierna inom deras murar och många utanför dem, samt rätten att befästa sig, att behålla sitt förbund och att välja sina egna konsuler, som skulle förlänas sina ämbeten av kejsaren. Städerna svor trohet, betalade en penningsumma och var skyldiga kejsaren förnödenheter när han kom till Italien. Alessandria grundades på nytt som Caesarea, kejsarens stad. Kommunerna förblev inom riket men styrde sig själva, och 1186 gifte sig Fredriks son Henrik i Milano med Konstantia, arvtagerska till Kungariket Sicilien.
