The imperial officials governed harshly, and resentment spread. In 1164 Verona, Vicenza, Padua and Venice formed the Veronese League, which Frederick, with few troops, could not break. In 1166 he returned with a new army and marched on Rome to install his own pope, besieging Ancona on the way. On 29 May 1167 his commanders Rainald of Dassel and Christian of Mainz routed a much larger Roman army at Monte Porzio near Tusculum, and in July Frederick stormed St Peter’s, held by Alexander III’s supporters. His antipope, Paschal III, crowned him and the empress there.: De kejserliga ämbetsmännen styrde hårt, och missnöjet spred sig. År 1164 bildade Verona, Vicenza, Padua och Venedig Veronesiska förbundet, som Fredrik med sina få trupper inte kunde krossa. År 1166 återvände han med en ny armé och tågade mot Rom för att insätta sin egen påve, och belägrade Ancona på vägen. Den 29 maj 1167 slog hans befälhavare Rainald av Dassel och Christian av Mainz en mycket större romersk armé på flykten vid Monte Porzio nära Tusculum, och i juli stormade Fredrik Peterskyrkan, som hölls av Alexander III:s anhängare. Hans motpåve, Paschalis III, krönte där honom och kejsarinnan.
Days later an epidemic swept the imperial army in the August heat, killing Rainald, thousands of soldiers and many princes. Frederick retreated north through a hostile Lombardy. In his absence the cities had united. In 1167, by tradition after an oath at the abbey of Pontida, Milan’s neighbours, Cremona among them, joined the Lombard League, and in April they helped the Milanese return and rebuild their walls. In March 1168 Frederick slipped back over the Alps in disguise, and the League founded a new fortified city on the Tanaro, naming it Alessandria after the pope.: Några dagar senare drog en epidemi fram genom den kejserliga armén i augustihettan och dödade Rainald, tusentals soldater och många furstar. Fredrik drog sig tillbaka norrut genom ett fientligt Lombardiet. Under hans frånvaro hade städerna enat sig. År 1167, enligt traditionen efter en ed i klostret Pontida, anslöt sig Milanos grannar, bland dem Cremona, till Lombardiska förbundet, och i april hjälpte de milaneserna att återvända och bygga upp sina murar. I mars 1168 tog sig Fredrik förklädd tillbaka över Alperna, och förbundet grundade en ny befäst stad vid Tanaro, som fick namnet Alessandria efter påven.
