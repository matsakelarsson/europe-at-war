Italian campaigns of Frederick Barbarossa: Fredrik Barbarossas italienska fälttåg
The emperor Frederick I’s attempts to restore imperial rights over the self-governing cities of northern Italy. He destroyed Tortona, Crema and Milan, but the Lombard League, formed in 1167 with the backing of Pope Alexander III, defeated him at Legnano in 1176; he made peace with the pope at Venice in 1177 and recognised the cities’ self-government in the Peace of Constance in 1183.: Kejsar Fredrik I:s försök att återupprätta de kejserliga rättigheterna över de självstyrande städerna i norra Italien. Han förstörde Tortona, Crema och Milano, men Lombardiska förbundet, som bildades 1167 med stöd av påven Alexander III, besegrade honom vid Legnano 1176. Han slöt fred med påven i Venedig 1177 och erkände städernas självstyre i freden i Konstanz 1183.
