Frederick, called Barbarossa (“red beard”) by the Italians, led six expeditions to Italy, in 1154–1155, 1158–1162, 1163–1164, 1166–1168, 1174–1178 and 1184–1186. The third and the sixth saw little fighting.: "Fredrik, som italienarna kallade Barbarossa (”rödskägg”), ledde sex expeditioner till Italien: 1154–1155, 1158–1162, 1163–1164, 1166–1168, 1174–1178 och 1184–1186. Under den tredje och den sjätte förekom få strider."
The cities never stood together as a whole. Pavia, and until 1167 Cremona and Lodi, fought on Frederick’s side against Milan, and the League itself was an alliance of old rivals.: Städerna stod aldrig enade alla tillsammans. Pavia, och fram till 1167 Cremona och Lodi, stred på Fredriks sida mot Milano, och själva förbundet var en allians mellan gamla rivaler.
On the map the cities of the League remain part of the Holy Roman Empire, as they did under the Peace of Constance.: På kartan förblir förbundets städer en del av tysk-romerska riket, liksom de gjorde enligt freden i Konstanz.
