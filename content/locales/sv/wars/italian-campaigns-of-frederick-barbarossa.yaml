Frederick’s fifth expedition crossed the Mont Cenis pass in September 1174 and burned Susa, whose townspeople had nearly captured him in 1168. He besieged Alessandria through the winter, but the new city, defended by earthen ramparts, held out, and in April 1175 a League army came to relieve it. At Montebello the two sides agreed preliminaries of peace, which broke down over Alessandria and the pope. Frederick sent to Germany for reinforcements; his cousin Henry the Lion, Duke of Saxony and Bavaria, refused to come.: Fredriks femte expedition gick över Mont Cenis-passet i september 1174 och brände Susa, vars invånare nästan hade tagit honom till fånga 1168. Han belägrade Alessandria hela vintern, men den nya staden, som försvarades av jordvallar, höll stånd, och i april 1175 kom en armé från förbundet för att undsätta den. Vid Montebello kom de två sidorna överens om ett preliminärt fredsavtal, som föll samman i frågan om Alessandria och påven. Fredrik sände bud till Tyskland efter förstärkningar; hans kusin Henrik Lejonet, hertig av Sachsen och Bayern, vägrade att komma.
In May 1176 Frederick met new troops from Germany at Como and set out for Pavia. On 29 May, between Legnano and Borsano, his knights scattered the League’s cavalry and charged the Milanese foot soldiers gathered round the carroccio, the sacred ox-drawn cart that carried the city’s standard. The infantry held until the League’s horsemen, reinforced from Brescia, came back and struck the imperial flank. Frederick’s army broke; he was unhorsed and believed dead, and reached Pavia only days later. Legnano showed that he could not win the war by force.: I maj 1176 mötte Fredrik nya trupper från Tyskland i Como och gav sig av mot Pavia. Den 29 maj, mellan Legnano och Borsano, skingrade hans riddare förbundets kavalleri och anföll de milanesiska fotsoldaterna som samlats kring carroccion, den heliga oxdragna vagn som bar stadens fana. Infanteriet höll stånd tills förbundets ryttare, förstärkta från Brescia, kom tillbaka och slog till mot den kejserliga flanken. Fredriks armé bröt samman; han kastades ur sadeln och troddes vara död, och nådde Pavia först flera dagar senare. Legnano visade att han inte kunde vinna kriget med vapenmakt.
