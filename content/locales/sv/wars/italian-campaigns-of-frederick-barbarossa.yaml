Frederick I was elected King of the Romans in 1152 and meant to restore the emperor’s authority in Italy. The cities of Lombardy had grown rich and governed themselves through elected consuls, collecting tolls and dues that had once belonged to the crown. Milan, the largest, dominated its neighbours and had destroyed Lodi in 1111 and Como in 1127. Frederick crossed the Alps in October 1154 with a small army and held a diet at Roncaglia near Piacenza, where Lodi, Pavia and others brought their complaints against Milan.: Fredrik I valdes till romersk kung 1152 och ämnade återupprätta kejsarens myndighet i Italien. Städerna i Lombardiet hade blivit rika och styrde sig själva genom valda konsuler, som tog upp tullar och avgifter som en gång tillhört kronan. Milano, den största staden, dominerade sina grannar och hade förstört Lodi 1111 och Como 1127. Fredrik gick över Alperna i oktober 1154 med en liten armé och höll en riksdag i Roncaglia nära Piacenza, där Lodi, Pavia och andra framförde sina klagomål mot Milano.
Instead of attacking Milan itself, Frederick besieged its ally Tortona with the help of Pavia, Milan’s rival. The town surrendered in April 1155 after two months and was destroyed. Frederick was crowned King of Italy at Pavia and marched on Rome, where he handed over to the pope Arnold of Brescia, the preacher who had led the Roman commune against papal rule, to be executed. Adrian IV crowned him emperor in St Peter’s on 18 June 1155, while his troops beat off an attack by the Romans. Summer fever thinned his army, and he went home without fighting the Normans of Sicily as he had promised the pope.: I stället för att anfalla Milano självt belägrade Fredrik dess bundsförvant Tortona med hjälp av Pavia, Milanos rival. Staden kapitulerade i april 1155 efter två månader och förstördes. Fredrik kröntes till kung av Italien i Pavia och tågade mot Rom, där han till påven överlämnade Arnold av Brescia, den predikant som lett den romerska kommunen mot påvens styre, för att avrättas. Hadrianus IV krönte honom till kejsare i Peterskyrkan den 18 juni 1155, medan hans trupper slog tillbaka ett anfall från romarna. Sommarfeber decimerade hans armé, och han återvände hem utan att ha bekämpat normanderna på Sicilien som han lovat påven.
