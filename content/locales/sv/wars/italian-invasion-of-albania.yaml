Italian invasion of Albania: Italienska invasionen av Albanien
Italy’s occupation of Albania, long an Italian client state, in April 1939. On Good Friday, 7 April, some 22,000 Italian troops landed at Durrës, Vlorë, Shëngjin and Sarandë against brief resistance, and King Zog fled to Greece with his family. Tirana was occupied on 8 April, an Albanian assembly offered the crown to King Victor Emmanuel III on 12 April, and Albania became a protectorate in personal union with Italy, from which Mussolini attacked Greece in October 1940.: Italiens ockupation i april 1939 av Albanien, som länge varit en italiensk klientstat. På långfredagen den 7 april landsteg omkring 22 000 italienska soldater i Durrës, Vlorë, Shëngjin och Sarandë mot kortvarigt motstånd, och kung Zog flydde med sin familj till Grekland. Tirana ockuperades den 8 april, en albansk församling erbjöd den 12 april kronan till kung Viktor Emanuel III, och Albanien blev ett protektorat i personalunion med Italien, varifrån Mussolini anföll Grekland i oktober 1940.
