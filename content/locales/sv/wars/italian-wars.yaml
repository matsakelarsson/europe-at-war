Louis XII tried again in 1513, now allied with Venice. On 6 June a Swiss army that had marched through the night attacked the French camp at Novara and routed it, and the French left Italy once more. That summer Henry VIII and Maximilian invaded northern France; at Guinegate on 16 August the French cavalry fled so fast that the English called it the Battle of the Spurs, and the allies took Thérouanne and Tournai. The Swiss besieged Dijon in September and were bought off, and the Scots, invading England as France’s allies, were crushed at Flodden. Louis made peace in 1514 and died on 1 January 1515.: Ludvig XII försökte igen 1513, nu i allians med Venedig. Den 6 juni anföll en schweizisk armé som marscherat hela natten det franska lägret vid Novara och slog det på flykten, och fransmännen lämnade Italien ännu en gång. Samma sommar invaderade Henrik VIII och Maximilian norra Frankrike; vid Guinegate den 16 augusti flydde det franska kavalleriet så snabbt att engelsmännen kallade det sporrslaget, och de allierade tog Thérouanne och Tournai. Schweizarna belägrade Dijon i september och köptes bort, och skottarna, som invaderade England som Frankrikes bundsförvanter, krossades vid Flodden. Ludvig slöt fred 1514 och dog den 1 januari 1515.
His successor Francis I, aged twenty, crossed the Alps in August 1515 by the high Col de l’Argentière, avoiding the Swiss who were waiting at Susa. On 13 September the Swiss attacked his camp at Marignano, now Melegnano, south-east of Milan, and fought on into the night. The next morning French guns and cavalry held them until Venetian troops under Alviano arrived, and the Swiss withdrew in good order, leaving perhaps 10,000 dead. The old Marshal Trivulzio called it a battle of giants.: Hans efterträdare Frans I, tjugo år gammal, gick över Alperna i augusti 1515 via det höga Col de l’Argentière och undvek därmed schweizarna som väntade vid Susa. Den 13 september anföll schweizarna hans läger vid Marignano, nuvarande Melegnano, sydost om Milano, och striden fortsatte in i natten. Nästa morgon höll franska kanoner och kavalleri stånd mot dem tills venetianska trupper under Alviano anlände, och schweizarna drog sig tillbaka i god ordning och lämnade kanske 10 000 döda efter sig. Den gamle marskalken Trivulzio kallade det ett jättarnas slag.
Francis entered Milan, and Massimiliano Sforza retired to France on a pension. By the Treaty of Noyon (13 August 1516) Francis kept Milan and left Naples to the young Charles of Habsburg, who had inherited Spain that January; Venice recovered Brescia and, in January 1517, Verona. The Perpetual Peace of Fribourg on 29 November 1516 made the Swiss, who kept Ticino, France’s allies and suppliers of soldiers until the French Revolution.: Frans tågade in i Milano, och Massimiliano Sforza drog sig tillbaka till Frankrike mot en pension. Genom fördraget i Noyon (13 augusti 1516) behöll Frans Milano och lämnade Neapel åt den unge Karl av Habsburg, som i januari samma år hade ärvt Spanien; Venedig återfick Brescia och i januari 1517 Verona. Den eviga freden i Fribourg den 29 november 1516 gjorde schweizarna, som behöll Ticino, till Frankrikes bundsförvanter och leverantörer av soldater ända fram till franska revolutionen.
