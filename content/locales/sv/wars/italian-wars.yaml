Italian Wars: Italienska krigen
Sixty-five years of war for mastery of Italy, fought mainly between the kings of France and the Spanish and Austrian Habsburgs, with Venice, the popes, the Swiss, Milan, Florence and the other Italian states changing sides as their interests shifted. The wars began when Charles VIII of France marched on Naples in 1494 and ended with the Peace of Cateau-Cambrésis in 1559, which left Spain dominant in Italy, holding Milan, Naples, Sicily and Sardinia, while France kept Calais and the bishoprics of Metz, Toul and Verdun.: Sextiofem års krig om herraväldet över Italien, främst mellan Frankrikes kungar och de spanska och österrikiska habsburgarna, där Venedig, påvarna, schweizarna, Milano, Florens och de andra italienska staterna bytte sida allteftersom deras intressen skiftade. Krigen började när Karl VIII av Frankrike marscherade mot Neapel 1494 och slutade med freden i Cateau-Cambrésis 1559, som gjorde Spanien dominerande i Italien med Milano, Neapel, Sicilien och Sardinien, medan Frankrike behöll Calais och biskopsdömena Metz, Toul och Verdun.
