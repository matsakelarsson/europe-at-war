Julius II, pope from 1503, wanted back the Romagna towns that Venice had seized after Cesare Borgia’s fall, and Venice’s growth on the mainland worried all its neighbours. On 10 December 1508 Louis XII and Maximilian I agreed at Cambrai to partition the Venetian mainland, and Julius and Ferdinand of Aragon joined them. In April 1509 the pope placed Venice under an interdict. On 14 May a French army under Louis XII caught the Venetian rearguard of Bartolomeo d’Alviano at Agnadello, near the Adda, and destroyed it while the other Venetian commander, the Count of Pitigliano, kept his men out of the fight.: Julius II, påve från 1503, ville återfå de städer i Romagna som Venedig tagit efter Cesare Borgias fall, och Venedigs expansion på fastlandet oroade alla dess grannar. Den 10 december 1508 kom Ludvig XII och Maximilian I i Cambrai överens om att dela upp Venedigs fastlandsbesittningar, och Julius och Ferdinand av Aragonien anslöt sig. I april 1509 belade påven Venedig med interdikt. Den 14 maj hann en fransk armé under Ludvig XII upp Bartolomeo d’Alvianos venetianska eftertrupp vid Agnadello nära Adda och förintade den, medan den andre venetianske befälhavaren, greven av Pitigliano, höll sina män utanför striden.
Venice’s mainland empire collapsed in weeks. Bergamo, Brescia and Cremona opened their gates to the French; Verona, Vicenza and Padua submitted to Maximilian’s envoys; the Romagna towns went back to the pope and the Apulian ports to Ferdinand. But on 17 July Venetian troops retook Padua, and in September Maximilian besieged it with a huge army and failed. In December Duke Alfonso d’Este of Ferrara destroyed a Venetian river fleet on the Po at Polesella. Julius had got what he wanted; in February 1510 he made peace with Venice and soon turned against the French.: Venedigs fastlandsvälde föll samman på några veckor. Bergamo, Brescia och Cremona öppnade sina portar för fransmännen; Verona, Vicenza och Padua underkastade sig Maximilians sändebud; städerna i Romagna återgick till påven och de apuliska hamnarna till Ferdinand. Men den 17 juli återtog venetianska trupper Padua, och i september belägrade Maximilian staden med en väldig armé utan framgång. I december förintade hertig Alfonso d’Este av Ferrara en venetiansk flodflotta på Po vid Polesella. Julius hade fått vad han ville ha; i februari 1510 slöt han fred med Venedig och vände sig snart mot fransmännen.
