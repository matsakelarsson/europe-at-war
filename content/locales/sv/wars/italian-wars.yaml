By the secret Treaty of Granada of 11 November 1500, Louis XII and Ferdinand of Aragon agreed to depose Frederick of Naples, their kinsman, and share his kingdom. Louis would take Naples, Campania and the Abruzzi with the royal title, and Ferdinand Apulia and Calabria. In the summer of 1501 a French army marched south, stormed Capua on 24 July with great slaughter and entered Naples; Frederick gave up and retired to France. The partners soon quarrelled over the Capitanata, the rich grazing plain the treaty had failed to assign, and by 1502 they were at war.: Genom det hemliga fördraget i Granada den 11 november 1500 kom Ludvig XII och Ferdinand av Aragonien överens om att avsätta sin släkting Fredrik av Neapel och dela hans kungarike. Ludvig skulle ta Neapel, Kampanien och Abruzzerna med kungatiteln, och Ferdinand Apulien och Kalabrien. Sommaren 1501 marscherade en fransk armé söderut, stormade Capua den 24 juli under stort blodbad och tågade in i Neapel; Fredrik gav upp och drog sig tillbaka till Frankrike. Parterna grälade snart om Capitanata, den rika betesslätt som fördraget inte hade tilldelat någon, och 1502 låg de i krig.
Outnumbered, Gonzalo Fernández de Córdoba held out in Barletta through the winter. Reinforced in the spring, he marched out and on 28 April 1503 dug in behind a ditch and bank at Cerignola. The French heavy cavalry and Swiss pikemen of the Duke of Nemours attacked and were shot down by Spanish arquebusiers; Nemours was killed, and Gonzalo entered Naples on 16 May. A new French army came south that autumn and faced him across the Garigliano through weeks of rain.: I numerärt underläge höll Gonzalo Fernández de Córdoba stånd i Barletta under vintern. Förstärkt på våren marscherade han ut och grävde den 28 april 1503 ned sig bakom en grav och en vall vid Cerignola. Hertigen av Nemours tunga franska kavalleri och schweiziska pikenerare anföll och sköts ned av spanska arkebusörer; Nemours stupade, och Gonzalo tågade in i Neapel den 16 maj. En ny fransk armé kom söderut samma höst och stod mot honom på andra sidan Garigliano under veckor av regn.
On the night of 28–29 December Gonzalo crossed the river upstream on a bridge of boats, took the French by surprise and routed them. Gaeta surrendered on 1 January 1504, and an armistice signed at Lyon at the end of the month left the whole kingdom to Ferdinand. Naples, like Sicily and Sardinia, would be ruled by Spanish viceroys for two centuries. In 1505 Louis gave up his claim as the dowry of his niece Germaine de Foix, who married the widowed Ferdinand.: Natten mellan den 28 och 29 december gick Gonzalo över floden längre uppströms på en pontonbro, överrumplade fransmännen och slog dem på flykten. Gaeta kapitulerade den 1 januari 1504, och ett vapenstillestånd som undertecknades i Lyon i slutet av månaden lämnade hela kungariket åt Ferdinand. Neapel skulle, liksom Sicilien och Sardinien, styras av spanska vicekungar i två sekler. År 1505 avstod Ludvig från sitt anspråk som hemgift åt sin systerdotter Germaine de Foix, som gifte sig med den änklinge Ferdinand.
