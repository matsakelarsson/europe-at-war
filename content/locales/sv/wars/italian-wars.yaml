Julius II now meant to drive the French out of Italy; his reported watchword was “Out with the barbarians!” In January 1511, aged sixty-seven, he directed the siege of Mirandola in person through the snow. In October he formed a Holy League with Venice and Ferdinand of Aragon, and Henry VIII of England joined it. Louis XII’s young nephew Gaston de Foix, Duke of Nemours, answered with a lightning campaign. In February 1512 he relieved Bologna, then retook Brescia, which had gone back to Venice, and his troops sacked it, killing thousands of its people.: Julius II ämnade nu driva fransmännen ut ur Italien; hans lösen ska ha varit ”Ut med barbarerna!” I januari 1511 ledde han, sextiosju år gammal, personligen belägringen av Mirandola genom snön. I oktober bildade han en helig liga med Venedig och Ferdinand av Aragonien, och Henrik VIII av England anslöt sig. Ludvig XII:s unge systerson Gaston de Foix, hertig av Nemours, svarade med ett blixtsnabbt fälttåg. I februari 1512 undsatte han Bologna och återtog sedan Brescia, som hade återgått till Venedig, och hans trupper plundrade staden och dödade tusentals av dess invånare.
On Easter Sunday, 11 April 1512, Gaston attacked the Spanish and papal army of Ramón de Cardona, viceroy of Naples, outside Ravenna. After an artillery duel in which Alfonso d’Este’s guns raked the League cavalry from the flank, the French won the bloodiest battle Italy had yet seen, but Gaston was killed pursuing the retreating Spanish infantry, and Ravenna was sacked. Without him the French lost their grip. In May some 18,000 Swiss hired by the pope came down through the Alps, and by the summer the French had abandoned almost all of Lombardy.: På påskdagen den 11 april 1512 anföll Gaston utanför Ravenna den spanska och påvliga armén under Ramón de Cardona, vicekung av Neapel. Efter en artilleriduell där Alfonso d’Estes kanoner besköt ligans kavalleri från flanken vann fransmännen det blodigaste slag Italien dittills skådat, men Gaston stupade när han förföljde det retirerande spanska infanteriet, och Ravenna plundrades. Utan honom förlorade fransmännen greppet. I maj kom omkring 18 000 schweizare, värvade av påven, ned genom Alperna, och till sommaren hade fransmännen övergett nästan hela Lombardiet.
The victors shared the spoils. The Swiss took Lugano, Locarno and the Ossola valley, and the Grisons the Valtellina, Bormio and Chiavenna; the pope took Parma, Piacenza and Reggio. Massimiliano Sforza, Ludovico’s son, entered Milan as duke in December. In August Cardona’s Spaniards sacked Prato, and Florence took back the Medici. Ferdinand of Aragon used the war to seize the Kingdom of Navarre, an ally of France; the Duke of Alba took Pamplona on 25 July 1512, and Upper Navarre was joined to Castile.: Segrarna delade bytet. Schweizarna tog Lugano, Locarno och Ossoladalen, och Graubünden tog Valtellina, Bormio och Chiavenna; påven tog Parma, Piacenza och Reggio. Massimiliano Sforza, Ludovicos son, tågade in i Milano som hertig i december. I augusti plundrade Cardonas spanjorer Prato, och Florens tog tillbaka huset Medici. Ferdinand av Aragonien utnyttjade kriget för att ta Kungariket Navarra, en bundsförvant till Frankrike; hertigen av Alba intog Pamplona den 25 juli 1512, och Övre Navarra förenades med Kastilien.
