In 1519 Charles of Habsburg, already king of Spain, Naples and Sicily and lord of the Netherlands, was elected emperor as Charles V, defeating Francis I’s bid. War between them began in 1521 on several fronts. A French-backed army overran Navarre while Castile was in turmoil and was beaten at Noáin, near Pamplona, on 30 June. In Italy Charles allied with Pope Leo X, and in November an imperial and papal army under Prospero Colonna took Milan from the French commander Lautrec, restoring the Sforza under Francesco II, Ludovico’s younger son.: År 1519 valdes Karl av Habsburg, redan kung av Spanien, Neapel och Sicilien och herre över Nederländerna, till kejsare som Karl V, sedan han besegrat Frans I:s kandidatur. Kriget mellan dem började 1521 på flera fronter. En armé med franskt stöd överskred Navarra medan Kastilien befann sig i oro och besegrades vid Noáin nära Pamplona den 30 juni. I Italien allierade sig Karl med påven Leo X, och i november tog en kejserlig och påvlig armé under Prospero Colonna Milano från den franske befälhavaren Lautrec och återinsatte huset Sforza i person av Francesco II, Ludovicos yngre son.
Lautrec regrouped with Venetian help and Swiss mercenaries. The Swiss, unpaid, demanded battle, and on 27 April 1522 they attacked Colonna’s entrenched camp in the park of the Bicocca, north of Milan, head-on across open ground. Volleys from Spanish arquebusiers behind a sunken road and earthworks shot them down by the thousand, and the survivors marched home. Genoa fell to the imperialists and was sacked on 30 May. In 1524 a new French army was driven out of Lombardy, and the knight Bayard was killed covering its retreat across the Sesia. The imperialists followed it into Provence but failed to take Marseille.: Lautrec samlade sina styrkor på nytt med venetiansk hjälp och schweiziska legosoldater. Schweizarna, som inte fått sin sold, krävde strid, och den 27 april 1522 anföll de Colonnas förskansade läger i parken vid Bicocca norr om Milano rakt framifrån över öppen mark. Salvor från spanska arkebusörer bakom en hålväg och jordverk sköt ned dem i tusental, och de överlevande marscherade hem. Genua föll i de kejserligas händer och plundrades den 30 maj. År 1524 drevs en ny fransk armé ut ur Lombardiet, och riddaren Bayard stupade när han täckte dess reträtt över Sesia. De kejserliga följde efter in i Provence men lyckades inte ta Marseille.
