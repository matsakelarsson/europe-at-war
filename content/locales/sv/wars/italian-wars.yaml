For forty years after the Peace of Lodi of 1454 the Italian states had kept an uneasy balance. Charles VIII of France had inherited the Angevin claim to the Kingdom of Naples, and Ludovico Sforza, who ruled Milan in his young nephew’s name and feared the nephew’s Neapolitan in-laws, encouraged him to press it. In early September 1494 Charles crossed the Alps by the Montgenèvre pass with perhaps 25,000 men and the best siege guns in Europe. His troops sacked Mordano and Fivizzano, killing many of their people, a shock to Italians used to less bloody wars.: Under fyrtio år efter freden i Lodi 1454 hade de italienska staterna upprätthållit en osäker maktbalans. Karl VIII av Frankrike hade ärvt det angevinska anspråket på Kungariket Neapel, och Ludovico Sforza, som styrde Milano i sin unge brorsons namn och fruktade brorsonens neapolitanska svärfamilj, uppmuntrade honom att driva det. I början av september 1494 gick Karl över Alperna via Montgenèvrepasset med kanske 25 000 man och Europas bästa belägringskanoner. Hans trupper plundrade Mordano och Fivizzano och dödade många av invånarna, en chock för italienare som var vana vid mindre blodiga krig.
In Florence, Piero de’ Medici handed over the Tuscan fortresses and was driven out on 9 November; Pisa threw off Florentine rule the same day. Charles entered Florence on 17 November and Rome on 31 December. Alfonso II of Naples abdicated in favour of his son Ferdinand II, whose army melted away. The French stormed Monte San Giovanni in February, killing its garrison and many townspeople, and on 22 February 1495 Charles entered Naples. A new disease, syphilis, spread among the soldiers there and was carried across Europe as the “French disease”.: I Florens överlämnade Piero de’ Medici de toskanska fästningarna och drevs bort den 9 november; Pisa skakade av sig det florentinska styret samma dag. Karl tågade in i Florens den 17 november och i Rom den 31 december. Alfonso II av Neapel abdikerade till förmån för sin son Ferdinand II, vars armé smälte bort. Fransmännen stormade Monte San Giovanni i februari och dödade dess garnison och många av stadens invånare, och den 22 februari 1495 tågade Karl in i Neapel. En ny sjukdom, syfilis, spred sig bland soldaterna där och fördes vidare över Europa som ”den franska sjukan”.
Alarmed, Venice, Milan, Pope Alexander VI, Ferdinand of Aragon and Maximilian I formed the League of Venice on 31 March. Charles left a garrison in Naples and marched north. On 6 July 1495, at Fornovo on the Taro, a larger League army, mostly Venetian and led by Francesco Gonzaga of Mantua, attacked him. It lost more men, but the French lost their baggage, and both sides claimed victory. Charles reached safety and made peace with Milan at Vercelli in October. In the south, Spanish troops under Gonzalo Fernández de Córdoba helped Ferdinand II win back his kingdom; the last French garrisons surrendered in 1496.: Oroade bildade Venedig, Milano, påven Alexander VI, Ferdinand av Aragonien och Maximilian I Venedigligan den 31 mars. Karl lämnade en garnison i Neapel och marscherade norrut. Den 6 juli 1495, vid Fornovo vid floden Taro, anfölls han av en större armé från ligan, mestadels venetiansk och ledd av Francesco Gonzaga av Mantua. Den förlorade fler män, men fransmännen förlorade sin tross, och båda sidor gjorde anspråk på segern. Karl kom i säkerhet och slöt fred med Milano i Vercelli i oktober. I söder hjälpte spanska trupper under Gonzalo Fernández de Córdoba Ferdinand II att återvinna sitt kungarike; de sista franska garnisonerna kapitulerade 1496.
