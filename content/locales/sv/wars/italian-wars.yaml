Within weeks of his release Francis joined Pope Clement VII, Venice, Florence and Francesco Sforza in the League of Cognac (22 May 1526). German landsknechts under Georg von Frundsberg crossed the Alps and joined Bourbon’s Spaniards, and in the spring of 1527 this army, unpaid for months, marched south. On 6 May it stormed the walls of Rome; Bourbon was shot dead on the ladders. For months the soldiers, many of them Lutherans, killed, tortured and plundered, while the pope held out in Castel Sant’Angelo; most of the Swiss Guard died defending him. Rome’s population fell from about 55,000 to perhaps 10,000 through killing, flight, famine and plague.: Inom några veckor efter sin frigivning anslöt sig Frans till påven Clemens VII, Venedig, Florens och Francesco Sforza i Cognacförbundet (22 maj 1526). Tyska lantsknektar under Georg von Frundsberg gick över Alperna och förenade sig med Bourbons spanjorer, och våren 1527 marscherade denna armé, som inte fått sold på månader, söderut. Den 6 maj stormade den Roms murar; Bourbon sköts ihjäl på stormstegarna. I månader dödade, torterade och plundrade soldaterna, av vilka många var lutheraner, medan påven höll ut i Castel Sant’Angelo; större delen av schweizergardet dog när det försvarade honom. Roms befolkning sjönk från omkring 55 000 till kanske 10 000 genom dödande, flykt, svält och pest.
Florence drove out the Medici and restored its republic. A French army under Lautrec besieged Naples in 1528, but the Genoese admiral Andrea Doria, whose galleys were blockading the city, went over to Charles V that summer; plague swept the French camp, Lautrec died in August and his army surrendered. Doria made Genoa an independent republic allied with Spain. After another French defeat at Landriano (21 June 1529), Francis made peace at Cambrai on 3 August. This Ladies’ Peace, negotiated by his mother and Charles’s aunt, gave up his claims in Italy.: Florens fördrev huset Medici och återupprättade sin republik. En fransk armé under Lautrec belägrade Neapel 1528, men den genuesiske amiralen Andrea Doria, vars galärer blockerade staden, gick samma sommar över till Karl V; pesten härjade i det franska lägret, Lautrec dog i augusti och hans armé kapitulerade. Doria gjorde Genua till en självständig republik i allians med Spanien. Efter ett nytt franskt nederlag vid Landriano (21 juni 1529) slöt Frans fred i Cambrai den 3 augusti. Denna damernas fred, som förhandlades fram av hans mor och Karls faster, innebar att han avstod från sina anspråk i Italien.
Charles and Clement were reconciled, and on 24 February 1530 the pope crowned him emperor at Bologna, the last coronation of an emperor by a pope. Florence, left alone, was besieged by an imperial army from October 1529. Its field commander Francesco Ferrucci was defeated and killed at Gavinana on 3 August 1530, in a battle where the imperial commander, the Prince of Orange, also fell, and the city surrendered on 12 August. The pope’s kinsman Alessandro de’ Medici became its ruler, and in 1532 its first duke.: Karl och Clemens försonades, och den 24 februari 1530 krönte påven honom till kejsare i Bologna, den sista gången en kejsare kröntes av en påve. Florens, som nu stod ensamt, belägrades av en kejserlig armé från oktober 1529. Dess fältbefälhavare Francesco Ferrucci besegrades och dödades vid Gavinana den 3 augusti 1530, i ett slag där också den kejserlige befälhavaren, prinsen av Oranien, stupade, och staden kapitulerade den 12 augusti. Påvens släkting Alessandro de’ Medici blev dess härskare och 1532 dess förste hertig.
