Dates are Julian, as usual for the period; the Gregorian calendar came into use only in 1582. Numbers of soldiers and dead come from chroniclers and are often uncertain.: Datumen anges enligt den julianska kalendern, som är brukligt för perioden; den gregorianska kalendern togs i bruk först 1582. Antalet soldater och döda kommer från krönikörer och är ofta osäkert.
Historians divide the wars differently. A common scheme is the Italian War of 1494–1495, the war of 1499–1504, the War of the League of Cambrai (1508–1516), the war of 1521–1526, the War of the League of Cognac (1526–1530) and the wars of 1536–1538, 1542–1546 and 1551–1559. Alliances changed often, so a state shown as an ally of France in one step may be its enemy in the next.: Historiker delar in krigen på olika sätt. En vanlig indelning är italienska kriget 1494–1495, kriget 1499–1504, Kambraiförbundets krig (1508–1516), kriget 1521–1526, Cognacförbundets krig (1526–1530) samt krigen 1536–1538, 1542–1546 och 1551–1559. Allianserna skiftade ofta, så en stat som visas som Frankrikes bundsförvant i ett steg kan vara dess fiende i nästa.
Related wars have their own entries, among them the Swabian War of 1499, Flodden (the Anglo-Scottish War of 1513), the Guelders Wars and the Princes’ Revolt of 1552, in which France took Metz. Charles V’s expeditions against Tunis (1535) and Algiers (1541) are not told here.: Närliggande krig har egna artiklar, bland dem Schwabiska kriget 1499, Flodden (det engelsk-skotska kriget 1513), Geldernkrigen och furstarnas uppror 1552, då Frankrike tog Metz. Karl V:s expeditioner mot Tunis (1535) och Alger (1541) behandlas inte här.
