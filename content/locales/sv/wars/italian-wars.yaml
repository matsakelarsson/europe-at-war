When Francesco II Sforza died childless on 1 November 1535, Charles V kept Milan for his own family, and Francis I went to war again. In 1536 French troops overran Savoy and most of Piedmont, whose duke, Charles III, was the emperor’s ally; France held them for twenty-three years. In July Charles invaded Provence, but Marshal Montmorency stripped the country bare and waited in a fortified camp near Avignon. Hunger and dysentery wrecked the imperial army, which retreated in September. Pope Paul III brought the two rulers to a ten-year truce at Nice on 18 June 1538.: När Francesco II Sforza dog barnlös den 1 november 1535 behöll Karl V Milano åt sin egen familj, och Frans I gick åter i krig. År 1536 överskred franska trupper Savojen och större delen av Piemonte, vars hertig Karl III var kejsarens bundsförvant; Frankrike behöll dem i tjugotre år. I juli invaderade Karl Provence, men marskalk Montmorency skövlade landet och väntade i ett befäst läger nära Avignon. Svält och dysenteri ödelade den kejserliga armén, som retirerade i september. Påven Paulus III förmådde de två härskarna att sluta ett tioårigt stillestånd i Nice den 18 juni 1538.
War came again in 1542. Francis, now openly allied with the Ottoman sultan Suleiman, sent his son Henry to besiege Perpignan, without success, and in August 1543 a Franco-Ottoman fleet under Khair ad-Din Barbarossa bombarded and took the town of Nice, though its castle held out. The Ottoman fleet wintered at Toulon, whose inhabitants had been sent away. On 14 April 1544 the young Count of Enghien won a bloody victory over the Marquis del Vasto at Ceresole in Piedmont, but could not follow it up.: Kriget kom tillbaka 1542. Frans, nu öppet allierad med den osmanske sultanen Süleyman, sände sin son Henrik att belägra Perpignan, utan framgång, och i augusti 1543 bombarderade och intog en fransk-osmansk flotta under Khair ad-Din Barbarossa staden Nice, även om dess borg höll stånd. Den osmanska flottan övervintrade i Toulon, vars invånare hade skickats bort. Den 14 april 1544 vann den unge greven av Enghien en blodig seger över markisen del Vasto vid Ceresole i Piemonte, men kunde inte utnyttja den.
That summer Charles V and Henry VIII invaded northern France. Charles took Saint-Dizier after a six-week siege and advanced towards Paris; Henry took Boulogne in September. On 18 September Charles and Francis made peace at Crépy, giving back their conquests, but England kept Boulogne until 1550. The French stayed in Piedmont, and in 1545 Pope Paul III made his son Pier Luigi Farnese duke of Parma and Piacenza.: Samma sommar invaderade Karl V och Henrik VIII norra Frankrike. Karl tog Saint-Dizier efter en sex veckor lång belägring och ryckte fram mot Paris; Henrik tog Boulogne i september. Den 18 september slöt Karl och Frans fred i Crépy och lämnade tillbaka sina erövringar, men England behöll Boulogne till 1550. Fransmännen stannade i Piemonte, och 1545 gjorde påven Paulus III sin son Pier Luigi Farnese till hertig av Parma och Piacenza.
