Charles VIII died in April 1498, and his cousin and successor Louis XII claimed Milan as well as Naples, through his grandmother Valentina Visconti. He bought the help of Venice, promised Cremona and the Ghiara d’Adda, and of Pope Alexander VI, whose son Cesare Borgia received a French duchy and French troops for his conquests in the Romagna. In August 1499 a French army under the Milanese exile Gian Giacomo Trivulzio invaded the duchy from Asti while the Venetians attacked from the east. Ludovico Sforza fled to the Tyrol, and Louis entered Milan on 6 October.: Karl VIII dog i april 1498, och hans kusin och efterträdare Ludvig XII gjorde anspråk på Milano såväl som Neapel genom sin farmor Valentina Visconti. Han köpte sig Venedigs hjälp genom att lova Cremona och Ghiara d’Adda, och påven Alexander VI:s, vars son Cesare Borgia fick ett franskt hertigdöme och franska trupper för sina erövringar i Romagna. I augusti 1499 invaderade en fransk armé under den milanesiske landsflyktingen Gian Giacomo Trivulzio hertigdömet från Asti medan venetianerna anföll från öster. Ludovico Sforza flydde till Tyrolen, och Ludvig tågade in i Milano den 6 oktober.
French rule soon made enemies, and in February 1500 Ludovico came back with Swiss and German mercenaries and was welcomed in Milan. When the French returned in force, the Swiss on both sides would not fight each other. At Novara on 10 April Ludovico’s Swiss marched off, and he was betrayed and captured while trying to slip away among them disguised as a pikeman. He died a prisoner in France in 1508. The men of Uri, Schwyz and Nidwalden kept Bellinzona, which France ceded to them in 1503.: Det franska styret skaffade sig snart fiender, och i februari 1500 kom Ludovico tillbaka med schweiziska och tyska legosoldater och välkomnades i Milano. När fransmännen återvände med stor styrka ville schweizarna på båda sidor inte strida mot varandra. Vid Novara den 10 april marscherade Ludovicos schweizare därifrån, och han förråddes och tillfångatogs när han försökte smita undan bland dem förklädd till pikenerare. Han dog i fångenskap i Frankrike 1508. Männen från Uri, Schwyz och Nidwalden behöll Bellinzona, som Frankrike avträdde till dem 1503.
