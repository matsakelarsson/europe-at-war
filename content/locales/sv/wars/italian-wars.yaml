In the north the war turned on the frontier between France and the Netherlands. In August 1557 Philip II’s army under Emmanuel Philibert, the exiled Duke of Savoy, besieged Saint-Quentin. On 10 August, the feast of St Lawrence, it caught the relief army of Constable Montmorency as it withdrew and destroyed it; Montmorency was captured, and the town was stormed on 27 August despite Admiral Coligny’s defence. Philip later built the Escorial, dedicated to St Lawrence, in thanks. The road to Paris lay open, but Philip did not take it.: I norr kom kriget att handla om gränsen mellan Frankrike och Nederländerna. I augusti 1557 belägrade Filip II:s armé under Emanuel Filibert, den landsflyktige hertigen av Savojen, Saint-Quentin. Den 10 augusti, på Laurentiusdagen, hann den upp konnetabel Montmorencys undsättningsarmé när den drog sig tillbaka och förintade den; Montmorency tillfångatogs, och staden stormades den 27 augusti trots amiral Colignys försvar. Filip lät senare som tack bygga Escorial, helgat åt den helige Laurentius. Vägen till Paris låg öppen, men Filip tog den inte.
England had joined the war in June 1557, since its queen, Mary I, was Philip’s wife. In midwinter, when no attack was expected, the Duke of Guise struck at Calais, which surrendered on 7 January 1558 after a week’s siege, ending more than two centuries of English rule. In June Guise took Thionville. On 13 July 1558 a French army returning from a raid along the coast was destroyed at Gravelines by Count Egmont, with English ships firing into its flank. Both kings were bankrupt and alarmed by the spread of Protestantism in their lands, and talks began that autumn.: England hade gått in i kriget i juni 1557, eftersom dess drottning, Maria I, var Filips hustru. Mitt i vintern, när inget anfall väntades, slog hertigen av Guise till mot Calais, som kapitulerade den 7 januari 1558 efter en veckas belägring, vilket avslutade mer än två sekler av engelskt styre. I juni tog Guise Thionville. Den 13 juli 1558 förintades en fransk armé som återvände från ett plundringståg längs kusten vid Gravelines av greve Egmont, medan engelska fartyg sköt in i dess flank. Båda kungarna var bankrutta och oroade över protestantismens spridning i deras länder, och förhandlingar inleddes samma höst.
By the treaties of Cateau-Cambrésis (2 and 3 April 1559) France gave up its claims in Italy, handed back Savoy and Piedmont to Emmanuel Philibert, though it kept five fortresses for a time, and returned Corsica to Genoa; it kept Calais and, in practice, Metz, Toul and Verdun. Spain was left master of Milan, Naples, Sicily and Sardinia, and Italy stayed under its sway for a century and a half. At a tournament celebrating the marriages that sealed the peace, Henry II was wounded by a splintered lance and died on 10 July 1559.: Genom fördragen i Cateau-Cambrésis (2 och 3 april 1559) avstod Frankrike från sina anspråk i Italien, lämnade tillbaka Savojen och Piemonte till Emanuel Filibert, även om det behöll fem fästningar för en tid, och återlämnade Korsika till Genua; det behöll Calais och i praktiken Metz, Toul och Verdun. Spanien stod kvar som herre över Milano, Neapel, Sicilien och Sardinien, och Italien förblev under dess inflytande i ett och ett halvt sekel. Vid en tornering för att fira de giftermål som beseglade freden sårades Henrik II av en splittrad lans och dog den 10 juli 1559.
