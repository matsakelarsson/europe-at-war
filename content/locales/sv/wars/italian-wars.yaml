Henry II, who succeeded Francis I in 1547, renewed the war in 1551 in support of Ottavio Farnese, Duke of Parma, and in 1552 he allied with the German Protestant princes and occupied Metz, Toul and Verdun. In July 1552 the people of Siena rose against their Spanish garrison and, with French help, drove it out. In 1553 a French army, carried by the Ottoman fleet, invaded Corsica, which belonged to Genoa, and took most of the island.: Henrik II, som efterträdde Frans I 1547, återupptog kriget 1551 till stöd för Ottavio Farnese, hertig av Parma, och 1552 allierade han sig med de tyska protestantiska furstarna och besatte Metz, Toul och Verdun. I juli 1552 reste sig invånarna i Siena mot sin spanska garnison och drev ut den med fransk hjälp. År 1553 invaderade en fransk armé, som fördes dit av den osmanska flottan, Korsika, som tillhörde Genua, och tog större delen av ön.
Cosimo I de’ Medici, Duke of Florence, joined Charles V against Siena. On 2 August 1554 his army under Gian Giacomo Medici, Marquis of Marignano, routed the Franco-Sienese army of the Florentine exile Piero Strozzi at Marciano in the Val di Chiana. Siena was besieged and starved; much of its countryside was laid waste, and many of its poor were driven out of the city to die between the lines. It surrendered on 17 April 1555, though republicans and French troops held out at Montalcino until 1559. In 1557 Charles’s son Philip II gave Siena to Cosimo as a fief, keeping its coastal fortresses for Spain.: Cosimo I de’ Medici, hertig av Florens, anslöt sig till Karl V mot Siena. Den 2 augusti 1554 slog hans armé under Gian Giacomo Medici, markis av Marignano, den florentinske landsflyktingen Piero Strozzis fransk-sienesiska armé på flykten vid Marciano i Val di Chiana. Siena belägrades och svältes ut; stora delar av dess landsbygd ödelades, och många av dess fattiga drevs ut ur staden för att dö mellan linjerna. Staden kapitulerade den 17 april 1555, även om republikaner och franska trupper höll ut i Montalcino till 1559. År 1557 gav Karls son Filip II Siena till Cosimo som län men behöll dess kustfästningar åt Spanien.
Charles V gave up his thrones in 1555–1556, leaving Spain, Italy and the Netherlands to Philip and the Empire to his brother Ferdinand. A truce agreed at Vaucelles in February 1556 was broken when Pope Paul IV, a Neapolitan bitterly hostile to Spain, called in the French. The Duke of Alba invaded the Papal States from Naples, and a French army under the Duke of Guise marched south in 1557 but failed before Civitella del Tronto. After the French defeat at Saint-Quentin Guise was recalled, and in September 1557 Paul IV made peace with Alba.: Karl V avsade sig sina troner 1555–1556 och lämnade Spanien, Italien och Nederländerna åt Filip och riket åt sin bror Ferdinand. Ett stillestånd som ingåtts i Vaucelles i februari 1556 bröts när påven Paulus IV, en neapolitan med ett bittert hat mot Spanien, kallade in fransmännen. Hertigen av Alba invaderade Kyrkostaten från Neapel, och en fransk armé under hertigen av Guise marscherade söderut 1557 men misslyckades framför Civitella del Tronto. Efter det franska nederlaget vid Saint-Quentin kallades Guise hem, och i september 1557 slöt Paulus IV fred med Alba.
