Francis I came over the Alps himself in October 1524, retook plague-stricken Milan and laid siege to Pavia, held for the emperor by Antonio de Leyva with about 6,000 Spanish and German troops. The siege dragged on through the winter, while Francis sent part of his army south under the Duke of Albany to threaten Naples. In late January an imperial relief army under Charles de Lannoy, viceroy of Naples, the Duke of Bourbon and the Marquis of Pescara came up and dug in facing the French around the walled hunting park of Mirabello, north of the town.: Frans I kom själv över Alperna i oktober 1524, återtog det pesthärjade Milano och belägrade Pavia, som hölls för kejsaren av Antonio de Leyva med omkring 6 000 spanska och tyska soldater. Belägringen drog ut under vintern, medan Frans sände en del av sin armé söderut under hertigen av Albany för att hota Neapel. I slutet av januari kom en kejserlig undsättningsarmé under Charles de Lannoy, vicekung av Neapel, hertigen av Bourbon och markisen av Pescara fram och grävde ned sig mitt emot fransmännen runt den inhägnade jaktparken Mirabello norr om staden.
Before dawn on 24 February 1525, the emperor’s 25th birthday, imperial troops broke through the park wall. Francis led his heavy cavalry in a charge that masked his own guns, and in the fog Spanish arquebusiers and German landsknechts cut the French army apart. Many of France’s leading nobles were killed, and Francis, his horse killed under him, was taken prisoner. He wrote to his mother that nothing was left to him but honour and his life. Taken to Spain, he signed the Treaty of Madrid on 14 January 1526, giving up Burgundy, Milan and Naples, and left his two eldest sons as hostages. Freed in March, he declared that a promise made in prison did not bind him.: Före gryningen den 24 februari 1525, kejsarens 25-årsdag, bröt kejserliga trupper igenom parkmuren. Frans ledde sitt tunga kavalleri i ett anfall som skymde hans egna kanoner, och i dimman skar spanska arkebusörer och tyska lantsknektar sönder den franska armén. Många av Frankrikes främsta adelsmän dödades, och Frans, vars häst sköts under honom, togs till fånga. Han skrev till sin mor att ingenting fanns kvar åt honom utom äran och livet. Han fördes till Spanien och undertecknade freden i Madrid den 14 januari 1526, där han avstod från Burgund, Milano och Neapel, och lämnade sina två äldsta söner som gisslan. Frigiven i mars förklarade han att ett löfte som avgetts i fängelse inte band honom.
