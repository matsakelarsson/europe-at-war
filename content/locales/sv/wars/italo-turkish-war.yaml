Italo-Turkish War: Italiensk-turkiska kriget
A war in which Italy seized the Ottoman provinces of Tripolitania and Cyrenaica, today’s Libya, and occupied the Dodecanese islands in the Aegean. The Ottomans gave up Libya by the Treaty of Ouchy in October 1912, but Libyan resistance to Italian rule went on for twenty years.: Ett krig där Italien erövrade de osmanska provinserna Tripolitanien och Cyrenaika, dagens Libyen, och ockuperade Dodekanesiska öarna i Egeiska havet. Osmanerna avstod Libyen genom freden i Ouchy i oktober 1912, men det libyska motståndet mot det italienska styret fortsatte i tjugo år.
