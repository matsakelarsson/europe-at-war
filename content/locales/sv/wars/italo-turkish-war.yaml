Italy had long claimed Libya, the last Ottoman province in North Africa, and had secured the consent of France and Britain. After the Agadir Crisis of 1911, and with nationalist newspapers promising an easy conquest, the government of Giovanni Giolitti sent an ultimatum and declared war on 29 September 1911. The navy shelled the forts of Tripoli and landed sailors, and in October troops took Tripoli, Tobruk, Derna, Benghazi and Homs. Instead of welcoming the Italians, many Arabs and Berbers joined the small Ottoman garrisons. On 23 October an attack at Shar al-Shatt, on the edge of Tripoli, killed some 500 Italian soldiers, and Italian troops took revenge on the people of the oasis, killing thousands of civilians.: Italien hade länge gjort anspråk på Libyen, den sista osmanska provinsen i Nordafrika, och hade säkrat Frankrikes och Storbritanniens samtycke. Efter Agadirkrisen 1911, och med nationalistiska tidningar som utlovade en lätt erövring, skickade Giovanni Giolittis regering ett ultimatum och förklarade krig den 29 september 1911. Flottan besköt forten i Tripoli och landsatte sjömän, och i oktober intog trupper Tripoli, Tobruk, Derna, Benghazi och Homs. I stället för att välkomna italienarna anslöt sig många araber och berber till de små osmanska garnisonerna. Den 23 oktober dödade ett anfall vid Shar al-Shatt, i utkanten av Tripoli, omkring 500 italienska soldater, och italienska trupper hämnades på oasens invånare och dödade tusentals civila.
On 5 November Italy declared Libya annexed, but its army, eventually some 100,000 men, held little more than the coast. Young Ottoman officers, among them Enver Bey and Mustafa Kemal, slipped into the country through Egypt and Tunisia to organise Arab and Berber fighters, including the Senussi religious order in Cyrenaica, and the war became one of trenches around the Italian-held towns. It was the first war in which aircraft were used. Captain Carlo Piazza flew the first reconnaissance flight on 23 October 1911, and on 1 November Lieutenant Giulio Gavotti dropped the first bombs from an aeroplane.: Den 5 november förklarade Italien Libyen annekterat, men dess armé, till slut omkring 100 000 man, kontrollerade inte mycket mer än kusten. Unga osmanska officerare, bland dem Enver Bey och Mustafa Kemal, tog sig in i landet via Egypten och Tunisien för att organisera arabiska och berbiska krigare, däribland den religiösa senussiorden i Kyrenaika, och kriget blev ett skyttegravskrig runt de italienskkontrollerade städerna. Det var det första krig där flygplan användes. Kapten Carlo Piazza genomförde den första spaningsflygningen den 23 oktober 1911, och den 1 november fällde löjtnant Giulio Gavotti de första bomberna från ett flygplan.
