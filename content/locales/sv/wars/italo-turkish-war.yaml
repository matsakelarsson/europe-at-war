Known in Italy as the Libyan War (Guerra di Libia) and in Turkey as the Tripolitanian War. The Treaty of Ouchy, signed in the lakeside quarter of Lausanne, is also called the First Treaty of Lausanne. Its quick Ottoman defeat encouraged the Balkan states, and the First Balkan War began days before the peace was signed.: I Italien kallas det Libyska kriget (Guerra di Libia) och i Turkiet Tripolitanska kriget. Freden i Ouchy, som undertecknades i stadsdelen vid sjön i Lausanne, kallas också den första freden i Lausanne. Det snabba osmanska nederlaget uppmuntrade Balkanstaterna, och första Balkankriget började några dagar innan freden undertecknades.
Italian losses were about 3,400–6,000 dead, many of them from disease. Ottoman and Libyan losses are less certain; one estimate is about 14,000 killed in action or dead of disease and some 10,000 killed in reprisals and executions.: De italienska förlusterna uppgick till omkring 3 400–6 000 döda, många av dem i sjukdomar. De osmanska och libyska förlusterna är mer osäkra; en uppskattning är omkring 14 000 stupade eller döda i sjukdomar och omkring 10 000 dödade i repressalier och avrättningar.
