Unable to win in Libya, Italy carried the war to the eastern Mediterranean to force the Ottomans to make peace. In February 1912 Italian cruisers sank two Ottoman warships in the harbour of Beirut, killing civilians ashore, and in April they shelled the forts at the mouth of the Dardanelles, which the Ottomans closed to shipping. Between late April and May Italian forces occupied the Dodecanese islands off the Anatolian coast. On Rhodes troops landed on 4 May, and the Ottoman garrison surrendered in the mountains near Psithos on 16–17 May. In July Italian torpedo boats made a night raid into the Dardanelles.: Eftersom Italien inte kunde vinna i Libyen förde landet kriget till östra Medelhavet för att tvinga osmanerna att sluta fred. I februari 1912 sänkte italienska kryssare två osmanska krigsfartyg i Beiruts hamn och dödade civila i land, och i april besköt de forten vid Dardanellernas mynning, som osmanerna stängde för sjöfart. Mellan slutet av april och maj ockuperade italienska styrkor Dodekanesiska öarna utanför den anatoliska kusten. På Rhodos landsteg trupper den 4 maj, och den osmanska garnisonen kapitulerade i bergen nära Psithos den 16–17 maj. I juli genomförde italienska torpedbåtar en nattlig räd in i Dardanellerna.
Talks opened in Switzerland in the summer, and with the Balkan states about to attack, the Ottomans signed the Treaty of Ouchy, near Lausanne, on 18 October 1912. They withdrew their troops and officials from Libya, while the Sultan kept a religious role there. Italy promised to return the Dodecanese once the last Ottoman forces had left Libya, but never did, and Turkey gave up the islands in 1923. In Libya, the Senussi and other fighters kept up their resistance, and Italy was not in control of the whole country until 1932, after a brutal campaign in which tens of thousands of Libyans died.: Förhandlingar inleddes i Schweiz under sommaren, och med Balkanstaterna i begrepp att anfalla undertecknade osmanerna freden i Ouchy nära Lausanne den 18 oktober 1912. De drog tillbaka sina trupper och ämbetsmän från Libyen, medan sultanen behöll en religiös roll där. Italien lovade att lämna tillbaka Dodekanesiska öarna när de sista osmanska styrkorna lämnat Libyen, men gjorde det aldrig, och Turkiet avstod från öarna 1923. I Libyen fortsatte senussierna och andra krigare sitt motstånd, och Italien kontrollerade inte hela landet förrän 1932, efter ett brutalt fälttåg där tiotusentals libyer dog.
