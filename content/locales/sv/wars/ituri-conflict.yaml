# Svenska översättningar av katalogtexten (våg 13); stegtexterna kommer senare.
Ituri conflict: Konflikten i Ituri
? "Last updated 27 November 2026. A conflict in the Ituri region of north-eastern DR Congo, rooted in disputes over land and local power between the mainly pastoralist Hema and the mainly farming Lendu, which became a war during the Second Congo War. In June 1999 the Ugandan army, which occupied the region, made Ituri a province under a Hema governor; Ugandan officers and traders took sides, and fighting between Hema and Lendu spread. Ethnic militias, among them Thomas Lubanga’s Hema UPC, the Lendu FNI, the Ngiti FRPI and PUSIC, backed at different times by Uganda, Rwanda and Kinshasa, fought over Bunia and the gold mines and committed massacres such as Nyankunde in 2002 and Bogoro and Drodro in 2003. When the Ugandan army withdrew in May 2003 and fighting engulfed Bunia, the European Union sent a French-led force (Operation Artemis, June to September 2003) before handing over to the UN mission. Most militias were disarmed by 2007, and in 2012 Lubanga became the first person convicted by the International Criminal Court. Estimates of the dead for 1999–2006 range from more than 50,000 to about 60,000, and some 500,000 people were displaced. From December 2017 violence returned: CODECO, an armed political-religious movement drawn from the Lendu, attacked Hema villages and displacement camps, among them Plaine Savo in 2022 and Djaiba in February 2025, and Hema militias formed in response. In 2025 Uganda sent troops to fight CODECO, and Lubanga, released in 2020, founded a new armed group, the Convention for the Popular Revolution (CRP). In late April 2026 CODECO attacks, in reprisal for a CRP attack, killed at least 69 people, among them militiamen and soldiers; on 23 November the CRP took Iga-Barrière, some 25 km north of Bunia, and on 24 November announced that it would halt its advance and withdraw, citing talks mediated by Uganda."
: "Senast uppdaterad 27 november 2026. En konflikt i regionen Ituri i nordöstra DR Kongo, med rötter i tvister om mark och lokal makt mellan de huvudsakligen boskapsskötande hema och de huvudsakligen jordbrukande lendu, som blev ett krig under andra Kongokriget. I juni 1999 gjorde den ugandiska armén, som ockuperade regionen, Ituri till en provins under en hemaguvernör; ugandiska officerare och handelsmän tog ställning för olika sidor, och striderna mellan hema och lendu spred sig. Etniska miliser, bland dem Thomas Lubangas UPC (hema), lendufolkets FNI, ngitifolkets FRPI och PUSIC, med stöd vid olika tidpunkter av Uganda, Rwanda och Kinshasa, stred om Bunia och guldgruvorna och begick massakrer som de i Nyankunde 2002 och i Bogoro och Drodro 2003. När den ugandiska armén drog sig tillbaka i maj 2003 och striderna uppslukade Bunia sände Europeiska unionen en fransk-ledd styrka (Operation Artemis, juni till september 2003) innan den lämnade över till FN-insatsen. De flesta miliserna hade avväpnats 2007, och 2012 blev Lubanga den förste som dömdes av Internationella brottmålsdomstolen. Uppskattningarna av antalet döda 1999–2006 varierar från mer än 50 000 till omkring 60 000, och omkring 500 000 människor fördrevs. Från december 2017 återkom våldet: CODECO, en väpnad politisk-religiös rörelse med sin bas bland lendu, angrep hemabyar och läger för internflyktingar, bland dem Plaine Savo 2022 och Djaiba i februari 2025, och hemamiliser bildades som svar. År 2025 sände Uganda trupper för att bekämpa CODECO, och Lubanga, som hade frigivits 2020, grundade en ny väpnad grupp, Konventet för folklig revolution (CRP). I slutet av april 2026 dödade CODECO-anfall, som hämnd för ett anfall av CRP, minst 69 människor, bland dem milismän och soldater; den 23 november intog CRP Iga-Barrière, omkring 25 km norr om Bunia, och den 24 november meddelade gruppen att den skulle stoppa sin framryckning och dra sig tillbaka, med hänvisning till samtal under ugandisk medling."
