Dates are Old Style (Julian). The rising was linked to the Williamite War in Ireland, where James himself fought.: Datumen anges enligt den gamla stilen (julianska kalendern). Upproret hängde samman med Vilhelmitiska kriget på Irland, där Jakob själv stred.
