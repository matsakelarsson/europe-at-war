Jacobite rising of 1689: Jakobitupproret 1689
A rising in the Scottish Highlands for the deposed James VII (James II of England), led by John Graham of Claverhouse, Viscount Dundee, who raised the Stuart standard in April 1689 after the Scottish Convention offered the crown to William and Mary. On 27 July his Highlanders routed the government army of Hugh Mackay at Killiecrankie with a downhill charge, but Dundee was killed, and on 21 August the newly raised Cameronian regiment held Dunkeld against them. Major fighting ended when government cavalry surprised and scattered the Jacobites at Cromdale on 1 May 1690. The Highland chiefs agreed to swear allegiance to William and Mary in 1691, and the war is often taken to end with the Massacre of Glencoe in February 1692, when government soldiers killed more than 30 MacDonalds whose chief had been late to take the oath.: Ett uppror i det skotska höglandet för den avsatte Jakob VII (Jakob II av England), lett av John Graham of Claverhouse, viscount Dundee, som reste Stuarts fana i april 1689 sedan det skotska konventet erbjudit kronan till Vilhelm och Maria. Den 27 juli slog hans högländare Hugh Mackays regeringshär på flykt vid Killiecrankie med en anstormning nedför sluttningen, men Dundee stupade, och den 21 augusti höll det nyuppsatta kameronska regementet Dunkeld mot dem. De större striderna upphörde när regeringskavalleri överraskade och skingrade jakobiterna vid Cromdale den 1 maj 1690. Höglandshövdingarna gick 1691 med på att svära Vilhelm och Maria trohet, och kriget anses ofta ha slutat med massakern i Glencoe i februari 1692, då regeringssoldater dödade mer än 30 medlemmar av klanen MacDonald, vars hövding hade avlagt eden för sent.
