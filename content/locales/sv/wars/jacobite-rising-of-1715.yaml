Jacobite rising of 1715: Jakobitupproret 1715
A rising in Scotland and northern England to put James Francis Edward Stuart, son of the deposed James II and VII, on the British throne in place of the Hanoverian George I. The Earl of Mar raised James’s standard at Braemar on 6 September 1715 and soon held Perth and much of the north-east, but he moved slowly. A smaller force of Lowland Scots, Northumbrian and Lancashire Jacobites marched into England and surrendered at Preston on 14 November, the day after Mar’s larger army fought the Duke of Argyll to a draw at Sheriffmuir and then fell back. James himself landed at Peterhead in December, too late; with Dutch troops reinforcing Argyll, he and Mar sailed for France from Montrose on 4 February 1716. Two Jacobite earls were beheaded, and hundreds of prisoners were transported to the colonies.: Ett uppror i Skottland och norra England för att sätta Jakob Frans Edvard Stuart, son till den avsatte Jakob II och VII, på den brittiska tronen i stället för hannoveranen Georg I. Earlen av Mar reste Jakobs fana i Braemar den 6 september 1715 och behärskade snart Perth och stora delar av nordöstra Skottland, men han rörde sig långsamt. En mindre styrka av jakobiter från det skotska låglandet, Northumberland och Lancashire marscherade in i England och kapitulerade vid Preston den 14 november, dagen efter att Mars större här utkämpat ett oavgjort slag mot hertigen av Argyll vid Sheriffmuir och sedan dragit sig tillbaka. Jakob själv landsteg i Peterhead i december, för sent; när holländska trupper förstärkte Argyll seglade han och Mar till Frankrike från Montrose den 4 februari 1716. Två jakobitiska earlar halshöggs, och hundratals fångar deporterades till kolonierna.
