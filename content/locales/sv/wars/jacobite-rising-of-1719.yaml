Jacobite rising of 1719: Jakobitupproret 1719
A Jacobite rising backed by Spain during the War of the Quadruple Alliance. Philip V’s minister, Cardinal Alberoni, planned to land some 5,000 Spanish troops under the exiled Duke of Ormonde in south-west England, with a smaller diversion in Scotland, but storms scattered the main fleet off Cape Finisterre in late March. The Scottish expedition, a few hundred Spanish marines with Jacobite exiles under the Earl Marischal and the Marquess of Tullibardine, landed on Lewis and then at Loch Alsh, using Eilean Donan castle as its base until Royal Navy ships bombarded the castle and blew it up in May. About 1,000 Highlanders joined, but on 10 June 1719 government troops under General Joseph Wightman beat the Jacobites at Glen Shiel. The Highlanders dispersed, and the Spaniards surrendered and were later sent home.: Ett jakobitiskt uppror med spanskt stöd under kvadrupelalliansens krig. Filip V:s minister kardinal Alberoni planerade att landsätta omkring 5 000 spanska soldater under den landsflyktige hertigen av Ormonde i sydvästra England, med en mindre avledningsmanöver i Skottland, men stormar skingrade huvudflottan utanför Kap Finisterre i slutet av mars. Den skotska expeditionen, några hundra spanska marinsoldater med landsflyktiga jakobiter under Earl Marischal och markisen av Tullibardine, landsteg på Lewis och sedan vid Loch Alsh och använde borgen Eilean Donan som bas tills Royal Navys fartyg bombarderade borgen och sprängde den i maj. Omkring 1 000 högländare anslöt sig, men den 10 juni 1719 besegrade regeringstrupper under general Joseph Wightman jakobiterna vid Glen Shiel. Högländarna skingrades, och spanjorerna kapitulerade och skickades senare hem.
