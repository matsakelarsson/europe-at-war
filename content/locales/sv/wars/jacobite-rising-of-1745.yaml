Dates are Old Style (Julian), as usual in British accounts; on the Continent, which used the Gregorian calendar, they were eleven days later, so Culloden was fought on 27 April 1746 New Style.: Datumen anges enligt den gamla stilen (julianska kalendern), som är brukligt i brittiska framställningar; på kontinenten, där den gregorianska kalendern användes, låg de elva dagar senare, så slaget vid Culloden utkämpades den 27 april 1746 enligt den nya stilen.
Known in Scotland as “the Forty-Five”. Britain and France were at war in the War of the Austrian Succession; France sent the Jacobites money, arms and a few hundred regular soldiers of its Scottish and Irish regiments, but its planned invasion of England never sailed. Many Scots, including whole clans and most of the Lowlands, sided with the government.: Kallas i Skottland ”the Forty-Five”. Storbritannien och Frankrike låg i krig med varandra i österrikiska tronföljdskriget; Frankrike skickade jakobiterna pengar, vapen och några hundra reguljära soldater ur sina skotska och irländska regementen, men den planerade invasionen av England avseglade aldrig. Många skottar, bland dem hela klaner och större delen av Lågländerna, ställde sig på regeringens sida.
