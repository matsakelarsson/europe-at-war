Jacobite rising of 1745: Jakobitupproret 1745
The last Jacobite rising, in which Charles Edward Stuart, the grandson of the deposed James II and VII, tried to win back the British thrones for his father. Raising the Highland clans in August 1745, he took Edinburgh, routed the government army at Prestonpans and marched into England as far as Derby, but turned back, and after a last victory at Falkirk his army was destroyed at Culloden in April 1746. Harsh repression in the Highlands followed.: Det sista jakobitiska upproret, där Karl Edvard Stuart, sonson till den avsatte Jakob II och VII, försökte återvinna de brittiska tronerna åt sin far. Han samlade höglandsklanerna i augusti 1745, tog Edinburgh, slog regeringshären på flykt vid Prestonpans och marscherade in i England ända till Derby, men vände om, och efter en sista seger vid Falkirk förintades hans här vid Culloden i april 1746. Därefter följde ett hårt förtryck i höglandet.
