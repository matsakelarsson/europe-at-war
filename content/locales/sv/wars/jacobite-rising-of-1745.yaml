Charles insisted on invading England, against the doubts of his commanders, hoping that English Jacobites would rise and that France would land an army in the south. On 8 November about 5,500 men crossed the border. They took Carlisle after a short siege on 15 November and marched south through Lancashire, avoiding Marshal Wade’s army at Newcastle. Few Englishmen joined them, apart from the 300 or so of the Manchester Regiment, raised in Manchester. On 4 December the Jacobites reached Derby, about 200 km from London, where the news caused alarm and a run on the Bank of England.: Karl insisterade på att invadera England, trots sina befälhavares tvivel, i hopp om att engelska jakobiter skulle resa sig och att Frankrike skulle landsätta en armé i söder. Den 8 november gick omkring 5 500 man över gränsen. De tog Carlisle efter en kort belägring den 15 november och marscherade söderut genom Lancashire och undvek marskalk Wades armé vid Newcastle. Få engelsmän anslöt sig till dem, bortsett från de omkring 300 i Manchester Regiment, som rekryterades i Manchester. Den 4 december nådde jakobiterna Derby, omkring 200 km från London, där nyheten väckte oro och en rusning mot Bank of England.
By then the Duke of Cumberland’s army was in the Midlands, Wade’s was moving south behind the Jacobites, and a third was gathering to defend London. At a council of war in Derby on 5 December Lord George Murray and the other commanders, seeing no sign of an English rising or a French landing, insisted on retreat, and Charles bitterly gave way. A government agent had also falsely reported another army blocking the road at Northampton. The retreat began on 6 December. Murray’s rearguard fought off Cumberland’s advance guard at Clifton Moor on 18 December, and the army recrossed the border on 20 December, leaving a garrison in Carlisle that surrendered to Cumberland ten days later.: Vid det laget befann sig hertigen av Cumberlands armé i Midlands, Wades armé rörde sig söderut bakom jakobiterna och en tredje samlades för att försvara London. Vid ett krigsråd i Derby den 5 december insisterade lord George Murray och de andra befälhavarna, som inte såg några tecken på ett engelskt uppror eller en fransk landstigning, på reträtt, och Karl gav bittert med sig. En regeringsagent hade dessutom falskt rapporterat att ytterligare en armé spärrade vägen vid Northampton. Reträtten inleddes den 6 december. Murrays eftertrupp slog tillbaka Cumberlands förtrupp vid Clifton Moor den 18 december, och armén gick tillbaka över gränsen den 20 december och lämnade en garnison i Carlisle som kapitulerade för Cumberland tio dagar senare.
