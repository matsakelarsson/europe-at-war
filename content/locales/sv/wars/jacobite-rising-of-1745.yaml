Britain was at war with France, and in 1744 a French invasion planned in support of the Stuarts had been called off after storms wrecked its transports. Charles Edward Stuart, the 24-year-old son of the exiled James Francis Edward, decided to go anyway. He landed on Eriskay in the Outer Hebrides on 23 July 1745 with seven companions, and two days later on the mainland at Loch nan Uamh. Many clan chiefs urged him to go home, but Donald Cameron of Lochiel and the MacDonalds of Keppoch and Clanranald joined him, and on 19 August he raised his father’s standard at Glenfinnan.: Storbritannien låg i krig med Frankrike, och 1744 hade en fransk invasion som planerats till stöd för huset Stuart avblåsts sedan stormar förstört transportfartygen. Karl Edvard Stuart, den 24-årige sonen till den landsflyktige Jakob Frans Edvard, beslöt att ge sig av ändå. Han landsteg på Eriskay i Yttre Hebriderna den 23 juli 1745 med sju följeslagare, och två dagar senare på fastlandet vid Loch nan Uamh. Många klanhövdingar uppmanade honom att resa hem, men Donald Cameron av Lochiel och MacDonalds av Keppoch och Clanranald anslöt sig till honom, och den 19 augusti reste han sin fars fana vid Glenfinnan.
Most of the British army was fighting in Flanders. Sir John Cope marched north with the small army in Scotland but avoided the Jacobites waiting in the Corrieyairack Pass and went on to Inverness, leaving the road south open. The Jacobites entered Perth and, on 17 September, Edinburgh, though its castle held out; Charles proclaimed his father king as James VIII. Cope brought his army back by sea to Dunbar, and at dawn on 21 September the Highlanders charged it across the fields at Prestonpans. Cope’s army broke within minutes and lost most of its infantry killed or captured, and for a time the Jacobites controlled most of Scotland.: Större delen av den brittiska armén stred i Flandern. Sir John Cope marscherade norrut med den lilla armén i Skottland men undvek jakobiterna som väntade i Corrieyairackpasset och fortsatte till Inverness, vilket lämnade vägen söderut öppen. Jakobiterna tågade in i Perth och den 17 september i Edinburgh, även om stadens borg höll stånd; Karl utropade sin far till kung som Jakob VIII. Cope förde tillbaka sin armé sjövägen till Dunbar, och i gryningen den 21 september anföll högländarna den över fälten vid Prestonpans. Copes armé bröt samman inom några minuter och förlorade större delen av sitt infanteri i döda eller fångna, och för en tid kontrollerade jakobiterna större delen av Skottland.
