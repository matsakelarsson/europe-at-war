Back in Scotland the Jacobites gathered reinforcements, among them French regulars of the Royal Écossais and the Irish Picquets who had landed on the east coast, and besieged Stirling Castle. On 17 January 1746 General Henry Hawley marched to relieve it and was beaten at Falkirk Muir in a storm of wind and rain, but the Jacobites did not follow up. Stirling held out, and as Cumberland advanced from Edinburgh the clan chiefs insisted on a retreat into the Highlands. They took Inverness and Fort Augustus but failed to take Fort William, while Cumberland drilled his army at Aberdeen and the Royal Navy stopped most French supplies from getting through.: Tillbaka i Skottland samlade jakobiterna förstärkningar, bland dem franska reguljära soldater ur Royal Écossais och Irish Picquets som hade landstigit på östkusten, och belägrade Stirling Castle. Den 17 januari 1746 marscherade general Henry Hawley för att undsätta borgen och besegrades vid Falkirk Muir i storm och regn, men jakobiterna utnyttjade inte segern. Stirling höll stånd, och när Cumberland ryckte fram från Edinburgh insisterade klanhövdingarna på en reträtt in i Högländerna. De tog Inverness och Fort Augustus men lyckades inte ta Fort William, medan Cumberland exercerade sin armé i Aberdeen och Royal Navy hindrade de flesta franska förnödenheter från att komma fram.
In April Cumberland marched west from Aberdeen. A Jacobite night march to surprise his camp at Nairn failed, and on 16 April the hungry and exhausted Jacobite army, about 5,000 strong, stood on open moorland at Culloden, east of Inverness, against about 8,000 government troops. Cumberland’s artillery tore into the Highland line, and its charge, when it came, broke on musketry and bayonets within an hour. Some 1,500 to 2,000 Jacobites died, many of them wounded men and fugitives killed after the battle; the government lost about 50 killed and 250 wounded. Charles, helped by Flora MacDonald among others, escaped to France in September. Government troops burned and plundered across the Highlands; about 120 Jacobites were executed and hundreds transported, and Parliament banned Highland dress and abolished the chiefs’ hereditary jurisdictions.: I april marscherade Cumberland västerut från Aberdeen. En nattlig marsch för att överraska hans läger vid Nairn misslyckades, och den 16 april stod den hungriga och utmattade jakobitiska armén, omkring 5 000 man stark, på den öppna heden vid Culloden öster om Inverness mot omkring 8 000 regeringssoldater. Cumberlands artilleri slet upp högländarnas linje, och när deras anfall väl kom bröt det samman mot musköteld och bajonetter inom en timme. Omkring 1 500 till 2 000 jakobiter dog, många av dem sårade och flyende som dödades efter slaget; regeringen förlorade omkring 50 döda och 250 sårade. Karl, som bland andra fick hjälp av Flora MacDonald, flydde till Frankrike i september. Regeringstrupper brände och plundrade över hela Högländerna; omkring 120 jakobiter avrättades och hundratals deporterades, och parlamentet förbjöd högländsk dräkt och avskaffade hövdingarnas ärftliga domsrätt.
