Jacquerie: Jacquerien
A peasant rising in the Beauvaisis and neighbouring districts north of Paris in late May and June 1358, two years after the capture of King John II at Poitiers. Led by Guillaume Cale, bands of rebels, called Jacques, burned noble houses and killed many nobles and their families, and Étienne Marcel’s Paris briefly made common cause with them. On 9–10 June the nobles, led by Charles II of Navarre, crushed the rebels at Mello and Meaux, and thousands of peasants were killed in the reprisals that followed.: Ett bondeuppror i Beauvaisis och angränsande områden norr om Paris i slutet av maj och i juni 1358, två år efter att kung Johan II tagits till fånga vid Poitiers. Under ledning av Guillaume Cale brände upprorsband, kallade Jacques, adelns gårdar och dödade många adelsmän och deras familjer, och Étienne Marcels Paris gjorde en kort tid gemensam sak med dem. Den 9–10 juni krossade adeln, ledd av Karl II av Navarra, upprorsmännen vid Mello och Meaux, och tusentals bönder dödades i de repressalier som följde.
