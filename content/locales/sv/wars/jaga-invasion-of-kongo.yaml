# Svenska översättningar av katalogtexten (våg 13); stegtexterna kommer senare.
Jaga invasion of Kongo: Jagainvasionen i Kongo
? "The invasion of the Kingdom of Kongo by warriors the Portuguese called “Jaga”, and the Portuguese expedition that restored King Álvaro I. In the traditional account, taken from the book that Kongo’s ambassador Duarte Lopes gave to Filippo Pigafetta in Rome (1591), the Jaga crossed into Kongo from the east in 1568, soon after Álvaro I came to the throne, routed his army and sacked the capital, Mbanza Kongo. The king and his court fled to an island in the Congo River, where, Pigafetta wrote, hunger and disease killed many and starving refugees sold one another as slaves to Portuguese traders from São Tomé for food. Álvaro appealed to King Sebastian of Portugal, who sent about 600 soldiers, most of them from São Tomé, under Francisco de Gouveia Sottomaior, the island’s governor. With them and Kongo’s own forces Álvaro took back his capital and drove the invaders out by the mid-1570s; the Jaga remained a power on the eastern frontier and later served Kongo’s rival kings as mercenaries. The price of the rescue was Portuguese influence: Álvaro let Paulo Dias de Novais found a colony at Luanda in 1575–1576, on land that Kongo claimed, and Portuguese priests gained a voice at court. Who the Jaga were is debated. Older writers linked them with the Imbangala of Angola, whom the Portuguese also called Jaga; Joseph Miller (1972) showed that the two were different groups, and many historians have identified the invaders with people from the Kwango valley later known as the Yaka. John Thornton (2022), using newly found documents, among them a petition by the Jesuit João Ribeiro Gaio, who served with the Portuguese relief army from 1571 to 1575, argues that the invasion had begun by 1567, under King Bernardo I, whom a contemporary testimony says the Jaga killed; that the invaders were a small, skilled army that came through the empire of Mwene Muji, near Lake Mai-Ndombe, and had “no domicile nor a king of their own”, rather than a migrating people; and that they were expelled around 1575."
: "Invasionen av Kongoriket av krigare som portugiserna kallade ”jaga”, och den portugisiska expedition som återinsatte kung Álvaro I. Enligt den traditionella berättelsen, hämtad ur den bok som Kongos sändebud Duarte Lopes gav Filippo Pigafetta i Rom (1591), gick jaga in i Kongo från öster 1568, strax efter att Álvaro I hade bestigit tronen, slog hans armé på flykten och plundrade huvudstaden Mbanza Kongo. Kungen och hans hov flydde till en ö i Kongofloden, där, skrev Pigafetta, hunger och sjukdomar dödade många och svältande flyktingar sålde varandra som slavar till portugisiska handelsmän från São Tomé i utbyte mot mat. Álvaro vädjade till kung Sebastian av Portugal, som sände omkring 600 soldater, de flesta från São Tomé, under öns guvernör Francisco de Gouveia Sottomaior. Med dem och Kongos egna styrkor återtog Álvaro sin huvudstad och drev ut inkräktarna vid mitten av 1570-talet; jaga förblev en makt vid den östra gränsen och tjänade senare Kongos rivaliserande kungar som legosoldater. Priset för räddningen var portugisiskt inflytande: Álvaro lät Paulo Dias de Novais grunda en koloni i Luanda 1575–1576, på mark som Kongo gjorde anspråk på, och portugisiska präster fick en röst vid hovet. Vilka jaga var är omstritt. Äldre författare förknippade dem med imbangala i Angola, som portugiserna också kallade jaga; Joseph Miller (1972) visade att det rörde sig om två olika grupper, och många historiker har identifierat inkräktarna med folk från Kwangodalen som senare blev kända som yaka. John Thornton (2022) hävdar, med stöd av nyfunna dokument, bland dem en petition av jesuiten João Ribeiro Gaio, som tjänade i den portugisiska undsättningsarmén från 1571 till 1575, att invasionen hade börjat senast 1567, under kung Bernardo I, som enligt ett samtida vittnesmål dödades av jaga; att inkräktarna var en liten, skicklig armé som kom genom Mwene Mujis rike nära Mai-Ndombesjön och hade ”varken hemvist eller någon egen kung”, snarare än ett folk på vandring; och att de fördrevs omkring 1575."
