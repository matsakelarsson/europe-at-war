# Svenska översättningar av katalogtexten (våg 7); stegtexterna kommer senare.
Campaigns of Jalal al-Din Mangburni: Jalal al-Din Mangburnis fälttåg
The wars of the last Khwarazmshah, Jalal al-Din Mangburni, after Genghis Khan destroyed his father’s empire. Having escaped across the Indus in 1221, he spent three years in the Punjab and Sind, then came back to Iran in 1224 and built a new realm in Kerman, Fars, central Iran and Azerbaijan, taking Tabriz from the Eldiguzids in 1225. He crushed the Georgians at Garni and sacked Tbilisi, fought the Abbasid caliph and the Mongols, and took the Ayyubid town of Akhlat in 1230 after a long siege. That conquest united the Seljuks of Rum and the Ayyubids against him, and they defeated him near Erzincan in August 1230. When a new Mongol army came in 1231 his followers scattered, and he was killed by a Kurd near Mayyafariqin in August 1231.: De krig som den siste khwarazmshahen, Jalal al-Din Mangburni, förde sedan Djingis khan hade förintat hans fars rike. Efter att ha flytt över Indus 1221 tillbringade han tre år i Punjab och Sind, återvände 1224 till Iran och byggde upp ett nytt rike i Kerman, Fars, centrala Iran och Azerbajdzjan, där han 1225 tog Tabriz från eldiguziderna. Han krossade georgierna vid Garni och plundrade Tbilisi, stred mot den abbasidiske kalifen och mot mongolerna och intog 1230 efter en lång belägring den ayyubidiska staden Akhlat. Den erövringen förenade rumseldjukerna och ayyubiderna mot honom, och de besegrade honom nära Erzincan i augusti 1230. När en ny mongolisk armé kom 1231 skingrades hans anhängare, och han dödades av en kurd nära Mayyafariqin i augusti 1231.
