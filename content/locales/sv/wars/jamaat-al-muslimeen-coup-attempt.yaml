# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
Jamaat al Muslimeen coup attempt: Jamaat al Muslimeens kuppförsök
? An attempt by the Jamaat al Muslimeen, a Muslim organisation led by Yasin Abu Bakr, a former police officer, to overthrow the government of Trinidad and Tobago. The group had long been in dispute with the state over land at No. 1 Mucurapo Road in Port of Spain, which it occupied and where a court had ordered it to leave, and it condemned the hardship caused by the austerity of Prime Minister A. N. R. Robinson’s government; its armed men had also run anti-drug patrols, and a police raid on its compound in 1988 deepened the quarrel. At about 6 p.m. on Friday 27 July 1990, shortly after a bomb went off at police headquarters, 42 armed members led by Bilaal Abdullah stormed the Red House, the seat of Parliament, during a sitting and took Robinson and most of his cabinet hostage, while Abu Bakr and 72 others seized the state television station, Trinidad and Tobago Television, from which he announced that the government had been overthrown. Robinson was beaten and shot in the leg after calling on the army to attack. While the police and the Trinidad and Tobago Defence Force surrounded the two buildings, widespread looting and arson broke out in Port of Spain and along the East–West Corridor, and a curfew was imposed. After six days of negotiation the insurgents released their hostages and surrendered on 1 August in return for a written amnesty. About 24 people died, among them the member of Parliament Leo Des Vignes, and many more were injured; losses from looting and arson were later estimated at TT$450 million. The insurgents were charged with treason, but the courts upheld the amnesty and they were freed in 1992; the Privy Council later held that the amnesty was invalid but that they could not be re-arrested. A Commission of Enquiry reported in 2014 that the security services had failed to act on warnings of the attack.
: Ett försök av Jamaat al Muslimeen, en muslimsk organisation ledd av den före detta polisen Yasin Abu Bakr, att störta Trinidad och Tobagos regering. Gruppen hade länge legat i tvist med staten om mark på No. 1 Mucurapo Road i Port of Spain, som den ockuperade och som en domstol hade beordrat den att lämna, och den fördömde de umbäranden som premiärminister A. N. R. Robinsons regerings åtstramningspolitik orsakade; dess beväpnade män hade också patrullerat mot narkotikahandeln, och en polisräd mot dess område 1988 fördjupade konflikten. Omkring klockan 6 på kvällen fredagen den 27 juli 1990, strax efter att en bomb hade exploderat vid polisens högkvarter, stormade 42 beväpnade medlemmar under ledning av Bilaal Abdullah Red House, parlamentets säte, under ett sammanträde och tog Robinson och större delen av hans regering som gisslan, medan Abu Bakr och 72 andra intog den statliga tv-stationen Trinidad and Tobago Television, varifrån han meddelade att regeringen hade störtats. Robinson misshandlades och sköts i benet sedan han hade uppmanat armén att anfalla. Medan polisen och Trinidad och Tobagos försvarsmakt omringade de två byggnaderna utbröt omfattande plundring och mordbränder i Port of Spain och längs East–West Corridor, och utegångsförbud infördes. Efter sex dagars förhandlingar släppte upprorsmännen sin gisslan och kapitulerade den 1 augusti mot en skriftlig amnesti. Omkring 24 personer dog, bland dem parlamentsledamoten Leo Des Vignes, och många fler skadades; förlusterna genom plundring och mordbränder beräknades senare till 450 miljoner trinidaddollar. Upprorsmännen åtalades för högförräderi, men domstolarna fann amnestin giltig, och de frigavs 1992; Privy Council fann senare att amnestin var ogiltig men att de inte kunde gripas på nytt. En undersökningskommission konstaterade 2014 att säkerhetstjänsterna hade underlåtit att agera på varningar om attacken.
