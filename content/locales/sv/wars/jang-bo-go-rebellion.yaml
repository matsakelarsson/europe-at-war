# Svenska översättningar av katalogtexten (våg 10); stegtexterna kommer senare.
Jang Bo-go and the fall of Cheonghaejin: Jang Bo-go och Cheonghaejins fall
? The conflict between the Silla court and Jang Bo-go, the commander of the Cheonghaejin garrison on Wando, which ended with his killing and the closing of the garrison. Jang Bo-go, a man of humble origins from the south-western islands, had served as an officer in Tang China and, after returning to Silla, persuaded King Heungdeok in 828 to let him set up a garrison of 10,000 men at Cheonghae (Wando) to stop the slave raiders who seized Silla people on the coasts. From there his fleet dominated the trade between Silla, Tang China and Heian Japan. In 838–839 he sent 5,000 men to help Kim U-jing seize the throne; they defeated the royal army, King Minae was killed, and Kim U-jing became King Sinmu. Sinmu’s son, King Munseong, promised to take Jang Bo-go’s daughter as a royal consort, but court nobles objected to his low birth. According to the Samguk sagi, Jang Bo-go then turned against the king, and the court sent Yeom Jang, a former follower of his, who pretended to defect to him and killed him at a banquet. Jang Bo-go’s officer Yi Chang-jin and others held out at Cheonghaejin until Yeom Jang defeated them. In 851 the court abolished the garrison and moved its people to Byeokgol (Gimje).
: Konflikten mellan Sillahovet och Jang Bo-go, befälhavaren för garnisonen Cheonghaejin på Wando, som slutade med att han dödades och garnisonen stängdes. Jang Bo-go, en man av ringa härkomst från de sydvästra öarna, hade tjänat som officer i Tangriket och efter sin återkomst till Silla övertalat kung Heungdeok att 828 låta honom upprätta en garnison på 10 000 man i Cheonghae (Wando) för att stoppa de slavjägare som rövade bort Sillas folk från kusterna. Därifrån dominerade hans flotta handeln mellan Silla, Tangriket och Heiantidens Japan. Åren 838–839 sände han 5 000 man för att hjälpa Kim U-jing att ta tronen; de besegrade den kungliga armén, kung Minae dödades och Kim U-jing blev kung Sinmu. Sinmus son, kung Munseong, lovade att ta Jang Bo-gos dotter till kunglig gemål, men adelsmän vid hovet invände mot hans låga börd. Enligt Samguk sagi vände sig Jang Bo-go då mot kungen, och hovet sände Yeom Jang, en före detta anhängare till honom, som låtsades gå över till honom och dödade honom vid en bankett. Jang Bo-gos officer Yi Chang-jin och andra höll stånd i Cheonghaejin tills Yeom Jang besegrade dem. År 851 avskaffade hovet garnisonen och flyttade dess folk till Byeokgol (Gimje).
