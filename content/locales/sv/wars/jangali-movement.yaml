# Svenska översättningar av katalogtexten (våg 7); stegtexterna kommer senare.
Jangali movement: Jangalirörelsen
A rising in the forests of Gilan, on Iran’s Caspian coast, led by Mirza Kuchik Khan, a veteran of the Constitutional Revolution. His Jangalis (“men of the forest”) fought for reform and against foreign occupation, first the Russian troops in the north, then the British force that crossed Gilan in 1918, which they fought at Manjil on 12 June 1918 before coming to terms. In May 1920 the Soviet Red Fleet landed at Anzali in pursuit of White Russian ships, and in early June Kuchik Khan proclaimed the Persian Socialist Soviet Republic in Rasht with Soviet support. The alliance with the Iranian communists broke up within weeks. After the Soviet–Iranian treaty of February 1921 the Soviets withdrew, the Cossack forces of Reza Khan retook Gilan, and Kuchik Khan died of cold in the Talysh mountains on 2 December 1921; his head was cut off and sent to Reza Khan in Tehran.: Ett uppror i skogarna i Gilan, vid Irans kaspiska kust, lett av Mirza Kuchik Khan, en veteran från den konstitutionella revolutionen. Hans jangalier (”skogens män”) kämpade för reformer och mot utländsk ockupation, först mot de ryska trupperna i norr och sedan mot den brittiska styrka som drog genom Gilan 1918 och som de stred mot vid Manjil den 12 juni 1918 innan de kom till en överenskommelse. I maj 1920 landsteg den sovjetiska Röda flottan i Anzali i jakt på de vitas fartyg, och i början av juni utropade Kuchik Khan med sovjetiskt stöd Persiska socialistiska sovjetrepubliken i Rasht. Alliansen med de iranska kommunisterna bröts upp inom några veckor. Efter det sovjetisk-iranska fördraget i februari 1921 drog sig sovjetstyrkorna tillbaka, Reza Khans kosackstyrkor återtog Gilan, och Kuchik Khan frös ihjäl i Talyshbergen den 2 december 1921; hans huvud skars av och sändes till Reza Khan i Teheran.
