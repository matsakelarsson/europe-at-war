# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
January 28 Incident: Incidenten den 28 januari
? Five weeks of fighting between Japan and China in and around Shanghai in early 1932, also called the Shanghai Incident or the Shanghai War of 1932. Anger at the Japanese seizure of Manchuria had brought a boycott of Japanese goods in Shanghai. On 18 January five Japanese Nichiren monks were beaten by a crowd in the city and one of them died; a Japanese officer, Tanaka Ryūkichi, later said he had paid for the attack. Japanese residents retaliated, Japan sent warships and demanded that the boycott end, and on the night of 28 January Japanese naval landing troops moved into the Chinese district of Zhabei. The Cantonese 19th Route Army under Jiang Guangnai and Cai Tingkai fought back, joined in February by the Fifth Army under Zhang Zhizhong. Japanese aircraft and guns bombed Zhabei, where the Commercial Press and the Oriental Library burned, and Japan brought in army divisions under Shirakawa Yoshinori, about 30,000 men against about 50,000 Chinese. After a landing at Liuhe on 1 March outflanked them, the Chinese armies withdrew, and Japan halted the fighting on 3 March. Japan reported 738 dead and 2,257 wounded; the Chinese reported 14,801 soldiers killed, wounded or missing, and Western estimates put civilian deaths at about 10,000. The Shanghai Ceasefire Agreement of 5 May 1932, brokered with League of Nations and Western help, made a zone around Shanghai in which China could keep no troops, only police. On 29 April the Korean independence activist Yun Bong-gil threw a bomb at a celebration in Hongkou Park; Shirakawa died of his wounds.
: Fem veckors strider mellan Japan och Kina i och kring Shanghai i början av 1932, även kallade Shanghaiincidenten eller Shanghaikriget 1932. Vreden över Japans erövring av Manchuriet hade lett till en bojkott av japanska varor i Shanghai. Den 18 januari misshandlades fem japanska nichirenmunkar av en folkmassa i staden, och en av dem dog; en japansk officer, Tanaka Ryūkichi, uppgav senare att han hade betalat för angreppet. Japanska invånare tog hämnd, Japan sände krigsfartyg och krävde att bojkotten skulle upphöra, och natten den 28 januari ryckte japanska marina landstigningstrupper in i det kinesiska distriktet Zhabei. Den kantonesiska 19:e routearmén under Jiang Guangnai och Cai Tingkai slog tillbaka och fick i februari förstärkning av Femte armén under Zhang Zhizhong. Japanska flygplan och kanoner bombarderade Zhabei, där Commercial Press och Orientaliska biblioteket brann, och Japan förde in armédivisioner under Shirakawa Yoshinori, omkring 30 000 man mot omkring 50 000 kineser. Sedan en landstigning vid Liuhe den 1 mars hade kringgått dem drog sig de kinesiska arméerna tillbaka, och Japan avbröt striderna den 3 mars. Japan rapporterade 738 döda och 2 257 sårade; kineserna rapporterade 14 801 soldater dödade, sårade eller saknade, och västerländska uppskattningar anger omkring 10 000 civila döda. Shanghaiavtalet om vapenvila den 5 maj 1932, som kom till med hjälp av Nationernas förbund och västmakterna, inrättade en zon runt Shanghai där Kina inte fick hålla trupper, bara polis. Den 29 april kastade den koreanske självständighetsaktivisten Yun Bong-gil en bomb vid en festlighet i Hongkouparken; Shirakawa dog av sina skador.
