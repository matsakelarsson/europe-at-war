January Events in Vilnius and Riga: Januarihändelserna i Vilnius och Riga
In January 1991 the Soviet leadership tried to reverse the independence moves of Lithuania, which had declared independence on 11 March 1990, and of Latvia. In Vilnius, in the early hours of 13 January, Soviet troops, among them paratroopers and the KGB’s Alpha unit, stormed the television tower and the radio and television building; 14 unarmed civilians died, 13 of them killed by Soviet fire, and hundreds were injured. A KGB officer was also killed, by a shot from his own side. Crowds kept watch around the parliament, which was not attacked. In Riga, from 13 January, tens of thousands of people built and guarded barricades around key buildings; six people died in Soviet attacks, five of them in the OMON assault on the Latvian interior ministry on 20 January. The violence drew international condemnation, and the Soviet Union recognised the independence of both states in September 1991.: I januari 1991 försökte den sovjetiska ledningen vrida tillbaka självständighetssträvandena i Litauen, som hade förklarat sig självständigt den 11 mars 1990, och i Lettland. I Vilnius stormade sovjetiska trupper, bland dem fallskärmsjägare och KGB:s Alfaenhet, under de tidiga morgontimmarna den 13 januari tv-tornet och radio- och tv-huset; 14 obeväpnade civila dog, 13 av dem genom sovjetisk eld, och hundratals skadades. En KGB-officer dödades också, av ett skott från den egna sidan. Folkmassor höll vakt kring parlamentet, som inte angreps. I Riga byggde och bevakade tiotusentals människor från den 13 januari barrikader kring viktiga byggnader; sex människor dog i sovjetiska angrepp, fem av dem när OMON stormade det lettiska inrikesministeriet den 20 januari. Våldet väckte internationellt fördömande, och Sovjetunionen erkände båda staternas självständighet i september 1991.
