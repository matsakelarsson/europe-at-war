Sources give different numbers of injured in Vilnius, from over 140 to about 700. The count of 14 civilian dead includes one man who died of a heart attack during the assault.: Källorna anger olika antal skadade i Vilnius, från över 140 till omkring 700. Siffran 14 civila döda inbegriper en man som dog av en hjärtattack under stormningen.
The Latvian events are known as the Barricades (Barikādes), and the Lithuanian ones as the January Events (Sausio įvykiai).: De lettiska händelserna kallas Barrikaderna (Barikādes) och de litauiska Januarihändelserna (Sausio įvykiai).
