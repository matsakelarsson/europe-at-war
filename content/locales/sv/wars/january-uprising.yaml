In February 1861 Russian troops fired on a patriotic demonstration in Warsaw, and over the next two years a clandestine Central National Committee prepared a rising. To break the movement, Aleksander Wielopolski, head of the kingdom’s civil administration, brought forward a conscription of young activists into the Russian army for twenty years’ service. Rather than wait to be rounded up, the committee called the rising on the night of 22–23 January 1863.: I februari 1861 sköt ryska trupper mot en patriotisk demonstration i Warszawa, och under de följande två åren förberedde en hemlig central nationalkommitté ett uppror. För att krossa rörelsen tidigarelade Aleksander Wielopolski, chef för kungarikets civilförvaltning, en tvångsrekrytering av unga aktivister till den ryska armén för tjugo års tjänst. I stället för att vänta på att bli gripna utlyste kommittén upproret natten mellan den 22 och 23 januari 1863.
At first about 10,000 poorly armed men took to the forests against about 90,000 Russian troops. Volunteers and weapons came over the borders from Austrian Galicia and Prussian Poland, but on 8 February Prussia agreed in the Alvensleben Convention to help Russia. In the south Marian Langiewicz gathered the largest insurgent force in the Holy Cross Mountains. After fighting at Małogoszcz and Grochowiska he crossed into Galicia in March, where the Austrians interned him.: Till en början gick omkring 10 000 dåligt beväpnade män ut i skogarna mot omkring 90 000 ryska soldater. Frivilliga och vapen kom över gränserna från österrikiska Galizien och preussiska Polen, men den 8 februari gick Preussen i Alvenslebenkonventionen med på att hjälpa Ryssland. I söder samlade Marian Langiewicz den största upprorsstyrkan i Heligkorsbergen. Efter strider vid Małogoszcz och Grochowiska gick han i mars över till Galizien, där österrikarna internerade honom.
