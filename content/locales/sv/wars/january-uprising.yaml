Langiewicz: Langiewicz
By late spring 1863 some 35,000 insurgents faced a Russian army of 145,000 in the kingdom. They could not hold towns, but small units moved through the forests, ambushed patrols and convoys and slipped away. At Żyrzyn on 8 August a force under Michał Heidenreich captured a Russian convoy carrying 140,000 roubles. France, Britain and Austria sent diplomatic notes in support of Polish rights in April, but none of them was willing to go further.: Mot slutet av våren 1863 stod omkring 35 000 upprorsmän mot en rysk armé på 145 000 man i kungariket. De kunde inte hålla städer, men små förband rörde sig genom skogarna, lade bakhåll för patruller och transporter och smet undan. Vid Żyrzyn den 8 augusti erövrade en styrka under Michał Heidenreich en rysk transport med 140 000 rubel. Frankrike, Storbritannien och Österrike skickade i april diplomatiska noter till stöd för polska rättigheter, men ingen av dem var beredd att gå längre.
From February the rising spread into Lithuania and Belarus, led by Zygmunt Sierakowski, the priest Antanas Mackevičius and Konstanty Kalinowski. In May Russian troops destroyed Sierakowski’s force near Biržai, and he was hanged in Vilnius in June. The new governor-general, Mikhail Muravyov, put down the rising there with public executions and mass deportations, and became known as “the Hangman”. Mackevičius was captured and hanged in Kaunas in December.: Från februari spred sig upproret till Litauen och Belarus, lett av Zygmunt Sierakowski, prästen Antanas Mackevičius och Konstanty Kalinowski. I maj förintade ryska trupper Sierakowskis styrka nära Biržai, och han hängdes i Vilnius i juni. Den nye generalguvernören, Michail Muravjov, slog ned upproret där med offentliga avrättningar och massdeportationer och blev känd som ”Bödeln”. Mackevičius tillfångatogs och hängdes i Kaunas i december.
