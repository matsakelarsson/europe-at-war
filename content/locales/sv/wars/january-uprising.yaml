January Uprising: Januariupproret
A rising against Russian rule in Congress Poland, Lithuania and Belarus that began on 22 January 1863 and was fought for some 18 months as a partisan war in the forests. Russian forces crushed it with executions, deportations to Siberia and confiscations, and the Kingdom of Poland lost the last of its separate institutions.: Ett uppror mot det ryska styret i Kongresspolen, Litauen och Belarus som började den 22 januari 1863 och fördes i omkring 18 månader som ett partisankrig i skogarna. Ryska styrkor krossade det med avrättningar, deportationer till Sibirien och konfiskationer, och Kungariket Polen förlorade de sista av sina egna institutioner.
