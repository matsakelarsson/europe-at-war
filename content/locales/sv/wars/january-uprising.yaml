Dates are New Style (Gregorian). Russia used the Julian calendar, then 12 days behind.: Datumen anges enligt den nya stilen (gregorianska kalendern). Ryssland använde den julianska kalendern, som då låg 12 dagar efter.
The numbers of insurgents and of the dead are estimates. About 25,000 insurgents are thought to have been killed in some 650 battles and skirmishes.: Antalet upprorsmän och döda är uppskattningar. Omkring 25 000 upprorsmän tros ha dödats i omkring 650 slag och skärmytslingar.
The rising had many leaders in Lithuania and Belarus who are remembered there as national figures, among them Konstanty Kalinowski (Kastus Kalinoŭski) and Antanas Mackevičius.: Upproret hade många ledare i Litauen och Belarus som där minns som nationella gestalter, bland dem Konstanty Kalinowski (Kastus Kalinoŭski) och Antanas Mackevičius.
