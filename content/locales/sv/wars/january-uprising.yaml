In October 1863 Romuald Traugutt, a former officer of the Russian army, took the lead of the insurgent National Government and tried to turn the partisan bands into a regular army. By then the Russian forces were far stronger, and on 21 February 1864 they beat off an insurgent attack on Opatów. On 2 March the tsar abolished serfdom in the kingdom and gave peasants the land they farmed, undercutting the insurgents’ own promises, and the rising faded.: I oktober 1863 tog Romuald Traugutt, en före detta officer i den ryska armén, ledningen för upprorsmännens nationella regering och försökte göra om partisanbanden till en reguljär armé. Vid det laget var de ryska styrkorna långt starkare, och den 21 februari 1864 slog de tillbaka ett anfall mot Opatów. Den 2 mars avskaffade tsaren livegenskapen i kungariket och gav bönderna den jord de brukade, vilket undergrävde upprorsmännens egna löften, och upproret ebbade ut.
Traugutt was arrested in April 1864 and hanged with four other members of the National Government at the Warsaw Citadel on 5 August. Kalinowski had been hanged in Vilnius in March. The last partisan leader, the priest Stanisław Brzóska, was caught in 1865 and hanged at Sokołów Podlaski in May. Official Russian figures counted 396 executions and 18,672 exiles to Siberia, and 3,454 estates were confiscated in Poland and Lithuania.: Traugutt arresterades i april 1864 och hängdes tillsammans med fyra andra medlemmar av den nationella regeringen vid Warszawacitadellet den 5 augusti. Kalinowski hade hängts i Vilnius i mars. Den siste partisanledaren, prästen Stanisław Brzóska, greps 1865 och hängdes i Sokołów Podlaski i maj. Enligt officiella ryska siffror avrättades 396 personer och 18 672 förvisades till Sibirien, och 3 454 gods konfiskerades i Polen och Litauen.
