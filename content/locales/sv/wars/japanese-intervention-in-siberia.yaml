# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
Japanese intervention in Siberia: Japans intervention i Sibirien
? "The occupation of the Russian Far East and eastern Siberia by Japanese troops, alongside smaller American, British, French, Canadian, Italian and Chinese contingents, during the Russian Civil War. The Allies landed at Vladivostok in 1918 to guard war stores and help the Czechoslovak Legion leave Russia; Japan, which sent some 70,000 men, far more than agreed, occupied the ports and railway towns from the Pacific to Lake Baikal and backed the Cossack atamans Grigory Semyonov and Ivan Kalmykov. The other Allies left in 1919–1920, after Kolchak’s fall, while the Japanese fought a growing partisan war: they burned the village of Ivanovka in 1919, partisans destroyed their garrison at Nikolayevsk-on-Amur in 1920, and in April 1920 they struck at Russian forces across Primorye. Moscow set up the Far Eastern Republic as a buffer state; its army defeated the Whites at Volochayevka in February 1922, and when the last Japanese troops sailed from Vladivostok on 25 October 1922 it marched in. The republic joined Soviet Russia three weeks later. Japan held northern Sakhalin until 1925."
: "Japanska truppers ockupation av Ryska Fjärran Östern och östra Sibirien, vid sidan av mindre amerikanska, brittiska, franska, kanadensiska, italienska och kinesiska kontingenter, under ryska inbördeskriget. De allierade landsteg i Vladivostok 1918 för att bevaka krigsförråd och hjälpa Tjeckoslovakiska legionen att lämna Ryssland; Japan, som sände omkring 70 000 man, långt fler än man kommit överens om, besatte hamnarna och järnvägsstäderna från Stilla havet till Bajkalsjön och stödde kosackatamanerna Grigorij Semjonov och Ivan Kalmykov. De övriga allierade lämnade landet 1919–1920, efter Koltjaks fall, medan japanerna utkämpade ett växande partisankrig: de brände byn Ivanovka 1919, partisaner förintade deras garnison i Nikolajevsk vid Amur 1920, och i april 1920 slog japanerna till mot ryska styrkor över hela Primorje. Moskva upprättade Fjärran Österns republik som buffertstat; dess armé besegrade de vita vid Volotjajevka i februari 1922, och när de sista japanska trupperna avseglade från Vladivostok den 25 oktober 1922 tågade den in. Republiken gick upp i Sovjetryssland tre veckor senare. Japan höll norra Sachalin till 1925."
