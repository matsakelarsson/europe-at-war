# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
Japanese invasion of French Indochina and the coup of 1945: Japans invasion av Franska Indokina och kuppen 1945
? Japan’s entry into French Indochina in 1940–1941 and its overthrow of the French administration in March 1945. After the fall of France in June 1940, Japan, at war with China, demanded that the colony stop supplies reaching China by the railway from Haiphong to Kunming. Governor-General Catroux gave way, and his successor, Admiral Decoux, loyal to the Vichy government, negotiated with General Nishihara Issaku over bases and troops. On 22 September 1940, hours after an agreement allowing 6,000 Japanese troops in Tonkin had been signed in Hanoi, the Japanese 5th Division crossed the Chinese border at Đồng Đăng and attacked the French posts; Lạng Sơn surrendered on 25 September, and on 26 September about 4,500 Japanese troops landed south of Haiphong while aircraft bombed the port. About 100 Japanese and several hundred French and Vietnamese soldiers were killed before Tokyo called a halt; Japan returned Lạng Sơn on 5 October and kept its bases in the north. On 28 July 1941, under an agreement with Vichy, some 140,000 Japanese troops occupied southern Indochina, and the United States answered by freezing Japanese assets and cutting off oil. The French administration stayed in place under Japanese military control for four more years; during the war Indochina was the base for the Japanese invasions of Malaya, Thailand and Burma. In 1944–1945 a famine in northern Vietnam, caused by Japanese and French requisitions of rice, Allied bombing of transport, the switch to industrial crops and floods and drought, killed an estimated 400,000 to 2 million people. On 9 March 1945 Japan disarmed the French in a surprise coup (Operation Meigō). The garrisons of Hanoi, Huế and Lạng Sơn resisted; at Lạng Sơn and Đồng Đăng hundreds of prisoners were executed, and General Lemonnier was beheaded after refusing to sign a surrender. General Alessandri’s column fought its way to China, where more than 3,000 colonial troops arrived by May. French losses were about 4,200 killed and 15,000 interned. Under Japanese sponsorship Emperor Bảo Đại declared the independence of the Empire of Vietnam on 11 March 1945, King Norodom Sihanouk that of Cambodia on 13 March, and King Sisavang Vong of Luang Prabang that of Laos on 8 April. The vacuum this left opened the way for the Viet Minh’s August Revolution after Japan’s surrender.
: Japans inmarsch i Franska Indokina 1940–1941 och dess störtande av den franska förvaltningen i mars 1945. Efter Frankrikes fall i juni 1940 krävde Japan, som låg i krig med Kina, att kolonin skulle stoppa de förnödenheter som nådde Kina via järnvägen från Haiphong till Kunming. Generalguvernören Catroux gav efter, och hans efterträdare, amiral Decoux, som var lojal mot Vichyregeringen, förhandlade med general Nishihara Issaku om baser och trupper. Den 22 september 1940, några timmar efter att ett avtal som tillät 6 000 japanska soldater i Tonkin hade undertecknats i Hanoi, gick den japanska 5:e divisionen över den kinesiska gränsen vid Đồng Đăng och anföll de franska posteringarna; Lạng Sơn kapitulerade den 25 september, och den 26 september landsteg omkring 4 500 japanska soldater söder om Haiphong medan flygplan bombade hamnen. Omkring 100 japanska och flera hundra franska och vietnamesiska soldater dödades innan Tokyo avbröt striderna; Japan lämnade tillbaka Lạng Sơn den 5 oktober och behöll sina baser i norr. Den 28 juli 1941 ockuperade omkring 140 000 japanska soldater södra Indokina enligt ett avtal med Vichy, och USA svarade med att frysa japanska tillgångar och stoppa oljeleveranserna. Den franska förvaltningen satt kvar under japansk militär kontroll i ytterligare fyra år; under kriget var Indokina utgångspunkt för de japanska invasionerna av Malaya, Thailand och Burma. 1944–1945 dödade en hungersnöd i norra Vietnam, orsakad av japanska och franska rekvisitioner av ris, de allierades bombningar av transportlederna, omläggningen till industrigrödor samt översvämningar och torka, uppskattningsvis 400 000 till 2 miljoner människor. Den 9 mars 1945 avväpnade Japan fransmännen i en överraskande kupp (Operation Meigō). Garnisonerna i Hanoi, Huế och Lạng Sơn gjorde motstånd; vid Lạng Sơn och Đồng Đăng avrättades hundratals fångar, och general Lemonnier halshöggs sedan han vägrat underteckna en kapitulation. General Alessandris kolonn slog sig igenom till Kina, dit mer än 3 000 koloniala soldater hade kommit fram i maj. De franska förlusterna uppgick till omkring 4 200 döda och 15 000 internerade. Under japanskt beskydd utropade kejsar Bảo Đại Kejsardömet Vietnams självständighet den 11 mars 1945, kung Norodom Sihanouk Kambodjas den 13 mars och kung Sisavang Vong av Luang Prabang Laos den 8 april. Det tomrum som detta lämnade öppnade vägen för Viet Minhs augustirevolution efter Japans kapitulation.
