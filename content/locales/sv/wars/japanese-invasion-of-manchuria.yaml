# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
Japanese invasion of Manchuria: Japans invasion av Manchuriet
? The conquest of China’s three north-eastern provinces by Japan’s Kwantung Army in 1931–1932. On the night of 18 September 1931 officers of the Kwantung Army, which guarded Japan’s leased territory and the South Manchuria Railway, set off a small explosion on the railway near Shenyang (Mukden) and blamed Chinese soldiers. Acting without the approval of the government in Tokyo, the army seized Shenyang and the towns along the railway within a day, and troops from Japanese-ruled Korea crossed the border to join it. Zhang Xueliang’s Northeastern Army, far larger but ordered by Zhang and Chiang Kai-shek to avoid open war while China appealed to the League of Nations, mostly withdrew. Ma Zhanshan resisted at the Nenjiang bridge in November, but Qiqihar fell on 19 November, Jinzhou on 3 January 1932 and Harbin in early February, and organised Chinese resistance ended in late February. On 1 March 1932 Japan set up the state of Manchukuo, with the last Qing emperor, Puyi, at its head. Volunteer armies fought on for years. The League’s Lytton Commission refused to recognise Manchukuo, and Japan left the League in 1933. Clodfelter estimates about 50,000 Chinese military and civilian dead and about 10,000 Japanese dead, including the conquest of Rehe in 1933.
: Den japanska Kwantungarméns erövring av Kinas tre nordöstra provinser 1931–1932. Natten den 18 september 1931 utlöste officerare i Kwantungarmén, som bevakade Japans arrendeområde och Sydmanchuriska järnvägen, en liten explosion på järnvägen nära Shenyang (Mukden) och skyllde på kinesiska soldater. Utan godkännande från regeringen i Tokyo intog armén Shenyang och städerna längs järnvägen inom ett dygn, och trupper från det japanskstyrda Korea gick över gränsen för att förena sig med den. Zhang Xueliangs Nordöstarmé, som var betydligt större men av Zhang och Chiang Kai-shek hade beordrats att undvika öppet krig medan Kina vädjade till Nationernas förbund, drog sig för det mesta tillbaka. Ma Zhanshan gjorde motstånd vid Nenjiangbron i november, men Qiqihar föll den 19 november, Jinzhou den 3 januari 1932 och Harbin i början av februari, och det organiserade kinesiska motståndet upphörde i slutet av februari. Den 1 mars 1932 upprättade Japan staten Manchukuo med den siste Qingkejsaren, Puyi, som statschef. Frivilligarméer fortsatte att strida i flera år. Nationernas förbunds Lyttonkommission vägrade att erkänna Manchukuo, och Japan lämnade förbundet 1933. Clodfelter uppskattar antalet döda till omkring 50 000 kinesiska militärer och civila och omkring 10 000 japaner, inräknat erövringen av Rehe 1933.
