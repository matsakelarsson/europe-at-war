# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
Japanese invasion of Taiwan (1874): Japans invasion av Taiwan (1874)
Japan’s first overseas military expedition of the Meiji era, also called the Taiwan Expedition or, in Taiwan and China, the Mudan Incident. In December 1871 a ship from the Ryukyu Kingdom was wrecked on the south-east coast of Taiwan, and 54 of its crew were killed by Paiwan people of Mudan and Kuskus. Japan, which was claiming the Ryukyus, argued that the indigenous lands of Taiwan lay outside Qing rule and in May 1874 landed some 3,600 troops under Saigō Jūdō in the south of the island. They defeated the Paiwan at Stone Gate on 22 May and burned their villages, but malaria killed 561 men while the soldiers waited in camp. The Qing sent troops to Taiwan, and in Beijing Ōkubo Toshimichi negotiated an agreement, signed at the end of October, by which China paid 500,000 taels and called the expedition an act to protect Japanese subjects. Japan withdrew in December; it later used the wording to support its annexation of the Ryukyus in 1879, and the Qing began to strengthen its hold on Taiwan.: Japans första militära expedition utomlands under Meijitiden, även kallad Taiwanexpeditionen eller, på Taiwan och i Kina, Mudanincidenten. I december 1871 förliste ett fartyg från kungariket Ryukyu vid Taiwans sydöstra kust, och 54 av besättningsmännen dödades av paiwanfolk från Mudan och Kuskus. Japan, som gjorde anspråk på Ryukyuöarna, hävdade att ursprungsfolkens områden på Taiwan låg utanför Qings välde och landsatte i maj 1874 omkring 3 600 soldater under Saigō Jūdō i södra delen av ön. De besegrade paiwan vid Stenporten den 22 maj och brände deras byar, men malaria dödade 561 man medan soldaterna väntade i lägret. Qing sände trupper till Taiwan, och i Peking förhandlade Ōkubo Toshimichi fram en överenskommelse, undertecknad i slutet av oktober, genom vilken Kina betalade 500 000 tael och betecknade expeditionen som en åtgärd för att skydda japanska undersåtar. Japan drog sig tillbaka i december; landet använde senare formuleringen till stöd för sin annektering av Ryukyuöarna 1879, och Qing började stärka sitt grepp om Taiwan.
