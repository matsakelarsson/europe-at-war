# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
Japanese invasion of Taiwan (1895): Japans invasion av Taiwan (1895)
? The Japanese conquest of Taiwan after the First Sino-Japanese War, called the Yiwei War in Chinese. Japan seized the Penghu Islands in March 1895, and by the Treaty of Shimonoseki of 17 April China ceded Taiwan and Penghu to Japan. In late May officials and gentry in Taipei proclaimed a Republic of Formosa, with the Qing governor Tang Jingsong as president, to resist the handover. The Japanese landed near Keelung on 29 May; Tang fled, and Taipei was occupied on 7 June. The advance south was then slowed by Hakka militias around Hsinchu and Miaoli and by guerrilla attacks, but the Japanese won the decisive battle at Baguashan near Changhua on 27 August. In October three Japanese forces closed in on Tainan, where the general Liu Yongfu led the republic; he fled to the mainland, and Tainan surrendered on 21 October. Japan declared the island subdued in November, although armed resistance went on for years. About 14,000 Chinese and Taiwanese soldiers and militiamen are estimated to have died; Japan lost 164 killed in battle and thousands more to cholera and malaria.
: Den japanska erövringen av Taiwan efter första kinesisk-japanska kriget, på kinesiska kallad Yiweikriget. Japan intog Penghuöarna i mars 1895, och genom freden i Shimonoseki den 17 april avträdde Kina Taiwan och Penghu till Japan. I slutet av maj utropade ämbetsmän och lokala notabiliteter i Taipei en Republiken Formosa, med Qingguvernören Tang Jingsong som president, för att stå emot överlämnandet. Japanerna landsteg nära Keelung den 29 maj; Tang flydde, och Taipei besattes den 7 juni. Framryckningen söderut bromsades sedan av hakkamiliser kring Hsinchu och Miaoli och av gerillaangrepp, men japanerna vann det avgörande slaget vid Baguashan nära Changhua den 27 augusti. I oktober ryckte tre japanska styrkor fram mot Tainan, där generalen Liu Yongfu ledde republiken; han flydde till fastlandet, och Tainan kapitulerade den 21 oktober. Japan förklarade ön kuvad i november, även om det väpnade motståndet fortsatte i flera år. Omkring 14 000 kinesiska och taiwanesiska soldater och milismän beräknas ha dött; Japan förlorade 164 man stupade i strid och ytterligare tusentals i kolera och malaria.
