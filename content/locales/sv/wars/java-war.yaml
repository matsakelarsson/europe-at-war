# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
Java War: Javakriget
? The rebellion of Prince Diponegoro of Yogyakarta against the Dutch colonial government and the Javanese courts allied with it, the last great war of the Javanese aristocracy against colonial rule. Diponegoro, eldest son of Sultan Hamengkubuwono III, drew on resentment of Dutch interference at court, of land rents, tolls and the Chinese toll-farmers, and on hopes of a Just King after cholera and the eruption of Merapi. When Dutch troops came to arrest him at Tegalrejo on 20 July 1825 he withdrew to Selarong and declared a holy war. His followers besieged Yogyakarta and rose across Central Java, and in 1826 his army threatened Surakarta until it was beaten at Gawok. The war became a guerrilla struggle that General Hendrik Merkus de Kock answered from 1827 with a network of more than 250 small forts, the benteng-stelsel, which slowly penned the rebels into the hills west of Yogyakarta. After his commanders were captured, killed or surrendered, Diponegoro agreed to talks and was arrested by de Kock at Magelang on 28 March 1830 and exiled to Sulawesi. At least 200,000 Javanese died, most of them civilians, and 15,000 soldiers of the colonial army. The Dutch annexed the outer provinces of the courts and introduced the Cultivation System, and Java saw no further large-scale revolt until the Indonesian revolution.
: Det uppror som prins Diponegoro av Yogyakarta ledde mot den nederländska kolonialregeringen och de javanska hov som var allierade med den, den javanska aristokratins sista stora krig mot kolonialstyret. Diponegoro, äldste son till sultan Hamengkubuwono III, byggde på förbittringen över nederländsk inblandning vid hovet, över jordarrenden, tullar och de kinesiska tullarrendatorerna, och på förhoppningar om en ”rättvis kung” efter koleran och Merapis utbrott. När nederländska trupper kom för att gripa honom i Tegalrejo den 20 juli 1825 drog han sig tillbaka till Selarong och utlyste ett heligt krig. Hans anhängare belägrade Yogyakarta och reste sig över hela mellersta Java, och 1826 hotade hans armé Surakarta tills den besegrades vid Gawok. Kriget övergick i ett gerillakrig, som general Hendrik Merkus de Kock från 1827 besvarade med ett nät av mer än 250 små fort, benteng-stelsel, som långsamt trängde in rebellerna i bergen väster om Yogyakarta. Sedan hans befälhavare hade tillfångatagits, dödats eller gett upp gick Diponegoro med på förhandlingar, men han greps av de Kock i Magelang den 28 mars 1830 och förvisades till Sulawesi. Minst 200 000 javaner dog, de flesta av dem civila, och 15 000 soldater i kolonialarmén. Nederländarna annekterade hovens yttre provinser och införde kultursystemet, och på Java förekom inget mer storskaligt uppror förrän den indonesiska revolutionen.
