# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
First and Second Javanese Wars of Succession: Första och andra javanesiska tronföljdskrigen
? Two wars over the throne of Mataram in which the Dutch East India Company (VOC) backed its own candidate and was paid in land and trade. When Amangkurat II died in 1703, his son Amangkurat III succeeded him, but the Company, suspecting him of sympathy for Surapati, the former slave who ruled a domain in East Java, recognised his uncle Pangeran Puger as king. Puger took the title Pakubuwono I in June 1704 and, in the First War of Succession (1704–1708), Company troops and Madurese allies put him in the capital, Kartasura, in August 1705. Amangkurat III fled east to Surapati, who was killed in 1706 when the allies stormed Bangil; the king held out in the hills of Malang until 1708, when he surrendered on a promise of lands and was exiled to Ceylon. In return Pakubuwono I confirmed the Company’s possession of Semarang and the Priangan highlands, ceded the eastern half of Madura and promised yearly deliveries of rice. The Second War of Succession (1719–1723) began when Pakubuwono I died and his son Amangkurat IV was challenged by his brothers, the princes Blitar and Purbaya, who attacked the palace in June 1719 and were driven off by the guns of the Company’s fort, and by his uncle Arya Mataram, who proclaimed himself king near Jepara and was put to death the same year. The rebels joined risings of the regents of Surabaya in East Java; Prince Blitar died in 1721, and in May–June 1723 the last rebel leaders surrendered. Most were exiled to Ceylon, while Purbaya was kept in Batavia as a possible replacement for the king. Each war left Mataram more dependent on the Company and the VOC deeper in Javanese politics; the third war followed in 1746.
: Två krig om Matarams tron där Nederländska ostindiska kompaniet (VOC) stödde sin egen kandidat och fick betalt i land och handel. När Amangkurat II dog 1703 efterträddes han av sin son Amangkurat III, men kompaniet, som misstänkte honom för att sympatisera med Surapati, den före detta slav som härskade över ett välde på östra Java, erkände hans farbror Pangeran Puger som kung. Puger antog titeln Pakubuwono I i juni 1704, och i det första tronföljdskriget (1704–1708) förde kompanitrupper och maduresiska bundsförvanter honom i augusti 1705 till makten i huvudstaden Kartasura. Amangkurat III flydde österut till Surapati, som dödades 1706 när de allierade stormade Bangil; kungen höll stånd i bergen kring Malang till 1708, då han kapitulerade mot löfte om land och förvisades till Ceylon. I gengäld bekräftade Pakubuwono I kompaniets besittning av Semarang och Prianganhöglandet, avträdde Maduras östra hälft och lovade årliga leveranser av ris. Det andra tronföljdskriget (1719–1723) började när Pakubuwono I dog och hans son Amangkurat IV utmanades av sina bröder, prinsarna Blitar och Purbaya, som anföll palatset i juni 1719 och drevs bort av kanonerna i kompaniets fort, och av sin farbror Arya Mataram, som utropade sig till kung nära Jepara och avrättades samma år. Rebellerna anslöt sig till resningar bland regenterna i Surabaya på östra Java; prins Blitar dog 1721, och i maj–juni 1723 kapitulerade de sista rebelledarna. De flesta förvisades till Ceylon, medan Purbaya hölls kvar i Batavia som en möjlig ersättare för kungen. Varje krig gjorde Mataram mer beroende av kompaniet och drog VOC djupare in i javanesisk politik; det tredje kriget följde 1746.
