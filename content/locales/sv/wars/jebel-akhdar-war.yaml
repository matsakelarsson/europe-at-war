# Svenska översättningar av katalogtexten (våg 7); stegtexterna kommer senare.
Jebel Akhdar War: Jebel Akhdar-kriget
? A war in the interior of Oman between the Imamate of Oman, which had ruled the inland tribes under the Treaty of Seeb of 1920, and Sultan Said bin Taimur of Muscat, supported by Britain. After the imam Muhammad al-Khalili died in May 1954 and Ghalib bin Ali al-Hinai was elected in his place, the sultan’s British-officered forces occupied the oil prospect at Fahud in October 1954 and took Nizwa, the imamate’s capital, in December 1955; Ghalib withdrew to his village. In 1957 his brother Talib returned from Saudi Arabia with several hundred trained fighters and raised the tribes again, and British troops and aircraft were called in to retake Nizwa in August 1957. The rebels held out on the high plateau of Jebel Akhdar (the “Green Mountain”), supplied from Saudi Arabia, until two squadrons of the British Special Air Service, with the sultan’s troops, climbed the mountain by night in late January 1959 and took the plateau. Ghalib and Talib went into exile in Saudi Arabia, and the imamate ended; its cause was raised at the United Nations for years afterwards. Estimates of the dead range from about 100 to several hundred.
: Ett krig i Omans inland mellan imamatet Oman, som hade styrt inlandsstammarna enligt Seebfördraget från 1920, och sultan Said bin Taimur av Muskat, som stöddes av Storbritannien. Sedan imamen Muhammad al-Khalili hade dött i maj 1954 och Ghalib bin Ali al-Hinai valts i hans ställe besatte sultanens styrkor, som leddes av brittiska officerare, det lovande oljefältet vid Fahud i oktober 1954 och intog Nizwa, imamatets huvudstad, i december 1955; Ghalib drog sig tillbaka till sin by. År 1957 återvände hans bror Talib från Saudiarabien med flera hundra utbildade kämpar och fick åter stammarna att resa sig, och brittiska trupper och flygplan kallades in för att återta Nizwa i augusti 1957. Rebellerna höll stånd på högplatån Jebel Akhdar (”Gröna berget”), försörjda från Saudiarabien, tills två skvadroner ur den brittiska Special Air Service tillsammans med sultanens trupper klättrade upp på berget nattetid i slutet av januari 1959 och intog platån. Ghalib och Talib gick i exil i Saudiarabien, och imamatet upphörde; dess sak togs upp i FN i många år därefter. Uppskattningarna av antalet döda varierar från omkring 100 till flera hundra.
