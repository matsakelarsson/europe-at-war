# Svenska översättningar av katalogtexten (våg 10); stegtexterna kommer senare.
Jeju uprising: Jejuupproret
? An armed rising on Jeju Island led by the Workers’ Party of South Korea, and its suppression by the South Korean army and police, the US military government and right-wing youth groups, known in Korea as Jeju 4·3 after its first day, 3 April 1948. Tension had grown since police shot six people at a rally on 1 March 1947 and the mass arrests and beatings that followed. Opposing the separate election in the South, several hundred insurgents attacked police stations across the island; the election of 10 May 1948 failed in two of Jeju’s three districts. From October 1948 the army declared the interior of the island a free-fire zone and burned most of the mountain villages; the winter of 1948–1949 was the deadliest period. The insurgency was broken by mid-1949, when its leader Yi Deok-gu was killed, though the island’s mountains stayed closed until 1954. A government committee in 2003 estimated 25,000–30,000 dead, about a tenth of the island’s people, and attributed some 86 percent of the deaths it could identify to the security forces and 14 percent to the insurgents. The subject was suppressed for decades; President Roh Moo-hyun apologised for the state’s actions in 2003.
: En väpnad resning på ön Jeju under ledning av Sydkoreas arbetarparti, och dess nedslående av Sydkoreas armé och polis, den amerikanska militärregeringen och högerinriktade ungdomsgrupper, i Korea känd som Jeju 4·3 efter sin första dag, den 3 april 1948. Spänningarna hade vuxit sedan polisen sköt sex människor vid ett möte den 1 mars 1947 och sedan de massgripanden och den misshandel som följde. I protest mot det separata valet i söder angrep flera hundra upprorsmän polisstationer över hela ön; valet den 10 maj 1948 misslyckades i två av Jejus tre valkretsar. Från oktober 1948 förklarade armén öns inre för en zon där trupperna fick skjuta fritt och brände de flesta av bergsbyarna; vintern 1948–1949 var den blodigaste perioden. Upprorsrörelsen var krossad vid mitten av 1949, då dess ledare Yi Deok-gu dödades, men öns berg förblev stängda till 1954. En regeringskommitté uppskattade 2003 antalet döda till 25 000–30 000, omkring en tiondel av öns befolkning, och tillskrev omkring 86 procent av de dödsfall den kunde identifiera säkerhetsstyrkorna och 14 procent upprorsmännen. Ämnet tystades ned i årtionden; president Roh Moo-hyun bad 2003 om ursäkt för statens agerande.
