# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
Jiajing wokou raids: Wokouräderna under Jiajing
? "Raids on the coasts of Zhejiang, Jiangsu, Fujian and Guangdong in the reign of the Jiajing Emperor, at their height in the 1550s. The Ming had banned private sea trade since 1371 (the haijin), but Japanese silver and the demand for Chinese silk and porcelain made smuggling very profitable, and from about 1540 merchants of Fujian and Zhejiang ran an illegal trading port at Shuangyu off Ningbo with Japanese and Portuguese partners. When officials enforced the ban, destroying Shuangyu in 1548, the trade turned into raiding. The Ming called the raiders wokou, “Japanese pirates”, but most of them were Chinese: Chinese records put the Japanese at about three in ten. Fleets of up to 20,000 men plundered towns far inland in the 1550s. The supreme commander Hu Zongxian destroyed the band of Xu Hai in 1556 and lured the merchant chief Wang Zhi back from Japan, to be executed in 1560; the armies that Qi Jiguang and Yu Dayou trained drove the last large bands out of Zhejiang in 1561 and Fujian in 1563–1565. The raids ended for good after the court in 1567 allowed licensed merchants to trade overseas from Yuegang, except with Japan."
: "Räder mot kusterna i Zhejiang, Jiangsu, Fujian och Guangdong under Jiajingkejsarens regering, med sin höjdpunkt på 1550-talet. Ming hade sedan 1371 förbjudit privat sjöhandel (haijin), men japanskt silver och efterfrågan på kinesiskt siden och porslin gjorde smugglingen mycket lönsam, och från omkring 1540 drev köpmän från Fujian och Zhejiang en olaglig handelshamn på Shuangyu utanför Ningbo tillsammans med japanska och portugisiska kompanjoner. När ämbetsmännen genomdrev förbudet och förstörde Shuangyu 1548 slog handeln över i plundring. Ming kallade plundrarna wokou, ”japanska pirater”, men de flesta av dem var kineser: enligt kinesiska källor var ungefär tre av tio japaner. Flottor på upp till 20 000 man plundrade städer långt inne i landet på 1550-talet. Överbefälhavaren Hu Zongxian förintade Xu Hais skara 1556 och lockade köpmannaledaren Wang Zhi tillbaka från Japan, och denne avrättades 1560; de arméer som Qi Jiguang och Yu Dayou övade upp drev ut de sista stora skarorna ur Zhejiang 1561 och ur Fujian 1563–1565. Räderna upphörde för gott sedan hovet 1567 hade tillåtit licensierade köpmän att idka utrikeshandel från Yuegang, utom med Japan."
