# Svenska översättningar av katalogtexten (våg 12); stegtexterna kommer senare.
Jihadist insurgency in Burkina Faso: Det jihadistiska upproret i Burkina Faso
? "The war between the state of Burkina Faso and jihadist groups that spread into the country from Mali after 2015. It began in the Sahel region of the north, where Ansarul Islam, founded by the Fulani preacher Ibrahim Malam Dicko in 2016, drew on resentment of the state and of local elites, and widened as al-Qaeda’s JNIM and the Islamic State’s Sahel branch moved into the north, the east and the west. Attacks on the capital, Ouagadougou, in 2016–2018 were followed by a rural war in which jihadists killed soldiers, officials, teachers and villagers, while the army and the state-armed Volunteers for the Defence of the Homeland (VDP) were accused of massacring Fulani civilians. Anger at the army’s losses brought two coups in 2022; Captain Ibrahim Traoré, in power since September 2022, sent away the French forces, turned to Russia, mobilised the population and silenced critics. By the mid-2020s Burkina Faso was among the countries worst hit by terrorism in the world: some 2 million people had been displaced, towns such as Djibo were under blockade for years, and estimates of the dead run to 20,000–25,000."
: "Kriget mellan staten Burkina Faso och jihadistiska grupper som spred sig in i landet från Mali efter 2015. Det började i regionen Sahel i norr, där Ansarul Islam, som grundades av fulanipredikanten Ibrahim Malam Dicko 2016, byggde på missnöjet med staten och de lokala eliterna, och vidgades när al-Qaidas JNIM och Islamiska statens Sahelgren flyttade in i landets norra, östra och västra delar. Efter angreppen mot huvudstaden Ouagadougou 2016–2018 följde ett krig på landsbygden där jihadister dödade soldater, tjänstemän, lärare och bybor, medan armén och de av staten beväpnade Frivilliga för fosterlandets försvar (VDP) anklagades för massakrer på civila fulani. Vreden över arméns förluster ledde till två kupper 2022; kapten Ibrahim Traoré, vid makten sedan september 2022, skickade bort de franska styrkorna, vände sig till Ryssland, mobiliserade befolkningen och tystade kritiker. Vid mitten av 2020-talet var Burkina Faso ett av de länder i världen som drabbats värst av terrorism: omkring 2 miljoner människor hade drivits på flykt, städer som Djibo hade varit blockerade i åratal, och uppskattningarna av antalet döda uppgår till 20 000–25 000."
