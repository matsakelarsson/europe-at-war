# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
Jin–Liao war: Kriget mellan Jin och Liao
? The war in which the Jurchens of Manchuria, united by the Wanyan chief Aguda, overthrew the Khitan Liao empire that had ruled them for two centuries. Aguda rose in 1114 with a few thousand horsemen, took the frontier fort of Ningjiang and routed a Liao army at Chuhedian. In January 1115 he proclaimed himself emperor of the Jin (“Gold”) dynasty, and that year he took Huanglong and destroyed the army that the Liao emperor Tianzuo led against him at Hubudagang. By 1116 the Jin held all of Liaodong. The Song, hoping to recover the Sixteen Prefectures, made an alliance with the Jin by envoys sent across the Bohai Sea. The Jin took the Liao Supreme Capital in 1120, the Central Capital in the winter of 1121–1122, and the Western and Southern Capitals in 1122, while Song attacks on the Southern Capital, Yanjing (Beijing), were beaten off by the Liao. In 1123 the Jin handed Yanjing and six prefectures to the Song for a large payment, after carrying off their people and wealth. Tianzuo fled into the steppe and was captured in March 1125; the Liao prince Yelü Dashi went west and founded the Qara Khitai empire in Central Asia. Before the year was out, the Jin turned on the Song.
: Det krig i vilket jurchenerna i Manchuriet, enade av Wanyanklanens hövding Aguda, störtade khitanernas Liaorike, som hade härskat över dem i två sekler. Aguda reste sig 1114 med några tusen ryttare, intog gränsfästet Ningjiang och slog en Liaoarmé på flykten vid Chuhedian. I januari 1115 utropade han sig till kejsare av Jindynastin (”Guld”), och samma år intog han Huanglong och förintade den armé som Liaokejsaren Tianzuo ledde mot honom vid Hubudagang. År 1116 behärskade Jin hela Liaodong. Song, som hoppades återvinna de sexton prefekturerna, slöt en allians med Jin genom sändebud som skickades över Bohaihavet. Jin intog Liaos Högsta huvudstad 1120, Centrala huvudstaden vintern 1121–1122 och Västra och Södra huvudstaden 1122, medan Songrikets angrepp på Södra huvudstaden, Yanjing (Peking), slogs tillbaka av Liao. År 1123 överlämnade Jin Yanjing och sex prefekturer till Song mot en stor betalning, sedan de hade fört bort deras invånare och rikedomar. Tianzuo flydde ut på stäppen och tillfångatogs i mars 1125; Liaofursten Yelü Dashi drog västerut och grundade riket Qara Khitai i Centralasien. Innan året var slut vände sig Jin mot Song.
