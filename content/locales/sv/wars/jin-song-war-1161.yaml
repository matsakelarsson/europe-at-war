# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
Jin–Song war of 1161–1165: Kriget mellan Jin och Song 1161–1165
The war begun by the Jin emperor Wanyan Liang (Prince of Hailing), who broke the peace of Shaoxing to conquer the Southern Song. In the autumn of 1161 he led a huge army from Kaifeng to the Huai and the Yangtze and sent a fleet by sea against the Song capital Lin’an. The fleet was destroyed off the Shandong coast at Tangdao on 16 November, and on 26–27 November a Song force under the official Yu Yunwen, with paddle-wheel warships throwing gunpowder bombs, threw back the Jin attempt to cross the Yangtze at Caishi. While Wanyan Liang prepared a new crossing near Yangzhou, his cousin Wanyan Yong had been proclaimed emperor (Shizong) at Liaoyang, and on 15 December Wanyan Liang was killed by his own officers. The new Song emperor Xiaozong tried to reconquer the north in 1163, but his armies were routed at Fuli. The peace of Longxing (1164–1165) kept the Huai border, turned the Song emperor from a vassal into a “nephew” of the Jin emperor and cut the yearly payments; it held until 1206.: Det krig som inleddes av Jinkejsaren Wanyan Liang (prinsen av Hailing), som bröt freden i Shaoxing för att erövra Södra Song. Hösten 1161 ledde han en väldig armé från Kaifeng till Huai och Yangtze och sände en flotta sjövägen mot Songs huvudstad Lin’an. Flottan förintades utanför Shandongkusten vid Tangdao den 16 november, och den 26–27 november slog en Songstyrka under ämbetsmannen Yu Yunwen, med skovelhjulsdrivna krigsfartyg som kastade krutbomber, tillbaka Jins försök att ta sig över Yangtze vid Caishi. Medan Wanyan Liang förberedde en ny överfart nära Yangzhou hade hans kusin Wanyan Yong utropats till kejsare (Shizong) i Liaoyang, och den 15 december dödades Wanyan Liang av sina egna officerare. Den nye Songkejsaren Xiaozong försökte återerövra norr 1163, men hans arméer slogs på flykten vid Fuli. Freden i Longxing (1164–1165) behöll gränsen vid Huai, gjorde Songkejsaren från vasall till Jinkejsarens ”brorson” och minskade de årliga betalningarna; den höll till 1206.
