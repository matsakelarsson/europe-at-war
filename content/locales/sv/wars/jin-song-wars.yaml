# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
Jin–Song wars: Krigen mellan Jin och Song
? The wars in which the Jurchen Jin dynasty, having destroyed the Liao with Song help, turned on its ally and conquered northern China. Jin armies besieged the Song capital Kaifeng in 1126, took it in January 1127 and carried the retired emperor Huizong, the reigning emperor Qinzong and some 14,000 members of the court north into captivity, the Jingkang incident. A surviving prince, Zhao Gou, was proclaimed emperor (Gaozong) and founded the Southern Song. In 1129–1130 the Jin general Wuzhu crossed the Yangtze and chased the court to the sea, but was trapped for 48 days at Huangtiandang on his way back; in the west the Wu brothers held the passes into Sichuan. The Jin ruled Henan and Shaanxi for a time through a client state, Qi, which they abolished in 1137. After a short-lived peace, Wuzhu attacked again in 1140; Liu Qi and Yue Fei defeated him at Shunchang, Yancheng and Yingchang, but the court of Gaozong and Qin Hui recalled Yue Fei, had him killed in prison and made the peace of Shaoxing (agreed 1141, ratified 1142). It fixed the border on the Huai River and the Dasan Pass, made the Song emperor a vassal of the Jin and bound the Song to yearly payments of silver and silk.
: De krig i vilka jurchenernas Jindynasti, sedan den med Songs hjälp hade förintat Liao, vände sig mot sin bundsförvant och erövrade norra Kina. Jinarméer belägrade Songs huvudstad Kaifeng 1126, intog den i januari 1127 och förde den abdikerade kejsaren Huizong, den regerande kejsaren Qinzong och omkring 14 000 medlemmar av hovet norrut i fångenskap – Jingkangincidenten. En prins som hade undkommit, Zhao Gou, utropades till kejsare (Gaozong) och grundade Södra Song. År 1129–1130 gick Jinfältherren Wuzhu över Yangtze och jagade hovet ut till havet, men på återvägen blev han instängd i 48 dagar vid Huangtiandang; i väster höll bröderna Wu passen in till Sichuan. Jin styrde en tid Henan och Shaanxi genom en klientstat, Qi, som de avskaffade 1137. Efter en kortvarig fred angrep Wuzhu på nytt 1140; Liu Qi och Yue Fei besegrade honom vid Shunchang, Yancheng och Yingchang, men Gaozongs och Qin Huis hov kallade hem Yue Fei, lät döda honom i fängelset och slöt freden i Shaoxing (överenskommen 1141, ratificerad 1142). Den fastställde gränsen vid floden Huai och Dasanpasset, gjorde Songkejsaren till Jins vasall och förpliktade Song till årliga betalningar i silver och siden.
