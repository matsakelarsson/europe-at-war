# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
Jinchuan campaigns: Jinchuanfälttågen
? Two wars of the Qianlong Emperor against the Gyalrong chiefdoms of Greater and Lesser Jinchuan (Chuchen and Tsanlha), in the deep valleys of the upper Dadu River on the eastern edge of the Tibetan plateau, in today’s north-western Sichuan. The chiefs held their lands as hereditary Qing chieftains (tusi). In 1747 the emperor sent an army when Slob dpon of Greater Jinchuan attacked his neighbours; his commanders failed against the stone towers of the valleys, two of them were put to death, and in 1749 the chief submitted and kept his lands. In 1771 Slob dpon’s grandson Sonom and Senggesang of Lesser Jinchuan seized the lands of other chiefs. This time the war lasted five years. A Jinchuan attack destroyed the Qing camp at Muguomu in 1773 and killed the commander Wenfu, but Agui’s army took the valleys tower by tower with heavy cannon, and Sonom surrendered early in 1776. He was executed in Beijing, the chiefdoms were abolished and the region was put under Qing officials and military colonies. The second war, which cost the Qing tens of thousands of men and some 60 to 70 million taels of silver, was the most expensive of the Ten Great Campaigns.
: Två krig som Qianlongkejsaren förde mot gyalronghövdingadömena Stora och Lilla Jinchuan (Chuchen och Tsanlha), i de djupa dalarna vid övre Dadufloden på Tibetanska högplatåns östra kant, i dagens nordvästra Sichuan. Hövdingarna innehade sina länder som ärftliga hövdingar (tusi) under Qing. År 1747 sände kejsaren en armé när Slob dpon av Stora Jinchuan anföll sina grannar; hans befälhavare misslyckades mot dalarnas stentorn, två av dem avrättades, och 1749 underkastade sig hövdingen och fick behålla sina länder. År 1771 tog Slob dpons sonson Sonom och Senggesang av Lilla Jinchuan andra hövdingars länder. Den här gången varade kriget i fem år. Ett anfall från Jinchuan förstörde Qinglägret vid Muguomu 1773 och dödade befälhavaren Wenfu, men Aguis armé tog dalarna torn för torn med tunga kanoner, och Sonom kapitulerade i början av 1776. Han avrättades i Peking, hövdingadömena avskaffades och området ställdes under Qingämbetsmän och militärkolonier. Det andra kriget, som kostade Qing tiotusentals man och omkring 60 till 70 miljoner tael silver, var det dyraste av de tio stora fälttågen.
