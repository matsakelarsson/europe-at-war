# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
Jingnan campaign: Jingnanfälttåget
? The civil war in which Zhu Di, Prince of Yan, a son of the Hongwu Emperor, overthrew his nephew the Jianwen Emperor and took the throne as the Yongle Emperor. Jianwen, who succeeded his grandfather in 1398, set out with his advisers Qi Tai and Huang Zicheng to reduce the power of his uncles, the princes who commanded armies on the frontiers. Zhu Di, the strongest of them, rose at Beiping (Beijing) on 6 August 1399, claiming to rescue the throne from evil ministers; he called his campaign jingnan, “quelling the troubles”. With about 100,000 men against a government with three times as many, he beat the first imperial armies near Zhending and before Beiping in 1399, won a great battle on the Baigou River in 1400, but failed before Jinan and was badly beaten at Dongchang in January 1401. In 1402 he bypassed the fortified cities of Shandong, crossed the Huai and the Yangtze, and on 13 July entered Nanjing when its gates were opened to him. The palace burned and the Jianwen Emperor was never seen again. Zhu Di was enthroned on 17 July 1402 and purged the late emperor’s followers, killing thousands; he later moved the capital to Beijing.
: Det inbördeskrig i vilket Zhu Di, prins av Yan, en son till Hongwukejsaren, störtade sin brorson Jianwenkejsaren och besteg tronen som Yonglekejsaren. Jianwen, som efterträdde sin farfar 1398, gick tillsammans med sina rådgivare Qi Tai och Huang Zicheng in för att begränsa makten hos sina farbröder, de prinsar som förde befäl över arméer vid gränserna. Zhu Di, den starkaste av dem, reste sig i Beiping (Peking) den 6 augusti 1399 med påståendet att han ville rädda tronen från onda ministrar; han kallade sitt fälttåg jingnan, ”att stilla oroligheterna”. Med omkring 100 000 man mot en regering med tre gånger så många slog han de första kejserliga arméerna nära Zhending och framför Beiping 1399 och vann ett stort slag vid floden Baigou 1400, men misslyckades framför Jinan och led ett svårt nederlag vid Dongchang i januari 1401. År 1402 gick han förbi Shandongs befästa städer, gick över Huai och Yangtze och tågade den 13 juli in i Nanking, när dess portar öppnades för honom. Palatset brann och Jianwenkejsaren sågs aldrig mer. Zhu Di besteg tronen den 17 juli 1402 och rensade ut den förre kejsarens anhängare, varvid tusentals dödades; han flyttade senare huvudstaden till Peking.
