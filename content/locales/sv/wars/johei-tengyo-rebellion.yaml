# Svenska översättningar av katalogtexten (våg 10); stegtexterna kommer senare.
Jōhei–Tengyō rebellion: Jōhei–Tengyō-upproret
? "Two risings that broke out at almost the same time at opposite ends of Japan and shook the court in Heian-kyō: that of Taira no Masakado in the Kantō plain and that of Fujiwara no Sumitomo on the Inland Sea. Masakado, a grandson of an imperial prince who had settled in the east, won a long feud with his uncles in the 930s. In the eleventh month of 939 he took the side of a local strongman against the governor of Hitachi and seized the provincial headquarters, and within weeks he had driven the governors out of the eight Kantō provinces, appointed his own and taken the title Shinnō, “new emperor”. He was killed in battle by his cousin Taira no Sadamori and Fujiwara no Hidesato on 25 March 940. Sumitomo, a former provincial official of Iyo who had been sent to suppress raiders on the Inland Sea, became the leader of armed men of the coast and from the end of 939 attacked officials, provincial offices and granaries from Settsu to Tosa. In 941 he seized and burned the Dazaifu in Kyushu, but his fleet was destroyed in Hakata Bay, and he was captured in Iyo and died in prison. The court won both wars only by rewarding the provincial warriors who fought for it, which is why historians see the rebellion as the moment when the warrior class came of age."
: "Två resningar som bröt ut nästan samtidigt i var sin ände av Japan och skakade hovet i Heian-kyō: Taira no Masakados på Kantōslätten och Fujiwara no Sumitomos vid Japanska innanhavet. Masakado, sonson till en kejserlig prins som hade slagit sig ned i öster, vann på 930-talet en långvarig fejd med sina farbröder. I elfte månaden 939 tog han parti för en lokal storman mot guvernören i Hitachi och intog provinsens förvaltningssäte, och inom några veckor hade han drivit ut guvernörerna ur Kantōs åtta provinser, utnämnt egna och antagit titeln Shinnō, ”den nye kejsaren”. Han dödades i strid av sin kusin Taira no Sadamori och Fujiwara no Hidesato den 25 mars 940. Sumitomo, en tidigare provinsämbetsman i Iyo som hade sänts ut för att slå ned plundrare på Innanhavet, blev ledare för kustens beväpnade män och angrep från slutet av 939 ämbetsmän, provinskanslier och spannmålsmagasin från Settsu till Tosa. År 941 intog och brände han Dazaifu på Kyushu, men hans flotta förintades i Hakatabukten, och han tillfångatogs i Iyo och dog i fängelse. Hovet vann båda krigen endast genom att belöna de provinskrigare som stred för det, och därför ser historiker upproret som det ögonblick då krigarklassen blev myndig."
