# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
John Brown’s raid on Harpers Ferry: John Browns räd mot Harpers Ferry
? "An armed attempt by the abolitionist John Brown to start a war of liberation against slavery. On the night of 16 October 1859 Brown and 21 men, 16 white and five Black (Osborne Perry Anderson, Shields Green, John Anthony Copeland, Lewis Sheridan Leary and Dangerfield Newby, who hoped to free his enslaved wife and children), crossed the Potomac from their base at the Kennedy Farm in Maryland and seized the federal armory, arsenal and rifle works at Harpers Ferry, Virginia (now West Virginia). They meant to arm enslaved people who joined them and carry the fight south through the Appalachians, but few joined. They took hostages, among them Lewis Washington, a great-grandnephew of George Washington; the first man they killed was Heyward Shepherd, a free Black railway baggage master. Militia from Virginia and Maryland trapped the raiders in the armory’s engine house, and on the morning of 18 October a company of US Marines sent from Washington under Colonel Robert E. Lee, with Lieutenant J. E. B. Stuart, stormed it. Ten raiders were killed, among them two of Brown’s sons, and the raiders killed four townspeople and a Marine. Brown was tried by Virginia for treason against the state, murder and inciting enslaved people to rebel, and was hanged at Charles Town on 2 December 1859; six of his men were hanged after him, and five escaped. The raid deepened the divide between North and South: many Northerners came to see Brown as a martyr against slavery, while white Southerners saw proof of an abolitionist plot to raise a rebellion of the enslaved, and secessionists used it a year later."
: "Abolitionisten John Browns väpnade försök att starta ett befrielsekrig mot slaveriet. Natten den 16 oktober 1859 gick Brown och 21 män, 16 vita och fem svarta (Osborne Perry Anderson, Shields Green, John Anthony Copeland, Lewis Sheridan Leary och Dangerfield Newby, som hoppades kunna befria sin förslavade hustru och sina barn), över Potomac från sin bas på Kennedy Farm i Maryland och intog den federala vapenfabriken, arsenalen och gevärsverkstäderna i Harpers Ferry i Virginia (nu West Virginia). De tänkte beväpna förslavade människor som anslöt sig till dem och föra kampen söderut genom Appalacherna, men få anslöt sig. De tog gisslan, bland dem Lewis Washington, brorsons sonson till George Washington; den förste man de dödade var Heyward Shepherd, en fri svart bagagemästare vid järnvägen. Milis från Virginia och Maryland stängde in angriparna i vapenfabrikens spruthus, och på morgonen den 18 oktober stormades det av ett kompani ur USA:s marinkår, sänt från Washington under överste Robert E. Lee, med löjtnant J. E. B. Stuart. Tio av angriparna dödades, bland dem två av Browns söner, och angriparna dödade fyra av stadens invånare och en marinkårssoldat. Brown ställdes av Virginia inför rätta för förräderi mot delstaten, mord och uppvigling av förslavade människor till uppror och hängdes i Charles Town den 2 december 1859; sex av hans män hängdes efter honom, och fem kom undan. Räden fördjupade klyftan mellan nordstaterna och sydstaterna: många nordstatsbor kom att se Brown som en martyr i kampen mot slaveriet, medan vita sydstatsbor såg räden som ett bevis på en abolitionistisk sammansvärjning för att få de förslavade att resa sig i uppror, och secessionisterna utnyttjade den ett år senare."
