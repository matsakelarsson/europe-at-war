# Svenska översättningar av katalogtexten (våg 10); stegtexterna kommer senare.
Jōkyū War: Jōkyūkriget
? The short war in which the retired emperor Go-Toba tried to break the power of the Hōjō regents of the Kamakura shogunate and was crushed within a month, leaving the warrior government master of the court. After the assassination of the third Minamoto shōgun, Sanetomo, in 1219, the shogunate was run by his mother Hōjō Masako and her brother, the regent Hōjō Yoshitoki, with an infant from the Kujō family as nominal shōgun, while Go-Toba built up his own warrior guard and quarrelled with Kamakura over the stewards it placed on his estates. In the fifth month of 1221 Go-Toba had the shogunate’s deputy in Kyoto killed and declared Yoshitoki an outlaw, expecting the eastern warriors to abandon him. Instead, rallied by Masako, they marched on Kyoto in three armies, which the shogunate’s chronicle puts at 190,000 horsemen, against perhaps 17,500 for the court. The court’s forces were routed on the Kiso River on the fifth and sixth days of the sixth month and at Uji and Seta on the 13th and 14th, and Kamakura’s army entered Kyoto. Go-Toba was exiled to the Oki Islands, where he died in 1239, the retired emperors Juntoku and Tsuchimikado were sent to Sado and Tosa, and the child emperor Chūkyō was deposed. The shogunate confiscated more than 3,000 estates of the court’s supporters and set up the Rokuhara deputies to watch over the court.
: Det korta krig där den abdikerade kejsaren Go-Toba försökte bryta makten hos Hōjōregenterna i Kamakurashogunatet och krossades inom en månad, vilket gjorde krigarregeringen till herre över hovet. Efter mordet på den tredje shōgunen av Minamotoätten, Sanetomo, 1219 leddes shogunatet av hans mor Hōjō Masako och hennes bror, regenten Hōjō Yoshitoki, med ett spädbarn ur Kujōsläkten som shōgun till namnet, medan Go-Toba byggde upp ett eget krigargarde och tvistade med Kamakura om de förvaltare som shogunatet satte in på hans gods. I femte månaden 1221 lät Go-Toba döda shogunatets ställföreträdare i Kyoto och förklarade Yoshitoki fredlös, i förväntan att krigarna i öster skulle överge honom. I stället samlade de sig kring Masako och tågade mot Kyoto i tre arméer, som shogunatets krönika anger till 190 000 ryttare, mot kanske 17 500 för hovet. Hovets styrkor slogs på flykten vid Kisofloden den femte och sjätte dagen i sjätte månaden och vid Uji och Seta den 13:e och 14:e, och Kamakuras armé tågade in i Kyoto. Go-Toba förvisades till Okiöarna, där han dog 1239, de abdikerade kejsarna Juntoku och Tsuchimikado sändes till Sado och Tosa, och barnkejsaren Chūkyō avsattes. Shogunatet konfiskerade mer än 3 000 gods som tillhört hovets anhängare och inrättade Rokuharaställföreträdarna för att övervaka hovet.
