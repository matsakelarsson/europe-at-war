# Svenska översättningar av katalogtexten (våg 10); stegtexterna kommer senare.
Joseon’s Jurchen campaigns: Joseons fälttåg mot jurchenerna
The campaigns in which Joseon pushed its northern frontier to the Yalu and Tumen rivers and fought the Jurchen tribes beyond them. After Jianzhou Jurchens under Li Manzhu raided the upper Yalu in 1432, King Sejong sent Choe Yun-deok across the river in 1433 with 15,000 men against their villages on the Pojeo (Hun) River, and a second campaign followed in 1437; four new commanderies were set up along the upper Yalu. In the north-east, after the Jurchen chief Möngke Temür was killed in 1433, Kim Jong-seo built six fortified garrisons along the Tumen and settled them with people from the south. The upper-Yalu commanderies proved too costly and were abandoned in the 1450s, but the Tumen line held, and the two rivers became Korea’s border. Joseon joined Ming attacks on the Jianzhou Jurchens in 1467, when Li Manzhu was killed, and in 1479, and in 1491 Heo Jong led some 20,000 men across the Tumen against the Udige.: De fälttåg genom vilka Joseon flyttade fram sin nordgräns till floderna Yalu och Tumen och bekämpade jurchenstammarna bortom dem. Sedan jurchener från Jianzhou under Li Manzhu hade gjort räder mot övre Yalu 1432 sände kung Sejong 1433 Choe Yun-deok över floden med 15 000 man mot deras byar vid floden Pojeo (Hun), och ett andra fälttåg följde 1437; fyra nya kommenderier upprättades längs övre Yalu. I nordöst byggde Kim Jong-seo, sedan jurchenhövdingen Möngke Temür hade dödats 1433, sex befästa garnisoner längs Tumen och befolkade dem med människor från söder. Kommenderierna vid övre Yalu visade sig alltför kostsamma och övergavs på 1450-talet, men linjen vid Tumen höll, och de två floderna blev Koreas gräns. Joseon deltog i Mings angrepp på jurchenerna i Jianzhou 1467, då Li Manzhu dödades, och 1479, och 1491 ledde Heo Jong omkring 20 000 man över Tumen mot udige.
