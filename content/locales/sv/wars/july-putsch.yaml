July Putsch: Julikuppen
A failed coup by Austrian Nazis against the government of Engelbert Dollfuss. On 25 July 1934 about 150 members of the SS-Standarte 89, disguised as soldiers and police, seized the Federal Chancellery in Vienna and shot Dollfuss, who died of his wounds, while others took the radio station and falsely announced a change of government. The putsch collapsed in Vienna within hours, but fighting went on in Carinthia, Styria and other provinces until 30 July. Mussolini moved troops to the Brenner Pass, and Hitler, whose regime had encouraged the Austrian Nazis, disowned them. Between about 220 and 270 people were killed. Thirteen putschists were executed, and Kurt Schuschnigg succeeded Dollfuss as chancellor.: En misslyckad kupp av österrikiska nazister mot Engelbert Dollfuss regering. Den 25 juli 1934 intog omkring 150 medlemmar av SS-Standarte 89, förklädda till soldater och poliser, förbundskansliet i Wien och sköt Dollfuss, som dog av sina skador, medan andra tog radiostationen och falskeligen tillkännagav ett regeringsskifte. Kuppen föll samman i Wien inom några timmar, men striderna fortsatte i Kärnten, Steiermark och andra delstater till den 30 juli. Mussolini förflyttade trupper till Brennerpasset, och Hitler, vars regim hade uppmuntrat de österrikiska nazisterna, tog avstånd från dem. Mellan omkring 220 och 270 människor dödades. Tretton kuppmakare avrättades, och Kurt Schuschnigg efterträdde Dollfuss som förbundskansler.
