The Nazi Party had been banned in Austria since June 1933. Many Austrian Nazis had fled to Germany, where some joined the Austrian Legion; the putschists hoped to make the Christian Social politician Anton Rintelen chancellor.: Nazistpartiet hade varit förbjudet i Österrike sedan juni 1933. Många österrikiska nazister hade flytt till Tyskland, där en del anslöt sig till Österrikiska legionen; kuppmakarna hoppades kunna göra den kristligsociale politikern Anton Rintelen till förbundskansler.
