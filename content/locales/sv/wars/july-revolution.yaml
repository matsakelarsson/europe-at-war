Also called the French Revolution of 1830 or the Three Glorious Days (les Trois Glorieuses). The ordinances were signed on 25 July and published in Le Moniteur the next day.: Kallas också franska revolutionen 1830 eller De tre ärorika dagarna (les Trois Glorieuses). Ordinanserna undertecknades den 25 juli och publicerades i Le Moniteur dagen därpå.
