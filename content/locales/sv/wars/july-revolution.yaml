July Revolution: Julirevolutionen
? The rising in Paris that overthrew Charles X, the last Bourbon king of France. On 26 July 1830 the government of Jules de Polignac published the July Ordinances, which suspended the freedom of the press, dissolved the newly elected Chamber of Deputies, in which the liberal opposition had won a large majority, and narrowed the franchise. On the “Three Glorious Days” of 27–29 July, printers, workers, students and former soldiers fought Marshal Auguste Marmont’s troops from barricades; as some line regiments went over to the crowd, the insurgents took the Hôtel de Ville, the Louvre and the Tuileries, and the royal forces left the city. Several hundred insurgents and soldiers were killed. Charles X abdicated on 2 August and went into exile in Britain. The liberal deputies passed over his grandson and on 9 August made his cousin Louis Philippe, Duke of Orléans, “King of the French” under a revised Charter, beginning the July Monarchy. The revolution helped inspire the Belgian Revolution and the November Uprising in Poland, and Eugène Delacroix commemorated it in Liberty Leading the People.
: Upproret i Paris som störtade Karl X, Frankrikes siste bourbonske kung. Den 26 juli 1830 offentliggjorde Jules de Polignacs regering juliordinanserna, som upphävde tryckfriheten, upplöste den nyvalda deputeradekammaren, där den liberala oppositionen vunnit en stor majoritet, och inskränkte rösträtten. Under de ”tre ärorika dagarna” 27–29 juli kämpade tryckare, arbetare, studenter och före detta soldater från barrikaderna mot marskalk Auguste Marmonts trupper; när några linjeregementen gick över till folkmassan intog upprorsmännen Hôtel de Ville, Louvren och Tuilerierna, och de kungliga styrkorna lämnade staden. Flera hundra upprorsmän och soldater dödades. Karl X abdikerade den 2 augusti och gick i exil i Storbritannien. De liberala deputerade förbigick hans sonson och gjorde den 9 augusti hans kusin Ludvig Filip, hertig av Orléans, till ”fransmännens konung” under en reviderad konstitution (Charte), vilket inledde julimonarkin. Revolutionen bidrog till att inspirera den belgiska revolutionen och novemberupproret i Polen, och Eugène Delacroix förevigade den i Friheten på barrikaderna.
