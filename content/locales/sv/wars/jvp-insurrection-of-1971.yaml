JVP insurrection of 1971: JVP-upproret 1971
An armed rising against the government of Ceylon (Sri Lanka from 1972) by the Janatha Vimukthi Peramuna (JVP, People’s Liberation Front), a Marxist movement of mostly young, educated and unemployed Sinhalese from the rural south. Its leader, Rohana Wijeweera, was arrested in March 1971, and the government of Sirimavo Bandaranaike declared a state of emergency. On 5 April, starting with the police station at Wellawaya, JVP groups attacked 92 police stations across the island, took five and forced the abandonment of dozens more, and for some weeks held much of the Southern and Sabaragamuwa provinces and parts of the interior. With arms, aircraft and helicopters sent by India, Pakistan, the United Kingdom, the Soviet Union and others, the army and police retook the rebel areas by June. Thousands of young people were killed, many after capture; the government’s figure at the time was about 1,200 dead, while unofficial estimates run from 4,000–5,000 to 10,000 or more.: Ett väpnat uppror mot Ceylons regering (Sri Lanka från 1972) av Janatha Vimukthi Peramuna (JVP, Folkets befrielsefront), en marxistisk rörelse av mestadels unga, utbildade och arbetslösa singaleser från den lantliga södern. Rörelsens ledare, Rohana Wijeweera, greps i mars 1971, och Sirimavo Bandaranaikes regering utlyste undantagstillstånd. Den 5 april angrep JVP-grupper, med början vid polisstationen i Wellawaya, 92 polisstationer runt om på ön, intog fem och tvingade fram utrymningen av dussintals andra, och under några veckor behärskade de stora delar av Södra provinsen och Sabaragamuwaprovinsen samt delar av öns inre. Med vapen, flygplan och helikoptrar som Indien, Pakistan, Storbritannien, Sovjetunionen med flera hade sänt hade armén och polisen återtagit rebellområdena i juni. Tusentals unga människor dödades, många efter att ha tagits till fånga; regeringens siffra vid den tiden var omkring 1 200 döda, medan inofficiella uppskattningar sträcker sig från 4 000–5 000 till 10 000 eller fler.
