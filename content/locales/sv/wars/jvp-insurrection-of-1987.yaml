JVP insurrection of 1987–1989: JVP-upproret 1987–1989
? The second armed rising of the Janatha Vimukthi Peramuna (JVP, People’s Liberation Front), a Marxist movement of young Sinhalese from the rural south of Sri Lanka, and the state terror with which it was crushed. Banned after the riots of July 1983, the JVP went underground, and after the Indo-Sri Lanka Accord of July 1987 brought Indian troops to the north and east, it led a violent campaign against the accord, which it called a betrayal of the nation. Its armed wing, the Deshapremi Janatha Viyaparaya (DJV, Patriotic People’s Movement), killed politicians, officials, police and anyone who defied its orders to strike, and in 1988–1989 brought much of the south to a halt. The government of Ranasinghe Premadasa answered with a counter-insurgency in which the army, the police and death squads killed tens of thousands of young people, many of whom disappeared. The JVP’s leader Rohana Wijeweera was captured and killed in November 1989, and by the end of the year the rising was over. Estimates of the dead range from about 40,000 to 80,000.
: Det andra väpnade upproret av Janatha Vimukthi Peramuna (JVP, Folkets befrielsefront), en marxistisk rörelse av unga singaleser från den lantliga södra delen av Sri Lanka, och den statsterror med vilken det krossades. JVP förbjöds efter upploppen i juli 1983 och gick under jorden, och sedan avtalet mellan Indien och Sri Lanka i juli 1987 hade fört indiska trupper till öns norra och östra delar ledde rörelsen en våldsam kampanj mot avtalet, som den kallade ett förräderi mot nationen. Dess väpnade gren, Deshapremi Janatha Viyaparaya (DJV, Patriotiska folkrörelsen), dödade politiker, tjänstemän, poliser och alla som trotsade dess order om strejk, och 1988–1989 lamslog den stora delar av södern. Ranasinghe Premadasas regering svarade med en upprorsbekämpning där armén, polisen och dödsskvadroner dödade tiotusentals unga människor, av vilka många försvann. JVP:s ledare Rohana Wijeweera tillfångatogs och dödades i november 1989, och vid årets slut var upproret över. Uppskattningarna av antalet döda varierar från omkring 40 000 till 80 000.
