# Svenska översättningar av katalogtexten (våg 10); stegtexterna kommer senare.
Kaga Rebellion and the Ikkō-ikki province: Kagaupproret och Ikkō-ikki-provinsen
? The rising in which the leagues (ikki) of the Jōdo Shinshū followers of the Hongan-ji, the Ikkō-ikki, overthrew the governor of Kaga and ruled the province for almost a century. The preacher Rennyo, head of the Hongan-ji, had won a great following of farmers, village warriors (jizamurai), merchants and monks in Kaga and Echizen while he lived at Yoshizaki in 1471–1475. In 1473–1474 the leagues helped Togashi Masachika win the governorship (shugo) of Kaga from his brother Kōchiyo, but Masachika soon turned on them. In 1487 he marched to Ōmi with the shogun Ashikaga Yoshihisa against the Rokkaku, and the leagues, led by Rennyo’s sons and joined by Togashi vassals, rose in his absence. In the sixth month of 1488 an army put at 100,000 to 200,000 besieged him in Takao castle, near today’s Kanazawa, and he killed himself as it fell. The leagues set up his kinsman Togashi Yasutaka as a figurehead governor, and Kaga became known as “the province held by the peasants” (hyakushō no mochitaru kuni), governed by the leagues, the temples and the local warriors, and from 1546 from the Oyama Gobō, a fortified temple on the site of Kanazawa. The leagues fought among themselves in 1531, against the Asakura of Echizen and the Uesugi, and supported the Hongan-ji in its war with Oda Nobunaga. After the Hongan-ji made peace in 1580, Nobunaga’s general Shibata Katsuie took the Oyama Gobō; the last resistance in the mountains near Hakusan was crushed in 1582.
: Den resning där förbunden (ikki) av Hongan-jis anhängare inom Jōdo Shinshū, Ikkō-ikki, störtade guvernören i Kaga och styrde provinsen i nästan ett sekel. Predikanten Rennyo, Hongan-jis överhuvud, hade vunnit en stor anhängarskara bland bönder, bykrigare (jizamurai), köpmän och munkar i Kaga och Echizen medan han bodde i Yoshizaki 1471–1475. Åren 1473–1474 hjälpte förbunden Togashi Masachika att vinna guvernörsposten (shugo) i Kaga från hans bror Kōchiyo, men Masachika vände sig snart mot dem. År 1487 tågade han till Ōmi med shogunen Ashikaga Yoshihisa mot Rokkakuklanen, och förbunden, ledda av Rennyos söner och med anslutning av Togashis vasaller, reste sig i hans frånvaro. I sjätte månaden 1488 belägrade en armé som uppskattats till 100 000 till 200 000 man honom i Takaoborgen, nära dagens Kanazawa, och han tog livet av sig när borgen föll. Förbunden insatte hans släkting Togashi Yasutaka som guvernör till namnet, och Kaga blev känt som ”provinsen som innehas av bönderna” (hyakushō no mochitaru kuni), styrd av förbunden, templen och de lokala krigarna, från 1546 från Oyama Gobō, ett befäst tempel på den plats där Kanazawa ligger. Förbunden stred inbördes 1531, mot Asakuraklanen i Echizen och mot Uesugiklanen, och stödde Hongan-ji i dess krig mot Oda Nobunaga. Sedan Hongan-ji slutit fred 1580 intog Nobunagas general Shibata Katsuie Oyama Gobō; det sista motståndet i bergen nära Hakusan krossades 1582.
