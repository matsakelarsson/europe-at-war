# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
Kaidu–Kublai war: Kriget mellan Kaidu och Khubilai
? The long war between Kaidu, a grandson of the Great Khan Ögedei, and Kublai Khan and his successor Temür, fought over the steppe and oases of Central Asia, the Uyghur lands and Mongolia. Kaidu, who held lands south-east of Lake Balkhash, never accepted Kublai’s victory over Ariq Böke. From 1268 he fought Kublai’s armies around Almaliq, won control of the Chagatai lands after the Chagatayid khan Baraq was defeated by the Ilkhan at Herat in 1270, and was recognised as ruler of the house of Ögedei in 1271. With the Chagatayid Du’a he raided the Uyghur kingdom of Qocho, took Beshbaliq from its Yuan garrison in 1286 and captured Karakorum in 1289, and he was allied with the Mongol princes of Manchuria in Nayan’s rebellion of 1287. Kublai held Mongolia and China but slowly gave up the Tarim oases. After Kublai’s death in 1294 the war went on under Temür Khan; in 1301 Kaidu was wounded in battle with the Yuan army under Khaishan and died soon after. Du’a and Kaidu’s son Chapar made peace with the Yuan in 1303–1304, recognising the Yuan emperor as nominal overlord.
: Det långa kriget mellan Kaidu, sonson till storkhanen Ögedei, och Khubilai khan och hans efterträdare Temür, utkämpat om Centralasiens stäpper och oaser, uigurernas länder och Mongoliet. Kaidu, som innehade länder sydost om Balchasjsjön, godtog aldrig Khubilais seger över Ariq Böke. Från 1268 bekämpade han Khubilais arméer kring Almaliq, fick kontroll över Tjagatais länder sedan den tjagataidiske khanen Baraq hade besegrats av ilkhanen vid Herat 1270, och erkändes 1271 som härskare över Ögedeis hus. Tillsammans med tjagataiden Du’a företog han räder mot det uiguriska kungariket Qocho, tog Beshbaliq från dess Yuangarnison 1286 och intog Karakorum 1289, och han var allierad med de mongoliska furstarna i Manchuriet under Nayans uppror 1287. Khubilai behöll Mongoliet och Kina men gav gradvis upp Tarimoaserna. Efter Khubilais död 1294 fortsatte kriget under Temür khan; 1301 sårades Kaidu i strid mot Yuanarmén under Khaishan och dog kort därefter. Du’a och Kaidus son Chapar slöt fred med Yuan 1303–1304 och erkände Yuankejsaren som nominell överherre.
