# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
Kaixi war: Kaixikriget
? The Southern Song attempt to recover northern China from the Jin, named after the Song reign period Kaixi (1205–1207) and also called the Kaixi Northern Expedition. The chief minister Han Tuozhou, who had dominated the court since 1194, judged the Jin weakened by floods, unrest and the rising Mongols. Song troops crossed the border in May 1206, and war was formally declared on 14 June. Apart from Bi Zaiyu’s capture of Sizhou, the attacks on Suzhou, Shouzhou, Tangzhou and Caizhou failed, and in the autumn Jin armies under Pusan Kui crossed the Huai, besieged Xiangyang and reached the Yangtze. In December 1206 Wu Xi, the Song commander in Sichuan and grandson of Wu Lin, went over to the Jin, ceded four prefectures and was made King of Shu; Song loyalists led by Li Haoyi and Yang Juyuan killed him in his palace on 29 March 1207. With the war lost, a court faction around Shi Miyuan and Empress Yang had Han Tuozhou killed on 24 November 1207, and his head was later sent to the Jin as the price of peace. The peace of Jiading (1208) restored the border of 1142, raised the yearly payments to 300,000 taels of silver and 300,000 bolts of silk and added a war indemnity of three million taels. Dates are converted from the Chinese calendar as the sources give them.
: Södra Songs försök att återvinna norra Kina från Jin, uppkallat efter Songdynastins regeringsperiod Kaixi (1205–1207) och även kallat Kaixifälttåget mot norr. Förste ministern Han Tuozhou, som hade dominerat hovet sedan 1194, bedömde att Jin var försvagat av översvämningar, oroligheter och de framväxande mongolerna. Songtrupper gick över gränsen i maj 1206, och krig förklarades formellt den 14 juni. Med undantag för Bi Zaiyus erövring av Sizhou misslyckades angreppen på Suzhou, Shouzhou, Tangzhou och Caizhou, och på hösten gick Jinarméer under Pusan Kui över Huai, belägrade Xiangyang och nådde Yangtze. I december 1206 gick Wu Xi, Songrikets befälhavare i Sichuan och sonson till Wu Lin, över till Jin, avträdde fyra prefekturer och utnämndes till kung av Shu; Songlojalister under ledning av Li Haoyi och Yang Juyuan dödade honom i hans palats den 29 mars 1207. Sedan kriget var förlorat lät en hovfraktion kring Shi Miyuan och kejsarinnan Yang döda Han Tuozhou den 24 november 1207, och hans huvud sändes senare till Jin som pris för freden. Freden i Jiading (1208) återställde gränsen från 1142, höjde de årliga betalningarna till 300 000 tael silver och 300 000 rullar siden och lade till ett krigsskadestånd på tre miljoner tael. Datumen har räknats om från den kinesiska kalendern enligt källornas uppgifter.
