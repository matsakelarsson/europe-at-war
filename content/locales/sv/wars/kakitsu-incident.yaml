# Svenska översättningar av katalogtexten (våg 10); stegtexterna kommer senare.
Kakitsu Incident: Kakitsuincidenten
? "The murder of the shogun Ashikaga Yoshinori by Akamatsu Mitsusuke, and the campaign that destroyed the Akamatsu. Yoshinori, chosen by lot in 1428, ruled harshly: he meddled in the successions of the great houses, crushed the Kamakura kubō in 1439, and punished courtiers and warriors for small offences, so that a contemporary diarist wrote of “terror for all men”. Mitsusuke, governor of Harima, Bizen and Mimasaka and one of the senior lords, feared that his provinces would go to a favoured kinsman, Akamatsu Sadamura. On 12 July 1441 (the 24th day of the sixth month of Kakitsu 1) his son Noriyasu invited the shogun and many lords to his house in Kyoto to celebrate the victory at Yūki castle. During a performance armed men burst in and killed Yoshinori; several of his companions, among them Kyōgoku Takakazu and Ōuchi Mochiyo, died or were mortally wounded, and the other guests were let go. Mitsusuke set fire to his house and withdrew to Harima with the shogun’s head, set up a descendant of Ashikaga Tadafuyu, Ashikaga Yoshitaka, as a rival lord, and waited. The leaders in Kyoto were slow to act; Yoshinori’s eight-year-old son Yoshikatsu was named shogun, and the court issued an order to punish the Akamatsu only after a delay. Armies under Yamana Mochitoyo (later known as Sōzen) and Hosokawa Mochitsune invaded Harima and Mimasaka in the seventh and eighth months, the Akamatsu’s men deserted, and on 25 September 1441 Mitsusuke took his own life in Shiroyama castle near Tatsuno. The Yamana took Harima, Bizen and Mimasaka, which made them the rivals of the Hosokawa, and in the confusion a great debt rising (the Kakitsu tokusei ikki) forced the shogunate to cancel debts. With child shoguns the shogunate never regained Yoshinori’s power."
: "Akamatsu Mitsusukes mord på shogunen Ashikaga Yoshinori och det fälttåg som förintade Akamatsuklanen. Yoshinori, som valts genom lottdragning 1428, styrde hårdhänt: han blandade sig i de stora ätternas tronföljd, krossade Kamakura kubō 1439 och straffade hovmän och krigare för småförseelser, så att en samtida dagboksförfattare skrev om ”skräck för alla människor”. Mitsusuke, guvernör i Harima, Bizen och Mimasaka och en av de främsta stormännen, fruktade att hans provinser skulle gå till en gunstling inom släkten, Akamatsu Sadamura. Den 12 juli 1441 (den 24:e dagen i sjätte månaden Kakitsu 1) bjöd hans son Noriyasu in shogunen och många stormän till sitt hus i Kyoto för att fira segern vid Yūkiborgen. Under en föreställning trängde beväpnade män in och dödade Yoshinori; flera av hans följeslagare, bland dem Kyōgoku Takakazu och Ōuchi Mochiyo, dödades eller sårades dödligt, och de övriga gästerna släpptes. Mitsusuke satte eld på sitt hus och drog sig tillbaka till Harima med shogunens huvud, insatte en ättling till Ashikaga Tadafuyu, Ashikaga Yoshitaka, som rivaliserande herre och väntade. Ledarna i Kyoto var långsamma att agera; Yoshinoris åttaårige son Yoshikatsu utsågs till shogun, och hovet utfärdade en order om att straffa Akamatsuklanen först efter ett dröjsmål. Arméer under Yamana Mochitoyo (senare känd som Sōzen) och Hosokawa Mochitsune invaderade Harima och Mimasaka i sjunde och åttonde månaden, Akamatsus män deserterade, och den 25 september 1441 tog Mitsusuke sitt liv i Shiroyamaborgen nära Tatsuno. Yamanaklanen tog Harima, Bizen och Mimasaka, vilket gjorde den till Hosokawaklanens rival, och i förvirringen tvingade ett stort skulduppror (Kakitsu tokusei ikki) shogunatet att avskriva skulder. Med barn som shoguner återfick shogunatet aldrig den makt Yoshinori hade haft."
