# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
Kalinago genocide on Saint Kitts: Folkmordet på kalinagofolket på Saint Kitts
? The killing of the Kalinago of Saint Kitts (Liamuiga) by English and French colonists in 1626, two years after the island became the first English and French colony in the Caribbean. The English under Thomas Warner had landed in 1624 with the consent of the Kalinago leader Ouboutou Tegremante (Tegremond), and the French under Pierre Belain d’Esnambuc followed in 1625; as the colonists cleared more land for tobacco, relations broke down. In 1626, in August by local tradition, a Kalinago woman named Barbe told Warner and d’Esnambuc that Tegremond was summoning warriors from other islands to drive the colonists out. Acting on this report, which the historian Melanie Newton calls “slim intelligence”, the English and French attacked the Kalinago by night after a feast, killing about 120 people, Tegremond among them. They then drove the remaining Kalinago, some 3,000 to 4,000 people by the usual estimates, towards the river and point on the west coast still called Bloody River and Bloody Point, and killed most of them; the historian Vincent Hubbard puts the dead at about 2,000, many of them killed as they tried to surrender, while about 100 colonists also died. The survivors fled into the mountains; by 1640 those who had not been enslaved had been forced to leave for Dominica. In 1627 the English and French divided the island between them. Historians such as Andreas Buser have argued that the killings meet the definition of genocide; Saint Kitts and Nevis marked their 400th anniversary at Challengers, beside the Bloody River, in August 2026.
: Dödandet av kalinagofolket på Saint Kitts (Liamuiga), utfört av engelska och franska kolonister 1626, två år efter att ön hade blivit den första engelska och franska kolonin i Karibien. Engelsmännen under Thomas Warner hade landstigit 1624 med samtycke av kalinagoledaren Ouboutou Tegremante (Tegremond), och fransmännen under Pierre Belain d’Esnambuc följde 1625; när kolonisterna röjde allt mer mark för tobak bröt förbindelserna samman. År 1626, enligt den lokala traditionen i augusti, berättade en kalinagokvinna vid namn Barbe för Warner och d’Esnambuc att Tegremond kallade till sig krigare från andra öar för att driva ut kolonisterna. På grundval av denna uppgift, som historikern Melanie Newton kallar ”tunna underrättelser”, anföll engelsmännen och fransmännen kalinagofolket nattetid efter en fest och dödade omkring 120 människor, bland dem Tegremond. Därpå drev de resten av kalinagofolket, enligt de vanliga uppskattningarna omkring 3 000 till 4 000 människor, mot den flod och udde på västkusten som fortfarande kallas Bloody River och Bloody Point, och dödade de flesta av dem; historikern Vincent Hubbard uppskattar antalet döda till omkring 2 000, många av dem dödade när de försökte ge sig, medan även omkring 100 kolonister dog. De överlevande flydde upp i bergen; år 1640 hade de som inte hade förslavats tvingats ge sig av till Dominica. År 1627 delade engelsmännen och fransmännen ön mellan sig. Historiker som Andreas Buser har hävdat att dödandet uppfyller definitionen av folkmord; Saint Kitts och Nevis högtidlighöll 400-årsminnet vid Challengers, intill Bloody River, i augusti 2026.
