Under Eric of Pomerania, Swedes complained of heavy taxes and harsh foreign bailiffs. In the summer of 1434 miners and peasants of Dalarna and Bergslagen rose under Engelbrekt Engelbrektsson, a mine owner from Norberg, and burned Borganäs castle.: Under Erik av Pommern klagade svenskarna över tunga skatter och hårda utländska fogdar. Sommaren 1434 reste sig bergsmän och bönder i Dalarna och Bergslagen under Engelbrekt Engelbrektsson, en bergsman från Norberg, och brände Borganäs slott.
The revolt spread through Svealand and Götaland, castle after castle was attacked, and Engelbrekt was chosen captain of the realm. On 4 May 1436 he was murdered on an islet in Lake Hjälmaren by the nobleman Måns Bengtsson. The council chose Karl Knutsson as regent, and Eric was deposed a few years later.: Upproret spred sig genom Svealand och Götaland, borg efter borg angreps, och Engelbrekt valdes till rikshövitsman. Den 4 maj 1436 mördades han på en holme i Hjälmaren av adelsmannen Måns Bengtsson. Riksrådet valde Karl Knutsson till riksföreståndare, och Erik avsattes några år senare.
