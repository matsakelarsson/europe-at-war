Sten Sture the Younger, regent from 1512, fought off Christian II of Denmark twice, winning at Brännkyrka outside Stockholm in 1518. In January 1520 Christian came again with a large mercenary army. On the ice of Lake Åsunden near Bogesund on 19 January, a cannonball struck Sture in the leg. He died on 3 February, and resistance collapsed except in Stockholm, held by his widow Christina Gyllenstierna.: Sten Sture den yngre, riksföreståndare från 1512, slog två gånger tillbaka Kristian II av Danmark och segrade vid Brännkyrka utanför Stockholm 1518. I januari 1520 kom Kristian på nytt med en stor legoarmé. På isen på sjön Åsunden nära Bogesund träffades Sture den 19 januari av en kanonkula i benet. Han dog den 3 februari, och motståndet bröt samman utom i Stockholm, som hölls av hans änka Kristina Gyllenstierna.
Stockholm surrendered that autumn in return for an amnesty, and Christian was crowned king. Days later, on 7–9 November 1520, he had more than 80 nobles, clergy and burghers of the Sture party executed in the Stockholm Bloodbath. Among the dead was the father of a young nobleman, Gustav Eriksson Vasa.: Stockholm kapitulerade samma höst mot löfte om amnesti, och Kristian kröntes till kung. Några dagar senare, den 7–9 november 1520, lät han avrätta mer än 80 adelsmän, präster och borgare ur Sturepartiet i Stockholms blodbad. Bland de döda fanns fadern till en ung adelsman, Gustav Eriksson Vasa.
