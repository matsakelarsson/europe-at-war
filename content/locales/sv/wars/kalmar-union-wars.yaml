Wars of the Kalmar Union: Kalmarunionens krig
The wars over the Scandinavian thrones from the deposition of Magnus Eriksson in 1364 to the Stockholm Bloodbath of 1520. Queen Margaret united Denmark, Norway and Sweden in the Kalmar Union in 1397, but Swedish nobles, peasants and miners fought the union kings again and again.: Krigen om de nordiska tronerna från Magnus Erikssons avsättning 1364 till Stockholms blodbad 1520. Drottning Margareta förenade Danmark, Norge och Sverige i Kalmarunionen 1397, men svenska stormän, bönder och bergsmän bekämpade unionskungarna gång på gång.
