For decades Swedish nobles fought over whether to stay in the union. Karl Knutsson was elected king three times between 1448 and 1467, in between struggles with Christian I of Denmark. After Karl died, his nephew Sten Sture the Elder became regent, and in 1471 Christian sailed to Stockholm with an army to reclaim the Swedish crown.: I årtionden stred svenska stormän om huruvida riket skulle stanna i unionen. Karl Knutsson valdes till kung tre gånger mellan 1448 och 1467, med strider mot Kristian I av Danmark däremellan. Sedan Karl dött blev hans systerson Sten Sture den äldre riksföreståndare, och 1471 seglade Kristian till Stockholm med en armé för att återta den svenska kronan.
On 10 October 1471 Sture’s army of peasants, miners and townsmen attacked Christian’s camp on the Brunkeberg ridge just north of the city, while the Stockholm garrison struck from inside. Christian was hit in the face and his army was routed. Sweden stayed in the union in name, but Sture ruled it in practice.: Den 10 oktober 1471 anföll Stures armé av bönder, bergsmän och borgare Kristians läger på Brunkebergsåsen strax norr om staden, medan Stockholmsgarnisonen slog till inifrån. Kristian träffades i ansiktet och hans armé slogs på flykten. Sverige förblev formellt i unionen, men Sture styrde det i praktiken.
