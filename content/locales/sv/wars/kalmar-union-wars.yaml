In 1364 Swedish nobles deposed Magnus Eriksson and chose a German prince, Albert of Mecklenburg, as king. By the 1380s Albert had fallen out with the same nobles, and the Swedish council turned for help to Margaret, the widowed queen who already ruled Denmark and Norway.: År 1364 avsatte svenska stormän Magnus Eriksson och valde en tysk furste, Albrekt av Mecklenburg, till kung. På 1380-talet hade Albrekt råkat i konflikt med samma stormän, och det svenska riksrådet vände sig för att få hjälp till Margareta, den änkedrottning som redan styrde Danmark och Norge.
On 24 February 1389 Margaret’s army defeated Albert at Åsle near Falköping and captured him and his son. His German supporters held out in Stockholm, supplied by the Victual Brothers, until the Hanseatic League stepped in. Albert was released in 1395 and Stockholm passed to Margaret in 1398. In June 1397 her great-nephew Eric of Pomerania was crowned at Kalmar as king of all three kingdoms.: Den 24 februari 1389 besegrade Margaretas armé Albrekt vid Åsle nära Falköping och tog honom och hans son till fånga. Hans tyska anhängare höll stånd i Stockholm, försörjda av vitaliebröderna, tills Hansan ingrep. Albrekt släpptes 1395 och Stockholm övergick till Margareta 1398. I juni 1397 kröntes hennes systerdotterson Erik av Pommern i Kalmar till kung över alla tre rikena.
