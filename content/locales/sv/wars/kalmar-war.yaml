Kalmar War: Kalmarkriget
A war between Denmark–Norway and Sweden, begun by Christian IV partly over Swedish claims to the far north of Norway. The Danes took Kalmar and Älvsborg, and by the Peace of Knäred in 1613 Sweden had to pay one million riksdaler to get Älvsborg back.: Ett krig mellan Danmark–Norge och Sverige, som Kristian IV inledde delvis på grund av svenska anspråk på Norges nordligaste delar. Danskarna tog Kalmar och Älvsborg, och genom freden i Knäred 1613 tvingades Sverige betala en miljon riksdaler för att få tillbaka Älvsborg.
