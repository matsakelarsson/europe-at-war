The Danes caught Gustav II Adolf’s raiding force, and the king barely escaped.: Danskarna överraskade Gustav II Adolfs härjningsstyrka, och kungen kom med knapp nöd undan.
Signed at a border bridge in Danish Halland, with James I of England as guarantor. Both sides returned their conquests.: Undertecknad vid en gränsbro i danska Halland, med Jakob I av England som garant. Båda sidor återlämnade sina erövringar.
