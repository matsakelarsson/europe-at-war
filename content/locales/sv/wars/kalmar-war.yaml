Christian IV of Denmark–Norway declared war in 1611, partly over Charles IX’s claims to the far north of Norway. The Danes besieged and took Kalmar that summer, and Charles IX died in October, leaving the throne to his 16-year-old son Gustav II Adolf.: Kristian IV av Danmark–Norge förklarade krig 1611, delvis på grund av Karl IX:s anspråk på Norges nordligaste delar. Danskarna belägrade och intog Kalmar samma sommar, och Karl IX dog i oktober och lämnade tronen till sin 16-årige son Gustav II Adolf.
In 1612 the Danes held the sea, took Öland and in May captured Älvsborg and Gullberg, cutting Sweden off from the west coast again. The young king raided Danish Scania and narrowly escaped at Vittsjö. At Knäred on 20 January 1613, Sweden had to agree to a ransom of one million riksdaler to get Älvsborg back, a sum that took six years to pay.: År 1612 behärskade danskarna havet, tog Öland och erövrade i maj Älvsborg och Gullberg, vilket åter skar av Sverige från västkusten. Den unge kungen gjorde härjningståg i danska Skåne och kom med knapp nöd undan vid Vittsjö. I Knäred den 20 januari 1613 tvingades Sverige gå med på en lösen på en miljon riksdaler för att få tillbaka Älvsborg, en summa som tog sex år att betala.
