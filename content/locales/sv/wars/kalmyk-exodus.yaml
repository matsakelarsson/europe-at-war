# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
Kalmyk (Torghut) exodus: Kalmuckernas (torguternas) uttåg
? The flight of most of the Kalmyks of the lower Volga, led by Ubashi Khan, across the Kazakh steppe to Dzungaria, then under the Qing. The Kalmyks, Oirat Mongols who had come to the Volga in the 1630s, saw their pastures taken by Russian and German settlers and Cossack lines, their khan’s power curbed by a council the Russian government imposed, their horsemen called up for Russia’s wars and their people pressed to convert to Orthodoxy. With the blessing of the Dalai Lama, who chose the date, the uluses on the left (eastern) bank of the Volga set out in January 1771; the ice on the Volga was too weak for those on the right bank, mostly Dörbets, to cross, and they stayed in Russia. Estimates of the number who left range from about 140,000 to 200,000 people, with millions of animals. They crossed the Ural, where they killed Cossacks at Vetlyaninskaya, and were harried across the steppe by Kazakhs of the Junior Zhuz under Nurali Khan and later by Ablai Khan’s men, while a Russian corps under Traubenberg set out from Orsk and gave up the pursuit. Fighting, cold, thirst and hunger killed tens of thousands; estimates of those who reached the Ili valley in July 1771 range from about 70,000–85,000 to, in some Kazakh accounts, only 15,000–20,000. The Qianlong emperor received them as subjects, gave Ubashi the title of khan and settled the Torghuts in separate banners across Dzungaria. In October 1771 Catherine II abolished the Kalmyk Khanate; the Kalmyks who remained on the Volga came under the governor of Astrakhan.
: Flykten för de flesta av kalmuckerna vid nedre Volga, under ledning av Ubashi khan, över den kazakiska stäppen till Dzungariet, som då lydde under Qing. Kalmuckerna, oiratmongoler som hade kommit till Volga på 1630-talet, såg sina betesmarker tas av ryska och tyska nybyggare och av kosacklinjer, sin khans makt beskuren av ett råd som den ryska regeringen påtvingade dem, sina ryttare inkallade till Rysslands krig och sitt folk pressat att övergå till den ortodoxa tron. Med dalai lamas välsignelse, och på ett datum som han valt, bröt ulusarna på Volgas vänstra (östra) strand upp i januari 1771; isen på Volga var för svag för att de på den högra stranden, mest dörbeter, skulle kunna ta sig över, och de stannade i Ryssland. Uppskattningarna av antalet som gav sig av varierar från omkring 140 000 till 200 000 människor, med miljontals djur. De gick över floden Ural, där de dödade kosacker vid Vetljaninskaja, och ansattes under färden över stäppen av kazaker från Yngre zhuzen under Nurali khan och senare av Ablai khans män, medan en rysk kår under Traubenberg bröt upp från Orsk och sedan gav upp förföljandet. Strider, köld, törst och hunger dödade tiotusentals; uppskattningarna av hur många som nådde Ilidalen i juli 1771 varierar från omkring 70 000–85 000 till, enligt vissa kazakiska berättelser, bara 15 000–20 000. Qianlongkejsaren tog emot dem som undersåtar, gav Ubashi khantiteln och bosatte torguterna i separata fanor runt om i Dzungariet. I oktober 1771 avskaffade Katarina II Kalmuckkhanatet; de kalmucker som stannade vid Volga ställdes under guvernören i Astrachan.
