# Svenska översättningar av katalogtexten (våg 13); stegtexterna kommer senare.
Kamerun campaign: Kamerunfälttåget
? The British, French and Belgian conquest of the German colony of Kamerun in the First World War, a campaign of 18 months fought across forest, mountains and savanna by African soldiers under European officers and tens of thousands of African carriers. The French attacked from Equatorial Africa and Chad on 6 August 1914 and British columns from Nigeria on 25 August, but the Germans beat the British at Garua and Nsanakang and held the mountain of Mora. An Allied squadron took the port of Duala on 27 September 1914, and the Allies occupied the coast and the railways. In 1915 the British took Garua and Ngaoundéré in the north, while the Germans, who had raised their force to about 6,000 men, held the forested hills around their new capital at Yaoundé and threw back the first advance on it. French and Belgian columns overran the eastern lands Germany had gained from France in 1911. The converging advance of late 1915 took Yaoundé on 1 January 1916, and in January and February the German troops, officials and thousands of Cameroonians crossed into neutral Spanish Guinea, where they were interned. The last German garrison, on Mora, surrendered on 18 February 1916. Britain and France divided the colony, and in 1922 it became the League of Nations mandates of British and French Cameroons.
: Den brittiska, franska och belgiska erövringen av den tyska kolonin Kamerun under första världskriget, ett fälttåg på 18 månader som utkämpades i skog, berg och savann av afrikanska soldater under europeiska officerare och av tiotusentals afrikanska bärare. Fransmännen anföll från Ekvatorialafrika och Tchad den 6 augusti 1914 och brittiska kolonner från Nigeria den 25 augusti, men tyskarna slog britterna vid Garua och Nsanakang och höll berget Mora. En allierad eskader intog hamnstaden Duala den 27 september 1914, och de allierade besatte kusten och järnvägarna. År 1915 intog britterna Garua och Ngaoundéré i norr, medan tyskarna, som hade ökat sin styrka till omkring 6 000 man, höll de skogklädda bergen kring sin nya huvudstad Yaoundé och slog tillbaka den första framryckningen mot staden. Franska och belgiska kolonner överskred de östra områden som Tyskland hade vunnit från Frankrike 1911. Den koncentriska framryckningen i slutet av 1915 intog Yaoundé den 1 januari 1916, och i januari och februari gick de tyska trupperna och tjänstemännen och tusentals kameruner över gränsen till det neutrala Spanska Guinea, där de internerades. Den sista tyska garnisonen, på Mora, kapitulerade den 18 februari 1916. Storbritannien och Frankrike delade upp kolonin, och 1922 blev den Nationernas förbunds mandat Brittiska Kamerun och Franska Kamerun.
