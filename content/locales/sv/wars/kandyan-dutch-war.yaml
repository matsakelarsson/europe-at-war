# Svenska översättningar av katalogtexten (våg 8); stegtexterna kommer senare.
Kandyan–Dutch war: Kriget mellan Kandy och Nederländerna
? The war between the Kingdom of Kandy, in the highlands of Sri Lanka, and the Dutch East India Company, which held the island’s coasts. In 1760–1761 a great rising broke out in the Dutch-ruled lowlands, and in 1761 King Kirti Sri Rajasinha’s forces came down to support it, overrunning Matara and Hanwella and destroying Dutch forts in the south. The new governor, Lubbert Jan van Eck, retook them in 1762 and Puttalam and Chilaw in 1763. A first Dutch expedition against Kandy in 1764 was turned back by bad weather and roads, but a second, of some 7,000 to 8,000 men, took the abandoned capital in February 1765 and plundered the palace. The Kandyans fought on from the hills, attacking supply lines while disease weakened the Dutch, until the king, his kingdom close to starvation, accepted the Treaty of Batticaloa (Hanguranketha) on 14 February 1766. Kandy recognised Dutch sovereignty over the whole coastline to a depth of about four miles inland, lost its access to the sea and allowed the Dutch to peel cinnamon in its forests. The Dutch held these lands until the British took them in 1795–1796.
: Kriget mellan kungariket Kandy, i Sri Lankas högland, och Nederländska ostindiska kompaniet, som behärskade öns kuster. År 1760–1761 bröt ett stort uppror ut i det nederländskstyrda låglandet, och 1761 drog kung Kirti Sri Rajasinhas styrkor ned för att stödja det, intog Matara och Hanwella och förstörde nederländska fort i söder. Den nye guvernören, Lubbert Jan van Eck, återtog dem 1762 och Puttalam och Chilaw 1763. En första nederländsk expedition mot Kandy 1764 tvingades vända av dåligt väder och dåliga vägar, men en andra, på omkring 7 000 till 8 000 man, intog den övergivna huvudstaden i februari 1765 och plundrade palatset. Kandyborna fortsatte kampen från bergen och angrep försörjningslinjerna medan sjukdomar försvagade nederländarna, tills kungen, vars rike var nära svält, godtog freden i Batticaloa (Hanguranketha) den 14 februari 1766. Kandy erkände nederländsk överhöghet över hela kustlinjen till ett djup av omkring fyra engelska mil inåt land, förlorade sitt tillträde till havet och lät nederländarna skala kanel i sina skogar. Nederländarna behöll dessa landområden tills britterna tog dem 1795–1796.
