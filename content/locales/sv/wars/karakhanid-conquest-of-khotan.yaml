Kara-Khanid conquest of Khotan: Karakhanidernas erövring av Khotan
The long war between the Muslim Turkic Karakhanids of Kashgar and the Buddhist kingdom of Khotan, the last independent state of the old Iranian-speaking oasis peoples of the Tarim Basin. After the Karakhanid prince Satuq Bughra Khan converted to Islam in 934 and took Kashgar, he and his son Musa pressed on Khotan, and a war of raids and sieges followed between the two oases, some 500 km apart along the southern edge of the Taklamakan. Khotan, allied by marriage with the Cao rulers of Dunhuang and in contact with the Song court, took Kashgar for a time in about 970 and in 971 offered the Song emperor a dancing elephant captured there. The Karakhanids recovered, and sometime before or in 1006 Yusuf Qadir Khan of Kashgar conquered Khotan. The conquest ended Buddhism in Khotan and with it a thousand years of the kingdom’s history, and the western Tarim Basin became Turkic-speaking and Muslim. Much of what is known of the war comes from later Muslim legends and from Mahmud al-Kashgari’s dictionary of the 1070s.: Det långa kriget mellan de muslimska turkiska karakhaniderna i Kashgar och det buddhistiska kungariket Khotan, den sista självständiga staten bland Tarimbäckenets gamla iranskspråkiga oasfolk. Sedan karakhanidfursten Satuq Bughra khan hade övergått till islam 934 och intagit Kashgar satte han och hans son Musa press på Khotan, och ett krig med räder och belägringar följde mellan de två oaserna, som ligger omkring 500 km från varandra längs Taklamakans södra rand. Khotan, som genom giftermål var allierat med släkten Cao, härskarna i Dunhuang, och hade förbindelser med Songhovet, intog Kashgar för en tid omkring 970 och erbjöd 971 Songkejsaren en dansande elefant som hade tagits som byte där. Karakhaniderna återhämtade sig, och någon gång före eller under 1006 erövrade Yusuf Qadir khan av Kashgar Khotan. Erövringen gjorde slut på buddhismen i Khotan och därmed på tusen år av kungarikets historia, och västra Tarimbäckenet blev turkiskspråkigt och muslimskt. Mycket av det som är känt om kriget kommer från senare muslimska legender och från Mahmud al-Kashgaris ordbok från 1070-talet.
