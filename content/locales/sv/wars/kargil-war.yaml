# Svenska översättningar av katalogtexten (våg 8); stegtexterna kommer senare.
Kargil War: Kargilkriget
A war between India and Pakistan in the Kargil district of Ladakh, then part of the Indian state of Jammu and Kashmir, the first fought between two nuclear-armed states. Over the winter of 1998–1999 Pakistani soldiers of the Northern Light Infantry, presented by Pakistan at first as Kashmiri fighters, crossed the Line of Control and occupied heights overlooking the Srinagar–Leh road. After the intrusion was discovered in May 1999, India drove them back in costly mountain assaults supported by air strikes, retaking Tololing, Tiger Hill and most other positions. Under American and international pressure Prime Minister Nawaz Sharif agreed on 4 July to withdraw, and India declared its operation complete on 26 July. India put its dead at 527 and Pakistan at 453; other estimates of Pakistan’s losses are higher. The war contributed to the military coup that overthrew Sharif in October 1999.: Ett krig mellan Indien och Pakistan i distriktet Kargil i Ladakh, då en del av den indiska delstaten Jammu och Kashmir, och det första som utkämpats mellan två kärnvapenmakter. Under vintern 1998–1999 gick pakistanska soldater ur Northern Light Infantry, som Pakistan först framställde som kashmiriska kämpar, över kontrollinjen och besatte höjder som behärskade vägen mellan Srinagar och Leh. Sedan intrånget hade upptäckts i maj 1999 drev Indien tillbaka dem i kostsamma anfall i bergen med stöd av flyganfall och återtog Tololing, Tiger Hill och de flesta andra ställningar. Under amerikanska och internationella påtryckningar gick premiärminister Nawaz Sharif den 4 juli med på att dra sig tillbaka, och Indien förklarade sin operation avslutad den 26 juli. Indien uppgav sina döda till 527 och Pakistan sina till 453; andra uppskattningar av Pakistans förluster är högre. Kriget bidrog till den militärkupp som störtade Sharif i oktober 1999.
