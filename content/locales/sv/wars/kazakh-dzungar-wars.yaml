# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
Kazakh–Dzungar wars: Kazakisk-dzungariska krigen
? A century of wars between the Kazakh Khanate and the Dzungar Khanate, the last great Oirat (western Mongol) steppe empire, for the pastures of Zhetysu (Semirechye) and the towns of the middle Syr Darya. The Dzungars, better organised and with firearms of their own, won most of the campaigns, though the Kazakhs held them at the gorge of Orbulaq in 1643. Galdan took Sayram and Tashkent in the 1680s, Tsewang Rabtan defeated the Senior Zhuz on the Chu and Talas in 1698, and in 1723 a sudden Dzungar invasion took Turkestan, Tashkent and Sayram and drove many Kazakh clans from their lands in what Kazakhs remember as the Aqtaban Shubyryndy, the “barefoot flight”. A united Kazakh militia under Abulkhair won battles at Bulanty and Anyrakay in 1727–1730, but rivalry among the khans ended the alliance. Abulkhair’s Junior Zhuz swore allegiance to Russia in 1731, the Senior Zhuz paid tribute to the Dzungars, and Galdan Tseren’s armies invaded the Middle Zhuz again in 1739–1742. The wars ended when the Dzungar Khanate fell apart after 1745 and was destroyed by the Qing in 1755–1758; the Kazakh sultan Ablai, after supporting rival Dzungar princes, came to terms with the Qing in 1757, and Kazakh clans moved into the emptied pastures.
: Ett sekel av krig mellan Kazakkhanatet och Dzungarkhanatet, det sista stora oiratiska (västmongoliska) stäppriket, om betesmarkerna i Zhetysu (Semiretje) och städerna vid mellersta Syr-Darja. Dzungarerna, som var bättre organiserade och hade egna eldvapen, vann de flesta fälttågen, även om kazakerna höll stånd mot dem i ravinen vid Orbulaq 1643. Galdan intog Sayram och Tasjkent på 1680-talet, Tsewang Rabtan besegrade Äldre zhuzen vid Tju och Talas 1698, och 1723 intog dzungarerna i en plötslig invasion Turkestan, Tasjkent och Sayram och drev många kazakiska klaner från deras land, i det som kazakerna minns som Aqtaban Shubyryndy, ”den barfota flykten”. En enad kazakisk milis under Abulkhair vann slag vid Bulanty och Anyrakay 1727–1730, men rivaliteten mellan khanerna gjorde slut på alliansen. Abulkhairs Yngre zhuzen svor Ryssland trohet 1731, Äldre zhuzen betalade tribut till dzungarerna, och Galdan Tserens arméer invaderade Mellersta zhuzen på nytt 1739–1742. Krigen tog slut när Dzungarkhanatet föll sönder efter 1745 och förintades av Qing 1755–1758; den kazakiske sultanen Ablai, som hade stött rivaliserande dzungariska furstar, kom överens med Qing 1757, och kazakiska klaner flyttade in på de tömda betesmarkerna.
