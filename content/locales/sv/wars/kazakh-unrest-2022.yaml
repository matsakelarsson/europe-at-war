# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
2022 Kazakh unrest: Oroligheterna i Kazakstan 2022
? "Nationwide protests and riots in Kazakhstan in January 2022, known there as the January events or “Bloody January” (Qandy Qañtar). They began on 2 January in the oil town of Zhanaozen in Mangystau, after the lifting of a price cap nearly doubled the price of liquefied gas used to fuel cars, and spread within days to most cities, with demands that widened to direct elections of governors and the departure of the former president Nursultan Nazarbayev, who still chaired the Security Council. On 4–5 January protests in Almaty turned violent: the city hall and offices of the ruling Nur Otan party were set on fire, the airport was seized for a time and weapons were taken from police and security buildings. President Kassym-Jomart Tokayev dismissed the government, took over the Security Council from Nazarbayev, declared a state of emergency and asked the Russian-led Collective Security Treaty Organization (CSTO) for help; about 2,000 troops from Russia, Belarus, Armenia, Kyrgyzstan and Tajikistan arrived from 6 January to guard strategic sites. On 7 January Tokayev said he had ordered the security forces to “shoot to kill without warning” and called the rioters “terrorists” and “bandits”; he later described the events as an attempted coup. Official death tolls rose from 225 in mid-January to between 232 and 238 in later counts, 19 of them security personnel; more than 9,900 people were detained, and hundreds said they had been beaten or tortured in custody. The CSTO troops left by 19 January, when the state of emergency ended. The former head of the National Security Committee, Karim Massimov, was later convicted of treason and attempting to seize power; Human Rights Watch and others criticised the lack of an independent investigation into the killings."
: "Landsomfattande protester och upplopp i Kazakstan i januari 2022, där kända som januarihändelserna eller ”Blodiga januari” (Qandy Qañtar). De började den 2 januari i oljestaden Zjanaozen i Mangystau, sedan avskaffandet av ett pristak nästan hade fördubblat priset på den flytande gas som används som bilbränsle, och spred sig inom några dagar till de flesta städer, med krav som vidgades till direktval av guvernörer och att den förre presidenten Nursultan Nazarbajev, som fortfarande var ordförande i säkerhetsrådet, skulle lämna sina poster. Den 4–5 januari blev protesterna i Almaty våldsamma: stadshuset och det styrande partiet Nur Otans kontor sattes i brand, flygplatsen besattes en tid och vapen togs från polisens och säkerhetstjänstens byggnader. President Kassym-Zjomart Tokajev avsatte regeringen, tog över ordförandeskapet i säkerhetsrådet från Nazarbajev, utlyste undantagstillstånd och bad den ryskledda Organisationen för fördraget om kollektiv säkerhet (CSTO) om hjälp; omkring 2 000 soldater från Ryssland, Belarus, Armenien, Kirgizistan och Tadzjikistan anlände från den 6 januari för att bevaka strategiska platser. Den 7 januari sade Tokajev att han hade beordrat säkerhetsstyrkorna att ”skjuta för att döda utan förvarning” och kallade upprorsmakarna ”terrorister” och ”banditer”; senare beskrev han händelserna som ett kuppförsök. De officiella dödssiffrorna steg från 225 i mitten av januari till mellan 232 och 238 i senare sammanräkningar, varav 19 ur säkerhetsstyrkorna; mer än 9 900 människor greps, och hundratals uppgav att de hade misshandlats eller torterats i förvar. CSTO-trupperna hade lämnat landet den 19 januari, då undantagstillståndet upphörde. Den förre chefen för Nationella säkerhetskommittén, Karim Masimov, dömdes senare för landsförräderi och försök att gripa makten; Human Rights Watch och andra kritiserade avsaknaden av en oberoende utredning av dödandet."
