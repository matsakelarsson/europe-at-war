# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
Kazakh–Uzbek wars: Krigen mellan kazaker och uzbeker
? The wars between the Kazakh sultans Kerei and Janibek and their successors and the Uzbek descendants of Abu’l-Khayr Khan, in which the Kazakh Khanate was founded and took the steppe north of the Syr Darya. In 1457 or soon after, Kerei and Janibek, Jochid princes of a rival line, left Abu’l-Khayr’s Uzbek Khanate with their followers and settled in the Chu and Talas valleys with the permission of the khan of Moghulistan; the Kazakh Khanate is usually dated from about 1465. When Abu’l-Khayr died on a campaign against them in 1468, his realm broke up and many of his people joined the Kazakhs. His grandson Muhammad Shaybani fought the Kazakh khans Burunduk and Kasym for the towns of the middle Syr Darya (Sighnaq, Sauran, Otrar, Yasi) for three decades, then turned south and conquered Mawarannahr in 1500–1507. His last campaign against the Kazakhs failed in the winter of 1509–1510, months before he was killed fighting the Safavids at Merv, and under Kasym Khan the Kazakh Khanate became the leading power of the steppe.
: Krigen mellan de kazakiska sultanerna Kerei och Janibek och deras efterträdare och Abu’l-Khayr khans uzbekiska ättlingar, under vilka Kazakkhanatet grundades och tog stäppen norr om Syr-Darja. År 1457 eller kort därefter lämnade Kerei och Janibek, jochidiska furstar av en rivaliserande gren, Abu’l-Khayrs uzbekiska khanat med sina anhängare och slog sig ned i Chu- och Talasdalarna med tillstånd av khanen av Moghulistan; Kazakkhanatet brukar dateras från omkring 1465. När Abu’l-Khayr dog under ett fälttåg mot dem 1468 föll hans rike sönder, och många av hans folk anslöt sig till kazakerna. Hans sonson Muhammad Shaybani kämpade i tre decennier mot de kazakiska khanerna Burunduk och Kasym om städerna vid mellersta Syr-Darja (Sighnaq, Sauran, Otrar, Yasi) och vände sig sedan söderut och erövrade Mawarannahr 1500–1507. Hans sista fälttåg mot kazakerna misslyckades vintern 1509–1510, några månader innan han stupade i strid mot safaviderna vid Merv, och under Kasym khan blev Kazakkhanatet stäppens ledande makt.
