# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
Kenesary’s rebellion: Kenesarys uppror
The longest Kazakh rising against Russian rule, led by Kenesary Kasymov (Kenesary Kasymuly), a grandson of Ablai Khan, against the district administration that had replaced the khans of the Middle Zhuz in 1822 and against the Khanate of Kokand in the south. Kenesary burned the Russian fortress of Akmola in 1838, and in 1841 an assembly of the three zhuzes elected him khan. For a few years he ruled much of the central steppe, fought Kokand for the towns of the Syr Darya and the Karatau, and eluded the Russian columns and loyal Kazakh sultans sent against him; at its height his army numbered about 20,000. Pushed south-east by new forts and by sultans who went over to Russia, he invaded the lands of the northern Kyrgyz in 1847, was defeated by Ormon Khan near Tokmok, captured and put to death. His death opened Semirechye to the Russian advance. In Kazakhstan he is honoured as the last khan of the Kazakhs; in Kyrgyz tradition his invasion is remembered for the burning of auls and Ormon’s victory over him.: Det längsta kazakiska upproret mot det ryska styret, lett av Kenesary Kasymov (Kenesary Kasymuly), en sonson till Ablai khan, mot den distriktsförvaltning som 1822 hade ersatt khanerna i Mellersta zhuzen och mot khanatet Kokand i söder. Kenesary brände den ryska fästningen Akmola 1838, och 1841 valde en församling av de tre zhuzerna honom till khan. Under några år styrde han stora delar av den centrala stäppen, stred mot Kokand om städerna vid Syr-Darja och Karatau och undkom de ryska kolonner och lojala kazakiska sultaner som sändes mot honom; när den var som störst räknade hans armé omkring 20 000 man. Trängd mot sydost av nya fästen och av sultaner som gick över till Ryssland invaderade han de nordliga kirgizernas land 1847, besegrades av Ormon khan nära Tokmok, tillfångatogs och avrättades. Hans död öppnade Semiretje för den ryska framryckningen. I Kazakstan hedras han som kazakernas siste khan; i kirgizisk tradition minns man hans invasion för de brända aulerna och för Ormons seger över honom.
