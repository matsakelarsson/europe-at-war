# Svenska översättningar av katalogtexten (våg 10); stegtexterna kommer senare.
Khitan invasion of Goryeo: Khitanernas invasion av Goryeo
? The invasion of Goryeo by Khitans fleeing the Mongols, which ended in Goryeo’s first alliance with the Mongol Empire. After the Khitan prince Yelü Liuge rebelled against the Jin in Manchuria in 1211 and allied himself with Genghis Khan, his brother Yelü Sibu and other Khitan leaders broke away and set up a rival Liao state (Later Liao). Driven out of Liaodong by the Mongols and by Yelü Liuge, these Khitans, led by the princes Jinshan and Jinshi, crossed the Yalu into Goryeo in the eighth month of 1216, an estimated 90,000 people. They plundered the north-west and in 1217 raided deep into the centre of the country, until defeats at the hands of Kim Chwi-ryeo and other generals drove them back north. In the winter of 1218, 10,000 Mongol troops under Hajin and Jala, with 20,000 Jurchens of Eastern Xia under Wanyan Ziyuan, entered Goryeo from the north-east in pursuit, and the remaining Khitans shut themselves up in the fortress of Gangdong, east of Pyongyang. Snow cut the Mongols’ supplies, and the Goryeo commander of the north-west, Jo Chung, sent them 1,000 sacks of rice and then troops under Kim Chwi-ryeo. Early in 1219 the Khitan leader Hamsa hanged himself and about 50,000 Khitans surrendered. Hajin and Jo Chung swore an oath of brotherhood between the Mongols and Goryeo, which was soon followed by heavy Mongol demands for tribute.
: Invasionen av Goryeo av khitaner på flykt undan mongolerna, som slutade med Goryeos första allians med Mongolriket. Sedan khitanprinsen Yelü Liuge 1211 hade gjort uppror mot Jin i Manchuriet och allierat sig med Djingis khan bröt sig hans bror Yelü Sibu och andra khitanledare loss och grundade en rivaliserande Liaostat (Senare Liao). Dessa khitaner, som drivits ut ur Liaodong av mongolerna och av Yelü Liuge, gick under ledning av prinsarna Jinshan och Jinshi över Yalu in i Goryeo i åttonde månaden 1216, uppskattningsvis 90 000 människor. De plundrade nordväst och gjorde 1217 räder djupt in i landets mitt, tills nederlag mot Kim Chwi-ryeo och andra generaler drev dem tillbaka norrut. Vintern 1218 gick 10 000 mongoliska soldater under Hajin och Jala, med 20 000 jurchener från Östra Xia under Wanyan Ziyuan, in i Goryeo från nordost för att förfölja dem, och de kvarvarande khitanerna förskansade sig i fästningen Gangdong öster om Pyongyang. Snön skar av mongolernas försörjning, och Goryeos befälhavare i nordväst, Jo Chung, sände dem 1 000 säckar ris och därefter trupper under Kim Chwi-ryeo. I början av 1219 hängde sig khitanledaren Hamsa och omkring 50 000 khitaner kapitulerade. Hajin och Jo Chung svor en broderskapsed mellan mongolerna och Goryeo, som snart följdes av tunga mongoliska krav på tribut.
