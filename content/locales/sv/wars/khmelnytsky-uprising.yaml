In the Dnieper lands of Poland–Lithuania, Orthodox Ruthenian peasants worked the estates of mostly Catholic, Polish or Polonised magnates, often under Jewish leaseholders who collected the dues. The Cossacks, frontier soldiers who had risen several times, were bitter that only a few thousand of them were recognised as registered, paid soldiers. Bohdan Khmelnytsky, a Cossack officer whose estate at Subotiv had been seized by a local Polish official, could get no redress, and in January 1648 he fled to the Zaporozhian Sich.: I Dneprområdena i Polen–Litauen brukade ortodoxa rutenska bönder godsen åt mestadels katolska, polska eller förpolskade magnater, ofta under judiska arrendatorer som drev in avgifterna. Kosackerna, gränssoldater som hade gjort uppror flera gånger, var bittra över att bara några tusen av dem var erkända som registrerade, avlönade soldater. Bohdan Chmelnytskyj, en kosackofficer vars gods i Subotiv hade tagits av en lokal polsk ämbetsman, kunde inte få upprättelse, och i januari 1648 flydde han till Zaporizjska Sitj.
Elected hetman, he won an alliance with the Crimean khan İslam III Giray. At Zhovti Vody in May the registered Cossacks sent against him changed sides, and the Polish vanguard under Stefan Potocki was destroyed on 16 May. On 26 May, at Korsun, Cossacks and Tatars ambushed the main Crown army; both its hetmans, Mikołaj Potocki and Marcin Kalinowski, were captured and handed over to the Tatars. King Władysław IV had died six days earlier, and the Commonwealth was left without a king or an army in Ukraine.: Han valdes till hetman och vann en allians med krimkhanen İslam III Giray. Vid Zjovti Vody i maj gick de registrerade kosacker som sänts mot honom över till hans sida, och den polska förtruppen under Stefan Potocki förintades den 16 maj. Den 26 maj, vid Korsun, lade kosacker och tatarer bakhåll för kronans huvudarmé; båda dess hetmaner, Mikołaj Potocki och Marcin Kalinowski, tillfångatogs och överlämnades till tatarerna. Kung Władysław IV hade dött sex dagar tidigare, och samväldet stod utan kung och utan armé i Ukraina.
