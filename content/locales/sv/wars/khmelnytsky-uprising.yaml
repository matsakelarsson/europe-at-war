Radziwiłł: Radziwiłł
Unable to beat Poland alone and abandoned again and again by the Tatars, Khmelnytsky turned to the Orthodox tsar. On 18 January 1654 a Cossack council at Pereiaslav accepted Tsar Alexis’s protection. The tsar’s envoy Vasily Buturlin refused to swear any oath in return, and the terms, settled in Moscow that spring, left the Hetmanate wide self-government. Ukrainian and Russian historians have argued ever since over whether it was a military alliance, a protectorate or a union.: Oförmögen att besegra Polen på egen hand och övergiven gång på gång av tatarerna vände sig Chmelnytskyj till den ortodoxe tsaren. Den 18 januari 1654 godtog ett kosackråd i Perejaslav tsar Aleksejs beskydd. Tsarens sändebud Vasilij Buturlin vägrade att svära någon ed i gengäld, och villkoren, som fastställdes i Moskva samma vår, gav hetmanatet ett omfattande självstyre. Ukrainska och ryska historiker har sedan dess tvistat om huruvida det var en militär allians, ett protektorat eller en union.
Russia went to war with Poland–Lithuania that year, and Cossack troops fought beside the Russians in Belarus. The Tatars switched to Poland’s side, and the armies met in deep frost at Okhmativ in January 1655. Khmelnytsky soon fell out with Moscow and drew closer to Sweden. He died at Chyhyryn on 6 August 1657. Much of Ukraine had been laid waste by war, famine, plague and slave raids, and the struggle over the Hetmanate went on for decades.: Ryssland gick i krig med Polen–Litauen samma år, och kosacktrupper stred vid ryssarnas sida i Belarus. Tatarerna gick över till Polens sida, och arméerna möttes i sträng kyla vid Ochmativ i januari 1655. Chmelnytskyj blev snart osams med Moskva och närmade sig Sverige. Han dog i Tjyhyryn den 6 augusti 1657. Stora delar av Ukraina hade ödelagts av krig, svält, pest och slavräder, och kampen om hetmanatet fortsatte i årtionden.
