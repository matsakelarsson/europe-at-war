The victories set off a peasant war. Bands of Cossacks and peasants, some led by colonels such as Maksym Kryvonis, killed Polish and Polonised nobles, Catholic priests, Uniate clergy and above all Jews, often whole communities, at Nemyriv, Tulchyn, Polonne and many other towns. Jewish chroniclers of the time gave figures from tens of thousands to well over 100,000; modern historians mostly estimate that tens of thousands of Jews were killed or carried off, perhaps 15,000–30,000, out of some 40,000–50,000 living in the region. The prince Jeremi Wiśniowiecki answered with his own terror, impaling and hanging rebels as he retreated west.: Segrarna utlöste ett bondekrig. Skaror av kosacker och bönder, en del ledda av överstar som Maksym Kryvonis, dödade polska och förpolskade adelsmän, katolska präster, unierat prästerskap och framför allt judar, ofta hela församlingar, i Nemyriv, Tultjyn, Polonne och många andra städer. Samtida judiska krönikörer angav siffror från tiotusentals till långt över 100 000; moderna historiker uppskattar mestadels att tiotusentals judar dödades eller fördes bort, kanske 15 000–30 000, av omkring 40 000–50 000 som bodde i regionen. Fursten Jeremi Wiśniowiecki svarade med sin egen terror och spetsade och hängde upprorsmän när han drog sig tillbaka västerut.
On 23 September 1648, at Pyliavtsi in Podolia, a large Polish army led by three noble commanders broke in panic after two days of fighting and fled. Khmelnytsky marched west, took a heavy ransom from Lviv and besieged Zamość. After John II Casimir was elected king in November he turned back, and on 2 January 1649 he rode into Kyiv to be hailed as the ruler of Rus’. The Tatars took many thousands of captives, Ruthenians as well as Poles and Jews, to the slave markets of Crimea.: Den 23 september 1648, vid Pyljavtsi i Podolien, bröt en stor polsk armé ledd av tre adliga befälhavare samman i panik efter två dagars strider och flydde. Chmelnytskyj marscherade västerut, tog en tung lösen av Lviv och belägrade Zamość. Sedan Johan II Kasimir valts till kung i november vände han om, och den 2 januari 1649 red han in i Kyiv och hyllades som härskare över Rus. Tatarerna förde många tusen fångar, rutener såväl som polacker och judar, till slavmarknaderna på Krim.
