Wiśniowiecki: Wiśniowiecki
Talks over the winter failed. In the summer of 1649 Khmelnytsky and Khan İslam Giray, with a huge Cossack, peasant and Tatar army, besieged a small Polish army in the castle of Zbarazh. The defenders held out for more than a month. In the north the Lithuanian army under Janusz Radziwiłł beat a Cossack force at Loyew on the Dnieper in July and kept the war away from Lithuania.: Förhandlingarna under vintern misslyckades. Sommaren 1649 belägrade Chmelnytskyj och khan İslam Giray med en väldig armé av kosacker, bönder och tatarer en liten polsk armé i slottet i Zbarazj. Försvararna höll stånd i mer än en månad. I norr besegrade den litauiska armén under Janusz Radziwiłł en kosackstyrka vid Lojeŭ vid Dnepr i juli och höll kriget borta från Litauen.
John Casimir led a relief force of about 15,000–20,000 men, and on 15 August he was caught crossing the Strypa at Zboriv and surrounded. He saved himself by buying off the khan, and on 18 August he accepted the Treaty of Zboriv. The register was raised to 40,000 Cossacks, the voivodeships of Kyiv, Bratslav and Chernihiv were to be run by Orthodox nobles under the hetman, and Jews and Jesuits were barred from living there. Neither side was satisfied, and on their way home the Tatars carried off thousands of local people.: Johan Kasimir ledde en undsättningsstyrka på omkring 15 000–20 000 man, och den 15 augusti överraskades han när han gick över Strypa vid Zboriv och omringades. Han räddade sig genom att köpa sig fri från khanen, och den 18 augusti godtog han freden i Zboriv. Registret höjdes till 40 000 kosacker, vojvodskapen Kyiv, Bratslav och Tjernihiv skulle styras av ortodoxa adelsmän under hetmanen, och judar och jesuiter förbjöds att bo där. Ingen av sidorna var nöjd, och på hemvägen förde tatarerna bort tusentals lokala invånare.
