Dates are New Style (Gregorian), as used in Poland–Lithuania. The Cossacks and Russia used the Julian calendar, ten days behind, so Ukrainian and Russian accounts often give dates ten days earlier.: Datumen anges enligt den nya stilen (gregorianska kalendern), som användes i Polen–Litauen. Kosackerna och Ryssland använde den julianska kalendern, som låg tio dagar efter, så ukrainska och ryska framställningar anger ofta datum som ligger tio dagar tidigare.
