Khmelnytsky Uprising: Chmelnytskyjupproret
A Cossack rising led by Bohdan Khmelnytsky, allied at first with the Crimean Tatars, became a peasant war across Ukraine, with mass killings of Jews, Polish nobles and Catholic clergy and brutal reprisals. It created a Cossack state, the Hetmanate, which placed itself under the Russian tsar at Pereiaslav in 1654.: Ett kosackuppror lett av Bohdan Chmelnytskyj, till en början i allians med krimtatarerna, växte till ett bondekrig över hela Ukraina, med massmord på judar, polska adelsmän och katolska präster och brutala repressalier. Upproret skapade en kosackstat, hetmanatet, som 1654 i Perejaslav ställde sig under den ryske tsaren.
