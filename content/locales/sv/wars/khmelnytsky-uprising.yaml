Under Cossack rule by the Treaty of Zboriv: Under kosackstyre genom freden i Zboriv
War resumed in 1651. From 28 June the Commonwealth army, led by the king, fought Khmelnytsky and the khan at Berestechko in Volhynia, one of the largest battles of 17th-century Europe. On 30 June the Tatars fled, taking Khmelnytsky with them as a virtual prisoner. The leaderless Cossacks held a fortified camp beside the marshes for ten days; when Ivan Bohun led a breakout on 10 July the peasants panicked, and thousands were killed or drowned. That summer a Lithuanian army took Kyiv.: Kriget bröt ut på nytt 1651. Från den 28 juni stred samväldets armé, ledd av kungen, mot Chmelnytskyj och khanen vid Berestetjko i Volynien, ett av de största slagen i 1600-talets Europa. Den 30 juni flydde tatarerna och tog Chmelnytskyj med sig som i praktiken fånge. De ledarlösa kosackerna höll ett befäst läger vid träskmarkerna i tio dagar; när Ivan Bohun ledde ett utbrytningsförsök den 10 juli greps bönderna av panik, och tusentals dödades eller drunknade. Samma sommar intog en litauisk armé Kyiv.
The Treaty of Bila Tserkva in September cut the register to 20,000 and Cossack rule to the Kyiv voivodeship, but the Sejm never ratified it. In June 1652, at Batih in Podolia, Cossacks and Tatars overran the army of Hetman Kalinowski, who was killed. On Khmelnytsky’s orders thousands of Polish prisoners, many of them bought from the Tatars, were then killed. A royal campaign in 1653 ended inconclusively at Zhvanets when the khan again made a separate peace.: Freden i Bila Tserkva i september minskade registret till 20 000 och kosackstyret till Kyivs vojvodskap, men sejmen ratificerade den aldrig. I juni 1652, vid Batih i Podolien, överrände kosacker och tatarer hetman Kalinowskis armé, och han dödades. På Chmelnytskyjs order dödades därefter tusentals polska fångar, av vilka många köpts från tatarerna. Ett kungligt fälttåg 1653 slutade utan avgörande vid Zjvanets när khanen åter slöt separatfred.
