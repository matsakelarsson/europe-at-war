# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
Khmer–Cham wars: Krigen mellan khmerer och chamer
Seventy-five years of war between the Khmer Empire of Angkor and the Cham kingdoms on the coast of today’s central and southern Vietnam. In 1145 Suryavarman II, the builder of Angkor Wat, took the Cham capital Vijaya, but by 1150 Jaya Harivarman I had driven the Khmer and their Cham allies out. In 1177 Jaya Indravarman IV sent a fleet up the Mekong and across the Tonle Sap lake, took the Khmer capital Yaśodharapura by surprise and killed its king. Jayavarman VII drove the Chams out in a series of battles, among them a battle on the water shown on the walls of the Bayon, was crowned in 1181 and rebuilt the capital as Angkor Thom. In 1190 a Khmer army under the Cham prince Vidyanandana took Vijaya; after years of revolts and new invasions Champa was ruled as a Khmer province from 1203 until the Khmer withdrew in 1220 and Jaya Paramesvaravarman II restored its independence.: Sjuttiofem år av krig mellan Khmerriket i Angkor och chamernas riken vid kusten i dagens mellersta och södra Vietnam. År 1145 intog Suryavarman II, Angkor Wats byggherre, chamernas huvudstad Vijaya, men 1150 hade Jaya Harivarman I drivit ut khmererna och deras bundsförvanter bland chamerna. År 1177 sände Jaya Indravarman IV en flotta uppför Mekong och över sjön Tonle Sap, överrumplade och intog khmerernas huvudstad Yaśodharapura och dödade dess kung. Jayavarman VII drev ut chamerna i en rad slag, bland dem ett slag på vattnet som avbildas på Bayons väggar, kröntes 1181 och byggde upp huvudstaden på nytt som Angkor Thom. År 1190 intog en khmerarmé under champrinsen Vidyanandana Vijaya; efter år av uppror och nya invasioner styrdes Champa som en khmerisk provins från 1203 tills khmererna drog sig tillbaka 1220 och Jaya Paramesvaravarman II återställde dess självständighet.
