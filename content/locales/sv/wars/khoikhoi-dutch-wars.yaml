# Svenska översättningar av katalogtexten (våg 13); stegtexterna kommer senare.
Khoikhoi–Dutch wars: Krigen mellan khoikhoi och holländarna
? Two wars between the Dutch East India Company’s station at the Cape of Good Hope and the Khoikhoi, the herding peoples of the south-western Cape. The Company founded its refreshment station on Table Bay in 1652 to supply its ships with meat bought from the Khoikhoi. In 1657 it settled free burghers on farms along the Liesbeek River, on the dry-season grazing of the Peninsula Khoikhoi, and in May 1659 Doman (Nommoa), a Khoikhoi interpreter who had been to Batavia, led the Goringhaiqua and Gorachouqua in raids on the farms’ cattle, striking in the rain when the settlers’ matchlocks would not fire. The Company built a line of watch-houses and later planted a hedge of wild almond to close the settlement, and the peace of April 1660 left the settlers on the land they had taken. In 1673–1677 the Company fought the Cochoqua of the chief Gonnema, the largest Khoikhoi community near the Cape, who had killed hunting parties and attacked the Company’s post at Saldanha Bay. Company soldiers, burghers and Khoikhoi allies, the Chainouqua among them, raided the Cochoqua and carried off thousands of cattle and sheep, until Gonnema made peace in June 1677 and agreed to a yearly tribute of cattle. The wars opened the way for Dutch settlement beyond the peninsula; over the next decades the Khoikhoi of the south-western Cape lost their herds and grazing, and with the smallpox epidemic of 1713 their independence, and most became labourers on colonial farms.
: Två krig mellan Nederländska Ostindiska kompaniets station vid Godahoppsudden och khoikhoi, herdefolken i sydvästra Kapområdet. Kompaniet grundade sin proviantstation vid Taffelbukten 1652 för att förse sina fartyg med kött som köptes av khoikhoi. År 1657 lät kompaniet fria borgare slå sig ned på gårdar längs Liesbeekfloden, på de betesmarker som Kaphalvöns khoikhoi använde under torrperioden, och i maj 1659 ledde Doman (Nommoa), en khoikhoitolk som hade varit i Batavia, goringhaiqua och gorachouqua i räder mot gårdarnas boskap; de slog till i regnväder, då nybyggarnas luntlåsgevär inte gick att avfyra. Kompaniet byggde en rad vakthus och planterade senare en häck av vildmandel för att stänga in bosättningen, och freden i april 1660 lät nybyggarna behålla den mark de hade tagit. 1673–1677 bekämpade kompaniet cochoqua under hövdingen Gonnema, det största khoikhoisamhället i närheten av Godahoppsudden, som hade dödat jaktsällskap och angripit kompaniets post vid Saldanhabukten. Kompaniets soldater, borgare och khoikhoiska bundsförvanter, däribland chainouqua, gjorde räder mot cochoqua och förde bort tusentals nötkreatur och får, tills Gonnema slöt fred i juni 1677 och gick med på en årlig tribut i boskap. Krigen öppnade vägen för holländsk bosättning bortom halvön; under de följande decennierna förlorade khoikhoi i sydvästra Kapområdet sina hjordar och betesmarker, och med smittkoppsepidemin 1713 sin självständighet, och de flesta blev arbetare på koloniala gårdar.
