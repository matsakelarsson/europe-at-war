# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
Khoja revolts in Kashgaria: Khojaupproren i Kashgarien
? A series of invasions of Qing Kashgaria (the western Tarim basin) by descendants of the Afaqi Khojas, the Sufi family the Qing had driven out in 1759, launched from the Khanate of Kokand with Kyrgyz and Kokandi support. Jahangir Khoja, a grandson of Burhan al-Din, raided Kashgar in 1820 and in 1826 took Kashgar, Yangi Hissar, Yarkand and Khotan, killing the Qing garrison of Kashgar. A Qing army of more than 20,000 men retook the cities in the spring of 1827, and Jahangir was captured and executed in Beijing in 1828. In 1830 a Kokandi army with his brother Yusuf occupied Kashgar for three months; the settlement of 1832 gave Kokand the right to tax foreign merchants in Kashgaria and to station its agents there. Further invasions followed, by the Seven Khojas in 1847 and by Wali Khan, who held Kashgar for about four months in 1857 and beheaded the German traveller Adolf Schlagintweit. Each brought destruction, reprisals and the flight of thousands of townspeople to Kokand, and weakened Qing rule before the great Muslim revolt of 1864.
: En serie invasioner av Qingrikets Kashgarien (västra Tarimbäckenet) som ättlingar till afaqikhojorna, den sufisläkt som Qing hade drivit ut 1759, inledde från khanatet Kokand med kirgiziskt och kokandiskt stöd. Jahangir Khoja, en sonson till Burhan al-Din, gjorde en räd mot Kashgar 1820 och intog 1826 Kashgar, Yangi Hissar, Yarkand och Khotan och dödade Qinggarnisonen i Kashgar. En Qingarmé på mer än 20 000 man återtog städerna våren 1827, och Jahangir tillfångatogs och avrättades i Peking 1828. År 1830 ockuperade en kokandisk armé med hans bror Yusuf Kashgar i tre månader; uppgörelsen 1832 gav Kokand rätt att beskatta utländska köpmän i Kashgarien och att placera sina agenter där. Fler invasioner följde, av de sju khojorna 1847 och av Wali khan, som höll Kashgar i omkring fyra månader 1857 och halshögg den tyske resenären Adolf Schlagintweit. Var och en förde med sig förödelse, repressalier och tusentals stadsbors flykt till Kokand, och de försvagade Qingstyret före det stora muslimska upproret 1864.
