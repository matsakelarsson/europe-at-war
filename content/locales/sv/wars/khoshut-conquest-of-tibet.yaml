# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
Khoshut conquest of Tibet: Khoshuternas erövring av Tibet
The campaigns in which Güshi Khan, chief of the Khoshut Oirats, made the Gelug school of Tibetan Buddhism and its leader, the Fifth Dalai Lama, rulers of Tibet. In the early 17th century the Tsangpa kings of Shigatse, patrons of the Karma Kagyu school, ruled most of central Tibet and were hostile to the Gelug. When the Khalkha prince Choghtu Khong Tayiji, an ally of the Tsangpa, settled at Kokonor (Qinghai Lake) in 1634, the Gelug turned to the Oirats. Güshi Khan defeated and killed Choghtu in Kokonor in 1637, destroyed the Bön-patron king of Beri in Kham in 1640–1641, and in 1641–1642 invaded Tsang and took Shigatse after a long siege. In 1642 the Dalai Lama was installed as ruler of Tibet, with his regent Sonam Rapten running the new Ganden Phodrang government and Güshi Khan as king and protector, the start of the Khoshut Khanate and of the Dalai Lamas’ government, which lasted until 1959.: De fälttåg genom vilka Güshi khan, hövding över khoshutoiraterna, gjorde den tibetanska buddhismens gelugskola och dess ledare, den femte dalai lama, till Tibets härskare. I början av 1600-talet styrde tsangpakungarna i Shigatse, beskyddare av karma kagyu-skolan, större delen av centrala Tibet och var fientligt inställda till gelug. När khalkhafursten Choghtu Khong Tayiji, en bundsförvant till tsangpa, slog sig ned vid Kokonor (Qinghaisjön) 1634 vände sig gelug till oiraterna. Güshi khan besegrade och dödade Choghtu i Kokonor 1637, krossade 1640–1641 kungen av Beri i Kham, en beskyddare av bön, och 1641–1642 invaderade han Tsang och intog Shigatse efter en lång belägring. År 1642 insattes dalai lama som Tibets härskare, med sin regent Sonam Rapten som ledare för den nya regeringen Ganden Phodrang och Güshi khan som kung och beskyddare; det var början på Khoshutkhanatet och på dalai lamornas regering, som varade till 1959.
