# Svenska översättningar av katalogtexten (våg 7); stegtexterna kommer senare.
Khwarazmian–Ghurid wars: Khwarazmisk-ghuridiska krigen
The struggle between the Khwarazmshah Ala al-Din Muhammad II and the Ghurid sultans for Khorasan after the collapse of Seljuk rule there. The Ghurid brothers Ghiyath al-Din and Mu’izz al-Din overran Khorasan in 1201, but the Khwarazmshah won most of it back. In 1204 Mu’izz al-Din invaded Khwarazm itself, was forced back from its capital Gurganj and was routed at Andkhud by the Qara Khitai, the Khwarazmshah’s overlords. After his assassination in 1206 the Ghurid state broke up, and by 1215–1216 Muhammad had taken Herat, Firuzkuh, Bamyan and Ghazni, while the Ghurids’ Indian conquests passed to their Turkish commanders in Delhi, Multan and Lahore.: Kampen om Khorasan mellan khwarazmshahen Ala al-Din Muhammad II och de ghuridiska sultanerna sedan det seldjukiska styret där hade brutit samman. De ghuridiska bröderna Ghiyath al-Din och Mu’izz al-Din lade under sig Khorasan 1201, men khwarazmshahen vann tillbaka större delen. År 1204 föll Mu’izz al-Din in i själva Khwarazm, tvingades tillbaka från dess huvudstad Gurganj och slogs på flykten vid Andkhud av Qara Khitai, khwarazmshahens överherrar. Sedan han hade mördats 1206 föll den ghuridiska staten sönder, och 1215–1216 hade Muhammad intagit Herat, Firuzkuh, Bamyan och Ghazni, medan ghuridernas indiska erövringar övergick till deras turkiska befälhavare i Delhi, Multan och Lahore.
