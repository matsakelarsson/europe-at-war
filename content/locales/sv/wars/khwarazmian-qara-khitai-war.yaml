# Svenska översättningar av katalogtexten (våg 7); stegtexterna kommer senare.
Khwarazmian–Qara Khitai war: Kriget mellan Khwarazm och Qara Khitai
? The war in which the Khwarazmshah Ala al-Din Muhammad II threw off the overlordship of the Qara Khitai, the non-Muslim Khitan empire of Central Asia whose vassals the Khwarazmshahs had been since the Battle of Qatwan in 1141. Having driven the Ghurids out of Khorasan with Qara Khitai help, Muhammad turned on his overlords in 1207, when he entered Bukhara and the Karakhanid ruler of Samarkand, Uthman, went over to him. The first campaigns beyond the Oxus went badly; in one battle Muhammad was captured, unrecognised, and escaped by passing himself off as a servant. He stopped paying tribute, had a Qara Khitai envoy killed, and in 1210 defeated the Qara Khitai army on the Ilamish plain and captured its general Tayangu. The Qara Khitai empire was also attacked from within by the Naiman prince Kuchlug, a refugee from Genghis Khan, who seized its ruler Yelü Zhilugu in 1211. When Uthman of Samarkand turned against him in 1212 and had the Khwarazmians in the city killed, Muhammad stormed Samarkand, sacked it and executed Uthman, ending Karakhanid rule there. Transoxiana became Khwarazmian, and the Syr Darya the border with Kuchlug’s realm, which the Mongols conquered in 1218.
: Kriget där khwarazmshahen Ala al-Din Muhammad II skakade av sig överhögheten från Qara Khitai, det icke-muslimska khitanska riket i Centralasien, vars vasaller khwarazmshaherna hade varit sedan slaget vid Qatwan 1141. Sedan Muhammad med hjälp från Qara Khitai hade drivit ut ghuriderna ur Khorasan vände han sig 1207 mot sina överherrar, då han tågade in i Buchara och den karakhanidiske härskaren i Samarkand, Uthman, gick över till honom. De första fälttågen bortom Oxus gick dåligt; i ett slag tillfångatogs Muhammad utan att bli igenkänd och kom undan genom att utge sig för att vara tjänare. Han slutade betala tribut, lät döda ett sändebud från Qara Khitai och besegrade 1210 Qara Khitais armé på Ilamishslätten och tillfångatog dess general Tayangu. Qara Khitais rike angreps också inifrån av naimanfursten Kuchlug, en flykting undan Djingis khan, som 1211 grep rikets härskare Yelü Zhilugu. När Uthman i Samarkand 1212 vände sig mot Muhammad och lät döda khwarazmierna i staden stormade khwarazmshahen Samarkand, plundrade staden och avrättade Uthman, vilket gjorde slut på det karakhanidiska styret där. Transoxanien blev khwarazmiskt, och Syr-Darja blev gränsen mot Kuchlugs rike, som mongolerna erövrade 1218.
