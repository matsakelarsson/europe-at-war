# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
Kieft’s War (Wappinger War): Kiefts krig (wappingerkriget)
? A war between the Dutch colony of New Netherland and the Munsee-speaking Lenape and Wappinger peoples around New Amsterdam (New York), named after the colony’s director, Willem Kieft. From 1639 Kieft demanded tribute in corn, furs and wampum from the nations around Manhattan, and quarrels over stray livestock, killings and revenge followed. In February 1643, against the advice of the colonists’ elected council, he sent soldiers against Wecquaesgeek and Tappan refugees who had fled from Mohawk raids to Pavonia and Corlears Hook; some 120 men, women and children were killed in the night. The nations of the lower Hudson and Long Island rose, burned farms and villages from Staten Island to Westchester and killed many colonists, among them Anne Hutchinson and most of her family. Hired by Kieft, the Pequot War veteran John Underhill led Dutch and English soldiers who attacked Native villages in the winter of 1643–1644, killing some 500 to 700 people at Pound Ridge in March 1644. Peace was made at Fort Amsterdam on 30 August 1645. The Native losses in the war are usually put at more than a thousand; New Netherland’s farms were ruined and the West India Company recalled Kieft, who drowned on his way home in 1647.
: Ett krig mellan den nederländska kolonin Nya Nederländerna och de munseetalande folken lenape och wappinger kring Nya Amsterdam (New York), uppkallat efter koloniens direktör Willem Kieft. Från 1639 krävde Kieft tribut i majs, pälsar och wampum av nationerna kring Manhattan, och gräl om bortsprungen boskap, dråp och hämnd följde. I februari 1643 sände han, mot inrådan från kolonisternas valda råd, soldater mot flyktingar från wecquaesgeek och tappan som hade flytt undan mohawkernas räder till Pavonia och Corlears Hook; omkring 120 män, kvinnor och barn dödades under natten. Nationerna vid nedre Hudson och på Long Island reste sig, brände gårdar och byar från Staten Island till Westchester och dödade många kolonister, bland dem Anne Hutchinson och större delen av hennes familj. Pequotkrigsveteranen John Underhill, som Kieft hade anställt, ledde nederländska och engelska soldater som anföll ursprungsamerikanska byar vintern 1643–1644 och dödade omkring 500 till 700 människor vid Pound Ridge i mars 1644. Fred slöts i Fort Amsterdam den 30 augusti 1645. Urfolkens förluster i kriget brukar uppskattas till mer än tusen; Nya Nederländernas gårdar låg i ruiner och Västindiska kompaniet kallade hem Kieft, som drunknade på hemvägen 1647.
