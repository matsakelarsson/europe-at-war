The Primary Chronicle, compiled about a century later under Yaroslav’s descendants, blames Sviatopolk, whom it calls “the Accursed”, for the murders. Thietmar of Merseburg and the Norse Eymund saga tell different stories, and some historians think Yaroslav was behind the death of Boris.: Nestorskrönikan, sammanställd omkring ett sekel senare under Jaroslavs ättlingar, lägger skulden för morden på Svjatopolk, som den kallar ”den förbannade”. Thietmar av Merseburg och den nordiska Eymundar þáttr berättar andra versioner, och en del historiker tror att Jaroslav låg bakom Boris död.
The battle at Liubech is dated to the autumn of 1015 or to 1016. Bolesław’s march on Kiev in 1018 is also told under the German–Polish War, 1002–1018.: Slaget vid Ljubetj dateras till hösten 1015 eller till 1016. Bolesławs tåg mot Kiev 1018 skildras också under Tysk-polska kriget 1002–1018.
