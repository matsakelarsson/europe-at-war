Kievan succession crisis, 1015–1019: Tronföljdskrisen i Kiev 1015–1019
A war among the sons of Vladimir I of Kiev after his death in 1015. Sviatopolk seized Kiev, and three of his brothers, Boris, Gleb and Sviatoslav, were murdered; Boris and Gleb were later venerated as the first saints of Rus’. Yaroslav of Novgorod drove Sviatopolk out after a battle at Liubech, lost Kiev in 1018 to Sviatopolk and his father-in-law, Bolesław I of Poland, who is said to have taken the Cherven towns on his way home, and won the throne for good on the Alta in 1019.: Ett krig mellan Vladimir I av Kievs söner efter hans död 1015. Svjatopolk tog makten i Kiev, och tre av hans bröder, Boris, Gleb och Svjatoslav, mördades; Boris och Gleb vördades senare som Rus första helgon. Jaroslav av Novgorod drev ut Svjatopolk efter ett slag vid Ljubetj, förlorade Kiev 1018 till Svjatopolk och dennes svärfar Bolesław I av Polen, som enligt uppgift tog Tjervenstäderna på hemvägen, och vann tronen för gott vid Alta 1019.
