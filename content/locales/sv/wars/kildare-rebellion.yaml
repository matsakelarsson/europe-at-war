Kildare Rebellion: Kildareupproret
The revolt of Thomas FitzGerald, Lord Offaly, known as Silken Thomas, against Henry VIII. Left in charge of the government in Dublin when his father, the Earl of Kildare, was summoned to London, Thomas renounced his allegiance on 11 June 1534 after hearing a false rumour that his father had been executed; the earl in fact died in the Tower that September. Thomas’s men murdered Archbishop John Alen and besieged Dublin Castle without success. In March 1535 the new lord deputy, Sir William Skeffington, battered the FitzGerald stronghold of Maynooth with artillery, and most of the surrendered garrison were executed, the “pardon of Maynooth”. Thomas surrendered that August on a promise of his life, and was executed at Tyburn in 1537 with five of his uncles. The fall of the house of Kildare opened the way for direct Tudor rule and, in 1542, the Kingdom of Ireland.: Thomas FitzGeralds, lord Offaly, känd som Silken Thomas, revolt mot Henrik VIII. Thomas hade lämnats att leda styret i Dublin när hans far, earlen av Kildare, kallades till London, och han sade upp sin trohet den 11 juni 1534 sedan han hört ett falskt rykte om att fadern avrättats; earlen dog i själva verket i Towern i september samma år. Thomas män mördade ärkebiskop John Alen och belägrade utan framgång Dublin Castle. I mars 1535 sköt den nye ståthållaren (lord deputy), Sir William Skeffington, sönder FitzGeraldsläktens fäste Maynooth med artilleri, och större delen av den garnison som kapitulerat avrättades, den så kallade ”Maynooths benådning”. Thomas kapitulerade i augusti samma år mot löfte om att få behålla livet, men avrättades vid Tyburn 1537 tillsammans med fem av sina farbröder. Huset Kildares fall öppnade vägen för ett direkt Tudorstyre och 1542 för Kungariket Irland.
