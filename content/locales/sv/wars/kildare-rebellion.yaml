Dates are Julian (Old Style). The earls of Kildare had governed Ireland as the king’s deputies for most of the previous sixty years.: Datumen anges enligt den julianska kalendern (gamla stilen). Earlerna av Kildare hade styrt Irland som kungens ställföreträdare under större delen av de föregående sextio åren.
