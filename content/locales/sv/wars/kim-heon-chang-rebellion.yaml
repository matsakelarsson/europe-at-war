# Svenska översättningar av katalogtexten (våg 10); stegtexterna kommer senare.
Kim Heon-chang’s rebellion: Kim Heon-changs uppror
? A rising against the Silla king led by Kim Heon-chang, governor of Ungcheon-ju (today’s Gongju), and renewed by his son three years later. Kim Heon-chang’s father, Kim Ju-won, a descendant of King Muyeol, had been chosen to succeed King Seondeok in 785 but was pushed aside by Kim Gyeong-sin, who became King Wonseong. In the third month of 822 Kim Heon-chang rose at Ungjin, citing that wrong as his cause, proclaimed a state called Jangan with the era name Gyeongun, and brought under his control the counties of four of Silla’s nine provinces (Mujin, Wansan, Cheong and Sabeol) and of three of its secondary capitals (Gugwon, Seowon and Geumgwan, today’s Chungju, Cheongju and Gimhae); Hansan, Udu and Sapnyang provinces, the Paegang garrison and Bugwon held out for the king. King Heondeok sent armies under Jang Ung, Wigong, Kim Gyun-jeong and Kim U-jing, which beat the rebels at Dodong pass, at Samnyeon fortress and Mount Songni, and at Seongsan, and besieged Ungjin. After about ten days Kim Heon-chang killed himself; when the city fell, 239 of his kin and leading followers were put to death and the rest were released. In the first month of 825 his son Kim Beom-mun rose again with about a hundred men, among them the outlaw leader Su-sin of Mount Godal, and attacked Bukhansan-ju, meaning to make Namp’yeongyang (in today’s Seoul) his capital, but he was defeated and killed by the provincial governor. The rebellion, which for a few weeks held almost half of Silla, is counted as the start of the long decline of the Silla state in the ninth century.
: En resning mot Sillas kung under ledning av Kim Heon-chang, guvernör i Ungcheon-ju (dagens Gongju), som förnyades av hans son tre år senare. Kim Heon-changs far, Kim Ju-won, en ättling till kung Muyeol, hade utsetts att efterträda kung Seondeok 785 men trängts undan av Kim Gyeong-sin, som blev kung Wonseong. I tredje månaden 822 reste sig Kim Heon-chang i Ungjin med hänvisning till denna oförrätt, utropade en stat vid namn Jangan med eranamnet Gyeongun och lade under sig distrikten i fyra av Sillas nio provinser (Mujin, Wansan, Cheong och Sabeol) och i tre av dess sekundära huvudstäder (Gugwon, Seowon och Geumgwan, dagens Chungju, Cheongju och Gimhae); provinserna Hansan, Udu och Sapnyang, garnisonen i Paegang och Bugwon höll ut för kungen. Kung Heondeok sände arméer under Jang Ung, Wigong, Kim Gyun-jeong och Kim U-jing, som slog rebellerna vid passet Dodong, vid fästningen Samnyeon och berget Songni samt vid Seongsan, och belägrade Ungjin. Efter omkring tio dagar tog Kim Heon-chang livet av sig; när staden föll avrättades 239 av hans släktingar och ledande anhängare och resten släpptes. I första månaden 825 reste sig hans son Kim Beom-mun på nytt med omkring hundra man, bland dem fredlösledaren Su-sin från berget Godal, och angrep Bukhansan-ju i avsikt att göra Namp’yeongyang (i dagens Seoul) till sin huvudstad, men han besegrades och dödades av provinsguvernören. Upproret, som under några veckor behärskade nästan halva Silla, räknas som början på Sillastatens långa nedgång under 800-talet.
