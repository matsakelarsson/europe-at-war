# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
King George’s War: Kung Georgs krig
? The North American part of the War of the Austrian Succession, fought between Britain and France and their colonies and allies in Nova Scotia, Cape Breton and on the frontier of New England and New York. When France declared war in March 1744, troops from the French fortress of Louisbourg on Cape Breton burned the New England fishing post of Canso, and French troops and Mi’kmaq and Wolastoqiyik warriors twice besieged Annapolis Royal, the capital of British Nova Scotia, without taking it. In 1745 some 4,200 New England volunteers under William Pepperrell, with a Royal Navy squadron under Peter Warren, besieged Louisbourg for 47 days and took it, the greatest victory of colonial New England. A great French fleet sent to retake it in 1746 under the Duc d’Anville was destroyed by storms and disease. French, Canadian and Native war parties raided the frontier from Maine to Saratoga, and in February 1747 a Canadian and Mi’kmaq force surprised and defeated a New England detachment at Grand-Pré. The Treaty of Aix-la-Chapelle in 1748 returned Louisbourg to France in exchange for Madras, to the fury of New England.
: Den nordamerikanska delen av österrikiska tronföljdskriget, utkämpad mellan Storbritannien och Frankrike och deras kolonier och allierade i Nova Scotia, på Kap Bretonön och vid New Englands och New Yorks gränsbygder. När Frankrike förklarade krig i mars 1744 brände trupper från den franska fästningen Louisbourg på Kap Bretonön New Englands fiskestation Canso, och franska trupper och krigare från mi’kmaq och wolastoqiyik belägrade två gånger Annapolis Royal, huvudstaden i det brittiska Nova Scotia, utan att inta den. År 1745 belägrade omkring 4 200 frivilliga från New England under William Pepperrell, med en eskader ur Royal Navy under Peter Warren, Louisbourg i 47 dagar och intog fästningen, det koloniala New Englands största seger. En stor fransk flotta som 1746 sändes för att återta den under hertigen d’Anville förstördes av stormar och sjukdomar. Franska, kanadensiska och ursprungsamerikanska krigarskaror gjorde räder mot gränsbygderna från Maine till Saratoga, och i februari 1747 överraskade och besegrade en styrka av kanadensare och mi’kmaq en avdelning från New England vid Grand-Pré. Freden i Aachen 1748 återlämnade Louisbourg till Frankrike i utbyte mot Madras, till New Englands raseri.
Great Britain, New England and Nova Scotia, with some Mohawk allies: Storbritannien, New England och Nova Scotia, med några allierade mohawker
France and New France, with the Wabanaki (Mi’kmaq, Wolastoqiyik and Abenaki) and other Native allies: Frankrike och Nya Frankrike, med wabanaki (mi’kmaq, wolastoqiyik och abenaki) och andra ursprungsamerikanska allierade
