# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
King Philip’s War (Metacom’s War): Kung Philips krig (Metacoms krig)
? A war between the English colonies of New England and the Wampanoag under their sachem Metacom, whom the English called King Philip, joined by the Nipmuc, the Pocumtuck and, after the colonists attacked them, the Narragansett, while the Mohegan, the Pequot, many Christian Indians and the Mohawk fought against them. Half a century of English expansion over Native land, the colonies’ claims to judge and disarm their Native neighbours, and the hanging of three Wampanoag men by Plymouth in June 1675 led to the first attacks at Swansea. Native forces struck more than half of New England’s towns and destroyed a dozen of them, among them Springfield, Lancaster and Providence, and won at Bloody Brook and Sudbury. The colonists burned the Narragansett fort in the Great Swamp in December 1675, killing hundreds of women and children, and from the spring of 1676, with their Native allies, hunger and a Mohawk attack on Metacom’s winter camp, they wore the coalition down. Metacom was killed at Mount Hope on 12 August 1676; the war in Maine went on until the Treaty of Casco in April 1678. Estimates of the dead range from about 600 to over 1,000 colonists and from about 3,000 to more than 5,000 Native people, killed or dead of hunger and disease; hundreds, perhaps over a thousand, Native captives were sold into slavery in the West Indies and elsewhere. In proportion to population it was among the deadliest wars in American history.
: Ett krig mellan de engelska kolonierna i New England och wampanoag under deras sachem Metacom, som engelsmännen kallade kung Philip, med stöd av nipmuc, pocumtuck och, sedan kolonisterna hade anfallit dem, narragansett, medan mohegan, pequoter, många kristnade ursprungsamerikaner och mohawker stred mot dem. Ett halvsekel av engelsk expansion över urfolkens land, koloniernas anspråk på att döma och avväpna sina ursprungsamerikanska grannar och Plymouths hängning av tre wampanoagmän i juni 1675 ledde till de första anfallen vid Swansea. Urfolkens styrkor anföll mer än hälften av New Englands orter och förstörde ett dussin av dem, bland dem Springfield, Lancaster och Providence, och segrade vid Bloody Brook och Sudbury. Kolonisterna brände narragansettfolkets fort i Great Swamp i december 1675 och dödade hundratals kvinnor och barn, och från våren 1676 nötte de ned koalitionen med hjälp av sina ursprungsamerikanska allierade, hungern och ett mohawkanfall mot Metacoms vinterläger. Metacom dödades vid Mount Hope den 12 augusti 1676; kriget i Maine fortsatte fram till fördraget i Casco i april 1678. Uppskattningarna av antalet döda varierar från omkring 600 till över 1 000 kolonister och från omkring 3 000 till mer än 5 000 ursprungsamerikaner, dödade eller döda av svält och sjukdomar; hundratals, kanske över tusen, ursprungsamerikanska fångar såldes som slavar till Västindien och andra platser. I förhållande till befolkningen var det ett av de dödligaste krigen i amerikansk historia.
