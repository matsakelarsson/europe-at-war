# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
King William’s War: Kung Vilhelms krig
? "The North American part of the Nine Years’ War between Louis XIV’s France and William III’s England, fought between New France and its Wabanaki and other Native allies on one side and the English colonies of New England, New York and Hudson Bay and their Haudenosaunee allies on the other. It grew out of border quarrels in Maine and Acadia and the war between New France and the Haudenosaunee: Wabanaki warriors under leaders such as Kancamagus and Madockawando, with the French officer Saint-Castin, attacked English towns in Maine and New Hampshire from 1688, and after the Haudenosaunee raid on Lachine in 1689 Governor Frontenac sent French and Native war parties against Schenectady and the New England frontier in the winter of 1690. Sir William Phips and the Massachusetts militia took Port Royal in Acadia in May 1690 but were beaten off at Quebec in October, and an overland attack on Montreal failed. For the rest of the war the frontier from Maine to the Mohawk valley suffered raids and counter-raids; Pierre Le Moyne d’Iberville took the fort at Pemaquid in 1696, destroyed most English settlements in Newfoundland in the winter of 1696–1697, and won York Factory on Hudson Bay in 1697. The Peace of Ryswick in September 1697 restored the pre-war borders. The Haudenosaunee, left to fight alone, made peace with New France and its allies at Montreal in 1701, and the Wabanaki with Massachusetts in 1699."
: "Den nordamerikanska delen av pfalziska tronföljdskriget mellan Ludvig XIV:s Frankrike och Vilhelm III:s England, utkämpad mellan Nya Frankrike och dess allierade bland wabanaki och andra ursprungsfolk på ena sidan och de engelska kolonierna i New England, New York och vid Hudson Bay och deras allierade haudenosaunee på den andra. Kriget växte fram ur gränstvister i Maine och Akadien och ur kriget mellan Nya Frankrike och haudenosaunee: wabanakikrigare under ledare som Kancamagus och Madockawando anföll tillsammans med den franske officeren Saint-Castin engelska orter i Maine och New Hampshire från 1688, och efter haudenosauneefolkets räd mot Lachine 1689 sände guvernör Frontenac franska och ursprungsamerikanska krigarskaror mot Schenectady och New Englands gränsbygder vintern 1690. Sir William Phips och Massachusetts milis intog Port Royal i Akadien i maj 1690 men slogs tillbaka vid Québec i oktober, och ett anfall landvägen mot Montréal misslyckades. Under resten av kriget drabbades gränsbygden från Maine till Mohawkdalen av räder och motangrepp; Pierre Le Moyne d’Iberville intog fortet vid Pemaquid 1696, förstörde de flesta engelska bosättningarna på Newfoundland vintern 1696–1697 och erövrade York Factory vid Hudson Bay 1697. Freden i Rijswijk i september 1697 återställde gränserna från före kriget. Haudenosaunee, som lämnats att strida ensamma, slöt fred med Nya Frankrike och dess allierade i Montréal 1701, och wabanaki slöt fred med Massachusetts 1699."
