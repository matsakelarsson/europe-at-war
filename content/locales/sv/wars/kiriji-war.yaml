# Svenska översättningar av katalogtexten (våg 13); stegtexterna kommer senare.
Kiriji War: Kirijikriget
? The last and longest of the 19th-century Yoruba wars, also called the Ekiti Parapo war. By the 1870s Ibadan, the military city-state that had defeated Ilorin and destroyed Ijaye, ruled much of eastern Yorubaland, the Ekiti, Ijesha, Igbomina and Akoko country, through resident agents, the ajele, whose exactions were deeply resented. In 1877 Ibadan, under Are Latosisa, went to war with the Egba and Ijebu, who blocked its roads to the coast. In the east the towns rose against the ajele and formed an alliance, the Ekiti Parapo (‘Ekiti together’), led from 1879 by the Ijesha war chief Ogedengbe and armed with breech-loading rifles bought through Lagos by Ekiti and Ijesha emigrants there; the noise of their guns gave the war its name. Ilorin, the Egba and Ijebu joined against Ibadan. From 1879 the two armies faced each other for seven years in fortified camps on the hills near Igbajo and Imesi-Ile, which grew into towns of tens of thousands. War-weariness, the death of Latosisa in 1885 and the mediation of the British governor of Lagos, through the Yoruba clergymen Samuel Johnson and Charles Phillips, led to a peace treaty in 1886, but Ilorin fought on around Offa, and the camps were finally broken up only in March 1893, when British officials took over the mediation and Yorubaland passed under British protection.
: Det sista och längsta av 1800-talets yorubakrig, även kallat Ekiti Parapo-kriget. På 1870-talet styrde Ibadan, den militära stadsstat som hade besegrat Ilorin och förstört Ijaye, en stor del av östra yorubalandet, områdena Ekiti, Ijesha, Igbomina och Akoko, genom residerande ombud, ajele, vars pålagor väckte djup förbittring. År 1877 gick Ibadan under Are Latosisa i krig mot egba och ijebu, som spärrade dess vägar till kusten. I öster reste sig städerna mot ajele och bildade en allians, Ekiti Parapo (”Ekiti tillsammans”), som från 1879 leddes av krigshövdingen Ogedengbe från Ijesha och var beväpnad med bakladdningsgevär som utvandrade ekiti och ijesha i Lagos hade köpt där; ljudet av deras gevär gav kriget dess namn. Ilorin, egba och ijebu anslöt sig mot Ibadan. Från 1879 stod de två arméerna mot varandra i sju år i befästa läger på kullarna nära Igbajo och Imesi-Ile, som växte till städer med tiotusentals invånare. Krigströtthet, Latosisas död 1885 och medling från den brittiske guvernören i Lagos, genom yorubaprästerna Samuel Johnson och Charles Phillips, ledde till ett fredsfördrag 1886, men Ilorin fortsatte striderna kring Offa, och lägren bröts upp först i mars 1893, när brittiska tjänstemän tog över medlingen och yorubalandet kom under brittiskt beskydd.
