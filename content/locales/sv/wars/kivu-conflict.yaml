# Svenska översättningar av katalogtexten (våg 13); stegtexterna kommer senare.
Kivu conflict: Konflikten i Kivu
? "The wars in the provinces of North and South Kivu in the eastern Democratic Republic of the Congo since the end of the Second Congo War. Their roots are older: disputes over land and over the citizenship of Kinyarwanda-speaking Congolese, the presence since 1994 of Rwandan Hutu forces that took part in the genocide, and the Kivus’ wealth in tin, coltan and gold. In 2004 Laurent Nkunda, a Tutsi officer of the former rebel RCD, took up arms; his CNDP fought the government until Rwanda and the Congo made a deal in 2009, and its former officers rebelled again as the M23, which took Goma in 2012 before a UN Intervention Brigade defeated it in 2013. The M23 returned in 2021 with Rwandan backing documented by UN experts; in January and February 2025 it took Goma and Bukavu, and it has kept them despite peace agreements signed in Washington and Doha. More than a hundred other armed groups, the Rwandan Hutu FDLR, Mai-Mai and Wazalendo militias, the Congolese army and foreign forces have also fought in the Kivus. No overall death toll is known; millions of people have been displaced."
: "Krigen i provinserna Nordkivu och Sydkivu i östra Demokratiska republiken Kongo sedan slutet av andra Kongokriget. Deras rötter är äldre: tvister om mark och om medborgarskapet för kinyarwandatalande kongoleser, närvaron sedan 1994 av rwandiska hutustyrkor som deltog i folkmordet, och Kivuprovinsernas rikedom på tenn, coltan och guld. År 2004 grep Laurent Nkunda, en tutsiofficer i den tidigare rebellrörelsen RCD, till vapen; hans CNDP bekämpade regeringen tills Rwanda och Kongo gjorde upp 2009, och dess tidigare officerare gjorde uppror igen som M23, som intog Goma 2012 innan en interventionsbrigad från FN besegrade rörelsen 2013. M23 återkom 2021 med rwandiskt stöd som har dokumenterats av FN:s experter; i januari och februari 2025 intog rörelsen Goma och Bukavu, och den har behållit dem trots fredsavtal som undertecknats i Washington och Doha. Mer än hundra andra väpnade grupper, den rwandiska hutumilisen FDLR, Mai-Mai- och Wazalendomiliser, den kongolesiska armén och utländska styrkor har också stridit i Kivuprovinserna. Någon samlad dödssiffra är inte känd; miljontals människor har fördrivits."
