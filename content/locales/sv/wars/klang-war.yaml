# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
Klang War: Klangkriget
? A civil war in Selangor, also called the Selangor Civil War, between rival Malay princes, each allied with Chinese tin-mining groups, over the revenues of the Klang valley and its tin mines. In 1866–1867 Raja Mahdi, a grandson of an earlier sultan who felt he had been passed over, quarrelled with Raja Abdullah, the governor of Klang, over the right to tax the opium and tin trade, and took Klang in March 1867. Sultan Abdul Samad stayed largely aloof at Langat. On 26 June 1868 he made his new son-in-law Tengku Kudin, a prince of Kedah, viceroy (Wakil Yamtuan) to end the war; Kudin backed Raja Abdullah’s son Raja Ismail, and with his help Ismail retook Klang in March 1870, while Mahdi fell back on Kuala Selangor. In Kuala Lumpur the Hakka leader Yap Ah Loy, the Kapitan China, sided with Kudin, while rival Chinese miners under Chong Chong joined Mahdi. In July 1871, after the crew of a Penang junk were killed off Selangor in an attack the British traced to Kuala Selangor, British warships bombarded the town and it was handed to Kudin; Raja Musa, who had claimed it, went over to Mahdi. In 1872 Mahdi’s side, with the Mandailing leaders Raja Asal and Sutan Puasa and the commander Syed Mashhor, besieged Kudin’s men at Bukit Nanas and took Kuala Lumpur, which was burned; Yap Ah Loy escaped to Klang. With about 1,000 men raised by Yap and about 1,000 Pahang fighters under Tok Gajah, sent by the Bendahara Wan Ahmad, Kudin retook Kuala Lumpur in March 1873, and the Pahang forces captured Kuala Selangor on 8 November 1873, which largely ended the war. Mahdi went into exile in Johor and Singapore. The war, with the Larut Wars in Perak, led the British government to give up its policy of non-intervention in the Malay states in September 1873; Selangor accepted a British Resident in 1875, and Yap Ah Loy rebuilt Kuala Lumpur.
: Ett inbördeskrig i Selangor, även kallat Selangors inbördeskrig, mellan rivaliserande malajiska prinsar, var och en allierad med kinesiska tenngruvgrupper, om inkomsterna från Klangdalen och dess tenngruvor. Åren 1866–1867 grälade Raja Mahdi, en sonson till en tidigare sultan, som ansåg sig ha blivit förbigången, med Raja Abdullah, guvernören i Klang, om rätten att beskatta opium- och tennhandeln, och han intog Klang i mars 1867. Sultan Abdul Samad höll sig i stort sett utanför i Langat. Den 26 juni 1868 gjorde han sin nye svärson Tengku Kudin, en prins från Kedah, till vicekung (Wakil Yamtuan) för att få slut på kriget; Kudin stödde Raja Abdullahs son Raja Ismail, och med hans hjälp återtog Ismail Klang i mars 1870, medan Mahdi drog sig tillbaka till Kuala Selangor. I Kuala Lumpur ställde sig hakkaledaren Yap Ah Loy, Kapitan China, på Kudins sida, medan rivaliserande kinesiska gruvarbetare under Chong Chong anslöt sig till Mahdi. I juli 1871, sedan besättningen på en djonk från Penang hade dödats utanför Selangor i ett anfall som britterna spårade till Kuala Selangor, bombarderade brittiska krigsfartyg staden, och den överlämnades till Kudin; Raja Musa, som hade gjort anspråk på den, gick över till Mahdi. År 1872 belägrade Mahdis sida, med mandailingledarna Raja Asal och Sutan Puasa och befälhavaren Syed Mashhor, Kudins män vid Bukit Nanas och intog Kuala Lumpur, som brändes; Yap Ah Loy flydde till Klang. Med omkring 1 000 man som Yap hade rekryterat och omkring 1 000 kämpar från Pahang under Tok Gajah, sända av bendaharan Wan Ahmad, återtog Kudin Kuala Lumpur i mars 1873, och Pahangstyrkorna intog Kuala Selangor den 8 november 1873, vilket i stort sett gjorde slut på kriget. Mahdi gick i landsflykt i Johor och Singapore. Kriget fick, tillsammans med Larutkrigen i Perak, den brittiska regeringen att i september 1873 överge sin politik av icke-ingripande i de malajiska staterna; Selangor godtog en brittisk resident 1875, och Yap Ah Loy byggde upp Kuala Lumpur igen.
