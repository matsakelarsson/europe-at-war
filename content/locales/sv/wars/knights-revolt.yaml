Knights’ Revolt: Riddarupproret
A rising of imperial knights from the Rhineland and Swabia, led by Franz von Sickingen and supported by the humanist Ulrich von Hutten, who hoped to win the Electorate of Trier for the Reformation and restore the declining power of the lesser nobility against the princes. Sickingen’s siege of Trier in September 1522 failed, and in the spring of 1523 the Archbishop-Elector of Trier, the Elector Palatine and Landgrave Philip of Hesse besieged him in his castle of Nanstein at Landstuhl. Mortally wounded by cannon fire, he surrendered on 6 May 1523 and died the next day. That summer the Swabian League destroyed some two dozen knights’ castles in Franconia, and Hutten died in exile on the island of Ufenau in Lake Zürich.: Ett uppror bland riksriddare från Rhenlandet och Schwaben, lett av Franz von Sickingen och understött av humanisten Ulrich von Hutten. De hoppades vinna kurfurstendömet Trier för reformationen och återupprätta den lägre adelns sjunkande makt gentemot furstarna. Sickingens belägring av Trier i september 1522 misslyckades, och våren 1523 belägrade ärkebiskopen och kurfursten av Trier, kurfursten av Pfalz och lantgreve Filip av Hessen honom i hans borg Nanstein vid Landstuhl. Dödligt sårad av kanoneld kapitulerade han den 6 maj 1523 och dog dagen därpå. Samma sommar förstörde Schwabiska förbundet ett par dussin riddarborgar i Franken, och Hutten dog i exil på ön Ufenau i Zürichsjön.
