# Svenska översättningar av katalogtexten (våg 13); stegtexterna kommer senare.
Wars of Koli Tenguella: Koli Tenguellas krig
? The wars by which the Fulbe leader Tenguella and his son Koli Tenguella built a kingdom in the Senegal valley, founding the Denianke dynasty that ruled Futa Toro until 1776. Tenguella, a Fulbe chief from Futa Toro, had led his followers east into the lands of the kingdom of Diara (Zara), in today’s western Mali, where he founded the state of Futa Kingi, and by about 1490 his raids on the upper Gambia threatened Mali’s routes to Kaabu and the Bambuk gold fields. In 1511 he invaded Diara itself; its rulers appealed to Songhai, and in 1512 an army under the askia’s brother Umar Komdiagho defeated and killed him (see Askia Muhammad’s wars). His son Koli had gathered Fulbe, Mandinka and others in the highlands of Futa Jallon, at Dena (Badiar), from where he raided Wuli and Niani on the Gambia and fought Saloum. After his father’s death, driven by Malian pressure and famine, he led his people north, defeated the small kingdoms of eastern Senegal one by one, overcame the governors (farba) whom the buurba of Jolof and the rulers of Diara kept in Futa Toro, made Anyam-Godo his capital and reconquered Kingi. He defeated Jolof several times, which helped bring about its breakup at Danki in 1549. The Portuguese called his kingdom that of the “Great Fulo”. Koli died in 1537 and was succeeded by his brother Labba. The dates rest on the Timbuktu chronicles and later Fulbe and Mandinka traditions and are approximate; some accounts put Koli’s arrival in Futa Toro in 1512–1513, others earlier.
: De krig genom vilka fulbeledaren Tenguella och hans son Koli Tenguella byggde upp ett kungarike i Senegaldalen och grundade deniankedynastin, som styrde Futa Toro till 1776. Tenguella, en fulbehövding från Futa Toro, hade lett sina anhängare österut in i kungariket Diaras (Zaras) land i dagens västra Mali, där han grundade staten Futa Kingi, och omkring 1490 hotade hans räder vid övre Gambia Malis handelsvägar till Kaabu och guldfälten i Bambuk. År 1511 invaderade han själva Diara; dess härskare vädjade till Songhai, och 1512 besegrade och dödade en armé under askians bror Umar Komdiagho honom (se Askia Muhammads krig). Hans son Koli hade samlat fulbe, mandinka och andra i Futa Jallons högland, i Dena (Badiar), varifrån han gjorde räder mot Wuli och Niani vid Gambia och stred mot Saloum. Efter faderns död ledde han, driven av tryck från Mali och av hungersnöd, sitt folk norrut, besegrade de små kungarikena i östra Senegal ett efter ett, övervann de ståthållare (farba) som Jolofs buurba och Diaras härskare hade i Futa Toro, gjorde Anyam-Godo till sin huvudstad och återerövrade Kingi. Han besegrade Jolof flera gånger, vilket bidrog till rikets sönderfall vid Danki 1549. Portugiserna kallade hans rike ”den store Fulos” rike. Koli dog 1537 och efterträddes av sin bror Labba. Årtalen bygger på Timbuktukrönikorna och senare traditioner bland fulbe och mandinka och är ungefärliga; vissa framställningar förlägger Kolis ankomst till Futa Toro till 1512–1513, andra tidigare.
