# Svenska översättningar av katalogtexten (våg 10); stegtexterna kommer senare.
Komaki–Nagakute Campaign: Fälttåget vid Komaki och Nagakute
? The only war between the two men who would unify Japan, Hashiba (later Toyotomi) Hideyoshi and Tokugawa Ieyasu. After Shizugatake (1583) Hideyoshi treated Nobunaga’s second son, Oda Nobukatsu, as a subordinate, and in the third month of 1584 Nobukatsu had three of his senior retainers, suspected of dealing with Hideyoshi, put to death and called on Ieyasu for help. Hideyoshi’s ally Ikeda Tsuneoki seized Inuyama castle in Owari, but Ieyasu beat Mori Nagayoshi at Haguro and fortified Mount Komaki, a hill commanding the Owari plain. Hideyoshi arrived with a much larger army, put at up to 100,000 against about 30,000, and the two sides dug lines of earthworks facing each other. To break the deadlock Ikeda Tsuneoki proposed a raid on Ieyasu’s home province of Mikawa, and a force of about 20,000 under Hideyoshi’s nephew Miyoshi (later Toyotomi) Hidetsugu set out in secret. Ieyasu learned of it and followed, and on the 9th day of the fourth month (May 1584) he routed Hidetsugu’s column and destroyed the troops of Ikeda and Mori at Nagakute; Ikeda Tsuneoki, his son Motosuke and Mori Nagayoshi were killed, with losses put at 2,500 by some sources and far more by others. The armies then faced each other again, and the war moved to Ise and to Kanie castle, which Ieyasu and Nobukatsu retook in the summer. Hideyoshi instead put pressure on Nobukatsu’s lands in Ise, and in the eleventh month (December) Nobukatsu made a separate peace and submitted. Ieyasu, left without a cause, made peace too and sent his son Ogimaru (later Yūki Hideyasu) to Hideyoshi as an adopted son and hostage. Ieyasu had won the battles but Hideyoshi the war; in 1586 Ieyasu came to Osaka and did homage.
: Det enda kriget mellan de två män som skulle ena Japan, Hashiba (senare Toyotomi) Hideyoshi och Tokugawa Ieyasu. Efter Shizugatake (1583) behandlade Hideyoshi Nobunagas andre son, Oda Nobukatsu, som en underlydande, och i tredje månaden 1584 lät Nobukatsu avrätta tre av sina främsta vasaller, som misstänktes för att ha förhandlat med Hideyoshi, och bad Ieyasu om hjälp. Hideyoshis bundsförvant Ikeda Tsuneoki intog borgen Inuyama i Owari, men Ieyasu slog Mori Nagayoshi vid Haguro och befäste berget Komaki, en höjd som behärskar Owarislätten. Hideyoshi kom med en mycket större armé, som uppges ha omfattat upp till 100 000 man mot omkring 30 000, och de båda sidorna grävde linjer av jordvallar mot varandra. För att bryta dödläget föreslog Ikeda Tsuneoki en räd mot Ieyasus hemprovins Mikawa, och en styrka på omkring 20 000 man under Hideyoshis systerson Miyoshi (senare Toyotomi) Hidetsugu gav sig i hemlighet av. Ieyasu fick kännedom om den och följde efter, och den 9:e dagen i fjärde månaden (maj 1584) slog han Hidetsugus kolonn på flykten och förintade Ikedas och Moris trupper vid Nagakute; Ikeda Tsuneoki, hans son Motosuke och Mori Nagayoshi stupade, och förlusterna anges av vissa källor till 2 500 och av andra till långt fler. Arméerna stod sedan åter mot varandra, och kriget flyttade till Ise och till borgen Kanie, som Ieyasu och Nobukatsu återtog under sommaren. Hideyoshi satte i stället press på Nobukatsus länder i Ise, och i elfte månaden (december) slöt Nobukatsu separatfred och underkastade sig. Ieyasu, som nu stod utan en sak att kämpa för, slöt också fred och sände sin son Ogimaru (senare Yūki Hideyasu) till Hideyoshi som adoptivson och gisslan. Ieyasu hade vunnit striderna men Hideyoshi kriget; 1586 kom Ieyasu till Osaka och hyllade honom som sin överherre.
