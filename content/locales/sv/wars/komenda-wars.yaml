# Svenska översättningar av katalogtexten (våg 13); stegtexterna kommer senare.
Komenda Wars: Komendakrigen
? Four wars fought in 1694–1700 round Komenda, on the Gold Coast between Elmina and Cape Coast, in which the Dutch West India Company and the English Royal African Company, rivals for the trade of the kingdom of Eguafo, paid and armed African allies against each other and against Eguafo’s kings. The Dutch had built Fort Vredenburgh at Komenda in 1682 and in 1688 helped put a prince, Takyi, on Eguafo’s throne. In November 1694 John Kabes (Cabess), a Komenda merchant long at odds with the Dutch, brought the English back to build a fort beside theirs and attacked Dutch miners outside the town. In the first war (1694–1695) his men besieged Vredenburgh and on 28 April 1695 defeated an army from Twifo hired by the Dutch. In the second (1696) a young claimant, Takyi Kuma, rose against the king with Dutch, Adom and Akani support and was defeated on 20 March 1696. In the third (1698) forces paid by the English from Asebu, Kabes’s town and Akani attacked; Takyi was killed in November 1698, but the kingdom’s forces routed Takyi Kuma’s army. In the fourth, from November 1699, a larger force paid by the English took Eguafo on 9 May 1700 and made Takyi Kuma king. The English came out with the better trade position, though little land changed hands. The wars, the hiring of armies, the seizure of people as pledges for debts (panyarring) and a smallpox epidemic in the early 1700s depopulated the coast; historians see in them part of the change by which the slave trade overtook the gold trade on the Gold Coast, and of the disorder that let Asante expand. The Dutch chief factor Willem Bosman, who took part, wrote the main contemporary account.
: Fyra krig som utkämpades 1694–1700 kring Komenda, på Guldkusten mellan Elmina och Cape Coast, där Nederländska Västindiska kompaniet och engelska Royal African Company, som rivaliserade om handeln med kungariket Eguafo, betalade och beväpnade afrikanska bundsförvanter mot varandra och mot Eguafos kungar. Nederländarna hade byggt Fort Vredenburgh i Komenda 1682 och 1688 hjälpt en prins, Takyi, upp på Eguafos tron. I november 1694 förde John Kabes (Cabess), en köpman i Komenda som länge hade legat i konflikt med nederländarna, tillbaka engelsmännen för att bygga ett fort bredvid deras och anföll nederländska gruvarbetare utanför staden. I det första kriget (1694–1695) belägrade hans män Vredenburgh och besegrade den 28 april 1695 en armé från Twifo som nederländarna hade lejt. I det andra (1696) reste sig en ung tronpretendent, Takyi Kuma, mot kungen med stöd från nederländarna, Adom och Akani och besegrades den 20 mars 1696. I det tredje (1698) anföll styrkor från Asebu, Kabes’ stad och Akani, betalda av engelsmännen; Takyi dödades i november 1698, men rikets styrkor slog Takyi Kumas armé på flykten. I det fjärde, från november 1699, intog en större styrka betald av engelsmännen Eguafo den 9 maj 1700 och gjorde Takyi Kuma till kung. Engelsmännen gick ur striderna med den bättre handelspositionen, även om lite land bytte ägare. Krigen, lejandet av arméer, beslagtagandet av människor som pant för skulder (panyarring) och en smittkoppsepidemi i början av 1700-talet avfolkade kusten; historikerna ser i dem en del av den förändring genom vilken slavhandeln gick om guldhandeln på Guldkusten, och av den oordning som lät Ashanti expandera. Den nederländske överfaktorn Willem Bosman, som själv deltog, skrev den viktigaste samtida skildringen.
