Alexios I, 1116: Alexios I, 1116
Alexios’s son John II Komnenos spent most of his reign on campaign. He took Laodicea in 1119 and Sozopolis in 1120, reopening the road to Attaleia on the south coast. In the 1130s he fought the Danishmendids of the north, taking Kastamonu in 1133 and Gangra soon after, though Kastamonu was lost again. In 1137 he marched into Cilicia and conquered the Armenian principality there, taking Tarsus, Adana, Mopsuestia and Anazarbus; its prince, Levon I, was taken prisoner to Constantinople with his family.: Alexios son Johannes II Komnenos tillbringade större delen av sin regeringstid i fält. Han tog Laodikeia 1119 och Sozopolis 1120 och öppnade därmed åter vägen till Attaleia på sydkusten. På 1130-talet bekämpade han danishmendiderna i norr och tog Kastamonu 1133 och Gangra kort därefter, även om Kastamonu gick förlorat igen. År 1137 marscherade han in i Kilikien och erövrade det armeniska furstendömet där, med Tarsos, Adana, Mopsuestia och Anazarbos; dess furste, Levon I, fördes som fånge till Konstantinopel med sin familj.
From Cilicia John marched on Antioch, besieged it and made its prince, Raymond of Poitiers, accept him as overlord. In 1138 he led a Byzantine and Frankish army into Muslim Syria, but the siege of Shaizar failed, while his Frankish allies held back, and when Zengi’s army approached John accepted the emir’s tribute and withdrew. A campaign against Neocaesarea in 1140 failed in bad weather. In 1142 John came back to Cilicia, intending to take Antioch itself, but in April 1143 he died after a hunting accident in the Taurus mountains.: Från Kilikien marscherade Johannes mot Antiochia, belägrade staden och tvingade dess furste, Raimond av Poitiers, att erkänna honom som överherre. År 1138 ledde han en bysantinsk och frankisk armé in i det muslimska Syrien, men belägringen av Shaizar misslyckades medan hans frankiska bundsförvanter höll sig tillbaka, och när Zengis armé närmade sig tog Johannes emot emirens tribut och drog sig tillbaka. Ett fälttåg mot Neokaisareia 1140 misslyckades i dåligt väder. År 1142 återvände Johannes till Kilikien i avsikt att ta själva Antiochia, men i april 1143 dog han efter en jaktolycka i Taurusbergen.
