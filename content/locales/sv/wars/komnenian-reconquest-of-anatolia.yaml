John II, 1137: Johannes II, 1137
John’s son Manuel I Komnenos mostly kept the peace with the Seljuks of Rum, leading an army to the walls of Iconium only once, in 1146. Sultan Kilij Arslan II visited Constantinople in 1161–1162 and accepted Manuel as his overlord, but used the peace to conquer the Danishmendid emirates. In 1176 Manuel set out with a large army and a siege train to take Iconium and end the sultanate. On 17 September the Turks ambushed the long column in the Tzybritze pass, near the ruined fortress of Myriokephalon in the mountains west of Iconium.: Johannes son Manuel I Komnenos höll mestadels fred med rumseldjukerna och ledde bara en gång, 1146, en armé fram till Ikonions murar. Sultan Kilij Arslan II besökte Konstantinopel 1161–1162 och erkände Manuel som sin överherre, men utnyttjade freden till att erövra danishmendidernas emirat. År 1176 gav sig Manuel av med en stor armé och en belägringstross för att ta Ikonion och göra slut på sultanatet. Den 17 september lade turkarna bakhåll för den långa kolonnen i Tzybritzepasset, nära den förfallna fästningen Myriokefalon i bergen väster om Ikonion.
The baggage train and the right wing, led by Manuel’s brother-in-law Baldwin of Antioch, were cut to pieces. The main army fought its way through, and Kilij Arslan offered peace on condition that Manuel demolished the forts he had built at Dorylaeum and Sublaeum. Manuel himself compared the defeat to Manzikert, but most of his army survived, and in 1177 a Byzantine army destroyed a Turkish raiding force at Hyelion and Leimocheir on the Meander. Myriokephalon nonetheless ended the Byzantine hope of recovering the plateau, and after Manuel’s death in 1180 the empire’s hold on Anatolia weakened again.: Trossen och högerflygeln, ledd av Manuels svåger Balduin av Antiochia, höggs i stycken. Huvudarmén slog sig igenom, och Kilij Arslan erbjöd fred på villkor att Manuel rev de fästen han hade byggt vid Dorylaion och Sublaion. Manuel jämförde själv nederlaget med Manzikert, men större delen av hans armé överlevde, och 1177 förintade en bysantinsk armé en turkisk plundringsstyrka vid Hyelion och Leimocheir vid Meander. Myriokefalon gjorde likväl slut på det bysantinska hoppet om att återta högplatån, och efter Manuels död 1180 försvagades rikets grepp om Anatolien igen.
