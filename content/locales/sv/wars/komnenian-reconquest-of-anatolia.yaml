Manuel rebuilt the ruined town as a fortress to protect the Byzantine lands from Turkish nomads. Kilij Arslan made its demolition a condition of peace.: Manuel byggde upp den förfallna staden som en fästning för att skydda de bysantinska områdena mot turkiska nomader. Kilij Arslan gjorde dess rivning till ett villkor för fred.
