The First Crusade gave Alexios I Komnenos his chance. After Nicaea surrendered to him in June 1097 and the crusaders marched east, his brother-in-law John Doukas led an army and a fleet down the west coast. Smyrna, held by the emir Tzachas, gave up without a fight, and in 1097–1098 Ephesus, Sardis, Philadelphia and Laodicea were taken from the Turks, restoring imperial rule over the rich valleys of western Anatolia. The Seljuks of Rum, who had lost Nicaea, moved their capital to Iconium and kept the central plateau.: Första korståget gav Alexios I Komnenos hans chans. Sedan Nicaea kapitulerat för honom i juni 1097 och korsfararna marscherat österut ledde hans svåger Johannes Dukas en armé och en flotta längs västkusten. Smyrna, som hölls av emiren Tzachas, gav upp utan strid, och 1097–1098 togs Efesos, Sardes, Filadelfia och Laodikeia från turkarna, vilket återupprättade det kejserliga styret över de rika dalarna i västra Anatolien. Rumseldjukerna, som hade förlorat Nicaea, flyttade sin huvudstad till Ikonion och behöll den centrala högplatån.
For the rest of his reign Alexios defended these gains against Turkish raids while also fighting Bohemond and the Normans. In 1116, already ill, he led an army into the interior and beat Sultan Malik Shah near Philomelion. The sultan agreed to a peace, and Alexios brought the Greek inhabitants of the region back with him to settle inside the empire. When he died in August 1118, the Byzantines again held the northern and western coastlands of Anatolia, though the frontier with the Turks remained open to raids.: Under resten av sin regeringstid försvarade Alexios dessa vinster mot turkiska räder, samtidigt som han bekämpade Bohemund och normanderna. År 1116 ledde han, redan sjuk, en armé in i det inre av landet och besegrade sultan Malik Shah nära Philomelion. Sultanen gick med på fred, och Alexios tog med sig regionens grekiska invånare tillbaka för att bosätta dem inom riket. När han dog i augusti 1118 höll bysantinerna åter de norra och västra kustlanden i Anatolien, även om gränsen mot turkarna förblev öppen för räder.
