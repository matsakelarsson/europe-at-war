The Turks attacked from the heights as the Byzantine column wound through the pass. The exact site is disputed.: Turkarna anföll från höjderna när den bysantinska kolonnen slingrade sig genom passet. Den exakta platsen är omstridd.
Byzantine troops caught a Turkish army returning from a raid as it crossed the Meander and destroyed it.: Bysantinska trupper överraskade en turkisk armé som var på väg tillbaka från en räd när den gick över Meander, och förintade den.
