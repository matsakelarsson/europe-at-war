Alexios’s army, marching in a tight formation he had devised, beat off the attacks of Malik Shah’s horse archers, and the sultan asked for peace.: Alexios armé, som marscherade i en tät formation som han själv utarbetat, slog tillbaka anfallen från Malik Shahs beridna bågskyttar, och sultanen bad om fred.
