Komnenian reconquest of Anatolia: Komnenernas återerövring av Anatolien
The campaigns in which the Byzantine emperors of the Komnenos dynasty, Alexios I, John II and Manuel I, recovered the coasts and river valleys of western and northern Anatolia from the Seljuk Turks after the First Crusade and pushed into Cilicia and Syria. Their attempt to destroy the Sultanate of Rum ended with Manuel’s defeat at Myriokephalon in 1176, which left the central plateau to the Turks.: De fälttåg där de bysantinska kejsarna av komnenerdynastin, Alexios I, Johannes II och Manuel I, efter första korståget återtog kusterna och floddalarna i västra och norra Anatolien från seldjukturkarna och trängde in i Kilikien och Syrien. Deras försök att krossa Rumsultanatet slutade med Manuels nederlag vid Myriokefalon 1176, som lämnade den centrala högplatån åt turkarna.
