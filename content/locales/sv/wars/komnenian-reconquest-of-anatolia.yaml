The main Byzantine sources are Anna Komnene’s Alexiad and the histories of John Kinnamos and Niketas Choniates; dates, especially for John II’s campaigns, are often known only to the year.: De viktigaste bysantinska källorna är Anna Komnenas Alexiaden och Johannes Kinnamos och Niketas Choniates historieverk; datumen, särskilt för Johannes II:s fälttåg, är ofta kända endast till året.
The frontier was never a line. Turkish nomads grazed and raided far inside the lands the empire claimed, and towns changed hands repeatedly; the map shows the broad picture.: Gränsen var aldrig en linje. Turkiska nomader betade sina hjordar och gjorde räder långt in i de områden som riket gjorde anspråk på, och städer bytte ägare gång på gång; kartan visar den övergripande bilden.
