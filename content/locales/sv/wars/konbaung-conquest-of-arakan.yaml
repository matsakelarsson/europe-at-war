# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
Konbaung conquest of Arakan: Konbaungdynastins erövring av Arakan
? "The campaign in which King Bodawpaya of Burma ended the independence of Arakan, the coastal kingdom of Mrauk U on the Bay of Bengal, which had been weakened by decades of factional strife between its kings and nobles. On 2 December 1784 the crown prince Thado Minsaw led more than 20,000 men, with 2,500 horse and 200 elephants, across the Arakan Yoma by three passes, while a flotilla sailed up the coast from Negrais and landed on Ramree island. On 31 December the Arakanese king attacked the Burmese camp at Laungkyet, near his capital, and was defeated; Mrauk U fell on 1 or 2 January 1785 (some sources say 31 December 1784). Maha Thammada was taken to Amarapura with his family and died there a captive. The Burmese carried off the Mahamuni image, the palladium of Arakan, to Amarapura, along with other bronzes, and deported more than 20,000 people. Arakan became a Burmese province under four governors. Burmese rule was harsh and resisted: some 35,000 Arakanese fled to British-ruled Chittagong, revolts broke out in 1794 and under Chin Byan from 1811, and the border with British Bengal became one of the grievances that led to the First Anglo-Burmese War in 1824."
: "Det fälttåg där kung Bodawpaya av Burma gjorde slut på självständigheten för Arakan, kustriket Mrauk U vid Bengaliska viken, som hade försvagats av årtionden av fraktionsstrider mellan dess kungar och adel. Den 2 december 1784 ledde kronprinsen Thado Minsaw mer än 20 000 man, med 2 500 ryttare och 200 elefanter, över Arakan Yoma genom tre pass, medan en flottilj seglade upp längs kusten från Negrais och landsteg på ön Ramree. Den 31 december angrep den arakanesiske kungen det burmesiska lägret vid Laungkyet nära sin huvudstad och besegrades; Mrauk U föll den 1 eller 2 januari 1785 (vissa källor anger den 31 december 1784). Maha Thammada fördes med sin familj till Amarapura och dog där i fångenskap. Burmeserna förde bort Mahamunistatyn, Arakans skyddsklenod, till Amarapura tillsammans med andra bronser och deporterade mer än 20 000 människor. Arakan blev en burmesisk provins under fyra guvernörer. Det burmesiska styret var hårt och mötte motstånd: omkring 35 000 arakaneser flydde till det brittiskstyrda Chittagong, revolter bröt ut 1794 och under Chin Byan från 1811, och gränsen mot Brittiska Bengalen blev en av de tvistefrågor som ledde till första anglo-burmesiska kriget 1824."
