# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
Mon revolt and the Konbaung–Hanthawaddy War: Monernas revolt och kriget mellan Konbaung och Hanthawaddy
? The war in which the Mon south of Burma broke away from the declining Toungoo kingdom of Ava, destroyed it, and was in turn conquered by Alaungpaya, the founder of the Konbaung dynasty. In 1740 the people of Pegu killed Ava’s governor and restored the old kingdom of Hanthawaddy, which by 1745 held Lower Burma up to Prome and Toungoo. Under Binnya Dala, with French arms, it invaded the north in 1751 and took Ava in March 1752, ending the Toungoo dynasty. But a village headman of Moksobo (Shwebo), Aung Zeya, proclaimed himself king as Alaungpaya, beat the Hanthawaddy garrisons and by January 1754 had retaken Ava. A Hanthawaddy counter-offensive in 1754 failed; Pegu’s execution of the captive Toungoo king and persecution of southern Burmans turned the war into a conflict between Burmans and Mon. In 1755 Alaungpaya overran the Irrawaddy delta and founded Yangon; the French-held port of Syriam fell in July 1756 after fourteen months, and Pegu was stormed on 6 May 1757, its people massacred and its walls razed. Burma was united under the Konbaung dynasty, and thousands of Mon fled to Siam.
: Kriget där monerna i södra Burma bröt sig loss från Toungooriket i Ava, som var på nedgång, förstörde det och i sin tur erövrades av Alaungpaya, Konbaungdynastins grundare. År 1740 dödade Pegus invånare Avas guvernör och återupprättade det gamla kungariket Hanthawaddy, som år 1745 behärskade Nedre Burma upp till Prome och Toungoo. Under Binnya Dala invaderade det med franska vapen norra Burma 1751 och intog Ava i mars 1752, vilket gjorde slut på Toungoodynastin. Men en byhövding i Moksobo (Shwebo), Aung Zeya, utropade sig till kung under namnet Alaungpaya, slog Hanthawaddys garnisoner och hade i januari 1754 återtagit Ava. En motoffensiv från Hanthawaddy 1754 misslyckades; Pegus avrättning av den tillfångatagne Toungookungen och förföljelsen av burmaner i söder gjorde kriget till en konflikt mellan burmaner och moner. År 1755 lade Alaungpaya under sig Irrawaddydeltat och grundade Yangon; hamnen Syriam, som hölls av fransmännen, föll i juli 1756 efter fjorton månader, och Pegu stormades den 6 maj 1757, dess invånare massakrerades och dess murar raserades. Burma enades under Konbaungdynastin, och tusentals moner flydde till Siam.
