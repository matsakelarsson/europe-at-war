# Svenska översättningar av katalogtexten (våg 13); stegtexterna kommer senare.
Kongo Civil War: Inbördeskriget i Kongoriket
? "The war of succession that divided the Kingdom of Kongo for more than forty years after King António I was killed by the Portuguese at Mbwila in 1665. Two branches of the royal family, the House of Kinlaza, to which António belonged, and the House of Kimpanzu, fought for the throne, while the rulers of Soyo, the da Silva, made and unmade kings. In 1678 the Kinlaza king Pedro III, with hired Jaga soldiers, attacked São Salvador (Mbanza Kongo), killed the Kimpanzu king Daniel I and burned the city, and the old capital was abandoned. For a generation rival kings ruled from mountain strongholds: the Kinlaza at Mbula (Lemba) and Kibangu, the Kimpanzu at Mbamba Lovata on Soyo’s border. From 1704 a young noblewoman, Beatriz Kimpa Vita, who said that St Anthony had possessed her, led thousands of followers, the Antonians, to resettle the ruined capital and demand a reunited kingdom; King Pedro IV of Kibangu had her burned as a heretic on 2 July 1706. On 15 February 1709 Pedro IV took São Salvador from the Antonians, and on 4 October 1709 he defeated his last Kinlaza rival, João II, at Mbula. He pardoned the Kimpanzu and arranged for the crown to rotate between the branches, which kept a fragile peace for half a century, but Kongo never regained its former power. The war fed the Atlantic slave trade: every faction sold captives, and more than 30,000 Antonians are said to have been sold after Pedro IV’s victory, through Loango to Dutch and English ships bound for the Caribbean and North America and through Luanda to Brazil."
: "Det tronföljdskrig som splittrade Kongoriket i mer än fyrtio år sedan kung António I hade dödats av portugiserna vid Mbwila 1665. Två grenar av kungasläkten, huset Kinlaza, som António tillhörde, och huset Kimpanzu, kämpade om tronen, medan härskarna i Soyo, släkten da Silva, tillsatte och avsatte kungar. År 1678 anföll Kinlazakungen Pedro III med inhyrda jagasoldater São Salvador (Mbanza Kongo), dödade Kimpanzukungen Daniel I och brände staden, och den gamla huvudstaden övergavs. Under en generation styrde rivaliserande kungar från bergsfästen: Kinlaza i Mbula (Lemba) och Kibangu, Kimpanzu i Mbamba Lovata vid Soyos gräns. Från 1704 ledde en ung adelskvinna, Beatriz Kimpa Vita, som sade sig vara besatt av den helige Antonius, tusentals anhängare, antonianerna, för att återbefolka den förstörda huvudstaden och kräva ett återförenat rike; kung Pedro IV av Kibangu lät bränna henne som kättare den 2 juli 1706. Den 15 februari 1709 tog Pedro IV São Salvador från antonianerna, och den 4 oktober 1709 besegrade han sin siste rival ur huset Kinlaza, João II, vid Mbula. Han benådade Kimpanzu och ordnade så att kronan skulle växla mellan grenarna, vilket bevarade en bräcklig fred i ett halvt sekel, men Kongo återvann aldrig sin forna makt. Kriget gav näring åt den atlantiska slavhandeln: alla fraktioner sålde fångar, och mer än 30 000 antonianer sägs ha sålts efter Pedro IV:s seger, via Loango till nederländska och engelska fartyg på väg till Karibien och Nordamerika och via Luanda till Brasilien."
