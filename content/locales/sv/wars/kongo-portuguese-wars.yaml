# Svenska översättningar av katalogtexten (våg 13); stegtexterna kommer senare.
Kongo–Portuguese wars: Krigen mellan Kongo och Portugal
? "Three wars between the Kingdom of Kongo, Christian since the early 16th century and long Portugal’s partner in trade, and the Portuguese colony of Angola, founded in 1575 on land that Kongo claimed. In 1622 the governor João Correia de Sousa, hoping for captives as his predecessor had taken them from Ndongo, sent an army with Imbangala mercenaries into Kongo’s southern province of Mbamba; it won at Mbumbi on 18 December 1622, killing the duke of Mbamba, but King Pedro II beat it at Mbanda Kasi in January 1623, the governor was driven out by Luanda’s own settlers, and Kongo captives were returned. Pedro II then proposed an alliance to the Dutch, which bore fruit when the Dutch held Luanda in 1641–1648 (see the Dutch occupation of Luanda). After the Portuguese came back, the rivalry turned on the Dembos, the small states between the two powers. In 1665 a succession dispute in one of them, Mbwila, brought both armies into the field, and on 29 October 1665 the Portuguese under Luís Lopes de Sequeira destroyed the Kongo army; King António I was killed and beheaded, and his death opened the Kongo Civil War. In 1670 an Angolan army invaded Soyo, the breakaway coastal province that dominated Kongo’s politics, but on 18 October 1670 the Soyo army, with troops from Ngoyo and guns from the Dutch, annihilated it at Kitombo. Portugal did not attack Kongo again until the 19th century, and a papal mediation later secured recognition of Soyo’s independence. Each war fed the Atlantic slave trade: captives taken by the Angolan armies and their Imbangala allies were shipped from Luanda, mostly to Brazil."
: "Tre krig mellan Kongoriket, kristet sedan början av 1500-talet och länge Portugals handelspartner, och den portugisiska kolonin Angola, som grundades 1575 på mark som Kongo gjorde anspråk på. År 1622 sände guvernören João Correia de Sousa, som hoppades på fångar på samma sätt som hans företrädare hade tagit dem från Ndongo, en armé med imbangalalegosoldater in i Kongos sydliga provins Mbamba; den segrade vid Mbumbi den 18 december 1622 och dödade hertigen av Mbamba, men kung Pedro II slog den vid Mbanda Kasi i januari 1623, guvernören fördrevs av Luandas egna bosättare och fångarna från Kongo lämnades tillbaka. Pedro II föreslog sedan nederländarna ett förbund, som bar frukt när nederländarna höll Luanda 1641–1648 (se Den nederländska ockupationen av Luanda). Sedan portugiserna kommit tillbaka kretsade rivaliteten kring Dembos, de små staterna mellan de två makterna. År 1665 förde en tronföljdstvist i en av dem, Mbwila, ut båda arméerna i fält, och den 29 oktober 1665 förintade portugiserna under Luís Lopes de Sequeira Kongos armé; kung António I dödades och halshöggs, och hans död inledde inbördeskriget i Kongoriket. År 1670 invaderade en armé från Angola Soyo, den utbrytarprovins vid kusten som dominerade Kongos politik, men den 18 oktober 1670 tillintetgjorde Soyos armé, med trupper från Ngoyo och gevär från nederländarna, inkräktarna vid Kitombo. Portugal angrep inte Kongo igen förrän på 1800-talet, och en påvlig medling säkrade senare ett erkännande av Soyos självständighet. Varje krig gav näring åt den atlantiska slavhandeln: fångar som togs av de angolanska arméerna och deras imbangalaallierade skeppades från Luanda, mest till Brasilien."
