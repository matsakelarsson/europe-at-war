# Svenska översättningar av katalogtexten (våg 13); stegtexterna kommer senare.
Kongo-Wara rebellion: Kongo-Wara-upproret
? The largest rising in French Equatorial Africa and French Cameroon between the world wars, also called the War of the Hoe Handle or the Gbaya (Baya) war. In the western part of today’s Central African Republic and the neighbouring parts of Cameroon, Chad and the Republic of the Congo, the Gbaya and their neighbours suffered under concession companies that forced them to collect rubber, under head tax and porterage, and from 1921 under the recruitment of forced labourers for the Congo–Ocean railway, whose construction killed an estimated 17,000 to more than 20,000 workers. From about 1924 the Gbaya healer and prophet Karnou (Barka Ngaïnoumbey) of Nahing, between Bouar and Baboua, preached refusal of work for Europeans and of taxes, a boycott of European goods and solidarity among Black people, and gave his followers a small hooked stick shaped like a hoe handle (kongo wara) as a medicine against bullets. Fighting broke out in mid-1928; Karnou’s followers burned Bouar, and the French sent troops. Karnou was killed at Nahing on 11 December 1928, but the rising spread to the Lobaye, southern Chad, eastern Cameroon and the northern French Congo and lasted until 1931, ending with the “war of the caves”. The insurgents’ dead have been estimated at more than 10,000; French losses are not known. France imprisoned and executed the movement’s leaders, forced villagers into designated settlements where they could be watched, and afterwards did not renew the leases of the concession companies in the region. The war was little noticed in France, where communists used it to attack colonial rule; Barthélemy Boganda later presented himself as Karnou’s heir.
: Det största upproret i Franska Ekvatorialafrika och franska Kamerun mellan världskrigen, även kallat hackskaftskriget eller gbayakriget (bayakriget). I den västra delen av dagens Centralafrikanska republiken och i angränsande delar av Kamerun, Tchad och Republiken Kongo led gbaya och deras grannar under koncessionsbolag som tvingade dem att samla in kautschuk, under huvudskatt och bärartjänst och från 1921 under tvångsrekryteringen av arbetare till järnvägen Kongo–Ocean, vars byggande beräknas ha kostat 17 000 till mer än 20 000 arbetare livet. Från omkring 1924 predikade gbayafolkets helare och profet Karnou (Barka Ngaïnoumbey) från Nahing, mellan Bouar och Baboua, vägran att arbeta åt européer och att betala skatt, bojkott av europeiska varor och solidaritet mellan svarta, och han gav sina anhängare en liten krokig käpp formad som ett hackskaft (kongo wara) som medicin mot kulor. Strider bröt ut i mitten av 1928; Karnous anhängare brände Bouar, och fransmännen sände trupper. Karnou dödades i Nahing den 11 december 1928, men upproret spred sig till Lobaye, södra Tchad, östra Kamerun och norra Franska Kongo och varade till 1931, då det slutade med ”grottkriget”. De upproriskas döda har uppskattats till mer än 10 000; de franska förlusterna är inte kända. Frankrike fängslade och avrättade rörelsens ledare, tvingade bybor att flytta till anvisade bosättningar där de kunde övervakas och förnyade efteråt inte koncessionsbolagens arrenden i regionen. Kriget fick föga uppmärksamhet i Frankrike, där kommunisterna använde det för att angripa kolonialstyret; Barthélemy Boganda framställde sig senare som Karnous arvtagare.
