# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
Kongsi wars in West Borneo: Kongsikrigen på västra Borneo
? "Wars between the Dutch East Indies and the self-governing Chinese gold-mining federations (kongsis) of West Borneo: the Second Kongsi War of 1850–1854 against the kongsis of Montrado, and the Mandor rising of 1884–1885 that ended the last of them, the Lanfang kongsi. Hakka miners had organised kongsis around Montrado and Mandor since the 1770s, with their own councils, courts and militias; the largest were the Heshun federation (Fosjoen) of Montrado, led by the Thaikong (Dagang) kongsi, the Samtiaokioe (Santiaogou) kongsi, which had broken away and held Sepang, Seminis and the port of Pamangkat, and the Lanfang kongsi at Mandor. In 1850, as the Dutch moved against the Montrado kongsis’ trade outside their control and tried to bring them under the new residency of Sambas and Pontianak, the Thaikong overran Sepang and Pamangkat, and the Samtiaokioe turned to the Sultan of Sambas and the Dutch. A Dutch force of about 400 men took the fortified Pamangkat in September 1850, its commander dying of his wounds, and a second attack in November failed; envoys of the three kongsis then made a settlement that the resident took to Batavia in February 1851. When a government commissioner deposed the Montrado headman and occupied Sepang in early 1853, fighting broke out again and went against the Dutch in May and June. In May 1854 Lieutenant Colonel Augustus Andresen landed about 2,200 men at Sambas and Pontianak, took Singkawang and entered Montrado on 2 June 1854; the kongsis were declared dissolved, the Samtiaokioe with them, and anyone found with arms faced death. Resistance through secret societies went on until 1856. The Lanfang kongsi, which had not fought the Dutch, kept its autonomy until its head, Liu Asheng, died in 1884. When the Dutch took over Mandor, Chinese and Dayak fighters killed the controller J. C. de Rijk on 23 October 1884 and fought on until February 1885; the Lanfang lands were divided among Pontianak, Mempawah and Landak, and many of its people left for Sumatra, Singapore and Sarawak."
: "Krig mellan Nederländska Ostindien och de självstyrande kinesiska guldgrävarförbunden (kongsier) på västra Borneo: andra kongsikriget 1850–1854 mot kongsierna i Montrado, och Mandorresningen 1884–1885, som gjorde slut på den sista av dem, Lanfang-kongsin. Hakkagruvarbetare hade sedan 1770-talet organiserat kongsier runt Montrado och Mandor, med egna råd, domstolar och miliser; de största var Heshunförbundet (Fosjoen) i Montrado, som leddes av Thaikong-kongsin (Dagang), Samtiaokioe-kongsin (Santiaogou), som hade brutit sig ur och höll Sepang, Seminis och hamnen Pamangkat, och Lanfang-kongsin i Mandor. När nederländarna 1850 gick till angrepp mot Montradokongsiernas handel utanför nederländsk kontroll och försökte föra in dem under det nya residentskapet Sambas och Pontianak, intog Thaikong Sepang och Pamangkat, och Samtiaokioe vände sig till sultanen av Sambas och nederländarna. En nederländsk styrka på omkring 400 man intog det befästa Pamangkat i september 1850, och dess befälhavare dog av sina sår; ett andra anfall i november misslyckades, och sändebud från de tre kongsierna nådde då en uppgörelse som residenten tog med sig till Batavia i februari 1851. När en regeringskommissarie avsatte Montrados överhuvud och ockuperade Sepang i början av 1853 utbröt striderna på nytt och gick nederländarna emot i maj och juni. I maj 1854 landsatte överstelöjtnant Augustus Andresen omkring 2 200 man vid Sambas och Pontianak, intog Singkawang och tågade in i Montrado den 2 juni 1854; kongsierna förklarades upplösta, Samtiaokioe också, och den som påträffades med vapen riskerade dödsstraff. Motståndet fortsatte genom hemliga sällskap till 1856. Lanfang-kongsin, som inte hade stridit mot nederländarna, behöll sitt självstyre tills dess överhuvud, Liu Asheng, dog 1884. När nederländarna tog över Mandor dödade kinesiska och dajakiska kämpar kontrolören J. C. de Rijk den 23 oktober 1884 och fortsatte striden till februari 1885; Lanfangs områden delades mellan Pontianak, Mempawah och Landak, och många av dess invånare flyttade till Sumatra, Singapore och Sarawak."
