# Svenska översättningar av katalogtexten (våg 10); stegtexterna kommer senare.
Korean DMZ conflict: DMZ-konflikten i Korea
? A low-level war between North Korea and the South Korean and American forces in South Korea from 1966 to 1969, sometimes called the Second Korean War. With the United States and South Korea heavily committed in Vietnam, Kim Il-sung set out in October 1966 to challenge the armistice and to stir up a guerrilla movement in the South. North Korean units ambushed patrols along the Demilitarized Zone, landed agents on the coasts and, in January 1968, sent a commando unit to kill President Park Chung-hee in Seoul; two days later North Korean warships seized the American intelligence ship Pueblo off Wonsan. In late 1968 some 120 commandos landed on the east coast between Uljin and Samcheok to set up guerrilla bases in the mountains and were hunted down. South Korea answered with fences, patrols, a reservist militia and secret raids of its own across the line. The fighting killed 299 South Korean and 81 American soldiers and 47 South Korean civilians, and North Korea lost at least 397 dead; the uprising Kim hoped for never came, and the campaign died down in 1969.
: Ett lågintensivt krig mellan Nordkorea och de sydkoreanska och amerikanska styrkorna i Sydkorea från 1966 till 1969, ibland kallat det andra Koreakriget. Med USA och Sydkorea hårt engagerade i Vietnam beslöt Kim Il-sung i oktober 1966 att utmana vapenstilleståndet och att väcka en gerillarörelse i söder. Nordkoreanska förband lade bakhåll för patruller längs den demilitariserade zonen, landsatte agenter på kusterna och sände i januari 1968 en kommandoenhet för att döda president Park Chung-hee i Seoul; två dagar senare bemäktigade sig nordkoreanska örlogsfartyg det amerikanska underrättelsefartyget Pueblo utanför Wonsan. I slutet av 1968 landsteg omkring 120 kommandosoldater på östkusten mellan Uljin och Samcheok för att upprätta gerillabaser i bergen och jagades ner. Sydkorea svarade med stängsel, patruller, en reservmilis och egna hemliga räder över linjen. Striderna dödade 299 sydkoreanska och 81 amerikanska soldater och 47 sydkoreanska civila, och Nordkorea förlorade minst 397 döda; det uppror som Kim hoppades på kom aldrig, och kampanjen ebbade ut 1969.
