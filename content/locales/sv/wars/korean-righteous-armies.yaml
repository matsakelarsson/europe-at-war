# Svenska översättningar av katalogtexten (våg 10); stegtexterna kommer senare.
Korean righteous armies (1895–1915): De koreanska rättfärdiga arméerna (1895–1915)
? "Armed resistance to Japanese control of Korea by volunteer “righteous armies” (uibyeong), named after the militias that had fought the Japanese invasions of the 1590s. The first wave rose in 1896 after Japanese agents murdered Queen Min in the palace in Seoul in October 1895 and the government ordered men to cut their topknots; it faded after King Gojong took refuge in the Russian legation. A second wave followed the protectorate treaty of 1905, and the largest after Japan forced Gojong to abdicate and disbanded the Korean army in 1907: thousands of former soldiers joined the scholars, peasants, hunters and miners in the hills. A combined army of thirteen provinces tried to march on Seoul in January 1908 and was driven back, and a Japanese sweep through Jeolla in 1909 broke the strongest remaining bands. After the annexation of 1910 the survivors went to Manchuria and the Russian Far East, and the last leader in Korea, Chae Eung-eon, was captured in 1915. Japanese figures count some 17,800 Korean fighters killed between 1906 and 1911."
: "Väpnat motstånd mot den japanska kontrollen över Korea från frivilliga ”rättfärdiga arméer” (uibyeong), uppkallade efter de miliser som hade bekämpat de japanska invasionerna på 1590-talet. Den första vågen reste sig 1896, sedan japanska agenter i oktober 1895 hade mördat drottning Min i palatset i Seoul och regeringen hade beordrat männen att klippa av sina hårknutar; den ebbade ut sedan kung Gojong tagit sin tillflykt till den ryska legationen. En andra våg följde på protektoratsfördraget 1905, och den största efter att Japan 1907 tvingat Gojong att abdikera och upplöst den koreanska armén: tusentals före detta soldater anslöt sig till de lärda, bönderna, jägarna och gruvarbetarna i bergen. En förenad armé från tretton provinser försökte i januari 1908 marschera mot Seoul och drevs tillbaka, och en japansk svepoperation genom Jeolla 1909 krossade de starkaste kvarvarande grupperna. Efter annekteringen 1910 begav sig de överlevande till Manchuriet och ryska Fjärran östern, och den siste ledaren i Korea, Chae Eung-eon, tillfångatogs 1915. Enligt japanska siffror dödades omkring 17 800 koreanska kämpar mellan 1906 och 1911."
