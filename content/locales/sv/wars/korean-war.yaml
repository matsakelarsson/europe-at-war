# Svenska översättningar av katalogtexten (våg 10); stegtexterna kommer senare.
Korean War: Koreakriget
? The war between North Korea, backed by China and the Soviet Union, and South Korea, backed by the United States and a United Nations Command of sixteen countries. On 25 June 1950 the North Korean army crossed the 38th parallel, the line along which the Soviet Union and the United States had divided Korea in 1945, and within six weeks it had pressed the South Korean and American forces into a perimeter around Busan. The landing at Incheon in September turned the war. UN forces crossed the parallel and drove towards the Chinese border, until Chinese armies entered the war in October and November and pushed them back south of Seoul. From mid-1951 the front settled near the parallel, and two years of armistice talks, deadlocked over the return of prisoners, went on alongside costly fighting for hills and a bombing campaign that destroyed most of the North’s towns. Both sides killed large numbers of civilians they suspected of supporting the other. The armistice of 27 July 1953 ended the fighting and created the Demilitarized Zone, but no peace treaty has ever been signed, and the war has formally never ended. Perhaps 3 million Koreans died, most of them civilians, along with some 180,000–400,000 Chinese and about 36,500 Americans.
: Kriget mellan Nordkorea, med stöd av Kina och Sovjetunionen, och Sydkorea, med stöd av USA och ett FN-kommando bestående av sexton länder. Den 25 juni 1950 gick den nordkoreanska armén över 38:e breddgraden, den linje längs vilken Sovjetunionen och USA hade delat Korea 1945, och inom sex veckor hade den trängt tillbaka de sydkoreanska och amerikanska styrkorna till ett försvarsområde runt Busan. Landstigningen vid Incheon i september vände kriget. FN-styrkorna gick över breddgraden och ryckte fram mot den kinesiska gränsen, tills kinesiska arméer gick in i kriget i oktober och november och drev dem tillbaka söder om Seoul. Från mitten av 1951 stabiliserades fronten nära breddgraden, och två års vapenstilleståndsförhandlingar, som körde fast i frågan om krigsfångarnas återlämnande, pågick parallellt med kostsamma strider om höjder och en bombkampanj som förstörde de flesta av Nordkoreas städer. Båda sidor dödade stora mängder civila som de misstänkte för att stödja motsidan. Vapenstilleståndet den 27 juli 1953 gjorde slut på striderna och skapade den demilitariserade zonen, men något fredsavtal har aldrig undertecknats, och kriget har formellt aldrig upphört. Kanske 3 miljoner koreaner dog, de flesta av dem civila, tillsammans med omkring 180 000–400 000 kineser och omkring 36 500 amerikaner.
