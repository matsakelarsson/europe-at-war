Madaliński: Madaliński
On 17 April the people of Warsaw, led among others by the shoemaker Jan Kiliński, rose against the Russian garrison. After two days of street fighting the Russians had lost 2,000–4,000 of about 5,000 men killed, wounded or captured, and their commander Iosif Igelström fled. On the night of 22–23 April Colonel Jakub Jasiński led a rising in Vilnius, and Lithuania joined the insurrection. Leaders of the Targowica Confederation were hanged in both cities, some after trials and some by mobs.: Den 17 april reste sig Warszawas invånare, bland andra ledda av skomakaren Jan Kiliński, mot den ryska garnisonen. Efter två dagars gatustrider hade ryssarna förlorat 2 000–4 000 av omkring 5 000 man i döda, sårade eller tillfångatagna, och deras befälhavare Iosif Igelström flydde. Natten mellan den 22 och 23 april ledde överste Jakub Jasiński ett uppror i Vilnius, och Litauen anslöt sig till upproret. Ledare för Targowicakonfederationen hängdes i båda städerna, en del efter rättegång och en del av folkmassor.
On 7 May, at Połaniec, Kościuszko freed the peasants from personal serfdom and cut their labour dues, though many nobles ignored the decree. Prussia now joined Russia. On 6 June a Russian and Prussian army, with King Frederick William II present, beat Kościuszko at Szczekociny, and on 15 June the Prussians occupied Kraków without a fight.: Den 7 maj, i Połaniec, befriade Kościuszko bönderna från personlig livegenskap och minskade deras dagsverksskyldigheter, även om många adelsmän struntade i dekretet. Preussen anslöt sig nu till Ryssland. Den 6 juni besegrade en rysk och preussisk armé, i närvaro av kung Fredrik Vilhelm II, Kościuszko vid Szczekociny, och den 15 juni besatte preussarna Kraków utan strid.
