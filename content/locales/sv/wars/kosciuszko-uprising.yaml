From 13 July about 41,000 Russians and 25,000 Prussians, the latter led by Frederick William II, besieged Warsaw, defended by Kościuszko behind earthworks. In August Greater Poland rose behind the Prussian lines, and on 6 September the besiegers withdrew. Jan Henryk Dąbrowski led a raid into Greater Poland and took Bydgoszcz on 2 October. In Lithuania, though, the Russians took back Vilnius on 12 August.: Från den 13 juli belägrade omkring 41 000 ryssar och 25 000 preussare, de senare ledda av Fredrik Vilhelm II, Warszawa, som försvarades av Kościuszko bakom jordverk. I augusti reste sig Storpolen bakom de preussiska linjerna, och den 6 september drog sig belägrarna tillbaka. Jan Henryk Dąbrowski ledde en räd in i Storpolen och tog Bydgoszcz den 2 oktober. I Litauen återtog ryssarna däremot Vilnius den 12 augusti.
Catherine II sent her best general, Alexander Suvorov, north from Ukraine. He beat the Lithuanian corps of Karol Sierakowski near Brest in September. To stop Ivan Fersen’s army joining him, Kościuszko moved to block it at Maciejowice, where Fersen attacked on 10 October before Polish reinforcements arrived. The Polish army was beaten, and Kościuszko was wounded and taken prisoner. He was held in St Petersburg until 1796.: Katarina II sände sin bäste general, Aleksandr Suvorov, norrut från Ukraina. Han besegrade Karol Sierakowskis litauiska kår nära Brest i september. För att hindra Ivan Fersens armé från att förena sig med honom gick Kościuszko för att spärra dess väg vid Maciejowice, där Fersen anföll den 10 oktober innan de polska förstärkningarna hunnit fram. Den polska armén besegrades, och Kościuszko sårades och togs till fånga. Han hölls fången i Sankt Petersburg till 1796.
