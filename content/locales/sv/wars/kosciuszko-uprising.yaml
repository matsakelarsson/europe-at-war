Kościuszko Uprising: Kościuszkoupproret
A national rising led by Tadeusz Kościuszko against Russian control after the Second Partition. It won at Racławice and drove the Russians out of Warsaw and Vilnius, but Russian and Prussian armies crushed it by November 1794, and in 1795 the Third Partition divided what was left of Poland–Lithuania between Russia, Prussia and Austria.: Ett nationellt uppror lett av Tadeusz Kościuszko mot den ryska kontrollen efter andra delningen. Upprorsmännen segrade vid Racławice och drev ut ryssarna ur Warszawa och Vilnius, men ryska och preussiska arméer krossade upproret i november 1794, och 1795 delade tredje delningen det som återstod av Polen–Litauen mellan Ryssland, Preussen och Österrike.
