After the Second Partition, Russian troops garrisoned what was left of Poland–Lithuania, and its army was ordered to shrink. In March 1794 General Antoni Madaliński refused to disband his cavalry brigade and marched it south towards Kraków. On 24 March, in Kraków’s market square, Tadeusz Kościuszko, a veteran of the American War of Independence and of the war of 1792, proclaimed an Act of Insurrection and took supreme command.: Efter andra delningen hade ryska trupper garnisoner i det som återstod av Polen–Litauen, och dess armé beordrades att skäras ned. I mars 1794 vägrade general Antoni Madaliński att upplösa sin kavalleribrigad och marscherade med den söderut mot Kraków. Den 24 mars utropade Tadeusz Kościuszko, veteran från amerikanska frihetskriget och från kriget 1792, en upprorsakt på torget i Kraków och tog överbefälet.
He called up peasants as well as soldiers. On 4 April, at Racławice north of Kraków, his army of about 4,000 regulars and some 2,000 peasants armed with scythes beat a Russian corps. A charge by the scythemen took the Russian guns, and one of them, Wojciech Bartosz Głowacki, became a national hero. The victory was small in military terms but spread the rising across the country.: Han kallade till vapen bönder såväl som soldater. Den 4 april, vid Racławice norr om Kraków, besegrade hans armé på omkring 4 000 reguljära soldater och omkring 2 000 bönder beväpnade med liar en rysk kår. Ett anfall av liemännen erövrade de ryska kanonerna, och en av dem, Wojciech Bartosz Głowacki, blev en nationalhjälte. Segern var liten i militär mening men spred upproret över hela landet.
