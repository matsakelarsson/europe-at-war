Suvorov joined Fersen and on 4 November stormed Praga, the fortified suburb of Warsaw on the east bank of the Vistula. Russian troops then killed defenders and inhabitants alike; some estimates put the dead, soldiers and civilians together, at up to 20,000. Warsaw capitulated the next day to avoid the same fate. The last insurgent army, under Tomasz Wawrzecki, surrendered near Radoszyce on 16 November.: Suvorov förenade sig med Fersen och stormade den 4 november Praga, Warszawas befästa förstad på Weichsels östra strand. Ryska trupper dödade därefter försvarare och invånare utan åtskillnad; enligt vissa uppskattningar uppgick antalet döda, soldater och civila sammantaget, till upp till 20 000. Warszawa kapitulerade dagen därpå för att undgå samma öde. Den sista upprorsarmén, under Tomasz Wawrzecki, kapitulerade nära Radoszyce den 16 november.
Russia, Prussia and Austria divided what remained. Russia and Austria agreed terms in January 1795, and the final convention was signed on 24 October. Russia took Lithuania, western Belarus, western Volhynia and Courland; Prussia took Warsaw, Masovia and Podlasie; Austria took Kraków, Lublin and the lands between. Stanisław August abdicated at Grodno on 25 November 1795. Poland–Lithuania disappeared from the map, and no Polish state existed again until 1807.: Ryssland, Preussen och Österrike delade upp det som återstod. Ryssland och Österrike enades om villkoren i januari 1795, och den slutliga konventionen undertecknades den 24 oktober. Ryssland tog Litauen, västra Belarus, västra Volynien och Kurland; Preussen tog Warszawa, Masovien och Podlasien; Österrike tog Kraków, Lublin och områdena däremellan. Stanisław August abdikerade i Grodno den 25 november 1795. Polen–Litauen försvann från kartan, och ingen polsk stat fanns igen förrän 1807.
