# Svenska översättningar av katalogtexten (våg 10); stegtexterna kommer senare.
Koshamain’s War: Koshamains krig
? An Ainu rising against the Japanese (Wajin) settlements in the far south of Ezo (Hokkaido). From the early 1400s traders and warriors from northern Honshu, under the Andō of Tsugaru, had settled along the coast of the Oshima peninsula, and by the 1450s their lords held a chain of fortified residences (tate) from Shinori, east of today’s Hakodate, to Hanazawa at Kaminokuni, later remembered as the twelve forts (Dōnan jūni-tate). Trade with them mattered more to the Ainu after Ming China’s hold on the lands to the north weakened, and quarrels grew. In 1456 at Shinori a Japanese smith killed an Ainu man in a dispute over the quality and price of a knife (makiri) he had ordered. In the fifth month of 1457 the Ainu, led by Koshamain, a chief of the east, rose from Mukawa in the east to Yoichi in the west, took the fort at Shinori and went on to take ten of the twelve forts; only Mobetsu, held by Andō Iemasa, and Hanazawa, held by Kakizaki Sueshige, did not fall. In 1458 Takeda Nobuhiro, a warrior who had crossed from northern Honshu with the Andō in 1454 and served at Hanazawa, killed Koshamain and his son with arrows at Nanaehama near Hakodate, and the rising fell apart. Nobuhiro married into the Kakizaki as Sueshige’s son-in-law and heir, and his descendants, renamed Matsumae, later ruled the Japanese enclave and its trade with the Ainu as the Matsumae domain. Fighting between Ainu and Wajin flared up again and again for about a century.
: En resning bland ainu mot de japanska (wajin) bosättningarna längst i söder på Ezo (Hokkaido). Från början av 1400-talet hade handelsmän och krigare från norra Honshu, under Andōklanen i Tsugaru, slagit sig ned längs Oshimahalvöns kust, och på 1450-talet innehade deras herrar en kedja av befästa residens (tate) från Shinori, öster om dagens Hakodate, till Hanazawa vid Kaminokuni, som senare kom att minnas som de tolv fästena (Dōnan jūni-tate). Handeln med dem blev viktigare för ainu sedan Mingrikets grepp om länderna i norr hade försvagats, och konflikterna växte. År 1456 dödade en japansk smed i Shinori en ainuman i en tvist om kvaliteten och priset på en kniv (makiri) som ainumannen hade beställt. I femte månaden 1457 reste sig ainu, ledda av Koshamain, en hövding i öster, från Mukawa i öster till Yoichi i väster, intog fästet i Shinori och därefter tio av de tolv fästena; endast Mobetsu, som hölls av Andō Iemasa, och Hanazawa, som hölls av Kakizaki Sueshige, föll inte. År 1458 dödade Takeda Nobuhiro, en krigare som 1454 hade gått över från norra Honshu med Andōklanen och tjänat i Hanazawa, Koshamain och hans son med pilar vid Nanaehama nära Hakodate, och resningen föll samman. Nobuhiro gifte in sig i Kakizakiklanen som Sueshiges svärson och arvinge, och hans ättlingar, som tog namnet Matsumae, styrde senare den japanska enklaven och dess handel med ainu som Matsumaedomänen. Striderna mellan ainu och wajin blossade upp gång på gång under omkring ett sekel.
