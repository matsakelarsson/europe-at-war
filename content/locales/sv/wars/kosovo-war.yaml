Kosovo War: Kosovokriget
A war in Kosovo, then a province of Serbia within the Federal Republic of Yugoslavia, between Yugoslav and Serbian forces and the Kosovo Liberation Army (KLA), which fought for independence after a decade of Serbian rule that had stripped the province of its autonomy. After a year of fighting and failed talks at Rambouillet, NATO bombed Yugoslavia for 78 days in 1999 without a UN Security Council mandate, while Yugoslav forces drove some 850,000 Kosovo Albanians out of the province. The war ended in June 1999 with the Kumanovo Agreement and UN Security Council Resolution 1244, which put Kosovo under UN administration and a NATO-led force; about 200,000 Serbs, Roma and other non-Albanians then fled or were driven out.: Ett krig i Kosovo, då en provins i Serbien inom Förbundsrepubliken Jugoslavien, mellan jugoslaviska och serbiska styrkor och Kosovos befrielsearmé (KLA), som kämpade för självständighet efter ett decennium av serbiskt styre som hade berövat provinsen dess självstyre. Efter ett års strider och misslyckade förhandlingar i Rambouillet bombade Nato Jugoslavien i 78 dagar 1999 utan mandat från FN:s säkerhetsråd, medan jugoslaviska styrkor fördrev omkring 850 000 kosovoalbaner från provinsen. Kriget slutade i juni 1999 med Kumanovoavtalet och FN:s säkerhetsråds resolution 1244, som ställde Kosovo under FN-förvaltning och en Natoledd styrka; omkring 200 000 serber, romer och andra icke-albaner flydde eller fördrevs därefter.
