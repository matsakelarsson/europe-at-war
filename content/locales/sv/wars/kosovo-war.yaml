Kosovo is shown as part of the Federal Republic of Yugoslavia on the map until its declaration of independence on 17 February 2008, which Serbia and a number of other states do not recognise. The UN administration of 1999–2008 is drawn as an area.: Kosovo visas på kartan som en del av Förbundsrepubliken Jugoslavien fram till självständighetsförklaringen den 17 februari 2008, som Serbien och ett antal andra stater inte erkänner. FN-förvaltningen 1999–2008 är inritad som ett område.
Places are named in their Serbian form, with the Albanian form where it is often used in English, as in Račak (Reçak), Orahovac (Rahovec), Peć (Peja), Đakovica (Gjakova) and Priština (Prishtina).: Orter anges i sin serbiska form, med den albanska formen där den ofta används på engelska, som i Račak (Reçak), Orahovac (Rahovec), Peć (Peja), Đakovica (Gjakova) och Priština (Prishtina).
The NATO bombing had no UN Security Council mandate, and whether it was lawful is still disputed; an independent international commission chaired by Richard Goldstone called it “illegal but legitimate” in 2000. Serbian and Kosovo Albanian accounts of the war differ sharply, above all on the KLA, which Belgrade called a terrorist organisation.: Natos bombningar hade inget mandat från FN:s säkerhetsråd, och huruvida de var lagliga är fortfarande omstritt; en oberoende internationell kommission under ledning av Richard Goldstone betecknade dem 2000 som ”olagliga men legitima”. Serbiska och kosovoalbanska skildringar av kriget skiljer sig kraftigt åt, framför allt i synen på KLA, som Belgrad kallade en terroristorganisation.
Casualty figures are uncertain. The Kosovo Memory Book, a name-by-name count by the Humanitarian Law Center, lists 13,535 people killed or missing from January 1998 to December 2000, among them 10,812 Albanians, 2,197 Serbs and 526 Roma, Bosniaks, Montenegrins and others. Human Rights Watch counted about 490–530 civilians killed by NATO strikes; the Yugoslav government gave much higher figures.: Förlustsiffrorna är osäkra. Kosovo Memory Book, en sammanställning namn för namn av Humanitarian Law Center, upptar 13 535 personer dödade eller försvunna från januari 1998 till december 2000, bland dem 10 812 albaner, 2 197 serber och 526 romer, bosniaker, montenegriner och andra. Human Rights Watch räknade med omkring 490–530 civila dödade i Natos anfall; den jugoslaviska regeringen angav mycket högre siffror.
