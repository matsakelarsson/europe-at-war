Through the spring the KLA spread from Drenica across central and western Kosovo, cutting roads and setting up checkpoints, and in July it claimed to hold up to 40 per cent of the province, though its hold on much of it was thin. On 17 July it seized the town of Orahovac, which police retook within days; dozens of Serbs abducted in the fighting were never seen again. From late July the Yugoslav Army and Serbian police counter-attacked with artillery, retook Mališevo and the KLA’s border stronghold of Junik, and burned villages as they went. By autumn some 200,000–300,000 people had been driven from their homes, tens of thousands of them sheltering in the hills.: Under våren spred sig KLA från Drenica över centrala och västra Kosovo, skar av vägar och upprättade vägspärrar, och i juli gjorde gruppen anspråk på att kontrollera upp till 40 procent av provinsen, även om dess grepp om stora delar av den var svagt. Den 17 juli intog KLA staden Orahovac, som polisen återtog inom några dagar; dussintals serber som fördes bort under striderna sågs aldrig mer. Från slutet av juli gick den jugoslaviska armén och serbisk polis till motanfall med artilleri, återtog Mališevo och KLA:s gränsfäste Junik och brände byar längs vägen. Till hösten hade omkring 200 000–300 000 människor drivits från sina hem, tiotusentals av dem i skydd i bergen.
On 26 September Serbian forces killed 21 members of the Deliaj family at Gornje Obrinje, and the images of the dead helped harden Western opinion. The UN Security Council had demanded a ceasefire and the withdrawal of security forces three days earlier, and on 13 October NATO authorised air strikes. The same day the American envoy Richard Holbrooke and Milošević agreed that Yugoslav forces would be cut back and that up to 2,000 unarmed monitors of the OSCE’s Kosovo Verification Mission would watch the ceasefire, with NATO aircraft flying over. The KLA moved back into the ground the police left, and by December the fighting had flared again.: Den 26 september dödade serbiska styrkor 21 medlemmar av familjen Deliaj i Gornje Obrinje, och bilderna av de döda bidrog till att skärpa den västerländska opinionen. FN:s säkerhetsråd hade tre dagar tidigare krävt eldupphör och tillbakadragande av säkerhetsstyrkorna, och den 13 oktober godkände Nato flyganfall. Samma dag kom det amerikanska sändebudet Richard Holbrooke och Milošević överens om att de jugoslaviska styrkorna skulle skäras ned och att upp till 2 000 obeväpnade observatörer från OSSE:s verifikationsmission i Kosovo skulle övervaka eldupphöret, med Natoflygplan i luften ovanför. KLA ryckte åter in på den mark som polisen lämnade, och i december hade striderna blossat upp igen.
