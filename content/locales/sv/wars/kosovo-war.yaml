On 14 December 1998 gunmen killed six Serb teenagers in a café in Peć; no one was ever convicted. On 15 January 1999, after the KLA had killed several policemen nearby, Serbian police attacked the village of Račak, and the next day verifiers found the bodies of 45 Albanians, among them a woman and a 12-year-old boy. The head of the verification mission, William Walker, called it a massacre of civilians. Belgrade said the dead were KLA fighters killed in combat and ordered him out of the country. A Finnish forensic team found no evidence that the victims were anything other than unarmed civilians, but Serbian accounts still dispute what happened, and Račak became a turning point in Western policy.: Den 14 december 1998 dödade beväpnade män sex serbiska tonåringar på ett kafé i Peć; ingen dömdes någonsin. Den 15 januari 1999, sedan KLA dödat flera poliser i närheten, anföll serbisk polis byn Račak, och dagen därpå fann observatörerna kropparna efter 45 albaner, bland dem en kvinna och en 12-årig pojke. Verifikationsmissionens chef, William Walker, kallade det en massaker på civila. Belgrad hävdade att de döda var KLA-kämpar som stupat i strid och utvisade honom ur landet. En finländsk rättsmedicinsk grupp fann inga belägg för att offren var något annat än obeväpnade civila, men serbiska skildringar ifrågasätter fortfarande vad som hände, och Račak blev en vändpunkt i västmakternas politik.
The Contact Group of the great powers summoned both sides to the château of Rambouillet, near Paris, on 6 February. The draft agreement offered Kosovo broad autonomy within Yugoslavia for three years, guarded by a NATO-led force of about 30,000, with an appendix giving NATO troops free movement throughout Yugoslavia. The Kosovo Albanian delegation, led by the KLA’s Hashim Thaçi, signed it in Paris on 18 March; the Yugoslav and Serbian delegation refused any foreign troops. Yugoslav forces were already massing around Kosovo, and on 20 March the verifiers withdrew.: Stormakternas kontaktgrupp kallade båda sidor till slottet Rambouillet nära Paris den 6 februari. Avtalsutkastet erbjöd Kosovo ett omfattande självstyre inom Jugoslavien i tre år, bevakat av en Natoledd styrka på omkring 30 000 man, med en bilaga som gav Natotrupper fri rörlighet i hela Jugoslavien. Den kosovoalbanska delegationen, ledd av KLA:s Hashim Thaçi, undertecknade det i Paris den 18 mars; den jugoslaviska och serbiska delegationen vägrade godta utländska trupper. Jugoslaviska styrkor samlades redan runt Kosovo, och den 20 mars drog sig observatörerna tillbaka.
