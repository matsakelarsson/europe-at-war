On 3 June Milošević accepted a peace plan brought to Belgrade by Finland’s president, Martti Ahtisaari, for the European Union, and Russia’s envoy, Viktor Chernomyrdin, and the Serbian parliament approved it the same day. On 9 June NATO and Yugoslav generals signed the Military Technical Agreement at Kumanovo in Macedonia. All Yugoslav forces were to leave Kosovo within eleven days, and a five-kilometre ground safety zone and a 25-kilometre air safety zone were set along its boundary inside Serbia. NATO stopped the bombing on 10 June, and the same day the UN Security Council adopted Resolution 1244, with China abstaining.: Den 3 juni godtog Milošević en fredsplan som förts till Belgrad av Finlands president Martti Ahtisaari, för Europeiska unionens räkning, och Rysslands sändebud Viktor Tjernomyrdin, och det serbiska parlamentet godkände den samma dag. Den 9 juni undertecknade generaler från Nato och Jugoslavien det militärtekniska avtalet i Kumanovo i Makedonien. Alla jugoslaviska styrkor skulle lämna Kosovo inom elva dagar, och en fem kilometer bred säkerhetszon på marken och en 25 kilometer bred säkerhetszon i luften inrättades längs gränsen på serbisk sida. Nato upphörde med bombningarna den 10 juni, och samma dag antog FN:s säkerhetsråd resolution 1244, med Kina nedlagt i röstningen.
The resolution reaffirmed Yugoslavia’s sovereignty and territorial integrity but put Kosovo under an interim UN administration (UNMIK), with “substantial autonomy” pending a decision on its final status, and an international security force, KFOR. On 12 June KFOR began entering from Macedonia. Some 200 Russian peacekeepers from Bosnia had driven through Serbia overnight and reached Priština airport first; the British general Mike Jackson refused an order from NATO’s commander, Wesley Clark, to block the runway, and Russia later took part in KFOR. The last Yugoslav forces left on 20 June, and the KLA agreed to disarm, which it completed by 20 September.: Resolutionen bekräftade Jugoslaviens suveränitet och territoriella integritet men ställde Kosovo under en interimistisk FN-förvaltning (UNMIK), med ”betydande självstyre” i avvaktan på ett beslut om dess slutliga status, och en internationell säkerhetsstyrka, KFOR. Den 12 juni började KFOR rycka in från Makedonien. Omkring 200 ryska fredsbevarare från Bosnien hade kört genom Serbien under natten och nått Prištinas flygplats först; den brittiske generalen Mike Jackson vägrade lyda en order från Natos befälhavare Wesley Clark att blockera landningsbanan, och Ryssland deltog senare i KFOR. De sista jugoslaviska styrkorna lämnade Kosovo den 20 juni, och KLA gick med på att avväpnas, vilket var genomfört den 20 september.
