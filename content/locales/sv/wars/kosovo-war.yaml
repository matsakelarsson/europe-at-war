The OSCE verifiers left Kosovo for Macedonia as the talks failed and Yugoslav forces moved in.: OSSE:s observatörer lämnade Kosovo för Makedonien när förhandlingarna misslyckades och jugoslaviska styrkor ryckte in.
On the night of 24 March NATO began Operation Allied Force, the first war in the alliance’s history, without a mandate from the UN Security Council, where Russia and China opposed it; NATO justified it as necessary to stop a humanitarian catastrophe. Over 78 days its aircraft and missiles struck air defences and troops, then bridges, factories, refineries, power stations and the state television building in Belgrade, where 16 staff were killed on 23 April. Strikes also hit a passenger train at Grdelica, refugee columns near Đakovica and at Koriša, and on 7 May the Chinese embassy, killing three. Human Rights Watch counted about 500 civilian dead. A US stealth bomber was shot down, but NATO lost no one in combat.: Natten till den 24 mars inledde Nato Operation Allied Force, det första kriget i alliansens historia, utan mandat från FN:s säkerhetsråd, där Ryssland och Kina motsatte sig det; Nato motiverade insatsen med att den var nödvändig för att stoppa en humanitär katastrof. Under 78 dagar angrep alliansens flygplan och robotar luftförsvar och trupper, därefter broar, fabriker, raffinaderier, kraftverk och statstelevisionens byggnad i Belgrad, där 16 anställda dödades den 23 april. Anfall träffade också ett passagerartåg vid Grdelica, flyktingkolonner nära Đakovica och i Koriša, och den 7 maj den kinesiska ambassaden, där tre dödades. Human Rights Watch räknade med omkring 500 civila döda. Ett amerikanskt smygbombplan sköts ned, men Nato förlorade ingen i strid.
Within days of the first strikes, Yugoslav army, police and paramilitary units began driving Kosovo Albanians out of the province, emptying towns and villages, burning houses and taking identity papers at the borders; many were packed onto trains to the Macedonian border. By early June about 850,000 had fled or been deported to Albania, Macedonia and Montenegro, and hundreds of thousands more were hiding inside Kosovo. Mass killings took place at Bela Crkva and the Kruša villages, Suva Reka, Izbica and, on 27 April, Meja, where more than 300 men and boys were taken from a refugee column and shot. Many of the bodies were later found in mass graves near Belgrade.: Inom några dagar efter de första anfallen började jugoslaviska armé-, polis- och paramilitära förband driva kosovoalbaner ut ur provinsen, tömma städer och byar, bränna hus och ta ifrån människor deras identitetshandlingar vid gränserna; många packades in i tåg till den makedonska gränsen. I början av juni hade omkring 850 000 flytt eller deporterats till Albanien, Makedonien och Montenegro, och hundratusentals till höll sig gömda inne i Kosovo. Massmord ägde rum i Bela Crkva och Krušabyarna, Suva Reka, Izbica och, den 27 april, Meja, där mer än 300 män och pojkar togs ut ur en flyktingkolonn och sköts. Många av kropparna hittades senare i massgravar nära Belgrad.
Belgrade said people were fleeing NATO bombs and the fighting, but in 2009 the Yugoslav war crimes tribunal at The Hague convicted senior Yugoslav and Serbian commanders of deportation and murder as crimes against humanity. The rearmed KLA, meanwhile, fought Yugoslav troops along the Albanian border at Košare and Mount Paštrik. On 27 May the tribunal announced its indictment of Milošević for crimes in Kosovo.: Belgrad hävdade att människorna flydde från Natos bomber och striderna, men 2009 dömde Jugoslavientribunalen i Haag höga jugoslaviska och serbiska befälhavare för deportation och mord som brott mot mänskligheten. Det återbeväpnade KLA stred under tiden mot jugoslaviska trupper längs den albanska gränsen vid Košare och berget Paštrik. Den 27 maj tillkännagav tribunalen sitt åtal mot Milošević för brott i Kosovo.
