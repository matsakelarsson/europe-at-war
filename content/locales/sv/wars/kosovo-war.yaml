In 1989 Serbia, led by Slobodan Milošević, took away most of the autonomy Kosovo had held under the Yugoslav constitution of 1974. Kosovo Albanians, the great majority of the province’s people, were dismissed in their tens of thousands from state jobs, and Albanian-language schools and the university moved into private houses. Under Ibrahim Rugova they voted for independence in an unofficial referendum in 1991, built parallel institutions and kept to peaceful resistance. When the Dayton Agreement of 1995 left Kosovo out, a small armed group, the Kosovo Liberation Army (KLA), began attacking Serbian police, and in 1997 it armed itself with weapons looted from depots in Albania during that country’s collapse into unrest.: År 1989 tog Serbien, under Slobodan Milošević, ifrån Kosovo större delen av det självstyre som provinsen haft enligt den jugoslaviska författningen från 1974. Kosovoalbaner, den stora majoriteten av provinsens invånare, avskedades i tiotusental från statliga arbeten, och de albanskspråkiga skolorna och universitetet flyttade in i privata hus. Under Ibrahim Rugova röstade de för självständighet i en inofficiell folkomröstning 1991, byggde upp parallella institutioner och höll fast vid fredligt motstånd. När Daytonavtalet 1995 lämnade Kosovo utanför började en liten väpnad grupp, Kosovos befrielsearmé (KLA), att anfalla serbisk polis, och 1997 beväpnade den sig med vapen som plundrats från förråd i Albanien när landet föll ned i oroligheter.
The KLA was strongest in Drenica, a hilly district west of Priština. On 28 February 1998 an ambush there killed four Serbian policemen, and police attacking the villages of Likoshan and Qirez killed more than two dozen Albanians, many of them civilians; the war is usually dated from that day. On 5–7 March special police besieged the compound of the KLA leader Adem Jashari at Prekaz and killed him and almost 60 members of his family, women and children among them. Belgrade called the operation a strike against terrorists; Albanians remembered it as a massacre, and thousands joined the KLA. On 31 March the UN Security Council placed an arms embargo on Yugoslavia.: KLA var starkast i Drenica, ett kuperat distrikt väster om Priština. Den 28 februari 1998 dödades fyra serbiska poliser i ett bakhåll där, och polis som anföll byarna Likoshan och Qirez dödade mer än två dussin albaner, många av dem civila; kriget brukar räknas från den dagen. Den 5–7 mars belägrade specialpolis KLA-ledaren Adem Jasharis gård i Prekaz och dödade honom och nästan 60 medlemmar av hans familj, bland dem kvinnor och barn. Belgrad kallade operationen ett slag mot terrorister; albanerna mindes den som en massaker, och tusentals anslöt sig till KLA. Den 31 mars införde FN:s säkerhetsråd ett vapenembargo mot Jugoslavien.
