Most of the Kosovo Albanian refugees came home within weeks, to burned villages and mined fields. As they returned, Serbs, Roma, Ashkali and other non-Albanians were attacked, their houses burned and Orthodox churches damaged, and about 200,000 of them fled, most to Serbia. On 23 July 1999 fourteen Serb farmers were shot dead while harvesting at Staro Gracko; the killers were never found. Serbs held on in enclaves guarded by KFOR and in the north, where Mitrovica was divided at the Ibar river. The Kosovo Memory Book counts 13,535 people killed or missing in 1998–2000, about four-fifths of them Albanians.: De flesta kosovoalbanska flyktingarna återvände hem inom några veckor, till brända byar och minerade fält. När de återvände angreps serber, romer, ashkali och andra icke-albaner, deras hus brändes och ortodoxa kyrkor skadades, och omkring 200 000 av dem flydde, de flesta till Serbien. Den 23 juli 1999 sköts fjorton serbiska bönder ihjäl under skördearbete i Staro Gracko; gärningsmännen hittades aldrig. Serberna höll sig kvar i enklaver som bevakades av KFOR och i norr, där Mitrovica delades vid floden Ibar. Kosovo Memory Book räknar 13 535 dödade eller försvunna 1998–2000, omkring fyra femtedelar av dem albaner.
UNMIK governed Kosovo for almost nine years, the KLA became a civil emergency corps and its leaders went into politics, and some of its veterans fought on in the Preševo Valley and Macedonia. Riots in March 2004 killed 19 people and drove thousands of Serbs from their homes. After UN-led talks on Kosovo’s status failed, it declared independence on 17 February 2008, which Serbia rejects. The Hague tribunal convicted senior Yugoslav and Serbian officers of crimes against Kosovo Albanians; Milošević died in 2006 before his trial ended. In September 2026 a special court in The Hague convicted Thaçi and three other former KLA leaders of war crimes against detainees.: UNMIK styrde Kosovo i nästan nio år, KLA ombildades till en civil räddningskår och dess ledare gick in i politiken, och en del av dess veteraner fortsatte striderna i Preševodalen och Makedonien. Upplopp i mars 2004 dödade 19 människor och drev tusentals serber från sina hem. Sedan FN-ledda förhandlingar om Kosovos status misslyckats förklarade sig Kosovo självständigt den 17 februari 2008, vilket Serbien avvisar. Haagtribunalen dömde höga jugoslaviska och serbiska officerare för brott mot kosovoalbaner; Milošević dog 2006 innan hans rättegång avslutats. I september 2026 dömde en specialdomstol i Haag Thaçi och tre andra tidigare KLA-ledare för krigsbrott mot fångar.
