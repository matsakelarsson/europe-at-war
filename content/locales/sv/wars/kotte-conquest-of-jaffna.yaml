Kotte conquest of Jaffna: Kottes erövring av Jaffna
The conquest of the Tamil Jaffna Kingdom in northern Sri Lanka by Parakramabahu VI of Kotte, the last Sinhalese king to rule the whole island. His adopted son Sapumal Kumaraya (Chempaka Perumal), a prince of South Indian descent, first subdued the Vanni chiefs who lay between the two kingdoms. A first invasion of Jaffna failed; a second, around 1450 (some sources say 1447), took the kingdom, and its king Kanakasuriya Cinkaiariyan fled to South India with his family. Sapumal ruled Jaffna for Kotte for some seventeen years. Around 1467, when he went south after Parakramabahu’s death (he later reigned at Kotte as Bhuvanaikabahu VI), Kanakasuriya came back from Madurai with mercenaries and restored the Jaffna Kingdom’s independence.: Erövringen av det tamilska kungariket Jaffna på norra Sri Lanka av Parakramabahu VI av Kotte, den siste singalesiske kung som härskade över hela ön. Hans adoptivson Sapumal Kumaraya (Chempaka Perumal), en prins av sydindisk härkomst, kuvade först vannihövdingarna, vars områden låg mellan de två kungarikena. En första invasion av Jaffna misslyckades; en andra, omkring 1450 (vissa källor anger 1447), erövrade kungariket, och dess kung Kanakasuriya Cinkaiariyan flydde med sin familj till Sydindien. Sapumal styrde Jaffna för Kottes räkning i omkring sjutton år. Omkring 1467, när han drog söderut efter Parakramabahus död (han regerade senare i Kotte som Bhuvanaikabahu VI), återvände Kanakasuriya från Madurai med legosoldater och återställde Jaffnarikets självständighet.
