# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
Zheng Chenggong’s northern expedition: Zheng Chenggongs fälttåg norrut
? The greatest attempt of the Ming loyalists to win back the lower Yangtze from the Qing. Zheng Chenggong (Koxinga), who held Xiamen and Kinmen on the Fujian coast in the name of the Southern Ming Yongli emperor, sailed north with a large fleet in the summer of 1658, but a typhoon off the Yangshan islands in Zhejiang that autumn sank many of his ships; Chinese accounts speak of more than 8,000 drowned, among them three of his sons. He sailed again in July 1659 with, by the loyalists’ own count, well over 100,000 men, entered the Yangtze, broke the river barriers at Guazhou and took Zhenjiang in early August, while his ally Zhang Huangyan went upriver past Nanjing to Wuhu and won the submission of four prefectures and some two dozen counties in southern Anhui. Koxinga reached Nanjing in mid-August and invested it from 24 August, but he waited for the city to surrender instead of storming it, and his troops grew careless. Reinforced, the Qing garrison under the governor-general Lang Tingzuo sallied out on 9–10 September 1659 and routed the besiegers; Koxinga lost thousands of men and several of his best commanders, among them Gan Hui, who was captured and executed. He fell back to Xiamen, where he beat off a Qing fleet in June 1660, and Zhang Huangyan escaped overland to the coast. The defeat ended hopes of a Ming restoration in the south-east and led Koxinga to turn to Taiwan in 1661.
: Minglojalisternas största försök att vinna tillbaka nedre Yangtze från Qing. Zheng Chenggong (Koxinga), som höll Xiamen och Kinmen vid Fujians kust i namn av Södra Mings kejsare Yongli, seglade norrut med en stor flotta sommaren 1658, men en tyfon vid Yangshanöarna i Zhejiang samma höst sänkte många av hans fartyg; kinesiska berättelser talar om mer än 8 000 drunknade, bland dem tre av hans söner. Han seglade på nytt i juli 1659 med, enligt lojalisternas egen räkning, långt över 100 000 man, gick in i Yangtze, bröt flodspärrarna vid Guazhou och intog Zhenjiang i början av augusti, medan hans bundsförvant Zhang Huangyan drog uppför floden förbi Nanking till Wuhu och fick fyra prefekturer och ett par dussin härad i södra Anhui att underkasta sig. Koxinga nådde Nanking i mitten av augusti och inneslöt staden från den 24 augusti, men han väntade på att staden skulle kapitulera i stället för att storma den, och hans trupper blev vårdslösa. Den förstärkta Qinggarnisonen under generalguvernören Lang Tingzuo gjorde ett utfall den 9–10 september 1659 och slog belägrarna på flykten; Koxinga förlorade tusentals man och flera av sina bästa befälhavare, bland dem Gan Hui, som tillfångatogs och avrättades. Han drog sig tillbaka till Xiamen, där han slog tillbaka en Qingflotta i juni 1660, och Zhang Huangyan tog sig landvägen till kusten. Nederlaget gjorde slut på förhoppningarna om ett återupprättat Ming i sydost och fick Koxinga att vända sig mot Taiwan 1661.
