Kraków Uprising: Krakówupproret
A Polish rising for national independence and the end of serfdom, launched in the Free City of Kraków on the night of 20 February 1846 and put down by Austrian and Russian troops within about nine days. In neighbouring Galicia, peasants encouraged by Austrian officials turned on the Polish nobility in the Galician slaughter, killing by some estimates about 1,000 nobles, and in November 1846 Austria annexed Kraków with Russian and Prussian consent.: Ett polskt uppror för nationellt oberoende och livegenskapens avskaffande, som inleddes i Fristaden Kraków natten till den 20 februari 1846 och slogs ned av österrikiska och ryska trupper inom omkring nio dagar. I angränsande Galizien vände sig bönder, uppmuntrade av österrikiska ämbetsmän, mot den polska adeln i den galiziska slakten och dödade enligt vissa uppskattningar omkring 1 000 adelsmän, och i november 1846 annekterade Österrike Kraków med Rysslands och Preussens samtycke.
