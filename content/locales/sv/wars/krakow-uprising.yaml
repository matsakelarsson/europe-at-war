Risings planned at the same time elsewhere, above all in Prussian Greater Poland, were broken up by arrests before they began. The insurgent leader Jan Tyssowski crossed into Prussia with about 1,500 men on 4 March and was interned.: Uppror som planerats samtidigt på andra håll, framför allt i preussiska Storpolen, slogs sönder genom arresteringar innan de hann börja. Upprorsledaren Jan Tyssowski gick över gränsen till Preussen med omkring 1 500 man den 4 mars och internerades.
