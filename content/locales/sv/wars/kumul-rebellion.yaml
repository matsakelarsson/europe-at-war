# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
Kumul rebellion: Kumulupproret
A series of wars in Xinjiang in 1931–1937 that began with a rising of the Uyghurs of Kumul (Hami) against the provincial governor Jin Shuren. The revolt drew in the Hui commander Ma Zhongying and his 36th Division from Gansu and spread to the oases of the south, where Uyghur and Kyrgyz leaders proclaimed the Turkic Islamic Republic of East Turkestan in Kashgar in November 1933. Jin was overthrown in April 1933 by his own officers, and his successor Sheng Shicai turned to the Soviet Union, whose troops invaded in January 1934 and drove Ma Zhongying from the north. Ma’s Hui troops destroyed the East Turkestan Republic in 1934, and he himself crossed into the Soviet Union. A second rising in the south in 1937 was crushed by Sheng with Soviet help. Fighting and massacres between Uyghurs, Kyrgyz, Hui and Han killed thousands, and Sheng Shicai was left ruling Xinjiang as a Soviet client within the Republic of China.: En serie krig i Xinjiang 1931–1937 som började med att uigurerna i Kumul (Hami) reste sig mot provinsguvernören Jin Shuren. Revolten drog in huibefälhavaren Ma Zhongying och hans 36:e division från Gansu och spred sig till oaserna i söder, där uiguriska och kirgiziska ledare utropade Turkiska islamiska republiken Östturkestan i Kashgar i november 1933. Jin störtades i april 1933 av sina egna officerare, och hans efterträdare Sheng Shicai vände sig till Sovjetunionen, vars trupper invaderade i januari 1934 och drev bort Ma Zhongying från norra Xinjiang. Mas huitrupper krossade Republiken Östturkestan 1934, och han själv gick över till Sovjetunionen. En andra resning i söder 1937 slogs ned av Sheng med sovjetisk hjälp. Strider och massakrer mellan uigurer, kirgizer, hui och hankineser dödade tusentals, och Sheng Shicai stod kvar som härskare över Xinjiang, som en sovjetisk klient inom Republiken Kina.
