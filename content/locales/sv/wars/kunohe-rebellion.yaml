# Svenska översättningar av katalogtexten (våg 10); stegtexterna kommer senare.
Kunohe Rebellion: Kunoheupproret
? The rising of Kunohe Masazane against the Nanbu lord and Toyotomi Hideyoshi in the far north of Honshu, the last campaign of the unification of Japan. When Nanbu Harumasa died in 1582 the great northern house of the Nanbu split over the succession; Masazane, head of the powerful Kunohe branch, backed his brother against Nanbu Nobunao, who won. In 1590, after the fall of Odawara, Hideyoshi confirmed Nobunao as lord of the Nanbu lands and ordered the other branches to obey him, while his settlement of the north (the Ōshu shioki) took land from many local lords and set off risings across Mutsu and Dewa. Masazane refused to attend Nobunao’s New Year ceremony in 1591, and in the third month rose with about 5,000 men and attacked castles loyal to Nobunao. Unable to defeat him, Nobunao appealed to Hideyoshi, who sent a second northern expedition under his nephew Toyotomi Hidetsugu and Tokugawa Ieyasu, with Gamō Ujisato, Asano Nagamasa and other lords, an army put at about 60,000 that also put down risings in the Waga and Hienuki districts. Gamō and Asano besieged Kunohe castle at the beginning of the ninth month. After four days Masazane surrendered on a promise, carried by an envoy of Asano, that the defenders would be spared, but the men left in the castle were killed in its second bailey and the castle burned, and Masazane and the other leaders were executed at Sanhasama, in today’s Kurihara (Miyagi). Nobunao took over the castle, renamed it Fukuoka, and later moved his seat south to Morioka. With the end of the rebellion no lord in Japan was left in arms against Hideyoshi, who began his invasion of Korea the next spring.
: Kunohe Masazanes resning mot Nanbuherren och Toyotomi Hideyoshi längst i norr på Honshu, det sista fälttåget i Japans enande. När Nanbu Harumasa dog 1582 splittrades den stora ätten Nanbu i norr i frågan om arvsföljden; Masazane, överhuvud för den mäktiga Kunohegrenen, stödde sin bror mot Nanbu Nobunao, som segrade. År 1590, efter Odawaras fall, bekräftade Hideyoshi Nobunao som herre över Nanbuländerna och beordrade de andra grenarna att lyda honom, medan hans nyordning av norr (Ōshu shioki) tog land från många lokala herrar och utlöste resningar över hela Mutsu och Dewa. Masazane vägrade att närvara vid Nobunaos nyårsceremoni 1591 och reste sig i tredje månaden med omkring 5 000 man och angrep borgar som var lojala mot Nobunao. Nobunao, som inte kunde besegra honom, vädjade till Hideyoshi, som sände en andra expedition norrut under sin systerson Toyotomi Hidetsugu och Tokugawa Ieyasu, med Gamō Ujisato, Asano Nagamasa och andra herrar, en armé som uppges ha omfattat omkring 60 000 man och som också slog ned resningar i distrikten Waga och Hienuki. Gamō och Asano belägrade borgen Kunohe i början av nionde månaden. Efter fyra dagar kapitulerade Masazane mot ett löfte, framfört av ett sändebud från Asano, om att försvararna skulle skonas, men de män som var kvar i borgen dödades på dess andra borggård och borgen brändes, och Masazane och de andra ledarna avrättades i Sanhasama, i dagens Kurihara (Miyagi). Nobunao tog över borgen, gav den namnet Fukuoka och flyttade senare sitt säte söderut till Morioka. När upproret var slut fanns ingen herre i Japan kvar under vapen mot Hideyoshi, som våren därpå inledde sin invasion av Korea.
