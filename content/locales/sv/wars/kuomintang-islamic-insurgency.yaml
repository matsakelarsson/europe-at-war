# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
Kuomintang Islamic insurgency: Kuomintangs islamiska upprorsrörelse
? Armed resistance to the People’s Republic in north-west China after 1949 by remnants of the Nationalist armies of the Hui Ma clique, by Kazakh fighters and by other anti-communist groups, in Gansu, Qinghai, Ningxia and Xinjiang. When the PLA took the north-west in 1949, the Ma clique’s leaders Ma Bufang and Ma Hongkui left China and the Nationalist commanders in Xinjiang declared for the Communists, but some officers took to the mountains. The ROC government on Taiwan sent agents and gave them ranks and commands, and the CIA dropped arms, radios and gold to one of them, Ma Liang. In Xinjiang the Kazakh leader Ospan Batyr (Osman Batur) and Yulbars Khan, the former chancellor of Kumul, fought the PLA in 1950. Yulbars Khan escaped through Tibet and India to Taiwan, where he served as the ROC’s governor of Xinjiang in exile; Ospan was captured in Qinghai and executed at Ürümqi on 29 April 1951, and many of his followers fled across Tibet and the Himalayas and were later resettled in Turkey. In Qinghai and Gansu Ma Yuanxiang was killed in battle in Tongde county on 16 May 1953, and Ma Hushan, the former ruler of southern Xinjiang, was captured and executed at Lanzhou in 1954. The main bands had been destroyed by the mid-1950s; some sources date the last fighting to 1958, when revolts broke out among the Tibetans and Hui of Amdo.
: Väpnat motstånd mot Folkrepubliken i nordvästra Kina efter 1949 från rester av nationalistarméerna under huigeneralernas Ma-klick, från kazakiska krigare och från andra antikommunistiska grupper, i Gansu, Qinghai, Ningxia och Xinjiang. När Folkets befrielsearmé tog nordvästra Kina 1949 lämnade Ma-klickens ledare Ma Bufang och Ma Hongkui landet och nationalistbefälhavarna i Xinjiang ställde sig på kommunisternas sida, men en del officerare tog till bergen. Republiken Kinas regering på Taiwan sände agenter och gav dem grader och befäl, och CIA släppte ned vapen, radioapparater och guld till en av dem, Ma Liang. I Xinjiang bekämpade kazakledaren Ospan Batyr (Osman Batur) och Yulbars Khan, Kumuls förre kansler, Folkets befrielsearmé 1950. Yulbars Khan flydde genom Tibet och Indien till Taiwan, där han tjänstgjorde som Republiken Kinas guvernör för Xinjiang i exil; Ospan tillfångatogs i Qinghai och avrättades i Ürümqi den 29 april 1951, och många av hans anhängare flydde över Tibet och Himalaya och återbosattes senare i Turkiet. I Qinghai och Gansu stupade Ma Yuanxiang i strid i Tongde härad den 16 maj 1953, och Ma Hushan, södra Xinjiangs förre härskare, tillfångatogs och avrättades i Lanzhou 1954. De större banden hade krossats i mitten av 1950-talet; en del källor daterar de sista striderna till 1958, då revolter bröt ut bland tibetanerna och huifolket i Amdo.
