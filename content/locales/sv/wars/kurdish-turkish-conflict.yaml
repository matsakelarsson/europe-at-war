Last updated 26 November 2026. After Öcalan’s capture the PKK called a ceasefire and changed its aim from independence to autonomy and rights within Turkey, while Turkey, seeking to join the European Union, eased restrictions on the Kurdish language. Fighting resumed in 2004. A peace process begun in 2013 broke down in July 2015. In 2015–2016 PKK youth units dug in inside towns, and army sieges and curfews destroyed much of the old city of Diyarbakır, Cizre and Nusaybin, killing hundreds of civilians. Turkey also struck PKK-linked Kurdish forces in Syria and built a chain of bases in northern Iraq.: Senast uppdaterad 26 november 2026. Efter gripandet av Öcalan utlyste PKK vapenvila och ändrade sitt mål från självständighet till självstyre och rättigheter inom Turkiet, medan Turkiet, som sökte medlemskap i Europeiska unionen, lättade på begränsningarna av det kurdiska språket. Striderna återupptogs 2004. En fredsprocess som inleddes 2013 bröt samman i juli 2015. 2015–2016 grävde PKK:s ungdomsförband ned sig i städer, och arméns belägringar och utegångsförbud förstörde stora delar av gamla staden i Diyarbakır, Cizre och Nusaybin och dödade hundratals civila. Turkiet angrep också PKK-anknutna kurdiska styrkor i Syrien och byggde en kedja av baser i norra Irak.
In October 2024 Devlet Bahçeli, leader of the nationalist party allied with President Erdoğan, proposed that Öcalan call on the PKK to lay down its arms. Öcalan did so on 27 February 2025. The PKK declared a ceasefire and on 12 May announced that it was dissolving itself and ending its armed struggle. On 11 July some 30 fighters burned their weapons at a ceremony near Sulaymaniyah in Iraqi Kurdistan, and in October the PKK said it was withdrawing its fighters from Turkey. In August 2026 Turkey’s parliament passed a law on the return of PKK members, conditional on verified disarmament, which Turkey had not yet confirmed. In November Turkish security sources said the PKK had left 14 more sites in the Hakurk area of northern Iraq, but Ankara said the main arms depots at Gara and Hakurk still had to be cleared before its National Security Council could confirm disarmament; the PKK said it had withdrawn from the border and accused the government of failing to take steps in return.: I oktober 2024 föreslog Devlet Bahçeli, ledare för det nationalistiska parti som var allierat med president Erdoğan, att Öcalan skulle uppmana PKK att lägga ned vapnen. Öcalan gjorde det den 27 februari 2025. PKK utlyste vapenvila och meddelade den 12 maj att organisationen upplöste sig och avslutade sin väpnade kamp. Den 11 juli brände omkring 30 kämpar sina vapen vid en ceremoni nära Sulaymaniyya i irakiska Kurdistan, och i oktober meddelade PKK att man drog tillbaka sina kämpar från Turkiet. I augusti 2026 antog Turkiets parlament en lag om PKK-medlemmars återvändande, villkorad av verifierad avväpning, något som Turkiet ännu inte hade bekräftat. I november uppgav turkiska säkerhetskällor att PKK hade lämnat ytterligare 14 platser i Hakurkområdet i norra Irak, men Ankara förklarade att de stora vapendepåerna i Gara och Hakurk först måste röjas innan det nationella säkerhetsrådet kunde bekräfta avväpningen; PKK uppgav att man hade dragit sig tillbaka från gränsen och anklagade regeringen för att inte ha tagit några motsvarande steg.
