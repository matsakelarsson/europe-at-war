The PKK is listed as a terrorist organisation by Turkey, the European Union and the United States. Both sides were accused of grave abuses; the PKK killed civilians, village guards and teachers, and the European Court of Human Rights ruled against Turkey in many cases of village destruction, torture and killings in the 1990s.: PKK är terrorstämplat av Turkiet, Europeiska unionen och USA. Båda sidor anklagades för grova övergrepp; PKK dödade civila, byvakter och lärare, och Europeiska domstolen för de mänskliga rättigheterna dömde mot Turkiet i många mål om förstörda byar, tortyr och mord under 1990-talet.
The death toll is usually given as more than 40,000 since 1984, including soldiers, police, village guards, PKK fighters and civilians.: Dödssiffran anges vanligen till mer än 40 000 sedan 1984, inräknat soldater, poliser, byvakter, PKK-kämpar och civila.
This entry treats the conflict as ongoing because the disarmament process begun in 2025 had not been declared complete. It will be updated when it is.: Denna post behandlar konflikten som pågående eftersom den avväpningsprocess som inleddes 2025 inte har förklarats avslutad. Den kommer att uppdateras när så sker.
