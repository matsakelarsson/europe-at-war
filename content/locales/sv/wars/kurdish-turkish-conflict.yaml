The PKK was founded in 1978 by Abdullah Öcalan as a Marxist–Leninist party seeking an independent Kurdistan, at a time when the Kurdish language was restricted in public life in Turkey. After the military coup of 1980 its leaders worked from Syria and the Syrian-controlled Beqaa valley in Lebanon. On 15 August 1984 its fighters attacked gendarmerie posts and barracks in Eruh and Şemdinli. The state answered by arming Kurdish villagers as paid village guards and from 1987 placed the south-eastern provinces under emergency rule. The PKK attacked village guards and their families, teachers and others it saw as agents of the state.: PKK grundades 1978 av Abdullah Öcalan som ett marxist-leninistiskt parti med målet ett självständigt Kurdistan, i en tid då kurdiska språket var begränsat i det offentliga livet i Turkiet. Efter militärkuppen 1980 verkade dess ledare från Syrien och den syriskkontrollerade Bekaadalen i Libanon. Den 15 augusti 1984 angrep dess kämpar gendarmeriposter och kaserner i Eruh och Şemdinli. Staten svarade med att beväpna kurdiska bybor som avlönade byvakter och ställde från 1987 de sydöstra provinserna under undantagstillstånd. PKK angrep byvakter och deras familjer, lärare och andra som organisationen såg som statens agenter.
The war was at its worst in the early and mid-1990s. Security forces emptied or burned some 3,000 villages, uprooting hundreds of thousands of people, and thousands of Kurdish activists, journalists and businessmen were killed in murders that were never solved. The army struck PKK bases in northern Iraq, in 1997 with tens of thousands of troops. In 1998 Turkey threatened Syria with war unless it expelled Öcalan; he left and was seized by Turkish agents in Nairobi on 15 February 1999. Sentenced to death, a sentence later commuted to life, he was imprisoned on the island of İmralı.: Kriget var som värst i början och mitten av 1990-talet. Säkerhetsstyrkorna tömde eller brände omkring 3 000 byar och drev hundratusentals människor från sina hem, och tusentals kurdiska aktivister, journalister och affärsmän dödades i mord som aldrig klarades upp. Armén angrep PKK:s baser i norra Irak, 1997 med tiotusentals soldater. 1998 hotade Turkiet Syrien med krig om landet inte utvisade Öcalan; han lämnade Syrien och greps av turkiska agenter i Nairobi den 15 februari 1999. Han dömdes till döden, ett straff som senare omvandlades till livstid, och fängslades på ön İmralı.
