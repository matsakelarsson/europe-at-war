Kurdish–Turkish conflict (PKK insurgency): Kurdisk-turkiska konflikten (PKK-upproret)
The armed conflict between the Turkish state and the Kurdistan Workers’ Party (PKK), which took up arms in south-eastern Turkey in 1984, first for an independent Kurdish state and later for autonomy and Kurdish rights; more than 40,000 people were killed, most of them in the 1990s, and the fighting spread into northern Iraq and Syria. The PKK declared its dissolution and the end of its armed struggle in May 2025, but as of November 2026 Turkey had not confirmed that its disarmament was complete.: Den väpnade konflikten mellan den turkiska staten och Kurdistans arbetarparti (PKK), som grep till vapen i sydöstra Turkiet 1984, först för en självständig kurdisk stat och senare för självstyre och kurdiska rättigheter. Mer än 40 000 människor dödades, de flesta under 1990-talet, och striderna spred sig till norra Irak och Syrien. PKK förklarade sig upplöst och sin väpnade kamp avslutad i maj 2025, men i november 2026 hade Turkiet ännu inte bekräftat att avväpningen var fullbordad.
