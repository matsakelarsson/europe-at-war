Kuwait–Najd War: Kuwaitisk-najdiska kriget
A border war between Kuwait and Ibn Saud’s Sultanate of Najd, fought mainly by the Ikhwan warriors of Faisal al-Duwaish. After the death of Kuwait’s ruler Mubarak al-Sabah in 1915, relations with his former protégé Ibn Saud soured over the border and over tribes and trade. In May 1920 about 2,000 Ikhwan routed a Kuwaiti force of a few hundred at Hamdh, and Kuwait’s people built a mud wall around the town in a few weeks. On 10 October 1920 several thousand Ikhwan attacked Jahra, west of the town; its defenders under Sheikh Salim al-Mubarak held out in the Red Fort, and the Ikhwan withdrew as British warships, aircraft and troops arrived. The Uqair Protocol of December 1922, drawn up by Britain, gave Najd about two-thirds of the land Kuwait had claimed, and a Saudi trade blockade of Kuwait followed from 1923 to 1937.: Ett gränskrig mellan Kuwait och Ibn Sauds sultanat Najd, som huvudsakligen utkämpades av Faisal al-Duwaishs ikhwankrigare. Efter att Kuwaits härskare Mubarak al-Sabah dött 1915 försämrades förbindelserna med hans forna skyddsling Ibn Saud i tvister om gränsen, stammarna och handeln. I maj 1920 slog omkring 2 000 ikhwankrigare en kuwaitisk styrka på några hundra man på flykten vid Hamdh, och Kuwaits invånare byggde på några veckor en lermur runt staden. Den 10 oktober 1920 anföll flera tusen ikhwankrigare Jahra, väster om staden; dess försvarare under shejk Salim al-Mubarak höll stånd i Röda fortet, och ikhwan drog sig tillbaka när brittiska krigsfartyg, flygplan och trupper anlände. Uqairprotokollet från december 1922, som Storbritannien utformade, gav Najd omkring två tredjedelar av det land som Kuwait hade gjort anspråk på, och därefter följde en saudisk handelsblockad mot Kuwait från 1923 till 1937.
