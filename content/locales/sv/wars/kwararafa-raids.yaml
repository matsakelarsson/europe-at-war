# Svenska översättningar av katalogtexten (våg 13); stegtexterna kommer senare.
Kwararafa wars with Kano and Bornu: Kwararafas krig mot Kano och Bornu
? "Raids and invasions of the Hausa kingdoms and of Bornu by Kwararafa, a state or confederation in the Benue valley of central Nigeria, from the late sixteenth century to about 1680. The Kano Chronicle tells that under Sarki Muhammad Zaki (1582–1618 in its reckoning) the king of Kwararafa attacked Kano and ravaged the country, and that the people fled to Daura; in the 1650s, under Muhammad Kukuna, Kwararafa forces under their king Adashu attacked Kano again and damaged its Kawayi gate while the sarki was away, and in 1653, by one account, Kano’s ruler was forced into exile; in 1671 the people of Kano fled once more to Daura. Kano and Katsina, long at war with each other, made peace about 1650 to face the threat. About 1680 Kwararafa armies attacked Katsina and Zazzau and invaded Bornu, reaching its capital, Birni Ngazargamu; Mai Ali ibn Umar drove them out, and some accounts say the city was sacked. Kwararafa then declined: by the end of the eighteenth century it paid tribute to Bornu, and a Jukun kingdom at Wukari later claimed its succession. Almost everything known about these wars comes from the chronicles of the Hausa and Bornu states that Kwararafa attacked; the Benue valley’s own traditions say little about them. The identification of Kwararafa with the Jukun was first made by the colonial officer Richmond Palmer, and a minority of historians doubt that a single confederation existed."
: "Räder och invasioner som Kwararafa, en stat eller konfederation i Benuedalen i centrala Nigeria, riktade mot hausarikena och Bornu från slutet av 1500-talet till omkring 1680. Kanokrönikan berättar att kungen av Kwararafa under sarki Muhammad Zaki (1582–1618 enligt krönikans tideräkning) anföll Kano och härjade landet och att folket flydde till Daura; på 1650-talet, under Muhammad Kukuna, anföll Kwararafas styrkor under sin kung Adashu Kano på nytt och skadade dess Kawayiport medan sarkin var borta, och 1653 tvingades Kanos härskare enligt en version i landsflykt; 1671 flydde Kanos invånare än en gång till Daura. Kano och Katsina, som länge hade legat i krig med varandra, slöt fred omkring 1650 för att möta hotet. Omkring 1680 anföll Kwararafas arméer Katsina och Zazzau och invaderade Bornu, där de nådde huvudstaden Birni Ngazargamu; mai Ali ibn Umar drev ut dem, och enligt vissa framställningar plundrades staden. Därefter gick Kwararafa tillbaka: i slutet av 1700-talet betalade det tribut till Bornu, och ett jukunrike i Wukari gjorde senare anspråk på att vara dess efterföljare. Nästan allt man vet om dessa krig kommer från krönikorna i de hausastater och i Bornu som Kwararafa anföll; Benuedalens egna traditioner säger föga om dem. Identifieringen av Kwararafa med jukun gjordes först av kolonialtjänstemannen Richmond Palmer, och en minoritet av historikerna betvivlar att det fanns en enda konfederation."
