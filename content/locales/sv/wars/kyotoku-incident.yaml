# Svenska översättningar av katalogtexten (våg 10); stegtexterna kommer senare.
Kyōtoku Incident: Kyōtokuincidenten
? "A war of almost thirty years in the Kantō between Ashikaga Shigeuji, the Kamakura kubō, and the Uesugi, backed by the shogunate, which broke eastern Japan into rival camps and began its Sengoku period. Shigeuji, the surviving son of Ashikaga Mochiuji, was made kubō in 1449 with Uesugi Noritada, son of his father’s enemy Norizane, as his deputy (Kantō kanrei). After an armed clash in 1450 the two sides made an uneasy peace, but at the end of Kyōtoku 3 (January 1455) Shigeuji had Noritada killed at his residence in Kamakura and attacked the Uesugi mansions. He won at Bubaigawara and elsewhere in the first months of 1455, but the shogunate declared him a rebel, and in the sixth month Imagawa Noritada of Suruga took and burned Kamakura. Shigeuji made Koga, in Shimōsa, his seat, and he and his successors became known as the Koga kubō. The Uesugi built strongholds against him at Kawagoe and Edo, the second traditionally credited to Ōta Dōkan, and from about 1459 the two camps faced each other along the Tone River, Shigeuji’s allies (the Chiba, Utsunomiya, Oyama and Yūki among them) holding the east and the Uesugi the west. The shogun Yoshimasa sent his brother Ashikaga Masatomo as a new kubō in 1457–1458, but Masatomo could not enter Kamakura and stayed at Horigoe in Izu (the Horigoe kubō). The war dragged on through the Ōnin War, which kept the shogunate from helping; the Uesugi took Koga in 1471, Shigeuji won it back, and from 1476 the revolt of Nagao Kageharu split the Uesugi side. A peace between the shogunate and Shigeuji was finally agreed at the end of Bunmei 14 (January 1483): Shigeuji was recognised as kubō at Koga and Masatomo kept Izu. The Kantō remained divided, and in the 1490s Ise Sōzui (Hōjō Sōun) took Izu from Masatomo’s heirs, the first step of the Later Hōjō."
: "Ett nästan trettioårigt krig i Kantō mellan Ashikaga Shigeuji, Kamakura kubō, och Uesugiklanen, som stöddes av shogunatet, ett krig som splittrade östra Japan i rivaliserande läger och inledde dess Sengokuperiod. Shigeuji, Ashikaga Mochiujis överlevande son, blev kubō 1449 med Uesugi Noritada, son till faderns fiende Norizane, som ställföreträdare (Kantō kanrei). Efter en väpnad sammandrabbning 1450 slöt de båda sidorna en bräcklig fred, men i slutet av Kyōtoku 3 (januari 1455) lät Shigeuji döda Noritada i sitt residens i Kamakura och angrep Uesugiklanens residens. Han segrade vid Bubaigawara och på andra håll under de första månaderna 1455, men shogunatet förklarade honom som rebell, och i sjätte månaden intog och brände Imagawa Noritada från Suruga Kamakura. Shigeuji gjorde Koga i Shimōsa till sitt säte, och han och hans efterträdare blev kända som Koga kubō. Uesugiklanen byggde fästen mot honom i Kawagoe och Edo, det senare enligt traditionen anlagt av Ōta Dōkan, och från omkring 1459 stod de båda lägren mot varandra längs floden Tone, där Shigeujis bundsförvanter (bland dem Chiba, Utsunomiya, Oyama och Yūki) höll den östra sidan och Uesugiklanen den västra. Shogunen Yoshimasa sände 1457–1458 sin bror Ashikaga Masatomo som ny kubō, men Masatomo kunde inte ta sig in i Kamakura och stannade i Horigoe i Izu (Horigoe kubō). Kriget drog ut genom hela Ōninkriget, som hindrade shogunatet från att ingripa; Uesugiklanen intog Koga 1471, Shigeuji vann tillbaka det, och från 1476 splittrade Nagao Kageharus revolt Uesugisidan. En fred mellan shogunatet och Shigeuji kom till sist till stånd i slutet av Bunmei 14 (januari 1483): Shigeuji erkändes som kubō i Koga och Masatomo behöll Izu. Kantō förblev splittrat, och på 1490-talet tog Ise Sōzui (Hōjō Sōun) Izu från Masatomos arvingar, det första steget i Senare Hōjōklanens uppgång."
