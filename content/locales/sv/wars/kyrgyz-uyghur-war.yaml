# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
Fall of the Uyghur Khaganate: Uiguriska khaganatets fall
? The war in which the Yenisei Kyrgyz destroyed the Uyghur Khaganate, the empire that had ruled the Mongolian steppe since 744, and the Tang campaigns against the Uyghur refugees that followed. From about 820, according to the Tang histories, the Kyrgyz ruler on the upper Yenisei called himself khagan and fought the Uyghurs for some twenty years. After a coup, a famine and a hard winter had weakened the khaganate, a Kyrgyz army of about 80,000 horsemen, guided by a rebel Uyghur minister, sacked the Uyghur capital Ordu-Baliq in the Orkhon valley in 840 and killed the khagan. The Uyghurs scattered. Some went west to the Karluks, others to Turfan and the Gansu oases, where they founded the kingdoms of Qocho and Ganzhou; the largest group, under the new khagan Wujie, moved south to the Tang frontier in the great bend of the Yellow River. The Tang, allied with the Kyrgyz, attacked Wujie’s camp at Shahu in February 843 and broke his following; he was killed in 846, and the last Uyghur remnants on the frontier were defeated in 847. The Kyrgyz did not take over the steppe empire, and Mongolia was left without a dominant power until the Khitans.
: Det krig i vilket jenisejkirgizerna förintade Uiguriska khaganatet, det rike som hade härskat över den mongoliska stäppen sedan 744, och de fälttåg som Tangriket därefter förde mot de uiguriska flyktingarna. Från omkring 820 kallade sig kirgizernas härskare vid övre Jenisej enligt Tangdynastins krönikor khagan, och han kämpade mot uigurerna i ett tjugotal år. Sedan en statskupp, en hungersnöd och en hård vinter hade försvagat khaganatet plundrade en kirgizisk armé på omkring 80 000 ryttare, vägledd av en upprorisk uigurisk minister, den uiguriska huvudstaden Ordu-Baliq i Orchondalen 840 och dödade khaganen. Uigurerna skingrades. En del drog västerut till karlukerna, andra till Turfan och oaserna i Gansu, där de grundade kungarikena Qocho och Ganzhou; den största gruppen drog under den nye khaganen Wujie söderut till Tangrikets gräns i Gula flodens stora krök. Tangriket, som var allierat med kirgizerna, angrep Wujies läger vid Shahu i februari 843 och splittrade hans anhängare; han dödades 846, och de sista uiguriska resterna vid gränsen besegrades 847. Kirgizerna tog inte över stäppväldet, och Mongoliet saknade en dominerande makt fram till khitanerna.
