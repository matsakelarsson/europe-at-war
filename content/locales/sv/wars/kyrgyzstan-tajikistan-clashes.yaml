Kyrgyzstan–Tajikistan border clashes: Gränsstriderna mellan Kirgizistan och Tadzjikistan
Two short wars between Kyrgyzstan and Tajikistan over their disputed border in the Fergana Valley, in April 2021 and September 2022. Of the roughly 970-kilometre border inherited from the Soviet Union, more than a third had never been agreed, and the patchwork of villages, roads, pastures and canals around Kyrgyzstan’s Batken region and the Tajik exclave of Vorukh had produced repeated clashes. In April 2021 a quarrel over a water facility on the Isfara river turned into fighting between the two armies that killed about 55 people. In September 2022 much heavier fighting, with tanks, artillery and drones, spread along the whole Batken border and killed about 100 or more people, among them dozens of civilians, and more than 130,000 people were evacuated on the Kyrgyz side. Human Rights Watch found that forces on both sides had apparently committed war crimes. After long negotiations the two presidents signed a treaty settling the entire border on 13 March 2025.: Två korta krig mellan Kirgizistan och Tadzjikistan om deras omstridda gräns i Ferganadalen, i april 2021 och september 2022. Av den omkring 970 kilometer långa gräns som länderna hade ärvt från Sovjetunionen hade mer än en tredjedel aldrig fastställts genom avtal, och lapptäcket av byar, vägar, betesmarker och kanaler kring Kirgizistans Batkenregion och den tadzjikiska exklaven Vorukh hade gett upphov till upprepade sammandrabbningar. I april 2021 övergick ett gräl om en vattenanläggning vid floden Isfara i strider mellan de två arméerna som dödade omkring 55 människor. I september 2022 spred sig betydligt tyngre strider, med stridsvagnar, artilleri och drönare, längs hela gränsen vid Batken och dödade omkring 100 människor eller fler, bland dem dussintals civila, och mer än 130 000 människor evakuerades på den kirgiziska sidan. Human Rights Watch fann att styrkor på båda sidor av allt att döma hade begått krigsbrott. Efter långa förhandlingar undertecknade de två presidenterna den 13 mars 2025 ett fördrag som reglerade hela gränsen.
