# Svenska översättningar av katalogtexten (våg 10); stegtexterna kommer senare.
Kyushu Campaign: Kyushufälttåget
? "Toyotomi Hideyoshi’s conquest of Kyushu from the Shimazu of Satsuma. From their base in the far south the Shimazu had beaten the Ōtomo at Mimikawa (1578) and the Ryūzōji at Okitanawate (1584) and by 1586 were close to ruling the whole island. The Ōtomo lord Sōrin appealed to Hideyoshi, who ordered the Shimazu to stop and, when they refused his division of the island, sent an advance force to Bungo. The Shimazu took Iwaya in Chikuzen, invaded Bungo and beat Hideyoshi’s vanguard at Hetsugigawa in January 1587. In the spring Hideyoshi came himself with an army put at 200,000 or more, in two great columns: his brother Hidenaga marched down the east coast and beat the Shimazu at Nejirozaka in Hyūga, while Hideyoshi went down the west through Higo into Satsuma. On 13 June 1587 Shimazu Yoshihisa came to Hideyoshi’s camp at the temple of Taihei-ji in Sendai, his head shaved as a monk, and surrendered. The Shimazu kept Satsuma, Ōsumi and part of Hyūga; the rest of Kyushu was shared among Hideyoshi’s vassals, and at Hakozaki he issued his edict expelling the Jesuit missionaries."
: "Toyotomi Hideyoshis erövring av Kyushu från Shimazuklanen i Satsuma. Från sin bas längst i söder hade Shimazuklanen besegrat Ōtomoklanen vid Mimikawa (1578) och Ryūzōjiklanen vid Okitanawate (1584), och 1586 var den nära att härska över hela ön. Ōtomofursten Sōrin vädjade till Hideyoshi, som beordrade Shimazuklanen att upphöra och, när den vägrade godta hans uppdelning av ön, sände en förtrupp till Bungo. Shimazuklanen intog Iwaya i Chikuzen, invaderade Bungo och besegrade Hideyoshis förtrupp vid Hetsugigawa i januari 1587. Under våren kom Hideyoshi själv med en armé som uppskattats till 200 000 man eller fler, i två stora kolonner: hans bror Hidenaga tågade längs östkusten och besegrade Shimazustyrkorna vid Nejirozaka i Hyūga, medan Hideyoshi drog ner längs västsidan genom Higo in i Satsuma. Den 13 juni 1587 kom Shimazu Yoshihisa till Hideyoshis läger vid templet Taihei-ji i Sendai, med huvudet rakat som en munk, och kapitulerade. Shimazuklanen behöll Satsuma, Ōsumi och en del av Hyūga; resten av Kyushu fördelades mellan Hideyoshis vasaller, och i Hakozaki utfärdade han sitt påbud om utvisning av jesuitmissionärerna."
