# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
Lahad Datu standoff: Konfrontationen i Lahad Datu
? The armed incursion into eastern Sabah of followers of Jamalul Kiram III, one of several claimants to the title of Sultan of Sulu. The sultans of Sulu had granted or leased North Borneo to a British company in 1878, and Malaysia still paid the heirs 5,300 ringgit (about US$1,000) a year, which the heirs regarded as rent and Malaysia as payment for a cession; the Philippines has kept a dormant claim to Sabah since 1962. Feeling left out of the peace talks between Manila and the Moro Islamic Liberation Front, Kiram sent his brother Agbimuddin Kiram with about 200 men, some of them armed, by boat from Simunul in Tawi-Tawi to the village of Tanduo near Lahad Datu, where they landed on 11 February 2013 and declared themselves the Royal Security Forces of the Sultanate of Sulu and North Borneo. Malaysian police surrounded them, and the Philippine government urged them to return home. After three weeks of negotiation, a firefight at Tanduo on 1 March killed two Malaysian commandos and twelve of Kiram’s men; on 2 March gunmen ambushed police in the water village of Sri Jaya Siminul at Semporna, killing six. On 5 March Malaysia launched Operation Daulat with air strikes by fighter aircraft and an assault by army and police; Tanduo was taken on 11 March and the fighting ended in late March. Malaysian figures put the dead at ten members of the security forces, six civilians and 56–68 of Kiram’s men; about 150 people were detained, and nine Filipinos were later sentenced to death in Malaysia for waging war against the king. Malaysia set up the Eastern Sabah Security Command (ESSCOM) and stopped the annual payment; the heirs’ later claim in a European arbitration, which in 2022 awarded them US$14.9 billion, was set aside by French courts in 2023–2024.
: Det väpnade intrånget i östra Sabah av anhängare till Jamalul Kiram III, en av flera som gjorde anspråk på titeln sultan av Sulu. Sultanerna av Sulu hade överlåtit eller arrenderat ut Nordborneo till ett brittiskt bolag 1878, och Malaysia betalade fortfarande arvingarna 5 300 ringgit (omkring 1 000 US-dollar) om året, vilket arvingarna betraktade som arrende och Malaysia som betalning för en avträdelse; Filippinerna har sedan 1962 upprätthållit ett vilande anspråk på Sabah. Kiram, som kände sig utestängd från fredssamtalen mellan Manila och Moros islamiska befrielsefront, sände sin bror Agbimuddin Kiram med omkring 200 man, en del av dem beväpnade, med båt från Simunul i Tawi-Tawi till byn Tanduo nära Lahad Datu, där de landsteg den 11 februari 2013 och utropade sig till Sultanatet Sulus och Nordborneos kungliga säkerhetsstyrkor. Malaysisk polis omringade dem, och den filippinska regeringen uppmanade dem att återvända hem. Efter tre veckors förhandlingar dödades två malaysiska kommandosoldater och tolv av Kirams män i en eldstrid i Tanduo den 1 mars; den 2 mars överföll beväpnade män polis i vattenbyn Sri Jaya Siminul i Semporna och dödade sex. Den 5 mars inledde Malaysia Operation Daulat med flyganfall av stridsflygplan och ett anfall av armé och polis; Tanduo intogs den 11 mars, och striderna upphörde i slutet av mars. Enligt malaysiska siffror dödades tio medlemmar av säkerhetsstyrkorna, sex civila och 56–68 av Kirams män; omkring 150 personer greps, och nio filippinier dömdes senare till döden i Malaysia för att ha fört krig mot kungen. Malaysia upprättade Eastern Sabah Security Command (ESSCOM) och stoppade den årliga betalningen; arvingarnas senare krav i en europeisk skiljedom, som 2022 tilldömde dem 14,9 miljarder US-dollar, upphävdes av franska domstolar 2023–2024.
