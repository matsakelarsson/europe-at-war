# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
Lam Sơn uprising: Lam Sơn-upproret
? The rising led by Lê Lợi, a landowner of Lam Sơn in the hills of Thanh Hóa, against Ming rule in Jiaozhi, the former Đại Việt annexed by the Ming in 1407. For six years his small army survived in the mountains, at times close to destruction, and in 1423 accepted a truce. In late 1424, on Nguyễn Chích’s advice, it turned south to Nghệ An, where Ming garrisons were thin, and by the end of 1425 held the whole country from Thanh Hóa to Thuận Hóa except a few walled towns. In 1426 the Lam Sơn armies came north, destroyed the army of the new Ming commander Wang Tong at Tốt Động–Chúc Động on 7 November and besieged him in Đông Quan (Hanoi). In the autumn of 1427 they took Xương Giang and destroyed the relief army from Guangxi, whose commander Liu Sheng was killed at Chi Lăng, and the army from Yunnan withdrew. Wang Tong agreed to leave, and the last Ming troops went home in January 1428. Lê Lợi took the throne as the first emperor of the Later Lê dynasty, and Nguyễn Trãi’s proclamation, the Bình Ngô đại cáo, declared the restored Đại Việt the equal of China.
: Det uppror som Lê Lợi, en jordägare från Lam Sơn i bergen i Thanh Hóa, ledde mot Mingstyret i Jiaozhi, det forna Đại Việt som Ming hade annekterat 1407. I sex år överlevde hans lilla armé i bergen, stundom nära förintelse, och 1423 gick den med på en vapenvila. I slutet av 1424 vände den på Nguyễn Chíchs inrådan söderut mot Nghệ An, där Minggarnisonerna var glesa, och vid slutet av 1425 behärskade den hela landet från Thanh Hóa till Thuận Hóa utom några befästa städer. År 1426 drog Lam Sơn-arméerna norrut, förintade den nye Mingbefälhavaren Wang Tongs armé vid Tốt Động–Chúc Động den 7 november och belägrade honom i Đông Quan (Hanoi). Hösten 1427 intog de Xương Giang och förintade undsättningsarmén från Guangxi, vars befälhavare Liu Sheng dödades vid Chi Lăng, och armén från Yunnan drog sig tillbaka. Wang Tong gick med på att lämna landet, och de sista Mingtrupperna drog hem i januari 1428. Lê Lợi besteg tronen som den förste kejsaren av Senare Lêdynastin, och Nguyễn Trãis proklamation, Bình Ngô đại cáo, förklarade det återupprättade Đại Việt jämställt med Kina.
