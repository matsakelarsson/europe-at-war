# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
Lao rebellion (Anouvong’s war): Laoupproret (Anouvongs krig)
"A war between King Anouvong of Vientiane and Siam, to which Vientiane and Champasak had been tributary since 1779. Angered by Siamese demands on the Lao of the Khorat plateau, and believing that Siam was about to be attacked by Britain, Anouvong sent his armies across the Mekong in the winter of 1826–1827. They took Nakhon Ratchasima and came within three days’ march of Bangkok, and began to move the Lao population of the plateau back across the river. Siam struck back with three armies: the Lao were beaten at Nong Bua Lamphu in May 1827, the Siamese took Vientiane, and Anouvong fled to Vietnam. When he returned with a small force in August 1828, the Siamese came back, razed Vientiane and carried off its people. Anouvong was handed over to them by the ruler of Muang Phuan and died a prisoner in Bangkok. The kingdom of Vientiane was abolished, and in the following decades well over 100,000 Lao were moved from the left bank of the Mekong to the Khorat plateau and central Siam.": "Ett krig mellan kung Anouvong av Vientiane och Siam, som Vientiane och Champasak hade betalat tribut till sedan 1779. Anouvong, som var förbittrad över Siams krav på laoterna på Khoratplatån och trodde att Siam stod i begrepp att angripas av Storbritannien, sände sina arméer över Mekong vintern 1826–1827. De intog Nakhon Ratchasima och kom inom tre dagsmarscher från Bangkok, och de började flytta platåns laotiska befolkning tillbaka över floden. Siam slog tillbaka med tre arméer: laoterna besegrades vid Nong Bua Lamphu i maj 1827, siameserna intog Vientiane, och Anouvong flydde till Vietnam. När han återvände med en liten styrka i augusti 1828 kom siameserna tillbaka, jämnade Vientiane med marken och förde bort dess invånare. Anouvong utlämnades till dem av härskaren i Muang Phuan och dog som fånge i Bangkok. Kungariket Vientiane avskaffades, och under de följande årtiondena flyttades långt över 100 000 laoter från Mekongs vänstra strand till Khoratplatån och centrala Siam."
