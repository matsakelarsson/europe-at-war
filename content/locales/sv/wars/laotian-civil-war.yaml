# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
Laotian Civil War: Laotiska inbördeskriget
? The war between the Royal Lao Government and the communist Pathet Lao, a proxy front of the Vietnam War. Attempts to bring the Pathet Lao into the kingdom’s government and army broke down in 1959, and a neutralist coup by Captain Kong Le in 1960 led to a three-sided war in which the United States and Thailand backed the right-wing army and the Soviet Union and North Vietnam the Pathet Lao and the neutralists. The Geneva agreement of 1962 declared Laos neutral, but the fighting resumed within a year. North Vietnam kept its troops in the east of the country to guard the Ho Chi Minh trail, while the American Central Intelligence Agency waged a “secret war” with an army of Hmong and other highlanders under Vang Pao, based at Long Tieng. From 1964 to 1973 American aircraft dropped more than 2 million tonnes of bombs on Laos, making it, per person, the most heavily bombed country in history. After the ceasefire of 1973 the Pathet Lao took power step by step, and on 2 December 1975 they abolished the monarchy and proclaimed the Lao People’s Democratic Republic.
: Kriget mellan den kungliga laotiska regeringen och den kommunistiska Pathet Lao, en front i Vietnamkriget som fördes genom ombud. Försöken att föra in Pathet Lao i kungarikets regering och armé bröt samman 1959, och en neutralistisk kupp av kapten Kong Le 1960 ledde till ett trepartskrig där USA och Thailand stödde den högerorienterade armén och Sovjetunionen och Nordvietnam stödde Pathet Lao och neutralisterna. Genèveavtalet 1962 förklarade Laos neutralt, men striderna återupptogs inom ett år. Nordvietnam behöll sina trupper i landets östra del för att skydda Ho Chi Minh-leden, medan den amerikanska underrättelsetjänsten CIA förde ett ”hemligt krig” med en armé av hmong och andra bergsfolk under Vang Pao, med bas i Long Tieng. Från 1964 till 1973 fällde amerikanska flygplan över 2 miljoner ton bomber över Laos, vilket gjorde landet, räknat per invånare, till det mest bombade i historien. Efter vapenvilan 1973 tog Pathet Lao makten steg för steg, och den 2 december 1975 avskaffade rörelsen monarkin och utropade Demokratiska folkrepubliken Laos.
