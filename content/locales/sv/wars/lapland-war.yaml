The retreating Germans burned the capital of Lapland. When the Finns entered it on 16 October, an estimated 90 per cent of the town had been destroyed.: De retirerande tyskarna brände Lapplands huvudort. När finländarna gick in i staden den 16 oktober var uppskattningsvis 90 procent av den förstörd.
