Under the Moscow Armistice Finland had to disarm or expel the German 20th Mountain Army, some 200,000 men under General Lothar Rendulic, which held northern Finland. At first the two armies kept up a staged “autumn manoeuvre”, the Germans pulling back north and the Finns following without fighting, while most of Lapland’s civilians were evacuated, some 56,000 of them to Sweden. The Germans’ attempt to seize the island of Suursaari on 15 September, which the Finns beat off, and pressure from the Soviet Control Commission ended the pretence. The first shots in Lapland were fired near Pudasjärvi on 28 September.: Enligt vapenstilleståndet i Moskva måste Finland avväpna eller fördriva den tyska 20:e bergsarmén, omkring 200 000 man under general Lothar Rendulic, som höll norra Finland. Till en början upprätthöll de båda arméerna en iscensatt ”höstmanöver”, där tyskarna drog sig norrut och finländarna följde efter utan strid, medan de flesta av Lapplands civila evakuerades, omkring 56 000 av dem till Sverige. Tyskarnas försök att inta Hogland den 15 september, som finländarna slog tillbaka, och påtryckningar från den sovjetiska kontrollkommissionen gjorde slut på skenet. De första skotten i Lappland avlossades nära Pudasjärvi den 28 september.
On 1 October Finnish troops landed at Tornio, at the head of the Gulf of Bothnia, behind the German lines. A week of hard fighting followed around Tornio and Kemi before the Germans withdrew. On 13 October German commanders ordered the burning of everything of military use, which in practice meant whole towns and villages. When Finnish troops reached Rovaniemi, the capital of Lapland, on 16 October, almost all of it was in ashes, and the roads and bridges behind the retreating Germans had been mined and blown up.: Den 1 oktober landsteg finländska trupper vid Torneå, längst in i Bottniska viken, bakom de tyska linjerna. En vecka av hårda strider kring Torneå och Kemi följde innan tyskarna drog sig tillbaka. Den 13 oktober beordrade tyska befälhavare att allt av militärt värde skulle brännas, vilket i praktiken innebar hela städer och byar. När finländska trupper nådde Rovaniemi, Lapplands huvudort, den 16 oktober låg nästan hela staden i aska, och vägarna och broarna bakom de retirerande tyskarna hade minerats och sprängts.
