After Rovaniemi the Germans withdrew along two roads, north-west through Muonio towards Norway and north through Ivalo towards the Norwegian Arctic. The Red Army, meanwhile, drove them out of Petsamo in October and followed them some way into Finnish territory along Lake Inari. The Finnish army followed slowly. Under the armistice it also had to demobilise much of its own force, and the retreating Germans destroyed the roads, bridges and buildings as they left. By November most German troops had left Finland, but from late November a rearguard held a fortified line on the Lätäseno river in the far north-west, and later positions near Kilpisjärvi, through the winter.: Efter Rovaniemi drog sig tyskarna tillbaka längs två vägar, nordväst genom Muonio mot Norge och norrut genom Ivalo mot norska Ishavskusten. Röda armén drev under tiden ut dem ur Petsamo i oktober och följde efter dem en bit in på finländskt territorium längs Enare träsk. Den finländska armén följde långsamt efter. Enligt vapenstilleståndet måste den också demobilisera en stor del av sina egna styrkor, och de retirerande tyskarna förstörde vägar, broar och byggnader när de lämnade området. I november hade de flesta tyska trupperna lämnat Finland, men från slutet av november höll en eftertrupp en befäst linje vid Lätäseno älv längst i nordväst, och senare ställningar nära Kilpisjärvi, under hela vintern.
On 27 April 1945 the last German troops left Finnish soil near Kilpisjärvi, and Finnish soldiers raised the flag on the cairn where Finland, Sweden and Norway meet. About 1,000 Finns had been killed or gone missing, and some 1,300 German prisoners were handed over to the Soviet Union under the armistice. Lapland was devastated. Around 40 per cent of its buildings had been destroyed, with hundreds of bridges and thousands of kilometres of road, Rovaniemi had to be rebuilt almost from scratch, and the clearing of mines and explosives went on for decades.: Den 27 april 1945 lämnade de sista tyska trupperna finländsk mark nära Kilpisjärvi, och finländska soldater hissade flaggan vid röset där Finland, Sverige och Norge möts. Omkring 1 000 finländare hade dödats eller försvunnit, och omkring 1 300 tyska fångar överlämnades till Sovjetunionen enligt vapenstilleståndet. Lappland var ödelagt. Omkring 40 procent av byggnaderna hade förstörts, liksom hundratals broar och tusentals kilometer väg, Rovaniemi fick byggas upp nästan från grunden, och röjningen av minor och sprängämnen pågick i årtionden.
