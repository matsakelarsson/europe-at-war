The war began with a German attempt to seize the island of Suursaari (Gogland) in the Gulf of Finland on 15 September 1944, which failed. Fighting in Lapland began at the end of September.: Kriget började med ett tyskt försök att den 15 september 1944 inta ön Hogland (Suursaari, ryska Gogland) i Finska viken, vilket misslyckades. Striderna i Lappland började i slutet av september.
Finnish dead numbered 774, with 262 missing; the Germans lost about 1,000 dead and some 1,300 missing or captured.: De finländska förlusterna uppgick till 774 döda och 262 saknade; tyskarna förlorade omkring 1 000 döda och omkring 1 300 saknade eller tillfångatagna.
