Lapland War: Lapplandskriget
A war between Finland and Germany in northern Finland, fought because the Moscow Armistice required Finland to drive out the German troops still in the country. The Germans withdrew to Norway, burning much of Lapland as they went, and the last of them left Finnish soil in April 1945.: Ett krig mellan Finland och Tyskland i norra Finland, som utkämpades eftersom vapenstilleståndet i Moskva krävde att Finland drev ut de tyska trupper som fortfarande fanns i landet. Tyskarna drog sig tillbaka till Norge och brände stora delar av Lappland på vägen, och de sista av dem lämnade finsk mark i april 1945.
