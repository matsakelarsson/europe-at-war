Finnish troops failed to dislodge a German division from its fortified positions south of Ivalo. The Germans then withdrew north into Norway, leaving north-eastern Lapland by 25 November.: Finländska trupper misslyckades med att driva en tysk division ur dess befästa ställningar söder om Ivalo. Tyskarna drog sig sedan norrut in i Norge och lämnade nordöstra Lappland den 25 november.
