# Svenska översättningar av katalogtexten (våg 13); stegtexterna kommer senare.
Lat Dior’s wars: Lat Diors krig
? The 25-year struggle of Lat Dior Ngoné Latyr Diop, damel (king) of the Wolof kingdom of Cayor between Saint-Louis and Dakar, to keep his throne and his country’s independence against France and its candidates for the throne. Lat Dior took power in the civil wars that followed the death of Damel Birima in 1859, when France was pushing for a telegraph line and then a road across Cayor. He destroyed a French column at Ngolgol in December 1863 but was beaten at Loro in January 1864 and driven out, and France annexed Cayor in 1865. In exile he joined Maba Diakhou Bâ, converted to Islam and became his general; back in Cayor, he and Shaikh Amadou Ba beat the French at Mékhé in 1869, and France recognised him as damel in 1871. For a decade he was France’s ally, and with French artillery he crushed Amadou Ba at Samba Sadio in 1875. He broke with France over the Dakar–Saint-Louis railway, which he had accepted in 1879 and then saw as the end of Cayor’s independence; deposed at the turn of 1883, he fought a guerrilla war while the railway was built. He was killed in battle at Dekhelé in October 1886, and Cayor was divided into French-ruled provinces. Senegal remembers him as a national hero of the resistance to colonial rule.
: Den 25 år långa kamp som Lat Dior Ngoné Latyr Diop, damel (kung) av wolofriket Cayor mellan Saint-Louis och Dakar, förde för att behålla sin tron och sitt lands självständighet mot Frankrike och dess tronkandidater. Lat Dior tog makten under de inbördeskrig som följde efter damel Birimas död 1859, då Frankrike drev på för en telegraflinje och sedan en väg genom Cayor. Han förintade en fransk kolonn vid Ngolgol i december 1863 men besegrades vid Loro i januari 1864 och fördrevs, och Frankrike annekterade Cayor 1865. I landsflykten anslöt han sig till Maba Diakhou Bâ, konverterade till islam och blev hans general; tillbaka i Cayor besegrade han och shejk Amadou Ba fransmännen vid Mékhé 1869, och Frankrike erkände honom som damel 1871. Under ett decennium var han Frankrikes bundsförvant, och med franskt artilleri krossade han Amadou Ba vid Samba Sadio 1875. Han bröt med Frankrike över järnvägen Dakar–Saint-Louis, som han hade godtagit 1879 men sedan kom att se som slutet på Cayors självständighet; avsatt kring årsskiftet till 1883 förde han ett gerillakrig medan järnvägen byggdes. Han stupade i strid vid Dekhelé i oktober 1886, och Cayor delades upp i provinser under franskt styre. Senegal minns honom som en nationalhjälte i motståndet mot kolonialstyret.
