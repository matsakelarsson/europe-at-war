# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
Late Ming peasant rebellions: Bondeupproren under sena Ming
? "The risings of famine victims, deserters and unpaid soldiers that began in Shaanxi in 1627–1628 and, over sixteen years, overthrew the Ming dynasty. Bands under leaders such as Wang Jiayin, Gao Yingxiang, Li Zicheng and Zhang Xianzhong roamed across northern and central China, surrendering when cornered and rising again, while the Ming armies were stretched between them and the Later Jin (Qing) in Liaodong. In 1635 they burned the Ming ancestral city of Fengyang; in 1636 Gao Yingxiang was captured and executed, and by 1638 the rebels seemed beaten. Famine in Henan and the Qing raids in the north revived them: Li Zicheng took Luoyang in 1641, Zhang Xianzhong Xiangyang the same year, and the siege of Kaifeng ended in October 1642 with a flood from the broken Yellow River dykes that killed most of the city’s people. In 1643 Li took Xiangyang and Xi’an, and Zhang Wuchang and Changsha. Li proclaimed the Shun dynasty at Xi’an in February 1644 and took Beijing on 24–25 April, when the Chongzhen Emperor hanged himself; Zhang founded the Great Xi in Chengdu later that year. Within weeks Li was defeated at Shanhai Pass by the Ming general Wu Sangui and the Qing, who took the empire for themselves."
: "De resningar bland svältoffer, desertörer och obetalda soldater som började i Shaanxi 1627–1628 och som på sexton år störtade Mingdynastin. Skaror under ledare som Wang Jiayin, Gao Yingxiang, Li Zicheng och Zhang Xianzhong drog omkring i norra och mellersta Kina, kapitulerade när de var trängda och reste sig igen, medan Mingarméerna var utspridda mellan dem och Senare Jin (Qing) i Liaodong. År 1635 brände de Mingdynastins fädernestad Fengyang; 1636 tillfångatogs och avrättades Gao Yingxiang, och 1638 tycktes rebellerna slagna. Hungersnöd i Henan och Qings räder i norr gav dem ny kraft: Li Zicheng intog Luoyang 1641, Zhang Xianzhong Xiangyang samma år, och belägringen av Kaifeng slutade i oktober 1642 med en översvämning från Gula flodens genombrutna vallar som dödade de flesta av stadens invånare. År 1643 intog Li Xiangyang och Xi’an, och Zhang Wuchang och Changsha. Li utropade Shundynastin i Xi’an i februari 1644 och intog Peking den 24–25 april, då Chongzhenkejsaren hängde sig; Zhang grundade Stora Xi i Chengdu senare samma år. Inom några veckor besegrades Li vid Shanhaipasset av Minggeneralen Wu Sangui och Qing, som tog riket för egen del."
