# Svenska översättningar av katalogtexten (våg 10); stegtexterna kommer senare.
Peasant rebellions of late Silla: Bondeupproren i det sena Silla
? The wave of risings that broke Silla’s hold on its provinces under Queen Jinseong. After a drought in 888 the provinces stopped sending their taxes, and in 889 the court, its storehouses empty, sent officials to press for payment. Revolts broke out across the country. The first recorded was that of Wonjong and Aeno, who held the fortress of Sabeol-ju (today’s Sangju) in 889; the official sent against them, the naema Yeonggi, did not dare to attack, and the village head U-ryeon was killed fighting them. The queen had Yeonggi executed and gave U-ryeon’s son, about ten years old, his father’s post; what became of the rebels is not recorded. About 891 Gi Hwon rose at Jukju (Juksan) and Yanggil at Bugwon (Wonju); Gung Ye served first Gi Hwon, then Yanggil. In 892 the Silla officer Gyeon Hwon seized Mujinju (Gwangju) in the south-west. In 896 a band known for its red trousers, the Jeokgojeok (“Red Trousers”), plundered the counties south-west of the capital and reached Moryang-ri, on the western edge of Geumseong (Gyeongju) itself. By then Silla controlled little beyond the area around its capital, and the local strongmen who had risen during these years founded the kingdoms of the Later Three Kingdoms period.
: Den våg av resningar som bröt Sillas grepp om provinserna under drottning Jinseong. Efter en torka 888 slutade provinserna att sända in sina skatter, och 889 sände hovet, vars förrådshus stod tomma, ut ämbetsmän för att driva in betalningen. Revolter bröt ut över hela landet. Den första som finns omtalad var Wonjongs och Aenos, som höll fästningen Sabeol-ju (dagens Sangju) 889; ämbetsmannen som sändes mot dem, naema Yeonggi, vågade inte anfalla, och byhövdingen U-ryeon dödades i strid mot dem. Drottningen lät avrätta Yeonggi och gav U-ryeons son, omkring tio år gammal, faderns ämbete; vad som hände med rebellerna finns inte nedtecknat. Omkring 891 reste sig Gi Hwon i Jukju (Juksan) och Yanggil i Bugwon (Wonju); Gung Ye tjänade först Gi Hwon, därefter Yanggil. År 892 intog Sillaofficeren Gyeon Hwon Mujinju (Gwangju) i sydväst. År 896 plundrade ett band som var känt för sina röda byxor, Jeokgojeok (”de röda byxorna”), distrikten sydväst om huvudstaden och nådde Moryang-ri, i själva Geumseongs (Gyeongjus) västra utkant. Vid det laget kontrollerade Silla inte mycket mer än området kring huvudstaden, och de lokala stormän som hade rest sig under dessa år grundade rikena under De senare tre kungarikenas tid.
