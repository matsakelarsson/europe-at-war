# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
Later Jin conquest of Chahar: Senare Jins erövring av Chahar
The wars in which Ligdan Khan of the Chahar, the last Mongol great khan of the line of Kublai and Dayan Khan, lost the southern Mongols to Hong Taiji’s Later Jin. Ligdan, khan from 1604, tried to rule the other Mongol tümens directly and took Ming silver to fight the Jurchens; instead the Khorchin, the Kharachin, the Tümed and others allied with the Later Jin. In 1627–1628 he moved his people west from the Shira Muren to Köke Khota (Hohhot) and fought a coalition of the western tümens there, and in 1628 Hong Taiji made his first campaign against him. In 1632 Hong Taiji and his Mongol allies marched west; Ligdan fled across the Yellow River without fighting, and in 1634 he died of smallpox on his way to Kokonor. In 1635 a Later Jin army under Dorgon received the surrender of his son Ejei and a seal said to be that of the Yuan emperors. Hong Taiji, acknowledged as khan by the southern Mongol princes, proclaimed the Qing dynasty in 1636.: De krig där chaharernas Ligdan khan, den siste mongoliske storkhanen av Khubilais och Dayan khans ätt, förlorade sydmongolerna till Hong Taijis Senare Jin. Ligdan, khan från 1604, försökte styra de andra mongoliska tümenerna direkt och tog emot Mingsilver för att bekämpa jurchenerna; i stället slöt sig khorchin, kharachin, tümed och andra till Senare Jin. Åren 1627–1628 flyttade han sitt folk västerut från Shira Muren till Köke Khota (Hohhot) och bekämpade där en koalition av de västra tümenerna, och 1628 gjorde Hong Taiji sitt första fälttåg mot honom. År 1632 tågade Hong Taiji och hans mongoliska allierade västerut; Ligdan flydde över Gula floden utan strid, och 1634 dog han i smittkoppor på väg till Kokonor. År 1635 tog en armé från Senare Jin under Dorgon emot kapitulationen av hans son Ejei och ett sigill som sades ha tillhört Yuankejsarna. Hong Taiji, som erkändes som khan av de sydmongoliska furstarna, utropade Qingdynastin 1636.
