# Svenska översättningar av katalogtexten (våg 10); stegtexterna kommer senare.
Later Jin invasion of Joseon: Senare Jins invasion av Joseon
The first Manchu invasion of Korea, called Jeongmyo Horan in Korean after the year 1627 in the sixty-year cycle. Hong Taiji, the new khan of the Later Jin, wanted to secure his rear before fighting the Ming, to stop Korean support for the Ming general Mao Wenlong, who raided Liaodong from Ka Island off the Korean coast, and to obtain grain and trade for his people. At the end of February 1627 about 30,000 men under his cousin Amin crossed the Yalu, guided by the Korean general Gang Hong-rip, who had surrendered at Sarhu in 1619, and by fugitives from Yi Gwal’s rebellion. They took Uiju, Anju and Pyongyang within two weeks, and King Injo fled to Ganghwa Island. With militias active behind his lines and the war with the Ming in mind, Amin made peace at Ganghwa on 18 April 1627. Joseon and the Later Jin became “elder and younger brothers”, Korea opened border markets and sent tribute, but kept its ties with the Ming, which led to the second invasion of 1636.: Den första manchuiska invasionen av Korea, på koreanska kallad Jeongmyo Horan efter året 1627 i sextioårscykeln. Hong Taiji, Senare Jins nye khan, ville säkra ryggen innan han gick till strid mot Mingriket, stoppa det koreanska stödet till Minggeneralen Mao Wenlong, som gjorde räder i Liaodong från ön Ka utanför den koreanska kusten, och skaffa spannmål och handel åt sitt folk. I slutet av februari 1627 gick omkring 30 000 man under hans kusin Amin över Yalu, vägledda av den koreanske generalen Gang Hong-rip, som hade kapitulerat vid Sarhu 1619, och av flyktingar från Yi Gwals uppror. De intog Uiju, Anju och Pyongyang inom två veckor, och kung Injo flydde till ön Ganghwa. Med miliser verksamma bakom sina linjer och kriget mot Mingriket i tankarna slöt Amin fred på Ganghwa den 18 april 1627. Joseon och Senare Jin blev ”äldre och yngre bröder”, och Korea öppnade gränsmarknader och sände tribut men behöll sina band till Mingriket, vilket ledde till den andra invasionen 1636.
