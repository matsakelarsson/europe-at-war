# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
Later Tang conquest of Former Shu: Senare Tangs erövring av Tidigare Shu
? "The campaign in which the Later Tang, newly master of northern China, conquered the Former Shu kingdom in Sichuan in little more than two months at the end of 925. Li Cunxu (Emperor Zhuangzong) gave the nominal command to his son Li Jiji and the real command to his chief of staff Guo Chongtao. The Shu emperor Wang Yan, son of the founder Wang Jian, had paid little heed to the threat and was touring his realm when the invasion came. The Later Tang army marched south from Fengxiang over the Qinling, defeated the Shu forces sent against it and took the passes and the frontier towns as their garrisons surrendered. In Chengdu the general Wang Zongbi, Wang Yan’s adoptive brother, seized the palace and the treasury and surrendered the realm, and Wang Yan submitted in December 925. Shu, with its large population and wealth, became part of the Later Tang. The victory brought little lasting gain: in 926 the emperor had Guo Chongtao and Wang Yan’s family killed, risings spread through the army, and Li Cunxu himself was killed in Luoyang. Sichuan broke away again under Meng Zhixiang, who founded the Later Shu in 934."
: "Det fälttåg under vilket Senare Tang, nybliven herre över norra Kina, i slutet av 925 erövrade kungariket Tidigare Shu i Sichuan på drygt två månader. Li Cunxu (kejsar Zhuangzong) gav det nominella befälet åt sin son Li Jiji och det verkliga befälet åt sin stabschef Guo Chongtao. Shukejsaren Wang Yan, son till grundaren Wang Jian, hade inte tagit hotet på något större allvar och var ute på en rundresa i sitt rike när invasionen kom. Senare Tangs armé tågade söderut från Fengxiang över Qinlingbergen, besegrade de Shustyrkor som sändes mot den och intog passen och gränsstäderna allteftersom deras garnisoner kapitulerade. I Chengdu bemäktigade sig fältherren Wang Zongbi, Wang Yans adoptivbror, palatset och skattkammaren och överlämnade riket, och Wang Yan underkastade sig i december 925. Shu, med sin stora befolkning och sin rikedom, blev en del av Senare Tang. Segern gav föga varaktig vinst: 926 lät kejsaren döda Guo Chongtao och Wang Yans familj, uppror spred sig i armén, och Li Cunxu själv dödades i Luoyang. Sichuan bröt sig loss igen under Meng Zhixiang, som grundade Senare Shu 934."
