# Svenska översättningar av katalogtexten (våg 10); stegtexterna kommer senare.
Wars of the Later Three Kingdoms: De senare tre kungarikenas krig
? The wars in which Silla broke apart and Korea was reunited under Goryeo. As Silla’s authority collapsed in the late 880s, local strongmen took over the provinces. Gyeon Hwon, a Silla officer, seized the south-west in 892 and proclaimed the kingdom of Baekje (Later Baekje) at Jeonju in 900; Gung Ye, a former monk, built up a state in the centre and north and proclaimed himself king in 901, naming it Goryeo, then Majin and Taebong. Silla was left with the south-east around its capital, Gyeongju. In 918 Gung Ye’s generals overthrew him and made Wang Geon king of a new Goryeo. Later Baekje held the upper hand in the 920s, sacking Gyeongju in 927 and routing Wang Geon at Gongsan, but Goryeo’s victory at Gochang in 930 brought the east coast over to it. In 935 Gyeon Hwon was deposed by his son Singeom and fled to Goryeo, and the last Silla king, Gyeongsun, handed his kingdom over to Wang Geon. In 936 Goryeo destroyed the Later Baekje army at Illicheon, near today’s Gumi, and Singeom surrendered, leaving Goryeo the master of the peninsula south of the Taedong River.
: Krigen där Silla föll sönder och Korea återförenades under Goryeo. När Sillas auktoritet bröt samman i slutet av 880-talet tog lokala stormän över provinserna. Gyeon Hwon, en officer i Sillas tjänst, tog makten i sydväst 892 och utropade riket Baekje (Senare Baekje) i Jeonju år 900; Gung Ye, en före detta munk, byggde upp en stat i mitten och norr och utropade sig till kung 901, och han kallade den Goryeo, sedan Majin och Taebong. Silla hade kvar sydöst kring huvudstaden Gyeongju. År 918 störtade Gung Yes generaler honom och gjorde Wang Geon till kung över ett nytt Goryeo. Senare Baekje hade övertaget på 920-talet, plundrade Gyeongju 927 och krossade Wang Geon vid Gongsan, men Goryeos seger vid Gochang 930 förde över östkusten till dess sida. År 935 avsattes Gyeon Hwon av sin son Singeom och flydde till Goryeo, och den siste Sillakungen, Gyeongsun, överlämnade sitt rike till Wang Geon. År 936 förintade Goryeo Senare Baekjes armé vid Illicheon, nära dagens Gumi, och Singeom kapitulerade, vilket gjorde Goryeo till herre över halvön söder om Taedongfloden.
