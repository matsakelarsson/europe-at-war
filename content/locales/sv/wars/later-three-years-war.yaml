# Svenska översättningar av katalogtexten (våg 10); stegtexterna kommer senare.
Later Three Years’ War: Senare treårskriget
? A succession war within the Kiyohara, the family that had ruled northern Mutsu and Dewa since the Former Nine Years’ War, in which the governor of Mutsu, Minamoto no Yoshiie, took sides and Fujiwara no Kiyohira emerged as master of the north. When Yoshiie arrived as governor in 1083 the Kiyohara chief Sanehira was fighting his half-brother Iehira and his step-brother Kiyohira. Sanehira died suddenly on campaign, and Yoshiie divided his six districts between the two brothers; in 1086 Iehira burned Kiyohira’s house and killed his wife and children, and Yoshiie took up Kiyohira’s cause. Yoshiie failed against Iehira at the fort of Numa in the winter of 1086, and in 1087 besieged Iehira and his uncle Takehira in the fort of Kanazawa in Dewa. After a siege through the autumn, in which women and children who came out were killed so that the defenders’ food would run out faster, the starving garrison set fire to the fort and fled on 11 December 1087; Takehira was captured and beheaded and Iehira was killed in flight. The court refused to treat the war as a public campaign, gave Yoshiie no reward and dismissed him, but his generosity to his eastern warriors from his own purse built the loyalty on which his descendant Yoritomo would draw. Kiyohira took his father’s name of Fujiwara and founded the Northern Fujiwara of Hiraizumi.
: Ett arvsföljdskrig inom Kiyoharaklanen, som hade styrt norra Mutsu och Dewa sedan det tidigare nioårskriget, där guvernören i Mutsu, Minamoto no Yoshiie, tog ställning för en av parterna och Fujiwara no Kiyohira framträdde som herre över norr. När Yoshiie anlände som guvernör 1083 låg Kiyoharaklanens hövding Sanehira i strid med sin halvbror Iehira och sin styvbror Kiyohira. Sanehira dog plötsligt under ett fälttåg, och Yoshiie delade hans sex distrikt mellan de två bröderna; 1086 brände Iehira Kiyohiras hus och dödade hans hustru och barn, och Yoshiie tog sig an Kiyohiras sak. Yoshiie misslyckades mot Iehira vid fästet Numa vintern 1086 och belägrade 1087 Iehira och hans farbror Takehira i fästet Kanazawa i Dewa. Efter en belägring som varade hela hösten, då kvinnor och barn som kom ut dödades för att försvararnas mat skulle ta slut fortare, satte den svältande garnisonen eld på fästet och flydde den 11 december 1087; Takehira tillfångatogs och halshöggs och Iehira dödades under flykten. Hovet vägrade att behandla kriget som ett offentligt fälttåg, gav Yoshiie ingen belöning och avsatte honom, men hans generositet ur egen ficka mot sina krigare i öster byggde upp den lojalitet som hans ättling Yoritomo senare skulle dra nytta av. Kiyohira tog sin fars namn Fujiwara och grundade Norra Fujiwara i Hiraizumi.
