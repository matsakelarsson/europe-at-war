# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
Later Zhou campaigns against Southern Tang and Liao: Senare Zhous fälttåg mot Södra Tang och Liao
? The wars of Chai Rong (Emperor Shizong of Later Zhou), the strongest ruler of the Five Dynasties, which set the stage for the Song reunification of China. Having beaten the Northern Han and the Liao at Gaoping in 954 and taken four prefectures from Later Shu in 955, he turned on the Southern Tang, the largest southern state, in early 956. His armies crossed the Huai on a pontoon bridge, crushed the Tang relief army at Zhengyang, and took Chuzhou and Yangzhou, with Zhao Kuangyin, the future founder of the Song, among the leading generals; Wuyue joined in from the south-east. The fortress of Shouzhou on the Huai held out for fourteen months until April 957, after the Tang relief army was destroyed at Purple Mountain. In 958 the Southern Tang ruler Li Jing ceded all his land north of the Yangtze, some quarter of a million households, gave up the title of emperor and became the vassal King of Jiangnan. In 959 Chai Rong marched north against the Liao and took the prefectures of Ning, Mo and Ying and the frontier passes south of Youzhou, but he fell ill before reaching the city and died on 27 July 959. Six months later Zhao Kuangyin took the throne.
: De krig som Chai Rong (kejsar Shizong av Senare Zhou), den mäktigaste härskaren under De fem dynastierna, förde och som banade väg för Songdynastins återförening av Kina. Sedan han 954 hade slagit Norra Han och Liao vid Gaoping och 955 tagit fyra prefekturer från Senare Shu vände han sig i början av 956 mot Södra Tang, den största av de sydliga staterna. Hans arméer gick över Huai på en pontonbro, krossade Tangs undsättningsarmé vid Zhengyang och intog Chuzhou och Yangzhou, med Zhao Kuangyin, Songdynastins blivande grundare, bland de främsta fältherrarna; Wuyue anslöt sig från sydöst. Fästningen Shouzhou vid Huai höll stånd i fjorton månader, fram till april 957, då Tangs undsättningsarmé hade förintats vid Purpurberget. År 958 avträdde Södra Tangs härskare Li Jing allt sitt land norr om Yangtze, omkring en kvarts miljon hushåll, avsade sig kejsartiteln och blev vasall som kung av Jiangnan. År 959 tågade Chai Rong norrut mot Liao och intog prefekturerna Ning, Mo och Ying och gränspassen söder om Youzhou, men han insjuknade innan han nådde staden och dog den 27 juli 959. Sex månader senare besteg Zhao Kuangyin tronen.
