Latvian War of Independence: Lettiska frihetskriget
A war for the new Republic of Latvia, proclaimed in November 1918, against Soviet Russia and its Latvian Soviet Republic and against German Freikorps, the Baltic German Landeswehr and the Bermontians, who sought to keep the country under German control. With Estonian, Polish and British help, Latvia drove out its enemies by early 1920, and Soviet Russia recognised its independence in the Treaty of Riga of 11 August 1920.: Ett krig för den nya republiken Lettland, utropad i november 1918, mot Sovjetryssland och dess lettiska sovjetrepublik samt mot tyska frikårer, den balttyska Landeswehr och bermontianerna, som ville hålla landet under tysk kontroll. Med estnisk, polsk och brittisk hjälp drev Lettland ut sina fiender i början av 1920, och Sovjetryssland erkände landets självständighet i freden i Riga den 11 augusti 1920.
