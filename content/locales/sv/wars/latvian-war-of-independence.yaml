Also called Latvia’s freedom battles (brīvības cīņas). Dates are New Style.: Kallas också Lettlands frihetsstrider (brīvības cīņas). Datum anges enligt nya stilen.
The Landeswehr fought the Red Army alongside the Latvians in early 1919 and fought them at Cēsis in June; from July 1919 it served under Latvian command.: Landeswehr kämpade mot Röda armén sida vid sida med letterna i början av 1919 och mot letterna vid Cēsis i juni; från juli 1919 stod den under lettiskt befäl.
The taking of Daugavpils in January 1920 was also part of the Polish–Soviet War, which has its own entry. Front lines are approximate.: Erövringen av Daugavpils i januari 1920 ingick också i polsk-sovjetiska kriget, som har en egen post. Frontlinjerna är ungefärliga.
