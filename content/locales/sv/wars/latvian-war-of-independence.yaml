The Red Army still held Latgale, Latvia’s eastern province. In January 1920 Latvian troops and Polish forces under Edward Rydz-Śmigły attacked together, crossing the frozen Daugava, and Daugavpils fell on 3 January. Poland handed the town to Latvia. By the end of January the Latvians had cleared the rest of Latgale, and on 1 February a ceasefire with Soviet Russia came into force. Latvia and Lithuania, meanwhile, disputed the border between them, which a British arbitrator settled in 1921.: Röda armén höll fortfarande Lettgallen, Lettlands östra provins. I januari 1920 gick lettiska trupper och polska styrkor under Edward Rydz-Śmigły till gemensamt anfall över den frusna Daugava, och Daugavpils föll den 3 januari. Polen överlämnade staden till Lettland. I slutet av januari hade letterna rensat resten av Lettgallen, och den 1 februari trädde ett eldupphör med Sovjetryssland i kraft. Lettland och Litauen tvistade under tiden om gränsen mellan sig, som en brittisk skiljedomare avgjorde 1921.
Peace talks began in April, and on 11 August 1920, as the Red Army was advancing on Warsaw, Soviet Russia and Latvia signed the Treaty of Riga. Soviet Russia recognised Latvia’s independence and renounced all claims to its territory for ever, and Latvia received the Abrene district around Pytalovo, formerly part of Pskov province. About 3,000 Latvian soldiers had been killed in the war. As in Estonia, a land reform broke up the large estates, most of them owned by Baltic German nobles, and gave the land to soldiers and landless peasants.: Fredsförhandlingarna inleddes i april, och den 11 augusti 1920, medan Röda armén ryckte fram mot Warszawa, undertecknade Sovjetryssland och Lettland freden i Riga. Sovjetryssland erkände Lettlands självständighet och avsade sig för all framtid alla anspråk på dess territorium, och Lettland fick distriktet Abrene kring Pytalovo, som tidigare hört till guvernementet Pskov. Omkring 3 000 lettiska soldater hade stupat i kriget. Liksom i Estland bröt en jordreform upp de stora godsen, de flesta ägda av balttyska adelsmän, och gav jorden till soldater och jordlösa bönder.
