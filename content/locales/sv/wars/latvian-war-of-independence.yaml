Latvia was proclaimed independent in Riga on 18 November 1918, with Kārlis Ulmanis as head of a provisional government, but it had almost no army. The Red Army, with the Latvian Riflemen at its core, invaded in December and took Riga on 3 January 1919. Pēteris Stučka’s Latvian Socialist Soviet Republic ruled most of the country through revolutionary tribunals, requisitions and terror, and Riga went hungry. Ulmanis’s government fell back to Liepāja, where the remaining German troops, the Baltic German volunteers of the Landeswehr and a small Latvian force held the line of the Venta.: Lettland utropades som självständigt i Riga den 18 november 1918, med Kārlis Ulmanis som chef för en provisorisk regering, men landet hade nästan ingen armé. Röda armén, med de lettiska skyttarna som kärna, invaderade i december och intog Riga den 3 januari 1919. Pēteris Stučkas lettiska socialistiska sovjetrepublik styrde större delen av landet med revolutionstribunaler, rekvisitioner och terror, och Riga led av hungersnöd. Ulmanis regering drog sig tillbaka till Liepāja, där de kvarvarande tyska trupperna, Landeswehrs balttyska frivilliga och en liten lettisk styrka höll linjen vid Venta.
In March the Germans under General Rüdiger von der Goltz and the Latvians counter-attacked. On 16 April Baltic Germans staged a coup in Liepāja and set up a puppet government under Andrievs Niedra, and Ulmanis’s ministers took refuge on the steamer Saratov under British protection. The Landeswehr and the Iron Division took Riga on 22 May and shot suspected Bolsheviks, then pushed north, where Estonian troops and the North Latvian Brigade beat them at Cēsis on 19–23 June. Under the armistice of 3 July the Germans were to leave Latvia, and Ulmanis returned to Riga on 8 July.: I mars gick tyskarna under general Rüdiger von der Goltz och letterna till motanfall. Den 16 april genomförde balttyskar en kupp i Liepāja och tillsatte en marionettregering under Andrievs Niedra, och Ulmanis ministrar sökte skydd på ångaren Saratov under brittiskt beskydd. Landeswehr och Järndivisionen intog Riga den 22 maj och sköt misstänkta bolsjeviker, och ryckte sedan fram norrut, där estniska trupper och Nordlettiska brigaden besegrade dem vid Cēsis den 19–23 juni. Enligt vapenstilleståndet den 3 juli skulle tyskarna lämna Lettland, och Ulmanis återvände till Riga den 8 juli.
