The German troops did not leave. Many joined the West Russian Volunteer Army of Pavel Bermondt-Avalov, some 30,000 men or more, most of them German Freikorps soldiers with Russian former prisoners of war. Nominally it was to fight the Bolsheviks for the Whites, but its aim was to keep the Baltic under German control. On 8 October 1919 it attacked Riga from Jelgava and took Pārdaugava, the part of the city on the left bank of the Daugava. The Latvian government left the city, but the army held the right bank and the bridges, helped by British and French warships at the river mouth.: De tyska trupperna lämnade inte landet. Många gick in i Pavel Bermondt-Avalovs västryska frivilligarmé, omkring 30 000 man eller fler, de flesta av dem soldater från tyska frikårer tillsammans med ryska före detta krigsfångar. Formellt skulle den bekämpa bolsjevikerna för de vitas räkning, men dess mål var att hålla Baltikum under tysk kontroll. Den 8 oktober 1919 angrep den Riga från Jelgava och intog Pārdaugava, den del av staden som ligger på Daugavas vänstra strand. Den lettiska regeringen lämnade staden, men armén höll den högra stranden och broarna, med hjälp av brittiska och franska krigsfartyg vid flodmynningen.
Estonian armoured trains came to help, and after a month of fighting the Latvians counter-attacked. On 11 November they drove the Bermontians out of Pārdaugava; the day is now Lāčplēsis Day, when Latvia remembers its soldiers. The Latvians pursued the Bermontians south and took Jelgava on 21 November, while Lithuanian troops beat them at Radviliškis on 21–22 November. By mid-December the last of Bermondt’s troops had withdrawn to Germany under Allied supervision.: Estniska pansartåg kom till undsättning, och efter en månads strider gick letterna till motanfall. Den 11 november drev de ut bermontianerna ur Pārdaugava; dagen är i dag Lāčplēsisdagen, då Lettland hedrar minnet av sina soldater. Letterna förföljde bermontianerna söderut och intog Jelgava den 21 november, medan litauiska trupper besegrade dem vid Radviliškis den 21–22 november. I mitten av december hade de sista av Bermondts trupper dragit sig tillbaka till Tyskland under allierad övervakning.
