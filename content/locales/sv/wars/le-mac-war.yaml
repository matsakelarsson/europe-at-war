# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
Lê–Mạc war: Kriget mellan Lê och Mạc
The civil war between the Mạc dynasty, founded when the general Mạc Đăng Dung took the throne of Đại Việt in 1527, and supporters of the Later Lê dynasty, a period Vietnamese historians call the Southern and Northern Dynasties. In 1533 the general Nguyễn Kim, from exile in Lan Xang, proclaimed a Lê prince emperor and won back Thanh Hóa and Nghệ An. The Mạc, who held the Red River delta and the capital Đông Kinh (Hanoi), bought off a Ming invasion in 1540–1541 by submitting to the Ming at the border. For half a century the two courts fought along the Mã River and on the coasts of Thanh Hóa, while real power on the Lê side passed after Nguyễn Kim’s death to his son-in-law Trịnh Kiểm and the Trịnh lords. In 1592 Trịnh Tùng took Đông Kinh and the Mạc ruler Mạc Mậu Hợp was captured and executed. Members of the Mạc family held out in Cao Bằng on the Chinese border, under Ming and then Qing protection, until 1677.: Inbördeskriget mellan Mạcdynastin, som grundades när generalen Mạc Đăng Dung tog Đại Việts tron 1527, och anhängarna av Senare Lêdynastin, en period som vietnamesiska historiker kallar de södra och norra dynastierna. År 1533 utropade generalen Nguyễn Kim från sin landsflykt i Lan Xang en Lêprins till kejsare och vann tillbaka Thanh Hóa och Nghệ An. Mạcdynastin, som behärskade Röda flodens delta och huvudstaden Đông Kinh (Hanoi), köpte sig fri från en Minginvasion 1540–1541 genom att underkasta sig Ming vid gränsen. I ett halvsekel stred de två hoven längs floden Mã och på Thanh Hóas kuster, medan den verkliga makten på Lêsidan efter Nguyễn Kims död övergick till hans svärson Trịnh Kiểm och Trịnhfurstarna. År 1592 intog Trịnh Tùng Đông Kinh, och Mạchärskaren Mạc Mậu Hợp tillfångatogs och avrättades. Medlemmar av släkten Mạc höll stånd i Cao Bằng vid den kinesiska gränsen, under Mings och sedan Qings beskydd, fram till 1677.
