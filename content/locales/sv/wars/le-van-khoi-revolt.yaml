# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
Lê Văn Khôi revolt: Lê Văn Khôis uppror
? A revolt in southern Vietnam against the emperor Minh Mạng. The south had been governed almost on its own by the general Lê Văn Duyệt, who had opposed Minh Mạng’s accession and protected Catholic missionaries and Chinese merchants. After Duyệt’s death in 1832 the court abolished his governorship of Gia Định and opened a case against him. On the night of 5 July 1833 his adopted son Lê Văn Khôi broke out of prison with his followers, killed the new governor and the court’s investigator, and seized the Phiên An citadel at Saigon; within a month the rebels held all six southern provinces. Khôi gave his support to the line of Gia Long’s eldest son, Prince Cảnh, promised to protect Christianity, and asked Siam for help, which led to the Siamese invasion of Cambodia and southern Vietnam in November 1833. Imperial armies under Trương Minh Giảng and others retook the provinces and besieged the citadel, where Khôi died of illness in 1834. The citadel was stormed on 8 September 1835. About 550 defenders were killed in the assault, and the prisoners were executed and buried in a mass grave known as Mả Ngụy, the rebels’ grave; estimates of the number buried there range from about 1,300 to 1,831. Khôi’s young son Lê Văn Cù, the French missionary Joseph Marchand and four leaders were taken to Huế and put to death by slow slicing; Marchand died on 30 November 1835. Minh Mạng had the citadel razed, Duyệt’s tomb desecrated, and stepped up the persecution of Catholics.
: Ett uppror i södra Vietnam mot kejsar Minh Mạng. Södern hade styrts nästan självständigt av generalen Lê Văn Duyệt, som hade motsatt sig Minh Mạngs tronbestigning och beskyddat katolska missionärer och kinesiska köpmän. Efter Duyệts död 1832 avskaffade hovet hans guvernörskap över Gia Định och inledde en rättsprocess mot honom. Natten den 5 juli 1833 bröt sig hans adoptivson Lê Văn Khôi ut ur fängelset med sina anhängare, dödade den nye guvernören och hovets utredare och tog Phiên An-citadellet i Saigon; inom en månad höll rebellerna alla sex sydliga provinser. Khôi ställde sig bakom ättelinjen efter Gia Longs äldste son, prins Cảnh, lovade att skydda kristendomen och bad Siam om hjälp, vilket ledde till den siamesiska invasionen av Kambodja och södra Vietnam i november 1833. Kejserliga arméer under bland andra Trương Minh Giảng återtog provinserna och belägrade citadellet, där Khôi dog av sjukdom 1834. Citadellet stormades den 8 september 1835. Omkring 550 försvarare dödades vid stormningen, och fångarna avrättades och begravdes i en massgrav som kallas Mả Ngụy, rebellernas grav; uppskattningarna av antalet begravda där varierar från omkring 1 300 till 1 831. Khôis unge son Lê Văn Cù, den franske missionären Joseph Marchand och fyra ledare fördes till Huế och avrättades genom långsam styckning; Marchand dog den 30 november 1835. Minh Mạng lät jämna citadellet med marken och skända Duyệts grav, och han skärpte förföljelsen av katoliker.
