# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
Li Jiqian’s revolt: Li Jiqians revolt
? The twenty-year struggle in which the Tangut chief Li Jiqian resisted the Song and laid the foundations of the Western Xia state. The Tangut Li family had ruled the Dingnan circuit around Xiazhou in the Ordos, on the north-western frontier, almost independently since the late Tang. In 982 its head, Li Jipeng, facing opposition among the Tangut elite, went to the Song court and handed over his lands. His kinsman Li Jiqian refused to submit and fled into the steppe with a band of followers. A Song attack on his camp in 984 captured his mother and wife, but in 985 he took Yinzhou and its stores, and his following grew. He paid tribute to the Liao from 986, married a Khitan princess in 989 and was named King of Xia by the Liao in 990, while making gestures of submission to the Song when it suited him. He defeated Li Jipeng, sent against him by the Song, in 994, and raided Lingzhou in 996 and 997. In 998 the new Song emperor Zhenzong recognised him as governor of Dingnan, but he soon began raiding again, and in 1002 took Lingzhou, the great Song stronghold on the Yellow River, which he made his capital as Xiping. He was wounded fighting the Tibetans of Liangzhou and died on 6 January 1004. His son Li Deming kept peace with the Song, and his grandson Li Yuanhao proclaimed the Western Xia empire in 1038.
: Den tjugoåriga kamp under vilken tangutledaren Li Jiqian gjorde motstånd mot Song och lade grunden till staten Västra Xia. Den tangutiska släkten Li hade sedan sena Tangtiden styrt Dingnankretsen kring Xiazhou i Ordos, vid den nordvästra gränsen, nästan självständigt. År 982 begav sig släktens överhuvud, Li Jipeng, som mötte motstånd inom den tangutiska eliten, till Songhovet och överlämnade sina länder. Hans släkting Li Jiqian vägrade underkasta sig och flydde ut på stäppen med en skara anhängare. Vid ett Songangrepp på hans läger 984 tillfångatogs hans mor och hustru, men 985 intog han Yinzhou och dess förråd, och hans anhängarskara växte. Han betalade tribut till Liao från 986, gifte sig med en khitansk prinsessa 989 och utnämndes av Liao till kung av Xia 990, samtidigt som han gjorde gester av underkastelse mot Song när det passade honom. Han besegrade 994 Li Jipeng, som Song hade sänt mot honom, och företog räder mot Lingzhou 996 och 997. År 998 erkände den nye Songkejsaren Zhenzong honom som guvernör i Dingnan, men han återupptog snart räderna och intog 1002 Lingzhou, Songrikets stora fäste vid Gula floden, som han gjorde till sin huvudstad under namnet Xiping. Han sårades i strid mot tibetanerna i Liangzhou och dog den 6 januari 1004. Hans son Li Deming höll fred med Song, och hans sonson Li Yuanhao utropade kejsardömet Västra Xia 1038.
