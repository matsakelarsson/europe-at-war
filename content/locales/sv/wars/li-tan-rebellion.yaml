# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
Li Tan’s rebellion: Li Tans uppror
? "A rising in Shandong against Kublai Khan while he was fighting his brother Ariq Böke for the throne. Li Tan, son of the Shandong warlord Li Quan, had governed Yidu (Qingzhou) for the Mongols for some thirty years as a hereditary lord, commanding the coast and the border with the Song; his father-in-law Wang Wentong was one of Kublai’s chief ministers. After recovering his son, who had been held at the Mongol court, Li Tan rose on 22 February 1262, killed the Mongol troops in his territory and handed Lianshui, Haizhou and Donghai on the Huai frontier to the Song, which made him a military governor. He then seized Jinan. Kublai sent Prince Qabichi and the Chinese generals Shi Tianze, Shi Shu and Zhang Hongfan against him; Song relief troops turned back, though the Song general Xia Gui took a number of towns along the border. From about May Jinan was ringed with walls and ditches and starved. When it fell in early August, Li Tan tried to drown himself in Daming Lake, was pulled out and was executed on 6 August 1262, beheaded according to most accounts or trampled by horses according to others. Wang Wentong was executed for corresponding with him. The revolt left Kublai distrustful of the Chinese lords of the north: he separated civil from military authority, ended many of their hereditary commands and relied more on Mongol and Central Asian officials."
: "En resning i Shandong mot Khubilai khan medan han kämpade mot sin bror Ariq Böke om tronen. Li Tan, son till Shandongkrigsherren Li Quan, hade styrt Yidu (Qingzhou) åt mongolerna i omkring trettio år som ärftlig herre och behärskade kusten och gränsen mot Song; hans svärfar Wang Wentong var en av Khubilais främsta ministrar. Sedan Li Tan hade fått tillbaka sin son, som hade hållits vid det mongoliska hovet, reste han sig den 22 februari 1262, dödade de mongoliska trupperna i sitt område och överlämnade Lianshui, Haizhou och Donghai vid Huaigränsen till Song, som gjorde honom till militärguvernör. Därefter bemäktigade han sig Jinan. Khubilai sände prins Qabichi och de kinesiska fältherrarna Shi Tianze, Shi Shu och Zhang Hongfan mot honom; Songrikets undsättningstrupper vände om, även om Songfältherren Xia Gui intog ett antal städer längs gränsen. Från omkring maj omringades Jinan med murar och vallgravar och svältes ut. När staden föll i början av augusti försökte Li Tan dränka sig i Damingsjön, men han drogs upp och avrättades den 6 augusti 1262, enligt de flesta uppgifter genom halshuggning, enligt andra genom att trampas ihjäl av hästar. Wang Wentong avrättades för att ha brevväxlat med honom. Revolten gjorde Khubilai misstrogen mot de kinesiska herrarna i norr: han skilde den civila makten från den militära, avskaffade många av deras ärftliga befäl och förlitade sig mer på mongoliska och centralasiatiska ämbetsmän."
