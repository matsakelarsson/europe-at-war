# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
Later Liang–Jin war: Kriget mellan Senare Liang och Jin
The sixteen-year war for northern China between the Later Liang, founded in 907 by Zhu Wen when he deposed the last Tang emperor, and the Jin state of the Shatuo Turk Li Keyong and his son Li Cunxu in Shanxi, which refused to recognise him. Jin held out at the siege of Luzhou (907–908), and Li Cunxu, who succeeded his father in 908, relieved the city in a surprise attack. With the Hebei governors of Zhao and Yiwu as allies, he crushed the Liang army at Baixiang in 911, conquered the Yan state of Liu Shouguang at Youzhou (Beijing) in 913, and in 915 won the great Weibo circuit when its army rose against Liang. Years of fighting along the Yellow River followed, including the costly battle of Huliupo (918–919). In 923 Li Cunxu proclaimed himself emperor of a restored Tang (the Later Tang), sent Li Siyuan behind the Liang lines to take Yunzhou, and marched on the undefended Liang capital Daliang (Kaifeng), where the last Liang emperor had himself killed on 18 November 923.: Det sexton år långa kriget om norra Kina mellan Senare Liang, som grundades 907 av Zhu Wen när han avsatte den siste Tangkejsaren, och shatuoturken Li Keyongs och hans son Li Cunxus stat Jin i Shanxi, som vägrade erkänna honom. Jin höll stånd under belägringen av Luzhou (907–908), och Li Cunxu, som efterträdde sin far 908, undsatte staden med ett överraskningsanfall. Med Hebeiguvernörerna i Zhao och Yiwu som bundsförvanter krossade han Liangarmén vid Baixiang 911, erövrade Liu Shouguangs stat Yan vid Youzhou (Peking) 913 och vann 915 den stora Weibokretsen när dess armé reste sig mot Liang. Därpå följde år av strider längs Gula floden, bland dem det kostsamma slaget vid Huliupo (918–919). År 923 utropade sig Li Cunxu till kejsare av ett återupprättat Tang (Senare Tang), sände Li Siyuan bakom Liangs linjer för att inta Yunzhou och tågade mot Liangs oförsvarade huvudstad Daliang (Kaifeng), där den siste Liangkejsaren lät döda sig den 18 november 923.
