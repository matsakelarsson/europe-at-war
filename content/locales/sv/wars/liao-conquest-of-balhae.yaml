Liao conquest of Balhae: Liaodynastins erövring av Balhae
The Khitan campaign that destroyed Balhae (Bohai, Parhae), the kingdom that had ruled Manchuria, the Russian Far East and north-eastern Korea since about 698. The Khitan ruler Abaoji (Emperor Taizu of Liao) had fought Balhae over the Liao River valley since the 900s. At the end of 925 he marched east with his sons Yelü Bei and Yelü Deguang. In February 926 his army took the western stronghold of Fuyu after a three-day siege, defeated the Balhae army and besieged the capital Huhan (the Upper Capital, near today’s Ning’an), whose king Da Yinzhuan surrendered after three days. Abaoji turned Balhae into a client kingdom, Dongdan (“Eastern Dan”), under Yelü Bei, and died at Fuyu on his way home on 6 September 926. Risings followed in the conquered lands. In 929 the Liao moved Dongdan’s capital and much of its people west to Liaoyang, and the kingdom was absorbed into the Liao in the 930s. Tens of thousands of Balhae families fled to Goryeo, among them the last crown prince.: Det khitanska fälttåg som förintade Balhae (Bohai, Parhae), det kungarike som sedan omkring 698 hade härskat över Manchuriet, ryska Fjärran östern och nordöstra Korea. Khitanernas härskare Abaoji (kejsar Taizu av Liao) hade sedan början av 900-talet kämpat mot Balhae om Liaoflodens dal. I slutet av 925 tågade han österut med sina söner Yelü Bei och Yelü Deguang. I februari 926 intog hans armé det västra fästet Fuyu efter tre dagars belägring, besegrade Balhaes armé och belägrade huvudstaden Huhan (Övre huvudstaden, nära dagens Ning’an), vars kung Da Yinzhuan kapitulerade efter tre dagar. Abaoji gjorde Balhae till ett klientkungarike, Dongdan (”Östra Dan”), under Yelü Bei, och dog i Fuyu på hemvägen den 6 september 926. Uppror följde i de erövrade områdena. År 929 flyttade Liao Dongdans huvudstad och en stor del av dess folk västerut till Liaoyang, och kungariket uppgick i Liao på 930-talet. Tiotusentals familjer från Balhae flydde till Goryeo, bland dem den siste kronprinsen.
