# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
Liao–Later Jin war: Kriget mellan Liao och Senare Jin
? The war in which the Khitan Liao empire destroyed the Later Jin, the dynasty it had put on the throne of northern China in 936. Shi Jingtang’s nephew and successor Shi Chonggui, urged on by his minister Jing Yanguang, refused to call himself the Liao emperor’s subject, arrested the Liao trade envoy and killed Khitan merchants. The Liao emperor Yelü Deguang (Taizong) invaded in 944 and again in the winter of 944–945, reaching the Yellow River, but his armies were held at Majiakou and Qicheng and in 945 were routed at Yangcheng, where the emperor is said to have escaped on a camel. In 946 the Jin court sent almost its whole army north under Du Chongwei to retake the Sixteen Prefectures; surrounded by Deguang on the Hutuo River, Du surrendered it in the hope of being made emperor himself. Deguang entered the undefended capital Daliang (Kaifeng) early in 947, sent Shi Chonggui into exile and ruled as emperor of China, but the plundering of his troops set off risings everywhere. Liu Zhiyuan, governor at Taiyuan, proclaimed himself emperor (the Later Han), and Deguang withdrew north and died on the way, on 18 May 947.
: Det krig i vilket khitanernas Liaorike förintade Senare Jin, den dynasti som det hade satt på norra Kinas tron 936. Shi Jingtangs brorson och efterträdare Shi Chonggui, påhejad av sin minister Jing Yanguang, vägrade kalla sig Liaokejsarens undersåte, lät gripa Liaos handelssändebud och dödade khitanska köpmän. Liaokejsaren Yelü Deguang (Taizong) invaderade 944 och på nytt vintern 944–945 och nådde Gula floden, men hans arméer hejdades vid Majiakou och Qicheng och slogs 945 på flykten vid Yangcheng, där kejsaren enligt uppgift räddade sig på en kamel. År 946 sände Jinhovet nästan hela sin armé norrut under Du Chongwei för att återta de sexton prefekturerna; omringad av Deguang vid floden Hutuo kapitulerade Du med armén i hopp om att själv bli kejsare. Deguang tågade i början av 947 in i den oförsvarade huvudstaden Daliang (Kaifeng), sände Shi Chonggui i landsflykt och härskade som Kinas kejsare, men hans truppers plundring utlöste resningar överallt. Liu Zhiyuan, guvernör i Taiyuan, utropade sig till kejsare (Senare Han), och Deguang drog sig tillbaka norrut och dog på vägen, den 18 maj 947.
