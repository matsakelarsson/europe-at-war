Also called the Portuguese Civil War or the War of the Two Brothers. Many foreign volunteers and mercenaries, British, French and Belgian among them, fought for the Liberals, and their fleet was commanded by British officers, George Sartorius and then Charles Napier.: Kallas också det portugisiska inbördeskriget eller de två brödernas krig. Många utländska frivilliga och legosoldater, bland dem britter, fransmän och belgare, stred för liberalerna, och deras flotta leddes av brittiska officerare, först George Sartorius och sedan Charles Napier.
The base map shows Portugal unchanged throughout; who held what is told in the steps. Some sources date the start of the war to the Porto rising of 16 May 1828, others to 18 May.: Baskartan visar Portugal oförändrat genom hela kriget; vem som höll vad berättas i stegen. Vissa källor daterar krigets början till upproret i Porto den 16 maj 1828, andra till den 18 maj.
