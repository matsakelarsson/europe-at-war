Lisbon: Lissabon
Miguel, acclaimed king by his supporters, ruled from the capital, and political prisons filled with liberals.: Miguel, som hyllats som kung av sina anhängare, styrde från huvudstaden, och de politiska fängelserna fylldes med liberaler.
Dom Pedro: Dom Pedro
To break the deadlock the Liberals sent a force under the Duke of Terceira by sea to the Algarve in June 1833. On 5 July Charles Napier’s small squadron captured most of the Miguelist fleet off Cape St Vincent, and Terceira marched north through the Alentejo, defeated a Miguelist force across the Tagus from the capital on 23 July and entered Lisbon the next day. Pedro moved his government there, and Miguelist attacks on Lisbon and Porto failed that summer and autumn. Miguel’s army still held much of the interior, with Santarém as his base, and guerrilla bands remained strong in the countryside.: För att bryta dödläget sände liberalerna i juni 1833 en styrka under hertigen av Terceira sjövägen till Algarve. Den 5 juli erövrade Charles Napiers lilla eskader större delen av den miguelistiska flottan utanför Kap São Vicente, och Terceira marscherade norrut genom Alentejo, besegrade den 23 juli en miguelistisk styrka på andra sidan Tejo mitt emot huvudstaden och gick in i Lissabon dagen därpå. Pedro flyttade dit sin regering, och miguelistiska angrepp på Lissabon och Porto misslyckades under sommaren och hösten. Miguels armé höll fortfarande stora delar av inlandet, med Santarém som bas, och gerillaband förblev starka på landsbygden.
In 1833 the death of Ferdinand VII turned Spain against Miguel, who had sheltered the Spanish pretender Don Carlos. In April 1834 Britain, France, Spain and Portugal formed the Quadruple Alliance, and Spanish troops entered Portugal. On 16 May the Duke of Terceira beat the Miguelist army at Asseiceira near Tomar, and on 26 May, at Evoramonte, Miguel accepted a pension and exile in return for giving up his claim. Pedro restored the Charter and dissolved the religious orders, but died in September 1834, and Maria II, aged 15, began her personal rule.: 1833 vände Ferdinand VII:s död Spanien mot Miguel, som hade gett skydd åt den spanske tronpretendenten Don Carlos. I april 1834 bildade Storbritannien, Frankrike, Spanien och Portugal kvadrupelalliansen, och spanska trupper gick in i Portugal. Den 16 maj besegrade hertigen av Terceira den miguelistiska armén vid Asseiceira nära Tomar, och den 26 maj i Evoramonte gick Miguel med på pension och exil mot att han avstod från sina anspråk. Pedro återinförde chartan och upplöste de religiösa ordnarna men dog i september 1834, och den 15-åriga Maria II inledde sitt personliga styre.
