Liberal Wars: Liberala krigen
A civil war in Portugal between the liberal constitutionalists of Pedro IV and his daughter Maria II and the absolutists of Pedro’s brother Miguel, who had made himself king in 1828. Pedro’s small army, landed near Porto in 1832, survived a year-long siege, took Lisbon in 1833 and forced Miguel to give up the throne at Evoramonte in May 1834.: Ett inbördeskrig i Portugal mellan de liberala konstitutionalisterna under Pedro IV och hans dotter Maria II och absolutisterna under Pedros bror Miguel, som hade gjort sig till kung 1828. Pedros lilla armé, som landsteg nära Porto 1832, klarade en årslång belägring, intog Lissabon 1833 och tvingade Miguel att avstå tronen i Evoramonte i maj 1834.
