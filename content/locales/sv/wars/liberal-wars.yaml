When King John VI died in 1826, his elder son Pedro, Emperor of Brazil, granted Portugal a Constitutional Charter and abdicated in favour of his seven-year-old daughter Maria, who was to marry his younger brother Miguel. Miguel returned from exile in February 1828 as regent and swore to uphold the Charter, but his supporters, backed by most of the nobility and the Church, acclaimed him absolute king, and a traditional Cortes of the three estates confirmed him that summer. A liberal rising in Porto in May 1828 collapsed, and thousands of liberals were imprisoned or fled abroad.: När kung Johan VI dog 1826 gav hans äldre son Pedro, kejsare av Brasilien, Portugal en konstitutionell charta och abdikerade till förmån för sin sjuåriga dotter Maria, som skulle gifta sig med hans yngre bror Miguel. Miguel återvände från exilen i februari 1828 som regent och svor att upprätthålla chartan, men hans anhängare, uppbackade av större delen av adeln och kyrkan, hyllade honom som enväldig kung, och en traditionell cortes med de tre stånden bekräftade honom samma sommar. Ett liberalt uppror i Porto i maj 1828 föll samman, och tusentals liberaler fängslades eller flydde utomlands.
Only the island of Terceira in the Azores held out for Maria, and in 1829 its defenders beat off a Miguelist landing at Praia. In 1831 Pedro abdicated the Brazilian throne, raised money and volunteers in Britain and France and gathered a small army in the Azores. On 8 July 1832 about 7,500 men landed at Mindelo, north of Porto, and occupied the city, which Miguel’s troops had abandoned. They were soon besieged by a much larger Miguelist army. For a year Porto was shelled and starved, and cholera broke out in 1833, but the defenders held their lines.: Endast ön Terceira i Azorerna höll ut för Maria, och 1829 slog dess försvarare tillbaka en miguelistisk landstigning vid Praia. 1831 abdikerade Pedro från den brasilianska tronen, samlade in pengar och frivilliga i Storbritannien och Frankrike och samlade en liten armé på Azorerna. Den 8 juli 1832 landsteg omkring 7 500 man vid Mindelo, norr om Porto, och besatte staden, som Miguels trupper hade övergett. De belägrades snart av en mycket större miguelistisk armé. I ett år beskjöts och svältes Porto, och kolera bröt ut 1833, men försvararna höll sina linjer.
