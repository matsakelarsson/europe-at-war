# Svenska översättningar av katalogtexten (våg 13); stegtexterna kommer senare.
Wars of the Grebo and Kru against Liberia: Grebos och krus krig mot Liberia
? "Eighty years of intermittent war on the south-eastern coast of Liberia between the Americo-Liberian settler states and the Grebo and Kru, coastal peoples who had long traded with European ships and whose men worked as sailors and dockers along the whole West African coast. The settlers, freed and freeborn African Americans sent by colonisation societies, claimed authority over the coast through treaties that the Grebo and Kru understood differently, and they fought over land, trade, customs duties and taxes. In 1856 the Grebo and Kru around Cape Palmas attacked Maryland in Liberia, the separate settler republic at Harper that had declared independence on 29 May 1854. Unable to defend itself, Maryland asked Liberia for help; President Joseph Jenkins Roberts sent militia, the joint force drove the attackers back, and after a referendum in February 1857 Maryland joined Liberia as Maryland County on 6 April 1857. The Grebo, who had hoped to form a united Grebo state, rose again in 1875 over the loss of their land: on 8 September 1875 they attacked Cape Palmas and were beaten off, the United States sent the USS Alaska to Liberia in February 1876, and on 1 March 1876 the Grebo chiefs signed a treaty acknowledging the authority of the Liberian government. When the First World War ended German shipping to Liberia and threw thousands of Kru out of work, the government’s demands for taxes set off the Kru Coast revolt: from 28 September 1915 Kru fighters besieged the port of Sinoe (Greenville) and burned its customs house, and the small Liberian Frontier Force, led by American officers and supported by the cruiser USS Chester, burned towns and drove the Kru into the forest until the rising died out in 1916. President Daniel Howard’s government sentenced 67 Kru chiefs and leaders to death, and 47 had been hanged before foreign appeals for clemency arrived, and fines, forced labour and garrisons followed. After the League of Nations inquiry of 1930 into forced labour, to which Kru witnesses had testified, the government’s crackdown led to the Sasstown war of 1931–1936, in which the Kru of Sasstown under Paramount Chief Juah Nimley held out against the Frontier Force."
: "Åttio år av återkommande krig på Liberias sydöstra kust mellan de amerikoliberianska bosättarstaterna och grebo och kru, kustfolk som länge hade handlat med europeiska fartyg och vars män arbetade som sjömän och hamnarbetare längs hela den västafrikanska kusten. Bosättarna, frigivna och frifödda afroamerikaner som sänts dit av kolonisationssällskap, gjorde anspråk på myndighet över kusten genom fördrag som grebo och kru förstod på ett annat sätt, och man stred om land, handel, tullar och skatter. År 1856 anföll grebo och kru kring Kap Palmas Maryland i Liberia, den separata bosättarrepubliken i Harper som hade förklarat sig självständig den 29 maj 1854. Oförmöget att försvara sig bad Maryland Liberia om hjälp; president Joseph Jenkins Roberts sände milis, den gemensamma styrkan drev tillbaka angriparna, och efter en folkomröstning i februari 1857 anslöt sig Maryland till Liberia som Maryland County den 6 april 1857. Grebo, som hade hoppats bilda en förenad grebostat, reste sig på nytt 1875 över förlusten av sin mark: den 8 september 1875 anföll de Kap Palmas och slogs tillbaka, USA sände USS Alaska till Liberia i februari 1876, och den 1 mars 1876 undertecknade grebohövdingarna ett fördrag som erkände den liberianska regeringens myndighet. När första världskriget gjorde slut på den tyska sjöfarten på Liberia och gjorde tusentals kru arbetslösa utlöste regeringens skattekrav krukustrevolten: från den 28 september 1915 belägrade krukrigare hamnstaden Sinoe (Greenville) och brände dess tullhus, och den lilla Liberian Frontier Force, ledd av amerikanska officerare och understödd av kryssaren USS Chester, brände städer och drev kru in i skogen tills resningen ebbade ut 1916. President Daniel Howards regering dömde 67 kruhövdingar och kruledare till döden, och 47 hade hängts innan utländska vädjanden om nåd kom fram; därefter följde böter, tvångsarbete och garnisoner. Efter Nationernas förbunds utredning 1930 om tvångsarbete, där kruvittnen hade vittnat, ledde regeringens tillslag till Sasstownkriget 1931–1936, där kru i Sasstown under överhövdingen Juah Nimley höll stånd mot Frontier Force."
