# Svenska översättningar av katalogtexten (våg 12); stegtexterna kommer senare.
Libyan Civil War (2011): Libyska inbördeskriget (2011)
? The uprising and civil war that overthrew Muammar Gaddafi, who had ruled Libya since 1969. Inspired by the revolutions in Tunisia and Egypt, protests broke out in Benghazi on 15 February 2011, and within days the east of the country and several towns in the west were in the hands of rebels, soldiers and officials who had changed sides. A National Transitional Council (NTC) formed in Benghazi on 27 February. Gaddafi’s forces crushed the rising in Zawiya, drove the rebels back along the coast and reached the outskirts of Benghazi on 19 March, two days after the UN Security Council authorised all necessary measures to protect civilians. French, British and American air strikes stopped them, and NATO took command of the air campaign at the end of March. Misrata held out through a siege of nearly three months, and the Berber and Arab towns of the Nafusa Mountains through the summer. In August the rebels advanced from the mountains to the coast, and Tripoli fell between 20 and 28 August. Gaddafi’s last strongholds, Bani Walid and his home town of Sirte, fell in October; on 20 October Gaddafi was captured outside Sirte and killed, and the NTC declared the war over on 23 October. Estimates of the dead range from about 10,000 to well over 20,000.
: Det uppror och inbördeskrig som störtade Muammar Gaddafi, som hade styrt Libyen sedan 1969. Inspirerade av revolutionerna i Tunisien och Egypten bröt protester ut i Benghazi den 15 februari 2011, och inom några dagar var landets östra del och flera städer i väster i händerna på rebeller, soldater och tjänstemän som hade bytt sida. Ett nationellt övergångsråd (NTC) bildades i Benghazi den 27 februari. Gaddafis styrkor krossade resningen i Zawiya, drev tillbaka rebellerna längs kusten och nådde utkanten av Benghazi den 19 mars, två dagar efter att FN:s säkerhetsråd hade godkänt alla nödvändiga åtgärder för att skydda civila. Franska, brittiska och amerikanska flyganfall stoppade dem, och Nato tog över befälet över luftkampanjen i slutet av mars. Misrata höll ut under en belägring på nästan tre månader, och Nafusabergens berbiska och arabiska städer under hela sommaren. I augusti ryckte rebellerna fram från bergen till kusten, och Tripoli föll mellan den 20 och 28 augusti. Gaddafis sista fästen, Bani Walid och hans hemstad Sirte, föll i oktober; den 20 oktober tillfångatogs Gaddafi utanför Sirte och dödades, och NTC förklarade kriget avslutat den 23 oktober. Uppskattningarna av antalet döda varierar från omkring 10 000 till långt över 20 000.
