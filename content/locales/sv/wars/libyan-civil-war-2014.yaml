# Svenska översättningar av katalogtexten (våg 12); stegtexterna kommer senare.
Second Libyan Civil War: Andra libyska inbördeskriget
? "The war between rival governments and armed coalitions that divided Libya from 2014 to 2020. After Gaddafi’s fall the state never controlled the brigades that had fought him. In May 2014 General Khalifa Haftar launched Operation Dignity against Islamist militias in Benghazi, and in July Libya Dawn, a coalition of Misratan and Islamist brigades, drove his allies from Tripoli’s airport and took the capital. The newly elected House of Representatives moved to Tobruk and backed Haftar’s Libyan National Army (LNA), while the old General National Congress set up a rival government in Tripoli. The Islamic State took Derna and then Sirte, where it was destroyed in 2016 by forces of the UN-backed Government of National Accord (GNA) with American air support. Haftar won Benghazi in 2017 and Derna in 2018, took the oil ports and the south, and in April 2019 attacked Tripoli. The battle drew in foreign powers: the United Arab Emirates, Egypt and Russia’s Wagner Group backed the LNA, Turkey and Syrian fighters the GNA, which drove the LNA back to Sirte and Jufra in June 2020. A permanent ceasefire was signed on 23 October 2020. The country remained divided between rival governments in Tripoli and the east, and at least 15,000 people were killed in the war by incomplete counts."
: "Kriget mellan rivaliserande regeringar och väpnade koalitioner som splittrade Libyen från 2014 till 2020. Efter Gaddafis fall fick staten aldrig kontroll över de brigader som hade bekämpat honom. I maj 2014 inledde general Khalifa Haftar Operation Värdighet mot islamistiska miliser i Benghazi, och i juli drev Libysk gryning, en koalition av brigader från Misrata och islamistiska brigader, hans allierade från Tripolis flygplats och intog huvudstaden. Det nyvalda representanthuset flyttade till Tobruk och stödde Haftars Libyska nationella armé (LNA), medan den gamla allmänna nationalkongressen bildade en rivaliserande regering i Tripoli. Islamiska staten intog Derna och därefter Sirte, där den 2016 förintades av styrkor från den FN-stödda regeringen för nationell samling (GNA) med amerikanskt flygstöd. Haftar vann Benghazi 2017 och Derna 2018, intog oljehamnarna och södern och anföll Tripoli i april 2019. Striden drog in utländska makter: Förenade Arabemiraten, Egypten och den ryska Wagnergruppen stödde LNA, Turkiet och syriska kämpar GNA, som i juni 2020 drev tillbaka LNA till Sirte och Jufra. En permanent vapenvila undertecknades den 23 oktober 2020. Landet förblev delat mellan rivaliserande regeringar i Tripoli och i öster, och enligt ofullständiga beräkningar dödades minst 15 000 människor i kriget."
