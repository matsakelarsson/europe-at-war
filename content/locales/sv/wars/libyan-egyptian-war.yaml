# Svenska översättningar av katalogtexten (våg 12); stegtexterna kommer senare.
Libyan–Egyptian War: Libysk-egyptiska kriget
? "A four-day border war between Libya and Egypt, also called the Four Day War. Muammar Gaddafi had pressed Egypt to unite with Libya, and when Anwar Sadat turned away from him after the October War of 1973, moved towards peace with Israel and drew closer to the United States, relations broke down. Each accused the other of plotting against it: Libya backed Egyptian opponents of Sadat and Egypt backed opponents of Gaddafi, and from 1976 there were clashes on the frontier. On 21 July 1977 a Libyan tank battalion raided the Egyptian border town of Sallum and was ambushed by the Egyptian army, which struck back with a mechanised force that pushed some 24 km into Libya towards Musaid and then withdrew, while Egyptian aircraft bombed the Gamal Abdel Nasser air base at al-Adem near Tobruk and radar stations at Bardia and Jaghbub. Over the next days Egyptian aircraft and helicopter-borne commandos raided al-Adem again, the air base at Kufra, Jaghbub and camps in eastern Libya, and Libyan aircraft attacked Mersa Matruh. Under pressure from Arab governments and the United States, and after mediation by Algeria’s President Houari Boumediène and the PLO leader Yasser Arafat, Sadat declared a ceasefire on 24 July. Both sides claimed victory; Egypt lost about 100 men killed or wounded and Libya about 400, with dozens of tanks and armoured vehicles and, by different estimates, between six and twenty aircraft. Prisoners were exchanged in August 1977, but no peace treaty followed, and relations worsened again after Sadat’s visit to Jerusalem that November."
: "Ett fyra dagar långt gränskrig mellan Libyen och Egypten, även kallat fyradagarskriget. Muammar Gaddafi hade pressat Egypten att gå samman med Libyen, och när Anwar Sadat efter oktoberkriget 1973 vände sig bort från honom, närmade sig fred med Israel och knöt närmare band till USA, bröt förbindelserna samman. Båda länderna anklagade varandra för stämplingar: Libyen stödde egyptiska motståndare till Sadat och Egypten stödde motståndare till Gaddafi, och från 1976 förekom sammandrabbningar vid gränsen. Den 21 juli 1977 gjorde en libysk stridsvagnsbataljon en räd mot den egyptiska gränsstaden Sallum och föll i ett bakhåll lagt av den egyptiska armén, som slog tillbaka med en mekaniserad styrka som trängde omkring 24 km in i Libyen mot Musaid och sedan drog sig tillbaka, medan egyptiskt flyg bombade flygbasen Gamal Abdel Nasser vid al-Adem nära Tobruk och radarstationer vid Bardia och Jaghbub. Under de följande dagarna anföll egyptiskt flyg och helikopterburna kommandosoldater på nytt al-Adem, flygbasen vid Kufra, Jaghbub och läger i östra Libyen, och libyskt flyg angrep Mersa Matruh. Under påtryckningar från arabiska regeringar och USA, och efter medling av Algeriets president Houari Boumediène och PLO-ledaren Yassir Arafat, utlyste Sadat vapenvila den 24 juli. Båda sidor gjorde anspråk på segern; Egypten förlorade omkring 100 man i döda och sårade och Libyen omkring 400 samt dussintals stridsvagnar och pansarfordon och, enligt olika uppskattningar, mellan sex och tjugo flygplan. Fångar utväxlades i augusti 1977, men inget fredsfördrag följde, och förbindelserna försämrades igen efter Sadats besök i Jerusalem i november samma år."
