Liège Revolution: Liègerevolutionen
A revolution in the Prince-Bishopric of Liège, an ecclesiastical state of the Holy Roman Empire, which began on 18 August 1789, five weeks after the fall of the Bastille. Townspeople took over the city hall and installed new burgomasters, and the prince-bishop, César-Constantin-François de Hoensbroeck, fled to Trier. The Imperial Chamber Court at Wetzlar ordered his restoration and called on neighbouring princes to enforce it. Prussian troops occupied Liège at the end of 1789 but showed sympathy for the revolutionaries and withdrew in 1790, and the Liégeois held off the troops of other imperial princes through that year. After Leopold II had crushed the Brabant Revolution, Austrian troops entered Liège in January 1791 and restored the prince-bishop. French armies overran the country in 1792 and again in 1794, and France annexed it in 1795.: En revolution i furstbiskopsdömet Liège, en andlig stat inom tysk-romerska riket, som började den 18 augusti 1789, fem veckor efter Bastiljens fall. Stadsborna tog över rådhuset och tillsatte nya borgmästare, och furstbiskopen, César-Constantin-François de Hoensbroeck, flydde till Trier. Rikskammarrätten i Wetzlar beordrade att han skulle återinsättas och uppmanade grannfurstarna att verkställa beslutet. Preussiska trupper ockuperade Liège i slutet av 1789 men visade sympati för revolutionärerna och drog sig tillbaka 1790, och Liègeborna höll andra riksfurstars trupper stången under resten av året. Sedan Leopold II krossat den brabantska revolutionen tågade österrikiska trupper in i Liège i januari 1791 och återinsatte furstbiskopen. Franska arméer överskred landet 1792 och på nytt 1794, och Frankrike annekterade det 1795.
