Liège was an ecclesiastical principality of the Holy Roman Empire, ruled by its bishop but with powerful towns. The prince-bishopric was restored under Bourbon after 1468, and the city was rebuilt in the following decades.: Liège var ett andligt furstendöme inom tysk-romerska riket, styrt av sin biskop men med mäktiga städer. Furstbiskopsdömet återupprättades under Bourbon efter 1468, och staden byggdes upp igen under de följande årtiondena.
