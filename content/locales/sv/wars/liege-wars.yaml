Liège Wars: Liègekrigen
Three risings of the city and Prince-Bishopric of Liège against Burgundian control, encouraged by Louis XI of France. Liège rejected its prince-bishop, Louis of Bourbon, a nephew of Duke Philip the Good, and was defeated at Montenaken in 1465. In 1466 Charles the Bold destroyed the allied town of Dinant and had many of its men drowned in the Meuse, and in 1467 he beat the Liégeois at Brustem and tore down their walls. When the city rose again in 1468, Charles took it by storm with Louis XI, his virtual prisoner after their meeting at Péronne, at his side. A desperate night attack on the duke’s camp by about 600 men of Franchimont failed, and Liège was sacked and burned over several weeks; many of its people were killed.: Tre uppror av staden och furstbiskopsdömet Liège mot burgundisk kontroll, uppmuntrade av Ludvig XI av Frankrike. Liège förkastade sin furstbiskop, Ludvig av Bourbon, brorson till hertig Filip den gode, och besegrades vid Montenaken 1465. År 1466 förstörde Karl den djärve den allierade staden Dinant och lät dränka många av dess män i Maas, och 1467 besegrade han Liègeborna vid Brustem och rev deras murar. När staden reste sig på nytt 1468 stormade Karl den med Ludvig XI, i praktiken hans fånge efter deras möte i Péronne, vid sin sida. Ett desperat nattligt anfall mot hertigens läger av omkring 600 män från Franchimont misslyckades, och Liège plundrades och brändes under flera veckor; många av invånarna dödades.
