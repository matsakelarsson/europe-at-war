# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
Lin Shuangwen rebellion: Lin Shuangwens uppror
? The largest rising in Taiwan under Qing rule, led by Lin Shuangwen, a settler of Zhangzhou origin and a leader of the Heaven and Earth Society (Tiandihui), a sworn brotherhood that the authorities had begun to hunt down. When troops moved against the society around Dali in central Taiwan in January 1787, Lin rose, took the county seats of Changhua and Zhuluo and the town of Zhuqian, and proclaimed a reign of his own; in the south Zhuang Datian took Fengshan. Tens of thousands joined them, while settlers of Quanzhou origin, the Hakka and many villages of the plains peoples raised militias on the Qing side, and the war became in part a feud between communities. Qing reinforcements held the prefectural city, the port of Lugang and, after months of siege, Zhuluo, which the Qianlong emperor renamed Jiayi (“commended for loyalty”). Fuk’anggan landed at Lugang in December 1787 with fresh troops, relieved Jiayi, took Lin’s base at Dali and captured Lin in February 1788 and Zhuang in March. The leaders were executed. The court counted the campaign among the Ten Great Campaigns of the Qianlong reign; it is the rising dated 1786 in many lists, from the year in the Chinese calendar in which it began (the 51st year of Qianlong).
: Den största resningen på Taiwan under Qingstyret, ledd av Lin Shuangwen, en nybyggare med rötter i Zhangzhou och en ledare inom Himlens och jordens sällskap (Tiandihui), ett edsvuret brödraskap som myndigheterna hade börjat jaga. När trupper gick mot sällskapet kring Dali i mellersta Taiwan i januari 1787 reste sig Lin, intog häradshuvudorterna Changhua och Zhuluo och staden Zhuqian och utropade en egen regeringsperiod; i söder intog Zhuang Datian Fengshan. Tiotusentals anslöt sig till dem, medan nybyggare med rötter i Quanzhou, hakka och många byar bland slättfolken satte upp miliser på Qings sida, och kriget blev delvis en fejd mellan folkgrupper. Qingförstärkningar höll prefekturstaden, hamnen Lugang och, efter månader av belägring, Zhuluo, som Qianlongkejsaren döpte om till Jiayi (”berömd för sin lojalitet”). Fuk’anggan landsteg i Lugang i december 1787 med nya trupper, undsatte Jiayi, intog Lins bas i Dali och tillfångatog Lin i februari 1788 och Zhuang i mars. Ledarna avrättades. Hovet räknade fälttåget till Qianlongtidens tio stora fälttåg; det är den resning som i många listor dateras till 1786, efter det år i den kinesiska kalendern då den började (Qianlongs 51:a regeringsår).
