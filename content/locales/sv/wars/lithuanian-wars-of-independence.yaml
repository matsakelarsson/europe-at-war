Lithuanian Wars of Independence: Litauiska frihetskrigen
The wars the new Lithuanian state fought for its independence against the Red Army in 1918–1919 and against the German-led Bermontians in the autumn of 1919. Lithuanian volunteers, with Saxon help, drove the Red Army back to the Daugava by the end of August 1919 and beat the Bermontians at Radviliškis in November, and in the treaty of 12 July 1920 Soviet Russia recognised Lithuania’s independence and its claim to Vilnius, which Poland seized that October.: De krig som den nya litauiska staten förde för sin självständighet mot Röda armén 1918–1919 och mot de tyskledda bermontianerna hösten 1919. Litauiska frivilliga drev med sachsisk hjälp tillbaka Röda armén till Daugava i slutet av augusti 1919 och besegrade bermontianerna vid Radviliškis i november, och i fördraget den 12 juli 1920 erkände Sovjetryssland Litauens självständighet och dess anspråk på Vilnius, som Polen tog i oktober samma år.
