# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
Little War (Guerra Chiquita): Lilla kriget (Guerra Chiquita)
? The second Cuban war for independence, fought in 1879–1880 by veterans who had not accepted the Pact of Zanjón that ended the Ten Years’ War. It was organised from New York by the Cuban Revolutionary Committee of Calixto García, who had refused the pact, with the support of Antonio Maceo in exile and of José Martí in Havana, until Martí was arrested and deported to Spain in September 1879. The rising began in Oriente in late August 1879 (sources give 24 or 26 August) under José Maceo, Guillermo Moncada and Quintín Banderas, and spread to Las Villas, where Emilio Núñez and Francisco Carrillo led it. The rebels, a few thousand at most, were short of arms and of experienced leaders, and the people of the countryside were exhausted by ten years of war. The Spanish commanders, among them Camilo García de Polavieja in Oriente, combined pursuit with offers of pardon, and Spanish authorities presented the rising as a race war, since many of its leaders were Black, which kept many white Cubans away from it. Antonio Maceo never managed to land; Calixto García landed on the south coast of Oriente in May 1880, but after months in the Sierra Maestra and the Cauto valley he surrendered and was again deported to Spain. Most leaders had capitulated by September 1880, and the last, Emilio Núñez, laid down his arms on 3 December 1880. Hundreds of rebels were killed. The failure convinced José Martí that a new war needed one organisation uniting the exiles and the island, which he founded in 1892 as the Cuban Revolutionary Party.
: Det andra kubanska självständighetskriget, fört 1879–1880 av veteraner som inte hade godtagit pakten i Zanjón, som avslutade tioårskriget. Det organiserades från New York av Calixto García, som hade vägrat godta pakten, och hans Kubanska revolutionskommitté, med stöd av Antonio Maceo i exil och av José Martí i Havanna, tills Martí greps och deporterades till Spanien i september 1879. Resningen började i Oriente i slutet av augusti 1879 (källorna anger den 24 eller 26 augusti) under José Maceo, Guillermo Moncada och Quintín Banderas och spred sig till Las Villas, där Emilio Núñez och Francisco Carrillo ledde den. Rebellerna, högst några tusen, hade ont om vapen och erfarna ledare, och landsbygdens befolkning var utmattad efter tio års krig. De spanska befälhavarna, bland dem Camilo García de Polavieja i Oriente, kombinerade förföljelse med erbjudanden om benådning, och de spanska myndigheterna framställde resningen som ett raskrig, eftersom många av dess ledare var svarta, vilket höll många vita kubaner borta från den. Antonio Maceo lyckades aldrig landstiga; Calixto García landsteg på Orientes sydkust i maj 1880, men efter flera månader i Sierra Maestra och Cautodalen gav han upp och deporterades på nytt till Spanien. De flesta ledare hade kapitulerat i september 1880, och den siste, Emilio Núñez, lade ned vapnen den 3 december 1880. Hundratals rebeller dödades. Misslyckandet övertygade José Martí om att ett nytt krig krävde en enda organisation som förenade exilen och ön, och den grundade han 1892 som Kubanska revolutionära partiet.
