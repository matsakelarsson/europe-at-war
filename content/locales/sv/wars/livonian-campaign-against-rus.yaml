The Pskovian army that marched out to retake Izborsk was defeated, and its commander, Gavrila Gorislavich, was killed.: Den pskovska här som tågade ut för att återta Izborsk besegrades, och dess befälhavare, Gavrila Gorislavitj, dödades.
Autumn 1240: hösten 1240
After a week of burning in the surrounding countryside, the boyar Tverdilo Ivankovich surrendered the city to Yaroslav Vladimirovich and the Order.: Efter en vecka av bränder på den omgivande landsbygden överlämnade bojaren Tverdilo Ivankovitj staden till Jaroslav Vladimirovitj och orden.
The fort the Order built in Votia over the winter. Alexander stormed it and pulled it down.: Det fäste som orden byggde i Votland under vintern. Aleksandr stormade det och rev det.
