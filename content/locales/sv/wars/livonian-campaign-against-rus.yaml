Dates follow the Novgorod First Chronicle. The other main source, the Livonian Rhymed Chronicle, was written in the 1290s from the Order’s side, and the two disagree on numbers.: Datumen följer Novgorods första krönika. Den andra huvudkällan, Livländska rimkrönikan, skrevs på 1290-talet från ordens sida, och de två är oense om siffrorna.
The Livonian Order was the former Order of the Brothers of the Sword, merged into the Teutonic Order in 1237. Vassals of the Danish king in northern Estonia joined its campaigns, and the exiled Prince Yaroslav Vladimirovich and his supporters fought on its side, so that Rus’ fought on both sides.: Livländska orden var den tidigare Svärdsriddarorden, som 1237 hade gått upp i Tyska orden. Den danske kungens vasaller i norra Estland deltog i dess fälttåg, och den landsflyktige fursten Jaroslav Vladimirovitj och hans anhängare stred på dess sida, så att Rus fanns på båda sidor.
The Battle of the Neva in July 1240, in which Alexander defeated a Swedish force, is told under the Swedish crusades into Finland.: Slaget vid Neva i juli 1240, där Aleksandr besegrade en svensk styrka, berättas under Svenska korståg till Finland.
Pskov, Izborsk and Koporye are in Russia today; Dorpat is Tartu, Odenpäh is Otepää and Fellin is Viljandi, all in Estonia.: Pskov, Izborsk och Koporje ligger i dag i Ryssland; Dorpat är Tartu, Odenpäh är Otepää och Fellin är Viljandi, alla i Estland.
