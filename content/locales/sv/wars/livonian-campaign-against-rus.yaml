Livonian campaign against Rus’: Livländska fälttåget mot Rus
A war in which the Livonian Order and the Bishopric of Dorpat, with an exiled prince of Pskov, took Izborsk and Pskov in 1240 and occupied Votia on the Gulf of Finland. Alexander Nevsky of Novgorod won both back and defeated the Order’s army at Lake Peipus, the “Battle on the Ice”, on 5 April 1242.: Ett krig där Livländska orden och biskopsdömet Dorpat, tillsammans med en landsflyktig furste från Pskov, tog Izborsk och Pskov 1240 och ockuperade Votland vid Finska viken. Aleksandr Nevskij av Novgorod återtog båda och besegrade ordens här vid Peipussjön, i ”slaget på isen”, den 5 april 1242.
