5 April 1242: 5 april 1242
Fought at or on Lake Peipus. The battle was much smaller than its later fame suggests, but it ended the Order’s attempt to control Pskov.: Utkämpades vid eller på Peipussjön. Slaget var mycket mindre än dess senare ryktbarhet antyder, men det gjorde slut på ordens försök att kontrollera Pskov.
Peace of 1242: Freden 1242
The Order’s envoys came to Novgorod and gave up their claims to Pskov, Votia, Luga and part of Latgalia.: Ordens sändebud kom till Novgorod och avstod från sina anspråk på Pskov, Votland, Luga och en del av Lettgallen.
