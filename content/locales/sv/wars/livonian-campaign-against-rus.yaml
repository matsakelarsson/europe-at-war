In March 1242 Alexander and his brother Andrei, who had brought troops from Vladimir-Suzdal, drove the small garrison out of Pskov and sent the captured knights to Novgorod. Alexander then carried the war into the land of the Estonians around Dorpat. An advance party under Domash Tverdislavich, the brother of Novgorod’s posadnik, was caught by the Germans and beaten, and Domash was killed. Alexander fell back to the shore of Lake Peipus and drew up his army “at Uzmen, by the Raven’s Rock”, near the narrow strait between the main lake and Lake Pskov.: I mars 1242 drev Aleksandr och hans bror Andrej, som hade fört trupper från Vladimir-Suzdal, ut den lilla garnisonen ur Pskov och skickade de tillfångatagna riddarna till Novgorod. Aleksandr förde sedan kriget in i esternas land kring Dorpat. En förtrupp under Domasj Tverdislavitj, bror till Novgorods posadnik, överraskades av tyskarna och besegrades, och Domasj dödades. Aleksandr drog sig tillbaka till Peipussjöns strand och ställde upp sin här ”vid Uzmen, vid Korpklippan”, nära det smala sundet mellan huvudsjön och Pskovsjön.
On 5 April 1242 the Order’s knights and the bishop’s men, with Estonian foot soldiers, charged the Novgorodian line. The Novgorod chronicle says they drove through it like a wedge but were then surrounded, and that 400 Germans were killed and 50 captured, along with countless Estonians; the Rhymed Chronicle admits to 20 brothers dead and six taken. The story of knights drowning when the ice broke is not in any medieval source and seems to come from Eisenstein’s 1938 film. Later in 1242 the Order made peace, gave up its claims to Pskov and Votia and exchanged prisoners.: Den 5 april 1242 anföll ordensriddarna och biskopens män, med estniskt fotfolk, den novgorodiska linjen. Novgorodkrönikan uppger att de trängde igenom den som en kil men sedan omringades, och att 400 tyskar dödades och 50 tillfångatogs, tillsammans med otaliga ester; rimkrönikan medger 20 döda bröder och sex tillfångatagna. Berättelsen om riddare som drunknade när isen brast finns inte i någon medeltida källa och tycks komma från Eisensteins film från 1938. Senare under 1242 slöt orden fred, avstod från sina anspråk på Pskov och Votland och utväxlade fångar.
