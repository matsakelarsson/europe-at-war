In July 1240 Prince Alexander Yaroslavich of Novgorod beat a Swedish landing on the Neva, a victory that later earned him the name Nevsky. Bishop Hermann of Dorpat, knights of the Livonian Order, vassals of the Danish king and Yaroslav Vladimirovich, an exiled claimant to the throne of Pskov, took the border fortress of Izborsk by storm in September. The Pskovians marched out to retake it and were routed; the Rhymed Chronicle says 800 of them fell. The Livonians burned the villages around Pskov for a week, and the boyar Tverdilo Ivankovich and his party opened the gates.: I juli 1240 besegrade fursten Aleksandr Jaroslavitj av Novgorod en svensk landstigning vid Neva, en seger som senare gav honom namnet Nevskij. Biskop Hermann av Dorpat, riddare av Livländska orden, den danske kungens vasaller och Jaroslav Vladimirovitj, en landsflyktig tronpretendent i Pskov, stormade gränsfästningen Izborsk i september. Pskovborna tågade ut för att återta den och slogs på flykten; rimkrönikan uppger att 800 av dem stupade. Livländarna brände byarna kring Pskov i en vecka, och bojaren Tverdilo Ivankovitj och hans parti öppnade portarna.
Pskov was left under Yaroslav, with two knights of the Order and a small garrison. That winter Alexander quarrelled with the Novgorodians and left the city. The Order and the Bishop of Ösel–Wiek then occupied Votia, the land of the Votes between Narva and the Neva, built a fort at Koporye and raided as far as Tesovo, close to Novgorod. Alarmed, the Novgorodians asked Alexander’s father, Grand Prince Yaroslav of Vladimir, to send him back. In 1241 Alexander stormed Koporye. He took some of its Germans to Novgorod, let others go and hanged the Votes and Estonians who had served the Order.: Pskov lämnades under Jaroslav, med två ordensriddare och en liten garnison. Den vintern blev Aleksandr osams med novgorodborna och lämnade staden. Orden och biskopen av Ösel-Wiek ockuperade då Votland, voternas land mellan Narva och Neva, byggde ett fäste vid Koporje och gjorde räder ända till Tesovo, nära Novgorod. Oroade bad novgorodborna Aleksandrs far, storfurst Jaroslav av Vladimir, att skicka tillbaka honom. 1241 stormade Aleksandr Koporje. Han förde en del av dess tyskar till Novgorod, lät andra gå och hängde de voter och ester som hade tjänat orden.
