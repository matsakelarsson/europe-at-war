When Russia invaded Livonia in 1558, the old Livonian Order collapsed and its neighbours carved up its lands. In 1561 Reval and the nobles of northern Estonia placed themselves under Swedish rule, Sweden’s first foothold south of the Gulf of Finland.: När Ryssland invaderade Livland 1558 föll den gamla Livländska orden samman och grannarna styckade dess länder. 1561 ställde sig Reval och adeln i norra Estland under svenskt styre, Sveriges första fäste söder om Finska viken.
From 1570 Sweden fought Russia for Estonia. Reval beat off Russian sieges, and in 1580–81 Pontus De la Gardie went on the offensive, taking Kexholm, Wesenberg and, on 6 September 1581, Narva, where many inhabitants were massacred. Ivangorod, Jama and Koporye followed. The Truce of Plussa on 10 August 1583 left Sweden holding Estonia, Ingria and Kexholm.: Från 1570 kämpade Sverige mot Ryssland om Estland. Reval slog tillbaka ryska belägringar, och 1580–81 gick Pontus De la Gardie till offensiv och intog Kexholm, Wesenberg och, den 6 september 1581, Narva, där många invånare massakrerades. Ivangorod, Jama och Koporje följde. Stilleståndet vid Plussa den 10 augusti 1583 lät Sverige behålla Estland, Ingermanland och Kexholm.
