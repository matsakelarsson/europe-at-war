Livonian War: Livländska kriget
A war for Old Livonia, today’s Estonia and Latvia, between Russia, Poland–Lithuania, Sweden and Denmark–Norway. Ivan IV’s early conquests broke up the Livonian Confederation, but Polish–Lithuanian and Swedish offensives from 1578 reversed them, and the truces of Jam Zapolski (1582) and Plussa (1583) divided Livonia between Poland–Lithuania and Sweden.: Ett krig om Gammellivland, dagens Estland och Lettland, mellan Ryssland, Polen–Litauen, Sverige och Danmark–Norge. Ivan IV:s tidiga erövringar splittrade Livländska konfederationen, men polsk-litauiska och svenska offensiver från 1578 gjorde dem om intet, och stilleståndet i Jam Zapolskij (1582) och stilleståndet vid Plussa (1583) delade Livland mellan Polen–Litauen och Sverige.
