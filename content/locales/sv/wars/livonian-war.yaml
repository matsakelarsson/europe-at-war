"Lithuania had taken southern Livonia under its protection in 1559, and in 1561 the Livonian Order was dissolved: its last master became Duke of Courland as a vassal of Sigismund II Augustus, and the rest of its land passed to the Grand Duchy. When a truce ran out in 1562, Ivan IV struck at Lithuania itself. A large Russian army laid siege to Polotsk on the Dvina at the end of January 1563, and after a heavy bombardment the town surrendered on 15 February. According to widely repeated accounts, Jews of Polotsk who refused baptism were drowned in the river on Ivan’s orders.": "Litauen hade tagit södra Livland under sitt beskydd 1559, och 1561 upplöstes Livländska orden: dess siste mästare blev hertig av Kurland som vasall under Sigismund II August, och resten av dess land övergick till storfurstendömet. När ett stillestånd löpte ut 1562 slog Ivan IV till mot själva Litauen. En stor rysk armé belägrade Polotsk vid Düna i slutet av januari 1563, och efter en kraftig beskjutning kapitulerade staden den 15 februari. Enligt allmänt återgivna berättelser dränktes judar i Polotsk som vägrade dop i floden på Ivans order."
On 26 January 1564 a Lithuanian army under Mikołaj Radziwiłł the Red surprised and destroyed a Russian force on the Ula river, but Polotsk stayed Russian for sixteen years. The war convinced the Lithuanian nobles that they could not hold out alone. At a joint diet in Lublin in 1569 King Sigismund II Augustus moved Podlasie, Volhynia and the Kiev region from Lithuania to the Polish crown, and on 1 July the two states became one Commonwealth, with a single elected king and parliament but separate armies, treasuries and laws. A truce with Russia followed in 1570.: Den 26 januari 1564 överraskade och förintade en litauisk armé under Mikołaj Radziwiłł den röde en rysk styrka vid floden Ula, men Polotsk förblev ryskt i sexton år. Kriget övertygade den litauiska adeln om att den inte kunde hålla ut ensam. Vid en gemensam riksdag i Lublin 1569 flyttade kung Sigismund II August Podlasien, Volynien och Kievregionen från Litauen till den polska kronan, och den 1 juli blev de två staterna ett samvälde, med en gemensam vald kung och riksdag men separata arméer, statskassor och lagar. Ett stillestånd med Ryssland följde 1570.
