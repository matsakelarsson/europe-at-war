The wooden fortress caught fire under bombardment and surrendered on 5 September. As the attackers looted it, the fire reached the powder store, which blew up and killed many on both sides. It was returned to Russia in 1582.: Träfästningen fattade eld under beskjutningen och kapitulerade den 5 september. Medan angriparna plundrade den nådde elden kruttornet, som exploderade och dödade många på båda sidor. Den lämnades tillbaka till Ryssland 1582.
Prince Ivan Shuisky’s defenders repelled more than thirty assaults. The last Polish–Lithuanian troops left on 4 February 1582.: Furst Ivan Sjujskijs försvarare slog tillbaka mer än trettio stormningar. De sista polsk-litauiska trupperna drog bort den 4 februari 1582.
