Stefan Báthory, Prince of Transylvania, was elected king of Poland and grand duke of Lithuania in 1576. With Polish hussars, Hungarian and German mercenary infantry and Lithuanian troops, he struck not at Livonia, which Ivan IV had largely overrun in 1577, but at the Russian strongholds behind it. On 30 August 1579 he took Polotsk back after a three-week siege. In 1580 his army took Velizh and Usvyaty, and on 5 September the burning fortress of Velikiye Luki.: Stefan Báthory, furste av Transsylvanien, valdes till kung av Polen och storfurste av Litauen 1576. Med polska husarer, ungerskt och tyskt legoinfanteri och litauiska trupper slog han inte till mot Livland, som Ivan IV till stor del hade erövrat 1577, utan mot de ryska fästena bakom det. Den 30 augusti 1579 återtog han Polotsk efter en tre veckor lång belägring. 1580 intog hans armé Velizj och Usvjaty, och den 5 september den brinnande fästningen Velikije Luki.
In August 1581 Báthory laid siege to Pskov, one of the strongest towns in Russia. Its garrison and townspeople under Prince Ivan Shuisky beat off every assault, and through the winter Jan Zamoyski kept up a blockade while Polish raiders ranged deep into Russia. With the papal envoy Antonio Possevino as mediator, a ten-year truce was signed at Jam Zapolski on 15 January 1582. Ivan gave up all his Livonian conquests and Polotsk, and Báthory handed back Velikiye Luki and lifted the siege.: I augusti 1581 belägrade Báthory Pskov, en av de starkaste städerna i Ryssland. Dess garnison och borgare under furst Ivan Sjujskij slog tillbaka varje stormning, och under vintern upprätthöll Jan Zamoyski en blockad medan polska strövkårer drog djupt in i Ryssland. Med det påvliga sändebudet Antonio Possevino som medlare undertecknades ett tioårigt stillestånd i Jam Zapolskij den 15 januari 1582. Ivan avstod från alla sina livländska erövringar och Polotsk, och Báthory lämnade tillbaka Velikije Luki och hävde belägringen.
