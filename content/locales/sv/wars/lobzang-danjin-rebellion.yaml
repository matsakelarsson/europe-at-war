# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
Lobzang Danjin’s rebellion: Lobzang Danjins uppror
? A rising of the Khoshut Mongols of Kokonor (Qinghai) against the Qing, which ended their autonomy. The Khoshut princes of Kokonor, descendants of Güshi Khan, had ruled Tibet until the Dzungar invasion of 1717, and when the Qing expedition of 1720 drove out the Dzungars, Güshi’s grandson Lobzang Danjin hoped to take his forebears’ place in Lhasa. Instead the Qing ruled Tibet through Tibetan ministers and kept the Kokonor princes as titled vassals. In the summer of 1723 Lobzang Danjin called the princes to an assembly, told them to drop their Qing titles and took the old Mongol title of Dalai Hong Taiji; princes who refused, among them Erdeni Erke Toqtonai and Chaghan Danjin, were attacked and fled into Gansu. The rebels raided the forts and villages around Xining, and many monks of the great monasteries of Amdo, among them Gönlung and Kumbum, joined them. The Yongzheng emperor gave command to Nian Gengyao, governor-general of Sichuan and Shaanxi, with Yue Zhongqi as his field commander. In the winter of 1723–1724 Qing troops stormed the rebel monasteries; at Gönlung, burned on 11 February 1724, estimates of the dead range from some thirty monks in the monastery’s own chronicle to more than 6,000 monks and lay people in other accounts. In March 1724 Yue Zhongqi led a fast column of picked cavalry deep into the Tsaidam and scattered the rebel camps in a few weeks; Lobzang Danjin escaped to the Dzungar ruler Tsewang Rabtan. Nian’s regulations of 1724 then divided the Kokonor Mongols into banners under Qing control, limited the size of monasteries and opened supervised border markets, and from 1725 an imperial commissioner (amban) at Xining governed Kokonor. Lobzang Danjin was handed over to the Qing when Dzungaria fell in 1755 and was pardoned by the Qianlong emperor.
: En resning bland khoshutmongolerna i Kokonor (Qinghai) mot Qing, som gjorde slut på deras självstyre. Khoshutfurstarna i Kokonor, ättlingar till Güshi khan, hade styrt Tibet fram till dzungarernas invasion 1717, och när Qingexpeditionen 1720 drev ut dzungarerna hoppades Güshis sonson Lobzang Danjin kunna inta sina förfäders plats i Lhasa. I stället styrde Qing Tibet genom tibetanska ministrar och behöll Kokonorfurstarna som titulerade vasaller. Sommaren 1723 kallade Lobzang Danjin furstarna till en sammankomst, uppmanade dem att lägga bort sina Qingtitlar och antog den gamla mongoliska titeln Dalai Hong Taiji; furstar som vägrade, bland dem Erdeni Erke Toqtonai och Chaghan Danjin, anfölls och flydde in i Gansu. Rebellerna gjorde räder mot fästena och byarna kring Xining, och många munkar från Amdos stora kloster, bland dem Gönlung och Kumbum, anslöt sig till dem. Yongzhengkejsaren gav befälet till Nian Gengyao, generalguvernör över Sichuan och Shaanxi, med Yue Zhongqi som fältbefälhavare. Vintern 1723–1724 stormade Qingtrupper rebellernas kloster; för Gönlung, som brändes den 11 februari 1724, varierar uppskattningarna av antalet döda från ett trettiotal munkar enligt klostrets egen krönika till mer än 6 000 munkar och lekmän enligt andra berättelser. I mars 1724 ledde Yue Zhongqi en snabb kolonn av utvalt kavalleri djupt in i Tsaidam och skingrade rebellernas läger på några veckor; Lobzang Danjin flydde till dzungarernas härskare Tsewang Rabtan. Nians förordningar från 1724 delade sedan in Kokonormongolerna i fanor under Qings kontroll, begränsade klostrens storlek och öppnade övervakade gränsmarknader, och från 1725 styrdes Kokonor av en kejserlig kommissarie (amban) i Xining. Lobzang Danjin utlämnades till Qing när Dzungariet föll 1755 och benådades av Qianlongkejsaren.
