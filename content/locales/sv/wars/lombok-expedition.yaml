# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
Dutch intervention in Lombok and Karangasem: Nederländska interventionen på Lombok och i Karangasem
? The Dutch conquest of Lombok, ruled since the 18th century by a Balinese dynasty from Karangasem, and with it of Karangasem in eastern Bali. The Muslim Sasak majority of Lombok resented the Balinese court at Cakranegara, and when it conscripted men for a war against Klungkung in 1891, the Sasak of Praya and eastern Lombok rose; the court sent more than 12,000 men against them, and in October 1892 several Sasak chiefs asked the Dutch for help. Governor-General Aart van der Wijck approved an expedition on 27 May 1894, and about 2,400 European and Indonesian soldiers, under General Jacobus Vetter with General P. P. H. van Ham, landed at Ampenan. The Dutch demanded that the old raja, Ratu Agung Gede Ngurah Karangasem, abdicate in favour of the crown prince and give up his son Anak Agung Made, whose harsh rule the Sasak blamed; the court put Made to death and accepted most of the demands. But on the night of 25–26 August 1894 Balinese forces, led by the crown prince Anak Agung Ketut without the raja’s knowledge, attacked the Dutch camp at the Mayura palace in Cakranegara and killed more than 500 soldiers, sailors and labourers, van Ham among them. The Dutch fell back to Ampenan, returned with reinforcements, destroyed the palaces of Mataram and Pagesangan in September and bombarded Cakranegara from 8 November; about 2,000 Balinese and 166 Dutch soldiers died in its capture. Many of the Balinese nobility died in puputan (fights to the death); the raja surrendered on 20 November, was taken to Batavia on 23 November and died there in 1895. Lombok and Karangasem became part of the Dutch East Indies, Karangasem under the Balinese lord Gusti Gede Jelantik as a Dutch regent. The Dutch carried off the court treasury, about 230 kg of gold and 7,199 kg of silver coin with about 1,000 krisses, and some 400 manuscripts, among them a copy of the Nagarakretagama that the Netherlands returned to Indonesia in 1970.
: Den nederländska erövringen av Lombok, som sedan 1700-talet styrdes av en balinesisk dynasti från Karangasem, och därmed även av Karangasem på östra Bali. Lomboks muslimska sasakmajoritet var missnöjd med det balinesiska hovet i Cakranegara, och när hovet 1891 tog ut män till ett krig mot Klungkung reste sig sasakerna i Praya och östra Lombok; hovet sände mer än 12 000 man mot dem, och i oktober 1892 bad flera sasakhövdingar nederländarna om hjälp. Generalguvernören Aart van der Wijck godkände en expedition den 27 maj 1894, och omkring 2 400 europeiska och indonesiska soldater under general Jacobus Vetter, med general P. P. H. van Ham, landsteg i Ampenan. Nederländarna krävde att den gamle rajan, Ratu Agung Gede Ngurah Karangasem, skulle abdikera till förmån för kronprinsen och utlämna sin son Anak Agung Made, som sasakerna höll ansvarig för det hårda styret; hovet lät avrätta Made och godtog de flesta av kraven. Men natten mellan den 25 och 26 augusti 1894 anföll balinesiska styrkor, ledda av kronprinsen Anak Agung Ketut utan rajans vetskap, det nederländska lägret vid Mayurapalatset i Cakranegara och dödade mer än 500 soldater, sjömän och arbetare, bland dem van Ham. Nederländarna drog sig tillbaka till Ampenan, återvände med förstärkningar, förstörde palatsen i Mataram och Pagesangan i september och bombarderade Cakranegara från den 8 november; omkring 2 000 balinesier och 166 nederländska soldater dog när staden intogs. Många av den balinesiska adeln dog i puputan (strider till döden); rajan kapitulerade den 20 november, fördes till Batavia den 23 november och dog där 1895. Lombok och Karangasem blev en del av Nederländska Ostindien, Karangasem under den balinesiske stormannen Gusti Gede Jelantik som nederländsk regent. Nederländarna förde bort hovets skattkammare, omkring 230 kg guld och 7 199 kg silvermynt tillsammans med omkring 1 000 krisar, och omkring 400 manuskript, bland dem en avskrift av Nagarakretagama som Nederländerna lämnade tillbaka till Indonesien 1970.
