Along the Croatian border the fighting had never really stopped. In 1592 Telli Hasan Pasha, the Ottoman governor of Bosnia, took Bihać, and on 15 June 1593 he crossed the Kupa to besiege Sisak, a fortress where the Kupa meets the Sava, with perhaps 12,000–16,000 men. A relief army of 5,000–6,000 Croats, Styrians and Carniolans under Ruprecht von Eggenberg, the ban Tamás Erdődy and Andreas von Auersperg attacked on 22 June while the garrison sallied out. The Ottomans were routed; Hasan Pasha and some 8,000 of his men were killed or drowned in the Kupa.: Längs den kroatiska gränsen hade striderna aldrig riktigt upphört. 1592 intog Telli Hasan pasha, den osmanske ståthållaren i Bosnien, Bihać, och den 15 juni 1593 gick han över Kupa för att belägra Sisak, en fästning där Kupa flyter samman med Sava, med kanske 12 000–16 000 man. En undsättningsarmé på 5 000–6 000 kroater, steiermarkare och krainare under Ruprecht von Eggenberg, banen Tamás Erdődy och Andreas von Auersperg anföll den 22 juni medan garnisonen gjorde ett utfall. Osmanerna slogs på flykten; Hasan pasha och omkring 8 000 av hans män dödades eller drunknade i Kupa.
Sultan Murad III answered with open war. In August the Ottomans took Sisak, and in October the grand vizier Koca Sinan Pasha took Veszprém and Várpalota in Transdanubia, while an imperial winter campaign won back Fülek and other castles in Upper Hungary. In 1594 the imperial army besieged Esztergom without success, and Sinan marched up the Danube and took Győr on 29 September. Győr, the strongest fortress on the road to Vienna, was a heavy loss, and Emperor Rudolf II and the Imperial Diet voted large sums for what Germans called the Turkish war.: Sultan Murad III svarade med öppet krig. I augusti intog osmanerna Sisak, och i oktober intog storvesiren Koca Sinan pasha Veszprém och Várpalota i Transdanubien, medan ett kejserligt vinterfälttåg återtog Fülek och andra borgar i Övre Ungern. 1594 belägrade den kejserliga armén Esztergom utan framgång, och Sinan marscherade uppför Donau och intog Győr den 29 september. Győr, den starkaste fästningen på vägen mot Wien, var en svår förlust, och kejsar Rudolf II och riksdagen beviljade stora summor till det som tyskarna kallade turkkriget.
