Archduke Matthias and Bocskai’s envoys agreed on religious freedom and the restoration of Hungarian offices.: Ärkehertig Matthias och Bocskais sändebud enades om religionsfrihet och återupprättandet av de ungerska ämbetena.
11 November 1606: 11 november 1606
Signed in tents at the mouth of the Zsitva (Žitava) on the Danube, on the border between Royal and Ottoman Hungary.: Undertecknad i tält vid Zsitvas (Žitavas) mynning i Donau, på gränsen mellan Kungliga Ungern och Osmanska Ungern.
Kept by the Ottomans at the peace, with Kanizsa and Esztergom.: Behölls av osmanerna vid fredsslutet, liksom Kanizsa och Esztergom.
Kept by the Habsburgs, with Komárom, as the main fortresses guarding Vienna.: Behölls av habsburgarna, liksom Komárom, som de viktigaste fästningarna till skydd för Wien.
