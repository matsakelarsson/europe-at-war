In 1596 Mehmed III became the first sultan in thirty years to lead his army in person. The imperial army under Archduke Maximilian had taken Hatvan in September and killed its garrison and inhabitants, women and children among them. The Ottomans besieged Eger, which had held out against them in 1552, from 21 September, and on 12 October the fortress capitulated. Its defenders, mostly foreign mercenaries, were then killed in revenge for Hatvan.: 1596 blev Mehmed III den förste sultanen på trettio år att personligen leda sin armé. Den kejserliga armén under ärkehertig Maximilian hade i september intagit Hatvan och dödat dess garnison och invånare, bland dem kvinnor och barn. Osmanerna belägrade från den 21 september Eger, som hade stått emot dem 1552, och den 12 oktober kapitulerade fästningen. Dess försvarare, mestadels utländska legosoldater, dödades sedan som hämnd för Hatvan.
Maximilian and Sigismund Báthory joined forces and met the Ottoman army on the marshy plain of Mezőkeresztes, south of the Bükk hills, on 24–26 October. On the last day the Christian army broke into the Ottoman camp, but its soldiers turned to plunder; the camp servants fought back with whatever came to hand, and cavalry under Cığalazade Sinan Pasha struck the scattered troops and routed them. Both sides lost tens of thousands of men. It was the only great field battle of the war, but Mehmed went home without following it up.: Maximilian och Sigismund Báthory förenade sina styrkor och mötte den osmanska armén på Mezőkeresztes sumpiga slätt, söder om Bükkbergen, den 24–26 oktober. Den sista dagen bröt sig den kristna armén in i det osmanska lägret, men soldaterna började plundra; lägrets tross slog tillbaka med vad de kom åt, och kavalleri under Cığalazade Sinan pasha anföll de kringspridda trupperna och slog dem på flykten. Båda sidor förlorade tiotusentals man. Det var krigets enda stora fältslag, men Mehmed återvände hem utan att utnyttja segern.
