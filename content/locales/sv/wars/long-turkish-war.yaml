Archduke Ferdinand, 1601: Ärkehertig Ferdinand, 1601
By 1602 both empires were exhausted. Unpaid mercenaries plundered the country they were meant to defend; in Transylvania Basta’s soldiers and the Tatars left famine behind them, and in the Ottoman Empire the Celali revolts spread across Anatolia and war with Persia began in 1603. Imperial troops took Pest in 1602 but could not take Buda. Meanwhile Rudolf II’s officials tried Protestant nobles for treason and seized churches from the Lutheran towns of Upper Hungary.: År 1602 var båda imperierna utmattade. Obetalda legosoldater plundrade det land de skulle försvara; i Transsylvanien lämnade Bastas soldater och tatarerna hungersnöd efter sig, och i Osmanska riket spred sig celaliupproren över Anatolien och krig med Persien bröt ut 1603. Kejserliga trupper intog Pest 1602 men kunde inte inta Buda. Samtidigt ställde Rudolf II:s ämbetsmän protestantiska adelsmän inför rätta för förräderi och tog kyrkor från de lutherska städerna i Övre Ungern.
In October 1604 Stephen Bocskai, a Calvinist lord in Bihar, rose against the emperor with the hajdús, the free soldiers of the plain, and defeated an imperial column at Álmosd. He took Kassa in November, was elected prince of Transylvania in February 1605 and prince of Hungary at Szerencs in April, and his horsemen raided Moravia, Styria and Lower Austria. The Ottomans backed him, and their grand vizier, Lala Mehmed Pasha, took Esztergom back in October 1605 and in November handed Bocskai a crown on the field of Rákos near Pest.: I oktober 1604 reste sig István Bocskai, en kalvinistisk storman i Bihar, mot kejsaren med hajdukerna, slättens fria soldater, och besegrade en kejserlig kolonn vid Álmosd. Han intog Kassa i november, valdes till furste av Transsylvanien i februari 1605 och till furste av Ungern i Szerencs i april, och hans ryttare gjorde räder i Mähren, Steiermark och Niederösterreich. Osmanerna stödde honom, och deras storvesir, Lala Mehmed pasha, återtog Esztergom i oktober 1605 och överlämnade i november en krona till Bocskai på Rákosfältet nära Pest.
Battle of Álmosd: Slaget vid Álmosd
14–15 October 1604, Bocskai’s victory: 14–15 oktober 1604, Bocskais seger
Bocskai elected prince of Hungary: Bocskai väljs till furste av Ungern
17 April 1605, at Szerencs: 17 april 1605, i Szerencs
Esztergom retaken by the Ottomans: Esztergom återtas av osmanerna
October 1605: oktober 1605
14–15 October 1604: 14–15 oktober 1604
In a night attack in the woods, Bocskai’s hajdús destroyed an imperial column sent to arrest him.: I ett nattligt anfall i skogen förintade Bocskais hajduker en kejserlig kolonn som skickats för att gripa honom.
Kassa: Kassa
11 November 1604: 11 november 1604
The chief town of Upper Hungary opened its gates to Bocskai and became his headquarters.: Övre Ungerns huvudort öppnade sina portar för Bocskai och blev hans högkvarter.
Szerencs: Szerencs
17 April 1605: 17 april 1605
A diet of the Hungarian estates who had joined the rising elected Bocskai prince of Hungary.: En lantdag med de ungerska ständer som anslutit sig till upproret valde Bocskai till furste av Ungern.
Esztergom: Esztergom
Lala Mehmed Pasha took back the fortress lost in 1595, after a siege of more than a month.: Lala Mehmed pasha återtog fästningen som gått förlorad 1595, efter en belägring på mer än en månad.
Rákos: Rákos
November 1605: november 1605
The grand vizier presented Bocskai with a jewelled crown from the sultan. Bocskai accepted it as a gift but never had himself crowned.: Storvesiren överlämnade en juvelbesatt krona från sultanen till Bocskai. Bocskai tog emot den som en gåva men lät aldrig kröna sig.
Held by Bocskai’s forces in 1605 (approximate): I Bocskais styrkors händer 1605 (ungefärligt)
With Rudolf II unable to govern, the Habsburg archdukes made his brother Matthias head of the family in 1606, and Matthias made peace first with the rebels. In the Peace of Vienna of 23 June 1606 Lutherans and Calvinists in Hungary were promised freedom of worship, Hungarians were to hold the kingdom’s offices, and Bocskai was recognised as prince of Transylvania with several counties of eastern Hungary. Bocskai settled his hajdús on the land as free men, and died that December.: Eftersom Rudolf II inte förmådde regera gjorde de habsburgska ärkehertigarna 1606 hans bror Matthias till familjens överhuvud, och Matthias slöt först fred med upprorsmännen. I freden i Wien den 23 juni 1606 utlovades lutheraner och kalvinister i Ungern religionsfrihet, ungrare skulle inneha rikets ämbeten, och Bocskai erkändes som furste av Transsylvanien med flera komitat i östra Ungern. Bocskai bosatte sina hajduker på jorden som fria män och dog i december samma år.
Talks with the Ottomans began on 24 October at the mouth of the Zsitva on the Danube, and the peace was signed there on 11 November 1606, for twenty years. The border stayed much as it was. The Ottomans kept Eger, Kanizsa and Esztergom, and the Habsburgs Győr and Komárom. The emperor no longer paid a yearly tribute but sent a single gift of 200,000 florins, and for the first time the sultan addressed him as an equal, as padishah rather than as a king of Vienna. The peace held, with border raids, for more than half a century.: Förhandlingarna med osmanerna inleddes den 24 oktober vid Zsitvas mynning i Donau, och freden undertecknades där den 11 november 1606, på tjugo år. Gränsen förblev i stort sett oförändrad. Osmanerna behöll Eger, Kanizsa och Esztergom, och habsburgarna Győr och Komárom. Kejsaren betalade inte längre någon årlig tribut utan sände en engångsgåva på 200 000 floriner, och för första gången tilltalade sultanen honom som en jämlike, som padisha snarare än som en kung av Wien. Freden höll, med gränsräder, i mer än ett halvt sekel.
Peace of Vienna: Freden i Wien
