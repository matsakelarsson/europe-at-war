The war in Hungary became a war of sieges. On 29 March 1598 imperial troops under Adolf von Schwarzenberg and Miklós Pálffy blew open a gate of Győr with a petard and took it back by surprise. In the autumn of 1600 the grand vizier Damat İbrahim Pasha besieged Kanizsa, the main fortress covering Styria and Croatia, and in October its commander Georg Paradeiser surrendered; he was later tried and executed for it. Kanizsa became the seat of a new Ottoman province only a few days’ march from Graz.: Kriget i Ungern blev ett belägringskrig. Den 29 mars 1598 sprängde kejserliga trupper under Adolf von Schwarzenberg och Miklós Pálffy upp en port i Győr med en petard och återtog staden genom överrumpling. Hösten 1600 belägrade storvesiren Damat İbrahim pasha Kanizsa, den viktigaste fästningen som skyddade Steiermark och Kroatien, och i oktober kapitulerade dess befälhavare Georg Paradeiser; han ställdes senare inför rätta och avrättades för detta. Kanizsa blev säte för en ny osmansk provins bara några dagsmarscher från Graz.
In September 1601 Archduke Ferdinand of Inner Austria laid siege to Kanizsa with an army of perhaps 30,000–35,000, including papal troops under Gian Francesco Aldobrandini and soldiers from Mantua, Tuscany and Spain. The garrison under Tiryaki Hasan Pasha, a few thousand strong, held out against bombardment and assaults while rain, disease and desertion wore the besiegers down. Aldobrandini died, and in mid-November, with snow falling, the army retreated, leaving its guns and many sick behind. The same autumn an army under the Duke of Mercœur took Székesfehérvár, which the Ottomans won back in 1602.: I september 1601 belägrade ärkehertig Ferdinand av Inre Österrike Kanizsa med en armé på kanske 30 000–35 000 man, däribland påvliga trupper under Gian Francesco Aldobrandini och soldater från Mantua, Toscana och Spanien. Garnisonen under Tiryaki Hasan pasha, några tusen man stark, höll ut mot beskjutning och stormningar medan regn, sjukdomar och deserteringar nötte ned belägrarna. Aldobrandini dog, och i mitten av november, när snön föll, drog sig armén tillbaka och lämnade sina kanoner och många sjuka efter sig. Samma höst intog en armé under hertigen av Mercœur Székesfehérvár, som osmanerna återtog 1602.
