Long Turkish War: Långa turkiska kriget
A war of thirteen years between the Habsburg Monarchy and the Ottoman Empire, fought mainly in Hungary, Croatia and the Danubian principalities, and known in Hungary as the Fifteen Years’ War. Transylvania, Wallachia and Moldavia joined the Habsburg side in 1594–1595, and Michael the Brave of Wallachia briefly ruled all three principalities in 1600. Neither empire could break the other’s chain of fortresses, and after the Hungarian rising led by Stephen Bocskai the war ended in the Peace of Zsitvatorok of 1606, which left the border much as it had been.: Ett trettonårigt krig mellan habsburgska monarkin och Osmanska riket, som främst utkämpades i Ungern, Kroatien och Donaufurstendömena och i Ungern kallas femtonårskriget. Transsylvanien, Valakiet och Moldavien gick över till den habsburgska sidan 1594–1595, och Mikael den tapre av Valakiet härskade en kort tid över alla tre furstendömena 1600. Inget av imperierna kunde bryta igenom det andras fästningskedja, och efter det ungerska upproret under István Bocskai slutade kriget med freden i Zsitvatorok 1606, som lämnade gränsen i stort sett oförändrad.
