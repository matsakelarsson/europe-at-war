Sigismund Báthory gave up Transylvania twice, and in 1599 handed it to his cousin, Cardinal Andrew Báthory, who looked to Poland and demanded that Michael step down. Michael, with the emperor’s approval, crossed the Carpathians and beat Andrew at Șelimbăr near Sibiu on 28 October 1599; Andrew was killed by Székelys as he fled. On 1 November Michael entered Alba Iulia and ruled Transylvania as the emperor’s governor. In May 1600 he drove Ieremia Movilă out of Moldavia, and for a few months he styled himself prince of Wallachia, Transylvania and Moldavia.: Sigismund Báthory avstod två gånger från Transsylvanien och överlämnade det 1599 till sin kusin, kardinal Andreas Báthory, som sökte stöd hos Polen och krävde att Mikael skulle avgå. Mikael gick med kejsarens godkännande över Karpaterna och besegrade Andreas vid Șelimbăr nära Sibiu den 28 oktober 1599; Andreas dödades av szeklare under flykten. Den 1 november tågade Mikael in i Alba Iulia och styrde Transsylvanien som kejsarens ståthållare. I maj 1600 drev han Ieremia Movilă ut ur Moldavien, och under några månader kallade han sig furste av Valakiet, Transsylvanien och Moldavien.
Since the 19th century Romanian nationalists have seen this as the first union of the lands that now form Romania. In his own time Michael relied on the Hungarian, Székely and Saxon estates and did not give new rights to the Romanian peasants, and his rule was short. The Transylvanian nobles rose against him and, with the imperial general Giorgio Basta, beat him at Mirăslău on 18 September 1600, while the Polish chancellor Jan Zamoyski restored Movilă in Moldavia and defeated Michael at Bucov in October. Michael won back the emperor’s support and, with Basta, beat Sigismund Báthory at Guruslău on 3 August 1601, but days later Basta’s soldiers killed him near Câmpia Turzii.: Sedan 1800-talet har rumänska nationalister sett detta som den första föreningen av de länder som i dag utgör Rumänien. Under sin egen tid stödde sig Mikael på de ungerska, szekliska och sachsiska stånden och gav inte de rumänska bönderna några nya rättigheter, och hans styre blev kort. Den transsylvanska adeln reste sig mot honom och besegrade honom tillsammans med den kejserlige generalen Giorgio Basta vid Mirăslău den 18 september 1600, medan den polske kanslern Jan Zamoyski återinsatte Movilă i Moldavien och besegrade Mikael vid Bucov i oktober. Mikael återvann kejsarens stöd och besegrade tillsammans med Basta Sigismund Báthory vid Guruslău den 3 augusti 1601, men några dagar senare dödades han av Bastas soldater nära Câmpia Turzii.
