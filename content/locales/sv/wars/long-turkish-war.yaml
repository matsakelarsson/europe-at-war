Pope Clement VIII worked to bring the Ottoman vassals into the war, and in the winter of 1594–1595 Sigismund Báthory of Transylvania, Michael of Wallachia and Aron of Moldavia joined the emperor. In November 1594 Michael had the Ottoman creditors and soldiers in Bucharest killed and attacked the Ottoman fortresses on the Danube, among them Giurgiu, Brăila and Silistra. In the summer of 1595 Koca Sinan Pasha crossed the Danube with a large army to make Wallachia an Ottoman province, and on 23 August Michael, with about 16,000 men, met him in the marshy valley of the Neajlov at Călugăreni.: Påve Clemens VIII arbetade för att få in de osmanska vasallerna i kriget, och vintern 1594–1595 anslöt sig Sigismund Báthory av Transsylvanien, Mikael av Valakiet och Aron av Moldavien till kejsaren. I november 1594 lät Mikael döda de osmanska fordringsägarna och soldaterna i Bukarest och angrep de osmanska fästningarna vid Donau, bland dem Giurgiu, Brăila och Silistra. Sommaren 1595 gick Koca Sinan pasha över Donau med en stor armé för att göra Valakiet till en osmansk provins, och den 23 augusti mötte Mikael honom med omkring 16 000 man i Neajlovs sumpiga dal vid Călugăreni.
The Wallachians held the field and drove back the Ottoman attacks, but Michael was too weak to follow up and withdrew to the mountains. Sinan occupied Bucharest and Târgoviște and fortified them. In October Sigismund Báthory came down from Transylvania with his army, joined by Michael and by imperial and Tuscan troops; they retook Târgoviște on 18 October and Bucharest soon after, and caught Sinan’s army as it crossed the Danube at Giurgiu, destroying its rearguard. In Hungary the imperial army had taken Esztergom on 2 September.: Valakerna behöll slagfältet och drev tillbaka de osmanska anfallen, men Mikael var för svag för att utnyttja segern och drog sig tillbaka till bergen. Sinan besatte Bukarest och Târgoviște och befäste dem. I oktober kom Sigismund Báthory ned från Transsylvanien med sin armé, och fick sällskap av Mikael och av kejserliga och toskanska trupper; de återtog Târgoviște den 18 oktober och Bukarest kort därefter, och hann upp Sinans armé när den gick över Donau vid Giurgiu och förintade dess eftertrupp. I Ungern hade den kejserliga armén intagit Esztergom den 2 september.
