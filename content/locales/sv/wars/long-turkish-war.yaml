Dates are Gregorian, which the Habsburg lands, Hungary and Transylvania used by then. Wallachia and Moldavia kept the Julian calendar, ten days behind, so Romanian sources often give Michael the Brave’s battles ten days earlier (Călugăreni 13 August, Șelimbăr 18 October).: Datumen anges enligt den gregorianska kalendern, som de habsburgska länderna, Ungern och Transsylvanien då använde. Valakiet och Moldavien behöll den julianska kalendern, tio dagar efter, så rumänska källor anger ofta Mikael den tapres slag tio dagar tidigare (Călugăreni 13 augusti, Șelimbăr 18 oktober).
The sides changed during the war. Transylvania fought with the Habsburgs in 1595–1598 but later turned against them; Moldavia was ruled in turn by princes allied to Transylvania, to Poland and to Michael the Brave. Numbers of soldiers and dead come mostly from accounts of the time and are uncertain.: Sidorna skiftade under kriget. Transsylvanien stred med habsburgarna 1595–1598 men vände sig senare mot dem; Moldavien styrdes i tur och ordning av furstar allierade med Transsylvanien, med Polen och med Mikael den tapre. Uppgifterna om antalet soldater och döda kommer mest från samtida berättelser och är osäkra.
The rising led by Stephen Bocskai in 1604–1606 has its own entry. The Hundred Years’ Croatian–Ottoman War, which ended at Sisak, has its own entry too.: Det uppror som István Bocskai ledde 1604–1606 har en egen post. Det hundraåriga kroatisk-osmanska kriget, som slutade vid Sisak, har också en egen post.
