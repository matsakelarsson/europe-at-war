# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
Lord Dunmore’s War: Lord Dunmores krig
? "A war between the colony of Virginia and the Shawnee and Mingo of the Ohio country. At the Treaty of Fort Stanwix in 1768 the Haudenosaunee sold Britain the land south of the Ohio River, which the Shawnee, Lenape and Mingo who hunted there had never agreed to give up, and Virginian surveyors and settlers moved into Kentucky and the upper Ohio valley. After years of killings on both sides, a party of frontiersmen under Daniel Greathouse murdered a group of Mingo at Yellow Creek on 30 April 1774, among them relatives of the Mingo leader Logan, who took revenge on the settlements with Shawnee and Mingo war parties. Virginia’s governor, John Murray, Earl of Dunmore, sent two armies: about 1,700 men under his own command down the Ohio from Fort Pitt, and about 1,100 under Andrew Lewis down the Kanawha. On 10 October 1774 the Shawnee leader Cornstalk attacked Lewis’s camp at Point Pleasant, where the Kanawha joins the Ohio; after a day of fighting the Shawnee withdrew across the Ohio, having lost about 40 men against some 75 Virginians killed and 140 wounded. At Camp Charlotte on 19 October the Shawnee agreed to stop hunting south of the Ohio and to leave travellers on the river alone. Logan refused to attend; the speech sent in his name, “Logan’s Lament”, became famous. The peace opened Kentucky to settlement and lasted only until the Shawnee joined the wars of the American Revolution."
: "Ett krig mellan kolonin Virginia och shawnee och mingo i Ohiolandet. Vid fördraget i Fort Stanwix 1768 sålde haudenosaunee landet söder om Ohiofloden till Storbritannien, något som de shawnee, lenape och mingo som jagade där aldrig hade gått med på, och lantmätare och nybyggare från Virginia flyttade in i Kentucky och övre Ohiodalen. Efter år av dödande på båda sidor mördade en skara gränsbor under Daniel Greathouse en grupp mingo vid Yellow Creek den 30 april 1774, bland dem släktingar till mingoledaren Logan, som hämnades på bosättningarna med krigarskaror från shawnee och mingo. Virginias guvernör, John Murray, earl av Dunmore, sände två arméer: omkring 1 700 man under eget befäl nedför Ohio från Fort Pitt och omkring 1 100 under Andrew Lewis nedför Kanawha. Den 10 oktober 1774 anföll shawneeledaren Cornstalk Lewis läger vid Point Pleasant, där Kanawha flyter samman med Ohio; efter en dags strider drog sig shawnee tillbaka över Ohio, sedan de hade förlorat omkring 40 man mot omkring 75 dödade och 140 sårade på virginiasidan. I Camp Charlotte den 19 oktober gick shawnee med på att sluta jaga söder om Ohio och att låta de resande på floden vara i fred. Logan vägrade att närvara; det tal som sändes i hans namn, ”Logans klagan”, blev berömt. Freden öppnade Kentucky för bosättning och varade bara tills shawnee gick in i den amerikanska revolutionens krig."
