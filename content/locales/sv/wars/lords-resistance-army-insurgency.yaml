# Svenska översättningar av katalogtexten (våg 13); stegtexterna kommer senare.
Lord’s Resistance Army insurgency: Herrens motståndsarmés uppror
? "The war waged by Joseph Kony’s Lord’s Resistance Army (LRA), first against the government of Yoweri Museveni in northern Uganda and later in the borderlands of South Sudan, the Democratic Republic of the Congo and the Central African Republic. It grew out of the defeat of the northern army in 1986 and of Alice Lakwena’s Holy Spirit Movement, and drew on Acholi grievances, Christian and spiritual beliefs and Kony’s own claims of prophecy. The LRA became known for the abduction of children to serve as fighters, porters and “wives”: a University of California, Berkeley study estimated that by 2006 it had taken 24,000–38,000 children and 28,000–37,000 adults. Sudan armed it from 1994 in return for Uganda’s support of southern Sudanese rebels. To deny it support, the Ugandan government forced most of the Acholi population, up to 1.5–2 million people, into camps where disease and hunger killed far more people than the rebels did, according to World Health Organization data. The UN estimates that more than 100,000 people were killed. Museveni referred the LRA to the International Criminal Court, which issued its first ever arrest warrants in 2005 against Kony and four commanders. Peace talks in Juba in 2006–2008 brought calm to northern Uganda, but Kony never signed the final agreement. Driven from Garamba in the Congo by a regional offensive in December 2008, the LRA massacred hundreds of Congolese civilians and spread into the CAR and Sudan’s Kafia Kingi enclave, pursued by Ugandan troops, an African Union task force and US special forces until 2017. It has since shrunk to a small band, but Kony remains at large; in November 2025 the ICC confirmed 39 counts of war crimes and crimes against humanity against him in his absence, and in 2026 attacks and abductions in the south-east of the CAR were again attributed to the LRA."
: "Det krig som Joseph Konys Herrens motståndsarmé (LRA) förde, först mot Yoweri Musevenis regering i norra Uganda och senare i gränsområdena mellan Sydsudan, Demokratiska republiken Kongo och Centralafrikanska republiken. Det växte fram ur nederlaget för den nordliga armén 1986 och för Alice Lakwenas Helige Andes rörelse, och det byggde på acholifolkets missnöje, kristna och andliga föreställningar och Konys egna anspråk på profetgåva. LRA blev känd för att röva bort barn som fick tjäna som soldater, bärare och ”hustrur”: en studie från University of California, Berkeley uppskattade att rörelsen fram till 2006 hade tagit 24 000–38 000 barn och 28 000–37 000 vuxna. Sudan beväpnade den från 1994 som motprestation för Ugandas stöd till sydsudanesiska rebeller. För att beröva den stöd tvingade den ugandiska regeringen större delen av acholibefolkningen, upp till 1,5–2 miljoner människor, in i läger där sjukdomar och hunger dödade långt fler människor än rebellerna gjorde, enligt uppgifter från Världshälsoorganisationen. FN uppskattar att mer än 100 000 människor dödades. Museveni hänsköt LRA till Internationella brottmålsdomstolen, som 2005 utfärdade sina allra första arresteringsorder, mot Kony och fyra befälhavare. Fredssamtal i Juba 2006–2008 förde lugn till norra Uganda, men Kony undertecknade aldrig slutavtalet. Sedan LRA drivits från Garamba i Kongo av en regional offensiv i december 2008 massakrerade rörelsen hundratals kongolesiska civila och spred sig till Centralafrikanska republiken och Sudans enklav Kafia Kingi, förföljd av ugandiska trupper, en styrka från Afrikanska unionen och amerikanska specialstyrkor fram till 2017. Den har sedan dess krympt till ett litet band, men Kony är fortfarande på fri fot; i november 2025 fastställde Internationella brottmålsdomstolen 39 åtalspunkter om krigsförbrytelser och brott mot mänskligheten mot honom i hans frånvaro, och 2026 tillskrevs anfall och bortföranden i sydöstra Centralafrikanska republiken återigen LRA."
