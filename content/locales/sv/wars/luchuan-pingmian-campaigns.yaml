Luchuan–Pingmian campaigns: Fälttågen mot Luchuan–Pingmian
? Four Ming campaigns against Möng Mao, the Tai (Shan) state of the Shweli valley on today’s border between Yunnan and Myanmar, which the Ming called the Luchuan–Pingmian pacification commission. Its ruler Si Renfa (Thonganbwa in Burmese) stopped paying tribute and from 1437 annexed the lands of neighbouring chiefs under Ming protection. A first campaign under Mu Sheng and Fang Zheng ended in defeat in 1439. Under the influence of the palace eunuch Wang Zhen the court sent a much larger army under the minister of war Wang Ji, which took Si Renfa’s base in January 1442. Si Renfa fled to Ava, whose king Narapati held him as a bargaining counter and handed him over in 1445–1446, after Ming armies had come into Burma. Two more campaigns, in 1443 and 1449, pursued his son Si Jifa to Mong Yang (Mohnyin), west of the Irrawaddy, without capturing him; the Shan were allowed to stay there if they never crossed the river eastwards. The wars broke Möng Mao but cost the Ming dearly, and the Tumu crisis, in which the Mongols captured the emperor and killed Wang Zhen, followed months after the last campaign.
: Fyra Mingfälttåg mot Möng Mao, taistaten (shanstaten) i Shwelidalen vid dagens gräns mellan Yunnan och Myanmar, som Ming kallade pacificeringskommissionen Luchuan–Pingmian. Dess härskare Si Renfa (Thonganbwa på burmesiska) slutade betala tribut och annekterade från 1437 grannhövdingarnas länder, som stod under Mings beskydd. Ett första fälttåg under Mu Sheng och Fang Zheng slutade med nederlag 1439. Under inflytande av palatseunucken Wang Zhen sände hovet en mycket större armé under krigsministern Wang Ji, som intog Si Renfas bas i januari 1442. Si Renfa flydde till Ava, vars kung Narapati höll honom som ett förhandlingskort och lämnade ut honom 1445–1446, sedan Mingarméer hade dragit in i Burma. Ytterligare två fälttåg, 1443 och 1449, förföljde hans son Si Jifa till Mong Yang (Mohnyin), väster om Irrawaddy, utan att tillfångata honom; shanerna fick stanna där så länge de aldrig gick över floden österut. Krigen bröt Möng Maos makt men kostade Ming dyrt, och Tumukrisen, då mongolerna tillfångatog kejsaren och dödade Wang Zhen, följde bara månader efter det sista fälttåget.
