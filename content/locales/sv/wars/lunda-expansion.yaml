# Svenska översättningar av katalogtexten (våg 13); stegtexterna kommer senare.
Lunda expansion: Lundarikets expansion
? "The growth of the Lunda state of the mwant yav (Mwata Yamvo), from its heartland on the upper Kasai and Bushimaie rivers in south-western Katanga, into a commonwealth of tributary chiefdoms that reached from the Kwango in the west to the Luapula in the east. Lunda traditions trace the kingship to the marriage of Ilunga Tshibinda, a hunter-prince from the Luba country, with the Lunda princess Ruwej (Lueji). The first ruler whom historians regard as well attested is Nawej, from about 1695: he campaigned against the Sala Mpasu to the north and was killed when an army of the Luba-speaking Kanyok kingdom invaded Lunda, until his successor Muland drove the Kanyok out. Under Yav a Nawej, in the 1720s or thereabouts, the war leader Mai pushed the frontier west across the Kasai against the Lulua, and Muteb led settlers and soldiers north-west along the Kwilu. Around 1740 a Lunda general, the first Mwata Kazembe, Ng’anga Bilonda, led a force east in pursuit of a rival; his successor Kanyembo crossed the Luapula, conquered the Shila and founded the Kingdom of Kazembe, which grew rich on the fisheries of Lake Mweru, the copper of Katanga and trade with the east coast, and which the Portuguese said could raise 20,000 men. The Lunda absorbed conquered chiefs as tributaries rather than replacing them, and their state reached perhaps 300,000 km² at its height in the 19th century. Their wars fed the Atlantic slave trade: Lunda caravans sold captives and ivory to the Imbangala kingdom of Kasanje and to Matamba, which passed them on to Portuguese traders at Luanda, and in the 1760s the Lunda attacked Kasanje and Matamba, apparently to trade with the Portuguese directly, but could not subdue them. Kazembe traded with Portuguese Mozambique and with Swahili and Arab merchants, and turned away the Portuguese missions of 1798 (Francisco de Lacerda, who died at Kazembe’s court) and 1831 (José Monteiro and António Gamito). From the 1850s the Yeke of Msiri took Kazembe’s lands west of the Luapula, and in the 1880s Chokwe hunters and traders, armed with guns bought from the Ovimbundu, overran the Lunda heartland."
: "Hur mwant yavs (Mwata Yamvos) lundastat växte från kärnlandet vid floderna Kasai och Bushimaie i sydvästra Katanga till ett statsförbund av tributskyldiga hövdingadömen som sträckte sig från Kwango i väster till Luapula i öster. Lundatraditionerna härleder kungadömet till giftermålet mellan Ilunga Tshibinda, en jägarprins från lubafolkets land, och lundaprinsessan Ruwej (Lueji). Den förste härskare som historikerna anser vara väl belagd är Nawej, från omkring 1695: han förde krig mot sala mpasu i norr och dödades när en armé från det lubatalande kungariket Kanyok invaderade Lunda, en invasion som varade tills hans efterträdare Muland drev ut kanyok. Under Yav a Nawej, på 1720-talet eller däromkring, sköt krigsledaren Mai gränsen västerut över Kasai mot lulua, och Muteb ledde bosättare och soldater mot nordväst längs Kwilu. Omkring 1740 ledde en lundageneral, den förste Mwata Kazembe, Ng’anga Bilonda, en styrka österut i jakt på en rival; hans efterträdare Kanyembo gick över Luapula, erövrade shila och grundade kungariket Kazembe, som blev rikt på fisket i Mwerusjön, Katangas koppar och handeln med östkusten, och som enligt portugiserna kunde ställa upp 20 000 man. Lundafolket införlivade erövrade hövdingar som tributskyldiga i stället för att ersätta dem, och deras stat omfattade kanske 300 000 km² när den stod på sin höjdpunkt på 1800-talet. Deras krig gav näring åt den atlantiska slavhandeln: lundakaravaner sålde fångar och elfenben till imbangalafolkets kungarike Kasanje och till Matamba, som förde dem vidare till portugisiska handelsmän i Luanda, och på 1760-talet angrep lundafolket Kasanje och Matamba, uppenbarligen för att kunna handla direkt med portugiserna, men kunde inte underkuva dem. Kazembe handlade med Portugisiska Moçambique och med swahiliska och arabiska köpmän och avvisade de portugisiska beskickningarna 1798 (Francisco de Lacerda, som dog vid Kazembes hov) och 1831 (José Monteiro och António Gamito). Från 1850-talet tog Msiris yeke Kazembes landområden väster om Luapula, och på 1880-talet överrände chokwejägare och chokwehandelsmän, beväpnade med gevär som de köpt av ovimbundu, lundafolkets kärnland."
