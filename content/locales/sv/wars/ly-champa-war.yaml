# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
Lý–Champa war of 1069: Kriget mellan Lý och Champa 1069
? "A seaborne expedition against Champa led by the Lý emperor Lý Thánh Tông of Đại Việt, with the eunuch general Lý Thường Kiệt in command of the vanguard. The Vietnamese chronicles give as its cause the Cham raids on the border that followed a tribute mission in 1068. In the spring of 1069 the fleet sailed south, defeated the Cham army and burned the capital, Vijaya (in today’s Bình Định); the king, whom the chronicles call Chế Củ and modern historians usually identify with Rudravarman III, fled towards Cambodia and was captured. Brought to Thăng Long, he bought his release by ceding three northern districts, Địa Lý, Ma Linh and Bố Chính, which make up most of today’s Quảng Bình and northern Quảng Trị; thousands of Cham captives were settled near the capital. It was Đại Việt’s first lasting gain of Cham land, though Vietnamese settlement there was slow. The account rests almost entirely on the Vietnamese chronicles: the historian Michael Vickery argued that the raid may have struck a regional Cham ruler at Amaravati rather than the king at Vijaya, and the chronicles’ claim that Champa then paid tribute until 1074 has no Cham confirmation. After a civil war, Harivarman IV reunited Champa by 1074 and fought off a new Vietnamese attack."
: "Ett sjöburet fälttåg mot Champa under ledning av Đại Việts Lýkejsare Lý Thánh Tông, med eunuckgeneralen Lý Thường Kiệt som befälhavare för förtruppen. De vietnamesiska krönikorna anger som orsak de chamiska räder mot gränsen som följde på en tributbeskickning 1068. Våren 1069 seglade flottan söderut, besegrade chamarmén och brände huvudstaden Vijaya (i dagens Bình Định); kungen, som krönikorna kallar Chế Củ och som moderna historiker oftast identifierar med Rudravarman III, flydde mot Kambodja och togs till fånga. Förd till Thăng Long köpte han sig fri genom att avträda tre nordliga distrikt, Địa Lý, Ma Linh och Bố Chính, som utgör större delen av dagens Quảng Bình och norra Quảng Trị; tusentals chamiska fångar bosattes nära huvudstaden. Det var Đại Việts första bestående landvinning på chamernas bekostnad, även om den vietnamesiska bosättningen där gick långsamt. Berättelsen vilar nästan helt på de vietnamesiska krönikorna: historikern Michael Vickery hävdade att räden kan ha drabbat en regional chamhärskare i Amaravati snarare än kungen i Vijaya, och krönikornas uppgift att Champa därefter betalade tribut fram till 1074 saknar bekräftelse från chamiskt håll. Efter ett inbördeskrig hade Harivarman IV återförenat Champa 1074 och slog tillbaka ett nytt vietnamesiskt anfall."
