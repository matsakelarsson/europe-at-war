# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
Lý–Song war: Kriget mellan Lý och Song
? "A war between Đại Việt under the Lý dynasty and the Song dynasty of China over the hill country between them, home of the Tai-speaking Nùng (Zhuang) clans whose allegiance both courts claimed. As the Song tightened its hold on the frontier under Wang Anshi’s New Policies, the Lý regent Lý Thường Kiệt struck first: in late 1075 one army of upland troops under Nùng Tông Đán marched down the Zuo River while a fleet took Qinzhou and Lianzhou on the coast, and in March 1076, after a siege of 42 days, the Vietnamese stormed Yongzhou (Nanning), destroyed the city and carried off thousands of captives. Song accounts put the dead of the campaign at 80,000 to 100,000. The Song answered with an invasion under Guo Kui at the end of 1076. It took the border districts and reached the Như Nguyệt (Cầu) river within a day’s march of Thăng Long, but failed to break Lý Thường Kiệt’s line, lost more than half its men to fighting and disease, and withdrew in the spring of 1077 after a peace offer. Talks over the captives and the border districts ended in 1084 with a line that the modern border largely follows."
: "Ett krig mellan Đại Việt under Lýdynastin och Kinas Songdynasti om bergslandet mellan dem, hemvist för de taitalande nùngklanerna (zhuang), vars trohet båda hoven gjorde anspråk på. När Song stärkte sitt grepp om gränslandet under Wang Anshis nya politik slog Lýregenten Lý Thường Kiệt till först: i slutet av 1075 tågade en armé av höglandstrupper under Nùng Tông Đán nedför Zuofloden medan en flotta intog Qinzhou och Lianzhou vid kusten, och i mars 1076, efter en belägring på 42 dagar, stormade vietnameserna Yongzhou (Nanning), förstörde staden och förde bort tusentals fångar. Enligt Songkällorna dog 80 000 till 100 000 människor under fälttåget. Song svarade med en invasion under Guo Kui i slutet av 1076. Den intog gränsdistrikten och nådde floden Như Nguyệt (Cầu), en dagsmarsch från Thăng Long, men lyckades inte bryta Lý Thường Kiệts linje, förlorade mer än hälften av sina män i strider och sjukdomar och drog sig tillbaka våren 1077 efter ett fredserbjudande. Förhandlingarna om fångarna och gränsdistrikten avslutades 1084 med en gränslinje som den moderna gränsen i stort sett följer."
