# Svenska översättningar av katalogtexten (våg 13); stegtexterna kommer senare.
Maba Diakhou Bâ’s jihad: Maba Diakhou Bâs jihad
? "The war of the Muslim cleric Maba Diakhou Bâ, who took over the Mandinka kingdom of Badibu on the north bank of the Gambia, renamed it Rip and carried a jihad into the Wolof and Serer kingdoms to the north. A teacher of the Qur’an of Fula descent and a follower of the Tijaniyya order, whom Umar Tall is said to have made its leader in the region, he led the Muslim villages of Badibu against the raids of the king’s warriors and by 1861 ruled the country from his new capital, Nioro. He then conquered most of Saloum, sheltered the deposed kings of Cayor, among them Lat Dior, who converted to his strict Islam, and briefly took Jolof in 1865. His forces burned and enslaved villages that resisted, and he aimed to replace the Serer and Wolof kingdoms and their warrior aristocracies with a single Muslim state. France and Britain, which feared him and also armed him at times, could not stop him: France recognised him as almami of Badibu and Saloum in 1864, and his army, led by Lat Dior, drove off a large French column at Pathé Badiane in 1865. His invasion of the Serer kingdom of Sine ended on 18 July 1867, when the army of Maad a Sinig Kumba Ndoffene Famak Joof routed his forces in the rain near Somb and Maba was killed."
: "Det krig som fördes av den muslimske lärde Maba Diakhou Bâ, som tog makten i mandinkariket Badibu på Gambiaflodens norra strand, gav det namnet Rip och förde en jihad in i wolof- och sererrikena i norr. Han var koranlärare av fulabörd och anhängare av tijaniyyaorden, som Umar Tall sägs ha gjort honom till ledare för i regionen, och han ledde de muslimska byarna i Badibu mot räderna från kungens krigare och styrde 1861 landet från sin nya huvudstad Nioro. Därefter erövrade han större delen av Saloum, gav skydd åt Cayors avsatta kungar, bland dem Lat Dior, som omvände sig till hans stränga islam, och intog för en kort tid Jolof 1865. Hans styrkor brände och förslavade byar som gjorde motstånd, och hans mål var att ersätta serer- och wolofrikena och deras krigararistokratier med en enda muslimsk stat. Frankrike och Storbritannien, som fruktade honom men ibland också beväpnade honom, kunde inte stoppa honom: Frankrike erkände honom 1864 som almami av Badibu och Saloum, och hans armé, ledd av Lat Dior, drev bort en stor fransk kolonn vid Pathé Badiane 1865. Hans invasion av sererriket Sine slutade den 18 juli 1867, när Maad a Sinig Kumba Ndoffene Famak Joofs armé slog hans styrkor på flykten i regnet nära Somb och Maba dödades."
