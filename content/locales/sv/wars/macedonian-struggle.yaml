Pavlos Melas (Wikipedia): Pavlos Melas (Wikipedia)
Known in Greece as the Makedonikos Agonas. The wider rivalry over Macedonia ran from the 1890s to 1912; 1904–1908 were the years of open guerrilla war between the bands.: I Grekland kallad Makedonikos Agonas. Den bredare rivaliteten om Makedonien pågick från 1890-talet till 1912; 1904–1908 var åren av öppet gerillakrig mellan banden.
Villages were pressed to declare for the Greek Patriarchate or the Bulgarian Exarchate. The death of the Greek officer Pavlos Melas in October 1904 drew many volunteers from Greece.: Byarna pressades att förklara sig för det grekiska patriarkatet eller det bulgariska exarkatet. Den grekiske officeren Pavlos Melas död i oktober 1904 lockade många frivilliga från Grekland.
