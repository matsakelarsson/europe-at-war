Macedonian Struggle: Makedonska kampen
An irregular war in Ottoman Macedonia after the failed Ilinden rising of 1903, in which armed bands backed by Greece and pro-Bulgarian bands, chiefly those of the Internal Macedonian-Adrianople Revolutionary Organisation (IMRO), fought each other, Serbian bands and Ottoman troops for the loyalty of the Slavic-speaking Christian villages. Villages were burned and priests, teachers and notables murdered on all sides until the Young Turk Revolution of July 1908 largely ended the fighting, though it went on at a lower level until the Balkan Wars.: Ett irreguljärt krig i det osmanska Makedonien efter det misslyckade Ilindenupproret 1903, där väpnade band med stöd av Grekland och probulgariska band, främst Inre makedonsk-adrianopolitanska revolutionära organisationens (IMRO), kämpade mot varandra, mot serbiska band och mot osmanska trupper om lojaliteten hos de slaviskspråkiga kristna byarna. Byar brändes och präster, lärare och lokala notabiliteter mördades av alla sidor tills den ungturkiska revolutionen i juli 1908 i stort sett gjorde slut på striderna, även om de fortsatte i mindre skala fram till Balkankrigen.
Greek armed bands: Grekiska väpnade band
IMRO and Bulgarian-backed bands: IMRO och bulgariskstödda band
Serbian bands (chetniks): Serbiska band (tjetniker)
Ottoman Empire: Osmanska riket
