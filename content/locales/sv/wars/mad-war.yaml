Mad War and the Franco-Breton War: Galna kriget och fransk-bretonska kriget
The last revolt of the great French princes against the crown, and the war that ended Brittany’s independence. During the regency of Anne of Beaujeu for the young Charles VIII, Louis of Orléans, Francis II of Brittany and their allies rose in what was called the Mad War (la Guerre folle). On 28 July 1488 the royal army under Louis de La Trémoille routed the Breton army at Saint-Aubin-du-Cormier and captured Orléans, and the Treaty of Le Verger forbade the duke to marry off his daughters without the king’s consent. Francis died weeks later, and his heir, the young Duchess Anne, fought on with English, Spanish and Habsburg help and married Maximilian of Austria by proxy. The French besieged her in Rennes in 1491, and on 6 December she married Charles VIII, bringing Brittany to the French crown.: De stora franska furstarnas sista revolt mot kronan, och det krig som gjorde slut på Bretagnes självständighet. Under Anna av Beaujeus förmyndarregering för den unge Karl VIII reste sig Ludvig av Orléans, Frans II av Bretagne och deras allierade i det som kallades galna kriget (la Guerre folle). Den 28 juli 1488 slog den kungliga hären under Louis de La Trémoille den bretonska hären på flykt vid Saint-Aubin-du-Cormier och tog Orléans till fånga, och freden i Le Verger förbjöd hertigen att gifta bort sina döttrar utan kungens samtycke. Frans dog några veckor senare, och hans arvtagare, den unga hertiginnan Anna, kämpade vidare med engelsk, spansk och habsburgsk hjälp och gifte sig per ombud med Maximilian av Österrike. Fransmännen belägrade henne i Rennes 1491, och den 6 december gifte hon sig med Karl VIII, varigenom Bretagne kom under den franska kronan.
