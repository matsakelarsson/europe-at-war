Mahdist–Ethiopian War: Mahdistisk-etiopiska kriget
? War between Emperor Yohannes IV of Ethiopia and the Mahdist state of the Sudan. By the Hewett Treaty of June 1884 Ethiopia agreed to help evacuate the Egyptian garrisons cut off by the Mahdist rising on its border, in return for the Bogos country and free transit through Massawa; the Mahdists treated this as an act of war. Ras Alula defeated Osman Digna at Kufit in September 1885. In January 1887 King Tekle Haymanot of Gojjam sacked the Mahdist border town of Gallabat, and in reply the Mahdist general Abu Anja defeated him at Sar Weha in January 1888 and sacked Gondar, burning its churches and carrying off captives. Yohannes, who had also to face the Italians on the coast and a restless Menelik of Shewa, led a great army against the Mahdist fortifications at Gallabat in March 1889. His army was close to victory when he was mortally wounded; it broke up in retreat, and the Mahdists sent his head to Omdurman. The war exhausted both sides and opened the way for Menelik’s accession and Italy’s advance into Eritrea.
: Krig mellan kejsar Yohannes IV av Etiopien och mahdiststaten i Sudan. Genom Hewettfördraget i juni 1884 åtog sig Etiopien att hjälpa till att evakuera de egyptiska garnisoner vid dess gräns som mahdistresningen hade skurit av, i utbyte mot Bogoslandet och fri transit genom Massawa; mahdisterna betraktade detta som en krigshandling. Ras Alula besegrade Osman Digna vid Kufit i september 1885. I januari 1887 plundrade kung Tekle Haymanot av Gojjam mahdisternas gränsstad Gallabat, och som svar besegrade den mahdistiske generalen Abu Anja honom vid Sar Weha i januari 1888 och plundrade Gondar, där han brände kyrkorna och förde bort fångar. Yohannes, som också måste möta italienarna vid kusten och en rastlös Menelik av Shewa, ledde i mars 1889 en stor armé mot mahdisternas befästningar vid Gallabat. Hans armé var nära segern när han dödligt sårades; den upplöstes under återtåget, och mahdisterna sände hans huvud till Omdurman. Kriget utmattade båda sidor och öppnade vägen för Meneliks tronbestigning och Italiens frammarsch i Eritrea.
