Mahdist War: Mahdistkriget
? The rising that ended Egyptian rule in Sudan, the Mahdist State that followed, and its conquest by an Anglo-Egyptian army. In 1881 Muhammad Ahmad, a Sufi teacher from Dongola, proclaimed himself the Mahdi, the guide expected to restore Islam before the end of time, and called for war against the “Turks”, the Egyptian government whose taxes, officials and campaigns against the slave trade had made it hated. His followers, the Ansar, destroyed the Egyptian forces sent against them, took El Obeid in January 1883 and annihilated William Hicks’s army at Shaykan in November. Britain, which had occupied Egypt in 1882, decided to give up Sudan and sent Charles Gordon to Khartoum to organise the withdrawal; he stayed, was besieged, and was killed when the Mahdists stormed the city on 26 January 1885, two days before a British relief force arrived. The Mahdi died that June, and his successor, the Khalifa Abdallahi, ruled the Mahdist State from Omdurman for thirteen years of war with Ethiopia, Egypt and Italy, and of famine. From 1896 Herbert Kitchener led an Egyptian and British army up the Nile, building a railway as it went; it destroyed the Mahdist army at Omdurman on 2 September 1898, and the Khalifa was killed at Umm Diwaykarat in November 1899. Sudan became an Anglo-Egyptian condominium. How many people died in the wars and famines of these years is unknown; contemporary British claims that the population fell by more than half are now thought exaggerated.
: Den resning som gjorde slut på det egyptiska styret i Sudan, den mahdiststat som följde och dess erövring av en anglo-egyptisk armé. År 1881 utropade Muhammad Ahmad, en sufisk lärare från Dongola, sig till Mahdi, den vägledare som väntades återupprätta islam före tidens slut, och manade till krig mot ”turkarna”, den egyptiska regering vars skatter, ämbetsmän och fälttåg mot slavhandeln hade gjort den hatad. Hans anhängare, ansar, förintade de egyptiska styrkor som sändes mot dem, intog El Obeid i januari 1883 och tillintetgjorde William Hicks armé vid Shaykan i november. Storbritannien, som hade ockuperat Egypten 1882, beslöt att ge upp Sudan och sände Charles Gordon till Khartoum för att organisera tillbakadragandet; han stannade kvar, belägrades och dödades när mahdisterna stormade staden den 26 januari 1885, två dagar innan en brittisk undsättningsstyrka anlände. Mahdin dog i juni samma år, och hans efterträdare, kalifen Abdallahi, styrde mahdiststaten från Omdurman under tretton år av krig mot Etiopien, Egypten och Italien, och av hungersnöd. Från 1896 ledde Herbert Kitchener en egyptisk och brittisk armé uppför Nilen och byggde en järnväg under framryckningen; den förintade mahdistarmén vid Omdurman den 2 september 1898, och kalifen dödades vid Umm Diwaykarat i november 1899. Sudan blev ett anglo-egyptiskt kondominat. Hur många som dog i dessa års krig och hungersnöder är okänt; samtida brittiska påståenden om att befolkningen minskade med mer än hälften anses i dag överdrivna.
