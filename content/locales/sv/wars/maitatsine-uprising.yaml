# Svenska översättningar av katalogtexten (våg 13); stegtexterna kommer senare.
Maitatsine uprisings: Maitatsineupproren
? "A series of violent clashes in northern Nigeria between the followers of the preacher Muhammad Marwa, known as Maitatsine (Hausa for “the one who damns”), and the security forces. Marwa, who came from Marwa (Maroua) in northern Cameroon, had preached in Kano since the 1940s against the use of radios, watches, bicycles and cars and against wealth, rejected much of the Islamic tradition and denounced the established religious and political authorities; he was deported by the colonial government, returned after independence and gathered a following, the ’Yan Tatsine, mostly among poor young migrants and Qur’anic students. In December 1980 attacks by his followers on other Muslims and on the police in Kano led to fighting that the police could not contain; the army crushed the uprising, and Marwa died, of his wounds or of a heart attack. The official toll was 4,177 civilians and about 135 police and soldiers killed; other estimates are around 5,000. Survivors carried the movement to other towns: riots in Bulumkutu near Maiduguri and in Kaduna in October 1982 killed over 3,000 people; in Yola and Jimeta in February–March 1984, under Marwa’s successor Musa Makaniki, about 1,000 died and half the town was left homeless; and in Gombe in April 1985 several hundred more were killed. Makaniki fled to Cameroon and was arrested in Nigeria in 2004. Some analysts see the uprisings as a forerunner of Boko Haram."
: "En serie våldsamma sammandrabbningar i norra Nigeria mellan anhängarna till predikanten Muhammad Marwa, känd som Maitatsine (hausa för ”den som fördömer”), och säkerhetsstyrkorna. Marwa, som kom från Marwa (Maroua) i norra Kamerun, hade sedan 1940-talet predikat i Kano mot användningen av radioapparater, armbandsur, cyklar och bilar och mot rikedom, förkastade mycket av den islamiska traditionen och fördömde de etablerade religiösa och politiska auktoriteterna; han utvisades av kolonialregeringen, återvände efter självständigheten och samlade en anhängarskara, ’Yan Tatsine, främst bland fattiga unga inflyttare och koranelever. I december 1980 ledde hans anhängares angrepp på andra muslimer och på polisen i Kano till strider som polisen inte kunde hejda; armén krossade upproret, och Marwa dog, av sina sår eller av en hjärtattack. Den officiella dödssiffran var 4 177 civila och omkring 135 poliser och soldater; andra uppskattningar ligger kring 5 000. Överlevande förde rörelsen vidare till andra städer: upplopp i Bulumkutu nära Maiduguri och i Kaduna i oktober 1982 dödade över 3 000 människor; i Yola och Jimeta i februari–mars 1984, under Marwas efterträdare Musa Makaniki, dog omkring 1 000 och halva staden blev hemlös; och i Gombe i april 1985 dödades ytterligare flera hundra. Makaniki flydde till Kamerun och greps i Nigeria 2004. Vissa bedömare ser upproren som en föregångare till Boko Haram."
