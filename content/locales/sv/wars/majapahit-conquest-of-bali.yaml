# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
Majapahit conquest of Bali: Majapahits erövring av Bali
? "The invasion that brought the Balinese kingdom of Bedulu (Bedahulu) under the rule of Majapahit, the empire of eastern Java. Bali had long been linked to Java: Airlangga was a son of the Balinese king Udayana, and Kertanagara of Singhasari had attacked the island in 1284. Under Queen Tribhuwana Wijayatunggadewi, her chief minister Gajah Mada, who had sworn not to rest until the islands of the archipelago were united under Majapahit, sent a fleet against Bali. According to the Babad Arya Tabanan, a later Balinese chronicle, the army landed in 1342 under Gajah Mada with Arya Damar, the regent of Palembang, as his second in command, and after seven months of fighting took the royal centre at Bedulu, near today’s Gianyar, in 1343. Balinese tradition names the last king of Bedulu as Sri Astasura Ratna Bumi Banten and tells how Majapahit first got rid of his great minister Kebo Iwa and then defeated the last commander to hold out, Pasung Grigis. Majapahit gave the government of the island to Arya Damar’s brothers, among them Arya Kenceng, the ancestor of the royal houses of Tabanan and Badung, and in about 1352 installed a Javanese prince, Sri Aji Kresna Kepakisan, as vassal king at Samprangan. His descendants ruled Bali from Gelgel and kept the Hindu-Javanese court culture of Majapahit after Java itself became Muslim."
: "Den invasion som förde det balinesiska kungariket Bedulu (Bedahulu) under Majapahit, riket på östra Java. Bali hade länge varit knutet till Java: Airlangga var son till den balinesiske kungen Udayana, och Kertanagara av Singhasari hade anfallit ön 1284. Under drottning Tribhuwana Wijayatunggadewi sände hennes förste minister Gajah Mada, som hade svurit att inte vila förrän öarna i arkipelagen var förenade under Majapahit, en flotta mot Bali. Enligt Babad Arya Tabanan, en senare balinesisk krönika, landsteg armén 1342 under Gajah Mada med Arya Damar, regenten i Palembang, som näst högste befälhavare, och intog efter sju månaders strider 1343 det kungliga centrumet i Bedulu, nära dagens Gianyar. Den balinesiska traditionen kallar Bedulus siste kung Sri Astasura Ratna Bumi Banten och berättar hur Majapahit först röjde hans store minister Kebo Iwa ur vägen och sedan besegrade den siste befälhavare som höll stånd, Pasung Grigis. Majapahit överlät styret av ön åt Arya Damars bröder, bland dem Arya Kenceng, stamfar till kungahusen i Tabanan och Badung, och omkring 1352 insattes en javanesisk prins, Sri Aji Kresna Kepakisan, som vasallkung i Samprangan. Hans ättlingar styrde Bali från Gelgel och bevarade Majapahits hindu-javanesiska hovkultur sedan Java självt hade blivit muslimskt."
