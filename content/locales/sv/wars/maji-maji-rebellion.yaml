# Svenska översättningar av katalogtexten (våg 13); stegtexterna kommer senare.
Maji Maji war: Maji Maji-kriget
? The largest rising against German rule in Africa, fought across the south of German East Africa (mainland Tanzania). Head taxes, forced labour and above all the communal cotton fields that Governor Gustav Adolf von Götzen imposed from 1902 had made German rule hated, and the drought of 1905 brought hunger. The healer Kinjikitile Ngwale gave his followers maji, water that was to turn German bullets to water. In late July 1905 the Matumbi people of the hills north-west of Kilwa uprooted the cotton and attacked traders and officials, and within weeks the rising spread across much of the south of the colony, uniting peoples of many languages, among them the Ngindo, Pogoro, Mbunga and the Ngoni of Songea. The machine guns of the German stations, above all at Mahenge on 30 August, broke the great assaults, and from October German columns of African soldiers (askari) and auxiliaries burned villages, crops and food stores to starve the rebels into surrender. The main fighting ended in April 1906 and the last bands in 1907–1908. Estimates of the dead, most of whom died of the famine that followed, range from 75,000 to 300,000; German losses were 15 Europeans and about 390 African soldiers and auxiliaries.
: Det största upproret mot tyskt styre i Afrika, utkämpat i hela den södra delen av Tyska Östafrika (Tanzanias fastland). Huvudskatter, tvångsarbete och framför allt de gemensamma bomullsfält som guvernören Gustav Adolf von Götzen påtvingade befolkningen från 1902 hade gjort det tyska styret hatat, och torkan 1905 förde med sig hunger. Helaren Kinjikitile Ngwale gav sina anhängare maji, vatten som skulle förvandla de tyska kulorna till vatten. I slutet av juli 1905 ryckte matumbifolket i bergen nordväst om Kilwa upp bomullen och angrep handelsmän och tjänstemän, och inom några veckor spred sig upproret över stora delar av koloniens södra del och förenade folk med många olika språk, bland dem ngindo, pogoro, mbunga och ngoni i Songea. De tyska stationernas kulsprutor, framför allt i Mahenge den 30 augusti, bröt de stora anfallen, och från oktober brände tyska kolonner av afrikanska soldater (askarier) och hjälptrupper byar, grödor och matförråd för att svälta upprorsmännen till underkastelse. De huvudsakliga striderna upphörde i april 1906, och de sista banden slutade strida 1907–1908. Uppskattningarna av antalet döda, av vilka de flesta dog i den hungersnöd som följde, varierar från 75 000 till 300 000; de tyska förlusterna uppgick till 15 européer och omkring 390 afrikanska soldater och hjälptrupper.
