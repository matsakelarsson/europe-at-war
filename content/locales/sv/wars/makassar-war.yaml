# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
Makassar War: Makassarkriget
? The war in which the Dutch East India Company (VOC) and the Bugis of Bone under Arung Palakka broke the power of Gowa, the Makassar sultanate of South Sulawesi. Under Sultan Hasanuddin Gowa ruled a maritime empire from the fortified port of Makassar, open to all traders, and stood in the way of the Company’s spice monopoly. Arung Palakka, a Bone prince who had led a failed Bugis revolt against Gowa in 1660, took refuge with the Company in Batavia. In November 1666 Admiral Cornelis Speelman sailed with 21 ships and about 1,860 men, among them Ambonese and Bugis troops. He forced a Makassarese army that had invaded Buton to surrender (January 1667), and Arung Palakka raised the Bugis of Bone and Soppeng. On 18 November 1667 Hasanuddin signed the Treaty of Bungaya, which gave the Company a trade monopoly and Makassar’s fort of Ujung Pandang and made Gowa a vassal. The war broke out again in 1668, and only after a long siege did Bugis and Company troops storm Gowa’s citadel, Somba Opu, on 22 June 1669. Gowa’s empire ended; Speelman built Fort Rotterdam as the Company’s base, and Arung Palakka, king of Bone from 1672, became the most powerful man in South Sulawesi. Thousands of Makassarese went into exile across the archipelago, where many fought on against the Company.
: Kriget där Nederländska ostindiska kompaniet (VOC) och buginerna i Bone under Arung Palakka bröt makten hos Gowa, makassarernas sultanat på södra Sulawesi. Under sultan Hasanuddin härskade Gowa över ett sjöfartsvälde från den befästa hamnstaden Makassar, som var öppen för alla handelsmän, och stod i vägen för kompaniets kryddmonopol. Arung Palakka, en prins från Bone som 1660 hade lett ett misslyckat buginskt uppror mot Gowa, tog sin tillflykt till kompaniet i Batavia. I november 1666 seglade amiral Cornelis Speelman med 21 fartyg och omkring 1 860 man, bland dem ambonesiska och buginska trupper. Han tvingade en makassarisk armé som hade invaderat Buton att kapitulera (januari 1667), och Arung Palakka fick buginerna i Bone och Soppeng att resa sig. Den 18 november 1667 undertecknade Hasanuddin Bungayafördraget, som gav kompaniet handelsmonopol och Makassars fort Ujung Pandang och gjorde Gowa till vasall. Kriget bröt ut igen 1668, och först efter en lång belägring stormade buginska trupper och kompanitrupper Gowas citadell, Somba Opu, den 22 juni 1669. Gowas välde var slut; Speelman byggde Fort Rotterdam som kompaniets bas, och Arung Palakka, kung av Bone från 1672, blev den mäktigaste mannen på södra Sulawesi. Tusentals makassarer gick i landsflykt runt om i arkipelagen, där många fortsatte att strida mot kompaniet.
