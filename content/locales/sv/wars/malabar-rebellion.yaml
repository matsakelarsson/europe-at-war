Malabar rebellion: Malabarupproret
An armed rising of Mappila Muslims in the southern taluks of Malabar district, in the Madras Presidency, in 1921–1922, also called the Moplah rebellion or the Mappila rebellion. It grew out of the Khilafat movement and long-standing grievances of Mappila tenants against Hindu landlords (jenmis) backed by British courts. On 20 August 1921 a police raid on a mosque at Tirurangadi to arrest Khilafat leaders led to clashes, and rebels under Ali Musliyar and then Variyankunnath Kunjahammad Haji attacked police stations, courts and treasuries and for some months ruled much of Eranad and Valluvanad. Martial law was declared and troops and the Malabar Special Police suppressed the rising by early 1922. By official figures 43 soldiers and police and about 2,337 rebels were killed and some 45,000 people imprisoned; unofficial estimates of all deaths reach about 10,000. Rebels also killed Hindus and forced conversions, and on 19–20 November 1921 some 70 Mappila prisoners died after being shut in a railway goods wagon.: Ett väpnat uppror bland mappilamuslimer i de södra talukerna i distriktet Malabar, i Madraspresidentskapet, 1921–1922, även kallat moplahupproret eller mappilaupproret. Det växte fram ur Khilafatrörelsen och mappilaarrendatorernas långvariga missnöje med hinduiska jordägare (jenmi), som hade stöd av brittiska domstolar. Den 20 augusti 1921 ledde en polisräd mot en moské i Tirurangadi för att gripa khilafatledare till sammandrabbningar, och rebeller under Ali Musliyar och sedan Variyankunnath Kunjahammad Haji angrep polisstationer, domstolar och skattkammare och behärskade under några månader stora delar av Eranad och Valluvanad. Krigslagar infördes, och trupper och Malabar Special Police hade slagit ned upproret i början av 1922. Enligt officiella siffror dödades 43 soldater och poliser och omkring 2 337 rebeller, och omkring 45 000 människor fängslades; inofficiella uppskattningar av det totala antalet döda når omkring 10 000. Rebellerna dödade också hinduer och genomförde tvångsomvändelser, och den 19–20 november 1921 dog omkring 70 mappilafångar sedan de hade stängts in i en godsvagn på järnvägen.
