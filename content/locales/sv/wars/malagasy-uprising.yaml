Malagasy Uprising: Malagassiska upproret
? "An armed nationalist rising against French colonial rule in eastern Madagascar, and its suppression. After the Second World War, Madagascar’s elected deputies in the French National Assembly, Joseph Raseta, Joseph Ravoahangy and Jacques Rabemananjara of the Democratic Movement for Malagasy Renewal (MDRM), sought independence by legal means and were rebuffed. On the night of 29 March 1947 fighters organised by the secret societies Panama and Jiny attacked French military posts and plantations around Moramanga and Manakara; at its height the rising held about a third of the island. France raised its forces from about 8,000 to 18,000 and later to about 30,000, mostly colonial troops from Africa, and crushed it with summary executions, torture, the burning of villages and massacres such as that at Moramanga station on 6 May 1947. The last leaders were taken in late 1948 and early 1949. The French authorities blamed the MDRM, dissolved it and had its deputies tried and sentenced, two of them to death, though their role in the rising remains disputed. The death toll is one of the most debated questions of French colonial history: the first official estimate was 89,000 Malagasy dead, revised in 1950 to 11,342 “known dead”, while the historian Jean Fremigacci estimates 30,000–40,000, many of them victims of hunger and disease among people who fled to the forests."
: "Ett väpnat nationalistiskt uppror mot det franska kolonialstyret på östra Madagaskar, och hur det slogs ned. Efter andra världskriget sökte Madagaskars valda deputerade i Frankrikes nationalförsamling, Joseph Raseta, Joseph Ravoahangy och Jacques Rabemananjara från Demokratiska rörelsen för malagassisk förnyelse (MDRM), självständighet på laglig väg men blev avvisade. Natten den 29 mars 1947 angrep kämpar som organiserats av de hemliga sällskapen Panama och Jiny franska militärposter och plantager kring Moramanga och Manakara; när upproret var som störst behärskade det omkring en tredjedel av ön. Frankrike ökade sina styrkor från omkring 8 000 till 18 000 och senare till omkring 30 000 man, mestadels kolonialtrupper från Afrika, och krossade upproret med summariska avrättningar, tortyr, nedbränning av byar och massakrer som den vid Moramangas station den 6 maj 1947. De sista ledarna togs i slutet av 1948 och början av 1949. De franska myndigheterna lade skulden på MDRM, upplöste partiet och lät ställa dess deputerade inför rätta och döma dem, två av dem till döden, även om deras roll i upproret fortfarande är omstridd. Dödssiffran är en av de mest omdebatterade frågorna i den franska kolonialhistorien: den första officiella uppskattningen var 89 000 döda malagasser, vilket 1950 reviderades till 11 342 ”kända döda”, medan historikern Jean Fremigacci uppskattar antalet till 30 000–40 000, många av dem offer för hunger och sjukdomar bland människor som flydde till skogarna."
