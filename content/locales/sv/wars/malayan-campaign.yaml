# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
Malayan campaign and the fall of Singapore: Fälttåget i Malaya och Singapores fall
? Japan’s conquest of British Malaya and Singapore in seventy days. In the first hours of 8 December 1941, about an hour before the attack on Pearl Harbor, the Japanese 25th Army under Lieutenant General Yamashita Tomoyuki landed at Kota Bharu in Malaya and at Singora (Songkhla) and Patani in southern Thailand, which let the Japanese through after a few hours of resistance. Two days later Japanese naval aircraft sank the battleships Prince of Wales and Repulse off Kuantan. With command of the air and sea, light tanks and troops on bicycles, the Japanese drove the British, Indian, Australian and Malay forces of Lieutenant General Arthur Percival down the peninsula, through the defeats at Jitra and Slim River and the battles of Gemas and Muar, and across the causeway to Singapore, the great naval base on which British strategy in the East had rested. They crossed the Johor Strait on 8 February 1942, and on 15 February Percival surrendered some 80,000 men, the largest surrender in British military history. In the following weeks the Japanese killed tens of thousands of Chinese men in Singapore and Malaya in the Sook Ching massacre. Malaya and Singapore stayed under Japanese occupation until September 1945.
: Japans erövring av Brittiska Malaya och Singapore på sjuttio dagar. Under de första timmarna av den 8 december 1941, ungefär en timme före anfallet mot Pearl Harbor, landsteg den japanska 25:e armén under generallöjtnant Yamashita Tomoyuki vid Kota Bharu i Malaya och vid Singora (Songkhla) och Patani i södra Thailand, som släppte igenom japanerna efter några timmars motstånd. Två dagar senare sänkte japanska marinflygplan slagskeppen Prince of Wales och Repulse utanför Kuantan. Med herraväldet i luften och till sjöss, lätta stridsvagnar och trupper på cykel drev japanerna generallöjtnant Arthur Percivals brittiska, indiska, australiska och malajiska styrkor söderut längs halvön, genom nederlagen vid Jitra och Slim River och striderna vid Gemas och Muar, och över vägbanken till Singapore, den stora flottbas som den brittiska strategin i Östern hade vilat på. De gick över Johorsundet den 8 februari 1942, och den 15 februari kapitulerade Percival med omkring 80 000 man, den största kapitulationen i brittisk militärhistoria. Under de följande veckorna dödade japanerna tiotusentals kinesiska män i Singapore och Malaya i Sook Ching-massakern. Malaya och Singapore förblev under japansk ockupation till september 1945.
