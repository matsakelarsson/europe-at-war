# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
Malayan Emergency: Undantagstillståndet i Malaya
? The guerrilla war between the Malayan Communist Party’s army, the Malayan National Liberation Army, and the British colonial government of the Federation of Malaya, with troops from across the Commonwealth, and from 1957 the independent Federation. The MCP, which had led the armed resistance to the Japanese occupation and drew most of its members from the Chinese community, turned to armed struggle in 1948, and after the killing of three European planters at Sungai Siput on 16 June the government declared a state of emergency. The guerrillas, a few thousand strong and supplied by a civilian network among the rural Chinese, attacked estates, mines, police posts and roads; the war reached its height in 1951, when they killed the High Commissioner, Sir Henry Gurney. Under the Briggs Plan some half a million people, most of them Chinese squatters, were forcibly resettled into guarded “New Villages”, and under General Sir Gerald Templer political concessions went together with food control, collective punishments and small-unit jungle warfare. Malaya’s march to independence in 1957 took away the communists’ main cause; talks at Baling in 1955 failed, but surrenders grew, and the government declared the Emergency over on 31 July 1960, with the remaining guerrillas across the Thai border. About 11,000 people were killed.
: Gerillakriget mellan Malayas kommunistpartis armé, Malayas nationella befrielsearmé, och den brittiska kolonialregeringen i Malajiska federationen, med trupper från hela samväldet, och från 1957 den självständiga federationen. MCP, som hade lett det väpnade motståndet mot den japanska ockupationen och hämtade de flesta av sina medlemmar ur den kinesiska befolkningsgruppen, övergick till väpnad kamp 1948, och efter mordet på tre europeiska plantageägare vid Sungai Siput den 16 juni utlyste regeringen undantagstillstånd. Gerillan, några tusen man stark och försörjd av ett civilt nätverk bland kineserna på landsbygden, anföll plantager, gruvor, polisposteringar och vägar; kriget nådde sin höjdpunkt 1951, då gerillan dödade högkommissarien, sir Henry Gurney. Enligt Briggsplanen tvångsförflyttades omkring en halv miljon människor, de flesta av dem kinesiska nybyggare utan rätt till marken, till bevakade ”nya byar”, och under general sir Gerald Templer gick politiska eftergifter hand i hand med livsmedelskontroll, kollektiva bestraffningar och djungelkrigföring i små förband. Malayas väg mot självständighet 1957 berövade kommunisterna deras viktigaste sak; samtalen i Baling 1955 misslyckades, men allt fler gerillasoldater gav upp, och regeringen förklarade undantagstillståndet avslutat den 31 juli 1960, då den återstående gerillan befann sig på andra sidan den thailändska gränsen. Omkring 11 000 människor dödades.
