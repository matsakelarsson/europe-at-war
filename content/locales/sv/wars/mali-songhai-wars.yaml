# Svenska översättningar av katalogtexten (våg 12); stegtexterna kommer senare.
Mali and Gao: Mali och Gao
? "The long contest for Gao and the middle Niger between the Mali Empire and the Songhai kings of Gao. Malian armies probably conquered the kingdom of Gao in the late thirteenth century, between about 1275 and 1300; the Timbuktu chronicles date its submission to Mansa Musa’s pilgrimage of 1324–1325, when he built a mosque at Gao on his way home, and Ibn Battuta, who passed through Gao in 1353, still found it part of Mali. Malian rule was not continuous: the ruler of Gao paid tribute and broke away whenever Mali was in difficulty. Songhai tradition tells how two princes held at the Mali court, Ali Kolon and Sulayman Nar, slipped away, beat off the horsemen sent after them and made themselves independent at Gao, founding the Sonni dynasty; its date is uncertain, but Gao seems to have been free of Mali by the end of the fourteenth century, when Mali was weakened by succession quarrels. Mali held Timbuktu and the inland Niger delta for longer. A Mossi army sacked Timbuktu in the 1330s, but Malian governors returned and stayed until the Tuareg took the town in 1433. The last Sonni kings before Sonni Ali carried the war west: Sonni Madawu raided Niani, the Malian capital, and carried off twenty-four groups of the mansa’s servile people, and Sonni Sulayman Dama sacked Mema, the centre of Mali’s Soninke province. Sonni Ali’s conquests from 1464 made Gao the master of the Niger bend."
: "Den långa kampen om Gao och mellersta Niger mellan Maliriket och songhaikungarna i Gao. Maliska arméer erövrade troligen kungariket Gao i slutet av 1200-talet, mellan omkring 1275 och 1300; Timbuktukrönikorna daterar dess underkastelse till Mansa Musas vallfärd 1324–1325, då han byggde en moské i Gao på hemvägen, och Ibn Battuta, som passerade Gao 1353, fann att staden fortfarande hörde till Mali. Det maliska styret var inte obrutet: Gaos härskare betalade tribut och bröt sig loss så snart Mali var i svårigheter. Enligt songhaisk tradition smet två prinsar som hölls vid det maliska hovet, Ali Kolon och Sulayman Nar, i väg, slog tillbaka de ryttare som skickats efter dem och gjorde sig självständiga i Gao, varmed de grundade sonnidynastin; tidpunkten är osäker, men Gao tycks ha varit fritt från Mali i slutet av 1300-talet, då Mali försvagades av tronföljdsstrider. Mali behöll Timbuktu och Nigers inre delta längre. En mossiarmé plundrade Timbuktu på 1330-talet, men maliska guvernörer återvände och stannade tills tuaregerna intog staden 1433. De sista sonnikungarna före Sonni Ali förde kriget västerut: Sonni Madawu gjorde en räd mot Niani, Malis huvudstad, och förde bort tjugofyra grupper av mansans ofria folk, och Sonni Sulayman Dama plundrade Mema, centrum för Malis soninkeprovins. Sonni Alis erövringar från 1464 gjorde Gao till herre över Nigerkröken."
