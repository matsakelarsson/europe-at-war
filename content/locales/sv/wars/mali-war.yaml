# Svenska översättningar av katalogtexten (våg 12); stegtexterna kommer senare.
Mali War: Kriget i Mali
? The war that began in January 2012 when the National Movement for the Liberation of Azawad (MNLA), a Tuareg separatist movement strengthened by fighters returning from Libya, rose in northern Mali together with the jihadist groups Ansar Dine, al-Qaeda in the Islamic Maghreb (AQIM) and MUJAO. After soldiers angry at their defeats overthrew the government in Bamako in March 2012, the rebels took the whole north and the MNLA declared an independent Azawad, but the jihadists soon drove it out and ruled the north under their law. When they advanced south in January 2013, France intervened with Operation Serval and, with Chadian and Malian troops, retook the towns of the north within weeks. A UN mission, MINUSMA, and France’s Sahel-wide Operation Barkhane followed, and the Algiers Accord of 2015 made peace with the Tuareg and Arab movements. But the jihadists, united from 2017 in JNIM, an al-Qaeda affiliate, and rivalled by the Islamic State in the Greater Sahara, spread into central Mali and into Burkina Faso and Niger, and communal massacres followed. Two coups in 2020 and 2021 brought Colonel Assimi Goïta’s junta to power; it turned to Russia’s Wagner Group, made the French and the UN leave, ended the Algiers Accord and took Kidal in 2023. Since 2025 JNIM has blockaded fuel supplies to the south, and in April 2026 JNIM and the Azawad Liberation Front (FLA) launched a nationwide offensive in which the defence minister was killed and the FLA took Kidal, which the army retook in October 2026. Some 20,000 people or more have been killed, and more than 400,000 were displaced inside Mali by 2025.
: Det krig som började i januari 2012 när Nationella rörelsen för Azawads befrielse (MNLA), en tuaregisk separatiströrelse som förstärkts av stridande som återvänt från Libyen, gjorde uppror i norra Mali tillsammans med de jihadistiska grupperna Ansar Dine, al-Qaida i islamiska Maghreb (AQIM) och MUJAO. Sedan soldater som var förbittrade över sina nederlag hade störtat regeringen i Bamako i mars 2012 intog rebellerna hela norra Mali och MNLA utropade ett självständigt Azawad, men jihadisterna drev snart ut rörelsen och styrde norra Mali enligt sin lag. När de ryckte fram söderut i januari 2013 intervenerade Frankrike med operation Serval och återtog tillsammans med tchadiska och maliska trupper städerna i norr inom några veckor. Därefter följde en FN-insats, MINUSMA, och Frankrikes operation Barkhane i hela Sahel, och Algeravtalet 2015 slöt fred med de tuaregiska och arabiska rörelserna. Men jihadisterna, från 2017 förenade i JNIM, en gren av al-Qaida, och med Islamiska staten i Stora Sahara som rival, spred sig till centrala Mali och in i Burkina Faso och Niger, och massakrer mellan folkgrupper följde. Två kupper 2020 och 2021 förde överste Assimi Goïtas junta till makten; den vände sig till den ryska Wagnergruppen, tvingade fransmännen och FN att lämna landet, sade upp Algeravtalet och intog Kidal 2023. Sedan 2025 har JNIM blockerat bränsletransporterna till södra Mali, och i april 2026 inledde JNIM och Azawads befrielsefront (FLA) en landsomfattande offensiv där försvarsministern dödades och FLA intog Kidal, som armén återtog i oktober 2026. Omkring 20 000 människor eller fler har dödats, och mer än 400 000 hade 2025 drivits på flykt inom Mali.
