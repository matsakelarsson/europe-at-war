# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
Sectarian conflict in Maluku: Den religiösa konflikten i Moluckerna
? "The fighting between Christians and Muslims in the Maluku Islands of eastern Indonesia after the fall of Suharto. On 19 January 1999, the day of Idul Fitri, a quarrel between a Christian bus driver and a Muslim youth at the Batu Merah terminal in Ambon turned into riots between the city’s Christian and Muslim quarters, and the violence spread to Seram, Haruku, Saparua, Buru and the Kei Islands. Behind it lay old balances upset by the crisis of 1997–1998: competition for jobs and posts, the arrival of Muslim migrants from Sulawesi, and rivalries within the security forces, parts of which were accused of taking sides. In North Maluku, made a separate province in 1999, a land dispute at Malifut in August 1999 began a cycle of killings in Halmahera; at the end of December 1999 hundreds of Muslims were killed in and around Tobelo, and Christians were killed in Galela in reprisal. From April–May 2000 several thousand fighters of Laskar Jihad, a militia founded in Java by Ja’far Umar Thalib, arrived in Ambon despite the government’s ban and joined attacks on Christian villages; Christian militias fought back. President Abdurrahman Wahid declared a civil emergency in June 2000. Talks brokered by the minister Jusuf Kalla led to the Malino II agreement of February 2002, after which the fighting died down, though bombings and riots recurred, notably in Ambon in April 2004; Laskar Jihad disbanded in October 2002. Estimates of the dead range from about 5,000 to 10,000, and up to 700,000 people were displaced. In Poso in Central Sulawesi a related conflict between Christians and Muslims (December 1998 – December 2001) killed an estimated 1,000–2,500 people, among them many Muslims massacred at the Walisongo boarding school in May 2000; it was ended by the Malino I declaration of 20 December 2001, but small Islamist armed groups remained active around Poso for years."
: "Striderna mellan kristna och muslimer på Moluckerna i östra Indonesien efter Suhartos fall. Den 19 januari 1999, dagen för Idul Fitri, övergick ett gräl mellan en kristen busschaufför och en ung muslim vid busstationen Batu Merah i Ambon i upplopp mellan stadens kristna och muslimska kvarter, och våldet spred sig till Seram, Haruku, Saparua, Buru och Keiöarna. Bakom det låg gamla jämviktslägen som hade rubbats av krisen 1997–1998: konkurrens om arbeten och poster, inflyttningen av muslimska migranter från Sulawesi och rivaliteter inom säkerhetsstyrkorna, av vilka delar anklagades för att ta parti. I Nordmoluckerna, som blev en egen provins 1999, inledde en jordtvist i Malifut i augusti 1999 en spiral av dödande på Halmahera; i slutet av december 1999 dödades hundratals muslimer i och kring Tobelo, och kristna dödades i Galela som vedergällning. Från april–maj 2000 kom flera tusen kämpar ur Laskar Jihad, en milis som hade grundats på Java av Ja’far Umar Thalib, till Ambon trots regeringens förbud och deltog i angrepp på kristna byar; kristna miliser slog tillbaka. President Abdurrahman Wahid utlyste civilt undantagstillstånd i juni 2000. Samtal med ministern Jusuf Kalla som medlare ledde till Malino II-avtalet i februari 2002, varefter striderna ebbade ut, även om bombdåd och upplopp återkom, särskilt i Ambon i april 2004; Laskar Jihad upplöstes i oktober 2002. Uppskattningarna av antalet döda sträcker sig från omkring 5 000 till 10 000, och upp till 700 000 människor drevs på flykt. I Poso på Centrala Sulawesi dödade en besläktad konflikt mellan kristna och muslimer (december 1998 – december 2001) uppskattningsvis 1 000–2 500 människor, bland dem många muslimer som massakrerades vid internatskolan Walisongo i maj 2000; den avslutades genom Malino I-deklarationen den 20 december 2001, men små islamistiska väpnade grupper förblev aktiva kring Poso i åratal."
