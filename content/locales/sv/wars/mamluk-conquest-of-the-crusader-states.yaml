Mamluk conquest of the crusader states: Mamlukernas erövring av korsfararstaterna
The campaigns in which the Mamluk sultans of Egypt and Syria, Baibars, Qalawun and al-Ashraf Khalil, conquered the remaining crusader states on the Syrian and Palestinian coast. Baibars took Caesarea, Arsuf, Safed, Jaffa and Antioch in 1265–1268 and Krak des Chevaliers in 1271; Qalawun took Tripoli in 1289; and the fall of Acre on 18 May 1291 was followed by the surrender of the last Frankish towns and castles on the mainland.: De fälttåg där mamluksultanerna i Egypten och Syrien, Baibars, Qalawun och al-Ashraf Khalil, erövrade de återstående korsfararstaterna längs den syriska och palestinska kusten. Baibars tog Caesarea, Arsuf, Safed, Jaffa och Antiochia 1265–1268 och Krak des Chevaliers 1271; Qalawun tog Tripoli 1289; och efter Akkos fall den 18 maj 1291 kapitulerade de sista frankiska städerna och borgarna på fastlandet.
