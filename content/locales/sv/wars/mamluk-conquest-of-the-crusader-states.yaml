Qalawun, 1289: Qalawun, 1289
In August 1290 newly arrived Italian crusaders killed Muslim merchants and peasants in Acre, and Qalawun prepared to punish the city. He died in November, but his son al-Ashraf Khalil brought a vast army from Egypt and Syria, with dozens of siege engines, before Acre on 6 April 1291. The city was held by the military orders, the Italian communes, troops of the kingdom and men sent from Cyprus by King Henry II, perhaps 15,000 in all. For six weeks the Mamluks bombarded and mined its double walls.: I augusti 1290 dödade nyanlända italienska korsfarare muslimska köpmän och bönder i Akko, och Qalawun förberedde ett straff mot staden. Han dog i november, men hans son al-Ashraf Khalil förde den 6 april 1291 en väldig armé från Egypten och Syrien, med dussintals belägringsmaskiner, till Akko. Staden försvarades av riddarordnarna, de italienska kommunerna, kungarikets trupper och män som kung Henrik II sänt från Cypern, kanske 15 000 sammanlagt. I sex veckor beskjöt och minerade mamlukerna dess dubbla murar.
On 18 May the Mamluks broke through at the Accursed Tower and poured into the city. The Templar master William of Beaujeu was killed, thousands of townspeople crowded onto ships in the harbour, many drowned, and those left behind were killed or enslaved. The Templars held their fortress by the sea until 28 May, when it collapsed during the final assault. Tyre, Sidon, Beirut, Haifa, Tortosa and the Templar castle of Athlit were given up without a fight by mid-August. The crusader states on the mainland were at an end, though the Templars held the island of Ruad until 1302 and the Latin kingdom of Cyprus lived on.: Den 18 maj bröt mamlukerna igenom vid Förbannade tornet och strömmade in i staden. Tempelherrarnas stormästare Guillaume de Beaujeu dödades, tusentals stadsbor trängdes ombord på fartyg i hamnen, många drunknade, och de som blev kvar dödades eller förslavades. Tempelherrarna höll sin fästning vid havet till den 28 maj, då den rasade under den sista stormningen. Tyros, Sidon, Beirut, Haifa, Tortosa och tempelherrarnas borg Athlit uppgavs utan strid fram till mitten av augusti. Korsfararstaterna på fastlandet var borta, även om tempelherrarna höll ön Ruad till 1302 och det latinska kungariket Cypern levde vidare.
