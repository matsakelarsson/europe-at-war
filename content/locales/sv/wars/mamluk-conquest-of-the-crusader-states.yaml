Dates are Julian. The Mamluk campaigns are described in detail by Arabic historians, some of them eyewitnesses such as Abu’l-Fida, who fought at Acre; the main Frankish account of the fall of Acre is by an author known as the Templar of Tyre.: Datumen anges enligt den julianska kalendern. Mamlukernas fälttåg skildras ingående av arabiska historiker, en del av dem ögonvittnen som Abu’l-Fida, som stred vid Akko; den främsta frankiska skildringen av Akkos fall är skriven av en författare som kallas Tempelherren från Tyros.
The Mamluks also fought the Mongols of the Ilkhanate, with whom the Franks and the Armenians of Cilicia sometimes allied; the threat of Mongol invasion explains much of the timing of the Mamluk campaigns. The crusades of Louis IX to Tunis (1270) and of the Lord Edward to Acre (1271–1272) have their own entries.: Mamlukerna kämpade också mot mongolerna i Ilkhanatet, med vilka frankerna och armenierna i Kilikien ibland var allierade; hotet om mongoliska invasioner förklarar mycket av tidpunkterna för mamlukernas fälttåg. Ludvig IX:s korståg till Tunis (1270) och lord Edvards korståg till Akko (1271–1272) har egna poster.
