After the Mamluks beat the Mongols at Ain Jalut in 1260, their commander Baibars murdered Sultan Qutuz and took the throne. Master of Egypt and Syria, he turned on the Frankish states, which were divided among themselves and had sometimes sided with the Mongols. In 1265 he took Caesarea and Arsuf, and in 1266 the Templar castle of Safed, whose garrison was killed after it had surrendered. In August 1266 his army crushed the Armenians of Cilicia at Mari, in the mountains north of Antioch, and sacked their towns.: Sedan mamlukerna besegrat mongolerna vid Ain Jalut 1260 mördade deras befälhavare Baibars sultan Qutuz och tog tronen. Som herre över Egypten och Syrien vände han sig mot de frankiska staterna, som var splittrade sinsemellan och ibland hade tagit mongolernas parti. 1265 intog han Caesarea och Arsuf, och 1266 tempelherrarnas borg Safed, vars garnison dödades sedan den kapitulerat. I augusti 1266 krossade hans armé armenierna från Kilikien vid Mari, i bergen norr om Antiochia, och plundrade deras städer.
In 1268 Baibars took Jaffa in March and the castle of Beaufort in April, then marched north. Antioch, whose prince Bohemond VI was away in Tripoli, fell on 18 May 1268 after a siege of a few days. Much of its population was killed or enslaved, and the great city, a Frankish principality for 170 years, never recovered. In 1271 Baibars took the Hospitaller castle of Krak des Chevaliers and the Teutonic Knights’ castle of Montfort, and the arrival of the Lord Edward of England that year brought only a truce.: 1268 intog Baibars Jaffa i mars och borgen Beaufort i april och marscherade sedan norrut. Antiochia, vars furste Bohemund VI befann sig i Tripoli, föll den 18 maj 1268 efter en belägring på några dagar. En stor del av befolkningen dödades eller förslavades, och den stora staden, ett frankiskt furstendöme i 170 år, återhämtade sig aldrig. 1271 intog Baibars johanniternas borg Krak des Chevaliers och Tyska ordens borg Montfort, och lord Edvard av Englands ankomst samma år ledde bara till ett stillestånd.
