Baibars, 1268: Baibars, 1268
Baibars died in 1277. His successor Qalawun beat a Mongol invasion at Homs in 1281 and renewed truces with the Franks while he dealt with his rivals, then resumed the conquest. He took the Hospitaller fortress of Margat in 1285 and Latakia, the last town of the old Principality of Antioch, in 1287. In Tripoli, after Bohemond VII died in 1287, the townspeople, the heiress Lucia and the Genoese fought over the government, and some of the Franks themselves urged Qalawun to intervene.: Baibars dog 1277. Hans efterträdare Qalawun slog tillbaka en mongolisk invasion vid Homs 1281 och förnyade stilleståndet med frankerna medan han gjorde upp med sina rivaler, och återupptog sedan erövringen. Han intog johanniternas fästning Margat 1285 och Latakia, den sista staden i det gamla furstendömet Antiochia, 1287. I Tripoli stred stadsborna, arvtagerskan Lucia och genuserna om styret sedan Bohemund VII dött 1287, och en del av frankerna själva uppmanade Qalawun att ingripa.
In March 1289 Qalawun besieged Tripoli with a large army and many siege engines. Reinforcements came from Cyprus and Acre, but the walls were breached, and on 26 April the city was stormed. Many of its people were killed or enslaved, and others escaped by ship to Cyprus. Qalawun had the city destroyed and a new Tripoli built a few kilometres inland, and the remaining towns of the county surrendered soon after.: I mars 1289 belägrade Qalawun Tripoli med en stor armé och många belägringsmaskiner. Förstärkningar kom från Cypern och Akko, men murarna bröts igenom, och den 26 april stormades staden. Många av invånarna dödades eller förslavades, och andra flydde sjövägen till Cypern. Qalawun lät förstöra staden och bygga ett nytt Tripoli några kilometer inåt land, och grevskapets återstående städer kapitulerade kort därefter.
