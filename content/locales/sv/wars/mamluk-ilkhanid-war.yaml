# Svenska översättningar av katalogtexten (våg 7); stegtexterna kommer senare.
Mamluk–Ilkhanid war: Mamlukisk-ilkhanidiska kriget
The sixty-year conflict between the Mongol Ilkhanate of Iran and the Mamluk Sultanate of Egypt and Syria. In 1260 Hülegü took Aleppo and Damascus and ended Ayyubid rule in Syria, but when he withdrew most of his army, the Mamluks destroyed the force he had left behind at Ain Jalut. The Euphrates became the frontier, fortified on both sides and crossed by raiders almost every year. The Ilkhans invaded Syria in strength, with Armenian and Georgian allies, in 1281, 1299–1300 and 1303, and the Mamluks struck into Cilician Armenia and Seljuk Anatolia, winning at Elbistan in 1277. The Mongols won only once in the field, at Wadi al-Khaznadar in 1299, after which they held Damascus for a few months; their defeat at Marj al-Saffar in 1303 ended their attempts to conquer Syria. After a last siege of al-Rahba in 1312–1313, the Ilkhan Abu Sa’id made peace with the sultan al-Nasir Muhammad in 1322–1323.: Den sextioåriga konflikten mellan det mongoliska Ilkhanatet i Iran och Mamlukiska sultanatet i Egypten och Syrien. År 1260 intog Hülegü Aleppo och Damaskus och gjorde slut på det ayyubidiska styret i Syrien, men när han drog tillbaka större delen av sin armé förintade mamlukerna den styrka han hade lämnat kvar vid Ain Jalut. Eufrat blev gräns; den befästes på båda sidor, och nästan varje år gick plundrare över floden. Ilkhanerna föll in i Syrien med stora styrkor och med armeniska och georgiska bundsförvanter 1281, 1299–1300 och 1303, och mamlukerna slog till mot det armeniska Kilikien och det seldjukiska Anatolien och segrade vid Elbistan 1277. Mongolerna vann bara en gång i fältslag, vid Wadi al-Khaznadar 1299, varefter de höll Damaskus i några månader; deras nederlag vid Marj al-Saffar 1303 gjorde slut på deras försök att erövra Syrien. Efter en sista belägring av al-Rahba 1312–1313 slöt ilkhanen Abu Sa’id fred med sultanen al-Nasir Muhammad 1322–1323.
