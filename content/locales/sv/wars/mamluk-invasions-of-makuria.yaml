# Svenska översättningar av katalogtexten (våg 12); stegtexterna kommer senare.
Mamluk invasions of Makuria: Mamlukernas invasioner av Makuria
A series of wars in which the Mamluk sultans of Egypt broke the Christian Nubian kingdom of Makuria and made it a vassal. For six centuries a treaty, the baqt, had kept the peace between Egypt and Makuria. In 1272 King David of Makuria raided the Red Sea port of Aidhab and later Aswan; in 1276 Sultan Baybars answered with an army that defeated the Nubians at Dongola, sacked the capital and put David’s rival Shakanda on the throne as a tributary. Under Qalawun the Mamluks sent at least two more expeditions (1287 and 1289 in the usual dating) against King Semamun, and the land between the Second Cataract and Dongola was laid waste. In 1316 Sultan al-Nasir Muhammad installed a Muslim Nubian prince, Abdallah Barshambu, and on 29 May 1317 the throne hall of Dongola was consecrated as a mosque. Christian kings reappeared after him, but Makuria never recovered; Arab Bedouin moved south along the Nile, and by the 15th century only a small kingdom remained in Lower Nubia.: En rad krig där Egyptens mamluksultaner bröt det kristna nubiska kungariket Makuria och gjorde det till vasall. I sex sekler hade ett fördrag, baqt, bevarat freden mellan Egypten och Makuria. År 1272 gjorde kung David av Makuria en räd mot hamnen Aidhab vid Röda havet och senare mot Aswan; 1276 svarade sultan Baybars med en armé som besegrade nubierna vid Dongola, plundrade huvudstaden och satte Davids rival Shakanda på tronen som tributskyldig vasall. Under Qalawun sände mamlukerna minst två ytterligare expeditioner (1287 och 1289 enligt den vanliga dateringen) mot kung Semamun, och landet mellan andra katarakten och Dongola ödelades. År 1316 insatte sultan al-Nasir Muhammad en muslimsk nubisk furste, Abdallah Barshambu, och den 29 maj 1317 invigdes tronsalen i Dongola som moské. Kristna kungar dök upp igen efter honom, men Makuria hämtade sig aldrig; arabiska beduiner flyttade söderut längs Nilen, och på 1400-talet återstod bara ett litet kungarike i Nedre Nubien.
