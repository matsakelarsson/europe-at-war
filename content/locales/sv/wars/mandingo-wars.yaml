# Svenska översättningar av katalogtexten (våg 12); stegtexterna kommer senare.
Mandingo Wars: Mandingokrigen
? The wars between France and the Wassoulou Empire of Samori Touré (Samory Ture), the longest resistance France met in its conquest of West Africa. Samori, a Malinke trader turned war leader, built a state in the upper Niger basin in the 1860s and 1870s, with its capital at Bissandougou, an army of sofa infantry and cavalry armed with rifles bought through Sierra Leone and made in his own workshops, and Islam as the state religion from 1884. The French first fought him in 1882 at Kéniéran and in 1883 near Bamako; after he turned back a French column in 1885, the Treaty of Kéniéba-Koura (1886) left him the right bank of the Niger. His fifteen-month siege of Sikasso, capital of Kénédougou (1887–1888), failed and set off revolts at home. In 1891 Louis Archinard took Kankan and Bissandougou, and Samori fought a war of manoeuvre and scorched earth, moving his whole state east between 1892 and 1895 to the lands of the Bandama and the Comoé, where he defeated a French column, took Kong and destroyed it in 1897, and clashed with the British at Wa. After the fall of Sikasso in May 1898 the French closed in; his columns starved in the forest on the way to Liberia, and Captain Henri Gouraud captured him at Guélémou on 29 September 1898. He died in exile in Gabon in 1900. Samori is honoured in Guinea and much of West Africa as a hero of resistance, and remembered in other places for the devastation and the mass enslavement his wars brought.
: Krigen mellan Frankrike och Samori Tourés (Samory Ture) Wassoulourike, det längsta motstånd Frankrike mötte under erövringen av Västafrika. Samori, en malinkéhandlare som blivit krigsledare, byggde på 1860- och 1870-talen upp en stat i övre Nigerbäckenet, med huvudstad i Bissandougou, en armé av sofa-infanteri och kavalleri beväpnade med gevär som köpts via Sierra Leone eller tillverkats i hans egna verkstäder, och med islam som statsreligion från 1884. Fransmännen stred mot honom första gången 1882 vid Kéniéran och 1883 nära Bamako; sedan han hade drivit tillbaka en fransk kolonn 1885 lämnade fördraget i Kéniéba-Koura (1886) honom Nigers högra strand. Hans femton månader långa belägring av Sikasso, Kénédougous huvudstad (1887–1888), misslyckades och utlöste revolter i hans eget rike. År 1891 intog Louis Archinard Kankan och Bissandougou, och Samori förde ett rörligt krig med den brända jordens taktik och flyttade mellan 1892 och 1895 hela sin stat österut till länderna vid Bandama och Comoé, där han besegrade en fransk kolonn, intog Kong och förstörde staden 1897 och drabbade samman med britterna vid Wa. Efter Sikassos fall i maj 1898 ringade fransmännen in honom; hans kolonner svalt i skogen på väg mot Liberia, och kapten Henri Gouraud tillfångatog honom vid Guélémou den 29 september 1898. Han dog i landsflykt i Gabon 1900. Samori hedras i Guinea och stora delar av Västafrika som en motståndshjälte, och på andra håll minns man honom för den förödelse och det massförslavande som hans krig förde med sig.
