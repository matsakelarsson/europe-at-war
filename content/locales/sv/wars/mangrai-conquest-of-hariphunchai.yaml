# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
Mangrai’s conquest of Hariphunchai: Mangrais erövring av Hariphunchai
? The conquest of Hariphunchai, the old Mon kingdom of the Ping valley centred on today’s Lamphun, by Mangrai, the Tai ruler of Ngoenyang in the far north of Thailand, and the founding of Chiang Mai. Mangrai, who became king of Ngoenyang in 1259 and founded Chiang Rai as his capital in about 1262, extended his rule over the Tai principalities of the Kok valley and around Fang. To take Hariphunchai, the chronicles say, he sent a merchant, Ai Fa, as a spy; Ai Fa rose to be chief minister of King Yi Ba and spread discontent among the people. Mangrai’s army then took the city and Yi Ba fled south to Lampang. Some accounts date the fall to 1281, others to 1291 or 1292. In 1287 Mangrai made a pact of friendship with Ngam Mueang of Phayao and Ram Khamhaeng of Sukhothai, which kept the peace between the three Tai kings. After a first capital at Wiang Kum Kam, which flooded, he founded Chiang Mai, the “new city”, on the Ping in 1296, with the advice, the chronicles say, of his two allies. A later attack on Chiang Mai by Yi Ba’s son, the ruler of Lampang, was beaten by Mangrai’s son Khram, and Lampang came under Lan Na. Chiang Mai remained the capital of the kingdom of Lan Na until the Burmese conquest of 1558.
: Erövringen av Hariphunchai, det gamla monriket i Pingdalen med centrum i dagens Lamphun, genom Mangrai, taihärskaren i Ngoenyang i Thailands yttersta norr, och grundandet av Chiang Mai. Mangrai, som blev kung av Ngoenyang 1259 och grundade Chiang Rai som sin huvudstad omkring 1262, utsträckte sitt välde över taifurstendömena i Kokdalen och kring Fang. För att ta Hariphunchai sände han enligt krönikorna en köpman, Ai Fa, som spion; Ai Fa steg till förste minister hos kung Yi Ba och spred missnöje bland folket. Mangrais armé intog sedan staden och Yi Ba flydde söderut till Lampang. Somliga källor daterar fallet till 1281, andra till 1291 eller 1292. År 1287 slöt Mangrai en vänskapspakt med Ngam Mueang av Phayao och Ram Khamhaeng av Sukhothai, som bevarade freden mellan de tre taikungarna. Efter en första huvudstad i Wiang Kum Kam, som översvämmades, grundade han 1296 Chiang Mai, ”den nya staden”, vid Ping, enligt krönikorna på inrådan av sina två bundsförvanter. Ett senare anfall mot Chiang Mai av Yi Bas son, härskaren i Lampang, slogs tillbaka av Mangrais son Khram, och Lampang kom under Lan Na. Chiang Mai förblev huvudstad i kungariket Lan Na fram till den burmesiska erövringen 1558.
