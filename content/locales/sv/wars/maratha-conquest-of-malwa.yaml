Maratha conquest of Malwa: Marathernas erövring av Malwa
The campaigns by which the Peshwa Baji Rao I carried Maratha power north of the Narmada into the Mughal province of Malwa and into Bundelkhand. Maratha armies raided Malwa from 1723; in 1728 Baji Rao’s brother Chimaji Appa defeated and killed its governor, Giridhar Bahadur, at Amjhera, and Maratha chiefs, Holkar, Scindia and the Pawars, began to collect its revenue. In 1729 Baji Rao relieved the Bundela king Chhatrasal, besieged by the Mughal general Muhammad Khan Bangash, and was rewarded with a third of his kingdom. In 1737 he rode to the outskirts of Delhi, and when the Nizam of Hyderabad came north with an imperial army, the Marathas surrounded him at Bhopal and forced him to agree, at Doraha in January 1738, that Malwa would be ceded to them. The emperor formally made the Peshwa deputy governor of Malwa in 1741.: De fälttåg genom vilka peshwan Baji Rao I förde marathamakten norr om Narmada, in i mogulprovinsen Malwa och in i Bundelkhand. Maratharméer plundrade i Malwa från 1723; 1728 besegrade och dödade Baji Raos bror Chimaji Appa provinsens guvernör, Giridhar Bahadur, vid Amjhera, och marathahövdingarna Holkar, Scindia och pawarerna började driva in dess skatteintäkter. År 1729 undsatte Baji Rao bundelakungen Chhatrasal, som belägrades av mogulgeneralen Muhammad Khan Bangash, och belönades med en tredjedel av hans rike. År 1737 red han ända fram till Delhis utkanter, och när nizamen av Hyderabad drog norrut med en kejserlig armé omringade maratherna honom vid Bhopal och tvingade honom att i Doraha i januari 1738 gå med på att Malwa skulle avträdas till dem. Kejsaren utnämnde 1741 formellt peshwan till vice guvernör över Malwa.
