# Svenska översättningar av katalogtexten (våg 8); stegtexterna kommer senare.
Maratha invasions of Bengal: Marathernas invasioner av Bengalen
The raids of the Maratha armies of Raghuji Bhonsle of Nagpur into the Mughal province of Bengal, Bihar and Orissa, ruled by the Nawab Alivardi Khan. Known in Bengal as the bargis, from the Persian word for a mounted soldier, the Maratha horsemen came almost every year from 1742, led at first by Raghuji’s general Bhaskar Ram Kolhatkar, plundering western Bengal and Bihar and demanding chauth, a quarter of the revenue. Alivardi won many battles, surprised the Maratha camp at Katwa in 1742 and had Bhaskar and his officers killed at a meeting in 1744, but could not stop the raids, which joined forces with a revolt of Alivardi’s own Afghan officers. A Dutch East India Company official estimated that some 400,000 people died. In 1751 Alivardi made peace, giving up the revenue of Orissa and agreeing to pay 12 lakh rupees a year for Bengal.: Räderna som maratharméerna under Raghuji Bhonsle av Nagpur gjorde in i mogulprovinsen Bengalen, Bihar och Orissa, som styrdes av nawaben Alivardi Khan. Maratharyttarna, som i Bengalen kallades bargier, efter det persiska ordet för en beriden soldat, kom nästan varje år från 1742, till en början ledda av Raghujis general Bhaskar Ram Kolhatkar, plundrade västra Bengalen och Bihar och krävde chauth, en fjärdedel av skatteintäkterna. Alivardi vann många slag, överraskade marathalägret vid Katwa 1742 och lät döda Bhaskar och hans officerare vid ett möte 1744, men kunde inte stoppa räderna, som förenade sig med ett uppror bland Alivardis egna afghanska officerare. En tjänsteman vid Nederländska ostindiska kompaniet uppskattade att omkring 400 000 människor dog. År 1751 slöt Alivardi fred, avstod Orissas skatteintäkter och gick med på att betala 12 lakh rupier om året för Bengalen.
