# Svenska översättningar av katalogtexten (våg 8); stegtexterna kommer senare.
Maratha–Mysore War: Kriget mellan maratherna och Mysore
? A war between Tipu Sultan’s Mysore and the Maratha state, allied with the Nizam of Hyderabad, over the lands between the Krishna and the Tungabhadra that Hyder Ali had taken from the Marathas in the 1770s. It began in 1785, when Tipu besieged and took Nargund, whose chief, a tributary of Mysore since Hyder’s conquest of 1778, had refused a higher tribute and turned to the Marathas, and occupied Kittur. Nana Phadnavis, the leading minister at Pune (Poona), allied with the Nizam, and in May 1786 their armies stormed Badami. Tipu answered by taking the Nizam’s fortress of Adoni after the allied relief army withdrew, crossing the flooded Tungabhadra and defeating the Maratha army of Haripant Phadke at Savanur in October 1786; in January 1787 he took Bahadur Benda. Both sides feared the British more than each other, and in April 1787 they made peace at Gajendragad. Tipu agreed to pay the Marathas tribute, gave up Badami, and returned Nargund, Kittur and Adoni to their former holders, but kept most of his other conquests. Three years later the Marathas and the Nizam joined the British against him.
: Ett krig mellan Tipu Sultans Mysore och marathastaten, allierad med nizamen av Hyderabad, om landområdena mellan Krishna och Tungabhadra som Hyder Ali hade tagit från maratherna på 1770-talet. Det började 1785, när Tipu belägrade och intog Nargund och besatte Kittur; Nargunds hövding, som hade varit skattskyldig till Mysore sedan Hyders erövring 1778, hade vägrat betala en högre tribut och vänt sig till maratherna. Nana Phadnavis, den ledande ministern i Pune (Poona), allierade sig med nizamen, och i maj 1786 stormade deras arméer Badami. Tipu svarade med att inta nizamens fästning Adoni sedan den allierade undsättningsarmén hade dragit sig tillbaka, gå över den översvämmade Tungabhadra och besegra Haripant Phadkes maratharmé vid Savanur i oktober 1786; i januari 1787 intog han Bahadur Benda. Båda sidor fruktade britterna mer än varandra, och i april 1787 slöt de fred i Gajendragad. Tipu gick med på att betala tribut till maratherna, avstod Badami och återlämnade Nargund, Kittur och Adoni till deras tidigare innehavare, men behöll de flesta av sina övriga erövringar. Tre år senare anslöt sig maratherna och nizamen till britterna mot honom.
