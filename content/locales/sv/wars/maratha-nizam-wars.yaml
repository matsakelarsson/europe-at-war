Maratha–Nizam wars: Krigen mellan maratherna och nizamerna
The wars between the Marathas and the Nizams of Hyderabad, the Mughal viceroys who made the Deccan their own state after 1724. The first Nizam, Asaf Jah I, refused the Marathas’ claim to a share of the Deccan revenue and backed a rival Maratha king; Peshwa Baji Rao I outmanoeuvred him and cornered his army at Palkhed in 1728, forcing him to recognise Shahu and the Maratha claims. In 1737–1738 the Marathas surrounded the Nizam again at Bhopal. After his death in 1748 his sons fought over the succession, and the Marathas under Peshwa Balaji Rao fought Salabat Jang and his French allies in 1751–1752, won land in the treaty of Bhalki and defeated the Nizam’s armies at Sindkhed in 1757 and decisively at Udgir in 1760, which gave them much of the northern Deccan. The two powers fought again later, and were allies as often as enemies.: Krigen mellan maratherna och nizamerna av Hyderabad, de mogulska vicekungar som efter 1724 gjorde Deckan till sin egen stat. Den förste nizamen, Asaf Jah I, avvisade marathernas anspråk på en andel av Deckans skatteintäkter och stödde en rivaliserande marathakung; peshwan Baji Rao I utmanövrerade honom och ringade in hans armé vid Palkhed 1728, vilket tvingade honom att erkänna Shahu och marathernas anspråk. År 1737–1738 omringade maratherna åter nizamen vid Bhopal. Efter hans död 1748 stred hans söner om tronföljden, och maratherna under peshwan Balaji Rao bekämpade Salabat Jang och hans franska allierade 1751–1752, vann land genom fördraget i Bhalki och besegrade nizamens arméer vid Sindkhed 1757 och avgörande vid Udgir 1760, vilket gav dem stora delar av norra Deckan. De två makterna krigade senare åter mot varandra, och de var lika ofta allierade som fiender.
