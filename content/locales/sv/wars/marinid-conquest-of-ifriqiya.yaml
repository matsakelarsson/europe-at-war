Marinid conquests of Ifriqiya: Marinidernas erövringar av Ifriqiya
Two attempts by the Marinid sultans of Fez to add Hafsid Ifriqiya to their empire and rebuild the unity of the Maghreb that the Almohads had lost. After taking Tlemcen in 1337, Abu al-Hasan used a succession dispute among the Hafsids to march east, and in September 1347 he entered Tunis. His attempt to bring the Arab tribes of the steppe under control led to a revolt, and in April 1348 they routed his army near Kairouan; his son Abu Inan seized the throne in Fez, the Zayyanids took back Tlemcen, and Abu al-Hasan, shipwrecked off Bougie on his way home, died a fugitive in 1351. Abu Inan, having retaken Tlemcen, took Bougie in 1353 and Tunis in August 1357, but his troops forced him to turn back, and he was murdered in Fez in January 1358. The Hafsids recovered, and no Moroccan ruler tried again.: Två försök av de marinidiska sultanerna i Fès att lägga det hafsidiska Ifriqiya till sitt rike och återupprätta den enhet i Maghreb som almohaderna hade förlorat. Sedan Abu al-Hasan hade intagit Tlemcen 1337 utnyttjade han en tronföljdstvist bland hafsiderna för att marschera österut, och i september 1347 tågade han in i Tunis. Hans försök att få stäppens arabiska stammar under kontroll ledde till ett uppror, och i april 1348 krossade de hans armé nära Kairouan; hans son Abu Inan tillskansade sig tronen i Fès, zayyaniderna återtog Tlemcen, och Abu al-Hasan, som led skeppsbrott utanför Bougie på vägen hem, dog som flykting 1351. Abu Inan återtog Tlemcen och intog Bougie 1353 och Tunis i augusti 1357, men hans trupper tvingade honom att vända om, och han mördades i Fès i januari 1358. Hafsiderna återhämtade sig, och ingen marockansk härskare försökte igen.
