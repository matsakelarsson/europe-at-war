# Svenska översättningar av katalogtexten (våg 12); stegtexterna kommer senare.
Marinid–Zayyanid wars: Krigen mellan marinider och zayyanider
"Three centuries of intermittent war between the two Zenata Berber dynasties that rose from the ruins of the Almohad Caliphate: the Marinids of Fez and the Zayyanids (Abdalwadids) of Tlemcen. Yaghmurasen ibn Zayyan, who took Tlemcen in 1236, fought the Marinids over Sijilmasa and eastern Morocco and lost Oujda in 1272. The Marinid sultan Abu Yaqub Yusuf besieged Tlemcen for eight years (1299–1307) from a new city he built beside it, al-Mansura, until he was murdered in his camp. Abu al-Hasan took Tlemcen in May 1337 after a two-year siege and went on to Tunis, and his son Abu Inan took it again in 1352, but each time the Zayyanids returned, under Abu Hammu II from 1359. From about 1389 Tlemcen accepted Marinid and then Hafsid overlordship. In the 16th century the struggle passed to new powers: Spain held Oran from 1509, the Ottoman rulers of Algiers and the Saadian sultans of Morocco fought over Tlemcen, and in 1551–1554 the Ottomans took it and ended the Zayyanid kingdom.": "Tre sekler av återkommande krig mellan de två zenataberbiska dynastier som växte fram ur det almohadiska kalifatets ruiner: mariniderna i Fès och zayyaniderna (abdalwadiderna) i Tlemcen. Yaghmurasen ibn Zayyan, som intog Tlemcen 1236, stred mot mariniderna om Sijilmasa och östra Marocko och förlorade Oujda 1272. Den marinidiske sultanen Abu Yaqub Yusuf belägrade Tlemcen i åtta år (1299–1307) från en ny stad som han byggde intill, al-Mansura, tills han mördades i sitt läger. Abu al-Hasan intog Tlemcen i maj 1337 efter en tvåårig belägring och drog vidare till Tunis, och hans son Abu Inan intog staden på nytt 1352, men varje gång återvände zayyaniderna, från 1359 under Abu Hammu II. Från omkring 1389 erkände Tlemcen marinidisk och senare hafsidisk överhöghet. På 1500-talet gick kampen över till nya makter: Spanien höll Oran från 1509, de osmanska härskarna i Alger och de saadiska sultanerna i Marocko stred om Tlemcen, och 1551–1554 intog osmanerna staden och gjorde slut på det zayyanidiska kungariket."
