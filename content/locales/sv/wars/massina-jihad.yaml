# Svenska översättningar av katalogtexten (våg 12); stegtexterna kommer senare.
Massina jihad: Jihaden i Massina
? The holy war by which the Fulbe scholar Seku Amadu (Ahmadu Lobbo) founded the Caliphate of Hamdullahi, also called the Dina or the Massina Empire, in the inland delta of the Niger. Massina’s Fulbe chiefs, the ardos, were tributaries of the Bamana kings of Ségou, and Seku Amadu, a preacher from a minor scholarly family, accused them of tolerating unbelief and of oppressing their people. When one of his followers killed the son of the leading ardo in 1816 or 1817, the ardos and Ségou sent an army against his small community at Noukouma, where on 21 March 1818 it was routed. Seku Amadu’s following grew quickly; Djenné opened its gates, the Fulbe of Massina rose against their ardos, and about 1820 he founded a new capital, Hamdullahi (“praise be to God”). The Dina was governed by a council of forty scholars under strict Maliki law, settled the pastoral Fulbe and fixed the rules for herders and farmers in the delta that are still remembered. In 1826 Timbuktu, where the descendants of the Moroccan conquerors, the Arma, still held a nominal authority under Tuareg protection, accepted Hamdullahi’s overlordship, and the Dina fought the Tuareg and the Arma for control of the city until 1846. Its third ruler, Amadu III, refused to join Umar Tall against Ségou and sent his army to help it; in May 1862 Umar defeated the Massina army at Cayawal, took Hamdullahi and had Amadu III executed. The Massina rising against Umar that followed is part of the story of Umar Tall’s jihad.
: Det heliga krig genom vilket Seku Amadu (Ahmadu Lobbo), en lärd fulbe, grundade kalifatet Hamdullahi, även kallat Dina eller Massinariket, i Nigers inre delta. Massinas fulbehövdingar, ardoerna, var skattskyldiga till bambarakungarna i Ségou, och Seku Amadu, en predikant från en mindre betydande släkt av lärda, anklagade dem för att tolerera otro och för att förtrycka sitt folk. När en av hans anhängare 1816 eller 1817 dödade sonen till den främste ardon sände ardoerna och Ségou en armé mot hans lilla gemenskap i Noukouma, där den slogs på flykten den 21 mars 1818. Seku Amadus anhängarskara växte snabbt; Djenné öppnade sina portar, Massinas fulbe reste sig mot sina ardoer, och omkring 1820 grundade han en ny huvudstad, Hamdullahi (”lovad vare Gud”). Dina styrdes av ett råd av fyrtio lärda enligt sträng malikitisk lag, gjorde de nomadiserande fulbe bofasta och fastställde de regler för herdar och bönder i deltat som man fortfarande minns. År 1826 erkände Timbuktu, där ättlingarna till de marockanska erövrarna, arma, fortfarande utövade en nominell makt under tuaregiskt beskydd, Hamdullahis överhöghet, och Dina stred mot tuaregerna och arma om kontrollen över staden fram till 1846. Dess tredje härskare, Amadu III, vägrade att ansluta sig till Umar Tall mot Ségou och sände sin armé till Ségous hjälp; i maj 1862 besegrade Umar Massinas armé vid Cayawal, intog Hamdullahi och lät avrätta Amadu III. Den resning i Massina mot Umar som följde hör till berättelsen om Umar Talls jihad.
