# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
Mat Salleh rebellion: Mat Sallehs uppror
? A rebellion in North Borneo (today’s Sabah) against the British North Borneo Chartered Company, led by Mat Salleh (Datu Muhammad Salleh), a chief of Suluk and Bajau descent from the Sugut River. The Company’s new taxes on rice, boats and trade passes, and its rules that took authority from local chiefs, bore hard on the coastal and river peoples, and Mat Salleh kept collecting the tolls on the Sugut himself. In 1894 he was suspected of the killing of two Iban traders on the Sugut and refused arrest. In August 1895 he took a petition against the taxes to Sandakan and was refused a hearing; on 29 August Company men tried to arrest him on Jambongan Island, and when he escaped they burned his village. He built forts in the interior, which the Company took one after another without catching him, and gathered Bajau, Suluk and Dusun (Kadazan) followers. On 9 July 1897 his men raided the Company station on Gaya Island, burned it and carried off its treasury and a clerk as hostage; in November they burned the residency at Ambong. Company troops were beaten back at his fort at Ranau on 13 December 1897 and took it on 9 January 1898, after he had moved to Tambunan. In April 1898 the Company’s managing director, William Clarke Cowie, met him and agreed that he could settle in Tambunan and run the district, but the written terms did not match what Mat Salleh understood, and when the Company began to set up its own post in Tambunan, fighting resumed in 1899. A Company force reached Tambunan at the end of December 1899, diverted the river that supplied his fort with water and shelled it for four days; Mat Salleh was killed on 31 January 1900 (some accounts say 1 February). About 1,000 of his followers and people of the nearby villages are reported killed in the campaign. Some of his followers fought on until about 1903–1905. He is remembered in Malaysia as a fighter against colonial rule, and a memorial stands at the site of his fort in Tambunan.
: Ett uppror i Nordborneo (dagens Sabah) mot Brittiska Nordborneokompaniet, lett av Mat Salleh (Datu Muhammad Salleh), en hövding av suluk- och bajauhärkomst från Sugutfloden. Kompaniets nya skatter på ris, båtar och handelspass, och dess regler som tog makten från de lokala hövdingarna, drabbade kust- och flodfolken hårt, och Mat Salleh fortsatte att själv driva in tullarna på Sugut. År 1894 misstänktes han för mordet på två ibanhandlare vid Sugut och vägrade låta sig gripas. I augusti 1895 tog han med sig en petition mot skatterna till Sandakan men nekades att bli hörd; den 29 augusti försökte kompaniets män gripa honom på ön Jambongan, och när han kom undan brände de hans by. Han byggde fort i inlandet, som kompaniet intog ett efter ett utan att få fatt i honom, och samlade anhängare bland bajau, suluk och dusun (kadazan). Den 9 juli 1897 anföll hans män kompaniets station på ön Gaya, brände den och förde bort dess kassa och en kontorist som gisslan; i november brände de residentbostaden i Ambong. Kompaniets trupper slogs tillbaka vid hans fort i Ranau den 13 december 1897 och intog det den 9 januari 1898, sedan han hade flyttat till Tambunan. I april 1898 träffade kompaniets verkställande direktör, William Clarke Cowie, honom och gick med på att han fick bosätta sig i Tambunan och styra distriktet, men de skriftliga villkoren stämde inte med det som Mat Salleh hade uppfattat, och när kompaniet började upprätta en egen post i Tambunan återupptogs striderna 1899. En av kompaniets styrkor nådde Tambunan i slutet av december 1899, ledde om floden som försåg hans fort med vatten och beskjöt det i fyra dagar; Mat Salleh dödades den 31 januari 1900 (enligt vissa källor den 1 februari). Omkring 1 000 av hans anhängare och invånare i de närliggande byarna uppges ha dödats under fälttåget. Några av hans anhängare fortsatte kampen till omkring 1903–1905. I Malaysia minns man honom som en kämpe mot kolonialstyret, och ett minnesmärke står på platsen för hans fort i Tambunan.
