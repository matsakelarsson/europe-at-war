# Svenska översättningar av katalogtexten (våg 13); stegtexterna kommer senare.
Matabele–Boer war: Kriget mellan matabele och boerna
? "The war between the Ndebele kingdom of Mzilikazi and the Voortrekkers, the emigrant Boers of the Great Trek, which ended Ndebele rule south of the Limpopo. In 1836 trekker parties crossed the Vaal into lands the Ndebele claimed, and in August Ndebele regiments attacked families camped near the river, among them most of the Liebenberg party, and carried off three children. On 16 October 1836 an Ndebele army of several thousand, sent by Mzilikazi under his general Mkalipi, attacked the laager of Hendrik Potgieter and Sarel Cilliers at Vegkop, near present-day Heilbron: about 40 men behind some 50 wagons beat off the assault, losing two killed against several hundred Ndebele dead, but the Ndebele drove off nearly all their livestock, about 5,000 cattle and 50,000 sheep and goats, and the laager survived on oxen sent by the Rolong chief Moroka of Thaba Nchu. On 17 January 1837 Potgieter and Gerrit Maritz, with about 100 Boers, Griqua and some 60 Rolong, surprised and burned Mosega in the Marico valley, killing several hundred people and taking 6,000 to 7,000 cattle; the American missionaries there left with the commando. A Zulu army sent by Dingane attacked the Ndebele in mid-1837, and in November 1837 Potgieter and Piet Uys, with several hundred men, fought a nine-day running campaign against Mzilikazi around his stronghold of eGabeni (Kapain) on the Marico. Early in 1838 Mzilikazi led his people north across the Limpopo; they settled in what is now western Zimbabwe, where he founded a new kingdom. Potgieter claimed the lands between the Vaal and the Limpopo by right of conquest, the start of the trekker settlements that became the South African Republic."
: "Kriget mellan Mzilikazis Ndebelerike och voortrekkerna, de utvandrade boerna under Stora trekket, som gjorde slut på ndebelestyret söder om Limpopo. 1836 korsade voortrekkergrupper Vaal in i områden som ndebele gjorde anspråk på, och i augusti angrep ndebeleregementen familjer som lägrat sig nära floden, bland dem större delen av Liebenbergs sällskap, och förde bort tre barn. Den 16 oktober 1836 angrep en ndebelearmé på flera tusen man, som Mzilikazi sänt under sin general Mkalipi, Hendrik Potgieters och Sarel Cilliers vagnborg vid Vegkop, nära nuvarande Heilbron: omkring 40 män bakom ett femtiotal vagnar slog tillbaka anfallet och förlorade två döda mot flera hundra döda ndebele, men ndebele drev bort nästan all deras boskap, omkring 5 000 nötkreatur och 50 000 får och getter, och vagnborgen klarade sig tack vare oxar som rolonghövdingen Moroka i Thaba Nchu skickade. Den 17 januari 1837 överrumplade och brände Potgieter och Gerrit Maritz, med omkring 100 boer, griqua och ett sextiotal rolong, Mosega i Maricodalen, dödade flera hundra människor och tog 6 000 till 7 000 nötkreatur; de amerikanska missionärerna där gav sig av med kommandot. En zuluarmé som Dingane sänt angrep ndebele i mitten av 1837, och i november 1837 förde Potgieter och Piet Uys med flera hundra man ett nio dagar långt rörligt fälttåg mot Mzilikazi kring hans fäste eGabeni (Kapain) vid Marico. I början av 1838 ledde Mzilikazi sitt folk norrut över Limpopo; de slog sig ned i det som nu är västra Zimbabwe, där han grundade ett nytt kungarike. Potgieter gjorde anspråk på landet mellan Vaal och Limpopo med erövringens rätt, början på de voortrekkerbosättningar som blev Sydafrikanska republiken."
