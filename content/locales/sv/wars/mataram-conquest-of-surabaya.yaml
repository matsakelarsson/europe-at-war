# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
Mataram’s conquest of Surabaya and the east: Matarams erövring av Surabaya och östra Java
? The wars in which Sultan Agung of Mataram, the inland kingdom of Central Java, brought the trading cities and principalities of East Java and Madura under his rule. Surabaya, the richest port of the north coast, led a league of the eastern states and had resisted Agung’s father and grandfather. In 1614, a year after his accession, Agung raided the lands of Surabaya and Malang and the eastern end of Java; in 1615 he took Wirasaba (near today’s Mojokerto), and in 1616 an army sent by Surabaya and its allies against Mataram was crushed at Siwalan near Pajang. Lasem fell in 1616, Pasuruan in 1617 and Tuban, one of the oldest ports of Java, in 1619; Pajang, which rose against Mataram in 1617, was destroyed. To isolate Surabaya, Agung took its ally Sukadana in south-western Borneo in 1622 and in 1624 conquered Madura after hard fighting, deporting its princes to his court and installing one of them, Prince Prasena (Cakraningrat I), as his vassal. Surabaya itself was besieged for years; its water supply was cut by damming the Brantas river, and the starving city surrendered in 1625. Its ruler’s son, Pangeran Pekik, was taken to the Mataram court and married to Agung’s sister. Mataram now ruled all of Central and East Java except Banten, the new Dutch base at Batavia and the Balinese-ruled east, and Agung took the title of susuhunan; his attempts on Batavia followed in 1628–1629. The conquests ruined the old north-coast ports, and the grievances of Madura and Surabaya resurfaced fifty years later in the Trunajaya rebellion.
: De krig genom vilka sultan Agung av Mataram, inlandsriket på Centraljava, förde handelsstäderna och furstendömena på östra Java och Madura under sitt välde. Surabaya, nordkustens rikaste hamn, ledde ett förbund av de östliga staterna och hade gjort motstånd mot Agungs far och farfar. År 1614, ett år efter sitt trontillträde, härjade Agung Surabayas och Malangs länder och Javas östligaste del; 1615 intog han Wirasaba (nära dagens Mojokerto), och 1616 krossades en armé som Surabaya och dess bundsförvanter hade sänt mot Mataram vid Siwalan nära Pajang. Lasem föll 1616, Pasuruan 1617 och Tuban, en av Javas äldsta hamnar, 1619; Pajang, som reste sig mot Mataram 1617, förstördes. För att isolera Surabaya intog Agung dess bundsförvant Sukadana på sydvästra Borneo 1622 och erövrade 1624 Madura efter hårda strider, deporterade dess prinsar till sitt hov och insatte en av dem, prins Prasena (Cakraningrat I), som sin vasall. Surabaya självt belägrades i flera år; stadens vattenförsörjning skars av genom att floden Brantas dämdes upp, och den svältande staden kapitulerade 1625. Dess härskares son, Pangeran Pekik, fördes till Matarams hov och gifte sig med Agungs syster. Mataram härskade nu över hela Centraljava och östra Java utom Banten, nederländarnas nya bas i Batavia och det balinesiskt styrda östra hörnet, och Agung antog titeln susuhunan; hans försök mot Batavia följde 1628–1629. Erövringarna ruinerade de gamla hamnarna på nordkusten, och Maduras och Surabayas missnöje blossade upp igen femtio år senare i Trunajayaupproret.
