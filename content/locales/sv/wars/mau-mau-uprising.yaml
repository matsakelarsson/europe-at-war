# Svenska översättningar av katalogtexten (våg 13); stegtexterna kommer senare.
Mau Mau war: Mau Mau-kriget
? The armed rising of the Kenya Land and Freedom Army, known as Mau Mau, against British colonial rule and the African chiefs and “loyalists” who supported it, and the State of Emergency the British government imposed to defeat it. The rising grew out of the Kikuyu, Embu and Meru peoples’ loss of land to European settlers in the “White Highlands”, the eviction of squatters from settler farms and the failure of peaceful politics; from the late 1940s hundreds of thousands took oaths of unity. After the killing of Senior Chief Waruhiu, Governor Evelyn Baring declared an Emergency on 20 October 1952 and had Jomo Kenyatta and other leaders arrested. Fighters went into the forests of the Aberdares and Mount Kenya under leaders such as Dedan Kimathi and Waruhiu Itote (“General China”). Mau Mau killed loyalists and their families, most notoriously at Lari in March 1953, and 32 European settlers. British and colonial forces, a Kikuyu Home Guard and RAF bombers fought the forest armies; Operation Anvil emptied Nairobi of Kikuyu in 1954, tens of thousands of suspects were held without trial in a system of detention camps known as the Pipeline, where torture was widespread, and more than a million people were forced into fortified villages. Kimathi’s capture in October 1956 ended the forest war, and 1,090 Kenyans were hanged. Official figures counted at least 11,000 Mau Mau killed; estimates of all deaths caused by the Emergency range from about 25,000 to 50,000, and some historians argue for far more. The Emergency ended on 12 January 1960, the year Britain accepted African majority rule; Kenya became independent in 1963. In 2013 the British government paid compensation to 5,228 Kenyans who had been tortured and abused.
: Det väpnade upproret av Kenya Land and Freedom Army, känd som Mau Mau, mot det brittiska kolonialstyret och de afrikanska hövdingar och ”lojalister” som stödde det, och det undantagstillstånd som den brittiska regeringen införde för att besegra upproret. Det växte fram ur att kikuyu-, embu- och merufolken förlorat mark till europeiska bosättare i ”White Highlands”, ur vräkningen av jordlösa brukare (squatters) från bosättarnas farmer och ur den fredliga politikens misslyckande; från slutet av 1940-talet avlade hundratusentals enhetseder. Efter mordet på överhövdingen Waruhiu utlyste guvernören Evelyn Baring undantagstillstånd den 20 oktober 1952 och lät gripa Jomo Kenyatta och andra ledare. Kämpar gick ut i skogarna i Aberdarebergen och på Kenyaberget under ledare som Dedan Kimathi och Waruhiu Itote (”General China”). Mau Mau dödade lojalister och deras familjer, mest ökänt i Lari i mars 1953, och 32 europeiska bosättare. Brittiska styrkor och kolonialstyrkor, ett kikuyuhemvärn och RAF:s bombflygplan bekämpade skogsarméerna; Operation Anvil tömde Nairobi på kikuyu 1954, tiotusentals misstänkta hölls utan rättegång i ett system av fångläger kallat the Pipeline, där tortyr var utbredd, och mer än en miljon människor tvingades in i befästa byar. Tillfångatagandet av Kimathi i oktober 1956 gjorde slut på skogskriget, och 1 090 kenyaner hängdes. Enligt officiella siffror dödades minst 11 000 Mau Mau-kämpar; uppskattningarna av samtliga dödsfall som undantagstillståndet orsakade varierar från omkring 25 000 till 50 000, och vissa historiker hävdar att de var långt fler. Undantagstillståndet upphörde den 12 januari 1960, samma år som Storbritannien accepterade afrikanskt majoritetsstyre; Kenya blev självständigt 1963. År 2013 betalade den brittiska regeringen skadestånd till 5 228 kenyaner som hade torterats och utsatts för övergrepp.
