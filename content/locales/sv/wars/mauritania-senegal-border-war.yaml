# Svenska översättningar av katalogtexten (våg 12); stegtexterna kommer senare.
Mauritania–Senegal Border War: Gränskriget mellan Mauretanien och Senegal
? A conflict between Mauritania and Senegal that began with a quarrel over grazing land on the Senegal River in April 1989 and grew into riots, killings and mass expulsions in both countries and two years of clashes along the river. After Mauritanian border guards killed two Senegalese farmers at Diawara on 9 April 1989, crowds in Senegal attacked the shops of Mauritanian traders, and in Nouakchott and Nouadhibou mobs and security forces killed Senegalese residents; hundreds died in the last weeks of April, by most estimates some 200 Senegalese in Mauritania and dozens of Mauritanians in Senegal. With help from France, Spain, Algeria and Morocco about 250,000 people were taken home by air and sea. Mauritania also expelled tens of thousands of its own Black citizens, most of them Halpulaar (Fulani) of the river valley, into Senegal and Mali. The two countries broke off relations in August 1989, and from October their armies exchanged fire across the river, Mauritania with Iraqi arms and Senegal backing the African Liberation Forces of Mauritania (FLAM). In 1990–1991 the Mauritanian government arrested some 3,000 Black soldiers and officials, of whom more than 500 were killed in detention. A peace treaty was signed on 18 July 1991 and the border reopened in May 1992. Between 2008 and 2012 some 24,000 refugees returned to Mauritania with UNHCR’s help; about 14,000 chose to stay in Senegal.
: En konflikt mellan Mauretanien och Senegal som började med en tvist om betesmark vid Senegalfloden i april 1989 och växte till upplopp, mord och massutvisningar i båda länderna och två års sammandrabbningar längs floden. Sedan mauretanska gränsvakter hade dödat två senegalesiska bönder i Diawara den 9 april 1989 angrep folkmassor i Senegal mauretanska handlares butiker, och i Nouakchott och Nouadhibou dödade mobbar och säkerhetsstyrkor senegalesiska invånare; hundratals dog under de sista veckorna i april, enligt de flesta uppskattningar omkring 200 senegaleser i Mauretanien och dussintals mauretanier i Senegal. Med hjälp från Frankrike, Spanien, Algeriet och Marocko fördes omkring 250 000 människor hem med flyg och fartyg. Mauretanien utvisade också tiotusentals av sina egna svarta medborgare, de flesta halpulaar (fulani) från floddalen, till Senegal och Mali. De två länderna bröt förbindelserna med varandra i augusti 1989, och från oktober växlade deras arméer eld över floden, Mauretanien med irakiska vapen och Senegal med stöd till Mauretaniens afrikanska befrielsestyrkor (FLAM). Åren 1990–1991 grep den mauretanska regeringen omkring 3 000 svarta soldater och tjänstemän, av vilka mer än 500 dödades i förvar. Ett fredsfördrag undertecknades den 18 juli 1991, och gränsen öppnades igen i maj 1992. Mellan 2008 och 2012 återvände omkring 24 000 flyktingar till Mauretanien med hjälp av UNHCR; omkring 14 000 valde att stanna i Senegal.
