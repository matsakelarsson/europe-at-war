Revolt of Mazyar: Mazyars uppror
The revolt of Mazyar ibn Qarin, the Qarinvandid prince who ruled the mountains of Tabaristan, south of the Caspian Sea, under the Abbasid caliphs. Abdallah ibn Tahir, the Tahirid governor of Khorasan, claimed Tabaristan and its taxes; Mazyar refused to pay and rose in 839, relying on the Zoroastrian peasantry and imprisoning those he distrusted. Abdallah and the caliph al-Mu’tasim sent five armies into Tabaristan from different directions. The Bavandid prince Qarin went over to the Abbasids, the people of Sari rose against Mazyar, and his brother Quhyar captured him and handed him over. Mazyar was taken to Samarra and executed, and his body was hung beside Babak’s. Tabaristan passed under Tahirid rule until the Zaydi revolt of 864, and al-Afshin, the conqueror of Babak, was accused of having encouraged Mazyar and died in prison in 841.: Upproret under Mazyar ibn Qarin, den qarinvandidiske furste som under de abbasidiska kaliferna härskade över bergen i Tabaristan, söder om Kaspiska havet. Abdallah ibn Tahir, tahiridisk guvernör över Khorasan, gjorde anspråk på Tabaristan och dess skatter; Mazyar vägrade betala och gjorde uppror 839, med stöd av den zoroastriska bondebefolkningen, och lät fängsla dem han misstrodde. Abdallah och kalifen al-Mu’tasim sände fem arméer in i Tabaristan från olika håll. Den bavandidiske fursten Qarin gick över till abbasiderna, invånarna i Sari reste sig mot Mazyar, och hans bror Quhyar tillfångatog honom och lämnade ut honom. Mazyar fördes till Samarra och avrättades, och hans kropp hängdes upp bredvid Babaks. Tabaristan kom under tahiridiskt styre fram till det zayditiska upproret 864, och al-Afshin, som hade besegrat Babak, anklagades för att ha uppmuntrat Mazyar och dog i fängelse 841.
