# Svenska översättningar av katalogtexten (våg 10); stegtexterna kommer senare.
Meitoku Rebellion: Meitokuupproret
? A rising of the Yamana clan against the Ashikaga shogun Yoshimitsu, fought out in a single day in Kyoto. The Yamana held the military governorships (shugo) of eleven of Japan’s sixty-six provinces and were called “the lords of one-sixth” (rokubun-no-ichi dono), but after the death of their head Yamana Tokiyoshi in 1389 the branches of the family fell out. Yoshimitsu, who was cutting the great governors down to size, first backed Yamana Ujikiyo and Yamana Mitsuyuki against their kinsmen Tokihiro and Ujiyuki, then received the latter back into favour and in late 1391 took Izumo from Mitsuyuki for seizing an estate of the retired emperor. Mitsuyuki and Ujikiyo raised their men, obtained a banner from the Southern Court, and marched on the capital from Tanba and from Sakai. On the last day of the twelfth month of Meitoku 2 (January 1392) they attacked Kyoto and were beaten at Uchino, the empty ground of the old imperial palace, and on Ōmiya avenue by the shogun’s own guards and the troops of Hosokawa Yoriyuki, Ōuchi Yoshihiro, the Hatakeyama, the Isshiki and the Kyōgoku. Ujikiyo was killed. The Yamana were left with three provinces, Tajima, Inaba and Hōki; Izumi and Kii went to Ōuchi Yoshihiro and the rest to other supporters of the shogun. Mitsuyuki escaped, but was caught in 1395 and executed. The victory strengthened Yoshimitsu, who brought the Southern Court to end the schism later in 1392.
: En resning av Yamanaklanen mot Ashikagashogunen Yoshimitsu, som utkämpades på en enda dag i Kyoto. Yamanaklanen innehade de militära guvernörsposterna (shugo) i elva av Japans sextiosex provinser och kallades ”herrarna över en sjättedel” (rokubun-no-ichi dono), men efter klanöverhuvudet Yamana Tokiyoshis död 1389 blev släktens grenar osams. Yoshimitsu, som höll på att beskära de stora guvernörernas makt, stödde först Yamana Ujikiyo och Yamana Mitsuyuki mot deras släktingar Tokihiro och Ujiyuki, tog sedan de senare till nåder igen och fråntog i slutet av 1391 Mitsuyuki Izumo för att denne hade bemäktigat sig ett gods som tillhörde den abdikerade kejsaren. Mitsuyuki och Ujikiyo samlade sina män, fick en fana från Södra hovet och tågade mot huvudstaden från Tanba och från Sakai. På sista dagen i tolfte månaden Meitoku 2 (januari 1392) angrep de Kyoto och slogs vid Uchino, den öde mark där det gamla kejserliga palatset hade legat, och på Ōmiyagatan av shogunens eget garde och trupper under Hosokawa Yoriyuki och Ōuchi Yoshihiro och från Hatakeyama-, Isshiki- och Kyōgokuklanerna. Ujikiyo dödades. Yamanaklanen fick behålla tre provinser, Tajima, Inaba och Hōki; Izumi och Kii gick till Ōuchi Yoshihiro och resten till andra anhängare till shogunen. Mitsuyuki undkom men greps 1395 och avrättades. Segern stärkte Yoshimitsu, som senare under 1392 fick Södra hovet att avsluta schismen.
