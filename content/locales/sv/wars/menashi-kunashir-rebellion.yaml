# Svenska översättningar av katalogtexten (våg 10); stegtexterna kommer senare.
Menashi–Kunashir rebellion: Menashi–Kunashir-upproret
? "An Ainu rising on Kunashir and in the Menashi district on the facing coast of eastern Ezo (Hokkaido). By the 18th century the Matsumae domain let Japanese merchants run its trading posts in return for a fee, and in 1788 the merchant Hidaya Kyūbei began fishing for salmon and trout in the Menashi–Kunashir area with Ainu labour. Ainu workers were driven so hard that they could not lay up food for the winter, supervisors took Ainu wives as mistresses, and rumours spread that Ainu had been poisoned. In the fifth month of 1789 (May–June), while the Kunashir chief Tsukinoe was away hunting sea otters on Urup, young Ainu killed 71 Japanese, 22 on Kunashir and the rest in Menashi and on ships, all of them Hidaya’s employees except one Matsumae soldier. The daimyo Matsumae Michihiro sent about 260 men with firearms, who reached Nokkamappu near Nemuro on 8 July 1789. There was no battle: Tsukinoe, Ikotoi of Akkeshi and Shonko of Nokkamappu persuaded the rebels to lay down their arms, 314 Ainu came in, and 37 men named as leaders were put to death at Nokkamappu. The Matsumae had portraits painted of twelve chiefs who had helped them (the Ishūretsuzō of Kakizaki Hakyō). It was the last large armed rising of the Ainu. Concern that Russian traders were reaching the Ainu of the Kurils was one of the reasons the shogunate took eastern Ezo under its own rule in 1799."
: "Ett ainuuppror på Kunashir och i distriktet Menashi på den mittemot liggande kusten av östra Ezo (Hokkaido). Från 1700-talet lät Matsumaedomänen japanska köpmän driva dess handelsstationer mot en avgift, och 1788 började köpmannen Hidaya Kyūbei fiska lax och öring i området Menashi–Kunashir med ainuisk arbetskraft. Ainuarbetarna drevs så hårt att de inte kunde lägga upp mat för vintern, förmän tog ainumäns hustrur som älskarinnor, och rykten spreds om att ainuer hade förgiftats. I femte månaden 1789 (maj–juni), medan Kunashirhövdingen Tsukinoe var borta på havsuttersjakt på Urup, dödade unga ainuer 71 japaner, 22 på Kunashir och resten i Menashi och på fartyg, samtliga anställda hos Hidaya utom en Matsumaesoldat. Daimyon Matsumae Michihiro sände omkring 260 man med eldvapen, som nådde Nokkamappu nära Nemuro den 8 juli 1789. Det blev ingen strid: Tsukinoe, Ikotoi från Akkeshi och Shonko från Nokkamappu övertalade rebellerna att lägga ner vapnen, 314 ainuer infann sig, och 37 män som utpekades som ledare avrättades i Nokkamappu. Matsumaeklanen lät måla porträtt av tolv hövdingar som hade hjälpt dem (Kakizaki Hakyōs Ishūretsuzō). Det var ainufolkets sista stora väpnade resning. Oron för att ryska handelsmän nådde ainuerna på Kurilerna var ett av skälen till att shogunatet 1799 tog östra Ezo under sitt eget styre."
