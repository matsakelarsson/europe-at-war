# Svenska översättningar av katalogtexten (våg 12); stegtexterna kommer senare.
Expansion of Shewa and Ethiopia under Menelik II: Shewas och Etiopiens expansion under Menelik II
? The wars by which Menelik, king of Shewa from 1865 and emperor of Ethiopia from 1889, brought the lands to the south, west and east of the old Christian highlands under his rule, greatly enlarging the empire and giving Ethiopia most of its present borders. With firearms bought through the Red Sea ports and generals such as Ras Gobana Dacche, Ras Darge, Ras Makonnen and Ras Wolde Giyorgis, his armies took or forced the submission of southern Wollo, the Gurage, the Oromo kingdoms of the Gibe and the Leqa states of Wollega (1875–1886), defeated the king of Gojjam at Embabo (1882), conquered the Arsi Oromo after six campaigns (1881–1886) and the emirate of Harar at Chelenqo (1887), and then, through the great famine of 1888–1892, Bale, Sidamo and Wolaita (1891–1894) and, after the victory over Italy at Adwa, Kaffa (1897), Bela Shangul and the borderlands down to Lake Turkana and the Ogaden. Some peoples submitted by agreement and kept their rulers, as Jimma did; others resisted and suffered heavy losses, enslavement and the loss of their land to soldier-settlers under the gebbar system. Ethiopian national history has long presented the expansion as the building, or the reunification, of the modern state; many Oromo and other southern historians describe it as a colonial conquest comparable to the European conquests of the same years.
: De krig genom vilka Menelik, kung av Shewa från 1865 och kejsare av Etiopien från 1889, lade under sig länderna söder, väster och öster om det gamla kristna höglandet, vilket kraftigt utvidgade riket och gav Etiopien huvuddelen av dess nuvarande gränser. Med eldvapen köpta genom hamnarna vid Röda havet och med generaler som ras Gobana Dacche, ras Darge, ras Makonnen och ras Wolde Giyorgis intog hans arméer, eller tvingade till underkastelse, södra Wollo, gurage, oromokungarikena i Gibe och leqastaterna i Wollega (1875–1886), besegrade kungen av Gojjam vid Embabo (1882), erövrade arsi-oromo efter sex fälttåg (1881–1886) och emiratet Harar vid Chelenqo (1887), och därefter, under den stora hungersnöden 1888–1892, Bale, Sidamo och Wolaita (1891–1894) och, efter segern över Italien vid Adwa, Kaffa (1897), Bela Shangul och gränsländerna ända ned till Turkanasjön och Ogaden. Vissa folk underkastade sig genom överenskommelse och behöll sina härskare, som Jimma; andra gjorde motstånd och drabbades av svåra förluster, förslavning och förlust av sin jord till soldatkolonister under gebbarsystemet. Den etiopiska nationella historieskrivningen har länge framställt expansionen som uppbyggnaden, eller återföreningen, av den moderna staten; många oromohistoriker och andra historiker från södern beskriver den som en kolonial erövring jämförbar med de europeiska erövringarna under samma år.
