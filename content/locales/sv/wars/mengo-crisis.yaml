# Svenska översättningar av katalogtexten (våg 13); stegtexterna kommer senare.
Mengo crisis (Buganda crisis): Mengokrisen (Bugandakrisen)
? "The power struggle between Uganda’s prime minister, Milton Obote, and the Kabaka (king) of Buganda, Mutesa II, which ended with the army storming the Kabaka’s palace on Mengo Hill in Kampala in May 1966. At independence in 1962 Buganda kept wide autonomy in a federal constitution, and in 1963 Mutesa became Uganda’s ceremonial president. Relations broke over the “lost counties”, two counties that Buganda had gained from Bunyoro in the colonial period and that voted to return to Bunyoro in a referendum on 4 November 1964, and over a scandal raised in Parliament in February 1966, when Daudi Ochieng accused Colonel Idi Amin, Obote and two ministers of profiting from gold and ivory from the Congo. Obote answered with what amounted to a coup against his own government: on 22 February 1966 he had five ministers arrested at a cabinet meeting, on 24 February he suspended Mutesa as president and took full powers himself, and in April he imposed a new constitution that ended Buganda’s federal status. On 20 May the Buganda parliament, the Lukiiko, demanded that the central government leave Buganda’s soil within ten days. The government issued an emergency decree and sent troops into the kingdom, and on 24 May 1966 troops under Amin attacked the Lubiri palace at Mengo, defended by 120–160 guards with old rifles and a few machine guns. The guards held out until about 2 pm; Mutesa escaped over the wall, hid at Rubaga Cathedral and fled via Burundi to Britain, where he died in 1969. Volunteers carried over 200 bodies to the morgue and soldiers buried others in mass graves; some estimates put the dead at up to 1,000. The 1967 constitution abolished Uganda’s kingdoms, and the army, and Amin within it, gained the weight that let Amin seize power in 1971. The Buganda monarchy was restored in 1993."
: "Maktkampen mellan Ugandas premiärminister Milton Obote och Bugandas kabaka (kung) Mutesa II, som slutade med att armén stormade kabakans palats på Mengokullen i Kampala i maj 1966. Vid självständigheten 1962 behöll Buganda ett omfattande självstyre i en federal författning, och 1963 blev Mutesa Ugandas ceremoniella president. Förbindelserna bröt samman på grund av de ”förlorade grevskapen”, två grevskap som Buganda hade fått från Bunyoro under kolonialtiden och som röstade för att återgå till Bunyoro i en folkomröstning den 4 november 1964, och på grund av en skandal som togs upp i parlamentet i februari 1966, när Daudi Ochieng anklagade överste Idi Amin, Obote och två ministrar för att ha tjänat pengar på guld och elfenben från Kongo. Obote svarade med vad som i praktiken var en statskupp mot sin egen regering: den 22 februari 1966 lät han gripa fem ministrar vid ett regeringssammanträde, den 24 februari suspenderade han Mutesa som president och tog själv full makt, och i april påtvingade han landet en ny författning som gjorde slut på Bugandas federala ställning. Den 20 maj krävde Bugandas parlament, Lukiiko, att centralregeringen skulle lämna Bugandas mark inom tio dagar. Regeringen utfärdade ett nöddekret och sände trupper in i kungariket, och den 24 maj 1966 anföll trupper under Amin palatset Lubiri i Mengo, som försvarades av 120–160 vakter med gamla gevär och några kulsprutor. Vakterna höll stånd till omkring klockan 14; Mutesa flydde över muren, gömde sig i Rubagakatedralen och flydde via Burundi till Storbritannien, där han dog 1969. Frivilliga bar över 200 kroppar till bårhuset, och soldater begravde andra i massgravar; vissa uppskattningar anger upp till 1 000 döda. Författningen 1967 avskaffade Ugandas kungariken, och armén, och Amin inom den, fick den tyngd som gjorde det möjligt för Amin att ta makten 1971. Bugandas monarki återupprättades 1993."
