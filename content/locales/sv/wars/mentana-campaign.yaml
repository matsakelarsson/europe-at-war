Mentana campaign: Mentanafälttåget
Giuseppe Garibaldi’s attempt in autumn 1867 to take Rome, the last remnant of the Papal States, after the French garrison had left under the September Convention of 1864. The Italian government, bound by the convention, had Garibaldi arrested in September and sent to Caprera, but he escaped, and volunteer columns crossed into Papal territory. A rising in Rome on 22 October failed, the brothers Enrico and Giovanni Cairoli were defeated at Villa Glori, and Garibaldi took Monterotondo on 26 October. France sent troops back to Rome, and on 3 November Papal troops and a French brigade armed with the new Chassepot rifle defeated Garibaldi’s volunteers at Mentana. Garibaldi was arrested again on Italian soil, and the French garrison stayed in Rome until 1870.: Giuseppe Garibaldis försök hösten 1867 att ta Rom, den sista resten av Kyrkostaten, sedan den franska garnisonen lämnat staden enligt septemberkonventionen 1864. Den italienska regeringen, som var bunden av konventionen, lät gripa Garibaldi i september och skicka honom till Caprera, men han flydde, och frivilligkolonner gick in på påvligt område. Ett uppror i Rom den 22 oktober misslyckades, bröderna Enrico och Giovanni Cairoli besegrades vid Villa Glori, och Garibaldi tog Monterotondo den 26 oktober. Frankrike skickade tillbaka trupper till Rom, och den 3 november besegrade påvliga trupper och en fransk brigad, beväpnad med det nya chassepotgeväret, Garibaldis frivilliga vid Mentana. Garibaldi greps på nytt på italiensk mark, och den franska garnisonen stannade i Rom till 1870.
