The French commander, General Pierre de Failly, reported that the Chassepots had “done wonders”, a phrase that angered Italian opinion. A bomb attack by Roman patriots on the Serristori barracks on 22 October killed more than 20 Papal Zouaves; two of the men responsible were executed in 1868.: Den franske befälhavaren, general Pierre de Failly, rapporterade att chassepotgevären hade ”gjort underverk”, ett uttryck som väckte vrede i den italienska opinionen. Ett bombattentat av romerska patrioter mot Serristorikasernen den 22 oktober dödade mer än 20 påvliga zuaver; två av de ansvariga avrättades 1868.
