# Svenska översättningar av katalogtexten (våg 13); stegtexterna kommer senare.
Merina conquest of Madagascar: Merinarikets erövring av Madagaskar
? "The wars in which the Merina kingdom of the central highlands united Imerina and conquered much of Madagascar. In about 1787 Andrianampoinimerina took power at Ambohimanga, one of four rival Merina kingdoms, and by diplomacy and war reunited Imerina, taking Antananarivo in 1793 and pushing south into the Betsileo country; he paid for firearms by selling captives to French slave traders for Mauritius and Réunion. His son Radama I (1810–1828) made Madagascar an ally of Britain: by the treaty of 23 October 1817 he banned the export of slaves in return for arms, money and military instructors, and Britain recognised him as King of Madagascar. With his new army he took the Betsimisaraka east coast and Toamasina (1817), fought the Sakalava of Menabe (1820–1822), took Mahajanga, the port of the Sakalava kingdom of Boina (1824), and Fort Dauphin in the far south (1825). When he died in 1828 the Merina ruled about two thirds of the island, though the Sakalava and the peoples of the south and west remained unconquered."
: "De krig genom vilka Merinariket på det centrala höglandet enade Imerina och erövrade en stor del av Madagaskar. Omkring 1787 tog Andrianampoinimerina makten i Ambohimanga, ett av fyra rivaliserande merinariken, och återförenade Imerina med diplomati och krig; han intog Antananarivo 1793 och trängde söderut in i betsileofolkets land, och han betalade för eldvapen genom att sälja fångar till franska slavhandlare som förde dem till Mauritius och Réunion. Hans son Radama I (1810–1828) gjorde Madagaskar till Storbritanniens bundsförvant: genom fördraget den 23 oktober 1817 förbjöd han export av slavar i utbyte mot vapen, pengar och militära instruktörer, och Storbritannien erkände honom som kung av Madagaskar. Med sin nya armé intog han betsimisarakafolkets östkust och Toamasina (1817), bekämpade sakalava i Menabe (1820–1822), intog Mahajanga, hamnstad i sakalavafolkets kungarike Boina (1824), och Fort Dauphin längst i söder (1825). När han dog 1828 behärskade merina omkring två tredjedelar av ön, även om sakalava och folken i söder och väster förblev obesegrade."
