Messina, a city of some 120,000 people, proud of its privileges and run by a few patrician families, had been at odds with the Spanish viceroys of Sicily for years. On 7 July 1674 its trade guilds and patricians joined forces, besieged the Spanish governor in his palace and drove the garrison out of the city and four of its five forts. Spanish troops and galleys closed in by land and sea, and the city appealed to Louis XIV, then at war with Spain and the Dutch Republic. On 27 September a small French squadron under the Chevalier de Valbelle ran past the Spanish galleys into the harbour with provisions for about five weeks and helped take the last fort, at the harbour mouth.: Messina, en stad med omkring 120 000 invånare, stolt över sina privilegier och styrd av ett fåtal patriciersläkter, hade i åratal legat i konflikt med de spanska vicekungarna på Sicilien. Den 7 juli 1674 gjorde stadens skrån och patricier gemensam sak, belägrade den spanske guvernören i hans palats och drev ut garnisonen ur staden och fyra av dess fem fort. Spanska trupper och galärer slöt sig om staden till lands och till sjöss, och staden vädjade till Ludvig XIV, som då låg i krig med Spanien och Nederländska republiken. Den 27 september tog sig en liten fransk eskader under chevalier de Valbelle förbi de spanska galärerna in i hamnen med förnödenheter för omkring fem veckor och hjälpte till att inta det sista fortet, vid hamninloppet.
Valbelle came back in January 1675 with a few troops, and found the Spanish camped outside the city and about to take it. On 11 February the Duke of Vivonne arrived with more warships, and with a combined fleet of 20 sail the French beat Melchor de la Cueva’s Spanish fleet off the Lipari Islands and sailed into Messina with large convoys of food. Vivonne governed the city as Louis XIV’s viceroy. The French were too few to march inland, but in August they took the port of Augusta, south of Catania, and the war on Sicily became mainly a war at sea. Spain asked its Dutch allies for help, and Michiel de Ruyter sailed for the Mediterranean.: Valbelle återkom i januari 1675 med några trupper och fann spanjorerna lägrade utanför staden och på väg att inta den. Den 11 februari anlände hertigen av Vivonne med fler krigsfartyg, och med en förenad flotta på 20 skepp besegrade fransmännen Melchor de la Cuevas spanska flotta utanför Liparöarna och seglade in i Messina med stora livsmedelskonvojer. Vivonne styrde staden som Ludvig XIV:s vicekung. Fransmännen var för få för att marschera in i landet, men i augusti intog de hamnstaden Augusta, söder om Catania, och kriget på Sicilien blev huvudsakligen ett sjökrig. Spanien bad sina nederländska allierade om hjälp, och Michiel de Ruyter seglade mot Medelhavet.
