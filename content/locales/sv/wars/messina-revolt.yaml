Messina revolt: Messinaupproret
The rising of the Sicilian port of Messina against Spanish rule in 1674, which drew in France during the Franco-Dutch War. French squadrons broke the Spanish blockade, and the French fleet beat the Spanish and their Dutch allies off Sicily, killing the great Dutch admiral de Ruyter. But Louis XIV saw Sicily as a sideshow, and in March 1678 his troops sailed away, leaving Messina to Spanish reprisals.: Den sicilianska hamnstaden Messinas uppror mot det spanska styret 1674, som drog in Frankrike under fransk-nederländska kriget. Franska eskadrar bröt den spanska blockaden, och den franska flottan besegrade spanjorerna och deras nederländska allierade utanför Sicilien, varvid den store nederländske amiralen de Ruyter dödades. Men Ludvig XIV såg Sicilien som en bisak, och i mars 1678 seglade hans trupper bort och lämnade Messina åt spanska repressalier.
