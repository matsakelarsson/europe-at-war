Messina in revolt: Messina i uppror
De Ruyter, now nearly seventy, brought 18 Dutch warships, too lightly manned after years of war. On 8 January 1676 he fought Abraham Duquesne’s French fleet of 20 ships for eight hours off Stromboli and Alicudi, without result. On 22 April the Dutch and Spanish, under the Spanish admiral de la Cerda, met Duquesne again off Augusta. The Spanish centre hung back, the Dutch van bore the brunt, and de Ruyter was hit in the legs by a cannonball; he died at Syracuse a week later. On 2 June Vivonne caught the battered allied fleet at anchor in the bay of Palermo and sent fireships among it. Several Spanish and Dutch ships blew up, and both Spanish admirals and the Dutch commander, Jan den Haen, were killed.: De Ruyter, nu nästan sjuttio år, förde med sig 18 nederländska krigsfartyg, alltför svagt bemannade efter åratal av krig. Den 8 januari 1676 drabbade han samman med Abraham Duquesnes franska flotta på 20 skepp i åtta timmar utanför Stromboli och Alicudi, utan avgörande. Den 22 april mötte nederländarna och spanjorerna, under den spanske amiralen de la Cerda, Duquesne på nytt utanför Augusta. Den spanska centern höll sig tillbaka, den nederländska förtruppen fick bära stridens tyngd, och de Ruyter träffades i benen av en kanonkula; han dog i Syrakusa en vecka senare. Den 2 juni överraskade Vivonne den sargade allierade flottan för ankar i Palermobukten och sände in brännare bland skeppen. Flera spanska och nederländska skepp sprang i luften, och båda de spanska amiralerna och den nederländske befälhavaren, Jan den Haen, dödades.
France now ruled the seas around Sicily, but Louis XIV had never meant to conquer the island. When England and the Dutch Republic allied in January 1678, he decided to pull out. The Duke of La Feuillade arrived in February, supposedly as the new viceroy, and on 13 March 1678 embarked the French troops on the pretext of an attack on Palermo, then told the city that the French were leaving for good. A few hundred leading families sailed with them. The Spanish viceroy returned unopposed, promising an amnesty that was not kept. Messina lost its privileges and its senate, and the Spanish built a citadel to hold it down. The Peace of Nijmegen that summer left Sicily Spanish.: Frankrike behärskade nu haven kring Sicilien, men Ludvig XIV hade aldrig haft för avsikt att erövra ön. När England och Nederländska republiken slöt förbund i januari 1678 beslöt han att dra sig ur. Hertigen av La Feuillade anlände i februari, till synes som ny vicekung, och den 13 mars 1678 skeppade han in de franska trupperna under förevändning av ett anfall mot Palermo och meddelade sedan staden att fransmännen lämnade den för gott. Några hundra ledande familjer seglade med dem. Den spanske vicekungen återvände utan motstånd och utlovade en amnesti som inte hölls. Messina förlorade sina privilegier och sin senat, och spanjorerna byggde ett citadell för att hålla staden i schack. Freden i Nijmegen samma sommar lät Sicilien förbli spanskt.
