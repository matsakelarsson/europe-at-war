# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
Mexican–American War: Mexikansk-amerikanska kriget
? The war of 1846–1848 in which the United States conquered the northern half of Mexico. The United States annexed Texas in 1845, which Mexico still regarded as a rebel province, and President James K. Polk, who wanted California and New Mexico as well, sent an army under Zachary Taylor to the Rio Grande, into land between the Nueces and the Rio Grande that both countries claimed. After Mexican cavalry attacked a US patrol there in April 1846, Congress declared war. Taylor won at Palo Alto, Resaca de la Palma, Monterrey and Buena Vista; Stephen W. Kearny took New Mexico and, with the navy and volunteers, California, where the Californios rose and were put down; and in 1847 Winfield Scott landed at Veracruz and fought his way inland to Mexico City, which fell in September. By the Treaty of Guadalupe Hidalgo of 2 February 1848 Mexico recognised the Rio Grande as the border of Texas and ceded California and New Mexico, together with Texas about half of its territory, for $15 million. About 13,000 Americans died, most of disease; Mexican losses are less certain but were higher. The war deepened the conflict over slavery in the United States, and in Mexico it is remembered as the US intervention, a national trauma.
: Kriget 1846–1848 där USA erövrade den norra halvan av Mexiko. USA annekterade 1845 Texas, som Mexiko fortfarande betraktade som en upprorisk provins, och president James K. Polk, som också ville ha Kalifornien och New Mexico, sände en armé under Zachary Taylor till Rio Grande, in i det område mellan Nueces och Rio Grande som båda länderna gjorde anspråk på. Sedan mexikanskt kavalleri hade anfallit en amerikansk patrull där i april 1846 förklarade kongressen krig. Taylor segrade vid Palo Alto, Resaca de la Palma, Monterrey och Buena Vista; Stephen W. Kearny intog New Mexico och, med flottan och frivilliga, Kalifornien, där californios reste sig och slogs ned; och 1847 landsteg Winfield Scott i Veracruz och kämpade sig fram inåt landet till Mexico City, som föll i september. Genom fördraget i Guadalupe Hidalgo den 2 februari 1848 erkände Mexiko Rio Grande som gräns för Texas och avträdde Kalifornien och New Mexico, tillsammans med Texas omkring hälften av sitt territorium, för 15 miljoner dollar. Omkring 13 000 amerikaner dog, de flesta av sjukdom; de mexikanska förlusterna är mer osäkra men var större. Kriget fördjupade konflikten om slaveriet i USA, och i Mexiko minns man det som den amerikanska interventionen, ett nationellt trauma.
