# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
Mexican Dirty War: Det smutsiga kriget i Mexiko
? "The conflict between the Mexican state, ruled by the Institutional Revolutionary Party (PRI), and left-wing guerrillas and the student and peasant movements it treated as subversive, known in Mexico as the guerra sucia. In Chihuahua the Grupo Popular Guerrillero of the teacher Arturo Gámiz took up arms for landless peasants in 1964, and on 23 September 1965 attacked the army barracks at Ciudad Madera, where Gámiz and most of his comrades were killed. In Mexico City soldiers and the plain-clothes Olympia Battalion opened fire on a student rally in the Plaza de las Tres Culturas at Tlatelolco on 2 October 1968, ten days before the Olympic Games; the government spoke of about 30 dead, and estimates range up to 300 or more. On 10 June 1971 the Halcones, a paramilitary group trained by the state, attacked a student march in the capital (the Corpus Christi massacre or Halconazo), killing dozens of people; some estimates exceed 100. Repression drove many young people to arms. In the mountains of Guerrero two schoolteachers led guerrilla wars: Genaro Vázquez of the National Revolutionary Civic Association (ACNR), who died after a car crash in 1972, and Lucio Cabañas of the Party of the Poor (PDLP), who kidnapped the senator and candidate for governor Rubén Figueroa in 1974 and was killed by the army on 2 December 1974. In the cities the Liga Comunista 23 de Septiembre, founded in Guadalajara in 1973 and named after the Madera attack, robbed banks and kidnapped businessmen and diplomats; its attempt to kidnap the Monterrey industrialist Eugenio Garza Sada left him dead in September 1973. The army, the Federal Security Directorate (DFS) and, from 1976, the police unit known as the Brigada Blanca answered with torture, secret prisons, extrajudicial killings and disappearances, including “death flights” over the Pacific; in and around Atoyac de Álvarez in Guerrero alone, relatives have documented more than 470 people who disappeared. A political reform and an amnesty in 1978 legalised left-wing parties and freed many prisoners, but disappearances went on into the early 1980s. Estimates of the victims range from about 1,200 disappeared, the figure most often given, to some 3,000 killed or disappeared and 7,000 tortured. A special prosecutor’s office (FEMOSPP, 2002–2006) documented the abuses but convicted no senior official, and a case against the former president Luis Echeverría for the killings of 1968 and 1971 was dismissed; in 2019 the government opened the DFS archives and apologised, and in 2021 it set up a truth commission for the abuses of 1965–1990."
: "Konflikten mellan den mexikanska staten, styrd av Institutionella revolutionära partiet (PRI), och vänstergerillor samt de student- och bonderörelser som staten behandlade som omstörtande, i Mexiko känd som la guerra sucia. I Chihuahua grep läraren Arturo Gámiz Grupo Popular Guerrillero till vapen för de jordlösa böndernas sak 1964, och den 23 september 1965 anföll gruppen arméns kasern i Ciudad Madera, där Gámiz och de flesta av hans kamrater dödades. I Mexico City öppnade soldater och den civilklädda Olympiabataljonen eld mot ett studentmöte på Plaza de las Tres Culturas i Tlatelolco den 2 oktober 1968, tio dagar före olympiska spelen; regeringen talade om omkring 30 döda, och uppskattningarna går upp till 300 eller fler. Den 10 juni 1971 angrep Halcones, en paramilitär grupp utbildad av staten, ett studenttåg i huvudstaden (Corpus Christi-massakern eller Halconazo) och dödade tiotals människor; vissa uppskattningar överstiger 100. Förtrycket drev många unga människor att gripa till vapen. I bergen i Guerrero ledde två lärare gerillakrig: Genaro Vázquez från Nationella revolutionära medborgarförbundet (ACNR), som dog efter en bilolycka 1972, och Lucio Cabañas från De fattigas parti (PDLP), som 1974 kidnappade senatorn och guvernörskandidaten Rubén Figueroa och dödades av armén den 2 december 1974. I städerna rånade Liga Comunista 23 de Septiembre, grundad i Guadalajara 1973 och uppkallad efter anfallet i Madera, banker och kidnappade affärsmän och diplomater; dess försök att kidnappa industrimannen Eugenio Garza Sada i Monterrey slutade med att han dödades i september 1973. Armén, Federala säkerhetsdirektoratet (DFS) och från 1976 polisenheten Brigada Blanca svarade med tortyr, hemliga fängelser, utomrättsliga avrättningar och försvinnanden, bland annat ”dödsflygningar” över Stilla havet; bara i och omkring Atoyac de Álvarez i Guerrero har anhöriga dokumenterat mer än 470 personer som har försvunnit. En politisk reform och en amnesti 1978 legaliserade vänsterpartier och frigav många fångar, men försvinnandena fortsatte in på början av 1980-talet. Uppskattningarna av antalet offer varierar från omkring 1 200 försvunna, den siffra som oftast anges, till omkring 3 000 dödade eller försvunna och 7 000 torterade. En särskild åklagarmyndighet (FEMOSPP, 2002–2006) dokumenterade övergreppen men fick ingen högre ämbetsman fälld, och ett mål mot förre presidenten Luis Echeverría för dödandet 1968 och 1971 avskrevs; 2019 öppnade regeringen DFS:s arkiv och bad om ursäkt, och 2021 tillsatte den en sanningskommission för övergreppen 1965–1990."
