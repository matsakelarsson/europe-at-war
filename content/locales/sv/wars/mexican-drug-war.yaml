# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
Mexican drug war: Drogkriget i Mexiko
? "The armed conflict between the Mexican state and the drug-trafficking organisations known as cartels, and among the cartels themselves, since President Felipe Calderón sent the army against them in Michoacán on 11 December 2006. Mexican traffickers had grown rich smuggling Colombian cocaine, and later methamphetamine and fentanyl, into the United States, long protected by corrupt officials. Calderón’s offensive, backed by the United States through the Mérida Initiative, captured or killed many leaders, but the big organisations split and fought each other for routes and towns: the Sinaloa Cartel against the Juárez, Tijuana and Beltrán Leyva organisations, the Gulf Cartel against its former enforcers, Los Zetas, and later the fast-growing Jalisco New Generation Cartel (CJNG) against nearly everyone. Cartels moved into extortion, kidnapping, fuel theft and the control of local governments, and the violence was marked by massacres, mass graves and the disappearance of tens of thousands of people, among them the 43 students of Ayotzinapa in 2014. Neither Enrique Peña Nieto’s policies nor Andrés Manuel López Obrador’s “hugs, not bullets” brought the killing down: Mexico recorded more than 30,000 homicides a year from 2018 to 2024. In 2024 the abduction of the Sinaloa Cartel’s co-founder Ismael “El Mayo” Zambada to the United States set off a war inside the cartel, and under President Claudia Sheinbaum, pressed by the Trump administration, which designated the main cartels as terrorist organisations, the army killed the CJNG’s leader, Nemesio Oseguera, “El Mencho”, in February 2026. Homicides fell in 2025 to about 29,500, the fewest since 2016, but disappearances did not, and more than 130,000 people are registered as missing. How many of the dead since 2006 were killed in the drug war is disputed; estimates of all homicides in the period run to several hundred thousand."
: "Den väpnade konflikten mellan den mexikanska staten och de narkotikasmugglande organisationer som kallas karteller, och mellan kartellerna själva, sedan president Felipe Calderón sände armén mot dem i Michoacán den 11 december 2006. Mexikanska smugglare hade blivit rika på att smuggla colombiansk kokain, och senare metamfetamin och fentanyl, till USA, länge skyddade av korrumperade tjänstemän. Calderóns offensiv, som stöddes av USA genom Méridainitiativet, ledde till att många ledare greps eller dödades, men de stora organisationerna splittrades och bekämpade varandra om smugglingsvägar och städer: Sinaloakartellen mot Juárez-, Tijuana- och Beltrán Leyva-organisationerna, Golfkartellen mot sina tidigare torpeder, Los Zetas, och senare den snabbt växande kartellen Jalisco Nueva Generación (CJNG) mot nästan alla. Kartellerna gav sig in på utpressning, kidnappning, bränslestöld och kontroll över lokala myndigheter, och våldet präglades av massakrer, massgravar och försvinnandet av tiotusentals människor, bland dem de 43 studenterna från Ayotzinapa 2014. Varken Enrique Peña Nietos politik eller Andrés Manuel López Obradors ”kramar, inte kulor” fick ned dödandet: Mexiko registrerade mer än 30 000 mord om året från 2018 till 2024. År 2024 utlöste bortförandet av Sinaloakartellens medgrundare Ismael ”El Mayo” Zambada till USA ett krig inom kartellen, och under president Claudia Sheinbaum, som pressades av Trumpadministrationen, vilken hade klassat de största kartellerna som terroristorganisationer, dödade armén CJNG:s ledare Nemesio Oseguera, ”El Mencho”, i februari 2026. Antalet mord sjönk 2025 till omkring 29 500, det lägsta sedan 2016, men försvinnandena minskade inte, och mer än 130 000 människor är registrerade som försvunna. Hur många av de döda sedan 2006 som dödades i drogkriget är omstritt; uppskattningarna av det totala antalet mord under perioden uppgår till flera hundra tusen."
