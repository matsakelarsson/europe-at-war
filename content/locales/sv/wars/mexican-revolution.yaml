# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
Mexican Revolution: Mexikanska revolutionen
? A decade of risings and civil wars that ended the long rule of Porfirio Díaz, destroyed the old federal army and produced the constitution of 1917 and the state that ruled Mexico for most of the 20th century. Francisco I. Madero’s call to arms in November 1910 brought down Díaz in May 1911, but Madero kept the federal army and faced risings by Emiliano Zapata, who demanded the return of village lands in Morelos, and by Pascual Orozco in Chihuahua. In February 1913 General Victoriano Huerta overthrew Madero, who was murdered. Northern governors and revolutionaries rose under Venustiano Carranza as the Constitutionalists, with Francisco “Pancho” Villa and Álvaro Obregón as their best generals, while Zapata fought on in the south; with US pressure, including the occupation of Veracruz, they drove Huerta out in July 1914. The winners then split. Villa and Zapata, joined in the Convention of Aguascalientes, took Mexico City in December 1914, but Obregón crushed Villa’s army at Celaya and León in 1915, and the United States recognised Carranza. Villa’s raid on Columbus, New Mexico, in 1916 brought a US punitive expedition into Chihuahua. Carranza’s constitution of 1917 promised land reform, labour rights and national ownership of the subsoil, but fighting went on; Zapata was killed in 1919, and in 1920 the Sonoran generals rose under the Plan of Agua Prieta and Carranza was killed while fleeing. Obregón became president in December 1920. Between one million and 1.5 million people died, most of them civilians, of violence, hunger and disease.
: Ett årtionde av resningar och inbördeskrig som gjorde slut på Porfirio Díaz långa styre, förintade den gamla federala armén och gav upphov till 1917 års konstitution och den stat som styrde Mexiko under större delen av 1900-talet. Francisco I. Maderos uppmaning till väpnad resning i november 1910 störtade Díaz i maj 1911, men Madero behöll den federala armén och mötte resningar under Emiliano Zapata, som krävde att byarnas mark i Morelos skulle lämnas tillbaka, och under Pascual Orozco i Chihuahua. I februari 1913 störtade general Victoriano Huerta Madero, som mördades. Guvernörer och revolutionärer i norr reste sig under Venustiano Carranza som konstitutionalister, med Francisco ”Pancho” Villa och Álvaro Obregón som sina främsta generaler, medan Zapata fortsatte kampen i söder; med hjälp av påtryckningar från USA, bland annat ockupationen av Veracruz, drev de ut Huerta i juli 1914. Segrarna splittrades sedan. Villa och Zapata, förenade i konventet i Aguascalientes, intog Mexico City i december 1914, men Obregón krossade Villas armé vid Celaya och León 1915, och USA erkände Carranza. Villas räd mot Columbus i New Mexico 1916 förde en amerikansk straffexpedition in i Chihuahua. Carranzas konstitution från 1917 utlovade jordreform, rättigheter för arbetare och nationens äganderätt till tillgångarna i underjorden, men striderna fortsatte; Zapata dödades 1919, och 1920 reste sig generalerna från Sonora bakom Agua Prieta-planen och Carranza dödades under flykten. Obregón blev president i december 1920. Mellan en miljon och 1,5 miljoner människor dog, de flesta civila, av våld, hunger och sjukdomar.
