# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
Mexican War of Independence: Mexikanska frihetskriget
? The eleven-year war that ended Spanish rule in New Spain. Napoleon’s invasion of Spain in 1808 left the viceroyalty without a legitimate king and set American-born criollos against the Spanish-born officials and merchants who ruled it. On 16 September 1810 the priest Miguel Hidalgo called his parishioners at Dolores to rise (the Grito de Dolores), and a mass army of Indigenous and mestizo farmworkers, miners and townspeople took Guanajuato and marched on Mexico City before royalist troops under Félix María Calleja broke it at Puente de Calderón in January 1811; Hidalgo and the other first leaders were captured and shot. The priest José María Morelos then led a disciplined insurgent army in the south, called a congress that declared independence in 1813 and wrote the Constitution of Apatzingán, but he was captured and executed in 1815. Guerrillas under Vicente Guerrero and others held out in the mountains. In 1821 the royalist officer Agustín de Iturbide made common cause with Guerrero in the Plan of Iguala, most of the army went over to him, and the Army of the Three Guarantees entered Mexico City on 27 September 1821. Estimates of the dead range from about 250,000 to 600,000 in a population of about six million.
: Det elva år långa krig som gjorde slut på det spanska styret i Nya Spanien. Napoleons invasion av Spanien 1808 lämnade vicekungadömet utan legitim kung och ställde de i Amerika födda criollos mot de i Spanien födda ämbetsmän och köpmän som styrde det. Den 16 september 1810 manade prästen Miguel Hidalgo sina församlingsbor i Dolores att resa sig (Grito de Dolores), och en massarmé av lantarbetare, gruvarbetare och stadsbor, ursprungsamerikaner och mestiser, intog Guanajuato och marscherade mot Mexico City innan rojalistiska trupper under Félix María Calleja krossade den vid Puente de Calderón i januari 1811; Hidalgo och de andra första ledarna tillfångatogs och arkebuserades. Prästen José María Morelos ledde därefter en disciplinerad upprorsarmé i söder och sammankallade en kongress som förklarade landet självständigt 1813 och utarbetade Apatzingánkonstitutionen, men han tillfångatogs och avrättades 1815. Gerillor under Vicente Guerrero och andra höll ut i bergen. År 1821 gjorde den rojalistiske officeren Agustín de Iturbide gemensam sak med Guerrero i Igualaplanen, större delen av armén gick över till honom, och de tre garantiernas armé tågade in i Mexico City den 27 september 1821. Uppskattningarna av antalet döda varierar från omkring 250 000 till 600 000 i en befolkning på omkring sex miljoner.
