# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
Miao rebellion (1795–1806): Miaoupproret (1795–1806)
? A rising of the Miao (Hmong and related peoples) of the mountains where western Hunan meets north-eastern Guizhou, around Songtao, Yongsui, Qianzhou and Fenghuang. Through the 18th century the Qing had replaced the hereditary native chiefs of the region with regular officials, and Han Chinese settlers and moneylenders had taken much of the best land, often with the help of officials who extorted and over-taxed the Miao. Early in 1795 Miao villages rose under leaders such as Shi Liudeng in Guizhou and Shi Sanbao and Wu Bayue in Hunan, killed settlers and besieged towns. The Qianlong Emperor sent two of his leading commanders, Fuk’anggan and Helin, with banner troops, Green Standard battalions from neighbouring provinces and local militia; both died in camp in 1796, and the withdrawal of troops from Hubei to fight the Miao is thought to have helped the White Lotus rising there. The main Miao forces were broken by 1797 and their leaders killed or captured, but resistance went on in the hills for years. Under the official Fu Nai, the Qing confiscated rebel land for military colonies, built forts and watchtowers and rebuilt the old Ming frontier wall, the Southern Great Wall, to separate Miao and Han villages, and the region was declared settled in 1806. Losses on both sides are not known.
: En resning bland miao (hmong och besläktade folk) i bergen där västra Hunan möter nordöstra Guizhou, kring Songtao, Yongsui, Qianzhou och Fenghuang. Under 1700-talet hade Qing ersatt områdets ärftliga inhemska hövdingar med reguljära ämbetsmän, och hankinesiska nybyggare och penningutlånare hade tagit mycket av den bästa jorden, ofta med hjälp av ämbetsmän som utpressade och överbeskattade miaofolket. I början av 1795 reste sig miaobyar under ledare som Shi Liudeng i Guizhou och Shi Sanbao och Wu Bayue i Hunan, dödade nybyggare och belägrade städer. Qianlongkejsaren sände två av sina främsta befälhavare, Fuk’anggan och Helin, med fanetrupper, bataljoner ur Gröna standaret från grannprovinserna och lokal milis; båda dog i lägret 1796, och man tror att tillbakadragandet av trupper från Hubei för att bekämpa miao bidrog till Vita lotus-upproret där. Miaos huvudstyrkor var krossade 1797 och deras ledare dödade eller tillfångatagna, men motståndet fortsatte i bergen i åratal. Under ämbetsmannen Fu Nai konfiskerade Qing rebellernas jord för militärkolonier, byggde fästen och vakttorn och byggde upp den gamla gränsmuren från Mingtiden, Södra muren, för att skilja miao- och hanbyar åt, och området förklarades pacificerat 1806. Förlusterna på båda sidor är inte kända.
