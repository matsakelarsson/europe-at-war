Miao rebellion (1854–1873): Miaoupproret (1854–1873)
? A long series of risings in Guizhou, also called the Qian rebellion after the province’s short name, in which Miao and other non-Han peoples, as well as Han and Hui rebels and religious sects, fought the Qing. Poverty, competition for land with Han settlers, corrupt officials and new taxes for the war against the Taiping lay behind it, and the Qing had withdrawn troops from the province. A rising of Buyi farmers under Yang Yuanbao at Dushan in March 1854 was quickly put down, but in March 1855 Zhang Xiumei led the Miao of Taigong in south-eastern Guizhou in revolt, and rebellion spread across much of the province. Rebel bands, some of them allied with Taiping forces passing through, took many towns and threatened the capital Guiyang. After the defeat of the Taiping, Hunan armies under Xi Baotian were sent in during the late 1860s and reconquered the province district by district; Zhang Xiumei was captured in 1872 and executed, and the last resistance ended in 1873. Large parts of Guizhou were left depopulated, and many Miao (Hmong) moved south into what are now Vietnam and Laos.
: En lång serie resningar i Guizhou, även kallade Qianupproret efter provinsens kortnamn, där miao och andra icke-hankinesiska folk, liksom han- och huirebeller och religiösa sekter, bekämpade Qing. Bakom dem låg fattigdom, konkurrens om jorden med hankinesiska nybyggare, korrumperade ämbetsmän och nya skatter för kriget mot taipingrebellerna, och Qing hade dragit tillbaka trupper från provinsen. En resning bland buyibönder under Yang Yuanbao vid Dushan i mars 1854 slogs snabbt ned, men i mars 1855 ledde Zhang Xiumei miaofolket i Taigong i sydöstra Guizhou till uppror, och upproret spred sig över stora delar av provinsen. Rebellskaror, en del av dem allierade med förbipasserande taipingstyrkor, intog många städer och hotade huvudstaden Guiyang. Efter taipingrebellernas nederlag sändes hunanarméer under Xi Baotian in i slutet av 1860-talet och återerövrade provinsen distrikt för distrikt; Zhang Xiumei tillfångatogs 1872 och avrättades, och det sista motståndet upphörde 1873. Stora delar av Guizhou lämnades avfolkade, och många miao (hmong) flyttade söderut till det som i dag är Vietnam och Laos.
