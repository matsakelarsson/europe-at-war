# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
Ming conquest of Đại Ngu and the Later Trần risings: Mingdynastins erövring av Đại Ngu och Senare Trầns resningar
The Ming conquest of the kingdom of Đại Ngu, as Hồ Quý Ly had renamed Đại Việt after taking the Trần throne in 1400, and the risings of the Later Trần princes against Ming rule. When Hồ troops ambushed a Ming escort bringing back a Trần claimant in April 1406, the Yongle Emperor sent two armies, from Guangxi under Zhang Fu and from Yunnan under Mu Sheng, with about 215,000 men and a large train of firearms. They stormed the Hồ fortress of Đa Bang on the Red River in January 1407, took both capitals within days, destroyed the Hồ fleets and in June 1407 captured Hồ Quý Ly and his sons. Instead of restoring the Trần, the Ming annexed the country as the province of Jiaozhi. In 1407 the Trần prince Trần Ngỗi rose in the south and defeated Mu Sheng at Bô Cô in December 1408; after his capture his nephew Trần Quý Khoáng fought on from Nghệ An and Thuận Hóa until Zhang Fu captured him in 1414.: Mingdynastins erövring av kungariket Đại Ngu, som Hồ Quý Ly hade döpt om Đại Việt till sedan han tagit Trầntronen 1400, och de resningar som prinsarna av Senare Trần ledde mot Mingstyret. När trupper från Hồdynastin i april 1406 överföll en Mingeskort som förde tillbaka en Trầnpretendent sände Yonglekejsaren två arméer, från Guangxi under Zhang Fu och från Yunnan under Mu Sheng, med omkring 215 000 man och en stor tross av eldvapen. De stormade Hồdynastins fästning Đa Bang vid Röda floden i januari 1407, intog båda huvudstäderna inom några dagar, förintade Hồdynastins flottor och tillfångatog i juni 1407 Hồ Quý Ly och hans söner. I stället för att återinsätta Trầndynastin annekterade Ming landet som provinsen Jiaozhi. År 1407 reste sig Trầnprinsen Trần Ngỗi i söder och besegrade Mu Sheng vid Bô Cô i december 1408; sedan han tillfångatagits fortsatte hans brorson Trần Quý Khoáng striden från Nghệ An och Thuận Hóa tills Zhang Fu tillfångatog honom 1414.
