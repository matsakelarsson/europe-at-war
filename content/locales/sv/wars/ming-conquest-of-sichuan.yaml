# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
Ming conquest of Sichuan: Mingdynastins erövring av Sichuan
? The campaign in which the Ming dynasty took Sichuan from the Xia state founded by Ming Yuzhen, whose family name has nothing to do with the dynasty’s name. Ming Yuzhen, a Red Turban commander, had made himself master of Sichuan, declared himself king in 1360 and emperor of the Great Xia in 1362, with his capital at Chongqing; at his death in 1366 his nine-year-old son Ming Sheng succeeded him. Xia refused to submit to the Hongwu Emperor, and when its general Wu Youren raided Xingyuan and Hanzhong in 1370, the Ming prepared an invasion from two sides. Early in 1371 Tang He and Liao Yongzhong led a fleet up the Yangtze, while Fu Youde marched south from Shaanxi and Gansu. Fu Youde took Jiezhou, Mianzhou and Hanzhou (Guanghan) between May and July; on the river, the Xia defences in the Qutang Gorge, with chained bridges and catapults, held up Tang He until Liao Yongzhong broke them with cannon fire. The fleets reached Chongqing, where Ming Sheng surrendered on 3 August 1371, and Chengdu, whose defenders had used war elephants against Fu Youde, gave up about a month later. Ming Sheng was given a title and sent in 1372 to live in Goryeo (Korea), and Wu Youren was executed in Nanjing. The conquest opened the way to Yunnan, taken in 1381–1382.
: Det fälttåg under vilket Mingdynastin tog Sichuan från den Xiastat som hade grundats av Ming Yuzhen, vars släktnamn inte har något med dynastins namn att göra. Ming Yuzhen, en befälhavare bland de röda turbanerna, hade gjort sig till herre över Sichuan och utropat sig till kung 1360 och till kejsare av Stora Xia 1362, med huvudstad i Chongqing; vid hans död 1366 efterträddes han av sin nioårige son Ming Sheng. Xia vägrade underkasta sig Hongwukejsaren, och när dess fältherre Wu Youren företog räder mot Xingyuan och Hanzhong 1370 förberedde Mingriket en invasion från två håll. I början av 1371 ledde Tang He och Liao Yongzhong en flotta uppför Yangtze, medan Fu Youde tågade söderut från Shaanxi och Gansu. Fu Youde intog Jiezhou, Mianzhou och Hanzhou (Guanghan) mellan maj och juli; på floden hejdade Xias försvarsverk i Qutangravinen, med kedjebroar och katapulter, Tang He tills Liao Yongzhong bröt igenom dem med kanoneld. Flottorna nådde Chongqing, där Ming Sheng kapitulerade den 3 augusti 1371, och Chengdu, vars försvarare hade satt in krigselefanter mot Fu Youde, gav upp omkring en månad senare. Ming Sheng fick en titel och sändes 1372 att leva i Goryeo (Korea), och Wu Youren avrättades i Nanking. Erövringen öppnade vägen till Yunnan, som intogs 1381–1382.
