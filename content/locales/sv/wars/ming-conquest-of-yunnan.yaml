Ming conquest of Yunnan: Mingdynastins erövring av Yunnan
The campaign that brought Yunnan, the last province held for the Yuan inside China, under the Ming dynasty. Basalawarmi, the Yuan Prince of Liang, governed Yunnan from Kunming and stayed loyal to the Yuan court in Mongolia, refusing the Hongwu Emperor’s embassies and killing his envoy Wang Wei in 1374. In September 1381 the emperor sent Fu Youde with Lan Yu and Mu Ying and an army of about 250,000–300,000 men through Guizhou. Mu Ying defeated the Yuan army of more than 100,000 at the Baishi River near Qujing, and Basalawarmi killed himself on 6 January 1382 as Kunming surrendered. In April Lan Yu and Mu Ying stormed the passes of Dali and captured Duan Shi, the last of the hereditary Duan governors; the final stronghold fell in February 1383. Mu Ying stayed in Yunnan with a large military colony, and his descendants commanded the province until the end of the dynasty.: Det fälttåg som förde Yunnan, den sista provinsen inom Kina som hölls åt Yuan, under Mingdynastin. Basalawarmi, Yuanrikets prins av Liang, styrde Yunnan från Kunming och förblev lojal mot Yuanhovet i Mongoliet; han avvisade Hongwukejsarens beskickningar och dödade 1374 hans sändebud Wang Wei. I september 1381 sände kejsaren Fu Youde med Lan Yu och Mu Ying och en armé på omkring 250 000–300 000 man genom Guizhou. Mu Ying besegrade Yuanarmén på mer än 100 000 man vid floden Baishi nära Qujing, och Basalawarmi tog livet av sig den 6 januari 1382 när Kunming kapitulerade. I april stormade Lan Yu och Mu Ying passen vid Dali och tillfångatog Duan Shi, den siste av de ärftliga Duanguvernörerna; det sista fästet föll i februari 1383. Mu Ying stannade i Yunnan med en stor militärkoloni, och hans ättlingar förde befälet över provinsen till dynastins slut.
