Ming–Kotte war: Kriget mellan Mingriket och Kotte
A brief war in Sri Lanka between the treasure fleet of Ming China under Admiral Zheng He and the Sinhalese ruler Alakeshvara (Vira Alakeshvara), of the Alagakkonara family, who held power at Kotte. The Chinese accused Alakeshvara of piracy against the shipping of the Indian Ocean and of hostility to Ming envoys and to neighbouring states that traded with China. On one of the fleet’s voyages, most authorities say on its way home in 1411, Alakeshvara drew Zheng He and about 2,000 soldiers inland to Kotte and then cut them off from the fleet at Colombo. The Chinese stormed Kotte instead, captured Alakeshvara and his family, beat off the Sinhalese armies that surrounded them and fought their way back to the ships in six days. Zheng He reached Nanjing on 6 July 1411 with his prisoners. The Yongle Emperor freed them and sent them home, and the Ming court recognised a new ruler; Parakramabahu VI, who took the throne of Kotte in 1412, kept good relations with China.: Ett kort krig på Sri Lanka mellan Mingrikets skattflotta under amiral Zheng He och den singalesiske härskaren Alakeshvara (Vira Alakeshvara), av släkten Alagakkonara, som innehade makten i Kotte. Kineserna anklagade Alakeshvara för sjöröveri mot sjöfarten i Indiska oceanen och för fientlighet mot Mingrikets sändebud och mot grannstater som handlade med Kina. Under en av flottans resor, enligt de flesta forskare på hemvägen 1411, lockade Alakeshvara Zheng He och omkring 2 000 soldater inåt land till Kotte och skar sedan av dem från flottan vid Colombo. Kineserna stormade i stället Kotte, tillfångatog Alakeshvara och hans familj, slog tillbaka de singalesiska arméer som omringade dem och kämpade sig tillbaka till skeppen på sex dagar. Zheng He nådde Nanjing den 6 juli 1411 med sina fångar. Kejsar Yongle frigav dem och sände hem dem, och Minghovet erkände en ny härskare; Parakramabahu VI, som besteg Kottes tron 1412, upprätthöll goda förbindelser med Kina.
