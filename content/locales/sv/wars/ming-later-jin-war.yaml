# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
Ming–Later Jin war: Kriget mellan Ming och Senare Jin
? The war in which the Jurchen state of Nurhaci and his son Hong Taiji, the Later Jin, renamed Qing in 1636, took the Ming province of Liaodong and brought Ming China to the edge of collapse. Nurhaci declared war with his Seven Grievances in May 1618 and took Fushun; in April 1619 he destroyed a Ming army of about 90,000 men with a Joseon contingent at Sarhu, and in 1621 he took Shenyang (Mukden) and Liaoyang, the heart of Liaodong. The Ming fell back on a line of fortresses from Shanhai Pass to Ningyuan and Jinzhou, armed with Portuguese-type cannon, and Yuan Chonghuan beat off Nurhaci at Ningyuan (1626) and Hong Taiji at Ningyuan and Jinzhou (1627). Hong Taiji then went round the line through Mongol lands, raiding to the walls of Beijing in 1629–1630, deep into north China in 1636, 1638–1639 and 1642–1643, while his new Han Chinese artillery took Dalinghe (1631) and his allies from the Ming navy brought him Lüshun (1633). After the siege of Jinzhou and the battle of Songshan (1640–1642) only Ningyuan and the approaches to Shanhai Pass were left to the Ming. When Li Zicheng’s rebels took Beijing in April 1644, the Ming general Wu Sangui let the Qing through Shanhai Pass, and the battle there on 27 May 1644 opened the Qing conquest of China.
: Kriget där Nurhacis och hans son Hong Taijis jurchenstat, Senare Jin, som 1636 bytte namn till Qing, tog Mingprovinsen Liaodong och förde Mingriket till randen av sammanbrott. Nurhaci förklarade krig med sina sju klagomål i maj 1618 och intog Fushun; i april 1619 förintade han vid Sarhu en Mingarmé på omkring 90 000 man med en kontingent från Joseon, och 1621 intog han Shenyang (Mukden) och Liaoyang, Liaodongs hjärta. Ming drog sig tillbaka till en linje av fästningar från Shanhaipasset till Ningyuan och Jinzhou, bestyckade med kanoner av portugisisk typ, och Yuan Chonghuan slog tillbaka Nurhaci vid Ningyuan (1626) och Hong Taiji vid Ningyuan och Jinzhou (1627). Hong Taiji gick då runt linjen genom mongoliska områden och gjorde räder ända fram till Pekings murar 1629–1630 och djupt in i norra Kina 1636, 1638–1639 och 1642–1643, medan hans nya hankinesiska artilleri intog Dalinghe (1631) och hans allierade från Mingflottan gav honom Lüshun (1633). Efter belägringen av Jinzhou och slaget vid Songshan (1640–1642) återstod bara Ningyuan och tillfarterna till Shanhaipasset åt Ming. När Li Zichengs rebeller intog Peking i april 1644 släppte Minggeneralen Wu Sangui igenom Qing vid Shanhaipasset, och slaget där den 27 maj 1644 inledde Qings erövring av Kina.
