# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
Ming campaigns against the Northern Yuan: Mingdynastins fälttåg mot Norra Yuan
The wars between the new Ming dynasty and the Yuan court after it left China. When Ming armies took Dadu (Beijing) in September 1368, the last Yuan emperor, Toghon Temür, withdrew to the steppe, and the dynasty lived on in Mongolia as what Chinese historians call the Northern Yuan. In 1369–1370 the Ming took Shanxi, Shaanxi and Gansu, captured the summer capital Shangdu and the refuge at Yingchang, and defeated the Yuan general Köke Temür near Dingxi. A great Ming expedition into Mongolia in 1372 ended in defeat on the Tuul River, and for fifteen years the Hongwu Emperor held a defensive frontier while the Mongol commander Naghachu kept Manchuria for the Yuan. In 1387 a Ming army of about 200,000 forced Naghachu to surrender, and in May 1388 Lan Yu surprised the camp of the khan Tögüs Temür at Buir Lake, taking tens of thousands of prisoners. Tögüs Temür was murdered by a rival soon afterwards. The Yuan line survived, but its power in the steppe was broken and the Oirats rose in the west.: Krigen mellan den nya Mingdynastin och Yuanhovet sedan detta hade lämnat Kina. När Mingarméer intog Dadu (Peking) i september 1368 drog sig den siste Yuankejsaren, Toghon Temür, tillbaka till stäppen, och dynastin levde vidare i Mongoliet i den form som kinesiska historiker kallar Norra Yuan. År 1369–1370 tog Mingriket Shanxi, Shaanxi och Gansu, intog sommarhuvudstaden Shangdu och tillflyktsorten Yingchang och besegrade Yuanfältherren Köke Temür nära Dingxi. En stor Mingexpedition in i Mongoliet 1372 slutade med nederlag vid floden Tuul, och i femton år höll Hongwukejsaren en defensiv gräns medan den mongoliske befälhavaren Naghachu behöll Manchuriet åt Yuan. År 1387 tvingade en Mingarmé på omkring 200 000 man Naghachu att kapitulera, och i maj 1388 överrumplade Lan Yu khanen Tögüs Temürs läger vid Buirsjön och tog tiotusentals fångar. Tögüs Temür mördades av en rival kort därefter. Yuanätten levde vidare, men dess makt på stäppen var bruten och oiraterna reste sig i väster.
