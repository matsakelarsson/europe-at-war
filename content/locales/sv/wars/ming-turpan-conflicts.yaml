Ming–Turfan conflicts: Konflikterna mellan Mingriket och Turfan
A long struggle between Ming China and the Turfan Khanate, the eastern successor of Moghulistan, over the oasis of Hami (Kumul) at the western end of the Gansu corridor. Hami, ruled by a branch of the Chinggisid house known in Chinese as the Hami Guard, was the Ming’s gate to Central Asia and a vassal that sent tribute. Sultan Ali of Turfan seized it in 1473; Ming-backed Hami princes retook it in 1482, Ali’s son Ahmad took it again in 1488 and 1493, and the Ming answered with trade embargoes, the closing of the Jiayu Pass and, in 1495, a raid that briefly retook the oasis. Under Mansur Khan, Turfan annexed Hami in 1513 and raided the Gansu corridor in 1516–1517, 1524 and 1528, besieging Suzhou (Jiuquan). The garrisons held, but in 1529 the Ming court decided not to restore the Hami Guard and to accept Turfan’s tribute, leaving Hami to Turfan.: En lång kamp mellan Mingriket och Turfankhanatet, Moghulistans östra efterföljare, om oasen Hami (Kumul) vid Gansukorridorens västra ände. Hami, som styrdes av en gren av den chinggisidiska ätten, på kinesiska kallad Hamigardet, var Mingrikets port till Centralasien och en tributskyldig vasall. Sultan Ali av Turfan bemäktigade sig oasen 1473; Hamiprinsar med stöd från Ming återtog den 1482, Alis son Ahmad tog den igen 1488 och 1493, och Ming svarade med handelsembargon, stängning av Jiayupasset och 1495 en räd som för en kort tid återtog oasen. Under Mansur khan annekterade Turfan Hami 1513 och företog räder in i Gansukorridoren 1516–1517, 1524 och 1528, varvid Suzhou (Jiuquan) belägrades. Garnisonerna höll stånd, men 1529 beslöt Minghovet att inte återupprätta Hamigardet och att ta emot tribut från Turfan, och lämnade därmed Hami åt Turfan.
