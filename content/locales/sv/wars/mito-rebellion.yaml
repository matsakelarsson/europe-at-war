# Svenska översättningar av katalogtexten (våg 10); stegtexterna kommer senare.
Mito rebellion: Mitoupproret
? A civil war in the Mito domain north-east of Edo, and the long march of its radical faction, the Tengutō (Tengu party), towards Kyoto. Mito, a senior branch of the Tokugawa house, was the home of the Mito school that taught reverence for the emperor, and its samurai were split between radicals who demanded that the shogunate carry out the court’s order to expel the foreigners and conservatives, the Shoseitō, who backed the shogunate. On 2 May 1864 (the 27th day of the third month of Genji 1) Fujita Koshirō, son of the scholar Fujita Tōko, raised a band of 62 men on Mount Tsukuba; it grew to some 1,400 samurai, villagers and rōnin. While some units levied money from towns of the northern Kantō and burned part of Tochigi, the Shoseitō under Ichikawa Sanzaemon took power in Mito. The shogunate sent an army against the rebels, and when the daimyo of the branch domain of Shishido, Matsudaira Yorinori, came to mediate with a large following, he was drawn into the fighting around Nakaminato, forced to surrender and made to commit seppuku. About 1,000 of the rebels gathered at Daigo under Takeda Kōunsai and at the beginning of the eleventh month (late November) set out for Kyoto along the Nakasendō, hoping to put their case to Tokugawa Yoshinobu, a son of the late Mito lord. They beat the Takasaki domain’s troops at Shimonita and the Takashima and Matsumoto troops at Wada Pass, then turned aside through Mino and Echizen in the snow. Yoshinobu himself led troops against them, and on 14 January 1865, cornered at Shinbo near Tsuruga, the 828 who remained surrendered to the Kaga domain. The shogunate took them over, and in March 1865 352 of them were beheaded at Tsuruga, Takeda among them. In Mito the Shoseitō put to death the rebels’ families, women and small children included; when the radicals returned to power in 1868 they took the same revenge on the families of the Shoseitō, and the feud went on into the Boshin War.
: Ett inbördeskrig i Mitodomänen nordost om Edo, och den långa marsch som dess radikala fraktion, Tengutō (Tengupartiet), företog mot Kyoto. Mito, en framstående gren av Tokugawaätten, var hemvist för Mitoskolan, som lärde ut vördnad för kejsaren, och dess samurajer var splittrade mellan radikaler, som krävde att shogunatet skulle verkställa hovets order att fördriva utlänningarna, och konservativa, Shoseitō, som stödde shogunatet. Den 2 maj 1864 (den 27:e dagen i tredje månaden Genji 1) samlade Fujita Koshirō, son till den lärde Fujita Tōko, en skara på 62 man på berget Tsukuba; den växte till omkring 1 400 samurajer, bybor och rōnin. Medan vissa förband utkrävde pengar av städer i norra Kantō och brände en del av Tochigi tog Shoseitō under Ichikawa Sanzaemon makten i Mito. Shogunatet sände en armé mot rebellerna, och när daimyon i sidodomänen Shishido, Matsudaira Yorinori, kom för att medla med ett stort följe drogs han in i striderna kring Nakaminato, tvingades kapitulera och beordrades att begå seppuku. Omkring 1 000 av rebellerna samlades i Daigo under Takeda Kōunsai och gav sig i början av elfte månaden (slutet av november) av mot Kyoto längs Nakasendō, i hopp om att lägga fram sin sak för Tokugawa Yoshinobu, en son till den framlidne Mitofursten. De besegrade Takasakidomänens trupper vid Shimonita och trupperna från Takashima och Matsumoto vid Wadapasset och vek sedan av genom Mino och Echizen i snön. Yoshinobu ledde själv trupper mot dem, och den 14 januari 1865, inringade vid Shinbo nära Tsuruga, kapitulerade de 828 som återstod inför Kagadomänen. Shogunatet tog över dem, och i mars 1865 halshöggs 352 av dem i Tsuruga, bland dem Takeda. I Mito avrättade Shoseitō rebellernas familjer, kvinnor och små barn inräknade; när radikalerna återkom till makten 1868 tog de samma hämnd på Shoseitōs familjer, och fejden fortsatte in i Boshinkriget.
