# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
Mixtón War: Mixtónkriget
A rising of the Caxcanes of New Galicia, in today’s Jalisco and southern Zacatecas, and their Zacateco and other allies against Spanish rule, named after the fortified hill of Mixtón where many of them made their stand. Ten years after Nuño de Guzmán’s conquest of the west, slave raids and forced labour drove the Caxcanes to revolt in 1540. They beat off the first Spanish attacks, and Pedro de Alvarado, conqueror of Guatemala, died of injuries received in a failed assault in June 1541. Viceroy Antonio de Mendoza then led 450 Spaniards and tens of thousands of Indigenous warriors from central Mexico against the strongholds, taking Nochistlán in November 1541 and Mixtón early in 1542. Thousands of captives were executed or enslaved; the Caxcan leader Francisco Tenamaztle held out in the mountains until 1550 or 1551.: Ett uppror bland caxcanerna i Nya Galicien, i dagens Jalisco och södra Zacatecas, och deras allierade bland zacateker och andra folk mot det spanska styret, uppkallat efter den befästa kullen Mixtón där många av dem höll stånd. Tio år efter Nuño de Guzmáns erövring av västern drev slavräder och tvångsarbete caxcanerna till uppror 1540. De slog tillbaka de första spanska anfallen, och Pedro de Alvarado, Guatemalas erövrare, dog av skador som han fått vid ett misslyckat anfall i juni 1541. Vicekung Antonio de Mendoza ledde då 450 spanjorer och tiotusentals ursprungsamerikanska krigare från centrala Mexiko mot fästena och intog Nochistlán i november 1541 och Mixtón i början av 1542. Tusentals fångar avrättades eller förslavades; caxcanledaren Francisco Tenamaztle höll ut i bergen till 1550 eller 1551.
Caxcanes, Zacatecos and their allies (Francisco Tenamaztle, Don Diego the Zacateco): Caxcaner, zacateker och deras allierade (Francisco Tenamaztle, Don Diego el Zacateco)
