Mizo National Front uprising: Mizo National Fronts uppror
An armed rising for the independence of the Mizo Hills, then a district of Assam, led by the Mizo National Front (MNF) of Laldenga, and the twenty-year insurgency that followed; in Mizoram it is remembered as the Rambuai, the troubled years. The MNF grew out of anger at the government’s handling of the famine of 1959. On the night of 28 February 1966 its fighters attacked government posts across the district and on 1 March declared independence. The Indian army retook the towns within weeks, with the air force bombing and strafing Aizawl, and in the following years the government forced most of the villagers into guarded grouping centres. The insurgency continued from bases in East Pakistan and Burma until the Mizoram Peace Accord of 30 June 1986, after which Laldenga became chief minister of the new state of Mizoram.: Ett väpnat uppror för Mizobergens självständighet, då ett distrikt i Assam, lett av Laldengas Mizo National Front (MNF), och det tjugoåriga upprorskrig som följde; i Mizoram minns det som rambuai, de oroliga åren. MNF växte fram ur vreden över regeringens hantering av hungersnöden 1959. Natten den 28 februari 1966 anföll dess kämpar regeringens poster runt om i distriktet, och den 1 mars utropade rörelsen självständighet. Den indiska armén återtog städerna inom några veckor, medan flygvapnet bombade och besköt Aizawl, och under de följande åren tvingade regeringen de flesta bybor att flytta till bevakade samlingsbyar. Upproret fortsatte från baser i Östpakistan och Burma fram till fredsavtalet för Mizoram den 30 juni 1986, varefter Laldenga blev chefsminister i den nya delstaten Mizoram.
