Moamoria rebellion: Moamoriaupproret
? A series of risings in the Ahom kingdom of Assam by the Moamorias, the followers of the Mayamara Vaishnava monastery (satra), most of them Morans and other peasant groups who resented the forced-labour (paik) system and the court’s persecution of their sect. In November 1769 rebels led by Ragha Neog took the capital, Rangpur, and captured King Lakshmi Singha, ruling in his name until royalists retook the city in April 1770 and executed the leaders. A second rising was put down in 1782 with mass killings. In 1786–1788 the rebels rose again, King Gaurinath Singha fled from Rangpur to Guwahati, and rebel leaders held much of Upper Assam. At Gaurinath’s request the East India Company sent Captain Thomas Welsh with a small force, which retook Guwahati in November 1792 and Rangpur in March 1794 before it was recalled. The prime minister Purnananda Burhagohain fought on until a settlement in 1805 left the Moran country around Bengmara self-governing under its own chief, the Barsenapati, who paid tribute. The kingdom is estimated to have lost as much as half of its people to war, famine and flight, which left it open to the Burmese invasions of 1817–1826.
: En serie resningar i ahomriket i Assam av moamoriaerna, anhängarna av det vaishnavitiska klostret (satra) i Mayamara, de flesta av dem moraner och andra bondegrupper som var missnöjda med tvångsarbetssystemet (paik) och hovets förföljelse av deras sekt. I november 1769 intog rebeller under Ragha Neog huvudstaden Rangpur och tillfångatog kung Lakshmi Singha, och de styrde i hans namn tills rojalisterna återtog staden i april 1770 och avrättade ledarna. En andra resning slogs ned 1782 under massdödande. Åren 1786–1788 reste sig rebellerna igen, kung Gaurinath Singha flydde från Rangpur till Guwahati och rebelledare behärskade stora delar av Övre Assam. På Gaurinaths begäran sände Ostindiska kompaniet kapten Thomas Welsh med en liten styrka, som återtog Guwahati i november 1792 och Rangpur i mars 1794 innan den kallades tillbaka. Premiärministern Purnananda Burhagohain fortsatte kampen tills en uppgörelse 1805 gav moranernas land kring Bengmara självstyre under en egen hövding, barsenapati, som betalade tribut. Riket beräknas ha förlorat så mycket som hälften av sin befolkning genom krig, hungersnöd och flykt, vilket lämnade det öppet för de burmesiska invasionerna 1817–1826.
