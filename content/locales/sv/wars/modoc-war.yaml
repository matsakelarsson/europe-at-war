# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
Modoc War: Modockriget
? The war of 1872–1873 between a band of Modoc under Kintpuash (Captain Jack) and the United States Army in the lava beds south of Tule Lake, on the California–Oregon border. By the treaty of 1864 the Modoc gave up their lands on the Lost River and Tule Lake and were moved onto the Klamath Reservation with the Klamath, their old rivals; Kintpuash’s band of about 150 people went back to the Lost River, where settlers demanded their removal. On 29 November 1872 cavalry sent to bring them back tried to disarm them, fighting broke out, and the band fled to a natural fortress of lava trenches and caves, Captain Jack’s Stronghold, while Hooker Jim’s men killed 14 to 18 settlers on the way. With no more than about 53 fighting men, the Modoc beat off an attack by some 300 to 400 soldiers and volunteers on 17 January 1873 without loss. During peace talks on 11 April, under pressure from the band’s war faction, Kintpuash shot General Edward Canby, the only general killed in the wars against Native nations, and Boston Charley killed the Reverend Eleazer Thomas. Reinforced troops drove the Modoc from the Stronghold in April, but Scarfaced Charley’s warriors destroyed a patrol at Sand Butte on 26 April; after the Modoc’s first defeat at Dry Lake on 10 May the band split, Hooker Jim’s group surrendered and helped track Kintpuash, who was captured in early June. He and three others were hanged at Fort Klamath on 3 October 1873, and the 153 survivors of the band were sent as prisoners of war to Indian Territory, where they were held until 1909.
: Kriget 1872–1873 mellan en grupp modoc under Kintpuash (Captain Jack) och USA:s armé i lavafälten söder om Tule Lake, vid gränsen mellan Kalifornien och Oregon. Genom fördraget 1864 gav modoc upp sina landområden vid Lost River och Tule Lake och flyttades till Klamathreservatet tillsammans med klamath, deras gamla rivaler; Kintpuashs grupp på omkring 150 personer återvände till Lost River, där nybyggare krävde att de skulle förflyttas. Den 29 november 1872 försökte kavalleri som sänts för att föra tillbaka dem att avväpna dem, strider bröt ut, och gruppen flydde till en naturlig fästning av lavasprickor och grottor, Captain Jack’s Stronghold, medan Hooker Jims män dödade 14 till 18 nybyggare på vägen. Med högst omkring 53 stridande män slog modoc tillbaka ett anfall av omkring 300 till 400 soldater och frivilliga den 17 januari 1873 utan att lida några förluster. Under fredsförhandlingar den 11 april sköt Kintpuash, under tryck från gruppens krigsfalang, general Edward Canby, den ende general som dödades i krigen mot ursprungsamerikanska nationer, och Boston Charley dödade pastor Eleazer Thomas. Förstärkta trupper drev ut modoc från fästningen i april, men Scarfaced Charleys krigare förintade en patrull vid Sand Butte den 26 april; efter det första nederlaget för modoc, vid Dry Lake den 10 maj, splittrades gruppen, och Hooker Jims grupp gav upp och hjälpte till att spåra Kintpuash, som tillfångatogs i början av juni. Han och tre andra hängdes i Fort Klamath den 3 oktober 1873, och gruppens 153 överlevande sändes som krigsfångar till Indianterritoriet, där de hölls till 1909.
