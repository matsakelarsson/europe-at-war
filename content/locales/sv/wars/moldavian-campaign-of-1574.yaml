Moldavian Campaign of 1574: Moldaviska fälttåget 1574
? The revolt of John III the Terrible (Ioan Vodă cel Cumplit), voivode of Moldavia, against Ottoman overlordship, and its suppression. John, who had taken the throne in 1572 with Ottoman backing and ruled harshly against the boyars, refused a demand to double Moldavia’s tribute, and the Porte named Peter the Lame as voivode in his place. With an army of perhaps 30,000–40,000 Moldavians, joined by about 1,200 Zaporozhian Cossacks under Ivan Svirhovsky, he struck first, and on 24 April 1574 routed an Ottoman, Wallachian and Tatar army at Jiliște near Focșani, then sacked Brăila, overran Wallachia and attacked the Ottoman fortresses of Tighina and Cetatea Albă (Bender and Akkerman). A much larger Ottoman and Crimean Tatar army then entered Moldavia. In June, at Lake Cahul near the Danube, part of the Moldavian army under the boyar Ieremia Cernevici, reportedly bribed, went over to the enemy; John fought on, then retreated to a fortified camp at Roșcani, where he surrendered after several days on a promise that his men would be spared. He was executed, according to tradition by being tied to camels driven apart, and much of his army was massacred. Moldavia remained an Ottoman vassal, and John became a Romanian hero of resistance to the Ottomans.
: Moldaviens vojvod Johan III den grymmes (Ioan Vodă cel Cumplit) revolt mot den osmanska överhögheten, och dess undertryckande. Johan, som hade bestigit tronen 1572 med osmanskt stöd och styrt hårt mot bojarerna, vägrade gå med på ett krav att fördubbla Moldaviens tribut, och Höga porten utnämnde Peter den halte till vojvod i hans ställe. Med en här på kanske 30 000–40 000 moldaver, förstärkt av omkring 1 200 zaporogkosacker under Ivan Svirhovskyj, slog han till först och krossade den 24 april 1574 en osmansk, valakisk och tatarisk här vid Jiliște nära Focșani, plundrade sedan Brăila, överskred Valakiet och angrep de osmanska fästningarna Tighina och Cetatea Albă (Bender och Akkerman). En mycket större osmansk och krimtatarisk här ryckte därefter in i Moldavien. I juni, vid Cahulsjön nära Donau, gick en del av den moldaviska hären under bojaren Ieremia Cernevici, som enligt uppgift hade mutats, över till fienden. Johan kämpade vidare och drog sig sedan tillbaka till ett befäst läger vid Roșcani, där han efter flera dagar kapitulerade mot löfte om att hans män skulle skonas. Han avrättades, enligt traditionen genom att bindas vid kameler som drevs åt olika håll, och en stor del av hans här massakrerades. Moldavien förblev en osmansk vasallstat, och Johan blev en rumänsk hjälte i motståndet mot osmanerna.
