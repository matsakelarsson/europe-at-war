Dates are Julian. Romanian historians often give double dates, such as 14/24 April 1574 for Jiliște; sources also differ on the dates of the battle at Lake Cahul (9 or 10 June) and of John’s death (11 or 14 June). The size of the Ottoman army is very uncertain, with estimates from about 50,000 to 200,000.: Datumen anges enligt den julianska kalendern. Rumänska historiker anger ofta dubbla datum, som 14/24 april 1574 för Jiliște; källorna skiljer sig också åt om datumet för slaget vid Cahulsjön (9 eller 10 juni) och för Johans död (11 eller 14 juni). Den osmanska härens storlek är mycket osäker, med uppskattningar från omkring 50 000 till 200 000.
Wallachia fought on the Ottoman side under its voivode Alexander II Mircea, the brother of Peter the Lame.: Valakiet stred på osmansk sida under sin vojvod Alexander II Mircea, bror till Peter den halte.
