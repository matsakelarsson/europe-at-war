The figures are uncertain. Polish and Venetian reports of 40,000 to 100,000 Ottoman dead at Vaslui are surely exaggerated, though the defeat was severe. A Polish chronicler put Stephen’s army at 30,000–40,000, including Székely, Polish and Hungarian contingents.: Siffrorna är osäkra. Polska och venetianska rapporter om 40 000 till 100 000 osmanska döda vid Vaslui är säkerligen överdrivna, även om nederlaget var svårt. En polsk krönikör uppskattade Stefans här till 30 000–40 000 man, inräknat szekliska, polska och ungerska kontingenter.
Wallachia changed rulers several times in these years. Basarab Laiotă, first Stephen’s candidate, went over to the Ottomans and joined their army in 1475 and 1476.: Valakiet bytte härskare flera gånger under dessa år. Basarab Laiotă, först Stefans kandidat, gick över till osmanerna och anslöt sig till deras här 1475 och 1476.
