Moldavian–Ottoman War, 1474–1476: Moldavisk-osmanska kriget 1474–1476
The war between Stephen III (the Great) of Moldavia and Mehmed II after Stephen stopped paying tribute and fought for control of Wallachia. In January 1475 Stephen destroyed an Ottoman army in the fog at Vaslui, one of the worst Ottoman defeats of the century. The next year Mehmed invaded in person and beat Stephen at Valea Albă, but he could not take Suceava or Neamț, and hunger and plague forced him to withdraw.: Kriget mellan Stefan III (den store) av Moldavien och Mehmed II sedan Stefan slutat betala tribut och kämpat om kontrollen över Valakiet. I januari 1475 förintade Stefan en osmansk här i dimman vid Vaslui, ett av århundradets svåraste osmanska nederlag. Året därpå invaderade Mehmed personligen och besegrade Stefan vid Valea Albă, men han kunde inte inta Suceava eller Neamț, och hunger och pest tvingade honom att dra sig tillbaka.
