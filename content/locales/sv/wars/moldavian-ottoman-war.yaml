In the summer of 1476 Mehmed II led a large army into Moldavia, with Wallachians under Basarab Laiotă, while the Crimean Tatars attacked from the north; the Moldavians drove the Tatars back. With many of his men away defending their homes, Stephen faced the sultan with a small army near Neamț. On 26 July, at Valea Albă (Războieni), he was surrounded and defeated, and escaped with few followers.: Sommaren 1476 förde Mehmed II en stor här in i Moldavien, med valaker under Basarab Laiotă, medan krimtatarerna anföll norrifrån; moldaverna drev tillbaka tatarerna. Med många av sina män borta för att försvara sina hem mötte Stefan sultanen med en liten här nära Neamț. Den 26 juli omringades och besegrades han vid Valea Albă (Războieni) och undkom med ett fåtal följeslagare.
Mehmed advanced to Suceava, which he burned, but the citadel held out, as did the fortresses of Neamț and Hotin. The Ottoman army ran short of food, plague broke out, and a Hungarian and Transylvanian army under Stephen Báthory and Vlad III approached. In August Mehmed withdrew across the Danube. Stephen soon rebuilt his army and helped Vlad back onto the Wallachian throne in November, though Vlad was killed within weeks. Moldavia kept its independence for now, but in 1484 the Ottomans took Kiliia and Cetatea Albă, its ports on the Black Sea.: Mehmed ryckte fram till Suceava, som han brände, men citadellet höll stånd, liksom fästningarna Neamț och Hotin. Den osmanska hären fick ont om livsmedel, pest bröt ut, och en ungersk och transsylvansk här under István Báthory och Vlad III närmade sig. I augusti drog sig Mehmed tillbaka över Donau. Stefan byggde snart upp sin här igen och hjälpte Vlad tillbaka till den valakiska tronen i november, även om Vlad dödades inom några veckor. Moldavien behöll tills vidare sitt oberoende, men 1484 intog osmanerna Kilia och Cetatea Albă, landets hamnar vid Svarta havet.
