Stephen III had fought his way into Wallachia to drive out the Ottoman vassal Radu the Handsome, and in 1473 he stopped paying tribute. Late in 1474 Mehmed II ordered Hadım Süleyman Pasha, the governor of Rumelia, to break off the siege of Shkodër and march on Moldavia. His tired army, joined by Wallachians, crossed the frozen country towards Vaslui. Stephen, with Moldavian peasants and boyars, Székelys and Polish and Hungarian contingents, waited at Podul Înalt, the high bridge over the Bârlad river.: Stefan III hade kämpat sig in i Valakiet för att driva ut den osmanske vasallen Radu den sköne, och 1473 slutade han betala tribut. I slutet av 1474 beordrade Mehmed II Hadım Süleyman pasha, ståthållaren i Rumelien, att avbryta belägringen av Shkodër och marschera mot Moldavien. Hans uttröttade här, förstärkt av valaker, tog sig genom det frusna landet mot Vaslui. Stefan väntade med moldaviska bönder och bojarer, szeklare och polska och ungerska kontingenter vid Podul Înalt, den höga bron över floden Bârlad.
On the foggy morning of 10 January 1475 the Moldavians lured the Ottoman army into the marshy valley with the sound of drums and bugles, then attacked it from the woods on all sides. The Ottomans broke and fled with heavy losses. Stephen sent captured standards to the king of Poland and the pope, who praised him as a champion of Christendom, but little help followed. That summer an Ottoman fleet took the Genoese port of Caffa in the Crimea, and in December Mangup, capital of the Greek principality of Theodoro, whose ruler was Stephen’s brother-in-law, fell after a long siege.: Den dimmiga morgonen den 10 januari 1475 lockade moldaverna in den osmanska hären i den sumpiga dalen med ljudet av trummor och horn och anföll den sedan från skogen på alla sidor. Osmanerna bröt samman och flydde med svåra förluster. Stefan skickade erövrade fanor till kungen av Polen och till påven, som prisade honom som kristenhetens förkämpe, men föga hjälp följde. Samma sommar intog en osmansk flotta den genuesiska hamnstaden Kaffa på Krim, och i december föll Mangup, huvudstad i det grekiska furstendömet Theodoro, vars härskare var Stefans svåger, efter en lång belägring.
