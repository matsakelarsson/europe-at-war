# Svenska översättningar av katalogtexten (våg 7); stegtexterna kommer senare.
Mongol campaign against the Nizaris: Mongolernas fälttåg mot nizariterna
The campaign in which the Mongols destroyed the Nizari Ismaili state, a network of mountain castles in northern and eastern Iran that had resisted the Seljuks and the Khwarazmshahs for more than 150 years and whose fida’is were known in the West as the Assassins. The Great Khan Möngke sent his brother Hülegü west in 1253 with orders to destroy the Nizaris and bring the Abbasid caliph to heel. His general Kitbuqa took castles in Quhistan and besieged Gerdkuh from 1253, and in 1256 Hülegü himself entered the Nizari heartland of Rudbar in the Alborz. The imam Rukn al-Din Khurshah surrendered at Maymun-Diz on 19 November 1256 and ordered his castles to give up; Alamut capitulated in December. Some castles held out for years, but Khurshah was killed in 1257 on Möngke’s orders, and many Nizaris in Mongol hands were massacred.: Det fälttåg under vilket mongolerna förintade den nizaritiska ismailitstaten, ett nätverk av bergsborgar i norra och östra Iran som hade stått emot seldjukerna och khwarazmshaherna i mer än 150 år och vars fida’ier i västerlandet var kända som assassinerna. Storkhanen Möngke sände 1253 sin bror Hülegü västerut med order att förinta nizariterna och tvinga den abbasidiske kalifen till lydnad. Hans general Kitbuqa intog borgar i Quhistan och belägrade Gerdkuh från 1253, och 1256 trängde Hülegü själv in i nizariternas kärnland Rudbar i Alborz. Imamen Rukn al-Din Khurshah kapitulerade vid Maymun-Diz den 19 november 1256 och beordrade sina borgar att ge upp; Alamut kapitulerade i december. Vissa borgar höll ut i flera år, men Khurshah dödades 1257 på Möngkes order, och många nizariter i mongolernas våld massakrerades.
