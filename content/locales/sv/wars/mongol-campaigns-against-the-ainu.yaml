# Svenska översättningar av katalogtexten (våg 10); stegtexterna kommer senare.
Mongol campaigns against the Ainu: Mongolernas fälttåg mot ainufolket
? An intermittent war on Sakhalin and the lower Amur between the Mongol Yuan dynasty and the Ainu. In 1263 the Mongols set up a post at Nurgan on the lower Amur and received the submission of the Nivkh (Gilyaks), who complained that they were attacked every year by the Guwei, the Ainu, who had been moving north from Hokkaido into southern Sakhalin. A Mongol force attacked the Ainu on Sakhalin in late 1264. Attempts to cross the Strait of Tartary failed in 1272–1273, and later expeditions crossed in winter, when the strait froze. Large campaigns followed in 1284–1286, with up to 10,000 men in a thousand small boats; a fort of continental type at Cape Crillon, at the southern tip of Sakhalin, may date from them. After the rebellion of Nayan in 1287 drew Mongol troops away, some Nivkh went over to the Ainu, and in 1297 an Ainu force under the chief Waying crossed to the mainland and raided the Amur estuary before it was defeated near Lake Kizi; it raided again in 1305. In 1308 Waying and another chief, Yushannu, offered submission through the Nivkh and promised a yearly tribute of furs at Nurgan, which became a trade in furs, silk and iron that linked the Amur with Hokkaido and Japan. Whether the campaigns had anything to do with Kublai’s invasions of Japan is doubted by most historians.
: Ett periodvis fört krig på Sachalin och vid nedre Amur mellan den mongoliska Yuandynastin och ainufolket. År 1263 upprättade mongolerna en post i Nurgan vid nedre Amur och tog emot underkastelse av nivcherna (giljakerna), som klagade över att de varje år anfölls av guwei, det vill säga ainu, som hade flyttat norrut från Hokkaido till södra Sachalin. En mongolisk styrka anföll ainu på Sachalin i slutet av 1264. Försök att ta sig över Tatarsundet misslyckades 1272–1273, och senare expeditioner gick över på vintern, när sundet frös. Stora fälttåg följde 1284–1286 med upp till 10 000 man i tusen små båtar; en borg av kontinental typ vid Kap Crillon, på Sachalins sydspets, kan härröra från dem. Sedan Nayans uppror 1287 hade dragit bort mongoliska trupper gick en del nivcher över till ainu, och 1297 gick en ainustyrka under hövdingen Waying över till fastlandet och härjade vid Amurs mynning innan den besegrades nära Kizisjön; den gjorde nya räder 1305. År 1308 erbjöd Waying och en annan hövding, Yushannu, sin underkastelse genom nivcherna och lovade en årlig tribut av pälsverk i Nurgan, som blev en handel med pälsverk, siden och järn som förband Amur med Hokkaido och Japan. De flesta historiker betvivlar att fälttågen hade något samband med Khubilais invasioner av Japan.
