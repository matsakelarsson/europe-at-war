# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
Mongol conquest of the Dali Kingdom: Mongolernas erövring av kungariket Dali
The campaign in which the Mongols conquered the Dali Kingdom, the Bai state in today’s Yunnan that had succeeded Nanzhao in 937. To outflank the Southern Song from the west, the Great Khan Möngke sent his brother Kublai south through the Tibetan borderlands in 1253 with the general Uriyangkhadai. After the Dali court, dominated by the Gao family of chief ministers, had killed the Mongol envoys, three Mongol columns crossed the upper Yangtze (the Jinsha) and converged on the capital, Dali, which was taken around the turn of 1253–1254 and spared. The chief minister Gao Taixiang was caught and executed, and King Duan Xingzhi fled east to Shanchan (Kunming), where Uriyangkhadai captured him in 1254. Möngke kept Duan as ruler under Mongol overlordship, with the title of maharaja, and Uriyangkhadai subdued the rest of Yunnan by 1256. Yunnan became a Mongol base for attacks on the Song and Đại Việt, and later a province of the Yuan.: Det fälttåg under vilket mongolerna erövrade kungariket Dali, baifolkets stat i dagens Yunnan som hade efterträtt Nanzhao 937. För att kringgå Södra Song från väster sände storkhanen Möngke 1253 sin bror Khubilai söderut genom de tibetanska gränsområdena tillsammans med fältherren Uriyangkhadai. Sedan Dalihovet, som dominerades av släkten Gao, vars medlemmar innehade kanslersämbetet, hade dödat de mongoliska sändebuden gick tre mongoliska kolonner över övre Yangtze (Jinsha) och strålade samman vid huvudstaden Dali, som intogs vid årsskiftet 1253–1254 och skonades. Kanslern Gao Taixiang greps och avrättades, och kung Duan Xingzhi flydde österut till Shanchan (Kunming), där Uriyangkhadai tillfångatog honom 1254. Möngke lät Duan behålla makten som härskare under mongolisk överhöghet, med titeln maharaja, och Uriyangkhadai hade kuvat resten av Yunnan 1256. Yunnan blev en mongolisk bas för angrepp på Song och Đại Việt och senare en provins i Yuanriket.
