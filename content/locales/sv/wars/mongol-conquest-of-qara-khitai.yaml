# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
Mongol conquest of Qara Khitai: Mongolernas erövring av Qara Khitai
? "The campaign in which the Mongol general Jebe destroyed the realm of Kuchlug, the Naiman prince who had taken over the Qara Khitai (Western Liao) empire of Central Asia. After his defeat by Genghis Khan in 1204 and on the Irtysh in 1208–1209, Kuchlug had fled to the Qara Khitai, married into the ruling family and in 1211 seized the gurkhan Yelü Zhilugu while he was out hunting, ruling in his name until the old ruler’s death in 1213. The Karluks of Qayaliq and the Uyghurs of Qocho had already gone over to the Mongols. Kuchlug, a convert from Christianity to Buddhism, turned the Muslim towns of Kashgar and Khotan against him by quartering troops on their people, burning their harvests and, according to Juvaini, forcing Muslims to give up their faith or their dress; he is said to have crucified the imam of Khotan on the door of his college. When he besieged Almaliq and killed its Karluk ruler, Ozar, a Mongol vassal married into Genghis Khan’s family, Almaliq appealed to Genghis Khan. Jebe, with about 20,000 men and Uyghur and Karluk allies, relieved Almaliq, defeated a Qara Khitai army of about 30,000 near Balasagun and marched on Kashgar, proclaiming that everyone might keep his own religion. The townspeople killed Kuchlug’s soldiers quartered among them, and Kuchlug fled across the Pamirs; hunters caught him on the borders of Badakhshan and Wakhan and handed him to the Mongols, who beheaded him in 1218. The conquest gave the Mongol Empire a long border with the Khwarazmian Empire, which it invaded in 1219. Sources differ on the dates: Jebe’s campaign is put in 1216, 1217 or 1218, and Kuchlug’s death in 1217 or 1218."
: "Det fälttåg under vilket den mongoliske fältherren Jebe förintade Kuchlugs välde – den naimanske furste som hade tagit över riket Qara Khitai (Västra Liao) i Centralasien. Efter sina nederlag mot Djingis khan 1204 och vid Irtysj 1208–1209 hade Kuchlug flytt till Qara Khitai, gift in sig i den härskande familjen och 1211 gripit gurkhanen Yelü Zhilugu medan denne var ute på jakt, och han härskade sedan i hans namn fram till den gamle härskarens död 1213. Karlukerna i Qayaliq och uigurerna i Qocho hade redan gått över till mongolerna. Kuchlug, som hade konverterat från kristendomen till buddhismen, vände de muslimska städerna Kashgar och Khotan mot sig genom att inkvartera trupper hos invånarna, bränna deras skördar och, enligt Juvaini, tvinga muslimer att överge sin tro eller sin klädedräkt; han ska ha korsfäst imamen i Khotan på dörren till hans lärosäte. När han belägrade Almaliq och dödade dess karlukiske härskare Ozar, en mongolisk vasall som hade gift in sig i Djingis khans familj, vädjade Almaliq till Djingis khan. Jebe, med omkring 20 000 man och uiguriska och karlukiska bundsförvanter, undsatte Almaliq, besegrade en Qara Khitai-armé på omkring 30 000 man nära Balasagun och tågade mot Kashgar under förkunnelsen att var och en fick behålla sin egen religion. Stadsborna dödade de av Kuchlugs soldater som var inkvarterade hos dem, och Kuchlug flydde över Pamir; jägare grep honom vid gränserna till Badakhshan och Wakhan och överlämnade honom till mongolerna, som halshögg honom 1218. Erövringen gav Mongolriket en lång gräns mot Khwarazmiska riket, som det invaderade 1219. Källorna skiljer sig åt i fråga om dateringen: Jebes fälttåg förläggs till 1216, 1217 eller 1218 och Kuchlugs död till 1217 eller 1218."
