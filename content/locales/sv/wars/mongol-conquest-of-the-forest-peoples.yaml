# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
Mongol conquest of the forest peoples: Mongolernas erövring av skogsfolken
? The campaigns in which the Mongols brought the “forest peoples” (hoi-yin irgen) of southern Siberia under their rule, from Lake Baikal to the upper Yenisei. In 1207 Genghis Khan sent his eldest son Jochi north-west. The Oirat chief Qutuqa Beki submitted first and guided the Mongols, and the Buryats, Barguts, Ursut, Qabqanas, Tuba (Tuvans) and the Yenisei Kyrgyz submitted without a battle, sending white gyrfalcons, white horses and sables as tribute; the Oirats were bound to Genghis Khan’s family by marriages. In 1217 the Tumad (Khori-Tumed) west of Lake Baikal, ruled by their queen Botoqui Tarqun, rose and seized the Mongol commanders sent to them, Qorchi and Qutuqa Beki, according to the Secret History; Boroqul, one of Genghis Khan’s oldest companions, led a force against them and was ambushed and killed in the forest. The Kyrgyz refused to send troops and joined the rising, as did several smaller peoples. In the winter of 1217–1218 Dörbei Doqshin surprised the Tumad by cutting a new path through the forest, and Jochi subdued the Kyrgyz and the other peoples of the upper Yenisei. Botoqui was given to Qutuqa Beki as a wife, and a hundred Tumad were handed over to Boroqul’s family in atonement (some accounts say they were killed). The Kyrgyz lands became a Mongol province of craftsmen and farmers. Dates and the order of events follow the Secret History of the Mongols and Rashid al-Din, which do not always agree.
: De fälttåg genom vilka mongolerna förde södra Sibiriens ”skogsfolk” (hoi-yin irgen) under sitt styre, från Bajkalsjön till övre Jenisej. År 1207 sände Djingis khan sin äldste son Jochi mot nordväst. Oiraternas hövding Qutuqa Beki underkastade sig först och vägledde mongolerna, och burjaterna, bargut, ursut, qabqanas, tuba (tuvinerna) och jenisejkirgizerna underkastade sig utan strid och sände vita jaktfalkar, vita hästar och sobelskinn som tribut; oiraterna knöts till Djingis khans familj genom giftermål. År 1217 reste sig enligt Den hemliga historien tumad (khori-tumed) väster om Bajkalsjön under sin drottning Botoqui Tarqun och grep de mongoliska befälhavare som hade sänts till dem, Qorchi och Qutuqa Beki; Boroqul, en av Djingis khans äldsta följeslagare, ledde en styrka mot dem men föll i ett bakhåll och dödades i skogen. Kirgizerna vägrade sända trupper och anslöt sig till resningen, liksom flera mindre folk. Vintern 1217–1218 överrumplade Dörbei Doqshin tumad genom att hugga en ny väg genom skogen, och Jochi kuvade kirgizerna och de andra folken vid övre Jenisej. Botoqui gavs till Qutuqa Beki som hustru, och hundra tumad överlämnades till Boroquls familj som gottgörelse (enligt vissa uppgifter dödades de). Kirgizernas land blev en mongolisk provins med hantverkare och jordbrukare. Datum och händelseförlopp följer Mongolernas hemliga historia och Rashid al-Din, som inte alltid stämmer överens.
