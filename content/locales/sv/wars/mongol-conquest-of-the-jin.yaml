# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
Mongol conquest of the Jin dynasty: Mongolernas erövring av Jindynastin
? The 23-year war in which the Mongols destroyed the Jurchen Jin dynasty, which ruled northern China and Manchuria. Genghis Khan invaded in 1211, routed the Jin field army at Yehuling, and in 1213–1214 his armies ravaged the north China plain while the Jin court was torn by a coup. The Jin bought a truce in 1214 with a princess and tribute, then moved their capital from Zhongdu (today Beijing) to Kaifeng; the Mongols returned and took Zhongdu on 31 May 1215. In the north-east the Khitan Yelü Liuge and the Jurchen general Puxian Wannu, founder of Eastern Xia, broke away. From 1217 Muqali turned raiding into occupation north of the Yellow River, helped by Chinese and Khitan commanders who changed sides, while the Jin fought the Song and Western Xia as well. Under Ögedei the Mongols outflanked the Jin defences by marching through Song territory, destroyed the last Jin army at Sanfengshan in February 1232 and besieged Kaifeng, which surrendered in May 1233 after an epidemic. The last Jin emperor, Aizong, killed himself at Caizhou on 9 February 1234 as a Mongol and Song army broke in. The war devastated northern China, though how many died is unknown.
: Det 23 år långa krig i vilket mongolerna förintade jurchenernas Jindynasti, som härskade över norra Kina och Manchuriet. Djingis khan invaderade 1211 och slog Jins fältarmé på flykten vid Yehuling, och 1213–1214 härjade hans arméer den nordkinesiska slätten medan Jinhovet slets sönder av en statskupp. Jin köpte 1214 ett stillestånd med en prinsessa och tribut och flyttade sedan sin huvudstad från Zhongdu (dagens Peking) till Kaifeng; mongolerna återvände och intog Zhongdu den 31 maj 1215. I nordost bröt sig khitanen Yelü Liuge och jurchenfältherren Puxian Wannu, grundare av Östra Xia, loss. Från 1217 övergick Muqali från räder till ockupation norr om Gula floden, med hjälp av kinesiska och khitanska befälhavare som bytte sida, samtidigt som Jin även kämpade mot Song och Västra Xia. Under Ögedei kringgick mongolerna Jins försvar genom att marschera genom Songs territorium, förintade Jins sista armé vid Sanfengshan i februari 1232 och belägrade Kaifeng, som kapitulerade i maj 1233 efter en epidemi. Den siste Jinkejsaren, Aizong, tog livet av sig i Caizhou den 9 februari 1234 när mongoliska trupper och Songtrupper bröt sig in. Kriget ödelade norra Kina, även om det är okänt hur många som dog.
