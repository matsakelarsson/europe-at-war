# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
Mongol conquest of the Song dynasty: Mongolernas erövring av Songdynastin
? The 45-year war in which the Mongols, from 1271 the Yuan dynasty of Kublai Khan, conquered the Southern Song, the richest and most populous state of its time. After the Song and the Mongols had destroyed the Jin together in 1234, a Song army tried to occupy the old capitals of Kaifeng and Luoyang and was driven out, and in 1235 Ögedei sent his sons against the Song. For two decades the Song held the line of the Huai, the Han and the Yangtze, and in Sichuan a chain of mountain fortresses wore down every invasion; the Great Khan Möngke died before one of them, Diaoyucheng, in 1259. Kublai then changed his strategy, built a fleet and besieged the twin cities of Xiangyang and Fancheng on the Han River for five years (1268–1273). Their fall opened the Yangtze. Bayan led the Yuan army down the river in 1274–1275, destroyed the Song army at Dingjiazhou and received the surrender of the capital, Lin’an (Hangzhou), in February 1276. Loyalists carried two boy emperors south along the coast, until the last Song fleet was destroyed at Yamen near Guangzhou on 19 March 1279. For the first time all of China was ruled by a dynasty from the steppe.
: Det 45 år långa krig i vilket mongolerna, från 1271 Khubilai khans Yuandynasti, erövrade Södra Song, sin tids rikaste och folkrikaste stat. Sedan Song och mongolerna tillsammans hade förintat Jin 1234 försökte en Songarmé ockupera de gamla huvudstäderna Kaifeng och Luoyang men drevs ut, och 1235 sände Ögedei sina söner mot Song. I två decennier höll Song linjen längs Huai, Han och Yangtze, och i Sichuan nötte en kedja av bergsfästningar ned varje invasion; storkhanen Möngke dog framför en av dem, Diaoyucheng, 1259. Khubilai ändrade då sin strategi, byggde en flotta och belägrade tvillingstäderna Xiangyang och Fancheng vid floden Han i fem år (1268–1273). Deras fall öppnade vägen nedför Yangtze. Bayan ledde Yuanarmén nedför floden 1274–1275, förintade Songarmén vid Dingjiazhou och tog emot kapitulationen från huvudstaden Lin’an (Hangzhou) i februari 1276. Lojalister förde två barnkejsare söderut längs kusten, tills den sista Songflottan förintades vid Yamen nära Guangzhou den 19 mars 1279. För första gången styrdes hela Kina av en dynasti från stäppen.
