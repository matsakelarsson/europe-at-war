# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
Mongol conquest of Western Xia: Mongolernas erövring av Västra Xia
The wars in which the Mongols under Genghis Khan raided, subdued and finally destroyed Western Xia, the Tangut kingdom of the Ordos, the Helan Mountains and the Hexi Corridor. After raids in 1205 and 1207, a full invasion in 1209 defeated the Xia armies and besieged the capital, Zhongxing (today Yinchuan); the siege failed when a dike the Mongols had built to flood the city burst, but the Xia ruler submitted in 1210 and became a Mongol vassal and ally against the Jin dynasty. When Western Xia refused troops for the campaign against Khwarazm and later made peace with the Jin, Genghis Khan returned. In 1226 his armies took the towns of the Hexi Corridor one by one and destroyed the Xia field army near Lingzhou on 4 December; Zhongxing was besieged through 1227. Genghis Khan died in August 1227, and the last Xia ruler, who surrendered the next month, was killed on his orders. The capital and much of the country were devastated, and the Tangut state, which had lasted since 1038, came to an end.: De krig i vilka mongolerna under Djingis khan härjade, kuvade och slutligen förintade Västra Xia, tanguternas kungarike i Ordos, Helanbergen och Hexikorridoren. Efter räder 1205 och 1207 besegrade en fullskalig invasion 1209 Xias arméer och belägrade huvudstaden Zhongxing (dagens Yinchuan); belägringen misslyckades när en damm som mongolerna hade byggt för att översvämma staden brast, men Xias härskare underkastade sig 1210 och blev mongolisk vasall och bundsförvant mot Jindynastin. När Västra Xia vägrade ställa trupper till fälttåget mot Khwarazm och senare slöt fred med Jin återvände Djingis khan. År 1226 intog hans arméer Hexikorridorens städer en efter en och förintade Xias fältarmé nära Lingzhou den 4 december; Zhongxing belägrades under 1227. Djingis khan dog i augusti 1227, och Xias siste härskare, som kapitulerade månaden därpå, dödades på hans order. Huvudstaden och stora delar av landet ödelades, och den tangutiska staten, som hade bestått sedan 1038, gick under.
