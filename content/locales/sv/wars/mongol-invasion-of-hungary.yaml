From Zagreb Béla fled to the Dalmatian coast with his family, and a Mongol force under Kadan pursued him across Croatia. In March 1242 it attacked the fortress of Klis above Split, believing the king was there, and threatened Split and Trogir, while Béla waited on an island off Trogir, ready to flee by sea. Finding him out of reach, the Mongols rode south through the hinterland of the coast, sacking Kotor and other towns, and turned inland.: Från Zagreb flydde Béla med sin familj till den dalmatiska kusten, och en mongolisk styrka under Kadan förföljde honom genom Kroatien. I mars 1242 anföll den fästningen Klis ovanför Split, i tron att kungen fanns där, och hotade Split och Trogir, medan Béla väntade på en ö utanför Trogir, beredd att fly sjövägen. När de fann honom utom räckhåll red mongolerna söderut genom kustens inland, plundrade Kotor och andra städer och vände sedan inåt landet.
In the spring of 1242 the Mongols left Hungary as suddenly as they had come, the main army withdrawing through Serbia and Bulgaria, which they plundered and forced to pay tribute, to the steppe north of the Black Sea. Why Batu left is still debated. The death of Ögedei, losses and Cuman unrest, and a cold, wet spring that flooded the plains have all been suggested. Hungary was devastated; estimates of the dead range from 15 to 25 per cent of the population. Béla rebuilt the kingdom, building castles and inviting settlers, and is remembered as its second founder.: Våren 1242 lämnade mongolerna Ungern lika plötsligt som de hade kommit, och huvudhären drog sig tillbaka genom Serbien och Bulgarien, som de plundrade och tvingade att betala tribut, till stäppen norr om Svarta havet. Varför Batu drog sig tillbaka diskuteras fortfarande. Ögedeis död, förluster och oro bland kumanerna samt en kall och regnig vår som översvämmade slätterna har alla föreslagits. Ungern var ödelagt; uppskattningarna av antalet döda varierar från 15 till 25 procent av befolkningen. Béla byggde upp kungariket igen, uppförde borgar och bjöd in nybyggare, och han minns som dess andre grundare.
