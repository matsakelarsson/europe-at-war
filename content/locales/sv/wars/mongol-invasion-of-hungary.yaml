Mongol invasion of Hungary: Mongolernas invasion av Ungern
The invasion of the Kingdom of Hungary by the Mongol armies of Batu and Subutai in 1241–1242. They destroyed King Béla IV’s army at Mohi on the Sajó on 11 April 1241, ravaged the country east of the Danube for most of the year, crossed the frozen river in the winter and pursued Béla to the Dalmatian coast, before withdrawing through Serbia and Bulgaria in the spring of 1242. Perhaps a fifth of Hungary’s people died.: Batus och Subutais mongoliska härars invasion av Kungariket Ungern 1241–1242. De förintade kung Béla IV:s här vid Mohi vid floden Sajó den 11 april 1241, härjade landet öster om Donau under större delen av året, gick under vintern över den frusna floden och förföljde Béla till den dalmatiska kusten, innan de drog sig tillbaka genom Serbien och Bulgarien våren 1242. Kanske en femtedel av Ungerns befolkning omkom.
