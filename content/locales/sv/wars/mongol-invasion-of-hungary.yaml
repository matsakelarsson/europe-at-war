The main sources are the Carmen miserabile of Master Roger, a canon of Várad who was captured by the Mongols and escaped, the history of Thomas, archdeacon of Split, and the Persian historians who wrote for the Mongols, among them Rashid al-Din. Numbers of soldiers and of the dead are very uncertain.: De främsta källorna är Carmen miserabile av magister Rogerius, kanik i Várad som tillfångatogs av mongolerna och lyckades fly, krönikan av Thomas, ärkediakon i Split, och de persiska historiker som skrev för mongolerna, bland dem Rashid al-Din. Uppgifterna om antalet soldater och döda är mycket osäkra.
The invasion of Poland in the same months, with the battle of Legnica, has its own entry. Hungary was invaded again by the Golden Horde in 1285–1286.: Invasionen av Polen under samma månader, med slaget vid Legnica, har en egen post. Ungern invaderades på nytt av Gyllene horden 1285–1286.
