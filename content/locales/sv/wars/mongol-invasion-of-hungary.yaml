The Mongols sacked Pest within days and spent the rest of 1241 east of the Danube, plundering and killing across the Great Hungarian Plain and organising the conquered land as their own. Béla fled to Austria, where Duke Frederick II, known as the Quarrelsome, took his treasure and forced him to pledge three western counties. Béla appealed to the pope, the emperor Frederick II and the kings of the West, but no help came. The Danube held the Mongols back, and on the far bank the Hungarians guarded the crossings.: Mongolerna plundrade Pest inom några dagar och tillbringade resten av 1241 öster om Donau, där de plundrade och dödade över hela Stora ungerska slätten och organiserade det erövrade landet som sitt eget. Béla flydde till Österrike, där hertig Fredrik II, kallad den stridbare, tog hans skatt och tvingade honom att pantsätta tre västliga komitat. Béla vädjade till påven, kejsar Fredrik II och Västerlandets kungar, men ingen hjälp kom. Donau höll mongolerna tillbaka, och på andra stranden bevakade ungrarna övergångsställena.
In the hard winter of 1241–1242 the Danube froze, and around Christmas the Mongols crossed on the ice. They stormed Esztergom, the royal seat, though its citadel held out, and burned Buda. Székesfehérvár, protected by marshes, held out, as did the abbey of Pannonhalma and other stone fortresses. Hungary had few such castles, and the lesson was not lost; after the invasion Béla encouraged nobles and towns to build them. Meanwhile, on 11 December 1241, the Great Khan Ögedei had died in Mongolia.: Under den stränga vintern 1241–1242 frös Donau, och omkring jul gick mongolerna över på isen. De stormade Esztergom, kungasätet, även om dess citadell höll stånd, och brände Buda. Székesfehérvár, skyddat av träsk, höll ut, liksom klostret Pannonhalma och andra stenfästen. Ungern hade få sådana borgar, och lärdomen gick inte förlorad; efter invasionen uppmuntrade Béla adelsmän och städer att bygga dem. Under tiden, den 11 december 1241, hade storkhanen Ögedei dött i Mongoliet.
