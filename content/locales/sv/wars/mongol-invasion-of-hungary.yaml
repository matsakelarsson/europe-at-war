In 1239 King Béla IV of Hungary took in Köten and tens of thousands of Cumans fleeing the Mongols, which angered both the Mongols and many Hungarian nobles. Having conquered the Rus’ principalities, the Mongols attacked Hungary in March 1241. Batu and Subutai’s main army broke through the barricades at the Verecke Pass on 12 March, while other columns crossed the Carpathians into Transylvania, destroying Rodna and Várad, and a northern force came down from Poland. At Pest, where Béla was gathering his army, a mob killed Köten, suspected of treachery, and the Cumans left, plundering as they went.: 1239 tog kung Béla IV av Ungern emot Köten och tiotusentals kumaner på flykt undan mongolerna, vilket väckte vrede både hos mongolerna och hos många ungerska stormän. Sedan mongolerna erövrat de ryska furstendömena anföll de Ungern i mars 1241. Batus och Subutais huvudhär bröt igenom barrikaderna i Vereckepasset den 12 mars, medan andra kolonner gick över Karpaterna in i Transsylvanien och förstörde Rodna och Várad, och en nordlig styrka kom ned från Polen. I Pest, där Béla samlade sin här, dödade en folkmassa Köten, som misstänktes för förräderi, och kumanerna drog bort och plundrade på vägen.
Béla marched east after the Mongol vanguard to the river Sajó, where his army camped near the village of Mohi inside a ring of wagons. On the night of 10–11 April the Mongols forced the bridge with the help of stone-throwers, while Subutai crossed further south. At dawn they surrounded the camp, leaving a gap through which the Hungarians fled, and cut them down along the road to Pest. Many thousands were killed, among them the archbishops of Esztergom and Kalocsa. Béla escaped; his brother Coloman died of his wounds.: Béla marscherade österut efter den mongoliska förtruppen till floden Sajó, där hans här slog läger nära byn Mohi innanför en vagnborg. Natten mellan den 10 och 11 april forcerade mongolerna bron med hjälp av stenkastare, medan Subutai gick över längre söderut. I gryningen omringade de lägret men lämnade en öppning genom vilken ungrarna flydde, och höggs sedan ned längs vägen mot Pest. Många tusen dödades, bland dem ärkebiskoparna av Esztergom och Kalocsa. Béla undkom; hans bror Koloman dog av sina sår.
