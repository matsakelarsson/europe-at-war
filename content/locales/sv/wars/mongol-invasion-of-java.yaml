# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
Mongol invasion of Java: Mongolernas invasion av Java
? "The Yuan expedition that Kublai Khan sent to Java to punish King Kertanagara of Singhasari, who had refused to submit and had sent back the emperor’s envoy Meng Qi with his face branded. Before the fleet arrived, Kertanagara had been overthrown and killed in 1292 by Jayakatwang, the vassal king of Kediri, and his son-in-law Raden Wijaya had submitted to Jayakatwang and founded a settlement at Majapahit in the Tarik forest on the Brantas. When the Yuan army of 20,000 to 30,000 men landed at Tuban early in 1293, Wijaya offered his submission to the emperor and his help against Kediri. Together they defeated Jayakatwang’s fleet at the mouth of the Brantas, beat off his attack on Majapahit and in April took his capital, Daha, where he surrendered. Wijaya then turned on his allies: he ambushed a Yuan escort, attacked their camp and harried them back to their ships, and the Yuan army sailed home with heavy losses, killing Jayakatwang before it left. On 10 November 1293 Wijaya was crowned at Majapahit as Kertarajasa Jayawardhana, the first king of the empire that was to dominate the archipelago for two centuries. It was the last of Kublai Khan’s overseas expeditions."
: "Den Yuanexpedition som Khubilai khan sände till Java för att straffa kung Kertanagara av Singhasari, som hade vägrat att underkasta sig och skickat tillbaka kejsarens sändebud Meng Qi med brännmärkt ansikte. Innan flottan anlände hade Kertanagara 1292 störtats och dödats av Jayakatwang, vasallkungen i Kediri, och hans svärson Raden Wijaya hade underkastat sig Jayakatwang och grundat en bosättning vid Majapahit i Tarikskogen vid Brantas. När Yuanarmén på 20 000 till 30 000 man landsteg i Tuban i början av 1293 erbjöd Wijaya kejsaren sin underkastelse och sin hjälp mot Kediri. Tillsammans besegrade de Jayakatwangs flotta vid Brantas mynning, slog tillbaka hans anfall mot Majapahit och intog i april hans huvudstad Daha, där han kapitulerade. Wijaya vände sig sedan mot sina bundsförvanter: han överföll en Yuaneskort från ett bakhåll, anföll deras läger och jagade dem tillbaka till fartygen, och Yuanarmén seglade hem med svåra förluster, sedan den dödat Jayakatwang före avfärden. Den 10 november 1293 kröntes Wijaya i Majapahit som Kertarajasa Jayawardhana, den förste kungen av det rike som skulle dominera ögruppen i två sekel. Det var den sista av Khubilai khans expeditioner över havet."
