# Svenska översättningar av katalogtexten (våg 7); stegtexterna kommer senare.
Mongol invasion of the Khwarazmian Empire: Mongolernas invasion av Khwarazmiska riket
The invasion in which Genghis Khan destroyed the Khwarazmian Empire, which stretched from the Syr Darya to the Persian Gulf and from the Zagros to the Indus. After the governor of Otrar killed the merchants of a Mongol caravan in 1218 and the Khwarazmshah Muhammad II killed one of Genghis Khan’s envoys, the Mongols crossed the Syr Darya in the autumn of 1219. The Shah spread his troops among the cities, and the Mongols took them one by one, Otrar, Bukhara and Samarkand in 1220, Gurganj, Merv, Nishapur and Herat in 1221, killing much of their populations. Muhammad fled west and died on a Caspian island at the end of 1220. His son Jalal al-Din beat a Mongol army at Parwan but was routed by Genghis Khan on the Indus in November 1221. The war was among the most destructive in history; Khorasan and Transoxiana took generations to recover.: Den invasion under vilken Djingis khan förintade Khwarazmiska riket, som sträckte sig från Syr-Darja till Persiska viken och från Zagros till Indus. Sedan guvernören i Otrar 1218 hade dödat köpmännen i en mongolisk karavan och khwarazmshahen Muhammad II hade dödat ett av Djingis khans sändebud gick mongolerna hösten 1219 över Syr-Darja. Shahen fördelade sina trupper på städerna, och mongolerna intog dem en efter en – Otrar, Buchara och Samarkand 1220, Gurganj, Merv, Nishapur och Herat 1221 – och dödade en stor del av invånarna. Muhammad flydde västerut och dog på en ö i Kaspiska havet i slutet av 1220. Hans son Jalal al-Din slog en mongolisk armé vid Parwan men slogs på flykten av Djingis khan vid Indus i november 1221. Kriget var ett av de mest förödande i historien; det tog Khorasan och Transoxanien generationer att återhämta sig.
