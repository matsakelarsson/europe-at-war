Mongol invasion of Poland: Mongolernas invasion av Polen
A Mongol raid on the divided Polish duchies, sent to protect the flank of the main Mongol invasion of Hungary. In early 1241 the Mongols sacked Sandomierz and Kraków and destroyed a Polish and allied army at Legnica on 9 April, killing Duke Henry II the Pious, before riding south to join the main army.: Ett mongoliskt härjningståg mot de splittrade polska hertigdömena, sänt för att skydda flanken vid den mongoliska huvudinvasionen av Ungern. I början av 1241 plundrade mongolerna Sandomierz och Kraków och förintade en polsk och allierad här vid Legnica den 9 april, där hertig Henrik II den fromme stupade, innan de red söderut för att förena sig med huvudhären.
