Duke Henry II the Pious of Silesia, the strongest of the Polish princes, gathered his Silesians, survivors from Kraków and levies from Greater Poland, troops from Opole under Mieszko II the Fat, Moravians, miners from Złotoryja and a few dozen Templars. Estimates of his army range from about 2,000 to 25,000. His brother-in-law, King Wenceslaus I of Bohemia, was marching to join him with a larger army. The Mongols left Wrocław to strike before the two could meet, and on 9 April they caught Henry at Legnickie Pole, south-east of Legnica.: Hertig Henrik II den fromme av Schlesien, den mäktigaste av de polska furstarna, samlade sina schlesier, överlevande från Kraków och uppbåd från Storpolen, trupper från Opole under Mieszko II den fete, mährare, gruvarbetare från Złotoryja och några dussin tempelherrar. Uppskattningarna av hans här varierar från omkring 2 000 till 25 000 man. Hans svåger, kung Václav I av Böhmen, var på marsch för att förena sig med honom med en större här. Mongolerna lämnade Wrocław för att slå till innan de två kunde mötas, och den 9 april hann de upp Henrik vid Legnickie Pole, sydost om Legnica.
Mongol horsemen drew the Polish cavalry out with feigned retreats, cut it off from the infantry behind a smokescreen and destroyed the army piece by piece. Henry was killed as he tried to escape, and his head was carried on a spear before the walls of Legnica. The Mongols did not stay. After a clash with Bohemian cavalry near Kłodzko they rode south through Moravia to join the main army, which had crushed the Hungarians at Mohi on 11 April. Henry’s death set back the reunification of Poland for decades.: Mongoliska ryttare lockade ut det polska kavalleriet med fingerade reträtter, skar av det från infanteriet bakom en rökridå och förintade hären bit för bit. Henrik dödades när han försökte fly, och hans huvud bars på en lans framför Legnicas murar. Mongolerna stannade inte. Efter en sammandrabbning med böhmiskt kavalleri nära Kłodzko red de söderut genom Mähren för att förena sig med huvudhären, som hade krossat ungrarna vid Mohi den 11 april. Henriks död försenade Polens återförening i årtionden.
