Much of the detail comes from Jan Długosz, writing more than two centuries later, and the sources often disagree on dates and numbers. Some give 3 March rather than 13 February for the fight at Tursko.: Mycket av detaljerna kommer från Jan Długosz, som skrev mer än två sekler senare, och källorna är ofta oense om datum och siffror. En del anger den 3 mars i stället för den 13 februari för striden vid Tursko.
Poland was then divided among several dukes of the Piast dynasty; Henry the Pious of Silesia also ruled Kraków as high duke.: Polen var då delat mellan flera hertigar av Piastdynastin; Henrik den fromme av Schlesien styrde också Kraków som överhertig.
