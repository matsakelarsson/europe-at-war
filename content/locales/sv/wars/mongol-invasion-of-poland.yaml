In the winter of 1240–1241, as the main Mongol armies under Batu and Subutai prepared to invade Hungary, a smaller force under Baidar, Kadan and Orda turned on the Polish duchies to keep their princes from helping the Hungarians. Riding out of Volhynia, which the Mongols had just conquered, it destroyed the stronghold of Sutiejsk and sacked Lublin. In February 1241 it crossed the frozen Vistula, beat a Polish force near Tursko and took Sandomierz, which was sacked after it surrendered on 13 February.: Vintern 1240–1241, när de mongoliska huvudhärarna under Batu och Subutai förberedde invasionen av Ungern, vände sig en mindre styrka under Baidar, Kadan och Orda mot de polska hertigdömena för att hindra deras furstar från att hjälpa ungrarna. Styrkan red ut från Volynien, som mongolerna just hade erövrat, förstörde fästet Sutiejsk och plundrade Lublin. I februari 1241 gick den över den frusna Weichsel, besegrade en polsk styrka nära Tursko och intog Sandomierz, som plundrades sedan staden kapitulerat den 13 februari.
The force then split. Orda’s men ravaged central Poland as far as Łęczyca, while Baidar and Kadan headed for Kraków. On 18 March at Chmielnik they destroyed the knightly levies of Kraków and Sandomierz, whose voivodes were killed; Duke Bolesław V had already withdrawn. Many people fled Kraków for the forests and hills, and the Mongols burned the nearly empty city by 24 March. They crossed the Oder near Racibórz and rode on towards Wrocław, where, according to tradition, the townspeople burned their own town and held out in the castle.: Styrkan delade sig därefter. Ordas män härjade centrala Polen ända till Łęczyca, medan Baidar och Kadan styrde mot Kraków. Den 18 mars vid Chmielnik förintade de riddaruppbåden från Kraków och Sandomierz, vars vojvoder dödades; hertig Bolesław V hade redan dragit sig undan. Många människor flydde från Kraków till skogarna och bergen, och mongolerna brände den nästan tomma staden senast den 24 mars. De gick över Oder nära Racibórz och red vidare mot Wrocław, där stadsborna enligt traditionen brände sin egen stad och höll ut i borgen.
