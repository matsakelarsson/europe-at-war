Another Mongol force besieged Torzhok, Novgorod’s outpost on the road to the grain lands of the south. It held out for two weeks, hoping for help from Novgorod that never came, and fell on 5 March. The Mongols then rode north-west towards Novgorod itself, but about a hundred versts from the city, at a place the chronicles call the Ignach Cross, they turned back. The spring thaw was coming, which would turn the forests and marshes into a morass, and the army had suffered heavy losses. Novgorod, the richest city of the north, was spared.: En annan mongolisk styrka belägrade Torzjok, Novgorods utpost på vägen till spannmålsbygderna i söder. Staden höll ut i två veckor i hopp om hjälp från Novgorod som aldrig kom, och föll den 5 mars. Mongolerna red sedan nordväst mot själva Novgorod, men omkring hundra verst från staden, vid en plats som krönikorna kallar Ignatjkorset, vände de om. Vårens tö närmade sig och skulle förvandla skogarna och träsken till ett gyttjehav, och hären hade lidit svåra förluster. Novgorod, Nordens rikaste stad, skonades.
Heading south, the Mongols passed east of Smolensk, which was also spared, and at the end of March reached Kozelsk, a small town of the Chernigov lands whose prince, Vasily, was a boy of about twelve. Protected by its ramparts and the flooded rivers, the town held out for seven weeks and is said to have killed 4,000 of the besiegers. When it fell in May, the Mongols killed everyone; the chronicle says the young prince drowned in blood, and that the Mongols called Kozelsk the “evil town”. They then withdrew into the steppe to rest.: På väg söderut passerade mongolerna öster om Smolensk, som också skonades, och i slutet av mars nådde de Kozelsk, en liten stad i Tjernigovs länder vars furste, Vasilij, var en pojke på omkring tolv år. Skyddad av sina vallar och de översvämmade floderna höll staden ut i sju veckor och sägs ha dödat 4 000 av belägrarna. När den föll i maj dödade mongolerna alla; krönikan berättar att den unge fursten drunknade i blod och att mongolerna kallade Kozelsk den ”onda staden”. De drog sig sedan tillbaka till stäppen för att vila.
