3 March 1239: 3 mars 1239
The fortress town guarding Kiev against the steppe was stormed and burned.: Fästningsstaden som skyddade Kiev mot stäppen stormades och brändes.
18 October 1239: 18 oktober 1239
The Mongols beat a relief army outside the walls and took the city. The chronicle says their catapults threw stones that four strong men could barely lift.: Mongolerna besegrade en undsättningshär utanför murarna och intog staden. Krönikan uppger att deras katapulter slungade stenar som fyra starka män knappt kunde lyfta.
Murom: Murom
Burned by a Mongol raiding force that also took the Mordvin lands and Gorokhovets.: Bränt av en mongolisk plundringsstyrka som också intog mordvinernas land och Gorochovets.
Batu’s cousin Möngke had demanded Kiev’s surrender, and his envoys were killed. Its prince, Michael of Chernigov, fled to Hungary, and by 1240 the city was held for Prince Daniel of Galicia by his commander, Dmytro. In late November 1240, once the river had frozen, Batu’s whole army crossed and surrounded Kiev. Catapults battered the walls, and on 6 December the Mongols broke in. The last defenders crowded into the Church of the Tithes, which collapsed under their weight. Most of the people were killed; a papal envoy who passed in 1246 saw countless skulls and bones and only about 200 houses.: Batus kusin Möngke hade krävt att Kiev skulle kapitulera, och hans sändebud dödades. Stadens furste, Michail av Tjernigov, flydde till Ungern, och 1240 hölls staden för fursten Daniel av Galizien av hans befälhavare Dmytro. I slutet av november 1240, när floden hade frusit, gick Batus hela här över och omringade Kiev. Katapulter bearbetade murarna, och den 6 december bröt sig mongolerna in. De sista försvararna trängde ihop sig i Tiondekyrkan, som rasade under deras tyngd. De flesta av invånarna dödades; ett påvligt sändebud som passerade 1246 såg otaliga skallar och ben och bara omkring 200 hus.
The Mongols moved on through Volhynia and Galicia in the winter of 1240–1241, taking Volodymyr and Halych, though Kremenets and a few other strongholds held out. In 1241 they invaded Poland and Hungary. News of the death of the Great Khan Ögedei reached them, and in 1242 Batu led his army back to the lower Volga, leaving Rus’ in ruins. Many towns had been burned, many thousands of people killed or carried off, and stone building stopped for decades.: Mongolerna drog vidare genom Volynien och Galizien vintern 1240–1241 och intog Volodymyr och Halytj, även om Kremenets och några andra fästen höll ut. 1241 invaderade de Polen och Ungern. Nyheten om storkhanen Ögedeis död nådde dem, och 1242 förde Batu sin här tillbaka till nedre Volga och lämnade Rus i ruiner. Många städer hade bränts, många tusen människor dödats eller förts bort, och stenbyggandet upphörde i årtionden.
Batu’s realm, the ulus of Jochi, later known as the Golden Horde, held the steppe from the lower Danube to beyond the Urals, with its capital at Sarai on the Volga. The Rus’ principalities kept their own princes, but each prince had to travel to the khan, and sometimes on to Karakorum in Mongolia, to receive a patent to rule, the yarlik. In 1243 Yaroslav of Vladimir was the first to be confirmed as senior prince of Rus’. Censuses were taken in the 1250s, and tribute was paid to the Horde for more than two centuries.: Batus rike, Jochis ulus, senare känt som Gyllene horden, behärskade stäppen från nedre Donau till bortom Ural, med huvudstad i Sarai vid Volga. De ryska furstendömena behöll sina egna furstar, men varje furste måste resa till khanen, och ibland vidare till Karakorum i Mongoliet, för att få ett privilegiebrev att regera, en jarlyk. 1243 blev Jaroslav av Vladimir den förste som bekräftades som Rus främste furste. Folkräkningar genomfördes på 1250-talet, och tribut betalades till horden i mer än två århundraden.
