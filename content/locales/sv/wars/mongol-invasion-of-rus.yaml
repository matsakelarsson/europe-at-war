From Ryazan the Mongols moved up the frozen rivers into the grand principality of Vladimir. In January 1238 they beat Yuri II’s army under his son Vsevolod at Kolomna, where Kulkan, a son of Genghis Khan, was killed. Moscow, then a small fortified town, was burned and Yuri’s son Vladimir taken prisoner. Yuri had left his capital to raise troops in the north. On 3 February the Mongols reached Vladimir and on 7 February they stormed it. The grand prince’s wife and family, who had taken refuge in the Dormition Cathedral, died when it was set on fire.: Från Rjazan drog mongolerna uppför de frusna floderna in i storfurstendömet Vladimir. I januari 1238 besegrade de Jurij II:s här under hans son Vsevolod vid Kolomna, där Kulkan, en son till Djingis khan, dödades. Moskva, då en liten befäst stad, brändes och Jurijs son Vladimir togs till fånga. Jurij hade lämnat sin huvudstad för att samla trupper i norr. Den 3 februari nådde mongolerna Vladimir och den 7 februari stormade de staden. Storfurstens hustru och familj, som hade sökt skydd i Uspenskijkatedralen, omkom när den sattes i brand.
Suzdal fell the same week, and Mongol columns spread out across the north-east. The chronicles list fourteen towns taken that February, from Rostov and Yaroslavl to Tver; some, such as Rostov and Uglich, seem to have submitted and escaped the worst. Yuri gathered his army on the Sit, a river north of the Volga. On 4 March 1238 a Mongol force under Burundai caught it unprepared and destroyed it, and Yuri was killed. His brother Yaroslav, prince of Kiev, came north to take over the ruined principality.: Suzdal föll samma vecka, och mongoliska kolonner spred sig över nordost. Krönikorna räknar upp fjorton städer som intogs den februarimånaden, från Rostov och Jaroslavl till Tver; en del, som Rostov och Uglitj, tycks ha underkastat sig och undgått det värsta. Jurij samlade sin här vid Sit, en flod norr om Volga. Den 4 mars 1238 överraskade en mongolisk styrka under Burundai hären oförberedd och förintade den, och Jurij dödades. Hans bror Jaroslav, furste av Kiev, kom norrut för att ta över det ödelagda furstendömet.
