To the steppe: Till stäppen
The Mongols spent 1238 and 1239 subduing the steppe. They drove the Cumans west, and their khan Köten fled to Hungary with, it is said, 40,000 families. Other forces conquered the Alans in the north Caucasus and the Crimean steppe, and raiding parties struck the north again in 1239, burning Murom and Gorokhovets and fighting along the Klyazma. By then most of the princes of Rus’ were quarrelling over Kiev and Galicia rather than preparing to defend themselves.: Mongolerna tillbringade 1238 och 1239 med att underkuva stäppen. De drev kumanerna västerut, och deras khan Köten flydde till Ungern med, enligt uppgift, 40 000 familjer. Andra styrkor erövrade alanerna i norra Kaukasus och stäppen på Krim, och plundringsstyrkor slog till i norr igen 1239, brände Murom och Gorochovets och stred längs Kljazma. Vid det laget grälade de flesta av Rus furstar om Kiev och Galizien i stället för att förbereda sitt försvar.
On 3 March 1239 the Mongols stormed Pereyaslavl, south-east of Kiev, burned it and killed Bishop Simeon and many of the townspeople. In the autumn they besieged Chernigov, one of the largest cities of Rus’. A relief army under Prince Mstislav Glebovich was beaten outside the walls, and the city was taken and burned on 18 October 1239. Its bishop was taken prisoner and later let go. The left bank of the Dnieper was now in Mongol hands, and Kiev lay across the river.: Den 3 mars 1239 stormade mongolerna Perejaslavl, sydost om Kiev, brände staden och dödade biskop Simeon och många av invånarna. På hösten belägrade de Tjernigov, en av de största städerna i Rus. En undsättningshär under fursten Mstislav Glebovitj besegrades utanför murarna, och staden intogs och brändes den 18 oktober 1239. Dess biskop togs till fånga och släpptes senare. Dneprs vänstra strand var nu i mongolisk hand, och Kiev låg på andra sidan floden.
Pereyaslavl: Perejaslavl
