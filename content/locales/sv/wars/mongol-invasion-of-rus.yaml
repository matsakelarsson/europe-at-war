Mongol invasion of Rus’: Mongolernas invasion av Rus
The conquest of the Rus’ principalities by the Mongol armies of Batu Khan, who sacked Ryazan, Vladimir, Chernigov and Kiev between 1237 and 1240. The principalities kept their own princes but became tributaries of the Golden Horde, whose khans confirmed each prince with a patent, the yarlik, for more than two centuries.: Batu khans mongoliska härars erövring av de ryska furstendömena, då Rjazan, Vladimir, Tjernigov och Kiev plundrades mellan 1237 och 1240. Furstendömena behöll sina egna furstar men blev skattskyldiga till Gyllene horden, vars khaner i mer än två århundraden bekräftade varje furste med ett privilegiebrev, en så kallad jarlyk.
