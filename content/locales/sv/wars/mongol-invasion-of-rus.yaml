The dates come from the Rus’ chronicles, which use the Julian calendar and often contradict one another; Persian and Chinese sources, such as Rashid al-Din, add some details from the Mongol side. Numbers in all of them are unreliable.: Datumen kommer från de ryska krönikorna, som använder den julianska kalendern och ofta motsäger varandra; persiska och kinesiska källor, som Rashid al-Din, tillför vissa detaljer från mongolisk sida. Siffrorna är opålitliga i samtliga.
The Rus’ chroniclers called the invaders Tatars. The raid on Poland and Hungary that followed in 1241 is told under the Mongol invasion of Poland.: De ryska krönikörerna kallade inkräktarna tatarer. Härjningståget mot Polen och Ungern som följde 1241 berättas under Mongolernas invasion av Polen.
Rus’ was divided into many principalities ruled by branches of the Rurikid dynasty. The strongest were Vladimir-Suzdal in the north-east, Novgorod in the north, and Chernigov, Kiev and Galicia–Volhynia in the south.: Rus var delat i många furstendömen som styrdes av grenar av rurikdynastin. De starkaste var Vladimir-Suzdal i nordost, Novgorod i norr samt Tjernigov, Kiev och Galizien-Volynien i söder.
