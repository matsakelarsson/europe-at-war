In 1235 a kurultai, the great council of the Mongols, sent Batu, a grandson of Genghis Khan, with the veteran general Subutai and many princes of Genghis’s line to conquer the lands to the west. Their armies, which included many Turkic troops, gathered on the lower Volga in 1236. That autumn they destroyed Volga Bulgaria and its great trading city of Bilär. In 1237 they fought the Cumans and Alans in the steppe and subdued the Mordvins and Burtas on the forest edge, and by the end of the year they stood on the border of Ryazan, the southernmost Rus’ principality.: 1235 sände en kurultaj, mongolernas stora rådsförsamling, Batu, en sonson till Djingis khan, tillsammans med den erfarne generalen Subutai och många furstar av Djingis ätt för att erövra länderna i väster. Deras härar, som omfattade många turkiska trupper, samlades vid nedre Volga 1236. Samma höst förintade de Volgabulgarien och dess stora handelsstad Biljar. 1237 stred de mot kumaner och alaner på stäppen och underkuvade mordviner och burtaser i skogsbältets utkant, och vid årets slut stod de vid gränsen till Rjazan, det sydligaste ryska furstendömet.
"According to the Novgorod chronicle, Mongol envoys demanded a tenth of everything: people, horses and goods. The princes of Ryazan refused, and Grand Prince Yuri II of Vladimir sent no help. The Mongols beat Ryazan’s forces on the Voronezh river and on 16 December 1237 surrounded its capital. Catapults broke the wooden walls, and on 21 December the city was stormed. Prince Yuri Igorevich and his family were killed with most of the inhabitants, and archaeologists have found mass graves from the sack. Old Ryazan never fully recovered; its princes later moved to Pereyaslavl-Ryazansky, today’s Ryazan.": "Enligt Novgorodkrönikan krävde mongoliska sändebud en tiondel av allt: människor, hästar och varor. Furstarna i Rjazan vägrade, och storfurst Jurij II av Vladimir skickade ingen hjälp. Mongolerna besegrade Rjazans styrkor vid floden Voronezj och omringade den 16 december 1237 dess huvudstad. Katapulter bröt sönder träbefästningarna, och den 21 december stormades staden. Fursten Jurij Igorevitj och hans familj dödades tillsammans med de flesta av invånarna, och arkeologer har hittat massgravar från plundringen. Gamla Rjazan återhämtade sig aldrig helt; dess furstar flyttade senare till Perejaslavl-Rjazanskij, dagens Rjazan."
