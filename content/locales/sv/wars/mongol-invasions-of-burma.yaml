# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
Mongol invasions of Burma: Mongolernas invasioner av Burma
The wars between the Mongol Yuan dynasty, which had made the old Dali Kingdom its province of Yunnan, and the Pagan Kingdom of Burma. After King Narathihapate refused Kublai Khan’s demands for tribute, Mongol troops defeated a Burmese army at Ngasaunggyan on the frontier in 1277. In 1283–1285 a Mongol army took the forts of the upper Irrawaddy and Tagaung, and Narathihapate fled to Lower Burma. A treaty of 1287 accepted Mongol overlordship, but the king was murdered by one of his sons that July and a Mongol army marched south again; whether it reached Pagan is disputed. The Pagan empire broke apart, and power in central Burma passed to three brothers based at Myinsaing. When they deposed the king the Mongols had recognised, a Yuan army of about 12,000 besieged Myinsaing in 1301 but withdrew after the brothers paid it off, and in 1303 the Mongols left northern Burma.: Krigen mellan den mongoliska Yuandynastin, som hade gjort det gamla kungariket Dali till sin provins Yunnan, och Paganriket i Burma. Sedan kung Narathihapate hade avvisat Khubilai khans krav på tribut besegrade mongoliska trupper 1277 en burmesisk armé vid Ngasaunggyan vid gränsen. Åren 1283–1285 intog en mongolisk armé fästena vid övre Irrawaddy och Tagaung, och Narathihapate flydde till Nedre Burma. Ett fördrag 1287 erkände mongolisk överhöghet, men kungen mördades av en av sina söner i juli samma år och en mongolisk armé marscherade åter söderut; om den nådde Pagan är omstritt. Paganriket föll sönder, och makten i mellersta Burma övergick till tre bröder med bas i Myinsaing. När de avsatte den kung som mongolerna hade erkänt belägrade en Yuanarmé på omkring 12 000 man Myinsaing 1301 men drog sig tillbaka sedan bröderna hade köpt bort den, och 1303 lämnade mongolerna norra Burma.
