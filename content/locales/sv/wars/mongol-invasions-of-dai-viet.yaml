# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
Mongol invasions of Đại Việt and Champa: Mongolernas invasioner av Đại Việt och Champa
Four campaigns of the Mongol Empire and Kublai Khan’s Yuan dynasty against Đại Việt, ruled by the Trần dynasty, and Champa. In January 1258 Uriyangkhadai, coming from the newly conquered kingdom of Dali, routed the Trần army and took Thăng Long, which he left after a few days; the Trần then sent tribute. In 1283 a Yuan fleet under Sogetu landed in Champa and took its capital Vijaya, but the Cham king withdrew to the hills and fought on. In 1285 Kublai’s son Toghon invaded Đại Việt, took Thăng Long and, with Sogetu marching north from Champa, drove the Trần court to the coast; by June a Vietnamese counter-offensive led by Trần Hưng Đạo had killed Sogetu and driven the Yuan armies out. A third invasion in 1287–1288 again took the capital, but the loss of its supply fleet at Vân Đồn forced a retreat, and on 9 April 1288 its fleet was destroyed on the stakes of the Bạch Đằng. Đại Việt and Champa kept their independence and sent tribute to the Yuan; Vietnam remembers the wars as a national victory.: Fyra fälttåg som Mongolriket och Khubilai khans Yuandynasti förde mot Đại Việt, som styrdes av Trầndynastin, och mot Champa. I januari 1258 kom Uriyangkhadai från det nyss erövrade kungariket Dali, slog Trầnarmén på flykten och intog Thăng Long, som han lämnade efter några dagar; Trầndynastin sände därefter tribut. År 1283 landsteg en Yuanflotta under Sogetu i Champa och intog dess huvudstad Vijaya, men chamkungen drog sig tillbaka till bergen och fortsatte striden. År 1285 invaderade Khubilais son Toghon Đại Việt, intog Thăng Long och drev Trầnhovet ut till kusten, medan Sogetu marscherade norrut från Champa; i juni hade en vietnamesisk motoffensiv under ledning av Trần Hưng Đạo dödat Sogetu och drivit ut Yuanarméerna. En tredje invasion 1287–1288 intog åter huvudstaden, men förlusten av försörjningsflottan vid Vân Đồn tvingade fram ett återtåg, och den 9 april 1288 förintades invasionsflottan på pålarna i Bạch Đằng. Đại Việt och Champa behöll sin självständighet och sände tribut till Yuan; i Vietnam minns man krigen som en nationell seger.
