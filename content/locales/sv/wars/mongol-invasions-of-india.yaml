# Svenska översättningar av katalogtexten (våg 8); stegtexterna kommer senare.
Mongol invasions of India: Mongolernas invasioner av Indien
"The Mongol attacks on the Delhi Sultanate after Jalal al-Din’s flight across the Indus. In 1241 a Mongol army sacked Lahore, and for two decades the western Punjab and Sindh lay open to raids from Mongol-held Afghanistan. Sultan Balban answered with a chain of frontier forts, and his son Prince Muhammad was killed fighting the Mongols in 1285. The great invasions came from the Chagatai Khanate under its khan Duwa: Alauddin Khalji’s armies beat them at Jaran-Manjur (1298) and Sivistan, held them at Kili outside Delhi (1299), outlasted a two-month siege of Delhi in 1303 and crushed them at Amroha (1305) and on the Ravi (1306), killing or enslaving tens of thousands of prisoners. After Duwa’s death in 1307 the raids dwindled; the last major one, under the Chagatai prince Tarmashirin in 1327, reached the Yamuna.": "Mongolernas angrepp på Delhisultanatet efter Jalal al-Dins flykt över Indus. År 1241 plundrade en mongolisk armé Lahore, och under två årtionden låg västra Punjab och Sind öppna för räder från det mongolbehärskade Afghanistan. Sultan Balban svarade med en kedja av gränsfästningar, och hans son prins Muhammad stupade i strid mot mongolerna 1285. De stora invasionerna kom från Tjagataikhanatet under dess khan Duwa: Alauddin Khaljis arméer slog dem vid Jaran-Manjur (1298) och Sivistan, höll stånd mot dem vid Kili utanför Delhi (1299), uthärdade en två månader lång belägring av Delhi 1303 och krossade dem vid Amroha (1305) och vid Ravi (1306), varvid tiotusentals fångar dödades eller förslavades. Efter Duwas död 1307 avtog räderna; den sista stora, under tjagataiprinsen Tarmashirin 1327, nådde Yamuna."
