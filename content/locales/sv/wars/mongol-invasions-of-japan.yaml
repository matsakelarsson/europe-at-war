# Svenska översättningar av katalogtexten (våg 10); stegtexterna kommer senare.
Mongol invasions of Japan: Mongolernas invasioner av Japan
? The two attempts by Kublai Khan, the Mongol emperor of the Yuan dynasty, to conquer Japan, with armies drawn from Mongols, Chinese, Jurchens and Koreans and ships and sailors levied from Goryeo and southern China. After the Kamakura shogunate, led by the young regent Hōjō Tokimune, ignored six embassies between 1266 and 1273, a fleet of some 900 ships sailed from Korea in November 1274, overran Tsushima and Iki and landed in Hakata Bay on 19 November. The invaders drove the Kyushu warriors inland and burned Hakata, but withdrew to their ships the same night, and many ships were wrecked by a storm on the way home. The shogunate executed Kublai’s next envoys and built a stone wall around Hakata Bay. In 1281, after the conquest of Song China, Kublai sent two fleets, an Eastern Route army from Korea and a much larger Southern Route army from China; Yuan records give 140,000 men, a figure modern historians think greatly inflated. The Eastern Route army could not get past the wall and was harried at sea and on the islands of Shika and Iki for weeks. When the two fleets had joined off Takashima in Imari Bay, a typhoon on the night of 15–16 August 1281 destroyed most of the ships, and the Japanese killed or captured the men left stranded on the island. The storms became the kamikaze, the “divine wind” sent by the gods to protect Japan, while the cost of the defence, which brought no conquered land to reward its warriors, weakened the shogunate.
: De två försöken av Khubilai khan, Yuandynastins mongoliske kejsare, att erövra Japan, med arméer som rekryterats bland mongoler, kineser, jurchener och koreaner och med fartyg och sjömän som uttagits från Goryeo och södra Kina. Sedan Kamakurashogunatet, lett av den unge regenten Hōjō Tokimune, hade struntat i sex ambassader mellan 1266 och 1273 avseglade en flotta på omkring 900 fartyg från Korea i november 1274, intog Tsushima och Iki och landsteg i Hakatabukten den 19 november. Inkräktarna drev Kyushus krigare inåt land och brände Hakata, men drog sig tillbaka till sina fartyg samma natt, och många fartyg förliste i en storm på hemvägen. Shogunatet avrättade Khubilais nästa sändebud och byggde en stenmur runt Hakatabukten. År 1281, efter erövringen av Songdynastins Kina, sände Khubilai två flottor, en armé längs den östra vägen från Korea och en mycket större armé längs den södra vägen från Kina; Yuandynastins krönikor anger 140 000 man, en siffra som moderna historiker anser kraftigt överdriven. Den östra vägens armé kunde inte ta sig förbi muren och ansattes i veckor till sjöss och på öarna Shika och Iki. När de två flottorna hade förenats utanför Takashima i Imaribukten förstörde en tyfon natten mellan den 15 och 16 augusti 1281 de flesta av fartygen, och japanerna dödade eller tillfångatog de män som blivit kvar på ön. Stormarna blev kamikaze, den ”gudomliga vinden” som gudarna sänt för att skydda Japan, medan kostnaderna för försvaret, som inte gav något erövrat land att belöna krigarna med, försvagade shogunatet.
