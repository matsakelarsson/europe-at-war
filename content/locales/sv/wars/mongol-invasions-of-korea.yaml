# Svenska översättningar av katalogtexten (våg 10); stegtexterna kommer senare.
Mongol invasions of Korea: Mongolernas invasioner av Korea
? "A series of Mongol invasions of Goryeo over nearly three decades, which ended with Goryeo becoming a subordinate ally of the Mongol Yuan empire but keeping its own dynasty. After a Mongol envoy was killed on his way home from Goryeo in 1225, Saritai invaded in 1231, defeated the Goryeo army and forced the court to submit. In 1232 the military ruler Choe U moved the court to Ganghwa Island, off the west coast, which the Mongols never attacked, and told the people to take refuge in mountain fortresses and on islands; Saritai was killed by an arrow at Cheoin later that year. Further invasions in 1235–1239, 1247–1248 and 1253–1257 spread devastation across the country while the court held out on Ganghwa. Mountain fortresses such as Kuju and Chungju resisted long sieges, but the countryside was stripped: the chronicles record 206,800 people carried off in 1254 alone, and the nine-storey pagoda of Hwangnyongsa and the first printing blocks of the Buddhist canon were burned. In 1258 the last of the Choe dictators was killed, the north-east went over to the Mongols, and in 1259 the court made peace and sent the crown prince to the Mongol court. The court moved back to the old capital, Kaegyong, in 1270, which set off the Sambyeolcho rebellion."
: "En serie mongoliska invasioner av Goryeo under nästan tre decennier, som slutade med att Goryeo blev en underordnad bundsförvant till det mongoliska Yuanriket men behöll sin egen dynasti. Sedan ett mongoliskt sändebud hade dödats på hemvägen från Goryeo 1225 invaderade Saritai 1231, besegrade Goryeos armé och tvingade hovet att underkasta sig. År 1232 flyttade militärhärskaren Choe U hovet till Ganghwaön utanför västkusten, som mongolerna aldrig angrep, och uppmanade folket att söka skydd i bergsfästningar och på öar; Saritai dödades av en pil vid Cheoin senare samma år. Nya invasioner 1235–1239, 1247–1248 och 1253–1257 spred förödelse över landet medan hovet höll ut på Ganghwa. Bergsfästningar som Kuju och Chungju stod emot långa belägringar, men landsbygden skövlades: krönikorna uppger att 206 800 människor fördes bort enbart 1254, och Hwangnyongsas niovåningspagod och de första tryckblocken till den buddhistiska kanonen brändes. År 1258 dödades den siste av Choediktatorerna, nordöst gick över till mongolerna, och 1259 slöt hovet fred och sände kronprinsen till det mongoliska hovet. Hovet flyttade tillbaka till den gamla huvudstaden Kaegyong 1270, vilket utlöste Sambyeolchoupproret."
