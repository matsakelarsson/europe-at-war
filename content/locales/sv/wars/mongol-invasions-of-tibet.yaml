# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
Mongol invasions of Tibet: Mongolernas invasioner av Tibet
? "The first Mongol campaign into central Tibet and the submission that followed. Tibet then had no central government; power was shared among the great monasteries and the noble families allied with them. In 1240 Köten (Godan), a son of Ögedei who held the former Tangut lands around Liangzhou, sent his general Doorda Darkhan, himself a Tangut, into central Tibet with a force given as 30,000 men, though probably much smaller. It reached the Phanyul valley north of Lhasa, burned the temple of Gyal Lhakhang and killed many monks at Reting; one account gives about 500 dead. The monastery of Drikung was spared. The Mongols withdrew, perhaps after the death of Ögedei in 1241. In 1244 Köten summoned Sakya Pandita, head of the Sakya school, who set out with his nephews Phagpa and Chakna Dorje, reached Liangzhou in 1246 and met Köten early in 1247. He accepted Mongol overlordship and in a letter of 1249 urged the lords of Tibet to submit and pay tribute, with the Sakya as their intermediaries. Further Mongol armies under Möngke in 1251–1255 brought most of Tibet under Mongol control, and from 1264 the Sakya governed it for the Yuan. Historians disagree on the date and purpose of the 1240 campaign, which some see as a reconnaissance or a raid for tribute, and on how far Tibet then became part of the Mongol state. The meaning of the relationship that began in 1247 is also contested: Chinese official histories treat it as the start of Chinese sovereignty over Tibet, while Tibetan and many Western historians describe it as a bond between a religious teacher and a lay patron, or as submission to the Mongol Empire rather than to China."
: "Det första mongoliska fälttåget in i centrala Tibet och den underkastelse som följde. Tibet saknade då en central regering; makten var delad mellan de stora klostren och de adelssläkter som var allierade med dem. År 1240 sände Köten (Godan), en son till Ögedei som innehade de forna tangutiska länderna kring Liangzhou, sin fältherre Doorda Darkhan, själv tangut, in i centrala Tibet med en styrka som uppges ha omfattat 30 000 man, men som troligen var betydligt mindre. Den nådde Phanyuldalen norr om Lhasa, brände templet Gyal Lhakhang och dödade många munkar i Reting; en uppgift talar om omkring 500 döda. Klostret Drikung skonades. Mongolerna drog sig tillbaka, kanske efter Ögedeis död 1241. År 1244 kallade Köten till sig Sakya Pandita, överhuvud för Sakyaskolan, som begav sig av med sina brorsöner Phagpa och Chakna Dorje, nådde Liangzhou 1246 och mötte Köten i början av 1247. Han godtog mongolisk överhöghet och uppmanade i ett brev 1249 Tibets herrar att underkasta sig och betala tribut, med Sakya som mellanhand. Ytterligare mongoliska arméer under Möngke förde 1251–1255 större delen av Tibet under mongolisk kontroll, och från 1264 styrde Sakya landet åt Yuandynastin. Historikerna är oense om datum och syfte för fälttåget 1240, som vissa ser som en rekognoscering eller en räd för att driva in tribut, och om i vilken utsträckning Tibet då blev en del av den mongoliska staten. Innebörden av det förhållande som inleddes 1247 är också omstridd: officiella kinesiska historieverk behandlar det som början på kinesisk suveränitet över Tibet, medan tibetanska och många västerländska historiker beskriver det som ett band mellan en religiös lärare och en lekmannabeskyddare, eller som en underkastelse under Mongolriket snarare än under Kina."
