Armed uprising of 1932 in Mongolia: Det väpnade upproret i Mongoliet 1932
? A rising of herders, lamas and local officials in western and central Mongolia against the “leftist” policies of the Mongolian People’s Revolutionary Party. From 1929 the party, guided by the Comintern, confiscated the herds and property of nobles and monasteries, executed some 700 heads of households, forced herders into collectives and pressed young lamas to leave the monasteries; many herders slaughtered their animals rather than give them up. On 10–11 April 1932 lamas and herders rose at the Khyalganat monastery in Rashaant district of Khövsgöl province, and the revolt spread to Arkhangai, Zavkhan, Övörkhangai and Dörvöd. The insurgents, more than 3,000 of them with old rifles and flintlocks, killed party members and officials and destroyed 35 district centres and 45 cooperatives; some hoped for help from the Ninth Panchen Lama or Japan, though archives show no such support. Government troops under Jambyn Lkhümbe, with machine guns, armoured cars and aircraft supplied by the Soviet Union and Soviet advisers in some battles, defeated them in about fifteen battles by July; a second wave in southern Khövsgöl and northern Arkhangai in August was put down by the autumn. More than 1,500 people were killed, by most estimates; one Soviet document gives 8,000–10,000. In June 1932, on Moscow’s instructions, the party abandoned the leftist course for a “New Turn” policy, suspending collectivisation and easing the pressure on the monasteries, and blamed the leaders it had expelled in May.
: En resning bland herdar, lamor och lokala ämbetsmän i västra och centrala Mongoliet mot Mongoliska folkets revolutionära partis ”vänsterpolitik”. Från 1929 konfiskerade partiet, under Kominterns ledning, adelns och klostrens hjordar och egendom, avrättade omkring 700 hushållsöverhuvuden, tvingade in herdar i kollektiv och pressade unga lamor att lämna klostren; många herdar slaktade sina djur hellre än att lämna ifrån sig dem. Den 10–11 april 1932 reste sig lamor och herdar vid Khyalganatklostret i Rashaantdistriktet i Khövsgölprovinsen, och revolten spred sig till Arkhangai, Zavkhan, Övörkhangai och Dörvöd. Upprorsmännen, mer än 3 000 till antalet och beväpnade med gamla gevär och flintlåsgevär, dödade partimedlemmar och ämbetsmän och förstörde 35 distriktscentrum och 45 kooperativ; en del hoppades på hjälp från den nionde panchen lama eller från Japan, men arkiven visar inget sådant stöd. Regeringstrupper under Jambyn Lkhümbe, med kulsprutor, pansarbilar och flygplan från Sovjetunionen och med sovjetiska rådgivare i en del strider, besegrade dem i omkring femton strider fram till juli; en andra våg i södra Khövsgöl och norra Arkhangai i augusti slogs ned till hösten. Mer än 1 500 människor dödades enligt de flesta uppskattningar; ett sovjetiskt dokument anger 8 000–10 000. I juni 1932 övergav partiet på Moskvas instruktioner vänsterkursen till förmån för politiken ”Den nya vändningen”, avbröt kollektiviseringen och lättade trycket på klostren, och lade skulden på de ledare som det hade uteslutit i maj.
