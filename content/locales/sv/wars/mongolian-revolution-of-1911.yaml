# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
Mongolian Revolution of 1911: Mongoliska revolutionen 1911
? The movement by which Outer Mongolia broke away from the Qing empire during the Xinhai Revolution. Qing plans in the 1900s to settle Chinese farmers in Mongolia, raise an army and govern it directly alarmed the Mongol nobles and the Buddhist clergy, and in 1911 a group of them sent a secret mission to Russia to ask for help. When the revolution broke out in China, they formed a provisional government in Urga (today Ulaanbaatar) on 30 November 1911, disarmed the small garrison of the Qing amban Sandowa and sent him away under Russian escort. On 29 December the Jebtsundamba Khutuktu, the head of the Buddhist church in Mongolia, was enthroned as Bogd Khan of an independent Mongolian state. Qing officials at Uliastai left under Russian protection, the Barga Mongols of Hulunbuir took Hailar in January 1912, and in August 1912 Mongol forces took Khovd, the last Qing post in western Mongolia. Russia backed Mongolian autonomy, not full independence, and by the agreements of 1913 and 1915 Outer Mongolia was recognised as autonomous under Chinese suzerainty.
: Den rörelse genom vilken Yttre Mongoliet bröt sig loss från Qingriket under Xinhairevolutionen. Qingdynastins planer under 1900-talets första årtionde på att bosätta kinesiska bönder i Mongoliet, sätta upp en armé och styra landet direkt väckte oro bland de mongoliska adelsmännen och det buddhistiska prästerskapet, och 1911 sände en grupp av dem en hemlig delegation till Ryssland för att be om hjälp. När revolutionen bröt ut i Kina bildade de en provisorisk regering i Urga (dagens Ulaanbaatar) den 30 november 1911, avväpnade Qingambanen Sandowas lilla garnison och skickade bort honom under rysk eskort. Den 29 december tronsattes Jebtsundamba Khutuktu, överhuvud för den buddhistiska kyrkan i Mongoliet, som Bogd khan över en självständig mongolisk stat. Qingämbetsmännen i Uliastai lämnade staden under ryskt beskydd, bargamongolerna i Hulunbuir intog Hailar i januari 1912, och i augusti 1912 intog mongoliska styrkor Khovd, Qingdynastins sista utpost i västra Mongoliet. Ryssland stödde mongoliskt självstyre, inte full självständighet, och genom avtalen 1913 och 1915 erkändes Yttre Mongoliet som autonomt under kinesisk överhöghet.
