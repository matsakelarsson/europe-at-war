# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
Mongolian Revolution of 1921: Mongoliska revolutionen 1921
? The struggle over Outer Mongolia after the Russian Revolution, which ended with a Soviet-backed revolutionary government in Urga. In 1919 the Beiyang government of the Republic of China sent troops under Xu Shuzheng, who made the Mongolian nobles give up the autonomy Mongolia had won in 1911–1915. In February 1921 the White general Roman von Ungern-Sternberg and his Asiatic Cavalry Division drove the Chinese out of Urga and restored the Bogd Khan, the head of the Mongolian Buddhist church, as monarch, while killing Jews and suspected Bolsheviks. In March the Mongolian People’s Party, under Damdin Sükhbaatar, formed a provisional government on the Soviet border and took the Chinese post at Kyakhta. When Ungern attacked Soviet territory in June, the Red Army and the Mongolian partisans defeated him and entered Urga on 6 July 1921. The Bogd Khan stayed on as a limited monarch under a people’s government, Ungern was captured and shot, and Soviet troops remained until 1925; after the Bogd Khan’s death in 1924 the Mongolian People’s Republic was proclaimed.
: Kampen om Yttre Mongoliet efter ryska revolutionen, som slutade med en sovjetstödd revolutionär regering i Urga. År 1919 sände Republiken Kinas Beiyangregering trupper under Xu Shuzheng, som tvingade de mongoliska adelsmännen att ge upp det självstyre som Mongoliet hade vunnit 1911–1915. I februari 1921 drev den vite generalen Roman von Ungern-Sternberg och hans Asiatiska kavalleridivision ut kineserna ur Urga och återinsatte Bogd khan, överhuvudet för den mongoliska buddhistiska kyrkan, som monark, samtidigt som de dödade judar och misstänkta bolsjeviker. I mars bildade Mongoliska folkpartiet under Damdin Sükhbaatar en provisorisk regering vid den sovjetiska gränsen och intog den kinesiska utposten i Kjachta. När Ungern angrep sovjetiskt territorium i juni besegrade Röda armén och de mongoliska partisanerna honom och tågade in i Urga den 6 juli 1921. Bogd khan satt kvar som monark med begränsad makt under en folkregering, Ungern tillfångatogs och sköts, och sovjetiska trupper stannade kvar till 1925; efter Bogd khans död 1924 utropades Mongoliska folkrepubliken.
