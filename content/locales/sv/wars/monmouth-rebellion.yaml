Monmouth Rebellion: Monmouthupproret
A rising in the West Country by James Scott, Duke of Monmouth, the Protestant illegitimate son of Charles II, against his Catholic uncle, James II. Monmouth landed at Lyme Regis on 11 June 1685 with 82 followers and raised an army of several thousand, mostly farm workers and craftsmen, and was proclaimed king at Taunton. He failed to take Bristol, and on 6 July his night attack on the royal army under the Earl of Feversham and John Churchill at Sedgemoor was beaten off and his army routed. Monmouth was captured and beheaded on Tower Hill on 15 July. At the “Bloody Assizes” led by Judge George Jeffreys, more than 1,400 prisoners were tried; fewer than 300 were hanged and some 800 transported to the West Indies. A linked rising in Scotland by the Earl of Argyll failed in June.: Ett uppror i sydvästra England (West Country) lett av James Scott, hertig av Monmouth, Karl II:s protestantiske utomäktenskaplige son, mot hans katolske farbror Jakob II. Monmouth landsteg i Lyme Regis den 11 juni 1685 med 82 anhängare, samlade en här på flera tusen man, mestadels lantarbetare och hantverkare, och utropades till kung i Taunton. Han misslyckades med att ta Bristol, och den 6 juli slogs hans nattliga anfall mot den kungliga hären under earlen av Feversham och John Churchill vid Sedgemoor tillbaka och hans här slogs på flykt. Monmouth tillfångatogs och halshöggs på Tower Hill den 15 juli. Vid de ”blodiga assiserna” (Bloody Assizes) under domaren George Jeffreys ställdes mer än 1 400 fångar inför rätta; färre än 300 hängdes och omkring 800 deporterades till Västindien. Ett samordnat uppror i Skottland under earlen av Argyll misslyckades i juni.
