Montenegrin–Ottoman War of 1852–1853: Montenegrinsk-osmanska kriget 1852–1853
A war that followed Danilo Petrović-Njegoš’s transformation of Montenegro from a prince-bishopric into a secular principality in 1852 and his secret help to the Herzegovinian rebels of Luka Vukalović. After the Montenegrins seized the fortress of Žabljak near Lake Scutari, the Porte declared war, and in the winter of 1852–1853 Omer Pasha invaded Montenegro from Herzegovina and Albania with a much larger army. The Montenegrins held out, winning near Ostrog, and in February 1853 an Austrian envoy, Count Christian Leiningen, delivered an ultimatum in Constantinople, supported by Russia, that made the Ottomans withdraw. Like the dispute over the Holy Places, the crisis helped bring on the Crimean War.: Ett krig som följde på att Danilo Petrović-Njegoš 1852 omvandlade Montenegro från ett furstbiskopsdöme till ett världsligt furstendöme och i hemlighet hjälpte Luka Vukalovićs upprorsmän i Hercegovina. Sedan montenegrinerna intagit fästningen Žabljak nära Scutarisjön förklarade Höga porten krig, och vintern 1852–1853 invaderade Omer pasha Montenegro från Hercegovina och Albanien med en mycket större här. Montenegrinerna höll stånd och segrade nära Ostrog, och i februari 1853 överlämnade ett österrikiskt sändebud, greve Christian Leiningen, med ryskt stöd ett ultimatum i Konstantinopel som fick osmanerna att dra sig tillbaka. Liksom striden om de heliga platserna bidrog krisen till att framkalla Krimkriget.
