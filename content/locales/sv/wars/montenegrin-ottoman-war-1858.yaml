Ottoman success: Osmanska framgångar
From 1852 Luka Vukalović led the Orthodox clans of eastern Herzegovina in revolt against the Ottoman authorities, encouraged by Prince Danilo of Montenegro, who had turned the old prince-bishopric into a secular principality. When Vukalović rose again in late 1857 and beat off an Ottoman attack with Montenegrin help, the Porte sent an army under Hussein Pasha to settle accounts with Montenegro itself. On 10 May 1858 it took Vilusi and Grahovo, in the disputed borderland above the Bay of Kotor. About 7,500 Montenegrins under the prince’s elder brother, Mirko Petrović-Njegoš, held the plateau of Grahovac above them.: Från 1852 ledde Luka Vukalović de ortodoxa klanerna i östra Hercegovina i uppror mot de osmanska myndigheterna, uppmuntrad av furst Danilo av Montenegro, som hade omvandlat det gamla furstbiskopsdömet till ett världsligt furstendöme. När Vukalović reste sig på nytt i slutet av 1857 och med montenegrinsk hjälp slog tillbaka ett osmanskt anfall, sände Höga porten en här under Hussein pasha för att göra upp räkningen med själva Montenegro. Den 10 maj 1858 intog den Vilusi och Grahovo, i det omstridda gränslandet ovanför Kotorbukten. Omkring 7 500 montenegriner under furstens äldre bror, Mirko Petrović-Njegoš, höll Grahovacplatån ovanför dem.
The Ottomans attacked on 11 May, and most of the casualties, some 3,000 Ottoman and 1,000 Montenegrin by one account, fell that day. Mirko refused a truce but let the Ottomans bury their dead. On 13 May, as Ottoman reinforcements arrived from Bosnia, the Montenegrins charged the Ottoman guns and routed the army, capturing a great quantity of arms. The victory, celebrated in South Slav songs, brought the great powers in. A commission marked out the border, giving Montenegro Grahovo, Rudine, the Župa of Nikšić, much of Drobnjaci, Upper Vasojevići and other districts, a de facto recognition of its independence.: Osmanerna anföll den 11 maj, och de flesta av förlusterna, enligt en uppgift omkring 3 000 osmanska och 1 000 montenegrinska, inträffade den dagen. Mirko vägrade gå med på vapenvila men lät osmanerna begrava sina döda. Den 13 maj, när osmanska förstärkningar anlände från Bosnien, stormade montenegrinerna de osmanska kanonerna och slog hären på flykten och erövrade en stor mängd vapen. Segern, som besjöngs i sydslaviska sånger, fick stormakterna att ingripa. En kommission stakade ut gränsen och gav Montenegro Grahovo, Rudine, Župa Nikšićka, stora delar av Drobnjaci, Övre Vasojevići och andra distrikt, ett de facto-erkännande av landets självständighet.
