Montenegrin–Ottoman War of 1858: Montenegrinsk-osmanska kriget 1858
A short war in which an Ottoman army sent to crush Montenegrin support for the Herzegovinian rebels of Luka Vukalović was routed at Grahovac in May 1858 by Montenegrins under Grand Duke Mirko Petrović-Njegoš. The victory led the great powers to fix Montenegro’s border with the Ottoman Empire in 1858–1859, enlarging the principality and amounting to de facto recognition of its independence.: Ett kort krig där en osmansk här, som sänts för att krossa det montenegrinska stödet till Luka Vukalovićs upprorsmän i Hercegovina, slogs på flykt vid Grahovac i maj 1858 av montenegriner under storvojvoden Mirko Petrović-Njegoš. Segern fick stormakterna att 1858–1859 fastställa Montenegros gräns mot Osmanska riket, vilket utvidgade furstendömet och innebar ett de facto-erkännande av dess självständighet.
