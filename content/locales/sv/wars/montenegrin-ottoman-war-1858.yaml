Dates are New Style (Gregorian). Montenegro used the Julian calendar, then 12 days behind, and Montenegrin sources date the decisive day of the battle 1 May 1858. Casualty figures come from Montenegrin accounts.: Datumen anges enligt nya stilen (gregorianska kalendern). Montenegro använde den julianska kalendern, då 12 dagar efter, och montenegrinska källor daterar slagets avgörande dag till den 1 maj 1858. Förlustsiffrorna kommer från montenegrinska skildringar.
