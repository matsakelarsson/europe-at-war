Hussein Pasha’s army took the village and nearby Vilusi before advancing on the Montenegrin position.: Hussein pashas här intog byn och närbelägna Vilusi innan den ryckte fram mot den montenegrinska ställningen.
11–13 May 1858: 11–13 maj 1858
On the third day the Montenegrins stormed the Ottoman batteries after two of their commanders, Đuro Kusovac and the priest Luka Jovović, fell leading the charge.: Den tredje dagen stormade montenegrinerna de osmanska batterierna sedan två av deras befälhavare, Đuro Kusovac och prästen Luka Jovović, stupat i spetsen för anfallet.
