Montenegrin–Ottoman War of 1861–1862: Montenegrinsk-osmanska kriget 1861–1862
A war between Montenegro under Prince Nicholas and the Ottoman Empire, which grew out of Luka Vukalović’s renewed rising in Herzegovina, backed by Montenegro. Omer Pasha’s forces were at first held, but under pressure from the great powers Montenegro stopped fighting in Herzegovina, and in 1862 Ottoman armies invaded from Herzegovina and Albania, took the Ostrog monastery from the defenders under Mirko Petrović-Njegoš and pushed into the heart of the country. The Convention of Scutari of 31 August 1862 made Montenegro acknowledge Ottoman suzerainty, but on mild terms, restoring the borders of 1859 and letting Montenegrins import goods other than arms through Ottoman territory.: "Ett krig mellan Montenegro under furst Nikola och Osmanska riket, som växte fram ur Luka Vukalovićs förnyade uppror i Hercegovina med montenegrinskt stöd. Omer pashas styrkor hölls till en början tillbaka, men under tryck från stormakterna upphörde Montenegro med striderna i Hercegovina, och 1862 invaderade osmanska arméer från Hercegovina och Albanien, tog klostret Ostrog från försvararna under Mirko Petrović-Njegoš och trängde in i landets hjärta. Konventionen i Scutari den 31 augusti 1862 tvingade Montenegro att erkänna osmansk överhöghet, men på milda villkor: 1859 års gränser återställdes och montenegrinerna fick föra in andra varor än vapen genom osmanskt territorium."
