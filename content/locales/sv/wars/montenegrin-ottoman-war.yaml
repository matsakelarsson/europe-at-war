Dates are New Style (Gregorian). Montenegro used the Julian calendar, then 12 days behind, so Montenegrin accounts date the fall of Nikšić 27 August 1877. Several battle dates appear in either style in the literature, and some are given here only by month.: Datumen anges enligt nya stilen (gregorianska kalendern). Montenegro använde den julianska kalendern, då 12 dagar efter, så montenegrinska skildringar daterar Nikšićs fall till den 27 augusti 1877. Flera slagdatum förekommer i litteraturen enligt endera stilen, och några anges här bara med månad.
The Herzegovina Uprising, the Serbian–Ottoman Wars and the Russo-Turkish War of 1877–1878 have their own entries.: Hercegovinaupproret, de serbisk-osmanska krigen och rysk-turkiska kriget 1877–1878 har egna poster.
