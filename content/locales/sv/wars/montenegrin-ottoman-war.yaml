Montenegro had armed the Herzegovinian rebels since 1875, and at the end of June 1876 it declared war together with Serbia. Prince Nicholas’s army of mountain clans, joined by Herzegovinian insurgents, won its greatest victory in late July at Vučji Do near Nikšić, where an Ottoman army under Ahmed Muhtar Pasha was routed; Selim Pasha was killed and Osman Pasha taken prisoner. On 2 August Marko Miljanov and Ilija Plamenac threw back a larger force from Scutari at Fundina in the Kuči lands. When Serbia was beaten, Montenegro too accepted the armistice of November 1876, but no peace followed.: Montenegro hade beväpnat upprorsmännen i Hercegovina sedan 1875, och i slutet av juni 1876 förklarade landet krig tillsammans med Serbien. Furst Nikolas armé av bergsklaner, förstärkt av upprorsmän från Hercegovina, vann sin största seger i slutet av juli vid Vučji Do nära Nikšić, där en osmansk armé under Ahmed Muhtar pasha slogs på flykten; Selim pasha dödades och Osman pasha togs till fånga. Den 2 augusti slog Marko Miljanov och Ilija Plamenac tillbaka en större styrka från Scutari vid Fundina i Kučis land. När Serbien besegrats godtog också Montenegro vapenstilleståndet i november 1876, men någon fred följde inte.
In June 1877, as Russia went to war, an Ottoman army under Suleiman Pasha fought its way through the Duga pass to relieve Nikšić and then across Montenegro down the Zeta valley, before being shipped to Bulgaria to face the Russians. Nicholas then besieged Nikšić, which surrendered on 8 September after 47 days, and in January 1878 his troops took Bar and Ulcinj on the coast and the forts on Lake Scutari. Many Albanian and Slav Muslim inhabitants left or were driven from Podgorica, Spuž and other places. At Berlin Montenegro won independence, Nikšić, Podgorica, Kolašin and Bar; Ulcinj followed in 1880.: I juni 1877, när Ryssland gick i krig, kämpade sig en osmansk armé under Suleiman pasha genom Dugapasset för att undsätta Nikšić och sedan tvärs genom Montenegro nedför Zetadalen, innan den skeppades till Bulgarien för att möta ryssarna. Nikola belägrade därefter Nikšić, som kapitulerade den 8 september efter 47 dagar, och i januari 1878 intog hans trupper Bar och Ulcinj vid kusten och forten vid Scutarisjön. Många albanska och slaviska muslimska invånare lämnade eller fördrevs från Podgorica, Spuž och andra orter. I Berlin vann Montenegro självständighet, Nikšić, Podgorica, Kolašin och Bar; Ulcinj följde 1880.
