Montenegrin–Ottoman War of 1876–1878: Montenegrinsk-osmanska kriget 1876–1878
A war in which the Principality of Montenegro, allied with Serbia and the Herzegovinian rebels and later fighting alongside Russia, beat Ottoman armies at Vučji Do and Fundina in 1876, took Nikšić in 1877 and Bar and Ulcinj on the coast in 1878. Known in Montenegro as the Great War, it ended with Montenegro’s independence recognised at the Congress of Berlin and its territory roughly doubled, with an outlet to the Adriatic.: Ett krig där furstendömet Montenegro, allierat med Serbien och upprorsmännen i Hercegovina och senare i strid vid Rysslands sida, besegrade osmanska arméer vid Vučji Do och Fundina 1876, tog Nikšić 1877 och Bar och Ulcinj vid kusten 1878. Kriget, som i Montenegro kallas ”det stora kriget”, slutade med att Montenegros självständighet erkändes vid Berlinkongressen och att dess territorium ungefär fördubblades, med tillgång till Adriatiska havet.
