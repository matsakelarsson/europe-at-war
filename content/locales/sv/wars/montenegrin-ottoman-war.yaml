2 August 1876: 2 augusti 1876
Warned of the Ottoman plan, about 4,000 Montenegrins under Marko Miljanov and Ilija Plamenac beat back Mahmud Pasha’s attack from Scutari.: Förvarnade om den osmanska planen slog omkring 4 000 montenegriner under Marko Miljanov och Ilija Plamenac tillbaka Mahmud pashas anfall från Scutari.
Zeta valley: Zetadalen
June 1877: juni 1877
Suleiman Pasha’s army forced its way down the valley past Ostrog in costly fighting to join the Ottoman forces at Podgorica.: Suleiman pashas armé tvingade sig nedför dalen förbi Ostrog i kostsamma strider för att förena sig med de osmanska styrkorna i Podgorica.
