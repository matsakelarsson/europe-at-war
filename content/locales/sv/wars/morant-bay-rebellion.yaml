# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
Morant Bay rebellion: Morant Bay-upproret
? "The rising of 11 October 1865 in the parish of Saint Thomas-in-the-East, Jamaica, and its suppression. Thirty years after the end of slavery, most Black Jamaicans were small farmers and labourers with little land, low wages and no vote: in 1864 fewer than 2,000 Black men could vote, out of a population of more than 436,000. Floods, drought and epidemics had deepened their poverty, and the governor, Edward John Eyre, answered their petitions with a message from the Queen telling them to work harder. Paul Bogle, a Black Baptist deacon of Stony Gut, and his followers, allies of the mixed-race assemblyman George William Gordon, marched on the courthouse at Morant Bay on 11 October after warrants were issued for their arrest. The volunteer militia fired on them, and in the fighting that followed the crowd burned the courthouse and killed 18 officials and militiamen, among them the custos, Baron von Ketelhodt, while seven of the marchers died. For two days the rebels held much of the parish. Eyre declared martial law, and soldiers, sailors and Maroons from Moore Town put down the rising with extreme violence: 439 people were killed, 354 of them after courts martial, more than 600 were flogged and about 1,000 homes were burned. Gordon, arrested in Kingston where martial law did not apply, was tried by court martial at Morant Bay and hanged on 23 October, and Bogle the next day. A royal commission found the punishments excessive, Eyre was recalled amid a fierce debate in Britain, and in 1866 the Jamaican Assembly gave up its powers and the island became a Crown colony ruled from London. Jamaica made Bogle and Gordon National Heroes in 1969."
: "Resningen den 11 oktober 1865 i socknen Saint Thomas-in-the-East på Jamaica och dess undertryckande. Trettio år efter slaveriets slut var de flesta svarta jamaicaner småbrukare och arbetare med lite jord, låga löner och ingen rösträtt: 1864 kunde färre än 2 000 svarta män rösta, av en befolkning på mer än 436 000. Översvämningar, torka och epidemier hade fördjupat deras fattigdom, och guvernören Edward John Eyre besvarade deras petitioner med ett budskap från drottningen som uppmanade dem att arbeta hårdare. Paul Bogle, en svart baptistdiakon från Stony Gut, och hans anhängare, allierade med ledamoten av lagstiftande församlingen George William Gordon, som var av blandat ursprung, marscherade mot domstolsbyggnaden i Morant Bay den 11 oktober sedan order om deras arrestering hade utfärdats. Den frivilliga milisen öppnade eld mot dem, och i striderna som följde brände folkmassan domstolsbyggnaden och dödade 18 ämbetsmän och milismän, bland dem custos, baron von Ketelhodt, medan sju av demonstranterna dog. I två dagar behärskade rebellerna stora delar av socknen. Eyre utlyste krigslagar, och soldater, sjömän och maroner från Moore Town slog ned resningen med extremt våld: 439 människor dödades, 354 av dem efter krigsrätt, mer än 600 pryglades och omkring 1 000 hem brändes. Gordon, som greps i Kingston där krigslagarna inte gällde, ställdes inför krigsrätt i Morant Bay och hängdes den 23 oktober, och Bogle dagen därpå. En kunglig kommission fann straffen överdrivna, Eyre kallades hem under en häftig debatt i Storbritannien, och 1866 avsade sig Jamaicas lagstiftande församling sina befogenheter och ön blev en kronkoloni styrd från London. Jamaica utsåg Bogle och Gordon till nationalhjältar 1969."
