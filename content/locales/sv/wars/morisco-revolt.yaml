Dates are Julian, as usual for the period. It is also called the War of the Alpujarras or the second rebellion of the Alpujarras, after the rising of 1499–1501.: Datumen anges enligt den julianska kalendern, som var brukligt för perioden. Upproret kallas också Alpujarraskriget eller det andra Alpujarrasupproret, efter resningen 1499–1501.
The three main chronicles, by Luis del Mármol Carvajal, Ginés Pérez de Hita and Diego Hurtado de Mendoza, were all written from the Christian side; there is no contemporary account by the Moriscos. Numbers of rebels and dead are uncertain.: De tre främsta krönikorna, av Luis del Mármol Carvajal, Ginés Pérez de Hita och Diego Hurtado de Mendoza, skrevs alla från kristen sida; det finns ingen samtida skildring av moriskerna själva. Antalet upprorsmän och döda är osäkert.
The Moriscos of all Spain were expelled in 1609–1614.: Moriskerna i hela Spanien fördrevs 1609–1614.
