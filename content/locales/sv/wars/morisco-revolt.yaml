Granada’s Muslims had been made to convert after the revolt of 1499–1501, but most of the Moriscos, as the converts were called, still spoke Arabic and kept their own dress and customs. Philip II’s Pragmatic Sanction of 1 January 1567 banned all of these, and appeals to suspend it failed. On Christmas Eve 1568 the mountain villages of the Alpujarras rose in arms and proclaimed a young nobleman, Fernando de Válor, king under the name Aben Humeya. An attempt to raise the Albaicín, Granada’s Morisco quarter, the same night failed.: Granadas muslimer hade tvingats konvertera efter revolten 1499–1501, men de flesta morisker, som konvertiterna kallades, talade fortfarande arabiska och behöll sin egen klädedräkt och sina seder. Filip II:s pragmatiska sanktion den 1 januari 1567 förbjöd allt detta, och vädjanden om att skjuta upp den misslyckades. På julafton 1568 grep bergsbyarna i Alpujarras till vapen och utropade en ung adelsman, Fernando de Válor, till kung under namnet Aben Humeya. Ett försök att få Albaicín, Granadas moriskkvarter, att resa sig samma natt misslyckades.
The rebels killed priests and many other Old Christians in the villages, often with great cruelty. In January 1569 the Marquis of Mondéjar marched in from Granada through the snow and broke the rising in the western Alpujarras, while the Marquis of Los Vélez attacked from Almería. Their troops, mostly unpaid volunteers, plundered, killed and enslaved, and in March a crowd murdered more than a hundred Morisco prisoners in Granada’s jail. The revolt flared up again and spread east to the Almanzora valley and west towards Málaga. In October Aben Humeya was murdered by rivals, and his cousin Aben Aboo took his place.: Upprorsmännen dödade präster och många andra gammalkristna i byarna, ofta med stor grymhet. I januari 1569 marscherade markisen av Mondéjar in från Granada genom snön och bröt upproret i västra Alpujarras, medan markisen av Los Vélez anföll från Almería. Deras trupper, mestadels obetalda frivilliga, plundrade, dödade och förslavade, och i mars mördade en folkmassa mer än hundra moriskiska fångar i Granadas fängelse. Revolten blossade upp igen och spred sig österut till Almanzoradalen och västerut mot Málaga. I oktober mördades Aben Humeya av rivaler, och hans kusin Aben Aboo tog hans plats.
