Rebellion of the Alpujarras: Alpujarrasupproret
The revolt of the Moriscos of the Kingdom of Granada, descendants of Muslims forced to convert to Christianity, against Philip II’s ban on their language, dress and customs. Beginning in the Alpujarras, the mountain valleys south of the Sierra Nevada, it was fought with great cruelty on both sides and put down by Don John of Austria; afterwards about 80,000 of Granada’s Moriscos were deported to other parts of Castile.: Revolten bland moriskerna i Kungariket Granada, ättlingar till muslimer som tvingats konvertera till kristendomen, mot Filip II:s förbud mot deras språk, klädedräkt och seder. Revolten började i Alpujarras, bergsdalarna söder om Sierra Nevada, utkämpades med stor grymhet på båda sidor och slogs ned av Don Juan av Österrike. Därefter deporterades omkring 80 000 av Granadas morisker till andra delar av Kastilien.
