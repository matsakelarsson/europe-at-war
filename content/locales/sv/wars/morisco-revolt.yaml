Philip II replaced Mondéjar with his half-brother, Don John of Austria, aged twenty-two, and in October 1569 declared a war “of fire and blood”, letting soldiers keep the plunder and captives they took. A few thousand volunteers and some arms came from Algiers and Morocco, but the Ottomans sent their fleets against Tunis and Cyprus instead. In January 1570 Don John took the field with about 12,000 men and besieged Galera, a hill town near Huéscar. When it fell on 10 February most of its people were killed or enslaved, and the town was razed and its ground sown with salt.: Filip II ersatte Mondéjar med sin tjugotvåårige halvbror Don Juan av Österrike och förklarade i oktober 1569 ett krig ”med eld och blod”, där soldaterna fick behålla det byte och de fångar de tog. Några tusen frivilliga och en del vapen kom från Alger och Marocko, men osmanerna sände i stället sina flottor mot Tunis och Cypern. I januari 1570 gick Don Juan i fält med omkring 12 000 man och belägrade Galera, en bergsstad nära Huéscar. När den föll den 10 februari dödades eller förslavades de flesta av invånarna, och staden jämnades med marken och dess jord beströddes med salt.
Serón fell in March, and in the spring Don John and the Duke of Sessa swept through the Alpujarras from both ends, burning crops and villages. Thousands of Moriscos surrendered; others fled to North Africa or hid in caves, where many were suffocated by fires lit at the entrances. From November 1570 the crown deported the Moriscos of Granada, rebels or not, to towns across Castile. About 80,000 were marched away in winter, and many died on the road. Aben Aboo was killed by his own men in a cave near Bérchules in March 1571, and settlers from the north were brought in to farm the emptied villages.: Serón föll i mars, och under våren svepte Don Juan och hertigen av Sessa genom Alpujarras från båda håll och brände grödor och byar. Tusentals morisker kapitulerade; andra flydde till Nordafrika eller gömde sig i grottor, där många kvävdes av eldar som tändes vid ingångarna. Från november 1570 deporterade kronan Granadas morisker, upprorsmän eller inte, till städer över hela Kastilien. Omkring 80 000 fördes bort mitt i vintern, och många dog längs vägen. Aben Aboo dödades av sina egna män i en grotta nära Bérchules i mars 1571, och nybyggare från norr fördes dit för att bruka jorden i de tömda byarna.
