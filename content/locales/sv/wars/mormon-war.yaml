# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
Mormon War: Mormonkriget
? A conflict in northern Missouri in 1838 between members of the Church of Jesus Christ of Latter Day Saints led by Joseph Smith and their non-Mormon neighbours, the state militia and the state government. Driven out of Jackson County in 1833, the Latter Day Saints had been given Caldwell County as a refuge in 1836, but as thousands more arrived from Ohio in 1838 they settled in neighbouring Daviess and Carroll counties, where the older inhabitants feared their numbers, their votes and their opposition to slavery. A brawl at the polls in Gallatin on 6 August began months of violence. Vigilantes besieged the Mormon town of DeWitt until it was abandoned on 11 October; armed Mormons, among them the secret society of the Danites, then raided Gallatin and Millport, burning homes and stores and driving out non-Mormon families. On 25 October a Mormon force attacked a militia company at Crooked River, where Apostle David W. Patten and two others were killed. Governor Lilburn Boggs then issued Executive Order 44, declaring that the Mormons “must be treated as enemies, and must be exterminated or driven from the State if necessary for the public peace”. On 30 October some 240 militiamen and vigilantes attacked the settlement at Haun’s Mill and killed 17 Latter Day Saints, among them two boys aged ten and nine, in what is known as the Haun’s Mill massacre. Surrounded at Far West by some 2,500 militia, the Mormon leaders surrendered on 1 November; a court martial sentenced Joseph Smith to death, but General Alexander Doniphan refused to carry out the order, and Smith was held in Liberty Jail until April 1839, when he and the other prisoners escaped while being moved to another county. About 22 people were killed in all. Some 10,000 Latter Day Saints were expelled from Missouri in the winter of 1838–1839 and founded Nauvoo in Illinois. Executive Order 44 was formally rescinded by Governor Kit Bond in 1976.
: En konflikt i norra Missouri 1838 mellan medlemmar av Jesu Kristi Kyrka av Sista Dagars Heliga under ledning av Joseph Smith och deras icke-mormonska grannar, delstatsmilisen och delstatsregeringen. Sedan de sista dagars heliga hade fördrivits från Jackson County 1833 hade de 1836 fått Caldwell County som tillflyktsort, men när ytterligare tusentals kom från Ohio 1838 bosatte de sig i grannlänen Daviess och Carroll, där den äldre befolkningen fruktade deras antal, deras röster och deras motstånd mot slaveriet. Ett slagsmål vid vallokalen i Gallatin den 6 augusti inledde flera månader av våld. Vigilanter belägrade mormonstaden DeWitt tills den övergavs den 11 oktober; beväpnade mormoner, bland dem det hemliga sällskapet daniterna, gjorde sedan räder mot Gallatin och Millport, brände hem och butiker och drev bort icke-mormonska familjer. Den 25 oktober anföll en mormonstyrka ett miliskompani vid Crooked River, där aposteln David W. Patten och två andra dödades. Guvernör Lilburn Boggs utfärdade då Executive Order 44, som förklarade att mormonerna ”måste behandlas som fiender och måste utrotas eller drivas ut ur delstaten om det är nödvändigt för den allmänna friden”. Den 30 oktober anföll omkring 240 milismän och vigilanter bosättningen vid Haun’s Mill och dödade 17 sista dagars heliga, bland dem två pojkar på tio och nio år, i det som kallas massakern vid Haun’s Mill. Omringade vid Far West av omkring 2 500 milismän gav mormonledarna upp den 1 november; en krigsrätt dömde Joseph Smith till döden, men general Alexander Doniphan vägrade verkställa ordern, och Smith hölls fången i Liberty Jail till april 1839, då han och de andra fångarna rymde medan de flyttades till ett annat län. Omkring 22 människor dödades sammanlagt. Omkring 10 000 sista dagars heliga fördrevs från Missouri vintern 1838–1839 och grundade Nauvoo i Illinois. Executive Order 44 upphävdes formellt av guvernör Kit Bond 1976.
