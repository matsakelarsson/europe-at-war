# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
Moro conflict: Morokonflikten
? "The armed struggle of the Muslim peoples of the southern Philippines, the Moros, for independence and later autonomy, and the wars of the groups that came out of it. Decades of settlement by Christians from the north had made Muslims a minority in much of Mindanao, and land disputes, poverty and the massacre of Muslim army trainees on Corregidor in 1968 led to the founding of the Moro National Liberation Front (MNLF) under Nur Misuari. Its war against Ferdinand Marcos’s martial-law regime (1972–1976) was the bloodiest phase. The Tripoli Agreement of 1976 promised autonomy, but fighting resumed; the Moro Islamic Liberation Front (MILF) split away in 1977, and an autonomous region was created in 1989–1990. The MNLF signed a final peace agreement in 1996; the MILF fought on, with full-scale offensives against it in 2000, 2003 and 2008, until the Comprehensive Agreement on the Bangsamoro of 2014. Small groups rejected every settlement: Abu Sayyaf, known for kidnappings and bombings, and fighters allied to the Islamic State, who seized Marawi in 2017. In 2019 the Bangsamoro Autonomous Region replaced the old autonomous region, led by the MILF, which began to disarm. Estimates of the dead since the early 1970s range from about 100,000 to 150,000, with 120,000 the figure most often given, and more than two million people have been displaced at one time or another. Last updated 27 November 2026: the Bangsamoro region elected its first parliament in September 2026, but the disarmament of the last MILF fighters has stalled and small armed groups linked to the Islamic State are still fought by the army."
: "Den väpnade kamp som södra Filippinernas muslimska folk, morerna, har fört för självständighet och senare självstyre, och de krig som har förts av de grupper som vuxit fram ur den. Årtionden av inflyttning av kristna nybyggare från norr hade gjort muslimerna till en minoritet i stora delar av Mindanao, och jordtvister, fattigdom och massakern på muslimska armérekryter på Corregidor 1968 ledde till att Moros nationella befrielsefront (MNLF) grundades under Nur Misuari. Dess krig mot Ferdinand Marcos krigslagsregim (1972–1976) var den blodigaste fasen. Tripoliavtalet 1976 utlovade självstyre, men striderna återupptogs; Moros islamiska befrielsefront (MILF) bröt sig ur 1977, och en autonom region inrättades 1989–1990. MNLF undertecknade ett slutligt fredsavtal 1996; MILF fortsatte striden, och fullskaliga offensiver riktades mot den 2000, 2003 och 2008, fram till det omfattande avtalet om Bangsamoro 2014. Små grupper avvisade varje uppgörelse: Abu Sayyaf, känd för kidnappningar och bombdåd, och kämpar allierade med Islamiska staten, som intog Marawi 2017. 2019 ersattes den gamla autonoma regionen av den autonoma regionen Bangsamoro, ledd av MILF, som inledde sin avväpning. Uppskattningarna av antalet döda sedan början av 1970-talet sträcker sig från omkring 100 000 till 150 000, med 120 000 som den oftast angivna siffran, och mer än två miljoner människor har vid något tillfälle drivits på flykt. Senast uppdaterad 27 november 2026: Bangsamororegionen valde sitt första parlament i september 2026, men avväpningen av MILF:s sista kämpar har avstannat, och små väpnade grupper med kopplingar till Islamiska staten bekämpas fortfarande av armén."
