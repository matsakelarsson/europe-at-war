# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
Moro Rebellion: Moroupproret
? The war between the United States and the Muslim peoples of Mindanao and the Sulu archipelago, whom Spain had never fully conquered. American troops replaced the Spanish garrisons at Jolo and Zamboanga in 1899, and to keep the south quiet while it fought the Philippine Republic in Luzon the American army signed the Bates agreement with the Sultan of Sulu, whose English text spoke of American sovereignty and whose Tausug text of protection. From 1902 American columns fought the Maranao around Lake Lanao, and from 1903 the Moro Province, under military governors Leonard Wood, Tasker Bliss and John J. Pershing, imposed a head tax, outlawed slavery, abrogated the Bates agreement (1904) and fought datus who resisted, among them Datu Ali in the Cotabato valley. In March 1906 American troops killed nearly all of the 800 to 1,000 Tausug men, women and children who had taken refuge in the crater of Bud Dajo on Jolo. Pershing’s disarmament order of 1911 led to the last great battle, at Bud Bagsak in June 1913, after which the province was handed to a civilian government; in 1915 the sultan gave up his temporal power. American losses were about 130 killed and some 500 dead of disease, while the Philippine Scouts lost more than 110 killed and the Philippine Constabulary several hundred; Moro losses were never counted, but ran to thousands.
: Kriget mellan USA och de muslimska folken på Mindanao och i Suluarkipelagen, som Spanien aldrig helt hade erövrat. Amerikanska trupper ersatte de spanska garnisonerna i Jolo och Zamboanga 1899, och för att hålla södern lugn medan den stred mot Filippinska republiken på Luzon slöt den amerikanska armén Batesavtalet med sultanen av Sulu; avtalets engelska text talade om amerikansk suveränitet, dess tausugtext om beskydd. Från 1902 stred amerikanska kolonner mot maranaofolket runt Lanaosjön, och från 1903 införde Moroprovinsen, under militärguvernörerna Leonard Wood, Tasker Bliss och John J. Pershing, en huvudskatt, förbjöd slaveriet, upphävde Batesavtalet (1904) och bekämpade de datuer som gjorde motstånd, bland dem Datu Ali i Cotabatodalen. I mars 1906 dödade amerikanska trupper nästan alla de 800 till 1 000 tausugmän, tausugkvinnor och tausugbarn som hade sökt skydd i kratern på Bud Dajo på Jolo. Pershings avväpningsorder 1911 ledde till det sista stora slaget, vid Bud Bagsak i juni 1913, varefter provinsen överlämnades till en civil förvaltning; 1915 avsade sig sultanen sin världsliga makt. De amerikanska förlusterna var omkring 130 stupade och omkring 500 döda i sjukdomar, medan Philippine Scouts förlorade mer än 110 stupade och Philippine Constabulary flera hundra; morernas förluster räknades aldrig, men de uppgick till tusentals.
