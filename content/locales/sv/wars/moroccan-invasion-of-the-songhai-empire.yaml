# Svenska översättningar av katalogtexten (våg 12); stegtexterna kommer senare.
Moroccan invasion of the Songhai Empire: Marockos invasion av Songhairiket
? The conquest of the Niger bend by an army sent across the Sahara by the Saadian sultan Ahmad al-Mansur of Morocco, which destroyed the Songhai Empire and founded the Pashalik of Timbuktu. Al-Mansur wanted the gold and the salt trade of the Sudan and recognition as caliph; a quarrel over the Taghaza salt mines gave him his pretext. In October 1590 Judar Pasha left Marrakesh with some 3,000–4,000 soldiers, most of them musketeers, many of them Spanish-born renegades and Andalusi exiles, and after a march of about five months across the desert defeated the far larger army of Askia Ishaq II at Tondibi, near Gao, on 13 March 1591. Gao and Timbuktu were occupied; al-Mansur rejected the askiya’s offer of tribute and sent Mahmud ibn Zarqun, who beat Ishaq again in October 1591, seized his successor Muhammad Gao by treachery and fought the new askiya, Nuh, in Dendi for two years. Timbuktu rose against its garrison, and in 1593 its leading scholars, among them Ahmad Baba, were arrested and deported to Marrakesh. Mahmud was killed in the hills of al-Hajar in 1595; his successor routed Nuh, and in 1599 a Malian attempt on Djenné failed. The Moroccans held the river from Djenné to Gao and Kukiya, but never ruled the countryside; the Songhai kept an independent kingdom in Dendi, and the descendants of the soldiers, the Arma, ruled Timbuktu under their own pashas until the nineteenth century.
: Erövringen av Nigerkröken genom en armé som den saadiske sultanen Ahmad al-Mansur av Marocko sände över Sahara, och som förstörde Songhairiket och grundade pashaliket Timbuktu. Al-Mansur ville åt guldet och salthandeln i Sudan och ville bli erkänd som kalif; en tvist om saltgruvorna i Taghaza gav honom förevändningen. I oktober 1590 lämnade Judar pasha Marrakech med omkring 3 000–4 000 soldater, de flesta musketerare, många av dem spanskfödda renegater och andalusiska landsflyktingar, och efter en marsch på omkring fem månader genom öknen besegrade han Askia Ishaq II:s långt större armé vid Tondibi nära Gao den 13 mars 1591. Gao och Timbuktu ockuperades; al-Mansur avvisade askians erbjudande om tribut och sände Mahmud ibn Zarqun, som slog Ishaq på nytt i oktober 1591, grep hans efterträdare Muhammad Gao genom förräderi och bekämpade den nye askian, Nuh, i Dendi i två år. Timbuktu reste sig mot sin garnison, och 1593 greps stadens främsta lärda, bland dem Ahmad Baba, och deporterades till Marrakech. Mahmud dödades i bergen al-Hajar 1595; hans efterträdare slog Nuh på flykten, och 1599 misslyckades ett maliskt försök att ta Djenné. Marockanerna höll floden från Djenné till Gao och Kukiya men styrde aldrig landsbygden; songhai behöll ett självständigt kungarike i Dendi, och soldaternas ättlingar, arma, styrde Timbuktu under egna pashor fram till 1800-talet.
