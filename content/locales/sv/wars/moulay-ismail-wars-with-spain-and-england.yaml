# Svenska översättningar av katalogtexten (våg 12); stegtexterna kommer senare.
Moulay Ismail’s wars with Spain and England: Moulay Ismails krig mot Spanien och England
The campaigns in which Sultan Moulay Ismail (r. 1672–1727) won back most of the Atlantic and Mediterranean ports that Portugal, Spain and England held in Morocco. His commanders, leading the Rifian volunteers of the Jaysh al-Rifi and the sultan’s troops, besieged English Tangier in 1680, took Spanish La Mamora (Mehdya) in 1681 and saw the English give up Tangier, after blowing up its mole and walls, in February 1684. Larache fell to them in November 1689, with some 1,600 Spanish prisoners, and Asilah in 1691. In October 1694 they laid siege to Ceuta, a siege that went on, with a Spanish relief in 1720, until after Ismail’s death in 1727; Melilla also held out. The captives of these wars were put to work on Ismail’s buildings at Meknes or ransomed through envoys and the redemptionist religious orders.: De fälttåg genom vilka sultan Moulay Ismail (regerade 1672–1727) återvann de flesta av de hamnar vid Atlanten och Medelhavet som Portugal, Spanien och England innehade i Marocko. Hans befälhavare, i spetsen för rifiska frivilliga i Jaysh al-Rifi och sultanens trupper, belägrade det engelska Tanger 1680, intog det spanska La Mamora (Mehdya) 1681 och såg engelsmännen ge upp Tanger i februari 1684, sedan de hade sprängt dess vågbrytare och murar. Larache föll i deras händer i november 1689, med omkring 1 600 spanska fångar, och Asilah 1691. I oktober 1694 inledde de belägringen av Ceuta, en belägring som, med en spansk undsättning 1720, pågick till efter Ismails död 1727; även Melilla höll stånd. Krigsfångarna sattes i arbete på Ismails byggen i Meknes eller friköptes genom sändebud och de religiösa ordnar som ägnade sig åt friköpning av fångar.
