# Svenska översättningar av katalogtexten (våg 13); stegtexterna kommer senare.
Mozambican Civil War: Inbördeskriget i Moçambique
? The war between Mozambique’s FRELIMO government and the Mozambican National Resistance (RENAMO), which began two years after independence and lasted until 1992. RENAMO was created by Rhodesia’s Central Intelligence Organisation in 1976–1977 to strike back at Mozambique for supporting the Zimbabwean guerrillas, with André Matsangaissa and then Afonso Dhlakama as its leaders. After Zimbabwe’s independence in 1980 South Africa’s military intelligence took it over, and it spread through the centre and south of the country, attacking roads, railways, schools, clinics and villages. The Nkomati Accord of 1984, in which South Africa promised to stop helping RENAMO, did not end that help. Zimbabwe sent troops to guard the Beira corridor and helped take RENAMO’s headquarters at Casa Banana in 1985; Tanzania and Malawi also sent troops. President Samora Machel died in a plane crash at Mbuzini in 1986. RENAMO’s massacres, as at Homoine in 1987, and the government’s forced removals, together with drought, brought famine. After the Cold War ended FRELIMO gave up Marxism–Leninism and adopted a multiparty constitution, and talks mediated by the Community of Sant’Egidio led to the Rome General Peace Accords of 4 October 1992 and elections in 1994. About a million people died, most of them from hunger and disease, some five million were displaced and 1.7 million fled abroad.
: Kriget mellan Moçambiques Frelimoregering och Moçambiques nationella motstånd (Renamo), som började två år efter självständigheten och varade till 1992. Renamo skapades av Rhodesias Central Intelligence Organisation 1976–1977 för att slå tillbaka mot Moçambique för dess stöd till den zimbabwiska gerillan, med André Matsangaissa och sedan Afonso Dhlakama som ledare. Efter Zimbabwes självständighet 1980 tog Sydafrikas militära underrättelsetjänst över rörelsen, och den spred sig genom landets mellersta och södra delar och angrep vägar, järnvägar, skolor, kliniker och byar. Nkomatiavtalet 1984, där Sydafrika lovade att sluta hjälpa Renamo, gjorde inte slut på den hjälpen. Zimbabwe sände trupper för att skydda Beirakorridoren och hjälpte till att inta Renamos högkvarter i Casa Banana 1985; även Tanzania och Malawi sände trupper. President Samora Machel omkom i en flygolycka vid Mbuzini 1986. Renamos massakrer, som i Homoine 1987, och regeringens tvångsförflyttningar ledde tillsammans med torka till hungersnöd. Efter det kalla krigets slut övergav Frelimo marxism-leninismen och antog en flerpartiförfattning, och samtal med Sant’Egidiosamfundet som medlare ledde till de allmänna fredsavtalen i Rom den 4 oktober 1992 och val 1994. Omkring en miljon människor dog, de flesta av svält och sjukdomar, omkring fem miljoner fördrevs och 1,7 miljoner flydde utomlands.
