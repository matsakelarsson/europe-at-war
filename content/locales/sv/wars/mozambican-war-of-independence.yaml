Mozambican War of Independence: Moçambiques självständighetskrig
? The guerrilla war fought by the Mozambique Liberation Front (FRELIMO) against Portuguese rule. Formed in Dar es Salaam in 1962 under Eduardo Mondlane, FRELIMO began the war on 25 September 1964 with an attack on the administrative post at Chai in Cabo Delgado. From bases in Tanzania it built liberated zones among the Makonde of the Mueda plateau and in northern Niassa, and in 1968 opened a front in Tete, where Portugal was building the Cahora Bassa dam. Mondlane was killed by a parcel bomb in 1969, and Samora Machel became FRELIMO’s leader. Portugal answered with a large conscript army, a growing share of it recruited in Mozambique, with resettlement of villagers into fortified aldeamentos and with General Kaúlza de Arriaga’s Operation Gordian Knot of 1970, the largest offensive of the war; Rhodesian forces fought FRELIMO in Tete. In December 1972 Portuguese commandos massacred hundreds of villagers at Wiriyamu. FRELIMO crossed the Zambezi into Manica and Sofala in 1972–1973. After army officers overthrew the dictatorship in Lisbon on 25 April 1974, Portugal and FRELIMO signed the Lusaka Accord on 7 September 1974, and Mozambique became independent on 25 June 1975. About 1,800 Portuguese soldiers were killed, some 10,000 FRELIMO fighters and tens of thousands of civilians.
: Det gerillakrig som Moçambiques befrielsefront (Frelimo) förde mot det portugisiska styret. Frelimo, som hade bildats i Dar es-Salaam 1962 under Eduardo Mondlane, inledde kriget den 25 september 1964 med ett anfall på förvaltningsposten i Chai i Cabo Delgado. Från baser i Tanzania byggde rörelsen upp befriade zoner bland makonde på Muedaplatån och i norra Niassa, och 1968 öppnade den en front i Tete, där Portugal byggde Cahora Bassa-dammen. Mondlane dödades av en paketbomb 1969, och Samora Machel blev Frelimos ledare. Portugal svarade med en stor värnpliktsarmé, där en växande andel rekryterades i Moçambique, med omflyttning av bybor till befästa aldeamentos och med general Kaúlza de Arriagas Operation Gordisk knut 1970, krigets största offensiv; rhodesiska styrkor stred mot Frelimo i Tete. I december 1972 massakrerade portugisiska kommandosoldater hundratals bybor i Wiriyamu. Frelimo gick över Zambezi in i Manica och Sofala 1972–1973. Sedan arméofficerare störtat diktaturen i Lissabon den 25 april 1974 undertecknade Portugal och Frelimo Lusakaavtalet den 7 september 1974, och Moçambique blev självständigt den 25 juni 1975. Omkring 1 800 portugisiska soldater dödades, liksom omkring 10 000 Frelimokrigare och tiotusentals civila.
