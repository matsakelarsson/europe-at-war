Mudéjar Revolt of 1264–1266: Mudéjarupproret 1264–1266
A rising of the Muslims living under Castilian rule (Mudéjars) in Lower Andalusia and Murcia against Alfonso X, whose policy of removing them from towns and resettling Christians in their place had bred resentment. Encouraged and supplied by Muhammad I of Granada, with some North African volunteers, the rebels took Jerez in August 1264, then Arcos, Lebrija, Medina-Sidonia and the city of Murcia. Castile retook Jerez that autumn and invaded the Vega of Granada in 1265, while Alfonso’s father-in-law, James I of Aragon, besieged Murcia from January 1266; it surrendered on 31 January, and James handed it back to Castile. A rebellion of the Banu Ashqilula against Muhammad I forced Granada to make peace and pay a heavy tribute. The Muslims of the retaken towns were expelled and Christians settled in their place.: Ett uppror bland de muslimer som levde under kastiliansk överhöghet (mudéjarer) i Nedre Andalusien och Murcia mot Alfonso X, vars politik att avlägsna dem från städerna och låta kristna bosätta sig i deras ställe hade väckt förbittring. Uppmuntrade och försörjda av Muhammad I av Granada, och med en del nordafrikanska frivilliga, tog upprorsmännen Jerez i augusti 1264 och därefter Arcos, Lebrija, Medina-Sidonia och staden Murcia. Kastilien återtog Jerez samma höst och invaderade Granadas vega 1265, medan Alfonsos svärfar Jakob I av Aragonien belägrade Murcia från januari 1266; staden kapitulerade den 31 januari, och Jakob lämnade tillbaka den till Kastilien. Ett uppror av Banu Ashqilula mot Muhammad I tvingade Granada att sluta fred och betala en tung tribut. Muslimerna i de återtagna städerna fördrevs och kristna bosatte sig i deras ställe.
