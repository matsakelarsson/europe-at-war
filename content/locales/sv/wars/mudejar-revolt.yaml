The date of the peace between Alfonso X and Muhammad I at Alcalá de Benzaide (Alcalá la Real) is uncertain; it was probably made in 1266 or 1267. The wider story is told in the Reconquista.: Datumet för freden mellan Alfonso X och Muhammad I i Alcalá de Benzaide (Alcalá la Real) är osäkert; den slöts troligen 1266 eller 1267. Det större sammanhanget berättas i Reconquista.
