# Svenska översättningar av katalogtexten (våg 7); stegtexterna kommer senare.
Mughal campaign in Balkh: Mogulernas fälttåg i Balkh
Shah Jahan’s attempt to win Balkh and Badakhshan, the land north of the Hindu Kush that his Timurid ancestors had once ruled. In 1645 the Uzbek khan of Bukhara, Nadr (Nazr) Muhammad, was overthrown by his son Abd al-Aziz and kept only Balkh. In February 1646 Shah Jahan sent an army of some 60,000 under his son Murad Bakhsh from Kabul across the mountains, nominally to help Nadr Muhammad; it occupied Badakhshan and Balkh, while Nadr Muhammad, distrusting the Mughals, fled to Persia. Murad soon left his post, and in 1647 Prince Aurangzeb took command. He defeated the Uzbek armies of Abd al-Aziz outside Balkh, but the Mughals could not hold a hostile and poor country against constant raids, and in the autumn of 1647 Aurangzeb withdrew, losing many men and animals in the snow of the Hindu Kush passes. Balkh was handed back to the Uzbeks. The campaign cost some 20 million rupees and weakened the Mughal frontier, which helped Persia take Kandahar in 1649.: Shah Jahans försök att vinna Balkh och Badakhshan, landet norr om Hindukush som hans timuridiska förfäder en gång hade härskat över. År 1645 störtades uzbekernas khan i Buchara, Nadr (Nazr) Muhammad, av sin son Abd al-Aziz och behöll endast Balkh. I februari 1646 sände Shah Jahan en här på omkring 60 000 man under sin son Murad Bakhsh från Kabul över bergen, formellt för att hjälpa Nadr Muhammad; den besatte Badakhshan och Balkh, medan Nadr Muhammad, som misstrodde mogulerna, flydde till Persien. Murad lämnade snart sin post, och 1647 tog prins Aurangzeb befälet. Han besegrade de uzbekiska härarna under Abd al-Aziz utanför Balkh, men mogulerna kunde inte hålla ett fientligt och fattigt land mot ständiga plundringståg, och hösten 1647 drog sig Aurangzeb tillbaka och förlorade då många män och djur i snön i Hindukushs pass. Balkh lämnades tillbaka till uzbekerna. Fälttåget kostade omkring 20 miljoner rupier och försvagade mogulernas gräns, vilket hjälpte Persien att inta Kandahar 1649.
