# Svenska översättningar av katalogtexten (våg 8); stegtexterna kommer senare.
Mughal conquest of Bengal: Mogulernas erövring av Bengalen
The long conquest of Bihar and Bengal by the Mughal Empire. In 1574 Akbar took Patna from Daud Khan Karrani, the Afghan sultan of Bengal, and his generals pursued Daud into Odisha and defeated him at Tukaroi in March 1575. Daud broke the peace that followed, and at Rajmahal on 12 July 1576 he was defeated again, captured and executed, ending the Karrani dynasty and the Bengal Sultanate. The Mughals held western and northern Bengal, but the river country of the east, the Bhati, stayed in the hands of local lords known as the Baro-Bhuyans, led by Isa Khan of Sonargaon, who beat back Mughal fleets in 1584 and 1597. Only under Jahangir did the governor Islam Khan Chishti, with a large river fleet, subdue Isa Khan’s son Musa Khan in 1610–1611 and make Dhaka the capital of Mughal Bengal. The last Afghan chief, Khwaja Usman, was killed in Sylhet in 1612.: Mogulrikets långa erövring av Bihar och Bengalen. År 1574 tog Akbar Patna från Daud Khan Karrani, Bengalens afghanske sultan, och hans generaler förföljde Daud in i Odisha och besegrade honom vid Tukaroi i mars 1575. Daud bröt den fred som följde, och vid Rajmahal den 12 juli 1576 besegrades han på nytt, tillfångatogs och avrättades, vilket gjorde slut på karranidynastin och Bengalsultanatet. Mogulerna behärskade västra och norra Bengalen, men flodlandet i öster, Bhati, förblev i händerna på lokala herrar kända som baro-bhuyanerna, ledda av Isa Khan av Sonargaon, som slog tillbaka mogulflottor 1584 och 1597. Först under Jahangir lyckades guvernören Islam Khan Chishti, med en stor flodflotta, kuva Isa Khans son Musa Khan 1610–1611 och göra Dhaka till huvudstad i mogulernas Bengalen. Den siste afghanske hövdingen, Khwaja Usman, dödades i Sylhet 1612.
