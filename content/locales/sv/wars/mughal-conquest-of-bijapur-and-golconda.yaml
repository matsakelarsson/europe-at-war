Mughal conquest of Bijapur and Golconda: Mogulernas erövring av Bijapur och Golconda
Aurangzeb’s conquest of the last two Deccan sultanates, the Adil Shahi kingdom of Bijapur and the Qutb Shahi kingdom of Golconda, which had paid tribute to the Mughals for decades but kept their independence and were accused of helping the Marathas. A Mughal army besieged Bijapur from April 1685; Aurangzeb took command himself in July 1686, and the starving city surrendered on 12 September. His son Shah Alam had already occupied Hyderabad in 1685, and in January 1687 the emperor laid siege to the fortress of Golconda, which held out for eight months against mines, famine and plague until one of its officers opened a gate on the night of 21 September 1687. Both kingdoms were annexed, bringing the Mughal empire to its greatest extent and leaving the Marathas as Aurangzeb’s only enemy in the Deccan.: Aurangzebs erövring av de två sista sultanaten i Deckan, adilshahidynastins kungarike Bijapur och qutbshahidynastins kungarike Golconda, som i årtionden hade betalat tribut till mogulerna men behållit sin självständighet och anklagades för att hjälpa maratherna. En mogularmé belägrade Bijapur från april 1685; Aurangzeb tog själv befälet i juli 1686, och den svältande staden kapitulerade den 12 september. Hans son Shah Alam hade redan besatt Hyderabad 1685, och i januari 1687 belägrade kejsaren fästningen Golconda, som i åtta månader stod emot minor, svält och pest tills en av dess officerare öppnade en port natten den 21 september 1687. Båda kungarikena annekterades, vilket gav Mogulriket dess största utbredning och lämnade maratherna som Aurangzebs enda fiende i Deckan.
