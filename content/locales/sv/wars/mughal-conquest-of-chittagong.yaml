# Svenska översättningar av katalogtexten (våg 8); stegtexterna kommer senare.
Mughal conquest of Chittagong: Mogulernas erövring av Chittagong
The campaign in which the Mughal governor of Bengal, Shaista Khan, took Chittagong from the kingdom of Arakan (Mrauk U). For decades Arakanese fleets and the Portuguese freebooters settled at Chittagong had raided the rivers of lower Bengal for slaves and plunder, and Arakan had sheltered Aurangzeb’s fugitive brother Shah Shuja. Shaista Khan built a new war fleet at Dhaka, took the island of Sandwip in November 1665 with Dutch help and won over the Portuguese of Chittagong, who changed sides with their ships. His son Buzurg Umed Khan advanced with an army along the coast while the fleet beat the Arakanese navy at the mouth of the Karnaphuli; after a short siege the fort of Chittagong surrendered on 27 January 1666. The town was renamed Islamabad and became the seat of a Mughal faujdar. Arakan’s attempts to retake it failed, and Chittagong remained part of Mughal Bengal until it was ceded to the East India Company in 1760.: Det fälttåg där mogulguvernören i Bengalen, Shaista Khan, tog Chittagong från kungariket Arakan (Mrauk U). I årtionden hade arakanesiska flottor och de portugisiska fribytare som hade slagit sig ned i Chittagong härjat floderna i nedre Bengalen på jakt efter slavar och byte, och Arakan hade gett skydd åt Aurangzebs flyende bror Shah Shuja. Shaista Khan byggde en ny krigsflotta i Dhaka, intog ön Sandwip i november 1665 med nederländsk hjälp och vann över portugiserna i Chittagong, som bytte sida med sina fartyg. Hans son Buzurg Umed Khan ryckte fram med en armé längs kusten medan flottan besegrade den arakanesiska flottan vid Karnaphulis mynning; efter en kort belägring kapitulerade fortet i Chittagong den 27 januari 1666. Staden fick namnet Islamabad och blev säte för en faujdar i mogulernas tjänst. Arakans försök att återta den misslyckades, och Chittagong förblev en del av mogulernas Bengalen tills det avträddes till Ostindiska kompaniet 1760.
