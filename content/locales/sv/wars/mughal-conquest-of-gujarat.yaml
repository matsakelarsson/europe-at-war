Mughal conquest of Gujarat: Mogulernas erövring av Gujarat
? Akbar’s conquest of the Gujarat Sultanate, the rich kingdom of western India with the ports of Cambay and Surat. Gujarat had been torn by rivalries among its nobles under the young sultan Muzaffar Shah III, and one faction leader, Itimad Khan, invited Akbar in. Akbar left Fatehpur Sikri in July 1572 and reached Ahmedabad in November with little resistance; Muzaffar Shah was taken prisoner and Itimad Khan and the nobles submitted. The Mirzas, rebel Timurid cousins of Akbar who had taken refuge in Gujarat, fought on. Akbar, with only a few hundred men, defeated Ibrahim Husain Mirza at Sarnal in December 1572, and Surat surrendered on 26 February 1573 after a siege of about six weeks. Soon after Akbar went home, Muhammad Husain Mirza and Gujarati nobles under Ikhtiyar-ul-Mulk rose and besieged Ahmedabad. Akbar rode from Fatehpur Sikri to Ahmedabad, about 900 km, in some eleven days, and routed them outside the city in early September 1573; both rebel leaders were killed. Gujarat became a Mughal province, and the Buland Darwaza at Fatehpur Sikri was later built to mark the conquest. Muzaffar Shah escaped from captivity in 1583 and retook Ahmedabad, but Abdul Rahim Khan-i-Khanan defeated him near Sarkhej in 1584; captured in 1592, he took his own life.
: Akbars erövring av Gujaratsultanatet, det rika kungariket i västra Indien med hamnarna Cambay och Surat. Gujarat hade slitits sönder av rivalitet mellan stormännen under den unge sultanen Muzaffar Shah III, och en av fraktionsledarna, Itimad Khan, bjöd in Akbar. Akbar lämnade Fatehpur Sikri i juli 1572 och nådde Ahmedabad i november utan större motstånd; Muzaffar Shah togs till fånga, och Itimad Khan och stormännen underkastade sig. Mirzaerna, upproriska timuridiska kusiner till Akbar som hade tagit sin tillflykt till Gujarat, fortsatte striden. Akbar besegrade med bara några hundra man Ibrahim Husain Mirza vid Sarnal i december 1572, och Surat kapitulerade den 26 februari 1573 efter en belägring på omkring sex veckor. Strax efter att Akbar hade återvänt hem reste sig Muhammad Husain Mirza och gujaratiska stormän under Ikhtiyar-ul-Mulk och belägrade Ahmedabad. Akbar red från Fatehpur Sikri till Ahmedabad, omkring 900 km, på ungefär elva dagar och slog dem på flykten utanför staden i början av september 1573; båda upprorsledarna dödades. Gujarat blev en mogulprovins, och Buland Darwaza i Fatehpur Sikri byggdes senare till minne av erövringen. Muzaffar Shah rymde ur fångenskapen 1583 och återtog Ahmedabad, men Abdul Rahim Khan-i-Khanan besegrade honom nära Sarkhej 1584; han tillfångatogs 1592 och tog sitt liv.
