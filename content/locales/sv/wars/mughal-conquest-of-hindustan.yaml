# Svenska översättningar av katalogtexten (våg 8); stegtexterna kommer senare.
Babur’s conquest of Hindustan: Baburs erövring av Hindustan
The campaigns in which Babur, the Timurid ruler of Kabul, conquered the heart of northern India and founded the Mughal Empire. Invited by rebels against the Delhi sultan Ibrahim Lodi, he crossed the Indus in December 1525 with about 12,000 men and, with field guns and a line of carts lashed together, destroyed Ibrahim’s much larger army at Panipat on 21 April 1526. He went on to defeat the Rajput confederacy of Rana Sanga of Mewar at Khanwa in 1527, stormed the fortress of Chanderi in 1528 and broke the Afghan chiefs of the east and the army of Bengal on the Ghaghra in 1529. When he died at Agra in December 1530, his son Humayun inherited a new and unsettled realm that reached from Kabul and Kandahar to the borders of Bihar.: De fälttåg i vilka Babur, den timuridiske härskaren i Kabul, erövrade hjärtat av norra Indien och grundade Mogulriket. Inbjuden av rebeller mot Delhisultanen Ibrahim Lodi gick han över Indus i december 1525 med omkring 12 000 man och förintade, med fältkanoner och en rad sammansurrade vagnar, Ibrahims mycket större armé vid Panipat den 21 april 1526. Därefter besegrade han Rana Sanga av Mewars rajputförbund vid Khanwa 1527, stormade fästningen Chanderi 1528 och krossade österns afghanska hövdingar och Bengalens armé vid Ghaghra 1529. När han dog i Agra i december 1530 ärvde hans son Humayun ett nytt och oroligt rike som sträckte sig från Kabul och Kandahar till Bihars gränser.
