# Svenska översättningar av katalogtexten (våg 8); stegtexterna kommer senare.
Mughal conquest of Kashmir: Mogulernas erövring av Kashmir
Akbar’s annexation of the Kashmir Sultanate, ruled since 1561 by the Chak dynasty. In December 1585, while Akbar was at Attock on the Indus, he sent an army of about 5,000 horsemen under Raja Bhagwant Das of Amber and Mirza Shah Rukh across the mountains in winter. Sultan Yusuf Shah Chak met them at the Buliasa pass, but with his nobles divided he came to the Mughal camp and agreed terms on 14 February 1586. Akbar would not accept the agreement and kept Yusuf Shah a prisoner; he later held a Mughal rank in Bihar and died in exile in 1592. The Kashmiri nobles made his son Yaqub Shah sultan and fought on. A second Mughal army under Qasim Khan entered the valley later in 1586 and took Srinagar in the autumn, while Yaqub Shah kept up resistance from the hills until he submitted in 1589. Akbar visited the valley that year, and Kashmir became part of the Mughal province of Kabul and a favourite summer retreat of the Mughal emperors.: Akbars annektering av Kashmirsultanatet, som sedan 1561 styrdes av chakdynastin. I december 1585, medan Akbar befann sig i Attock vid Indus, sände han en armé på omkring 5 000 ryttare under raja Bhagwant Das av Amber och Mirza Shah Rukh över bergen mitt i vintern. Sultan Yusuf Shah Chak mötte dem vid Buliasapasset, men eftersom hans stormän var splittrade kom han till mogullägret och gick med på villkor den 14 februari 1586. Akbar vägrade godta överenskommelsen och höll Yusuf Shah fången; denne innehade senare en rang i mogulernas tjänst i Bihar och dog i landsflykt 1592. De kashmiriska stormännen gjorde hans son Yaqub Shah till sultan och fortsatte striden. En andra mogularmé under Qasim Khan trängde in i dalen senare under 1586 och intog Srinagar på hösten, medan Yaqub Shah fortsatte motståndet från bergen tills han underkastade sig 1589. Akbar besökte dalen samma år, och Kashmir blev en del av mogulprovinsen Kabul och en omtyckt sommartillflykt för mogulkejsarna.
