# Svenska översättningar av katalogtexten (våg 8); stegtexterna kommer senare.
Mughal conquest of Sindh: Mogulernas erövring av Sind
Akbar’s conquest of lower Sindh, the kingdom of Thatta in the Indus delta, ruled by Mirza Jani Beg of the Tarkhan dynasty. Upper Sindh, with the island fortress of Bhakkar, had been Mughal since 1574. In 1591 Akbar, then at Lahore, sent his leading noble, Abdul Rahim Khan-i-Khanan, down the Indus with an army and river boats, partly to secure the route to Kandahar. Jani Beg raised tribal levies and a war fleet, partly built and manned with the help of Portuguese mercenaries from the coast, and fought the Mughals several times on the borders of Sehwan and on the river. He held out for about two years, but after defeats, a siege of his fortified camp and growing hunger he came to terms; Thatta was handed over in late 1592, and in 1593 Jani Beg went to Akbar’s court at Lahore. Akbar made him a commander of 5,000 and left him Thatta and Sehwan to govern as a Mughal officer, and his family governed it until 1612. Sindh became part of the Mughal province of Multan, and later a province of its own, Thatta.: Akbars erövring av nedre Sind, kungariket Thatta i Indusdeltat, som styrdes av Mirza Jani Beg av tarkhandynastin. Övre Sind, med ö-fästningen Bhakkar, hade varit i mogulernas händer sedan 1574. År 1591 sände Akbar, som då befann sig i Lahore, sin främste storman, Abdul Rahim Khan-i-Khanan, nedför Indus med en armé och flodbåtar, delvis för att säkra vägen till Kandahar. Jani Beg mönstrade stamtrupper och en krigsflotta, delvis byggd och bemannad med hjälp av portugisiska legosoldater från kusten, och drabbade samman med mogulerna flera gånger vid Sehwans gränser och på floden. Han höll stånd i omkring två år, men efter nederlag, en belägring av hans befästa läger och tilltagande hunger gick han med på villkor; Thatta överlämnades i slutet av 1592, och 1593 begav sig Jani Beg till Akbars hov i Lahore. Akbar gjorde honom till befälhavare över 5 000 och lät honom styra Thatta och Sehwan som ämbetsman i mogulernas tjänst, och hans släkt styrde området till 1612. Sind blev en del av mogulprovinsen Multan och senare en egen provins, Thatta.
