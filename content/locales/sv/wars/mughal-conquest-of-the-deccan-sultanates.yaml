# Svenska översättningar av katalogtexten (våg 8); stegtexterna kommer senare.
Mughal wars in the Deccan (1595–1636): Mogulernas krig i Deckan (1595–1636)
The Mughal Empire’s first push into the Deccan, against the sultanates of Ahmadnagar and Khandesh, and the settlement that followed with Bijapur and Golconda. Akbar’s armies besieged Ahmadnagar in 1595–96, when it was famously defended by Chand Bibi, and forced it to cede Berar. In 1600 they stormed Ahmadnagar fort, and in January 1601 Akbar took Asirgarh, the fortress of Khandesh, which was annexed. But the Ahmadnagar state survived under the Ethiopian-born regent Malik Ambar, who with Maratha light cavalry held the Mughals at bay for a quarter of a century and beat a Mughal and Bijapuri army at Bhatvadi in 1624. After his death in 1626 the sultanate weakened. Shah Jahan’s general Mahabat Khan took the fortress of Daulatabad in 1633, and in 1636 Ahmadnagar was divided between the Mughals and Bijapur, while Bijapur and Golconda accepted Mughal overlordship by treaty.: Mogulrikets första framstöt in i Deckan, mot sultanaten Ahmadnagar och Khandesh, och den uppgörelse med Bijapur och Golconda som följde. Akbars arméer belägrade Ahmadnagar 1595–96, då staden berömt försvarades av Chand Bibi, och tvingade sultanatet att avträda Berar. År 1600 stormade de fästningen i Ahmadnagar, och i januari 1601 intog Akbar Asirgarh, Khandeshs fästning, och Khandesh annekterades. Men staten Ahmadnagar levde vidare under den etiopiskfödde regenten Malik Ambar, som med lätt marathakavalleri höll mogulerna stången i ett kvarts sekel och slog en förenad armé från mogulerna och Bijapur vid Bhatvadi 1624. Efter hans död 1626 försvagades sultanatet. Shah Jahans general Mahabat Khan intog fästningen Daulatabad 1633, och 1636 delades Ahmadnagar mellan mogulerna och Bijapur, medan Bijapur och Golconda genom fördrag erkände mogulernas överhöghet.
