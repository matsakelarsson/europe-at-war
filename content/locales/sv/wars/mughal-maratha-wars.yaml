Mughal–Maratha wars: Krigen mellan mogulerna och maratherna
The twenty-seven years’ war in the Deccan between the Mughal emperor Aurangzeb and the Maratha kingdom founded by Shivaji. Aurangzeb came south in 1681 with the court and an army of several hundred thousand, sheltered by no city, and stayed for the rest of his life. After conquering Bijapur and Golconda he captured Shivaji’s son and successor Sambhaji in 1689 and had him executed, and took the Maratha capital Raigad. Sambhaji’s brother Rajaram escaped to Gingee in the far south, which held out until 1698, while Maratha cavalry under Santaji Ghorpade and Dhanaji Jadhav raided across the Deccan and beat Mughal armies in the field. From 1699 the aged emperor besieged the Maratha hill forts one by one; under Rajaram’s widow Tarabai the Marathas retook them as soon as he left and carried their raids north of the Narmada. Aurangzeb died at Ahmednagar in 1707 with the war unwon, his treasury drained and the Deccan devastated.: Det tjugosjuåriga kriget i Deckan mellan mogulkejsaren Aurangzeb och marathernas kungarike, som Shivaji hade grundat. Aurangzeb drog söderut 1681 med hovet och en armé på flera hundra tusen man, utan någon stad som skydd, och stannade där resten av sitt liv. Sedan han hade erövrat Bijapur och Golconda tillfångatog han 1689 Shivajis son och efterträdare Sambhaji och lät avrätta honom, och han intog marathernas huvudstad Raigad. Sambhajis bror Rajaram flydde till Gingee längst i söder, som höll stånd till 1698, medan marathiskt kavalleri under Santaji Ghorpade och Dhanaji Jadhav företog räder över hela Deckan och besegrade mogularméer i fält. Från 1699 belägrade den åldrade kejsaren marathernas bergsfästningar en efter en; under Rajarams änka Tarabai återtog maratherna dem så snart han hade dragit vidare och förde sina räder norr om Narmada. Aurangzeb dog i Ahmednagar 1707 utan att ha vunnit kriget, med tömd statskassa och ett ödelagt Deckan.
