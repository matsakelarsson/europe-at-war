# Svenska översättningar av katalogtexten (våg 8); stegtexterna kommer senare.
Mughal–Mewar wars: Krigen mellan mogulerna och Mewar
"The wars between the Mughal emperors Akbar and Jahangir and the Rajput kingdom of Mewar, the one major Rajput state that refused to accept Mughal overlordship. Akbar stormed Mewar’s fortress capital, Chittorgarh, in February 1568 after a four-month siege, and many of its people were killed. Rana Udai Singh II and then his son Pratap Singh fought on from the Aravalli hills. A Mughal army under Raja Man Singh of Amber defeated Pratap at Haldighati in 1576, but he escaped and in later years won back most of Mewar except Chittorgarh. Under Jahangir, repeated campaigns, the last led by Prince Khurram, the future Shah Jahan, exhausted the country, and in February 1615 Pratap’s son Amar Singh I made peace on honourable terms: he was excused from attending the Mughal court and Chittorgarh was returned, though it was not to be refortified.": "Krigen mellan mogulkejsarna Akbar och Jahangir och rajputkungariket Mewar, den enda större rajputstat som vägrade godta mogulernas överhöghet. Akbar stormade Mewars huvudstad, fästningen Chittorgarh, i februari 1568 efter en fyra månader lång belägring, och många av dess invånare dödades. Rana Udai Singh II och sedan hans son Pratap Singh fortsatte striden från Aravallibergen. En mogularmé under raja Man Singh av Amber besegrade Pratap vid Haldighati 1576, men han undkom och vann under senare år tillbaka större delen av Mewar utom Chittorgarh. Under Jahangir utmattades landet av upprepade fälttåg, det sista lett av prins Khurram, den blivande Shah Jahan, och i februari 1615 slöt Prataps son Amar Singh I fred på hedersamma villkor: han befriades från att infinna sig vid mogulhovet och Chittorgarh återlämnades, dock utan att få befästas på nytt."
