# Svenska översättningar av katalogtexten (våg 7); stegtexterna kommer senare.
Mughal–Safavid wars over Kandahar: Mogul-safavidiska krigen om Kandahar
The struggle between Safavid Persia and the Mughal Empire for Kandahar, the fortress city on the trade road between India and Iran. Shah Abbas I took it from the Mughals in 1622 after a 45-day siege. Its Persian governor, Ali Mardan Khan, handed it to Shah Jahan in 1638, but Shah Abbas II won it back in February 1649. Three great Mughal sieges, two under Prince Aurangzeb and one under Prince Dara Shikoh, failed in 1649, 1652 and 1653, and Kandahar stayed Persian until the Hotaki revolt of 1709.: Kampen mellan det safavidiska Persien och Mogulriket om Kandahar, fästningsstaden vid handelsvägen mellan Indien och Iran. Shah Abbas I tog staden från mogulerna 1622 efter en belägring på 45 dagar. Dess persiske guvernör, Ali Mardan Khan, överlämnade den till Shah Jahan 1638, men shah Abbas II återtog den i februari 1649. Mogulernas tre stora belägringar, två under prins Aurangzeb och en under prins Dara Shikoh, misslyckades 1649, 1652 och 1653, och Kandahar förblev persiskt fram till hotakiupproret 1709.
