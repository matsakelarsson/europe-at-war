# Svenska översättningar av katalogtexten (våg 8); stegtexterna kommer senare.
Mughal–Sur wars: Krigen mellan mogulerna och surdynastin
The struggle between Babur’s son Humayun and the Afghan Sur dynasty for northern India. Sher Khan Sur, an Afghan chief of Bihar, took Bengal in 1538, destroyed Humayun’s army at Chausa in 1539 and beat him again at Kannauj in 1540, driving the Mughals out of India. As Sher Shah he ruled from Bengal to the Indus until his death in 1545, building roads, forts and a new silver coinage. Humayun wandered through Sindh and the desert, where his son Akbar was born, and found help in Safavid Persia, which let him take Kandahar and Kabul in 1545. When the Sur empire split between rival claimants after 1554, he came back, won at Sirhind and re-entered Delhi in July 1555, but died six months later. Hemu, general of the Sur ruler Adil Shah, then took Agra and Delhi, until the Mughal army of the 13-year-old Akbar and his regent Bairam Khan defeated him at the Second Battle of Panipat on 5 November 1556.: Kampen mellan Baburs son Humayun och den afghanska surdynastin om norra Indien. Sher Khan Sur, en afghansk hövding i Bihar, intog Bengalen 1538, krossade Humayuns armé vid Chausa 1539 och besegrade honom på nytt vid Kannauj 1540, varvid mogulerna drevs ut ur Indien. Som Sher Shah härskade han från Bengalen till Indus fram till sin död 1545; han byggde vägar och fästningar och införde ett nytt silvermynt. Humayun irrade omkring i Sindh och öknen, där hans son Akbar föddes, och fick hjälp av det safavidiska Persien, vilket gjorde det möjligt för honom att inta Kandahar och Kabul 1545. När surriket efter 1554 splittrades mellan rivaliserande tronpretendenter återvände han, segrade vid Sirhind och tågade åter in i Delhi i juli 1555, men dog sex månader senare. Hemu, general hos surhärskaren Adil Shah, intog då Agra och Delhi, tills mogularmén under den 13-årige Akbar och hans regent Bairam Khan besegrade honom i andra slaget vid Panipat den 5 november 1556.
