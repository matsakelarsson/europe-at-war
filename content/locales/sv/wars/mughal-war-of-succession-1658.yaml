Mughal war of succession (1658–1659): Mogulrikets tronföljdskrig (1658–1659)
The war between the four sons of the Mughal emperor Shah Jahan after he fell ill in September 1657. The eldest, Dara Shikoh, held the court as his father’s favourite; Shah Shuja in Bengal and Murad Bakhsh in Gujarat crowned themselves, and Aurangzeb, viceroy of the Deccan, joined Murad. Dara’s son Sulaiman Shikoh beat Shuja at Bahadurpur, but Aurangzeb and Murad routed the imperial army at Dharmat and Dara himself at Samugarh near Agra in 1658. Aurangzeb confined Shah Jahan in Agra fort, arrested Murad and had himself proclaimed emperor. He defeated Shuja at Khajwa and Dara again at Deorai near Ajmer in 1659; Dara was betrayed, paraded through Delhi and executed for apostasy, and Shuja fled to Arakan in 1660. Aurangzeb ruled until 1707.: Kriget mellan mogulkejsaren Shah Jahans fyra söner sedan han insjuknat i september 1657. Den äldste, Dara Shikoh, behärskade hovet som faderns favorit; Shah Shuja i Bengalen och Murad Bakhsh i Gujarat lät kröna sig, och Aurangzeb, vicekung i Deckan, slöt sig till Murad. Daras son Sulaiman Shikoh besegrade Shuja vid Bahadurpur, men Aurangzeb och Murad krossade den kejserliga armén vid Dharmat och Dara själv vid Samugarh nära Agra 1658. Aurangzeb höll Shah Jahan inspärrad i Agras fort, lät gripa Murad och utropade sig till kejsare. Han besegrade Shuja vid Khajwa och Dara på nytt vid Deorai nära Ajmer 1659; Dara förråddes, fördes förnedrad genom Delhis gator och avrättades för avfall från tron, och Shuja flydde till Arakan 1660. Aurangzeb regerade till 1707.
