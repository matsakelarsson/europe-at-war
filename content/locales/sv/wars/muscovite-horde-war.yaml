After his defeat by Tokhtamysh, Mamai fled to the Genoese port and was killed there.: Efter sitt nederlag mot Tochtamysj flydde Mamaj till den genuesiska hamnstaden och dödades där.
Mamai: Mamaj
Tokhtamysh, now khan of a reunited Horde, demanded that Moscow submit. In the summer of 1382 he moved north so fast that Dmitry could not gather an army, and the princes of Nizhny Novgorod and Ryazan, hoping to save their own lands, helped him; Oleg of Ryazan is said to have shown him the fords of the Oka. Dmitry left for Kostroma to raise troops, and the metropolitan also left the city. After riots, the townspeople chose a Lithuanian prince, Ostey, a grandson of Algirdas, to lead the defence of the Kremlin, which Dmitry had rebuilt in stone in 1367.: Tochtamysj, nu khan över en återförenad horde, krävde att Moskva skulle underkasta sig. Sommaren 1382 drog han norrut så snabbt att Dmitrij inte hann samla någon här, och furstarna av Nizjnij Novgorod och Rjazan, som hoppades rädda sina egna länder, hjälpte honom; Oleg av Rjazan sägs ha visat honom vadställena över Oka. Dmitrij begav sig till Kostroma för att samla trupper, och även metropoliten lämnade staden. Efter upplopp valde stadsborna en litauisk furste, Ostej, en sonson till Algirdas, att leda försvaret av Kreml, som Dmitrij hade byggt om i sten 1367.
The Tatars arrived on 23 August and failed to storm the walls. On 26 August the princes of Nizhny Novgorod who rode with the khan swore that the city would be spared if it opened its gates. Ostey went out to negotiate and was killed, and the Tatars broke in, massacred the people and burned the city; a figure of 24,000 dead is often cited. Detachments sacked Pereslavl, Kolomna and other towns, though Vladimir Andreyevich beat one near Volok Lamsky. Dmitry kept his title but paid tribute again, and in 1383 sent his son Vasily to the Horde as a hostage.: Tatarerna anlände den 23 augusti och misslyckades med att storma murarna. Den 26 augusti svor de furstar av Nizjnij Novgorod som red med khanen att staden skulle skonas om den öppnade sina portar. Ostej gick ut för att förhandla och dödades, och tatarerna bröt sig in, massakrerade invånarna och brände staden; en siffra på 24 000 döda anges ofta. Avdelningar plundrade Pereslavl, Kolomna och andra städer, även om Vladimir Andrejevitj besegrade en av dem nära Volok Lamskij. Dmitrij behöll sin titel men betalade åter tribut och sände 1383 sin son Vasilij till horden som gisslan.
