After 1359 the Golden Horde fell into two decades of civil war, the “Great Troubles”, in which more than twenty khans came and went. In the west the beylerbey Mamai ruled through puppet khans. Dmitry Ivanovich of Moscow, who had kept the khan’s patent for the grand principality of Vladimir against the princes of Tver, broke with Mamai in 1374 and later stopped paying tribute. In 1376 a Muscovite army forced the town of Bulgar on the middle Volga to pay tribute, and in 1377 Mamai’s Tatars surprised and destroyed a Russian army on the Pyana river, then plundered Nizhny Novgorod.: Efter 1359 föll Gyllene horden in i två årtionden av inbördeskrig, de ”stora oroligheterna”, då mer än tjugo khaner kom och gick. I väster styrde beylerbeyn Mamaj genom marionettkhaner. Dmitrij Ivanovitj av Moskva, som hade behållit khanens privilegiebrev för storfurstendömet Vladimir mot furstarna av Tver, bröt med Mamaj 1374 och slutade senare betala tribut. 1376 tvingade en moskovitisk här staden Bulgar vid mellersta Volga att betala tribut, och 1377 överraskade och förintade Mamajs tatarer en rysk här vid floden Pjana och plundrade sedan Nizjnij Novgorod.
In 1378 Mamai sent an army under Murza Begich to bring Moscow to heel. Dmitry met it in the Ryazan lands on the Vozha, a tributary of the Oka, and held the ford. On 11 August, after a long wait, Begich crossed the river. His cavalry was beaten back by the Russian centre under Dmitry and the wings under Timofey Velyaminov and Andrei of Polotsk, and a counter-attack drove the Tatars into the river, where many drowned. Begich was killed. It was Moscow’s first victory over a large Horde army. That autumn Mamai took his revenge on Ryazan and burned its capital.: 1378 sände Mamaj en här under murza Begitj för att tvinga Moskva till lydnad. Dmitrij mötte den i Rjazans land vid Vozja, en biflod till Oka, och höll vadstället. Den 11 augusti, efter en lång väntan, gick Begitj över floden. Hans kavalleri slogs tillbaka av den ryska centern under Dmitrij och flyglarna under Timofej Veljaminov och Andrej av Polotsk, och ett motanfall drev tatarerna ut i floden, där många drunknade. Begitj dödades. Det var Moskvas första seger över en stor här från horden. Samma höst hämnades Mamaj på Rjazan och brände dess huvudstad.
