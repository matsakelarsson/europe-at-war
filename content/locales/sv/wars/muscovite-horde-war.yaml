Dates are Julian (Old Style), as in the Russian chronicles. Most of the detail about Kulikovo comes from tales written decades or centuries later, and their numbers are not reliable; one recent historian has even questioned whether the battle on the Vozha took place as described.: Datumen anges enligt den julianska kalendern (gamla stilen), som i de ryska krönikorna. De flesta detaljerna om Kulikovo kommer från berättelser som skrevs årtionden eller sekler senare, och deras siffror är inte tillförlitliga; en nutida historiker har till och med ifrågasatt om slaget vid Vozja ägde rum så som det beskrivs.
Mamai was not a descendant of Genghis Khan and ruled the western Horde through puppet khans. Tokhtamysh, a Genghisid backed by Timur, took over the eastern Horde in the late 1370s and reunited it after Kulikovo.: Mamaj härstammade inte från Djingis khan och styrde den västra horden genom marionettkhaner. Tochtamysj, en ättling till Djingis khan med stöd av Timur, tog över den östra horden i slutet av 1370-talet och återförenade horden efter Kulikovo.
Moscow’s rulers held the title of grand prince of Vladimir, granted by the khans, and led the princes of north-eastern Rus’ who joined them.: Moskvas härskare bar titeln storfurste av Vladimir, som khanerna förlänade, och ledde de furstar i nordöstra Rus som anslöt sig till dem.
