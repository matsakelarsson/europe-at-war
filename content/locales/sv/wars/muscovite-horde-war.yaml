Dmitry: Dmitrij
In 1380 Mamai, threatened in the east by Tokhtamysh, led a large army north himself. He allied with Grand Duke Jogaila of Lithuania, and Prince Oleg of Ryazan, caught between the two sides, nominally joined him. Dmitry gathered troops from most of north-eastern Rus’ at Kolomna and refused the higher tribute Mamai’s envoys demanded. He marched west along the Oka, crossed it at Lopasnya in late August and headed south to fight before Mamai and Jogaila could join forces. On the morning of 8 September his army crossed the Don to Kulikovo Field, the “snipe field”, near the mouth of the Nepryadva.: 1380 förde Mamaj, som i öster hotades av Tochtamysj, själv en stor här norrut. Han slöt förbund med storfurst Jogaila av Litauen, och fursten Oleg av Rjazan, fångad mellan de båda sidorna, anslöt sig formellt till honom. Dmitrij samlade trupper från större delen av nordöstra Rus vid Kolomna och vägrade betala den högre tribut som Mamajs sändebud krävde. Han marscherade västerut längs Oka, gick över floden vid Lopasnja i slutet av augusti och styrde söderut för att slåss innan Mamaj och Jogaila kunde förena sina styrkor. På morgonen den 8 september gick hans här över Don till Kulikovofältet, ”beckasinfältet”, nära Neprjadvas mynning.
Later tales begin the battle with a duel in which the monk Peresvet and a Tatar champion killed each other. The armies then fought a long, bloody mêlée until an ambush regiment under Prince Vladimir Andreyevich and Dmitry Bobrok fell on the Tatars’ flank and routed them. Dmitry was found wounded among the dead. Chroniclers wrote of hundreds of thousands of men; modern estimates range from a few thousand to several tens of thousands. Jogaila turned back, and Mamai, beaten soon afterwards by Tokhtamysh, was killed at Caffa in the Crimea. Dmitry became known as Donskoy, “of the Don”.: Senare berättelser låter slaget börja med en tvekamp där munken Peresvet och en tatarisk kämpe dödade varandra. Härarna utkämpade sedan en lång och blodig närstrid tills ett bakhållsregemente under fursten Vladimir Andrejevitj och Dmitrij Bobrok föll tatarerna i flanken och slog dem på flykten. Dmitrij hittades sårad bland de döda. Krönikörerna skrev om hundratusentals män; nutida uppskattningar varierar från några tusen till flera tiotusentals. Jogaila vände om, och Mamaj, som kort därefter besegrades av Tochtamysj, dödades i Kaffa på Krim. Dmitrij blev känd som Donskoj, ”från Don”.
