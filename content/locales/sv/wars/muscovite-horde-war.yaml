Moscow against the Horde, 1378–1382: Moskva mot horden 1378–1382
The war between Grand Prince Dmitry of Moscow and the Golden Horde during its civil war. Dmitry beat Mamai’s armies on the Vozha in 1378 and at Kulikovo in 1380, but in 1382 Khan Tokhtamysh, who had reunited the Horde, burned Moscow and forced Dmitry to pay tribute again.: Kriget mellan storfurst Dmitrij av Moskva och Gyllene horden under dess inbördeskrig. Dmitrij besegrade Mamajs härar vid Vozja 1378 och vid Kulikovo 1380, men 1382 brände khan Tochtamysj, som hade återförenat horden, Moskva och tvingade Dmitrij att åter betala tribut.
