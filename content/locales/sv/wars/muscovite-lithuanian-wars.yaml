Muscovite–Lithuanian Wars, 1492–1537: Moskovitisk-litauiska krigen 1492–1537
A series of wars in which the Grand Duchy of Moscow, claiming the lands of the old Kievan Rus’, took a large part of eastern Lithuania. The peace of 1494 and the truce of 1503 cost Lithuania Vyazma, Chernihiv and Siveria, and Smolensk fell in 1514 despite the Polish–Lithuanian victory at Orsha; a last war in 1534–1537 changed little.: En rad krig där storfurstendömet Moskva, som gjorde anspråk på det gamla Kievrikets länder, tog en stor del av östra Litauen. Genom freden 1494 och stilleståndet 1503 förlorade Litauen Vjazma, Tjernihiv och Severien, och Smolensk föll 1514 trots den polsk-litauiska segern vid Orsja; ett sista krig 1534–1537 förändrade lite.
