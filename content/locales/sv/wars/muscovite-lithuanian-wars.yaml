Dates are Julian (Old Style), as the sources give them.: Datumen anges enligt den julianska kalendern (gamla stilen), så som källorna anger dem.
Lithuania and Poland were separate states under one dynasty; Polish troops fought in strength only from 1514. Moscow was often allied with the Crimean Khanate, and Lithuania at times with the Livonian Order.: Litauen och Polen var separata stater under en och samma dynasti; polska trupper deltog i större antal först från 1514. Moskva var ofta allierat med Krimkhanatet, och Litauen ibland med Livländska orden.
The wars are usually counted as five, in 1487–1494, 1500–1503, 1507–1508, 1512–1522 and 1534–1537. Only the two that changed the border most are told here.: "Krigen räknas vanligen som fem: 1487–1494, 1500–1503, 1507–1508, 1512–1522 och 1534–1537. Endast de två som förändrade gränsen mest berättas här."
