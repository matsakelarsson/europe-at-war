Ivan’s son Vasily III renewed the war in December 1512, aiming at Smolensk, the great fortress on the upper Dnieper. Sieges in 1513 failed, but a third, with heavy artillery, forced the town to surrender on 30 July 1514. Muscovite forces pushed on towards Orsha and Mstsislaw. King Sigismund I raised an army of about 35,000, more than half of them Poles, and gave the field command to Konstanty Ostrogski, who had escaped from Muscovite captivity.: Ivans son Vasilij III återupptog kriget i december 1512 med sikte på Smolensk, den stora fästningen vid övre Dnepr. Belägringarna 1513 misslyckades, men en tredje, med tungt artilleri, tvingade staden att kapitulera den 30 juli 1514. Moskovitiska styrkor ryckte vidare mot Orsja och Mstsislaw. Kung Sigismund I samlade en här på omkring 35 000 man, mer än hälften av dem polacker, och gav fältbefälet åt Konstanty Ostrogski, som hade flytt ur moskovitisk fångenskap.
On 8 September 1514 Ostrogski crossed the Dnieper near Orsha on pontoon bridges and routed the Muscovite army, whose commander Ivan Chelyadnin was captured. Sigismund celebrated the victory across Europe, but his army could not retake Smolensk. The war dragged on in raids until a truce in 1522 left Smolensk with Moscow, which kept it until 1611. A further war in 1534–1537 ended with Lithuania regaining Homel and Moscow keeping Sebezh.: Den 8 september 1514 gick Ostrogski över Dnepr nära Orsja på pontonbroar och slog den moskovitiska hären på flykten; dess befälhavare Ivan Tjeljadnin tillfångatogs. Sigismund firade segern över hela Europa, men hans här kunde inte återta Smolensk. Kriget drog ut i räder tills ett stillestånd 1522 lät Smolensk stanna hos Moskva, som behöll staden till 1611. Ett ytterligare krig 1534–1537 slutade med att Litauen återvann Homel och Moskva behöll Sebezj.
