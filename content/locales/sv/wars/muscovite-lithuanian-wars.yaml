Ivan III of Moscow called himself sovereign of all Russia and claimed the lands of the old Kievan Rus’, many of them ruled by Lithuania. A first border war in 1492–1494 cost Lithuania Vyazma and towns on the upper Oka. In May 1500, citing the treatment of the Orthodox in Lithuania, Ivan attacked again, and several Orthodox border princes went over to him. Bryansk, Dorogobuzh, Putyvl and other towns fell quickly. On 14 July 1500 his army crushed a Lithuanian force on the Vedrosha river near Dorogobuzh and captured its commander, Grand Hetman Konstanty Ostrogski.: Ivan III av Moskva kallade sig härskare över hela Ryssland och gjorde anspråk på det gamla Kievrikets länder, av vilka många styrdes av Litauen. Ett första gränskrig 1492–1494 kostade Litauen Vjazma och städer vid övre Oka. I maj 1500 anföll Ivan igen med hänvisning till behandlingen av de ortodoxa i Litauen, och flera ortodoxa gränsfurstar gick över till honom. Brjansk, Dorogobuzj, Putyvl och andra städer föll snabbt. Den 14 juli 1500 krossade hans här en litauisk styrka vid floden Vedrosja nära Dorogobuzj och tillfångatog dess befälhavare, storhetmanen Konstanty Ostrogski.
Lithuania was beaten again at Mstsislaw in 1501. The Livonian Order came in on its side and won on the Seritsa in August 1501, and a Muscovite siege of Smolensk in 1502 failed. A six-year truce was agreed on 25 March 1503, the feast of the Annunciation. Moscow kept Chernihiv, Novhorod-Siverskyi, Starodub, Bryansk and the upper Oka lands, by some estimates about a third of the Grand Duchy.: Litauen besegrades på nytt vid Mstsislaw 1501. Livländska orden gick in i kriget på dess sida och segrade vid Seritsa i augusti 1501, och en moskovitisk belägring av Smolensk 1502 misslyckades. Ett sexårigt stillestånd slöts den 25 mars 1503, Marie bebådelsedag. Moskva behöll Tjernihiv, Novhorod-Siverskyj, Starodub, Brjansk och länderna vid övre Oka, enligt vissa uppskattningar omkring en tredjedel av storfurstendömet.
