Surrounded since November, the city accepted Ivan’s rule without a battle. Its republic, which had lasted for more than three centuries, was ended.: Staden, omringad sedan november, godtog Ivans styre utan strid. Dess republik, som hade bestått i mer än tre sekler, var till ända.
