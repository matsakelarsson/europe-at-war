Muscovite–Novgorodian War: Moskovitisk-novgorodska kriget
The war in which Ivan III of Moscow ended the independence of the Novgorod Republic. After Novgorod turned to Lithuania for support, Ivan’s army routed the Novgorodians on the Shelon in 1471, and in January 1478 a second campaign forced the city to surrender; its assembly was abolished and its vast northern lands passed to Moscow.: Kriget där Ivan III av Moskva gjorde slut på republiken Novgorods självständighet. Sedan Novgorod vänt sig till Litauen för att få stöd slog Ivans här novgorodborna på flykt vid floden Sjelon 1471, och i januari 1478 tvingade ett andra fälttåg staden att kapitulera. Dess folkförsamling avskaffades och dess vidsträckta nordliga länder övergick till Moskva.
