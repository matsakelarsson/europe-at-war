Dates are Julian (Old Style). Most of the chronicles were written or revised in Moscow after the conquest and are hostile to Novgorod; the Moscow account claims a Novgorodian army of 40,000 at the Shelon and 12,000 dead, figures historians consider exaggerated.: Datumen anges enligt den julianska kalendern (gamla stilen). De flesta krönikorna skrevs eller omarbetades i Moskva efter erövringen och är fientliga mot Novgorod; den moskovitiska skildringen uppger en novgorodsk här på 40 000 man vid Sjelon och 12 000 döda, siffror som historiker anser överdrivna.
Novgorod, called “Lord Novgorod the Great”, was governed by its assembly, the veche, its archbishop and its boyars. Its princes, by then the grand princes of Moscow, were bound by treaty and had limited powers.: Novgorod, kallat ”Herr Novgorod den store”, styrdes av sin folkförsamling, vetjet, sin ärkebiskop och sina bojarer. Dess furstar, vid denna tid storfurstarna av Moskva, var bundna av fördrag och hade begränsade befogenheter.
