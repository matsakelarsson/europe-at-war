Novgorod, the great trading republic of the north, accepted the grand princes of Moscow as its princes but ran its own affairs. After Vasily II imposed the Treaty of Yazhelbitsy on it in 1456, a party led by the Boretsky family and the widow Marfa Boretskaya looked to Lithuania for protection. In 1470 Novgorod invited the Lithuanian prince Mikhailo Olelkovich, and a treaty was drafted placing the city under King Casimir IV, who probably never ratified it. Ivan III called this treason and apostasy from Orthodoxy, and in May 1471 he went to war, joined by Pskov and Tver.: Novgorod, Nordens stora handelsrepublik, godtog storfurstarna av Moskva som sina furstar men skötte sina egna angelägenheter. Sedan Vasilij II påtvingat staden fördraget i Jazjelbitsy 1456 sökte ett parti under ledning av familjen Boretskij och änkan Marfa Boretskaja skydd hos Litauen. 1470 bjöd Novgorod in den litauiske fursten Michailo Olelkovitj, och ett fördrag utarbetades som ställde staden under kung Kasimir IV, som troligen aldrig ratificerade det. Ivan III kallade detta förräderi och avfall från ortodoxin, och i maj 1471 gick han i krig, med Pskov och Tver vid sin sida.
Muscovite armies converged on Novgorod from several sides. Prince Daniil Kholmsky’s vanguard burned Staraya Russa and on 14 July met the Novgorodian army on the Shelon river, west of Lake Ilmen. The Novgorodians, at least 10,000 men and many of them untrained townsmen, outnumbered Kholmsky’s 4,000–5,000, but a charge by Tatar horsemen from Kasimov broke them and they were pursued for miles. Their commander, Dmitry Boretsky, was captured and beheaded on Ivan’s orders. Another Muscovite force won on the Shilenga in the Dvina land. By the Treaty of Korostyn in August, Novgorod gave up Lithuania and recognised itself as Ivan’s patrimony.: Moskovitiska härar drog samman mot Novgorod från flera håll. Fursten Daniil Cholmskijs förtrupp brände Staraja Russa och mötte den 14 juli den novgorodska hären vid floden Sjelon, väster om Ilmensjön. Novgorodborna, minst 10 000 man och många av dem oövade stadsbor, var fler än Cholmskijs 4 000–5 000, men ett anfall av tatariska ryttare från Kasimov bröt dem och de förföljdes i flera mil. Deras befälhavare, Dmitrij Boretskij, tillfångatogs och halshöggs på Ivans order. En annan moskovitisk styrka segrade vid Sjilenga i Dvinalandet. Genom fördraget i Korostyn i augusti avstod Novgorod från Litauen och erkände sig som Ivans arvegods.
