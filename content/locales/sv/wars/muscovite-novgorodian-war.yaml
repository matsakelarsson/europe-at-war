The salt-making town south of Lake Ilmen was burned by Kholmsky’s vanguard. Ivan III later made his headquarters here.: Saltsjuderistaden söder om Ilmensjön brändes av Cholmskijs förtrupp. Ivan III förlade senare sitt högkvarter hit.
14 July 1471: 14 juli 1471
The Muscovites crossed the Shelon and the Dryan and routed the larger Novgorodian army. Some 1,700–2,000 Novgorodians were taken prisoner.: Moskoviterna gick över Sjelon och Drjan och slog den större novgorodska hären på flykten. Omkring 1 700–2 000 novgorodbor togs till fånga.
Signed in Ivan’s camp on the south shore of Lake Ilmen. Novgorod kept its institutions but renounced any tie with Lithuania and paid an indemnity.: Undertecknat i Ivans läger på Ilmensjöns södra strand. Novgorod behöll sina institutioner men avsade sig varje band med Litauen och betalade ett krigsskadestånd.
Kholmsky: Cholmskij
Pskovians: Pskovbor
Moscow’s hold tightened. In 1475 Ivan came to Novgorod to hear lawsuits and had leading boyars of the anti-Muscovite party arrested and sent to Moscow. In 1477 two envoys from Novgorod addressed him as gosudar, “sovereign”, instead of the customary “lord”. Novgorod said they had no authority to do so, but Ivan took them at their word and demanded the powers the title implied. When the veche refused, he set out with a large army in October 1477, accusing the city of breaking its oath.: Moskvas grepp hårdnade. 1475 kom Ivan till Novgorod för att döma i rättstvister och lät gripa ledande bojarer i det antimoskovitiska partiet och skicka dem till Moskva. 1477 tilltalade två sändebud från Novgorod honom som gosudar, ”härskare”, i stället för det brukliga ”herre”. Novgorod hävdade att de saknat befogenhet att göra det, men Ivan tog dem på orden och krävde de maktbefogenheter som titeln innebar. När vetjet vägrade drog han ut med en stor här i oktober 1477 och anklagade staden för att ha brutit sin ed.
By late November Ivan’s troops surrounded Novgorod and cut off its supplies. Divided and short of food, the city did not fight, and on 15 January 1478 it submitted to his terms. The veche was abolished, its bell was taken down and carried to Moscow, and Ivan’s governors replaced the elected officials. Marfa Boretskaya was arrested and her lands taken, and in the 1480s thousands of boyars, merchants and landowners were deported to central Russia, their estates given to Ivan’s servitors. Novgorod’s lands, stretching to the White Sea and the Urals, became part of the Muscovite state.: I slutet av november omringade Ivans trupper Novgorod och skar av dess försörjning. Splittrad och med ont om livsmedel gjorde staden inget motstånd, och den 15 januari 1478 underkastade den sig hans villkor. Vetjet avskaffades, dess klocka togs ned och fördes till Moskva, och Ivans ståthållare ersatte de valda ämbetsmännen. Marfa Boretskaja greps och hennes gods drogs in, och på 1480-talet deporterades tusentals bojarer, köpmän och godsägare till centrala Ryssland och deras gods gavs åt Ivans tjänstemän. Novgorods länder, som sträckte sig till Vita havet och Ural, blev en del av den moskovitiska staten.
