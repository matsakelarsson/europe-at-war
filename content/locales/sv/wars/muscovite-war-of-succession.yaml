Also called the Muscovite Civil War. Dates are Julian (Old Style), as in the Russian chronicles.: Kallas också det moskovitiska inbördeskriget. Datumen anges enligt den julianska kalendern (gamla stilen), som i de ryska krönikorna.
Both sides sought the backing of the khans. The capture of Vasily II by the Tatars of Ulugh Muhammad at Suzdal in 1445, which weakened him before Shemyaka’s coup, is told under the Russo-Kazan Wars.: Båda sidor sökte khanernas stöd. Ulugh Muhammads tatarers tillfångatagande av Vasilij II vid Suzdal 1445, som försvagade honom före Sjemjakas kupp, berättas under Rysk-kazanska krigen.
