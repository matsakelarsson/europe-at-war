Muscovite War of Succession: Moskovitiska tronföljdskriget
A civil war in the grand principality of Moscow between Vasily II and his uncle, Yury of Zvenigorod and Galich, and then Yury’s sons Vasily Kosoy and Dmitry Shemyaka, who claimed the throne under the older custom of succession from brother to brother. Moscow changed hands several times, and both sides blinded captured rivals, Vasily II himself in 1446. Vasily regained his throne in 1447, and after Shemyaka was poisoned in Novgorod in 1453 succession from father to son was secure.: Ett inbördeskrig i storfurstendömet Moskva mellan Vasilij II och hans farbror Jurij av Zvenigorod och Galitj, och sedan Jurijs söner Vasilij Kosoj och Dmitrij Sjemjaka, som gjorde anspråk på tronen enligt den äldre sedvänjan med tronföljd från bror till bror. Moskva bytte härskare flera gånger, och båda sidor bländade tillfångatagna rivaler, däribland Vasilij II själv 1446. Vasilij återtog sin tron 1447, och sedan Sjemjaka förgiftats i Novgorod 1453 var tronföljden från far till son säkrad.
