Muslim conquest of Sicily: Muslimernas erövring av Sicilien
The conquest of Byzantine Sicily by the Aghlabid emirs of Ifriqiya (Tunisia), who landed at Mazara in 827 to help a rebel Byzantine admiral. Palermo fell in 831, Enna in 859, Syracuse in 878 and Taormina in 902; from Sicily, Muslim raiders also held Bari as an emirate from about 847 to 871 and sacked the churches outside the walls of Rome in 846.: Erövringen av det bysantinska Sicilien av aghlabidiska emirer från Ifriqiya (Tunisien), som landsteg vid Mazara 827 för att hjälpa en upprorisk bysantinsk amiral. Palermo föll 831, Enna 859, Syrakusa 878 och Taormina 902. Från Sicilien höll muslimska plundrare också Bari som ett emirat från omkring 847 till 871, och 846 plundrade de kyrkorna utanför Roms murar.
