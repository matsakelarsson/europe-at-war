Asad’s army landed here after three days at sea from the Bay of Sousse and beat the Byzantine governor’s forces on the plain to the south-east.: Asads här landsteg här efter tre dagar till sjöss från Soussebukten och besegrade den bysantinske guvernörens styrkor på slätten i sydost.
Syracuse: Syrakusa
The Byzantine capital of the island held out until disease broke out in the besiegers’ camp, killing Asad, and a relief fleet came.: Öns bysantinska huvudstad höll ut tills en sjukdom bröt ut i belägrarnas läger och dödade Asad, och en undsättningsflotta kom.
Mineo: Mineo
The retreating Muslims took the hill town after three days. Blockaded there in 829, they were reduced to eating their horses until Andalusian raiders relieved them in 830.: De retirerande muslimerna intog bergsstaden efter tre dagar. Blockerade där 829 tvingades de äta sina hästar tills andalusiska plundrare undsatte dem 830.
