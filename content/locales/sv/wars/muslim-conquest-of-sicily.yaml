The garrison of the great inland fortress offered to recognise Euphemius, and killed him when he came out to meet its envoys.: Garnisonen i den stora fästningen i inlandet erbjöd sig att erkänna Eufemios och dödade honom när han kom ut för att möta dess sändebud.
