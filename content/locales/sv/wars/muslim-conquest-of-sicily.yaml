Galleys of Naples, Amalfi and Gaeta under Caesarius, son of the duke of Naples, met a new raiding fleet, which a storm then scattered. Prisoners were put to work on the Leonine Wall.: Galärer från Neapel, Amalfi och Gaeta under Caesarius, son till hertigen av Neapel, mötte en ny plundringsflotta, som sedan skingrades av en storm. Fångarna sattes i arbete på den leoninska muren.
Bari: Bari
Taken from the Byzantines by the Berber commander Khalfun in about 847, Bari was the seat of the only Muslim state on the Italian mainland. Louis II took its citadel in February 871.: Bari, som berberbefälhavaren Khalfun tog från bysantinerna omkring 847, var säte för den enda muslimska staten på det italienska fastlandet. Ludvig II intog dess citadell i februari 871.
Raid, 846: Räd, 846
Louis II: Ludvig II
A fleet from Sicily took Malta on 29 August 870, plundering its capital and razing the walls, and Byzantine Sicily was cut off. After Louis II’s death in 875 the Byzantines took over Bari, and over the next years they won back much of southern Italy. In Sicily the energetic emir Ibrahim II sent a new governor to finish the war. Syracuse was besieged from 877 with siege engines, received little help from Constantinople, and was stormed on 21 May 878 after nine months. Its people were killed or enslaved, and the city was looted for two months.: En flotta från Sicilien intog Malta den 29 augusti 870, plundrade dess huvudstad och rev murarna, och det bysantinska Sicilien blev avskuret. Efter Ludvig II:s död 875 tog bysantinerna över Bari, och under de följande åren återvann de stora delar av södra Italien. På Sicilien sände den energiske emiren Ibrahim II en ny guvernör för att avsluta kriget. Syrakusa belägrades från 877 med belägringsmaskiner, fick föga hjälp från Konstantinopel och stormades den 21 maj 878 efter nio månader. Invånarna dödades eller förslavades, och staden plundrades i två månader.
The conquest then stalled. Taormina beat off attack after attack, and from 886 the Muslims of Sicily fought among themselves, Palermo against Agrigento and against the governors from Africa, until Ibrahim’s son Abu’l-Abbas Abdallah took Palermo in 900 and sacked Reggio across the strait in 901. In 902 Ibrahim, forced to abdicate, came to Sicily himself as a volunteer for the holy war. Taormina fell on 1 August. He crossed into Calabria and died of dysentery while besieging Cosenza on 24 October. A few forts in the north-east held out; the last, Rometta, fell only in 965.: Erövringen avstannade sedan. Taormina slog tillbaka anfall efter anfall, och från 886 stred Siciliens muslimer sinsemellan, Palermo mot Agrigento och mot guvernörerna från Afrika, tills Ibrahims son Abu’l-Abbas Abdallah intog Palermo 900 och plundrade Reggio på andra sidan sundet 901. 902 kom Ibrahim, som tvingats abdikera, själv till Sicilien som frivillig i det heliga kriget. Taormina föll den 1 augusti. Han gick över till Kalabrien och dog i dysenteri under belägringen av Cosenza den 24 oktober. Några fästen i nordost höll ut; det sista, Rometta, föll först 965.
