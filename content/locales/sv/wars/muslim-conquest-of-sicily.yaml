To Syracuse: Mot Syrakusa
With Neapolitan help the Muslims took Messina in 842 or 843, and in 845 they crushed a Byzantine army near Butera. Bands from Sicily had also crossed to the mainland as mercenaries in the civil war that split the Lombard principality of Benevento, and stayed to take Taranto in 840 and Bari in about 847. Bari became an emirate, recognised by the Abbasid caliph, whose raiders ranged across southern Italy. In August 846 a raiding fleet landed at Ostia and Portus and sacked St Peter’s and St Paul’s, which lay outside the walls of Rome; the city itself held. Pope Leo IV walled in the Vatican, and in 849 a fleet from Naples, Amalfi and Gaeta beat another raid off Ostia.: Med neapolitansk hjälp intog muslimerna Messina 842 eller 843, och 845 krossade de en bysantinsk här nära Butera. Band från Sicilien hade också gått över till fastlandet som legosoldater i det inbördeskrig som splittrade det langobardiska furstendömet Benevento, och stannade kvar och intog Taranto 840 och Bari omkring 847. Bari blev ett emirat, erkänt av den abbasidiske kalifen, vars plundrare drog fram över hela södra Italien. I augusti 846 landsteg en plundringsflotta vid Ostia och Portus och plundrade Peterskyrkan och Paulskyrkan, som låg utanför Roms murar; själva staden höll stånd. Påve Leo IV lät mura in Vatikanen, och 849 besegrade en flotta från Neapel, Amalfi och Gaeta en ny räd utanför Ostia.
In Sicily the war was a slow round of raids and sieges. In January 859 the Muslims took Enna, the Byzantines’ main stronghold in the interior, with the help of a prisoner who showed them a way in, and slaughtered its defenders. Byzantine Sicily shrank to the east coast between Syracuse and Taormina. On the mainland the Carolingian emperor Louis II, king of Italy, besieged Bari from 867 with Frankish, Lombard and Slav troops, and in February 871 its citadel fell. Its last emir, Sawdan, was led away in chains to Benevento.: På Sicilien var kriget ett långsamt kretslopp av räder och belägringar. I januari 859 intog muslimerna Enna, bysantinernas viktigaste fäste i inlandet, med hjälp av en fånge som visade dem en väg in, och slaktade dess försvarare. Det bysantinska Sicilien krympte till östkusten mellan Syrakusa och Taormina. På fastlandet belägrade den karolingiske kejsaren Ludvig II, kung av Italien, Bari från 867 med frankiska, langobardiska och slaviska trupper, och i februari 871 föll dess citadell. Dess siste emir, Sawdan, fördes bort i bojor till Benevento.
