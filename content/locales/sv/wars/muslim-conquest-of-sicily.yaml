The conquest was slow and piecemeal. Apart from a few sieges, the war was mostly raids on Byzantine strongholds and the countryside around them, for plunder, tribute and captives. Many dates come from Arab chronicles written centuries later and are approximate.: Erövringen gick långsamt och skedde bit för bit. Bortsett från några belägringar bestod kriget mest av räder mot bysantinska fästen och landsbygden kring dem, för att ta byte, tribut och fångar. Många datum kommer från arabiska krönikor som skrevs sekler senare och är ungefärliga.
The Aghlabids ruled Ifriqiya in the name of the Abbasid caliphs. In 909 Sicily passed with Ifriqiya to the Fatimids, under whom (from the 950s through the Kalbid governors) the island became a largely independent emirate.: Aghlabiderna styrde Ifriqiya i de abbasidiska kalifernas namn. 909 övergick Sicilien tillsammans med Ifriqiya till fatimiderna, under vilka ön (från 950-talet genom de kalbidiska guvernörerna) blev ett i stort sett självständigt emirat.
The Muslim states on the mainland, at Bari and Taranto and later on the Garigliano, often grew out of mercenary bands hired by the Lombard princes and the duchy of Naples in their own wars.: De muslimska staterna på fastlandet, i Bari och Taranto och senare vid Garigliano, växte ofta fram ur legosoldatband som de langobardiska furstarna och hertigdömet Neapel hade lejt för sina egna krig.
