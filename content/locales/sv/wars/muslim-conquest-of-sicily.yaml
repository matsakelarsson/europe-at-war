A Byzantine army reinforced from Asia Minor was routed, reportedly losing some 10,000 men.: En bysantinsk här, förstärkt från Mindre Asien, slogs på flykten och förlorade enligt uppgift omkring 10 000 man.
The hitherto impregnable mountain fortress fell to the governor al-Abbas ibn al-Fadl. The Muslims refortified it and settled it as their base for the east.: Den dittills ointagliga bergsfästningen föll för guvernören al-Abbas ibn al-Fadl. Muslimerna befäste den på nytt och bosatte sig där som sin bas för öster.
