Raiders plundered the basilicas of St Peter and St Paul outside the walls. In reply Leo IV built the Leonine Wall around the Vatican hill.: Plundringsstyrkan härjade Peters- och Paulsbasilikorna utanför murarna. Som svar byggde Leo IV den leoninska muren kring Vatikankullen.
