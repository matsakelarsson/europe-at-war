In 826 Euphemius, commander of the Byzantine fleet in Sicily, rebelled against Emperor Michael II, took Syracuse and had himself proclaimed emperor. Driven out by loyalist officers, he sailed to Ifriqiya and offered the Aghlabid emir Ziyadat Allah a yearly tribute for an army to win the island for him. The emir’s council was divided, but the elderly judge of Kairouan, Asad ibn al-Furat, argued for a holy war and was given command. In June 827 his fleet, carrying about 10,000 foot soldiers and 700 horsemen, sailed from Sousse and landed at Mazara.: 826 gjorde Eufemios, befälhavare för den bysantinska flottan på Sicilien, uppror mot kejsar Mikael II, intog Syrakusa och lät utropa sig till kejsare. Fördriven av lojala officerare seglade han till Ifriqiya och erbjöd den aghlabidiske emiren Ziyadat Allah en årlig tribut i utbyte mot en här som skulle vinna ön åt honom. Emirens råd var splittrat, men den åldrade domaren i Kairouan, Asad ibn al-Furat, förordade ett heligt krig och fick befälet. I juni 827 seglade hans flotta, med omkring 10 000 fotsoldater och 700 ryttare, från Sousse och landsteg vid Mazara.
Asad beat the Byzantine governor in the field and besieged Syracuse, but in the spring of 828 disease swept the camp and killed him, and a Byzantine fleet arrived. The Muslims burned their ships and retreated inland to Mineo. Euphemius, who had stayed with them, was murdered outside Enna while negotiating with its garrison. In 829 a new Byzantine army nearly drove the invaders out, until a raiding fleet from al-Andalus joined them in 830. Palermo, besieged for a year, surrendered in September 831; it became the capital of a new Aghlabid province, and western Sicily soon followed.: Asad besegrade den bysantinske guvernören i fält och belägrade Syrakusa, men våren 828 svepte en sjukdom genom lägret och dödade honom, och en bysantinsk flotta anlände. Muslimerna brände sina skepp och drog sig tillbaka inåt landet till Mineo. Eufemios, som hade stannat hos dem, mördades utanför Enna när han förhandlade med dess garnison. 829 drev en ny bysantinsk här nästan ut inkräktarna, tills en plundringsflotta från al-Andalus förenade sig med dem 830. Palermo, belägrat i ett år, kapitulerade i september 831; staden blev huvudstad i en ny aghlabidisk provins, och västra Sicilien följde snart efter.
