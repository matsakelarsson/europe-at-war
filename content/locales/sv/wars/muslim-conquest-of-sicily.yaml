The city surrendered after a year’s siege in return for safe passage for its commander and officials. An Arab chronicler says that only 3,000 of its 70,000 people were left, probably an exaggeration.: Staden kapitulerade efter ett års belägring mot fri lejd för dess befälhavare och ämbetsmän. En arabisk krönikör uppger att bara 3 000 av dess 70 000 invånare fanns kvar, troligen en överdrift.
