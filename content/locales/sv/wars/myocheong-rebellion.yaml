# Svenska översättningar av katalogtexten (våg 10); stegtexterna kommer senare.
Myocheong’s rebellion: Myocheongs uppror
? A rising at the Western Capital, Seogyeong (Pyongyang), led by the Buddhist monk Myocheong. After the palace fire of 1126 and Goryeo’s submission to the Jin, Myocheong and his allies, the officials Jeong Ji-sang and Baek Su-han, urged King Injong to move the capital to Seogyeong, which they said had better geomantic power, to call himself emperor and to attack the Jin. A new palace, Daehwagung, was built there in 1128–1129, but officials of the capital, Kaegyong, led by Kim Bu-sik, opposed the move, and the king held back. In the first month of 1135 Myocheong and his supporters seized Seogyeong, proclaimed a state called Daewi with the era name Cheongae, and called their army the “heaven-sent loyal and righteous army”. The court made Kim Bu-sik commander and had Jeong Ji-sang and others killed in Kaegyong. Within weeks Jo Gwang, one of the rebel leaders, killed Myocheong and sent his head to the court hoping for pardon, but when the court would not pardon him he fought on. Kim Bu-sik besieged the city for more than a year, and Seogyeong fell in the second month of 1136. The defeat ended the Western Capital faction, and Kim Bu-sik went on to compile the Samguk sagi.
: En resning i Västra huvudstaden, Seogyeong (Pyongyang), ledd av den buddhistiske munken Myocheong. Efter palatsbranden 1126 och Goryeos underkastelse under Jin uppmanade Myocheong och hans bundsförvanter, ämbetsmännen Jeong Ji-sang och Baek Su-han, kung Injong att flytta huvudstaden till Seogyeong, som enligt dem hade gynnsammare geomantisk kraft, att kalla sig kejsare och att angripa Jin. Ett nytt palats, Daehwagung, byggdes där 1128–1129, men ämbetsmännen i huvudstaden Kaegyong, ledda av Kim Bu-sik, motsatte sig flytten, och kungen tvekade. I första månaden 1135 tog Myocheong och hans anhängare makten i Seogyeong, utropade en stat kallad Daewi med eranamnet Cheongae och kallade sin armé ”den av himlen sända lojala och rättfärdiga armén”. Hovet utnämnde Kim Bu-sik till befälhavare och lät döda Jeong Ji-sang och andra i Kaegyong. Inom några veckor dödade Jo Gwang, en av rebelledarna, Myocheong och sände hans huvud till hovet i hopp om nåd, men när hovet inte ville benåda honom fortsatte han striden. Kim Bu-sik belägrade staden i mer än ett år, och Seogyeong föll i andra månaden 1136. Nederlaget gjorde slut på fraktionen kring Västra huvudstaden, och Kim Bu-sik sammanställde sedan Samguk sagi.
