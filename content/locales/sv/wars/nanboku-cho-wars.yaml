# Svenska översättningar av katalogtexten (våg 10); stegtexterna kommer senare.
Nanboku-chō wars: Nanboku-chō-krigen
? "The civil wars of the Northern and Southern Courts, in which the Ashikaga shogunate and the emperors it set up in Kyoto fought the line of Emperor Go-Daigo, which kept its court in the mountains of Yoshino, for more than half a century. Ashikaga Takauji, who had helped Go-Daigo overthrow the Kamakura shogunate in 1333, broke with him in 1335. Driven to Kyushu early in 1336, he returned with a new army, destroyed Kusunoki Masashige at Minatogawa on 4 July 1336, took Kyoto and put Kōmyō of the rival imperial line on the throne. Go-Daigo escaped to Yoshino in January 1337 and proclaimed himself the true emperor. His generals Kitabatake Akiie and Nitta Yoshisada were killed in 1338, the year Takauji became shōgun, and Go-Daigo died in 1339, but the Southern Court survived, aided by the quarrel between Takauji and his brother Tadayoshi in the Kannō disturbance of 1350–1352, when both brothers allied with the South in turn and southern armies took Kyoto four times. In Kyushu, Go-Daigo’s son Prince Kaneyoshi and the Kikuchi family defeated the shogunate’s supporters on the Chikugo River in 1359 and ruled most of the island until Imagawa Sadayo retook the Dazaifu in 1372. The third shōgun, Ashikaga Yoshimitsu, ended the war by negotiation: on 19 November 1392 the southern emperor Go-Kameyama returned to Kyoto and handed the regalia to the northern emperor Go-Komatsu."
: "Inbördeskrigen mellan Norra och Södra hovet, där Ashikagashogunatet och de kejsare det insatte i Kyoto i mer än ett halvt sekel bekämpade kejsar Go-Daigos linje, som hade sitt hov i bergen vid Yoshino. Ashikaga Takauji, som 1333 hade hjälpt Go-Daigo att störta Kamakurashogunatet, bröt med honom 1335. Han drevs till Kyushu i början av 1336 men återvände med en ny armé, förintade Kusunoki Masashige vid Minatogawa den 4 juli 1336, intog Kyoto och satte Kōmyō från den rivaliserande kejserliga linjen på tronen. Go-Daigo flydde till Yoshino i januari 1337 och utropade sig till den rättmätige kejsaren. Hans generaler Kitabatake Akiie och Nitta Yoshisada dödades 1338, samma år som Takauji blev shōgun, och Go-Daigo dog 1339, men Södra hovet överlevde, hjälpt av konflikten mellan Takauji och hans bror Tadayoshi i Kannōoroligheterna 1350–1352, då båda bröderna i tur och ordning allierade sig med Södra hovet och sydliga arméer intog Kyoto fyra gånger. På Kyushu besegrade Go-Daigos son prins Kaneyoshi och Kikuchisläkten shogunatets anhängare vid Chikugofloden 1359 och härskade över större delen av ön tills Imagawa Sadayo återtog Dazaifu 1372. Den tredje shōgunen, Ashikaga Yoshimitsu, avslutade kriget genom förhandlingar: den 19 november 1392 återvände den sydliga kejsaren Go-Kameyama till Kyoto och överlämnade de kejserliga regalierna till den nordliga kejsaren Go-Komatsu."
