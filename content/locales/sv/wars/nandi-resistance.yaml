Nandi resistance: Nandifolkets motstånd
? The Nandi of the highlands west of the Rift Valley in Kenya resisted British occupation for more than ten years. In July 1895 Nandi warriors destroyed the camp of the trader Peter West after quarrels with traders’ caravans, and British expeditions of several hundred African soldiers with Maxim guns in 1895 and 1897 burned villages and seized cattle without subduing them. When the Uganda Railway was built across their land towards Lake Victoria from 1899, the Nandi took its iron and telegraph wire, and attacked posts and travellers; a column sent in 1900 killed dozens of Nandi and seized their cattle, but the raids went on. Their leader was the orkoiyot (spiritual leader) Koitalel Arap Samoei. On 19 October 1905 the British officer Richard Meinertzhagen shot him dead at a meeting at Ket Parak, in the Nandi Hills, that had been called to negotiate a truce; Meinertzhagen claimed self-defence, but Nandi accounts and later historians describe a planned killing. A large expedition that followed, in the British term a punitive one, broke the resistance, and in 1906 the Nandi were confined to a reserve while much of their land was given to European settlers.
: Nandi i högländerna väster om Riftdalen i Kenya gjorde i mer än tio år motstånd mot den brittiska ockupationen. I juli 1895 förstörde nandikrigare handelsmannen Peter Wests läger efter gräl med handelsmännens karavaner, och brittiska expeditioner med flera hundra afrikanska soldater och Maximkulsprutor brände 1895 och 1897 byar och tog boskap utan att lyckas underkuva dem. När Ugandajärnvägen från 1899 byggdes genom deras land mot Victoriasjön tog nandi dess järn och telegraftråd och angrep poster och resande; en kolonn som sändes ut 1900 dödade dussintals nandi och tog deras boskap, men räderna fortsatte. Deras ledare var orkoiyoten (den andlige ledaren) Koitalel Arap Samoei. Den 19 oktober 1905 sköt den brittiske officeren Richard Meinertzhagen ihjäl honom vid ett möte i Ket Parak i Nandibergen, som hade sammankallats för att förhandla om en vapenvila; Meinertzhagen hävdade självförsvar, men nandifolkets berättelser och senare historiker beskriver ett planerat dödande. En stor expedition som följde, i britternas språkbruk en straffexpedition, bröt motståndet, och 1906 hänvisades nandi till ett reservat medan en stor del av deras land gavs till europeiska bosättare.
