# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
Naning War: Naningkriget
? A war between the British East India Company’s government at Malacca and Naning, a small Minangkabau district in Malacca’s hinterland ruled by its own penghulu (chief), Dol Said. Under Dutch rule Naning had paid Malacca a token tribute of 400 gantangs of rice a year. After the Anglo-Dutch Treaty of 1824 gave Malacca to Britain, Governor Robert Fullerton treated Naning as British territory, demanded a tenth of its produce and curbed the penghulu’s powers; Dol Said, who held that Naning had never been more than a tributary, refused to come to Malacca and was held to be defying the Company. On 6 August 1831 about 150 Indian sepoys under British officers, with six-pounder guns, marched from Malacca. Felled trees, sniping and supply boats stranded on the Malacca River halted them, Naning received men from Rembau and other neighbouring states, and on 24 August the column was back in Malacca, having left its guns and stores behind. Governor Robert Ibbetson then won Rembau over on 20 January 1832 by recognising it as independent, gathered about 1,500 troops with reinforcements from India, and sent a second expedition on 7 February 1832, joined by a Rembau contingent. It advanced slowly from post to post through abandoned villages, refused Dol Said’s offers to negotiate, and on 15 June 1832 reached his village of Taboh, which its defenders had already left. Dol Said surrendered on 4 February 1834 in return for a pardon and lived in Malacca on a pension until his death in 1849. Naning became a district of Malacca under British law. The cost of the war made the British wary of armed intervention in the Malay states for forty years; in Malaysia Dol Said is remembered as an early fighter against colonial rule.
: Ett krig mellan Brittiska ostindiska kompaniets styre i Malacka och Naning, ett litet minangkabaudistrikt i Malackas inland som styrdes av sin egen penghulu (hövding), Dol Said. Under det nederländska styret hade Naning betalat Malacka en symbolisk tribut på 400 gantang ris om året. Sedan det brittisk-nederländska fördraget 1824 hade gett Malacka till Storbritannien behandlade guvernör Robert Fullerton Naning som brittiskt territorium, krävde en tiondel av dess avkastning och inskränkte penghuluns befogenheter; Dol Said, som hävdade att Naning aldrig hade varit mer än tributpliktigt, vägrade komma till Malacka och ansågs trotsa kompaniet. Den 6 augusti 1831 marscherade omkring 150 indiska sepoyer under brittiska officerare, med sexpundiga kanoner, ut från Malacka. Fällda träd, prickskytte och förrådsbåtar som strandade på Malackafloden hejdade dem, Naning fick förstärkning från Rembau och andra grannstater, och den 24 augusti var kolonnen tillbaka i Malacka efter att ha lämnat sina kanoner och förråd efter sig. Guvernör Robert Ibbetson vann sedan över Rembau den 20 januari 1832 genom att erkänna dess självständighet, samlade omkring 1 500 soldater med förstärkningar från Indien och sände den 7 februari 1832 ut en andra expedition, som fick sällskap av en kontingent från Rembau. Den ryckte långsamt fram från post till post genom övergivna byar, avvisade Dol Saids erbjudanden om förhandlingar och nådde den 15 juni 1832 hans by Taboh, som försvararna redan hade lämnat. Dol Said gav upp den 4 februari 1834 mot att han benådades och levde på pension i Malacka till sin död 1849. Naning blev ett distrikt i Malacka under brittisk lag. Krigets kostnader gjorde britterna försiktiga med väpnade ingripanden i de malajiska staterna under fyrtio år; i Malaysia minns man Dol Said som en tidig kämpe mot kolonialstyret.
