# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
Nanzhao’s raids on the Pyu: Nanzhaos räder mot pyufolket
? "Raids by Nanzhao, the kingdom of the Erhai lake in Yunnan, on the Pyu city-states of the Irrawaddy valley in today’s Myanmar. Nanzhao armies had raided Upper Burma since the 750s or 760s, and the Pyu had sent embassies with musicians to the Tang court in 800–802. According to the Manshu, written by the Tang official Fan Chuo in the 860s, Nanzhao plundered the Pyu kingdom (Biao) in the sixth year of the Dahe reign, about 832, and carried off more than 3,000 people, who were settled at Tuodong (Kunming) and made to support themselves. The raid is usually linked to Halin (Hanlin), the great walled Pyu city near Shwebo, though the Chinese text does not name the town; radiocarbon dates show that people went on living at Halin until about 870. In 835, the Manshu says, Nanzhao defeated the kingdoms of Mi-chen and Mi-nuo, took gold and silver and sent two to three thousand prisoners to Lishui to pan for gold; whether these were Pyu states is disputed. Historians no longer see the raids as the sudden end of the Pyu: there is no sign of a violent overthrow at Sri Ksetra, the largest Pyu city, but the raids weakened the city-states while Burman settlers moved into the dry zone. By the eleventh century Pagan had taken their place. Halin, Beikthano and Sri Ksetra were inscribed together as the Pyu Ancient Cities on the UNESCO World Heritage List in 2014."
: "Räder som Nanzhao, riket vid Erhaisjön i Yunnan, gjorde mot pyufolkets stadsstater i Irrawaddydalen i dagens Myanmar. Nanzhaos arméer hade gjort räder i Övre Burma sedan 750- eller 760-talet, och pyufolket hade 800–802 sänt beskickningar med musiker till Tanghovet. Enligt Manshu, som Tangämbetsmannen Fan Chuo skrev på 860-talet, plundrade Nanzhao pyuriket (Biao) under det sjätte året av regeringsperioden Dahe, omkring 832, och förde bort mer än 3 000 människor, som bosattes i Tuodong (Kunming) och fick försörja sig själva. Räden brukar förknippas med Halin (Hanlin), den stora muromgärdade pyustaden nära Shwebo, även om den kinesiska texten inte nämner staden vid namn; kol 14-dateringar visar att människor fortsatte att bo i Halin till omkring 870. År 835, berättar Manshu, besegrade Nanzhao rikena Mi-chen och Mi-nuo, tog guld och silver och sände två till tre tusen fångar till Lishui för att vaska guld; om dessa var pyustater är omstritt. Historikerna ser inte längre räderna som pyufolkets plötsliga undergång: det finns inga tecken på ett våldsamt störtande i Sri Ksetra, den största pyustaden, men räderna försvagade stadsstaterna medan burmanska nybyggare flyttade in i torrzonen. På 1000-talet hade Pagan tagit deras plats. Halin, Beikthano och Sri Ksetra fördes 2014 gemensamt upp på Unescos världsarvslista som Pyus forntida städer."
