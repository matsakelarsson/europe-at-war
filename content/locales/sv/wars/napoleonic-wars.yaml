After Austerlitz Napoleon reshaped Germany. On 12 July 1806 sixteen princes, led by the new kings of Bavaria and Württemberg, formed the Confederation of the Rhine under his protection and left the Holy Roman Empire. Under a French ultimatum Francis II laid down the imperial crown on 6 August, ending an empire that had lasted, in some form, for a thousand years; he kept the title of Emperor of Austria he had taken in 1804. Prussia, neutral in 1805, was angered by Napoleon’s offer to return Hanover to Britain, and in October it went to war with Saxony at its side.: Efter Austerlitz omformade Napoleon Tyskland. Den 12 juli 1806 bildade sexton furstar, ledda av de nya kungarna av Bayern och Württemberg, Rhenförbundet under hans beskydd och lämnade tysk-romerska riket. Under ett franskt ultimatum lade Frans II ned kejsarkronan den 6 augusti och gjorde därmed slut på ett rike som i någon form hade bestått i tusen år; han behöll titeln kejsare av Österrike, som han hade antagit 1804. Preussen, som varit neutralt 1805, förargades över Napoleons erbjudande att återlämna Hannover till Storbritannien och gick i oktober i krig med Sachsen vid sin sida.
On 14 October Napoleon beat Prince Hohenlohe’s Prussians and Saxons at Jena, while 20 km to the north Marshal Davout’s corps of 26,000 routed the main Prussian army, twice its size, at Auerstedt. Napoleon entered Berlin on 27 October, and Hohenlohe surrendered at Prenzlau the next day. Saxony changed sides and became a kingdom. After further fighting in Poland, Russia and Prussia made peace with Napoleon at Tilsit in July 1807. Prussia lost about half its land and people. Its lands west of the Elbe went to the new Kingdom of Westphalia and other French clients, and most of its Polish lands to the Duchy of Warsaw.: Den 14 oktober slog Napoleon furst Hohenlohes preussare och sachsare vid Jena, medan marskalk Davouts kår på 26 000 man 20 km längre norrut krossade den preussiska huvudarmén, dubbelt så stor, vid Auerstedt. Napoleon tågade in i Berlin den 27 oktober, och Hohenlohe kapitulerade vid Prenzlau dagen därpå. Sachsen bytte sida och blev ett kungarike. Efter fortsatta strider i Polen slöt Ryssland och Preussen fred med Napoleon i Tilsit i juli 1807. Preussen förlorade ungefär hälften av sitt land och sin befolkning. Dess områden väster om Elbe gick till det nya kungariket Westfalen och andra franska lydstater, och större delen av dess polska områden till hertigdömet Warszawa.
