Battle of Auerstedt: Slaget vid Auerstedt
Davout’s corps held off and then routed the main Prussian army. Its commander, the Duke of Brunswick, was mortally wounded.: Davouts kår höll stånd mot och krossade sedan den preussiska huvudarmén. Dess befälhavare, hertigen av Braunschweig, blev dödligt sårad.
27 October 1806: 27 oktober 1806
Napoleon entered the Prussian capital. Here in November he decreed a blockade of Britain, the Continental System.: Napoleon tågade in i den preussiska huvudstaden. Här utfärdade han i november ett dekret om blockad av Storbritannien, kontinentalsystemet.
Battle of Prenzlau: Slaget vid Prenzlau
28 October 1806: 28 oktober 1806
Hohenlohe surrendered the remains of his army, some 10,000 men, to Murat’s cavalry.: Hohenlohe överlämnade resterna av sin armé, omkring 10 000 man, till Murats kavalleri.
Magdeburg: Magdeburg
8 November 1806: 8 november 1806
Prussia’s greatest fortress surrendered to Marshal Ney with a garrison of some 25,000 men after a two-week siege.: Preussens största fästning kapitulerade för marskalk Ney med en garnison på omkring 25 000 man efter två veckors belägring.
Pursuit: Förföljande
After Jena the war moved east. Russia came to Prussia’s aid, and on 28 November 1806 French troops entered Warsaw, welcomed by Poles who hoped Napoleon would restore their state. A winter campaign followed in mud and snow. At Pułtusk on 26 December Marshal Lannes failed to break General Levin von Bennigsen’s Russians, and on 7–8 February 1807 Napoleon attacked Bennigsen at Eylau, today’s Bagrationovsk, in a snowstorm. Augereau’s corps was cut to pieces, and Murat saved the French centre with a mass charge of more than 10,000 cavalry. When the Russians and a Prussian corps withdrew in the night, each side had lost at least 15,000 men, and nothing had been decided.: Efter Jena flyttade kriget österut. Ryssland kom Preussen till hjälp, och den 28 november 1806 tågade franska trupper in i Warszawa, välkomnade av polacker som hoppades att Napoleon skulle återupprätta deras stat. Ett vinterfälttåg i lera och snö följde. Vid Pułtusk den 26 december lyckades marskalk Lannes inte bryta general Levin von Bennigsens ryssar, och den 7–8 februari 1807 anföll Napoleon Bennigsen vid Eylau, dagens Bagrationovsk, i en snöstorm. Augereaus kår höggs sönder, och Murat räddade det franska centrumet med en massiv chock med mer än 10 000 ryttare. När ryssarna och en preussisk kår drog sig tillbaka under natten hade vardera sidan förlorat minst 15 000 man, och ingenting var avgjort.
"In the spring the French took Danzig after a two-month siege. On 14 June Napoleon caught Bennigsen’s army with its back to the River Alle at Friedland and routed it; the Russians lost at least 20,000 men. Alexander I asked for an armistice, and on 25 June he and Napoleon met on a raft moored in the Niemen at Tilsit. By the treaties of 7 and 9 July Russia recognised Napoleon’s new states, secretly promised to join his blockade of Britain if Britain refused peace, and gained a free hand against Sweden. Prussia paid the price: its Polish lands became the Duchy of Warsaw under the King of Saxony, and Danzig a free city under French protection.": "På våren intog fransmännen Danzig efter två månaders belägring. Den 14 juni överraskade Napoleon Bennigsens armé med ryggen mot floden Alle vid Friedland och krossade den; ryssarna förlorade minst 20 000 man. Alexander I begärde vapenstillestånd, och den 25 juni möttes han och Napoleon på en flotte förtöjd i Njemen vid Tilsit. Genom fördragen den 7 och 9 juli erkände Ryssland Napoleons nya stater, lovade i hemlighet att ansluta sig till hans blockad av Storbritannien om Storbritannien vägrade fred och fick fria händer mot Sverige. Preussen fick betala priset: dess polska områden blev hertigdömet Warszawa under kungen av Sachsen, och Danzig en fri stad under franskt beskydd."
Battle of Eylau: Slaget vid Eylau
7–8 February 1807, inconclusive: 7–8 februari 1807, oavgjort
Battle of Friedland: Slaget vid Friedland
14 June 1807, French victory: 14 juni 1807, fransk seger
Treaties of Tilsit: Freden i Tilsit
7 July (Russia) and 9 July 1807 (Prussia): 7 juli (Ryssland) och 9 juli 1807 (Preussen)
The Finnish War, 1808–1809: Finska kriget 1808–1809
28 November 1806: 28 november 1806
Murat’s cavalry entered the city as the Prussians and Russians withdrew. Napoleon arrived in December and spent much of the winter there.: Murats kavalleri red in i staden när preussarna och ryssarna drog sig tillbaka. Napoleon anlände i december och tillbringade en stor del av vintern där.
26 December 1806: 26 december 1806
Lannes attacked Bennigsen’s army in deep mud. Both sides claimed victory, and the Russians withdrew north.: Lannes anföll Bennigsens armé i djup lera. Båda sidor gjorde anspråk på segern, och ryssarna drog sig tillbaka norrut.
7–8 February 1807: 7–8 februari 1807
One of the bloodiest battles of the age, fought in snow. The French held the field, but the Russian army escaped intact.: Ett av tidens blodigaste slag, utkämpat i snö. Fransmännen behöll slagfältet, men den ryska armén undkom intakt.
19 March – 24 May 1807: 19 mars – 24 maj 1807
Marshal Lefebvre’s corps forced the Prussian and Russian garrison to surrender, and Napoleon made him Duke of Danzig.: Marskalk Lefebvres kår tvingade den preussiska och ryska garnisonen att kapitulera, och Napoleon gjorde honom till hertig av Danzig.
14 June 1807: 14 juni 1807
Lannes held the Russians until Napoleon arrived. Ney’s corps then stormed the town, and the Russians fled across the Alle, many drowning.: Lannes höll ryssarna stången tills Napoleon anlände. Neys kår stormade sedan staden, och ryssarna flydde över Alle, där många drunknade.
7 and 9 July 1807: 7 och 9 juli 1807
Napoleon and Alexander met on a raft in the river on 25 June. Frederick William III of Prussia was left waiting on the bank.: Napoleon och Alexander möttes på en flotte i floden den 25 juni. Fredrik Vilhelm III av Preussen fick vänta på stranden.
Napoleon, February: Napoleon, februari
Napoleon, June: Napoleon, juni
Bennigsen: Bennigsen
Hoping to rouse the Germans while Napoleon’s best troops were in Spain, Austria went to war again in April 1809. Archduke Charles invaded Bavaria on 10 April, but Napoleon hurried from Paris and beat him in five days of fighting around Abensberg, Landshut, Eckmühl and Regensburg, and Charles withdrew into Bohemia. Napoleon took Vienna on 13 May. On 21 May he crossed the Danube below the city by the island of Lobau, but Charles attacked the bridgehead at Aspern and Essling, and the swollen river broke the French bridges. Napoleon had to fall back to the island, his first major defeat in more than ten years.: Österrike hoppades kunna resa tyskarna medan Napoleons bästa trupper var i Spanien och gick åter i krig i april 1809. Ärkehertig Karl föll in i Bayern den 10 april, men Napoleon skyndade från Paris och slog honom under fem dagars strider kring Abensberg, Landshut, Eckmühl och Regensburg, och Karl drog sig tillbaka till Böhmen. Napoleon intog Wien den 13 maj. Den 21 maj gick han över Donau nedanför staden vid ön Lobau, men Karl anföll brohuvudet vid Aspern och Essling, och den översvämmade floden bröt sönder de franska broarna. Napoleon måste dra sig tillbaka till ön, hans första stora nederlag på mer än tio år.
Six weeks later, reinforced from Italy, he crossed again and on 5–6 July beat Charles at Wagram, on the Marchfeld plain north-east of Vienna, in one of the largest battles yet fought in Europe, with some 300,000 men engaged. Charles agreed an armistice at Znaim on 12 July. By the Peace of Schönbrunn on 14 October Austria lost about 3.5 million subjects. Salzburg, Berchtesgaden and the Innviertel went to Bavaria. Carniola, western Carinthia, Trieste and Croatia south of the Sava went to France as the Illyrian Provinces, cutting Austria off from the sea, and Galician lands went to the Duchy of Warsaw and Russia.: Sex veckor senare gick han, förstärkt från Italien, åter över floden och slog den 5–6 juli Karl vid Wagram, på Marchfeldslätten nordost om Wien, i ett av de största slag som dittills utkämpats i Europa, med omkring 300 000 man inblandade. Karl gick med på ett vapenstillestånd i Znaim den 12 juli. Genom freden i Schönbrunn den 14 oktober förlorade Österrike omkring 3,5 miljoner undersåtar. Salzburg, Berchtesgaden och Innviertel gick till Bayern. Krain, västra Kärnten, Trieste och Kroatien söder om Sava gick till Frankrike som Illyriska provinserna, vilket skar av Österrike från havet, och galiziska områden gick till hertigdömet Warszawa och Ryssland.
Battle of Aspern-Essling: Slaget vid Aspern-Essling
21–22 May 1809, Austrian victory: 21–22 maj 1809, österrikisk seger
Battle of Wagram: Slaget vid Wagram
5–6 July 1809, French victory: 5–6 juli 1809, fransk seger
Peace of Schönbrunn: Freden i Schönbrunn
14 October 1809: 14 oktober 1809
Battle of Eckmühl: Slaget vid Eckmühl
22 April 1809: 22 april 1809
The climax of Napoleon’s counter-attack in Bavaria. Charles retreated across the Danube at Regensburg into Bohemia.: Höjdpunkten i Napoleons motoffensiv i Bayern. Karl drog sig tillbaka över Donau vid Regensburg in i Böhmen.
21–22 May 1809: 21–22 maj 1809
The Austrians drove the French back across the Danube to the island of Lobau. Marshal Lannes was mortally wounded.: Österrikarna drev fransmännen tillbaka över Donau till ön Lobau. Marskalk Lannes blev dödligt sårad.
5–6 July 1809: 5–6 juli 1809
After two days of fighting on the Marchfeld, Charles withdrew his beaten army in good order towards Moravia.: Efter två dagars strider på Marchfeld drog Karl tillbaka sin slagna armé i god ordning mot Mähren.
Armistice of Znaim: Vapenstilleståndet i Znaim
12 July 1809: 12 juli 1809
The armistice agreed at today’s Znojmo ended the fighting between France and Austria.: Vapenstilleståndet som slöts i dagens Znojmo gjorde slut på striderna mellan Frankrike och Österrike.
Napoleon, who had made the Habsburg palace his headquarters, imposed the peace there. Austria also paid a heavy indemnity and joined the blockade of Britain.: Napoleon, som hade gjort det habsburgska slottet till sitt högkvarter, dikterade freden där. Österrike betalade också ett tungt krigsskadestånd och anslöt sig till blockaden av Storbritannien.
Charles, May: Karl, maj
Ceded by Austria to Bavaria, 1809: Avträtt av Österrike till Bayern 1809
With no fleet left to challenge Britain after Trafalgar, Napoleon set out to ruin its trade. The Berlin Decree of 21 November 1806 closed the ports of France and its allies to British ships and goods, and the Milan Decree of December 1807 extended the ban to neutral ships that obeyed British rules; Britain answered with Orders in Council. Enforcing this Continental System drew Napoleon ever further. He sent an army into Portugal in 1807 and in 1808 made his brother Joseph King of Spain, starting a long war there. He annexed the Papal States in 1809, Holland in 1810 after his brother Louis, its king, refused to enforce the blockade, and in December 1810 the North Sea coast to Hamburg and Lübeck.: Utan någon flotta kvar som kunde utmana Storbritannien efter Trafalgar inriktade sig Napoleon på att ruinera dess handel. Berlindekretet den 21 november 1806 stängde Frankrikes och dess allierades hamnar för brittiska fartyg och varor, och Milanodekretet i december 1807 utsträckte förbudet till neutrala fartyg som följde brittiska regler; Storbritannien svarade med Orders in Council. Att genomdriva detta kontinentalsystem drog Napoleon allt längre. Han sände en armé in i Portugal 1807 och gjorde 1808 sin bror Joseph till kung av Spanien, vilket inledde ett långt krig där. Han annekterade Kyrkostaten 1809, Holland 1810 sedan hans bror Louis, landets kung, vägrat genomdriva blockaden, och i december 1810 Nordsjökusten fram till Hamburg och Lübeck.
At the end of 1811 Napoleon’s power was at its height. The French Empire, with about 130 departments, reached from Lübeck to Rome and across the Adriatic to the Illyrian Provinces. Around it lay dependent states, the Kingdom of Italy, Naples under Joachim Murat, Spain under Joseph, Westphalia under Jérôme, the rest of the Confederation of the Rhine, Switzerland and the Duchy of Warsaw. In 1810 he married Marie Louise, daughter of the Austrian emperor, who bore him a son in March 1811. But smuggling and hardship eroded the blockade, the war in Spain drained his armies, and when Russia opened its ports to neutral ships at the end of 1810, the quarrel led to war.: "I slutet av 1811 stod Napoleons makt på sin höjdpunkt. Franska kejsardömet, med omkring 130 departement, sträckte sig från Lübeck till Rom och över Adriatiska havet till Illyriska provinserna. Runt det låg beroende stater: kungariket Italien, Neapel under Joachim Murat, Spanien under Joseph, Westfalen under Jérôme, resten av Rhenförbundet, Schweiz och hertigdömet Warszawa. År 1810 gifte han sig med Marie Louise, dotter till den österrikiske kejsaren, som födde honom en son i mars 1811. Men smuggling och nöd urholkade blockaden, kriget i Spanien tärde på hans arméer, och när Ryssland i slutet av 1810 öppnade sina hamnar för neutrala fartyg ledde konflikten till krig."
