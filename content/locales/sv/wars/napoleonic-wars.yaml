After Leipzig, Charles John turned north against Denmark–Norway, Napoleon’s last ally, and invaded Holstein in December 1813. Swedish cavalry won a clash at Bornhöved on 7 December, but the Danes fought their way past the allies at Sehested on 10 December and reached the fortress of Rendsburg.: Efter Leipzig vände sig Karl Johan norrut mot Danmark–Norge, Napoleons siste allierade, och föll in i Holstein i december 1813. Svenskt kavalleri vann en sammandrabbning vid Bornhöved den 7 december, men danskarna slog sig förbi de allierade vid Sehested den 10 december och nådde fästningen Rendsburg.
Denmark could not hold out. By the Treaty of Kiel on 14 January 1814, King Frederick VI gave Norway to the king of Sweden, and Sweden handed Swedish Pomerania and Rügen to Denmark. It was the last war between Sweden and Denmark. The Norwegians, though, refused to be handed over.: Danmark kunde inte hålla ut. Genom freden i Kiel den 14 januari 1814 gav kung Fredrik VI Norge till Sveriges kung, och Sverige överlämnade Svenska Pommern och Rügen till Danmark. Det var det sista kriget mellan Sverige och Danmark. Norrmännen vägrade dock att låta sig överlämnas.
Exchange: Utbyte
