Prussia’s new lands on the Rhine and in Westphalia made it the guardian of Germany’s western border.: Preussens nya områden vid Rhen och i Westfalen gjorde landet till väktare av Tysklands västgräns.
The United Kingdom of the Netherlands under William I of Orange joined the former Austrian Netherlands to the Dutch provinces.: Förenade kungariket Nederländerna under Vilhelm I av Oranien förenade de tidigare Österrikiska Nederländerna med de nederländska provinserna.
The Federal Assembly of the German Confederation met in the free city from 1816, chaired by Austria.: Tyska förbundets förbundsdag sammanträdde i den fria staden från 1816, med Österrike som ordförande.
Lombardy and Venetia became the Kingdom of Lombardy–Venetia under the Austrian emperor.: Lombardiet och Venetien blev kungariket Lombardiet–Venetien under den österrikiske kejsaren.
The old republic was given to the Kingdom of Sardinia, against the wishes of many of its people.: Den gamla republiken gavs till kungariket Sardinien, mot många av invånarnas vilja.
