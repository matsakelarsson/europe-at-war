The Final Act gathered the Congress’s treaties into one document, signed by Austria, Britain, France, Portugal, Prussia, Russia and Sweden. Spain signed only in 1817.: Slutakten samlade kongressens fördrag i ett enda dokument, undertecknat av Österrike, Storbritannien, Frankrike, Portugal, Preussen, Ryssland och Sverige. Spanien undertecknade först 1817.
The Kingdom of Poland, known as Congress Poland, was joined to Russia with the tsar as its king and its own constitution and army.: Kungariket Polen, kallat Kongresspolen, förenades med Ryssland med tsaren som kung och fick en egen författning och armé.
