To invade Britain, Napoleon gathered his Army of England in camps around Boulogne, but he needed command of the Channel to get it across. Spain, at war with Britain again from December 1804, added its fleet to his. In March 1805 Admiral Pierre-Charles Villeneuve slipped out of Toulon and sailed for the West Indies to draw the British fleets away, with Horatio Nelson in pursuit. On his way back Villeneuve fought an indecisive action with Admiral Robert Calder off Cape Finisterre on 22 July, then put into Ferrol and, in August, into Cádiz. Soon afterwards Napoleon gave up the invasion and turned his army against Austria.: För att invadera Storbritannien samlade Napoleon sin Englandsarmé i läger kring Boulogne, men han behövde herraväldet över Engelska kanalen för att få över den. Spanien, åter i krig med Storbritannien från december 1804, lade sin flotta till hans. I mars 1805 slank amiral Pierre-Charles Villeneuve ut från Toulon och seglade till Västindien för att locka bort de brittiska flottorna, förföljd av Horatio Nelson. På hemvägen utkämpade Villeneuve en oavgjord strid med amiral Robert Calder utanför Kap Finisterre den 22 juli och löpte sedan in i Ferrol och i augusti i Cádiz. Kort därefter gav Napoleon upp invasionen och vände sin armé mot Österrike.
Ordered to sail for Naples, Villeneuve led 33 French and Spanish ships of the line out of Cádiz in mid-October, and on 21 October Nelson, with 27, met him off Cape Trafalgar. Instead of fighting line against line, the British attacked in two columns that broke through the allied line. In about five hours of close fighting they captured 17 ships and destroyed one without losing any of their own, though a storm in the following days wrecked most of the prizes. Nelson was shot by a marksman on the French Redoutable and died as the battle ended. Britain kept command of the sea for the rest of the war, and Napoleon turned to economic warfare against it.: Villeneuve fick order att segla till Neapel och förde i mitten av oktober 33 franska och spanska linjeskepp ut från Cádiz, och den 21 oktober mötte Nelson honom med 27 utanför Kap Trafalgar. I stället för att strida linje mot linje anföll britterna i två kolonner som bröt igenom den allierade linjen. Under omkring fem timmars närstrid erövrade de 17 fartyg och förstörde ett utan att förlora något eget, även om en storm de följande dagarna förliste de flesta av prisen. Nelson sköts av en skarpskytt på franska Redoutable och dog när slaget tog slut. Storbritannien behöll herraväldet till sjöss under resten av kriget, och Napoleon övergick till ekonomisk krigföring mot landet.
