In 1805 Austria joined Britain, Russia and Sweden in the Third Coalition against Napoleon, who had crowned himself Emperor of the French the year before. On 10 September an Austrian army under Karl Mack crossed the Inn into Bavaria, whose elector sided with France, and advanced to Ulm to wait for the Russians. Napoleon marched his Grande Armée from the Channel coast to the Rhine and in early October swung it across Württemberg to the Danube behind Mack, while Bavaria, Württemberg and Baden joined him. Surrounded, Mack surrendered at Ulm on 20 October; in all the campaign cost Austria some 60,000 men taken prisoner.: År 1805 anslöt sig Österrike till Storbritannien, Ryssland och Sverige i tredje koalitionen mot Napoleon, som året innan hade krönt sig till fransmännens kejsare. Den 10 september gick en österrikisk armé under Karl Mack över Inn in i Bayern, vars kurfurste tog Frankrikes parti, och ryckte fram till Ulm för att invänta ryssarna. Napoleon förde sin Grande Armée från Kanalkusten till Rhen och svängde i början av oktober genom Württemberg till Donau bakom Mack, medan Bayern, Württemberg och Baden anslöt sig till honom. Mack var omringad och kapitulerade vid Ulm den 20 oktober; sammanlagt kostade fälttåget Österrike omkring 60 000 man i fångenskap.
The French entered Vienna on 13 November, and Kutuzov’s Russians and the remaining Austrians fell back into Moravia, where Tsar Alexander I and Emperor Francis II joined them. On 2 December near Austerlitz the allies attacked Napoleon’s right, which he had left weak on purpose, and he broke through their centre on the Pratzen heights. The allies lost at least 27,000 men, about a third of their army, against some 9,000 French. At Pressburg on 26 December Austria gave up Venetia, Istria and Dalmatia to Napoleon’s Kingdom of Italy, and Tyrol, Vorarlberg and its Swabian lands to Bavaria, Württemberg and Baden. It received Salzburg in return.: Fransmännen tågade in i Wien den 13 november, och Kutuzovs ryssar och de återstående österrikarna drog sig tillbaka till Mähren, där tsar Alexander I och kejsar Frans II anslöt sig till dem. Den 2 december nära Austerlitz anföll de allierade Napoleons högra flygel, som han medvetet hade lämnat svag, och han bröt igenom deras centrum på Pratzenhöjderna. De allierade förlorade minst 27 000 man, ungefär en tredjedel av sin armé, mot omkring 9 000 fransmän. I Pressburg den 26 december avträdde Österrike Venetien, Istrien och Dalmatien till Napoleons kungarike Italien samt Tyrolen, Vorarlberg och sina schwabiska besittningar till Bayern, Württemberg och Baden. I gengäld fick det Salzburg.
