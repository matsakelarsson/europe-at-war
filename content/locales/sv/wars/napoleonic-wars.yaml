Swedish cavalry charged the Danish rearguard, which got away toward Kiel.: Svenskt kavalleri anföll den danska eftertruppen, som kom undan mot Kiel.
The Danish corps broke through the allies and reached the fortress of Rendsburg.: Den danska kåren bröt igenom de allierade och nådde fästningen Rendsburg.
Frederick VI ceded Norway, but not Iceland, Greenland or the Faroes, to the king of Sweden.: Fredrik VI avträdde Norge, men inte Island, Grönland eller Färöarna, till Sveriges kung.
Ceded to Sweden at Kiel: Avträtt till Sverige i Kiel
After Leipzig the allies reached the Rhine, and Napoleon let slip their offer of peace with France’s “natural frontiers”. From late December 1813 Schwarzenberg’s Army of Bohemia crossed the upper Rhine through Switzerland and Blücher’s Army of Silesia crossed the middle Rhine, while Wellington, coming from Spain, had already crossed the Pyrenees into south-western France. Napoleon, with perhaps 70,000 men in the field, many of them young conscripts, struck at the allied armies in turn. He was beaten at La Rothière on 1 February 1814, but between 10 and 14 February he defeated Blücher’s scattered corps four times in five days, at Champaubert, Montmirail, Château-Thierry and Vauchamps, and on 18 February he drove Schwarzenberg back at Montereau.: Efter Leipzig nådde de allierade Rhen, och Napoleon lät deras erbjudande om fred med Frankrikes ”naturliga gränser” gå sig ur händerna. Från slutet av december 1813 gick Schwarzenbergs böhmiska armé över övre Rhen genom Schweiz och Blüchers schlesiska armé över mellersta Rhen, medan Wellington, som kom från Spanien, redan hade gått över Pyrenéerna in i sydvästra Frankrike. Napoleon, med kanske 70 000 man i fält, många av dem unga värnpliktiga, angrep de allierade arméerna en i taget. Han besegrades vid La Rothière den 1 februari 1814, men mellan den 10 och 14 februari slog han Blüchers spridda kårer fyra gånger på fem dagar, vid Champaubert, Montmirail, Château-Thierry och Vauchamps, och den 18 februari drev han tillbaka Schwarzenberg vid Montereau.
The allies held together, binding themselves in the Treaty of Chaumont in March not to make a separate peace. Blücher checked Napoleon at Laon on 9–10 March and Schwarzenberg at Arcis-sur-Aube on 20–21 March, and when Napoleon moved east to threaten their communications, they marched on Paris instead. After a day’s fighting on 30 March Marshal Marmont surrendered the city, and the allied monarchs rode in the next day. The Senate deposed Napoleon, his marshals refused to fight on, and on 6 April at Fontainebleau he abdicated. Napoleon was given the island of Elba, and Louis XVIII, a brother of Louis XVI, returned as king. By the Treaty of Paris on 30 May France kept its borders of 1792, with small additions.: De allierade höll ihop och förband sig i fördraget i Chaumont i mars att inte sluta separatfred. Blücher hejdade Napoleon vid Laon den 9–10 mars och Schwarzenberg vid Arcis-sur-Aube den 20–21 mars, och när Napoleon gick österut för att hota deras förbindelser marscherade de i stället mot Paris. Efter en dags strider den 30 mars kapitulerade marskalk Marmont med staden, och de allierade monarkerna red in dagen därpå. Senaten avsatte Napoleon, hans marskalkar vägrade att strida vidare, och den 6 april abdikerade han i Fontainebleau. Napoleon fick ön Elba, och Ludvig XVIII, en bror till Ludvig XVI, återvände som kung. Genom freden i Paris den 30 maj behöll Frankrike sina gränser från 1792, med smärre tillägg.
