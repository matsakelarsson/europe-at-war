The steps on the war in Germany and Austria were added for Europe at War. Bavaria, Württemberg, Baden and, from December 1806, Saxony fought on France’s side until 1813.: Stegen om kriget i Tyskland och Österrike lades till för Europe at War. Bayern, Württemberg, Baden och från december 1806 Sachsen kämpade på Frankrikes sida fram till 1813.
