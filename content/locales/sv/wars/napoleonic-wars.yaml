When the armistice ended in August 1813, Austria joined Russia, Prussia and Sweden against Napoleon, with Britain paying subsidies. Three allied armies closed on him in Saxony, Schwarzenberg’s Army of Bohemia from the south, Blücher’s Army of Silesia from the east and Crown Prince Charles John’s Army of the North from Berlin. Under the Trachenberg plan they avoided battle with Napoleon himself and struck at his marshals. Napoleon beat Schwarzenberg at Dresden on 26–27 August, his last great victory in Germany, but in the same days Blücher routed Macdonald on the Katzbach, the allies trapped Vandamme’s pursuing corps at Kulm, and the French drives on Berlin failed. On 8 October Bavaria changed sides.: "När vapenstilleståndet löpte ut i augusti 1813 anslöt sig Österrike till Ryssland, Preussen och Sverige mot Napoleon, med Storbritannien som betalade subsidier. Tre allierade arméer närmade sig honom i Sachsen: Schwarzenbergs böhmiska armé från söder, Blüchers schlesiska armé från öster och kronprins Karl Johans Nordarmé från Berlin. Enligt Trachenbergplanen undvek de strid med Napoleon själv och slog till mot hans marskalkar. Napoleon slog Schwarzenberg vid Dresden den 26–27 augusti, hans sista stora seger i Tyskland, men under samma dagar krossade Blücher Macdonald vid Katzbach, de allierade fångade Vandammes förföljande kår vid Kulm, och de franska stötarna mot Berlin misslyckades. Den 8 oktober bytte Bayern sida."
In October the allies converged on Leipzig. On 16–19 October more than half a million men fought the largest battle of the Napoleonic Wars there, Napoleon’s army of fewer than 200,000, with Germans, Poles and Italians in its ranks, against more than 300,000 Austrians, Russians, Prussians and Swedes. Schwarzenberg attacked from the south and Blücher from the north, and on 18 October Bennigsen’s Army of Poland and the Army of the North closed the ring from the east as Saxon troops went over to the allies. As Napoleon retreated on the 19th, the bridge over the Elster was blown too early, trapping his rearguard, and Marshal Józef Poniatowski drowned. Napoleon fell back to the Rhine, and the Confederation of the Rhine fell apart.: I oktober drog de allierade samman sina styrkor mot Leipzig. Den 16–19 oktober utkämpade där mer än en halv miljon man Napoleonkrigens största slag, Napoleons armé på färre än 200 000 man, med tyskar, polacker och italienare i leden, mot mer än 300 000 österrikare, ryssar, preussare och svenskar. Schwarzenberg anföll från söder och Blücher från norr, och den 18 oktober slöt Bennigsens polska armé och Nordarmén ringen från öster samtidigt som sachsiska trupper gick över till de allierade. När Napoleon retirerade den 19:e sprängdes bron över Elster för tidigt, så att hans eftertrupp blev instängd, och marskalk Józef Poniatowski drunknade. Napoleon drog sig tillbaka till Rhen, och Rhenförbundet föll samman.
