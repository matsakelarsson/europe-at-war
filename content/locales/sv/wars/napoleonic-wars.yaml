The Peninsular War: Spanska självständighetskriget
From the captured Prussian capital Napoleon declared the British Isles under blockade and banned all trade with them.: Från den erövrade preussiska huvudstaden förklarade Napoleon de brittiska öarna i blockad och förbjöd all handel med dem.
30 November 1807: 30 november 1807
General Junot occupied the city to close Portugal to British trade. The royal family had sailed for Brazil the day before.: General Junot ockuperade staden för att stänga Portugal för brittisk handel. Kungafamiljen hade seglat till Brasilien dagen innan.
May – July 1808: maj – juli 1808
Madrid rose against the French on 2 May. Napoleon forced the Spanish Bourbons to abdicate at Bayonne and made Joseph king in their place.: Madrid reste sig mot fransmännen den 2 maj. Napoleon tvingade de spanska bourbonerna att abdikera i Bayonne och gjorde Joseph till kung i deras ställe.
May – July 1809: maj – juli 1809
The Papal States were annexed to France. Pope Pius VII excommunicated Napoleon and was arrested and held in Savona and Fontainebleau until 1814.: Kyrkostaten annekterades av Frankrike. Påven Pius VII bannlyste Napoleon och greps och hölls fången i Savona och Fontainebleau fram till 1814.
Amsterdam: Amsterdam
9 July 1810: 9 juli 1810
King Louis abdicated rather than enforce the blockade, and Napoleon annexed the Kingdom of Holland.: Kung Louis abdikerade hellre än att genomdriva blockaden, och Napoleon annekterade kungariket Holland.
December 1810: december 1810
Annexed with Bremen, Lübeck, Oldenburg and the North Sea coast to close the last gaps in the blockade.: Annekterad tillsammans med Bremen, Lübeck, Oldenburg och Nordsjökusten för att täppa till de sista luckorna i blockaden.
Taken by Britain from Denmark in 1807, the island became a depot for smuggling British goods into Germany.: Ön, som Storbritannien tog från Danmark 1807, blev en bas för smuggling av brittiska varor in i Tyskland.
Napoleon’s empire and the states dependent on it, end of 1811 (approximate): Napoleons kejsardöme och de stater som var beroende av det, slutet av 1811 (ungefärligt)
In 1810 Sweden chose the French marshal Jean-Baptiste Bernadotte as crown prince, and as Charles John he soon ran the country. When Napoleon occupied Swedish Pomerania again in 1812, Charles John allied with Russia, which agreed to help Sweden take Norway from Denmark.: År 1810 valde Sverige den franske marskalken Jean-Baptiste Bernadotte till kronprins, och som Karl Johan styrde han snart landet. När Napoleon åter ockuperade Svenska Pommern 1812 slöt Karl Johan förbund med Ryssland, som lovade att hjälpa Sverige att ta Norge från Danmark.
In 1813 he commanded the allied Army of the North, made up of Swedes, Prussians and Russians, against his old master. It beat the French at Grossbeeren on 23 August and Dennewitz on 6 September, protecting Berlin, and took part in the decisive Battle of Leipzig on 16–19 October 1813.: År 1813 förde han befälet över den allierade Nordarmén, sammansatt av svenskar, preussare och ryssar, mot sin gamle herre. Den slog fransmännen vid Grossbeeren den 23 augusti och vid Dennewitz den 6 september, skyddade Berlin och deltog i det avgörande slaget vid Leipzig den 16–19 oktober 1813.
Army of the North: Nordarmén
Swedish, Prussian and Russian troops: Svenska, preussiska och ryska trupper
Battle of Leipzig: Slaget vid Leipzig
16–19 October 1813: 16–19 oktober 1813
Battle of Grossbeeren: Slaget vid Grossbeeren
23 August 1813: 23 augusti 1813
Marshal Oudinot’s drive on Berlin was beaten back, mostly by the Prussian troops of the Army of the North.: Marskalk Oudinots stöt mot Berlin slogs tillbaka, främst av Nordarméns preussiska trupper.
Battle of Dennewitz: Slaget vid Dennewitz
6 September 1813: 6 september 1813
Marshal Ney’s Army of Berlin was routed south of the Prussian capital.: Marskalk Neys Berlinarmé krossades söder om den preussiska huvudstaden.
The Battle of the Nations, Napoleon’s first great defeat. The Army of the North joined the final attacks.: Folkslaget, Napoleons första stora nederlag. Nordarmén deltog i de avslutande anfallen.
Napoleon and Alexander had fallen out over the blockade, over Poland and over the annexation of Oldenburg, whose ruling family was related to the tsar’s. On 24 June 1812 Napoleon crossed the Niemen with the largest army Europe had yet seen, more than 600,000 men in all. It was drawn from all over his empire and his allies, with Germans, Poles, Italians and others beside the French, while Austrian and Prussian corps guarded its flanks. The Russian armies fell back, fought at Smolensk in August and at Borodino on 7 September, and gave up Moscow, which burned after the French entered it on 14 September.: Napoleon och Alexander hade blivit osams om blockaden, om Polen och om annekteringen av Oldenburg, vars furstehus var släkt med tsarens. Den 24 juni 1812 gick Napoleon över Njemen med den största armé Europa dittills hade sett, sammanlagt mer än 600 000 man. Den var hämtad från hela hans kejsardöme och från hans allierade, med tyskar, polacker, italienare och andra vid sidan av fransmännen, medan österrikiska och preussiska kårer skyddade flankerna. De ryska arméerna drog sig tillbaka, stred vid Smolensk i augusti och vid Borodino den 7 september och gav upp Moskva, som brann sedan fransmännen tågat in den 14 september.
Alexander refused to make peace, and on 19 October Napoleon left Moscow. Hunger, cold, disease and constant attacks by Cossacks, peasant partisans and the pursuing Russian armies destroyed most of his army on the retreat, and after the crossing of the Berezina in late November only a small fraction of the men who had entered Russia came back across the Niemen in December. The disaster broke Napoleon’s hold on Germany. Within weeks the Prussian corps had stood aside, and in 1813 Prussia changed sides.: Alexander vägrade sluta fred, och den 19 oktober lämnade Napoleon Moskva. Hunger, kyla, sjukdomar och ständiga angrepp från kosacker, bondepartisaner och de förföljande ryska arméerna förintade större delen av hans armé under återtåget, och efter övergången av Berezina i slutet av november kom bara en liten bråkdel av de män som hade gått in i Ryssland tillbaka över Njemen i december. Katastrofen bröt Napoleons grepp om Tyskland. Inom några veckor hade den preussiska kåren dragit sig ur, och 1813 bytte Preussen sida.
7 September 1812: 7 september 1812
more than 600,000 men; only a small fraction came back: mer än 600 000 man; bara en liten bråkdel kom tillbaka
The French invasion of Russia: Napoleons ryska fälttåg
The Grande Armée crossed the river near Kovno, today’s Kaunas, on pontoon bridges.: Grande Armée gick över floden nära Kovno, dagens Kaunas, på pontonbroar.
The French stormed the burning city, but the Russian armies, now united, got away east.: Fransmännen stormade den brinnande staden, men de ryska arméerna, nu förenade, kom undan österut.
The bloodiest day of the war. Kutuzov’s army withdrew after the battle, leaving the road to Moscow open.: Krigets blodigaste dag. Kutuzovs armé drog sig tillbaka efter slaget och lämnade vägen till Moskva öppen.
Napoleon entered a city its people had largely abandoned. Fires destroyed most of it in the following days.: Napoleon tågade in i en stad som invånarna till stor del hade övergett. Bränder förstörde större delen av den de följande dagarna.
Berezina: Berezina
The remains of the Grande Armée escaped over two improvised bridges, at a terrible cost in lives.: Resterna av Grande Armée undkom över två provisoriska broar, till ett fruktansvärt pris i människoliv.
Napoleon’s Grande Armée was destroyed in Russia in 1812. On 30 December General Ludwig Yorck, commanding the Prussian corps that had marched with it, agreed at Tauroggen to stand aside, without his king’s permission. Frederick William III hesitated, then allied with Russia at Kalisz on 28 February 1813 and declared war on France in March. Prussia called up volunteers and a militia, the Landwehr, and many young men joined free corps such as Lützow’s. Russian and Prussian troops entered Berlin, Dresden and Hamburg. Napoleon raised a new army, made up largely of young conscripts and short of cavalry, and marched into Saxony.: Napoleons Grande Armée förintades i Ryssland 1812. Den 30 december gick general Ludwig Yorck, befälhavare för den preussiska kår som hade marscherat med den, i Tauroggen med på att hålla sig utanför striderna, utan sin kungs tillstånd. Fredrik Vilhelm III tvekade men slöt sedan förbund med Ryssland i Kalisz den 28 februari 1813 och förklarade Frankrike krig i mars. Preussen kallade in frivilliga och en milis, lantvärnet (Landwehr), och många unga män gick med i frikårer som Lützows. Ryska och preussiska trupper tågade in i Berlin, Dresden och Hamburg. Napoleon satte upp en ny armé, till stor del bestående av unga värnpliktiga och med brist på kavalleri, och marscherade in i Sachsen.
On 2 May he beat the Russians and Prussians under Wittgenstein and Blücher at Lützen and retook Dresden, and the King of Saxony rejoined him. On 20–21 May he won again at Bautzen, but the allies escaped into Silesia in good order, and his army had lost more men than theirs. On 4 June both sides agreed an armistice at Pläswitz and used it, until August, to rebuild their armies. Austria, which had offered to mediate, promised at Reichenbach to join the allies if Napoleon refused its terms. He did, and Austria declared war on 12 August; the autumn campaign ended with his defeat at Leipzig in October.: Den 2 maj slog han ryssarna och preussarna under Wittgenstein och Blücher vid Lützen och återtog Dresden, och kungen av Sachsen anslöt sig åter till honom. Den 20–21 maj segrade han igen vid Bautzen, men de allierade undkom i god ordning till Schlesien, och hans armé hade förlorat fler män än deras. Den 4 juni kom båda sidor överens om ett vapenstillestånd i Pläswitz och använde det fram till augusti till att bygga upp sina arméer. Österrike, som hade erbjudit sig att medla, lovade i Reichenbach att ansluta sig till de allierade om Napoleon avvisade dess villkor. Det gjorde han, och Österrike förklarade krig den 12 augusti; höstfälttåget slutade med hans nederlag vid Leipzig i oktober.
Treaty of Kalisz: Fördraget i Kalisz
28 February 1813, Prussia allies with Russia: 28 februari 1813, Preussen sluter förbund med Ryssland
Battle of Lützen: Slaget vid Lützen
2 May 1813, French victory: 2 maj 1813, fransk seger
Battle of Bautzen: Slaget vid Bautzen
20–21 May 1813, French victory: 20–21 maj 1813, fransk seger
28 February 1813: 28 februari 1813
Russia and Prussia allied against Napoleon. Russia promised to help Prussia regain its strength of 1806.: Ryssland och Preussen slöt förbund mot Napoleon. Ryssland lovade att hjälpa Preussen att återvinna sin styrka från 1806.
4 March 1813: 4 mars 1813
The French garrison left, and Russian Cossacks rode into the Prussian capital, followed by Wittgenstein’s army.: Den franska garnisonen drog ut, och ryska kosacker red in i den preussiska huvudstaden, följda av Wittgensteins armé.
30 May 1813: 30 maj 1813
Russian troops under Friedrich Karl von Tettenborn entered the city in March, but Marshal Davout retook it in May and held it until 1814.: Ryska trupper under Friedrich Karl von Tettenborn tågade in i staden i mars, men marskalk Davout återtog den i maj och höll den till 1814.
2 May 1813: 2 maj 1813
Fought around Grossgörschen. Napoleon’s young conscripts held, and the allies withdrew. Gerhard von Scharnhorst, the reformer of the Prussian army, died of his wounds weeks later.: Utkämpat kring Grossgörschen. Napoleons unga värnpliktiga höll stånd, och de allierade drog sig tillbaka. Gerhard von Scharnhorst, den preussiska arméns reformator, dog av sina sår några veckor senare.
20–21 May 1813: 20–21 maj 1813
Napoleon forced the allies from their positions on the Spree, but a slow flank attack let them get away.: Napoleon tvingade de allierade från deras ställningar vid Spree, men ett långsamt flankanfall lät dem komma undan.
Armistice of Pläswitz: Vapenstilleståndet i Pläswitz
4 June 1813: 4 juni 1813
The armistice, first to 20 July and then extended into August, gave the allies time to bring Austria in.: Vapenstilleståndet, först till den 20 juli och sedan förlängt in i augusti, gav de allierade tid att få med Österrike.
Reichenbach: Reichenbach
27 June 1813: 27 juni 1813
In today’s Dzierżoniów Austria agreed with Russia and Prussia to join the war if Napoleon rejected its peace terms.: I dagens Dzierżoniów kom Österrike överens med Ryssland och Preussen om att gå med i kriget om Napoleon avvisade dess fredsvillkor.
Allied retreat: Allierat återtåg
