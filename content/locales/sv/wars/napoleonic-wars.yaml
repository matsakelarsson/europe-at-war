After Napoleon’s first abdication the victors met in Vienna to remake the map of Europe. From September 1814 the four great powers, Austria, Britain, Prussia and Russia, represented by Metternich, Castlereagh, Hardenberg and Tsar Alexander himself, decided the main questions, and France’s foreign minister Talleyrand soon won a place beside them. Amid balls and receptions the Congress nearly broke up over Poland and Saxony, for Russia wanted the whole Duchy of Warsaw and Prussia the whole of Saxony. On 3 January 1815 Austria, Britain and France signed a secret alliance against them. In the compromise Russia took most of the duchy as a Kingdom of Poland under the tsar, Kraków became a free city, and Prussia received about two-fifths of Saxony.: Efter Napoleons första abdikation möttes segrarna i Wien för att rita om Europas karta. Från september 1814 avgjorde de fyra stormakterna Österrike, Storbritannien, Preussen och Ryssland, företrädda av Metternich, Castlereagh, Hardenberg och tsar Alexander själv, de viktigaste frågorna, och Frankrikes utrikesminister Talleyrand fick snart en plats vid deras sida. Bland baler och mottagningar höll kongressen på att spricka i frågan om Polen och Sachsen, eftersom Ryssland ville ha hela hertigdömet Warszawa och Preussen hela Sachsen. Den 3 januari 1815 undertecknade Österrike, Storbritannien och Frankrike en hemlig allians mot dem. I kompromissen tog Ryssland större delen av hertigdömet som ett kungarike Polen under tsaren, Kraków blev en fri stad och Preussen fick omkring två femtedelar av Sachsen.
The Final Act was signed on 9 June 1815, nine days before Waterloo. Prussia also gained Westphalia and the Rhineland, which made it France’s neighbour on the Rhine, and Austria took Lombardy and Venetia and recovered its Alpine and Illyrian lands. The southern Netherlands, today’s Belgium, were joined to the Dutch provinces as a barrier against France, Sardinia received Genoa, and the Pope and the Bourbon king of Naples returned. In place of the Holy Roman Empire a German Confederation of 39 states was formed under Austrian presidency. The settlement paid little heed to national feeling, but no war between the great powers broke out again until the Crimean War of 1853.: Slutakten undertecknades den 9 juni 1815, nio dagar före Waterloo. Preussen fick också Westfalen och Rhenlandet, vilket gjorde det till Frankrikes granne vid Rhen, och Österrike tog Lombardiet och Venetien och återfick sina alpländer och illyriska områden. De södra Nederländerna, dagens Belgien, förenades med de nederländska provinserna som ett skydd mot Frankrike, Sardinien fick Genua, och påven och den bourbonske kungen av Neapel återvände. I stället för tysk-romerska riket bildades ett Tyska förbundet med 39 stater under österrikiskt ordförandeskap. Uppgörelsen tog föga hänsyn till nationella känslor, men inget krig mellan stormakterna bröt ut igen förrän Krimkriget 1853.
