Napoleonic Wars: Napoleonkrigen
The wars between Napoleon’s France and its allies and changing coalitions of Britain, Austria, Prussia, Russia, Sweden and others. Napoleon’s victories over Austria and Prussia ended the Holy Roman Empire and remade the map of Germany until the allies drove him back across the Rhine in 1813; Sweden lost Swedish Pomerania in 1807 and, after the campaign of 1813, gained Norway from Denmark at Kiel in 1814. Britain’s victory at Trafalgar in 1805 left it master of the seas, and Napoleon’s blockade of its trade drew him into Spain and Russia; after the destruction of his army in Russia in 1812 and his defeat at Leipzig in 1813 he abdicated, and the Congress of Vienna and his final defeat at Waterloo in 1815 settled the map of Europe.: Krigen mellan Napoleons Frankrike med dess allierade och skiftande koalitioner av Storbritannien, Österrike, Preussen, Ryssland, Sverige och andra. Napoleons segrar över Österrike och Preussen gjorde slut på tysk-romerska riket och ritade om Tysklands karta, tills de allierade drev honom tillbaka över Rhen 1813. Sverige förlorade Svenska Pommern 1807 och fick efter fälttåget 1813 Norge från Danmark genom freden i Kiel 1814. Storbritanniens seger vid Trafalgar 1805 gjorde landet till härskare över haven, och Napoleons blockad av den brittiska handeln drog in honom i Spanien och Ryssland. Efter att hans armé förintats i Ryssland 1812 och han besegrats vid Leipzig 1813 abdikerade han, och Wienkongressen och hans slutliga nederlag vid Waterloo 1815 fastställde Europas karta.
