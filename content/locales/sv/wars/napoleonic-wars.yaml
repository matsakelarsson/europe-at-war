Napoleon left Elba with about 1,000 men and landed at Golfe-Juan near Cannes on 1 March 1815. He marched north through the Alps, avoiding royalist Provence, and at Laffrey, near Grenoble, the troops sent to stop him went over to him. Marshal Ney, who had promised Louis XVIII to bring him back in an iron cage, joined him too, and Napoleon entered Paris on 20 March as the king fled to Ghent. The powers meeting at the Congress of Vienna declared him an outlaw and each promised 150,000 men. Napoleon decided to strike first, at the two allied armies in Belgium, the British, Dutch and German army of the Duke of Wellington and the Prussian army of Blücher, before the Austrians and Russians could arrive.: Napoleon lämnade Elba med omkring 1 000 man och landsteg vid Golfe-Juan nära Cannes den 1 mars 1815. Han marscherade norrut genom Alperna och undvek det rojalistiska Provence, och vid Laffrey nära Grenoble gick de trupper som sänts för att stoppa honom över till honom. Marskalk Ney, som hade lovat Ludvig XVIII att föra honom tillbaka i en järnbur, anslöt sig också, och Napoleon tågade in i Paris den 20 mars medan kungen flydde till Gent. Makterna som var samlade vid Wienkongressen förklarade honom fredlös och lovade var och en 150 000 man. Napoleon beslöt att slå till först, mot de två allierade arméerna i Belgien, hertigen av Wellingtons brittiska, nederländska och tyska armé och Blüchers preussiska armé, innan österrikarna och ryssarna hann fram.
On 15 June the French crossed the Sambre at Charleroi. The next day Napoleon beat Blücher at Ligny while Ney held Wellington at Quatre Bras, but the Prussians fell back north to Wavre, staying within reach of Wellington. On 18 June Wellington’s army of about 68,000 held the ridge of Mont-Saint-Jean, south of Waterloo, against Napoleon’s 73,000 until the Prussians struck the French right in the afternoon; when the Imperial Guard’s last attack failed that evening, the French army broke. Napoleon abdicated again on 22 June, surrendered to the British on 15 July and was exiled to Saint Helena, where he died in 1821. The second Treaty of Paris on 20 November 1815 cut France back to its borders of 1790 and imposed an indemnity and an allied occupation.: Den 15 juni gick fransmännen över Sambre vid Charleroi. Dagen därpå slog Napoleon Blücher vid Ligny medan Ney höll Wellington stången vid Quatre Bras, men preussarna drog sig tillbaka norrut till Wavre och stannade inom räckhåll för Wellington. Den 18 juni höll Wellingtons armé på omkring 68 000 man åsen vid Mont-Saint-Jean söder om Waterloo mot Napoleons 73 000 tills preussarna på eftermiddagen anföll den franska högra flygeln; när kejserliga gardets sista anfall misslyckades på kvällen bröts den franska armén. Napoleon abdikerade på nytt den 22 juni, överlämnade sig till britterna den 15 juli och förvisades till Sankt Helena, där han dog 1821. Den andra freden i Paris den 20 november 1815 skar ned Frankrike till 1790 års gränser och ålade landet ett krigsskadestånd och en allierad ockupation.
