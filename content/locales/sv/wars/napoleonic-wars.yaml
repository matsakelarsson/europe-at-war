The steps on Trafalgar, Eylau, Friedland and Tilsit, the Continental System, the invasion of Russia, Leipzig and the Congress of Vienna were added later to tell the war as a European story. The Peninsular War and the invasion of Russia have their own pages.: Stegen om Trafalgar, Eylau, Friedland och Tilsit, kontinentalsystemet, invasionen av Ryssland, Leipzig och Wienkongressen lades till senare för att berätta kriget som en europeisk historia. Spanska självständighetskriget och invasionen av Ryssland har egna sidor.
Gustav IV Adolf, who loathed Napoleon, joined the Third Coalition in 1805. A British, Russian and Swedish force marched from Swedish Pomerania toward French-held Hanover, but the coalition fell apart after Austerlitz, and in November 1806 Swedish troops were caught up in the French storming of Lübeck.: Gustav IV Adolf, som avskydde Napoleon, anslöt sig 1805 till tredje koalitionen. En brittisk, rysk och svensk styrka marscherade från Svenska Pommern mot det fransk-ockuperade Hannover, men koalitionen föll samman efter Austerlitz, och i november 1806 drogs svenska trupper in i fransmännens stormning av Lübeck.
In January 1807 Marshal Mortier’s French army blockaded Stralsund. The garrison made a great sortie in April, but after the Peace of Tilsit the French returned in strength. Stralsund fell in August 1807, and Swedish Pomerania stayed under French occupation until 1810.: I januari 1807 blockerade marskalk Mortiers franska armé Stralsund. Garnisonen gjorde ett stort utfall i april, men efter freden i Tilsit återvände fransmännen med full styrka. Stralsund föll i augusti 1807, och Svenska Pommern förblev under fransk ockupation fram till 1810.
