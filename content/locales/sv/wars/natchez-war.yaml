# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
Natchez War: Natchezkriget
? The rising of the Natchez against French Louisiana and the French war that followed. The Natchez, whose towns lay along St. Catherine Creek near the Mississippi, were among the last peoples of the river ruled by a hereditary chief, the Great Sun. French tobacco plantations worked by enslaved Africans had spread over their land, and in 1729 the commandant of Fort Rosalie demanded the village of White Apple, with its temple and ancestral graves, for his own plantation. On 28 November 1729 the Natchez rose, killing about 230 French men, women and children at the fort and the plantations and taking the other women and children and most of the enslaved Africans captive; the Yazoo destroyed the French post on their river. The governor, Étienne Périer, struck back with Choctaw allies, who attacked the Natchez in January 1730, and a French siege of the Natchez forts; the Natchez escaped across the Mississippi. In January 1731 Périer besieged their new fort near Sicily Island, and about 500 Natchez who surrendered, among them the Great Sun, were shipped to Saint-Domingue and sold as slaves. The others found refuge among the Chickasaw, the Muscogee and the Cherokee, and the war led on to the French wars against the Chickasaw.
: Natchezfolkets resning mot Franska Louisiana och det franska krig som följde. Natchez, vars byar låg längs St. Catherine Creek nära Mississippi, var ett av de sista folken vid floden som styrdes av en ärftlig hövding, den Store solen. Franska tobaksplantager som brukades av förslavade afrikaner hade spritt sig över deras land, och 1729 krävde kommendanten i Fort Rosalie byn White Apple, med dess tempel och förfädersgravar, för sin egen plantage. Den 28 november 1729 reste sig natchez, dödade omkring 230 franska män, kvinnor och barn vid fortet och på plantagerna och tog de övriga kvinnorna och barnen och de flesta av de förslavade afrikanerna till fånga; yazoo förstörde den franska handelsstationen vid sin flod. Guvernören, Étienne Périer, slog tillbaka med hjälp av allierade choctaw, som anföll natchez i januari 1730, och med en fransk belägring av natchezfolkets fort; natchez flydde över Mississippi. I januari 1731 belägrade Périer deras nya fort nära Sicily Island, och omkring 500 natchez som kapitulerade, bland dem den Store solen, skeppades till Saint-Domingue och såldes som slavar. De övriga fann en tillflykt hos chickasaw, muscogee och cherokeser, och kriget ledde vidare till de franska krigen mot chickasaw.
