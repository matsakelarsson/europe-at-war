Nathu La and Cho La clashes: Sammandrabbningarna vid Nathu La och Cho La
Two armed clashes between Indian and Chinese troops in 1967 on the border between Sikkim, then an Indian protectorate, and Tibet. At the Nathu La pass, after weeks of scuffles over trenches and wire, fighting broke out on 11 September when Indian soldiers began laying barbed wire along the crest to mark the border. It grew into days of artillery and machine-gun duels, in which the Indian positions on the heights of Sebu La and Camel’s Back destroyed many Chinese bunkers, until the firing died down by 14–15 September. On 1 October a second clash at the Cho La pass, further north, ended with the Chinese pulling back. By Indian figures India lost 88 killed and 163 wounded and China about 340 killed and 450 wounded; Chinese figures give 32 Chinese and about 100 Indian dead. The clashes were India’s first success against China after 1962, and the Sikkim border stayed quiet for decades.: Två väpnade sammandrabbningar mellan indiska och kinesiska trupper 1967 vid gränsen mellan Sikkim, då ett indiskt protektorat, och Tibet. Vid passet Nathu La hade det i flera veckor förekommit handgemäng kring skyttegravar och taggtråd, och den 11 september bröt strider ut när indiska soldater började dra taggtråd längs krönet för att markera gränsen. De växte till flera dagars artilleri- och kulsprutedueller, där de indiska ställningarna på höjderna Sebu La och Camel’s Back förstörde många kinesiska bunkrar, tills skottlossningen ebbade ut den 14–15 september. Den 1 oktober slutade en andra sammandrabbning vid passet Cho La längre norrut med att kineserna drog sig tillbaka. Enligt indiska siffror förlorade Indien 88 döda och 163 sårade och Kina omkring 340 döda och 450 sårade; kinesiska siffror anger 32 kinesiska och omkring 100 indiska döda. Sammandrabbningarna var Indiens första framgång mot Kina efter 1962, och gränsen i Sikkim förblev lugn i årtionden.
India: Indien
China: Kina
