National Protection War: Nationella skyddskriget
? The war, also called the Anti-Monarchy War or Third Revolution, that ended Yuan Shikai’s attempt to make himself emperor. In December 1915 Yuan accepted the throne of a new Empire of China, with the reign name Hongxian from 1 January 1916. On 25 December 1915 the military leaders of Yunnan, Cai E and Tang Jiyao, with Li Liejun, declared the province independent at Kunming and raised the National Protection Army; the scholar Liang Qichao, Cai E’s former teacher, was among the organisers. Cai E led a small army into Sichuan, where it held its own against a much larger Beiyang force, about 80,000 men, in hard fighting around Luzhou and Naxi in February and March 1916. Guizhou joined in January and Guangxi under Lu Rongting in March, and Yuan’s own generals refused to support him. On 22 March 1916 Yuan gave up the monarchy and returned to the presidency, but more provinces, Guangdong, Zhejiang, Shaanxi, Sichuan and Hunan among them, declared independence, and in May the southern provinces set up a military council at Zhaoqing in Guangdong. Yuan died on 6 June 1916; Li Yuanhong succeeded him as president, the 1912 constitution was restored, and the southern provinces withdrew their declarations by 14 July. The war left the provinces in the hands of their military governors and opened the warlord era.
: Kriget, även kallat antimonarkistiska kriget eller tredje revolutionen, som gjorde slut på Yuan Shikais försök att göra sig själv till kejsare. I december 1915 tog Yuan emot tronen i det nya Kinesiska kejsardömet, med regeringsdevisen Hongxian från den 1 januari 1916. Den 25 december 1915 förklarade Yunnans militära ledare, Cai E och Tang Jiyao, tillsammans med Li Liejun provinsen oberoende i Kunming och satte upp Nationella skyddsarmén; den lärde Liang Qichao, Cai E:s tidigare lärare, var en av organisatörerna. Cai E ledde en liten armé in i Sichuan, där den höll stånd mot en mycket större Beiyangstyrka på omkring 80 000 man i hårda strider kring Luzhou och Naxi i februari och mars 1916. Guizhou anslöt sig i januari och Guangxi under Lu Rongting i mars, och Yuans egna generaler vägrade att stödja honom. Den 22 mars 1916 gav Yuan upp monarkin och återgick till presidentämbetet, men fler provinser, bland dem Guangdong, Zhejiang, Shaanxi, Sichuan och Hunan, förklarade sig oberoende, och i maj inrättade sydprovinserna ett militärråd i Zhaoqing i Guangdong. Yuan dog den 6 juni 1916; Li Yuanhong efterträdde honom som president, 1912 års författning återinfördes, och sydprovinserna drog tillbaka sina förklaringar senast den 14 juli. Kriget lämnade provinserna i händerna på deras militärguvernörer och inledde krigsherreeran.
