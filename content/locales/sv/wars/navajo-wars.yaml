Navajo Wars and the Long Walk: Navajokrigen och den långa vandringen
? The United States’ war of 1863–1864 against the Navajo (Diné) and their forced removal to Bosque Redondo, which ended with the treaty of 1868. Raids and counter-raids for livestock and captives between the Navajo, the New Mexicans, the Pueblos and the Ute had gone on for generations under Spanish and Mexican rule, and continued after the American conquest of New Mexico in 1846, with the killing of the Navajo leader Narbona during talks in 1849, a Navajo attack on Fort Defiance in 1860 and the killing of Navajo women and children at Fort Fauntleroy in 1861. In 1863 General James Carleton ordered the Navajo to surrender for removal to Bosque Redondo on the Pecos River, where he had already confined the Mescalero Apache. Colonel Christopher “Kit” Carson’s New Mexico volunteers and Ute scouts destroyed crops, orchards, homes and herds across the Navajo country, entering Canyon de Chelly in January 1864, while Ute and New Mexican raiders carried off Navajo women and children. Starving, some 8,000 to 9,000 people surrendered and were marched about 500 km east in more than fifty groups between 1864 and 1866, the Long Walk, on which at least 200 died. At Bosque Redondo (Hwéeldi), with brackish water, failed harvests, disease and raids, deaths during the march and the captivity are estimated at about 3,000, and up to 3,500 by some counts. Others held out in the canyons and mountains of the west, among them Manuelito, who surrendered in 1866. By the Treaty of Bosque Redondo of 1 June 1868, negotiated by Barboncito, the Navajo were allowed to return to part of their homeland, the beginning of today’s Navajo Nation.
: USA:s krig 1863–1864 mot navajo (diné) och deras tvångsförflyttning till Bosque Redondo, som slutade med fördraget 1868. Räder och vedergällningsräder efter boskap och fångar mellan navajo, nymexikanerna, puebloindianerna och ute hade pågått i generationer under spanskt och mexikanskt styre och fortsatte efter den amerikanska erövringen av New Mexico 1846, med dödandet av navajoledaren Narbona under förhandlingar 1849, ett navajoanfall mot Fort Defiance 1860 och dödandet av navajokvinnor och navajobarn vid Fort Fauntleroy 1861. År 1863 beordrade general James Carleton navajo att ge upp för att förflyttas till Bosque Redondo vid Pecosfloden, där han redan hade internerat mescaleroapacherna. Överste Christopher ”Kit” Carsons frivilliga från New Mexico och spanare ur ute förstörde grödor, fruktträdgårdar, hem och hjordar över hela navajolandet och tågade in i Canyon de Chelly i januari 1864, medan angripare ur ute och från New Mexico förde bort navajokvinnor och navajobarn. Svältande gav omkring 8 000 till 9 000 människor upp, och de fördes till fots omkring 500 km österut i mer än femtio grupper mellan 1864 och 1866, den långa vandringen, under vilken minst 200 dog. I Bosque Redondo (Hwéeldi) rådde bräckt vatten, misslyckade skördar, sjukdomar och räder, och dödsfallen under marschen och fångenskapen uppskattas till omkring 3 000, enligt vissa beräkningar upp till 3 500. Andra höll ut i kanjonerna och bergen i väster, bland dem Manuelito, som gav upp 1866. Genom fördraget i Bosque Redondo den 1 juni 1868, framförhandlat av Barboncito, fick navajo återvända till en del av sitt hemland, början till dagens Navajo Nation.
