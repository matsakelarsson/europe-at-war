Navarrese Civil War: Navarresiska inbördeskriget
A war in Navarre between King John II, who had ruled since the death of his wife Queen Blanche in 1441, and their son Charles, Prince of Viana, who by his grandparents’ marriage settlement should have inherited the kingdom. The nobility split into two parties, the Beaumonteses, who backed Charles, and the Agramonteses, who backed John. Castile, at odds with John, sent troops to help Charles. In 1451 John’s forces beat and captured Charles at Aibar; he was released in 1453, and in 1455 John disinherited him in favour of his daughter Eleanor and her husband, Gaston IV of Foix. Charles fled to France and then to his uncle Alfonso V at Naples. He was reconciled with his father only briefly, and his imprisonment and death in Barcelona in 1461 set off the Catalan Civil War. The feud between Beaumonteses and Agramonteses went on until the Castilian conquest of Upper Navarre in 1512.: "Ett krig i Navarra mellan kung Johan II, som hade regerat sedan hans hustru drottning Blanka dog 1441, och deras son Karl, prins av Viana, som enligt hans morföräldrars äktenskapsavtal borde ha ärvt kungariket. Adeln splittrades i två partier: beaumonteserna, som stödde Karl, och agramonteserna, som stödde Johan. Kastilien, som låg i konflikt med Johan, sände trupper till Karls hjälp. År 1451 besegrade Johans styrkor Karl vid Aibar och tog honom till fånga; han frigavs 1453, och 1455 gjorde Johan honom arvlös till förmån för sin dotter Eleonora och hennes make Gaston IV av Foix. Karl flydde till Frankrike och sedan till sin farbror Alfonso V i Neapel. Han försonades endast kortvarigt med sin far, och hans fängslande och död i Barcelona 1461 utlöste det katalanska inbördeskriget. Fejden mellan beaumonteser och agramonteser fortsatte till Kastiliens erövring av Övre Navarra 1512."
