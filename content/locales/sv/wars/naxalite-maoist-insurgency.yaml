# Svenska översättningar av katalogtexten (våg 8); stegtexterna kommer senare.
Naxalite–Maoist insurgency: Naxalit-maoistiska upproret
? The armed movement of India’s Maoist revolutionaries, called Naxalites after the village of Naxalbari in West Bengal, where a peasant rising in 1967 began it. The first wave, of land seizures and killings of landlords and police in West Bengal, Andhra Pradesh and Calcutta, was crushed by 1972. Regrouped in the forests of central and eastern India among the Adivasi (tribal) peoples, the movement merged in 2004 into the Communist Party of India (Maoist), whose guerrillas were active at their peak in some 180 districts of a “Red Corridor” and inflicted heavy losses on the security forces. A government-backed militia and large paramilitary offensives followed, and violence declined after 2010. In 2024 the government set a deadline of 31 March 2026 to end the insurgency; its forces killed the party’s general secretary in 2025, most other leaders were killed or surrendered, and in March 2026 the government declared the country free of the insurgency. The last active member of the party’s politburo was arrested in July 2026, but the party has not declared an end to its armed struggle. Last updated 27 November 2026.
: Den väpnade rörelsen bland Indiens maoistiska revolutionärer, kallade naxaliter efter byn Naxalbari i Västbengalen, där ett bondeuppror 1967 satte i gång den. Den första vågen, med jordockupationer och mord på godsägare och poliser i Västbengalen, Andhra Pradesh och Calcutta, var krossad 1972. Rörelsen samlade sig på nytt i skogarna i centrala och östra Indien bland adivasifolken (stamfolken) och gick 2004 samman i Indiens kommunistiska parti (maoistiska), vars gerillor när de var som starkast var aktiva i omkring 180 distrikt i en ”röd korridor” och tillfogade säkerhetsstyrkorna svåra förluster. Därefter följde en regeringsstödd milis och stora paramilitära offensiver, och våldet minskade efter 2010. År 2024 satte regeringen den 31 mars 2026 som slutdatum för upproret; dess styrkor dödade partiets generalsekreterare 2025, de flesta andra ledare dödades eller kapitulerade, och i mars 2026 förklarade regeringen landet fritt från upproret. Den sista aktiva medlemmen av partiets politbyrå greps i juli 2026, men partiet har inte förklarat sin väpnade kamp avslutad. Senast uppdaterad 27 november 2026.
