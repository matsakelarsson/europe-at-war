# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
Nayan’s rebellion: Nayans uppror
? The rising of the Mongol princes of the eastern wing against Kublai Khan in Manchuria. Nayan, a descendant of one of Genghis Khan’s brothers, probably Temüge, held large appanage lands between the Khingan mountains and the Liao river. In the spring of 1287 he rose with Shiktür, of the line of Qasar, and Qadan, of the line of Qachiun, and was in contact with Kaidu, who had been at war with Kublai since the 1260s. Kublai, then 72, sent his general Bayan to hold Karakorum so that Kaidu could not join the rebels, and marched into Manchuria himself with Mongol and Chinese troops, supplied by ships that sailed to the mouth of the Liao. Around 16 July 1287 his army surprised Nayan’s camp, protected by a ring of wagons, and after a morning’s fighting the rebels broke. Kublai, who directed the battle from a palanquin carried by elephants, had Nayan executed at once without shedding his blood, by having him rolled in a carpet. Nayan was a Christian of the Church of the East, and Marco Polo says his standards bore the cross. After the victory Kublai reorganised Manchuria as the province of Liaoyang. Qadan and other rebels fought on against Yuan troops in Liaodong, among them those of Kublai’s grandson Temür, and in 1290–1291 Qadan invaded Goryeo until a Yuan and Korean army defeated him at Yeongi in May 1291.
: Resningen bland de mongoliska furstarna i den östra flygeln mot Khubilai khan i Manchuriet. Nayan, en ättling till en av Djingis khans bröder, troligen Temüge, innehade stora apanageländer mellan Khinganbergen och floden Liao. Våren 1287 reste han sig tillsammans med Shiktür, av Qasars ätt, och Qadan, av Qachiuns ätt, och stod i förbindelse med Kaidu, som hade legat i krig med Khubilai sedan 1260-talet. Khubilai, då 72 år gammal, sände sin fältherre Bayan för att hålla Karakorum så att Kaidu inte kunde förena sig med rebellerna, och tågade själv in i Manchuriet med mongoliska och kinesiska trupper, försörjda av fartyg som seglade till Liaoflodens mynning. Omkring den 16 juli 1287 överrumplade hans armé Nayans läger, som skyddades av en ring av vagnar, och efter en förmiddags strider bröts rebellernas motstånd. Khubilai, som ledde slaget från en bärstol buren av elefanter, lät genast avrätta Nayan utan att utgjuta hans blod, genom att låta rulla in honom i en matta. Nayan var kristen och tillhörde Österns kyrka, och Marco Polo uppger att hans fanor bar korset. Efter segern omorganiserade Khubilai Manchuriet till provinsen Liaoyang. Qadan och andra rebeller fortsatte kampen mot Yuantrupperna i Liaodong, bland dem trupper under Khubilais sonson Temür, och 1290–1291 invaderade Qadan Goryeo, tills en armé från Yuan och Korea besegrade honom vid Yeongi i maj 1291.
