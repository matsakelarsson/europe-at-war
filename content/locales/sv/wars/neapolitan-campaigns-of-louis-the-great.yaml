Neapolitan campaigns of Louis the Great: Ludvig den stores neapolitanska fälttåg
Two invasions of the Kingdom of Naples by Louis I (the Great) of Hungary, to avenge his brother Andrew, husband of Queen Joanna I, who was murdered at Aversa in September 1345, and to claim the kingdom. Louis marched through Italy in late 1347, beat Joanna’s new husband Louis of Taranto at Capua on 11 January 1348 and entered Naples, after having Joanna’s cousin Charles of Durazzo executed at Aversa. Joanna fled to Provence and sold Avignon to the pope to pay for her return. The Black Death and the Neapolitans’ dislike of Hungarian rule drove Louis home that spring. He returned in 1350 and took Aversa after a long siege, but left again; after a papal court cleared Joanna of the murder, peace was made on 23 March 1352, leaving her the kingdom.: Två invasioner av Kungariket Neapel av Ludvig I (den store) av Ungern, för att hämnas sin bror Andreas, drottning Johanna I:s make, som mördades i Aversa i september 1345, och för att göra anspråk på kungariket. Ludvig marscherade genom Italien i slutet av 1347, besegrade Johannas nye make Ludvig av Taranto vid Capua den 11 januari 1348 och tågade in i Neapel, sedan han låtit avrätta Johannas kusin Karl av Durazzo i Aversa. Johanna flydde till Provence och sålde Avignon till påven för att bekosta sin återkomst. Digerdöden och neapolitanernas motvilja mot det ungerska styret drev hem Ludvig samma vår. Han återvände 1350 och tog Aversa efter en lång belägring, men drog sig åter tillbaka; sedan en påvlig domstol frikänt Johanna från mordet slöts fred den 23 mars 1352, och hon fick behålla kungariket.
