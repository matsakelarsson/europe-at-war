A rising against bread prices and taxes forced the viceroy of Sicily to abolish duties on food. It was put down later in the year.: Ett uppror mot brödpriser och skatter tvingade Siciliens vicekung att avskaffa tullarna på livsmedel. Det slogs ned senare samma år.
Piazza del Mercato: Piazza del Mercato
The revolt began in the city’s market square, where Masaniello later spoke to the crowds. Annese was beheaded here in June 1648.: Upproret började på stadens torg, där Masaniello senare talade till folkmassorna. Annese halshöggs här i juni 1648.
Castel Nuovo: Castel Nuovo
The viceroy held out in the harbour castle and the other fortresses above the city throughout the revolt.: Vicekungen höll ut i hamnborgen och de andra fästningarna ovanför staden under hela upproret.
Aversa: Aversa
early 1648: början av 1648
Guise took the town, base of the nobles’ army north of Naples, but could not open the roads to bring food into the city.: Guise intog staden, adelsarméns bas norr om Neapel, men kunde inte öppna vägarna för att föra in livsmedel i staden.
6 April 1648: 6 april 1648
Spanish troops under Don Juan José and the new viceroy, the Count of Oñate, took the city with little fighting.: Spanska trupper under Don Juan José och den nye vicekungen, greven av Oñate, intog staden nästan utan strid.
