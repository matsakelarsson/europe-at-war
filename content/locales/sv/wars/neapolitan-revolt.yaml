Neapolitan Revolt of 1647: Neapolitanska upproret 1647
A popular rising in Naples against Spanish rule and the taxes raised for Philip IV’s wars, first led by the young fisherman Masaniello. After his murder the revolt revived, and rebels proclaimed a Neapolitan Republic under French protection, led by the Duke of Guise; Spanish forces retook the city in April 1648.: Ett folkuppror i Neapel mot det spanska styret och de skatter som togs ut för Filip IV:s krig, till en början lett av den unge fiskaren Masaniello. Efter mordet på honom blossade upproret upp igen, och upprorsmännen utropade en neapolitansk republik under franskt beskydd, ledd av hertigen av Guise. Spanska styrkor återtog staden i april 1648.
