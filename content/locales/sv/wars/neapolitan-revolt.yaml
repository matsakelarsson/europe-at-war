Dates are Gregorian. Sicily had risen first, in Palermo in May 1647, and the revolt in Naples spread to the provinces, where peasants rose against their barons.: Datumen anges enligt den gregorianska kalendern. Sicilien hade rest sig först, i Palermo i maj 1647, och upproret i Neapel spred sig till provinserna, där bönderna reste sig mot sina baroner.
The Kingdom of Naples stays a separate polity on the base map, ruled by Spanish viceroys. The rebel republic held only the city and parts of the countryside and is not drawn.: Kungariket Neapel förblir en egen statsbildning på baskartan, styrd av spanska vicekungar. Upprorsrepubliken behärskade bara staden och delar av landsbygden och är inte utritad.
Naples, one of the largest cities in Europe, had been squeezed for decades to pay for Spain’s wars, and in 1647 the viceroy, the Duke of Arcos, put a new tax on fruit, the food of the poor. On 7 July a quarrel between fruit sellers and tax collectors in the market square turned into a riot. Led by Tommaso Aniello, called Masaniello, a 27-year-old fish seller, and advised by the old priest Giulio Genoino, crowds burned the tax offices and the houses of tax farmers, and Arcos took refuge in the castles. On 13 July he agreed to abolish the new taxes and pardon the rebels.: Neapel, en av Europas största städer, hade i årtionden pressats för att betala Spaniens krig, och 1647 införde vicekungen, hertigen av Arcos, en ny skatt på frukt, de fattigas föda. Den 7 juli övergick ett gräl mellan fruktförsäljare och skatteindrivare på torget till upplopp. Under ledning av Tommaso Aniello, kallad Masaniello, en 27-årig fiskhandlare, och med den gamle prästen Giulio Genoino som rådgivare brände folkmassorna skattekontoren och skattearrendatorernas hus, och Arcos tog sin tillflykt till borgarna. Den 13 juli gick han med på att avskaffa de nya skatterna och benåda upprorsmännen.
Masaniello, now ‘captain-general of the people’, began to behave erratically, and on 16 July he was killed by a band of armed men. In October a Spanish fleet under Don Juan José of Austria bombarded the city, which rose again, and on 22 October the gunsmith Gennaro Annese proclaimed a republic. Henry, Duke of Guise, who claimed descent from the Angevin kings of Naples, arrived in November to lead it. But the Spanish held the castles, and the barons controlled the provinces. On 6 April 1648, while Guise was outside the walls, Spanish troops entered the city with the help of rebels who had changed sides. Guise was captured, and Annese was executed in June.: Masaniello, nu ”folkets generalkapten”, började uppträda oberäkneligt, och den 16 juli dödades han av en grupp beväpnade män. I oktober bombarderade en spansk flotta under Don Juan José av Österrike staden, som reste sig igen, och den 22 oktober utropade vapensmeden Gennaro Annese en republik. Henrik, hertig av Guise, som hävdade att han härstammade från Neapels angevinska kungar, anlände i november för att leda den. Men spanjorerna höll borgarna och baronerna kontrollerade provinserna. Den 6 april 1648, medan Guise befann sig utanför murarna, tågade spanska trupper in i staden med hjälp av upprorsmän som hade bytt sida. Guise tillfångatogs, och Annese avrättades i juni.
