The leaders of the Nola rising, the lieutenants Michele Morelli and Giuseppe Silvati, were hanged in 1822. The revolution was one of several in southern Europe in 1820–1821, with those in Spain, Portugal and Piedmont.: Ledarna för upproret i Nola, löjtnanterna Michele Morelli och Giuseppe Silvati, hängdes 1822. Revolutionen var en av flera i södra Europa 1820–1821, tillsammans med dem i Spanien, Portugal och Piemonte.
