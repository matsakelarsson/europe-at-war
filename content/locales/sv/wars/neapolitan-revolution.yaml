Neapolitan Revolution of 1820–1821: Neapolitanska revolutionen 1820–1821
A constitutional revolution in the Kingdom of the Two Sicilies, ended by an Austrian army. On 1–2 July 1820 army officers and members of the secret society of the Carbonari rose at Nola, General Guglielmo Pepe joined them, and King Ferdinand I accepted a constitution modelled on the Spanish one of 1812. A separate rising in Palermo for Sicilian independence was put down by Neapolitan troops in the autumn. At the congresses of Troppau and Laibach the conservative powers of the Holy Alliance agreed to intervene, and Ferdinand, who had gone to Laibach, disowned the constitution. An Austrian army under General Johann Frimont marched south, routed Pepe’s forces near Rieti on 7 March 1821 and entered Naples on 23 March. Absolute rule was restored, the leaders of the rising were executed or exiled, and Austrian troops stayed in the kingdom until 1827.: En konstitutionell revolution i Kungariket Bägge Sicilierna som kvästes av en österrikisk armé. Den 1–2 juli 1820 reste sig arméofficerare och medlemmar av det hemliga sällskapet karbonarerna i Nola, general Guglielmo Pepe anslöt sig till dem, och kung Ferdinand I godtog en författning efter förebild av den spanska från 1812. Ett separat uppror i Palermo för sicilianskt oberoende slogs ned av neapolitanska trupper under hösten. Vid kongresserna i Troppau och Laibach enades Heliga alliansens konservativa makter om att ingripa, och Ferdinand, som hade rest till Laibach, tog avstånd från författningen. En österrikisk armé under general Johann Frimont marscherade söderut, slog Pepes styrkor på flykt nära Rieti den 7 mars 1821 och tågade in i Neapel den 23 mars. Envåldsstyret återinfördes, upprorets ledare avrättades eller landsförvisades, och österrikiska trupper stannade i kungariket till 1827.
