Murat’s last attempt to stop Nugent’s advance on Naples, at today’s Cassino, was called off as Bianchi’s army closed in.: Murats sista försök att stoppa Nugents frammarsch mot Neapel, vid dagens Cassino, avbröts när Bianchis armé närmade sig.
Signed at the Lanza family’s villa near Capua by General Pietro Colletta for Naples, Count Neipperg for Austria and Lord Burghersh for Britain. Its terms were mild, but it handed the kingdom back to the Bourbons.: Undertecknat i familjen Lanzas villa nära Capua av general Pietro Colletta för Neapel, greve Neipperg för Österrike och lord Burghersh för Storbritannien. Villkoren var milda, men fördraget lämnade tillbaka kungariket till bourbonerna.
