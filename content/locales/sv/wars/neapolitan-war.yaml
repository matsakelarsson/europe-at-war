Neapolitan War: Neapolitanska kriget
The war of 1815 in which Joachim Murat, King of Naples, sided with Napoleon during the Hundred Days, attacked Austria and called on Italians to rise for a united Italy. Beaten at Occhiobello and Tolentino, he lost his kingdom to the restored Bourbon Ferdinand IV by the Treaty of Casalanza, and was shot after a failed landing in Calabria in October.: Kriget 1815 där Joachim Murat, kung av Neapel, ställde sig på Napoleons sida under de hundra dagarna, anföll Österrike och uppmanade italienarna att resa sig för ett enat Italien. Efter nederlagen vid Occhiobello och Tolentino förlorade han genom fördraget i Casalanza sitt kungarike till den återinsatte bourbonen Ferdinand IV, och han arkebuserades efter en misslyckad landstigning i Kalabrien i oktober.
