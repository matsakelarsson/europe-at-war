8–9 April 1815: 8–9 april 1815
Murat’s attempt to cross the Po into Austrian Lombardy–Venetia failed after two days of fighting. It was the turning point of the war.: Murats försök att gå över Po in i det österrikiska Lombardiet–Venetien misslyckades efter två dagars strider. Det blev krigets vändpunkt.
Murat: Murat
Guard divisions: Gardesdivisioner
Murat fell back down the Adriatic coast, with Neipperg’s Austrian corps following, while Bianchi marched through Florence and over the Apennines to Foligno to cut off his retreat. Hoping to beat Bianchi before Neipperg arrived, Murat attacked him near Tolentino on 2 May. After two days of indecisive fighting he learned that Neipperg had beaten his rearguard at Scapezzano and was close, and he ordered a retreat that became a rout. With another Austrian force under Nugent coming down from Rome, and a British fleet off Naples, Murat fled in disguise. On 20 May his generals signed the Treaty of Casalanza near Capua, and on 23 May the Austrians entered Naples for King Ferdinand.: Murat drog sig tillbaka söderut längs Adriatiska kusten, följd av Neippergs österrikiska kår, medan Bianchi marscherade genom Florens och över Apenninerna till Foligno för att skära av hans reträtt. I hopp om att slå Bianchi innan Neipperg hann fram anföll Murat honom nära Tolentino den 2 maj. Efter två dagars oavgjorda strider fick han veta att Neipperg hade slagit hans eftertrupp vid Scapezzano och var nära, och han beordrade ett återtåg som urartade i vild flykt. Med ytterligare en österrikisk styrka under Nugent på väg söderut från Rom och en brittisk flotta utanför Neapel flydde Murat förklädd. Den 20 maj undertecknade hans generaler fördraget i Casalanza nära Capua, och den 23 maj tågade österrikarna in i Neapel för kung Ferdinands räkning.
Murat escaped to France and then to Corsica. In October he sailed for Calabria with some 30 followers, hoping to repeat Napoleon’s return from Elba. He landed at Pizzo on 8 October, but the people did not rally to him; he was seized and handed to Bourbon troops, condemned by a military court, and shot in the castle of Pizzo on 13 October 1815. In December 1816 Ferdinand united his two kingdoms of Naples and Sicily as the Kingdom of the Two Sicilies and became Ferdinand I. Murat’s campaign had failed, but it was the first war fought, at least in name, for Italian unity.: Murat flydde till Frankrike och sedan till Korsika. I oktober seglade han till Kalabrien med ett trettiotal anhängare i hopp om att upprepa Napoleons återkomst från Elba. Han landsteg i Pizzo den 8 oktober, men folket slöt inte upp kring honom; han greps och överlämnades till bourbonska trupper, dömdes av en krigsrätt och arkebuserades i borgen i Pizzo den 13 oktober 1815. I december 1816 förenade Ferdinand sina två kungariken Neapel och Sicilien till Kungariket Bägge Sicilierna och blev Ferdinand I. Murats fälttåg hade misslyckats, men det var det första krig som utkämpades, åtminstone till namnet, för Italiens enande.
