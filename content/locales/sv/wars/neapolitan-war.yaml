Also called the Austro-Neapolitan War. Britain, which protected the Bourbon court in Sicily and had never recognised Murat, declared war on him in April 1815.: Kallas även österrikisk-neapolitanska kriget. Storbritannien, som skyddade det bourbonska hovet på Sicilien och aldrig hade erkänt Murat, förklarade honom krig i april 1815.
Murat’s strength is uncertain; he claimed 82,000 men to encourage recruits, but the real figure was probably about 50,000.: Murats styrka är osäker; han uppgav 82 000 man för att locka rekryter, men den verkliga siffran var troligen omkring 50 000.
Joachim Murat, Napoleon’s brother-in-law and King of Naples since 1808, had deserted Napoleon in January 1814 by a treaty with Austria that let him keep his throne. But at the Congress of Vienna the Bourbons, and Britain, which had never recognised him, pressed for his removal. When Napoleon escaped from Elba, Murat sided with him again and declared war on Austria on 15 March 1815. He sent his two Guard divisions through the Papal States, and Pope Pius VII fled to Genoa, while he led his main army up the Adriatic coast from Ancona. At Rimini on 30 March he called on all Italians to rise and fight for an independent and united Italy.: Joachim Murat, Napoleons svåger och kung av Neapel sedan 1808, hade i januari 1814 övergett Napoleon genom ett fördrag med Österrike som lät honom behålla tronen. Men vid Wienkongressen drev bourbonerna och Storbritannien, som aldrig hade erkänt honom, på att han skulle avlägsnas. När Napoleon flydde från Elba ställde sig Murat åter på hans sida och förklarade Österrike krig den 15 mars 1815. Han sände sina två gardesdivisioner genom Kyrkostaten, och påven Pius VII flydde till Genua, medan han själv förde sin huvudarmé norrut längs Adriatiska kusten från Ancona. I Rimini uppmanade han den 30 mars alla italienare att resa sig och kämpa för ett självständigt och enat Italien.
Few answered. Murat’s troops took Bologna on 3 April and then beat the Austrian vanguard under General Bianchi on the Panaro near Modena, and his Guard divisions entered Florence. But the citadel of Ferrara held out against him, and when he tried to force a crossing of the Po at Occhiobello on 8–9 April, the main Austrian army under General Frimont threw him back with more than 2,000 casualties. Britain declared war and sent a fleet. On 12 April the Austrians drove the Neapolitans from their lines before Ferrara, and a few days later Murat ordered a general retreat.: Få hörsammade uppropet. Murats trupper intog Bologna den 3 april och slog sedan den österrikiska förtruppen under general Bianchi vid Panaro nära Modena, och hans gardesdivisioner tågade in i Florens. Men citadellet i Ferrara höll stånd mot honom, och när han försökte forcera Po vid Occhiobello den 8–9 april kastade den österrikiska huvudarmén under general Frimont tillbaka honom med mer än 2 000 man i förluster. Storbritannien förklarade krig och sände en flotta. Den 12 april drev österrikarna neapolitanerna från deras linjer framför Ferrara, och några dagar senare beordrade Murat ett allmänt återtåg.
