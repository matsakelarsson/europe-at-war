# Svenska översättningar av katalogtexten (våg 8); stegtexterna kommer senare.
Nepalese Civil War: Inbördeskriget i Nepal
The armed rebellion of the Communist Party of Nepal (Maoist), which launched a “People’s War” against the constitutional monarchy in 1996 from the hills of the mid-west. Drawing on rural poverty and caste and ethnic exclusion, the Maoists spread their control over much of the countryside. After the royal massacre of 2001 the army was sent in and the war grew much bloodier, with large attacks on district towns, extrajudicial killings and disappearances. King Gyanendra’s seizure of absolute power in 2005 drove the parliamentary parties into an alliance with the Maoists; a popular uprising in April 2006 forced him to restore parliament, and the Comprehensive Peace Accord of November 2006 ended the war. More than 17,000 people were killed and about 1,300 disappeared. The Maoists entered the government, and in 2008 an elected assembly abolished the monarchy.: Det väpnade upproret av Nepals kommunistiska parti (maoistiska), som 1996 inledde ett ”folkkrig” mot den konstitutionella monarkin från bergen i mellersta västra Nepal. Maoisterna byggde på fattigdomen på landsbygden och på utestängning på grund av kast och etnisk tillhörighet och utsträckte sin kontroll över stora delar av landsbygden. Efter kungamassakern 2001 sattes armén in och kriget blev mycket blodigare, med stora angrepp på distriktsstäder, utomrättsliga avrättningar och försvinnanden. När kung Gyanendra 2005 tog sig absolut makt drev det de parlamentariska partierna in i en allians med maoisterna; ett folkligt uppror i april 2006 tvingade honom att återinsätta parlamentet, och det omfattande fredsavtalet i november 2006 avslutade kriget. Mer än 17 000 människor dödades och omkring 1 300 försvann. Maoisterna gick in i regeringen, och 2008 avskaffade en vald församling monarkin.
