Nepalese revolution of 1950–1951: Revolutionen i Nepal 1950–1951
The rising that ended the rule of the Rana family, hereditary prime ministers who had governed Nepal since 1846 while the Shah kings were kept as figureheads. On 6 November 1950 King Tribhuvan took refuge in the Indian embassy in Kathmandu and was flown to Delhi four days later; the Ranas declared his three-year-old grandson Gyanendra king. On 11 November the Liberation Army of the Nepali Congress, formed in India by B. P. Koirala and others, attacked from across the Indian border and took Birgunj, and fighting spread to the Terai towns and the hills of the east and west, where some local garrisons and officials went over to the rebels. Under Indian pressure the Rana prime minister, Mohan Shumsher, accepted a settlement negotiated in Delhi. Tribhuvan returned to Kathmandu on 15 February 1951 and on 18 February proclaimed a new order under a coalition of Ranas and the Nepali Congress, with elections promised.: Resningen som gjorde slut på Ranafamiljens styre. Familjens medlemmar hade som ärftliga premiärministrar styrt Nepal sedan 1846, medan kungarna av Shahdynastin hölls kvar som galjonsfigurer. Den 6 november 1950 tog kung Tribhuvan sin tillflykt till den indiska ambassaden i Katmandu och flögs fyra dagar senare till Delhi; Ranafamiljen utropade hans treårige sonson Gyanendra till kung. Den 11 november anföll Nepalesiska kongresspartiets befrielsearmé, som bildats i Indien av B. P. Koirala med flera, från andra sidan den indiska gränsen och intog Birgunj, och striderna spred sig till städerna i Terai och till bergen i öster och väster, där en del lokala garnisoner och ämbetsmän gick över till rebellerna. Under indiska påtryckningar godtog Ranapremiärministern Mohan Shumsher en uppgörelse som förhandlats fram i Delhi. Tribhuvan återvände till Katmandu den 15 februari 1951 och utropade den 18 februari en ny ordning under en koalition av Ranafamiljen och Nepalesiska kongresspartiet, med löfte om val.
