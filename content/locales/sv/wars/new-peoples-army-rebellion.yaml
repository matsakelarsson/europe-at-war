# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
New People’s Army rebellion: Nya folkarméns uppror
? "The Maoist “people’s war” of the Communist Party of the Philippines (CPP) and its New People’s Army (NPA), one of the longest communist insurgencies in the world. Re-founded in December 1968 by José Maria Sison, the party formed the NPA on 29 March 1969 in Tarlac with a few dozen fighters. Under Ferdinand Marcos’s martial law (1972–1981) it grew into a guerrilla army of perhaps 25,000 by the mid-1980s, active in most provinces, while bloody internal purges and the end of the dictatorship in 1986 began its decline. A split in 1992, decades of on-and-off peace talks with Norway as facilitator, a terrorist designation by the government in 2017 and sustained military pressure reduced it to a few thousand and then, by government counts, to a few hundred fighters in scattered remnants. Estimates of the dead since 1969 run to about 40,000. Last updated 27 November 2026: the government says the NPA has been all but defeated and refuses to resume talks, the CPP insists its armed struggle continues, and clashes still occur, notably in Negros."
: "Filippinernas kommunistiska partis (CPP) och dess Nya folkarmés (NPA) maoistiska ”folkkrig”, en av de längsta kommunistiska upprorsrörelserna i världen. Partiet, som grundades på nytt i december 1968 av José Maria Sison, bildade NPA den 29 mars 1969 i Tarlac med några dussin kämpar. Under Ferdinand Marcos krigslagar (1972–1981) växte NPA till en gerillaarmé på kanske 25 000 man i mitten av 1980-talet, aktiv i de flesta provinser, medan blodiga interna utrensningar och diktaturens slut 1986 inledde dess nedgång. En splittring 1992, årtionden av fredssamtal som återupptogs och avbröts om vartannat, med Norge som facilitator, regeringens terroriststämpling 2017 och ihållande militärt tryck minskade den till några tusen och sedan, enligt regeringens siffror, till några hundra kämpar i spridda rester. Uppskattningarna av antalet döda sedan 1969 uppgår till omkring 40 000. Senast uppdaterad 27 november 2026: regeringen säger att NPA i stort sett är besegrad och vägrar återuppta samtalen, CPP hävdar att dess väpnade kamp fortsätter, och sammandrabbningar förekommer fortfarande, särskilt på Negros."
