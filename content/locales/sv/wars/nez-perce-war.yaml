# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
Nez Perce War: Nez percé-kriget
? The war of June–October 1877 between the non-treaty bands of the Nez Perce (Nimiipuu), with a small band of Palouse, and the United States Army, a fighting retreat of about 1,900 km from Idaho to within 64 km of the Canadian border. The treaty of 1855 had left the Nez Perce a reservation of some 7.5 million acres, but after gold was found on it the treaty of 1863, signed by leaders of other bands, cut it by nine-tenths. The bands that had not signed, among them the Wallowa band of Joseph (Hinmatóowyalahtqit) and his brother Ollokot, refused to leave their land, and in May 1877 General Oliver Otis Howard ordered them onto the reservation within thirty days. On 14–15 June young men of White Bird’s band killed settlers on the Salmon River in revenge for earlier killings, and on 17 June the Nez Perce routed the troops sent against them at White Bird Canyon. After the battle of the Clearwater some 750 people, about 250 of them fighting men, crossed the Lolo Trail into Montana with more than 2,000 horses, hoping for help from the Crow. At the Big Hole on 9 August Colonel John Gibbon’s troops attacked their sleeping camp, killing many women and children, but the warriors held the soldiers off while the camp escaped. The Nez Perce crossed Yellowstone National Park and, refused by the Crow, turned north to join Sitting Bull in Canada, but Colonel Nelson Miles caught them at the Bears Paw Mountains on 30 September. After a five-day siege Joseph surrendered on 5 October 1877, while White Bird and some 150 to 200 others escaped to Canada. The 418 who surrendered were sent not home, as Miles had promised, but to Kansas and Indian Territory; in 1885 the 268 survivors were allowed back to the Northwest.
: Kriget i juni–oktober 1877 mellan de grupper av nez percé (nimiipuu) som stod utanför fördragen, tillsammans med en liten grupp palouse, och USA:s armé, en stridande reträtt på omkring 1 900 km från Idaho till 64 km från den kanadensiska gränsen. Fördraget 1855 hade lämnat nez percé ett reservat på omkring 7,5 miljoner acres, men sedan guld hade hittats där skar fördraget 1863, undertecknat av ledare för andra grupper, ned det med nio tiondelar. De grupper som inte hade undertecknat, bland dem Wallowagruppen under Joseph (Hinmatóowyalahtqit) och hans bror Ollokot, vägrade lämna sitt land, och i maj 1877 beordrade general Oliver Otis Howard dem att flytta in på reservatet inom trettio dagar. Den 14–15 juni dödade unga män ur White Birds grupp nybyggare vid Salmon River som hämnd för tidigare mord, och den 17 juni slog nez percé de trupper som sänts mot dem på flykten vid White Bird Canyon. Efter slaget vid Clearwater gick omkring 750 människor, varav omkring 250 stridande män, över Lolo Trail in i Montana med mer än 2 000 hästar i hopp om hjälp från crow. Vid Big Hole den 9 augusti anföll överste John Gibbons trupper deras sovande läger och dödade många kvinnor och barn, men krigarna höll soldaterna stången medan lägret tog sig undan. Nez percé korsade Yellowstone nationalpark och vände, sedan crow hade avvisat dem, norrut för att ansluta sig till Sitting Bull i Kanada, men överste Nelson Miles hann upp dem vid Bears Paw Mountains den 30 september. Efter en fem dagar lång belägring gav Joseph upp den 5 oktober 1877, medan White Bird och omkring 150 till 200 andra flydde till Kanada. De 418 som gav upp sändes inte hem, som Miles hade lovat, utan till Kansas och Indianterritoriet; 1885 fick de 268 överlevande återvända till nordvästra USA.
