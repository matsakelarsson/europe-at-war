# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
Nian Rebellion: Nianupproret
A rising of armed bands, the Nian, in the Huaibei region of northern Anhui and the neighbouring parts of Henan, Shandong and Jiangsu, at the same time as the Taiping Rebellion. Poverty, raiding and the disastrous floods of the Yellow River, which broke its banks in 1851 and changed its course to the north in 1855, swelled the bands, which raided far and wide from fortified villages. In 1856 they formed an alliance under Zhang Lexing, who accepted titles from the Taiping. The Mongol general Senggelinqin defeated and executed Zhang in 1863, but Taiping veterans reorganised the Nian as a fast-moving cavalry army that killed Senggelinqin in 1865. Zeng Guofan’s strategy of hemming them in with fortified river lines was carried through by Li Hongzhang and Zuo Zongtang, and in 1868 the Eastern Nian were destroyed in Shandong and Jiangsu and the Western Nian, after a raid towards Beijing, in north-western Shandong.: En resning av beväpnade skaror, nian, i Huaibeiregionen i norra Anhui och angränsande delar av Henan, Shandong och Jiangsu, samtidigt med Taipingupproret. Fattigdom, plundring och de katastrofala översvämningarna från Gula floden, som bröt sina vallar 1851 och ändrade sitt lopp norrut 1855, fick skarorna att växa, och de gjorde räder vida omkring från befästa byar. År 1856 bildade de en allians under Zhang Lexing, som tog emot titlar från taipingregimen. Den mongoliske generalen Senggelinqin besegrade och avrättade Zhang 1863, men taipingveteraner organiserade om nian till en snabbrörlig kavalleriarmé som dödade Senggelinqin 1865. Zeng Guofans strategi att innesluta dem med befästa flodlinjer fullföljdes av Li Hongzhang och Zuo Zongtang, och 1868 förintades östra nian i Shandong och Jiangsu och västra nian, efter en räd mot Peking, i nordvästra Shandong.
