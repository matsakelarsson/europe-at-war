On the map the Empire of Nicaea is shown as the continuation of the Byzantine Empire, which is how it saw itself. The main source is the Nicaean official George Akropolites, who was taken prisoner by the Epirotes and later served Michael VIII.: På kartan visas Kejsardömet Nicaea som en fortsättning på Bysantinska riket, vilket var så det såg på sig självt. Huvudkällan är den nikaianske ämbetsmannen Georgios Akropolites, som togs till fånga av epiroterna och senare tjänade Mikael VIII.
Alliances shifted constantly. Bulgaria fought both Nicaea and the Latins at different times, and Epirus was a rival of Nicaea for the Byzantine inheritance; the battle of Klokotnitsa (1230) has its own entry.: Allianserna skiftade ständigt. Bulgarien bekämpade både Nikaia och latinarna vid olika tillfällen, och Epirus var Nikaias rival om det bysantinska arvet; slaget vid Klokotnitsa (1230) har en egen artikel.
