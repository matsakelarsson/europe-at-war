15 October 1211: 15 oktober 1211
The emperor Henry beat the Nicaean army, weakened by its losses against the Seljuks, near the river.: Kejsar Henrik slog den nikaianska armén, försvagad av sina förluster mot seldjukerna, nära floden.
The first treaty between the two empires, which divided north-western Asia Minor between them.: Det första fördraget mellan de två kejsardömena, som delade nordvästra Mindre Asien mellan dem.
Fought near a church of the Archangel Michael. The Nicaean army was close to defeat until Vatatzes led a charge himself, according to Akropolites.: Utkämpat nära en kyrka helgad åt ärkeängeln Mikael. Enligt Akropolites var den nikaianska armén nära nederlaget tills Vatatzes själv ledde ett anfall.
December 1224: december 1224
Theodore Komnenos Doukas of Epirus took the capital of the Latin kingdom of Thessalonica and soon had himself crowned emperor.: Theodoros Komnenos Dukas av Epirus intog huvudstaden i det latinska kungariket Thessalonike och lät snart kröna sig till kejsare.
The city’s Greeks invited in Nicaean troops, but Theodore of Epirus arrived and forced them to leave.: Stadens greker släppte in nikaianska trupper, men Theodoros av Epirus anlände och tvingade dem att lämna staden.
