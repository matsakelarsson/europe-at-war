Nicaean success: Nikaianska framgångar
After 1204 Theodore Laskaris built a Byzantine state in exile at Nicaea, and in 1208 he was crowned emperor. The Latins, who claimed north-western Asia Minor, beat him at Poimanenon in 1204 and on the Rhyndacus in 1211, just after he had defeated the Seljuks of Rum at Antioch on the Meander, where their sultan was killed. The Treaty of Nymphaeum of 1214 divided the region, leaving the Latins the coast from Nicomedia to Adramyttion. When Theodore died in 1221, his son-in-law John III Doukas Vatatzes succeeded him.: Efter 1204 byggde Theodoros Laskaris upp en bysantinsk exilstat i Nikaia, och 1208 kröntes han till kejsare. Latinarna, som gjorde anspråk på nordvästra Mindre Asien, slog honom vid Poimanenon 1204 och vid Rhyndakos 1211, strax efter att han hade besegrat rumseldjukerna vid Antiochia vid Maiandros, där deras sultan stupade. Fördraget i Nymfaion 1214 delade upp området och lämnade kusten från Nikomedia till Adramyttion åt latinarna. När Theodoros dog 1221 efterträddes han av sin svärson Johannes III Dukas Vatatzes.
Theodore’s brothers Alexios and Isaac Laskaris, who had opposed the succession, fled to the Latins, and in 1224 a Latin army marched with them against Vatatzes. At Poimanenon, south of Cyzicus, Vatatzes won a decisive victory, and the two brothers were captured and blinded. In the peace of 1225 the Latins gave up all their lands in Asia except the shore opposite Constantinople and the region of Nicomedia. The Nicaean fleet took Lesbos, Chios, Samos and other islands, and Nicaean troops entered Adrianople, but had to hand it over to Theodore Komnenos Doukas of Epirus, who had taken Thessalonica in 1224.: Theodoros bröder Alexios och Isaak Laskaris, som hade motsatt sig tronföljden, flydde till latinarna, och 1224 marscherade en latinsk armé med dem mot Vatatzes. Vid Poimanenon, söder om Kyzikos, vann Vatatzes en avgörande seger, och de två bröderna tillfångatogs och bländades. I freden 1225 gav latinarna upp alla sina områden i Asien utom stranden mitt emot Konstantinopel och trakten kring Nikomedia. Den nikaianska flottan tog Lesbos, Chios, Samos och andra öar, och nikaianska trupper tågade in i Adrianopel men måste överlämna staden till Theodoros Komnenos Dukas av Epirus, som hade intagit Thessalonike 1224.
