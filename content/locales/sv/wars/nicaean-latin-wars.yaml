Nicaean–Latin wars: Nikaiansk-latinska krigen
The long struggle between the Empire of Nicaea, the main Byzantine successor state, and the Latin Empire of Constantinople. After early Latin successes, John III Vatatzes beat the Latins at Poimanenon in 1224 and drove them from Asia Minor; with Bulgaria he besieged Constantinople in vain in 1235–1236. Michael VIII Palaiologos defeated the Latins of Greece and their allies at Pelagonia in 1259, and his general Alexios Strategopoulos took Constantinople almost without a fight on 25 July 1261, restoring the Byzantine Empire.: Den långa kampen mellan Nikaiariket, den viktigaste bysantinska efterträdarstaten, och Latinska kejsardömet i Konstantinopel. Efter tidiga latinska framgångar besegrade Johannes III Vatatzes latinarna vid Poimanenon 1224 och drev ut dem ur Mindre Asien; tillsammans med Bulgarien belägrade han förgäves Konstantinopel 1235–1236. Mikael VIII Palaiologos besegrade latinarna i Grekland och deras allierade vid Pelagonia 1259, och hans general Alexios Strategopoulos tog Konstantinopel nästan utan strid den 25 juli 1261, varmed Bysantinska riket återupprättades.
