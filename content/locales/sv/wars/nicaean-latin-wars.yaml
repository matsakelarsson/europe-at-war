The alliance was sealed here with the marriage of Asen’s daughter Helena to Vatatzes’s son Theodore, and a church council recognised the Bulgarian patriarchate.: Alliansen beseglades här genom att Asens dotter Helena gifte sig med Vatatzes son Theodoros, och ett kyrkomöte erkände det bulgariska patriarkatet.
The small Latin garrison under the elderly John of Brienne held the land walls, while Italian and Achaean fleets saved the city by sea.: Den lilla latinska garnisonen under den åldrige Johan av Brienne höll landmurarna, medan italienska och achaiska flottor räddade staden från sjösidan.
