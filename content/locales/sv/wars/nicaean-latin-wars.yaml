Vatatzes took Thessalonica in 1246 and much of Macedonia from Bulgaria and Epirus. In 1258 the general Michael Palaiologos became regent for the boy emperor John IV Laskaris, and soon co-emperor. Against him gathered Michael II of Epirus, William II of Villehardouin, prince of Achaea, and Manfred of Sicily, who sent German knights. In 1259 the Nicaean army under Michael’s brother John Palaiologos met them at Pelagonia in western Macedonia. The allies fell out, Michael II and his son left the field, and the Nicaeans destroyed the Achaean and German knights. William was captured and in 1262 gave up the fortresses of Mistras, Monemvasia and Maina as his ransom.: Vatatzes intog Thessalonike 1246 och stora delar av Makedonien från Bulgarien och Epirus. År 1258 blev generalen Mikael Palaiologos förmyndare för den unge kejsaren Johannes IV Laskaris och snart medkejsare. Mot honom samlades Mikael II av Epirus, Vilhelm II av Villehardouin, furste av Achaia, och Manfred av Sicilien, som sände tyska riddare. År 1259 mötte den nikaianska armén under Mikaels bror Johannes Palaiologos dem vid Pelagonia i västra Makedonien. De allierade blev oense, Mikael II och hans son lämnade slagfältet, och nikaianerna förintade de achaiska och tyska riddarna. Vilhelm tillfångatogs och lämnade 1262 fästningarna Mistras, Monemvasia och Maina som lösen.
Constantinople, held by a small Latin garrison and the Venetian fleet, was now isolated. In March 1261 Michael VIII allied with Genoa, Venice’s rival, by the Treaty of Nymphaeum. In July the general Alexios Strategopoulos, passing near the city with some 800 soldiers, learned that the Venetian fleet and much of the garrison had sailed to attack the Nicaean-held island of Daphnousia in the Black Sea. On the night of 24–25 July his men slipped in through a passage near the Gate of the Spring and opened the gates, and the city was taken almost without a fight. Baldwin II fled on a Venetian ship. Michael VIII entered Constantinople on 15 August 1261.: Konstantinopel, som hölls av en liten latinsk garnison och den venetianska flottan, var nu isolerat. I mars 1261 slöt Mikael VIII förbund med Genua, Venedigs rival, genom fördraget i Nymfaion. I juli fick generalen Alexios Strategopoulos, som passerade nära staden med omkring 800 soldater, veta att den venetianska flottan och en stor del av garnisonen hade seglat iväg för att anfalla den nikaianskt kontrollerade ön Dafnousia i Svarta havet. Natten mellan den 24 och 25 juli tog sig hans män in genom en gång nära Källporten och öppnade portarna, och staden intogs nästan utan strid. Balduin II flydde på ett venetianskt fartyg. Mikael VIII tågade in i Konstantinopel den 15 augusti 1261.
