After Ivan Asen II of Bulgaria crushed Theodore of Epirus at Klokotnitsa in 1230, Bulgaria was the strongest power in the Balkans. The Latin barons, who had hinted that Asen might become regent for their boy emperor Baldwin II, chose instead the aged John of Brienne, a former king of Jerusalem, as co-emperor. In 1235 Asen allied with Vatatzes. Asen’s daughter married Vatatzes’s son, the Bulgarian Church was recognised as a patriarchate, and Vatatzes crossed into Europe and took Gallipoli and the Latin lands in Thrace.: Sedan Ivan Asen II av Bulgarien krossat Theodoros av Epirus vid Klokotnitsa 1230 var Bulgarien den starkaste makten på Balkan. De latinska baronerna, som hade antytt att Asen kunde bli förmyndare för deras unge kejsare Balduin II, valde i stället den åldrige Johan av Brienne, en tidigare kung av Jerusalem, till medkejsare. År 1235 slöt Asen förbund med Vatatzes. Asens dotter gifte sig med Vatatzes son, den bulgariska kyrkan erkändes som patriarkat, och Vatatzes gick över till Europa och intog Gallipoli och de latinska områdena i Thrakien.
In 1235 and again in 1236 the allies besieged Constantinople by land and sea. John of Brienne, with a few hundred knights, held the walls, and fleets from Venice, Achaea, Genoa and Pisa broke the Nicaean blockade and destroyed many of its ships. Asen, who had come to fear that a Nicaean Constantinople would be a stronger neighbour than a Latin one, changed sides in 1237, then made peace with Vatatzes again. The Latin Empire survived, but it was now little more than the city itself, kept alive by Venetian ships and Western money; Baldwin II pawned the Crown of Thorns and even his own son to Venetian merchants.: År 1235 och på nytt 1236 belägrade de allierade Konstantinopel till lands och till sjöss. Johan av Brienne höll murarna med några hundra riddare, och flottor från Venedig, Achaia, Genua och Pisa bröt den nikaianska blockaden och förstörde många av dess fartyg. Asen, som hade börjat frukta att ett nikaianskt Konstantinopel skulle bli en starkare granne än ett latinskt, bytte sida 1237 men slöt sedan åter fred med Vatatzes. Latinska kejsardömet överlevde, men det var nu inte mycket mer än själva staden, som hölls vid liv av venetianska fartyg och västerländska pengar; Balduin II pantsatte törnekronan och till och med sin egen son hos venetianska köpmän.
