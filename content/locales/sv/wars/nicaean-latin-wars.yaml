The Venetian fleet sailed to attack this island off the Black Sea coast of Bithynia, leaving Constantinople nearly undefended.: Den venetianska flottan seglade iväg för att anfalla denna ö utanför Bithyniens Svartahavskust och lämnade Konstantinopel nästan oförsvarat.
Strategopoulos’s men entered at night, helped by Greek townspeople. The Latin emperor fled, and the returning Venetian fleet could only evacuate the Latin inhabitants.: Strategopoulos män tog sig in om natten med hjälp av grekiska stadsbor. Den latinske kejsaren flydde, och den återvändande venetianska flottan kunde bara evakuera de latinska invånarna.
