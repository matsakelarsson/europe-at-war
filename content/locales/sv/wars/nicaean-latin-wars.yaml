The city’s leading citizens opened the gates to Vatatzes, ending Epirote rule there.: Stadens ledande borgare öppnade portarna för Vatatzes, vilket gjorde slut på det epirotiska styret där.
Deserted by the Epirotes, the Latin knights were surrounded and cut down or captured, among them Prince William of Achaea, found hiding under a haystack, Akropolites says.: De latinska riddarna, övergivna av epiroterna, omringades och höggs ned eller tillfångatogs, bland dem furst Vilhelm av Achaia, som enligt Akropolites hittades gömd under en höstack.
