Ivan Asen II beat and captured Theodore of Epirus, ending his bid to take Constantinople and making Bulgaria the leading Balkan power.: Ivan Asen II besegrade och tillfångatog Theodoros av Epirus, vilket gjorde slut på hans försök att ta Konstantinopel och gjorde Bulgarien till den ledande makten på Balkan.
