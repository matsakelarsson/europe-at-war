# Svenska översättningar av katalogtexten (våg 13); stegtexterna kommer senare.
Nigerian Civil War: Nigerianska inbördeskriget
? The war between the Federal Military Government of Nigeria and the Republic of Biafra, the state proclaimed by the former Eastern Region, also called the Biafran War. Two coups in 1966 and the massacres of thousands of Igbo and other easterners in the North that year drove the east, led by its military governor Lieutenant Colonel Odumegwu Ojukwu, to break away; Ojukwu declared Biafra independent on 30 May 1967, three days after the federal head of state, Lieutenant Colonel Yakubu Gowon, divided the region into three states. Federal troops attacked in July 1967. A Biafran thrust into the Midwest reached Ore, within about 210 km of Lagos, in August, but was driven back, and the federal army took Enugu, Calabar, Onitsha and, in May 1968, Port Harcourt, cutting Biafra off from the sea. Under a federal blockade the shrinking enclave suffered a famine that relief flights to the airstrip at Uli could only partly relieve; most of the war’s dead were civilians who died of hunger and disease, with estimates ranging from about 500,000 to 3 million. A final federal offensive in January 1970 broke Biafra’s resistance; Ojukwu left for Côte d’Ivoire, and his deputy, Philip Effiong, surrendered in Lagos on 15 January 1970.
: Kriget mellan Nigerias federala militärregering och Republiken Biafra, den stat som utropades av den tidigare östra regionen, även kallat Biafrakriget. Två kupper 1966 och massakrerna samma år på tusentals igbo och andra östnigerianer i norr drev östra regionen, under ledning av sin militärguvernör överstelöjtnant Odumegwu Ojukwu, till utbrytning; Ojukwu förklarade Biafra självständigt den 30 maj 1967, tre dagar efter att den federala statschefen, överstelöjtnant Yakubu Gowon, hade delat regionen i tre delstater. Federala trupper anföll i juli 1967. En biafransk stöt in i Mellanvästregionen nådde i augusti Ore, bara omkring 210 km från Lagos, men drevs tillbaka, och den federala armén intog Enugu, Calabar, Onitsha och, i maj 1968, Port Harcourt, varigenom Biafra skars av från havet. Under en federal blockad drabbades den krympande enklaven av en hungersnöd som hjälpflygningarna till flygfältet i Uli bara delvis kunde lindra; de flesta av krigets döda var civila som dog av svält och sjukdomar, och uppskattningarna sträcker sig från omkring 500 000 till 3 miljoner. En sista federal offensiv i januari 1970 bröt Biafras motstånd; Ojukwu reste till Elfenbenskusten, och hans ställföreträdare Philip Effiong kapitulerade i Lagos den 15 januari 1970.
