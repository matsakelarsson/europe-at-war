# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
Nine Armies War (Burmese–Siamese War of 1785–1787): De nio arméernas krig (burmesisk-siamesiska kriget 1785–1787)
? "King Bodawpaya’s attempt to conquer Siam, three years after Rama I had founded Bangkok and the Chakri dynasty. Fresh from the conquest of Arakan, Bodawpaya sent nine armies, about 144,000 men by the count of the Thai chronicles, against Siam from five directions in the dry season of 1785–1786: through the Three Pagodas Pass to Kanchanaburi, by the Bong Ti pass to Ratchaburi, from Chiang Saen against Lampang, through Tak into the upper Chao Phraya valley, and by sea against Thalang and the peninsula. The Siamese, outnumbered, concentrated their forces against the main army. Rama I’s brother, the Front Palace prince Maha Sura Singhanat, held the Burmese at Lat Ya, the old site of Kanchanaburi, cut their supply lines and broke them on 18 February 1786; on 21 February Bodawpaya ordered a general retreat. Lampang held under Kawila until relieved, the Burmese were beaten at Pakphing in March, and on Phuket the widow Chan and her sister Muk led the defence of Thalang until the Burmese withdrew on 13 March 1786. A second, smaller invasion under the crown prince Thado Minsaw was defeated at Tha Din Daeng and Samsop near the Three Pagodas Pass in early 1787. These were the last full-scale Burmese invasions of Siam, though the war left the western borderlands depopulated for decades."
: "Kung Bodawpayas försök att erövra Siam, tre år efter att Rama I hade grundat Bangkok och Chakridynastin. Direkt efter erövringen av Arakan sände Bodawpaya nio arméer, omkring 144 000 man enligt de thailändska krönikornas siffror, mot Siam från fem håll under torrperioden 1785–1786: genom Tre pagodernas pass till Kanchanaburi, genom Bong Ti-passet till Ratchaburi, från Chiang Saen mot Lampang, genom Tak in i övre Chao Phraya-dalen och sjövägen mot Thalang och halvön. Siameserna, som var i numerärt underläge, koncentrerade sina styrkor mot huvudarmén. Rama I:s bror, Främre palatsets prins Maha Sura Singhanat, höll burmeserna stången vid Lat Ya, där det gamla Kanchanaburi låg, skar av deras underhållslinjer och krossade dem den 18 februari 1786; den 21 februari beordrade Bodawpaya allmän reträtt. Lampang höll ut under Kawila tills staden undsattes, burmeserna slogs vid Pakphing i mars, och på Phuket ledde änkan Chan och hennes syster Muk försvaret av Thalang tills burmeserna drog sig tillbaka den 13 mars 1786. En andra, mindre invasion under kronprinsen Thado Minsaw besegrades vid Tha Din Daeng och Samsop nära Tre pagodernas pass i början av 1787. Detta var de sista fullskaliga burmesiska invasionerna av Siam, även om kriget lämnade de västra gränsområdena avfolkade i årtionden."
