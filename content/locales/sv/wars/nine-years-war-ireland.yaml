In 1599 Elizabeth sent the Earl of Essex with the largest English army yet seen in Ireland, about 16,000 men. He spent months in Leinster and Munster while his troops dwindled through disease and desertion, and on 15 August O’Donnell destroyed a column at the Curlew Pass. Essex agreed a truce with O’Neill and went home against orders. His successor, Lord Mountjoy, who arrived in 1600, waged a different war. He planted garrisons deep in Ulster, at Derry on Lough Foyle and along the Blackwater, campaigned through the winter, and destroyed crops and cattle so as to starve the country into submission.: År 1599 sände Elisabet earlen av Essex med den största engelska armé som dittills setts på Irland, omkring 16 000 man. Han tillbringade månader i Leinster och Munster medan hans trupper decimerades av sjukdomar och desertering, och den 15 augusti förintade O’Donnell en kolonn vid Curlew Pass. Essex slöt stillestånd med O’Neill och reste hem mot order. Hans efterträdare, lord Mountjoy, som anlände 1600, förde ett annat slags krig. Han förlade garnisoner djupt in i Ulster, vid Derry vid Lough Foyle och längs Blackwater, förde fälttåg genom vintern och förstörde grödor och boskap för att svälta landet till underkastelse.
In September 1601 about 3,500 Spanish soldiers under Juan del Águila landed at Kinsale, at the far end of Ireland from O’Neill’s country. Mountjoy besieged them, and O’Neill and O’Donnell marched the length of the island in winter to relieve the town. On 24 December 1601 their army was caught as it moved into position, and Mountjoy’s cavalry broke it. Del Águila surrendered on terms and sailed home with his men in early 1602. O’Donnell went to Spain to plead for more help and died there that September.: I september 1601 landsteg omkring 3 500 spanska soldater under Juan del Águila vid Kinsale, i motsatta änden av Irland från O’Neills land. Mountjoy belägrade dem, och O’Neill och O’Donnell marscherade vintertid genom hela ön för att undsätta staden. Den 24 december 1601 överraskades deras armé medan den intog sina ställningar, och Mountjoys kavalleri bröt den. Del Águila kapitulerade på villkor och seglade hem med sina män i början av 1602. O’Donnell reste till Spanien för att be om mer hjälp och dog där i september samma år.
