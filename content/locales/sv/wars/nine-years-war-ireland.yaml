After Kinsale the confederacy fell apart. In the south Sir George Carew took Dunboy, the O’Sullivan castle on Bantry Bay, in June 1602 and hanged most of its defenders. In midwinter Donal Cam O’Sullivan Beare led about 1,000 of his people north from Glengarriff, fighting off attacks across Munster and Connacht, to O’Rourke’s country in Leitrim; about 35 arrived. In Ulster Mountjoy’s armies burned crops, killed cattle and broke the stone chair at Tullaghoge on which the O’Neills had been inaugurated. Famine killed many thousands, and O’Neill retreated into the woods of Glenconkeyne.: Efter Kinsale föll konfederationen samman. I söder intog Sir George Carew i juni 1602 Dunboy, släkten O’Sullivans borg vid Bantry Bay, och hängde de flesta av försvararna. Mitt i vintern ledde Donal Cam O’Sullivan Beare omkring 1 000 av sitt folk norrut från Glengarriff, under ständiga strider genom Munster och Connacht, till O’Rourkes land i Leitrim; omkring 35 kom fram. I Ulster brände Mountjoys arméer grödor, dödade boskap och slog sönder stenstolen i Tullaghoge, där släkten O’Neills hövdingar hade invigts. Hungersnöd dödade många tusen, och O’Neill drog sig tillbaka till skogarna i Glenconkeyne.
On 30 March 1603, at Mellifont Abbey near Drogheda, O’Neill submitted to Mountjoy, not knowing that Elizabeth had died six days before. The terms were lenient. He kept most of his lands as Earl of Tyrone but gave up the Gaelic title of The O’Neill and his power over lesser lords, and Ulster came under English law and sheriffs, completing the Tudor conquest of Ireland. In 1607 O’Neill, O’Donnell’s brother and other northern lords left for the Continent in the Flight of the Earls, and their lands were confiscated for the Plantation of Ulster.: Den 30 mars 1603 underkastade sig O’Neill Mountjoy i klostret Mellifont nära Drogheda, utan att veta att Elisabet hade dött sex dagar tidigare. Villkoren var milda. Han behöll de flesta av sina besittningar som earl av Tyrone men gav upp den gaeliska titeln The O’Neill och sin makt över lägre stormän, och Ulster kom under engelsk lag och engelska sheriffer, vilket fullbordade Tudorernas erövring av Irland. År 1607 lämnade O’Neill, O’Donnells bror och andra nordliga stormän landet för kontinenten i den så kallade earlernas flykt, och deras jord konfiskerades för koloniseringen av Ulster.
