Nine Years’ War in Ireland: Nioårskriget på Irland
A war between a confederacy of Gaelic Irish lords, led by Hugh O’Neill, Earl of Tyrone, and Hugh Roe O’Donnell, and the English crown, which was extending its rule into Ulster, the last part of Ireland under Gaelic lordship. The Irish won at Clontibret and the Yellow Ford, but after Lord Mountjoy’s scorched-earth campaign and the defeat of the Irish and their Spanish allies at Kinsale in 1601, O’Neill submitted at Mellifont in 1603, completing the Tudor conquest of Ireland.: Ett krig mellan en konfederation av gaeliska irländska stormän, ledd av Hugh O’Neill, earl av Tyrone, och Hugh Roe O’Donnell, och den engelska kronan, som höll på att utsträcka sitt styre till Ulster, den sista delen av Irland under gaeliskt herravälde. Irländarna segrade vid Clontibret och Yellow Ford, men efter lord Mountjoys fälttåg med bränd jords taktik och irländarnas och deras spanska allierades nederlag vid Kinsale 1601 underkastade sig O’Neill i Mellifont 1603, vilket fullbordade Tudorernas erövring av Irland.
