Also called Tyrone’s Rebellion. Dates are Old Style, as used by the English in Ireland; the Spanish at Kinsale used the Gregorian calendar, ten days ahead, so the battle there is also dated 3 January 1602.: Kallas även Tyrones uppror. Datumen anges enligt gamla stilen, som engelsmännen använde på Irland; spanjorerna vid Kinsale använde den gregorianska kalendern, tio dagar före, så slaget där dateras också till 3 januari 1602.
The war began with Hugh Maguire’s rising in Fermanagh in 1593; O’Neill joined openly only in 1595. It was also part of the wider Anglo-Spanish War of 1585–1604.: Kriget började med Hugh Maguires uppror i Fermanagh 1593; O’Neill anslöt sig öppet först 1595. Det var också en del av det större engelsk-spanska kriget 1585–1604.
After the Tudor conquest of Munster and Connacht, English sheriffs, garrisons and officials pressed into Ulster, the last region still ruled by Gaelic lords. In 1593 Hugh Maguire of Fermanagh rose against a newly appointed sheriff, and in August 1594 his men ambushed a column bringing supplies to the English garrison of Enniskillen. Hugh O’Neill, Earl of Tyrone, brought up at the English court but the most powerful lord in Ulster, kept in the background while he trained a modern army of musketeers and pikemen. In 1595 he joined openly with Hugh Roe O’Donnell, lord of Tír Chonaill, and in May ambushed Sir Henry Bagenal’s column at Clontibret.: Efter Tudorernas erövring av Munster och Connacht trängde engelska sheriffer, garnisoner och ämbetsmän in i Ulster, det sista område som fortfarande styrdes av gaeliska stormän. År 1593 reste sig Hugh Maguire av Fermanagh mot en nyutnämnd sheriff, och i augusti 1594 överföll hans män en kolonn som förde förnödenheter till den engelska garnisonen i Enniskillen. Hugh O’Neill, earl av Tyrone, som hade fostrats vid det engelska hovet men var den mäktigaste stormannen i Ulster, höll sig i bakgrunden medan han övade upp en modern armé av musketerare och pikenerare. År 1595 gjorde han öppet gemensam sak med Hugh Roe O’Donnell, herre över Tír Chonaill, och i maj överföll han Sir Henry Bagenals kolonn vid Clontibret.
Truces and talks alternated with fighting while O’Neill sought help from Spain. On 14 August 1598 Bagenal led about 4,000 men from Armagh to relieve the besieged Blackwater Fort. At the Yellow Ford O’Neill’s army cut the column apart; Bagenal was shot dead, a powder wagon exploded, and about 1,500 English soldiers were killed. It was the worst defeat English arms had suffered in Ireland. The fort surrendered, many lords who had stayed neutral joined O’Neill, and in October revolt swept through Munster. The English settlers there fled to the walled towns, among them the poet Edmund Spenser, whose castle at Kilcolman was burned.: Stillestånd och förhandlingar växlade med strider medan O’Neill sökte hjälp från Spanien. Den 14 augusti 1598 ledde Bagenal omkring 4 000 man från Armagh för att undsätta det belägrade Blackwater Fort. Vid Yellow Ford skar O’Neills armé sönder kolonnen; Bagenal sköts ihjäl, en kruttvagn exploderade och omkring 1 500 engelska soldater dödades. Det var det värsta nederlag engelska vapen hade lidit på Irland. Fortet kapitulerade, många stormän som hade hållit sig neutrala anslöt sig till O’Neill, och i oktober svepte revolten genom Munster. De engelska kolonisterna där flydde till de befästa städerna, bland dem poeten Edmund Spenser, vars borg i Kilcolman brändes.
