Also called the War of the Grand Alliance, the War of the League of Augsburg and the War of the Palatine Succession. Its campaigns in Ireland (the Williamite War) and Scotland (the Jacobite rising of 1689) have their own entries; those in Italy, Catalonia and North America (King William’s War) are not shown here.: Kallas även nioårskriget, Stora alliansens krig och Augsburgska förbundets krig. Fälttågen på Irland (vilhelmitiska kriget) och i Skottland (jakobitupproret 1689) har egna artiklar; de i Italien, Katalonien och Nordamerika (kung Vilhelms krig) visas inte här.
Dates are New Style (Gregorian), as used on the Continent. English accounts give Old Style dates, ten days earlier; Beachy Head, for example, was 30 June 1690 Old Style.: Datumen anges enligt nya stilen (den gregorianska kalendern), som användes på kontinenten. Engelska framställningar anger datum enligt gamla stilen, tio dagar tidigare; slaget vid Beachy Head stod till exempel den 30 juni 1690 enligt gamla stilen.
Louis XIV wanted the Emperor, victorious against the Ottomans since the siege of Vienna, to turn the twenty-year Truce of Ratisbon into a permanent peace that would confirm the reunions, and he claimed part of the Palatinate for his sister-in-law, the Duchess of Orléans. In late September 1688 French armies crossed the Rhine, besieged Philippsburg, which fell on 30 October, and occupied Mainz, Heidelberg, Mannheim and much of the Rhineland, expecting a short war. Instead William of Orange sailed for England, and the German princes, the Emperor, the Dutch and England combined against France.: Ludvig XIV ville att kejsaren, som segrat mot osmanerna sedan belägringen av Wien, skulle omvandla det tjugoåriga stilleståndet i Regensburg till en varaktig fred som bekräftade reunionerna, och han gjorde anspråk på en del av Pfalz för sin svägerska, hertiginnan av Orléans. I slutet av september 1688 gick franska arméer över Rhen, belägrade Philippsburg, som föll den 30 oktober, och besatte Mainz, Heidelberg, Mannheim och stora delar av Rhenlandet i förväntan om ett kort krig. I stället seglade Vilhelm av Oranien till England, och de tyska furstarna, kejsaren, holländarna och England gick samman mot Frankrike.
To deny the allied armies food and shelter, the war minister Louvois ordered the systematic destruction of the land the French could not hold. In the winter and spring of 1689 French troops burned Mannheim, Heidelberg, Speyer, Worms, Oppenheim and dozens of other towns and villages, driving out their people. The devastation united Germany against Louis and was remembered there for centuries. In May 1689 the Emperor and the Dutch formed the Grand Alliance, which England soon joined, and that year the allies beat a French army at Walcourt on 25 August, retook Mainz on 8 September and Bonn in October.: För att beröva de allierade arméerna föda och tak över huvudet beordrade krigsministern Louvois systematisk förstörelse av de områden fransmännen inte kunde hålla. Under vintern och våren 1689 brände franska trupper Mannheim, Heidelberg, Speyer, Worms, Oppenheim och dussintals andra städer och byar och drev bort invånarna. Ödeläggelsen enade Tyskland mot Ludvig och mindes där i århundraden. I maj 1689 bildade kejsaren och holländarna Stora alliansen, som England snart anslöt sig till, och samma år slog de allierade en fransk armé vid Walcourt den 25 augusti, återtog Mainz den 8 september och Bonn i oktober.
