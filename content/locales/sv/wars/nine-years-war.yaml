Luxembourg won his last great victory at Neerwinden (Landen) on 29 July 1693, one of the bloodiest battles of the century, and took Charleroi in October. But France was exhausted. The harvest failures of 1693–1694 caused a famine that killed perhaps 1.3 million people in France, and the navy turned from fleet battles to privateering. In 1695 William besieged Namur, defended by Marshal Boufflers, and took the citadel at the start of September. To draw him off, Marshal Villeroi bombarded Brussels on 13–15 August, destroying thousands of buildings around the Grand Place.: Luxembourg vann sin sista stora seger vid Neerwinden (Landen) den 29 juli 1693, ett av århundradets blodigaste slag, och intog Charleroi i oktober. Men Frankrike var utmattat. Missväxten 1693–1694 orsakade en hungersnöd som kanske dödade 1,3 miljoner människor i Frankrike, och flottan övergick från flottslag till kaperi. År 1695 belägrade Vilhelm Namur, som försvarades av marskalk Boufflers, och intog citadellet i början av september. För att locka bort honom bombarderade marskalk Villeroi Bryssel den 13–15 augusti och förstörde tusentals byggnader kring Grand-Place.
Savoy made a separate peace in 1696, and in 1697 the French took Ath and Barcelona. Peace talks met at Rijswijk near The Hague, and the Peace of Ryswick was signed on 20 September 1697 with the Dutch, England and Spain, and on 30 October with the Emperor. Louis recognised William as king, returned Luxembourg, Mons, Charleroi, Courtrai and the Catalan conquests to Spain, gave Lorraine back to its duke and gave up Freiburg, Breisach and Philippsburg on the right bank of the Rhine, but kept Strasbourg and the rest of Alsace. The Dutch won the right to garrison fortresses in the Spanish Netherlands.: Savojen slöt separatfred 1696, och 1697 intog fransmännen Ath och Barcelona. Fredsförhandlingar inleddes i Rijswijk nära Haag, och freden i Rijswijk undertecknades den 20 september 1697 med holländarna, England och Spanien och den 30 oktober med kejsaren. Ludvig erkände Vilhelm som kung, lämnade tillbaka Luxemburg, Mons, Charleroi, Kortrijk och de katalanska erövringarna till Spanien, gav Lothringen tillbaka till dess hertig och gav upp Freiburg, Breisach och Philippsburg på Rhens högra strand, men behöll Strasbourg och resten av Elsass. Holländarna fick rätt att förlägga garnisoner i fästningar i Spanska Nederländerna.
