In the Spanish Netherlands, the main theatre of the war, Marshal Luxembourg crushed the allied army of the Prince of Waldeck at Fleurus on 1 July 1690. Nine days later Admiral Tourville’s fleet beat the Anglo-Dutch fleet off Beachy Head, where the Dutch squadron suffered most, and for a time France commanded the Channel. But William’s victory at the Boyne the next day secured Ireland for him. In 1691 Louis took Mons, and in June 1692 Namur, after a siege directed by Vauban.: I Spanska Nederländerna, krigets huvudskådeplats, krossade marskalk Luxembourg furst Waldecks allierade armé vid Fleurus den 1 juli 1690. Nio dagar senare slog amiral Tourvilles flotta den engelsk-nederländska flottan utanför Beachy Head, där den nederländska eskadern led mest, och en tid behärskade Frankrike Engelska kanalen. Men Vilhelms seger vid Boyne dagen därpå säkrade Irland åt honom. År 1691 intog Ludvig Mons och i juni 1692 Namur, efter en belägring ledd av Vauban.
Louis planned to land James II in England with a French and Irish army in 1692. Tourville, ordered to fight whatever the odds, met a much larger Anglo-Dutch fleet under Edward Russell off Cape Barfleur on 29 May. He held it off, but in the retreat many of his ships were trapped, and at La Hogue on 2–4 June English boats burned twelve French ships of the line in sight of James and his army. The invasion was abandoned. On land Luxembourg beat William again at Steenkerque on 3 August 1692.: Ludvig planerade att 1692 landsätta Jakob II i England med en fransk och irländsk armé. Tourville, som hade order att strida oavsett styrkeförhållandena, mötte en mycket större engelsk-nederländsk flotta under Edward Russell utanför Kap Barfleur den 29 maj. Han höll den stången, men under reträtten blev många av hans fartyg instängda, och vid La Hogue den 2–4 juni brände engelska båtar tolv franska linjeskepp inför ögonen på Jakob och hans armé. Invasionen övergavs. Till lands slog Luxembourg åter Vilhelm vid Steenkerque den 3 augusti 1692.
