Nine Years’ War: Pfalziska tronföljdskriget
A war between Louis XIV’s France and a European coalition, the Grand Alliance, led by William III of the Dutch Republic and England, fought in the Spanish Netherlands, on the Rhine, in Italy and Catalonia, at sea, in Ireland and in North America. After the devastation of the Palatinate and years of costly sieges, the Peace of Ryswick in 1697 made France give back most of its gains since 1678, except Strasbourg, and recognise William as King of England.: Ett krig mellan Ludvig XIV:s Frankrike och en europeisk koalition, Stora alliansen, ledd av Vilhelm III av Nederländska republiken och England, som utkämpades i Spanska Nederländerna, vid Rhen, i Italien och Katalonien, till sjöss, på Irland och i Nordamerika. Efter Pfalz ödeläggelse och år av kostsamma belägringar tvingade freden i Rijswijk 1697 Frankrike att lämna tillbaka större delen av sina erövringar sedan 1678, utom Strasbourg, och att erkänna Vilhelm som kung av England.
