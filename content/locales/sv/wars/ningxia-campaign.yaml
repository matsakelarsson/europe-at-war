# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
Ningxia campaign: Fälttåget i Ningxia
? A rising of the Ming garrison at Ningxia, on the Yellow River at the north-western frontier, put down after a siege of six months; it is counted as the first of the Wanli Emperor’s Three Great Campaigns. Its leading figure was Pubei, a Mongol chief from the Chahar who had gone over to the Ming at the end of the Jiajing reign (before 1567) with a few hundred followers and risen to be regional vice commander of Ningxia, with a guard of some 3,000 men. Long disputes over pay and supplies with the grand coordinator Dang Xin ended in late March 1592, when soldiers led by Liu Dongyang killed Dang Xin and took the city, with Pubei as their adviser and his son Bo Cheng’en as a deputy. The rebels, 20,000 to 30,000 strong, took 47 forts around Ningxia and brought in Ordos Mongols under Jorightu. Ming forces under Wei Xuezeng retook the forts but failed in assaults on the city in May and July, even after Li Rusong arrived with reinforcements at the end of July and Ye Mengxiong with artillery and Miao troops. Under Ye Mengxiong the besiegers then built a dike about 5 km long around the city and flooded it from September; an attempt by 18,000 Mongols to relieve it was driven off. On 12 October the water broke through the walls and Ming troops entered, and on 20 October 1592 the city was taken. The rebel leaders had already turned on each other; Pubei killed himself, and Bo Cheng’en surrendered and was executed. Many of the troops were then sent with Li Rusong to fight the Japanese in Korea.
: Ett uppror bland Minggarnisonen i Ningxia, vid Gula floden på den nordvästra gränsen, som slogs ned efter en sex månader lång belägring; det räknas som det första av Wanlikejsarens tre stora fälttåg. Dess ledande gestalt var Pubei, en mongolhövding från chahar som hade gått över till Ming i slutet av Jiajings regering (före 1567) med några hundra följeslagare och stigit till biträdande regionbefälhavare i Ningxia, med en livvakt på omkring 3 000 man. Långvariga tvister om sold och förnödenheter med storkoordinatorn Dang Xin fick sitt slut i slutet av mars 1592, när soldater under Liu Dongyang dödade Dang Xin och intog staden, med Pubei som rådgivare och hans son Bo Cheng’en som ställföreträdare. Rebellerna, 20 000 till 30 000 man starka, intog 47 fort kring Ningxia och kallade in ordosmongoler under Jorightu. Mingstyrkor under Wei Xuezeng återtog forten men misslyckades med stormningarna av staden i maj och juli, även sedan Li Rusong hade anlänt med förstärkningar i slutet av juli och Ye Mengxiong med artilleri och miaotrupper. Under Ye Mengxiong byggde belägrarna sedan en omkring 5 km lång damm runt staden och dämde över den från september; ett försök av 18 000 mongoler att undsätta den slogs tillbaka. Den 12 oktober bröt vattnet igenom murarna och Mingtrupperna trängde in, och den 20 oktober 1592 var staden intagen. Rebelledarna hade redan vänt sig mot varandra; Pubei tog livet av sig, och Bo Cheng’en kapitulerade och avrättades. Många av trupperna sändes sedan med Li Rusong för att bekämpa japanerna i Korea.
