Ninth Crusade: Nionde korståget
The expedition of the Lord Edward, heir to the English throne and later Edward I, who reached Acre in May 1271 with about a thousand men after his uncle Louis IX died at Tunis. He raided Mamluk territory and tried to work with the Mongol Ilkhan Abaqa, whose horsemen raided around Aleppo, but could not stop Sultan Baibars, and in May 1272 the Kingdom of Jerusalem made a ten-year truce with him at Caesarea. Edward survived an assassin’s poisoned dagger in June 1272 and sailed home that September, learning on the way that his father had died.: Expeditionen under lord Edvard, arvtagare till den engelska tronen och senare Edvard I, som nådde Akko i maj 1271 med omkring tusen man efter att hans farbror Ludvig IX dött i Tunis. Han gjorde räder in på mamlukiskt område och försökte samarbeta med den mongoliske ilkhanen Abaqa, vars ryttare härjade kring Aleppo, men kunde inte stoppa sultan Baibars, och i maj 1272 slöt Kungariket Jerusalem ett tioårigt stillestånd med honom i Caesarea. Edvard överlevde en lönnmördares förgiftade dolk i juni 1272 och seglade hem i september samma år; på vägen fick han veta att hans far hade dött.
