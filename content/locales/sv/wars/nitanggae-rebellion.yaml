# Svenska översättningar av katalogtexten (våg 10); stegtexterna kommer senare.
Nitanggae’s rebellion: Nitanggaes uppror
? A rising of the Jurchens of the Tumen valley against Joseon, the largest conflict on the northern frontier since the six garrisons were set up there in the 15th century. In early 1583 Ueulji, a Jurchen chief living under Korean protection, attacked the outpost of Asanbo, and with some ten thousand horsemen took and plundered the town of Gyeongwon and the forts around it. Sin Rip, the magistrate of Onseong, broke the siege of Hunyung and pursued the raiders across the Tumen. In the early summer Nitanggae, another chief settled at Hoeryeong, united several Jurchen groups and attacked Jongseong from three sides with perhaps twenty thousand men; the scattered Korean garrisons were overrun one by one, but Jongseong held with its firearms, and Nitanggae fell back when a rival chief raided his villages, then attacked Donggwan. Other Jurchen chiefs fought on the Korean side. Ueulji was captured and beheaded in the seventh lunar month and Nitanggae fled. The court punished the commanders who had lost Gyeongwon, and the experience led Joseon to replace its system of local garrison commands with the jeseung bangnyak, the gathering of provincial troops under commanders sent from the capital, which it used against Japan in 1592. Sin Rip, Yi Il and Yi Sun-sin all gained their first experience of war on this frontier.
: En resning bland jurchenerna i Tumendalen mot Joseon, den största konflikten vid den norra gränsen sedan de sex garnisonerna hade inrättats där på 1400-talet. I början av 1583 angrep Ueulji, en jurchenhövding som levde under koreanskt beskydd, utposten Asanbo och intog och plundrade med omkring tiotusen ryttare staden Gyeongwon och fästena runt den. Sin Rip, magistrat i Onseong, bröt belägringen av Hunyung och förföljde angriparna över Tumen. På försommaren enade Nitanggae, en annan hövding som var bosatt vid Hoeryeong, flera jurchengrupper och angrep Jongseong från tre håll med kanske tjugotusen man; de spridda koreanska garnisonerna överrändes en efter en, men Jongseong höll stånd med sina eldvapen, och Nitanggae drog sig tillbaka när en rivaliserande hövding plundrade hans byar och angrep därefter Donggwan. Andra jurchenhövdingar stred på den koreanska sidan. Ueulji tillfångatogs och halshöggs i sjunde månmånaden och Nitanggae flydde. Hovet straffade de befälhavare som hade förlorat Gyeongwon, och erfarenheten fick Joseon att ersätta sitt system med lokala garnisonskommandon med jeseung bangnyak, samlingen av provinstrupper under befälhavare som sändes från huvudstaden, ett system som Joseon använde mot Japan 1592. Sin Rip, Yi Il och Yi Sun-sin fick alla sin första krigserfarenhet vid denna gräns.
