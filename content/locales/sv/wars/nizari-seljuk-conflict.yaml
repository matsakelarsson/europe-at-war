Nizari–Seljuk conflict: Nizaritisk-seldjukiska konflikten
The struggle between the Seljuk sultans and the Nizari Ismailis of Iran, led by Hasan-i Sabbah, who seized the mountain castle of Alamut in 1090 and built a state of scattered fortresses in the Alborz, in Quhistan and near Isfahan. A Seljuk army failed to take Alamut in 1092, and in the same year the vizier Nizam al-Mulk was killed, the first of the assassinations for which the Nizaris became notorious. They gained more castles during the Seljuk succession wars. Sultan Muhammad Tapar took Shahdiz near Isfahan in 1107 and laid waste the country around Alamut for years, but his siege of Alamut was abandoned when he died in 1118, and the Nizari state survived.: Kampen mellan de seldjukiska sultanerna och de nizaritiska ismailiterna i Iran, ledda av Hasan-i Sabbah, som 1090 intog bergsborgen Alamut och byggde upp en stat av spridda fästningar i Alborz, i Quhistan och nära Isfahan. En seldjukisk armé misslyckades med att inta Alamut 1092, och samma år dödades vesiren Nizam al-Mulk, det första av de mord som nizariterna blev ökända för. De vann fler borgar under de seldjukiska tronföljdskrigen. Sultanen Muhammad Tapar intog Shahdiz nära Isfahan 1107 och ödelade under flera år trakterna kring Alamut, men hans belägring av Alamut avbröts när han dog 1118, och den nizaritiska staten överlevde.
