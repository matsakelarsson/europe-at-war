# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
Nong Zhigao’s rebellion: Nong Zhigaos uppror
? The rising of Nong Zhigao (Nùng Trí Cao), a chief of the Tai-speaking Nong clan of the hills on today’s border between Guangxi and Vietnam, ancestors of the Zhuang and the Nùng. Caught between the Lý emperors of Đại Việt, who had killed his father and twice crushed his attempts to found a kingdom, and the Song, which refused to accept him as a vassal, he proclaimed the Kingdom of the Great South (Danan) in 1052. With a few thousand followers who had burned their own villages, he took Yongzhou (Nanning), swept down the West River and besieged Guangzhou, the greatest port of the Song, for 57 days with an army that had grown to some 50,000. Failing to take it, he fell back to Yongzhou and beat several Song armies sent against him. Early in 1053 the Song general Di Qing, a veteran of the wars with the Xia, crossed the Kunlun Pass by night and routed the rebels outside Yongzhou. Nong Zhigao fled to the Dali kingdom, where his fate is unknown; his mother and sons were captured and executed. He is honoured today as a hero by many Zhuang and Nùng.
: Den resning som leddes av Nong Zhigao (Nùng Trí Cao), hövding för den taispråkiga Nongklanen i bergstrakterna vid dagens gräns mellan Guangxi och Vietnam, förfäder till zhuang och nùng. Klämd mellan Lýkejsarna i Đại Việt, som hade dödat hans far och två gånger krossat hans försök att grunda ett kungarike, och Song, som vägrade godta honom som vasall, utropade han 1052 kungariket Stora södern (Danan). Med några tusen anhängare som hade bränt sina egna byar intog han Yongzhou (Nanning), drog nedför Västfloden och belägrade Guangzhou, Songrikets största hamn, i 57 dagar med en armé som hade vuxit till omkring 50 000 man. När han inte lyckades inta staden drog han sig tillbaka till Yongzhou och slog flera Songarméer som sändes mot honom. I början av 1053 tog sig Songfältherren Di Qing, en veteran från krigen mot Xia, över Kunlunpasset om natten och slog rebellerna på flykten utanför Yongzhou. Nong Zhigao flydde till kungariket Dali, där hans öde är okänt; hans mor och söner tillfångatogs och avrättades. Han hedras i dag som hjälte av många zhuang och nùng.
