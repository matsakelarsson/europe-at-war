Harold waited here for about a week, gathering troops, before marching south. Many levies had not arrived when he left.: Harald väntade här i omkring en vecka och samlade trupper innan han marscherade söderut. Många ur uppbådet hade inte anlänt när han gav sig av.
Harold: Harald
No one came to submit. In London the leading men, with the earls Edwin and Morcar and the archbishops Stigand and Ealdred, chose as king Edgar Ætheling, a teenage great-nephew of Edward the Confessor. William waited at Hastings for some days, then moved along the Kent coast, punishing Romney, where some of his men had been killed. Dover castle surrendered and Canterbury submitted, while a detachment took the submission of Winchester, the old royal city. At Southwark William beat off an English force and burned the suburb, but he could not cross London Bridge.: Ingen kom för att underkasta sig. I London valde de ledande männen, med earlerna Edwin och Morcar och ärkebiskoparna Stigand och Ealdred, Edgar Ætheling, en tonårig brorsons son till Edvard Bekännaren, till kung. Vilhelm väntade några dagar vid Hastings och drog sedan längs Kents kust och straffade Romney, där några av hans män hade dödats. Borgen i Dover kapitulerade och Canterbury underkastade sig, medan en avdelning tog emot underkastelsen från Winchester, den gamla kungastaden. Vid Southwark slog Vilhelm tillbaka en engelsk styrka och brände förstaden, men han kunde inte ta sig över London Bridge.
Instead he circled London to the west, ravaging the land as he went, crossed the Thames at Wallingford, where Archbishop Stigand submitted, and turned east. At Berkhamsted Edgar, Ealdred, Edwin, Morcar and the leading Londoners came to submit. William was crowned in Westminster Abbey on Christmas Day 1066 by Ealdred. When the congregation shouted their acclamation in English and French, Norman guards outside took it for a riot and set fire to houses nearby. In March 1067 William went back to Normandy, taking Edgar, the earls and Stigand with him, and left his half-brother Odo and William FitzOsbern in charge.: I stället gick han runt London i väster och härjade landet på vägen, gick över Themsen vid Wallingford, där ärkebiskop Stigand underkastade sig, och vände österut. I Berkhamsted kom Edgar, Ealdred, Edwin, Morcar och de ledande londonborna för att underkasta sig. Vilhelm kröntes i Westminster Abbey på juldagen 1066 av Ealdred. När församlingen ropade sitt bifall på engelska och franska trodde normandiska vakter utanför att det var upplopp och satte eld på närliggande hus. I mars 1067 återvände Vilhelm till Normandie och tog med sig Edgar, earlerna och Stigand, och lämnade sin halvbror Odo och William FitzOsbern att styra.
