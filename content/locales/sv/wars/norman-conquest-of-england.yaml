The last major English town to be occupied. William reached it after a winter march across the Pennines and built a castle.: Den sista större engelska staden som besattes. Vilhelm nådde den efter en vintermarsch över Penninerna och byggde en borg.
Across the Pennines: Över Penninerna
Laid waste in the Harrying of the North: Ödelagt vid härjningen av norra England
In the spring of 1070 King Sweyn came to England himself. His men went into the fens around the Isle of Ely, then an island in the marshes, and joined local rebels led by Hereward, a Lincolnshire landholder. Together they plundered Peterborough Abbey, whose new abbot was a Norman, and carried its treasure to the ships. Sweyn then made peace with William, took a payment and sailed home with the loot, leaving the English in the fens on their own.: Våren 1070 kom kung Sven själv till England. Hans män tog sig in i träskmarkerna kring Isle of Ely, då en ö i kärren, och anslöt sig till lokala upprorsmän ledda av Hereward, en jordägare från Lincolnshire. Tillsammans plundrade de klostret i Peterborough, vars nye abbot var normand, och förde dess skatter till fartygen. Sven slöt sedan fred med Vilhelm, tog emot en betalning och seglade hem med bytet och lämnade engelsmännen i träskmarkerna åt sitt öde.
In 1071 Edwin and Morcar fled from William’s court. Edwin was betrayed and killed by his own men; Morcar reached Ely, where Bishop Æthelwine of Durham and other exiles had joined Hereward. William came with an army and a fleet. According to later accounts his first causeway sank into the marsh, and the Normans got across only when the monks showed them a way; the island surrendered. Morcar spent the rest of his life in prison, while Hereward escaped into legend. In 1072 William marched into Scotland, and at Abernethy Malcolm III submitted to him. By the time of Domesday Book in 1086 almost all the great estates and bishoprics of England were held by Normans and other Frenchmen.: År 1071 flydde Edwin och Morcar från Vilhelms hov. Edwin förråddes och dödades av sina egna män; Morcar nådde Ely, där biskop Æthelwine av Durham och andra landsflyktiga hade anslutit sig till Hereward. Vilhelm kom med en armé och en flotta. Enligt senare berättelser sjönk hans första vägbank ned i träsket, och normanderna kom över först när munkarna visade dem en väg; ön kapitulerade. Morcar tillbringade resten av sitt liv i fängelse, medan Hereward försvann in i legenden. År 1072 marscherade Vilhelm in i Skottland, och i Abernethy underkastade sig Malkolm III honom. Vid tiden för Domesday Book 1086 innehades nästan alla stora gods och biskopsdömen i England av normander och andra fransmän.
