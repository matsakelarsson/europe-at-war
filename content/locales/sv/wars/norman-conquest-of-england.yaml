William was crowned in Edward the Confessor’s new abbey church, where Harold had been crowned less than a year before.: Vilhelm kröntes i Edvard Bekännarens nya klosterkyrka, där Harald hade krönts mindre än ett år tidigare.
William rewarded his followers with the lands of the English who had fought at Hastings, and his men built castles to hold down the towns. Resistance broke out while he was away. In 1067 Eadric the Wild, a Shropshire thegn, joined the Welsh kings of Gwynedd and Powys to ravage Herefordshire, and rebels in Kent called in Count Eustace of Boulogne, who attacked Dover castle and was beaten off. William returned in December. Early in 1068 Exeter, where Harold’s mother Gytha had taken refuge, refused to take an oath to him; he besieged it for eighteen days, with heavy losses, before it surrendered on terms. Gytha escaped by boat.: Vilhelm belönade sina följeslagare med jorden som tillhört de engelsmän som stridit vid Hastings, och hans män byggde borgar för att hålla städerna i schack. Motstånd bröt ut medan han var borta. År 1067 gjorde Eadric den vilde, en thegn från Shropshire, gemensam sak med de walesiska kungarna av Gwynedd och Powys och härjade Herefordshire, och upprorsmän i Kent kallade in greve Eustace av Boulogne, som anföll borgen i Dover och slogs tillbaka. Vilhelm återvände i december. I början av 1068 vägrade Exeter, där Haralds mor Gytha hade tagit sin tillflykt, att svära honom trohet; han belägrade staden i arton dagar, med svåra förluster, innan den kapitulerade på villkor. Gytha flydde med båt.
In the summer of 1068 Earls Edwin and Morcar rose in Mercia with Welsh help, while the north, not yet occupied, stirred under its new earl, Gospatric. William marched north, building castles at Warwick and Nottingham, and York submitted without a fight. Edwin and Morcar gave in again, and Gospatric and Edgar Ætheling fled to King Malcolm III in Scotland. On the way south William ordered castles at Lincoln, Huntingdon and Cambridge. Meanwhile Harold’s sons, who had fled to Ireland, raided Somerset and Devon from the sea.: Sommaren 1068 reste sig earlerna Edwin och Morcar i Mercia med walesisk hjälp, medan norra England, som ännu inte var besatt, blev oroligt under sin nye earl Gospatric. Vilhelm marscherade norrut och byggde borgar i Warwick och Nottingham, och York underkastade sig utan strid. Edwin och Morcar gav sig åter, och Gospatric och Edgar Ætheling flydde till kung Malkolm III i Skottland. På vägen söderut beordrade Vilhelm borgar i Lincoln, Huntingdon och Cambridge. Under tiden härjade Haralds söner, som hade flytt till Irland, Somerset och Devon från havet.
