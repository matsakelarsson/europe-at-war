The main sources are the Anglo-Saxon Chronicle and, on the Norman side, William of Poitiers and William of Jumièges, both writing to justify the conquest; Orderic Vitalis and the chroniclers of the next generation add detail. The Bayeux Tapestry, made in England probably in the 1070s for William’s half-brother Odo, tells the Norman story in pictures.: Huvudkällorna är Anglosaxiska krönikan och, på normandisk sida, Vilhelm av Poitiers och Vilhelm av Jumièges, som båda skrev för att rättfärdiga erövringen; Ordericus Vitalis och krönikörerna i nästa generation tillför detaljer. Bayeuxtapeten, som troligen tillverkades i England på 1070-talet för Vilhelms halvbror Odo, berättar den normandiska historien i bilder.
Numbers are uncertain. Writers of the time give impossible figures; modern estimates for each army at Hastings range from about 5,000 to more than 10,000 men.: Siffrorna är osäkra. Samtida skribenter anger omöjliga tal; moderna uppskattningar för vardera armén vid Hastings sträcker sig från omkring 5 000 till mer än 10 000 man.
The Norwegian invasion of September 1066 and the Battle of Stamford Bridge are told in their own story, the Norwegian invasion of England.: Den norska invasionen i september 1066 och slaget vid Stamford Bridge berättas i en egen historia, den norska invasionen av England.
