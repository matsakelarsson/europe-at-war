Norman Conquest of England: Normandiska erövringen av England
The conquest of England by William, duke of Normandy, who landed in Sussex in September 1066, defeated and killed King Harold at Hastings and was crowned at Westminster on Christmas Day. Over the next five years he put down a series of English risings, some backed by the Danes and the Welsh, laid waste to the north and took the last rebel stronghold, the Isle of Ely, in 1071. A French-speaking Norman aristocracy and church replaced the English ruling class.: Erövringen av England av Vilhelm, hertig av Normandie, som landsteg i Sussex i september 1066, besegrade och dödade kung Harald vid Hastings och kröntes i Westminster på juldagen. Under de följande fem åren slog han ned en rad engelska uppror, en del med stöd av danskar och walesare, ödelade norra England och intog 1071 upprorsmännens sista fäste, Isle of Ely. En franskspråkig normandisk aristokrati och kyrka ersatte den engelska härskande klassen.
