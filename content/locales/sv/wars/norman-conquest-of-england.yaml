Peterborough: Peterborough
Hereward and the Danes sacked the abbey to keep its treasure from the new Norman abbot, Turold. The town was burned.: Hereward och danskarna plundrade klostret för att hålla dess skatter undan den nye normandiske abboten Turold. Staden brändes.
Isle of Ely: Isle of Ely
The last English stronghold, ringed by fens. The abbey on the island was the rebels’ base.: Det sista engelska fästet, omgivet av träskmarker. Klostret på ön var upprorsmännens bas.
Aldreth: Aldreth
Tradition places William’s causeway here, on the old route from Cambridge. An earthwork nearby is still called Belsar’s Hill after one of his knights.: Traditionen förlägger Vilhelms vägbank hit, på den gamla vägen från Cambridge. En jordvall i närheten kallas fortfarande Belsar’s Hill efter en av hans riddare.
