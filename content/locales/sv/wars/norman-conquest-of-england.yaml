Edward the Confessor died childless on 5 January 1066, and the next day Harold Godwinson, earl of Wessex and the most powerful man in England, was crowned king. William, duke of Normandy, a great-nephew of Edward’s Norman mother, Emma, claimed that Edward had promised him the throne, probably in 1051, and that Harold had sworn on holy relics to support him during a visit to Normandy around 1064. Norman writers later said the pope had blessed the invasion with a banner, but no other source supports this. A third claimant, Harald Hardrada of Norway, invaded the north in September; that story is told in the Norwegian invasion of England.: Edvard Bekännaren dog barnlös den 5 januari 1066, och dagen därpå kröntes Harald Godwinson, earl av Wessex och Englands mäktigaste man, till kung. Vilhelm, hertig av Normandie, brorsons son till Edvards normandiska mor Emma, hävdade att Edvard hade lovat honom tronen, troligen 1051, och att Harald hade svurit på heliga reliker att stödja honom under ett besök i Normandie omkring 1064. Normandiska skribenter uppgav senare att påven hade välsignat invasionen med en fana, men ingen annan källa bekräftar detta. En tredje tronpretendent, Harald Hårdråde av Norge, föll in i norra England i september; den historien berättas i den norska invasionen av England.
William gathered knights from Normandy, Brittany, Flanders and other parts of France and built a fleet of several hundred ships. The army was ready by August, but contrary winds, and perhaps caution, kept it waiting at the mouth of the Dives and then at Saint-Valery-sur-Somme. Harold guarded the south coast all summer but sent his levies home on 8 September when their supplies ran out, then hurried north to destroy the Norwegians at Stamford Bridge on 25 September. Three days later William landed unopposed at Pevensey. He built a timber castle at Hastings and ravaged the countryside around it, much of it Harold’s own land.: Vilhelm samlade riddare från Normandie, Bretagne, Flandern och andra delar av Frankrike och byggde en flotta på flera hundra fartyg. Armén var redo i augusti, men motvind, och kanske försiktighet, höll den kvar vid Divesflodens mynning och sedan vid Saint-Valery-sur-Somme. Harald bevakade sydkusten hela sommaren men skickade hem sitt uppbåd den 8 september när förråden tog slut och skyndade sedan norrut för att förinta norrmännen vid Stamford Bridge den 25 september. Tre dagar senare landsteg Vilhelm utan motstånd vid Pevensey. Han byggde en träborg vid Hastings och härjade den omgivande landsbygden, till stor del Haralds egna marker.
