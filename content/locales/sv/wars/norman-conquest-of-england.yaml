English rebels: Engelska upprorsmän
On 28 January 1069 the Northumbrians broke into Durham and killed the new Norman earl, Robert de Comines, and many of his several hundred men. Rebels joined by Edgar Ætheling besieged York’s castle until William hurried north, relieved it and built a second one. In late summer a Danish fleet of 240 or 300 ships, sent by King Sweyn Estridsson, a nephew of Cnut, came down the coast under his brother Asbjørn and his sons. Beaten off at Dover, Sandwich, Ipswich and Norwich, it entered the Humber, where Edgar, Gospatric and Earl Waltheof joined it with the men of Yorkshire. In September they stormed York and destroyed the garrisons of both castles. Risings followed at Shrewsbury, Exeter and Montacute.: Den 28 januari 1069 bröt sig northumbrierna in i Durham och dödade den nye normandiske earlen Robert de Comines och många av hans flera hundra män. Upprorsmän, som fått sällskap av Edgar Ætheling, belägrade borgen i York tills Vilhelm skyndade norrut, undsatte den och byggde en andra borg. Sent på sommaren kom en dansk flotta på 240 eller 300 fartyg, sänd av kung Sven Estridsson, en systerson till Knut, längs kusten under hans bror Asbjørn och hans söner. Den slogs tillbaka vid Dover, Sandwich, Ipswich och Norwich och löpte in i Humber, där Edgar, Gospatric och earl Waltheof anslöt sig med männen från Yorkshire. I september stormade de York och förintade garnisonerna i båda borgarna. Uppror följde i Shrewsbury, Exeter och Montacute.
William dealt with them in turn. He drove the Danes back across the Humber, beat the Mercian rebels at Stafford, forced the crossing of the Aire at Pontefract and retook York, where he wore his crown at Christmas. He paid the Danes, who agreed to leave in the spring. Through the winter his troops laid waste the land between the Humber and the Tees and beyond, burning villages, crops and livestock so that the north could not feed another rebellion. Famine followed. Orderic Vitalis, writing some fifty years later, said that more than 100,000 people died, a figure historians treat as rhetoric, and in 1086 Domesday Book still recorded much of Yorkshire as waste. Early in 1070 William crossed the Pennines in deep winter and built castles at Chester and Stafford.: Vilhelm tog itu med dem ett i taget. Han drev danskarna tillbaka över Humber, slog de mercianska upprorsmännen vid Stafford, forcerade övergången av Aire vid Pontefract och återtog York, där han bar sin krona vid julen. Han betalade danskarna, som gick med på att dra bort på våren. Under vintern ödelade hans trupper landet mellan Humber och Tees och längre bort, och brände byar, grödor och boskap så att norra England inte skulle kunna föda ännu ett uppror. Hungersnöd följde. Ordericus Vitalis, som skrev omkring femtio år senare, uppgav att mer än 100 000 människor dog, en siffra som historikerna betraktar som retorik, och 1086 betecknade Domesday Book fortfarande stora delar av Yorkshire som ödelagda. I början av 1070 gick Vilhelm över Penninerna mitt i vintern och byggde borgar i Chester och Stafford.
