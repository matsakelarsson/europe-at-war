Harold, to the north: Harald, norrut
Harold came back to London and stayed about a week gathering men, then marched into Sussex, perhaps hoping to surprise William as he had surprised the Norwegians. Norman scouts gave warning, and on the morning of 14 October William led his army out of Hastings. Harold had taken up position on a ridge about ten kilometres to the north-west, where the town of Battle now stands. The armies were probably of similar size, but the English all fought on foot, the housecarls and the fyrd levies, with few archers, while William had archers, infantry and mounted knights.: Harald återvände till London och stannade omkring en vecka för att samla män, och marscherade sedan in i Sussex, kanske i hopp om att överraska Vilhelm så som han hade överraskat norrmännen. Normandiska spejare slog larm, och på morgonen den 14 oktober förde Vilhelm ut sin armé från Hastings. Harald hade tagit ställning på en ås omkring tio kilometer nordväst därom, där staden Battle i dag ligger. Arméerna var troligen ungefär lika stora, men engelsmännen stred alla till fots, huskarlarna och fyrduppbådet, med få bågskyttar, medan Vilhelm hade bågskyttar, fotfolk och beridna riddare.
The battle lasted from about nine in the morning until dusk. The English shield wall held against arrows and charges, and part of William’s army, the Bretons on the left, broke and fled until William showed himself to quell a rumour that he was dead; the English who ran after them were cut down. Norman writers say the knights twice more feigned flight to draw men out of the line. Late in the day Harold was killed, with his brothers Gyrth and Leofwine. How he died is not known; the arrow in the eye may be a later story. The English broke, though many of the housecarls fought on around their dead king.: Slaget varade från omkring nio på morgonen till skymningen. Den engelska sköldborgen höll mot pilar och anfall, och en del av Vilhelms armé, bretonerna på vänster flygel, bröts och flydde tills Vilhelm visade sig för att kväva ett rykte om att han var död; de engelsmän som sprang efter dem höggs ned. Normandiska skribenter uppger att riddarna ytterligare två gånger låtsades fly för att locka ut män ur linjen. Sent på dagen stupade Harald tillsammans med sina bröder Gyrth och Leofwine. Hur han dog är inte känt; pilen i ögat kan vara en senare berättelse. Engelsmännen bröts, även om många av huskarlarna fortsatte att kämpa kring sin döde kung.
