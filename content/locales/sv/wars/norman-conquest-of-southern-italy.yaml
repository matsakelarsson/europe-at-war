25 July 1139: 25 juli 1139
The captive pope recognised the kingdom, which lasted, in one form or another, until 1861.: Den tillfångatagne påven erkände kungariket, som i en eller annan form bestod till 1861.
Without a duke since Rignano, the city accepted Roger’s rule and his son Alfonso as its duke.: Staden, som varit utan hertig sedan Rignano, godtog Rogers styre och hans son Alfonso som sin hertig.
