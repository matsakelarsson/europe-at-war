In 1081 Guiscard attacked the Byzantine Empire itself, crossing the Adriatic with his son Bohemond. He beat the Emperor Alexios I Komnenos outside Dyrrhachium (Durrës) on 18 October and took the city in February 1082, but revolts in Apulia, encouraged with Byzantine money, called him home. In May 1084 he marched on Rome to rescue Gregory VII, besieged in Castel Sant’Angelo by Henry IV. His army freed the pope and then sacked the city, burning much of it, and Gregory had to leave with the Normans. Guiscard died of fever on Cephalonia on 17 July 1085, during a second Balkan campaign.: År 1081 angrep Guiscard själva Bysantinska riket och gick över Adriatiska havet med sin son Bohemund. Han slog kejsar Alexios I Komnenos utanför Dyrrachion (Durrës) den 18 oktober och intog staden i februari 1082, men uppror i Apulien, uppmuntrade med bysantinska pengar, kallade hem honom. I maj 1084 marscherade han mot Rom för att undsätta Gregorius VII, som belägrades i Castel Sant’Angelo av Henrik IV. Hans armé befriade påven och plundrade sedan staden och brände stora delar av den, och Gregorius måste lämna Rom med normanderna. Guiscard dog i feber på Kefalonia den 17 juli 1085, under ett andra fälttåg på Balkan.
In Sicily Count Roger finished the conquest. Trapani fell in 1077 and Taormina in 1079. In May 1086 Roger attacked Syracuse, whose emir, known to the Normans as Benavert, was killed in a sea fight off the harbour; the city surrendered in October. The emir of Enna gave up his fortress in 1087 and became a Christian, Butera fell in 1088, and in February 1091 Noto, the last Muslim town, surrendered. That summer Roger raided Malta and made its emir pay tribute. Sicily’s Muslims, still perhaps the majority of its people, kept their faith and much of their law under Norman rule.: På Sicilien fullbordade greve Roger erövringen. Trapani föll 1077 och Taormina 1079. I maj 1086 anföll Roger Syrakusa, vars emir, av normanderna kallad Benavert, stupade i en sjöstrid utanför hamnen; staden kapitulerade i oktober. Emiren av Enna gav upp sin fästning 1087 och blev kristen, Butera föll 1088, och i februari 1091 kapitulerade Noto, den sista muslimska staden. Samma sommar gjorde Roger ett plundringståg mot Malta och tvingade dess emir att betala tribut. Siciliens muslimer, kanske fortfarande majoriteten av befolkningen, behöll sin tro och mycket av sin lag under normandiskt styre.
