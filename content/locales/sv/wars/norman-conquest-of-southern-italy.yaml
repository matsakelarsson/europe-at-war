The Normans broke Alexios’s army, whose Varangian Guard, many of them English exiles, was cut down after charging too far ahead.: Normanderna bröt Alexios armé, vars varjagiska garde, många av dem engelska landsflyktiga, höggs ned sedan de anfallit för långt fram.
Henry IV withdrew as Guiscard approached. The Normans freed Gregory VII, but their sack turned the Romans against the pope, who died in exile at Salerno in 1085.: Henrik IV drog sig tillbaka när Guiscard närmade sig. Normanderna befriade Gregorius VII, men deras plundring vände romarna mot påven, som dog i exil i Salerno 1085.
Cephalonia: Kefalonia
17 July 1085: 17 juli 1085
Guiscard died of fever on the island during his second campaign against Byzantium, and the Balkan venture was given up.: Guiscard dog i feber på ön under sitt andra fälttåg mot Bysans, och Balkanföretaget övergavs.
October 1086: oktober 1086
Roger’s fleet sailed from Messina and his son Jordan besieged the city by land for five months.: Rogers flotta seglade från Messina och hans son Jordan belägrade staden till lands i fem månader.
The emir Ibn Hamud surrendered Castrogiovanni and became a Christian.: Emiren Ibn Hamud överlämnade Castrogiovanni och blev kristen.
Noto: Noto
February 1091: februari 1091
The last Muslim stronghold surrendered, thirty years after the Normans first crossed the strait.: Det sista muslimska fästet kapitulerade, trettio år efter att normanderna första gången gått över sundet.
Roger landed, freed Christian captives and made the island’s Muslim ruler his tributary. Malta was fully annexed only in 1127.: Roger landsteg, befriade kristna fångar och gjorde öns muslimske härskare skattskyldig till sig. Malta annekterades helt först 1127.
