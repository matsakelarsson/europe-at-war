Roger, 1086: Roger 1086
Count Roger’s son Roger II, Count of Sicily since 1105, claimed Apulia when Guiscard’s grandson Duke William died childless in 1127. The pope and the mainland barons opposed him, but in 1128 Pope Honorius II had to invest him as duke. When the papal election of 1130 split the Church, Roger backed Anacletus II, who made him king, and he was crowned in Palermo on Christmas Day 1130. The rival pope, Innocent II, whom most of Europe recognised, and the Emperor Lothair III refused to accept the new kingdom, and the mainland barons rose under Roger’s brother-in-law Ranulf of Alife and Prince Robert II of Capua.: Greve Rogers son Roger II, greve av Sicilien sedan 1105, gjorde anspråk på Apulien när Guiscards sonson hertig Vilhelm dog barnlös 1127. Påven och fastlandsbaronerna motsatte sig honom, men 1128 måste påven Honorius II förläna honom hertigdömet. När påvevalet 1130 splittrade kyrkan stödde Roger Anacletus II, som gjorde honom till kung, och han kröntes i Palermo på juldagen 1130. Motpåven Innocentius II, som större delen av Europa erkände, och kejsar Lothar III vägrade godta det nya kungariket, och fastlandsbaronerna reste sig under Rogers svåger Ranulf av Alife och furst Robert II av Capua.
Ranulf beat Roger at Nocera on 24 July 1132. In 1137 Lothair and Innocent marched south through Apulia, took Bari and Salerno and made Ranulf duke. When Lothair turned for home, Roger struck back, but Ranulf beat him again at Rignano on 30 October 1137. Lothair died that December and Ranulf in April 1139. On 22 July 1139 Roger’s son ambushed the papal army at Galluccio and captured Innocent II, who three days later at Mignano recognised Roger as King of Sicily, Duke of Apulia and Prince of Capua. Naples submitted that year and the Abruzzi were conquered in 1140.: Ranulf slog Roger vid Nocera den 24 juli 1132. År 1137 marscherade Lothar och Innocentius söderut genom Apulien, intog Bari och Salerno och gjorde Ranulf till hertig. När Lothar vände hemåt slog Roger tillbaka, men Ranulf besegrade honom åter vid Rignano den 30 oktober 1137. Lothar dog i december samma år och Ranulf i april 1139. Den 22 juli 1139 överföll Rogers son den påvliga armén vid Galluccio och tillfångatog Innocentius II, som tre dagar senare i Mignano erkände Roger som kung av Sicilien, hertig av Apulien och furste av Capua. Neapel underkastade sig samma år och Abruzzerna erövrades 1140.
