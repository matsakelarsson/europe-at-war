22 July 1139: 22 juli 1139
Roger’s son, Duke Roger of Apulia, fell on the papal army with about a thousand knights and took the pope prisoner.: Rogers son, hertig Roger av Apulien, föll över den påvliga armén med omkring tusen riddare och tog påven till fånga.
