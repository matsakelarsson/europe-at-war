24 July 1132: 24 juli 1132
Ranulf and Robert of Capua routed Roger’s army near the Sarno, and Roger fled to Salerno.: Ranulf och Robert av Capua krossade Rogers armé nära Sarno, och Roger flydde till Salerno.
The townspeople rose against Roger, and Lothair’s army took the citadel after a siege.: Stadsborna reste sig mot Roger, och Lothars armé intog citadellet efter en belägring.
30 October 1137: 30 oktober 1137
Roger’s second defeat by Ranulf. Duke Sergius VII of Naples, fighting for Roger, was killed.: Rogers andra nederlag mot Ranulf. Hertig Sergius VII av Neapel, som stred för Roger, stupade.
