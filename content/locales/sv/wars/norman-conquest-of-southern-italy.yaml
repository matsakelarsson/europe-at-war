The Normans did not come as one army. Bands led by different families fought for themselves, for whoever paid them and often against each other; the Hautevilles in Apulia, Calabria and Sicily and the Drengots at Aversa and Capua became the leading families.: Normanderna kom inte som en enda armé. Skaror ledda av olika släkter kämpade för egen räkning, för den som betalade dem och ofta mot varandra; släkten Hauteville i Apulien, Kalabrien och på Sicilien och släkten Drengot i Aversa och Capua blev de ledande släkterna.
The main narrative sources, Amatus of Montecassino, William of Apulia and Geoffrey Malaterra, wrote for Norman patrons and often exaggerate the odds the Normans faced. Their numbers are not reliable.: De viktigaste berättande källorna, Amatus av Montecassino, Vilhelm av Apulien och Gaufredus Malaterra, skrev för normandiska beskyddare och överdriver ofta den övermakt normanderna mötte. Deras siffror är inte tillförlitliga.
Capua was a Lombard principality until Richard of Aversa made himself its prince in 1058. Benevento passed to the papacy in 1051 and for good in 1077.: Capua var ett langobardiskt furstendöme tills Richard av Aversa gjorde sig till dess furste 1058. Benevento övergick till påvedömet 1051 och slutgiltigt 1077.
