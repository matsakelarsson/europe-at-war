25 December 1130: 25 december 1130
Roger was crowned in the cathedral by a cardinal sent by Anacletus II. Palermo, with its Arab, Greek and Latin courtiers, became the capital of the kingdom.: Roger kröntes i katedralen av en kardinal sänd av Anacletus II. Palermo, med sina arabiska, grekiska och latinska hovmän, blev kungarikets huvudstad.
