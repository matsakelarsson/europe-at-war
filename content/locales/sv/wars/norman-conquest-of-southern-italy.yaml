The Normans’ plundering made them hated in Apulia and feared by their neighbours. Drogo was murdered in 1051, and Pope Leo IX, who had just taken Benevento under papal rule, raised an army against them, with the Byzantine governor Argyrus, Melus’s son, as his ally. Before the two could join forces, the Normans under Drogo’s brother Humphrey, Richard of Aversa and Robert Guiscard, another son of Tancred, met the pope’s Italian levies and Swabian foot soldiers at Civitate on 18 June 1053. The Swabians fought almost to the last man, and the pope was taken and held at Benevento for nine months.: Normandernas plundringar gjorde dem hatade i Apulien och fruktade av sina grannar. Drogo mördades 1051, och påven Leo IX, som just hade lagt Benevento under påvligt styre, satte upp en armé mot dem, med den bysantinske ståthållaren Argyros, Melus son, som allierad. Innan de två hann förena sina styrkor mötte normanderna under Drogos bror Humfred, Richard av Aversa och Robert Guiscard, ytterligare en son till Tancred, påvens italienska uppbåd och schwabiska fotsoldater vid Civitate den 18 juni 1053. Schwaberna kämpade nästan till siste man, och påven tillfångatogs och hölls i Benevento i nio månader.
Leo’s successors made their peace with the Normans. Humphrey died in 1057 and Robert Guiscard took over in Apulia; Reggio fell to him in 1060, completing the conquest of Calabria. Richard of Aversa made himself Prince of Capua in 1058. Pope Nicholas II, who needed allies against the Roman nobles and the German court, came to Melfi in 1059. On 23 August he invested Robert as “by the grace of God and St Peter Duke of Apulia and Calabria and, with their help, hereafter of Sicily”, and confirmed Richard in Capua. Both swore fealty to the pope.: Leos efterträdare slöt fred med normanderna. Humfred dog 1057 och Robert Guiscard tog över i Apulien; Reggio föll för honom 1060, vilket fullbordade erövringen av Kalabrien. Richard av Aversa gjorde sig till furste av Capua 1058. Påven Nikolaus II, som behövde allierade mot den romerska adeln och det tyska hovet, kom till Melfi 1059. Den 23 augusti förlänade han Robert som ”genom Guds och den helige Petrus nåd hertig av Apulien och Kalabrien och, med deras hjälp, framdeles av Sicilien”, och bekräftade Richard i Capua. Båda svor påven trohet.
