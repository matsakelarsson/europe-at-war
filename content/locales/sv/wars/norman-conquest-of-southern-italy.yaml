In 1038 the Byzantine general George Maniakes invaded Muslim Sicily, then torn between rival emirs. With him went Lombard troops and a few hundred Norman knights, among them William and Drogo, sons of Tancred of Hauteville, a minor lord from the Cotentin in Normandy. Maniakes took Messina and Syracuse and won a battle at Troina in 1040, but he quarrelled with his allies, the Normans went home unpaid, and he was recalled to Constantinople. The Muslims soon won back everything except Messina, which fell in 1042.: År 1038 invaderade den bysantinske generalen Georgios Maniakes det muslimska Sicilien, som då slets mellan rivaliserande emirer. Med honom följde langobardiska trupper och några hundra normandiska riddare, bland dem Vilhelm och Drogo, söner till Tancred av Hauteville, en mindre storman från Cotentin i Normandie. Maniakes intog Messina och Syrakusa och vann ett slag vid Troina 1040, men han blev osams med sina allierade, normanderna återvände hem utan betalning och han kallades tillbaka till Konstantinopel. Muslimerna vann snart tillbaka allt utom Messina, som föll 1042.
In 1041 the Normans joined a new Lombard rising in Apulia. From Melfi, a hill town on the Byzantine frontier, they beat the Byzantines three times in a year, on the Olivento on 16 March, at Montemaggiore near Cannae on 4 May and at Montepeloso on 3 September, where they captured the catepan. In September 1042 the Norman leaders met at Melfi and chose William Iron Arm as Count of Apulia, and soon afterwards they shared out the towns they had taken among twelve chiefs. William died in 1046, and in 1047 the Emperor Henry III recognised his brother Drogo as count.: År 1041 anslöt sig normanderna till ett nytt langobardiskt uppror i Apulien. Från Melfi, en bergsstad vid den bysantinska gränsen, slog de bysantinerna tre gånger på ett år, vid Olivento den 16 mars, vid Montemaggiore nära Cannae den 4 maj och vid Montepeloso den 3 september, där de tillfångatog katepanen. I september 1042 möttes de normandiska ledarna i Melfi och valde Vilhelm Järnarm till greve av Apulien, och strax därefter delade de upp de erövrade städerna mellan tolv hövdingar. Vilhelm dog 1046, och 1047 erkände kejsar Henrik III hans bror Drogo som greve.
