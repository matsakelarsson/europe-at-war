By 1068 the Byzantines held only a few towns on the Apulian coast. In August Guiscard laid siege to Bari, the capital of Byzantine Italy, closing its harbour with a line of ships. The town held out for nearly three years, and a relief fleet was beaten off. On 16 April 1071 Bari surrendered, ending more than five centuries of Byzantine rule in Italy. That August the Byzantines were routed by the Seljuk Turks at Manzikert, and they never came back. In 1073 Amalfi, afraid of its neighbour Salerno, accepted Guiscard as its lord.: År 1068 höll bysantinerna bara några få städer på den apuliska kusten. I augusti belägrade Guiscard Bari, det bysantinska Italiens huvudstad, och spärrade dess hamn med en rad fartyg. Staden höll ut i nästan tre år, och en undsättningsflotta slogs tillbaka. Den 16 april 1071 kapitulerade Bari, vilket gjorde slut på mer än fem sekler av bysantinskt styre i Italien. I augusti samma år krossades bysantinerna av seldjukturkarna vid Manzikert, och de kom aldrig tillbaka. År 1073 godtog Amalfi, som fruktade grannstaden Salerno, Guiscard som sin herre.
The last Lombard principality, Salerno, was ruled by Gisulf II, brother of Guiscard’s wife Sichelgaita. Guiscard besieged it in 1076; the starving city surrendered on 13 December, and Gisulf held out in the citadel until May 1077. Guiscard made Salerno his capital. The last Lombard prince of Benevento died the same year, and the city passed to the pope. Gregory VII, who had excommunicated Guiscard for raiding papal lands, needed him against the Emperor Henry IV, and at Ceprano in June 1080 he lifted the ban and invested Guiscard with his lands again.: Det sista langobardiska furstendömet, Salerno, styrdes av Gisulf II, bror till Guiscards hustru Sichelgaita. Guiscard belägrade staden 1076; den svältande staden kapitulerade den 13 december, och Gisulf höll ut i citadellet till maj 1077. Guiscard gjorde Salerno till sin huvudstad. Den siste langobardiske fursten av Benevento dog samma år, och staden övergick till påven. Gregorius VII, som hade bannlyst Guiscard för plundringståg i påvliga områden, behövde honom mot kejsar Henrik IV, och i Ceprano i juni 1080 hävde han bannet och förlänade åter Guiscard hans länder.
