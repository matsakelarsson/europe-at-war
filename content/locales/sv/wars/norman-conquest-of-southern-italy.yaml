Muslim Sicily had broken up among rival emirs, and in 1061 one of them, Ibn al-Thumna of Syracuse and Catania, asked the Normans for help against his rival Ibn al-Hawwas of Enna. In May Robert Guiscard and his youngest brother Roger crossed the strait and took Messina. They pushed inland but could not take Enna. Roger held on in the north-east, where in the winter of 1062–63 he and his wife were besieged in Troina by its own Greek townspeople. In June 1063, at Cerami, his small force routed a much larger army of Sicilian Muslims and Zirid troops from Africa.: Det muslimska Sicilien hade splittrats mellan rivaliserande emirer, och 1061 bad en av dem, Ibn al-Thumna av Syrakusa och Catania, normanderna om hjälp mot sin rival Ibn al-Hawwas av Enna. I maj gick Robert Guiscard och hans yngste bror Roger över sundet och intog Messina. De trängde in i landet men kunde inte ta Enna. Roger höll sig kvar i nordost, där han och hans hustru vintern 1062–63 belägrades i Troina av stadens egna grekiska invånare. I juni 1063 krossade hans lilla styrka vid Cerami en mycket större armé av sicilianska muslimer och ziridiska trupper från Afrika.
Progress was slow while Guiscard was busy in Apulia. Roger won again at Misilmeri in 1068, and after Bari fell in 1071 the brothers turned on Palermo with an army and a fleet. The city was besieged by land and sea from August, and on 7 January 1072 the Normans broke into the outer city; the inner city surrendered a few days later, on terms that let the Muslims keep their religion and laws. Guiscard kept Palermo and parts of the north-east for himself and invested Roger with the rest as Count of Sicily.: Framstegen var långsamma medan Guiscard var upptagen i Apulien. Roger segrade igen vid Misilmeri 1068, och sedan Bari fallit 1071 vände sig bröderna mot Palermo med en armé och en flotta. Staden belägrades till lands och till sjöss från augusti, och den 7 januari 1072 bröt sig normanderna in i den yttre staden; den inre staden kapitulerade några dagar senare, på villkor som lät muslimerna behålla sin religion och sina lagar. Guiscard behöll Palermo och delar av nordost för egen del och förlänade Roger resten som greve av Sicilien.
