Norman conquest of southern Italy: Normandernas erövring av södra Italien
The piecemeal conquest of southern Italy and Sicily by Norman adventurers, who came as mercenaries for Lombard rebels and princes and made themselves lords. Led by the Hauteville brothers and the Drengots of Aversa and Capua, they took Byzantine Apulia and Calabria (Bari fell in 1071), the last Lombard principalities and Muslim Sicily (1061–1091), and in 1130 Roger II united their lands as the Kingdom of Sicily, which the papacy recognised in 1139.: Den gradvisa erövringen av södra Italien och Sicilien av normandiska äventyrare, som kom som legosoldater åt langobardiska upprorsmän och furstar och gjorde sig själva till herrar. Under ledning av bröderna Hauteville och Drengotsläkten i Aversa och Capua tog de det bysantinska Apulien och Kalabrien (Bari föll 1071), de sista langobardiska furstendömena och det muslimska Sicilien (1061–1091), och 1130 förenade Roger II deras länder till Kungariket Sicilien, som påvedömet erkände 1139.
