On 9 May 1009 Melus, a Lombard noble of Bari, led a revolt against Byzantine rule in Apulia. It failed, and he fled. The chroniclers tell how in about 1016 he met Norman pilgrims at the shrine of St Michael on Monte Gargano and asked them to bring fighting men; whatever the truth of the story, Norman knights, many of them younger sons with no land at home, were soon serving in the south. In 1017 Melus rose again with their help and won several battles in northern Apulia.: Den 9 maj 1009 ledde Melus, en langobardisk adelsman från Bari, ett uppror mot det bysantinska styret i Apulien. Det misslyckades, och han flydde. Krönikörerna berättar hur han omkring 1016 mötte normandiska pilgrimer vid den helige Mikaels helgedom på Monte Gargano och bad dem föra med sig stridsmän; oavsett hur det förhåller sig med berättelsen tjänade snart normandiska riddare, många av dem yngre söner utan jord därhemma, i söder. År 1017 reste sig Melus på nytt med deras hjälp och vann flera slag i norra Apulien.
In 1018 the new Byzantine catepan, Basil Boioannes, crushed Melus and his Normans on the Ofanto near Cannae, where Hannibal had beaten the Romans. Melus fled to the Emperor Henry II and died in 1020. The surviving Normans hired themselves out to whoever would pay, the abbots of Montecassino, the Lombard princes of Capua and Salerno, the dukes of Naples and the Byzantines themselves. In early 1030 Duke Sergius IV of Naples gave one of their leaders, Rainulf Drengot, the town of Aversa, the first Norman lordship in Italy.: "År 1018 krossade den nye bysantinske katepanen Basileios Boioannes Melus och hans normander vid Ofanto nära Cannae, där Hannibal hade besegrat romarna. Melus flydde till kejsar Henrik II och dog 1020. De överlevande normanderna hyrde ut sig till den som betalade: abbotarna i Montecassino, de langobardiska furstarna av Capua och Salerno, hertigarna av Neapel och bysantinerna själva. I början av 1030 gav hertig Sergius IV av Neapel en av deras ledare, Rainulf Drengot, staden Aversa, det första normandiska herradömet i Italien."
