The invaders are often called Anglo-Normans; many came from the Norman lordships of south Wales and had Welsh and Flemish soldiers with them, so historians also call them Cambro-Normans. The main accounts are Gerald of Wales’s Expugnatio Hibernica, written by a relative of several of the leaders, the Old French Song of Dermot and the Earl, and the Irish annals.: Inkräktarna kallas ofta anglonormander; många kom från de normandiska herradömena i södra Wales och hade walesiska och flamländska soldater med sig, så historiker kallar dem också kambronormander. De viktigaste berättelserna är Giraldus Cambrensis Expugnatio Hibernica, skriven av en släkting till flera av ledarna, den fornfranska Song of Dermot and the Earl och de irländska annalerna.
Henry claimed papal backing from the bull Laudabiliter, said to have been issued by Pope Adrian IV in about 1155; its authenticity has long been debated, but Pope Alexander III endorsed Henry’s lordship in 1172.: Henrik åberopade påvligt stöd i bullan Laudabiliter, som sägs ha utfärdats av påven Hadrianus IV omkring 1155; dess äkthet har länge diskuterats, men påven Alexander III godkände Henriks överhöghet 1172.
