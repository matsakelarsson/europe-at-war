The Irish bishops met in synod, acknowledged Henry as their lord and agreed to bring church practice into line with England.: De irländska biskoparna möttes i synod, erkände Henrik som sin herre och gick med på att anpassa kyrkans praxis till Englands.
Henry spent the winter in the city, where the kings of Leinster, Meath, Bréifne, Airgialla and Ulaid came to submit. He gave Dublin to the men of Bristol to settle.: Henrik tillbringade vintern i staden, dit kungarna av Leinster, Meath, Bréifne, Airgialla och Ulaid kom för att underkasta sig. Han gav Dublin åt män från Bristol att bosätta sig i.
Domnall Ua Briain, king of Thomond, defeated a large part of Strongbow’s army on its way to Limerick, forcing him to turn back.: Domnall Ua Briain, kung av Thomond, besegrade en stor del av Strongbows armé på väg till Limerick och tvingade honom att vända om.
