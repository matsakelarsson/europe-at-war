Henry’s fleet brought siege towers in case the Norman towns resisted him. The king of Desmond came to submit here.: Henriks flotta förde med sig belägringstorn ifall de normandiska städerna skulle göra motstånd. Kungen av Desmond kom hit för att underkasta sig.
