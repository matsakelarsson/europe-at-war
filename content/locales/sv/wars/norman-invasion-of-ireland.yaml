In 1166 Diarmait Mac Murchada, king of Leinster, was driven out by a coalition led by the high king, Ruaidrí Ua Conchobair of Connacht, and Tigernán Ua Ruairc of Bréifne, whose wife Diarmait had carried off years before. Diarmait went to Henry II, who let him recruit among his subjects. In south Wales he found Norman lords ready to fight for land, chief among them Richard de Clare, earl of Pembroke, known as Strongbow, to whom he promised his daughter Aífe and the succession to Leinster. On 1 May 1169 Robert FitzStephen landed at Bannow Bay with some 40 knights, 60 men-at-arms and 360 archers, and the Norse-Irish town of Wexford surrendered after two days.: År 1166 drevs Diarmait Mac Murchada, kung av Leinster, bort av en koalition ledd av storkungen Ruaidrí Ua Conchobair av Connacht och Tigernán Ua Ruairc av Bréifne, vars hustru Diarmait hade rövat bort flera år tidigare. Diarmait vände sig till Henrik II, som lät honom värva bland sina undersåtar. I södra Wales fann han normandiska stormän som var beredda att strida för jord, främst bland dem Richard de Clare, earl av Pembroke, känd som Strongbow, som han lovade sin dotter Aífe och tronföljden i Leinster. Den 1 maj 1169 landsteg Robert FitzStephen vid Bannow Bay med omkring 40 riddare, 60 väpnare och 360 bågskyttar, och den nordisk-irländska staden Wexford kapitulerade efter två dagar.
In May 1170 Raymond FitzGerald dug in on the headland of Baginbun and routed a much larger force from Waterford. Strongbow landed nearby on 23 August with about 200 knights and 1,000 other soldiers, stormed Waterford and married Aífe in the town. On 21 September, while Diarmait was negotiating with Dublin’s Norse king, Ascall mac Ragnaill, Norman knights broke in and took the city. Diarmait died in May 1171, and Strongbow claimed Leinster, against Irish custom. Ascall returned with a Norse fleet and was beaten and executed. Then Ruaidrí besieged Dublin with an army from most of Ireland for two months, until a sortie routed his camp at Castleknock.: I maj 1170 grävde Raymond FitzGerald in sig på udden Baginbun och krossade en mycket större styrka från Waterford. Strongbow landsteg i närheten den 23 augusti med omkring 200 riddare och 1 000 andra soldater, stormade Waterford och gifte sig med Aífe i staden. Den 21 september, medan Diarmait förhandlade med Dublins nordiske kung Ascall mac Ragnaill, bröt sig normandiska riddare in och intog staden. Diarmait dog i maj 1171, och Strongbow gjorde anspråk på Leinster, i strid med irländsk sedvänja. Ascall återvände med en nordisk flotta och besegrades och avrättades. Sedan belägrade Ruaidrí Dublin med en armé från större delen av Irland i två månader, tills ett utfall krossade hans läger vid Castleknock.
