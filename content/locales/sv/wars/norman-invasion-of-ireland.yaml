Henry feared that Strongbow would make himself an independent king across the Irish Sea, and came himself. On 17 October 1171 he landed near Waterford with at least 500 knights and 4,000 men-at-arms and archers, the first reigning king of England to set foot in Ireland. Strongbow did homage and kept Leinster as a fief, while Henry kept Dublin, Wexford and Waterford for the crown. Many Irish kings submitted to him at Waterford and Dublin, probably hoping he would restrain the barons; Ruaidrí did not. A synod at Cashel brought the Irish church into line with English practice. Henry granted Meath, still unconquered, to Hugh de Lacy, and sailed home in April 1172.: Henrik fruktade att Strongbow skulle göra sig till självständig kung på andra sidan Irländska sjön och kom själv. Den 17 oktober 1171 landsteg han nära Waterford med minst 500 riddare och 4 000 väpnare och bågskyttar, den förste regerande engelske kung som satte sin fot på Irland. Strongbow gjorde honom tro och huldhet och behöll Leinster som län, medan Henrik behöll Dublin, Wexford och Waterford åt kronan. Många irländska kungar underkastade sig honom i Waterford och Dublin, troligen i hopp om att han skulle tygla baronerna; Ruaidrí gjorde det inte. En synod i Cashel anpassade den irländska kyrkan till engelsk praxis. Henrik förlänade Meath, som ännu inte var erövrat, åt Hugh de Lacy och seglade hem i april 1172.
The barons kept pushing outwards. De Lacy’s men killed Tigernán Ua Ruairc at a parley in 1172, and Strongbow raided Offaly. When many Normans left in 1173 to fight in the great revolt against Henry, the Irish struck back. In 1174 Domnall Ua Briain of Thomond beat Strongbow’s army at Thurles, the townsmen of Waterford killed its garrison, and Ruaidrí’s army destroyed the castles at Trim and Duleek and marched on Dublin before reinforcements arrived. By the Treaty of Windsor of 6 October 1175 Henry kept Dublin, Meath, Leinster and Waterford to Dungarvan, while Ruaidrí ruled the rest as his vassal and paid a tribute in hides. It soon broke down as the barons pushed on.: Baronerna fortsatte att tränga utåt. De Lacys män dödade Tigernán Ua Ruairc under en överläggning 1172, och Strongbow gjorde plundringståg in i Offaly. När många normander 1173 lämnade landet för att strida i det stora upproret mot Henrik slog irländarna tillbaka. År 1174 slog Domnall Ua Briain av Thomond Strongbows armé vid Thurles, stadsborna i Waterford dödade garnisonen och Ruaidrís armé förstörde borgarna i Trim och Duleek och marscherade mot Dublin innan förstärkningar anlände. Genom fördraget i Windsor den 6 oktober 1175 behöll Henrik Dublin, Meath, Leinster och Waterford fram till Dungarvan, medan Ruaidrí styrde resten som hans vasall och betalade tribut i hudar. Fördraget bröt snart samman när baronerna trängde vidare.
