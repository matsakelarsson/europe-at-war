Norman invasion of Ireland: Normandernas invasion av Irland
The arrival of Cambro-Norman knights in Ireland, invited in 1169 by Diarmait Mac Murchada, the exiled king of Leinster. They took Wexford, Waterford and Dublin, and their leader Strongbow claimed Leinster; in 1171 King Henry II came himself and received the submission of the Normans and of many Irish kings. The Treaty of Windsor of 1175 left Henry lord of the conquered east and the high king Ruaidrí Ua Conchobair overlord of the rest under him, the start of English rule in Ireland.: Kambronormandiska riddares ankomst till Irland 1169 på inbjudan av Diarmait Mac Murchada, Leinsters landsflyktige kung. De tog Wexford, Waterford och Dublin, och deras ledare Strongbow gjorde anspråk på Leinster; 1171 kom kung Henrik II själv och tog emot normandernas och många irländska kungars underkastelse. Fördraget i Windsor 1175 gjorde Henrik till herre över det erövrade östra Irland och storkonungen Ruaidrí Ua Conchobair till överherre över resten under honom, vilket blev början på det engelska styret på Irland.
