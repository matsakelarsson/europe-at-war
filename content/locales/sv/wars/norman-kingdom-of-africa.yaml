# Svenska översättningar av katalogtexten (våg 12); stegtexterna kommer senare.
Norman conquests in Ifriqiya: Normandernas erövringar i Ifriqiya
The conquest of the coast of Ifriqiya and Tripolitania by the Norman kings of Sicily, and its loss to the Almohads. Weakened by the Hilalian migration, famine and civil strife, the Zirid emirs of Mahdia came to depend on Sicilian grain and trade. After a failed landing near Mahdia in 1123, Roger II took the island of Djerba in 1135 and Tripoli in 1146, and in June 1148 his admiral George of Antioch occupied Mahdia, the Zirid capital, without a fight, followed by Sousse, Sfax and Gabès. Roger styled himself king of Africa and ruled the towns through Muslim governors and judges, in return for tribute. From 1156 the towns rose against William I, Roger’s successor, and asked the Almohad caliph Abd al-Mu’min for help. His army and fleet took Tunis in 1159 and besieged Mahdia, whose Norman garrison surrendered in January 1160 and was allowed to sail home, ending the Norman kingdom in Africa.: Siciliens normandiska kungars erövring av kusten i Ifriqiya och Tripolitanien, och hur kusten sedan gick förlorad till almohaderna. Försvagade av den hilaliska invandringen, hungersnöd och inbördes strider kom de ziridiska emirerna i Mahdia att bli beroende av siciliansk spannmål och handel. Efter en misslyckad landstigning nära Mahdia 1123 intog Roger II ön Djerba 1135 och Tripoli 1146, och i juni 1148 besatte hans amiral Georg av Antiochia utan strid Mahdia, ziridernas huvudstad, och därefter Sousse, Sfax och Gabès. Roger kallade sig kung av Afrika och styrde städerna genom muslimska guvernörer och domare, i utbyte mot tribut. Från 1156 reste sig städerna mot Vilhelm I, Rogers efterträdare, och bad den almohadiske kalifen Abd al-Mu’min om hjälp. Hans armé och flotta intog Tunis 1159 och belägrade Mahdia, vars normandiska garnison kapitulerade i januari 1160 och fick segla hem, vilket gjorde slut på det normandiska kungariket i Afrika.
