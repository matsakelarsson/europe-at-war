# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
Norse encounters with the Skrælings in Vinland: Nordbornas möten med skrälingarna i Vinland
? The first recorded fighting between Europeans and the peoples of the Americas, during the Norse voyages from Greenland to the lands they called Helluland, Markland and Vinland in the early eleventh century. The two Icelandic sagas of Vinland, the Saga of the Greenlanders and the Saga of Erik the Red, written down some two centuries later, tell that Leif Eriksson’s brother Thorvald and his men killed eight people they found sleeping under three skin boats; the next day a large party attacked the Norse ships and Thorvald was killed by an arrow. A few years later Thorfinn Karlsefni tried to settle Vinland with, by one saga’s count, three ships and 140 or more people. At first they traded red cloth and milk for furs with the people the Norse called Skrælings, but after a quarrel, or by the other saga after a bull frightened them, the Skrælings came back in force; two Norse were killed and many of the attackers, and Karlsefni’s people, outnumbered and with no hope of help, went back to Greenland after about three years. The site at L’Anse aux Meadows in northern Newfoundland, where wood was cut with metal tools in 1021, is the only confirmed Norse site in North America outside Greenland. The people the Norse met in Vinland were probably ancestors of the Beothuk, the Innu or the Mi’kmaq; in Greenland, where the word skræling was later used for the Thule ancestors of the Inuit, the Norse traded and sometimes fought with them until the Norse settlements were abandoned in the fifteenth century.
: De första kända striderna mellan européer och Amerikas folk, under nordbornas färder från Grönland till de länder som de kallade Helluland, Markland och Vinland i början av 1000-talet. De två isländska sagorna om Vinland, Grönlänningasagan och Erik den rödes saga, som skrevs ned omkring två sekler senare, berättar att Leif Erikssons bror Torvald och hans män dödade åtta människor som de fann sovande under tre skinnbåtar; dagen därpå anföll en stor skara de nordiska skeppen och Torvald dödades av en pil. Några år senare försökte Torfinn Karlsefne grunda en bosättning i Vinland med, enligt den ena sagans uppgift, tre skepp och 140 eller fler människor. Till en början bytte de till sig pälsar mot rött tyg och mjölk av det folk som nordborna kallade skrälingar, men efter ett gräl, eller enligt den andra sagan sedan en tjur hade skrämt dem, kom skrälingarna tillbaka i stort antal; två nordbor dödades och många av angriparna, och Karlsefnes folk, som var underlägset i antal och saknade hopp om hjälp, återvände till Grönland efter omkring tre år. Platsen L’Anse aux Meadows på norra Newfoundland, där trä höggs med metallverktyg år 1021, är den enda bekräftade nordiska boplatsen i Nordamerika utanför Grönland. Det folk som nordborna mötte i Vinland var troligen förfäder till beothukerna, innu eller mi’kmaq; på Grönland, där ordet skräling senare användes om thulefolket, inuiternas förfäder, handlade nordborna med dem och stred ibland mot dem tills de nordiska bosättningarna övergavs på 1400-talet.
