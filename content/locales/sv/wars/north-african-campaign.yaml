# Svenska översättningar av katalogtexten (våg 12); stegtexterna kommer senare.
North African campaign: Nordafrikanska fälttåget
? The Second World War in North Africa, fought from June 1940 to May 1943 between the British Commonwealth, Free France and from 1942 the United States on one side and Italy and Germany on the other. Italy invaded Egypt from Libya in September 1940 and was routed in Operation Compass. German forces under Erwin Rommel arrived in 1941, and for two years the armies swung back and forth along the coast road of Libya and western Egypt, around the besieged port of Tobruk, until the Axis advance was stopped at El Alamein in July 1942. Bernard Montgomery’s Eighth Army broke the Axis line at El Alamein in November 1942, just as American and British troops landed in Vichy French Morocco and Algeria in Operation Torch. Germany and Italy poured troops into Tunisia, where they held out until 13 May 1943, when some 250,000 of their soldiers surrendered. The war was fought across the lands of Libyans, Egyptians, Tunisians, Algerians and Moroccans, many of whom served in the armies on both sides; the Jews of Libya and Tunisia suffered persecution, internment and forced labour.
: Andra världskriget i Nordafrika, som utkämpades från juni 1940 till maj 1943 mellan Brittiska samväldet, Fria Frankrike och från 1942 USA på ena sidan och Italien och Tyskland på den andra. Italien invaderade Egypten från Libyen i september 1940 och slogs på flykten i Operation Compass. Tyska styrkor under Erwin Rommel anlände 1941, och i två år böljade arméerna fram och tillbaka längs kustvägen i Libyen och västra Egypten, kring den belägrade hamnstaden Tobruk, tills axelmakternas framryckning hejdades vid El Alamein i juli 1942. Bernard Montgomerys åttonde armé bröt igenom axelmakternas linje vid El Alamein i november 1942, just när amerikanska och brittiska trupper landsteg i det av Vichyfrankrike styrda Marocko och Algeriet i Operation Torch. Tyskland och Italien skickade stora mängder trupper till Tunisien, där de höll ut till den 13 maj 1943, då omkring 250 000 av deras soldater kapitulerade. Kriget utkämpades i libyernas, egyptiernas, tunisiernas, algeriernas och marockanernas länder, och många av dem tjänstgjorde i arméerna på båda sidor; judarna i Libyen och Tunisien utsattes för förföljelse, internering och tvångsarbete.
