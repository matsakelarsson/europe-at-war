# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
North-West Rebellion: Nordvästupproret
? The armed resistance of the Métis of the Saskatchewan valley, led by Louis Riel and Gabriel Dumont, and of some Cree and Assiniboine (Nakoda) bands against the government of Canada in the spring of 1885, also called the North-West Resistance. The Métis, many of whom had left Manitoba after 1870, petitioned in vain for title to their river-lot farms, while the Cree, Assiniboine and other First Nations of the plains, who had signed Treaty 6 in 1876, were starving after the buffalo disappeared and the government cut their rations. Riel, called back from Montana, declared a provisional government at Batoche on 19 March 1885, and on 26 March the Métis defeated the North-West Mounted Police at Duck Lake. Warriors of Big Bear’s band killed nine men at Frog Lake on 2 April, and Cree and Assiniboine looted Battleford. The government sent some 5,000 troops west, many of them by the nearly finished Canadian Pacific Railway. The Métis stopped General Frederick Middleton at Fish Creek on 24 April, and Cree and Assiniboine under Fine Day drove off Colonel William Otter at Cut Knife on 2 May, but Middleton took Batoche on 12 May, and Riel surrendered. Poundmaker gave himself up on 26 May, Big Bear on 2 July. Riel was hanged for high treason at Regina on 16 November 1885, and eight Cree and Assiniboine men were hanged at Battleford on 27 November, the largest mass execution in Canadian history. The conflict confirmed Canadian control of the prairies, deepened the divide between English and French Canada and was followed by harsh controls on the First Nations of the plains.
: Det väpnade motstånd som métis i Saskatchewandalen, under ledning av Louis Riel och Gabriel Dumont, och några grupper av cree och assiniboine (nakoda) gjorde mot Kanadas regering våren 1885, även kallat Nordvästmotståndet. Métis, av vilka många hade lämnat Manitoba efter 1870, begärde förgäves äganderätt till sina gårdar på smala tegar längs floden, medan cree, assiniboine och andra ursprungsfolk (First Nations) på prärien, som hade undertecknat fördrag nr 6 år 1876, svalt sedan bisonen hade försvunnit och regeringen skurit ned deras ransoner. Riel, som hade kallats tillbaka från Montana, utropade en provisorisk regering i Batoche den 19 mars 1885, och den 26 mars besegrade métis North-West Mounted Police vid Duck Lake. Krigare ur Big Bears grupp dödade nio män vid Frog Lake den 2 april, och cree och assiniboine plundrade Battleford. Regeringen sände omkring 5 000 soldater västerut, många av dem med den nästan färdiga Canadian Pacific-järnvägen. Métis stoppade general Frederick Middleton vid Fish Creek den 24 april, och cree och assiniboine under Fine Day drev tillbaka överste William Otter vid Cut Knife den 2 maj, men Middleton intog Batoche den 12 maj, och Riel gav upp. Poundmaker överlämnade sig den 26 maj, Big Bear den 2 juli. Riel hängdes för högförräderi i Regina den 16 november 1885, och åtta män ur cree och assiniboine hängdes i Battleford den 27 november, den största massavrättningen i Kanadas historia. Konflikten befäste Kanadas kontroll över prärierna, fördjupade klyftan mellan det engelska och det franska Kanada och följdes av hårda kontrollåtgärder mot prärieområdets ursprungsfolk.
