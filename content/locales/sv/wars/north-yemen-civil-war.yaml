# Svenska översättningar av katalogtexten (våg 7); stegtexterna kommer senare.
North Yemen Civil War: Nordjemenitiska inbördeskriget
The war between the Yemen Arab Republic, proclaimed by army officers who overthrew the Zaydi imam Muhammad al-Badr on 26 September 1962, and the royalists who rallied to the imam in the northern highlands. Egypt under Gamal Abdel Nasser sent an expeditionary force that grew to some 70,000 men to defend the republic, while Saudi Arabia, Jordan and, covertly, Britain armed the royalists, making the war a proxy struggle between Arab republics and monarchies, sometimes called “Egypt’s Vietnam”. Egyptian forces held the towns and roads but could not defeat the tribes, and used chemical weapons. After its defeat by Israel in June 1967 Egypt agreed to withdraw; the republicans held Sanaa through a 70-day royalist siege in 1967–1968, and in 1970 a compromise brought royalists into the government and Saudi recognition of the republic. Estimates of the dead range from about 100,000 to 200,000.: Kriget mellan Jemenitiska arabrepubliken, som utropades av arméofficerare som störtade den zayditiske imamen Muhammad al-Badr den 26 september 1962, och de rojalister som samlades kring imamen i det norra höglandet. Egypten under Gamal Abdel Nasser sände en expeditionskår som växte till omkring 70 000 man för att försvara republiken, medan Saudiarabien, Jordanien och i hemlighet Storbritannien beväpnade rojalisterna, vilket gjorde kriget till ett ställföreträdarkrig mellan arabiska republiker och monarkier, ibland kallat ”Egyptens Vietnam”. De egyptiska styrkorna höll städerna och vägarna men kunde inte besegra stammarna och använde kemiska vapen. Efter nederlaget mot Israel i juni 1967 gick Egypten med på att dra sig tillbaka; republikanerna höll Sanaa under en 70 dagar lång rojalistisk belägring 1967–1968, och 1970 förde en kompromiss in rojalister i regeringen och gav republiken saudiskt erkännande. Uppskattningarna av antalet döda varierar från omkring 100 000 till 200 000.
