# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
Northern Expedition: Norra expeditionen
? "The campaign in which the Kuomintang’s National Revolutionary Army marched from Guangzhou to Beijing in 1926–1928, defeated the warlord armies of Wu Peifu, Sun Chuanfang and Zhang Zuolin, and brought China under the Nationalist government in Nanjing. Launched on 9 July 1926 with about 100,000 men, Soviet advisers and Chinese Communists inside the alliance of the first united front, it took Hunan and Hubei in the summer and autumn of 1926 and Jiangxi, Fujian and Zhejiang by early 1927. When it reached Shanghai and Nanjing in March 1927, the movement split: Chiang Kai-shek turned on the Communists in the Shanghai massacre of 12 April and set up his own government in Nanjing, against the left-wing Kuomintang government in Wuhan, which broke with the Communists in July. Reunited under Chiang and joined by Feng Yuxiang, Yan Xishan and the Guangxi clique, the Nationalist armies, about a million men, resumed the advance in April 1928. Japanese troops clashed with them at Jinan in May, killing thousands of Chinese, and on 4 June officers of Japan’s Kwantung Army killed Zhang Zuolin by blowing up his train as he withdrew to Manchuria. Beijing was taken in June and renamed Beiping, and on 29 December 1928 Zhang’s son Zhang Xueliang raised the Nationalist flag over the north-east. Estimates of deaths, including civilians, range from about 370,000 to over 900,000."
: "Det fälttåg där Kuomintangs Nationella revolutionära armé 1926–1928 marscherade från Kanton till Peking, besegrade krigsherrearméerna under Wu Peifu, Sun Chuanfang och Zhang Zuolin och förde Kina under den nationalistiska regeringen i Nanking. Fälttåget inleddes den 9 juli 1926 med omkring 100 000 man, sovjetiska rådgivare och kinesiska kommunister inom den första enhetsfrontens allians, och det tog Hunan och Hubei sommaren och hösten 1926 och Jiangxi, Fujian och Zhejiang i början av 1927. När det nådde Shanghai och Nanking i mars 1927 splittrades rörelsen: Chiang Kai-shek vände sig mot kommunisterna i Shanghaimassakern den 12 april och bildade en egen regering i Nanking, i opposition mot den vänsterinriktade Kuomintangregeringen i Wuhan, som bröt med kommunisterna i juli. Återförenade under Chiang och förstärkta av Feng Yuxiang, Yan Xishan och Guangxiklicken återupptog de nationalistiska arméerna, omkring en miljon man, framryckningen i april 1928. Japanska trupper drabbade samman med dem i Jinan i maj och dödade tusentals kineser, och den 4 juni dödade officerare ur Japans Kwantungarmé Zhang Zuolin genom att spränga hans tåg när han drog sig tillbaka till Manchuriet. Peking intogs i juni och döptes om till Beiping, och den 29 december 1928 hissade Zhangs son Zhang Xueliang den nationalistiska flaggan över nordost. Uppskattningarna av antalet döda, civila inräknade, varierar från omkring 370 000 till över 900 000."
