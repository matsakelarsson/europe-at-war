# Svenska översättningar av katalogtexten (våg 10); stegtexterna kommer senare.
Northern Limit Line clashes: Sammandrabbningarna vid Northern Limit Line
? A series of armed clashes between North and South Korea in the Yellow Sea (West Sea) along the Northern Limit Line (NLL), the sea boundary that the UN Command drew after the armistice of 1953 and that North Korea does not recognise. The line keeps five islands off the North Korean coast, among them Baengnyeong and Yeonpyeong, under South Korean control, and runs through rich crab grounds. Naval battles near Yeonpyeong in June 1999 and June 2002, both fought when North Korean patrol boats crossed the line with fishing boats, cost a North Korean torpedo boat and a South Korean patrol boat and dozens of lives, and a further clash followed near Daecheong in November 2009. On 26 March 2010 the South Korean corvette Cheonan broke in two and sank near Baengnyeong with the loss of 46 sailors; an international investigation led by South Korea blamed a North Korean torpedo, which North Korea denies. On 23 November 2010 North Korean artillery shelled Yeonpyeong Island, killing two marines and two civilians, the first attack on South Korean civilians on land since the Korean War.
: En serie väpnade sammandrabbningar mellan Nord- och Sydkorea i Gula havet (Västra havet) längs Northern Limit Line (NLL), den sjögräns som FN-kommandot drog upp efter vapenstilleståndet 1953 och som Nordkorea inte erkänner. Linjen håller fem öar utanför den nordkoreanska kusten, bland dem Baengnyeong och Yeonpyeong, under sydkoreansk kontroll och går genom rika krabbfångstvatten. Sjöslag nära Yeonpyeong i juni 1999 och juni 2002, båda utkämpade när nordkoreanska patrullbåtar korsade linjen tillsammans med fiskebåtar, kostade en nordkoreansk torpedbåt och en sydkoreansk patrullbåt och tiotals människoliv, och ytterligare en sammandrabbning följde nära Daecheong i november 2009. Den 26 mars 2010 bröts den sydkoreanska korvetten Cheonan i två delar och sjönk nära Baengnyeong, varvid 46 sjömän omkom; en internationell utredning under sydkoreansk ledning lade skulden på en nordkoreansk torped, vilket Nordkorea förnekar. Den 23 november 2010 besköt nordkoreanskt artilleri ön Yeonpyeong och dödade två marinkårssoldater och två civila, det första angreppet på sydkoreanska civila på land sedan Koreakriget.
