The Danish army burned its way through Östergötland and threatened Stockholm before turning back.: Den danska armén brände sig fram genom Östergötland och hotade Stockholm innan den vände om.
Hamar: Hamar
A Swedish army took the town, badly damaging its cathedral, and went on to besiege Akershus fortress.: En svensk armé intog staden, skadade dess domkyrka svårt och gick vidare för att belägra fästningen Akershus.
A peace congress called by the Emperor. Denmark gave up all claims on Sweden.: En fredskongress som sammankallats av kejsaren. Danmark avstod från alla anspråk på Sverige.
