Varberg: Varberg
August 1565: augusti 1565
"The biggest Swedish success on land: the fortress fell after a six-day siege and stayed Swedish until 1569.": "Den största svenska framgången till lands: fästningen föll efter sex dagars belägring och förblev svensk till 1569."
20 October 1565: 20 oktober 1565
Rantzau’s Danish army beat a bigger Swedish force not far from Varberg.: Rantzaus danska armé slog en större svensk styrka inte långt från Varberg.
In spring 1567 the Swedes attacked south-eastern Norway, took Hamar and besieged Akershus. In the winter of 1567–68 Daniel Rantzau led some 4,000 men on one of the most destructive raids of the war, deep into central Sweden, until supply problems forced him back. In 1568 Eric XIV, by now unstable and guilty of murdering nobles, was deposed by his brothers.: Våren 1567 angrep svenskarna sydöstra Norge, intog Hamar och belägrade Akershus. Vintern 1567–68 ledde Daniel Rantzau omkring 4 000 man på ett av krigets mest förödande härjningståg, djupt in i mellersta Sverige, tills försörjningsproblem tvingade honom tillbaka. År 1568 avsattes Erik XIV, som vid det laget var sinnesförvirrad och skyldig till mord på adelsmän, av sina bröder.
Peace came at Stettin on 13 December 1570. No land changed hands, but Sweden had to buy back Älvsborg for 150,000 riksdaler, the First Älvsborg Ransom.: Fred slöts i Stettin den 13 december 1570. Inga landområden bytte ägare, men Sverige måste köpa tillbaka Älvsborg för 150 000 riksdaler, Älvsborgs första lösen.
