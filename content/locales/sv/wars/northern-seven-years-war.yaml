Northern Seven Years’ War: Nordiska sjuårskriget
A war between Sweden and an alliance of Denmark–Norway, Lübeck and Poland–Lithuania over the control of the Baltic and the legacy of the Kalmar Union. After seven years of destructive fighting the Peace of Stettin in 1570 left the borders unchanged, but Sweden had to pay a ransom for the fortress of Älvsborg.: Ett krig mellan Sverige och en allians av Danmark–Norge, Lübeck och Polen–Litauen om herraväldet över Östersjön och Kalmarunionens arv. Efter sju år av förödande strider lämnade freden i Stettin 1570 gränserna oförändrade, men Sverige tvingades betala en lösen för fästningen Älvsborg.
