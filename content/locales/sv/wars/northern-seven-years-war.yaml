Rantzau: Rantzau
Frederick II of Denmark resented the end of the Kalmar Union, and Eric XIV of Sweden wanted to break Denmark’s hold on the Baltic. Denmark–Norway, Lübeck and Poland–Lithuania went to war with Sweden in 1563. The Danes took Älvsborg, Sweden’s only port on the west coast, in September 1563, and beat a Swedish force at Mared in November.: Fredrik II av Danmark harmades över Kalmarunionens slut, och Erik XIV av Sverige ville bryta Danmarks grepp om Östersjön. Danmark–Norge, Lübeck och Polen–Litauen gick i krig med Sverige 1563. Danskarna intog Älvsborg, Sveriges enda hamn på västkusten, i september 1563 och slog en svensk styrka vid Mared i november.
The Swedes did better at sea, and in August 1565 they took the Halland fortress of Varberg. But on 20 October 1565 a Danish army under Daniel Rantzau defeated a larger Swedish army at Axtorna nearby, the only major land battle of the war.: Svenskarna klarade sig bättre till sjöss, och i augusti 1565 intog de den halländska fästningen Varberg. Men den 20 oktober 1565 besegrade en dansk armé under Daniel Rantzau en större svensk armé vid Axtorna i närheten, krigets enda större fältslag till lands.
