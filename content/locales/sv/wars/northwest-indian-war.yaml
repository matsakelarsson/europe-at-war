# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
Northwest Indian War: Nordvästra indiankriget
? The war between the United States and a confederacy of Native nations of the Great Lakes and the Ohio country for the land north-west of the Ohio River. At the peace of 1783 Britain gave the United States a claim to the region, but the Shawnee, Miami (Myaamia), Lenape, Wyandot, Odawa, Ojibwe, Potawatomi and others who lived there had not been defeated. They rejected the land cessions that American commissioners dictated to a few of their leaders in 1784–1786, insisted that the Ohio River was the boundary, and, supplied from the British posts that Britain kept on American soil, fought the settlers who crossed it. Under the Miami leader Little Turtle and the Shawnee leader Blue Jacket the Western Confederacy defeated Josiah Harmar’s expedition in 1790 and destroyed Arthur St. Clair’s army on 4 November 1791, killing more than 600 soldiers, the heaviest defeat the United States Army ever suffered at the hands of Native forces. Anthony Wayne then built a new, trained army, the Legion of the United States, held off an attack on Fort Recovery and on 20 August 1794 broke the confederacy’s forces at Fallen Timbers, near a British fort whose gates stayed shut. By the Treaty of Greenville of 3 August 1795 the nations ceded most of present-day Ohio.
: Kriget mellan USA och ett förbund av ursprungsnationer kring Stora sjöarna och i Ohiolandet om landet nordväst om Ohiofloden. Vid freden 1783 gav Storbritannien USA anspråk på regionen, men shawnee, miami (myaamia), lenape, wyandot, odawa, ojibwe, potawatomi med flera som bodde där hade inte besegrats. De förkastade de landavträdelser som amerikanska kommissionärer dikterade för några få av deras ledare 1784–1786, hävdade att Ohiofloden var gränsen och bekämpade, med förnödenheter från de utposter som Storbritannien behöll på amerikansk mark, de nybyggare som gick över den. Under miamiledaren Little Turtle och shawneeledaren Blue Jacket besegrade Västra förbundet Josiah Harmars expedition 1790 och förintade Arthur St. Clairs armé den 4 november 1791, varvid mer än 600 soldater dödades, det svåraste nederlag som USA:s armé någonsin har lidit mot ursprungsamerikanska styrkor. Anthony Wayne byggde då upp en ny, utbildad armé, USA:s legion, slog tillbaka ett anfall mot Fort Recovery och krossade den 20 augusti 1794 förbundets styrkor vid Fallen Timbers, nära ett brittiskt fort vars portar förblev stängda. Genom fördraget i Greenville den 3 augusti 1795 avträdde nationerna större delen av nuvarande Ohio.
Western Confederacy (Shawnee, Miami, Lenape, Wyandot, Odawa, Ojibwe, Potawatomi, Mingo, Kickapoo and others): Västra förbundet (shawnee, miami, lenape, wyandot, odawa, ojibwe, potawatomi, mingo, kickapoo med flera)
United States (the Army, the Legion of the United States and Kentucky militia, with Chickasaw and Choctaw scouts): USA (armén, USA:s legion och milis från Kentucky, med spejare från chickasaw och choctaw)
Great Britain (posts on American soil, supplies and agents; not at war): Storbritannien (utposter på amerikansk mark, förnödenheter och agenter; inte i krig)
