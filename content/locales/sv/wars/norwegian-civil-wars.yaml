Norwegian civil wars: Inbördeskrigen i Norge
More than a century of wars between rival kings and pretenders to the Norwegian throne, begun when Harald Gille broke his oath and claimed the crown on the death of Sigurd the Crusader in 1130. From the 1170s the wars were fought between two parties, the Birkebeiner, who brought King Sverre to power, and the church-backed Bagler. The parties were reconciled in 1217 under Haakon IV, and the defeat of Duke Skule Bårdsson’s rising in 1240 ended the era, leaving a stronger monarchy and clearer rules of succession.: "Mer än ett sekel av krig mellan rivaliserande kungar och tronpretendenter i Norge, som började när Harald Gille bröt sin ed och gjorde anspråk på kronan vid Sigurd Jorsalafarares död 1130. Från 1170-talet stod striderna mellan två partier: birkebeinarna, som förde kung Sverre till makten, och de kyrkligt stödda baglerna. Partierna försonades 1217 under Håkon IV, och nederlaget för hertig Skule Bårdssons uppror 1240 avslutade epoken och lämnade efter sig en starkare kungamakt och tydligare tronföljdsregler."
