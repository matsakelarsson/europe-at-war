Norwegian invasion of England: Norska invasionen av England
King Harald Hardrada of Norway invaded England in September 1066 to claim its throne, together with the exiled Earl Tostig. He won at Fulford but was killed with most of his army at Stamford Bridge by King Harold Godwinson, three weeks before Harold’s own defeat at Hastings.: Kung Harald Hårdråde av Norge invaderade England i september 1066 för att göra anspråk på tronen, tillsammans med den landsflyktige earlen Tostig. Han segrade vid Fulford men stupade med större delen av sin här vid Stamford Bridge mot kung Harald Godwinson, tre veckor före Haralds eget nederlag vid Hastings.
