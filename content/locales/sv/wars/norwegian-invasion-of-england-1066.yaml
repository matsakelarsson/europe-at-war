King Harold had spent the summer guarding the south coast against William. Hearing of the invasion, he marched north from London, covering some 185 miles in about four days, and passed through York on the morning of 25 September. The Norwegians had gone to Stamford Bridge on the Derwent to collect the hostages, many of them without their mail shirts in the warm weather. They were taken completely by surprise.: Kung Harald hade tillbringat sommaren med att bevaka sydkusten mot Vilhelm. När han fick höra om invasionen marscherade han norrut från London, omkring 300 kilometer på ungefär fyra dagar, och passerade genom York på morgonen den 25 september. Norrmännen hade begett sig till Stamford Bridge vid Derwent för att hämta gisslan, många av dem utan sina ringbrynjor i det varma vädret. De blev fullständigt överraskade.
The fighting lasted most of the day. Hardrada was killed early, struck in the throat by an arrow according to the sagas, and Tostig soon after. Men from the ships at Riccall under Eystein Orre ran to join the battle and were cut down in turn. Harold let the survivors, among them Hardrada’s son Olaf and the earl of Orkney, sail home; only 24 ships were needed to carry them. Three days later William landed in Sussex, and on 14 October Harold was killed at Hastings.: Striderna pågick större delen av dagen. Hårdråde stupade tidigt, enligt sagorna träffad i strupen av en pil, och Tostig strax därefter. Män från fartygen vid Riccall under Eystein Orre sprang för att delta i slaget och höggs i sin tur ned. Harald lät de överlevande, bland dem Hårdrådes son Olav och jarlen av Orkney, segla hem; bara 24 fartyg behövdes för att föra dem. Tre dagar senare landsteg Vilhelm i Sussex, och den 14 oktober stupade Harald vid Hastings.
