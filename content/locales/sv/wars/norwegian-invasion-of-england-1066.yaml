The English sources are the Anglo-Saxon Chronicle and later Anglo-Norman writers; the Norwegian story is told in Snorri Sturluson’s saga of Harald Hardrada, written about 170 years later. Numbers of ships and men are uncertain.: De engelska källorna är Anglosaxiska krönikan och senare anglonormandiska skribenter; den norska berättelsen finns i Snorre Sturlassons saga om Harald Hårdråde, skriven omkring 170 år senare. Antalet fartyg och män är osäkert.
The battle is traditionally seen as the end of the Viking Age, though Danish and Norwegian kings still sent fleets to Britain and Ireland in the following decades.: Slaget ses traditionellt som vikingatidens slut, även om danska och norska kungar fortfarande sände flottor till Britannien och Irland under de följande årtiondena.
