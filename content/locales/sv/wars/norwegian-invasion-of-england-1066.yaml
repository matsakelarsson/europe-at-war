When Edward the Confessor died in January 1066, the English chose Harold Godwinson as king. Two foreign rulers also claimed the throne, William of Normandy and Harald Hardrada of Norway, a veteran warrior who had served the Byzantine emperor. Harold’s brother Tostig, driven out as earl of Northumbria in 1065, had raided the English coast that spring and now joined Hardrada. In September a Norwegian fleet, 300 ships according to the Chronicle, sailed by way of Orkney to the coast of Yorkshire.: När Edvard Bekännaren dog i januari 1066 valde engelsmännen Harald Godwinson till kung. Två utländska härskare gjorde också anspråk på tronen, Vilhelm av Normandie och Harald Hårdråde av Norge, en erfaren krigare som hade tjänat den bysantinske kejsaren. Haralds bror Tostig, som hade fördrivits som earl av Northumbria 1065, hade härjat den engelska kusten under våren och anslöt sig nu till Hårdråde. I september seglade en norsk flotta, 300 fartyg enligt krönikan, via Orkney till Yorkshires kust.
The fleet rowed up the Humber and the Ouse to Riccall, south of York. On 20 September the northern earls, Edwin of Mercia and Morcar of Northumbria, met the invaders at Fulford, just outside the city. After heavy fighting on both sides the English broke. York surrendered on condition that it would not be sacked, and agreed to hand over hostages and supplies. The Norwegians went back to their ships to wait.: Flottan rodde uppför Humber och Ouse till Riccall, söder om York. Den 20 september mötte de nordliga earlerna, Edwin av Mercia och Morcar av Northumbria, inkräktarna vid Fulford, strax utanför staden. Efter hårda strider med svåra förluster på båda sidor bröts engelsmännen. York kapitulerade på villkor att staden inte skulle plundras och gick med på att lämna gisslan och förnödenheter. Norrmännen återvände till sina fartyg för att vänta.
