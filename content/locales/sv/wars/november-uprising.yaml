November Uprising: Novemberupproret
A rising in Russian-ruled Congress Poland that began with an attack by officer cadets in Warsaw on 29 November 1830 and grew into a full war between the kingdom’s army and the Russian Empire. After hard-fought battles at Olszynka Grochowska and Ostrołęka, Russian troops took Warsaw in September 1831; the kingdom lost its constitution and army, and thousands of Poles went into exile in the Great Emigration.: Ett uppror i det ryskstyrda Kongresspolen som började med ett anfall av officerskadetter i Warszawa den 29 november 1830 och växte till ett fullskaligt krig mellan kungarikets armé och Ryska riket. Efter hårda slag vid Olszynka Grochowska och Ostrołęka intog ryska trupper Warszawa i september 1831. Kungariket förlorade sin författning och sin armé, och tusentals polacker gick i exil i den stora emigrationen.
