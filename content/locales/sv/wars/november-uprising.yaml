Dates are New Style (Gregorian), as used in the Kingdom of Poland. Russia still used the Julian calendar, then 12 days behind.: Datumen anges enligt nya stilen (den gregorianska kalendern), som användes i Kungariket Polen. Ryssland använde fortfarande den julianska kalendern, som då låg 12 dagar efter.
Casualty figures for the battles vary between sources and are given here as approximate.: Förlustsiffrorna för slagen varierar mellan källorna och anges här som ungefärliga.
Congress Poland, the kingdom created at the Congress of Vienna in 1815, had its own constitution, parliament and army, but its king was the Russian tsar, and his brother Grand Duke Constantine commanded the army. On the evening of 29 November 1830 officer cadets led by Piotr Wysocki attacked Constantine’s residence, the Belweder palace in Warsaw, while crowds seized the Arsenal. Constantine escaped and left the city with his Russian troops, and the Polish army went over to the rising.: Kongresspolen, det kungarike som skapades vid Wienkongressen 1815, hade egen författning, eget parlament och egen armé, men dess kung var den ryske tsaren, och hans bror storfursten Konstantin förde befälet över armén. På kvällen den 29 november 1830 anföll officerskadetter ledda av Piotr Wysocki Konstantins residens, Belwederpalatset i Warszawa, medan folkmassor intog arsenalen. Konstantin kom undan och lämnade staden med sina ryska trupper, och den polska armén gick över till upproret.
General Józef Chłopicki took power as dictator on 5 December and tried to negotiate, but Tsar Nicholas I demanded unconditional surrender. On 25 January 1831 the Sejm declared Nicholas dethroned, and on 4 February Field Marshal Hans Karl von Diebitsch crossed the border with about 115,000 men. Polish cavalry under Józef Dwernicki won at Stoczek, and on 25 February about 40,000 Poles held off some 60,000 Russians at Olszynka Grochowska outside Warsaw. Both sides lost more than 7,000 men.: General Józef Chłopicki tog makten som diktator den 5 december och försökte förhandla, men tsar Nikolaj I krävde villkorslös kapitulation. Den 25 januari 1831 förklarade sejmen Nikolaj avsatt, och den 4 februari gick fältmarskalk Hans Karl von Diebitsch över gränsen med omkring 115 000 man. Polskt kavalleri under Józef Dwernicki segrade vid Stoczek, och den 25 februari höll omkring 40 000 polacker stånd mot omkring 60 000 ryssar vid Olszynka Grochowska utanför Warszawa. Båda sidor förlorade mer än 7 000 man.
