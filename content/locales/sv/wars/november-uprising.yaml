Retreat into Prussia: Reträtt in i Preussen
Nicholas I abolished the kingdom’s constitution. The Organic Statute of 1832 kept some separate institutions but ended the Sejm and the Polish army, and Warsaw University was closed. Estates of insurgents were confiscated, many participants were exiled to Siberia or conscripted into the Russian army, and a new citadel was built over Warsaw to hold the city down.: Nikolaj I avskaffade kungarikets författning. Organiska statuten från 1832 behöll vissa egna institutioner men avskaffade sejmen och den polska armén, och Warszawas universitet stängdes. Upprorsmännens gods konfiskerades, många deltagare förvisades till Sibirien eller tvångsinkallades till den ryska armén, och ett nytt citadell byggdes över Warszawa för att hålla staden i schack.
Thousands of soldiers, politicians and writers chose exile rather than submission. They crossed the German states in small groups, greeted by enthusiastic crowds, and most settled in France. In Paris Prince Adam Czartoryski led a conservative government-in-exile, later known by his house, the Hôtel Lambert, while the historian Joachim Lelewel led the democrats. The poets Adam Mickiewicz and Juliusz Słowacki made the emigration the centre of Polish literature for a generation.: Tusentals soldater, politiker och författare valde landsflykt framför underkastelse. De tog sig genom de tyska staterna i små grupper, hälsade av entusiastiska folkmassor, och de flesta bosatte sig i Frankrike. I Paris ledde furst Adam Czartoryski en konservativ exilregering, senare känd efter hans residens, Hôtel Lambert, medan historikern Joachim Lelewel ledde demokraterna. Poeterna Adam Mickiewicz och Juliusz Słowacki gjorde emigrationen till den polska litteraturens centrum under en generation.
