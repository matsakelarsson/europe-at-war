Diebitsch: Diebitsch
In the spring the new Polish commander, General Jan Skrzynecki, won at Wawer and Dębe Wielkie on 31 March and at Iganie on 10 April, but did not follow up his successes. Risings broke out in Lithuania, where Countess Emilia Plater led a partisan unit, and in Volhynia and Podolia, but they were put down. On 26 May Diebitsch caught Skrzynecki’s army at Ostrołęka on the Narew; the Poles lost about 8,000 men and fell back on Warsaw.: På våren segrade den nye polske befälhavaren, general Jan Skrzynecki, vid Wawer och Dębe Wielkie den 31 mars och vid Iganie den 10 april, men utnyttjade inte sina framgångar. Uppror bröt ut i Litauen, där grevinnan Emilia Plater ledde ett partisanförband, och i Volynien och Podolien, men de slogs ned. Den 26 maj hann Diebitsch upp Skrzyneckis armé vid Ostrołęka vid Narew; polackerna förlorade omkring 8 000 man och drog sig tillbaka mot Warszawa.
Diebitsch died of cholera in June. His successor, Ivan Paskevich, marched west and crossed the Vistula close to the Prussian border to attack Warsaw from the west, while Prussia and Austria stayed benevolently neutral towards Russia. On 6 September the suburb of Wola fell after General Józef Sowiński was killed defending it, and that night Count Jan Krukowiecki capitulated. The army withdrew to Modlin and Płock, and on 5 October more than 20,000 men crossed into Prussia and laid down their arms.: Diebitsch dog i kolera i juni. Hans efterträdare, Ivan Paskevitj, marscherade västerut och gick över Wisła nära den preussiska gränsen för att anfalla Warszawa från väster, medan Preussen och Österrike förhöll sig välvilligt neutrala mot Ryssland. Den 6 september föll förstaden Wola sedan general Józef Sowiński stupat under försvaret av den, och samma natt kapitulerade greve Jan Krukowiecki. Armén drog sig tillbaka till Modlin och Płock, och den 5 oktober gick mer än 20 000 man över till Preussen och sträckte vapen.
