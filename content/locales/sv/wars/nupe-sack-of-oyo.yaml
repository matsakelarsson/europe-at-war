# Svenska översättningar av katalogtexten (våg 13); stegtexterna kommer senare.
Nupe wars with Oyo: Nupes krig mot Oyo
? Wars between the Nupe kingdom, on the middle Niger, and the Yoruba kingdom of Oyo, which drove the alaafins (kings) of Oyo from their capital for about three quarters of a century. Oyo tradition, recorded by the Yoruba historian Samuel Johnson in the nineteenth century, tells that in the reign of Alaafin Onigbogi the Nupe, whom the Yoruba call Tapa, defeated Oyo’s armies, besieged the capital, Oyo-Ile, and entered it almost unopposed; the historian Robert Smith dates this to about 1535. Onigbogi fled to Borgu, where he died, and his son Ofinran led the court from place to place on the borders of Borgu and Yorubaland. Eguguojo founded a new capital at Igboho, protected by hills and three walls, where four alaafins were buried. Orompoto, whom some traditions remember as a woman, and Ajiboyede won victories over Borgu and the Nupe, and Oyo rearmed with horses and armour on the Nupe model; the cavalry it built up later made it the strongest power of the savanna west of the Niger. About 1610, in Smith’s chronology, Alaafin Abipa brought the court back to rebuild Oyo-Ile. All dates come from king lists and oral tradition and are approximate; other chronologies put the start of Onigbogi’s reign as early as about 1500.
: Krig mellan kungariket Nupe vid mellersta Niger och yorubariket Oyo, som drev Oyos kungar, alaafinerna, från sin huvudstad i ungefär tre kvarts sekel. Enligt Oyos tradition, som nedtecknades av yorubahistorikern Samuel Johnson på 1800-talet, besegrade nupe, som yoruba kallar tapa, Oyos arméer under alaafin Onigbogis regering, belägrade huvudstaden Oyo-Ile och tågade in i den nästan utan motstånd; historikern Robert Smith daterar detta till omkring 1535. Onigbogi flydde till Borgu, där han dog, och hans son Ofinran ledde hovet från plats till plats i gränstrakterna mellan Borgu och yorubalandet. Eguguojo grundade en ny huvudstad i Igboho, skyddad av berg och tre murar, där fyra alaafiner begravdes. Orompoto, som vissa traditioner minns som en kvinna, och Ajiboyede vann segrar över Borgu och nupe, och Oyo rustade upp med hästar och rustningar efter nupisk förebild; det kavalleri som byggdes upp gjorde senare Oyo till den starkaste makten på savannen väster om Niger. Omkring 1610, enligt Smiths kronologi, förde alaafin Abipa hovet tillbaka för att återuppbygga Oyo-Ile. Alla årtal bygger på kungalängder och muntlig tradition och är ungefärliga; andra kronologier förlägger början av Onigbogis regering så tidigt som till omkring 1500.
