# Svenska översättningar av katalogtexten (våg 10); stegtexterna kommer senare.
Oda Nobunaga’s campaigns: Oda Nobunagas fälttåg
? The wars by which Oda Nobunaga, lord of Owari and Mino, made himself master of central Japan between 1568 and 1582, the first stage of the unification of the country after a century of civil war. In 1568 he marched on Kyoto and installed Ashikaga Yoshiaki as shogun, but within two years he faced a coalition of the Azai and Asakura, the Miyoshi, the Ikkō-ikki of the Hongan-ji, the monks of Mount Hiei, Takeda Shingen and finally the shogun himself. He burned the monastery of Enryaku-ji in 1571, survived the advance of Shingen, who beat his ally Tokugawa Ieyasu at Mikatagahara in 1573, drove Yoshiaki out of Kyoto in the same year and destroyed the Asakura and Azai. In 1575 Oda and Tokugawa musketeers behind palisades broke the Takeda army at Nagashino. From his new castle at Azuchi, Nobunaga’s generals then fought the Uesugi in the north, the Mōri in the west and the Hongan-ji at Osaka, which surrendered in 1580. In the spring of 1582 his armies destroyed the Takeda; weeks later Nobunaga was killed at Honnō-ji by his general Akechi Mitsuhide.
: De krig genom vilka Oda Nobunaga, herre över Owari och Mino, mellan 1568 och 1582 gjorde sig till härskare över centrala Japan, det första steget i landets enande efter ett sekel av inbördeskrig. År 1568 tågade han mot Kyoto och insatte Ashikaga Yoshiaki som shogun, men inom två år stod han inför en koalition av Azai- och Asakuraklanerna, Miyoshiklanen, Hongan-jis Ikkō-ikki, munkarna på berget Hiei, Takeda Shingen och slutligen shogunen själv. Han brände klostret Enryaku-ji 1571, överlevde frammarschen av Shingen, som besegrade hans allierade Tokugawa Ieyasu vid Mikatagahara 1573, drev ut Yoshiaki ur Kyoto samma år och förintade Asakura- och Azaiklanerna. År 1575 krossade Odas och Tokugawas musketörer bakom palissader Takedaarmén vid Nagashino. Från sin nya borg i Azuchi bekämpade Nobunagas generaler sedan Uesugiklanen i norr, Mōriklanen i väster och Hongan-ji i Osaka, som kapitulerade 1580. Våren 1582 förintade hans arméer Takedaklanen; några veckor senare dödades Nobunaga i Honnō-ji av sin general Akechi Mitsuhide.
