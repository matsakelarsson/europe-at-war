# Svenska översättningar av katalogtexten (våg 10); stegtexterna kommer senare.
Ōei invasion (Gihae eastern expedition): Ōeiinvasionen (gihaeårets östliga expedition)
? A Joseon expedition against the island of Tsushima, the main base of the wokou who raided Korea. In May 1419 a wokou fleet attacked Biin on the west coast of Korea and then Haeju. The retired king Taejong, who still controlled the army under his son Sejong, decided to strike the island while many of its fighting men were away raiding. On 11 July 1419 Yi Jong-mu sailed from Geoje with 227 ships and 17,285 men, and the next day the fleet landed in Asō Bay. The Koreans burned houses and ships, freed Chinese captives and fenced off the island’s narrow neck at Funakoshi. On 21 July a Korean column was ambushed at Nukadake and lost heavily, and with the typhoon season coming and the lord of the island, Sō Sadamori, asking for peace, the fleet sailed home on 25 July. Joseon dropped its demand that Tsushima submit, and the island’s trade with Korea was regulated through the Sō, by the Treaty of Gyehae in 1443. The invasion is known in Japan by its era name, Ōei, and in Korea as the eastern expedition of the gihae year.
: En expedition från Joseon mot ön Tsushima, den viktigaste basen för de wokou som plundrade Korea. I maj 1419 anföll en wokouflotta Biin på Koreas västkust och därefter Haeju. Den abdikerade kungen Taejong, som fortfarande kontrollerade armén under sin son Sejong, beslöt att slå till mot ön medan många av dess stridsdugliga män var borta på plundringståg. Den 11 juli 1419 avseglade Yi Jong-mu från Geoje med 227 fartyg och 17 285 man, och dagen därpå landsteg flottan i Asōbukten. Koreanerna brände hus och fartyg, befriade kinesiska fångar och spärrade av öns smala näs vid Funakoshi. Den 21 juli hamnade en koreansk kolonn i ett bakhåll vid Nukadake och led svåra förluster, och med tyfonsäsongen i antågande och öns herre, Sō Sadamori, som bad om fred, seglade flottan hem den 25 juli. Joseon släppte sitt krav på att Tsushima skulle underkasta sig, och öns handel med Korea reglerades via Sōklanen genom Gyehaefördraget 1443. Invasionen är känd i Japan under sitt eranamn, Ōei, och i Korea som gihaeårets östliga expedition.
