# Svenska översättningar av katalogtexten (våg 10); stegtexterna kommer senare.
Ōei Rebellion: Ōeiupproret
? "The rising of Ōuchi Yoshihiro against the retired shogun Ashikaga Yoshimitsu, ended by the siege and burning of the port of Sakai. Yoshihiro was governor (shugo) of six provinces, Suō, Nagato, Iwami, Buzen, Izumi and Kii, grew rich on trade with Korea, and had served the shogunate well: in Kyushu, against the Yamana in 1391 and as a go-between in the reunion of the Northern and Southern Courts in 1392. He fell out with Yoshimitsu, who was reducing the great governors one by one. He refused to send men to build Yoshimitsu’s Kitayama villa, resented that his brother Mitsuhiro had died fighting in Kyushu without reward, and heard rumours that he would lose Izumi and Kii or be killed if he went to Kyoto. Through Imagawa Ryōshun he made a secret pact with the Kamakura kubō Ashikaga Mitsukane, and he sounded out other discontented lords and the old supporters of the Southern Court. In the tenth month of Ōei 6 (November 1399) he landed his army at Sakai but would not go on to the capital, and on 18 November Yoshimitsu ordered his punishment. Yoshihiro fortified Sakai with a wooden wall and 48 towers. The chronicle Ōeiki gives the shogun’s army about 30,000 horsemen against about 5,000, while ships from Shikoku and Awaji closed the port from the sea. Risings in his support in Ōmi and Mino failed, and Mitsukane, who marched with over 10,000 men into Musashi, stopped there. On the 21st day of the twelfth month (January 1400) the besiegers set fire to the defences with the wind behind them, and Yoshihiro was killed in the last fight. Yoshimitsu took away Izumi, Kii, Iwami and Buzen; Suō and Nagato went to Yoshihiro’s brother Hiromo, who had surrendered, but another brother, Ōuchi Morimi, fought on, defeated Hiromo in 1402 and was soon recognised by the shogunate as head of the house."
: "Ōuchi Yoshihiros resning mot den abdikerade shogunen Ashikaga Yoshimitsu, som slutade med belägringen och nedbränningen av hamnstaden Sakai. Yoshihiro var guvernör (shugo) över sex provinser, Suō, Nagato, Iwami, Buzen, Izumi och Kii, blev rik på handeln med Korea och hade tjänat shogunatet väl: på Kyushu, mot Yamanaklanen 1391 och som medlare vid återföreningen av Norra och Södra hovet 1392. Han blev osams med Yoshimitsu, som en efter en beskar de stora guvernörernas makt. Han vägrade att sända män för att bygga Yoshimitsus villa i Kitayama, var förbittrad över att hans bror Mitsuhiro hade stupat i strid på Kyushu utan belöning och hörde rykten om att han skulle förlora Izumi och Kii eller dödas om han begav sig till Kyoto. Genom Imagawa Ryōshun slöt han en hemlig pakt med Kamakura kubō Ashikaga Mitsukane, och han kände sig för hos andra missnöjda herrar och hos Södra hovets gamla anhängare. I tionde månaden Ōei 6 (november 1399) landsatte han sin armé i Sakai men ville inte fortsätta till huvudstaden, och den 18 november beordrade Yoshimitsu att han skulle straffas. Yoshihiro befäste Sakai med en träpalissad och 48 torn. Krönikan Ōeiki anger shogunens armé till omkring 30 000 ryttare mot omkring 5 000, medan fartyg från Shikoku och Awaji stängde hamnen från sjösidan. Resningar till hans stöd i Ōmi och Mino misslyckades, och Mitsukane, som tågade in i Musashi med över 10 000 man, stannade där. Den 21:a dagen i tolfte månaden (januari 1400) satte belägrarna eld på försvarsverken med vinden i ryggen, och Yoshihiro stupade i den sista striden. Yoshimitsu drog in Izumi, Kii, Iwami och Buzen; Suō och Nagato gick till Yoshihiros bror Hiromo, som hade kapitulerat, men en annan bror, Ōuchi Morimi, fortsatte striden, besegrade Hiromo 1402 och erkändes snart av shogunatet som ättens överhuvud."
