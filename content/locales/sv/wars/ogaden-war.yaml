# Svenska översättningar av katalogtexten (våg 12); stegtexterna kommer senare.
Ogaden War: Ogadenkriget
? War between Somalia and Ethiopia over the Ogaden, the Somali-inhabited east of Ethiopia, which Somalia claimed as Western Somalia. In 1976–1977 the Western Somali Liberation Front (WSLF), armed and trained by Somalia, drove Ethiopian forces into their garrisons while the Derg, Ethiopia’s new military government, was fighting rebellions across the country. In July 1977 the Somali National Army invaded. Within two months Somali and WSLF forces held most of the Ogaden, took Jijiga and the Marda Pass, and laid siege to Harar and Dire Dawa. The Soviet Union, which had armed Somalia, then switched to Ethiopia; Somalia expelled its Soviet advisers in November 1977, and a Soviet airlift brought arms, about 1,500 Soviet advisers and some 12,000–18,000 Cuban troops to Ethiopia, with a South Yemeni contingent. The Ethiopian and Cuban counteroffensive of February–March 1978 retook Jijiga, and on 9 March Siad Barre ordered his army home. Some 5,000–6,500 soldiers were killed on each side and hundreds of thousands of Ogadeni Somalis fled to Somalia. The defeat discredited Siad Barre’s government and opened the way to the rebellions that destroyed the Somali state in 1991.
: Krig mellan Somalia och Etiopien om Ogaden, det somaliskbefolkade östra Etiopien, som Somalia gjorde anspråk på som Västsomalia. Åren 1976–1977 tvingade Västsomaliska befrielsefronten (WSLF), beväpnad och utbildad av Somalia, de etiopiska styrkorna tillbaka in i sina garnisoner medan Derg, Etiopiens nya militärregering, bekämpade uppror över hela landet. I juli 1977 invaderade Somaliska nationalarmén. Inom två månader behärskade somaliska styrkor och WSLF större delen av Ogaden, intog Jijiga och Mardapasset och belägrade Harar och Dire Dawa. Sovjetunionen, som hade beväpnat Somalia, bytte då sida till Etiopien; Somalia utvisade sina sovjetiska rådgivare i november 1977, och en sovjetisk luftbro förde vapen, omkring 1 500 sovjetiska rådgivare och omkring 12 000–18 000 kubanska soldater till Etiopien, tillsammans med en sydjemenitisk kontingent. Den etiopiska och kubanska motoffensiven i februari–mars 1978 återtog Jijiga, och den 9 mars beordrade Siad Barre hem sin armé. Omkring 5 000–6 500 soldater dödades på vardera sidan, och hundratusentals ogadensomalier flydde till Somalia. Nederlaget misskrediterade Siad Barres regering och banade väg för de uppror som förstörde den somaliska staten 1991.
