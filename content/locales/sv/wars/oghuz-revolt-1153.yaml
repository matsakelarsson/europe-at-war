# Svenska översättningar av katalogtexten (våg 7); stegtexterna kommer senare.
Oghuz revolt and the captivity of Sanjar: Oguzernas uppror och Sanjars fångenskap
? In 1153 Oghuz (Ghuzz) Turkmen tribes who grazed their flocks in the uplands around Balkh rose against the Seljuk sultan Ahmad Sanjar, the last ruler of the Great Seljuk Empire, after a quarrel over the tribute of sheep they owed his court and the killing of one of his officials. Sanjar’s governor of Balkh, Qumach, attacked them and was beaten, and when Sanjar marched out with his army in the spring of 1153 he too was defeated near Balkh and taken prisoner. The Oghuz then plundered Khorasan for several years. Merv and Nishapur were largely destroyed and, according to the chroniclers, tens of thousands of people were killed. Sanjar was carried around with the tribes as a captive sultan for two to three years, the sources differ, until he escaped in 1156; he died at Merv in May 1157. His death ended Seljuk rule in the east. Khorasan was divided among his former slave commanders, such as Mu’ayyad Ay-Aba at Nishapur, Oghuz bands held towns such as Ghazni and moved into Kerman, and the Khwarazmshahs and the Ghurids competed for what was left.
: År 1153 reste sig turkmenstammar av oguzer (ghuzz), som betade sina hjordar i höglandet kring Balkh, mot den seldjukiske sultanen Ahmad Sanjar, den siste härskaren över det storseldjukiska riket, efter en tvist om den tribut i får som de var skyldiga hans hov och sedan en av hans ämbetsmän hade dödats. Sanjars guvernör i Balkh, Qumach, anföll dem och blev slagen, och när Sanjar själv drog ut med sin armé våren 1153 besegrades även han nära Balkh och togs till fånga. Oguzerna plundrade sedan Khorasan i flera år. Merv och Nishapur förstördes till stor del, och enligt krönikörerna dödades tiotusentals människor. Sanjar fördes runt med stammarna som en fången sultan i två till tre år (källorna går isär), tills han rymde 1156; han dog i Merv i maj 1157. Hans död gjorde slut på det seldjukiska styret i öster. Khorasan delades mellan hans forna befälhavare av slavbörd, till exempel Mu’ayyad Ay-Aba i Nishapur, skaror av oguzer höll städer som Ghazni och trängde in i Kerman, och khwarazmshaherna och ghuriderna tävlade om det som återstod.
