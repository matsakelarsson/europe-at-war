# Svenska översättningar av katalogtexten (våg 12); stegtexterna kommer senare.
Oromo Liberation Army insurgency: Oromos befrielsearmés uppror
? "Last updated 27 November 2026. The armed struggle of the Oromo Liberation Army (OLA) against the Ethiopian government in Oromia, Ethiopia’s largest region. The OLA began as the armed wing of the Oromo Liberation Front (OLF), founded in 1973, which had fought the Derg and left the transitional government in 1992. When Abiy Ahmed became prime minister in 2018 the OLF returned from exile under a peace deal, but many of its fighters, led by Kumsa Diriba (Jaal Marroo), refused to disarm and broke with the party in 2019. The insurgency grew in western Oromia (the Wollega zones) and in Guji and Borana in the south, and spread when federal troops went north to the Tigray War in 2020. Ethiopia’s parliament designated the OLA a terrorist organisation in May 2021; the government calls it “Shene”. In 2021 the OLA allied with the TPLF, and at the end of October 2021 its fighters briefly entered Kemise, on the main road to Addis Ababa, as Tigrayan forces advanced south. All sides have been accused of grave abuses: armed men killed scores of Amhara civilians at Gida Kiremu in 2021 and hundreds at Gimbi in June 2022, attacks the OLA denied and blamed on government-backed militias; government forces and Amhara militias killed Oromo civilians, and drone strikes and mass arrests hit Oromo villages; Amnesty International reported in March 2026 on sexual violence, summary killings and torture by OLA fighters. Talks in Tanzania in April and November 2023 failed, but in December 2024 a breakaway faction under Sanyi Nagassa made peace with the Oromia regional government and clashes declined in 2025. Since September 2026 the OLA has been part of a coalition of seven armed groups with the TPLF and the Amhara Fano National Movement, the Ethiopian Peoples’ Forces Coalition for Survival (EPFAS), which aims to remove Abiy Ahmed’s government, though the OLA calls its role a “procedural consensus”. Fighting continues in western and southern Oromia, where the OLA is strongest in the countryside of the Wollega zones and the south. Reports from Oromia are hard to verify: the region is largely closed to journalists and communications are often cut."
: "Senast uppdaterad 27 november 2026. Den väpnade kamp som Oromos befrielsearmé (OLA) för mot Etiopiens regering i Oromia, Etiopiens största region. OLA började som den väpnade grenen av Oromos befrielsefront (OLF), grundad 1973, som hade bekämpat Derg och lämnat övergångsregeringen 1992. När Abiy Ahmed blev premiärminister 2018 återvände OLF från exilen enligt ett fredsavtal, men många av dess kämpar, ledda av Kumsa Diriba (Jaal Marroo), vägrade att lägga ned vapnen och bröt med partiet 2019. Upproret växte i västra Oromia (Wollegazonerna) och i Guji och Borana i söder, och det spred sig när federala trupper drog norrut till Tigraykriget 2020. Etiopiens parlament klassade OLA som terroristorganisation i maj 2021; regeringen kallar den ”Shene”. År 2021 allierade sig OLA med TPLF, och i slutet av oktober 2021 tog sig dess kämpar en kort tid in i Kemise, vid huvudvägen till Addis Abeba, samtidigt som tigrayanska styrkor ryckte fram söderut. Alla sidor har anklagats för grova övergrepp: beväpnade män dödade tiotals civila amharer i Gida Kiremu 2021 och hundratals i Gimbi i juni 2022, angrepp som OLA förnekade och skyllde på regeringsstödda miliser; regeringsstyrkor och amharamiliser dödade civila oromer, och drönarangrepp och massgripanden drabbade oromobyar; Amnesty International rapporterade i mars 2026 om sexuellt våld, summariska avrättningar och tortyr begångna av OLA-kämpar. Samtal i Tanzania i april och november 2023 misslyckades, men i december 2024 slöt en utbrytarfalang under Sanyi Nagassa fred med Oromias regionala regering, och sammandrabbningarna minskade 2025. Sedan september 2026 ingår OLA tillsammans med TPLF och Amhara Fano National Movement i en koalition av sju väpnade grupper, Ethiopian Peoples’ Forces Coalition for Survival (EPFAS), som vill avsätta Abiy Ahmeds regering, även om OLA kallar sin roll en ”procedurmässig konsensus”. Striderna fortsätter i västra och södra Oromia, där OLA är starkast på landsbygden i Wollegazonerna och i söder. Rapporter från Oromia är svåra att verifiera: regionen är i stort sett stängd för journalister, och kommunikationerna bryts ofta."
