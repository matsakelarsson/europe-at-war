Dates are Julian, as usual for the period. The Dauphin, later King Louis XI, was leading an army of unemployed mercenaries, the Armagnacs or écorcheurs, left idle by a truce in the Hundred Years’ War; numbers are uncertain.: Datumen anges enligt den julianska kalendern, som brukligt för perioden. Dauphin, sedermera kung Ludvig XI, ledde en armé av arbetslösa legosoldater, armagnacerna eller écorcheurs, som blivit sysslolösa genom ett stillestånd i hundraårskriget; antalet är osäkert.
Zurich’s burgomaster Rudolf Stüssi was killed at St. Jakob an der Sihl on 22 July 1443. At Greifensee, which surrendered at the end of May 1444 after a four-week siege, some sixty of the defenders were beheaded, which shocked contemporaries.: Zürichs borgmästare Rudolf Stüssi stupade vid St. Jakob an der Sihl den 22 juli 1443. Vid Greifensee, som kapitulerade i slutet av maj 1444 efter fyra veckors belägring, halshöggs omkring sextio av försvararna, vilket chockerade samtiden.
The war showed that the Confederacy had become a league whose members could not go their own way against the rest. France and the Confederates made peace at Ensisheim in October 1444.: Kriget visade att edsförbundet hade blivit ett förbund vars medlemmar inte kunde gå sin egen väg mot de övriga. Frankrike och edsförbundet slöt fred i Ensisheim i oktober 1444.
