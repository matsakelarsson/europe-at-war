Old Zurich War: Gamla Zürichkriget
A war within the Swiss Confederacy over the lands of the last Count of Toggenburg, who died in 1436 without heir or will. Zurich claimed them against Schwyz and Glarus, was beaten by the other cantons in 1440 and in 1442 allied with the Habsburg king Frederick III. The Confederates routed Zurich at St. Jakob an der Sihl in 1443, besieged the city and in 1444 beheaded the surrendered garrison of Greifensee. Frederick called in France, whose Armagnac mercenaries under the Dauphin Louis wiped out some 1,500 Swiss at St. Jakob an der Birs near Basel on 26 August 1444, but lost so many men that the Dauphin made peace. A truce in 1446 ended the fighting, and in 1450 Zurich rejoined the Confederacy and gave up its alliance with the Habsburgs.: Ett krig inom Schweiziska edsförbundet om länderna efter den siste greven av Toggenburg, som dog 1436 utan arvinge eller testamente. Zürich gjorde anspråk på dem mot Schwyz och Glarus, besegrades av de övriga kantonerna 1440 och slöt 1442 förbund med den habsburgske kungen Fredrik III. De edsförbundna slog Zürich på flykt vid St. Jakob an der Sihl 1443, belägrade staden och halshögg 1444 den garnison i Greifensee som kapitulerat. Fredrik kallade in Frankrike, vars armagnacska legosoldater under dauphin Ludvig förintade omkring 1 500 schweizare vid St. Jakob an der Birs nära Basel den 26 augusti 1444, men förlorade så många man att dauphin slöt fred. Ett stillestånd 1446 gjorde slut på striderna, och 1450 återinträdde Zürich i edsförbundet och upplöste sin allians med habsburgarna.
