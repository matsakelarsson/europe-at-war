# Svenska översättningar av katalogtexten (våg 7); stegtexterna kommer senare.
Omani–Portuguese wars: Omansk-portugisiska krigen
The wars in which the Ya‘rubi imams of Oman drove the Portuguese from the Omani coast and then fought them across the western Indian Ocean. Imam Nasir bin Murshid, elected in 1624, united the tribes of the interior and took Julfar in 1633, Sohar in 1643 and the other ports until only Muscat was left. His successor Sultan bin Saif captured Muscat in January 1650, ending Portuguese rule in Oman. With captured ships the Omanis built a navy that raided Portuguese ports in India and East Africa, and in 1698, after a siege of almost three years, took Fort Jesus at Mombasa, which made Oman the leading power on the Swahili coast.: De krig under vilka Omans imamer av ya‘rubidynastin drev portugiserna från den omanska kusten och sedan bekämpade dem över hela västra Indiska oceanen. Imamen Nasir bin Murshid, som valdes 1624, enade stammarna i inlandet och intog Julfar 1633, Sohar 1643 och de övriga hamnarna, tills bara Muskat återstod. Hans efterträdare Sultan bin Saif erövrade Muskat i januari 1650, vilket gjorde slut på det portugisiska styret i Oman. Med erövrade fartyg byggde omanierna upp en flotta som plundrade portugisiska hamnar i Indien och Östafrika, och 1698 intog de efter en nästan treårig belägring Fort Jesus i Mombasa, vilket gjorde Oman till den ledande makten vid swahilikusten.
