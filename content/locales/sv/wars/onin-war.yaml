# Svenska översättningar av katalogtexten (våg 10); stegtexterna kommer senare.
Ōnin War: Ōninkriget
"The civil war of 1467–1477 between the great lords of the Ashikaga shogunate, fought mainly in the streets of Kyoto, which left the capital in ruins and opened the Sengoku period, the age of warring states. Quarrels over the succession in the Hatakeyama and Shiba families and in the shogun’s own house drew the two most powerful men at court into opposing camps: the Eastern army of Hosokawa Katsumoto, which held the shogun Ashikaga Yoshimasa and the emperor, and the Western army of Yamana Sōzen, joined in 1467 by Ōuchi Masahiro from the far west. After the first battles of 1467 the armies faced each other across trenches inside the city for years, while hired foot soldiers burned and looted and the fighting spread to the provinces. Both commanders died in 1473, but the war dragged on until the last Western lords simply went home in December 1477. The shogunate never recovered its authority, and for more than a century real power in Japan lay with provincial warlords.": "Inbördeskriget 1467–1477 mellan Ashikagashogunatets stora herrar, som främst utkämpades på Kyotos gator och som lämnade huvudstaden i ruiner och inledde Sengokuperioden, de krigande staternas tid. Tvister om arvsföljden i släkterna Hatakeyama och Shiba och i shogunens egen ätt drog in de två mäktigaste männen vid hovet i motsatta läger: Östra armén under Hosokawa Katsumoto, som hade shogunen Ashikaga Yoshimasa och kejsaren i sitt läger, och Västra armén under Yamana Sōzen, till vilken Ōuchi Masahiro från landets yttersta väster anslöt sig 1467. Efter de första striderna 1467 stod arméerna i åratal mot varandra över skyttegravar inne i staden, medan inhyrda fotsoldater brände och plundrade och striderna spred sig till provinserna. Båda befälhavarna dog 1473, men kriget drog ut tills de sista herrarna i Västra armén helt enkelt gick hem i december 1477. Shogunatet återvann aldrig sin auktoritet, och i mer än ett sekel låg den verkliga makten i Japan hos provinsernas krigsherrar."
Eastern army (Hosokawa Katsumoto, Hatakeyama Masanaga, Shiba Yoshitoshi, Akamatsu Masanori; the shogun Ashikaga Yoshimasa): Östra armén (Hosokawa Katsumoto, Hatakeyama Masanaga, Shiba Yoshitoshi, Akamatsu Masanori; shogunen Ashikaga Yoshimasa)
Western army (Yamana Sōzen, Hatakeyama Yoshinari, Shiba Yoshikado, Ōuchi Masahiro; from 1468 Ashikaga Yoshimi): Västra armén (Yamana Sōzen, Hatakeyama Yoshinari, Shiba Yoshikado, Ōuchi Masahiro; från 1468 Ashikaga Yoshimi)
