# Svenska översättningar av katalogtexten (våg 13); stegtexterna kommer senare.
South African intervention in Lesotho (Operation Boleas): Sydafrikas intervention i Lesotho (Operation Boleas)
? The military intervention by South Africa, later joined by Botswana, in Lesotho in September 1998, carried out in the name of the Southern African Development Community (SADC). In the elections of May 1998 the ruling Lesotho Congress for Democracy (LCD) of Prime Minister Pakalitha Mosisili won 79 of the 80 seats. The opposition parties called the vote rigged and their supporters besieged the royal palace in Maseru for weeks; a SADC commission under the South African judge Pius Langa found no evidence that the result had been falsified. In September junior officers of the Lesotho Defence Force mutinied, detained or forced out their commanders and sided with the protesters, and Mosisili’s government, fearing a coup, asked SADC for help. On 22 September 1998, with President Nelson Mandela abroad and Mangosuthu Buthelezi acting as president, about 600 South African troops crossed the border; more followed, and Botswana sent soldiers too. They met heavier resistance than expected at the Makoanyane barracks in Maseru and at the Katse dam of the Lesotho Highlands Water Project, which supplies water to South Africa’s industrial heartland, where 17 Lesotho soldiers were killed. In Maseru opposition supporters and others looted and burned much of the city centre, and towns such as Mafeteng and Mohale’s Hoek were also damaged. Eight to eleven South African soldiers were killed; estimates of the Basotho dead, soldiers and civilians, range from several dozen to well over a hundred. An agreement in October and November 1998 kept the LCD in government and set up an interim political authority of all the parties to prepare new elections, held in 2002 under a mixed electoral system. The last South African troops left in May 1999. South Africa and SADC called the operation a peace mission to prevent a coup; critics in Lesotho and South Africa called it an invasion to protect a friendly government and the water project.
: Den militära intervention som Sydafrika, senare tillsammans med Botswana, genomförde i Lesotho i september 1998 i namn av Södra Afrikas utvecklingsgemenskap (SADC). I valet i maj 1998 vann premiärminister Pakalitha Mosisilis styrande parti Lesotho Congress for Democracy (LCD) 79 av de 80 mandaten. Oppositionspartierna kallade valet riggat och deras anhängare belägrade kungapalatset i Maseru i flera veckor; en SADC-kommission under den sydafrikanske domaren Pius Langa fann inga belägg för att resultatet hade förfalskats. I september gjorde yngre officerare i Lesotho Defence Force myteri, grep eller drev bort sina befälhavare och ställde sig på demonstranternas sida, och Mosisilis regering, som fruktade en kupp, bad SADC om hjälp. Den 22 september 1998, när president Nelson Mandela var utomlands och Mangosuthu Buthelezi var tillförordnad president, gick omkring 600 sydafrikanska soldater över gränsen; fler följde, och även Botswana sände soldater. De mötte hårdare motstånd än väntat vid Makoanyanekasernen i Maseru och vid Katsedammen, där 17 soldater från Lesotho dödades; dammen ingår i Lesotho Highlands Water Project, som förser Sydafrikas industriella kärnområde med vatten. I Maseru plundrade och brände oppositionsanhängare och andra stora delar av stadens centrum, och även städer som Mafeteng och Mohale’s Hoek skadades. Åtta till elva sydafrikanska soldater dödades; uppskattningarna av antalet döda basotho, soldater och civila, varierar från flera dussin till långt över hundra. En överenskommelse i oktober och november 1998 behöll LCD i regeringsställning och inrättade en interimistisk politisk myndighet med alla partier för att förbereda nya val, som hölls 2002 med ett blandat valsystem. De sista sydafrikanska trupperna lämnade landet i maj 1999. Sydafrika och SADC kallade operationen en fredsmission för att förhindra en kupp; kritiker i Lesotho och Sydafrika kallade den en invasion för att skydda en vänligt sinnad regering och vattenprojektet.
