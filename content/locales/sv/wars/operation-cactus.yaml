# Svenska översättningar av katalogtexten (våg 8); stegtexterna kommer senare.
1988 Maldives coup attempt (Operation Cactus): Kuppförsöket på Maldiverna 1988 (Operation Cactus)
? "An attempt to overthrow President Maumoon Abdul Gayoom of the Maldives, defeated by an Indian intervention that India called Operation Cactus. Before dawn on 3 November 1988 between 80 and 200 armed members of the People’s Liberation Organisation of Tamil Eelam (PLOTE), a Sri Lankan Tamil militant group hired by the Maldivian businessman Abdullah Luthufi, who lived in Sri Lanka, landed in Malé from a ship. They seized parts of the capital, but failed to take the headquarters of the National Security Service, whose men held out, or to capture Gayoom, who went into hiding and appealed for help abroad. India answered within hours: about nine hours after the appeal, paratroopers of its 50th Independent Parachute Brigade, flown non-stop from Agra, landed at Hulhulé airport, crossed to Malé by boat and restored the government’s control that night. Some of the mercenaries fled with hostages on the hijacked freighter Progress Light; Indian frigates and aircraft caught it off Sri Lanka, fired on it after the mercenaries killed hostages, and on 6 November Indian navy commandos took the ship and its crew. Nineteen people died, most of them mercenaries, among them eight members of the Maldivian security service; India lost no one. The captured mercenaries were tried in the Maldives in 1989 and sentenced to death, later commuted to life imprisonment."
: "Ett försök att störta Maldivernas president Maumoon Abdul Gayoom, som slogs tillbaka av en indisk intervention som Indien kallade Operation Cactus. Före gryningen den 3 november 1988 gick mellan 80 och 200 beväpnade män i land i Malé från ett fartyg. De tillhörde People’s Liberation Organisation of Tamil Eelam (PLOTE), en militant lankesisk tamilgrupp som hade lejts av den maldiviske affärsmannen Abdullah Luthufi, bosatt i Sri Lanka. De besatte delar av huvudstaden men lyckades varken inta högkvarteret för den nationella säkerhetstjänsten, vars män höll stånd, eller fånga Gayoom, som gömde sig och vädjade om hjälp utifrån. Indien svarade inom några timmar: omkring nio timmar efter vädjan landade fallskärmsjägare ur landets 50:e självständiga fallskärmsbrigad, som flugits utan mellanlandning från Agra, på flygplatsen Hulhulé, tog sig över till Malé med båt och återställde regeringens kontroll samma natt. En del av legosoldaterna flydde med gisslan på det kapade lastfartyget Progress Light; indiska fregatter och flygplan hann upp det utanför Sri Lanka och besköt det sedan legosoldaterna dödat gisslan, och den 6 november bordade indiska marinkommandosoldater fartyget och tog besättningen till fånga. Nitton människor dog, de flesta av dem legosoldater, och bland de döda fanns åtta medlemmar av den maldiviska säkerhetstjänsten; Indien förlorade ingen. De tillfångatagna legosoldaterna ställdes inför rätta på Maldiverna 1989 och dömdes till döden, vilket senare omvandlades till livstids fängelse."
