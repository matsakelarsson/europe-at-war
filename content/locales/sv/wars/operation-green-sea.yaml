# Svenska översättningar av katalogtexten (våg 13); stegtexterna kommer senare.
Operation Green Sea: Operation Green Sea
? "The Portuguese raid on Conakry, the capital of the Republic of Guinea, on the night of 21–22 November 1970, during the Guinea-Bissau War of Independence. Planned in Portuguese Guinea under the governor, General António de Spínola, and led by the naval officer Alpoim Calvão, a force of about 220 Portuguese soldiers, most of them African commandos and marines from Portuguese Guinea, and about 200 Guinean exiles of the National Liberation Front of Guinea (FLNG), sailed in unmarked ships and landed at several points in the city. Its aims were to free Portuguese prisoners held by the PAIGC, destroy the PAIGC’s boats and Guinea’s MiG fighters, capture or kill Amílcar Cabral and bring down President Ahmed Sékou Touré’s government. The raiders freed 26 Portuguese prisoners from Camp Boiro and burned PAIGC supply boats and Touré’s summer residence, but Cabral was abroad, the raiders did not destroy Guinea’s MiGs, the exiles attacked a radio station that was no longer in use, and no uprising followed; the force withdrew the next day, having lost a handful of men. Guinean deaths are estimated at between about 50 and 500. The UN Security Council condemned Portugal in Resolution 290 of 8 December 1970, and the Organisation of African Unity did the same; Portugal denied involvement. In Guinea, Sékou Touré used the attack to purge real and supposed opponents: a revolutionary tribunal sentenced dozens to death in January 1971, and many more were imprisoned in Camp Boiro, where many died."
: "Den portugisiska räden mot Conakry, huvudstaden i Republiken Guinea, natten mellan den 21 och 22 november 1970, under Guinea-Bissaus självständighetskrig. Räden planerades i Portugisiska Guinea under guvernören, general António de Spínola, och leddes av sjöofficeren Alpoim Calvão; en styrka på omkring 220 portugisiska soldater, de flesta av dem afrikanska kommandosoldater och marinsoldater från Portugisiska Guinea, och omkring 200 guineanska landsflyktingar ur Guineas nationella befrielsefront (FLNG) seglade i omärkta fartyg och landsteg på flera platser i staden. Målen var att befria portugisiska fångar som hölls av PAIGC, förstöra PAIGC:s båtar och Guineas MiG-plan, tillfångata eller döda Amílcar Cabral och störta president Ahmed Sékou Tourés regering. Angriparna befriade 26 portugisiska fångar från Camp Boiro och brände PAIGC:s förrådsbåtar och Tourés sommarresidens, men Cabral befann sig utomlands, angriparna förstörde inte Guineas MiG-plan, de landsflyktiga anföll en radiostation som inte längre användes, och inget uppror följde; styrkan drog sig tillbaka dagen därpå efter att ha förlorat en handfull man. Antalet guineanska döda uppskattas till mellan omkring 50 och 500. FN:s säkerhetsråd fördömde Portugal i resolution 290 den 8 december 1970, och Organisationen för afrikansk enhet gjorde detsamma; Portugal förnekade all inblandning. I Guinea använde Sékou Touré anfallet för att rensa ut verkliga och förmodade motståndare: en revolutionsdomstol dömde dussintals till döden i januari 1971, och många fler fängslades i Camp Boiro, där många dog."
