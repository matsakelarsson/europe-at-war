# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
1991 Haitian coup and Operation Uphold Democracy: Statskuppen i Haiti 1991 och Operation Uphold Democracy
? The military coup that overthrew Haiti’s first freely elected president, Jean-Bertrand Aristide, and the US-led intervention that restored him three years later. Aristide, a Catholic priest from the slums of Port-au-Prince and leader of the Lavalas movement, won the election of December 1990 with about two-thirds of the vote and took office in February 1991. On 29–30 September 1991 the army under General Raoul Cédras seized power, and Aristide went into exile, first in Venezuela and then in the United States. Under the military government soldiers and the paramilitary Front for the Advancement and Progress of Haiti (FRAPH), led by Emmanuel “Toto” Constant, killed, tortured and raped supporters of Aristide; estimates of the dead range from about 3,000 to 5,000. Tens of thousands of Haitians fled by boat; the US Coast Guard intercepted about 38,000 by the end of 1992 and returned most of them or held them at Guantánamo Bay. The Organization of American States and then the United Nations imposed embargoes, and in the Governors Island Accord of July 1993 Cédras agreed to step down, but when the USS Harlan County arrived with US and Canadian troops to help carry it out in October 1993, armed demonstrators kept it from landing, and the justice minister, Guy Malary, was murdered days later. On 31 July 1994 UN Security Council Resolution 940 authorised a multinational force to remove the military leaders. With invasion forces already in the air, a delegation of the former US president Jimmy Carter, Senator Sam Nunn and General Colin Powell persuaded Cédras on 18 September to step down, and on 19 September 1994 US troops landed unopposed; the force grew to about 20,000–25,000, with contingents from Caribbean and other countries. On 24 September US Marines killed ten Haitian soldiers in a firefight at Cap-Haïtien. Cédras resigned in October and left for Panama, Aristide returned to Port-au-Prince on 15 October 1994, disbanded the army in 1995, and on 31 March 1995 the multinational force handed over to the UN Mission in Haiti (UNMIH).
: Den militärkupp som störtade Haitis förste fritt valde president, Jean-Bertrand Aristide, och den USA-ledda intervention som återinsatte honom tre år senare. Aristide, en katolsk präst från Port-au-Princes slumområden och ledare för Lavalasrörelsen, vann valet i december 1990 med omkring två tredjedelar av rösterna och tillträdde i februari 1991. Den 29–30 september 1991 tog armén under general Raoul Cédras makten, och Aristide gick i exil, först i Venezuela och sedan i USA. Under militärregeringen dödade, torterade och våldtog soldater och den paramilitära Fronten för Haitis utveckling och framsteg (FRAPH), ledd av Emmanuel ”Toto” Constant, anhängare till Aristide; uppskattningarna av antalet döda varierar från omkring 3 000 till 5 000. Tiotusentals haitier flydde med båt; USA:s kustbevakning hade i slutet av 1992 stoppat omkring 38 000 till sjöss och skickat tillbaka de flesta av dem eller hållit dem kvar vid Guantánamobukten. Amerikanska samarbetsorganisationen och därefter Förenta nationerna införde embargon, och i Governors Island-avtalet i juli 1993 gick Cédras med på att avgå, men när USS Harlan County i oktober 1993 anlände med amerikanska och kanadensiska trupper för att bidra till att genomföra avtalet hindrade beväpnade demonstranter fartyget från att lägga till, och justitieministern Guy Malary mördades några dagar senare. Den 31 juli 1994 bemyndigade FN:s säkerhetsråds resolution 940 en multinationell styrka att avlägsna de militära ledarna. Med invasionsstyrkorna redan i luften övertalade en delegation bestående av förre amerikanske presidenten Jimmy Carter, senatorn Sam Nunn och general Colin Powell den 18 september Cédras att avgå, och den 19 september 1994 landsteg amerikanska trupper utan motstånd; styrkan växte till omkring 20 000–25 000 man, med kontingenter från Karibien och andra länder. Den 24 september dödade amerikanska marinkårssoldater tio haitiska soldater i en eldstrid i Cap-Haïtien. Cédras avgick i oktober och reste till Panama, Aristide återvände till Port-au-Prince den 15 oktober 1994 och upplöste armén 1995, och den 31 mars 1995 överlämnade den multinationella styrkan ansvaret till FN:s mission i Haiti (UNMIH).
