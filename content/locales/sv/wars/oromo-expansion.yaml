# Svenska översättningar av katalogtexten (våg 12); stegtexterna kommer senare.
Oromo expansion: Oromoexpansionen
? "The great movement of the Oromo from their homelands in the southern highlands, around the lakes and the Bale and Borana country, into much of what is now central, western and eastern Ethiopia in the 16th and early 17th centuries. The Oromo had no kings; they were organised in the gadaa system, in which age-sets of men took over leadership and warfare every eight years, and each gadaa period was expected to make its own raid (butta). The monk Bahrey, writing in about 1593 and the main written source, names the gadaa periods from Melbah (1522–1530) on, and his dates are the basis of the usual chronology, although some are questioned. Early raids reached Bale and Dawaro and returned home; from the 1550s the Oromo began to settle the lands they took. The Borana groups moved west and north into Shewa, Damot, Gojjam and the Gibe region, the Barentu east and north-east against Adal, Harar, Fatagar, Wollo and Angot. Both the Christian empire and the Muslim sultanate of Adal had been weakened by their war of 1529–1543, and neither could stop them: the emir Nur ibn Mujahid built the wall of Harar against Oromo raids, and the emperors Gelawdewos, Sarsa Dengel and Susenyos fought them for decades, while Sarsa Dengel and Susenyos also enlisted Oromo groups as allies and settled them in Gojjam and Begemder. The Ethiopian kingdom lost Fatagar, Bale, Dawaro and much of Shewa, and the Harari population fell sharply. Over time many Oromo adopted Christianity or Islam and settled as farmers, and Oromo lords became powerful at the Gondar court. Oromo historians such as Asafa Jalata count twelve butta wars between 1522 and 1618 and describe them as a recovery as well as an expansion, into lands lost to earlier Christian and Muslim conquests; the movement continued in places after that, and the Macha reached Ennarea in the early 18th century. Older works call these events the “Galla invasions”, using a name the Oromo reject; historians now speak of the Oromo expansion or migrations."
: "Oromofolkets stora rörelse under 1500-talet och början av 1600-talet från deras ursprungliga områden i det södra höglandet, kring sjöarna och i Bale- och Boranaområdena, in i stora delar av det som i dag är centrala, västra och östra Etiopien. Oromo hade inga kungar; de var organiserade i gadaasystemet, där åldersklasser av män vart åttonde år tog över ledarskapet och krigföringen, och varje gadaaperiod förväntades genomföra sin egen räd (butta). Munken Bahrey, som skrev omkring 1593 och är den främsta skriftliga källan, namnger gadaaperioderna från Melbah (1522–1530) och framåt, och hans dateringar ligger till grund för den vanliga kronologin, även om några av dem ifrågasätts. De tidiga räderna nådde Bale och Dawaro och vände sedan hem; från 1550-talet började oromo slå sig ned i de länder de erövrade. Boranagrupperna drog västerut och norrut in i Shewa, Damot, Gojjam och Gibeområdet, barentugrupperna österut och nordösterut mot Adal, Harar, Fatagar, Wollo och Angot. Både det kristna kejsardömet och det muslimska Adalsultanatet hade försvagats av sitt krig 1529–1543, och ingen av dem kunde hejda dem: emiren Nur ibn Mujahid byggde Harars stadsmur mot oromoräderna, och kejsarna Gelawdewos, Sarsa Dengel och Susenyos bekämpade dem i årtionden, samtidigt som Sarsa Dengel och Susenyos också värvade oromogrupper som allierade och bosatte dem i Gojjam och Begemder. Det etiopiska riket förlorade Fatagar, Bale, Dawaro och stora delar av Shewa, och den harariska befolkningen minskade kraftigt. Med tiden antog många oromo kristendomen eller islam och slog sig ned som jordbrukare, och oromoherrar blev mäktiga vid hovet i Gondar. Oromohistoriker som Asafa Jalata räknar tolv buttakrig mellan 1522 och 1618 och beskriver dem som ett återtagande lika väl som en expansion, in i länder som hade gått förlorade genom tidigare kristna och muslimska erövringar; rörelsen fortsatte på sina håll även därefter, och macha nådde Ennarea i början av 1700-talet. Äldre verk kallar dessa händelser ”gallainvasionerna” och använder då ett namn som oromo själva förkastar; historiker talar nu om oromoexpansionen eller oromovandringarna."
