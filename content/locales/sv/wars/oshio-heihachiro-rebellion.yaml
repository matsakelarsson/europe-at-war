# Svenska översättningar av katalogtexten (våg 10); stegtexterna kommer senare.
Ōshio Heihachirō’s rebellion: Ōshio Heihachirōs uppror
? "A one-day rising in Osaka during the Tenpō famine, led by a former shogunate official. Ōshio Heihachirō had served as a police magistrate (yoriki) in the Osaka city administration and then taught the Neo-Confucian philosophy of Wang Yangming (Yōmeigaku), which held that knowledge must be put into action. After failed harvests from 1833 rice prices soared and people starved in the streets of Osaka, while rice merchants hoarded and the city magistrates shipped rice to Edo. Ōshio sold his books to feed the poor, trained his students and nearby villagers in arms and sent round a long manifesto calling for heaven’s punishment of corrupt officials and rich merchants. Betrayed by one of his followers, he struck early on 25 March 1837 (the 19th day of the second month of Tenpō 8): he set fire to his house in the Tenma quarter and led about 300 students, villagers and townspeople under a banner reading “Save the people” against the great merchant houses of Senba, among them the Mitsui and the Kōnoike, firing cannon and scattering money and rice. The magistrates’ troops dispersed the rebels within half a day, but the fire spread and burned for a day and a night. Japanese accounts say that about a fifth of the city burned, some 70,000 people lost their homes and at least 270 died; English accounts speak of more than 3,000 houses destroyed. Ōshio and his son hid for about forty days until they were found in a merchant’s house on 1 May 1837 and killed themselves, setting the house on fire. In 1838 nineteen of the rebels, among them Ōshio, most of them already dead and preserved in salt, were crucified. That an official of the shogunate had risen in its second city shook the regime, and smaller risings in his name followed, among them Ikuta Yorozu’s attack on the Kashiwazaki office in Echigo that summer."
: "En endagsresning i Osaka under Tenpōhungersnöden, ledd av en före detta ämbetsman i shogunatet. Ōshio Heihachirō hade tjänstgjort som polisämbetsman (yoriki) i Osakas stadsförvaltning och undervisade sedan i Wang Yangmings nykonfucianska filosofi (Yōmeigaku), som lärde att kunskap måste omsättas i handling. Efter missväxten från 1833 rusade rispriserna i höjden och människor svalt på Osakas gator, medan rishandlarna hamstrade och stadsmagistraterna skeppade ris till Edo. Ōshio sålde sina böcker för att föda de fattiga, övade sina elever och bybor i närheten i vapenbruk och skickade runt ett långt manifest som uppmanade till himlens straff över korrumperade ämbetsmän och rika köpmän. Förrådd av en av sina anhängare slog han till tidigt den 25 mars 1837 (den 19:e dagen i andra månaden Tenpō 8): han satte eld på sitt hus i stadsdelen Tenma och ledde omkring 300 elever, bybor och stadsbor under en fana med texten ”Rädda folket” mot de stora köpmanshusen i Senba, bland dem Mitsui och Kōnoike, medan de sköt med kanoner och strödde ut pengar och ris. Magistraternas trupper skingrade rebellerna inom en halv dag, men elden spred sig och brann ett helt dygn. Japanska framställningar uppger att omkring en femtedel av staden brann, att omkring 70 000 människor förlorade sina hem och att minst 270 dog; engelskspråkiga framställningar talar om mer än 3 000 förstörda hus. Ōshio och hans son höll sig gömda i omkring fyrtio dagar tills de upptäcktes i ett köpmanshus den 1 maj 1837 och tog livet av sig och satte eld på huset. År 1838 korsfästes nitton av rebellerna, bland dem Ōshio, de flesta av dem redan döda och konserverade i salt. Att en ämbetsman i shogunatet hade gjort uppror i dess näst största stad skakade regimen, och mindre resningar i hans namn följde, bland dem Ikuta Yorozus angrepp på ämbetskontoret i Kashiwazaki i Echigo samma sommar."
