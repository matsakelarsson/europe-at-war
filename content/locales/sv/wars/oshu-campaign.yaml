# Svenska översättningar av katalogtexten (våg 10); stegtexterna kommer senare.
Ōshū campaign: Ōshūfälttåget
? The campaign in which Minamoto no Yoritomo destroyed the Northern Fujiwara of Hiraizumi, who had ruled Mutsu and Dewa for a century, and brought the warriors of all Japan under his regime in Kamakura. Yoritomo’s brother Yoshitsune, who had fallen out with him after the Genpei War, had found refuge with Fujiwara no Hidehira at Hiraizumi. After Hidehira’s death his son Yasuhira gave in to pressure from Kamakura and the court and attacked Yoshitsune at his residence on the Koromo River in the leap fourth month of 1189; Yoshitsune killed himself. Yoritomo marched north anyway, without waiting for an imperial mandate, with three armies, along the Pacific coast, the inland road and the Sea of Japan coast, raised from across the country. On the tenth day of the eighth month his army stormed the earthworks the Fujiwara had built at Atsukashiyama, where Yasuhira’s half-brother Kunihira was killed; Yasuhira abandoned Taga and set fire to Hiraizumi, which the Kamakura army entered on the 22nd. Fleeing north, Yasuhira was killed by one of his own retainers, Kawada Jirō, early in the ninth month. Yoritomo executed the killer, displayed Yasuhira’s head as his ancestor Minamoto no Yoriyoshi had displayed Abe no Sadato’s, and made Kasai Kiyoshige his commissioner for Mutsu. A rising by a former Fujiwara vassal, Ōkawa Kanetō, was put down in 1190. Yoritomo was appointed shōgun in 1192.
: Det fälttåg där Minamoto no Yoritomo förintade Norra Fujiwara i Hiraizumi, som hade härskat över Mutsu och Dewa i ett sekel, och förde alla Japans krigare under sin regim i Kamakura. Yoritomos bror Yoshitsune, som hade blivit osams med honom efter Genpeikriget, hade funnit en tillflykt hos Fujiwara no Hidehira i Hiraizumi. Efter Hidehiras död gav hans son Yasuhira efter för påtryckningar från Kamakura och hovet och angrep Yoshitsune i hans residens vid Koromofloden i den inskjutna fjärde månaden 1189; Yoshitsune tog livet av sig. Yoritomo tågade ändå norrut, utan att invänta ett kejserligt mandat, med tre arméer, uppbådade från hela landet, längs Stillahavskusten, inlandsvägen och kusten mot Japanska havet. På tionde dagen i åttonde månaden stormade hans armé de jordvallar som Fujiwaraklanen hade byggt vid Atsukashiyama, där Yasuhiras halvbror Kunihira dödades; Yasuhira övergav Taga och satte eld på Hiraizumi, dit Kamakuraarmén ryckte in den 22:a. På flykt norrut dödades Yasuhira av en av sina egna vasaller, Kawada Jirō, i början av nionde månaden. Yoritomo avrättade dråparen, ställde ut Yasuhiras huvud så som hans förfader Minamoto no Yoriyoshi hade ställt ut Abe no Sadatos, och gjorde Kasai Kiyoshige till sin kommissarie för Mutsu. En resning av en före detta Fujiwaravasall, Ōkawa Kanetō, slogs ner 1190. Yoritomo utnämndes till shōgun 1192.
