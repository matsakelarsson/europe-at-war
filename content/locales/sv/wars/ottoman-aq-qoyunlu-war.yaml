The size of both armies is very uncertain; the sources give anything from 70,000 to several hundred thousand. Otlukbeli is also called the Battle of Başkent or of Tercan.: Storleken på båda arméerna är mycket osäker; källorna anger allt från 70 000 till flera hundra tusen. Otlukbeli kallas också slaget vid Başkent eller vid Tercan.
