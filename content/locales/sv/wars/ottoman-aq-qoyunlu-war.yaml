Ottoman–Aq Qoyunlu War: Osmansk-akkoyunluska kriget
The war between Mehmed II and Uzun Hasan, ruler of the Aq Qoyunlu (White Sheep) Turkmen, who had made himself master of eastern Anatolia, Iran and Iraq. Allied with Venice and the Karamanids, Uzun Hasan sent an army into Anatolia in 1472 that sacked Tokat and drove into Karaman before it was beaten back. In 1473 Mehmed marched east with a large army and his sons Bayezid and Mustafa. On the upper Euphrates near Tercan, an Ottoman force that crossed the river was routed early in August, but on 11 August 1473 at Otlukbeli the Ottoman janissaries, guns and firearms broke Uzun Hasan’s army. Mehmed did not pursue him into Iran, but the Aq Qoyunlu never again threatened Ottoman Anatolia, and the Karamanids and Venice lost their eastern ally.: Kriget mellan Mehmed II och Uzun Hasan, härskare över turkmenerna i Aq Qoyunlu (”vita fåret”), som hade gjort sig till herre över östra Anatolien, Iran och Irak. I allians med Venedig och karamaniderna sände Uzun Hasan 1472 en här in i Anatolien som plundrade Tokat och trängde in i Karaman innan den slogs tillbaka. År 1473 marscherade Mehmed österut med en stor här och sina söner Bayezid och Mustafa. Vid övre Eufrat nära Tercan slogs en osmansk styrka som gått över floden på flykt i början av augusti, men den 11 augusti 1473 vid Otlukbeli krossade de osmanska janitsjarerna, kanonerna och eldvapnen Uzun Hasans här. Mehmed förföljde honom inte in i Iran, men Aq Qoyunlu hotade aldrig mer det osmanska Anatolien, och karamaniderna och Venedig förlorade sin bundsförvant i öster.
