The early history of the Ottomans is known mainly from Byzantine historians such as George Pachymeres and from Ottoman chronicles written more than a century later, which mix fact and legend. Many dates are uncertain; the battle of Bapheus is dated 1302 by most modern historians, but 1299 by some older ones, and Osman’s death is placed between 1323 and 1326.: Osmanernas tidiga historia är främst känd från bysantinska historiker som Georgios Pachymeres och från osmanska krönikor skrivna mer än ett sekel senare, som blandar fakta och legend. Många datum är osäkra; slaget vid Bapheus dateras av de flesta moderna historiker till 1302, men av några äldre till 1299, och Osmans död förläggs till mellan 1323 och 1326.
Osman was one of many Turkish warlords on the Byzantine frontier after the decline of the Seljuk sultanate of Rum. From his base at Söğüt in the Sakarya valley he raided ever deeper into Bithynia, and Ottoman tradition credits him with taking Bilecik, İnegöl and Yenişehir around 1299. By 1301 his men were blockading Nicaea and plundering the outskirts of Prusa (Bursa), and they kept the people of Nicomedia from bringing in their harvest. Shortly before, the co-emperor Michael IX had led an army into western Anatolia, but it melted away at Magnesia without fighting.: Osman var en av många turkiska krigsherrar vid den bysantinska gränsen efter rumseldjukernas sultanats nedgång. Från sin bas i Söğüt i Sakaryadalen gjorde han allt djupare plundringståg in i Bithynien, och den osmanska traditionen tillskriver honom erövringen av Bilecik, İnegöl och Yenişehir omkring 1299. År 1301 blockerade hans män Nikaia och plundrade utkanterna av Prusa (Bursa), och de hindrade invånarna i Nikomedia från att bärga sin skörd. Kort dessförinnan hade medkejsaren Mikael IX lett en armé in i västra Anatolien, men den smälte bort vid Magnesia utan strid.
To relieve Nicomedia, Andronikos II sent some 2,000 men across the Bosporus under George Mouzalon, about half of them newly hired Alan mercenaries. On 27 July 1302, at Bapheus, a plain near Nicomedia, they met perhaps 5,000 Turkish horsemen led by Osman. The Alans stood aside, the Turks broke the Byzantine line and Mouzalon fled into the city. Bapheus was the first Ottoman victory over an imperial army. The Byzantines kept only their walled towns, and refugees crowded across the strait to Constantinople.: För att undsätta Nikomedia sände Andronikos II omkring 2 000 man över Bosporen under Georgios Mouzalon, ungefär hälften av dem nyvärvade alanska legosoldater. Den 27 juli 1302 vid Bapheus, en slätt nära Nikomedia, mötte de kanske 5 000 turkiska ryttare ledda av Osman. Alanerna höll sig utanför striden, turkarna bröt den bysantinska linjen och Mouzalon flydde in i staden. Bapheus var den första osmanska segern över en kejserlig armé. Bysantinerna behöll bara sina befästa städer, och flyktingar trängdes över sundet till Konstantinopel.
