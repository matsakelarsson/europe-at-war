Orhan: Orhan
In 1329 Andronikos III, now sole emperor, and his chief minister John Kantakouzenos crossed to Asia with about 4,000 men, the largest army they could raise, to relieve Nicaea and Nicomedia. At Pelekanon, on the coast of the Gulf of Nicomedia, Orhan’s army blocked the road from the hills. After a day of skirmishing on 10 June the Byzantines began to withdraw; both leaders were slightly wounded, a rumour spread that the emperor was dying, and on 11 June the retreat became a rout. Kantakouzenos brought the survivors home by sea.: År 1329 gick Andronikos III, nu ensam kejsare, och hans främste minister Johannes Kantakouzenos över till Asien med omkring 4 000 man, den största armé de kunde uppbåda, för att undsätta Nikaia och Nikomedia. Vid Pelekanon, vid Nikomediabuktens kust, spärrade Orhans armé vägen från bergen. Efter en dags skärmytslingar den 10 juni började bysantinerna dra sig tillbaka; båda ledarna blev lätt sårade, ett rykte spreds att kejsaren låg för döden, och den 11 juni blev reträtten en vild flykt. Kantakouzenos förde hem de överlevande sjövägen.
No Byzantine army tried to win back Asia Minor again. Nicaea, where the church council of 325 had met and the emperors had ruled in exile after 1204, surrendered on 2 March 1331, and many of its people soon became Muslims; Orhan turned its great church into a mosque. Andronikos offered tribute in return for peace, but Orhan went on to besiege Nicomedia, which surrendered in 1337. With the annexation of the neighbouring beylik of Karasi, the Ottomans held most of the Asian shore of the Sea of Marmara.: Ingen bysantinsk armé försökte sedan vinna tillbaka Mindre Asien. Nikaia, där kyrkomötet 325 hade sammanträtt och kejsarna hade regerat i exil efter 1204, kapitulerade den 2 mars 1331, och många av dess invånare blev snart muslimer; Orhan gjorde om dess stora kyrka till moské. Andronikos erbjöd tribut i utbyte mot fred, men Orhan gick vidare och belägrade Nikomedia, som kapitulerade 1337. Genom annekteringen av grannbejliken Karasi behärskade osmanerna större delen av Marmarasjöns asiatiska kust.
