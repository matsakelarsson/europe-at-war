Ottoman conquest of Bithynia: Osmanernas erövring av Bithynien
The conquest of Byzantine Bithynia, the north-western corner of Anatolia facing Constantinople, by Osman, founder of the Ottoman dynasty, and his son Orhan. After Osman’s victory at Bapheus in 1302 the Byzantines lost the countryside and kept only walled towns, which fell one by one after long blockades; Bursa in 1326, Nicaea in 1331 and Nicomedia in 1337. Andronikos III’s attempt to relieve them was beaten at Pelekanon in 1329, the last Byzantine campaign in Asia Minor.: "Osman, grundaren av den osmanska dynastin, och hans son Orhan erövrade det bysantinska Bithynien, Anatoliens nordvästra hörn mittemot Konstantinopel. Efter Osmans seger vid Bapheus 1302 förlorade bysantinerna landsbygden och behöll bara de befästa städerna, som föll en efter en efter långa blockader: Bursa 1326, Nicaea 1331 och Nikomedia 1337. Andronikos III:s försök att undsätta dem slogs tillbaka vid Pelekanon 1329, det sista bysantinska fälttåget i Mindre Asien."
