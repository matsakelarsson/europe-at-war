The Ottomans had no siege engines able to break the walls of Prusa, the rich city at the foot of Mount Olympus (Uludağ), so from about 1317 they starved it, building forts around it and cutting its roads. The Byzantines, caught up from 1321 in the civil war between Andronikos II and his grandson, sent no relief. Osman, old and ill, left the war to his son Orhan.: Osmanerna hade inga belägringsmaskiner som kunde bryta murarna kring Prusa, den rika staden vid foten av berget Olympos (Uludağ), så från omkring 1317 svalt de ut den genom att bygga fort runt den och skära av dess vägar. Bysantinerna, som från 1321 var indragna i inbördeskriget mellan Andronikos II och hans sonson, sände ingen undsättning. Osman, gammal och sjuk, överlät kriget åt sin son Orhan.
On 6 April 1326, after years of blockade, the city surrendered to Orhan. Osman died about this time; by some accounts he heard of the victory on his deathbed, and he was buried in Bursa. Orhan made Bursa his capital, built mosques, baths and inns, and drew merchants to it, and the Moroccan traveller Ibn Battuta, who visited it in about 1331, praised its bazaars and wide streets. It remained the chief Ottoman city until the 1360s, and the early sultans were buried there.: Den 6 april 1326, efter flera års blockad, kapitulerade staden för Orhan. Osman dog vid denna tid; enligt vissa berättelser fick han höra om segern på sin dödsbädd, och han begravdes i Bursa. Orhan gjorde Bursa till sin huvudstad, byggde moskéer, badhus och värdshus och drog dit köpmän, och den marockanske resenären Ibn Battuta, som besökte staden omkring 1331, prisade dess basarer och breda gator. Den förblev den viktigaste osmanska staden fram till 1360-talet, och de tidiga sultanerna begravdes där.
