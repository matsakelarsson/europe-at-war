Stephen Tomašević, crowned in 1461 with a crown sent by Pope Pius II, refused the customary tribute to the sultan, counting on Hungarian help that did not come in time. His kingdom was divided, his people largely indifferent and the powerful Duke Stjepan Vukčić Kosača of Herzegovina at war with his own son. In the spring of 1463 Mehmed II marched into Bosnia with a large army. His grand vizier Mahmud Pasha Angelović besieged the royal fortress of Bobovac on 19 May, and it surrendered within days. The king fled west, but Mahmud Pasha caught up with him at Ključ, where after a four-day siege he gave himself up in return for a written promise of safety.: Stefan Tomašević, som kröntes 1461 med en krona sänd av påven Pius II, vägrade betala den sedvanliga tributen till sultanen och räknade med ungersk hjälp som inte kom i tid. Hans kungarike var splittrat, hans folk till stor del likgiltigt och den mäktige hertigen Stjepan Vukčić Kosača av Hercegovina i krig med sin egen son. Våren 1463 marscherade Mehmed II in i Bosnien med en stor armé. Hans storvesir Mahmud pasha Angelović belägrade den kungliga fästningen Bobovac den 19 maj, och den kapitulerade inom några dagar. Kungen flydde västerut, men Mahmud pasha hann upp honom vid Ključ, där han efter fyra dagars belägring gav sig mot ett skriftligt löfte om fri lejd.
Taken before the sultan at Jajce, Stephen ordered his commanders to give up their castles, and some seventy towns surrendered in a week. On 25 May he was beheaded, and Bosnia became an Ottoman province. Mahmud Pasha then attacked Herzegovina, where the old duke had to give up his lands north of Blagaj. When the sultan’s army had gone home, Matthias Corvinus invaded in the autumn, besieged Jajce and took it in December, forming a Hungarian frontier province that held until 1527. Herzegovina was conquered piece by piece; its last fortress, Herceg Novi on the Bay of Kotor, fell at the end of 1481.: Stefan fördes inför sultanen i Jajce och beordrade sina befälhavare att ge upp sina borgar, och ett sjuttiotal städer kapitulerade på en vecka. Den 25 maj halshöggs han, och Bosnien blev en osmansk provins. Mahmud pasha angrep sedan Hercegovina, där den gamle hertigen måste ge upp sina områden norr om Blagaj. När sultanens armé hade återvänt hem föll Matthias Corvinus in under hösten, belägrade Jajce och intog staden i december, och bildade en ungersk gränsprovins som höll till 1527. Hercegovina erövrades bit för bit; dess sista fästning, Herceg Novi vid Kotorbukten, föll i slutet av 1481.
