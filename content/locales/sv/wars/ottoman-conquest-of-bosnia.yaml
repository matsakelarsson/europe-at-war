The royal fortress, expected to hold for two years, surrendered within days of the siege.: Den kungliga fästningen, som väntades hålla i två år, kapitulerade inom några dagar efter belägringens början.
The king surrendered here after a four-day siege, trusting Mahmud Pasha’s written guarantee of his life.: Kungen kapitulerade här efter fyra dagars belägring i förlitan på Mahmud pashas skriftliga garanti för hans liv.
Stephen was executed here in May. Matthias Corvinus retook the town after a siege of about three months.: Stefan avrättades här i maj. Matthias Corvinus återtog staden efter en belägring på omkring tre månader.
