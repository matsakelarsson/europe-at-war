Accounts of the king’s death differ. One version says Mehmed’s scholar Ali al-Bistami ruled that the promise of safety was not binding on the sultan and beheaded the king himself; others say Mehmed did it. Later stories that he was flayed or used as a target are not supported by contemporary sources.: Berättelserna om kungens död går isär. Enligt en version fastslog Mehmeds lärde Ali al-Bistami att löftet om fri lejd inte var bindande för sultanen och halshögg själv kungen; enligt andra gjorde Mehmed det. Senare berättelser om att han flåddes eller användes som måltavla stöds inte av samtida källor.
The Hungarian conquest of Jajce is dated 16 or 25 December 1463 in different sources. Herzegovina’s last fortress, Novi (Herceg Novi), fell at the end of 1481, and the duchy is often said to have ended in 1482.: Den ungerska erövringen av Jajce dateras i olika källor till 16 eller 25 december 1463. Hercegovinas sista fästning, Novi (Herceg Novi), föll i slutet av 1481, och hertigdömet sägs ofta ha upphört 1482.
