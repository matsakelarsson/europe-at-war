Ottoman conquest of Bosnia: Osmanernas erövring av Bosnien
Mehmed II’s rapid conquest of the Kingdom of Bosnia in 1463. King Stephen Tomašević had refused to pay tribute, trusting in help from Hungary and the pope, but when the sultan invaded in May the royal fortress of Bobovac fell within days, and the king was captured at Ključ and beheaded. Matthias Corvinus of Hungary retook Jajce and the north at the end of the year, and the duchy of Herzegovina to the south held out in part until its last fortress fell in 1481–1482.: Mehmed II:s snabba erövring av kungariket Bosnien 1463. Kung Stefan Tomašević hade vägrat att betala tribut i förlitan på hjälp från Ungern och påven, men när sultanen anföll i maj föll den kungliga fästningen Bobovac inom några dagar, och kungen tillfångatogs vid Ključ och halshöggs. Matthias Corvinus av Ungern återtog Jajce och norra delen vid årets slut, och hertigdömet Hercegovina i söder höll delvis stånd tills dess sista fästning föll 1481–1482.
