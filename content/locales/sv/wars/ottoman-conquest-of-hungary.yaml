18 August 1529: 18 augusti 1529
On the battlefield of 1526 Zápolya met the sultan, kissed his hand and was recognised as king under Ottoman protection.: På slagfältet från 1526 mötte Zápolya sultanen, kysste hans hand och erkändes som kung under osmanskt beskydd.
The capital surrendered and was given to Zápolya, who held it as the sultan’s vassal for the rest of his life.: Huvudstaden kapitulerade och gavs till Zápolya, som innehade den som sultanens vasall resten av sitt liv.
The old city walls were patched with earthworks and held against mines and assaults. The furthest point of the Ottoman advance until 1683.: De gamla stadsmurarna lappades ihop med jordverk och stod emot minor och stormningar. Den osmanska framstötens yttersta punkt fram till 1683.
In 1530 Ferdinand’s army besieged Buda but could not take it. In April 1532 Suleiman led another huge army north, aiming, he said, to fight Charles V himself. In early August it stopped before Kőszeg, a small town near the Austrian border. Its captain, the Croatian nobleman Nikola Jurišić, had a handful of soldiers and several hundred townspeople and peasants, with almost no guns. For more than three weeks they beat off assault after assault while mines brought down parts of the walls.: År 1530 belägrade Ferdinands här Buda men kunde inte inta staden. I april 1532 ledde Süleyman ännu en väldig här norrut, enligt egen uppgift för att strida mot Karl V själv. I början av augusti stannade den framför Kőszeg, en liten stad nära den österrikiska gränsen. Dess kapten, den kroatiske adelsmannen Nikola Jurišić, hade en handfull soldater och några hundra stadsbor och bönder, nästan utan kanoner. I mer än tre veckor slog de tillbaka stormning efter stormning medan minor fällde delar av murarna.
How the siege ended is told two ways. In one account Jurišić refused to surrender; in the other he accepted a token surrender in which a few Ottoman soldiers raised their flag on the walls. Either way the sultan, with the season late, did not go on to Vienna, where Charles was gathering an imperial army of some 80,000 men. He turned south through Styria, plundering the land, while part of his raiding cavalry was destroyed at Leobersdorf. In 1533 a truce at Constantinople left Ferdinand the west and north of Hungary that he held, and Zápolya the rest as the sultan’s vassal.: Hur belägringen slutade berättas på två sätt. Enligt den ena versionen vägrade Jurišić att kapitulera; enligt den andra gick han med på en symbolisk kapitulation där några osmanska soldater hissade sin fana på murarna. Hur som helst gick sultanen, sent på säsongen, inte vidare mot Wien, där Karl samlade en kejserlig här på omkring 80 000 man. Han vände söderut genom Steiermark och plundrade landet, medan en del av hans plundrande kavalleri tillintetgjordes vid Leobersdorf. År 1533 lämnade ett stillestånd i Konstantinopel åt Ferdinand den västra och norra del av Ungern som han innehade, och åt Zápolya resten som sultanens vasall.
