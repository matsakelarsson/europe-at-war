Through Styria: Genom Steiermark
In 1537 a Habsburg army under Johann Katzianer was destroyed at Gorjani in Slavonia. By the secret Treaty of Nagyvárad in February 1538 the two kings agreed to keep what they held, with Ferdinand to inherit Zápolya’s share. But in July 1540, days after the birth of his son John Sigismund, Zápolya died. His supporters, led by his widow Isabella and the monk George Martinuzzi, made the baby king, and the sultan accepted him. Ferdinand sent an army under Roggendorf to besiege Buda in May 1541.: År 1537 tillintetgjordes en habsburgsk här under Johann Katzianer vid Gorjani i Slavonien. Genom det hemliga fördraget i Nagyvárad i februari 1538 kom de två kungarna överens om att behålla vad de innehade, och Ferdinand skulle ärva Zápolyas del. Men i juli 1540, några dagar efter att hans son Johan Sigismund fötts, dog Zápolya. Hans anhängare, ledda av hans änka Isabella och munken Georg Martinuzzi, gjorde barnet till kung, och sultanen godtog honom. Ferdinand sände en här under Roggendorf för att belägra Buda i maj 1541.
Suleiman came to the city’s relief and routed the besiegers on 21 August. On 29 August, the anniversary of Mohács, while the Hungarian lords were in his tent, Ottoman soldiers took over Buda, and the city became the seat of an Ottoman province. Isabella and her son were sent east to rule the lands beyond the Tisza and Transylvania as Ottoman vassals. In 1543 the Ottomans took Pécs, Siklós, Esztergom and Székesfehérvár, and in 1544 Visegrád, Nógrád and Hatvan. By the Truce of Adrianople in 1547 Ferdinand agreed to pay 30,000 florins a year for his part of Hungary, which was now split three ways.: Süleyman kom staden till undsättning och slog belägrarna på flykten den 21 augusti. Den 29 augusti, årsdagen av Mohács, medan de ungerska stormännen befann sig i hans tält, tog osmanska soldater kontroll över Buda, och staden blev säte för en osmansk provins. Isabella och hennes son skickades österut för att som osmanska vasaller styra landen bortom Tisza och Transsylvanien. År 1543 intog osmanerna Pécs, Siklós, Esztergom och Székesfehérvár, och 1544 Visegrád, Nógrád och Hatvan. Genom stilleståndet i Adrianopel 1547 gick Ferdinand med på att betala 30 000 floriner om året för sin del av Ungern, som nu var tredelat.
