In April 1526 Suleiman marched again with a large army, probably 50,000–60,000 fighting men and perhaps many more with the irregulars. Petrovaradin on the Danube fell in July after a stubborn defence, and in August the Ottomans crossed the Drava at Osijek on a bridge of boats. King Louis gathered some 25,000–30,000 men, Hungarians, Croats, Poles, Germans, Czechs and Serbs, at Mohács, but the Transylvanian army of John Zápolya and the Croatian troops of Christoph Frankopan were still far away. His commanders, among them Pál Tomori, archbishop of Kalocsa, chose to fight on the open plain rather than retreat to Buda.: I april 1526 tågade Süleyman åter ut med en stor här, troligen 50 000–60 000 stridande och kanske många fler med de irreguljära styrkorna. Petrovaradin vid Donau föll i juli efter ett envist försvar, och i augusti gick osmanerna över Drava vid Osijek på en pontonbro. Kung Ludvig samlade omkring 25 000–30 000 man – ungrare, kroater, polacker, tyskar, tjecker och serber – vid Mohács, men Johan Zápolyas transsylvanska här och Christoph Frankopans kroatiska trupper var ännu långt borta. Hans befälhavare, bland dem Pál Tomori, ärkebiskop av Kalocsa, valde att strida på den öppna slätten i stället för att dra sig tillbaka till Buda.
The battle was fought on the afternoon of 29 August. A Hungarian charge broke into the Ottoman front line, but was caught by the janissaries and the guns and then surrounded; within a few hours the royal army was destroyed. More than 14,000 Hungarian soldiers died, among them seven bishops and archbishops, Tomori one of them, and 28 barons, and about 2,000 prisoners were killed after the battle. Louis drowned in the flooded Csele stream as he fled. Suleiman entered Buda, which had been abandoned, on 11 September; his troops burned it and Pest, and the army went home in October with much plunder and many captives, keeping only a few fortresses in Syrmia.: Slaget utkämpades på eftermiddagen den 29 augusti. Ett ungerskt anfall bröt in i den osmanska frontlinjen men fångades upp av janitsjarerna och kanonerna och omringades sedan; inom några timmar var den kungliga hären tillintetgjord. Mer än 14 000 ungerska soldater dog, bland dem sju biskopar och ärkebiskopar, däribland Tomori, och 28 baroner, och omkring 2 000 fångar dödades efter slaget. Ludvig drunknade i den översvämmade bäcken Csele under flykten. Süleyman tågade den 11 september in i Buda, som hade övergivits; hans trupper brände staden och Pest, och hären vände hem i oktober med stort byte och många fångar och behöll bara några få fästningar i Syrmien.
