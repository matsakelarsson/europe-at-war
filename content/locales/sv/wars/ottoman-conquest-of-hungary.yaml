Ottoman conquest of Hungary: Osmanernas erövring av Ungern
The wars in which Suleiman the Magnificent broke the medieval Kingdom of Hungary. After taking Belgrade in 1521 the Ottomans destroyed the Hungarian army at Mohács in 1526, where King Louis II died; two rival kings, John Zápolya and the Habsburg Ferdinand I, then fought for the crown, Zápolya with Ottoman backing. Suleiman besieged Vienna in 1529 and was held up at Kőszeg in 1532, and in 1541 he occupied Buda, leaving Hungary divided between Habsburg Royal Hungary, Ottoman Hungary and the eastern kingdom that became the Principality of Transylvania.: De krig genom vilka Süleyman den store krossade det medeltida kungariket Ungern. Efter att ha intagit Belgrad 1521 tillintetgjorde osmanerna den ungerska hären vid Mohács 1526, där kung Ludvig II dog; två rivaliserande kungar, Johan Zápolya och habsburgaren Ferdinand I, stred därefter om kronan, Zápolya med osmanskt stöd. Süleyman belägrade Wien 1529 och hölls uppe vid Kőszeg 1532, och 1541 besatte han Buda, vilket lämnade Ungern delat mellan det habsburgska Kungliga Ungern, Osmanska Ungern och det östra kungariket som blev furstendömet Transsylvanien.
