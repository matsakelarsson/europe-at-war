Belgrade, where the Sava meets the Danube, had been the key to Hungary’s southern defences since John Hunyadi held it against Mehmed II in 1456. In 1520 the young Suleiman I became sultan, and Hungary was weak; its king, Louis II, was fifteen, and its great nobles were divided and its treasury empty. When Louis’s council refused the sultan’s demand for tribute and held his envoy, Suleiman led an army north from Constantinople in May 1521, with little help coming to Hungary from the rest of Christendom.: "Belgrad, där Sava flyter ut i Donau, hade varit nyckeln till Ungerns södra försvar sedan Johan Hunyadi försvarade staden mot Mehmed II 1456. År 1520 blev den unge Süleyman I sultan, och Ungern var svagt: kungen, Ludvig II, var femton år, stormännen var splittrade och statskassan tom. När Ludvigs råd avvisade sultanens krav på tribut och höll kvar hans sändebud ledde Süleyman en här norrut från Konstantinopel i maj 1521, medan Ungern fick föga hjälp från resten av kristenheten."
Suleiman himself took Šabac on the Sava, where the defenders were killed to the last man, while the grand vizier Piri Mehmed Pasha took Zemun and laid siege to Belgrade. The fortress had only about 700 defenders, and no relief army came. After weeks of bombardment and mining the citadel surrendered at the end of August; most sources give 29 August. About 70 defenders survived and were spared, and many of the Serbian townspeople were deported to Constantinople. The road up the Danube into Hungary was open.: Süleyman intog själv Šabac vid Sava, där försvararna dödades till sista man, medan storvesiren Piri Mehmed pasha intog Zemun och belägrade Belgrad. Fästningen hade bara omkring 700 försvarare, och ingen undsättningshär kom. Efter veckor av beskjutning och minering kapitulerade citadellet i slutet av augusti; de flesta källor anger 29 augusti. Omkring 70 försvarare överlevde och skonades, och många av de serbiska stadsborna deporterades till Konstantinopel. Vägen uppför Donau in i Ungern låg öppen.
