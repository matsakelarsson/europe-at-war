After failing to take Osijek, Katzianer’s army of about 24,000 was caught in the marshes near Đakovo and destroyed. Katzianer fled and was later killed for treason.: Sedan Katzianers här på omkring 24 000 man misslyckats med att inta Osijek blev den överraskad i träsken nära Đakovo och tillintetgjord. Katzianer flydde och dödades senare för förräderi.
A secret agreement between the two kings. Zápolya kept his lands for life, and Ferdinand was to inherit them.: En hemlig överenskommelse mellan de två kungarna. Zápolya behöll sina länder livet ut, och Ferdinand skulle ärva dem.
After routing Roggendorf’s besieging army, the Ottomans took the city by surprise. It was the seat of an Ottoman province until 1686.: Sedan osmanerna slagit Roggendorfs belägringshär på flykten intog de staden genom en överrumpling. Den var säte för en osmansk provins fram till 1686.
August 1543: augusti 1543
The seat of Hungary’s archbishops fell after a short siege, followed in September by the coronation city of Székesfehérvár.: Ungerns ärkebiskopssäte föll efter en kort belägring, och i september följde kröningsstaden Székesfehérvár.
The bishop’s city in southern Transdanubia surrendered to the Ottomans, as did nearby Siklós.: Biskopsstaden i södra Transdanubien kapitulerade för osmanerna, liksom närbelägna Siklós.
