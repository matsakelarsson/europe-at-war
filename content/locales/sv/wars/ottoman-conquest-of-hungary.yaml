With Louis dead and childless, Hungary had two kings. The lesser nobles, who wanted a native ruler, proclaimed John Zápolya, voivode of Transylvania and the country’s richest lord, at Székesfehérvár on 10 November 1526, and he was crowned the next day. On 17 December a rival diet at Pozsony, led by magnates and churchmen, elected Ferdinand of Habsburg, archduke of Austria and brother of the Emperor Charles V, who had married Louis’s sister and claimed the throne by family treaties. The Croatian estates chose Ferdinand at Cetin on 1 January 1527, while many Slavonian nobles backed Zápolya.: Med Ludvig död och barnlös fick Ungern två kungar. Den lägre adeln, som ville ha en inhemsk härskare, utropade Johan Zápolya, vojvod av Transsylvanien och landets rikaste storman, till kung i Székesfehérvár den 10 november 1526, och han kröntes dagen därpå. Den 17 december valde en rivaliserande riksdag i Pozsony, ledd av magnater och kyrkomän, Ferdinand av Habsburg, ärkehertig av Österrike och bror till kejsar Karl V, som var gift med Ludvigs syster och gjorde anspråk på tronen genom familjefördrag. De kroatiska ständerna valde Ferdinand i Cetin den 1 januari 1527, medan många slavonska adelsmän stödde Zápolya.
In the south a Serbian soldier, Jovan Nenad, who called himself emperor, ruled much of the Bačka from Subotica until he was killed in 1527. That summer Ferdinand’s German mercenaries entered Hungary, took Buda and beat Zápolya at Tokaj on 27 September; Ferdinand was crowned at Székesfehérvár on 3 November. Defeated again at Szina in March 1528, Zápolya fled to Poland. From there he sent the Polish nobleman Hieronim Łaski to Constantinople, and in 1528 Suleiman agreed to support him as his vassal.: I söder härskade en serbisk soldat, Jovan Nenad, som kallade sig kejsare, över stora delar av Bačka från Subotica tills han dödades 1527. Samma sommar ryckte Ferdinands tyska legosoldater in i Ungern, intog Buda och slog Zápolya vid Tokaj den 27 september; Ferdinand kröntes i Székesfehérvár den 3 november. Efter ett nytt nederlag vid Szina i mars 1528 flydde Zápolya till Polen. Därifrån sände han den polske adelsmannen Hieronim Łaski till Konstantinopel, och 1528 gick Süleyman med på att stödja honom som sin vasall.
