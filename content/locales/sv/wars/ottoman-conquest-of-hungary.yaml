Dates are Julian, as usual for the period. The numbers of soldiers come mostly from chroniclers and are uncertain; modern estimates are often much lower than the figures of the time.: Datumen anges enligt den julianska kalendern, som är brukligt för perioden. Truppstyrkorna bygger mest på krönikörer och är osäkra; moderna uppskattningar är ofta mycket lägre än samtidens siffror.
Places are given by their usual English or modern names, with the Hungarian or German name where it is often used (Buda, Pozsony/Pressburg for Bratislava, Kőszeg/Güns, Nagyvárad for Oradea, Eszék for Osijek).: Platser anges med sina vanliga svenska eller moderna namn, med det ungerska eller tyska namnet där det ofta används (Buda, Pozsony/Pressburg för Bratislava, Kőszeg/Güns, Nagyvárad för Oradea, Eszék för Osijek).
The fighting between the two kings and their backers in 1527–1538 is often called the Little War in Hungary. The later wars in Hungary have their own entries, among them the war of 1551–1562, the war of 1565–1568 with the siege of Szigetvár, the Long Turkish War of 1593–1606 and the Great Turkish War of 1683–1699.: Striderna mellan de två kungarna och deras anhängare 1527–1538 kallas ofta det lilla kriget i Ungern. De senare krigen i Ungern har egna poster, bland dem kriget 1551–1562, kriget 1565–1568 med belägringen av Szigetvár, det långa turkiska kriget 1593–1606 och det stora turkiska kriget 1683–1699.
