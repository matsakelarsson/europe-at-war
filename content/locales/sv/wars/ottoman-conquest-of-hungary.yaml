Suleiman set out from Constantinople on 10 May 1529, but the spring rains were so heavy that he had to leave his largest siege guns behind and lost many camels on the way. On 18 August Zápolya met him on the field of Mohács and paid homage, and on 8 September Buda surrendered and was handed back to Zápolya. Most of the castles Ferdinand had taken gave up without a fight, and the army marched on up the Danube into Austria, its light cavalry raiding far ahead.: Süleyman bröt upp från Konstantinopel den 10 maj 1529, men vårregnen var så kraftiga att han måste lämna sina största belägringskanoner kvar och förlorade många kameler på vägen. Den 18 augusti mötte Zápolya honom på slagfältet vid Mohács och betygade sin trohet, och den 8 september kapitulerade Buda och lämnades tillbaka till Zápolya. De flesta borgar som Ferdinand hade intagit gav upp utan strid, och hären tågade vidare uppför Donau in i Österrike med sitt lätta kavalleri härjande långt i förväg.
The siege of Vienna began on 27 September. Count Niklas Salm and Wilhelm von Roggendorf had perhaps 16,000 soldiers, with Spanish arquebusiers and German landsknechts among them, and some 5,000 armed citizens; the Ottomans may have had 75,000–100,000 men at the walls. Their miners blew several breaches, but every assault was thrown back. With winter coming, supplies short and more rain falling, a last great attack on 14 October failed, and the next day the army began its retreat, killing many of its captives as it went.: Belägringen av Wien inleddes den 27 september. Greve Niklas Salm och Wilhelm von Roggendorf hade kanske 16 000 soldater, bland dem spanska arkebusörer och tyska lantsknektar, och omkring 5 000 beväpnade borgare; osmanerna kan ha haft 75 000–100 000 man vid murarna. Deras minörer sprängde flera breschar, men varje stormning slogs tillbaka. Med vintern i antågande, ont om förnödenheter och mer regn misslyckades en sista stor stormning den 14 oktober, och dagen därpå började hären återtåget och dödade många av sina fångar på vägen.
27 September – 15 October 1529: 27 september – 15 oktober 1529
