Dates for the end of the Karamanid state vary between 1474 and 1487, depending on whether the last pretenders are counted.: Uppgifterna om när den karamanidiska staten upphörde varierar mellan 1474 och 1487, beroende på om de sista tronpretendenterna räknas med.
