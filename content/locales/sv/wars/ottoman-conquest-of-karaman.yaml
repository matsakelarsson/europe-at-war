Ottoman conquest of Karaman: Osmanernas erövring av Karaman
The Ottoman annexation of the Karamanid beylik of central and southern Anatolia, for two centuries the Ottomans’ strongest Turkish rival. After the death of İbrahim Bey in 1464 his sons fought over the succession, and Mehmed II backed first one and then another. In 1468 he occupied Konya and Karaman (Larende) and made the country an Ottoman province under his son Mustafa, but Pir Ahmed and his brother Kasım held out in the Taurus mountains with the help of the Turkmen tribes and of Uzun Hasan of the Aq Qoyunlu, whose army drove into Karaman in 1472. After Uzun Hasan’s defeat at Otlukbeli in 1473, Gedik Ahmed Pasha took the remaining castles in the mountains and on the coast, such as Silifke, by 1474. Karamanid pretenders kept up resistance for some years more.: Osmanernas annektering av Karamanidernas beylik i centrala och södra Anatolien, under två sekler osmanernas starkaste turkiska rival. Efter İbrahim Beys död 1464 stred hans söner om tronföljden, och Mehmed II stödde först den ene och sedan den andre. År 1468 besatte han Konya och Karaman (Larende) och gjorde landet till en osmansk provins under sin son Mustafa, men Pir Ahmed och hans bror Kasım höll stånd i Taurusbergen med hjälp av turkmenstammarna och av Uzun Hasan av Aq Qoyunlu, vars här trängde in i Karaman 1472. Efter Uzun Hasans nederlag vid Otlukbeli 1473 intog Gedik Ahmed pasha de återstående borgarna i bergen och vid kusten, som Silifke, fram till 1474. Karamanidiska tronpretendenter fortsatte motståndet ännu några år.
