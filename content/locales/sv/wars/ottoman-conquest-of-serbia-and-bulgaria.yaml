Ottoman conquest of Serbia and Bulgaria: Osmanernas erövring av Serbien och Bulgarien
The quarter-century in which the Ottomans broke the Serbian and Bulgarian states that had dominated the central Balkans. After the Serbian lords of Macedonia were destroyed at the Maritsa in 1371, their heirs and the tsar of Tarnovo became Ottoman vassals; Sofia and Niš fell in the 1380s, and although the Serbs and Bosnians won at Pločnik and Bileća, the battle of Kosovo in 1389, in which both Prince Lazar and Sultan Murad I were killed, left Serbia a vassal state. Bayezid I took Tarnovo in 1393 and Nicopolis in 1395, and after the crusade of Nicopolis in 1396 he annexed Vidin, the last Bulgarian realm.: Det kvartssekel under vilket osmanerna krossade de serbiska och bulgariska stater som hade dominerat centrala Balkan. Sedan de serbiska herrarna i Makedonien förintats vid Maritsa 1371 blev deras arvingar och tsaren i Tarnovo osmanska vasaller; Sofia och Niš föll på 1380-talet, och fastän serberna och bosnierna segrade vid Pločnik och Bileća lämnade slaget på Kosovo 1389, där både furst Lazar och sultan Murad I dödades, Serbien som vasallstat. Bayezid I intog Tarnovo 1393 och Nikopolis 1395, och efter korståget mot Nikopolis 1396 annekterade han Vidin, det sista bulgariska riket.
