Jovan Dragaš and then his brother Konstantin Dejanović ruled the lands between the Struma and the Vardar from here as vassals of the sultan.: Jovan Dragaš och därefter hans bror Konstantin Dejanović styrde härifrån landen mellan Struma och Vardar som sultanens vasaller.
