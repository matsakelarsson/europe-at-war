Balša II of Zeta, with about a thousand men from Durrës, attacked Hayreddin Pasha’s much larger army and was killed.: Balša II av Zeta anföll med omkring tusen man från Durrës Hayreddin pashas mycket större här och dödades.
Murad I: Murad I
Hayreddin Pasha: Hayreddin pasha
The sultan’s demands and the plundering of his raiders pushed the Serbian lords together. In 1386 or 1387 an Ottoman raiding army entered the Toplica valley; while most of its men were scattered plundering, Lazar’s army caught it near Pločnik, close to Prokuplje, and routed it. In August 1388 Lala Şahin Pasha, called in by Đurađ II Balšić of Zeta against King Tvrtko I of Bosnia, plundered Hum in the south of Tvrtko’s kingdom. Ragusa took in refugees, and near Bileća the Bosnian grand duke Vlatko Vuković destroyed the raiders; Şahin escaped with a few men.: Sultanens krav och hans plundrares härjningar förde de serbiska herrarna samman. År 1386 eller 1387 trängde en osmansk plundringshär in i Toplicadalen; medan de flesta av dess män var utspridda för att plundra överraskade Lazars här den nära Pločnik, inte långt från Prokuplje, och slog den på flykten. I augusti 1388 plundrade Lala Şahin pasha, inkallad av Đurađ II Balšić av Zeta mot kung Tvrtko I av Bosnien, Hum i södra delen av Tvrtkos kungarike. Ragusa tog emot flyktingar, och nära Bileća tillintetgjorde den bosniske storvojvoden Vlatko Vuković plundrarna; Şahin undkom med några få man.
Encouraged, Ivan Shishman of Tarnovo refused to send troops to the sultan. In 1388 the grand vizier Çandarlı Ali Pasha crossed the Balkan Mountains with a large army, took Shumen and other fortresses and besieged Shishman in Nicopolis on the Danube. Shishman promised to give up Silistra, then broke his word; Ali Pasha returned, took more towns and besieged him again, and this time he submitted on harder terms, with Ottoman garrisons in Silistra and Shumen. His half-brother Ivan Sratsimir of Vidin also accepted Ottoman overlordship and a garrison.: Uppmuntrad vägrade Ivan Sjisjman av Tarnovo att sända trupper till sultanen. År 1388 gick storvesiren Çandarlı Ali pasha över Balkanbergen med en stor här, intog Sjumen och andra fästningar och belägrade Sjisjman i Nikopolis vid Donau. Sjisjman lovade att avstå Silistra men bröt sedan sitt ord; Ali pasha återvände, intog fler städer och belägrade honom på nytt, och denna gång underkastade han sig på hårdare villkor, med osmanska garnisoner i Silistra och Sjumen. Hans halvbror Ivan Sratsimir av Vidin erkände också osmansk överhöghet och tog emot en garnison.
