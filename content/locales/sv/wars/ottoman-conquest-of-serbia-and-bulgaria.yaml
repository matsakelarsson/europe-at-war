After the death of Stefan Dušan in 1355 his Serbian empire broke up among regional lords. In 1371 two brothers who ruled the south, Vukašin Mrnjavčević, king alongside the weak emperor Uroš V, and Despot Jovan Uglješa, lord of Serres, led an army east to strike at the Ottomans in Thrace while Sultan Murad I was in Anatolia. On 26 September 1371 Ottoman frontier troops under Lala Şahin Pasha and Hacı İlbey fell on their camp by night near Chernomen on the Maritsa, west of Adrianople. Both brothers were killed and their army destroyed. Uroš V died in December, the last of the Nemanjić dynasty.: Efter Stefan Dušans död 1355 föll hans serbiska kejsardöme sönder mellan regionala herrar. År 1371 ledde två bröder som härskade i söder, Vukašin Mrnjavčević, kung vid sidan av den svage kejsaren Uroš V, och despoten Jovan Uglješa, herre över Serres, en här österut för att slå mot osmanerna i Thrakien medan sultan Murad I befann sig i Anatolien. Den 26 september 1371 överföll osmanska gränstrupper under Lala Şahin pasha och Hacı İlbey deras läger nattetid nära Chernomen vid Maritsa, väster om Adrianopel. Båda bröderna dödades och deras här tillintetgjordes. Uroš V dog i december, den siste av Nemanjićdynastin.
The lords of Macedonia submitted to the sultan, paying tribute and sending troops when called. Vukašin’s son Marko ruled from Prilep and the brothers Jovan Dragaš and Konstantin Dejanović held the lands around Velbazhd (Kyustendil) as Ottoman vassals; Byzantium recovered Serres for a time, but the Ottomans took it in 1383. In Bulgaria, Ivan Shishman of Tarnovo lost northern Thrace and in 1373 accepted Ottoman overlordship, marrying his sister Kera Tamara to Murad. In the north Prince Lazar Hrebeljanović built up a strong state in the Morava valley, and his men drove off Ottoman raiders at Dubravnica.: Herrarna i Makedonien underkastade sig sultanen, betalade tribut och sände trupper när de kallades. Vukašins son Marko härskade från Prilep och bröderna Jovan Dragaš och Konstantin Dejanović innehade landen kring Velbazjd (Kjustendil) som osmanska vasaller; Bysans återtog Serres för en tid, men osmanerna intog staden 1383. I Bulgarien förlorade Ivan Sjisjman av Tarnovo norra Thrakien och erkände 1373 osmansk överhöghet, varvid han gifte bort sin syster Kera Tamara med Murad. I norr byggde furst Lazar Hrebeljanović upp en stark stat i Moravadalen, och hans män drev bort osmanska plundrare vid Dubravnica.
