Ivan Shishman took refuge in the Danube fortress and was besieged there twice before he submitted.: Ivan Sjisjman tog sin tillflykt till fästningen vid Donau och belägrades där två gånger innan han underkastade sig.
Silistra: Silistra
The most populous Bulgarian town on the Danube, demanded by the Ottomans as the price of peace.: Den folkrikaste bulgariska staden vid Donau, som osmanerna krävde som pris för freden.
