In the spring of 1389 Murad gathered his army at Philippopolis and, with his sons Bayezid and Yakub, marched west by way of Ihtiman, Velbazhd and Kratovo, where vassal contingents probably joined him, and on through Kumanovo to Pristina, which he reached on 14 June. Lazar, who had assembled his army near Niš, moved through Prokuplje to meet him. With him came his son-in-law Vuk Branković, lord of Kosovo, and Bosnian troops under Vlatko Vuković sent by Tvrtko; Albanian lords and others may also have fought. Modern estimates give Murad perhaps 27,000–30,000 men and Lazar 15,000–20,000.: Våren 1389 samlade Murad sin här vid Philippopolis och tågade med sina söner Bayezid och Yakub västerut via Ihtiman, Velbazjd och Kratovo, där vasallkontingenter troligen anslöt sig, och vidare genom Kumanovo till Pristina, dit han kom den 14 juni. Lazar, som hade samlat sin här nära Niš, ryckte fram genom Prokuplje för att möta honom. Med honom kom hans svärson Vuk Branković, herre över Kosovo, och bosniska trupper under Vlatko Vuković som Tvrtko hade sänt; även albanska herrar och andra kan ha deltagit. Moderna uppskattningar ger Murad kanske 27 000–30 000 man och Lazar 15 000–20 000.
"On 15 June 1389 the armies met on the Field of Blackbirds north-west of Pristina. Few reliable details survive. The Serbian cavalry broke into the Ottoman left before the Ottomans, with Bayezid on the right, gained the upper hand. Murad was killed, by a Serbian knight whom later tradition calls Miloš Obilić; Lazar was captured and executed, and Bayezid had his brother Yakub strangled to secure the throne. Both armies lost heavily. Tvrtko proclaimed a victory, but Serbia could not raise such an army again: Lazar’s widow Milica, ruling for their son Stefan Lazarević, accepted Ottoman overlordship, and Stefan’s sister Olivera was married to Bayezid.": "Den 15 juni 1389 möttes härarna på Trastfältet nordväst om Pristina. Få tillförlitliga detaljer finns bevarade. Det serbiska kavalleriet bröt in i den osmanska vänsterflygeln innan osmanerna, med Bayezid på högerflygeln, fick övertaget. Murad dödades, av en serbisk riddare som senare tradition kallar Miloš Obilić; Lazar tillfångatogs och avrättades, och Bayezid lät strypa sin bror Yakub för att säkra tronen. Båda härarna led svåra förluster. Tvrtko utropade en seger, men Serbien kunde aldrig mer ställa upp en sådan här: Lazars änka Milica, som regerade för deras son Stefan Lazarević, erkände osmansk överhöghet, och Stefans syster Olivera gifte sig med Bayezid."
Battle of Kosovo: Slaget på Kosovo
15 June 1389: 15 juni 1389
Murad I and Bayezid; Prince Lazar, Vuk Branković and Vlatko Vuković: Murad I och Bayezid; furst Lazar, Vuk Branković och Vlatko Vuković
both rulers killed; Serbia becomes an Ottoman vassal: båda härskarna dödade; Serbien blir osmansk vasall
Murad I and Prince Lazar both died, and the armies were badly mauled. The Ottomans held the field, and historians differ on whether to call the battle a victory for them or a draw.: Både Murad I och furst Lazar dog, och härarna blev svårt sargade. Osmanerna behöll slagfältet, och historikerna är oense om huruvida slaget ska kallas en seger för dem eller oavgjort.
14 June 1389: 14 juni 1389
Murad’s army reached the plain of Kosovo here after a march from Philippopolis through Velbazhd and Kratovo.: Här nådde Murads här Kosovoslätten efter en marsch från Philippopolis genom Velbazjd och Kratovo.
Kratovo: Kratovo
spring 1389: våren 1389
Murad halted at the mining town, in the lands of his vassal Konstantin Dejanović, before turning towards Kosovo.: Murad gjorde halt i gruvstaden, i hans vasall Konstantin Dejanovićs land, innan han vände mot Kosovo.
Kruševac: Kruševac
Lazar’s capital, from which he ruled the Morava valley. His army gathered near Niš.: Lazars huvudstad, varifrån han styrde Moravadalen. Hans här samlades nära Niš.
Lazar: Lazar
Bayezid I, called Yıldırım, the Thunderbolt, replaced vassal rule with direct rule wherever he could. Vuk Branković, who had refused to submit after Kosovo, lost Skopje in 1392 and was forced to pay tribute; Ottoman forces took Thessaly in 1393. Ivan Shishman, who was negotiating in secret with King Sigismund of Hungary, was the next target. In the spring of 1393 Bayezid gathered troops from Anatolia and the Balkans and sent his son Süleyman Çelebi to besiege Tarnovo, the Bulgarian capital.: Bayezid I, kallad Yıldırım, ”blixten”, ersatte vasallstyre med direkt styre varhelst han kunde. Vuk Branković, som hade vägrat att underkasta sig efter Kosovo, förlorade Skopje 1392 och tvingades betala tribut; osmanska styrkor intog Thessalien 1393. Ivan Sjisjman, som i hemlighet förhandlade med kung Sigismund av Ungern, stod på tur. Våren 1393 samlade Bayezid trupper från Anatolien och Balkan och sände sin son Süleyman Çelebi att belägra Tarnovo, den bulgariska huvudstaden.
Shishman was at Nicopolis, and Patriarch Euthymius led the defence. After three months Tarnovo fell on 17 July 1393. Its churches were turned into mosques, leading citizens were killed and Euthymius was sent into exile; the Bulgarian patriarchate ceased to exist and its sees came under Constantinople. Shishman kept only Nicopolis and a few towns on the Danube. That winter Bayezid summoned his Christian vassals, among them Emperor Manuel II and Stefan Lazarević, to Serres, where by Byzantine accounts he thought of having them killed.: Sjisjman befann sig i Nikopolis, och patriarken Euthymios ledde försvaret. Efter tre månader föll Tarnovo den 17 juli 1393. Kyrkorna gjordes om till moskéer, ledande borgare dödades och Euthymios sändes i landsflykt; det bulgariska patriarkatet upphörde och dess stift lades under Konstantinopel. Sjisjman behöll bara Nikopolis och några städer vid Donau. Samma vinter kallade Bayezid sina kristna vasaller, bland dem kejsar Manuel II och Stefan Lazarević, till Serres, där han enligt bysantinska källor övervägde att låta döda dem.
