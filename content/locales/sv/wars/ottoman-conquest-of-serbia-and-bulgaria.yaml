Dates are Julian, as usual for the period. The battle of Kosovo was fought on 15 June 1389 by the Julian calendar; it is commemorated on St Vitus’ Day (Vidovdan), now 28 June.: Datumen anges enligt den julianska kalendern, som är brukligt för perioden. Slaget på Kosovo utkämpades den 15 juni 1389 enligt den julianska kalendern; det högtidlighålls på Sankt Vitus dag (Vidovdan), numera den 28 juni.
Sources for these years are scarce and often written long afterwards, and many dates are uncertain. The chronicles’ numbers are much too large; modern historians think most armies of the time numbered a few thousand to a few tens of thousands.: Källorna för dessa år är fåtaliga och ofta skrivna långt efteråt, och många datum är osäkra. Krönikornas siffror är alldeles för höga; moderna historiker anser att de flesta härar på den tiden räknade från några tusen till några tiotusentals man.
The battle of Kosovo became the centre of a Serbian national tradition, the Kosovo myth, that grew in the 19th century; Albanian, Bosnian and other historians stress their own peoples’ part in Lazar’s army. Who fought, and how the battle went, is still argued over.: Slaget på Kosovo blev mittpunkten i en serbisk nationell tradition, Kosovomyten, som växte fram under 1800-talet; albanska, bosniska och andra historiker betonar sina egna folks roll i Lazars här. Vilka som stred och hur slaget förlöpte är fortfarande omtvistat.
Places are given their usual English names, with others in brackets where helpful (Chernomen/Ormenio, Velbazhd/Kyustendil, Tarnovo/Veliko Tarnovo, Nicopolis/Nikopol). The crusade of Nicopolis (1396) has its own entry.: Platser anges med sina vanliga svenska namn, med andra namn inom parentes där det är till hjälp (Chernomen/Ormenio, Velbazjd/Kjustendil, Tarnovo/Veliko Tarnovo, Nikopolis/Nikopol). Korståget mot Nikopolis (1396) har en egen post.
