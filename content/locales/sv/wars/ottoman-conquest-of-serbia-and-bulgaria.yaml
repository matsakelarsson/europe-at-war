In the early 1380s the Ottomans pressed west along the great road from Adrianople towards Belgrade. Sofia, which commanded the routes into Serbia and Macedonia, beat off Lala Şahin Pasha until a renegade lured its governor, Yanuka, out of the town to hunt; he was captured and the leaderless defenders surrendered. The fall is dated to 1382 or to 1385. The walls were pulled down and Sofia became the seat of an Ottoman governor. In 1386 Murad himself took Pirot and, after a siege, Niš, driving a wedge between Bulgaria and Lazar’s Serbia.: I början av 1380-talet trängde osmanerna västerut längs den stora vägen från Adrianopel mot Belgrad. Sofia, som behärskade vägarna in i Serbien och Makedonien, slog tillbaka Lala Şahin pasha tills en överlöpare lockade ut stadens befälhavare, Januka, på jakt; han tillfångatogs och de ledarlösa försvararna kapitulerade. Stadens fall dateras till 1382 eller 1385. Murarna revs och Sofia blev säte för en osmansk ståthållare. År 1386 intog Murad själv Pirot och, efter en belägring, Niš, vilket drev in en kil mellan Bulgarien och Lazars Serbien.
The Ottomans were also drawn into the feuds of the Albanian and Serbian lords on the Adriatic. Called in by Karl Thopia against Balša II of Zeta, who had taken Durrës from him, Hayreddin Pasha brought an army from Ohrid into the plain near Lushnjë. On 18 September 1385 Balša rode out against it with a small force and was killed in the battle of Savra. Afterwards many lords of the region accepted Ottoman overlordship, and in 1386 Ottoman raiders appeared for the first time in Bosnia.: Osmanerna drogs också in i fejderna mellan de albanska och serbiska herrarna vid Adriatiska havet. Inkallad av Karl Thopia mot Balša II av Zeta, som hade tagit Durrës från honom, förde Hayreddin pasha en här från Ohrid ned på slätten nära Lushnjë. Den 18 september 1385 red Balša ut mot den med en liten styrka och dödades i slaget vid Savra. Efteråt erkände många av regionens herrar osmansk överhöghet, och 1386 visade sig osmanska plundrare för första gången i Bosnien.
