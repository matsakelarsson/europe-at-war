Murad took the town after a siege, opening the way into the Morava valley. By some accounts Lazar then agreed to pay tribute.: Murad intog staden efter en belägring, vilket öppnade vägen in i Moravadalen. Enligt vissa uppgifter gick Lazar därefter med på att betala tribut.
