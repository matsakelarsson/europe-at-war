Ottoman troops surprised the Serbian camp at night near Chernomen (Ormenio). King Vukašin and Despot Uglješa were both killed.: Osmanska trupper överraskade det serbiska lägret nattetid nära Chernomen (Ormenio). Kung Vukašin och despoten Uglješa dödades båda.
Vukašin’s son Marko, the Kraljević Marko of Serbian epic songs, ruled a small lordship from Prilep as an Ottoman vassal.: Vukašins son Marko, kungasonen Marko (Kraljević Marko) i de serbiska hjältesångerna, styrde ett litet herradöme från Prilep som osmansk vasall.
