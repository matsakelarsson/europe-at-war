April – 17 July 1393: april – 17 juli 1393
The capital on the Yantra, with its royal and patriarchal citadels of Tsarevets and Trapezitsa, held out for three months.: Huvudstaden vid Jantra, med sina kungliga och patriarkala citadell Tsarevets och Trapezitsa, höll ut i tre månader.
Ivan Shishman’s last refuge, where he hoped for help from Hungary.: Ivan Sjisjmans sista tillflykt, där han hoppades på hjälp från Ungern.
Taken from Vuk Branković, who then became a tributary of the sultan.: Togs från Vuk Branković, som därefter blev tributskyldig till sultanen.
winter 1393–1394: vintern 1393–1394
Bayezid gathered his Byzantine and Serbian vassals here. Manuel II left in fear and soon afterwards stopped obeying the sultan’s summons.: Bayezid samlade här sina bysantinska och serbiska vasaller. Manuel II for därifrån i fruktan och slutade snart därefter att lyda sultanens kallelser.
"Mircea the Elder of Wallachia had seized Silistra and Dobruja and raided across the Danube. In 1395 Bayezid crossed into Wallachia with his Serbian vassals, among them Stefan Lazarević, Marko and Konstantin Dejanović. On 17 May 1395 Mircea’s army, its archers to the fore, met the Ottomans at Rovine, a marshy place probably near the Argeș; Marko and Konstantin were killed. The battle’s outcome is disputed: Christian sources speak of a Wallachian victory, Ottoman ones of their own, and many historians of a bloody draw. Bayezid set up a rival prince, Vlad, but Mircea soon regained his throne.": "Mircea den äldre av Valakiet hade tagit Silistra och Dobrudzja och plundrat på andra sidan Donau. År 1395 gick Bayezid in i Valakiet med sina serbiska vasaller, bland dem Stefan Lazarević, Marko och Konstantin Dejanović. Den 17 maj 1395 mötte Mirceas här, med bågskyttarna i främsta ledet, osmanerna vid Rovine, en sumpig plats troligen nära Argeș; Marko och Konstantin dödades. Slagets utgång är omstridd: kristna källor talar om en valakisk seger, osmanska om en egen, och många historiker om blodigt oavgjort. Bayezid insatte en rivaliserande furste, Vlad, men Mircea återtog snart sin tron."
On his way back Bayezid took Nicopolis, and Ivan Shishman was put to death, on 3 June 1395 according to a Bulgarian chronicle. The last Bulgarian ruler, Ivan Sratsimir of Vidin, joined King Sigismund’s crusade the next year and opened Vidin to the crusaders. After the Ottoman victory at Nicopolis on 25 September 1396, Bayezid marched on Vidin, took it and sent Sratsimir to prison in Bursa, where he probably died. His son Konstantin claimed the title of tsar in exile until 1422; Bulgaria remained under Ottoman rule until 1878.: På hemvägen intog Bayezid Nikopolis, och Ivan Sjisjman avrättades, enligt en bulgarisk krönika den 3 juni 1395. Den siste bulgariske härskaren, Ivan Sratsimir av Vidin, anslöt sig året därpå till kung Sigismunds korståg och öppnade Vidin för korsfararna. Efter den osmanska segern vid Nikopolis den 25 september 1396 tågade Bayezid mot Vidin, intog staden och sände Sratsimir i fängelse i Bursa, där han troligen dog. Hans son Konstantin gjorde anspråk på tsartiteln i exil fram till 1422; Bulgarien förblev under osmanskt styre till 1878.
Battle of Rovine: Slaget vid Rovine
17 May 1395 (some historians date it to October 1394); outcome disputed: 17 maj 1395 (vissa historiker daterar det till oktober 1394); utgången omstridd
Death of Ivan Shishman: Ivan Sjisjmans död
3 June 1395, by the main account: 3 juni 1395, enligt den främsta källan
Fall of Vidin: Vidins fall
17 May 1395: 17 maj 1395
The site is uncertain; most historians place it near the Argeș river. Both sides suffered heavily, and both claimed the victory.: Platsen är osäker; de flesta historiker förlägger den nära floden Argeș. Båda sidor led svåra förluster, och båda gjorde anspråk på segern.
Bayezid took the fortress by surprise from the north. Ivan Shishman was executed, or by some accounts died in prison.: Bayezid intog fästningen genom en överrumpling från norr. Ivan Sjisjman avrättades, eller dog enligt vissa uppgifter i fängelse.
25 September 1396: 25 september 1396
Bayezid destroyed the crusader army of Sigismund of Hungary and John of Nevers outside the town (see the crusade of Nicopolis).: Bayezid tillintetgjorde Sigismund av Ungerns och Johan av Nevers korsfararhär utanför staden (se korståget mot Nikopolis).
Ivan Sratsimir, who had sided with the crusaders, was deposed and taken to Bursa. It was the end of the Bulgarian state.: Ivan Sratsimir, som hade ställt sig på korsfararnas sida, avsattes och fördes till Bursa. Det var slutet för den bulgariska staten.
