Vlatko Vuković’s Bosnians caught the Ottoman raiders after days of looting in Hum, north-east of Ragusa. It was the first Ottoman defeat in Bosnian lands.: Vlatko Vukovićs bosnier hann upp de osmanska plundrarna efter flera dagars plundring i Hum, nordost om Ragusa. Det var det första osmanska nederlaget på bosnisk mark.
Shumen: Sjumen
