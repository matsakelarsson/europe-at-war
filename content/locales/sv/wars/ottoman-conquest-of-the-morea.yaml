Ottoman conquest of the Morea: Osmanernas erövring av Morea
The conquest of the Despotate of the Morea, the last Byzantine state in Greece, by Mehmed II. The despots Thomas and Demetrios Palaiologos, brothers of the last emperor, quarrelled constantly and neglected their tribute. In May 1458 Mehmed invaded, took the Acrocorinth after a siege and annexed the north of the peninsula, including Corinth and Patras, leaving the brothers the south as tributaries. When they went to war with each other again, Thomas seeking help from the West and Demetrios from the Ottomans, Mehmed returned in 1460. Demetrios surrendered Mystras on 29 May 1460 and went into Ottoman service; Thomas fled to Corfu and Rome. Castles such as Salmeniko held out until July 1461. Venice kept Modon, Coron, Nauplia and Argos, and Monemvasia placed itself under the pope and later Venice.: Mehmed II:s erövring av despotatet Morea, den sista bysantinska staten i Grekland. Despoterna Thomas och Demetrios Palaiologos, bröder till den siste kejsaren, grälade ständigt och försummade sin tribut. I maj 1458 anföll Mehmed, intog Akrokorinth efter en belägring och annekterade halvöns norra del, däribland Korinth och Patras, och lämnade södern åt bröderna som tributpliktiga. När de åter gick i krig mot varandra, Thomas med hjälp från väst och Demetrios från osmanerna, återvände Mehmed 1460. Demetrios överlämnade Mystras den 29 maj 1460 och gick i osmansk tjänst; Thomas flydde till Korfu och Rom. Borgar som Salmeniko höll stånd till juli 1461. Venedig behöll Modon, Coron, Nauplia och Argos, och Monemvasia ställde sig under påven och senare Venedig.
