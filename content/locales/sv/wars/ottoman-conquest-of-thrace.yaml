Ottoman conquest of Thrace: Osmanernas erövring av Thrakien
The Ottoman advance from a first foothold on the Gallipoli peninsula across the plains of Thrace. Turkish troops hired by John VI Kantakouzenos were given the fortress of Tzympe around 1352, and after an earthquake ruined Gallipoli in March 1354 Orhan’s son Süleyman occupied it and refused to leave. Within fifteen years Didymoteicho, Philippopolis and Adrianople had fallen, the last at a date that sources give between 1361 and 1369, and Adrianople became the Ottomans’ main base in Europe.: Osmanernas framryckning från ett första fotfäste på Gallipolihalvön över Thrakiens slätter. Turkiska trupper som legats av Johannes VI Kantakouzenos fick omkring 1352 fästningen Tzympe, och sedan en jordbävning förstört Gallipoli i mars 1354 besatte Orhans son Süleyman staden och vägrade lämna den. Inom femton år hade Didymoteicho, Philippopolis och Adrianopel fallit, den sistnämnda vid en tidpunkt som källorna anger till mellan 1361 och 1369, och Adrianopel blev osmanernas huvudbas i Europa.
