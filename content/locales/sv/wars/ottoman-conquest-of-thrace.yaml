Dates for the conquest of Thrace are very uncertain. Later Ottoman chronicles put the fall of Adrianople in 1361 or 1362; Byzantine sources studied by Elisabeth Zachariadou point to 1369, which most modern historians accept. Some of the conquests may have been made by independent bands of frontier warriors rather than by the Ottoman ruler’s own troops.: Dateringarna för erövringen av Thrakien är mycket osäkra. Senare osmanska krönikor förlägger Adrianopels fall till 1361 eller 1362; bysantinska källor som studerats av Elisabeth Zachariadou pekar på 1369, vilket de flesta moderna historiker godtar. En del av erövringarna kan ha gjorts av självständiga skaror av gränskrigare snarare än av den osmanske härskarens egna trupper.
Ottoman tradition tells of a great victory over a Serbian and Hungarian army near Adrianople, at Sırp Sındığı (“the rout of the Serbs”), in 1364; historians think the story may be a confused memory of the battle of the Maritsa in 1371, and it is not told here.: Osmansk tradition berättar om en stor seger över en serbisk och ungersk här nära Adrianopel, vid Sırp Sındığı (”serbernas nederlag”), 1364; historikerna anser att berättelsen kan vara ett förvirrat minne av slaget vid Maritsa 1371, och den återges inte här.
Savoyard moves: Savojiska trupprörelser
The Byzantine civil wars brought Turkish soldiers into Europe as allies of John VI Kantakouzenos, and their plundering of Thrace showed them its wealth. In about 1352, as a reward for help against John V and his Serbian allies, Kantakouzenos let Orhan’s son Süleyman Pasha garrison Tzympe, a small fortress on the Gallipoli peninsula. On 2 March 1354 a severe earthquake destroyed hundreds of villages and towns in the area. The walls of Gallipoli collapsed and its Greek inhabitants fled; within a month Süleyman occupied the town, repaired its defences and brought in Turkish settlers from Anatolia.: De bysantinska inbördeskrigen förde turkiska soldater till Europa som bundsförvanter till Johannes VI Kantakouzenos, och deras plundringar i Thrakien visade dem dess rikedom. Omkring 1352 lät Kantakouzenos, som belöning för hjälp mot Johannes V och dennes serbiska bundsförvanter, Orhans son Süleyman pasha lägga en garnison i Tzympe, en liten fästning på Gallipolihalvön. Den 2 mars 1354 förstörde en svår jordbävning hundratals byar och städer i området. Gallipolis murar rasade och dess grekiska invånare flydde; inom en månad besatte Süleyman staden, reparerade dess försvarsverk och förde dit turkiska nybyggare från Anatolien.
Kantakouzenos offered money to have it back, but Orhan replied that God had given him the town. Panic spread in Constantinople, and in November 1354 John V seized the city and Kantakouzenos abdicated and became a monk. From Gallipoli, the gateway between Asia and Europe, Süleyman’s men raided and settled the Thracian plain, taking towns such as Rodosto (Tekirdağ), Malkara and İpsala. Süleyman died in a hunting accident in 1357, and the advance slowed for a time when Orhan’s young son Halil was kidnapped by pirates and held at Phocaea until 1359.: Kantakouzenos erbjöd pengar för att få tillbaka staden, men Orhan svarade att Gud hade gett honom den. Panik spred sig i Konstantinopel, och i november 1354 tog Johannes V makten i staden medan Kantakouzenos abdikerade och blev munk. Från Gallipoli, porten mellan Asien och Europa, plundrade och koloniserade Süleymans män den thrakiska slätten och intog städer som Rodosto (Tekirdağ), Malkara och İpsala. Süleyman omkom i en jaktolycka 1357, och framryckningen avtog en tid när Orhans unge son Halil rövades bort av pirater och hölls fången i Fokaia fram till 1359.
