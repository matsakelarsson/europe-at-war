Ottoman raiders: Osmanska plundrare
Under Orhan’s son Murad I, who succeeded him in about 1362, Ottoman forces and independent frontier warriors pushed up the valley of the Maritsa. Didymoteicho fell in 1360 or 1361. Philippopolis, held by Bulgaria since 1344, was taken in about 1363 by Lala Şahin Pasha, Murad’s tutor and commander in Europe. Turkish settlers and nomads followed the soldiers onto the Thracian plain, and the Ottomans pushed towards the Rhodopes and the Balkan Mountains.: Under Orhans son Murad I, som efterträdde honom omkring 1362, trängde osmanska styrkor och självständiga gränskrigare uppför Maritsadalen. Didymoteichon föll 1360 eller 1361. Philippopolis, som Bulgarien hade innehaft sedan 1344, intogs omkring 1363 av Lala Şahin pasha, Murads lärare och befälhavare i Europa. Turkiska nybyggare och nomader följde soldaterna ut på den thrakiska slätten, och osmanerna trängde fram mot Rhodoperna och Balkanbergen.
In 1366 Count Amadeus VI of Savoy, the emperor’s cousin, led a small crusade that retook Gallipoli, but it was not enough to reverse the tide; Andronikos IV handed the town back to the Ottomans in 1376 or 1377 for their help in his own bid for the throne. Adrianople, the third city of the empire, surrendered after its ruler fled by boat; Ottoman tradition dates this to 1361–1362, Byzantine sources to 1369. Many of its people were carried off into captivity. Renamed Edirne, it became the Ottoman military centre in Europe and later the sultans’ capital.: År 1366 ledde greve Amadeus VI av Savojen, kejsarens kusin, ett litet korståg som återtog Gallipoli, men det räckte inte för att vända utvecklingen; Andronikos IV lämnade tillbaka staden till osmanerna 1376 eller 1377 som tack för deras hjälp i hans eget försök att ta tronen. Adrianopel, rikets tredje stad, kapitulerade sedan dess härskare flytt med båt; osmansk tradition daterar detta till 1361–1362, bysantinska källor till 1369. Många av invånarna fördes bort i fångenskap. Staden fick namnet Edirne och blev det osmanska militära centrumet i Europa och senare sultanernas huvudstad.
