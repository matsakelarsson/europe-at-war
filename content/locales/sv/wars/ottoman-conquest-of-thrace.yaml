The fortress town on the Evros, Kantakouzenos’s old base, was one of the first major towns in Thrace to fall.: Fästningsstaden vid Evros, Kantakouzenos’ gamla bas, var en av de första större städerna i Thrakien som föll.
The city surrendered after its governor escaped. As Edirne it became the chief Ottoman city in Europe.: Staden kapitulerade sedan dess ståthållare flytt. Som Edirne blev den den främsta osmanska staden i Europa.
Taken from the Bulgarians by Lala Şahin Pasha, opening the upper Maritsa valley to the Ottomans.: Intogs från bulgarerna av Lala Şahin pasha, vilket öppnade övre Maritsadalen för osmanerna.
