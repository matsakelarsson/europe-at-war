# Svenska översättningar av katalogtexten (våg 12); stegtexterna kommer senare.
Ottoman conquest of Tripoli: Osmanernas erövring av Tripoli
? The siege in which an Ottoman fleet took Tripoli from the Knights of St John (the Hospitallers) in August 1551. Spain had captured the city in 1510 and handed it to the Knights, with Malta and Gozo, in 1530. After a Spanish and Hospitaller force drove the corsair captain Turgut Reis (Dragut) out of Mahdia in 1550, Sultan Suleiman sent a fleet of about 145 ships with 10,000–12,000 soldiers under Sinan Pasha, with Turgut. It struck Malta first, landing on 18 July and failing before Mdina, then took the citadel of Gozo on 26 July and carried off some 5,000–7,000 of the island’s people into slavery. On 8 August it landed before Tripoli, joined by Murad Agha and the people of Tajura, who had resisted the Knights for years. The governor, Gaspard de Vallier, held only a few dozen knights and 500–600 soldiers, many of them Calabrian and Sicilian mercenaries who mutinied, and he surrendered on 14 August after six days of bombardment. The French ambassador to the Porte, Gabriel d’Aramon, who had come to dissuade the Ottomans, obtained the release of the knights and some others, who sailed to Malta; about 200 local auxiliaries of the Knights were executed and the rest of the garrison was enslaved. Sinan made Murad Agha governor; Turgut, who had hoped for the post, received it in the 1550s and made Tripoli a base for the corsairs and for the Ottoman fleet. Tripoli stayed Ottoman, directly or under the Karamanli dynasty (1711–1835), until the Italian invasion of 1911.
: Den belägring genom vilken en osmansk flotta i augusti 1551 tog Tripoli från johanniterorden. Spanien hade erövrat staden 1510 och 1530 överlämnat den till riddarna, tillsammans med Malta och Gozo. Sedan en spansk styrka och johanniterna 1550 hade drivit ut korsarkaptenen Turgut Reis (Dragut) ur Mahdia sände sultan Süleyman en flotta på omkring 145 fartyg med 10 000–12 000 soldater under Sinan pasha, med Turgut. Den slog först till mot Malta, landsteg den 18 juli och misslyckades framför Mdina, intog sedan citadellet på Gozo den 26 juli och förde bort omkring 5 000–7 000 av öns invånare som slavar. Den 8 augusti landsteg den framför Tripoli, förstärkt av Murad Agha och invånarna i Tajura, som i flera år hade gjort motstånd mot riddarna. Guvernören, Gaspard de Vallier, hade bara några dussin riddare och 500–600 soldater, många av dem kalabriska och sicilianska legosoldater som gjorde myteri, och han kapitulerade den 14 augusti efter sex dagars bombardemang. Frankrikes ambassadör vid Höga porten, Gabriel d’Aramon, som hade kommit för att avråda osmanerna, utverkade frigivning av riddarna och några andra, som seglade till Malta; omkring 200 lokala hjälptrupper i riddarnas tjänst avrättades och resten av garnisonen gjordes till slavar. Sinan utnämnde Murad Agha till guvernör; Turgut, som hade hoppats på posten, fick den på 1550-talet och gjorde Tripoli till en bas för korsarerna och den osmanska flottan. Tripoli förblev osmanskt, direkt eller under Karamanlidynastin (1711–1835), fram till den italienska invasionen 1911.
