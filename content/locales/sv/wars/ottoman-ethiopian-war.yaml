# Svenska översättningar av katalogtexten (våg 12); stegtexterna kommer senare.
Ottoman–Ethiopian border wars: Osmansk-etiopiska gränskrigen
Wars between the Ottoman Empire and the Ethiopian emperors for the Red Sea coast and the highlands behind it in the second half of the 16th century. To shut the Portuguese out of the Red Sea, the Ottomans proclaimed a province of Habesh and in 1557 sent Özdemir Pasha, who took Massawa, Arqiqo and Debarwa, the capital of the Bahr Negash, ruler of the coastal highlands of Medri Bahri. The Bahr Negash Yeshaq first fought the Ottomans with Emperor Gelawdewos, then rebelled against Emperor Minas and joined them, and with Ottoman musketeers defeated Minas in Enderta in 1562. Emperor Sarsa Dengel defeated Yeshaq and the Ottomans at Addi Qarro in 1578, killing both Yeshaq and the pasha, and destroyed the Ottoman fort at Debarwa; after a last Ottoman push inland he raided Arqiqo in 1589, and the two sides made peace. The Ottomans kept Massawa and the coast, soon governed for them by the local na’ibs, and gave up their ambitions in the highlands.: Krig mellan Osmanska riket och de etiopiska kejsarna om kusten vid Röda havet och höglandet bakom den under andra hälften av 1500-talet. För att stänga ute portugiserna från Röda havet utropade osmanerna en provins Habesh och sände 1557 Özdemir pasha, som intog Massawa, Arqiqo och Debarwa, huvudstad för bahr negash, härskaren över kusthöglandet Medri Bahri. Bahr negash Yeshaq stred först mot osmanerna tillsammans med kejsar Gelawdewos, gjorde sedan uppror mot kejsar Minas och gick över till dem, och med osmanska musketörer besegrade han Minas i Enderta 1562. Kejsar Sarsa Dengel besegrade Yeshaq och osmanerna vid Addi Qarro 1578, varvid både Yeshaq och pashan dödades, och förstörde det osmanska fortet i Debarwa; efter en sista osmansk stöt inåt landet gjorde han en räd mot Arqiqo 1589, och de två sidorna slöt fred. Osmanerna behöll Massawa och kusten, som snart styrdes för deras räkning av de lokala na’iberna, och gav upp sina ambitioner i höglandet.
