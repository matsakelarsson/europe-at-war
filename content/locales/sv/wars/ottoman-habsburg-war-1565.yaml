Dates are Julian. Sources differ by a day on the date of Suleiman’s death (5–7 September) and on the date of Zrinski’s last sortie (7 or 8 September 1566).: Datumen anges enligt den julianska kalendern. Källorna skiljer sig åt med en dag om datumet för Süleymans död (5–7 september) och om datumet för Zrinskis sista utfall (7 eller 8 september 1566).
Zrinski is a hero to both Croats and Hungarians, who know him as Nikola Šubić Zrinski and Zrínyi Miklós. His great-grandson, the poet and general Miklós Zrínyi, wrote the epic The Siege of Sziget about him, and Ivan Zajc’s opera Nikola Šubić Zrinski (1876) is one of the best known Croatian operas.: Zrinski är en hjälte för både kroater och ungrare, som känner honom som Nikola Šubić Zrinski och Zrínyi Miklós. Hans barnbarnsbarn, skalden och fältherren Miklós Zrínyi, skrev eposet Szigets belägring om honom, och Ivan Zajcs opera Nikola Šubić Zrinski (1876) är en av de mest kända kroatiska operorna.
After Ferdinand I died in 1564, fighting broke out over the borderlands between his son Maximilian II and John Sigismund of Transylvania, and in 1565 the imperial general Lazarus von Schwendi took Tokaj. Suleiman, over seventy and ill, set out on his last campaign in May 1566. He meant to attack Eger, but turned on Szigetvár after its captain, Nikola Zrinski, raided an Ottoman camp at Siklós. From 5 August the Ottoman army, led in practice by the grand vizier Sokollu Mehmed Pasha, besieged the fortress, held by Zrinski with about 2,300 Croatian and Hungarian soldiers. Further east Pertev Pasha took Gyula on 2 September.: Sedan Ferdinand I dött 1564 utbröt strider om gränsområdena mellan hans son Maximilian II och Johan Sigismund av Transsylvanien, och 1565 intog den kejserlige generalen Lazarus von Schwendi Tokaj. Süleyman, över sjuttio år och sjuk, gav sig i maj 1566 ut på sitt sista fälttåg. Han tänkte anfalla Eger men vände sig mot Szigetvár sedan dess kapten, Nikola Zrinski, överfallit ett osmanskt läger vid Siklós. Från den 5 augusti belägrade den osmanska hären, i praktiken ledd av storvesiren Sokollu Mehmed pasha, fästningen, som Zrinski försvarade med omkring 2 300 kroatiska och ungerska soldater. Längre österut intog Pertev pasha Gyula den 2 september.
The defenders lost the new town and the old town and withdrew into the castle, which mines and fire slowly destroyed. On 6 September Suleiman died in his tent; Sokollu kept his death secret for weeks so that the army would not break up. On 8 September, with the castle in flames, Zrinski led his last few hundred men out and was killed, and almost all of the garrison died; more than 20,000 Ottomans are thought to have died in the siege. Maximilian’s army lay at Győr and did not move. In February 1568 the Treaty of Adrianople made an eight-year truce, renewed for many years after.: Försvararna förlorade den nya staden och den gamla staden och drog sig tillbaka in i borgen, som minor och eld sakta förstörde. Den 6 september dog Süleyman i sitt tält; Sokollu höll hans död hemlig i flera veckor för att hären inte skulle upplösas. Den 8 september, med borgen i lågor, ledde Zrinski sina sista få hundra man ut och stupade, och nästan hela garnisonen dog; mer än 20 000 osmaner tros ha omkommit under belägringen. Maximilians här låg vid Győr och rörde sig inte. I februari 1568 slöts genom freden i Adrianopel ett åttaårigt stillestånd, som förnyades i många år därefter.
