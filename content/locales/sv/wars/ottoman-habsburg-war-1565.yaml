Zrinski and his last men died in a sortie from the burning castle. Suleiman had died two days earlier in his camp nearby.: Zrinski och hans sista män stupade under ett utfall från den brinnande borgen. Süleyman hade dött två dagar tidigare i sitt läger i närheten.
2 September 1566: 2 september 1566
After a siege of 63 days, Pertev Pasha’s army of some 30,000 forced László Kerecsényi’s garrison of about 2,000 to surrender.: Efter en belägring på 63 dagar tvingade Pertev pashas här på omkring 30 000 man László Kerecsényis garnison på omkring 2 000 att kapitulera.
