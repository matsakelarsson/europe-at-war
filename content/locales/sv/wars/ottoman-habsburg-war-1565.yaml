Ottoman–Habsburg War (1565–1568): Osmansk-habsburgska kriget (1565–1568)
A short war between the Habsburg emperor Maximilian II and the Ottoman Empire, allied with John Sigismund of Transylvania. Suleiman the Magnificent led his last campaign in 1566 and died in his tent during the siege of Szigetvár, whose defender, Nikola Zrinski, fell in a final sortie; the Ottomans also took Gyula. The Treaty of Adrianople of 1568 began a quarter of a century of uneasy peace in Hungary.: Ett kort krig mellan den habsburgske kejsaren Maximilian II och Osmanska riket, allierat med Johan Sigismund av Transsylvanien. Süleyman den store ledde sitt sista fälttåg 1566 och dog i sitt tält under belägringen av Szigetvár, vars försvarare Nikola Zrinski stupade i ett sista utfall; osmanerna intog också Gyula. Freden i Adrianopel 1568 inledde ett kvartssekel av osäker fred i Ungern.
