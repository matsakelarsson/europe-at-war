Fighting went on along a frontier of castles. The Ottomans took Fülek in 1554 and made it the seat of a sanjak. In 1556, with Castaldo’s unpaid troops gone, the Transylvanian estates called back Isabella and John Sigismund, who ruled again as Ottoman vassals. That summer the governor of Buda besieged Szigetvár; Nikola Zrinski, ban of Croatia, attacked the nearby Ottoman fort of Babócsa, beat the pasha’s army when it came to its rescue, and the siege was given up.: Striderna fortsatte längs en gräns av borgar. Osmanerna intog Fülek 1554 och gjorde den till säte för ett sandjak. År 1556, sedan Castaldos obetalda trupper försvunnit, kallade de transsylvanska ständerna tillbaka Isabella och Johan Sigismund, som åter regerade som osmanska vasaller. Samma sommar belägrade ståthållaren i Buda Szigetvár; Nikola Zrinski, ban av Kroatien, anföll det närbelägna osmanska fortet Babócsa och slog pashans här när den kom till undsättning, och belägringen avbröts.
Suleiman, busy with Persia and with a struggle between his sons, wanted peace, and Ferdinand, emperor since his brother Charles V had abdicated, could not afford war. His envoy in Constantinople, the Flemish scholar Ogier Ghiselin de Busbecq, spent years negotiating. In 1562, after an Ottoman victory at Szécsény in March, a truce of eight years was agreed. The Ottomans kept their conquests, and Ferdinand went on paying 30,000 florins a year for his part of Hungary.: Süleyman, upptagen av Persien och av en maktkamp mellan sina söner, ville ha fred, och Ferdinand, kejsare sedan hans bror Karl V abdikerat, hade inte råd med krig. Hans sändebud i Konstantinopel, den flamländske lärde Ogier Ghiselin de Busbecq, förhandlade i flera år. År 1562, efter en osmansk seger vid Szécsény i mars, kom man överens om ett åttaårigt stillestånd. Osmanerna behöll sina erövringar, och Ferdinand fortsatte att betala 30 000 floriner om året för sin del av Ungern.
