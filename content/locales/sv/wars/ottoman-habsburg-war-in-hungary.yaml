Ottoman–Habsburg War in Hungary (1551–1562): Osmansk-habsburgska kriget i Ungern (1551–1562)
The war that followed Ferdinand I’s attempt to take over Transylvania in 1551. The Ottomans answered in 1552 by taking Temesvár, Szolnok and many castles, founding a new province in the Banat, but were held at Eger by István Dobó’s small garrison. Transylvania returned to John Sigismund Zápolya under Ottoman protection in 1556, and after years of border fighting a truce of 1562 confirmed the Ottoman gains.: Kriget som följde på Ferdinand I:s försök att ta över Transsylvanien 1551. Osmanerna svarade 1552 med att inta Temesvár, Szolnok och många borgar och grundade en ny provins i Banatet, men hejdades vid Eger av István Dobós lilla garnison. Transsylvanien återgick 1556 till Johan Sigismund Zápolya under osmanskt beskydd, och efter år av gränsstrider bekräftade ett stillestånd 1562 de osmanska vinsterna.
