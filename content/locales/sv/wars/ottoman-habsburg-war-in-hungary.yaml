Dates are Julian. Hungarian historians often treat these years as the last phase of the wars of 1526–1568 for the Hungarian crown.: Datumen anges enligt den julianska kalendern. Ungerska historiker behandlar ofta dessa år som den sista fasen av krigen 1526–1568 om den ungerska kronan.
The defence of Eger is the subject of Géza Gárdonyi’s novel Egri csillagok (1901, in English Eclipse of the Crescent Moon), one of the best-loved books in Hungary.: Försvaret av Eger är ämnet för Géza Gárdonyis roman Egri csillagok (1901, på engelska Eclipse of the Crescent Moon), en av de mest älskade böckerna i Ungern.
In 1551 the monk George Martinuzzi, who governed Transylvania for the young John Sigismund, persuaded Queen Isabella to hand the eastern kingdom and the Holy Crown to Ferdinand I, and imperial troops under Giovanni Battista Castaldo moved in. Martinuzzi, now a cardinal, went on negotiating with the Ottomans, and on 17 December 1551 Castaldo’s men murdered him at Alvinc, with Ferdinand’s consent. In 1552 two Ottoman armies invaded. Hadım Ali Pasha, governor of Buda, took Veszprém and Drégely, whose captain György Szondi died rather than surrender, while Kara Ahmed Pasha took Temesvár on 27 July and killed most of its garrison as it marched out, its commander István Losonczy among them.: År 1551 övertalade munken Georg Martinuzzi, som styrde Transsylvanien för den unge Johan Sigismund, drottning Isabella att överlämna det östra kungariket och den heliga kronan till Ferdinand I, och kejserliga trupper under Giovanni Battista Castaldo ryckte in. Martinuzzi, som nu var kardinal, fortsatte att förhandla med osmanerna, och den 17 december 1551 mördade Castaldos män honom i Alvinc med Ferdinands samtycke. År 1552 föll två osmanska härar in. Hadım Ali pasha, ståthållare i Buda, intog Veszprém och Drégely, vars kapten György Szondi hellre dog än kapitulerade, medan Kara Ahmed pasha intog Temesvár den 27 juli och dödade större delen av garnisonen när den tågade ut, bland dem dess befälhavare István Losonczy.
Lippa and Szolnok fell too, and the two armies, perhaps 35,000–40,000 strong, joined to besiege Eger in September. Its captain, István Dobó, had about 2,000 defenders, soldiers, peasants and townspeople, women among them. For five weeks they repaired the walls by night and threw back five great assaults, and on 18 October the Ottomans withdrew. The defence became a Hungarian legend. Still, the campaign had won the Ottomans the Banat, which became the province of Temesvár, and dozens of castles in northern Hungary.: Även Lippa och Szolnok föll, och de två härarna, kanske 35 000–40 000 man starka, förenades för att belägra Eger i september. Dess kapten, István Dobó, hade omkring 2 000 försvarare – soldater, bönder och stadsbor, bland dem kvinnor. I fem veckor lagade de murarna om nätterna och slog tillbaka fem stora stormningar, och den 18 oktober drog sig osmanerna tillbaka. Försvaret blev en ungersk legend. Fälttåget hade ändå gett osmanerna Banatet, som blev provinsen Temesvár, och dussintals borgar i norra Ungern.
