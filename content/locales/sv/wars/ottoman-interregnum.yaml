After Ankara, Bayezid’s eldest son Süleyman held the European provinces from Edirne. To win friends he signed the Treaty of Gallipoli early in 1403 with Byzantium, Venice, Genoa, the Knights of Rhodes and the Duke of Naxos, returning Thessalonica and part of the Black Sea and Marmara coasts to the emperor. In Anatolia, İsa took Bursa and Mehmed ruled from Amasya. In 1403 Mehmed beat İsa at Ulubad and took Bursa; İsa fled and was later killed by Mehmed’s agents. Süleyman then crossed into Anatolia, took Bursa and Ankara in 1404, and for some years held Mehmed in check.: Efter Ankara innehade Bayezids äldste son Süleyman de europeiska provinserna från Edirne. För att vinna vänner undertecknade han i början av 1403 fördraget i Gallipoli med Bysans, Venedig, Genua, johanniterna på Rhodos och hertigen av Naxos, varigenom Thessalonike och delar av Svarta havets och Marmarasjöns kuster återlämnades till kejsaren. I Anatolien intog İsa Bursa medan Mehmed härskade från Amasya. År 1403 slog Mehmed İsa vid Ulubad och intog Bursa; İsa flydde och dödades senare av Mehmeds agenter. Süleyman gick därefter över till Anatolien, intog Bursa och Ankara 1404 och höll under några år Mehmed i schack.
Mehmed sent their brother Musa, released from Timurid captivity, across the Black Sea to attack Süleyman’s European lands with the help of Mircea of Wallachia. Süleyman returned to Thrace and beat Musa on 15 June 1410 at Kosmidion, just outside the walls of Constantinople, but by the chroniclers’ account his idleness and drinking cost him support. In February 1411 his army went over to Musa at Edirne, and Süleyman was caught and strangled on 17 February. Musa now ruled the Ottoman Balkans and turned on Süleyman’s allies, besieging Constantinople and attacking Serbia and Thessalonica.: Mehmed sände deras bror Musa, som släppts ur timuridisk fångenskap, över Svarta havet för att med hjälp av Mircea av Valakiet anfalla Süleymans europeiska besittningar. Süleyman återvände till Thrakien och slog Musa den 15 juni 1410 vid Kosmidion, strax utanför Konstantinopels murar, men enligt krönikörerna kostade hans lättja och drickande honom stöd. I februari 1411 gick hans här över till Musa vid Edirne, och Süleyman greps och ströps den 17 februari. Musa härskade nu över det osmanska Balkan och vände sig mot Süleymans bundsförvanter, belägrade Konstantinopel och anföll Serbien och Thessalonike.
