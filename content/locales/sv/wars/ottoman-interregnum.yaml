Musa’s attacks drove his enemies together. Emperor Manuel II called on Mehmed, whose troops crossed to defend Constantinople; after failed sorties and a revolt at home Mehmed had to withdraw, but in 1413 he crossed again with Byzantine help and joined forces with the Serbian despot Stefan Lazarević, whose lands Musa had ravaged. Many of Musa’s commanders in the Balkans, alienated by his harsh rule, went over to Mehmed.: Musas angrepp förde hans fiender samman. Kejsar Manuel II vädjade till Mehmed, vars trupper gick över för att försvara Konstantinopel; efter misslyckade utfall och ett uppror på hemmaplan måste Mehmed dra sig tillbaka, men 1413 gick han åter över med bysantinsk hjälp och förenade sina styrkor med den serbiske despoten Stefan Lazarević, vars land Musa hade härjat. Många av Musas befälhavare på Balkan, som stötts bort av hans hårda styre, gick över till Mehmed.
On 5 July 1413 the armies met at Çamurlu, near Samokov in the mountains of western Bulgaria. Hasan, aga of Mehmed’s janissaries, rode out to urge Musa’s men to change sides; Musa cut him down but was wounded by one of Hasan’s companions. Musa’s men fought well, but Mehmed won, and Musa fled and was caught and strangled. Mehmed, now sole sultan, kept peace with Byzantium and Serbia and spent his eight-year reign restoring Ottoman rule in Anatolia and the Balkans.: Den 5 juli 1413 möttes härarna vid Çamurlu, nära Samokov i bergen i västra Bulgarien. Hasan, aga för Mehmeds janitsjarer, red fram för att uppmana Musas män att byta sida; Musa högg ned honom men sårades av en av Hasans följeslagare. Musas män stred väl, men Mehmed segrade, och Musa flydde och greps och ströps. Mehmed, nu ensam sultan, höll fred med Bysans och Serbien och ägnade sina åtta år som härskare åt att återupprätta det osmanska styret i Anatolien och på Balkan.
