Ottoman Interregnum: Osmanska interregnumet
The civil war among the sons of Bayezid I after his defeat and capture by Timur at Ankara. Süleyman ruled the European provinces from Edirne, while İsa held Bursa and Mehmed Amasya; Mehmed defeated İsa, and their brother Musa, sent by Mehmed into the Balkans, overthrew and killed Süleyman in 1411. Allied with the Byzantine emperor and the Serbian despot, Mehmed finally defeated Musa at Çamurlu in 1413 and reunited the Ottoman state as Mehmed I.: Inbördeskriget mellan Bayezid I:s söner efter att han besegrats och tillfångatagits av Timur vid Ankara. Süleyman styrde de europeiska provinserna från Edirne, medan İsa höll Bursa och Mehmed Amasya; Mehmed besegrade İsa, och deras bror Musa, som Mehmed sänt till Balkan, störtade och dödade Süleyman 1411. I allians med den bysantinske kejsaren och den serbiske despoten besegrade Mehmed slutligen Musa vid Çamurlu 1413 och återförenade den osmanska staten som Mehmed I.
