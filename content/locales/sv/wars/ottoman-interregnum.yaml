Ottoman chronicles written later, under Mehmed’s descendants, present him as the rightful heir; only he called himself sultan on his coins during the civil war. Many dates are uncertain. A fifth brother, Mustafa, who had been captured at Ankara, reappeared in 1416 and again in 1421–1422 to challenge Mehmed and his son Murad II.: Osmanska krönikor som skrevs senare, under Mehmeds ättlingar, framställer honom som den rättmätige arvingen; bara han kallade sig sultan på sina mynt under inbördeskriget. Många datum är osäkra. En femte bror, Mustafa, som hade tillfångatagits vid Ankara, dök upp igen 1416 och åter 1421–1422 för att utmana Mehmed och dennes son Murad II.
The Christian neighbours changed sides as suited them. Byzantium, Venice and Genoa backed Süleyman, who gave back Thessalonica and other places in the Treaty of Gallipoli of 1403. Mircea of Wallachia and, by most accounts, the Serbian despot Stefan Lazarević backed Musa against him, but when Musa turned on his former allies, Stefan and Manuel II helped Mehmed defeat him.: De kristna grannarna bytte sida när det passade dem. Bysans, Venedig och Genua stödde Süleyman, som återlämnade Thessalonike och andra platser genom fördraget i Gallipoli 1403. Mircea av Valakiet och, enligt de flesta källor, den serbiske despoten Stefan Lazarević stödde Musa mot honom, men när Musa vände sig mot sina tidigare bundsförvanter hjälpte Stefan och Manuel II Mehmed att besegra honom.
