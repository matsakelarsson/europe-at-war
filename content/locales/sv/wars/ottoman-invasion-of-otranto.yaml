The traditional account, followed by the Church, says that on 14 August 1480 about 800 men of Otranto were beheaded on a nearby hill for refusing to give up their faith; they were canonised in 2013. Some modern historians question the religious motive and the larger figures given for the population and the dead, such as 12,000 killed out of 22,000, which are much exaggerated.: Enligt den traditionella berättelsen, som kyrkan följer, halshöggs omkring 800 män från Otranto den 14 augusti 1480 på en närbelägen kulle för att de vägrade att avsvärja sin tro; de helgonförklarades 2013. Vissa moderna historiker ifrågasätter det religiösa motivet och de högre siffror som anges för befolkningen och de döda, som 12 000 dödade av 22 000, vilka är kraftigt överdrivna.
Some contemporaries suspected that Venice, then at peace with the Ottomans, had encouraged the attack on its rival Naples; this has never been proved.: Vissa samtida misstänkte att Venedig, som då levde i fred med osmanerna, hade uppmuntrat angreppet på sin rival Neapel; detta har aldrig bevisats.
In the summer of 1480 Gedik Ahmed Pasha, who had just taken the Ionian islands, gathered a fleet at Vlorë and crossed the strait of Otranto. He had meant to land near Brindisi but turned south, and on 28 July his army came ashore near Otranto, the easternmost town of the Kingdom of Naples. The town was bombarded, and on 11 August it was stormed. Many of its people were killed or enslaved, and on 14 August, according to tradition, some 800 men who refused to convert were beheaded. Ottoman raiders rode towards Lecce, Brindisi and Taranto.: Sommaren 1480 samlade Gedik Ahmed pasha, som just hade erövrat de joniska öarna, en flotta i Vlorë och gick över Otrantosundet. Han hade tänkt landstiga nära Brindisi men vek av söderut, och den 28 juli gick hans här i land nära Otranto, den östligaste staden i kungariket Neapel. Staden beskjöts, och den 11 augusti stormades den. Många av invånarna dödades eller förslavades, och den 14 augusti halshöggs enligt traditionen omkring 800 män som vägrade att konvertera. Osmanska ryttare plundrade mot Lecce, Brindisi och Taranto.
King Ferdinand of Naples recalled his son Alfonso, Duke of Calabria, from Tuscany, and Pope Sixtus IV called for a league of the Italian states; Hungary sent troops, but Venice stayed out. Over the winter the Ottomans held the town while Gedik Ahmed went back to Albania for reinforcements. The news that Mehmed II had died on 3 May 1481 ended any hope of relief, and the Neapolitan and Hungarian besiegers tightened their grip. On 10 September 1481 the garrison surrendered, and the threat of an Ottoman invasion of Italy passed for a generation.: Kung Ferdinand av Neapel kallade hem sin son Alfonso, hertig av Kalabrien, från Toscana, och påven Sixtus IV uppmanade de italienska staterna att bilda ett förbund; Ungern sände trupper, men Venedig höll sig utanför. Under vintern höll osmanerna staden medan Gedik Ahmed reste tillbaka till Albanien efter förstärkningar. Beskedet att Mehmed II hade dött den 3 maj 1481 gjorde slut på allt hopp om undsättning, och de neapolitanska och ungerska belägrarna drog åt greppet. Den 10 september 1481 kapitulerade garnisonen, och hotet om en osmansk invasion av Italien var undanröjt för en generation.
