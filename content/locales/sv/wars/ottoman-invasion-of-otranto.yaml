Ottoman invasion of Otranto: Osmanernas invasion av Otranto
The Ottoman landing in southern Italy in 1480, when Gedik Ahmed Pasha crossed from Albania and stormed the Neapolitan port of Otranto. The capture, and the killing of many of its people, caused panic in Italy and led the pope to call the Italian states and Hungary to its defence. After Mehmed II’s death in May 1481 the isolated garrison surrendered to Alfonso of Calabria in September.: Den osmanska landstigningen i södra Italien 1480, då Gedik Ahmed pasha gick över från Albanien och stormade den neapolitanska hamnstaden Otranto. Erövringen, och dödandet av många av dess invånare, väckte panik i Italien och fick påven att kalla de italienska staterna och Ungern till dess försvar. Efter Mehmed II:s död i maj 1481 kapitulerade den isolerade garnisonen för Alfonso av Kalabrien i september.
