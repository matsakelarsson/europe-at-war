Dates are Julian. Some sources date the battle of Ridaniya to 24 January 1517 rather than 22 January, and Tuman Bay’s execution to 13 or 15 April; some place the battle of Khan Yunis in December 1516.: Datumen anges enligt den julianska kalendern. Vissa källor daterar slaget vid Ridaniya till 24 januari 1517 i stället för 22 januari, och Tuman Bays avrättning till 13 eller 15 april; vissa förlägger slaget vid Khan Yunis till december 1516.
A later story held that the last Abbasid caliph, whom Selim took to Constantinople, formally handed the caliphate to the Ottoman sultans. Historians regard this as a legend from the 18th century, though the conquest did make the Ottoman sultan the guardian of the holy cities.: Enligt en senare berättelse överlämnade den siste abbasidiske kalifen, som Selim förde till Konstantinopel, formellt kalifatet till de osmanska sultanerna. Historikerna betraktar detta som en legend från 1700-talet, även om erövringen gjorde den osmanske sultanen till de heliga städernas beskyddare.
After Chaldiran, the Mamluk Sultanate, which ruled Egypt, Syria and the Hejaz, stood between the Ottomans and their Safavid enemy, and the two had long quarrelled over the Turkmen beyliks between them. In the summer of 1516 the old sultan Qansuh al-Ghawri marched north to Aleppo with his Mamluk cavalry. Selim I, who had set out as if against Persia, turned south. On 24 August the armies met on the plain of Marj Dabiq, north of Aleppo. The Mamluk right drove back the Ottoman wing, but the governor of Aleppo, Khayr Bey, who had secretly gone over to Selim, left the field with the left wing, and the Ottoman guns broke the rest.: Efter Chaldiran stod det mamlukiska sultanatet, som härskade över Egypten, Syrien och Hijaz, mellan osmanerna och deras safavidiska fiende, och de två hade länge tvistat om de turkmenska furstendömena mellan dem. Sommaren 1516 tågade den gamle sultanen Qansuh al-Ghawri norrut till Aleppo med sitt mamlukiska kavalleri. Selim I, som hade brutit upp som om det gällde Persien, vände söderut. Den 24 augusti möttes härarna på slätten vid Marj Dabiq, norr om Aleppo. Den mamlukiska högerflygeln drev tillbaka den osmanska flygeln, men ståthållaren i Aleppo, Khayr Bey, som i hemlighet hade gått över till Selim, lämnade slagfältet med vänsterflygeln, och de osmanska kanonerna krossade resten.
Al-Ghawri died on the battlefield, perhaps of a stroke. Aleppo opened its gates to Selim, and the Abbasid caliph, who had come with the Mamluk army, fell into his hands. Damascus surrendered in October without a fight, and Tripoli, Beirut and Jerusalem followed. In Cairo the Mamluks chose Tuman Bay as their sultan, but on 28 October the Ottoman vizier Hadım Sinan Pasha defeated a Mamluk army at Khan Yunis near Gaza, opening the road to Egypt.: Al-Ghawri dog på slagfältet, kanske av ett slaganfall. Aleppo öppnade sina portar för Selim, och den abbasidiske kalifen, som hade följt med den mamlukiska hären, föll i hans händer. Damaskus kapitulerade i oktober utan strid, och Tripoli, Beirut och Jerusalem följde. I Kairo valde mamlukerna Tuman Bay till sultan, men den 28 oktober besegrade den osmanske vesiren Hadım Sinan pasha en mamlukisk här vid Khan Yunis nära Gaza, vilket öppnade vägen till Egypten.
