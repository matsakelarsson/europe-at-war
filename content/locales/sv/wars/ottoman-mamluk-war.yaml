Ottoman–Mamluk War: Osmansk-mamlukiska kriget
The war in which Sultan Selim I destroyed the Mamluk Sultanate of Egypt and Syria. The Ottomans won at Marj Dabiq near Aleppo in August 1516, where the Mamluk sultan Qansuh al-Ghawri died, took Syria and Palestine, crossed the Sinai and beat the last Mamluk sultan, Tuman Bay, at Ridaniya outside Cairo in January 1517. Egypt, Syria and the protection of Mecca and Medina passed to the Ottoman Empire.: Kriget i vilket sultan Selim I krossade mamluksultanatet i Egypten och Syrien. Osmanerna segrade vid Marj Dabiq nära Aleppo i augusti 1516, där mamluksultanen Qansuh al-Ghawri dog, intog Syrien och Palestina, korsade Sinai och besegrade den siste mamluksultanen, Tuman Bay, vid Ridaniya utanför Kairo i januari 1517. Egypten, Syrien och beskyddet över Mecka och Medina övergick till Osmanska riket.
