In January 1517 Selim crossed the Sinai desert, with water carried by camels. Tuman Bay had dug in at Ridaniya on the edge of Cairo with guns and fresh recruits, but on 22 January the Ottomans went round his position and attacked it from the flank and rear, and his army broke. Hadım Sinan Pasha was among the Ottoman dead. Ottoman troops entered Cairo, and for days there was fighting in the streets as Tuman Bay’s men attacked them by night; many of the city’s people were killed.: I januari 1517 korsade Selim Sinaiöknen, med vatten som bars av kameler. Tuman Bay hade grävt in sig vid Ridaniya i utkanten av Kairo med kanoner och nyrekryterade, men den 22 januari gick osmanerna runt hans ställning och anföll den från flanken och bakifrån, och hans här bröts. Hadım Sinan pasha var bland de osmanska döda. Osmanska trupper ryckte in i Kairo, och i flera dagar pågick gatustrider när Tuman Bays män anföll dem nattetid; många av stadens invånare dödades.
Tuman Bay kept up the fight from the countryside with Bedouin help until he was betrayed and captured. On 15 April he was hanged at Bab Zuwayla, one of Cairo’s gates. Egypt became an Ottoman province, governed at first by Khayr Bey, and the sharif of Mecca sent his submission, making the sultan protector of the holy cities. Selim returned home with the caliph and with many of Cairo’s craftsmen and scholars, having nearly doubled the size of his empire.: Tuman Bay fortsatte kampen från landsbygden med beduinernas hjälp tills han förråddes och tillfångatogs. Den 15 april hängdes han vid Bab Zuwayla, en av Kairos portar. Egypten blev en osmansk provins, till en början styrd av Khayr Bey, och sharifen av Mecka sände sin underkastelse, vilket gjorde sultanen till de heliga städernas beskyddare. Selim återvände hem med kalifen och med många av Kairos hantverkare och lärde, sedan han nästan fördubblat sitt rikes storlek.
