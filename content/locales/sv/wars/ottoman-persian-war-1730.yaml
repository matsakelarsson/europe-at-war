# Svenska översättningar av katalogtexten (våg 7); stegtexterna kommer senare.
Ottoman–Persian War (1730–1735): Osmansk-persiska kriget (1730–1735)
The war in which Nader, the general of the restored Safavid shah Tahmasp II, won back the lands the Ottomans had taken from Persia during the Afghan invasion. In 1730 he cleared western Iran and Azerbaijan, but while he was fighting the Abdali Afghans in the east, Tahmasp lost a campaign and gave up the Caucasus in a treaty, and Nader deposed him in 1732. Nader besieged Baghdad in 1733 and suffered his only defeat in battle against Topal Osman Pasha, then defeated and killed him at Kirkuk. In 1735 his victory at Yeghevard won back Armenia and Georgia, and the Treaty of Constantinople (1736) restored the frontier of 1639.: Kriget där Nader, general hos den återinsatte safavidiske shahen Tahmasp II, återvann de områden som osmanerna hade tagit från Persien under den afghanska invasionen. År 1730 drev han ut osmanerna ur västra Iran och Azerbajdzjan, men medan han stred mot Abdali-afghanerna i öster förlorade Tahmasp ett fälttåg och avstod Kaukasus i ett fördrag, och Nader avsatte honom 1732. Nader belägrade Bagdad 1733 och led sitt enda nederlag i fältslag mot Topal Osman pasha, men besegrade och dödade honom sedan vid Kirkuk. År 1735 återvann han genom segern vid Yeghevard Armenien och Georgien, och fördraget i Konstantinopel (1736) återställde gränsen från 1639.
