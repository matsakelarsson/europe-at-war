# Svenska översättningar av katalogtexten (våg 7); stegtexterna kommer senare.
Ottoman–Persian War (1743–1746): Osmansk-persiska kriget (1743–1746)
Nader Shah’s last war, fought to win Iraq from the Ottomans and to force them to recognise Persia’s Ja‘fari form of Shi‘ism as a fifth school of Islam. In 1743 his army took Kirkuk and Erbil and besieged Mosul from 14 September, killing many Yazidis in the countryside, but the city held out for 40 days under its governor Hajji Husayn al-Jalili, and Nader withdrew as revolts against his taxes spread in Persia. His siege of Kars in 1744 also failed. In August 1745 he destroyed an Ottoman army near Kars, but his own country was in revolt. By the Treaty of Kerden, signed near Qazvin on 4 September 1746, the frontier of the Treaty of Zuhab (1639) was restored, Nader dropped the Ja‘fari demand, and the Ottomans recognised his dynasty and promised to protect Persian pilgrims. Nader was assassinated the following year.: Nader Shahs sista krig, fört för att vinna Irak från osmanerna och tvinga dem att erkänna Persiens ja‘faritiska form av shiaislam som en femte rättsskola inom islam. År 1743 intog hans här Kirkuk och Erbil och belägrade Mosul från den 14 september och dödade då många yazidier på landsbygden, men staden höll stånd i 40 dagar under sin guvernör Hajji Husayn al-Jalili, och Nader drog sig tillbaka när uppror mot hans skatter spred sig i Persien. Hans belägring av Kars 1744 misslyckades också. I augusti 1745 förintade han en osmansk här nära Kars, men hans eget land var i uppror. Genom fördraget i Kerden, undertecknat nära Qazvin den 4 september 1746, återställdes gränsen från fördraget i Zuhab (1639), Nader släppte det ja‘faritiska kravet, och osmanerna erkände hans dynasti och lovade att skydda persiska pilgrimer. Nader mördades året därpå.
