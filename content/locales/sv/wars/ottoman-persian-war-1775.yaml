# Svenska översättningar av katalogtexten (våg 7); stegtexterna kommer senare.
Ottoman–Persian War of 1775–1779: Osmansk-persiska kriget 1775–1779
? A war between Zand Iran under Karim Khan and the Ottoman Empire, whose province of Iraq was ruled by Mamluk pashas in Baghdad. Karim Khan’s grievances were the pasha’s treatment of Iranian pilgrims to the Shia shrines of Najaf and Karbala, his interference in the Kurdish emirate of Baban, and the trade of Basra, which had drawn the East India Company away from Iran’s port of Bushehr. After a Zand force was beaten in Kurdistan in 1774, Karim Khan’s brother Sadeq Khan crossed the Shatt al-Arab with about 30,000 men and besieged Basra from 6 April 1775. The garrison under Sulayman Agha held out for a year, helped for a time by an Omani fleet, until hunger forced it to surrender in April 1776 (on 16 or 20 April, by different accounts). Fighting went on in Kurdistan, where an Ottoman–Baban army defeated the Zands at Marivan in 1777. Basra stayed under Zand rule until Karim Khan’s death in 1779, when its garrison withdrew and Sulayman Agha, released from Shiraz, went on to rule Baghdad as Büyük Süleyman Pasha. The borders of the Treaty of Zuhab (1639) were left unchanged; Basra never fully recovered.
: Ett krig mellan Zandernas Iran under Karim Khan och Osmanska riket, vars provins Irak styrdes av mamlukpashor i Bagdad. Karim Khans klagomål gällde pashans behandling av iranska pilgrimer till de shiitiska helgedomarna i Najaf och Karbala, hans inblandning i det kurdiska emiratet Baban och handeln i Basra, som hade dragit Ostindiska kompaniet bort från Irans hamn Bushehr. Sedan en zandstyrka slagits i Kurdistan 1774 gick Karim Khans bror Sadeq Khan över Shatt al-Arab med omkring 30 000 man och belägrade Basra från den 6 april 1775. Garnisonen under Sulayman Agha höll ut i ett år, en tid med hjälp av en omansk flotta, tills svälten tvingade den att kapitulera i april 1776 (den 16 eller den 20 april, enligt olika uppgifter). Striderna fortsatte i Kurdistan, där en osmansk-babansk armé besegrade zanderna vid Marivan 1777. Basra förblev under zandstyre till Karim Khans död 1779, då garnisonen drog sig tillbaka och Sulayman Agha, som släppts från Shiraz, sedan kom att styra Bagdad som Büyük Süleyman pasha. Gränserna från fördraget i Zuhab (1639) lämnades oförändrade; Basra återhämtade sig aldrig helt.
