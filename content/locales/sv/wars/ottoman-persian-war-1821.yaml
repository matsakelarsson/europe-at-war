Ottoman–Persian War of 1821–1823: Osmansk-persiska kriget 1821–1823
? The last war between the Ottoman Empire and Iran. Border tribes such as the Kurdish Haydaranlu and Sipki had crossed into Ottoman territory and been given refuge, Iranian pilgrims complained of mistreatment, and the two sides competed for influence over the Kurdish emirate of Baban; after clashes in 1820, Russia, at odds with the Ottomans over the Greek revolt, encouraged Iran to fight. In the autumn of 1821 Crown Prince Abbas Mirza, governor of Azerbaijan, invaded eastern Anatolia from Tabriz and took Bayazid and Toprakkale, while his elder half-brother Mohammad Ali Mirza, governor of Kermanshah, overran Shahrizor, defeated the army of Dawud Pasha of Baghdad and advanced on Baghdad, until cholera broke out in his army and he died of it in November 1821. Abbas Mirza defeated a larger Ottoman army near Toprakkale in May 1822, but cholera and the lack of money stopped both sides. The Treaty of Erzurum of 28 July 1823 restored the frontier of the Treaty of Zuhab (1639), with no change of territory, and promised Iranian pilgrims protection.
: Det sista kriget mellan Osmanska riket och Iran. Gränsstammar som kurdiska haydaranlu och sipki hade gått över till osmanskt territorium och fått skydd där, iranska pilgrimer klagade över dålig behandling, och de båda sidorna tävlade om inflytande över det kurdiska emiratet Baban; efter sammandrabbningar 1820 uppmuntrade Ryssland, som låg i konflikt med osmanerna om det grekiska upproret, Iran att gå i krig. Hösten 1821 invaderade kronprinsen Abbas Mirza, guvernör över Azerbajdzjan, östra Anatolien från Tabriz och intog Bayazid och Toprakkale, medan hans äldre halvbror Mohammad Ali Mirza, guvernör över Kermanshah, överskred Shahrizor, besegrade Dawud pashas armé från Bagdad och ryckte fram mot Bagdad, tills kolera bröt ut i hans armé och han själv dog i sjukdomen i november 1821. Abbas Mirza besegrade en större osmansk armé nära Toprakkale i maj 1822, men kolera och penningbrist hejdade båda sidor. Fördraget i Erzurum den 28 juli 1823 återställde gränsen från fördraget i Zuhab (1639), utan territoriella förändringar, och lovade iranska pilgrimer skydd.
