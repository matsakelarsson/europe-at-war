# Svenska översättningar av katalogtexten (våg 7); stegtexterna kommer senare.
Ottoman–Safavid War (1532–1555): Osmansk-safavidiska kriget (1532–1555)
The second great war between Suleiman the Magnificent and Shah Tahmasp I of Persia, fought in three Ottoman campaigns. In 1534 Suleiman and his grand vizier Ibrahim Pasha took Tabriz and then Baghdad, in 1548 the Ottomans took Tabriz again and the fortress of Van, and in 1553–1554 they ravaged Armenia and Karabakh. Tahmasp avoided pitched battles and laid waste to the land in the Ottoman path. The Peace of Amasya (1555) left Tabriz and the eastern Caucasus to Persia, while the Ottomans kept Baghdad and Iraq, Van and western Armenia and Georgia.: Det andra stora kriget mellan Süleyman den store och shah Tahmasp I av Persien, utkämpat i tre osmanska fälttåg. År 1534 intog Süleyman och hans storvesir Ibrahim pasha Tabriz och därefter Bagdad, 1548 intog osmanerna Tabriz på nytt och fästningen Van, och 1553–1554 härjade de Armenien och Karabach. Tahmasp undvek öppna fältslag och ödelade landet i osmanernas väg. Freden i Amasya (1555) lämnade Tabriz och östra Kaukasus åt Persien, medan osmanerna behöll Bagdad och Irak, Van samt västra Armenien och Georgien.
