# Svenska översättningar av katalogtexten (våg 7); stegtexterna kommer senare.
Ottoman–Safavid War (1578–1590): Osmansk-safavidiska kriget (1578–1590)
A war in which the Ottoman Empire, under Murad III, exploited the turmoil in Safavid Persia after the death of Shah Tahmasp I to conquer the Caucasus and north-western Iran. Lala Mustafa Pasha won at Çıldır in 1578 and took Tiflis and Shirvan; Özdemiroğlu Osman Pasha secured Shirvan and Dagestan in the Battle of Torches (1583) and took Tabriz in 1585. With the Uzbeks overrunning Khorasan at the same time, the young Shah Abbas I made peace at Constantinople in 1590, giving up Tabriz, Azerbaijan, the Caucasus and parts of western Iran.: Ett krig där Osmanska riket under Murad III utnyttjade oroligheterna i det safavidiska Persien efter shah Tahmasp I:s död för att erövra Kaukasus och nordvästra Iran. Lala Mustafa pasha segrade vid Çıldır 1578 och intog Tiflis och Shirvan; Özdemiroğlu Osman pasha säkrade Shirvan och Dagestan i facklornas slag (1583) och intog Tabriz 1585. Eftersom uzbekerna samtidigt trängde in i Khorasan slöt den unge shah Abbas I fred i Konstantinopel 1590 och avstod Tabriz, Azerbajdzjan, Kaukasus och delar av västra Iran.
