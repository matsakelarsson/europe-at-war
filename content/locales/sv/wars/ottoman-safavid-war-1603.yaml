# Svenska översättningar av katalogtexten (våg 7); stegtexterna kommer senare.
Ottoman–Safavid War (1603–1618): Osmansk-safavidiska kriget (1603–1618)
The war in which Shah Abbas I of Persia, with his reorganised army of slave soldiers, musketeers and artillery, won back the provinces lost to the Ottomans in 1590. While the Ottomans were tied down by their long war with the Habsburgs and the Celali revolts in Anatolia, Abbas took Tabriz in 1603, Erivan in 1604 after a long siege and Shirvan in 1606, and defeated an Ottoman army near Lake Urmia in 1605. The Treaty of Nasuh Pasha (1612) restored the frontier of 1555. Fighting resumed in 1615; the Ottomans failed before Erivan in 1616 and the Treaty of Serav (1618) confirmed the settlement.: Kriget där shah Abbas I av Persien med sin omorganiserade armé av slavsoldater, musketerare och artilleri återvann de provinser som hade gått förlorade till osmanerna 1590. Medan osmanerna var bundna av sitt långa krig mot habsburgarna och celaliupproren i Anatolien intog Abbas Tabriz 1603, Erivan 1604 efter en lång belägring och Shirvan 1606, och 1605 besegrade han en osmansk här nära Urmiasjön. Nasuh pashas fördrag (1612) återställde gränsen från 1555. Striderna blossade upp igen 1615; osmanerna misslyckades framför Erivan 1616, och fördraget i Serav (1618) bekräftade uppgörelsen.
