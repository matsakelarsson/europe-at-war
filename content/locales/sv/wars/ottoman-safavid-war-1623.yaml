# Svenska översättningar av katalogtexten (våg 7); stegtexterna kommer senare.
Ottoman–Safavid War (1623–1639): Osmansk-safavidiska kriget (1623–1639)
The last of the great wars between the Ottoman Empire and Safavid Persia, fought mainly over Iraq. Shah Abbas I took Baghdad in January 1624, exploiting a mutiny there, and held it against Ottoman sieges in 1625–1626 and 1630. Sultan Murad IV took Erivan and plundered Tabriz in 1635 and retook Baghdad after a 40-day siege in December 1638. The Treaty of Zuhab (1639) left Iraq to the Ottomans and drew a frontier that still roughly divides Iran from Turkey and Iraq.: Det sista av de stora krigen mellan Osmanska riket och det safavidiska Persien, utkämpat främst om Irak. Shah Abbas I intog Bagdad i januari 1624 genom att utnyttja ett myteri där och höll staden mot osmanska belägringar 1625–1626 och 1630. Sultan Murad IV intog Erivan och plundrade Tabriz 1635 och återtog Bagdad efter en 40 dagar lång belägring i december 1638. Fördraget i Zuhab (1639) lämnade Irak åt osmanerna och drog en gräns som fortfarande i stort sett skiljer Iran från Turkiet och Irak.
