Selim I, who had pushed his father from the throne in 1512, saw a deadly danger in Ismail I, the young shah who had made Shi‘i Islam the faith of Persia. Ismail’s Qizilbash followers were strong among the Turkmen tribes of Anatolia and had risen in a great revolt there in 1511. Armed with rulings that called them heretics, Selim had many of them killed or imprisoned; chroniclers speak of 40,000, a figure historians treat with caution. In the spring of 1514 he marched east. On 23 August, at Chaldiran north-east of Lake Van, the Safavid cavalry charged the Ottoman wings and was shot down by guns and janissary muskets behind a barrier of carts. Ismail was wounded and fled.: Selim I, som hade stött sin far från tronen 1512, såg en dödlig fara i Ismail I, den unge shahen som hade gjort shiaislam till Persiens religion. Ismails anhängare, qizilbash, var starka bland de turkmenska stammarna i Anatolien och hade rest sig i ett stort uppror där 1511. Med stöd av utlåtanden som stämplade dem som kättare lät Selim döda eller fängsla många av dem; krönikörerna talar om 40 000, en siffra som historikerna behandlar med försiktighet. Våren 1514 tågade han österut. Den 23 augusti, vid Chaldiran nordost om Vansjön, anföll det safavidiska kavalleriet de osmanska flyglarna och sköts ned av kanoner och janitsjarernas musköter bakom en barriär av vagnar. Ismail sårades och flydde.
Selim entered Tabriz in early September and carried off its treasury and many of its craftsmen, but his janissaries refused to winter there and he withdrew. In 1515 he took the fortress of Kemah, and his vizier Hadım Sinan Pasha destroyed the army of Dulkadir at Turnadağ; its ruler was killed and replaced by a vassal. Diyarbakır and many Kurdish lords went over to the Ottomans, won over by the scholar Idris Bitlisi, and in 1516 Bıyıklı Mehmed Pasha beat a Safavid army near Mardin, which fell soon after. Tabriz stayed Persian, but eastern Anatolia was now Ottoman.: Selim tågade in i Tabriz i början av september och förde bort dess skattkammare och många av dess hantverkare, men hans janitsjarer vägrade att övervintra där och han drog sig tillbaka. År 1515 intog han fästningen Kemah, och hans vesir Hadım Sinan pasha tillintetgjorde Dulkadirs här vid Turnadağ; dess härskare dödades och ersattes av en vasall. Diyarbakır och många kurdiska herrar gick över till osmanerna, övertalade av den lärde Idris Bitlisi, och 1516 slog Bıyıklı Mehmed pasha en safavidisk här nära Mardin, som föll kort därefter. Tabriz förblev persiskt, men östra Anatolien var nu osmanskt.
