23 August 1514: 23 augusti 1514
The Ottoman artillery and musketeers broke the Safavid cavalry. Ismail’s defeat ended the belief among his followers that he could not be beaten.: Det osmanska artilleriet och musketerarna krossade det safavidiska kavalleriet. Ismails nederlag gjorde slut på hans anhängares tro att han var oövervinnlig.
Tabriz: Tabriz
early September 1514: början av september 1514
Selim occupied the Safavid capital for about a week, then withdrew west with its treasury and artisans.: Selim besatte den safavidiska huvudstaden i omkring en vecka och drog sig sedan tillbaka västerut med dess skattkammare och hantverkare.
Kemah: Kemah
This fortress on the upper Euphrates, held for the shah, was stormed by Selim’s army.: Denna fästning vid övre Eufrat, som hölls för shahens räkning, stormades av Selims här.
June 1515: juni 1515
The Ottomans destroyed the army of the Dulkadir beylik, a Mamluk ally, in the mountains near Elbistan.: Osmanerna tillintetgjorde hären från Dulkadirs furstendöme, en mamlukisk bundsförvant, i bergen nära Elbistan.
The city rose against its Safavid garrison and went over to Selim, then held out against a Safavid counter-attack.: Staden reste sig mot sin safavidiska garnison och gick över till Selim, och höll sedan stånd mot ett safavidiskt motanfall.
