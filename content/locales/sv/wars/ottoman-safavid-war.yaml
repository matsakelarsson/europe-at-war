Ottoman–Safavid War (1514–1517): Osmansk-safavidiska kriget (1514–1517)
The first war between the Ottoman sultan Selim I and the Safavid shah Ismail I of Persia, whose Shi‘i Qizilbash followers had a large following among the Turkmen of Anatolia. Selim’s guns and janissaries routed Ismail at Chaldiran in 1514 and briefly occupied Tabriz, and in the following years the Ottomans conquered the Dulkadir beylik and eastern Anatolia from Erzincan to Diyarbakır, a frontier fought over until the Peace of Amasya in 1555.: Det första kriget mellan den osmanske sultanen Selim I och den safavidiske shahen Ismail I av Persien, vars shiitiska qizilbash-anhängare hade stort stöd bland turkmenerna i Anatolien. Selims kanoner och janitsjarer slog Ismail på flykten vid Chaldiran 1514 och besatte en kort tid Tabriz, och under de följande åren erövrade osmanerna Dulkadirs beylik och östra Anatolien från Erzincan till Diyarbakır, en gräns som det stridits om fram till freden i Amasya 1555.
