Dates are Julian. Sources differ on some dates, such as the Ottoman entry into Tabriz (5 or 7 September 1514).: Datumen anges enligt den julianska kalendern. Källorna skiljer sig åt om vissa datum, till exempel osmanernas intåg i Tabriz (5 eller 7 september 1514).
The size of both armies at Chaldiran is uncertain; modern estimates run from about 60,000 to 100,000 Ottomans and 40,000 to 80,000 Safavids. No peace was made, and the later Ottoman–Safavid wars, which began again in 1532, are not told here.: Storleken på båda härarna vid Chaldiran är osäker; moderna uppskattningar sträcker sig från omkring 60 000 till 100 000 osmaner och från 40 000 till 80 000 safavider. Någon fred slöts inte, och de senare osmansk-safavidiska krigen, som bröt ut på nytt 1532, behandlas inte här.
