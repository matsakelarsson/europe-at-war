# Svenska översättningar av katalogtexten (våg 7); stegtexterna kommer senare.
Ottoman–Saudi War: Osmansk-saudiska kriget
The war in which the Ottoman Empire, through its governor of Egypt, Muhammad Ali Pasha, destroyed the first Saudi state, the Emirate of Diriyah. Allied with the reformer Muhammad ibn Abd al-Wahhab, the Saudi emirs had united most of Arabia and in 1803–1805 taken Mecca and Medina, ending the Ottoman sultan’s role as protector of the holy cities. Egyptian armies under Muhammad Ali’s sons retook the Hejaz in 1812–1813 after an early defeat, fought the Saudis and their tribal allies in the mountains east of Mecca, and in 1816–1818, under Ibrahim Pasha, marched across Najd and besieged Diriyah. Abdullah ibn Saud surrendered on 11 September 1818 and was beheaded in Istanbul; Diriyah was razed. A second Saudi state rose at Riyadh in 1824.: Kriget där Osmanska riket, genom sin guvernör i Egypten, Muhammad Ali pasha, krossade den första saudiska staten, Emiratet Diriyah. I förbund med reformatorn Muhammad ibn Abd al-Wahhab hade de saudiska emirerna enat större delen av Arabien och 1803–1805 intagit Mecka och Medina, vilket gjorde slut på den osmanske sultanens roll som de heliga städernas beskyddare. Egyptiska arméer under Muhammad Alis söner återtog Hijaz 1812–1813 efter ett tidigt nederlag, stred mot saudierna och deras stamallierade i bergen öster om Mecka och marscherade 1816–1818, under Ibrahim pasha, genom Najd och belägrade Diriyah. Abdullah ibn Saud kapitulerade den 11 september 1818 och halshöggs i Istanbul; Diriyah jämnades med marken. En andra saudisk stat uppstod i Riyadh 1824.
