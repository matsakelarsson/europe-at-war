The city surrendered after a siege of about three weeks. Its garrison was killed and the walls were razed.: Staden kapitulerade efter en belägring på omkring tre veckor. Garnisonen dödades och murarna raserades.
Erzincan: Erzincan
Its ruler, Taharten, was Timur’s vassal; Bayezid’s demands on him were one cause of the war.: Dess härskare, Taharten, var Timurs vasall; Bayezids krav på honom var en av krigets orsaker.
Kemah: Kemah
Bayezid’s troops took this strong castle from Taharten while Timur was in Syria. Timur recaptured it in 1402.: Bayezids trupper tog denna starka borg från Taharten medan Timur var i Syrien. Timur återtog den 1402.
Timur defeated the Mamluk governors of Syria outside the city and sacked it.: Timur besegrade de mamlukiska ståthållarna i Syrien utanför staden och plundrade den.
The city surrendered after negotiations, in which the historian Ibn Khaldun took part, but it was plundered and burnt.: Staden kapitulerade efter förhandlingar, i vilka historikern Ibn Khaldun deltog, men den plundrades och brändes.
In the summer of 1402 Timur marched by way of Sivas and Kayseri towards Ankara. Bayezid broke off his blockade of Constantinople and hurried east in the heat, but Timur slipped round behind him and camped in the plain of Çubuk, north-east of Ankara, where he controlled the water. When the armies met on 28 July, the Tatars in Bayezid’s army and the soldiers of the beyliks he had annexed went over to Timur, whose horse archers wore down the tired and thirsty Ottomans. The Serbian knights of Stefan Lazarević fought hard and broke out with Bayezid’s son Süleyman, but Bayezid was surrounded and captured with another son, Musa.: Sommaren 1402 tågade Timur via Sivas och Kayseri mot Ankara. Bayezid avbröt sin blockad av Konstantinopel och skyndade österut i hettan, men Timur smög sig runt bakom honom och slog läger på Çubukslätten nordost om Ankara, där han behärskade vattentillgången. När härarna möttes den 28 juli gick tatarerna i Bayezids här och soldaterna från de furstendömen han hade annekterat över till Timur, vars beridna bågskyttar nötte ned de trötta och törstiga osmanerna. Stefan Lazarevićs serbiska riddare stred hårt och bröt sig ut tillsammans med Bayezids son Süleyman, men Bayezid omringades och tillfångatogs tillsammans med en annan son, Musa.
Timur’s grandson Muhammad Sultan sacked Bursa and its treasury, and in December Timur took the Hospitallers’ sea castle at Smyrna after a two-week siege and had many of its people killed. He gave back their lands to the lords of Karaman, Germiyan, Aydın, Saruhan, Menteşe and the other beyliks. Bayezid died in captivity at Akşehir on 8 March 1403, and Timur went home to Samarkand. The Ottoman realm in Europe survived, but Bayezid’s sons were soon fighting each other for what was left.: Timurs sonson Muhammad Sultan plundrade Bursa och dess skattkammare, och i december intog Timur johanniternas sjöborg i Smyrna efter två veckors belägring och lät döda många av dess invånare. Han lämnade tillbaka landen till herrarna i Karaman, Germiyan, Aydın, Saruhan, Menteşe och de andra furstendömena. Bayezid dog i fångenskap i Akşehir den 8 mars 1403, och Timur vände hem till Samarkand. Det osmanska riket i Europa överlevde, men Bayezids söner stred snart med varandra om det som återstod.
