The battle of Ankara is dated 28 July 1402 in many accounts and 20 July in others. The size of the armies is unknown; the chroniclers’ figures of hundreds of thousands are impossible, and modern guesses range widely.: Slaget vid Ankara dateras i många framställningar till 28 juli 1402 och i andra till 20 juli. Härarnas storlek är okänd; krönikörernas siffror på hundratusentals man är omöjliga, och moderna gissningar varierar kraftigt.
The story that Timur carried Bayezid around in an iron cage comes from later writers and is doubted; historians at Timur’s court said that the sultan was treated well.: Berättelsen om att Timur förde runt Bayezid i en järnbur kommer från senare författare och betvivlas; historiker vid Timurs hov uppgav att sultanen behandlades väl.
