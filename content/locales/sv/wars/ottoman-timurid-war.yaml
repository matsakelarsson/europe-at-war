The Knights of Rhodes had held the harbour castle since 1344. Timur’s miners breached the walls; some of the garrison escaped by sea.: Johanniterna på Rhodos hade innehaft hamnborgen sedan 1344. Timurs minörer slog breschar i murarna; en del av garnisonen flydde sjövägen.
