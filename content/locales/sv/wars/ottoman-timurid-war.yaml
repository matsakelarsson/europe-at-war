Ottoman–Timurid War: Osmansk-timuridiska kriget
The war between Sultan Bayezid I and the Central Asian conqueror Timur (Tamerlane), whose empire stretched from Samarkand to eastern Anatolia. After years of insulting letters and quarrels over the Turkish lords of eastern Anatolia, Timur sacked Sivas in 1400, and in 1402 he destroyed the Ottoman army near Ankara and took Bayezid prisoner. Timur restored the Turkish beyliks that Bayezid had annexed, and the Ottoman state nearly fell apart in the civil war that followed.: Kriget mellan sultan Bayezid I och den centralasiatiske erövraren Timur (Tamerlan), vars rike sträckte sig från Samarkand till östra Anatolien. Efter år av förolämpande brev och tvister om de turkiska furstarna i östra Anatolien plundrade Timur Sivas 1400, och 1402 förintade han den osmanska hären nära Ankara och tog Bayezid till fånga. Timur återupprättade de turkiska beylikerna som Bayezid hade annekterat, och den osmanska staten var nära att falla sönder i det inbördeskrig som följde.
