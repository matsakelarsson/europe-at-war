Timurid success: Timuridiska framgångar
In the 1390s Bayezid annexed the Turkish beyliks of western and central Anatolia and in 1398 took Sivas and the lands of Kadi Burhan al-Din, and then Malatya, reaching the frontier of Timur’s empire. Rulers he had driven out, among them the lords of Aydın, Germiyan and Menteşe, fled to Timur, and the lord of Erzincan, Taharten, was Timur’s vassal. Insulting letters passed between the two rulers. In August 1400 Timur invaded Anatolia and besieged Sivas, which surrendered after about three weeks. According to the chroniclers, he had the Christian soldiers of the garrison, said to number some 4,000, mostly Armenians, buried alive, and the town was destroyed.: Under 1390-talet annekterade Bayezid de turkiska furstendömena i västra och centrala Anatolien och tog 1398 Sivas och Kadi Burhan al-Dins land, och därefter Malatya, varmed han nådde gränsen till Timurs rike. Härskare som han hade drivit bort, bland dem herrarna i Aydın, Germiyan och Menteşe, flydde till Timur, och herren i Erzincan, Taharten, var Timurs vasall. Förolämpande brev växlades mellan de två härskarna. I augusti 1400 föll Timur in i Anatolien och belägrade Sivas, som kapitulerade efter omkring tre veckor. Enligt krönikörerna lät han begrava garnisonens kristna soldater levande, enligt uppgift omkring 4 000, mest armenier, och staden förstördes.
Timur did not march west at once. He turned south against the Mamluks of Egypt and Syria, sacked Aleppo in late 1400 and took Damascus early in 1401, massacring much of its population and carrying off its craftsmen to Samarkand, and then stormed Baghdad. Bayezid used the respite to attack Taharten and take the castle of Kemah on the upper Euphrates, while keeping up his blockade of Constantinople. In 1402 Timur retook Kemah and set out for central Anatolia.: Timur tågade inte genast västerut. Han vände söderut mot mamlukerna i Egypten och Syrien, plundrade Aleppo i slutet av 1400 och intog Damaskus i början av 1401, där han massakrerade stora delar av befolkningen och förde bort dess hantverkare till Samarkand, och stormade därefter Bagdad. Bayezid utnyttjade andrummet till att anfalla Taharten och inta borgen Kemah vid övre Eufrat, samtidigt som han upprätthöll sin blockad av Konstantinopel. År 1402 återtog Timur Kemah och bröt upp mot centrala Anatolien.
