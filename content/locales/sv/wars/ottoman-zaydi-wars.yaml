Ottoman–Zaydi wars in Yemen: Osmansk-zayditiska krigen i Jemen
The century-long struggle between the Ottoman Empire and the Zaydi imams of the Yemeni highlands. The Ottomans took Aden and the coastal plain of the Tihama in 1538–1539, as a base against the Portuguese in the Indian Ocean, and Sanaa in 1547. Imam al-Mutahhar drove them almost out of the country in 1567–1568, but Sinan Pasha reconquered it in 1569–1570 and by 1583–1585 the whole of Yemen was Ottoman. In 1597 Imam al-Mansur al-Qasim began a new revolt, and his son al-Mu’ayyad Muhammad took Sanaa in 1629 and forced the last Ottoman garrisons to leave Zabid and Mocha by 1636. Yemen remained an independent Zaydi state until the Ottomans returned in 1849.: Den sekellånga kampen mellan Osmanska riket och de zayditiska imamerna i Jemens högland. Osmanerna intog Aden och kustslätten Tihama 1538–1539, som bas mot portugiserna i Indiska oceanen, och Sanaa 1547. Imamen al-Mutahhar drev dem nästan helt ut ur landet 1567–1568, men Sinan pasha återerövrade det 1569–1570, och 1583–1585 var hela Jemen osmanskt. År 1597 inledde imamen al-Mansur al-Qasim ett nytt uppror, och hans son al-Mu’ayyad Muhammad intog Sanaa 1629 och tvingade de sista osmanska garnisonerna att lämna Zabid och Mocka senast 1636. Jemen förblev en självständig zayditisk stat tills osmanerna återvände 1849.
