# Svenska översättningar av katalogtexten (våg 13); stegtexterna kommer senare.
Oyo invasions of Dahomey: Oyos invasioner av Dahomey
? The campaigns by which the Yoruba empire of Oyo forced Dahomey, which had just conquered the coastal kingdoms of Allada and Whydah, to accept its overlordship. Oyo had taken tribute from the Aja kingdoms since the 1680s, and states threatened by King Agaja asked it for help. In April 1726 Oyo’s army, strong in cavalry, invaded, took and burned Abomey, while Agaja escaped into the marshes; it came again in 1728, when Agaja evacuated and burned his capital rather than defend it, and with larger armies in 1729 and 1730. Dahomey had no horses but many muskets, whose fire frightened the Oyo horses, and it dug trenches against them. In 1730 Agaja agreed to pay a yearly tribute, sent his son Tegbesu to Oyo as a guarantee, by tradition, and moved his capital to Allada. War broke out again in 1739 and went on under Tegbesu, until Oyo, after eleven invasions in all, brought Dahomey to submit in 1748. Dahomey paid tribute to Oyo until the reign of Ghezo, in the 1820s or 1830s, while it grew rich on the sale of captives through Ouidah.
: De fälttåg genom vilka yorubariket Oyo tvingade Dahomey, som nyss hade erövrat kustrikena Allada och Whydah, att erkänna dess överhöghet. Oyo hade tagit tribut av ajarikena sedan 1680-talet, och stater som hotades av kung Agaja bad Oyo om hjälp. I april 1726 invaderade Oyos armé, som var stark i kavalleri, och intog och brände Abomey, medan Agaja flydde ut i träskmarkerna; den kom tillbaka 1728, då Agaja utrymde och brände sin huvudstad hellre än att försvara den, och med större arméer 1729 och 1730. Dahomey hade inga hästar men många musköter, vars eld skrämde Oyos hästar, och grävde diken mot dem. År 1730 gick Agaja med på att betala en årlig tribut, sände enligt traditionen sin son Tegbesu till Oyo som garanti och flyttade sin huvudstad till Allada. Kriget bröt ut på nytt 1739 och fortsatte under Tegbesu, tills Oyo efter sammanlagt elva invasioner tvingade Dahomey att underkasta sig 1748. Dahomey betalade tribut till Oyo fram till Ghezos regering, på 1820- eller 1830-talet, samtidigt som riket blev rikt på försäljningen av fångar via Ouidah.
