# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
Padri War: Padrikriget
? A war in the Minangkabau highlands of West Sumatra that began as a struggle within Minangkabau society and ended in Dutch conquest. From about 1803 the Padri, Islamic reformers inspired by pilgrims returning from Mecca, set out to impose Islamic law and stamp out customs they held un-Islamic, such as cockfighting, gambling, opium, drink and parts of the matrilineal adat (customary law). Their war against the adat chiefs and the royal house of Pagaruyung, which they largely destroyed in 1815, turned many villages against each other. In 1821 adat leaders who had fled to Padang ceded their lands to the Dutch in return for help, and Dutch troops took Pagaruyung in 1822, but the Padri held them off, and the Treaty of Masang of 1824 left the war in abeyance during the Java War. From 1831 the Dutch, eager for the highlands’ coffee, conquered the Minangkabau heartland. A general rising of Padri and adat villages in January 1833 showed that the adat chiefs, too, had turned against Dutch rule. The Padri centre, Bonjol, fell on 16 August 1837 after a long siege; its leader, Tuanku Imam Bonjol, was seized during talks in October and exiled, and the last Padri stronghold, Tuanku Tambusai’s fort at Dalu-Dalu, fell in December 1838. The war left West Sumatra under Dutch rule and forced coffee cultivation, and produced the reconciliation of adat and Islam summed up in the saying that custom rests on Islamic law and Islamic law on the Qur’an.
: Ett krig i Minangkabauhöglandet på västra Sumatra som började som en kamp inom minangkabausamhället och slutade med nederländsk erövring. Från omkring 1803 försökte padrierna, islamiska reformatorer som inspirerats av pilgrimer som återvände från Mecka, att införa islamisk lag och utrota seder som de ansåg vara oislamiska, som tuppfäktning, hasardspel, opium, alkohol och delar av den matrilineära adat (sedvanerätten). Deras krig mot adathövdingarna och kungahuset i Pagaruyung, som de till stor del utplånade 1815, ställde många byar mot varandra. År 1821 avträdde adatledare som hade flytt till Padang sina länder till nederländarna i utbyte mot hjälp, och nederländska trupper intog Pagaruyung 1822, men padrierna höll dem stången, och fördraget i Masang 1824 lade kriget på is under Javakriget. Från 1831 erövrade nederländarna, som ville åt höglandets kaffe, minangkabauernas kärnland. En allmän resning bland padri- och adatbyar i januari 1833 visade att även adathövdingarna hade vänt sig mot det nederländska styret. Padriernas centrum, Bonjol, föll den 16 augusti 1837 efter en lång belägring; dess ledare, Tuanku Imam Bonjol, greps under förhandlingar i oktober och förvisades, och padriernas sista fäste, Tuanku Tambusais fort vid Dalu-Dalu, föll i december 1838. Kriget lämnade västra Sumatra under nederländskt styre och tvångsodling av kaffe, och det ledde fram till den försoning mellan adat och islam som sammanfattas i talesättet att sedvänjan vilar på islamisk lag och den islamiska lagen på Koranen.
