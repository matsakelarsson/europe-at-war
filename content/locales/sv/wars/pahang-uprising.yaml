# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
Pahang Uprising: Pahangresningen
? A rising of Malay chiefs in Pahang against the British Residency set up in 1888. Under growing British pressure Sultan Ahmad accepted a British protectorate and a Resident, John Pickersgill Rodger, in 1888. The new administration took over the collection of taxes, which the territorial chiefs had held, and set up courts and police that cut into their authority. Dato’ Bahaman, the Orang Kaya of Semantan, would not accept the new order in his district; when some of his followers were arrested in December 1891, he attacked the Sikh police at Lubuk Terua, burned the police post and sacked Temerloh. Tok Gajah of Pulau Tawar, who had led Pahang’s fighters in the Klang War, and his son Mat Kilau joined him, and on 10 April 1892 Mat Kilau’s men sacked Kuala Lipis. Sikh police and Malay levies, reinforced from Perak and Selangor, burned Mat Kilau’s stronghold at Budu in May 1892, and an amnesty followed on 16 October 1892 for all but the leaders, who withdrew with about 100 men to the borders of Kelantan and Terengganu, then under Siamese overlordship. In June 1894 they came back, seized the stockade at Kuala Tembeling on 14 June and were defeated at Jeram Ampai on 29 June; Hugh Clifford led a column into Kelantan and Terengganu after them. In October–November 1895 Siamese officials, who had agreed to stop harbouring them, captured Bahaman and four other leaders and deported them to Chiang Mai; Mat Kilau and Tok Gajah were reported dead. The exiles were allowed to return in 1913. In 1970 the Pahang government accepted the claim of an old man who had come forward as Mat Kilau; he died ten days later. Bahaman and Mat Kilau are remembered in Malaysia as fighters against colonial rule.
: En resning bland malajiska hövdingar i Pahang mot det brittiska residentskap som hade upprättats 1888. Under växande brittiskt tryck godtog sultan Ahmad 1888 ett brittiskt protektorat och en resident, John Pickersgill Rodger. Den nya förvaltningen tog över skatteuppbörden, som de territoriella hövdingarna hade haft hand om, och inrättade domstolar och polis som inskränkte deras makt. Dato’ Bahaman, Orang Kaya av Semantan, ville inte godta den nya ordningen i sitt distrikt; när några av hans anhängare greps i december 1891 anföll han sikhpolisen vid Lubuk Terua, brände polisposten och plundrade Temerloh. Tok Gajah från Pulau Tawar, som hade lett Pahangs kämpar i Klangkriget, och hans son Mat Kilau anslöt sig till honom, och den 10 april 1892 plundrade Mat Kilaus män Kuala Lipis. Sikhpolis och malajiska uppbåd, förstärkta från Perak och Selangor, brände Mat Kilaus fäste i Budu i maj 1892, och den 16 oktober 1892 följde en amnesti för alla utom ledarna, som med omkring 100 man drog sig tillbaka till gränstrakterna mot Kelantan och Terengganu, som då stod under siamesisk överhöghet. I juni 1894 kom de tillbaka, tog palissaden vid Kuala Tembeling den 14 juni och besegrades vid Jeram Ampai den 29 juni; Hugh Clifford ledde en kolonn in i Kelantan och Terengganu efter dem. I oktober–november 1895 tillfångatog siamesiska ämbetsmän, som hade gått med på att sluta ge dem skydd, Bahaman och fyra andra ledare och deporterade dem till Chiang Mai; Mat Kilau och Tok Gajah rapporterades döda. De landsförvisade fick återvända 1913. År 1970 godtog Pahangs regering anspråket från en gammal man som hade trätt fram som Mat Kilau; han dog tio dagar senare. I Malaysia minns man Bahaman och Mat Kilau som kämpar mot kolonialstyret.
