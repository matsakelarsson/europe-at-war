# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
Pamalayu expedition: Pamalayuexpeditionen
? "The expedition that King Kertanagara of Singhasari in eastern Java sent to Malayu (Melayu), the kingdom on the Batang Hari river in Sumatra that had taken over much of Srivijaya’s place in the Strait of Malacca and whose capital was then Dharmasraya. The Pararaton, a Javanese chronicle, dates the order to 1275 and calls it the pamalayu, “the Malayu affair”. How much fighting there was is unknown: Britannica describes envoys, while other historians date a military campaign to around 1290. In 1286 Kertanagara sent a statue of the bodhisattva Amoghapasa with fourteen attendant figures from Java to Dharmasraya, and the inscription on its base (the Padang Roco inscription) says that the people of Malayu, and above all their king Tribhuwanaraja Mauliwarmadewa, rejoiced at the gift; historians read it as a sign of Javanese overlordship or of an alliance between equals. Kertanagara’s aim was probably to control the trade of the strait and to build a bloc of island states against the Yuan, whose envoy he humiliated in 1289. With much of his army overseas, he was overthrown and killed by Jayakatwang of Kediri in 1292. The expedition, led according to Javanese poems by Mahisa Anabrang, came back in 1293, after Raden Wijaya and the Yuan army had defeated Jayakatwang, bringing two princesses of Malayu, Dara Petak and Dara Jingga. Dara Petak married Raden Wijaya, the founder of Majapahit, and was the mother of its second king, Jayanagara; Dara Jingga was the mother of Adityawarman, who later ruled Malayu and the Minangkabau highlands."
: "Den expedition som kung Kertanagara av Singhasari på östra Java sände till Malayu (Melayu), riket vid floden Batang Hari på Sumatra som hade övertagit mycket av Srivijayas ställning i Malackasundet och vars huvudstad då var Dharmasraya. Pararaton, en javanesisk krönika, daterar ordern till 1275 och kallar den pamalayu, ”Malayuaffären”. Hur mycket det stred är okänt: Britannica beskriver sändebud, medan andra historiker daterar ett militärt fälttåg till omkring 1290. År 1286 sände Kertanagara en staty av bodhisattvan Amoghapasa med fjorton följeslagande figurer från Java till Dharmasraya, och inskriften på dess sockel (Padang Roco-inskriften) säger att folket i Malayu, och framför allt deras kung Tribhuwanaraja Mauliwarmadewa, gladde sig åt gåvan; historikerna läser den som ett tecken på javanesisk överhöghet eller på en allians mellan jämlikar. Kertanagaras mål var troligen att kontrollera handeln genom sundet och bygga upp ett block av östater mot Yuan, vars sändebud han förödmjukade 1289. Med stora delar av sin armé utomlands störtades och dödades han 1292 av Jayakatwang av Kediri. Expeditionen, som enligt javanesiska dikter leddes av Mahisa Anabrang, återvände 1293, sedan Raden Wijaya och Yuanarmén hade besegrat Jayakatwang, och förde med sig två prinsessor från Malayu, Dara Petak och Dara Jingga. Dara Petak gifte sig med Raden Wijaya, Majapahits grundare, och blev mor till rikets andre kung, Jayanagara; Dara Jingga blev mor till Adityawarman, som senare härskade över Malayu och Minangkabauhöglandet."
