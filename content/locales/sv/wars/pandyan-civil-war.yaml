Pandyan civil war: Inbördeskriget i pandyariket
? A war of succession in the Pandya kingdom of Madurai that drew in the two great powers of the south, the Sinhalese kingdom of Polonnaruwa and the Chola Empire. In 1169 Kulasekhara Pandya besieged Madurai, and the reigning king, Parakrama Pandya, appealed to Parakramabahu I of Polonnaruwa but was killed before help came. A Sinhalese army under the general Lankapura Dandanatha landed at Rameswaram, joined Parakrama’s son Vira Pandya and took Madurai, and Kulasekhara turned to the Chola king Rajadhiraja II. Chola armies under the generals Tiruchirrambalamudaiyan Perumanambi and Annan Pallavarayan defeated the Sinhalese, set up the heads of Lankapura and other commanders on the gates of Madurai in about 1174, and raided northern Sri Lanka. The alliances then shifted. Parakramabahu won Kulasekhara over, the Cholas drove him out and put Vira Pandya on the throne as their client, and fighting went on into the late 1170s, with Sinhalese and Pandya forces holding Rameswaram until 1182. The Cholas came out on top, but the war revived the Pandyas, who within a century overshadowed both their former patrons.
: Ett tronföljdskrig i pandyariket i Madurai som drog in Sydindiens två stormakter, det singalesiska kungariket Polonnaruwa och cholariket. År 1169 belägrade Kulasekhara Pandya Madurai, och den regerande kungen, Parakrama Pandya, vädjade om hjälp till Parakramabahu I av Polonnaruwa men dödades innan hjälpen kom. En singalesisk armé under generalen Lankapura Dandanatha landsteg vid Rameswaram, förenade sig med Parakramas son Vira Pandya och intog Madurai, och Kulasekhara vände sig till cholakungen Rajadhiraja II. Cholaarméer under generalerna Tiruchirrambalamudaiyan Perumanambi och Annan Pallavarayan besegrade singaleserna, satte omkring 1174 upp Lankapuras och andra befälhavares huvuden på Madurais portar och plundrade norra Sri Lanka. Därefter skiftade allianserna. Parakramabahu vann Kulasekhara över på sin sida, cholastyrkorna drev bort honom och satte Vira Pandya på tronen som sin lydkung, och striderna fortsatte in i slutet av 1170-talet, medan singalesiska och pandyanska styrkor höll Rameswaram till 1182. Cholariket gick segrande ur kriget, men kriget gav ny kraft åt pandyadynastin, som inom ett sekel överskuggade båda sina tidigare beskyddare.
