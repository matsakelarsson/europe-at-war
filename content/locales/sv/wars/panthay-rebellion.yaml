# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
Panthay Rebellion: Panthayupproret
A rising of the Hui (Chinese-speaking Muslims) of Yunnan, joined by other peoples of the province, against the Qing. After years of violence between Hui and Han miners and settlers, officials and militias massacred Hui in and around Kunming in 1856, and risings broke out across the province. In western Yunnan Du Wenxiu took Dali and founded a state he called Pingnan Guo, the “Pacified South”, with himself as its ruler, known to Muslims and foreigners as Sultan Suleiman; it governed with Hui and Han officials and held much of the west for sixteen years. In the east the rebel leader Ma Rulong went over to the Qing in 1862. Du’s armies besieged Kunming in 1867–1868 but failed, and the Qing governor Cen Yuying, with modern artillery, slowly took back the province. Dali fell in January 1873 after Du Wenxiu had poisoned himself; thousands of its people were massacred. Estimates of the dead run as high as a million.: En resning bland hui (kinesisktalande muslimer) i Yunnan, som fick sällskap av andra folk i provinsen, mot Qing. Efter år av våld mellan hui och hankinesiska gruvarbetare och nybyggare massakrerade ämbetsmän och miliser hui i och kring Kunming 1856, och resningar bröt ut över hela provinsen. I västra Yunnan intog Du Wenxiu Dali och grundade en stat som han kallade Pingnan guo, ”den pacificerade södern”, med sig själv som härskare, bland muslimer och utlänningar känd som sultan Suleiman; staten styrdes med hjälp av hui- och hanämbetsmän och höll stora delar av väster i sexton år. I öster gick rebelledaren Ma Rulong över till Qing 1862. Dus arméer belägrade Kunming 1867–1868 men misslyckades, och Qingguvernören Cen Yuying tog med modernt artilleri långsamt tillbaka provinsen. Dali föll i januari 1873 sedan Du Wenxiu hade förgiftat sig; tusentals av stadens invånare massakrerades. Uppskattningarna av antalet döda går upp till en miljon.
