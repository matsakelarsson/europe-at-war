# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
Papua conflict: Papuakonflikten
? The long, low-level war between Indonesia and Papuan independence fighters in the western half of New Guinea, which Indonesia took over from a UN administration in 1963 and formally integrated after the disputed Act of Free Choice of 1969. The Free Papua Movement (Organisasi Papua Merdeka, OPM) has fought since 1965 with small, scattered guerrilla bands, often armed with bows, arrows and old rifles, and today mainly through the West Papua National Liberation Army (TPNPB); its political wing abroad is the United Liberation Movement for West Papua. Indonesia has answered with military operations in the highlands, a heavy security presence and restrictions on foreign journalists, and since 2001 with special autonomy and, in 2022, a division of the region into six provinces. Papuans’ grievances include the 1969 vote, killings and abuses by the security forces, the arrival of migrants from other islands, who now make up a large part of the population, and the exploitation of resources such as the Grasberg copper and gold mine. The fighting has intensified since 2018 in the central highlands, where tens of thousands have been displaced. Estimates of the total dead since the 1960s vary enormously, from about 100,000 to several hundred thousand, and none rests on a systematic count. Last updated 27 November 2026.
: Det långa, lågintensiva kriget mellan Indonesien och papuanska självständighetskämpar på Nya Guineas västra halva, som Indonesien tog över från en FN-förvaltning 1963 och formellt införlivade efter den omstridda Act of Free Choice 1969. Fria Papuarörelsen (Organisasi Papua Merdeka, OPM) har sedan 1965 kämpat med små, spridda gerillagrupper, ofta beväpnade med pilbågar, pilar och gamla gevär, och i dag främst genom Västpapuas nationella befrielsearmé (TPNPB); dess politiska gren utomlands är United Liberation Movement for West Papua. Indonesien har svarat med militära operationer i höglandet, en omfattande närvaro av säkerhetsstyrkor och restriktioner för utländska journalister, och sedan 2001 med särskilt självstyre och, 2022, en uppdelning av regionen i sex provinser. Papuanernas klagomål gäller bland annat omröstningen 1969, säkerhetsstyrkornas mord och övergrepp, inflyttningen av migranter från andra öar, som i dag utgör en stor del av befolkningen, och exploateringen av naturtillgångar som koppar- och guldgruvan Grasberg. Striderna har intensifierats sedan 2018 i det centrala höglandet, där tiotusentals har drivits på flykt. Uppskattningarna av det totala antalet döda sedan 1960-talet varierar enormt, från omkring 100 000 till flera hundra tusen, och ingen av dem bygger på en systematisk räkning. Senast uppdaterad 27 november 2026.
