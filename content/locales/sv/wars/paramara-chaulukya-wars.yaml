# Svenska översättningar av katalogtexten (våg 8); stegtexterna kommer senare.
Paramara–Chaulukya wars: Krigen mellan paramaradynastin och chaulukyadynastin
? The wars, on and off for two centuries, between the Paramaras of Malwa, ruling from Dhara, and their western neighbours, the Chaulukyas (Solankis) of Gujarat, ruling from Anahilapataka (Patan). Under the scholar-king Bhoja (about 1010–1055) the Paramaras had the upper hand; a later Jain chronicle says his general Kulachandra sacked the Chaulukya capital while Bhima I was away fighting in Sindh. Bhima allied with the Kalachuri king Lakshmi-Karna, and the two invaded Malwa from both sides as Bhoja lay dying in about 1055. In 1135–1136 Jayasimha Siddharaja took Dhara and annexed Malwa after a long war with the Paramara kings Naravarman and Yashovarman, and in about 1150 his successor Kumarapala defeated the usurper Ballala and kept Malwa as a Chaulukya province. The Paramara Vindhyavarman restored the kingdom between the 1170s and 1190s, defeating Mularaja II, and his successors carried the war into Gujarat. Subhatavarman invaded it in about 1204, when the Chaulukyas were weakened by the Ghurid invasions, and Arjunavarman defeated the usurper Jayantasimha in the early 1210s.
: Krigen, med avbrott under två sekel, mellan paramaradynastin i Malwa, som styrde från Dhara, och dess västra grannar, chaulukyadynastin (solankidynastin) i Gujarat, som styrde från Anahilapataka (Patan). Under den lärde kungen Bhoja (omkring 1010–1055) hade paramaradynastin övertaget; enligt en senare jainsk krönika plundrade hans general Kulachandra chaulukyahuvudstaden medan Bhima I var borta och krigade i Sindh. Bhima allierade sig med kalachurikungen Lakshmi-Karna, och de båda invaderade Malwa från var sitt håll när Bhoja låg för döden omkring 1055. År 1135–1136 intog Jayasimha Siddharaja Dhara och annekterade Malwa efter ett långt krig mot paramarakungarna Naravarman och Yashovarman, och omkring 1150 besegrade hans efterträdare Kumarapala usurpatorn Ballala och behöll Malwa som chaulukyaprovins. Paramarakungen Vindhyavarman återupprättade riket mellan 1170- och 1190-talen genom att besegra Mularaja II, och hans efterträdare förde kriget in i Gujarat. Subhatavarman invaderade Gujarat omkring 1204, när chaulukyadynastin var försvagad av ghuridernas invasioner, och Arjunavarman besegrade usurpatorn Jayantasimha i början av 1210-talet.
