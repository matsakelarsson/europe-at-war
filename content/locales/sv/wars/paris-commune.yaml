Paris Commune: Pariskommunen
? The revolutionary government that ruled Paris from 18 March to 28 May 1871, after France’s defeat in the Franco-Prussian War. When Adolphe Thiers’s government sent troops to remove the National Guard’s cannon from Montmartre on 18 March, crowds and guardsmen stopped them, two generals were shot dead, and the government withdrew to Versailles. A council elected on 26 March took power as the Commune. It separated church and state, suspended rents and let workers take over workshops their owners had left, while short-lived communes in Lyon, Marseille and other cities were soon put down. The army, rebuilt under Marshal Patrice de MacMahon with soldiers freed from German captivity, entered Paris on 21 May. In the “Bloody Week” that followed, Communards burned the Tuileries Palace and the Hôtel de Ville and shot about a hundred hostages, among them the Archbishop of Paris, while government troops killed Communards in the street fighting and in mass executions. Estimates of the Communards killed range from about 7,000 to 20,000; the army lost 877 dead from April to May. Over 43,000 people were taken prisoner, and some 13,500 were convicted, many of them deported to New Caledonia, until an amnesty in 1880.
: Den revolutionära regering som styrde Paris från den 18 mars till den 28 maj 1871, efter Frankrikes nederlag i fransk-tyska kriget. När Adolphe Thiers regering den 18 mars sände trupper för att föra bort nationalgardets kanoner från Montmartre stoppades de av folkmassor och gardister, två generaler sköts ihjäl och regeringen drog sig tillbaka till Versailles. Ett råd som valdes den 26 mars tog makten som kommunen. Den skilde kyrkan från staten, ställde in hyresbetalningarna och lät arbetare ta över verkstäder som ägarna lämnat, medan kortlivade kommuner i Lyon, Marseille och andra städer snart slogs ned. Armén, återuppbyggd under marskalk Patrice de MacMahon med soldater som frigetts ur tysk fångenskap, tågade in i Paris den 21 maj. Under den ”blodiga veckan” som följde brände kommunarderna Tuileriepalatset och Hôtel de Ville och sköt omkring hundra gisslan, bland dem ärkebiskopen av Paris, medan regeringstrupperna dödade kommunarder i gatustriderna och i massavrättningar. Uppskattningarna av antalet dödade kommunarder varierar från omkring 7 000 till 20 000; armén förlorade 877 döda från april till maj. Över 43 000 personer togs till fånga och omkring 13 500 dömdes, många av dem till deportation till Nya Kaledonien, fram till en amnesti 1880.
