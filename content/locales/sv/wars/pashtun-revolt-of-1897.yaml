# Svenska översättningar av katalogtexten (våg 8); stegtexterna kommer senare.
Pashtun revolt of 1897: Pashtunupproret 1897
A wave of risings by Pashtun tribes along the North-West Frontier of British India in 1897–1898, the largest the British faced there. Resentment of the Durand Line of 1893 and of new British posts in tribal country, preached against by religious leaders, broke out in attacks in the Tochi valley in June, on the British camps at Malakand and the fort of Chakdara in July, on Shabqadar in August, on the Khyber posts held by Afridi levies and on the forts of the Samana range, where 21 Sikh soldiers died defending Saragarhi in September. The British sent several field forces; the largest, about 35,000 strong under Sir William Lockhart, marched into the Afridi and Orakzai valleys of Tirah in October, stormed the Dargai heights and burned villages before withdrawing through the snow in December. The tribes submitted and paid fines in the spring of 1898.: En våg av resningar bland pashtunstammar längs Brittiska Indiens nordvästgräns 1897–1898, de största som britterna mötte där. Förbittringen över Durandlinjen från 1893 och över nya brittiska poster i stamområdena, som religiösa ledare predikade emot, utmynnade i angrepp i Tochidalen i juni, mot de brittiska lägren vid Malakand och fortet Chakdara i juli, mot Shabqadar i augusti, mot Khyberposterna som hölls av afridiska milisförband och mot fästena i Samanabergen, där 21 sikhiska soldater dog när de försvarade Saragarhi i september. Britterna sände flera fältstyrkor; den största, omkring 35 000 man under Sir William Lockhart, marscherade i oktober in i afridiernas och orakzaiernas dalar i Tirah, stormade Dargaihöjderna och brände byar innan den drog sig tillbaka genom snön i december. Stammarna underkastade sig och betalade böter våren 1898.
