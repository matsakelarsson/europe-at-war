# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
Pastry War: Bakelsekriget
? A French blockade and attack on Mexico in 1838–1839 to force payment of claims by French citizens. Among the claims was one from a French pastry cook, Remontel, whose shop at Tacubaya near Mexico City had been looted by soldiers in 1828, which gave the war its name; France demanded 600,000 pesos in all, as well as trade privileges, after years of unpaid damages from Mexico’s civil wars. When Mexico refused, a French squadron blockaded the Gulf ports from April 1838. On 27 November 1838 ships under Rear Admiral Charles Baudin bombarded the island fortress of San Juan de Ulúa off Veracruz, which surrendered the next day, and Mexico declared war. On 5 December French troops landed at Veracruz to seize the Mexican commander; Antonio López de Santa Anna, back from disgrace after the loss of Texas, led the defence and drove them back to their boats, losing his left leg to grapeshot, and used the episode to restore his reputation. Britain, whose trade suffered from the blockade, mediated, and by the treaty of 9 March 1839 Mexico agreed to pay the 600,000 pesos and France returned the fortress. In 1861 French claims against Mexico again led to war, the French intervention.
: En fransk blockad av och ett anfall mot Mexiko 1838–1839 för att framtvinga betalning av franska medborgares skadeståndskrav. Bland kraven fanns ett från en fransk konditor, Remontel, vars butik i Tacubaya nära Mexico City hade plundrats av soldater 1828, och det gav kriget dess namn; Frankrike krävde sammanlagt 600 000 pesos samt handelsprivilegier, efter år av obetalda ersättningar för skador under Mexikos inbördeskrig. När Mexiko vägrade blockerade en fransk eskader hamnarna vid Mexikanska golfen från april 1838. Den 27 november 1838 bombarderade fartyg under konteramiral Charles Baudin öfästningen San Juan de Ulúa utanför Veracruz, som kapitulerade dagen därpå, och Mexiko förklarade krig. Den 5 december landsteg franska trupper i Veracruz för att gripa den mexikanske befälhavaren; Antonio López de Santa Anna, som hade fallit i onåd efter förlusten av Texas men nu var tillbaka, ledde försvaret och drev dem tillbaka till båtarna, förlorade sitt vänstra ben genom en karteschträff och använde episoden till att återupprätta sitt anseende. Storbritannien, vars handel led av blockaden, medlade, och genom fördraget den 9 mars 1839 gick Mexiko med på att betala de 600 000 pesos och Frankrike lämnade tillbaka fästningen. År 1861 ledde franska krav mot Mexiko åter till krig, den franska interventionen.
