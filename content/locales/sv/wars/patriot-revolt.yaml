Patriot revolt and the Prussian invasion of Holland: Patriotupproret och den preussiska invasionen av Holland
? A struggle in the Dutch Republic between the Patriots, who wanted to curb the power of the stadtholder William V of Orange and his court, and the Orangists, which became a low-level civil war and ended with a Prussian invasion. From 1785 armed Patriot free corps took power in a number of towns and won majorities in the States of Holland, Groningen and Utrecht; William V left The Hague in September 1785, and in 1786 his troops occupied the Patriot towns of Hattem and Elburg in Guelders. On 9 May 1787 Patriot volunteers beat off troops loyal to the stadtholder at Jutphaas near Utrecht. When a Patriot free corps stopped William’s wife, Wilhelmina of Prussia, at Goejanverwellesluis on her way to The Hague on 28 June 1787, her brother, Frederick William II of Prussia, demanded satisfaction. With British backing, some 26,000 Prussian troops under the Duke of Brunswick invaded on 13 September; France, which had encouraged the Patriots, did nothing. Utrecht was abandoned without a fight, Amsterdam surrendered on 10 October, and William V was restored. Thousands of Patriots fled to France and the Austrian Netherlands, and many returned with the French armies in 1795.
: En kamp i Nederländska republiken mellan patrioterna, som ville begränsa makten hos ståthållaren Vilhelm V av Oranien och hans hov, och orangisterna, som utvecklades till ett lågintensivt inbördeskrig och slutade med en preussisk invasion. Från 1785 tog beväpnade patriotiska frikårer makten i ett antal städer och vann majoritet i Hollands, Groningens och Utrechts ständer; Vilhelm V lämnade Haag i september 1785, och 1786 besatte hans trupper patriotstäderna Hattem och Elburg i Gelderland. Den 9 maj 1787 slog patriotiska frivilliga tillbaka ståthållartrogna trupper vid Jutphaas nära Utrecht. När en patriotisk frikår den 28 juni 1787 stoppade Vilhelms hustru, Wilhelmina av Preussen, vid Goejanverwellesluis på väg till Haag, krävde hennes bror Fredrik Vilhelm II av Preussen upprättelse. Med brittiskt stöd invaderade omkring 26 000 preussiska soldater under hertigen av Braunschweig landet den 13 september; Frankrike, som hade uppmuntrat patrioterna, gjorde ingenting. Utrecht övergavs utan strid, Amsterdam kapitulerade den 10 oktober och Vilhelm V återinsattes. Tusentals patrioter flydde till Frankrike och Österrikiska Nederländerna, och många återvände med de franska arméerna 1795.
