# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
Pattimura’s rebellion: Pattimuras uppror
? A rising in the islands of the central Moluccas against the return of Dutch rule after the British occupation of 1810–1817. Under the Convention of London of 1814 Britain handed the Moluccas back to the Netherlands, and the transfer took place at Ambon in March 1817. People on Saparua and the other Lease islands feared a return to the Company-era burdens of forced deliveries and forced labour, and the conscription of Ambonese men, many of them former soldiers of the British Amboina Corps, for service in Java. On 14 May 1817 village leaders meeting on Saparua chose Thomas Matulessy, a Protestant former sergeant-major of the Amboina Corps, as their captain, Kapitan Pattimura. On 15–16 May they took Fort Duurstede, the Dutch post on Saparua, and killed its garrison and the young Resident, Johannes Rudolph van den Berg, with his wife and children; one five-year-old son survived. A relief force of about 300 men under Major Beetjes landed on Saparua on 20 May and was destroyed; most of its men, Beetjes among them, were killed. The rising spread to Haruku, Nusalaut, parts of Ambon and the coast of Seram, Christian and Muslim villages fighting together, and on 1 June the rebels attacked Fort Nieuw Zeelandia on Haruku but were beaten off. Dutch warships with reinforcements, helped by fleets of the sultans of Ternate and Tidore, retook Fort Duurstede on 3 August, and by November the rising had been crushed. Pattimura was betrayed and captured at Booi on Saparua on 12 November, and on 16 December 1817 he was hanged with four other leaders in front of Fort Nieuw Victoria in Ambon; Kapitan Paulus Tiahahu of Nusalaut was executed, and his daughter Martha Christina Tiahahu, who had fought beside him, died on a Dutch ship taking her to forced labour in Java in January 1818. Pattimura was declared a National Hero of Indonesia in 1973, and both he and Martha Christina Tiahahu are commemorated in Maluku.
: En resning på öarna i centrala Moluckerna mot återkomsten av det nederländska styret efter den brittiska ockupationen 1810–1817. Enligt Londonkonventionen 1814 lämnade Storbritannien tillbaka Moluckerna till Nederländerna, och överlämnandet ägde rum på Ambon i mars 1817. Folket på Saparua och de andra Leaseöarna fruktade en återgång till kompanitidens bördor i form av tvångsleveranser och tvångsarbete, och att ambonesiska män, av vilka många var före detta soldater i den brittiska Amboinakåren, skulle tas ut till tjänstgöring på Java. Den 14 maj 1817 valde byledare som möttes på Saparua Thomas Matulessy, en protestantisk före detta sergeantmajor i Amboinakåren, till sin kapten, Kapitan Pattimura. Den 15–16 maj intog de Fort Duurstede, den nederländska posten på Saparua, och dödade dess garnison och den unge residenten Johannes Rudolph van den Berg tillsammans med hans hustru och barn; en femårig son överlevde. En undsättningsstyrka på omkring 300 man under major Beetjes landsteg på Saparua den 20 maj och förintades; de flesta av dess män, däribland Beetjes, dödades. Resningen spred sig till Haruku, Nusalaut, delar av Ambon och Serams kust, där kristna och muslimska byar stred sida vid sida, och den 1 juni anföll rebellerna Fort Nieuw Zeelandia på Haruku men slogs tillbaka. Nederländska krigsfartyg med förstärkningar, med hjälp av flottor från sultanerna av Ternate och Tidore, återtog Fort Duurstede den 3 augusti, och i november hade resningen slagits ned. Pattimura förråddes och tillfångatogs i Booi på Saparua den 12 november, och den 16 december 1817 hängdes han tillsammans med fyra andra ledare framför Fort Nieuw Victoria på Ambon; Kapitan Paulus Tiahahu från Nusalaut avrättades, och hans dotter Martha Christina Tiahahu, som hade stridit vid hans sida, dog i januari 1818 ombord på ett nederländskt fartyg som skulle föra henne till tvångsarbete på Java. Pattimura förklarades som nationalhjälte i Indonesien 1973, och både han och Martha Christina Tiahahu hedras i Maluku.
