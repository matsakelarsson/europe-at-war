Pazzi War: Pazzikriget
The war that followed the Pazzi conspiracy of 26 April 1478, in which conspirators backed by Pope Sixtus IV killed Giuliano de’ Medici in Florence cathedral and wounded his brother Lorenzo; the Florentines hanged the Archbishop of Pisa and others in revenge. The pope excommunicated Lorenzo, put Florence under interdict and, with Ferdinand I of Naples, made war on it. Neapolitan and papal armies under Alfonso, Duke of Calabria, invaded Tuscany, while Florence’s allies Milan and Venice gave little help; on 7 September 1479 Alfonso routed the Florentines at Poggio Imperiale near Poggibonsi and went on to take Colle di Val d’Elsa. In December 1479 Lorenzo sailed to Naples and in three months of talks won Ferdinand over to peace. The Ottoman capture of Otranto in August 1480 then pushed Sixtus to make his own peace with Florence in December 1480.: Kriget som följde på Pazzisammansvärjningen den 26 april 1478, då sammansvurna med stöd av påven Sixtus IV dödade Giuliano de’ Medici i Florens domkyrka och sårade hans bror Lorenzo; florentinarna hängde som hämnd ärkebiskopen av Pisa och andra. Påven bannlyste Lorenzo, belade Florens med interdikt och förde tillsammans med Ferdinand I av Neapel krig mot staden. Neapolitanska och påvliga arméer under Alfonso, hertig av Kalabrien, invaderade Toscana, medan Florens allierade Milano och Venedig gav föga hjälp; den 7 september 1479 slog Alfonso florentinarna på flykten vid Poggio Imperiale nära Poggibonsi och intog därefter Colle di Val d’Elsa. I december 1479 seglade Lorenzo till Neapel och vann under tre månaders förhandlingar Ferdinand för fred. Osmanernas erövring av Otranto i augusti 1480 drev sedan Sixtus att sluta egen fred med Florens i december 1480.
