Ghent stayed loyal to the count throughout. Zannekin was killed at Cassel, and Bruges’ leader Willem de Deken was executed in Paris.: Gent förblev lojalt mot greven hela tiden. Zannekin stupade vid Cassel, och Brygges ledare Willem de Deken avrättades i Paris.
