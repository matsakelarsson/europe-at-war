Peasant revolt in Flanders: Bondeupproret i Flandern
A rising of the peasants of coastal Flanders against the taxes and officials of Count Louis of Nevers, partly levied to pay the fines of the Treaty of Athis-sur-Orge. It began with rural riots in late 1323 and grew into a rebellion led by the farmer Nicolaas Zannekin, joined by Bruges and Ypres, which captured the count at Kortrijk in 1325. A peace made at Arques in 1326 soon broke down, and in 1328 the new French king, Philip VI, came to the count’s aid and crushed the rebel army at Cassel on 23 August, followed by harsh reprisals.: Ett uppror bland bönderna i kust-Flandern mot greve Ludvig av Nevers skatter och ämbetsmän, skatter som delvis togs ut för att betala böterna enligt fördraget i Athis-sur-Orge. Det började med upplopp på landsbygden i slutet av 1323 och växte till ett uppror under bonden Nicolaas Zannekin, som fick stöd av Brygge och Ypern och som tillfångatog greven i Kortrijk 1325. En fred som slöts i Arques 1326 bröt snart samman, och 1328 kom den nye franske kungen Filip VI greven till hjälp och krossade rebellhären vid Cassel den 23 augusti, vilket följdes av hårda repressalier.
