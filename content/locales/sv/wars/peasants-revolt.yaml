Peasants’ Revolt: Bondeupproret 1381
A rising in England in the summer of 1381, set off by the third poll tax in four years, raised to pay for the war with France. Rebels from Essex and Kent, led by Wat Tyler and inspired by the preacher John Ball, entered London on 13 June, burned John of Gaunt’s Savoy Palace and killed the Archbishop of Canterbury and the Treasurer. The fourteen-year-old Richard II met the rebels at Mile End and at Smithfield, where Tyler was killed on 15 June. The king’s promises to end serfdom were revoked, and the revolt, which had spread to East Anglia and beyond, was put down.: Ett uppror i England sommaren 1381, utlöst av den tredje mantalsskatten på fyra år, som togs ut för att bekosta kriget mot Frankrike. Rebeller från Essex och Kent, ledda av Wat Tyler och inspirerade av predikanten John Ball, tågade in i London den 13 juni, brände Johan av Gents Savoypalats och dödade ärkebiskopen av Canterbury och riksskattmästaren. Den fjortonårige Rikard II mötte rebellerna vid Mile End och vid Smithfield, där Tyler dödades den 15 juni. Kungens löften om att avskaffa livegenskapen återkallades, och upproret, som hade spridit sig till East Anglia och längre bort, slogs ned.
