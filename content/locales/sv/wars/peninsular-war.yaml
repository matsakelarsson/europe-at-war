General Álvarez de Castro’s 9,000 men held some 32,000 French and Westphalian troops for an entire campaigning season.: General Álvarez de Castros 9 000 man höll stånd mot omkring 32 000 franska och westfaliska soldater under en hel fälttågssäsong.
Wellesley and Cuesta: Wellesley och Cuesta
In January 1810 the French overran Andalusia and took Seville on 1 February. The Spanish government fled to Cádiz, on its island off the coast, and from 5 February the French besieged it, but with British and Spanish ships holding the sea, they could not take it. Napoleon now sent Marshal Masséna with some 65,000 men to drive the British out of Portugal. Masséna took Ciudad Rodrigo in July, and at Almeida on 26 August a shell set off the great powder magazine, killing some 600 defenders and forcing the fortress to surrender. At Bussaco on 27 September Wellington beat off Masséna’s attacks, then fell back towards Lisbon, ordering the country to be stripped of food as he went.: I januari 1810 översvämmade fransmännen Andalusien och intog Sevilla den 1 februari. Den spanska regeringen flydde till Cádiz, på sin ö utanför kusten, och från den 5 februari belägrade fransmännen staden, men eftersom brittiska och spanska fartyg behärskade havet kunde de inte inta den. Napoleon sände nu marskalk Masséna med omkring 65 000 man för att driva britterna ut ur Portugal. Masséna intog Ciudad Rodrigo i juli, och vid Almeida antände en granat den 26 augusti det stora krutmagasinet, vilket dödade omkring 600 försvarare och tvingade fästningen att kapitulera. Vid Bussaco den 27 september slog Wellington tillbaka Massénas anfall och drog sig sedan tillbaka mot Lissabon, med order om att landet skulle tömmas på livsmedel efter hand.
On 11 October the French came up against the Lines of Torres Vedras, chains of forts and earthworks across the peninsula north of Lisbon, built in secret by Portuguese labourers through the past year. Masséna judged them too strong to attack. His army starved in front of them through the winter, foraging in a land already emptied, while Portuguese refugees behind the lines also died in great numbers. In March 1811 Masséna retreated, burning towns as he went, having lost some 25,000 men in Portugal.: Den 11 oktober stötte fransmännen på Torres Vedras-linjerna, kedjor av fort och jordverk tvärs över halvön norr om Lissabon, som portugisiska arbetare i hemlighet hade byggt under det gångna året. Masséna bedömde dem som för starka att anfalla. Hans armé svalt framför dem hela vintern och furagerade i ett land som redan var tömt, medan portugisiska flyktingar bakom linjerna också dog i stort antal. I mars 1811 retirerade Masséna och brände städer på vägen, sedan han förlorat omkring 25 000 man i Portugal.
