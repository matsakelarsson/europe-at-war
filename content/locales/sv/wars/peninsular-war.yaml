Peninsular War: Spanska självständighetskriget
The war for the Iberian Peninsula between Napoleonic France and the allied armies of Spain, Portugal and Britain. It began with the French occupation of Portugal in 1807 and grew into a national war in Spain when Napoleon put his brother Joseph on the Spanish throne in 1808. Spanish armies, guerrillas and sieges tied down hundreds of thousands of French troops, while Wellington’s British and Portuguese army, safe behind the Lines of Torres Vedras, wore the French down and then drove them out of Spain, winning at Salamanca in 1812 and Vitoria in 1813 and ending the war at Toulouse in April 1814.: Kriget om Iberiska halvön mellan Napoleons Frankrike och de allierade arméerna från Spanien, Portugal och Storbritannien. Det började med den franska ockupationen av Portugal 1807 och växte till ett nationellt krig i Spanien när Napoleon satte sin bror Joseph på den spanska tronen 1808. Spanska arméer, gerillor och belägringar band hundratusentals franska soldater, medan Wellingtons brittisk-portugisiska armé, i skydd bakom Torres Vedras-linjerna, nötte ned fransmännen och sedan drev dem ut ur Spanien, med segrar vid Salamanca 1812 och Vitoria 1813, och kriget avslutades vid Toulouse i april 1814.
