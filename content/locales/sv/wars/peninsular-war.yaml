Spanish troops under General Freire threw back Soult’s last attempt to relieve San Sebastián.: Spanska trupper under general Freire slog tillbaka Soults sista försök att undsätta San Sebastián.
Graham: Graham
On 7 October Wellington crossed the Bidasoa into France, and on 31 October the starving French garrison of Pamplona surrendered. Soult was driven from his lines on the Nivelle on 10 November and from those south of Bayonne on the Nive in December. Napoleon, losing in Germany, released Ferdinand VII by the Treaty of Valençay in December, hoping to make peace with Spain, but the Regency refused to ratify it. In February 1814 Wellington left a corps to besiege Bayonne and pushed east, beating Soult at Orthez on 27 February, and on 12 March a British force entered Bordeaux, whose mayor declared for Louis XVIII.: Den 7 oktober gick Wellington över Bidasoa in i Frankrike, och den 31 oktober kapitulerade den svältande franska garnisonen i Pamplona. Soult drevs ur sina linjer vid Nivelle den 10 november och ur linjerna söder om Bayonne vid Nive i december. Napoleon, som förlorade i Tyskland, släppte Ferdinand VII genom fördraget i Valençay i december i hopp om att sluta fred med Spanien, men regentskapet vägrade att ratificera det. I februari 1814 lämnade Wellington en kår för att belägra Bayonne och trängde österut, slog Soult vid Orthez den 27 februari, och den 12 mars ryckte en brittisk styrka in i Bordeaux, vars borgmästare förklarade sig för Ludvig XVIII.
Soult made his last stand at Toulouse. On 10 April Wellington took the heights east of the city after a bloody fight, and Soult withdrew. Napoleon had already abdicated on 6 April, but the news reached the armies only on 12 April. Two days later the garrison of Bayonne made a sortie that cost both sides hundreds of men. Soult accepted an armistice on 17 April. Ferdinand came back to Spain in March and on 4 May annulled the constitution of Cádiz, restored absolute rule and had the leading liberals arrested.: Soult gjorde sitt sista motstånd vid Toulouse. Den 10 april tog Wellington höjderna öster om staden efter blodiga strider, och Soult drog sig tillbaka. Napoleon hade redan abdikerat den 6 april, men nyheten nådde arméerna först den 12 april. Två dagar senare gjorde garnisonen i Bayonne ett utfall som kostade båda sidor hundratals man. Soult godtog ett vapenstillestånd den 17 april. Ferdinand återvände till Spanien i mars och upphävde den 4 maj Cádizförfattningen, återinförde envälde och lät arrestera de ledande liberalerna.
