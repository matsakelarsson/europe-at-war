19 September – 21 October 1812: 19 september – 21 oktober 1812
General Dubreton’s small garrison beat off every assault on the castle. Wellington lacked heavy guns.: General Dubretons lilla garnison slog tillbaka varje stormning mot borgen. Wellington saknade tungt artilleri.
Retreat, November 1812: Återtåget i november 1812
In the spring of 1813 Napoleon, rebuilding his armies after Russia, drew men out of Spain. On 22 May Wellington, now commanding Spanish as well as British and Portuguese troops, advanced again. While he marched on Salamanca, the left wing under Sir Thomas Graham crossed the mountains of Trás-os-Montes, and the allies turned the French out of every line they tried to hold. On 21 June they caught King Joseph’s armies at Vitoria and broke them. The French lost 151 of their guns and their whole baggage train, “the loot of a kingdom”, which many British soldiers stopped to plunder instead of pursuing.: Våren 1813 drog Napoleon, som byggde upp sina arméer på nytt efter Ryssland, bort trupper från Spanien. Den 22 maj ryckte Wellington, som nu förde befäl över spanska såväl som brittiska och portugisiska trupper, åter fram. Medan han tågade mot Salamanca gick vänsterflygeln under sir Thomas Graham över bergen i Trás-os-Montes, och de allierade drev fransmännen ur varje linje de försökte hålla. Den 21 juni hann de upp kung Josephs arméer vid Vitoria och krossade dem. Fransmännen förlorade 151 av sina kanoner och hela sin tross, ”ett kungarikes byte”, som många brittiska soldater stannade för att plundra i stället för att förfölja fienden.
The French fell back over the Pyrenees, leaving garrisons in San Sebastián and Pamplona. At the end of July Marshal Soult, sent to restore the situation, struck through the passes of Maya and Roncesvalles to relieve Pamplona, but was beaten back at Sorauren on 28 and 30 July. On 31 August, the day Spanish troops beat off a last French relief attempt at San Marcial, the British and Portuguese stormed San Sebastián. They then sacked and burned the town, killing perhaps 1,000 of its people. The castle held out until 8 September.: Fransmännen drog sig tillbaka över Pyrenéerna och lämnade garnisoner i San Sebastián och Pamplona. I slutet av juli slog marskalk Soult, som sänts för att återställa läget, till genom passen vid Maya och Roncesvalles för att undsätta Pamplona, men slogs tillbaka vid Sorauren den 28 och 30 juli. Den 31 augusti, samma dag som spanska trupper slog tillbaka ett sista franskt undsättningsförsök vid San Marcial, stormade britter och portugiser San Sebastián. De plundrade och brände sedan staden och dödade kanske 1 000 av dess invånare. Borgen höll ut till den 8 september.
