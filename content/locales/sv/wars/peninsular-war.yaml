Fought four days after Napoleon’s abdication. The allies lost almost 3,000 more men than the French, but Soult left the city to them.: Utkämpades fyra dagar efter Napoleons abdikation. De allierade förlorade nästan 3 000 man fler än fransmännen, men Soult lämnade staden åt dem.
