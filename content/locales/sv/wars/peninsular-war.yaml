Wellington held the village and ridge against Masséna’s attempt to relieve Almeida. “If Boney had been there, we should have been beat,” he said.: Wellington höll byn och åsen mot Massénas försök att undsätta Almeida. ”Om Boney hade varit där hade vi blivit slagna”, sade han.
