The charge of the Polish chevau-légers up the pass against Benito de San Juan’s Spaniards opened the road to Madrid.: De polska chevaulégerernas anfall uppför passet mot Benito de San Juans spanjorer öppnade vägen till Madrid.
After a short bombardment the remaining Spanish troops surrendered, and the French entered the capital for the second time that year.: Efter en kort beskjutning kapitulerade de återstående spanska trupperna, och fransmännen tågade in i huvudstaden för andra gången det året.
Castaños: Castaños
A British army under Sir John Moore had advanced from Portugal into León to help the Spanish, and on 21 December its cavalry routed a French force at Sahagún. When Moore learned that Madrid had fallen and that Napoleon was marching north to cut him off, he turned back towards the coast of Galicia. The retreat through the snowbound mountains became an ordeal. Discipline broke down, soldiers looted and drank, and stragglers by the hundred were left to the French cavalry. Napoleon followed as far as Astorga and then handed the pursuit to Marshal Soult, leaving for France to deal with Austria.: En brittisk armé under sir John Moore hade ryckt fram från Portugal in i León för att hjälpa spanjorerna, och den 21 december slog dess kavalleri en fransk styrka på flykten vid Sahagún. När Moore fick veta att Madrid hade fallit och att Napoleon tågade norrut för att skära av honom vände han tillbaka mot Galiciens kust. Återtåget genom de snötäckta bergen blev en prövning. Disciplinen bröt samman, soldater plundrade och drack, och eftersläntrare lämnades i hundratal åt det franska kavalleriet. Napoleon följde efter ända till Astorga och överlät sedan förföljandet åt marskalk Soult, medan han själv for till Frankrike för att ta itu med Österrike.
Moore’s army reached Corunna on 11 January 1809, and when the transports arrived it began to embark. On 16 January Soult attacked, and was beaten off outside the town. Moore was mortally wounded by a cannonball and buried on the ramparts, and the army, some 26,000 men, sailed home that night and the next day; about 7,000 had been lost on the campaign. In Aragon the French had besieged Zaragoza again since 20 December. Its defenders held out street by street, while typhus raged in the city, until 20 February. By then a large part of the city lay in ruins, and some estimates put the dead, soldiers and civilians together, at over 50,000.: Moores armé nådde La Coruña den 11 januari 1809, och när transportfartygen kom började den gå ombord. Den 16 januari anföll Soult och slogs tillbaka utanför staden. Moore blev dödligt sårad av en kanonkula och begravdes på vallarna, och armén, omkring 26 000 man, seglade hem samma natt och dagen därpå; omkring 7 000 hade gått förlorade under fälttåget. I Aragonien hade fransmännen åter belägrat Zaragoza sedan den 20 december. Försvararna höll ut gata för gata, medan tyfus härjade i staden, fram till den 20 februari. Då låg en stor del av staden i ruiner, och enligt vissa uppskattningar uppgick de döda, soldater och civila sammantaget, till över 50 000.
