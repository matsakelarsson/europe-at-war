Junot’s men went home with their arms and their loot. The terms caused outrage in Britain, and the three British generals involved, Wellesley among them, were called before an inquiry.: Junots män fick åka hem med sina vapen och sitt byte. Villkoren väckte upprördhet i Storbritannien, och de tre inblandade brittiska generalerna, bland dem Wellesley, ställdes inför en undersökningskommission.
