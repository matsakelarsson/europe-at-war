Moore retreats: Moore retirerar
Soult: Soult
In March 1809 Soult invaded northern Portugal and on 29 March stormed Porto. In the panic a bridge of boats over the Douro collapsed under the fleeing townspeople, and hundreds, perhaps thousands, drowned. Wellesley returned to Lisbon in April to command the British and Portuguese forces, and on 12 May he surprised Soult by ferrying troops across the Douro in wine barges above the city. Soult fled into the mountains, abandoning his guns and baggage. Meanwhile the Portuguese army was rebuilt under a British general, William Beresford, with British officers serving in its ranks.: I mars 1809 föll Soult in i norra Portugal och stormade den 29 mars Porto. I paniken rasade en pontonbro över Douro under de flyende stadsborna, och hundratals, kanske tusentals, drunknade. Wellesley återvände till Lissabon i april för att leda de brittiska och portugisiska styrkorna, och den 12 maj överraskade han Soult genom att färja trupper över Douro i vinpråmar ovanför staden. Soult flydde upp i bergen och lämnade sina kanoner och sin tross. Samtidigt byggdes den portugisiska armén upp på nytt under en brittisk general, William Beresford, med brittiska officerare i dess led.
Wellesley then marched into Spain to join General Cuesta’s Spanish army in a drive on Madrid. At Talavera on 27–28 July the allies beat off the attacks of Marshal Victor and King Joseph, with heavy losses on both sides; many wounded burned to death when the dry grass caught fire. Wellesley, made Viscount Wellington for the victory, fell back to Portugal when more French armies closed in. In November the main Spanish army was destroyed at Ocaña, losing nearly 19,000 men. In Catalonia, Girona had resisted a French siege since May; starving and sick, it surrendered in December, after seven months.: Wellesley tågade sedan in i Spanien för att förena sig med general Cuestas spanska armé i en framstöt mot Madrid. Vid Talavera den 27–28 juli slog de allierade tillbaka marskalk Victors och kung Josephs anfall, med svåra förluster på båda sidor; många sårade brändes ihjäl när det torra gräset fattade eld. Wellesley, som för segern blev viscount Wellington, drog sig tillbaka till Portugal när fler franska arméer närmade sig. I november tillintetgjordes den spanska huvudarmén vid Ocaña och förlorade nästan 19 000 man. I Katalonien hade Girona stått emot en fransk belägring sedan maj; svältande och sjuk kapitulerade staden i december, efter sju månader.
