In Spain the war is called the War of Independence (Guerra de la Independencia), in Portugal the French Invasions, and in Catalonia the War of the French. The wider Napoleonic Wars are told separately.: I Spanien kallas kriget självständighetskriget (Guerra de la Independencia), i Portugal de franska invasionerna och i Katalonien fransmännens krig. De vidare Napoleonkrigen behandlas separat.
The Spain side stands for the patriot juntas, the Regency and the Cortes that fought in Ferdinand VII’s name. Joseph Bonaparte’s Kingdom of Spain, recognised only by France and its allies, is counted with France.: Sidan Spanien står för de patriotiska juntorna, regentskapet och Cortes, som stred i Ferdinand VII:s namn. Joseph Bonapartes kungarike Spanien, som bara erkändes av Frankrike och dess allierade, räknas till Frankrike.
The war killed hundreds of thousands of soldiers and civilians, through battle, sieges, reprisals, famine and disease. Estimates vary widely.: Kriget dödade hundratusentals soldater och civila genom strider, belägringar, repressalier, hungersnöd och sjukdomar. Uppskattningarna varierar kraftigt.
British and Portuguese moves: Brittiska och portugisiska trupprörelser
British and Portuguese success: Brittiska och portugisiska framgångar
Portugal, Britain’s oldest ally, would not join Napoleon’s blockade of British trade. On 27 October 1807, by the secret Treaty of Fontainebleau, France and Spain agreed to conquer it and divide it into three parts, one of them a principality for Charles IV’s chief minister, Manuel Godoy. General Junot marched across Spain and invaded Portugal on 19 November with three Spanish divisions in support. The Portuguese did not resist. On 29 November the Prince Regent John, his mentally ill mother, Queen Maria, and much of the court sailed for Brazil under British escort, and the next day Junot’s exhausted advance guard entered Lisbon.: Portugal, Storbritanniens äldsta allierade, ville inte ansluta sig till Napoleons blockad av den brittiska handeln. Den 27 oktober 1807 kom Frankrike och Spanien genom det hemliga fördraget i Fontainebleau överens om att erövra landet och dela det i tre delar, varav en skulle bli ett furstendöme åt Karl IV:s förste minister, Manuel Godoy. General Junot tågade genom Spanien och föll in i Portugal den 19 november med stöd av tre spanska divisioner. Portugiserna gjorde inget motstånd. Den 29 november seglade prinsregenten Johan, hans psykiskt sjuka mor drottning Maria och stora delar av hovet till Brasilien under brittisk eskort, och dagen därpå tågade Junots utmattade förtrupp in i Lissabon.
Meanwhile French troops poured into Spain, Napoleon’s ally, and in February and March 1808 seized the frontier fortresses of Pamplona, Barcelona, Figueres and San Sebastián by trickery. On 17–19 March a riot at the palace of Aranjuez toppled Godoy and forced Charles IV to abdicate in favour of his son Ferdinand VII. Napoleon summoned both to Bayonne, where in early May he made them give up the crown, which he handed to his brother Joseph. On 2 May, as the last members of the royal family were being taken from Madrid, the people of the city rose against Marshal Murat’s troops. The rising was crushed, and through the night and the next day the French shot hundreds of prisoners.: Samtidigt strömmade franska trupper in i Spanien, Napoleons allierade, och i februari och mars 1808 tog de genom list gränsfästningarna Pamplona, Barcelona, Figueres och San Sebastián. Den 17–19 mars störtade ett upplopp vid slottet i Aranjuez Godoy och tvingade Karl IV att abdikera till förmån för sin son Ferdinand VII. Napoleon kallade båda till Bayonne, där han i början av maj tvingade dem att avstå kronan, som han gav till sin bror Joseph. Den 2 maj, när de sista medlemmarna av kungafamiljen fördes bort från Madrid, reste sig stadens invånare mot marskalk Murats trupper. Resningen slogs ned, och under natten och följande dag sköt fransmännen hundratals fångar.
