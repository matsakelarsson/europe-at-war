The allies attacked in four columns across the Zadorra. Joseph barely escaped, and the French lost some 8,000 men and almost all their artillery.: De allierade anföll i fyra kolonner över Zadorra. Joseph undkom med knapp nöd, och fransmännen förlorade omkring 8 000 man och nästan allt sitt artilleri.
