Townspeople fought the French in the streets, and two artillery officers, Daoíz and Velarde, died defending the Monteleón barracks. Goya painted the executions of the third of May in 1814.: Stadsborna bekämpade fransmännen på gatorna, och två artilleriofficerare, Daoíz och Velarde, stupade under försvaret av Monteleónkasernen. Goya målade avrättningarna den tredje maj 1814.
