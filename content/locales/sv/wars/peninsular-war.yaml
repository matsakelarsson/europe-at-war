Occupied by France and Spain, 1807–1808: Ockuperat av Frankrike och Spanien 1807–1808
The news from Madrid and Bayonne set Spain alight. Provincial juntas sprang up and declared war on France, and in June Portugal rose too. Zaragoza beat off a French siege through the summer. In Andalusia, General Dupont was surrounded at Bailén by General Castaños’s army, and on 22 July he surrendered with some 17,000 men, the first time a Napoleonic army had surrendered in open battle. Joseph fled Madrid after eleven days as king, and the French fell back behind the Ebro. In August a British army under Sir Arthur Wellesley landed in Portugal and beat Junot at Roliça and Vimeiro, but by the Convention of Cintra Junot’s army was shipped home to France in British ships.: Nyheterna från Madrid och Bayonne satte Spanien i brand. Provinsjuntor bildades och förklarade krig mot Frankrike, och i juni reste sig också Portugal. Zaragoza slog tillbaka en fransk belägring under hela sommaren. I Andalusien omringades general Dupont vid Bailén av general Castaños’ här, och den 22 juli kapitulerade han med omkring 17 000 man – första gången en napoleonsk armé kapitulerat i öppet fältslag. Joseph flydde från Madrid efter elva dagar som kung, och fransmännen drog sig tillbaka bakom Ebro. I augusti landsteg en brittisk armé under sir Arthur Wellesley i Portugal och slog Junot vid Roliça och Vimeiro, men genom konventionen i Cintra skeppades Junots armé hem till Frankrike på brittiska fartyg.
In the autumn Napoleon came to Spain himself with some 200,000 men, including much of his veteran Grande Armée. He scattered the badly coordinated Spanish armies one after another, and on 30 November forced the pass of Somosierra, where Polish light horse of the Imperial Guard charged straight up the road at the Spanish guns. Madrid surrendered on 4 December. Napoleon abolished the Inquisition and the feudal rights of the nobility, and put Joseph back on the throne. The prisoners of Bailén, promised repatriation, were instead held on the barren island of Cabrera in the Balearics, where thousands died.: På hösten kom Napoleon själv till Spanien med omkring 200 000 man, däribland stora delar av hans veteraner ur Grande Armée. Han skingrade de dåligt samordnade spanska arméerna en efter en, och den 30 november forcerade han passet vid Somosierra, där polska lätta ryttare ur kejserliga gardet anföll rakt uppför vägen mot de spanska kanonerna. Madrid kapitulerade den 4 december. Napoleon avskaffade inkvisitionen och adelns feodala rättigheter och satte åter Joseph på tronen. Fångarna från Bailén, som hade lovats hemsändning, hölls i stället på den karga ön Cabrera i Balearerna, där tusentals dog.
