On 19 March 1812 the Cortes at Cádiz proclaimed a constitution, nicknamed “La Pepa” after the feast of St Joseph. It declared the sovereignty of the nation, divided the powers of government, freed the press and gave the vote to most men, though it kept Catholicism as the only lawful religion. In the summer, with Napoleon’s best troops gone to Russia, Wellington advanced into León. At the Arapiles south of Salamanca on 22 July he caught Marshal Marmont’s army strung out on the march and broke it in a few hours, the victory that made his reputation as an attacking general.: Den 19 mars 1812 utfärdade Cortes i Cádiz en författning, med smeknamnet ”La Pepa” efter Josefsdagen. Den slog fast nationens suveränitet, delade upp statsmakten, införde tryckfrihet och gav rösträtt åt de flesta män, men behöll katolicismen som den enda tillåtna religionen. På sommaren, när Napoleons bästa trupper hade dragit till Ryssland, ryckte Wellington fram in i León. Vid Arapiles söder om Salamanca den 22 juli överraskade han marskalk Marmonts armé utdragen på marsch och krossade den på några timmar, den seger som gav honom ryktet som en anfallande fältherre.
Joseph fled Madrid, and Wellington entered the capital on 12 August to wild celebrations. The French gave up the siege of Cádiz on 24 August and evacuated Andalusia. But Wellington then failed to take the castle of Burgos in a month-long siege, and with French armies converging on him from north and south he had to abandon Madrid and retreat to the Portuguese border in November. The retreat in the autumn rain cost him thousands of men. Still, the year had cleared the French from southern Spain for good.: Joseph flydde från Madrid, och Wellington tågade in i huvudstaden den 12 augusti under vilt jubel. Fransmännen gav upp belägringen av Cádiz den 24 augusti och utrymde Andalusien. Men Wellington misslyckades sedan med att inta borgen i Burgos under en månadslång belägring, och med franska arméer på väg mot honom från norr och söder måste han överge Madrid och retirera till den portugisiska gränsen i november. Återtåget i höstregnet kostade honom tusentals man. Året hade ändå rensat södra Spanien från fransmän för gott.
