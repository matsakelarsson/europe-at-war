With Portugal free, Wellington turned to the border fortresses that guarded the roads into Spain, Ciudad Rodrigo and Almeida in the north and Badajoz in the south. In March 1811 a British and Spanish force from Cádiz won a bloody fight at Barrosa but failed to lift the siege. In May Masséna tried to relieve Almeida and was beaten at Fuentes de Oñoro, and twelve days later, at Albuera near Badajoz, a British, Portuguese and Spanish army under Beresford held off Soult in one of the bloodiest battles of the war. In the east Marshal Suchet stormed Tarragona in June, massacring defenders and townspeople, and took Valencia in January 1812. Napoleon annexed Catalonia to France that same month.: Med Portugal befriat vände sig Wellington mot gränsfästningarna som bevakade vägarna in i Spanien, Ciudad Rodrigo och Almeida i norr och Badajoz i söder. I mars 1811 vann en brittisk och spansk styrka från Cádiz en blodig strid vid Barrosa men lyckades inte häva belägringen. I maj försökte Masséna undsätta Almeida och slogs vid Fuentes de Oñoro, och tolv dagar senare, vid Albuera nära Badajoz, höll en brittisk, portugisisk och spansk armé under Beresford Soult stången i ett av krigets blodigaste slag. I öster stormade marskalk Suchet Tarragona i juni och massakrerade försvarare och stadsbor, och han intog Valencia i januari 1812. Napoleon annekterade Katalonien till Frankrike samma månad.
All over Spain guerrilla bands such as those of Francisco Espoz y Mina in Navarre and Juan Martín Díez, “El Empecinado”, in Castile ambushed convoys, killed couriers and stragglers, and tied down tens of thousands of French troops; the French answered with hostage-taking, hangings and burned villages. In January 1812 Wellington stormed Ciudad Rodrigo. On the night of 6 April his troops stormed the breaches of Badajoz, losing some 4,800 men in a few hours. Maddened, they then sacked the town for three days, raping, looting and killing its Spanish inhabitants.: Över hela Spanien lade gerillaband, som Francisco Espoz y Minas i Navarra och Juan Martín Díez’, ”El Empecinado”, i Kastilien, bakhåll för konvojer, dödade kurirer och eftersläntrare och band tiotusentals franska soldater; fransmännen svarade med gisslantagning, hängningar och brända byar. I januari 1812 stormade Wellington Ciudad Rodrigo. Natten den 6 april stormade hans trupper breschen i Badajoz och förlorade omkring 4 800 man på några timmar. Ursinniga plundrade de sedan staden i tre dagar, våldtog, rövade och dödade dess spanska invånare.
