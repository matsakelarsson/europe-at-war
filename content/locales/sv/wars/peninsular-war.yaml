Soult’s cavalry encircled Aréizaga’s army, the worst defeat a Spanish army suffered on home soil. It opened the way to Andalusia.: Soults kavalleri omringade Aréizagas armé, det värsta nederlag en spansk armé led på hemmaplan. Det öppnade vägen till Andalusien.
