# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
Pequot War: Pequotkriget
? A war between the Pequot, the strongest nation of what is now eastern Connecticut, and the English colonies of Massachusetts Bay, Plymouth and Connecticut, with the Mohegan under Uncas and the Narragansett as their allies. After years of rivalry over the trade in furs and wampum, the killing of two English traders, John Stone in 1634 and John Oldham in 1636, led Massachusetts to send John Endecott to burn villages on Block Island and on the Pequot coast in August 1636. The Pequot besieged Fort Saybrook and raided the Connecticut River towns. On 26 May 1637 a force under John Mason and John Underhill, with Mohegan and Narragansett warriors, set fire to the fortified Pequot town on the Mystic River and killed most of the people inside; estimates of the dead, most of them women, children and old people, range from 400 to 700. The surviving Pequot fled west and were defeated near Fairfield in July; their sachem Sassacus was killed by the Mohawk. Hundreds of captives were enslaved in New England or shipped to Bermuda and the West Indies, and the Treaty of Hartford in 1638 divided the survivors between the Mohegan and the Narragansett and forbade them to call themselves Pequot. The Mashantucket and Eastern Pequot nations survive today.
: Ett krig mellan pequoterna, den mäktigaste nationen i det som i dag är östra Connecticut, och de engelska kolonierna Massachusetts Bay, Plymouth och Connecticut, som hade mohegan under Uncas och narragansett som allierade. Efter år av rivalitet om handeln med pälsar och wampum ledde dödandet av två engelska handelsmän, John Stone 1634 och John Oldham 1636, till att Massachusetts i augusti 1636 sände John Endecott för att bränna byar på Block Island och längs pequotkusten. Pequoterna belägrade Fort Saybrook och gjorde räder mot orterna vid Connecticutfloden. Den 26 maj 1637 satte en styrka under John Mason och John Underhill, med krigare från mohegan och narragansett, eld på pequoternas befästa by vid Mystic River och dödade de flesta av dem som befann sig där; uppskattningarna av antalet döda, av vilka de flesta var kvinnor, barn och gamla, varierar från 400 till 700. De överlevande pequoterna flydde västerut och besegrades nära Fairfield i juli; deras sachem Sassacus dödades av mohawkerna. Hundratals fångar förslavades i New England eller skeppades till Bermuda och Västindien, och fördraget i Hartford 1638 fördelade de överlevande mellan mohegan och narragansett och förbjöd dem att kalla sig pequoter. Nationerna Mashantucket Pequot och Eastern Pequot lever kvar i dag.
