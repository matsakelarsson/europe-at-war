# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
Perak War: Perakkriget
? A brief war in the Malay state of Perak that followed the killing of the first British Resident, J. W. W. Birch, at Pasir Salak on 2 November 1875. Under the Pangkor Engagement of January 1874, the British had recognised Raja Abdullah as sultan over his rival Raja Ismail, and Abdullah had accepted a Resident whose advice he was bound to follow except in matters of religion and Malay custom. Birch’s attempts to take over the collection of taxes, to free debt-bondsmen and to rule through proclamations angered the sultan and the chiefs, who agreed in July 1875 that he should be removed; followers of the Maharaja Lela speared him in his bath-house on the Perak River. The British brought troops from the Straits, India and Hong Kong, took Pasir Salak on 15 November 1875 after a first attack had failed, and broke the resistance along the Perak River in the following months. The Maharaja Lela surrendered in July 1876 and was hanged at Matang with the Dato’ Sagor on 20 January 1877; Sultan Abdullah, the Mantri of Larut and other chiefs were exiled to the Seychelles. Perak remained under a British Resident, and the war fixed the pattern of British rule through Residents in the Malay states.
: Ett kort krig i den malajiska staten Perak som följde på mordet på den förste brittiske residenten, J. W. W. Birch, vid Pasir Salak den 2 november 1875. Genom Pangkoröverenskommelsen i januari 1874 hade britterna erkänt Raja Abdullah som sultan framför hans rival Raja Ismail, och Abdullah hade godtagit en resident vars råd han var skyldig att följa utom i frågor som rörde religion och malajisk sedvänja. Birchs försök att ta över skatteuppbörden, befria skuldslavar och styra genom proklamationer väckte vrede hos sultanen och hövdingarna, som i juli 1875 kom överens om att han skulle avlägsnas; anhängare till Maharaja Lela dödade honom med spjut i hans badhus vid Perakfloden. Britterna förde dit trupper från Straits Settlements, Indien och Hongkong, intog Pasir Salak den 15 november 1875 sedan ett första anfall hade misslyckats, och bröt under de följande månaderna motståndet längs Perakfloden. Maharaja Lela gav upp i juli 1876 och hängdes i Matang tillsammans med Dato’ Sagor den 20 januari 1877; sultan Abdullah, mantrin av Larut och andra hövdingar förvisades till Seychellerna. Perak förblev under en brittisk resident, och kriget lade fast mönstret för det brittiska styret genom residenter i de malajiska staterna.
