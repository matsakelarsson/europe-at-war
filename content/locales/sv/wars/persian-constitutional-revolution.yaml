Persian Constitutional Revolution: Persiska konstitutionella revolutionen
The revolution that gave Iran its first constitution and parliament, and the civil war that followed. Protests by merchants, clerics and reformers forced Mozaffar ad-Din Shah to grant an elected assembly (Majlis) in 1906. His son Mohammad Ali Shah had the Majlis shelled in 1908, but Tabriz held out through a long siege, and in 1909 constitutionalist forces from Gilan and the Bakhtiari tribes took Tehran and deposed him. Russian intervention, with British acquiescence, ended the revolutionary period in December 1911.: Revolutionen som gav Iran dess första författning och parlament, och det inbördeskrig som följde. Protester från köpmän, religiösa lärde och reformivrare tvingade Mozaffar ad-Din shah att bevilja en vald församling (Majlis) 1906. Hans son Mohammad Ali shah lät beskjuta Majlis 1908, men Tabriz höll ut under en lång belägring, och 1909 intog konstitutionalistiska styrkor från Gilan och bakhtiaristammarna Teheran och avsatte honom. Ett ryskt ingripande, med Storbritanniens tysta medgivande, gjorde slut på den revolutionära perioden i december 1911.
