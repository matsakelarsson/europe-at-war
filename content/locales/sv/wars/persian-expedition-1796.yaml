Persian Expedition of 1796: Persiska fälttåget 1796
In September 1795 Agha Mohammad Khan Qajar, who was restoring Persian rule over the Caucasus, defeated King Erekle II of Kartli-Kakheti at Krtsanisi and sacked Tbilisi, because Erekle had placed eastern Georgia under Russian protection in the Treaty of Georgievsk (1783). The city was burned, many of its people were massacred and some 15,000 captives were carried off to Persia, while Russia sent no help. In 1796 Catherine the Great sent an army under Count Valerian Zubov, which stormed Derbent in May and occupied Baku, Shamakhi and Ganja without a fight, but after Catherine’s death in November Emperor Paul recalled it. Agha Mohammad Khan was murdered at Shusha in 1797, and Russia annexed eastern Georgia in 1801.: I september 1795 besegrade Agha Mohammad Khan Qajar, som höll på att återupprätta det persiska styret över Kaukasus, kung Erekle II av Kartli-Kachetien vid Krtsanisi och plundrade Tbilisi, eftersom Erekle i Georgijevskfördraget (1783) hade ställt östra Georgien under ryskt beskydd. Staden brändes, många av dess invånare massakrerades och omkring 15 000 fångar fördes bort till Persien, medan Ryssland inte skickade någon hjälp. År 1796 sände Katarina den stora en armé under greve Valerian Zubov, som stormade Derbent i maj och besatte Baku, Sjamachi och Ganja utan strid, men efter Katarinas död i november kallade kejsar Paul hem den. Agha Mohammad Khan mördades i Sjusja 1797, och Ryssland annekterade östra Georgien 1801.
