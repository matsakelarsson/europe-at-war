The Battle of Krtsanisi was fought on 8–11 September 1795, with the decisive attack and the fall of Tbilisi on 11 September. Numbers for the armies and the dead differ between Georgian, Persian and Russian sources.: Slaget vid Krtsanisi utkämpades den 8–11 september 1795, med det avgörande anfallet och Tbilisis fall den 11 september. Siffrorna för härarna och de döda skiljer sig åt mellan georgiska, persiska och ryska källor.
Zubov’s army set out from Kizlyar in April 1796 and had reached the junction of the Kura and the Aras by November, when Paul ordered it home.: Zubovs armé bröt upp från Kizljar i april 1796 och hade i november nått sammanflödet mellan Kura och Aras, när Paul beordrade den hem.
