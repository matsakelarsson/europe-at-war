# Svenska översättningar av katalogtexten (våg 7); stegtexterna kommer senare.
British campaigns against the Qawasim: Brittiska fälttågen mot qawasim
Two expeditions sent by the East India Company’s government in Bombay, with Royal Navy ships, against the Qawasim (Al Qasimi), the maritime power of Ras al-Khaimah and Sharjah on the Arabian side of the Strait of Hormuz, with branches at Lingeh and on Qeshm on the Persian side. The British accused the Qawasim of piracy against Indian and British shipping, a charge that the historian and ruler of Sharjah Sultan bin Muhammad Al Qasimi has disputed as a pretext to end Arab competition in the India trade. The 1809 expedition burnt Ras al-Khaimah, Lingeh and Laft but did not end the conflict. In 1819 a much larger force took Ras al-Khaimah and Dhayah and destroyed the forts and larger ships along the coast, and in 1820 the sheikhs signed the General Maritime Treaty, the beginning of the British protectorate over what became known as the Trucial States, today’s United Arab Emirates.: Två expeditioner som Ostindiska kompaniets regering i Bombay sände ut, med fartyg ur Royal Navy, mot qawasim (Al Qasimi), sjömakten i Ras al-Khaimah och Sharjah på den arabiska sidan av Hormuzsundet, med förgreningar i Lingeh och på Qeshm på den persiska sidan. Britterna anklagade qawasim för sjöröveri mot indisk och brittisk sjöfart, en anklagelse som historikern och Sharjahs härskare Sultan bin Muhammad Al Qasimi har bestridit och betecknat som en förevändning för att göra slut på den arabiska konkurrensen i Indienhandeln. Expeditionen 1809 brände Ras al-Khaimah, Lingeh och Laft men gjorde inte slut på konflikten. År 1819 intog en mycket större styrka Ras al-Khaimah och Dhayah och förstörde forten och de större fartygen längs kusten, och 1820 undertecknade shejkerna det allmänna sjöfördraget (General Maritime Treaty), början på det brittiska protektoratet över det som kom att kallas Fördragsstaterna (Trucial States), dagens Förenade Arabemiraten.
