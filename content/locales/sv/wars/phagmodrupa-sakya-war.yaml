# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
Phagmodrupa–Sakya war: Kriget mellan Phagmodrupa och Sakya
? The struggle in which Changchub Gyaltsen, lord of the Phagmodru myriarchy in Ü, overthrew the Sakya regime that had governed Tibet for the Yuan emperors. He had fought the neighbouring Yazang myriarchy over land since the 1330s, and when he drove back a new Yazang attack in 1346, the Sakya ponchen (chief administrator) Gyalwa Zangpo lured him to a meeting at a bridge, seized him and took him to Sakya, where he was tortured; his retainers still refused to give up his castle at Nedong. Gyalwa Zangpo, who feared his rival Wangtson more, released him after some months to gain an ally. Changchub Gyaltsen beat off Wangtson’s attack and by 1349 held most of Ü, Lhasa included. In 1353 a coalition of Sakya, Drikung, Yazang and other lords attacked him and was driven back, and in 1354, when Gyalwa Zangpo asked for his help against his enemies in Tsang, Changchub Gyaltsen’s general Rinchen Zangpo won a battle on the Shab river and marched on Sakya. Fighting was halted; Sakya kept only its own lands, and most of Tsang came under Phagmodru. Tibetan tradition dates the end of Sakya rule to 1354, though feuds within Sakya went on until 1358, when Changchub Gyaltsen defeated Wangtson and left a garrison at Sakya. The Yuan court, fighting the Red Turbans, accepted the change and gave him the title tai situ in 1357. Ruling from Nedong as regent (desi), he replaced the Mongol administration with districts under castle governors (dzongpon) and revived the laws of the old Tibetan kings; the Phagmodrupa were the leading power in Tibet until the civil war of 1434.
: Den kamp under vilken Changchub Gyaltsen, herre över myriarkin Phagmodru i Ü, störtade den Sakyaregim som hade styrt Tibet åt Yuankejsarna. Han hade sedan 1330-talet stridit mot den angränsande myriarkin Yazang om land, och när han 1346 slog tillbaka ett nytt angrepp från Yazang lockade Sakyas ponchen (högste administratör) Gyalwa Zangpo honom till ett möte vid en bro, grep honom och förde honom till Sakya, där han torterades; hans män vägrade ändå att överlämna hans borg i Nedong. Gyalwa Zangpo, som fruktade sin rival Wangtson mer, släppte honom efter några månader för att vinna en bundsförvant. Changchub Gyaltsen slog tillbaka Wangtsons angrepp och behärskade 1349 större delen av Ü, inklusive Lhasa. År 1353 angrep en koalition av Sakya, Drikung, Yazang och andra herrar honom men drevs tillbaka, och 1354, när Gyalwa Zangpo bad om hans hjälp mot sina fiender i Tsang, vann Changchub Gyaltsens fältherre Rinchen Zangpo ett slag vid floden Shab och tågade mot Sakya. Striderna avbröts; Sakya behöll endast sina egna länder, och större delen av Tsang kom under Phagmodru. Den tibetanska traditionen daterar slutet på Sakyas styre till 1354, även om fejderna inom Sakya fortsatte till 1358, då Changchub Gyaltsen besegrade Wangtson och lämnade en garnison i Sakya. Yuanhovet, som kämpade mot de röda turbanerna, godtog förändringen och gav honom titeln tai situ 1357. Han styrde från Nedong som regent (desi), ersatte den mongoliska förvaltningen med distrikt under borgfogdar (dzongpon) och återupplivade de gamla tibetanska kungarnas lagar; Phagmodrupa var den ledande makten i Tibet fram till inbördeskriget 1434.
