# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
Philippine–American War: Filippinsk-amerikanska kriget
? The war between the First Philippine Republic and the United States, which had bought the Philippines from Spain in the Treaty of Paris of December 1898. Fighting broke out around Manila on 4 February 1899, two days before the United States Senate ratified the treaty. In 1899 the American army drove the Republic’s forces from Malolos and the plain of central Luzon, took the main towns of the Visayas, and in November forced President Emilio Aguinaldo to disband his army and flee into the mountains of the north; at Tirad Pass his rearguard under Gregorio del Pilar died covering his escape. The Republic’s generals then fought a guerrilla war in their own provinces, which the Americans met with garrisons in hundreds of towns, the burning of villages, torture, and the concentration of civilians in zones where many died of hunger and disease. Aguinaldo was captured at Palanan in March 1901. After the killing of most of an American company at Balangiga on Samar in September 1901, General Jacob H. Smith ordered Samar turned into “a howling wilderness”; in Batangas General J. Franklin Bell’s reconcentration forced Miguel Malvar to surrender in April 1902. President Theodore Roosevelt declared the war over on 4 July 1902, but resistance went on for years, and the Moros of the south fought on in the Moro Rebellion. More than 4,200 American soldiers and some 16,000 to 20,000 Filipino soldiers died; modern estimates of Filipino civilian deaths, mostly from famine and disease, are around 200,000 to 250,000, with older estimates far higher.
: Kriget mellan Första filippinska republiken och USA, som hade köpt Filippinerna av Spanien genom freden i Paris i december 1898. Striderna bröt ut runt Manila den 4 februari 1899, två dagar innan USA:s senat ratificerade fördraget. Under 1899 drev den amerikanska armén republikens styrkor från Malolos och slätten på centrala Luzon, intog de viktigaste städerna på Visayaöarna och tvingade i november president Emilio Aguinaldo att upplösa sin armé och fly till bergen i norr; vid Tiradpasset stupade hans eftertrupp under Gregorio del Pilar när den täckte hans flykt. Republikens generaler förde därefter ett gerillakrig i sina egna provinser, som amerikanerna mötte med garnisoner i hundratals orter, nedbränning av byar, tortyr och koncentration av civila i zoner där många dog av svält och sjukdomar. Aguinaldo tillfångatogs i Palanan i mars 1901. Sedan större delen av ett amerikanskt kompani hade dödats i Balangiga på Samar i september 1901 beordrade general Jacob H. Smith att Samar skulle förvandlas till ”en ylande vildmark”; i Batangas tvingade general J. Franklin Bells rekoncentrationspolitik Miguel Malvar att ge upp i april 1902. President Theodore Roosevelt förklarade kriget avslutat den 4 juli 1902, men motståndet fortsatte i flera år, och morerna i söder stred vidare i Moroupproret. Mer än 4 200 amerikanska soldater och omkring 16 000 till 20 000 filippinska soldater dog; moderna uppskattningar av antalet döda filippinska civila, främst till följd av svält och sjukdomar, ligger kring 200 000 till 250 000, medan äldre uppskattningar är betydligt högre.
