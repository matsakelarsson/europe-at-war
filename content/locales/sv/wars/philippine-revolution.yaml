# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
Philippine Revolution: Filippinska revolutionen
? The armed revolt against Spanish rule that made the Philippines the first republic in Asia. The Katipunan, a secret society founded in Manila in 1892 by Andrés Bonifacio and others, rose in August 1896 after it was discovered. Around Manila the rising was soon contained, but in Cavite the revolutionaries held most of the province and defeated the Spanish at Binakayan in November. Spain executed the reformist writer José Rizal in December 1896 and sent reinforcements; its offensive of 1897 retook Cavite, and the rivalry between Bonifacio and Emilio Aguinaldo ended with Bonifacio’s execution in May. Aguinaldo held out at Biak-na-Bato until the pact of December 1897 sent him into exile in Hong Kong. When the United States went to war with Spain in 1898, he returned with American help after the battle of Manila Bay, his forces took most of Luzon, and on 12 June 1898 he proclaimed independence at Kawit. The Americans took Manila from the Spanish in August without letting the Filipinos in, the revolution spread to the Visayas, and in January 1899 the First Philippine Republic was inaugurated at Malolos, a month after Spain had ceded the islands to the United States in the Treaty of Paris.
: Det väpnade upproret mot det spanska styret som gjorde Filippinerna till Asiens första republik. Katipunan, ett hemligt sällskap som hade grundats i Manila 1892 av Andrés Bonifacio och andra, gjorde uppror i augusti 1896 sedan det hade upptäckts. Runt Manila hölls resningen snart i schack, men i Cavite behärskade revolutionärerna större delen av provinsen och besegrade spanjorerna vid Binakayan i november. Spanien avrättade den reformvänlige författaren José Rizal i december 1896 och sände förstärkningar; den spanska offensiven 1897 återtog Cavite, och rivaliteten mellan Bonifacio och Emilio Aguinaldo slutade med att Bonifacio avrättades i maj. Aguinaldo höll ut i Biak-na-Bato tills pakten i december 1897 sände honom i exil i Hongkong. När USA gick i krig med Spanien 1898 återvände han med amerikansk hjälp efter slaget i Manilabukten, hans styrkor tog större delen av Luzon, och den 12 juni 1898 utropade han självständigheten i Kawit. Amerikanerna tog Manila från spanjorerna i augusti utan att släppa in filippinierna, revolutionen spred sig till Visayaöarna, och i januari 1899 invigdes Första filippinska republiken i Malolos, en månad efter att Spanien hade avträtt öarna till USA genom freden i Paris.
