# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
Philippines campaign (1941–1942): Fälttåget i Filippinerna (1941–1942)
? Japan’s conquest of the Philippines, then a self-governing Commonwealth under American sovereignty, promised independence in 1946. Hours after the attack on Pearl Harbor, Japanese bombers from Formosa destroyed much of the American air force in the islands on the ground at Clark Field on 8 December 1941. The Japanese 14th Army under Lieutenant General Homma Masaharu landed in northern Luzon and on 22 December at Lingayen Gulf, and General Douglas MacArthur withdrew his United States Army Forces in the Far East (USAFFE), most of them Filipino soldiers, to the Bataan peninsula and the island fortress of Corregidor, leaving Manila an open city. Short of food and medicine and with no hope of relief, the defenders of Bataan held out until 9 April 1942, when some 76,000 Filipino and American soldiers surrendered, the largest surrender in American history; thousands of them died on the Bataan Death March. Corregidor fell on 6 May, and the last forces in the southern islands surrendered by early June. Many Filipino soldiers who escaped the surrender became guerrillas, and the islands stayed under Japanese occupation until the American return in October 1944.
: Japans erövring av Filippinerna, som då var ett självstyrande samvälde under amerikansk överhöghet med löfte om självständighet 1946. Några timmar efter anfallet mot Pearl Harbor förstörde japanska bombplan från Formosa en stor del av det amerikanska flygvapnet på öarna medan planen stod på marken vid Clark Field den 8 december 1941. Den japanska 14:e armén under generallöjtnant Homma Masaharu landsteg på norra Luzon och den 22 december vid Lingayenbukten, och general Douglas MacArthur drog tillbaka sina amerikanska arméstyrkor i Fjärran Östern (USAFFE), som till största delen bestod av filippinska soldater, till Bataanhalvön och öfästningen Corregidor och lämnade Manila som öppen stad. Med brist på mat och medicin och utan hopp om undsättning höll Bataans försvarare ut till den 9 april 1942, då omkring 76 000 filippinska och amerikanska soldater kapitulerade, den största kapitulationen i amerikansk historia; tusentals av dem dog under dödsmarschen från Bataan. Corregidor föll den 6 maj, och de sista styrkorna på de södra öarna hade kapitulerat i början av juni. Många filippinska soldater som undkom kapitulationen blev gerillakrigare, och öarna förblev under japansk ockupation tills amerikanerna återvände i oktober 1944.
