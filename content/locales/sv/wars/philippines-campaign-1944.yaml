# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
Philippines campaign (1944–1945): Fälttåget i Filippinerna (1944–1945)
? The American and Filipino reconquest of the Philippines from Japan. On 20 October 1944 the US Sixth Army landed on Leyte, and General Douglas MacArthur, who had left in 1942 promising to return, waded ashore with President Sergio Osmeña of the Commonwealth. Japan threw its navy against the landing, and in the battle of Leyte Gulf on 23–26 October, the largest naval battle in history, the Japanese fleet was defeated and ceased to be a fighting force; the first organised kamikaze attacks were made there. After two months of fighting on Leyte, American forces landed on Mindoro in December and at Lingayen Gulf on Luzon on 9 January 1945. Manila was retaken in a month of street fighting in February, in which Japanese naval troops killed many thousands of civilians and the old city was destroyed; some 100,000 people died. While the Eighth Army and Filipino guerrillas took the southern islands, General Yamashita Tomoyuki’s army held out in the mountains of northern Luzon until Japan’s surrender, and Yamashita surrendered at Baguio on 3 September 1945. The campaign cost Japan over 300,000 dead, many of them from hunger and disease, and devastated the islands; the Philippines became independent on 4 July 1946.
: Den amerikanska och filippinska återerövringen av Filippinerna från Japan. Den 20 oktober 1944 landsteg den amerikanska sjätte armén på Leyte, och general Douglas MacArthur, som hade lämnat öarna 1942 med löftet att återvända, vadade i land tillsammans med samväldets president Sergio Osmeña. Japan kastade in sin flotta mot landstigningen, och i slaget vid Leytebukten den 23–26 oktober, det största sjöslaget i historien, besegrades den japanska flottan och upphörde att vara en stridsduglig styrka; där genomfördes också de första organiserade kamikazeanfallen. Efter två månaders strider på Leyte landsteg amerikanska styrkor på Mindoro i december och vid Lingayenbukten på Luzon den 9 januari 1945. Manila återtogs efter en månads gatustrider i februari, då japanska marinsoldater dödade många tusen civila och den gamla staden förstördes; omkring 100 000 människor dog. Medan åttonde armén och filippinska gerillasoldater intog de södra öarna höll general Yamashita Tomoyukis armé ut i bergen på norra Luzon fram till Japans kapitulation, och Yamashita kapitulerade i Baguio den 3 september 1945. Fälttåget kostade Japan över 300 000 döda, många av dem genom svält och sjukdomar, och ödelade öarna; Filippinerna blev självständiga den 4 juli 1946.
