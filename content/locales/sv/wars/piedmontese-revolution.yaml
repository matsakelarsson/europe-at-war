Piedmontese Revolution of 1821: Piemontesiska revolutionen 1821
A short-lived liberal revolution in the Kingdom of Sardinia. On 10 March 1821 officers led by Count Santorre di Santarosa raised the garrison of Alessandria, demanding the Spanish constitution of 1812 and war with Austria, and Turin followed two days later. King Victor Emmanuel I abdicated in favour of his brother Charles Felix, who was away in Modena, and the young regent, Prince Charles Albert, proclaimed the constitution. Charles Felix disowned it and ordered Charles Albert to leave. Loyal troops under General Vittorio Sallier de La Tour, with an Austrian corps under Ferdinand von Bubna, defeated the constitutionalists near Novara on 8 April 1821, and Austrian troops occupied Alessandria until 1823. Santarosa and many others went into exile; he was killed fighting for Greek independence in 1825.: En kortlivad liberal revolution i kungariket Sardinien. Den 10 mars 1821 fick officerare under greve Santorre di Santarosa garnisonen i Alessandria att resa sig med krav på 1812 års spanska författning och krig mot Österrike, och Turin följde två dagar senare. Kung Viktor Emanuel I abdikerade till förmån för sin bror Karl Felix, som befann sig i Modena, och den unge regenten, prins Karl Albert, utropade författningen. Karl Felix tog avstånd från den och beordrade Karl Albert att lämna landet. Lojala trupper under general Vittorio Sallier de La Tour, med en österrikisk kår under Ferdinand von Bubna, besegrade konstitutionalisterna nära Novara den 8 april 1821, och österrikiska trupper höll Alessandria besatt till 1823. Santarosa och många andra gick i exil; han stupade 1825 i kampen för Greklands självständighet.
