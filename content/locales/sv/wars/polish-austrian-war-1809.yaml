The result of Raszyn is disputed. The Austrians took Warsaw, which was their aim; Polish historians stress that the Polish army escaped intact and went on to win the campaign.: Utgången av slaget vid Raszyn är omstridd. Österrikarna intog Warszawa, vilket var deras mål; polska historiker betonar att den polska armén undkom intakt och sedan vann fälttåget.
Russia entered the war in June 1809 as France’s ally under the Treaty of Tilsit, but its commander in Galicia had orders to help the Poles as little as possible.: Ryssland gick in i kriget i juni 1809 som Frankrikes allierade enligt freden i Tilsit, men dess befälhavare i Galizien hade order att hjälpa polackerna så lite som möjligt.
Polish and Saxon moves: Polska och sachsiska trupprörelser
When Austria went to war with Napoleon in April 1809, it sent Archduke Ferdinand of Austria-Este with an army corps into the Duchy of Warsaw, the Polish state Napoleon had created two years earlier. On 19 April Prince Józef Poniatowski met him at Raszyn, just south-west of Warsaw, with Polish and Saxon troops numbering about half as many. The Poles held their positions along the marshy Utrata until nightfall, then withdrew, and neither side was decisively beaten.: När Österrike gick i krig mot Napoleon i april 1809 sände det ärkehertig Ferdinand av Österrike-Este med en armékår in i hertigdömet Warszawa, den polska stat som Napoleon hade skapat två år tidigare. Den 19 april mötte furst Józef Poniatowski honom vid Raszyn, strax sydväst om Warszawa, med polska och sachsiska trupper som var ungefär hälften så många. Polackerna höll sina ställningar längs den sumpiga Utrata till mörkrets inbrott och drog sig sedan tillbaka, och ingen av sidorna blev avgörande slagen.
Poniatowski judged Warsaw too hard to defend. He let the Austrians occupy the capital and took his army across the Vistula, keeping it whole. On the east bank General Michał Sokolnicki beat the Austrians besieging the suburb of Praga at Grochów on 26 April, and on 2–3 May routed them at Góra Kalwaria, destroying their half-built bridge. An Austrian thrust down the Vistula towards the fortress of Toruń also came to nothing.: Poniatowski bedömde att Warszawa var för svårt att försvara. Han lät österrikarna besätta huvudstaden och förde sin armé över Wisła, så att den förblev intakt. På östra stranden slog general Michał Sokolnicki den 26 april vid Grochów de österrikare som belägrade förstaden Praga, och den 2–3 maj slog han dem på flykten vid Góra Kalwaria och förstörde deras halvfärdiga bro. En österrikisk framstöt nedför Wisła mot fästningen Toruń ledde inte heller till något.
