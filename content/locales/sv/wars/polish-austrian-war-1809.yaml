Poniatowski’s Polish and Saxon troops held off an Austrian force about twice their size for a day, then fell back towards Warsaw.: Poniatowskis polska och sachsiska trupper höll en österrikisk styrka som var ungefär dubbelt så stor stången under en dag och drog sig sedan tillbaka mot Warszawa.
