Polish–Austrian War: Polsk-österrikiska kriget
A campaign of the War of the Fifth Coalition in which an Austrian corps invaded the Duchy of Warsaw and took its capital, while the Polish army under Prince Józef Poniatowski struck south into Austrian Galicia. At the Peace of Schönbrunn the Duchy gained West Galicia with Kraków, and Russia, nominally France’s ally, took the Tarnopol district.: Ett fälttåg under femte koalitionskriget där en österrikisk kår invaderade hertigdömet Warszawa och intog dess huvudstad, medan den polska armén under furst Józef Poniatowski slog till söderut in i österrikiska Galizien. Vid freden i Schönbrunn fick hertigdömet Västgalizien med Kraków, och Ryssland, formellt Frankrikes allierade, tog Tarnopoldistriktet.
