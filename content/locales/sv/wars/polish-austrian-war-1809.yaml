May 1809: maj 1809
The Polish-held fortress on the lower Vistula was besieged, and the Austrians gave up the siege as Poniatowski threatened their supply lines.: Den polskkontrollerade fästningen vid nedre Wisła belägrades, och österrikarna gav upp belägringen när Poniatowski hotade deras förbindelselinjer.
Towards Toruń: Mot Toruń
Instead of retaking Warsaw, Poniatowski marched south-east into Austrian Galicia, the lands Austria had taken in the partitions. His troops took Lublin on 14 May, Sandomierz on 18 May and the fortress of Zamość on 20 May, and a cavalry force reached Lwów on 27 May. Archduke Ferdinand left Warsaw on 1 June and came south. He beat General Józef Zajączek at Jedlińsk on 11 June and retook Sandomierz and Lwów.: I stället för att återta Warszawa tågade Poniatowski sydost in i österrikiska Galizien, de landområden som Österrike hade tagit vid delningarna. Hans trupper intog Lublin den 14 maj, Sandomierz den 18 maj och fästningen Zamość den 20 maj, och en kavalleristyrka nådde Lwów den 27 maj. Ärkehertig Ferdinand lämnade Warszawa den 1 juni och drog söderut. Han slog general Józef Zajączek vid Jedlińsk den 11 juni och återtog Sandomierz och Lwów.
On 3 June a Russian army entered Galicia as France’s ally, though its commander, Prince Sergei Golitsyn, did little to help the Poles. After Napoleon’s victory at Wagram in early July Austria sought an armistice, and on 15 July Poniatowski entered Kraków. By the Peace of Schönbrunn on 14 October, Austria ceded West Galicia with Kraków to the Duchy of Warsaw and the Tarnopol district to Russia. The two states also shared the income of the Wieliczka salt mines.: Den 3 juni ryckte en rysk armé in i Galizien som Frankrikes allierade, även om dess befälhavare, furst Sergej Golitsyn, gjorde lite för att hjälpa polackerna. Efter Napoleons seger vid Wagram i början av juli begärde Österrike vapenstillestånd, och den 15 juli tågade Poniatowski in i Kraków. Genom freden i Schönbrunn den 14 oktober avträdde Österrike Västgalizien med Kraków till hertigdömet Warszawa och Tarnopoldistriktet till Ryssland. De två staterna delade också på inkomsterna från saltgruvorna i Wieliczka.
