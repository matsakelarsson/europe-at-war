Polish–Czechoslovak War: Polsk-tjeckoslovakiska kriget
A short war, known in Czech as the Seven-Day War, over Teschen (Cieszyn Silesia), a former Austrian duchy with valuable coal mines and the railway linking Bohemia with Slovakia. Czechoslovak troops attacked the Polish-administered part of the region on 23 January 1919, while most of Poland’s army was fighting in eastern Galicia, and advanced to the Vistula before Allied pressure stopped them on 30–31 January. About 140 soldiers were killed, and Czechoslovak troops killed some 20 Polish prisoners at Stonava. A plebiscite planned for 1920 was abandoned, and on 28 July 1920 the Allied Conference of Ambassadors divided Teschen along the Olza, leaving the coalfield and a large Polish minority in Czechoslovakia. Poland seized that part, Zaolzie, in October 1938.: Ett kort krig, på tjeckiska kallat sjudagarskriget, om Teschen (Cieszyn-Schlesien), ett tidigare österrikiskt hertigdöme med värdefulla kolgruvor och järnvägen som förband Böhmen med Slovakien. Tjeckoslovakiska trupper anföll den polskförvaltade delen av regionen den 23 januari 1919, medan större delen av Polens armé stred i östra Galizien, och ryckte fram till Wisła innan påtryckningar från de allierade stoppade dem den 30–31 januari. Omkring 140 soldater dödades, och tjeckoslovakiska soldater dödade omkring 20 polska fångar vid Stonava. En folkomröstning som planerats till 1920 ställdes in, och den 28 juli 1920 delade de allierades ambassadörskonferens Teschen längs Olza, vilket lämnade kolfältet och en stor polsk minoritet i Tjeckoslovakien. Polen tog den delen, Zaolzie, i oktober 1938.
