Teschen is Cieszyn in Polish and Těšín in Czech. The town itself was divided in 1920, into Cieszyn in Poland and Český Těšín in Czechoslovakia. The 1920 decision also divided the small regions of Spiš and Orava between the two states.: Teschen heter Cieszyn på polska och Těšín på tjeckiska. Själva staden delades 1920, i Cieszyn i Polen och Český Těšín i Tjeckoslovakien. 1920 års beslut delade också de små regionerna Spiš och Orava mellan de två staterna.
A ceasefire agreement followed in Paris on 3 February 1919, setting a new demarcation line until the final division.: Ett avtal om eldupphör följde i Paris den 3 februari 1919 och fastställde en ny demarkationslinje fram till den slutliga delningen.
