Polish–Teutonic War, 1431–1435: Polsk-teutoniska kriget 1431–1435
A war fought alongside the Lithuanian civil war that followed Vytautas’s death, in which the Teutonic Order backed Švitrigaila against Poland and, from 1432, against Sigismund Kęstutaitis, Poland’s ally in Lithuania. The Order ravaged the Dobrzyń Land in 1431 before being beaten at Dąbki, and in 1433 a Polish army with Hussite allies from Bohemia marched through Pomerelia to the Baltic near Gdańsk. On 1 September 1435 Sigismund and his Polish allies routed Švitrigaila and the Livonian Order at Wiłkomierz (Pabaiskas), and the Peace of Brześć Kujawski on 31 December 1435 kept the border of 1422 and bound the Order to stop meddling in Lithuania.: Ett krig som utkämpades parallellt med det litauiska inbördeskriget efter Vytautas död, där Tyska orden stödde Švitrigaila mot Polen och från 1432 mot Sigismund Kęstutaitis, Polens bundsförvant i Litauen. Orden härjade Dobrzyńlandet 1431 innan den slogs vid Dąbki, och 1433 marscherade en polsk armé med hussitiska bundsförvanter från Böhmen genom Pomerellen till Östersjön nära Gdańsk. Den 1 september 1435 slog Sigismund och hans polska bundsförvanter Švitrigaila och Livländska orden på flykten vid Wiłkomierz (Pabaiskas), och freden i Brześć Kujawski den 31 december 1435 bevarade 1422 års gräns och förpliktade orden att sluta blanda sig i Litauens angelägenheter.
