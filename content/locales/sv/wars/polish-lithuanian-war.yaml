Polish–Lithuanian War: Polsk-litauiska kriget
An undeclared war between Poland and Lithuania over Vilnius and the Suwałki region, fought alongside the Polish–Soviet War and ended by a League of Nations ceasefire on 29 November 1920. Two days after the Suwałki Agreement of 7 October 1920 had left Vilnius on the Lithuanian side, General Lucjan Żeligowski, with Józef Piłsudski’s secret backing, staged a “mutiny” and took the city, where the Republic of Central Lithuania was proclaimed; Poland annexed it in 1922, and Lithuania refused diplomatic relations until 1938.: Ett oförklarat krig mellan Polen och Litauen om Vilnius och Suwałkiregionen, som utkämpades parallellt med polsk-sovjetiska kriget och avslutades genom en eldupphör förmedlad av Nationernas förbund den 29 november 1920. Två dagar efter att Suwałkiavtalet den 7 oktober 1920 hade lämnat Vilnius på den litauiska sidan iscensatte general Lucjan Żeligowski, med Józef Piłsudskis hemliga stöd, ett ”myteri” och intog staden, där Republiken Mellersta Litauen utropades; Polen annekterade den 1922, och Litauen vägrade upprätta diplomatiska förbindelser fram till 1938.
