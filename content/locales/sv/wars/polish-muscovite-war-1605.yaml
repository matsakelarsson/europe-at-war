The tsar’s commander Pyotr Basmanov held the fortress against the pretender, though Chernihiv, Putyvl and other border towns went over to him.: Tsarens befälhavare Pjotr Basmanov höll fästningen mot tronpretendenten, trots att Tjernihiv, Putyvl och andra gränsstäder gick över till honom.
Battle of Dobrynichi: Slaget vid Dobrynitji
