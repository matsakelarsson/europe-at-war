Skopin-Shuisky’s Russian army and De la Gardie’s mercenaries entered Moscow. The young prince died suddenly a few weeks later.: Skopin-Sjujskijs ryska armé och De la Gardies legosoldater tågade in i Moskva. Den unge fursten dog plötsligt några veckor senare.
Sigismund III: Sigismund III
Skopin and De la Gardie: Skopin och De la Gardie
Shuisky’s brother Dmitry marched west with a large Russian army and De la Gardie’s mercenaries to relieve Smolensk. Hetman Żółkiewski left the siege with a small, mostly cavalry force and met them at Klushino on 4 July 1610. About 7,000 Poles and Lithuanians, led by winged hussars, routed an army several times larger, by some estimates 30,000 or more, and many of the unpaid mercenaries changed sides or went home.: Sjujskijs bror Dmitrij tågade västerut med en stor rysk armé och De la Gardies legosoldater för att undsätta Smolensk. Hetman Żółkiewski lämnade belägringen med en liten styrka, mest kavalleri, och mötte dem vid Klusjino den 4 juli 1610. Omkring 7 000 polacker och litauer, med de bevingade husarerna i spetsen, slog en flera gånger större armé på flykten, enligt vissa uppskattningar 30 000 man eller fler, och många av de obetalda legosoldaterna bytte sida eller gick hem.
Tsar Vasily lost all support. The boyars deposed him in July and forced him to become a monk, and in August they agreed to make Sigismund’s son Władysław tsar, provided he became Orthodox. In early October Polish–Lithuanian troops were let into Moscow and garrisoned the Kremlin. Sigismund, still at Smolensk, then refused to let his son convert and began to claim the throne for himself, and Russian goodwill drained away.: Tsar Vasilij förlorade allt stöd. Bojarerna avsatte honom i juli och tvingade honom att bli munk, och i augusti gick de med på att göra Sigismunds son Władysław till tsar, förutsatt att han blev ortodox. I början av oktober släpptes polsk-litauiska trupper in i Moskva och lade en garnison i Kreml. Sigismund, som fortfarande låg vid Smolensk, vägrade då att låta sin son konvertera och började göra anspråk på tronen för egen del, och den ryska välviljan rann bort.
4 July 1610, Polish–Lithuanian victory: 4 juli 1610, polsk-litauisk seger
