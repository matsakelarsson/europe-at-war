October 1610: oktober 1610
The boyars let a Polish–Lithuanian garrison into Moscow. The deposed tsar was taken to Poland as a prisoner.: Bojarerna släppte in en polsk-litauisk garnison i Moskva. Den avsatte tsaren fördes som fånge till Polen.
Shein’s garrison still held out against the king’s army.: Sjeins garnison höll fortfarande ut mot kungens armé.
Żółkiewski: Żółkiewski
Dmitry Shuisky: Dmitrij Sjujskij
In March 1611 Muscovites rose against the garrison. The Poles held the Kremlin, and the fighting set large parts of Moscow on fire. A first Russian militia then besieged the Kremlin, but quarrels among its leaders broke it up. On 13 June 1611 Smolensk finally fell to an assault after twenty months, when a mine blew a breach in its walls. Many of the last defenders died when the powder stored in the cathedral exploded, and Shein was taken prisoner.: I mars 1611 reste sig moskoviterna mot garnisonen. Polackerna höll Kreml, och striderna satte stora delar av Moskva i brand. En första rysk milis belägrade sedan Kreml, men gräl mellan dess ledare splittrade den. Den 13 juni 1611 föll Smolensk slutligen vid en stormning efter tjugo månader, sedan en mina hade slagit en bresch i murarna. Många av de sista försvararna dog när krutet som förvarades i katedralen exploderade, och Sjein togs till fånga.
In the autumn of 1611 the merchant Kuzma Minin and Prince Dmitry Pozharsky raised a second militia at Nizhny Novgorod. It reached Moscow in August 1612 and drove off Hetman Jan Karol Chodkiewicz’s relief army in hard fighting in early September. The starving garrison, reduced according to its own diarists to cannibalism, surrendered in early November 1612. Early in 1613 an assembly of the land elected the 16-year-old Michael Romanov tsar.: Hösten 1611 satte köpmannen Kuzma Minin och furst Dmitrij Pozjarskij upp en andra milis i Nizjnij Novgorod. Den nådde Moskva i augusti 1612 och drev efter hårda strider i början av september bort hetman Jan Karol Chodkiewicz’ undsättningsarmé. Den svältande garnisonen, som enligt sina egna dagboksförare hade tvingats till kannibalism, kapitulerade i början av november 1612. I början av 1613 valde en riksförsamling den 16-årige Michail Romanov till tsar.
