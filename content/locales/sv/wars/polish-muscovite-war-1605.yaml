Żółkiewski’s hussars charged again and again until the Russian army broke. The foreign mercenaries negotiated their own terms.: Żółkiewskis husarer anföll gång på gång tills den ryska armén bröts. De utländska legosoldaterna förhandlade fram egna villkor.
Tsaryovo-Zaymishche: Tsarjovo-Zajmisjtje
