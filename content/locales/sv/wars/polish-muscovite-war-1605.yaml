Russia used the Julian calendar, ten days behind the Gregorian calendar used in Poland–Lithuania. Dates are New Style unless marked; Russian accounts of the same events are often ten days earlier.: Ryssland använde den julianska kalendern, som låg tio dagar efter den gregorianska kalender som användes i Polen–Litauen. Datumen anges enligt nya stilen om inget annat anges; ryska framställningar av samma händelser ligger ofta tio dagar tidigare.
Polish historians often treat the pretenders’ campaigns of 1604–1609 (the “Dymitriads”) as separate from the royal war of 1609–1618.: Polska historiker behandlar ofta tronpretendenternas fälttåg 1604–1609 (”dymitriaderna”) som skilda från det kungliga kriget 1609–1618.
The pretenders’ moves: Tronpretendenternas trupprörelser
Success for the pretenders: Tronpretendenternas framgångar
Swedish moves: Svenska trupprörelser
Russia’s old ruling dynasty died out in 1598, and a terrible famine in 1601–1603 undermined the elected tsar, Boris Godunov. In 1603 a young man appeared in Poland–Lithuania claiming to be Dmitry, the son of Ivan the Terrible who had died at Uglich in 1591. Magnates such as Jerzy Mniszech, whose daughter Marina he promised to marry, raised private troops for him. King Sigismund III gave quiet encouragement but kept the Commonwealth officially out of it.: Rysslands gamla härskardynasti dog ut 1598, och en fruktansvärd hungersnöd 1601–1603 undergrävde den valde tsaren Boris Godunovs ställning. År 1603 dök en ung man upp i Polen–Litauen och påstod sig vara Dmitrij, den son till Ivan den förskräcklige som hade dött i Uglitj 1591. Magnater som Jerzy Mniszech, vars dotter Marina han lovade att gifta sig med, satte upp privata trupper åt honom. Kung Sigismund III gav honom i tysthet uppmuntran men höll officiellt samväldet utanför.
In the autumn of 1604 “Dmitry” crossed into Muscovy with about 3,500 men from magnates’ private armies and hired troops, later joined by Cossacks. Beaten at Dobrynichi in January 1605, he was saved when Tsar Boris Godunov died that April and the tsar’s army went over to him. He entered Moscow on 30 June 1605 and was crowned, but his Polish entourage made him unpopular. On 27 May 1606, soon after his wedding to Marina, boyars led by Vasily Shuisky killed him, and several hundred Poles in Moscow were massacred. Shuisky became tsar.: Hösten 1604 gick ”Dmitrij” in i Moskvariket med omkring 3 500 man ur magnaternas privatarméer och legotrupper, och senare anslöt sig kosacker. Han slogs vid Dobrynitji i januari 1605 men räddades när tsar Boris Godunov dog i april samma år och tsarens armé gick över till honom. Han tågade in i Moskva den 30 juni 1605 och kröntes, men hans polska följe gjorde honom impopulär. Den 27 maj 1606, kort efter hans bröllop med Marina, dödades han av bojarer under ledning av Vasilij Sjujskij, och flera hundra polacker i Moskva massakrerades. Sjujskij blev tsar.
