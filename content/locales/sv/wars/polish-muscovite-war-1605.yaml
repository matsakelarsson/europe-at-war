The garrison gave up after a siege of more than a year. Russia now marks 4 November as National Unity Day in memory of the expulsion.: Garnisonen gav upp efter en belägring på mer än ett år. Ryssland högtidlighåller i dag den 4 november som den nationella enighetens dag till minne av fördrivningen.
Chodkiewicz: Chodkiewicz
Taken by Poland–Lithuania: Erövrat av Polen–Litauen
Władysław still claimed the Russian crown, and in 1617 the Sejm finally paid for one more campaign. With Chodkiewicz in real command, his army took Dorogobuzh and Vyazma that autumn but stalled before Mozhaysk. In 1618 Hetman Petro Sahaidachny’s Zaporozhian Cossacks swept up from the south, sacking Livny and Yelets, and joined the prince outside Moscow. A night assault on 10–11 October failed.: Władysław gjorde fortfarande anspråk på den ryska kronan, och 1617 bekostade sejmen till sist ännu ett fälttåg. Med Chodkiewicz som den verklige befälhavaren intog hans armé Dorogobuzj och Vjazma den hösten men körde fast framför Mozjajsk. År 1618 drog hetman Petro Sahajdatjnyjs zaporogkosacker upp från söder, plundrade Livny och Jelets och förenade sig med prinsen utanför Moskva. En nattlig stormning den 10–11 oktober misslyckades.
Both sides were exhausted. At Deulino, near the Trinity Monastery, they signed a truce on 11 December 1618 for fourteen and a half years. The Commonwealth kept Smolensk and gained the Chernihiv and Seversk lands, and reached its greatest extent. Prisoners were exchanged in 1619, among them the tsar’s father Filaret. Władysław did not give up his claim, and the next war came in 1632.: Båda sidor var utmattade. I Deulino, nära Treenighetsklostret, undertecknade de den 11 december 1618 ett stillestånd på fjorton och ett halvt år. Samväldet behöll Smolensk och vann Tjernihiv- och Severskområdena, och nådde därmed sin största utsträckning. Fångar utväxlades 1619, bland dem tsarens far Filaret. Władysław gav inte upp sitt anspråk, och nästa krig kom 1632.
