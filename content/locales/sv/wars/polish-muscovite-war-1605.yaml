May 1605: maj 1605
After Boris Godunov’s death the army besieging Kromy, led by Basmanov, declared for “Dmitry”, opening the road to Moscow.: Efter Boris Godunovs död förklarade sig armén som belägrade Kromy, ledd av Basmanov, för ”Dmitrij”, vilket öppnade vägen till Moskva.
“Dmitry” entered Moscow on 30 June 1605. Eleven months later he was murdered in the Kremlin and his Polish guests were hunted down in the streets.: ”Dmitrij” tågade in i Moskva den 30 juni 1605. Elva månader senare mördades han i Kreml och hans polska gäster jagades på gatorna.
False Dmitry: Falske Dmitrij
A second pretender, the “Thief of Tushino”, appeared in 1607 and was again backed by Polish and Lithuanian adventurers such as Roman Różyński and Jan Piotr Sapieha, and by Cossacks. From 1608 his camp at Tushino, just outside Moscow, rivalled the tsar’s court, and Marina Mniszech recognised him as her husband. Sapieha besieged the fortified Trinity Monastery north of Moscow for sixteen months, without success.: En andra tronpretendent, ”Tusjinotjuven”, dök upp 1607 och fick återigen stöd av polska och litauiska äventyrare som Roman Różyński och Jan Piotr Sapieha, och av kosacker. Från 1608 rivaliserade hans läger i Tusjino, strax utanför Moskva, med tsarens hov, och Marina Mniszech erkände honom som sin make. Sapieha belägrade det befästa Treenighetsklostret norr om Moskva i sexton månader, utan framgång.
Tsar Vasily Shuisky turned to Sweden, Poland’s enemy, and in February 1609 hired an army under Jacob De la Gardie. Sigismund III answered by invading Russia openly. On 29 September 1609 his army laid siege to Smolensk, the great fortress Lithuania had lost in 1514, defended by Mikhail Shein. The Tushino camp broke up, while Prince Mikhail Skopin-Shuisky and De la Gardie fought their way down from Novgorod and relieved Moscow in March 1610.: Tsar Vasilij Sjujskij vände sig till Sverige, Polens fiende, och i februari 1609 värvade han en armé under Jakob De la Gardie. Sigismund III svarade med att öppet invadera Ryssland. Den 29 september 1609 belägrade hans armé Smolensk, den stora fästning som Litauen hade förlorat 1514, försvarad av Michail Sjein. Lägret i Tusjino upplöstes, medan furst Michail Skopin-Sjujskij och De la Gardie kämpade sig söderut från Novgorod och undsatte Moskva i mars 1610.
Siege of Smolensk: Belägringen av Smolensk
