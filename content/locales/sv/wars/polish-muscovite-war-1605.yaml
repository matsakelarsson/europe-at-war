Polish–Muscovite War, 1605–1618: Polsk-moskovitiska kriget 1605–1618
During Russia’s Time of Troubles, Polish and Lithuanian backers of two pretenders, and then King Sigismund III himself, intervened in Muscovy. They won at Klushino and held the Moscow Kremlin for two years before being driven out, and the Truce of Deulino in 1618 left Smolensk and the Chernihiv–Seversk lands with the Commonwealth.: Under den stora oredan i Ryssland ingrep polska och litauiska anhängare till två tronpretendenter, och sedan kung Sigismund III själv, i storfurstendömet Moskva. De segrade vid Klusjino och höll Kreml i Moskva i två år innan de drevs ut, och stilleståndet i Deulino 1618 lämnade Smolensk och Tjernihiv-Seversk-länderna åt samväldet.
