Chodkiewicz tried to fight a supply convoy through to the Kremlin but was driven back by Pozharsky’s militia and the Cossacks.: Chodkiewicz försökte slå sig igenom till Kreml med en förrådskonvoj men drevs tillbaka av Pozjarskijs milis och kosackerna.
