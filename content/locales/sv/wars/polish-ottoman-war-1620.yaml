17–29 September 1620: 17–29 september 1620
The Polish camp beside the Prut held for twelve days but was surrounded, and many of the private troops deserted.: Det polska lägret vid Prut höll stånd i tolv dagar men omringades, och många av de privata trupperna deserterade.
