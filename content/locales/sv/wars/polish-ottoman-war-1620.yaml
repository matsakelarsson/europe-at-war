Polish–Ottoman War, 1620–1621: Polsk-osmanska kriget 1620–1621
A war over Moldavia and over Cossack and Tatar raiding. The Ottomans destroyed a Polish army at Cecora in 1620, but a year later the Commonwealth and the Zaporozhian Cossacks held their camp at Khotyn against Sultan Osman II, and the peace left the border on the Dniester.: Ett krig om Moldavien och om kosackernas och tatarernas plundringståg. Osmanerna förintade en polsk armé vid Cecora 1620, men ett år senare höll samväldet och zaporizjakosackerna sitt läger vid Chotyn mot sultan Osman II, och freden lämnade gränsen vid Dnjestr.
