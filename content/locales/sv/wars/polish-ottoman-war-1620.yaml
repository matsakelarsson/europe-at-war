6–7 October 1620: 6–7 oktober 1620
The retreating army was overrun a few miles short of the Dniester, near Mohyliv. The hetman refused to escape and was killed.: Den retirerande armén överrändes några engelska mil från Dnestr, nära Mohyliv. Hetmanen vägrade att fly och dödades.
Żółkiewski: Żółkiewski
In 1621 the young Sultan Osman II led a huge army north, with Tatar and Moldavian and Wallachian contingents, by most estimates well over 100,000 men. Lithuanian Grand Hetman Jan Karol Chodkiewicz entrenched about 30,000 Polish and Lithuanian troops beside the fortress of Khotyn on the Dniester, and some 25,000–40,000 Zaporozhian Cossacks under Hetman Petro Sahaidachny joined him.: År 1621 ledde den unge sultanen Osman II en väldig här norrut, med tatariska, moldaviska och valakiska kontingenter, enligt de flesta uppskattningar långt över 100 000 man. Den litauiske storhetmanen Jan Karol Chodkiewicz förskansade omkring 30 000 polska och litauiska soldater intill fästningen Chotyn vid Dnestr, och omkring 25 000–40 000 zaporogkosacker under hetman Petro Sahajdatjnyj anslöt sig till honom.
From 2 September the Ottomans attacked the camp again and again and were beaten off with heavy losses. Chodkiewicz, ill, handed over command to Stanisław Lubomirski and died on 24 September. With autumn coming and his army shrinking, Osman agreed to the Treaty of Khotyn on 9 October. The border stayed on the Dniester, the Commonwealth promised to curb the Cossacks and stop meddling in Moldavia, and the sultan to restrain the Tatars. Osman blamed his janissaries, and they killed him in a revolt the next year.: Från den 2 september anföll osmanerna lägret gång på gång och slogs tillbaka med svåra förluster. Chodkiewicz, som var sjuk, lämnade över befälet till Stanisław Lubomirski och dog den 24 september. Med hösten i antågande och en krympande armé gick Osman den 9 oktober med på freden i Chotyn. Gränsen förblev vid Dnestr, samväldet lovade att tygla kosackerna och sluta blanda sig i Moldaviens affärer, och sultanen att hålla tatarerna i schack. Osman lade skulden på sina janitsjarer, och de dödade honom under ett uppror året därpå.
