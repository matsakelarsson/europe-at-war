Dates are New Style (Gregorian), as used in Poland–Lithuania.: Datumen anges enligt nya stilen (den gregorianska kalendern), som användes i Polen–Litauen.
For decades Polish magnates had meddled in Moldavia, an Ottoman vassal, while Zaporozhian Cossacks raided Ottoman ports on the Black Sea and Tatars raided Poland–Lithuania in return. In 1620 the Moldavian prince Gaspar Graziani rebelled against the sultan and asked for help. The elderly Crown Grand Hetman Stanisław Żółkiewski crossed the Dniester with perhaps 5,000–9,000 men, many of them magnates’ private troops, but few Moldavians joined him.: I årtionden hade polska magnater blandat sig i Moldaviens affärer, en osmansk vasallstat, medan zaporogkosacker plundrade osmanska hamnar vid Svarta havet och tatarer i gengäld plundrade i Polen–Litauen. År 1620 gjorde den moldaviske fursten Gaspar Graziani uppror mot sultanen och bad om hjälp. Den åldrige kronstorhetmanen Stanisław Żółkiewski gick över Dnestr med kanske 5 000–9 000 man, många av dem magnaternas privata trupper, men få moldavier anslöt sig till honom.
From 17 September his camp at Cecora (Țuțora) on the Prut was attacked by Ottoman troops under Iskender Pasha and Tatars of Khan Temir. On 29 September the Poles began to retreat in a moving fort of wagons, fighting off attacks for a week. Close to the Dniester, on 6–7 October, the column broke up. Żółkiewski was killed and his head was sent to the sultan. Field Hetman Stanisław Koniecpolski was among the many taken prisoner, as was the young Bohdan Khmelnytsky, whose father died in the battle.: Från den 17 september anfölls hans läger vid Cecora (Țuțora) vid Prut av osmanska trupper under Iskender pasha och khan Temirs tatarer. Den 29 september började polackerna dra sig tillbaka i en rörlig vagnborg och slog tillbaka anfall i en vecka. Nära Dnestr, den 6–7 oktober, upplöstes kolonnen. Żółkiewski dödades och hans huvud sändes till sultanen. Fälthetmanen Stanisław Koniecpolski var bland de många som togs till fånga, liksom den unge Bohdan Chmelnytskyj, vars far stupade i slaget.
