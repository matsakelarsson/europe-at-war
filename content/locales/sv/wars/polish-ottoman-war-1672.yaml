5–14 October 1672: 5–14 oktober 1672
In ten days of hard riding Sobieski beat several Tatar raiding parties, among them at Niemirów and Komarno, and freed their captives.: Under tio dagars hård ridt slog Sobieski flera tatariska plundringsstyrkor, bland annat vid Niemirów och Komarno, och befriade deras fångar.
18 October 1672: 18 oktober 1672
Signed in the sultan’s camp. Poles remember it as one of the most humiliating treaties in their history.: Undertecknad i sultanens läger. Polackerna minns den som ett av de mest förödmjukande fördragen i sin historia.
Mehmed IV: Mehmed IV
Ceded to the Ottoman Empire: Avträtt till Osmanska riket
The Sejm voted money for an army instead of tribute. In November 1673 Sobieski, with about 30,000 Polish and Lithuanian troops, marched on the fortified Ottoman camp at Khotyn. After a freezing night his men stormed it at dawn on 11 November, and much of Hüseyin Pasha’s army was killed or drowned when the bridge over the Dniester collapsed. King Michael had died the day before, and in May 1674 the nobles elected Sobieski king as John III.: Sejmen beviljade pengar till en armé i stället för tribut. I november 1673 tågade Sobieski med omkring 30 000 polska och litauiska soldater mot det befästa osmanska lägret vid Chotyn. Efter en iskall natt stormade hans män lägret i gryningen den 11 november, och stora delar av Hüseyin pashas här dödades eller drunknade när bron över Dnestr rasade. Kung Mikael hade dött dagen innan, och i maj 1674 valde adeln Sobieski till kung som Johan III.
He could not win back Kamianets. In 1675 an Ottoman and Tatar army advanced again, and Sobieski beat it outside Lviv in August, while the small garrison of Terebovlia held out for three weeks. In 1676 a much larger Ottoman army besieged his camp at Żurawno on the Dniester for two weeks, and on 17 October the two sides made peace. Poland–Lithuania no longer had to pay tribute and got back part of Ukraine, but Podolia stayed Ottoman.: Han kunde inte vinna tillbaka Kamjanets. År 1675 ryckte en osmansk och tatarisk här åter fram, och Sobieski slog den utanför Lviv i augusti, medan den lilla garnisonen i Terebovlja höll ut i tre veckor. År 1676 belägrade en mycket större osmansk här hans läger vid Żurawno vid Dnestr i två veckor, och den 17 oktober slöt de båda sidorna fred. Polen–Litauen behövde inte längre betala tribut och fick tillbaka en del av Ukraina, men Podolien förblev osmanskt.
