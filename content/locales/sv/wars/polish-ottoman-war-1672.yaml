A garrison of a few hundred soldiers and townspeople under Jan Samuel Chrzanowski held the castle until relief came. His wife, Anna Dorota, is remembered for urging them on.: En garnison på några hundra soldater och stadsbor under Jan Samuel Chrzanowski höll borgen tills undsättning kom. Hans hustru, Anna Dorota, är ihågkommen för att ha manat dem att hålla ut.
Agreed in the besieged Polish camp. The Sejm never ratified it, but the border held until 1683.: Överenskommen i det belägrade polska lägret. Sejmen ratificerade den aldrig, men gränsen höll fram till 1683.
