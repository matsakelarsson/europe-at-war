Polish–Ottoman War, 1672–1676: Polsk-osmanska kriget 1672–1676
Sultan Mehmed IV, backing the Cossack hetman Petro Doroshenko, took the fortress of Kamianets and forced Poland–Lithuania to cede Podolia at Buchach in 1672. Jan Sobieski’s victory at Khotyn in 1673 helped make him king, but the Treaty of Żurawno in 1676 left Podolia Ottoman.: Sultan Mehmed IV, som stödde kosackhetmanen Petro Dorosjenko, intog fästningen Kamjanets och tvingade Polen–Litauen att avträda Podolien i Butjatj 1672. Jan Sobieskis seger vid Chotyn 1673 bidrog till att han blev kung, men freden i Żurawno 1676 lämnade Podolien osmanskt.
