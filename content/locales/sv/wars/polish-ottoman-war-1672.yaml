The garrison gave up after Ottoman guns and mines breached the old castle. As the troops withdrew the castle’s powder magazine exploded, killing Colonel Jerzy Wołodyjowski among others.: Garnisonen gav upp sedan osmanska kanoner och minor slagit breschar i den gamla borgen. När trupperna drog sig tillbaka exploderade borgens krutmagasin och dödade bland andra överste Jerzy Wołodyjowski.
