New king: Ny kung
August 1675: augusti 1675
The Ottomans held Podolia until the Treaty of Karlowitz in 1699; see the Great Turkish War.: Osmanerna behöll Podolien fram till freden i Karlowitz 1699; se det stora turkiska kriget.
Ukraine west of the Dnieper was still fought over after the Truce of Andrusovo. Its hetman, Petro Doroshenko, placed himself under the sultan in 1669, and in August 1672 Mehmed IV and his grand vizier Köprülü Fazıl Ahmed Pasha invaded with an army of perhaps 80,000. The Commonwealth, under the weak King Michael Korybut Wiśniowiecki and divided by noble feuds, was unready. Kamianets, the great fortress of Podolia, surrendered on 27 August after a siege of about ten days, and its cathedral became a mosque.: Ukraina väster om Dnepr var fortfarande omstritt efter stilleståndet i Andrusovo. Dess hetman, Petro Dorosjenko, ställde sig 1669 under sultanen, och i augusti 1672 föll Mehmed IV och hans storvesir Köprülü Fazıl Ahmed pasha in med en här på kanske 80 000 man. Samväldet, under den svage kungen Mikael Korybut Wiśniowiecki och splittrat av adelsfejder, var oförberett. Kamjanets, Podoliens stora fästning, kapitulerade den 27 augusti efter en belägring på omkring tio dagar, och dess katedral blev moské.
The Ottomans then besieged Lviv, while Tatar raiders spread across south-eastern Poland. Crown Grand Hetman Jan Sobieski, with only about 3,000 horsemen, struck at the raiding parties in October and freed many thousands of captives. But on 18 October the king’s envoys signed the Peace of Buchach. Podolia became an Ottoman province, the Bratslav lands and southern Kyiv region went to Doroshenko, and the Commonwealth was to pay an annual tribute of 22,000 ducats. The Sejm refused to ratify it.: Osmanerna belägrade sedan Lviv, medan tatariska plundrare spred sig över sydöstra Polen. Kronstorhetmanen Jan Sobieski, med bara omkring 3 000 ryttare, slog i oktober till mot plundringsstyrkorna och befriade många tusen fångar. Men den 18 oktober undertecknade kungens sändebud freden i Butjatj. Podolien blev en osmansk provins, Bratslavområdet och södra Kyivområdet gick till Dorosjenko, och samväldet skulle betala en årlig tribut på 22 000 dukater. Sejmen vägrade att ratificera freden.
