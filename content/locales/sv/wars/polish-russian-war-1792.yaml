The smaller Polish army fell back in Ukraine. On 18 June Prince Józef Poniatowski, the king’s nephew, turned on a Russian column at Zieleńce and beat it, and the king founded the Virtuti Militari order to reward the victors. On 18 July Tadeusz Kościuszko held the line of the Bug at Dubienka against a Russian force several times larger before withdrawing. In Lithuania the Russians beat the defenders at Mir and took Vilnius. In late July King Stanisław August, believing the war lost, joined the Confederation of Targowica, and the army was ordered to stop fighting.: Den mindre polska armén drog sig tillbaka i Ukraina. Den 18 juni vände sig furst Józef Poniatowski, kungens brorson, mot en rysk kolonn vid Zieleńce och slog den, och kungen instiftade orden Virtuti Militari för att belöna segrarna. Den 18 juli höll Tadeusz Kościuszko Buglinjen vid Dubienka mot en flera gånger större rysk styrka innan han drog sig tillbaka. I Litauen slog ryssarna försvararna vid Mir och intog Vilnius. I slutet av juli anslöt sig kung Stanisław August, som trodde att kriget var förlorat, till Targowicakonfederationen, och armén beordrades att upphöra med striderna.
The Targowica leaders had expected to rule under Russian protection. Instead, Prussia sent troops into Greater Poland in January 1793 and agreed a second partition with Russia. Surrounded by Russian soldiers, the last Sejm of the Commonwealth, at Grodno, approved it that summer and autumn. Russia took about 250,000 km² in Belarus and Ukraine, and Prussia about 58,000 km² with Poznań, Danzig and Toruń. The constitution was annulled.: Targowicaledarna hade räknat med att få styra under ryskt beskydd. I stället sände Preussen trupper in i Storpolen i januari 1793 och kom överens med Ryssland om en andra delning. Omringad av ryska soldater godkände samväldets sista sejm, i Grodno, delningen under sommaren och hösten. Ryssland tog omkring 250 000 km² i Belarus och Ukraina, och Preussen omkring 58 000 km² med Poznań, Danzig och Toruń. Författningen upphävdes.
