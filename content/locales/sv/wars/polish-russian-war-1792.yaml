While Russia was busy fighting the Ottomans and Sweden, the Great Sejm that met in Warsaw from 1788 set out to rebuild the state left weak after the First Partition of 1772. It allied with Prussia in 1790, and on 3 May 1791 it passed a new constitution, the first of its kind in Europe. It made the throne hereditary, abolished the liberum veto that let one deputy block the Sejm, gave townspeople new rights, placed peasants under the protection of the law and planned an army of 100,000.: Medan Ryssland var upptaget av krig mot osmanerna och Sverige satte sig den stora sejmen, som sammanträdde i Warszawa från 1788, för att bygga upp den stat som hade försvagats efter den första delningen 1772. Den slöt förbund med Preussen 1790, och den 3 maj 1791 antog den en ny författning, den första i sitt slag i Europa. Den gjorde tronen ärftlig, avskaffade liberum veto, som lät en enda deputerad blockera sejmen, gav stadsborna nya rättigheter, ställde bönderna under lagens beskydd och planerade en armé på 100 000 man.
Catherine II saw the reforms as a threat to Russian control. Once peace with the Ottomans was signed in January 1792, she backed a group of magnates led by Stanisław Szczęsny Potocki, Franciszek Ksawery Branicki and Seweryn Rzewuski. Their act of confederation, drawn up in St Petersburg in April, was proclaimed in the border town of Targowica on 14 May, and on 18 May nearly 100,000 Russian troops crossed into Poland and Lithuania. Prussia refused to honour its alliance.: Katarina II såg reformerna som ett hot mot den ryska kontrollen. Sedan freden med osmanerna undertecknats i januari 1792 stödde hon en grupp magnater under ledning av Stanisław Szczęsny Potocki, Franciszek Ksawery Branicki och Seweryn Rzewuski. Deras konfederationsakt, som utarbetats i Sankt Petersburg i april, utropades i gränsstaden Targowica den 14 maj, och den 18 maj gick nästan 100 000 ryska soldater in i Polen och Litauen. Preussen vägrade att uppfylla sina förbundsförpliktelser.
