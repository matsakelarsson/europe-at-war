War in Defence of the Constitution: Kriget till författningens försvar
Also called the Polish–Russian War of 1792. Catherine II sent her armies into Poland–Lithuania in support of the Confederation of Targowica, magnates opposed to the reforming Constitution of 3 May 1791. After three months the king gave in, and in 1793 Russia and Prussia carried out the Second Partition.: Kallas också polsk-ryska kriget 1792. Katarina II sände sina arméer in i Polen–Litauen till stöd för Targowicakonfederationen, magnater som motsatte sig den reformvänliga 3 maj-författningen från 1791. Efter tre månader gav kungen upp, och 1793 genomförde Ryssland och Preussen den andra delningen.
