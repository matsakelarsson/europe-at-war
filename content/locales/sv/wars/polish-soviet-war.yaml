The Peace of Riga was signed on 18 March 1921 by Poland and by Soviet Russia, acting also for Soviet Belarus, and Soviet Ukraine. It fixed a border far east of the Curzon Line, leaving western Belarus and western Volhynia in Poland, while Minsk and central Ukraine stayed Soviet. Poland recognised the Soviet republics and abandoned its alliance with Petliura, whose soldiers in Poland were interned. Belarusians and Ukrainians, who had hoped for states of their own, were divided between Poland and the Soviet Union.: Freden i Riga undertecknades den 18 mars 1921 av Polen och av Sovjetryssland, som också företrädde Sovjetbelarus, samt Sovjetukraina. Den fastställde en gräns långt öster om Curzonlinjen, som lämnade västra Belarus och västra Volynien åt Polen, medan Minsk och centrala Ukraina förblev sovjetiska. Polen erkände sovjetrepublikerna och övergav sitt förbund med Petljura, vars soldater i Polen internerades. Belarusier och ukrainare, som hade hoppats på egna stater, delades mellan Polen och Sovjetunionen.
About 100,000 Polish soldiers had been killed or gone missing, and Soviet losses were also heavy. Prisoners on both sides died in large numbers of disease, hunger and neglect, among them some 16,000–20,000 of about 80,000 Soviet prisoners held in Polish camps. Jewish communities suffered pogroms by soldiers of several armies, among them the shooting of 35 Jews by Polish troops in Pinsk in April 1919 and massacres by Budyonny’s cavalry in Ukraine.: Omkring 100 000 polska soldater hade dödats eller försvunnit, och även de sovjetiska förlusterna var svåra. Fångar på båda sidor dog i stort antal av sjukdomar, hunger och vanvård, bland dem omkring 16 000–20 000 av de omkring 80 000 sovjetiska fångar som hölls i polska läger. Judiska samhällen drabbades av pogromer utförda av soldater ur flera arméer, bland dem polska truppers arkebusering av 35 judar i Pinsk i april 1919 och massakrer utförda av Budjonnyjs kavalleri i Ukraina.
