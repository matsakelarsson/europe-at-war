Budyonny’s cavalry army, ordered north too late to help at Warsaw, turned on Zamość, which a Ukrainian division and Polish units held from 29 to 31 August. On 31 August Polish cavalry under Juliusz Rómmel beat Budyonny at Komarów, often called the greatest cavalry battle of the 20th century. In the north Tukhachevsky, reinforced, tried to hold a new line on the Niemen. From 20 September the Poles attacked at Grodno, while a flanking force marched through Lithuanian-held ground to Druskininkai and on towards Lida, behind the Soviet lines.: Budjonnyjs kavalleriarmé, som beordrats norrut för sent för att hjälpa till vid Warszawa, vände sig mot Zamość, som en ukrainsk division och polska förband höll den 29–31 augusti. Den 31 augusti slog polskt kavalleri under Juliusz Rómmel Budjonnyj vid Komarów, ofta kallat 1900-talets största kavalleristrid. I norr försökte Tuchatjevskij, förstärkt, hålla en ny linje vid Njemen. Från den 20 september anföll polackerna vid Grodno, medan en kringgående styrka tågade genom litauiskkontrollerat område till Druskininkai och vidare mot Lida, bakom de sovjetiska linjerna.
Grodno fell on 26 September and the Western Front fell back east in disorder, some of its divisions breaking up; Polish troops entered Minsk in mid-October. Both governments were exhausted. A preliminary peace was signed in Riga on 12 October and an armistice came into force on 18 October, with the front far east of the Curzon Line. Meanwhile, on 9 October, Polish troops under General Lucjan Żeligowski staged a “mutiny” and seized Vilnius from Lithuania.: Grodno föll den 26 september och västfronten drog sig tillbaka österut i oordning, och en del av dess divisioner upplöstes; polska trupper ryckte in i Minsk i mitten av oktober. Båda regeringarna var utmattade. En preliminär fred undertecknades i Riga den 12 oktober och ett vapenstillestånd trädde i kraft den 18 oktober, med fronten långt öster om Curzonlinjen. Samtidigt, den 9 oktober, iscensatte polska trupper under general Lucjan Żeligowski ett ”myteri” och tog Vilnius från Litauen.
