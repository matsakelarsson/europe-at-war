Polish–Soviet War: Polsk-sovjetiska kriget
A war between the reborn Polish state and Soviet Russia for the lands between them, today in Belarus, Lithuania and Ukraine. After Polish forces reached Kyiv and the Red Army reached the gates of Warsaw, Poland won the Battle of Warsaw in August 1920, and the Peace of Riga in March 1921 divided Belarus and Ukraine between Poland and the Soviet republics.: Ett krig mellan den återfödda polska staten och Sovjetryssland om områdena mellan dem, i dag i Belarus, Litauen och Ukraina. Sedan polska styrkor nått Kyiv och Röda armén nått Warszawas portar vann Polen slaget vid Warszawa i augusti 1920, och freden i Riga i mars 1921 delade Belarus och Ukraina mellan Polen och sovjetrepublikerna.
