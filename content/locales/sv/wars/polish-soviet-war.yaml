By mid-August three Soviet armies were closing on Warsaw from the east and north-east, while the 4th Army and a cavalry corps swung west along the East Prussian border towards the lower Vistula. Piłsudski and his chief of staff, Tadeusz Rozwadowski, planned to hold the bridgehead before the capital while a strike force gathered to the south-east on the Wieprz. Polish codebreakers were reading Soviet radio messages. The assault began on 12 August. Radzymin changed hands several times, and on 14 August General Władysław Sikorski’s 5th Army counter-attacked across the Wkra.: I mitten av augusti närmade sig tre sovjetiska arméer Warszawa från öster och nordost, medan 4:e armén och en kavallerikår svängde västerut längs den ostpreussiska gränsen mot nedre Wisła. Piłsudski och hans stabschef, Tadeusz Rozwadowski, planerade att hålla brohuvudet framför huvudstaden medan en anfallsstyrka samlades i sydost vid Wieprz. Polska kodknäckare läste de sovjetiska radiomeddelandena. Anfallet inleddes den 12 augusti. Radzymin bytte ägare flera gånger, och den 14 augusti gick general Władysław Sikorskis 5:e armé till motanfall över Wkra.
On 16 August Piłsudski’s strike force attacked north from the Wieprz into the thinly held Soviet flank, scattered the Mozyr Group and cut behind the armies before Warsaw. The Red Army fell back in disorder. By 25 August the pursuit had reached the East Prussian border, where the Soviet 4th Army and the cavalry corps crossed and were interned. Poland took more than 50,000 prisoners. Piłsudski’s political opponents called the victory the “Miracle on the Vistula”, crediting providence rather than him.: Den 16 augusti anföll Piłsudskis anfallsstyrka norrut från Wieprz in i den tunt bemannade sovjetiska flanken, skingrade Mozyrgruppen och skar av arméerna framför Warszawa bakifrån. Röda armén drog sig tillbaka i oordning. Den 25 augusti hade förföljandet nått den ostpreussiska gränsen, där den sovjetiska 4:e armén och kavallerikåren gick över och internerades. Polen tog mer än 50 000 fångar. Piłsudskis politiska motståndare kallade segern ”undret vid Wisła” och tillskrev försynen äran i stället för honom.
