As German troops withdrew from the east after the First World War, Polish and Soviet forces moved into the lands between them, and they first clashed at Bereza Kartuska on 14 February 1919. Poland’s head of state, Józef Piłsudski, hoped to build a federation with Lithuania, Belarus and Ukraine that would keep Russia at a distance. Polish troops took Vilnius in April 1919 and Minsk in August, and in January 1920, with Latvian forces, Daugavpils on the Daugava.: När de tyska trupperna drog sig tillbaka från öster efter första världskriget ryckte polska och sovjetiska styrkor in i områdena mellan dem, och de drabbade samman första gången vid Bereza Kartuska den 14 februari 1919. Polens statschef, Józef Piłsudski, hoppades bygga upp en federation med Litauen, Belarus och Ukraina som skulle hålla Ryssland på avstånd. Polska trupper intog Vilnius i april 1919 och Minsk i augusti, och i januari 1920, tillsammans med lettiska styrkor, Daugavpils vid Daugava.
On 21 April 1920 Piłsudski allied with Symon Petliura’s Ukrainian People’s Republic, which gave up its claim to eastern Galicia in return for military help against the Soviets. Polish and Ukrainian troops attacked four days later, took Zhytomyr on 26 April and entered Kyiv on 7 May. Many towns fell without a fight, because the Red Army withdrew rather than give battle. Its forces had not been destroyed, and few Ukrainians came forward to join Petliura.: Den 21 april 1920 slöt Piłsudski förbund med Symon Petljuras Ukrainska folkrepubliken, som avstod från sitt anspråk på östra Galizien i utbyte mot militär hjälp mot sovjeterna. Polska och ukrainska trupper anföll fyra dagar senare, intog Zjytomyr den 26 april och ryckte in i Kyiv den 7 maj. Många städer föll utan strid, eftersom Röda armén drog sig tillbaka i stället för att ta strid. Dess styrkor hade inte tillintetgjorts, och få ukrainare anmälde sig för att ansluta sig till Petljura.
