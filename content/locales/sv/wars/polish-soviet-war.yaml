Also called the Polish–Bolshevik War. Soviet Russia had adopted the Gregorian calendar in February 1918, so all dates are New Style.: Kallas också polsk-bolsjevikiska kriget. Sovjetryssland hade infört den gregorianska kalendern i februari 1918, så alla datum anges enligt nya stilen.
Lwów is today’s Lviv in Ukraine, and Vilnius was Wilno to Poles. Other places are named in their present-day forms.: Lwów är dagens Lviv i Ukraina, och Vilnius hette Wilno för polackerna. Andra platser anges med sina nuvarande namn.
