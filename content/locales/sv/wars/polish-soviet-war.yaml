On 14 May Mikhail Tukhachevsky’s Western Front attacked in northern Belarus and drove about 100 km into Polish-held territory before a Polish counter-attack pushed it back by 8 June. In the south Semyon Budyonny’s First Cavalry Army broke the Polish front on 5 June and wrecked Zhytomyr behind it. The Poles abandoned Kyiv on 10 June, destroying its bridges and power stations, and fell back west with Petliura’s army.: Den 14 maj anföll Michail Tuchatjevskijs västfront i norra Belarus och trängde omkring 100 km in i polskkontrollerat område innan ett polskt motanfall drev tillbaka den till den 8 juni. I söder bröt Semjon Budjonnyjs 1:a kavalleriarmé igenom den polska fronten den 5 juni och ödelade Zjytomyr bakom den. Polackerna övergav Kyiv den 10 juni, förstörde dess broar och kraftverk och drog sig tillbaka västerut tillsammans med Petljuras armé.
Tukhachevsky attacked again on 4 July with a much larger force. His order of the day declared that “over the corpse of White Poland lies the path to world conflagration”. Minsk fell on 11 July, Vilnius on 14 July, Grodno on 19 July and Brest on 29 July. On 11 July Britain proposed an armistice along a line later named after its foreign secretary, Lord Curzon, but the Soviet leadership pressed on. A Provisional Polish Revolutionary Committee, set up on 23 July, began to govern captured Polish territory from Białystok.: Tuchatjevskij anföll på nytt den 4 juli med en mycket större styrka. Hans dagorder förkunnade att ”över det vita Polens lik går vägen till världsbranden”. Minsk föll den 11 juli, Vilnius den 14 juli, Grodno den 19 juli och Brest den 29 juli. Den 11 juli föreslog Storbritannien ett vapenstillestånd längs en linje som senare uppkallades efter dess utrikesminister, lord Curzon, men den sovjetiska ledningen fortsatte framryckningen. En provisorisk polsk revolutionskommitté, som upprättades den 23 juli, började styra erövrat polskt område från Białystok.
