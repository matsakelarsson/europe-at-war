A small Polish-Lithuanian army under Chodkiewicz routed a much larger Swedish one under Charles IX.: En liten polsk-litauisk armé under Chodkiewicz slog en mycket större svensk armé under Karl IX på flykten.
The great Livonian port, then Polish, held out against Charles IX.: Den stora livländska hamnstaden, då polsk, höll stånd mot Karl IX.
Charles IX: Karl IX
Gustav II Adolf renewed the war on Sigismund. In September 1621 he took Riga, which his father had failed to capture, and by 1625 he had overrun Livonia, including Dorpat. On 17 January 1626 he beat a Polish-Lithuanian army at Wallhof, the first Swedish victory over the Commonwealth in open battle.: Gustav II Adolf förnyade kriget mot Sigismund. I september 1621 intog han Riga, som hans far inte hade lyckats erövra, och 1625 hade han lagt under sig Livland, däribland Dorpat. Den 17 januari 1626 slog han en polsk-litauisk armé vid Wallhof, den första svenska segern över samväldet i öppet fältslag.
"In July 1626 he landed in Prussia to strike at Danzig and the Vistula trade. There were Swedish successes at Mewe and Dirschau, where the king was badly wounded in 1627, but the Danzig fleet beat a Swedish squadron off Oliwa that November, and in June 1629 Stanisław Koniecpolski and Imperial troops mauled his army at Trzciana. France helped broker the Truce of Altmark on 26 September 1629: Sweden kept Livonia and tolls from the Prussian ports, and Gustav Adolf was free to turn to Germany.": "I juli 1626 landsteg han i Preussen för att slå mot Danzig och handeln på Weichsel. Svenskarna nådde framgångar vid Mewe och Dirschau, där kungen sårades svårt 1627, men Danzigs flotta slog en svensk eskader utanför Oliwa i november samma år, och i juni 1629 tilltygade Stanisław Koniecpolski och kejserliga trupper hans armé svårt vid Trzciana. Frankrike hjälpte till att förmedla stilleståndet i Altmark den 26 september 1629: Sverige behöll Livland och tullarna från de preussiska hamnarna, och Gustav Adolf fick fria händer att vända sig mot Tyskland."
