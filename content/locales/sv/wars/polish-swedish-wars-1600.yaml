A six-year truce brokered by France. Sweden kept Livonia north of the Düna and tolls from Prussian ports.: Ett sexårigt stillestånd som förmedlades av Frankrike. Sverige behöll Livland norr om Düna och tullarna från de preussiska hamnarna.
