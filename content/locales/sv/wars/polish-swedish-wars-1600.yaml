Riga: Riga
Duke Charles, king as Charles IX from 1604, carried the feud with Sigismund into Livonia, invading in 1600. The Polish-Lithuanian commander Jan Karol Chodkiewicz fought back.: Hertig Karl, kung som Karl IX från 1604, förde fejden med Sigismund in i Livland och föll in där 1600. Den polsk-litauiske befälhavaren Jan Karol Chodkiewicz slog tillbaka.
In September 1605 Charles left part of his army at Riga and went after Chodkiewicz’s much smaller force. At Kircholm on the Düna on 27 September 1605, the Polish-Lithuanian cavalry, winged hussars among them, smashed the Swedish army. Some historians call it the worst defeat in Swedish history. A truce in 1611 ended this round of the war with little changed.: I september 1605 lämnade Karl en del av sin armé vid Riga och gick mot Chodkiewicz’ mycket mindre styrka. Vid Kircholm vid Düna den 27 september 1605 krossade det polsk-litauiska kavalleriet, bland dem bevingade husarer, den svenska armén. Vissa historiker kallar det det värsta nederlaget i svensk historia. Ett stillestånd 1611 avslutade denna omgång av kriget med små förändringar.
Battle of Kircholm: Slaget vid Kircholm
27 September 1605: 27 september 1605
Polish-Lithuanian army: Polsk-litauisk armé
