Polish–Swedish wars, 1600–1629: Polsk-svenska krigen 1600–1629
Sweden and Poland–Lithuania, ruled by rival branches of the Vasa dynasty, fought on and off for Livonia and the Prussian coast. After a crushing Polish–Lithuanian victory at Kircholm in 1605, Gustav II Adolf took Riga and Livonia and invaded Prussia, and the Truce of Altmark in 1629 left most of Livonia Swedish.: Sverige och Polen–Litauen, som styrdes av rivaliserande grenar av Vasaätten, stred med avbrott om Livland och den preussiska kusten. Efter en förkrossande polsk-litauisk seger vid Kircholm 1605 intog Gustav II Adolf Riga och Livland och invaderade Preussen, och stilleståndet i Altmark 1629 lämnade större delen av Livland i svensk ägo.
