Polish–Teutonic War, 1326–1332: Polsk-teutoniska kriget 1326–1332
A war between the Kingdom of Poland under Władysław I the Elbow-high and the Teutonic Order, which had seized Gdańsk Pomerania in 1308 and was allied with King John of Bohemia. The Order overran Kuyavia and the Dobrzyń Land; the battle of Płowce on 27 September 1331 was hard fought and indecisive, and a truce in 1332 left the Order holding its conquests. By the Treaty of Kalisz in 1343 it returned Kuyavia and Dobrzyń, while Poland gave up its claim to Pomerania and the Chełmno Land.: Ett krig mellan kungariket Polen under Władysław I Łokietek och Tyska orden, som hade erövrat Gdańsk-Pommern 1308 och var allierad med kung Johan av Böhmen. Orden överskred Kujawien och Dobrzyńlandet; slaget vid Płowce den 27 september 1331 var hårt men oavgjort, och ett stillestånd 1332 lät orden behålla sina erövringar. Genom freden i Kalisz 1343 återlämnade den Kujawien och Dobrzyń, medan Polen avstod från sina anspråk på Pommern och Chełmnolandet.
