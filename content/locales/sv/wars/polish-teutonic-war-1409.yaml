Polish–Lithuanian–Teutonic War, 1409–1411: Polsk-litauisk-teutoniska kriget 1409–1411
A war between the Teutonic Order and the allied Kingdom of Poland and Grand Duchy of Lithuania, sparked by a revolt in Samogitia. The allies crushed the Order at Grunwald in July 1410 but failed to take Malbork, and the First Peace of Thorn in 1411 changed little on the map while leaving the Order heavily in debt.: Ett krig mellan Tyska orden och det allierade kungariket Polen och storfurstendömet Litauen, utlöst av ett uppror i Samogitien. De allierade krossade orden vid Grunwald i juli 1410 men lyckades inte inta Malbork, och den första freden i Thorn 1411 ändrade föga på kartan men lämnade orden djupt skuldsatt.
