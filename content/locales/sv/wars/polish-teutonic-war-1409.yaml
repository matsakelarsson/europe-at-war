The victors stayed three days on the battlefield and moved slowly, reaching Malbork only on 26 July. By then Heinrich von Plauen, left with about 3,000 men at Świecie, had reached the castle and organised its defence. Most Prussian towns and castles, Gdańsk, Toruń and Elbląg among them, submitted to Jagiełło, and only eight castles held out. But Malbork resisted. The besiegers ran short of powder, suffered from dysentery and wanted to be home for the harvest, and the siege was lifted on 19 September.: Segrarna stannade tre dagar på slagfältet och ryckte långsamt fram, och nådde Malbork först den 26 juli. Då hade Heinrich von Plauen, som lämnats kvar med omkring 3 000 man i Świecie, nått borgen och organiserat dess försvar. De flesta preussiska städer och borgar, bland dem Gdańsk, Toruń och Elbląg, underkastade sig Jagiełło, och bara åtta borgar höll ut. Men Malbork stod emot. Belägrarna fick ont om krut, led av dysenteri och ville vara hemma till skörden, och belägringen hävdes den 19 september.
The Order quickly won back most of its castles. A fresh Polish army beat a Teutonic force at Koronowo on 10 October, and von Plauen, elected Grand Master in November, agreed to talk. By the First Peace of Thorn on 1 February 1411 the Order returned the Dobrzyń Land and gave up Samogitia, but only for the lifetimes of Jagiełło and Vytautas, and paid 100,000 kopas of Prague groschen for its prisoners. Its losses of land were slight, but the payments and the taxes raised for them weakened the Order for good.: Orden vann snabbt tillbaka de flesta av sina borgar. En ny polsk här slog en ordensstyrka vid Koronowo den 10 oktober, och von Plauen, som valdes till högmästare i november, gick med på förhandlingar. Genom den första freden i Thorn den 1 februari 1411 återlämnade orden Dobrzyńlandet och avstod från Samogitien, men bara under Jagiełłos och Vytautas’ livstid, och betalade 100 000 skock pragergroschen för sina fångar. Landförlusterna var små, men betalningarna och de skatter som togs ut för dem försvagade orden för gott.
