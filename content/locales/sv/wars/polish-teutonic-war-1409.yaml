On 6 August 1409 Ulrich von Jungingen declared war on Poland and Lithuania, hoping to beat them one at a time. His army overran the Dobrzyń Land, burned the castle at Dobrzyń, took Bobrowniki after a fourteen-day siege and seized Bydgoszcz, while other forces raided Kuyavia and Greater Poland. The Poles, caught unprepared, gathered their levies and won Bydgoszcz back in the autumn. In the north the Samogitians attacked Memel.: Den 6 augusti 1409 förklarade Ulrich von Jungingen krig mot Polen och Litauen i hopp om att besegra dem var för sig. Hans här översvämmade Dobrzyńlandet, brände borgen i Dobrzyń, intog Bobrowniki efter fjorton dagars belägring och tog Bydgoszcz, medan andra styrkor plundrade i Kujavien och Storpolen. Polackerna, som överraskats oförberedda, samlade sitt uppbåd och vann tillbaka Bydgoszcz på hösten. I norr anföll samogiterna Memel.
Neither side was ready for a long war. Wenceslaus, King of the Romans and of Bohemia, arranged a truce on 8 October 1409 that was to last until 24 June 1410, and offered to judge the dispute. Early in 1410 he ruled that Samogitia belonged to the Order and only Dobrzyń should go back to Poland; the Order had given him 60,000 florins. The allies rejected the verdict and spent the winter planning a joint campaign against Malbork, while the Order hired mercenaries across the Empire.: Ingen av sidorna var beredd på ett långt krig. Wenzel, romersk kung och kung av Böhmen, förmedlade den 8 oktober 1409 ett stillestånd som skulle gälla till den 24 juni 1410 och erbjöd sig att döma i tvisten. I början av 1410 fastslog han att Samogitien tillhörde orden och att bara Dobrzyń skulle återgå till Polen; orden hade gett honom 60 000 floriner. De allierade förkastade domen och ägnade vintern åt att planera ett gemensamt fälttåg mot Malbork, medan orden värvade legosoldater över hela riket.
