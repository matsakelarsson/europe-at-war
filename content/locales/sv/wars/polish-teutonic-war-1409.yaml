In the 1220s Duke Konrad of Masovia invited the Teutonic Knights, a German crusading order, to help him against the pagan Prussians. From the Chełmno Land the knights conquered Prussia by the 1280s and made it a state of their own. In 1308–1309 they seized Gdańsk Pomerania from Poland and moved their headquarters to Malbork. By the Treaty of Kalisz in 1343 Poland won back Kuyavia and Dobrzyń but gave up its claim to Pomerania, while the Order kept up a long crusade against pagan Lithuania.: På 1220-talet bjöd hertig Konrad av Masovien in Tyska orden, en tysk korsfararorden, för att hjälpa honom mot de hedniska prussarna. Från Chełmnolandet hade riddarna på 1280-talet erövrat Preussen och gjort det till en egen stat. År 1308–1309 tog de Gdańsk-Pommern från Polen och flyttade sitt högkvarter till Malbork. Genom freden i Kalisz 1343 vann Polen tillbaka Kujavien och Dobrzyń men avstod från sitt anspråk på Pommern, medan orden fortsatte ett långt korståg mot det hedniska Litauen.
That crusade lost its purpose in 1385. At Krewo the Lithuanian grand duke Jogaila agreed to become a Catholic and marry the young Queen Jadwiga of Poland. He was crowned in Kraków in 1386 as Władysław II Jagiełło, and Lithuania was baptised the next year. The Order doubted the conversion and fought on over Samogitia, the Lithuanian land that separated Prussia from Livonia. Jogaila’s cousin Vytautas, who ruled Lithuania, ceded it to the Order in 1398 and again in 1404. In May 1409 the Samogitians rose in revolt, with his support.: Detta korståg förlorade sitt syfte 1385. I Krewo gick den litauiske storfursten Jogaila med på att bli katolik och gifta sig med den unga drottning Jadwiga av Polen. Han kröntes i Kraków 1386 som Władysław II Jagiełło, och Litauen döptes året därpå. Orden betvivlade omvändelsen och fortsatte att strida om Samogitien, det litauiska land som skilde Preussen från Livland. Jogailas kusin Vytautas, som styrde Litauen, avträdde det till orden 1398 och åter 1404. I maj 1409 gjorde samogiterna uppror, med hans stöd.
