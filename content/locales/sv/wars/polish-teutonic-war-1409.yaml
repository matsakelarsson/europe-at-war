The allies did what the Order did not expect and joined forces. Between 24 and 30 June 1410 the Polish army and Vytautas’s Lithuanians and Ruthenians, with Tatar and Czech contingents, crossed the Vistula at Czerwińsk on a pontoon bridge. Joined by the Masovians, they marched north and entered Prussia on 9 July. Ulrich von Jungingen blocked the crossing of the Drwęca at Kurzętnik, so Jagiełło turned east around the river’s headwaters, and his troops plundered the small town of Dąbrówno (Gilgenburg) on the way.: De allierade gjorde det orden inte väntade sig och förenade sina styrkor. Mellan den 24 och 30 juni 1410 gick den polska hären och Vytautas’ litauer och rutener, med tatariska och tjeckiska kontingenter, över Wisła vid Czerwińsk på en pontonbro. Förstärkta av masovierna tågade de norrut och gick in i Preussen den 9 juli. Ulrich von Jungingen spärrade övergången av Drwęca vid Kurzętnik, så Jagiełło vek av österut runt flodens källor, och hans trupper plundrade den lilla staden Dąbrówno (Gilgenburg) på vägen.
On 15 July the armies met in the fields near Grunwald and Stębark (Tannenberg). Modern estimates range from about 16,500 to 39,000 men on the allied side and from 11,000 to 27,000 for the Order. After more than an hour of heavy fighting the Lithuanian wing fell back, in flight or as a planned feint, which is still debated, but it returned to the field, and the Grand Master was killed trying to break through. The Order’s camp was overrun. Some 200 of its brother knights died, with most of its leaders, and thousands were taken prisoner.: Den 15 juli möttes härarna på fälten nära Grunwald och Stębark (Tannenberg). Moderna uppskattningar sträcker sig från omkring 16 500 till 39 000 man på den allierade sidan och från 11 000 till 27 000 för orden. Efter mer än en timmes hårda strider drog sig den litauiska flygeln tillbaka, på flykt eller som en planerad fint, vilket fortfarande diskuteras, men den återvände till slagfältet, och högmästaren dödades när han försökte bryta igenom. Ordens läger överrändes. Omkring 200 av dess riddarbröder stupade, liksom de flesta av dess ledare, och tusentals togs till fånga.
