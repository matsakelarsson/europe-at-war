Polish–Teutonic War, 1519–1521: Polsk-teutoniska kriget 1519–1521
The last war between Poland and the Teutonic Order, fought after Grand Master Albert of Hohenzollern refused the homage owed under the Second Peace of Thorn and allied with Moscow. Neither side won, and a four-year truce was agreed at Toruń in April 1521. In 1525 Albert became a Lutheran, turned the Order’s Prussia into a hereditary duchy and did homage for it to his uncle, King Sigismund I, in the Prussian Homage at Kraków on 10 April.: Det sista kriget mellan Polen och Tyska orden, utkämpat sedan högmästaren Albrekt av Hohenzollern vägrat avlägga den länshyllning han var skyldig enligt andra freden i Thorn och slutit förbund med Moskva. Ingen av sidorna segrade, och ett fyraårigt stillestånd ingicks i Toruń i april 1521. År 1525 blev Albrekt lutheran, gjorde ordens Preussen till ett ärftligt hertigdöme och avlade länshyllning för det till sin morbror, kung Sigismund I, vid den preussiska hyllningen i Kraków den 10 april.
Poland: Polen
Teutonic Order: Tyska orden
