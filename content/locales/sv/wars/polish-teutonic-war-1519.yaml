Known in German as the Reiterkrieg, the Riders’ War. Among the defenders of Olsztyn against the Order in 1521 was the astronomer Nicolaus Copernicus.: På tyska kallas det Reiterkrieg, ryttarkriget. Bland försvararna av Olsztyn mot orden 1521 fanns astronomen Nicolaus Copernicus.
