Polish–Ukrainian War: Polsk-ukrainska kriget
A war for eastern Galicia between the new Polish state and the West Ukrainian People’s Republic, proclaimed in Lwów (Lviv) on 1 November 1918. Polish defenders, many of them students and schoolchildren, held part of the city until relief arrived on 21–22 November, after which Polish soldiers and civilians killed an estimated 52–150 Jews in a pogrom; in July 1919 a Polish offensive, reinforced by Józef Haller’s army from France, drove the Ukrainian Galician Army across the Zbruch.: Ett krig om östra Galizien mellan den nya polska staten och Västukrainska folkrepubliken, som utropades i Lwów (Lviv) den 1 november 1918. Polska försvarare, många av dem studenter och skolbarn, höll en del av staden tills undsättning anlände den 21–22 november, varefter polska soldater och civila dödade uppskattningsvis 52–150 judar i en pogrom; i juli 1919 drev en polsk offensiv, förstärkt av Józef Hallers armé från Frankrike, Ukrainska galiziska armén över Zbrutj.
