# Svenska översättningar av katalogtexten (våg 8); stegtexterna kommer senare.
Polygar Wars: Polygarkrigen
? Wars between the East India Company and the palayakkarars (polygars), the hereditary chiefs of fortified domains in the Tamil south, who resisted the Company’s collection of the revenues of the Nawab of Arcot. In 1799 Veerapandiya Kattabomman, chief of Panchalankurichi, who had refused to pay tribute and whose men had killed a British officer at a meeting in Ramanathapuram, was besieged by Major John Bannerman. The fort held out against the first assault in September, but Kattabomman fled, was handed over by the Raja of Pudukkottai and was hanged at Kayathar on 16 October 1799. In 1800–1801 a wider league led by the Marudu brothers of Sivaganga, with Kattabomman’s brother Oomaithurai, chiefs in Dindigul and the Kongu country, and contacts as far as Malabar, rose again; in June 1801 the Marudu brothers issued a proclamation at Tiruchirappalli calling on all the people of the south to drive out the Company. After months of jungle fighting the Company took the rebuilt fort of Panchalankurichi in May 1801 and Kalayarkoil in October. The Marudu brothers were hanged at Tiruppattur on 24 October 1801 and Oomaithurai soon after. In the west Dheeran Chinnamalai fought on until he was captured and hanged at Sankagiri in July 1805. In July 1801 the Nawab of Arcot ceded the Carnatic to the Company, the polygars’ forts were pulled down and their armed retainers disbanded, and the palayams became zamindari estates. In Tamil Nadu these leaders are remembered as early fighters against British rule.
: Krig mellan Brittiska ostindiska kompaniet och palayakkarerna (polygarerna), de ärftliga hövdingarna över befästa domäner i det tamilska södra Indien, som gjorde motstånd mot att kompaniet drev in skatterna åt nawaben av Arcot. År 1799 belägrades Veerapandiya Kattabomman, hövding i Panchalankurichi, av major John Bannerman; Kattabomman hade vägrat att betala tribut, och hans män hade dödat en brittisk officer vid ett möte i Ramanathapuram. Fortet stod emot den första stormningen i september, men Kattabomman flydde, utlämnades av rajan av Pudukkottai och hängdes i Kayathar den 16 oktober 1799. År 1800–1801 reste sig ett bredare förbund under ledning av bröderna Marudu från Sivaganga, med Kattabommans bror Oomaithurai, hövdingar i Dindigul och Kongulandet och kontakter ända bort till Malabar; i juni 1801 utfärdade bröderna Marudu en proklamation i Tiruchirappalli som uppmanade hela befolkningen i söder att driva ut kompaniet. Efter månader av djungelstrider intog kompaniet det återuppbyggda fortet i Panchalankurichi i maj 1801 och Kalayarkoil i oktober. Bröderna Marudu hängdes i Tiruppattur den 24 oktober 1801 och Oomaithurai kort därefter. I väster kämpade Dheeran Chinnamalai vidare tills han tillfångatogs och hängdes i Sankagiri i juli 1805. I juli 1801 avträdde nawaben av Arcot Karnatik till kompaniet, polygarernas fort revs, deras beväpnade följen upplöstes och palayamerna blev zamindargods. I Tamil Nadu minns man dessa ledare som tidiga kämpar mot det brittiska styret.
