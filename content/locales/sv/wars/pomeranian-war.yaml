Stralsund: Stralsund
In the Seven Years’ War Sweden joined France, Austria and Russia against Prussia, hoping to win back the Pomeranian lands lost in 1720. Swedish troops crossed into Prussian territory on 13 September 1757, but were driven back and blockaded in Stralsund until a Russian army came to their rescue in 1758.: Under sjuårskriget gick Sverige med Frankrike, Österrike och Ryssland mot Preussen i hopp om att återvinna de pommerska områden som förlorats 1720. Svenska trupper gick in på preussiskt territorium den 13 september 1757 men drevs tillbaka och blockerades i Stralsund tills en rysk armé kom till undsättning 1758.
The war went back and forth across Pomerania, Brandenburg and Mecklenburg in small battles such as Tornow and Fehrbellin in September 1758, and Swedish ships beat a Prussian flotilla on the Stettin Lagoon in 1759. When Russia made peace and allied with Prussia in May 1762, Sweden had to give up. The Treaty of Hamburg on 22 May 1762 restored the pre-war borders.: Kriget böljade fram och tillbaka över Pommern, Brandenburg och Mecklenburg i mindre slag som vid Tornow och Fehrbellin i september 1758, och svenska fartyg besegrade en preussisk flottilj på Stettiner Haff 1759. När Ryssland slöt fred och förbund med Preussen i maj 1762 måste Sverige ge upp. Freden i Hamburg den 22 maj 1762 återställde gränserna från före kriget.
