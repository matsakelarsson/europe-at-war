Pomeranian War: Pommerska kriget
"Sweden’s part in the Seven Years’ War: it joined France, Austria and Russia against Prussia, hoping to regain the Pomeranian lands lost in 1720. Five years of inconclusive fighting in Pomerania and Brandenburg ended with the Treaty of Hamburg in 1762, which restored the pre-war borders.": "Sveriges del i sjuårskriget: Sverige gick med Frankrike, Österrike och Ryssland mot Preussen i hopp om att återvinna de pommerska områden som förlorats 1720. Fem år av ofruktbara strider i Pommern och Brandenburg avslutades med freden i Hamburg 1762, som återställde gränserna från före kriget."
