# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
Pontiac’s War: Pontiacs krig
? "A war in which a loose confederacy of the Native nations of the Great Lakes, the Ohio country and the Illinois country rose against British rule after the fall of New France. Britain had taken over the French posts, and its commander, Jeffery Amherst, cut back the gifts and the gunpowder that the alliance with France had provided, while British traders and settlers pressed west and the Lenape prophet Neolin called for a return to the old ways and the expulsion of the British. In May 1763 the Odawa leader Pontiac besieged Detroit, and within weeks Wendat, Potawatomi, Miami, Wea, Ojibwe and Seneca warriors had taken eight British forts, while Lenape and Shawnee war parties drove thousands of settlers from the frontier of Pennsylvania, Maryland and Virginia. Detroit, Fort Pitt and Niagara held. Henry Bouquet won at Bushy Run in August 1763, but the Seneca destroyed a convoy at Devil’s Hole, Pontiac’s men beat a sortie from Detroit at Bloody Run, and at Fort Pitt the British gave Lenape envoys blankets from their smallpox hospital. The Royal Proclamation of October 1763 reserved the land west of the Appalachians for the Native nations. Peace came by stages: Johnson’s congress at Niagara in 1764, Bouquet’s expedition to the Muskingum, which brought the return of over 200 captives, the British occupation of the Illinois country in 1765 and Pontiac’s treaty at Oswego in 1766. Apart from the Niagara portage, given up by the Seneca, no land was ceded, and Britain restored the gifts it had stopped."
: "Ett krig där ett löst förbund av ursprungsnationerna kring Stora sjöarna, i Ohiolandet och i Illinoislandet reste sig mot det brittiska styret efter Nya Frankrikes fall. Storbritannien hade tagit över de franska utposterna, och dess överbefälhavare, Jeffery Amherst, skar ned de gåvor och det krut som alliansen med Frankrike hade gett, medan brittiska handelsmän och nybyggare trängde västerut och lenapeprofeten Neolin uppmanade till en återgång till de gamla sedvänjorna och till att driva ut britterna. I maj 1763 belägrade odawaledaren Pontiac Detroit, och inom några veckor hade krigare från wendat, potawatomi, miami, wea, ojibwe och seneca intagit åtta brittiska fort, medan krigarskaror från lenape och shawnee drev tusentals nybyggare från gränsbygderna i Pennsylvania, Maryland och Virginia. Detroit, Fort Pitt och Niagara höll stånd. Henry Bouquet segrade vid Bushy Run i augusti 1763, men seneca förintade en konvoj vid Devil’s Hole, Pontiacs män slog tillbaka ett utfall från Detroit vid Bloody Run, och i Fort Pitt gav britterna lenapesändebud filtar från sitt smittkoppssjukhus. Den kungliga proklamationen i oktober 1763 reserverade landet väster om Appalacherna åt ursprungsnationerna. Freden kom stegvis: Johnsons kongress i Niagara 1764, Bouquets expedition till Muskingum, som ledde till att över 200 fångar återlämnades, den brittiska ockupationen av Illinoislandet 1765 och Pontiacs fördrag i Oswego 1766. Utöver bärstället vid Niagara, som seneca avstod, avträddes inget land, och Storbritannien återupptog de gåvor som det hade dragit in."
