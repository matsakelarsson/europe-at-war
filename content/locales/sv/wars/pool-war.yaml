# Svenska översättningar av katalogtexten (våg 13); stegtexterna kommer senare.
Pool War: Poolkriget
A conflict in the Pool department of the Republic of the Congo, around Brazzaville, between the government and the Ninja militia of Frédéric Bintsamou, known as Pastor Ntumi. A 2015 referendum allowed President Denis Sassou Nguesso to run again, and his re-election in March 2016 was rejected by the opposition. On 4 April 2016 armed men attacked police and military posts in the southern quarters of Brazzaville; the government blamed Ntumi’s Ninjas, who denied it, and the army bombed and attacked their strongholds in the Pool. The Ninjas attacked trains and cut the railway between Brazzaville and Pointe-Noire, and in April 2017 killed 18 soldiers. The Pool was closed to journalists and aid workers for long periods; at least 115 people were killed, and estimates of the displaced range from about 13,000 to more than 100,000. A ceasefire signed on 23 December 2017 provided for the Ninjas’ disarmament and the reopening of the railway, which resumed service in November 2018.: En konflikt i departementet Pool i Republiken Kongo, kring Brazzaville, mellan regeringen och Ninjamilisen under Frédéric Bintsamou, känd som pastor Ntumi. En folkomröstning 2015 gjorde det möjligt för president Denis Sassou Nguesso att ställa upp igen, och hans omval i mars 2016 förkastades av oppositionen. Den 4 april 2016 angrep beväpnade män polis- och militärposter i Brazzavilles södra stadsdelar; regeringen lade skulden på Ntumis Ninjas, som förnekade det, och armén bombade och angrep deras fästen i Pool. Ninjas angrep tåg och skar av järnvägen mellan Brazzaville och Pointe-Noire, och i april 2017 dödade de 18 soldater. Pool var under långa perioder stängt för journalister och biståndsarbetare; minst 115 människor dödades, och uppskattningarna av antalet fördrivna varierar från omkring 13 000 till mer än 100 000. En vapenvila som undertecknades den 23 december 2017 föreskrev att Ninjas skulle avväpnas och att järnvägen skulle öppnas igen, och trafiken återupptogs i november 2018.
