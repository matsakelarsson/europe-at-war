# Svenska översättningar av katalogtexten (våg 8); stegtexterna kommer senare.
Portuguese–Calicut wars: Krigen mellan Portugal och Calicut
The wars between Portugal and the Zamorin of Calicut, the ruler of the greatest pepper port on the Malabar Coast, which began when Pedro Álvares Cabral bombarded Calicut in December 1500 and made an alliance with its rival Cochin. Vasco da Gama returned in 1502 with a war fleet and burned a pilgrim ship with hundreds aboard. The Zamorin’s armies burned Cochin in 1503 but were held off at its fords in 1504 by Duarte Pacheco Pereira’s small garrison, and Portuguese fleets beat Calicut’s at Cannanore (1506) and elsewhere. Albuquerque’s assault on Calicut failed in 1510, but the Portuguese blockade forced a peace in 1513 that gave Portugal a fortress there. War broke out again in the 1520s; the Zamorin took the fort at Calicut in 1526, and in 1531 the Portuguese built a new one at Chaliyam. Truces and wars followed for the rest of the century.: Krigen mellan Portugal och zamorinen av Calicut, härskaren över Malabarkustens största pepparhamn. De började när Pedro Álvares Cabral bombarderade Calicut i december 1500 och slöt förbund med dess rival Cochin. Vasco da Gama återvände 1502 med en krigsflotta och brände ett pilgrimsfartyg med hundratals människor ombord. Zamorinens arméer brände Cochin 1503 men hölls 1504 tillbaka vid stadens vadställen av Duarte Pacheco Pereiras lilla garnison, och portugisiska flottor besegrade Calicuts flotta vid Cannanore (1506) och på andra håll. Albuquerques anfall mot Calicut misslyckades 1510, men den portugisiska blockaden framtvingade 1513 en fred som gav Portugal en fästning där. Kriget bröt ut på nytt på 1520-talet; zamorinen intog fortet i Calicut 1526, och 1531 byggde portugiserna ett nytt vid Chaliyam. Vapenstillestånd och krig avlöste varandra resten av seklet.
