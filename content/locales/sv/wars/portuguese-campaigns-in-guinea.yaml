# Svenska översättningar av katalogtexten (våg 13); stegtexterna kommer senare.
Portuguese campaigns in Guinea: De portugisiska fälttågen i Guinea
? The wars by which Portugal turned a handful of trading posts on the rivers of Guinea into the colony of Portuguese Guinea, today’s Guinea-Bissau. For centuries Portugal had held only forts and river towns such as Cacheu, Bissau and Bolama, often paying the surrounding Papel, Manjaco, Balanta, Felupe (Jola) and Bijagó peoples for the right to trade, and these towns had been centres of the Atlantic slave trade. On 30 December 1878 a Portuguese force sent up the Cacheu river to punish the Felupe for an attack on the post of Bolol (Bolor) was almost wiped out, and the shock led Lisbon to separate Guinea from Cape Verde as a colony of its own in 1879, governed from Bolama. Between 1879 and 1891 gunboats and landing parties fought the coastal and river peoples; the convention with France of 12 May 1886 fixed the borders but gave up the Casamance. In 1892 Guinea became a military district, and the Muslim Fula rulers of the interior recognised Portuguese sovereignty in return for autonomy and supplied auxiliaries against their non-Muslim neighbours. Portugal called the campaigns that followed “pacification”. The most violent were those of Captain João Teixeira Pinto, who arrived in 1912 and from 1913 to 1915 used African soldiers and the irregulars of the Wolof war leader Abdul Injai to break resistance to the hut tax in Oio, among the Manjaco of the Cacheu region and among the Papel around Bissau, burning villages and seizing cattle; many people fled to Senegal or into the forests. The cost of his forces led to his recall in 1915, and a Portuguese lawyer later published a report on the killing of fleeing villagers by the irregulars. Abdul Injai, rewarded with power in Oio, ruled it almost independently until August 1919, when colonial troops defeated his force at Mansabá on 1–2 August and deported him to Cape Verde. Resistance continued in the north-west and the Bijagós islands in the 1920s and 1930s, and Portugal treated the conquest of Canhabaque in the Bijagós, after a campaign from November 1935 to February 1936, as the end of the occupation of the colony.
: De krig genom vilka Portugal förvandlade en handfull handelsstationer vid floderna i Guinea till kolonin Portugisiska Guinea, dagens Guinea-Bissau. I århundraden hade Portugal bara haft fort och flodstäder som Cacheu, Bissau och Bolama och hade ofta betalat de omgivande folken papel, manjaco, balanta, felupe (jola) och bijagó för rätten att handla, och dessa städer hade varit centrum för den atlantiska slavhandeln. Den 30 december 1878 blev en portugisisk styrka som sänts uppför floden Cacheu för att straffa felupe för ett anfall mot handelsstationen Bolol (Bolor) nästan helt utplånad, och chocken fick Lissabon att 1879 skilja Guinea från Kap Verde som en egen koloni, styrd från Bolama. Mellan 1879 och 1891 stred kanonbåtar och landstigningsstyrkor mot folken vid kusten och floderna; konventionen med Frankrike den 12 maj 1886 fastställde gränserna men gav upp Casamance. År 1892 blev Guinea ett militärdistrikt, och de muslimska fulahärskarna i inlandet erkände portugisisk överhöghet i utbyte mot självstyre och ställde hjälptrupper till förfogande mot sina icke-muslimska grannar. Portugal kallade de fälttåg som följde för ”pacificering”. De våldsammaste var kapten João Teixeira Pintos, som kom 1912 och som 1913–1915 använde afrikanska soldater och de irreguljära trupperna under wolofkrigsledaren Abdul Injai för att bryta motståndet mot hyddskatten i Oio, bland manjaco i Cacheuregionen och bland papel kring Bissau, varvid byar brändes och boskap beslagtogs; många människor flydde till Senegal eller in i skogarna. Kostnaderna för hans styrkor ledde till att han kallades hem 1915, och en portugisisk advokat publicerade senare en rapport om de irreguljäras dödande av flyende bybor. Abdul Injai, som belönades med makten i Oio, styrde området nästan självständigt till augusti 1919, då koloniala trupper besegrade hans styrka vid Mansabá den 1–2 augusti och deporterade honom till Kap Verde. Motståndet fortsatte i nordväst och på Bijagósöarna under 1920- och 1930-talen, och Portugal betraktade erövringen av Canhabaque i Bijagós, efter ett fälttåg från november 1935 till februari 1936, som slutet på ockupationen av kolonin.
