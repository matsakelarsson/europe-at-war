Portuguese Colonial War: Portugisiska kolonialkriget
The wars fought by Portugal’s Estado Novo dictatorship against independence movements in its African colonies, in Angola from 1961, Portuguese Guinea (Guinea-Bissau) from 1963 and Mozambique from 1964. Portugal held most of the territory with large conscript armies, by one count mobilising some 1.4 million men for military and support service over the years, but the guerrillas of the MPLA, FNLA and UNITA in Angola, the PAIGC in Guinea and FRELIMO in Mozambique could not be defeated. Weariness with the war led army officers to overthrow the regime in the Carnation Revolution of 25 April 1974, and all five African colonies became independent in 1974–1975.: De krig som Portugals Estado Novo-diktatur förde mot självständighetsrörelser i sina afrikanska kolonier, i Angola från 1961, Portugisiska Guinea (Guinea-Bissau) från 1963 och Moçambique från 1964. Portugal höll större delen av territoriet med stora värnpliktsarméer och mobiliserade enligt en beräkning omkring 1,4 miljoner män för militär tjänst och stödtjänst under årens lopp, men gerillan i MPLA, FNLA och UNITA i Angola, PAIGC i Guinea och FRELIMO i Moçambique kunde inte besegras. Krigströttheten fick arméofficerare att störta regimen i nejlikerevolutionen den 25 april 1974, och alla fem afrikanska kolonierna blev självständiga 1974–1975.
