The fighting took place in Africa, outside the map. Portugal lost about 8,000–9,000 soldiers killed; losses among the guerrillas and especially civilians were far higher, with estimates of civilian deaths ranging from about 70,000 to 110,000. Atrocities were committed on all sides, among them the massacre of settlers and others by the UPA in northern Angola in March 1961 and the massacre of villagers by Portuguese troops at Wiriyamu in Mozambique in 1972.: Striderna utkämpades i Afrika, utanför kartan. Portugal förlorade omkring 8 000–9 000 stupade soldater; förlusterna bland gerillan och särskilt bland civila var mycket större, med uppskattningar av antalet civila döda från omkring 70 000 till 110 000. Grymheter begicks av alla sidor, bland annat UPA:s massaker på bosättare och andra i norra Angola i mars 1961 och portugisiska truppers massaker på bybor i Wiriyamu i Moçambique 1972.
