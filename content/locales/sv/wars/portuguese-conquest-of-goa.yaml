# Svenska översättningar av katalogtexten (våg 8); stegtexterna kommer senare.
Portuguese conquest of Goa: Portugals erövring av Goa
? The capture of Goa, the main port of the Bijapur Sultanate on India’s west coast, by Afonso de Albuquerque, governor of Portuguese India. Encouraged by Timoji, a Hindu privateer, and taking advantage of the recent death of Bijapur’s founder, Yusuf Adil Shah, Albuquerque sailed into the Mandovi river and took the fort of Pangim on 16 February 1510; the next day he occupied Goa without a fight. In May the new sultan, Ismail Adil Shah, sent an army of tens of thousands under Pulad Khan across the Banastarim ford, and on 31 May the Portuguese abandoned the city, killing many of its Muslim inhabitants as they left. Trapped at the river mouth by the monsoon, they sailed south in August. On 25 November 1510, St Catherine’s Day, Albuquerque returned with about 1,700 men and 34 ships and stormed Goa. The Portuguese lost about 50 dead; Albuquerque himself wrote that some 6,000 Muslim defenders and townspeople were killed. Bijapur tried to retake Goa in 1511–1512 and failed. It became the capital of Portuguese India in 1530 and stayed Portuguese until India annexed it in 1961.
: Afonso de Albuquerques, guvernör i Portugisiska Indien, erövring av Goa, Bijapursultanatets främsta hamn på Indiens västkust. Uppmuntrad av Timoji, en hinduisk kapare, och med utnyttjande av att Bijapurs grundare Yusuf Adil Shah nyligen hade dött seglade Albuquerque in i floden Mandovi och intog fortet Pangim den 16 februari 1510; dagen därpå besatte han Goa utan strid. I maj sände den nye sultanen, Ismail Adil Shah, en armé på tiotusentals man under Pulad Khan över vadstället vid Banastarim, och den 31 maj övergav portugiserna staden och dödade många av dess muslimska invånare när de lämnade den. Instängda vid flodmynningen av monsunen seglade de söderut i augusti. Den 25 november 1510, Sankta Katarinas dag, återvände Albuquerque med omkring 1 700 man och 34 fartyg och stormade Goa. Portugiserna förlorade omkring 50 döda; Albuquerque skrev själv att omkring 6 000 muslimska försvarare och stadsbor dödades. Bijapur försökte återta Goa 1511–1512 men misslyckades. Staden blev huvudstad i Portugisiska Indien 1530 och förblev portugisisk tills Indien annekterade den 1961.
