Portuguese conquest of Hormuz: Portugisernas erövring av Hormuz
Afonso de Albuquerque’s campaigns to bring the island kingdom of Hormuz, which controlled the trade between India, Persia and Arabia at the mouth of the Persian Gulf, under Portuguese control. In 1507 his small squadron sacked Qurayyat, Muscat and Khor Fakkan on the Omani coast, a dependency of Hormuz, and forced the king of Hormuz to accept Portuguese overlordship, but the mutiny of his captains forced him to leave early in 1508. In 1515 he returned with a larger fleet, had the strongman of Hormuz killed and built a fortress there. Hormuz, with the ports of Oman, stayed a Portuguese protectorate until 1622.: Afonso de Albuquerques fälttåg för att föra önriket Hormuz, som vid Persiska vikens mynning behärskade handeln mellan Indien, Persien och Arabien, under portugisisk kontroll. År 1507 plundrade hans lilla eskader Qurayyat, Muskat och Khor Fakkan på den omanska kusten, som lydde under Hormuz, och tvingade kungen av Hormuz att erkänna portugisisk överhöghet, men ett myteri bland hans kaptener tvingade honom att ge sig av i början av 1508. År 1515 återvände han med en större flotta, lät döda Hormuz starke man och byggde en fästning där. Hormuz förblev tillsammans med Omans hamnar ett portugisiskt protektorat fram till 1622.
