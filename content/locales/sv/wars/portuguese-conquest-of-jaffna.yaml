# Svenska översättningar av katalogtexten (våg 8); stegtexterna kommer senare.
Portuguese conquest of the Jaffna Kingdom: Portugals erövring av kungariket Jaffna
? The Portuguese conquest of the Tamil kingdom of Jaffna in the north of Sri Lanka. A first expedition under the viceroy Constantino de Bragança in 1560 took the capital, Nallur, but could not hold it and withdrew, keeping only the island of Mannar. In 1591 an expedition from Goa under André Furtado de Mendonça defeated and killed King Puviraja Pandaram and put his son Ethirimana Cinkam on the throne as a vassal paying tribute. After his death in 1617, his nephew Cankili II seized power by killing the regent and other princes, refused to pay tribute, and relied on troops sent by Raghunatha Nayak of Thanjavur. In 1619 two Portuguese expeditions were sent against him; a naval force was beaten off, but a land army of about 5,000 under Phillippe de Oliveira defeated him and annexed the kingdom. Cankili was taken to Goa, tried for treason and executed, in 1621 according to the chronicler Queiroz. Risings in the 1620s, some backed by the Thanjavur Nayak, were put down, and the Portuguese ruled Jaffna until the Dutch took it in 1658.
: Portugisernas erövring av det tamilska kungariket Jaffna på norra Sri Lanka. En första expedition under vicekungen Constantino de Bragança intog 1560 huvudstaden Nallur men kunde inte hålla den och drog sig tillbaka; den behöll bara ön Mannar. År 1591 besegrade och dödade en expedition från Goa under André Furtado de Mendonça kung Puviraja Pandaram och satte hans son Ethirimana Cinkam på tronen som tributskyldig vasall. Efter dennes död 1617 tog hans nevö Cankili II makten genom att döda regenten och andra prinsar, vägrade att betala tribut och förlitade sig på trupper som sänts av Raghunatha Nayak av Thanjavur. År 1619 sändes två portugisiska expeditioner mot honom; en sjöstyrka slogs tillbaka, men en landarmé på omkring 5 000 man under Phillippe de Oliveira besegrade honom och annekterade kungariket. Cankili fördes till Goa, dömdes för förräderi och avrättades, enligt krönikören Queiroz 1621. Resningar på 1620-talet, en del med stöd av nayaken i Thanjavur, slogs ned, och portugiserna härskade över Jaffna tills holländarna tog det 1658.
