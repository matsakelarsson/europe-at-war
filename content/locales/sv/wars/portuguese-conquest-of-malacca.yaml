# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
Portuguese conquest of Malacca: Portugals erövring av Malacka
? The Portuguese capture of Malacca, the greatest port of Southeast Asia, and Sultan Mahmud Shah’s fifteen-year war to win it back. Malacca, a Muslim sultanate founded around 1400, controlled the strait through which the trade between India and China passed, and ruled much of the Malay Peninsula and parts of the east coast of Sumatra. In 1509 Mahmud Shah received a Portuguese trading mission under Diogo Lopes de Sequeira, then, urged on by Gujarati and Javanese merchants who feared Portuguese competition, attacked it and held about twenty men prisoner. In 1511 Afonso de Albuquerque, governor of Portuguese India, came with 18 ships and about 1,000 men, stormed the city in two assaults on 25 July and in August, and after ten days of bombardment took it on 24 August. The city was plundered, and Albuquerque built the fortress later called A Famosa. Mahmud Shah fought on from the Muar river, from Pahang and from Bintan, at the head of a league of former vassals, besieging Malacca in 1518 and 1524, while a Javanese fleet under Pati Unus of Japara attacked it in 1513. In 1526 the Portuguese destroyed his capital on Bintan, and he died in exile at Kampar in Sumatra in 1528. His sons founded the sultanates of Johor and Perak, which, with Aceh, fought the Portuguese at Malacca for another century.
: Portugisernas erövring av Malacka, Sydostasiens största hamn, och sultan Mahmud Shahs femton år långa krig för att återvinna den. Malacka, ett muslimskt sultanat som grundats omkring 1400, kontrollerade sundet som handeln mellan Indien och Kina gick genom och härskade över stora delar av Malackahalvön och delar av Sumatras östkust. År 1509 tog Mahmud Shah emot en portugisisk handelsbeskickning under Diogo Lopes de Sequeira, men anföll den sedan, påhejad av gujaratiska och javanesiska köpmän som fruktade portugisisk konkurrens, och höll ett tjugotal man fångna. År 1511 kom Afonso de Albuquerque, guvernör över Portugisiska Indien, med 18 fartyg och omkring 1 000 man, stormade staden i två anfall den 25 juli och i augusti och intog den efter tio dagars bombardemang den 24 augusti. Staden plundrades, och Albuquerque byggde den fästning som senare kallades A Famosa. Mahmud Shah fortsatte kampen från floden Muar, från Pahang och från Bintan, i spetsen för ett förbund av forna vasaller, och belägrade Malacka 1518 och 1524, medan en javanesisk flotta under Pati Unus av Japara anföll staden 1513. År 1526 förstörde portugiserna hans huvudstad på Bintan, och han dog i landsflykt i Kampar på Sumatra 1528. Hans söner grundade sultanaten Johor och Perak, som tillsammans med Aceh bekämpade portugiserna i Malacka i ytterligare ett sekel.
