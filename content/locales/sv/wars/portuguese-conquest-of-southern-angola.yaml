# Svenska översättningar av katalogtexten (våg 13); stegtexterna kommer senare.
Portuguese conquests in Angola: De portugisiska erövringarna i Angola
? "The wars by which Portugal brought the central highlands, the south and the Dembos hills of Angola under its rule. The Berlin agreements of 1884–1885 had given Portugal a claim to the whole of Angola, but in 1900 its rule beyond the coast and a chain of forts was thin. On the Benguela highlands, where the Ovimbundu kingdoms had grown rich on the caravan trade in slaves, ivory, wax and rubber, Portuguese troops had deposed the king of Bié in 1890. When the price of rubber collapsed in 1902, the new king of Bailundo, Kalandula, crowned on 7 April 1902, quarrelled with the commander of the local fort over a trader’s debt claim against his councillor Mutu ya Kevela; on 15 May the Portuguese imprisoned Kalandula and his delegation, and the Bailundo war (the Bailundo revolt or Second Portuguese–Ovimbundu War) began. Mutu ya Kevela rallied Bié, Huambo and other Ovimbundu kingdoms and neighbouring peoples; up to 6,000 men besieged the Bailundo fort between May and July and attacked trading posts, killing about 20 Portuguese and 100 African loyalists, until three columns of Portuguese, African and Boer troops with repeating rifles and mountain guns relieved the fort in July and September. Mutu ya Kevela was killed on 4 August 1902, the kings began to surrender in large numbers at the end of September, and the last resistance was crushed on 22 March 1904; Ovimbundu losses were at least 2,000. In the south the Ovambo kingdoms of the Kunene valley, well armed with rifles bought from traders, resisted for longer: on 25 September 1904, at Vau de Pembe on the Kunene, Kwamato and Kwanyama fighters ambushed a Portuguese column of about 500 men and killed some 300. Portugal conquered Ombandja, the country of the Kwamato (Cuamato), in 1907, after the battle of Mufilo on 27 August, and Evale in 1912. In the First World War, after German troops from South West Africa defeated the Portuguese at Naulila on 18 December 1914, the Kwanyama king Mandume ya Ndemufayo, king since 1911, sacked the Portuguese fort at Kafima, and the whole Ovambo region rose, in a year of famine. A Portuguese army of about 5,000 under General António Pereira de Eça crossed the Kunene on 12 August 1915; at Mongua (Omongwa), on 18–20 August 1915, Mandume’s army attacked its camp for three days and was driven off, and on 2 September the Portuguese took Mandume’s capital, N’giva (Ondjiva). Mandume fought on from across the border until he was killed by South African troops on 6 February 1917, by machine-gun fire according to South African records and by his own hand according to Kwanyama oral tradition. In the north the Dembos, chiefdoms of the forested hills about 150 km north-east of Luanda, threw back repeated expeditions and were subdued only in campaigns of 1907–1910, begun under governor-general Henrique de Paiva Couceiro, although Portugal did not complete its occupation until 1917. Portuguese officers called these campaigns “pacification”; for the Ovimbundu, Ovambo and Dembos rulers they were wars to keep their independence, and Mandume is honoured as a national hero in both Angola and Namibia."
: "De krig genom vilka Portugal lade det centrala höglandet, södern och Dembosbergen i Angola under sitt styre. Berlinöverenskommelserna 1884–1885 hade gett Portugal anspråk på hela Angola, men 1900 var dess styre bortom kusten och en kedja av fort tunt. På Benguelahöglandet, där ovimbundukungadömena hade blivit rika på karavanhandeln med slavar, elfenben, vax och kautschuk, hade portugisiska trupper avsatt kungen av Bié 1890. När kautschukpriset rasade 1902 hamnade Bailundos nye kung Kalandula, krönt den 7 april 1902, i konflikt med befälhavaren för det lokala fortet om en handelsmans skuldkrav mot hans rådgivare Mutu ya Kevela; den 15 maj fängslade portugiserna Kalandula och hans delegation, och Bailundokriget (Bailundorevolten eller andra portugisisk-ovimbundiska kriget) började. Mutu ya Kevela samlade Bié, Huambo och andra ovimbundukungadömen och grannfolk; upp till 6 000 man belägrade fortet i Bailundo mellan maj och juli och angrep handelsstationer, där de dödade omkring 20 portugiser och 100 afrikanska lojalister, tills tre kolonner av portugisiska, afrikanska och boerska trupper med repetergevär och bergskanoner undsatte fortet i juli och september. Mutu ya Kevela dödades den 4 augusti 1902, kungarna började kapitulera i stort antal i slutet av september, och det sista motståndet krossades den 22 mars 1904; ovimbundufolkets förluster uppgick till minst 2 000. I söder gjorde ovambokungadömena i Kunenedalen, väl beväpnade med gevär som de köpt av handelsmän, motstånd längre: den 25 september 1904, vid Vau de Pembe vid Kunene, lade kwamato- och kwanyamakrigare ett bakhåll för en portugisisk kolonn på omkring 500 man och dödade omkring 300. Portugal erövrade Ombandja, kwamatofolkets (cuamatofolkets) land, 1907, efter slaget vid Mufilo den 27 augusti, och Evale 1912. Under första världskriget, sedan tyska trupper från Sydvästafrika hade besegrat portugiserna vid Naulila den 18 december 1914, plundrade kwanyamakungen Mandume ya Ndemufayo, kung sedan 1911, det portugisiska fortet i Kafima, och hela ovamboregionen reste sig, under ett år av hungersnöd. En portugisisk armé på omkring 5 000 man under general António Pereira de Eça gick över Kunene den 12 augusti 1915; vid Mongua (Omongwa) anföll Mandumes armé den 18–20 augusti 1915 dess läger i tre dagar men drevs tillbaka, och den 2 september intog portugiserna Mandumes huvudstad N’giva (Ondjiva). Mandume fortsatte striden från andra sidan gränsen tills han dödades av sydafrikanska trupper den 6 februari 1917, av kulspruteeld enligt sydafrikanska handlingar och för egen hand enligt kwanyamafolkets muntliga tradition. I norr slog Dembos, hövdingadömen i de skogklädda bergen omkring 150 km nordost om Luanda, tillbaka upprepade expeditioner och underkuvades först i fälttåg 1907–1910, som inleddes under generalguvernören Henrique de Paiva Couceiro, även om Portugal inte fullbordade sin ockupation förrän 1917. Portugisiska officerare kallade dessa fälttåg ”pacificering”; för ovimbundu-, ovambo- och dembosfolkens härskare var de krig för att bevara sin självständighet, och Mandume hedras som nationalhjälte i både Angola och Namibia."
