# Svenska översättningar av katalogtexten (våg 13); stegtexterna kommer senare.
Portuguese conquest of the Swahili coast: Portugals erövring av Swahilikusten
? "The Portuguese campaigns that forced the Swahili city-states of East Africa into tribute in the first years of the sixteenth century. The towns of the coast, Muslim trading cities from Mogadishu to Sofala, lived on the Indian Ocean trade in gold, ivory and slaves from the interior and cloth, beads and porcelain from India and beyond. Vasco da Gama found an ally in Malindi in 1498 and frightened Kilwa into paying tribute in 1502; Zanzibar was bombarded into submission in 1503. In 1505 Francisco de Almeida, sailing to India as the first viceroy, sacked Kilwa on 24 July, built a fort there and set up a ruler of his own, then stormed and burned Mombasa in August. Pêro de Anaia built a fort at Sofala, the outlet of the gold of the Zimbabwe plateau, and in 1507 the Portuguese moved their main base to Mozambique Island. Tristão da Cunha and Afonso de Albuquerque sacked Oja and Barawa in 1507, and by 1509 most towns north of Mozambique paid tribute. The Portuguese gave up their fort at Kilwa in 1512. They held the sea and a few forts, but not the coast itself: Mombasa was rebuilt and defied them again, and only Malindi stayed their constant ally."
: "De portugisiska fälttåg som under de första åren av 1500-talet tvingade Östafrikas swahiliska stadsstater att betala tribut. Kuststäderna, muslimska handelsstäder från Mogadishu till Sofala, levde på handeln över Indiska oceanen med guld, elfenben och slavar från inlandet och tyger, pärlor och porslin från Indien och länderna bortom. Vasco da Gama fann en bundsförvant i Malindi 1498 och skrämde Kilwa till att betala tribut 1502; Zanzibar bombarderades till underkastelse 1503. År 1505 plundrade Francisco de Almeida, på väg till Indien som den förste vicekungen, Kilwa den 24 juli, byggde ett fort där och insatte en egen härskare, och stormade och brände sedan Mombasa i augusti. Pêro de Anaia byggde ett fort i Sofala, utskeppningshamnen för guldet från Zimbabweplatån, och 1507 flyttade portugiserna sin huvudbas till Moçambiqueön. Tristão da Cunha och Afonso de Albuquerque plundrade Oja och Barawa 1507, och 1509 betalade de flesta städer norr om Moçambique tribut. Portugiserna övergav sitt fort i Kilwa 1512. De behärskade havet och några fort, men inte själva kusten: Mombasa byggdes upp igen och trotsade dem på nytt, och endast Malindi förblev deras trogna bundsförvant."
