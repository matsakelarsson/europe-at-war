# Svenska översättningar av katalogtexten (våg 12); stegtexterna kommer senare.
Portuguese conquests in Morocco: Portugals erövringar i Marocko
"More than a century of Portuguese war on the coasts of Morocco after the capture of Ceuta in 1415. An attack on Tangier in 1437 ended in a humiliating capitulation, and Prince Ferdinand, left as a hostage, died a captive in Fez. Afonso V, “the African”, took Ksar es-Seghir in 1458 and, after failed attacks on Tangier in 1463–1464, stormed Asilah in August 1471 and occupied Tangier, while the Wattasid Muhammad al-Shaykh, fighting for Fez, made a truce with him. Under John II and Manuel I Portugal turned to the Atlantic coast, with its wheat, horses and cloth, and built or took forts at Santa Cruz do Cabo de Gué (Agadir, 1505), Safi (1508), Azemmour (1513) and Mazagan (1514). A disaster at Mamora in 1515 stopped the advance, and the rise of the Saadian sharifs, who preached holy war against the Portuguese from the Sous, turned it back: Agadir fell to the Saadians in 1541, after which Portugal abandoned Safi and Azemmour (1541), Ksar es-Seghir (1549) and Asilah (1550), keeping only Ceuta, Tangier and Mazagan.": "Mer än ett sekel av portugisisk krigföring längs Marockos kuster efter erövringen av Ceuta 1415. Ett anfall mot Tanger 1437 slutade med en förödmjukande kapitulation, och prins Ferdinand, som lämnades kvar som gisslan, dog i fångenskap i Fès. Alfons V, ”afrikanen”, intog Ksar es-Seghir 1458 och stormade, efter misslyckade anfall mot Tanger 1463–1464, Asilah i augusti 1471 och besatte Tanger, medan wattasiden Muhammad al-Shaykh, som kämpade om Fès, slöt stillestånd med honom. Under Johan II och Manuel I vände sig Portugal mot Atlantkusten med dess vete, hästar och tyger och byggde eller intog fort vid Santa Cruz do Cabo de Gué (Agadir, 1505), Safi (1508), Azemmour (1513) och Mazagan (1514). En katastrof vid Mamora 1515 hejdade framryckningen, och uppgången för de saadiska shariferna, som predikade heligt krig mot portugiserna från Sous, vände den: Agadir föll i saadiernas händer 1541, varefter Portugal övergav Safi och Azemmour (1541), Ksar es-Seghir (1549) och Asilah (1550) och behöll endast Ceuta, Tanger och Mazagan."
