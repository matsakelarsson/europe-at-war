Portuguese Interregnum: Portugisiska interregnumet
The succession war, also called the 1383–1385 Crisis, that followed the death of Ferdinand I of Portugal, whose only child, Beatrice, was married to John I of Castile. Fearing union with Castile, Lisbon and much of the country rallied to John, Master of the Order of Aviz, Ferdinand’s illegitimate half-brother. The Castilians failed to take Lisbon in 1384, the Cortes of Coimbra proclaimed the Master king as John I in 1385, and on 14 August 1385 he and his constable Nuno Álvares Pereira, with English help, routed the Castilian army at Aljubarrota, securing Portugal’s independence and the new house of Aviz. Border fighting went on until truces in 1389–1393 and a final peace in 1411.: Det tronföljdskrig, även kallat krisen 1383–1385, som följde på Ferdinand I av Portugals död; hans enda barn, Beatrice, var gift med Johan I av Kastilien. Av fruktan för en union med Kastilien slöt Lissabon och stora delar av landet upp bakom Johan, stormästare för Avizorden och Ferdinands utomäktenskaplige halvbror. Kastilianerna misslyckades med att inta Lissabon 1384, cortes i Coimbra utropade stormästaren till kung som Johan I 1385, och den 14 augusti 1385 slog han och hans konnetabel Nuno Álvares Pereira, med engelsk hjälp, den kastilianska hären på flykten vid Aljubarrota, vilket säkrade Portugals självständighet och det nya huset Aviz. Gränsstriderna fortsatte fram till stillestånd 1389–1393 och en slutlig fred 1411.
