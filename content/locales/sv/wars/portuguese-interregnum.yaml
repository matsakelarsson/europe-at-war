May – September 1384: maj – september 1384
The city held out for four months. Ships from Porto broke through the Castilian fleet on the Tagus to bring in food, and plague finally drove the besiegers away.: Staden höll ut i fyra månader. Fartyg från Porto bröt igenom den kastilianska flottan på Tejo med livsmedel, och till sist drev pesten bort belägrarna.
John I of Castile: Johan I av Kastilien
Porto fleet: Flottan från Porto
At Coimbra, on 6 April 1385, the Cortes heard the lawyer João das Regras argue that neither Beatrice nor the sons of Ferdinand’s father by Inês de Castro had a valid claim, and proclaimed the Master of Aviz king as John I. In May a Castilian raiding force was beaten at Trancoso, and in June John I of Castile invaded with a large army, including French knights, and marched by Coimbra and Leiria towards Lisbon. On 14 August John of Aviz and Nuno Álvares, now his constable, barred its road at Aljubarrota, south of Leiria, with a few thousand Portuguese and some hundreds of English and Gascon soldiers, among them longbowmen.: I Coimbra hörde cortes den 6 april 1385 juristen João das Regras hävda att varken Beatrice eller de söner som Ferdinands far hade fått med Inês de Castro hade något giltigt anspråk, och utropade stormästaren av Aviz till kung som Johan I. I maj slogs en kastiliansk plundringsstyrka vid Trancoso, och i juni invaderade Johan I av Kastilien med en stor här, där även franska riddare ingick, och marscherade förbi Coimbra och Leiria mot Lissabon. Den 14 augusti spärrade Johan av Aviz och Nuno Álvares, nu hans konnetabel, dess väg vid Aljubarrota söder om Leiria med några tusen portugiser och några hundra engelska och gaskognska soldater, bland dem långbågskyttar.
The Portuguese and English fought on foot behind ditches and pits on a narrow front. The French vanguard charged and was cut down, and prisoners taken from it were killed for fear of an attack from behind. When the main Castilian army came up late in the day it broke within about an hour, and many Castilian nobles were among the dead. John of Castile fled to Santarém and by sea to Seville. That October Nuno Álvares carried the war into Castile and won at Valverde. John I founded the monastery of Batalha near the battlefield, and in 1386 he made an alliance with England at Windsor.: Portugiserna och engelsmännen stred till fots bakom diken och gropar på en smal front. Den franska förtruppen anföll och höggs ned, och fångar som tagits från den dödades av fruktan för ett anfall bakifrån. När den kastilianska huvudhären kom fram sent på dagen bröts den inom ungefär en timme, och många kastilianska adelsmän fanns bland de döda. Johan av Kastilien flydde till Santarém och sjövägen till Sevilla. I oktober samma år förde Nuno Álvares kriget in i Kastilien och segrade vid Valverde. Johan I grundade klostret Batalha nära slagfältet, och 1386 slöt han förbund med England i Windsor.
