The main account is the chronicle of Fernão Lopes, written for the house of Aviz some fifty years later. Many Portuguese nobles and towns took Beatrice’s side, so this was a civil war as well as a war with Castile.: Huvudkällan är Fernão Lopes krönika, skriven för huset Aviz omkring femtio år senare. Många portugisiska adelsmän och städer tog Beatrices parti, så detta var ett inbördeskrig såväl som ett krig mot Kastilien.
The chronicles say John I of Castile invaded in 1385 with 31,000 men; modern estimates are lower, but his army was much larger than the Portuguese one.: Enligt krönikorna invaderade Johan I av Kastilien 1385 med 31 000 man; moderna uppskattningar är lägre, men hans här var mycket större än den portugisiska.
Dates are Julian.: Datumen anges enligt den julianska kalendern.
Moves by John of Aviz’s side: Trupprörelser på Johan av Aviz sida
Success for John of Aviz: Framgångar för Johan av Aviz
Ferdinand I of Portugal died on 22 October 1383, leaving one child, Beatrice, who that May had married John I of Castile. By the marriage treaty her mother, Queen Leonor Teles, became regent until Beatrice had a son old enough to reign. Many Portuguese, above all in Lisbon and Porto, feared that Portugal would be swallowed by Castile, and the queen and her favourite, the Galician-born Count João Fernandes Andeiro, were widely hated. On 6 December John, Master of the Order of Aviz, Ferdinand’s illegitimate half-brother, killed Andeiro in the palace, and Lisbon made him Defender of the Realm.: Ferdinand I av Portugal dog den 22 oktober 1383 och efterlämnade ett enda barn, Beatrice, som i maj samma år hade gift sig med Johan I av Kastilien. Enligt äktenskapsfördraget blev hennes mor, drottning Leonor Teles, regent tills Beatrice fått en son som var gammal nog att regera. Många portugiser, framför allt i Lissabon och Porto, fruktade att Portugal skulle uppslukas av Kastilien, och drottningen och hennes gunstling, den galiciskfödde greve João Fernandes Andeiro, var allmänt hatade. Den 6 december dödade Johan, stormästare för Avizorden och Ferdinands utomäktenskaplige halvbror, Andeiro i palatset, och Lissabon utsåg honom till rikets försvarare.
Leonor called on her son-in-law, and John I of Castile entered Portugal and took over the regency; much of the nobility and many towns sided with him. On 6 April 1384 the Master’s young commander, Nuno Álvares Pereira, beat a Castilian force at Atoleiros, his men fighting on foot as the English did. From May the Castilians besieged Lisbon by land and from the Tagus. A Portuguese fleet from Porto fought its way through with food in July, and hunger in the Castilian camp was followed by plague. On 3 September John of Castile lifted the siege and went home.: Leonor vädjade till sin svärson, och Johan I av Kastilien drog in i Portugal och övertog regentskapet; en stor del av adeln och många städer ställde sig på hans sida. Den 6 april 1384 slog stormästarens unge befälhavare Nuno Álvares Pereira en kastiliansk styrka vid Atoleiros, där hans män stred till fots på engelskt vis. Från maj belägrade kastilianerna Lissabon till lands och från Tejo. En portugisisk flotta från Porto kämpade sig igenom med livsmedel i juli, och på hungern i det kastilianska lägret följde pest. Den 3 september hävde Johan av Kastilien belägringen och vände hem.
