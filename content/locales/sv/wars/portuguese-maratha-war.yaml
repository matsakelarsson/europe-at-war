# Svenska översättningar av katalogtexten (våg 8); stegtexterna kommer senare.
Portuguese–Maratha war (1737–1740): Kriget mellan Portugal och maratherna (1737–1740)
The war in which the Marathas under Chimaji Appa, brother of the Peshwa Baji Rao I, conquered the Portuguese Northern Province, the coastal strip north of Bombay that Portugal had held for two hundred years. In 1737 the Marathas took the island fort of Arnala, Thane and most of Salsette island. In 1738–1739 they captured the forts of the coast up to Daman one after another and besieged Bassein, the capital of the province, which surrendered on 16 May 1739 after a three-month siege and costly assaults. Another Maratha army attacked the outer districts of Goa itself. By the peace of 1740, mediated by the English at Bombay, Portugal also gave up Chaul, keeping only Daman, Diu and Goa on the Indian coast.: Kriget där maratherna under Chimaji Appa, bror till peshwan Baji Rao I, erövrade den portugisiska Nordprovinsen, den kustremsa norr om Bombay som Portugal hade innehaft i tvåhundra år. År 1737 intog maratherna öfästningen Arnala, Thane och större delen av ön Salsette. År 1738–1739 erövrade de kustens fästningar ända upp till Daman, den ena efter den andra, och belägrade provinsens huvudstad Bassein, som kapitulerade den 16 maj 1739 efter tre månaders belägring och kostsamma stormningar. En annan maratharmé anföll de yttre distrikten kring själva Goa. Genom freden 1740, som förmedlades av engelsmännen i Bombay, avstod Portugal även Chaul och behöll endast Daman, Diu och Goa på den indiska kusten.
