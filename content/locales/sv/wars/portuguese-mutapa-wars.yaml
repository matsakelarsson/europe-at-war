# Svenska översättningar av katalogtexten (våg 13); stegtexterna kommer senare.
Portuguese–Mutapa wars: Krigen mellan Portugal och Mutapa
? "More than a century of Portuguese attempts to reach and control the gold of the Zimbabwe plateau, and of resistance by its rulers. The Portuguese, established at Sofala and Mozambique Island since the early 1500s and as traders at Sena and Tete on the Zambezi, sent Francisco Barreto with a royal army in 1569 to conquer the mines of the Mwenemutapa, the ruler of the kingdom of Mutapa; disease and the Tonga peoples of the Zambezi valley destroyed the expedition, and his successor Vasco Fernandes Homem found only modest gold workings in Manyika. In the 1600s the Portuguese exploited Mutapa’s succession wars: Gatsi Rusere granted them the mines for help against rebels, and in 1629 they drove out the Mwenemutapa Kapararidze and made his rival Mavura sign a treaty of vassalage to the Portuguese crown. Portuguese traders and backland adventurers then spread over the plateau, living at trading fairs such as Masapa and Dambarare. Their power there was broken by Changamire Dombo, the founder of the Rozvi state, who defeated a Portuguese army at Maungwe in about 1684, sacked Dambarare in 1693 and drove the Portuguese from the plateau; they kept only the Zambezi towns and, later, the fairs of Manyika and Zumbo."
: "Mer än ett sekel av portugisiska försök att nå och kontrollera guldet på Zimbabweplatån, och av motstånd från dess härskare. Portugiserna, som sedan början av 1500-talet var etablerade i Sofala och på Moçambiqueön och som handelsmän i Sena och Tete vid Zambezi, sände 1569 Francisco Barreto med en kunglig armé för att erövra gruvorna som tillhörde Mwenemutapa, härskaren över Mutapariket; sjukdomar och tongafolken i Zambezidalen förintade expeditionen, och hans efterträdare Vasco Fernandes Homem fann bara blygsamma guldbrytningar i Manyika. Under 1600-talet utnyttjade portugiserna Mutapas tronföljdskrig: Gatsi Rusere överlät gruvorna åt dem i utbyte mot hjälp mot upprorsmän, och 1629 drev de bort Mwenemutapa Kapararidze och fick hans rival Mavura att underteckna ett vasallfördrag med den portugisiska kronan. Portugisiska handelsmän och äventyrare från inlandet spred sig sedan över platån och bodde vid handelsmarknader som Masapa och Dambarare. Deras makt där bröts av Changamire Dombo, grundaren av Rozvistaten, som besegrade en portugisisk armé vid Maungwe omkring 1684, plundrade Dambarare 1693 och drev bort portugiserna från platån; de behöll bara städerna vid Zambezi och senare marknaderna i Manyika och Zumbo."
