# Svenska översättningar av katalogtexten (våg 13); stegtexterna kommer senare.
Portuguese–Ndongo wars: Krigen mellan Portugal och Ndongo
? "The near-century of wars by which Portugal turned its trading post at Luanda into the colony of Angola and destroyed the Mbundu kingdom of Ndongo, whose kings bore the title ngola. Paulo Dias de Novais, sent to found a colony, landed in 1575, and war broke out in 1579 when the ngola had the Portuguese at his capital, Kabasa, killed. With few soldiers of their own, the Portuguese fought with the levies of African lords (sobas) who submitted to them and, from about 1615, with the Imbangala, warrior bands from south of the Kwanza. They built a line of forts up the Kwanza (Massangano, Cambambe, Ambaca) and in 1618–1619 sacked Kabasa. Ndongo’s great war leader was Njinga (Nzinga) Mbande, who negotiated peace in Luanda in 1622, took power in 1624 and fought Portugal and its puppet king of Ndongo, based at the rock fortress of Pungo Andongo, from 1626. Driven out, she conquered the kingdom of Matamba, allied with the Dutch when they took Luanda in 1641 and won at Kombi in 1647, before the Portuguese recovered Luanda in 1648; in 1656 she made peace as queen of Matamba. In 1671 the Portuguese stormed Pungo Andongo, whose king had turned against them, and annexed what remained of Ndongo; Matamba accepted Portuguese overlordship in 1683. The wars were above all slave wars: captives taken by the Portuguese, their allies and their enemies made Luanda one of the largest slave ports of the Atlantic, from which hundreds of thousands of people were shipped, most of them to Brazil."
: "De närmare hundra år av krig genom vilka Portugal förvandlade sin handelsstation i Luanda till kolonin Angola och förintade mbundufolkets kungarike Ndongo, vars kungar bar titeln ngola. Paulo Dias de Novais, som hade sänts ut för att grunda en koloni, landsteg 1575, och krig bröt ut 1579 när ngolan lät döda de portugiser som befann sig i hans huvudstad Kabasa. Med få egna soldater stred portugiserna med uppbåd från de afrikanska hövdingar (sobas) som underkastade sig dem och från omkring 1615 med imbangala, krigarband från trakterna söder om Kwanza. De byggde en kedja av fort uppför Kwanza (Massangano, Cambambe, Ambaca) och plundrade Kabasa 1618–1619. Ndongos store krigsledare var Njinga (Nzinga) Mbande, som förhandlade fram fred i Luanda 1622, tog makten 1624 och från 1626 bekämpade Portugal och dess marionettkung i Ndongo, som hade sitt säte i klippfästningen Pungo Andongo. Sedan hon fördrivits erövrade hon kungariket Matamba, slöt förbund med nederländarna när de intog Luanda 1641 och segrade vid Kombi 1647, innan portugiserna återtog Luanda 1648; 1656 slöt hon fred som drottning av Matamba. År 1671 stormade portugiserna Pungo Andongo, vars kung hade vänt sig mot dem, och annekterade det som återstod av Ndongo; Matamba erkände portugisisk överhöghet 1683. Krigen var framför allt slavkrig: de fångar som togs av portugiserna, deras allierade och deras fiender gjorde Luanda till en av Atlantens största slavhamnar, varifrån hundratusentals människor skeppades, de flesta till Brasilien."
