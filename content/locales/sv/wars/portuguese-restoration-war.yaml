After John IV died in November 1656, leaving his widow Luisa de Guzmán as regent for the young Afonso VI, Spain went on the offensive and in 1657 took Olivença after a long siege. A Portuguese siege of Badajoz in 1658 failed, and Luis de Haro, Philip IV’s chief minister, besieged Elvas, whose garrison was dying of disease. On 14 January 1659 a relief army under António Luís de Meneses, Count of Cantanhede, stormed the Spanish siege lines and routed the besiegers. That November, however, the Peace of the Pyrenees ended the war with France and freed Spain’s armies, and France formally left Portugal to its fate.: Sedan Johan IV dött i november 1656 och lämnat sin änka Luisa de Guzmán som regent för den unge Afonso VI gick Spanien till offensiv och intog 1657 Olivença efter en lång belägring. En portugisisk belägring av Badajoz 1658 misslyckades, och Luis de Haro, Filip IV:s ledande minister, belägrade Elvas, vars garnison dog av sjukdomar. Den 14 januari 1659 stormade en undsättningsarmé under António Luís de Meneses, greve av Cantanhede, de spanska belägringslinjerna och slog belägrarna på flykten. I november samma år avslutade dock pyreneiska freden kriget med Frankrike och frigjorde Spaniens arméer, och Frankrike lämnade formellt Portugal åt sitt öde.
Portugal turned to England. In 1662 Charles II married Afonso’s sister Catherine of Braganza, who brought Tangier and Bombay as her dowry, and an English brigade came to Portugal, while the German-born Frederick Schomberg, a soldier in French service, came to train the Portuguese army. In May 1663 Don Juan José of Austria invaded the Alentejo with a large army and took Évora, alarming Lisbon. On 8 June, as he fell back towards the border, a Portuguese and English army under the Count of Vila Flor and Schomberg routed him at Ameixial, and Évora was soon retaken.: Portugal vände sig till England. År 1662 gifte sig Karl II med Afonsos syster Katarina av Bragança, som förde med sig Tanger och Bombay som hemgift, och en engelsk brigad kom till Portugal, medan den tyskfödde Frederick Schomberg, en soldat i fransk tjänst, kom för att utbilda den portugisiska armén. I maj 1663 invaderade don Juan José av Österrike Alentejo med en stor armé och intog Évora, vilket väckte oro i Lissabon. Den 8 juni, när han drog sig tillbaka mot gränsen, slog en portugisisk och engelsk armé under greven av Vila Flor och Schomberg honom på flykten vid Ameixial, och Évora återtogs snart.
