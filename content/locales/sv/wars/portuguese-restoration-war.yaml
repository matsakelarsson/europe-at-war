Dates are Gregorian. Portuguese historians call the war the Guerra da Restauração, and 1 December is a public holiday in Portugal.: Datumen anges enligt den gregorianska kalendern. Portugisiska historiker kallar kriget Guerra da Restauração, och 1 december är allmän helgdag i Portugal.
Portugal stays a separate kingdom on the base map during the union with Spain, so the coup of 1640 does not change the map. Ceuta, which kept its loyalty to Philip IV in 1640, is shown as Spanish only from the treaty of 1668.: Portugal förblir ett separat kungarike på baskartan under unionen med Spanien, så kuppen 1640 ändrar inte kartan. Ceuta, som förblev lojalt mot Filip IV 1640, visas som spanskt först från fördraget 1668.
France helped Portugal with money and officers, and England sent a brigade after the marriage of Charles II and Catherine of Braganza in 1662. Their soldiers fought under Portuguese command.: Frankrike hjälpte Portugal med pengar och officerare, och England sände en brigad efter giftermålet mellan Karl II och Katarina av Bragança 1662. Deras soldater stred under portugisiskt befäl.
