Often counted the most important battle in Portuguese history. Thousands of Spanish soldiers were killed or captured, along with their guns.: Räknas ofta som det viktigaste slaget i Portugals historia. Tusentals spanska soldater dödades eller tillfångatogs, liksom deras kanoner.
Signed under English mediation, it ended twenty-seven years of war and the union of the crowns.: Fördraget, som undertecknades under engelsk medling, avslutade tjugosju års krig och unionen mellan kronorna.
