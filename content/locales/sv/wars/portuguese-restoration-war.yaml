In the north, on 7 July 1664, Pedro Jacques de Magalhães beat the Duke of Osuna, who was besieging Castelo Rodrigo, near the border of Beira. In June 1665 a new Spanish commander, the Marquis of Caracena, marched into the Alentejo with some 23,000 men and took the town of Vila Viçosa, though its citadel held out. On 17 June the Portuguese army under Meneses, now Marquis of Marialva, and Schomberg met him at Montes Claros, between Vila Viçosa and Estremoz. Their infantry and guns threw back repeated cavalry charges, and the Spanish army was destroyed.: I norr slog Pedro Jacques de Magalhães den 7 juli 1664 hertigen av Osuna, som belägrade Castelo Rodrigo, nära gränsen i Beira. I juni 1665 marscherade en ny spansk befälhavare, markisen av Caracena, in i Alentejo med omkring 23 000 man och intog staden Vila Viçosa, även om dess citadell höll stånd. Den 17 juni mötte den portugisiska armén under Meneses, nu markis av Marialva, och Schomberg honom vid Montes Claros, mellan Vila Viçosa och Estremoz. Deras infanteri och kanoner slog tillbaka upprepade kavallerianfall, och den spanska armén tillintetgjordes.
It was the last great battle of the war. Philip IV died that September, leaving a sickly three-year-old son, Charles II, and his regents wanted peace. In Portugal Afonso VI was pushed aside in 1667–1668 by his brother Peter, who became regent. With English mediation, the Treaty of Lisbon was signed on 13 February 1668. Spain recognised the House of Braganza and Portugal’s independence, and each side gave back what it had taken, except that Ceuta, which had stayed loyal to Philip IV, remained Spanish.: Det var krigets sista stora slag. Filip IV dog i september samma år och efterlämnade en sjuklig treårig son, Karl II, vars förmyndare ville ha fred. I Portugal sköts Afonso VI åt sidan 1667–1668 av sin bror Peter, som blev regent. Med engelsk medling undertecknades freden i Lissabon den 13 februari 1668. Spanien erkände huset Bragança och Portugals självständighet, och båda sidor lämnade tillbaka vad de hade erövrat, utom att Ceuta, som hade förblivit lojalt mot Filip IV, förblev spanskt.
