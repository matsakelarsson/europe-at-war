Portuguese Restoration War: Portugisiska restaurationskriget
The war by which Portugal broke away from the Spanish monarchy after sixty years of union under the same kings. Begun by a coup in Lisbon on 1 December 1640 that made the Duke of Braganza King John IV, it was fought mostly along the border of the Alentejo and Spanish Extremadura, and ended after Portuguese victories at Elvas, Ameixial and Montes Claros with the Treaty of Lisbon of 1668, in which Spain recognised Portugal’s independence.: Kriget genom vilket Portugal bröt sig loss från den spanska monarkin efter sextio års union under samma kungar. Det inleddes med en statskupp i Lissabon den 1 december 1640 som gjorde hertigen av Bragança till kung Johan IV, utkämpades mest längs gränsen mellan Alentejo och spanska Extremadura och slutade efter portugisiska segrar vid Elvas, Ameixial och Montes Claros med freden i Lissabon 1668, där Spanien erkände Portugals självständighet.
