Portuguese success: Portugisiska framgångar
Under the Spanish kings Portugal had kept its own laws and institutions, but by the 1630s many Portuguese felt their empire was being lost to the Dutch while Olivares raised new taxes and tried to draw Portugal into Castile’s wars. In 1640, with Spain fighting France and facing revolt in Catalonia, Portuguese nobles struck. On 1 December a group of conspirators burst into the palace in Lisbon, killed the hated Secretary of State, Miguel de Vasconcelos, and arrested the vicereine, Margaret of Savoy. The Duke of Braganza was acclaimed King John IV, and almost all of the empire followed, except Ceuta.: Under de spanska kungarna hade Portugal behållit sina egna lagar och institutioner, men på 1630-talet ansåg många portugiser att deras imperium gick förlorat till holländarna medan Olivares tog ut nya skatter och försökte dra in Portugal i Kastiliens krig. År 1640, när Spanien låg i krig med Frankrike och stod inför uppror i Katalonien, slog portugisiska adelsmän till. Den 1 december trängde en grupp sammansvurna in i palatset i Lissabon, dödade den hatade statssekreteraren Miguel de Vasconcelos och arresterade vicedrottningen, Margareta av Savojen. Hertigen av Bragança hyllades som kung Johan IV, och nästan hela imperiet följde efter, utom Ceuta.
Spain could not spare a large army, and for years the war along the frontier of the Alentejo and Extremadura was one of raids, cattle-rustling and burnt villages. Portugal rebuilt its border fortresses, above all Elvas, facing the Spanish base at Badajoz. On 26 May 1644 Matias de Albuquerque, a veteran of the wars in Brazil, beat a Spanish army under the Marquis of Torrecuso at Montijo, and that autumn Elvas held out against a nine-day siege. Through the following decade neither side could mount a major campaign; Portugal used the time to win back north-eastern Brazil from the Dutch, who surrendered there in 1654.: Spanien kunde inte avvara någon stor armé, och i åratal var kriget längs gränsen mellan Alentejo och Extremadura ett krig av räder, boskapsstölder och brända byar. Portugal byggde upp sina gränsfästningar igen, framför allt Elvas mittemot den spanska basen i Badajoz. Den 26 maj 1644 slog Matias de Albuquerque, en veteran från krigen i Brasilien, en spansk armé under markisen av Torrecuso vid Montijo, och samma höst stod Elvas emot en nio dagar lång belägring. Under det följande decenniet kunde ingen av sidorna genomföra något större fälttåg; Portugal använde tiden till att återvinna nordöstra Brasilien från holländarna, som kapitulerade där 1654.
