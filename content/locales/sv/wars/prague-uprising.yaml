The Russian Liberation Army (ROA) was led by Andrey Vlasov, a captured Soviet general. Its men left Prague before the Red Army arrived, hoping to surrender to the Americans; many were handed over to the Soviet Union and executed or imprisoned.: Ryska befrielsearmén (ROA) leddes av Andrej Vlasov, en tillfångatagen sovjetisk general. Dess män lämnade Prag innan Röda armén anlände, i hopp om att få kapitulera för amerikanerna; många utlämnades till Sovjetunionen och avrättades eller fängslades.
Numbers of dead are uncertain. The lower figure for the insurgents is the official count of 1946, which included only identified dead.: Antalet döda är osäkert. Den lägre siffran för upprorsmännen är den officiella räkningen från 1946, som bara omfattade identifierade döda.
