Prague uprising: Pragupproret
A rising by the people of Prague against the German occupation in the last days of the Second World War in Europe. It broke out on 5 May 1945 around the radio building, and the insurgents, most of them civilians with few weapons, put up hundreds of barricades. German forces, reinforced by Waffen-SS units, counter-attacked. On 6–7 May the 1st Division of the Russian Liberation Army, former Soviet prisoners who had served Germany, turned against the Germans before withdrawing west, while the US Third Army, which had reached Plzeň, was ordered not to advance. On 8 May the Czech National Council agreed a ceasefire that let the Germans leave the city, but some SS units fought on until the Red Army arrived on 9 May. Between about 1,700 and 2,900 insurgents and many civilians were killed, as were 1,000 or more German soldiers. Both sides committed massacres, and violence against German civilians went on after the fighting.: Ett uppror av Prags befolkning mot den tyska ockupationen under andra världskrigets sista dagar i Europa. Det bröt ut den 5 maj 1945 kring radiohuset, och upprorsmännen, de flesta civila med få vapen, reste hundratals barrikader. Tyska styrkor, förstärkta av Waffen-SS-förband, gick till motanfall. Den 6–7 maj vände sig Ryska befrielsearméns 1:a division, tidigare sovjetiska krigsfångar som tjänat Tyskland, mot tyskarna innan den drog sig tillbaka västerut, medan den amerikanska tredje armén, som hade nått Plzeň, beordrades att inte rycka fram. Den 8 maj gick Tjeckiska nationalrådet med på ett eldupphör som lät tyskarna lämna staden, men vissa SS-förband fortsatte striden tills Röda armén anlände den 9 maj. Mellan omkring 1 700 och 2 900 upprorsmän och många civila dödades, liksom 1 000 eller fler tyska soldater. Båda sidor begick massakrer, och våldet mot tyska civila fortsatte efter striderna.
