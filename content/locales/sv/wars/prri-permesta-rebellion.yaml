# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
PRRI and Permesta rebellions: PRRI- och Permestaupproren
? "The regional rebellions in Sumatra and Sulawesi against the central government of President Sukarno. Army commanders and politicians in the outer islands resented Jakarta’s control of their export earnings, the growing influence of the Communist Party (PKI) and Sukarno’s turn towards “Guided Democracy”; from December 1956 military councils took over local government in Sumatra, and on 2 March 1957 Lieutenant Colonel Ventje Sumual proclaimed the Permesta charter in Makassar. On 15 February 1958, after a five-day ultimatum, Lieutenant Colonel Ahmad Husein proclaimed the Revolutionary Government of the Republic of Indonesia (PRRI) in Padang, with Sjafruddin Prawiranegara as prime minister and the support of leaders of the Masyumi and Socialist parties such as Mohammad Natsir and Sumitro Djojohadikusumo; Permesta, by then based in Manado, joined it two days later. The American CIA secretly supplied the rebels with arms and a small air force. General Abdul Haris Nasution’s army answered with seaborne and airborne landings: Pekanbaru and its oil fields were taken on 12 March, Padang on 17 April and Bukittinggi on 4 May 1958. On 18 May an American pilot, Allen Pope, was shot down and captured after a bombing raid on Ambon, and Washington dropped the rebels. Manado fell at the end of June 1958, and the rebels fought on as guerrillas in the hills of Sumatra and Minahasa until an amnesty brought their surrender in 1961: Husein in May, Natsir on 28 September and Sumual on 20 October. Estimates of the dead range from about 7,000, the figure Nasution gave, to more than 30,000 in both rebellions, many of them civilians. The defeat strengthened the army and Sukarno, who banned Masyumi and the Socialist Party in 1960 and turned to the Soviet Union for arms."
: "De regionala upproren på Sumatra och Sulawesi mot president Sukarnos centralregering. Arméchefer och politiker på de yttre öarna var förbittrade över Jakartas kontroll över deras exportinkomster, kommunistpartiets (PKI) växande inflytande och Sukarnos vändning mot ”styrd demokrati”; från december 1956 tog militärråd över lokalförvaltningen på Sumatra, och den 2 mars 1957 utropade överstelöjtnant Ventje Sumual Permestastadgan i Makassar. Den 15 februari 1958, efter ett femdagarsultimatum, utropade överstelöjtnant Ahmad Husein Republiken Indonesiens revolutionära regering (PRRI) i Padang, med Sjafruddin Prawiranegara som premiärminister och med stöd av ledare för Masyumi och Socialistpartiet som Mohammad Natsir och Sumitro Djojohadikusumo; Permesta, som då hade sin bas i Manado, anslöt sig två dagar senare. Den amerikanska underrättelsetjänsten CIA försåg i hemlighet rebellerna med vapen och ett litet flygvapen. General Abdul Haris Nasutions armé svarade med landstigningar från sjön och luftlandsättningar: Pekanbaru och dess oljefält intogs den 12 mars, Padang den 17 april och Bukittinggi den 4 maj 1958. Den 18 maj sköts en amerikansk pilot, Allen Pope, ned och tillfångatogs efter en bombräd mot Ambon, och Washington övergav rebellerna. Manado föll i slutet av juni 1958, och rebellerna fortsatte striden som gerilla i bergen på Sumatra och i Minahasa tills en amnesti fick dem att ge upp 1961: Husein i maj, Natsir den 28 september och Sumual den 20 oktober. Uppskattningarna av antalet döda i de båda upproren sträcker sig från omkring 7 000, den siffra som Nasution angav, till över 30 000, många av dem civila. Nederlaget stärkte armén och Sukarno, som förbjöd Masyumi och Socialistpartiet 1960 och vände sig till Sovjetunionen för att få vapen."
