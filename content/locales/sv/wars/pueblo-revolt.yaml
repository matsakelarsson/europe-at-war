# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
Pueblo Revolt: Puebloupproret
? The rising of the Pueblo peoples of the upper Rio Grande against Spanish rule in the province of Santa Fe de Nuevo México, and the Spanish reconquest that followed. After eighty years of forced labour and tribute under the encomienda, the suppression of Pueblo religion by Franciscan missionaries, drought, famine and Apache raids, leaders of some two dozen pueblos speaking six languages, among them Popé (Po’pay) of Ohkay Owingeh, coordinated a revolt with runners carrying knotted cords. On 10 August 1680 they rose together and killed about 400 colonists, among them 21 of the province’s 33 Franciscans, besieged Governor Antonio de Otermín in Santa Fe and forced some 2,000 survivors to retreat to El Paso del Norte. For twelve years the Pueblos governed themselves, though drought, raids and quarrels divided them. Diego de Vargas returned in 1692 and won the submission of most pueblos without a battle; when he brought colonists back in 1693 he retook Santa Fe by force, executed seventy defenders and gave their families to colonists as servants. A second revolt in 1696 was put down by the end of the year, but the Spanish did not restore the encomienda, granted land to each pueblo and largely left Pueblo religion alone. The Hopi stayed independent.
: Resningen bland pueblofolken vid övre Rio Grande mot det spanska styret i provinsen Santa Fe de Nuevo México, och den spanska återerövring som följde. Efter åttio år av tvångsarbete och tribut under encomiendan, franciskanmissionärernas undertryckande av pueblofolkens religion, torka, hungersnöd och apachernas räder samordnade ledare för ett par dussin pueblobyar med sex olika språk, bland dem Popé (Po’pay) från Ohkay Owingeh, ett uppror med hjälp av budbärare som bar knutna snören. Den 10 augusti 1680 reste de sig samtidigt och dödade omkring 400 kolonister, bland dem 21 av provinsens 33 franciskaner, belägrade guvernör Antonio de Otermín i Santa Fe och tvingade omkring 2 000 överlevande att dra sig tillbaka till El Paso del Norte. I tolv år styrde pueblofolken sig själva, även om torka, räder och gräl splittrade dem. Diego de Vargas återvände 1692 och fick de flesta pueblobyar att underkasta sig utan strid; när han förde tillbaka kolonister 1693 återtog han Santa Fe med våld, avrättade sjuttio försvarare och gav deras familjer åt kolonisterna som tjänstefolk. Ett andra uppror 1696 slogs ned före årets slut, men spanjorerna återinförde inte encomiendan, tilldelade varje pueblo land och lät i stort sett pueblofolkens religion vara i fred. Hopifolket förblev självständigt.
