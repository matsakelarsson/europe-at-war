# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
Puerto Rican Nationalist revolts of 1950: Nationalistupproren i Puerto Rico 1950
? Armed risings by the Puerto Rican Nationalist Party of Pedro Albizu Campos, which sought independence from the United States. The party rejected the commonwealth status that Public Law 600, signed by President Harry S. Truman on 3 July 1950, allowed Puerto Ricans to adopt under a constitution of their own, and called it a continuation of colonial rule; it had been under pressure since the Ponce massacre of 1937, and the Gag Law (Ley de la Mordaza) of 1948 made it a crime even to display the Puerto Rican flag. After a police raid at Peñuelas on 29 October, Nationalists rose in several towns on 30 October 1950. In Jayuya, Blanca Canales proclaimed the Republic of Puerto Rico in the town square while her followers burned the police station and post office, and the town was held for some days until the Puerto Rico National Guard retook it after attacks by P-47 fighter-bombers and artillery. In Utuado guardsmen shot nine Nationalists who had surrendered, killing five, and aircraft strafed the town. In San Juan four Nationalists were killed attacking La Fortaleza, the residence of Governor Luis Muñoz Marín, and police and guardsmen besieged the barber Vidal Santiago Díaz in his shop, the Salón Boricua, in a gunfight broadcast live on the radio. There was fighting in Arecibo, Mayagüez, Ponce and Naranjito, where a guerrilla band under José Antonio Negrón held out in the hills until 6 November; Negrón was arrested on 10 November. On 1 November two Nationalists from New York, Oscar Collazo and Griselio Torresola, attacked Blair House in Washington to kill Truman; Torresola and the White House policeman Leslie Coffelt were killed. The risings left 28 dead (16 Nationalists, 7 policemen, a National Guardsman and 4 civilians) and 49 wounded, and hundreds of independence supporters, Albizu Campos among them, were imprisoned. In 1952 about 82 per cent of voters approved the constitution of the Commonwealth (Estado Libre Asociado); the Nationalists rejected the vote, which offered neither independence nor statehood, and in 1954 four of them opened fire in the US House of Representatives, wounding five congressmen.
: Väpnade resningar av Puerto Ricos nationalistparti under Pedro Albizu Campos, som eftersträvade självständighet från USA. Partiet förkastade den samväldesstatus som Public Law 600, undertecknad av president Harry S. Truman den 3 juli 1950, gav puertoricanerna möjlighet att anta under en egen författning, och kallade den en fortsättning på kolonialstyret; partiet hade varit utsatt för påtryckningar sedan massakern i Ponce 1937, och munkavlelagen (Ley de la Mordaza) från 1948 gjorde det till ett brott att ens visa Puerto Ricos flagga. Efter en polisräd i Peñuelas den 29 oktober gjorde nationalister uppror i flera städer den 30 oktober 1950. I Jayuya utropade Blanca Canales Republiken Puerto Rico på stadens torg medan hennes anhängare brände polisstationen och postkontoret, och staden hölls i några dagar tills Puerto Ricos nationalgarde återtog den efter anfall med P-47-jaktbombare och artilleri. I Utuado sköt gardister nio nationalister som hade kapitulerat, varvid fem dödades, och flygplan beskröt staden. I San Juan dödades fyra nationalister vid ett anfall mot La Fortaleza, guvernör Luis Muñoz Maríns residens, och polis och gardister belägrade frisören Vidal Santiago Díaz i hans frisersalong, Salón Boricua, i en eldstrid som sändes direkt i radio. Det förekom strider i Arecibo, Mayagüez, Ponce och Naranjito, där ett gerillaband under José Antonio Negrón höll ut i bergen till den 6 november; Negrón greps den 10 november. Den 1 november angrep två nationalister från New York, Oscar Collazo och Griselio Torresola, Blair House i Washington för att döda Truman; Torresola och Leslie Coffelt från Vita husets polis dödades. Resningarna krävde 28 döda (16 nationalister, 7 poliser, en nationalgardist och 4 civila) och 49 sårade, och hundratals självständighetsanhängare, bland dem Albizu Campos, fängslades. År 1952 godkände omkring 82 procent av väljarna författningen för samväldet (Estado Libre Asociado); nationalisterna förkastade omröstningen, som varken erbjöd självständighet eller delstatsstatus, och 1954 öppnade fyra av dem eld i USA:s representanthus och sårade fem kongressledamöter.
