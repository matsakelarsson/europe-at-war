November 1773 – April 1774: november 1773 – april 1774
Besieged by rebel bands under Ivan Zarubin until a relief column scattered them.: Belägrades av rebellskaror under Ivan Zarubin tills en undsättningskolonn skingrade dem.
Pugachev: Pugatjov
In the Urals and Bashkiria Pugachev raised a new army. Bibikov died of fever in April, and the government’s troops were spread thin over a vast country. The rebels, joined by Bashkirs and ironworkers, burned factories and took towns and works such as Krasnoufimsk, Osa and Izhevsk, and Pugachev turned west towards the Volga with a large but poorly armed host. On 23 July he stormed Kazan, one of the empire’s largest cities, and burned much of it, though the garrison held out in the kremlin.: I Ural och Basjkirien samlade Pugatjov en ny armé. Bibikov dog i feber i april, och regeringens trupper var glest utspridda över ett väldigt land. Rebellerna, som fått anslutning av basjkirer och bruksarbetare, brände fabriker och intog städer och bruk som Krasnoufimsk, Osa och Izjevsk, och Pugatjov vände västerut mot Volga med en stor men dåligt beväpnad här. Den 23 juli stormade han Kazan, en av rikets största städer, och brände stora delar av den, även om garnisonen höll ut i kreml.
Ivan Mikhelson, who had chased Pugachev through the Urals, arrived the same day and beat the rebels in three days of fighting outside the city. Pugachev’s army was killed, captured or scattered, but he escaped and crossed the Volga with a few hundred men on 28 July. Across the river, in the lands of the serf-owning nobility, he found a new following.: Ivan Michelson, som hade jagat Pugatjov genom Ural, anlände samma dag och besegrade rebellerna i tre dagars strider utanför staden. Pugatjovs armé dödades, tillfångatogs eller skingrades, men han undkom och gick över Volga med några hundra man den 28 juli. På andra sidan floden, i den livegenägande adelns land, fann han nya anhängare.
