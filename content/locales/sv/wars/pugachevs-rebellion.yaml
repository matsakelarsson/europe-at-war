The town on the Kama surrendered after a week’s siege, opening the way west towards Kazan.: Staden vid Kama kapitulerade efter en veckas belägring, vilket öppnade vägen västerut mot Kazan.
23 July 1774: 23 juli 1774
The rebels broke into the city and burned much of it. Mikhelson’s troops then routed them outside the walls.: Rebellerna bröt sig in i staden och brände stora delar av den. Michelsons trupper slog dem sedan på flykten utanför murarna.
Mikhelson: Michelson
On the right bank of the Volga, among the serf villages, the rising became a peasant war. On 11 August Pugachev issued a manifesto granting the serfs their freedom and calling on them to deal with their landlords, and hundreds of manor houses were burned and many noble families killed. Penza and Saratov fell as he swept south along the river, and there was alarm in Moscow. But the Treaty of Küçük Kaynarca had ended the Turkish war in July, and regular troops were coming back to deal with him, among them Alexander Suvorov.: På Volgas högra strand, bland de livegnas byar, blev upproret ett bondekrig. Den 11 augusti utfärdade Pugatjov ett manifest som gav de livegna friheten och uppmanade dem att göra upp med sina godsägare, och hundratals herrgårdar brändes och många adelsfamiljer dödades. Penza och Saratov föll när han svepte söderut längs floden, och i Moskva rådde oro. Men freden i Küçük Kaynarca hade avslutat det turkiska kriget i juli, och reguljära trupper återvände för att ta itu med honom, bland dem Aleksandr Suvorov.
On 1 September Pugachev failed to take Tsaritsyn, and on 5 September Mikhelson caught and destroyed his army at Solenikova Vataga, downstream from the town. Pugachev fled into the steppe east of the Volga, where his own Cossack lieutenants seized him and handed him over at Yaitsk later that month. He was taken to Moscow in a cage and executed on Bolotnaya Square on 21 January 1775. Troops under Count Pyotr Panin hanged rebels across the Volga lands. The Yaik was renamed the Ural, and Yaitsk became Uralsk.: Den 1 september misslyckades Pugatjov med att inta Tsaritsyn, och den 5 september hann Michelson upp och förintade hans armé vid Solenikova Vataga, nedströms staden. Pugatjov flydde ut på stäppen öster om Volga, där hans egna kosackunderbefälhavare grep honom och lämnade ut honom i Jaitsk senare samma månad. Han fördes till Moskva i en bur och avrättades på Bolotnajatorget den 21 januari 1775. Trupper under greve Pjotr Panin hängde rebeller över hela Volgaområdet. Floden Jaik döptes om till Ural, och Jaitsk blev Uralsk.
