Pugachev’s Rebellion: Pugatjovupproret
The largest popular rising in the history of the Russian Empire, led by the Don Cossack Yemelyan Pugachev, who claimed to be the overthrown emperor Peter III. Begun by the Yaik Cossacks in 1773 and joined by Bashkirs, Tatars, Ural factory serfs and finally peasants of the Volga lands, it besieged Orenburg, burned Kazan and killed many landowners before it was crushed in 1774. Pugachev was executed in Moscow in January 1775.: Det största folkupproret i Ryska rikets historia, lett av donkosacken Jemeljan Pugatjov, som påstod sig vara den störtade kejsaren Peter III. Upproret inleddes av jaikkosackerna 1773 och fick anslutning av basjkirer, tatarer, livegna fabriksarbetare i Ural och slutligen bönder i Volgaområdet; det belägrade Orenburg, brände Kazan och dödade många godsägare innan det krossades 1774. Pugatjov avrättades i Moskva i januari 1775.
