Dates are New Style (Gregorian). Russia used the Julian calendar, eleven days behind, and Russian accounts give the Old Style dates, such as 17 September 1773 for the start of the rising and 10 January 1775 for Pugachev’s execution.: Datumen anges enligt nya stilen (gregorianska kalendern). Ryssland använde den julianska kalendern, som låg elva dagar efter, och ryska framställningar anger datumen enligt gamla stilen, till exempel 17 september 1773 för upprorets början och 10 januari 1775 för Pugatjovs avrättning.
Also called the Peasants’ War of 1773–1775. Yaitsk is today’s Oral in Kazakhstan, and Tsaritsyn is Volgograd.: Kallas även bondekriget 1773–1775. Jaitsk är dagens Oral i Kazakstan, och Tsaritsyn är Volgograd.
Yemelyan Pugachev, a Don Cossack who had deserted from the army, appeared among the Yaik Cossacks in 1773 claiming to be Peter III, Catherine II’s husband, who had been overthrown and killed in 1762. The Yaik Cossacks, many of them Old Believers, had risen in 1772 against the government’s inroads on their freedoms and been harshly punished. In September 1773 a small band of them followed Pugachev against Yaitsk. He could not take its fortress, but he swept up the line of small forts along the Yaik, whose garrisons often went over to him. Officers who resisted were hanged.: Jemeljan Pugatjov, en donkosack som hade deserterat från armén, dök 1773 upp bland jaikkosackerna och påstod sig vara Peter III, Katarina II:s make, som hade störtats och dödats 1762. Jaikkosackerna, av vilka många var gammaltroende, hade 1772 rest sig mot regeringens intrång i deras friheter och straffats hårt. I september 1773 följde en liten skara av dem Pugatjov mot Jaitsk. Han kunde inte inta dess fästning, men han svepte uppför linjen av små fort längs Jaik, vars garnisoner ofta gick över till honom. Officerare som gjorde motstånd hängdes.
In October he laid siege to Orenburg, the seat of government in the region, and set up his camp and his own “War College” at nearby Berda. Bashkirs under Salawat Yulayev, Tatars, Kalmyks and serfs from the Ural ironworks joined him, his bands besieged Ufa, and the revolt spread into the Urals and western Siberia. A government force was beaten in November. Orenburg went hungry for six months, until a larger army under General Aleksandr Bibikov arrived. On 2 April 1774 Prince Pyotr Golitsyn crushed Pugachev at the Tatishchev fortress, Orenburg and Ufa were relieved, and Pugachev fled into the southern Urals.: I oktober belägrade han Orenburg, regionens regeringssäte, och upprättade sitt läger och sitt eget ”krigskollegium” i närbelägna Berda. Basjkirer under Salavat Julajev, tatarer, kalmucker och livegna från järnbruken i Ural anslöt sig till honom, hans skaror belägrade Ufa, och upproret spred sig till Ural och västra Sibirien. En regeringsstyrka besegrades i november. Orenburg led av hunger i sex månader tills en större armé under general Aleksandr Bibikov anlände. Den 2 april 1774 krossade furst Pjotr Golitsyn Pugatjov vid Tatisjtjevfästningen, Orenburg och Ufa undsattes, och Pugatjov flydde in i södra Ural.
