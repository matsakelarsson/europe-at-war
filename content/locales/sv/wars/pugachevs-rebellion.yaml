Golitsyn’s troops stormed Pugachev’s defences and killed or captured thousands of rebels, ending the siege of Orenburg.: Golitsyns trupper stormade Pugatjovs försvarsverk och dödade eller tillfångatog tusentals rebeller, vilket gjorde slut på belägringen av Orenburg.
