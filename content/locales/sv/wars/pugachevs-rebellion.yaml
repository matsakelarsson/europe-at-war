The rising began among the Yaik Cossacks outside the town, today’s Oral. The garrison held the fortress through the rebellion.: Upproret började bland jaikkosackerna utanför staden, dagens Oral. Garnisonen höll fästningen under hela upproret.
The town held out through a hungry winter while Pugachev ruled his followers from his camp at Berda nearby.: Staden höll ut under en vinter av hunger medan Pugatjov styrde sina anhängare från sitt läger i närbelägna Berda.
