Qarmatian wars: Qarmaternas krig
The wars of the Qarmatians of Bahrayn, a radical Ismaili Shi’i movement that built a state in eastern Arabia around the oasis of al-Ahsa, against the Abbasid caliphate. Abu Sa’id al-Jannabi took Qatif and Hajar in 899–903 and destroyed a caliphal army in 900. Under his son Abu Tahir the Qarmatians sacked Basra in 923, plundered the pilgrim caravans, came within sight of Baghdad in 928 and in January 930 sacked Mecca during the pilgrimage and carried off the Black Stone of the Kaaba, which they gave back only in 951. In the 970s they fought the Fatimids for Syria and Egypt.: De krig som qarmaterna i Bahrayn, en radikal ismailitisk shiitisk rörelse som byggde upp en stat i östra Arabien kring oasen al-Ahsa, förde mot det abbasidiska kalifatet. Abu Sa’id al-Jannabi intog Qatif och Hajar 899–903 och förintade en kalifarmé år 900. Under hans son Abu Tahir plundrade qarmaterna Basra 923, överföll pilgrimskaravanerna, kom inom synhåll från Bagdad 928 och skövlade i januari 930 Mecka under vallfärden och förde bort Kaabas svarta sten, som de lämnade tillbaka först 951. På 970-talet stred de mot fatimiderna om Syrien och Egypten.
