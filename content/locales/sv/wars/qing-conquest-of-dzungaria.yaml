# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
Qing conquest of the Dzungar Khanate: Qingdynastins erövring av Dzungarkhanatet
? "The campaigns in which the Qing empire destroyed the Dzungar Khanate, the last great nomad state of Inner Asia, and most of the Dzungar people with it. After the death of Galdan Tseren in 1745 the khanate broke up in succession wars, and in 1754 the defeated prince Amursana went over to the Qing. In 1755 two Qing armies, with Amursana, marched to the Ili valley almost unopposed; the khan Dawachi was captured and the khanate dissolved. When the Qianlong emperor offered Amursana only a share of the Dzungar lands, he rebelled in September 1755, and the Khalkha prince Chingünjav rose in 1756. In 1757–1758 the Qing crushed both risings, and the emperor ordered that the Dzungar men be killed. War, massacre, a smallpox epidemic, Kazakh raids and flight destroyed the Dzungars as a people: of a population put at about 600,000, most estimates of the dead range from about 420,000 to 480,000. Amursana died in Russian exile in 1757. The Qing resettled Dzungaria with soldiers and farmers from elsewhere in the empire and, after conquering the Tarim basin in 1759, called the new territory Xinjiang."
: "De fälttåg där Qingriket förintade Dzungarkhanatet, Inre Asiens sista stora nomadstat, och med det större delen av det dzungariska folket. Efter Galdan Tserens död 1745 föll khanatet sönder i tronföljdskrig, och 1754 gick den besegrade fursten Amursana över till Qing. År 1755 marscherade två Qingarméer, med Amursana, till Ilidalen nästan utan motstånd; khanen Dawachi tillfångatogs och khanatet upplöstes. När Qianlongkejsaren erbjöd Amursana endast en del av dzungarernas land gjorde han uppror i september 1755, och khalkhafursten Chingünjav reste sig 1756. Åren 1757–1758 krossade Qing båda resningarna, och kejsaren beordrade att de dzungariska männen skulle dödas. Krig, massaker, en smittkoppsepidemi, kazakiska räder och flykt utplånade dzungarerna som folk: av en befolkning som uppskattas till omkring 600 000 varierar de flesta uppskattningarna av antalet döda från omkring 420 000 till 480 000. Amursana dog i rysk landsflykt 1757. Qing befolkade Dzungariet på nytt med soldater och bönder från andra delar av riket och kallade, sedan Tarimbäckenet hade erövrats 1759, det nya territoriet Xinjiang."
