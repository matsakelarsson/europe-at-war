# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
Qing conquest of the Ming: Qingdynastins erövring av Mingriket
? The war in which the Manchu Qing dynasty, with the help of the Ming generals who went over to it, took China from the rebels who had overthrown the Ming and from the Ming princes who tried to restore it. In April 1644 the rebel leader Li Zicheng took Beijing and the last Ming emperor at Beijing hanged himself. The Ming commander at Shanhai Pass, Wu Sangui, let the Qing army through the Great Wall, and on 27 May 1644 their combined armies routed Li Zicheng; the Qing regent Dorgon entered Beijing in June and made it the capital of the Qing. Over the next two years Qing armies drove Li Zicheng out of Shaanxi, took Yangzhou, where the city was sacked, and Nanjing, and put down risings in the Yangtze delta against the order that all men shave their heads in the Manchu style. A succession of Ming princes, the Southern Ming, held parts of the south, helped from 1648 by Ming generals who changed sides again and from 1652 by the armies of the late rebel Zhang Xianzhong under Li Dingguo. In 1658–1659 Qing armies took Guizhou and Yunnan, and the last Ming claimant, the Yongli Emperor, fled to Burma. Handed over to Wu Sangui in January 1662, he was executed at Kunming that June. Ming loyalists held Taiwan until 1683.
: Kriget där den manchuiska Qingdynastin, med hjälp av de Minggeneraler som gick över till den, tog Kina från de rebeller som hade störtat Ming och från de Mingprinsar som försökte återupprätta dynastin. I april 1644 intog rebelledaren Li Zicheng Peking, och den siste Mingkejsaren i Peking hängde sig. Mings befälhavare vid Shanhaipasset, Wu Sangui, släppte in Qingarmén genom Kinesiska muren, och den 27 maj 1644 slog deras förenade arméer Li Zicheng på flykten; Qingregenten Dorgon tågade in i Peking i juni och gjorde staden till Qingdynastins huvudstad. Under de följande två åren drev Qingarméerna ut Li Zicheng ur Shaanxi, intog Yangzhou, där staden plundrades, och Nanking, och slog ned resningar i Yangtzedeltat mot påbudet att alla män skulle raka huvudet på manchuiskt vis. En rad Mingprinsar, Södra Ming, höll delar av södern, från 1648 med hjälp av Minggeneraler som åter bytte sida och från 1652 av den avlidne rebellen Zhang Xianzhongs arméer under Li Dingguo. Åren 1658–1659 intog Qingarméerna Guizhou och Yunnan, och den siste Mingpretendenten, Yonglikejsaren, flydde till Burma. Han utlämnades till Wu Sangui i januari 1662 och avrättades i Kunming i juni samma år. Minglojalister höll Taiwan till 1683.
