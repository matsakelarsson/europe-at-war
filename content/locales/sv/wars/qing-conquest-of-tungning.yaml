Qing conquest of Taiwan: Qingdynastins erövring av Taiwan
The campaign that ended the Zheng kingdom on Taiwan, the Kingdom of Tungning, the last state to keep the Ming calendar. After the Three Feudatories were defeated, the Kangxi emperor gave command of the Fujian fleet to Shi Lang, a former officer of Zheng Chenggong (Koxinga) who had gone over to the Qing. In July 1683 Shi sailed from Tongshan with about 240 ships and 21,000 men and, on 16–17 July, destroyed the Zheng fleet under Liu Guoxuan in the bay of Magong in the Penghu islands; Qing reports counted about 12,000 Zheng dead against a few hundred of their own. The court of the young king Zheng Keshuang, divided since a succession coup in 1681, offered unconditional surrender in September, and Shi Lang took over Taiwan without further fighting in October 1683. Zheng Keshuang was taken to Beijing and given a dukedom. In 1684 the Qing made Taiwan a prefecture of Fujian province, its first rule over the island.: Fälttåget som gjorde slut på släkten Zhengs kungarike på Taiwan, kungariket Tungning, den sista stat som behöll Mingkalendern. Sedan de tre feodalherrarna hade besegrats gav Kangxikejsaren befälet över Fujianflottan till Shi Lang, en före detta officer under Zheng Chenggong (Koxinga) som hade gått över till Qing. I juli 1683 seglade Shi från Tongshan med omkring 240 fartyg och 21 000 man och förintade den 16–17 juli Zhengflottan under Liu Guoxuan i Magongbukten på Penghuöarna; Qingrapporterna räknade omkring 12 000 döda på Zhengs sida mot några hundra egna. Den unge kungen Zheng Keshuangs hov, splittrat sedan en statskupp i tronföljdsfrågan 1681, erbjöd villkorslös kapitulation i september, och Shi Lang tog över Taiwan utan ytterligare strider i oktober 1683. Zheng Keshuang fördes till Peking och fick en hertigtitel. År 1684 gjorde Qing Taiwan till en prefektur i provinsen Fujian, och det var första gången dynastin styrde ön.
