# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
Qing invasion of Đại Việt: Qinginvasionen av Đại Việt
? The Qing intervention to restore the last Lê emperor, Lê Chiêu Thống, who had fled from the Tây Sơn and appealed to the Qianlong Emperor. In November 1788 armies from Guangxi under the governor-general Sun Shiyi and from Yunnan under Wu Dajing crossed the border, and the Tây Sơn garrison of the north fell back to the Tam Điệp pass; on 17 December the Qing entered Thăng Long and installed Lê Chiêu Thống as king. Nguyễn Huệ answered by proclaiming himself Emperor Quang Trung at Phú Xuân on 22 December and marching north, gathering troops on the way. Over the Lunar New Year his army stormed the Qing forts south of the capital, at Hà Hồi, Ngọc Hồi and Đống Đa, and on 30 January 1789 retook Thăng Long. Several Qing generals were killed, and Sun Shiyi and Lê Chiêu Thống fled to China. Quang Trung then sought peace, and the Qianlong Emperor recognised him as king of Annam later in 1789. Vietnam remembers the battle as one of its greatest victories; in China the campaign was counted among Qianlong’s Ten Great Campaigns.
: Qingdynastins ingripande för att återinsätta den siste Lêkejsaren, Lê Chiêu Thống, som hade flytt undan Tây Sơn och vädjat till Qianlongkejsaren om hjälp. I november 1788 gick arméer från Guangxi under generalguvernören Sun Shiyi och från Yunnan under Wu Dajing över gränsen, och Tây Sơns garnison i norr drog sig tillbaka till passet Tam Điệp; den 17 december tågade Qingtrupperna in i Thăng Long och insatte Lê Chiêu Thống som kung. Nguyễn Huệ svarade med att utropa sig till kejsar Quang Trung i Phú Xuân den 22 december och marschera norrut, och han samlade trupper längs vägen. Under månnyåret stormade hans armé Qingfästena söder om huvudstaden, vid Hà Hồi, Ngọc Hồi och Đống Đa, och den 30 januari 1789 återtog han Thăng Long. Flera Qinggeneraler dödades, och Sun Shiyi och Lê Chiêu Thống flydde till Kina. Quang Trung sökte därefter fred, och Qianlongkejsaren erkände honom som kung av Annam senare under 1789. I Vietnam minns man slaget som en av landets största segrar; i Kina räknades fälttåget till Qianlongs tio stora fälttåg.
