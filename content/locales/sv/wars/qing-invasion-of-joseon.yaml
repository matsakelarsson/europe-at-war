Qing invasion of Joseon: Qingdynastins invasion av Joseon
The second Manchu invasion of Korea, called Byeongja Horan in Korean after the year 1636 in the sixty-year cycle. Hong Taiji had proclaimed the Qing dynasty in 1636, and the Joseon court, loyal to the Ming, refused to recognise him as emperor. He set out from Mukden at the end of December 1636 with Manchu, Mongol and Han banner troops, about 120,000 men by Korean accounts, crossed the Yalu at the start of January 1637 and, bypassing the northern fortresses, reached Hanseong within two weeks. Cut off from Ganghwa Island, King Injo shut himself up in the mountain fortress of Namhansanseong with about 13,800 men. Relief armies from the provinces were beaten one by one, and when Ganghwa fell on 16 February with the king’s family, Injo came out and submitted to Hong Taiji at Samjeondo on the Han River on 24 February 1637. Joseon broke with the Ming, became a tributary of the Qing and sent two princes as hostages to Mukden, and large numbers of Koreans were carried off as captives.: Den andra manchuiska invasionen av Korea, på koreanska kallad Byeongja Horan efter året 1636 i sextioårscykeln. Hong Taiji hade utropat Qingdynastin 1636, och Joseonhovet, som var lojalt mot Mingriket, vägrade att erkänna honom som kejsare. Han bröt upp från Mukden i slutet av december 1636 med manchuiska, mongoliska och hankinesiska fanetrupper, omkring 120 000 man enligt koreanska uppgifter, gick över Yalu i början av januari 1637 och nådde Hanseong inom två veckor genom att gå förbi de nordliga fästningarna. Avskuren från ön Ganghwa stängde kung Injo in sig i bergsfästningen Namhansanseong med omkring 13 800 man. Undsättningsarméer från provinserna slogs en efter en, och när Ganghwa föll den 16 februari med kungens familj kom Injo ut och underkastade sig Hong Taiji vid Samjeondo vid Hanfloden den 24 februari 1637. Joseon bröt med Mingriket, blev tributstat under Qing och sände två prinsar som gisslan till Mukden, och ett stort antal koreaner fördes bort som fångar.
