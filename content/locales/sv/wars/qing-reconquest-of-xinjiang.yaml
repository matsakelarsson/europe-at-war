Qing reconquest of Xinjiang: Qingdynastins återerövring av Xinjiang
The campaign in which the Qing general Zuo Zongtang destroyed Yakub Beg’s state of Yettishar (Kashgaria) and restored Qing rule in Xinjiang, the last phase of the Dungan Revolt. After the court decided in 1875, against the advice of Li Hongzhang, to spend the money on the north-west rather than on coastal defence, Zuo’s armies, financed by foreign loans and armed with modern rifles and Krupp guns, took Ürümqi and Manas in 1876. In April 1877 they took Dabancheng, Turfan and Toksun, and in May Yakub Beg died at Korla. His state broke up in a struggle among his sons, and between October 1877 and January 1878 Liu Jintang’s troops advanced through Karashahr, Kucha and Aksu to Kashgar, Yarkand and Khotan. The Ili valley, occupied by Russia since 1871, was recovered by treaty in 1881, and Xinjiang became a province of the Qing empire in 1884.: Det fälttåg där Qinggeneralen Zuo Zongtang förintade Yakub Begs stat Yettishar (Kashgarien) och återupprättade Qingstyret i Xinjiang, Dunganupprorets sista fas. Sedan hovet 1875, mot Li Hongzhangs råd, hade beslutat att lägga pengarna på nordväst snarare än på kustförsvaret, intog Zuos arméer, finansierade med utländska lån och beväpnade med moderna gevär och Kruppkanoner, Ürümqi och Manas 1876. I april 1877 intog de Dabancheng, Turfan och Toksun, och i maj dog Yakub Beg i Korla. Hans stat föll sönder i en kamp mellan hans söner, och mellan oktober 1877 och januari 1878 ryckte Liu Jintangs trupper fram genom Karashahr, Kucha och Aksu till Kashgar, Yarkand och Khotan. Ilidalen, som Ryssland hade ockuperat sedan 1871, återvanns genom fördrag 1881, och Xinjiang blev en provins i Qingriket 1884.
