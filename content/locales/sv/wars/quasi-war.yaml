# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
Quasi-War: Kvasikriget
? An undeclared naval war between the United States and the French Republic, fought mostly in the Caribbean. France, at war with Britain, saw the Jay Treaty of 1795 between the United States and Britain as a betrayal of the alliance of 1778, and French warships and privateers, many of them based on Guadeloupe and in Saint-Domingue, seized hundreds of American merchant ships. When the French foreign minister Talleyrand’s agents demanded a bribe before they would even talk with American envoys, the “XYZ affair”, Congress in 1798 created a Navy Department, cancelled the treaties with France and authorised the navy and privateers to capture armed French ships. The small new navy, working alongside the Royal Navy, captured or sank many French privateers, captured the frigate L’Insurgente in 1799 and badly damaged La Vengeance in 1800, and the United States supported Toussaint Louverture in Saint-Domingue. President John Adams, against much of his own Federalist party, sent new envoys to Paris, and Napoleon’s government agreed to the Convention of 1800 at Mortefontaine on 30 September 1800, which ended the war and the old alliance.
: Ett oförklarat sjökrig mellan USA och Franska republiken, som till största delen utkämpades i Karibien. Frankrike, som låg i krig med Storbritannien, såg Jayfördraget 1795 mellan USA och Storbritannien som ett svek mot alliansen från 1778, och franska krigsfartyg och kapare, många av dem med bas på Guadeloupe och i Saint-Domingue, tog hundratals amerikanska handelsfartyg. När den franske utrikesministern Talleyrands agenter krävde en muta innan de ens ville tala med amerikanska sändebud, ”XYZ-affären”, inrättade kongressen 1798 ett marindepartement, sade upp fördragen med Frankrike och bemyndigade flottan och kapare att ta beväpnade franska fartyg. Den lilla nya flottan, som samverkade med Royal Navy, tog eller sänkte många franska kapare, erövrade fregatten L’Insurgente 1799 och skadade La Vengeance svårt 1800, och USA stödde Toussaint Louverture i Saint-Domingue. President John Adams sände, mot stora delar av sitt eget federalistiska parti, nya sändebud till Paris, och Napoleons regering gick med på konventionen 1800 i Mortefontaine den 30 september 1800, som avslutade kriget och den gamla alliansen.
