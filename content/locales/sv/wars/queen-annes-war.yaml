# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
Queen Anne’s War: Drottning Annas krig
? The North American part of the War of the Spanish Succession, fought between England (Great Britain from 1707) and its colonies on one side and France, Spain and their colonies on the other, each with Native allies who fought for their own reasons. In the south, Governor James Moore of Carolina burned the town of Saint Augustine in 1702 but could not take its stone fort; in 1704 he and some 1,000 Muscogee (Creek) warriors destroyed the Apalachee missions of Spanish Florida and carried thousands of people into slavery, and a French and Spanish attack on Charles Town in 1706 was beaten off. In the north, French officers and Wabanaki, Kahnawake Mohawk and Wendat warriors raided the New England frontier, most famously at Deerfield in 1704, and the French twice ravaged the English settlements of Newfoundland. New England failed twice to take Port Royal in 1707 but captured it in 1710, renaming it Annapolis Royal. A great British expedition against Quebec in 1711 ended when Admiral Walker’s fleet ran onto the reefs of the St. Lawrence, drowning about 890 people. At the Peace of Utrecht in 1713 France ceded Acadia (Nova Scotia), Newfoundland and Hudson Bay to Britain but kept Cape Breton, where it built Louisbourg; the Wabanaki made a separate peace at Portsmouth. The unclear borders of Acadia and the slave trade on the southern frontier led directly to the wars that followed.
: Den nordamerikanska delen av spanska tronföljdskriget, utkämpad mellan England (från 1707 Storbritannien) och dess kolonier på ena sidan och Frankrike, Spanien och deras kolonier på den andra, var och en med ursprungsamerikanska allierade som stred av egna skäl. I söder brände guvernör James Moore av Carolina staden S:t Augustine 1702 men lyckades inte inta dess stenfort; 1704 förstörde han och omkring 1 000 krigare från muscogee (creeker) apalacheemissionerna i Spanska Florida och förde bort tusentals människor i slaveri, och ett franskt och spanskt anfall mot Charles Town 1706 slogs tillbaka. I norr gjorde franska officerare och krigare från wabanaki, mohawkerna i Kahnawake och wendat räder mot New Englands gränsbygder, mest känt mot Deerfield 1704, och fransmännen härjade två gånger de engelska bosättningarna på Newfoundland. New England misslyckades två gånger med att inta Port Royal 1707 men erövrade det 1710 och döpte om det till Annapolis Royal. En stor brittisk expedition mot Québec 1711 slutade med att amiral Walkers flotta gick på reven i Saint Lawrencefloden, varvid omkring 890 människor drunknade. Vid freden i Utrecht 1713 avträdde Frankrike Akadien (Nova Scotia), Newfoundland och Hudson Bay till Storbritannien men behöll Kap Bretonön, där det byggde Louisbourg; wabanaki slöt separatfred i Portsmouth. Akadiens oklara gränser och slavhandeln vid den södra gränsen ledde direkt till de krig som följde.
England (Great Britain from 1707), its colonies and their Native allies (Muscogee, Yamasee and others in the south): England (från 1707 Storbritannien), dess kolonier och deras ursprungsamerikanska allierade (muscogee, yamasee med flera i söder)
