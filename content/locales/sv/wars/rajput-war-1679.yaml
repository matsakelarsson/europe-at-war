Rajput war (1679–1707): Rajputkriget (1679–1707)
The war between Aurangzeb and the Rajput kingdoms of Marwar and Mewar. When Maharaja Jaswant Singh of Marwar died at Jamrud in 1678 without a living heir, Aurangzeb took Jodhpur under direct rule and tried to bring Jaswant’s posthumous son, Ajit Singh, up at his court. The Rathor nobles under Durgadas Rathore smuggled the boy out of Delhi, and Rana Raj Singh of Mewar took up their cause. Mughal armies occupied both kingdoms in 1679–1680, and in 1681 Aurangzeb’s son Prince Akbar went over to the Rajputs and proclaimed himself emperor, but his army melted away and he fled to the Marathas. Mewar made peace in 1681; the Rathors fought on in a guerrilla war for a quarter of a century, until Ajit Singh retook Jodhpur days after Aurangzeb’s death in 1707.: Kriget mellan Aurangzeb och rajputkungarikena Marwar och Mewar. När maharajan Jaswant Singh av Marwar dog i Jamrud 1678 utan levande arvinge ställde Aurangzeb Jodhpur under direkt styre och försökte låta Jaswants postumt födde son, Ajit Singh, växa upp vid sitt hov. Rathoradeln under Durgadas Rathore smugglade ut pojken ur Delhi, och Raj Singh, rana av Mewar, tog sig an deras sak. Mogularméer ockuperade båda kungarikena 1679–1680, och 1681 gick Aurangzebs son prins Akbar över till rajputerna och utropade sig till kejsare, men hans armé smälte bort och han flydde till maratherna. Mewar slöt fred 1681; rathorerna förde ett gerillakrig i ett kvarts sekel, tills Ajit Singh återtog Jodhpur några dagar efter Aurangzebs död 1707.
