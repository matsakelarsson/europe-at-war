Rákóczi’s War of Independence: Rákóczis frihetskrig
A rising of Hungarian nobles, soldiers and peasants, the Kurucs, led by Prince Francis II Rákóczi against Habsburg rule, fought while most imperial troops were away in the War of the Spanish Succession. At its height the rebels held most of Hungary and Transylvania and raided Austria and Moravia, but after their defeat at Trencsén in 1708 the rising collapsed, and the Peace of Szatmár in 1711 brought an amnesty and a promise to respect Hungary’s constitution.: Ett uppror av ungerska adelsmän, soldater och bönder, kuruczerna, under furst Frans II Rákóczi mot det habsburgska styret, utkämpat medan de flesta kejserliga trupperna var borta i spanska tronföljdskriget. På sin höjdpunkt höll rebellerna större delen av Ungern och Transsylvanien och gjorde plundringståg in i Österrike och Mähren, men efter nederlaget vid Trencsén 1708 föll upproret samman, och freden i Szatmár 1711 gav amnesti och ett löfte om att respektera Ungerns författning.
