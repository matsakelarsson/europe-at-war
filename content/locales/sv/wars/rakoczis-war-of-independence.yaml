After Trencsén the imperial armies won back the country fortress by fortress, while plague spread across Hungary from 1708 to 1711 and killed far more people than the fighting. Many nobles made their peace with the emperor. At Romhány on 22 January 1710 Rákóczi’s last field army, with Polish, Swedish and French soldiers among its ranks, came close to beating an imperial force before being driven back. Érsekújvár surrendered that autumn, and the Kurucs were pushed back to the north-east, around Munkács and Szatmár.: Efter Trencsén återvann de kejserliga arméerna landet fästning för fästning, medan pesten spred sig över Ungern 1708–1711 och dödade betydligt fler människor än striderna. Många adelsmän slöt fred med kejsaren. Vid Romhány den 22 januari 1710 var Rákóczis sista fältarmé, med polska, svenska och franska soldater i leden, nära att besegra en kejserlig styrka innan den drevs tillbaka. Érsekújvár kapitulerade samma höst, och kuruczerna trängdes tillbaka till nordöstra Ungern, kring Munkács och Szatmár.
Field Marshal János Pálffy, a loyalist Hungarian, opened talks with the Kuruc commander Sándor Károlyi in late 1710. Rákóczi rejected the terms and left for Poland on 21 February 1711 to seek help from Peter the Great, forbidding further talks, but Károlyi went on. Joseph I died in April, and his brother Charles VI wanted peace. Under the Peace of Szatmár, agreed on 29 April and signed on 1 May 1711, the Kurucs who swore loyalty received an amnesty and their estates, and the crown promised to respect the laws, diet and religious freedoms of Hungary and Transylvania. About 12,000 Kurucs laid down their flags at Majtény. Rákóczi refused the amnesty and died in exile at Rodosto on the Sea of Marmara in 1735.: Fältmarskalk János Pálffy, en lojal ungrare, inledde förhandlingar med kuruczbefälhavaren Sándor Károlyi i slutet av 1710. Rákóczi förkastade villkoren och reste till Polen den 21 februari 1711 för att söka hjälp hos Peter den store och förbjöd fortsatta förhandlingar, men Károlyi fortsatte. Josef I dog i april, och hans bror Karl VI ville ha fred. Enligt freden i Szatmár, som överenskoms den 29 april och undertecknades den 1 maj 1711, fick de kuruczer som svor trohet amnesti och behöll sina gods, och kronan lovade att respektera Ungerns och Transsylvaniens lagar, lantdag och religionsfrihet. Omkring 12 000 kuruczer lade ned sina fanor vid Majtény. Rákóczi avböjde amnestin och dog i landsflykt i Rodosto vid Marmarasjön 1735.
