In September 1705 a diet near Szécsény formed the Confederated Estates of Hungary and elected Rákóczi their ruling prince, with a senate to share the conduct of the war and of peace talks. Emperor Joseph I, who had succeeded Leopold I in May, opened negotiations through English and Dutch mediators, but neither side would give up Transylvania. In November an imperial army under Ludwig Herbeville, with Danish auxiliaries and Serbian light cavalry, forced its way into Transylvania and beat Rákóczi at Zsibó, while in December János Bottyán’s Kurucs won at Szentgotthárd. Rákóczi paid his troops in copper coins that quickly lost their value.: I september 1705 bildade en lantdag nära Szécsény Ungerns konfedererade ständer och valde Rákóczi till deras regerande furste, med en senat som skulle dela ansvaret för krigföringen och fredsförhandlingarna. Kejsar Josef I, som hade efterträtt Leopold I i maj, inledde förhandlingar genom engelska och nederländska medlare, men ingen av sidorna ville avstå från Transsylvanien. I november trängde en kejserlig armé under Ludwig Herbeville, med danska hjälptrupper och serbiskt lätt kavalleri, in i Transsylvanien och slog Rákóczi vid Zsibó, medan János Bottyáns kuruczer segrade vid Szentgotthárd i december. Rákóczi betalade sina trupper med kopparmynt som snabbt förlorade sitt värde.
Believing that only a clean break would win him foreign allies, Rákóczi had the diet at Ónod declare the House of Habsburg deposed from the Hungarian throne on 13 June 1707; two county delegates who argued for peace were cut down in the hall. Louis XIV still refused a treaty, and talks with Peter the Great of Russia came to nothing. In August 1708, marching north to reach Silesia, Rákóczi attacked Heister at Trencsén. His horse stumbled at a ditch and threw him unconscious, and his army, thinking him dead, broke and fled, losing about 3,000 killed and wounded and all its guns.: I tron att bara ett definitivt brott skulle ge honom utländska bundsförvanter lät Rákóczi lantdagen i Ónod förklara huset Habsburg avsatt från den ungerska tronen den 13 juni 1707; två komitatsdelegater som talade för fred höggs ned i salen. Ludvig XIV vägrade ändå att sluta något fördrag, och förhandlingarna med Peter den store av Ryssland ledde ingenstans. I augusti 1708, på marsch norrut för att nå Schlesien, anföll Rákóczi Heister vid Trencsén. Hans häst snavade vid ett dike och kastade av honom medvetslös, och hans armé, som trodde att han var död, bröts och flydde och förlorade omkring 3 000 döda och sårade och alla sina kanoner.
