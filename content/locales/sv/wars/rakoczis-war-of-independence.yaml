The rebels were called kuruc, a name first used for crusading peasants in 1514; Hungarians loyal to the Habsburgs were called labanc. Serbs of the southern border, Croats, the Transylvanian Saxons and Danish auxiliaries fought on the imperial side, while Slovaks, Rusyns, many Romanians, Polish volunteers and French officers served with the Kurucs.: Rebellerna kallades kuruczer (ungerska kuruc), ett namn som först användes om korstågsbönderna 1514; habsburgstrogna ungrare kallades labanc. Serber från södra gränsen, kroater, transsylvaniska saxare och danska hjälptrupper stred på den kejserliga sidan, medan slovaker, rusiner, många rumäner, polska frivilliga och franska officerare tjänade hos kuruczerna.
Places are given their Hungarian names, as in most accounts; Trencsén is Trenčín and Nagyszombat Trnava in Slovakia, Munkács is Mukachevo in Ukraine, and Szatmár is Satu Mare, Zsibó Jibou and Gyulafehérvár Alba Iulia in Romania.: Orterna anges med sina ungerska namn, som i de flesta framställningar; Trencsén är Trenčín och Nagyszombat Trnava i Slovakien, Munkács är Mukatjeve i Ukraina, och Szatmár är Satu Mare, Zsibó Jibou och Gyulafehérvár Alba Iulia i Rumänien.
