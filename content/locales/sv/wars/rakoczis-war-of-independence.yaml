After the Ottomans were driven out of Hungary, Habsburg rule weighed heavily on the country. Taxes were raised, soldiers were quartered on the villages, Protestants were pressed to convert, and reconquered estates were returned only to owners who could prove their title and pay a tenth of their value. Francis II Rákóczi, the richest landowner in Hungary and grandson of princes of Transylvania, was arrested in 1700 for contacts with France, escaped from prison at Wiener Neustadt and fled to Poland. When the War of the Spanish Succession drew most imperial troops west, peasants and former soldiers of the north-east, led by Tamás Esze, rose in the spring of 1703 and asked Rákóczi to lead them.: Sedan osmanerna drivits ut ur Ungern tyngde det habsburgska styret landet hårt. Skatterna höjdes, soldater inkvarterades i byarna, protestanter pressades att konvertera, och återerövrade gods lämnades bara tillbaka till ägare som kunde styrka sin rätt och betala en tiondel av värdet. Frans II Rákóczi, Ungerns rikaste godsägare och sonson till furstar av Transsylvanien, arresterades 1700 för kontakter med Frankrike, rymde från fängelset i Wiener Neustadt och flydde till Polen. När spanska tronföljdskriget drog de flesta kejserliga trupperna västerut reste sig bönder och före detta soldater i nordöstra Ungern under Tamás Esze våren 1703 och bad Rákóczi leda dem.
On 15 June 1703 Rákóczi met Esze’s men at Lavochne, on the Polish side of the Carpathians, and led them into Hungary by the Verecke Pass; his friend Count Miklós Bercsényi brought French money and Polish mercenaries. Most nobles at first held back from what looked like a peasant revolt, but by late September the Kurucs held most of Hungary east and north of the Danube. In 1704 they crossed into Transdanubia and raided Lower Austria, Styria and Moravia, and Vienna threw up an earthwork, the Linienwall, against them. The Transylvanian diet elected Rákóczi prince on 8 July 1704. The allied victory at Blenheim in August ended hopes of joining the French and Bavarians, and on 26 December General Sigbert Heister beat the Kurucs at Nagyszombat.: Den 15 juni 1703 mötte Rákóczi Eszes män i Lavotjne, på den polska sidan av Karpaterna, och ledde dem in i Ungern genom Vereckepasset; hans vän greve Miklós Bercsényi förde med sig franska pengar och polska legosoldater. De flesta adelsmän höll sig först borta från vad som såg ut som ett bondeuppror, men i slutet av september höll kuruczerna större delen av Ungern öster och norr om Donau. År 1704 gick de över till Transdanubien och gjorde plundringståg in i Niederösterreich, Steiermark och Mähren, och Wien lät uppföra en jordvall, Linienwall, mot dem. Den transsylvaniska lantdagen valde Rákóczi till furste den 8 juli 1704. De allierades seger vid Blenheim i augusti krossade förhoppningarna om att förena sig med fransmännen och bayrarna, och den 26 december slog general Sigbert Heister kuruczerna vid Nagyszombat.
