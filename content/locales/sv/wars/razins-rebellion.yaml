Dates are Old Style (Julian), as used in Russia, which ran ten days behind the Gregorian calendar.: Datumen anges enligt gamla stilen (den julianska kalendern), som användes i Ryssland och låg tio dagar efter den gregorianska kalendern.
Tsaritsyn is today’s Volgograd and Simbirsk is Ulyanovsk.: Tsaritsyn är dagens Volgograd och Simbirsk är Uljanovsk.
Stepan Razin, known as Stenka, was a Don Cossack who in 1667 led a band of Cossacks and runaway peasants down the Volga on a raiding expedition. They seized Yaitsk on the Yaik (today’s Oral in Kazakhstan), plundered the Persian shores of the Caspian Sea and in 1669 destroyed a Persian fleet sent against them. Razin came back rich to Astrakhan, where the tsar’s governors pardoned him. His fame spread among the poor of the south, many of them peasants who had fled the taxes, conscription and tightened serfdom of the years after the Law Code of 1649.: Stepan Razin, kallad Stenka, var en donkosack som 1667 ledde en skara kosacker och förrymda bönder nedför Volga på ett plundringståg. De intog Jaitsk vid Jaik (dagens Oral i Kazakstan), plundrade de persiska kusterna av Kaspiska havet och förintade 1669 en persisk flotta som sänts mot dem. Razin återvände rik till Astrachan, där tsarens vojvoder benådade honom. Hans rykte spred sig bland de fattiga i söder, av vilka många var bönder som hade flytt från skatterna, utskrivningarna och det skärpta livegenskapet under åren efter lagboken 1649.
In the spring of 1670 he turned against the government. He declared war on the boyars and officials, though not on the tsar, took Tsaritsyn and sailed down the Volga with about 7,000 men. At Cherny Yar in June the streltsy (musketeers) rose against their officers and joined him. On 24 June the rebels broke into Astrakhan, again helped by a rising inside the city. The governor, Prince Ivan Prozorovsky, and many nobles and officials were killed, the bazaars were looted, and Razin set up a Cossack government under a general assembly, which proclaimed him its sovereign.: Våren 1670 vände han sig mot regeringen. Han förklarade krig mot bojarerna och ämbetsmännen, men inte mot tsaren, intog Tsaritsyn och seglade nedför Volga med omkring 7 000 man. Vid Tjornyj Jar i juni reste sig strelitserna (musketerare) mot sina officerare och anslöt sig till honom. Den 24 juni bröt sig rebellerna in i Astrachan, även denna gång hjälpta av ett uppror inne i staden. Vojvoden, furst Ivan Prozorovskij, och många adelsmän och ämbetsmän dödades, basarerna plundrades, och Razin inrättade ett kosackstyre under en allmän församling, som utropade honom till sin härskare.
