Razin’s Rebellion: Razinupproret
A rising of Cossacks, runaway peasants, townspeople and the non-Russian peoples of the Volga led by the Don Cossack Stepan (Stenka) Razin, who took Astrakhan, Saratov and Samara in 1670 and called on the people to kill the boyars and officials. Beaten at Simbirsk in October 1670, Razin was handed over by the Don Cossack elders and executed in Moscow in June 1671, and the rising was put down with mass executions.: Ett uppror av kosacker, förrymda bönder, stadsbor och de icke-ryska folken vid Volga, lett av donkosacken Stepan (Stenka) Razin, som 1670 intog Astrachan, Saratov och Samara och uppmanade folket att döda bojarerna och ämbetsmännen. Efter nederlaget vid Simbirsk i oktober 1670 utlämnades Razin av donkosackernas äldste och avrättades i Moskva i juni 1671, och upproret slogs ned med massavrättningar.
