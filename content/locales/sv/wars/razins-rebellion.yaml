Astrakhan: Astrachan
Russia’s great trading port on the Caspian fell after a rising inside the walls. Its governor and many nobles and officials were killed.: Rysslands stora handelshamn vid Kaspiska havet föll efter ett uppror innanför murarna. Dess vojvod och många adelsmän och ämbetsmän dödades.
Razin: Razin
In late July Razin left Astrakhan and sailed up the Volga with some 200 boats. Saratov and Samara opened their gates, and his agents spread letters calling on the people to kill the boyars, nobles and officials. Peasants rose across the middle Volga, joined by Chuvash, Mari, Mordvins and Tatars, and the rising spread west towards Tambov, Penza and Nizhny Novgorod. In September Razin laid siege to Simbirsk, but its governor, Ivan Miloslavsky, held the citadel. On 1 and 4 October a relief army under Prince Yury Baryatinsky beat the rebels on the Sviyaga, and Razin, wounded, fled down the Volga to the Don.: I slutet av juli lämnade Razin Astrachan och seglade uppför Volga med omkring 200 båtar. Saratov och Samara öppnade sina portar, och hans agenter spred brev som uppmanade folket att döda bojarerna, adelsmännen och ämbetsmännen. Bönder reste sig längs mellersta Volga, med anslutning av tjuvasjer, marier, mordviner och tatarer, och upproret spred sig västerut mot Tambov, Penza och Nizjnij Novgorod. I september belägrade Razin Simbirsk, men dess vojvod, Ivan Miloslavskij, höll citadellet. Den 1 och 4 oktober besegrade en undsättningsarmé under furst Jurij Barjatinskij rebellerna vid Svijaga, och Razin flydde sårad nedför Volga till Don.
His followers fought on into 1671, and the government’s revenge was savage. From Arzamas, Prince Yury Dolgorukov’s troops burned rebel villages and hanged, quartered or impaled thousands of people. Razin’s prestige was broken, the Church anathematised him, and in April 1671 the Don Cossack elders, led by his godfather Kornila Yakovlev, captured him at Kagalnik and handed him over. He was quartered on Red Square in Moscow on 6 June 1671. Astrakhan held out under his lieutenants until November.: Hans anhängare fortsatte striden in i 1671, och regeringens hämnd var grym. Från Arzamas brände furst Jurij Dolgorukovs trupper rebellbyar och hängde, fyrdelade eller spetsade tusentals människor. Razins anseende var brutet, kyrkan bannlyste honom, och i april 1671 tillfångatog donkosackernas äldste, ledda av hans gudfar Kornila Jakovlev, honom i Kagalnik och lämnade ut honom. Han fyrdelades på Röda torget i Moskva den 6 juni 1671. Astrachan höll ut under hans underbefälhavare till november.
