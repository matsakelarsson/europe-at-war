Spanish troops retook the town, opening the way up the coast to Barcelona.: Spanska trupper återtog staden, vilket öppnade vägen upp längs kusten till Barcelona.
Starved by a fifteen-month siege and struck by plague, the city surrendered to Don Juan José. The French garrison under La Mothe-Houdancourt was allowed to leave.: Utsvulten av en femton månader lång belägring och drabbad av pest kapitulerade staden för don Juan José. Den franska garnisonen under La Mothe-Houdancourt fick lämna staden.
A French army besieged the city and withdrew when a Spanish relief army approached.: En fransk armé belägrade staden och drog sig tillbaka när en spansk undsättningsarmé närmade sig.
Llívia: Llívia
Llívia was a town, not one of the villages handed over, and remained a Spanish enclave inside France.: Llívia var en stad, inte en av de byar som överlämnades, och förblev en spansk enklav inne i Frankrike.
Signed by Cardinal Mazarin and Luis de Haro on an island in the border river, it also arranged the marriage of Louis XIV and the Infanta Maria Theresa.: Freden, som undertecknades av kardinal Mazarin och Luis de Haro på en ö i gränsfloden, ordnade också giftermålet mellan Ludvig XIV och infantinnan Maria Teresia.
