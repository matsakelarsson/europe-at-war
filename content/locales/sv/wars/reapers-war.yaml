From 1648 the Fronde, a series of revolts against the regency government, kept France from sending help, while famine and plague killed many in Catalonia from 1650. The Spanish retook Tortosa late that year, and in the summer of 1651 Don Juan José of Austria, Philip IV’s illegitimate son, laid siege to Barcelona by land and sea. After fifteen months the city surrendered on 11 October 1652. Philip pardoned most of the rebels and confirmed Catalonia’s laws, but kept a garrison in Barcelona and control over who could hold office. The French held on in the north and attacked Girona in 1653 without success.: Från 1648 hindrade Fronden, en serie revolter mot förmyndarregeringen, Frankrike från att sända hjälp, medan hungersnöd och pest dödade många i Katalonien från 1650. Spanjorerna återtog Tortosa i slutet av det året, och sommaren 1651 belägrade don Juan José av Österrike, Filip IV:s utomäktenskaplige son, Barcelona till lands och till sjöss. Efter femton månader kapitulerade staden den 11 oktober 1652. Filip benådade de flesta av rebellerna och bekräftade Kataloniens lagar, men behöll en garnison i Barcelona och kontrollen över vem som fick inneha ämbeten. Fransmännen höll sig kvar i norr och anföll Girona 1653 utan framgång.
Fighting along the Pyrenees went on until the Franco-Spanish War ended. By the Treaty of the Pyrenees, signed on Pheasant Island in the Bidassoa on 7 November 1659, Spain ceded Roussillon and the northern part of Cerdanya to France, and the border was drawn along the crest of the mountains. The town of Llívia, which was not counted among the villages ceded, stayed Spanish as an enclave. In the ceded lands French institutions replaced the Catalan ones, and in 1700 Louis XIV made French compulsory in official documents.: Striderna längs Pyrenéerna fortsatte tills det fransk-spanska kriget tog slut. Genom pyreneiska freden, undertecknad på Fasanön i Bidassoa den 7 november 1659, avträdde Spanien Roussillon och norra delen av Cerdanya till Frankrike, och gränsen drogs längs bergskammen. Staden Llívia, som inte räknades till de avträdda byarna, förblev spansk som enklav. I de avträdda områdena ersatte franska institutioner de katalanska, och år 1700 gjorde Ludvig XIV franska obligatoriskt i officiella handlingar.
