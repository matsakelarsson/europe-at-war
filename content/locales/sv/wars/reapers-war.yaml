Catalan militia and French cavalry held the castle hill and counter-attacked from the city. Among the Spanish dead was John O’Neill, the exiled Earl of Tyrone.: Katalansk milis och franskt kavalleri höll borgkullen och gick till motanfall från staden. Bland de spanska döda fanns John O’Neill, den landsflyktige earlen av Tyrone.
Under the Catalan government, January 1641: Under den katalanska regeringen, januari 1641
Claris died in February 1641, and by a treaty agreed at Péronne in September Catalonia accepted Louis XIII as its sovereign, keeping its own laws. In 1642 a French army besieged Perpignan, with Louis XIII and Cardinal Richelieu present for part of the time; the starving town surrendered on 9 September, leaving all Roussillon in French hands. On 7 October a Franco-Catalan army under Philippe de La Mothe-Houdancourt beat a larger Spanish army at Lleida. But French viceroys and troops soon made themselves as unpopular as the Castilians had been.: Claris dog i februari 1641, och genom ett fördrag som överenskoms i Péronne i september godtog Katalonien Ludvig XIII som sin härskare och behöll sina egna lagar. År 1642 belägrade en fransk armé Perpignan, under en del av tiden i närvaro av Ludvig XIII och kardinal Richelieu; den utsvultna staden kapitulerade den 9 september, och hela Roussillon kom därmed i franska händer. Den 7 oktober besegrade en fransk-katalansk armé under Philippe de La Mothe-Houdancourt en större spansk armé vid Lleida. Men franska vicekungar och trupper gjorde sig snart lika impopulära som kastilianerna hade varit.
After Olivares fell in 1643, Philip IV came to Aragon himself. His army retook Lleida on 30 July 1644, and he swore to respect Catalonia’s laws, which won back many Catalans. A French attack on Tarragona failed that year, and so did French sieges of Lleida in 1646 and 1647, the second led by the young Prince of Condé. The French took Roses on the coast in 1645 and Tortosa, near the mouth of the Ebro, in 1648. By then the front had settled across the middle of Catalonia, and both sides were exhausted.: Sedan Olivares fallit 1643 kom Filip IV själv till Aragonien. Hans armé återtog Lleida den 30 juli 1644, och han svor att respektera Kataloniens lagar, vilket vann tillbaka många katalaner. Ett franskt anfall mot Tarragona misslyckades samma år, liksom franska belägringar av Lleida 1646 och 1647, den andra ledd av den unge prinsen av Condé. Fransmännen intog Roses vid kusten 1645 och Tortosa, nära Ebros mynning, 1648. Då hade fronten stabiliserats tvärs över mellersta Katalonien, och båda sidor var utmattade.
