Reapers’ War: Skördemännens krig
The revolt of Catalonia against the government of Philip IV and his minister Olivares, set off by the billeting of royal troops during the war with France. The Catalans placed themselves under the French king in 1641 and were ruled by France for over a decade, until Spanish troops retook Barcelona in 1652; at the Peace of the Pyrenees in 1659 Spain ceded Roussillon and northern Cerdanya to France.: Kataloniens uppror mot Filip IV:s och hans minister Olivares regering, utlöst av inkvarteringen av kungliga trupper under kriget mot Frankrike. Katalanerna ställde sig 1641 under den franske kungen och styrdes av Frankrike i över ett decennium, tills spanska trupper återtog Barcelona 1652; vid pyreneiska freden 1659 avträdde Spanien Roussillon och norra Cerdanya till Frankrike.
