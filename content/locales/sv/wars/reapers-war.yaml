Dates are Gregorian. The revolt is named after the reapers, segadors, who sparked the riot of June 1640; the song Els Segadors is now the anthem of Catalonia.: Datumen anges enligt den gregorianska kalendern. Upproret har fått sitt namn efter skördemännen, segadors, som utlöste upploppet i juni 1640; sången Els Segadors är i dag Kataloniens nationalsång.
The revolt was part of the wider Franco-Spanish War of 1635–1659, which has its own entry. This entry follows events in Catalonia and Roussillon.: Upproret var en del av det större fransk-spanska kriget 1635–1659, som har en egen artikel. Denna artikel följer händelserna i Katalonien och Roussillon.
On the base map Catalonia stays under Spain throughout; the rule of the rebel government and of France is drawn in areas.: På baskartan förblir Katalonien under Spanien hela tiden; rebellregeringens och Frankrikes styre ritas som områden.
