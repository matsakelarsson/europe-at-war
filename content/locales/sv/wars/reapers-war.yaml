La Mothe-Houdancourt had beaten a Spanish army outside the town in October 1642. The Spanish took it back in 1644 after a two-month siege and held it against French sieges in 1646 and 1647.: La Mothe-Houdancourt hade besegrat en spansk armé utanför staden i oktober 1642. Spanjorerna återtog den 1644 efter en två månader lång belägring och höll den mot franska belägringar 1646 och 1647.
The Spanish garrison held out against a French siege, as it had in 1641.: Den spanska garnisonen stod emot en fransk belägring, liksom 1641.
Roses: Roses
The French took the fortified port on the Costa Brava, which gave their fleets a base on the Catalan coast.: Fransmännen intog den befästa hamnen vid Costa Brava, vilket gav deras flottor en bas vid den katalanska kusten.
