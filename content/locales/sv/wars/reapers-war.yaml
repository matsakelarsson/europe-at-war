Olivares wanted the other kingdoms of the Spanish crown to share the burden of Castile’s wars, and Catalonia, with its own laws and parliament, resisted. After the French took the border fortress of Salses in 1639, royal troops were sent to win it back and then quartered on Catalan villages through the winter, and quarrels over billeting turned into violence. In May 1640 peasants rose against the soldiers. On 7 June, Corpus Christi, reapers who had come to Barcelona for the harvest rioted, and the viceroy, the Count of Santa Coloma, was killed on the shore while trying to escape. Royal judges and officials were hunted down.: Olivares ville att den spanska kronans övriga riken skulle dela bördan av Kastiliens krig, och Katalonien, med egna lagar och ett eget parlament, gjorde motstånd. Sedan fransmännen 1639 intagit gränsfästningen Salses sändes kungliga trupper för att återta den och inkvarterades sedan i katalanska byar under vintern, och grälen om inkvarteringen övergick i våld. I maj 1640 reste sig bönder mot soldaterna. Den 7 juni, på Kristi lekamens dag, gjorde skördemän som kommit till Barcelona för skörden upplopp, och vicekungen, greven av Santa Coloma, dödades på stranden när han försökte fly. Kungliga domare och ämbetsmän jagades.
The Diputació, Catalonia’s standing government, led by its president Pau Claris, raised troops and sought help from France. In December a royal army under the Marquis of Los Vélez marched up the coast from Tortosa. At Cambrils, on 16 December, hundreds of defenders were killed after they had surrendered. On 16 January 1641 Claris proclaimed a Catalan Republic under French protection, and a week later Louis XIII was declared Count of Barcelona. Los Vélez beat the Catalans at Martorell, but on 26 January his assault on the hill of Montjuïc above Barcelona was thrown back, and his army retreated to Tarragona.: Diputació, Kataloniens ständiga regering, under sin ordförande Pau Claris, satte upp trupper och sökte hjälp hos Frankrike. I december marscherade en kunglig armé under markisen av Los Vélez upp längs kusten från Tortosa. I Cambrils dödades den 16 december hundratals försvarare sedan de hade kapitulerat. Den 16 januari 1641 utropade Claris en katalansk republik under franskt beskydd, och en vecka senare utropades Ludvig XIII till greve av Barcelona. Los Vélez besegrade katalanerna vid Martorell, men den 26 januari slogs hans anfall mot kullen Montjuïc ovanför Barcelona tillbaka, och hans armé drog sig tillbaka till Tarragona.
