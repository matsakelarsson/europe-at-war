Rebellions of 1837–1838: Upproren 1837–1838
? Armed risings in the British colonies of Lower Canada (Quebec) and Upper Canada (Ontario) against their appointed governments. In Lower Canada the Parti patriote of Louis-Joseph Papineau, which held a large majority in the elected assembly, had demanded control of the colony’s revenues and an elected upper house in its Ninety-two Resolutions of 1834; when the British Parliament rejected them in the Russell Resolutions of March 1837, protest meetings turned into armed resistance. The Patriotes won at Saint-Denis on 23 November 1837 but were crushed at Saint-Charles and Saint-Eustache. In Upper Canada William Lyon Mackenzie led a smaller rising against the oligarchy known as the Family Compact, which was dispersed at Montgomery’s Tavern north of Toronto on 7 December. Exiled rebels and American sympathisers organised in the Hunters’ Lodges then raided the Canadas from the United States through 1838, and a second Patriote rising in November 1838 was defeated within a week. Twelve Patriotes were hanged in Montreal; in Upper Canada two leaders of the 1837 rising and a number of the raiders of 1838 were hanged; and some 150 prisoners were transported to Australia. Lord Durham’s report of 1839 led to the union of the two colonies as the Province of Canada in 1841, and in 1848 to responsible government.
: Väpnade resningar i de brittiska kolonierna Nedre Kanada (Québec) och Övre Kanada (Ontario) mot deras utnämnda regeringar. I Nedre Kanada hade Louis-Joseph Papineaus Parti patriote, som hade en stor majoritet i den valda församlingen, i sina nittiotvå resolutioner 1834 krävt kontroll över koloniens inkomster och en vald överkammare; när brittiska parlamentet förkastade kraven genom Russells resolutioner i mars 1837 övergick protestmötena i väpnat motstånd. Patrioterna segrade vid Saint-Denis den 23 november 1837 men krossades vid Saint-Charles och Saint-Eustache. I Övre Kanada ledde William Lyon Mackenzie ett mindre uppror mot den oligarki som kallades Family Compact, och det skingrades vid Montgomery’s Tavern norr om Toronto den 7 december. Landsflyktiga rebeller och amerikanska sympatisörer, organiserade i Hunters’ Lodges, gjorde sedan under hela 1838 räder in i de båda Kanada från USA, och ett andra patriotuppror i november 1838 slogs ned inom en vecka. Tolv patrioter hängdes i Montréal; i Övre Kanada hängdes två ledare för upproret 1837 och ett antal av 1838 års angripare; och omkring 150 fångar deporterades till Australien. Lord Durhams rapport 1839 ledde till att de båda kolonierna förenades till provinsen Kanada 1841, och 1848 till att kolonin fick en regering som var ansvarig inför den valda församlingen.
