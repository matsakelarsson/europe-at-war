By the 1140s Almoravid rule was collapsing. In Morocco the Almohads, a rival reform movement from the Atlas mountains, were taking the cities one by one, and in al-Andalus local leaders rebelled and set up new taifas. The Christian rulers moved fast. Afonso Henriques, count of Portugal, had won a battle at Ourique in 1139 and called himself king, a title Castile accepted in 1143, and on 15 March 1147 his men took Santarém by a night assault.: På 1140-talet höll det almoravidiska styret på att falla samman. I Marocko intog almohaderna, en rivaliserande reformrörelse från Atlasbergen, städerna en efter en, och i al-Andalus gjorde lokala ledare uppror och upprättade nya taifor. De kristna härskarna handlade snabbt. Afonso Henriques, greve av Portugal, hade vunnit ett slag vid Ourique 1139 och kallade sig kung, en titel som Kastilien godtog 1143, och den 15 mars 1147 intog hans män Santarém genom ett nattligt anfall.
That summer a fleet of crusaders bound for the Holy Land, from England, Flanders and the Rhineland, put in at Porto and agreed to help him take Lisbon. After a siege of four months the city surrendered on 24 October, and the crusaders plundered it and killed many people, among them its Mozarab bishop. A week earlier Alfonso VII of León–Castile, with Genoese, Catalan and Navarrese help, had taken Almería, and Count Ramon Berenguer IV of Barcelona, ruler of Aragon by his betrothal to its heiress, went on to take Tortosa in December 1148 and Lleida in October 1149.: Samma sommar lade en flotta av korsfarare på väg till Heliga landet, från England, Flandern och Rhenlandet, till i Porto och gick med på att hjälpa honom att inta Lissabon. Efter en fyra månader lång belägring kapitulerade staden den 24 oktober, och korsfararna plundrade den och dödade många människor, bland dem dess mozarabiske biskop. En vecka tidigare hade Alfonso VII av León–Kastilien, med genuesisk, katalansk och navarresisk hjälp, intagit Almería, och greve Ramon Berenguer IV av Barcelona, Aragoniens härskare genom sin trolovning med dess arvtagerska, intog därefter Tortosa i december 1148 och Lleida i oktober 1149.
