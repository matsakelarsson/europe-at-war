The last great struggle was for the Strait of Gibraltar. Granada’s emirs, squeezed by Castile, called on the Marinids, who had replaced the Almohads in Morocco, and from 1275 Marinid armies crossed to Algeciras and Tarifa to raid Andalusia. Castile fought for the ports. Sancho IV took Tarifa in 1292, and in 1294 its commander, Alonso Pérez de Guzmán, held it against a Marinid siege, refusing, by a famous tradition, to surrender it even to save his captive son. Ferdinand IV took Gibraltar in 1309, but the Marinids won it back in 1333.: Den sista stora kampen gällde Gibraltarsundet. Granadas emirer, hårt pressade av Kastilien, kallade på mariniderna, som hade efterträtt almohaderna i Marocko, och från 1275 gick marinidiska härar över till Algeciras och Tarifa för att plundra i Andalusien. Kastilien kämpade om hamnarna. Sancho IV intog Tarifa 1292, och 1294 höll dess befälhavare, Alonso Pérez de Guzmán, staden mot en marinidisk belägring och vägrade enligt en berömd tradition att överlämna den, ens för att rädda sin tillfångatagne son. Ferdinand IV intog Gibraltar 1309, men mariniderna återtog det 1333.
In 1340 the Marinid sultan Abu al-Hasan destroyed the Castilian fleet off Algeciras, crossed with a large army and, with Yusuf I of Granada, besieged Tarifa. Alfonso XI of Castile and Afonso IV of Portugal marched to its relief, and on 30 October they routed the two Muslim rulers on the Río Salado. It was the last great invasion from North Africa. Alfonso then besieged Algeciras from 1342; crusaders from many lands joined him, the defenders used early gunpowder weapons, and the city surrendered in March 1344. In March 1350 Alfonso died of the Black Death while besieging Gibraltar.: År 1340 förintade den marinidiske sultanen Abu al-Hasan den kastilianska flottan utanför Algeciras, gick över med en stor här och belägrade tillsammans med Yusuf I av Granada Tarifa. Alfonso XI av Kastilien och Afonso IV av Portugal marscherade till undsättning, och den 30 oktober slog de de båda muslimska härskarna på flykten vid Río Salado. Det var den sista stora invasionen från Nordafrika. Alfonso belägrade sedan Algeciras från 1342; korsfarare från många länder anslöt sig till honom, försvararna använde tidiga krutvapen, och staden kapitulerade i mars 1344. I mars 1350 dog Alfonso i digerdöden under belägringen av Gibraltar.
