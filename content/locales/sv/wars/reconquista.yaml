Reconquista: Reconquista
The centuries of war in which the Christian kingdoms of the north of the Iberian Peninsula, Asturias–León, Castile, Navarre, Aragon, Catalonia and Portugal, conquered the Muslim lands of al-Andalus. Under the caliphs of Córdoba and the North African Almoravids and Almohads the Muslims long held the upper hand, but after the fall of Toledo in 1085, Lisbon in 1147, the battle of Las Navas de Tolosa in 1212 and the conquests of Córdoba, Valencia and Seville in 1236–1248, only the Nasrid emirate of Granada remained. The struggle for the Strait of Gibraltar followed, and the Granada War of 1482–1492 completed the conquest.: De sekler av krig under vilka de kristna kungarikena i norra delen av Iberiska halvön, Asturien–León, Kastilien, Navarra, Aragonien, Katalonien och Portugal, erövrade de muslimska områdena i al-Andalus. Under kaliferna i Córdoba och de nordafrikanska almoraviderna och almohaderna hade muslimerna länge övertaget, men efter Toledos fall 1085, Lissabons fall 1147, slaget vid Las Navas de Tolosa 1212 och erövringarna av Córdoba, Valencia och Sevilla 1236–1248 återstod bara det nasridiska emiratet Granada. Därefter följde kampen om Gibraltarsundet, och Granadakriget 1482–1492 fullbordade erövringen.
