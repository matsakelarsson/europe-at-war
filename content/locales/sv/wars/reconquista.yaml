Abd al-Rahman III, emir from 912, spent his first years crushing rebels, above all the sons of Umar ibn Hafsun in their mountain fortress of Bobastro, which fell in 928. In January 929 he took the title of caliph, setting himself up against the Abbasids of Baghdad and the Fatimids of North Africa. His summer campaigns beat León and Pamplona at Valdejunquera in 920 and sacked Pamplona in 924, and from 936 he built a palace city, Madinat al-Zahra, outside Córdoba.: Abd al-Rahman III, emir från 912, ägnade sina första år åt att krossa upprorsmän, framför allt Umar ibn Hafsuns söner i deras bergsfästning Bobastro, som föll 928. I januari 929 antog han titeln kalif och ställde sig därmed mot abbasiderna i Bagdad och fatimiderna i Nordafrika. Hans sommarfälttåg besegrade León och Pamplona vid Valdejunquera 920 och plundrade Pamplona 924, och från 936 byggde han en palatsstad, Madinat al-Zahra, utanför Córdoba.
In 939 he led a great expedition against León. Near Simancas, on the Duero, Ramiro II of León, with Count Fernán González of Castile and troops from Pamplona, met him in a battle that began on 19 July, the day of a solar eclipse, and lasted several days. The caliph’s army was beaten and then routed on its retreat at a place the Arab sources call al-Khandaq, “the ditch”. Abd al-Rahman barely escaped and never again campaigned in person. León settled the lands south of the Duero, and Fernán González made Castile a hereditary county that went its own way.: År 939 ledde han en stor expedition mot León. Nära Simancas vid Duero mötte Ramiro II av León, med greve Fernán González av Kastilien och trupper från Pamplona, honom i ett slag som började den 19 juli, dagen för en solförmörkelse, och varade i flera dagar. Kalifens här besegrades och slogs sedan på flykten under återtåget vid en plats som de arabiska källorna kallar al-Khandaq, ”diket”. Abd al-Rahman undkom med nöd och lade aldrig mer ut på fälttåg personligen. León koloniserade områdena söder om Duero, och Fernán González gjorde Kastilien till ett ärftligt grevskap som gick sin egen väg.
