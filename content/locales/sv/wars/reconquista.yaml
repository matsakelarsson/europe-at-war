The name Reconquista, “reconquest”, became usual only in the 19th century. It reflects the claim of the Christian kings to be restoring the Visigothic kingdom that the Muslims had conquered after 711. Historians debate how far the wars were one long religious struggle; Christian and Muslim rulers often allied with each other, and Christians fought Christians and Muslims fought Muslims at least as often as they fought each other.: Namnet reconquista, ”återerövring”, blev vanligt först på 1800-talet. Det speglar de kristna kungarnas anspråk på att återupprätta det västgotiska rike som muslimerna hade erövrat efter 711. Historiker diskuterar i vilken mån krigen var en enda lång religiös kamp; kristna och muslimska härskare slöt ofta förbund med varandra, och kristna stred mot kristna och muslimer mot muslimer minst lika ofta som de stred mot varandra.
This story begins around 800, where the map begins. The traditional starting point is the battle of Covadonga in Asturias, about 718–722. It ends in the 1460s; the Granada War (1482–1492), the fitna of al-Andalus (1009–1031) and the Mudéjar revolt of 1264–1266 have their own entries.: Denna berättelse börjar omkring 800, där kartan börjar. Den traditionella utgångspunkten är slaget vid Covadonga i Asturien omkring 718–722. Den slutar på 1460-talet; Granadakriget (1482–1492), fitnan i al-Andalus (1009–1031) och mudéjarupproret 1264–1266 har egna artiklar.
Christian documents of the time are dated by the Spanish era, 38 years ahead of the year of Christ, and Arabic sources by the Islamic calendar. Dates here are converted to the Julian calendar, as usual. Chronicles on both sides give armies and losses that are far too large.: Samtida kristna handlingar dateras efter den spanska eran, som ligger 38 år före Kristi år, och arabiska källor efter den islamiska kalendern. Datumen här är som vanligt omräknade till den julianska kalendern. Krönikorna på båda sidor anger alldeles för stora härar och förluster.
Arabic names are simplified (Abd al-Rahman, al-Mansur). Places are given their modern names, with the Arabic name where it is often used (Madina Mayurqa for Palma).: Arabiska namn är förenklade (Abd al-Rahman, al-Mansur). Orterna anges med sina moderna namn, med det arabiska namnet där det ofta används (Madina Mayurqa för Palma).
