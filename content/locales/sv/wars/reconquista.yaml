Antequera: Antequera
Ferdinand’s army besieged the town for five months, with siege towers and early cannon, until the garrison surrendered and left for Granada.: Ferdinands här belägrade staden i fem månader, med belägringstorn och tidiga kanoner, tills garnisonen kapitulerade och drog bort till Granada.
Archidona: Archidona
The hilltop town north-east of Antequera fell to the Master of the Order of Calatrava.: Bergsstaden nordost om Antequera föll för stormästaren av Calatravaorden.
1 July 1431: 1 juli 1431
Fought by the Sierra Elvira, in sight of Granada. The battle is painted on the walls of the Hall of Battles in the Escorial.: Utkämpades vid Sierra Elvira, inom synhåll från Granada. Slaget finns avmålat på väggarna i Slagens sal i Escorial.
Much of the garrison was away, and the rest surrendered after a few days of talks. By tradition the town fell on the feast of Saint Bernard, 20 August, and he became its patron saint.: En stor del av garnisonen var borta, och resten kapitulerade efter några dagars förhandlingar. Enligt traditionen föll staden på den helige Bernhards dag, den 20 augusti, och han blev dess skyddshelgon.
