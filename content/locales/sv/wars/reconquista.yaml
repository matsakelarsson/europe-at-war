By 800 the Umayyad emirate of Córdoba ruled most of the Iberian Peninsula, which Muslim armies had conquered from the Visigoths after 711. Two Christian frontiers faced it. In the north-east the Franks pushed south from the Pyrenees, and in 801, after a siege of several months, Louis the Pious, Charlemagne’s son and king of Aquitaine, took Barcelona. It became the seat of a count in the Frankish Spanish March. In the north-west the small kingdom of Asturias, ruled from Oviedo by Alfonso II (791–842), held the mountains between Galicia and the Basque lands.: Omkring 800 styrde umayyadernas emirat Córdoba större delen av Iberiska halvön, som muslimska härar hade erövrat från västgoterna efter 711. Två kristna gränser låg mot det. I nordöst trängde frankerna söderut från Pyrenéerna, och 801 intog Ludvig den fromme, Karl den stores son och kung av Aquitanien, Barcelona efter en flera månader lång belägring. Staden blev säte för en greve i den frankiska Spanska marken. I nordväst höll det lilla kungariket Asturien, som styrdes från Oviedo av Alfonso II (791–842), bergen mellan Galicien och de baskiska områdena.
Early in the 9th century a tomb in Galicia was proclaimed to be that of the apostle James, and Santiago de Compostela grew into a great shrine. While the emirate was distracted by revolts, Asturian kings and counts settled the thinly peopled lands to the south, taking over or refounding towns. León was resettled in 856, Porto taken in 868, Coimbra in 878, Burgos founded in 884 and Zamora resettled in 893. By about 910 the frontier ran along the Duero, and Alfonso III’s sons moved the court south to León, which gave the kingdom its new name.: I början av 800-talet förklarades en grav i Galicien vara aposteln Jakobs, och Santiago de Compostela växte till en stor helgedom. Medan emiratet var upptaget av revolter koloniserade asturiska kungar och grevar de glest befolkade områdena i söder och tog över eller grundade på nytt städer. León återbefolkades 856, Porto intogs 868, Coimbra 878, Burgos grundades 884 och Zamora återbefolkades 893. Omkring 910 gick gränsen längs Duero, och Alfonso III:s söner flyttade hovet söderut till León, som gav riket dess nya namn.
