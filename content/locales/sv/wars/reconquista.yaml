The fall of Toledo alarmed the taifa kings. Al-Mutamid of Seville and others called on Yusuf ibn Tashfin, emir of the Almoravids, a strict Berber religious movement that had conquered Morocco. His army crossed to Algeciras in the summer of 1086, and on 23 October, at Sagrajas (al-Zallaqa) near Badajoz, it routed Alfonso VI, who escaped wounded. Yusuf went home, but he returned in 1088 and, finding the taifa rulers as divided as ever, deposed them one by one from 1090, beginning with Granada and Seville, until al-Andalus was an Almoravid province.: Toledos fall väckte oro bland taifakungarna. Al-Mutamid av Sevilla och andra kallade på Yusuf ibn Tashfin, emir över almoraviderna, en sträng berbisk religiös rörelse som hade erövrat Marocko. Hans här gick över till Algeciras sommaren 1086, och den 23 oktober, vid Sagrajas (al-Zallaqa) nära Badajoz, slog den Alfonso VI på flykten; kungen undkom sårad. Yusuf återvände hem, men han kom tillbaka 1088 och, när han fann taifahärskarna lika splittrade som förut, avsatte han dem en efter en från 1090, med början i Granada och Sevilla, tills al-Andalus var en almoravidisk provins.
In the east one Christian leader held his ground. Rodrigo Díaz de Vivar, El Cid, a Castilian noble twice exiled by Alfonso VI, had served the Muslim rulers of Zaragoza and built up a following of his own. He besieged Valencia from 1092, starved it into surrender in June 1094, beat an Almoravid army at Cuarte that October and ruled the city as an independent lord. After his death in 1099 his widow, Jimena, held it until 1102, when Alfonso VI judged it indefensible, evacuated it and set it on fire. The Almoravids entered on 5 May.: I öster höll en kristen ledare stånd. Rodrigo Díaz de Vivar, El Cid, en kastiliansk adelsman som två gånger förvisats av Alfonso VI, hade tjänat de muslimska härskarna i Zaragoza och byggt upp en egen skara anhängare. Han belägrade Valencia från 1092, svalt ut staden till kapitulation i juni 1094, besegrade en almoravidisk här vid Cuarte i oktober samma år och styrde staden som oberoende herre. Efter hans död 1099 höll hans änka Jimena den till 1102, då Alfonso VI bedömde den som omöjlig att försvara, utrymde den och satte eld på den. Almoraviderna tågade in den 5 maj.
