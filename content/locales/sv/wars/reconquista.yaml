James I of Aragon, who had come to the throne as a child in 1213, turned to the sea. The merchants of Barcelona wanted an end to raids from the Muslim taifa of Mallorca, and in September 1229 a fleet of about 150 ships sailed from Salou, Cambrils and Tarragona. The army landed at Santa Ponsa, won a battle at Portopí and on 31 December stormed Madina Mayurqa, today’s Palma, with great slaughter. Resistance in the mountains lasted until 1232; Menorca submitted as a tributary in 1231, and Ibiza was taken in 1235.: Jakob I av Aragonien, som hade bestigit tronen som barn 1213, vände sig mot havet. Köpmännen i Barcelona ville få slut på räderna från den muslimska taifan Mallorca, och i september 1229 avseglade en flotta på omkring 150 skepp från Salou, Cambrils och Tarragona. Hären landsteg vid Santa Ponsa, vann ett slag vid Portopí och stormade den 31 december Madina Mayurqa, dagens Palma, under stort blodbad. Motståndet i bergen varade till 1232; Menorca underkastade sig som skattskyldigt 1231, och Ibiza intogs 1235.
James then took the Muslim lands of Valencia piece by piece. Morella and Burriana fell in 1232–1233, and in 1237 his garrison on the Puig, a hill north of the city, held off a counter-attack. Valencia, besieged from April 1238, surrendered on 28 September, and its ruler, Zayyan ibn Mardanish, and many of its people left. The conquest went on south towards Xàtiva and Biar, and in 1244 the Treaty of Almizra fixed the line between Aragon’s conquests and Castile’s. Valencia became a separate kingdom of the Crown of Aragon, where a Muslim majority lived on under Christian rule.: Jakob intog sedan de muslimska områdena i Valencia bit för bit. Morella och Burriana föll 1232–1233, och 1237 slog hans garnison på Puig, en kulle norr om staden, tillbaka ett motanfall. Valencia, belägrat från april 1238, kapitulerade den 28 september, och dess härskare, Zayyan ibn Mardanish, och många av dess invånare lämnade staden. Erövringen fortsatte söderut mot Xàtiva och Biar, och 1244 fastställde fördraget i Almizra gränsen mellan Aragoniens och Kastiliens erövringar. Valencia blev ett separat kungarike inom Aragoniska kronan, där en muslimsk majoritet levde vidare under kristet styre.
