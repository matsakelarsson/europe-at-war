Almanzor’s sons could not hold his regime together, and from 1009 al-Andalus fell into a civil war, the fitna, in which Berber, Slav and Andalusi factions made and unmade caliphs, and Christian troops fought on both sides. In 1031 the caliphate was abolished. Its lands split into more than twenty taifas, kingdoms ruled from cities such as Zaragoza, Toledo, Badajoz, Seville and Granada, rich in trade and learning but weak, and often at war with each other.: Almanzors söner kunde inte hålla samman hans regim, och från 1009 föll al-Andalus i ett inbördeskrig, fitnan, där berbiska, slaviska och andalusiska fraktioner tillsatte och avsatte kalifer och kristna trupper stred på båda sidor. År 1031 avskaffades kalifatet. Dess områden splittrades i mer än tjugo taifor, kungariken som styrdes från städer som Zaragoza, Toledo, Badajoz, Sevilla och Granada, rika på handel och lärdom men svaga och ofta i krig med varandra.
The Christian kings now took tribute instead of paying it. Ferdinand I, count of Castile and from 1037 king of León, made the taifa rulers pay parias, protection money in gold, and took Coimbra in 1064. That year knights from France, Normandy and Catalonia, encouraged by the pope, took Barbastro, though Zaragoza won it back in 1065. His son Alfonso VI installed a client, al-Qadir, in Toledo, and when al-Qadir’s subjects turned against him Alfonso besieged the city. The old Visigothic capital surrendered in May 1085; its Muslims were promised their property and their great mosque, which was nevertheless made a cathedral the next year.: De kristna kungarna tog nu emot tribut i stället för att betala den. Ferdinand I, greve av Kastilien och från 1037 kung av León, tvingade taifahärskarna att betala parias, skyddspengar i guld, och intog Coimbra 1064. Samma år intog riddare från Frankrike, Normandie och Katalonien, uppmuntrade av påven, Barbastro, men Zaragoza återtog staden 1065. Hans son Alfonso VI insatte en lydfurste, al-Qadir, i Toledo, och när al-Qadirs undersåtar vände sig mot honom belägrade Alfonso staden. Den gamla västgotiska huvudstaden kapitulerade i maj 1085; dess muslimer utlovades att få behålla sin egendom och sin stora moské, som ändå gjordes till katedral året därpå.
