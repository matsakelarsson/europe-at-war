After Las Navas the Almohad empire broke up. From 1224 rival caliphs fought each other, and in al-Andalus Ibn Hud of Murcia rose against them. Ferdinand III, king of Castile and from 1230 also of León, uniting the two kingdoms for good, made the most of the chaos. In January 1236 frontier fighters seized a suburb of Córdoba by surprise, Ferdinand hurried south, and the old caliphal capital surrendered on 29 June. Its great mosque became a cathedral. Murcia accepted Castilian overlordship in 1243, and in 1246 Muhammad ibn al-Ahmar, founder of the Nasrid emirate of Granada, gave up Jaén and became Ferdinand’s vassal.: Efter Las Navas föll det almohadiska riket sönder. Från 1224 stred rivaliserande kalifer mot varandra, och i al-Andalus reste sig Ibn Hud av Murcia mot dem. Ferdinand III, kung av Kastilien och från 1230 även av León, vilket förenade de två kungarikena för gott, utnyttjade kaoset till fullo. I januari 1236 intog gränskrigare överraskande en förstad till Córdoba, Ferdinand skyndade söderut, och den gamla kalifhuvudstaden kapitulerade den 29 juni. Dess stora moské blev katedral. Murcia godtog kastiliansk överhöghet 1243, och 1246 lämnade Muhammad ibn al-Ahmar, grundaren av det nasridiska emiratet Granada, ifrån sig Jaén och blev Ferdinands vasall.
Seville, the Almohads’ Iberian capital, was besieged from the summer of 1247, with Nasrid troops in the Castilian camp. On 3 May 1248 a fleet from the ports of the Cantabrian coast under Ramón Bonifaz broke the bridge of boats that linked the city with Triana across the Guadalquivir, and Seville surrendered on 23 November. Most of its Muslims left. In 1249 Afonso III of Portugal took Faro and the last towns of the Algarve, completing Portugal’s conquests, and Ferdinand’s son Alfonso X took Niebla and Cádiz in 1262. Only Granada remained independent.: Sevilla, almohadernas iberiska huvudstad, belägrades från sommaren 1247, med nasridiska trupper i det kastilianska lägret. Den 3 maj 1248 bröt en flotta från hamnarna vid den kantabriska kusten under Ramón Bonifaz den pontonbro som förband staden med Triana på andra sidan Guadalquivir, och Sevilla kapitulerade den 23 november. De flesta av dess muslimer lämnade staden. År 1249 intog Afonso III av Portugal Faro och de sista städerna i Algarve, vilket fullbordade Portugals erövringar, och Ferdinands son Alfonso X intog Niebla och Cádiz 1262. Bara Granada förblev oberoende.
