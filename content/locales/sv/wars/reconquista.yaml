After a siege of twenty months the garrison and people left under a truce. Granada retook the town in 1369 and later razed it.: Efter en tjugo månader lång belägring lämnade garnisonen och invånarna staden under ett stillestånd. Granada återtog staden 1369 och jämnade den senare med marken.
1309 and 1333: 1309 och 1333
Castile took Gibraltar in 1309 and lost it to the Marinids in 1333. Alfonso XI died of plague in his camp before the rock in March 1350.: Kastilien intog Gibraltar 1309 och förlorade det till mariniderna 1333. Alfonso XI dog i pest i sitt läger framför klippan i mars 1350.
Abu al-Hasan: Abu al-Hasan
Alfonso XI and Afonso IV: Alfonso XI och Afonso IV
For a century after Alfonso XI’s death Castile was taken up with civil wars, the war with England and quarrels with Portugal and Aragon. The frontier with Granada saw truces broken by raids and the occasional campaign, and Granada paid tribute when it had to and flourished; the Alhambra’s great courts were built under Yusuf I and Muhammad V. In 1410 Ferdinand, regent for his infant nephew John II of Castile, besieged Antequera, beat a relief army and took the town in September. Two years later, as Ferdinand of Antequera, he was chosen king of Aragon.: Under ett sekel efter Alfonso XI:s död var Kastilien upptaget av inbördeskrig, kriget mot England och tvister med Portugal och Aragonien. Vid gränsen mot Granada avlöste stillestånd, räder och enstaka fälttåg varandra, och Granada betalade tribut när det måste och blomstrade; Alhambras stora gårdar byggdes under Yusuf I och Muhammad V. År 1410 belägrade Ferdinand, förmyndare för sin späde brorson Johan II av Kastilien, Antequera, besegrade en undsättningshär och intog staden i september. Två år senare valdes han, som Ferdinand av Antequera, till kung av Aragonien.
In 1431 John II’s favourite, Álvaro de Luna, led a great army to the walls of Granada and won the battle of La Higueruela on 1 July, but Castile used the victory only to stir up Granada’s dynastic quarrels. Frontier lords did more. In August 1462 a surprise attack by the governor of Tarifa, reinforced by the Duke of Medina Sidonia and the Count of Arcos, won Gibraltar, held by Muslims since 1333, and Archidona fell the same year. Granada, weakened by feuds within the Nasrid family, was left with the mountains and coast between Ronda and Almería. The Granada War of 1482–1492 would finish it.: År 1431 ledde Johan II:s gunstling Álvaro de Luna en stor här till Granadas murar och vann slaget vid La Higueruela den 1 juli, men Kastilien använde segern bara till att underblåsa Granadas dynastiska tvister. Gränsherrarna gjorde mer. I augusti 1462 vann ett överraskningsanfall av guvernören i Tarifa, förstärkt av hertigen av Medina Sidonia och greven av Arcos, Gibraltar, som varit i muslimska händer sedan 1333, och Archidona föll samma år. Granada, försvagat av fejder inom den nasridiska ätten, behöll bara bergen och kusten mellan Ronda och Almería. Granadakriget 1482–1492 skulle göra slut på det.
