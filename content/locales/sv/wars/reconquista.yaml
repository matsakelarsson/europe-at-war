The Almohads, ruling from Marrakesh, took over al-Andalus, and by 1172 they had absorbed the last independent kingdom, Ibn Mardanish’s Murcia. Castile, León and Portugal, now separate kingdoms, fought them and each other along a frontier guarded by new military orders such as Calatrava and Santiago. Alfonso VIII of Castile took Cuenca in 1177. But on 18 July 1195, at Alarcos, near today’s Ciudad Real, the caliph Abu Yusuf Yaqub al-Mansur routed him, and Almohad armies then raided as far as Toledo and Madrid.: Almohaderna, som styrde från Marrakech, tog över al-Andalus, och 1172 hade de införlivat det sista oberoende kungariket, Ibn Mardanishs Murcia. Kastilien, León och Portugal, nu separata kungariken, stred mot dem och mot varandra längs en gräns som bevakades av nya riddarordnar som Calatrava och Santiago. Alfonso VIII av Kastilien intog Cuenca 1177. Men den 18 juli 1195, vid Alarcos nära dagens Ciudad Real, slog kalifen Abu Yusuf Yaqub al-Mansur honom på flykten, och almohadiska härar plundrade sedan ända till Toledo och Madrid.
Pope Innocent III proclaimed a crusade, and in 1212 Alfonso VIII, Peter II of Aragon and Sancho VII of Navarre gathered at Toledo with the military orders, a Portuguese contingent and crusaders from beyond the Pyrenees, most of whom went home after the capture of Calatrava. Crossing the Sierra Morena by a little-used pass, the army met the caliph Muhammad al-Nasir at Las Navas de Tolosa on 16 July 1212 and broke his army. Baeza was abandoned and Úbeda stormed, many of its people killed or enslaved. Almohad power never recovered.: Påven Innocentius III utlyste ett korståg, och 1212 samlades Alfonso VIII, Peter II av Aragonien och Sancho VII av Navarra i Toledo med riddarordnarna, en portugisisk kontingent och korsfarare från andra sidan Pyrenéerna, av vilka de flesta vände hem efter intagandet av Calatrava. Hären gick över Sierra Morena genom ett föga använt pass, mötte kalifen Muhammad al-Nasir vid Las Navas de Tolosa den 16 juli 1212 och krossade hans här. Baeza övergavs och Úbeda stormades, och många av dess invånare dödades eller förslavades. Den almohadiska makten återhämtade sig aldrig.
