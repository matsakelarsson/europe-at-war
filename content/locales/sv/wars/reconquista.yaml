Under Abd al-Rahman’s son al-Hakam II the frontier was quiet, but when he died in 976 his heir Hisham II was a boy. Within a few years power passed to the chamberlain, Muhammad ibn Abi Amir, who took the title al-Mansur, “the victorious”, and is known to the Christians as Almanzor. He built a professional army of Berber troops from North Africa and paid Christian mercenaries, and he led raids against the Christian north almost every year, about fifty-six in all, for captives, cattle and loot.: Under Abd al-Rahmans son al-Hakam II var gränsen lugn, men när han dog 976 var hans arvinge Hisham II ett barn. Inom några år övergick makten till kammarherren Muhammad ibn Abi Amir, som antog titeln al-Mansur, ”den segerrike”, och är känd bland de kristna som Almanzor. Han byggde upp en yrkesarmé av berbertrupper från Nordafrika och avlönade kristna legosoldater, och han ledde räder mot det kristna norr nästan varje år, omkring femtiosex totalt, efter fångar, boskap och byte.
His raids reached every Christian capital. In July 985 he took Barcelona and killed or enslaved many of its people; when the Frankish king sent no help, the counts of Barcelona drifted out of his kingdom. He took Coimbra in 987 and sacked León, and in August 997 he sacked Santiago de Compostela, which its bishop had evacuated, sparing the apostle’s tomb but carrying the cathedral’s bells to Córdoba. He fell ill on a raid into the Rioja in 1002 and died at Medinaceli that August. The later Christian story of his defeat at Calatañazor is a legend.: Hans räder nådde varje kristen huvudstad. I juli 985 intog han Barcelona och dödade eller förslavade många av dess invånare; när den frankiske kungen inte sände någon hjälp gled grevarna av Barcelona bort från hans rike. Han intog Coimbra 987 och plundrade León, och i augusti 997 plundrade han Santiago de Compostela, som biskopen hade utrymt; han skonade apostelns grav men förde katedralens klockor till Córdoba. Han insjuknade under en räd in i Rioja 1002 och dog i Medinaceli i augusti samma år. Den senare kristna berättelsen om hans nederlag vid Calatañazor är en legend.
