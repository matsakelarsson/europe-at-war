The Almoravids pressed on against Castile. At Uclés, on 29 May 1108, they destroyed a Castilian army, and Sancho, Alfonso VI’s only son, was killed in the flight. When the old king died the next year his daughter Urraca married Alfonso I of Aragon and Navarre, a match that soon turned into war between them. In 1110 the Almoravids took Zaragoza, the last independent taifa. Its fall threatened the Ebro valley, where Aragon had been advancing for decades and had taken Huesca in 1096.: Almoraviderna fortsatte att tränga på mot Kastilien. Vid Uclés förintade de den 29 maj 1108 en kastiliansk här, och Sancho, Alfonso VI:s ende son, dödades under flykten. När den gamle kungen dog året därpå gifte sig hans dotter Urraca med Alfonso I av Aragonien och Navarra, ett äktenskap som snart övergick i krig mellan dem. År 1110 intog almoraviderna Zaragoza, den sista oberoende taifan. Dess fall hotade Ebrodalen, där Aragonien hade ryckt fram i årtionden och intagit Huesca 1096.
Alfonso I, the Battler, answered with a crusade. With French lords such as Gaston of Béarn, a veteran of the capture of Jerusalem, he besieged Zaragoza from May 1118 and took it on 18 December. Tudela, Tarazona and Calatayud followed, and in 1120 he beat an Almoravid relief army at Cutanda. In 1125–1126 he led a raid deep into Andalusia, bringing back thousands of Mozarab Christians to settle his new lands. In July 1134 the Almoravids routed him at Fraga, and he died that September, leaving his kingdoms to the military orders; nobody obeyed the will, and Aragon and Navarre went separate ways.: Alfonso I, Krigaren, svarade med ett korståg. Med franska herrar som Gaston av Béarn, en veteran från erövringen av Jerusalem, belägrade han Zaragoza från maj 1118 och intog staden den 18 december. Tudela, Tarazona och Calatayud följde, och 1120 besegrade han en almoravidisk undsättningshär vid Cutanda. År 1125–1126 ledde han en räd djupt in i Andalusien och förde tillbaka tusentals mozarabiska kristna för att kolonisera sina nya områden. I juli 1134 slog almoraviderna honom på flykten vid Fraga, och han dog i september samma år och testamenterade sina riken till de andliga riddarordnarna; ingen åtlydde testamentet, och Aragonien och Navarra gick skilda vägar.
