# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
Red Cloud’s War: Red Clouds krig
? "The war of 1866–1868 between the Lakota, Northern Cheyenne and Northern Arapaho and the United States over the Bozeman Trail, the road from the Oregon Trail to the Montana gold fields through the Powder River country east of the Bighorn Mountains. The Treaty of Fort Laramie of 1851 had recognised that country as Crow land, but by 1860 the Lakota and their allies had taken it from the Crow as their best remaining buffalo range. When the army began building forts along the trail in June 1866, during peace talks at Fort Laramie, the Oglala leader Red Cloud (Mahpiya Luta) and others left the council and made war. Lakota, Cheyenne and Arapaho warriors harassed the forts, their wood trains and travellers for two years, and on 21 December 1866 a decoy party that included the young Crazy Horse drew Captain William Fetterman and 80 men into an ambush near Fort Phil Kearny, where all were killed. Soldiers with new breech-loading rifles held off attacks at the Hayfield and Wagon Box fights in August 1867, but the trail stayed closed. With the Union Pacific Railroad offering another way west, the government gave in: by the Treaty of Fort Laramie of 1868 it abandoned the forts, which the Lakota and Cheyenne burned, closed the Powder River country to whites as unceded Indian territory and created the Great Sioux Reservation, including the Black Hills. Red Cloud signed on 6 November 1868. It is often called one of the few wars the United States lost to a Native nation; the treaty’s breach over the Black Hills led to the Great Sioux War of 1876."
: "Kriget 1866–1868 mellan lakota, nordcheyenner och nordarapaho och USA om Bozemanleden, vägen från Oregonleden till guldfälten i Montana genom Powder River-landet öster om Bighorn Mountains. Fördraget i Fort Laramie 1851 hade erkänt det området som crowfolkets land, men 1860 hade lakota och deras allierade tagit det från crow som sina bästa återstående bisonmarker. När armén började bygga fort längs leden i juni 1866, under fredsförhandlingar i Fort Laramie, lämnade oglalaledaren Red Cloud (Mahpiya Luta) och andra rådsmötet och gick ut i krig. Krigare ur lakota, cheyenne och arapaho ansatte forten, deras vedtransporter och resande i två år, och den 21 december 1866 lurade en lockgrupp, i vilken den unge Crazy Horse ingick, kapten William Fetterman och 80 man in i ett bakhåll nära Fort Phil Kearny, där alla dödades. Soldater med nya bakladdningsgevär slog tillbaka anfall i Hayfield- och Wagon Box-striderna i augusti 1867, men leden förblev stängd. Då Union Pacific-järnvägen erbjöd en annan väg västerut gav regeringen med sig: genom fördraget i Fort Laramie 1868 övergav den forten, som lakota och cheyenner brände, stängde Powder River-landet för vita som icke avträtt indianskt territorium och skapade Stora siouxreservatet, inklusive Black Hills. Red Cloud undertecknade den 6 november 1868. Kriget kallas ofta ett av de få krig som USA har förlorat mot en ursprungsamerikansk nation; brottet mot fördraget i fråga om Black Hills ledde till Stora siouxkriget 1876."
