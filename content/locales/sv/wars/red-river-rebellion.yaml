# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
Red River Rebellion: Red River-upproret
? The resistance of the Métis of the Red River Settlement, in what is now Manitoba, to the transfer of Rupert’s Land from the Hudson’s Bay Company to Canada in 1869–1870, also called the Red River Resistance. The Canadian government agreed to buy the company’s territory without consulting its people, of whom some 10,000 of about 12,000 at Red River were Métis, and sent surveyors and a lieutenant governor, William McDougall, before the transfer took effect. In October 1869 the Métis, led by Louis Riel, stopped the survey, formed a National Committee, turned McDougall back at the border and seized Upper Fort Garry. In December they declared a provisional government, which a convention of French- and English-speaking delegates endorsed in February 1870. The government imprisoned members of the pro-Canadian party and on 4 March 1870 executed one of them, Thomas Scott, which caused fury in Ontario. Delegates sent to Ottawa negotiated the Manitoba Act, by which Manitoba joined Canada as a province on 15 July 1870 with guarantees for land, the French language and Catholic schools. A military expedition under Colonel Garnet Wolseley reached Fort Garry on 24 August 1870; Riel had fled to the United States, and he was never granted the amnesty the delegates believed they had been promised.
: Motståndet från métis i Red River-kolonin, i det som i dag är Manitoba, mot överföringen av Ruperts land från Hudson’s Bay Company till Kanada 1869–1870, även kallat Red River-motståndet. Den kanadensiska regeringen gick med på att köpa kompaniets territorium utan att rådfråga dess invånare, av vilka omkring 10 000 av ungefär 12 000 vid Red River var métis, och sände lantmätare och en viceguvernör, William McDougall, innan överföringen hade trätt i kraft. I oktober 1869 stoppade métis, under ledning av Louis Riel, lantmätningen, bildade en nationalkommitté, vände McDougall tillbaka vid gränsen och intog Upper Fort Garry. I december utropade de en provisorisk regering, som ett konvent av fransk- och engelskspråkiga delegater ställde sig bakom i februari 1870. Regeringen fängslade medlemmar av det prokanadensiska partiet och avrättade den 4 mars 1870 en av dem, Thomas Scott, vilket väckte raseri i Ontario. Delegater som sändes till Ottawa förhandlade fram Manitoba Act, genom vilken Manitoba anslöt sig till Kanada som provins den 15 juli 1870 med garantier för mark, det franska språket och katolska skolor. En militärexpedition under överste Garnet Wolseley nådde Fort Garry den 24 augusti 1870; Riel hade flytt till USA, och han beviljades aldrig den amnesti som delegaterna trodde att de hade blivit lovade.
