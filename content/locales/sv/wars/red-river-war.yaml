# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
Red River War: Red River-kriget
? "The United States Army’s campaign of 1874–1875 that forced the last free bands of the Comanche, Kiowa, Southern Cheyenne and Arapaho onto reservations in Indian Territory, ending the wars of the southern plains. The Medicine Lodge treaties of 1867 had assigned the four nations reservations in Indian Territory with rations and hunting rights south of the Arkansas, but the rations fell short and from 1873 commercial hunters slaughtered the last great buffalo herds of the southern plains for their hides. Inspired by the Comanche prophet Isatai, several hundred Comanche, Cheyenne and Kiowa warriors (estimates range from about 250 to 700) led by Quanah Parker attacked the hunters’ post at Adobe Walls in the Texas Panhandle on 27 June 1874 and were driven off by the hunters’ long-range rifles; raids across Texas, Kansas and Colorado followed. Generals Sherman and Sheridan sent five columns from Kansas, Indian Territory, Texas and New Mexico to converge on the headwaters of the Red River and keep the bands moving without rest. Most fights were small, but the army destroyed what the bands could not carry: on 28 September Colonel Ranald Mackenzie’s 4th Cavalry surprised Comanche, Kiowa and Cheyenne camps in Palo Duro Canyon, burned their lodges and winter food and killed most of some 1,400 captured horses. Hungry and on foot, band after band surrendered through the winter and spring, the last, Quanah’s Quahadi Comanche, at Fort Sill on 2 June 1875. About seventy men and women chosen as leaders or wrongdoers were sent without trial to prison at Fort Marion in Florida."
: "USA:s armés fälttåg 1874–1875 som tvingade de sista fria grupperna av komancher, kiowa, sydcheyenner och arapaho att flytta in på reservat i Indianterritoriet och som avslutade krigen på de södra prärierna. Medicine Lodge-fördragen 1867 hade tilldelat de fyra nationerna reservat i Indianterritoriet med ransoner och jakträtt söder om Arkansasfloden, men ransonerna räckte inte till, och från 1873 slaktade kommersiella jägare de sista stora bisonhjordarna på de södra prärierna för hudarnas skull. Inspirerade av komanchprofeten Isatai anföll flera hundra komanch-, cheyenne- och kiowakrigare (uppskattningarna varierar från omkring 250 till 700) under ledning av Quanah Parker jägarnas handelsstation vid Adobe Walls i Texas Panhandle den 27 juni 1874 och drevs tillbaka av jägarnas långskjutande gevär; räder över Texas, Kansas och Colorado följde. Generalerna Sherman och Sheridan sände fem kolonner från Kansas, Indianterritoriet, Texas och New Mexico, som skulle stråla samman vid Red Rivers källflöden och hålla grupperna i ständig rörelse utan vila. De flesta striderna var små, men armén förstörde det som grupperna inte kunde bära med sig: den 28 september överraskade överste Ranald Mackenzies 4:e kavalleriregemente komanchernas, kiowas och cheyennernas läger i Palo Duro Canyon, brände deras tält och vinterförråd och dödade de flesta av omkring 1 400 erövrade hästar. Hungriga och till fots gav grupp efter grupp upp under vintern och våren, den sista, Quanahs quahadi-komancher, i Fort Sill den 2 juni 1875. Omkring sjuttio män och kvinnor som utpekats som ledare eller missdådare sändes utan rättegång till fängelset i Fort Marion i Florida."
