# Svenska översättningar av katalogtexten (våg 10); stegtexterna kommer senare.
Red Turban invasions of Goryeo: De röda turbanernas invasioner av Goryeo
? Two invasions of Goryeo by a northern army of the Red Turbans, the rebel movement that rose against the Yuan dynasty in China in 1351. After failing to take the Yuan capital Dadu in 1358, Red Turban forces under Guan Xiansheng and others burned the summer capital Shangdu and moved into Liaodong; pressed by the Yuan, they turned on Goryeo. In the twelfth month of 1359 Mao Jujing crossed the frozen Yalu with 40,000 men and took the Western Capital, Pyongyang, but Goryeo retook it within weeks and drove the invaders out early in 1360. In the tenth month of 1361 a much larger army, said to number over 100,000, under Pan Cheng, Sha Liu, Guan Xiansheng and others swept south. King Gongmin fled to Bokju (Andong), and the Red Turbans held Kaegyong for about two months, burning the palace. In the first month of 1362 a Goryeo army of about 200,000 under Jeong Se-un stormed the city, killing Sha Liu and Guan Xiansheng, and the survivors fled across the Yalu. The war left the north devastated, and generals such as Choe Yeong and Yi Seong-gye rose to prominence.
: Två invasioner av Goryeo genom en nordlig armé av de röda turbanerna, den rebellrörelse som reste sig mot Yuandynastin i Kina 1351. Sedan de misslyckats med att inta Yuans huvudstad Dadu 1358 brände styrkor ur de röda turbanerna under Guan Xiansheng och andra sommarhuvudstaden Shangdu och drog in i Liaodong; trängda av Yuan vände de sig mot Goryeo. I tolfte månaden 1359 gick Mao Jujing över den frusna Yalu med 40 000 man och intog Västra huvudstaden, Pyongyang, men Goryeo återtog den inom några veckor och drev ut inkräktarna i början av 1360. I tionde månaden 1361 svepte en mycket större armé, som sades uppgå till över 100 000 man, söderut under Pan Cheng, Sha Liu, Guan Xiansheng och andra. Kung Gongmin flydde till Bokju (Andong), och de röda turbanerna höll Kaegyong i omkring två månader och brände palatset. I första månaden 1362 stormade en Goryeoarmé på omkring 200 000 man under Jeong Se-un staden och dödade Sha Liu och Guan Xiansheng, och de överlevande flydde över Yalu. Kriget lämnade norr ödelagt, och generaler som Choe Yeong och Yi Seong-gye fick en framträdande ställning.
