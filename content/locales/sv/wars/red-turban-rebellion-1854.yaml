# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
Red Turban rebellion in Guangdong: Röda turbanernas uppror i Guangdong
? A rising of the Heaven and Earth Society (Tiandihui) lodges of Guangdong, whose fighters wore red headbands, inspired by the Taiping capture of Nanjing. Hard times, heavy taxes for the war against the Taiping and floods drove the lodges to revolt in the summer of 1854. He Liu took Dongguan, Chen Kai took Foshan on 4 July 1854, and Li Wenmao and others joined him; by the autumn Red Turban armies held much of the Pearl River delta and besieged Guangzhou. The provincial capital held out, defended by militia raised by the gentry and with the British navy guarding the river. In 1855 the governor-general Ye Mingchen drove the rebels out of the delta and carried out mass executions at the Guangzhou execution ground; estimates of those put to death in the province range from more than 100,000, the figure Ye himself gave, to as many as a million. Many Red Turbans marched north to join the Taiping, while Chen Kai and Li Wenmao went west into Guangxi, took Xunzhou (Guiping) in 1855 and founded the Dacheng kingdom there, which held out until 1861.
: En resning av Himlens och jordens sällskaps (Tiandihui) loger i Guangdong, vars krigare bar röda pannband, inspirerad av taipingrebellernas erövring av Nanking. Svåra tider, tunga skatter för kriget mot taipingrebellerna och översvämningar drev logerna till uppror sommaren 1854. He Liu intog Dongguan, Chen Kai intog Foshan den 4 juli 1854, och Li Wenmao och andra anslöt sig till honom; på hösten behärskade de röda turbanernas arméer stora delar av Pärlflodsdeltat och belägrade Kanton. Provinshuvudstaden höll stånd, försvarad av milis som de lokala notablerna hade satt upp och med den brittiska flottan som vakt på floden. År 1855 drev generalguvernören Ye Mingchen ut rebellerna ur deltat och lät genomföra massavrättningar på avrättningsplatsen i Kanton; uppskattningarna av antalet avrättade i provinsen varierar från mer än 100 000, den siffra som Ye själv uppgav, till så många som en miljon. Många röda turbaner marscherade norrut för att ansluta sig till taipingrebellerna, medan Chen Kai och Li Wenmao drog västerut in i Guangxi, intog Xunzhou (Guiping) 1855 och där grundade kungariket Dacheng, som höll ut till 1861.
