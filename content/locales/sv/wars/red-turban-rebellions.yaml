# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
Red Turban rebellions: De röda turbanernas uppror
? "The risings that ended Mongol rule in China. In 1351, as the Yuan government put 170,000 men to work on new dykes for the Yellow River in a decade of floods, famine and epidemics, followers of the White Lotus teaching, who awaited the coming of the Buddha Maitreya, rose in the Huai valley under Liu Futong; in Hubei Xu Shouhui proclaimed the state of Tianwan. The rebels wore red headcloths and became known as the Red Turbans. The chancellor Toghto came close to crushing them, but was dismissed in the middle of the siege of Gaoyou in 1355, and the rebellion spread. In the north the Song state of Han Lin’er and Liu Futong sent armies as far as Shangdu and Liaoyang before Yuan commanders such as Chaghan Temür and Köke Temür drove them back. In the Yangtze valley rival regimes fought each other: Zhu Yuanzhang, a former monk who took Nanjing in 1356, defeated Chen Youliang’s Han at Lake Poyang in 1363 and Zhang Shicheng’s Wu at Suzhou in 1367, proclaimed the Ming dynasty in January 1368 and took the Yuan capital Dadu (Beijing) in September 1368."
: "De resningar som gjorde slut på mongolernas styre i Kina. År 1351, när Yuanregeringen satte 170 000 man i arbete med nya vallar längs Gula floden under ett decennium av översvämningar, hungersnöd och epidemier, reste sig anhängare av Vita lotus-läran, som väntade på buddhan Maitreyas ankomst, i Huaidalen under Liu Futong; i Hubei utropade Xu Shouhui staten Tianwan. Rebellerna bar röda huvuddukar och blev kända som de röda turbanerna. Kanslern Toghto var nära att krossa dem men avsattes mitt under belägringen av Gaoyou 1355, och upproret spred sig. I norr sände Han Lin’ers och Liu Futongs Songstat arméer ända till Shangdu och Liaoyang innan Yuanbefälhavare som Chaghan Temür och Köke Temür drev tillbaka dem. I Yangtzedalen bekämpade rivaliserande regimer varandra: Zhu Yuanzhang, en före detta munk som intog Nanking 1356, besegrade Chen Youliangs Han vid Poyangsjön 1363 och Zhang Shichengs Wu vid Suzhou 1367, utropade Mingdynastin i januari 1368 och intog Yuans huvudstad Dadu (Peking) i september 1368."
