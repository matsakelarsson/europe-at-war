Reform War: Reformkriget
? The civil war of 1857–1861 between Mexico’s Liberals and Conservatives over the Constitution of 1857 and the Liberal laws that ended the special courts of the Church and the army and forced the sale of church and communal lands. In December 1857 General Félix Zuloaga proclaimed the Plan of Tacubaya against the constitution and the Conservatives took Mexico City, while Benito Juárez, as president of the Supreme Court, claimed the presidency and set up a constitutional government, from May 1858 at Veracruz. For three years Mexico had two governments. The Conservative armies of Miguel Miramón, Leonardo Márquez and Tomás Mejía won most of the early battles, but twice failed to take Veracruz, and in 1859 Juárez answered with the Laws of Reform, which nationalised church property and separated church and state. In 1860 the Liberal armies of Jesús González Ortega and Ignacio Zaragoza won at Silao, took Guadalajara and destroyed Miramón’s army at Calpulalpan on 22 December, and Juárez returned to the capital on 11 January 1861. The war left the treasury empty and the Conservatives looking to Europe for a monarch, which led to the French intervention.
: Inbördeskriget 1857–1861 mellan Mexikos liberaler och konservativa om 1857 års konstitution och de liberala lagar som avskaffade kyrkans och arméns särskilda domstolar och tvingade fram försäljning av kyrkans mark och byarnas samfällda mark. I december 1857 utropade general Félix Zuloaga Tacubayaplanen mot konstitutionen och de konservativa intog Mexico City, medan Benito Juárez, som ordförande i högsta domstolen, gjorde anspråk på presidentämbetet och bildade en konstitutionell regering, från maj 1858 i Veracruz. Under tre år hade Mexiko två regeringar. De konservativa arméerna under Miguel Miramón, Leonardo Márquez och Tomás Mejía vann de flesta av de tidiga slagen men misslyckades två gånger med att inta Veracruz, och 1859 svarade Juárez med reformlagarna, som förstatligade kyrkans egendom och skilde kyrka och stat åt. År 1860 segrade de liberala arméerna under Jesús González Ortega och Ignacio Zaragoza vid Silao, intog Guadalajara och förintade Miramóns armé vid Calpulalpan den 22 december, och Juárez återvände till huvudstaden den 11 januari 1861. Kriget lämnade statskassan tom och fick de konservativa att vända sig till Europa för att finna en monark, vilket ledde till den franska interventionen.
