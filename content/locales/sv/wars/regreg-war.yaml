# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
Regreg war: Regregkriget
? "A civil war in Majapahit between the western court at Trowulan, ruled by King Wikramawardhana, and the eastern court of Bhre Wirabhumi, the lord of the Blambangan region in the east of Java. Since the 1370s Majapahit had had two courts, both of which sent their own envoys to the Ming: an eastern court had grown up under Wijayarajasa, the husband of Hayam Wuruk’s aunt, and after his death in 1398 passed to Bhre Wirabhumi, Hayam Wuruk’s son by a concubine, who believed he had a better right to the throne than Wikramawardhana, Hayam Wuruk’s nephew and son-in-law. A quarrel over titles in 1400–1402 led to a breach, and Wirabhumi received recognition and a seal from the Ming court. Fighting began in 1404 and went on with halts and reverses, which is what regreg means. In 1406 the western army under Wikramawardhana’s son Bhre Tumapel broke into the eastern court; Wirabhumi fled by boat at night, was overtaken and killed by Raden Gajah, and his head was brought to Trowulan. During the fighting about 170 men of a Ming mission sent by Zheng He’s fleet were killed at the eastern court; the Yongle emperor demanded 60,000 taels of gold in compensation, of which Majapahit paid 10,000 by 1408 before the rest was forgiven. Majapahit was reunited, but the war hastened the loss of its overseas dependencies as Malacca, Palembang and Brunei went their own way."
: "Ett inbördeskrig i Majapahit mellan det västra hovet i Trowulan, där kung Wikramawardhana härskade, och det östra hovet under Bhre Wirabhumi, herre över Blambanganregionen på östra Java. Sedan 1370-talet hade Majapahit haft två hov, som båda sände egna sändebud till Ming: ett östligt hov hade vuxit fram under Wijayarajasa, gift med Hayam Wuruks moster, och övergick efter hans död 1398 till Bhre Wirabhumi, Hayam Wuruks son med en konkubin, som ansåg sig ha bättre rätt till tronen än Wikramawardhana, Hayam Wuruks systerson och svärson. En tvist om titlar 1400–1402 ledde till brytning, och Wirabhumi fick erkännande och ett sigill från Minghovet. Striderna började 1404 och fortsatte med avbrott och bakslag, vilket är vad regreg betyder. År 1406 bröt sig den västra armén under Wikramawardhanas son Bhre Tumapel in i det östra hovet; Wirabhumi flydde med båt om natten, hanns upp och dödades av Raden Gajah, och hans huvud fördes till Trowulan. Under striderna dödades omkring 170 män ur en Mingbeskickning, som Zheng Hes flotta hade sänt, vid det östra hovet; Yonglekejsaren krävde 60 000 tael guld i skadestånd, varav Majapahit hade betalat 10 000 år 1408 innan resten efterskänktes. Majapahit återförenades, men kriget påskyndade förlusten av rikets besittningar på andra sidan havet när Malacka, Palembang och Brunei gick sina egna vägar."
