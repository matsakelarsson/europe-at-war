# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
Republic of South Maluku: Republiken Sydmoluckerna
? The attempt to make the southern Moluccas an independent state, and its suppression by Indonesia. Under the Round Table agreement of 1949 Indonesia became a federation, the Republic of the United States of Indonesia, in which the Moluccas belonged to the State of East Indonesia. In 1950 the federal states were rapidly absorbed into a unitary Republic. In Makassar, the capital of East Indonesia, the former colonial army captain Andi Aziz seized the city on 5 April 1950 to stop the landing of Republican troops; he was arrested when he went to Jakarta to negotiate on 14 April, and fighting between former Dutch colonial (KNIL) soldiers and the Indonesian army went on in Makassar into August. On Ambon, where many Christian Ambonese had served in the KNIL and feared their place in a Javanese-dominated republic, former East Indonesian justice minister Chris Soumokil and other leaders, backed by some 1,700 KNIL soldiers stationed there, proclaimed the Republic of South Maluku (Republik Maluku Selatan, RMS) on 25 April 1950, with J. H. Manuhutu as president. Indonesia blockaded the islands, landed on Buru and Seram in July and on Ambon on 28 September 1950, and took the town of Ambon in November after heavy fighting, in which the Indonesian commander Lieutenant Colonel Slamet Riyadi was killed. The RMS government withdrew to Seram and kept up a guerrilla war in its forests until Soumokil was captured there on 2 December 1963; a few fighters held out longer. Soumokil was sentenced to death by a military court and executed in April 1966. In 1951 the Netherlands shipped some 12,500 Moluccan KNIL soldiers and their families to the Netherlands, intending a temporary stay; a government in exile was formed among them, and in the 1970s young Moluccans seized trains, a school and buildings in the Netherlands in protest at Dutch policy.
: Försöket att göra södra Moluckerna till en självständig stat, och Indonesiens nedslående av det. Enligt rundabordsavtalet 1949 blev Indonesien en federation, Republiken Indonesiens förenta stater, där Moluckerna hörde till staten Östindonesien. 1950 uppgick delstaterna snabbt i en enhetsrepublik. I Makassar, Östindonesiens huvudstad, tog den före detta kaptenen i kolonialarmén Andi Aziz kontroll över staden den 5 april 1950 för att hindra republikanska trupper från att landstiga; han greps när han reste till Jakarta för att förhandla den 14 april, och striderna mellan tidigare nederländska kolonialsoldater (KNIL) och den indonesiska armén fortsatte i Makassar in i augusti. På Ambon, där många kristna ambonesier hade tjänstgjort i KNIL och oroade sig för sin ställning i en javanesiskt dominerad republik, utropade Östindonesiens förre justitieminister Chris Soumokil och andra ledare, med stöd av omkring 1 700 KNIL-soldater som var stationerade där, Republiken Sydmoluckerna (Republik Maluku Selatan, RMS) den 25 april 1950, med J. H. Manuhutu som president. Indonesien blockerade öarna, landsteg på Buru och Seram i juli och på Ambon den 28 september 1950 och intog staden Ambon i november efter hårda strider, där den indonesiske befälhavaren överstelöjtnant Slamet Riyadi stupade. RMS-regeringen drog sig tillbaka till Seram och förde ett gerillakrig i öns skogar tills Soumokil tillfångatogs där den 2 december 1963; några få kämpar höll ut längre. Soumokil dömdes till döden av en militärdomstol och avrättades i april 1966. 1951 skeppade Nederländerna omkring 12 500 moluckiska KNIL-soldater och deras familjer till Nederländerna, avsett som en tillfällig vistelse; en exilregering bildades bland dem, och på 1970-talet kapade unga moluckier tåg och tog över en skola och andra byggnader i Nederländerna i protest mot den nederländska politiken.
