# Svenska översättningar av katalogtexten (våg 13); stegtexterna kommer senare.
Republic of the Congo Civil War (1997–1999): Inbördeskriget i Republiken Kongo (1997–1999)
The war in Congo-Brazzaville between the militias of the country’s three main politicians, the elected president Pascal Lissouba (the Cocoyes), the former military ruler Denis Sassou Nguesso (the Cobras) and Brazzaville’s mayor Bernard Kolélas (the Ninjas). It began on 5 June 1997, a few weeks before a presidential election, when government forces surrounded Sassou Nguesso’s residence in Brazzaville, and turned the capital into a battlefield divided between the militias. In October 1997 Angola, which accused Lissouba of helping UNITA, sent troops and aircraft, and Sassou Nguesso took power. Fighting resumed in 1998–1999 in the south, the Pool region and the southern quarters of Brazzaville, where Ninjas and Cocoyes fought the new government, its Angolan allies and Chadian troops; hundreds of thousands of people fled to the forests. Ceasefires signed in November and December 1999 ended the war. Estimates of the dead range from about 14,000 to 25,000.: Kriget i Kongo-Brazzaville mellan miliserna hos landets tre främsta politiker, den valde presidenten Pascal Lissouba (Cocoyes), den tidigare militärhärskaren Denis Sassou Nguesso (Cobras) och Brazzavilles borgmästare Bernard Kolélas (Ninjas). Det började den 5 juni 1997, några veckor före ett presidentval, när regeringsstyrkor omringade Sassou Nguessos residens i Brazzaville, och förvandlade huvudstaden till ett slagfält delat mellan miliserna. I oktober 1997 sände Angola, som anklagade Lissouba för att hjälpa Unita, trupper och flygplan, och Sassou Nguesso tog makten. Striderna återupptogs 1998–1999 i söder, i regionen Pool och i Brazzavilles södra stadsdelar, där Ninjas och Cocoyes bekämpade den nya regeringen, dess angolanska allierade och tchadiska trupper; hundratusentals människor flydde till skogarna. Vapenvilor som undertecknades i november och december 1999 gjorde slut på kriget. Uppskattningarna av antalet döda varierar från omkring 14 000 till 25 000.
