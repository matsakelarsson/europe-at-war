# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
Republic of West Florida: Republiken Västflorida
? A short-lived revolt in the westernmost part of Spanish West Florida, between the Mississippi and the Pearl River, and its annexation by the United States. The district of Baton Rouge had been settled mostly by English-speaking Americans and Britons since the 1780s, many of them planters who held enslaved people, and the United States claimed it as part of the Louisiana Purchase, which Spain denied. After Napoleon’s invasion of Spain in 1808 weakened Spanish rule, the settlers held conventions from June 1810 under the governor, Carlos de Hault de Lassus, while some of them plotted rebellion. Early on 23 September 1810 a force of mounted militia under Philemon Thomas took the Spanish fort of San Carlos at Baton Rouge, killing two Spanish soldiers and capturing de Lassus. On 26 September the convention declared the Republic of West Florida independent; it adopted a constitution, made St. Francisville its capital and elected Fulwar Skipwith governor, under a flag with a white star on a blue field, a design revived in 1861 as the Bonnie Blue Flag. An expedition under Reuben Kemper failed to take Mobile. On 27 October President James Madison proclaimed that the United States would take possession of the region as part of the Territory of Orleans, and American officials and troops under Governor William C. C. Claiborne of the Territory of Orleans and David Holmes of the Mississippi Territory took over St. Francisville on 6 December and Baton Rouge on 10 December 1810; the republic, which had hoped to join the United States on its own terms, gave way after about 74 days. Spain protested, but its remaining West Florida, with Mobile, was occupied by American troops in 1813, and it ceded the Floridas by the Adams–Onís Treaty of 1819. The republic’s territory is today’s Florida Parishes of Louisiana.
: Ett kortlivat uppror i den västligaste delen av Spanska Västflorida, mellan Mississippi och Pearl River, och områdets annektering av USA. Distriktet Baton Rouge hade sedan 1780-talet huvudsakligen befolkats av engelsktalande amerikaner och britter, många av dem plantageägare som höll förslavade människor, och USA gjorde anspråk på det som en del av Louisianaköpet, något som Spanien förnekade. Sedan Napoleons invasion av Spanien 1808 hade försvagat det spanska styret höll nybyggarna från juni 1810 konvent under guvernören Carlos de Hault de Lassus, medan några av dem planerade ett uppror. Tidigt den 23 september 1810 intog en styrka av beriden milis under Philemon Thomas det spanska fortet San Carlos i Baton Rouge, dödade två spanska soldater och tillfångatog de Lassus. Den 26 september förklarade konventet Republiken Västflorida självständig; republiken antog en författning, gjorde St. Francisville till huvudstad och valde Fulwar Skipwith till guvernör, under en flagga med en vit stjärna på blått fält, en utformning som återupplivades 1861 som Bonnie Blue Flag. En expedition under Reuben Kemper misslyckades med att inta Mobile. Den 27 oktober proklamerade president James Madison att USA skulle ta området i besittning som en del av Orleansterritoriet, och amerikanska ämbetsmän och trupper under guvernör William C. C. Claiborne av Orleansterritoriet och David Holmes av Mississippiterritoriet tog över St. Francisville den 6 december och Baton Rouge den 10 december 1810; republiken, som hade hoppats att få ansluta sig till USA på egna villkor, gav vika efter omkring 74 dagar. Spanien protesterade, men dess återstående del av Västflorida, med Mobile, ockuperades av amerikanska trupper 1813, och Spanien avträdde båda Floridaprovinserna genom Adams–Onís-fördraget 1819. Republikens territorium motsvarar dagens Florida Parishes i Louisiana.
