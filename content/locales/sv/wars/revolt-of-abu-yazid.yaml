# Svenska översättningar av katalogtexten (våg 12); stegtexterna kommer senare.
Revolt of Abu Yazid: Abu Yazids uppror
? The great Kharijite rising against the Fatimid caliphs in Ifriqiya, led by Abu Yazid Makhlad ibn Kaydad, an Ibadi schoolmaster of the Nukkari school from the oases of the Djerid, called “the man on the donkey” after the animal he rode. Coming down from the Aurès mountains with the Hawwara Berbers early in 944, his followers took the fortress towns of the west, beat the Fatimid armies and in October 944 entered Kairouan, whose Sunni townspeople at first welcomed them. For eight months in 945 they blockaded the Fatimid capital, al-Mahdiya, and Abu Yazid recognised the Umayyad caliph of Córdoba. But his peasant army melted away, his men’s plunder and abductions turned the cities against him, and the siege of Sousse in 946 failed. The young caliph al-Mansur, who had kept his father’s death secret, broke the rebels outside Kairouan in August 946 and hunted Abu Yazid through the Zab and the Hodna mountains to the fortress of Kiyana, which he stormed on 14 August 947. Abu Yazid died of his wounds five days later; his stuffed skin was paraded through the towns. Militant Kharijism never again threatened the Maghreb, and the Fatimids went on to conquer Egypt.
: Det stora kharijitiska upproret mot fatimidkaliferna i Ifriqiya, lett av Abu Yazid Makhlad ibn Kaydad, en ibaditisk skollärare av nukkariskolan från oaserna i Djerid, kallad ”mannen på åsnan” efter det djur han red på. Hans anhängare, som tidigt 944 kom ned från Aurèsbergen med hawwaraberberna, intog fästningsstäderna i väster, besegrade de fatimidiska arméerna och tågade i oktober 944 in i Kairouan, vars sunnitiska invånare till en början välkomnade dem. Under åtta månader 945 blockerade de den fatimidiska huvudstaden al-Mahdiya, och Abu Yazid erkände den umayyadiske kalifen i Córdoba. Men hans bondearmé smälte bort, hans mäns plundring och bortrövanden vände städerna mot honom, och belägringen av Sousse 946 misslyckades. Den unge kalifen al-Mansur, som hade hållit sin fars död hemlig, krossade rebellerna utanför Kairouan i augusti 946 och jagade Abu Yazid genom Zab och Hodnabergen till fästningen Kiyana, som han stormade den 14 augusti 947. Abu Yazid dog av sina sår fem dagar senare; hans uppstoppade hud fördes runt i städerna. Den militanta kharijismen hotade aldrig mer Maghreb, och fatimiderna gick vidare och erövrade Egypten.
