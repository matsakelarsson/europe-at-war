Revolt of Ali Pasha: Ali pashas uppror
The war in which Sultan Mahmud II destroyed Ali Pasha of Yanina, the Albanian-born governor who had made Epirus, Albania and much of mainland Greece a virtually independent state. Declared a rebel in 1820, Ali was abandoned by his sons and commanders and besieged in Ioannina by an Ottoman army under Ismail Pashabey and then Hurshid Pasha; he allied briefly with the Souliotes and the Greek rebels, but was killed in January 1822 after leaving his citadel under a promise of safety. The siege tied down Ottoman troops just as the Greek War of Independence broke out.: Kriget i vilket sultan Mahmud II krossade Ali pasha av Janina, den albanskfödde guvernör som hade gjort Epirus, Albanien och stora delar av det grekiska fastlandet till en i praktiken självständig stat. Sedan Ali förklarats som rebell 1820 övergavs han av sina söner och befälhavare och belägrades i Ioannina av en osmansk armé under Ismail Pashabey och sedan Hurshid pasha; han allierade sig en kort tid med sulioterna och de grekiska rebellerna men dödades i januari 1822 sedan han lämnat sitt citadell mot löfte om fri lejd. Belägringen band osmanska trupper just när grekiska frihetskriget bröt ut.
