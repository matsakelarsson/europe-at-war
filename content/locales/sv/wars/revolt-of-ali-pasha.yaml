Ali Pasha’s death is dated 24 January 1822 in most accounts and 5 February in others, the twelve days between the Julian and Gregorian calendars; accounts of how he died also differ.: Ali pashas död dateras i de flesta framställningar till den 24 januari 1822 och i andra till den 5 februari, de tolv dagar som skilde den julianska och den gregorianska kalendern åt; uppgifterna om hur han dog skiljer sig också åt.
