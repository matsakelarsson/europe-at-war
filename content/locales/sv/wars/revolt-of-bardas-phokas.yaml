Revolt of Bardas Phokas: Bardas Phokas uppror
The rebellion of Bardas Phokas, who in 987, after Basil II’s defeat by the Bulgarians at the Gates of Trajan, had himself proclaimed emperor in Asia Minor. He made an alliance with the returning rebel Bardas Skleros, then imprisoned him, took over almost all of Asia Minor and besieged Abydos on the Dardanelles. Basil II obtained 6,000 Varangian warriors from Prince Vladimir of Kiev, who was promised the emperor’s sister Anna in marriage and accepted baptism. The Varangians routed a rebel army at Chrysopolis, and at Abydos on 13 April 989 Phokas died, apparently of a seizure, as he rode out to attack Basil. His army broke up, and Skleros submitted later that year. The Varangians became the emperors’ guard.: Upproret under Bardas Phokas, som 987, efter Basileios II:s nederlag mot bulgarerna vid Trajanus port, lät utropa sig till kejsare i Mindre Asien. Han slöt förbund med den återvändande upprorsmannen Bardas Skleros, fängslade honom sedan, tog kontroll över nästan hela Mindre Asien och belägrade Abydos vid Dardanellerna. Basileios II fick 6 000 väringakrigare av furst Vladimir av Kiev, som utlovades kejsarens syster Anna till hustru och lät döpa sig. Väringarna slog en rebellarmé på flykten vid Chrysopolis, och vid Abydos den 13 april 989 dog Phokas, till synes av ett anfall, när han red ut för att angripa Basileios. Hans armé upplöstes, och Skleros underkastade sig senare samma år. Väringarna blev kejsarnas livgarde.
