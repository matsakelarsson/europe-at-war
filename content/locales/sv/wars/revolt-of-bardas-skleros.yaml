The main sources are Leo the Deacon, Michael Psellos and John Skylitzes on the Byzantine side, with Yahya of Antioch and other Arabic writers. Accounts of the battles differ; the last is said to have been decided by single combat between the two Bardases, in which Skleros was wounded.: Huvudkällorna är Leon Diakonos, Michael Psellos och Johannes Skylitzes på bysantinsk sida, tillsammans med Yahya av Antiochia och andra arabiska skribenter. Uppgifterna om slagen skiljer sig åt; det sista sägs ha avgjorts genom envig mellan de två Bardas, där Skleros sårades.
Skleros returned in 987 and joined, then was imprisoned by, Bardas Phokas; see the revolt of Bardas Phokas.: Skleros återvände 987 och anslöt sig till Bardas Phokas, som sedan fängslade honom; se Bardas Phokas uppror.
