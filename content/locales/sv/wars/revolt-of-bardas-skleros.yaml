Revolt of Bardas Skleros: Bardas Skleros uppror
The rebellion of Bardas Skleros, the leading general of the East, who was proclaimed emperor by his troops in 976 after the regent Basil Lekapenos, ruling for the young Basil II, removed him from his command. Skleros won over the eastern frontier, defeated the loyalist armies and took most of Asia Minor; his fleet tried to close the Dardanelles and he besieged Nicaea. The government released his old rival Bardas Phokas, who, with 12,000 Georgian horsemen sent by David III of Tao, was beaten twice before defeating Skleros on 24 March 979 in a battle decided, the chroniclers say, by single combat between the two Bardases. Skleros fled to Baghdad. The revolt kept Byzantium from stopping the rise of Samuel’s Bulgaria.: Upproret under Bardas Skleros, Österns främste general, som utropades till kejsare av sina trupper 976 sedan regenten Basileios Lekapenos, som styrde för den unge Basileios II, avsatt honom från hans befäl. Skleros vann över östgränsen, besegrade de lojala arméerna och tog större delen av Mindre Asien; hans flotta försökte stänga Dardanellerna och han belägrade Nicaea. Regeringen frigav hans gamle rival Bardas Phokas, som med 12 000 georgiska ryttare sända av David III av Tao besegrades två gånger innan han slog Skleros den 24 mars 979 i ett slag som enligt krönikörerna avgjordes genom envig mellan de två Bardas. Skleros flydde till Bagdad. Upproret hindrade Bysans från att stoppa Samuels Bulgariens uppgång.
