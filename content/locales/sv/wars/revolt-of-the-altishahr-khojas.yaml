# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
Revolt of the Altishahr Khojas: Khojornas uppror i Altishahr
The war in which the Qing empire conquered Altishahr, the oasis cities of the Tarim basin, from the Afaqi Khojas, a family of Sufi leaders who had ruled them under the Dzungars. Released from Dzungar captivity by the Qing in 1755, the brothers Burhan al-Din and Khoja Jahan returned to Kashgar and Yarkand as Qing vassals, but in 1757, while the Qing were fighting Amursana, they declared their independence and killed a Qing envoy. In 1758 a Qing army took Kucha, Aksu and Uch Turfan, but the brothers escaped, and Zhaohui’s army was besieged for three months at the Black River camp outside Yarkand until relieved in February 1759. In the summer of 1759 the Qing took Kashgar and Yarkand, and the khojas fled over the Pamirs to Badakhshan, where the ruler Sultan Shah had them killed and sent Khoja Jahan’s head to the Qing. Altishahr was joined to Dzungaria as Xinjiang and governed through local begs under Qing military officials; the khojas’ descendants in exile led new invasions from Kokand in the 19th century.: Kriget där Qingriket erövrade Altishahr, oasstäderna i Tarimbäckenet, från afaqikhojorna, en släkt av sufiledare som hade styrt dem under dzungarerna. Bröderna Burhan al-Din och Khoja Jahan, som Qing hade befriat ur dzungarisk fångenskap 1755, återvände till Kashgar och Yarkand som Qingvasaller, men 1757, medan Qing bekämpade Amursana, förklarade de sig självständiga och dödade ett sändebud från Qing. År 1758 intog en Qingarmé Kucha, Aksu och Uch Turfan, men bröderna kom undan, och Zhaohuis armé belägrades i tre månader i lägret vid Svarta floden utanför Yarkand tills den undsattes i februari 1759. Sommaren 1759 intog Qing Kashgar och Yarkand, och khojorna flydde över Pamir till Badakhshan, där härskaren Sultan Shah lät döda dem och sände Khoja Jahans huvud till Qing. Altishahr förenades med Dzungariet till Xinjiang och styrdes genom lokala beger under Qings militära ämbetsmän; khojornas ättlingar i landsflykt ledde nya invasioner från Kokand under 1800-talet.
