Revolt of the Brotherhoods: Brödraskapens uppror
A revolt of the armed guilds, the germanies, of the Kingdom of Valencia against the nobles and the royal government of Charles I, with a related rising on Majorca. In 1519, when plague drove many nobles from the city of Valencia, the guilds took over its government through a Council of Thirteen, and in 1520 they forced out the new viceroy, Diego Hurtado de Mendoza. Open war came in 1521. The agermanats under Vicent Peris beat the viceroy at Gandia in July and forcibly baptised the Muslim peasants of the region, but within weeks they were crushed by the Marquis of Los Vélez at Oriola, and the city of Valencia surrendered on 1 November. Peris, trying to revive the revolt, was captured after a night of street fighting and executed in March 1522; Xàtiva and Alzira held out until December, and the Majorcan rebels surrendered Palma on 8 March 1523. Hundreds of rebels were executed, and the forced baptisms were upheld, turning Valencia’s Muslims into Moriscos.: Ett uppror av de beväpnade gillena, germanies, i kungariket Valencia mot adeln och Karl I:s kungliga regering, med ett besläktat uppror på Mallorca. År 1519, när pesten drev många adelsmän från staden Valencia, tog gillena över stadens styre genom De trettons råd, och 1520 tvingade de bort den nye vicekungen, Diego Hurtado de Mendoza. Öppet krig bröt ut 1521. Agermanats under Vicent Peris slog vicekungen vid Gandia i juli och tvångsdöpte regionens muslimska bönder, men inom några veckor krossades de av markisen av Los Vélez vid Oriola, och staden Valencia kapitulerade den 1 november. Peris, som försökte återuppliva upproret, tillfångatogs efter en natt av gatustrider och avrättades i mars 1522; Xàtiva och Alzira höll stånd till december, och rebellerna på Mallorca överlämnade Palma den 8 mars 1523. Hundratals rebeller avrättades, och tvångsdopen stod fast, vilket gjorde Valencias muslimer till moriskos.
