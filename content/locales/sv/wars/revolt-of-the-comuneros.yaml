Charles of Habsburg, who had grown up in Flanders, came to Castile in 1517 with Flemish advisers who took its richest offices, and in 1519 he was elected emperor. To pay for the election and his journey to Germany he asked the Cortes, meeting at Santiago and A Coruña in the spring of 1520, for a large subsidy, and got it only by pressure and bribes. He sailed on 20 May, leaving his old tutor, Cardinal Adrian of Utrecht, as regent. Toledo had already risen in April. At Segovia on 30 May a crowd of wool workers killed the city’s deputy who had voted for the tax, and other cities drove out royal officials.: Karl av Habsburg, som hade vuxit upp i Flandern, kom till Kastilien 1517 med flamländska rådgivare som tog de rikaste ämbetena, och 1519 valdes han till kejsare. För att betala valet och resan till Tyskland begärde han av cortes, som sammanträdde i Santiago och A Coruña våren 1520, ett stort bidrag och fick det bara genom påtryckningar och mutor. Han avseglade den 20 maj och lämnade sin gamle lärare, kardinal Adrian av Utrecht, som regent. Toledo hade redan rest sig i april. I Segovia dödade en folkmassa av ullarbetare den 30 maj stadens deputerade som hade röstat för skatten, och andra städer drev ut kungliga ämbetsmän.
In August royal troops sent to seize the artillery at Medina del Campo set fire to the great market town, and the outrage swung opinion behind the rebels. Their Holy Junta, first meeting at Ávila, moved to Tordesillas, where Juan de Padilla’s comunero army had taken charge of Queen Joanna, Charles’s mother, long kept there as unfit to rule. The Junta claimed to govern in her name, but she would sign nothing. As peasants rose against their lords, the great nobles sided with the crown. Charles made the Constable and the Admiral of Castile co-regents, and on 5 December the royalists stormed Tordesillas.: I augusti satte kungliga trupper, som sänts för att beslagta artilleriet i Medina del Campo, eld på den stora marknadsstaden, och upprördheten svängde opinionen till rebellernas fördel. Deras Heliga junta, som först sammanträdde i Ávila, flyttade till Tordesillas, där Juan de Padillas comuneroshär hade tagit hand om drottning Johanna, Karls mor, som länge hållits där som oförmögen att regera. Juntan gjorde anspråk på att styra i hennes namn, men hon ville inte underteckna något. När bönderna reste sig mot sina herrar ställde sig de stora adelsmännen på kronans sida. Karl gjorde Kastiliens konnetabel och amiral till medregenter, och den 5 december stormade rojalisterna Tordesillas.
