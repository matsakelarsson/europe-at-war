The city council led the protests against Charles’s policies. When its leaders were summoned to court, the city rose and took control.: Stadsrådet ledde protesterna mot Karls politik. När dess ledare kallades till hovet reste sig staden och tog kontrollen.
30 May 1520: 30 maj 1520
Wool workers lynched the city’s deputy, Rodrigo de Tordesillas, and two officials. The regent’s attempt to punish the city spread the revolt.: Ullarbetare lynchade stadens deputerade, Rodrigo de Tordesillas, och två ämbetsmän. Regentens försök att straffa staden spred upproret.
Medina del Campo: Medina del Campo
Antonio de Fonseca’s troops met resistance and started a fire that destroyed much of the town and its warehouses, then withdrew without the guns.: Antonio de Fonsecas trupper mötte motstånd och anlade en brand som förstörde stora delar av staden och dess lagerhus och drog sig sedan tillbaka utan kanonerna.
