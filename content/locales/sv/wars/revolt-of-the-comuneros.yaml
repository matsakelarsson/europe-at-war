Revolt of the Comuneros: Comunerosupproret
A rising of the cities of Castile against the government of the young Charles I, the emperor Charles V, his Flemish advisers and the taxes he demanded before leaving for Germany. The rebel towns formed a Holy Junta and tried to rule in the name of his mother, Queen Joanna, but the great nobles rallied to the crown, and the comunero army was crushed at Villalar on 23 April 1521. Toledo held out under María Pacheco into 1522.: Ett uppror av Kastiliens städer mot den unge Karl I:s, kejsar Karl V:s, regering, hans flamländska rådgivare och de skatter han krävde innan han reste till Tyskland. De upproriska städerna bildade en Helig junta och försökte styra i hans mor drottning Johannas namn, men de stora adelsmännen slöt upp bakom kronan, och comuneroshären krossades vid Villalar den 23 april 1521. Toledo höll stånd under María Pacheco in på 1522.
