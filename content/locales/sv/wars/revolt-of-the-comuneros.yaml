The comunidades were the councils that took over the rebel cities. At its height the Holy Junta spoke for fourteen cities, among them Toledo, Segovia, Salamanca, Valladolid, Ávila, León, Zamora, Toro and Madrid; Burgos left it in the autumn of 1520. Andalusia stayed loyal to the crown.: Comunidades var de råd som tog över de upproriska städerna. På sin höjdpunkt företrädde Heliga juntan fjorton städer, bland dem Toledo, Segovia, Salamanca, Valladolid, Ávila, León, Zamora, Toro och Madrid; Burgos lämnade den hösten 1520. Andalusien förblev lojalt mot kronan.
The revolt ran alongside the Revolt of the Brotherhoods in the Kingdom of Valencia, which had different causes. Since the 19th century the comuneros have been remembered as defenders of Castile’s liberties, and 23 April is now the regional day of Castile and León.: Upproret pågick samtidigt med brödraskapens uppror i kungariket Valencia, som hade andra orsaker. Sedan 1800-talet har comuneros ihågkommits som försvarare av Kastiliens friheter, och 23 april är i dag Kastilien och Leóns regiondag.
