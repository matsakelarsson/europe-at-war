The Holy Junta of the Communities first met here and named Juan de Padilla captain-general.: Kommunernas heliga junta sammanträdde först här och utsåg Juan de Padilla till generalkapten.
Tordesillas: Tordesillas
The rebels had held the town and the queen since late August. The royal army stormed it and took Joanna back.: Rebellerna hade hållit staden och drottningen sedan slutet av augusti. Den kungliga hären stormade den och tog tillbaka Johanna.
Padilla, 1520: Padilla 1520
The comuneros regrouped at Valladolid. In the north the warlike Bishop of Zamora, Antonio de Acuña, raised the peasants against their lords around Palencia and then went on to Toledo, where crowds hailed him as archbishop. In February 1521 Padilla stormed and plundered the small town of Torrelobatón, west of Valladolid, but the rebels then hesitated while the Constable brought his army from Burgos to join the Admiral’s. On 23 April, as Padilla tried to fall back on Toro through heavy rain, the royal cavalry caught his army near Villalar, and it broke almost at once.: Comuneros omgrupperade sig i Valladolid. I norr fick den krigiske biskopen av Zamora, Antonio de Acuña, bönderna kring Palencia att resa sig mot sina herrar och drog sedan vidare till Toledo, där folkmassor hyllade honom som ärkebiskop. I februari 1521 stormade och plundrade Padilla den lilla staden Torrelobatón väster om Valladolid, men rebellerna tvekade sedan medan konnetabeln förde sin här från Burgos för att förena den med amiralens. Den 23 april, när Padilla i ihållande regn försökte dra sig tillbaka mot Toro, hann det kungliga rytteriet upp hans här nära Villalar, och den bröts nästan omedelbart.
Padilla, Juan Bravo of Segovia and Francisco Maldonado of Salamanca were beheaded at Villalar the next day, and the revolt collapsed. A French army that invaded Navarre in May, hoping to profit from it, was beaten at Noáin on 30 June. Toledo held out under Padilla’s widow, María Pacheco, until it surrendered on terms in October, and after a last rising on 3 February 1522 she fled to Portugal. Charles returned in July 1522 and on 1 November pardoned all but 293 rebels; Bishop Acuña was executed in 1526. The Castilian cities never again challenged the crown.: Padilla, Juan Bravo från Segovia och Francisco Maldonado från Salamanca halshöggs i Villalar dagen därpå, och upproret föll samman. En fransk armé som invaderade Navarra i maj i hopp om att dra nytta av det besegrades vid Noáin den 30 juni. Toledo höll ut under Padillas änka, María Pacheco, tills staden kapitulerade på villkor i oktober, och efter ett sista uppror den 3 februari 1522 flydde hon till Portugal. Karl återvände i juli 1522 och benådade den 1 november alla utom 293 rebeller; biskop Acuña avrättades 1526. De kastilianska städerna utmanade aldrig mer kronan.
