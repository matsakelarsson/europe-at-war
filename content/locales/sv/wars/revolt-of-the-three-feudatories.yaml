# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
Revolt of the Three Feudatories: De tre feodalherrarnas uppror
? "A civil war in southern and western China between the Kangxi Emperor of the Qing and the three Chinese generals who had conquered the south for the dynasty and ruled it as princes: Wu Sangui in Yunnan and Guizhou, Shang Kexi and his son Shang Zhixin in Guangdong, and Geng Jingzhong in Fujian. When the young emperor accepted their offers to retire in 1673 and ordered their domains abolished, Wu Sangui rose at Kunming in December 1673 and took Hunan and Sichuan within months; Geng Jingzhong in Fujian, Sun Yanling in Guangxi and Wang Fuchen in Shaanxi joined him, and Zheng Jing crossed from Taiwan to the Fujian coast. The rebels never crossed the Yangtze, and the Qing defeated them one at a time: Wang Fuchen and Geng Jingzhong surrendered in 1676 and Shang Zhixin in 1677. Wu Sangui proclaimed himself emperor of Zhou at Hengzhou in March 1678 but died that October. Qing armies, most of them Chinese Green Standard troops, retook Hunan in 1679 and Sichuan and Guizhou in 1680, and in December 1681 Kunming fell and Wu’s grandson Wu Shifan killed himself. The victory left the Kangxi Emperor master of all China except Taiwan, which the Qing took in 1683."
: "Ett inbördeskrig i södra och västra Kina mellan Qingkejsaren Kangxi och de tre kinesiska generaler som hade erövrat södern åt dynastin och styrde den som furstar: Wu Sangui i Yunnan och Guizhou, Shang Kexi och hans son Shang Zhixin i Guangdong samt Geng Jingzhong i Fujian. När den unge kejsaren 1673 antog deras erbjudanden om att dra sig tillbaka och beordrade att deras domäner skulle avskaffas reste sig Wu Sangui i Kunming i december 1673 och tog Hunan och Sichuan inom några månader; Geng Jingzhong i Fujian, Sun Yanling i Guangxi och Wang Fuchen i Shaanxi anslöt sig till honom, och Zheng Jing gick över från Taiwan till Fujians kust. Rebellerna kom aldrig över Yangtze, och Qing besegrade dem en i taget: Wang Fuchen och Geng Jingzhong kapitulerade 1676 och Shang Zhixin 1677. Wu Sangui utropade sig till kejsare av Zhou i Hengzhou i mars 1678 men dog i oktober samma år. Qingarméerna, till största delen kinesiska trupper ur Gröna standaret, återtog Hunan 1679 och Sichuan och Guizhou 1680, och i december 1681 föll Kunming och Wus sonson Wu Shifan tog livet av sig. Segern gjorde Kangxikejsaren till herre över hela Kina utom Taiwan, som Qing tog 1683."
