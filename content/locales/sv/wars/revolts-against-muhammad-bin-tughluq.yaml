# Svenska översättningar av katalogtexten (våg 8); stegtexterna kommer senare.
Revolts against Muhammad bin Tughluq: Upproren mot Muhammad bin Tughluq
The break-up of the Delhi Sultanate’s empire in the south and east under Muhammad bin Tughluq (1325–1351), whose realm at its height reached from the Punjab to Madurai. In 1334–1335 the governor of Ma’bar founded the Madurai Sultanate, and an epidemic forced the sultan’s army back from the Deccan. In 1336 Kapaya Nayaka drove the Delhi governor out of Warangal, and Harihara and Bukka founded the Vijayanagara kingdom on the Tungabhadra; the Hoysalas recovered for a time, and Bengal went its own way from 1338. In 1345–1347 the commanders of the Deccan and Gujarat rose against the sultan’s tax officials, seized Daulatabad and, after defeating his generals, crowned Zafar Khan as Alauddin Bahman Shah, founder of the Bahmani Sultanate, on 3 August 1347.: Sönderfallet av Delhisultanatets välde i söder och öster under Muhammad bin Tughluq (1325–1351), vars rike när det var som störst sträckte sig från Punjab till Madurai. År 1334–1335 grundade guvernören i Ma’bar Maduraisultanatet, och en epidemi tvingade sultanens armé att dra sig tillbaka från Deckan. År 1336 drev Kapaya Nayaka ut Delhis guvernör ur Warangal, och Harihara och Bukka grundade kungariket Vijayanagara vid Tungabhadra; hoysaladynastin återhämtade sig för en tid, och Bengalen gick sin egen väg från 1338. År 1345–1347 reste sig befälhavarna i Deckan och Gujarat mot sultanens skatteuppbördsmän, intog Daulatabad och krönte, sedan de besegrat hans generaler, den 3 augusti 1347 Zafar Khan till Alauddin Bahman Shah, grundare av Bahmanisultanatet.
