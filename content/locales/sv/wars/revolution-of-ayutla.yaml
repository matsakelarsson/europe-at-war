# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
Revolution of Ayutla: Ayutlarevolutionen
? The liberal revolt of 1854–1855 that overthrew Antonio López de Santa Anna for the last time. Recalled by the Conservatives in 1853, Santa Anna had ruled as a dictator with the title His Most Serene Highness, exiled opponents, taxed doors, windows and dogs, and sold the Mesilla valley to the United States (the Gadsden Purchase) to pay his army. On 1 March 1854 Colonel Florencio Villarreal proclaimed the Plan of Ayutla in the village of Ayutla in Guerrero, calling for Santa Anna’s removal and a congress to write a new constitution, with the backing of Juan Álvarez, the old insurgent who dominated Guerrero; on 11 March Ignacio Comonfort, former customs chief of Acapulco, issued a revised version at Acapulco. Santa Anna marched south with a large army in the spring of 1854 but failed to take Acapulco, held by Comonfort in the fort of San Diego, and his troops burned villages on their retreat. The revolt spread through Michoacán, the north under Santiago Vidaurri, and the centre, and in August 1855 Santa Anna left Mexico City and sailed into exile. Álvarez became interim president in October 1855, with Benito Juárez, Melchor Ocampo and Comonfort in his government. Their reforms, the Juárez and Lerdo laws and the Constitution of 1857, led to the Reform War.
: Det liberala upproret 1854–1855 som störtade Antonio López de Santa Anna för sista gången. Santa Anna, som de konservativa hade kallat tillbaka 1853, hade styrt som diktator med titeln Su Alteza Serenísima (”Hans högst upphöjda höghet”), landsförvisat motståndare, beskattat dörrar, fönster och hundar och sålt Mesilladalen till USA (Gadsdenköpet) för att betala sin armé. Den 1 mars 1854 utropade överste Florencio Villarreal Ayutlaplanen i byn Ayutla i Guerrero, med krav på Santa Annas avsättning och en kongress som skulle skriva en ny konstitution, och med stöd av Juan Álvarez, den gamle upprorsledaren som dominerade Guerrero; den 11 mars utfärdade Ignacio Comonfort, tidigare tullchef i Acapulco, en reviderad version i Acapulco. Santa Anna marscherade söderut med en stor armé våren 1854 men lyckades inte inta Acapulco, som Comonfort höll i fortet San Diego, och hans trupper brände byar under återtåget. Upproret spred sig till Michoacán, till norr under Santiago Vidaurri och till landets mitt, och i augusti 1855 lämnade Santa Anna Mexico City och seglade i landsflykt. Álvarez blev tillförordnad president i oktober 1855, med Benito Juárez, Melchor Ocampo och Comonfort i sin regering. Deras reformer, Juárezlagen och Lerdolagen och 1857 års konstitution, ledde till reformkriget.
