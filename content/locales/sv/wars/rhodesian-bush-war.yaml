# Svenska översättningar av katalogtexten (våg 13); stegtexterna kommer senare.
Rhodesian Bush War: Rhodesiska bushkriget
? The war between the white-minority government of Rhodesia and the African nationalist movements that fought for majority rule, known in Zimbabwe as the Second Chimurenga or the liberation war. After Ian Smith’s government declared independence from Britain unilaterally (UDI) on 11 November 1965 to avoid majority rule, the Zimbabwe African National Union (ZANU), with its army ZANLA, and the Zimbabwe African People’s Union (ZAPU), with its army ZIPRA, sent guerrillas from Zambia. The early incursions, at Sinoia in 1966 and Wankie in 1967, were crushed. From December 1972 ZANLA, working with FRELIMO in Mozambique, spread the war through the north-east and, after Mozambique’s independence in 1975, along the whole eastern border, while ZIPRA operated from Zambia and Botswana in the west. Rhodesia answered with conscription, the Fireforce, the Selous Scouts, protected villages and raids on guerrilla camps in Mozambique and Zambia that killed thousands, many of them refugees. ZIPRA shot down two Air Rhodesia airliners. Smith’s internal settlement with Abel Muzorewa produced the unrecognised Zimbabwe Rhodesia in 1979. The Lancaster House Agreement of 21 December 1979 brought a ceasefire, British-run elections that Robert Mugabe’s ZANU won, and the independence of Zimbabwe on 18 April 1980. Some 20,000 people were killed.
: Kriget mellan den vita minoritetsregeringen i Rhodesia och de afrikanska nationalistiska rörelser som kämpade för majoritetsstyre, i Zimbabwe känt som andra Chimurenga eller befrielsekriget. Sedan Ian Smiths regering den 11 november 1965 ensidigt utropat självständighet från Storbritannien (UDI) för att undvika majoritetsstyre, sände Zimbabwe African National Union (ZANU), med sin armé ZANLA, och Zimbabwe African People’s Union (ZAPU), med sin armé ZIPRA, in gerillasoldater från Zambia. De tidiga infiltrationerna, vid Sinoia 1966 och Wankie 1967, slogs ned. Från december 1972 spred ZANLA, i samarbete med Frelimo i Moçambique, kriget över landets nordöstra del och, efter Moçambiques självständighet 1975, längs hela den östra gränsen, medan ZIPRA opererade från Zambia och Botswana i väster. Rhodesia svarade med värnplikt, Fireforce, Selous Scouts, skyddade byar och räder mot gerillaläger i Moçambique och Zambia som dödade tusentals, många av dem flyktingar. ZIPRA sköt ned två passagerarplan från Air Rhodesia. Smiths interna uppgörelse med Abel Muzorewa ledde 1979 till det icke erkända Zimbabwe Rhodesia. Lancaster House-avtalet den 21 december 1979 medförde vapenvila, brittiskledda val som Robert Mugabes ZANU vann, och Zimbabwes självständighet den 18 april 1980. Omkring 20 000 människor dödades.
