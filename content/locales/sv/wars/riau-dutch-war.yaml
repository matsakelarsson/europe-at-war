# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
Riau War: Riaukriget
? A war between the Dutch East India Company (VOC) and the Johor-Riau sultanate, led by its Bugis viceroy (Yang Dipertuan Muda) Raja Haji, with Selangor and Rembau as allies. Riau, on the island of Bintan near today’s Tanjungpinang, had grown into a busy free port that drew trade away from Dutch Malacca. During the Fourth Anglo-Dutch War, in 1782, Raja Haji helped the VOC seize the British ship Betsy and its cargo of opium in Riau’s harbour, but the Company refused him a share of the prize; he made a show of force with a large fleet off Muar, and the governor of Malacca, Pieter Gerardus de Bruijn, pressed for war. In June 1783 a VOC squadron declared war and blockaded Riau. On 6 January 1784 an attempt to land troops failed when the flagship Malakka’s Welvaaren ran aground on the defenders’ stone barriers and blew up, killing its commander, Arnoldus Lemker, and hundreds of men. Selangor and Rembau forces then landed near Malacca, and from February Raja Haji besieged the town, taking its suburbs. On 18 June 1784 a fleet from the Netherlands under Jacob Pieter van Braam, with about 1,400 European soldiers, landed and attacked the besiegers’ camp at Teluk Ketapang; Raja Haji was killed and the siege collapsed. Van Braam took Kuala Selangor and installed a ruler from Siak, then attacked Riau; after the fort on Penyengat fell, Raja Haji’s successor Raja Ali left for Borneo on 31 October 1784. The sultan of Johor had to banish the Bugis leaders and accept a VOC resident and garrison at Riau, but a rising in 1787 drove them out, Sultan Ibrahim of Selangor retook his capital in 1785 and made peace in 1786, and the war hastened the decline of Dutch power in the Strait of Malacca. Raja Haji was buried on Penyengat and is a National Hero of Indonesia.
: Ett krig mellan Nederländska ostindiska kompaniet (VOC) och sultanatet Johor-Riau, som leddes av sin buginesiske vicekung (Yang Dipertuan Muda) Raja Haji och hade Selangor och Rembau som allierade. Riau, på ön Bintan nära dagens Tanjungpinang, hade vuxit till en livlig frihamn som drog handel från det nederländska Malacka. Under fjärde engelsk-holländska kriget, 1782, hjälpte Raja Haji VOC att ta det brittiska fartyget Betsy och dess last av opium i Riaus hamn, men kompaniet vägrade honom en andel av prisen; han gjorde en kraftdemonstration med en stor flotta utanför Muar, och Malackas guvernör, Pieter Gerardus de Bruijn, drev på för krig. I juni 1783 förklarade en VOC-eskader krig och blockerade Riau. Den 6 januari 1784 misslyckades ett försök att landsätta trupper när flaggskeppet Malakka’s Welvaaren gick på grund på försvararnas stenspärrar och sprang i luften, varvid dess befälhavare, Arnoldus Lemker, och hundratals man omkom. Styrkor från Selangor och Rembau landsteg därefter nära Malacka, och från februari belägrade Raja Haji staden och intog dess förstäder. Den 18 juni 1784 landsteg en flotta från Nederländerna under Jacob Pieter van Braam, med omkring 1 400 europeiska soldater, och anföll belägrarnas läger vid Teluk Ketapang; Raja Haji dödades och belägringen bröt samman. Van Braam intog Kuala Selangor och insatte en härskare från Siak och anföll sedan Riau; sedan fästet på Penyengat hade fallit begav sig Raja Hajis efterträdare Raja Ali till Borneo den 31 oktober 1784. Sultanen av Johor måste förvisa de buginesiska ledarna och godta en VOC-resident och en garnison i Riau, men en resning 1787 drev ut dem, sultan Ibrahim av Selangor återtog sin huvudstad 1785 och slöt fred 1786, och kriget påskyndade den nederländska maktens nedgång i Malackasundet. Raja Haji begravdes på Penyengat och är en av Indonesiens nationalhjältar.
