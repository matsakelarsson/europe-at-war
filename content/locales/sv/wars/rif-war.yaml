Pétain: Pétain
A colonial war in northern Morocco in which the Berber tribes of the Rif, led by Muhammad ibn Abd al-Karim al-Khattabi, known as Abd el-Krim, destroyed a Spanish army at Annual in 1921 and set up the Republic of the Rif. Spain, which held northern Morocco as a protectorate, lost about 13,000 soldiers in the disaster of 1921, retook the land around Melilla but could not defeat the Rif, and from 1924 its army dropped mustard gas and other chemical weapons on Rifian villages and markets. In late 1924 it withdrew from the western interior around Chefchaouen. After the Rifians attacked the French zone in April 1925 and came close to Fez, France sent Marshal Pétain with a large army and joined Spain. A Spanish landing at Alhucemas in September 1925 and converging French and Spanish offensives forced Abd el-Krim to surrender to the French on 27 May 1926; he was exiled to Réunion. The last resistance ended in July 1927.: Ett kolonialkrig i norra Marocko där Rifbergens berberstammar, ledda av Muhammad ibn Abd al-Karim al-Khattabi, känd som Abd el-Krim, förintade en spansk armé vid Annual 1921 och upprättade Rifrepubliken. Spanien, som innehade norra Marocko som protektorat, förlorade omkring 13 000 soldater i katastrofen 1921, återtog landet kring Melilla men kunde inte besegra rifierna, och från 1924 släppte dess armé senapsgas och andra kemiska vapen över rifiska byar och marknader. I slutet av 1924 drog den sig tillbaka från det västra inlandet kring Chefchaouen. Sedan rifierna hade anfallit den franska zonen i april 1925 och kommit nära Fès sände Frankrike marskalk Pétain med en stor armé och gick samman med Spanien. En spansk landstigning vid Alhucemas i september 1925 och sammanstrålande franska och spanska offensiver tvingade Abd el-Krim att kapitulera för fransmännen den 27 maj 1926; han förvisades till Réunion. Det sista motståndet upphörde i juli 1927.
