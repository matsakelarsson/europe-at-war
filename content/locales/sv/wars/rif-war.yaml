Northern Morocco had been a Spanish protectorate since 1912, while the rest of the country was a French protectorate; the base map cannot show the protectorates, so the areas in the steps show approximate zones of control. Some accounts date the war from Spain’s campaigns in the Rif in 1920, and fighting against the last Rifian holdouts went on until July 1927.: Norra Marocko hade varit spanskt protektorat sedan 1912, medan resten av landet var franskt protektorat; baskartan kan inte visa protektoraten, så områdena i stegen visar ungefärliga kontrollzoner. Vissa framställningar räknar krigets början från Spaniens fälttåg i Rif 1920, och striderna mot de sista rifiska motståndsfickorna fortsatte till juli 1927.
Spain and France lost tens of thousands of men killed, wounded, missing or sick, Spain about 43,500–63,000 and France 10,000–18,000 by different counts; Rifian losses were about 30,000, some 10,000 of them dead. Civilian deaths are not known. Sources give 26 or 27 May 1926 for Abd el-Krim’s surrender.: Spanien och Frankrike förlorade tiotusentals man i döda, sårade, saknade och sjuka, Spanien omkring 43 500–63 000 och Frankrike 10 000–18 000 enligt olika beräkningar; rifiernas förluster var omkring 30 000, varav omkring 10 000 döda. Antalet civila döda är okänt. Källorna anger 26 eller 27 maj 1926 för Abd el-Krims kapitulation.
