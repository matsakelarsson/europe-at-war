The Spanish retook the country around Melilla but could not defeat the Rif, and from 1924 their army used chemical weapons, among them mustard gas, which aircraft dropped on villages, markets and rivers as well as on fighters. In late 1924 Primo de Rivera withdrew the troops in the west from Chefchaouen to a fortified line nearer the coast, a retreat that cost heavy losses. In April 1925 Abd el-Krim, at the height of his power, attacked the French posts on the Ouergha river, overran many of them and threatened Fez. France then sent Marshal Philippe Pétain with a large army and agreed to act together with Spain.: Spanjorerna återtog området kring Melilla men kunde inte besegra Rif, och från 1924 använde deras armé kemiska vapen, bland annat senapsgas, som flygplan släppte över byar, marknader och floder såväl som över stridande. I slutet av 1924 drog Primo de Rivera tillbaka trupperna i väster från Chefchaouen till en befäst linje närmare kusten, en reträtt som kostade svåra förluster. I april 1925 anföll Abd el-Krim, på höjden av sin makt, de franska posterna vid floden Ouergha, stormade många av dem och hotade Fès. Frankrike sände då marskalk Philippe Pétain med en stor armé och gick med på att agera tillsammans med Spanien.
On 8 September 1925 about 13,000 Spanish troops, supported by the Spanish and French fleets, aircraft and tanks, landed on the beaches west of Alhucemas Bay, in what is considered the first amphibious landing to use tanks and aircraft, and on 2 October they took Ajdir. French forces advanced from the south. Surrounded and short of supplies, Abd el-Krim surrendered to the French on 27 May 1926 and was exiled to the island of Réunion. The last resistance ended in 1927. Many officers who later led the Nationalists in the Spanish Civil War, Francisco Franco among them, made their careers in this war.: Den 8 september 1925 landsteg omkring 13 000 spanska soldater, understödda av den spanska och den franska flottan, flygplan och stridsvagnar, på stränderna väster om Alhucemasbukten, i vad som anses vara den första amfibielandstigningen med stridsvagnar och flygplan, och den 2 oktober intog de Ajdir. Franska styrkor ryckte fram från söder. Omringad och med brist på förnödenheter kapitulerade Abd el-Krim för fransmännen den 27 maj 1926 och förvisades till ön Réunion. Det sista motståndet upphörde 1927. Många officerare som senare ledde nationalisterna i spanska inbördeskriget, bland dem Francisco Franco, gjorde karriär i detta krig.
