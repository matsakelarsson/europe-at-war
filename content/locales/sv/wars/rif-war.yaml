Rifian success: Rifiska framgångar
In 1920–21 General Manuel Fernández Silvestre, the commander at Melilla, pushed west into the Rif with a chain of small, badly supplied outposts, aiming for the bay of Alhucemas. The tribes of the central Rif united under Abd el-Krim, a former official of the Spanish administration and a leader of the Aith Waryaghar. On 1 June 1921 they overran a new outpost on Mount Abarrán, and in July they besieged Igueriben, which fell on 21 July. The next day, with water and ammunition running out, Silvestre ordered the main camp at Annual to retreat, and the retreat turned into a rout in which he was killed.: År 1920–21 trängde general Manuel Fernández Silvestre, befälhavaren i Melilla, västerut in i Rif med en kedja av små, dåligt försörjda utposter, med sikte på Alhucemasbukten. Stammarna i centrala Rif enade sig under Abd el-Krim, en tidigare tjänsteman i den spanska förvaltningen och en ledare för Aith Waryaghar. Den 1 juni 1921 stormade de en ny utpost på berget Abarrán, och i juli belägrade de Igueriben, som föll den 21 juli. Dagen därpå, när vatten och ammunition höll på att ta slut, beordrade Silvestre huvudlägret i Annual att retirera, och reträtten övergick i en panikartad flykt där han dödades.
The whole Spanish line east of Annual collapsed as outposts fell one after another and local tribes rose. Survivors gathered at Monte Arruit, 35 km south of Melilla, which surrendered on 9 August; most of its garrison was then massacred. By the official count about 13,000 soldiers of the Spanish army died. Melilla itself was almost undefended, but the Rifians did not attack it, and reinforcements from the Spanish Legion arrived by sea. Abd el-Krim proclaimed the Republic of the Rif in September. In Spain the disaster and the inquiry into it shook the monarchy and helped bring about General Miguel Primo de Rivera’s coup of 1923.: Hela den spanska linjen öster om Annual föll samman när utpost efter utpost föll och lokala stammar reste sig. Överlevande samlades i Monte Arruit, 35 km söder om Melilla, som kapitulerade den 9 augusti; större delen av dess garnison massakrerades därefter. Enligt den officiella siffran dog omkring 13 000 soldater i den spanska armén. Själva Melilla var nästan oförsvarat, men rifierna anföll inte, och förstärkningar från Spanska främlingslegionen anlände sjövägen. Abd el-Krim utropade Rifrepubliken i september. I Spanien skakade katastrofen och utredningen av den monarkin och bidrog till general Miguel Primo de Riveras statskupp 1923.
