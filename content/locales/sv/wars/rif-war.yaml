Rif War: Rifkriget
A colonial war in northern Morocco in which the Berber tribes of the Rif, led by Abd el-Krim, destroyed a Spanish army at Annual in 1921 and set up the Republic of the Rif. After the Rifians attacked the French zone in 1925, France joined Spain; a Spanish landing at Alhucemas and a French offensive from the south forced Abd el-Krim to surrender in May 1926.: Ett kolonialkrig i norra Marocko där Rifbergens berberstammar under Abd el-Krim förintade en spansk armé vid Annual 1921 och grundade Rifrepubliken. Sedan rifierna 1925 anfallit den franska zonen gick Frankrike in på Spaniens sida; en spansk landstigning vid Alhucemas och en fransk offensiv från söder tvingade Abd el-Krim att kapitulera i maj 1926.
