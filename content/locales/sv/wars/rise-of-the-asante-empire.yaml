# Svenska översättningar av katalogtexten (våg 13); stegtexterna kommer senare.
Rise of the Asante Empire: Ashantirikets uppkomst
? The wars by which Asante grew, in half a century, from a coalition of small Akan states round Kumasi into the strongest power of the Gold Coast forest. In the 1690s Osei Tutu of Kwaaman led the northern tributaries of Denkyira, the great gold- and slave-trading kingdom of the Ofin and Oda valleys, against its king Ntim Gyakari, and many Denkyira towns went over to him. At Feyiase in 1701 Ntim Gyakari was defeated and killed and his capital Abankeseso sacked; Osei Tutu became the first Asantehene, and the Golden Stool, which tradition says the priest Okomfo Anokye called down from the sky, became the symbol of the union. Asante then subdued Denkyira’s old subjects, Twifo, Wassa and Aowin, until Osei Tutu was killed fighting Akyem on the Pra in 1717 and an Aowin army sacked Kumasi in 1718. His successor Opoku Ware conquered Bono (1723), forced Gyaman, western Gonja and Banda to pay tribute, defeated Akyem in 1742 and took over the rents the Europeans paid at Accra, and in 1744–1745 sent armies into eastern Gonja and Dagbon. By his death about 1750 Asante ruled, or took tribute from, most of the forest and southern savanna of today’s Ghana except the Fante coast. Its wars yielded gold, tribute and captives, many of whom were sold to the Dutch, English and Danish forts.
: De krig genom vilka Ashanti på ett halvsekel växte från en koalition av små akanstater kring Kumasi till den starkaste makten i Guldkustens skogsland. På 1690-talet ledde Osei Tutu från Kwaaman de nordliga skattskyldiga staterna under Denkyira, det stora guld- och slavhandlande kungariket i Ofins och Odas dalar, mot dess kung Ntim Gyakari, och många denkyiriska städer gick över till honom. Vid Feyiase 1701 besegrades och dödades Ntim Gyakari och hans huvudstad Abankeseso plundrades; Osei Tutu blev den förste asantehene, och Gyllene stolen, som enligt traditionen kallades ned från himlen av prästen Okomfo Anokye, blev förbundets symbol. Ashanti underkuvade därefter Denkyiras forna undersåtar Twifo, Wassa och Aowin, tills Osei Tutu stupade i strid mot Akyem vid Pra 1717 och en armé från Aowin plundrade Kumasi 1718. Hans efterträdare Opoku Ware erövrade Bono (1723), tvingade Gyaman, västra Gonja och Banda att betala tribut, besegrade Akyem 1742 och tog över de avgifter som européerna betalade i Accra, och 1744–1745 sände han arméer in i östra Gonja och Dagbon. Vid hans död omkring 1750 härskade Ashanti över, eller tog tribut av, större delen av skogslandet och den södra savannen i dagens Ghana, utom Fantekusten. Krigen gav guld, tribut och fångar, av vilka många såldes till de nederländska, engelska och danska forten.
