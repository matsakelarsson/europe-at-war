# Svenska översättningar av katalogtexten (våg 12); stegtexterna kommer senare.
Rise of the Bamana Empire of Ségou: Framväxten av Bambarariket i Ségou
? "The wars by which Mamari Coulibaly, known as Biton, made the Bamana (Bambara) kingdom of Ségou on the middle Niger the strongest state between the Senegal and the Niger bend. About 1712 he was chosen leader of the ton, the association of young men of Ségou, and turned it into a standing army: the tonjon, warriors who were in principle captives of the ton but in practice formed a military class, reinforced with runaway slaves and men taken in war or given as tribute. Biton fortified Ségou, kept a fleet of war canoes on the Niger and paid his men from the booty and tribute of yearly campaigns. His greatest danger came from the south, when Famagan Watara of the Kong Empire marched up from the Black Volta, besieged Ségou for about nine months and was driven off with the help of a Fulbe relief force; the sources date this invasion about 1739, and some give 1725. Biton fought a long war with the Massassi Coulibaly of Kaarta to the north-west, capturing their king Foulakoro outside Mourdiah about 1754 (he died in captivity), and imposed tribute on the Fulbe of Massina, the towns of the Marka and Somono and the country around Djenné and Bamako; he took Timbuktu, but held it only briefly. War captives were the main product of these campaigns: some were enrolled in the army or settled on the king’s farms, and many were sold north into the Saharan trade and west towards the Atlantic. After Biton’s death in 1755 his sons were killed or deposed by the tonjon, and after a decade of disorder one of the tonjon’s own commanders, Ngolo Diarra, took the throne in 1766 and founded the dynasty that ruled Ségou until Umar Tall took it in 1861."
: "De krig genom vilka Mamari Coulibaly, känd som Biton, gjorde bamanafolkets (bambarafolkets) kungarike Ségou vid mellersta Niger till den starkaste staten mellan Senegal och Nigerkröken. Omkring 1712 valdes han till ledare för ton, de unga männens förening i Ségou, och gjorde den till en stående armé: tonjon, krigare som i princip var tons fångar men i praktiken utgjorde en krigarklass, förstärkt med förrymda slavar och män som tagits i krig eller getts som tribut. Biton befäste Ségou, höll en flotta av krigskanoter på Niger och avlönade sina män med byte och tribut från årliga fälttåg. Den största faran kom från söder, när Famagan Watara från Kongriket marscherade upp från Svarta Volta, belägrade Ségou i omkring nio månader och drevs bort med hjälp av en undsättningsstyrka av fulbe; källorna daterar denna invasion till omkring 1739, och några anger 1725. Biton förde ett långt krig mot Massassi Coulibaly i Kaarta i nordväst och tillfångatog deras kung Foulakoro utanför Mourdiah omkring 1754 (han dog i fångenskap), och han ålade fulbe i Massina, markafolkets och somonofolkets städer och landet kring Djenné och Bamako att betala tribut; han intog Timbuktu men höll staden bara en kort tid. Krigsfångar var den främsta avkastningen av dessa fälttåg: en del togs in i armén eller sattes att arbeta på kungens gårdar, och många såldes norrut in i saharahandeln och västerut mot Atlanten. Efter Bitons död 1755 dödades eller avsattes hans söner av tonjon, och efter ett årtionde av oordning besteg en av tonjons egna befälhavare, Ngolo Diarra, tronen 1766 och grundade den dynasti som styrde Ségou tills Umar Tall intog staden 1861."
