# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
Rogue River Wars: Rogue River-krigen
? The war of 1855–1856 in south-western Oregon between the United States Army, Oregon volunteers and miners’ militias and the peoples of the Rogue River valley and the coast, the Takelma, the Upland Takelma or Latgawa, the Shasta, the Tututni and their neighbours, whom American sources grouped as the Rogue River Indians. Gold strikes near Jacksonville from 1851 brought thousands of miners and settlers onto their land, destroying the fish runs, game and oak groves they lived on. After fighting in 1853, including the Battle of Evans Creek, the Takelma leaders Apserkahar (Joe), Toquahear (Sam) and Anachaharah (Jim) signed the Treaty of Table Rock, which left them a small reservation beside the army’s Fort Lane. On 8 October 1855 volunteers under James Lupton attacked a Takelma camp at the mouth of Little Butte Creek and killed about two dozen people, most of them women, children and old men; in reply Takelma fighters killed about 27 settlers along the Rogue from Gold Hill to Galice Creek. On 31 October and 1 November 1855 some 200 Native fighters held off more than 300 soldiers and volunteers at Hungry Hill (Grave Creek Hills). On 22 February 1856 Tututni and other coastal peoples killed about 30 people near the mouth of the Rogue, among them the Indian agent Ben Wright, and besieged the survivors. At Big Bend on 27–28 May 1856, fighters under Tecumtum (Chief John) attacked Captain Andrew Jackson Smith’s company, which had come to receive their surrender, until another army force relieved it; within weeks most bands surrendered. About 1,400 people were removed to the new Coast Reservation (Siletz) and some 325 to 400 from Table Rock to the Grand Ronde Reservation, some marched overland and some taken by sea, and many died in the first years there.
: Kriget 1855–1856 i sydvästra Oregon mellan USA:s armé, frivilliga från Oregon och gruvarbetarmiliser å ena sidan och folken i Rogue Rivers dal och vid kusten å den andra – takelma, upland-takelma eller latgawa, shasta, tututni och deras grannar – som amerikanska källor sammanförde under namnet Rogue River Indians. Guldfynd nära Jacksonville från 1851 förde tusentals gruvarbetare och nybyggare in på deras land och förstörde de fiskvandringar, det vilt och de eklundar som de levde av. Efter strider 1853, bland dem slaget vid Evans Creek, undertecknade takelmaledarna Apserkahar (Joe), Toquahear (Sam) och Anachaharah (Jim) fördraget i Table Rock, som lämnade dem ett litet reservat intill arméns Fort Lane. Den 8 oktober 1855 anföll frivilliga under James Lupton ett takelmaläger vid Little Butte Creeks mynning och dödade omkring två dussin människor, de flesta av dem kvinnor, barn och gamla män; som svar dödade takelmakrigare omkring 27 nybyggare längs Rogue River från Gold Hill till Galice Creek. Den 31 oktober och 1 november 1855 höll omkring 200 ursprungsamerikanska krigare stånd mot mer än 300 soldater och frivilliga vid Hungry Hill (Grave Creek Hills). Den 22 februari 1856 dödade tututni och andra kustfolk omkring 30 människor nära Rogue Rivers mynning, bland dem indianagenten Ben Wright, och belägrade de överlevande. Vid Big Bend den 27–28 maj 1856 anföll krigare under Tecumtum (Chief John) kapten Andrew Jackson Smiths kompani, som hade kommit för att ta emot deras kapitulation, tills en annan arméstyrka undsatte det; inom några veckor gav de flesta grupperna upp. Omkring 1 400 människor förflyttades till det nya Kustreservatet (Siletz) och omkring 325 till 400 från Table Rock till Grand Ronde-reservatet, en del till fots över land och en del sjövägen, och många dog under de första åren där.
