# Svenska översättningar av katalogtexten (våg 8); stegtexterna kommer senare.
Rohilla War: Rohillakriget
? A war in which Shuja-ud-Daula, Nawab of Awadh, with a brigade of East India Company troops, conquered Rohilkhand, the land east of the upper Ganges ruled by Afghan Rohilla chiefs. In 1772 the Rohilla regent Hafiz Rahmat Khan had promised Shuja 40 lakh rupees for help against a Maratha invasion; when the Marathas withdrew in 1773 the money was not paid. By the Treaty of Benares (September 1773) the Governor of Bengal, Warren Hastings, agreed to lend Company troops for the conquest in return for a subsidy. On 23 April 1774 the Company brigade under Colonel Alexander Champion defeated the Rohillas at Miranpur Katra, where Hafiz Rahmat Khan was killed. Awadh annexed Rohilkhand, and many Rohillas were driven across the Ganges or left the country. Faizullah Khan, holding out in the hills at Lal Dang, kept the small state of Rampur by the Treaty of Lal Dang of 7 October 1774. Reports of plunder and cruelty by Awadh’s troops made the war a charge against Hastings in his impeachment (1787–1795), at which he was acquitted.
: Ett krig där Shuja-ud-Daula, nawab av Awadh, med en brigad ur Brittiska ostindiska kompaniets trupper erövrade Rohilkhand, landet öster om övre Ganges som styrdes av afghanska rohillahövdingar. År 1772 hade rohillaregenten Hafiz Rahmat Khan lovat Shuja 40 lakh rupier för hjälp mot en marathainvasion; när maratherna drog sig tillbaka 1773 betalades pengarna inte ut. Genom fördraget i Benares (september 1773) gick Bengalens guvernör, Warren Hastings, med på att låna ut kompaniets trupper till erövringen mot ett subsidium. Den 23 april 1774 besegrade kompaniets brigad under överste Alexander Champion rohillorna vid Miranpur Katra, där Hafiz Rahmat Khan dödades. Awadh annekterade Rohilkhand, och många rohillor drevs över Ganges eller lämnade landet. Faizullah Khan, som höll stånd i bergen vid Lal Dang, behöll den lilla staten Rampur genom fördraget i Lal Dang den 7 oktober 1774. Rapporterna om plundring och grymheter från Awadhs trupper gjorde kriget till en av anklagelsepunkterna mot Hastings i riksrättsprocessen mot honom (1787–1795), där han frikändes.
