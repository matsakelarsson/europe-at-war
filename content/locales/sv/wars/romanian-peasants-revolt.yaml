Romanian Peasants’ Revolt of 1907: Rumänska bondeupproret 1907
A rising of Romanian peasants against the great landowners and the leaseholders (arendași) who sub-let their estates on harsh terms, which began in northern Moldavia in February 1907, at first directed largely against Jewish leaseholders, and in March spread south through Wallachia to Oltenia. The Liberal government of Dimitrie Sturdza mobilised 140,000 soldiers and crushed it by early April; the official count was about 420 dead, while a figure of some 10,000 peasants killed, widely accepted at the time, has never been proven.: Ett uppror av rumänska bönder mot storgodsägarna och de arrendatorer (arendași) som hyrde ut deras gods i andra hand på hårda villkor. Det började i norra Moldavien i februari 1907, till en början främst riktat mot judiska arrendatorer, och spred sig i mars söderut genom Valakiet till Oltenien. Dimitrie Sturdzas liberala regering mobiliserade 140 000 soldater och krossade upproret i början av april; enligt den officiella siffran dog omkring 420 personer, medan uppgiften om omkring 10 000 dödade bönder, som var allmänt accepterad på sin tid, aldrig har bevisats.
