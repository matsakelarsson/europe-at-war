Romania still used the Julian calendar in 1907; Romanian accounts date the start of the revolt, at Flămânzești, to 8 February. The dates here are New Style.: Rumänien använde fortfarande den julianska kalendern 1907; rumänska framställningar daterar upprorets början, i Flămânzești, till den 8 februari. Datumen här anges enligt nya stilen.
Land reform followed only after the First World War.: En jordreform genomfördes först efter första världskriget.
