Romanian Revolution: Rumänska revolutionen
The violent overthrow of Nicolae Ceaușescu’s communist dictatorship in December 1989, after protests that began in Timișoara on 16 December spread to Bucharest, where the army turned against the regime on 22 December. Ceaușescu and his wife Elena fled, were captured, tried by a military tribunal and shot on 25 December; most of the 1,104 people killed died in confused fighting after the National Salvation Front had taken power.: Det våldsamma störtandet av Nicolae Ceaușescus kommunistiska diktatur i december 1989, efter protester som började i Timișoara den 16 december och spred sig till Bukarest, där armén vände sig mot regimen den 22 december. Ceaușescu och hans hustru Elena flydde, greps, dömdes av en militärdomstol och sköts den 25 december; de flesta av de 1 104 dödade omkom i förvirrade strider sedan Nationella räddningsfronten tagit makten.
Ceaușescu regime (Securitate, militia and, until 22 December, the army): Ceaușescuregimen (Securitate, milisen och, fram till den 22 december, armén)
