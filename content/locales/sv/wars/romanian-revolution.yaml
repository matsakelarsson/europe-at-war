15–16 December 1989: 15–16 december 1989
Parishioners formed a human chain around the pastor’s home; the vigil grew into the first protest of the revolution.: Församlingsmedlemmar bildade en mänsklig kedja runt prästens hem; vakan växte till revolutionens första protest.
Opera Square: Operatorget
Speakers on the opera house balcony proclaimed Timișoara free, as tens of thousands of strikers filled the square.: Talare på operahusets balkong förklarade Timișoara fritt medan tiotusentals strejkande fyllde torget.
18–19 December 1989: 18–19 december 1989
The bodies of Timișoara’s dead were taken in secret to a crematorium in the capital and the ashes scattered.: Kropparna efter Timișoaras döda fördes i hemlighet till ett krematorium i huvudstaden och askan ströddes ut.
Back from Iran, Ceaușescu called a mass rally outside the party’s Central Committee building in Bucharest on 21 December. Minutes into his speech, broadcast live, the crowd began to boo and jeer, and he stopped, visibly stunned. That evening protesters in University Square were shot down by security forces and the army. On the morning of 22 December the defence minister, Vasile Milea, was found shot, officially a suicide, and the army went over to the crowds, which stormed the building. Nicolae and Elena Ceaușescu fled from its roof by helicopter.: Tillbaka från Iran sammankallade Ceaușescu ett massmöte utanför partiets centralkommittébyggnad i Bukarest den 21 december. Några minuter in i hans tal, som sändes direkt, började folkmassan bua och håna, och han tystnade, synbart chockad. Samma kväll sköts demonstranter på Universitetstorget ned av säkerhetsstyrkorna och armén. På morgonen den 22 december hittades försvarsministern Vasile Milea skjuten, officiellt ett självmord, och armén gick över till folkmassorna, som stormade byggnaden. Nicolae och Elena Ceaușescu flydde från dess tak med helikopter.
A group of former party officials led by Ion Iliescu appeared on television as the National Salvation Front and took power. For several days shooting went on in Bucharest, Sibiu and other cities, blamed on Securitate “terrorists”, and soldiers, militia and armed civilians often fired on each other; most of the 1,104 dead were killed in these days. The Ceaușescus were caught near Târgoviște, tried there by a military tribunal on 25 December and shot immediately. The shooting stopped on 27 December.: En grupp tidigare partifunktionärer ledda av Ion Iliescu framträdde i tv som Nationella räddningsfronten och tog makten. Under flera dagar fortsatte skottlossningen i Bukarest, Sibiu och andra städer, som skylldes på Securitates ”terrorister”, och soldater, milis och beväpnade civila sköt ofta mot varandra; de flesta av de 1 104 döda dödades under dessa dagar. Makarna Ceaușescu greps nära Târgoviște, dömdes där av en militärdomstol den 25 december och sköts omedelbart. Skottlossningen upphörde den 27 december.
