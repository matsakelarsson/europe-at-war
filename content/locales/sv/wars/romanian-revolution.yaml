Regime success: Regimens framgångar
By 1989 Romanians lived with food and fuel rationing, imposed by Ceaușescu to pay off the foreign debt, and under close watch by the Securitate, the secret police, while communist rule was collapsing elsewhere in Eastern Europe. In Timișoara, members of the Hungarian Reformed congregation gathered to stop the authorities evicting their pastor, László Tőkés, a critic of the regime. On 16 December the crowd grew, Romanians joined the Hungarians, and the protest turned into a march against Ceaușescu.: År 1989 levde rumänerna med ransonering av livsmedel och bränsle, som Ceaușescu infört för att betala av utlandsskulden, och under noggrann övervakning av Securitate, den hemliga polisen, medan det kommunistiska styret föll samman på andra håll i Östeuropa. I Timișoara samlades medlemmar av den ungerska reformerta församlingen för att hindra myndigheterna från att vräka sin präst, László Tőkés, en kritiker av regimen. Den 16 december växte folkmassan, rumäner anslöt sig till ungrarna, och protesten övergick i en marsch mot Ceaușescu.
On 17 December the army, the Securitate and the militia opened fire on the crowds in the city centre, killing dozens of people. The bodies of more than 40 victims were secretly taken to Bucharest and cremated to hide what had happened. Ceaușescu left for a visit to Iran the next day. In Timișoara the workers went on strike, and on 20 December some 100,000 people filled Opera Square, the army withdrew to its barracks, and protesters declared the first city free of communist rule.: Den 17 december öppnade armén, Securitate och milisen eld mot folkmassorna i stadens centrum och dödade tiotals människor. Kropparna efter mer än 40 offer fördes i hemlighet till Bukarest och kremerades för att dölja vad som hänt. Ceaușescu reste dagen därpå på besök till Iran. I Timișoara gick arbetarna i strejk, och den 20 december fylldes Operatorget av omkring 100 000 människor, armén drog sig tillbaka till sina kaserner, och demonstranterna förklarade staden som den första fri från kommunistiskt styre.
