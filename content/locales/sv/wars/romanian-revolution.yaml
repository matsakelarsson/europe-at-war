Who fired on the crowds and the army after 22 December, the so-called terrorists, has never been fully established. Many deaths were caused by soldiers, militiamen and armed civilians firing on each other in confusion, and whether the revolution was a popular uprising or was taken over by a group within the party and army is still debated in Romania. Ion Iliescu and others were indicted in 2019 for crimes against humanity over the events after 22 December.: Vilka som sköt mot folkmassorna och armén efter den 22 december, de så kallade terroristerna, har aldrig helt klarlagts. Många dödsfall orsakades av soldater, milismän och beväpnade civila som i förvirringen sköt mot varandra, och huruvida revolutionen var ett folkuppror eller togs över av en grupp inom partiet och armén diskuteras fortfarande i Rumänien. Ion Iliescu och andra åtalades 2019 för brott mot mänskligheten för händelserna efter den 22 december.
Official figures give 1,104 dead, 162 of them in the protests up to 22 December and 942 afterwards, and some 3,350 wounded.: Enligt officiella siffror dog 1 104 personer, varav 162 under protesterna fram till den 22 december och 942 därefter, och omkring 3 350 skadades.
