Rough Wooing: Det hårdhänta frieriet
The war in which Henry VIII and then the Duke of Somerset tried to force Scotland to marry its infant queen, Mary, to the English heir, Edward, and break Scotland’s alliance with France. English armies burned Edinburgh in 1544 and won at Pinkie in 1547, but the Scots called in the French, sent Mary to France to marry the Dauphin, and wore down the English garrisons until England withdrew in 1550.: Kriget i vilket Henrik VIII och sedan hertigen av Somerset försökte tvinga Skottland att gifta bort sin späda drottning Maria med den engelske tronarvingen Edvard och bryta Skottlands förbund med Frankrike. Engelska arméer brände Edinburgh 1544 och segrade vid Pinkie 1547, men skottarna kallade in fransmännen, skickade Maria till Frankrike för att gifta sig med dauphinen och nötte ned de engelska garnisonerna tills England drog sig tillbaka 1550.
