Also called the Eight Years’ War. The name “Rough Wooing” is usually traced to a remark attributed to the Earl of Huntly, who is said to have disliked not the marriage but the manner of the wooing.: Kallas även åttaårskriget. Namnet ”Rough Wooing” (det hårdhänta frieriet) brukar härledas till en kommentar som tillskrivs earlen av Huntly, som sägs ha ogillat inte äktenskapet utan sättet att fria.
Dates are Julian (Old Style), as used in both countries at the time. Some Scots, especially Protestants, sided with England, and some English borderers changed sides as raiding offered.: Datumen anges enligt den julianska kalendern (gamla stilen), som då användes i båda länderna. Vissa skottar, särskilt protestanter, tog Englands parti, och vissa engelska gränsbor bytte sida när plundringen lockade.
James V of Scotland died in December 1542, weeks after his army was routed by an English force at Solway Moss, leaving a daughter a few days old, Mary, as queen. Henry VIII wanted her as a bride for his son Edward, and in July 1543 the Treaty of Greenwich promised the marriage. But the party around Cardinal David Beaton, which favoured France and the old Church, gained the upper hand, and in December the Scottish Parliament rejected the treaty and renewed the alliance with France. Henry answered with force. In May 1544 an English army under the Earl of Hertford landed at Leith, sacked the port and burned Edinburgh.: Jakob V av Skottland dog i december 1542, några veckor efter att hans armé slagits på flykten av en engelsk styrka vid Solway Moss, och efterlämnade en några dagar gammal dotter, Maria, som drottning. Henrik VIII ville ha henne som brud åt sin son Edvard, och i juli 1543 utlovades giftermålet i Greenwichfördraget. Men partiet kring kardinal David Beaton, som gynnade Frankrike och den gamla kyrkan, fick övertaget, och i december förkastade det skotska parlamentet fördraget och förnyade förbundet med Frankrike. Henrik svarade med våld. I maj 1544 landsteg en engelsk armé under earlen av Hertford i Leith, plundrade hamnen och brände Edinburgh.
Raids across the border went on through the year, while Henry himself took Boulogne. On 27 February 1545 a Scottish army under the Earl of Angus routed an English raiding force at Ancrum Moor, and its commander, Sir Ralph Eure, was killed. That September Hertford came back and laid waste to the Borders, burning abbeys, towns and villages. In May 1546 Protestant conspirators murdered Cardinal Beaton in St Andrews Castle and held it, hoping for English help, until a French fleet forced its surrender in July 1547. Among the prisoners sent to the French galleys was the preacher John Knox.: Räderna över gränsen fortsatte under året, medan Henrik själv intog Boulogne. Den 27 februari 1545 slog en skotsk armé under earlen av Angus en engelsk plundringsstyrka på flykten vid Ancrum Moor, och dess befälhavare, sir Ralph Eure, dödades. I september samma år kom Hertford tillbaka och ödelade gränsområdena och brände kloster, städer och byar. I maj 1546 mördade protestantiska sammansvurna kardinal Beaton i St Andrews slott och höll det, i hopp om engelsk hjälp, tills en fransk flotta tvingade det att kapitulera i juli 1547. Bland fångarna som skickades till de franska galärerna fanns predikanten John Knox.
