Henry VIII died in January 1547, and Hertford, now Duke of Somerset and Protector for the nine-year-old Edward VI, invaded Scotland that September with about 16,000 men and a fleet. On 10 September he met the larger Scottish army of the regent, the Earl of Arran, at Pinkie near Musselburgh. The Scots crossed the Esk to attack, came under fire from the English ships and guns, and broke under cavalry charges; thousands were killed in the pursuit, and the Scots remembered the day as Black Saturday. Somerset did not march on Stirling, where Mary was kept, but planted garrisons, at Haddington, Broughty Castle on the Tay, Lauder and elsewhere, to hold the Lowlands down.: Henrik VIII dog i januari 1547, och Hertford, nu hertig av Somerset och lordprotektor för den nioårige Edvard VI, invaderade Skottland i september samma år med omkring 16 000 man och en flotta. Den 10 september mötte han regentens, earlen av Arrans, större skotska armé vid Pinkie nära Musselburgh. Skottarna gick över Esk för att anfalla, hamnade under eld från de engelska fartygen och kanonerna och bröts av kavallerianfall; tusentals dödades under förföljandet, och skottarna mindes dagen som ”svarta lördagen”. Somerset marscherade inte mot Stirling, där Maria hölls, utan förlade garnisoner, i Haddington, Broughty Castle vid Tay, Lauder och på andra platser, för att hålla Lowlands i schack.
The Scots turned to France. A French army landed at Leith in June 1548, and on 7 July, by the Treaty of Haddington, signed in the camp besieging the English-held town, the Scots agreed that Mary would marry the Dauphin Francis. She sailed from Dumbarton in August and grew up at the French court. Short of supplies and wasted by disease, the English abandoned Haddington in September 1549. Henry II of France attacked Boulogne, and by the Treaty of Boulogne in March 1550 England returned it to France and withdrew from Scotland; the Treaty of Norham restored the border in 1551. The war had driven Scotland towards France, not England.: Skottarna vände sig till Frankrike. En fransk armé landsteg i Leith i juni 1548, och den 7 juli gick skottarna genom Haddingtonfördraget, undertecknat i lägret som belägrade den engelskhållna staden, med på att Maria skulle gifta sig med dauphinen Frans. Hon avseglade från Dumbarton i augusti och växte upp vid det franska hovet. Med brist på förnödenheter och härjade av sjukdomar övergav engelsmännen Haddington i september 1549. Henrik II av Frankrike anföll Boulogne, och genom fördraget i Boulogne i mars 1550 lämnade England tillbaka staden till Frankrike och drog sig tillbaka från Skottland; fördraget i Norham återställde gränsen 1551. Kriget hade drivit Skottland mot Frankrike, inte mot England.
