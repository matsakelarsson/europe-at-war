Rus’–Byzantine War of 1043: Kriget mellan Rus och Bysans 1043
The last Rus’ attack on Constantinople, sent by Yaroslav the Wise of Kiev under his eldest son, Vladimir of Novgorod, after a quarrel in the city in which, according to one account, a Rus’ merchant was killed. The Emperor Constantine IX’s fleet met the Rus’ boats at the entrance to the Bosporus and destroyed many with Greek fire, and a storm wrecked more. Some 6,000 men who were cast ashore and tried to march home under Vyshata were caught near Varna, and 800 of them were blinded. Peace was restored about 1046 and sealed by the marriage of Yaroslav’s son Vsevolod to a Byzantine princess of Constantine IX’s family; their son was Vladimir Monomakh.: Det sista anfallet från Rus mot Konstantinopel, sänt av Jaroslav den vise av Kiev under hans äldste son Vladimir av Novgorod efter ett gräl i staden där, enligt en berättelse, en köpman från Rus dödades. Kejsar Konstantin IX:s flotta mötte Rus båtar vid inloppet till Bosporen och förstörde många med grekisk eld, och en storm förliste fler. Omkring 6 000 man som kastats i land och försökte marschera hem under Vysjata infångades nära Varna, och 800 av dem bländades. Freden återställdes omkring 1046 och beseglades genom att Jaroslavs son Vsevolod gifte sig med en bysantinsk prinsessa ur Konstantin IX:s familj; deras son var Vladimir Monomach.
