Michael Psellos, who watched the sea battle with the emperor, credits the Byzantine fleet; the Rus’ chronicles blame a storm. The causes of the war are disputed, and some historians link it to a Rus’ attack on Cherson in Crimea the following year.: Michael Psellos, som bevittnade sjöslaget tillsammans med kejsaren, tillskriver den bysantinska flottan segern; de ryska krönikorna skyller på en storm. Krigets orsaker är omstridda, och vissa historiker sätter det i samband med ett anfall från Rus mot Cherson på Krim året därpå.
