Rus’–Byzantine War of 941: Kriget mellan Rus och Bysans 941
A raid on Constantinople by the fleet of Prince Igor of Kiev, which was burned with Greek fire at the mouth of the Bosporus in June 941. The survivors plundered the Asian coast for months before their last boats were destroyed off Thrace. A second expedition in 944 was bought off, and a treaty restored trade between Kiev and the empire on stricter terms.: Ett anfall mot Konstantinopel av furst Igor av Kievs flotta, som brändes med grekisk eld vid Bosporens mynning i juni 941. De överlevande plundrade den asiatiska kusten i månader innan deras sista båtar förstördes utanför Thrakien. En andra expedition 944 köptes av, och ett fördrag återupprättade handeln mellan Kiev och riket på strängare villkor.
