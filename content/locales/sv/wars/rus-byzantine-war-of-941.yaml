The main accounts are the Byzantine chronicle of Theophanes Continuatus, Liudprand of Cremona, whose stepfather saw the Rus’ prisoners executed in Constantinople, and the Rus’ Primary Chronicle, compiled about 1113, which preserves the text of the treaty. Their figures for the Rus’ fleet, from about 1,000 ships (Liudprand) to 10,000, are far too high to trust.: Huvudkällorna är den bysantinska krönikan Theophanes Continuatus, Liudprand av Cremona, vars styvfar såg fångarna från Rus avrättas i Konstantinopel, och Nestorskrönikan, sammanställd omkring 1113, som bevarar fördragets text. Deras siffror för flottan från Rus, från omkring 1 000 skepp (Liudprand) till 10 000, är alldeles för höga för att vara trovärdiga.
The treaty is dated 944 or 945. Hieron was a customs post at the Black Sea entrance of the Bosporus, near today’s Anadolu Kavağı.: Fördraget dateras till 944 eller 945. Hieron var en tullstation vid Bosporens inlopp från Svarta havet, nära dagens Anadolu Kavağı.
In 941 Igor, prince of Kiev, sent a great fleet of boats down the Dnieper and across the Black Sea. The Bulgarians sent warning, but the Byzantine navy was away fighting the Arabs and the army was on the eastern frontier. The Emperor Romanos I had fifteen old warships fitted with tubes for Greek fire and sent them out under the protovestiarios Theophanes. On 11 June, near Hieron at the mouth of the Bosporus, the Rus’ surrounded the ships to capture them and were met with fire. Liudprand of Cremona writes that men leapt into the sea to escape the flames and sank under their armour.: År 941 sände Igor, furste av Kiev, en stor flotta av båtar nedför Dnepr och över Svarta havet. Bulgarerna sände varning, men den bysantinska flottan var borta och stred mot araberna och armén befann sig vid östgränsen. Kejsar Romanos I lät utrusta femton gamla krigsfartyg med rör för grekisk eld och sände ut dem under protovestiarios Theophanes. Den 11 juni, nära Hieron vid Bosporens mynning, omringade männen från Rus fartygen för att erövra dem och möttes av eld. Liudprand av Cremona skriver att män hoppade i havet för att undkomma lågorna och sjönk under tyngden av sina rustningar.
The survivors landed on the Asian shore and for months plundered Bithynia and Paphlagonia as far as Nicomedia; the chroniclers describe captives crucified and nailed to the ground. Bardas Phokas and then John Kourkouas, recalled with the army of the east, hemmed them in. In September, as the Rus’ tried to slip home, Theophanes’ fleet caught them off the Thracian coast and burned most of their boats; prisoners were beheaded in Constantinople. In 944 Igor came again with Rus’ and Pecheneg allies, but Romanos sent envoys with gifts to meet him on the Danube. In the treaty that followed, Rus’ merchants were let back into Constantinople, but on stricter terms than before.: De överlevande landsteg på den asiatiska stranden och plundrade i månader Bithynien och Paflagonien ända till Nikomedia; krönikörerna beskriver fångar som korsfästes och spikades fast vid marken. Bardas Phokas och sedan Johannes Kurkuas, som återkallats med Österns armé, ringade in dem. I september, när männen från Rus försökte ta sig hem obemärkt, hann Theophanes flotta upp dem utanför den thrakiska kusten och brände de flesta av deras båtar; fångar halshöggs i Konstantinopel. År 944 kom Igor tillbaka med allierade från Rus och petjenegerna, men Romanos sände sändebud med gåvor för att möta honom vid Donau. I det fördrag som följde fick köpmän från Rus återvända till Konstantinopel, men på strängare villkor än tidigare.
