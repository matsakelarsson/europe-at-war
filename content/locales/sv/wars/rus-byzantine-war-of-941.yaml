Fifteen Byzantine ships armed with Greek fire broke up the Rus’ fleet at the entrance to the Bosporus.: Femton bysantinska fartyg beväpnade med grekisk eld splittrade flottan från Rus vid Bosporens inlopp.
Nicomedia: Nikomedia
Summer 941: sommaren 941
The Rus’ raided the coasts and countryside of Bithynia as far as this city, looting churches and monasteries.: Männen från Rus plundrade kusterna och landsbygden i Bithynien ända till denna stad och plundrade kyrkor och kloster.
Off the Thracian coast: Utanför den thrakiska kusten
September 941: september 941
Theophanes’ fleet intercepted the Rus’ as they crossed back towards Thrace and destroyed most of their boats. The exact place is not recorded.: Theophanes flotta genskjöt männen från Rus när de korsade tillbaka mot Thrakien och förstörde de flesta av deras båtar. Den exakta platsen är inte känd.
Treaty of 944/945: Fördraget 944/945
944 or 945: 944 eller 945
Igor swore to the treaty in Kiev by the god Perun, and his Christian followers in the church of Saint Elias. Rus’ merchants needed the prince’s letters, entered Constantinople unarmed in groups of fifty and could not winter there.: Igor svor på fördraget i Kiev vid guden Perun, och hans kristna följeslagare i Sankt Elias kyrka. Köpmän från Rus behövde furstens brev, fick komma in i Konstantinopel obeväpnade i grupper om femtio och fick inte övervintra där.
