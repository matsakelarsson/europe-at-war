Rus’ siege of Constantinople (860): Rus belägring av Konstantinopel (860)
The first recorded attack by the Rus’ on the Byzantine Empire. On 18 June 860, while the Emperor Michael III and the army were away fighting the Arabs in Asia Minor and the fleet was in the Mediterranean, a fleet of about 200 Rus’ ships sailed down the Bosporus and plundered the suburbs of Constantinople and the Princes’ Islands, killing many of the people they caught. They withdrew some weeks later; in a sermon of early August Patriarch Photios gave thanks for the city’s deliverance. Later tradition credited a miracle of the Virgin’s robe, and the Byzantines soon sent missionaries to the Rus’.: Det första kända anfallet från Rus mot Bysantinska riket. Den 18 juni 860, medan kejsar Mikael III och armén var borta och stred mot araberna i Mindre Asien och flottan befann sig i Medelhavet, seglade en flotta på omkring 200 skepp från Rus ned genom Bosporen och plundrade Konstantinopels förstäder och Prinsöarna och dödade många av dem de fick tag på. De drog sig tillbaka några veckor senare; i en predikan i början av augusti tackade patriarken Fotios för stadens räddning. Senare tradition tillskrev räddningen ett under med Jungfru Marias mantel, och bysantinerna sände snart missionärer till Rus.
