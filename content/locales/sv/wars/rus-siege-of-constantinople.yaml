The best evidence is two sermons by Patriarch Photios, who witnessed the attack, and a short Byzantine chronicle that gives the date. The Rus’ Primary Chronicle, compiled about 1113, dates the raid to 866 and names Askold and Dir of Kiev as its leaders; where the raiders came from is disputed. The story of the storm raised by the robe of the Virgin appears only in later writers.: De bästa källorna är två predikningar av patriarken Fotios, som bevittnade anfallet, och en kort bysantinsk krönika som anger datumet. Nestorskrönikan, sammanställd omkring 1113, daterar räden till 866 och anger Askold och Dir av Kiev som dess ledare; varifrån anfallarna kom är omstritt. Berättelsen om stormen som framkallades av Jungfru Marias mantel förekommer bara hos senare skribenter.
