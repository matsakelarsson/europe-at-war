Russian–Chukchi wars: Rysk-tjuktjiska krigen
The long and, for Russia, unsuccessful attempt to bring the Chukchi of the far north-east of Siberia under fur tribute (yasak). From the fort of Anadyrsk, founded on the Anadyr river in the 1650s, Cossack expeditions against the Chukchi began in 1701. In 1730 the Chukchi killed Afanasy Shestakov, commander of a new expedition, near the mouth of the Penzhina, and his successor Dmitry Pavlutsky led punitive campaigns in 1731 and 1744–1747 that burned camps, took reindeer and captives and killed many, but never forced the Chukchi to submit. Pavlutsky himself was killed in battle near Anadyrsk in March 1747. Judging the war too costly, Catherine II’s government ordered Anadyrsk abandoned in 1764; it was burned and evacuated in 1771. At Gizhiga in 1778 Chukchi leaders agreed to become Russian subjects on their own terms, and the empress freed them from tribute. Trade at fairs on the Kolyma and the Anyui replaced war, and Russian rule over the Chukchi remained largely nominal until the Soviet period.: Det långa och, för Ryssland, misslyckade försöket att tvinga tjuktjerna i Sibiriens yttersta nordost att betala pälstribut (jasak). Från fästet Anadyrsk, grundat vid floden Anadyr på 1650-talet, inleddes kosackexpeditioner mot tjuktjerna 1701. År 1730 dödade tjuktjerna Afanasij Sjestakov, befälhavare för en ny expedition, nära Penzjinas mynning, och hans efterträdare Dmitrij Pavlutskij ledde straffexpeditioner 1731 och 1744–1747 som brände läger, tog renar och fångar och dödade många, men som aldrig tvingade tjuktjerna att underkasta sig. Pavlutskij själv stupade i strid nära Anadyrsk i mars 1747. Katarina II:s regering ansåg kriget för kostsamt och beordrade 1764 att Anadyrsk skulle överges; fästet brändes och utrymdes 1771. I Gizjiga 1778 gick tjuktjiska ledare med på att bli ryska undersåtar på egna villkor, och kejsarinnan befriade dem från tribut. Handel på marknaderna vid Kolyma och Anjuj ersatte kriget, och det ryska styret över tjuktjerna förblev till stor del nominellt fram till sovjettiden.
