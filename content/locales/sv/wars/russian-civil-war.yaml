Russia used the Julian (Old Style) calendar until 31 January 1918, which was followed by 14 February. The October Revolution of 25 October Old Style fell on 7 November New Style. Dates here are New Style.: Ryssland använde den julianska kalendern (gamla stilen) till den 31 januari 1918, som följdes av den 14 februari. Oktoberrevolutionen den 25 oktober g.s. inföll den 7 november n.s. Datumen här anges enligt nya stilen.
