Denikin’s armies fell back to the Black Sea in the winter of 1919–1920, and in late March tens of thousands of troops and refugees were shipped from Novorossiysk to the Crimea in chaos, leaving thousands behind. Denikin resigned, and Wrangel took command of what was left. While the Red Army was fighting Poland, Wrangel broke out of the Crimea in June 1920 into Northern Taurida, the grain lands north of the peninsula, and promised land to the peasants. The Reds held a bridgehead across the Dnieper at Kakhovka, where the fighting came close to the trench battles of the World War.: Denikins arméer drog sig tillbaka till Svarta havet vintern 1919–1920, och i slutet av mars skeppades tiotusentals soldater och flyktingar under kaotiska former från Novorossijsk till Krim, medan tusentals lämnades kvar. Denikin avgick, och Wrangel tog befälet över det som återstod. Medan Röda armén stred mot Polen bröt Wrangel i juni 1920 ut från Krim in i Norra Taurien, spannmålsområdena norr om halvön, och lovade bönderna jord. De röda höll ett brohuvud över Dnepr vid Kachovka, där striderna kom att likna världskrigets skyttegravsstrider.
After the armistice with Poland in October, Frunze’s Southern Front, with Makhno’s insurgents as temporary allies, attacked the Crimea. On the night of 7–8 November Red troops crossed the shallow Sivash lagoon in freezing wind to outflank the fortified Perekop isthmus, and by 11 November the White lines had broken. Wrangel had prepared an evacuation, and between 13 and 16 November about 146,000 soldiers and civilians left the Crimean ports on 126 ships for Constantinople. In the months that followed, the Cheka shot former White soldiers and civilians in the Crimea; estimates of the dead run from about 12,000 to more than 50,000.: Efter vapenstilleståndet med Polen i oktober anföll Frunzes sydfront, med Machnos upprorsmän som tillfälliga bundsförvanter, Krim. Natten mellan den 7 och 8 november gick röda trupper i iskall vind över den grunda lagunen Sivasj för att kringgå det befästa Perekopnäset, och den 11 november hade de vitas linjer brutits. Wrangel hade förberett en evakuering, och mellan den 13 och 16 november lämnade omkring 146 000 soldater och civila Krims hamnar på 126 fartyg med kurs mot Konstantinopel. Under de följande månaderna sköt Tjekan före detta vita soldater och civila på Krim; uppskattningarna av antalet döda sträcker sig från omkring 12 000 till mer än 50 000.
