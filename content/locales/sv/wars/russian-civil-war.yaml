About 40,000 Czech and Slovak soldiers, most of them former Austro-Hungarian prisoners of war, were travelling east along the Trans-Siberian Railway to sail from Vladivostok to the Western Front. After a brawl at Chelyabinsk in May 1918, Leon Trotsky, the commissar for war, ordered them disarmed, and the Legion rose instead, seizing the railway towns from the Volga to the Pacific. Behind its lines anti-Bolshevik governments formed, among them the Socialist Revolutionaries’ Komuch at Samara. In early August Czechoslovak and Komuch troops took Kazan, with much of the imperial gold reserve.: Omkring 40 000 tjeckiska och slovakiska soldater, de flesta före detta österrikisk-ungerska krigsfångar, färdades österut längs transsibiriska järnvägen för att segla från Vladivostok till västfronten. Efter ett slagsmål i Tjeljabinsk i maj 1918 beordrade krigskommissarien Lev Trotskij att de skulle avväpnas, och legionen gjorde i stället uppror och besatte järnvägsstäderna från Volga till Stilla havet. Bakom dess linjer bildades antibolsjevikiska regeringar, bland dem socialistrevolutionärernas Komutj i Samara. I början av augusti intog tjeckoslovakiska trupper och Komutjs trupper Kazan, med en stor del av den kejserliga guldreserven.
As the Legion neared Yekaterinburg, local Bolsheviks shot the former tsar Nicholas II, his wife, their five children and four servants in the cellar of the Ipatiev House on the night of 16–17 July. Trotsky rebuilt the Red Army with conscripts and former tsarist officers watched by political commissars, and it retook Kazan on 10 September and Samara in October. In the south the Volunteer Army lost Kornilov, killed outside Yekaterinodar in April, but took the city in August under Anton Denikin, while Don Cossacks besieged Tsaritsyn on the Volga. In November Admiral Alexander Kolchak seized power over the Whites in Siberia at Omsk.: När legionen närmade sig Jekaterinburg sköt lokala bolsjeviker den förre tsaren Nikolaj II, hans hustru, deras fem barn och fyra tjänare i källaren i Ipatjevs hus natten mellan den 16 och 17 juli. Trotskij byggde upp Röda armén på nytt med värnpliktiga och före detta tsaristiska officerare övervakade av politiska kommissarier, och den återtog Kazan den 10 september och Samara i oktober. I söder förlorade frivilligarmén Kornilov, som dödades utanför Jekaterinodar i april, men intog staden i augusti under Anton Denikin, medan donkosacker belägrade Tsaritsyn vid Volga. I november tog amiral Aleksandr Koltjak makten över de vita i Sibirien i Omsk.
