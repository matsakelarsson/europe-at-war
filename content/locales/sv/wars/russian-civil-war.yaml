Central Powers success: Centralmakternas framgångar
On the night of 6–7 November 1917, 24–25 October in the Russian calendar of the time, the Bolsheviks’ Military Revolutionary Committee seized Petrograd’s bridges, stations and telegraph office, and then the Winter Palace, where the ministers of Alexander Kerensky’s Provisional Government were arrested. A Congress of Soviets approved a new government, the Council of People’s Commissars under Vladimir Lenin. In Moscow the Bolsheviks won only after a week of street fighting. Elections to a Constituent Assembly gave the Socialist Revolutionaries the most votes, and when the Assembly met in January 1918 the Bolsheviks dispersed it after a single day.: Natten mellan den 6 och 7 november 1917, den 24–25 oktober enligt den ryska kalender som då gällde, besatte bolsjevikernas militärrevolutionära kommitté Petrograds broar, stationer och telegrafstation och sedan Vinterpalatset, där ministrarna i Aleksandr Kerenskijs provisoriska regering arresterades. En sovjetkongress godkände en ny regering, Folkkommissariernas råd under Vladimir Lenin. I Moskva segrade bolsjevikerna först efter en veckas gatustrider. Valen till en konstituerande församling gav socialistrevolutionärerna flest röster, och när församlingen samlades i januari 1918 upplöste bolsjevikerna den efter en enda dag.
Lenin wanted peace with the Central Powers almost at any price. When talks at Brest-Litovsk stalled, German and Austro-Hungarian armies advanced from 18 February 1918 against little resistance, taking Minsk, Tallinn and Pskov and entering Kyiv on 1 March. In the treaty signed on 3 March, Soviet Russia gave up Poland, Lithuania and Courland, left Livonia and Estonia under German occupation, and recognised Finland and Ukraine, lands with about a third of the old empire’s population. The government moved to Moscow. On the Don, former tsarist generals were raising a Volunteer Army, which set out in February on its “Ice March” into the Kuban.: Lenin ville ha fred med centralmakterna nästan till vilket pris som helst. När förhandlingarna i Brest-Litovsk gick i stå ryckte tyska och österrikisk-ungerska arméer från den 18 februari 1918 fram mot ringa motstånd, intog Minsk, Tallinn och Pskov och tågade in i Kyiv den 1 mars. I fördraget som undertecknades den 3 mars avstod Sovjetryssland från Polen, Litauen och Kurland, lämnade Livland och Estland under tysk ockupation och erkände Finland och Ukraina, områden med omkring en tredjedel av det gamla rikets befolkning. Regeringen flyttade till Moskva. Vid Don satte före detta tsaristiska generaler upp en frivilligarmé, som i februari gav sig ut på sin ”ismarsch” in i Kuban.
