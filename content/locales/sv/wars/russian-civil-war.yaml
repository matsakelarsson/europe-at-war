On 30 August 1918 a young officer cadet shot Moisei Uritsky, head of the Petrograd Cheka, and the same day Lenin was badly wounded by shots blamed on the Socialist Revolutionary Fanny Kaplan. On 5 September the government decreed a Red Terror. The Cheka, the political police under Felix Dzerzhinsky, shot hostages and “class enemies” and set up concentration camps; 10,000–15,000 people were executed in the first two months alone, and estimates for the whole war run from about 50,000 to 200,000 or more. White forces also shot prisoners and suspected Bolsheviks, and in Ukraine soldiers of several armies, most often Ukrainian nationalist troops, murdered tens of thousands of Jews in pogroms.: Den 30 augusti 1918 sköt en ung officerskadett Moisej Uritskij, chef för Tjekan i Petrograd, och samma dag sårades Lenin svårt av skott som skylldes på socialistrevolutionären Fanny Kaplan. Den 5 september utfärdade regeringen ett dekret om röd terror. Tjekan, den politiska polisen under Feliks Dzerzjinskij, sköt gisslan och ”klassfiender” och inrättade koncentrationsläger; 10 000–15 000 människor avrättades bara under de två första månaderna, och uppskattningarna för hela kriget sträcker sig från omkring 50 000 till 200 000 eller fler. Vita styrkor sköt också fångar och misstänkta bolsjeviker, och i Ukraina mördade soldater ur flera arméer, oftast ukrainska nationalistiska trupper, tiotusentals judar i pogromer.
The Allies first landed to keep war supplies from the Germans and to revive the Eastern Front, and after Germany’s defeat they stayed to help the Whites. British marines landed at Murmansk in March 1918, and British, French and American troops at Arkhangelsk in August. Japanese and American troops occupied Vladivostok, the Japanese eventually with some 70,000 men, and French and Greek troops held Odessa from December 1918 to April 1919. The Allies sent the Whites large stocks of weapons, but their own soldiers fought only in a few places, mainly in the north. Most had left by the end of 1919; the Japanese stayed in the Far East until 1922.: De allierade landsteg först för att hålla krigsmateriel undan tyskarna och återupprätta östfronten, och efter Tysklands nederlag stannade de för att hjälpa de vita. Brittiska marinsoldater landsteg i Murmansk i mars 1918, och brittiska, franska och amerikanska trupper i Archangelsk i augusti. Japanska och amerikanska trupper ockuperade Vladivostok, japanerna till slut med omkring 70 000 man, och franska och grekiska trupper höll Odessa från december 1918 till april 1919. De allierade sände de vita stora mängder vapen, men deras egna soldater stred bara på ett fåtal platser, främst i norr. De flesta hade lämnat landet i slutet av 1919; japanerna stannade i Fjärran östern till 1922.
