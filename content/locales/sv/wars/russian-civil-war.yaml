In 1919 the Whites attacked from three sides. In March Kolchak’s armies advanced from Siberia across the Urals, took Ufa and came within reach of the Volga, but a Red counter-offensive under Mikhail Frunze retook Ufa on 9 June and Yekaterinburg and Chelyabinsk in July. In the south Denikin’s Armed Forces of South Russia, supplied by Britain, took Kharkiv and, under Pyotr Wrangel, Tsaritsyn at the end of June. On 3 July Denikin ordered an advance on Moscow. His armies took Kyiv, Kursk and Voronezh, and on 14 October entered Oryol, about 360 km from the capital.: År 1919 anföll de vita från tre håll. I mars ryckte Koltjaks arméer fram från Sibirien över Ural, intog Ufa och kom inom räckhåll för Volga, men en röd motoffensiv under Michail Frunze återtog Ufa den 9 juni och Jekaterinburg och Tjeljabinsk i juli. I söder intog Denikins Sydrysslands väpnade styrkor, försörjda av Storbritannien, Charkiv och, under Pjotr Wrangel, Tsaritsyn i slutet av juni. Den 3 juli beordrade Denikin en framryckning mot Moskva. Hans arméer intog Kyiv, Kursk och Voronezj och tågade den 14 oktober in i Orjol, omkring 360 km från huvudstaden.
In October Nikolai Yudenich’s Northwestern Army, based in Estonia, reached Gatchina and the Pulkovo Heights on the edge of Petrograd before Trotsky rallied the city’s defence and drove it back. In the south the Reds, who held the railway hub of central Russia and more men, counter-attacked. They retook Oryol on 20 October, and Semyon Budyonny’s cavalry took Voronezh on 24 October, while behind the White lines Nestor Makhno’s anarchist insurgents cut supply routes in Ukraine. Kolchak lost Omsk on 14 November; handed over at Irkutsk, he was shot by the Bolsheviks there on 7 February 1920.: I oktober nådde Nikolaj Judenitjs nordvästarmé, med bas i Estland, Gattjina och Pulkovohöjderna i utkanten av Petrograd innan Trotskij samlade stadens försvar och drev den tillbaka. I söder gick de röda, som höll centrala Rysslands järnvägsknut och hade fler soldater, till motanfall. De återtog Orjol den 20 oktober, och Semjon Budjonnyjs kavalleri intog Voronezj den 24 oktober, medan Nestor Machnos anarkistiska upprorsmän skar av försörjningslinjerna i Ukraina bakom de vitas linjer. Koltjak förlorade Omsk den 14 november; han utlämnades i Irkutsk och sköts där av bolsjevikerna den 7 februari 1920.
