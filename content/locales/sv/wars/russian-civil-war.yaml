Russian Civil War: Ryska inbördeskriget
A war for control of the former Russian Empire after the Bolshevik seizure of power in November 1917, fought between the Red Army and the anti-Bolshevik Whites, with peasant armies, national movements and foreign troops drawn in. The Reds had won in European Russia by the end of 1920 and in the Far East by 1922; with terror, famine and epidemics the war cost an estimated 7–12 million lives, most of them civilians, and ended in the founding of the Soviet Union.: Ett krig om kontrollen över det forna Ryska riket efter bolsjevikernas maktövertagande i november 1917, utkämpat mellan Röda armén och de antibolsjevikiska vita, med bondearméer, nationella rörelser och utländska trupper indragna. De röda hade segrat i europeiska Ryssland i slutet av 1920 och i Fjärran östern 1922; med terror, svält och epidemier kostade kriget uppskattningsvis 7–12 miljoner liv, de flesta civila, och det slutade med grundandet av Sovjetunionen.
