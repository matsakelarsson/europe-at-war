With the Whites beaten, the Bolsheviks faced revolt from their own supporters. Peasants rose against grain requisitioning, most widely in Tambov province under Alexander Antonov, where the Red Army under Mikhail Tukhachevsky crushed them in 1921 with mass hostage-taking and poison gas. In March 1921 the sailors of Kronstadt, once heroes of the revolution, demanded free elections and soviets without Bolshevik control. After failed first assaults, Red troops crossed the ice of the Gulf of Finland and took the fortress on 18 March. Thousands of rebels were shot or imprisoned, and about 8,000 escaped across the ice to Finland.: När de vita var besegrade mötte bolsjevikerna uppror från sina egna anhängare. Bönder reste sig mot spannmålsrekvisitionerna, mest omfattande i Tambovguvernementet under Aleksandr Antonov, där Röda armén under Michail Tuchatjevskij krossade dem 1921 med massgisslantagning och giftgas. I mars 1921 krävde sjömännen i Kronstadt, en gång revolutionens hjältar, fria val och sovjeter utan bolsjevikisk kontroll. Efter misslyckade första anfall gick röda trupper över isen på Finska viken och intog fästningen den 18 mars. Tusentals upprorsmän sköts eller fängslades, och omkring 8 000 flydde över isen till Finland.
The same month Lenin replaced requisitioning with a tax in kind, the start of the New Economic Policy. Drought and years of seizures brought a famine to the Volga region and southern Ukraine in 1921–1922 that killed about five million people, despite food aid from the American Relief Administration and others. In the Far East the Japanese left Vladivostok in October 1922. On 30 December 1922 Soviet Russia, Ukraine, Belarus and the Transcaucasian republic formed the Union of Soviet Socialist Republics. With terror, hunger and epidemics, the war had cost an estimated 7–12 million lives, and one to two million people had left the country.: Samma månad ersatte Lenin rekvisitionerna med en naturaskatt, början på den nya ekonomiska politiken (NEP). Torka och år av beslag ledde 1921–1922 till en svält i Volgaområdet och södra Ukraina som dödade omkring fem miljoner människor, trots livsmedelshjälp från American Relief Administration och andra. I Fjärran östern lämnade japanerna Vladivostok i oktober 1922. Den 30 december 1922 bildade Sovjetryssland, Ukraina, Belarus och Transkaukasiska republiken Socialistiska sovjetrepublikernas union. Med terror, svält och epidemier hade kriget kostat uppskattningsvis 7–12 miljoner liv, och en till två miljoner människor hade lämnat landet.
