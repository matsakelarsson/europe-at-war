# Svenska översättningar av katalogtexten (våg 7); stegtexterna kommer senare.
Russian conquest of Central Asia: Rysslands erövring av Centralasien
The campaigns in which the Russian Empire, advancing south from the Kazakh steppe and east from the Caspian Sea, conquered the khanates of Kokand, Bukhara and Khiva and the Turkmen tribes between 1839 and 1885. After a failed winter march on Khiva in 1839–1840, Russia built a line of forts along the Syr Darya, took Tashkent from Kokand in 1865, defeated Bukhara in 1866–1868, made Bukhara and Khiva protectorates, annexed Kokand in 1876 and conquered the Turkmen after the storming of Geok Tepe in 1881. The clash with Afghan troops at Panjdeh in 1885 nearly led to war with Britain and set the frontier of Russian Turkestan with Afghanistan.: De fälttåg genom vilka Ryska riket, som ryckte fram söderut från den kazakiska stäppen och österut från Kaspiska havet, erövrade khanaten Kokand, Buchara och Chiva och turkmenstammarna mellan 1839 och 1885. Efter ett misslyckat vintertåg mot Chiva 1839–1840 byggde Ryssland en linje av fort längs Syr-Darja, tog Tasjkent från Kokand 1865, besegrade Buchara 1866–1868, gjorde Buchara och Chiva till protektorat, annekterade Kokand 1876 och erövrade turkmenerna efter stormningen av Geok Tepe 1881. Sammanstötningen med afghanska trupper vid Panjdeh 1885 ledde nästan till krig med Storbritannien och fastställde gränsen mellan Ryska Turkestan och Afghanistan.
