# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
Russian conquest of eastern Siberia: Den ryska erövringen av östra Sibirien
The advance of Russian Cossacks and fur traders from the Ob to the Pacific in the 17th century, and the resistance of the peoples of eastern Siberia. Small parties of servicemen built forts (ostrogs) along the rivers, from Turukhansk (1607) and Yeniseysk (1619) to Krasnoyarsk (1628), Bratsk (1631), Yakutsk (1632), Okhotsk (1647) and Irkutsk (1661), and forced the Kets, Evenks, Yakuts (Sakha), Buryats, Yukaghirs and others to pay a tribute in furs (yasak), taking hostages to make sure it was paid. The Yakuts rose in 1634 and 1642, the Evens burned Okhotsk in 1653, the Buryats fought the Russians for decades and some of their clans fled to Mongolia, and on the upper Yenisei the Kyrgyz princes and the Dzungars, who claimed the same tribute, attacked Krasnoyarsk. Epidemics of smallpox killed far more people than the fighting. By the Treaty of Nerchinsk with the Qing in 1689, Russia kept the lands around Lake Baikal and east to the Pacific north of the Amur basin.: Ryska kosackers och pälshandlares framryckning från Ob till Stilla havet under 1600-talet, och de östsibiriska folkens motstånd. Små skaror av krigsfolk i statens tjänst byggde fästen (ostroger) längs floderna, från Turuchansk (1607) och Jenisejsk (1619) till Krasnojarsk (1628), Bratsk (1631), Jakutsk (1632), Ochotsk (1647) och Irkutsk (1661), och tvingade keter, evenker, jakuter (sacha), burjater, jukagirer och andra att betala tribut i pälsverk (jasak), och de tog gisslan för att säkra betalningen. Jakuterna reste sig 1634 och 1642, evenerna brände Ochotsk 1653, burjaterna stred mot ryssarna i årtionden och en del av deras klaner flydde till Mongoliet, och vid övre Jenisej angrep de kirgiziska furstarna och dzungarerna, som krävde samma tribut, Krasnojarsk. Smittkoppsepidemier dödade långt fler människor än striderna. Genom fördraget i Nertjinsk med Qing 1689 behöll Ryssland landen kring Bajkalsjön och österut till Stilla havet norr om Amurbäckenet.
