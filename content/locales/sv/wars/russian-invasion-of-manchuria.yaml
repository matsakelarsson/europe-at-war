# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
Russian invasion of Manchuria: Rysslands invasion av Manchuriet
The Russian conquest of Manchuria during the Boxer Rebellion. When Boxers and Qing troops attacked the Chinese Eastern Railway, which Russia was building across Manchuria to Vladivostok and Port Arthur, and Qing guns at Aigun shelled Blagoveshchensk across the Amur in July 1900, Russia sent columns into Manchuria from the Amur, the Ussuri, Transbaikalia and the Liaodong peninsula. In Blagoveshchensk the Russian authorities drove the Chinese residents into the Amur, where thousands drowned, and the Sixty-Four Villages east of the river were emptied of their Manchu, Daur and Han inhabitants. The Russians took Aigun, relieved Harbin, and by October held Qiqihar, Jilin and Mukden (Shenyang), with all of Manchuria. Russia’s failure to withdraw as it had promised was a main cause of the Russo-Japanese War of 1904.: Den ryska erövringen av Manchuriet under boxarupproret. När boxare och Qingtrupper angrep Östkinesiska järnvägen, som Ryssland byggde tvärs genom Manchuriet till Vladivostok och Port Arthur, och Qingkanoner i Aigun besköt Blagovesjtjensk på andra sidan Amur i juli 1900, sände Ryssland kolonner in i Manchuriet från Amur, Ussuri, Transbajkalien och Liaodonghalvön. I Blagovesjtjensk drev de ryska myndigheterna ut de kinesiska invånarna i Amur, där tusentals drunknade, och de sextiofyra byarna öster om floden tömdes på sina manchuiska, dauriska och hankinesiska invånare. Ryssarna intog Aigun, undsatte Harbin och höll i oktober Qiqihar, Jilin och Mukden (Shenyang) och därmed hela Manchuriet. Att Ryssland inte drog sig tillbaka som det hade lovat var en av huvudorsakerna till rysk-japanska kriget 1904.
