# Svenska översättningar av katalogtexten (våg 10); stegtexterna kommer senare.
Russian raids on Sakhalin and Iturup: De ryska räderna mot Sachalin och Iturup
? Raids by two Russian naval officers in the service of the Russian-American Company on Japanese posts in Sakhalin, the Kurils and northern Ezo in 1806–1807, known in Japan as the Bunka Russian incursion (Bunka rokō), and the capture of the Russian captain Vasily Golovnin that followed in 1811–1813. In 1804–1805 the envoy Nikolai Rezanov waited six months at Nagasaki for permission to open trade, and the shogunate refused. On his way back he ordered Lieutenant Nikolai Khvostov to strike at the Japanese in the north, then tried to take the order back. In October 1806 Khvostov in the Yunona landed at Kushunkotan on Aniva Bay in southern Sakhalin, seized four guards, carried off rice and burned the post. In 1807 he returned with Midshipman Gavriil Davydov in the Yunona and the Avos, looted and burned Naibo on Iturup (Etorofu), and in June drove off some 200–300 shogunate, Nanbu and Tsugaru men from Shana, Iturup’s main post; the officer Toda Matadayū killed himself during the retreat, and the young surveyor Mamiya Rinzō was among the defenders. The raiders burned ships and stores on Rishiri and Rebun and left a letter threatening more attacks if Japan refused trade. In Okhotsk Khvostov and Davydov were arrested for acting without the emperor’s authority, but the shogunate, which had taken all of Ezo under its direct rule in 1807, mobilised about 3,000 men from the northern domains and ordered Russian ships driven away. In July 1811 the garrison of Kunashir seized Golovnin of the sloop Diana, who had come ashore for supplies, and held him and seven companions in Hakodate and Matsumae. His deputy Pyotr Rikord took the Japanese merchant Takadaya Kahei hostage in 1812; Takadaya helped arrange an exchange, and once Russian officials had assured the Japanese in writing that Khvostov had acted without authority, Golovnin and his men were released at Hakodate in the autumn of 1813.
: Räder som två ryska sjöofficerare i Rysk-amerikanska kompaniets tjänst gjorde 1806–1807 mot japanska poster på Sachalin, Kurilerna och i norra Ezo, i Japan kända som Bunkaerans ryska intrång (Bunka rokō), samt tillfångatagandet av den ryske kaptenen Vasilij Golovnin som följde 1811–1813. Åren 1804–1805 väntade sändebudet Nikolaj Rezanov i sex månader i Nagasaki på tillstånd att inleda handel, och shogunatet vägrade. På hemvägen beordrade han löjtnant Nikolaj Chvostov att slå till mot japanerna i norr och försökte sedan ta tillbaka ordern. I oktober 1806 landsteg Chvostov med Junona vid Kushunkotan vid Anivabukten på södra Sachalin, grep fyra vakter, förde bort ris och brände posten. År 1807 återvände han med midskeppsmannen Gavriil Davydov på Junona och Avos, plundrade och brände Naibo på Iturup (Etorofu) och drev i juni bort omkring 200–300 man från shogunatet, Nanbu och Tsugaru från Shana, Iturups viktigaste post; officeren Toda Matadayū tog livet av sig under reträtten, och den unge lantmätaren Mamiya Rinzō var en av försvararna. Plundrarna brände fartyg och förråd på Rishiri och Rebun och lämnade ett brev där de hotade med fler angrepp om Japan vägrade att handla. I Ochotsk greps Chvostov och Davydov för att ha handlat utan kejsarens bemyndigande, men shogunatet, som 1807 hade lagt hela Ezo under sitt direkta styre, mobiliserade omkring 3 000 man från de nordliga domänerna och beordrade att ryska fartyg skulle drivas bort. I juli 1811 grep garnisonen på Kunasjir Golovnin från slupen Diana, som hade gått i land för att hämta förnödenheter, och höll honom och sju följeslagare fångna i Hakodate och Matsumae. Hans ställföreträdare Pjotr Rikord tog 1812 den japanske köpmannen Takadaya Kahei som gisslan; Takadaya hjälpte till att ordna ett utbyte, och sedan ryska ämbetsmän skriftligen hade försäkrat japanerna att Chvostov hade handlat utan bemyndigande släpptes Golovnin och hans män i Hakodate hösten 1813.
