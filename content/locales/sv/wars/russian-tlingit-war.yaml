# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
Russian–Tlingit War: Rysk-tlingitiska kriget
? The war between the Tlingit (Lingít) of south-eastern Alaska and the Russian-American Company, which hunted sea otters along their coast with Alutiiq and Aleut hunters. In 1799 Alexander Baranov built Redoubt Saint Michael on Sitka Sound, in the country of the Sitka Kiks.ádi clan. Angered by Russian hunting in their waters, by demands for labour and by the treatment of Tlingit women, Tlingit warriors destroyed the post in June 1802, killing most of the people there, and attacked Russian hunting parties. In 1804 Baranov returned with a fleet of baidarkas and the Russian Navy sloop Neva. The Kiks.ádi, led in war by K’alyáan, held their new fort, Shís’gi Noow, at the mouth of the Indian River against the first assault on 1 October 1804, but had lost their reserve of gunpowder, and after days of bombardment and talks they left it by night and walked across Baranof Island to Point Craven, the “Survival March”. The Russians founded New Archangel (Novo-Arkhangelsk, today’s Sitka), from 1808 the capital of Russian America; in 1805 Tlingit and Eyak warriors destroyed the Russian post at Yakutat. The Kiks.ádi returned to Sitka in 1822.
: Kriget mellan tlingit (lingít) i sydöstra Alaska och Rysk-amerikanska kompaniet, som jagade havsutter längs deras kust med alutiiq- och aleutjägare. År 1799 byggde Aleksandr Baranov skansen S:t Mikael vid Sitka Sound, i det land där klanen Kiks.ádi i Sitka bodde. Förbittrade över den ryska jakten i deras vatten, över kraven på arbete och över behandlingen av tlingitkvinnor förstörde tlingitkrigare skansen i juni 1802, dödade de flesta som befann sig där och anföll ryska jaktsällskap. År 1804 återvände Baranov med en flotta av baidarkor och den ryska flottans slup Neva. Kiks.ádi, som leddes i krig av K’alyáan, försvarade sitt nya fort, Shís’gi Noow, vid Indian Rivers mynning mot det första anfallet den 1 oktober 1804, men de hade förlorat sitt krutförråd, och efter dagar av bombardemang och förhandlingar lämnade de fortet nattetid och vandrade tvärs över Baranof Island till Point Craven, ”Överlevnadsmarschen”. Ryssarna grundade Nya Archangelsk (Novo-Archangelsk, dagens Sitka), från 1808 huvudstad i Ryska Amerika; 1805 förstörde tlingit- och eyakkrigare den ryska handelsstationen i Yakutat. Kiks.ádi återvände till Sitka 1822.
