Dates are Julian (Old Style). The sources disagree on the dates of the fighting at Molodi as well as on numbers; Russian historians usually date it from 29 or 30 July to 2 August 1572.: Datumen anges enligt den julianska kalendern (gamla stilen). Källorna är oeniga om datumen för striderna vid Molodi liksom om styrkorna; ryska historiker brukar datera slaget från den 29 eller 30 juli till den 2 augusti 1572.
The Crimean army included Nogai and Circassian contingents and, in 1572, Ottoman janissaries and guns. Russia was at the same time fighting the Livonian War against Sweden and Poland–Lithuania.: I krimhären ingick nogajiska och tjerkessiska kontingenter och 1572 även osmanska janitsjarer och kanoner. Ryssland utkämpade samtidigt livländska kriget mot Sverige och Polen–Litauen.
The Crimean raids, which were above all slave raids, continued after Molodi, and in 1591 a Crimean army again reached the outskirts of Moscow.: Krimtatarernas räder, som framför allt var slavräder, fortsatte efter Molodi, och 1591 nådde en krimhär återigen Moskvas utkanter.
