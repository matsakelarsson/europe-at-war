"After Russia took Kazan and Astrakhan, the Crimean khan Devlet I Giray, a vassal of the Ottoman sultan, demanded them back. A Crimean and Ottoman expedition against Astrakhan failed in 1569, and in 1570 the khan’s sons ravaged the lands of Ryazan and Kashira. Russia was badly placed: most of its army was fighting in Livonia, famine and plague had struck in 1570, and Ivan IV’s oprichnina terror had divided the country. In the spring of 1571 Devlet led perhaps 40,000 men north, and Russian defectors showed him a way across the upper Oka and the Ugra, round the army waiting at Serpukhov.": "Sedan Ryssland intagit Kazan och Astrachan krävde krimkhanen Devlet I Giray, den osmanske sultanens vasall, att få tillbaka dem. En krimtatarisk och osmansk expedition mot Astrachan misslyckades 1569, och 1570 härjade khanens söner områdena kring Rjazan och Kasjira. Ryssland var illa ute: större delen av dess här stred i Livland, hungersnöd och pest hade drabbat landet 1570, och Ivan IV:s opritjninaterror hade splittrat landet. Våren 1571 ledde Devlet kanske 40 000 man norrut, och ryska överlöpare visade honom en väg över övre Oka och Ugra, runt den här som väntade vid Serpuchov."
Ivan fled north to Rostov, and the Russian commanders fell back on Moscow. On 24 May the Tatars set fire to its wooden suburbs, and a strong wind carried the flames into the city, which burned down in about six hours. People who took refuge in stone churches and cellars died there, others drowned in the Moskva river, and the powder magazine in the Kremlin exploded, though the Kremlin itself was not taken. The Tatars left by the Ryazan road. Estimates of the dead range from 10,000 to 120,000, with 60,000–150,000 people carried off into slavery.: Ivan flydde norrut till Rostov, och de ryska befälhavarna drog sig tillbaka mot Moskva. Den 24 maj satte tatarerna eld på stadens förstäder av trä, och en stark vind förde lågorna in i staden, som brann ned på omkring sex timmar. Människor som sökt skydd i stenkyrkor och källare dog där, andra drunknade i floden Moskva, och krutförrådet i Kreml exploderade, även om själva Kreml inte intogs. Tatarerna drog bort längs vägen mot Rjazan. Uppskattningarna av antalet döda sträcker sig från 10 000 till 120 000, och 60 000–150 000 människor fördes bort som slavar.
