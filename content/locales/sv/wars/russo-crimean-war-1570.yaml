Russo-Crimean War, 1570–1572: Rysk-krimtatariska kriget 1570–1572
A war in which the Crimean khan Devlet I Giray, backed by the Ottoman Empire, tried to force Russia to give up Kazan and Astrakhan. In 1571, with most of the Russian army in Livonia, he slipped past the defences on the Oka and burned Moscow; in 1572 he came again and was defeated at Molodi, south of the city.: Ett krig där krimkhanen Devlet I Giray, med stöd av Osmanska riket, försökte tvinga Ryssland att ge upp Kazan och Astrachan. År 1571, när större delen av den ryska hären befann sig i Livland, smög han sig förbi försvarslinjerna vid Oka och brände Moskva; 1572 kom han tillbaka och besegrades vid Molodi, söder om staden.
