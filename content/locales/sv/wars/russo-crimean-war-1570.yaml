Devlet Giray: Devlet Giray
Devlet now demanded Kazan and Astrakhan as the price of peace. Ivan rebuilt the southern defences under Prince Mikhail Vorotynsky, and in July 1572 the khan came back with perhaps 40,000–60,000 men, including Nogais, Circassians and Ottoman janissaries. The Russians held the main fords, but around 27 July the Tatars crossed the Oka at Senkin ford, above Serpukhov, scattered a small detachment and rode for Moscow, leaving Vorotynsky’s army behind them. Vorotynsky followed, and his vanguard under Prince Dmitry Khvorostinin caught the Tatar rear near the village of Molodi, about 50 kilometres south of the city.: Devlet krävde nu Kazan och Astrachan som pris för fred. Ivan byggde upp försvaret i söder på nytt under furst Michail Vorotynskij, och i juli 1572 kom khanen tillbaka med kanske 40 000–60 000 man, bland dem nogajer, tjerkesser och osmanska janitsjarer. Ryssarna höll de viktigaste vadställena, men omkring den 27 juli gick tatarerna över Oka vid Senkinvadet ovanför Serpuchov, skingrade en liten avdelning och red mot Moskva och lämnade Vorotynskijs här bakom sig. Vorotynskij följde efter, och hans förtrupp under furst Dmitrij Chvorostinin hann upp tatarernas eftertrupp nära byn Molodi, omkring 50 kilometer söder om staden.
With an army at his back, Devlet turned round. For several days the Tatars attacked the Russian gulyay-gorod, a mobile fortress of wooden shields mounted on carts, on a hill by the Rozhayka river, while musketeers and cannon fired from behind it. Divey Murza, the khan’s chief commander, was captured early in the fighting. On 2 August, as the Tatars made a last assault, Vorotynsky led part of his army round the hill and fell on their rear. The Tatars fled back across the Oka with heavy losses, and Russia kept Kazan and Astrakhan.: Med en här i ryggen vände Devlet om. Under flera dagar anföll tatarerna den ryska guljaj-gorod, en rörlig fästning av träsköldar monterade på vagnar, på en kulle vid floden Rozjajka, medan musketerare och kanoner sköt bakom den. Divej Murza, khanens främste befälhavare, tillfångatogs tidigt i striderna. Den 2 augusti, när tatarerna gjorde ett sista anfall, ledde Vorotynskij en del av sin här runt kullen och föll dem i ryggen. Tatarerna flydde tillbaka över Oka med svåra förluster, och Ryssland behöll Kazan och Astrachan.
