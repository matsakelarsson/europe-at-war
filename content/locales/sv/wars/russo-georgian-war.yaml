Since the wars of the early 1990s South Ossetia and Abkhazia had been outside Georgian control, with Russian peacekeepers in both. Mikheil Saakashvili, president from 2004, promised to restore Georgia’s territorial integrity and sought NATO membership, while Russia gave its passports to most people in the two regions. In early August 2008 exchanges of fire around Tskhinvali grew heavier. Late on 7 August, hours after declaring a unilateral ceasefire, Georgia began an artillery bombardment and ground assault on the town, saying it was answering attacks on Georgian villages and Russian troop movements through the Roki Tunnel. Russian peacekeepers were among those killed.: Sedan krigen i början av 1990-talet hade Sydossetien och Abchazien legat utanför georgisk kontroll, med ryska fredsbevarande styrkor i båda. Micheil Saakasjvili, president från 2004, lovade att återställa Georgiens territoriella integritet och sökte medlemskap i Nato, medan Ryssland gav ryska pass till de flesta invånarna i de två regionerna. I början av augusti 2008 blev skottväxlingarna kring Tschinvali allt häftigare. Sent den 7 augusti, några timmar efter att ha utlyst ett ensidigt eldupphör, inledde Georgien en artilleribeskjutning och ett markanfall mot staden och uppgav att man besvarade angrepp på georgiska byar och ryska truppförflyttningar genom Rokitunneln. Ryska fredsbevarare fanns bland de dödade.
On 8 August Russia sent units of its 58th Army through the tunnel and began bombing targets across Georgia. Georgian forces were driven out of Tskhinvali by 10 August. A second front opened in the west, where Russian warships sank a Georgian boat off Abkhazia and Abkhaz forces, backed by Russia, drove Georgian troops from the upper Kodori Gorge. An EU inquiry, the Tagliavini report of 2009, found that the war began with the Georgian attack, which it judged unjustified under international law, but that Russia’s response went far beyond reasonable defence and that the blame could not be laid on one side alone.: Den 8 augusti sände Ryssland förband ur sin 58:e armé genom tunneln och började bomba mål över hela Georgien. De georgiska styrkorna hade drivits ut ur Tschinvali den 10 augusti. En andra front öppnades i väster, där ryska krigsfartyg sänkte en georgisk båt utanför Abchazien och abchaziska styrkor med ryskt stöd drev georgiska trupper ut ur övre Kodoridalen. En EU-utredning, Tagliavinirapporten från 2009, fann att kriget började med det georgiska anfallet, som den bedömde som oberättigat enligt folkrätten, men att Rysslands svar gick långt utöver ett rimligt försvar och att skulden inte kunde läggas på en sida ensam.
