Russo-Georgian War: Rysk-georgiska kriget
A short war in August 2008 that began with a Georgian assault on Tskhinvali, capital of breakaway South Ossetia, and turned into a Russian counter-offensive deep into Georgia. After a ceasefire brokered by France, Russia recognised South Ossetia and Abkhazia as independent states and kept troops in both, while most ethnic Georgians were driven out of South Ossetia.: Ett kort krig i augusti 2008 som började med ett georgiskt anfall mot Tschinvali, huvudstad i utbrytarregionen Sydossetien, och övergick i en rysk motoffensiv djupt in i Georgien. Efter ett eldupphör som förmedlades av Frankrike erkände Ryssland Sydossetien och Abchazien som självständiga stater och behöll trupper i båda, medan de flesta etniska georgier fördrevs från Sydossetien.
