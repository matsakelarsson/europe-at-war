On 11 August Russian forces moved beyond the conflict zones into the rest of Georgia. From Abkhazia they entered Zugdidi and the military base at Senaki and occupied the port of Poti, where they sank Georgian ships; from South Ossetia they took Gori on 13 August, cutting the country’s main east–west road. In and around South Ossetia militias burned and looted ethnic Georgian villages, and their inhabitants fled; the EU inquiry concluded that ethnic Georgians had been subjected to ethnic cleansing. About 192,000 people were displaced at the height of the war.: Den 11 augusti ryckte ryska styrkor fram bortom konfliktzonerna in i övriga Georgien. Från Abchazien tågade de in i Zugdidi och militärbasen i Senaki och ockuperade hamnstaden Poti, där de sänkte georgiska fartyg; från Sydossetien intog de Gori den 13 augusti och skar därmed av landets viktigaste väg mellan öst och väst. I och kring Sydossetien brände och plundrade miliser etniskt georgiska byar, och deras invånare flydde; EU-utredningen drog slutsatsen att etniska georgier hade utsatts för etnisk rensning. Omkring 192 000 människor var fördrivna när kriget var som intensivast.
France’s president Nicolas Sarkozy, holding the EU presidency, brokered a six-point ceasefire on 12 August, signed by Saakashvili on 15 August and by Russia’s president Dmitry Medvedev the next day. On 26 August Russia recognised Abkhazia and South Ossetia as independent states, which only a handful of other countries followed. Russian troops left Gori on 22 August and the “buffer zones” on 8 October, when EU monitors arrived, but stayed in both regions. Georgia counted about 400 dead, among them 224 civilians; Russia reported 67 soldiers killed, and South Ossetia said 365 of its people died.: Frankrikes president Nicolas Sarkozy, som innehade ordförandeskapet i EU, förmedlade den 12 augusti ett eldupphör i sex punkter, som undertecknades av Saakasjvili den 15 augusti och av Rysslands president Dmitrij Medvedev dagen därpå. Den 26 augusti erkände Ryssland Abchazien och Sydossetien som självständiga stater, vilket bara en handfull andra länder följde. Ryska trupper lämnade Gori den 22 augusti och ”buffertzonerna” den 8 oktober, när EU:s observatörer anlände, men stannade i båda regionerna. Georgien räknade med omkring 400 döda, bland dem 224 civila; Ryssland rapporterade 67 stupade soldater, och Sydossetien uppgav att 365 av dess invånare dött.
