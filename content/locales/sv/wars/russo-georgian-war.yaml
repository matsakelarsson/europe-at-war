South Ossetia and Abkhazia are shown as part of Georgia on the map, as they are internationally recognised. The outline of South Ossetia and the Russian-held zones are approximate.: Sydossetien och Abchazien visas som en del av Georgien på kartan, eftersom de internationellt erkänns som sådana. Sydossetiens gränser och de ryskkontrollerade zonerna är ungefärliga.
Exchanges of fire had escalated from 1 August, and some sources date the war from then. Each side’s casualty figures come from its own government.: Skottväxlingarna hade trappats upp från den 1 augusti, och vissa källor räknar krigets början därifrån. Varje sidas förlustsiffror kommer från dess egen regering.
