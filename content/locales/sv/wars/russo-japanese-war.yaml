# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
Russo-Japanese War: Rysk-japanska kriget
A war between the Russian Empire and the Empire of Japan over Manchuria and Korea, fought mostly on Chinese soil and in the seas around Korea. Japan opened it with a surprise torpedo attack on the Russian fleet at Port Arthur (Lüshun) in February 1904, landed armies in Korea and on the Liaodong peninsula, crossed the Yalu and drove the Russians north at Liaoyang. After a five-month siege Port Arthur surrendered in January 1905; in March the Japanese won the vast battle of Mukden (Shenyang), and in May Admiral Tōgō Heihachirō destroyed the Russian Baltic Fleet at Tsushima. With both sides exhausted and Russia shaken by revolution, the Treaty of Portsmouth, mediated by President Theodore Roosevelt, gave Japan the Kwantung lease, the South Manchuria Railway and southern Sakhalin and a free hand in Korea. It was the first victory of an Asian power over a European great power in modern times. Some 80,000 Japanese and 40,000–70,000 Russian soldiers died, as did many Chinese civilians.: Ett krig mellan Ryska riket och Kejsardömet Japan om Manchuriet och Korea, som till största delen utkämpades på kinesisk mark och i haven runt Korea. Japan inledde det med ett överraskande torpedanfall mot den ryska flottan i Port Arthur (Lüshun) i februari 1904, landsatte arméer i Korea och på Liaodonghalvön, gick över Yalu och drev ryssarna norrut vid Liaoyang. Efter en fem månader lång belägring kapitulerade Port Arthur i januari 1905; i mars vann japanerna det väldiga slaget vid Mukden (Shenyang), och i maj förintade amiral Tōgō Heihachirō den ryska Östersjöflottan vid Tsushima. När båda sidor var utmattade och Ryssland skakades av revolution gav freden i Portsmouth, som medlades av president Theodore Roosevelt, Japan arrendeområdet Kwantung, Sydmanchuriska järnvägen och södra Sachalin samt fria händer i Korea. Det var första gången i modern tid som en asiatisk makt besegrade en europeisk stormakt. Omkring 80 000 japanska och 40 000–70 000 ryska soldater dog, liksom många kinesiska civila.
