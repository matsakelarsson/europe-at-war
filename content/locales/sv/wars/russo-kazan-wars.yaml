Russo-Kazan Wars: Rysk-kazanska krigen
A series of wars between Moscow and the Kazan khanate on the middle Volga, founded by Ulugh Muhammad after he beat a Muscovite army at Belyov in 1437. For a century they fought mostly over who should rule in Kazan, with Moscow installing friendly khans whenever it could, until Ivan IV besieged and took Kazan in 1552 and annexed the khanate.: En serie krig mellan Moskva och Kazankhanatet vid mellersta Volga, grundat av Ulugh Muhammad sedan han slagit en moskovitisk här vid Beljov 1437. Under ett sekel stred de mest om vem som skulle härska i Kazan, och Moskva insatte vänligt sinnade khaner närhelst det kunde, tills Ivan IV belägrade och intog Kazan 1552 och annekterade khanatet.
