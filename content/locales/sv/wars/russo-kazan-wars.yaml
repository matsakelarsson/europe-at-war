Dates are Julian (Old Style), as in the Russian chronicles, which are the main source; Tatar accounts are few. The khanate’s founding is dated variously from 1438 to 1445.: Datumen anges enligt den julianska kalendern (gamla stilen), som i de ryska krönikorna, vilka är huvudkällan; tatariska berättelser är få. Khanatets grundande dateras olika, från 1438 till 1445.
Moscow was allied with the Crimean khans from the 1470s until about 1519 and backed the candidates they favoured in Kazan. Later the Crimean Girays put their own relatives on the Kazan throne and the two khanates fought Moscow together.: Moskva var allierat med krimkhanerna från 1470-talet till omkring 1519 och stödde de kandidater i Kazan som de föredrog. Senare satte krimätten Giray sina egna släktingar på Kazans tron, och de två khanaten stred tillsammans mot Moskva.
Rebellions in the countryside after the fall of Kazan lasted until 1556.: Upproren på landsbygden efter Kazans fall varade till 1556.
