When Ivan IV came of age, Moscow set out to end the threat from Kazan for good. His winter campaigns of 1547–1548 and 1549–1550 failed for lack of supplies. In 1551 a wooden fortress, cut and fitted at Uglich, was floated down the Volga and put up in four weeks at Sviyazhsk, about 30 kilometres above Kazan. The peoples on the right bank of the Volga went over to Moscow, and the pro-Russian Shah Ali was briefly restored as khan, but the Kazan nobles soon drove him out and called in a new khan, Yadegar Muhammad, who brought Nogai horsemen.: När Ivan IV blev myndig föresatte sig Moskva att undanröja hotet från Kazan en gång för alla. Hans vinterfälttåg 1547–1548 och 1549–1550 misslyckades på grund av brist på förnödenheter. År 1551 flottades en träfästning, som tillverkats och passats ihop i Uglitj, nedför Volga och restes på fyra veckor vid Svijazjsk, omkring 30 kilometer uppströms Kazan. Folken på Volgas högra strand gick över till Moskva, och den ryssvänlige Sjah Ali återinsattes en kort tid som khan, men Kazans adel drev snart bort honom och kallade in en ny khan, Jadegar Muhammad, som förde med sig nogajiska ryttare.
In June 1552 Ivan led a large army, said to number 150,000, from Moscow. A Crimean attack meant to divert him was beaten off at Tula, and in late August the Russians surrounded Kazan. Their engineers built a wooden siege tower carrying cannon, and sappers blew up the passage to the city’s water source. On 2 October mines brought down the walls, and after hard street fighting the city was taken. Many defenders and inhabitants were killed, and Yadegar Muhammad was captured. Resistance in the countryside lasted until 1556, and Ivan celebrated the victory by building St Basil’s Cathedral in Moscow.: I juni 1552 ledde Ivan en stor här, som sägs ha uppgått till 150 000 man, från Moskva. Ett krimtatariskt anfall som skulle avleda honom slogs tillbaka vid Tula, och i slutet av augusti omringade ryssarna Kazan. Deras ingenjörer byggde ett belägringstorn av trä med kanoner, och minörer sprängde gången till stadens vattentäkt. Den 2 oktober fällde minor murarna, och efter hårda gatustrider intogs staden. Många försvarare och invånare dödades, och Jadegar Muhammad tillfångatogs. Motståndet på landsbygden varade till 1556, och Ivan firade segern genom att bygga Vasilijkatedralen i Moskva.
