Ulugh Muhammad: Ulugh Muhammad
Moscow and Kazan fought a string of short wars, usually over who should be khan. In 1469 Prince Daniil Kholmsky besieged Kazan and forced Khan Ibrahim to free his Russian captives, and nearly twenty years of peace followed. When Ibrahim died, Ivan III, allied with Mengli Giray of Crimea, backed Ibrahim’s son Muhammad Amin, Mengli’s stepson, against his half-brother Ilham. In 1487 Kholmsky took Kazan after a siege of several weeks. Ilham was sent in chains to Vologda, and for most of the next thirty years Kazan was ruled by khans who were allies or protégés of Moscow.: Moskva och Kazan utkämpade en rad korta krig, oftast om vem som skulle vara khan. År 1469 belägrade furst Daniil Cholmskij Kazan och tvingade khan Ibrahim att frige sina ryska fångar, och nästan tjugo års fred följde. När Ibrahim dog stödde Ivan III, allierad med Mengli Giray av Krim, Ibrahims son Muhammad Amin, Menglis styvson, mot hans halvbror Ilham. År 1487 intog Cholmskij Kazan efter en flera veckor lång belägring. Ilham sändes i kedjor till Vologda, och under större delen av de följande trettio åren styrdes Kazan av khaner som var Moskvas bundsförvanter eller skyddslingar.
Muhammad Amin himself broke with Moscow in 1505. The Russian merchants at the Kazan fair were massacred, a Tatar and Nogai army besieged Nizhny Novgorod, and in 1506 a Russian army was routed outside Kazan. In 1521 Sahib Giray, a brother of the Crimean khan, took the throne, and that summer Crimean and Kazan Tatars raided to the outskirts of Moscow and carried off many thousands of captives. Vasily III answered by founding Vasilsursk on the Volga in 1523, banning his subjects from the Kazan fair and sending large armies against Kazan in 1524 and 1530.: Muhammad Amin bröt själv med Moskva 1505. De ryska köpmännen på marknaden i Kazan massakrerades, en tatarisk och nogajisk här belägrade Nizjnij Novgorod, och 1506 slogs en rysk här på flykten utanför Kazan. År 1521 besteg Sahib Giray, en bror till krimkhanen, tronen, och samma sommar plundrade krim- och kazantatarer ända till Moskvas utkanter och förde bort många tusen fångar. Vasilij III svarade med att grunda Vasilsursk vid Volga 1523, förbjuda sina undersåtar att besöka marknaden i Kazan och sända stora härar mot Kazan 1524 och 1530.
