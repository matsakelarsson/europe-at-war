Ulugh Muhammad, once khan of the Golden Horde, lost the struggle for its throne and came north with a small army in 1437. When his Tatars, camped near Belyov on the upper Oka, began raiding, Vasily II of Moscow sent his cousins Dmitry Shemyaka and Dmitry Krasny to drive them off. The Tatars held out in a fort of wicker walls packed with snow and frozen with water, and on 5 December 1437, during peace talks, they attacked through a fog and routed the larger Russian army. Ulugh Muhammad moved to the middle Volga and made Kazan the capital of a new khanate.: Ulugh Muhammad, en gång khan över Gyllene horden, förlorade kampen om dess tron och kom norrut med en liten här 1437. När hans tatarer, som slagit läger nära Beljov vid övre Oka, började plundra sände Vasilij II av Moskva sina kusiner Dmitrij Sjemjaka och Dmitrij Krasnyj för att driva bort dem. Tatarerna höll stånd i ett fort med flätverksväggar packade med snö och frusna med vatten, och den 5 december 1437, under fredsförhandlingar, anföll de genom en dimma och slog den större ryska hären på flykten. Ulugh Muhammad flyttade till mellersta Volga och gjorde Kazan till huvudstad i ett nytt khanat.
In 1439 his Tatars ravaged the outskirts of Moscow while Vasily fled across the Volga, and in 1445 they took Nizhny Novgorod. On 7 July 1445, near the Monastery of St Euthymius at Suzdal, the khan’s sons Mahmud and Yakub beat Vasily’s hastily gathered army and took him prisoner. He was freed in the autumn for an enormous ransom, which weakened him in his war with Shemyaka. Two other sons of the khan later entered Vasily’s service, and in 1452 one of them, Qasim, was given the town later named Kasimov, the seat of a Tatar khanate loyal to Moscow.: År 1439 härjade hans tatarer Moskvas utkanter medan Vasilij flydde över Volga, och 1445 intog de Nizjnij Novgorod. Den 7 juli 1445, nära den helige Euthymios kloster i Suzdal, besegrade khanens söner Mahmud och Jakub Vasilijs hastigt samlade här och tog honom till fånga. Han frigavs på hösten mot en enorm lösensumma, vilket försvagade honom i kriget mot Sjemjaka. Två andra söner till khanen gick senare i Vasilijs tjänst, och 1452 fick en av dem, Kasim, den stad som senare fick namnet Kasimov, säte för ett tatariskt khanat lojalt mot Moskva.
