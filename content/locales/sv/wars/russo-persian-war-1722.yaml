Russian accounts date events in the Julian calendar, eleven days behind the Gregorian; the Treaty of Saint Petersburg was signed on 12 September 1723 Old Style, 23 September New Style.: Ryska källor daterar händelserna enligt den julianska kalendern, elva dagar efter den gregorianska; fördraget i Sankt Petersburg undertecknades den 12 september 1723 enligt gamla stilen, den 23 september enligt nya stilen.
Known in Russian historiography as the Persian campaign of Peter the Great. The 1724 Treaty of Constantinople then divided the Persian lands in the Caucasus between Russia and the Ottoman Empire.: Kallas i rysk historieskrivning Peter den stores persiska fälttåg. Genom fördraget i Konstantinopel 1724 delades sedan de persiska områdena i Kaukasus mellan Ryssland och Osmanska riket.
