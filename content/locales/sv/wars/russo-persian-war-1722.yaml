Russo-Persian War of 1722–1723: Rysk-persiska kriget 1722–1723
Peter the Great’s campaign along the western shore of the Caspian Sea, launched as Safavid Persia collapsed under an Afghan invasion. Russian forces took Derbent in 1722 and Rasht and Baku in 1723, and by the Treaty of Saint Petersburg that September the shah’s envoy ceded Derbent, Baku and the provinces of Shirvan, Gilan, Mazandaran and Astarabad. Disease killed many thousands of the occupying troops, and Russia gave the lands back in 1732 and 1735.: Peter den stores fälttåg längs Kaspiska havets västra strand, inlett när det safavidiska Persien föll samman under en afghansk invasion. Ryska styrkor intog Derbent 1722 och Rasht och Baku 1723, och genom fördraget i Sankt Petersburg i september samma år avträdde shahens sändebud Derbent, Baku och provinserna Shirvan, Gilan, Mazandaran och Astarabad. Sjukdomar dödade många tusen av ockupationstrupperna, och Ryssland lämnade tillbaka områdena 1732 och 1735.
