Russo-Persian War of 1804–1813: Rysk-persiska kriget 1804–1813
A war between the Russian Empire and Qajar Persia over eastern Georgia, which Russia had annexed in 1801, and the khanates of the eastern Caucasus. After a long and mostly indecisive struggle, Russian victories at Aslanduz and Lankaran forced Persia to accept the Treaty of Gulistan in 1813, which gave Russia Dagestan, eastern Georgia and most of today’s Azerbaijan.: Ett krig mellan Ryska riket och Qajarernas Persien om östra Georgien, som Ryssland hade annekterat 1801, och khanaten i östra Kaukasus. Efter en lång och mestadels oavgjord kamp tvingade ryska segrar vid Aslanduz och Lankaran Persien att godta fördraget i Gulistan 1813, som gav Ryssland Dagestan, östra Georgien och större delen av dagens Azerbajdzjan.
