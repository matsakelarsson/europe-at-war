Persian success: Persiska framgångar
Russia annexed the eastern Georgian kingdom of Kartli-Kakheti in 1801, and its new commander in the Caucasus, the Georgian-born Prince Pavel Tsitsianov, set out to bring the neighbouring khanates under Russian rule. On 15 January 1804 he stormed Ganja after a month’s siege. Javad Khan died fighting on the walls, and between 1,500 and 3,000 of the defenders and townspeople were killed. Fath-Ali Shah demanded that the Russians leave the Caucasus, and in June his heir, Abbas Mirza, marched on Erivan with a large army.: Ryssland annekterade det östgeorgiska kungariket Kartli-Kachetien 1801, och dess nye befälhavare i Kaukasus, den georgiskfödde fursten Pavel Tsitsianov, föresatte sig att föra de angränsande khanaten under ryskt styre. Den 15 januari 1804 stormade han Ganja efter en månads belägring. Javad khan stupade på murarna, och mellan 1 500 och 3 000 av försvararna och stadsborna dödades. Fath Ali shah krävde att ryssarna skulle lämna Kaukasus, och i juni marscherade hans arvinge Abbas Mirza mot Erivan med en stor armé.
Tsitsianov fought Abbas Mirza at Echmiadzin and besieged Erivan, but ran short of food and fell back to Tiflis in September, having lost about half his men. In 1805 the khans of Karabakh, Sheki and Shirvan accepted Russian overlordship, and small Russian detachments held off Persian attacks in Karabakh. In February 1806 Tsitsianov was shot dead outside Baku while receiving the keys of the city, but later that year Russian troops took Derbent, Quba and Baku. War with the Ottomans from December 1806 then drew Russian forces west.: Tsitsianov drabbade samman med Abbas Mirza vid Etjmiadzin och belägrade Erivan, men fick ont om livsmedel och drog sig i september tillbaka till Tiflis efter att ha förlorat ungefär hälften av sina män. År 1805 erkände khanerna av Karabach, Sjeki och Shirvan rysk överhöghet, och små ryska avdelningar slog tillbaka persiska anfall i Karabach. I februari 1806 sköts Tsitsianov ihjäl utanför Baku när han skulle ta emot stadens nycklar, men senare samma år intog ryska trupper Derbent, Quba och Baku. Kriget med osmanerna från december 1806 drog sedan de ryska styrkorna västerut.
