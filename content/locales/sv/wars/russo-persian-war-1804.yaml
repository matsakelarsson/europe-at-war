Dates are New Style (Gregorian). Russian accounts use the Julian calendar, then 12 days behind, so the storming of Ganja is 3 January 1804 and the Battle of Aslanduz 19–20 October 1812 in Russian sources.: Datumen följer nya stilen (gregoriansk kalender). Ryska källor använder den julianska kalendern, då 12 dagar efter, så stormningen av Ganja anges där till den 3 januari 1804 och slaget vid Aslanduz till 19–20 oktober 1812.
The khanates were local Muslim principalities under Persian overlordship. Persia did not accept their loss until 1813, so the base map shows them as Persian until the Treaty of Gulistan.: Khanaten var lokala muslimska furstendömen under persisk överhöghet. Persien godtog inte förlusten av dem förrän 1813, så baskartan visar dem som persiska fram till fördraget i Gulistan.
Ganja, renamed Yelizavetpol by the Russians, is shown under its present name.: Ganja, som ryssarna döpte om till Jelizavetpol, visas under sitt nuvarande namn.
