After a short bombardment the fort was stormed and its defenders killed almost to a man. Kotlyarevsky was found badly wounded among the dead.: Efter en kort beskjutning stormades fortet och dess försvarare dödades nästan till sista man. Kotljarevskij hittades svårt sårad bland de döda.
Signed in a village in Karabakh. Its vague borders, above all north of Erivan and in Talysh, led to a new war in 1826.: Undertecknat i en by i Karabach. Dess vaga gränser, framför allt norr om Erivan och i Talysh, ledde till ett nytt krig 1826.
