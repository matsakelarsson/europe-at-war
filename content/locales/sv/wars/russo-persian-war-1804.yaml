For six years neither side could win. Abbas Mirza modernised his army with French and then British officers, a Russian assault on Erivan failed in 1808, and early in 1812 a Persian force captured a whole Russian battalion near Sultanabad in Karabakh. Peace with the Ottomans at Bucharest in May 1812 freed Russian troops. On the night of 31 October General Pyotr Kotlyarevsky, with about 2,000 men, crossed the Aras and routed Abbas Mirza’s much larger army at Aslanduz.: Under sex år kunde ingen av parterna vinna. Abbas Mirza moderniserade sin armé med hjälp av först franska och sedan brittiska officerare, ett ryskt anfall mot Erivan misslyckades 1808, och i början av 1812 tillfångatog en persisk styrka en hel rysk bataljon nära Sultanabad i Karabach. Freden med osmanerna i Bukarest i maj 1812 frigjorde ryska trupper. Natten till den 31 oktober gick general Pjotr Kotljarevskij med omkring 2 000 man över Aras och slog Abbas Mirzas betydligt större armé på flykten vid Aslanduz.
Kotlyarevsky then marched across the snow-covered Mughan steppe and on 13 January 1813 stormed the new Persian fort at Lankaran. Almost all of its garrison of about 4,000 were killed, and the Russians lost some two-thirds of their attacking force. With Napoleon in retreat, Britain urged its Persian ally to make peace. The Treaty of Gulistan, signed on 24 October 1813 with a British envoy as mediator, gave Russia Dagestan, eastern Georgia and the khanates north of the Aras, and the sole right to keep warships on the Caspian Sea.: Kotljarevskij marscherade sedan över den snötäckta Mughanstäppen och stormade den 13 januari 1813 det nya persiska fortet vid Lankaran. Nästan hela dess garnison på omkring 4 000 man dödades, och ryssarna förlorade ungefär två tredjedelar av sin anfallsstyrka. När Napoleon var på reträtt uppmanade Storbritannien sin persiska bundsförvant att sluta fred. Fördraget i Gulistan, undertecknat den 24 oktober 1813 med ett brittiskt sändebud som medlare, gav Ryssland Dagestan, östra Georgien och khanaten norr om Aras samt ensamrätt att hålla krigsfartyg på Kaspiska havet.
