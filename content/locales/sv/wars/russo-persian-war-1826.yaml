Persian success: Persiska framgångar
Persia had never accepted the loss of the khanates in 1813, and the border was vague in places. When Russian troops occupied the north shore of Lake Sevan in 1825, the clergy and the exiled khans at the shah’s court called for holy war. News of Alexander I’s death and of the Decembrist revolt suggested that Russia was weak. In July 1826 the crown prince, Abbas Mirza, crossed the Aras with a large army. Much of the Muslim population of Karabakh, Ganja, Shirvan, Sheki and Talysh rose against Russian rule, and the Persians took Lankaran.: Persien hade aldrig godtagit förlusten av khanaten 1813, och gränsen var på sina håll oklar. När ryska trupper 1825 besatte Sevansjöns norra strand krävde prästerskapet och de landsflyktiga khanerna vid shahens hov heligt krig. Nyheterna om Alexander I:s död och dekabristupproret tydde på att Ryssland var svagt. I juli 1826 gick kronprinsen Abbas Mirza över Aras med en stor armé. Stora delar av den muslimska befolkningen i Karabach, Ganja, Shirvan, Sjeki och Talysh reste sig mot det ryska styret, och perserna intog Lankaran.
Yermolov, short of troops, pulled many of his garrisons back towards Tiflis. In Karabakh only the fortress of Shusha held out, for seven weeks, under Colonel Iosif Reut with the help of local Armenians. Reinforcements arrived from Russia, and in September General Valerian Madatov beat a Persian force at Shamkir and retook Ganja. On 25 September General Ivan Paskevich, with about 10,000 men, defeated Abbas Mirza’s main army of some 30,000 outside Ganja. The Persians lifted the siege of Shusha and fell back across the Aras.: Jermolov, som hade ont om trupper, drog tillbaka många av sina garnisoner mot Tiflis. I Karabach höll endast fästningen Sjusja stånd, i sju veckor, under överste Iosif Reut med hjälp av lokala armenier. Förstärkningar anlände från Ryssland, och i september besegrade general Valerian Madatov en persisk styrka vid Sjamkir och återtog Ganja. Den 25 september besegrade general Ivan Paskevitj med omkring 10 000 man Abbas Mirzas huvudarmé på omkring 30 000 man utanför Ganja. Perserna hävde belägringen av Sjusja och drog sig tillbaka över Aras.
