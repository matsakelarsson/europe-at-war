Paskevich replaced Yermolov in 1827 and carried the war south. He took Echmiadzin in April and Nakhchivan in June, and in July the fortress of Abbasabad on the Aras surrendered after he beat a Persian relief army. In August Abbas Mirza besieged Echmiadzin, and General Afanasy Krasovsky’s column broke through to it at Oshakan, with heavy losses. Erivan’s citadel surrendered on 13 October 1827 after a short siege and bombardment, and late that month Russian troops entered Tabriz, the chief city of Persian Azerbaijan, without a fight.: Paskevitj efterträdde Jermolov 1827 och förde kriget söderut. Han intog Etjmiadzin i april och Nachitjevan i juni, och i juli kapitulerade fästningen Abbasabad vid Aras sedan han slagit en persisk undsättningsarmé. I augusti belägrade Abbas Mirza Etjmiadzin, och general Afanasij Krasovskijs kolonn slog sig igenom dit vid Oshakan, med svåra förluster. Erivans citadell kapitulerade den 13 oktober 1827 efter en kort belägring och beskjutning, och i slutet av samma månad ryckte ryska trupper utan strid in i Tabriz, huvudstaden i persiska Azerbajdzjan.
With Russian forces able to advance on Tehran, Persia made peace. The Treaty of Turkmenchay, signed in a village between Tabriz and Tehran on 22 February 1828, gave Russia the khanates of Erivan and Nakhchivan and set the border on the Aras. Persia paid 20 million silver roubles, confirmed Russia’s sole right to warships on the Caspian and granted Russian subjects legal privileges. Tens of thousands of Armenians moved from Persia into the new Russian lands, while many Muslims left them. In 1829 a mob in Tehran killed the Russian envoy, the playwright Alexander Griboyedov, and most of his mission.: Eftersom de ryska styrkorna kunde rycka fram mot Teheran slöt Persien fred. Fördraget i Turkmenchay, undertecknat i en by mellan Tabriz och Teheran den 22 februari 1828, gav Ryssland khanaten Erivan och Nachitjevan och drog gränsen vid Aras. Persien betalade 20 miljoner silverrubel, bekräftade Rysslands ensamrätt till krigsfartyg på Kaspiska havet och gav ryska undersåtar rättsliga privilegier. Tiotusentals armenier flyttade från Persien till de nya ryska områdena, medan många muslimer lämnade dem. År 1829 dödade en folkmassa i Teheran det ryska sändebudet, dramatikern Aleksandr Gribojedov, och större delen av hans beskickning.
