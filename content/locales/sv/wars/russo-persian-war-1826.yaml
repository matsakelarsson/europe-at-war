Russo-Persian War of 1826–1828: Rysk-persiska kriget 1826–1828
The last war between the Russian Empire and Qajar Persia, begun by Persia to win back the lands it had lost in 1813. After early Persian successes, Russian victories at Ganja and the capture of Erivan and Tabriz led to the Treaty of Turkmenchay in 1828, by which Persia gave up the khanates of Erivan and Nakhchivan and accepted the Aras as its border.: Det sista kriget mellan Ryska riket och Qajarernas Persien, inlett av Persien för att återvinna de områden det förlorat 1813. Efter inledande persiska framgångar ledde ryska segrar vid Ganja och erövringen av Erivan och Tabriz till fördraget i Turkmenchay 1828, genom vilket Persien avstod khanaten Erivan och Nachitjevan och godtog Aras som gräns.
