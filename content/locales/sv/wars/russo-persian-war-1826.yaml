Dates are New Style (Gregorian). Russian accounts use the Julian calendar, then 12 days behind, so the Battle of Ganja is 13 September 1826 and the fall of Erivan 1 October 1827 in Russian sources. The Treaty of Turkmenchay is usually dated 22 February 1828 (10 February Old Style); some sources give 21 February.: Datumen följer nya stilen (gregoriansk kalender). Ryska källor använder den julianska kalendern, då 12 dagar efter, så slaget vid Ganja anges där till den 13 september 1826 och Erivans fall till den 1 oktober 1827. Fördraget i Turkmenchay dateras vanligen till den 22 februari 1828 (10 februari enligt gamla stilen); vissa källor anger den 21 februari.
Ganja, then called Yelizavetpol by the Russians, and Erivan, today’s Yerevan, are given their usual names of the time in the text.: Ganja, som ryssarna då kallade Jelizavetpol, och Erivan, dagens Jerevan, ges i texten sina vanliga namn från tiden.
