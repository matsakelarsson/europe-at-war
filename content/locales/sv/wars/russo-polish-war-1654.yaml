Russo-Polish War, 1654–1667: Rysk-polska kriget 1654–1667
After the Cossack Hetmanate accepted the tsar’s protection, Russia invaded Poland–Lithuania, took Smolensk and Vilnius and occupied much of the Grand Duchy. The Commonwealth fought back from 1658, but at Andrusovo in 1667 it gave up Smolensk, Kyiv and Ukraine east of the Dnieper.: Sedan kosackhetmanatet ställt sig under tsarens beskydd invaderade Ryssland Polen–Litauen, intog Smolensk och Vilnius och ockuperade stora delar av storfurstendömet. Samväldet slog tillbaka från 1658, men i Andrusovo 1667 avstod det Smolensk, Kyiv och Ukraina öster om Dnepr.
