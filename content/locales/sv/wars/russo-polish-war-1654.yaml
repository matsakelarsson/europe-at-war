Occupied by Russia, 1655: Ockuperat av Ryssland 1655
War resumed in 1658. That September Hetman Ivan Vyhovsky signed the Treaty of Hadiach, which was to make the Cossack lands a third member of the Commonwealth, and in 1659 his Cossacks and their Tatar allies inflicted a heavy defeat on a Russian army at Konotop. The Hetmanate soon split again, but the Commonwealth, at peace with Sweden from May 1660, could now turn east.: Kriget återupptogs 1658. I september samma år undertecknade hetman Ivan Vyhovskyj fördraget i Hadiach, som skulle göra kosackernas land till en tredje medlem av samväldet, och 1659 tillfogade hans kosacker och deras tatariska bundsförvanter en rysk armé ett svårt nederlag vid Konotop. Hetmanatet splittrades snart på nytt, men samväldet, som hade fred med Sverige från maj 1660, kunde nu vända sig österut.
On 27 June 1660 Stefan Czarniecki and Paweł Sapieha crushed Ivan Khovansky’s army at Polonka in Lithuania. In Ukraine Stanisław Potocki and Jerzy Lubomirski, with Tatar help, surrounded Vasily Sheremetev’s army at Chudniv; the Cossacks of Yurii Khmelnytsky changed sides, and Sheremetev surrendered in early November. In December 1661 the Russian garrison in Vilnius castle gave up after a long siege.: Den 27 juni 1660 krossade Stefan Czarniecki och Paweł Sapieha Ivan Chovanskijs armé vid Polonka i Litauen. I Ukraina omringade Stanisław Potocki och Jerzy Lubomirski med tatarisk hjälp Vasilij Sjeremetevs armé vid Tjudniv; Jurij Chmelnytskyjs kosacker bytte sida, och Sjeremetev kapitulerade i början av november. I december 1661 gav den ryska garnisonen i Vilnius slott upp efter en lång belägring.
