Battle of Polonka: Slaget vid Polonka
27 June 1660: 27 juni 1660
Czarniecki and Sapieha destroyed Khovansky’s army, ending the Russian threat to central Lithuania.: Czarniecki och Sapieha förintade Chovanskijs armé, vilket gjorde slut på det ryska hotet mot centrala Litauen.
Battle of Chudniv: Slaget vid Tjudniv
September – November 1660: september – november 1660
Sheremetev’s army, abandoned by its Cossack allies, surrendered. He spent more than twenty years in Tatar captivity.: Sjeremetevs armé, övergiven av sina kosackiska bundsförvanter, kapitulerade. Han tillbringade mer än tjugo år i tatarisk fångenskap.
Vilnius castle: Vilnius slott
December 1661: december 1661
The starving Russian garrison surrendered. Its commander, Danila Myshetsky, was tried and executed.: Den svältande ryska garnisonen kapitulerade. Dess befälhavare, Danila Mysjetskij, ställdes inför rätta och avrättades.
Neither side could finish the war. John II Casimir led an army across the Dnieper in the winter of 1663–1664 but failed before Hlukhiv and had to retreat with heavy losses. Ukraine was now split between rival hetmans on the two banks of the Dnieper, a time Ukrainians call the Ruin, and in 1665–1666 the Commonwealth was paralysed by Jerzy Lubomirski’s rebellion against the king.: Ingen av parterna kunde avgöra kriget. Johan II Kasimir förde en armé över Dnepr vintern 1663–1664 men misslyckades vid Hluchiv och tvingades retirera med svåra förluster. Ukraina var nu delat mellan rivaliserande hetmaner på Dneprs båda stränder, en tid som ukrainarna kallar Ruinen, och 1665–1666 lamslogs samväldet av Jerzy Lubomirskis uppror mot kungen.
At the village of Andrusovo near Smolensk the two sides signed a truce for thirteen and a half years in January 1667. Russia kept Smolensk and the Chernihiv–Seversk lands and gained Ukraine east of the Dnieper, while the Commonwealth kept the right bank and got back Vitebsk, Polotsk and Daugavpils. Kyiv, on the right bank, was to stay Russian for two years only, but it was never returned, and the Eternal Peace of 1686 made the settlement permanent.: I byn Andrusovo nära Smolensk undertecknade de båda sidorna i januari 1667 ett stillestånd på tretton och ett halvt år. Ryssland behöll Smolensk och Tjernihiv–Seversk-länderna och fick Ukraina öster om Dnepr, medan samväldet behöll den högra stranden och fick tillbaka Vitebsk, Polotsk och Daugavpils. Kyiv, på den högra stranden, skulle vara ryskt i endast två år, men staden återlämnades aldrig, och den eviga freden 1686 gjorde uppgörelsen permanent.
Truce of Andrusovo: Stilleståndet i Andrusovo
