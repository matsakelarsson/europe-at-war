Dates are New Style (Gregorian), as used in Poland–Lithuania. Russian sources, in the Julian calendar, give dates ten days earlier.: Datumen följer nya stilen (gregoriansk kalender), som användes i Polen–Litauen. Ryska källor, som följer den julianska kalendern, anger datum tio dagar tidigare.
The Cossacks fought on Russia’s side until 1658, then split, some hetmans siding with Poland and others with Russia.: Kosackerna stred på rysk sida fram till 1658 och splittrades sedan, så att vissa hetmaner ställde sig på Polens sida och andra på Rysslands.
Having taken the Cossack Hetmanate under his protection at Pereiaslav, Tsar Alexis went to war with Poland–Lithuania in 1654. Russian armies, joined by Cossacks under Ivan Zolotarenko, poured into the Grand Duchy of Lithuania. They beat Janusz Radziwiłł at Shepeleviche in August, and Smolensk, lost to Lithuania in 1611, surrendered that autumn after a long siege. Polotsk, Vitebsk and Mogilev fell too.: Sedan tsar Aleksej tagit kosackhetmanatet under sitt beskydd i Perejaslav gick han 1654 i krig mot Polen–Litauen. Ryska arméer, förstärkta med kosacker under Ivan Zolotarenko, strömmade in i storfurstendömet Litauen. De slog Janusz Radziwiłł vid Sjepelevitje i augusti, och Smolensk, som Litauen förlorat 1611, kapitulerade samma höst efter en lång belägring. Även Polotsk, Vitebsk och Mogiljov föll.
In 1655 the invaders took Minsk, and on 8 August Vilnius, the capital, fell for the first time in its history. For days soldiers and Cossacks looted the city and killed its people, and the Jewish quarter was burned; an eyewitness’s figures of a 17-day fire and over 20,000 dead are thought exaggerated. Alexis styled himself Grand Duke of Lithuania. When Sweden overran the rest of the Commonwealth that summer, Russia came to see it as the greater threat, and in November 1656 the two sides agreed a truce near Vilnius.: År 1655 intog angriparna Minsk, och den 8 augusti föll huvudstaden Vilnius för första gången i sin historia. I flera dagar plundrade soldater och kosacker staden och dödade dess invånare, och det judiska kvarteret brändes; ett ögonvittnes uppgifter om en brand som varade i 17 dagar och över 20 000 döda anses överdrivna. Aleksej kallade sig storfurste av Litauen. När Sverige samma sommar överskred resten av samväldet kom Ryssland att se Sverige som det större hotet, och i november 1656 kom de båda sidorna överens om ett stillestånd nära Vilnius.
