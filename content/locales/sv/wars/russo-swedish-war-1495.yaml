Russo-Swedish War, 1495–1497: Rysk-svenska kriget 1495–1497
A war between Sweden under the regent Sten Sture and Ivan III’s Muscovy, allied with King Hans of Denmark. The Russians besieged Viborg in 1495 and the Swedes stormed Ivangorod in 1496, before a truce in 1497 left the border unchanged.: Ett krig mellan Sverige under riksföreståndaren Sten Sture och Ivan III:s storfurstendöme Moskva, allierat med kung Hans av Danmark. Ryssarna belägrade Viborg 1495 och svenskarna stormade Ivangorod 1496, innan ett stillestånd 1497 lämnade gränsen oförändrad.
