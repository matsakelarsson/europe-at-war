Moscow had swallowed Novgorod in 1478 and inherited its quarrel with Sweden. In 1495 Ivan III, allied with King Hans of Denmark against Sten Sture, sent a large army to besiege Viborg. The commander Knut Posse held out, and the siege is remembered for the “Viborg Bang”, a huge explosion that, according to legend, scattered the attackers.: Moskva hade slukat Novgorod 1478 och ärvt dess tvist med Sverige. År 1495 sände Ivan III, allierad med kung Hans av Danmark mot Sten Sture, en stor här för att belägra Viborg. Befälhavaren Knut Posse höll stånd, och belägringen är ihågkommen för ”Viborgska smällen”, en väldig explosion som enligt legenden skingrade angriparna.
In August 1496 a Swedish force crossed the Gulf of Finland and stormed the new Russian fortress of Ivangorod opposite Narva. A six-year truce ended the war in March 1497. That same year King Hans defeated Sture and took the Swedish throne, though only for a few years.: I augusti 1496 gick en svensk styrka över Finska viken och stormade den nya ryska fästningen Ivangorod mitt emot Narva. Ett sexårigt stillestånd avslutade kriget i mars 1497. Samma år besegrade kung Hans Sture och besteg den svenska tronen, om än bara för några år.
