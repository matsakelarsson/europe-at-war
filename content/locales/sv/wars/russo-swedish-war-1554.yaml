Russo-Swedish War, 1554–1557: Rysk-svenska kriget 1554–1557
A border war between Gustav Vasa’s Sweden and Ivan IV’s Russia in Karelia, with a failed Swedish siege of Nöteborg and a Russian raid around Viborg, ended by a forty-year truce at Novgorod in 1557 that left the border unchanged.: Ett gränskrig i Karelen mellan Gustav Vasas Sverige och Ivan IV:s Ryssland, med en misslyckad svensk belägring av Nöteborg och ett ryskt härjningståg kring Viborg, som avslutades med ett fyrtioårigt stillestånd i Novgorod 1557 som lämnade gränsen oförändrad.
