Border clashes in Karelia turned into war in 1554. Ivan IV, “the Terrible”, refused to treat Gustav as an equal and made his envoys deal with the governor of Novgorod instead. In 1555 a Swedish army under Admiral Jakob Bagge besieged Nöteborg, but the siege was badly planned and failed.: Gränsstrider i Karelen övergick 1554 i krig. Ivan IV, ”den förskräcklige”, vägrade att behandla Gustav som en jämlike och lät i stället hans sändebud förhandla med ståthållaren i Novgorod. År 1555 belägrade en svensk här under amiral Jakob Bagge Nöteborg, men belägringen var dåligt planerad och misslyckades.
That winter a Russian army struck back, plundering the land around Viborg without trying to take the town. Gustav asked for peace, and the Treaty of Novgorod in 1557 brought a forty-year truce, with the border unchanged.: Samma vinter slog en rysk här tillbaka och plundrade trakten kring Viborg utan att försöka inta staden. Gustav bad om fred, och freden i Novgorod 1557 gav ett stillestånd på fyrtio år, med oförändrad gräns.
