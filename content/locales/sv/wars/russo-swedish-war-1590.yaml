When the truce ran out in 1590, Boris Godunov’s Russia attacked to win back the coast. In January 1590 a Russian army crossed the Narva river and besieged Narva, which held, but Jama fell within two weeks, and the local Swedish commander signed an armistice handing back Jama, Koporye and Ivangorod.: När stilleståndet löpte ut 1590 angrep Boris Godunovs Ryssland för att återvinna kusten. I januari 1590 gick en rysk här över Narvafloden och belägrade Narva, som höll stånd, men Jama föll inom två veckor, och den lokale svenske befälhavaren undertecknade ett vapenstillestånd som lämnade tillbaka Jama, Koporje och Ivangorod.
King John III would not accept it, and fighting dragged on until talks began in 1593. The Treaty of Teusina on 18 May 1595 returned Ingria and Kexholm to Russia, but Russia gave up all claims to Estonia and Narva. It replaced the Treaty of Nöteborg of 1323 as the basis of the border.: Kung Johan III ville inte godta det, och striderna drog ut på tiden tills förhandlingar inleddes 1593. Genom freden i Teusina den 18 maj 1595 återfick Ryssland Ingermanland och Kexholm, men Ryssland avsade sig alla anspråk på Estland och Narva. Freden ersatte freden i Nöteborg 1323 som grund för gränsen.
