Signed at the village of Tyavzino in Ingria. It restored the borders from before the Livonian War, except that Narva and Estonia stayed Swedish.: Undertecknad i byn Tjavzino i Ingermanland. Den återställde gränserna från tiden före Livländska kriget, utom att Narva och Estland förblev svenska.
