Russo-Swedish War, 1590–1595: Rysk-svenska kriget 1590–1595
A war in which Boris Godunov’s Russia won back Ingria and Kexholm from Sweden but failed to take Narva; the Treaty of Teusina in 1595 left Estonia and Narva Swedish and replaced the Treaty of Nöteborg of 1323 as the basis of the border.: Ett krig där Boris Godunovs Ryssland återvann Ingermanland och Kexholm från Sverige men misslyckades med att inta Narva; freden i Teusina 1595 lämnade Estland och Narva svenska och ersatte freden i Nöteborg 1323 som grund för gränsen.
