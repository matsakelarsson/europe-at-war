Gustav III’s Russian War: Gustav III:s ryska krig
Gustav III’s attempt to win back land from Russia while it was fighting the Ottomans, which briefly brought Denmark–Norway into the war as Russia’s ally. After sea battles in the Gulf of Finland, including the great Swedish victory at Svensksund, the Treaty of Värälä in 1790 restored the pre-war borders.: Gustav III:s försök att återvinna land från Ryssland medan det förde krig mot osmanerna, vilket för en kort tid drog in Danmark–Norge i kriget som Rysslands bundsförvant. Efter sjöslag i Finska viken, däribland den stora svenska segern vid Svensksund, återställde freden i Värälä 1790 gränserna från före kriget.
