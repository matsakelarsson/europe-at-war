Swedish fleet: Svenska flottan
In 1790 Gustav III tried again to strike at St Petersburg by sea. The Swedish battle fleet and galley fleet, with the king aboard, were trapped by the Russians in the Bay of Viborg for a month. On 3–4 July they broke out through the Russian lines, but lost six ships of the line and four frigates.: År 1790 försökte Gustav III på nytt att slå mot Sankt Petersburg från sjön. Den svenska slagflottan och galärflottan, med kungen ombord, blev instängda av ryssarna i Viborgska viken i en månad. Den 3–4 juli bröt de sig ut genom de ryska linjerna men förlorade sex linjeskepp och fyra fregatter.
Days later, on 9–10 July 1790, the Swedish galley fleet turned on its pursuers at Svensksund and won the biggest naval victory in Swedish history, the largest naval battle ever fought in the Baltic. Russia agreed to talk, and the Treaty of Värälä on 14 August 1790 ended the war without any change of borders.: Några dagar senare, den 9–10 juli 1790, vände den svenska galärflottan sig mot sina förföljare vid Svensksund och vann den största sjösegern i svensk historia, i det största sjöslag som någonsin utkämpats i Östersjön. Ryssland gick med på förhandlingar, och freden i Värälä den 14 augusti 1790 avslutade kriget utan några gränsförändringar.
