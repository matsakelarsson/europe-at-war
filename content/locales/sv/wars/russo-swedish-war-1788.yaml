Gustav III attacked Russia in June 1788 while it was busy fighting the Ottomans, hoping for a quick success. On 17 July the Swedish and Russian battle fleets fought an indecisive battle off Hogland in the Gulf of Finland, and the plan to land near St Petersburg came to nothing. In August officers of the army in Finland signed the Anjala declaration and wrote to Catherine II behind the king’s back.: Gustav III angrep Ryssland i juni 1788 medan landet var upptaget av kriget mot osmanerna, i hopp om en snabb framgång. Den 17 juli utkämpade den svenska och den ryska slagflottan ett oavgjort slag vid Hogland i Finska viken, och planen att landstiga nära Sankt Petersburg blev om intet. I augusti undertecknade officerare i armén i Finland Anjalaförsäkran och skrev till Katarina II bakom kungens rygg.
Denmark–Norway, Russia’s ally, then invaded western Sweden from Norway in September 1788. Within a week the invaders took Uddevalla, Vänersborg and Åmål, but they were stopped at Gothenburg and soon withdrew under British and Prussian pressure. Swedes call it the Theatre War. In 1789 a Russian galley fleet beat the Swedish one at the first Battle of Svensksund on 24 August.: Danmark–Norge, Rysslands bundsförvant, invaderade därefter västra Sverige från Norge i september 1788. Inom en vecka intog angriparna Uddevalla, Vänersborg och Åmål, men de stoppades vid Göteborg och drog sig snart tillbaka under brittiskt och preussiskt tryck. Svenskarna kallar det teaterkriget. År 1789 besegrade en rysk galärflotta den svenska i första slaget vid Svensksund den 24 augusti.
