Also called the Chyhyryn campaigns. Some accounts date the war from 1672, when the Ottomans invaded Podolia.: Kallas även Tjyhyrynfälttågen. Vissa framställningar daterar kriget från 1672, då osmanerna invaderade Podolien.
The Treaty of Bakhchisarai is dated 3 January 1681 in the Julian calendar used in Russia, 13 January in the Gregorian calendar.: Freden i Bachtjisaraj dateras till den 3 januari 1681 enligt den julianska kalender som användes i Ryssland, den 13 januari enligt den gregorianska kalendern.
