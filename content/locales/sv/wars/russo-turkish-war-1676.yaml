Russo-Turkish War of 1676–1681: Rysk-turkiska kriget 1676–1681
A war between Russia and the Cossack Hetmanate of left-bank Ukraine on one side and the Ottoman Empire and the Crimean Khanate on the other, fought above all for Chyhyryn, the Cossack capital that the Ottoman vassal hetman Petro Doroshenko surrendered to Russian and Cossack forces in 1676. The Ottomans failed to take it in 1677 but took and destroyed it in 1678. The Treaty of Bakhchisarai of 1681, a twenty-year truce, made the Dnieper the border and left Kyiv to Russia.: Ett krig mellan Ryssland och kosackhetmanatet på Dneprs vänstra strand å ena sidan och Osmanska riket och Krimkhanatet å den andra, utkämpat framför allt om Tjyhyryn, den kosackhuvudstad som den osmanske vasallhetmanen Petro Dorosjenko överlämnade till ryska och kosackiska styrkor 1676. Osmanerna misslyckades med att inta staden 1677 men intog och förstörde den 1678. Freden i Bachtjisaraj 1681, ett tjugoårigt stillestånd, gjorde Dnepr till gräns och lämnade Kyiv åt Ryssland.
