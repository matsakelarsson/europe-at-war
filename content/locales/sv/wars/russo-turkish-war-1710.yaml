Peter marched south along the right bank of the Pruth, while a detachment under General Carl Ewald von Rönne, joined by Wallachian troops whose commander Toma Cantacuzino had defied his prince, took the Ottoman port of Brăila on 14 July. On 18–19 July janissaries and Tatars crossed the Pruth and drove back the Russian advance guard, and Peter fell back into a fortified camp at Stănilești. The Ottomans surrounded it. Their assaults were beaten off with heavy losses, but their guns kept the Russians from the river, and the army, fewer than 40,000 Russians and a few thousand Moldavians, was soon short of water and food.: Peter marscherade söderut längs Pruts högra strand, medan en avdelning under general Carl Ewald von Rönne, förstärkt med valakiska trupper vars befälhavare Toma Cantacuzino hade trotsat sin furste, intog den osmanska hamnstaden Brăila den 14 juli. Den 18–19 juli gick janitsjarer och tatarer över Prut och drev tillbaka den ryska förtruppen, och Peter drog sig tillbaka till ett befäst läger vid Stănilești. Osmanerna omringade det. Deras stormningar slogs tillbaka med svåra förluster, men deras kanoner höll ryssarna borta från floden, och armén, färre än 40 000 ryssar och några tusen moldaver, fick snart ont om vatten och mat.
Peter sent his vice-chancellor, Pyotr Shafirov, to the grand vizier, ready to give up a great deal. Under the Treaty of the Pruth, signed on 23 July, Russia was to hand back Azov, raze Taganrog and other new forts in the south, keep out of Polish affairs and let Charles XII go home. Shafirov and Mikhail Sheremetev, the field marshal’s son, went to Constantinople as hostages, and to Charles’s fury the Russian army was allowed to march away. Peter delayed handing over Azov, the Ottomans declared war twice more, and the Treaty of Adrianople in June 1713 confirmed the terms. Cantemir went into exile in Russia.: Peter sände sin vicekansler Pjotr Sjafirov till storvesiren, beredd att ge upp mycket. Enligt freden vid Prut, undertecknad den 23 juli, skulle Ryssland lämna tillbaka Azov, rasera Taganrog och andra nya fästningar i söder, hålla sig utanför polska angelägenheter och låta Karl XII resa hem. Sjafirov och Michail Sjeremetev, fältmarskalkens son, reste till Konstantinopel som gisslan, och till Karls ursinne fick den ryska armén marschera bort. Peter dröjde med att överlämna Azov, osmanerna förklarade krig ytterligare två gånger, och freden i Adrianopel i juni 1713 bekräftade villkoren. Cantemir gick i landsflykt i Ryssland.
