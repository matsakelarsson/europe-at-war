Russo-Turkish War of 1710–1711: Rysk-turkiska kriget 1710–1711
A war that grew out of the Great Northern War, after Charles XII of Sweden took refuge in the Ottoman Empire following his defeat at Poltava. Peter the Great marched into Moldavia in 1711, allied with its prince Dimitrie Cantemir, but was surrounded by a much larger Ottoman army on the Pruth and had to agree to hand back Azov, terms confirmed at Adrianople in 1713.: Ett krig som växte fram ur stora nordiska kriget, sedan Karl XII av Sverige tagit sin tillflykt till Osmanska riket efter nederlaget vid Poltava. Peter den store marscherade in i Moldavien 1711, allierad med dess furste Dimitrie Cantemir, men omringades av en mycket större osmansk armé vid Prut och tvingades gå med på att lämna tillbaka Azov, villkor som bekräftades i Adrianopel 1713.
