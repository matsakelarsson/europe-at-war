Surrounded in their camp, the Russians beat off the janissaries’ assaults but could not reach water. The peace was signed nearby on 23 July.: Omringade i sitt läger slog ryssarna tillbaka janitsjarernas stormningar men kunde inte nå vattnet. Freden undertecknades i närheten den 23 juli.
