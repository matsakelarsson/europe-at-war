Also called the Pruth River Campaign. Further Ottoman declarations of war in 1711–1713 led to no fighting, and some accounts date the war 1710–1713.: Kallas även fälttåget vid Prut. Ytterligare osmanska krigsförklaringar 1711–1713 ledde inte till några strider, och vissa framställningar daterar kriget till 1710–1713.
Dates are New Style (Gregorian). Russia used the Julian calendar, eleven days behind, so Russian sources date the Treaty of the Pruth 12 July 1711.: Datumen följer nya stilen (gregoriansk kalender). Ryssland använde den julianska kalendern, elva dagar efter, så ryska källor daterar freden vid Prut till den 12 juli 1711.
The war is also told briefly, from Sweden’s side, in the Great Northern War.: Kriget skildras också kortfattat, från svensk sida, i Stora nordiska kriget.
After his defeat at Poltava in 1709, Charles XII of Sweden took refuge with the Ottomans at Bender on the Dniester. With the Crimean khan Devlet II Giray, he urged Sultan Ahmed III to fight Russia, and when Peter the Great kept demanding that Charles be sent away, the Ottomans declared war on 20 November 1710. Early in 1711 Tatars, Zaporozhian Cossacks under Pylyp Orlyk, the exiled successor of Hetman Mazepa, and Polish supporters of Stanisław Leszczyński raided right-bank Ukraine, but they failed to take Bila Tserkva.: Efter nederlaget vid Poltava 1709 tog Karl XII av Sverige sin tillflykt till osmanerna i Bender vid Dnestr. Tillsammans med krimkhanen Devlet II Giray uppmanade han sultan Ahmed III att gå i krig mot Ryssland, och när Peter den store gång på gång krävde att Karl skulle skickas bort förklarade osmanerna krig den 20 november 1710. I början av 1711 härjade tatarer, zaporogkosacker under Pylyp Orlyk, hetman Mazepas landsflyktige efterträdare, och polska anhängare till Stanisław Leszczyński i högerstrandsukraina, men de misslyckades med att inta Bila Tserkva.
Peter decided to carry the war to the Danube, hoping the sultan’s Orthodox subjects would rise. On 13 April 1711 at Lutsk he made a treaty with Dimitrie Cantemir, the prince of Moldavia, who promised troops and supplies in return for Russian protection. Constantin Brâncoveanu, prince of Wallachia, held back. In June the Russian army crossed the Dniester and joined Cantemir near Iași, but it was short of food. Field Marshal Boris Sheremetev failed to stop the grand vizier, Baltacı Mehmed Pasha, from crossing the Danube at Isaccea with a far larger Ottoman army.: Peter beslöt att föra kriget till Donau i hopp om att sultanens ortodoxa undersåtar skulle resa sig. Den 13 april 1711 slöt han i Lutsk ett fördrag med Dimitrie Cantemir, furste av Moldavien, som lovade trupper och förnödenheter i utbyte mot ryskt beskydd. Constantin Brâncoveanu, furste av Valakiet, höll sig avvaktande. I juni gick den ryska armén över Dnestr och förenade sig med Cantemir nära Iași, men den hade ont om livsmedel. Fältmarskalk Boris Sjeremetev misslyckades med att hindra storvesiren Baltacı Mehmed pasha från att gå över Donau vid Isaccea med en betydligt större osmansk armé.
