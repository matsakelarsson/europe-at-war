Ochakov: Otjakov
Fires started by Russian shot reached the powder magazine, and after the explosion the garrison surrendered. The Russians abandoned the fortress the next year.: Bränder som orsakats av ryska kulor nådde krutförrådet, och efter explosionen kapitulerade garnisonen. Ryssarna övergav fästningen året därpå.
