Dates are New Style (Gregorian). Russia used the Julian calendar, eleven days behind, so Russian sources date the battle of Stavuchany 17 August 1739, for example, and the Treaty of Belgrade 18 (29) September.: Datumen följer nya stilen (gregoriansk kalender). Ryssland använde den julianska kalendern, elva dagar efter, så ryska källor daterar till exempel slaget vid Stavutjany till den 17 augusti 1739 och freden i Belgrad till den 18 (29) september.
Austria’s war of 1737–1739 against the Ottomans in Serbia, Bosnia and Wallachia is only touched on here.: Österrikes krig 1737–1739 mot osmanerna i Serbien, Bosnien och Valakiet berörs här bara i förbigående.
Ottoman and Tatar success: Osmanska och tatariska framgångar
Crimean Tatar raids on the Hetmanate, and the khan’s march across the North Caucasus in 1735 to fight Persia for the Ottomans, gave Russia its pretext. The Polish succession had been settled in Russia’s favour, and Persia had become an ally when Russia handed back its Caspian conquests. Empress Anna’s government struck first. A raid on the Crimea under General Mikhail Leontiev set out too late in October 1735, was caught by cold and snow on the steppe and turned back, having lost some 9,000 of its 40,000 men.: Krimtatariska plundringståg mot hetmanatet och khanens marsch genom norra Kaukasus 1735 för att strida mot Persien för osmanernas räkning gav Ryssland dess förevändning. Den polska tronföljden hade avgjorts till Rysslands fördel, och Persien hade blivit en bundsförvant sedan Ryssland lämnat tillbaka sina erövringar vid Kaspiska havet. Kejsarinnan Annas regering slog till först. Ett anfall mot Krim under general Michail Leontjev bröt upp för sent, i oktober 1735, överraskades av kyla och snö på stäppen och vände om efter att ha förlorat omkring 9 000 av sina 40 000 man.
In the spring of 1736 Field Marshal Burkhard Christoph von Münnich led about 54,000 men south along the Dnieper. They stormed the Perekop lines at the end of May and, for the first time, a Russian army entered the Crimea. It burned Gözleve (Yevpatoria) and the khan’s capital, Bakhchisarai, but with dysentery spreading and food and water short Münnich turned back after a month. About half his army was lost, only some 2,000 men of them in battle. Meanwhile General Peter Lacy, helped by the Don flotilla, took Azov, and another detachment took Kinburn at the mouth of the Dnieper.: Våren 1736 ledde fältmarskalk Burkhard Christoph von Münnich omkring 54 000 man söderut längs Dnepr. De stormade Perekoplinjerna i slutet av maj, och för första gången trängde en rysk armé in på Krim. Den brände Gözleve (Jevpatorija) och khanens huvudstad Bachtjisaraj, men när dysenterin spred sig och det rådde brist på mat och vatten vände Münnich om efter en månad. Ungefär halva hans armé gick förlorad, varav endast omkring 2 000 man i strid. Under tiden intog general Peter Lacy med hjälp av Donflottiljen Azov, och en annan avdelning intog Kinburn vid Dneprs mynning.
