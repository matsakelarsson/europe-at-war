Nemyriv: Nemyriv
Summer–autumn 1737: sommaren–hösten 1737
Russian, Austrian and Ottoman envoys met here in Polish Podolia, but the talks failed.: Ryska, österrikiska och osmanska sändebud möttes här i polska Podolien, men förhandlingarna misslyckades.
In 1739 Münnich took the war west. He led about 60,000 men across Polish territory and over the Dniester, and on 28 August, near Khotyn, he outflanked and routed an Ottoman and Tatar army under Veli Pasha at Stavuchany. Münnich reported only a handful of dead, but other estimates put Russian casualties at about 2,000. Khotyn surrendered two days later. Münnich crossed the Pruth, entered the Moldavian capital, Iași, on 14 September and pressed the boyars to accept Russian rule.: År 1739 förde Münnich kriget västerut. Han ledde omkring 60 000 man genom polskt territorium och över Dnestr, och den 28 augusti kringgick och krossade han nära Chotyn en osmansk och tatarisk armé under Veli pasha vid Stavutjany. Münnich rapporterade bara en handfull döda, men andra uppskattningar anger de ryska förlusterna till omkring 2 000 man. Chotyn kapitulerade två dagar senare. Münnich gick över Prut, ryckte den 14 september in i den moldaviska huvudstaden Iași och pressade bojarerna att godta ryskt styre.
Austria, meanwhile, had been beaten at Grocka in July. On 18 September it made peace at Belgrade, giving up Belgrade, northern Serbia and Oltenia. Threatened by Sweden and left on its own, Russia accepted terms the French ambassador, the Marquis de Villeneuve, had negotiated for it, signed in Belgrade the same day and confirmed at Niš on 3 October. Russia kept Azov, but only as a razed fortress in an empty border zone, and it could keep no ships on the Black Sea. Khotyn and Moldavia went back to the Ottomans, and Kabarda in the Caucasus was to stay independent between the two empires.: Österrike hade under tiden besegrats vid Grocka i juli. Den 18 september slöt det fred i Belgrad och avstod Belgrad, norra Serbien och Oltenien. Hotat av Sverige och lämnat ensamt godtog Ryssland villkor som den franske ambassadören, markis de Villeneuve, hade förhandlat fram för dess räkning; de undertecknades i Belgrad samma dag och bekräftades i Niš den 3 oktober. Ryssland behöll Azov, men endast som en raserad fästning i en tom gränszon, och fick inte hålla några fartyg på Svarta havet. Chotyn och Moldavien återgick till osmanerna, och Kabarda i Kaukasus skulle förbli självständigt mellan de båda imperierna.
