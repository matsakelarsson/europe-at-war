Russo-Turkish War of 1735–1739: Rysk-turkiska kriget 1735–1739
A war in which Russia, joined by the Habsburg Monarchy in 1737, fought the Ottoman Empire and the Crimean Khanate for the northern shore of the Black Sea. Russian armies took Azov and Ochakov, burned the Crimean capital and beat the Ottomans at Stavuchany in 1739, but lost tens of thousands of men to disease. After Austria made a separate peace, the treaties of Belgrade and Niš left Russia little more than Azov, with its walls razed, and no right to keep ships on the Black Sea.: Ett krig där Ryssland, från 1737 tillsammans med habsburgska monarkin, kämpade mot Osmanska riket och Krimkhanatet om Svarta havets norra kust. Ryska arméer intog Azov och Otjakov, brände Krims huvudstad och slog osmanerna vid Stavutjany 1739 men förlorade tiotusentals man i sjukdomar. Sedan Österrike slutit separatfred lämnade freden i Belgrad och freden i Niš Ryssland inte mycket mer än Azov, med raserade murar, och ingen rätt att hålla fartyg på Svarta havet.
