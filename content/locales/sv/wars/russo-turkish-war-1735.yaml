Münnich feinted at the Ottoman entrenchments, then bridged the Shulanets on his right and turned their flank. The Ottomans fled, leaving their camp and guns.: Münnich gjorde ett skenanfall mot de osmanska förskansningarna, slog sedan broar över Sjulanets på sin högra flygel och kringgick deras flank. Osmanerna flydde och lämnade läger och kanoner efter sig.
Khotyn: Chotyn
