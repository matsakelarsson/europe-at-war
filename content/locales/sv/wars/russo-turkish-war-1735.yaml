Lacy’s Don army besieged the fortress from the spring until the Ottoman garrison surrendered in return for free passage.: Lacys Donarmé belägrade fästningen från våren tills den osmanska garnisonen kapitulerade mot fri avmarsch.
Kinburn: Kinburn
The garrison abandoned the fort on its sandspit and crossed to Ochakov on the other side of the estuary.: Garnisonen övergav fortet på sin sandrevel och tog sig över till Otjakov på andra sidan mynningsviken.
Münnich: Münnich
In 1737 Münnich marched on Ochakov, the Ottoman fortress where the Dnieper and the Bug flow into the sea, with about 70,000 men. On the third day of the siege, in July, red-hot shot set the town on fire, the powder magazine blew up, killing thousands, and the garrison of some 20,000 surrendered, though many were cut down in the slaughter that followed. An Ottoman attempt to retake the fortress that autumn failed. Lacy invaded the Crimea again from the east, bridging the Henichesk strait with casks to march down the Arabat Spit behind the khan’s army at Perekop, and burned Karasubazar before lost supplies and sickness drove him back.: "År 1737 marscherade Münnich med omkring 70 000 man mot Otjakov, den osmanska fästningen där Dnepr och Bug rinner ut i havet. På belägringens tredje dag, i juli, satte glödgade kulor eld på staden, krutförrådet exploderade och dödade tusentals, och garnisonen på omkring 20 000 man kapitulerade, även om många höggs ned i den slakt som följde. Ett osmanskt försök att återta fästningen samma höst misslyckades. Lacy invaderade åter Krim från öster: han slog en bro av tunnor över sundet vid Henitjesk, marscherade ned längs Arabatnäset bakom khanens armé vid Perekop och brände Karasubazar innan förlorade förnödenheter och sjukdomar drev honom tillbaka."
Austria entered the war that summer, but after early gains in Serbia its armies were beaten in Bosnia, and peace talks at Nemyriv in Poland broke down. In 1738 plague spread through the Black Sea lands and into Moldavia, Poland and Ukraine. Münnich’s march towards the Dniester came to nothing, and Lacy’s third raid into the Crimea, across the shallows of the Syvash, achieved little. In September the Russians abandoned Ochakov and Kinburn rather than lose their garrisons to plague and a new Ottoman attack.: Österrike gick in i kriget samma sommar, men efter inledande framgångar i Serbien besegrades dess arméer i Bosnien, och fredsförhandlingarna i Nemyriv i Polen bröt samman. År 1738 spred sig pesten genom länderna kring Svarta havet och in i Moldavien, Polen och Ukraina. Münnichs marsch mot Dnestr ledde ingenstans, och Lacys tredje anfall in på Krim, över Sivasjs grunda vatten, uträttade föga. I september övergav ryssarna Otjakov och Kinburn hellre än att förlora sina garnisoner till pesten och ett nytt osmanskt anfall.
