The Ottoman fortress on the Dniester surrendered after the battle, but was handed back at the peace.: Den osmanska fästningen vid Dnestr kapitulerade efter slaget men lämnades tillbaka vid freden.
14 September 1739: 14 september 1739
Münnich entered the Moldavian capital and had the boyars swear allegiance to the empress, only for the peace to return Moldavia to the Ottomans.: Münnich ryckte in i den moldaviska huvudstaden och lät bojarerna svära kejsarinnan trohet, men freden återlämnade Moldavien till osmanerna.
21–22 July 1739: 21–22 juli 1739
The defeat of the main Austrian army opened the way to an Ottoman siege of Belgrade.: Nederlaget för den österrikiska huvudarmén öppnade vägen för en osmansk belägring av Belgrad.
Austria gave up Belgrade, northern Serbia and Oltenia. A preliminary peace for Russia was signed here the same day.: Österrike avstod Belgrad, norra Serbien och Oltenien. En preliminärfred för Rysslands del undertecknades här samma dag.
The final treaty between Russia and the Ottomans, again agreed through French mediation.: Det slutliga fördraget mellan Ryssland och osmanerna, även det förhandlat genom fransk medling.
