Russo-Turkish War of 1768–1774: Rysk-turkiska kriget 1768–1774
A war between the Russian Empire and the Ottoman Empire, with its vassal the Crimean Khanate, that grew out of Russia’s intervention in Poland–Lithuania. Russian armies overran Moldavia, Wallachia and the Crimea, and a Russian fleet sent from the Baltic destroyed the Ottoman fleet at Chesma. At Küçük Kaynarca in 1774 the Ottomans gave up the Crimean Khanate, which became independent, and ceded Kerch, Kinburn and Kabarda to Russia.: Ett krig mellan Ryska riket och Osmanska riket, med dess vasall Krimkhanatet, som växte fram ur Rysslands intervention i Polen–Litauen. Ryska arméer överskred Moldavien, Valakiet och Krim, och en rysk flotta som sänts från Östersjön förintade den osmanska flottan vid Tjesme. I Küçük Kaynarca 1774 avstod osmanerna från Krimkhanatet, som blev självständigt, och avträdde Kertj, Kinburn och Kabarda till Ryssland.
