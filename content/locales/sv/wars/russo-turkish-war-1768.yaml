Dates are New Style (Gregorian). Russia used the Julian calendar, eleven days behind, so Russian sources date the battle of Kagul, for example, 21 July 1770 and the Treaty of Küçük Kaynarca 10 July 1774.: Datumen följer nya stilen (gregoriansk kalender). Ryssland använde den julianska kalendern, elva dagar efter, så ryska källor daterar till exempel slaget vid Kagul till den 21 juli 1770 och freden i Küçük Kaynarca till den 10 juli 1774.
Russia’s parallel campaigns in Georgia (1769–1772) and the Russian fleet’s actions off Syria and Lebanon are not followed here.: Rysslands samtidiga fälttåg i Georgien (1769–1772) och den ryska flottans operationer utanför Syrien och Libanon följs inte här.
Place names are given in their present-day forms, except for a few towns better known by their historical names, such as Kefe (Feodosia), Kiliya (Kiliia) and Akkerman (Bilhorod-Dnistrovskyi).: Ortnamn anges i sina nutida former, utom för några städer som är mer kända under sina historiska namn, som Kefe (Feodosija), Kiliya (Kilija) och Akkerman (Bilhorod-Dnistrovskyj).
In 1768 Russian troops in Poland–Lithuania were fighting the Bar Confederation, nobles in arms against Russian domination, while a Cossack and peasant rising, the Koliivshchyna, swept right-bank Ukraine with massacres of Poles and Jews, above all at Uman. That summer Cossacks pursuing confederates crossed into the Ottoman border town of Balta and, according to Ottoman reports, sacked it and killed many of its people. Russia denied responsibility, but the confederates and the French ambassador were urging war, and on 6 October Sultan Mustafa III had the Russian envoy, Aleksei Obreskov, imprisoned. It amounted to a declaration of war.: År 1768 bekämpade ryska trupper i Polen–Litauen Barkonfederationen, adelsmän som gripit till vapen mot den ryska dominansen, medan ett kosack- och bondeuppror, Kolijivsjtjyna, svepte fram över högerstrandsukraina med massakrer på polacker och judar, framför allt i Uman. Samma sommar gick kosacker som förföljde konfedererade in i den osmanska gränsstaden Balta och plundrade den enligt osmanska rapporter och dödade många av dess invånare. Ryssland förnekade allt ansvar, men de konfedererade och den franske ambassadören drev på för krig, och den 6 oktober lät sultan Mustafa III fängsla det ryska sändebudet Aleksej Obreskov. Det var liktydigt med en krigsförklaring.
In January 1769 the Crimean khan, Qırım Giray, led some 70,000 Tatars, Nogais and Ottoman troops into New Serbia, the Russian frontier province on the steppe of central Ukraine, burning villages and carrying off many captives. It proved to be the last great Tatar raid. That year Russian armies moved south. After a long struggle the Ottomans abandoned Khotyn in September, and Russian troops entered Iași in October and Bucharest in November, while a second army took over Azov and Taganrog. In both Moldavia and Wallachia many boyars swore allegiance to Catherine II.: I januari 1769 ledde krimkhanen Qırım Giray omkring 70 000 tatarer, nogajer och osmanska soldater in i Nyserbien, den ryska gränsprovinsen på stäppen i centrala Ukraina, där de brände byar och förde bort många fångar. Det blev det sista stora tatariska plundringståget. Samma år ryckte ryska arméer söderut. Efter en lång kamp övergav osmanerna Chotyn i september, och ryska trupper ryckte in i Iași i oktober och Bukarest i november, medan en andra armé tog Azov och Taganrog i besittning. I både Moldavien och Valakiet svor många bojarer Katarina II trohet.
