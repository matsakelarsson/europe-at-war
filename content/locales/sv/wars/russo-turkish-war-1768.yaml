In June 1771 the Second Army, now under Prince Vasily Dolgorukov, stormed the Perekop lines and entered the Crimea, while another column came down the Arabat Spit from the north-east. On 10 July it beat an Ottoman and Tatar army outside Kefe (Feodosia), the main Ottoman stronghold, and the Ottomans then abandoned Kerch, Yenikale, Arabat and Balaklava. Khan Selim III Giray fled to Constantinople, and the Ottoman garrisons were driven out of the peninsula. Dolgorukov was later given the honorary surname Krymsky, “of the Crimea”.: I juni 1771 stormade Andra armén, nu under furst Vasilij Dolgorukov, Perekoplinjerna och trängde in på Krim, medan en annan kolonn kom ned längs Arabatnäset från nordost. Den 10 juli besegrade den en osmansk och tatarisk armé utanför Kefe (Feodosija), det främsta osmanska fästet, och osmanerna övergav därefter Kertj, Jenikale, Arabat och Balaklava. Khan Selim III Giray flydde till Konstantinopel, och de osmanska garnisonerna drevs ut från halvön. Dolgorukov fick senare hedersnamnet Krymskij, ”av Krim”.
Crimean notables chose a new khan acceptable to Russia, Sahib II Giray, and in November 1772 at Karasubazar he signed a treaty that made the khanate independent of the Ottomans under Russian protection, with Russian garrisons in Kerch and Yenikale. Meanwhile plague, brought from the Danube front, spread to Moscow and killed tens of thousands there in 1770–1772; in September 1771 it set off a riot in which the city’s archbishop was killed. A truce was agreed in May 1772, but peace talks at Focșani and Bucharest broke down over the Crimea.: Krims notabiliteter valde en ny khan som Ryssland kunde godta, Sahib II Giray, och i november 1772 undertecknade han i Karasubazar ett fördrag som gjorde khanatet oberoende av osmanerna under ryskt beskydd, med ryska garnisoner i Kertj och Jenikale. Under tiden spred sig pesten, som förts med från Donaufronten, till Moskva och dödade tiotusentals där 1770–1772; i september 1771 utlöste den ett upplopp där stadens ärkebiskop dödades. Ett stillestånd ingicks i maj 1772, men fredsförhandlingarna i Focșani och Bukarest bröt samman i frågan om Krim.
