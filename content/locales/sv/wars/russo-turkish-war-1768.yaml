In 1770 Field Marshal Pyotr Rumyantsev, now in command of the First Army, marched south along the Pruth with fewer than 40,000 men. He drove back the khan’s Tatars at Ryabaya Mogila in June, and on 18 July he routed an army of some 65,000 Tatars and 15,000 Ottomans under Qaplan II Giray on the Larga, a tributary of the Pruth. The grand vizier, Ivazzade Halil Pasha, then crossed the Danube with the main Ottoman army, put at 100,000–150,000 men, and advanced to the Kagul, near today’s Cahul, to attack him.: År 1770 marscherade fältmarskalk Pjotr Rumjantsev, nu befälhavare för Första armén, söderut längs Prut med färre än 40 000 man. Han drev tillbaka khanens tatarer vid Rjabaja Mogila i juni, och den 18 juli krossade han en armé på omkring 65 000 tatarer och 15 000 osmaner under Qaplan II Giray vid Larga, en biflod till Prut. Storvesiren Ivazzade Halil pasha gick då över Donau med den osmanska huvudarmén, som uppskattas till 100 000–150 000 man, och ryckte fram till Kagul, nära dagens Cahul, för att anfalla honom.
Rumyantsev struck first. On 1 August he advanced with about 17,000 men in squares, while the rest of his army guarded his supplies and his rear against the Tatars. His artillery broke up the Ottoman attacks, and his infantry stormed the Ottoman camp. The Ottoman army fled to the Danube, where many men drowned trying to escape. In the following months the Russians took the Danube fortresses of Izmail, Kiliya and Brăila and the port of Akkerman, and on 27 September Count Pyotr Panin’s Second Army stormed Bender on the Dniester after a two-month siege. About 7,000 of its defenders were killed, and the Russians lost some 6,000 dead and wounded.: Rumjantsev slog till först. Den 1 augusti ryckte han fram med omkring 17 000 man i fyrkanter, medan resten av hans armé skyddade trossen och ryggen mot tatarerna. Hans artilleri slog sönder de osmanska anfallen, och hans infanteri stormade det osmanska lägret. Den osmanska armén flydde mot Donau, där många drunknade under flykten. Under de följande månaderna intog ryssarna Donaufästningarna Izmail, Kiliya och Brăila samt hamnstaden Akkerman, och den 27 september stormade greve Pjotr Panins Andra armé Bender vid Dnestr efter en två månader lång belägring. Omkring 7 000 av försvararna dödades, och ryssarna förlorade omkring 6 000 döda och sårade.
