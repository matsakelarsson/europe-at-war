To strike the Ottomans from another side, Catherine sent squadrons of the Baltic Fleet around Europe to the Mediterranean, the first Russian fleet ever to sail there. Count Alexei Orlov was to raise the Greeks against the sultan, and British officers served in the fleet. In February 1770 Russian ships landed troops in the Mani, and Greeks rose across the Peloponnese. But the Russians were too few, the siege of Methoni failed, and the rising collapsed. Albanian irregulars brought in by the Ottomans took savage revenge on the Greek population.: För att angripa osmanerna från ett annat håll sände Katarina eskadrar ur Östersjöflottan runt Europa till Medelhavet, den första ryska flotta som någonsin seglat dit. Greve Aleksej Orlov skulle resa grekerna mot sultanen, och brittiska officerare tjänstgjorde i flottan. I februari 1770 landsatte ryska fartyg trupper på Mani, och greker reste sig över hela Peloponnesos. Men ryssarna var för få, belägringen av Methoni misslyckades och upproret bröt samman. Albanska irreguljära trupper som osmanerna hade tagit dit hämnades grymt på den grekiska befolkningen.
On 5 July the fleet, under Orlov with Admiral Grigory Spiridov and Rear Admiral John Elphinstone, attacked the Ottoman fleet in the strait between Chios and the Anatolian coast. In the fighting the Russian Sviatoi Evstafii and the Ottoman flagship blew up, and the Ottomans withdrew into the crowded bay of Çeşme. In the night of 6–7 July Russian ships bombarded them and sent in fire ships. Almost the entire Ottoman fleet burned, and thousands of sailors died. The victory gave Russia control of the Aegean, but it could not force the Dardanelles, and its fleet stayed in the islands, based on Paros, until the end of the war.: Den 5 juli anföll flottan under Orlov, med amiral Grigorij Spiridov och konteramiral John Elphinstone, den osmanska flottan i sundet mellan Chios och den anatoliska kusten. Under striden flög det ryska Svjatoj Jevstafij och det osmanska flaggskeppet i luften, och osmanerna drog sig tillbaka in i den trånga Çeşmebukten. Natten mellan den 6 och 7 juli besköt ryska fartyg dem och sände in brännare. Nästan hela den osmanska flottan brann upp, och tusentals sjömän omkom. Segern gav Ryssland herraväldet över Egeiska havet, men flottan kunde inte forcera Dardanellerna och stannade bland öarna, med bas på Paros, till krigets slut.
