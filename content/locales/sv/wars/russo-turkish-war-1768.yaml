In 1773 Rumyantsev crossed the Danube but failed before Silistra and withdrew, and that autumn Pugachev’s rebellion broke out in the east of Russia. The new sultan, Abdul Hamid I, decided to fight on. In June 1774 Rumyantsev crossed the river again. On 20 June Alexander Suvorov and Mikhail Kamensky met an Ottoman army of about 40,000 at Kozludzha. Suvorov attacked at once and routed it, though only some 8,000 Russians were engaged, and the Ottomans fled to Shumen, where Rumyantsev blockaded the grand vizier, Muhsinzade Mehmed Pasha.: År 1773 gick Rumjantsev över Donau men misslyckades vid Silistra och drog sig tillbaka, och samma höst bröt Pugatjovs uppror ut i östra Ryssland. Den nye sultanen, Abdülhamid I, beslöt att fortsätta kriget. I juni 1774 gick Rumjantsev åter över floden. Den 20 juni mötte Aleksandr Suvorov och Michail Kamenskij en osmansk armé på omkring 40 000 man vid Kozludzja. Suvorov anföll omedelbart och krossade den, trots att bara omkring 8 000 ryssar deltog, och osmanerna flydde till Sjumen, där Rumjantsev blockerade storvesiren Muhsinzade Mehmed pasha.
On 21 July 1774 the two sides made peace at the village of Küçük Kaynarca near Silistra. The Crimean Khanate became independent of the Ottoman Empire, though the sultan kept religious authority over its Muslims as caliph. Russia gained Kerch and Yenikale on the strait into the Sea of Azov, Kinburn at the mouth of the Dnieper with a strip of steppe between the Dnieper and the Bug, full possession of Azov, and Kabarda in the North Caucasus. Its merchant ships won the right to sail through the Straits, it was paid 4.5 million rubles, and it gained a voice in the affairs of the sultan’s Orthodox subjects. Moldavia and Wallachia were returned.: Den 21 juli 1774 slöt de båda sidorna fred i byn Küçük Kaynarca nära Silistra. Krimkhanatet blev oberoende av Osmanska riket, även om sultanen som kalif behöll den religiösa auktoriteten över dess muslimer. Ryssland fick Kertj och Jenikale vid sundet in till Azovska sjön, Kinburn vid Dneprs mynning med en stäppremsa mellan Dnepr och Bug, full besittning av Azov samt Kabarda i norra Kaukasus. Dess handelsfartyg fick rätt att segla genom sunden, landet fick 4,5 miljoner rubel, och det fick ett inflytande över angelägenheterna för sultanens ortodoxa undersåtar. Moldavien och Valakiet återlämnades.
