Dates are New Style (Gregorian). Russia used the Julian calendar, eleven days behind, so Russian sources date the storming of Izmail 11 December 1790 and the Treaty of Jassy 29 December 1791.: Datumen följer nya stilen (gregoriansk kalender). Ryssland använde den julianska kalendern, elva dagar efter, så ryska källor daterar stormningen av Izmail till den 11 december 1790 och freden i Jassy till den 29 december 1791.
Austria’s campaigns against the Ottomans in Serbia and Bosnia are not followed here. Sweden’s attack on Russia in 1788 is told in the Russo-Swedish War of 1788–1790.: Österrikes fälttåg mot osmanerna i Serbien och Bosnien följs inte här. Sveriges angrepp på Ryssland 1788 skildras i rysk-svenska kriget 1788–1790.
Russia had annexed the Crimean Khanate in 1783, and in the summer of 1787 Catherine II toured her new southern lands and the Crimea with her ally, Emperor Joseph II. In Constantinople the war party, encouraged by the British and French ambassadors, demanded that Russia give up the Crimea, and in August the Porte imprisoned the Russian ambassador, Yakov Bulgakov. On 12 October about 6,000 Ottoman troops landed on the Kinburn spit opposite Ochakov, at the mouth of the Dnieper. Alexander Suvorov, wounded twice in the fighting, drove them back into the sea.: Ryssland hade annekterat Krimkhanatet 1783, och sommaren 1787 reste Katarina II genom sina nya sydliga länder och Krim tillsammans med sin bundsförvant kejsar Josef II. I Konstantinopel krävde krigspartiet, uppmuntrat av de brittiska och franska ambassadörerna, att Ryssland skulle lämna ifrån sig Krim, och i augusti lät Höga porten fängsla den ryske ambassadören Jakov Bulgakov. Den 12 oktober landsteg omkring 6 000 osmanska soldater på Kinburnnäset mitt emot Otjakov, vid Dneprs mynning. Aleksandr Suvorov, som sårades två gånger under striderna, drev dem tillbaka i havet.
Austria entered the war in February 1788. That summer Prince Grigory Potemkin laid siege to Ochakov. In June Russian oared ships under the Prince of Nassau-Siegen, with John Paul Jones commanding the sailing squadron, beat the Ottoman flotilla in the Dnieper estuary, and on 14 July the young Sevastopol squadron under Marko Voinovich and Fyodor Ushakov beat the Ottoman fleet off Fidonisi (Snake Island). Potemkin put off the assault for months while his troops suffered from disease and cold, and Ochakov was finally stormed on 17 December. Most of the garrison and many of the townspeople were killed. In the west, Russian and Austrian troops took Khotyn in September.: Österrike gick in i kriget i februari 1788. Samma sommar belägrade furst Grigorij Potemkin Otjakov. I juni besegrade ryska roddfartyg under prinsen av Nassau-Siegen, med John Paul Jones som befälhavare för seglingseskadern, den osmanska flottiljen i Dneprs mynningsvik, och den 14 juli besegrade den unga Sevastopoleskadern under Marko Vojnovitj och Fjodor Usjakov den osmanska flottan utanför Fidonisi (Ormön). Potemkin sköt upp stormningen i månader medan hans trupper led av sjukdomar och kyla, och Otjakov stormades till slut den 17 december. Större delen av garnisonen och många av stadsborna dödades. I väster intog ryska och österrikiska trupper Chotyn i september.
