After Joseph II died in 1790, Austria agreed a truce and left the war at Sistova in 1791. At sea Ushakov beat the Ottoman fleet in the Kerch Strait in July 1790 and off Tendra in September. In December Potemkin sent Suvorov to Izmail, the great Ottoman fortress on the Danube, which had held out against a Russian siege. Suvorov drilled his troops on mock ramparts, sent the commander an ultimatum, and on 22 December stormed the walls. Almost the whole garrison, more than 26,000 men, was killed or wounded, and many townspeople died in the sack that followed. Russian losses were at least 4,000.: Sedan Josef II dött 1790 ingick Österrike ett stillestånd och lämnade kriget genom freden i Sistova 1791. Till sjöss besegrade Usjakov den osmanska flottan i Kertjsundet i juli 1790 och utanför Tendra i september. I december sände Potemkin Suvorov till Izmail, den stora osmanska fästningen vid Donau, som hade stått emot en rysk belägring. Suvorov övade sina trupper på attrapper av vallar, sände befälhavaren ett ultimatum och stormade murarna den 22 december. Nästan hela garnisonen, mer än 26 000 man, dödades eller sårades, och många stadsbor dog under plundringen som följde. De ryska förlusterna uppgick till minst 4 000 man.
In 1791 Prince Nikolai Repnin beat the grand vizier at Măcin on 9 July, Ushakov beat the Ottoman fleet off Cape Kaliakra on 11 August, and in the Kuban Ivan Gudovich stormed Anapa. Britain threatened war to make Russia give up Ochakov, but backed down. Potemkin died near Iași in October, and Alexander Bezborodko signed the Treaty of Jassy on 9 January 1792. The Ottomans recognised the annexation of the Crimea and ceded Yedisan, the land between the Bug and the Dniester with Ochakov, making the Dniester the border. Russia gave back its other conquests, including Bender, Akkerman and Izmail.: År 1791 besegrade furst Nikolaj Repnin storvesiren vid Măcin den 9 juli, Usjakov besegrade den osmanska flottan utanför Kap Kaliakra den 11 augusti, och i Kuban stormade Ivan Gudovitj Anapa. Storbritannien hotade med krig för att tvinga Ryssland att lämna ifrån sig Otjakov, men backade. Potemkin dog nära Iași i oktober, och Aleksandr Bezborodko undertecknade freden i Jassy den 9 januari 1792. Osmanerna erkände annekteringen av Krim och avträdde Jedisan, landet mellan Bug och Dnestr med Otjakov, så att Dnestr blev gräns. Ryssland lämnade tillbaka sina övriga erövringar, bland dem Bender, Akkerman och Izmail.
