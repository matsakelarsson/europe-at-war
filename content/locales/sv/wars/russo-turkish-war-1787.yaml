Potemkin: Potemkin
In 1789 the Ottomans, under a new sultan, Selim III, struck at the Austrians in Moldavia. Their commander, Prince Josias of Saxe-Coburg, called on Suvorov, whose corps lay at Bârlad. Suvorov marched about 60 km in little more than a day with 7,000 men, and on 1 August the allies routed some 30,000 Ottomans under Osman Pasha at Focșani. In September the grand vizier, Cenaze Hasan Pasha, advanced against Coburg with up to 100,000 men. Suvorov came again, and on 22 September about 25,000 Russians and Austrians attacked and broke the Ottoman army on the Râmnic river. Suvorov was made a count, with the title Rymniksky.: År 1789 angrep osmanerna, under en ny sultan, Selim III, österrikarna i Moldavien. Deras befälhavare, prins Josias av Sachsen-Coburg, kallade på Suvorov, vars kår låg vid Bârlad. Suvorov marscherade omkring 60 km på drygt ett dygn med 7 000 man, och den 1 augusti krossade de allierade omkring 30 000 osmaner under Osman pasha vid Focșani. I september ryckte storvesiren Cenaze Hasan pasha fram mot Coburg med upp till 100 000 man. Suvorov kom på nytt, och den 22 september anföll omkring 25 000 ryssar och österrikare och krossade den osmanska armén vid floden Râmnic. Suvorov blev greve med titeln Rymnikskij.
The Austrians went on to take Belgrade and occupy Wallachia, entering Bucharest in November. Potemkin’s army cleared the Ottomans from the Dniester. On 25 September a detachment under José de Ribas took the castle of Hajibey on the coast, where the city of Odesa was founded in 1794, Akkerman surrendered in October, and Bender gave up without a fight in November.: Österrikarna fortsatte med att inta Belgrad och besätta Valakiet och ryckte in i Bukarest i november. Potemkins armé rensade Dnestr från osmaner. Den 25 september intog en avdelning under José de Ribas borgen Hadjibej vid kusten, där staden Odesa grundades 1794, Akkerman kapitulerade i oktober och Bender gav upp utan strid i november.
