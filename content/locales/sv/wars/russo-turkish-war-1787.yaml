Russo-Turkish War of 1787–1792: Rysk-turkiska kriget 1787–1792
An attempt by the Ottoman Empire to win back the Crimea, annexed by Russia in 1783, against Russia and, from 1788 to 1791, the Habsburg Monarchy. Russian armies and the new Black Sea Fleet won at Kinburn, Ochakov, Focșani, Rymnik, Izmail and at sea, and at Jassy in 1792 the Ottomans recognised the annexation and ceded the land between the Southern Bug and the Dniester.: Ett försök från Osmanska riket att återvinna Krim, som Ryssland annekterat 1783, mot Ryssland och, 1788–1791, habsburgska monarkin. Ryska arméer och den nya Svartahavsflottan segrade vid Kinburn, Otjakov, Focșani, Rymnik, Izmail och till sjöss, och i Jassy 1792 erkände osmanerna annekteringen och avträdde landet mellan Södra Bug och Dnjestr.
