Russo-Turkish War of 1806–1812: Rysk-turkiska kriget 1806–1812
A war between the Russian Empire and the Ottoman Empire, fought mainly on the lower Danube, at sea in the Aegean and in the Caucasus, in which Russia occupied Moldavia and Wallachia. Kutuzov’s victory at Ruse and Slobozia in 1811 led to the Treaty of Bucharest, signed weeks before Napoleon’s invasion of Russia, which gave Russia Bessarabia, the land between the Prut and the Dniester.: Ett krig mellan Ryska riket och Osmanska riket, utkämpat främst vid nedre Donau, till sjöss i Egeiska havet och i Kaukasus, under vilket Ryssland ockuperade Moldavien och Valakiet. Kutuzovs seger vid Ruse och Slobozia 1811 ledde till freden i Bukarest, undertecknad några veckor före Napoleons invasion av Ryssland, som gav Ryssland Bessarabien, landet mellan Prut och Dnjestr.
