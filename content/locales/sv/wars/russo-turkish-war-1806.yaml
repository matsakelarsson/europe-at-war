Dates are New Style (Gregorian). Russian accounts use the Julian calendar, then 12 days behind, so the Treaty of Bucharest is dated 16 May 1812 in Russian sources. Some dates of the Danube campaigns are given in either style in the literature; uncertain ones are given here only by month.: Datumen följer nya stilen (gregoriansk kalender). Ryska framställningar använder den julianska kalendern, då 12 dagar efter, så freden i Bukarest dateras i ryska källor till den 16 maj 1812. Vissa datum för fälttågen vid Donau anges i litteraturen enligt endera stilen; osäkra datum anges här bara med månad.
The Serbian rising of 1804–1813 under Karađorđe is a war of its own; it appears here only where it joined the Russian war.: Det serbiska upproret 1804–1813 under Karađorđe är ett eget krig; det tas upp här bara där det förenades med det ryska kriget.
In August 1806 Sultan Selim III, encouraged by France after Napoleon’s victory at Austerlitz, deposed the pro-Russian princes of Moldavia and Wallachia. In November a Russian army under General Ivan Michelson crossed the Dniester, took Khotyn and Bender and occupied both principalities, and in December the Ottomans declared war. In Serbia, where rebels led by Karađorđe had been fighting Ottoman forces since 1804, Russia found an ally. The rebels took Belgrade that winter, and Russian troops fought beside them from 1807.: I augusti 1806 avsatte sultan Selim III, uppmuntrad av Frankrike efter Napoleons seger vid Austerlitz, de ryssvänliga furstarna av Moldavien och Valakiet. I november gick en rysk armé under general Ivan Michelson över Dnestr, intog Chotyn och Bender och besatte båda furstendömena, och i december förklarade osmanerna krig. I Serbien, där rebeller under Karađorđe hade bekämpat osmanska styrkor sedan 1804, fann Ryssland en bundsförvant. Rebellerna intog Belgrad samma vinter, och ryska trupper stred vid deras sida från 1807.
In June 1807 a small Russian force under Mikhail Miloradovich stopped an Ottoman army marching on Bucharest at Obilești, and in the Caucasus Count Ivan Gudovich routed a much larger Ottoman army on the Arpachay. At sea, Vice-Admiral Dmitry Senyavin’s squadron blockaded the Dardanelles and beat the Ottoman fleet off the straits in May and near Mount Athos in July. After making peace with Napoleon at Tilsit, Russia agreed to an armistice in August 1807. When fighting resumed in 1809, Prince Pyotr Bagration took Izmail but failed before Silistra.: I juni 1807 stoppade en liten rysk styrka under Michail Miloradovitj en osmansk armé som marscherade mot Bukarest vid Obilești, och i Kaukasus krossade greve Ivan Gudovitj en betydligt större osmansk armé vid Arpatjaj. Till sjöss blockerade viceamiral Dmitrij Senjavins eskader Dardanellerna och besegrade den osmanska flottan utanför sundet i maj och nära berget Athos i juli. Sedan Ryssland slutit fred med Napoleon i Tilsit gick det med på ett vapenstillestånd i augusti 1807. När striderna återupptogs 1809 intog furst Pjotr Bagration Izmail men misslyckades vid Silistra.
