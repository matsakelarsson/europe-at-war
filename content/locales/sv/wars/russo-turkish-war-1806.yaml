Occupied by Russia, 1806–1812: Ockuperat av Ryssland 1806–1812
In 1810 General Nikolay Kamensky crossed into Bulgaria and took Silistra, but his assaults on Shumla and Ruse failed with heavy losses. After he routed an Ottoman force at Batin in September, Ruse surrendered. In the Caucasus Russian forces took Sukhum on the Abkhazian coast, and Russia deposed King Solomon II of Imereti and annexed his kingdom. Kamensky fell ill and died early in 1811. With war against Napoleon looming, Alexander I gave the command to Mikhail Kutuzov and told him to make peace quickly.: År 1810 gick general Nikolaj Kamenskij in i Bulgarien och intog Silistra, men hans stormningar mot Sjumla och Ruse misslyckades med svåra förluster. Sedan han krossat en osmansk styrka vid Batin i september kapitulerade Ruse. I Kaukasus intog ryska styrkor Suchum på den abchaziska kusten, och Ryssland avsatte kung Solomon II av Imeretien och annekterade hans kungarike. Kamenskij insjuknade och dog i början av 1811. När kriget mot Napoleon hotade gav Alexander I befälet till Michail Kutuzov och uppdrog åt honom att snabbt sluta fred.
Kutuzov beat the grand vizier, Ahmed Pasha, outside Ruse on 4 July 1811, then gave up the fortress and drew back across the Danube. When some 36,000 Ottoman troops followed him over the river, a Russian force crossed behind them, took their camp and cut them off at Slobozia. Hungry and sick, the survivors surrendered at the end of the year. By the Treaty of Bucharest, signed on 28 May 1812, Russia handed back Wallachia, western Moldavia and its gains in the Caucasus except Sukhum, but kept the eastern half of Moldavia, which it named Bessarabia. The Serbs were promised self-government, but in 1813 Ottoman forces reconquered Serbia.: Kutuzov besegrade storvesiren Ahmed pasha utanför Ruse den 4 juli 1811, men lämnade sedan fästningen och drog sig tillbaka över Donau. När omkring 36 000 osmanska soldater följde efter honom över floden gick en rysk styrka över bakom dem, intog deras läger och skar av dem vid Slobozia. Hungriga och sjuka kapitulerade de överlevande vid årets slut. Genom freden i Bukarest, undertecknad den 28 maj 1812, lämnade Ryssland tillbaka Valakiet, västra Moldavien och sina vinster i Kaukasus utom Suchum, men behöll den östra halvan av Moldavien, som fick namnet Bessarabien. Serberna utlovades självstyre, men 1813 återerövrade osmanska styrkor Serbien.
