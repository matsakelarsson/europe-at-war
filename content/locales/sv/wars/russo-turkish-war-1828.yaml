Paskevich stormed the town after beating Kios Pasha’s relief army. Thousands of defenders and townspeople died, and the citadel surrendered.: Paskevitj stormade staden sedan han besegrat Kios pashas undsättningsarmé. Tusentals försvarare och stadsbor dog, och citadellet kapitulerade.
Occupied by Russia, 1828–1834: Ockuperat av Ryssland 1828–1834
In 1829 General Hans Karl von Diebitsch replaced Wittgenstein and laid siege to Silistra. On 11 June he defeated the grand vizier, Reshid Mehmed Pasha, at Kulevcha as the Ottoman army marched out of Shumla, and Silistra surrendered at the end of the month. In July Diebitsch led about 35,000 men across the Balkan mountains, bypassing Shumla, took Burgas and the coastal towns with the help of the fleet, and on 20 August entered Adrianople, the second city of the empire, without a fight. His army was dwindling from disease, but the Ottomans did not know how weak it was.: År 1829 efterträdde general Hans Karl von Diebitsch Wittgenstein och belägrade Silistra. Den 11 juni besegrade han storvesiren Reshid Mehmed pasha vid Kulevtja när den osmanska armén marscherade ut från Sjumla, och Silistra kapitulerade i slutet av månaden. I juli ledde Diebitsch omkring 35 000 man över Balkanbergen, förbi Sjumla, intog Burgas och kuststäderna med flottans hjälp och ryckte den 20 augusti utan strid in i Adrianopel, rikets näst största stad. Hans armé krympte genom sjukdomar, men osmanerna visste inte hur svag den var.
In the east Paskevich beat the Ottoman army in the Saganlug mountains and entered Erzurum on 9 July. By the Treaty of Adrianople, signed on 14 September 1829, Russia returned Kars, Erzurum and its other conquests in Anatolia and Europe, but gained the mouths of the Danube, Akhaltsikhe and Akhalkalaki, and the Black Sea coast from the Kuban to Adjara. Moldavia and Wallachia became self-governing under Russian protection, and Russian troops stayed there until 1834. The sultan accepted the powers’ settlement for Greece, which became independent in 1830, and confirmed Serbia’s self-rule. Some 90,000 Armenians moved from Ottoman to Russian territory.: I öster besegrade Paskevitj den osmanska armén i Saganlugbergen och ryckte in i Erzurum den 9 juli. Genom freden i Adrianopel, undertecknad den 14 september 1829, lämnade Ryssland tillbaka Kars, Erzurum och sina övriga erövringar i Anatolien och Europa, men fick Donaus mynningar, Achaltsiche och Achalkalaki samt Svarta havets kust från Kuban till Adzjarien. Moldavien och Valakiet blev självstyrande under ryskt beskydd, och ryska trupper stannade där till 1834. Sultanen godtog stormakternas uppgörelse om Grekland, som blev självständigt 1830, och bekräftade Serbiens självstyre. Omkring 90 000 armenier flyttade från osmanskt till ryskt territorium.
