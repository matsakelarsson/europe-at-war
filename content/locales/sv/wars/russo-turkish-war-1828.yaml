Dates are New Style (Gregorian). Russian accounts use the Julian calendar, then 12 days behind, so the fall of Varna is 29 September 1828 and the Treaty of Adrianople 2 September 1829 in Russian sources.: Datumen följer nya stilen (gregoriansk kalender). Ryska framställningar använder den julianska kalendern, då 12 dagar efter, så Varnas fall anges i ryska källor till den 29 september 1828 och freden i Adrianopel till den 2 september 1829.
Adrianople is today’s Edirne, and Shumla is Shumen in Bulgaria.: Adrianopel är dagens Edirne, och Sjumla är Sjumen i Bulgarien.
At Navarino in October 1827 British, French and Russian squadrons destroyed the Ottoman and Egyptian fleet that was fighting the Greek rising. Sultan Mahmud II answered by repudiating his recent agreements with Russia and closing the Bosporus to Russian ships, and on 26 April 1828 Russia declared war. The Ottomans had abolished the Janissaries only two years before, and their new army was still being formed. Field Marshal Peter Wittgenstein’s army occupied Moldavia and Wallachia, and in June, with Nicholas I present, it crossed the Danube into Dobruja.: Vid Navarino i oktober 1827 förintade brittiska, franska och ryska eskadrar den osmanska och egyptiska flotta som bekämpade det grekiska upproret. Sultan Mahmud II svarade med att säga upp sina nyligen ingångna avtal med Ryssland och stänga Bosporen för ryska fartyg, och den 26 april 1828 förklarade Ryssland krig. Osmanerna hade avskaffat janitsjarerna bara två år tidigare, och deras nya armé höll fortfarande på att byggas upp. Fältmarskalk Peter Wittgensteins armé besatte Moldavien och Valakiet, och i juni gick den, i närvaro av Nikolaj I, över Donau in i Dobrudzja.
Brăila surrendered in June, but Shumla was too strong to take and Silistra held out. Varna, besieged from the land and from the sea by Admiral Aleksey Greig’s Black Sea Fleet, surrendered on 11 October. Disease and hunger killed many Russian soldiers, and the army fell back for the winter. In the Caucasus General Ivan Paskevich, with fewer than 20,000 men, took Kars in July and Akhalkalaki, then defeated a relief army and stormed Akhaltsikhe in late August. The burning town was taken street by street. Anapa and Poti on the Black Sea coast also fell.: Brăila kapitulerade i juni, men Sjumla var för starkt för att kunna intas och Silistra höll stånd. Varna, belägrat från land och från sjön av amiral Aleksej Greigs Svartahavsflotta, kapitulerade den 11 oktober. Sjukdomar och svält dödade många ryska soldater, och armén drog sig tillbaka för vintern. I Kaukasus intog general Ivan Paskevitj med färre än 20 000 man Kars i juli samt Achalkalaki, besegrade sedan en undsättningsarmé och stormade Achaltsiche i slutet av augusti. Den brinnande staden erövrades gata för gata. Även Anapa och Poti vid Svarta havets kust föll.
