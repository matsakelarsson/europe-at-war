Russo-Turkish War of 1828–1829: Rysk-turkiska kriget 1828–1829
A war between the Russian Empire and the Ottoman Empire that grew out of the Greek War of Independence. After the capture of Varna and Akhaltsikhe in 1828, Diebitsch’s march over the Balkan mountains to Adrianople in 1829 forced the Ottomans to make peace, giving Russia the mouths of the Danube, the eastern Black Sea coast and Akhaltsikhe, and opening the way to Greek independence.: Ett krig mellan Ryska riket och Osmanska riket som växte fram ur grekiska frihetskriget. Efter erövringen av Varna och Achaltsiche 1828 tvingade Diebitschs marsch över Balkanbergen till Adrianopel 1829 osmanerna att sluta fred, vilket gav Ryssland Donaus mynningar, Svarta havets östra kust och Achaltsiche och banade väg för Greklands självständighet.
