Russo-Turkish War of 1877–1878: Rysk-turkiska kriget 1877–1878
A war in which the Russian Empire, joined by Romania, Serbia and Montenegro, fought the Ottoman Empire after the bloody suppression of the Bulgarian April Uprising. Russian victories at Plevna, Shipka and Kars brought the Ottomans to the Treaty of San Stefano, revised at the Congress of Berlin in 1878, which created a Bulgarian principality and made Romania, Serbia and Montenegro independent.: Ett krig där Ryska riket, tillsammans med Rumänien, Serbien och Montenegro, kämpade mot Osmanska riket efter det blodiga nedslåendet av det bulgariska aprilupproret. Ryska segrar vid Plevna, Sjipka och Kars tvingade osmanerna till freden i San Stefano, som reviderades vid Berlinkongressen 1878 och som skapade ett bulgariskt furstendöme och gjorde Rumänien, Serbien och Montenegro självständiga.
