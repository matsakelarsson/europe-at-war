In the Caucasus Russian columns under General Mikhail Loris-Melikov crossed the border at the start of the war. They took Ardahan in May and laid siege to Kars, while another column took Bayazid. In June the Ottoman commander, Ahmed Muhtar Pasha, beat the Russians at Zivin and drove them back to the border, relieving Kars, and Russian troops were themselves besieged in Bayazid. An Ottoman landing on the Black Sea coast set off a rising in Abkhazia.: I Kaukasus gick ryska kolonner under general Michail Loris-Melikov över gränsen vid krigets början. De intog Ardahan i maj och belägrade Kars, medan en annan kolonn intog Bayazid. I juni besegrade den osmanske befälhavaren Ahmed Muhtar pasha ryssarna vid Zivin och drev dem tillbaka till gränsen, vilket undsatte Kars, och ryska trupper blev själva belägrade i Bayazid. En osmansk landstigning vid Svarta havets kust utlöste ett uppror i Abchazien.
With reinforcements, the Russians broke Ahmed Muhtar Pasha’s army in the Aladzha heights east of Kars in October. On the night of 17–18 November they stormed Kars, taking thousands of prisoners. Russian troops then advanced on Erzurum, which they did not take before the armistice, and failed to take Batumi. Many Armenians welcomed the Russian advance, and many Muslims fled the lands Russia conquered.: Med förstärkningar krossade ryssarna Ahmed Muhtar pashas armé på Aladzjahöjderna öster om Kars i oktober. Natten mellan den 17 och 18 november stormade de Kars och tog tusentals fångar. Ryska trupper ryckte sedan fram mot Erzurum, som de inte hann inta före vapenstilleståndet, och misslyckades med att inta Batumi. Många armenier välkomnade den ryska framryckningen, och många muslimer flydde från de områden Ryssland erövrade.
