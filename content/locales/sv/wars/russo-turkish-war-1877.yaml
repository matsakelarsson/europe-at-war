Serbian and Montenegrin success: Serbiska och montenegrinska framgångar
In 1875 Christian peasants rose against Ottoman rule in Herzegovina and Bosnia, and in April 1876 the Bulgarians followed. Ottoman irregulars put down the April Uprising with massacres; at Batak alone some 5,000 people are thought to have been killed. Serbia and Montenegro went to war with the Ottomans in the summer of 1876, and Serbia was beaten. When a conference of the powers in Constantinople failed to impose reforms, Russia, having secured Austria-Hungary’s neutrality, declared war on 24 April 1877.: År 1875 reste sig kristna bönder mot det osmanska styret i Hercegovina och Bosnien, och i april 1876 följde bulgarerna efter. Osmanska irreguljära trupper slog ned aprilupproret med massakrer; bara i Batak tros omkring 5 000 människor ha dödats. Serbien och Montenegro gick i krig mot osmanerna sommaren 1876, och Serbien besegrades. När en stormaktskonferens i Konstantinopel misslyckades med att genomdriva reformer förklarade Ryssland, som hade säkrat Österrike-Ungerns neutralitet, krig den 24 april 1877.
Romania let Russian troops pass through its territory and on 21 May declared itself independent. On the night of 26–27 June General Mikhail Dragomirov’s division crossed the Danube in boats from Zimnicea and took Svishtov, and the army followed over a pontoon bridge. One column under General Iosif Gurko pushed south, took the old Bulgarian capital of Tarnovo on 7 July and crossed the Balkan mountains by a little-used pass, while another took the Danube fortress of Nikopol.: Rumänien lät ryska trupper passera genom sitt territorium och förklarade sig självständigt den 21 maj. Natten mellan den 26 och 27 juni gick general Michail Dragomirovs division över Donau i båtar från Zimnicea och intog Svisjtov, och armén följde efter över en pontonbro. En kolonn under general Iosif Gurko trängde söderut, intog den gamla bulgariska huvudstaden Tarnovo den 7 juli och gick över Balkanbergen genom ett föga använt pass, medan en annan intog Donaufästningen Nikopol.
