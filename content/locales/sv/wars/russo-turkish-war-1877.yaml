Gurko: Gurko
Gurko took the Shipka Pass from the south on 19 July and raided into the valley beyond, but he was driven back after the battle of Stara Zagora at the end of July. Ottoman troops then burned the town and killed thousands of its Bulgarian inhabitants; some estimates put the dead at about 14,000. As the Russians withdrew, many Bulgarians fled north with them. The pass was left to a small force of Russians and Bulgarian volunteers, the opalchentsi, while the main army was held at Plevna.: Gurko intog Sjipkapasset från söder den 19 juli och gjorde räder in i dalen bortom, men han drevs tillbaka efter slaget vid Stara Zagora i slutet av juli. Osmanska trupper brände därefter staden och dödade tusentals av dess bulgariska invånare; enligt vissa uppskattningar uppgick de döda till omkring 14 000. När ryssarna drog sig tillbaka flydde många bulgarer norrut med dem. Passet lämnades åt en liten styrka av ryssar och bulgariska frivilliga, opaltjentsi, medan huvudarmén var bunden vid Plevna.
On 21–26 August Suleiman Pasha’s army of some 30,000 men attacked the pass again and again. The defenders, about 5,000 Bulgarian volunteers and 2,500 Russians, ran out of ammunition and threw stones and the bodies of the dead before reinforcements arrived. A further attack in September also failed. Through the winter the defenders held the pass in snow and bitter cold, losing thousands to frostbite and disease. On 8–9 January 1878 Russian columns came down on both sides of the Ottoman camp at Sheynovo, and its army surrendered.: Den 21–26 augusti anföll Suleiman pashas armé på omkring 30 000 man passet gång på gång. Försvararna, omkring 5 000 bulgariska frivilliga och 2 500 ryssar, fick slut på ammunition och kastade stenar och de dödas kroppar innan förstärkningar anlände. Ytterligare ett anfall i september misslyckades också. Under vintern höll försvararna passet i snö och bitande kyla och förlorade tusentals man genom köldskador och sjukdomar. Den 8–9 januari 1878 kom ryska kolonner ned på båda sidor om det osmanska lägret vid Sjejnovo, och dess armé kapitulerade.
