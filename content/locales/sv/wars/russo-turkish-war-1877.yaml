Gurko’s raid: Gurkos räd
Osman Pasha marched an Ottoman army from Vidin to Plevna, a road junction west of the Russian advance, and dug in. Two Russian assaults in July were beaten off with heavy losses, and the Russians had to ask Romania for help. On 11 September a combined Russian and Romanian army made a third assault, with Prince Carol of Romania in nominal command. The Romanians took the Grivitsa redoubt and Skobelev’s troops broke into the defences in the south, but the attack failed with very heavy Russian and Romanian losses.: Osman pasha förde en osmansk armé från Vidin till Plevna, en vägknut väster om den ryska framryckningen, och grävde ned sig. Två ryska stormningar i juli slogs tillbaka med svåra förluster, och ryssarna tvingades be Rumänien om hjälp. Den 11 september gjorde en förenad rysk och rumänsk armé en tredje stormning, med furst Carol av Rumänien som nominell befälhavare. Rumänerna intog Grivitsaskansen och Skobelevs trupper bröt in i försvarsverken i söder, men anfallet misslyckades med mycket svåra ryska och rumänska förluster.
The allies then besieged the town under the engineer General Eduard Totleben, the defender of Sevastopol. Gurko cut its supply road at Gorni Dubnik in October. Starving and short of ammunition, Osman Pasha tried to break out on 10 December, was wounded and surrendered with about 40,000 men. The five-month siege had held up the Russian advance, but its end freed some 100,000 troops. Serbia re-entered the war a few days later, and in January Gurko crossed the mountains in deep snow and took Sofia.: De allierade belägrade sedan staden under ingenjörgeneralen Eduard Totleben, Sevastopols försvarare. Gurko skar av dess försörjningsväg vid Gorni Dubnik i oktober. Utsvulten och med ont om ammunition försökte Osman pasha bryta sig ut den 10 december, sårades och kapitulerade med omkring 40 000 man. Den fem månader långa belägringen hade hejdat den ryska framryckningen, men dess slut frigjorde omkring 100 000 soldater. Serbien gick åter in i kriget några dagar senare, och i januari gick Gurko över bergen i djup snö och intog Sofia.
