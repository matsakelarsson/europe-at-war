After Sheynovo the Russians advanced fast. Gurko took Plovdiv in January, and Adrianople fell without a fight. An armistice was signed on 31 January, with Russian troops close to Constantinople and a British fleet in the Sea of Marmara. Hundreds of thousands of Muslims fled before the Russian armies, and many were killed by Russian troops, Cossacks and Bulgarian bands. The Treaty of San Stefano, signed on 3 March 1878, created a large Bulgarian state stretching to the Aegean and Macedonia, and gave Russia southern Bessarabia and Kars, Ardahan, Batumi and Bayazid.: Efter Sjejnovo ryckte ryssarna snabbt fram. Gurko intog Plovdiv i januari, och Adrianopel föll utan strid. Ett vapenstillestånd undertecknades den 31 januari, med ryska trupper nära Konstantinopel och en brittisk flotta i Marmarasjön. Hundratusentals muslimer flydde undan de ryska arméerna, och många dödades av ryska trupper, kosacker och bulgariska band. Freden i San Stefano, undertecknad den 3 mars 1878, skapade en stor bulgarisk stat som sträckte sig till Egeiska havet och Makedonien och gav Ryssland södra Bessarabien samt Kars, Ardahan, Batumi och Bayazid.
Britain and Austria-Hungary feared that Bulgaria would be a Russian client, and the powers revised the treaty at the Congress of Berlin, which ended on 13 July. Bulgaria became a self-governing principality between the Danube and the Balkan mountains, with Sofia; Eastern Rumelia to the south stayed an autonomous Ottoman province, and Macedonia was returned to the sultan. Romania, Serbia and Montenegro became independent and gained land. Russia took back southern Bessarabia, giving Romania northern Dobruja instead, and kept Kars, Ardahan and Batumi. Austria-Hungary occupied Bosnia and Herzegovina, and Britain took Cyprus.: Storbritannien och Österrike-Ungern fruktade att Bulgarien skulle bli en rysk lydstat, och stormakterna reviderade fördraget vid Berlinkongressen, som avslutades den 13 juli. Bulgarien blev ett självstyrande furstendöme mellan Donau och Balkanbergen, med Sofia; Östrumelien i söder förblev en autonom osmansk provins, och Makedonien återlämnades till sultanen. Rumänien, Serbien och Montenegro blev självständiga och fick nya landområden. Ryssland tog tillbaka södra Bessarabien och gav i stället Rumänien norra Dobrudzja, och behöll Kars, Ardahan och Batumi. Österrike-Ungern ockuperade Bosnien och Hercegovina, och Storbritannien tog Cypern.
