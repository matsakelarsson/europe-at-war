Dates are New Style (Gregorian). Russia and the Balkan states used the Julian calendar, then 12 days behind, so the crossing of the Danube is 15 June 1877, the fall of Plevna 28 November 1877 and the Treaty of San Stefano 19 February 1878 in their sources. Bulgaria celebrates its liberation on 3 March.: Datumen följer nya stilen (gregoriansk kalender). Ryssland och Balkanstaterna använde den julianska kalendern, då 12 dagar efter, så i deras källor anges övergången av Donau till den 15 juni 1877, Plevnas fall till den 28 november 1877 och freden i San Stefano till den 19 februari 1878. Bulgarien firar sin befrielse den 3 mars.
Numbers of dead and of refugees are estimates and vary widely between sources.: Antalet döda och flyktingar är uppskattningar och varierar kraftigt mellan källorna.
Plevna is today’s Pleven, Adrianople is Edirne, and San Stefano is Yeşilköy, now part of Istanbul.: Plevna är dagens Pleven, Adrianopel är Edirne och San Stefano är Yeşilköy, numera en del av Istanbul.
