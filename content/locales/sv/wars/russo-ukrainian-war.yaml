By August Ukrainian forces had nearly surrounded Donetsk and Luhansk and were cutting the separatists off from the Russian border. In the second half of the month regular Russian units crossed into Ukraine; Moscow denied it, saying that any Russian soldiers there were volunteers. At Ilovaisk, east of Donetsk, Ukrainian troops, many of them from volunteer battalions, were encircled, and on 29 August they were cut down as they left by a corridor they had been promised; Ukrainian official figures put the dead at more than 360. A new thrust along the coast took Novoazovsk on 27 August and reached the outskirts of Mariupol.: I augusti hade ukrainska styrkor nästan omringat Donetsk och Luhansk och höll på att skära av separatisterna från den ryska gränsen. Under månadens andra hälft gick reguljära ryska förband in i Ukraina; Moskva förnekade det och hävdade att eventuella ryska soldater där var frivilliga. Vid Ilovajsk, öster om Donetsk, omringades ukrainska trupper, många av dem från frivilligbataljoner, och den 29 augusti höggs de ned när de lämnade området genom en korridor som de hade blivit lovade; enligt officiella ukrainska siffror dödades mer än 360. En ny stöt längs kusten intog Novoazovsk den 27 augusti och nådde Mariupols utkanter.
On 5 September representatives of Ukraine, Russia, the OSCE and the separatists signed the Minsk Protocol, which provided for a ceasefire, an exchange of prisoners, monitoring by the OSCE and a special status for parts of the Donetsk and Luhansk regions. The fighting slowed but never stopped. The separatists held elections of their own on 2 November, which Ukraine and Western governments rejected, and the battle for Donetsk airport, where Ukrainian troops had held out since May, went on through the winter. By then several thousand people had been killed and hundreds of thousands had fled their homes.: Den 5 september undertecknade företrädare för Ukraina, Ryssland, OSSE och separatisterna Minskprotokollet, som föreskrev eldupphör, utväxling av fångar, övervakning av OSSE och en särskild status för delar av regionerna Donetsk och Luhansk. Striderna avtog men upphörde aldrig. Separatisterna höll egna val den 2 november, som Ukraina och västliga regeringar underkände, och slaget om Donetsks flygplats, där ukrainska trupper hade hållit stånd sedan maj, fortsatte under vintern. Vid det laget hade flera tusen människor dödats och hundratusentals flytt från sina hem.
