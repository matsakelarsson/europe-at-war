The advance on Kyiv stalled in the north-western suburbs of Irpin, Bucha and Hostomel and on the roads from the east, as Ukrainian troops struck its long supply columns. On 25 March the Russian general staff said the first phase was over and that it would concentrate on the Donbas, and after talks in Istanbul on 29 March it announced that it would cut back its operations around Kyiv and Chernihiv. By early April Russian forces had left the Kyiv, Chernihiv and Sumy regions for Belarus and Russia. On 14 April the cruiser Moskva, flagship of the Black Sea Fleet, sank; Ukraine said it had hit her with missiles, while Russia spoke of a fire.: Framryckningen mot Kyiv körde fast i de nordvästra förorterna Irpin, Butja och Hostomel och på vägarna från öster, när ukrainska trupper angrep dess långa underhållskolonner. Den 25 mars meddelade den ryska generalstaben att den första fasen var över och att den skulle koncentrera sig på Donbas, och efter förhandlingar i Istanbul den 29 mars tillkännagav den att den skulle skära ned sina operationer kring Kyiv och Tjernihiv. I början av april hade ryska styrkor lämnat regionerna Kyiv, Tjernihiv och Sumy för Belarus och Ryssland. Den 14 april sjönk kryssaren Moskva, Svartahavsflottans flaggskepp; Ukraina uppgav att man hade träffat henne med robotar, medan Ryssland talade om en brand.
In the towns the Russians left behind, Ukrainian troops and journalists found the bodies of civilians in streets, yards and mass graves. In Bucha alone local officials counted more than 400 dead, many of them shot. UN human rights monitors documented the unlawful killing of dozens of civilians there, and a UN commission of inquiry later found that Russian forces had committed war crimes, including executions, in the Kyiv region. Russia denied it and called the images staged. On 8 April a missile carrying cluster munitions struck crowds waiting to be evacuated at Kramatorsk railway station, killing about 60 people; Russia blamed Ukraine.: I de orter som ryssarna lämnade efter sig fann ukrainska soldater och journalister kroppar av civila på gator, gårdar och i massgravar. Bara i Butja räknade lokala myndigheter mer än 400 döda, många av dem skjutna. FN:s människorättsobservatörer dokumenterade olagliga dödanden av dussintals civila där, och en undersökningskommission från FN fann senare att ryska styrkor hade begått krigsförbrytelser, bland annat avrättningar, i Kyivregionen. Ryssland förnekade detta och kallade bilderna iscensatta. Den 8 april slog en robot med klusterammunition ned i folkmassor som väntade på att evakueras vid Kramatorsks järnvägsstation och dödade omkring 60 människor; Ryssland lade skulden på Ukraina.
