On 6 September Ukraine broke through the thinly held Russian line near Balakliia, in the Kharkiv region, and within days retook Izium, Kupiansk and most of the region; Lyman followed on 1 October. Near Izium investigators exhumed more than 400 bodies from a burial site in a forest, most of them civilians, some with signs of torture. On 21 September Putin ordered a “partial mobilisation” of 300,000 reservists, and hundreds of thousands of Russian men left the country. On 8 October a lorry bomb damaged the Kerch bridge to Crimea, and from 10 October Russia struck Ukraine’s power stations and grid with waves of missiles and drones.: Den 6 september bröt Ukraina igenom den glest bemannade ryska linjen nära Balaklija i Charkivregionen och återtog inom några dagar Izium, Kupjansk och större delen av regionen; Lyman följde den 1 oktober. Nära Izium grävde utredare upp mer än 400 kroppar från en begravningsplats i en skog, de flesta civila och några med spår av tortyr. Den 21 september beordrade Putin en ”partiell mobilisering” av 300 000 reservister, och hundratusentals ryska män lämnade landet. Den 8 oktober skadade en lastbilsbomb Kertjbron till Krim, och från den 10 oktober angrep Ryssland Ukrainas kraftverk och elnät med vågor av robotar och drönare.
From 23 to 27 September Russian-installed authorities held votes in the occupied parts of the Donetsk, Luhansk, Zaporizhzhia and Kherson regions and announced large majorities for joining Russia, and on 30 September Putin proclaimed their annexation, although his forces did not hold all of their territory. On 12 October the UN General Assembly, by 143 votes to 5, called the annexations invalid. In the south Ukrainian forces had for months struck the bridges over the Dnipro that supplied the Russian troops on its western bank. On 9 November Russia announced a withdrawal across the river, and on 11 November Ukrainian troops entered Kherson.: Den 23–27 september höll myndigheter som installerats av Ryssland omröstningar i de ockuperade delarna av regionerna Donetsk, Luhansk, Zaporizjzja och Cherson och tillkännagav stora majoriteter för anslutning till Ryssland, och den 30 september utropade Putin deras annektering, trots att hans styrkor inte kontrollerade hela deras territorium. Den 12 oktober förklarade FN:s generalförsamling med 143 röster mot 5 annekteringarna ogiltiga. I söder hade ukrainska styrkor i månader angripit broarna över Dnepr som försörjde de ryska trupperna på flodens västra strand. Den 9 november tillkännagav Ryssland ett tillbakadragande över floden, och den 11 november ryckte ukrainska trupper in i Cherson.
