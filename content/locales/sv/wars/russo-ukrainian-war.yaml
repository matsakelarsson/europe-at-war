Through 2021 Russia massed troops on Ukraine’s borders and in Belarus, some 150,000–190,000 by Western estimates, while demanding guarantees that NATO would never admit Ukraine. On 21 February 2022 Vladimir Putin recognised the Donetsk and Luhansk people’s republics as independent states, and before dawn on 24 February he announced a “special military operation” to “demilitarise and denazify” Ukraine. Missiles struck cities and airfields across the country, and Russian columns crossed the border from Belarus, Russia and Crimea. Zelensky stayed in Kyiv and declared martial law and a general mobilisation, and Western governments imposed sweeping sanctions on Russia and began sending arms.: Under 2021 koncentrerade Ryssland trupper vid Ukrainas gränser och i Belarus, enligt västliga uppskattningar omkring 150 000–190 000 man, samtidigt som det krävde garantier för att Nato aldrig skulle ta upp Ukraina. Den 21 februari 2022 erkände Vladimir Putin folkrepublikerna Donetsk och Luhansk som självständiga stater, och före gryningen den 24 februari tillkännagav han en ”särskild militär operation” för att ”demilitarisera och denazifiera” Ukraina. Robotar slog ned i städer och på flygfält över hela landet, och ryska kolonner gick över gränsen från Belarus, Ryssland och Krim. Zelenskyj stannade i Kyiv och utlyste krigslagar och allmän mobilisering, och västliga regeringar införde långtgående sanktioner mot Ryssland och började skicka vapen.
From Belarus the invaders drove past Chornobyl towards Kyiv, and airborne troops landed at the Antonov airfield at Hostomel on the first day. Further east they surrounded Chernihiv, bypassed Sumy and Kharkiv and pushed to the eastern edge of Kyiv. From Crimea they took Kherson on 2 March, the only regional capital they captured in 2022, along with Melitopol and Berdiansk, seized the Zaporizhzhia nuclear power plant, Europe’s largest, on 4 March, and closed in on Mariupol. On 2 March the UN General Assembly demanded Russia’s withdrawal by 141 votes to 5. By the end of March more than four million Ukrainians had fled abroad.: Från Belarus ryckte angriparna fram förbi Tjornobyl mot Kyiv, och luftlandsättningstrupper landade vid Antonovflygfältet i Hostomel redan den första dagen. Längre österut omringade de Tjernihiv, gick förbi Sumy och Charkiv och trängde fram till Kyivs östra utkant. Från Krim intog de Cherson den 2 mars, den enda regionhuvudstad de erövrade 2022, liksom Melitopol och Berdjansk, tog den 4 mars Zaporizjzja kärnkraftverk, Europas största, och närmade sig Mariupol. Den 2 mars krävde FN:s generalförsamling med 141 röster mot 5 att Ryssland skulle dra sig tillbaka. Vid slutet av mars hade mer än fyra miljoner ukrainare flytt utomlands.
