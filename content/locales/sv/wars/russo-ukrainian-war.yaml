In November 2013 President Viktor Yanukovych, under pressure from Russia, dropped an association agreement with the European Union that he had promised to sign. Protests on Kyiv’s Maidan Nezalezhnosti, the Euromaidan, swelled after riot police beat students, and clashes grew through the winter. Between 18 and 20 February 2014 more than a hundred people were killed in central Kyiv, most of them protesters shot by the security forces. Yanukovych fled the capital on 21 February, and the next day parliament voted to remove him. Russia called the change of government an unconstitutional coup.: I november 2013 övergav president Viktor Janukovytj under ryskt tryck ett associeringsavtal med Europeiska unionen som han hade lovat att underteckna. Protesterna på Majdan Nezalezjnosti i Kyiv, Euromajdan, växte sedan kravallpolis misshandlat studenter, och sammandrabbningarna tilltog under vintern. Mellan den 18 och 20 februari 2014 dödades mer än hundra människor i centrala Kyiv, de flesta av dem demonstranter som skjutits av säkerhetsstyrkorna. Janukovytj flydde från huvudstaden den 21 februari, och dagen därpå röstade parlamentet för att avsätta honom. Ryssland kallade regeringsskiftet en grundlagsstridig kupp.
From 27 February Russian soldiers without insignia, whom Moscow at first described as local self-defence forces, seized Crimea’s parliament and government buildings, its airports and the roads to the mainland, and surrounded Ukrainian bases. Under their control the regional parliament installed a new premier, Sergei Aksyonov, and called a referendum, held on 16 March, which the new authorities said had returned 97 per cent for joining Russia. Russia signed a treaty annexing Crimea and Sevastopol on 18 March, and most Ukrainian troops left without a fight. On 27 March the UN General Assembly, by 100 votes to 11, affirmed Ukraine’s territorial integrity and said the referendum had no validity.: Från den 27 februari tog ryska soldater utan gradbeteckningar, som Moskva först beskrev som lokala självförsvarsstyrkor, kontroll över Krims parlament och regeringsbyggnader, dess flygplatser och vägarna till fastlandet, och omringade ukrainska baser. Under deras kontroll tillsatte det regionala parlamentet en ny premiärminister, Sergej Aksjonov, och utlyste en folkomröstning, som hölls den 16 mars och som de nya myndigheterna uppgav hade gett 97 procent för anslutning till Ryssland. Ryssland undertecknade ett fördrag om annektering av Krim och Sevastopol den 18 mars, och de flesta ukrainska trupper lämnade halvön utan strid. Den 27 mars bekräftade FN:s generalförsamling med 100 röster mot 11 Ukrainas territoriella integritet och förklarade att folkomröstningen saknade giltighet.
