Russo-Ukrainian War: Rysk-ukrainska kriget
? The war began in February 2014, after the Euromaidan protests and the flight of President Viktor Yanukovych, when Russian troops without insignia took control of Crimea, which Russia annexed in March after a referendum held under its military control; Ukraine and most members of the United Nations do not recognise the annexation. From April 2014 Russian-backed separatists, joined from August by regular Russian troops whose presence Russia denied, fought Ukrainian forces in the Donbas. The Minsk agreements of 2014 and 2015 reduced the fighting but did not end it, and by early 2022 some 14,000 people had been killed. On 24 February 2022 Russia launched a full-scale invasion. Its forces were driven back from around Kyiv that spring and lost ground near Kharkiv and Kherson in the autumn, but held much of the south and east, and in September 2022 Russia proclaimed the annexation of the Donetsk, Luhansk, Zaporizhzhia and Kherson regions, which it did not fully control. The UN has confirmed well over 10,000 civilian deaths since 2022 and believes the real number is considerably higher, military losses on both sides are estimated in the hundreds of thousands killed and wounded, and millions of Ukrainians have fled abroad. The fighting continued through 2023–2026; peace talks mediated by the United States in November 2026 brought a prisoner exchange but no ceasefire, while Ukraine’s European allies prepared security guarantees and a multinational force for after a ceasefire. Last updated 26 November 2026.
: Kriget började i februari 2014, efter Euromajdanprotesterna och president Viktor Janukovytjs flykt, när ryska soldater utan gradbeteckningar tog kontrollen över Krim, som Ryssland annekterade i mars efter en folkomröstning som hölls under dess militära kontroll; Ukraina och de flesta av FN:s medlemsstater erkänner inte annekteringen. Från april 2014 stred Rysslandsstödda separatister, från augusti förstärkta av reguljära ryska trupper vars närvaro Ryssland förnekade, mot ukrainska styrkor i Donbas. Minskavtalen 2014 och 2015 minskade striderna men avslutade dem inte, och i början av 2022 hade omkring 14 000 människor dödats. Den 24 februari 2022 inledde Ryssland en fullskalig invasion. Dess styrkor drevs tillbaka från området kring Kyiv under våren och förlorade terräng nära Charkiv och Cherson under hösten men höll stora delar av södra och östra Ukraina, och i september 2022 utropade Ryssland annekteringen av regionerna Donetsk, Luhansk, Zaporizjzja och Cherson, som det inte helt kontrollerade. FN har bekräftat betydligt fler än 10 000 civila dödsoffer sedan 2022 och bedömer att det verkliga antalet är avsevärt högre, de militära förlusterna på båda sidor uppskattas till hundratusentals döda och sårade, och miljontals ukrainare har flytt utomlands. Striderna fortsatte under 2023–2026; fredssamtal med USA som medlare i november 2026 ledde till ett fångutbyte men inget eldupphör, medan Ukrainas europeiska allierade förberedde säkerhetsgarantier och en multinationell styrka för tiden efter ett eldupphör. Senast uppdaterad 26 november 2026.
