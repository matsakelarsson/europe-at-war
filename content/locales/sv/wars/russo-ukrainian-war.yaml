Last updated 26 November 2026. Through the winter Russian strikes on power stations left much of Kyiv without heat in freezing weather, and Ukraine declared an energy emergency in January. Russia took Huliaipole in January and by February had, by most accounts, completed the capture of Pokrovsk and Myrnohrad, but its advance then slowed sharply. Ukraine won back ground early in the year, its first gains since 2023, and by ISW’s count Russia’s gains from January to October came to only about 117 square kilometres, against more than 5,000 in 2025; in September and October it lost more ground than it took, as Ukrainian forces pushed back north of Lyman. Fighting went on for Kostiantynivka.: Senast uppdaterad 26 november 2026. Under vintern lämnade ryska angrepp mot kraftverk stora delar av Kyiv utan värme i sträng kyla, och Ukraina utlyste ett energinödläge i januari. Ryssland intog Huljajpole i januari och hade i februari enligt de flesta bedömningar slutfört erövringen av Pokrovsk och Myrnohrad, men därefter bromsades dess framryckning kraftigt. Ukraina vann tillbaka terräng i början av året, sina första vinster sedan 2023, och enligt ISW uppgick Rysslands vinster från januari till oktober till endast omkring 117 kvadratkilometer, mot mer än 5 000 under 2025; i september och oktober förlorade landet mer terräng än det vann, när ukrainska styrkor trängde tillbaka ryssarna norr om Lyman. Striderna om Kostjantynivka fortsatte.
Russian air attacks went on. A strike on an apartment building in Kyiv on 14 May killed 24 people, and on 2 November a strike on a school in Komyshuvakha, in the Zaporizhzhia region, that was being used as an aid centre and shelter killed 72 people, according to Ukrainian authorities. On 20 November ballistic missiles hit three bridges over the Dnipro in Kyiv and killed seven people, employees of the city’s water utility, according to the mayor. The UN said in November that 17,994 civilians had been confirmed killed and 57,854 injured since February 2022. In April the European Union approved a loan of €90 billion to fund Ukraine in 2026 and 2027, and in July Zelensky replaced the commander-in-chief, Oleksandr Syrskyi, with Mykhailo Drapatyi.: De ryska luftangreppen fortsatte. Ett angrepp mot ett flerbostadshus i Kyiv den 14 maj dödade 24 människor, och den 2 november dödade ett angrepp mot en skola i Komysjuvacha i Zaporizjzjaregionen, som användes som hjälpcentral och skyddsrum, 72 människor, enligt ukrainska myndigheter. Den 20 november träffade ballistiska robotar tre broar över Dnepr i Kyiv och dödade sju människor, anställda vid stadens vattenverk, enligt borgmästaren. FN uppgav i november att 17 994 civila bekräftats dödade och 57 854 skadade sedan februari 2022. I april godkände Europeiska unionen ett lån på 90 miljarder euro för att finansiera Ukraina 2026 och 2027, och i juli ersatte Zelenskyj överbefälhavaren Oleksandr Syrskyj med Mychajlo Drapatyj.
Talks between the United States, Ukraine and Russia in Abu Dhabi and Geneva in January and February brought prisoner exchanges but no breakthrough. On 10–11 November Russian and Ukrainian delegations met again in Abu Dhabi, for the first time in nine months, and agreed a large prisoner exchange, but not a ceasefire; the American envoys Steve Witkoff and Jared Kushner then met Putin in Moscow and Zelensky in Dublin. On 17 November Ukrainian drone and missile strikes brought down a section of the road bridge to Crimea. On 19 November leaders and envoys of some 40 countries, joined by Witkoff and Kushner, met in Berlin as the “Coalition of the Willing” and pledged to keep supporting Ukraine into 2027 and to provide security guarantees, including a multinational force, once a ceasefire is reached; Putin had rejected foreign troops in Ukraine. Russia holds about a fifth of Ukraine, including Crimea.: Samtal mellan USA, Ukraina och Ryssland i Abu Dhabi och Genève i januari och februari ledde till fångutväxlingar men inget genombrott. Den 10–11 november möttes ryska och ukrainska delegationer på nytt i Abu Dhabi, för första gången på nio månader, och kom överens om ett stort fångutbyte, men inte om eldupphör; de amerikanska sändebuden Steve Witkoff och Jared Kushner träffade därefter Putin i Moskva och Zelenskyj i Dublin. Den 17 november fick ukrainska drönar- och robotangrepp en del av vägbron till Krim att rasa. Den 19 november möttes ledare och sändebud från omkring 40 länder, tillsammans med Witkoff och Kushner, i Berlin som ”de villigas koalition” och lovade att fortsätta stödja Ukraina in i 2027 och att ge säkerhetsgarantier, bland annat en multinationell styrka, när ett eldupphör väl har nåtts; Putin hade avvisat utländska trupper i Ukraina. Ryssland håller omkring en femtedel av Ukraina, inklusive Krim.
