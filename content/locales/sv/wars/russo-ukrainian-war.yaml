Through the winter Russian forces, many of them convicts recruited by the Wagner Group, a private military company, attacked Bakhmut in the longest and one of the bloodiest battles of the war. They took Soledar in January and Bakhmut, by then in ruins, in May; Wagner’s chief, Yevgeny Prigozhin, claimed it on 20 May. On 23–24 June Prigozhin led a mutiny, seized Rostov-on-Don and marched towards Moscow before turning back, and he died when his plane crashed in August. In March the International Criminal Court issued an arrest warrant for Putin over the unlawful deportation of children from occupied Ukraine.: Under vintern anföll ryska styrkor, många av dem straffångar som rekryterats av Wagnergruppen, ett privat militärföretag, Bachmut i krigets längsta och ett av dess blodigaste slag. De intog Soledar i januari och Bachmut, då i ruiner, i maj; Wagners chef Jevgenij Prigozjin gjorde anspråk på staden den 20 maj. Den 23–24 juni ledde Prigozjin ett myteri, tog kontroll över Rostov-na-Donu och marscherade mot Moskva innan han vände om, och han omkom när hans flygplan störtade i augusti. I mars utfärdade Internationella brottmålsdomstolen en arresteringsorder mot Putin för olaglig deportering av barn från det ockuperade Ukraina.
On 6 June the Kakhovka dam on the Dnipro, held by Russian forces, was destroyed, flooding towns and villages downstream and draining the reservoir; dozens of people drowned. Ukraine and Western governments blamed Russia, which blamed Ukraine. The same week Ukraine opened its long-awaited counteroffensive in the south, but deep minefields, trenches and drones held it to a few villages, Robotyne among them. Ukraine did better at sea, driving much of the Black Sea Fleet from Sevastopol with drones and missiles and opening a corridor for grain ships after Russia left the UN-brokered grain deal in July. In October Russia began a costly offensive against Avdiivka.: "Den 6 juni förstördes Kachovkadammen i Dnepr, som hölls av ryska styrkor, vilket översvämmade städer och byar nedströms och tömde reservoaren; dussintals människor drunknade. Ukraina och västliga regeringar lade skulden på Ryssland, som lade den på Ukraina. Samma vecka inledde Ukraina sin efterlängtade motoffensiv i söder, men djupa minfält, skyttegravar och drönare begränsade den till några få byar, bland dem Robotyne. Ukraina hade större framgång till sjöss: med drönare och robotar drev landet en stor del av Svartahavsflottan från Sevastopol och öppnade en korridor för spannmålsfartyg sedan Ryssland i juli lämnat det spannmålsavtal som FN förmedlat. I oktober inledde Ryssland en kostsam offensiv mot Avdijivka."
