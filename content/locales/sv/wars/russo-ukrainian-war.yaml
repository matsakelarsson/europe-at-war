Russia retook Sudzha in March 2025 and said in April that it had cleared the Kursk region, which Ukraine disputed; North Korea then confirmed that its troops had fought there. On 1 June Ukrainian drones, smuggled into Russia in lorries, struck strategic bombers at airfields as far away as Siberia. Russia’s summer offensive pushed into the Dnipropetrovsk region and closed on Pokrovsk, and by the counts of DeepState and ISW it gained some 4,300–5,300 square kilometres in the year. In December Ukraine withdrew from Siversk, and Russia claimed Pokrovsk, Vovchansk and Huliaipole, though Ukraine still held parts of Pokrovsk and had retaken Kupiansk.: Ryssland återtog Sudzja i mars 2025 och uppgav i april att det hade rensat Kurskregionen, vilket Ukraina bestred; Nordkorea bekräftade därefter att dess trupper hade stridit där. Den 1 juni angrep ukrainska drönare, som smugglats in i Ryssland i lastbilar, strategiska bombflygplan på flygbaser så långt bort som i Sibirien. Rysslands sommaroffensiv trängde in i Dnipropetrovskregionen och närmade sig Pokrovsk, och enligt DeepState och ISW vann landet omkring 4 300–5 300 kvadratkilometer under året. I december drog sig Ukraina tillbaka från Siversk, och Ryssland gjorde anspråk på Pokrovsk, Vovtjansk och Huljajpole, även om Ukraina fortfarande höll delar av Pokrovsk och hade återtagit Kupjansk.
Donald Trump’s new administration opened talks with Russia in Riyadh in February. After a clash between Trump and Zelensky at the White House on 28 February the United States briefly halted military aid, and on 11 March Ukraine accepted an American proposal for a 30-day ceasefire, which Russia did not. Direct Russian–Ukrainian talks in Istanbul from May to July produced the largest prisoner exchanges of the war, and Trump met Putin in Alaska on 15 August, but there was no ceasefire. An American peace plan in November led to talks in Geneva, Berlin and Florida; by the end of December Zelensky said a 20-point framework was 90 per cent agreed, but not territory.: Donald Trumps nya administration inledde samtal med Ryssland i Riyadh i februari. Efter en sammandrabbning mellan Trump och Zelenskyj i Vita huset den 28 februari avbröt USA tillfälligt det militära stödet, och den 11 mars godtog Ukraina ett amerikanskt förslag om 30 dagars eldupphör, vilket Ryssland inte gjorde. Direkta rysk-ukrainska samtal i Istanbul från maj till juli ledde till krigets största fångutväxlingar, och Trump mötte Putin i Alaska den 15 augusti, men något eldupphör blev det inte. En amerikansk fredsplan i november ledde till samtal i Genève, Berlin och Florida; i slutet av december uppgav Zelenskyj att man var överens till 90 procent om en ram i 20 punkter, men inte om territoriet.
Russian drone and missile attacks grew heavier. On 7 September Russia launched a record 810 drones, and the government building in Kyiv was damaged. On the night of 9–10 September drones crossed into Poland, where Polish and allied aircraft shot some down, and NATO launched Eastern Sentry to guard its eastern flank. A strike on apartment blocks in Ternopil on 19 November killed at least 38 people. The UN counted 2,514 civilians killed in 2025, the highest yearly toll since 2022.: De ryska drönar- och robotangreppen blev allt kraftigare. Den 7 september sände Ryssland upp rekordmånga drönare, 810 stycken, och regeringsbyggnaden i Kyiv skadades. Natten mellan den 9 och 10 september flög drönare in i Polen, där polska och allierade flygplan sköt ned några, och Nato inledde Eastern Sentry för att skydda sin östra flank. Ett angrepp mot flerbostadshus i Ternopil den 19 november dödade minst 38 människor. FN räknade 2 514 dödade civila 2025, den högsta årssiffran sedan 2022.
