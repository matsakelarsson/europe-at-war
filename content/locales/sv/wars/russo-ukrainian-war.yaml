In January 2015 the separatists, backed by Russian troops, opened a winter offensive. They took the ruins of Donetsk airport, and on 24 January rockets fired from separatist-held ground killed about 30 civilians in Mariupol. After talks in Minsk between the leaders of Ukraine, Russia, France and Germany, a new package of measures, Minsk II, was signed on 12 February. It provided for a ceasefire, the withdrawal of heavy weapons, an amnesty, local elections and a constitutional reform giving the separatist areas a special status, after which Ukraine would regain control of its border. The separatists went on attacking the Debaltseve salient, and Ukrainian forces withdrew on 18 February.: I januari 2015 inledde separatisterna, med stöd av ryska trupper, en vinteroffensiv. De intog ruinerna av Donetsks flygplats, och den 24 januari dödade raketer som avfyrats från separatistkontrollerat område omkring 30 civila i Mariupol. Efter förhandlingar i Minsk mellan ledarna för Ukraina, Ryssland, Frankrike och Tyskland undertecknades den 12 februari ett nytt åtgärdspaket, Minsk II. Det föreskrev eldupphör, tillbakadragande av tunga vapen, amnesti, lokala val och en författningsreform som gav separatistområdena en särskild status, varefter Ukraina skulle återfå kontrollen över sin gräns. Separatisterna fortsatte att anfalla Debaltsevefickan, och ukrainska styrkor drog sig tillbaka den 18 februari.
The line of contact, more than 400 kilometres long, then barely moved for seven years. Ceasefires were declared and broken, OSCE monitors recorded violations almost daily, and the political parts of Minsk II were never carried out, as Kyiv and Moscow disagreed over their order. From 2019 Russia gave passports to hundreds of thousands of people in the separatist areas. Volodymyr Zelensky, elected president that year, promised peace, and a ceasefire in July 2020 brought the quietest months of the war. By the end of 2021 the UN estimated that 14,200–14,400 people had been killed since 2014, about 3,400 of them civilians, including those aboard MH17.: Kontaktlinjen, mer än 400 kilometer lång, rörde sig sedan knappt på sju år. Eldupphör utlystes och bröts, OSSE:s observatörer registrerade kränkningar nästan dagligen, och de politiska delarna av Minsk II genomfördes aldrig, eftersom Kyiv och Moskva var oense om i vilken ordning de skulle ske. Från 2019 delade Ryssland ut pass till hundratusentals människor i separatistområdena. Volodymyr Zelenskyj, som valdes till president samma år, lovade fred, och ett eldupphör i juli 2020 gav krigets lugnaste månader. Vid utgången av 2021 uppskattade FN att 14 200–14 400 människor hade dödats sedan 2014, varav omkring 3 400 civila, inräknat de ombord på MH17.
