Mariupol, surrounded by early March, was pounded for weeks and largely destroyed. On 9 March a strike hit a maternity hospital, and on 16 March a bomb struck the Drama Theatre, where hundreds of civilians were sheltering and the word “children” had been painted in Russian on the ground outside; estimates of the dead there range from about a dozen to some 600. The last defenders, holed up in the Azovstal steelworks, surrendered between 16 and 20 May, and Russia said 2,439 had laid down their arms. The UN verified more than 1,300 civilian deaths in the city and believed the true figure to be thousands higher.: Mariupol, som var omringat i början av mars, bombarderades i veckor och förstördes till stor del. Den 9 mars träffades ett BB, och den 16 mars slog en bomb ned i Dramateatern, där hundratals civila sökte skydd och där ordet ”barn” hade målats på ryska på marken utanför; uppskattningarna av antalet döda där varierar från ett tiotal till omkring 600. De sista försvararna, som förskansat sig i stålverket Azovstal, kapitulerade mellan den 16 och 20 maj, och Ryssland uppgav att 2 439 hade lagt ned vapnen. FN bekräftade mer än 1 300 civila dödsfall i staden och bedömde att det verkliga antalet var flera tusen högre.
From 18 April Russia turned its main effort to the Donbas, grinding forward behind massed artillery. It took Popasna in May, Sievierodonetsk on 25 June and Lysychansk on 3 July, which gave it almost all of the Luhansk region, while its push south from Izium stalled before Sloviansk. On 30 June it abandoned Snake Island in the Black Sea. From June Ukraine received American HIMARS rocket launchers and used them against ammunition depots far behind the front. On 29 July an explosion killed some 50 Ukrainian prisoners of war, many of them from Azovstal, in a prison camp at Olenivka; each side blamed the other.: Från den 18 april lade Ryssland sin huvudsakliga kraft på Donbas och malde sig fram bakom massivt artilleri. Det intog Popasna i maj, Sjevjerodonetsk den 25 juni och Lysytjansk den 3 juli, vilket gav det nästan hela Luhanskregionen, medan dess stöt söderut från Izium körde fast framför Slovjansk. Den 30 juni övergav det Ormön i Svarta havet. Från juni fick Ukraina amerikanska HIMARS-raketartilleri och använde dem mot ammunitionsdepåer långt bakom fronten. Den 29 juli dödade en explosion omkring 50 ukrainska krigsfångar, många av dem från Azovstal, i ett fångläger i Olenivka; båda sidor anklagade varandra.
