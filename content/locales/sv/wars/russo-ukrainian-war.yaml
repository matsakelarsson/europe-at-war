Casualty figures are uncertain. Neither government publishes full figures for its own military losses, and the UN counts only civilian deaths it has verified.: Förlustsiffrorna är osäkra. Ingen av regeringarna offentliggör fullständiga siffror för sina egna militära förluster, och FN räknar bara de civila dödsfall som det har kunnat bekräfta.
Russia claims Crimea and Sevastopol (from 2014) and the Donetsk, Luhansk, Zaporizhzhia and Kherson regions (from 2022) as its own territory, after votes held under its control; Ukraine, the UN General Assembly and most states regard the annexations as invalid. The separatist “people’s republics” of 2014–2022 are shown as a side of their own, though they depended on Russian support.: Ryssland gör anspråk på Krim och Sevastopol (från 2014) och regionerna Donetsk, Luhansk, Zaporizjzja och Cherson (från 2022) som sitt eget territorium, efter omröstningar som hölls under dess kontroll; Ukraina, FN:s generalförsamling och de flesta stater betraktar annekteringarna som ogiltiga. Separatisternas ”folkrepubliker” 2014–2022 visas som en egen part, trots att de var beroende av ryskt stöd.
The zones of control and front lines are approximate, drawn from published maps and news reports. Fronts move constantly, and since 2023 a wide grey zone, covered by drones, has separated the armies in many places. Places are named in their Ukrainian form (Kyiv, Kharkiv, Luhansk).: Kontrollzonerna och frontlinjerna är ungefärliga och bygger på publicerade kartor och nyhetsrapporter. Fronterna rör sig ständigt, och sedan 2023 har en bred grå zon, bevakad av drönare, skilt arméerna åt på många platser. Orter anges i sin ukrainska form (Kyiv, Charkiv, Luhansk).
