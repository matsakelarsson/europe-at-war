In March and April pro-Russian protesters seized government buildings across eastern Ukraine, and armed separatists proclaimed a Donetsk People’s Republic on 7 April and a Luhansk People’s Republic on 27 April. On 12 April armed men led by Igor Girkin, a former officer of Russia’s security service, took Sloviansk and Kramatorsk, and Ukraine’s interim government began what it called an anti-terrorist operation. On 2 May 48 people died in Odesa, most of them pro-Russian activists trapped in a burning trade union building after street clashes. The separatists held referendums on 11 May that Kyiv and Western governments rejected, and on 25 May Petro Poroshenko was elected president.: I mars och april ockuperade proryska demonstranter regeringsbyggnader runt om i östra Ukraina, och beväpnade separatister utropade en folkrepublik Donetsk den 7 april och en folkrepublik Luhansk den 27 april. Den 12 april intog beväpnade män under Igor Girkin, en före detta officer i den ryska säkerhetstjänsten, Slovjansk och Kramatorsk, och Ukrainas interimsregering inledde det den kallade en antiterroristoperation. Den 2 maj dog 48 människor i Odesa, de flesta av dem proryska aktivister som blivit instängda i en brinnande fackföreningsbyggnad efter gatustrider. Separatisterna höll den 11 maj folkomröstningar som Kyiv och västliga regeringar underkände, och den 25 maj valdes Petro Porosjenko till president.
Ukrainian forces retook Mariupol in June and Sloviansk and Kramatorsk on 5 July, when Girkin’s men fell back on Donetsk. On 17 July Malaysia Airlines flight MH17, from Amsterdam to Kuala Lumpur, was shot down over separatist-held ground; all 298 people on board, 196 of them Dutch, were killed. A Dutch-led international investigation found that it was hit by a Buk missile from a Russian army brigade, brought across the border and taken back afterwards. A Dutch court convicted two Russians and a Ukrainian separatist of murder in their absence in 2022, and the council of the UN’s civil aviation organisation found Russia responsible in 2025. Russia denies any part in it.: Ukrainska styrkor återtog Mariupol i juni och Slovjansk och Kramatorsk den 5 juli, då Girkins män drog sig tillbaka till Donetsk. Den 17 juli sköts Malaysia Airlines flight MH17, från Amsterdam till Kuala Lumpur, ned över separatistkontrollerat område; samtliga 298 personer ombord, varav 196 nederländare, omkom. En nederländskledd internationell utredning fann att planet träffades av en Bukrobot från en rysk armébrigad, som förts över gränsen och därefter tagits tillbaka. En nederländsk domstol dömde 2022 två ryssar och en ukrainsk separatist i deras frånvaro för mord, och rådet i FN:s civila luftfartsorganisation fann 2025 Ryssland ansvarigt. Ryssland förnekar all inblandning.
