Ukrainian forces withdrew from Avdiivka on 17 February 2024 after a four-month assault that cost Russia heavy losses, while a new American aid package was held up in Congress until April. On 10 May Russia opened a new front north of Kharkiv, around Vovchansk, and Ukraine’s allies then allowed it to strike targets in Russia near the border with their weapons. Through the summer and autumn Russian forces pressed west towards Pokrovsk, a logistics hub, taking Vuhledar in October and Selydove soon after. On 8 July a missile hit Okhmatdyt, Ukraine’s largest children’s hospital, in Kyiv, and in November Russia fired a new intermediate-range missile, the Oreshnik, at Dnipro.: Ukrainska styrkor drog sig tillbaka från Avdijivka den 17 februari 2024 efter ett fyra månader långt anfall som kostade Ryssland svåra förluster, medan ett nytt amerikanskt stödpaket låg fast i kongressen till april. Den 10 maj öppnade Ryssland en ny front norr om Charkiv, kring Vovtjansk, och Ukrainas allierade lät då landet med deras vapen angripa mål i Ryssland nära gränsen. Under sommaren och hösten trängde ryska styrkor västerut mot Pokrovsk, ett logistiknav, och intog Vuhledar i oktober och kort därefter Selydove. Den 8 juli träffade en robot Ochmatdyt, Ukrainas största barnsjukhus, i Kyiv, och i november avfyrade Ryssland en ny medeldistansrobot, Oresjnik, mot Dnipro.
On 6 August Ukrainian troops crossed the border into Russia’s Kursk region, the first invasion of Russian territory by a foreign army since the Second World War, and took the town of Sudzha and, by Ukraine’s account, more than 1,000 square kilometres. Russia brought in thousands of North Korean soldiers, some 11,000–12,000 by Western and South Korean estimates, to help win the ground back. Ukraine hoped the incursion would draw Russian troops away from the Donbas, but the advance on Pokrovsk went on, and by the end of the year Russia had made its largest gains since 2022.: Den 6 augusti gick ukrainska trupper över gränsen in i Rysslands Kurskregion, den första invasionen av ryskt territorium av en utländsk armé sedan andra världskriget, och intog staden Sudzja och, enligt Ukraina, mer än 1 000 kvadratkilometer. Ryssland tog in tusentals nordkoreanska soldater, enligt västliga och sydkoreanska uppskattningar omkring 11 000–12 000, för att hjälpa till att återta området. Ukraina hoppades att inträngningen skulle dra bort ryska trupper från Donbas, men framryckningen mot Pokrovsk fortsatte, och vid årets slut hade Ryssland gjort sina största vinster sedan 2022.
