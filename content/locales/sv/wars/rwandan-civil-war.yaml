# Svenska översättningar av katalogtexten (våg 13); stegtexterna kommer senare.
Rwandan Civil War: Inbördeskriget i Rwanda
? The war between the Rwandan government of President Juvénal Habyarimana and the Rwandan Patriotic Front (RPF), a rebel army formed mostly of Tutsi refugees in Uganda, during which extremists in the government carried out the genocide against the Tutsi in 1994. Hundreds of thousands of Tutsi had fled Rwanda after the revolution of 1959–1962, and many of their children grew up in Uganda, where Fred Rwigyema and Paul Kagame rose in Yoweri Museveni’s army. On 1 October 1990 the RPF invaded from Uganda; with French, Belgian and Zairian help the Rwandan army threw it back, and Rwigyema was killed. Under Kagame the RPF fought a guerrilla war from the Virunga mountains and the northern border, while the government arrested thousands of Tutsi and local officials organised massacres of them. A ceasefire in July 1992 led to talks at Arusha, and after a new RPF offensive in February 1993 brought it within 30 kilometres of Kigali, the Arusha Accords of 4 August 1993 provided for power-sharing, a merged army and a UN peacekeeping force, UNAMIR. Extremists of the Hutu Power movement, with their militias, the Interahamwe and Impuzamugambi, and the radio station RTLM, rejected the deal. On 6 April 1994 Habyarimana’s plane was shot down over Kigali, and within hours soldiers and militias began killing Tutsi and moderate Hutu across the country. In about 100 days they killed between 500,000 and 662,000 Tutsi according to most scholarly estimates (the Rwandan government counts 1,074,017 victims of the genocide), as well as many Hutu opponents. The RPF resumed the war on 7–8 April, took Kigali on 4 July and the last government stronghold, Gisenyi, on 18 July, ending the genocide and the war; France’s Opération Turquoise held a zone in the south-west until August. About 2 million Hutu fled to Zaire, Tanzania and Burundi, and RPF soldiers also killed civilians, by some estimates tens of thousands. The war and the refugee camps in Zaire led directly to the Congo wars.
: Kriget mellan president Juvénal Habyarimanas rwandiska regering och Rwandiska patriotiska fronten (RPF), en rebellarmé som till största delen bestod av tutsiflyktingar i Uganda, under vilket extremister i regeringen genomförde folkmordet på tutsier 1994. Hundratusentals tutsier hade flytt från Rwanda efter revolutionen 1959–1962, och många av deras barn växte upp i Uganda, där Fred Rwigyema och Paul Kagame steg i graderna i Yoweri Musevenis armé. Den 1 oktober 1990 invaderade RPF från Uganda; med fransk, belgisk och zairisk hjälp slog den rwandiska armén tillbaka invasionen, och Rwigyema dödades. Under Kagame förde RPF ett gerillakrig från Virungabergen och den norra gränsen, medan regeringen grep tusentals tutsier och lokala tjänstemän organiserade massakrer på dem. En vapenvila i juli 1992 ledde till förhandlingar i Arusha, och sedan en ny RPF-offensiv i februari 1993 hade fört rörelsen till 30 kilometer från Kigali föreskrev Arushaavtalet den 4 augusti 1993 maktdelning, en sammanslagen armé och en fredsbevarande FN-styrka, UNAMIR. Extremister i Hutu Power-rörelsen, med sina miliser Interahamwe och Impuzamugambi och radiostationen RTLM, förkastade uppgörelsen. Den 6 april 1994 sköts Habyarimanas plan ned över Kigali, och inom några timmar började soldater och miliser döda tutsier och moderata hutuer i hela landet. På omkring 100 dagar dödade de mellan 500 000 och 662 000 tutsier enligt de flesta vetenskapliga uppskattningar (den rwandiska regeringen räknar med 1 074 017 offer för folkmordet), liksom många oppositionella hutuer. RPF återupptog kriget den 7–8 april, intog Kigali den 4 juli och regeringens sista fäste, Gisenyi, den 18 juli, vilket gjorde slut på folkmordet och kriget; Frankrikes Opération Turquoise höll en zon i sydväst till augusti. Omkring 2 miljoner hutuer flydde till Zaire, Tanzania och Burundi, och RPF-soldater dödade också civila, enligt vissa uppskattningar tiotusentals. Kriget och flyktinglägren i Zaire ledde direkt till Kongokrigen.
