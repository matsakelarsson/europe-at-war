# Svenska översättningar av katalogtexten (våg 13); stegtexterna kommer senare.
Rwandan Revolution and the Inyenzi raids: Rwandiska revolutionen och Inyenziräderna
? "The violent overthrow of the Tutsi monarchy in Rwanda, then a Belgian-administered UN trust territory, and the armed attempts of Tutsi exiles to return, from 1959 to the late 1960s. Under Belgian rule the Tutsi elite around the king (mwami) held almost all chiefships, and in 1957 Hutu intellectuals led by Grégoire Kayibanda answered with the Bahutu Manifesto. After King Mutara III Rudahigwa died in July 1959, his brother Kigeli V was installed against Belgian wishes and monarchists formed UNAR, while Kayibanda founded PARMEHUTU. On 1 November 1959 UNAR youths attacked the Hutu sub-chief Dominique Mbonyumutwa at Byimana; rumours of his death set off Hutu attacks on Tutsi officials and the burning of Tutsi homes across the country, and from 7 November the king’s militias struck back, killing Hutu leaders. The Belgian Colonel Guy Logiest restored order and then replaced Tutsi chiefs with Hutu, and PARMEHUTU won the communal elections of mid-1960; Kigeli left the country in July 1960. On 28 January 1961, with Logiest’s backing, Hutu councillors meeting at Gitarama proclaimed a republic, confirmed by a referendum on 25 September 1961 that abolished the monarchy, and Rwanda became independent on 1 July 1962 with Kayibanda as president. Local massacres of Tutsi went on through 1960 and 1961, and by late 1964 at least 336,000 Tutsi had fled to Burundi, Uganda, Tanganyika and the Congo. From late 1960 armed exiles, called Inyenzi (“cockroaches”), raided Rwanda from these countries. On 21 December 1963 several hundred crossed from Burundi, took the army camp at Gako in Bugesera and advanced towards Kigali before they were beaten. The government’s reprisals were the largest killing of Tutsi before 1994: estimates for December 1963 and January 1964 range from 1,000–3,000 (UN) and at least 10,000 (René Lemarchand) to 10,000–14,000 (World Council of Churches) and higher, many of them in Gikongoro prefecture, and the Tutsi politicians still in the country were executed. Smaller Inyenzi raids were repelled until about 1966–1967. The exiles and their children later formed the Rwandan Patriotic Front, which invaded in 1990."
: "Det våldsamma störtandet av tutsimonarkin i Rwanda, då ett belgiskt förvaltat förvaltarskapsområde under FN, och de landsflyktiga tutsiernas väpnade försök att återvända, från 1959 till slutet av 1960-talet. Under belgiskt styre innehade tutsieliten kring kungen (mwami) nästan alla hövdingaämbeten, och 1957 svarade hutuintellektuella under ledning av Grégoire Kayibanda med Bahutumanifestet. Sedan kung Mutara III Rudahigwa dött i juli 1959 insattes hans bror Kigeli V mot Belgiens vilja och monarkister bildade UNAR, medan Kayibanda grundade PARMEHUTU. Den 1 november 1959 angrep UNAR-ungdomar hutuunderhövdingen Dominique Mbonyumutwa i Byimana; rykten om hans död utlöste angrepp från hutuer på tutsiska ämbetsmän och nedbränning av tutsiers hem över hela landet, och från den 7 november slog kungens miliser tillbaka och dödade hutuledare. Den belgiske översten Guy Logiest återställde ordningen och ersatte sedan tutsihövdingar med hutuer, och PARMEHUTU vann kommunalvalen i mitten av 1960; Kigeli lämnade landet i juli 1960. Den 28 januari 1961 utropade hutuiska kommunalpolitiker, samlade i Gitarama, med Logiests stöd en republik, vilket bekräftades av en folkomröstning den 25 september 1961 som avskaffade monarkin, och Rwanda blev självständigt den 1 juli 1962 med Kayibanda som president. Lokala massakrer på tutsier fortsatte under 1960 och 1961, och i slutet av 1964 hade minst 336 000 tutsier flytt till Burundi, Uganda, Tanganyika och Kongo. Från slutet av 1960 gjorde beväpnade landsflyktiga, kallade Inyenzi (”kackerlackor”), räder in i Rwanda från dessa länder. Den 21 december 1963 gick flera hundra över gränsen från Burundi, intog armélägret i Gako i Bugesera och ryckte fram mot Kigali innan de slogs tillbaka. Regeringens repressalier var det största dödandet av tutsier före 1994: uppskattningarna för december 1963 och januari 1964 varierar från 1 000–3 000 (FN) och minst 10 000 (René Lemarchand) till 10 000–14 000 (Kyrkornas världsråd) och högre, många av dem i prefekturen Gikongoro, och de tutsiska politiker som fortfarande fanns kvar i landet avrättades. Mindre Inyenziräder slogs tillbaka fram till omkring 1966–1967. De landsflyktiga och deras barn bildade senare Rwandiska patriotiska fronten, som invaderade 1990."
