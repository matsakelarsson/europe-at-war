# Svenska översättningar av katalogtexten (våg 12); stegtexterna kommer senare.
Saadian succession war: Saadiska tronföljdskriget
? The war among the sons of Ahmad al-Mansur that split Saadian Morocco for a quarter of a century. When al-Mansur died of plague in August 1603, his sons Zidan, Abu Faris and Mohammed al-Shaykh al-Ma’mun fought over the throne, and the realm divided between a sultanate ruled from Marrakesh and one ruled from Fez. Marrakesh changed hands again and again; al-Ma’mun fled to Spain in 1608 and in 1610 handed over the port of Larache in return for Spanish help, a cession that cost him and the dynasty much of their standing. A scholar who proclaimed himself the Mahdi, Ahmad ibn Abi Mahalli, drove Zidan out of Marrakesh in 1612–1613; Spain took al-Ma’mura (Mehdya) in 1614; Moriscos expelled from Spain built a corsair state at Salé; and religious war leaders such as Muhammad al-Ayyashi fought the Spanish and Portuguese garrisons and defied the sultans. Plague added to the toll. The two Saadian states were reunited in 1627 under Zidan’s son Abd al-Malik II, but the dynasty never recovered its authority, and the zawiya of Dila and the Alaouites of Tafilalt divided the country after it.
: Kriget mellan Ahmad al-Mansurs söner, som splittrade det saadiska Marocko under ett kvarts sekel. När al-Mansur dog i pest i augusti 1603 stred hans söner Zidan, Abu Faris och Mohammed al-Shaykh al-Ma’mun om tronen, och riket delades mellan ett sultanat som styrdes från Marrakech och ett som styrdes från Fès. Marrakech bytte ägare gång på gång; al-Ma’mun flydde till Spanien 1608 och överlämnade 1610 hamnstaden Larache i utbyte mot spansk hjälp, en avträdelse som kostade honom och dynastin mycket av deras anseende. En lärd man som utropade sig till mahdi, Ahmad ibn Abi Mahalli, drev ut Zidan ur Marrakech 1612–1613; Spanien intog al-Ma’mura (Mehdya) 1614; moriskar som fördrivits från Spanien byggde upp en korsarstat i Salé; och religiösa krigsledare som Muhammad al-Ayyashi bekämpade de spanska och portugisiska garnisonerna och trotsade sultanerna. Pesten ökade antalet offer. De två saadiska staterna återförenades 1627 under Zidans son Abd al-Malik II, men dynastin återvann aldrig sin auktoritet, och efter den delade zawiyan i Dila och alawiterna i Tafilalt landet mellan sig.
