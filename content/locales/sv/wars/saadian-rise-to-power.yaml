# Svenska översättningar av katalogtexten (våg 12); stegtexterna kommer senare.
Saadian rise to power: Saadiernas väg till makten
? The rise of the Saadians, a family of sharifs (descendants of the Prophet) from the Draa valley, from leaders of the holy war against the Portuguese in the Sous to rulers of all Morocco. Recognised as war leader by the tribes and Sufi brotherhoods of the Sous in 1510, Muhammad al-Qa’im left the movement to his sons Ahmad al-Araj and Muhammad al-Shaykh, who took Marrakesh in 1524 or 1525. After the treaty of Tadla (1527) Morocco was divided between them and the Wattasid sultans of Fez, until the Saadians routed the Wattasids in 1536. In 1541 Muhammad al-Shaykh took the Portuguese fortress at Agadir, which made his name and led Portugal to abandon Safi and Azemmour; he then pushed his brother aside and in January 1549 took Fez. His attempt to take Tlemcen in 1550 brought him into conflict with the Ottomans of Algiers, who drove his army out in 1551 and in January 1554 took Fez and restored the Wattasid Abu Hassun. Muhammad al-Shaykh defeated and killed Abu Hassun and retook Fez in September 1554, ending the Wattasid dynasty.
: Hur saadierna, en sharifsläkt (ättlingar till Profeten) från Draadalen, steg från ledare för det heliga kriget mot portugiserna i Sous till härskare över hela Marocko. Muhammad al-Qa’im, som 1510 erkändes som krigsledare av stammarna och sufibrödraskapen i Sous, lämnade rörelsen i arv till sina söner Ahmad al-Araj och Muhammad al-Shaykh, som intog Marrakech 1524 eller 1525. Efter fördraget i Tadla (1527) var Marocko delat mellan dem och de wattasidiska sultanerna i Fès, tills saadierna krossade wattasiderna 1536. År 1541 intog Muhammad al-Shaykh den portugisiska fästningen i Agadir, vilket gjorde honom berömd och fick Portugal att överge Safi och Azemmour; därefter sköt han sin bror åt sidan och intog Fès i januari 1549. Hans försök att inta Tlemcen 1550 förde honom i konflikt med osmanerna i Alger, som drev ut hans armé 1551 och i januari 1554 intog Fès och återinsatte wattasiden Abu Hassun. Muhammad al-Shaykh besegrade och dödade Abu Hassun och återtog Fès i september 1554, vilket gjorde slut på wattasiddynastin.
