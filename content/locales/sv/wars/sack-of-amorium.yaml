In 837 the Emperor Theophilos raided the Abbasid frontier on the upper Euphrates, encouraged by the Khurramite rebels then fighting the caliph. He sacked Sozopetra, said by some sources to be the caliph’s birthplace, killed its men and enslaved its women and children. Once the revolt was crushed, al-Mu’tasim gathered a great army at Tarsus and chose as his target Amorium, the home of Theophilos’s family. One army under Afshin, with the emir of Melitene and Armenian princes, crossed the frontier in the north-east; the caliph led the other through the Cilician Gates. On 22 July Theophilos attacked Afshin at Anzen, near Dazimon. His army broke, and he escaped with difficulty.: År 837 härjade kejsar Theofilos den abbasidiska gränsen vid övre Eufrat, uppmuntrad av de khurramitiska rebeller som då bekämpade kalifen. Han plundrade Sozopetra, enligt vissa källor kalifens födelseort, dödade dess män och gjorde dess kvinnor och barn till slavar. Sedan upproret slagits ned samlade al-Mu’tasim en stor armé i Tarsos och valde som mål Amorium, Theofilos släkts hemstad. En armé under Afshin, med emiren av Melitene och armeniska furstar, gick över gränsen i nordost; kalifen ledde den andra genom Kilikiska porten. Den 22 juli anföll Theofilos Afshin vid Anzen, nära Dazimon. Hans armé bröts upp, och han undkom med nöd och näppe.
The caliph’s army found Ancyra abandoned, plundered it and laid siege to Amorium on 1 August. A defector showed the besiegers a stretch of wall that had been badly repaired, and they made a breach. After about two weeks Boiditzes, the officer holding the breach, went to bargain with the caliph on his own, and the Arabs broke in. The city was sacked and burned and its people killed or enslaved. Al-Mu’tasim turned home on hearing of a plot against him; many captives died on the march across the dry plateau. Forty-two officers who refused to convert were executed at Samarra in 845 and are venerated as the 42 Martyrs of Amorium.: Kalifens armé fann Ankyra övergivet, plundrade staden och belägrade Amorium den 1 augusti. En överlöpare visade belägrarna ett murparti som hade reparerats dåligt, och de slog en bräsch. Efter omkring två veckor gick Boiditzes, officeren som försvarade bräschen, på egen hand för att förhandla med kalifen, och araberna bröt sig in. Staden plundrades och brändes och dess invånare dödades eller gjordes till slavar. Al-Mu’tasim vände hem när han fick höra om en sammansvärjning mot honom; många fångar dog under marschen över den torra högplatån. Fyrtiotvå officerare som vägrade att konvertera avrättades i Samarra 845 och vördas som de 42 martyrerna från Amorium.
