The campaign is described by Byzantine chroniclers and, in more detail, by the Arab historian al-Tabari; Michael the Syrian gives what is thought the most reliable figure for the caliph’s army, about 80,000 fighting men. Other writers give far larger numbers, as they do for the dead of Amorium (30,000 according to al-Mas’udi, 70,000 according to Theophanes Continuatus).: Fälttåget skildras av bysantinska krönikörer och, mer ingående, av den arabiske historikern al-Tabari; Mikael syriern anger vad som anses vara den mest tillförlitliga siffran för kalifens armé, omkring 80 000 stridande. Andra skribenter anger betydligt större tal, liksom för antalet döda i Amorium (30 000 enligt al-Mas’udi, 70 000 enligt Theophanes Continuatus).
The date of the fall of Amorium is given by modern historians as 12, 13 or 15 August 838. Ancyra is today’s Ankara; Amorium lay near Emirdağ in Afyonkarahisar province, and the site of Sozopetra (Zibatra) is uncertain.: Amoriums fall dateras av moderna historiker till den 12, 13 eller 15 augusti 838. Ankyra är dagens Ankara; Amorium låg nära Emirdağ i provinsen Afyonkarahisar, och platsen för Sozopetra (Zibatra) är osäker.
