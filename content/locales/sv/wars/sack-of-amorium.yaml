Sack of Amorium: Plundringen av Amorium
The Abbasid caliph al-Mu’tasim’s revenge for the Byzantine sack of Sozopetra in 837. His armies beat the Emperor Theophilos at Anzen, took Ancyra and in August 838 stormed and destroyed Amorium, the home city of the ruling dynasty and one of the largest cities of Byzantine Asia Minor.: Den abbasidiske kalifen al-Mu’tasims hämnd för bysantinernas plundring av Sozopetra 837. Hans arméer slog kejsar Theofilos vid Anzen, intog Ankyra och stormade och förstörde i augusti 838 Amorium, den härskande dynastins hemstad och en av de största städerna i det bysantinska Mindre Asien.
