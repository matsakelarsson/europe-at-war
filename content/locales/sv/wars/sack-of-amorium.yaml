Sozopetra: Sozopetra
Theophilos’s army sacked the frontier town, whose fate the caliph set out to avenge. Its exact site is unknown.: Theofilos armé plundrade gränsstaden, vars öde kalifen ville hämnas. Dess exakta läge är okänt.
June 838: juni 838
The caliph’s main army gathered at the frontier city and crossed the Taurus through the Cilician Gates in late June.: Kalifens huvudarmé samlades i gränsstaden och gick över Taurus genom Kilikiska porten i slutet av juni.
22 July 838: 22 juli 838
Afshin’s horse archers broke the Byzantine army after a promising start. Theophilos and his guard were surrounded and fought their way out.: Afshins beridna bågskyttar bröt den bysantinska armén efter en lovande inledning. Theofilos och hans garde omringades och slog sig ut.
Ancyra: Ankyra
26 July 838: 26 juli 838
The inhabitants had fled to nearby mines, where an Arab detachment found them. The deserted city was plundered.: Invånarna hade flytt till närbelägna gruvor, där en arabisk avdelning fann dem. Den övergivna staden plundrades.
August 838: augusti 838
The Arabs broke in through a weak stretch of wall, sacked the city and burned it. Its iron gates were carried off to Samarra and later ended up in Aleppo.: Araberna bröt sig in genom ett svagt murparti, plundrade staden och brände den. Dess järnportar fördes till Samarra och hamnade senare i Aleppo.
