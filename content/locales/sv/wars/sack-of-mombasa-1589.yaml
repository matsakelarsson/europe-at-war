# Svenska översättningar av katalogtexten (våg 13); stegtexterna kommer senare.
Mir Ali Bey’s expeditions and the sack of Mombasa: Mir Ali Beys expeditioner och plundringen av Mombasa
The Ottoman challenge to Portugal on the Swahili coast in the 1580s and its end at Mombasa. The corsair Mir Ali Bey sailed from Yemen with a single galliot in 1585–1586 and was welcomed by town after town, from Mogadishu to Mombasa, as a deliverer from Portuguese tribute; only Malindi held out. He returned to Mocha with captured Portuguese ships, plunder and prisoners. A Portuguese fleet from Goa sacked Faza in 1587 and fined Mombasa. In 1588 Mir Ali Bey came back with five galleys and fortified Mombasa, and in March 1589 a fleet under Tomé de Sousa Coutinho attacked him there just as the Zimba, a mysterious army that had come up the coast from the Zambezi, crossed from the mainland. Caught between them, the Ottomans were destroyed and Mir Ali Bey surrendered to the Portuguese; Mombasa was sacked, and the Zimba were then beaten at Malindi by the Segeju. The Portuguese punished the towns that had joined the Ottomans, made Mombasa their headquarters and in 1593 began Fort Jesus.: Den osmanska utmaningen mot Portugal på Swahilikusten på 1580-talet och dess slut i Mombasa. Korsaren Mir Ali Bey seglade från Jemen med en enda galiot 1585–1586 och välkomnades av stad efter stad, från Mogadishu till Mombasa, som en befriare från den portugisiska tributen; endast Malindi stod emot. Han återvände till Mocha med erövrade portugisiska fartyg, byte och fångar. En portugisisk flotta från Goa plundrade Faza 1587 och bötfällde Mombasa. År 1588 kom Mir Ali Bey tillbaka med fem galärer och befäste Mombasa, och i mars 1589 anföll en flotta under Tomé de Sousa Coutinho honom där, just som zimba, en gåtfull armé som hade dragit upp längs kusten från Zambezi, gick över från fastlandet. Fångade mellan dem förintades osmanerna, och Mir Ali Bey kapitulerade inför portugiserna; Mombasa plundrades, och zimba besegrades sedan vid Malindi av segeju. Portugiserna straffade de städer som hade anslutit sig till osmanerna, gjorde Mombasa till sitt högkvarter och påbörjade 1593 bygget av Fort Jesus.
