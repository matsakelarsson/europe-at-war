Safavid conquest of Iran: Safavidernas erövring av Iran
The campaigns in which Ismail, the teenage head of the Safavid Sufi order of Ardabil, and his Turkmen followers, the Qizilbash, conquered Iran in ten years. In 1500–1501 they killed the Shirvanshah, defeated the Aq Qoyunlu at Sharur and took Tabriz, where Ismail was proclaimed shah and made Twelver Shi‘ism the religion of the state. His victory at Hamadan in 1503 gave him western and central Iran; by 1508 he had taken Diyarbakır and Baghdad, ending the Aq Qoyunlu; and in 1510 he defeated and killed the Uzbek ruler Muhammad Shaybani at Merv and annexed Khorasan. The Safavid state lasted until 1736, and its frontiers roughly foreshadowed those of modern Iran.: De fälttåg under vilka Ismail, den tonårige ledaren för safavidernas sufiorden i Ardabil, och hans turkmenska anhängare, qizilbash, erövrade Iran på tio år. Åren 1500–1501 dödade de shirvanshahen, besegrade Aq Qoyunlu vid Sharur och intog Tabriz, där Ismail utropades till shah och gjorde tolvshian till statsreligion. Segern vid Hamadan 1503 gav honom västra och centrala Iran; 1508 hade han intagit Diyarbakır och Bagdad och därmed gjort slut på Aq Qoyunlu; och 1510 besegrade och dödade han den uzbekiske härskaren Muhammad Shaybani vid Merv och annekterade Khorasan. Den safavidiska staten bestod till 1736, och dess gränser förebådade i stort sett det moderna Irans.
