# Svenska översättningar av katalogtexten (våg 7); stegtexterna kommer senare.
Safavid–Uzbek wars: Safavidisk-uzbekiska krigen
The long struggle for Khorasan between Safavid Persia and the Shaybanid Uzbeks of Bukhara, which began when Shah Ismail I defeated and killed Muhammad Shaybani at Merv in 1510. The Uzbeks raided and besieged Herat, Mashhad and Astarabad again and again whenever Persia was weak or busy fighting the Ottomans. The young Shah Tahmasp beat Ubaydullah Khan at Jam in 1528, but in 1588–1589 Abdullah Khan II took Herat and his son sacked Mashhad, and the Uzbeks held most of Khorasan for a decade. After Abdullah’s death Shah Abbas I won it back with his reformed army, retaking Mashhad and defeating the Uzbeks outside Herat in August 1598.: Den långa kampen om Khorasan mellan det safavidiska Persien och de shaybanidiska uzbekerna i Buchara, som inleddes när shah Ismail I besegrade och dödade Muhammad Shaybani vid Merv 1510. Uzbekerna plundrade och belägrade Herat, Mashhad och Astarabad gång på gång när Persien var svagt eller upptaget av krig mot osmanerna. Den unge shah Tahmasp slog Ubaydullah Khan vid Jam 1528, men 1588–1589 intog Abdullah Khan II Herat och hans son plundrade Mashhad, och uzbekerna behöll större delen av Khorasan i ett decennium. Efter Abdullahs död återvann shah Abbas I provinsen med sin reformerade armé, återtog Mashhad och besegrade uzbekerna utanför Herat i augusti 1598.
