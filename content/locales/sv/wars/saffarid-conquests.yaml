# Svenska översättningar av katalogtexten (våg 7); stegtexterna kommer senare.
Saffarid conquests: Saffaridernas erövringar
The conquests of Ya’qub ibn al-Layth, a coppersmith (saffar) from Sistan who rose from the local volunteer bands to build an empire across eastern Iran and Afghanistan, and of his brother Amr. Ya’qub took power in Sistan in 861, fought the Kharijites and the Zunbils, took Herat, Kerman and Kabul, ended Tahirid rule in Khorasan in 873 and took Fars, but when he marched on Baghdad the caliph’s army beat him at Dayr al-Aqul in 876. Amr made peace with the caliphs and ruled Khorasan, Fars, Kerman and Sistan until the caliph granted him Transoxiana, held by the Samanids. In 900 the Samanid Ismail ibn Ahmad defeated and captured him near Balkh, and Khorasan passed to the Samanids.: De erövringar som gjordes av Ya’qub ibn al-Layth, en kopparslagare (saffar) från Sistan som arbetade sig upp ur de lokala frivilligbanden och byggde ett välde över östra Iran och Afghanistan, och av hans bror Amr. Ya’qub tog makten i Sistan 861, bekämpade kharijiterna och zunbilerna, intog Herat, Kerman och Kabul, gjorde 873 slut på tahiridernas styre i Khorasan och intog Fars, men när han marscherade mot Bagdad slog kalifens armé honom vid Dayr al-Aqul 876. Amr slöt fred med kaliferna och härskade över Khorasan, Fars, Kerman och Sistan tills kalifen förlänade honom Transoxanien, som samaniderna behärskade. År 900 besegrade och tillfångatog samaniden Ismail ibn Ahmad honom nära Balkh, och Khorasan övergick till samaniderna.
