# Svenska översättningar av katalogtexten (våg 10); stegtexterna kommer senare.
Saga rebellion: Sagaupproret
? The first of the armed risings of former samurai (shizoku) against the Meiji government, in the former Saga (Hizen) domain in northern Kyushu. The samurai had lost their stipends, their status and their monopoly of arms, and when the government refused in 1873 to send an expedition against Korea (the Seikanron debate), the former justice minister Etō Shinpei and other councillors resigned in protest. In January 1874 Etō returned to Saga, where he led the Seikantō, the party for war with Korea, while the former Akita governor Shima Yoshitake led the Yūkokutō, conservatives who wanted the old order back. On 16 February their followers seized a bank and the government offices in the old Saga castle; estimates of their strength range from about 3,000 to 11,000. The interior minister Ōkubo Toshimichi took personal command, set up his headquarters at Hakata on 19 February and brought in some 5,000 soldiers and police with steamships and the telegraph. After the rebels lost a battle on the Saga–Fukuoka border on 22 February Etō disbanded his followers and fled; the rest fought on in the streets of Saga on 27 February, and government troops took the castle on 1 March. Government losses were 147 killed and 209 wounded, rebel losses 173 killed and 160 wounded. Etō was caught in Tosa on 28 March and Shima in Kagoshima; after a military trial they and eleven others were executed on 13 April, and Etō’s head was put on public display. Satsuma and Tosa did not rise with Saga, and the government’s speed set the pattern for the risings of 1876 and 1877.
: Den första av de väpnade resningar som tidigare samurajer (shizoku) gjorde mot Meijiregeringen, i den tidigare domänen Saga (Hizen) på norra Kyushu. Samurajerna hade förlorat sina underhåll, sin ställning och sitt monopol på vapen, och när regeringen 1873 vägrade att sända en expedition mot Korea (Seikanrondebatten) avgick den tidigare justitieministern Etō Shinpei och andra rådsmedlemmar i protest. I januari 1874 återvände Etō till Saga, där han ledde Seikantō, partiet för krig mot Korea, medan den tidigare guvernören i Akita Shima Yoshitake ledde Yūkokutō, konservativa som ville ha tillbaka den gamla ordningen. Den 16 februari intog deras anhängare en bank och regeringskontoren i den gamla borgen i Saga; uppskattningarna av deras styrka varierar från omkring 3 000 till 11 000. Inrikesministern Ōkubo Toshimichi tog personligen befälet, upprättade sitt högkvarter i Hakata den 19 februari och förde fram omkring 5 000 soldater och poliser med hjälp av ångfartyg och telegrafen. Sedan rebellerna hade förlorat en strid vid gränsen mellan Saga och Fukuoka den 22 februari upplöste Etō sina styrkor och flydde; de övriga fortsatte striden på Sagas gator den 27 februari, och regeringstrupperna intog borgen den 1 mars. Regeringens förluster var 147 dödade och 209 sårade, rebellernas 173 dödade och 160 sårade. Etō greps i Tosa den 28 mars och Shima i Kagoshima; efter en militär rättegång avrättades de och elva andra den 13 april, och Etōs huvud ställdes ut offentligt. Satsuma och Tosa reste sig inte tillsammans med Saga, och regeringens snabbhet blev mönstret för resningarna 1876 och 1877.
