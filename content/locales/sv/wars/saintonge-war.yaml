Saintonge War: Saintongekriget
A revolt of the lords of Poitou, led by Hugh X of Lusignan, count of La Marche, against Louis IX’s brother Alphonse, newly installed as count of Poitou, which Henry III of England joined in the hope of winning back his family’s lost lands. Louis took the Lusignan castles and beat the English and the rebels at the bridge of Taillebourg on the Charente on 21–22 July 1242 and at Saintes the next day. Henry withdrew to Bordeaux, Hugh submitted on 24 July, and a rising by Raymond VII of Toulouse collapsed by the end of the year. A truce followed in 1243, and the Treaty of Paris of 1259 settled the English king’s claims.: Ett uppror av herrarna i Poitou under Hugo X av Lusignan, greve av La Marche, mot Ludvig IX:s bror Alfons, nyligen insatt som greve av Poitou, som Henrik III av England anslöt sig till i hopp om att återvinna sin släkts förlorade länder. Ludvig intog Lusignans borgar och slog engelsmännen och rebellerna vid bron i Taillebourg över Charente den 21–22 juli 1242 och vid Saintes dagen därpå. Henrik drog sig tillbaka till Bordeaux, Hugo underkastade sig den 24 juli, och ett uppror under Raimond VII av Toulouse föll samman före årets slut. Ett stillestånd följde 1243, och freden i Paris 1259 avgjorde den engelske kungens anspråk.
