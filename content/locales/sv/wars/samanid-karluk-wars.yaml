# Svenska översättningar av katalogtexten (våg 7); stegtexterna kommer senare.
Samanid campaigns against the Karluks: Samanidernas fälttåg mot karlukerna
The campaigns of the Samanid rulers of Transoxiana against the Karluk Turks of the steppes to the north-east, which culminated in 893, when Ismail ibn Ahmad marched beyond the Syr Darya and took Taraz (Talas), the Karluks’ chief town. His troops carried off large numbers of slaves and livestock, and a Nestorian church in the town was turned into a mosque. With Ismail’s annexation of the principality of Ushrusana in the same years, the campaign secured the Samanid frontier on the Syr Darya and opened the steppe to Muslim merchants and missionaries. Many Turkic groups north of the river became Muslim in the following century, among them the Kara-Khanids, who overthrew the Samanids in 999.: De fälttåg som Transoxaniens samanidiska härskare förde mot karlukturkarna på stäpperna i nordost, och som kulminerade 893, när Ismail ibn Ahmad marscherade bortom Syr-Darja och intog Taraz (Talas), karlukernas främsta stad. Hans trupper förde bort stora mängder slavar och boskap, och en nestoriansk kyrka i staden gjordes om till moské. Tillsammans med Ismails annektering av furstendömet Ushrusana under samma år säkrade fälttåget den samanidiska gränsen vid Syr-Darja och öppnade stäppen för muslimska köpmän och missionärer. Många turkiska grupper norr om floden blev muslimer under det följande århundradet, bland dem karakhaniderna, som störtade samaniderna 999.
