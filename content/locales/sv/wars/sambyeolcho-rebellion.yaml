# Svenska översättningar av katalogtexten (våg 10); stegtexterna kommer senare.
Sambyeolcho rebellion: Sambyeolchoupproret
The last resistance to the peace between Goryeo and the Mongols, led by the Sambyeolcho, the elite units that had served Goryeo’s military rulers. When the court moved back from Ganghwa Island to Kaegyong in 1270 and ordered the units disbanded, their commander Bae Jung-son rebelled, made a royal relative, Wang On, king, and sailed south with more than 1,000 ships to the island of Jindo. From the fortress of Yongjang there the Sambyeolcho controlled the south-western coasts and islands and raided the provinces, and they took Jeju. In the fifth month of 1271 a Goryeo and Mongol army stormed Jindo; Wang On and Bae Jung-son were killed and more than 10,000 people were carried off. Kim Tong-jeong carried on the fight from Jeju until a force of 12,000 Goryeo, Mongol and Chinese troops took the island in 1273. Jeju then came under direct Yuan rule until 1294, and the way was clear for the Mongol invasions of Japan.: Det sista motståndet mot freden mellan Goryeo och mongolerna, lett av Sambyeolcho, de elitförband som hade tjänat Goryeos militära härskare. När hovet 1270 flyttade tillbaka från ön Ganghwa till Kaegyong och beordrade att förbanden skulle upplösas gjorde deras befälhavare Bae Jung-son uppror, utsåg en kunglig släkting, Wang On, till kung och seglade söderut med mer än 1 000 fartyg till ön Jindo. Från fästningen Yongjang där behärskade Sambyeolcho de sydvästra kusterna och öarna och gjorde räder in i provinserna, och de intog Jeju. I femte månaden 1271 stormade en armé från Goryeo och mongolerna Jindo; Wang On och Bae Jung-son dödades och mer än 10 000 människor fördes bort. Kim Tong-jeong fortsatte kampen från Jeju tills en styrka på 12 000 man ur Goryeos trupper, mongoler och kineser intog ön 1273. Jeju kom därefter under direkt Yuanstyre till 1294, och vägen låg öppen för mongolernas invasioner av Japan.
