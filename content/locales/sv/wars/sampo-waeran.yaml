# Svenska översättningar av katalogtexten (våg 10); stegtexterna kommer senare.
Revolt of the three ports (Sampo waeran): Upproret i de tre hamnarna (Sampo waeran)
? A revolt by the Japanese living in the three Korean ports open to Japanese trade, and the later clashes that grew out of it. From the early fifteenth century Joseon allowed Japanese ships to trade only at Busanpo (Busan), Jepo (Naeipo, in today’s Changwon) and Yeompo (Ulsan). Japanese from Tsushima settled there in growing numbers, from 206 in 1436 to more than 3,000 by 1494, while Joseon restricted the trade and from 1506 under King Jungjong enforced its laws strictly. In 1510, after Korean officials killed Japanese fishermen as suspected raiders, the residents rose on the fourth day of the fourth month with reinforcements from Tsushima under a member of the Sō family, about 4,500 men in all. They took the forts at Busanpo, killing its commander, and Jepo, capturing its commander, and attacked Dongnae and Ungcheon. Joseon troops retook Jepo on the nineteenth day of the month and the Japanese withdrew to Tsushima; a second landing at the end of the sixth month was beaten off. Relations were broken off until the Treaty of Imsin of 1512 reopened Jepo alone and halved the Sō’s trading ships. In the fourth month of 1544 some twenty Japanese ships raided the fort of Saryangjin (in today’s Tongyeong), and Joseon again cut off relations until 1547, when trade was limited to Busanpo. In the fifth month of 1555 a raiding fleet of more than seventy ships attacked Dalyangpo in Haenam and the forts of the south-west coast. Ten forts fell and the Jeolla army commander Won Jeok was killed before Yi Jun-gyeong’s army drove the raiders off, and an attack on Jeju was repulsed. After this Eulmyo incident Joseon made its Border Defence Council (Bibyeonsa) permanent.
: Ett uppror bland de japaner som bodde i de tre koreanska hamnar som var öppna för japansk handel, och de senare sammandrabbningar som växte fram ur det. Från början av 1400-talet tillät Joseon japanska fartyg att handla endast i Busanpo (Busan), Jepo (Naeipo, i dagens Changwon) och Yeompo (Ulsan). Japaner från Tsushima bosatte sig där i växande antal, från 206 år 1436 till mer än 3 000 år 1494, medan Joseon begränsade handeln och från 1506 under kung Jungjong tillämpade sina lagar strängt. År 1510, sedan koreanska ämbetsmän hade dödat japanska fiskare som misstänktes vara plundrare, reste sig invånarna den fjärde dagen i fjärde månaden med förstärkningar från Tsushima under en medlem av Sōklanen, sammanlagt omkring 4 500 man. De intog fästena i Busanpo, där de dödade befälhavaren, och Jepo, där de tillfångatog befälhavaren, och angrep Dongnae och Ungcheon. Joseons trupper återtog Jepo den nittonde dagen i månaden och japanerna drog sig tillbaka till Tsushima; en andra landstigning i slutet av sjätte månaden slogs tillbaka. Förbindelserna bröts tills Imsinfördraget 1512 öppnade enbart Jepo igen och halverade Sōklanens antal handelsfartyg. I fjärde månaden 1544 plundrade ett tjugotal japanska fartyg fästet Saryangjin (i dagens Tongyeong), och Joseon bröt åter förbindelserna fram till 1547, då handeln begränsades till Busanpo. I femte månaden 1555 angrep en plundringsflotta på mer än sjuttio fartyg Dalyangpo i Haenam och fästena på sydvästkusten. Tio fästen föll och Jeollaarméns befälhavare Won Jeok dödades innan Yi Jun-gyeongs armé drev bort plundrarna, och ett angrepp på Jeju slogs tillbaka. Efter denna Eulmyoincident gjorde Joseon sitt gränsförsvarsråd (Bibyeonsa) permanent.
