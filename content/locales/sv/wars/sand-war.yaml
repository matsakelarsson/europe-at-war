# Svenska översättningar av katalogtexten (våg 12); stegtexterna kommer senare.
Sand War: Sandkriget
? "A short border war between Morocco and Algeria in the autumn of 1963, a year after Algeria’s independence. France had never fixed the border south of Figuig and had attached the Sahara around Tindouf and Colomb-Béchar, with its iron ore and possible oil, to Algeria. Morocco, where the Istiqlal party’s idea of a Greater Morocco was widely held, claimed these lands and said that Algeria’s wartime leaders had promised to settle the question after independence; Ahmed Ben Bella’s government held to the colonial borders. On 25 September 1963 Moroccan troops seized the Algerian border posts of Hassi Beida and Tinjoub on the road from Colomb-Béchar to Tindouf. Algeria retook them on 8 October and Morocco took them back the following week, while a Moroccan push towards Tindouf stalled; Algeria opened a second front in the north, taking Ich near Figuig on 18 October. Egypt sent some 1,000 troops to help Algeria, and Cuba sent about 700 soldiers with tanks, who arrived at Oran on 22 October but saw little fighting. Mediation by the Organisation of African Unity, Haile Selassie of Ethiopia and Modibo Keïta of Mali brought Hassan II and Ben Bella to Bamako, where on 30 October they agreed a ceasefire from 2 November and a demilitarised zone watched by Ethiopian and Malian officers, the OAU’s first peacekeeping mission; fighting near Figuig went on for two more days. The losses were small: Algeria gave about 60 dead and Morocco 39, though later works give some 300 and 200. The border stayed in place: the two countries signed a border convention in 1972, which Morocco ratified only in 1989, and the war left a lasting distrust between them that shaped the Western Sahara conflict."
: "Ett kort gränskrig mellan Marocko och Algeriet hösten 1963, ett år efter Algeriets självständighet. Frankrike hade aldrig fastställt gränsen söder om Figuig och hade lagt Sahara kring Tindouf och Colomb-Béchar, med dess järnmalm och möjliga olja, till Algeriet. Marocko, där Istiqlalpartiets idé om ett Stormarocko hade brett stöd, gjorde anspråk på dessa områden och hävdade att Algeriets ledare under kriget hade lovat att lösa frågan efter självständigheten; Ahmed Ben Bellas regering höll fast vid de koloniala gränserna. Den 25 september 1963 tog marockanska trupper de algeriska gränsposteringarna Hassi Beida och Tinjoub på vägen från Colomb-Béchar till Tindouf. Algeriet återtog dem den 8 oktober och Marocko tog tillbaka dem veckan därpå, medan en marockansk framstöt mot Tindouf körde fast; Algeriet öppnade en andra front i norr och intog Ich nära Figuig den 18 oktober. Egypten sände omkring 1 000 soldater till Algeriets hjälp, och Kuba sände omkring 700 soldater med stridsvagnar, som anlände till Oran den 22 oktober men knappt deltog i striderna. Medling av Organisationen för afrikansk enhet, Haile Selassie av Etiopien och Modibo Keïta av Mali förde Hassan II och Ben Bella till Bamako, där de den 30 oktober enades om vapenvila från den 2 november och en demilitariserad zon som övervakades av etiopiska och maliska officerare, OAU:s första fredsbevarande insats; striderna nära Figuig fortsatte i ytterligare två dagar. Förlusterna var små: Algeriet uppgav omkring 60 döda och Marocko 39, även om senare verk anger omkring 300 respektive 200. Gränsen låg fast: de två länderna undertecknade en gränskonvention 1972, som Marocko ratificerade först 1989, och kriget lämnade ett bestående misstroende mellan dem som präglade Västsaharakonflikten."
