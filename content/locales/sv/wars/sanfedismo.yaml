Sanfedist campaign of 1799: Sanfedisternas fälttåg 1799
? The royalist peasant rising that destroyed the Parthenopean Republic, set up in Naples under French protection in January 1799. On 7 February Cardinal Fabrizio Ruffo, named vicar-general by the exiled King Ferdinand IV, landed in Calabria with eight companions and a banner bearing the royal arms and the cross. Within a month his Army of the Holy Faith (Armata della Santa Fede) had grown to some 17,000 men – peasants, priests, brigands and adventurers – and as the French withdrew most of their troops north to face the Austrians and Russians, it took Catanzaro, Crotone and Cosenza, sacked Altamura and by the end of April held Calabria, Basilicata and most of Apulia. Suspected republicans were killed in many of the towns it took. Supported by British ships and by Russian and Ottoman troops, the Sanfedisti fought their way into Naples on 13 June, and for weeks they and the city’s poor, the lazzaroni, pillaged and massacred. The republicans in the castles surrendered on terms that let them sail to Toulon, but Nelson, arriving on 24 June, refused to honour the capitulation and had them seized. The republican admiral Francesco Caracciolo was hanged from the yardarm of a Neapolitan frigate on 29 June. Of some 8,000 political prisoners, 99 were executed, among them the jurist Mario Pagano, the physician Domenico Cirillo and the journalist Eleonora Fonseca Pimentel, and hundreds more were imprisoned, deported or exiled.
: Det rojalistiska bondeuppror som krossade Parthenopeiska republiken, som upprättats i Neapel under franskt beskydd i januari 1799. Den 7 februari landsteg kardinal Fabrizio Ruffo, som utnämnts till generalvikarie av den landsflyktige kung Ferdinand IV, i Kalabrien med åtta följeslagare och ett baner med det kungliga vapnet och korset. Inom en månad hade hans Den heliga trons armé (Armata della Santa Fede) vuxit till omkring 17 000 man – bönder, präster, banditer och äventyrare – och när fransmännen drog huvuddelen av sina trupper norrut för att möta österrikarna och ryssarna intog den Catanzaro, Crotone och Cosenza, plundrade Altamura och höll i slutet av april Kalabrien, Basilicata och större delen av Apulien. Misstänkta republikaner dödades i många av de städer den intog. Med stöd av brittiska fartyg och ryska och osmanska trupper stred sig sanfedisterna in i Neapel den 13 juni, och i flera veckor plundrade och massakrerade de tillsammans med stadens fattiga, lazzaroni. Republikanerna i kastellen kapitulerade på villkor som lät dem segla till Toulon, men Nelson, som anlände den 24 juni, vägrade att respektera kapitulationen och lät gripa dem. Den republikanske amiralen Francesco Caracciolo hängdes från rånocken på en neapolitansk fregatt den 29 juni. Av omkring 8 000 politiska fångar avrättades 99, bland dem juristen Mario Pagano, läkaren Domenico Cirillo och journalisten Eleonora Fonseca Pimentel, och hundratals fler fängslades, deporterades eller förvisades.
