# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
Chinese risings in Manila (Sangley risings): Kinesiska resningar i Manila (sangleyresningarna)
? Risings of the Chinese of Spanish Manila, whom the Spanish called Sangleys, and the massacres that ended them. The Chinese traders and craftsmen who came with the junks from Fujian far outnumbered the Spanish in and around Manila, lived under fees, curfews and limits on their numbers, and were confined to their own quarter, the Parián, outside the walls. In March 1603 a Ming mission came to look for a “mountain of gold” said to be at Cavite; the Spanish took it for a scouting party for an invasion, and the Chinese of Manila were threatened by Spaniards, Tagalogs and Japanese alike. On 3 October 1603 they rose. They beat back an attack led by Luis Pérez Dasmariñas, who was killed with his men, but their assault on the walls on 6 October was stopped by artillery, and in the following weeks Spanish soldiers, Japanese residents of Dilao and Tagalog auxiliaries hunted them down. Estimates of the Chinese dead range from 15,000 to 25,000; about 128 of the Spanish side died. Trade with Fujian soon resumed and the Chinese community grew again. On 20 November 1639 Chinese labourers who had been settled by force on the crown estate at Calamba, in Laguna, and made to pay heavy rents rose in their turn; they took the church of San Pedro Macati, held the north bank of the Pasig for a week, and on 5 December Governor Sebastián Hurtado de Corcuera ordered every Chinese found to be killed. The last 6,000 to 7,000 surrendered on the shore of Laguna de Bay on 15 March 1640; estimates of the dead range from 17,000 to 24,000. In 1662 Zheng Chenggong (Koxinga), who had just taken Taiwan from the Dutch, sent the Dominican Vittorio Riccio to demand tribute from Manila. The Spanish withdrew their garrisons from Zamboanga and the Moluccas to defend the city, a clash in the Chinese quarter on 24 May led to the expulsion of the non-Christian Chinese, and on 4 June the governor ordered the killing of those who had not reported; many who fled to the hills died of hunger. Koxinga died in Taiwan on 23 June 1662 before any attack was made. Killings of Chinese followed again in 1762–1763, when Simón de Anda ordered the execution of Chinese who had sided with the British during their occupation of Manila.
: Resningar bland kineserna i det spanska Manila, som spanjorerna kallade sangleyer, och de massakrer som gjorde slut på dem. De kinesiska handelsmän och hantverkare som kom med djonkerna från Fujian var långt fler än spanjorerna i och kring Manila, levde under avgifter, utegångsförbud och begränsningar av sitt antal och var hänvisade till sitt eget kvarter, Parián, utanför murarna. I mars 1603 kom en Mingbeskickning för att leta efter ett ”guldberg” som sades finnas i Cavite; spanjorerna tog den för en spaningsstyrka inför en invasion, och Manilas kineser hotades av såväl spanjorer som tagaloger och japaner. Den 3 oktober 1603 reste de sig. De slog tillbaka ett anfall under Luis Pérez Dasmariñas, som dödades med sina män, men deras stormning av murarna den 6 oktober stoppades av artilleri, och under de följande veckorna jagade spanska soldater, japanska invånare i Dilao och tagalogiska hjälptrupper dem. Uppskattningarna av antalet döda kineser varierar från 15 000 till 25 000; omkring 128 dog på den spanska sidan. Handeln med Fujian återupptogs snart och den kinesiska befolkningen växte igen. Den 20 november 1639 reste sig i sin tur kinesiska arbetare som tvångsbosatts på kronogodset Calamba i Laguna och tvingats betala höga arrenden; de intog kyrkan San Pedro Macati, höll Pasigflodens norra strand i en vecka, och den 5 december beordrade guvernör Sebastián Hurtado de Corcuera att varje kines som påträffades skulle dödas. De sista 6 000 till 7 000 kapitulerade vid stranden av Laguna de Bay den 15 mars 1640; uppskattningarna av antalet döda varierar från 17 000 till 24 000. År 1662 sände Zheng Chenggong (Koxinga), som just hade tagit Taiwan från nederländarna, dominikanen Vittorio Riccio för att kräva tribut av Manila. Spanjorerna drog tillbaka sina garnisoner från Zamboanga och Moluckerna för att försvara staden, en sammandrabbning i det kinesiska kvarteret den 24 maj ledde till att de icke-kristna kineserna utvisades, och den 4 juni beordrade guvernören att de som inte hade anmält sig skulle dödas; många som flydde till bergen dog av svält. Koxinga dog på Taiwan den 23 juni 1662 innan något anfall hade gjorts. Dödandet av kineser upprepades 1762–1763, när Simón de Anda beordrade avrättning av de kineser som hade ställt sig på britternas sida under deras ockupation av Manila.
