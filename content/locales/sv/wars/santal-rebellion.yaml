# Svenska översättningar av katalogtexten (våg 8); stegtexterna kommer senare.
Santal rebellion: Santalupproret
? A rising of the Santals of the Rajmahal hills and the Damin-i-koh, in today’s Jharkhand, known to the Santals as the Hul (“rebellion”). Settled in the Damin-i-koh under East India Company rule from the 1830s, many Santals had fallen into debt to moneylenders and traders from the plains, lost land to zamindars and suffered from the police and the courts. On 30 June 1855 the brothers Sidhu and Kanhu Murmu of Bhognadih, with their brothers Chand and Bhairav, called on the Santals to drive out the outsiders, and thousands rose against moneylenders, zamindars and the Company, attacking police posts, plundering markets and cutting the roads and railway works between Bhagalpur and Rajmahal. They defeated several Company detachments in July, but were beaten at Maheshpur on 24 July. Company troops and landholders’ levies then crushed the rising, burning villages and killing many; martial law was in force from November 1855 to January 1856. Sidhu and Kanhu were captured and executed. Estimates of the number of Santals killed range from about 10,000 to more than 15,000. Afterwards the Company made the area a separate district with its own administration, the Santal Parganas, under Act XXXVII of 1855.
: En resning bland santalerna i Rajmahalbergen och Damin-i-koh, i dagens Jharkhand, som santalerna kallar Hul (”uppror”). Många santaler, som från 1830-talet hade bosatt sig i Damin-i-koh under Brittiska ostindiska kompaniets styre, hade hamnat i skuld hos penningutlånare och handlare från slätterna, förlorat jord till zamindarer och lidit under polisen och domstolarna. Den 30 juni 1855 uppmanade bröderna Sidhu och Kanhu Murmu från Bhognadih, tillsammans med sina bröder Chand och Bhairav, santalerna att driva ut de utomstående, och tusentals reste sig mot penningutlånare, zamindarer och kompaniet; de angrep polisposter, plundrade marknader och skar av vägarna och järnvägsbygget mellan Bhagalpur och Rajmahal. De besegrade flera av kompaniets truppavdelningar i juli men slogs vid Maheshpur den 24 juli. Kompaniets trupper och jordägarnas milisstyrkor krossade sedan resningen, brände byar och dödade många; krigslagar gällde från november 1855 till januari 1856. Sidhu och Kanhu tillfångatogs och avrättades. Uppskattningarna av antalet dödade santaler varierar från omkring 10 000 till mer än 15 000. Därefter gjorde kompaniet området till ett eget distrikt med egen förvaltning, Santal Parganas, genom lag XXXVII från 1855.
