# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
Communist insurgency in Sarawak: Den kommunistiska upprorsrörelsen i Sarawak
? "The guerrilla war of Sarawak’s communist movement against the British colony and then Malaysia. A clandestine communist organisation had grown among the Chinese of Sarawak since the 1950s, through trade unions, Chinese schools and the left wing of the Sarawak United People’s Party; the British called it the Clandestine Communist Organisation. After the Brunei revolt of December 1962 and the start of Indonesia’s confrontation with Malaysia, hundreds of young Chinese crossed into Indonesian Borneo, where with Indonesian army and communist help they formed the Sarawak People’s Guerrilla Force (PGRS, March 1964) and the North Kalimantan People’s Army (PARAKU, October 1965), and fought alongside Indonesian troops in raids across the border. To cut them off from supporters, the government moved some 7,500 rural Chinese into guarded settlements along the Kuching–Serian road in 1965. After 1965 Suharto’s Indonesia turned on its former allies: in 1967 Indonesian troops and Malaysian forces hunted the guerrillas in West Kalimantan, where Dayak attacks, widely believed to have been instigated by the army, killed many Chinese villagers in October–November 1967 and drove tens of thousands from the interior. The movement, organised from 1970 as the North Kalimantan Communist Party, fell back on the Rajang delta, where Malaysia set up the Rajang Area Security Command (RASCOM) at Sibu in 1972. In 1973–1974 the party’s leader Bong Kee Chok and 481 followers, about three quarters of its fighters, laid down their arms under the Sri Aman agreement; the last remaining guerrillas signed a peace agreement with the Sarawak government in Kuching on 17 October 1990. Casualty figures are uncertain: the government side counted about 100 dead, the guerrillas several hundred."
: "Det gerillakrig som Sarawaks kommunistiska rörelse förde mot den brittiska kolonin och sedan mot Malaysia. En hemlig kommunistisk organisation hade sedan 1950-talet vuxit fram bland kineserna i Sarawak, genom fackföreningar, kinesiska skolor och vänsterflygeln av Sarawak United People’s Party; britterna kallade den Clandestine Communist Organisation. Efter revolten i Brunei i december 1962 och början på Indonesiens konfrontation med Malaysia gick hundratals unga kineser över gränsen till indonesiska Borneo, där de med hjälp från den indonesiska armén och kommunisterna bildade Sarawaks folkliga gerillastyrka (PGRS, mars 1964) och Nordkalimantans folkarmé (PARAKU, oktober 1965) och stred tillsammans med indonesiska trupper i räder över gränsen. För att skära av dem från deras anhängare flyttade regeringen 1965 omkring 7 500 kineser från landsbygden till bevakade bosättningar längs vägen Kuching–Serian. Efter 1965 vände sig Suhartos Indonesien mot sina tidigare allierade: 1967 jagade indonesiska trupper och malaysiska styrkor gerillan i Västra Kalimantan, där dajakiska angrepp, som allmänt antas ha anstiftats av armén, dödade många kinesiska bybor i oktober–november 1967 och drev tiotusentals från inlandet. Rörelsen, som från 1970 var organiserad som Nordkalimantans kommunistiska parti, drog sig tillbaka till Rajangdeltat, där Malaysia 1972 upprättade Rajang Area Security Command (RASCOM) i Sibu. 1973–1974 nedlade partiets ledare Bong Kee Chok och 481 anhängare, omkring tre fjärdedelar av dess kämpar, vapnen enligt Sri Aman-avtalet; de sista återstående gerillakämparna undertecknade ett fredsavtal med Sarawaks regering i Kuching den 17 oktober 1990. Förlustsiffrorna är osäkra: på regeringssidan räknades omkring 100 döda, på gerillans sida flera hundra."
