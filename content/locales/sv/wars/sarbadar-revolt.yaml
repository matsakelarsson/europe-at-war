# Svenska översättningar av katalogtexten (våg 7); stegtexterna kommer senare.
Sarbadar revolt and the wars of the Sarbadars: Sarbadarupproret och sarbadarernas krig
? After the death of the Ilkhan Abu Sa’id in 1335 the Mongol state in Iran fell apart, and in western Khorasan, where the Ilkhanid claimant Togha Temür and his emirs taxed the countryside heavily, the people of the Bayhaq district rose in revolt. In 1337 a local notable, Abd al-Razzaq, killed a tax official and took to the hills with followers who called themselves sarbadar, “heads on the gallows”, and that summer they seized Sabzevar. Under his brother Mas’ud, who shared power with the Shi’i dervish leader Hasan Juri, the Sarbadars drove Togha Temür’s forces out of Nishapur, Jajarm, Damghan and Gorgan. On 18 July 1342 they attacked the Kartids of Herat at Zawa; Hasan Juri was killed in the battle, perhaps on Mas’ud’s orders, his followers left the field and the Kartids won. In 1344 Mas’ud was captured and executed while campaigning against Togha Temür in Mazandaran, and most of the conquests were lost. Ruled by a succession of commanders and dervish leaders, several of whom were murdered, the Sarbadars killed Togha Temür in 1353, fought the Kartids, the Ja’un-i Qurban Mongols of Tus and the emir Vali of Astarabad, and lost Sabzevar for a time in about 1376 to dervishes armed by the Muzaffarids of Shiraz. In 1381 their last ruler, Ali-yi Mu’ayyad, besieged by Vali, submitted to Timur, who left him to govern Sabzevar.
: Efter ilkhanen Abu Sa’ids död 1335 föll den mongoliska staten i Iran sönder, och i västra Khorasan, där den ilkhanidiske tronpretendenten Togha Temür och hans emirer beskattade landsbygden hårt, reste sig folket i distriktet Bayhaq. År 1337 dödade en lokal stormann, Abd al-Razzaq, en skatteämbetsman och gick upp i bergen med anhängare som kallade sig sarbadar, ”huvuden på galgen”, och samma sommar intog de Sabzevar. Under hans bror Mas’ud, som delade makten med den shiitiske dervischledaren Hasan Juri, drev sarbadarerna ut Togha Temürs styrkor ur Nishapur, Jajarm, Damghan och Gorgan. Den 18 juli 1342 anföll de kartiderna i Herat vid Zawa; Hasan Juri dödades i slaget, kanske på Mas’uds order, hans anhängare lämnade slagfältet, och kartiderna segrade. År 1344 tillfångatogs och avrättades Mas’ud under ett fälttåg mot Togha Temür i Mazandaran, och de flesta erövringarna gick förlorade. Under en rad befälhavare och dervischledare, av vilka flera mördades, dödade sarbadarerna Togha Temür 1353, stred mot kartiderna, mot Ja’un-i Qurban-mongolerna i Tus och mot emiren Vali av Astarabad och förlorade omkring 1376 Sabzevar för en tid till dervischer som hade beväpnats av muzaffariderna i Shiraz. År 1381 var deras siste härskare, Ali-yi Mu’ayyad, belägrad av Vali och underkastade sig Timur, som lät honom fortsätta att styra Sabzevar.
