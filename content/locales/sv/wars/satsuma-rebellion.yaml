# Svenska översättningar av katalogtexten (våg 10); stegtexterna kommer senare.
Satsuma Rebellion: Satsumaupproret
? The last and largest of the armed risings of former samurai against the Meiji government, known in Japan as the Seinan War (the south-western war). Saigō Takamori, a leader of the Meiji Restoration and chief of staff of the imperial army in the Boshin War, left the government in 1873 after it rejected his plan for a confrontation with Korea and returned to Kagoshima, where his private academies (shigakkō) trained thousands of young former samurai. Resentment grew as the government abolished the samurai’s stipends and their right to wear swords. In January 1877 academy students seized the arms in the government arsenals at Kagoshima, and when they believed they had uncovered a government plot to murder Saigō, he agreed to lead them to Tokyo. About 13,000 men left Kagoshima in mid-February and laid siege to Kumamoto Castle, but they could not take it. The new conscript army and militarised police, led by Yamagata Aritomo, fought its way through the Satsuma lines at Tabaruzaka in March and relieved Kumamoto in April, and over the summer drove the rebels back through Hitoyoshi, Miyakonojō and Miyazaki to Nobeoka. Saigō broke out of encirclement at Mount Enodake with a few hundred men and returned to Kagoshima, where he died in the final assault on Shiroyama on 24 September 1877. About 6,400 government and 6,800 rebel soldiers were killed. The war showed that a peasant conscript army could defeat the samurai, and ended armed resistance to the Meiji state.
: Det sista och största av de väpnade upproren bland före detta samurajer mot Meijiregeringen, i Japan känt som Seinankriget (det sydvästra kriget). Saigō Takamori, en av Meijirestaurationens ledare och stabschef för den kejserliga armén i Boshinkriget, lämnade regeringen 1873 sedan den avvisat hans plan för en konfrontation med Korea och återvände till Kagoshima, där hans privata akademier (shigakkō) utbildade tusentals unga före detta samurajer. Förbittringen växte när regeringen avskaffade samurajernas underhåll och deras rätt att bära svärd. I januari 1877 beslagtog akademielever vapnen i regeringens arsenaler i Kagoshima, och när de trodde att de hade avslöjat en regeringskomplott för att mörda Saigō gick han med på att leda dem till Tokyo. Omkring 13 000 man lämnade Kagoshima i mitten av februari och belägrade Kumamoto slott, men kunde inte inta det. Den nya värnpliktsarmén och den militariserade polisen, ledda av Yamagata Aritomo, slog sig igenom Satsumas linjer vid Tabaruzaka i mars och undsatte Kumamoto i april, och under sommaren drev de rebellerna tillbaka genom Hitoyoshi, Miyakonojō och Miyazaki till Nobeoka. Saigō bröt sig ut ur inringningen vid berget Enodake med några hundra man och återvände till Kagoshima, där han dog under den sista stormningen av Shiroyama den 24 september 1877. Omkring 6 400 av regeringens och 6 800 av rebellernas soldater dödades. Kriget visade att en värnpliktsarmé av bönder kunde besegra samurajerna, och det gjorde slut på det väpnade motståndet mot Meijistaten.
