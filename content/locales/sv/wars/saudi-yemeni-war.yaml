Saudi–Yemeni War: Saudisk-jemenitiska kriget
A short war between Saudi Arabia and the Mutawakkilite Kingdom of Yemen over Asir and Najran. After Imam Yahya sheltered the Idrisid ruler of Asir and occupied Najran, Saudi armies invaded Yemen in the spring of 1934. Crown Prince Saud’s advance in the northern mountains stalled, but Prince Faisal swept down the Tihama coast and took Hodeidah. By the Treaty of Taif, Yemen accepted Saudi rule over Asir, Jizan and Najran, and the Saudis withdrew from the Tihama.: Ett kort krig mellan Saudiarabien och det mutawakkilitiska kungariket Jemen om Asir och Najran. Sedan imam Yahya gett den idrisidiske härskaren av Asir skydd och ockuperat Najran invaderade saudiska arméer Jemen våren 1934. Kronprins Sauds framryckning i de norra bergen körde fast, men prins Faisal svepte fram längs Tihamakusten och intog Hodeidah. Genom fördraget i Taif godtog Jemen saudiskt styre över Asir, Jizan och Najran, och saudierna drog sig tillbaka från Tihama.
