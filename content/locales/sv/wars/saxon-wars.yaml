Almost everything known comes from Frankish writers, above all the Royal Frankish Annals and Einhard’s Life of Charlemagne; there is no Saxon account. Some historians have doubted the number killed at Verden, or suggested a scribal error, but most accept that a mass execution took place.: Nästan allt vi vet kommer från frankiska skribenter, framför allt de frankiska rikesannalerna och Einhards levnadsteckning över Karl den store; någon sachsisk skildring finns inte. Vissa historiker har ifrågasatt antalet dödade i Verden eller föreslagit ett skrivfel, men de flesta godtar att en massavrättning ägde rum.
The war began with the destruction of the Saxon sanctuary of the Irminsul, near the Eresburg (Marsberg), in 772. The Saxons’ last rising, the Stellinga of 841–845, came after Charlemagne’s death.: Kriget började med förstörelsen av saxarnas helgedom Irminsul nära Eresburg (Marsberg) 772. Saxarnas sista uppror, Stellinga 841–845, kom efter Karl den stores död.
