Saxon Wars: Sachsiska krigen
The wars in which Charlemagne conquered the pagan Saxons of what is now north-west Germany, in some eighteen campaigns over more than thirty years. Led for years by Widukind, the Saxons rose again and again; the Franks answered with forced baptism, the death penalty for pagan practice and, at Verden in 782, the execution of about 4,500 prisoners, as the Frankish annals tell it. Widukind was baptised in 785, and after the last risings and mass deportations Saxony was part of the Frankish realm by 804.: De krig genom vilka Karl den store erövrade de hedniska saxarna i nuvarande nordvästra Tyskland, i ett artontal fälttåg under mer än trettio år. Under många år ledda av Widukind reste sig saxarna gång på gång; frankerna svarade med tvångsdop, dödsstraff för hednisk kultutövning och, i Verden 782, avrättningen av omkring 4 500 fångar, enligt de frankiska annalerna. Widukind döptes 785, och efter de sista upproren och massdeportationerna var Sachsen en del av Frankerriket 804.
