# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
Saya San rebellion: Saya Sans uppror
? A peasant rising against British rule in Burma, then a province of British India, led by Saya San, a former monk and healer who had been crowned as a Buddhist king. The Great Depression halved the price of rice, Burma’s main export, while the capitation and household taxes stayed the same, and many cultivators were losing their land to moneylenders. Saya San, who had investigated rural grievances for the nationalist General Council of Burmese Associations, took the title of Galon (Garuda) king in October 1930, and on 22 December 1930 his followers rose in the Tharrawaddy district north of Rangoon, attacking headmen, forest officers and police posts. The rising spread in 1931 to Insein, Pegu, Toungoo, Prome, Thayetmyo, Henzada and Pyapon and into the Shan states. The colonial government brought in troops from India and gave itself emergency powers. Saya San was arrested in the Shan states in August 1931, tried by a special tribunal and hanged at Tharrawaddy on 28 November 1931. By the government’s count, more than 1,000 rebels had been killed by the end of 1932, about 9,000 had surrendered or been captured, and Saya San and 125 others had been hanged; other estimates of the dead run to more than 10,000. The rising is remembered in Myanmar as an early stand of the independence movement.
: En bonderesning mot det brittiska styret i Burma, då en provins i Brittiska Indien, ledd av Saya San, en före detta munk och helare som hade krönts till buddhistisk kung. Den stora depressionen halverade priset på ris, Burmas viktigaste exportvara, medan huvudskatten och hushållsskatten låg kvar på samma nivå, och många odlare förlorade sin jord till penningutlånare. Saya San, som hade undersökt missförhållandena på landsbygden åt det nationalistiska General Council of Burmese Associations, antog titeln Galonkung (Garuda) i oktober 1930, och den 22 december 1930 reste sig hans anhängare i distriktet Tharrawaddy norr om Rangoon och anföll byhövdingar, skogstjänstemän och polisposter. Resningen spred sig 1931 till Insein, Pegu, Toungoo, Prome, Thayetmyo, Henzada och Pyapon och in i shanstaterna. Kolonialregeringen förde in trupper från Indien och gav sig själv undantagsbefogenheter. Saya San greps i shanstaterna i augusti 1931, ställdes inför en specialdomstol och hängdes i Tharrawaddy den 28 november 1931. Enligt regeringens siffror hade mer än 1 000 rebeller dödats vid slutet av 1932, omkring 9 000 hade gett upp eller tillfångatagits, och Saya San och 125 andra hade hängts; andra uppskattningar av antalet döda går upp till mer än 10 000. I Myanmar minns man resningen som en tidig insats i självständighetsrörelsens kamp.
