Denmark and Sweden confirmed the borders of 1660, and Sweden kept its exemption from the Sound Dues. Secret articles even made the two old enemies allies.: Danmark och Sverige bekräftade 1660 års gränser, och Sverige behöll sin befrielse från Öresundstullen. Hemliga artiklar gjorde till och med de båda gamla fienderna till bundsförvanter.
