Uddevalla: Uddevalla
Gyldenløve’s Norwegians took Uddevalla and Vänersborg, then pulled back after failing to take Bohus fortress.: Gyldenløves norrmän intog Uddevalla och Vänersborg och drog sig sedan tillbaka efter att ha misslyckats med att inta Bohus fästning.
Christian V: Kristian V
Gyldenløve: Gyldenløve
Charles XI marched back into Scania in October 1676 with about 12,000 men. On 4 December, north of Lund, the two kings met in one of the bloodiest battles ever fought in Scandinavia. By some estimates nearly half of the men engaged were killed, and the Swedes won.: Karl XI marscherade tillbaka in i Skåne i oktober 1676 med omkring 12 000 man. Den 4 december, norr om Lund, möttes de båda kungarna i ett av de blodigaste slag som någonsin utkämpats i Norden. Enligt vissa uppskattningar dödades nästan hälften av de stridande, och svenskarna segrade.
Lund saved Scania but not the sea. On 1–2 July 1677 the Danish admiral Niels Juel smashed the Swedish fleet in Køge Bay. On land the Danes failed to storm Malmö in June and were beaten again at Landskrona on 14 July, while Gyldenløve’s Norwegians took Marstrand and won at Uddevalla. Far to the south, the Elector of Brandenburg forced Stettin to surrender in December 1677.: Lund räddade Skåne men inte havet. Den 1–2 juli 1677 krossade den danske amiralen Niels Juel den svenska flottan i Köge bukt. På land misslyckades danskarna med att storma Malmö i juni och besegrades på nytt vid Landskrona den 14 juli, medan Gyldenløves norrmän intog Marstrand och segrade vid Uddevalla. Långt i söder tvingade kurfursten av Brandenburg Stettin att kapitulera i december 1677.
Battle of Lund: Slaget vid Lund
