Sweden was allied to France, then at war with the Dutch, and was paid French subsidies to help. In December 1674, at Louis XIV’s urging, a Swedish army marched from Pomerania into Brandenburg and occupied the Uckermark.: Sverige var allierat med Frankrike, som då låg i krig med holländarna, och fick franska subsidier för att bistå. I december 1674 marscherade en svensk armé på Ludvig XIV:s uppmaning från Pommern in i Brandenburg och besatte Uckermark.
"The Elector Frederick William hurried north from his winter quarters in Franconia. On 28 June 1675 his cavalry caught the Swedes under Waldemar Wrangel at Fehrbellin and beat them. It was a small battle, but it showed that the Swedish army could be beaten, and Sweden’s enemies piled in: Denmark–Norway declared war that autumn, joined by the Dutch, the Emperor and several German princes.": "Kurfursten Fredrik Vilhelm skyndade norrut från sina vinterkvarter i Franken. Den 28 juni 1675 hann hans kavalleri upp svenskarna under Waldemar Wrangel vid Fehrbellin och slog dem. Det var ett litet slag, men det visade att den svenska armén gick att besegra, och Sveriges fiender anslöt sig i rask takt: Danmark–Norge förklarade krig samma höst, tillsammans med holländarna, kejsaren och flera tyska furstar."
Waldemar Wrangel: Waldemar Wrangel
New enemies: Nya fiender
Brandenburg, Denmark–Norway, the Dutch Republic, the Emperor, Münster, Brunswick-Lüneburg: Brandenburg, Danmark–Norge, Nederländska republiken, kejsaren, Münster, Braunschweig-Lüneburg
Brandenburg’s cavalry attacked the retreating Swedes and beat them. The Swedes fell back to Pomerania, and Fehrbellin became a founding legend of the Prussian army.: Brandenburgs kavalleri anföll de retirerande svenskarna och slog dem. Svenskarna drog sig tillbaka till Pommern, och Fehrbellin blev en grundläggande legend för den preussiska armén.
December 1675: december 1675
After declaring war, the Danes besieged and took Sweden’s port in Mecklenburg.: Efter krigsförklaringen belägrade och intog danskarna Sveriges hamnstad i Mecklenburg.
Frederick William: Fredrik Vilhelm
Swedish Germany crumbled. Allied troops marched into Bremen-Verden and Pomerania from September 1675, and Stade, the last Swedish stronghold in Bremen-Verden, surrendered on 13 August 1676.: Det svenska Tyskland föll samman. Allierade trupper marscherade in i Bremen-Verden och Pommern från september 1675, och Stade, det sista svenska fästet i Bremen-Verden, kapitulerade den 13 augusti 1676.
The Danes and Dutch won control of the Baltic. They took Gotland in the spring of 1676, and off Öland on 1 June the giant Swedish flagship Kronan capsized and blew up. On 29 June about 14,000 Danish troops landed at Råå near Helsingborg; many Scanians welcomed them, and Kristianstad fell in August. Charles XI beat a Danish force at Halmstad, while a Norwegian army under Ulrik Frederik Gyldenløve took Uddevalla and Vänersborg.: Danskarna och holländarna fick herraväldet över Östersjön. De intog Gotland våren 1676, och utanför Öland kantrade och exploderade det jättelika svenska amiralsskeppet Kronan den 1 juni. Den 29 juni landsteg omkring 14 000 danska soldater vid Råå nära Helsingborg; många skåningar välkomnade dem, och Kristianstad föll i augusti. Karl XI slog en dansk styrka vid Halmstad, medan en norsk armé under Ulrik Frederik Gyldenløve intog Uddevalla och Vänersborg.
