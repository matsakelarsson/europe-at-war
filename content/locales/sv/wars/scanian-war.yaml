Charles XI: Karl XI
"In 1678 the Swedes won back Kristianstad, though the Danes held on to Helsingborg. In Germany everything was lost: Brandenburg took Stralsund in October and Greifswald in November. That winter a Swedish army from Livonia invaded Ducal Prussia, and in January 1679 the Elector chased it out, moving his troops on sledges across the frozen lagoons. It got home having lost nearly half its men.": "År 1678 återtog svenskarna Kristianstad, även om danskarna behöll Helsingborg. I Tyskland gick allt förlorat: Brandenburg intog Stralsund i oktober och Greifswald i november. Samma vinter invaderade en svensk armé från Livland Hertigdömet Preussen, och i januari 1679 jagade kurfursten ut den genom att föra sina trupper på slädar över de frusna haffen. Den kom hem efter att ha förlorat nästan hälften av sina män."
France, not Sweden, decided the peace. At Saint-Germain on 29 June 1679 Brandenburg gave back Pomerania except a strip east of the Oder. French pressure then forced Denmark to return all its conquests at Fontainebleau, confirmed at Lund on 26 September 1679. Sweden came out with almost no losses, but only because Louis XIV insisted.: Det var Frankrike, inte Sverige, som avgjorde freden. I Saint-Germain den 29 juni 1679 lämnade Brandenburg tillbaka Pommern utom en remsa öster om Oder. Franskt tryck tvingade sedan Danmark att återlämna alla sina erövringar i Fontainebleau, vilket bekräftades i Lund den 26 september 1679. Sverige klarade sig nästan utan förluster, men bara för att Ludvig XIV insisterade.
The strip of Pomerania east of the Oder, to Brandenburg: Remsan av Pommern öster om Oder, till Brandenburg
