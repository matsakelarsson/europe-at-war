The only Scanian stronghold the Danes had not taken. Their night assault on 25–26 June failed and the siege was given up.: Det enda skånska fäste som danskarna inte hade intagit. Deras nattliga stormning den 25–26 juni misslyckades och belägringen hävdes.
Battle of Landskrona: Slaget vid Landskrona
