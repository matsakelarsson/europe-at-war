A Danish-Dutch fleet under the Dutch admiral Cornelis Tromp beat the Swedes. The flagship Kronan, one of the largest warships of its day, capsized in a sharp turn and exploded, and most of its crew died.: En dansk-holländsk flotta under den holländske amiralen Cornelis Tromp besegrade svenskarna. Amiralsskeppet Kronan, ett av sin tids största krigsfartyg, kantrade i en skarp gir och exploderade, och större delen av besättningen omkom.
Danes land at Råå: Danskarna landstiger vid Råå
29 June 1676: 29 juni 1676
The Danish army came ashore just south of Helsingborg, which gave up at once. Many Scanians, Danish subjects until 1658, sided with the invaders.: Den danska armén gick i land strax söder om Helsingborg, som genast gav upp. Många skåningar, danska undersåtar fram till 1658, ställde sig på inkräktarnas sida.
