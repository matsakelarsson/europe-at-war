Scanian War: Skånska kriget
A war in which Denmark–Norway, Brandenburg and the Dutch Republic fought Sweden, an ally of France, and the Danes tried to win back Scania. Despite Danish victories at sea and the loss of Sweden’s German lands, French pressure restored almost all the pre-war borders in the peace of 1679.: Danmark–Norge, Brandenburg och Nederländska republiken stred mot Sverige, som var allierat med Frankrike. Danmark försökte återta Skåne. Trots danska segrar till sjöss och förlusten av Sveriges tyska besittningar återställdes nästan alla förkrigsgränser vid freden 1679 efter påtryckningar från Frankrike.
