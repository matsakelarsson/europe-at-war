4 December 1676: 4 december 1676
Both kings commanded in person. Part of the Danish army was driven onto the ice of a stream, which broke, and many drowned.: Båda kungarna förde befälet personligen. En del av den danska armén drevs ut på isen på en å, som brast, och många drunknade.
