The Schmalkaldic League, the alliance of Lutheran princes and cities formed in 1531 under Elector John Frederick of Saxony and Landgrave Philip of Hesse, had grown strong while Charles V was busy with France and the Ottomans. Once he had made peace with France at Crépy in 1544, Charles prepared to break it, with papal money and troops and a secret pact with the Lutheran Duke Maurice of Saxony, who was promised his cousin John Frederick’s electoral title. In July 1546 League troops seized Füssen and the passes towards Tyrol, and on 20 July Charles outlawed John Frederick and Philip.: Schmalkaldiska förbundet, den allians av lutherska furstar och städer som bildats 1531 under kurfurst Johan Fredrik av Sachsen och lantgreve Filip av Hessen, hade vuxit sig starkt medan Karl V var upptagen av Frankrike och osmanerna. Sedan han slutit fred med Frankrike i Crépy 1544 förberedde Karl sig på att krossa det, med påvliga pengar och trupper och en hemlig pakt med den lutherske hertig Moritz av Sachsen, som utlovades sin kusin Johan Fredriks kurfurstetitel. I juli 1546 tog förbundets trupper Füssen och passen mot Tyrolen, och den 20 juli förklarade Karl Johan Fredrik och Filip fredlösa.
The League’s army, at first larger than the Emperor’s, was led by a divided council and missed its chance. Papal troops joined Charles at Landshut in mid-August. At the end of the month the League bombarded his entrenched camp at Ingolstadt but did not storm it, and in September the Count of Buren brought him reinforcements from the Netherlands. Through the autumn the armies manoeuvred along the Danube without a battle. In late October Maurice and King Ferdinand invaded Electoral Saxony, John Frederick hurried home, and the League’s southern army broke up. That winter Ulm, Augsburg, Württemberg and the Elector Palatine submitted to Charles one by one and paid heavy fines.: Förbundets armé, som till en början var större än kejsarens, leddes av ett splittrat krigsråd och missade sitt tillfälle. Påvliga trupper förenade sig med Karl vid Landshut i mitten av augusti. I slutet av månaden besköt förbundet hans förskansade läger vid Ingolstadt men stormade det inte, och i september förde greven av Buren förstärkningar till honom från Nederländerna. Under hösten manövrerade arméerna längs Donau utan att det kom till slag. I slutet av oktober invaderade Moritz och kung Ferdinand Kursachsen, Johan Fredrik skyndade hem, och förbundets sydliga armé upplöstes. Under vintern underkastade sig Ulm, Augsburg, Württemberg och kurfursten av Pfalz Karl en efter en och betalade höga böter.
