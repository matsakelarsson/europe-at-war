John Frederick won back his lands over the winter and overran most of Maurice’s duchy, though Leipzig held out, and on 2 March he captured Margrave Albert Alcibiades of Brandenburg-Kulmbach, fighting for the Emperor, at Rochlitz. In April Charles marched north from Eger in Bohemia with the Duke of Alba’s Spanish veterans, joined by Ferdinand and Maurice. On 24 April, at Mühlberg on the Elbe, his cavalry crossed by a ford while Spanish soldiers swam out to seize boats. The Elector’s retreating army was overtaken and routed on the Lochau heath, and John Frederick, wounded in the face, was taken prisoner.: Johan Fredrik vann tillbaka sina länder under vintern och överskred större delen av Moritz hertigdöme, även om Leipzig höll stånd, och den 2 mars tillfångatog han vid Rochlitz markgreve Albrekt Alkibiades av Brandenburg-Kulmbach, som stred för kejsaren. I april marscherade Karl norrut från Eger i Böhmen med hertigen av Albas spanska veteraner, och Ferdinand och Moritz anslöt sig. Den 24 april, vid Mühlberg vid Elbe, gick hans kavalleri över floden vid ett vadställe medan spanska soldater simmade ut för att ta båtar. Kurfurstens retirerande armé hanns upp och krossades på Lochauer Heide, och Johan Fredrik, sårad i ansiktet, togs till fånga.
Sentenced to death by a court martial, John Frederick signed the Capitulation of Wittenberg on 19 May. He gave up the electoral title and the lands around Wittenberg to Maurice, keeping only Thuringian territories for his sons, and stayed a prisoner until 1552. Philip of Hesse gave himself up at Halle in June and was imprisoned too. The League was finished, though Bremen and Magdeburg held out and a League army beat imperial troops at Drakenburg on the Weser. At the diet of Augsburg in 1548 Charles imposed the Augsburg Interim, a stopgap religious settlement that pleased neither side.: Dömd till döden av en krigsrätt undertecknade Johan Fredrik Wittenbergkapitulationen den 19 maj. Han avstod kurfurstetiteln och länderna kring Wittenberg till Moritz, behöll endast områden i Thüringen åt sina söner och förblev fånge till 1552. Filip av Hessen överlämnade sig i Halle i juni och fängslades också. Förbundet var slut, även om Bremen och Magdeburg höll stånd och en förbundsarmé slog kejserliga trupper vid Drakenburg vid Weser. Vid riksdagen i Augsburg 1548 påtvingade Karl riket Augsburginterimet, en provisorisk religiös uppgörelse som inte behagade någon av parterna.
