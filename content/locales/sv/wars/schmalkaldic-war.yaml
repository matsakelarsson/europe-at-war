Troops of the Protestant imperial cities under Sebastian Schertlin opened the war by seizing the bishop of Augsburg’s town and the Ehrenberg pass beyond it, to bar the way from Italy. The League’s princes would not let them push on into Tyrol.: Trupper från de protestantiska riksstäderna under Sebastian Schertlin inledde kriget genom att ta biskopens av Augsburg stad och Ehrenbergpasset bortom den, för att spärra vägen från Italien. Förbundets furstar lät dem inte tränga vidare in i Tyrolen.
20 July 1546: 20 juli 1546
Charles, who had gathered his first troops here during the imperial diet, put the League’s leaders under the imperial ban.: Karl, som hade samlat sina första trupper här under riksdagen, förklarade förbundets ledare i riksacht.
