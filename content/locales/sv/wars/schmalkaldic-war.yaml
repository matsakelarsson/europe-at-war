The League’s leaders were John Frederick, Elector of Saxony, of the Ernestine branch of the Wettins, which ruled Wittenberg and most of Thuringia, and Landgrave Philip of Hesse. Maurice, of the Albertine branch, ruled the duchy of Saxony around Dresden, Meissen and Leipzig.: Förbundets ledare var Johan Fredrik, kurfurste av Sachsen, av den ernestinska grenen av huset Wettin, som styrde Wittenberg och större delen av Thüringen, och lantgreve Filip av Hessen. Moritz, av den albertinska grenen, styrde hertigdömet Sachsen kring Dresden, Meissen och Leipzig.
Pope Paul III sent troops and money for the campaign of 1546 but withdrew his troops early in 1547.: Påven Paulus III sände trupper och pengar till fälttåget 1546 men drog tillbaka sina trupper i början av 1547.
