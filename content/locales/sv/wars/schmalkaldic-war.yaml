Schmalkaldic War: Schmalkaldiska kriget
A war in which the Emperor Charles V, allied with the Lutheran Duke Maurice of Saxony, defeated the Schmalkaldic League of Protestant princes and cities. After the Elector John Frederick of Saxony was captured at Mühlberg in April 1547, the Saxon electorate passed from his Ernestine line of the House of Wettin to Maurice’s Albertine line.: Ett krig där kejsar Karl V, allierad med den lutherske hertigen Moritz av Sachsen, besegrade Schmalkaldiska förbundet av protestantiska furstar och städer. Sedan kurfursten Johan Fredrik av Sachsen tillfångatagits vid Mühlberg i april 1547 övergick den sachsiska kurfurstevärdigheten från hans ernestinska linje av huset Wettin till Moritz albertinska linje.
