Alba’s cavalry and Hungarian hussars caught the Saxon army on the march and destroyed it. Titian later painted Charles as the victor of Mühlberg in armour on horseback.: Albas kavalleri och ungerska husarer hann upp den sachsiska armén på marsch och förintade den. Tizian målade senare Karl som segraren vid Mühlberg, i rustning till häst.
To save his life John Frederick gave up the electorate and the lands around Wittenberg, and his family moved its seat to Weimar.: För att rädda sitt liv avstod Johan Fredrik kurfurstendömet och länderna kring Wittenberg, och hans familj flyttade sitt säte till Weimar.
