The League’s guns pounded the Emperor’s fortified camp outside the Bavarian fortress for days, but its leaders could not agree to attack, and Charles held on until reinforcements arrived.: Förbundets kanoner besköt i flera dagar kejsarens befästa läger utanför den bayerska fästningen, men dess ledare kunde inte enas om att anfalla, och Karl höll ut tills förstärkningar anlände.
