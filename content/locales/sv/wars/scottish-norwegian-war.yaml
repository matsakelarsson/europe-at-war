Largs is often remembered in Scotland as a great victory, but the Norwegian sources describe a skirmish fought by part of the army on the shore after storms drove ships aground; most historians see it as indecisive.: Largs minns ofta i Skottland som en stor seger, men de norska källorna beskriver en skärmytsling som utkämpades av en del av hären på stranden sedan stormar drivit skepp på grund; de flesta historiker betraktar den som oavgjord.
