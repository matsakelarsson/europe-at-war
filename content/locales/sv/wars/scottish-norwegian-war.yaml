Scottish–Norwegian War: Skotsk-norska kriget
A war between Scotland and Norway over the Hebrides and the Isle of Man, Norwegian since 1098. In 1263 King Haakon IV sailed with more than 120 ships to defend the isles, but the clash at Largs on 2 October was indecisive and Haakon died in Orkney that winter. By the Treaty of Perth in 1266 Norway sold the Hebrides and Man to Scotland for 4,000 marks and an annual payment of 100 marks, while Scotland recognised Norwegian rule over Orkney and Shetland.: Ett krig mellan Skottland och Norge om Hebriderna och Isle of Man, norska sedan 1098. År 1263 seglade kung Håkon IV med mer än 120 skepp för att försvara öarna, men sammandrabbningen vid Largs den 2 oktober blev oavgjord och Håkon dog på Orkneyöarna samma vinter. Genom freden i Perth 1266 sålde Norge Hebriderna och Man till Skottland för 4 000 mark och en årlig avgift på 100 mark, medan Skottland erkände det norska styret över Orkneyöarna och Shetlandsöarna.
Norway: Norge
Scotland: Skottland
