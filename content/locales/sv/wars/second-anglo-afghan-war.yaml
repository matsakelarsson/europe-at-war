# Svenska översättningar av katalogtexten (våg 7); stegtexterna kommer senare.
Second Anglo-Afghan War: Andra anglo-afghanska kriget
The war in which British India invaded Afghanistan to force the amir Sher Ali Khan, who had received a Russian mission, to accept British control of his foreign relations. British and Indian columns took the Khyber, the Kurram and Kandahar in 1878–1879, and Sher Ali’s son Yaqub Khan signed the Treaty of Gandamak. The killing of the British envoy in Kabul in September 1879 brought a second invasion, Afghan risings around Kabul and the British defeat at Maiwand in July 1880, before Roberts’s march from Kabul to Kandahar ended the fighting. Britain withdrew, recognising Abdur Rahman Khan as amir, but kept the Kurram, Pishin and Sibi districts and control of Afghanistan’s foreign policy.: Kriget där Brittiska Indien invaderade Afghanistan för att tvinga emiren Sher Ali Khan, som hade tagit emot en rysk beskickning, att godta brittisk kontroll över sina utrikes förbindelser. Brittiska och indiska kolonner intog Khyberpasset, Kurramdalen och Kandahar 1878–1879, och Sher Alis son Yaqub Khan undertecknade fördraget i Gandamak. Mordet på det brittiska sändebudet i Kabul i september 1879 ledde till en andra invasion, afghanska resningar kring Kabul och det brittiska nederlaget vid Maiwand i juli 1880, innan Roberts marsch från Kabul till Kandahar gjorde slut på striderna. Storbritannien drog sig tillbaka och erkände Abdur Rahman Khan som emir, men behöll distrikten Kurram, Pishin och Sibi och kontrollen över Afghanistans utrikespolitik.
