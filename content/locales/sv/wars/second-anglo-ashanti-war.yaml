# Svenska översättningar av katalogtexten (våg 13); stegtexterna kommer senare.
Second Anglo-Ashanti War: Andra anglo-ashantiska kriget
? A brief war between the Asante Empire and Britain, which had ruled the Gold Coast forts and a protectorate over the coastal states since the peace of 1831. In 1862 Kwesi Gyani, an Asante subject accused of keeping a gold nugget that belonged by law to the king, fled south across the Pra river into the British Protectorate. Asantehene Kwaku Dua I demanded his return; Governor Richard Pine refused. Early in 1863 Asante armies crossed the Pra, defeated the forces of the coastal states sent against them, burnt villages in the Protectorate and withdrew with the rains. Pine sent troops of the West India Regiment and local levies to the Pra in 1864 to prepare an advance on Kumasi, but they could not cross the river in strength, and fever and dysentery killed far more of them than any fighting. London, unwilling to pay for a war in the interior, ordered the force withdrawn in mid-1864. Neither side claimed victory; a parliamentary select committee in 1865 even recommended that Britain prepare to leave most of West Africa, and the question of who ruled the coast was left to the war of 1873.
: Ett kort krig mellan Ashantiriket och Storbritannien, som sedan freden 1831 hade styrt forten på Guldkusten och utövat ett protektorat över kuststaterna. År 1862 flydde Kwesi Gyani, en ashantisk undersåte som anklagades för att ha behållit en guldklimp som enligt lag tillhörde kungen, söderut över floden Pra in i det brittiska protektoratet. Asantehene Kwaku Dua I krävde att han skulle lämnas ut; guvernör Richard Pine vägrade. I början av 1863 gick ashantiska arméer över Pra, besegrade de styrkor från kuststaterna som sändes mot dem, brände byar i protektoratet och drog sig tillbaka när regnen kom. Pine sände 1864 trupper ur West India Regiment och lokala uppbåd till Pra för att förbereda en framryckning mot Kumasi, men de kunde inte ta sig över floden med tillräcklig styrka, och feber och dysenteri dödade betydligt fler av dem än striderna. London, som inte ville betala för ett krig i inlandet, beordrade styrkan tillbaka i mitten av 1864. Ingen av sidorna gjorde anspråk på seger; ett parlamentariskt specialutskott rekommenderade 1865 till och med att Storbritannien skulle förbereda sig på att lämna större delen av Västafrika, och frågan om vem som styrde kusten lämnades åt kriget 1873.
