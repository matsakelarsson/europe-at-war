Second Anglo-Burmese War: Andra anglo-burmesiska kriget
The East India Company’s conquest of Pegu, the Irrawaddy delta and the lands up to Prome and Toungoo from the Konbaung kingdom of Burma. A dispute over fines that the governor of Rangoon had imposed on two British sea captains led the Governor-General, Lord Dalhousie, to send Commodore George Lambert, who blockaded Rangoon and seized a royal ship in January 1852. When King Pagan did not meet the Company’s demands, an expedition under Major-General Henry Godwin took Martaban and Rangoon in April 1852, Bassein and Pegu in May and June, and Prome in October. Dalhousie annexed the province of Pegu by a proclamation dated 20 December 1852 and read out at Rangoon on 20 January 1853. In Burma the war brought down Pagan Min, who was overthrown by his half-brother Mindon in February 1853. Mindon wanted peace but would not sign away Burmese land, so the war ended with a ceasefire in mid-1853 and no treaty. Local resistance continued for some months, notably under Myat Toon near Danubyu.: Brittiska ostindiska kompaniets erövring av Pegu, Irrawaddydeltat och landet upp till Prome och Toungoo från Konbaungriket i Burma. En tvist om böter som guvernören i Rangoon hade ålagt två brittiska sjökaptener fick generalguvernören, lord Dalhousie, att sända kommodor George Lambert, som blockerade Rangoon och beslagtog ett kungligt fartyg i januari 1852. När kung Pagan inte gick med på kompaniets krav intog en expedition under generalmajor Henry Godwin Martaban och Rangoon i april 1852, Bassein och Pegu i maj och juni och Prome i oktober. Dalhousie annekterade provinsen Pegu genom en proklamation som var daterad den 20 december 1852 och lästes upp i Rangoon den 20 januari 1853. I Burma ledde kriget till Pagan Mins fall; han störtades av sin halvbror Mindon i februari 1853. Mindon ville ha fred men vägrade avträda burmesisk mark, så kriget slutade med ett eldupphör i mitten av 1853 och utan något fredsfördrag. Lokalt motstånd fortsatte i några månader, särskilt under Myat Toon nära Danubyu.
