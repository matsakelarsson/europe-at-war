Dates are New Style (Gregorian), as used in the Dutch Republic. English accounts usually give Old Style dates, ten days earlier; the Four Days’ Battle, for example, was 1–4 June 1666 Old Style.: Datumen följer nya stilen (gregoriansk kalender), som användes i Nederländska republiken. Engelska framställningar anger vanligen datum enligt gamla stilen, tio dagar tidigare; fyradagarsslaget utkämpades till exempel den 1–4 juni 1666 enligt gamla stilen.
The war was also fought off West Africa, in North America and in the Caribbean, which are not shown on the map.: Kriget utkämpades också utanför Västafrika, i Nordamerika och i Karibien, vilket inte visas på kartan.
Rivalry over trade in Africa, Asia and America brought the two Protestant sea powers back to war, eleven years after their first. English ships seized Dutch trading posts in West Africa in 1664 and New Amsterdam, which became New York, in September, and England declared war in March 1665. On 13 June 1665 the fleets met off Lowestoft. The English, under the King’s brother James, Duke of York, won. The Dutch flagship blew up with Lieutenant-Admiral van Wassenaer van Obdam, and the Dutch lost about 17 ships. The Grand Pensionary, Johan de Witt, rebuilt the fleet under Michiel de Ruyter, while England was struck by the Great Plague.: Rivaliteten om handeln i Afrika, Asien och Amerika förde de båda protestantiska sjömakterna i krig igen, elva år efter det första kriget. Engelska fartyg tog nederländska handelsstationer i Västafrika 1664 och i september Nya Amsterdam, som blev New York, och England förklarade krig i mars 1665. Den 13 juni 1665 möttes flottorna utanför Lowestoft. Engelsmännen, under kungens bror Jakob, hertig av York, segrade. Det nederländska amiralsskeppet flög i luften med generallöjtnantamiralen van Wassenaer van Obdam, och nederländarna förlorade omkring 17 fartyg. Rådspensionären Johan de Witt byggde upp flottan på nytt under Michiel de Ruyter, medan England drabbades av den stora pesten.
France and Denmark–Norway joined the Dutch in 1666, though France did little. On 11–14 June 1666 de Ruyter beat the English fleet under George Monck and Prince Rupert in the Four Days’ Battle, one of the longest sea battles ever fought; the English lost about ten ships and thousands of men killed or captured. The English replied by winning the St James’s Day Battle on 4–5 August, and on 19–20 August Sir Robert Holmes burned about 150 merchant ships in the Vlie and the town of West-Terschelling, a raid remembered as Holmes’s Bonfire. Weeks later the Great Fire destroyed much of London.: Frankrike och Danmark–Norge anslöt sig till nederländarna 1666, även om Frankrike gjorde föga. Den 11–14 juni 1666 besegrade de Ruyter den engelska flottan under George Monck och prins Rupert i fyradagarsslaget, ett av de längsta sjöslag som någonsin utkämpats; engelsmännen förlorade omkring tio fartyg och tusentals man i stupade och tillfångatagna. Engelsmännen svarade med att vinna slaget på Sankt Jakobs dag den 4–5 augusti, och den 19–20 augusti brände sir Robert Holmes omkring 150 handelsfartyg i Vlie och staden West-Terschelling, en räd som är ihågkommen som Holmes brasa. Några veckor senare förstörde den stora branden en stor del av London.
