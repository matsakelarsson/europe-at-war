Fought from the Flemish coast to the Thames estuary. Rupert’s squadron arrived on the third day but could not turn the battle.: Utkämpades från den flamländska kusten till Themsens mynning. Ruperts eskader anlände den tredje dagen men kunde inte vända slaget.
