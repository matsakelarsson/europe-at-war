Monck and Rupert beat de Ruyter off the North Foreland, and he retreated to the Dutch coast.: Monck och Rupert besegrade de Ruyter utanför North Foreland, och han drog sig tillbaka till den nederländska kusten.
English boats burned a merchant fleet sheltering in the Vlie, then landed and set fire to West-Terschelling.: Engelska båtar brände en handelsflotta som sökt skydd i Vlie och landsteg sedan och satte eld på West-Terschelling.
Holmes: Holmes
Short of money after the plague and the fire, Charles II laid up his largest ships at Chatham while peace talks went on at Breda. Johan de Witt decided to force the issue. In June 1667 a Dutch fleet under de Ruyter, with de Witt’s brother Cornelis on board, entered the Thames estuary, took the unfinished fort at Sheerness on 20 June and pushed up the Medway. On 22–23 June Dutch sailors broke the chain across the river at Gillingham, burned several of the greatest English warships off Chatham and towed away the flagship Royal Charles.: Med ont om pengar efter pesten och branden lade Karl II upp sina största fartyg i Chatham medan fredsförhandlingarna pågick i Breda. Johan de Witt beslöt att framtvinga ett avgörande. I juni 1667 seglade en nederländsk flotta under de Ruyter, med de Witts bror Cornelis ombord, in i Themsens mynning, intog det ofärdiga fortet i Sheerness den 20 juni och trängde uppför Medway. Den 22–23 juni bröt nederländska sjömän kedjan över floden vid Gillingham, brände flera av de största engelska krigsfartygen utanför Chatham och bogserade bort amiralsskeppet Royal Charles.
It was one of the worst defeats in the history of the Royal Navy, and the Dutch fleet blockaded the Thames for weeks, causing panic in London. The Treaty of Breda was signed on 31 July 1667. Each side kept what it held, so England kept New York and the Dutch kept Suriname, which they had taken that year, and the spice island of Run in the East Indies. The Navigation Acts were eased to let Dutch ships carry goods from Germany to England. The stern of the Royal Charles is still on show in the Rijksmuseum in Amsterdam.: Det var ett av de värsta nederlagen i Royal Navys historia, och den nederländska flottan blockerade Themsen i flera veckor, vilket orsakade panik i London. Freden i Breda undertecknades den 31 juli 1667. Vardera sidan behöll vad den höll, så England behöll New York och nederländarna Surinam, som de hade intagit samma år, och kryddön Run i Ostindien. Navigationsakten mildrades så att nederländska fartyg fick frakta varor från Tyskland till England. Aktern från Royal Charles visas fortfarande på Rijksmuseum i Amsterdam.
