Second Anglo-Dutch War: Andra engelsk-nederländska kriget
A naval war between England and the Dutch Republic over trade and colonies, in which France and Denmark–Norway joined the Dutch and the Bishop of Münster attacked them by land. After an English victory off Lowestoft and a Dutch one in the Four Days’ Battle, the Dutch raid on the Medway in 1667 hastened the Treaty of Breda, which left England with New York and the Dutch with Suriname.: Ett sjökrig mellan England och Nederländska republiken om handel och kolonier, där Frankrike och Danmark–Norge gick med på nederländsk sida och biskopen av Münster angrep nederländarna till lands. Efter en engelsk seger utanför Lowestoft och en nederländsk i fyradagarsslaget påskyndade den nederländska räden mot Medway 1667 freden i Breda, som gav England New York och nederländarna Surinam.
