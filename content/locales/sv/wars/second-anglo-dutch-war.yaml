The worst Dutch naval defeat of the century. Obdam’s flagship Eendracht exploded, killing almost all on board.: Århundradets värsta nederländska nederlag till sjöss. Obdams amiralsskepp Eendracht exploderade, och nästan alla ombord omkom.
