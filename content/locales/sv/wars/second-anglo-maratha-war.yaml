# Svenska översättningar av katalogtexten (våg 8); stegtexterna kommer senare.
Second Anglo-Maratha War: Andra anglo-marathiska kriget
"A war between the British East India Company and the Maratha chiefs Daulat Rao Scindia of Gwalior and Raghoji II Bhonsle of Nagpur, and from 1804 Yashwantrao Holkar of Indore. It began after the Peshwa, Baji Rao II, driven from Pune by Holkar, accepted Company protection in the Treaty of Bassein (1802). In 1803 Arthur Wellesley won at Assaye and Argaon in the Deccan, Gerard Lake took Aligarh, Delhi and Agra and destroyed Scindia’s European-trained brigades at Laswari, and other columns took Cuttack and Broach. By the treaties of Deogaon and Surji-Anjangaon the Company gained Odisha, the upper Ganges–Yamuna Doab, Delhi and Agra, and became protector of the Mughal emperor. Holkar’s war of 1804–1805 went less well for the Company: Monson’s column was routed in Rajputana and Lake failed four times to storm Bharatpur. The Treaty of Rajghat (December 1805) ended the war with Holkar’s power reduced but intact.": "Ett krig mellan Brittiska ostindiska kompaniet och marathahövdingarna Daulat Rao Scindia av Gwalior och Raghoji II Bhonsle av Nagpur, och från 1804 Yashwantrao Holkar av Indore. Det började sedan peshwan Baji Rao II, fördriven från Pune av Holkar, hade ställt sig under kompaniets beskydd genom fördraget i Bassein (1802). År 1803 segrade Arthur Wellesley vid Assaye och Argaon i Deckan, Gerard Lake intog Aligarh, Delhi och Agra och förintade Scindias europeiskt utbildade brigader vid Laswari, och andra kolonner intog Cuttack och Broach. Genom fördragen i Deogaon och Surji-Anjangaon vann kompaniet Odisha, den övre delen av Doab mellan Ganges och Yamuna, Delhi och Agra och blev mogulkejsarens beskyddare. Holkars krig 1804–1805 gick sämre för kompaniet: Monsons kolonn slogs på flykten i Rajputana, och Lake misslyckades fyra gånger med att storma Bharatpur. Fördraget i Rajghat (december 1805) avslutade kriget med Holkars makt försvagad men intakt."
