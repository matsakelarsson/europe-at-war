Second Anglo-Sikh War: Andra anglo-sikhiska kriget
The war that ended the Sikh Empire. It began in April 1848 as a revolt at Multan, where the governor, Diwan Mulraj, had been forced to resign and two British officers sent to take over were killed, and became a general rising when the Sikh army under Sher Singh Attariwala joined it in September. The Company’s army under Lord Gough fought indecisive and costly battles at Ramnagar and Chillianwala, took Multan in January 1849 after a long siege, and won a decisive victory at Gujrat in February. The Sikh army surrendered in March, and on 29 March 1849 the Punjab was annexed to British India.: Kriget som gjorde slut på Sikhriket. Det började i april 1848 som ett uppror i Multan, där guvernören Diwan Mulraj hade tvingats avgå och två brittiska officerare som sänts för att ta över hade dödats, och blev en allmän resning när sikharmén under Sher Singh Attariwala anslöt sig i september. Ostindiska kompaniets armé under lord Gough utkämpade oavgjorda och kostsamma slag vid Ramnagar och Chillianwala, intog Multan i januari 1849 efter en lång belägring och vann en avgörande seger vid Gujrat i februari. Sikharmén kapitulerade i mars, och den 29 mars 1849 annekterades Punjab till Brittiska Indien.
