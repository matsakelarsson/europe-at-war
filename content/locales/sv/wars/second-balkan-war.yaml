Second Balkan War: Andra Balkankriget
A six-week war over the division of Macedonia, in which Bulgaria attacked its former allies Serbia and Greece and was defeated, while Romania and the Ottoman Empire invaded from the north and east. By the Treaty of Bucharest of August 1913 Bulgaria lost most of Macedonia to Serbia and Greece and Southern Dobruja to Romania, and in September it returned Adrianople to the Ottomans.: Ett sexveckorskrig om delningen av Makedonien, där Bulgarien angrep sina tidigare bundsförvanter Serbien och Grekland och besegrades, medan Rumänien och Osmanska riket invaderade från norr och öster. Genom freden i Bukarest i augusti 1913 förlorade Bulgarien större delen av Makedonien till Serbien och Grekland och Syddobrudja till Rumänien, och i september återlämnade landet Adrianopel till osmanerna.
