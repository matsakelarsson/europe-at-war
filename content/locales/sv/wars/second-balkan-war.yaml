11 July 1913: 11 juli 1913
Much of the town was burned as the Bulgarian army withdrew, shortly before Greek troops entered it.: Stora delar av staden brändes när den bulgariska armén drog sig tillbaka, kort innan grekiska trupper ryckte in.
Romania had stayed out of the first war but claimed Southern Dobruja in return for Bulgaria’s gains. On 10 July it declared war, and its army occupied Southern Dobruja without a fight. On the night of 14–15 July Romanian troops crossed the Danube into northern Bulgaria and marched on Sofia almost unopposed, since the Bulgarian army was fighting in the south and west. Their cavalry reached Vrazhdebna, on the edge of the capital. Cholera, rather than the Bulgarians, caused most of the Romanian army’s losses.: Rumänien hade hållit sig utanför det första kriget men krävde Syddobrudzja som kompensation för Bulgariens vinster. Den 10 juli förklarade landet krig, och dess armé besatte Syddobrudzja utan strid. Natten mellan den 14 och 15 juli gick rumänska trupper över Donau in i norra Bulgarien och marscherade mot Sofia nästan utan motstånd, eftersom den bulgariska armén stred i söder och väster. Deras kavalleri nådde Vrazjdebna, i utkanten av huvudstaden. Det var koleran, snarare än bulgarerna, som orsakade de flesta av den rumänska arméns förluster.
The Ottoman Empire seized its chance. On 12 July its army crossed the Enos–Midia line and reoccupied Eastern Thrace, which had few Bulgarian troops left, and on 23 July Enver Bey rode into Adrianople unopposed, calling himself its second conqueror. Reprisals by Ottoman troops and irregulars drove most of the Bulgarians of Eastern Thrace from their homes. With enemies on every side, Bulgaria’s government resigned, and the new prime minister, Vasil Radoslavov, sought an armistice.: Osmanska riket grep tillfället. Den 12 juli gick dess armé över linjen Enos–Midia och återbesatte Östthrakien, där det fanns få bulgariska trupper kvar, och den 23 juli red Enver bej utan motstånd in i Adrianopel och kallade sig dess andre erövrare. Repressalier från osmanska trupper och irreguljära styrkor drev de flesta bulgarer i Östthrakien från deras hem. Med fiender på alla sidor avgick Bulgariens regering, och den nye premiärministern Vasil Radoslavov sökte vapenstillestånd.
