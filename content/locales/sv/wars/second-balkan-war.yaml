Bulgaria, Serbia, Greece, Montenegro and Romania still used the Julian (Old Style) calendar; Bulgarian and Greek accounts often date the start of the war to 16–17 June and the Battle of Kilkis–Lachanas to 19–21 June. All dates here are New Style.: Bulgarien, Serbien, Grekland, Montenegro och Rumänien använde fortfarande den julianska kalendern (gamla stilen); bulgariska och grekiska framställningar daterar ofta krigets början till den 16–17 juni och slaget vid Kilkis–Lachanas till den 19–21 juni. Alla datum här följer nya stilen.
The Carnegie Commission of 1914 found that every army in the war, and the irregulars with them, had killed civilians and burned villages, Bulgarian, Greek, Muslim and others alike.: Carnegiekommissionen fann 1914 att varje armé i kriget, och de irreguljära trupperna som följde dem, hade dödat civila och bränt byar, bulgariska, grekiska, muslimska och andra.
The victors of the First Balkan War fell out over Macedonia. Serbia, denied a port in Albania, wanted to keep the central Macedonian lands its army held, which the 1912 treaty had promised to Bulgaria, and on 1 June 1913 it signed a secret alliance with Greece. Bulgaria, confident in its army, would not wait for Russian arbitration. On the night of 29–30 June, without a declaration of war, Bulgarian troops attacked Serbian positions on the Bregalnica river and Greek positions east of Thessaloniki. The Serbs held, and in a week of fighting along the Bregalnica drove the Bulgarians back.: Segrarna i första Balkankriget blev oense om Makedonien. Serbien, som förvägrats en hamn i Albanien, ville behålla de centralmakedonska områden som dess armé höll och som fördraget 1912 hade lovat Bulgarien, och den 1 juni 1913 slöt det en hemlig allians med Grekland. Bulgarien, som litade på sin armé, ville inte vänta på rysk skiljedom. Natten mellan den 29 och 30 juni anföll bulgariska trupper utan krigsförklaring serbiska ställningar vid floden Bregalnica och grekiska ställningar öster om Thessaloniki. Serberna höll stånd och drev efter en veckas strider längs Bregalnica tillbaka bulgarerna.
In Thessaloniki, Greek troops overwhelmed the small Bulgarian garrison on 30 June and 1 July. The Greek army under King Constantine, who had come to the throne after his father’s assassination in March, attacked at Kilkis and Lachanas on 2–4 July and won after heavy losses on both sides. It pushed north past Lake Doiran and up the Struma valley. As they retreated, Bulgarian troops burned much of Serres, while Kilkis was burned by the Greeks, and civilians of every community were killed or driven from their homes.: I Thessaloniki övermannade grekiska trupper den lilla bulgariska garnisonen den 30 juni och 1 juli. Den grekiska armén under kung Konstantin, som hade bestigit tronen efter mordet på sin far i mars, anföll vid Kilkis och Lachanas den 2–4 juli och segrade efter svåra förluster på båda sidor. Den trängde norrut förbi Dojransjön och uppför Strumadalen. Under reträtten brände bulgariska trupper stora delar av Serres, medan Kilkis brändes av grekerna, och civila ur alla folkgrupper dödades eller fördrevs från sina hem.
