The Greek army, advancing up the Struma valley into Bulgaria itself, was counter-attacked from both flanks in the Kresna Gorge from 21 July and came close to being surrounded, while the Serbs were held at Kalimanci on the Bregalnica. Both sides were exhausted, and King Constantine, who had planned to march on Sofia, accepted an armistice that came into force on 31 July. A peace conference met in Bucharest, where the Romanian prime minister, Titu Maiorescu, presided over the division of the spoils.: Den grekiska armén, som ryckte fram uppför Strumadalen in i själva Bulgarien, utsattes från den 21 juli för motanfall från båda flankerna i Kresnaravinen och var nära att bli omringad, medan serberna hejdades vid Kalimanci vid Bregalnica. Båda sidor var utmattade, och kung Konstantin, som hade planerat att marschera mot Sofia, godtog ett vapenstillestånd som trädde i kraft den 31 juli. En fredskonferens samlades i Bukarest, där den rumänske premiärministern Titu Maiorescu ledde fördelningen av bytet.
By the Treaty of Bucharest of 10 August Romania took Southern Dobruja. Serbia kept northern and central Macedonia, Greece the south with Thessaloniki and Kavala, and Bulgaria only the Pirin region, the Strumica valley and Western Thrace with an outlet to the Aegean at Dedeagach. In the Treaty of Constantinople of 29 September Bulgaria gave Adrianople and most of Eastern Thrace back to the Ottomans. Bulgarians called the outcome their first national catastrophe, and the quarrel over Macedonia helped draw Bulgaria into the First World War on the side of the Central Powers.: Genom freden i Bukarest den 10 augusti fick Rumänien Syddobrudzja. Serbien behöll norra och centrala Makedonien, Grekland den södra delen med Thessaloniki och Kavala, och Bulgarien endast Pirinregionen, Strumicadalen och Västthrakien med ett utlopp till Egeiska havet vid Dedeagatj. Genom freden i Konstantinopel den 29 september lämnade Bulgarien tillbaka Adrianopel och större delen av Östthrakien till osmanerna. Bulgarerna kallade utgången sin första nationella katastrof, och tvisten om Makedonien bidrog till att Bulgarien drogs in i första världskriget på centralmakternas sida.
