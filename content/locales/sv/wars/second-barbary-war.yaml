# Svenska översättningar av katalogtexten (våg 12); stegtexterna kommer senare.
Second Barbary War: Andra barbareskkriget
? "A short war between the United States and the Regency of Algiers that ended American tribute to the North African regencies. In 1812, as the United States went to war with Britain, the dey of Algiers rejected his treaty of 1795 and declared war, and Algerian corsairs took American ships and crews. After peace with Britain, Congress authorised force against Algiers on 3 March 1815, and Commodore Stephen Decatur sailed from New York on 20 May with a squadron of ten ships, the largest American fleet yet assembled. On 17 June, off the south-east coast of Spain, he took the Algerian flagship Meshouda, whose commander, Rais Hamidou, was killed, and two days later the brig Estedio. Arriving off Algiers at the end of June, he dictated a treaty to Dey Omar Agha, signed on 30 June and 3 July aboard the Guerriere: no more American tribute, the release of the American captives (about ten) in exchange for some 500 Algerian prisoners and the return of the two ships, and $10,000 in compensation. Decatur then sailed to Tunis and Tripoli and obtained compensation for American prizes lost in their ports during the War of 1812. The dey later repudiated the treaty, but after the Anglo-Dutch bombardment of 1816 the American consul William Shaler, backed by a second squadron, obtained a new treaty with the same terms in December 1816."
: "Ett kort krig mellan USA och regentskapet Alger som gjorde slut på den amerikanska tributen till de nordafrikanska regentskapen. År 1812, när USA gick i krig mot Storbritannien, sade dejen av Alger upp sitt fördrag från 1795 och förklarade krig, och algeriska korsarer kapade amerikanska fartyg och tog deras besättningar. Efter freden med Storbritannien bemyndigade kongressen den 3 mars 1815 våld mot Alger, och kommendör Stephen Decatur seglade från New York den 20 maj med en eskader på tio fartyg, den största amerikanska flotta som dittills samlats. Den 17 juni, utanför Spaniens sydöstra kust, tog han det algeriska flaggskeppet Meshouda, vars befälhavare, Rais Hamidou, dödades, och två dagar senare briggen Estedio. När han i slutet av juni kom fram till Alger dikterade han ett fördrag för dejen Omar Agha, undertecknat den 30 juni och 3 juli ombord på Guerriere: ingen mer amerikansk tribut, frigivning av de amerikanska fångarna (omkring tio) i utbyte mot omkring 500 algeriska fångar och återlämnandet av de två fartygen, samt 10 000 dollar i skadestånd. Decatur seglade därefter till Tunis och Tripoli och fick ersättning för amerikanska priser som hade gått förlorade i deras hamnar under 1812 års krig. Dejen sade senare upp fördraget, men efter det brittisk-nederländska bombardemanget 1816 utverkade den amerikanske konsuln William Shaler, med stöd av en andra eskader, ett nytt fördrag med samma villkor i december 1816."
