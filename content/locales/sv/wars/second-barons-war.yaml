Second Barons’ War: Andra baronkriget
A civil war in England between Henry III and barons led by Simon de Montfort, earl of Leicester, who wanted to hold the king to the Provisions of Oxford of 1258, which put royal government under a baronial council. After Louis IX of France annulled the Provisions in the Mise of Amiens in January 1264, war broke out, and Montfort’s followers attacked the Jewish communities of London and other towns. On 14 May 1264 Montfort defeated and captured the king and his son Edward at Lewes, and ruled in the king’s name, summoning a parliament in January 1265 that included representatives of the towns. Edward escaped in May 1265 and on 4 August killed Montfort at Evesham, where his body was mutilated. Rebels held out at Kenilworth until December 1266 and in the Isle of Ely until 1267; the Dictum of Kenilworth let them buy back their lands, and the Treaty of Montgomery of September 1267 recognised Montfort’s ally Llywelyn ap Gruffudd as Prince of Wales.: Ett inbördeskrig i England mellan Henrik III och baroner under ledning av Simon de Montfort, earl av Leicester, som ville hålla kungen till 1258 års Oxfordprovisioner, som ställde den kungliga regeringen under ett baronråd. Sedan Ludvig IX av Frankrike upphävt provisionerna genom Mise of Amiens i januari 1264 bröt krig ut, och Montforts anhängare angrep de judiska församlingarna i London och andra städer. Den 14 maj 1264 besegrade och tillfångatog Montfort kungen och hans son Edvard vid Lewes och styrde i kungens namn; i januari 1265 sammankallade han ett parlament som omfattade representanter för städerna. Edvard flydde i maj 1265 och dödade den 4 augusti Montfort vid Evesham, där hans kropp stympades. Rebeller höll stånd vid Kenilworth till december 1266 och på Isle of Ely till 1267; Dictum of Kenilworth lät dem köpa tillbaka sina gods, och fördraget i Montgomery i september 1267 erkände Montforts bundsförvant Llywelyn ap Gruffudd som furste av Wales.
