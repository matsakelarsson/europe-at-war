# Svenska översättningar av katalogtexten (våg 13); stegtexterna kommer senare.
Second Boer War: Andra boerkriget
? The war in which the British Empire conquered the two Boer republics, the South African Republic (Transvaal) and the Orange Free State. The discovery of gold on the Witwatersrand in 1886 had made the Transvaal the richest state in southern Africa; Britain, pressed by the mining houses and by its high commissioner Alfred Milner, demanded the vote for the mostly British immigrants (Uitlanders), and the republics struck first in October 1899. Boer commandos besieged Ladysmith, Kimberley and Mafeking and defeated three British armies in “Black Week” (December 1899), but a huge imperial army under Lord Roberts relieved the towns and took Bloemfontein, Johannesburg and Pretoria by June 1900. The Boers then fought a guerrilla war for two more years. Lord Kitchener answered with blockhouse lines, the burning of farms and the internment of Boer and African civilians in camps, where some 28,000 Boers, most of them children, and at least 14,000 and probably more than 20,000 Africans died. The Peace of Vereeniging (31 May 1902) made the republics British colonies; in 1910 they joined the Union of South Africa. About 22,000 soldiers of the empire and some 6,000–7,000 Boer fighters died. Many South Africans now call it the South African War, since Africans fought, worked and died on both sides.
: Det krig där Brittiska imperiet erövrade de två boerrepublikerna, Sydafrikanska republiken (Transvaal) och Oranjefristaten. Upptäckten av guld i Witwatersrand 1886 hade gjort Transvaal till den rikaste staten i södra Afrika; Storbritannien, pressat av gruvbolagen och av sin högkommissarie Alfred Milner, krävde rösträtt för de mestadels brittiska invandrarna (uitlanders), och republikerna slog till först i oktober 1899. Boerkommandon belägrade Ladysmith, Kimberley och Mafeking och besegrade tre brittiska arméer under ”svarta veckan” (december 1899), men en väldig imperiearmé under Lord Roberts undsatte städerna och hade i juni 1900 intagit Bloemfontein, Johannesburg och Pretoria. Boerna förde sedan ett gerillakrig i ytterligare två år. Lord Kitchener svarade med blockhuslinjer, nedbränning av gårdar och internering av civila boer och afrikaner i läger, där omkring 28 000 boer, de flesta av dem barn, och minst 14 000 och troligen mer än 20 000 afrikaner dog. Freden i Vereeniging (31 maj 1902) gjorde republikerna till brittiska kolonier; 1910 gick de upp i Sydafrikanska unionen. Omkring 22 000 av imperiets soldater och omkring 6 000–7 000 boerkrigare dog. Många sydafrikaner kallar det nu sydafrikanska kriget, eftersom afrikaner stred, arbetade och dog på båda sidor.
