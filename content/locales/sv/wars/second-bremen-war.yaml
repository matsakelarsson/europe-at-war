Wrangel: Wrangel
Bremen refused to swear allegiance to the new boy king, Charles XI, and in March 1665 the Swedish council decided on war. Early in 1666 Carl Gustaf Wrangel marched from Pomerania with about 14,000 men, and by the summer Swedish troops held all of Bremen’s lands except the city itself.: Bremen vägrade att svära trohet mot den nye pojkkungen Karl XI, och i mars 1665 beslöt det svenska riksrådet om krig. I början av 1666 marscherade Carl Gustaf Wrangel från Pommern med omkring 14 000 man, och till sommaren höll svenska trupper alla Bremens landområden utom själva staden.
Bremen found allies. Brunswick-Lüneburg and the Elector of Cologne raised a relief army, and Brandenburg, Denmark–Norway and the Dutch Republic joined against Sweden. Wrangel could not take the city and opened talks at his headquarters in Habenhausen.: Bremen fick bundsförvanter. Braunschweig-Lüneburg och kurfursten av Köln satte upp en undsättningsarmé, och Brandenburg, Danmark–Norge och Nederländska republiken slöt upp mot Sverige. Wrangel kunde inte inta staden och inledde förhandlingar vid sitt högkvarter i Habenhausen.
Carl Gustaf Wrangel: Carl Gustaf Wrangel
Bremen stayed independent but gave up land on the lower Weser: Bremen förblev självständigt men avträdde land vid nedre Weser
Bremen’s lands occupied: Bremens landområden ockuperade
Summer 1666: Sommaren 1666
Swedish troops overran the countryside around the city, including its territory to the north and along the lower Weser.: Svenska trupper besatte landsbygden runt staden, inklusive dess område i norr och längs nedre Weser.
Peace of Habenhausen: Freden i Habenhausen
14 November 1666: 14 november 1666
Bremen kept the city and some villages, and with them its independence, but ceded its lands north of the city and along the lower Weser and stayed out of the Imperial Diet for the rest of the century. Sweden had to pull down forts it had built close to the city.: Bremen behöll staden och några byar, och därmed sin självständighet, men avträdde sina landområden norr om staden och längs nedre Weser och hölls utanför riksdagen under resten av seklet. Sverige måste riva skansar som det hade byggt nära staden.
