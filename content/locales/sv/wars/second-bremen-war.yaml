Second Bremen War: Andra bremiska kriget
A second Swedish attempt to subdue the city of Bremen, which refused to do homage to the young Charles XI. German princes, Denmark–Norway and the Dutch Republic backed the city, and Sweden had to give up the attempt at the Peace of Habenhausen in 1666.: Ett andra svenskt försök att underkuva staden Bremen, som vägrade att hylla den unge Karl XI. Tyska furstar, Danmark–Norge och Nederländska republiken stödde staden, och Sverige fick ge upp försöket vid freden i Habenhausen 1666.
