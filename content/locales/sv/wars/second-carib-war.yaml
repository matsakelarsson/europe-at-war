# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
Second Carib War: Andra karibkriget
? The last war of the Garifuna (the “Black Caribs”) for their land on Saint Vincent, fought in alliance with Revolutionary France, which ended in the deportation of almost the whole people. British planters had pressed ever further into the lands left to the Garifuna in 1773, and in March 1795, with the encouragement of Victor Hugues, the Republican commissioner on Guadeloupe, the Garifuna rose under Joseph Chatoyer and his brother Duvallé, joined by many of the island’s French inhabitants. They burned estates on both coasts and advanced on Kingstown, but on the night of 14 March 1795 Chatoyer was killed in a British attack on his camp on Dorsetshire Hill. The Garifuna and the French, reinforced from Guadeloupe, still held most of the island for more than a year, until General Sir Ralph Abercromby landed with a large army, stormed the Vigie and received the French surrender on 11 June 1796. The Garifuna fought on until October 1796. The British then shipped 4,195 Garifuna (by some counts about 5,000) to the small, dry island of Baliceaux, where about half of them died of disease and hunger; in 1797 the 2,248 survivors were carried to the island of Roatán off the coast of Central America, where they landed on 12 April 1797. A few hundred Kalinago and Garifuna remained on Saint Vincent, and in 1804 the colony took their remaining land. Historians such as Hilary Beckles describe the deportation as ethnic cleansing and genocide; Chatoyer is the national hero of Saint Vincent and the Grenadines.
: Det sista krig som garifuna (de ”svarta karibierna”) förde för sin jord på Saint Vincent, i allians med det revolutionära Frankrike, och som slutade med att nästan hela folket deporterades. Brittiska plantageägare hade trängt allt längre in på de landområden som hade lämnats åt garifuna 1773, och i mars 1795 reste sig garifuna under Joseph Chatoyer och hans bror Duvallé, uppmuntrade av Victor Hugues, republikens kommissarie på Guadeloupe, och många av öns franska invånare anslöt sig. De brände plantager på båda kusterna och ryckte fram mot Kingstown, men natten den 14 mars 1795 dödades Chatoyer vid ett brittiskt anfall mot hans läger på Dorsetshire Hill. Garifuna och fransmännen, förstärkta från Guadeloupe, behärskade ändå större delen av ön i mer än ett år, tills general sir Ralph Abercromby landsteg med en stor armé, stormade Vigie och tog emot den franska kapitulationen den 11 juni 1796. Garifuna stred vidare till oktober 1796. Britterna skeppade sedan 4 195 garifuna (enligt vissa beräkningar omkring 5 000) till den lilla, torra ön Baliceaux, där ungefär hälften av dem dog av sjukdomar och svält; 1797 fördes de 2 248 överlevande till ön Roatán utanför Centralamerikas kust, där de landsteg den 12 april 1797. Några hundra kalinago och garifuna blev kvar på Saint Vincent, och 1804 tog kolonin deras återstående jord. Historiker som Hilary Beckles beskriver deporteringen som etnisk rensning och folkmord; Chatoyer är nationalhjälte i Saint Vincent och Grenadinerna.
