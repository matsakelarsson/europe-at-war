Second Carlist War: Andra karlistkriget
A Carlist rising fought mainly in Catalonia, where it was called the War of the Matiners (“early risers”), after the guerrillas’ dawn raids. It broke out in 1846, after the plan to marry Isabella II to the Carlist claimant Carlos Luis, Count of Montemolín (“Carlos VI”), came to nothing, and the veteran general Ramón Cabrera returned from exile to lead it in 1848. Government armies under Fernando Fernández de Córdova wore the bands down, smaller risings elsewhere failed, Cabrera crossed back into France in the spring of 1849, and an amnesty followed that June.: Ett karlistuppror som främst utkämpades i Katalonien, där det kallades matinerskriget (”de morgonpigga”) efter gerillans gryningsräder. Det bröt ut 1846, sedan planen att gifta bort Isabella II med den karlistiske tronpretendenten Carlos Luis, greve av Montemolín (”Karl VI”), runnit ut i sanden, och den erfarne generalen Ramón Cabrera återvände 1848 från exilen för att leda det. Regeringsarméer under Fernando Fernández de Córdova nötte ned banden, mindre uppror på andra håll misslyckades, Cabrera gick tillbaka över gränsen till Frankrike våren 1849, och en amnesti följde i juni samma år.
