Second Chechen War: Andra Tjetjenienkriget
A war that began when Chechnya-based Islamist fighters invaded Dagestan in August 1999 and deadly apartment bombings struck Russian cities. Russian forces reconquered Chechnya, destroying Grozny in the winter of 1999–2000, and then fought a long insurgency, marked by atrocities against civilians and by terrorist attacks such as the Beslan school siege, while power in Chechnya passed to the Kadyrov family. Russia ended its counter-terrorism operation in 2009.: Ett krig som började när islamistiska krigare med bas i Tjetjenien invaderade Dagestan i augusti 1999 och dödliga bombdåd mot bostadshus drabbade ryska städer. Ryska styrkor återerövrade Tjetjenien och förstörde Groznyj vintern 1999–2000, och utkämpade sedan en långvarig kamp mot upprorsmän, präglad av grymheter mot civila och av terrorattentat som gisslandramat i Beslan, medan makten i Tjetjenien övergick till familjen Kadyrov. Ryssland avslutade sin antiterroristoperation 2009.
