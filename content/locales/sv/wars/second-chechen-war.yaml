The war turned into an insurgency of ambushes, assassinations and suicide bombings, met by sweeps of villages, filtration camps and thousands of enforced disappearances, documented by Human Rights Watch and the Russian group Memorial. Attacks reached Moscow, where in October 2002 gunmen took more than 800 people hostage in a theatre and about 130 hostages died, most of them from a gas pumped in by special forces. Moscow handed power to loyal Chechens. A new constitution was approved in March 2003, and Akhmad Kadyrov was elected president that October, but a bomb killed him in a Grozny stadium on 9 May 2004.: Kriget övergick i ett upprorskrig med bakhåll, mord och självmordsattentat, som möttes med genomsökningar av byar, filtreringsläger och tusentals påtvingade försvinnanden, dokumenterade av Human Rights Watch och den ryska organisationen Memorial. Attackerna nådde Moskva, där beväpnade män i oktober 2002 tog mer än 800 människor som gisslan på en teater och omkring 130 gisslan dog, de flesta av en gas som specialstyrkor pumpade in. Moskva överlämnade makten åt lojala tjetjener. En ny konstitution godkändes i mars 2003, och Achmat Kadyrov valdes till president i oktober samma år, men en bomb dödade honom på en stadion i Groznyj den 9 maj 2004.
On 1 September 2004 a group sent by Basayev seized School No. 1 in Beslan, North Ossetia, with more than 1,100 hostages, most of them children and parents at the start of the school year. On the third day explosions in the gym set off a chaotic battle, and 334 hostages died, 186 of them children. Maskhadov was killed in March 2005 and Basayev in July 2006. Akhmad Kadyrov’s son Ramzan built up a powerful militia and became president in 2007, as the insurgency spread to Dagestan, Ingushetia and Kabardino-Balkaria. Russia formally ended its counter-terrorism operation in Chechnya on 16 April 2009.: Den 1 september 2004 intog en grupp som skickats av Basajev skola nr 1 i Beslan i Nordossetien och tog mer än 1 100 gisslan, de flesta barn och föräldrar vid skolårets början. På tredje dagen utlöste explosioner i gymnastiksalen en kaotisk strid, och 334 gisslan dog, varav 186 barn. Maschadov dödades i mars 2005 och Basajev i juli 2006. Achmat Kadyrovs son Ramzan byggde upp en mäktig milis och blev president 2007, medan upproret spred sig till Dagestan, Ingusjien och Kabardino-Balkarien. Ryssland avslutade formellt sin antiterroristoperation i Tjetjenien den 16 april 2009.
