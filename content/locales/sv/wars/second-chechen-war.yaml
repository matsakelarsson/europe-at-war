Basayev and Khattab: Basajev och Khattab
1 October: 1 oktober
This time Russian commanders advanced slowly and relied on artillery and air power. By mid-October they held the plains north of the Terek, and by December they had surrounded Grozny, while hundreds of thousands of civilians fled, many of them to Ingushetia. The assault on the city, held by a few thousand fighters, began on 25 December. Bombardment flattened what was left of it after the first war, and estimates of the civilians killed in the siege run from about 5,000 to 8,000. In 2003 the United Nations called Grozny the most destroyed city on Earth.: Den här gången ryckte de ryska befälhavarna fram långsamt och förlitade sig på artilleri och flyg. I mitten av oktober höll de slätterna norr om Terek, och i december hade de omringat Groznyj, medan hundratusentals civila flydde, många av dem till Ingusjien. Anfallet mot staden, som försvarades av några tusen krigare, inleddes den 25 december. Bombardemangen jämnade med marken det som fanns kvar av den efter det första kriget, och uppskattningarna av antalet civila som dödades under belägringen ligger mellan omkring 5 000 och 8 000. År 2003 kallade FN Groznyj för den mest förstörda staden på jorden.
At the end of January 2000 the main Chechen force broke out south-west through a minefield towards Alkhan-Kala, losing hundreds of men; Basayev lost a foot. Russia declared Grozny taken on 6 February, and the day before, Russian police killed at least 50 civilians in the Novye Aldi district. In the southern mountains Chechen fighters nearly wiped out a company of paratroopers on Height 776 near Ulus-Kert at the start of March. In May Putin imposed direct rule, and in June he appointed Akhmad Kadyrov, a former separatist mufti who had changed sides, to head the administration.: I slutet av januari 2000 bröt den tjetjenska huvudstyrkan ut mot sydväst genom ett minfält mot Alchan-Kala och förlorade hundratals man; Basajev miste en fot. Ryssland förklarade Groznyj intaget den 6 februari, och dagen innan dödade rysk polis minst 50 civila i stadsdelen Novyje Aldy. I bergen i söder höll tjetjenska krigare på att utplåna ett kompani fallskärmsjägare på höjd 776 nära Ulus-Kert i början av mars. I maj införde Putin direktstyre, och i juni utsåg han Achmat Kadyrov, en tidigare separatistisk mufti som bytt sida, till chef för administrationen.
