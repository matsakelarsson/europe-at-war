Chechnya is shown as part of Russia on the map, as it is internationally recognised.: Tjetjenien visas på kartan som en del av Ryssland, i enlighet med internationellt erkännande.
Casualty figures are uncertain and disputed. Russia gives about 6,000 soldiers killed; Amnesty International estimated about 25,000 civilians killed and 5,000 missing, and other estimates are higher.: Förlustsiffrorna är osäkra och omstridda. Ryssland uppger omkring 6 000 stupade soldater; Amnesty International uppskattade omkring 25 000 dödade civila och 5 000 försvunna, och andra uppskattningar är högre.
The cause of the 1999 apartment bombings remains disputed.: Orsaken till bombdåden mot bostadshus 1999 är fortfarande omstridd.
Separatist and Islamist moves: Separatisternas och islamisternas trupprörelser
Separatist and Islamist success: Separatisternas och islamisternas framgångar
After 1996 Chechnya, independent in all but name under President Aslan Maskhadov, slid into lawlessness, with kidnappings for ransom common, and radical Islamist commanders such as Shamil Basayev and the Saudi-born Ibn al-Khattab defied the government. On 7 August 1999 they led some 1,500–2,000 fighters into the mountains of neighbouring Dagestan and proclaimed an Islamic state there. Russian forces, under the new prime minister Vladimir Putin, drove them out by late August and then stormed the Islamist villages of Karamakhi and Chabanmakhi; a second incursion in September was also beaten back.: Efter 1996 gled Tjetjenien, i praktiken självständigt under president Aslan Maschadov, ned i laglöshet, där kidnappningar för lösensumma var vanliga, och radikala islamistiska befälhavare som Sjamil Basajev och den saudiskfödde Ibn al-Khattab trotsade regeringen. Den 7 augusti 1999 ledde de omkring 1 500–2 000 krigare in i bergen i grannrepubliken Dagestan och utropade en islamisk stat där. Ryska styrkor under den nye premiärministern Vladimir Putin drev ut dem i slutet av augusti och stormade sedan de islamistiska byarna Karamachi och Tjabanmachi; ett andra intrång i september slogs också tillbaka.
Between 4 and 16 September bombs destroyed apartment blocks in Buynaksk, Moscow and Volgodonsk, killing about 300 people. The government blamed Chechen militants, and Russian courts later convicted men linked to Khattab. But on 22 September residents in Ryazan found a bomb-like device in a basement, which the FSB, the security service, said was a training exercise, and some historians and journalists have accused the service of staging the bombings. Amid public anger Russian aircraft began bombing Chechnya, and on 1 October ground troops crossed the border.: Mellan den 4 och 16 september förstörde bomber bostadshus i Bujnaksk, Moskva och Volgodonsk och dödade omkring 300 människor. Regeringen anklagade tjetjenska militanta, och ryska domstolar dömde senare män med kopplingar till Khattab. Men den 22 september hittade boende i Rjazan en bombliknande anordning i en källare, som säkerhetstjänsten FSB sade var en övning, och vissa historiker och journalister har anklagat tjänsten för att ha iscensatt bombdåden. Mitt i den allmänna vreden började ryskt flyg bomba Tjetjenien, och den 1 oktober gick marktrupper över gränsen.
