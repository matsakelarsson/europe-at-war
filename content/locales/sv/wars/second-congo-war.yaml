# Svenska översättningar av katalogtexten (våg 13); stegtexterna kommer senare.
Second Congo War: Andra Kongokriget
? "The largest war in modern African history, sometimes called Africa’s World War, fought in the Democratic Republic of the Congo by nine African states and dozens of armed groups. In July 1998 President Laurent-Désiré Kabila ordered out the Rwandan troops who had brought him to power; on 2 August soldiers in Goma rebelled, and Rwanda and Uganda backed a new rebel movement, the Rally for Congolese Democracy (RCD), and flew troops across the country to Kitona in an attempt to take Kinshasa. Angola, Zimbabwe and Namibia, and for a time Chad, sent troops to save Kabila, and the war settled into a front of some 2,400 km dividing the country between the government, the RCD and Rwanda in the east, and Uganda and Jean-Pierre Bemba’s MLC in the north. All sides exploited the Congo’s diamonds, gold, timber and coltan. The Lusaka ceasefire of 1999 was widely broken, and Rwanda and Uganda fought each other at Kisangani. After Kabila was assassinated in January 2001, his son Joseph Kabila revived the peace process: the Pretoria and Luanda agreements of 2002 brought the withdrawal of Rwandan and Ugandan troops, and a transitional government took office in July 2003. Millions died, most of hunger and disease; how many is disputed: the International Rescue Committee estimated 5.4 million excess deaths for 1998–2007, a figure other researchers argue is far too high."
: "Det största kriget i Afrikas moderna historia, ibland kallat Afrikas världskrig, utkämpat i Demokratiska republiken Kongo av nio afrikanska stater och dussintals väpnade grupper. I juli 1998 beordrade president Laurent-Désiré Kabila ut de rwandiska trupper som hade fört honom till makten; den 2 augusti gjorde soldater i Goma uppror, och Rwanda och Uganda stödde en ny rebellrörelse, Kongolesiska samlingen för demokrati (RCD), och flög trupper tvärs över landet till Kitona i ett försök att ta Kinshasa. Angola, Zimbabwe och Namibia, och en tid även Tchad, sände trupper för att rädda Kabila, och kriget stelnade i en front på omkring 2 400 km som delade landet mellan regeringen, RCD och Rwanda i öster och Uganda och Jean-Pierre Bembas MLC i norr. Alla sidor exploaterade Kongos diamanter, guld, timmer och coltan. Vapenvilan i Lusaka 1999 bröts i stor utsträckning, och Rwanda och Uganda stred mot varandra i Kisangani. Sedan Kabila mördats i januari 2001 blåste hans son Joseph Kabila nytt liv i fredsprocessen: avtalen i Pretoria och Luanda 2002 ledde till att de rwandiska och ugandiska trupperna drogs tillbaka, och en övergångsregering tillträdde i juli 2003. Miljoner dog, de flesta av svält och sjukdomar; hur många är omstritt: International Rescue Committee uppskattade antalet överdödsfall till 5,4 miljoner för 1998–2007, en siffra som andra forskare hävdar är alldeles för hög."
