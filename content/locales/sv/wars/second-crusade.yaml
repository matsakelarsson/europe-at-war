Zengi stormed the city after a four-week siege while Count Joscelin II was away. Many of its Frankish inhabitants were killed.: Zengi stormade staden efter en fyra veckor lång belägring medan greve Joscelin II var borta. Många av dess frankiska invånare dödades.
September 1147: September 1147
Conrad’s army camped outside the city, where its plundering strained relations with Manuel, before crossing to Asia.: Konrads här slog läger utanför staden, där dess plundring ansträngde förbindelserna med Manuel, innan den gick över till Asien.
25 October 1147: 25 oktober 1147
Fifty years after the First Crusade’s victory on the same ground, the Turks cut down Conrad’s exhausted army as it turned back from the plateau.: Femtio år efter första korstågets seger på samma plats högg turkarna ned Konrads utmattade här när den vände tillbaka från högplatån.
Conrad III: Konrad III
Louis VII reached Constantinople in October 1147 and crossed to Asia, where he met the survivors of Conrad’s army near Nicaea. The French took the longer road along the coast by way of Pergamon and Smyrna to Ephesus, where Conrad, ill, turned back to Constantinople; he later sailed to the Holy Land. Turning inland up the Meander valley at the end of December, the French beat off Turkish attacks and forced a crossing of the river.: Ludvig VII nådde Konstantinopel i oktober 1147 och gick över till Asien, där han mötte de överlevande från Konrads här nära Nicaea. Fransmännen tog den längre vägen längs kusten via Pergamon och Smyrna till Efesos, där den sjuke Konrad vände tillbaka till Konstantinopel; han seglade senare till Heliga landet. När fransmännen i slutet av december vek av inåt landet uppför Meanderdalen slog de tillbaka turkiska anfall och tvingade sig över floden.
On 6 January 1148, as the army crossed Mount Cadmus east of Laodicea, the vanguard pushed on too far, against orders, and the Turks fell on the strung-out column. Louis himself barely escaped, and many were killed. The army reached the Byzantine port of Attaleia in late January, starving. There were not enough ships for everyone, and in March Louis sailed for Antioch with his knights, leaving most of the foot soldiers and pilgrims to march overland. Most of them died or were captured, though some, Odo of Deuil wrote, were fed and helped by the Turks.: Den 6 januari 1148, när hären gick över berget Kadmos öster om Laodikeia, trängde förtruppen mot order för långt fram, och turkarna föll över den utdragna kolonnen. Ludvig själv kom med nöd undan, och många dödades. Hären nådde den bysantinska hamnen Attaleia i slutet av januari, svältande. Det fanns inte tillräckligt med fartyg för alla, och i mars seglade Ludvig till Antiochia med sina riddare och lämnade de flesta fotsoldater och pilgrimer att marschera landvägen. De flesta av dem dog eller tillfångatogs, men en del fick enligt Odo av Deuil mat och hjälp av turkarna.
