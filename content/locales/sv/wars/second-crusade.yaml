The Byzantine port could not feed or ship the whole army. Louis blamed the Greeks for the crusade’s troubles, as French writers long did.: Den bysantinska hamnen kunde inte föda eller skeppa hela hären. Ludvig gav grekerna skulden för korstågets motgångar, liksom franska författare länge gjorde.
Louis VII: Ludvig VII
Louis VII, by sea: Ludvig VII, sjövägen
At Antioch Prince Raymond, uncle of Louis’s queen Eleanor of Aquitaine, urged an attack on Aleppo, now ruled by Zengi’s son Nur al-Din. Louis refused and, after a quarrel with Eleanor, went on to Jerusalem. On 24 June 1148 a great council near Acre, with Louis, Conrad, the young King Baldwin III and the barons of the kingdom, decided to attack Damascus, the largest Muslim city near the kingdom, although its ruler, Unur, had been the Franks’ ally against Zengi.: I Antiochia uppmanade fursten Raimond, farbror till Ludvigs drottning Eleonora av Akvitanien, till ett anfall mot Aleppo, som nu styrdes av Zengis son Nur al-Din. Ludvig vägrade och fortsatte efter ett gräl med Eleonora till Jerusalem. Den 24 juni 1148 beslöt ett stort råd nära Akko, med Ludvig, Konrad, den unge kung Balduin III och rikets baroner, att anfalla Damaskus, den största muslimska staden nära kungariket, trots att dess härskare Unur hade varit frankernas bundsförvant mot Zengi.
The crusaders reached Damascus on 24 July and advanced through the orchards west of the city, where they had water and timber but were harried from the walls and gardens. On 27 July they moved to the open plain on the eastern side, where the walls were weaker but there was no water. As Nur al-Din’s army approached and the leaders quarrelled over who should have the city, they gave up the siege on 28 July. The crusade ended in failure and mutual blame, and in 1154 Nur al-Din took Damascus, uniting Muslim Syria against the Franks.: Korsfararna nådde Damaskus den 24 juli och ryckte fram genom fruktträdgårdarna väster om staden, där de hade vatten och virke men ansattes från murarna och trädgårdarna. Den 27 juli flyttade de till den öppna slätten på östra sidan, där murarna var svagare men där det inte fanns något vatten. När Nur al-Dins här närmade sig och ledarna grälade om vem som skulle få staden gav de upp belägringen den 28 juli. Korståget slutade i misslyckande och ömsesidiga anklagelser, och 1154 intog Nur al-Din Damaskus och enade det muslimska Syrien mot frankerna.
