Second Crusade: Andra korståget
The crusade called after Zengi took Edessa in 1144, led by Louis VII of France and Conrad III of Germany. Both armies were badly beaten by the Seljuks of Rum in Anatolia, Conrad’s near Dorylaeum and Louis’s at Mount Cadmus, and the survivors’ siege of Damascus in July 1148 was abandoned after four days. Other crusaders took Lisbon in 1147 and campaigned against the Wends on the Baltic.: Korståget som utlystes sedan Zengi intagit Edessa 1144, lett av Ludvig VII av Frankrike och Konrad III av Tyskland. Båda härarna led svåra nederlag mot rumseldjukerna i Anatolien, Konrads nära Dorylaion och Ludvigs vid berget Kadmos, och de överlevandes belägring av Damaskus i juli 1148 övergavs efter fyra dagar. Andra korsfarare intog Lissabon 1147 och förde fälttåg mot venderna vid Östersjön.
