On 24 December 1144 Zengi, atabeg of Mosul and Aleppo, took Edessa, the first of the crusader states. Pope Eugenius III called a new crusade, and Bernard of Clairvaux preached it with great effect, at Vézelay before Louis VII of France in March 1146 and then in Germany, where King Conrad III took the cross at Christmas. Other crusaders were sent against the Moors in Iberia, where they helped take Lisbon in October 1147, and against the pagan Wends on the Baltic.: Den 24 december 1144 intog Zengi, atabeg av Mosul och Aleppo, Edessa, den första av korsfararstaterna. Påven Eugenius III utlyste ett nytt korståg, och Bernhard av Clairvaux predikade det med stor verkan, i Vézelay inför Ludvig VII av Frankrike i mars 1146 och sedan i Tyskland, där kung Konrad III tog korset vid jul. Andra korsfarare sändes mot morerna på Iberiska halvön, där de hjälpte till att inta Lissabon i oktober 1147, och mot de hedniska venderna vid Östersjön.
Conrad left in May 1147 with a large German army, marched through Hungary and the Byzantine Balkans, plundering as he went, and crossed to Asia in September without waiting for the French. The emperor Manuel I, who had just made a truce with the Seljuks of Rum, advised him to keep to the coast road. Instead Conrad struck across the plateau towards Iconium. Near Dorylaeum, on 25 October 1147, short of food and water, his army was attacked by Turkish horse archers and destroyed. Conrad, wounded, led the remnant back to Nicaea.: Konrad bröt upp i maj 1147 med en stor tysk här, marscherade genom Ungern och det bysantinska Balkan under plundring och gick över till Asien i september utan att vänta på fransmännen. Kejsar Manuel I, som just hade slutit stillestånd med rumseldjukerna, rådde honom att hålla sig till kustvägen. I stället drog Konrad tvärs över högplatån mot Ikonion. Nära Dorylaion den 25 oktober 1147 angreps hans här, som led brist på mat och vatten, av turkiska beridna bågskyttar och förintades. Konrad, som var sårad, ledde resterna tillbaka till Nicaea.
