Louis stayed ten days with Prince Raymond. Rumours of an affair between Raymond and Eleanor, probably untrue, helped end Louis’s marriage four years later.: Ludvig stannade tio dagar hos fursten Raimond. Rykten om en affär mellan Raimond och Eleonora, troligen osanna, bidrog till att Ludvigs äktenskap upplöstes fyra år senare.
Nur al-Din, Zengi’s son, ruled here and came south to help Damascus when the crusaders attacked.: Nur al-Din, Zengis son, härskade här och drog söderut för att hjälpa Damaskus när korsfararna anföll.
The crusade leaders and the barons of Jerusalem met near the city and chose Damascus as their target.: Korstågsledarna och Jerusalems baroner möttes nära staden och valde Damaskus som mål.
24–28 July 1148: 24–28 juli 1148
The defenders, reinforced by Turkish troops from the north, fought the crusaders among the orchards. The move to the waterless eastern side made the siege impossible.: Försvararna, förstärkta av turkiska trupper från norr, stred mot korsfararna bland fruktträdgårdarna. Förflyttningen till den vattenlösa östra sidan gjorde belägringen omöjlig.
