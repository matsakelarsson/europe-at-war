Dates are Julian. The main Western account of the French march is by Odo of Deuil, Louis VII’s chaplain; the siege of Damascus is described by William of Tyre and by Ibn al-Qalanisi, a citizen of Damascus.: Datum anges enligt den julianska kalendern. Den viktigaste västerländska skildringen av den franska marschen är skriven av Odo av Deuil, Ludvig VII:s kaplan; belägringen av Damaskus beskrivs av Vilhelm av Tyros och av Ibn al-Qalanisi, en invånare i Damaskus.
Damascus was ruled by the Burid dynasty, in practice by the commander Mu‘in al-Din Unur, a rival of the Zengids until the crusade drove him to seek their help.: Damaskus styrdes av buriddynastin, i praktiken av befälhavaren Mu‘in al-Din Unur, en rival till zengiderna tills korståget drev honom att söka deras hjälp.
The capture of Lisbon in 1147 is told under the Reconquista, and the crusade against the Wends has its own entry.: Erövringen av Lissabon 1147 skildras under reconquista, och korståget mot venderna har ett eget uppslag.
