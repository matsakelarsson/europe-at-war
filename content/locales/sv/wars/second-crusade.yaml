The vanguard under Geoffrey of Rancon crossed the mountain and camped beyond it, leaving the baggage and rearguard exposed in the pass.: Förtruppen under Geoffroy de Rancon gick över berget och slog läger på andra sidan, så att trossen och eftertruppen lämnades oskyddade i passet.
