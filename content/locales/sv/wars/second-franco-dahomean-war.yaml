Second Franco-Dahomean War: Andra fransk-dahomeyska kriget
? The French conquest of the Kingdom of Dahomey, in what is now southern Benin. After the war of 1890 both sides rearmed. When Dahomey resumed its raids in the Ouémé valley, claimed by France for its protectorate of Porto-Novo, and fired on a French gunboat, France sent Colonel Alfred-Amédée Dodds with about 2,000 soldiers, Foreign Legionnaires, marines and West African tirailleurs armed with the new Lebel rifle. Advancing up the Ouémé river and then west towards Abomey from August 1892, his column fought its way through a series of battles at Dogba, Poguessa, Adégon, Akpa, Cotopa and Cana against King Béhanzin’s army, in which Dahomey’s women soldiers, the Agojie, called Amazons by Europeans, fought in the front line and suffered terrible losses to French rifles and bayonets. On 17 November 1892 the French entered Abomey, which Béhanzin had set on fire and abandoned. He fought on from the north for more than a year, until the French made his brother Agoli-Agbo king and he surrendered in January 1894. Béhanzin died in exile in 1906; Dahomey became a French colony, and the monarchy was abolished in 1900.
: Den franska erövringen av kungariket Dahomey, i det som i dag är södra Benin. Efter kriget 1890 rustade båda sidor upp. När Dahomey återupptog sina räder i Ouémédalen, som Frankrike gjorde anspråk på för sitt protektorat Porto-Novo, och besköt en fransk kanonbåt, sände Frankrike överste Alfred-Amédée Dodds med omkring 2 000 soldater, främlingslegionärer, marininfanterister och västafrikanska tiraljörer, beväpnade med det nya Lebelgeväret. Hans kolonn, som från augusti 1892 ryckte fram uppför floden Ouémé och sedan västerut mot Abomey, kämpade sig fram genom en rad slag vid Dogba, Poguessa, Adégon, Akpa, Cotopa och Cana mot kung Béhanzins armé, där Dahomeys kvinnliga soldater, agojie, av européerna kallade amasoner, stred i främsta linjen och led fruktansvärda förluster för de franska gevären och bajonetterna. Den 17 november 1892 tågade fransmännen in i Abomey, som Béhanzin hade satt i brand och övergett. Han fortsatte striden från norr i mer än ett år, tills fransmännen gjorde hans bror Agoli-Agbo till kung och han kapitulerade i januari 1894. Béhanzin dog i exil 1906; Dahomey blev en fransk koloni, och monarkin avskaffades 1900.
