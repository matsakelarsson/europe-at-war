# Svenska översättningar av katalogtexten (våg 7); stegtexterna kommer senare.
Second Iraqi–Kurdish War: Andra irakisk-kurdiska kriget
The renewed war between the Ba’athist government of Iraq and the Kurdish rebels of Mustafa Barzani’s Kurdistan Democratic Party (KDP). In March 1974 Baghdad imposed its own autonomy law, which left oil-rich Kirkuk outside the Kurdish region, and the KDP rejected it. The Iraqi army, rebuilt with Soviet weapons, attacked in strength, while the Kurds were supplied by Iran, Israel and, secretly, the United States, and Iranian artillery and troops fought across the border. Iraqi bombing of Qala Diza in April 1974 killed more than a hundred civilians. The war ended suddenly when Iraq and Iran signed the Algiers Agreement on 6 March 1975, in which Iraq accepted the middle of the Shatt al-Arab as the border, and the Shah cut off all aid to the Kurds. The revolt collapsed within weeks. Barzani went into exile, more than 100,000 Kurds fled to Iran, and the government razed villages along the borders and moved Arabs into Kirkuk. Jalal Talabani founded the Patriotic Union of Kurdistan (PUK) in exile in June 1975.: Det förnyade kriget mellan Iraks baathistiska regering och de kurdiska rebellerna i Mustafa Barzanis Kurdistans demokratiska parti (KDP). I mars 1974 införde Bagdad en egen självstyrelselag som lämnade det oljerika Kirkuk utanför den kurdiska regionen, och KDP förkastade den. Den irakiska armén, som hade byggts upp på nytt med sovjetiska vapen, anföll med stor styrka, medan kurderna försörjdes av Iran, Israel och i hemlighet USA, och iranskt artilleri och iranska trupper ingrep över gränsen. Irakiska bombningar av Qala Diza i april 1974 dödade mer än hundra civila. Kriget tog ett plötsligt slut när Irak och Iran undertecknade Algeravtalet den 6 mars 1975, där Irak godtog mitten av Shatt al-Arab som gräns, och shahen skar av allt bistånd till kurderna. Upproret föll samman inom några veckor. Barzani gick i exil, mer än 100 000 kurder flydde till Iran, och regeringen jämnade byar längs gränserna med marken och flyttade araber till Kirkuk. Jalal Talabani grundade Kurdistans patriotiska union (PUK) i exil i juni 1975.
