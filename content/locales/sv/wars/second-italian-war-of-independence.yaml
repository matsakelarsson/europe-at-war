Also called the Franco-Austrian War, the Austro-Sardinian War or the Italian War of 1859. Austria declared war on 27 April and its troops crossed the Ticino on 29 April.: Kallas också fransk-österrikiska kriget, österrikisk-sardiska kriget eller italienska kriget 1859. Österrike förklarade krig den 27 april, och dess trupper gick över Ticino den 29 april.
In July 1858, at Plombières, the French emperor Napoleon III secretly promised Count Camillo Cavour, Sardinia’s prime minister, to help drive Austria out of northern Italy in return for Savoy and Nice, provided Austria could be made to look the aggressor. Sardinia mobilised and enrolled volunteers from all over Italy, and on 23 April 1859 Austria demanded that it disarm. When Sardinia refused, Austria declared war, and on 29 April General Ferenc Gyulai’s army crossed the Ticino into Piedmont. He advanced slowly through flooded country, while French troops arrived by rail over the Alps and by sea at Genoa.: I juli 1858 i Plombières lovade den franske kejsaren Napoleon III i hemlighet greve Camillo Cavour, Sardiniens premiärminister, att hjälpa till att driva ut Österrike ur norra Italien i utbyte mot Savojen och Nizza, förutsatt att Österrike kunde fås att framstå som angripare. Sardinien mobiliserade och värvade frivilliga från hela Italien, och den 23 april 1859 krävde Österrike att landet skulle avrusta. När Sardinien vägrade förklarade Österrike krig, och den 29 april gick general Ferenc Gyulais armé över Ticino in i Piemonte. Han ryckte långsamt fram genom översvämmade trakter, medan franska trupper anlände med järnväg över Alperna och sjövägen till Genua.
After clashes at Montebello on 20 May and Palestro on 30–31 May the allies swung north and crossed the Ticino, while Giuseppe Garibaldi’s volunteers, the Hunters of the Alps, beat the Austrians at Varese and San Fermo near Como. On 4 June the French under Napoleon III and General Patrice de MacMahon defeated Gyulai at Magenta, and on 8 June Napoleon and King Victor Emmanuel II rode into Milan. The Austrians fell back east towards the fortresses of the Quadrilateral, and risings drove out the rulers of Tuscany, Parma and Modena and the Papal governors of the Romagna.: Efter sammandrabbningar vid Montebello den 20 maj och Palestro den 30–31 maj svängde de allierade norrut och gick över Ticino, medan Giuseppe Garibaldis frivilliga, Alpjägarna, slog österrikarna vid Varese och San Fermo nära Como. Den 4 juni besegrade fransmännen under Napoleon III och general Patrice de MacMahon Gyulai vid Magenta, och den 8 juni red Napoleon och kung Viktor Emanuel II in i Milano. Österrikarna drog sig tillbaka österut mot fästningarna i Fyrkanten, och uppror drev bort härskarna i Toscana, Parma och Modena och de påvliga guvernörerna i Romagna.
