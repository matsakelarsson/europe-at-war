Francis Joseph: Frans Josef
Shaken by the slaughter, by the strength of the Austrian fortresses and by Prussia’s mobilisation on the Rhine, Napoleon III proposed an armistice without consulting his ally and met Francis Joseph at Villafranca on 11 July. Austria would cede Lombardy, without Mantua and Peschiera, to France, which would hand it to Sardinia, and the rulers of Tuscany and Modena were to return to their thrones. Cavour, furious, resigned. The Treaty of Zürich confirmed the terms on 10 November 1859.: Skakad av blodbadet, av de österrikiska fästningarnas styrka och av Preussens mobilisering vid Rhen föreslog Napoleon III ett vapenstillestånd utan att rådfråga sin bundsförvant och träffade Frans Josef i Villafranca den 11 juli. Österrike skulle avträda Lombardiet, utom Mantua och Peschiera, till Frankrike, som skulle överlämna det till Sardinien, och härskarna i Toscana och Modena skulle återinsättas på sina troner. Cavour avgick i raseri. Freden i Zürich bekräftade villkoren den 10 november 1859.
The restorations never happened. Assemblies in Tuscany, Parma, Modena and the Romagna voted to join Sardinia, and after plebiscites in March 1860, held under Cavour, now back in office, they were annexed. In return, by the Treaty of Turin of 24 March 1860, Sardinia ceded Savoy and Nice to France, which plebiscites confirmed in April. Garibaldi, who had been born in Nice, never forgave Cavour. The pope excommunicated those who had taken part in seizing the Romagna.: Återinsättningarna blev aldrig av. Församlingar i Toscana, Parma, Modena och Romagna röstade för anslutning till Sardinien, och efter folkomröstningar i mars 1860, anordnade under Cavour som nu åter satt vid makten, annekterades de. I gengäld avträdde Sardinien genom fördraget i Turin den 24 mars 1860 Savojen och Nizza till Frankrike, vilket folkomröstningar bekräftade i april. Garibaldi, som var född i Nizza, förlät aldrig Cavour. Påven bannlyste dem som hade deltagit i beslagtagandet av Romagna.
