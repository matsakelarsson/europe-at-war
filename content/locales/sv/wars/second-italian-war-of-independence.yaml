Napoleon III: Napoleon III
Emperor Francis Joseph took command of the Austrian army himself and on 23 June led it back across the Mincio, meeting the advancing allies the next morning in the hills south of Lake Garda. Together the armies had well over a quarter of a million men, and all three were led by their monarchs. The French stormed the hill and tower of Solferino in the centre after hours of fighting, while the Sardinians fought all day for the heights of San Martino to the north. In the afternoon a violent storm broke over the battlefield, and the Austrians withdrew across the Mincio.: Kejsar Frans Josef tog själv befälet över den österrikiska armén och ledde den den 23 juni tillbaka över Mincio, där den följande morgon mötte de framryckande allierade i kullarna söder om Gardasjön. Tillsammans hade arméerna långt över en kvarts miljon man, och alla tre leddes av sina monarker. Fransmännen stormade kullen och tornet i Solferino i centrum efter flera timmars strid, medan sardinierna hela dagen kämpade om höjderna vid San Martino i norr. På eftermiddagen bröt ett våldsamt oväder ut över slagfältet, och österrikarna drog sig tillbaka över Mincio.
Nearly 40,000 men were killed, wounded or missing. Thousands of wounded lay for days without care in Castiglione delle Stiviere and the villages around, where a Swiss businessman, Henri Dunant, organised help from the townspeople. His book A Memory of Solferino, published in 1862, led to the founding of the International Committee of the Red Cross in 1863 and the first Geneva Convention in 1864. The Austrians held the Quadrilateral, and the war seemed likely to go on.: Nästan 40 000 man dödades, sårades eller saknades. Tusentals sårade låg i flera dagar utan vård i Castiglione delle Stiviere och byarna runtomkring, där en schweizisk affärsman, Henri Dunant, organiserade hjälp från invånarna. Hans bok En minnesbild från Solferino, utgiven 1862, ledde till grundandet av Internationella rödakorskommittén 1863 och den första Genèvekonventionen 1864. Österrikarna höll Fyrkanten, och kriget såg ut att fortsätta.
