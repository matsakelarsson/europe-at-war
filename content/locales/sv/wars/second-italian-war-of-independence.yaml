Second Italian War of Independence: Andra italienska frihetskriget
A war in 1859 in which France under Napoleon III and the Kingdom of Sardinia defeated Austria at Magenta and Solferino. By the armistice of Villafranca and the Treaty of Zürich Austria gave up Lombardy, which passed to Sardinia; Tuscany, Parma, Modena and the Papal Romagna then voted to join Sardinia, and in 1860 Sardinia ceded Savoy and Nice to France.: Ett krig 1859 där Frankrike under Napoleon III och kungariket Sardinien besegrade Österrike vid Magenta och Solferino. Genom vapenstilleståndet i Villafranca och freden i Zürich avstod Österrike Lombardiet, som tillföll Sardinien; Toscana, Parma, Modena och den påvliga Romagna röstade därefter för anslutning till Sardinien, och 1860 avträdde Sardinien Savojen och Nizza till Frankrike.
