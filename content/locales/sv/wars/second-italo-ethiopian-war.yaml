Second Italo-Ethiopian War: Andra italiensk-etiopiska kriget
Fascist Italy’s invasion of Ethiopia, a member of the League of Nations, from its colonies of Eritrea and Italian Somaliland in October 1935. With overwhelming superiority in aircraft, armour and artillery, and the use of mustard gas against soldiers and civilians in breach of the Geneva Protocol, the Italian armies under Pietro Badoglio and Rodolfo Graziani defeated the Ethiopian forces, and Addis Ababa fell on 5 May 1936. Emperor Haile Selassie went into exile and appealed in vain to the League, whose sanctions against Italy had been limited and soon lifted; Ethiopia was joined to Eritrea and Somalia as Italian East Africa, and resistance continued until British and Ethiopian forces liberated the country in 1941.: Det fascistiska Italiens invasion i oktober 1935 av Etiopien, medlem av Nationernas förbund, från kolonierna Eritrea och Italienska Somaliland. Med en överväldigande överlägsenhet i flyg, pansar och artilleri, och med senapsgas mot soldater och civila i strid med Genèveprotokollet, besegrade de italienska arméerna under Pietro Badoglio och Rodolfo Graziani de etiopiska styrkorna, och Addis Abeba föll den 5 maj 1936. Kejsar Haile Selassie gick i exil och vädjade förgäves till Nationernas förbund, vars sanktioner mot Italien hade varit begränsade och snart hävdes; Etiopien slogs samman med Eritrea och Somalia till Italienska Östafrika, och motståndet fortsatte tills brittiska och etiopiska styrkor befriade landet 1941.
