Second Italo-Ethiopian War: Andra italiensk-etiopiska kriget
Italy: Italien
Ethiopia: Etiopien
Second Italo-Ethiopian War (Wikipedia): Andra italiensk-etiopiska kriget (Wikipedia)
? Fascist Italy’s conquest of Ethiopia, a member of the League of Nations. After a clash at the wells of Walwal in the Ogaden in December 1934, Italy invaded from Eritrea and Italian Somaliland on 3 October 1935 without a declaration of war. The League named Italy the aggressor but its sanctions left out oil and the Suez Canal. With far more aircraft, artillery and motor transport, and with mustard gas dropped from the air on soldiers and civilians in breach of the Geneva Protocol, the armies of Pietro Badoglio in the north and Rodolfo Graziani in the south destroyed the Ethiopian armies at Amba Aradam, Tembien, Shire and Maychew and in the Ogaden in the first months of 1936. Emperor Haile Selassie left for exile on 2 May, Badoglio entered Addis Ababa on 5 May, and on 9 May Mussolini proclaimed Ethiopia part of the Italian empire, joined with Eritrea and Somalia as Italian East Africa. Ethiopian armies and nobles fought on in the west and south until their last forces were destroyed in February 1937. On 19 February 1937, after an attempt on Graziani’s life, Italians killed thousands of people in Addis Ababa in three days of reprisals, remembered as Yekatit 12. Estimates of Ethiopian deaths in the war run from about 70,000 soldiers killed (an Italian estimate) to 275,000 killed in battle by the Ethiopian government’s count; Italian and colonial troops lost some 8,000–9,000 killed. Resistance continued until 1941 (see Ethiopian resistance to Italian rule and the East African campaign).
: Det fascistiska Italiens erövring av Etiopien, en medlem av Nationernas förbund. Efter en sammandrabbning vid brunnarna i Walwal i Ogaden i december 1934 invaderade Italien Etiopien från Eritrea och Italienska Somaliland den 3 oktober 1935 utan krigsförklaring. Nationernas förbund utpekade Italien som angripare, men dess sanktioner omfattade varken olja eller Suezkanalen. Med långt fler flygplan, mer artilleri och fler motorfordon, och med senapsgas som släpptes från luften över soldater och civila i strid med Genèveprotokollet, förintade Pietro Badoglios arméer i norr och Rodolfo Grazianis i söder de etiopiska arméerna vid Amba Aradam, Tembien, Shire och Maychew och i Ogaden under de första månaderna 1936. Kejsar Haile Selassie gick i exil den 2 maj, Badoglio tågade in i Addis Abeba den 5 maj, och den 9 maj proklamerade Mussolini Etiopien som en del av det italienska imperiet, förenat med Eritrea och Somalia som Italienska Östafrika. Etiopiska arméer och adelsmän fortsatte att strida i väster och söder tills deras sista styrkor förintades i februari 1937. Den 19 februari 1937, efter ett attentat mot Graziani, dödade italienare tusentals människor i Addis Abeba under tre dagars repressalier som minns som Yekatit 12. Uppskattningarna av antalet döda etiopier i kriget går från omkring 70 000 stupade soldater (en italiensk uppskattning) till 275 000 stupade enligt den etiopiska regeringens beräkning; de italienska och koloniala trupperna förlorade omkring 8 000–9 000 döda. Motståndet fortsatte till 1941 (se Etiopiska motståndet mot det italienska styret och Östafrikanska fälttåget).
