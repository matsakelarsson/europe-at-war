Italian reconquest of Libya: Italiens återerövring av Libyen
? The war in which Fascist Italy reconquered Libya, which it had invaded in 1911 but held only along the coast after 1915. Also called the Second Italo-Senussi War and, in Italy, the “pacification” of Libya. From 1922 Italian columns with aircraft and motor transport retook Tripolitania, the Sirtica and in 1929–1930 the Fezzan, while in Cyrenaica the guerrilla bands of the Senussi order, led by the elderly sheikh Omar al-Mukhtar, held out in the Jebel Akhdar with the support of the population. In 1930 General Rodolfo Graziani had the people of the Jebel and the plateau, some 100,000 men, women and children, marched into concentration camps on the coast, where about 40,000 of them died; their herds were destroyed, a barbed-wire fence was built along the Egyptian border to cut off supplies, and in January 1931 the Senussi oasis of Kufra was taken. Omar al-Mukhtar was captured in September 1931 and hanged before thousands of internees, and Italy declared the war over in January 1932. Estimates of the Libyan dead range from about 20,000 to 100,000; perhaps a quarter of the people of Cyrenaica died.
: Det krig genom vilket det fascistiska Italien återerövrade Libyen, som landet hade invaderat 1911 men efter 1915 bara behärskade längs kusten. Kallas även andra italiensk-senussiska kriget och i Italien ”pacificeringen” av Libyen. Från 1922 återtog italienska kolonner med flygplan och motorfordon Tripolitanien, Sirtica och 1929–1930 Fezzan, medan senussiordens gerillaband i Cyrenaika, ledda av den åldrige shejken Omar al-Mukhtar, höll ut i Jebel Akhdar med stöd av befolkningen. År 1930 lät general Rodolfo Graziani driva befolkningen i Jebel och på högplatån, omkring 100 000 män, kvinnor och barn, till koncentrationsläger vid kusten, där omkring 40 000 av dem dog; deras boskapshjordar förstördes, ett taggtrådsstängsel byggdes längs den egyptiska gränsen för att skära av tillförseln, och i januari 1931 intogs senussiernas oas Kufra. Omar al-Mukhtar tillfångatogs i september 1931 och hängdes inför tusentals internerade, och Italien förklarade kriget avslutat i januari 1932. Uppskattningarna av antalet döda libyer varierar från omkring 20 000 till 100 000; kanske en fjärdedel av Cyrenaikas befolkning dog.
