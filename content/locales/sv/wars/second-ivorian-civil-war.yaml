# Svenska översättningar av katalogtexten (våg 13); stegtexterna kommer senare.
Second Ivorian Civil War: Andra inbördeskriget i Elfenbenskusten
? The war that followed Côte d’Ivoire’s disputed presidential election of 2010. After the run-off of 28 November 2010 the electoral commission declared Alassane Ouattara the winner, and the United Nations, which had certified the vote, the African Union and ECOWAS recognised him; but the Constitutional Council, headed by an ally of the incumbent, Laurent Gbagbo, annulled results from the north and declared Gbagbo re-elected. Both men were sworn in. Ouattara’s government sat in the Golf Hotel in Abidjan under UN protection while fighting spread in the city’s northern suburbs and in the west. In late March 2011 the former rebels of the north, now the Republican Forces of Côte d’Ivoire (FRCI), swept south to Yamoussoukro, San-Pédro and Abidjan; at Duékoué hundreds of civilians were massacred. After UN and French helicopters destroyed Gbagbo’s heavy weapons, the FRCI captured him in his residence on 11 April 2011. About 3,000 people were killed and more than a million displaced; Gbagbo was tried at the International Criminal Court and acquitted.
: Det krig som följde på det omstridda presidentvalet i Elfenbenskusten 2010. Efter den andra valomgången den 28 november 2010 utropade valkommissionen Alassane Ouattara till segrare, och FN, som hade certifierat valet, Afrikanska unionen och Ecowas erkände honom; men konstitutionsrådet, som leddes av en bundsförvant till den sittande presidenten Laurent Gbagbo, ogiltigförklarade resultaten från norr och förklarade Gbagbo omvald. Båda männen svors in. Ouattaras regering satt på Golf Hotel i Abidjan under FN:s beskydd medan striderna spred sig i stadens norra förorter och i väster. I slutet av mars 2011 svepte de tidigare rebellerna från norr, nu Republikanska styrkorna i Elfenbenskusten (FRCI), söderut till Yamoussoukro, San-Pédro och Abidjan; i Duékoué massakrerades hundratals civila. Sedan FN:s och Frankrikes helikoptrar hade förstört Gbagbos tunga vapen tillfångatog FRCI honom i hans residens den 11 april 2011. Omkring 3 000 människor dödades och mer än en miljon fördrevs; Gbagbo ställdes inför Internationella brottmålsdomstolen och frikändes.
