# Svenska översättningar av katalogtexten (våg 13); stegtexterna kommer senare.
Second Liberian Civil War: Andra liberianska inbördeskriget
? The war against President Charles Taylor’s government by two rebel movements, Liberians United for Reconciliation and Democracy (LURD), which attacked from Guinea from 1999, and the Movement for Democracy in Liberia (MODEL), which entered from Côte d’Ivoire in 2003. LURD fought its way through Lofa County to the outskirts of Monrovia by 2002, while United Nations sanctions punished Taylor for arming Sierra Leone’s RUF; in 2003 MODEL took the south-east and LURD besieged the capital in three assaults from June to August, killing hundreds of civilians with mortar fire. On 4 June 2003 the Special Court for Sierra Leone announced its indictment of Taylor for war crimes. A West African force, ECOMIL, landed in August; Taylor resigned on 11 August and went into exile in Nigeria, and the factions signed a comprehensive peace agreement at Accra on 18 August 2003. A United Nations mission, UNMIL, disarmed more than 100,000 fighters, and Ellen Johnson Sirleaf was elected president in 2005. About 50,000 people were killed in the war.
: "Kriget mot president Charles Taylors regering, fört av två rebellrörelser: Liberians United for Reconciliation and Democracy (LURD), som anföll från Guinea från 1999, och Movement for Democracy in Liberia (MODEL), som gick in från Elfenbenskusten 2003. LURD kämpade sig genom Lofa County fram till Monrovias utkanter 2002, medan FN:s sanktioner straffade Taylor för att han beväpnade RUF i Sierra Leone; 2003 intog MODEL sydöstra delen av landet och LURD belägrade huvudstaden i tre anfall från juni till augusti, varvid hundratals civila dödades av granatkastareld. Den 4 juni 2003 tillkännagav Specialdomstolen för Sierra Leone sitt åtal mot Taylor för krigsförbrytelser. En västafrikansk styrka, Ecomil, landsteg i augusti; Taylor avgick den 11 augusti och gick i exil i Nigeria, och fraktionerna undertecknade ett omfattande fredsavtal i Accra den 18 augusti 2003. En FN-mission, UNMIL, avväpnade mer än 100 000 krigare, och Ellen Johnson Sirleaf valdes till president 2005. Omkring 50 000 människor dödades i kriget."
