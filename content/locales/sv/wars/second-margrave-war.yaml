The revolt of 1552 is also called the Second Schmalkaldic War. Albert Alcibiades took part in it before going his own way, and Maurice, who led it, later fought and died against him; the sides above changed in the course of the war.: Upproret 1552 kallas också andra schmalkaldiska kriget. Albrekt Alkibiades deltog i det innan han gick sin egen väg, och Moritz, som ledde det, stred senare mot honom och stupade; sidorna ovan växlade under krigets gång.
France held the Three Bishoprics from 1552, and the Peace of Westphalia confirmed them as French in 1648. Some historians date the end of the Margrave War to 1555, when the confiscation of Albert’s lands was settled.: Frankrike höll de tre biskopsdömena från 1552, och Westfaliska freden bekräftade dem som franska 1648. Vissa historiker daterar markgrevekrigets slut till 1555, då konfiskeringen av Albrekts länder avgjordes.
