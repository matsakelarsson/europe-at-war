Princes’ Revolt and Second Margrave War: Furstupproret och andra markgrevekriget
In the spring of 1552 Elector Maurice of Saxony, who had helped Charles V win the Schmalkaldic War, turned against him with other Protestant princes and an alliance with Henry II of France, who occupied the bishoprics of Metz, Toul and Verdun. The rebels nearly captured the Emperor at Innsbruck, and the Peace of Passau in August 1552 freed the imprisoned John Frederick of Saxony and Philip of Hesse and prepared the way for the religious Peace of Augsburg in 1555; Charles’s siege of Metz that winter failed. One of the rebels, Margrave Albert Alcibiades of Brandenburg-Kulmbach, refused the peace and went on plundering Franconia and the Rhineland, extorting land and money from Nuremberg and the bishops of Bamberg and Würzburg. Maurice and Henry of Brunswick-Wolfenbüttel beat him at Sievershausen on 9 July 1553, a battle in which Maurice was killed, and by June 1554 Albert had been driven from Franconia and his lands confiscated.: Våren 1552 vände sig kurfursten Moritz av Sachsen, som hade hjälpt Karl V att vinna schmalkaldiska kriget, mot honom tillsammans med andra protestantiska furstar och i förbund med Henrik II av Frankrike, som besatte biskopsdömena Metz, Toul och Verdun. Rebellerna var nära att tillfångata kejsaren i Innsbruck, och fördraget i Passau i augusti 1552 frigav de fängslade Johan Fredrik av Sachsen och Filip av Hessen och banade väg för religionsfreden i Augsburg 1555; Karls belägring av Metz samma vinter misslyckades. En av rebellerna, markgreve Albrekt Alkibiades av Brandenburg-Kulmbach, vägrade godta freden och fortsatte att plundra Franken och Rhenlandet och pressade till sig land och pengar av Nürnberg och biskoparna av Bamberg och Würzburg. Moritz och Henrik av Braunschweig-Wolfenbüttel slog honom vid Sievershausen den 9 juli 1553, ett slag där Moritz stupade, och i juni 1554 hade Albrekt drivits ut ur Franken och hans länder konfiskerats.
