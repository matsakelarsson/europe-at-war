# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
Second Maroon War: Andra maronkriget
? "The war of 1795–1796 between the Maroons of Trelawny Town and the colonial government of Jamaica. Trelawny Town (formerly Cudjoe’s Town), in the hills south of Montego Bay, was the largest of the Leeward Maroon towns whose independence the British had recognised in the treaties of 1739 that ended the First Maroon War. In July 1795 two of its men, convicted of stealing pigs, were flogged at Montego Bay by an enslaved man, an insult that brought long grievances over land and over the town’s white superintendent to a head. The governor, Lord Balcarres, who feared that revolutionary ideas from Saint-Domingue and France would spread among the island’s enslaved people, seized six Maroon leaders who came to negotiate, among them Montague James, and in August sent troops against the town. The Maroons burned it and fought from the Cockpit Country, where a few hundred fighters held off some 5,000 soldiers and militia for five months, killing three colonels in ambushes, while the Accompong Maroons fought for the colony and the Windward towns stayed neutral. Major-General George Walpole’s destruction of their provision grounds and the arrival of about 100 hunting dogs and their handlers from Cuba led the Maroons to accept peace in December 1795, on Walpole’s private promise that they would not be sent off the island. Most came in only by March 1796, and Balcarres and the Assembly used the delay to deport them: in June 1796 between 550 and 600 Trelawny Town Maroons were shipped to Nova Scotia, and in 1800 most of them went on to Sierra Leone. Walpole resigned in protest."
: "Kriget 1795–1796 mellan maronerna i Trelawny Town och kolonialregeringen på Jamaica. Trelawny Town (tidigare Cudjoe’s Town), i bergen söder om Montego Bay, var den största av de Leewardmaronbyar vars självständighet britterna hade erkänt i de fördrag från 1739 som avslutade första maronkriget. I juli 1795 piskades två av byns män, dömda för grisstöld, i Montego Bay av en förslavad man, en förolämpning som fick långvarigt missnöje över jorden och över byns vite tillsyningsman att komma till utbrott. Guvernören, lord Balcarres, som fruktade att revolutionära idéer från Saint-Domingue och Frankrike skulle spridas bland öns förslavade, lät gripa sex maronledare som kom för att förhandla, bland dem Montague James, och sände i augusti trupper mot byn. Maronerna brände den och stred från Cockpit Country, där några hundra kämpar höll omkring 5 000 soldater och milismän stången i fem månader och dödade tre överstar i bakhåll, medan Accompongmaronerna stred för kolonin och Windwardbyarna förblev neutrala. Generalmajor George Walpoles förstörelse av deras odlingar och ankomsten av omkring 100 spårhundar med förare från Kuba fick maronerna att godta fred i december 1795, på Walpoles privata löfte att de inte skulle föras bort från ön. De flesta infann sig först i mars 1796, och Balcarres och lagstiftande församlingen utnyttjade dröjsmålet för att deportera dem: i juni 1796 skeppades mellan 550 och 600 maroner från Trelawny Town till Nova Scotia, och 1800 fortsatte de flesta av dem till Sierra Leone. Walpole avgick i protest."
