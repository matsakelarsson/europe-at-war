# Svenska översättningar av katalogtexten (våg 13); stegtexterna kommer senare.
Second Matabele War (First Chimurenga): Andra matabelekriget (första Chimurenga)
? The armed rising of the Ndebele and of many Shona chiefdoms against the British South Africa Company’s rule in what is now Zimbabwe, called in Zimbabwe the First Chimurenga (“war of liberation”). Three years after the conquest of the Ndebele kingdom, people had lost much of their land and almost all their cattle, were forced to work for settlers and beaten by the company’s African police, and were then struck by drought, locusts and the cattle plague rinderpest. When most of the company’s armed police were captured in the Jameson Raid on the Transvaal, the Ndebele rose in March 1896, killing settlers across Matabeleland and besieging Bulawayo; in June the Shona of Mashonaland, whom the settlers had thought friendly, rose too. Priests of the Mwari shrines such as Mkwati and spirit mediums such as Nehanda and Kaguvi helped to bind the risings together. Imperial troops relieved Bulawayo; Cecil Rhodes ended the Ndebele war by negotiating with the izinDuna in the Matobo Hills in August–October 1896, while in Mashonaland the company dynamited the caves of the chiefs one by one until late 1897. About one in ten of the settlers in the country was killed; African deaths, in battle, in executions and from the hunger that followed, were far higher and were never counted.
: Den väpnade resningen bland ndebele och många shonahövdingadömen mot Brittiska Sydafrikakompaniets styre i det som nu är Zimbabwe, i Zimbabwe kallad första Chimurenga (”befrielsekriget”). Tre år efter erövringen av Ndebeleriket hade folket förlorat mycket av sin mark och nästan all sin boskap, tvingades arbeta för nybyggare och misshandlades av kompaniets afrikanska polis, och drabbades sedan av torka, gräshoppor och boskapspesten. När större delen av kompaniets beväpnade polis tillfångatogs under Jamesonräden mot Transvaal reste sig ndebele i mars 1896, dödade nybyggare över hela Matabeleland och belägrade Bulawayo; i juni reste sig även shona i Mashonaland, som nybyggarna hade trott vara vänligt sinnade. Präster vid Mwarihelgedomarna, som Mkwati, och andemedier som Nehanda och Kaguvi bidrog till att knyta samman resningarna. Trupper från imperiet undsatte Bulawayo; Cecil Rhodes avslutade ndebelekriget genom att förhandla med izinDuna i Matobobergen i augusti–oktober 1896, medan kompaniet i Mashonaland sprängde hövdingarnas grottor med dynamit en efter en fram till slutet av 1897. Omkring var tionde nybyggare i landet dödades; antalet döda afrikaner, i strid, genom avrättningar och av den svält som följde, var långt högre och räknades aldrig.
