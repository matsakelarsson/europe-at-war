Second Melillan campaign: Andra Melillafälttåget
A war between Spain and the Rifian tribes around Melilla in 1909, set off by a tribal attack on Spanish workers building a railway to iron mines in the Rif on 9 July. The government called up reservists, many of them working men with families, and the departure of troops from Barcelona set off the rising known as the Tragic Week. In Morocco a Spanish column suffered heavy losses at the Barranco del Lobo on 27 July, but reinforced to some 35,000–40,000 men the army took Mount Gurugú and the country south of Melilla by the end of the year.: Ett krig mellan Spanien och rifstammarna kring Melilla 1909, utlöst av ett anfall från stammarna den 9 juli mot spanska arbetare som byggde en järnväg till järngruvor i Rif. Regeringen kallade in reservister, många av dem arbetare med familj, och truppernas avfärd från Barcelona utlöste det uppror som kallas Tragiska veckan. I Marocko led en spansk kolonn svåra förluster vid Barranco del Lobo den 27 juli, men förstärkt till omkring 35 000–40 000 man intog armén berget Gurugú och landet söder om Melilla före årets slut.
