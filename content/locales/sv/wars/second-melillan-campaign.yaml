The Tragic Week in Barcelona, from 26 July to 2 August 1909, began as a general strike against the call-up and turned into riots in which dozens of churches and convents were burned; over 100 people were killed, and the anarchist educator Francesc Ferrer was executed afterwards, which caused protests across Europe.: Tragiska veckan i Barcelona, från den 26 juli till den 2 augusti 1909, började som en generalstrejk mot inkallelsen och övergick i upplopp där dussintals kyrkor och kloster brändes; över 100 människor dödades, och den anarkistiske pedagogen Francesc Ferrer avrättades efteråt, vilket väckte protester över hela Europa.
