Nagorno-Karabakh and the surrounding districts are shown as part of Azerbaijan on the map, as they are internationally recognised. Areas of control are drawn approximately.: Nagorno-Karabach och de omgivande distrikten visas på kartan som en del av Azerbajdzjan, i enlighet med internationellt erkännande. Kontrollområdena är ungefärligt utritade.
Many places have both Armenian and Azerbaijani names, such as Stepanakert (Khankendi) and Shusha (Shushi). The more common English forms are used here.: Många orter har både armeniska och azerbajdzjanska namn, som Stepanakert (Chankändi) och Sjusja (Sjusji). Här används de vanligaste formerna.
Each side played down its own losses and exaggerated the other’s; the figures given are those the two governments published after the war.: Båda sidor tonade ned sina egna förluster och överdrev motståndarens; siffrorna som anges är dem som de två regeringarna publicerade efter kriget.
Talks under the OSCE Minsk Group had brought no settlement since 1994, and the fortified ceasefire line had flared up several times, most seriously in April 2016. On 27 September 2020 heavy fighting broke out along the whole line. Each side blamed the other, but Azerbaijan, with strong political and military backing from Turkey, quickly went over to a large offensive. Turkish Bayraktar TB2 drones and Israeli-made loitering munitions destroyed Armenian air defences, tanks and artillery, and Azerbaijan published the videos. There were reports, denied by Azerbaijan and Turkey, that Syrian fighters had been recruited for the war.: Förhandlingarna inom OSSE:s Minskgrupp hade inte lett till någon uppgörelse sedan 1994, och den befästa eldupphörslinjen hade flammat upp flera gånger, allvarligast i april 2016. Den 27 september 2020 bröt hårda strider ut längs hela linjen. Båda sidor skyllde på varandra, men Azerbajdzjan, med starkt politiskt och militärt stöd från Turkiet, gick snabbt över till en stor offensiv. Turkiska Bayraktar TB2-drönare och israeliskt tillverkad kringflygande ammunition förstörde armeniskt luftvärn, stridsvagnar och artilleri, och Azerbajdzjan publicerade videoklippen. Det förekom uppgifter, som Azerbajdzjan och Turkiet förnekade, om att syriska krigare hade rekryterats till kriget.
The main advance came in the open country of the south, along the Iranian border. Azerbaijani forces announced the capture of Jabrayil on 9 October, Fuzuli on 17 October, Zangilan on 20 October and Qubadli on 25 October, fought their way into Hadrut, and then turned north through wooded hills towards Shusha and the Lachin road. Elsewhere the front hardly moved. Both sides shelled towns. Stepanakert was hit repeatedly, including with cluster munitions, and Armenian missile strikes on Ganja and a cluster attack on Barda killed dozens of Azerbaijani civilians. Three humanitarian ceasefires in October broke down within hours.: Den huvudsakliga framryckningen skedde i det öppna landskapet i söder, längs gränsen mot Iran. Azerbajdzjanska styrkor meddelade att de intagit Cäbrayıl den 9 oktober, Füzuli den 17 oktober, Zängilan den 20 oktober och Qubadlı den 25 oktober, stred sig in i Hadrut och svängde sedan norrut genom skogklädda kullar mot Sjusja och Latjinvägen. På andra håll rörde sig fronten knappt. Båda sidor besköt städer. Stepanakert träffades upprepade gånger, bland annat med klusterammunition, och armeniska robotangrepp mot Ganja och en klusterattack mot Barda dödade dussintals azerbajdzjanska civila. Tre humanitära eldupphör i oktober bröt samman inom några timmar.
