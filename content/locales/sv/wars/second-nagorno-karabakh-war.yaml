Azerbaijani troops climbed through the forests below Shusha and took the town on 8 November, putting the road from Stepanakert to Armenia within range. On the night of 9–10 November Ilham Aliyev, Nikol Pashinyan and Vladimir Putin signed a statement ending the war. Armenia agreed to hand back the Agdam, Kalbajar and Lachin districts by 1 December, and about 2,000 Russian peacekeepers deployed along the new line and the Lachin corridor. About 2,900 Azerbaijani and 3,800 Armenian soldiers had been killed, and about 100 civilians on each side. Crowds in Yerevan denounced the agreement as a capitulation.: Azerbajdzjanska trupper tog sig upp genom skogarna nedanför Sjusja och intog staden den 8 november, vilket gjorde att vägen från Stepanakert till Armenien hamnade inom skotthåll. Natten mellan den 9 och 10 november undertecknade Ilham Alijev, Nikol Pasjinjan och Vladimir Putin en förklaring som avslutade kriget. Armenien gick med på att lämna tillbaka distrikten Agdam, Kälbäcär och Latjin senast den 1 december, och omkring 2 000 ryska fredsbevarare grupperades längs den nya linjen och Latjinkorridoren. Omkring 2 900 azerbajdzjanska och 3 800 armeniska soldater hade dödats, och omkring 100 civila på vardera sidan. Folkmassor i Jerevan fördömde avtalet som en kapitulation.
The rest of Karabakh stayed under its Armenian authorities, linked to Armenia only by the corridor. In December 2022 Azerbaijani protesters presented as environmental activists blocked it, and in April 2023 Azerbaijan set up a checkpoint, causing severe shortages of food, fuel and medicine. On 19 September 2023 Azerbaijan attacked, and the next day the Karabakh forces agreed to disarm. Within a week more than 100,000 people, nearly the whole Armenian population, fled to Armenia, and a fuel depot explosion near Stepanakert killed more than 170 of them. On 28 September the Artsakh president signed a decree dissolving the republic from 1 January 2024.: Resten av Karabach förblev under sina armeniska myndigheter, förbundet med Armenien endast genom korridoren. I december 2022 blockerades den av azerbajdzjanska demonstranter som framställdes som miljöaktivister, och i april 2023 upprättade Azerbajdzjan en kontrollpost, vilket orsakade svår brist på mat, bränsle och mediciner. Den 19 september 2023 anföll Azerbajdzjan, och dagen därpå gick Karabachstyrkorna med på att avväpnas. Inom en vecka flydde mer än 100 000 människor, nästan hela den armeniska befolkningen, till Armenien, och en explosion vid ett bränsledepå nära Stepanakert dödade mer än 170 av dem. Den 28 september undertecknade Artsachs president ett dekret om att republiken skulle upplösas från den 1 januari 2024.
