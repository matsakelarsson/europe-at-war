Second Nagorno-Karabakh War: Andra Nagorno-Karabach-kriget
A 44-day war in which Azerbaijan, with strong Turkish support, retook the districts around Nagorno-Karabakh that Armenian forces had held since 1994, along with Hadrut and Shusha. A ceasefire brokered by Russia on 9–10 November 2020 returned further districts to Azerbaijan and brought in Russian peacekeepers; in September 2023 an Azerbaijani offensive ended the Republic of Artsakh, and almost all of Karabakh’s Armenians fled to Armenia.: Ett 44 dagar långt krig där Azerbajdzjan, med starkt turkiskt stöd, återtog de distrikt kring Nagorno-Karabach som armeniska styrkor hade hållit sedan 1994, liksom Hadrut och Sjusja. Ett eldupphör som förmedlades av Ryssland den 9–10 november 2020 återlämnade ytterligare distrikt till Azerbajdzjan och förde in ryska fredsbevarare; i september 2023 gjorde en azerbajdzjansk offensiv slut på Republiken Artsach, och nästan alla Karabachs armenier flydde till Armenien.
