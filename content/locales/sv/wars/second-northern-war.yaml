The confederates declared their loyalty to John Casimir and called for a general rising against the Swedes.: Konfederaterna förklarade sin lojalitet mot Johan Kasimir och uppmanade till ett allmänt uppror mot svenskarna.
The king made his vows in the Latin cathedral, naming the Virgin Mary Queen of Poland.: Kungen avlade sina löften i den latinska katedralen och utnämnde Jungfru Maria till Polens drottning.
Battle of Gołąb: Slaget vid Gołąb
