The Swedish garrison of Dorpat (Tartu) surrendered to the Russians.: Den svenska garnisonen i Dorpat (Tartu) kapitulerade till ryssarna.
Tsar Alexis: Tsar Aleksej
Charles X Gustav allied with George II Rákóczi of Transylvania, whose army of about 25,000 invaded Poland in January 1657 and even took Warsaw in June. The campaign then fell apart and Rákóczi had to surrender. Austria joined Poland, and Brandenburg switched sides in return for full sovereignty over Ducal Prussia.: Karl X Gustav slöt förbund med Georg II Rákóczi av Transsylvanien, vars armé på omkring 25 000 man invaderade Polen i januari 1657 och till och med intog Warszawa i juni. Fälttåget föll sedan samman, och Rákóczi måste kapitulera. Österrike slöt upp på Polens sida, och Brandenburg bytte sida mot full suveränitet över Hertigliga Preussen.
Denmark declared war in June 1657, hoping to win back its losses. Charles welcomed the chance to leave Poland. He marched his army across Germany into Holstein and Jutland, and in late October his troops stormed the fortress of Frederiksodde.: Danmark förklarade krig i juni 1657 i hopp om att vinna tillbaka sina förluster. Karl välkomnade chansen att lämna Polen. Han marscherade med sin armé genom Tyskland in i Holstein och Jylland, och i slutet av oktober stormade hans trupper fästningen Frederiksodde.
