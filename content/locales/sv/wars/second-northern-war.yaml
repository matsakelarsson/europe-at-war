Second Northern War: Andra nordiska kriget
Charles X Gustav’s invasion of Poland–Lithuania in 1655, the Deluge, drew in Russia, Brandenburg, Transylvania, the Habsburgs, Denmark–Norway and the Dutch. Sweden could not hold Poland, but after marching across the frozen Danish straits it won Scania, Halland, Blekinge and Bohuslän from Denmark–Norway, which it kept at the peace of 1660.: Karl X Gustavs invasion av Polen–Litauen 1655, syndafloden, drog in Ryssland, Brandenburg, Transsylvanien, habsburgarna, Danmark–Norge och nederländarna. Sverige kunde inte behålla Polen, men efter tåget över de frusna danska sunden vann det Skåne, Halland, Blekinge och Bohuslän från Danmark–Norge, landskap som det behöll vid freden 1660.
