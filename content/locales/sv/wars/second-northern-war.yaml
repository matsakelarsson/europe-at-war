Charles X Gustav invaded Poland–Lithuania in July 1655, while it was already fighting Russia and the Cossacks. At Ujście on 25 July the nobles of Greater Poland surrendered without a real fight, and on 17 August Janusz Radziwiłł placed Lithuania under Swedish protection at Kėdainiai.: Karl X Gustav invaderade Polen–Litauen i juli 1655, medan landet redan var i krig med Ryssland och kosackerna. Vid Ujście den 25 juli kapitulerade adeln i Storpolen utan någon verklig strid, och den 17 augusti ställde Janusz Radziwiłł Litauen under svenskt beskydd i Kėdainiai.
Charles entered Warsaw on 8 September. Kraków fell in October, and King John II Casimir fled to Silesia. Only the fortified monastery of Jasna Góra at Częstochowa held out, and its defence rallied Polish resistance. Far away, on the Delaware, the Dutch took the colony of New Sweden that September.: Karl tågade in i Warszawa den 8 september. Kraków föll i oktober, och kung Johan II Kasimir flydde till Schlesien. Endast det befästa klostret Jasna Góra i Częstochowa höll stånd, och dess försvar samlade det polska motståndet. Långt borta, vid Delawarefloden, intog nederländarna kolonin Nya Sverige i september samma år.
