The Danish declaration of war reached Charles X Gustav at his field camp in Thorn.: Den danska krigsförklaringen nådde Karl X Gustav i hans fältläger i Thorn.
Danes attack Bremen-Verden: Danskarna anfaller Bremen-Verden
