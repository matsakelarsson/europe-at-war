Monks and a small garrison under Prior Augustyn Kordecki beat off a month-long Swedish siege, the only Polish stronghold the invaders failed to take.: Munkar och en liten garnison under priorn Augustyn Kordecki slog tillbaka en månadslång svensk belägring; det var den enda polska fästning som inkräktarna inte lyckades inta.
The great port never fell. By the end of 1655 it was one of only three towns in Royal Prussia still holding out.: Den stora hamnstaden föll aldrig. I slutet av 1655 var den en av endast tre städer i Kungliga Preussen som fortfarande höll stånd.
