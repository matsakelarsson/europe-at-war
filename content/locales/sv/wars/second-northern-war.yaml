Janusz Radziwiłł died in his besieged castle. His garrison surrendered to the loyalists soon afterwards.: Janusz Radziwiłł dog på sitt belägrade slott. Hans garnison kapitulerade till de lojala kort därefter.
November 1656: November 1656
Russia and Poland–Lithuania stopped fighting each other to face Sweden. The Poles even held out the prospect of electing the tsar as John Casimir’s successor.: Ryssland och Polen–Litauen upphörde att strida mot varandra för att möta Sverige. Polackerna höll till och med möjligheten öppen att välja tsaren till Johan Kasimirs efterträdare.
Cherkassky and Zolotarenko: Tjerkasskij och Zolotarenko
Occupied by Russia, 1655: Ockuperat av Ryssland 1655
Under Swedish protection after Kėdainiai: Under svenskt beskydd efter Kėdainiai
Swedish requisitions and plunder, and the attack on Jasna Góra, turned many Poles who had submitted against Charles X Gustav. On 29 December 1655 nobles and soldiers loyal to John II Casimir formed the Confederation of Tyszowce and called the country to arms, and the Crown hetmans went back to the king. John Casimir returned from Silesia through the mountains to Lwów. In its cathedral, on 1 April 1656, he vowed to place the kingdom under the protection of the Virgin Mary and to ease the burdens of the peasants.: Svenska rekvisitioner och plundring, och angreppet på Jasna Góra, vände många polacker som hade underkastat sig mot Karl X Gustav. Den 29 december 1655 bildade adelsmän och soldater lojala mot Johan II Kasimir konfederationen i Tyszowce och kallade landet till vapen, och kronans hetmaner återgick till kungen. Johan Kasimir återvände från Schlesien genom bergen till Lwów. I dess katedral lovade han den 1 april 1656 att ställa riket under Jungfru Marias beskydd och att lätta böndernas bördor.
Charles X Gustav struck deep into the south-east that winter. He beat Stefan Czarniecki at Gołąb in February, but failed to take Zamość, and in late March he was nearly trapped where the San meets the Vistula, escaping with heavy losses. Czarniecki’s raids and ambushes wore down the Swedish columns, and on 1 July 1656 a Polish–Lithuanian army retook Warsaw, capturing the Swedish commander Arvid Wittenberg.: Karl X Gustav trängde den vintern djupt in i sydöst. Han slog Stefan Czarniecki vid Gołąb i februari men misslyckades med att inta Zamość, och i slutet av mars var han nära att bli instängd där San flyter samman med Weichsel och kom undan med svåra förluster. Czarnieckis räder och bakhåll nötte ned de svenska kolonnerna, och den 1 juli 1656 återtog en polsk-litauisk armé Warszawa och tillfångatog den svenske befälhavaren Arvid Wittenberg.
Confederation of Tyszowce: Konfederationen i Tyszowce
