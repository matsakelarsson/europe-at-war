Mid-February 1658: Mitten av februari 1658
A preliminary peace, signed as the Swedish army stood a short march from the capital.: En preliminärfred, undertecknad när den svenska armén stod en kort marsch från huvudstaden.
"Denmark–Norway lost about a third of its territory: Scania, Blekinge and Halland, the island of Bornholm, and from Norway the provinces of Bohuslän and Trøndelag (then including Nordmøre and Romsdal). Halland, held since 1645 on a 30-year pledge, became Swedish for good.": "Danmark–Norge förlorade omkring en tredjedel av sitt territorium: Skåne, Blekinge och Halland, ön Bornholm, och från Norge landskapen Bohuslän och Trøndelag (som då omfattade Nordmøre och Romsdal). Halland, som hållits som pant på 30 år sedan 1645, blev svenskt för gott."
Denmark also had to renounce its anti-Swedish alliances and keep hostile warships out of the Baltic. Sweden had never been larger.: Danmark måste också avsäga sig sina antisvenska allianser och hålla fientliga örlogsfartyg borta från Östersjön. Sverige hade aldrig varit större.
