February 1656: Februari 1656
The fortress refused to open its gates, and the Swedish king, without siege guns, moved on.: Fästningen vägrade öppna sina portar, och den svenske kungen, som saknade belägringsartilleri, drog vidare.
Trap at the San: Fällan vid San
March – April 1656: Mars – april 1656
Hemmed in between the rivers and Polish troops, the Swedish army broke out after about two weeks and retreated north.: Inklämd mellan floderna och polska trupper bröt sig den svenska armén ut efter omkring två veckor och drog sig tillbaka norrut.
After a siege of more than a month the Swedish garrison surrendered.: Efter en belägring på mer än en månad kapitulerade den svenska garnisonen.
"Polish resistance grew fast, and a Swedish force was destroyed at Warka in April. Frederick William of Brandenburg had already become Charles’s vassal for Ducal Prussia, and on 28–30 July 1656 their combined army beat a larger Polish-Lithuanian army at Warsaw. The victory changed little: the allies were beaten at Prostki in October, and in November Charles had to grant Frederick William full sovereignty in Prussia at Labiau.": "Det polska motståndet växte snabbt, och en svensk styrka förintades vid Warka i april. Fredrik Vilhelm av Brandenburg hade redan blivit Karls vasall för Hertigliga Preussen, och den 28–30 juli 1656 slog deras förenade armé en större polsk-litauisk armé vid Warszawa. Segern ändrade inte mycket: de allierade besegrades vid Prostki i oktober, och i november måste Karl i Labiau ge Fredrik Vilhelm full suveränitet i Preussen."
Meanwhile Tsar Alexis declared war in May 1656. A Russian army besieged Riga from August to October without success, but another took Dorpat.: Under tiden förklarade tsar Aleksej krig i maj 1656. En rysk armé belägrade Riga från augusti till oktober utan framgång, men en annan intog Dorpat.
