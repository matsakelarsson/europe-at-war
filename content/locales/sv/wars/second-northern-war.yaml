Carl Gustaf Wrangel’s troops stormed the fortress where the Danish field army had taken refuge. Jutland was now in Swedish hands.: Carl Gustaf Wrangels trupper stormade fästningen där den danska fältarmén hade tagit sin tillflykt. Jylland var nu i svenska händer.
Rákóczi: Rákóczi
The winter was so harsh that the Danish straits froze and the Danish fleet was stuck in port. On 30 January 1658 Charles led his army across the ice of the Little Belt from Jutland to Funen and overwhelmed the defenders.: Vintern var så sträng att de danska sunden frös och den danska flottan låg infrusen i hamn. Den 30 januari 1658 ledde Karl sin armé över isen på Lilla Bält från Jylland till Fyn och överväldigade försvararna.
On 5 February he crossed the Great Belt via Langeland to Lolland, then over Falster to Zealand, losing two cavalry squadrons through the ice on the way. Copenhagen had not expected an attack before spring, and Denmark asked for peace. A preliminary treaty was signed at Taastrup in mid-February.: Den 5 februari gick han över Stora Bält via Langeland till Lolland och sedan över Falster till Själland och förlorade under vägen två kavalleriskvadroner genom isen. Köpenhamn hade inte väntat sig något anfall före våren, och Danmark bad om fred. Ett preliminärfördrag undertecknades i Taastrup i mitten av februari.
Across the Great Belt: Över Stora Bält
About 7,500 men and 20 guns: Omkring 7 500 man och 20 kanoner
