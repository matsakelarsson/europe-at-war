Lithuania was invaded from two sides. Russian armies and Cossacks had taken Smolensk, Vitebsk and Mogilev in 1654, and in the summer of 1655 they took Minsk, Grodno and Kaunas. On 8 August they captured Vilnius, the capital, and looted and burned it for days, killing many of its people. Tsar Alexis took the title Grand Duke of Lithuania. It was in the shadow of these defeats that Janusz Radziwiłł turned to Sweden at Kėdainiai.: Litauen invaderades från två håll. Ryska arméer och kosacker hade intagit Smolensk, Vitebsk och Mogiljov 1654, och sommaren 1655 intog de Minsk, Grodno och Kaunas. Den 8 augusti erövrade de huvudstaden Vilnius och plundrade och brände den i flera dagar och dödade många av dess invånare. Tsar Aleksej antog titeln storfurste av Litauen. Det var i skuggan av dessa nederlag som Janusz Radziwiłł vände sig till Sverige i Kėdainiai.
Many Lithuanian nobles rejected his union with Sweden and stayed loyal to John II Casimir, led by Paweł Sapieha, voivode of Vitebsk. Radziwiłł died on 31 December 1655 in his castle at Tykocin while Sapieha’s troops besieged it, and in 1656 Samogitia rose against its Swedish garrisons. Alarmed by Swedish gains, Russia turned on Sweden, and in November 1656 Russian and Polish–Lithuanian envoys agreed a truce at Niemież near Vilnius. Russian troops stayed in much of the Grand Duchy until 1661.: Många litauiska adelsmän förkastade hans union med Sverige och förblev lojala mot Johan II Kasimir, ledda av Paweł Sapieha, vojvod av Vitebsk. Radziwiłł dog den 31 december 1655 på sitt slott i Tykocin medan Sapiehas trupper belägrade det, och 1656 reste sig Samogitien mot sina svenska garnisoner. Oroat av de svenska framgångarna vände sig Ryssland mot Sverige, och i november 1656 kom ryska och polsk-litauiska sändebud överens om ett stillestånd i Niemież nära Vilnius. Ryska trupper stannade kvar i stora delar av storfurstendömet fram till 1661.
Vilnius taken by Russia: Vilnius intaget av Ryssland
