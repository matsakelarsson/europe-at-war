June 1657: Juni 1657
The Transylvanian invasion briefly took the capital, but the Poles soon cornered Rákóczi and forced him to surrender.: Den transsylvanska invasionen intog för en kort tid huvudstaden, men polackerna trängde snart in Rákóczi i ett hörn och tvingade honom att kapitulera.
News of war: Krigsbudet
