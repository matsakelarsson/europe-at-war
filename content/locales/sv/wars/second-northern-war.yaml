A three-day battle in which Swedish and Brandenburg troops beat a bigger Polish-Lithuanian army and retook the city, but could not hold it.: Ett tredagarsslag där svenska och brandenburgska trupper slog en större polsk-litauisk armé och återtog staden, men inte kunde hålla den.
