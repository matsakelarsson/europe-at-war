Treaty of Roskilde: Freden i Roskilde
The final peace, celebrated afterwards with a banquet for both kings at Frederiksborg Castle.: Den slutgiltiga freden, som efteråt firades med en bankett för båda kungarna på Frederiksborgs slott.
May 1658: Maj 1658
Lorentz Creutz arrived with about 530 soldiers to take over the province for Sweden.: Lorentz Creutz anlände med omkring 530 soldater för att ta över landskapet för Sveriges räkning.
Gained by Sweden in this peace: Vunnet av Sverige vid denna fred
Barely six months later Charles broke the peace, now aiming to wipe out Denmark as an independent state. His army landed at Korsør on 7 August 1658 and laid siege to Copenhagen, and Kronborg fell on 6 September.: Knappt sex månader senare bröt Karl freden, nu med målet att utplåna Danmark som självständig stat. Hans armé landsteg vid Korsør den 7 augusti 1658 och inledde belägringen av Köpenhamn, och Kronborg föll den 6 september.
The Dutch would not let one power hold both shores of the Sound. Their relief fleet of about 45 ships beat the Swedish fleet in the Battle of the Sound on 29 October 1658 and got supplies and troops into the city. On the night of 10–11 February 1659 a Swedish storming of Copenhagen was thrown back with heavy losses.: Nederländarna ville inte låta en enda makt behärska båda stränderna av Öresund. Deras undsättningsflotta på omkring 45 fartyg slog den svenska flottan i slaget i Öresund den 29 oktober 1658 och fick in förnödenheter och trupper i staden. Natten mellan den 10 och 11 februari 1659 slogs en svensk stormning av Köpenhamn tillbaka med svåra förluster.
Dutch relief fleet: Nederländsk undsättningsflotta
About 45 ships: Omkring 45 fartyg
City gates closed: Stadsportarna stängda
For 22 months: I 22 månader
Landing at Korsør: Landstigningen vid Korsør
7 August 1658: 7 augusti 1658
About 5,700 men crossed in some 70 ships. News of the landing reached Copenhagen the next day.: Omkring 5 700 man fördes över på ett 70-tal fartyg. Nyheten om landstigningen nådde Köpenhamn dagen därpå.
Siege of Kronborg: Belägringen av Kronborg
16 August – 6 September 1658: 16 augusti – 6 september 1658
Wrangel took the fortress that guards the Sound and turned its 77 captured guns on the siege.: Wrangel intog fästningen som vaktar Öresund och vände dess 77 erövrade kanoner mot den belägrade staden.
Battle of the Sound: Slaget i Öresund
29 October 1658: 29 oktober 1658
The Dutch under Admiral Obdam broke the Swedish blockade and joined the Danish fleet trapped in Copenhagen.: Nederländarna under amiral Obdam bröt den svenska blockaden och förenade sig med den danska flottan som låg instängd i Köpenhamn.
Assault on Copenhagen: Stormningen av Köpenhamn
10–11 February 1659: 10–11 februari 1659
Warned of the plan, the Danes and Dutch beat off the night attack. Afterwards Charles tried to starve the city out instead.: Varnade för planen slog danskarna och nederländarna tillbaka nattanfallet. Därefter försökte Karl i stället svälta ut staden.
"Swedish rule over the newly ceded lands began to crumble once the war restarted. The Norwegian commander Jørgen Bjelke marched on Trondheim and won it back in 1658. On Bornholm the islanders rose on 8–9 December 1658: the Swedish commandant Johan Printzensköld was shot in Rønne and his garrison gave up.": "Det svenska styret över de nyss avträdda landskapen började vackla när kriget åter bröt ut. Den norske befälhavaren Jørgen Bjelke marscherade mot Trondheim och vann tillbaka staden 1658. På Bornholm reste sig öborna den 8–9 december 1658: den svenske kommendanten Johan Printzensköld sköts i Rønne och hans garnison gav upp."
Further south, the Norwegian border town of Halden beat off Swedish attacks in 1658, 1659 and 1660.: Längre söderut slog den norska gränsstaden Halden tillbaka svenska anfall 1658, 1659 och 1660.
Norwegian name: Norskt namn
Bjelkefeiden: Bjelkefeiden
Halden attacked: Halden anfallet
1658, 1659 and 1660: 1658, 1659 och 1660
Siege of Trondheim: Belägringen av Trondheim
Norwegian troops under Jørgen Bjelke besieged and retook the city that had been handed to Sweden at Roskilde.: Norska trupper under Jørgen Bjelke belägrade och återtog staden som hade överlämnats till Sverige i Roskilde.
Bornholm uprising: Bornholmsupproret
8–9 December 1658: 8–9 december 1658
Islanders led by men such as Jens Kofoed and Villum Clausen seized the Swedish commandant, who was shot in Rønne’s main street.: Öbor ledda av bland andra Jens Kofoed och Villum Clausen grep den svenske kommendanten, som sköts på Rønnes huvudgata.
Halden: Halden
Swedish forces attacked in September 1658 and again in February 1659 with 4,000 men, and tried a third time in 1660. The town held each time.: Svenska styrkor anföll i september 1658 och på nytt i februari 1659 med 4 000 man och försökte en tredje gång 1660. Staden höll stånd varje gång.
Bjelke: Bjelke
Won back by Denmark–Norway: Återvunnet av Danmark–Norge
An allied army of about 30,000 Brandenburg, Imperial and Polish troops marched into Jutland in late 1658 and stormed the island of Als. By 1659 all of Jutland was in allied hands, and Imperial troops besieged Stettin in the autumn.: En allierad armé på omkring 30 000 brandenburgska, kejserliga och polska soldater marscherade in i Jylland i slutet av 1658 och stormade ön Als. År 1659 var hela Jylland i allierade händer, och kejserliga trupper belägrade Stettin på hösten.
After a failed landing in June, the allies crossed to Funen in November 1659. On 14 November they crushed the Swedish army at Nyborg, with Dutch ships under Michiel de Ruyter in support. The Swedes lost Funen and were left holding Zealand.: Efter en misslyckad landstigning i juni gick de allierade över till Fyn i november 1659. Den 14 november krossade de den svenska armén vid Nyborg, med stöd av nederländska fartyg under Michiel de Ruyter. Svenskarna förlorade Fyn och hade bara Själland kvar.
14,500 Brandenburg, 10,600 Imperial, 5,000 Polish: 14 500 brandenburgare, 10 600 kejserliga, 5 000 polacker
Last major battle: Sista stora slaget
Nyborg, 14 November 1659: Nyborg, 14 november 1659
Als stormed: Als stormas
Polish and Brandenburg troops invaded the island off the Jutland coast.: Polska och brandenburgska trupper invaderade ön utanför Jyllands kust.
Siege of Stettin: Belägringen av Stettin
Autumn 1659: Hösten 1659
About 5,000 Imperial troops crossed the Oder in mid-September 1659 to besiege the capital of Swedish Pomerania.: Omkring 5 000 kejserliga soldater gick över Oder i mitten av september 1659 för att belägra Svenska Pommerns huvudstad.
Battle of Nyborg: Slaget vid Nyborg
14 November 1659: 14 november 1659
Danish, Imperial, Brandenburg and Polish troops defeated the Swedes on Funen. Polish cavalry under Kazimierz Piaseczyński played a key part.: Danska, kejserliga, brandenburgska och polska trupper besegrade svenskarna på Fyn. Polskt kavalleri under Kazimierz Piaseczyński spelade en avgörande roll.
Charles X Gustav died at Gothenburg on 13 February 1660, aged 37, while planning yet another campaign. His son Charles XI was four, and the regency quickly made peace. At Oliva near Danzig on 3 May 1660, Poland–Lithuania recognised Swedish Livonia, John II Casimir gave up his claim to the Swedish crown, and all occupied land was returned.: Karl X Gustav dog i Göteborg den 13 februari 1660, 37 år gammal, medan han planerade ännu ett fälttåg. Hans son Karl XI var fyra år, och förmyndarregeringen slöt snabbt fred. I Oliva nära Danzig erkände Polen–Litauen den 3 maj 1660 Svenska Livland, Johan II Kasimir avsade sig sina anspråk på den svenska kronan, och allt ockuperat land återlämnades.
In the Treaty of Copenhagen on 27 May 1660, Sweden gave back Trøndelag and Bornholm but kept Scania, Halland, Blekinge and Bohuslän. Peace with Russia followed at Cardis in 1661, restoring the borders of 1617.: Genom freden i Köpenhamn den 27 maj 1660 lämnade Sverige tillbaka Trøndelag och Bornholm men behöll Skåne, Halland, Blekinge och Bohuslän. Freden med Ryssland följde i Kardis 1661 och återställde 1617 års gränser.
Kept by Sweden: Behölls av Sverige
Scania, Halland, Blekinge, Bohuslän: Skåne, Halland, Blekinge, Bohuslän
Returned: Återlämnade
Trøndelag and Bornholm: Trøndelag och Bornholm
Charles X Gustav dies: Karl X Gustav dör
13 February 1660: 13 februari 1660
The king fell ill and died while the Riksdag was meeting in Gothenburg.: Kungen insjuknade och dog medan riksdagen var samlad i Göteborg.
Treaty of Oliva: Freden i Oliva
3 May 1660: 3 maj 1660
Peace with Poland–Lithuania, the Emperor and Brandenburg. Brandenburg’s sovereignty over Ducal Prussia was also confirmed.: Fred med Polen–Litauen, kejsaren och Brandenburg. Brandenburgs suveränitet över Hertigliga Preussen bekräftades också.
Treaty of Copenhagen: Freden i Köpenhamn
27 May 1660: 27 maj 1660
Sweden kept everything east of the Sound and its exemption from the Sound Dues. Four days later the remaining Swedish troops began to leave the outskirts of the city.: Sverige behöll allt öster om Öresund och sin befrielse från Öresundstullen. Fyra dagar senare började de kvarvarande svenska trupperna lämna stadens omgivningar.
Treaty of Cardis: Freden i Kardis
Russia handed back its conquests in Livonia, confirming the 1617 Treaty of Stolbovo.: Ryssland lämnade tillbaka sina erövringar i Livland och bekräftade därmed freden i Stolbova 1617.
