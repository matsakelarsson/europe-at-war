30 January 1658: 30 januari 1658
Between 6,000 and 12,000 Swedes crossed the ice to Funen and beat the Danish troops waiting there.: Mellan 6 000 och 12 000 svenskar gick över isen till Fyn och slog de danska trupper som väntade där.
5 February 1658: 5 februari 1658
The king and the cavalry crossed from Langeland to Lolland, with the infantry and guns following the next day.: Kungen och kavalleriet gick över från Langeland till Lolland, och infanteriet och kanonerna följde dagen därpå.
Onto Zealand: Upp på Själland
