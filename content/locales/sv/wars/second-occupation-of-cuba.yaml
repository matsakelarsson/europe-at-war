# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
Second Occupation of Cuba: Andra ockupationen av Kuba
? The American intervention of 1906–1909, also called the Provisional Government of Cuba or the Cuban Pacification. The Platt Amendment, which the United States made a condition of its withdrawal in 1902 and which Cuba wrote into its constitution and into a treaty of 1903, gave the United States a right to intervene to preserve Cuban independence and a stable government. In 1905 President Tomás Estrada Palma and his Moderates won re-election by fraud, and in August 1906 the Liberals rose in arms in the August revolution (the Little August War), with columns under Faustino “Pino” Guerra in Pinar del Río and other veterans of the war of independence; the old general Quintín Banderas was killed by the Rural Guard. Both sides appealed to Washington. President Theodore Roosevelt sent Secretary of War William Howard Taft and Assistant Secretary of State Robert Bacon, who arrived on 19 September 1906. When they proposed a compromise, Estrada Palma resigned on 28 September and Congress chose no successor, and on 29 September Taft proclaimed a provisional government with himself as governor, under the Cuban flag and laws. Charles E. Magoon succeeded him on 13 October 1906 and governed for more than two years, backed by an Army of Cuban Pacification that never exceeded about 6,600 American soldiers. The rebels disarmed without a battle. Magoon’s government built roads and drafted new laws, and Cuban critics blamed it for spreading government sinecures and debt. After elections in 1908 the Liberal José Miguel Gómez became president on 28 January 1909, and the last American troops left in the following weeks.
: Den amerikanska interventionen 1906–1909, även kallad Kubas provisoriska regering eller pacificeringen av Kuba. Plattillägget, som USA gjorde till ett villkor för sitt tillbakadragande 1902 och som Kuba skrev in i sin författning och i ett fördrag 1903, gav USA rätt att intervenera för att bevara Kubas självständighet och en stabil regering. År 1905 vann president Tomás Estrada Palma och hans moderater omval genom valfusk, och i augusti 1906 grep liberalerna till vapen i augustirevolutionen (det lilla augustikriget), med kolonner under Faustino ”Pino” Guerra i Pinar del Río och andra veteraner från självständighetskriget; den gamle generalen Quintín Banderas dödades av landsbygdsgardet. Båda sidor vädjade till Washington. President Theodore Roosevelt sände krigsministern William Howard Taft och biträdande utrikesministern Robert Bacon, som anlände den 19 september 1906. När de föreslog en kompromiss avgick Estrada Palma den 28 september och kongressen valde ingen efterträdare, och den 29 september utropade Taft en provisorisk regering med sig själv som guvernör, under kubansk flagg och kubanska lagar. Charles E. Magoon efterträdde honom den 13 oktober 1906 och styrde i mer än två år, uppbackad av en armé för pacificeringen av Kuba som aldrig översteg omkring 6 600 amerikanska soldater. Rebellerna lade ned vapnen utan strid. Magoons regering byggde vägar och utarbetade nya lagar, och kubanska kritiker anklagade den för att sprida statliga sinekurer och skulder. Efter val 1908 blev liberalen José Miguel Gómez president den 28 januari 1909, och de sista amerikanska trupperna lämnade landet under de följande veckorna.
