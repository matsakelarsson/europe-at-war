# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
Second Opium War: Andra opiumkriget
? A war of Britain and France against Qing China, also called the Arrow War. Britain wanted to revise the treaties of the First Opium War to open all of China to trade, legalise opium and station an ambassador in Beijing. The seizure of the Chinese-owned, Hong Kong-registered lorcha Arrow at Guangzhou (Canton) in October 1856 gave it a pretext, and France joined after the execution of a French missionary in Guangxi. The allies took Guangzhou at the end of 1857 and the Dagu (Taku) forts in May 1858, and imposed the Treaties of Tianjin. When the Qing repulsed their envoys at Dagu in 1859, an Anglo-French army of about 18,000 men returned in 1860, beat the Mongol general Senggelinqin at Baliqiao and occupied Beijing, where Lord Elgin had the Old Summer Palace looted and burned. The Conventions of Peking of October 1860 opened more ports, legalised the opium trade, allowed Christian missions, ceded Kowloon to Britain and, in a separate treaty, confirmed Russia’s annexation of the lands north of the Amur and east of the Ussuri.
: Ett krig som Storbritannien och Frankrike förde mot Qingriket, även kallat Arrowkriget. Storbritannien ville revidera fördragen från första opiumkriget för att öppna hela Kina för handel, legalisera opium och placera en ambassadör i Peking. Beslagtagandet av den kinesiskägda, Hongkongregistrerade lorchan Arrow i Kanton (Guangzhou) i oktober 1856 gav en förevändning, och Frankrike anslöt sig efter avrättningen av en fransk missionär i Guangxi. De allierade intog Kanton i slutet av 1857 och fästena vid Dagu (Taku) i maj 1858 och påtvingade Kina fördragen i Tianjin. När Qing 1859 slog tillbaka deras sändebud vid Dagu återvände en brittisk-fransk armé på omkring 18 000 man 1860, besegrade den mongoliske generalen Senggelinqin vid Baliqiao och ockuperade Peking, där lord Elgin lät plundra och bränna det gamla sommarpalatset. Pekingkonventionerna i oktober 1860 öppnade fler hamnar, legaliserade opiumhandeln, tillät kristen mission, avträdde Kowloon till Storbritannien och bekräftade, i ett separat fördrag, Rysslands annektering av landen norr om Amur och öster om Ussuri.
