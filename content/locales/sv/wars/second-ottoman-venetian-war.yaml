Second Ottoman–Venetian War: Andra osmansk-venetianska kriget
A war between the Republic of Venice and the Ottoman Empire of Bayezid II, fought at sea off western Greece and in the Venetian outposts of the Morea and Albania. The Ottoman fleet beat the Venetians at Zonchio in 1499 and took Lepanto, Modon, Coron and Durazzo, while Venice, with Spanish help, won Kefalonia; the peace of 1502–1503 confirmed the Ottoman conquests and showed that the sultan was now a naval power.: Ett krig mellan Republiken Venedig och Bayezid II:s Osmanska rike, utkämpat till sjöss utanför västra Grekland och i Venedigs utposter på Morea och i Albanien. Den osmanska flottan slog venetianarna vid Zonchio 1499 och intog Lepanto, Modon, Coron och Durazzo, medan Venedig med spansk hjälp erövrade Kefalonia; freden 1502–1503 bekräftade de osmanska erövringarna och visade att sultanen nu var en sjömakt.
