12–25 August 1499: 12–25 augusti 1499
Fought over several days off Navarino and Sapienza. The Venetians failed to stop the Ottoman fleet, and two of their great ships were lost.: Utkämpades under flera dagar utanför Navarino och Sapienza. Venetianarna misslyckades med att hejda den osmanska flottan och förlorade två av sina stora fartyg.
The Venetian fortress at the entrance to the Gulf of Corinth surrendered once the Ottoman fleet arrived with its siege guns.: Den venetianska fästningen vid inloppet till Korinthiska viken kapitulerade när den osmanska flottan anlände med sitt belägringsartilleri.
Davud Pasha and Kemal Reis: Davud pasha och Kemal Reis
In 1500 Bayezid II led his army against Modon, Venice’s chief port in the Morea, while Kemal Reis blockaded it from the sea and beat off a Venetian relief fleet. On 9 August the town was stormed and sacked, and many of its people were killed. Coron and Navarino surrendered soon after. Venice had lost the “two eyes of the Republic”, its stations on the route to the Levant. In December a Venetian and Spanish fleet under Benedetto Pesaro and Gonzalo Fernández de Córdoba took the castle of St George on Kefalonia.: År 1500 ledde Bayezid II sin armé mot Modon, Venedigs viktigaste hamn på Morea, medan Kemal Reis blockerade staden från sjösidan och slog tillbaka en venetiansk undsättningsflotta. Den 9 augusti stormades och plundrades staden, och många av dess invånare dödades. Coron och Navarino kapitulerade kort därefter. Venedig hade förlorat ”republikens två ögon”, sina stationer på vägen till Levanten. I december intog en venetiansk och spansk flotta under Benedetto Pesaro och Gonzalo Fernández de Córdoba S:t Georgsborgen på Kefalonia.
In 1501 Ottoman forces took Durazzo, Venice’s last important port in Albania. A French and Venetian attack on Mytilene failed, and in 1502 Pesaro took Lefkada. Venice, short of money and facing war in Italy, made peace at the end of 1502, confirmed in 1503. It kept Kefalonia but gave back Lefkada and recognised the loss of Lepanto, Modon, Coron and Durazzo. The Ottomans had shown that their fleet could defeat Venice’s.: År 1501 intog osmanska styrkor Durazzo, Venedigs sista viktiga hamn i Albanien. Ett franskt och venetianskt anfall mot Mytilene misslyckades, och 1502 intog Pesaro Lefkas. Venedig, som led brist på pengar och stod inför krig i Italien, slöt fred i slutet av 1502, bekräftad 1503. Republiken behöll Kefalonia men lämnade tillbaka Lefkas och erkände förlusten av Lepanto, Modon, Coron och Durazzo. Osmanerna hade visat att deras flotta kunde besegra Venedigs.
