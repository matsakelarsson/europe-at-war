Dates are Julian. The sources give different dates for the end of the war; the peace was agreed at the end of 1502 and confirmed in 1503.: Datum anges enligt den julianska kalendern. Källorna anger olika datum för krigets slut; freden avtalades i slutet av 1502 och bekräftades 1503.
Venetian Dalmatia was raided from Ottoman Bosnia throughout the war, and in 1501 Venice agreed to pay the king of Hungary to defend Croatia, which shielded its Dalmatian towns.: Venetianska Dalmatien utsattes för räder från osmanska Bosnien under hela kriget, och 1501 gick Venedig med på att betala kungen av Ungern för att försvara Kroatien, vilket skyddade dess dalmatiska städer.
In the summer of 1499 Bayezid II sent a great fleet, some 260 ships under the kapudan pasha Davud with the corsair captain Kemal Reis, to support the siege of Venetian Lepanto at the mouth of the Gulf of Corinth. The Venetian captain-general Antonio Grimani, with a smaller but heavier fleet, met it off Cape Zonchio near Navarino on 12 August. His captains failed to attack together, the great carrack of Andrea Loredan burned with an Ottoman ship locked to it, and in clashes over the following two weeks the Venetians could not stop the Ottoman fleet as it worked its way north along the coast.: Sommaren 1499 sände Bayezid II en stor flotta, omkring 260 fartyg under kapudan pasha Davud tillsammans med kaparkaptenen Kemal Reis, för att stödja belägringen av venetianska Lepanto vid inloppet till Korinthiska viken. Den venetianske generalkaptenen Antonio Grimani mötte den med en mindre men tyngre flotta utanför udden Zonchio nära Navarino den 12 augusti. Hans kaptener misslyckades med att anfalla samtidigt, Andrea Loredans stora karack brann upp tillsammans med ett osmanskt fartyg som var fasthakat vid den, och i sammandrabbningar under de följande två veckorna kunde venetianarna inte hejda den osmanska flottan när den arbetade sig norrut längs kusten.
With the Ottoman fleet and its guns in the Gulf of Corinth, Lepanto surrendered to the sultan’s army at the end of August. Ottoman horsemen from Bosnia raided Venetian Friuli that autumn, burning villages as far as the Tagliamento. In Venice the defeat caused uproar; Grimani was arrested, tried and exiled, though he later returned and became doge. Venetian attacks on Lepanto in the winter failed.: När den osmanska flottan och dess kanoner låg i Korinthiska viken kapitulerade Lepanto till sultanens armé i slutet av augusti. Osmanska ryttare från Bosnien gjorde samma höst räder in i venetianska Friuli och brände byar ända fram till Tagliamento. I Venedig väckte nederlaget uppståndelse; Grimani arresterades, ställdes inför rätta och landsförvisades, men han återvände senare och blev doge. Venetianska anfall mot Lepanto under vintern misslyckades.
