# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
Second Revolution: Andra revolutionen
? A short civil war in 1913 in which southern governors loyal to the Kuomintang rose against President Yuan Shikai. The Kuomintang had won the first parliamentary elections of the Republic in early 1913, and its leader Song Jiaoren, who was expected to become premier, was shot at Shanghai railway station on 20 March and died two days later; many suspected Yuan, though it was never proven. Yuan then took a large Reorganisation Loan from a consortium of foreign banks without the consent of parliament and dismissed the Kuomintang governors of Jiangxi, Guangdong and Anhui. On 12 July 1913 Li Liejun declared Jiangxi independent at Hukou, and Huang Xing in Nanjing, Anhui, Guangdong, Fujian, Shanghai, Hunan and Chongqing followed. The rising had little popular support and its armies were badly coordinated. The Beiyang army beat the rebels near Xuzhou on 22 July and repulsed attacks on the Jiangnan Arsenal in Shanghai in late July; Long Jiguang took Guangzhou on 13 August and Beiyang troops took Nanchang on 18 August. Zhang Xun’s troops stormed Nanjing on 1 September and plundered the city, and the revolt ended when Tang Jiyao’s Yunnan troops entered Chongqing on 12 September. Sun Yat-sen and Huang Xing fled to Japan. Yuan had himself elected president in October, banned the Kuomintang in November and dissolved parliament in January 1914.
: Ett kort inbördeskrig 1913 där guvernörer i södra Kina som var lojala mot Kuomintang reste sig mot president Yuan Shikai. Kuomintang hade vunnit republikens första parlamentsval i början av 1913, och partiets ledare Song Jiaoren, som väntades bli premiärminister, sköts på järnvägsstationen i Shanghai den 20 mars och dog två dagar senare; många misstänkte Yuan, men det bevisades aldrig. Yuan tog sedan ett stort reorganisationslån från ett konsortium av utländska banker utan parlamentets samtycke och avsatte Kuomintangs guvernörer i Jiangxi, Guangdong och Anhui. Den 12 juli 1913 förklarade Li Liejun Jiangxi oberoende i Hukou, och Huang Xing i Nanking, Anhui, Guangdong, Fujian, Shanghai, Hunan och Chongqing följde efter. Resningen hade litet folkligt stöd, och dess arméer var dåligt samordnade. Beiyangarmén besegrade rebellerna nära Xuzhou den 22 juli och slog tillbaka anfall mot Jiangnanarsenalen i Shanghai i slutet av juli; Long Jiguang intog Kanton den 13 augusti och Beiyangtrupper intog Nanchang den 18 augusti. Zhang Xuns trupper stormade Nanking den 1 september och plundrade staden, och revolten upphörde när Tang Jiyaos yunnantrupper tågade in i Chongqing den 12 september. Sun Yat-sen och Huang Xing flydde till Japan. Yuan lät välja sig till president i oktober, förbjöd Kuomintang i november och upplöste parlamentet i januari 1914.
