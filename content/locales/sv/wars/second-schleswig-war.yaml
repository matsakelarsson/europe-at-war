Second Schleswig War: Andra slesvigska kriget
A war in which Prussia and Austria defeated Denmark after it tried to tie Schleswig more closely to the kingdom. By the Treaty of Vienna Denmark gave up Schleswig, Holstein and Lauenburg, about two-fifths of its territory, and some 200,000 Danish speakers came under German rule.: Ett krig där Preussen och Österrike besegrade Danmark sedan landet försökt knyta Slesvig närmare till kungariket. Genom freden i Wien avstod Danmark Slesvig, Holstein och Lauenburg, omkring två femtedelar av sitt territorium, och omkring 200 000 dansktalande kom under tyskt styre.
