Known in Denmark simply as “1864” and in Germany as the German–Danish War (Deutsch-Dänischer Krieg).: Kallas i Danmark helt enkelt ”1864” och i Tyskland tysk-danska kriget (Deutsch-Dänischer Krieg).
Most places have a Danish and a German name (Dybbøl/Düppel, Als/Alsen, Danevirke/Danewerk).: De flesta orter har ett danskt och ett tyskt namn (Dybbøl/Düppel, Als/Alsen, Danevirke/Danewerk).
Frederick VII, the last king of the old line, died on 15 November 1863. Three days later his successor, Christian IX, signed a new constitution for Denmark and Schleswig together, leaving Holstein and Lauenburg outside. Danish nationalists had long wanted this, but it broke the promise of 1852 not to bind Schleswig more closely to the kingdom than Holstein. In the duchies many backed a rival heir, Frederick of Augustenburg, and German opinion was outraged.: Fredrik VII, den siste kungen av den gamla ätten, dog den 15 november 1863. Tre dagar senare undertecknade hans efterträdare Kristian IX en ny gemensam författning för Danmark och Slesvig, som lämnade Holstein och Lauenburg utanför. Danska nationalister hade länge önskat detta, men det bröt mot löftet från 1852 att inte knyta Slesvig närmare till kungariket än Holstein. I hertigdömena stödde många en rivaliserande arvtagare, Fredrik av Augustenburg, och den tyska opinionen var upprörd.
The German Confederation ordered a “federal execution” against Holstein and Lauenburg, which were its members. On 24 December Saxon and Hanoverian troops marched in, and the Danish army withdrew behind the Eider without a fight. Prussia’s chief minister, Otto von Bismarck, then went further. On 16 January 1864 Prussia and Austria gave Denmark 48 hours to withdraw the constitution in Schleswig. The Danish government refused, trusting in help from Britain or Sweden that never came.: Tyska förbundet beordrade en ”förbundsexekution” mot Holstein och Lauenburg, som var dess medlemmar. Den 24 december marscherade sachsiska och hannoveranska trupper in, och den danska armén drog sig utan strid tillbaka bakom Ejderån. Preussens ledande minister, Otto von Bismarck, gick sedan längre. Den 16 januari 1864 gav Preussen och Österrike Danmark 48 timmar att dra tillbaka författningen i Slesvig. Den danska regeringen vägrade i förlitan på hjälp från Storbritannien eller Sverige som aldrig kom.
