Danevirke: Danevirke
January 1864: Januari 1864
The Danish army, about 38,000 strong, waited behind the old earthwork, rebuilt at great cost across the neck of the peninsula.: Den danska armén, omkring 38 000 man stark, väntade bakom den gamla jordvallen, som till stora kostnader byggts upp på nytt tvärs över halvöns smalaste del.
Held by federal troops from December 1863: I förbundstruppers händer från december 1863
On 1 February 1864 Prussian and Austrian troops under the elderly Field Marshal Wrangel crossed the Eider into Schleswig. The Danes stopped a Prussian attempt to cross the Schlei at Mysunde on 2 February, and the Austrians pushed up to the Danevirke the next day. But the line was too long to hold with the troops available, the frozen marshes and inlets could be crossed, and the Prussians were preparing to cross the Schlei further east.: Den 1 februari 1864 gick preussiska och österrikiska trupper under den åldrige fältmarskalken Wrangel över Ejderån in i Slesvig. Danskarna stoppade ett preussiskt försök att gå över Schlei vid Mysunde den 2 februari, och österrikarna trängde fram till Danevirke dagen därpå. Men linjen var för lång för att kunna hållas med de tillgängliga trupperna, de frusna myrarna och vikarna gick att ta sig över, och preussarna förberedde en övergång av Schlei längre österut.
On the night of 5 February the Danish commander, General de Meza, abandoned the Danevirke and retreated north in snow and frost, leaving his heavy guns behind. The Austrians caught the rearguard at Oeversee on 6 February, but the army escaped to Dybbøl and Fredericia. The retreat saved the army but shocked the Danish public, which had been taught to see the Danevirke as the country’s shield, and de Meza was dismissed. On 18 February Prussian troops crossed into Jutland at Kolding.: Natten mellan den 5 och 6 februari övergav den danske överbefälhavaren, general de Meza, Danevirke och drog sig tillbaka norrut i snö och kyla och lämnade sitt tunga artilleri efter sig. Österrikarna hann upp eftertruppen vid Oeversee den 6 februari, men armén kom undan till Dybbøl och Fredericia. Reträtten räddade armén men chockade den danska allmänheten, som hade lärt sig att se Danevirke som landets sköld, och de Meza avskedades. Den 18 februari gick preussiska trupper in i Jylland vid Kolding.
