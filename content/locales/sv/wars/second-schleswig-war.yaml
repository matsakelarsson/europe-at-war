After Dybbøl, the Danish garrison was ordered to retreat over the Little Belt to Funen, and the fortress was left to the Austrians.: Efter Dybbøl beordrades den danska garnisonen att dra sig tillbaka över Lilla Bält till Fyn, och fästningen lämnades åt österrikarna.
