Held by Prussian and Austrian troops, April 1864: I preussiska och österrikiska truppers händer, april 1864
On 25 April a peace conference opened in London. On 9 May Danish and Austrian–Prussian squadrons fought off Heligoland, then a British island. The Austrian flagship Schwarzenberg caught fire and the allied squadron withdrew, but Denmark had to give up its blockade of the German North Sea coast. An armistice began on 12 May. In London, Britain and others proposed splitting Schleswig along a national line. The Danish government would not accept the lines on offer, and the conference broke up on 25 June.: Den 25 april öppnades en fredskonferens i London. Den 9 maj drabbade danska och österrikisk-preussiska eskadrar samman utanför Helgoland, som då var en brittisk ö. Det österrikiska flaggskeppet Schwarzenberg fattade eld och den allierade eskadern drog sig tillbaka, men Danmark måste ge upp sin blockad av den tyska Nordsjökusten. Ett vapenstillestånd inleddes den 12 maj. I London föreslog Storbritannien och andra en delning av Slesvig längs en nationell gräns. Den danska regeringen godtog inte de gränser som erbjöds, och konferensen bröts upp den 25 juni.
The fighting resumed at once. In the early hours of 29 June Prussian troops crossed the narrow sound to Als in rowing boats and took the island from its 9,000 Danish defenders, who lost nearly 3,000 men killed, wounded or captured. With Als gone and no help from abroad, the Danish islands themselves now seemed open to attack.: Striderna återupptogs omedelbart. Tidigt på morgonen den 29 juni gick preussiska trupper i roddbåtar över det smala sundet till Als och tog ön från dess 9 000 danska försvarare, som förlorade nästan 3 000 man i döda, sårade och tillfångatagna. När Als var förlorat och ingen hjälp kom utifrån tycktes nu själva de danska öarna ligga öppna för anfall.
