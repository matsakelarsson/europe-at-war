In July Prussian and Austrian troops crossed the Limfjord and occupied all of Jutland, reaching Skagen on 14 July. At Lundby on 3 July a Danish company charged a Prussian position and was shot down, in the last fight of the war. In Copenhagen the government fell, and its successor asked for peace. Preliminary terms were signed on 1 August.: I juli gick preussiska och österrikiska trupper över Limfjorden och besatte hela Jylland och nådde Skagen den 14 juli. Vid Lundby den 3 juli gjorde ett danskt kompani en stormning mot en preussisk ställning och sköts ned, i krigets sista strid. I Köpenhamn föll regeringen, och dess efterträdare bad om fred. Preliminära villkor undertecknades den 1 augusti.
By the Treaty of Vienna on 30 October 1864 the king of Denmark gave up Schleswig, Holstein and Lauenburg to the emperor of Austria and the king of Prussia jointly. Denmark lost about two-fifths of its territory, and its population fell from about 2.6 to 1.6 million. Some 200,000 Danish speakers in Schleswig came under German rule; the northern part returned to Denmark after a plebiscite in 1920. Within two years Prussia had taken the duchies for itself, after defeating Austria in the war of 1866.: Genom freden i Wien den 30 oktober 1864 avstod kungen av Danmark Slesvig, Holstein och Lauenburg till kejsaren av Österrike och kungen av Preussen gemensamt. Danmark förlorade omkring två femtedelar av sitt territorium, och dess befolkning minskade från omkring 2,6 till 1,6 miljoner. Omkring 200 000 dansktalande i Slesvig kom under tyskt styre; den norra delen återgick till Danmark efter en folkomröstning 1920. Inom två år hade Preussen tagit hertigdömena för egen räkning, sedan det besegrat Österrike i kriget 1866.
