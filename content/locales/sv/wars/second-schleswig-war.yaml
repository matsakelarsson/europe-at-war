The Danish army dug in at Dybbøl, a line of ten redoubts covering the bridge to the island of Als. The Prussians besieged it from February, and their rifled guns, firing from across the inlet at Broager, shelled the position and the town of Sønderborg day and night, the bombardment growing heavier from early April. The redoubts had too few shelters, and the defenders were worn down. In the north the Austrians and Prussians pushed into Jutland and invested the fortress of Fredericia.: Den danska armén grävde ned sig vid Dybbøl, en linje av tio skansar som täckte bron till ön Als. Preussarna belägrade ställningen från februari, och deras räfflade kanoner, som sköt från andra sidan viken vid Broager, beskjöt ställningen och staden Sønderborg dag och natt, och bombardemanget tilltog från början av april. Skansarna hade för få skyddsrum, och försvararna nöttes ned. I norr trängde österrikarna och preussarna in i Jylland och inneslöt fästningen Fredericia.
At 10 o’clock on 18 April the guns fell silent and Prussian columns stormed the redoubts. Within a quarter of an hour the forward line was taken; a counterattack by the Danish 8th Brigade bought time for the rest to escape to Als. By one count about 3,600 Danes and 1,200 Prussians were killed, wounded or missing, and thousands of Danes were taken prisoner. The government had ordered the army to hold on so that Denmark could bargain from strength at the coming peace conference. Within two weeks the Danes had evacuated Fredericia.: Klockan 10 den 18 april tystnade kanonerna och preussiska kolonner stormade skansarna. Inom en kvart var den främre linjen tagen; ett motanfall av den danska 8:e brigaden vann tid så att resten kunde fly till Als. Enligt en beräkning dödades, sårades eller försvann omkring 3 600 danskar och 1 200 preussare, och tusentals danskar togs till fånga. Regeringen hade beordrat armén att hålla ut så att Danmark kunde förhandla från en stark position vid den kommande fredskonferensen. Inom två veckor hade danskarna utrymt Fredericia.
