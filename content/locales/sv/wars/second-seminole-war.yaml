# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
Second Seminole War: Andra seminolkriget
? The longest and costliest of the wars the United States fought against Native nations, waged in Florida from 1835 to 1842. Under the Indian Removal Act of 1830 the United States demanded that the Seminoles leave Florida for Indian Territory, west of the Mississippi, citing the Treaty of Payne’s Landing (1832), which most Seminole leaders said they had never agreed to. The Seminoles and Miccosukees, with the Black Seminoles, people of African descent who lived among them as free allies and who faced enslavement if they went west, chose to fight. The war opened on 28 December 1835 with the destruction of Major Francis Dade’s column and the killing of the agent Wiley Thompson by Osceola. In a guerrilla war fought from the swamps and hammocks of the peninsula and later the Everglades, leaders such as Osceola, Micanopy, Jumper, Alligator, Abiaka (Sam Jones), Coacoochee (Wild Cat) and the Black Seminoles Abraham and John Horse held off a succession of US generals, of whom Thomas Jesup seized Osceola and other leaders under flags of truce. The war ended without a peace treaty on 14 August 1842. About 4,000 Seminoles and Black Seminoles had been removed to Indian Territory, while several hundred stayed in southern Florida; about 1,500 US soldiers died, most of them of disease, and the war cost the United States between $20 million and $40 million.
: Det längsta och dyraste av de krig som USA förde mot ursprungsamerikanska nationer, utkämpat i Florida från 1835 till 1842. Med stöd av Indian Removal Act från 1830 krävde USA att seminolerna skulle lämna Florida för Indianterritoriet, väster om Mississippi, och hänvisade till fördraget i Payne’s Landing (1832), som de flesta seminolledare sade att de aldrig hade gått med på. Seminolerna och miccosukeerna valde att strida, tillsammans med de svarta seminolerna, människor av afrikansk härkomst som levde bland dem som fria allierade och som hotades av förslavning om de flyttade västerut. Kriget inleddes den 28 december 1835 med att major Francis Dades kolonn förintades och att Osceola dödade agenten Wiley Thompson. I ett gerillakrig som fördes från halvöns träsk och trädöar och senare från Everglades höll ledare som Osceola, Micanopy, Jumper, Alligator, Abiaka (Sam Jones), Coacoochee (Wild Cat) och de svarta seminolerna Abraham och John Horse stånd mot en rad amerikanska generaler, av vilka Thomas Jesup grep Osceola och andra ledare under parlamentärflagg. Kriget slutade utan något fredsfördrag den 14 augusti 1842. Omkring 4 000 seminoler och svarta seminoler hade förflyttats till Indianterritoriet, medan flera hundra stannade i södra Florida; omkring 1 500 amerikanska soldater dog, de flesta av sjukdomar, och kriget kostade USA mellan 20 och 40 miljoner dollar.
