# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
Second Sino-Japanese War: Andra kinesisk-japanska kriget
? "The war between China and Japan from 1937 to 1945, known in China as the War of Resistance against Japan. It began with a clash at the Marco Polo Bridge near Beiping on 7 July 1937 and grew into full-scale war when fighting spread to Shanghai in August. Japan took Beiping, Tianjin, Shanghai and the Nationalist capital Nanjing in 1937, where its troops massacred prisoners and civilians, and Xuzhou, Wuhan and Guangzhou in 1938, but China did not surrender: Chiang Kai-shek’s government moved to Chongqing, Communist guerrillas spread behind the Japanese lines, and the war settled into a long stalemate. Japan ruled the occupied east through collaborationist governments, from 1940 Wang Jingwei’s in Nanjing. From December 1941 the war became part of the Second World War, with American and British aid to China. Japan’s last great offensive, Ichi-Go, overran Henan, Hunan and Guangxi in 1944, but Japan surrendered in August 1945 after the atomic bombings and the Soviet invasion of Manchuria, and its armies in China surrendered at Nanjing on 9 September. Estimates of Chinese deaths, military and civilian, range from about 14 to over 20 million, and tens of millions became refugees; Japanese military deaths in China were about 450,000–700,000."
: "Kriget mellan Kina och Japan 1937–1945, i Kina känt som motståndskriget mot Japan. Det började med en sammandrabbning vid Marco Polo-bron nära Beiping den 7 juli 1937 och växte till ett fullskaligt krig när striderna spred sig till Shanghai i augusti. Japan intog 1937 Beiping, Tianjin, Shanghai och nationalistregeringens huvudstad Nanking, där japanska trupper massakrerade fångar och civila, och 1938 Xuzhou, Wuhan och Kanton, men Kina kapitulerade inte: Chiang Kai-sheks regering flyttade till Chongqing, kommunistiska gerillor spred sig bakom de japanska linjerna, och kriget övergick i ett långt dödläge. Japan styrde det ockuperade östra Kina genom kollaboratörsregeringar, från 1940 Wang Jingweis i Nanking. Från december 1941 blev kriget en del av andra världskriget, med amerikanskt och brittiskt bistånd till Kina. Japans sista stora offensiv, Ichi-Go, överskred Henan, Hunan och Guangxi 1944, men Japan kapitulerade i augusti 1945 efter atombombningarna och den sovjetiska invasionen av Manchuriet, och dess arméer i Kina kapitulerade i Nanking den 9 september. Uppskattningarna av antalet kinesiska döda, militära och civila, varierar från omkring 14 till över 20 miljoner, och tiotals miljoner blev flyktingar; antalet japanska militära döda i Kina var omkring 450 000–700 000."
