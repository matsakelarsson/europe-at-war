# Svenska översättningar av katalogtexten (våg 12); stegtexterna kommer senare.
Second Sudanese Civil War: Andra sudanesiska inbördeskriget
? One of the longest and deadliest wars of the late 20th century, fought between the government of Sudan and the Sudan People’s Liberation Movement and Army (SPLM/SPLA), mainly in the south but also in the Nuba Mountains, Blue Nile and the east. It began in May 1983 when southern soldiers mutinied at Bor; their officers, led by John Garang, founded the SPLA in Ethiopia with the support of the Derg. Gaafar Nimeiry had just divided the self-governing Southern Region and was about to impose Islamic law. Garang called not for southern independence but for a secular, democratic “New Sudan”. Successive governments, above all the Islamist regime of Omar al-Bashir and Hassan al-Turabi after 1989, fought with the army, Arab militias and a jihad, and used hunger as a weapon; militia raids carried off women and children as slaves. The SPLA lost its Ethiopian bases in 1991 and split along ethnic lines, and Nuer and Dinka factions killed each other’s civilians. Oil, exported from 1999, financed the government’s war and drove the clearing of the oil fields. Under pressure from the United States and the regional body IGAD, the two sides signed the Comprehensive Peace Agreement in Nairobi on 9 January 2005, which gave the south autonomy and a referendum on independence. About 2 million people died, most of them from famine and disease, and some 4 million were displaced.
: Ett av de längsta och blodigaste krigen under det sena 1900-talet, utkämpat mellan Sudans regering och Sudanesiska folkets befrielserörelse och befrielsearmé (SPLM/SPLA), främst i södern men också i Nubabergen, Blå Nilen och i öster. Det började i maj 1983, när soldater från södern gjorde myteri i Bor; deras officerare, under ledning av John Garang, grundade SPLA i Etiopien med stöd av Derg. Gaafar Nimeiry hade just delat den självstyrande Södra regionen och stod i begrepp att införa islamisk lag. Garang krävde inte självständighet för södern utan ett sekulärt, demokratiskt ”Nya Sudan”. De skiftande regeringarna, framför allt Omar al-Bashirs och Hassan al-Turabis islamistiska regim efter 1989, förde kriget med armén, arabiska miliser och en jihad, och använde svält som vapen; milisernas räder förde bort kvinnor och barn som slavar. SPLA förlorade sina etiopiska baser 1991 och splittrades längs etniska linjer, och nuer- och dinkafalanger dödade varandras civila. Oljan, som exporterades från 1999, finansierade regeringens krig och drev på rensningen av oljefälten. Under påtryckningar från USA och den regionala organisationen IGAD undertecknade de två sidorna det övergripande fredsavtalet i Nairobi den 9 januari 2005, som gav södern självstyre och en folkomröstning om självständighet. Omkring 2 miljoner människor dog, de flesta av svält och sjukdomar, och omkring 4 miljoner fördrevs.
