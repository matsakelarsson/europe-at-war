Second Taiwan Strait Crisis: Andra Taiwansundskrisen
An artillery bombardment and blockade of the ROC-held islands of Kinmen (Quemoy) and Matsu by the People’s Republic of China from 23 August 1958, meant to cut them off and test the American commitment to the Republic of China on Taiwan. The United States reinforced its Seventh Fleet, escorted ROC supply convoys to the islands and sent modern weapons, among them heavy howitzers and Sidewinder air-to-air missiles, which ROC pilots used for the first time in combat on 24 September. With the blockade broken, Beijing announced a ceasefire on 6 October and on 25 October declared that it would not shell on even-numbered days, beginning two decades of alternate-day shelling that ended only in 1979. About 600 ROC soldiers and civilians were killed and some 460 PLA troops were killed or wounded.: Folkrepubliken Kinas artilleribombardemang och blockad från den 23 augusti 1958 av öarna Kinmen (Quemoy) och Matsu, som hölls av Republiken Kina, avsedda att skära av öarna och pröva USA:s åtagande gentemot Republiken Kina på Taiwan. USA förstärkte sin sjunde flotta, eskorterade Republiken Kinas underhållskonvojer till öarna och sände moderna vapen, bland dem tunga haubitsar och luft-till-luft-robotar av typen Sidewinder, som Republiken Kinas piloter använde i strid för första gången den 24 september. När blockaden var bruten tillkännagav Peking vapenvila den 6 oktober och förklarade den 25 oktober att man inte skulle skjuta på jämna datum, vilket inledde två decennier av beskjutning varannan dag som upphörde först 1979. Omkring 600 soldater och civila på Republiken Kinas sida dödades, och omkring 460 soldater ur Folkets befrielsearmé dödades eller sårades.
