The war became bound up with the Hundred Years’ War, as France backed David II and the Scots invaded England in 1346 to help Philip VI. Balliol gave up his claim to the Scottish crown to Edward III in 1356, the year of the English raid on Lothian remembered as the Burnt Candlemas. Berwick stayed in English hands.: Kriget kom att flätas samman med hundraårskriget, eftersom Frankrike stödde David II och skottarna invaderade England 1346 för att hjälpa Filip VI. Balliol överlät sina anspråk på den skotska kronan till Edvard III 1356, samma år som det engelska plundringståget i Lothian som minns som Burnt Candlemas (”den brända kyndelsmässan”). Berwick förblev i engelska händer.
