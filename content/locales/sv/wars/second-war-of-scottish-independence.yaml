Second War of Scottish Independence: Andra skotska frihetskriget
The war that followed the death of Robert I, when Edward Balliol, son of King John, and the “Disinherited” nobles invaded Scotland in 1332 with English backing and routed the regent’s army at Dupplin Moor. Edward III joined in and won at Halidon Hill in 1333, and Balliol ceded much of southern Scotland to him, but supporters of the young David II, who was sent to safety in France, won back most of the kingdom by 1341. David was captured at Neville’s Cross in 1346 and released by the Treaty of Berwick in 1357 for a ransom of 100,000 marks.: Kriget som följde på Robert I:s död, när Edvard Balliol, son till kung John, och de ”arvlösa” adelsmännen invaderade Skottland 1332 med engelskt stöd och slog regentens här på flykten vid Dupplin Moor. Edvard III gick in i kriget och segrade vid Halidon Hill 1333, och Balliol avträdde stora delar av södra Skottland till honom, men anhängare till den unge David II, som skickats i säkerhet till Frankrike, återvann större delen av riket fram till 1341. David tillfångatogs vid Neville’s Cross 1346 och frigavs genom fördraget i Berwick 1357 mot en lösensumma på 100 000 mark.
