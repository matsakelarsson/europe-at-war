Army Group North swept through the Baltic states in the summer of 1941 and reached the approaches to Leningrad in August, while the Finnish army advanced towards the city from the north. On 8 September German troops took Shlisselburg at the source of the Neva and cut Leningrad off by land. Hitler decided not to storm the city but to starve it and then raze it. The Germans shelled and bombed it almost daily, and with food stocks small, rations were cut again and again. From November 1941 to February 1942 many people received only 125 grams of bread a day, much of it sawdust and other fillers.: Armégrupp Nord drog sommaren 1941 fram genom de baltiska staterna och nådde i augusti fram till Leningrads närhet, medan den finska armén ryckte fram mot staden från norr. Den 8 september intog tyska trupper Sjlisselburg vid Nevas utlopp och skar av Leningrad landvägen. Hitler beslöt att inte storma staden utan att svälta ut den och sedan jämna den med marken. Tyskarna besköt och bombade den nästan dagligen, och eftersom livsmedelsförråden var små skars ransonerna ned gång på gång. Från november 1941 till februari 1942 fick många människor bara 125 gram bröd om dagen, till stor del sågspån och andra fyllnadsmedel.
In the hunger winter that followed, deaths peaked at about 100,000 a month in January and February 1942, and people died at home, at work and in the streets. Supplies came only across Lake Ladoga, by boat in summer and from November on the ice road known as the Road of Life. Some 1.4 million people, mainly women and children, were evacuated during the siege. In August 1942 the city’s radio orchestra performed Shostakovich’s Seventh Symphony in the besieged city. The Red Army opened a narrow land corridor along the lake shore in January 1943 and drove the Germans back on 27 January 1944, after 872 days.: Under den hungervinter som följde nådde dödstalen en topp på omkring 100 000 i månaden i januari och februari 1942, och människor dog i hemmen, på arbetet och på gatorna. Förnödenheter kom bara över Ladoga, med båt på sommaren och från november på den isväg som kallades Livets väg. Omkring 1,4 miljoner människor, främst kvinnor och barn, evakuerades under belägringen. I augusti 1942 framförde stadens radioorkester Sjostakovitjs sjunde symfoni i den belägrade staden. Röda armén öppnade en smal landkorridor längs sjöstranden i januari 1943 och drev tillbaka tyskarna den 27 januari 1944, efter 872 dagar.
