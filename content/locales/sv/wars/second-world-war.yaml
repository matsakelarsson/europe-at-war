Hitler wanted his southern flank secure before he invaded the Soviet Union. Bulgaria joined the Axis on 1 March 1941 and let German armies in, and on 25 March Yugoslavia’s regent, Prince Paul, also signed the Tripartite Pact. Two days later officers overthrew him in a coup, cheered by crowds in Belgrade, and Hitler ordered Yugoslavia destroyed. On 6 April the Luftwaffe bombed Belgrade without a declaration of war. Estimates of the dead range from about 1,500 to 17,000; many historians think 3,000–4,000 the likeliest. German, Italian and Hungarian armies attacked from all sides, Croatian units mutinied, and the army capitulated on 17 April, as the victors divided the country between them.: Hitler ville ha sin södra flank säkrad innan han invaderade Sovjetunionen. Bulgarien anslöt sig till axelmakterna den 1 mars 1941 och släppte in tyska arméer, och den 25 mars undertecknade även Jugoslaviens regent, prins Paul, trepartspakten. Två dagar senare störtades han av officerare i en kupp, under jubel från folkmassor i Belgrad, och Hitler beordrade att Jugoslavien skulle krossas. Den 6 april bombade Luftwaffe Belgrad utan krigsförklaring. Uppskattningarna av antalet döda varierar från omkring 1 500 till 17 000; många historiker anser 3 000–4 000 mest sannolikt. Tyska, italienska och ungerska arméer anföll från alla håll, kroatiska förband gjorde myteri, och armén kapitulerade den 17 april, medan segrarna delade landet mellan sig.
Greece was attacked the same day from Bulgaria. The forts of the Metaxas Line held for several days, but German armour came round through Yugoslav Macedonia and took Thessaloniki on 9 April. Some 60,000 British, Australian and New Zealand troops, sent to Greece in March, fell back with the Greeks through Vevi, Olympus and Thermopylae. The Greek army in Albania, cut off, surrendered on 20 April, two days after Prime Minister Alexandros Koryzis had killed himself. German troops entered Athens on 27 April, and the Royal Navy took some 50,000 Allied soldiers off the beaches to Crete and Egypt.: Grekland anfölls samma dag från Bulgarien. Metaxaslinjens fort höll i flera dagar, men tyska pansarstyrkor gick runt genom jugoslaviska Makedonien och intog Thessaloniki den 9 april. Omkring 60 000 brittiska, australiska och nyzeeländska soldater, som sänts till Grekland i mars, drog sig tillbaka tillsammans med grekerna via Vevi, Olympos och Thermopyle. Den grekiska armén i Albanien, som var avskuren, kapitulerade den 20 april, två dagar efter att premiärminister Alexandros Koryzis hade tagit sitt liv. Tyska trupper tågade in i Aten den 27 april, och Royal Navy hämtade omkring 50 000 allierade soldater från stränderna till Kreta och Egypten.
