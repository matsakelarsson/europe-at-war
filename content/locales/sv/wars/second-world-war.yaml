In the Independent State of Croatia, which included Bosnia and Herzegovina, Ante Pavelić’s Ustaša regime set out to rid the state of its nearly two million Serbs, and of its Jews and Roma. From late April 1941 Ustaša units massacred Serb villagers, as at Glina, many of them in its Orthodox church; others were forced to convert, expelled or sent to camps. At Jasenovac, opened in August 1941, some 77,000–99,000 people were killed by the USHMM’s estimate, about half of them Serbs; far higher and far lower figures are still argued over. In all the regime killed some 320,000–340,000 Serbs, and more than 30,000 of its Jews were murdered in its camps or at Auschwitz.: I Oberoende staten Kroatien, som omfattade Bosnien och Hercegovina, gick Ante Pavelićs ustašaregim in för att rensa staten från dess nästan två miljoner serber, och från dess judar och romer. Från slutet av april 1941 massakrerade ustašaförband serbiska bybor, som i Glina, många av dem i dess ortodoxa kyrka; andra tvingades konvertera, fördrevs eller sändes till läger. I Jasenovac, som öppnades i augusti 1941, dödades enligt USHMM:s uppskattning omkring 77 000–99 000 människor, ungefär hälften av dem serber; långt högre och långt lägre siffror är fortfarande föremål för strid. Sammanlagt dödade regimen omkring 320 000–340 000 serber, och mer än 30 000 av dess judar mördades i dess läger eller i Auschwitz.
Resistance grew in the summer. In Serbia Colonel Draža Mihailović’s royalist Chetniks gathered on Ravna Gora, and after Germany invaded the Soviet Union the Communist Party under Josip Broz Tito called for a rising. Serbs in Bosnia and Croatia rose against the Ustaše, and Montenegro rose against the Italians on 13 July. Partisans and Chetniks together freed much of western Serbia, with its centre at Užice. The Germans answered with a rule of 100 hostages shot for every German soldier killed and 50 for every one wounded, and in October they shot about 2,000 people at Kraljevo and some 2,800 at Kragujevac, among them schoolboys.: Motståndet växte under sommaren. I Serbien samlades överste Draža Mihailovićs rojalistiska tjetniker på Ravna Gora, och efter att Tyskland invaderat Sovjetunionen uppmanade kommunistpartiet under Josip Broz Tito till uppror. Serber i Bosnien och Kroatien reste sig mot ustašan, och Montenegro reste sig mot italienarna den 13 juli. Partisaner och tjetniker befriade tillsammans stora delar av västra Serbien, med centrum i Užice. Tyskarna svarade med en regel om att 100 gisslan skulle skjutas för varje dödad tysk soldat och 50 för varje sårad, och i oktober sköt de omkring 2 000 människor i Kraljevo och omkring 2 800 i Kragujevac, bland dem skolpojkar.
Mihailović feared the cost of reprisals and distrusted the communists, and in November the two movements turned on each other. A German offensive then retook Užice and drove the Partisans into Bosnia and Montenegro. Most of the Jewish men of Serbia had been shot as hostages that autumn; in the spring of 1942 the women and children held at the Sajmište camp in Belgrade were murdered in a gas van. Chetnik units, some of them working with the Italians, massacred Muslims and Croats in eastern Bosnia and the Sandžak, as at Foča, and killed tens of thousands by the end of the war.: Mihailović fruktade priset av repressalierna och misstrodde kommunisterna, och i november vände sig de två rörelserna mot varandra. En tysk offensiv återtog därefter Užice och drev partisanerna in i Bosnien och Montenegro. De flesta judiska män i Serbien hade skjutits som gisslan den hösten; våren 1942 mördades de kvinnor och barn som hölls i lägret Sajmište i Belgrad i en gasbil. Tjetnikförband, en del av dem i samarbete med italienarna, massakrerade muslimer och kroater i östra Bosnien och Sandžak, som i Foča, och dödade tiotusentals fram till krigsslutet.
