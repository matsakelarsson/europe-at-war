By the spring of 1945 the Red Army stood on the Oder and the Neisse, about 70 km from Berlin, while the Western Allies were advancing across western Germany. On 16 April Georgy Zhukov’s 1st Belorussian Front attacked across the Oder at the Seelow Heights, and Ivan Konev’s 1st Ukrainian Front across the Neisse further south. The heights cost Zhukov days and heavy losses, but by 25 April the two fronts had encircled Berlin, and on the same day Soviet and American soldiers met on the Elbe near Torgau, cutting Germany in two. In the city the remnants of the army and the SS, old men of the Volkssturm militia and boys of the Hitler Youth fought on street by street.: Våren 1945 stod Röda armén vid Oder och Neisse, omkring 70 km från Berlin, medan de västallierade ryckte fram genom västra Tyskland. Den 16 april anföll Georgij Zjukovs 1:a belarusiska front över Oder vid Seelowhöjderna, och Ivan Konevs 1:a ukrainska front över Neisse längre söderut. Höjderna kostade Zjukov flera dagar och svåra förluster, men den 25 april hade de två fronterna inringat Berlin, och samma dag möttes sovjetiska och amerikanska soldater vid Elbe nära Torgau och skar Tyskland i två delar. I staden fortsatte resterna av armén och SS, gamla män ur Volkssturmmilisen och pojkar ur Hitlerjugend att strida gata för gata.
Hitler killed himself in his bunker on 30 April, as Soviet soldiers stormed the Reichstag, and the Berlin garrison surrendered on 2 May. Germany’s armed forces surrendered unconditionally at Reims on 7 May and again, at Soviet insistence, in Berlin-Karlshorst late on 8 May, when it was already 9 May in Moscow. The battle had cost some 80,000 Soviet soldiers their lives, and tens of thousands of German civilians died. Soviet troops raped very large numbers of women in Berlin and across eastern Germany. The Soviet Union had lost about 27 million people in the war, more than any other country.: Hitler tog sitt liv i sin bunker den 30 april, medan sovjetiska soldater stormade riksdagshuset, och Berlingarnisonen kapitulerade den 2 maj. Tysklands väpnade styrkor kapitulerade villkorslöst i Reims den 7 maj och på nytt, på sovjetisk begäran, i Berlin-Karlshorst sent den 8 maj, då det redan var den 9 maj i Moskva. Slaget hade kostat omkring 80 000 sovjetiska soldater livet, och tiotusentals tyska civila dog. Sovjetiska soldater våldtog mycket stora antal kvinnor i Berlin och i hela östra Tyskland. Sovjetunionen hade förlorat omkring 27 miljoner människor i kriget, fler än något annat land.
