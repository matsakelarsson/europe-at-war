On 16 December 1944 Germany launched its last great offensive in the west, through the thinly held Ardennes, aiming to split the Allied armies and retake Antwerp. Fog and low cloud grounded Allied aircraft, and three German armies broke through the American lines. On 17 December men of the SS battle group Peiper shot 84 captured American soldiers at Baugnez near Malmedy, and the group killed Belgian civilians around Stavelot. American troops held the northern shoulder at Elsenborn and delayed the Germans at St. Vith, which fell on 21 December.: Den 16 december 1944 inledde Tyskland sin sista stora offensiv i väster, genom de glest bemannade Ardennerna, med målet att splittra de allierade arméerna och återta Antwerpen. Dimma och lågt molntäcke höll de allierade flygplanen på marken, och tre tyska arméer bröt igenom de amerikanska linjerna. Den 17 december sköt män ur SS-stridsgruppen Peiper 84 tillfångatagna amerikanska soldater vid Baugnez nära Malmedy, och gruppen dödade belgiska civila runt Stavelot. Amerikanska trupper höll den norra flanken vid Elsenborn och fördröjde tyskarna vid St. Vith, som föll den 21 december.
Surrounded at Bastogne from 20 December, the US 101st Airborne Division and other units refused to surrender. The skies cleared on 23 December, letting Allied aircraft attack the German columns and drop supplies, and on 24 December the US 2nd Armored Division stopped the German spearhead near Celles, a few kilometres short of the Meuse at Dinant. Patton’s Third Army turned north and broke through to Bastogne on 26 December. The Allies then pushed the bulge back, and by 25 January the line had been restored. Each side lost some 80,000 men or more, killed, wounded or captured.: Den amerikanska 101:a luftlandsättningsdivisionen och andra förband, inringade vid Bastogne från den 20 december, vägrade att kapitulera. Himlen klarnade den 23 december, vilket lät allierade flygplan anfalla de tyska kolonnerna och släppa ned förnödenheter, och den 24 december stoppade den amerikanska 2:a pansardivisionen den tyska anfallsspetsen nära Celles, några kilometer från Maas vid Dinant. Pattons tredje armé vände norrut och bröt igenom till Bastogne den 26 december. De allierade tryckte sedan tillbaka utbuktningen, och den 25 januari hade linjen återställts. Vardera sidan förlorade omkring 80 000 man eller fler i döda, sårade eller tillfångatagna.
