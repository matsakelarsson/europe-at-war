On 6 June 1944, D-Day, the Western Allies landed in Normandy in the largest seaborne invasion in history. After airborne landings in the night, nearly 160,000 American, British and Canadian troops, with Free French and other Allied contingents, came ashore on five beaches, codenamed Utah, Omaha, Gold, Juno and Sword. At Omaha the Americans were pinned down under heavy fire before they forced their way inland. Allied casualties on the day were at least 10,000, with some 4,400 dead. By 12 June the beachheads had been joined into a single front.: Den 6 juni 1944, dagen D, landsteg de västallierade i Normandie i historiens största invasion från havet. Efter luftlandsättningar under natten gick nästan 160 000 amerikanska, brittiska och kanadensiska soldater, tillsammans med fria franska och andra allierade förband, i land på fem stränder med kodnamnen Utah, Omaha, Gold, Juno och Sword. Vid Omaha låg amerikanerna fastnaglade under kraftig eld innan de tog sig fram mot inlandet. De allierades förluster den dagen uppgick till minst 10 000, varav omkring 4 400 döda. Den 12 juni hade brohuvudena förenats till en sammanhängande front.
The fighting in the bocage, small fields walled by thick hedges, was slow and costly. The Americans took Cherbourg at the end of June, but its port had been wrecked, while the British and Canadians fought for Caen until July. Operation Cobra broke the German line west of Saint-Lô on 25 July, and Patton’s Third Army raced south through Avranches. A German counter-attack at Mortain failed, and in August the Allies closed a pocket near Falaise. When Polish and American troops met at Chambois on 19 August, some 50,000 Germans were trapped, though perhaps 20,000–50,000 had escaped.: Striderna i bocagen, små fält omgärdade av täta häckar, gick långsamt och var kostsamma. Amerikanerna intog Cherbourg i slutet av juni, men hamnen hade förstörts, medan britterna och kanadensarna stred om Caen fram till juli. Operation Cobra bröt den tyska linjen väster om Saint-Lô den 25 juli, och Pattons tredje armé ryckte snabbt söderut genom Avranches. En tysk motattack vid Mortain misslyckades, och i augusti slöt de allierade en ficka nära Falaise. När polska och amerikanska trupper möttes vid Chambois den 19 augusti var omkring 50 000 tyskar instängda, även om kanske 20 000–50 000 hade tagit sig undan.
The campaign cost the Allies about 226,000 casualties, and German losses were as heavy. Between about 13,600 and 19,900 French civilians were killed, many by Allied bombing and shelling of towns such as Caen and Saint-Lô, which were largely destroyed. In the first days soldiers of the 12th SS Panzer Division murdered Canadian prisoners near Caen, among them at the Ardenne Abbey; about one in seven of the Canadians killed between 6 and 11 June died after they had surrendered.: Fälttåget kostade de allierade omkring 226 000 man i förluster, och de tyska förlusterna var lika stora. Mellan omkring 13 600 och 19 900 franska civila dödades, många av allierade bombningar och beskjutning av städer som Caen och Saint-Lô, som till största delen förstördes. Under de första dagarna mördade soldater ur 12:e SS-pansardivisionen kanadensiska fångar nära Caen, bland annat vid Ardenneklostret; ungefär var sjunde av de kanadensare som dödades mellan 6 och 11 juni dog efter att ha kapitulerat.
