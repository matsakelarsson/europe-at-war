The Soviet Union was Germany’s partner under the Molotov–Ribbentrop Pact from August 1939 until Germany invaded it on 22 June 1941, and then fought on the Allied side.: Sovjetunionen var Tysklands partner enligt Molotov–Ribbentrop-pakten från augusti 1939 tills Tyskland invaderade landet den 22 juni 1941, och stred därefter på de allierades sida.
Numbers of dead are estimates, and the sources give ranges for most of them. Places in present-day Poland are named in their Polish forms, with German names of the time where useful.: Antalet döda är uppskattningar, och källorna anger intervall för de flesta av dem. Orter i dagens Polen anges med sina polska namnformer, med dåtidens tyska namn där det är till hjälp.
"The map shows the annexations recognised in practice at the time: Germany’s in Poland and the General Government, Alsace-Moselle, Luxembourg and Eupen-Malmedy; the German and Romanian occupation of the Soviet Union at six dates between July 1941 and December 1944; the partition of Yugoslavia from April 1941, region by region until its liberation in 1944–45; and the Bulgarian annexation of eastern Macedonia and Western Thrace. Other occupations are drawn as approximate areas in the steps: Denmark, Norway, the Low Countries and France, the German, Italian and Bulgarian zones in Greece, Italy after September 1943, Hungary in 1944, Partisan territory and the fronts.": "Kartan visar de annexioner som i praktiken erkändes vid tiden: Tysklands i Polen och Generalguvernementet, Elsass-Mosel, Luxemburg och Eupen-Malmedy; den tyska och rumänska ockupationen av Sovjetunionen vid sex tidpunkter mellan juli 1941 och december 1944; delningen av Jugoslavien från april 1941, region för region fram till befrielsen 1944–45; och den bulgariska annekteringen av östra Makedonien och västra Thrakien. Andra ockupationer ritas som ungefärliga områden i stegen: Danmark, Norge, Beneluxländerna och Frankrike, de tyska, italienska och bulgariska zonerna i Grekland, Italien efter september 1943, Ungern 1944, partisanområden och fronterna."
Places in the former Yugoslavia are named in their present forms, with Italian, German or Hungarian names of the time where useful; Albanian places are named in Albanian, with Greek names where the Greek army used them.: Orter i före detta Jugoslavien anges med sina nuvarande namn, med dåtidens italienska, tyska eller ungerska namn där det är till hjälp; albanska orter anges på albanska, med grekiska namn där den grekiska armén använde dem.
The numbers of people killed in the Ustaša camps, by the Chetniks, in German and Bulgarian reprisals and after the surrender at Bleiburg are disputed, sometimes bitterly, between the countries of the former Yugoslavia and between historians. The figures given here are those of the United States Holocaust Memorial Museum where it gives them, or the range given by the sources listed, and are approximate.: Antalet dödade i ustašalägren, av tjetnikerna, i tyska och bulgariska repressalier och efter kapitulationen vid Bleiburg är omstritt, ibland mycket bittert, mellan länderna i före detta Jugoslavien och mellan historiker. Siffrorna som anges här är United States Holocaust Memorial Museums där sådana finns, annars det intervall som de angivna källorna ger, och de är ungefärliga.
