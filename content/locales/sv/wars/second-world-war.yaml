Second World War: Andra världskriget
The deadliest war in history, fought between the Axis powers led by Germany, Italy and Japan and the Allies, among them Britain, the Soviet Union, the United States and China. In Europe it began with the German invasion of Poland on 1 September 1939 and ended with Germany’s surrender in May 1945; it brought the Holocaust, the murder of some six million Jews, and left Europe divided. In the west Germany overran the Low Countries and France in 1940, while Britain held out; the Western Allies returned through Italy in 1943 and Normandy in 1944.: Historiens dödligaste krig, utkämpat mellan axelmakterna under ledning av Tyskland, Italien och Japan och de allierade, bland dem Storbritannien, Sovjetunionen, USA och Kina. I Europa började det med den tyska invasionen av Polen den 1 september 1939 och slutade med Tysklands kapitulation i maj 1945; det förde med sig Förintelsen, mordet på omkring sex miljoner judar, och lämnade Europa delat. I väster överskred Tyskland Beneluxländerna och Frankrike 1940, medan Storbritannien höll stånd; de västallierade återvände genom Italien 1943 och Normandie 1944.
