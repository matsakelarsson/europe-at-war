Early on 9 April 1940 Germany invaded Denmark and Norway, to secure the shipping route for Swedish iron ore and bases on the North Atlantic before Britain could. German troops crossed the Danish border at 04:15 and landed in Copenhagen, and paratroopers took the airfields at Aalborg. After brief fighting the Danish government accepted the occupation within hours. In Norway, landings from sea and air took Bergen, Trondheim and Narvik, but in the Oslofjord the guns and torpedoes of Oscarsborg fortress sank the cruiser Blücher, delaying the capture of Oslo long enough for the king and government to escape.: Tidigt den 9 april 1940 invaderade Tyskland Danmark och Norge för att säkra sjövägen för svensk järnmalm och baser vid Nordatlanten innan Storbritannien hann göra det. Tyska trupper gick över den danska gränsen klockan 04.15 och landsteg i Köpenhamn, och fallskärmsjägare intog flygfälten vid Ålborg. Efter korta strider accepterade den danska regeringen ockupationen inom några timmar. I Norge intog landstigningar från sjön och luften Bergen, Trondheim och Narvik, men i Oslofjorden sänkte Oscarsborgs fästnings kanoner och torpeder kryssaren Blücher, vilket fördröjde intagandet av Oslo tillräckligt länge för att kungen och regeringen skulle hinna fly.
King Haakon VII refused German demands to appoint the Norwegian fascist leader Vidkun Quisling as prime minister, and Norway fought on. British, French and Polish troops landed in central Norway but were evacuated by early May; in the north some 38,000 landed near Narvik. The Royal Navy sank ten German destroyers there on 10 and 13 April, and Allied and Norwegian troops retook the town on 28 May. By then Germany had invaded France, and the Allies withdrew. The king left Tromsø for Britain on 7 June, and the Norwegian forces capitulated on 10 June, after 62 days.: Kung Haakon VII vägrade gå med på de tyska kraven att utse den norske fascistledaren Vidkun Quisling till statsminister, och Norge fortsatte att strida. Brittiska, franska och polska trupper landsteg i Mellannorge men evakuerades i början av maj; i norr landsteg omkring 38 000 man nära Narvik. Royal Navy sänkte tio tyska jagare där den 10 och 13 april, och allierade och norska trupper återtog staden den 28 maj. Då hade Tyskland invaderat Frankrike, och de allierade drog sig tillbaka. Kungen lämnade Tromsø för Storbritannien den 7 juni, och de norska styrkorna kapitulerade den 10 juni, efter 62 dagar.
