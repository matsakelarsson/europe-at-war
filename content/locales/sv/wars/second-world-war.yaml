Romania had sent its armies against the Soviet Union in 1941, and two of them were shattered at Stalingrad. Under Marshal Ion Antonescu, Romanian forces and officials also murdered Jews on a vast scale, in the Iași pogrom of June 1941 and in Bessarabia, Bukovina and Transnistria; most estimates of the dead range from 250,000 to 380,000. When the Soviet offensive broke through near Iași in August 1944, King Michael had Antonescu arrested on 23 August and took Romania over to the Allies. German aircraft bombed Bucharest in reply, Romania declared war on Germany, and the Red Army reached the Ploiești oilfields on 30 August and Bucharest the next day.: Rumänien hade sänt sina arméer mot Sovjetunionen 1941, och två av dem krossades vid Stalingrad. Under marskalk Ion Antonescu mördade rumänska styrkor och ämbetsmän också judar i enorm skala, i pogromen i Iași i juni 1941 och i Bessarabien, Bukovina och Transnistrien; de flesta uppskattningar av antalet döda ligger mellan 250 000 och 380 000. När den sovjetiska offensiven bröt igenom nära Iași i augusti 1944 lät kung Mihai arrestera Antonescu den 23 augusti och förde över Rumänien till de allierade. Tyska flygplan bombade Bukarest som svar, Rumänien förklarade Tyskland krig, och Röda armén nådde oljefälten vid Ploiești den 30 augusti och Bukarest dagen därpå.
Bulgaria had joined the Axis but never declared war on the Soviet Union, and its army occupied parts of Yugoslavia and Greece rather than fighting in the east. After protests by members of parliament and church leaders in 1943 it did not hand over its own 48,000 Jews, but it deported more than 11,000 from the occupied lands to be murdered at Treblinka. On 5 September 1944 the Soviet Union declared war on Bulgaria, and Soviet troops crossed the border three days later without meeting resistance. On 9 September the communist-led Fatherland Front seized power in Sofia, Bulgaria changed sides, and its army fought on against the Germans in Yugoslavia and Hungary.: Bulgarien hade anslutit sig till axelmakterna men aldrig förklarat Sovjetunionen krig, och dess armé ockuperade delar av Jugoslavien och Grekland i stället för att strida i öster. Efter protester från parlamentsledamöter och kyrkliga ledare 1943 lämnade landet inte ut sina egna 48 000 judar, men det deporterade mer än 11 000 från de ockuperade områdena för att mördas i Treblinka. Den 5 september 1944 förklarade Sovjetunionen Bulgarien krig, och sovjetiska trupper gick över gränsen tre dagar senare utan att möta motstånd. Den 9 september tog den kommunistledda Fosterländska fronten makten i Sofia, Bulgarien bytte sida, och dess armé fortsatte att strida mot tyskarna i Jugoslavien och Ungern.
With Romania’s turn the German front in the Balkans fell apart. Romanian and Soviet troops pushed into northern Transylvania, held by Hungary since 1940, fought for a month around Turda and took Cluj on 11 October. On the plains of eastern Hungary a great tank battle around Debrecen in October slowed the Soviet advance but did not stop it. In both Romania and Bulgaria Soviet occupation opened the way to communist rule.: När Rumänien bytte sida föll den tyska fronten på Balkan samman. Rumänska och sovjetiska trupper trängde in i norra Transsylvanien, som Ungern hade hållit sedan 1940, stred i en månad kring Turda och intog Cluj den 11 oktober. På slätterna i östra Ungern bromsade ett stort pansarslag kring Debrecen i oktober den sovjetiska framryckningen men stoppade den inte. I både Rumänien och Bulgarien öppnade den sovjetiska ockupationen vägen för kommunistiskt styre.
