Kleeberg’s group, formed from units still fighting in the east, fought the last battle of the campaign and surrendered on 6 October.: Kleebergs grupp, bildad av förband som fortfarande stred i öster, utkämpade fälttågets sista slag och kapitulerade den 6 oktober.
