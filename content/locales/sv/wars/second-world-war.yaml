Crete was held by about 42,000 British, Australian, New Zealand and Greek troops under the New Zealander Bernard Freyberg, many of them men evacuated from the mainland without their heavy weapons. On 20 May 1941 Germany launched the first invasion in history carried out mainly from the air. Paratroopers and glider troops landed around Maleme, Chania, Rethymno and Heraklion and were killed in their hundreds, but on the first night the New Zealand defenders withdrew from Hill 107 above Maleme airfield, and transport aircraft began to fly in mountain troops.: Kreta försvarades av omkring 42 000 brittiska, australiska, nyzeeländska och grekiska soldater under nyzeeländaren Bernard Freyberg, många av dem män som evakuerats från fastlandet utan sina tunga vapen. Den 20 maj 1941 inledde Tyskland historiens första invasion som huvudsakligen genomfördes från luften. Fallskärmsjägare och glidflygburna trupper landade kring Maleme, Chania, Rethymno och Heraklion och dödades i hundratal, men den första natten drog sig de nyzeeländska försvararna tillbaka från höjd 107 ovanför Malemes flygfält, och transportflygplan började flyga in bergsjägare.
The Royal Navy broke up the German seaborne convoys but lost three cruisers and six destroyers to German aircraft. From 28 May the Allies retreated over the mountains to Sfakia on the south coast, and more than 16,000 men were taken off by sea; some 12,000 Commonwealth and 5,000 Greek soldiers were captured. Cretan civilians had fought the invaders with whatever weapons they had, and the Germans answered with reprisals, shooting men at Kondomari on 2 June and razing the village of Kandanos the next day. German losses were so heavy that Hitler never again ordered a large airborne operation.: Royal Navy splittrade de tyska sjöburna konvojerna men förlorade tre kryssare och sex jagare genom tyska flyganfall. Från den 28 maj retirerade de allierade över bergen till Sfakia på sydkusten, och mer än 16 000 man fördes bort sjövägen; omkring 12 000 soldater från samväldet och 5 000 grekiska soldater tillfångatogs. Kretensiska civila hade kämpat mot inkräktarna med vilka vapen de än hade, och tyskarna svarade med repressalier, sköt män i Kondomari den 2 juni och jämnade byn Kandanos med marken dagen därpå. De tyska förlusterna var så svåra att Hitler aldrig mer beordrade någon stor luftlandsättningsoperation.
