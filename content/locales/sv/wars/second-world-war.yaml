German armour reached the outskirts of Warsaw on 8 September, but the city’s defenders beat off the first attacks. The next day General Tadeusz Kutrzeba, whose Poznań and Pomorze armies had been bypassed in the west, struck south across the Bzura into the flank of the German 8th Army. It became the largest battle of the campaign. After early success the Poles were surrounded and pounded from the air, and by 19 September the pocket had collapsed, though some units broke through the Kampinos Forest to Warsaw.: Tyska pansarstyrkor nådde Warszawas utkanter den 8 september, men stadens försvarare slog tillbaka de första anfallen. Dagen därpå anföll general Tadeusz Kutrzeba, vars arméer Poznań och Pomorze hade kringgåtts i väster, söderut över Bzura mot den tyska 8:e arméns flank. Det blev fälttågets största slag. Efter inledande framgångar omringades polackerna och bombades från luften, och den 19 september hade fickan fallit samman, även om vissa förband bröt sig igenom Kampinosskogen till Warszawa.
Warsaw, defended by soldiers and civilians alike, was shelled and bombed for three weeks. About 18,000 civilians died before the city surrendered on 28 September, its water and power cut. The fortress of Modlin held out until 29 September and the Hel peninsula until 2 October. By then the Polish government and high command had left the country.: Warszawa, som försvarades av både soldater och civila, beskjöts och bombades i tre veckor. Omkring 18 000 civila dog innan staden kapitulerade den 28 september, sedan vatten och elektricitet slagits ut. Fästningen Modlin höll ut till den 29 september och Helhalvön till den 2 oktober. Då hade den polska regeringen och överkommandot lämnat landet.
