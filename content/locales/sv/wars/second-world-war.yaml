In the summer of 1942 Germany struck south-east instead of at Moscow, aiming for the oil of the Caucasus. The offensive began on 28 June, after a Soviet attack near Kharkiv had been crushed in May. German armies, with Romanian, Italian and Hungarian armies guarding their long northern flank on the Don, took Rostov on 23 July and pushed into the Caucasus, where they took the wrecked oilfields at Maykop and raised their flag on Mount Elbrus, but were stopped short of Grozny. Further north the 6th Army reached the Volga at Stalingrad on 23 August, the day a massive air raid reduced much of the city to rubble.: Sommaren 1942 slog Tyskland till mot sydöst i stället för mot Moskva, med Kaukasus olja som mål. Offensiven inleddes den 28 juni, sedan ett sovjetiskt anfall nära Charkiv hade krossats i maj. Tyska arméer, med rumänska, italienska och ungerska arméer som skydd för den långa norra flanken vid Don, intog Rostov den 23 juli och trängde in i Kaukasus, där de intog de förstörda oljefälten vid Majkop och hissade sin flagga på Elbrus, men hejdades före Groznyj. Längre norrut nådde 6:e armén Volga vid Stalingrad den 23 augusti, samma dag som en massiv flygräd förvandlade stora delar av staden till grus.
In the ruins Vasily Chuikov’s 62nd Army held a narrow strip along the river, fighting for every factory, street and house, while reinforcements crossed the Volga under fire. By November the Germans held about 90 per cent of the city. On 19 November the Red Army struck the Romanian armies on either side of it in Operation Uranus, and on 23 November its pincers met near Kalach, trapping the 6th Army and other units, some 250,000–330,000 men by different counts. Hitler forbade a breakout, a relief attack failed in December, and the last troops surrendered on 2 February 1943. Of about 91,000 prisoners, only some 6,000 ever returned home.: I ruinerna höll Vasilij Tjujkovs 62:a armé en smal remsa längs floden och kämpade om varje fabrik, gata och hus, medan förstärkningar fördes över Volga under beskjutning. I november höll tyskarna omkring 90 procent av staden. Den 19 november anföll Röda armén de rumänska arméerna på ömse sidor om den i operation Uranus, och den 23 november möttes tångarmarna nära Kalatj, vilket stängde in 6:e armén och andra förband, enligt olika beräkningar omkring 250 000–330 000 man. Hitler förbjöd ett utbrytningsförsök, ett undsättningsanfall misslyckades i december, och de sista trupperna kapitulerade den 2 februari 1943. Av omkring 91 000 fångar återvände bara omkring 6 000 någonsin hem.
