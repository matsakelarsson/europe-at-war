Slovakia, a German client state under the priest Jozef Tiso, had handed some 58,000 of its Jews over to the Germans in 1942, nearly all of whom were murdered. By 1944 army officers, communists and democrats had formed an underground Slovak National Council and planned a rising for when the Red Army reached the Carpathians. Partisan attacks brought German troops into the country first, and on 29 August 1944 the council called the rising from Banská Bystrica. Some 60,000 soldiers and up to 18,000 partisans held much of central Slovakia, but the two divisions in the east that were to open the Carpathian passes to the Soviets were disarmed by the Germans.: Slovakien, en tysk lydstat under prästen Jozef Tiso, hade 1942 lämnat ut omkring 58 000 av sina judar till tyskarna, och nästan alla mördades. År 1944 hade arméofficerare, kommunister och demokrater bildat ett underjordiskt slovakiskt nationalråd och planerat ett uppror till den tidpunkt då Röda armén nådde Karpaterna. Partisananfall drog först in tyska trupper i landet, och den 29 augusti 1944 utlyste rådet upproret från Banská Bystrica. Omkring 60 000 soldater och upp till 18 000 partisaner höll stora delar av mellersta Slovakien, men de två divisioner i öster som skulle öppna Karpaterpassen för sovjeterna avväpnades av tyskarna.
The Soviet army and the 1st Czechoslovak Army Corps attacked across the Dukla Pass on 8 September to reach the insurgents, but it took them until 6 October to fight their way through, with heavy losses, and they could not break through to central Slovakia. Supplies and the 2nd Czechoslovak Parachute Brigade were flown in to the Tri Duby airfield. Reinforced German forces closed in during October, and Banská Bystrica fell on 27 October. The insurgent army dissolved into the mountains; its commanders, Generals Ján Golian and Rudolf Viest, were captured and died in German hands.: Den sovjetiska armén och 1:a tjeckoslovakiska armékåren anföll över Duklapasset den 8 september för att nå upprorsmännen, men det tog dem till den 6 oktober att kämpa sig igenom, med svåra förluster, och de kunde inte bryta igenom till mellersta Slovakien. Förnödenheter och 2:a tjeckoslovakiska fallskärmsbrigaden flögs in till flygfältet Tri Duby. Förstärkta tyska styrkor drog åt ringen under oktober, och Banská Bystrica föll den 27 oktober. Upprorsarmén löstes upp och tog sig till bergen; dess befälhavare, generalerna Ján Golian och Rudolf Viest, tillfångatogs och dog i tyska händer.
Reprisals followed. Einsatzkommando 14 and the Hlinka Guard’s emergency units shot 747 people at Kremnička, near Banská Bystrica, and killed and burned some 900 at Nemecká; many of the dead were Jews and Roma. The rising gave the Germans a pretext to deport most of Slovakia’s remaining Jews, more than 10,000 of them, to Auschwitz and other camps. In the insurgent area itself up to 1,500 people, most of them local Germans, had been killed.: Repressalier följde. Einsatzkommando 14 och Hlinkagardets insatsförband sköt 747 människor i Kremnička, nära Banská Bystrica, och dödade och brände omkring 900 i Nemecká; många av de döda var judar och romer. Upproret gav tyskarna en förevändning att deportera de flesta av Slovakiens återstående judar, mer än 10 000, till Auschwitz och andra läger. I själva upprorsområdet hade upp till 1 500 människor dödats, de flesta av dem lokala tyskar.
