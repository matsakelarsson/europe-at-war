By 1943 the Partisans held large parts of Bosnia and Croatia, and the Axis set out to destroy them. In Operation Weiss, from January to March, German, Italian and Croatian troops, with Chetnik units fighting alongside the Italians, drove Tito’s main force south-east through Bosnia. Rather than abandon some 4,000 sick and wounded, the Partisans crossed the Neretva at Jablanica on a makeshift bridge and scattered the Chetniks waiting on the far bank. In May the Axis struck again with about 127,000 men in Operation Schwarz. Surrounded on the Sutjeska, the Partisans broke out in June, losing some 7,000 killed and wounded, about a third of their force, and Tito himself was wounded.: År 1943 höll partisanerna stora delar av Bosnien och Kroatien, och axelmakterna gick in för att förinta dem. I operation Weiss, från januari till mars, drev tyska, italienska och kroatiska trupper, med tjetnikförband som stred vid italienarnas sida, Titos huvudstyrka mot sydöst genom Bosnien. Hellre än att överge omkring 4 000 sjuka och sårade gick partisanerna över Neretva vid Jablanica på en provisorisk bro och skingrade de tjetniker som väntade på andra stranden. I maj slog axelmakterna till igen med omkring 127 000 man i operation Schwarz. Omringade vid Sutjeska bröt sig partisanerna ut i juni och förlorade omkring 7 000 i döda och sårade, ungefär en tredjedel av styrkan, och Tito själv sårades.
Italy’s armistice, announced on 8 September 1943, left its armies in the Balkans and Greece without orders. The Germans disarmed most of them and sent many of the men to Germany as forced labourers. On Cephalonia the Acqui Division fought back; after it surrendered on 22 September German troops shot about 5,000 of its men, among them General Antonio Gandin. The Partisans seized Italian weapons and, for a time, much of the Dalmatian coast. Germany took over Albania, Montenegro and the Italian zone of Greece, and in November it took Leros in the Dodecanese from its British and Italian garrison.: Italiens vapenstillestånd, som tillkännagavs den 8 september 1943, lämnade dess arméer på Balkan och i Grekland utan order. Tyskarna avväpnade de flesta av dem och sände många av männen till Tyskland som tvångsarbetare. På Kefalonia gjorde divisionen Acqui motstånd; sedan den kapitulerat den 22 september sköt tyska trupper omkring 5 000 av dess soldater, bland dem general Antonio Gandin. Partisanerna beslagtog italienska vapen och tog för en tid kontroll över stora delar av den dalmatiska kusten. Tyskland tog över Albanien, Montenegro och den italienska zonen i Grekland, och i november tog Tyskland Leros i Dodekanesos från dess brittiska och italienska garnison.
On 29 November, at Jajce in Partisan-held Bosnia, the Anti-Fascist Council for the National Liberation of Yugoslavia (AVNOJ) declared itself the country’s supreme legislative and executive body, set up a provisional government under Tito, now a marshal, and barred King Peter II from returning until the people had decided. At Tehran the same week the Allied leaders agreed to support the Partisans, and Britain ended its support for Mihailović in early 1944, as his Chetniks were by then working with the Germans in many places.: Den 29 november förklarade sig Antifascistiska rådet för Jugoslaviens nationella befrielse (AVNOJ) i Jajce i det partisankontrollerade Bosnien vara landets högsta lagstiftande och verkställande organ, bildade en provisorisk regering under Tito, nu marskalk, och förbjöd kung Peter II att återvända tills folket hade fattat sitt beslut. I Teheran samma vecka enades de allierade ledarna om att stödja partisanerna, och Storbritannien upphörde med sitt stöd till Mihailović i början av 1944, eftersom hans tjetniker då på många håll samarbetade med tyskarna.
