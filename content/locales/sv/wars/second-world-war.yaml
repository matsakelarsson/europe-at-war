In February and March 1945 the Western Allies cleared the Rhineland, and French and American troops wiped out the German pocket around Colmar, freeing the last of Alsace. On 7 March American troops found the railway bridge at Remagen still standing and crossed the Rhine. Further north British, Canadian and American troops crossed at Rees and Wesel on 23–24 March, with a vast airborne landing, and the Americans encircled the Ruhr, where 317,000 Germans surrendered in mid-April. The Canadians freed the north-east of the Netherlands, while American and British columns raced towards the Elbe.: I februari och mars 1945 rensade de västallierade Rhenlandet, och franska och amerikanska trupper utplånade den tyska fickan kring Colmar och befriade de sista delarna av Elsass. Den 7 mars fann amerikanska trupper järnvägsbron vid Remagen fortfarande stående och gick över Rhen. Längre norrut gick brittiska, kanadensiska och amerikanska trupper över floden vid Rees och Wesel den 23–24 mars, med en väldig luftlandsättning, och amerikanerna inringade Ruhrområdet, där 317 000 tyskar kapitulerade i mitten av april. Kanadensarna befriade nordöstra Nederländerna, medan amerikanska och brittiska kolonner ryckte snabbt fram mot Elbe.
As they advanced, the Allies uncovered the concentration camps. British troops entering Bergen-Belsen on 15 April found thousands of unburied bodies and some 60,000 starving and sick prisoners; more than 35,000 people, Anne Frank among them, had died there in the first months of 1945, and thousands more died after liberation. American troops reached Buchenwald on 11 April and Dachau on 29 April. On 4 May the German forces in north-west Germany, the Netherlands and Denmark surrendered at Lüneburg Heath, and on 7 May General Jodl signed the surrender of all German forces at Reims.: Under framryckningen upptäckte de allierade koncentrationslägren. Brittiska trupper som kom till Bergen-Belsen den 15 april fann tusentals obegravda kroppar och omkring 60 000 svältande och sjuka fångar; mer än 35 000 människor, bland dem Anne Frank, hade dött där under de första månaderna 1945, och ytterligare tusentals dog efter befrielsen. Amerikanska trupper nådde Buchenwald den 11 april och Dachau den 29 april. Den 4 maj kapitulerade de tyska styrkorna i nordvästra Tyskland, Nederländerna och Danmark på Lüneburger Heide, och den 7 maj undertecknade general Jodl kapitulationen för samtliga tyska styrkor i Reims.
In Italy the Allies had spent the winter halted on the Gothic Line, while German troops and Fascist units fought a brutal war against the partisans; at Marzabotto in autumn 1944 the SS killed some 770 civilians. The April offensive broke into the Po valley, Bologna fell on 21 April, and partisans rose in Milan, Turin and Genoa. Partisans caught Mussolini near Lake Como as he tried to flee and shot him on 28 April; his body was hung in Milan’s Piazzale Loreto. The German surrender in Italy, signed at Caserta on 29 April, took effect on 2 May.: I Italien hade de allierade tillbringat vintern stillastående vid Gotiska linjen, medan tyska trupper och fascistiska förband förde ett brutalt krig mot partisanerna; i Marzabotto dödade SS hösten 1944 omkring 770 civila. Apriloffensiven bröt in i Podalen, Bologna föll den 21 april, och partisaner reste sig i Milano, Turin och Genua. Partisaner grep Mussolini nära Comosjön när han försökte fly och sköt honom den 28 april; hans kropp hängdes upp på Piazzale Loreto i Milano. Den tyska kapitulationen i Italien, undertecknad i Caserta den 29 april, trädde i kraft den 2 maj.
