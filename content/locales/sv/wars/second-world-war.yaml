The German command in Norway accepted the surrender, and the Norwegian resistance took over key points as the occupiers laid down their arms.: Den tyska ledningen i Norge godtog kapitulationen, och den norska motståndsrörelsen tog över viktiga punkter när ockupanterna lade ned vapnen.
