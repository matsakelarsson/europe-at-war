The Red Army’s winter offensive reached the ruins of Warsaw on 17 January 1945 and Auschwitz on 27 January, where it found about 7,000 prisoners left behind; tens of thousands more had been driven west on death marches. Breslau, declared a fortress, held out until 6 May. At Yalta in February the Allied leaders agreed that Poland’s eastern border would follow roughly the Curzon Line, leaving the Soviet Union the lands it had annexed in 1939, and that Poland would be compensated in the west.: Röda arméns vinteroffensiv nådde Warszawas ruiner den 17 januari 1945 och Auschwitz den 27 januari, där den fann omkring 7 000 fångar som lämnats kvar; ytterligare tiotusentals hade drivits västerut på dödsmarscher. Breslau, som förklarats som fästning, höll stånd till den 6 maj. I Jalta i februari kom de allierade ledarna överens om att Polens östgräns i stort sett skulle följa Curzonlinjen, så att Sovjetunionen fick behålla de områden landet hade annekterat 1939, och att Polen skulle kompenseras i väster.
At Potsdam in August the Allies placed German territory east of the Oder and the Lusatian Neisse under Polish administration, leaving the final border to a peace settlement, and gave northern East Prussia with Königsberg to the Soviet Union. They approved the transfer of the remaining Germans “in an orderly and humane manner”. Millions of Germans had already fled before the Red Army; most who stayed were expelled by 1950, many in brutal conditions, and large numbers died.: I Potsdam i augusti ställde de allierade de tyska områdena öster om Oder och Lausitzer Neisse under polsk förvaltning, i avvaktan på att den slutliga gränsen skulle fastställas i en fredsuppgörelse, och gav norra Ostpreussen med Königsberg till Sovjetunionen. De godkände förflyttningen av de kvarvarande tyskarna ”på ett ordnat och humant sätt”. Miljontals tyskar hade redan flytt undan Röda armén; de flesta som stannade fördrevs före 1950, många under brutala förhållanden, och ett stort antal dog.
In the east more than a million Poles were moved out of the lands annexed by the Soviet Union, while Ukrainians were sent from Poland to Soviet Ukraine. In 1947 Operation Vistula forcibly resettled most of the Ukrainians left in south-eastern Poland in the former German lands. Many of the new inhabitants of Wrocław, Szczecin and Gdańsk came from Lwów, Vilnius and the eastern countryside.: I öster flyttades mer än en miljon polacker ut från de områden som Sovjetunionen hade annekterat, medan ukrainare sändes från Polen till Sovjetukraina. År 1947 tvångsförflyttade Operation Wisła de flesta av de ukrainare som fanns kvar i sydöstra Polen till de tidigare tyska områdena. Många av de nya invånarna i Wrocław, Szczecin och Gdańsk kom från Lwów, Vilnius och den östra landsbygden.
