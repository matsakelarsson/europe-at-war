Before the war about 3.3 million Jews lived in Poland, the largest Jewish community in Europe. Under German rule they were forced into ghettos. In Warsaw some 400,000 people were shut into about 3.4 km², and tens of thousands died there of hunger and typhus. After Germany invaded the Soviet Union in June 1941, its mobile killing units shot Jews in hundreds of thousands across the east. In some places local people joined in, as at Jedwabne on 10 July 1941, where Polish inhabitants, working with the Germans, murdered hundreds of their Jewish neighbours.: Före kriget bodde omkring 3,3 miljoner judar i Polen, Europas största judiska befolkning. Under det tyska styret tvingades de in i getton. I Warszawa stängdes omkring 400 000 människor in på omkring 3,4 km², och tiotusentals dog där av svält och tyfus. Sedan Tyskland invaderat Sovjetunionen i juni 1941 sköt dess mobila dödspatruller judar i hundratusental över hela östern. På vissa platser deltog lokalbefolkningen, som i Jedwabne den 10 juli 1941, där polska invånare i samarbete med tyskarna mördade hundratals av sina judiska grannar.
From December 1941 Germany opened death camps to murder the Jews of Poland and of Europe. Chełmno came first, then Bełżec, Sobibór and Treblinka, and gas chambers were built at Auschwitz-Birkenau and Majdanek. Between 22 July and 21 September 1942 more than 250,000 people from the Warsaw Ghetto were taken to Treblinka and gassed. About 3 million Polish Jews, some 90 per cent, were murdered. Poles who hid Jews risked death with their families; from late 1942 the underground Council to Aid Jews, Żegota, helped thousands, while others betrayed Jews to the Germans.: Från december 1941 öppnade Tyskland förintelseläger för att mörda judarna i Polen och i Europa. Chełmno var först, därefter Bełżec, Sobibór och Treblinka, och gaskammare byggdes i Auschwitz-Birkenau och Majdanek. Mellan den 22 juli och 21 september 1942 fördes mer än 250 000 människor från Warszawas getto till Treblinka och gasades ihjäl. Omkring 3 miljoner polska judar, omkring 90 procent, mördades. Polacker som gömde judar riskerade döden tillsammans med sina familjer; från slutet av 1942 hjälpte det underjordiska Rådet för hjälp åt judar, Żegota, tusentals, medan andra angav judar för tyskarna.
When German forces entered the Warsaw Ghetto on 19 April 1943 to deport its last inhabitants, the Jewish Combat Organisation under Mordechai Anielewicz and the Jewish Military Union fought back with pistols, a few rifles and home-made bombs. It was the largest Jewish revolt of the war. SS General Jürgen Stroop’s troops burned the ghetto building by building, and on 16 May he blew up the Great Synagogue. Stroop reported 56,065 Jews killed or captured; most of those captured were sent to Treblinka, Majdanek and labour camps.: När tyska styrkor gick in i Warszawas getto den 19 april 1943 för att deportera dess sista invånare gjorde Judiska stridsorganisationen under Mordechaj Anielewicz och Judiska militärförbundet motstånd med pistoler, några gevär och hemmagjorda bomber. Det var krigets största judiska uppror. SS-generalen Jürgen Stroops trupper brände gettot byggnad för byggnad, och den 16 maj sprängde han Stora synagogan. Stroop rapporterade 56 065 judar dödade eller tillfångatagna; de flesta av de tillfångatagna sändes till Treblinka, Majdanek och arbetsläger.
