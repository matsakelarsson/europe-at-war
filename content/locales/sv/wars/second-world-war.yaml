After Stalingrad the Red Army pushed west, and the Germans gave up the Caucasus, but in March 1943 Erich von Manstein’s counter-attack retook Kharkiv and left a large Soviet salient around Kursk. Hitler launched Operation Citadel against it on 5 July, attacking its northern and southern sides with the new Tiger and Panther tanks. Warned in advance, the Soviets had built deep belts of minefields, trenches and anti-tank guns. The northern attack stalled within days. In the south German armour pushed further, and on 12 July Soviet tank armies met the SS panzer corps near Prokhorovka in one of the largest tank battles in history.: Efter Stalingrad trängde Röda armén västerut, och tyskarna gav upp Kaukasus, men i mars 1943 återtog Erich von Mansteins motanfall Charkiv och lämnade kvar en stor sovjetisk frontbåge kring Kursk. Hitler inledde operation Zitadelle mot den den 5 juli och anföll dess norra och södra sida med de nya stridsvagnarna Tiger och Panther. Sovjeterna, som varnats i förväg, hade byggt djupa bälten av minfält, skyttegravar och pansarvärnskanoner. Det norra anfallet körde fast inom några dagar. I söder trängde tyska pansarstyrkor längre fram, och den 12 juli mötte sovjetiska pansararméer SS-pansarkåren nära Prochorovka i ett av historiens största pansarslag.
In mid-July Hitler called off the offensive, partly because the Western Allies had landed in Sicily on 10 July. The Red Army had already gone over to the attack north of the salient, and it freed Oryol and Belgorod on 5 August, celebrated with the first artillery salute in Moscow, and Kharkiv on 23 August. From then on it held the initiative. Through the autumn it advanced across eastern Ukraine to the Dnieper, crossed the river and on 6 November took Kyiv. The retreating Germans burned villages and drove civilians west, and the freed lands bore the marks of two years of mass murder, hunger and deportation for forced labour.: I mitten av juli avbröt Hitler offensiven, delvis eftersom de västallierade hade landstigit på Sicilien den 10 juli. Röda armén hade redan gått till anfall norr om frontbågen, och den befriade Orjol och Belgorod den 5 augusti, vilket firades med den första artillerisaluten i Moskva, och Charkiv den 23 augusti. Därefter hade den initiativet. Under hösten ryckte den fram genom östra Ukraina till Dnepr, gick över floden och intog Kyiv den 6 november. De retirerande tyskarna brände byar och drev civila västerut, och de befriade områdena bar spåren av två år av massmord, svält och deportation till tvångsarbete.
