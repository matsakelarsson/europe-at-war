Trapped against the coast, the British, French and Belgian armies fell back on Dunkirk. On 24 May Hitler confirmed an order halting the panzers outside the town, lifted only on 26 May, and the defenders used the pause to strengthen the perimeter. King Leopold III surrendered the Belgian army on 28 May, after 18 days of fighting. Between 26 May and 4 June Operation Dynamo carried about 338,000 soldiers, some 199,000 British and 139,000 French, to England in warships, ferries and hundreds of small boats, under constant air attack. About 40,000 French troops holding the perimeter were taken prisoner.: Fångade mot kusten drog sig de brittiska, franska och belgiska arméerna tillbaka mot Dunkerque. Den 24 maj bekräftade Hitler en order som stoppade pansarstyrkorna utanför staden, och den hävdes först den 26 maj; försvararna använde pausen till att stärka försvarsringen. Kung Leopold III lät den belgiska armén kapitulera den 28 maj, efter 18 dagars strider. Mellan den 26 maj och 4 juni förde operation Dynamo omkring 338 000 soldater, omkring 199 000 brittiska och 139 000 franska, till England med örlogsfartyg, färjor och hundratals små båtar, under ständiga flyganfall. Omkring 40 000 franska soldater som höll försvarsringen togs till fånga.
Germany attacked south across the Somme and the Aisne on 5 June. Italy declared war on France and Britain on 10 June, and German troops entered Paris unopposed on 14 June. Marshal Philippe Pétain became prime minister and asked for an armistice, while in London General Charles de Gaulle broadcast an appeal on 18 June to fight on. The armistice was signed on 22 June in the railway carriage at Compiègne where Germany had signed in 1918. About 1.8 million French soldiers were prisoners, and Germany occupied the north and the Atlantic coast, some three-fifths of France.: Tyskland anföll söderut över Somme och Aisne den 5 juni. Italien förklarade Frankrike och Storbritannien krig den 10 juni, och tyska trupper tågade in i Paris utan motstånd den 14 juni. Marskalk Philippe Pétain blev premiärminister och begärde vapenstillestånd, medan general Charles de Gaulle i London den 18 juni sände ett radiovädjande om att fortsätta kampen. Vapenstilleståndet undertecknades den 22 juni i den järnvägsvagn i Compiègne där Tyskland hade undertecknat 1918. Omkring 1,8 miljoner franska soldater var krigsfångar, och Tyskland ockuperade norra Frankrike och Atlantkusten, omkring tre femtedelar av landet.
On 10 July the National Assembly, meeting at Vichy, voted full powers to Pétain by 569 votes to 80, ending the Third Republic. His “French State” governed the unoccupied south from the spa town and, in name, the whole country, while Alsace and Moselle were annexed by Germany in all but name. In Britain, de Gaulle began to build the Free French forces from the few thousand soldiers and sailors who had joined him.: Den 10 juli röstade nationalförsamlingen, samlad i Vichy, med 569 röster mot 80 för att ge Pétain oinskränkta befogenheter, vilket gjorde slut på tredje republiken. Hans ”franska stat” styrde det obesatta södra Frankrike från kurorten och, till namnet, hela landet, medan Elsass och Mosel i praktiken annekterades av Tyskland. I Storbritannien började de Gaulle bygga upp de fria franska styrkorna av de få tusen soldater och sjömän som hade anslutit sig till honom.
