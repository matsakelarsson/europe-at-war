Montgomery hoped to end the war in 1944 by outflanking the German frontier defences through the Netherlands. In Operation Market Garden, launched on 17 September, some 35,000 American, British and Polish airborne troops were landed to seize the bridges between Eindhoven and Arnhem, while the British XXX Corps drove north along a single road to join them. The Americans took most of their bridges, and the Waal bridge at Nijmegen fell on 20 September. But at Arnhem the British 1st Airborne Division had landed close to two SS panzer divisions, and only one battalion reached the Rhine bridge.: Montgomery hoppades kunna avsluta kriget 1944 genom att kringgå det tyska gränsförsvaret genom Nederländerna. I Operation Market Garden, som inleddes den 17 september, sattes omkring 35 000 amerikanska, brittiska och polska luftlandsättningssoldater in för att inta broarna mellan Eindhoven och Arnhem, medan den brittiska XXX kåren ryckte fram norrut längs en enda väg för att förena sig med dem. Amerikanerna intog de flesta av sina broar, och Waalbron vid Nijmegen föll den 20 september. Men vid Arnhem hade den brittiska 1:a luftlandsättningsdivisionen landat nära två SS-pansardivisioner, och endast en bataljon nådde bron över Rhen.
The battalion held the north end of the bridge for four days, and XXX Corps could not break through in time. On the night of 25–26 September about 2,400 survivors of the 1st Airborne were taken back across the Rhine; the division had lost nearly three-quarters of its men. Further west, Canadian and British troops cleared the Scheldt estuary between October and early November, opening Antwerp to Allied shipping. In reprisal for a resistance attack, German troops rounded up the men of Putten on 1–2 October and deported 602 of them to camps; only 48 came back.: Bataljonen höll brons norra ände i fyra dagar, och XXX kåren kunde inte bryta igenom i tid. Natten mellan den 25 och 26 september fördes omkring 2 400 överlevande från 1:a luftlandsättningsdivisionen tillbaka över Rhen; divisionen hade förlorat nästan tre fjärdedelar av sina män. Längre västerut rensade kanadensiska och brittiska trupper Scheldes mynning mellan oktober och början av november, vilket öppnade Antwerpen för allierad sjöfart. Som repressalie för ett anfall av motståndsrörelsen samlade tyska trupper ihop männen i Putten den 1–2 oktober och deporterade 602 av dem till läger; endast 48 kom tillbaka.
The north and west of the Netherlands stayed occupied. After the Dutch government in exile called a railway strike in support of the offensive, the Germans blocked food transport, and in the “hunger winter” of 1944–1945 about 20,000 people died of hunger and cold, most of them in the cities of Holland. People walked into the countryside to barter for food and ate tulip bulbs. In late April 1945, under a truce with the Germans, Allied bombers dropped food in Operation Manna, and on 5 May the German forces in the Netherlands surrendered.: Norra och västra Nederländerna förblev ockuperade. Sedan den nederländska exilregeringen hade utlyst en järnvägsstrejk till stöd för offensiven stoppade tyskarna livsmedelstransporterna, och under ”hungervintern” 1944–1945 dog omkring 20 000 människor av svält och köld, de flesta av dem i städerna i Holland. Människor vandrade ut på landsbygden för att byta till sig mat och åt tulpanlökar. I slutet av april 1945 släppte allierade bombplan, under ett stillestånd med tyskarna, ned livsmedel i Operation Manna, och den 5 maj kapitulerade de tyska styrkorna i Nederländerna.
