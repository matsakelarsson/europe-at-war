On 23 August 1939 Germany and the Soviet Union signed a non-aggression pact whose secret protocol divided eastern Europe between them, Poland included. A week later, after SS men staged a fake Polish attack on a German radio station at Gleiwitz, Germany invaded. Early on 1 September German aircraft bombed the small town of Wieluń, and the old battleship Schleswig-Holstein opened fire on the Polish depot at Westerplatte in the Free City of Danzig.: Den 23 augusti 1939 undertecknade Tyskland och Sovjetunionen en icke-angreppspakt vars hemliga tilläggsprotokoll delade Östeuropa mellan dem, Polen inräknat. En vecka senare, sedan SS-män iscensatt ett fingerat polskt anfall mot en tysk radiostation i Gleiwitz, invaderade Tyskland. Tidigt den 1 september bombade tyskt flyg den lilla staden Wieluń, och det gamla slagskeppet Schleswig-Holstein öppnade eld mot det polska förrådet på Westerplatte i Fria staden Danzig.
German and Slovak forces attacked from the west, from East Prussia in the north and from Slovakia in the south. Britain and France declared war on Germany on 3 September but gave Poland little practical help. The Polish army, spread along a long frontier and outmatched in tanks and aircraft, fought hard in places, as at Mokra, where a cavalry brigade held off a panzer division for a day. Within a week, though, German armoured columns had broken through.: Tyska och slovakiska styrkor anföll från väster, från Ostpreussen i norr och från Slovakien i söder. Storbritannien och Frankrike förklarade Tyskland krig den 3 september men gav Polen föga praktisk hjälp. Den polska armén, utspridd längs en lång gräns och underlägsen i stridsvagnar och flyg, stred hårt på sina håll, som vid Mokra, där en kavalleribrigad höll en pansardivision stången under en dag. Inom en vecka hade dock tyska pansarkolonner brutit igenom.
