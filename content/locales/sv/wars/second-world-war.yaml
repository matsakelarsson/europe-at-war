On 17 September the Red Army crossed Poland’s eastern border with between about 450,000 and more than 800,000 men, by different estimates, claiming that the Polish state had ceased to exist and that Ukrainians and Belarusians needed protection. The Polish commander-in-chief, Marshal Edward Rydz-Śmigły, ordered his troops not to fight the Soviets except in self-defence, and the government and high command crossed into Romania. Up to 120,000 Polish soldiers escaped into Romania, and others into Hungary and Lithuania, many of them later to fight on in France.: Den 17 september gick Röda armén över Polens östra gräns med mellan omkring 450 000 och mer än 800 000 man, enligt olika uppskattningar, under påstående att den polska staten hade upphört att existera och att ukrainare och belarusier behövde skydd. Den polske överbefälhavaren, marskalk Edward Rydz-Śmigły, beordrade sina trupper att inte strida mot sovjeterna annat än i självförsvar, och regeringen och överkommandot gick över gränsen till Rumänien. Upp till 120 000 polska soldater flydde till Rumänien, och andra till Ungern och Litauen, många av dem för att senare fortsätta striden i Frankrike.
Some units fought anyway. Grodno was defended for three days, and afterwards Soviet troops murdered about 300 of its defenders, including teenage boys. On 22 September Lwów, besieged first by the Germans and then by the Soviets, surrendered to the Red Army, and German and Soviet troops held a joint parade in Brest the same day. At Szack on 28 September Polish border troops beat a Soviet division. Some captured Polish officers were shot on the spot, and thousands of others were murdered at Katyn the following spring.: Vissa förband stred ändå. Grodno försvarades i tre dagar, och efteråt mördade sovjetiska trupper omkring 300 av försvararna, bland dem tonårspojkar. Den 22 september kapitulerade Lwów, som först belägrats av tyskarna och sedan av sovjeterna, till Röda armén, och tyska och sovjetiska trupper höll en gemensam parad i Brest samma dag. Vid Szack den 28 september slog polska gränstrupper en sovjetisk division. En del tillfångatagna polska officerare sköts på platsen, och tusentals andra mördades i Katyn följande vår.
