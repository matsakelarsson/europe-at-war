In October 1944 the Soviet army drove the Germans out of the far north-east of Norway and freed Kirkenes on 25 October. As they withdrew, the Germans forced thousands of people in Finnmark and northern Troms to leave and burned their homes, harbours and bridges. In Denmark the resistance stepped up sabotage of railways and factories. On 21 March 1945 British bombers destroyed the Gestapo headquarters in Copenhagen, but in the raid a school was also hit, and 87 children and 18 adults there were killed.: I oktober 1944 drev den sovjetiska armén ut tyskarna ur Norges yttersta nordost och befriade Kirkenes den 25 oktober. Under sitt tillbakadragande tvingade tyskarna tusentals människor i Finnmark och norra Troms att lämna sina hem och brände deras hus, hamnar och broar. I Danmark trappade motståndsrörelsen upp sabotaget mot järnvägar och fabriker. Den 21 mars 1945 förstörde brittiska bombplan Gestapos högkvarter i Köpenhamn, men vid anfallet träffades också en skola, och 87 barn och 18 vuxna där dödades.
On 4 May 1945 the German forces in north-west Germany, the Netherlands and Denmark surrendered to Field Marshal Montgomery at Lüneburg Heath, and those in Norway capitulated on 8 May. The large German garrison in Norway laid down its arms without fighting. King Haakon returned on 7 June, five years to the day after he had left. Bornholm was bombed by Soviet aircraft on 7–8 May; Soviet troops landed on 9 May and stayed until April 1946.: Den 4 maj 1945 kapitulerade de tyska styrkorna i nordvästra Tyskland, Nederländerna och Danmark inför fältmarskalk Montgomery på Lüneburger Heide, och styrkorna i Norge kapitulerade den 8 maj. Den stora tyska garnisonen i Norge lade ned vapnen utan strid. Kung Haakon återvände den 7 juni, på dagen fem år efter att han hade lämnat landet. Bornholm bombades av sovjetiska flygplan den 7–8 maj; sovjetiska trupper landsteg den 9 maj och stannade till april 1946.
