With France defeated, Britain under Winston Churchill, prime minister since 10 May, refused to negotiate. Hitler ordered preparations for an invasion, Operation Sea Lion, which needed control of the air over the Channel. From July the Luftwaffe attacked convoys and ports, and from 13 August the airfields and radar stations of RAF Fighter Command. The British fighters, guided by radar and a network of observers, were stretched but never broken; among their pilots were 145 Poles and 88 Czechoslovaks. After heavy German losses on 15 September, Hitler postponed the invasion indefinitely two days later.: Sedan Frankrike besegrats vägrade Storbritannien under Winston Churchill, premiärminister sedan den 10 maj, att förhandla. Hitler beordrade förberedelser för en invasion, operation Seelöwe, som krävde herravälde i luften över Engelska kanalen. Från juli anföll Luftwaffe konvojer och hamnar, och från den 13 augusti RAF Fighter Commands flygfält och radarstationer. De brittiska jaktplanen, styrda av radar och ett nätverk av observatörer, var hårt ansträngda men knäcktes aldrig; bland piloterna fanns 145 polacker och 88 tjeckoslovaker. Efter svåra tyska förluster den 15 september sköt Hitler två dagar senare upp invasionen på obestämd tid.
From 7 September the Luftwaffe turned to bombing London and then other cities, mostly at night. London was bombed on 56 of the next 57 days and nights, and a raid on Coventry on 14–15 November killed about 568 people. Liverpool, Birmingham, Clydebank, Belfast, Plymouth and other cities were hit until the last great raid on London on 10–11 May 1941, after which Germany moved its bombers east. More than 40,000 British civilians were killed, almost half of them in London. The Channel Islands, the only British soil Germany occupied, were held from 30 June 1940 until May 1945.: Från den 7 september övergick Luftwaffe till att bomba London och sedan andra städer, mestadels nattetid. London bombades under 56 av de följande 57 dygnen, och en räd mot Coventry den 14–15 november dödade omkring 568 människor. Liverpool, Birmingham, Clydebank, Belfast, Plymouth och andra städer drabbades fram till den sista stora räden mot London den 10–11 maj 1941, varefter Tyskland flyttade sina bombplan österut. Mer än 40 000 brittiska civila dödades, nästan hälften av dem i London. Kanalöarna, den enda brittiska mark som Tyskland ockuperade, hölls från den 30 juni 1940 till maj 1945.
