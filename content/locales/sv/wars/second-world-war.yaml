Warsaw surrendered on 28 September. The same day Germany and the Soviet Union signed a Boundary and Friendship Treaty that moved the line between them east from the Vistula to the Bug, while most of Lithuania passed to the Soviet sphere. The last Polish field force, General Franciszek Kleeberg’s group, fought German troops at Kock until 5 October and surrendered the next day. About 65,000 Polish soldiers had been killed, and about 420,000 captured by Germany.: Warszawa kapitulerade den 28 september. Samma dag undertecknade Tyskland och Sovjetunionen ett gräns- och vänskapsfördrag som flyttade linjen mellan dem österut från Weichsel till Bug, medan större delen av Litauen tillföll den sovjetiska intressesfären. Den sista polska fältstyrkan, general Franciszek Kleebergs grupp, stred mot tyska trupper vid Kock till den 5 oktober och kapitulerade dagen därpå. Omkring 65 000 polska soldater hade stupat och omkring 420 000 tagits till fånga av Tyskland.
Germany annexed western Poland, including Danzig, Pomerania, Greater Poland and Upper Silesia, and ruled the centre as the General Government under Hans Frank from Kraków. The Soviet Union held staged elections in the east and annexed it to Soviet Belarus and Ukraine in November, giving Vilnius to Lithuania. A Polish government-in-exile formed in France under General Władysław Sikorski, and an underground army began to organise at home.: Tyskland annekterade västra Polen, däribland Danzig, Pommern, Storpolen och Övre Schlesien, och styrde den mellersta delen som Generalguvernementet under Hans Frank från Kraków. Sovjetunionen höll iscensatta val i öster och annekterade området till Vitryska och Ukrainska SSR i november, och gav Vilnius till Litauen. En polsk exilregering bildades i Frankrike under general Władysław Sikorski, och en underjordisk armé började organiseras i hemlandet.
