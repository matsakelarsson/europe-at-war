On 22 June 1941 Germany broke its pact with the Soviet Union and invaded it with more than three million German soldiers, soon joined by Romanian, Finnish, Hungarian, Italian and Slovak troops. Stalin had dismissed many warnings, and on the first day the Luftwaffe destroyed much of the Soviet air force on the ground. German armoured groups encircled whole Soviet armies, near Białystok and Minsk in June and July, at Smolensk in July and August, and east of Kyiv in September, where more than 600,000 Soviet soldiers were killed, captured or went missing. Romanian troops retook Bessarabia and besieged Odesa until October.: Den 22 juni 1941 bröt Tyskland sin pakt med Sovjetunionen och invaderade landet med mer än tre miljoner tyska soldater, snart åtföljda av rumänska, finska, ungerska, italienska och slovakiska trupper. Stalin hade avfärdat många varningar, och den första dagen förstörde Luftwaffe en stor del av det sovjetiska flygvapnet på marken. Tyska pansargrupper omringade hela sovjetiska arméer, nära Białystok och Minsk i juni och juli, vid Smolensk i juli och augusti och öster om Kyiv i september, där mer än 600 000 sovjetiska soldater dödades, tillfångatogs eller försvann. Rumänska trupper återtog Bessarabien och belägrade Odesa fram till oktober.
Behind the front, SS Einsatzgruppen, German police battalions and local collaborators shot Jewish men, women and children by the hundreds of thousands, 33,771 of them at Babi Yar outside Kyiv on 29–30 September. Soviet prisoners of war were left to starve, and some 3.3 million of them died in German hands during the war. In October the Germans encircled more armies at Vyazma and Bryansk and pushed on towards Moscow, but autumn mud, then frost and stiffening resistance slowed them, and by early December they had stalled at the city’s outskirts. On 5 December the Red Army, reinforced with divisions from Siberia and the Far East, counter-attacked and drove them back.: Bakom fronten sköt SS-Einsatzgruppen, tyska polisbataljoner och lokala kollaboratörer judiska män, kvinnor och barn i hundratusental, 33 771 av dem i Babij Jar utanför Kyiv den 29–30 september. Sovjetiska krigsfångar lämnades att svälta, och omkring 3,3 miljoner av dem dog i tyska händer under kriget. I oktober omringade tyskarna fler arméer vid Vjazma och Brjansk och fortsatte mot Moskva, men höstleran, därefter kylan och ett hårdnande motstånd bromsade dem, och i början av december hade de kört fast i stadens utkanter. Den 5 december gick Röda armén, förstärkt med divisioner från Sibirien och Fjärran Östern, till motanfall och drev dem tillbaka.
