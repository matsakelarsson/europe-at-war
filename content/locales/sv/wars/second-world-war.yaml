On 10 May 1940 Germany invaded the neutral Netherlands, Belgium and Luxembourg. Airborne troops seized bridges and airfields ahead of the tanks, and at Eben-Emael, the Belgian fortress guarding the Albert Canal, 78 paratroopers landed by glider on its roof and put its guns out of action within a day. An attempt to capture the Dutch government at The Hague failed, and Queen Wilhelmina and her ministers left for London on 13 May. On 14 May German bombers destroyed the centre of Rotterdam, and the Dutch army surrendered that evening; Zeeland held out until 17 May.: Den 10 maj 1940 invaderade Tyskland de neutrala länderna Nederländerna, Belgien och Luxemburg. Luftburna trupper intog broar och flygfält före stridsvagnarna, och vid Eben-Emael, den belgiska fästning som bevakade Albertkanalen, landade 78 fallskärmsjägare med glidflygplan på dess tak och slog ut dess kanoner inom en dag. Ett försök att tillfångata den nederländska regeringen i Haag misslyckades, och drottning Wilhelmina och hennes ministrar reste till London den 13 maj. Den 14 maj förstörde tyska bombplan Rotterdams centrum, och den nederländska armén kapitulerade samma kväll; Zeeland höll ut till den 17 maj.
The British Expeditionary Force and the best French armies advanced into Belgium to meet what they took to be the main attack. But the main German thrust came further south, through the wooded Ardennes, which the French had thought unsuitable for tanks. Guderian’s panzer corps crossed the Meuse at Sedan on 13 May, broke through and raced west, reaching the Channel near Abbeville on 20 May. The Allied armies in Belgium were cut off from the main French forces, and a British counter-attack at Arras on 21 May could not reopen the way south.: Brittiska expeditionsstyrkan och de bästa franska arméerna ryckte in i Belgien för att möta vad de trodde var huvudanfallet. Men den tyska huvudstöten kom längre söderut, genom de skogklädda Ardennerna, som fransmännen hade ansett olämpliga för stridsvagnar. Guderians pansarkår gick över Maas vid Sedan den 13 maj, bröt igenom och skyndade västerut och nådde Engelska kanalen nära Abbeville den 20 maj. De allierade arméerna i Belgien skars av från de franska huvudstyrkorna, och ett brittiskt motanfall vid Arras den 21 maj kunde inte öppna vägen söderut igen.
