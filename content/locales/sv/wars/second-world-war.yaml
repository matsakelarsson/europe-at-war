Denmark’s government stayed in office under German occupation and cooperated to shield the population, but resistance grew. In August 1943, after strikes and sabotage, it refused German demands for martial law and the death penalty for saboteurs, and on 29 August the Germans dissolved it and took full control; the navy scuttled 32 of its ships. When the Germans prepared to deport Denmark’s Jews, a warning leaked by the German diplomat Georg Duckwitz let Danes hide them and ferry about 7,500 across the Øresund to neutral Sweden. The 464 who were caught were sent to Theresienstadt.: Danmarks regering satt kvar under den tyska ockupationen och samarbetade för att skydda befolkningen, men motståndet växte. I augusti 1943, efter strejker och sabotage, vägrade den gå med på tyska krav på undantagstillstånd och dödsstraff för sabotörer, och den 29 augusti upplöste tyskarna regeringen och tog full kontroll; flottan sänkte 32 av sina fartyg. När tyskarna förberedde deportationen av Danmarks judar läckte den tyske diplomaten Georg Duckwitz en varning, så att danskar kunde gömma dem och föra omkring 7 500 över Öresund till det neutrala Sverige. De 464 som greps sändes till Theresienstadt.
Norway was ruled by the German Reichskommissar Josef Terboven, with Quisling heading a collaborationist government from 1942, while the king and government in London kept Norway’s large merchant fleet in Allied service. The Milorg resistance grew to about 40,000 men, and in February 1943 saboteurs trained in Britain wrecked the heavy-water plant at Vemork. Reprisals were harsh. On 26 November 1942 the ship Donau took 532 Jews from Oslo to Auschwitz; at least 765 Jews from Norway were murdered.: Norge styrdes av den tyske rikskommissarien Josef Terboven, med Quisling i spetsen för en kollaborationsregering från 1942, medan kungen och regeringen i London höll Norges stora handelsflotta i de allierades tjänst. Motståndsrörelsen Milorg växte till omkring 40 000 man, och i februari 1943 förstörde sabotörer utbildade i Storbritannien tungvattenanläggningen i Vemork. Repressalierna var hårda. Den 26 november 1942 förde fartyget Donau 532 judar från Oslo till Auschwitz; minst 765 judar från Norge mördades.
