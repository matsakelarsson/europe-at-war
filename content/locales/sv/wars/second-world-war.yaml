By October 1942 General Bernard Montgomery’s Eighth Army at El Alamein had about 195,000 men and more than 1,000 tanks, against some 116,000 German and Italian troops who were short of fuel. Montgomery attacked on the night of 23 October behind a huge artillery barrage. After twelve days of fighting through deep minefields the Axis line broke on 4 November, and Rommel retreated across Libya, giving up Tripoli on 23 January 1943 and falling back into southern Tunisia.: I oktober 1942 hade general Bernard Montgomerys 8:e armé vid El Alamein omkring 195 000 man och mer än 1 000 stridsvagnar, mot omkring 116 000 tyska och italienska soldater som led brist på bränsle. Montgomery anföll natten mellan den 23 och 24 oktober bakom en väldig artillerispärreld. Efter tolv dagars strider genom djupa minfält bröts axelmakternas linje den 4 november, och Rommel retirerade genom Libyen, gav upp Tripoli den 23 januari 1943 och drog sig tillbaka till södra Tunisien.
On 8 November 1942 American and British troops landed in Vichy French Morocco and Algeria, at Casablanca, Oran and Algiers. The French fought back for up to three days before Admiral François Darlan ordered a ceasefire and brought French North Africa over to the Allies. Germany and Italy rushed troops into Tunisia and won the race for Tunis. During the six months of their occupation the Germans forced some 5,000 Tunisian Jewish men into labour camps.: Den 8 november 1942 landsteg amerikanska och brittiska trupper i Vichyfranska Marocko och Algeriet, vid Casablanca, Oran och Alger. Fransmännen gjorde motstånd i upp till tre dagar innan amiral François Darlan beordrade eldupphör och förde över Franska Nordafrika till de allierade. Tyskland och Italien skyndade in trupper i Tunisien och vann kapplöpningen om Tunis. Under sin sex månader långa ockupation tvingade tyskarna omkring 5 000 tunisiska judiska män till arbetsläger.
In February 1943 Rommel defeated inexperienced American troops at the Kasserine Pass, but in March the Eighth Army broke through the Mareth Line, and the Axis armies were caught between two Allied armies. Their bridgehead collapsed in early May. Tunis and Bizerte fell on 7 May, and on 13 May some 250,000 German and Italian soldiers surrendered, more than at Stalingrad.: I februari 1943 besegrade Rommel oerfarna amerikanska trupper vid Kasserinepasset, men i mars bröt 8:e armén igenom Marethlinjen, och axelmakternas arméer fångades mellan två allierade arméer. Deras brohuvud föll samman i början av maj. Tunis och Bizerte föll den 7 maj, och den 13 maj kapitulerade omkring 250 000 tyska och italienska soldater, fler än vid Stalingrad.
