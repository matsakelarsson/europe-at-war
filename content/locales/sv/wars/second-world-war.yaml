By the spring of 1944 the Red Army had freed most of Ukraine and the Crimea and lifted the siege of Leningrad. On 22 June, three years to the day after the German invasion and two weeks after the Allied landings in Normandy, it opened Operation Bagration against Army Group Centre in Belarus, where the Germans had not expected the main blow. Their front collapsed. Soviet armies encircled German forces at Vitebsk and Bobruisk and east of Minsk, which they took on 3 July, and destroyed 28 German divisions. On 17 July some 57,000 German prisoners were marched through Moscow. By August the Red Army stood on the Vistula and at the border of East Prussia.: Våren 1944 hade Röda armén befriat större delen av Ukraina och Krim och brutit belägringen av Leningrad. Den 22 juni, på dagen tre år efter den tyska invasionen och två veckor efter de allierades landstigning i Normandie, inledde den Operation Bagration mot armégrupp Mitte i Belarus, där tyskarna inte hade väntat sig huvudstöten. Deras front bröt samman. Sovjetiska arméer inneslöt tyska styrkor vid Vitebsk och Bobrujsk och öster om Minsk, som de intog den 3 juli, och förintade 28 tyska divisioner. Den 17 juli fördes omkring 57 000 tyska fångar i marsch genom Moskva. I augusti stod Röda armén vid Wisła och vid Ostpreussens gräns.
In the north the Red Army pushed into the Baltic states. German troops and Estonian units held the Narva isthmus at the Tannenberg Line in July and August, but in September the Germans left Estonia, and Soviet troops entered Tallinn on 22 September and Riga on 13 October. Tens of thousands of Estonians and Latvians fled by sea to Sweden and Germany, and the returning Soviet rule brought new arrests and deportations. Army Group North, cut off in western Latvia, held out in the Courland pocket until the end of the war. In the south the Jassy–Kishinev offensive broke through in August and drove Romania out of the war on the German side.: I norr trängde Röda armén in i de baltiska staterna. Tyska trupper och estniska förband höll Narvanäset vid Tannenberglinjen i juli och augusti, men i september lämnade tyskarna Estland, och sovjetiska trupper tågade in i Tallinn den 22 september och i Riga den 13 oktober. Tiotusentals ester och letter flydde sjövägen till Sverige och Tyskland, och det återvändande sovjetiska styret förde med sig nya arresteringar och deportationer. Armégrupp Nord, avskuren i västra Lettland, höll stånd i Kurlandfickan till krigets slut. I söder bröt Jassy–Kisjinjov-offensiven igenom i augusti och drev Rumänien ur kriget på tysk sida.
