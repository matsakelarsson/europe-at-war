Hungary had fought beside Germany against the Soviet Union since June 1941 and lost much of its Second Army on the Don in January 1943. Its troops had also killed some 3,000–4,000 Serbs and Jews in the Novi Sad raid of January 1942, many of them shot and pushed under the ice of the Danube. When Germany learned that the regent, Miklós Horthy, was seeking a separate peace, its forces occupied the country on 19 March 1944. Horthy stayed in office, but a pro-German government took over, and Adolf Eichmann arrived with an SS team to deport Hungary’s Jews, some 760,000 of whom were still alive within its wartime borders.: Ungern hade stridit vid Tysklands sida mot Sovjetunionen sedan juni 1941 och förlorat en stor del av sin 2:a armé vid Don i januari 1943. Dess trupper hade också dödat omkring 3 000–4 000 serber och judar vid razzian i Novi Sad i januari 1942, många av dem skjutna och nedknuffade under isen på Donau. När Tyskland fick veta att riksföreståndaren Miklós Horthy sökte en separatfred ockuperade dess styrkor landet den 19 mars 1944. Horthy satt kvar, men en tyskvänlig regering tog över, och Adolf Eichmann anlände med en SS-grupp för att deportera Ungerns judar, av vilka omkring 760 000 fortfarande levde inom landets gränser från krigsåren.
With the help of the Hungarian gendarmerie, Jews were forced into ghettos from April, beginning in Carpathian Ruthenia and northern Transylvania. Between 15 May and 9 July 1944 some 437,000 people were deported in 147 trains, nearly all to Auschwitz-Birkenau, where most were gassed on arrival. Under pressure from abroad Horthy halted the deportations in early July, before the Jews of Budapest could be taken. On 15 October, as the Red Army fought its way into eastern Hungary, he announced an armistice. German commandos kidnapped his son, and Horthy was forced to hand power to Ferenc Szálasi, leader of the fascist Arrow Cross.: Med hjälp av det ungerska gendarmeriet tvingades judarna in i getton från april, med början i Karpaterukraina och norra Transsylvanien. Mellan den 15 maj och 9 juli 1944 deporterades omkring 437 000 människor i 147 tåg, nästan alla till Auschwitz-Birkenau, där de flesta gasades ihjäl vid ankomsten. Under tryck från utlandet stoppade Horthy deportationerna i början av juli, innan Budapests judar hann föras bort. Den 15 oktober, när Röda armén kämpade sig in i östra Ungern, tillkännagav han ett vapenstillestånd. Tyska kommandosoldater kidnappade hans son, och Horthy tvingades lämna över makten till Ferenc Szálasi, ledare för det fascistiska Pilkorspartiet.
Arrow Cross rule brought a new wave of terror. Tens of thousands of Budapest Jews were driven on foot towards the Austrian border in November, and militiamen shot 10,000–15,000 on the banks of the Danube over the winter. Diplomats such as the Swede Raoul Wallenberg and the Swiss Carl Lutz saved thousands with protective passes and safe houses. About 565,000 of Hungary’s Jews were killed in the war; some 119,000 survived in Budapest.: Pilkorsväldet förde med sig en ny våg av terror. Tiotusentals judar från Budapest drevs till fots mot den österrikiska gränsen i november, och milismän sköt 10 000–15 000 på Donaus stränder under vintern. Diplomater som svensken Raoul Wallenberg och schweizaren Carl Lutz räddade tusentals med skyddspass och skyddade hus. Omkring 565 000 av Ungerns judar dödades under kriget; omkring 119 000 överlevde i Budapest.
