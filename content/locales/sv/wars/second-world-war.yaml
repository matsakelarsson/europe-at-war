After the Axis surrender in Tunisia, American, British and Canadian troops landed in Sicily on 10 July 1943. Patton’s Seventh Army took Palermo on 22 July while Montgomery’s Eighth Army fought its way up the east coast past Catania and Mount Etna. On 24–25 July the Fascist Grand Council turned against Mussolini, and the king dismissed and arrested him; Marshal Pietro Badoglio formed a government that secretly sought terms. Allied troops entered Messina on 17 August, but by then the Germans and Italians had ferried more than 100,000 men across the strait to the mainland.: Efter axelmakternas kapitulation i Tunisien landsteg amerikanska, brittiska och kanadensiska trupper på Sicilien den 10 juli 1943. Pattons 7:e armé intog Palermo den 22 juli medan Montgomerys 8:e armé kämpade sig uppför östkusten förbi Catania och Etna. Den 24–25 juli vände sig fascistiska storrådet mot Mussolini, och kungen avsatte honom och lät gripa honom; marskalk Pietro Badoglio bildade en regering som i hemlighet sökte fredsvillkor. Allierade trupper tågade in i Messina den 17 augusti, men då hade tyskarna och italienarna fört över mer än 100 000 man över sundet till fastlandet.
The armistice signed at Cassibile on 3 September, the day the Eighth Army crossed into Calabria, was announced on 8 September, as the Allies prepared to land at Salerno. Germany was ready. Its troops disarmed the Italian army, occupied Rome and the north, and sent some 600,000 Italian soldiers who refused to fight on to Germany as military internees, where tens of thousands died. The king and Badoglio fled south. German paratroopers freed Mussolini from the Gran Sasso on 12 September to head a new Fascist state, the Italian Social Republic, governed from Salò on Lake Garda.: Vapenstilleståndet, som undertecknades i Cassibile den 3 september, samma dag som 8:e armén gick över till Kalabrien, tillkännagavs den 8 september, när de allierade förberedde landstigningen vid Salerno. Tyskland var berett. Dess trupper avväpnade den italienska armén, ockuperade Rom och norra Italien och sände omkring 600 000 italienska soldater som vägrade fortsätta kämpa till Tyskland som militärinternerade, där tiotusentals dog. Kungen och Badoglio flydde söderut. Tyska fallskärmsjägare befriade Mussolini från Gran Sasso den 12 september för att han skulle leda en ny fascistisk stat, Italienska sociala republiken, styrd från Salò vid Gardasjön.
At Salerno the Germans counter-attacked the beachhead hard before withdrawing north. In Naples the population rose against the occupiers in the Four Days of 27–30 September, and Allied troops entered the city on 1 October. By early October the front ran along the Volturno and across to Termoli on the Adriatic. In Corsica the resistance, Free French troops and Italian units drove out the Germans by the start of October. On 16 October the SS raided the Rome ghetto and deported 1,023 Jews to Auschwitz; only 16 survived.: Vid Salerno gick tyskarna till hårda motanfall mot brohuvudet innan de drog sig tillbaka norrut. I Neapel reste sig befolkningen mot ockupanterna under de fyra dagarna den 27–30 september, och allierade trupper tågade in i staden den 1 oktober. I början av oktober gick fronten längs Volturno och tvärs över till Termoli vid Adriatiska havet. På Korsika drev motståndsrörelsen, fria franska trupper och italienska förband ut tyskarna i början av oktober. Den 16 oktober gjorde SS en razzia i Roms getto och deporterade 1 023 judar till Auschwitz; endast 16 överlevde.
