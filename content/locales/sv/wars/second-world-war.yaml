By the end of July 1944 the Red Army had reached the Vistula south of Warsaw and was approaching the eastern suburb of Praga. The Home Army, the underground force loyal to the government-in-exile in London, rose in the city on 1 August, hoping to free it before the Soviets arrived and to show that Poland meant to be independent. Between 20,000 and 49,000 fighters, few of them well armed, took much of the centre and Old Town, but failed to capture the bridges and the main German strongpoints.: I slutet av juli 1944 hade Röda armén nått Wisła söder om Warszawa och närmade sig den östra förstaden Praga. Hemarmén, den underjordiska styrka som var lojal mot exilregeringen i London, reste sig i staden den 1 augusti i hopp om att befria den innan sovjeterna kom och att visa att Polen ämnade vara självständigt. Mellan 20 000 och 49 000 kämpar, få av dem väl beväpnade, intog stora delar av centrum och Gamla stan men lyckades inte erövra broarna och de viktigaste tyska stödjepunkterna.
Germany sent SS and police units to crush the rising, and in the Wola district they massacred some 40,000–50,000 civilians in the first days. The Soviet army halted east of the river and at first refused Allied supply aircraft the use of its airfields. It took Praga in mid-September, and Polish troops under Soviet command crossed to Czerniaków but were driven back. The Home Army surrendered on 2 October after 63 days. The Germans then drove out the remaining inhabitants and systematically destroyed the city.: Tyskland sände SS- och polisförband för att krossa upproret, och i stadsdelen Wola massakrerade de omkring 40 000–50 000 civila under de första dagarna. Den sovjetiska armén stannade öster om floden och vägrade till en början låta allierade försörjningsplan använda dess flygfält. Den intog Praga i mitten av september, och polska trupper under sovjetiskt befäl gick över till Czerniaków men drevs tillbaka. Hemarmén kapitulerade den 2 oktober efter 63 dagar. Tyskarna fördrev därefter de kvarvarande invånarna och förstörde systematiskt staden.
