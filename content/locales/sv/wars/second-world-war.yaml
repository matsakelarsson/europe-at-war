Britain depended on imports by sea, and Germany set out to cut them off. A U-boat sank the liner Athenia on the day Britain declared war, killing 117, and in October 1939 U-47 sank the battleship Royal Oak at anchor in Scapa Flow, killing 835. After the fall of France the U-boats operated from new bases on the Biscay coast, at Brest, Lorient, Saint-Nazaire and La Rochelle, hunting the convoys in “wolf packs”. In May 1941 the battleship Bismarck sank HMS Hood, killing all but three of her crew of 1,418, before British ships hunted her down three days later.: Storbritannien var beroende av import sjövägen, och Tyskland gick in för att skära av den. En ubåt sänkte passagerarfartyget Athenia samma dag som Storbritannien förklarade krig, varvid 117 dödades, och i oktober 1939 sänkte U-47 slagskeppet Royal Oak till ankars i Scapa Flow, varvid 835 dödades. Efter Frankrikes fall opererade ubåtarna från nya baser vid Biscayakusten, i Brest, Lorient, Saint-Nazaire och La Rochelle, och jagade konvojerna i ”vargflockar”. I maj 1941 sänkte slagskeppet Bismarck HMS Hood, där alla utom tre av besättningens 1 418 man dödades, innan brittiska fartyg jagade ned Bismarck tre dagar senare.
Merchant ships sailed in escorted convoys, and from September 1941 the United States, still neutral, escorted them in the western Atlantic. Losses peaked in 1942, when U-boats also struck off the American coast and the Arctic convoys to the Soviet Union suffered disasters such as PQ 17, of whose 35 ships only 11 arrived. In spring 1943 more escorts, long-range aircraft closing the mid-Atlantic air gap, radar and the breaking of German naval codes at Bletchley Park turned the battle. In “Black May” 43 U-boats were lost, and on 24 May Admiral Dönitz withdrew them from the North Atlantic.: Handelsfartyg seglade i eskorterade konvojer, och från september 1941 eskorterade det fortfarande neutrala USA dem i västra Atlanten. Förlusterna nådde sin topp 1942, då ubåtarna också slog till utanför den amerikanska kusten och de arktiska konvojerna till Sovjetunionen drabbades av katastrofer som PQ 17, där bara 11 av 35 fartyg kom fram. Våren 1943 vände fler eskortfartyg, långdistansflygplan som täppte till luftluckan mitt i Atlanten, radar och knäckandet av de tyska marinkoderna i Bletchley Park slaget. Under ”svarta maj” förlorades 43 ubåtar, och den 24 maj drog amiral Dönitz tillbaka dem från Nordatlanten.
