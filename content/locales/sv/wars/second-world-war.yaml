In the occupied west Germany ruled through military or civilian administrations and relied on local officials. Pétain met Hitler at Montoire in October 1940, and his regime at Vichy chose collaboration and passed its own anti-Jewish laws. The Netherlands was run by a German Reich Commissioner through Dutch civil servants, Belgium and northern France by a German military governor in Brussels. Luxembourg was annexed in August 1942, and when a general strike broke out against conscription into the German army, 21 strikers were sentenced to death. Between 600,000 and 650,000 French workers were sent to work in Germany.: I det ockuperade västra Europa styrde Tyskland genom militära eller civila förvaltningar och förlitade sig på lokala ämbetsmän. Pétain träffade Hitler i Montoire i oktober 1940, och hans regim i Vichy valde kollaboration och antog egna antijudiska lagar. Nederländerna styrdes av en tysk rikskommissarie genom nederländska tjänstemän, Belgien och norra Frankrike av en tysk militärguvernör i Bryssel. Luxemburg annekterades i augusti 1942, och när en generalstrejk bröt ut mot inkallelsen till den tyska armén dömdes 21 strejkande till döden. Mellan 600 000 och 650 000 franska arbetare sändes till arbete i Tyskland.
The deportation of the Jews of the west began in 1942. In Paris French police arrested 13,152 Jews in the Vel d’Hiv round-up of 16–17 July, and trains left the camp at Drancy for Auschwitz-Birkenau. Of about 340,000 Jews in France some 72,500 were killed; most survived, many hidden by neighbours. From Westerbork about 97,800 Jews were sent to Auschwitz and Sobibór in occupied Poland, and about three-quarters of the Jews of the Netherlands died, among them Anne Frank. From Mechelen more than 25,000 Jews and Roma were deported; about 1,240 returned.: Deportationen av Västeuropas judar inleddes 1942. I Paris grep fransk polis 13 152 judar i Vel d’Hiv-razzian den 16–17 juli, och tåg avgick från lägret i Drancy till Auschwitz-Birkenau. Av omkring 340 000 judar i Frankrike dödades omkring 72 500; de flesta överlevde, många gömda av grannar. Från Westerbork sändes omkring 97 800 judar till Auschwitz och Sobibór i det ockuperade Polen, och omkring tre fjärdedelar av Nederländernas judar dog, bland dem Anne Frank. Från Mechelen deporterades mer än 25 000 judar och romer; omkring 1 240 återvände.
Resistance grew from small beginnings. In February 1941 some 300,000 people in and around Amsterdam struck in protest at the first round-ups of Jews. When the Allies landed in French North Africa, Germany occupied the rest of France on 11 November 1942 and Italy most of the south-east and Corsica, and on 27 November, as German troops entered Toulon, the French navy scuttled 77 ships. Forced labour drove thousands of young men into the maquis, and Jean Moulin united the main resistance movements under de Gaulle before his arrest in June 1943.: Motståndet växte från små början. I februari 1941 strejkade omkring 300 000 människor i och omkring Amsterdam i protest mot de första razziorna mot judar. När de allierade landsteg i Franska Nordafrika ockuperade Tyskland resten av Frankrike den 11 november 1942 och Italien större delen av sydöstra Frankrike och Korsika, och den 27 november, när tyska trupper gick in i Toulon, sänkte den franska flottan 77 fartyg. Tvångsarbetet drev tusentals unga män till maquisen, och Jean Moulin enade de viktigaste motståndsrörelserna under de Gaulle innan han greps i juni 1943.
