Mussolini, eager to match Germany’s conquests, decided to attack Greece without telling Hitler first. Early on 28 October 1940 the Italian minister in Athens delivered an ultimatum demanding passage for Italian troops. The dictator Ioannis Metaxas refused, a moment Greeks still mark every year as Ohi (“No”) Day, and within hours Italian forces crossed from Albania, which Italy had occupied in 1939. Their main thrust in Epirus was stopped on the Kalamas river, and in the Pindus mountains Greek troops cut off and mauled the Julia Alpine Division in early November.: Mussolini, ivrig att matcha Tysklands erövringar, beslöt att anfalla Grekland utan att först säga något till Hitler. Tidigt den 28 oktober 1940 överlämnade det italienska sändebudet i Aten ett ultimatum med krav på genommarsch för italienska trupper. Diktatorn Ioannis Metaxas vägrade, ett ögonblick som grekerna fortfarande uppmärksammar varje år som Ochi-dagen (”Nej”-dagen), och inom några timmar gick italienska styrkor över gränsen från Albanien, som Italien hade ockuperat 1939. Deras huvudstöt i Epirus hejdades vid floden Kalamas, och i Pindosbergen skar grekiska trupper av och tilltygade alpindivisionen Julia i början av november.
The Greeks then went over to the attack and drove the Italians back into Albania. They took Korçë on 22 November, Sarandë and Gjirokastër early in December, Himarë just before Christmas and the Klisura pass in January 1941. It was one of the first Allied victories of the war on land. In the snow of the Albanian mountains, where many soldiers on both sides lost limbs to frostbite, the front then stalled. An Italian spring offensive in March, watched by Mussolini, failed with heavy losses, but Greece had sent almost its whole army to Albania, leaving Macedonia thinly held when Germany attacked in April.: Grekerna gick därefter till anfall och drev italienarna tillbaka in i Albanien. De intog Korçë den 22 november, Sarandë och Gjirokastër i början av december, Himarë strax före jul och Klisurapasset i januari 1941. Det var en av de allierades första segrar till lands i kriget. I snön i de albanska bergen, där många soldater på båda sidor förlorade armar och ben genom köldskador, körde fronten sedan fast. En italiensk våroffensiv i mars, som Mussolini bevittnade, misslyckades med svåra förluster, men Grekland hade sänt nästan hela sin armé till Albanien, vilket lämnade Makedonien tunt försvarat när Tyskland anföll i april.
