Italy entered the war on 10 June 1940, as France was collapsing, and from its colony of Libya it invaded Egypt, where British forces guarded the Suez Canal. Marshal Rodolfo Graziani’s 10th Army advanced about 100 km in September and dug in around Sidi Barrani. In November British carrier aircraft crippled three Italian battleships in harbour at Taranto. On 9 December General Richard O’Connor’s Western Desert Force, some 36,000 men, attacked. In two months it took Sidi Barrani, Bardia and Tobruk, cut off the retreating Italians at Beda Fomm and captured more than 130,000 prisoners.: Italien gick in i kriget den 10 juni 1940, när Frankrike höll på att falla samman, och från sin koloni Libyen invaderade landet Egypten, där brittiska styrkor bevakade Suezkanalen. Marskalk Rodolfo Grazianis 10:e armé ryckte fram omkring 100 km i september och grävde ned sig runt Sidi Barrani. I november slog brittiska hangarfartygsplan ut tre italienska slagskepp i hamnen i Taranto. Den 9 december anföll general Richard O’Connors Western Desert Force, omkring 36 000 man. På två månader intog den Sidi Barrani, Bardia och Tobruk, skar av de retirerande italienarna vid Beda Fomm och tog mer än 130 000 fångar.
In February 1941 Hitler sent Erwin Rommel to Libya with the first units of what became the Afrika Korps, while many of O’Connor’s troops left for Greece. Rommel drove the British back to the Egyptian border, though an Australian-led garrison held Tobruk through an eight-month siege until it was relieved in November. In May 1942 Rommel struck again at Gazala, where Free French troops held Bir Hakeim for two weeks. Tobruk fell on 21 June with some 33,000 prisoners, and the Axis advance was stopped only at El Alamein, about 100 km from Alexandria, in July.: I februari 1941 sände Hitler Erwin Rommel till Libyen med de första förbanden av det som blev Afrikakåren, medan många av O’Connors trupper avgick till Grekland. Rommel drev britterna tillbaka till den egyptiska gränsen, men en australiskledd garnison höll Tobruk under en åtta månader lång belägring tills staden undsattes i november. I maj 1942 slog Rommel till på nytt vid Gazala, där fria franska trupper höll Bir Hakeim i två veckor. Tobruk föll den 21 juni med omkring 33 000 fångar, och axelmakternas framryckning hejdades först vid El Alamein, omkring 100 km från Alexandria, i juli.
Everything turned on supplies. From Malta British aircraft and submarines attacked the convoys carrying fuel and troops to Libya, and German and Italian aircraft bombed the island from June 1940 until late 1942, most heavily in the spring of 1942, when its people and garrison came close to starvation. King George VI awarded the island the George Cross in April 1942. In August a convoy fought its way through, Operation Pedestal; most of its ships were sunk, but the tanker Ohio and four freighters reached Valletta.: Allt hängde på underhållet. Från Malta anföll brittiska flygplan och ubåtar de konvojer som förde bränsle och trupper till Libyen, och tyska och italienska flygplan bombade ön från juni 1940 till slutet av 1942, värst våren 1942, då dess befolkning och garnison var nära att svälta. Kung Georg VI tilldelade ön Georgskorset i april 1942. I augusti kämpade sig en konvoj fram, operation Pedestal; de flesta av dess fartyg sänktes, men tankern Ohio och fyra lastfartyg nådde Valletta.
