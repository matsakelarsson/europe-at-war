Seat of the General Government, the German-ruled rump of central Poland under Governor-General Hans Frank.: Säte för Generalguvernementet, den tyskstyrda resten av mellersta Polen under generalguvernören Hans Frank.
28 October 1939: 28 oktober 1939
The Soviet Union handed the city and its region to Lithuania, in return for Soviet bases there.: Sovjetunionen överlämnade staden och dess omgivningar till Litauen, i utbyte mot sovjetiska baser där.
Both occupiers set out to destroy Poland’s leaders and educated class. In the annexed lands German units and local ethnic German militias shot tens of thousands of Poles in 1939 and 1940, many of them in the Piaśnica forest in Pomerania, and the AB-Aktion of 1940 killed thousands more in the General Government, among them those shot at Palmiry near Warsaw. Hundreds of thousands of Poles were expelled from the annexed lands, Jews were forced into ghettos, and in June 1940 the first prisoners arrived at a new camp at Auschwitz.: Båda ockupationsmakterna gick in för att förinta Polens ledare och bildade klass. I de annekterade områdena sköt tyska förband och lokala etniskt tyska miliser tiotusentals polacker 1939 och 1940, många av dem i Piaśnicaskogen i Pommern, och AB-Aktion 1940 dödade ytterligare tusentals i Generalguvernementet, bland dem de som sköts i Palmiry nära Warszawa. Hundratusentals polacker fördrevs från de annekterade områdena, judar tvingades in i getton, och i juni 1940 anlände de första fångarna till ett nytt läger i Auschwitz.
In the Soviet zone the NKVD arrested officials, officers, landowners and community leaders, and from February 1940 deported whole families to Siberia and Kazakhstan; estimates of the number range from about 350,000 to 1.5 million. On 5 March 1940 the Soviet Politburo ordered the shooting of Polish officers, police and others held in its camps. In April and May nearly 22,000 were killed, at Katyn near Smolensk, at Kalinin and at Kharkiv. The Soviet Union blamed Germany until 1990.: I den sovjetiska zonen grep NKVD ämbetsmän, officerare, godsägare och lokala ledare, och från februari 1940 deporterades hela familjer till Sibirien och Kazakstan; uppskattningarna av antalet varierar från omkring 350 000 till 1,5 miljoner. Den 5 mars 1940 beordrade det sovjetiska politbyrån att polska officerare, poliser och andra som hölls i dess läger skulle skjutas. I april och maj dödades nästan 22 000, i Katyn nära Smolensk, i Kalinin och i Charkiv. Sovjetunionen skyllde på Tyskland ända till 1990.
