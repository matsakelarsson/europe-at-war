Greece was divided into three zones. Germany kept Athens, Thessaloniki and Central Macedonia, most of Crete and some islands; Bulgaria annexed eastern Macedonia and Western Thrace and crushed a rising at Drama in September 1941; Italy occupied the rest. With food requisitioned by the occupiers, transport wrecked and a British naval blockade, famine struck in the winter of 1941–42, when hundreds died each day in Athens. Estimates of the deaths from hunger during the occupation run as high as 300,000. Food from Turkey, and after the blockade was eased in 1942 Red Cross wheat carried in Swedish ships, saved many lives.: Grekland delades i tre zoner. Tyskland behöll Aten, Thessaloniki och Centralmakedonien, större delen av Kreta och några öar; Bulgarien annekterade östra Makedonien och västra Thrakien och krossade ett uppror i Drama i september 1941; Italien ockuperade resten. Med livsmedel rekvirerade av ockupanterna, transporterna i spillror och en brittisk sjöblockad drabbades landet av hungersnöd vintern 1941–42, då hundratals dog varje dag i Aten. Uppskattningarna av antalet svältdöda under ockupationen går upp till 300 000. Livsmedel från Turkiet, och sedan blockaden lättats 1942 Röda korsets vete som fördes i svenska fartyg, räddade många liv.
Resistance grew from 1942, led by the communist-dominated National Liberation Front (EAM) and its army, ELAS, and by smaller groups such as Napoleon Zervas’s EDES. On the night of 25 November 1942 ELAS and EDES fighters and British saboteurs blew up the Gorgopotamos railway viaduct, on the line that carried supplies bound for Rommel’s army. The occupiers answered with mass reprisals. German troops killed 317 villagers at Kommeno in August 1943, nearly 700 people in and around Kalavryta in December 1943 and 228 at Distomo in June 1944. From 1943 ELAS and EDES also fought each other.: Motståndet växte från 1942, lett av den kommunistdominerade Nationella befrielsefronten (EAM) och dess armé ELAS, och av mindre grupper som Napoleon Zervas EDES. Natten mellan den 25 och 26 november 1942 sprängde ELAS- och EDES-krigare och brittiska sabotörer järnvägsviadukten vid Gorgopotamos, på den linje som förde underhåll avsett för Rommels armé. Ockupanterna svarade med massrepressalier. Tyska trupper dödade 317 bybor i Kommeno i augusti 1943, nästan 700 människor i och omkring Kalavryta i december 1943 och 228 i Distomo i juni 1944. Från 1943 stred ELAS och EDES också mot varandra.
In March 1943 the Germans began deporting the Jews of Thessaloniki, one of the great Sephardic communities of Europe. By August some 45,000–50,000 had been sent to Auschwitz, where almost all were murdered. In the same month Bulgaria deported more than 4,000 Jews from its zone in Thrace and Macedonia to Treblinka. After Italy’s surrender in 1943 the Germans hunted down Jews in the former Italian zone as well, and by the end of the occupation more than 80 per cent of the Jews of Greece had been murdered.: I mars 1943 började tyskarna deportera judarna i Thessaloniki, en av Europas stora sefardiska församlingar. Till augusti hade omkring 45 000–50 000 sänts till Auschwitz, där nästan alla mördades. Samma månad deporterade Bulgarien mer än 4 000 judar från sin zon i Thrakien och Makedonien till Treblinka. Efter Italiens kapitulation 1943 jagade tyskarna judar även i den tidigare italienska zonen, och vid ockupationens slut hade mer än 80 procent av Greklands judar mördats.
