The Red Army reached the outskirts of Budapest in early November 1944, but Hitler ordered the city held as a fortress. On 26 December Soviet forces completed its encirclement, trapping tens of thousands of German and Hungarian soldiers and some 800,000 civilians. Three German relief attacks in January failed. Soviet and Romanian troops took Pest street by street, and on 18 January its last defenders withdrew across the Danube to the castle hill of Buda, blowing up the bridges behind them. On 11 February some 28,000 tried to break out; only about 700 reached the German lines. The last resistance ended on 13 February.: Röda armén nådde Budapests utkanter i början av november 1944, men Hitler beordrade att staden skulle hållas som en fästning. Den 26 december fullbordade sovjetiska styrkor inringningen och stängde in tiotusentals tyska och ungerska soldater och omkring 800 000 civila. Tre tyska undsättningsanfall i januari misslyckades. Sovjetiska och rumänska trupper intog Pest gata för gata, och den 18 januari drog sig de sista försvararna tillbaka över Donau till borgberget i Buda och sprängde broarna bakom sig. Den 11 februari försökte omkring 28 000 bryta sig ut; endast omkring 700 nådde de tyska linjerna. Det sista motståndet upphörde den 13 februari.
About 38,000 civilians died in the siege, from shelling, bombing, hunger and disease, and Arrow Cross killings went on almost to the end. Soviet soldiers looted, raped very large numbers of women and rounded up tens of thousands of civilians for forced labour in the Soviet Union. In Debrecen a provisional government formed under Soviet protection had declared war on Germany, and it signed an armistice in Moscow on 20 January 1945.: Omkring 38 000 civila dog under belägringen, av beskjutning, bombningar, svält och sjukdomar, och pilkorsarnas mord pågick nästan till slutet. Sovjetiska soldater plundrade, våldtog mycket stora antal kvinnor och samlade ihop tiotusentals civila för tvångsarbete i Sovjetunionen. I Debrecen hade en provisorisk regering, bildad under sovjetiskt beskydd, förklarat Tyskland krig, och den undertecknade ett vapenstillestånd i Moskva den 20 januari 1945.
In March Hitler threw his last reserves, the 6th SS Panzer Army, into Operation Spring Awakening between Lake Balaton and the Danube, to protect the last oilfields left to Germany, around Nagykanizsa. It gained up to 30 km before stalling in mud and Soviet defences. On 16 March the Soviets counter-attacked, and within weeks they crossed into Austria. Bratislava fell on 4 April and Vienna, after a week of fighting, on 13 April. A provisional Austrian government under Karl Renner was set up in Vienna on 27 April.: I mars kastade Hitler in sina sista reserver, 6:e SS-pansararmén, i Operation Frühlingserwachen mellan Balatonsjön och Donau för att skydda de sista oljefält som Tyskland hade kvar, kring Nagykanizsa. Den vann upp till 30 km terräng innan den körde fast i lera och sovjetiska försvarsställningar. Den 16 mars gick sovjeterna till motanfall, och inom några veckor gick de in i Österrike. Bratislava föll den 4 april och Wien, efter en veckas strider, den 13 april. En provisorisk österrikisk regering under Karl Renner bildades i Wien den 27 april.
