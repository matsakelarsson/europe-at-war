On 15 August 1944 American and French troops landed in Provence between Toulon and Cannes. The French under General de Lattre took Toulon and Marseille by 28 August, far sooner than planned, and the Allies drove up the Rhône valley to meet the forces from Normandy near Dijon in mid-September. In Paris the police and the Resistance rose on 19 August. Eisenhower sent General Leclerc’s French 2nd Armoured Division ahead, and on 25 August the German commander, Dietrich von Choltitz, surrendered the city, which Hitler had ordered him to destroy. De Gaulle walked down the Champs-Élysées the next day.: Den 15 augusti 1944 landsteg amerikanska och franska trupper i Provence mellan Toulon och Cannes. Fransmännen under general de Lattre intog Toulon och Marseille den 28 augusti, långt tidigare än planerat, och de allierade ryckte fram uppför Rhônedalen för att möta styrkorna från Normandie nära Dijon i mitten av september. I Paris reste sig polisen och motståndsrörelsen den 19 augusti. Eisenhower sände general Leclercs franska 2:a pansardivision i förväg, och den 25 augusti överlämnade den tyske befälhavaren Dietrich von Choltitz staden, som Hitler hade beordrat honom att förstöra. De Gaulle gick nedför Champs-Élysées dagen därpå.
As the Germans retreated, the British and Canadians crossed the Seine and raced north, reaching Brussels on 3 September and Antwerp, with its port intact, on 4 September. The Americans freed Liège and Luxembourg, and by mid-September they stood on the German border near Aachen and on the Moselle. But supplies were stretched, the approaches to Antwerp along the Scheldt stayed in German hands until November, and German garrisons held Dunkirk, Lorient, Saint-Nazaire and La Rochelle until the end of the war. Royan and the Pointe de Grave were retaken by French forces in April 1945.: När tyskarna drog sig tillbaka gick britterna och kanadensarna över Seine och ryckte snabbt norrut; de nådde Bryssel den 3 september och Antwerpen, med hamnen intakt, den 4 september. Amerikanerna befriade Liège och Luxemburg, och i mitten av september stod de vid den tyska gränsen nära Aachen och vid Mosel. Men underhållslinjerna var uttänjda, inloppet till Antwerpen längs Schelde förblev i tyska händer till november, och tyska garnisoner höll Dunkerque, Lorient, Saint-Nazaire och La Rochelle till krigets slut. Royan och Pointe de Grave återtogs av franska styrkor i april 1945.
The retreat was marked by massacres. In June, after Resistance attacks following D-Day, the SS division Das Reich hanged 99 men in Tulle and killed 642 people at Oradour-sur-Glane, burning the women and children in the church. In July German troops crushed the maquis on the Vercors plateau, killing more than 600 fighters and some 200 civilians. After liberation some 9,000–10,000 people accused of collaboration were killed without trial and about 20,000 women had their heads shaved in public, before the courts took over the purge.: Reträtten präglades av massakrer. I juni, efter motståndsrörelsens anfall i spåren av dagen D, hängde SS-divisionen Das Reich 99 män i Tulle och dödade 642 människor i Oradour-sur-Glane, där kvinnorna och barnen brändes i kyrkan. I juli krossade tyska trupper maquisen på Vercorsplatån och dödade mer än 600 kämpar och omkring 200 civila. Efter befrielsen dödades omkring 9 000–10 000 människor som anklagades för kollaboration utan rättegång, och omkring 20 000 kvinnor fick håret rakat offentligt, innan domstolarna tog över utrensningen.
