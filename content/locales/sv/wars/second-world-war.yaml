From February 1942 RAF Bomber Command, led by Arthur Harris, bombed German cities at night, aiming at whole urban areas to destroy industry and break civilian morale. A thousand bombers struck Cologne on 30–31 May 1942. In 1943 the US Eighth Air Force joined by day, though its raids on the ball-bearing factories of Schweinfurt cost heavy losses, and in May British bombers breached the Möhne and Eder dams; the floods killed about 1,600 people, most of them forced labourers. In late July 1943 raids on Hamburg raised a firestorm that killed some 35,000–40,000 people.: Från februari 1942 bombade RAF Bomber Command, lett av Arthur Harris, tyska städer nattetid och siktade på hela stadsområden för att förstöra industrin och knäcka civilbefolkningens moral. Tusen bombplan anföll Köln den 30–31 maj 1942. År 1943 anslöt sig den amerikanska 8:e flygarmén med dagräder, även om dess räder mot kullagerfabrikerna i Schweinfurt kostade svåra förluster, och i maj slog brittiska bombplan hål på Möhne- och Ederdammarna; översvämningarna dödade omkring 1 600 människor, de flesta av dem tvångsarbetare. I slutet av juli 1943 orsakade räderna mot Hamburg en eldstorm som dödade omkring 35 000–40 000 människor.
The bombing grew heavier until 1945, against Berlin from November 1943, oil plants and railways, and cities such as Dresden, where raids on 13–15 February 1945 killed up to 25,000 people. Estimates of German civilian deaths range from about 305,000 to 350,000 or more, and Bomber Command lost 55,573 aircrew. Germany struck back with “vengeance weapons”. From June 1944 V-1 flying bombs killed about 6,200 people in the London area, and from September V-2 rockets hit London, Antwerp and Liège, killing about 9,000; some 12,000 forced labourers died building them.: Bombningarna tilltog fram till 1945, mot Berlin från november 1943, mot oljeanläggningar och järnvägar och mot städer som Dresden, där räderna den 13–15 februari 1945 dödade upp till 25 000 människor. Uppskattningarna av antalet dödade tyska civila varierar från omkring 305 000 till 350 000 eller fler, och Bomber Command förlorade 55 573 flygare. Tyskland slog tillbaka med ”vedergällningsvapen”. Från juni 1944 dödade V1-flygbomber omkring 6 200 människor i Londonområdet, och från september träffade V2-raketer London, Antwerpen och Liège och dödade omkring 9 000; omkring 12 000 tvångsarbetare dog när de byggde dem.
