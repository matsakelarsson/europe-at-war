In May 1944 German paratroopers landed at Drvar in an attempt to seize Tito, who escaped and moved to the Adriatic island of Vis, protected by the Allies. Britain and the United States now supplied the Partisans and flew out their wounded, and King Peter’s government in exile came to terms with Tito. In September, as Romania and Bulgaria changed sides, Germany ordered its armies in Greece and the southern Balkans to withdraw north before they were cut off. Tito flew secretly to Moscow and agreed with Stalin that the Red Army would help to free Belgrade and leave the civil administration to the Partisans.: I maj 1944 landsteg tyska fallskärmsjägare vid Drvar i ett försök att gripa Tito, som undkom och flyttade till ön Vis i Adriatiska havet, under de allierades beskydd. Storbritannien och USA försåg nu partisanerna med förnödenheter och flög ut deras sårade, och kung Peters exilregering kom överens med Tito. I september, när Rumänien och Bulgarien bytte sida, beordrade Tyskland sina arméer i Grekland och på södra Balkan att dra sig tillbaka norrut innan de blev avskurna. Tito flög i hemlighet till Moskva och kom överens med Stalin om att Röda armén skulle hjälpa till att befria Belgrad och överlämna den civila förvaltningen till partisanerna.
The Germans left Athens on 12 October, British troops landed at Piraeus two days later, and the government of national unity under Georgios Papandreou arrived on 18 October. ELAS entered Thessaloniki on 30 October, and by early November the Germans had left mainland Greece, though they held western Crete and some islands until May 1945. In Albania communist-led partisans under Enver Hoxha took Tirana on 17 November and the whole country by the end of the month. In Greece the uneasy truce between ELAS and the government lasted only weeks.: Tyskarna lämnade Aten den 12 oktober, brittiska trupper landsteg i Pireus två dagar senare, och den nationella samlingsregeringen under Georgios Papandreou anlände den 18 oktober. ELAS tågade in i Thessaloniki den 30 oktober, och i början av november hade tyskarna lämnat det grekiska fastlandet, även om de höll västra Kreta och några öar till maj 1945. I Albanien intog kommunistledda partisaner under Enver Hoxha Tirana den 17 november och hela landet före månadens slut. I Grekland varade det bräckliga stilleståndet mellan ELAS och regeringen bara några veckor.
In Serbia the Soviet 3rd Ukrainian Front and the Partisans’ 1st Army Group, with Bulgarian armies to the south, attacked in October, and after a week of street fighting Belgrade was freed on 20 October. Soviet troops then turned north into Hungary, while the Partisans faced a German front across Syrmia. Behind the front the new authorities shot thousands of people accused of collaboration across Serbia, and in Vojvodina Partisan units killed thousands of ethnic Hungarians and interned the local Germans in camps, where many died.: I Serbien anföll sovjetiska 3:e ukrainska fronten och partisanernas 1:a armégrupp, med bulgariska arméer i söder, i oktober, och efter en veckas gatustrider befriades Belgrad den 20 oktober. Sovjetiska trupper vände sedan norrut in i Ungern, medan partisanerna stod mot en tysk front tvärs över Syrmien. Bakom fronten sköt de nya myndigheterna tusentals människor som anklagades för kollaboration runt om i Serbien, och i Vojvodina dödade partisanförband tusentals etniska ungrare och internerade de lokala tyskarna i läger, där många dog.
