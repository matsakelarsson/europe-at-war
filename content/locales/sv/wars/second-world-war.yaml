South of Rome the Germans under Field Marshal Kesselring held fortified lines across the mountains, the strongest the Gustav Line, anchored on Monte Cassino. Through a wet winter the Allies, among them American, British, Canadian, French, Indian, New Zealand and Polish troops, made slow and costly progress. On 22 January 1944 American and British troops landed at Anzio, behind the line, but their commander dug in instead of striking inland, and German counter-attacks pinned the beachhead down for four months. On 15 February Allied bombers destroyed the abbey on Monte Cassino, and the Germans then fortified its ruins.: Söder om Rom höll tyskarna under fältmarskalk Kesselring befästa linjer tvärs över bergen, av vilka den starkaste var Gustavlinjen, förankrad vid Monte Cassino. Under en regnig vinter gjorde de allierade, bland dem amerikanska, brittiska, kanadensiska, franska, indiska, nyzeeländska och polska trupper, långsamma och kostsamma framsteg. Den 22 januari 1944 landsteg amerikanska och brittiska trupper vid Anzio, bakom linjen, men deras befälhavare grävde ned sig i stället för att stöta inåt landet, och tyska motanfall höll brohuvudet fastlåst i fyra månader. Den 15 februari förstörde allierade bombplan klostret på Monte Cassino, och tyskarna befäste därefter dess ruiner.
Three assaults on Cassino failed between January and March. In the fourth, launched on 11 May, French colonial troops broke through the Aurunci mountains, and on 18 May soldiers of the Polish II Corps raised their flag over the abbey ruins after a week of heavy losses. The Anzio force broke out on 23 May, but General Clark turned it towards Rome rather than cutting off the retreating German Tenth Army, and the Americans entered Rome on 4 June. In the advance goumiers of the French Expeditionary Corps committed mass rapes of Italian civilians, remembered as the marocchinate.: Tre anfall mot Cassino misslyckades mellan januari och mars. I det fjärde, som inleddes den 11 maj, bröt franska kolonialtrupper igenom Auruncibergen, och den 18 maj hissade soldater ur den polska II kåren sin flagga över klosterruinerna efter en vecka av svåra förluster. Styrkan vid Anzio bröt sig ut den 23 maj, men general Clark vände den mot Rom i stället för att skära av den retirerande tyska 10:e armén, och amerikanerna tågade in i Rom den 4 juni. Under framryckningen begick goumierer ur den franska expeditionskåren massvåldtäkter på italienska civila, ihågkomna som marocchinate.
Behind the lines the occupation grew harsher. In Rome, after a partisan bomb killed 33 German police in the Via Rasella on 23 March, the Germans shot 335 men and boys, prisoners and hostages, at the Ardeatine Caves the next day. Partisan bands formed in the mountains of central and northern Italy, and German troops and Fascist militia answered them with reprisals against villages.: Bakom linjerna blev ockupationen hårdare. I Rom, sedan en partisanbomb dödat 33 tyska poliser på Via Rasella den 23 mars, sköt tyskarna dagen därpå 335 män och pojkar, fångar och gisslan, i Ardeatinska grottorna. Partisangrupper bildades i bergen i mellersta och norra Italien, och tyska trupper och fascistisk milis svarade med repressalier mot byar.
