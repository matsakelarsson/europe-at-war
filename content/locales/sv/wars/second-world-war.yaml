Through the winter of 1944–45 the Partisans, renamed the Yugoslav Army in March, fought a costly positional war against German and Croatian forces on the Syrmian Front west of Belgrade, while the German Army Group E withdrew from Greece through Bosnia. Mostar was taken in February and Sarajevo on 6 April. On 12 April the Yugoslav 1st Army broke through in Syrmia, and in the west the 4th Army advanced up the Adriatic coast and into Istria. It reached Trieste on 1 May, a day before New Zealand troops of the Eighth Army, and held the city for forty days, arresting thousands of people, many of whom were killed, until an agreement in June left it under Allied control.: Under vintern 1944–45 förde partisanerna, som i mars döptes om till Jugoslaviska armén, ett kostsamt ställningskrig mot tyska och kroatiska styrkor vid Syrmienfronten väster om Belgrad, medan den tyska armégrupp E drog sig tillbaka från Grekland genom Bosnien. Mostar intogs i februari och Sarajevo den 6 april. Den 12 april bröt den jugoslaviska 1:a armén igenom i Syrmien, och i väster ryckte 4:e armén fram längs Adriatiska kusten och in i Istrien. Den nådde Trieste den 1 maj, en dag före nyzeeländska trupper ur 8:e armén, och höll staden i fyrtio dagar och arresterade tusentals människor, av vilka många dödades, tills en överenskommelse i juni ställde den under allierad kontroll.
At the end of the war the government and army of the Independent State of Croatia, with tens of thousands of civilians, Slovene Home Guards and Montenegrin Chetniks, fled north to surrender to the British in Austria. On 15 May the British at Bleiburg refused the surrender of the main Croatian column and directed it to the Partisans, and later they handed back many who had already reached Austria. The Yugoslav authorities shot prisoners without trial in their tens of thousands, at Tezno near Maribor, Kočevski Rog, Macelj and many other places, and others died on forced marches to camps. Most of the dead had served in the Axis-aligned forces, but there were civilians among them.: Vid krigsslutet flydde regeringen och armén i Oberoende staten Kroatien, tillsammans med tiotusentals civila, slovenska hemvärnsmän och montenegrinska tjetniker, norrut för att kapitulera inför britterna i Österrike. Den 15 maj vägrade britterna vid Bleiburg att ta emot den kroatiska huvudkolonnens kapitulation och hänvisade den till partisanerna, och senare lämnade de tillbaka många som redan hade nått Österrike. De jugoslaviska myndigheterna sköt fångar utan rättegång i tiotusental, vid Tezno nära Maribor, i Kočevski Rog, Macelj och på många andra platser, och andra dog under tvångsmarscher till läger. De flesta av de döda hade tjänstgjort i styrkor allierade med axelmakterna, men det fanns civila bland dem.
The number of victims is not known. Estimates range widely, from 20,000–40,000 in some historians’ work to 70,000–80,000 in others; the demographer Vladimir Žerjavić calculated 57,000–65,000, and émigré accounts gave figures in the hundreds of thousands. Slovenia has registered more than 600 concealed mass graves from the war and its aftermath. Under communist rule the killings could not be spoken of; since the 1990s the yearly commemoration at Bleiburg has been disputed, over both the numbers and the Ustaša symbols displayed there.: Antalet offer är inte känt. Uppskattningarna varierar kraftigt, från 20 000–40 000 hos vissa historiker till 70 000–80 000 hos andra; demografen Vladimir Žerjavić beräknade 57 000–65 000, och emigrantkällor angav siffror i hundratusental. Slovenien har registrerat mer än 600 dolda massgravar från kriget och tiden efter det. Under kommuniststyret var det omöjligt att tala om morden; sedan 1990-talet har den årliga minneshögtiden i Bleiburg varit omstridd, både när det gäller siffrorna och de ustašasymboler som visas där.
