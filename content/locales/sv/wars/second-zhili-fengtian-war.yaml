Second Zhili–Fengtian War: Andra Zhili–Fengtian-kriget
? The largest of the warlord wars of the 1920s, fought in the autumn of 1924 between the Zhili clique of Cao Kun and Wu Peifu, which controlled the Beijing government, and Zhang Zuolin’s Fengtian clique from the north-east. A war in the lower Yangtze between the Zhili governor of Jiangsu and the Anhui-aligned governor of Zhejiang, which began on 3 September, gave Zhang the occasion for revenge for his defeat of 1922. About 250,000 Fengtian troops, rearmed with Japanese help, attacked the Zhili positions at the Shanhai Pass and in Rehe; Wu Peifu commanded about 200,000. The fighting at the pass was deadlocked when, on the night of 22–23 October, the Zhili general Feng Yuxiang, sent to the Rehe front, marched back to Beijing, seized the capital and arrested President Cao Kun. With Fengtian troops breaking through to the railway behind them, more than 40,000 Zhili soldiers surrendered between Shanhaiguan and Qinhuangdao, and Wu Peifu escaped by sea from Tanggu on 3 November. Feng and Zhang made Duan Qirui provisional chief executive, Feng expelled the last Qing emperor, Puyi, from the Forbidden City, and the Fengtian clique spread its power to the Yangtze.
: Det största av krigsherrekrigen på 1920-talet, utkämpat hösten 1924 mellan Cao Kuns och Wu Peifus Zhiliklick, som kontrollerade regeringen i Peking, och Zhang Zuolins Fengtianklick från nordöstra Kina. Ett krig vid nedre Yangtze mellan Zhiliguvernören i Jiangsu och den Anhuianknutna guvernören i Zhejiang, som började den 3 september, gav Zhang tillfälle att ta revansch för nederlaget 1922. Omkring 250 000 Fengtiansoldater, nyrustade med japansk hjälp, anföll Zhiliställningarna vid Shanhaipasset och i Rehe; Wu Peifu förde befäl över omkring 200 000. Striderna vid passet hade kört fast när Zhiligeneralen Feng Yuxiang, som sänts till Rehefronten, natten mellan den 22 och 23 oktober marscherade tillbaka till Peking, tog huvudstaden och arresterade president Cao Kun. När Fengtiantrupper bröt igenom till järnvägen bakom dem kapitulerade mer än 40 000 Zhilisoldater mellan Shanhaiguan och Qinhuangdao, och Wu Peifu flydde sjövägen från Tanggu den 3 november. Feng och Zhang gjorde Duan Qirui till provisorisk regeringschef, Feng fördrev den siste Qingkejsaren, Puyi, från Förbjudna staden, och Fengtianklicken utsträckte sin makt till Yangtze.
