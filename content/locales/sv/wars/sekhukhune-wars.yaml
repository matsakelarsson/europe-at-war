# Svenska översättningar av katalogtexten (våg 13); stegtexterna kommer senare.
Sekhukhune wars: Sekhukhunekrigen
? The wars in which the Pedi kingdom of Sekhukhune, in the Leolo mountains of the eastern Transvaal, resisted first the South African Republic and then the British. The Pedi, ruled by the Maroteng dynasty from their capital Tsate, had rebuilt their power after the wars of the 1820s; many of their young men worked at the Kimberley diamond fields and came home with guns. Disputes over land, labour and tax led President Thomas Burgers to declare war in May 1876. The Republic’s commandos and their Swazi allies failed to take Tsate in August, and a war of forts and raids ended in an uneasy peace in February 1877. The Republic’s failure helped Britain justify its annexation of the Transvaal in April 1877, and the British in turn demanded Sekhukhune’s submission; their campaigns of 1878 also failed. After the Anglo-Zulu War, Sir Garnet Wolseley attacked with about 2,000 British and colonial troops and some 8,000 to 10,000 Swazi, and on 28 November 1879 Tsate was stormed with heavy loss of life. Sekhukhune was captured on 2 December and imprisoned in Pretoria; released after the Transvaal regained its independence in 1881, he was murdered by his rival Mampuru in 1882.
: De krig där Sekhukhunes Pedirike i Leolobergen i östra Transvaal gjorde motstånd först mot Sydafrikanska republiken och sedan mot britterna. Pedi, som styrdes av Marotengdynastin från huvudstaden Tsate, hade återuppbyggt sin makt efter krigen på 1820-talet; många av deras unga män arbetade vid diamantfälten i Kimberley och kom hem med gevär. Tvister om mark, arbetskraft och skatt fick president Thomas Burgers att förklara krig i maj 1876. Republikens kommandon och dess swaziska bundsförvanter misslyckades med att inta Tsate i augusti, och ett krig av fort och räder slutade med en osäker fred i februari 1877. Republikens misslyckande hjälpte Storbritannien att rättfärdiga sin annektering av Transvaal i april 1877, och britterna krävde i sin tur Sekhukhunes underkastelse; även deras fälttåg 1878 misslyckades. Efter Zulukriget anföll Sir Garnet Wolseley med omkring 2 000 brittiska och koloniala soldater och omkring 8 000 till 10 000 swazier, och den 28 november 1879 stormades Tsate under stora förluster i människoliv. Sekhukhune tillfångatogs den 2 december och fängslades i Pretoria; han frigavs sedan Transvaal återfått sin självständighet 1881 men mördades av sin rival Mampuru 1882.
