# Svenska översättningar av katalogtexten (våg 10); stegtexterna kommer senare.
Sekigahara campaign: Sekigaharafälttåget
? The war of 1600 in which Tokugawa Ieyasu defeated a coalition of daimyo loyal to the Toyotomi house and made himself master of Japan. When Toyotomi Hideyoshi died in 1598, leaving a five-year-old heir, Hideyori, power passed to a council of five regents, of whom Ieyasu was by far the strongest, and five commissioners led by Ishida Mitsunari. In the summer of 1600 Ieyasu led an army north-east against Uesugi Kagekatsu of Aizu, whom he accused of preparing war. In his absence Ishida raised the western daimyo in Hideyori’s name, with Mōri Terumoto as nominal commander-in-chief in Osaka Castle, and took Fushimi Castle and other strongholds of Ieyasu’s allies around Kyoto. Ieyasu turned back. His allies took Gifu Castle in late September, and on 21 October 1600 the Eastern and Western armies, each of perhaps 80,000 to 90,000 men, met at Sekigahara in Mino, where the defection of Kobayakawa Hideaki decided a battle of a few hours. Ishida, Konishi Yukinaga and Ankokuji Ekei were executed in Kyoto. In the north the Uesugi failed to take Hasedō from the Mogami and withdrew, and in Kyushu Kuroda Josui and Katō Kiyomasa overran the lands of western daimyo. Ieyasu confiscated or reduced the domains of some 90 daimyo, kept Hideyori as a mere great lord in Osaka, and in 1603 was appointed shogun, founding the Tokugawa shogunate that ruled Japan until 1867.
: Kriget år 1600 där Tokugawa Ieyasu besegrade en koalition av daimyo som var lojala mot Toyotomihuset och gjorde sig till herre över Japan. När Toyotomi Hideyoshi dog 1598 och lämnade efter sig en femårig arvinge, Hideyori, övergick makten till ett råd av fem regenter, av vilka Ieyasu var den överlägset mäktigaste, och fem kommissarier under ledning av Ishida Mitsunari. Sommaren 1600 ledde Ieyasu en armé mot nordöst mot Uesugi Kagekatsu i Aizu, som han anklagade för att förbereda krig. I hans frånvaro mobiliserade Ishida daimyo i väst i Hideyoris namn, med Mōri Terumoto som nominell överbefälhavare i Osaka slott, och intog Fushimi slott och andra fästen som tillhörde Ieyasus allierade kring Kyoto. Ieyasu vände om. Hans allierade intog Gifu slott i slutet av september, och den 21 oktober 1600 möttes den östra och den västra armén, var och en på kanske 80 000 till 90 000 man, vid Sekigahara i Mino, där Kobayakawa Hideakis avhopp avgjorde ett slag som varade några timmar. Ishida, Konishi Yukinaga och Ankokuji Ekei avrättades i Kyoto. I norr misslyckades Uesugi med att inta Hasedō från Mogami och drog sig tillbaka, och på Kyushu överskred Kuroda Josui och Katō Kiyomasa länderna som tillhörde daimyo i väst. Ieyasu konfiskerade eller minskade omkring 90 daimyos domäner, lät Hideyori sitta kvar i Osaka som blott en stor herre och utnämndes 1603 till shogun, varmed han grundade Tokugawashogunatet, som styrde Japan fram till 1867.
