# Svenska översättningar av katalogtexten (våg 7); stegtexterna kommer senare.
Seljuk conquest of Iran and Baghdad: Seldjukernas erövring av Iran och Bagdad
The fifteen years after the battle of Dandanaqan in which the Seljuk Turkmen under Tughril Beg conquered the Iranian plateau from the Kakuyids, the Buyids and other local dynasties. Tughril took Gorgan, Rayy and Khwarazm in 1041–1043, made Rayy his capital, besieged and took Isfahan in 1050–1051, and in 1054 brought the princes of Azerbaijan under his rule. Invited by the caliph al-Qa’im, he entered Baghdad on 18 December 1055 and imprisoned the last Buyid ruler of Iraq, becoming the protector of the Abbasid caliphate.: De femton åren efter slaget vid Dandanaqan, då seldjukturkmenerna under Tughril Beg erövrade den iranska högplatån från kakuyiderna, buyiderna och andra lokala dynastier. Tughril intog Gorgan, Rayy och Khwarazm 1041–1043, gjorde Rayy till sin huvudstad, belägrade och intog Isfahan 1050–1051 och förde 1054 furstarna i Azerbajdzjan under sitt styre. På inbjudan av kalifen al-Qa’im tågade han in i Bagdad den 18 december 1055 och fängslade den siste buyidiske härskaren i Irak, och därmed blev han det abbasidiska kalifatets beskyddare.
