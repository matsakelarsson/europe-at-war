Leopold: Leopold
Leopold’s brother Albert III carried on the war on behalf of Leopold’s young sons. The Confederates took Weesen on the Walensee in August 1386, and in March 1387 the people of Glarus declared themselves free of Habsburg rule. Bern, which had stayed out of the fighting at Sempach, seized Habsburg towns and castles around it. On the night of 21–22 February 1388, remembered as the Murder Night of Weesen, Habsburg troops took Weesen back by surprise.: Leopolds bror Albrekt III förde kriget vidare för Leopolds unga söners räkning. De edsförbundna intog Weesen vid Walensee i augusti 1386, och i mars 1387 förklarade sig folket i Glarus fritt från habsburgskt styre. Bern, som hade hållit sig utanför striderna vid Sempach, lade beslag på habsburgska städer och borgar i sin omgivning. Natten mellan den 21 och 22 februari 1388, ihågkommen som mordnatten i Weesen, återtog habsburgska trupper Weesen genom en överrumpling.
In early April two Habsburg columns set out to subdue Glarus. On 9 April 1388 the main army, perhaps 5,000 strong, stormed the earthwork wall at Näfels, held by about 400 men of Glarus and a few from Schwyz and Uri. As the attackers scattered to plunder, the defenders fell on them from the hillside. The Habsburg troops fled towards Weesen, a bridge collapsed under them, and many drowned; Glarus lost 54 men. On 1 April 1389 Albert agreed to a seven-year peace, extended in 1394 for twenty years, which left the Confederates what they had won.: I början av april gav sig två habsburgska kolonner av för att kuva Glarus. Den 9 april 1388 stormade huvudhären, kanske 5 000 man stark, jordvallen vid Näfels, som hölls av omkring 400 män från Glarus och några få från Schwyz och Uri. När angriparna skingrades för att plundra föll försvararna över dem från sluttningen. De habsburgska trupperna flydde mot Weesen, en bro rasade under dem, och många drunknade; Glarus förlorade 54 man. Den 1 april 1389 gick Albrekt med på en sjuårig fred, som 1394 förlängdes med tjugo år och som lät de edsförbundna behålla det de hade vunnit.
