Sempach War: Sempachkriget
A war between the Swiss Confederates and the Habsburg dukes of Austria, set off by Lucerne’s expansion into Habsburg lands. Duke Leopold III was killed with many of his nobles at Sempach in 1386, Glarus won its freedom at Näfels in 1388, and the peace of 1389 left the Confederates their gains.: Ett krig mellan de schweiziska edsförbundna och de habsburgska hertigarna av Österrike, utlöst av Luzerns expansion in i habsburgska områden. Hertig Leopold III stupade tillsammans med många av sina adelsmän vid Sempach 1386, Glarus vann sin frihet vid Näfels 1388, och freden 1389 lät edsförbundet behålla sina vinster.
