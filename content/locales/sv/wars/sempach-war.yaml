Dates are Julian, as usual for the period. Few accounts of the battles were written before about 1470, and many details, including the story of Arnold von Winkelried, come from Swiss chronicles of around 1500.: Datumen anges enligt den julianska kalendern, som är brukligt för perioden. Få skildringar av slagen skrevs före omkring 1470, och många detaljer, däribland berättelsen om Arnold von Winkelried, kommer från schweiziska krönikor från omkring 1500.
The Confederacy then had eight members, Uri, Schwyz, Unterwalden, Lucerne, Zurich, Glarus, Zug and Bern. Bern took no part at Sempach but used the war to take Habsburg lands around it.: "Edsförbundet hade då åtta medlemmar: Uri, Schwyz, Unterwalden, Luzern, Zürich, Glarus, Zug och Bern. Bern deltog inte vid Sempach men utnyttjade kriget för att lägga beslag på habsburgska områden i sin omgivning."
Lucerne had joined the Confederacy in 1332 but was still ringed by Habsburg lands, and in the 1380s it set out to build a territory of its own. In 1385 its men and those of Zurich and Zug attacked Habsburg strongholds such as Rothenburg and Wolhusen. Lucerne had already taken the people of the Entlebuch into its citizenship, and in January 1386 it did the same for the town of Sempach. Duke Leopold III of Austria gathered knights from the Aargau, Alsace, Swabia and Tyrol, with mercenaries, at Brugg. Instead of attacking Zurich, as the Confederates expected, he marched south, burning Willisau and the harvest on his way.: Luzern hade anslutit sig till edsförbundet 1332 men var fortfarande omringat av habsburgska områden, och på 1380-talet började staden bygga upp ett eget territorium. År 1385 anföll dess män tillsammans med män från Zürich och Zug habsburgska fästen som Rothenburg och Wolhusen. Luzern hade redan tagit upp folket i Entlebuch som borgare, och i januari 1386 gjorde staden detsamma med staden Sempach. Hertig Leopold III av Österrike samlade riddare från Aargau, Elsass, Schwaben och Tyrolen, tillsammans med legosoldater, vid Brugg. I stället för att anfalla Zürich, som de edsförbundna väntade sig, marscherade han söderut och brände Willisau och skörden längs vägen.
On 9 July 1386 the men of Lucerne, Uri, Schwyz and Unterwalden, hurrying back from Zurich, met Leopold’s army near Sempach, by the village of Hildisrieden. On ground unsuited to horses the knights fought on foot. After hard fighting the Confederates broke their line, and Leopold and a great many nobles were killed. Swiss tradition later credited the breakthrough to Arnold von Winkelried, who gathered the enemy’s spears into his own body. The defeat broke Habsburg power west of the Rhine, and Lucerne, Bern and Solothurn took over many of its towns and lands.: Den 9 juli 1386 mötte männen från Luzern, Uri, Schwyz och Unterwalden, som skyndade tillbaka från Zürich, Leopolds här nära Sempach, vid byn Hildisrieden. På en terräng som inte passade för hästar stred riddarna till fots. Efter hårda strider bröt de edsförbundna deras linje, och Leopold och mycket många adelsmän stupade. Enligt senare schweizisk tradition var det Arnold von Winkelried som åstadkom genombrottet genom att samla fiendens spjut i sin egen kropp. Nederlaget bröt den habsburgska makten väster om Rhen, och Luzern, Bern och Solothurn tog över många av dess städer och områden.
