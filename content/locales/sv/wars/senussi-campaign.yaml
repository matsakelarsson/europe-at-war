# Svenska översättningar av katalogtexten (våg 12); stegtexterna kommer senare.
Senussi campaign: Senussifälttåget
The war of the Senussi, the Sufi order that led the resistance to Italy in Cyrenaica, against Italy and Britain during the First World War. Libyan fighters drove the Italians out of the Fezzan in 1914 and defeated a large Italian column at Gasr Bu Hadi near Sirte in April 1915, after which Italy held little more than a few coastal towns. Urged on by Ottoman officers and supplied by German submarines, the head of the order, Sayyid Ahmed al-Sharif, declared jihad and in November 1915 attacked Egypt, then a British protectorate. A British Empire force drove the Senussi back from the coast in battles from December 1915 to February 1916 and retook Sollum in March. Sayyid Ahmed’s occupation of the oases of the Western Desert was undone in 1916, and after a British raid on Siwa in February 1917 he handed the leadership to his cousin Muhammad Idris, who made peace with Britain and Italy at Akrama in April 1917. Idris became king of independent Libya in 1951.: Det krig som senussiorden, den sufiska orden som ledde motståndet mot Italien i Cyrenaika, förde mot Italien och Storbritannien under första världskriget. Libyska krigare drev ut italienarna ur Fezzan 1914 och besegrade en stor italiensk kolonn vid Gasr Bu Hadi nära Sirte i april 1915, varefter Italien inte behärskade mycket mer än några kuststäder. Uppmuntrad av osmanska officerare och försörjd av tyska ubåtar utlyste ordens ledare, Sayyid Ahmed al-Sharif, jihad och anföll i november 1915 Egypten, då ett brittiskt protektorat. En styrka från Brittiska imperiet drev tillbaka senussierna från kusten i strider från december 1915 till februari 1916 och återtog Sollum i mars. Sayyid Ahmeds ockupation av oaserna i Västra öknen bröts 1916, och efter en brittisk räd mot Siwa i februari 1917 lämnade han över ledarskapet till sin kusin Muhammad Idris, som slöt fred med Storbritannien och Italien i Akrama i april 1917. Idris blev kung av det självständiga Libyen 1951.
