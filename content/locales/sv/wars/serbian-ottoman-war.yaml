Dates are New Style (Gregorian). Serbia used the Julian calendar, then 12 days behind, so Serbian accounts date the declaration of war 18 June 1876 and the capture of Niš 29–30 December 1877. Some dates of the 1876 campaign appear in either style in the literature.: Datumen anges enligt nya stilen (gregorianska kalendern). Serbien använde den julianska kalendern, som då låg 12 dagar efter, så serbiska källor daterar krigsförklaringen till 18 juni 1876 och intagandet av Niš till 29–30 december 1877. Vissa datum från fälttåget 1876 förekommer i litteraturen enligt båda stilarna.
The Russo-Turkish War of 1877–1878, the Montenegrin–Ottoman War of 1876–1878 and the Herzegovina Uprising have their own entries.: Rysk-turkiska kriget 1877–1878, montenegrinsk-osmanska kriget 1876–1878 och upproret i Hercegovina har egna artiklar.
Serbia and Montenegro, which had armed and aided the rebels in Herzegovina and Bosnia, declared war on the Ottoman Empire on 30 June 1876, a month after Sultan Abdülaziz was deposed. Prince Milan’s main army, about 45,000 men with its volunteers, gathered at Aleksinac under the Russian general Mikhail Chernyayev, conqueror of Tashkent. It advanced down the Nišava valley towards Sofia, while smaller forces crossed the Drina towards Bijeljina and the Timok towards Vidin. The Serbian militia, poorly trained and armed with a mixture of old rifles, was driven back on every front within weeks.: Serbien och Montenegro, som hade beväpnat och understött rebellerna i Hercegovina och Bosnien, förklarade Osmanska riket krig den 30 juni 1876, en månad efter att sultan Abdülaziz hade avsatts. Furst Milans huvudarmé, omkring 45 000 man inklusive frivilliga, samlades vid Aleksinac under den ryske generalen Michail Tjernjajev, Tasjkents erövrare. Den ryckte fram nedför Nišavadalen mot Sofia, medan mindre styrkor gick över Drina mot Bijeljina och Timok mot Vidin. Den serbiska milisen, dåligt utbildad och beväpnad med en blandning av gamla gevär, drevs tillbaka på alla fronter inom några veckor.
From Vidin, Osman Pasha took Zaječar and Knjaževac in the Timok valley, where villages were burned and civilians killed. The main Ottoman army under Abdülkerim Pasha advanced from Niš up the Morava. A Serbian redoubt at Šumatovac near Aleksinac held on 23 August, but the Ottomans pushed along the river’s west bank; among the thousands of Russian volunteers, Colonel Nikolai Raevsky was killed at Adrovac. On 29 October they broke the line at Đunis, opening the road north. Russia gave the Porte a 48-hour ultimatum, an armistice followed on 1 November, and the peace of early 1877 restored the pre-war border.: Från Vidin intog Osman pasha Zaječar och Knjaževac i Timokdalen, där byar brändes och civila dödades. Den osmanska huvudarmén under Abdülkerim pasha ryckte fram från Niš uppför Morava. En serbisk skans vid Šumatovac nära Aleksinac höll stånd den 23 augusti, men osmanerna trängde fram längs flodens västra strand; bland de tusentals ryska frivilliga stupade överste Nikolaj Rajevskij vid Adrovac. Den 29 oktober bröt de linjen vid Đunis och öppnade vägen norrut. Ryssland ställde ett 48-timmarsultimatum till Höga porten, ett vapenstillestånd följde den 1 november, och freden i början av 1877 återställde förkrigsgränsen.
