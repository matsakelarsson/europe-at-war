Serbia stayed out of the Russo-Turkish War until the Russians had nearly taken Plevna. With Russian money it rebuilt its army in five corps, nearly 90,000 men, and on 13 December 1877, three days after Plevna fell, it declared war again. Under Prince Milan, with General Kosta Protić in effective command, the main force struck south and surrounded Niš within days, while a column took Kuršumlija to cut the road from Kosovo, and Pirot fell on 28 December. Niš surrendered on 11 January 1878. A planned advance into the Sanjak of Novi Pazar was called off under Austro-Hungarian pressure.: Serbien höll sig utanför rysk-turkiska kriget tills ryssarna nästan hade intagit Plevna. Med ryska pengar byggde landet upp sin armé på nytt i fem kårer, nästan 90 000 man, och den 13 december 1877, tre dagar efter Plevnas fall, förklarade det krig på nytt. Under furst Milan, med general Kosta Protić som faktisk befälhavare, slog huvudstyrkan till söderut och inneslöt Niš inom några dagar, medan en kolonn intog Kuršumlija för att skära av vägen från Kosovo, och Pirot föll den 28 december. Niš kapitulerade den 11 januari 1878. En planerad framryckning in i sandjaken Novi Pazar avbröts under österrikisk-ungerska påtryckningar.
Serbian troops took Vranje on 31 January and pushed on towards Preševo and Vitina in Kosovo and into the Bulgarian lands around Trn and Kyustendil before an armistice in early February. The Treaty of San Stefano gave Serbia Niš but assigned Pirot and Vranje to a large Bulgaria; at the Congress of Berlin Serbia won full independence and kept Niš, Pirot, Toplica and Vranje. Tens of thousands of Albanians and other Muslims fled or were driven out of these districts, between 49,000 and 130,000 by different estimates, many to Kosovo, where Serbs then suffered reprisals.: Serbiska trupper intog Vranje den 31 januari och trängde vidare mot Preševo och Vitina i Kosovo och in i de bulgariska områdena kring Trn och Kjustendil innan ett vapenstillestånd ingicks i början av februari. Freden i San Stefano gav Serbien Niš men tilldelade Pirot och Vranje ett stort Bulgarien; vid Berlinkongressen vann Serbien full självständighet och behöll Niš, Pirot, Toplica och Vranje. Tiotusentals albaner och andra muslimer flydde eller fördrevs från dessa distrikt, mellan 49 000 och 130 000 enligt olika uppskattningar, många till Kosovo, där serber sedan utsattes för repressalier.
