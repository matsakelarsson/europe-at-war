Serbian–Ottoman Wars of 1876–1878: Serbisk-osmanska krigen 1876–1878
Two wars between the Principality of Serbia and the Ottoman Empire during the Great Eastern Crisis. In 1876 Serbia, with Montenegro, went to war in support of the rising in Bosnia and Herzegovina and was beaten at Đunis, saved only by a Russian ultimatum; in December 1877, as Russia was winning its own war, Serbia attacked again and took Niš, Pirot and Vranje, which it kept, with full independence, at the Congress of Berlin.: Två krig mellan furstendömet Serbien och Osmanska riket under den stora orientaliska krisen. År 1876 gick Serbien, tillsammans med Montenegro, i krig till stöd för upproret i Bosnien och Hercegovina och besegrades vid Đunis, räddat endast av ett ryskt ultimatum; i december 1877, när Ryssland höll på att vinna sitt eget krig, anföll Serbien igen och intog Niš, Pirot och Vranje, som landet fick behålla, tillsammans med full självständighet, vid Berlinkongressen.
