Dates are New Style (Gregorian). The Serbs used the Julian calendar, then 12 days behind, so Serbian accounts date the Orašac assembly 2 February 1804 and the Takovo rising 11 April 1815. Some battle dates are given in either style in the literature; uncertain ones are given here only by month.: Datumen anges enligt nya stilen (gregorianska kalendern). Serberna använde den julianska kalendern, som då låg 12 dagar efter, så serbiska källor daterar mötet i Orašac till 2 februari 1804 och resningen i Takovo till 11 april 1815. Vissa slagdatum anges i litteraturen enligt båda stilarna; osäkra datum anges här endast med månad.
The Russo-Turkish War of 1806–1812, in which Russian troops fought beside the rebels, has its own entry. Numbers of fighters, dead and refugees come from contemporary and national accounts and are often uncertain.: Rysk-turkiska kriget 1806–1812, där ryska trupper stred sida vid sida med rebellerna, har en egen artikel. Uppgifter om antalet kämpar, döda och flyktingar kommer från samtida och nationella källor och är ofta osäkra.
The term “Serbian Revolution” was coined by the German historian Leopold von Ranke in 1829. Here it covers the two risings and the road to recognised autonomy in 1830–1833.: Begreppet ”den serbiska revolutionen” myntades av den tyske historikern Leopold von Ranke 1829. Här omfattar det de två resningarna och vägen till erkänd autonomi 1830–1833.
In December 1801 four janissary commanders, the Dahije, murdered Hadži Mustafa Pasha, the sultan’s governor of Belgrade, and divided the pashalik between them in defiance of Selim III. Their rule brought heavy taxes, forced labour and violence. Fearing that the sultan would use the Serbs against them, in January and February 1804 they killed between 70 and 150 village headmen (knezes), priests and traders, the “Slaughter of the Knezes”. On 14 February the survivors met at Orašac in Šumadija and chose Đorđe Petrović, a livestock trader and former Habsburg Free Corps soldier known as Karađorđe (“Black George”), to lead a rising.: I december 1801 mördade fyra janitsharbefälhavare, dahije, Hadži Mustafa pasha, sultanens guvernör i Belgrad, och delade upp pashaliken mellan sig i trots mot Selim III. Deras styre förde med sig tunga skatter, tvångsarbete och våld. Av fruktan för att sultanen skulle använda serberna mot dem dödade de i januari och februari 1804 mellan 70 och 150 byhövdingar (knezer), präster och handelsmän, den så kallade ”knezernas slakt”. Den 14 februari möttes de överlevande i Orašac i Šumadija och valde Đorđe Petrović, en boskapshandlare och före detta soldat i den habsburgska frikåren, känd som Karađorđe (”Svarte Đorđe”), att leda en resning.
Claiming at first to fight for the sultan against the renegades, the rebels took Šumadija, Požarevac and Šabac within months, leaving the Dahije only Belgrade. The four fled down the Danube to the island of Ada Kaleh, where Milenko Stojković’s men caught and beheaded them in August. But the Serbs, meeting at Ostružnica, would not disarm without guarantees and sought Russian and Austrian protection. In 1805 Selim ordered Hafiz Pasha of Niš to crush them. On 18 August Stojković and Karađorđe beat his army at Ivankovac, the first Serbian victory over regular Ottoman troops, and in November the rebels took Smederevo, their first capital.: Rebellerna, som till en början hävdade att de stred för sultanen mot överlöparna, intog Šumadija, Požarevac och Šabac inom några månader och lämnade endast Belgrad åt dahije. De fyra flydde nedför Donau till ön Ada Kaleh, där Milenko Stojkovićs män grep och halshögg dem i augusti. Men serberna, som samlades i Ostružnica, ville inte avväpna sig utan garantier och sökte ryskt och österrikiskt beskydd. År 1805 beordrade Selim Hafiz pasha av Niš att krossa dem. Den 18 augusti besegrade Stojković och Karađorđe hans armé vid Ivankovac, den första serbiska segern över reguljära osmanska trupper, och i november intog rebellerna Smederevo, deras första huvudstad.
