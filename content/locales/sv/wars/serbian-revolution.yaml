Hurshid Pasha: Hurshid pasha
By the Treaty of Bucharest of May 1812, signed weeks before Napoleon invaded Russia, Russia withdrew from the Balkans. Its eighth article promised the Serbs an amnesty and self-government, but the Ottomans were to reoccupy the fortresses and towns, and forts built since 1804 were to be razed. Karađorđe refused, and the rebels, weakened by feuds that had led him to exile his rivals Petar Dobrnjac and Milenko Stojković, stood alone. In the summer of 1813 Ottoman armies, largely Bosnian and Albanian, invaded from Niš, Vidin and Bosnia. At Negotin Hajduk Veljko held out against a much larger force until he was killed in July.: Genom freden i Bukarest i maj 1812, undertecknad några veckor innan Napoleon invaderade Ryssland, drog sig Ryssland tillbaka från Balkan. Dess åttonde artikel lovade serberna amnesti och självstyre, men osmanerna skulle åter besätta fästningarna och städerna, och fästen som byggts sedan 1804 skulle raseras. Karađorđe vägrade, och rebellerna, försvagade av fejder som hade lett till att han landsförvisat sina rivaler Petar Dobrnjac och Milenko Stojković, stod ensamma. Sommaren 1813 invaderade osmanska arméer, till stor del bosniska och albanska, från Niš, Vidin och Bosnien. Vid Negotin höll Hajduk Veljko stånd mot en mycket större styrka tills han stupade i juli.
In early October Karađorđe and other leaders crossed into Austria with a great many refugees, as many as 100,000 by one estimate, and Belgrade fell. The reconquest brought burned villages, executions and enslavement; on one day in October 1813, 1,800 women and children were reportedly sold at Belgrade. Hurshid Pasha then proclaimed an amnesty, and some commanders submitted, among them Miloš Obrenović, who was made knez of the Rudnik district. A rising led by Hadži Prodan in the Požega district in September 1814 failed, and the Ottomans answered with more killings, impaling some 200 prisoners in Belgrade.: I början av oktober gick Karađorđe och andra ledare över till Österrike med mycket stora mängder flyktingar, enligt en uppskattning så många som 100 000, och Belgrad föll. Återerövringen förde med sig brända byar, avrättningar och slaveri; en enda dag i oktober 1813 ska 1 800 kvinnor och barn ha sålts i Belgrad. Hurshid pasha utlyste sedan en amnesti, och en del befälhavare underkastade sig, bland dem Miloš Obrenović, som blev knez över distriktet Rudnik. En resning under ledning av Hadži Prodan i distriktet Požega i september 1814 misslyckades, och osmanerna svarade med fler mord och spetsade omkring 200 fångar på pålar i Belgrad.
