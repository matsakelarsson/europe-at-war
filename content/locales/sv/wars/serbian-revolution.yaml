Karađorđe: Karađorđe
Held by the Serbian rebels, 1805 (approximate): I de serbiska rebellernas händer 1805 (ungefärligt)
In 1806 the Porte sent armies against the rebels from two sides. From Bosnia came sipahi cavalry and Bosnian levies, which Karađorđe met at Mišar near Šabac. From 13 to 15 August his infantry held a square earthwork on the hill against repeated charges, until the Serbian cavalry under Luka Lazarević and Miloš Obrenović struck the attackers in the flank and routed them. In the south a larger army under Ibrahim Pasha of Scutari was beaten at Deligrad on the Morava in early September and agreed to a truce. Meanwhile the envoy Petar Ičko won the Porte’s agreement to wide Serbian autonomy.: År 1806 sände Höga porten arméer mot rebellerna från två håll. Från Bosnien kom sipahikavalleri och bosniska uppbåd, som Karađorđe mötte vid Mišar nära Šabac. Den 13–15 augusti höll hans infanteri en fyrkantig jordskans på höjden mot upprepade anfall, tills det serbiska kavalleriet under Luka Lazarević och Miloš Obrenović föll angriparna i flanken och drev dem på flykt. I söder besegrades en större armé under Ibrahim pasha av Scutari vid Deligrad vid Morava i början av september och gick med på ett stillestånd. Under tiden vann sändebudet Petar Ičko Höga portens samtycke till en långtgående serbisk autonomi.
In December the rebels broke into the town of Belgrade, and Russia went to war with the Ottomans. Promised Russian help, Karađorđe rejected Ičko’s Peace and fought on for independence. The capture of Belgrade was followed by a massacre of its Muslim inhabitants, among them the garrison of the citadel, attacked as it left under a promise of safe conduct in early 1807; women and children were forcibly baptised. In July 1807 Russian troops joined the Serbs to beat the Ottomans at Malajnica near Negotin. The rebel state abolished the Ottoman landholders’ feudal dues.: I december bröt sig rebellerna in i staden Belgrad, och Ryssland gick i krig mot osmanerna. Med löfte om rysk hjälp förkastade Karađorđe Ičkos fred och fortsatte kampen för självständighet. Intagandet av Belgrad följdes av en massaker på stadens muslimska invånare, bland dem citadellets garnison, som anfölls när den i början av 1807 lämnade staden med löfte om fri lejd; kvinnor och barn tvångsdöptes. I juli 1807 förenade sig ryska trupper med serberna och besegrade osmanerna vid Malajnica nära Negotin. Rebellstaten avskaffade de osmanska godsägarnas feodala avgifter.
