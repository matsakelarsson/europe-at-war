An Ottoman garrison held the fortress, the last sign of the sultan’s rule in Serbia, until it withdrew in 1867.: En osmansk garnison höll fästningen, det sista tecknet på sultanens styre i Serbien, tills den drogs tillbaka 1867.
Chief town of the Krajina district, one of the six districts handed to Serbia in 1833.: Huvudort i distriktet Krajina, ett av de sex distrikt som överlämnades till Serbien 1833.
