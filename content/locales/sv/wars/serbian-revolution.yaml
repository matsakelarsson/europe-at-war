Serbian Revolution: Serbiska revolutionen
Two risings of the Serbs of the Pashalik of Belgrade against Ottoman rule. The First Serbian Uprising under Karađorđe (1804–1813) began against renegade janissaries, won battles at Ivankovac, Mišar and Deligrad and built a de facto independent state, but collapsed when Russia made peace in 1812; the Second Uprising under Miloš Obrenović (1815) won self-government, recognised by the sultan’s decrees of 1830 and 1833 as an autonomous Principality of Serbia.: Två resningar av serberna i pashaliken Belgrad mot det osmanska styret. Det första serbiska upproret under Karađorđe (1804–1813) riktades först mot upproriska janitsharer, vann slag vid Ivankovac, Mišar och Deligrad och byggde upp en de facto självständig stat, men föll samman när Ryssland slöt fred 1812. Det andra upproret under Miloš Obrenović (1815) vann självstyre, som sultanens dekret 1830 och 1833 erkände som ett autonomt furstendöme Serbien.
