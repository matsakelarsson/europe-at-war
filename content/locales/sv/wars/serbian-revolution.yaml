Ottoman rule brought new taxes and reprisals, and Serbian leaders feared another massacre of the knezes. On 23 April 1815, Palm Sunday, an assembly at Takovo near Gornji Milanovac proclaimed a new rising and chose Miloš Obrenović to lead it. The rebels took Rudnik and in May routed a force of some 7,000 under Imšir Pasha on Ljubić hill outside Čačak, killing its commander. Over the summer they won at Palež, Valjevo, Kragujevac, Jagodina and Požarevac, and in July they stormed the entrenched camp of a Bosnian army at Dublje in Mačva, the last battle of the rising.: Det osmanska styret förde med sig nya skatter och repressalier, och serbiska ledare fruktade en ny massaker på knezerna. Den 23 april 1815, palmsöndagen, utropade en församling i Takovo nära Gornji Milanovac en ny resning och valde Miloš Obrenović att leda den. Rebellerna intog Rudnik och drev i maj en styrka på omkring 7 000 man under Imšir pasha på flykt på Ljubićhöjden utanför Čačak och dödade dess befälhavare. Under sommaren segrade de vid Palež, Valjevo, Kragujevac, Jagodina och Požarevac, och i juli stormade de en bosnisk armés förskansade läger vid Dublje i Mačva, resningens sista slag.
Larger Ottoman armies were gathering in Bosnia under Hurshid Pasha and in Rumelia under Marashli Ali Pasha, but after Napoleon’s final defeat the Porte feared a new Russian intervention. Miloš, a cautious diplomat, avoided battle with the main armies and negotiated with both pashas. In the autumn of 1815 Marashli Ali Pasha, the new governor of Belgrade, accepted an unwritten settlement under which Serbian knezes would collect the taxes and a Serbian national chancery would sit beside the pasha’s court. Ottoman garrisons stayed in Belgrade and other towns. The terms were close to those Karađorđe had refused in 1807.: Större osmanska arméer samlades i Bosnien under Hurshid pasha och i Rumelien under Marashli Ali pasha, men efter Napoleons slutliga nederlag fruktade Höga porten ett nytt ryskt ingripande. Miloš, en försiktig diplomat, undvek strid med huvudarméerna och förhandlade med båda pashorna. Hösten 1815 godtog Marashli Ali pasha, den nye guvernören i Belgrad, en muntlig uppgörelse enligt vilken serbiska knezer skulle driva in skatterna och ett serbiskt nationellt kansli skulle verka vid sidan av pashans domstol. Osmanska garnisoner blev kvar i Belgrad och andra städer. Villkoren låg nära dem som Karađorđe hade förkastat 1807.
