When the Russo-Turkish war flared again in 1809, Karađorđe struck south-west into the Sanjak of Novi Pazar, hoping to open a corridor to Montenegro and the Adriatic. His men took Sjenica in May and the town of Novi Pazar in June, but not its fortress. In the south-east some 10,000 rebels dug in around the Ottoman fortress of Niš, but their commanders quarrelled and their trenches were poorly supported. On 31 May, after Ottoman reinforcements arrived from Rumelia, the redoubt on Čegar hill was stormed. Its commander, Stevan Sinđelić, fired into the powder magazine, killing himself, his men and many of the attackers.: När det rysk-turkiska kriget blossade upp igen 1809 slog Karađorđe till mot sydväst in i sandjaken Novi Pazar i hopp om att öppna en korridor till Montenegro och Adriatiska havet. Hans män intog Sjenica i maj och staden Novi Pazar i juni, men inte dess fästning. I sydost grävde omkring 10 000 rebeller ned sig runt den osmanska fästningen Niš, men deras befälhavare grälade och deras skyttegravar hade dåligt understöd. Den 31 maj, sedan osmanska förstärkningar anlänt från Rumelien, stormades skansen på Čegarhöjden. Dess befälhavare, Stevan Sinđelić, sköt in i krutförrådet och dödade sig själv, sina män och många av angriparna.
Hurshid Pasha had the skulls of the dead Serbs built into a tower beside the Constantinople road at Niš; 952 were set in its walls. His army advanced down the Morava towards Belgrade, and thousands of people fled across the Danube into Austria, until Russian attacks south of the Danube in September drew the Ottomans off. Karađorđe’s appeals to Napoleon and to Vienna came to nothing. In 1810 Russian troops came back to Serbia, and in September Serbs and Russians under General Joseph O’Rourke beat Hurshid at Varvarin. In October a Bosnian army that had crossed the Drina was thrown back at Loznica.: Hurshid pasha lät mura in de döda serbernas skallar i ett torn vid vägen till Konstantinopel vid Niš; 952 sattes in i dess murar. Hans armé ryckte fram nedför Morava mot Belgrad, och tusentals människor flydde över Donau in i Österrike, tills ryska anfall söder om Donau i september drog bort osmanerna. Karađorđes vädjanden till Napoleon och till Wien ledde ingenstans. År 1810 återvände ryska trupper till Serbien, och i september besegrade serber och ryssar under general Joseph O’Rourke Hurshid vid Varvarin. I oktober kastades en bosnisk armé som hade gått över Drina tillbaka vid Loznica.
