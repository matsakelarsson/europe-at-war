Miloš’s men, advancing behind wooden shields, stormed the Bosnian camp in Mačva with few losses.: Milošs män, som ryckte fram bakom träsköldar, stormade det bosniska lägret i Mačva med små förluster.
Autumn 1815: hösten 1815
Miloš and Marashli Ali Pasha agreed the terms of Serbian self-government by word of mouth; the sultan’s decrees of 1816 confirmed parts of them.: Miloš och Marashli Ali pasha kom muntligen överens om villkoren för serbiskt självstyre; sultanens dekret 1816 bekräftade delar av dem.
Miloš Obrenović: Miloš Obrenović
Held by the Serbian rebels, summer 1815 (approximate): I de serbiska rebellernas händer sommaren 1815 (ungefärligt)
In July 1817 Karađorđe slipped back into Serbia from Bessarabia, having joined the Greek secret society Filiki Eteria, which was planning a wider Balkan rising. Miloš, anxious to keep both the Porte’s trust and his own power, had him killed in his sleep near Velika Plana on 25 July and sent his head to Constantinople. In November an assembly proclaimed Miloš hereditary prince. The murder began a feud between the Obrenović and Karađorđević families that shaped Serbian politics until 1903. Miloš ruled autocratically from Kragujevac, steadily edging Ottoman officials out of the running of the country.: I juli 1817 tog sig Karađorđe i hemlighet tillbaka in i Serbien från Bessarabien, sedan han anslutit sig till det grekiska hemliga sällskapet Filiki Eteria, som planerade en större resning på Balkan. Miloš, som ville behålla både Höga portens förtroende och sin egen makt, lät döda honom i sömnen nära Velika Plana den 25 juli och sände hans huvud till Konstantinopel. I november utropade en församling Miloš till ärftlig furste. Mordet inledde en fejd mellan släkterna Obrenović och Karađorđević som präglade serbisk politik fram till 1903. Miloš styrde enväldigt från Kragujevac och trängde stadigt undan osmanska ämbetsmän från landets styrelse.
Russia took up the Serbian cause. The Akkerman Convention of 1826 and the Treaty of Adrianople of 1829, which ended a Russo-Turkish war, bound the Porte to grant Serbian self-government. A hatt-i sharif of 1830 recognised Miloš as hereditary prince of an autonomous principality paying a yearly tribute; Muslims living outside the garrison towns were to sell their land and leave. Another, in 1833, added six districts that had belonged to Karađorđe’s Serbia, from Krajina and Crna Reka in the east to Jadar in the west. Ottoman garrisons stayed in Belgrade and a few other fortresses until 1867, and full independence came in 1878.: Ryssland tog sig an den serbiska saken. Akkermankonventionen 1826 och freden i Adrianopel 1829, som avslutade ett rysk-turkiskt krig, förpliktade Höga porten att bevilja serbiskt självstyre. En hatt-i sharif 1830 erkände Miloš som ärftlig furste över ett autonomt furstendöme som betalade en årlig tribut; muslimer som bodde utanför garnisonsstäderna skulle sälja sin jord och flytta. En annan, 1833, lade till sex distrikt som hade hört till Karađorđes Serbien, från Krajina och Crna Reka i öster till Jadar i väster. Osmanska garnisoner blev kvar i Belgrad och några andra fästningar till 1867, och full självständighet kom 1878.
Murder of Karađorđe: Mordet på Karađorđe
