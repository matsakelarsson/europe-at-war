Bulgaria and Serbia used the Julian (Old Style) calendar, 12 days behind the Gregorian in the 19th century; Bulgarian accounts date the union to 6 September and the war to 2–16 November 1885. All dates here are New Style.: Bulgarien och Serbien använde den julianska kalendern (gamla stilen), som på 1800-talet låg 12 dagar efter den gregorianska; bulgariska källor daterar unionen till 6 september och kriget till 2–16 november 1885. Alla datum här anges enligt nya stilen.
Tsaribrod is today’s Dimitrovgrad in Serbia; the town passed from Bulgaria to Yugoslavia in 1920.: Tsaribrod är dagens Dimitrovgrad i Serbien; staden övergick från Bulgarien till Jugoslavien 1920.
The Congress of Berlin in 1878 had split the Bulgarian lands, leaving Eastern Rumelia an autonomous Ottoman province. On 18 September 1885 a revolutionary committee and local militia seized power in its capital, Plovdiv, and proclaimed union with the Principality of Bulgaria, and Prince Alexander of Battenberg accepted it. Russia, at odds with Alexander, withdrew its officers from the Bulgarian army, leaving it with no one above the rank of captain. King Milan of Serbia claimed that the balance of Berlin had been upset, and on 14 November, with most Bulgarian troops guarding the Ottoman border far to the south-east, he invaded.: Berlinkongressen 1878 hade delat de bulgariska områdena och lämnat Östrumelien som en autonom osmansk provins. Den 18 september 1885 tog en revolutionär kommitté och lokal milis makten i dess huvudstad Plovdiv och utropade union med furstendömet Bulgarien, och furst Alexander av Battenberg godtog den. Ryssland, som låg i konflikt med Alexander, drog tillbaka sina officerare från den bulgariska armén, som därmed inte hade någon officer över kaptens grad. Kung Milan av Serbien hävdade att den maktbalans som fastställts i Berlin hade rubbats, och den 14 november, när de flesta bulgariska trupperna bevakade den osmanska gränsen långt i sydost, invaderade han.
The main Serbian army crossed at Tsaribrod and advanced on Sofia, which lay only some 60 kilometres from the border. The Bulgarians brought troops north from the Rumelian frontier in forced marches and dug in at Slivnitsa, a pass on the road to the capital. There, from 17 to 19 November, they beat off the Serbian attacks and then counter-attacked, with Prince Alexander in command. In the north-west a smaller Serbian army laid siege to Vidin, whose garrison held out.: Den serbiska huvudarmén gick över gränsen vid Tsaribrod och ryckte fram mot Sofia, som låg bara omkring 60 kilometer från gränsen. Bulgarerna förde trupper norrut från den rumeliska gränsen i ilmarscher och grävde ned sig vid Slivnitsa, ett pass på vägen till huvudstaden. Där slog de den 17–19 november tillbaka de serbiska anfallen och gick sedan till motanfall, under befäl av furst Alexander. I nordväst belägrade en mindre serbisk armé Vidin, vars garnison höll stånd.
