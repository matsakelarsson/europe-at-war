Signed in the Tophane quarter of Constantinople; it made the union of Bulgaria and Eastern Rumelia a fact recognised by the powers.: Undertecknad i stadsdelen Tophane i Konstantinopel; den gjorde unionen mellan Bulgarien och Östrumelien till ett av stormakterna erkänt faktum.
