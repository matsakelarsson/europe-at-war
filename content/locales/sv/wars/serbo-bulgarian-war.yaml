Serbo-Bulgarian War: Serbisk-bulgariska kriget
A two-week war in November 1885 in which Serbia, objecting to the union of Bulgaria and Eastern Rumelia, invaded Bulgaria and was defeated at Slivnitsa and Pirot. Austria-Hungary stopped the Bulgarian counter-offensive, the Treaty of Bucharest of March 1886 restored peace without changing borders, and the powers accepted the Bulgarian union in the Tophane Agreement.: Ett två veckor långt krig i november 1885 där Serbien, som motsatte sig unionen mellan Bulgarien och Östrumelien, invaderade Bulgarien och besegrades vid Slivnitsa och Pirot. Österrike-Ungern stoppade den bulgariska motoffensiven, freden i Bukarest i mars 1886 återställde freden utan gränsändringar, och stormakterna godtog den bulgariska unionen genom Tophaneöverenskommelsen.
