The Bulgarians retook Tsaribrod on 24 November, crossed into Serbia and on 26–27 November beat the Serbian army at Pirot and took the town. The road to Niš lay open. On 28 November the Austro-Hungarian envoy, Count Rudolf Khevenhüller, warned Prince Alexander that Austro-Hungarian troops would enter the war if the Bulgarians went further, and the fighting stopped. The Bulgarians withdrew from Pirot under the armistice.: Bulgarerna återtog Tsaribrod den 24 november, gick in i Serbien och besegrade den 26–27 november den serbiska armén vid Pirot och intog staden. Vägen till Niš låg öppen. Den 28 november varnade det österrikisk-ungerska sändebudet, greve Rudolf Khevenhüller, furst Alexander för att österrikisk-ungerska trupper skulle gå in i kriget om bulgarerna ryckte längre fram, och striderna upphörde. Bulgarerna drog sig tillbaka från Pirot enligt vapenstilleståndet.
The Treaty of Bucharest, signed on 3 March 1886, had a single article restoring peace, and no border changed. In the Tophane Agreement of 5 April the Ottoman Empire and the powers recognised the Prince of Bulgaria as governor-general of Eastern Rumelia, accepting the union in practice; the Ottomans received the Kardzhali district in the Rhodopes in return. The victory made the young Bulgarian army a source of national pride, but Russia did not forgive Alexander, and in August 1886 pro-Russian officers overthrew him.: Freden i Bukarest, undertecknad den 3 mars 1886, hade en enda artikel som återställde freden, och ingen gräns ändrades. Genom Tophaneöverenskommelsen den 5 april erkände Osmanska riket och stormakterna Bulgariens furste som generalguvernör över Östrumelien och godtog därmed i praktiken unionen; osmanerna fick i gengäld distriktet Kardzjali i Rhodopebergen. Segern gjorde den unga bulgariska armén till en källa till nationell stolthet, men Ryssland förlät inte Alexander, och i augusti 1886 störtade ryssvänliga officerare honom.
