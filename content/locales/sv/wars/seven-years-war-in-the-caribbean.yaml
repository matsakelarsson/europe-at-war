# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
Seven Years’ War in the Caribbean: Sjuårskriget i Karibien
? The British conquest of France’s and Spain’s most valuable Caribbean islands during the Seven Years’ War. In January 1759 an expedition under Major-General Peregrine Hopson and Commodore John Moore was beaten off at Martinique and turned on Guadeloupe; after months of fighting in which disease killed far more men than the French, Colonel John Barrington received the island’s capitulation on 1–2 May 1759, days before a French relief squadron arrived. In June 1761 a force from Guadeloupe took Dominica, the “neutral island” long left to the Kalinago. Early in 1762 Major-General Robert Monckton and Rear-Admiral George Rodney captured Martinique, after which Saint Lucia, Grenada and Saint Vincent gave up without a fight. Spain had entered the war in January 1762, and in June a great fleet under Admiral George Pocock landed an army under the Earl of Albemarle near Havana. The fortress of El Morro fell on 30 July after a siege in which its commander Luis Vicente de Velasco was mortally wounded, and Havana surrendered on 13 August 1762 with nine Spanish ships of the line; yellow fever and malaria killed some 4,700 British soldiers and sailors by October. In the Treaty of Paris of 10 February 1763 Britain gave back Guadeloupe, Martinique, Saint Lucia and Havana, taking Florida from Spain in exchange for Havana, and kept Dominica, Saint Vincent, Grenada and Tobago.
: Storbritanniens erövring av Frankrikes och Spaniens mest värdefulla karibiska öar under sjuårskriget. I januari 1759 slogs en expedition under generalmajor Peregrine Hopson och kommendör John Moore tillbaka vid Martinique och vände sig mot Guadeloupe; efter månader av strider, där sjukdomar dödade långt fler män än fransmännen gjorde, tog överste John Barrington emot öns kapitulation den 1–2 maj 1759, några dagar innan en fransk undsättningseskader anlände. I juni 1761 intog en styrka från Guadeloupe Dominica, den ”neutrala ön” som länge hade lämnats åt kalinagofolket. I början av 1762 erövrade generalmajor Robert Monckton och konteramiral George Rodney Martinique, varefter Saint Lucia, Grenada och Saint Vincent gav upp utan strid. Spanien hade gått in i kriget i januari 1762, och i juni landsatte en stor flotta under amiral George Pocock en armé under earlen av Albemarle nära Havanna. Fästningen El Morro föll den 30 juli efter en belägring där dess befälhavare Luis Vicente de Velasco sårades dödligt, och Havanna kapitulerade den 13 augusti 1762 tillsammans med nio spanska linjeskepp; gula febern och malaria hade i oktober dödat omkring 4 700 brittiska soldater och sjömän. Genom freden i Paris den 10 februari 1763 lämnade Storbritannien tillbaka Guadeloupe, Martinique, Saint Lucia och Havanna, tog Florida från Spanien i utbyte mot Havanna och behöll Dominica, Saint Vincent, Grenada och Tobago.
