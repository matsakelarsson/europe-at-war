In 1756 Europe’s alliances were turned upside down. Britain, anxious for Hanover, made a treaty with Prussia at Westminster in January, and Austria, which wanted Silesia back, then allied with its old enemy France. Russia was arming to join them. Frederick II decided to strike first. On 29 August his army, over 60,000 strong, marched into Saxony, whose elector, Augustus III, was also king of Poland and leaned towards Austria. The Prussians occupied Dresden on 9 September, and the Saxon army of some 18,000 men shut itself up in a fortified camp at Pirna, on the Elbe above the capital.: År 1756 vändes Europas allianser upp och ned. Storbritannien, som var oroligt för Hannover, slöt i januari ett fördrag med Preussen i Westminster, och Österrike, som ville återfå Schlesien, allierade sig då med sin gamla fiende Frankrike. Ryssland rustade för att ansluta sig till dem. Fredrik II beslöt att slå till först. Den 29 augusti marscherade hans armé, över 60 000 man stark, in i Sachsen, vars kurfurste, August III, också var kung av Polen och lutade åt Österrike. Preussarna besatte Dresden den 9 september, och den sachsiska armén på omkring 18 000 man stängde in sig i ett befäst läger vid Pirna, vid Elbe ovanför huvudstaden.
An Austrian army under Field Marshal Maximilian Ulysses Browne marched north to rescue the Saxons. Frederick met it with about 28,000 men on 1 October at Lobositz, on the Elbe in northern Bohemia. After a long and confused day Browne fell back in good order, but he could not break through to Pirna. Starving after five weeks of blockade, the Saxons tried to cross the Elbe, were trapped beneath the Lilienstein rock and surrendered in mid-October. Frederick forced the men into Prussian regiments, from which many deserted, and Saxony was occupied and squeezed for money and recruits for the rest of the war.: En österrikisk armé under fältmarskalk Maximilian Ulysses Browne marscherade norrut för att undsätta sachsarna. Fredrik mötte den med omkring 28 000 man den 1 oktober vid Lobositz, vid Elbe i norra Böhmen. Efter en lång och förvirrad dag drog sig Browne tillbaka i god ordning, men han kunde inte bryta igenom till Pirna. Svältande efter fem veckors blockad försökte sachsarna ta sig över Elbe, blev instängda nedanför klippan Lilienstein och kapitulerade i mitten av oktober. Fredrik tvingade in manskapet i preussiska regementen, från vilka många deserterade, och Sachsen var ockuperat och utpressades på pengar och rekryter under resten av kriget.
