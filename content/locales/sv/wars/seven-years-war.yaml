Held by Russia, 1758–1762: I ryska händer 1758–1762
In 1758 Frederick invaded Moravia and in May laid siege to Olmütz. On 30 June the Austrian general Ernst Gideon von Laudon destroyed a great Prussian supply convoy at Domstadtl, and Frederick had to give up the siege and retreat through Bohemia. After fighting the Russians at Zorndorf in August he hurried back to Saxony, where Daun’s army had moved close to his own. Before dawn on 14 October the Austrians surprised the Prussian camp at Hochkirch, near Bautzen. Frederick lost over 9,000 men and much of his artillery, and Field Marshal James Keith was killed, but Daun did not follow up his victory.: År 1758 invaderade Fredrik Mähren och belägrade i maj Olmütz. Den 30 juni förintade den österrikiske generalen Ernst Gideon von Laudon en stor preussisk trosskolonn vid Domstadtl, och Fredrik måste häva belägringen och dra sig tillbaka genom Böhmen. Efter att ha stridit mot ryssarna vid Zorndorf i augusti skyndade han tillbaka till Sachsen, där Dauns armé hade närmat sig hans egen. Före gryningen den 14 oktober överraskade österrikarna det preussiska lägret vid Hochkirch nära Bautzen. Fredrik förlorade över 9 000 man och en stor del av sitt artilleri, och fältmarskalk James Keith stupade, men Daun följde inte upp sin seger.
In the west, the French had beaten the Duke of Cumberland’s Hanoverian army at Hastenbeck in July 1757 and occupied Hanover. Britain then paid for a new army of Hanoverians, Hessians and Brunswickers under Duke Ferdinand of Brunswick, joined by British troops in 1758. It drove the French back over the Rhine early in 1758 and beat them at Krefeld on 23 June. On 1 August 1759 at Minden on the Weser, British and Hanoverian infantry, advancing through a misunderstood order, broke charge after charge of the French cavalry, and the French retreated. Ferdinand’s army shielded Hanover and Prussia’s western flank until the end of the war.: I väster hade fransmännen besegrat hertigen av Cumberlands hannoveranska armé vid Hastenbeck i juli 1757 och besatt Hannover. Storbritannien bekostade då en ny armé av hannoveraner, hessare och braunschweigare under hertig Ferdinand av Braunschweig, som 1758 förstärktes med brittiska trupper. Den drev tillbaka fransmännen över Rhen i början av 1758 och besegrade dem vid Krefeld den 23 juni. Den 1 augusti 1759 vid Minden vid Weser slog brittiskt och hannoveranskt infanteri, som ryckte fram till följd av en missförstådd order, tillbaka anfall efter anfall av det franska kavalleriet, och fransmännen drog sig tillbaka. Ferdinands armé skyddade Hannover och Preussens västra flank till krigets slut.
