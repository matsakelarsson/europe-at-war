Frederick invaded Bohemia in April 1757. On 6 May he attacked Prince Charles of Lorraine’s army east of Prague and drove it into the city, losing some 14,000 men; Field Marshal Schwerin was killed carrying a regimental flag, and Browne was mortally wounded. But on 18 June at Kolín Frederick attacked an Austrian relief army under Leopold von Daun and was badly beaten, losing about 14,000 of his 34,000 men, and he had to leave Bohemia. Over the summer the French overran Hanover, the Russians invaded East Prussia and the Swedes Pomerania, and in October an Austrian raid briefly held Berlin to ransom.: Fredrik invaderade Böhmen i april 1757. Den 6 maj anföll han prins Karl av Lothringens armé öster om Prag och drev in den i staden, med en förlust av omkring 14 000 man; fältmarskalk Schwerin stupade med en regementsfana i handen, och Browne blev dödligt sårad. Men den 18 juni vid Kolín anföll Fredrik en österrikisk undsättningsarmé under Leopold von Daun och led ett svårt nederlag; han förlorade omkring 14 000 av sina 34 000 man och måste lämna Böhmen. Under sommaren överskred fransmännen Hannover, ryssarna invaderade Ostpreussen och svenskarna Pommern, och i oktober höll en österrikisk räd för en kort tid Berlin mot lösensumma.
Frederick saved himself with two famous victories. On 5 November at Rossbach in Saxony, a French and Imperial army of about 41,000 under the Prince of Soubise and Saxe-Hildburghausen tried to march round his flank, and Friedrich Wilhelm von Seydlitz’s cavalry routed it in ninety minutes, for the loss of fewer than 600 Prussians. The Austrians took Schweidnitz and Breslau. Frederick marched east, and on 5 December at Leuthen his 36,000 men rolled up the flank of Charles of Lorraine’s army of about 65,000. The Austrians lost some 22,000 men, more than half of them captured, and Breslau was retaken before Christmas.: Fredrik räddade sig genom två berömda segrar. Den 5 november vid Rossbach i Sachsen försökte en fransk armé och riksarmén, sammanlagt omkring 41 000 man under prinsen av Soubise och Sachsen-Hildburghausen, marschera runt hans flank, och Friedrich Wilhelm von Seydlitz kavalleri drev dem på flykt på nittio minuter, med förlust av färre än 600 preussare. Österrikarna intog Schweidnitz och Breslau. Fredrik marscherade österut, och den 5 december vid Leuthen rullade hans 36 000 man upp flanken på Karl av Lothringens armé på omkring 65 000 man. Österrikarna förlorade omkring 22 000 man, mer än hälften av dem tillfångatagna, och Breslau återtogs före jul.
