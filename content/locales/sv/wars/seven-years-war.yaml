Dates are New Style (Gregorian). Russia used the Julian calendar, eleven days behind, so Russian sources date Elizabeth’s death 25 December 1761.: Datumen anges enligt nya stilen (gregorianska kalendern). Ryssland använde den julianska kalendern, som låg elva dagar efter, så ryska källor daterar Elisabets död till 25 december 1761.
Sweden’s part in the war is told separately, as the Pomeranian War.: Sveriges del i kriget berättas separat, som Pommerska kriget.
The steps follow the war in central Europe, between Prussia and Austria and on the Russian front, with an outline of the war in western Germany. The war at sea, in North America, the Caribbean, West Africa and India is not yet told here.: Stegen följer kriget i Centraleuropa, mellan Preussen och Österrike och på den ryska fronten, med en översikt över kriget i västra Tyskland. Kriget till sjöss, i Nordamerika, Karibien, Västafrika och Indien berättas ännu inte här.
