Brigadier John Burgoyne’s British and Portuguese troops surprised this Spanish supply base after a forced march and took a Spanish general prisoner.: Brigadgeneral John Burgoynes brittiska och portugisiska trupper överraskade denna spanska förrådsbas efter en ilmarsch och tog en spansk general till fånga.
