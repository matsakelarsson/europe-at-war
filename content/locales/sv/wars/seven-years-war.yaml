5 December 1757: 5 december 1757
Today’s Lutynia. Frederick hid his march behind low hills and fell on the Austrian left wing. Many consider it his masterpiece.: Dagens Lutynia. Fredrik dolde sin marsch bakom låga kullar och föll över den österrikiska vänsterflygeln. Många anser slaget vara hans mästerverk.
Soubise and Hildburghausen: Soubise och Hildburghausen
Russia joined Austria and France against Prussia in 1757. Empress Elizabeth’s army, about 55,000 strong under Field Marshal Stepan Apraksin, invaded East Prussia, and a detachment took the port of Memel in July. On 30 August Hans von Lehwaldt’s 28,000 Prussians attacked Apraksin at Gross-Jägersdorf and were beaten off after Pyotr Rumyantsev led reserve regiments through a wood into the fight. Instead of following up, Apraksin fell back to the Neman. He was short of supplies, and perhaps feared that the ailing empress would die and be succeeded by her pro-Prussian nephew Peter. He was dismissed and arrested.: Ryssland anslöt sig 1757 till Österrike och Frankrike mot Preussen. Kejsarinnan Elisabets armé, omkring 55 000 man stark under fältmarskalk Stepan Apraksin, invaderade Ostpreussen, och en avdelning intog hamnstaden Memel i juli. Den 30 augusti anföll Hans von Lehwaldts 28 000 preussare Apraksin vid Gross-Jägersdorf och slogs tillbaka sedan Pjotr Rumjantsev hade fört reservregementen genom en skog in i striden. I stället för att följa upp segern drog sig Apraksin tillbaka till Njemen. Han hade ont om förnödenheter och fruktade kanske att den sjukliga kejsarinnan skulle dö och efterträdas av sin preussenvänlige brorson Peter. Han avsattes och arresterades.
His successor, William Fermor, marched into East Prussia in January 1758 almost unopposed. Königsberg surrendered on 22 January, and the province swore allegiance to Elizabeth and stayed under Russian rule for four years. In August Fermor advanced into Brandenburg and bombarded the Oder fortress of Küstrin, setting the town on fire. Frederick II hurried north and on 25 August attacked the Russian army at Zorndorf. With about 11,000 Prussian and some 16,000 Russian casualties it was one of the bloodiest battles of the century. Both sides claimed victory, but Fermor withdrew.: Hans efterträdare, William Fermor, marscherade in i Ostpreussen i januari 1758 nästan utan motstånd. Königsberg kapitulerade den 22 januari, och provinsen svor Elisabet trohet och förblev under ryskt styre i fyra år. I augusti ryckte Fermor fram in i Brandenburg och bombarderade fästningen Küstrin vid Oder och satte staden i brand. Fredrik II skyndade norrut och anföll den 25 augusti den ryska armén vid Zorndorf. Med omkring 11 000 preussiska och omkring 16 000 ryska förluster var det ett av århundradets blodigaste slag. Båda sidor gjorde anspråk på segern, men Fermor drog sig tillbaka.
