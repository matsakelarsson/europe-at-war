The British and French fleets fought an inconclusive action south-east of the island. Byng then held a council of war and sailed back to Gibraltar, leaving the garrison to its fate.: Den brittiska och den franska flottan utkämpade en oavgjord strid sydost om ön. Byng höll sedan krigsråd och seglade tillbaka till Gibraltar och lämnade garnisonen åt sitt öde.
20 April – 29 June 1756: 20 april – 29 juni 1756
The garrison under Lieutenant-Governor William Blakeney, then in his eighties, held out for more than two months and marched out with the honours of war.: Garnisonen under viceguvernören William Blakeney, då i åttioårsåldern, höll stånd i mer än två månader och marscherade ut med krigets honnörer.
