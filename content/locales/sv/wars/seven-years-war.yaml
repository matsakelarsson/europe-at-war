Seven Years’ War: Sjuårskriget
A war in which Prussia and Great Britain, with Hanover, fought Austria, France, Russia, Sweden and most of the Holy Roman Empire, while Britain and France, joined by Spain in 1762, fought at sea and in North America, the Caribbean, West Africa and India. Prussia survived invasions from all sides and kept Silesia at the Peace of Hubertusburg in 1763, and the Treaty of Paris left Britain the leading colonial power.: Ett krig där Preussen och Storbritannien, tillsammans med Hannover, stred mot Österrike, Frankrike, Ryssland, Sverige och större delen av tysk-romerska riket, medan Storbritannien och Frankrike, från 1762 med Spanien på franska sidan, stred till sjöss och i Nordamerika, Karibien, Västafrika och Indien. Preussen överlevde invasioner från alla håll och behöll Schlesien vid freden i Hubertusburg 1763, och freden i Paris gjorde Storbritannien till den ledande kolonialmakten.
