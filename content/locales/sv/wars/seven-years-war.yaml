Contades: Contades
In 1759 a new commander, Pyotr Saltykov, led the Russian army west through Poland towards the Oder to join the Austrians. On 23 July he beat a smaller Prussian force under Carl Heinrich von Wedel at Kay, near Paltzig, then took Frankfurt an der Oder, where Austrian troops under Ernst Gideon von Laudon joined him. Frederick gathered about 50,000 men, crossed the Oder north of Frankfurt and on 12 August attacked the allied army of some 60,000, dug in on the hills by the village of Kunersdorf.: År 1759 förde en ny befälhavare, Pjotr Saltykov, den ryska armén västerut genom Polen mot Oder för att förena sig med österrikarna. Den 23 juli besegrade han en mindre preussisk styrka under Carl Heinrich von Wedel vid Kay nära Paltzig och intog sedan Frankfurt an der Oder, där österrikiska trupper under Ernst Gideon von Laudon förenade sig med honom. Fredrik samlade omkring 50 000 man, gick över Oder norr om Frankfurt och anföll den 12 augusti den allierade armén på omkring 60 000 man, som hade grävt ned sig på höjderna vid byn Kunersdorf.
His first attacks drove in the Russian left, but his tired troops were thrown back again and again from the heights, and Laudon’s cavalry finally broke them. About 19,000 Prussians were killed, wounded or captured, more than a third of the army, and the allies lost some 16,000. That night Frederick wrote that all was lost. But Saltykov, whose army had suffered terribly, and the Austrian commander Leopold von Daun did not march on Berlin, and their armies drew apart. Frederick called his escape the “miracle of the House of Brandenburg”.: Hans första anfall trängde tillbaka den ryska vänsterflygeln, men hans uttröttade trupper kastades gång på gång tillbaka från höjderna, och Laudons kavalleri bröt dem till slut. Omkring 19 000 preussare dödades, sårades eller tillfångatogs, mer än en tredjedel av armén, och de allierade förlorade omkring 16 000. Den natten skrev Fredrik att allt var förlorat. Men Saltykov, vars armé hade lidit fruktansvärt, och den österrikiske befälhavaren Leopold von Daun marscherade inte mot Berlin, och deras arméer skildes åt. Fredrik kallade sin räddning för ”huset Brandenburgs under”.
