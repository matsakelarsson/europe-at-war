Occupied by the Russians, who joined the Austrians here.: Besatt av ryssarna, som förenade sig med österrikarna här.
12 August 1759: 12 augusti 1759
Frederick’s worst defeat. His army was scattered, and for a few days he had only a few thousand men left under arms.: Fredriks värsta nederlag. Hans armé skingrades, och under några dagar hade han bara några tusen man kvar under vapen.
Saltykov: Saltykov
By 1760 Prussia was short of men and money, and the Austrians took the initiative. On 23 June Laudon destroyed Fouqué’s Prussian corps at Landeshut in Silesia, and in July he took Glatz. Frederick besieged Dresden, and his guns burned much of the city, but he could not take it. He marched to Silesia, where Laudon, Daun and a Russian army were closing in. At dawn on 15 August near Liegnitz he caught Laudon’s corps on its own and beat it before the others could come up. The Austrians lost some 8,500 men, more than half of them captured, and the Russians drew back across the Oder.: År 1760 hade Preussen brist på både manskap och pengar, och österrikarna tog initiativet. Den 23 juni förintade Laudon Fouqués preussiska kår vid Landeshut i Schlesien, och i juli intog han Glatz. Fredrik belägrade Dresden, och hans kanoner brände stora delar av staden, men han kunde inte inta den. Han marscherade till Schlesien, där Laudon, Daun och en rysk armé närmade sig. I gryningen den 15 augusti nära Liegnitz överraskade han Laudons kår ensam och besegrade den innan de andra hann fram. Österrikarna förlorade omkring 8 500 man, mer än hälften av dem tillfångatagna, och ryssarna drog sig tillbaka över Oder.
In October, while Frederick was still in Silesia, Russian and Austrian troops briefly occupied Berlin. He turned back to Saxony, and on 3 November attacked Daun’s army, dug in on the Süptitz heights outside Torgau. His columns went in piecemeal and were shot down, and by nightfall he thought the battle lost, until Hans Joachim von Zieten’s corps stormed the heights from the south. Daun, wounded, withdrew across the Elbe in the night. Torgau was one of the bloodiest battles of the war, with by some counts up to 16,000 Prussian and 15,000 Austrian casualties, and it left the Austrians little of Saxony beyond Dresden.: I oktober, medan Fredrik fortfarande befann sig i Schlesien, besatte ryska och österrikiska trupper för en kort tid Berlin. Han vände tillbaka till Sachsen och anföll den 3 november Dauns armé, som hade grävt ned sig på Süptitzhöjderna utanför Torgau. Hans kolonner gick in i striden en i taget och sköts ned, och när mörkret föll trodde han att slaget var förlorat, tills Hans Joachim von Zietens kår stormade höjderna från söder. Daun, som hade sårats, drog sig tillbaka över Elbe under natten. Torgau var ett av krigets blodigaste slag, med enligt vissa beräkningar upp till 16 000 preussiska och 15 000 österrikiska förluster, och det lämnade österrikarna föga av Sachsen utöver Dresden.
Battle of Landeshut: Slaget vid Landeshut
23 June 1760, Austrian victory: 23 juni 1760, österrikisk seger
Battle of Liegnitz: Slaget vid Liegnitz
15 August 1760, Prussian victory: 15 augusti 1760, preussisk seger
Battle of Torgau: Slaget vid Torgau
3 November 1760, Prussian victory: 3 november 1760, preussisk seger
23 June 1760: 23 juni 1760
Today’s Kamienna Góra. Laudon’s much larger force stormed Fouqué’s entrenchments, and most of the Prussian corps was killed or captured.: Dagens Kamienna Góra. Laudons mycket större styrka stormade Fouqués förskansningar, och större delen av den preussiska kåren dödades eller tillfångatogs.
Glatz: Glatz
26 July 1760: 26 juli 1760
Laudon took the fortress, today’s Kłodzko, which the Austrians held until the peace.: Laudon intog fästningen, dagens Kłodzko, som österrikarna behöll till freden.
July 1760: juli 1760
The Austrian garrison held out against Frederick’s siege. His bombardment destroyed much of the old town, including the Kreuzkirche.: Den österrikiska garnisonen stod emot Fredriks belägring. Hans bombardemang förstörde stora delar av gamla stan, däribland Kreuzkirche.
15 August 1760: 15 augusti 1760
Fought north-east of today’s Legnica. Frederick’s victory stopped the Austrian and Russian armies from joining forces.: Utkämpat nordost om dagens Legnica. Fredriks seger hindrade de österrikiska och ryska arméerna från att förena sig.
3 November 1760: 3 november 1760
A costly victory won only at dusk. Frederick was hit in the chest by a spent musket ball.: En kostsam seger som vanns först i skymningen. Fredrik träffades i bröstet av en matt muskötkula.
Frederick, August: Fredrik, augusti
Frederick, October: Fredrik, oktober
In October 1760, while Frederick was in Silesia, a Russian corps under Gottlob Totleben and Zakhar Chernyshev and an Austrian corps under Franz Moritz von Lacy marched on Berlin. The small garrison withdrew, and the city surrendered on 9 October. The occupiers took a heavy ransom and destroyed arms works, then left three days later as Frederick approached. The Russians had twice besieged the Pomeranian port of Kolberg without success. In 1761 Pyotr Rumyantsev besieged it again by land and sea, and on 16 December its garrison surrendered, giving Russia a harbour for its army in Pomerania.: I oktober 1760, medan Fredrik befann sig i Schlesien, marscherade en rysk kår under Gottlob Totleben och Zachar Tjernysjov och en österrikisk kår under Franz Moritz von Lacy mot Berlin. Den lilla garnisonen drog sig tillbaka, och staden kapitulerade den 9 oktober. Ockupanterna tog ut en tung lösensumma och förstörde vapenfabriker och lämnade sedan staden tre dagar senare när Fredrik närmade sig. Ryssarna hade två gånger utan framgång belägrat den pommerska hamnstaden Kolberg. År 1761 belägrade Pjotr Rumjantsev den på nytt från land och sjö, och den 16 december kapitulerade garnisonen, vilket gav Ryssland en hamn för sin armé i Pommern.
Prussia was close to exhaustion when Empress Elizabeth died on 5 January 1762. Her nephew and heir, Peter III, admired Frederick. He made peace at once, and in the Treaty of Saint Petersburg on 5 May handed back East Prussia and Pomerania, asking nothing in return. In June he allied with Frederick and placed Chernyshev’s corps under his command. Sweden made peace at Hamburg on 22 May. In July Peter was overthrown by his wife, Catherine II, who kept the peace but ended the alliance. Without Russia, Austria could not win, and the Peace of Hubertusburg in February 1763 left Prussia with Silesia.: Preussen var nära utmattning när kejsarinnan Elisabet dog den 5 januari 1762. Hennes brorson och arvinge, Peter III, beundrade Fredrik. Han slöt genast fred och lämnade genom freden i Sankt Petersburg den 5 maj tillbaka Ostpreussen och Pommern utan att begära något i gengäld. I juni ingick han allians med Fredrik och ställde Tjernysjovs kår under hans befäl. Sverige slöt fred i Hamburg den 22 maj. I juli störtades Peter av sin hustru, Katarina II, som höll freden men avslutade alliansen. Utan Ryssland kunde Österrike inte vinna, och freden i Hubertusburg i februari 1763 lät Preussen behålla Schlesien.
Berlin occupied: Berlin besatt
9–12 October 1760: 9–12 oktober 1760
Kolberg surrendered: Kolberg kapitulerar
16 December 1761: 16 december 1761
Treaty of Saint Petersburg: Freden i Sankt Petersburg
5 May 1762, Russia gives back its conquests: 5 maj 1762, Ryssland lämnar tillbaka sina erövringar
Russian and Austrian troops held the Prussian capital for three days and took a ransom before Frederick’s approach drove them out.: Ryska och österrikiska trupper höll den preussiska huvudstaden i tre dagar och tog ut en lösensumma innan Fredriks annalkande drev ut dem.
Kolberg: Kolberg
After sieges in 1758 and 1760 had failed, Rumyantsev starved the fortress into surrender.: Sedan belägringarna 1758 och 1760 hade misslyckats svalt Rumjantsev ut fästningen till kapitulation.
Under the Treaty of Saint Petersburg, East Prussia, held by Russia since 1758, went back to Prussia.: Genom freden i Sankt Petersburg återgick Ostpreussen, som Ryssland hade hållit sedan 1758, till Preussen.
Chernyshev and Totleben: Tjernysjov och Totleben
Rumyantsev: Rumjantsev
Prussia could no longer win the war, only avoid losing it. In August 1761 Frederick dug his army in at Bunzelwitz in Silesia, and the far larger Austrian and Russian armies did not dare attack; but once he had moved away, Laudon stormed Schweidnitz on 1 October. Britain stopped its subsidies in 1762. Then Russia made peace. On 21 July Frederick drove the Austrians from the heights of Burkersdorf, while a Russian corps, ordered home after Peter III’s overthrow, stood by in his lines. He retook Schweidnitz in October, and on 29 October Prince Henry beat the Austrians and the Imperial army at Freiberg in Saxony.: Preussen kunde inte längre vinna kriget, bara undvika att förlora det. I augusti 1761 grävde Fredrik ned sin armé vid Bunzelwitz i Schlesien, och de vida större österrikiska och ryska arméerna vågade inte anfalla; men så snart han hade marscherat bort stormade Laudon Schweidnitz den 1 oktober. Storbritannien upphörde med sina subsidier 1762. Sedan slöt Ryssland fred. Den 21 juli drev Fredrik österrikarna från höjderna vid Burkersdorf, medan en rysk kår, som beordrats hem efter Peter III:s störtande, stod overksam i hans linjer. Han återtog Schweidnitz i oktober, och den 29 oktober besegrade prins Henrik österrikarna och riksarmén vid Freiberg i Sachsen.
Britain and France agreed peace terms in November 1762, and Austria, on its own, could not hope to defeat Prussia. Envoys of Austria, Prussia and Saxony met at the Saxon hunting lodge of Hubertusburg, and on 15 February 1763, five days after the Treaty of Paris, they agreed to restore the borders of 1756. Prussia kept Silesia and Glatz and left Saxony, and Frederick promised his vote to Maria Theresa’s son Joseph at the next imperial election. The war had cost Prussia, by some estimates, a tenth of its people, and left Saxony ruined, but it made Prussia one of Europe’s great powers.: Storbritannien och Frankrike enades om fredsvillkor i november 1762, och Österrike kunde inte ensamt hoppas på att besegra Preussen. Sändebud från Österrike, Preussen och Sachsen möttes på det sachsiska jaktslottet Hubertusburg, och den 15 februari 1763, fem dagar efter freden i Paris, kom de överens om att återställa gränserna från 1756. Preussen behöll Schlesien och Glatz och lämnade Sachsen, och Fredrik lovade sin röst till Maria Teresias son Josef vid nästa kejsarval. Kriget hade enligt vissa uppskattningar kostat Preussen en tiondel av dess befolkning och lämnat Sachsen ruinerat, men det gjorde Preussen till en av Europas stormakter.
Battle of Freiberg: Slaget vid Freiberg
29 October 1762, Prussian victory: 29 oktober 1762, preussisk seger
Peace of Hubertusburg: Freden i Hubertusburg
15 February 1763: 15 februari 1763
The borders of 1756; Silesia stays Prussian: Gränserna från 1756; Schlesien förblir preussiskt
Bunzelwitz: Bunzelwitz
August – September 1761: augusti – september 1761
For three weeks Laudon’s Austrians and Alexander Buturlin’s Russians faced Frederick’s entrenched camp, today in Bolesławice, without attacking.: I tre veckor stod Laudons österrikare och Aleksandr Buturlins ryssar mitt emot Fredriks förskansade läger, i dag i Bolesławice, utan att anfalla.
Schweidnitz: Schweidnitz
Today’s Świdnica. Laudon took the fortress by storm on 1 October 1761, and Frederick won it back after a two-month siege on 9 October 1762.: Dagens Świdnica. Laudon intog fästningen med storm den 1 oktober 1761, och Fredrik återtog den efter en två månader lång belägring den 9 oktober 1762.
Battle of Burkersdorf: Slaget vid Burkersdorf
21 July 1762: 21 juli 1762
Frederick’s troops stormed Daun’s positions on the hills south of Schweidnitz, near today’s Burkatów.: Fredriks trupper stormade Dauns ställningar på höjderna söder om Schweidnitz, nära dagens Burkatów.
29 October 1762: 29 oktober 1762
Prince Henry’s victory, the last great battle of the war in Germany, secured most of Saxony for Prussia.: Prins Henriks seger, krigets sista stora slag i Tyskland, säkrade större delen av Sachsen åt Preussen.
Austria, Prussia and Saxony made peace on the basis of the borders of 1756 at this hunting lodge near Wermsdorf.: Österrike, Preussen och Sachsen slöt fred på grundval av gränserna från 1756 i detta jaktslott nära Wermsdorf.
The war between Britain and France had begun in the Mediterranean, months before Frederick invaded Saxony. On 18 April 1756 a French army of some 15,000 men under the Duke of Richelieu landed on Minorca, British since 1708, and besieged Fort St Philip, which guarded Port Mahon. Admiral John Byng, sent with a fleet to relieve it, fought an indecisive battle with the French fleet off the island on 20 May and then sailed back to Gibraltar, and the garrison surrendered on 29 June. Byng was court-martialled for failing to do his utmost and shot on the deck of a warship at Portsmouth in March 1757, “to encourage the others”, as Voltaire put it in Candide.: Kriget mellan Storbritannien och Frankrike hade börjat i Medelhavet, månader innan Fredrik invaderade Sachsen. Den 18 april 1756 landsteg en fransk armé på omkring 15 000 man under hertigen av Richelieu på Menorca, brittiskt sedan 1708, och belägrade Fort St Philip, som skyddade Port Mahon. Amiral John Byng, som sänts med en flotta för att undsätta fästet, utkämpade den 20 maj ett oavgjort slag mot den franska flottan utanför ön och seglade sedan tillbaka till Gibraltar, och garnisonen kapitulerade den 29 juni. Byng ställdes inför krigsrätt för att inte ha gjort sitt yttersta och arkebuserades på däcket av ett krigsfartyg i Portsmouth i mars 1757, ”för att uppmuntra de andra”, som Voltaire uttryckte det i Candide.
Spain joined France in January 1762 under the Bourbon Family Compact, and when Portugal, Britain’s ally, refused to close its ports to British ships, Spanish armies invaded it on 5 May. A first army of 22,000 took Miranda do Douro, Bragança and Chaves in Trás-os-Montes, but peasant bands cut its supplies and it fell back. Britain sent some 7,000 troops, and the Count of Schaumburg-Lippe took command of the reorganised Portuguese army. A second, Franco-Spanish army under the Count of Aranda took Almeida in August and pushed towards Abrantes. The allies raided the Spanish bases at Valencia de Alcántara and Vila Velha, peasants stripped the country bare, and hunger, sickness and desertion broke the invaders; a British report put their losses at 30,000. A truce followed in December. By the Treaty of Paris of 10 February 1763 Spain gave back its conquests, Britain returned Havana, taken from Spain in 1762, in exchange for Florida, and France handed Minorca back to Britain.: Spanien anslöt sig till Frankrike i januari 1762 enligt den bourbonska familjepakten, och när Portugal, Storbritanniens bundsförvant, vägrade att stänga sina hamnar för brittiska fartyg invaderade spanska arméer landet den 5 maj. En första armé på 22 000 man intog Miranda do Douro, Bragança och Chaves i Trás-os-Montes, men bondeskaror skar av dess försörjning och den drog sig tillbaka. Storbritannien sände omkring 7 000 soldater, och greven av Schaumburg-Lippe tog befälet över den omorganiserade portugisiska armén. En andra, fransk-spansk armé under greven av Aranda intog Almeida i augusti och trängde fram mot Abrantes. De allierade gjorde räder mot de spanska baserna i Valencia de Alcántara och Vila Velha, bönderna skalade av landet allt som gick att äta, och svält, sjukdomar och deserteringar bröt inkräktarna; enligt en brittisk rapport uppgick deras förluster till 30 000 man. Ett stillestånd följde i december. Genom freden i Paris den 10 februari 1763 lämnade Spanien tillbaka sina erövringar, Storbritannien återlämnade Havanna, som tagits från Spanien 1762, i utbyte mot Florida, och Frankrike lämnade tillbaka Menorca till Storbritannien.
29 June 1756: 29 juni 1756
