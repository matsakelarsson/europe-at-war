Battle of Fariskur: Slaget vid Fariskur
Dates are Julian. The crusade is known in unusual detail from the memoirs of Jean de Joinville, a Champagne nobleman who served Louis and wrote his account decades later, and from Arabic historians.: Datumen anges enligt den julianska kalendern. Korståget är känt i ovanligt stor detalj genom memoarerna av Jean de Joinville, en adelsman från Champagne som tjänade Ludvig och skrev sin berättelse årtionden senare, och genom arabiska historiker.
The Mamluks were slave soldiers, mostly of Kipchak Turkish origin, bought and trained by the Ayyubid sultan al-Salih Ayyub. After murdering his son Turanshah in May 1250 their commanders ruled Egypt as sultans; the Mamluk Sultanate lasted until 1517.: Mamlukerna var slavsoldater, mestadels av kiptjakturkiskt ursprung, som köptes och utbildades av den ayyubidiske sultanen al-Salih Ayyub. Sedan de i maj 1250 mördat hans son Turanshah styrde deras befälhavare Egypten som sultaner; mamluksultanatet bestod till 1517.
In the summer of 1244 Khwarazmian horsemen, nomads in the service of al-Salih Ayyub, the Ayyubid sultan of Egypt, sacked Jerusalem, which the Franks had regained by treaty in 1229, and in October the army of the Latin East and its Syrian allies was destroyed by the Egyptians and Khwarazmians at La Forbie near Gaza. Louis IX of France, who had vowed to go on crusade during a serious illness that year, spent three years preparing. He sailed from his new port of Aigues-Mortes on 25 August 1248 with perhaps 15,000–25,000 men, spent the winter in Cyprus and in May 1249 sailed for Egypt.: Sommaren 1244 plundrade khwarazmiska ryttare, nomader i tjänst hos al-Salih Ayyub, Egyptens ayyubidiske sultan, Jerusalem, som frankerna hade återfått genom ett fördrag 1229, och i oktober förintades de latinska staternas armé och dess syriska allierade av egyptierna och khwarazmierna vid La Forbie nära Gaza. Ludvig IX av Frankrike, som hade lovat att gå på korståg under en svår sjukdom samma år, ägnade tre år åt förberedelser. Han seglade från sin nya hamn Aigues-Mortes den 25 augusti 1248 med kanske 15 000–25 000 man, tillbringade vintern på Cypern och seglade i maj 1249 mot Egypten.
On 5 June 1249 the crusaders landed on the beach before Damietta in the face of the Egyptian army, Louis wading ashore with his knights. The Egyptian commander, Fakhr al-Din, withdrew that night, the garrison and people of Damietta fled after him, and on 6 June the crusaders occupied the city without a fight. Louis then waited for the Nile flood to pass and for his brother Alphonse of Poitiers to bring reinforcements, and only in November did he march south towards Cairo.: Den 5 juni 1249 landsteg korsfararna på stranden framför Damietta inför den egyptiska armén, och Ludvig vadade i land med sina riddare. Den egyptiske befälhavaren, Fakhr al-Din, drog sig tillbaka under natten, Damiettas garnison och invånare flydde efter honom, och den 6 juni besatte korsfararna staden utan strid. Ludvig väntade sedan på att Nilens översvämning skulle dra sig tillbaka och på att hans bror Alfons av Poitiers skulle komma med förstärkningar, och först i november marscherade han söderut mot Kairo.
