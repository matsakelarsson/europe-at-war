The army wintered on Cyprus, where Louis gathered supplies and lost many men to disease.: Hären övervintrade på Cypern, där Ludvig samlade förnödenheter och förlorade många man i sjukdomar.
17 October 1244: 17 oktober 1244
The Franks and their allies from Damascus and Homs were destroyed by the Egyptian army and the Khwarazmians. It was the worst defeat of the Latin East since Hattin.: Frankerna och deras allierade från Damaskus och Homs förintades av den egyptiska armén och khwarazmierna. Det var de latinska staternas värsta nederlag sedan Hattin.
The city that the Fifth Crusade had besieged for a year and a half was abandoned by its garrison and fell in a day.: Staden, som femte korståget hade belägrat i ett och ett halvt år, övergavs av sin garnison och föll på en dag.
Louis IX: Ludvig IX
As the crusaders marched south, al-Salih Ayyub died on 22 November 1249; his widow Shajar al-Durr hid his death, and the army fought on. The crusaders were held up for weeks at the Bahr al-Saghir canal opposite al-Mansurah until a local man showed them a ford. On 8 February 1250 the vanguard crossed and surprised the Egyptian camp, killing Fakhr al-Din, but Louis’s brother Robert of Artois, instead of waiting, charged into al-Mansurah with the Templars. In its narrow streets the Mamluk regiments, among them the future sultan Baibars, killed almost all of them. Louis held the bridgehead against fierce counter-attacks, but could go no further.: När korsfararna marscherade söderut dog al-Salih Ayyub den 22 november 1249; hans änka Shajar al-Durr hemlighöll hans död, och armén fortsatte striden. Korsfararna hölls uppe i veckor vid kanalen Bahr al-Saghir mitt emot al-Mansura tills en man från trakten visade dem ett vadställe. Den 8 februari 1250 gick förtruppen över och överraskade det egyptiska lägret och dödade Fakhr al-Din, men Ludvigs bror Robert av Artois stormade i stället för att vänta in i al-Mansura med tempelherrarna. I dess trånga gator dödade mamlukregementena, bland dem den blivande sultanen Baibars, nästan alla. Ludvig höll brohuvudet mot häftiga motanfall men kunde inte komma längre.
Disease and hunger spread while Egyptian ships cut the crusaders off from Damietta, and the new sultan, Turanshah, arrived from Syria. In April Louis ordered a retreat. On 6 April 1250 at Fariskur the exhausted army was overwhelmed, and Louis, sick with dysentery, was captured with most of his men; many of the sick and wounded prisoners were killed. On 2 May the Mamluk officers murdered Turanshah. They released Louis for a huge ransom, half paid at once, and the return of Damietta, and he went to Acre, where he stayed until 1254 strengthening the coastal towns.: Sjukdomar och svält spred sig medan egyptiska fartyg skar av korsfararna från Damietta, och den nye sultanen, Turanshah, anlände från Syrien. I april beordrade Ludvig återtåg. Den 6 april 1250 vid Fariskur överväldigades den utmattade hären, och Ludvig, sjuk i dysenteri, tillfångatogs med större delen av sina män; många av de sjuka och sårade fångarna dödades. Den 2 maj mördade mamlukofficerarna Turanshah. De släppte Ludvig mot en enorm lösensumma, varav hälften betalades genast, och mot att Damietta återlämnades, och han reste till Akko, där han stannade till 1254 och befäste kuststäderna.
