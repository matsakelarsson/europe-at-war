Seventh Crusade: Sjunde korståget
The crusade of King Louis IX of France against Ayyubid Egypt, launched after the sack of Jerusalem and the defeat of the Latin East at La Forbie in 1244. Louis took Damietta without a fight in June 1249, but his advance on Cairo was stopped at al-Mansurah in February 1250, and on the retreat his army was destroyed at Fariskur and he was captured. The Mamluk officers who murdered the last Ayyubid sultan of Egypt released him for a ransom and the return of Damietta.: Kung Ludvig IX av Frankrikes korståg mot det ayyubidiska Egypten, som inleddes efter plundringen av Jerusalem och de latinska staternas nederlag vid La Forbie 1244. Ludvig intog Damietta utan strid i juni 1249, men hans framryckning mot Kairo stoppades vid al-Mansura i februari 1250, och under återtåget förintades hans armé vid Fariskur och han togs till fånga. De mamlukska officerare som mördat Egyptens siste ayyubidiske sultan släppte honom mot en lösensumma och mot att Damietta återlämnades.
