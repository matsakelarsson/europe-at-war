The city was handed back to the Egyptians in exchange for the king’s release; Queen Margaret, who had given birth there, had kept the garrison from abandoning it.: Staden lämnades tillbaka till egyptierna i utbyte mot kungens frigivning; drottning Margareta, som hade fött ett barn där, hade hindrat garnisonen från att överge den.
