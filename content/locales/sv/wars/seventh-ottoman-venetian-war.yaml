Seventh Ottoman–Venetian War: Sjunde osmansk-venetianska kriget
The last war between Venice and the Ottoman Empire, in which the Ottomans retook the Peloponnese (the Morea), won by Venice in the 1680s, in a single campaign in 1715, along with Tinos, Aegina and the last Venetian forts on Crete. Venice held Corfu against a siege in 1716 and was saved from worse by Austria’s entry into the war, but at the Peace of Passarowitz in 1718 it kept only the Ionian Islands, Preveza and small gains in Dalmatia.: Det sista kriget mellan Venedig och Osmanska riket, där osmanerna under ett enda fälttåg 1715 återtog Peloponnesos (Morea), som Venedig hade erövrat på 1680-talet, liksom Tinos, Egina och de sista venetianska fästena på Kreta. Venedig höll Korfu mot en belägring 1716 och räddades från värre förluster av att Österrike gick in i kriget, men vid freden i Passarowitz 1718 behöll republiken bara Joniska öarna, Preveza och mindre vinster i Dalmatien.
