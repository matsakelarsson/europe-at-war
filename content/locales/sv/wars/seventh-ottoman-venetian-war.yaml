Also called the Second Morean War or, in Croatia, the War of Sinj. The papacy, the Knights of Malta, Portugal, Spain and Tuscany sent ships to help Venice in 1716–1717.: Kallas också andra moreanska kriget eller, i Kroatien, Sinjkriget. Påvestolen, Malteserorden, Portugal, Spanien och Toscana sände fartyg till Venedigs hjälp 1716–1717.
Austria’s war against the Ottomans in 1716–1718, with Petrovaradin and Belgrade, is told in the Austro-Turkish War of 1716–1718.: Österrikes krig mot osmanerna 1716–1718, med Petrovaradin och Belgrad, berättas i Österrikisk-turkiska kriget 1716–1718.
The size of the Ottoman army in 1715 comes from the journal of the French interpreter Benjamin Brue and may be exaggerated.: Den osmanska arméns storlek 1715 kommer från den franske tolken Benjamin Brues dagbok och kan vara överdriven.
At Karlowitz in 1699 the Ottomans had ceded the Morea to Venice, and they were determined to win it back. Victory over Russia in 1711 and the distraction of the other European powers gave them their chance. The pretexts were the seizure of an Ottoman ship and the shelter Venice had given Danilo I, the prince-bishop of Montenegro, after a rising against the Ottomans, and on 9 December 1714 the Sultan declared war. In the spring the grand vizier, Silahdar Damat Ali Pasha, gathered an army of perhaps 70,000 men in Macedonia, while the fleet took Tinos and Aegina, the last Venetian islands in the Aegean.: I Karlowitz 1699 hade osmanerna avträtt Morea till Venedig, och de var fast beslutna att vinna tillbaka området. Segern över Ryssland 1711 och att de andra europeiska makterna var upptagna på annat håll gav dem chansen. Förevändningarna var beslagtagandet av ett osmanskt fartyg och den tillflykt Venedig hade gett Danilo I, Montenegros furstbiskop, efter ett uppror mot osmanerna, och den 9 december 1714 förklarade sultanen krig. På våren samlade storvesiren, Silahdar Damat Ali pasha, en armé på kanske 70 000 man i Makedonien, medan flottan intog Tinos och Egina, de sista venetianska öarna i Egeiska havet.
Venice had only about 8,000 mercenaries in the Morea, and its Greek subjects, who resented Venetian rule and taxes, supplied the Ottomans. The army crossed the Isthmus of Corinth on 25 June 1715. Acrocorinth surrendered on terms, but Janissaries broke in and killed or enslaved most of the garrison and townspeople. Nafplio, the Venetian capital, fell on 20 July after a mine breached the Palamidi fort. Navarino and Koroni were abandoned and Methoni capitulated, as did Souda and Spinalonga, the last Venetian outposts on Crete. Within a hundred days the whole peninsula was Ottoman again.: Venedig hade bara omkring 8 000 legosoldater i Morea, och dess grekiska undersåtar, som var missnöjda med det venetianska styret och skatterna, försåg osmanerna med förnödenheter. Armén gick över Korinthiska näset den 25 juni 1715. Akrokorinth kapitulerade på villkor, men janitsharer bröt sig in och dödade eller förslavade större delen av garnisonen och stadsborna. Nafplio, den venetianska huvudstaden, föll den 20 juli sedan en mina hade slagit en bresch i fästet Palamidi. Navarino och Koroni övergavs och Methoni kapitulerade, liksom Souda och Spinalonga, de sista venetianska utposterna på Kreta. Inom hundra dagar var hela halvön åter osmansk.
