Lost by Venice, 1715: Förlorat av Venedig 1715
In 1716 the Ottomans turned on the Ionian Islands. They occupied Lefkada and Butrint on the mainland opposite Corfu, and on 8 July landed an army of about 33,000 men on Corfu itself. Count Johann Matthias von der Schulenburg, a German soldier in Venetian service, defended the town with about 8,000 men and beat off several assaults. After a violent storm on 9 August, which the Corfiots credited to their patron saint, Spyridon, and with Austria now in the war and victorious at Petrovaradin, the Ottomans gave up the siege and had left the island by 20 August.: År 1716 vände sig osmanerna mot Joniska öarna. De besatte Lefkas och Butrint på fastlandet mitt emot Korfu, och den 8 juli landsatte de en armé på omkring 33 000 man på själva Korfu. Greve Johann Matthias von der Schulenburg, en tysk militär i venetiansk tjänst, försvarade staden med omkring 8 000 man och slog tillbaka flera stormningar. Efter ett våldsamt oväder den 9 augusti, som korfioterna tillskrev sitt skyddshelgon Spyridon, och sedan Österrike gått in i kriget och segrat vid Petrovaradin, gav osmanerna upp belägringen och hade lämnat ön den 20 augusti.
Austria had renewed its alliance with Venice in April 1716, drawing the main Ottoman effort to the Danube. At sea the Venetian fleet, joined by Portuguese, Maltese and papal ships, fought the Ottomans off Imbros in June 1717 and off Cape Matapan in July without decisive result. Venice took Preveza on the Epirote coast and Imotski in Dalmatia, where Sinj had held out against a siege in 1715. At Passarowitz on 21 July 1718 Venice kept the Ionian Islands, with Kythira, Preveza and its small Dalmatian gains, but gave up the Morea, Tinos, Aegina and the Cretan forts. It was the last war between the two powers.: Österrike hade förnyat sin allians med Venedig i april 1716, vilket drog osmanernas huvudansträngning till Donau. Till sjöss stred den venetianska flottan, förstärkt med portugisiska, maltesiska och påvliga fartyg, mot osmanerna utanför Imbros i juni 1717 och utanför Kap Matapan i juli utan avgörande resultat. Venedig intog Preveza på kusten i Epirus och Imotski i Dalmatien, där Sinj hade stått emot en belägring 1715. I Passarowitz den 21 juli 1718 behöll Venedig Joniska öarna, med Kythira, Preveza och sina små vinster i Dalmatien, men gav upp Morea, Tinos, Egina och fästena på Kreta. Det var det sista kriget mellan de två makterna.
