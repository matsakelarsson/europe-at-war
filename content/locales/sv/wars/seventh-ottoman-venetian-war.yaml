The citadel guarding the isthmus surrendered on terms of free departure, but Janissaries broke in and massacred many of its people. The event inspired Byron’s poem The Siege of Corinth.: Citadellet som bevakade näset kapitulerade mot fritt avtåg, men janitsharer bröt sig in och massakrerade många av dess invånare. Händelsen inspirerade Byrons dikt The Siege of Corinth.
