# Svenska översättningar av katalogtexten (våg 13); stegtexterna kommer senare.
Shaba invasions (Shaba I and Shaba II): Invasionerna i Shaba (Shaba I och Shaba II)
Two invasions of Zaire’s mining province of Shaba (Katanga) by the Congolese National Liberation Front (FNLC), an army of former Katangese gendarmes and their sons who had gone into exile in Angola after Katanga’s secession ended in 1963 and had fought for the Portuguese and then for the MPLA. In Shaba I (March–May 1977) some 1,600–3,000 FNLC fighters took the towns along the Benguela Railway up to Mutshatsha, near Kolwezi; Mobutu’s army barely resisted, and the invaders were driven out by about 1,500 Moroccan troops flown in by France, with Egyptian pilots and Saudi money. In Shaba II (May 1978) the FNLC crossed through Zambia and seized Kolwezi itself, where hundreds of African and European civilians were killed; French Foreign Legion paratroopers dropped on the town on 19 May and Belgian paratroopers arrived the next day. Mobutu and his Western allies accused Angola, Cuba and the Soviet Union of backing the invasions; Angola and Zaire made peace in 1978, and the FNLC was disarmed.: Två invasioner av Zaires gruvprovins Shaba (Katanga) som genomfördes av Kongolesiska nationella befrielsefronten (FNLC), en armé av före detta katangesiska gendarmer och deras söner, som hade gått i exil i Angola sedan Katangas utbrytning upphört 1963 och hade stridit för portugiserna och sedan för MPLA. I Shaba I (mars–maj 1977) intog omkring 1 600–3 000 FNLC-kämpar städerna längs Benguelajärnvägen ända fram till Mutshatsha, nära Kolwezi; Mobutus armé gjorde knappt något motstånd, och inkräktarna drevs ut av omkring 1 500 marockanska soldater som flögs in av Frankrike, med egyptiska piloter och saudiska pengar. I Shaba II (maj 1978) tog sig FNLC igenom Zambia och intog själva Kolwezi, där hundratals afrikanska och europeiska civila dödades; fallskärmsjägare ur franska främlingslegionen hoppade ned över staden den 19 maj och belgiska fallskärmsjägare anlände dagen därpå. Mobutu och hans västliga allierade anklagade Angola, Kuba och Sovjetunionen för att stödja invasionerna; Angola och Zaire slöt fred 1978, och FNLC avväpnades.
