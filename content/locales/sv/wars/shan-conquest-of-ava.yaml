# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
Shan conquest of Ava: Shanernas erövring av Ava
? The conquest of Ava, the Burmese kingdom of Upper Burma, by the Confederation of Shan States led by Sawlon, the saopha (ruler) of Mohnyin, and its ally Prome, and the rule of Shan kings at Ava until 1555. From the early 1500s Mohnyin’s armies raided ever deeper into Ava’s lands, in 1505–1506 as far south as Dabayin and in 1511 taking Bhamo, while Prome broke away in the south and Toungoo in 1510. Late in 1523 the Confederation and Prome attacked together from north and south; Ava, helped by its loyal Shan ally Hsipaw, was slowly worn down, and on 22 March 1525 the allies sacked the capital. In 1527 they returned and besieged Ava again, and King Shwenankyawshin was killed by a gunshot in the fighting, on 14 March 1527 by one reckoning (others say April). Sawlon made his son Thohanbwa king of Ava, which became in effect another Shan state. In 1533 Sawlon and Thohanbwa sacked Prome, which they accused of failing them, and Sawlon was murdered by his own ministers on the way home. Thohanbwa’s rule is remembered in the chronicles for his hostility to the Buddhist clergy; in 1540 he had 360 monks killed and their manuscripts burned. Many Burmans fled to Toungoo, which grew strong enough to conquer Lower Burma in 1534–1541. Thohanbwa was assassinated by his chief minister in May 1542 and the throne passed to Hkonmaing of Hsipaw; Shan and Burman rulers then contested Ava until Bayinnaung of Toungoo took the city in January 1555.
: Erövringen av Ava, det burmesiska kungariket i Övre Burma, genom Shanstaternas konfederation under Sawlon, saophan (härskaren) i Mohnyin, och dess bundsförvant Prome, och shankungarnas styre i Ava fram till 1555. Från början av 1500-talet trängde Mohnyins arméer allt djupare in i Avas länder, 1505–1506 ända söderut till Dabayin, och 1511 intog de Bhamo, medan Prome bröt sig loss i söder och Toungoo 1510. I slutet av 1523 anföll konfederationen och Prome tillsammans från norr och söder; Ava, som fick hjälp av sin trogna shanska bundsförvant Hsipaw, nöttes långsamt ned, och den 22 mars 1525 plundrade de allierade huvudstaden. År 1527 återvände de och belägrade Ava på nytt, och kung Shwenankyawshin dödades av ett skott under striderna, enligt en beräkning den 14 mars 1527 (enligt andra i april). Sawlon gjorde sin son Thohanbwa till kung av Ava, som i praktiken blev ytterligare en shanstat. År 1533 plundrade Sawlon och Thohanbwa Prome, som de anklagade för att ha svikit dem, och Sawlon mördades av sina egna ministrar på hemvägen. Thohanbwas styre minns i krönikorna för hans fientlighet mot det buddhistiska prästerskapet; 1540 lät han döda 360 munkar och bränna deras handskrifter. Många burmaner flydde till Toungoo, som blev tillräckligt starkt för att erövra Nedre Burma 1534–1541. Thohanbwa mördades av sin förste minister i maj 1542 och tronen övergick till Hkonmaing av Hsipaw; shanska och burmanska härskare stred sedan om Ava tills Bayinnaung av Toungoo intog staden i januari 1555.
