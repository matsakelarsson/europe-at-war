# Svenska översättningar av katalogtexten (våg 7); stegtexterna kommer senare.
Shaybanid–Timurid wars: Shaybanidisk-timuridiska krigen
The wars in which the Uzbeks under Muhammad Shaybani drove the last Timurid princes out of Central Asia. Shaybani took Samarkand and Bukhara in 1500–1501, beating the young Babur at Sar-e-Pul, defeated the Moghul khans at Akhsi in 1503, conquered Khwarazm and in 1507 took Herat, the last Timurid capital. Babur escaped to Kabul. After Shah Ismail of Persia killed Shaybani at Merv in 1510, Babur, with Persian help, retook Samarkand in 1511, but the Uzbeks beat him at Kul-i Malik in 1512 and destroyed a Persian army at Ghazdewan. Transoxiana stayed Uzbek, and Babur turned towards India.: De krig under vilka uzbekerna under Muhammad Shaybani drev de sista timuridiska prinsarna ut ur Centralasien. Shaybani intog Samarkand och Buchara 1500–1501 och slog då den unge Babur vid Sar-e-Pul, besegrade moghulkhanerna vid Akhsi 1503, erövrade Khwarazm och intog 1507 Herat, den sista timuridiska huvudstaden. Babur flydde till Kabul. Sedan shah Ismail av Persien hade dödat Shaybani vid Merv 1510 återtog Babur med persisk hjälp Samarkand 1511, men uzbekerna slog honom vid Kul-i Malik 1512 och förintade en persisk här vid Ghazdewan. Transoxanien förblev uzbekiskt, och Babur vände sig mot Indien.
