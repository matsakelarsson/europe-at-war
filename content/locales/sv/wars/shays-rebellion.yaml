# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
Shays’ Rebellion: Shays uppror
? An armed uprising of farmers in western and central Massachusetts against debt collection and taxes after the American Revolution. Many farmers, a large number of them veterans of the war, were deep in debt, and the state, paying off its war debts to creditors in Boston and abroad, levied heavy taxes payable in hard money; courts seized farms and jailed debtors. After petitions failed, armed crowds who called themselves Regulators closed the county courts to stop the foreclosures, beginning at Northampton on 29 August 1786. Governor James Bowdoin raised an army of some 3,000 men under Benjamin Lincoln, paid for largely by Boston merchants. On 25 January 1787 rebels led by Daniel Shays, a former Continental Army captain, and Eli Parsons marched on the federal arsenal at Springfield; the state militia under William Shepard fired cannon into their column, killing four, and they fled. Lincoln surprised and scattered the main rebel force at Petersham on 4 February after a night march through a snowstorm, and a last clash near Sheffield on 27 February left two to four dead, by different counts. About 4,000 men accepted an amnesty; of those condemned to death, two were hanged for robbery in December 1787, and the rest, Shays among them, were pardoned. The voters replaced Bowdoin with John Hancock, and the legislature eased the burden of debt and taxes. The rising alarmed national leaders about the weakness of the government under the Articles of Confederation and added urgency to the Constitutional Convention that met in Philadelphia in May 1787.
: Ett väpnat uppror bland bönder i västra och mellersta Massachusetts mot skuldindrivning och skatter efter den amerikanska revolutionen. Många bönder, ett stort antal av dem veteraner från kriget, var djupt skuldsatta, och delstaten, som betalade av sina krigsskulder till fordringsägare i Boston och utomlands, tog ut tunga skatter som skulle betalas i klingande mynt; domstolar utmätte gårdar och satte gäldenärer i fängelse. Sedan petitioner hade misslyckats stängde beväpnade folkmassor som kallade sig Regulators grevskapens domstolar för att stoppa utmätningarna, med början i Northampton den 29 augusti 1786. Guvernör James Bowdoin satte upp en armé på omkring 3 000 man under Benjamin Lincoln, till stor del bekostad av köpmän i Boston. Den 25 januari 1787 marscherade rebeller under Daniel Shays, en före detta kapten i kontinentalarmén, och Eli Parsons mot den federala arsenalen i Springfield; delstatsmilisen under William Shepard sköt med kanoner in i deras kolonn och dödade fyra, och de flydde. Lincoln överraskade och skingrade rebellernas huvudstyrka vid Petersham den 4 februari efter en nattlig marsch genom en snöstorm, och en sista sammandrabbning nära Sheffield den 27 februari krävde två till fyra döda, enligt olika uppgifter. Omkring 4 000 män godtog en amnesti; av dem som dömdes till döden hängdes två för rån i december 1787, och resten, bland dem Shays, benådades. Väljarna ersatte Bowdoin med John Hancock, och den lagstiftande församlingen lättade bördan av skulder och skatter. Upproret väckte oro bland de nationella ledarna över regeringens svaghet under konfederationsartiklarna och gjorde det konstitutionskonvent som samlades i Philadelphia i maj 1787 mer angeläget.
