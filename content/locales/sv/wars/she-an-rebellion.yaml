She–An rebellion: She–An-upproret
A revolt of two Nuosu (Yi) chieftains of the south-west against the Ming, named after She Chongming of Yongning in southern Sichuan and An Bangyan of Shuixi in north-western Guizhou. Ordered to send troops and grain for the war against the Later Jin in Liaodong, She Chongming’s soldiers rose at Chongqing in the autumn of 1621, killed the grand coordinator of Sichuan and proclaimed the state of Daliang; they besieged Chengdu for 102 days but failed to take it. In 1622 An Bangyan, regent of Shuixi, joined the revolt and besieged Guiyang for about ten months, until early 1623; most of the city’s people died of hunger. The Ming retook Chongqing in 1622 and Yongning in 1623, but the war dragged on in the mountains of Guizhou until Zhu Xieyuan’s armies killed She Chongming and An Bangyan in 1629. Shuixi surrendered in 1630. The war drew money and soldiers from the Ming at the time it was fighting the Later Jin in the north-east.: Ett uppror mot Ming av två nuosuhövdingar (yi) i sydväst, uppkallat efter She Chongming i Yongning i södra Sichuan och An Bangyan i Shuixi i nordvästra Guizhou. När She Chongming beordrades att sända trupper och spannmål till kriget mot Senare Jin i Liaodong reste sig hans soldater i Chongqing hösten 1621, dödade storkoordinatorn i Sichuan och utropade staten Daliang; de belägrade Chengdu i 102 dagar men lyckades inte inta staden. År 1622 anslöt sig An Bangyan, regent i Shuixi, till upproret och belägrade Guiyang i omkring tio månader, till början av 1623; de flesta av stadens invånare dog av svält. Ming återtog Chongqing 1622 och Yongning 1623, men kriget drog ut på tiden i Guizhous berg tills Zhu Xieyuans arméer dödade She Chongming och An Bangyan 1629. Shuixi kapitulerade 1630. Kriget tog pengar och soldater från Ming samtidigt som riket bekämpade Senare Jin i nordost.
