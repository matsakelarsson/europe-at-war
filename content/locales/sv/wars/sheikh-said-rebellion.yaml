Sheikh Said rebellion: Sheikh Saids uppror
A Kurdish rising in south-eastern Turkey in 1925 against the new secular republic, led by the Naqshbandi sheikh Said with the backing of the Kurdish nationalist society Azadî, which spread across the region around Diyarbakır before tens of thousands of troops and aircraft crushed it; Sheikh Said was captured in April and hanged in Diyarbakır with 47 others on 29 June. The government used the rising to pass the Law on the Maintenance of Order, which silenced the opposition press and parties, and historians still debate how far the revolt was nationalist and how far religious.: Ett kurdiskt uppror i sydöstra Turkiet 1925 mot den nya sekulära republiken, lett av naqshbandisheiken Said med stöd av det kurdiska nationalistiska sällskapet Azadî. Upproret spred sig över trakten kring Diyarbakır innan tiotusentals soldater och flygplan slog ned det; Sheikh Said tillfångatogs i april och hängdes i Diyarbakır tillsammans med 47 andra den 29 juni. Regeringen utnyttjade upproret för att anta lagen om ordningens upprätthållande, som tystade oppositionens press och partier, och historiker diskuterar fortfarande i vilken mån revolten var nationalistisk och i vilken mån religiös.
