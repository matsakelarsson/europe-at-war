# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
Shi Jingtang’s revolt: Shi Jingtangs revolt
? The revolt of Shi Jingtang, the Shatuo governor of Hedong at Taiyuan, against his brother-in-law Li Congke, emperor of the Later Tang, which he won with the help of the Khitan (Liao) emperor at the price of the Sixteen Prefectures. When Li Congke ordered him moved from Taiyuan in the summer of 936, Shi refused and called on him to abdicate. Besieged in Taiyuan by an imperial army under Zhang Jingda, he asked the Khitan emperor Yelü Deguang (Taizong) for help, promising to treat him as a father and to cede the prefectures along the northern frontier. Deguang came through the passes with about 50,000 horsemen in the autumn, defeated Zhang and trapped the rest of his army at Jin’an, and on 28 November 936 invested Shi as emperor of a new Jin dynasty, the Later Jin. The trapped army surrendered, the relief army of Zhao Dejun was routed at Tuanbo valley, and as Shi advanced on Luoyang Li Congke burned himself to death with his family on 11 January 937. In 938 Shi handed over the Sixteen Prefectures, from Youzhou (Beijing) to Yunzhou (Datong), with the passes that guarded the North China Plain, and promised the Liao a large amount of silk every year.
: Den revolt som Shi Jingtang, shatuoisk guvernör i Hedong med säte i Taiyuan, ledde mot sin svåger Li Congke, kejsare av Senare Tang, och som han vann med hjälp av khitanernas (Liaos) kejsare till priset av de sexton prefekturerna. När Li Congke sommaren 936 beordrade att han skulle förflyttas från Taiyuan vägrade Shi och uppmanade honom att abdikera. Belägrad i Taiyuan av en kejserlig armé under Zhang Jingda bad han khitanernas kejsare Yelü Deguang (Taizong) om hjälp och lovade att behandla honom som en far och att avträda prefekturerna längs den norra gränsen. Deguang kom genom passen med omkring 50 000 ryttare på hösten, besegrade Zhang och stängde in resten av hans armé vid Jin’an, och den 28 november 936 insatte han Shi som kejsare av en ny Jindynasti, Senare Jin. Den inneslutna armén kapitulerade, Zhao Dejuns undsättningsarmé slogs på flykten i Tuanbodalen, och när Shi ryckte fram mot Luoyang brände Li Congke sig själv till döds tillsammans med sin familj den 11 januari 937. År 938 överlämnade Shi de sexton prefekturerna, från Youzhou (Peking) till Yunzhou (Datong), med de pass som skyddade den nordkinesiska slätten, och lovade Liao en stor mängd siden varje år.
