# Svenska översättningar av katalogtexten (våg 13); stegtexterna kommer senare.
Shifta War: Shiftakriget
? "A secessionist war in Kenya’s Northern Frontier District (NFD), where Somalis and many Borana, Gabbra, Rendille and Sakuye pastoralists sought to join the Somali Republic, which backed them. Before independence an informal British inquiry in 1962 found that most of the district’s people wanted union with Somalia, but Britain left the NFD to Kenya. In the weeks before Kenyan independence on 12 December 1963 a few hundred supporters of the Northern Province People’s Progressive Party (NPPPP) took up arms as the Northern Frontier Districts Liberation Movement (NFDLM), attacking police and army posts. Jomo Kenyatta’s government declared a state of emergency on 28 December 1963, created a prohibited zone along the Somali border and, deliberately, called the rebels “shifta”, a Swahili word for bandits, to deny the war its political character; Somalis call the war Gaf Daba. Somalia armed and trained the insurgents, about 1,200 by 1966; Britain gave Kenya military support and Ethiopia signed a defence pact with it in 1964. Neither side could win: the rebels ambushed convoys and laid mines, and the Kenya Army and the paramilitary General Service Unit answered with collective punishment, the confiscation and slaughter of livestock and, in 1966–1967, the forced resettlement of the population into 14 guarded villages (manyattas), which ruined much of the pastoral economy. After Muhammad Haji Ibrahim Egal became Somalia’s prime minister in 1967, Kenya and Somalia signed a memorandum of understanding at Arusha under the chairmanship of Zambia’s President Kenneth Kaunda on 28 October 1967, ending the emergencies on both sides and restoring relations. Kenyan government records put the dead in the thousands; non-governmental organisations reported more than 10,000. Insecurity and cattle raiding went on for years, and the former NFD remained under emergency laws and among Kenya’s poorest regions."
: "Ett secessionistiskt krig i Kenyas Northern Frontier District (NFD), där somalier och många boskapsskötare bland borana, gabbra, rendille och sakuye ville ansluta sig till Somaliska republiken, som stödde dem. Före självständigheten fann en informell brittisk undersökning 1962 att de flesta av distriktets invånare ville ha en union med Somalia, men Storbritannien lämnade NFD till Kenya. Under veckorna före Kenyas självständighet den 12 december 1963 grep några hundra anhängare till Northern Province People’s Progressive Party (NPPPP) till vapen som Northern Frontier Districts Liberation Movement (NFDLM) och angrep polis- och arméposter. Jomo Kenyattas regering utlyste undantagstillstånd den 28 december 1963, skapade en förbjuden zon längs den somaliska gränsen och kallade avsiktligt rebellerna ”shifta”, ett swahiliord för banditer, för att förneka kriget dess politiska karaktär; somalier kallar kriget Gaf Daba. Somalia beväpnade och utbildade upprorsmännen, som 1966 var omkring 1 200; Storbritannien gav Kenya militärt stöd, och Etiopien slöt en försvarspakt med Kenya 1964. Ingen av sidorna kunde vinna: rebellerna lade bakhåll för konvojer och lade ut minor, och Kenyas armé och den paramilitära General Service Unit svarade med kollektiva bestraffningar, konfiskering och slakt av boskap och 1966–1967 tvångsförflyttning av befolkningen till 14 bevakade byar (manyattas), vilket förstörde en stor del av boskapsekonomin. Sedan Muhammad Haji Ibrahim Egal blivit Somalias premiärminister 1967 undertecknade Kenya och Somalia den 28 oktober 1967 ett samförståndsavtal i Arusha under ordförandeskap av Zambias president Kenneth Kaunda, vilket gjorde slut på undantagstillstånden på båda sidor och återställde förbindelserna. Enligt kenyanska regeringshandlingar dog tusentals; icke-statliga organisationer rapporterade mer än 10 000 döda. Otryggheten och boskapsräderna fortsatte i flera år, och det tidigare NFD förblev under undantagslagar och bland Kenyas fattigaste regioner."
