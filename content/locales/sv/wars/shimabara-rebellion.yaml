# Svenska översättningar av katalogtexten (våg 10); stegtexterna kommer senare.
Shimabara rebellion: Shimabaraupproret
? A rising of peasants, fishermen and former samurai in the Shimabara peninsula and the Amakusa Islands of western Kyushu, the last large armed conflict in Japan until the 1860s. Both areas had once been ruled by Christian lords and had many Christian converts. Their new lords, Matsukura Katsuie of Shimabara and the Terasawa of Karatsu, who held Amakusa, levied crushing taxes during years of crop failure, punished defaulters with torture and persecuted the Christians. On 17 December 1637 the people of the southern Shimabara peninsula killed the local magistrate, and Amakusa rose at the same time. Under a charismatic sixteen-year-old, Amakusa Shirō, the rebels attacked the castles of Tomioka and Hondo on Amakusa and Shimabara Castle, failed to take them and gathered, some 27,000 to 37,000 strong with their families, in the ruined castle of Hara on the Shimabara coast. The shogunate’s first commander, Itakura Shigemasa, was killed in a failed assault; his successor Matsudaira Nobutsuna besieged the castle with about 125,000 men from the Kyushu domains, and the Dutch at Hirado lent cannon and the ship de Ryp to bombard it. When the defenders’ food and powder ran out, the castle was stormed on 12–15 April 1638. Estimates put the rebels and sympathisers killed in the assault and the executions that followed at about 37,000, women and children among them; Amakusa Shirō’s head was displayed at Nagasaki. Matsukura was beheaded for misrule. The shogunate treated the rising as a Christian revolt, expelled the Portuguese in 1639 and tightened its persecution of Christians and its closure of the country.
: En resning bland bönder, fiskare och tidigare samurajer på Shimabarahalvön och Amakusaöarna på västra Kyushu, den sista stora väpnade konflikten i Japan fram till 1860-talet. Båda områdena hade en gång styrts av kristna herrar och hade många kristna konvertiter. Deras nya herrar, Matsukura Katsuie i Shimabara och Terasawaklanen i Karatsu, som innehade Amakusa, tog ut förödande skatter under år av missväxt, straffade dem som inte kunde betala med tortyr och förföljde de kristna. Den 17 december 1637 dödade folket på södra Shimabarahalvön den lokale fogden, och Amakusa reste sig samtidigt. Under en karismatisk sextonåring, Amakusa Shirō, angrep rebellerna borgarna Tomioka och Hondo på Amakusa och Shimabaraborgen, misslyckades med att inta dem och samlades, omkring 27 000 till 37 000 med sina familjer, i den förfallna Haraborgen vid Shimabaras kust. Shogunatets förste befälhavare, Itakura Shigemasa, stupade i en misslyckad stormning; hans efterträdare Matsudaira Nobutsuna belägrade borgen med omkring 125 000 man från domänerna på Kyushu, och nederländarna i Hirado lånade ut kanoner och skeppet de Ryp för att beskjuta den. När försvararnas mat och krut tog slut stormades borgen den 12–15 april 1638. Uppskattningar anger antalet rebeller och sympatisörer som dödades vid stormningen och vid de avrättningar som följde till omkring 37 000, bland dem kvinnor och barn; Amakusa Shirōs huvud ställdes ut i Nagasaki. Matsukura halshöggs för vanstyre. Shogunatet behandlade resningen som en kristen revolt, fördrev portugiserna 1639 och skärpte sin förföljelse av de kristna och sin stängning av landet.
