# Svenska översättningar av katalogtexten (våg 10); stegtexterna kommer senare.
Shimonoseki campaign: Shimonosekifälttåget
? Fighting between the Chōshū domain and the navies of the United States, France, the Netherlands and Britain over the Strait of Shimonoseki, the narrow passage between Honshu and Kyushu that links the Inland Sea with the Sea of Japan. In 1863 Emperor Kōmei, under pressure from the radical samurai of the “revere the emperor, expel the barbarians” (sonnō jōi) movement, ordered the shogunate to expel the foreigners by the 10th day of the 5th month (25 June). The shogunate did nothing, but Chōshū, whose lord Mōri Takachika backed the radicals, opened fire from its batteries and steamers on the American steamer Pembroke, the French dispatch boat Kien Chan and the Dutch warship Medusa and closed the strait. The USS Wyoming sank two Chōshū ships on 16 July and a French squadron landed men and wrecked batteries on 20 July, but the strait stayed closed for a year. In September 1864, after Chōshū had been driven from Kyoto, a squadron of nine British, four Dutch and three French warships with an American chartered steamer, about 2,000 men in all, under the British admiral Augustus Kuper, silenced the batteries on 5 September, landed and destroyed them, and forced Chōshū to make peace on 8 September; Takasugi Shinsaku negotiated for the domain. The shogunate had to accept an indemnity of $3,000,000. The defeat turned Chōshū’s leaders from expelling the foreigners to modernising their army with Western arms and overthrowing the shogunate.
: Strider mellan Chōshūdomänen och flottor från USA, Frankrike, Nederländerna och Storbritannien om Shimonosekisundet, den smala passagen mellan Honshu och Kyushu som förbinder Japanska innanhavet med Japanska havet. År 1863 beordrade kejsar Kōmei, under tryck från de radikala samurajerna i rörelsen ”vörda kejsaren, fördriv barbarerna” (sonnō jōi), shogunatet att fördriva utlänningarna senast den 10:e dagen i 5:e månaden (25 juni). Shogunatet gjorde ingenting, men Chōshū, vars furste Mōri Takachika stödde radikalerna, öppnade eld från sina batterier och ångfartyg mot den amerikanska ångaren Pembroke, det franska avisofartyget Kien Chan och det nederländska örlogsfartyget Medusa och stängde sundet. USS Wyoming sänkte två fartyg från Chōshū den 16 juli och en fransk eskader landsatte trupper och förstörde batterier den 20 juli, men sundet förblev stängt i ett år. I september 1864, sedan Chōshū hade drivits ut ur Kyoto, tystade en eskader av nio brittiska, fyra nederländska och tre franska örlogsfartyg med en amerikansk inhyrd ångare, sammanlagt omkring 2 000 man, under den brittiske amiralen Augustus Kuper batterierna den 5 september, landsteg och förstörde dem och tvingade Chōshū att sluta fred den 8 september; Takasugi Shinsaku förhandlade för domänens räkning. Shogunatet fick godta ett skadestånd på 3 000 000 dollar. Nederlaget fick Chōshūs ledare att gå från att vilja fördriva utlänningarna till att modernisera sin armé med västerländska vapen och störta shogunatet.
