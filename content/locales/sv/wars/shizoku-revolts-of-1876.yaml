# Svenska översättningar av katalogtexten (våg 10); stegtexterna kommer senare.
Shinpūren, Akizuki and Hagi rebellions: Shinpūren-, Akizuki- och Hagiupproren
? Three linked risings of former samurai (shizoku) in western Japan in October and November 1876, provoked by the government’s ban on wearing swords (March 1876) and the forced conversion of samurai stipends into government bonds (August 1876). On the night of 24 October about 170–200 members of the Keishintō, a Shinto league of former Kumamoto samurai known as the Shinpūren (“league of the divine wind”) and led by the priest Otaguro Tomoo, attacked the army garrison and officials in Kumamoto with swords and spears, refusing firearms as foreign. They killed the prefectural governor Yasuoka Ryōsuke, the garrison commander Major General Taneda Masaaki and his chief of staff, and about 60 soldiers and officials, but the garrison rallied by morning; about 124 rebels were killed or took their own lives, Otaguro among them. On 27 October former samurai of Akizuki in Fukuoka Prefecture, led by Miyazaki Kurumanosuke and others, rose in answer to the Kumamoto call, killed police officers and marched out some 200–400 strong; they were scattered by the 14th Infantry Regiment of Kokura under Nogi Maresuke, Miyazaki and other leaders killed themselves, and two were beheaded on 3 December. On 28 October Maebara Issei, a former Chōshū leader and councillor of state, rose at Hagi with about 200 men. Government troops broke the rising within a week. Maebara, sailing for Tokyo, was caught on 5 November at the port of Uryū in Izumo, where bad weather had driven his boat, and on 3 December he and seven other leaders were beheaded. None of the three risings drew in the much larger body of discontented samurai in Satsuma, which rose three months later under Saigō Takamori.
: Tre sammanlänkade resningar bland tidigare samurajer (shizoku) i västra Japan i oktober och november 1876, framkallade av regeringens förbud mot att bära svärd (mars 1876) och den tvångsvisa omvandlingen av samurajernas underhåll till statsobligationer (augusti 1876). Natten den 24 oktober angrep omkring 170–200 medlemmar av Keishintō, ett shintoförbund av tidigare samurajer från Kumamoto som kallades Shinpūren (”den gudomliga vindens förbund”) och leddes av prästen Otaguro Tomoo, arméns garnison och ämbetsmän i Kumamoto med svärd och spjut, eftersom de avvisade eldvapen som utländska. De dödade prefekturens guvernör Yasuoka Ryōsuke, garnisonens befälhavare generalmajor Taneda Masaaki och hans stabschef samt omkring 60 soldater och ämbetsmän, men garnisonen samlade sig till morgonen; omkring 124 rebeller dödades eller tog sina egna liv, bland dem Otaguro. Den 27 oktober reste sig tidigare samurajer från Akizuki i Fukuokaprefekturen, ledda av bland andra Miyazaki Kurumanosuke, som svar på uppropet från Kumamoto, dödade poliser och tågade ut omkring 200–400 man starka; de skingrades av 14:e infanteriregementet från Kokura under Nogi Maresuke, Miyazaki och andra ledare tog livet av sig, och två halshöggs den 3 december. Den 28 oktober reste sig Maebara Issei, en tidigare ledare från Chōshū och statsråd, i Hagi med omkring 200 man. Regeringstrupper slog ned resningen inom en vecka. Maebara, som seglade mot Tokyo, greps den 5 november i hamnen Uryū i Izumo, dit dåligt väder hade drivit hans båt, och den 3 december halshöggs han och sju andra ledare. Ingen av de tre resningarna drog med sig den mycket större skaran missnöjda samurajer i Satsuma, som reste sig tre månader senare under Saigō Takamori.
