# Svenska översättningar av katalogtexten (våg 8); stegtexterna kommer senare.
Siachen conflict: Siachenkonflikten
? The war between India and Pakistan for the Siachen Glacier and the Saltoro Ridge in the eastern Karakoram, the highest battlefield in the world, where posts stand at more than 6,000 metres. The ceasefire line of 1949 and the Line of Control of 1972 ended at a map point called NJ9842, leaving the glaciers to the north undemarcated. In the 1970s Pakistan allowed foreign mountaineering expeditions into the area and many maps drew the line north-east to the Karakoram Pass, which India saw as a claim to the glaciers. In April 1984, in Operation Meghdoot, India flew troops onto the glacier and seized the main passes of the Saltoro Ridge just before Pakistani troops could reach them. Pakistan tried several times to dislodge them, most seriously in 1987, and the two armies fought artillery duels and assaults on each other’s posts until a ceasefire in November 2003. Far more soldiers died of cold, altitude sickness and avalanches than of enemy fire; estimates put the dead of both sides at about 2,000 by 2003, and many more have died since. India still holds the glacier and the main ridge, and talks on demilitarising the area have failed.
: Kriget mellan Indien och Pakistan om Siachenglaciären och Saltoroåsen i östra Karakoram, världens högst belägna slagfält, där posterna ligger på mer än 6 000 meters höjd. Vapenstilleståndslinjen från 1949 och kontrollinjen från 1972 slutade vid en kartpunkt kallad NJ9842, vilket lämnade glaciärerna norr därom utan gränsdragning. På 1970-talet släppte Pakistan in utländska bergsbestigningsexpeditioner i området, och många kartor drog linjen nordost till Karakorampasset, vilket Indien såg som ett anspråk på glaciärerna. I april 1984, i Operation Meghdoot, flög Indien in trupper på glaciären och besatte Saltoroåsens viktigaste pass strax innan pakistanska trupper hann nå dem. Pakistan försökte flera gånger driva bort dem, allvarligast 1987, och de båda arméerna utkämpade artilleridueller och anföll varandras poster fram till en vapenvila i november 2003. Långt fler soldater dog av köld, höjdsjuka och laviner än av fiendens eld; enligt uppskattningar hade omkring 2 000 dött på båda sidor fram till 2003, och många fler har dött sedan dess. Indien behåller fortfarande glaciären och huvudåsen, och samtalen om att demilitarisera området har misslyckats.
