# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
Siamese conquest of Vientiane and Champasak (Lao–Siamese War): Siams erövring av Vientiane och Champasak (laotisk-siamesiska kriget)
? The campaign in which Taksin’s Siam brought the three Lao kingdoms that had succeeded Lan Xang under its overlordship. King Ong Boun of Vientiane had invited the Burmese against his rival Luang Prabang in 1764–1765 and was suspected of siding with Burma; in 1777–1778 his troops killed Phra Vo, a Lao noble who had broken away and put himself under Siamese protection. In December 1778 Chaophraya Chakri (the later King Rama I) marched from Nakhon Ratchasima with about 20,000 men and beat the Lao at Nong Bua Lamphu, while his brother Chaophraya Surasi raised some 10,000 Cambodian troops at Oudong, took a fleet up the Mekong, dug a channel round the Liphi falls and took Champasak, whose king Sayakumane was captured and sent to Thonburi. Nakhon Phanom fell in March 1779. King Surinyavong of Luang Prabang, Vientiane’s enemy, joined the Siamese. Chakri and Surasi besieged Vientiane from April 1779; Ong Boun escaped by boat to Khamkeut, and the city fell after a siege of several months, on 28 September 1779 by one account. The Siamese carried off the Emerald Buddha and the Phra Bang image and deported tens of thousands of Lao to central Siam. Vientiane, Luang Prabang and Champasak remained Siamese tributaries until the French took most of Laos in 1893.
: Det fälttåg där Taksins Siam lade de tre laotiska kungariken som hade efterträtt Lan Xang under sin överhöghet. Kung Ong Boun av Vientiane hade kallat in burmeserna mot sin rival Luang Prabang 1764–1765 och misstänktes för att hålla med Burma; 1777–1778 dödade hans trupper Phra Vo, en laotisk adelsman som hade brutit sig loss och ställt sig under siamesiskt beskydd. I december 1778 marscherade Chaophraya Chakri (den senare kung Rama I) från Nakhon Ratchasima med omkring 20 000 man och slog laoterna vid Nong Bua Lamphu, medan hans bror Chaophraya Surasi samlade omkring 10 000 kambodjanska soldater i Oudong, förde en flotta uppför Mekong, grävde en kanal runt Liphifallen och intog Champasak, vars kung Sayakumane tillfångatogs och sändes till Thonburi. Nakhon Phanom föll i mars 1779. Kung Surinyavong av Luang Prabang, Vientianes fiende, anslöt sig till siameserna. Chakri och Surasi belägrade Vientiane från april 1779; Ong Boun flydde med båt till Khamkeut, och staden föll efter en belägring på flera månader, enligt en uppgift den 28 september 1779. Siameserna förde bort Smaragdbuddhan och Phra Bang-statyn och deporterade tiotusentals laoter till centrala Siam. Vientiane, Luang Prabang och Champasak förblev siamesiska tributstater tills fransmännen tog större delen av Laos 1893.
