# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
Siamese invasion of Kedah: Siamesiska invasionen av Kedah
? Siam’s conquest of the Malay sultanate of Kedah in November 1821 and the twenty years of resistance that followed. Kedah had long sent Siam the bunga mas, the gold and silver flowers of submission, but Sultan Ahmad Tajuddin Halim Shah II was suspected of dealing with Siam’s enemy Burma and refused a summons to Bangkok. Chaophraya Nakhon Noi, the Siamese governor of Nakhon Si Thammarat (Ligor), took Kedah by surprise with about 7,000 men; the sultan fled to the British at Penang, and about 10,000 Kedahans followed him into British territory. Siam ruled Kedah directly through Nakhon Noi’s son, and the British, who had refused the sultan help, accepted Siam’s claim in the Burney Treaty of 1826. Kedah princes rose in 1831 and in 1838–1839, joined by risings in Pattani, the Malay kingdom Siam had divided into seven provinces; each time Siamese forces retook the country, in 1838 with a British blockade of the coast. In 1839–1843 Siam cut Perlis and Kubang Pasu out of Kedah under rulers of their own, and in 1842 it restored the old sultan to the rest of Kedah as its vassal.
: Siams erövring av det malajiska sultanatet Kedah i november 1821 och de tjugo år av motstånd som följde. Kedah hade länge sänt Siam bunga mas, de guld- och silverblommor som var ett tecken på underkastelse, men sultan Ahmad Tajuddin Halim Shah II misstänktes för att ha förbindelser med Siams fiende Burma och vägrade hörsamma en kallelse till Bangkok. Chaophraya Nakhon Noi, den siamesiske guvernören i Nakhon Si Thammarat (Ligor), överrumplade Kedah med omkring 7 000 man; sultanen flydde till britterna på Penang, och omkring 10 000 kedahbor följde honom in på brittiskt område. Siam styrde Kedah direkt genom Nakhon Nois son, och britterna, som hade vägrat sultanen hjälp, godtog Siams anspråk i Burneyfördraget 1826. Prinsar från Kedah reste sig 1831 och 1838–1839, samtidigt med resningar i Pattani, det malajiska kungarike som Siam hade delat upp i sju provinser; varje gång återtog siamesiska styrkor landet, 1838 med stöd av en brittisk blockad av kusten. Åren 1839–1843 skar Siam ut Perlis och Kubang Pasu ur Kedah under egna härskare, och 1842 återinsatte Siam den gamle sultanen över resten av Kedah som sin vasall.
