Siamese revolution of 1688: Siamesiska revolutionen 1688
? The coup in which Phetracha, commander of King Narai’s elephant corps, seized power in Siam and drove out the French garrisons that Narai had admitted. Narai’s Greek minister Constantine Phaulkon had brought a French expedition to Siam in 1687, whose troops held fortresses at Bangkok, guarding the river to Ayutthaya, and at Mergui. With Narai gravely ill, Phetracha, backed by much of the court and the Buddhist clergy, took over the palace at Lopburi on 17–18 May 1688 and arrested the king. Phaulkon was beheaded on 5 June and Narai’s adopted son and his brothers were killed; Narai died in July, and Phetracha was crowned on 1 August. About 40,000 Siamese troops with more than a hundred cannon besieged the 200 French in Bangkok for four months, while the Mergui garrison escaped by sea under fire. Neither side could win, and on 13 November 1688 the French under General Desfarges sailed for Pondicherry under a negotiated agreement. Siam renewed its treaty with the Dutch East India Company the next day and kept the Western powers at a distance for a century and a half.
: Den kupp där Phetracha, befälhavare för kung Narais elefantkår, tog makten i Siam och drev ut de franska garnisoner som Narai hade släppt in. Narais grekiske minister Constantine Phaulkon hade fört en fransk expedition till Siam 1687, vars trupper höll fästningar i Bangkok, som bevakade floden upp till Ayutthaya, och i Mergui. Medan Narai låg svårt sjuk tog Phetracha, med stöd av stora delar av hovet och det buddhistiska prästerskapet, över palatset i Lopburi den 17–18 maj 1688 och lät gripa kungen. Phaulkon halshöggs den 5 juni, och Narais adoptivson och hans bröder dödades; Narai dog i juli, och Phetracha kröntes den 1 augusti. Omkring 40 000 siamesiska soldater med mer än hundra kanoner belägrade de 200 fransmännen i Bangkok i fyra månader, medan garnisonen i Mergui flydde sjövägen under beskjutning. Ingen av sidorna kunde vinna, och den 13 november 1688 seglade fransmännen under general Desfarges till Pondichéry enligt en förhandlad överenskommelse. Siam förnyade sitt fördrag med Nederländska ostindiska kompaniet dagen därpå och höll västmakterna på avstånd i halvtannat sekel.
