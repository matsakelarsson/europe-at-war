# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
Siamese revolution of 1932 and the Boworadet rebellion: Siamesiska revolutionen 1932 och Boworadetupproret
? The end of absolute monarchy in Siam and the royalist attempt to undo it. The People’s Party (Khana Ratsadon) was founded in Paris in February 1927 by seven Siamese students and officers, among them the lawyer Pridi Banomyong and the army officer Plaek Phibunsongkhram, and later joined by senior officers led by Phraya Phahon Phonphayuhasena and Phraya Songsuradet. At dawn on 24 June 1932, while King Prajadhipok was at the seaside palace of Hua Hin, they took control of Bangkok, held Prince Paribatra and other royal officials hostage and announced the end of absolute rule at the Royal Plaza. The seizure of power was almost bloodless. The king returned to Bangkok on 26 June and signed a temporary charter on 27 June, and a permanent constitution, which restored some royal powers, on 10 December 1932. Quarrels over Pridi’s economic plan led the prime minister, Phraya Manopakorn Nititada, to close the assembly in April 1933, and Phraya Phahon removed him in a second coup on 20 June 1933. On 11 October 1933 Prince Boworadet, a former minister of defence, led garrisons from Nakhon Ratchasima and other provinces in a royalist rising; they took Don Mueang airfield north of Bangkok, but the navy stayed neutral and government troops under Phibun retook the airfield on 16 October and beat the rebels at Hin Lap on 23 October, where their commander Phraya Si Sitthisongkhram was killed. Boworadet fled to French Indochina on 25 October. Many rebels were jailed but none was executed. The failure strengthened the People’s Party and Phibun’s career, and King Prajadhipok, who had left for Europe, abdicated on 2 March 1935.
: Slutet på den absoluta monarkin i Siam och rojalisternas försök att göra den ogjord. Folkpartiet (Khana Ratsadon) grundades i Paris i februari 1927 av sju siamesiska studenter och officerare, bland dem juristen Pridi Banomyong och arméofficeren Plaek Phibunsongkhram, och fick senare sällskap av högre officerare under ledning av Phraya Phahon Phonphayuhasena och Phraya Songsuradet. I gryningen den 24 juni 1932, medan kung Prajadhipok vistades i strandpalatset i Hua Hin, tog de kontroll över Bangkok, tog prins Paribatra och andra kungliga ämbetsmän som gisslan och tillkännagav på Kungliga torget att envåldsstyret var slut. Maktövertagandet var nästan oblodigt. Kungen återvände till Bangkok den 26 juni och undertecknade en provisorisk författning den 27 juni och en permanent författning, som återställde en del av kungamakten, den 10 december 1932. Gräl om Pridis ekonomiska plan fick premiärministern, Phraya Manopakorn Nititada, att stänga församlingen i april 1933, och Phraya Phahon avsatte honom i en andra kupp den 20 juni 1933. Den 11 oktober 1933 ledde prins Boworadet, en tidigare försvarsminister, garnisoner från Nakhon Ratchasima och andra provinser i en rojalistisk resning; de intog flygfältet Don Mueang norr om Bangkok, men flottan förhöll sig neutral, och regeringstrupper under Phibun återtog flygfältet den 16 oktober och besegrade rebellerna vid Hin Lap den 23 oktober, där deras befälhavare Phraya Si Sitthisongkhram stupade. Boworadet flydde till Franska Indokina den 25 oktober. Många rebeller fängslades, men ingen avrättades. Misslyckandet stärkte Folkpartiet och Phibuns karriär, och kung Prajadhipok, som hade rest till Europa, abdikerade den 2 mars 1935.
