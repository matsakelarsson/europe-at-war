# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
Siamese–Vietnamese wars over Cambodia: Siamesisk-vietnamesiska krigen om Kambodja
Two wars between Siam and Vietnam for control of Cambodia, whose kings had long paid tribute to both. In November 1833, with southern Vietnam in revolt under Lê Văn Khôi, Rama III sent armies under Chaophraya Bodindecha into Cambodia and a fleet against Hà Tiên. The Siamese drove the pro-Vietnamese king Ang Chan from Phnom Penh, but were beaten on the Vàm Nao channel in January 1834 and withdrew. Vietnam then ruled most of Cambodia directly as the province of Trấn Tây, with Ang Chan’s daughter Ang Mey as a figurehead queen. Its attempts to remake Cambodian government and customs on the Vietnamese model provoked a general Cambodian rising in 1840, and Siam invaded again with Prince Ang Duong. Vietnam withdrew in 1841, returned in 1845 and besieged the Siamese at Oudong, and in December 1845 both sides agreed that Ang Duong should rule as a vassal of both courts. He was invested by Vietnam in 1847 and crowned by Siam in 1848.: Två krig mellan Siam och Vietnam om herraväldet över Kambodja, vars kungar länge hade betalat tribut till båda. I november 1833, när södra Vietnam hade rest sig under Lê Văn Khôi, sände Rama III arméer under Chaophraya Bodindecha in i Kambodja och en flotta mot Hà Tiên. Siameserna drev den vietnamvänlige kungen Ang Chan från Phnom Penh, men de besegrades vid Vàm Nao-kanalen i januari 1834 och drog sig tillbaka. Vietnam styrde därefter större delen av Kambodja direkt som provinsen Trấn Tây, med Ang Chans dotter Ang Mey som drottning till namnet. Vietnams försök att omforma Kambodjas styre och seder efter vietnamesisk förebild framkallade en allmän kambodjansk resning 1840, och Siam invaderade på nytt med prins Ang Duong. Vietnam drog sig tillbaka 1841, återvände 1845 och belägrade siameserna i Oudong, och i december 1845 kom båda sidor överens om att Ang Duong skulle regera som vasall under båda hoven. Han insattes formellt av Vietnam 1847 och kröntes av Siam 1848.
