Siege of Baghdad (1258): Belägringen av Bagdad (1258)
The Mongol conquest of Baghdad, capital of the Abbasid caliphate for five hundred years. After destroying the Nizari Ismailis, Hülegü demanded that the caliph al-Musta’sim submit; the caliph refused, and in the winter of 1257–1258 Mongol armies converged on Iraq from three directions. A caliphal army was destroyed by flooding near the Dujayl canal on 17 January, the city was surrounded, and after the walls were breached the caliph surrendered on 10 February. The Mongols sacked Baghdad for about a week and killed a great many of its people; the caliph was executed on 20 February. The fall of Baghdad ended the Abbasid caliphate there and made Iraq a province of the new Mongol Ilkhanate.: Mongolernas erövring av Bagdad, det abbasidiska kalifatets huvudstad i femhundra år. Sedan Hülegü hade förintat de nizaritiska ismailiterna krävde han att kalifen al-Musta’sim skulle underkasta sig; kalifen vägrade, och vintern 1257–1258 ryckte mongoliska arméer fram mot Irak från tre håll. En av kalifens arméer förintades av översvämningar nära Dujaylkanalen den 17 januari, staden omringades, och sedan murarna hade genombrutits kapitulerade kalifen den 10 februari. Mongolerna plundrade Bagdad i omkring en vecka och dödade ett mycket stort antal av dess invånare; kalifen avrättades den 20 februari. Bagdads fall gjorde slut på det abbasidiska kalifatet där, och Irak blev en provins i det nya mongoliska Ilkhanatet.
