Siege of Belgrade, 1456: Belägringen av Belgrad 1456
Mehmed II’s attempt, three years after taking Constantinople, to capture Belgrade, Hungary’s great fortress where the Sava meets the Danube. Defended by Michael Szilágyi and relieved by John Hunyadi’s fleet and an army of crusaders raised by the friar John of Capistrano, the fortress beat off a general assault on 21–22 July, and a sortie the next day overran the Ottoman guns. The sultan, wounded, withdrew, and Ottoman expansion into Hungary was checked for some seventy years.: Mehmed II:s försök, tre år efter erövringen av Konstantinopel, att inta Belgrad, Ungerns stora fästning där Sava möter Donau. Fästningen, som försvarades av Mihály Szilágyi och undsattes av János Hunyadis flotta och en korsfararhär som munken Johannes av Capistrano hade samlat, slog tillbaka en storm den 21–22 juli, och ett utfall dagen därpå erövrade de osmanska kanonerna. Den sårade sultanen drog sig tillbaka, och den osmanska expansionen in i Ungern hejdades i omkring sjuttio år.
