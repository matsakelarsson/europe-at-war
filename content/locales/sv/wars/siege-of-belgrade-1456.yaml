Numbers vary widely. The garrison had perhaps 5,000–7,000 men, and Hunyadi brought a larger relief force, many of them peasant crusaders. Modern estimates of the Ottoman army range from about 30,000 to 60,000 or more, with dozens of cannon and a river fleet.: Uppgifterna om styrkornas storlek varierar kraftigt. Garnisonen hade kanske 5 000–7 000 man, och Hunyadi förde med sig en större undsättningsstyrka, många av dem korsfarande bönder. Moderna uppskattningar av den osmanska armén varierar från omkring 30 000 till 60 000 man eller fler, med dussintals kanoner och en flodflotta.
Pope Callixtus III’s order that church bells be rung at noon to pray for the defenders is often said to commemorate the victory; in fact it was issued before the battle. The story of Titusz Dugovics, who is said to have thrown himself from the walls with a Turkish standard-bearer, is a later legend.: Påve Calixtus III:s påbud om att kyrkklockorna skulle ringa vid middagstid till bön för försvararna sägs ofta minnas segern; i själva verket utfärdades det före slaget. Berättelsen om Titusz Dugovics, som sägs ha kastat sig från murarna tillsammans med en turkisk fanbärare, är en senare legend.
After campaigns against the Serbian despotate in 1454 and 1455, Mehmed II marched on Belgrade, the “key to Hungary”, which Hunyadi had strengthened at his own expense. The sultan brought a large army, many heavy cannon cast for the campaign and a fleet of river boats to close the Danube. The fortress, on a headland between the two rivers, was held by Hunyadi’s brother-in-law Michael Szilágyi with a few thousand men. Meanwhile the Franciscan friar John of Capistrano preached the crusade in Hungary, and thousands of peasants, townsmen and minor nobles, poorly armed but eager, gathered with Hunyadi at Zemun on the opposite bank.: Efter fälttåg mot det serbiska despotatet 1454 och 1455 marscherade Mehmed II mot Belgrad, ”nyckeln till Ungern”, som Hunyadi hade befäst på egen bekostnad. Sultanen förde med sig en stor armé, många tunga kanoner som gjutits för fälttåget och en flotta av flodbåtar för att stänga Donau. Fästningen, på en udde mellan de två floderna, hölls av Hunyadis svåger Mihály Szilágyi med några tusen man. Under tiden predikade franciskanbrodern Johannes av Capistrano korståg i Ungern, och tusentals bönder, stadsbor och lågadliga, dåligt beväpnade men ivriga, samlades hos Hunyadi i Zemun på andra stranden.
From 4 July the Ottoman guns battered the walls. Hunyadi gathered boats along the Danube, and on 14 July, attacked from upstream by his flotilla and from the fortress by about forty vessels manned by Serbian boatmen, the Ottoman fleet was broken after five hours of fighting; several large galleys were sunk and others captured. Hunyadi could now bring his troops and supplies into the fortress.: Från den 4 juli besköt de osmanska kanonerna murarna. Hunyadi samlade båtar längs Donau, och den 14 juli, anfallen uppifrån floden av hans flottilj och från fästningen av omkring fyrtio fartyg bemannade med serbiska båtsmän, krossades den osmanska flottan efter fem timmars strid; flera stora galärer sänktes och andra erövrades. Hunyadi kunde nu föra in sina trupper och förnödenheter i fästningen.
