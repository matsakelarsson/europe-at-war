On the evening of 21 July Mehmed launched a general assault that went on all night. The janissaries broke into the lower town and climbed towards the citadel, but the defenders threw down burning wood and tar, and a wall of fire cut off those inside the walls from their comrades. The janissaries trapped inside were killed, and the attack outside the walls was beaten off with heavy losses.: På kvällen den 21 juli inledde Mehmed en allmän stormning som pågick hela natten. Janitsharerna bröt sig in i den nedre staden och klättrade upp mot citadellet, men försvararna kastade ned brinnande trä och tjära, och en mur av eld skar av dem som befann sig innanför murarna från deras kamrater. De janitsharer som var instängda innanför dödades, och anfallet utanför murarna slogs tillbaka med svåra förluster.
On 22 July crusaders slipped out against orders to skirmish with the Ottomans, and others followed until Capistrano, unable to call them back, led them across the Sava against the Ottoman flank, while Hunyadi charged out of the fortress and seized the Ottoman guns. Mehmed fought in person and was wounded, and the Ottomans recovered their camp, but that night they withdrew, leaving much of their artillery and baggage behind. Plague broke out in the Christian camp; Hunyadi died of it at Zemun on 11 August, and Capistrano in October.: Den 22 juli smög sig korsfarare ut mot order för att skärmytsla med osmanerna, och andra följde efter, tills Capistrano, som inte kunde kalla tillbaka dem, ledde dem över Sava mot den osmanska flanken, medan Hunyadi gjorde ett utfall från fästningen och erövrade de osmanska kanonerna. Mehmed stred personligen och sårades, och osmanerna återtog sitt läger, men samma natt drog de sig tillbaka och lämnade en stor del av sitt artilleri och sin tross efter sig. Pest bröt ut i det kristna lägret; Hunyadi dog i den i Zemun den 11 augusti och Capistrano i oktober.
