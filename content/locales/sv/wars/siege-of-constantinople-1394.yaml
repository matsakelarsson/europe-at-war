Siege of Constantinople, 1394–1402: Belägringen av Konstantinopel 1394–1402
The long blockade of Constantinople by Sultan Bayezid I. By 1391 Ottoman conquests had cut the city off from its hinterland, and after Emperor Manuel II refused to come to him as a vassal, Bayezid built the castle of Anadolu Hisarı (Güzelce Hisar) on the Asian shore of the Bosporus and tried to starve the city into surrender, by land and less effectively by sea. The Crusade of Nicopolis, launched partly to relieve it, was destroyed in 1396. In 1399 Marshal Boucicaut arrived with about 1,200 French soldiers but could do little, and in December Manuel left the city to seek help in Venice, Paris and London, leaving his nephew John VII in charge. The siege ended when Timur invaded Anatolia and defeated and captured Bayezid at Ankara in July 1402.: Sultan Bayezid I:s långa blockad av Konstantinopel. År 1391 hade de osmanska erövringarna skurit av staden från dess omland, och sedan kejsar Manuel II vägrat infinna sig hos honom som vasall byggde Bayezid borgen Anadolu Hisarı (Güzelce Hisar) på Bosporens asiatiska strand och försökte svälta staden till kapitulation, till lands och mindre effektivt till sjöss. Korståget mot Nikopolis, som delvis inleddes för att undsätta staden, förintades 1396. År 1399 anlände marskalk Boucicaut med omkring 1 200 franska soldater men kunde uträtta lite, och i december lämnade Manuel staden för att söka hjälp i Venedig, Paris och London och överlät styret åt sin brorson Johannes VII. Belägringen upphörde när Timur invaderade Anatolien och besegrade och tillfångatog Bayezid vid Ankara i juli 1402.
