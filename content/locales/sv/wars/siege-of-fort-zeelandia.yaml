# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
Siege of Fort Zeelandia: Belägringen av Fort Zeelandia
The Ming loyalist commander Zheng Chenggong (Koxinga) took Taiwan from the Dutch East India Company (VOC) in 1661–1662. Defeated before Nanjing in 1659 and squeezed by the Qing on the Fujian coast, he needed a new base. On 30 April 1661 his fleet of several hundred junks, carrying about 25,000 men, slipped through the shallow Luermen channel into the bay behind Tayouan, landed on the main island, routed a Dutch sortie and forced Fort Provintia to surrender within days. Governor Frederick Coyett held Fort Zeelandia, the Company’s castle on the Tayouan sandbar, through a nine-month siege. A relief fleet from Batavia failed to break the blockade, and after a deserter showed Koxinga how to take the Utrecht redoubt overlooking the castle, Coyett surrendered on 1 February 1662. Koxinga made Taiwan the seat of a Zheng state, later called the Kingdom of Tungning, and died there in June 1662.: Den minglojalistiske befälhavaren Zheng Chenggong (Koxinga) tog Taiwan från Nederländska ostindiska kompaniet (VOC) 1661–1662. Besegrad framför Nanking 1659 och hårt trängd av Qing vid Fujians kust behövde han en ny bas. Den 30 april 1661 tog sig hans flotta på flera hundra djonker, med omkring 25 000 man ombord, genom den grunda Luermenkanalen in i bukten bakom Tayouan, landsteg på huvudön, slog ett nederländskt utfall på flykten och tvingade Fort Provintia att kapitulera inom några dagar. Guvernören Frederick Coyett höll Fort Zeelandia, kompaniets borg på sandbanken vid Tayouan, under en nio månader lång belägring. En undsättningsflotta från Batavia lyckades inte bryta blockaden, och sedan en desertör hade visat Koxinga hur han kunde ta skansen Utrecht, som behärskade borgen, kapitulerade Coyett den 1 februari 1662. Koxinga gjorde Taiwan till säte för en Zhengstat, senare kallad kungariket Tungning, och dog där i juni 1662.
