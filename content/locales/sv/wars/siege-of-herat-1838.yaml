Siege of Herat: Belägringen av Herat
Mohammad Shah Qajar’s attempt to take Herat, held since 1818 by the last Sadozai prince, Kamran Shah, and his vizier Yar Mohammad Khan Alakozai. Iran regarded Herat as part of Khorasan, and Herati and Turkmen raids had laid waste the frontier. Encouraged by the Russian envoy Count Simonich and opposed by the British, the shah took the fort of Ghurian and besieged Herat from November 1837. The city, helped by a young British officer, Eldred Pottinger, and by a Sunni confederacy of Aimaq, Hazara, Uzbek and Turkmen tribes, held out for ten months and beat off a general assault on 24 June 1838. Britain occupied Kharg Island in the Gulf and threatened war, and on 9 September 1838 the shah lifted the siege. The crisis was the immediate occasion of the First Anglo-Afghan War.: Mohammad Shah Qajars försök att inta Herat, som sedan 1818 behärskades av den siste sadozaifursten, Kamran Shah, och hans vesir Yar Mohammad Khan Alakozai. Iran betraktade Herat som en del av Khorasan, och räder från Herat och från turkmenerna hade ödelagt gränstrakterna. Uppmuntrad av det ryska sändebudet greve Simonich och motarbetad av britterna intog shahen fortet Ghurian och belägrade Herat från november 1837. Staden, som fick hjälp av en ung brittisk officer, Eldred Pottinger, och av ett sunnimuslimskt förbund av aimaq-, hazara-, uzbek- och turkmenstammar, höll ut i tio månader och slog tillbaka en allmän stormning den 24 juni 1838. Storbritannien besatte ön Kharg i Persiska viken och hotade med krig, och den 9 september 1838 hävde shahen belägringen. Krisen var den direkta anledningen till första anglo-afghanska kriget.
