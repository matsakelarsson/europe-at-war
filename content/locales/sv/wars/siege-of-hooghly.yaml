# Svenska översättningar av katalogtexten (våg 8); stegtexterna kommer senare.
Siege of Hooghly: Belägringen av Hooghly
? The Mughal siege and capture of Hooghly (Hugli), the Portuguese trading town on the Hooghly river in western Bengal. The Portuguese settlement had grown from about 1579 into the chief port of Bengal, but Mughal officials accused its people of evading customs, of piracy and of raiding the delta for slaves, often together with the Arakanese, and of converting people by force. Shah Jahan, who is said also to have resented the Portuguese for refusing him help when he was a rebel prince in Bengal, ordered the governor of Bengal, Qasim Khan Juvayni, to take it. A large Mughal army and fleet laid siege to the town from 24 June 1632. The garrison of about 300 Portuguese and some 700 Indian Christians held out for about three months, until the Mughals blew a breach with a mine and stormed it in September (Banglapedia gives 13 September, other accounts 24 September). Many were killed in the fighting and as they tried to escape down the river, and about 4,000 men, women and children were taken prisoner and sent to Agra. Some Portuguese later came back to trade at Hooghly and the neighbouring Bandel, but the town never recovered its importance.
: Mogulernas belägring och erövring av Hooghly (Hugli), den portugisiska handelsstaden vid floden Hooghly i västra Bengalen. Den portugisiska bosättningen hade från omkring 1579 vuxit till Bengalens främsta hamn, men mogulämbetsmän anklagade dess invånare för att undandra sig tull, för sjöröveri och för slavräder i deltat, ofta tillsammans med arakaneserna, och för att omvända människor med tvång. Shah Jahan, som också sägs ha hyst agg mot portugiserna för att de hade vägrat hjälpa honom när han var en upprorisk prins i Bengalen, beordrade Bengalens guvernör, Qasim Khan Juvayni, att inta staden. En stor mogularmé och flotta belägrade staden från den 24 juni 1632. Garnisonen på omkring 300 portugiser och omkring 700 indiska kristna höll stånd i ungefär tre månader, tills mogulerna sprängde en bräsch med en mina och stormade staden i september (Banglapedia anger den 13 september, andra källor den 24 september). Många dödades i striderna och när de försökte fly nedför floden, och omkring 4 000 män, kvinnor och barn togs till fånga och fördes till Agra. En del portugiser återvände senare för att driva handel i Hooghly och grannorten Bandel, men staden återfick aldrig sin betydelse.
