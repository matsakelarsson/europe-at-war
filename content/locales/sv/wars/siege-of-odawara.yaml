Odawara Campaign: Odawarafälttåget
? Toyotomi Hideyoshi’s campaign against the Later Hōjō, the last great independent house of eastern Japan. From their castle at Odawara the Hōjō had ruled most of the Kantō for almost a century, and Hōjō Ujimasa, the retired head who still led the house, put off Hideyoshi’s demands that he come to Kyoto and submit. When a Hōjō commander seized the Sanada castle of Nagurumi at the end of 1589, Hideyoshi declared war. In the spring of 1590 he led an army put at over 200,000 men, with Tokugawa Ieyasu, along the Tōkaidō, while a second army under Maeda Toshiie and Uesugi Kagekatsu came over the mountains from the north and a fleet sailed round the Izu peninsula. Yamanaka castle on the Hakone pass fell in a day, and from May Odawara was surrounded. The Hōjō castles in the Kantō fell one by one, and on 4 August 1590 Hōjō Ujinao surrendered Odawara. Ujimasa and his brother Ujiteru were made to take their own lives, Ujinao was sent into exile on Mount Kōya, and the Hōjō lands were given to Ieyasu, who made Edo his capital. With Date Masamune and the northern lords submitting, all Japan now acknowledged Hideyoshi.
: Toyotomi Hideyoshis fälttåg mot Senare Hōjō, det sista stora självständiga huset i östra Japan. Från sin borg i Odawara hade Hōjō styrt större delen av Kantō i nästan ett sekel, och Hōjō Ujimasa, det avgångna överhuvudet som fortfarande ledde huset, sköt upp att efterkomma Hideyoshis krav på att komma till Kyoto och underkasta sig. När en av Hōjōs befälhavare i slutet av 1589 intog Sanadaklanens borg Nagurumi förklarade Hideyoshi krig. Våren 1590 ledde han, tillsammans med Tokugawa Ieyasu, en armé som uppskattas till över 200 000 man längs Tōkaidō, medan en andra armé under Maeda Toshiie och Uesugi Kagekatsu kom över bergen från norr och en flotta seglade runt Izuhalvön. Yamanaka slott vid Hakonepasset föll på en dag, och från maj var Odawara omringat. Hōjōs borgar i Kantō föll en efter en, och den 4 augusti 1590 överlämnade Hōjō Ujinao Odawara. Ujimasa och hans bror Ujiteru tvingades ta sina liv, Ujinao förvisades till berget Kōya och Hōjōs länder gavs till Ieyasu, som gjorde Edo till sin huvudstad. När Date Masamune och de nordliga herrarna underkastade sig erkände nu hela Japan Hideyoshi.
