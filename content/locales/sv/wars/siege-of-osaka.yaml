# Svenska översättningar av katalogtexten (våg 10); stegtexterna kommer senare.
Siege of Osaka: Belägringen av Osaka
? The two campaigns in which the Tokugawa shogunate destroyed the Toyotomi family, the last power in Japan that could rival it. After Sekigahara, Toyotomi Hideyoshi’s son Hideyori kept Osaka Castle, the strongest fortress in the country, with his mother Yodo-dono and a large fortune, while Tokugawa Ieyasu became shogun in 1603 and passed the title to his son Hidetada in 1605. In 1614 Ieyasu took offence at the inscription on a bell cast for the Hōkō-ji temple that Hideyori had rebuilt in Kyoto, and when tens of thousands of masterless samurai (rōnin), many of them men dispossessed after Sekigahara, gathered in Osaka, he marched on the city with about 164,000 men. In the winter campaign (November 1614 – January 1615) the defenders, perhaps 100,000 strong, held the castle; Sanada Yukimura’s earthwork, the Sanada-maru, threw back the attackers, and Ieyasu turned to European cannon bought from English and Dutch merchants. A shot into Yodo-dono’s quarters helped bring about a peace on 22 January 1615 by which the outer moats were to be filled; the Tokugawa filled the inner moats as well. In the summer campaign (May–June 1615) the Toyotomi generals came out to fight in the open and were defeated at Kashii, Dōmyōji, Yao and Wakae, and on 3 June in the decisive battle around Tennōji, where Sanada was killed. The next day the castle burned and Hideyori and Yodo-dono killed themselves; Hideyori’s eight-year-old son Kunimatsu was beheaded. The shogunate then decreed one castle to a province and issued the first Laws for the Military Houses, and Japan saw no war on this scale until the 1860s.
: De två fälttåg där Tokugawashogunatet förintade Toyotomisläkten, den sista makt i Japan som kunde mäta sig med det. Efter Sekigahara behöll Toyotomi Hideyoshis son Hideyori Osakaborgen, landets starkaste fästning, tillsammans med sin mor Yodo-dono och en stor förmögenhet, medan Tokugawa Ieyasu blev shogun 1603 och överlät titeln till sin son Hidetada 1605. År 1614 tog Ieyasu anstöt av inskriptionen på en klocka som gjutits för templet Hōkō-ji, som Hideyori hade byggt upp igen i Kyoto, och när tiotusentals herrelösa samurajer (rōnin), många av dem män som berövats sina ägor efter Sekigahara, samlades i Osaka tågade han mot staden med omkring 164 000 man. Under vinterfälttåget (november 1614 – januari 1615) höll försvararna, kanske 100 000 man starka, borgen; Sanada Yukimuras jordverk, Sanada-maru, slog tillbaka angriparna, och Ieyasu tog till europeiska kanoner köpta av engelska och nederländska köpmän. Ett skott in i Yodo-donos gemak bidrog till en fred den 22 januari 1615, enligt vilken de yttre vallgravarna skulle fyllas igen; Tokugawasidan fyllde även igen de inre vallgravarna. Under sommarfälttåget (maj–juni 1615) gick Toyotomis generaler ut för att strida i öppen terräng och besegrades vid Kashii, Dōmyōji, Yao och Wakae, och den 3 juni i det avgörande slaget kring Tennōji, där Sanada stupade. Dagen därpå brann borgen och Hideyori och Yodo-dono tog livet av sig; Hideyoris åttaårige son Kunimatsu halshöggs. Shogunatet påbjöd därefter en borg per provins och utfärdade de första lagarna för krigarhusen, och Japan upplevde inget krig av denna omfattning förrän på 1860-talet.
