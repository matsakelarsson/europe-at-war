The janissaries broke into the city through the Italian sector but were driven out after three hours’ fighting.: Janitsharerna bröt sig in i staden genom den italienska sektorn men drevs ut efter tre timmars strid.
Tower of St Nicholas: Sankt Nikolaustornet
The fort at the end of the harbour mole was battered to ruins but held, keeping the harbour open.: Fästet längst ut på hamnpiren sköts sönder till ruiner men höll stånd och höll hamnen öppen.
The fleet anchored in the gulf of Trianda, west of the city, and the army landed there.: Flottan ankrade i Triandaviken väster om staden, och armén landsteg där.
