The Ottoman army is put at about 70,000 men by d’Aubusson, a figure that may be inflated; the defenders numbered a few hundred knights and perhaps 2,000–3,000 soldiers, besides the citizens. The best-known account is by the order’s vice-chancellor Guillaume Caoursin, an eyewitness.: Den osmanska armén anges av d’Aubusson till omkring 70 000 man, en siffra som kan vara uppblåst; försvararna utgjordes av några hundra riddare och kanske 2 000–3 000 soldater, utöver borgarna. Den mest kända skildringen är av ordens vicekansler Guillaume Caoursin, ett ögonvittne.
