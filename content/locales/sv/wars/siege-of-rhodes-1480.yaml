Siege of Rhodes, 1480: Belägringen av Rhodos 1480
The failed Ottoman attempt to take Rhodes from the Knights Hospitaller. A fleet and army under Mesih Pasha landed in May 1480 and bombarded the city for nearly three months, but the Knights and the townspeople under Grand Master Pierre d’Aubusson beat off the attacks on the harbour tower of St Nicholas and, on 27 July, a great assault that had already broken into the city. In August the Ottomans withdrew. Rhodes fell to Suleiman the Magnificent in 1522.: Det misslyckade osmanska försöket att ta Rhodos från johanniterorden. En flotta och en armé under Mesih pasha landsteg i maj 1480 och beköt staden i nästan tre månader, men riddarna och stadsborna under stormästaren Pierre d’Aubusson slog tillbaka anfallen mot hamntornet S:t Nikolaus och den 27 juli en stor stormning som redan hade brutit sig in i staden. I augusti drog sig osmanerna tillbaka. Rhodos föll för Süleyman den store 1522.
