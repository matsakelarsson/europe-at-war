The Knights of St John had ruled Rhodes since 1310, raiding Muslim shipping from its harbours. After the peace with Venice, Mehmed II sent a fleet of about 160 ships and a large army under Mesih Pasha, a member of the Byzantine imperial family who had become an Ottoman commander. They landed on 23 May and set up their heavy guns. The first attacks, from 9 June, fell on the Tower of St Nicholas guarding the harbour mole; d’Aubusson himself led its defence, and the assaults were driven off.: Johanniterriddarna hade härskat över Rhodos sedan 1310 och angripit muslimsk sjöfart från dess hamnar. Efter freden med Venedig sände Mehmed II en flotta på omkring 160 fartyg och en stor armé under Mesih pasha, en medlem av den bysantinska kejsarfamiljen som hade blivit osmansk befälhavare. De landsteg den 23 maj och ställde upp sina tunga kanoner. De första anfallen, från den 9 juni, riktades mot Sankt Nikolaustornet, som bevakade hamnpiren; d’Aubusson ledde själv dess försvar, och stormningarna slogs tillbaka.
The Ottomans then battered the weak eastern walls by the Jewish quarter, in the sector of the knights of Italy, while the defenders dug a new ditch and wall behind them. At dawn on 27 July janissaries stormed the breach, raised their flags on the Tower of Italy and entered the city. In three hours of fighting, with the grand master wounded five times, they were thrown back, and the counter-attack reached the Ottoman camp. After losing thousands of men, Mesih Pasha re-embarked his army, and the fleet sailed away by 17 August. Mehmed planned a new expedition but died in May 1481.: Osmanerna besköt sedan de svaga östra murarna vid judiska kvarteret, i den italienska riddarnas avsnitt, medan försvararna grävde en ny vallgrav och byggde en ny mur bakom dem. I gryningen den 27 juli stormade janitsharer breschen, hissade sina fanor på Italienska tornet och trängde in i staden. Under tre timmars strid, där stormästaren sårades fem gånger, kastades de tillbaka, och motanfallet nådde ända fram till det osmanska lägret. Efter att ha förlorat tusentals man skeppade Mesih pasha in sin armé igen, och flottan hade seglat bort den 17 augusti. Mehmed planerade en ny expedition men dog i maj 1481.
