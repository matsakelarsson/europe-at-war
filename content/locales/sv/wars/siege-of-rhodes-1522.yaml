Dates are Julian. The size of the Ottoman army is uncertain; accounts of the time give 100,000 or more, including the men who rowed the fleet and dug the mines, and modern historians suggest fewer.: Datumen anges enligt den julianska kalendern. Den osmanska arméns storlek är osäker; samtida källor anger 100 000 man eller fler, inklusive de män som rodde flottan och grävde minorna, och moderna historiker antar färre.
The knights had beaten off an earlier Ottoman siege in 1480, under Mehmed II, which has its own entry.: Riddarna hade slagit tillbaka en tidigare osmansk belägring 1480, under Mehmed II, som har en egen artikel.
