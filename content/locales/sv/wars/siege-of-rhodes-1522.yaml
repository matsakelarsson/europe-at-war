Siege of Rhodes, 1522: Belägringen av Rhodos 1522
Suleiman the Magnificent’s siege of Rhodes, held since 1310 by the Knights Hospitaller, a military religious order whose galleys raided Muslim shipping between Constantinople and Egypt. After six months of bombardment, mining and assaults, Grand Master Philippe Villiers de L’Isle-Adam surrendered on generous terms in December 1522, and the knights left the island; in 1530 they settled on Malta.: Süleyman den stores belägring av Rhodos, som sedan 1310 innehades av johanniterorden, en andlig riddarorden vars galärer angrep muslimsk sjöfart mellan Konstantinopel och Egypten. Efter sex månader av beskjutning, minering och stormningar kapitulerade stormästaren Philippe Villiers de L’Isle-Adam på generösa villkor i december 1522, och riddarna lämnade ön; 1530 slog de sig ned på Malta.
