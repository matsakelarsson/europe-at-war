Success for the Knights: Riddarnas framgångar
The knights of St John had ruled Rhodes and its neighbouring islands for two centuries, and their raids on Muslim ships and pilgrims were a constant affront to the sultans. On 26 June 1522 an Ottoman fleet of some 400 ships landed an army under Çoban Mustafa Pasha, and Suleiman came over from the mainland near Marmaris on 28 July to take command. The new grand master, Philippe Villiers de L’Isle-Adam, had about 700 knights and sergeants of the order and a few thousand mercenaries and Rhodian militia behind some of the strongest walls in Europe, each section held by one of the order’s national “tongues”.: Johanniterriddarna hade härskat över Rhodos och de närliggande öarna i två sekler, och deras räder mot muslimska fartyg och pilgrimer var en ständig skymf mot sultanerna. Den 26 juni 1522 landsatte en osmansk flotta på omkring 400 fartyg en armé under Çoban Mustafa pasha, och Süleyman kom över från fastlandet nära Marmaris den 28 juli för att ta befälet. Den nye stormästaren, Philippe Villiers de L’Isle-Adam, hade omkring 700 av ordens riddare och sergeanter och några tusen legosoldater och rhodisk milis bakom några av Europas starkaste murar, där varje avsnitt hölls av en av ordens nationella ”tungor”.
The Ottoman guns and miners slowly broke the walls. On 4 September two mines brought down part of the bastion of England, and on 24 September a great assault on four bastions was thrown back with very heavy losses. Ahmed Pasha, an experienced siege engineer, took over and kept up the mining into the winter. With no relief coming from Europe and the townspeople pressing him, the grand master agreed terms on 22 December. The knights could leave with their arms, and the people who stayed were promised freedom of worship. On 1 January 1523 the knights sailed for Crete with several thousand Rhodians, and their castles at Bodrum and Kos were handed over.: De osmanska kanonerna och minörerna bröt långsamt ned murarna. Den 4 september fällde två minor en del av den engelska bastionen, och den 24 september slogs en stor stormning mot fyra bastioner tillbaka med mycket svåra förluster. Ahmed pasha, en erfaren belägringsingenjör, tog över och fortsatte mineringen in i vintern. Utan någon undsättning från Europa och under tryck från stadsborna gick stormästaren med på villkor den 22 december. Riddarna fick lämna ön med sina vapen, och de invånare som stannade utlovades religionsfrihet. Den 1 januari 1523 seglade riddarna till Kreta med flera tusen rhodier, och deras borgar i Bodrum och på Kos överlämnades.
