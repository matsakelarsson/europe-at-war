Siege of Thessalonica, 1422–1430: Belägringen av Thessaloniki 1422–1430
The eight-year Ottoman blockade of Thessalonica, the second city of the Byzantine world. Sultan Murad II attacked it in 1422 to punish the Byzantines for backing a rival claimant, and in 1423 its despot Andronikos Palaiologos handed it to Venice, which could neither defend it properly nor make peace on its own terms. Murad took the starving city by storm on 29 March 1430, and it remained Ottoman until 1912.: Den åttaåriga osmanska blockaden av Thessaloniki, den bysantinska världens näst största stad. Sultan Murad II angrep staden 1422 för att straffa bysantinerna för att de stött en rivaliserande tronpretendent, och 1423 överlämnade dess despot Andronikos Palaiologos den till Venedig, som varken kunde försvara den ordentligt eller sluta fred på egna villkor. Murad tog den svältande staden med storm den 29 mars 1430, och den förblev osmansk fram till 1912.
