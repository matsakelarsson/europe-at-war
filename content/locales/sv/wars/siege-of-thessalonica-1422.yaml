The assault fell mainly on the poorly kept eastern walls, where Murad led in person; by mid-morning his troops were in the city. Many Venetians escaped to their ships and Negroponte.: Stormningen riktades främst mot de illa underhållna östra murarna, där Murad själv ledde anfallet; vid förmiddagen var hans trupper inne i staden. Många venetianer flydde till sina fartyg och till Negroponte.
Venetian fleets tried several times to block the Dardanelles here to force Murad to make peace, with little success.: Venetianska flottor försökte flera gånger blockera Dardanellerna här för att tvinga Murad att sluta fred, med ringa framgång.
June – September 1422: juni – september 1422
Murad’s siege of the capital failed, but the blockade of Thessalonica continued.: Murads belägring av huvudstaden misslyckades, men blockaden av Thessalonike fortsatte.
