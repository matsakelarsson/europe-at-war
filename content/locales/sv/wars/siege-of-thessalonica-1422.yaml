Dates are Julian. The city’s population before the siege is estimated at up to 40,000; the main accounts are by the metropolitan Symeon of Thessalonica, who died in 1429, and the eyewitness John Anagnostes, who described the fall.: Datumen anges enligt den julianska kalendern. Stadens befolkning före belägringen uppskattas till upp till 40 000; de viktigaste skildringarna är av metropoliten Symeon av Thessalonike, som dog 1429, och ögonvittnet Johannes Anagnostes, som beskrev stadens fall.
Thessalonica had already been under Ottoman rule from 1387 until 1403, when the Treaty of Gallipoli returned it to Byzantium. Murad II’s siege of Constantinople in 1422 is not told here.: Thessalonike hade redan varit under osmanskt styre från 1387 till 1403, då fördraget i Gallipoli återlämnade staden till Bysans. Murad II:s belägring av Konstantinopel 1422 berättas inte här.
When Murad II became sultan in 1421, the Byzantines backed his uncle Mustafa as a rival. After crushing Mustafa, Murad besieged Constantinople in the summer of 1422 and sent troops to blockade Thessalonica from June. Its ruler, the despot Andronikos Palaiologos, a son of Manuel II, was ill and had neither men nor money to defend it, and in September 1423 he handed the city to Venice. Murad refused to accept the transfer. For years the blockade went on, broken by assaults on the walls, while Venetian and Ottoman ships raided each other’s coasts and Venetian fleets tried in vain to close the Dardanelles at Gallipoli.: När Murad II blev sultan 1421 stödde bysantinerna hans farbror Mustafa som rival. Sedan Murad krossat Mustafa belägrade han Konstantinopel sommaren 1422 och sände trupper för att blockera Thessalonike från juni. Stadens härskare, despoten Andronikos Palaiologos, en son till Manuel II, var sjuk och hade varken soldater eller pengar för att försvara den, och i september 1423 överlämnade han staden till Venedig. Murad vägrade att godta överlåtelsen. I flera år pågick blockaden, avbruten av stormningar mot murarna, medan venetianska och osmanska fartyg härjade varandras kuster och venetianska flottor förgäves försökte stänga Dardanellerna vid Gallipoli.
The city starved, and many of its people fled. Resentment of the Venetian governors grew, and although the metropolitan Symeon urged resistance, most citizens came to prefer surrender to a sack. Venice formally declared war in March 1429 but sent too few soldiers. Early in 1430 Murad gathered a large army before the walls, and on 29 March his troops stormed them. The city was plundered and thousands of its people were enslaved, some 7,000 by one account; its population fell to perhaps 2,000, and Murad later brought in new settlers. Venice made peace in July 1430, accepting the loss.: Staden svalt, och många av dess invånare flydde. Missnöjet med de venetianska guvernörerna växte, och fastän metropoliten Symeon uppmanade till motstånd kom de flesta borgarna att föredra kapitulation framför plundring. Venedig förklarade formellt krig i mars 1429 men sände för få soldater. I början av 1430 samlade Murad en stor armé framför murarna, och den 29 mars stormade hans trupper dem. Staden plundrades och tusentals av dess invånare förslavades, enligt en källa omkring 7 000; befolkningen sjönk till kanske 2 000, och Murad förde senare dit nya bosättare. Venedig slöt fred i juli 1430 och godtog förlusten.
