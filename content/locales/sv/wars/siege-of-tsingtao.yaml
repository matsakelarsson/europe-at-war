# Svenska översättningar av katalogtexten (våg 10); stegtexterna kommer senare.
Siege of Tsingtao: Belägringen av Tsingtao
? The capture of Germany’s naval base at Tsingtao (Qingdao) in China by Japan and Britain in the first months of the First World War, together with Japan’s seizure of Germany’s islands in the northern Pacific. Germany had held the Kiautschou (Jiaozhou Bay) territory on the Shandong peninsula on a 99-year lease since 1898 and built Tsingtao into a fortified port and the base of its East Asia Squadron, with a railway to Jinan. Japan, Britain’s ally since 1902, sent Germany an ultimatum on 15 August 1914 demanding the surrender of the territory and declared war on 23 August. The German squadron had already left for the Pacific. The Japanese 18th Division, about 23,000 men with 142 guns, landed on the north coast of Shandong at Longkou from 2 September, in breach of China’s neutrality, and at Laoshan Bay east of Tsingtao on 18 September, while other troops occupied the Shandong railway as far as Jinan. A British force of about 1,500 men under Brigadier-General Nathaniel Barnardiston joined them. The garrison of about 3,700 to 4,500 German marines, sailors and reservists and the crew of the Austro-Hungarian cruiser Kaiserin Elisabeth under Governor Alfred Meyer-Waldeck fell back to the hills around the town. After a week-long bombardment from 31 October and a night assault, the garrison surrendered on 7 November. In October the Japanese navy took the Marshall, Caroline, Palau and Mariana Islands without a fight. At the Paris Peace Conference in 1919 Japan was given Germany’s rights in Shandong, which set off the May Fourth Movement in China; Japan returned the territory to China in 1922 and governed the islands as a League of Nations mandate, the South Seas Mandate, until 1945.
: Japans och Storbritanniens erövring av Tysklands flottbas Tsingtao (Qingdao) i Kina under första världskrigets första månader, tillsammans med Japans beslagtagande av Tysklands öar i norra Stilla havet. Tyskland hade sedan 1898 arrenderat området Kiautschou (Jiaozhoubukten) på Shandonghalvön på 99 år och byggt ut Tsingtao till en befäst hamn och bas för sin ostasiatiska eskader, med en järnväg till Jinan. Japan, Storbritanniens bundsförvant sedan 1902, ställde den 15 augusti 1914 ett ultimatum till Tyskland med krav på att området skulle överlämnas och förklarade krig den 23 augusti. Den tyska eskadern hade redan avgått till Stilla havet. Japanska 18:e divisionen, omkring 23 000 man med 142 kanoner, landsteg på Shandongs nordkust vid Longkou från den 2 september, i strid med Kinas neutralitet, och vid Laoshanbukten öster om Tsingtao den 18 september, medan andra trupper besatte Shandongjärnvägen ända till Jinan. En brittisk styrka på omkring 1 500 man under brigadgeneral Nathaniel Barnardiston anslöt sig. Garnisonen på omkring 3 700 till 4 500 tyska marinsoldater, sjömän och reservister och besättningen på den österrikisk-ungerska kryssaren Kaiserin Elisabeth under guvernör Alfred Meyer-Waldeck drog sig tillbaka till höjderna runt staden. Efter en veckolång beskjutning från den 31 oktober och ett nattligt anfall kapitulerade garnisonen den 7 november. I oktober tog den japanska flottan Marshallöarna, Karolinerna, Palauöarna och Marianerna utan strid. Vid fredskonferensen i Paris 1919 fick Japan Tysklands rättigheter i Shandong, vilket utlöste Fjärde maj-rörelsen i Kina; Japan återlämnade området till Kina 1922 och styrde öarna som ett mandat under Nationernas förbund, Söderhavsmandatet, till 1945.
