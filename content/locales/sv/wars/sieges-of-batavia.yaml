Mataram’s sieges of Batavia: Matarams belägringar av Batavia
? Two attempts by Sultan Agung of Mataram, master of Central and East Java since the fall of Surabaya in 1625, to take Batavia, the fortified headquarters that the Dutch East India Company (VOC) had built on the ruins of Jayakarta in 1619. Agung meant to rule all of Java and saw Batavia as the stepping stone to Banten. In August 1628 a Mataram fleet landed troops beside the castle and an army followed overland, about 10,000 men in all; they tried to storm the outworks and to dam the Ciliwung river, but the garrison of a few hundred held out, and by December the besiegers had run out of food. Agung had the two commanders executed, and the army withdrew, leaving hundreds of beheaded bodies. For the second siege in 1629 Mataram stocked rice at depots along the coast, but Dutch ships found and burned the stores at Tegal and Cirebon, and the Sundanese regent Dipati Ukur turned against Mataram. A weakened army of perhaps 14,000 to 20,000 besieged Batavia from August to early October 1629, when hunger and disease drove it home; Governor-General Jan Pieterszoon Coen died of illness during the siege. Mataram never attacked Batavia again, the Company held its base on Java, and Agung turned his armies east, against Blambangan.
: Två försök av sultan Agung av Mataram, herre över Centraljava och östra Java sedan Surabayas fall 1625, att inta Batavia, det befästa högkvarter som Nederländska ostindiska kompaniet (VOC) hade byggt på Jayakartas ruiner 1619. Agung tänkte härska över hela Java och såg Batavia som språngbrädan till Banten. I augusti 1628 landsatte en flotta från Mataram trupper bredvid borgen och en armé följde landvägen, sammanlagt omkring 10 000 man; de försökte storma utanverken och dämma upp floden Ciliwung, men garnisonen på några hundra man höll stånd, och i december hade belägrarna slut på mat. Agung lät avrätta de två befälhavarna, och armén drog sig tillbaka och lämnade hundratals halshuggna kroppar efter sig. Inför den andra belägringen 1629 lade Mataram upp risförråd i depåer längs kusten, men nederländska fartyg hittade och brände förråden i Tegal och Cirebon, och den sundanesiske regenten Dipati Ukur vände sig mot Mataram. En försvagad armé på kanske 14 000 till 20 000 man belägrade Batavia från augusti till början av oktober 1629, då hunger och sjukdomar drev den hem; generalguvernör Jan Pieterszoon Coen dog av sjukdom under belägringen. Mataram anföll aldrig mer Batavia, kompaniet behöll sin bas på Java, och Agung vände sina arméer österut, mot Blambangan.
