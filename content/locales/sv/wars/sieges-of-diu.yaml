Sieges of Diu: Belägringarna av Diu
Two attempts by the Gujarat Sultanate to drive the Portuguese out of the fortress they had built at Diu, the island port at the tip of the Kathiawar peninsula. In 1538 a Gujarati army under Khadjar Safar besieged the fort and an Ottoman fleet of about 70 ships under Hadım Suleiman Pasha, sent from Suez, joined the attack; the small Portuguese garrison under António da Silveira held out until the Ottomans, at odds with their Gujarati allies, sailed away in November. In 1546 Khadjar Safar besieged Diu again for seven months, until the governor of Portuguese India, João de Castro, arrived with a relief fleet and routed the besiegers on 11 November. Diu stayed Portuguese until India annexed it in 1961.: Gujaratsultanatets två försök att driva ut portugiserna ur den fästning de hade byggt i Diu, öhamnen vid spetsen av Kathiawarhalvön. År 1538 belägrade en gujaratisk armé under Khadjar Safar fortet, och en osmansk flotta på omkring 70 fartyg under Hadım Suleiman pasha, som sänts från Suez, deltog i anfallet; den lilla portugisiska garnisonen under António da Silveira höll stånd tills osmanerna, oense med sina gujaratiska bundsförvanter, seglade bort i november. År 1546 belägrade Khadjar Safar Diu på nytt i sju månader, tills Portugisiska Indiens guvernör, João de Castro, anlände med en undsättningsflotta och slog belägrarna på flykten den 11 november. Diu förblev portugisiskt tills Indien annekterade det 1961.
