# Svenska översättningar av katalogtexten (våg 13); stegtexterna kommer senare.
Sierra Leone Civil War: Inbördeskriget i Sierra Leone
? The war that began when the Revolutionary United Front (RUF) of Foday Sankoh, backed by Charles Taylor’s NPFL, crossed from Liberia into eastern Sierra Leone on 23 March 1991. Sierra Leone had been run down by decades of one-party rule and corruption, and the RUF, which claimed to fight for the poor and the young, became notorious for abducting children as fighters, for mass rape and for cutting off the hands and limbs of civilians. The war was fought over the alluvial diamond fields as much as for power. Young officers of the National Provisional Ruling Council (NPRC) seized power in 1992; in 1995 the government hired the South African private military company Executive Outcomes, which, with local hunters’ militias, the Kamajors, drove the RUF back. After an election in 1996, soldiers of the Armed Forces Revolutionary Council (AFRC) overthrew President Ahmad Tejan Kabbah in May 1997 and shared power with the RUF until the Nigerian-led ECOMOG force drove them from Freetown in February 1998. In January 1999 the rebels stormed Freetown again, killing thousands. The Lomé agreement of July 1999 brought Sankoh into government and a United Nations force, UNAMSIL, into the country, but the RUF’s seizure of some 500 peacekeepers in May 2000 led to British intervention, Sankoh’s arrest and, with Guinean attacks on the RUF, its disarmament. Kabbah declared the war over on 18 January 2002. Some 50,000 to 70,000 people were killed and about 2.5 million, half the population, displaced.
: Det krig som började när Foday Sankohs Revolutionary United Front (RUF), med stöd av Charles Taylors NPFL, gick över gränsen från Liberia in i östra Sierra Leone den 23 mars 1991. Sierra Leone hade utarmats av årtionden av enpartistyre och korruption, och RUF, som påstod sig kämpa för de fattiga och de unga, blev ökänt för att röva bort barn och göra dem till soldater, för massvåldtäkter och för att hugga av civila händer och lemmar. Kriget utkämpades lika mycket om de alluviala diamantfälten som om makten. Unga officerare i National Provisional Ruling Council (NPRC) tog makten 1992; 1995 anlitade regeringen det sydafrikanska privata militärföretaget Executive Outcomes, som tillsammans med lokala jägarmiliser, kamajors, drev tillbaka RUF. Efter ett val 1996 störtade soldater ur Armed Forces Revolutionary Council (AFRC) president Ahmad Tejan Kabbah i maj 1997 och delade makten med RUF tills den nigeriaanförda Ecomogstyrkan drev ut dem ur Freetown i februari 1998. I januari 1999 stormade rebellerna Freetown igen och dödade tusentals. Lomé-avtalet i juli 1999 förde in Sankoh i regeringen och en FN-styrka, UNAMSIL, i landet, men när RUF i maj 2000 tog omkring 500 fredsbevarare till fånga ledde det till brittisk intervention, Sankohs arrestering och, tillsammans med guineanska anfall mot RUF, rörelsens avväpning. Kabbah förklarade kriget avslutat den 18 januari 2002. Omkring 50 000 till 70 000 människor dödades och omkring 2,5 miljoner, halva befolkningen, fördrevs.
