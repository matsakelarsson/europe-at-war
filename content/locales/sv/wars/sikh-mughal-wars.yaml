# Svenska översättningar av katalogtexten (våg 8); stegtexterna kommer senare.
Sikh–Mughal wars (1688–1716): Krigen mellan sikherna och mogulerna (1688–1716)
The wars of the tenth Sikh Guru, Gobind Singh, and of his follower Banda Singh Bahadur against the hill rajas of the Punjab Himalaya and the Mughal governors of Sirhind and Lahore. From his base at Anandpur the Guru fought the hill rajas at Bhangani in 1688 and founded the Khalsa, the order of initiated Sikhs, in 1699. In 1704 a Mughal and hill army besieged Anandpur; leaving under a promise of safe conduct, the Guru’s party was attacked, his two elder sons were killed at Chamkaur and his two younger sons put to death at Sirhind. After a last battle at Muktsar he made peace with Aurangzeb’s successor and was assassinated at Nanded in 1708. Banda Singh, sent to the Punjab, raised the peasantry, sacked Sirhind in 1710 and ruled the country between the Sutlej and the Yamuna from Lohgarh, until Mughal armies drove him into the hills and besieged him at Gurdas Nangal; he was captured in 1715 and executed in Delhi with hundreds of his followers in 1716.: De krig som sikhernas tionde guru, Gobind Singh, och hans anhängare Banda Singh Bahadur förde mot bergsfurstarna i Punjabs Himalaya och mogulguvernörerna i Sirhind och Lahore. Från sin bas i Anandpur stred gurun mot bergsfurstarna vid Bhangani 1688, och 1699 grundade han khalsa, de invigda sikhernas orden. År 1704 belägrade en armé av moguler och bergsfurstar Anandpur; när guruns följe lämnade staden mot löfte om fri lejd angreps det, hans två äldre söner dödades vid Chamkaur och hans två yngre söner avrättades i Sirhind. Efter ett sista slag vid Muktsar slöt han fred med Aurangzebs efterträdare, och han mördades i Nanded 1708. Banda Singh, som sänts till Punjab, fick bönderna att resa sig, plundrade Sirhind 1710 och härskade från Lohgarh över landet mellan Sutlej och Yamuna, tills mogularméer drev honom upp i bergen och belägrade honom i Gurdas Nangal; han tillfångatogs 1715 och avrättades i Delhi tillsammans med hundratals av sina anhängare 1716.
