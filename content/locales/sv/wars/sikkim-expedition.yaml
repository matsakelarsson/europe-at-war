Sikkim expedition: Sikkimexpeditionen
A British Indian campaign in 1888 to drive Tibetan troops out of Sikkim, also called the Anglo-Sikkimese war or the Anglo-Tibetan war of 1888. After the British gave up a planned mission to Lhasa in 1886, Tibetan soldiers built a fort at Lingtu inside Sikkim, on the trade road to Tibet, and the Chogyal of Sikkim, Thutob Namgyal, leaned towards Tibet. A force of about 2,000 under Brigadier-General Thomas Graham stormed Lingtu on 20–21 March 1888. A Tibetan attack on the British camp at Gnatong was beaten off on 22 May, and in late September Graham defeated the Tibetan army at the Tuko La, crossed the Jelep La and pursued it into the Chumbi valley. The British took over the government of Sikkim, and the Anglo-Chinese Convention of Calcutta of 17 March 1890 recognised Sikkim as a British protectorate and fixed its border with Tibet.: Ett brittisk-indiskt fälttåg 1888 för att driva ut tibetanska trupper ur Sikkim, även kallat det anglo-sikkimesiska kriget eller det anglo-tibetanska kriget 1888. Sedan britterna 1886 hade gett upp en planerad beskickning till Lhasa byggde tibetanska soldater ett fort vid Lingtu inne i Sikkim, på handelsvägen till Tibet, och Sikkims chogyal, Thutob Namgyal, lutade åt Tibet. En styrka på omkring 2 000 man under brigadgeneral Thomas Graham stormade Lingtu den 20–21 mars 1888. Ett tibetanskt anfall mot det brittiska lägret vid Gnatong slogs tillbaka den 22 maj, och i slutet av september besegrade Graham den tibetanska armén vid Tuko La, gick över Jelep La och förföljde den in i Chumbidalen. Britterna tog över styret av Sikkim, och den anglo-kinesiska konventionen i Calcutta den 17 mars 1890 erkände Sikkim som brittiskt protektorat och fastställde dess gräns mot Tibet.
