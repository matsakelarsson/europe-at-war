Silesian Uprisings: Schlesiska upproren
Three risings by Polish insurgents in German Upper Silesia, in August 1919, August 1920 and May–July 1921, against German police, army and Freikorps units. After a plebiscite on 20 March 1921 gave about 60 per cent of the vote to Germany, the third and largest rising seized much of the region; the Allies then divided it in October 1921, giving Poland the smaller share of the land but most of the coal mines and heavy industry.: Tre resningar av polska upprorsmän i det tyska Oberschlesien, i augusti 1919, augusti 1920 och maj–juli 1921, mot tysk polis, armé och frikårsförband. Sedan en folkomröstning den 20 mars 1921 hade gett Tyskland omkring 60 procent av rösterna, intog det tredje och största upproret stora delar av regionen; de allierade delade sedan området i oktober 1921 och gav Polen den mindre delen av ytan men flertalet kolgruvor och den tunga industrin.
