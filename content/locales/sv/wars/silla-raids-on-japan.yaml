# Svenska översättningar av katalogtexten (våg 10); stegtexterna kommer senare.
Silla raids on Japan: Räder från Silla mot Japan
? Raids by seafarers from Silla on Tsushima, the Gotō Islands and the coasts of northern Kyushu in the ninth century, at a time when official relations between the two states had broken down and Silla was sinking into famine and rebellion. Japanese records report three Silla ships off Tsushima in the twelfth month of 811, and in 813 a landing by 110 men on Ojika in the Gotō Islands, where nine islanders were killed and about a hundred taken prisoner. In the sixth month of 869 raiders in two ships entered Hakata Bay and carried off the silk and floss of a tax ship from Buzen; the court sent offerings to the shrines of Ise and others and strengthened Tsushima with frontier guards, crossbowmen and Emishi soldiers. In 893 raiders burned houses in Higo and appeared off Matsuura in Hizen. The largest attack came in the ninth month of 894, when 45 ships reached Tsushima. The governor, Fun’ya no Yoshitomo, met them with crossbows and local levies and reported about 300 raiders killed and eleven boats taken; a captive said that famine had emptied Silla’s granaries and that its king had sent a hundred ships and 2,500 men to seize grain and silk. Iki was raided again in 895. The raids deepened the Japanese court’s mistrust of its neighbours, which carried over to Goryeo after Silla’s fall in 935.
: Räder som sjöfarare från Silla gjorde mot Tsushima, Gotōöarna och kusterna på norra Kyushu under 800-talet, vid en tid då de officiella förbindelserna mellan de två staterna hade brutits och Silla sjönk ned i hungersnöd och uppror. Japanska källor omtalar tre fartyg från Silla utanför Tsushima i tolfte månaden 811 och 813 en landstigning av 110 man på Ojika i Gotōöarna, där nio öbor dödades och omkring hundra togs till fånga. I sjätte månaden 869 tog sig plundrare i två fartyg in i Hakatabukten och förde bort silket och silkesvadden från ett skattefartyg från Buzen; hovet sände offergåvor till helgedomarna i Ise och på andra håll och förstärkte Tsushima med gränsvakter, armborstskyttar och emishisoldater. År 893 brände plundrare hus i Higo och visade sig utanför Matsuura i Hizen. Det största angreppet kom i nionde månaden 894, då 45 fartyg nådde Tsushima. Guvernören Fun’ya no Yoshitomo mötte dem med armborst och lokalt uppbådade styrkor och rapporterade omkring 300 dödade plundrare och elva erövrade båtar; en fånge berättade att hungersnöd hade tömt Sillas spannmålsmagasin och att dess kung hade sänt hundra fartyg och 2 500 man för att lägga beslag på spannmål och silke. Iki plundrades på nytt 895. Räderna fördjupade det japanska hovets misstro mot grannarna, en misstro som levde vidare gentemot Goryeo efter Sillas fall 935.
