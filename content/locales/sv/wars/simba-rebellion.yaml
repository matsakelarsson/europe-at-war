# Svenska översättningar av katalogtexten (våg 13); stegtexterna kommer senare.
Simba rebellion: Simbaupproret
Risings in 1963–1965 by followers of the murdered prime minister Patrice Lumumba against the government of the Congo (Léopoldville). Pierre Mulele led a peasant rising in Kwilu from January 1964, and in the east the National Liberation Council (CNL) of Christophe Gbenye and Gaston Soumialot raised an army of young fighters, the Simbas (“lions” in Swahili), who in 1964 took about half the country and proclaimed a People’s Republic of the Congo at Stanleyville. Prime Minister Moïse Tshombe’s army, white mercenaries and Katangese gendarmes, with American aircraft and Belgian officers, drove them back; on 24 November 1964 Belgian paratroopers landed at Stanleyville to free hundreds of foreign hostages (Operation Dragon Rouge). A Cuban column under Che Guevara fought with the rebels near Lake Tanganyika in 1965 and left in November, when the last major rebel stronghold fell. The rebels killed thousands of Congolese they saw as enemies and some 200–400 foreigners; the repression killed tens of thousands more.: Resningar 1963–1965 bland anhängare till den mördade premiärministern Patrice Lumumba mot regeringen i Kongo (Léopoldville). Pierre Mulele ledde ett bondeuppror i Kwilu från januari 1964, och i öster satte Christophe Gbenyes och Gaston Soumialots Nationella befrielserådet (CNL) upp en armé av unga kämpar, simbas (”lejon” på swahili), som 1964 tog omkring halva landet och utropade en folkrepublik Kongo i Stanleyville. Premiärminister Moïse Tshombes armé, vita legosoldater och katangesiska gendarmer, med amerikanska flygplan och belgiska officerare, drev tillbaka dem; den 24 november 1964 landade belgiska fallskärmsjägare i Stanleyville för att befria hundratals utlänningar som hölls som gisslan (Operation Dragon Rouge). En kubansk kolonn under Che Guevara stred tillsammans med rebellerna nära Tanganyikasjön 1965 och lämnade landet i november, när det sista större rebellfästet föll. Rebellerna dödade tusentals kongoleser som de såg som fiender och omkring 200–400 utlänningar; repressionen dödade ytterligare tiotusentals.
