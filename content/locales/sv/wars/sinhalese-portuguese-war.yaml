# Svenska översättningar av katalogtexten (våg 8); stegtexterna kommer senare.
Sinhalese–Portuguese War: Singalesisk-portugisiska kriget
More than a century of wars between the Portuguese and the Sinhalese kingdoms of Sri Lanka. The Portuguese, who had a fort at Colombo from 1518, came in as protectors of the kingdom of Kotte against Mayadunne of Sitawaka, one of the three kingdoms into which Kotte split in 1521. Sitawaka besieged Kotte, defeated the Portuguese at Mulleriyawa in 1559 and forced them to abandon Kotte in 1565; under Rajasinghe I it conquered Kandy and in 1587–88 besieged Colombo for eight months. After Rajasinghe’s death in 1593 Sitawaka collapsed, and in 1597 the Portuguese crown inherited Kotte and ruled the lowlands. The hill kingdom of Kandy resisted every Portuguese invasion, destroying their armies at Danture in 1594, Randeniwela in 1630 and Gannoruwa in 1638. In 1638 Kandy allied with the Dutch, who by 1658 had taken every Portuguese fort on the island.: Mer än ett sekel av krig mellan portugiserna och Sri Lankas singalesiska kungariken. Portugiserna, som hade ett fort i Colombo från 1518, kom in som beskyddare av kungariket Kotte mot Mayadunne av Sitawaka, ett av de tre kungariken som Kotte splittrades i 1521. Sitawaka belägrade Kotte, besegrade portugiserna vid Mulleriyawa 1559 och tvingade dem att överge Kotte 1565; under Rajasinghe I erövrade det Kandy och belägrade 1587–88 Colombo i åtta månader. Efter Rajasinghes död 1593 föll Sitawaka samman, och 1597 ärvde den portugisiska kronan Kotte och styrde låglandet. Bergskungariket Kandy stod emot varje portugisisk invasion och förintade portugisernas arméer vid Danture 1594, Randeniwela 1630 och Gannoruwa 1638. År 1638 allierade sig Kandy med holländarna, som 1658 hade intagit alla portugisiska fort på ön.
