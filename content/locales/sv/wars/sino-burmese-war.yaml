# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
Sino-Burmese War: Kinesisk-burmesiska kriget
? Four invasions of Konbaung Burma by Qing China, fought over the Shan and Tai states of the border hills that both empires claimed. After Burma’s new Konbaung kings reasserted their rule over states the Qing had drawn into their orbit in the 1730s, the governor of Yunnan sent Green Standard troops against Kengtung in December 1765; they were beaten back. A second, larger invasion by Bhamo in 1766–1767 was trapped between the Burmese fort at Kaungton and armies closing in from the hills, and destroyed by battle and disease. The Qianlong Emperor then sent Manchu Bannermen under his son-in-law Ming Rui, who broke through the Shan hills at the Goteik gorge late in 1767 and came within 30 miles of Ava; cut off from his supplies, he was surrounded and destroyed at Maymyo in March 1768 and hanged himself. In 1769 Fuheng led about 60,000 men down the Irrawaddy, but his flotilla was sunk and his army, sick and surrounded near Kaungton, accepted a truce on 13 (or 22) December 1769. Neither court ratified the terms, and Qing trade was banned for twenty years; but Burma had kept its independence and its border states, at the price of losing its conquests in Siam, which used the respite to recover.
: Fyra invasioner av Konbaungdynastins Burma från Qingdynastins Kina, utkämpade om shan- och taistaterna i gränsbergen, som båda rikena gjorde anspråk på. Sedan Burmas nya Konbaungkungar hade återupprättat sitt styre över stater som Qing hade dragit in i sin intressesfär på 1730-talet, sände guvernören i Yunnan trupper ur Gröna standarets armé mot Kengtung i december 1765; de slogs tillbaka. En andra, större invasion via Bhamo 1766–1767 fångades mellan det burmesiska fortet vid Kaungton och arméer som närmade sig från bergen och förintades i strid och av sjukdomar. Qianlongkejsaren sände då manchuiska fänikesoldater under sin svärson Ming Rui, som bröt igenom shanbergen vid Goteikravinen i slutet av 1767 och kom inom 30 engelska mil från Ava; avskuren från sina förråd omringades han och förintades vid Maymyo i mars 1768, och han hängde sig. År 1769 ledde Fuheng omkring 60 000 man nedför Irrawaddy, men hans flottilj sänktes och hans armé, sjuk och omringad nära Kaungton, godtog ett stillestånd den 13 (eller 22) december 1769. Inget av hoven ratificerade villkoren, och handeln med Kina förbjöds i tjugo år; men Burma hade behållit sin självständighet och sina gränsstater, till priset av att förlora sina erövringar i Siam, som utnyttjade andrummet till att återhämta sig.
