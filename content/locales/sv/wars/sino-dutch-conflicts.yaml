# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
Sino-Dutch conflicts: Kinesisk-nederländska konflikterna
? Fighting between the Dutch East India Company (VOC) and Ming China over the Company’s demand for trade on the coast of Fujian. After the Portuguese beat off a Dutch attack on Macau in June 1622, a VOC fleet under Cornelis Reijersen occupied the Penghu (Pescadores) islands, built a fort with forced Chinese labour and raided the Fujian coast to force the Ming to open trade. In 1624 Ming troops under Yu Zigao landed on Penghu and besieged the fort; in August the Dutch agreed to pull down the fort and withdraw to Tayouan on Taiwan, outside Ming rule, where they built what became Fort Zeelandia and the colony of Dutch Formosa. Trade with Taiwan grew through Chinese merchants, but in 1633 the governor Hans Putmans, allied with the pirate Liu Xiang, burned the new fleet of the Ming admiral Zheng Zhilong at Xiamen (Amoy) to force direct trade. On 22 October 1633 Zheng defeated the Dutch and Liu Xiang’s junks with fire ships in Liaoluo Bay off Kinmen. The Company afterwards traded through Zheng Zhilong’s merchants at Tayouan.
: Strider mellan Nederländska ostindiska kompaniet (VOC) och Mingriket om kompaniets krav på handel vid Fujians kust. Sedan portugiserna i juni 1622 hade slagit tillbaka ett nederländskt anfall mot Macao ockuperade en VOC-flotta under Cornelis Reijersen Penghuöarna (Pescadorerna), byggde ett fort med kinesiskt tvångsarbete och gjorde räder mot Fujians kust för att tvinga Ming att öppna handeln. År 1624 landsteg Mingtrupper under Yu Zigao på Penghu och belägrade fortet; i augusti gick nederländarna med på att riva fortet och dra sig tillbaka till Tayouan på Taiwan, utanför Mings välde, där de byggde det som blev Fort Zeelandia och kolonin Nederländska Formosa. Handeln med Taiwan växte genom kinesiska köpmän, men 1633 brände guvernören Hans Putmans, allierad med piraten Liu Xiang, Mingamiralen Zheng Zhilongs nya flotta vid Xiamen (Amoy) för att framtvinga direkthandel. Den 22 oktober 1633 besegrade Zheng nederländarna och Liu Xiangs djonker med brännare i Liaoluobukten utanför Kinmen. Kompaniet handlade därefter genom Zheng Zhilongs köpmän i Tayouan.
