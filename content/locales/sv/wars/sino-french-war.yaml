# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
Sino-French War: Fransk-kinesiska kriget
? "The war between France and Qing China over Tonkin, northern Vietnam, which China regarded as a tributary state and France had just made a protectorate. China’s Guangxi and Yunnan armies and Liu Yongfu’s Black Flag Army were already fighting the French in Tonkin, and the Tientsin Accord of May 1884, by which China was to withdraw them, broke down when a French column was stopped at Bắc Lệ in June. In August Admiral Courbet destroyed the Fujian fleet at Fuzhou in less than an hour. The French then occupied Keelung on Taiwan but were beaten back at Tamsui, and the war in Taiwan became a long, sickly stalemate. In Tonkin the French defeated the Guangxi army at Kép, took Lạng Sơn in February 1885 and relieved the besieged garrison of Tuyên Quang, but in March they were beaten at Bang Bo below the Zhennan Pass and abandoned Lạng Sơn, which brought down Jules Ferry’s government. After the French took the Pescadores, the two sides made peace: by the Treaty of Tianjin (9 June 1885) China accepted the French protectorate over Vietnam, and France gave back Keelung and the Pescadores without an indemnity."
: "Kriget mellan Frankrike och Qingriket om Tonkin, norra Vietnam, som Kina betraktade som en tributstat och som Frankrike nyss hade gjort till protektorat. Kinas arméer från Guangxi och Yunnan och Svarta flaggornas armé under Liu Yongfu stred redan mot fransmännen i Tonkin, och överenskommelsen i Tientsin i maj 1884, enligt vilken Kina skulle dra tillbaka dem, bröt samman när en fransk kolonn stoppades vid Bắc Lệ i juni. I augusti förintade amiral Courbet Fujianflottan vid Fuzhou på mindre än en timme. Fransmännen ockuperade därefter Keelung på Taiwan men slogs tillbaka vid Tamsui, och kriget på Taiwan blev ett utdraget dödläge, präglat av sjukdomar. I Tonkin besegrade fransmännen Guangxiarmén vid Kép, intog Lạng Sơn i februari 1885 och undsatte den belägrade garnisonen i Tuyên Quang, men i mars besegrades de vid Bang Bo nedanför Zhennanpasset och övergav Lạng Sơn, vilket fällde Jules Ferrys regering. Sedan fransmännen hade intagit Pescadorerna slöt de båda sidorna fred: genom fördraget i Tianjin (9 juni 1885) godtog Kina det franska protektoratet över Vietnam, och Frankrike lämnade tillbaka Keelung och Pescadorerna utan skadestånd."
