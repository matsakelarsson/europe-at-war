Sino-Indian War: Kinesisk-indiska kriget
"A month-long border war between China and India in the Himalayas in October and November 1962, fought at two fronts 1,000 km apart: Aksai Chin in Ladakh, held by China and claimed by India, and the North-East Frontier Agency (today Arunachal Pradesh), held by India up to the McMahon Line and claimed by China. After years of disputes, the flight of the Dalai Lama to India in 1959 and India’s “forward policy” of posts in disputed land, China attacked on both fronts on 20 October. Its troops overran Indian positions on the Namka Chu and at Tawang, and in a second offensive in November took Se La, Bomdila and Walong and reached the edge of the Assam plain, while in Ladakh they took the Indian posts up to China’s claim line. China then declared a ceasefire on 21 November and withdrew in the east, keeping Aksai Chin. The defeat shook India’s government and led to a large expansion of its army.": "Ett månadslångt gränskrig mellan Kina och Indien i Himalaya i oktober och november 1962, utkämpat på två fronter 1 000 km från varandra: Aksai Chin i Ladakh, som Kina höll och Indien gjorde anspråk på, och North-East Frontier Agency (dagens Arunachal Pradesh), som Indien höll upp till McMahonlinjen och Kina gjorde anspråk på. Efter år av tvister, Dalai lamas flykt till Indien 1959 och Indiens ”framåtpolitik” med poster i omstritt område anföll Kina på båda fronterna den 20 oktober. Kinesiska trupper överrände indiska ställningar vid Namka Chu och i Tawang och intog i en andra offensiv i november Se La, Bomdila och Walong och nådde kanten av Assamslätten, medan de i Ladakh intog de indiska posterna fram till Kinas anspråkslinje. Kina utlyste därefter vapenvila den 21 november och drog sig tillbaka i öster men behöll Aksai Chin. Nederlaget skakade Indiens regering och ledde till en kraftig utbyggnad av armén."
