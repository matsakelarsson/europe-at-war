Sino-Nepalese War: Kinesisk-nepalesiska kriget
"Two Nepalese invasions of Tibet and a Qing counter-invasion of Nepal. Disputes over the silver coins Nepal minted for Tibet, over trade and salt, and over the refuge Nepal gave to the Tenth Shamarpa led the Gorkha kingdom to send armies over the Himalayan passes in 1788. Tibet bought peace in 1789 with a promise of yearly payments, and when it stopped paying the Nepalese invaded again in 1791 and plundered Tashilhunpo, the monastery of the Panchen Lamas at Shigatse. The Qianlong emperor sent an army under Fuk’anggan, which drove the Nepalese out of Tibet in 1792 and advanced down the Trishuli valley to within about 35 km of Kathmandu. After heavy fighting near Betrawati both sides made peace in October 1792: Nepal returned plunder from Tashilhunpo and sent tribute missions to Beijing every five years until 1908, and the Qing tightened their hold on Tibet.": "Två nepalesiska invasioner av Tibet och ett motangrepp in i Nepal från Qingrikets sida. Tvister om de silvermynt som Nepal präglade åt Tibet, om handel och salt och om den tillflykt som Nepal gav den tionde shamarpan fick kungariket Gorkha att sända arméer över Himalayas pass 1788. Tibet köpte fred 1789 mot löfte om årliga betalningar, och när betalningarna upphörde invaderade nepaleserna på nytt 1791 och plundrade Tashilhunpo, panchen lamornas kloster i Shigatse. Qianlongkejsaren sände en armé under Fuk’anggan, som drev ut nepaleserna ur Tibet 1792 och ryckte fram nedför Trishulidalen till omkring 35 km från Katmandu. Efter hårda strider nära Betrawati slöt båda sidor fred i oktober 1792: Nepal lämnade tillbaka byte från Tashilhunpo och sände tributbeskickningar till Peking vart femte år fram till 1908, och Qingdynastin skärpte sitt grepp om Tibet."
