# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
Sino-Russian border conflicts: Kinesisk-ryska gränskonflikterna
? Intermittent fighting between Russian Cossack bands and the Qing empire over the Amur valley, ending with the Treaty of Nerchinsk. From 1650 Yerofey Khabarov and his successor Onufriy Stepanov raided the Daur and Ducher peoples along the Amur for fur tribute and grain. The Qing, who counted these peoples as their tributaries, attacked Khabarov’s winter fort at Achansk in 1652, fought Stepanov on the Sungari in 1654 with the help of Korean musketeers, besieged him at Kumarsk in 1655 and destroyed his flotilla in 1658. The Russians returned in 1665, when a band of fugitives settled at Albazin, which became the centre of Russian farming and tribute-taking on the upper Amur. After crushing the Revolt of the Three Feudatories, the Kangxi emperor built forts at Aigun and besieged Albazin twice, taking it in 1685 and starving its rebuilt fort in 1686. The Treaty of Nerchinsk (6 September 1689), the first between China and a European state, set the border on the Argun river and the Stanovoy watershed; Russia gave up the Amur and gained the right to trade.
: Sporadiska strider mellan ryska kosackskaror och Qingriket om Amurdalen, som slutade med fördraget i Nertjinsk. Från 1650 plundrade Jerofej Chabarov och hans efterträdare Onufrij Stepanov folken daur och ducher längs Amur för att driva in pälstribut och spannmål. Qing, som räknade dessa folk som sina skattskyldiga, anföll Chabarovs vinterfort vid Atjansk 1652, stred mot Stepanov vid Sungari 1654 med hjälp av koreanska musketörer, belägrade honom vid Kumarsk 1655 och förintade hans flottilj 1658. Ryssarna återvände 1665, då en skara flyktingar slog sig ned i Albazin, som blev centrum för ryskt jordbruk och tributuppbörd vid övre Amur. Sedan Kangxikejsaren hade krossat de tre feodalherrarnas uppror byggde han fästen vid Aigun och belägrade Albazin två gånger; han intog det 1685 och svalt ut dess återuppbyggda fort 1686. Fördraget i Nertjinsk (6 september 1689), det första mellan Kina och en europeisk stat, drog gränsen vid floden Argun och vattendelaren i Stanovojbergen; Ryssland avstod från Amur och fick rätt att idka handel.
