Dogra–Tibetan War: Dogra-tibetanska kriget
A war between the Dogra state of Jammu, a vassal of the Sikh Empire, and Tibet, then under the protection of Qing China; it is also called the Sino-Sikh War. Having conquered Ladakh and Baltistan, Gulab Singh’s general Zorawar Singh invaded western Tibet in May 1841 with about 4,000–6,000 men, took Rudok, Gartok and Taklakot, and reached the sacred lake of Manasarovar. In the winter a Tibetan army cut him off, and in December 1841 he was killed and his army destroyed near Taklakot. The Tibetans advanced into Ladakh and besieged Leh, but were driven back by Dogra reinforcements and beaten at Chushul in August 1842. The Treaty of Chushul, agreed in September 1842, restored the old frontier and trade between Ladakh and Tibet.: Ett krig mellan dograstaten Jammu, en vasall under Sikhriket, och Tibet, som då stod under Qingrikets beskydd; det kallas också det kinesisk-sikhiska kriget. Sedan Gulab Singhs general Zorawar Singh hade erövrat Ladakh och Baltistan invaderade han västra Tibet i maj 1841 med omkring 4 000–6 000 man, intog Rudok, Gartok och Taklakot och nådde den heliga sjön Manasarovar. Under vintern skar en tibetansk armé av honom, och i december 1841 dödades han och hans armé förintades nära Taklakot. Tibetanerna ryckte in i Ladakh och belägrade Leh men drevs tillbaka av dograförstärkningar och besegrades vid Chushul i augusti 1842. Fördraget i Chushul, som slöts i september 1842, återställde den gamla gränsen och handeln mellan Ladakh och Tibet.
