# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
Sino-Soviet border conflict: Kinesisk-sovjetiska gränskonflikten
An undeclared conflict between the Soviet Union and the People’s Republic of China along their long border in 1969, the high point of the Sino-Soviet split. On 2 March Chinese troops ambushed a Soviet border patrol on Zhenbao Island (Damansky to the Russians), a small island in the Ussuri River claimed by both, and on 15 March the two sides fought a battle there with tanks and heavy artillery. Clashes followed on the Amur and in Xinjiang, where on 13 August Soviet troops destroyed a Chinese patrol near Lake Zhalanashkol (Tielieketi). Talk of a Soviet strike on China’s nuclear sites brought fears of a wider war, until the Soviet premier Alexei Kosygin met Zhou Enlai at Beijing airport on 11 September and the two governments agreed to negotiate. The conflict pushed China towards its opening to the United States. The border was finally settled by agreements of 1991 and 2004, which gave Zhenbao Island to China.: En oförklarad konflikt mellan Sovjetunionen och Folkrepubliken Kina längs deras långa gräns 1969, höjdpunkten i den kinesisk-sovjetiska brytningen. Den 2 mars överföll kinesiska trupper en sovjetisk gränspatrull från bakhåll på Zhenbaoön (Damanskij för ryssarna), en liten ö i Ussurifloden som båda gjorde anspråk på, och den 15 mars utkämpade de två sidorna en strid där med stridsvagnar och tungt artilleri. Sammandrabbningar följde vid Amur och i Xinjiang, där sovjetiska trupper den 13 augusti förintade en kinesisk patrull nära sjön Zhalanasjkol (Tielieketi). Tal om ett sovjetiskt angrepp mot Kinas kärnvapenanläggningar väckte farhågor för ett större krig, tills den sovjetiske premiärministern Aleksej Kosygin träffade Zhou Enlai på flygplatsen i Peking den 11 september och de två regeringarna kom överens om att förhandla. Konflikten drev Kina mot närmandet till USA. Gränsen fastställdes slutligen genom avtal 1991 och 2004, som gav Zhenbaoön till Kina.
