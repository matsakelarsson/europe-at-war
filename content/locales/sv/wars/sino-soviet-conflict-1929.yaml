# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
Sino-Soviet conflict of 1929: Kinesisk-sovjetiska konflikten 1929
An undeclared war in northern Manchuria over the Chinese Eastern Railway, the Russian-built line across Manchuria that the Soviet Union and China had run jointly since 1924. In May–July 1929 the Manchurian ruler Zhang Xueliang, who had just joined Chiang Kai-shek’s Nationalist government, raided the Soviet consulate in Harbin, seized the railway and expelled its Soviet managers. The Soviet Union broke off relations and formed a Special Far Eastern Army under Vasily Blyukher, which in October and November destroyed the Chinese river flotilla on the Sungari, took Lahasusu and Fujin, and routed Zhang’s troops at Zhalainuoer and Manzhouli, taking some 8,000 prisoners. By the Khabarovsk Protocol of 22 December China accepted joint management again. The war showed the weakness of the Chinese army in Manchuria, which Japan attacked two years later.: Ett oförklarat krig i norra Manchuriet om Östkinesiska järnvägen, den ryskbyggda linjen tvärs genom Manchuriet som Sovjetunionen och Kina hade drivit gemensamt sedan 1924. I maj–juli 1929 lät Manchuriets härskare Zhang Xueliang, som just hade anslutit sig till Chiang Kai-sheks nationalistregering, göra en razzia mot det sovjetiska konsulatet i Harbin, tog järnvägen i beslag och utvisade dess sovjetiska ledning. Sovjetunionen bröt de diplomatiska förbindelserna och bildade Särskilda Fjärran Östern-armén under Vasilij Bljucher, som i oktober och november förintade den kinesiska flodflottiljen på Sungari, intog Lahasusu och Fujin och slog Zhangs trupper på flykten vid Zhalainuoer och Manzhouli och tog omkring 8 000 fångar. Genom Chabarovskprotokollet den 22 december godtog Kina åter gemensam förvaltning. Kriget blottade svagheten hos den kinesiska armén i Manchuriet, som Japan angrep två år senare.
