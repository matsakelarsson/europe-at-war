# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
Sino-Tibetan War: Kinesisk-tibetanska kriget
Two wars between the Dalai Lama’s government and Chinese forces in Kham, the eastern Tibetan borderland, after Tibet expelled the Qing garrison in 1912–1913. In 1918 the Tibetan army under the Kalon Lama Jampa Tendar defeated the Sichuan frontier troops of the Republic of China and took Chamdo, whose garrison surrendered on 29 April; truces mediated by the British consul Eric Teichman at Chamdo and Rongbatsa left Chamdo, Riwoche, Drayab, Markham, Gonjo and Derge with Tibet. In 1930 a dispute between the chief of Beri and the monastery of Dargye brought Tibetan troops east of the upper Yangtze, where they took Kandze and Nyarong, and in 1932 they attacked Qinghai and besieged Jyekundo. Counter-offensives by the Sichuan warlord Liu Wenhui and the Qinghai army of Ma Bufang drove them back across the Yangtze, and truces in 1932–1933 made the river the line between Chinese- and Tibetan-held Kham until 1950.: Två krig mellan Dalai lamas regering och kinesiska styrkor i Kham, det östtibetanska gränslandet, sedan Tibet hade fördrivit Qinggarnisonen 1912–1913. År 1918 besegrade den tibetanska armén under Kalon Lama Jampa Tendar Republiken Kinas sichuanesiska gränstrupper och intog Chamdo, vars garnison kapitulerade den 29 april; vapenstillestånd som den brittiske konsuln Eric Teichman medlade i Chamdo och Rongbatsa lämnade Chamdo, Riwoche, Drayab, Markham, Gonjo och Derge åt Tibet. År 1930 förde en tvist mellan hövdingen i Beri och klostret Dargye tibetanska trupper öster om övre Yangtze, där de intog Kandze och Nyarong, och 1932 angrep de Qinghai och belägrade Jyekundo. Motoffensiver av krigsherren Liu Wenhui i Sichuan och Ma Bufangs Qinghaiarmé drev dem tillbaka över Yangtze, och vapenstilleståndsavtal 1932–1933 gjorde floden till gräns mellan det kinesiskhållna och det tibetanskhållna Kham fram till 1950.
