Sino-Vietnamese War: Kinesisk-vietnamesiska kriget
China’s invasion of northern Vietnam in February–March 1979 and the border war that followed until 1991. Relations between the former allies had broken down over Vietnam’s alliance with the Soviet Union, its treatment of its ethnic Chinese, who fled in their hundreds of thousands in 1978, disputed borders and islands, and above all its invasion of Cambodia, China’s ally. On 17 February 1979 some 200,000 Chinese troops attacked along the whole border to “teach Vietnam a lesson”, in Deng Xiaoping’s words. They took the provincial capitals of Lào Cai, Cao Bằng and Lạng Sơn against fierce resistance from Vietnamese border troops and militia, then announced their withdrawal on 5 March and left by 16 March, destroying what they could. Both sides claimed victory. Vietnam did not leave Cambodia, and for ten more years the two armies shelled each other and fought for hilltops along the border, most heavily at Vị Xuyên (Laoshan) in 1984–1989. Relations were normalised in November 1991.: Kinas invasion av norra Vietnam i februari–mars 1979 och det gränskrig som följde fram till 1991. Förbindelserna mellan de tidigare bundsförvanterna hade brutit samman på grund av Vietnams allians med Sovjetunionen, dess behandling av sina etniska kineser, som flydde i hundratusental 1978, omstridda gränser och öar och framför allt dess invasion av Kambodja, Kinas allierade. Den 17 februari 1979 anföll omkring 200 000 kinesiska soldater längs hela gränsen för att, med Deng Xiaopings ord, ”ge Vietnam en läxa”. De intog provinshuvudstäderna Lào Cai, Cao Bằng och Lạng Sơn mot hårt motstånd från vietnamesiska gränstrupper och milis, tillkännagav sedan sitt tillbakadragande den 5 mars och hade lämnat landet den 16 mars, efter att ha förstört vad de kunde. Båda sidor gjorde anspråk på segern. Vietnam lämnade inte Kambodja, och i ytterligare tio år besköt de två arméerna varandra och stred om bergstoppar längs gränsen, hårdast vid Vị Xuyên (Laoshan) 1984–1989. Förbindelserna normaliserades i november 1991.
