# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
Six-Day War (1899): Sexdagarskriget (1899)
? A brief war in April 1899 between British forces and the clans of the New Territories of Hong Kong, which China had leased to Britain for 99 years by the Convention of Peking of June 1898. Fearing the loss of their land rights, the powerful lineages of the Punti villages, led by the Tang clan, raised a militia of some 2,600 men. On 14 April 1899 they burned the matsheds put up for the flag-raising ceremony at Tai Po; British and Indian troops sent there were besieged on Flagstaff Hill until the destroyer HMS Fame shelled the militia. The British then drove the militia from Lam Tsuen and Sheung Tsuen on 17 and 18 April, and the villages surrendered on 19 April. About 500 militiamen were killed; the British suffered only a few wounded. The gates of the Tang walled village of Kat Hing Wai were removed and taken to the governor’s house in Ireland. In May British troops also expelled the Chinese officials from the Kowloon Walled City. Governor Henry Blake afterwards chose conciliation, and the villagers’ customary land and inheritance rights were respected under British rule.
: Ett kort krig i april 1899 mellan brittiska styrkor och klanerna i Nya territorierna i Hongkong, som Kina hade arrenderat ut till Storbritannien på 99 år genom Pekingkonventionen i juni 1898. Av rädsla för att förlora sina rättigheter till jorden satte de mäktiga släktlinjerna i puntibyarna, under ledning av Tangklanen, upp en milis på omkring 2 600 man. Den 14 april 1899 brände de ned de skjul av mattor som hade uppförts för flagghissningsceremonin i Tai Po; brittiska och indiska trupper som sändes dit belägrades på Flagstaff Hill tills jagaren HMS Fame besköt milisen. Britterna drev sedan milisen från Lam Tsuen och Sheung Tsuen den 17 och 18 april, och byarna kapitulerade den 19 april. Omkring 500 milismän dödades; britterna fick bara ett fåtal sårade. Portarna till Tangklanens muromgärdade by Kat Hing Wai togs bort och fördes till guvernörens hus på Irland. I maj fördrev brittiska trupper också de kinesiska ämbetsmännen från Kowloon Walled City. Guvernör Henry Blake valde därefter försoning, och bybornas sedvanliga rätt till jord och arv respekterades under brittiskt styre.
