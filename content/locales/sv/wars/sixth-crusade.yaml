The treaty was unpopular on both sides. Many Muslims condemned al-Kamil for giving up Jerusalem, and the patriarch of Jerusalem and the military orders rejected an agreement made by an excommunicated emperor. Jerusalem, left unwalled, was lost again in 1244.: Fördraget var impopulärt på båda sidor. Många muslimer fördömde al-Kamil för att han gav upp Jerusalem, och patriarken av Jerusalem och de andliga riddarordnarna förkastade en överenskommelse som slutits av en bannlyst kejsare. Jerusalem, som lämnades utan murar, gick förlorat igen 1244.
Frederick’s wars with the papacy and the Lombard cities are told under Frederick II and the Lombard League.: Fredriks krig mot påvedömet och de lombardiska städerna berättas under Fredrik II:s krig mot Lombardiska förbundet.
