Sixth Crusade: Sjätte korståget
The crusade of the emperor Frederick II, who had married the heiress of the Kingdom of Jerusalem and sailed east in 1228 while excommunicated by Pope Gregory IX. Without fighting a battle, he negotiated the Treaty of Jaffa with the Ayyubid sultan al-Kamil on 18 February 1229, which returned Jerusalem, Bethlehem, Nazareth and a corridor to the coast to the kingdom for ten years, while the Muslims kept the Temple Mount. Frederick crowned himself in the Church of the Holy Sepulchre on 18 March 1229 and hurried home in May, as papal troops had invaded his Kingdom of Sicily.: Kejsar Fredrik II:s korståg; han hade gift sig med arvtagerskan till kungariket Jerusalem och seglade österut 1228 trots att han var bannlyst av påven Gregorius IX. Utan att utkämpa något slag förhandlade han fram fördraget i Jaffa med den ayyubidiske sultanen al-Kamil den 18 februari 1229, som för tio år återgav kungariket Jerusalem, Betlehem, Nasaret och en korridor till kusten, medan muslimerna behöll Tempelberget. Fredrik krönte sig själv i Heliga gravens kyrka den 18 mars 1229 och skyndade hem i maj, eftersom påvliga trupper hade invaderat hans kungarike Sicilien.
