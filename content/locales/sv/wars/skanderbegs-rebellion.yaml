Skanderbeg: Skanderbeg
In January 1468 Skanderbeg called the remaining Albanian lords to Lezhë to plan the war, but he fell ill, perhaps with malaria, and died there on 17 January, aged about 62. His widow and young son fled to Italy, and Venice took over Krujë and carried on the war with the help of Albanian and Montenegrin lords such as Lekë Dukagjini and Ivan Crnojević. In 1474 the Ottomans besieged Venetian Shkodër for three months without success.: I januari 1468 kallade Skanderbeg de återstående albanska stormännen till Lezhë för att planera kriget, men han insjuknade, kanske i malaria, och dog där den 17 januari, omkring 62 år gammal. Hans änka och unge son flydde till Italien, och Venedig tog över Krujë och fortsatte kriget med hjälp av albanska och montenegrinska stormän som Lekë Dukagjini och Ivan Crnojević. År 1474 belägrade osmanerna det venetianska Shkodër i tre månader utan framgång.
In 1477 Ottoman troops blockaded Krujë, and in September they routed a Venetian and Albanian relief army. Starving, the town surrendered on 15 or 16 June 1478, and many of its defenders are said to have been killed despite promises of safety. Mehmed II then besieged Shkodër in person; its small garrison beat off five great assaults in July, so the sultan took the nearby forts of Žabljak, Drisht and Lezhë, left an army to blockade the town and went home. In the peace of 25 January 1479 Venice gave up Shkodër, and in April its surviving defenders sailed for Venice. Of Venetian Albania only Durrës and a few coastal places were left.: År 1477 blockerade osmanska trupper Krujë, och i september drev de en venetiansk och albansk undsättningsarmé på flykt. Svältande kapitulerade staden den 15 eller 16 juni 1478, och många av dess försvarare ska ha dödats trots löften om säkerhet. Mehmed II belägrade sedan personligen Shkodër; dess lilla garnison slog tillbaka fem stora stormningar i juli, så sultanen intog de närbelägna fästena Žabljak, Drisht och Lezhë, lämnade en armé för att blockera staden och återvände hem. Genom freden den 25 januari 1479 avstod Venedig Shkodër, och i april seglade dess överlevande försvarare till Venedig. Av det venetianska Albanien återstod endast Durrës och några orter vid kusten.
