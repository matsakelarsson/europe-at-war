Skanderbeg’s rebellion: Skanderbegs uppror
The Albanian revolt against the Ottomans led by Gjergj Kastrioti, called Skanderbeg, a former Ottoman commander who seized Krujë in 1443. With the League of Lezhë, and later with help from Naples, the papacy and Venice, he held the mountains of northern and central Albania for a quarter of a century, beating several Ottoman armies and twice seeing sultans fail before Krujë. After his death in 1468 the struggle went on under Venetian leadership until Krujë fell in 1478 and Venice gave up Shkodër in 1479.: Det albanska upproret mot osmanerna under Gjergj Kastrioti, kallad Skanderbeg, en tidigare osmansk befälhavare som intog Krujë 1443. Med Lezhëförbundet, och senare med hjälp från Neapel, påvedömet och Venedig, höll han bergen i norra och mellersta Albanien i ett kvarts sekel, besegrade flera osmanska arméer och såg två gånger sultaner misslyckas framför Krujë. Efter hans död 1468 fortsatte kampen under venetiansk ledning tills Krujë föll 1478 och Venedig avstod Shkodër 1479.
