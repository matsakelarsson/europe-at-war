Albanian success: Albanska framgångar
Skanderbeg, son of the Albanian lord Gjon Kastrioti, had been sent to the Ottoman court as a hostage and rose high in the sultan’s service. In November 1443, during the Hungarian crusade, he left the Ottoman army with a few hundred Albanians, and on 28 November he took Krujë, his family’s old stronghold, with a forged order from the sultan. He returned to Christianity and raised a red flag with a black double-headed eagle. On 2 March 1444, at Venetian-held Lezhë, the leading Albanian families formed an alliance under his command, known as the League of Lezhë.: Skanderbeg, son till den albanske stormannen Gjon Kastrioti, hade sänts till det osmanska hovet som gisslan och nådde en hög ställning i sultanens tjänst. I november 1443, under det ungerska korståget, lämnade han den osmanska armén med några hundra albaner, och den 28 november intog han Krujë, släktens gamla fäste, med hjälp av en förfalskad order från sultanen. Han återgick till kristendomen och hissade en röd fana med en svart dubbelörn. Den 2 mars 1444, i det venetianska Lezhë, bildade de ledande albanska släkterna en allians under hans befäl, känd som Lezhëförbundet.
On 29 June 1444 Skanderbeg defeated an Ottoman army at Torvioll, using a force hidden in the woods to fall on its flank, and in 1446 he won again at Otonetë. A quarrel over the inheritance of the fortress of Dagnum led to war with Venice in 1447–1448, while the Ottomans took the border fortress of Svetigrad in 1448 and Berat in 1450. In May 1450 Murad II himself, with his son Mehmed, besieged Krujë. While Vrana Konti held the castle, Skanderbeg harried the besiegers from the mountains, and in the autumn, after costly assaults had failed, Murad withdrew.: Den 29 juni 1444 besegrade Skanderbeg en osmansk armé vid Torvioll genom att låta en styrka som gömt sig i skogen falla den i flanken, och 1446 segrade han på nytt vid Otonetë. En tvist om arvet efter fästningen Dagnum ledde till krig med Venedig 1447–1448, medan osmanerna intog gränsfästningen Svetigrad 1448 och Berat 1450. I maj 1450 belägrade Murad II själv, tillsammans med sin son Mehmed, Krujë. Medan Vrana Konti höll borgen ansatte Skanderbeg belägrarna från bergen, och på hösten, sedan kostsamma stormningar hade misslyckats, drog sig Murad tillbaka.
