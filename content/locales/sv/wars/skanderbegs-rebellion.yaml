The main narrative source, Marin Barleti’s life of Skanderbeg written about forty years after his death, is a heroic biography, and its figures for Ottoman armies and losses, often repeated, are much exaggerated. Modern estimates are given here where they exist; Ottoman, Venetian and Ragusan documents give a more sober picture.: Den viktigaste berättande källan, Marin Barletis levnadsteckning över Skanderbeg, skriven omkring fyrtio år efter hans död, är en hjältebiografi, och dess ofta upprepade siffror för osmanska arméer och förluster är kraftigt överdrivna. Moderna uppskattningar anges här där sådana finns; osmanska, venetianska och ragusiska dokument ger en mer nykter bild.
The League of Lezhë was a loose alliance of noble families. Several of its members, including Skanderbeg’s own nephew Hamza, changed sides at times, and Venice fought against Skanderbeg in 1447–1448 before becoming his ally in 1463.: Lezhëförbundet var en lös allians av adelssläkter. Flera av dess medlemmar, däribland Skanderbegs egen brorson Hamza, bytte tidvis sida, och Venedig stred mot Skanderbeg 1447–1448 innan republiken blev hans bundsförvant 1463.
