Murad II’s siege failed. Vrana Konti commanded the garrison while Skanderbeg attacked the Ottoman supply lines.: Murad II:s belägring misslyckades. Vrana Konti förde befälet över garnisonen medan Skanderbeg anföll de osmanska försörjningslinjerna.
Short of money after the siege, Skanderbeg allied with King Alfonso V of Naples by the Treaty of Gaeta in March 1451, accepting him as overlord in return for troops and supplies. In 1455 he lost much of his cavalry in a surprise attack while besieging Berat, and in 1456 his nephew Hamza, who had lost hope of succeeding him, went over to the Ottomans. In 1457 a large Ottoman army under Isa Bey and Hamza ravaged the lowlands and camped at Albulena (Ujëbardha), between Lezhë and Krujë. Having hidden in the mountains for weeks, Skanderbeg fell on the camp on 2 September and routed the army. Pope Calixtus III named him captain-general of the Holy See.: Med ont om pengar efter belägringen allierade sig Skanderbeg med kung Alfons V av Neapel genom fördraget i Gaeta i mars 1451 och erkände honom som överherre i utbyte mot trupper och förnödenheter. År 1455 förlorade han en stor del av sitt kavalleri i ett överraskande anfall medan han belägrade Berat, och 1456 gick hans brorson Hamza, som hade förlorat hoppet om att efterträda honom, över till osmanerna. År 1457 härjade en stor osmansk armé under Isa bej och Hamza låglandet och slog läger vid Albulena (Ujëbardha), mellan Lezhë och Krujë. Efter att ha gömt sig i bergen i veckor föll Skanderbeg över lägret den 2 september och drev armén på flykt. Påve Calixtus III utnämnde honom till den heliga stolens generalkapten.
After an expedition to Italy in 1460–1462 to help Alfonso’s son Ferdinand against his rivals, and a short-lived truce with Mehmed in the spring of 1463, Skanderbeg returned to war later that year, now allied with Venice. In 1466 Mehmed II besieged Krujë in person and, when it held, built the fortress of Elbasan in the plain to keep it under pressure. Skanderbeg, back from seeking aid in Rome and Naples, attacked the besiegers with Lekë Dukagjini in April 1467; their commander Ballaban Pasha was killed on 23 April, and the siege was broken. Mehmed came back that summer and laid waste much of the country, but Krujë still held.: Efter en expedition till Italien 1460–1462 för att hjälpa Alfons son Ferdinand mot hans rivaler, och ett kortvarigt stillestånd med Mehmed våren 1463, gick Skanderbeg åter i krig senare samma år, nu i allians med Venedig. År 1466 belägrade Mehmed II personligen Krujë och byggde, när staden höll stånd, fästningen Elbasan på slätten för att hålla den under tryck. Skanderbeg, som återvänt efter att ha sökt hjälp i Rom och Neapel, anföll belägrarna tillsammans med Lekë Dukagjini i april 1467; deras befälhavare Ballaban pasha dödades den 23 april, och belägringen bröts. Mehmed kom tillbaka samma sommar och ödelade stora delar av landet, men Krujë höll fortfarande stånd.
