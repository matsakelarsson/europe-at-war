# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
Small Swords Society uprising: Småsvärdssällskapets uppror
? Risings of the Small Swords Society, a branch of the Heaven and Earth Society (Tiandihui) secret societies, in Fujian and Shanghai during the Taiping Rebellion. In May 1853 the society took Xiamen (Amoy) and nearby towns, holding Xiamen until Qing forces retook it in November 1853. On 7 September 1853 its members in Shanghai, led by Liu Lichuan and mostly from Guangdong and Fujian, seized the walled Chinese city, killed the magistrate and drove out the intendant Wu Jianzhang. They proclaimed a restored Ming state and wrote to the Taiping, who never sent help. Qing troops besieged the city for seventeen months, while thousands of refugees crowded into the foreign settlements outside its walls. The British and Americans at first stayed neutral, and in April 1854 their volunteers fought Qing troops who threatened the settlements at the Battle of Muddy Flat; the French joined the siege in December 1854 and January 1855, and the rebels abandoned the city on the night of 17 February 1855. Liu Lichuan was killed, and the Qing executed many of those who stayed behind.
: Resningar av Småsvärdssällskapet, en gren av de hemliga sällskapen inom Himlens och jordens sällskap (Tiandihui), i Fujian och Shanghai under Taipingupproret. I maj 1853 intog sällskapet Xiamen (Amoy) och närliggande städer och höll Xiamen tills Qingstyrkor återtog staden i november 1853. Den 7 september 1853 tog dess medlemmar i Shanghai, under ledning av Liu Lichuan och mestadels från Guangdong och Fujian, den muromgärdade kinesiska staden, dödade distriktsmagistraten och drev ut intendenten Wu Jianzhang. De utropade en återupprättad Mingstat och skrev till taipingrebellerna, som aldrig sände hjälp. Qingtrupper belägrade staden i sjutton månader, medan tusentals flyktingar trängde ihop sig i de utländska bosättningarna utanför dess murar. Britterna och amerikanerna förhöll sig till en början neutrala, och i april 1854 stred deras frivilliga mot Qingtrupper som hotade bosättningarna i slaget vid Muddy Flat; fransmännen anslöt sig till belägringen i december 1854 och januari 1855, och rebellerna övergav staden under natten den 17 februari 1855. Liu Lichuan dödades, och Qing avrättade många av dem som stannade kvar.
