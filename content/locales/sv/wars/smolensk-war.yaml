Shein: Sjein
Władysław IV: Władysław IV
Shein pulled his army back into its fortified camp, and by mid-October it was surrounded. No help came. Polish and Cossack cavalry raided far behind his lines, and Polish–Lithuanian troops retook Dorogobuzh with its stores. Crimean Tatar raids on southern Russia led many servicemen from the south to desert to defend their homes, the foreign officers quarrelled, and disease spread through the camp. Shein opened talks in January. Under the surrender signed on 25 February 1634 his men marched out on 1 March, laid their banners before the king and left most of their guns behind. Over 4,000 of the 12,000 or so who were left, most of the foreigners among them, entered Polish service.: Sjein drog tillbaka sin armé in i dess befästa läger, och i mitten av oktober var den omringad. Ingen hjälp kom. Polskt kavalleri och kosackkavalleri gjorde räder långt bakom hans linjer, och polsk-litauiska trupper återtog Dorogobuzj med dess förråd. Krimtatarernas räder mot södra Ryssland fick många tjänstemän från södern att desertera för att försvara sina hem, de utländska officerarna grälade, och sjukdomar spred sig i lägret. Sjein inledde förhandlingar i januari. Enligt den kapitulation som undertecknades den 25 februari 1634 marscherade hans män ut den 1 mars, lade ned sina fanor inför kungen och lämnade de flesta av sina kanoner efter sig. Över 4 000 av de omkring 12 000 som återstod, däribland de flesta av utlänningarna, gick i polsk tjänst.
In Moscow Shein and his deputy Artemy Izmailov were accused of treason and beheaded in April. Władysław marched east, but his siege of Belaya failed, an Ottoman army was gathering on the Commonwealth’s southern border, and the Sejm wanted peace. Talks began on 30 April, and the treaty was signed on 14 June at Semlevo on the Polyanovka river. Russia gave up its claim to Smolensk and paid 20,000 rubles, and Władysław renounced the Russian throne, to which he had been elected in 1610. He also handed over the border town of Serpeysk. Smolensk stayed Polish–Lithuanian for another twenty years.: I Moskva anklagades Sjein och hans ställföreträdare Artemij Izmajlov för förräderi och halshöggs i april. Władysław marscherade österut, men hans belägring av Belaja misslyckades, en osmansk armé samlades vid samväldets södra gräns, och sejmen ville ha fred. Förhandlingarna inleddes den 30 april, och fördraget undertecknades den 14 juni i Semlevo vid floden Poljanovka. Ryssland avstod från sina anspråk på Smolensk och betalade 20 000 rubel, och Władysław avsade sig den ryska tronen, till vilken han hade valts 1610. Han överlämnade också gränsstaden Serpejsk. Smolensk förblev polsk-litauiskt i ytterligare tjugo år.
