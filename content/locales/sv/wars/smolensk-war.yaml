Dates are New Style (Gregorian); Russian sources give them ten days earlier.: Datumen anges enligt nya stilen (gregorianska kalendern); ryska källor anger dem tio dagar tidigare.
Smolensk, Dorogobuzh, Bely (Belaya) and Vyazma are today in Russia; Polotsk and Orsha are in Belarus.: Smolensk, Dorogobuzj, Belyj (Belaja) och Vjazma ligger i dag i Ryssland; Polotsk och Orsja ligger i Belarus.
The Truce of Deulino of 1618 had left Smolensk and the Chernihiv and Siverian lands to Poland–Lithuania, and it was due to run out in 1633. When King Sigismund III died in April 1632, Russia decided not to wait for a new king to be elected. The war was pressed by Patriarch Filaret, the tsar’s father, and in early October an army of some 30,000–35,000 men crossed the border under Mikhail Shein, who had defended Smolensk against the Poles in 1609–1611. Eight of its regiments, about half the army, had been raised and drilled on the Western model under foreign officers.: Stilleståndet i Deulino 1618 hade lämnat Smolensk samt de tjernihiviska och severiska länderna åt Polen–Litauen, och det skulle löpa ut 1633. När kung Sigismund III dog i april 1632 beslöt Ryssland att inte vänta på att en ny kung skulle väljas. Kriget drevs på av patriarken Filaret, tsarens far, och i början av oktober gick en armé på omkring 30 000–35 000 man över gränsen under Michail Sjein, som hade försvarat Smolensk mot polackerna 1609–1611. Åtta av dess regementen, omkring halva armén, hade satts upp och exercerats efter västerländsk förebild under utländska officerare.
Shein took Dorogobuzh and other border towns and on 28 October began the siege of Smolensk, held by about 3,000 soldiers and local nobles. His heavy guns came only in December and March. Mines brought down part of the wall, but assaults failed, and Lithuanian troops under Krzysztof Radziwiłł raided his supply lines and slipped men into the city. In August 1633 the new king, Władysław IV, arrived with a relief army of about 20,000–25,000, joined in September by thousands of Zaporozhian Cossacks. His troops took the Russian siege works one by one, and by 4 October the siege was broken.: Sjein intog Dorogobuzj och andra gränsstäder och inledde den 28 oktober belägringen av Smolensk, som hölls av omkring 3 000 soldater och lokala adelsmän. Hans tunga kanoner kom först i december och mars. Minor fällde en del av muren, men stormningarna misslyckades, och litauiska trupper under Krzysztof Radziwiłł angrep hans försörjningslinjer och smugglade in manskap i staden. I augusti 1633 anlände den nye kungen, Władysław IV, med en undsättningsarmé på omkring 20 000–25 000 man, som i september förstärktes av tusentals zaporogkosacker. Hans trupper intog de ryska belägringsverken ett efter ett, och den 4 oktober var belägringen bruten.
