Smolensk War: Smolenskkriget
In 1632, during the interregnum after the death of Sigismund III and as the Truce of Deulino neared its end, Russia sent an army under Mikhail Shein to retake Smolensk. The new Polish king, Władysław IV, relieved the city in 1633 and surrounded Shein’s army, which surrendered early in 1634. At Polyanovka that June Russia accepted the Deulino border with small changes and paid Władysław to give up his claim to the Russian throne.: År 1632, under interregnumet efter Sigismund III:s död och när stilleståndet i Deulino närmade sig sitt slut, sände Ryssland en armé under Michail Sjein för att återta Smolensk. Den nye polske kungen Władysław IV undsatte staden 1633 och inneslöt Sjeins armé, som kapitulerade i början av 1634. Vid Poljanovka i juni samma år godtog Ryssland Deulinogränsen med små ändringar och betalade Władysław för att han skulle avstå från sina anspråk på den ryska tronen.
