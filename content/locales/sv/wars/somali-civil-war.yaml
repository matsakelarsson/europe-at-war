# Svenska översättningar av katalogtexten (våg 12); stegtexterna kommer senare.
Somali Civil War (1991–2006): Somaliska inbördeskriget (1991–2006)
? "The collapse of the Somali state and the fifteen years of war, famine and failed peace efforts that followed. When clan-based rebel movements drove Mohamed Siad Barre from Mogadishu in January 1991, the victors fell out: the United Somali Congress split between Ali Mahdi Muhammad and Mohamed Farrah Aidid, whose battle for the capital killed thousands, while the north-west declared itself independent as Somaliland. War and drought caused the famine of 1991–1992, in which some 200,000–300,000 people died, most in the farming lands between the Juba and Shebelle rivers. A US-led force (UNITAF) secured relief from December 1992, but its UN successor, UNOSOM II, was drawn into war with Aidid; after the battle of Mogadishu on 3–4 October 1993, in which 18 American soldiers and hundreds of Somalis were killed, the United States and then the UN withdrew. For a decade Somalia had no central government: Puntland and other regions set up their own administrations, and a series of peace conferences produced governments that could not govern. In 2006 the Islamic Courts Union defeated the faction leaders of Mogadishu, often called warlords, and took most of the south, which led to the Ethiopian intervention of December 2006."
: "Den somaliska statens sammanbrott och de femton år av krig, hungersnöd och misslyckade fredsförsök som följde. När klanbaserade rebellrörelser drev Mohamed Siad Barre från Mogadishu i januari 1991 blev segrarna oense: Förenade somaliska kongressen splittrades mellan Ali Mahdi Muhammad och Mohamed Farrah Aidid, vars strid om huvudstaden dödade tusentals, medan nordväst förklarade sig självständigt som Somaliland. Krig och torka orsakade hungersnöden 1991–1992, då omkring 200 000–300 000 människor dog, de flesta i jordbruksområdena mellan floderna Juba och Shebelle. En USA-ledd styrka (UNITAF) säkrade nödhjälpen från december 1992, men dess efterföljare inom FN, UNOSOM II, drogs in i krig med Aidid; efter slaget om Mogadishu den 3–4 oktober 1993, där 18 amerikanska soldater och hundratals somalier dödades, drog sig USA och sedan FN tillbaka. Under ett decennium saknade Somalia centralregering: Puntland och andra regioner inrättade egna förvaltningar, och en rad fredskonferenser gav upphov till regeringar som inte kunde regera. År 2006 besegrade Islamiska domstolarnas union fraktionsledarna i Mogadishu, ofta kallade krigsherrar, och tog större delen av södern, vilket ledde till den etiopiska interventionen i december 2006."
