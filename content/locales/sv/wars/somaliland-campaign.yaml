# Svenska översättningar av katalogtexten (våg 12); stegtexterna kommer senare.
Somaliland campaign (the Dervish War): Somalilandfälttåget (dervischkriget)
? Twenty years of war between the Dervish movement of Mohammed Abdullah Hassan and the British, Italian and Ethiopian empires in the Somali lands. Hassan, a Somali religious teacher of the Salihiyya order, began preaching against foreign rule at Berbera in 1895 and in 1899 gathered several thousand armed men at Burao and called for a holy war; his followers called themselves daraawiish (dervishes), and the British called him the “Mad Mullah”. Four British expeditions, two of them with Ethiopian armies, failed to destroy him between 1901 and 1904, although his forces were beaten at Jidballi in January 1904. After a truce under Italian protection (1905) the Dervishes returned to the Nugal valley, built stone forts at Taleh and elsewhere, and in 1910 drove the British back to the coast, which left the interior to raiding and famine. In January and February 1920 a British campaign led by twelve aircraft of the Royal Air Force took the Dervish forts and Taleh, and Hassan died in the Ethiopian Ogaden at the end of the year. Estimates of the deaths in the war years, most of them from raiding, hunger and disease, run to about a third of the population of British Somaliland.
: Tjugo års krig mellan Mohammed Abdullah Hassans dervischrörelse och det brittiska, det italienska och det etiopiska imperiet i de somaliska områdena. Hassan, en somalisk religiös lärare i salihiyyaorden, började predika mot främmande styre i Berbera 1895 och samlade 1899 flera tusen beväpnade män i Burao och manade till heligt krig; hans anhängare kallade sig daraawiish (dervischer), och britterna kallade honom ”den galne mullan”. Fyra brittiska expeditioner, två av dem tillsammans med etiopiska arméer, misslyckades mellan 1901 och 1904 med att krossa honom, även om hans styrkor slogs vid Jidballi i januari 1904. Efter en vapenvila under italienskt beskydd (1905) återvände dervischerna till Nugaldalen, byggde stenfort i Taleh och på andra platser och drev 1910 britterna tillbaka till kusten, vilket lämnade inlandet åt räder och hungersnöd. I januari och februari 1920 intog ett brittiskt fälttåg, lett av tolv flygplan från Royal Air Force, dervischernas fort och Taleh, och Hassan dog i det etiopiska Ogaden i slutet av året. Uppskattningarna av antalet döda under krigsåren, de flesta till följd av räder, svält och sjukdomar, uppgår till omkring en tredjedel av befolkningen i Brittiska Somaliland.
