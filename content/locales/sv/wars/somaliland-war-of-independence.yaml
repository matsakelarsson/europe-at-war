# Svenska översättningar av katalogtexten (våg 12); stegtexterna kommer senare.
Somaliland War of Independence: Somalilands självständighetskrig
? The war of the Somali National Movement (SNM), drawn mainly from the Isaaq clans of north-western Somalia, against the government of Mohamed Siad Barre. Founded in London in 1981, the SNM fought from bases in Ethiopia until a peace deal between Siad Barre and Mengistu Haile Mariam in April 1988 forced it out. In May 1988 it attacked Burao and Hargeisa. The government answered by shelling and bombing the cities, which were largely destroyed, and by killing Isaaq civilians across the north; estimates of the dead range from 50,000 to 100,000, with some as high as 200,000, and up to half a million people fled to Ethiopia. A UN investigation in 2001 concluded that genocide had been committed against the Isaaq. The SNM fought on in the countryside, and when Siad Barre fell in January 1991 it took control of the north. On 18 May 1991 a conference of the northern clans at Burao declared the former British Somaliland independent as the Republic of Somaliland. Somalia regards it as part of its territory; Israel, in December 2025, was the first UN member state to recognise it.
: Det krig som Somaliska nationella rörelsen (SNM), som främst rekryterades bland isaaqklanerna i nordvästra Somalia, förde mot Mohamed Siad Barres regering. SNM grundades i London 1981 och stred från baser i Etiopien tills ett fredsavtal mellan Siad Barre och Mengistu Haile Mariam i april 1988 tvingade ut rörelsen. I maj 1988 anföll den Burao och Hargeisa. Regeringen svarade med att beskjuta och bomba städerna, som till stor del förstördes, och med att döda civila isaaqer i hela norra delen av landet; uppskattningarna av antalet döda varierar från 50 000 till 100 000, och vissa går så högt som till 200 000, och upp till en halv miljon människor flydde till Etiopien. En FN-utredning kom 2001 fram till att folkmord hade begåtts mot isaaqerna. SNM fortsatte striden på landsbygden, och när Siad Barre föll i januari 1991 tog rörelsen kontrollen över norra delen av landet. Den 18 maj 1991 förklarade en konferens med de nordliga klanerna i Burao det forna Brittiska Somaliland självständigt som Republiken Somaliland. Somalia betraktar det som en del av sitt territorium; Israel blev i december 2025 den första av FN:s medlemsstater att erkänna det.
