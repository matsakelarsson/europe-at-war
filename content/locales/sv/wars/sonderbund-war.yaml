The Sonderbund (“separate alliance”) was its opponents’ name for the league, which called itself a protective union (Schutzvereinigung). Unterwalden is today the two cantons of Obwalden and Nidwalden.: Sonderbund (”separatförbundet”) var motståndarnas namn på förbundet, som kallade sig ett skyddsförbund (Schutzvereinigung). Unterwalden utgörs i dag av de två kantonerna Obwalden och Nidwalden.
Neuchâtel, then both a Swiss canton and a principality of the King of Prussia, and Appenzell Innerrhoden stayed neutral and sent no troops.: Neuchâtel, som då både var en schweizisk kanton och ett furstendöme under kungen av Preussen, och Appenzell Innerrhoden förblev neutrala och skickade inga trupper.
