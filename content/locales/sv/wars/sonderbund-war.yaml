Switzerland in the 1840s was a loose league of sovereign cantons under the Federal Treaty of 1815. Liberals and radicals, strongest in the Protestant and urban cantons, wanted a federal state; Catholic conservatives defended cantonal sovereignty and the Church. Aargau closed its monasteries in 1841, and Lucerne called in the Jesuits to run its schools in 1844. Bands of radical volunteers twice attacked Lucerne and were beaten off. On 11 December 1845 seven Catholic cantons, Lucerne, Uri, Schwyz, Unterwalden, Zug, Fribourg and Valais, formed a defensive league with its own council of war.: Schweiz var på 1840-talet ett löst förbund av suveräna kantoner under förbundsfördraget från 1815. Liberaler och radikaler, som var starkast i de protestantiska och urbana kantonerna, ville ha en förbundsstat; katolska konservativa försvarade kantonernas suveränitet och kyrkan. Aargau stängde sina kloster 1841, och Luzern kallade in jesuiterna för att sköta sina skolor 1844. Skaror av radikala frivilliga angrep två gånger Luzern och slogs tillbaka. Den 11 december 1845 bildade sju katolska kantoner, Luzern, Uri, Schwyz, Unterwalden, Zug, Fribourg och Valais, ett försvarsförbund med ett eget krigsråd.
After elections in St Gallen gave the liberals a majority in the Federal Diet, it declared the league illegal under the Federal Treaty on 20 July 1847 and ordered it dissolved. Both sides mobilised in October. The Sonderbund struck first, seizing the St Gotthard on 3 November, and on 4 November the Diet resolved to dissolve it by force. General Guillaume Henri Dufour of Geneva, a moderate conservative, led about 100,000 federal troops. He turned first on isolated Fribourg, which surrendered on 14 November after a brief fight at one of its redoubts.: Sedan val i Sankt Gallen hade gett liberalerna majoritet i förbundsdagen förklarade denna den 20 juli 1847 förbundet olagligt enligt förbundsfördraget och beordrade att det skulle upplösas. Båda sidor mobiliserade i oktober. Sonderbund slog till först och intog Sankt Gotthard den 3 november, och den 4 november beslöt förbundsdagen att upplösa det med våld. General Guillaume Henri Dufour från Genève, en moderat konservativ, ledde omkring 100 000 förbundssoldater. Han vände sig först mot det isolerade Fribourg, som kapitulerade den 14 november efter en kort strid vid en av dess skansar.
