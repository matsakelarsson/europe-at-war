Dufour now marched his army against central Switzerland. On 17 November troops from Uri pushed down into Ticino and took Airolo, but the advance stalled near Biasca. Zug voted to surrender on 21 November without a fight. On 23 November five federal columns converged on Lucerne, and the Sonderbund council and Lucerne’s government withdrew to Uri. At Gisikon on the Reuss the Sonderbund army held a wooded height against two assaults before Colonel Eduard Ziegler led his division up it. It was the bloodiest fight of the war and the last pitched battle fought by Swiss troops.: Dufour marscherade nu med sin armé mot centrala Schweiz. Den 17 november trängde trupper från Uri ned i Ticino och intog Airolo, men framryckningen avstannade nära Biasca. Zug röstade den 21 november för att kapitulera utan strid. Den 23 november konvergerade fem förbundskolonner mot Luzern, och Sonderbunds råd och Luzerns regering drog sig tillbaka till Uri. Vid Gisikon vid Reuss höll Sonderbunds armé en skogbevuxen höjd mot två anfall innan överste Eduard Ziegler ledde sin division uppför den. Det var krigets blodigaste strid och det sista fältslag som schweiziska trupper har utkämpat.
Federal troops entered Lucerne on 24 November. The Sonderbund council broke up at Flüelen two days later; Unterwalden, Schwyz and Uri gave in, and Valais, the last, surrendered on 29 November. Later research counts about 60 federal and 33 Sonderbund dead. Dufour had ordered his men to spare the wounded and prisoners, and the war left less bitterness than many had feared. The defeated cantons were charged the war costs and got liberal governments. The Federal Constitution, adopted on 12 September 1848, made Switzerland a federal state and banned the Jesuits.: Förbundstrupperna ryckte in i Luzern den 24 november. Sonderbunds råd upplöstes i Flüelen två dagar senare; Unterwalden, Schwyz och Uri gav upp, och Valais, den sista, kapitulerade den 29 november. Senare forskning räknar med omkring 60 döda på förbundssidan och 33 på Sonderbunds sida. Dufour hade beordrat sina män att skona sårade och fångar, och kriget lämnade mindre bitterhet efter sig än många hade fruktat. De besegrade kantonerna fick betala krigskostnaderna och fick liberala regeringar. Förbundsförfattningen, som antogs den 12 september 1848, gjorde Schweiz till en förbundsstat och förbjöd jesuiterna.
