Sonderbund War: Sonderbundskriget
A short civil war in Switzerland between the Federal Diet and the Sonderbund, a defensive league of seven Catholic and conservative cantons. The federal army under General Guillaume Henri Dufour forced the league’s members to surrender one by one in under four weeks, with fewer than 100 dead, and the constitution of 1848 turned the loose confederation into a federal state.: Ett kort inbördeskrig i Schweiz mellan förbundsdagen och Sonderbund, ett försvarsförbund mellan sju katolska och konservativa kantoner. Förbundsarmén under general Guillaume Henri Dufour tvingade förbundets medlemmar att kapitulera en efter en på mindre än fyra veckor, med färre än 100 döda, och 1848 års författning förvandlade det lösa statsförbundet till en förbundsstat.
