# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
Song–Đại Cồ Việt war: Kriget mellan Songdynastin och Đại Cồ Việt
The Song dynasty’s attempt to restore Chinese rule over the Red River plain after the murder of Đinh Bộ Lĩnh, the first king of Đại Cồ Việt, in 979. With a boy king on the throne and Song armies gathering on the border, the court made the commander-in-chief Lê Hoàn king in 980. In early 981 one Song army marched from Guangxi by the Lạng Sơn road while a fleet sailed into the Bạch Đằng estuary. Song records claim a victory on the river; Vietnamese tradition counts the second battle of Bạch Đằng as Lê Hoàn’s. The land army stalled, lost men to disease, and its commander Hou Renbao was lured into an ambush at Chi Lăng and killed; by the spring the Song had withdrawn. Lê Hoàn returned the captured Song officers and sent tribute, and the Song later recognised him. In 982 he turned south, killed the Cham king in battle and sacked Indrapura, the capital of Champa.: Songdynastins försök att återupprätta det kinesiska styret över Röda flodens slätt efter mordet på Đinh Bộ Lĩnh, Đại Cồ Việts förste kung, 979. Med en barnkung på tronen och Songarméer som samlades vid gränsen gjorde hovet 980 överbefälhavaren Lê Hoàn till kung. I början av 981 tågade en Songarmé från Guangxi längs vägen över Lạng Sơn medan en flotta seglade in i mynningen av Bạch Đằng. Songkällorna gör anspråk på en seger på floden; den vietnamesiska traditionen räknar det andra slaget vid Bạch Đằng som Lê Hoàns. Landarmén körde fast och förlorade män i sjukdomar, och dess befälhavare Hou Renbao lockades i ett bakhåll vid Chi Lăng och dödades; till våren hade Songtrupperna dragit sig tillbaka. Lê Hoàn lämnade tillbaka de tillfångatagna Songofficerarna och sände tribut, och Song erkände honom senare. År 982 vände han sig söderut, dödade chamkungen i strid och plundrade Indrapura, Champas huvudstad.
