# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
Song–Liao war: Kriget mellan Song och Liao
? "The quarter-century of war between the Song dynasty and the Khitan Liao empire over the Sixteen Prefectures, the band of land around today’s Beijing and Datong that the Liao had held since 938. Fresh from the conquest of the Northern Han, the Song emperor Taizong marched on Youzhou (Yanjing, Beijing) in 979, but was routed at the Gaoliang River and fled south wounded. After years of raids, he tried again in 986, while a boy emperor, Shengzong, reigned in the Liao under his mother, the empress dowager Xiao Chuo. Three Song armies crossed the border; Yelü Xiuge destroyed the eastern army under Cao Bin, the western army lost the four prefectures it had taken in Shanxi, and its general Yang Ye was captured at Chenjiagu and died. From 999 the Liao raided the Song every year, and in 1004 Shengzong and his mother drove deep into Hebei to Chanzhou on the Yellow River, where the Song emperor Zhenzong came to meet them. In January 1005 the Treaty of Chanyuan made peace: the Song paid the Liao 200,000 bolts of silk and 100,000 taels of silver a year, and the two emperors called each other brothers. The border stayed where it was, and peace between the two empires lasted more than a century."
: "Det kvartssekel av krig som Songdynastin och khitanernas Liaorike utkämpade om de sexton prefekturerna, landremsan kring dagens Peking och Datong som Liao hade behärskat sedan 938. Direkt efter erövringen av Norra Han tågade Songkejsaren Taizong 979 mot Youzhou (Yanjing, Peking), men han slogs på flykten vid floden Gaoliang och flydde sårad söderut. Efter år av räder gjorde han ett nytt försök 986, medan en barnkejsare, Shengzong, regerade i Liao under sin mor, änkekejsarinnan Xiao Chuo. Tre Songarméer gick över gränsen; Yelü Xiuge förintade den östra armén under Cao Bin, den västra armén förlorade de fyra prefekturer den hade intagit i Shanxi, och dess fältherre Yang Ye tillfångatogs vid Chenjiagu och dog. Från 999 företog Liao räder mot Song varje år, och 1004 trängde Shengzong och hans mor djupt in i Hebei ända till Chanzhou vid Gula floden, där Songkejsaren Zhenzong kom för att möta dem. I januari 1005 slöts fred genom Chanyuanfördraget: Song betalade Liao 200 000 rullar siden och 100 000 tael silver om året, och de två kejsarna kallade varandra bröder. Gränsen förblev där den var, och freden mellan de två rikena varade i mer än ett sekel."
