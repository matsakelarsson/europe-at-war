# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
Song reunification of China: Songdynastins återförening av Kina
? "The wars in which the Song dynasty, founded in 960 by the Later Zhou general Zhao Kuangyin (Emperor Taizu), brought the southern kingdoms and the Northern Han under its rule and ended the division of China that had followed the fall of the Tang. Taizu followed a plan of “the south first, the north later”, taking the weaker southern states before turning on the stronger north: Jingnan and Hunan in 963, the Later Shu in Sichuan in 964–965, the Southern Han in the far south in 970–971, and the Southern Tang on the lower Yangtze in 974–976, whose capital Jinling fell after a siege of almost a year. His attacks on the Northern Han at Taiyuan, protected by the Liao, failed in 968–969 and 976. His brother and successor Zhao Guangyi (Emperor Taizong) received the peaceful surrender of Wuyue and the Qingyuan circuit in 978, and in 979 besieged Taiyuan, beat off a Liao relief army and took the surrender of the last Northern Han ruler, Liu Jiyuan. Except for the Sixteen Prefectures held by the Liao, the far north-west and the south-west beyond Sichuan, China was united again. The Song went straight on from Taiyuan to attack the Liao, starting the Song–Liao war."
: "De krig genom vilka Songdynastin, som grundades 960 av Senare Zhous fältherre Zhao Kuangyin (kejsar Taizu), förde de sydliga kungarikena och Norra Han under sitt styre och gjorde slut på den splittring av Kina som hade följt på Tangdynastins fall. Taizu följde planen ”först södern, sedan norr” och tog de svagare staterna i söder innan han vände sig mot de starkare i norr: Jingnan och Hunan 963, Senare Shu i Sichuan 964–965, Södra Han längst i söder 970–971 och Södra Tang vid nedre Yangtze 974–976, vars huvudstad Jinling föll efter en nästan årslång belägring. Hans angrepp på Norra Han i Taiyuan, som skyddades av Liao, misslyckades 968–969 och 976. Hans bror och efterträdare Zhao Guangyi (kejsar Taizong) tog 978 emot Wuyues och Qingyuankretsens fredliga underkastelse, och 979 belägrade han Taiyuan, slog tillbaka en undsättningsarmé från Liao och tog emot kapitulationen från Norra Hans siste härskare, Liu Jiyuan. Med undantag för de sexton prefekturerna, som Liao behärskade, det yttersta nordväst och sydväst bortom Sichuan var Kina åter enat. Songdynastin gick direkt vidare från Taiyuan till ett angrepp på Liao och inledde därmed kriget mellan Song och Liao."
