# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
Song–Xia war (1038–1044): Kriget mellan Song och Xia (1038–1044)
? "The war that followed Li Yuanhao’s proclamation of the Tangut empire of the Great Xia, known as the Western Xia, in 1038. The Song refused to recognise a second emperor on its north-western frontier, cut off trade and put a price on Yuanhao’s head. Yuanhao, with an army of mounted warriors raised from all Tangut men between 15 and 60, struck at the Song frontier in Shaanxi and Gansu and won three great battles: at Sanchuankou near Yan’an in early 1040, at Haoshuichuan in 1041, where the Song general Ren Fu and most of his army were killed, and at Dingchuan fort in 1042. But he could not take the walled towns and forts that Fan Zhongyan and Han Qi built up along the border, and the war, the loss of trade and the drain on his men exhausted the Xia. The Liao used the Song’s difficulty to win higher payments in 1042, then attacked the Xia themselves in 1044 and were heavily defeated. In 1044 Yuanhao agreed to call himself lord of Xia and a subject of the Song, in return for gifts each year of silver, silk and tea worth some 250,000 units and the reopening of the border markets."
: "Det krig som följde sedan Li Yuanhao 1038 hade utropat tanguternas kejsardöme Stora Xia, känt som Västra Xia. Song vägrade erkänna en andra kejsare vid sin nordvästra gräns, avbröt handeln och satte ett pris på Yuanhaos huvud. Yuanhao, med en armé av beridna krigare som uppbådats bland alla tangutiska män mellan 15 och 60 år, slog till mot Songrikets gräns i Shaanxi och Gansu och vann tre stora slag: vid Sanchuankou nära Yan’an i början av 1040, vid Haoshuichuan 1041, där Songfältherren Ren Fu och större delen av hans armé dödades, och vid fästet Dingchuan 1042. Men han kunde inte inta de befästa städer och fästen som Fan Zhongyan och Han Qi byggde ut längs gränsen, och kriget, handelsbortfallet och förlusterna av manskap utmattade Xia. Liao utnyttjade Songs svårigheter för att 1042 tilltvinga sig högre betalningar och angrep sedan själva Xia 1044, men led ett svårt nederlag. År 1044 gick Yuanhao med på att kalla sig herre över Xia och Songs undersåte, i utbyte mot årliga gåvor av silver, siden och te till ett värde av omkring 250 000 enheter och mot att gränsmarknaderna öppnades igen."
