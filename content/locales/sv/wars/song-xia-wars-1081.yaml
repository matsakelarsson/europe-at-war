# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
Song–Xia wars (1081–1119): Krigen mellan Song och Xia (1081–1119)
? The second round of wars between the Song and the Tangut Western Xia, fought in the loess hills and deserts of today’s Shaanxi, Ningxia and Gansu. In 1081 the Song emperor Shenzong, whose reforms had filled his treasury, sent five armies, more than 300,000 men, to destroy the Xia while its court was torn by a struggle between the young emperor Huizong and his mother’s family. The Song took Lanzhou and much of the Ordos, but the siege of Lingzhou failed when the Xia broke the Yellow River dikes and flooded the Song camps, and the retreat became a rout. In 1082 the Xia destroyed the new Song fortress of Yongle, killing more than 17,000 men, and the war ended with Shenzong’s death in 1085. In 1097–1099 the Song tried again with a policy of advancing step by step and fortifying each position, and beat off a great Xia attack at Pingxia in 1098; in 1103–1104 it conquered the Tibetan kingdom of Tsongkha. A last offensive under the eunuch Tong Guan from 1113 ended in disaster in 1119, when Liu Fa’s army was destroyed, and a ceasefire was agreed. The wars gained the Song Lanzhou and a belt of forts, at enormous cost.
: Den andra omgången krig mellan Song och tanguternas Västra Xia, utkämpade i lössbergen och öknarna i dagens Shaanxi, Ningxia och Gansu. År 1081 sände Songkejsaren Shenzong, vars reformer hade fyllt hans statskassa, fem arméer, mer än 300 000 man, för att förinta Xia medan dess hov slets sönder av en maktkamp mellan den unge kejsaren Huizong och hans mors släkt. Song intog Lanzhou och stora delar av Ordos, men belägringen av Lingzhou misslyckades när Xia bröt igenom Gula flodens vallar och dränkte Songlägren, och återtåget urartade i vild flykt. År 1082 förstörde Xia den nya Songfästningen Yongle och dödade mer än 17 000 man, och kriget tog slut med Shenzongs död 1085. År 1097–1099 gjorde Song ett nytt försök med en politik som gick ut på att rycka fram steg för steg och befästa varje ställning, och slog 1098 tillbaka ett stort angrepp från Xia vid Pingxia; 1103–1104 erövrade Song det tibetanska kungariket Tsongkha. En sista offensiv under eunucken Tong Guan från 1113 slutade 1119 i katastrof, när Liu Fas armé förintades, och man kom överens om eldupphör. Krigen gav Song Lanzhou och ett bälte av fästen, till en enorm kostnad.
