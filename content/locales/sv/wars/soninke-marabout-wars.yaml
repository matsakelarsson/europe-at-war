# Svenska översättningar av katalogtexten (våg 13); stegtexterna kommer senare.
Soninke–Marabout wars: Krigen mellan soninke och marabouter
? Half a century of wars in the Gambia valley and Casamance between the old ruling families of the Mandinka kingdoms and Muslim reformers, the marabouts, in which Britain and France took sides and then took the land. “Soninke” here was not the Soninke people but the name the marabouts gave to the rulers and warriors who kept the old religion or a loosely held Islam and lived by raiding, taxing trade and drinking palm wine; the marabouts, among them Mandinka, Fula and Jakhanke clerics, wanted Muslim states ruled by Islamic law. Fighting began in 1850 in Kombo, next to the British post at Bathurst (Banjul), where Muslim towns rose against King Suling Jatta, who was killed in 1855; British and, in 1855, French forces attacked the marabout stronghold of Sabaji (Sabajee), and Britain used the war to add land in Kombo to its colony. In the 1860s Maba Diakhou Bâ carried the war north of the river into Badibu and Saloum, and in 1867 the Fula leader Alfa Molo and Futa Jallon destroyed Kansala, the capital of Kaabu, after which Alfa Molo and his son Musa Molo ruled Fuladu on the upper river. The Jakhanke marabout Fodé Kaba Doumbouya, who had served under Maba, fought Fuladu and the Mandinka and Jola villages from the 1870s and ruled Fogny and eastern Kiang from his fortified town of Medina; the Soninke Mahmadu Lamine’s jihad of 1885–1887 reached Wuli and Niani. All sides took captives, and many were sold for horses and guns. The Anglo-French convention of 1889 drew the Gambia’s borders through these lands, and the two powers used the wars to extend their protectorates. Musa Molo became France’s ally against Fodé Kaba, who was killed when a French column with British support stormed Medina on 23 March 1901; in 1903 Musa Molo himself crossed into the British Gambia rather than submit to France.
: Ett halvsekel av krig i Gambiadalen och Casamance mellan de gamla härskarsläkterna i mandinkarikena och muslimska reformatorer, marabouterna, där Storbritannien och Frankrike tog ställning och sedan tog landet. ”Soninke” betecknade här inte soninkefolket utan var det namn som marabouterna gav de härskare och krigare som höll fast vid den gamla religionen eller vid en löst hållen islam och levde av räder, skatter på handeln och palmvinsdrickande; marabouterna, bland dem lärde bland mandinka, fula och jakhanke, ville ha muslimska stater styrda enligt islamisk lag. Striderna började 1850 i Kombo, granne med den brittiska utposten Bathurst (Banjul), där muslimska städer reste sig mot kung Suling Jatta, som dödades 1855; brittiska och, 1855, franska styrkor anföll marabouternas fäste Sabaji (Sabajee), och Storbritannien använde kriget till att lägga land i Kombo till sin koloni. På 1860-talet förde Maba Diakhou Bâ kriget norr om floden in i Badibu och Saloum, och 1867 förstörde fulaledaren Alfa Molo och Futa Jallon Kansala, Kaabus huvudstad, varefter Alfa Molo och hans son Musa Molo styrde Fuladu vid den övre floden. Jakhankemarabouten Fodé Kaba Doumbouya, som hade tjänat under Maba, stred från 1870-talet mot Fuladu och mot mandinka- och jolabyarna och styrde Fogny och östra Kiang från sin befästa stad Medina; den jihad som Mahmadu Lamine, själv soninke, förde 1885–1887 nådde Wuli och Niani. Alla sidor tog fångar, och många såldes mot hästar och gevär. Den brittisk-franska konventionen 1889 drog Gambias gränser genom dessa områden, och de två makterna använde krigen för att utvidga sina protektorat. Musa Molo blev Frankrikes bundsförvant mot Fodé Kaba, som dödades när en fransk kolonn med brittiskt stöd stormade Medina den 23 mars 1901; 1903 gick Musa Molo själv över till brittiska Gambia hellre än att underkasta sig Frankrike.
