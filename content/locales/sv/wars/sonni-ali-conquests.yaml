# Svenska översättningar av katalogtexten (våg 12); stegtexterna kommer senare.
Sonni Ali’s conquests: Sonni Alis erövringar
The campaigns by which Sonni Ali, king of Gao from about 1464, turned the small Songhai kingdom into the leading power of the Niger bend. With a cavalry army and a fleet of river boats he took Timbuktu from the Maghsharen Tuareg in January 1468, besieged and took Djenné (in 1473 by the usual reckoning), fought a long war with the Mossi, who reached Walata in 1480 before Sonni Ali defeated them in 1483, and campaigned against the Tuareg, the Fulani, the Dogon of the cliffs and the peoples of the Gourma. He drowned on his way back from the Gourma in November 1492. The Timbuktu chroniclers, who wrote for the scholars he had persecuted and for the Askia dynasty that overthrew his son, remember him as a tyrant; Songhai tradition remembers Si Ali Ber as a great king and magician, and modern historians see in him the real founder of the Songhai Empire.: De fälttåg genom vilka Sonni Ali, kung av Gao från omkring 1464, gjorde det lilla songhairiket till den ledande makten vid Nigerkröken. Med en kavalleriarmé och en flotta av flodbåtar tog han Timbuktu från maghsharentuaregerna i januari 1468, belägrade och intog Djenné (1473 enligt den vanliga beräkningen), förde ett långt krig mot mossi, som nådde Walata 1480 innan Sonni Ali besegrade dem 1483, och förde fälttåg mot tuaregerna, fulani, dogon i klippbranterna och folken i Gourma. Han drunknade på hemvägen från Gourma i november 1492. Timbuktukrönikörerna, som skrev för de lärda som han hade förföljt och för askiadynastin som störtade hans son, minns honom som en tyrann; songhaisk tradition minns Si Ali Ber som en stor kung och trollkarl, och moderna historiker ser i honom Songhairikets egentlige grundare.
