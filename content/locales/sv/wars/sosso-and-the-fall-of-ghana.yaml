# Svenska översättningar av katalogtexten (våg 12); stegtexterna kommer senare.
Sosso and the fall of Ghana: Sosso och Ghanas fall
? The end of the old kingdom of Ghana (Wagadu) and the rise of the Sosso kingdom, which ruled much of the western Sahel from about 1200 until its defeat by Sunjata Keita of Mali in about 1235. After the Almoravid wars of the 1050s–1070s (told in “The Almoravids and Ghana”), Ghana survived as a smaller kingdom; al-Idrisi, writing in 1154, still described it as rich, with a Muslim king. Soninke traditions tell of civil wars among the rulers of Wagadu and of rivalry between the provinces of Kaniaga and Diara. Out of this came the Sosso kingdom of Kaniaga, led by a Kante dynasty of smiths. Its best-known king, Sumaoro (Sumanguru) Kante, is said to have conquered the Soninke lands of Ghana, Diara, the gold country of Bure and the Mande chiefdoms to the south, which tradition says he “broke” nine times; a date of about 1203 is often given for his conquest of Ghana, but it is a modern reconstruction. Traditions remember him as a powerful sorcerer king, hostile to Islam and harsh to his subjects, and say that Muslim merchants left Ghana’s capital for Walata and Djenné; Kante smith lineages tell a kinder story. Ibn Khaldun, writing in the 1390s from informants, says only that the Susu overpowered the people of Ghana and were later subdued by Mari Jata (Sunjata) of Mali. The war that ended Sosso is told in “Battle of Kirina”.
: Slutet för det gamla kungariket Ghana (Wagadu) och uppkomsten av Sossoriket, som härskade över stora delar av västra Sahel från omkring 1200 tills det besegrades av Sunjata Keita av Mali omkring 1235. Efter almoravidkrigen på 1050- till 1070-talen (skildrade i ”Almoraviderna och Ghana”) levde Ghana vidare som ett mindre kungarike; al-Idrisi, som skrev 1154, beskrev det fortfarande som rikt och med en muslimsk kung. Soninketraditioner berättar om inbördeskrig mellan Wagadus härskare och om rivalitet mellan provinserna Kaniaga och Diara. Ur detta växte Sossoriket i Kaniaga fram, lett av en dynasti av smeder ur Kanteätten. Dess mest kände kung, Sumaoro (Sumanguru) Kante, sägs ha erövrat soninkernas länder i Ghana, Diara, guldlandet Bure och mandehövdingadömena i söder, som han enligt traditionen ”krossade” nio gånger; årtalet omkring 1203 anges ofta för hans erövring av Ghana, men det är en modern rekonstruktion. Traditionerna minns honom som en mäktig trollkarlskung, fientlig mot islam och hård mot sina undersåtar, och berättar att muslimska köpmän lämnade Ghanas huvudstad för Walata och Djenné; smedsläkterna av Kanteätten berättar en mildare historia. Ibn Khaldun, som på 1390-talet skrev på grundval av uppgifter från sagesmän, säger bara att susufolket övermannade Ghanas folk och senare underkuvades av Mari Jata (Sunjata) av Mali. Det krig som gjorde slut på Sosso skildras i ”Slaget vid Kirina”.
