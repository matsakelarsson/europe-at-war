# Svenska översättningar av katalogtexten (våg 13); stegtexterna kommer senare.
South African Border War: Sydafrikanska gränskriget
? The war for South West Africa (Namibia), fought between South Africa and the South West Africa People’s Organisation (SWAPO) and its army, the People’s Liberation Army of Namibia (PLAN), and from 1975 also in southern Angola against the Angolan army (FAPLA) and its Cuban allies. South Africa had ruled the former German colony under a League of Nations mandate since 1920 and extended apartheid to it; the United Nations ended the mandate in 1966. The war began on 26 August 1966 with a South African attack on a PLAN camp at Omugulugwombashe. After Angola’s independence in 1975 PLAN fought from bases in southern Angola, and the war centred on Ovamboland, along the border. South Africa built up a large army there, with the police unit Koevoet and the South West Africa Territorial Force, raided deep into Angola, as at Cassinga in 1978, occupied part of Cunene province in 1981–1985 and backed Jonas Savimbi’s UNITA. In 1987–1988 South African troops defeated an Angolan offensive at the Lomba river but failed to take Cuito Cuanavale, and a Cuban advance towards the Namibian border followed. The New York Accords of 22 December 1988 linked South Africa’s withdrawal from Namibia to the departure of the Cubans from Angola. Under UN supervision Namibia held elections in November 1989, which SWAPO won, and became independent on 21 March 1990. Some 2,000–2,500 South African soldiers, about 11,000 PLAN fighters, Cubans, Angolans and about 1,000 Namibian civilians were killed.
: Kriget om Sydvästafrika (Namibia), som utkämpades mellan Sydafrika och South West Africa People’s Organisation (SWAPO) och dess armé, People’s Liberation Army of Namibia (PLAN), och från 1975 även i södra Angola mot den angolanska armén (FAPLA) och dess kubanska bundsförvanter. Sydafrika hade styrt den tidigare tyska kolonin som mandat under Nationernas förbund sedan 1920 och utsträckt apartheid dit; FN avslutade mandatet 1966. Kriget började den 26 augusti 1966 med ett sydafrikanskt anfall mot ett PLAN-läger vid Omugulugwombashe. Efter Angolas självständighet 1975 stred PLAN från baser i södra Angola, och kriget koncentrerades till Ovamboland längs gränsen. Sydafrika byggde upp en stor armé där, med polisenheten Koevoet och South West Africa Territorial Force, gjorde räder djupt in i Angola, som vid Cassinga 1978, ockuperade en del av provinsen Cunene 1981–1985 och stödde Jonas Savimbis Unita. 1987–1988 besegrade sydafrikanska trupper en angolansk offensiv vid floden Lomba men misslyckades med att inta Cuito Cuanavale, och därefter följde en kubansk framryckning mot den namibiska gränsen. New York-avtalen den 22 december 1988 kopplade Sydafrikas tillbakadragande från Namibia till kubanernas avfärd från Angola. Under FN:s övervakning höll Namibia val i november 1989, som SWAPO vann, och blev självständigt den 21 mars 1990. Omkring 2 000–2 500 sydafrikanska soldater, omkring 11 000 PLAN-krigare, kubaner, angolaner och omkring 1 000 namibiska civila dödades.
