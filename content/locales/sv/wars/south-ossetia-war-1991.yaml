South Ossetia War: Sydossetienkriget
After South Ossetia declared itself a Soviet republic separate from Georgia, the Georgian parliament under Zviad Gamsakhurdia abolished the region’s autonomy on 11 December 1990. On the night of 5–6 January 1991 Georgian police and National Guard units entered Tskhinvali, and fighting with South Ossetian militias, helped by volunteers from North Ossetia, went on around the town and in the villages for a year and a half, with Tskhinvali besieged and shelled. About 1,000 people were killed. More than 40,000 Ossetians fled, most of them to North Ossetia in Russia, and about 23,000 Georgians left South Ossetia. The Sochi (Dagomys) Agreement signed by Boris Yeltsin and Eduard Shevardnadze on 24 June 1992 ended the fighting and set up joint Russian, Georgian and Ossetian peacekeeping forces, leaving most of South Ossetia under separatist control.: Sedan Sydossetien utropat sig till en sovjetrepublik skild från Georgien avskaffade det georgiska parlamentet under Zviad Gamsachurdia regionens autonomi den 11 december 1990. Natten mellan den 5 och 6 januari 1991 ryckte georgisk polis och nationalgardesförband in i Tschinvali, och striderna mot sydossetiska miliser, med hjälp av frivilliga från Nordossetien, pågick kring staden och i byarna i ett och ett halvt år, medan Tschinvali belägrades och besköts. Omkring 1 000 människor dödades. Mer än 40 000 osseter flydde, de flesta till Nordossetien i Ryssland, och omkring 23 000 georgier lämnade Sydossetien. Sotjiavtalet (Dagomysavtalet), som undertecknades av Boris Jeltsin och Eduard Sjevardnadze den 24 juni 1992, avslutade striderna och inrättade gemensamma ryska, georgiska och ossetiska fredsbevarande styrkor, medan större delen av Sydossetien förblev under separatisternas kontroll.
