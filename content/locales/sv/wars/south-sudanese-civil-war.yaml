# Svenska översättningar av katalogtexten (våg 12); stegtexterna kommer senare.
South Sudanese Civil War: Sydsudanesiska inbördeskriget
? "The civil war in South Sudan, two and a half years after its independence, between the government of President Salva Kiir and the SPLM/A-in-Opposition of his former vice-president Riek Machar. A power struggle in the ruling SPLM turned into fighting within the presidential guard in Juba on 15 December 2013, followed by the killing of hundreds of Nuer civilians in the capital. The army split largely along ethnic lines, with many Nuer units and the armed Nuer cattle-camp youth of the White Army joining Machar, while Kiir, a Dinka, was backed by Ugandan troops. Bor, Bentiu and Malakal changed hands several times in 2014, and both sides massacred civilians of the other’s community. A peace agreement in August 2015 collapsed when fighting broke out in Juba in July 2016; Machar fled on foot to Congo, and the war spread to the Equatoria region in the south. Famine was declared in parts of Unity State in February 2017. The Revitalised Agreement of September 2018 ended most of the fighting, and Kiir and Machar formed a unity government on 22 February 2020. A study estimated about 383,000 excess deaths by April 2018, half of them from violence, and some 4 million people were driven from their homes. In 2025 the peace broke down again: Machar was arrested and put on trial for treason, and fighting resumed in Upper Nile and Jonglei."
: "Inbördeskriget i Sydsudan, som bröt ut två och ett halvt år efter landets självständighet, mellan president Salva Kiirs regering och hans tidigare vicepresident Riek Machars SPLM/A-in-Opposition. En maktkamp inom det styrande SPLM övergick i strider inom presidentgardet i Juba den 15 december 2013, följda av dödandet av hundratals civila nuer i huvudstaden. Armén splittrades till stor del längs etniska linjer: många nuerförband och de beväpnade ungdomarna från nuerfolkets boskapsläger i Vita armén anslöt sig till Machar, medan Kiir, som är dinka, fick stöd av ugandiska trupper. Bor, Bentiu och Malakal bytte ägare flera gånger 2014, och båda sidor massakrerade civila ur den andra sidans folkgrupp. Ett fredsavtal i augusti 2015 bröt samman när strider utbröt i Juba i juli 2016; Machar flydde till fots till Kongo, och kriget spred sig till regionen Ekvatoria i söder. Hungersnöd utlystes i delar av delstaten Unity i februari 2017. Det revitaliserade avtalet i september 2018 gjorde slut på de flesta striderna, och Kiir och Machar bildade en samlingsregering den 22 februari 2020. En studie uppskattade antalet extra dödsfall fram till april 2018 till omkring 383 000, varav hälften orsakades av våld, och omkring 4 miljoner människor drevs från sina hem. År 2025 bröt freden samman igen: Machar greps och ställdes inför rätta för förräderi, och striderna återupptogs i Upper Nile och Jonglei."
