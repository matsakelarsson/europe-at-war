South Thailand insurgency: Upprorsrörelsen i södra Thailand
The armed struggle of Malay Muslim separatists in Thailand’s Deep South, the provinces of Pattani, Yala and Narathiwat and four districts of Songkhla, the lands of the old sultanate of Patani, which Siam conquered in 1785 and annexed outright in 1902. Separatist movements had fought the Thai state from the 1960s to the 1990s; the present conflict began with a raid on an army depot in Narathiwat on 4 January 2004 and grew through the killings at the Krue Se mosque and at Tak Bai that year. A secretive network led by the Barisan Revolusi Nasional (BRN) has waged a campaign of shootings and bombings against soldiers, police, officials, teachers and Buddhist and Muslim civilians, while the security forces have ruled the region under martial law and an emergency decree, with arrests, disappearances and torture documented by human rights groups. Talks facilitated by Malaysia since 2013 have not ended the violence. More than 7,000 people have been killed since 2004.: Den väpnade kamp som malajiska muslimska separatister för i Thailands djupa söder – provinserna Pattani, Yala och Narathiwat och fyra distrikt i Songkhla – det gamla sultanatet Patanis landområden, som Siam erövrade 1785 och annekterade helt 1902. Separatiströrelser hade bekämpat den thailändska staten från 1960-talet till 1990-talet; den nuvarande konflikten började med en räd mot ett arméförråd i Narathiwat den 4 januari 2004 och växte genom dödandet vid Krue Se-moskén och i Tak Bai samma år. Ett hemlighetsfullt nätverk lett av Barisan Revolusi Nasional (BRN) har fört en kampanj av skjutningar och bombdåd mot soldater, poliser, tjänstemän, lärare och buddhistiska och muslimska civila, medan säkerhetsstyrkorna har styrt regionen under krigslagar och ett undantagsdekret, med gripanden, försvinnanden och tortyr som har dokumenterats av människorättsorganisationer. Samtal som Malaysia har underlättat sedan 2013 har inte gjort slut på våldet. Över 7 000 människor har dödats sedan 2004.
