# Svenska översättningar av katalogtexten (våg 13); stegtexterna kommer senare.
South West Africa campaign: Fälttåget i Sydvästafrika
The First World War campaign in which the Union of South Africa conquered German South West Africa (Namibia) for the British Empire. At Britain’s request to seize the colony’s ports and wireless stations, Prime Minister Louis Botha’s government sent troops in September 1914. The invasion was delayed by a defeat at Sandfontein and by an armed rising of Afrikaners who refused to fight Germany for Britain, the Maritz Rebellion, which Botha had largely crushed by the end of 1914. In 1915 Botha advanced inland from Swakopmund and Jan Smuts from the south, taking Windhoek in May. Outnumbered many times over, the German forces under Governor Theodor Seitz and Colonel Victor Franke surrendered at Khorab on 9 July 1915. On the colony’s northern border German troops had also fought the Portuguese in Angola, defeating them at Naulila in December 1914. South Africa ruled the territory under military law until 1920, and then as a League of Nations mandate.: Det fälttåg under första världskriget där Sydafrikanska unionen erövrade Tyska Sydvästafrika (Namibia) åt Brittiska imperiet. Sedan Storbritannien begärt att unionen skulle ta kolonins hamnar och radiostationer, sände premiärminister Louis Bothas regering trupper i september 1914. Invasionen försenades av ett nederlag vid Sandfontein och av en väpnad resning bland afrikander som vägrade strida mot Tyskland för Storbritanniens räkning, Maritzupproret, som Botha i stort sett hade slagit ned vid slutet av 1914. 1915 ryckte Botha fram inåt landet från Swakopmund och Jan Smuts från söder, och Windhoek intogs i maj. De tyska styrkorna under guvernör Theodor Seitz och överste Victor Franke, som var många gånger underlägsna i antal, kapitulerade vid Khorab den 9 juli 1915. Vid kolonins norra gräns hade tyska trupper också stridit mot portugiserna i Angola och besegrat dem vid Naulila i december 1914. Sydafrika styrde territoriet under militärstyre till 1920 och därefter som mandat under Nationernas förbund.
