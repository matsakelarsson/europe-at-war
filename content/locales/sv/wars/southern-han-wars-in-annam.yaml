# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
Southern Han invasions of Tĩnh Hải and the battle of Bạch Đằng: Södra Hans invasioner av Tĩnh Hải och slaget vid Bạch Đằng
Two attempts by the Southern Han, the kingdom founded at Guangzhou in 917, to take the old Tang circuit of Tĩnh Hải (Jinghai), the Red River plain of today’s northern Vietnam, which local governors of the Khúc family had ruled since about 905. In 930 a Southern Han army took Đại La (Hanoi) and carried off the governor Khúc Thừa Mỹ, but in 931 Dương Đình Nghệ, a Khúc general from Ái Châu (Thanh Hóa), drove out the garrison and killed the relief commander. When Dương Đình Nghệ was murdered in 937 by his officer Kiều Công Tiễn, his son-in-law Ngô Quyền marched north to avenge him, and Kiều Công Tiễn called in the Southern Han. Ngô Quyền killed him before help arrived, then trapped the Southern Han fleet of Liu Hongcao on iron-tipped stakes in the estuary of the Bạch Đằng in late 938; the prince and about half his men died. In 939 Ngô Quyền proclaimed himself king at Cổ Loa. Vietnamese history counts the battle as the end of a thousand years of Chinese rule.: Två försök av Södra Han, riket som grundades i Guangzhou 917, att ta den gamla Tangkretsen Tĩnh Hải (Jinghai), Röda flodens slätt i dagens norra Vietnam, som lokala guvernörer av släkten Khúc hade styrt sedan omkring 905. År 930 intog en armé från Södra Han Đại La (Hanoi) och förde bort guvernören Khúc Thừa Mỹ, men 931 drev Dương Đình Nghệ, en general i släkten Khúcs tjänst från Ái Châu (Thanh Hóa), ut garnisonen och dödade befälhavaren för undsättningshären. När Dương Đình Nghệ 937 mördades av sin officer Kiều Công Tiễn tågade hans svärson Ngô Quyền norrut för att hämnas honom, och Kiều Công Tiễn kallade in Södra Han. Ngô Quyền dödade honom innan hjälpen hann fram och lockade sedan i slutet av 938 Södra Hans flotta under Liu Hongcao i en fälla av järnskodda pålar i mynningen av floden Bạch Đằng; prinsen och omkring hälften av hans män omkom. År 939 utropade sig Ngô Quyền till kung i Cổ Loa. I vietnamesisk historieskrivning räknas slaget som slutet på tusen år av kinesiskt styre.
