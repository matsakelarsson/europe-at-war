# Svenska översättningar av katalogtexten (våg 7); stegtexterna kommer senare.
Soviet–Afghan War: Sovjetisk-afghanska kriget
The war in which the Soviet Union sent its army into Afghanistan to prop up the communist government of the People’s Democratic Party of Afghanistan (PDPA), which had seized power in April 1978 and faced revolts across the country. Soviet troops crossed the border on 24–25 December 1979, killed the party leader Hafizullah Amin and installed Babrak Karmal. For nine years some 100,000 Soviet soldiers and the Afghan army fought the mujahideen, Islamist and tribal guerrillas armed through Pakistan with money from the United States, Saudi Arabia and others. The Soviet forces held the cities and roads but could not end the insurgency, and much of the countryside was bombed and emptied. Under Mikhail Gorbachev the Soviet Union signed the Geneva Accords in April 1988 and withdrew its last troops on 15 February 1989. Between about half a million and two million Afghans died, more than five million fled abroad, and about 15,000 Soviet soldiers were killed.: Kriget där Sovjetunionen sände in sin armé i Afghanistan för att stötta den kommunistiska regeringen under Afghanistans demokratiska folkparti (PDPA), som hade gripit makten i april 1978 och mötte uppror över hela landet. Sovjetiska trupper gick över gränsen den 24–25 december 1979, dödade partiledaren Hafizullah Amin och insatte Babrak Karmal. I nio år stred omkring 100 000 sovjetiska soldater och den afghanska armén mot mujahedin, islamistiska och stambaserade gerillagrupper som beväpnades via Pakistan med pengar från USA, Saudiarabien och andra. De sovjetiska styrkorna höll städerna och vägarna men kunde inte göra slut på upproret, och stora delar av landsbygden bombades och avfolkades. Under Michail Gorbatjov undertecknade Sovjetunionen Genèveavtalen i april 1988 och drog tillbaka sina sista trupper den 15 februari 1989. Mellan omkring en halv miljon och två miljoner afghaner dog, mer än fem miljoner flydde utomlands, och omkring 15 000 sovjetiska soldater dödades.
