# Svenska översättningar av katalogtexten (våg 10); stegtexterna kommer senare.
Soviet campaign in northern Korea: Det sovjetiska fälttåget i norra Korea
? The part of the Soviet war against Japan fought in Korea in August 1945. From 9 August, the day after the Soviet declaration of war, aircraft and torpedo boats of the Pacific Fleet attacked the ports of Unggi (Yuki), Najin (Rashin) and Chongjin (Seishin) in the north-east of Japanese-ruled Korea, while Colonel General Ivan Chistyakov’s 25th Army crossed the Tumen from Primorye. With small marine landings the Soviets took Unggi on 11–12 August and Najin on 12 August. At Chongjin a few hundred marines landed on 13 August and fought for three days against a larger Japanese garrison reinforced by retreating troops until more Soviet forces arrived on 16 August; about 227 Japanese and 230–300 Soviet soldiers were killed or went missing. Japan announced its surrender on 15 August, but fighting in the north-east lasted until about 18 August. Soviet marines landed at Wonsan on 21 August and airborne detachments flew into Hamhung and Pyongyang on 24 August, where the Japanese garrisons laid down their arms; Chistyakov reached Pyongyang on 26 August. On 16 August Stalin had accepted the American proposal, made in General Order No. 1, to divide the occupation of Korea at the 38th parallel, and Soviet troops halted there; American troops landed at Incheon on 8 September. The Soviet Civil Administration set up by the 25th Army governed the North until 1948 and brought Kim Il-sung, who arrived at Wonsan in September, to power. Koreans in the South mark 15 August as Gwangbokjeol, the day of the “restoration of light”, and in the North as the day of liberation (haebang); Soviet troops are remembered there as liberators, while Japanese and many Korean accounts also record looting and rape by Soviet soldiers and the flight of Japanese civilians southwards.
: Den del av Sovjetunionens krig mot Japan som utkämpades i Korea i augusti 1945. Från den 9 augusti, dagen efter den sovjetiska krigsförklaringen, angrep flygplan och torpedbåtar ur Stillahavsflottan hamnarna Unggi (Yuki), Najin (Rashin) och Chongjin (Seishin) i nordöstra delen av det japanstyrda Korea, medan generalöverste Ivan Tjistjakovs 25:e armé gick över Tumen från Primorje. Med små landstigningar av marininfanteri tog sovjeterna Unggi den 11–12 augusti och Najin den 12 augusti. Vid Chongjin landsteg några hundra marininfanterister den 13 augusti och stred i tre dagar mot en större japansk garnison, förstärkt av retirerande trupper, tills fler sovjetiska styrkor anlände den 16 augusti; omkring 227 japanska och 230–300 sovjetiska soldater dödades eller försvann. Japan tillkännagav sin kapitulation den 15 augusti, men striderna i nordost varade till omkring den 18 augusti. Sovjetiskt marininfanteri landsteg i Wonsan den 21 augusti och luftburna förband flög in till Hamhung och Pyongyang den 24 augusti, där de japanska garnisonerna lade ned vapnen; Tjistjakov nådde Pyongyang den 26 augusti. Den 16 augusti hade Stalin godtagit det amerikanska förslaget i General Order No. 1 att dela ockupationen av Korea vid 38:e breddgraden, och de sovjetiska trupperna stannade där; amerikanska trupper landsteg i Incheon den 8 september. Den sovjetiska civilförvaltning som 25:e armén upprättade styrde norr till 1948 och förde Kim Il-sung, som anlände till Wonsan i september, till makten. Koreaner i söder firar den 15 augusti som Gwangbokjeol, dagen då ”ljuset återställdes”, och i norr som befrielsedagen (haebang); där minns man de sovjetiska trupperna som befriare, medan japanska och många koreanska skildringar också vittnar om plundring och våldtäkter begångna av sovjetiska soldater och om japanska civilas flykt söderut.
