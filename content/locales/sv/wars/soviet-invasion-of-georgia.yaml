Soviet Russia had recognised Georgia’s independence in the Treaty of Moscow of 7 May 1920.: Sovjetryssland hade erkänt Georgiens självständighet i fördraget i Moskva den 7 maj 1920.
The 11th Red Army had entered Baku on 28 April 1920, ending the Azerbaijan Democratic Republic, and entered Armenia at the end of November 1920; the Armenian government handed power to the Bolsheviks on 2 December.: 11:e röda armén hade ryckt in i Baku den 28 april 1920, vilket gjorde slut på Demokratiska republiken Azerbajdzjan, och ryckte in i Armenien i slutet av november 1920; den armeniska regeringen överlämnade makten till bolsjevikerna den 2 december.
