Soviet invasion of Georgia: Sovjetiska invasionen av Georgien
The Red Army’s conquest of the Democratic Republic of Georgia in February–March 1921, the last step in the Soviet takeover of the Caucasus after the occupation of Azerbaijan in April 1920 and of Armenia in late 1920. Soviet troops took Tbilisi on 25 February, and by mid-March the Georgian government had gone into exile from Batumi, which Turkish troops had briefly entered and which the Soviet–Turkish Treaty of Moscow of 16 March 1921 left to Soviet Georgia.: Röda arméns erövring av Demokratiska republiken Georgien i februari–mars 1921, det sista steget i det sovjetiska maktövertagandet i Kaukasus efter ockupationen av Azerbajdzjan i april 1920 och av Armenien i slutet av 1920. Sovjetiska trupper intog Tbilisi den 25 februari, och i mitten av mars hade den georgiska regeringen gått i exil från Batumi, som turkiska trupper en kort tid hade ryckt in i och som det sovjetisk-turkiska fördraget i Moskva den 16 mars 1921 tillerkände Sovjetgeorgien.
