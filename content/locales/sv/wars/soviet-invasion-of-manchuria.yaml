# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
Soviet invasion of Manchuria: Sovjetunionens invasion av Manchuriet
? "The Soviet Union’s attack on Japan’s Kwantung Army and the client states of Manchukuo and Mengjiang in August 1945, the last great campaign of the Second World War. Stalin had promised at Yalta to enter the war against Japan within three months of Germany’s defeat, in return for South Sakhalin, the Kurils and Japan’s rights in Manchuria. The Soviet Union declared war on 8 August, between the atomic bombings of Hiroshima and Nagasaki, and at midnight some 1.5 million Soviet troops with Mongolian allies attacked from three sides: across the Gobi and the Greater Khingan from Mongolia, through the fortified border at Mudanjiang from the east, and over the Amur and up the Sungari from the north. The Kwantung Army, stripped of its best units, was broken within a week. After Emperor Hirohito’s surrender broadcast of 15 August most Japanese units laid down their arms, Soviet airborne troops seized the cities, and the Manchukuo emperor Puyi was captured at Mukden. About 600,000 Japanese were taken to labour camps in the Soviet Union. The Soviet army stayed until May 1946 and stripped Manchuria’s industry; on leaving, it let much of the countryside and the captured Japanese arms pass to the Chinese Communists, while the Nationalists took over the southern cities."
: "Sovjetunionens angrepp på Japans Kwantungarmé och lydstaterna Manchukuo och Mengjiang i augusti 1945, andra världskrigets sista stora fälttåg. Stalin hade i Jalta lovat att gå in i kriget mot Japan inom tre månader efter Tysklands nederlag, i utbyte mot södra Sachalin, Kurilerna och Japans rättigheter i Manchuriet. Sovjetunionen förklarade krig den 8 augusti, mellan atombombningarna av Hiroshima och Nagasaki, och vid midnatt anföll omkring 1,5 miljoner sovjetiska soldater med mongoliska bundsförvanter från tre håll: över Gobiöknen och Stora Khingan från Mongoliet, genom den befästa gränsen vid Mudanjiang från öster och över Amur och uppför Sungari från norr. Kwantungarmén, som hade berövats sina bästa förband, krossades inom en vecka. Efter kejsar Hirohitos kapitulationstal i radio den 15 augusti lade de flesta japanska förband ned vapnen, sovjetiska luftlandsättningstrupper tog städerna, och Manchukuos kejsare Puyi tillfångatogs i Mukden. Omkring 600 000 japaner fördes till arbetsläger i Sovjetunionen. Den sovjetiska armén stannade till maj 1946 och tömde Manchuriets industri; när den drog sig tillbaka lät den stora delar av landsbygden och de erövrade japanska vapnen gå över till de kinesiska kommunisterna, medan nationalisterna tog över städerna i söder."
