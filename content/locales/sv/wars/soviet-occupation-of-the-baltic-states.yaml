Soviet occupation of the Baltic states: Sovjetiska ockupationen av de baltiska staterna
The occupation and annexation of Estonia, Latvia and Lithuania by the Soviet Union in the summer of 1940, under the secret protocols of the Molotov–Ribbentrop Pact. After Soviet ultimatums in mid-June the Red Army marched in unopposed, staged elections in July were followed by annexation on 3–6 August, and on 14 June 1941 about 40,000 people were deported from the three countries to Siberia and Kazakhstan.: Sovjetunionens ockupation och annektering av Estland, Lettland och Litauen sommaren 1940, enligt de hemliga protokollen i Molotov–Ribbentroppakten. Efter sovjetiska ultimatum i mitten av juni marscherade Röda armén in utan motstånd, iscensatta val i juli följdes av annektering den 3–6 augusti, och den 14 juni 1941 deporterades omkring 40 000 människor från de tre länderna till Sibirien och Kazakstan.
