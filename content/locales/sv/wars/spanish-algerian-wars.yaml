# Svenska översättningar av katalogtexten (våg 12); stegtexterna kommer senare.
Spain against Algiers: Spanien mot Alger
"Spain’s long struggle with the Regency of Algiers over Oran and Mers el-Kébir, its last fortresses on the Algerian coast, and over the corsair war at sea. During the War of the Spanish Succession the bey of the west, Mustapha Bouchelaghem, took Oran in January 1708 and Mers el-Kébir in April. In 1732 a Spanish armada of some 25,000 men under the Count (later Duke) of Montemar landed near Mers el-Kébir and recovered both, and for the next sixty years the Spanish garrison lived under constant blockade. Charles III tried to strike at Algiers itself: Alejandro O’Reilly’s landing of about 20,000 men in July 1775 was routed on the beaches, and Antonio Barceló’s fleets bombarded the city in 1783 and 1784 without forcing it to terms. Spain made peace with Algiers in 1786. After an earthquake ruined Oran in October 1790 and Bey Mohammed el-Kebir besieged it, Spain agreed to give up Oran and Mers el-Kébir, and handed them over in early 1792.": "Spaniens långa kamp mot regentskapet Alger om Oran och Mers el-Kébir, de sista spanska fästningarna på den algeriska kusten, och korsarkriget till sjöss. Under spanska tronföljdskriget intog bejen i väster, Mustapha Bouchelaghem, Oran i januari 1708 och Mers el-Kébir i april. År 1732 landsteg en spansk armada med omkring 25 000 man under greven (senare hertigen) av Montemar nära Mers el-Kébir och återtog båda, och under de följande sextio åren levde den spanska garnisonen under ständig blockad. Karl III försökte slå till mot själva Alger: Alejandro O’Reillys landstigning med omkring 20 000 man i juli 1775 slogs på flykten på stränderna, och Antonio Barcelós flottor bombarderade staden 1783 och 1784 utan att tvinga den att ge efter. Spanien slöt fred med Alger 1786. Sedan en jordbävning hade ödelagt Oran i oktober 1790 och bejen Mohammed el-Kebir belägrat staden gick Spanien med på att ge upp Oran och Mers el-Kébir och överlämnade dem i början av 1792."
