The fighting took place in the Caribbean and the Pacific, outside the map. Far more soldiers on both sides died of disease than in battle.: Striderna ägde rum i Karibien och Stilla havet, utanför kartan. Betydligt fler soldater på båda sidor dog av sjukdomar än i strid.
