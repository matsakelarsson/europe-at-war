Spanish–American War: Spansk-amerikanska kriget
A war between Spain and the United States that grew out of the Cuban War of Independence and the explosion of the American battleship Maine in Havana harbour in February 1898. American squadrons destroyed the Spanish fleets at Manila Bay on 1 May and off Santiago de Cuba on 3 July, and American troops took Santiago, Puerto Rico and Manila. By the Treaty of Paris of 10 December 1898 Spain gave up Cuba and ceded Puerto Rico, Guam and the Philippines to the United States, for which it was paid $20 million. In Spain the loss of the last major colonies was remembered as “the Disaster” of 1898.: Ett krig mellan Spanien och USA som växte fram ur det kubanska självständighetskriget och explosionen på det amerikanska slagskeppet Maine i Havannas hamn i februari 1898. Amerikanska eskadrar förintade de spanska flottorna i Manilabukten den 1 maj och utanför Santiago de Cuba den 3 juli, och amerikanska trupper intog Santiago, Puerto Rico och Manila. Genom freden i Paris den 10 december 1898 avstod Spanien från Kuba och avträdde Puerto Rico, Guam och Filippinerna till USA, som betalade 20 miljoner dollar. I Spanien kom förlusten av de sista stora kolonierna att minnas som ”katastrofen” 1898.
