Spanish–American War: Spansk-amerikanska kriget
United States: USA
Spain: Spanien
Spanish–American War (Wikipedia): Spansk-amerikanska kriget (Wikipedia)
? The war of 1898 between Spain and the United States, which grew out of the Cuban War of Independence. American sympathy for the Cuban insurgents, outrage at the deaths in Spain’s reconcentration camps, fed by a sensational press, and American investments in Cuba came to a head when the battleship Maine exploded in Havana harbour on 15 February 1898. In April Congress demanded Spain’s withdrawal from Cuba, while renouncing any intention to annex it, and the war began. On 1 May Commodore George Dewey destroyed the Spanish squadron in Manila Bay. In the Caribbean Admiral Pascual Cervera’s squadron took refuge at Santiago de Cuba, and an American army landed nearby in June with the help of Calixto García’s Cuban insurgents, took the San Juan Heights and El Caney on 1 July and besieged the city; on 3 July Cervera’s ships were destroyed trying to break out, and Santiago surrendered on 17 July. American troops then landed in Puerto Rico and advanced across the island until the armistice of 12 August; Manila fell the next day. By the Treaty of Paris of 10 December 1898 Spain gave up Cuba and ceded Puerto Rico, Guam and the Philippines to the United States for $20 million. About 2,450 Americans died, most of them of disease, as did most of the roughly 15,700 Spanish dead. The United States became a colonial power in the Caribbean and the Pacific; in Spain the loss of the last great colonies was remembered as “the Disaster”, and in the Philippines the war led straight into the Philippine–American War.
: Kriget 1898 mellan Spanien och USA, som växte fram ur det kubanska självständighetskriget. Amerikansk sympati för de kubanska upprorsmännen, upprördhet över dödsfallen i Spaniens rekoncentrationsläger, underblåst av en sensationslysten press, och amerikanska investeringar på Kuba kulminerade när slagskeppet Maine exploderade i Havannas hamn den 15 februari 1898. I april krävde kongressen att Spanien skulle dra sig tillbaka från Kuba, samtidigt som den avsade sig varje avsikt att annektera ön, och kriget började. Den 1 maj förintade kommendör George Dewey den spanska eskadern i Manilabukten. I Karibien sökte amiral Pascual Cerveras eskader skydd i Santiago de Cuba, och en amerikansk armé landsteg i närheten i juni med hjälp av Calixto Garcías kubanska upprorsmän, intog San Juanhöjderna och El Caney den 1 juli och belägrade staden; den 3 juli förstördes Cerveras fartyg när de försökte bryta sig ut, och Santiago kapitulerade den 17 juli. Amerikanska trupper landsteg sedan på Puerto Rico och ryckte fram över ön fram till vapenstilleståndet den 12 augusti; Manila föll dagen därpå. Genom freden i Paris den 10 december 1898 gav Spanien upp Kuba och avträdde Puerto Rico, Guam och Filippinerna till USA för 20 miljoner dollar. Omkring 2 450 amerikaner dog, de flesta av sjukdomar, liksom de flesta av de omkring 15 700 spanska döda. USA blev en kolonialmakt i Karibien och Stilla havet; i Spanien kom förlusten av de sista stora kolonierna att minnas som ”katastrofen”, och i Filippinerna ledde kriget direkt in i filippinsk-amerikanska kriget.
