# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
Spanish attempt to reconquer Mexico: Spaniens försök att återerövra Mexiko
? The expedition with which Ferdinand VII of Spain tried to win back Mexico in 1829, eight years after its independence. Spain had never recognised the Treaty of Córdoba, held the fortress of San Juan de Ulúa off Veracruz until 1825 and kept an army in Cuba; Mexico had expelled many Spanish-born residents in 1827–1829, and Spanish planners hoped that loyalists would rise. Brigadier Isidro Barradas sailed from Havana with about 3,500 soldiers, landed at Cabo Rojo on the Gulf coast at the end of July 1829 and occupied Tampico, but no one rose to join him. Antonio López de Santa Anna, governor of Veracruz, came by sea and land with troops from Veracruz, and Manuel Mier y Terán with forces from the north, and they besieged the Spaniards while yellow fever and dysentery spread through the invading army. After an assault on the fort of La Barra on 10 September, Barradas capitulated on 11 September 1829 at Pueblo Viejo, across the Pánuco River from Tampico, and his troops were shipped back to Cuba. Fever and fighting cost the expedition hundreds of dead. The victory made Santa Anna a national hero, the “hero of Tampico”, and helped bring him to the presidency in 1833. Spain recognised Mexico’s independence in the Santa María–Calatrava Treaty of 28 December 1836.
: Den expedition med vilken Ferdinand VII av Spanien försökte vinna tillbaka Mexiko 1829, åtta år efter landets självständighet. Spanien hade aldrig erkänt fördraget i Córdoba, hade behållit fästningen San Juan de Ulúa utanför Veracruz till 1825 och höll en armé på Kuba; Mexiko hade utvisat många i Spanien födda invånare 1827–1829, och spanska planerare hoppades att lojalister skulle resa sig. Brigadgeneral Isidro Barradas seglade från Havanna med omkring 3 500 soldater, landsteg vid Cabo Rojo vid kusten mot Mexikanska golfen i slutet av juli 1829 och besatte Tampico, men ingen reste sig för att ansluta sig till honom. Antonio López de Santa Anna, guvernör i Veracruz, kom sjövägen och landvägen med trupper från Veracruz, och Manuel Mier y Terán med styrkor från norr, och de belägrade spanjorerna medan gula febern och dysenteri spred sig i invasionsarmén. Efter ett anfall mot fortet La Barra den 10 september kapitulerade Barradas den 11 september 1829 i Pueblo Viejo, på andra sidan Pánucofloden från Tampico, och hans trupper skeppades tillbaka till Kuba. Feber och strider kostade expeditionen hundratals döda. Segern gjorde Santa Anna till nationalhjälte, ”hjälten från Tampico”, och bidrog till att han blev president 1833. Spanien erkände Mexikos självständighet i Santa María–Calatrava-fördraget den 28 december 1836.
