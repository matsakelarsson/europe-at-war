By early November the Army of Africa stood at the western and southern edge of Madrid. On 6 November the government of Francisco Largo Caballero left for Valencia, leaving General José Miaja in charge of a defence junta, with Vicente Rojo as his chief of staff. The main assault, through the Casa de Campo park and the University City, began on 8 November. Militias and new units of the Republican army, the first International Brigades of foreign volunteers, and Soviet tanks and fighters held the line, and Franco called off the frontal attack on 23 November. Through November and December some 2,000 or more prisoners taken from the city’s jails were killed at Paracuellos de Jarama and Torrejón de Ardoz.: I början av november stod Afrikaarmén vid Madrids västra och södra utkant. Den 6 november lämnade Francisco Largo Caballeros regering staden för Valencia och lämnade general José Miaja att leda en försvarsjunta, med Vicente Rojo som stabschef. Huvudanfallet, genom parken Casa de Campo och universitetsstaden, började den 8 november. Miliser och nya förband ur den republikanska armén, de första internationella brigaderna av utländska frivilliga samt sovjetiska stridsvagnar och jaktplan höll linjen, och Franco avbröt det frontala anfallet den 23 november. Under november och december dödades minst 2 000 fångar, hämtade ur stadens fängelser, vid Paracuellos de Jarama och Torrejón de Ardoz.
The Nationalists then tried to cut Madrid off. They gained ground on the Corunna road to the north-west in January 1937, and in February crossed the Jarama south-east of the city, but in three weeks of costly fighting failed to cut the road to Valencia. In March the Italian Corps of Volunteer Troops attacked from the north-east towards Guadalajara and was routed near Brihuega. In the south Nationalist and Italian troops took Málaga on 8 February. Refugees fleeing along the coast road to Almería were bombed from the air and shelled from the sea, and estimates of the dead run up to several thousand.: Nationalisterna försökte sedan skära av Madrid. De vann terräng längs vägen mot La Coruña i nordväst i januari 1937 och gick i februari över Jarama sydost om staden, men misslyckades efter tre veckors kostsamma strider med att skära av vägen till Valencia. I mars anföll den italienska frivilligkåren från nordost mot Guadalajara och slogs på flykten nära Brihuega. I söder intog nationalistiska och italienska trupper Málaga den 8 februari. Flyktingar som flydde längs kustvägen till Almería bombades från luften och beskjöts från havet, och uppskattningarna av antalet döda uppgår till flera tusen.
