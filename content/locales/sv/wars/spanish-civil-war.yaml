On 23 December 1938 the Nationalists attacked Catalonia with overwhelming artillery and air power. The worn-out Republican army could not hold, Tarragona fell on 15 January 1939 and Barcelona on 26 January, almost without a fight. Hundreds of thousands of soldiers and civilians fled north through snow and air raids to the French border, which France opened to civilians on 28 January and to soldiers on 5 February. Nearly 500,000 people crossed in what Spaniards call La Retirada (the retreat), and many were held behind barbed wire in camps on the beaches of Roussillon. Nationalist troops reached the border on 10 February.: Den 23 december 1938 anföll nationalisterna Katalonien med överväldigande artilleri och flyg. Den utslitna republikanska armén kunde inte hålla stånd, Tarragona föll den 15 januari 1939 och Barcelona den 26 januari, nästan utan strid. Hundratusentals soldater och civila flydde norrut genom snö och flyganfall till den franska gränsen, som Frankrike öppnade för civila den 28 januari och för soldater den 5 februari. Nästan 500 000 människor tog sig över i det som spanjorerna kallar La Retirada (reträtten), och många hölls bakom taggtråd i läger på stränderna i Roussillon. Nationalistiska trupper nådde gränsen den 10 februari.
The Republic still held Madrid, Valencia and the south-east, but Britain and France recognised Franco’s government on 27 February and President Manuel Azaña resigned. On 5 March Colonel Segismundo Casado, commanding the Army of the Centre, rose against Negrín’s government, which he accused of serving the communists, and set up a National Defence Council to negotiate peace, setting off a week of fighting in Madrid. Franco would accept only unconditional surrender. His troops entered Madrid on 28 March, and on 1 April he declared the war over. The victors executed many thousands of Republicans and held hundreds of thousands in camps and prisons.: Republiken höll fortfarande Madrid, Valencia och sydöstra Spanien, men Storbritannien och Frankrike erkände Francos regering den 27 februari och president Manuel Azaña avgick. Den 5 mars reste sig överste Segismundo Casado, befälhavare för Centrumarmén, mot Negríns regering, som han anklagade för att gå kommunisternas ärenden, och inrättade ett nationellt försvarsråd för att förhandla om fred, vilket utlöste en veckas strider i Madrid. Franco godtog bara villkorslös kapitulation. Hans trupper tågade in i Madrid den 28 mars, och den 1 april förklarade han kriget avslutat. Segrarna avrättade många tusen republikaner och höll hundratusentals i läger och fängelser.
