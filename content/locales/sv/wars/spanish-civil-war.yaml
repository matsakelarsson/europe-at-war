Spain had been a republic since 1931. After the Popular Front, an alliance of the left, won the elections of February 1936, strikes, land seizures and killings by militants of left and right deepened the divide, and a group of generals led by Emilio Mola in Pamplona planned a coup. On 13 July Assault Guards and socialist gunmen murdered the monarchist leader José Calvo Sotelo. The rising began in Spanish Morocco on 17 July and spread to garrisons across the mainland over the next two days. Francisco Franco, the commander in the Canary Islands, flew to Tetuán to lead the Army of Africa, Spain’s best troops.: Spanien hade varit republik sedan 1931. Sedan Folkfronten, en vänsterallians, vunnit valet i februari 1936 fördjupade strejker, jordockupationer och mord begångna av militanta till vänster och höger klyftan, och en grupp generaler under ledning av Emilio Mola i Pamplona planerade en statskupp. Den 13 juli mördade stormgardister och socialistiska beväpnade män monarkistledaren José Calvo Sotelo. Resningen började i Spanska Marocko den 17 juli och spred sig under de följande två dagarna till garnisoner över hela fastlandet. Francisco Franco, befälhavare på Kanarieöarna, flög till Tetuán för att leda Afrikaarmén, Spaniens bästa trupper.
The coup took Seville, Zaragoza and most of Old Castile, León, Galicia and Navarre, but it failed in Madrid, Barcelona, Valencia, Asturias and the Basque coast, where the government armed the workers’ parties and trade unions. Most of the navy’s crews turned on their officers, leaving the Army of Africa stranded in Morocco, and Mola’s columns were stopped in the passes of the Guadarrama north of Madrid. Behind the lines both sides began to kill their enemies. The rebels shot trade unionists, left-wing politicians and officials, and in the Republican zone militias murdered priests, landowners and suspected right-wingers.: Kuppen tog Sevilla, Zaragoza och större delen av Gamla Kastilien, León, Galicien och Navarra, men misslyckades i Madrid, Barcelona, Valencia, Asturien och den baskiska kusten, där regeringen beväpnade arbetarpartierna och fackföreningarna. De flesta av flottans besättningar vände sig mot sina officerare, vilket lämnade Afrikaarmén strandsatt i Marocko, och Molas kolonner hejdades i Guadarramas pass norr om Madrid. Bakom linjerna började båda sidor döda sina fiender. Rebellerna sköt fackföreningsmedlemmar, vänsterpolitiker och tjänstemän, och i den republikanska zonen mördade miliser präster, godsägare och misstänkta högeranhängare.
