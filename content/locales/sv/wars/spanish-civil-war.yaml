The Republicans were also called loyalists, and their enemies called them “Reds”; the Nationalists (nacionales) were also called rebels or insurgents. The base map shows Spain undivided, under the Republic, which Britain and France recognised until 27 February 1939; the areas held by each side are drawn in the steps, approximately, from general accounts.: Republikanerna kallades också lojalister, och deras fiender kallade dem ”röda”; nationalisterna (nacionales) kallades också rebeller eller upprorsmän. Baskartan visar Spanien odelat, under republiken, som Storbritannien och Frankrike erkände fram till den 27 februari 1939; de områden som respektive sida höll ritas i stegen, ungefärligt, utifrån allmänna framställningar.
Places in Catalonia and the Basque Country are named in their present official forms, such as Lleida (Lérida), Girona (Gerona) and Vinaròs (Vinaroz); Guernica is Gernika in Basque.: Orter i Katalonien och Baskien anges med sina nuvarande officiella namnformer, till exempel Lleida (Lérida), Girona (Gerona) och Vinaròs (Vinaroz); Guernica heter Gernika på baskiska.
Italy sent some 70,000–75,000 troops in all, as the Corps of Volunteer Troops (CTV), and Germany some 16,000, many of them in the Condor Legion’s air units. The Soviet Union sold the Republic aircraft, tanks and arms and sent a few thousand advisers, pilots and tank crews, and about 35,000 foreign volunteers served in the International Brigades.: Italien sände sammanlagt omkring 70 000–75 000 soldater, som Corpo Truppe Volontarie (CTV), och Tyskland omkring 16 000, många av dem i Condorlegionens flygförband. Sovjetunionen sålde flygplan, stridsvagnar och vapen till republiken och sände några tusen rådgivare, piloter och stridsvagnsbesättningar, och omkring 35 000 utländska frivilliga tjänstgjorde i de internationella brigaderna.
