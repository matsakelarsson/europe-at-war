To forestall a new Nationalist offensive against Madrid, the Republican army attacked the Nationalist salient of Teruel on 15 December 1937, in snow, during the worst Spanish winter in twenty years. Within a week Republican troops were in the town, where Colonel Domingo Rey d’Harcourt’s garrison held out in a few strongpoints. Franco, unwilling to let any provincial capital fall, cancelled his Madrid offensive and sent relief forces under Generals José Enrique Varela and Antonio Aranda. They attacked on 29 December but were halted by blizzards and severe frost, and on 8 January 1938 Rey d’Harcourt surrendered.: För att förekomma en ny nationalistisk offensiv mot Madrid anföll den republikanska armén den nationalistiska utbuktningen vid Teruel den 15 december 1937, i snö, under den värsta spanska vintern på tjugo år. Inom en vecka var republikanska trupper inne i staden, där överste Domingo Rey d’Harcourts garnison höll ut i några starka punkter. Franco, som inte ville låta någon provinshuvudstad falla, avblåste sin Madridoffensiv och sände undsättningsstyrkor under generalerna José Enrique Varela och Antonio Aranda. De anföll den 29 december men hejdades av snöstormar och sträng kyla, och den 8 januari 1938 kapitulerade Rey d’Harcourt.
Teruel was the only provincial capital the Republic took during the war, and it did not keep it long. The Nationalists brought up far more artillery and aircraft, broke the Republican lines on the Alfambra north of the town in early February, and closed in from three sides. On 22 February they retook the ruined town as the last Republican units broke out. Each side lost around 60,000 men killed, wounded, sick or frostbitten, and the battle used up the reserves of the Republican army just before the Nationalists struck in Aragon.: Teruel var den enda provinshuvudstad som republiken intog under kriget, och den behöll den inte länge. Nationalisterna förde fram betydligt mer artilleri och flyg, bröt de republikanska linjerna vid Alfambra norr om staden i början av februari och ryckte närmare från tre håll. Den 22 februari återtog de den ödelagda staden när de sista republikanska förbanden bröt sig ut. Vardera sidan förlorade omkring 60 000 man i döda, sårade, sjuka eller förfrusna, och slaget förbrukade den republikanska arméns reserver strax innan nationalisterna slog till i Aragonien.
