In spring 1937 Franco turned against the Republican north, cut off from the rest of the Republic. Mola’s offensive against the Basque Country began on 31 March, when the town of Durango was bombed. On 26 April aircraft of the German Condor Legion, joined by Italian bombers, destroyed much of Guernica, the historic seat of the Basque assemblies, killing perhaps 200 to 300 people. The Nationalists claimed the retreating Basques had burned the town, but reports by foreign journalists, and Pablo Picasso’s painting, made it known across the world. Mola was killed in an air crash on 3 June, and on 19 June the Nationalists entered Bilbao after breaking through its fortified ring.: Våren 1937 vände sig Franco mot den republikanska norra delen av landet, som var avskuren från resten av republiken. Molas offensiv mot Baskien började den 31 mars, då staden Durango bombades. Den 26 april förstörde flygplan ur den tyska Condorlegionen, tillsammans med italienska bombplan, stora delar av Guernica, det historiska sätet för de baskiska församlingarna, och dödade kanske 200 till 300 människor. Nationalisterna hävdade att de retirerande baskerna hade bränt staden, men rapporter från utländska journalister, och Pablo Picassos målning, gjorde händelsen känd över hela världen. Mola omkom i en flygolycka den 3 juni, och den 19 juni tågade nationalisterna in i Bilbao efter att ha brutit igenom stadens befästa ring.
To relieve the north the Republic attacked at Brunete, west of Madrid, in July and towards Zaragoza in August, but took only a few villages and the ruined town of Belchite, at heavy cost. Santander fell on 26 August; many Basque troops surrendered to the Italians at Santoña on terms that the Nationalists did not honour. Asturias held out until 21 October, when Gijón fell. With the northern coast, its coal and iron mines and its heavy industry, Franco had the stronger economy and could move his whole army south and east. Some of the defeated took to the mountains as guerrillas.: För att avlasta norr anföll republiken vid Brunete väster om Madrid i juli och mot Zaragoza i augusti, men intog bara några byar och den ödelagda staden Belchite, till ett högt pris. Santander föll den 26 augusti; många baskiska soldater kapitulerade till italienarna i Santoña på villkor som nationalisterna inte respekterade. Asturien höll ut till den 21 oktober, då Gijón föll. Med nordkusten, dess kol- och järngruvor och dess tunga industri hade Franco den starkare ekonomin och kunde flytta hela sin armé söderut och österut. En del av de besegrade gick upp i bergen som gerillasoldater.
