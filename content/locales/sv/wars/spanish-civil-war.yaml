On the night of 24–25 July 1938 the Republican Army of the Ebro under Juan Modesto crossed the river in boats and on pontoon bridges between Mequinenza and Amposta, to rejoin the two halves of the Republic and draw Franco away from Valencia. The crossing took the Nationalists by surprise, and in a few days the Republicans pushed into the great bend of the river as far as the outskirts of Gandesa. They could not take the town, and the offensive stalled. Nationalist aircraft bombed the bridges again and again, and dams upstream were opened to flood the river behind the Republicans.: Natten mellan den 24 och 25 juli 1938 gick den republikanska Ebroarmén under Juan Modesto över floden i båtar och på pontonbroar mellan Mequinenza och Amposta, för att återförena republikens två halvor och dra bort Franco från Valencia. Övergången kom som en överraskning för nationalisterna, och på några dagar trängde republikanerna in i flodens stora krök ända fram till utkanten av Gandesa. De kunde inte inta staden, och offensiven körde fast. Nationalistiska flygplan bombade broarna gång på gång, och dammar uppströms öppnades för att översvämma floden bakom republikanerna.
Franco chose to wear the Republican army down where it stood. For more than three months Nationalist artillery and aircraft pounded its positions in the bare hills of the Sierra de Pàndols and Cavalls, and counter-attack after counter-attack slowly retook the ground. By 16 November the last Republican troops had crossed back over the river. The battle, the longest of the war, cost each side tens of thousands of casualties and destroyed the Republic’s last effective army. Meanwhile the Munich Agreement of 30 September ended Negrín’s hope of help from Britain and France, and the International Brigades were withdrawn, holding a farewell parade in Barcelona on 28 October.: Franco valde att nöta ned den republikanska armén där den stod. I mer än tre månader bearbetade nationalistiskt artilleri och flyg dess ställningar i de kala bergen i Sierra de Pàndols och Cavalls, och motanfall efter motanfall återtog långsamt terrängen. Den 16 november hade de sista republikanska trupperna gått tillbaka över floden. Slaget, krigets längsta, kostade vardera sidan tiotusentals i förluster och förintade republikens sista slagkraftiga armé. Under tiden gjorde Münchenöverenskommelsen den 30 september slut på Negríns hopp om hjälp från Storbritannien och Frankrike, och de internationella brigaderna drogs tillbaka och höll en avskedsparad i Barcelona den 28 oktober.
