Spanish Civil War: Spanska inbördeskriget
A war between the government of the Second Spanish Republic, backed by the parties of the left, the trade unions and the Basque and Catalan autonomists, and the Nationalists, army rebels joined by monarchists, Carlists and the fascist Falange, who were led from October 1936 by General Francisco Franco. With troops, aircraft and arms from Fascist Italy and Nazi Germany the Nationalists won, while the Republic depended on the Soviet Union and the International Brigades; Franco then ruled Spain as dictator until his death in 1975. Estimates of the dead differ widely, but by many counts some 200,000 died at the front and about as many were murdered or executed behind the lines and after the war, most of them by the Nationalists.: Ett krig mellan regeringen i Andra spanska republiken, som stöddes av vänsterpartierna, fackföreningarna och de baskiska och katalanska autonomisterna, och nationalisterna, upproriska militärer som fick sällskap av monarkister, karlister och den fascistiska Falange och som från oktober 1936 leddes av general Francisco Franco. Med trupper, flygplan och vapen från det fascistiska Italien och Nazityskland segrade nationalisterna, medan republiken var beroende av Sovjetunionen och de internationella brigaderna; Franco styrde sedan Spanien som diktator till sin död 1975. Uppskattningarna av antalet döda varierar kraftigt, men enligt många beräkningar dog omkring 200 000 vid fronten och ungefär lika många mördades eller avrättades bakom linjerna och efter kriget, de flesta av nationalisterna.
