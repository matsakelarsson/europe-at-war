On 7 March 1938 the Nationalists, with Italian divisions and German and Italian aircraft, opened an offensive in Aragon against a Republican army worn out at Teruel. The front gave way. Belchite was retaken on 10 March, and within a month Nationalist columns had overrun eastern Aragon, taken Lleida on 3 April and reached the Segre and the Ebro. On 15 April Navarrese troops under General Camilo Alonso Vega reached the Mediterranean at Vinaròs, cutting the Republic in two and separating Catalonia from Valencia and Madrid. In March Italian bombers from Mallorca had struck Barcelona for three days, killing about a thousand people.: Den 7 mars 1938 inledde nationalisterna, med italienska divisioner och tyska och italienska flygplan, en offensiv i Aragonien mot en republikansk armé som var utsliten efter Teruel. Fronten gav vika. Belchite återtogs den 10 mars, och inom en månad hade nationalistiska kolonner överskridit östra Aragonien, intagit Lleida den 3 april och nått Segre och Ebro. Den 15 april nådde navarresiska trupper under general Camilo Alonso Vega Medelhavet vid Vinaròs, vilket klöv republiken i två delar och skilde Katalonien från Valencia och Madrid. I mars hade italienska bombplan från Mallorca anfallit Barcelona i tre dagar och dödat omkring tusen människor.
Instead of attacking Catalonia, Franco turned south against Valencia. His troops took Castellón on 14 June, but in July they were stopped with heavy losses on the fortified XYZ line in the mountains north of Sagunto. The Republican prime minister, Juan Negrín, had offered peace terms on 1 May, his Thirteen Points, which Franco ignored; Negrín hoped that the Republic could hold out until a wider European war brought it allies. On 5 April Franco abolished Catalonia’s autonomy.: I stället för att anfalla Katalonien vände sig Franco söderut mot Valencia. Hans trupper intog Castellón den 14 juni, men i juli hejdades de med svåra förluster vid den befästa XYZ-linjen i bergen norr om Sagunto. Den republikanske premiärministern Juan Negrín hade den 1 maj erbjudit fredsvillkor, sina tretton punkter, som Franco ignorerade; Negrín hoppades att republiken skulle kunna hålla ut tills ett större europeiskt krig gav den bundsförvanter. Den 5 april avskaffade Franco Kataloniens autonomi.
