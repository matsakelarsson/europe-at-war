With the strait closed by the Republican navy, Franco asked Hitler and Mussolini for aircraft. From the end of July German Junkers Ju 52 transports and Italian Savoia-Marchetti bombers flew thousands of Spanish legionaries and Moroccan Regulares from Tetuán to Seville, in the first long-range airlift of troops in history, and a convoy crossed under air cover on 5 August. Columns under Lieutenant Colonel Juan Yagüe drove north through Extremadura by lorry, routing the militias that stood in their way. On 14 August they stormed Badajoz, where estimates of the prisoners and civilians shot in the following days, many of them in the bullring, range from 500 to 4,000.: Med sundet stängt av den republikanska flottan bad Franco Hitler och Mussolini om flygplan. Från slutet av juli flög tyska transportplan av typen Junkers Ju 52 och italienska Savoia-Marchetti-bombplan tusentals spanska legionärer och marockanska Regulares från Tetuán till Sevilla, i historiens första luftbro för trupper över lång distans, och en konvoj gick över under luftskydd den 5 augusti. Kolonner under överstelöjtnant Juan Yagüe drog norrut genom Extremadura med lastbil och slog de miliser som stod i deras väg på flykten. Den 14 augusti stormade de Badajoz, där uppskattningarna av antalet fångar och civila som sköts under de följande dagarna, många av dem på tjurfäktningsarenan, varierar från 500 till 4 000.
Badajoz joined the two Nationalist zones along the border with Portugal, whose dictator, António de Oliveira Salazar, openly favoured them. Yagüe’s men took Talavera de la Reina on 3 September, but Franco turned aside to relieve the Alcázar of Toledo, where Colonel José Moscardó, with Civil Guards, cadets and their families, had held out since July; his troops reached it on 27 September. In the north Mola’s forces took Irun on 5 September, cutting the Basque Country and Asturias off from France, and San Sebastián a week later. On 1 October Franco took office in Burgos as Generalísimo and head of the Nationalist state.: Badajoz förenade de två nationalistiska zonerna längs gränsen mot Portugal, vars diktator António de Oliveira Salazar öppet gynnade dem. Yagües män intog Talavera de la Reina den 3 september, men Franco vek av för att undsätta Alcázar i Toledo, där överste José Moscardó med civilgardister, kadetter och deras familjer hade hållit ut sedan juli; hans trupper nådde dit den 27 september. I norr intog Molas styrkor Irun den 5 september, vilket skar av Baskien och Asturien från Frankrike, och San Sebastián en vecka senare. Den 1 oktober tillträdde Franco i Burgos som generalísimo och chef för den nationalistiska staten.
