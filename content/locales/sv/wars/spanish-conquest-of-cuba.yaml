Spanish conquest of Cuba: Spaniens erövring av Kuba
? The conquest of Cuba by Diego Velázquez de Cuéllar in 1511–1514. Velázquez crossed from western Hispaniola early in 1511 with some 300 men and landed in the east of the island, where Hatuey, a cacique who had fled from Hispaniola, led the Taíno in a guerrilla war for several months; he was captured and burned at the stake on 2 February 1512. Reinforced by Pánfilo de Narváez and archers from Jamaica, Velázquez founded Baracoa and in 1513 sent columns west along both coasts and through the interior. At Caonao, in the Camagüey region, Narváez’s men massacred a village that had come out to meet them with food; Bartolomé de las Casas, who saw it, wrote that more than three thousand people were killed. By 1515 Velázquez had founded seven towns, from Baracoa and Bayamo to Trinidad, Sancti Spíritus, Puerto Príncipe, Havana and Santiago, and divided the Taíno in encomiendas to work the gold placers. Disease, forced labour and flight destroyed most of the island’s Indigenous population within a few decades; Taíno resistance went on in the eastern mountains under Guamá until 1533.
: Diego Velázquez de Cuéllars erövring av Kuba 1511–1514. Velázquez gick över från västra Hispaniola i början av 1511 med omkring 300 man och landsteg på öns östra del, där Hatuey, en kazik som hade flytt från Hispaniola, ledde taínofolket i ett gerillakrig i flera månader; han tillfångatogs och brändes på bål den 2 februari 1512. Förstärkt av Pánfilo de Narváez och bågskyttar från Jamaica grundade Velázquez Baracoa och sände 1513 kolonner västerut längs båda kusterna och genom inlandet. Vid Caonao i Camagüeyregionen massakrerade Narváez män en by som hade kommit ut för att möta dem med mat; Bartolomé de las Casas, som bevittnade det, skrev att mer än tretusen människor dödades. Fram till 1515 hade Velázquez grundat sju städer, från Baracoa och Bayamo till Trinidad, Sancti Spíritus, Puerto Príncipe, Havanna och Santiago, och fördelat taínofolket i encomiendor för att arbeta i guldvaskerierna. Sjukdomar, tvångsarbete och flykt utplånade större delen av öns ursprungsbefolkning inom några årtionden; taínofolkets motstånd fortsatte i bergen i öster under Guamá fram till 1533.
