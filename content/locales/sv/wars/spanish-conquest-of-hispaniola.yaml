# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
Spanish conquest of Hispaniola: Spaniens erövring av Hispaniola
? "The conquest of the Taíno chiefdoms of Hispaniola (Ayiti or Quisqueya) by the Crown of Castile in the decade after Christopher Columbus’s first voyage. In November 1493 Columbus’s second expedition found the fort of La Navidad destroyed by the warriors of the cacique Caonabo, and in January 1494 he founded La Isabela on the north coast and sent men into the gold-bearing Cibao. Alonso de Ojeda captured Caonabo, and in March 1495 Columbus defeated an alliance of caciques in the Vega Real and imposed a tribute in gold and cotton on the Taíno. His brother Bartolomé put down the rising of Guarionex in 1497–1498, while the Spanish colonists themselves rebelled under Francisco Roldán. Governor Nicolás de Ovando, who arrived in 1502, ended the last independent chiefdoms: in 1503 his men burned some eighty caciques in a house at Xaraguá and hanged its ruler Anacaona, and in 1503–1504 Juan de Esquivel conquered Higüey, whose cacique Cotubanamá was hanged in Santo Domingo. The surviving Taíno were divided among the colonists in encomiendas. War, famine, forced labour, enslavement and disease destroyed them within a generation: estimates of the population in 1492 range from under 100,000 to several million, a Spanish count of 1508 found about 60,000, and the repartimiento of 1514 listed about 26,000."
: "Kastiliens kronas erövring av taínofolkets hövdingadömen på Hispaniola (Ayiti eller Quisqueya) under årtiondet efter Christofer Columbus första resa. I november 1493 fann Columbus andra expedition fortet La Navidad förstört av kaziken Caonabos krigare, och i januari 1494 grundade han La Isabela på nordkusten och sände män in i det guldförande Cibao. Alonso de Ojeda tillfångatog Caonabo, och i mars 1495 besegrade Columbus en allians av kaziker i Vega Real och pålade taínofolket en tribut i guld och bomull. Hans bror Bartolomé slog ned resningen under Guarionex 1497–1498, samtidigt som de spanska kolonisterna själva gjorde uppror under Francisco Roldán. Guvernören Nicolás de Ovando, som anlände 1502, gjorde slut på de sista självständiga hövdingadömena: 1503 brände hans män ett åttiotal kaziker i ett hus i Xaraguá och hängde dess härskare Anacaona, och 1503–1504 erövrade Juan de Esquivel Higüey, vars kazik Cotubanamá hängdes i Santo Domingo. De överlevande av taínofolket fördelades bland kolonisterna i encomiendor. Krig, svält, tvångsarbete, förslavning och sjukdomar utplånade dem inom en generation: uppskattningarna av befolkningen 1492 sträcker sig från under 100 000 till flera miljoner, en spansk räkning 1508 kom fram till omkring 60 000, och vid fördelningen (repartimiento) 1514 förtecknades omkring 26 000."
