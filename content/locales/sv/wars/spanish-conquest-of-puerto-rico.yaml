# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
Spanish conquest of Puerto Rico: Spaniens erövring av Puerto Rico
? The conquest of Borikén, the island the Spaniards called San Juan Bautista and later Puerto Rico, and the Taíno war against it. In 1508 Juan Ponce de León, a veteran of the conquest of Higüey, came from Hispaniola with about fifty men, was received by the high chief Agüeybaná, who exchanged names with him in the guaytiao ritual, and founded Caparra near San Juan Bay. As governor from 1509 he divided the Taíno among the colonists in encomiendas to work the gold placers. After Agüeybaná’s death in 1510 his brother Agüeybaná II formed an alliance of caciques; according to the chroniclers, Urayoán’s men drowned a Spaniard, Diego Salcedo, to prove that the newcomers were mortal. Early in 1511 the Taíno killed Cristóbal de Sotomayor and burned his settlement, and Ponce de León answered with campaigns in the south and west that culminated in a battle at Yagüecas, where by the traditional account Agüeybaná II was shot dead. Some historians, citing later documents, think he survived and fought on. Under Juan Cerón and Miguel Díaz the Spaniards carried out dozens of slave raids in 1512–1513, while the Taíno and their Kalinago allies burned Caparra in 1513 and fought on from the east of the island and the neighbouring islands into the 1520s. A census of 1530 counted 1,148 Taíno on the island.
: Erövringen av Borikén, den ö som spanjorerna kallade San Juan Bautista och senare Puerto Rico, och taínofolkets krig mot den. År 1508 kom Juan Ponce de León, en veteran från erövringen av Higüey, från Hispaniola med omkring femtio man, togs emot av överhövdingen Agüeybaná, som bytte namn med honom i guaytiaoritualen, och grundade Caparra nära San Juanbukten. Som guvernör från 1509 fördelade han taínofolket bland kolonisterna i encomiendor för att arbeta i guldvaskerierna. Efter Agüeybanás död 1510 bildade hans bror Agüeybaná II en allians av kaziker; enligt krönikörerna dränkte Urayoáns män en spanjor, Diego Salcedo, för att bevisa att nykomlingarna var dödliga. I början av 1511 dödade taínofolket Cristóbal de Sotomayor och brände hans bosättning, och Ponce de León svarade med fälttåg i söder och väster som kulminerade i ett slag vid Yagüecas, där Agüeybaná II enligt den traditionella berättelsen sköts ihjäl. Vissa historiker menar, med stöd av senare dokument, att han överlevde och fortsatte striden. Under Juan Cerón och Miguel Díaz genomförde spanjorerna dussintals slavräder 1512–1513, medan taínofolket och deras kalinagoallierade brände Caparra 1513 och fortsatte kampen från öns östra del och grannöarna in på 1520-talet. En folkräkning 1530 räknade till 1 148 taíno på ön.
