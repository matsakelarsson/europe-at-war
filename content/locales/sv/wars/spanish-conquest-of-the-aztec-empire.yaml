# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
Spanish conquest of the Aztec Empire: Spanska erövringen av Aztekriket
The overthrow of the Aztec Triple Alliance by a few hundred Spaniards under Hernán Cortés and tens of thousands of Indigenous allies, above all the Tlaxcalans, between 1519 and 1521. Cortés landed on the Gulf coast in April 1519, won over the Totonacs of Cempoala and, after a short war, Tlaxcala, massacred the people of Cholula and entered Tenochtitlan in November, where he held Moctezuma II prisoner. In 1520 the city rose after the Toxcatl massacre, and the Spaniards were driven out with heavy losses on La Noche Triste. Smallpox then killed many people in central Mexico, among them Moctezuma’s successor Cuitláhuac. From Texcoco Cortés and his allies cut Tenochtitlan off by land and, with thirteen brigantines, by water; after a siege of about three months the city fell on 13 August 1521 and Cuauhtémoc was captured. The empire’s lands became New Spain.: Den aztekiska trippelalliansens undergång, som åstadkoms av några hundra spanjorer under Hernán Cortés och tiotusentals ursprungsamerikanska allierade, framför allt tlaxcalteker, mellan 1519 och 1521. Cortés landsteg vid kusten mot Mexikanska golfen i april 1519, vann över totonakerna i Cempoala och, efter ett kort krig, Tlaxcala, massakrerade invånarna i Cholula och tågade in i Tenochtitlan i november, där han höll Moctezuma II fången. År 1520 reste sig staden efter Toxcatlmassakern, och spanjorerna drevs ut med svåra förluster under La Noche Triste. Smittkoppor dödade sedan många människor i centrala Mexiko, bland dem Moctezumas efterträdare Cuitláhuac. Från Texcoco skar Cortés och hans allierade av Tenochtitlan till lands och, med tretton brigantiner, till sjöss; efter en belägring på omkring tre månader föll staden den 13 augusti 1521 och Cuauhtémoc tillfångatogs. Rikets landområden blev Nya Spanien.
