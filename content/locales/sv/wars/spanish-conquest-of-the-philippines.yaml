# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
Spanish conquest of the Philippines: Spaniens erövring av Filippinerna
? "The conquest that made the islands the Spanish Philippines, from Miguel López de Legazpi’s landing in 1565 to the occupation of Mindanao’s north coast in the 1590s. The islands were not one state but many: hundreds of independent communities (barangays and their federations) ruled by datus and rajahs, among them the trading towns of Cebu, Manila and Tondo, the last two with close ties to the Muslim sultanate of Brunei. Sent by Philip II from New Spain with a few hundred Spanish and Mexican soldiers, Legazpi made blood compacts with chiefs in Bohol, took Cebu from Rajah Tupas in April 1565, withstood a Portuguese blockade in 1568, and moved to Panay in 1569. In 1570 his captain Martín de Goiti fought Rajah Sulayman at Manila, and in 1571 Legazpi returned with Visayan allies, made peace with the rulers of Manila and Tondo, defeated the Kapampangan fleet at Bangkusay and founded Spanish Manila. In the next few years Juan de Salcedo and Goiti brought most of the coasts of Luzon under Spanish rule, often through agreements with local chiefs, sometimes by force. The Chinese captain Limahong’s attack on Manila in 1574, Japanese settlers in Cagayan in 1582 and a conspiracy of the Tagalog nobility in 1587–1588 were defeated, and missions reached northern Mindanao in the 1590s. For Spain it was the beginning of an empire in Asia that lasted until 1898 and of the galleon trade between Manila and Acapulco; for the peoples of the islands it brought tribute, forced labour and Christianity. The Muslim sultanates of Mindanao and Sulu, which Spain fought from 1578, were never fully conquered."
: "Den erövring som gjorde öarna till Spanska Filippinerna, från Miguel López de Legazpis landstigning 1565 till ockupationen av Mindanaos nordkust på 1590-talet. Öarna var inte en stat utan många: hundratals självständiga samhällen (barangayer och deras förbund) som styrdes av datuer och rajor, bland dem handelsstäderna Cebu, Manila och Tondo, de två sistnämnda med nära band till det muslimska sultanatet Brunei. Legazpi, som Filip II sände från Nya Spanien med några hundra spanska och mexikanska soldater, slöt blodsförbund med hövdingar på Bohol, tog Cebu från raja Tupas i april 1565, stod emot en portugisisk blockad 1568 och flyttade till Panay 1569. År 1570 stred hans kapten Martín de Goiti mot raja Sulayman vid Manila, och 1571 återvände Legazpi med bundsförvanter från Visayasöarna, slöt fred med härskarna i Manila och Tondo, besegrade kapampanganernas flotta vid Bangkusay och grundade det spanska Manila. Under de följande åren förde Juan de Salcedo och Goiti större delen av Luzons kuster under spanskt styre, ofta genom överenskommelser med lokala hövdingar, ibland med våld. Den kinesiske kaptenen Limahongs anfall mot Manila 1574, japanska bosättare i Cagayan 1582 och en sammansvärjning inom tagalogadeln 1587–1588 besegrades, och missionärer nådde norra Mindanao på 1590-talet. För Spanien var det början på ett välde i Asien som varade till 1898 och på galeonhandeln mellan Manila och Acapulco; för öarnas folk förde det med sig tribut, tvångsarbete och kristendom. De muslimska sultanaten på Mindanao och Sulu, som Spanien bekämpade från 1578, erövrades aldrig helt."
