# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
Spanish conquest of the Tarascan state: Spanska erövringen av Tarascanriket
? The submission of the Purépecha (Tarascan) kingdom of Michoacán to the Spaniards and its end with the execution of its last king. The Purépecha state, ruled from Tzintzuntzan on Lake Pátzcuaro by a king the Spaniards called the cazonci, had by one estimate about a million people (others say up to 1.5 million) and had held off the Aztec Empire for half a century. In 1520 the cazonci Zuangua refused a Mexica request for an alliance against the Spaniards, and he died in the smallpox epidemic that followed. After the fall of Tenochtitlan his son Tangáxuan II (Tzintzicha) sent envoys to Cortés, and in 1522 Cristóbal de Olid marched into Michoacán with Spanish soldiers and many Mexica warriors. Tangáxuan chose not to fight his large army against them, fled for a time and then submitted; Olid occupied Tzintzuntzan for about four months and carried off its treasure in gold and silver, and the Purépecha helped the Spaniards reach the Pacific at Zacatula and conquer Colima in 1523. Tangáxuan was baptised Francisco and went on ruling, so that for some years Michoacán paid tribute both to him and to the Spanish encomenderos. In 1529 Nuño de Guzmán, president of the first Audiencia of Mexico, set out on his conquest of the west, took the cazonci with him and, with the help of a rival noble, Don Pedro Cuinierángari, had him tried for plotting rebellion, hiding treasure and other charges. Tangáxuan was tortured, and on 14 February 1530 he was executed by burning; his ashes were thrown into the Lerma River. Michoacán then came under direct Spanish rule, with Purépecha nobles as governors under Spanish oversight; Vasco de Quiroga, its first bishop, later founded his hospital towns there. Most of what is known of the Purépecha state comes from the Relación de Michoacán, written down about 1540 from the accounts of Purépecha nobles.
: Underkastelsen av purépechafolkets (taraskernas) kungarike i Michoacán under spanjorerna och rikets slut med avrättningen av dess siste kung. Purépechastaten, som styrdes från Tzintzuntzan vid Pátzcuarosjön av en kung som spanjorerna kallade cazonci, hade enligt en uppskattning omkring en miljon invånare (andra säger upp till 1,5 miljoner) och hade hållit Aztekriket stången i ett halvsekel. År 1520 avvisade cazonci Zuangua en begäran från mexica om en allians mot spanjorerna, och han dog i den smittkoppsepidemi som följde. Efter Tenochtitlans fall sände hans son Tangáxuan II (Tzintzicha) sändebud till Cortés, och 1522 marscherade Cristóbal de Olid in i Michoacán med spanska soldater och många mexicakrigare. Tangáxuan valde att inte sätta in sin stora armé mot dem, flydde en tid och underkastade sig sedan; Olid ockuperade Tzintzuntzan i omkring fyra månader och förde bort dess skatter av guld och silver, och purépechafolket hjälpte spanjorerna att nå Stilla havet vid Zacatula och att erövra Colima 1523. Tangáxuan döptes till Francisco och fortsatte att regera, så att Michoacán under några år betalade tribut både till honom och till de spanska encomenderos. År 1529 gav sig Nuño de Guzmán, president för Mexikos första audiencia, ut på sitt erövringståg västerut, tog cazonci med sig och lät, med hjälp av en rivaliserande adelsman, don Pedro Cuinierángari, ställa honom inför rätta, anklagad för att ha planerat uppror och gömt undan skatter, bland andra anklagelser. Tangáxuan torterades, och den 14 februari 1530 avrättades han genom att brännas på bål; hans aska kastades i Lermafloden. Michoacán kom därefter under direkt spanskt styre, med purépechaadelsmän som guvernörer under spansk tillsyn; Vasco de Quiroga, dess förste biskop, grundade senare sina sjukhusbyar där. Det mesta av vad man vet om purépechastaten kommer från Relación de Michoacán, som nedtecknades omkring 1540 efter berättelser av purépechaadelsmän.
