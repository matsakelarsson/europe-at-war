# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
Spanish conquest of Yucatán: Spanska erövringen av Yucatán
The twenty-year struggle of Francisco de Montejo, his son and his nephew to conquer the Maya provinces of the Yucatán Peninsula. Northern Yucatán had no single ruler to overthrow, only sixteen or more rival provinces, and two attempts, from the east coast in 1527–1528 and from Campeche in 1531–1535, ended in retreat. In 1540–1542 Montejo the Younger returned with a larger force, founded Campeche and Mérida and, with the help of the Xiu of Maní, brought the western provinces under Spanish rule; the eastern provinces were subdued in 1542–1545 and rose together in the Great Maya Revolt of November 1546, which was put down early in 1547. Many Maya fled south to the Petén, where the Itza held out until 1697.: Francisco de Montejos, hans sons och hans nevös tjugoåriga kamp för att erövra mayaprovinserna på Yucatánhalvön. Norra Yucatán hade ingen enskild härskare att störta, bara sexton eller fler rivaliserande provinser, och två försök, från östkusten 1527–1528 och från Campeche 1531–1535, slutade med reträtt. År 1540–1542 återvände Montejo den yngre med en större styrka, grundade Campeche och Mérida och förde, med hjälp av Xiu i Maní, de västra provinserna under spanskt styre; de östra provinserna underkuvades 1542–1545 och reste sig gemensamt i det stora mayaupproret i november 1546, som slogs ned i början av 1547. Många ur mayafolket flydde söderut till Petén, där itzafolket höll stånd till 1697.
