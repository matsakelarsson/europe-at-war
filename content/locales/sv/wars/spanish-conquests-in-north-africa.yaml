# Svenska översättningar av katalogtexten (våg 12); stegtexterna kommer senare.
Spanish conquests in North Africa: Spaniens erövringar i Nordafrika
A run of Castilian and Aragonese conquests along the coast of the Maghreb after the fall of Granada, aimed at the ports from which ships raided the Spanish coasts and at carrying the war against Islam into Africa. Melilla was occupied in 1497, Mers el-Kébir taken in 1505, and in May 1509 an army financed and accompanied by Cardinal Cisneros and led by Pedro Navarro stormed Oran. In 1510 Navarro took Bougie, the towns of the central Maghreb from Algiers to Tlemcen accepted Spanish garrisons or paid tribute, and in July he took Tripoli after hard street fighting, killing and enslaving many thousands of its people. Then, at the end of August 1510, an army of about 15,000 that landed on Djerba was routed by its people and the heat, and its commander García Álvarez de Toledo was killed. Spain kept Melilla, Oran, Bougie, Tripoli and the island fort off Algiers, but the advance was over, and the ports of the Maghreb soon turned to the Barbarossa brothers for help.: En rad kastilianska och aragonska erövringar längs Maghrebs kust efter Granadas fall, riktade mot de hamnar varifrån fartyg härjade de spanska kusterna och syftande till att föra kriget mot islam in i Afrika. Melilla besattes 1497, Mers el-Kébir intogs 1505, och i maj 1509 stormade en armé, finansierad och åtföljd av kardinal Cisneros och ledd av Pedro Navarro, Oran. År 1510 intog Navarro Bougie, städerna i centrala Maghreb från Alger till Tlemcen godtog spanska garnisoner eller betalade tribut, och i juli intog han Tripoli efter hårda gatustrider och dödade och förslavade många tusen av stadens invånare. I slutet av augusti 1510 slogs sedan en armé på omkring 15 000 man som hade landstigit på Djerba på flykten av öns invånare och hettan, och dess befälhavare García Álvarez de Toledo dödades. Spanien behöll Melilla, Oran, Bougie, Tripoli och fortet på ön utanför Alger, men framryckningen var över, och Maghrebs hamnar vände sig snart till bröderna Barbarossa för att få hjälp.
