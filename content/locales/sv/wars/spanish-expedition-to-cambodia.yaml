# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
Spanish expedition to Cambodia (Cambodian–Spanish War): Den spanska expeditionen till Kambodja (kambodjansk-spanska kriget)
? Siamese invasions of Cambodia and the attempt of Spanish and Portuguese adventurers, backed in the end by Spanish Manila, to make Cambodia a client of Spain. After Naresuan had thrown off Burmese rule, Siamese armies attacked Cambodia in 1593, and King Satha I sent the Portuguese Diogo Veloso and the Spaniard Gregorio Vargas to Manila to ask for help. In 1594 the Siamese took and sacked the capital, Longvek; Satha fled to Lan Xang, where he died, and the Siamese carried off thousands of Cambodians, among them Prince Soriyopor. In 1596 an expedition of three ships under Juan Juárez Gallinato left Manila with Spanish and Mexican soldiers and Japanese and Filipino auxiliaries, between about 120 and 400 men by different accounts. At Phnom Penh, Blas Ruiz de Hernán González and Veloso fought the Chinese merchants and stormed the palace of the new king, Reamea Chung Prey (Preah Ram I), who was killed; Gallinato withdrew. Ruiz and Veloso then brought Satha’s son Barom Reachea II back from Lan Xang and put him on the throne in 1597, receiving two provinces. In 1599, when more ships from Manila had been wrecked, Cham and Malay forces under the Laksmana, with Cambodian allies, killed Ruiz, Veloso and almost all the Spaniards and Portuguese at Phnom Penh; the young king was killed soon after. Soriyopor returned from Ayutthaya with Siamese support, and the Spanish plans for Cambodia were given up.
: Siamesiska invasioner av Kambodja och spanska och portugisiska äventyrares försök, till slut med stöd av det spanska Manila, att göra Kambodja till en klientstat under Spanien. Sedan Naresuan hade skakat av sig det burmesiska styret angrep siamesiska arméer Kambodja 1593, och kung Satha I sände portugisen Diogo Veloso och spanjoren Gregorio Vargas till Manila för att be om hjälp. År 1594 intog och plundrade siameserna huvudstaden Longvek; Satha flydde till Lan Xang, där han dog, och siameserna förde bort tusentals kambodjaner, bland dem prins Soriyopor. År 1596 lämnade en expedition på tre fartyg under Juan Juárez Gallinato Manila med spanska och mexikanska soldater och japanska och filippinska hjälptrupper, mellan omkring 120 och 400 man enligt olika uppgifter. I Phnom Penh stred Blas Ruiz de Hernán González och Veloso mot de kinesiska köpmännen och stormade palatset hos den nye kungen, Reamea Chung Prey (Preah Ram I), som dödades; Gallinato drog sig tillbaka. Ruiz och Veloso hämtade sedan Sathas son Barom Reachea II tillbaka från Lan Xang och satte honom på tronen 1597, och fick själva två provinser. År 1599, när fler fartyg från Manila hade förlist, dödade cham- och malajstyrkor under Laksmana, med kambodjanska bundsförvanter, Ruiz, Veloso och nästan alla spanjorer och portugiser i Phnom Penh; den unge kungen dödades kort därefter. Soriyopor återvände från Ayutthaya med siamesiskt stöd, och de spanska planerna för Kambodja övergavs.
