# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
Spanish–Moro conflict: Konflikten mellan Spanien och morerna
? "The three centuries of war between Spain and the Muslim sultanates of Mindanao and the Sulu archipelago, whose peoples the Spanish called Moros. After taking Manila in 1571, the Spanish tried again and again to bring Sulu, Maguindanao and the Maranao of Lake Lanao under their rule and to stop the raids that the sultanates’ fleets made on the Christian towns of the Visayas and Luzon. In the 1630s Governor Sebastián Hurtado de Corcuera built a fort at Zamboanga, defeated Sultan Kudarat of Maguindanao and occupied Jolo, but the Spanish gave up Jolo in 1646 and Zamboanga in 1663. From the rebuilt fort at Zamboanga (1718) they fought a long war of raids and counter-raids, which reached its height in the 1750s and again from the 1770s, when Iranun and Banguingui fleets sailing under the protection of Sulu’s datus raided across Southeast Asia for the slave markets of Jolo; historians estimate that 200,000 to 300,000 people were taken between 1770 and 1870. Steam gunboats turned the balance: the Spanish destroyed the Banguingui strongholds on Balangingi in 1848, took Jolo in 1851 and again in 1876, occupied Cotabato, Davao and Palawan, and reached Lake Lanao in 1895. Spain never fully subdued the sultanates, and handed its claim to the United States in 1898–1899."
: "De tre sekel av krig som Spanien förde mot de muslimska sultanaten på Mindanao och i Suluarkipelagen, vars folk spanjorerna kallade morer (moros). Efter att ha tagit Manila 1571 försökte spanjorerna gång på gång föra Sulu, Maguindanao och maranaofolket vid Lanaosjön under sitt välde och stoppa de räder som sultanatens flottor gjorde mot de kristna städerna på Visayasöarna och Luzon. På 1630-talet byggde guvernör Sebastián Hurtado de Corcuera ett fort i Zamboanga, besegrade sultan Kudarat av Maguindanao och ockuperade Jolo, men spanjorerna gav upp Jolo 1646 och Zamboanga 1663. Från det återuppbyggda fortet i Zamboanga (1718) förde de ett långt krig med räder och motanfall, som nådde sin höjdpunkt på 1750-talet och på nytt från 1770-talet, då iranun- och banguinguiflottor som seglade under skydd av Sulus datuer gjorde räder över hela Sydostasien för slavmarknaderna i Jolo; historiker uppskattar att 200 000 till 300 000 människor rövades bort mellan 1770 och 1870. Ångdrivna kanonbåtar vände styrkeförhållandet: spanjorerna förstörde banguinguiernas fästen på Balangingi 1848, intog Jolo 1851 och på nytt 1876, ockuperade Cotabato, Davao och Palawan och nådde Lanaosjön 1895. Spanien underkuvade aldrig sultanaten helt och överlämnade sina anspråk till USA 1898–1899."
