# Svenska översättningar av katalogtexten (våg 8); stegtexterna kommer senare.
Sri Lankan Civil War: Inbördeskriget i Sri Lanka
The war between the Sri Lankan state and the Liberation Tigers of Tamil Eelam (LTTE), who fought for an independent Tamil state, Tamil Eelam, in the north and east of the island. It grew out of decades of Tamil grievances against Sinhalese-majority governments and began in earnest with an LTTE ambush and the anti-Tamil pogrom of July 1983. India first sheltered the Tamil militants, then sent a peacekeeping force under the Indo-Sri Lanka Accord of 1987, which fought the LTTE until it withdrew in 1990. The LTTE built a de facto state in the Vanni, with its own army, navy and suicide units, and killed Rajiv Gandhi and President Premadasa. A Norwegian-brokered ceasefire in 2002 broke down after 2005, and in 2006–2009 the army took the east and then the north, destroying the LTTE in a final battle on a strip of coast in May 2009, in which very many civilians died. The UN estimated that 80,000 to 100,000 people were killed in the war; the civilian toll of its last months is contested.: Kriget mellan den lankesiska staten och Tamilska befrielsetigrarna (LTTE), som kämpade för en självständig tamilsk stat, Tamil Eelam, i öns norra och östra delar. Det växte fram ur tamilernas årtiondelånga missnöje med regeringar dominerade av den singalesiska majoriteten och bröt ut på allvar med ett bakhåll av LTTE och pogromen mot tamiler i juli 1983. Indien gav först de tamilska militanta grupperna en fristad och sände sedan, enligt det indisk-lankesiska avtalet från 1987, en fredsbevarande styrka, som stred mot LTTE tills den drog sig tillbaka 1990. LTTE byggde upp en de facto-stat i Vanni, med egen armé, flotta och självmordsförband, och dödade Rajiv Gandhi och president Premadasa. En vapenvila som Norge förmedlade 2002 bröt samman efter 2005, och 2006–2009 intog armén östra och sedan norra Sri Lanka och förintade LTTE i ett slutslag på en kustremsa i maj 2009, där mycket många civila dog. FN uppskattade att 80 000 till 100 000 människor dödades i kriget; antalet civila offer under krigets sista månader är omstritt.
