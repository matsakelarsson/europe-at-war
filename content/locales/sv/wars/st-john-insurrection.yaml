# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
Akwamu insurrection on St John: Akwamu-upproret på Saint John
? "The rising of enslaved Akwamu people on St John (Sankt Jan) in the Danish West Indies, which held most of the island for six months. The Danish West India and Guinea Company had settled St John in 1718, and by 1733 its 109 plantations held 1,087 enslaved Africans and 206 Europeans. Many of the enslaved were Akwamu from the Gold Coast, some of them former nobles and soldiers, sold after their state was overthrown in 1730. In 1733 drought, a hurricane and insect plagues brought hunger, and the colony answered growing flight with a harsh slave code. On 23 November 1733 the Akwamu rose: men carrying wood into the company’s fort at Coral Bay drew hidden cane knives, killed most of the garrison and fired the signal gun, and rebels led by King June (Juni), Kanta, King Claes, Breffu, Prince Akwasi and others took the estates around Coral Bay and much of the north shore, killing many of the colonists, while other planters and some of the enslaved held out at the fortified Durloo plantation, which the rebels nearly took twice, and many escaped by boat to St Thomas. Danish soldiers sent from St Thomas were driven off, and some 60 British troops from Tortola were ambushed as they landed and withdrew. The Danes then appealed to France, and on 23 April 1734 two ships from Martinique landed some 400 French and Swiss troops, who restored the planters’ control by late May; many rebels, Breffu among them, took their own lives rather than be captured. The militia declared the rising over on 25 August 1734, and captured rebels were executed. Many planters moved to St Croix, which Denmark had bought from France in 1733. The rising is remembered in the US Virgin Islands as a fight for freedom."
: "Resningen bland förslavade akwamu på Saint John (Sankt Jan) i Danska Västindien, där rebellerna behärskade större delen av ön i sex månader. Danska västindisk-guineiska kompaniet hade koloniserat Saint John 1718, och 1733 fanns på dess 109 plantager 1 087 förslavade afrikaner och 206 européer. Många av de förslavade var akwamu från Guldkusten, en del av dem före detta adelsmän och soldater, som hade sålts sedan deras stat störtats 1730. År 1733 förde torka, en orkan och insektsplågor med sig svält, och kolonin svarade på de tilltagande rymningarna med en hård slavlag. Den 23 november 1733 reste sig akwamu: män som bar in ved i kompaniets fort vid Coral Bay drog fram dolda sockerrörsknivar, dödade större delen av garnisonen och avfyrade signalkanonen, och rebeller ledda av kung June (Juni), Kanta, kung Claes, Breffu, prins Akwasi och andra tog plantagerna runt Coral Bay och stora delar av nordkusten och dödade många av kolonisterna, medan andra plantageägare och en del av de förslavade höll ut på den befästa Durlooplantagen, som rebellerna två gånger nära nog intog, och många flydde med båt till Saint Thomas. Danska soldater som sändes från Saint Thomas drevs tillbaka, och ett 60-tal brittiska soldater från Tortola hamnade i ett bakhåll när de landsteg och drog sig tillbaka. Danskarna vädjade då till Frankrike, och den 23 april 1734 landsatte två fartyg från Martinique omkring 400 franska och schweiziska soldater, som i slutet av maj hade återställt plantageägarnas kontroll; många rebeller, bland dem Breffu, tog sina egna liv hellre än att bli tillfångatagna. Milisen förklarade resningen avslutad den 25 augusti 1734, och tillfångatagna rebeller avrättades. Många plantageägare flyttade till Saint Croix, som Danmark hade köpt från Frankrike 1733. Resningen ihågkoms på Amerikanska Jungfruöarna som en kamp för frihet."
Denmark-Norway (the Danish West India and Guinea Company and its planters), with French troops from Martinique: Danmark–Norge (Danska västindisk-guineiska kompaniet och dess plantageägare), med franska trupper från Martinique
