# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
Spanish and Dutch in the Moluccas: Spanjorer och nederländare i Moluckerna
? "Half a century of war between Spain and the Dutch East India Company (VOC) over the clove islands of the northern Moluccas, fought alongside the old rivalry of the sultanates of Ternate and Tidore. In 1605 a VOC fleet under Steven van der Hagen took the Portuguese forts on Ambon and Tidore; Portugal then shared its king with Spain, and the governor of the Philippines, Pedro Bravo de Acuña, answered with an expedition from Manila that stormed Ternate on 1 April 1606 and carried Sultan Said and many nobles off to Manila, where Said died in exile. In May 1607 Cornelis Matelief de Jonge and Ternatean leaders who had fled to Halmahera built Fort Oranje at Malayu on the east coast of Ternate, and from then on the island was divided: the Spanish held the old Portuguese town of Gamalama in the south-west and allied with Tidore, while the VOC backed Ternate’s new sultans, who granted it the clove trade. Forts on Ternate, Tidore, Makian, Moti, Bacan and the coasts of Halmahera changed hands in raids and sieges, the Twelve Years’ Truce of 1609 did not stop the fighting in Asia, and Dutch fleets tried repeatedly to cut the Spanish supply route from Manila. The Peace of Münster in 1648 left both sides where they were. In 1662, when Zheng Chenggong (Koxinga), who had just taken Taiwan, demanded tribute from Manila, the governor of the Philippines called in his outlying garrisons to defend the city, and in 1663 the Spanish left Ternate and Tidore; a small post on Siau held out until the VOC took it in 1677. The war left the VOC the dominant power in the northern Moluccas."
: "Ett halvsekel av krig mellan Spanien och Nederländska ostindiska kompaniet (VOC) om kryddnejlikeöarna i norra Moluckerna, utkämpat jämsides med den gamla rivaliteten mellan sultanaten Ternate och Tidore. År 1605 intog en VOC-flotta under Steven van der Hagen de portugisiska forten på Ambon och Tidore; Portugal hade då samma kung som Spanien, och Filippinernas guvernör, Pedro Bravo de Acuña, svarade med en expedition från Manila som stormade Ternate den 1 april 1606 och förde sultan Said och många stormän till Manila, där Said dog i landsflykt. I maj 1607 byggde Cornelis Matelief de Jonge och ternatiska ledare som hade flytt till Halmahera Fort Oranje vid Malayu på Ternates östkust, och från och med då var ön delad: spanjorerna höll den gamla portugisiska staden Gamalama i sydväst och allierade sig med Tidore, medan VOC stödde Ternates nya sultaner, som gav kompaniet kryddnejlikehandeln. Fort på Ternate, Tidore, Makian, Moti, Bacan och Halmaheras kuster bytte ägare i räder och belägringar, tolvårsstilleståndet 1609 stoppade inte striderna i Asien, och nederländska flottor försökte upprepade gånger skära av den spanska försörjningsleden från Manila. Freden i Münster 1648 lämnade båda sidor där de stod. År 1662, när Zheng Chenggong (Koxinga), som just hade tagit Taiwan, krävde tribut av Manila, kallade Filippinernas guvernör in sina avlägsna garnisoner för att försvara staden, och 1663 lämnade spanjorerna Ternate och Tidore; en liten postering på Siau höll stånd tills VOC intog den 1677. Kriget gjorde VOC till den dominerande makten i norra Moluckerna."
