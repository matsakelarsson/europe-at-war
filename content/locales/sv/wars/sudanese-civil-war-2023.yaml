# Svenska översättningar av katalogtexten (våg 12); stegtexterna kommer senare.
Sudanese civil war (2023–present): Sudanesiska inbördeskriget (2023–i dag)
? The war between Sudan’s army, the Sudanese Armed Forces (SAF) under General Abdel Fattah al-Burhan, and the paramilitary Rapid Support Forces (RSF) of General Mohamed Hamdan Dagalo, known as Hemedti. The two generals had removed Omar al-Bashir together in 2019 and the civilian-led transitional government in 2021, but fell out over how and when the RSF would be merged into the army. Fighting broke out in Khartoum on 15 April 2023. The RSF took most of the capital, nearly all of Darfur, where its fighters and allied Arab militias massacred the Masalit of El Geneina, and in December 2023 the Gezira. From late 2024 the army, rearmed with drones, retook the Gezira, Sennar and, in March 2025, Khartoum. The RSF and its allies set up a rival government in Nyala, and in October 2025 they took El Fasher, the last army stronghold in Darfur, after an 18-month siege, killing thousands of civilians. The war then centred on Kordofan and Blue Nile and on drone strikes across the country. Both sides have been accused of war crimes; the United States determined in January 2025 that the RSF and allied militias had committed genocide. The war has caused the world’s largest displacement crisis, with some 13–14 million people driven from their homes, and famine; reported deaths number tens of thousands, and estimates of the true toll run far higher.
: Kriget mellan Sudans armé, Sudans väpnade styrkor (SAF) under general Abdel Fattah al-Burhan, och de paramilitära Rapid Support Forces (RSF) under general Mohamed Hamdan Dagalo, känd som Hemedti. De två generalerna hade tillsammans avsatt Omar al-Bashir 2019 och den civilt ledda övergångsregeringen 2021, men blev oense om hur och när RSF skulle införlivas i armén. Strider bröt ut i Khartoum den 15 april 2023. RSF intog större delen av huvudstaden, nästan hela Darfur, där dess kämpar och allierade arabiska miliser massakrerade masaliterna i El Geneina, och i december 2023 Gezira. Från slutet av 2024 återtog armén, återupprustad med drönare, Gezira, Sennar och i mars 2025 Khartoum. RSF och dess allierade bildade en rivaliserande regering i Nyala, och i oktober 2025 intog de El Fasher, arméns sista fäste i Darfur, efter en 18 månader lång belägring och dödade tusentals civila. Kriget kom därefter att kretsa kring Kordofan och Blå Nilen och kring drönarangrepp över hela landet. Båda sidor har anklagats för krigsförbrytelser; USA fastslog i januari 2025 att RSF och allierade miliser hade begått folkmord. Kriget har orsakat världens största fördrivningskris, med omkring 13–14 miljoner människor drivna från sina hem, och hungersnöd; de rapporterade dödsfallen uppgår till tiotusentals, och uppskattningarna av den verkliga dödssiffran ligger betydligt högre.
