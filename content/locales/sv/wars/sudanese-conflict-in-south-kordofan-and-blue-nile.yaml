# Svenska översättningar av katalogtexten (våg 12); stegtexterna kommer senare.
Conflict in South Kordofan and Blue Nile: Konflikten i Sydkordofan och Blå Nilen
? "The war between the government of Sudan and the SPLM-North, the northern branch of the Sudan People’s Liberation Movement, in the two border states that stayed in Sudan when South Sudan became independent. The Nuba of South Kordofan and peoples of southern Blue Nile had fought on the SPLA’s side in the second civil war, and the peace agreement of 2005 promised them only “popular consultations”. After disputed state elections in South Kordofan in May 2011, which the ruling party’s Ahmed Haroun won against the SPLM’s Abdelaziz al-Hilu, the army moved to disarm the SPLA’s Nuba units; fighting broke out in Kadugli on 5 June 2011, with reports of targeted killings of Nuba civilians. In September 2011 it spread to Blue Nile, where the elected governor and SPLM-North chairman Malik Agar was removed and fled to Kurmuk. The government bombed villages with Antonov aircraft and restricted aid, and hundreds of thousands of people fled to the rebel-held Nuba Mountains around Kauda, to refugee camps such as Yida and Maban in South Sudan, and to Ethiopia. With the Darfur rebels the SPLM-North formed the Sudan Revolutionary Front in November 2011. The war also set Sudan against South Sudan, which Khartoum accused of arming the rebels: on 10 April 2012 South Sudan’s army seized the Heglig oil field, and Sudan retook it about ten days later and bombed the area around Bentiu; the two states signed cooperation agreements in Addis Ababa in September 2012. The SPLM-North split in 2017 between al-Hilu’s faction, which held most of the Nuba Mountains, and Agar’s. Ceasefires held from 2016, and after Bashir’s fall Agar’s faction signed the Juba Peace Agreement of 3 October 2020; al-Hilu’s faction stayed out, and in the civil war of 2023 it took part in the fighting and later allied with the RSF."
: "Kriget mellan Sudans regering och SPLM-North, den norra grenen av Sudanesiska folkets befrielserörelse, i de två gränsdelstater som blev kvar i Sudan när Sydsudan blev självständigt. Nubafolket i Sydkordofan och folken i södra Blå Nilen hade stridit på SPLA:s sida i det andra inbördeskriget, och fredsavtalet 2005 lovade dem bara ”folkliga samråd”. Efter omstridda delstatsval i Sydkordofan i maj 2011, som det styrande partiets Ahmed Haroun vann mot SPLM:s Abdelaziz al-Hilu, gick armén in för att avväpna SPLA:s nubaförband; strider bröt ut i Kadugli den 5 juni 2011, och det kom rapporter om riktade dödanden av civila nuba. I september 2011 spred sig striderna till Blå Nilen, där den folkvalde guvernören Malik Agar, ordförande för SPLM-North, avsattes och flydde till Kurmuk. Regeringen bombade byar med Antonovflygplan och begränsade nödhjälpen, och hundratusentals människor flydde till de rebellkontrollerade Nubabergen kring Kauda, till flyktingläger som Yida och Maban i Sydsudan och till Etiopien. Tillsammans med rebellerna i Darfur bildade SPLM-North Sudanesiska revolutionära fronten i november 2011. Kriget ställde också Sudan mot Sydsudan, som Khartoum anklagade för att beväpna rebellerna: den 10 april 2012 intog Sydsudans armé oljefältet Heglig, och Sudan återtog det omkring tio dagar senare och bombade området kring Bentiu; de två staterna undertecknade samarbetsavtal i Addis Abeba i september 2012. SPLM-North splittrades 2017 mellan al-Hilus falang, som behärskade större delen av Nubabergen, och Agars. Vapenvilor höll från 2016, och efter Bashirs fall undertecknade Agars falang Jubafredsavtalet den 3 oktober 2020; al-Hilus falang stod utanför, och i inbördeskriget 2023 deltog den i striderna och allierade sig senare med RSF."
