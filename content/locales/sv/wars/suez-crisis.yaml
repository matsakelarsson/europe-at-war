Suez Crisis: Suezkrisen
? An attack on Egypt by Israel, Britain and France after President Gamal Abdel Nasser nationalised the Suez Canal Company in July 1956. Under a secret plan agreed at Sèvres, Israel invaded the Sinai on 29 October; Britain and France, claiming to separate the two sides, bombed Egyptian airfields from 31 October and landed paratroops and marines at Port Said on 5–6 November, while Egypt blocked the canal by sinking ships in it. The United States, which put heavy financial pressure on Britain, and the Soviet Union, which threatened to intervene, both opposed the attack, and Britain and France accepted a UN ceasefire that came into force on the night of 6–7 November. Their troops left by 22 December, replaced by the first UN peacekeeping force, and Israel withdrew from Sinai and Gaza in March 1957. Israel lost 172 dead and Britain and France a few dozen; the Egyptian dead, soldiers and civilians, were never reliably counted but ran into thousands by most estimates. Nasser’s standing rose across the Arab world, and the British prime minister, Anthony Eden, resigned in January 1957.
: Ett anfall mot Egypten av Israel, Storbritannien och Frankrike sedan president Gamal Abdel Nasser förstatligat Suezkanalbolaget i juli 1956. Enligt en hemlig plan som överenskommits i Sèvres invaderade Israel Sinai den 29 oktober; Storbritannien och Frankrike, som påstod sig vilja skilja parterna åt, bombade egyptiska flygfält från den 31 oktober och landsatte fallskärmsjägare och marinsoldater vid Port Said den 5–6 november, medan Egypten spärrade kanalen genom att sänka fartyg i den. USA, som utövade hårda ekonomiska påtryckningar på Storbritannien, och Sovjetunionen, som hotade att ingripa, motsatte sig båda anfallet, och Storbritannien och Frankrike godtog en vapenvila från FN som trädde i kraft natten mellan den 6 och 7 november. Deras trupper hade lämnat området senast den 22 december och ersattes av FN:s första fredsbevarande styrka, och Israel drog sig tillbaka från Sinai och Gaza i mars 1957. Israel förlorade 172 döda och Storbritannien och Frankrike några dussin; de egyptiska döda, soldater och civila, räknades aldrig på ett tillförlitligt sätt men uppgick enligt de flesta uppskattningar till flera tusen. Nassers anseende steg i hela arabvärlden, och den brittiske premiärministern Anthony Eden avgick i januari 1957.
