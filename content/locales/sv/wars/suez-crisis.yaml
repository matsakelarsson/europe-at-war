Known in Egypt as the Tripartite Aggression and in Israel as the Sinai War or Operation Kadesh; the Anglo-French landing was Operation Musketeer. The fighting took place outside the map.: I Egypten kallas den trepartsaggressionen och i Israel Sinaikriget eller operation Kadesh; den brittisk-franska landstigningen var operation Musketeer. Striderna ägde rum utanför kartan.
