Sugar Intervention: Sockerinterventionen
? The American military presence in eastern Cuba from 1917 to 1922. In November 1916 the Conservative president Mario García Menocal was re-elected in an election the Liberals said had been stolen, and on 11 February 1917 the Liberals rose under the former president José Miguel Gómez in the revolt called La Chambelona, after the Liberal campaign song; Alfredo Zayas, Gerardo Machado and Gómez’s son Miguel Mariano Gómez were among its leaders, and Liberal forces took up arms in Las Villas, Camagüey and Oriente. The United States announced that it would not recognise a government that took power by force, and from 12 February, at the request of American sugar planters, American sailors and then marines landed at Guantánamo, Santiago and other ports of Oriente to guard estates, mines and railways. Government troops defeated Gómez’s column near Placetas in Las Villas and captured him with his son and his escort at Caicaje on 8 March 1917. Fighting went on in Camagüey and Oriente into the spring, and by mid-1917 the revolt had been crushed; Menocal later pardoned the prisoners, Gómez after eleven months in prison. After the United States entered the First World War in April 1917, with Cuba declaring war on Germany the next day, the marines stayed, officially to train in a warm climate and to protect the sugar harvest the Allies depended on; the first contingent of under 1,000 arrived in August 1917, and more followed in 1918, among them 1,120 marines who reached Guantánamo in December. After a further disputed election in 1920 President Woodrow Wilson sent General Enoch Crowder, who arrived in January 1921 and for two years advised, and pressed, the Cuban government on its elections and finances. By 15 February 1922 the only American forces left in Cuba were at Guantánamo Bay.
: Den amerikanska militära närvaron på östra Kuba 1917–1922. I november 1916 omvaldes den konservative presidenten Mario García Menocal i ett val som liberalerna menade hade stulits, och den 11 februari 1917 reste sig liberalerna under förre presidenten José Miguel Gómez i det uppror som kallas La Chambelona, efter liberalernas valkampanjsång; Alfredo Zayas, Gerardo Machado och Miguel Mariano Gómez, son till José Miguel Gómez, hörde till dess ledare, och liberala styrkor grep till vapen i Las Villas, Camagüey och Oriente. USA meddelade att det inte skulle erkänna en regering som tog makten med våld, och från den 12 februari landsteg, på begäran av amerikanska sockerplantageägare, amerikanska sjömän och sedan marinkårssoldater i Guantánamo, Santiago och andra hamnar i Oriente för att skydda plantager, gruvor och järnvägar. Regeringstrupperna besegrade kolonnen under Gómez nära Placetas i Las Villas och tillfångatog honom tillsammans med hans son och hans eskort vid Caicaje den 8 mars 1917. Striderna fortsatte i Camagüey och Oriente in på våren, och vid mitten av 1917 hade upproret krossats; Menocal benådade senare fångarna, Gómez efter elva månader i fängelse. Sedan USA hade gått in i första världskriget i april 1917, och Kuba hade förklarat Tyskland krig dagen därpå, stannade marinkåren kvar, officiellt för att öva i ett varmt klimat och skydda den sockerskörd som de allierade var beroende av; den första kontingenten på under 1 000 man anlände i augusti 1917, och fler följde 1918, bland dem 1 120 marinkårssoldater som nådde Guantánamo i december. Efter ännu ett omstritt val 1920 sände president Woodrow Wilson general Enoch Crowder, som anlände i januari 1921 och i två år gav den kubanska regeringen råd, och utövade påtryckningar på den, om dess val och finanser. Den 15 februari 1922 fanns de enda amerikanska styrkor som var kvar på Kuba vid Guantánamobukten.
