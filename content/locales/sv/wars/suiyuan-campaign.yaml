# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
Suiyuan Campaign: Suiyuanfälttåget
? An attempt in late 1936 by Japanese-backed Mongol and Chinese forces to take the province of Suiyuan (today central Inner Mongolia), and its defeat by the provincial army of Fu Zuoyi. After the Japanese conquest of Rehe, the Kwantung Army encouraged the Mongol prince Demchugdongrub (De Wang), who set up a Mongol Military Government in northern Chahar in May 1936. Its Inner Mongolian Army, about 10,000 men, and the Grand Han Righteous Army of Wang Ying, about 6,000, advanced into Suiyuan in the autumn with Japanese advisers, armoured cars and aircraft; the operation was planned by Kwantung Army staff officers, among them Tanaka Ryūkichi. Fu Zuoyi’s 35th Army and allied troops, about 45,000 in all, held the village of Hongort against attacks on 15 and 16 November, counter-attacked on 17 November and then, in a surprise night attack with motor transport, took the Mongol base at Bailingmiao on 24 November. Most of Wang Ying’s army was destroyed or went over to the Chinese side in December. Captured equipment showed Japanese involvement, which the Japanese government denied. The victory was celebrated across China and added to the pressure on Chiang Kai-shek to stop fighting the Communists and resist Japan, which came to a head in the Xi’an Incident of 12 December 1936.
: Ett försök i slutet av 1936 av japanskstödda mongoliska och kinesiska styrkor att inta provinsen Suiyuan (dagens centrala Inre Mongoliet), och dess nederlag mot Fu Zuoyis provinsarmé. Efter den japanska erövringen av Rehe uppmuntrade Kwantungarmén den mongoliske prinsen Demchugdongrub (De Wang), som i maj 1936 inrättade en mongolisk militärregering i norra Chahar. Dess inremongoliska armé, omkring 10 000 man, och Wang Yings Stora hankinesiska rättfärdighetsarmén, omkring 6 000 man, ryckte på hösten in i Suiyuan med japanska rådgivare, pansarbilar och flygplan; operationen planerades av stabsofficerare i Kwantungarmén, bland dem Tanaka Ryūkichi. Fu Zuoyis 35:e armé och allierade trupper, sammanlagt omkring 45 000 man, höll byn Hongort mot anfall den 15 och 16 november, gick till motanfall den 17 november och intog sedan i ett överraskande nattanfall med motorfordon den mongoliska basen i Bailingmiao den 24 november. Större delen av Wang Yings armé förintades eller gick över till den kinesiska sidan i december. Erövrad materiel visade på japansk inblandning, vilket den japanska regeringen förnekade. Segern firades över hela Kina och ökade trycket på Chiang Kai-shek att sluta bekämpa kommunisterna och i stället göra motstånd mot Japan, något som ställdes på sin spets i Xi’anincidenten den 12 december 1936.
