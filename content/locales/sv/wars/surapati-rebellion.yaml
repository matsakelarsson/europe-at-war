# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
Surapati’s rebellion: Surapatis uppror
? The twenty-year resistance to the Dutch East India Company (VOC) of Untung Surapati, a Balinese-born former slave who built his own domain in East Java. Sold as a child in Batavia, Surapati escaped in the late 1670s and led a band of runaway slaves and Balinese in the hills of West Java. In 1683 the Company enlisted him and his men as a Balinese unit in the civil war in Banten, but in January 1684, after a Dutch officer insulted him and threatened to return his men to slavery, they attacked the officer’s camp and went east. Surapati was taken into the service of Amangkurat II of Mataram, whose chief minister led the court party opposed to the Company. When the VOC sent Captain François Tack to Kartasura to take him, Surapati’s men, with the connivance of the court, killed Tack and 74 of his soldiers on 8 February 1686. Surapati then moved to Pasuruan in East Java, where, under the name Tumenggung Wiranegara, he ruled a domain that by the 1690s reached from the eastern salient to Madiun; a Mataram army sent against him in 1690 was defeated. After Amangkurat II’s death in 1703 the Company backed his brother Pangeran Puger (Pakubuwono I) against the new king, Amangkurat III, who joined Surapati after the VOC and Puger took Kartasura in 1705. In 1706 a combined army of the Company, Kartasura and Madura attacked Surapati’s fortifications at Bangil; he was wounded and died on 5 December 1706. His sons and Amangkurat III fought on in the hills until 1708. Surapati was declared a National Hero of Indonesia in 1975.
: Untung Surapatis tjugoåriga motstånd mot Nederländska ostindiska kompaniet (VOC); han var en på Bali född före detta slav som byggde upp ett eget välde på östra Java. Surapati, som hade sålts som barn i Batavia, rymde i slutet av 1670-talet och ledde ett band av förrymda slavar och balineser i bergen på västra Java. År 1683 värvade kompaniet honom och hans män som en balinesisk enhet i inbördeskriget i Banten, men i januari 1684, sedan en nederländsk officer hade förolämpat honom och hotat att återföra hans män till slaveri, anföll de officerens läger och drog österut. Surapati togs i tjänst av Amangkurat II av Mataram, vars förste minister ledde det hovparti som motsatte sig kompaniet. När VOC sände kapten François Tack till Kartasura för att gripa honom dödade Surapatis män, med hovets tysta medgivande, Tack och 74 av hans soldater den 8 februari 1686. Surapati flyttade sedan till Pasuruan på östra Java, där han under namnet Tumenggung Wiranegara härskade över ett välde som på 1690-talet sträckte sig från Javas östligaste del till Madiun; en armé från Mataram som sändes mot honom 1690 besegrades. Efter Amangkurat II:s död 1703 stödde kompaniet hans bror Pangeran Puger (Pakubuwono I) mot den nye kungen, Amangkurat III, som anslöt sig till Surapati sedan VOC och Puger hade intagit Kartasura 1705. År 1706 anföll en förenad armé från kompaniet, Kartasura och Madura Surapatis befästningar vid Bangil; han sårades och dog den 5 december 1706. Hans söner och Amangkurat III fortsatte striden i bergen till 1708. Surapati utnämndes till Indonesiens nationalhjälte 1975.
