The main sources are the Rus’ Primary Chronicle, compiled in Kiev about 1113, and the Byzantine historians Leo the Deacon and John Skylitzes. They often disagree on dates. The Khazar campaign is dated anywhere from 965 to 969, and the first invasion of Bulgaria to 967 or 968.: De viktigaste källorna är Nestorskrönikan, sammanställd i Kiev omkring 1113, och de bysantinska historikerna Leon Diakonen och Johannes Skylitzes. De är ofta oense om dateringar. Fälttåget mot khazarerna dateras till allt från 965 till 969, och den första invasionen av Bulgarien till 967 eller 968.
Bulgarians, Pechenegs and Magyars fought against the Rus’ at some times and alongside them at others.: Bulgarer, petjeneger och magyarer stred ibland mot ruserna och ibland vid deras sida.
Dorostolon is today’s Silistra in Bulgaria, Philippopolis is Plovdiv, and Arcadiopolis is Lüleburgaz in Turkey. Pereyaslavets is thought to have stood near Nufăru in the Danube delta, in Romania.: Dorostolon är dagens Silistra i Bulgarien, Philippopolis är Plovdiv och Arkadiopolis är Lüleburgaz i Turkiet. Perejaslavets tros ha legat nära Nufăru i Donaudeltat i Rumänien.
Khazar moves: Khazariska trupprörelser
Khazar success: Khazariska framgångar
"Sviatoslav, the son of Igor and Olga, took over the government of Kiev from his mother in the early 960s and spent the rest of his life at war. The Primary Chronicle says he travelled like his warriors, without tents or wagons, and warned his enemies with a short message: “I want to come at you.” He first made the Vyatichi on the Oka, who paid tribute to the Khazars, pay it to Kiev instead. Under the year 965 the chronicle says he defeated the Khazars and took their fortress on the Don, Sarkel, which the Rus’ called Belaya Vezha, the White Tower.": "Svjatoslav, son till Igor och Olga, tog över styret i Kiev från sin mor i början av 960-talet och tillbringade resten av sitt liv i krig. Enligt Nestorskrönikan färdades han som sina krigare, utan tält eller vagnar, och varnade sina fiender med ett kort budskap: ”Jag vill gå mot er.” Först tvingade han vjatitjerna vid Oka, som betalade tribut till khazarerna, att i stället betala den till Kiev. Under år 965 berättar krönikan att han besegrade khazarerna och intog deras fästning vid Don, Sarkel, som ruserna kallade Belaja Vezja, Vita tornet."
The Arab geographer Ibn Hawqal wrote that the Rus’ sacked the Khazar capital Atil in the Volga delta, Samandar on the Caspian coast and Bulghar on the middle Volga, around 968–969. Many historians link these raids to Sviatoslav, although the order of events is disputed. The chronicle also tells of victories over the Alans and the Circassians of the north Caucasus. Sviatoslav did not try to rule the Khazar lands, but the khaganate, for two centuries the leading power of the steppe, never recovered, and the Pechenegs and other nomads took its place.: Den arabiske geografen Ibn Hawqal skrev att ruserna plundrade den khazariska huvudstaden Itil i Volgadeltat, Samandar vid Kaspiska havets kust och Bulgar vid mellersta Volga omkring 968–969. Många historiker sätter dessa härjningar i samband med Svjatoslav, även om händelseförloppet är omstritt. Krönikan berättar också om segrar över alanerna och tjerkesserna i norra Kaukasus. Svjatoslav försökte inte härska över de khazariska länderna, men khaganatet, som i två sekler varit stäppens ledande makt, återhämtade sig aldrig, och petjenegerna och andra nomader tog dess plats.
