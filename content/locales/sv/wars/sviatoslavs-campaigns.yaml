Sviatoslav’s campaigns: Svjatoslavs fälttåg
The wars of Sviatoslav I of Kiev, who broke the power of the Khazar khaganate on the Don and the Volga, then invaded Bulgaria at Byzantium’s invitation and tried to keep it for himself. Defeated by the Byzantine emperor John I Tzimiskes at Dorostolon in 971, he was killed by the Pechenegs at the Dnieper rapids on his way home.: Svjatoslav I av Kievs krig; han krossade det khazariska khaganatets makt vid Don och Volga, invaderade sedan Bulgarien på Bysans inbjudan och försökte behålla landet för egen del. Sedan han besegrats av den bysantinske kejsaren Johannes I Tzimiskes vid Dorostolon 971 dödades han av petjenegerna vid Dneprforsarna på hemvägen.
