The Khazars’ brick fortress on the lower Don, built with Byzantine help in the 830s. The Rus’ kept it as an outpost. Its ruins now lie under the Tsimlyansk Reservoir.: Khazarernas tegelfästning vid nedre Don, byggd med bysantinsk hjälp på 830-talet. Ruserna behöll den som utpost. Ruinerna ligger i dag under Tsimljanskreservoaren.
Atil: Itil
c. 968–969: ca 968–969
The Khazar capital in the Volga delta was sacked and never recovered. Its exact site is unknown; the settlement found at Samosdelka is one candidate.: Den khazariska huvudstaden i Volgadeltat plundrades och återhämtade sig aldrig. Dess exakta läge är okänt; boplatsen vid Samosdelka är en kandidat.
Sviatoslav: Svjatoslav
In 966 the Byzantine emperor Nikephoros II Phokas stopped paying the tribute promised to Bulgaria in 927. Rather than fight in the Bulgarian mountains, he paid Sviatoslav to attack from the north; his envoy, Kalokyros of Cherson, is said to have brought 1,500 pounds of gold. In August 967 or 968 the Rus’ sailed along the Black Sea coast, crossed the Danube, beat a Bulgarian army and overran the Dobruja. Sviatoslav settled at Pereyaslavets in the Danube delta. In 968 the Pechenegs besieged Kiev, and he hurried home to drive them off.: År 966 slutade den bysantinske kejsaren Nikeforos II Fokas att betala den tribut som utlovats till Bulgarien 927. I stället för att strida i de bulgariska bergen betalade han Svjatoslav för att anfalla från norr; hans sändebud, Kalokyros från Cherson, sägs ha haft med sig 1 500 pund guld. I augusti 967 eller 968 seglade ruserna längs Svarta havets kust, gick över Donau, slog en bulgarisk armé och överskred Dobrudja. Svjatoslav slog sig ned i Perejaslavets i Donaudeltat. År 968 belägrade petjenegerna Kiev, och han skyndade hem för att driva bort dem.
His mother Olga died in 969. Sviatoslav set his sons over Kiev, the Drevlian land and Novgorod and returned to the Danube, saying, in the chronicle’s words, that Pereyaslavets would be the centre of his lands, where all good things flowed. He stormed the Bulgarian capital, Preslav, and kept Tsar Boris II as a figurehead. In early 970 his army of Rus’, Bulgarians, Pechenegs and Magyars crossed the Balkan Mountains and sacked Philippopolis, where Leo the Deacon says 20,000 people were impaled. Near Arcadiopolis in Thrace the Byzantine general Bardas Skleros drew the Pechenegs into an ambush and routed the invaders.: Hans mor Olga dog 969. Svjatoslav satte sina söner över Kiev, drevljanernas land och Novgorod och återvände till Donau, och sade enligt krönikan att Perejaslavets skulle bli mittpunkten i hans länder, dit allt gott strömmade. Han stormade den bulgariska huvudstaden Preslav och behöll tsar Boris II som galjonsfigur. I början av 970 gick hans armé av ruser, bulgarer, petjeneger och magyarer över Balkanbergen och plundrade Philippopolis, där enligt Leon Diakonen 20 000 människor spetsades på pålar. Nära Arkadiopolis i Thrakien lockade den bysantinske generalen Bardas Skleros in petjenegerna i ett bakhåll och slog inkräktarna på flykten.
