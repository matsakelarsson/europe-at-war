Dorostolon: Dorostolon
August 967 or 968: augusti 967 eller 968
The Rus’ beat a Bulgarian army after crossing the Danube, and the Bulgarians withdrew into the fortress.: Ruserna slog en bulgarisk armé efter att ha gått över Donau, och bulgarerna drog sig tillbaka in i fästningen.
Pereyaslavets: Perejaslavets
Sviatoslav’s seat on the Danube, a trading town thought to have stood near today’s Nufăru in Romania.: Svjatoslavs säte vid Donau, en handelsstad som tros ha legat nära dagens Nufăru i Rumänien.
The Pechenegs besieged the city, where Olga and Sviatoslav’s sons were. The chronicle says a small force under the voivode Pretich bluffed them into a truce, and Sviatoslav then drove them into the steppe.: Petjenegerna belägrade staden, där Olga och Svjatoslavs söner befann sig. Enligt krönikan lurade en liten styrka under vojvoden Pretitj dem att gå med på ett stillestånd, och Svjatoslav drev sedan ut dem på stäppen.
Sviatoslav stormed the Bulgarian capital and ruled through Tsar Boris II, who stayed there as his vassal.: Svjatoslav stormade den bulgariska huvudstaden och härskade genom tsar Boris II, som stannade kvar där som hans vasall.
Early 970: början av 970
The Rus’ stormed and sacked the city. Leo the Deacon writes that 20,000 surviving inhabitants were impaled.: Ruserna stormade och plundrade staden. Leon Diakonen skriver att 20 000 överlevande invånare spetsades på pålar.
Spring 970: våren 970
Bardas Skleros, with perhaps 10,000–12,000 men, lured the Pecheneg contingent into an ambush with a feigned retreat, and the rest of the Rus’ army fled north.: Bardas Skleros, med kanske 10 000–12 000 man, lockade den petjenegiska kontingenten i ett bakhåll genom en låtsad reträtt, och resten av den ryska armén flydde norrut.
Rus’ fleet: Rusisk flotta
Held by the Rus’ in 969–970 (approximate): I rusernas händer 969–970 (ungefärligt)
John I Tzimiskes, who had murdered Nikephoros and taken the throne in December 969, first put down a revolt in Asia Minor. In the spring of 971 he marched north with perhaps 30,000–40,000 men, while a fleet carrying Greek fire sailed for the Danube. The passes through the Balkan Mountains were unguarded. Preslav was stormed on 13 April and Boris II was captured. Sviatoslav, who had some 300 Bulgarian nobles executed for fear of a rising, fell back to Dorostolon on the Danube, where the Byzantines besieged him by land and river.: Johannes I Tzimiskes, som hade mördat Nikeforos och tagit tronen i december 969, slog först ned ett uppror i Mindre Asien. Våren 971 marscherade han norrut med kanske 30 000–40 000 man, medan en flotta med grekisk eld seglade mot Donau. Passen genom Balkanbergen var obevakade. Preslav stormades den 13 april och Boris II tillfångatogs. Svjatoslav, som lät avrätta omkring 300 bulgariska adelsmän av rädsla för ett uppror, drog sig tillbaka till Dorostolon vid Donau, där bysantinerna belägrade honom från land och flod.
The siege lasted about three months, with several battles outside the walls. Starving and cut off, the Rus’ came to terms in late July. They gave up Bulgaria and their captives, swore never again to attack Byzantine lands, and were given food for the journey; Leo the Deacon describes Sviatoslav rowing his own boat to meet the emperor. Tzimiskes annexed eastern Bulgaria. The Rus’ wintered hungry at the mouth of the Dnieper. In the spring of 972, as they passed the rapids, the Pecheneg khan Kurya ambushed them and killed Sviatoslav, and the chronicle says he made a drinking cup of his skull.: Belägringen varade omkring tre månader, med flera slag utanför murarna. Svältande och avskurna kom ruserna överens om villkor i slutet av juli. De gav upp Bulgarien och sina fångar, svor att aldrig mer anfalla bysantinskt land och fick livsmedel för resan; Leon Diakonen beskriver hur Svjatoslav själv rodde sin båt för att möta kejsaren. Tzimiskes annekterade östra Bulgarien. Ruserna övervintrade hungriga vid Dneprs mynning. Våren 972, när de passerade forsarna, överföll petjenegernas khan Kurja dem i ett bakhåll och dödade Svjatoslav, och enligt krönikan lät han göra en dryckesbägare av hans skalle.
