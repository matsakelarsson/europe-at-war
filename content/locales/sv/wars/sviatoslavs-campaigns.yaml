The Byzantines stormed the Bulgarian capital and captured Boris II and his family. Tzimiskes renamed the city Ioannopolis after himself.: Bysantinerna stormade den bulgariska huvudstaden och tillfångatog Boris II och hans familj. Tzimiskes döpte om staden till Ioannopolis efter sig själv.
April – July 971: april – juli 971
The Byzantine army and fleet blockaded the Rus’ in the fortress. After a last, bloody battle in late July, Sviatoslav agreed to leave Bulgaria.: Den bysantinska armén och flottan blockerade ruserna i fästningen. Efter ett sista blodigt slag i slutet av juli gick Svjatoslav med på att lämna Bulgarien.
Winter at the Dnieper mouth: Vintern vid Dneprs mynning
The Rus’ wintered at a place the chronicle calls Beloberezhye, probably near the Dnieper estuary, where famine set in.: Ruserna övervintrade på en plats som krönikan kallar Beloberezje, troligen nära Dneprs mynningsvik, där svälten satte in.
Dnieper rapids: Dneprforsarna
Spring 972: våren 972
The Pechenegs ambushed Sviatoslav at the rapids, traditionally near the island of Khortytsia, and killed him with most of his men.: Petjenegerna överföll Svjatoslav i ett bakhåll vid forsarna, traditionellt nära ön Chortytsia, och dödade honom och de flesta av hans män.
