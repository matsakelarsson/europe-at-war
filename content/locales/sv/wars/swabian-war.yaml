Confederates: De edsförbundna
Dates are Julian, as usual for the period. The war is called the Schwabenkrieg (Swabian War) in Switzerland and the Schweizerkrieg (Swiss War) in Germany; in Austria it was also called the Engadine War.: Datumen är julianska, som brukligt för perioden. Kriget kallas Schwabenkrieg (Schwabiska kriget) i Schweiz och Schweizerkrieg (Schweiziska kriget) i Tyskland; i Österrike kallades det också Engadinkriget.
The Swabian League, founded in 1488, joined the Swabian imperial cities and knights with the Habsburg lands and the Count of Württemberg. Maximilian I had been king of the Romans since 1486 and ruled all the Habsburg lands from 1493.: Schwabiska förbundet, grundat 1488, förenade de schwabiska riksstäderna och riddarna med de habsburgska länderna och greven av Württemberg. Maximilian I hade varit romersk kung sedan 1486 och styrde alla de habsburgska länderna från 1493.
Habsburg and Swabian moves: Habsburgska och schwabiska trupprörelser
Habsburg and Swabian success: Habsburgska och schwabiska framgångar
The Swiss had refused the reforms of the Diet of Worms in 1495, with its new imperial court and tax, and would not join the Swabian League on their northern border. The spark came in the Grisons, whose Three Leagues had allied with the Confederates in 1497–98. On 20 January 1499 Habsburg troops from Tyrol occupied the Val Müstair, on the route from Tyrol to Milan, and plundered its convent. They were driven out and a truce was made, but troops from Uri, coming to help the Leagues, clashed with Habsburg soldiers on the Rhine, and within weeks the war had spread along the whole frontier.: Schweizarna hade vägrat godta reformerna från riksdagen i Worms 1495, med dess nya rikskammarrätt och riksskatt, och ville inte ansluta sig till Schwabiska förbundet vid sin norra gräns. Gnistan kom i Graubünden, vars tre förbund hade slutit förbund med edsförbundet 1497–98. Den 20 januari 1499 ockuperade habsburgska trupper från Tyrolen Val Müstair, på vägen från Tyrolen till Milano, och plundrade dess kloster. De drevs ut och ett stillestånd slöts, men trupper från Uri, som kom förbunden till hjälp, drabbade samman med habsburgska soldater vid Rhen, och inom några veckor hade kriget spridit sig längs hela gränsen.
The Swabian League called up its forces, and Maximilian placed the Confederates under the imperial ban. The war became a series of raids, burnings and plundering expeditions by both sides, broken by battles that the experienced Swiss infantry nearly always won, at Hard on Lake Constance on 20 February, Bruderholz near Basel on 22 March, Schwaderloh near Constance on 11 April and Frastanz near Feldkirch on 20 April. On 22 May the men of the Three Leagues stormed the Habsburg entrenchments at the Calven gorge near Glurns and ravaged the Vinschgau before Maximilian could arrive.: "Schwabiska förbundet kallade in sina styrkor, och Maximilian förklarade de edsförbundna i riksacht. Kriget blev en serie räder, brandskattningar och plundringståg från båda sidor, avbrutna av slag som det erfarna schweiziska infanteriet nästan alltid vann: vid Hard vid Bodensjön den 20 februari, Bruderholz nära Basel den 22 mars, Schwaderloh nära Konstanz den 11 april och Frastanz nära Feldkirch den 20 april. Den 22 maj stormade männen från De tre förbunden de habsburgska förskansningarna i Calvenravinen nära Glurns och härjade Vinschgau innan Maximilian hann fram."
