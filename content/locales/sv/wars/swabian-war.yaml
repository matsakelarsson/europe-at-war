Swabian War: Schwabiska kriget
The last great war between the Swiss Confederacy and the Habsburgs, fought from the Grisons to Basel against King Maximilian I and the Swabian League. The Swiss and their allies of the Three Leagues won almost every battle, ending at Dornach, and the Peace of Basel freed them from the imperial reforms of 1495, so that in practice they stood outside the Empire.: Det sista stora kriget mellan Schweiziska edsförbundet och habsburgarna, utkämpat från Graubünden till Basel mot kung Maximilian I och Schwabiska förbundet. Schweizarna och deras allierade i De tre förbunden vann nästan varje slag, det sista vid Dornach, och freden i Basel befriade dem från rikesreformerna 1495, så att de i praktiken stod utanför riket.
