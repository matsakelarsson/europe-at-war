The Confederates beat a Habsburg army in the Ill valley below Feldkirch, in what is now Vorarlberg.: De edsförbundna slog en habsburgsk armé i Illdalen nedanför Feldkirch, i nuvarande Vorarlberg.
22 May 1499: 22 maj 1499
The Leagues overran the fortified camp in the gorge, routed the Tyrolean army and plundered the upper Vinschgau for three days.: Förbunden överskred det befästa lägret i ravinen, slog den tyrolska armén på flykten och plundrade övre Vinschgau i tre dagar.
Three Leagues: De tre förbunden
Maximilian came to Lake Constance to take command, but the Swabian League refused to send its troops to the Grisons, and for weeks little happened. By July his unpaid mercenaries and the League’s peasant soldiers, eager to bring in the harvest, were close to leaving. On 21 July a Swabian force crossed the lake and burned Rheineck and Rorschach. The next day an army of about 16,000 under Count Heinrich von Fürstenberg, besieging the castle of Dorneck above Dornach near Basel, was attacked by a hurriedly gathered Confederate army. Fürstenberg was killed early on, and after a long, hard fight the Swabians fled, leaving about 3,000 dead and all their guns.: Maximilian kom till Bodensjön för att ta befälet, men Schwabiska förbundet vägrade sända sina trupper till Graubünden, och i flera veckor hände inte mycket. I juli var hans obetalda legosoldater och förbundets bondesoldater, som ville bärga skörden, nära att ge sig av. Den 21 juli korsade en schwabisk styrka sjön och brände Rheineck och Rorschach. Dagen därpå angreps en armé på omkring 16 000 man under greve Heinrich von Fürstenberg, som belägrade borgen Dorneck ovanför Dornach nära Basel, av en hastigt sammandragen armé från edsförbundet. Fürstenberg stupade tidigt, och efter en lång och hård strid flydde schwaberna och lämnade omkring 3 000 döda och alla sina kanoner efter sig.
Neither side wanted to go on, and the Duke of Milan, who needed both Swiss soldiers and Maximilian’s help against France, mediated. The Peace of Basel, signed on 22 September 1499, treated the war as one between the Confederates and the Habsburgs rather than the Empire. The imperial ban was quietly dropped, and the Confederates stayed outside the new imperial court and taxes. No land changed hands, but the Confederates took over the high court of the Thurgau from the city of Constance. Formally the Swiss stayed in the Empire until 1648; in practice they had left it.: Ingen av sidorna ville fortsätta, och hertigen av Milano, som behövde både schweiziska soldater och Maximilians hjälp mot Frankrike, medlade. Freden i Basel, undertecknad den 22 september 1499, behandlade kriget som ett krig mellan edsförbundet och habsburgarna snarare än riket. Riksachten släpptes i tysthet, och de edsförbundna förblev utanför den nya rikskammarrätten och riksskatterna. Inget land bytte ägare, men edsförbundet övertog den högre domsrätten i Thurgau från staden Konstanz. Formellt stannade schweizarna kvar i riket till 1648; i praktiken hade de lämnat det.
