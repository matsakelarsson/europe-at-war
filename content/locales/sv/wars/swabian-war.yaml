22 March 1499: 22 mars 1499
Swabian troops returning from a raid on Dornach were beaten by a smaller Swiss force on the hill south of Basel.: Schwabiska trupper som återvände från en räd mot Dornach slogs av en mindre schweizisk styrka på höjden söder om Basel.
11 April 1499: 11 april 1499
Swabian raiders on the south shore of Lake Constance were caught near Triboltingen by Swiss troops from their camp at Schwaderloh and fled, leaving their guns.: Schwabiska plundrare på Bodensjöns södra strand överraskades nära Triboltingen av schweiziska trupper från deras läger vid Schwaderloh och flydde och lämnade sina kanoner efter sig.
