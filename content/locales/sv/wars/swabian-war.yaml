21 July 1499: 21 juli 1499
One of the few Swabian successes. Troops crossed Lake Constance by boat, surprised the small Swiss garrison and burned the two places.: En av få schwabiska framgångar. Trupper korsade Bodensjön med båtar, överraskade den lilla schweiziska garnisonen och brände de två orterna.
22 July 1499: 22 juli 1499
The last battle of the war. The Swabian army was surprised in its camp below Dorneck castle; Fürstenberg fell early in the fighting.: Krigets sista slag. Den schwabiska armén överraskades i sitt läger nedanför borgen Dorneck; Fürstenberg stupade tidigt i striden.
Mediated by Milan. Basel, which had stayed neutral, joined the Confederacy two years later, as did Schaffhausen.: Medlad av Milano. Basel, som hade förblivit neutralt, anslöt sig till edsförbundet två år senare, liksom Schaffhausen.
