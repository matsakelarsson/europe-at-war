Battle of Hard: Slaget vid Hard
20 February 1499: 20 februari 1499
A Confederate army that had marched down the Rhine valley beat a Habsburg and Swabian force on the shore of Lake Constance near the river’s mouth.: En armé från edsförbundet som hade marscherat nedför Rhendalen slog en habsburgsk och schwabisk styrka vid Bodensjöns strand nära flodens mynning.
