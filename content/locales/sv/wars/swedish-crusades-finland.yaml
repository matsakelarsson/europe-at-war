The sequence for the Tavastia expedition follows the traditional date of about 1249–1250. Some historians place it before the battle on the Neva.: Förloppet för tåget till Tavastland följer den traditionella dateringen omkring 1249–1250. Vissa historiker förlägger det före slaget vid Neva.
"Medieval Sweden pushed east across the Baltic. Later chronicles tell of a first crusade to south-western Finland in the 1150s under King Eric and Bishop Henry, though historians doubt how much of the story is true. Raids went both ways: in 1164 Swedes attacked Ladoga, and in 1187 raiders from the eastern Baltic sacked Sigtuna.": "Det medeltida Sverige trängde österut över Östersjön. Senare krönikor berättar om ett första korståg till sydvästra Finland på 1150-talet under kung Erik och biskop Henrik, men historikerna tvivlar på hur mycket av berättelsen som är sant. Härjningarna gick åt båda hållen: 1164 angrep svenskar Ladoga, och 1187 plundrade härjare från östra Östersjöområdet Sigtuna."
In July 1240 a Swedish force that sailed up the Neva was beaten by Prince Alexander of Novgorod, who earned the name Nevsky for it. Sweden turned instead to Tavastia in inner Finland. Around 1249–1250 Birger Jarl led an expedition there, defeated the Tavastians and began building a castle, bringing the region under Swedish rule.: I juli 1240 besegrades en svensk styrka som seglat uppför Neva av furst Aleksandr av Novgorod, som därigenom fick namnet Nevskij. Sverige vände sig i stället mot Tavastland i det inre av Finland. Omkring 1249–1250 ledde Birger jarl ett tåg dit, besegrade tavasterna och började bygga en borg, vilket förde in området under svenskt styre.
