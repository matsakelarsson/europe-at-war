Mid-1100s (legend): Mitten av 1100-talet (legend)
Legend says King Eric and Bishop Henry led a crusade here. Whatever its truth, south-western Finland came under the Swedish church and crown in the 12th and 13th centuries.: Enligt legenden ledde kung Erik och biskop Henrik ett korståg hit. Oavsett hur det förhåller sig med det kom sydvästra Finland under den svenska kyrkan och kronan på 1100- och 1200-talen.
July 1240: juli 1240
Alexander of Novgorod surprised a Swedish force camped where the Izhora joins the Neva. The battle is known mainly from the Novgorod chronicle.: Aleksandr av Novgorod överraskade en svensk styrka som slagit läger där Izjora rinner ut i Neva. Slaget är främst känt från Novgorodkrönikan.
c. 1249–1250: ca 1249–1250
Birger Jarl defeated the Tavastians and began a castle, traditionally identified as Häme Castle, though it may have been the older Hakoinen.: Birger jarl besegrade tavasterna och påbörjade en borg, som traditionellt identifieras med Tavastehus slott, men som kan ha varit den äldre Hakoinen.
