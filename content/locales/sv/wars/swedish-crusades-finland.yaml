Swedish crusades into Finland: Svenska korståg till Finland
Swedish expeditions into Finland, remembered as crusades, and raids across the Baltic between Sweden, Novgorod and the peoples of the eastern Baltic, from the legendary first crusade of the 1150s to the Battle of the Neva in 1240 and Birger Jarl’s conquest of Tavastia around 1249–1250.: Svenska expeditioner till Finland, ihågkomna som korståg, och härjningar över Östersjön mellan Sverige, Novgorod och folken i östra Östersjöområdet, från det legendariska första korståget på 1150-talet till slaget vid Neva 1240 och Birger jarls erövring av Tavastland omkring 1249–1250.
