Swedish–Norwegian War: Svensk-norska kriget
A short war in which Sweden forced Norway, which had declared independence and adopted its own constitution after the Treaty of Kiel, into a union under the Swedish king. The Convention of Moss ended the fighting after two weeks, and Norway kept its constitution and parliament.: Ett kort krig där Sverige tvingade Norge, som efter freden i Kiel hade förklarat sig självständigt och antagit en egen grundlag, in i en union under den svenske kungen. Konventionen i Moss avslutade striderna efter två veckor, och Norge behöll sin grundlag och sitt storting.
