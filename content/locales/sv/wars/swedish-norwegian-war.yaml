The last battle of Sweden’s last war. The Norwegians fell back and the way to Christiania was open.: Det sista slaget i Sveriges sista krig. Norrmännen drog sig tillbaka och vägen till Christiania låg öppen.
A ceasefire that became the basis of the union. Norway kept its constitution and its own parliament.: Ett vapenstillestånd som blev grunden för unionen. Norge behöll sin grundlag och sitt eget parlament.
