Norwegian success: Norska framgångar
Norway declared independence, adopted a constitution at Eidsvoll on 17 May 1814 and chose the Danish prince Christian Frederick as king. At the end of July Charles John invaded with a much larger army, taking the Hvaler islands and the fortress town of Fredrikstad.: Norge förklarade sig självständigt, antog en grundlag i Eidsvoll den 17 maj 1814 och valde den danske prinsen Christian Frederik till kung. I slutet av juli gick Karl Johan till anfall med en mycket större armé och intog Hvaleröarna och fästningsstaden Fredrikstad.
On the Kongsvinger front the Norwegians stopped the Swedes at Lier on 2 August and Matrand on 5 August, but on 14 August the Swedes forced the Kjølberg bridge and the road to Christiania lay open. That same day the Convention of Moss ended the fighting. Charles John accepted Norway’s constitution, and on 4 November 1814 the Storting elected Charles XIII king of Norway, joining the two kingdoms in a union. Sweden has not fought a war since.: Vid Kongsvingerfronten hejdade norrmännen svenskarna vid Lier den 2 augusti och vid Matrand den 5 augusti, men den 14 augusti forcerade svenskarna Kjølberg bro och vägen till Christiania låg öppen. Samma dag avslutade konventionen i Moss striderna. Karl Johan godtog Norges grundlag, och den 4 november 1814 valde stortinget Karl XIII till kung av Norge, vilket förenade de två rikena i en union. Sverige har inte utkämpat något krig sedan dess.
