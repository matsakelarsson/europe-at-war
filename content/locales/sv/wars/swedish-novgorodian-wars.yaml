Viborg: Viborg
In 1293 a Swedish army under the marshal Torgils Knutsson won part of western Karelia and built Viborg Castle on the site of a destroyed Karelian fort. In 1300 the Swedes went further, building a fortress called Landskrona where the Okhta meets the Neva, but Novgorod soon destroyed it.: År 1293 erövrade en svensk här under marsken Torgils Knutsson en del av västra Karelen och byggde Viborgs slott på platsen för en förstörd karelsk borg. År 1300 gick svenskarna längre och byggde en fästning kallad Landskrona där Ochta möter Neva, men Novgorod förstörde den snart.
Novgorod hit back hard. In 1318 its forces burned Turku and its cathedral, and a few years later they besieged Viborg and built the fortress of Oreshek, Nöteborg in Swedish, where the Neva leaves Lake Ladoga. There, on 12 August 1323, the two sides agreed on their first border, dividing Karelia between them. How far north the line ran is still debated.: Novgorod slog hårt tillbaka. År 1318 brände dess styrkor Åbo och dess domkyrka, och några år senare belägrade de Viborg och byggde fästningen Oresjek, på svenska Nöteborg, där Neva rinner ut ur Ladoga. Där kom de två parterna den 12 augusti 1323 överens om sin första gräns, som delade Karelen mellan dem. Hur långt norrut gränsen gick är fortfarande omstritt.
