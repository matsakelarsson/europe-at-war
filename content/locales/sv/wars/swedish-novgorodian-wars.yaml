Treaty of Nöteborg: Freden i Nöteborg
12 August 1323, the first Swedish–Novgorodian border: 12 augusti 1323, den första gränsen mellan Sverige och Novgorod
Built as the easternmost outpost of the kingdom. Western Karelia stayed Swedish until 1721.: Byggt som rikets östligaste utpost. Västra Karelen förblev svenskt till 1721.
Landskrona: Landskrona
A Swedish fortress at the mouth of the Okhta on the Neva. Novgorod stormed and destroyed it soon after it was built.: En svensk fästning vid Ochtas mynning i Neva. Novgorod stormade och förstörde den kort efter att den byggts.
Turku burned: Åbo bränns
A Novgorodian raid burned the town and its cathedral, as well as the bishop’s castle at Kuusisto.: Ett novgorodiskt härjningståg brände staden och dess domkyrka samt biskopens borg i Kustö.
12 August 1323: 12 augusti 1323
Called simply a “permanent peace” at the time. It remained the basis of the eastern border until 1595.: Kallades på sin tid helt enkelt en ”evig fred”. Den förblev grunden för den östra gränsen fram till 1595.
Torgils Knutsson: Torgils Knutsson
Swedish by 1323: Svenskt 1323
In 1348 King Magnus Eriksson, encouraged by the visionary Bridget of Sweden, challenged Novgorod to a debate on religion and then attacked. He led his army up the Neva and took Nöteborg.: År 1348 utmanade kung Magnus Eriksson, uppmuntrad av visionären Birgitta, Novgorod till en religionsdisputation och gick sedan till anfall. Han ledde sin här uppför Neva och intog Nöteborg.
The Novgorodians won the fortress back in 1349 after a seven-month siege, and the Black Death, then spreading through the West, ended Magnus’s plans. The fighting petered out by 1351 with the old border unchanged.: Novgoroderna återtog fästningen 1349 efter en sju månader lång belägring, och digerdöden, som då spred sig i Västeuropa, gjorde slut på Magnus planer. Striderna ebbade ut till 1351 och den gamla gränsen förblev oförändrad.
No change of border: Ingen gränsförändring
Taken by the Swedes in 1348, retaken by Novgorod in 1349: Intogs av svenskarna 1348, återtogs av Novgorod 1349
Magnus took the fortress in 1348. Novgorod won it back the next year after a seven-month siege.: Magnus intog fästningen 1348. Novgorod återtog den året därpå efter en sju månader lång belägring.
The castle guarding Sweden’s eastern frontier and the base for the campaign.: Borgen som vaktade Sveriges östgräns och utgångspunkten för fälttåget.
