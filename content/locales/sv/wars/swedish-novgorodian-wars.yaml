Swedish–Novgorodian wars: Svensk-novgorodska krigen
Wars between Sweden and the Novgorod Republic over Karelia and the Neva, from the founding of Viborg in 1293 to the Treaty of Nöteborg in 1323, which set the first border between them, and King Magnus Eriksson’s failed crusade of 1348–1351.: Krig mellan Sverige och republiken Novgorod om Karelen och Neva, från grundandet av Viborg 1293 till freden i Nöteborg 1323, som drog den första gränsen mellan dem, och kung Magnus Erikssons misslyckade korståg 1348–1351.
