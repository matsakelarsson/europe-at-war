January 1521: januari 1521
Representatives of northern Dalarna made Gustav their commander. Legend says he had first fled on skis.: Representanter för norra Dalarna gjorde Gustav till sin hövitsman. Enligt legenden hade han först flytt på skidor.
Battle of Västerås: Slaget vid Västerås
29 April 1521: 29 april 1521
The rebel army took and plundered the town, and supporters of the Sture family joined the revolt.: Upprorshären intog och plundrade staden, och anhängare till sturesläkten anslöt sig till upproret.
27 May 1523: 27 maj 1523
The strong castle on the east coast fell to Gustav’s forces.: Den starka borgen på ostkusten föll i händerna på Gustavs styrkor.
6 June 1523: 6 juni 1523
The council chose Gustav as king at Strängnäs. The day is celebrated as Sweden’s national day.: Rådet valde Gustav till kung i Strängnäs. Dagen firas som Sveriges nationaldag.
Stockholm surrenders: Stockholm kapitulerar
17 June 1523: 17 juni 1523
The city and castle capitulated, and Gustav rode in on Midsummer Eve.: Staden och slottet kapitulerade, och Gustav red in på midsommarafton.
