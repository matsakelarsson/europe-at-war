Kalmar: Kalmar
Gustav Eriksson Vasa escaped to Dalarna, and in January 1521 the people of northern Dalarna made him their commander. His peasant army took Västerås on 29 April 1521, the Sture party joined him, and later that year he became regent. In 1522 the Hanseatic city of Lübeck joined the war against Denmark with ships and money.: Gustav Eriksson Vasa flydde till Dalarna, och i januari 1521 gjorde folket i norra Dalarna honom till sin hövitsman. Hans bondehär intog Västerås den 29 april 1521, sturepartiet anslöt sig till honom och senare samma år blev han riksföreståndare. År 1522 gick hansestaden Lübeck med i kriget mot Danmark med fartyg och pengar.
Kalmar fell on 27 May 1523. On 6 June, now Sweden’s national day, Gustav was elected king at Strängnäs, and Stockholm surrendered on 17 June after a siege of about two years. By September Finland too was in his hands. The Kalmar Union was over.: Kalmar föll den 27 maj 1523. Den 6 juni, i dag Sveriges nationaldag, valdes Gustav till kung i Strängnäs, och Stockholm kapitulerade den 17 juni efter en belägring på omkring två år. I september var även Finland i hans händer. Kalmarunionen var till ända.
