Swedish War of Liberation: Befrielsekriget
The Swedish rising led by Gustav Vasa against Christian II of Denmark–Norway after the Stockholm Bloodbath. With help from Lübeck, Gustav drove out the Danish forces and was elected king in 1523, which ended the Kalmar Union.: Det svenska upproret under Gustav Vasa mot Kristian II av Danmark–Norge efter Stockholms blodbad. Med hjälp från Lübeck drev Gustav ut de danska styrkorna och valdes till kung 1523, vilket innebar slutet för Kalmarunionen.
