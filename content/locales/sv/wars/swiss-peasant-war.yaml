Swiss Peasant War: Schweiziska bondekriget
A rising of the rural subjects of Lucerne, Bern, Solothurn and Basel against their city governments, set off when the end of the Thirty Years’ War brought falling grain prices and Bern, Fribourg and Solothurn devalued their coins in December 1652. It began in February 1653 in the Entlebuch valley of Lucerne and spread to the Emmental and beyond, and on 14 May peasants from all four territories swore a league at Huttwil under Niklaus Leuenberger of Bern, demanding the right to hold their own assemblies. Peasant armies blockaded Bern and Lucerne, and Bern made terms at Murifeld on 28 May, but the Confederation’s army under Konrad Werdmüller beat the rebels at Wohlenschwil on 3 June and Bernese troops crushed them at Herzogenbuchsee on 8 June. Bern then repudiated its treaty. Leaders were executed, including Christian Schybi of the Entlebuch and Leuenberger, beheaded in Bern on 6 September, and many others were sent to the galleys or banished.: Ett uppror bland landsbygdens undersåtar i Luzern, Bern, Solothurn och Basel mot stadsregeringarna, utlöst när slutet på trettioåriga kriget ledde till fallande spannmålspriser och Bern, Fribourg och Solothurn devalverade sina mynt i december 1652. Det började i februari 1653 i Entlebuchdalen i Luzern och spred sig till Emmental och längre bort, och den 14 maj svor bönder från alla fyra områdena ett förbund i Huttwil under Niklaus Leuenberger från Bern och krävde rätten att hålla egna sammankomster. Bondearméer blockerade Bern och Luzern, och Bern ingick en överenskommelse vid Murifeld den 28 maj, men edsförbundets armé under Konrad Werdmüller besegrade rebellerna vid Wohlenschwil den 3 juni och bernska trupper krossade dem vid Herzogenbuchsee den 8 juni. Bern sade då upp sitt avtal. Ledarna avrättades, bland dem Christian Schybi från Entlebuch och Leuenberger, som halshöggs i Bern den 6 september, och många andra skickades till galärerna eller förvisades.
