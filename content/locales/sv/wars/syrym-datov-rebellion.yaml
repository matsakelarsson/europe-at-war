# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
Syrym Datov’s rebellion: Syrym Datovs uppror
? A rising of the Kazakhs of the Junior Zhuz (Little Horde), in the steppe east of the lower Ural river, against the Russian frontier administration, the Ural Cossacks and their own khans. After Pugachev’s rebellion the government let the Kazakhs graze between the Volga and the Ural only for payment, the Cossacks demanded hostages and barred them from crossing the river, and Cossack raids and the exactions of Khan Nurali and his sultans weighed on the herders. In 1783 Syrym Datov (Syrym Datuly), an elder of the Baiuly clans who had probably fought with Pugachev, led raids on the Cossack outposts and forts of the Ural line, which brought punitive expeditions in return. Captured by the Cossacks in 1783 and ransomed in 1784, he helped drive Nurali out in 1786; the khan fled to the Russians and was sent to Ufa. The governor-general in Ufa, Osip (Iosif) Igelström, then tried a reform that set aside the khan’s power in favour of a council of elders and frontier courts, with Syrym at its head, but in 1789–1791 St Petersburg chose to restore the khanate, and the election of Nurali’s brother Yeraly as khan renewed the fighting. Raids on the line and on caravans cut off trade with Central Asia; in 1797 the rebels killed Yeraly’s successor, Khan Yesim. Talks with the elders and sultans then brought most of the clans to terms, and Syrym moved south to the Khanate of Khiva with his followers. He died there in 1802.
: En resning bland kazakerna i Yngre zhuzen (Lilla horden), på stäppen öster om nedre Ural, mot den ryska gränsförvaltningen, uralkosackerna och deras egna khaner. Efter Pugatjovs uppror lät regeringen kazakerna beta mellan Volga och Ural endast mot betalning, kosackerna krävde gisslan och hindrade dem från att gå över floden, och kosackräder och de pålagor som khan Nurali och hans sultaner utkrävde tyngde boskapsskötarna. År 1783 ledde Syrym Datov (Syrym Datuly), en äldste bland baiulyklanerna som troligen hade stridit med Pugatjov, räder mot kosackernas utposter och fästen på Urallinjen, vilket i sin tur ledde till straffexpeditioner. Han tillfångatogs av kosackerna 1783 och friköptes 1784, och 1786 hjälpte han till att driva ut Nurali; khanen flydde till ryssarna och sändes till Ufa. Generalguvernören i Ufa, Osip (Iosif) Igelström, prövade då en reform som satte khanens makt åt sidan till förmån för ett råd av äldste och gränsdomstolar, med Syrym i spetsen, men 1789–1791 valde Sankt Petersburg att återupprätta khanatet, och när Nuralis bror Yeraly valdes till khan blossade striderna upp igen. Räder mot linjen och mot karavaner skar av handeln med Centralasien; 1797 dödade rebellerna Yeralys efterträdare, khan Yesim. Förhandlingar med de äldste och sultanerna fick sedan de flesta klanerna att sluta fred, och Syrym flyttade med sina anhängare söderut till khanatet Chiva. Han dog där 1802.
