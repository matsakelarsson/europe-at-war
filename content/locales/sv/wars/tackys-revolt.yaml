# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
Tacky’s Revolt: Tackys uppror
? The war of liberation fought by enslaved Coromantee (Akan) people in Jamaica in 1760–1761, the largest rising in the British Caribbean in the eighteenth century. Its leaders had been soldiers and nobles on the Gold Coast, and they planned to overthrow British rule and make the island a free African state. On Easter Monday, 7 April 1760, Tacky, a Fante royal enslaved in St Mary, led a rising on the estates near Port Maria; his men seized arms from Fort Haldane, but the militia and Maroons from the eastern Maroon towns, bound by the treaties of 1739, hunted them down, and Tacky was shot dead within days. On 25 May a larger, better-planned rising broke out in Westmoreland under Apongo, called Wager by the British, said to have been a prince and war leader on the Gold Coast; his fighters fortified a camp in the hills and beat off the militia before regular troops, sailors and Leeward Maroons stormed it in early June. Apongo was captured in July and executed, but bands under his lieutenant Simon fought on from the Cockpit Country into 1761, and plots were uncovered across the island, including in Kingston, where Coromantee people had crowned a ‘Queen’, Cubah. Over 60 whites and a similar number of free people of colour were killed; some 400 rebels died in battle or by execution by the usual count (the militia claimed more), and more than 500 were transported and sold abroad. The historian Trevor Burnard judged that in its shock to the British Empire only the American Revolution surpassed it in that century.
: Det befrielsekrig som förslavade coromantee (akan) förde på Jamaica 1760–1761, den största resningen i brittiska Karibien under 1700-talet. Dess ledare hade varit soldater och adelsmän på Guldkusten, och de planerade att störta det brittiska styret och göra ön till en fri afrikansk stat. På annandag påsk, den 7 april 1760, ledde Tacky, en fantefurste som hölls som slav i socknen Saint Mary, en resning på plantagerna nära Port Maria; hans män tog vapen från Fort Haldane, men milisen och maroner från de östra maronbyarna, som var bundna av fördragen från 1739, spårade upp dem, och Tacky sköts ihjäl inom några dagar. Den 25 maj bröt en större och bättre planerad resning ut i Westmoreland under Apongo, av britterna kallad Wager, som sägs ha varit furste och krigsledare på Guldkusten; hans kämpar befäste ett läger i bergen och slog tillbaka milisen innan reguljära trupper, sjömän och Leewardmaroner stormade det i början av juni. Apongo tillfångatogs i juli och avrättades, men grupper under hans underbefälhavare Simon fortsatte striden från Cockpit Country in på 1761, och sammansvärjningar avslöjades över hela ön, bland annat i Kingston, där coromantee hade krönt en ”drottning”, Cubah. Över 60 vita och ungefär lika många fria färgade dödades; enligt den vanliga beräkningen dog omkring 400 rebeller i strid eller genom avrättning (milisen uppgav fler), och över 500 deporterades och såldes utomlands. Historikern Trevor Burnard bedömde att endast den amerikanska revolutionen under det århundradet skakade det brittiska imperiet mer.
