# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
Taiping Rebellion: Taipingupproret
A civil war between the Qing dynasty and the Taiping Heavenly Kingdom, a state founded by Hong Xiuquan, a Hakka from Guangdong who believed he was the younger brother of Jesus. His God Worshipping Society rose at Jintian in Guangxi in January 1851, marched north through Hunan to the Yangtze and took Nanjing in March 1853, making it the Heavenly Capital (Tianjing). A Taiping army came close to Tianjin in 1853, and at its height the kingdom ruled much of the Yangtze valley. A bloody purge of its leaders in 1856 weakened it; it recovered under Li Xiucheng and Chen Yucheng and took Suzhou and Hangzhou in 1860–1861, but the provincial armies of Zeng Guofan, Li Hongzhang and Zuo Zongtang, helped from 1862 by British and French forces and Western-officered units around Shanghai, wore it down. Nanjing fell on 19 July 1864. It was the deadliest civil war of the 19th century; most estimates of the dead range from 20 to 30 million, and some are far higher.: Ett inbördeskrig mellan Qingdynastin och Taipings himmelska rike, en stat grundad av Hong Xiuquan, en hakka från Guangdong som trodde att han var Jesu yngre bror. Hans Gudsdyrkarsällskap reste sig vid Jintian i Guangxi i januari 1851, marscherade norrut genom Hunan till Yangtze och intog i mars 1853 Nanking, som blev den himmelska huvudstaden (Tianjing). En taipingarmé kom nära Tianjin 1853, och när riket var som störst behärskade det stora delar av Yangtzedalen. En blodig utrensning bland dess ledare 1856 försvagade det; det återhämtade sig under Li Xiucheng och Chen Yucheng och intog Suzhou och Hangzhou 1860–1861, men Zeng Guofans, Li Hongzhangs och Zuo Zongtangs provinsarméer, från 1862 med hjälp av brittiska och franska styrkor och förband med västerländska officerare kring Shanghai, nötte ned det. Nanking föll den 19 juli 1864. Det var 1800-talets blodigaste inbördeskrig; de flesta uppskattningarna av antalet döda varierar från 20 till 30 miljoner, och vissa är betydligt högre.
