# Svenska översättningar av katalogtexten (våg 10); stegtexterna kommer senare.
Taira no Tadatsune’s rebellion: Taira no Tadatsunes uppror
? The rising of Taira no Tadatsune, a great landholder of the Bōsō peninsula east of today’s Tokyo, against the provincial governors of Kazusa, Shimōsa and Awa. In the sixth month of 1028 Tadatsune burned the governor of Awa to death and occupied the provincial headquarters of Kazusa, and much of the local gentry joined him. The court’s commander, Taira no Naokata, whose branch of the clan was an old rival of Tadatsune’s, campaigned for two years without result, while Tadatsune drove the next governor out of Awa in 1030 and held out in a stronghold at Ishimi in Isumi district. The fighting and requisitions ruined the three provinces; the governor of Shimōsa was said to be starving. In 1030 the court replaced Naokata with Minamoto no Yorinobu, governor of Kai, whom Tadatsune had once served. In the spring of 1031, before Yorinobu had even marched, Tadatsune shaved his head as a monk and surrendered with his sons. He died of illness at Nogami in Mino on the way to the capital, in the sixth month. His sons were pardoned and founded the Chiba and Kazusa clans, and the affair made the Kawachi branch of the Minamoto the leading warrior house of eastern Japan.
: Resningen under Taira no Tadatsune, en stor jordägare på Bōsōhalvön öster om dagens Tokyo, mot provinsguvernörerna i Kazusa, Shimōsa och Awa. I sjätte månaden 1028 brände Tadatsune ihjäl guvernören i Awa och ockuperade Kazusas provinshögkvarter, och stora delar av den lokala lantadeln anslöt sig till honom. Hovets befälhavare, Taira no Naokata, vars gren av klanen var en gammal rival till Tadatsunes, förde fälttåg i två år utan resultat, medan Tadatsune 1030 drev ut nästa guvernör ur Awa och höll ut i ett fäste i Ishimi i Isumidistriktet. Striderna och rekvisitionerna ruinerade de tre provinserna; guvernören i Shimōsa sades svälta. År 1030 ersatte hovet Naokata med Minamoto no Yorinobu, guvernör i Kai, som Tadatsune en gång hade tjänat. Våren 1031, innan Yorinobu ens hade gett sig av, rakade Tadatsune huvudet, blev munk och kapitulerade tillsammans med sina söner. Han dog av sjukdom i Nogami i Mino på vägen till huvudstaden, i sjätte månaden. Hans söner benådades och grundade klanerna Chiba och Kazusa, och affären gjorde Kawachigrenen av Minamoto till det ledande krigarhuset i östra Japan.
