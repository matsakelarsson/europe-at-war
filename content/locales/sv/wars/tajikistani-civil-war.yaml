# Svenska översättningar av katalogtexten (våg 7); stegtexterna kommer senare.
Tajikistani Civil War: Tadzjikiska inbördeskriget
? The civil war that followed Tajikistan’s independence from the Soviet Union. It was fought between the old communist establishment, drawn mainly from the northern Leninabad (Khujand) region and the southern Kulob region, and an opposition of Islamists, democrats and Pamiri nationalists, drawn largely from the Gharm valley and Gorno-Badakhshan. After a coalition government formed in May 1992 collapsed, the pro-government Popular Front, backed by Russia and Uzbekistan, took the capital Dushanbe in December 1992, and its militias killed and expelled thousands of people from opposition regions in the south. The opposition, united from 1993 as the United Tajik Opposition (UTO), fought on from bases in Afghanistan and the eastern mountains, attacking Russian border posts on the Panj river. UN-sponsored talks from 1994 led to the General Agreement on the Establishment of Peace and National Accord, signed in Moscow on 27 June 1997 by President Emomali Rahmon and the UTO leader Sayid Abdullo Nuri, which gave the opposition 30 per cent of government posts.
: Inbördeskriget som följde på Tadzjikistans självständighet från Sovjetunionen. Det utkämpades mellan det gamla kommunistiska etablissemanget, som främst kom från regionen Leninabad (Chudzjand) i norr och regionen Kulob i söder, och en opposition av islamister, demokrater och pamiriska nationalister, som till stor del kom från Gharmdalen och Gorno-Badachsjan. Sedan en koalitionsregering som bildats i maj 1992 hade fallit samman intog den regeringstrogna Folkfronten, med stöd av Ryssland och Uzbekistan, huvudstaden Dusjanbe i december 1992, och dess miliser dödade och fördrev tusentals människor från oppositionens områden i söder. Oppositionen, som från 1993 var enad i Förenade tadzjikiska oppositionen (UTO), fortsatte striderna från baser i Afghanistan och i bergen i öster och angrep ryska gränsposteringar vid floden Pjandzj. Samtal under FN:s överinseende från 1994 ledde fram till Allmänna avtalet om upprättande av fred och nationellt samförstånd, som undertecknades i Moskva den 27 juni 1997 av president Emomali Rahmon och UTO:s ledare Sayid Abdullo Nuri och gav oppositionen 30 procent av regeringsposterna.
