# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
Taksin’s reunification of Siam: Taksins återförening av Siam
? "The wars in which Phraya Tak, the later King Taksin, rebuilt the Siamese kingdom after the Burmese destroyed Ayutthaya in April 1767. A provincial governor of Teochew Chinese descent who had broken out of the siege in January 1767, he took Chanthaburi on the east coast on 15 June 1767, sailed up the Chao Phraya with about 5,000 men in October, took Thonburi on 6 November and destroyed the Burmese garrison at Phosamton, and was crowned king at Thonburi on 28 December 1767. Four rival regimes had divided the rest of the country: the governor of Phitsanulok and the monk Chao Phra Fang at Sawangkhaburi in the north, Prince Thepphiphit at Phimai on the Khorat plateau, and the acting governor of Nakhon Si Thammarat in the south. Taksin beat back a Burmese force at Bang Kung in 1768, was defeated and wounded at Koeichai by the Phitsanulok forces, but took Phimai in 1768 and Nakhon Si Thammarat in 1769. Chao Phra Fang, who had absorbed Phitsanulok, was overthrown in 1770. With Siam united again, Taksin turned to Lan Na, Cambodia and the Lao kingdoms."
: "De krig där Phraya Tak, den senare kung Taksin, byggde upp det siamesiska kungariket igen sedan burmeserna hade förstört Ayutthaya i april 1767. Han var en provinsguvernör av teochewkinesisk härkomst som hade brutit sig ut ur belägringen i januari 1767, och han intog Chanthaburi på östkusten den 15 juni 1767, seglade uppför Chao Phraya med omkring 5 000 man i oktober, intog Thonburi den 6 november och förintade den burmesiska garnisonen vid Phosamton, och den 28 december 1767 kröntes han till kung i Thonburi. Fyra rivaliserande regimer hade delat upp resten av landet: guvernören i Phitsanulok och munken Chao Phra Fang i Sawangkhaburi i norr, prins Thepphiphit i Phimai på Khoratplatån och den tillförordnade guvernören i Nakhon Si Thammarat i söder. Taksin slog tillbaka en burmesisk styrka vid Bang Kung 1768 och besegrades och sårades vid Koeichai av styrkorna från Phitsanulok, men intog Phimai 1768 och Nakhon Si Thammarat 1769. Chao Phra Fang, som hade lagt under sig Phitsanulok, störtades 1770. När Siam var återförenat vände sig Taksin mot Lan Na, Kambodja och de laotiska kungarikena."
