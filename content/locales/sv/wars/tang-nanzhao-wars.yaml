# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
Tang–Nanzhao wars: Krigen mellan Tangriket och Nanzhao
The wars between Tang China and Nanzhao, the kingdom of the Erhai lake in Yunnan, after their alliance against Tibet broke down. In 829 the Nanzhao general Wang Cuodian invaded Xichuan (Sichuan), plundered the country around Chengdu and carried off thousands of captives before withdrawing in 830. Under King Shilong, who took the title of emperor in 859, Nanzhao attacked on two fronts. In Annan (northern Vietnam), allied with local chiefs, its armies took the capital Songping (Hanoi) in 861 and again in 863 and held the delta for three years, until the Tang general Gao Pian retook it in 864–866. In Sichuan it took Xizhou and besieged Chengdu in 869–870, and raided to the walls of Chengdu again in 874. Gao Pian, sent to Chengdu, drove the Nanzhao army back across the Dadu River in 875. The wars exhausted both states. A Tang official wrote that the conscription and the supplies they demanded had emptied the treasury and turned peasants into robbers, and the great rebellion of Huang Chao began in the same years.: Krigen mellan Tangriket och Nanzhao, kungariket vid sjön Erhai i Yunnan, sedan deras allians mot Tibet hade brutit samman. År 829 invaderade Nanzhaos fältherre Wang Cuodian Xichuan (Sichuan), plundrade trakten kring Chengdu och förde bort tusentals fångar innan han drog sig tillbaka 830. Under kung Shilong, som antog kejsartiteln 859, angrep Nanzhao på två fronter. I Annan (norra Vietnam) intog dess arméer, allierade med lokala hövdingar, huvudstaden Songping (Hanoi) 861 och på nytt 863 och höll deltat i tre år, tills Tangrikets fältherre Gao Pian återtog det 864–866. I Sichuan intog Nanzhao Xizhou och belägrade Chengdu 869–870, och 874 gick dess räder återigen ända fram till Chengdus murar. Gao Pian, som sändes till Chengdu, drev 875 tillbaka Nanzhaos armé över floden Dadu. Krigen utmattade båda staterna. En ämbetsman i Tangriket skrev att utskrivningarna och de förnödenheter som krigen krävde hade tömt statskassan och gjort bönder till rövare, och Huang Chaos stora uppror bröt ut under samma år.
