# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
Tang–Tibetan war (801–821): Kriget mellan Tangriket och Tibet (801–821)
The last phase of the long wars between Tang China and the Tibetan Empire, ended by the treaty of 821–822. Tibet then held the Hexi Corridor, Longyou and the Tarim Basin, and its armies raided the Tang frontier in the Ordos and the west every few years. In 801 the Tang governor of Xichuan (Sichuan), Wei Gao, and Nanzhao, which had broken with Tibet in 794, attacked the Tibetan forts on the south-eastern frontier; they besieged Weizhou and Kunming (today’s Yanyuan) and early in 802 captured the Tibetan commander Lun Mangre, but could not take the towns. Raids and counter-raids went on under the Tibetan emperors Tride Songtsen and Ralpacan, who were also fighting the Uyghurs and the Abbasids. In 821 envoys of Ralpacan and the Tang emperor Muzong swore a treaty at Chang’an, sworn again at Lhasa in 822, which fixed the frontier where it then lay. Its bilingual text, put up in 823 on a pillar in front of the Jokhang, still stands.: Den sista fasen av de långa krigen mellan Tangdynastins Kina och Tibetanska riket, som avslutades med fördraget 821–822. Tibet behärskade då Hexikorridoren, Longyou och Tarimbäckenet, och dess arméer härjade med några års mellanrum Tangrikets gränsområden i Ordos och i väster. År 801 angrep Tangrikets guvernör i Xichuan (Sichuan), Wei Gao, och Nanzhao, som hade brutit med Tibet 794, de tibetanska fästena vid den sydöstra gränsen; de belägrade Weizhou och Kunming (dagens Yanyuan) och tillfångatog i början av 802 den tibetanske befälhavaren Lun Mangre, men kunde inte inta städerna. Räder och motangrepp fortsatte under de tibetanska kejsarna Tride Songtsen och Ralpacan, som samtidigt kämpade mot uigurerna och abbasiderna. År 821 svor sändebud från Ralpacan och Tangkejsaren Muzong ett fördrag i Chang’an, som besvors på nytt i Lhasa 822 och fastställde gränsen där den då gick. Fördragets tvåspråkiga text, som 823 restes på en pelare framför Jokhang, står fortfarande kvar.
