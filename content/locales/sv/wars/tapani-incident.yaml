# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
Tapani incident: Tapaniincidenten
? The last large armed rising of Han Taiwanese against Japanese rule, also called the Xilai Temple incident after the temple in Tainan where it was planned, and named after Tapani (today Yujing, in Tainan), where its main battle was fought. Its leader, Yu Qingfang, preached a millenarian message, raised money at the temple under the cover of repairs and proclaimed a state called Da Ming Cibei Guo, expecting “celestial troops” from China to come to his aid. When the police uncovered the plot and arrested his associate Luo Jun and others, Yu and the mountain leader Jiang Ding rose with Han farmers, camphor workers and Indigenous Taivoan fighters. In July 1915 they attacked Japanese police stations, beginning with the branch office at Kōbasen (Jiaxianpu) on 9 July, and killed officers and their families. On 6 August Japanese troops and police defeated them at Tapani, and in the following weeks they searched the surrounding villages, burning houses and killing villagers. A study for the Tainan city government in 2015 counted 1,412 dead; other estimates range from several hundred to 30,000. Yu was seized by villagers and handed over on 22 August 1915, and executed in September. Of 1,957 people arrested and tried, 866 were sentenced to death, about three-quarters of whom were later reprieved. Jiang Ding held out in the hills until he surrendered in April 1916 on a promise of pardon; he and his 272 men were arrested on 18 May 1916, and he was executed. After Tapani, Han Taiwanese opposition to Japanese rule took political rather than armed forms.
: Det sista stora väpnade upproret bland hantaiwaneser mot det japanska styret, även kallat Xilaitempelincidenten efter templet i Tainan där det planerades, och uppkallat efter Tapani (dagens Yujing i Tainan), där dess huvudslag utkämpades. Dess ledare, Yu Qingfang, predikade ett millenaristiskt budskap, samlade in pengar vid templet under förevändning av reparationer och utropade en stat kallad Da Ming Cibei Guo i förväntan att ”himmelska trupper” från Kina skulle komma till hans hjälp. När polisen avslöjade sammansvärjningen och grep hans medhjälpare Luo Jun och andra reste sig Yu och bergsledaren Jiang Ding med hankinesiska bönder, kamferarbetare och krigare ur urfolket taivoan. I juli 1915 angrep de japanska polisstationer, med början i filialkontoret i Kōbasen (Jiaxianpu) den 9 juli, och dödade poliser och deras familjer. Den 6 augusti besegrade japanska trupper och poliser dem vid Tapani, och under de följande veckorna genomsökte de de omkringliggande byarna, brände hus och dödade bybor. En studie för Tainans stadsförvaltning 2015 räknade till 1 412 döda; andra uppskattningar varierar från flera hundra till 30 000. Yu greps av bybor och överlämnades den 22 augusti 1915 och avrättades i september. Av 1 957 personer som greps och ställdes inför rätta dömdes 866 till döden, av vilka omkring tre fjärdedelar senare benådades från dödsstraffet. Jiang Ding höll ut i bergen tills han kapitulerade i april 1916 mot löfte om benådning; han och hans 272 män greps den 18 maj 1916, och han avrättades. Efter Tapani tog hantaiwanesernas motstånd mot det japanska styret politiska snarare än väpnade former.
