# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
Tây Sơn wars: Tây Sơn-krigen
? Three decades of war that began with a rising of three brothers from Tây Sơn in Bình Định, Nguyễn Nhạc, Nguyễn Huệ and Nguyễn Lữ, against the Nguyễn lords of southern Đại Việt and ended with the unification of Vietnam under the last surviving Nguyễn prince. Drawing on peasants, upland peoples, Chinese merchants and Vietnamese traders, the Tây Sơn took Quy Nhơn in 1773, and while the Trịnh lords of the north invaded and took the Nguyễn capital Phú Xuân, they drove the Nguyễn south and in 1777 took Saigon and killed nearly the whole ruling family. Nguyễn Ánh, who escaped, fought back from the Mekong delta with Siamese, French and Chinese help. Nguyễn Huệ destroyed a Siamese fleet at Rạch Gầm–Xoài Mút in 1785, ended the rule of the Trịnh in 1786, routed a Qing army sent to restore the Lê emperor at Ngọc Hồi–Đống Đa in 1789 and reigned as Emperor Quang Trung until his death in 1792. From his base at Gia Định, Nguyễn Ánh advanced up the coast in yearly monsoon campaigns, took the Tây Sơn heartland at Quy Nhơn and Phú Xuân in 1799–1801, and in July 1802 entered Thăng Long as the Gia Long Emperor.
: Tre årtionden av krig som började med en resning av tre bröder från Tây Sơn i Bình Định, Nguyễn Nhạc, Nguyễn Huệ och Nguyễn Lữ, mot Nguyễnfurstarna i södra Đại Việt och slutade med att Vietnam enades under den siste överlevande Nguyễnprinsen. Med stöd av bönder, bergsfolk, kinesiska köpmän och vietnamesiska handlare intog Tây Sơn Quy Nhơn 1773, och medan Trịnhfurstarna i norr invaderade och intog Nguyễnfurstarnas huvudstad Phú Xuân drev Tây Sơn Nguyễnfurstarna söderut och intog 1777 Saigon och dödade nästan hela den härskande familjen. Nguyễn Ánh, som kom undan, slog tillbaka från Mekongdeltat med siamesisk, fransk och kinesisk hjälp. Nguyễn Huệ förintade en siamesisk flotta vid Rạch Gầm–Xoài Mút 1785, gjorde slut på Trịnhfurstarnas välde 1786, krossade vid Ngọc Hồi–Đống Đa 1789 en Qingarmé som hade sänts för att återinsätta Lêkejsaren och regerade som kejsar Quang Trung till sin död 1792. Från sin bas i Gia Định ryckte Nguyễn Ánh fram längs kusten i årliga monsunfälttåg, intog Tây Sơns kärnland vid Quy Nhơn och Phú Xuân 1799–1801 och tågade i juli 1802 in i Thăng Long som kejsar Gia Long.
