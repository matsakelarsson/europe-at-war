# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
Tecumseh’s War: Tecumsehs krig
? The struggle of the confederacy led by the Shawnee brothers Tecumseh and Tenskwatawa against the expansion of the United States in the Northwest. After the Treaty of Greenville, William Henry Harrison, governor of Indiana Territory, bought millions of acres from individual nations by treaty. Tenskwatawa, known as the Prophet, led a religious revival that drew followers from many nations to Prophetstown on the Wabash, and Tecumseh turned it into a political and military alliance, holding that the land belonged to all the nations in common and that none could sell it alone. He rejected the Treaty of Fort Wayne of 1809 to Harrison’s face at Vincennes in 1810 and travelled south in 1811 to win over the Muscogee and others. While he was away Harrison marched on Prophetstown with about 1,000 men; on 7 November 1811 warriors attacked his camp at Tippecanoe and were beaten off, and Harrison burned the town. Raids on the frontier followed, and when the War of 1812 began Tecumseh joined the British; his war merged into the larger one, and he was killed at the Battle of the Thames on 5 October 1813.
: Kampen mot USA:s expansion i nordväst som fördes av det förbund som leddes av shawneebröderna Tecumseh och Tenskwatawa. Efter fördraget i Greenville köpte William Henry Harrison, guvernör i Indianaterritoriet, miljontals acres av enskilda nationer genom fördrag. Tenskwatawa, känd som Profeten, ledde en religiös väckelse som drog anhängare från många nationer till Prophetstown vid Wabash, och Tecumseh gjorde den till en politisk och militär allians och hävdade att landet tillhörde alla nationerna gemensamt och att ingen av dem kunde sälja det på egen hand. Han förkastade fördraget i Fort Wayne 1809 öga mot öga med Harrison i Vincennes 1810 och reste söderut 1811 för att vinna över muscogee med flera. Medan han var borta marscherade Harrison mot Prophetstown med omkring 1 000 man; den 7 november 1811 anföll krigare hans läger vid Tippecanoe och slogs tillbaka, och Harrison brände byn. Räder mot gränsbygderna följde, och när brittisk-amerikanska kriget 1812 bröt ut gick Tecumseh över till britterna; hans krig gick upp i det större kriget, och han stupade i slaget vid Thames den 5 oktober 1813.
