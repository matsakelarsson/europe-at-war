Telangana rebellion: Telanganaupproret
A communist-led peasant insurrection in the Telangana region of the princely state of Hyderabad, also called the Telangana armed struggle. It grew out of the movements of the Andhra Mahasabha against the great landlords (deshmukhs and jagirdars), forced labour (vetti), illegal levies and debt bondage. On 4 July 1946 a landlord’s men shot dead a village activist, Doddi Komarayya, at Kadavendi in Warangal district, and the movement turned into an armed rising led by the Communist Party of India. Peasant squads (dalams) fought the landlords, the Nizam’s police and the Razakar militia, set up village communes and redistributed land; by 1948 they held some 3,000 to 4,000 villages in Nalgonda, Warangal and Khammam. After India took over Hyderabad in September 1948 the Indian army turned against the communists, and thousands were killed or detained. The party called off the struggle in October 1951.: Ett kommunistlett bondeuppror i Telanganaregionen i furstendömet Hyderabad, även kallat Telanganas väpnade kamp. Det växte fram ur Andhra Mahasabhas rörelser mot storgodsägarna (deshmukher och jagirdarer), tvångsarbetet (vetti), olagliga pålagor och skuldslaveriet. Den 4 juli 1946 sköt en godsägares män ihjäl en byaktivist, Doddi Komarayya, i Kadavendi i Warangaldistriktet, och rörelsen övergick i ett väpnat uppror lett av Indiens kommunistiska parti. Bondetrupper (dalams) stred mot godsägarna, nizamens polis och razakarmilisen, upprättade bykommuner och omfördelade jord; 1948 behärskade de omkring 3 000 till 4 000 byar i Nalgonda, Warangal och Khammam. Sedan Indien hade tagit över Hyderabad i september 1948 vände sig den indiska armén mot kommunisterna, och tusentals dödades eller fängslades. Partiet avbröt kampen i oktober 1951.
