On 23 December 1990 Slovenes voted for independence in a referendum, and the republic’s government spent the following months preparing its Territorial Defence (TO) for a fight with the Yugoslav People’s Army. Slovenia and Croatia both declared independence on 25 June 1991, a day earlier than planned. Slovenian officers took over the border posts with Italy, Austria and Hungary and set up new ones on the border with Croatia.: Den 23 december 1990 röstade slovenerna för självständighet i en folkomröstning, och republikens regering ägnade de följande månaderna åt att förbereda sitt territorialförsvar (TO) för en strid med Jugoslaviska folkarmén. Slovenien och Kroatien förklarade sig båda självständiga den 25 juni 1991, en dag tidigare än planerat. Slovenska tjänstemän tog över gränsposterna mot Italien, Österrike och Ungern och upprättade nya vid gränsen mot Kroatien.
Early on 27 June JNA columns left their barracks to retake the crossings and Brnik airport. The army expected little resistance, but the Slovenian leadership under Milan Kučan chose to fight. The TO shot down two army helicopters, blocked roads with lorries and besieged barracks across the country. By midnight the JNA held every crossing on the Italian border and most on the Austrian, but many of its units were stranded, and on 28 June the TO went over to a general offensive.: Tidigt den 27 juni lämnade JNA-kolonner sina kaserner för att återta gränsövergångarna och flygplatsen Brnik. Armén väntade sig föga motstånd, men den slovenska ledningen under Milan Kučan valde att slåss. TO sköt ned två arméhelikoptrar, spärrade vägar med lastbilar och belägrade kaserner över hela landet. Vid midnatt höll JNA alla övergångar vid den italienska gränsen och de flesta vid den österrikiska, men många av dess förband satt fast, och den 28 juni gick TO över till en allmän offensiv.
