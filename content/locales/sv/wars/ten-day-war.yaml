A JNA armoured column from Vrhnika took the airport on 27 June. Yugoslav aircraft struck it the next day, killing the Austrian journalists Nikolas Vogel and Norbert Werner and wrecking four Adria Airways airliners.: En pansarkolonn från JNA från Vrhnika intog flygplatsen den 27 juni. Jugoslaviska flygplan anföll den dagen därpå, varvid de österrikiska journalisterna Nikolas Vogel och Norbert Werner dödades och fyra trafikflygplan från Adria Airways förstördes.
