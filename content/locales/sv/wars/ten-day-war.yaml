The Slovenian parliament proclaimed independence on 25 June. On 27 June the TO shot down a JNA Gazelle helicopter over Rožna Dolina; its pilot, Toni Mrlak, was himself a Slovene, and it turned out to be carrying bread for the troops.: Det slovenska parlamentet utropade självständigheten den 25 juni. Den 27 juni sköt TO ned en JNA-helikopter av typen Gazelle över Rožna Dolina; dess pilot, Toni Mrlak, var själv slovén, och det visade sig att den hade bröd till trupperna ombord.
