Ten-Day War: Tiodagarskriget
Slovenia declared independence from Yugoslavia on 25 June 1991, after a referendum in which 88.5 per cent of voters had backed it. Two days later the Yugoslav People’s Army (JNA) moved to seize the republic’s border crossings and Ljubljana airport. The Slovenian Territorial Defence and police, prepared for months, blockaded barracks and ambushed tank columns, and many of the army’s conscripts surrendered. A European Community ceasefire held from 4 July and the Brioni Declaration of 7 July ended the fighting. About 80 people were killed, and the last JNA troops left Slovenia in October.: Slovenien förklarade sig självständigt från Jugoslavien den 25 juni 1991, efter en folkomröstning där 88,5 procent av de röstande hade stött självständigheten. Två dagar senare gick Jugoslaviska folkarmén (JNA) in för att ta kontroll över republikens gränsövergångar och flygplatsen i Ljubljana. Det slovenska territorialförsvaret och polisen, som hade förberett sig i månader, blockerade kaserner och lade bakhåll för stridsvagnskolonner, och många av arméns värnpliktiga kapitulerade. En vapenvila förmedlad av Europeiska gemenskapen höll från den 4 juli, och Brionideklarationen den 7 juli avslutade striderna. Omkring 80 människor dödades, och de sista JNA-trupperna lämnade Slovenien i oktober.
