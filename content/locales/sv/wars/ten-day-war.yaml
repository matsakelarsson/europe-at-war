In the following days the TO overran crossings at Šentilj, Gornja Radgona and Vrtojba and took barracks and depots, re-arming itself with captured weapons. The garrison at Dravograd, some 400 men, surrendered on 30 June. On 2 July, the heaviest day of fighting, a relief column from Jastrebarsko in Croatia was turned back at Bregana, and a trapped air defence column in the Krakovo Forest held out near Krško.: Under de följande dagarna överskred TO gränsövergångarna vid Šentilj, Gornja Radgona och Vrtojba och intog kaserner och förråd, och beväpnade sig med erövrade vapen. Garnisonen i Dravograd, omkring 400 man, kapitulerade den 30 juni. Den 2 juli, den dag då striderna var som hårdast, vändes en undsättningskolonn från Jastrebarsko i Kroatien tillbaka vid Bregana, och en instängd luftvärnskolonn i Krakovoskogen höll ut nära Krško.
The army’s generals wanted a full-scale offensive, but the federal presidency would not authorise one. A ceasefire took hold from the evening of 3 July, and on 7 July Slovenia, Croatia and the federal government signed the Brioni Declaration under European Community mediation. Slovenia and Croatia suspended their independence for three months. On 18 July the federal presidency decided to withdraw the JNA from Slovenia, and the last troops left by 26 October. The war in Croatia was only beginning.: Arméns generaler ville ha en fullskalig offensiv, men det federala presidiet vägrade godkänna en sådan. En vapenvila trädde i kraft från kvällen den 3 juli, och den 7 juli undertecknade Slovenien, Kroatien och den federala regeringen Brionideklarationen genom Europeiska gemenskapens medling. Slovenien och Kroatien sköt upp sin självständighet i tre månader. Den 18 juli beslöt det federala presidiet att dra tillbaka JNA från Slovenien, och de sista trupperna hade lämnat landet senast den 26 oktober. Kriget i Kroatien hade bara börjat.
