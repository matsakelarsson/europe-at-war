# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
Ten Years’ War: Tioårskriget
? "The first Cuban war of independence, fought from 1868 to 1878 between the insurgent Republic of Cuba in Arms and Spain. On 10 October 1868 Carlos Manuel de Céspedes, a planter and lawyer of Manzanillo, freed the people he held in slavery at his La Demajagua sugar mill and proclaimed Cuba’s independence. The rising spread through the east of the island, Oriente and Camagüey, where there were fewer great plantations and fewer enslaved people than in the west, and briefly to Las Villas; the rebels took Bayamo, and in April 1869 an assembly at Guáimaro gave the republic a constitution, with Céspedes as president. Spain, supported in Havana by tens of thousands of Volunteers loyal to the colony, answered with columns, executions, forts and the fortified line of the Júcaro–Morón trocha that kept the war out of the sugar plantations of the west. Insurgent commanders such as Ignacio Agramonte, Máximo Gómez, Antonio Maceo and Calixto García won battles, notably Las Guásimas in 1874, and Gómez carried the war across the trocha into Las Villas in 1875, but the insurgents never had the arms, the recognition abroad or the unity to win: Agramonte was killed in 1873, the House of Representatives deposed Céspedes, who was killed in 1874, and regional quarrels split the army. After the end of the Carlist War in Spain, General Arsenio Martínez Campos combined fresh troops with pardons and promises, and on 10 February 1878 the Pact of Zanjón ended the war without independence or the abolition of slavery. Maceo rejected it in the Protest of Baraguá and fought on until May. Estimates of the dead range from about 100,000 to more than 200,000, most of them Spanish soldiers who died of disease and Cuban civilians and insurgents."
: "Det första kubanska självständighetskriget, fört 1868–1878 mellan den upproriska Republiken Kuba i vapen och Spanien. Den 10 oktober 1868 frigav Carlos Manuel de Céspedes, plantageägare och advokat i Manzanillo, de människor han höll som slavar på sitt sockerbruk La Demajagua och utropade Kubas självständighet. Resningen spred sig genom öns östra del, Oriente och Camagüey, där det fanns färre stora plantager och färre förslavade än i väster, och för en kort tid till Las Villas; rebellerna intog Bayamo, och i april 1869 gav en församling i Guáimaro republiken en författning, med Céspedes som president. Spanien, som i Havanna stöddes av tiotusentals frivilliga som var lojala mot kolonin, svarade med kolonner, avrättningar, fort och trochan mellan Júcaro och Morón, en befäst linje som höll kriget borta från sockerplantagerna i väster. Upprorsbefälhavare som Ignacio Agramonte, Máximo Gómez, Antonio Maceo och Calixto García vann slag, särskilt vid Las Guásimas 1874, och Gómez förde 1875 kriget över trochan in i Las Villas, men upprorsmännen hade aldrig de vapen, det erkännande utomlands eller den enighet som krävdes för att vinna: Agramonte stupade 1873, representanthuset avsatte Céspedes, som dödades 1874, och regionala gräl splittrade armén. Efter karlistkrigets slut i Spanien kombinerade general Arsenio Martínez Campos nya trupper med benådningar och löften, och den 10 februari 1878 avslutade pakten i Zanjón kriget utan självständighet eller slaveriets avskaffande. Maceo förkastade den i protesten i Baraguá och stred vidare till maj. Uppskattningarna av antalet döda sträcker sig från omkring 100 000 till mer än 200 000, de flesta spanska soldater som dog av sjukdomar samt kubanska civila och upprorsmän."
