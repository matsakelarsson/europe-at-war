# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
Tepanec War: Tepanekkriget
? The war in which the Mexica of Tenochtitlan, the Acolhua of Texcoco and the Tepanec city of Tlacopan overthrew the Tepanec state of Azcapotzalco, which had dominated the Valley of Mexico, and founded the Triple Alliance that became the Aztec Empire. When the Tepanec king Tezozomoc died in 1426 or 1427, his son Maxtla seized the throne from the heir he had chosen. Chimalpopoca, ruler of Tenochtitlan, died soon afterwards, by most accounts on Maxtla’s orders, and his successor Itzcoatl refused to submit. Nezahualcoyotl, the exiled heir of Texcoco, whose father the Tepanecs had killed in 1418, raised Acolhua towns and won help from Huexotzinco and Tlaxcala, and Tlacopan broke with Azcapotzalco. In 1428 the allies retook Texcoco and its towns and stormed and destroyed Azcapotzalco; Maxtla was killed or fled. The victors divided the Tepanec lands and agreed to wage their wars together, and over the next years they conquered Coyoacán and the chinampa towns of the southern lakes. Nezahualcoyotl became king of Texcoco in 1431.
: Det krig där mexica i Tenochtitlan, acolhua i Texcoco och tepanekstaden Tlacopan störtade tepanekstaten Azcapotzalco, som hade dominerat Mexikodalen, och grundade den trippelallians som blev Aztekriket. När tepanekkungen Tezozomoc dog 1426 eller 1427 tog hans son Maxtla tronen från den arvinge som Tezozomoc hade utsett. Chimalpopoca, härskare i Tenochtitlan, dog kort därefter, enligt de flesta berättelser på Maxtlas order, och hans efterträdare Itzcoatl vägrade att underkasta sig. Nezahualcoyotl, Texcocos landsflyktige arvinge, vars far tepanekerna hade dödat 1418, fick acolhuastäderna att resa sig och vann hjälp från Huexotzinco och Tlaxcala, och Tlacopan bröt med Azcapotzalco. År 1428 återtog de allierade Texcoco och dess städer och stormade och förstörde Azcapotzalco; Maxtla dödades eller flydde. Segrarna delade upp tepanekernas landområden och kom överens om att föra sina krig tillsammans, och under de följande åren erövrade de Coyoacán och chinampastäderna vid de södra sjöarna. Nezahualcoyotl blev kung av Texcoco 1431.
