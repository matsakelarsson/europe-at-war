# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
Tepehuán Revolt: Tepehuánupproret
? A rising of the Tepehuán of the Sierra Madre Occidental in Nueva Vizcaya, today’s Durango, against Spanish rule and the Jesuit missions. The Tepehuán were farmers living in scattered settlements on the eastern slopes of the sierra. Spanish miners and ranchers had moved into their lands from the 1570s, and the Jesuits founded missions among them from 1596, at Santiago Papasquiaro, Santa Catarina de Tepehuanes and El Zape; epidemics in 1594, 1601–1602, 1606–1607, 1610 and 1616–1617 may have killed more than four-fifths of the peoples of the region. In 1616 a baptised Tepehuán prophet, Quautlatas, carrying a broken cross, preached that the old gods were angry and that the Spaniards and the missionaries must be killed or driven out, promising that the dead would rise again. The revolt began on 16 November 1616 with an attack on a wagon train near Santa Catarina, and in coordinated attacks in the following days the Tepehuán, under six war leaders of whom Francisco Gogoxito was the best known, killed about 100 people in the church at El Zape and a similar number at Santiago Papasquiaro; all but one of the Jesuits in their country were killed. Governor Gaspar de Alvear, fearing an attack on Durango, ordered the execution of some 75 Indigenous leaders held there and led a column into the sierra in December; further expeditions in 1617 and 1618, with Concho and other Indigenous allies, fought a war “by fire and blood” and killed the last of the war leaders in 1618. Raiding went on until the revolt was declared over in 1620. More than 200 Spaniards, ten missionaries, and unknown numbers of Indigenous, African and mestizo people on the Spanish side died, and perhaps 4,000 Tepehuán, many of hunger and disease; mines and churches were burned and the province took decades to recover. Fifteen years earlier, in December 1601, the Acaxee of the sierra to the west, led by an elder called Perico, had risen against the mining camps around Topia; after the Jesuit Hernando de Santarén failed to make peace, Francisco de Urdiñola put the rising down with Spanish and Indigenous troops and executed Perico and about 48 others in 1602–1603.
: Ett uppror bland tepehuánfolket i Sierra Madre Occidental i Nueva Vizcaya, dagens Durango, mot det spanska styret och jesuitmissionerna. Tepehuánfolket var jordbrukare som bodde i spridda bosättningar på sierrans östsluttningar. Spanska gruvägare och ranchägare hade trängt in i deras land från 1570-talet, och jesuiterna grundade missioner bland dem från 1596, i Santiago Papasquiaro, Santa Catarina de Tepehuanes och El Zape; epidemier 1594, 1601–1602, 1606–1607, 1610 och 1616–1617 kan ha dödat mer än fyra femtedelar av regionens folk. År 1616 predikade en döpt tepehuánprofet, Quautlatas, som bar ett brutet kors, att de gamla gudarna var vreda och att spanjorerna och missionärerna måste dödas eller drivas bort, och han lovade att de döda skulle uppstå igen. Upproret började den 16 november 1616 med ett anfall mot en vagnskaravan nära Santa Catarina, och i samordnade anfall under de följande dagarna dödade tepehuánfolket, under sex krigsledare av vilka Francisco Gogoxito var den mest kände, omkring 100 människor i kyrkan i El Zape och ungefär lika många i Santiago Papasquiaro; alla jesuiter i deras land utom en dödades. Guvernör Gaspar de Alvear, som fruktade ett anfall mot Durango, lät avrätta omkring 75 ursprungsamerikanska ledare som hölls fångna där och ledde en kolonn in i sierran i december; nya expeditioner 1617 och 1618, med allierade bland concho och andra ursprungsfolk, förde ett krig ”med eld och blod” och dödade den siste av krigsledarna 1618. Räderna fortsatte tills upproret förklarades avslutat 1620. Mer än 200 spanjorer, tio missionärer och okända antal ursprungsamerikaner, afrikaner och mestiser på den spanska sidan dog, liksom kanske 4 000 ur tepehuánfolket, många av hunger och sjukdom; gruvor och kyrkor brändes och provinsen behövde årtionden för att återhämta sig. Femton år tidigare, i december 1601, hade acaxeefolket i sierran västerut, under ledning av en äldste som kallades Perico, rest sig mot gruvlägren kring Topia; sedan jesuiten Hernando de Santarén misslyckats med att stifta fred slog Francisco de Urdiñola ned upproret med spanska och ursprungsamerikanska trupper och avrättade Perico och omkring 48 andra 1602–1603.
