# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
Ternatean–Portuguese war: Kriget mellan Ternate och Portugal
? The war in which the sultanate of Ternate, the great clove-producing kingdom of northern Maluku, drove the Portuguese from their fortress on the island. The Portuguese had built the fort of São João Baptista on Ternate from 1522 as allies of the sultans, but their captains’ behaviour, their missions and their attempts to control the clove trade led to growing conflict with Sultan Hairun (Khairun), who fought them in Ambon and Halmahera in the 1560s. On 25 February 1570 the captain Diogo Lopes de Mesquita invited Hairun into the fort for a meal of reconciliation, and his nephew Martim Afonso Pimentel stabbed the sultan to death at the gate. Hairun’s son Babullah was proclaimed sultan on the island of Hiri and swore enmity to the Portuguese until his father’s killers were punished. Ternate’s forces took the smaller Portuguese posts on the island and besieged São João Baptista, letting in only small rations of sago, while Ternatan fleets attacked Portuguese and mission positions in Halmahera and Morotai, and in Ambon, Buru and western Seram; the Portuguese kept their new fort at Ambon only with difficulty. Tidore at first sided with Ternate. After five years Babullah gave the garrison 24 hours to leave, and on 15 July 1575 the captain Nuno Pereira de Lacerda handed over the fort; the Portuguese left unharmed for Ambon, Malacca and the sandalwood islands of Solor and Timor. Babullah made the fort his palace and went on to build Ternate’s widest sphere of influence, while the Portuguese were allowed a fort on Tidore in 1578. Indonesians count the victory as the first of a state of the archipelago over a European power; Babullah was made a National Hero of Indonesia in 2020.
: Kriget där sultanatet Ternate, det stora kryddnejlikeproducerande kungariket i norra Moluckerna, drev portugiserna från deras fästning på ön. Portugiserna hade från 1522 byggt fortet São João Baptista på Ternate som sultanernas bundsförvanter, men kaptenernas uppträdande, portugisernas missioner och deras försök att kontrollera kryddnejlikehandeln ledde till en växande konflikt med sultan Hairun (Khairun), som bekämpade dem på Ambon och Halmahera på 1560-talet. Den 25 februari 1570 bjöd kaptenen Diogo Lopes de Mesquita in Hairun till fortet på en försoningsmåltid, och hans syskonbarn Martim Afonso Pimentel stack ihjäl sultanen vid porten. Hairuns son Babullah utropades till sultan på ön Hiri och svor att vara portugisernas fiende tills hans fars mördare hade straffats. Ternates styrkor intog de mindre portugisiska posteringarna på ön och belägrade São João Baptista, dit de bara släppte in små ransoner sago, medan ternatiska flottor anföll portugisiska ställningar och missionsstationer på Halmahera och Morotai samt på Ambon, Buru och västra Seram; portugiserna kunde bara med svårighet behålla sitt nya fort på Ambon. Tidore ställde sig till en början på Ternates sida. Efter fem år gav Babullah garnisonen 24 timmar att lämna fortet, och den 15 juli 1575 överlämnade kaptenen Nuno Pereira de Lacerda det; portugiserna drog oskadda vidare till Ambon, Malacka och sandelträöarna Solor och Timor. Babullah gjorde fortet till sitt palats och byggde därefter upp Ternates största inflytelsesfär någonsin, medan portugiserna 1578 fick uppföra ett fort på Tidore. Indonesier räknar segern som den första som en stat i arkipelagen vann över en europeisk makt; Babullah utnämndes till Indonesiens nationalhjälte 2020.
