# Svenska översättningar av katalogtexten (våg 12); stegtexterna kommer senare.
Wars of Tewodros II: Tewodros II:s krig
The wars by which Kassa Hailu, a chief from the western borderland of Qwara, ended the Zemene Mesafint, the “Era of the Princes” in which regional lords had ruled Ethiopia in the name of powerless emperors at Gondar, and made himself emperor as Tewodros II. Between November 1852 and February 1855 he defeated the lords of Gojjam at Gur Amba, the regent Ras Ali II at Ayshal and Dejazmach Wube of Semien and Tigray at Derasge, and was crowned on 11 February 1855. He then took Wollo and, in 1855–1856, the kingdom of Shewa, whose young heir Menelik he brought to his court. His attempts to rule through appointed officials and a standing army, and to tax the church, met revolt in almost every province, which he answered with ever harsher reprisals. By 1867 he held little beyond his fortress of Magdala, where he died during the British assault of April 1868.: De krig genom vilka Kassa Hailu, en hövding från gränslandet Qwara i väster, gjorde slut på Zemene Mesafint, ”furstarnas tidsålder”, då regionala herrar hade styrt Etiopien i maktlösa kejsares namn i Gondar, och gjorde sig själv till kejsare som Tewodros II. Mellan november 1852 och februari 1855 besegrade han herrarna i Gojjam vid Gur Amba, regenten ras Ali II vid Ayshal och dejazmach Wube av Semien och Tigray vid Derasge, och han kröntes den 11 februari 1855. Därefter tog han Wollo och 1855–1856 kungariket Shewa, vars unge arvinge Menelik han förde till sitt hov. Hans försök att styra genom utnämnda ämbetsmän och en stående armé, och att beskatta kyrkan, möttes av revolt i nästan varje provins, vilket han besvarade med allt hårdare repressalier. År 1867 behärskade han inte mycket mer än sin fästning Magdala, där han dog under den brittiska stormningen i april 1868.
