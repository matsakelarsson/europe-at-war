# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
Texas–Indian wars: Indiankrigen i Texas
? "The wars between Texas, as a republic, a state of the United States and a Confederate state, and the Comanche, the Kiowa and other Native nations of Texas, from Texan independence to the surrender of the last free Comanche band in 1875. In May 1836 Comanche, Kiowa and allied fighters attacked Fort Parker and carried off five captives, among them the nine-year-old Cynthia Ann Parker. Sam Houston sought treaties, but his successor Mirabeau Lamar (1838–1841) made war: in July 1839 Texan forces drove the Cherokee and their allies out of East Texas, killing their leader Duwali (Chief Bowl) at the Neches. On 19 March 1840, at a peace council in the Council House at San Antonio, Texan officials tried to hold the Comanche delegation of the Penateka leader Muguara hostage for the return of captives; 35 Comanche, among them 12 leaders, and 7 Texans were killed, and the Comanche killed 13 of the captives they held in reply. In August Buffalo Hump (Potsanaquahip) led several hundred Comanche and Kiowa to the coast, sacking Victoria and burning Linnville, and on the way back Texan militia and Rangers attacked them at Plum Creek on 12 August; in October John Henry Moore’s volunteers destroyed a Comanche village on the upper Colorado River. Houston returned to treaty-making in 1843–1844. After annexation (1845) the United States built lines of forts and in 1854 a reservation on the Brazos, whose Caddo, Anadarko and Tonkawa scouts fought beside the Rangers at Antelope Hills in 1858, where the Comanche leader Iron Jacket was killed, but in 1859 attacks by Texan vigilantes forced the reservation peoples into Indian Territory. At Pease River in December 1860 Rangers attacked a Comanche camp and recaptured Cynthia Ann Parker, the mother of Quanah. During the Civil War Comanche and Kiowa raids, such as the Elm Creek raid of October 1864, pushed the line of settlement back by more than 160 km, and Kickapoo migrating to Mexico defeated Confederate Texans at Dove Creek in January 1865. After the war the Kiowa leaders Satanta, Satank and Big Tree attacked a wagon train on Salt Creek Prairie in May 1871, and Ranald Mackenzie’s cavalry began campaigning on the Llano Estacado; the Red River War of 1874–1875 ended with Quanah Parker’s Quahadi Comanche surrendering at Fort Sill on 2 June 1875."
: "Krigen mellan Texas – som republik, som delstat i USA och som konfedererad delstat – och komancherna, kiowa och andra ursprungsnationer i Texas, från Texas självständighet till kapitulationen av den sista fria komanchgruppen 1875. I maj 1836 anföll komanch- och kiowakrigare med allierade Fort Parker och förde bort fem fångar, bland dem den nioåriga Cynthia Ann Parker. Sam Houston sökte fördrag, men hans efterträdare Mirabeau Lamar (1838–1841) förde krig: i juli 1839 drev texanska styrkor ut cherokeserna och deras allierade ur östra Texas och dödade deras ledare Duwali (Chief Bowl) vid Neches. Den 19 mars 1840, vid ett fredsmöte i Council House i San Antonio, försökte texanska ämbetsmän hålla penatekaledaren Muguaras komanchdelegation som gisslan för att få fångar återlämnade; 35 komancher, bland dem 12 ledare, och 7 texaner dödades, och komancherna dödade som svar 13 av de fångar de höll. I augusti ledde Buffalo Hump (Potsanaquahip) flera hundra komancher och kiowa till kusten, plundrade Victoria och brände Linnville, och på vägen tillbaka anföll texansk milis och Texas Rangers dem vid Plum Creek den 12 augusti; i oktober förintade John Henry Moores frivilliga en komanchby vid övre Coloradofloden. Houston återgick till fördragspolitiken 1843–1844. Efter annekteringen (1845) byggde USA linjer av fort och 1854 ett reservat vid Brazos, vars spanare ur caddo, anadarko och tonkawa stred vid Texas Rangers sida vid Antelope Hills 1858, där komanchledaren Iron Jacket dödades, men 1859 tvingade anfall av texanska vigilanter reservatsfolken att flytta till Indianterritoriet. Vid Pease River i december 1860 anföll Texas Rangers ett komanchläger och återtog Cynthia Ann Parker, Quanahs mor. Under inbördeskriget trängde komanch- och kiowaräder, som räden vid Elm Creek i oktober 1864, tillbaka bosättningsgränsen med mer än 160 km, och kickapoo som utvandrade till Mexiko besegrade konfedererade texaner vid Dove Creek i januari 1865. Efter kriget anföll kiowaledarna Satanta, Satank och Big Tree ett vagnståg på Salt Creek Prairie i maj 1871, och Ranald Mackenzies kavalleri inledde fälttåg på Llano Estacado; Red River-kriget 1874–1875 slutade med att Quanah Parkers quahadi-komancher gav upp i Fort Sill den 2 juni 1875."
