# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
Texas Revolution: Texanska revolutionen
? The rebellion of Texas against the government of Mexico in 1835–1836, which made Texas an independent republic. From the 1820s Mexico had invited settlers into its thinly peopled province of Coahuila y Tejas, and by 1835 Anglo-American colonists, many of them slaveholders from the US South, outnumbered the Tejanos (Mexican Texans) by several to one. They clashed with the government over Mexico’s attempts to end slavery and to stop immigration from the United States, and over the centralist rule of Antonio López de Santa Anna, who in 1835 overthrew the federal constitution of 1824. The fighting began at Gonzales on 2 October 1835; by December the Texians, with Tejano allies, had driven the Mexican garrisons out. Santa Anna marched north with some 6,000 men, took the Alamo in San Antonio on 6 March 1836, killing all its defenders, and on 27 March had more than 340 prisoners shot at Goliad. A convention declared Texas independent on 2 March. On 21 April Sam Houston’s army surprised and routed Santa Anna’s force at San Jacinto and captured him; at Velasco he agreed to withdraw his troops. Mexico never accepted the treaties, and Texas remained an independent republic, recognised by the United States, France and Britain but not by Mexico, until the United States annexed it in 1845.
: Texas uppror mot Mexikos regering 1835–1836, som gjorde Texas till en självständig republik. Från 1820-talet hade Mexiko bjudit in nybyggare till sin glest befolkade provins Coahuila y Tejas, och 1835 var de angloamerikanska kolonisterna, många av dem slavägare från sydstaterna i USA, flera gånger så många som tejanos (mexikanska texaner). De kom i konflikt med regeringen om Mexikos försök att avskaffa slaveriet och stoppa invandringen från USA, och om Antonio López de Santa Annas centralistiska styre; Santa Anna hade 1835 upphävt 1824 års federala konstitution. Striderna började vid Gonzales den 2 oktober 1835; i december hade texianerna, med allierade bland tejanos, drivit ut de mexikanska garnisonerna. Santa Anna marscherade norrut med omkring 6 000 man, intog Alamo i San Antonio den 6 mars 1836 och dödade alla dess försvarare, och den 27 mars lät han skjuta mer än 340 fångar vid Goliad. Ett konvent förklarade Texas självständigt den 2 mars. Den 21 april överraskade Sam Houstons armé Santa Annas styrka vid San Jacinto, slog den på flykten och tillfångatog honom; i Velasco gick han med på att dra tillbaka sina trupper. Mexiko godtog aldrig fördragen, och Texas förblev en självständig republik, erkänd av USA, Frankrike och Storbritannien men inte av Mexiko, tills USA annekterade den 1845.
