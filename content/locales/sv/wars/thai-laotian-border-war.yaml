Thai–Laotian Border War: Thailändsk-laotiska gränskriget
? "A short war between Thailand and Laos over a disputed stretch of their border in the Luang Prabang range, around the village of Ban Rom Klao in Chat Trakan district of Phitsanulok province and Botene district of Sainyabuli province. The Franco-Siamese treaty of 1907 put the border on the watershed, but the French map drawn after it did not always follow it, and where a river split into two branches each side claimed a different one; logging in the disputed forest added to the friction. Clashes in 1984 over three villages on the border of Uttaradit province had already brought the two countries close to war. In December 1987 the Thai army moved to drive Lao troops from Hill 1428 above Ban Rom Klao, which both sides claimed, and the fighting grew into a two-month battle for the hill. Thai F-5 and other aircraft bombed the Lao positions, and Thailand lost two aircraft to Lao air defences; Vietnam, then allied with Laos, moved troops into Sainyabuli. The Lao forces kept the summit. After talks on 16–17 February 1988 a ceasefire took effect on 19 February, and both sides pulled back 3 km. Estimates of the dead range from about 100 to 200 Thai and some 300 Lao soldiers. The war hastened a change in Thai policy: the new prime minister, Chatichai Choonhavan, spoke in 1988 of turning the battlefields of Indochina into marketplaces, and the border was surveyed and largely demarcated in the following decades."
: "Ett kort krig mellan Thailand och Laos om en omstridd sträcka av gränsen i Luang Prabangbergen, kring byn Ban Rom Klao i distriktet Chat Trakan i provinsen Phitsanulok och distriktet Botene i provinsen Sainyabuli. Det fransk-siamesiska fördraget 1907 lade gränsen längs vattendelaren, men den franska karta som ritades efter fördraget följde den inte alltid, och där en flod delade sig i två grenar gjorde de två sidorna anspråk på var sin gren; skogsavverkning i den omstridda skogen ökade friktionen. Sammandrabbningar 1984 om tre byar vid gränsen till provinsen Uttaradit hade redan fört de två länderna nära krig. I december 1987 gick den thailändska armén in för att driva bort laotiska trupper från Höjd 1428 ovanför Ban Rom Klao, som båda sidor gjorde anspråk på, och striderna växte till ett tvåmånaders slag om höjden. Thailändska F-5 och andra flygplan bombade de laotiska ställningarna, och Thailand förlorade två flygplan till det laotiska luftförsvaret; Vietnam, som då var allierat med Laos, förde in trupper i Sainyabuli. De laotiska styrkorna behöll toppen. Efter samtal den 16–17 februari 1988 trädde ett eldupphör i kraft den 19 februari, och båda sidor drog sig tillbaka 3 km. Uppskattningarna av antalet döda sträcker sig från omkring 100 till 200 thailändska och omkring 300 laotiska soldater. Kriget påskyndade en omläggning av den thailändska politiken: den nye premiärministern, Chatichai Choonhavan, talade 1988 om att förvandla Indokinas slagfält till marknadsplatser, och gränsen mättes upp och demarkerades till stor del under de följande årtiondena."
