Success for Stephen: Stefans framgångar
Henry I’s only legitimate son drowned in the wreck of the White Ship in 1120, and Henry made his barons swear to accept his daughter Matilda, the widowed empress, now married to Count Geoffrey of Anjou. When Henry died on 1 December 1135, his nephew Stephen of Blois crossed from Boulogne, won over London and, with the help of his brother Henry, bishop of Winchester, the royal treasury, and was crowned that month. Matilda’s uncle, King David I of Scotland, invaded the north and was allowed to keep Carlisle. In 1138 Robert, earl of Gloucester, Matilda’s half-brother and one of the richest barons, renounced his loyalty to Stephen, and revolts broke out in Kent and the south-west.: Henrik I:s ende legitime son drunknade när Vita skeppet förliste 1120, och Henrik lät sina baroner svära att godta hans dotter Matilda, den änkeblivna kejsarinnan, som nu var gift med greve Gottfrid av Anjou. När Henrik dog den 1 december 1135 for hans systerson Stefan av Blois över från Boulogne, vann London för sin sak och, med hjälp av sin bror Henrik, biskop av Winchester, även kungliga skattkammaren, och kröntes samma månad. Matildas morbror, kung David I av Skottland, invaderade norra England och fick behålla Carlisle. År 1138 sade Robert, earl av Gloucester, Matildas halvbror och en av de rikaste baronerna, upp sin trohet mot Stefan, och uppror bröt ut i Kent och sydvästra England.
That year David invaded again, and his army plundered Northumberland and Durham. Archbishop Thurstan of York rallied the northern barons and levies, who gathered round a cart carrying a ship’s mast hung with the banners of northern saints, the Standard. On 22 August 1138, on Cowton Moor near Northallerton, they routed the Scots. Even so, by the Treaty of Durham of 9 April 1139 Stephen made David’s son Henry earl of Northumberland, leaving the Scots in control almost to the Tees. On 30 September Matilda and Robert landed at Arundel; Stephen let her join her brother at Bristol, and the west of England became her stronghold.: Samma år invaderade David på nytt, och hans armé plundrade Northumberland och Durham. Ärkebiskop Thurstan av York samlade de nordliga baronerna och uppbådet, som slöt upp kring en vagn med en skeppsmast behängd med nordliga helgons fanor, Standard. Den 22 augusti 1138 slog de skottarna på flykten på Cowton Moor nära Northallerton. Trots detta gjorde Stefan genom fördraget i Durham den 9 april 1139 Davids son Henrik till earl av Northumberland, vilket lämnade skottarna med kontrollen nästan ända ned till Tees. Den 30 september landsteg Matilda och Robert vid Arundel; Stefan lät henne ansluta sig till sin bror i Bristol, och västra England blev hennes fäste.
