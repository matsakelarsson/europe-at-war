Neither side could win, and the war became one of castles, sieges and raids. Barons built castles without the king’s leave, and some, like Geoffrey de Mandeville in the fens, plundered at will until he was killed in 1144. The Peterborough chronicler wrote that men said openly that Christ and his saints slept. Robert of Gloucester died in 1147, and the Empress left England in 1148, leaving the cause to her son, Henry FitzEmpress. Henry became duke of Normandy in 1150 and count of Anjou in 1151, and in 1152 he married Eleanor, duchess of Aquitaine.: Ingen av sidorna kunde vinna, och kriget blev ett krig av borgar, belägringar och räder. Baroner byggde borgar utan kungens tillstånd, och vissa, som Geoffrey de Mandeville i träskmarkerna i Fens, plundrade efter behag tills han dödades 1144. Krönikören i Peterborough skrev att folk öppet sade att Kristus och hans helgon sov. Robert av Gloucester dog 1147, och kejsarinnan lämnade England 1148 och överlät saken åt sin son, Henry FitzEmpress. Henrik blev hertig av Normandie 1150 och greve av Anjou 1151, och 1152 gifte han sig med Eleonora, hertiginna av Akvitanien.
In January 1153 Henry crossed to England with a small army. In July his forces and Stephen’s faced each other across the Thames at Wallingford, but the barons on both sides would not fight, and the church arranged a truce. Stephen’s son Eustace died in August. In November, at Winchester, Stephen recognised Henry as his adopted son and heir, keeping the crown for life. Stephen died on 25 October 1154, and Henry II was crowned on 19 December, ruling lands from the Scottish border to the Pyrenees. In 1157 he made David’s grandson Malcolm IV hand back the northern counties.: I januari 1153 for Henrik över till England med en liten armé. I juli stod hans och Stefans styrkor mot varandra på var sin sida av Themsen vid Wallingford, men baronerna på båda sidor ville inte strida, och kyrkan ordnade ett stillestånd. Stefans son Eustace dog i augusti. I november, i Winchester, erkände Stefan Henrik som sin adoptivson och arvinge och behöll själv kronan livet ut. Stefan dog den 25 oktober 1154, och Henrik II kröntes den 19 december och härskade över länder från den skotska gränsen till Pyrenéerna. År 1157 tvingade han Davids sonson Malcolm IV att lämna tillbaka de nordliga grevskapen.
