Early in 1141 Stephen besieged Lincoln castle, which Ranulf, earl of Chester, had seized. Ranulf and Robert of Gloucester came to its relief with their men, the disinherited and Welsh troops, and on 2 February Stephen fought on foot after his earls had fled, until he was captured; he was imprisoned at Bristol. Bishop Henry, now papal legate, went over to the Empress, and in April a church council at Winchester accepted her as Lady of the English. But when she came to London in June to be crowned, her demands for money angered the citizens, who rose and drove her out.: I början av 1141 belägrade Stefan borgen i Lincoln, som Ranulf, earl av Chester, hade intagit. Ranulf och Robert av Gloucester kom till undsättning med sina män, de arvlösa och walesiska trupper, och den 2 februari stred Stefan till fots sedan hans earler hade flytt, tills han tillfångatogs; han hölls fången i Bristol. Biskop Henrik, nu påvlig legat, gick över till kejsarinnan, och i april godtog ett kyrkomöte i Winchester henne som engelsmännens härskarinna. Men när hon kom till London i juni för att krönas retade hennes krav på pengar upp borgarna, som reste sig och drev ut henne.
Stephen’s queen, Matilda of Boulogne, kept his cause alive with William of Ypres and his Flemish mercenaries. When the Empress besieged Bishop Henry, who had changed sides again, in Winchester, the queen’s army besieged her in turn. On 14 September the Angevins broke out and were routed; Robert of Gloucester was captured covering the retreat at Stockbridge and exchanged for Stephen in November. In 1142 Stephen besieged the Empress in Oxford castle. In December she escaped across the frozen Thames, dressed in white against the snow, to Wallingford. Meanwhile her husband Geoffrey conquered Normandy, entering Rouen in January 1144.: Stefans drottning, Matilda av Boulogne, höll hans sak vid liv med Vilhelm av Ypres och hans flamländska legosoldater. När kejsarinnan belägrade biskop Henrik, som på nytt hade bytt sida, i Winchester, belägrades hon i sin tur av drottningens armé. Den 14 september bröt angevinerna ut och slogs på flykten; Robert av Gloucester tillfångatogs när han täckte reträtten vid Stockbridge och utväxlades mot Stefan i november. År 1142 belägrade Stefan kejsarinnan i borgen i Oxford. I december flydde hon över den frusna Themsen, klädd i vitt mot snön, till Wallingford. Under tiden erövrade hennes make Gottfrid Normandie och tågade in i Rouen i januari 1144.
