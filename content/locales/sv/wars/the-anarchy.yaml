The Anarchy: Anarkin
A civil war in England and Normandy over the succession to Henry I, fought between his nephew King Stephen and his daughter, the Empress Matilda, with King David I of Scotland taking her side and seizing the north. Neither side could win, and in 1153 Stephen recognised Matilda’s son Henry as his heir; Henry II succeeded him in 1154.: Ett inbördeskrig i England och Normandie om tronföljden efter Henrik I, utkämpat mellan hans systerson kung Stefan och hans dotter, kejsarinnan Matilda, där kung David I av Skottland tog hennes parti och lade beslag på norra England. Ingen av sidorna kunde vinna, och 1153 erkände Stefan Matildas son Henrik som sin arvinge; Henrik II efterträdde honom 1154.
