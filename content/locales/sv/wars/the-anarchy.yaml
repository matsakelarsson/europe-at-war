The name “the Anarchy” was given by Victorian historians; contemporaries wrote of the troubles of Stephen’s reign. The main chronicles, the Gesta Stephani, William of Malmesbury and Henry of Huntingdon, each lean to one side.: Namnet ”anarkin” gavs av viktorianska historiker; samtiden skrev om oroligheterna under Stefans regering. De viktigaste krönikorna, Gesta Stephani, William av Malmesbury och Henry av Huntingdon, lutar var och en åt ena sidan.
Matilda is called the Empress because her first husband was the Emperor Henry V. To avoid confusion with her, Stephen’s queen is called Matilda of Boulogne.: Matilda kallas kejsarinnan eftersom hennes förste make var kejsar Henrik V. För att undvika sammanblandning med henne kallas Stefans drottning Matilda av Boulogne.
