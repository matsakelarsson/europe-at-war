Since 1921 Northern Ireland had had its own parliament and government, always led by unionists, and its Catholic minority faced discrimination in housing, jobs and local elections. In the late 1960s a civil rights movement took to the streets. On 5 October 1968 police batoned a banned march in Derry, and in January 1969 loyalists ambushed a student march at Burntollet Bridge. In August 1969, after the “Battle of the Bogside” between Derry nationalists and the police, and riots in Belfast in which Catholic streets were burned, the British government sent in troops. The IRA split, and the new Provisional IRA began a campaign to drive Britain out.: Sedan 1921 hade Nordirland haft ett eget parlament och en egen regering, alltid ledda av unionister, och dess katolska minoritet diskriminerades i fråga om bostäder, arbeten och lokalval. I slutet av 1960-talet gick en medborgarrättsrörelse ut på gatorna. Den 5 oktober 1968 slog polisen med batonger mot en förbjuden marsch i Derry, och i januari 1969 överföll lojalister en studentmarsch vid Burntollet Bridge. I augusti 1969, efter ”slaget om Bogside” mellan nationalister i Derry och polisen och upplopp i Belfast där katolska gator brändes, skickade den brittiska regeringen in trupper. IRA splittrades, och den nya provisoriska IRA inledde en kampanj för att driva ut Storbritannien.
Internment without trial, brought in in August 1971, was used almost only against nationalists. On 30 January 1972, Bloody Sunday, paratroopers shot dead 13 unarmed men at a civil rights march in Derry, and another died later. 1972 was the deadliest year, with nearly 500 killed. Britain suspended Stormont and ruled directly from London, and on Bloody Friday, 21 July, the IRA set off some twenty bombs in Belfast, killing nine people.: Internering utan rättegång, som infördes i augusti 1971, användes nästan enbart mot nationalister. Den 30 januari 1972, blodiga söndagen, sköt fallskärmsjägare ihjäl 13 obeväpnade män vid en medborgarrättsmarsch i Derry, och ytterligare en dog senare. 1972 var det blodigaste året, med nästan 500 dödade. Storbritannien upphävde Stormont och styrde direkt från London, och på blodiga fredagen, den 21 juli, detonerade IRA ett tjugotal bomber i Belfast och dödade nio människor.
A power-sharing government formed under the Sunningdale Agreement collapsed in May 1974 during a loyalist general strike. That month UVF car bombs killed 33 people in Dublin and Monaghan, the deadliest attack of the Troubles, and in November IRA bombs killed 21 people in two Birmingham pubs. Sectarian murders by both sides went on through the decade. On 27 August 1979 the IRA killed Lord Mountbatten and three others in County Sligo and 18 soldiers at Warrenpoint.: En regering med maktdelning, bildad enligt Sunningdaleavtalet, föll i maj 1974 under en lojalistisk generalstrejk. Samma månad dödade UVF:s bilbomber 33 människor i Dublin och Monaghan, det blodigaste attentatet under konflikten, och i november dödade IRA:s bomber 21 människor på två pubar i Birmingham. Sekteristiska mord från båda sidor fortsatte under hela årtiondet. Den 27 augusti 1979 dödade IRA lord Mountbatten och tre andra i grevskapet Sligo och 18 soldater vid Warrenpoint.
