The Troubles: Konflikten i Nordirland
A conflict in Northern Ireland from the late 1960s to 1998 between republican paramilitaries seeking a united Ireland, loyalist paramilitaries determined to keep Northern Ireland British, and the British Army and police. More than 3,500 people were killed, about half of them civilians, before ceasefires and the Good Friday Agreement of 1998 set up a power-sharing government.: En konflikt i Nordirland från slutet av 1960-talet till 1998 mellan republikanska paramilitära grupper som ville ha ett enat Irland, lojalistiska paramilitära grupper som var fast beslutna att behålla Nordirland brittiskt samt brittiska armén och polisen. Mer än 3 500 människor dödades, omkring hälften av dem civila, innan vapenvilor och långfredagsavtalet 1998 ledde till en regering med maktdelning.
