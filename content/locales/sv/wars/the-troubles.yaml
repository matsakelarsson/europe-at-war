Bloody Sunday: Blodiga söndagen
Writers date the start differently, to the founding of the loyalist Ulster Volunteer Force in 1966, the Derry march of October 1968 or the arrival of British troops in August 1969. Violence by small groups opposed to the peace process went on after 1998.: Författare daterar början olika, till grundandet av den lojalistiska Ulster Volunteer Force 1966, marschen i Derry i oktober 1968 eller de brittiska truppernas ankomst i augusti 1969. Våld från små grupper som motsatte sig fredsprocessen fortsatte efter 1998.
The main republican groups were the Provisional IRA and the smaller Irish National Liberation Army (INLA); the main loyalist groups were the Ulster Volunteer Force (UVF) and the Ulster Defence Association (UDA). The security forces were the British Army, the Royal Ulster Constabulary (RUC) and the locally recruited Ulster Defence Regiment.: De viktigaste republikanska grupperna var provisoriska IRA och den mindre Irish National Liberation Army (INLA); de viktigaste lojalistiska grupperna var Ulster Volunteer Force (UVF) och Ulster Defence Association (UDA). Säkerhetsstyrkorna var brittiska armén, Royal Ulster Constabulary (RUC) och det lokalt rekryterade Ulster Defence Regiment.
The city of Derry is officially named Londonderry; both names are in use, and this story uses the shorter one. Figures for the dead are from the Sutton Index of Deaths (CAIN, Ulster University).: Staden Derry heter officiellt Londonderry; båda namnen används, och denna berättelse använder det kortare. Siffrorna för döda kommer från Sutton Index of Deaths (CAIN, Ulster University).
