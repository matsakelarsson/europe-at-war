Soldiers of the Parachute Regiment opened fire on a march against internment in the Bogside. The Saville Inquiry found in 2010 that none of the victims had posed a threat, and the British prime minister apologised.: Soldater ur fallskärmsregementet öppnade eld mot en marsch mot interneringarna i Bogside. Savilleutredningen fann 2010 att inget av offren hade utgjort något hot, och den brittiske premiärministern bad om ursäkt.
Bloody Friday: Blodiga fredagen
21 July 1972: 21 juli 1972
At least twenty IRA bombs, most of them car bombs, went off across Belfast in 80 minutes, killing five civilians, two soldiers, a police reservist and a UDA member, and injuring 130 people.: Minst tjugo IRA-bomber, de flesta bilbomber, detonerade runtom i Belfast inom loppet av 80 minuter och dödade fem civila, två soldater, en polisreservist och en UDA-medlem samt skadade 130 människor.
Dublin and Monaghan bombings: Bombattentaten i Dublin och Monaghan
17 May 1974: 17 maj 1974
Three car bombs in Dublin’s evening rush hour and a fourth in Monaghan killed 33 civilians and an unborn child. The UVF admitted responsibility in 1993.: Tre bilbomber i Dublins kvällsrusning och en fjärde i Monaghan dödade 33 civila och ett ofött barn. UVF tog på sig ansvaret 1993.
Birmingham pub bombings: Pubattentaten i Birmingham
21 November 1974: 21 november 1974
Bombs in two city-centre pubs killed 21 people. Six Irishmen convicted of the attack were freed in 1991, when their convictions were quashed.: Bomber på två pubar i stadens centrum dödade 21 människor. Sex irländare som dömts för attentatet frigavs 1991, när deras domar upphävdes.
Mullaghmore: Mullaghmore
27 August 1979: 27 augusti 1979
An IRA bomb on Lord Mountbatten’s fishing boat killed him, two boys and an elderly woman.: En IRA-bomb på lord Mountbattens fiskebåt dödade honom, två pojkar och en äldre kvinna.
Warrenpoint: Warrenpoint
Two IRA bombs at Narrow Water killed 18 soldiers, the British Army’s heaviest loss in a single attack in Northern Ireland.: Två IRA-bomber vid Narrow Water dödade 18 soldater, brittiska arméns största förlust i ett enskilt attentat i Nordirland.
In 1976 Britain stopped treating paramilitary prisoners as a special category, and republicans in the Maze prison protested for years, then went on hunger strike. In 1981 ten men, seven from the IRA and three from the INLA, starved to death. The first, Bobby Sands, was elected to Parliament weeks before he died in May, and some 100,000 people went to his funeral. Sinn Féin, the IRA’s political wing, began to stand in elections. The IRA bombed the Brighton hotel where Margaret Thatcher’s government was staying in 1984 and killed eleven people at a Remembrance Day ceremony in Enniskillen in 1987.: År 1976 slutade Storbritannien att behandla paramilitära fångar som en särskild kategori, och republikaner i Mazefängelset protesterade i åratal och inledde sedan hungerstrejk. År 1981 svalt tio män ihjäl, sju från IRA och tre från INLA. Den förste, Bobby Sands, valdes in i parlamentet några veckor innan han dog i maj, och omkring 100 000 människor gick på hans begravning. Sinn Féin, IRA:s politiska gren, började ställa upp i val. IRA bombade hotellet i Brighton där Margaret Thatchers regering bodde 1984 och dödade elva människor vid en minnesceremoni på Remembrance Day i Enniskillen 1987.
The Anglo-Irish Agreement of 1985 gave the Irish government a say in Northern Ireland, to the fury of unionists. Secret talks, the Downing Street Declaration of December 1993 and American mediation opened a peace process. The IRA declared a ceasefire on 31 August 1994 and the main loyalist groups in October. The IRA broke it with a bomb in London’s Docklands in February 1996, then restored it in July 1997.: Det brittisk-irländska avtalet 1985 gav den irländska regeringen inflytande i Nordirland, till unionisternas raseri. Hemliga samtal, Downing Street-deklarationen i december 1993 och amerikansk medling inledde en fredsprocess. IRA utlyste vapenvila den 31 augusti 1994 och de viktigaste lojalistiska grupperna i oktober. IRA bröt den med en bomb i Londons Docklands i februari 1996 och återinförde den sedan i juli 1997.
Talks chaired by the American senator George Mitchell produced the Good Friday Agreement of 10 April 1998, which set up a power-sharing government and cross-border bodies, released paramilitary prisoners and laid down that Northern Ireland would stay in the United Kingdom until a majority there voted otherwise. Voters approved it on 22 May, by 71 per cent in Northern Ireland and 94 per cent in the Republic. On 15 August a bomb planted by the Real IRA, a breakaway group, killed 29 people in Omagh. In all more than 3,500 had died; republicans killed about 60 per cent of them, loyalists 30 and the security forces 10.: Samtal under ledning av den amerikanske senatorn George Mitchell ledde fram till långfredagsavtalet den 10 april 1998, som inrättade en regering med maktdelning och gränsöverskridande organ, frigav paramilitära fångar och fastställde att Nordirland skulle förbli en del av Storbritannien tills en majoritet där röstade för något annat. Väljarna godkände det den 22 maj, med 71 procent i Nordirland och 94 procent i republiken. Den 15 augusti dödade en bomb utplacerad av Real IRA, en utbrytargrupp, 29 människor i Omagh. Sammanlagt hade mer än 3 500 dött; republikaner dödade omkring 60 procent av dem, lojalister 30 och säkerhetsstyrkorna 10.
