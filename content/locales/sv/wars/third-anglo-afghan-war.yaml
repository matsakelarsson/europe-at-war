Third Anglo-Afghan War: Tredje anglo-afghanska kriget
A short war between Afghanistan and British India in 1919. The new emir, Amanullah Khan, proclaimed Afghanistan fully independent and sent troops across the frontier, where they took the springs at Bagh in the Khyber Pass. The British drove them back, advanced to Dakka, took Spin Boldak and relieved Thal, which Nadir Khan had besieged, and their aircraft bombed Jalalabad and Kabul. Afghanistan asked for an armistice in June. By the Treaty of Rawalpindi Britain gave up control of Afghan foreign policy, and Afghanistan accepted the existing border with India.: Ett kort krig mellan Afghanistan och Brittiska Indien 1919. Den nye emiren, Amanullah Khan, utropade Afghanistan till fullt självständigt och sände trupper över gränsen, där de intog källorna vid Bagh i Khyberpasset. Britterna drev tillbaka dem, ryckte fram till Dakka, intog Spin Boldak och undsatte Thal, som Nadir Khan hade belägrat, och deras flygplan bombade Jalalabad och Kabul. Afghanistan begärde vapenstillestånd i juni. Genom fördraget i Rawalpindi avstod Storbritannien från kontrollen över Afghanistans utrikespolitik, och Afghanistan godtog den befintliga gränsen mot Indien.
