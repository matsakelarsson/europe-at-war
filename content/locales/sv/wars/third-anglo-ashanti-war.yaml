# Svenska översättningar av katalogtexten (våg 13); stegtexterna kommer senare.
Third Anglo-Ashanti War: Tredje anglo-ashantiska kriget
? The war in which Britain broke the power of the Asante Empire over the Gold Coast, now Ghana. When the Netherlands sold its Gold Coast forts to Britain in 1872, Asante lost Elmina, the port through which it had traded with the Dutch and which it regarded as its own. In 1873 Asante armies under Amankwatia crossed the Pra river, overran the lands of the Fante and their neighbours under British protection and threatened the forts on the coast. Britain sent Major-General Sir Garnet Wolseley, who held the coast through the autumn while disease drove the Asante back across the Pra, and then, with three British battalions, West Indian and African troops and thousands of carriers, built a road through the forest and marched on Kumasi. After hard fighting at Amoaful on 31 January 1874 and at Odaso on 4 February, the British entered Kumasi, abandoned by the Asantehene Kofi Karikari, and on 6 February blew up the palace and burned the city. By the Treaty of Fomena Asante promised a huge indemnity in gold and gave up its claims south of the Pra. Britain proclaimed the Gold Coast Colony in July 1874, and Asante, its authority shaken, lost much of its empire over the following years.
: Det krig i vilket Storbritannien bröt Ashantirikets makt över Guldkusten, i dagens Ghana. När Nederländerna 1872 sålde sina fort på Guldkusten till Storbritannien förlorade Ashanti Elmina, den hamn genom vilken riket hade handlat med nederländarna och som det betraktade som sin egen. År 1873 gick ashantiska arméer under Amankwatia över floden Pra, överskred landen som tillhörde fante och deras grannar under brittiskt beskydd och hotade forten vid kusten. Storbritannien sände generalmajor sir Garnet Wolseley, som höll kusten under hösten medan sjukdomar drev ashantiarmén tillbaka över Pra, och som sedan, med tre brittiska bataljoner, västindiska och afrikanska trupper och tusentals bärare, byggde en väg genom skogen och marscherade mot Kumasi. Efter hårda strider vid Amoaful den 31 januari 1874 och vid Odaso den 4 februari tågade britterna in i Kumasi, som asantehene Kofi Karikari hade övergett, och den 6 februari sprängde de palatset och brände staden. Genom fördraget i Fomena lovade Ashanti ett väldigt skadestånd i guld och avstod från sina anspråk söder om Pra. Storbritannien utropade kolonin Guldkusten i juli 1874, och Ashanti, vars auktoritet hade skakats, förlorade under de följande åren en stor del av sitt imperium.
