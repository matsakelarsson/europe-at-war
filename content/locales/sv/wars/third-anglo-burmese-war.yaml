Third Anglo-Burmese War: Tredje anglo-burmesiska kriget
? The British conquest of the Konbaung kingdom of Upper Burma, and the long resistance that followed. Relations between British India and King Thibaw’s court at Mandalay had been poor since his accession in 1878, and the British feared the court’s dealings with France, which was then conquering Tonkin. In 1885 the Burmese council of ministers (Hluttaw) fined the Bombay Burmah Trading Corporation, a British teak firm, for under-reporting the timber it took from the Toungoo forests and underpaying its workers. The Viceroy, Lord Dufferin, answered with an ultimatum on 22 October 1885 that would have put Burma’s foreign relations under British control. When the court refused, a flotilla of steamers under Major-General Harry Prendergast carried about 9,000 British and Indian troops up the Irrawaddy, took the forts at Minhla on 17 November and reached Mandalay on 28 November. Thibaw surrendered and was exiled to Ratnagiri in India, where he died in 1916, and on 1 January 1886 Upper Burma was annexed to British India. Princes, former officials, soldiers of the disbanded army, monks and village leaders then fought the occupation for about ten years. British reports called them “dacoits”, armed robbers; Burmese histories call it a resistance movement. The British needed tens of thousands of soldiers and military police, collective punishments of villages and the resettlement of villagers to end it, and they extended their rule over the Shan states and the Chin and Kachin hills.
: Den brittiska erövringen av Konbaungriket i Övre Burma, och det långa motstånd som följde. Förbindelserna mellan Brittiska Indien och kung Thibaws hov i Mandalay hade varit dåliga sedan hans tronbestigning 1878, och britterna fruktade hovets kontakter med Frankrike, som då höll på att erövra Tonkin. År 1885 bötfällde det burmesiska ministerrådet (Hluttaw) Bombay Burmah Trading Corporation, ett brittiskt teakföretag, för att ha uppgett för lite av det timmer som det tog ut ur skogarna vid Toungoo och för att ha betalat sina arbetare för lite. Vicekungen, lord Dufferin, svarade den 22 oktober 1885 med ett ultimatum som skulle ha ställt Burmas utrikesförbindelser under brittisk kontroll. När hovet vägrade förde en flottilj av ångare under generalmajor Harry Prendergast omkring 9 000 brittiska och indiska soldater uppför Irrawaddy, intog fästena vid Minhla den 17 november och nådde Mandalay den 28 november. Thibaw kapitulerade och förvisades till Ratnagiri i Indien, där han dog 1916, och den 1 januari 1886 annekterades Övre Burma till Brittiska Indien. Prinsar, före detta ämbetsmän, soldater från den upplösta armén, munkar och byledare bekämpade sedan ockupationen i omkring tio år. Brittiska rapporter kallade dem ”dacoits”, väpnade rövare; burmesiska historieverk kallar det en motståndsrörelse. Britterna behövde tiotusentals soldater och militärpoliser, kollektiva bestraffningar av byar och omflyttning av bybor för att få slut på det, och de utsträckte sitt styre över shanstaterna och Chin- och Kachinbergen.
