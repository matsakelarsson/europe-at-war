Third Anglo-Dutch War: Tredje engelsk-nederländska kriget
England’s part in Louis XIV’s attack on the Dutch Republic, agreed in the secret Treaty of Dover of 1670 in return for French subsidies. An English attack on the Dutch Smyrna convoy in March 1672 opened the war. On 7 June 1672 Michiel de Ruyter surprised the Anglo-French fleet at Solebay off the Suffolk coast, and in 1673 his smaller fleet fought the allies to a standstill in two battles at the Schooneveld off Zeeland and at the Texel (Kijkduin) on 21 August, preventing a landing in Holland; a Dutch squadron also briefly retook New York. The war was unpopular and expensive in England, where suspicion of Catholic influence at court grew. By the Treaty of Westminster of 19 February 1674 the Dutch handed New York back to England and agreed to pay an indemnity, and England left the war, which went on as the Franco-Dutch War.: Englands del i Ludvig XIV:s anfall på Nederländska republiken, som överenskommits i det hemliga fördraget i Dover 1670 mot franska subsidier. Ett engelskt anfall på den nederländska Smyrnakonvojen i mars 1672 inledde kriget. Den 7 juni 1672 överraskade Michiel de Ruyter den engelsk-franska flottan vid Solebay utanför Suffolks kust, och 1673 höll hans mindre flotta stånd mot de allierade i två slag vid Schooneveld utanför Zeeland och vid Texel (Kijkduin) den 21 augusti, vilket förhindrade en landstigning i Holland; en nederländsk eskader återtog också en kort tid New York. Kriget var impopulärt och dyrt i England, där misstankarna mot katolskt inflytande vid hovet växte. Genom freden i Westminster den 19 februari 1674 lämnade nederländarna tillbaka New York till England och gick med på att betala ett skadestånd, och England lämnade kriget, som fortsatte som fransk-nederländska kriget.
