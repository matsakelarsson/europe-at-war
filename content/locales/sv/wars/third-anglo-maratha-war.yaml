Third Anglo-Maratha War: Tredje anglo-marathiska kriget
The last war between the British East India Company and the Maratha powers, also called the Pindari War. In 1817 the Governor-General, Lord Hastings, gathered some 120,000 men to destroy the Pindaris, the mounted raiders of central India, and forced Scindia and Amir Khan to join him. The Peshwa Baji Rao II, the Bhonsle ruler of Nagpur and Holkar’s army rose against the Company and were beaten at Khadki, Sitabuldi and Mahidpur, and a small Company force held off the Peshwa’s army at Koregaon. Baji Rao surrendered in June 1818 and was pensioned off to Bithur; his lands were annexed, the Raja of Satara was given a small state, Nagpur and Holkar lost territory, and the Pindari bands were broken up. Asirgarh, the last fortress to hold out, fell in April 1819. The Company was now the paramount power in India south of the Sutlej.: Det sista kriget mellan Brittiska ostindiska kompaniet och marathamakterna, även kallat pindarikriget. År 1817 samlade generalguvernören, lord Hastings, omkring 120 000 man för att förinta pindarierna, de beridna plundrarna i centrala Indien, och tvingade Scindia och Amir Khan att ansluta sig till honom. Peshwan Baji Rao II, bhonslehärskaren i Nagpur och Holkars armé reste sig mot kompaniet och besegrades vid Khadki, Sitabuldi och Mahidpur, och en liten kompanistyrka höll stånd mot peshwans armé vid Koregaon. Baji Rao kapitulerade i juni 1818 och sattes på pension i Bithur; hans länder annekterades, rajan av Satara fick en liten stat, Nagpur och Holkar förlorade landområden och pindariernas band upplöstes. Asirgarh, den sista fästningen som höll stånd, föll i april 1819. Kompaniet var nu den högsta makten i Indien söder om Sutlej.
