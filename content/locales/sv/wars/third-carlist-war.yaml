Third Carlist War: Tredje karlistkriget
The last Carlist War, fought by the supporters of the claimant Carlos VII against the governments of King Amadeo I, the First Spanish Republic and finally Alfonso XII. Strongest again in Navarre and the Basque provinces, where they set up a state with its capital at Estella, and in Catalonia and the Maestrazgo, the Carlists besieged Bilbao in 1874 without taking it. After the Bourbon restoration of December 1874 brought the army behind Alfonso XII, government forces took La Seu d’Urgell in 1875 and Estella in February 1876, and on 28 February Carlos VII crossed into France. The Basque fueros were abolished that July.: Det sista karlistkriget, utkämpat av anhängarna till tronpretendenten Carlos VII mot kung Amadeo I:s regeringar, Första spanska republiken och slutligen Alfonso XII. Karlisterna var åter starkast i Navarra och de baskiska provinserna, där de upprättade en stat med huvudstad i Estella, samt i Katalonien och Maestrazgo, och de belägrade Bilbao 1874 utan att inta staden. Sedan bourbonska restaurationen i december 1874 hade fått armén att ställa sig bakom Alfonso XII intog regeringsstyrkorna La Seu d’Urgell 1875 och Estella i februari 1876, och den 28 februari gick Carlos VII över gränsen till Frankrike. De baskiska fueros avskaffades i juli samma år.
