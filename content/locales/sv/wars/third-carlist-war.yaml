Estimates of the casualties vary widely, from about 7,000 to 50,000. The siege of Bilbao, from February to May 1874, included a heavy bombardment of the city; it was lifted on 2 May, and in June General Manuel Gutiérrez de la Concha was killed leading an attack on the Carlist lines near Estella.: Uppskattningarna av förlusterna varierar kraftigt, från omkring 7 000 till 50 000. Belägringen av Bilbao, från februari till maj 1874, omfattade ett kraftigt bombardemang av staden; den hävdes den 2 maj, och i juni stupade general Manuel Gutiérrez de la Concha när han ledde ett anfall mot de karlistiska linjerna nära Estella.
