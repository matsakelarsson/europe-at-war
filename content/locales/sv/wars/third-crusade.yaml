28 August 1189 – 12 July 1191: 28 augusti 1189 – 12 juli 1191
The longest siege of the crusades. Both sides used siege towers, Greek fire and mining, and the harbour was fought over by Christian and Egyptian fleets.: Korstågens längsta belägring. Båda sidor använde belägringstorn, grekisk eld och minering, och om hamnen stred kristna och egyptiska flottor.
4 October 1189: 4 oktober 1189
The crusaders broke into Saladin’s camp but scattered to plunder it and were driven back. Several thousand were killed.: Korsfararna bröt sig in i Saladins läger men skingrades för att plundra det och drevs tillbaka. Flera tusen dödades.
Conrad of Montferrat’s base. He joined the siege only reluctantly and kept much of the fleet’s supplies under his control.: Konrad av Montferrats bas. Han anslöt sig bara motvilligt till belägringen och behöll en stor del av flottans förnödenheter under sin kontroll.
Richard I of England and Philip II set out together from Vézelay on 4 July 1190 and wintered in Sicily, where Richard sacked Messina in a quarrel with King Tancred. In April 1191, on the way to Acre, part of Richard’s fleet was wrecked off Cyprus, which had been ruled since 1184 by Isaac Komnenos, a rebel member of the Byzantine imperial family, and Isaac seized the survivors and their goods. Richard landed at Limassol on 6 May, married Berengaria of Navarre there on 12 May and conquered the island in a month. Isaac surrendered at the end of May.: Rikard I av England och Filip II bröt upp tillsammans från Vézelay den 4 juli 1190 och övervintrade på Sicilien, där Rikard plundrade Messina under en tvist med kung Tankred. I april 1191, på väg till Akko, förliste en del av Rikards flotta utanför Cypern, som sedan 1184 styrdes av Isak Komnenos, en upprorisk medlem av den bysantinska kejsarfamiljen, och Isak tog de överlevande och deras gods i beslag. Rikard landsteg vid Limassol den 6 maj, gifte sig där med Berengaria av Navarra den 12 maj och erövrade ön på en månad. Isak kapitulerade i slutet av maj.
Richard reached Acre on 8 June 1191. With the two kings’ siege engines battering the walls and the town starving, the garrison surrendered on 12 July, against Saladin’s wishes, promising a ransom, the release of Christian prisoners and the return of the True Cross. Guy was confirmed as king for life, with Conrad as his heir. Philip, ill and at odds with Richard, sailed home at the end of July. When the ransom was delayed, Richard had about 2,700 Muslim prisoners killed outside the town on 20 August.: Rikard nådde Akko den 8 juni 1191. Med de två kungarnas belägringsmaskiner som bearbetade murarna och staden svältande kapitulerade garnisonen den 12 juli, mot Saladins vilja, och utlovade en lösensumma, frigivning av kristna fångar och återlämnande av Det sanna korset. Guy bekräftades som kung på livstid, med Konrad som arvinge. Filip, sjuk och i konflikt med Rikard, seglade hem i slutet av juli. När lösensumman dröjde lät Rikard döda omkring 2 700 muslimska fångar utanför staden den 20 augusti.
