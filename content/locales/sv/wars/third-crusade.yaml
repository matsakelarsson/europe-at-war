July 1188: juli 1188
Saladin’s northern campaign of 1188 took Latakia and much of the Principality of Antioch, which was left with little beyond the city itself.: Saladins nordliga fälttåg 1188 intog Latakia och stora delar av furstendömet Antiochia, som lämnades med föga mer än själva staden.
Saladin, 1187: Saladin 1187
Frederick Barbarossa, now in his late sixties, left Regensburg on 11 May 1189 with the best-organised of the crusading armies, perhaps 12,000–20,000 men, several thousand of them knights. He crossed Hungary in peace and was welcomed at Niš by Stefan Nemanja of Serbia, who offered to become his vassal. But the Byzantine emperor Isaac II Angelos, who had an understanding with Saladin, imprisoned Frederick’s envoys and harassed his march. Frederick occupied Philippopolis and then Adrianople, where he spent the winter, and threatened to attack Constantinople. In February 1190 Isaac gave way, and in March Byzantine ships carried the army over the Dardanelles.: Fredrik Barbarossa, nu nära sjuttio år gammal, lämnade Regensburg den 11 maj 1189 med den bäst organiserade av korsfararhärarna, kanske 12 000–20 000 man, varav flera tusen riddare. Han passerade Ungern i fred och välkomnades i Niš av Stefan Nemanja av Serbien, som erbjöd sig att bli hans vasall. Men den bysantinske kejsaren Isak II Angelos, som hade en överenskommelse med Saladin, fängslade Fredriks sändebud och ansatte hans marsch. Fredrik ockuperade Philippopolis och sedan Adrianopel, där han tillbringade vintern, och hotade att anfalla Konstantinopel. I februari 1190 gav Isak efter, och i mars förde bysantinska fartyg armén över Dardanellerna.
In Anatolia the army was harried by the Turks of the Sultanate of Rum, whose aged sultan Kilij Arslan II had promised safe passage but no longer controlled his sons. Short of food and water, the Germans beat a Turkish army near Philomelion on 7 May and stormed Iconium, the Seljuk capital, on 18 May 1190. They crossed the Taurus into Armenian Cilicia, but on 10 June Frederick drowned in the river Saleph. His army broke up. Many went home, and his son Frederick of Swabia led the rest by way of Antioch to Acre, where he died in January 1191.: I Anatolien ansattes armén av turkarna från sultanatet Rum, vars åldrade sultan Kilij Arslan II hade utlovat fri lejd men inte längre hade kontroll över sina söner. Med brist på mat och vatten slog tyskarna en turkisk armé nära Philomelion den 7 maj och stormade Ikonion, seldjukernas huvudstad, den 18 maj 1190. De gick över Taurus in i det armeniska Kilikien, men den 10 juni drunknade Fredrik i floden Salef. Hans armé upplöstes. Många återvände hem, och hans son Fredrik av Schwaben ledde resten via Antiochia till Akko, där han dog i januari 1191.
