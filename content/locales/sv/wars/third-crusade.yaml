2–3 July 1187: 2–3 juli 1187
The kingdom’s army gathered at these springs, the usual mustering place, and marched out on the morning of 3 July to relieve Tiberias.: Rikets armé samlades vid dessa källor, den vanliga mönstringsplatsen, och marscherade ut på morgonen den 3 juli för att undsätta Tiberias.
2–5 July 1187: 2–5 juli 1187
Saladin stormed the town to draw the Franks out. Countess Eschiva held the citadel until after Hattin, then surrendered and was allowed to leave.: Saladin stormade staden för att locka ut frankerna. Grevinnan Eschiva höll citadellet till efter Hattin, kapitulerade sedan och fick ge sig av.
4 July 1187: 4 juli 1187
Fought around a double-peaked extinct volcano west of the Sea of Galilee. Raymond of Tripoli and Balian of Ibelin broke out; most of the army was killed or captured and sold into slavery.: Utkämpades kring en dubbeltoppad slocknad vulkan väster om Galileiska sjön. Raimond av Tripoli och Balian av Ibelin bröt sig ut; större delen av armén dödades eller tillfångatogs och såldes som slavar.
