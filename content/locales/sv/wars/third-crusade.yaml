late May 1191: slutet av maj 1191
Isaac Komnenos surrendered here, at the tip of the Karpas peninsula. He was said to have asked not to be put in irons, so Richard had him bound in silver chains.: Isak Komnenos kapitulerade här, på spetsen av Karpashalvön. Han sades ha bett att inte bli satt i järn, så Rikard lät binda honom med silverkedjor.
The kings’ banners were raised over the town. The banner of Leopold V of Austria was thrown down, an insult he avenged by imprisoning Richard in 1192.: Kungarnas fanor hissades över staden. Leopold V av Österrikes fana kastades ned, en förolämpning som han hämnades genom att fängsla Rikard 1192.
Richard I: Rikard I
Conquered by Richard I, May 1191: Erövrat av Rikard I, maj 1191
On 22 August 1191 Richard led the army south from Acre along the coast towards Jaffa, the port nearest Jerusalem, with the fleet keeping pace offshore. Marching in close order, with infantry and crossbowmen shielding the knights and the baggage on the seaward side, the crusaders bore daily attacks by Saladin’s horse archers. On 7 September, on the plain north of Arsuf, Saladin threw his whole army at them. The Hospitallers in the rear charged before Richard gave the signal, and Richard sent in the rest of the knights. Saladin’s army was driven from the field, though not destroyed.: Den 22 augusti 1191 ledde Rikard armén söderut från Akko längs kusten mot Jaffa, den hamn som låg närmast Jerusalem, medan flottan höll jämna steg ute till havs. Korsfararna marscherade i sluten ordning, med fotfolk och armborstskyttar som skyddade riddarna och trossen på sjösidan, och utstod dagliga anfall från Saladins beridna bågskyttar. Den 7 september, på slätten norr om Arsuf, kastade Saladin hela sin armé mot dem. Johanniterna i eftertruppen anföll innan Rikard gett signalen, och Rikard sände in resten av riddarna. Saladins armé drevs från slagfältet, men förintades inte.
Richard occupied Jaffa on 10 September, while Saladin had the walls of Ascalon pulled down so the crusaders could not use them. Twice, in January and in June 1192, the crusaders came within a day’s march of Jerusalem at Beit Nuba, and twice turned back, since even if they took the city they could not hold it once the crusaders went home. In April 1192 the barons chose Conrad as king, but on 28 April he was murdered in Tyre by two Assassins. Henry of Champagne married the widowed Isabella and ruled in his place, and Guy was compensated with Cyprus.: Rikard besatte Jaffa den 10 september, medan Saladin lät riva Askalons murar så att korsfararna inte kunde använda dem. Två gånger, i januari och juni 1192, kom korsfararna inom en dagsmarsch från Jerusalem vid Beit Nuba, och två gånger vände de, eftersom de inte skulle kunna hålla staden när korsfararna väl återvänt hem, även om de intog den. I april 1192 valde baronerna Konrad till kung, men den 28 april mördades han i Tyros av två assassiner. Henrik av Champagne gifte sig med den änkeblivna Isabella och regerade i hans ställe, och Guy kompenserades med Cypern.
Battle of Arsuf: Slaget vid Arsuf
7 September 1191, crusader victory: 7 september 1191, seger för korsfararna
Advances on Jerusalem: Framstötar mot Jerusalem
January and June 1192, turned back at Beit Nuba: januari och juni 1192, vände vid Beit Nuba
Conrad of Montferrat murdered: Konrad av Montferrat mördas
28 April 1192: 28 april 1192
7 September 1191: 7 september 1191
The only great pitched battle between Richard and Saladin. The crusaders’ charge broke the Ayyubid army, which rallied in the woods inland.: Det enda stora fältslaget mellan Rikard och Saladin. Korsfararnas anfall bröt den ayyubidiska armén, som samlades på nytt i skogarna längre in i landet.
10 September 1191: 10 september 1191
The crusaders found the town’s walls destroyed and spent weeks rebuilding them.: Korsfararna fann stadens murar förstörda och ägnade veckor åt att bygga upp dem igen.
Beit Nuba: Beit Nuba
January and June 1192: januari och juni 1192
The furthest point of Richard’s two advances on Jerusalem. From the hills nearby, tradition says, he refused to look at the city he could not take.: Den yttersta punkten för Rikards två framstötar mot Jerusalem. Enligt traditionen vägrade han från kullarna i närheten att se på staden som han inte kunde inta.
September 1191: september 1191
Saladin had the town’s walls demolished rather than let the crusaders use it as a base. Richard rebuilt them in 1192.: Saladin lät riva stadens murar hellre än att låta korsfararna använda den som bas. Rikard byggde upp dem igen 1192.
Conrad of Montferrat was stabbed in the street by two members of the Nizari Isma‘ili sect known as the Assassins, days after his election as king.: Konrad av Montferrat knivhöggs på gatan av två medlemmar av den nizaritiska ismailitiska sekten, kända som assassinerna, några dagar efter att han valts till kung.
While Richard was at Acre preparing to sail home, Saladin attacked Jaffa on 27 July 1192, broke into the town after three days and was about to take the citadel. Richard hurried south by sea with a few galleys, waded ashore and drove the Ayyubid troops out. A few days later, in early August, Saladin attacked Richard’s small camp outside the walls. Richard had about 2,000 men, mostly Italian crossbowmen and spearmen, and only some fifty knights. The spearmen knelt behind their shields with the crossbowmen between them, beat off repeated cavalry charges, and Richard fought in the front line.: Medan Rikard befann sig i Akko och förberedde hemresan anföll Saladin Jaffa den 27 juli 1192, bröt sig in i staden efter tre dagar och stod i begrepp att inta citadellet. Rikard skyndade söderut sjövägen med några galärer, vadade i land och drev ut de ayyubidiska trupperna. Några dagar senare, i början av augusti, anföll Saladin Rikards lilla läger utanför murarna. Rikard hade omkring 2 000 man, mest italienska armborstskyttar och spjutbärare, och bara omkring femtio riddare. Spjutbärarna knäböjde bakom sina sköldar med armborstskyttarna mellan sig och slog tillbaka upprepade kavallerianfall, och Rikard stred i främsta ledet.
Both sides were exhausted, Richard was ill, and news from home urged him back. On 2 September 1192 he and Saladin agreed the Treaty of Jaffa, a truce of three years and eight months. The Franks kept the coast from Tyre to Jaffa; Ascalon was to be demolished and returned to Saladin; and Christian pilgrims could visit Jerusalem freely. Richard sailed on 9 October and was captured on his way home by Leopold of Austria, whom he had insulted at Acre. Saladin died in Damascus on 4 March 1193. The kingdom, now ruled from Acre, lasted another century.: Båda sidor var utmattade, Rikard var sjuk och nyheter hemifrån manade honom att återvända. Den 2 september 1192 ingick han och Saladin fördraget i Jaffa, ett stillestånd på tre år och åtta månader. Frankerna behöll kusten från Tyros till Jaffa; Askalon skulle rivas och återlämnas till Saladin; och kristna pilgrimer fick fritt besöka Jerusalem. Rikard seglade den 9 oktober och tillfångatogs på hemvägen av Leopold av Österrike, som han hade förolämpat i Akko. Saladin dog i Damaskus den 4 mars 1193. Riket, som nu styrdes från Akko, bestod i ytterligare ett sekel.
Battle of Jaffa: Slaget vid Jaffa
early August 1192, crusader victory: början av augusti 1192, seger för korsfararna
Treaty of Jaffa: Fördraget i Jaffa
2 September 1192: 2 september 1192
three years and eight months: tre år och åtta månader
early August 1192: början av augusti 1192
Richard’s small force of spearmen and crossbowmen held off Saladin’s cavalry all day. It was the last battle of the crusade.: Rikards lilla styrka av spjutbärare och armborstskyttar höll Saladins kavalleri stången hela dagen. Det var korstågets sista slag.
Negotiated through envoys, as Richard and Saladin never met. Muslims and Christians were free to travel through each other’s lands.: Förhandlat genom sändebud, eftersom Rikard och Saladin aldrig möttes. Muslimer och kristna fick fritt resa genom varandras länder.
Under the treaty the town, which Richard had refortified, was demolished again and handed back to Saladin.: Enligt fördraget revs staden, som Rikard hade befäst på nytt, än en gång och återlämnades till Saladin.
9 October 1192: 9 oktober 1192
Richard sailed from here for Europe. He was imprisoned by Leopold of Austria and the emperor Henry VI until February 1194.: Rikard seglade härifrån till Europa. Han hölls fången av Leopold av Österrike och kejsar Henrik VI till februari 1194.
Richard, by sea: Rikard, sjövägen
