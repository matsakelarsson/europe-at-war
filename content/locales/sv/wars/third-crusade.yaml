With its army gone, the kingdom had few defenders left. Acre surrendered on 10 July, and within weeks Saladin and his brother al-Adil had taken Nablus, Jaffa, Sidon, Beirut and, in early September, Ascalon. Tyre was about to give up when Conrad of Montferrat arrived by sea on 14 July and took charge of its defence. Jerusalem, crowded with refugees, was held by Balian of Ibelin. When Saladin’s miners breached the northern wall, Balian negotiated a surrender, and on 2 October 1187 the city passed to Saladin, 88 years after the crusaders had taken it.: Med armén borta hade riket få försvarare kvar. Akko kapitulerade den 10 juli, och inom några veckor hade Saladin och hans bror al-Adil intagit Nablus, Jaffa, Sidon, Beirut och i början av september Askalon. Tyros stod i begrepp att ge upp när Konrad av Montferrat anlände sjövägen den 14 juli och tog ledningen över försvaret. Jerusalem, fyllt av flyktingar, hölls av Balian av Ibelin. När Saladins minörer bröt en bresch i den norra muren förhandlade Balian om kapitulation, och den 2 oktober 1187 övergick staden till Saladin, 88 år efter att korsfararna hade intagit den.
Saladin let the inhabitants buy their freedom. Those who could pay left for Tyre, Tripoli or Egypt, but many thousands of the poor, perhaps 15,000, were sold into slavery. There was no massacre, and Eastern Christians could stay. The Dome of the Rock and the al-Aqsa Mosque were returned to Muslim worship. Saladin failed to take Tyre that winter, released Guy in 1188 and took Kerak and many castles in the north. By 1189 the Franks held little more than Tyre, Tripoli, Antioch and a few fortresses.: Saladin lät invånarna köpa sig fria. De som kunde betala gav sig av till Tyros, Tripoli eller Egypten, men många tusen fattiga, kanske 15 000, såldes som slavar. Det blev ingen massaker, och österländska kristna fick stanna. Klippdomen och al-Aqsamoskén återgick till muslimsk gudstjänst. Saladin misslyckades med att inta Tyros den vintern, frigav Guy 1188 och intog Kerak och många borgar i norr. År 1189 höll frankerna knappt mer än Tyros, Tripoli, Antiochia och några få fästningar.
The news reached Europe in the autumn of 1187. Pope Gregory VIII called a new crusade, and Henry II of England and Philip II of France took the cross in January 1188 and raised a tax, the Saladin tithe, to pay for it. The emperor Frederick Barbarossa took the cross at Mainz in March. When Henry died in July 1189 his son Richard I took his place. The kings’ quarrels delayed them, but fleets from Pisa, Sicily and northern Europe were soon sailing east.: Nyheten nådde Europa hösten 1187. Påven Gregorius VIII utlyste ett nytt korståg, och Henrik II av England och Filip II av Frankrike tog korset i januari 1188 och tog ut en skatt, saladinstiondet, för att bekosta det. Kejsar Fredrik Barbarossa tog korset i Mainz i mars. När Henrik dog i juli 1189 tog hans son Rikard I hans plats. Kungarnas gräl försenade dem, men flottor från Pisa, Sicilien och norra Europa seglade snart österut.
