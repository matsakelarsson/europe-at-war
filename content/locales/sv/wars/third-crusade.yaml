By the 1180s Saladin, sultan of Egypt and of Damascus and Aleppo, surrounded the Kingdom of Jerusalem, which was bitterly divided. In 1186 Queen Sibyl, sister of the leper king Baldwin IV, had her husband Guy of Lusignan crowned, against the wishes of the barons led by Raymond III of Tripoli, who made a separate truce with Saladin. When Raynald of Châtillon, lord of Kerak, broke the general truce by seizing a caravan, Saladin prepared for holy war. On 1 May 1187 his scouts destroyed a small force of Templars and Hospitallers at the Springs of Cresson near Nazareth.: På 1180-talet omringade Saladin, sultan av Egypten och av Damaskus och Aleppo, kungariket Jerusalem, som var djupt splittrat. År 1186 lät drottning Sibylla, syster till den spetälske kungen Balduin IV, kröna sin make Guy av Lusignan, mot viljan hos baronerna under ledning av Raimond III av Tripoli, som slöt ett separat stillestånd med Saladin. När Reynald av Châtillon, herre till Kerak, bröt det allmänna stilleståndet genom att plundra en karavan förberedde Saladin ett heligt krig. Den 1 maj 1187 förintade hans spejare en liten styrka tempelherrar och johanniter vid Cressonkällorna nära Nasaret.
At the end of June Saladin crossed the Jordan with perhaps 30,000 men, and on 2 July he took the town of Tiberias, where Raymond’s wife still held the citadel. Against Raymond’s advice, Guy led the kingdom’s whole army, some 20,000 men with about 1,200 knights, from the springs of Sephoria across a dry plateau. Harassed by archers and tormented by thirst and the smoke of grass fires, it was surrounded near the Horns of Hattin and destroyed on 4 July. Guy was captured with the relic of the True Cross. Saladin killed Raynald with his own hand and had some 200 Templars and Hospitallers executed.: I slutet av juni gick Saladin över Jordan med kanske 30 000 man, och den 2 juli intog han staden Tiberias, där Raimonds hustru fortfarande höll citadellet. Mot Raimonds råd ledde Guy rikets hela armé, omkring 20 000 man med omkring 1 200 riddare, från källorna vid Sephoria över en torr högslätt. Ansatt av bågskyttar och plågad av törst och röken från gräsbränder omringades armén nära Hattins horn och förintades den 4 juli. Guy tillfångatogs tillsammans med reliken av Det sanna korset. Saladin dödade Reynald med egen hand och lät avrätta omkring 200 tempelherrar och johanniter.
