Third Crusade: Tredje korståget
The war that followed Saladin’s destruction of the army of the Kingdom of Jerusalem at Hattin in 1187 and his capture of Jerusalem. Frederick Barbarossa’s German army crossed Anatolia but broke up after he drowned in Cilicia; Philip II of France and Richard I of England, who conquered Cyprus on the way, retook Acre in 1191, and Richard beat Saladin at Arsuf and Jaffa but did not try to take Jerusalem. The Treaty of Jaffa of 1192 left the crusaders a coastal kingdom from Tyre to Jaffa, with access to Jerusalem for Christian pilgrims.: Kriget som följde efter att Saladin förintat kungariket Jerusalems armé vid Hattin 1187 och erövrat Jerusalem. Fredrik Barbarossas tyska armé tog sig över Anatolien men upplöstes sedan han drunknat i Kilikien; Filip II av Frankrike och Rikard I av England, som erövrade Cypern på vägen, återtog Akko 1191, och Rikard besegrade Saladin vid Arsuf och Jaffa men försökte inte inta Jerusalem. Fördraget i Jaffa 1192 lämnade åt korsfararna ett kustrike från Tyros till Jaffa, med tillträde till Jerusalem för kristna pilgrimer.
