Frederick drowned near Seleucia, either while crossing the river on horseback or while bathing. His flesh was buried at Antioch and his bones, it is said, at Tyre.: Fredrik drunknade nära Seleukia, antingen när han red över floden eller när han badade. Hans kött begravdes i Antiochia och hans ben, sägs det, i Tyros.
