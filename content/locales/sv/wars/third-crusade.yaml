Released by Saladin on a promise not to fight him again, Guy of Lusignan was refused entry to Tyre by Conrad, who now claimed the kingdom himself. In August 1189 Guy marched south with a few thousand men and on 28 August began a siege of Acre, camping on a hill outside the walls. Saladin came up and surrounded the besiegers, who were thus besieged in their turn. The crusaders dug ditches facing both ways, and as ships brought more men from the West, the siege grew into a long war of attrition.: Guy av Lusignan, som frigivits av Saladin mot ett löfte att inte bekämpa honom igen, nekades inträde i Tyros av Konrad, som nu själv gjorde anspråk på riket. I augusti 1189 marscherade Guy söderut med några tusen man och inledde den 28 augusti en belägring av Akko, med läger på en kulle utanför murarna. Saladin kom dit och omringade belägrarna, som därmed själva blev belägrade. Korsfararna grävde diken åt båda hållen, och allteftersom fartyg förde fler män från Västerlandet växte belägringen till ett långt utnötningskrig.
On 4 October 1189 the Franks attacked Saladin’s camp and were thrown back with heavy losses; the Templar master Gerard of Ridefort was killed. Fleets from Pisa, Denmark, Frisia, England and France kept the camp supplied, while Egyptian ships fought their way into the harbour. Henry of Champagne arrived in July 1190 with French troops. Disease and hunger killed thousands in the camp, among them, in 1190, Queen Sibyl and her daughters; Conrad then married her half-sister Isabella and claimed the throne. Philip II of France landed on 20 April 1191.: Den 4 oktober 1189 anföll frankerna Saladins läger och kastades tillbaka med svåra förluster; tempelherrarnas stormästare Gerard av Ridefort stupade. Flottor från Pisa, Danmark, Frisland, England och Frankrike höll lägret försörjt, medan egyptiska fartyg kämpade sig in i hamnen. Henrik av Champagne anlände i juli 1190 med franska trupper. Sjukdomar och svält dödade tusentals i lägret, bland dem 1190 drottning Sibylla och hennes döttrar; Konrad gifte sig då med hennes halvsyster Isabella och gjorde anspråk på tronen. Filip II av Frankrike landsteg den 20 april 1191.
