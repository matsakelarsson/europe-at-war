Frederick wintered here and wrote to his son Henry to prepare a fleet against Constantinople. The Treaty of Adrianople of February 1190 secured his passage.: Fredrik övervintrade här och skrev till sin son Henrik att förbereda en flotta mot Konstantinopel. Fördraget i Adrianopel i februari 1190 tryggade hans genomfart.
7 May 1190: 7 maj 1190
The Germans beat a Turkish army that blocked their road, after weeks of harassment in the mountains.: Tyskarna slog en turkisk armé som spärrade deras väg, efter veckor av trakasserier i bergen.
