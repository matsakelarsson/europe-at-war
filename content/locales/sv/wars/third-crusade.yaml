About 140 knights led by the Templar master Gerard of Ridefort charged a much larger Muslim force. Almost all were killed; Gerard escaped.: Omkring 140 riddare under tempelherrarnas stormästare Gerard av Ridefort anföll en mycket större muslimsk styrka. Nästan alla dödades; Gerard kom undan.
