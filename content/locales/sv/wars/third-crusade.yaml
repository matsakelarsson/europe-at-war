While Frederick beat the sultan’s army outside, his son stormed the lower city. The Germans rested and took supplies, then marched on.: Medan Fredrik slog sultanens armé utanför staden stormade hans son den nedre staden. Tyskarna vilade och tog förnödenheter och marscherade sedan vidare.
