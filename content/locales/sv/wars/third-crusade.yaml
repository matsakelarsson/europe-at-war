The city surrendered on terms after a siege of twelve days. Saladin entered on the anniversary of the Prophet’s Night Journey from Jerusalem, as his contemporaries noted.: Staden kapitulerade på villkor efter en tolv dagar lång belägring. Saladin tågade in på årsdagen av Profetens nattresa från Jerusalem, vilket hans samtida noterade.
