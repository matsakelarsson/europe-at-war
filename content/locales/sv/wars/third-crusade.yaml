Dates are Julian. The main sources are the crusader chronicles of Ambroise and the Itinerarium Peregrinorum, the German accounts of Frederick’s expedition, and Saladin’s secretaries Baha al-Din ibn Shaddad and Imad al-Din al-Isfahani, with the later historian Ibn al-Athir. Numbers of soldiers come from these sources and are uncertain.: Datumen är julianska. De viktigaste källorna är korsfararkrönikorna av Ambroise och Itinerarium Peregrinorum, de tyska berättelserna om Fredriks expedition och Saladins sekreterare Baha al-Din ibn Shaddad och Imad al-Din al-Isfahani, tillsammans med den senare historikern Ibn al-Athir. Truppsiffrorna kommer från dessa källor och är osäkra.
Places have the names usual in histories of the crusades, with modern names where they help, such as Acre (Akko), Ascalon (Ashkelon), Iconium (Konya), the Saleph (Göksu), Philippopolis (Plovdiv) and Adrianople (Edirne).: Orterna har de namn som är brukliga i korstågshistorier, med moderna namn där det är till hjälp, till exempel Akko, Askalon (Ashkelon), Ikonion (Konya), Salef (Göksu), Philippopolis (Plovdiv) och Adrianopel (Edirne).
Saladin (Salah al-Din Yusuf ibn Ayyub) was a Kurd who had made himself master of Egypt in 1169–1171 and of Muslim Syria after 1174. His dynasty is known as the Ayyubids.: Saladin (Salah al-Din Yusuf ibn Ayyub) var en kurd som hade gjort sig till herre över Egypten 1169–1171 och över det muslimska Syrien efter 1174. Hans dynasti kallas ayyubiderna.
