# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
Third Javanese War of Succession: Tredje javanska tronföljdskriget
? "The war that split the kingdom of Mataram in two, and later three. Prince Mangkubumi, a younger brother of King Pakubuwono II, left the court at Surakarta in 1746 after the Dutch East India Company (VOC) had humiliated him and the king had taken back a fief promised to him, and joined his nephew Raden Mas Said, who had been in revolt since the Chinese War. In December 1749 the dying Pakubuwono II signed over the “sovereignty” of Mataram to the Company, which installed his son as Pakubuwono III, while Mangkubumi’s followers proclaimed him king. Mangkubumi and Raden Mas Said fought the Company and Pakubuwono III across Central Java and destroyed a Company army at the Bogowonto River in 1751, but neither side could win. Mangkubumi fell out with Raden Mas Said and made peace with the Company, and by the Treaty of Giyanti of 13 February 1755 Mataram was divided: Pakubuwono III kept Surakarta and the east, and Mangkubumi became Sultan Hamengkubuwono I of Yogyakarta in the west. Raden Mas Said fought on until the Treaty of Salatiga of 17 March 1757 gave him a principality of his own, Mangkunegaran, as Mangkunegara I. The partition, with the Company as overlord of all three courts, lasted until Indonesian independence."
: "Kriget som delade kungariket Mataram i två delar och senare i tre. Prins Mangkubumi, en yngre bror till kung Pakubuwono II, lämnade hovet i Surakarta 1746 sedan Nederländska ostindiska kompaniet (VOC) hade förödmjukat honom och kungen hade tagit tillbaka ett län som utlovats åt honom, och anslöt sig till sin brorson Raden Mas Said, som hade gjort uppror ända sedan kinesiska kriget. I december 1749 överlät den döende Pakubuwono II Matarams ”suveränitet” till kompaniet, som insatte hans son som Pakubuwono III, medan Mangkubumis anhängare utropade Mangkubumi till kung. Mangkubumi och Raden Mas Said stred mot kompaniet och Pakubuwono III över hela mellersta Java och förintade en av kompaniets arméer vid floden Bogowonto 1751, men ingen av sidorna kunde vinna. Mangkubumi blev osams med Raden Mas Said och slöt fred med kompaniet, och genom fördraget i Giyanti den 13 februari 1755 delades Mataram: Pakubuwono III behöll Surakarta och den östra delen, och Mangkubumi blev sultan Hamengkubuwono I av Yogyakarta i den västra. Raden Mas Said fortsatte kampen tills fördraget i Salatiga den 17 mars 1757 gav honom ett eget furstendöme, Mangkunegaran, som Mangkunegara I. Delningen, med kompaniet som överherre över alla tre hoven, bestod fram till Indonesiens självständighet."
