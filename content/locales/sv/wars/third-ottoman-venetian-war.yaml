Third Ottoman–Venetian War: Tredje osmansk-venetianska kriget
A war that began when Suleiman the Magnificent, gathering forces in Albania to invade Italy in concert with France, turned instead on Venetian Corfu. The siege of 1537 failed, but Hayreddin Barbarossa took Venice’s Aegean islands, beat the Holy League fleet of Venice, the pope and Charles V at Preveza in 1538 and retook Castelnuovo in 1539. In the peace of 1540 Venice gave up its last towns in the Morea and paid 300,000 ducats.: Ett krig som inleddes när Süleyman den store, som samlade styrkor i Albanien för att invadera Italien tillsammans med Frankrike, i stället vände sig mot det venetianska Korfu. Belägringen 1537 misslyckades, men Hayreddin Barbarossa intog Venedigs öar i Egeiska havet, besegrade Heliga ligans flotta från Venedig, påven och Karl V vid Preveza 1538 och återtog Castelnuovo 1539. Vid freden 1540 avstod Venedig sina sista städer på Morea och betalade 300 000 dukater.
