In 1537 Suleiman brought a great army to Valona in Albania, meaning to cross to Italy with Hayreddin Barbarossa’s fleet while his ally Francis I of France attacked Charles V in the north. At the end of July Ottoman troops landed near Otranto and ravaged the country, carrying thousands of people into slavery, but the French attack was slow to come and they were withdrawn. A series of clashes at sea with Venetian galleys gave the sultan a reason to turn on Venice, which had tried to stay neutral.: År 1537 förde Süleyman en stor armé till Valona i Albanien, med avsikten att gå över till Italien med Hayreddin Barbarossas flotta medan hans bundsförvant Frans I av Frankrike anföll Karl V i norr. I slutet av juli landsteg osmanska trupper nära Otranto och härjade landet och förde tusentals människor bort i slaveri, men det franska anfallet dröjde och trupperna drogs tillbaka. En rad sammandrabbningar till sjöss med venetianska galärer gav sultanen en anledning att vända sig mot Venedig, som hade försökt hålla sig neutralt.
In late August some 25,000 Ottoman troops landed on Corfu, Venice’s key to the Adriatic. They burned the countryside and carried off many islanders, but the guns of the citadel, rebuilt to withstand artillery, held them off. With rain, disease in the camp and the season ending, Suleiman lifted the siege in mid-September. Barbarossa then swept through the Aegean, sacking Aegina and taking or forcing tribute from the Venetian islands and the Duchy of Naxos.: I slutet av augusti landsteg omkring 25 000 osmanska soldater på Korfu, Venedigs nyckel till Adriatiska havet. De brände landsbygden och förde bort många öbor, men kanonerna i citadellet, som byggts om för att stå emot artilleri, höll dem stången. Med regn, sjukdomar i lägret och säsongen mot sitt slut hävde Süleyman belägringen i mitten av september. Barbarossa drog sedan fram genom Egeiska havet, plundrade Egina och intog de venetianska öarna och hertigdömet Naxos eller tvingade dem att betala tribut.
