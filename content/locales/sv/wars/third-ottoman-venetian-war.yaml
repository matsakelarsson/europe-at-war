In February 1538 Pope Paul III, Venice and Charles V formed a Holy League. In September its fleet, under the Genoese admiral Andrea Doria with the Venetians under Vincenzo Capello and the papal galleys under Marco Grimani, found Barbarossa’s smaller fleet sheltering in the Gulf of Arta, near the old battlefield of Actium. Doria would not force the narrow entrance under the guns of Preveza. On 28 September, as the League ships moved off down the coast, Barbarossa came out and attacked. The League lost a number of ships, and Doria withdrew to Corfu with the rest.: I februari 1538 bildade påven Paulus III, Venedig och Karl V en helig liga. I september fann dess flotta, under den genuesiske amiralen Andrea Doria, med venetianarna under Vincenzo Capello och de påvliga galärerna under Marco Grimani, Barbarossas mindre flotta i skydd i Artaviken, nära det gamla slagfältet vid Actium. Doria ville inte forcera det smala inloppet under kanonerna i Preveza. Den 28 september, när ligans fartyg drog sig bort längs kusten, gick Barbarossa ut och anföll. Ligan förlorade ett antal fartyg, och Doria drog sig tillbaka till Korfu med resten.
In October Spanish troops took Castelnuovo at the mouth of the Bay of Kotor, but in the summer of 1539 Barbarossa besieged it by land and sea and killed almost all of its garrison. Venice made a separate peace on 2 October 1540. It gave up Nauplia and Monemvasia, its last towns in the Morea, recognised the loss of the Aegean islands and paid 300,000 ducats. The Ottoman fleet was now the strongest in the eastern Mediterranean.: I oktober intog spanska trupper Castelnuovo vid inloppet till Kotorbukten, men sommaren 1539 belägrade Barbarossa staden från land och sjö och dödade nästan hela garnisonen. Venedig slöt separatfred den 2 oktober 1540. Republiken avstod Nauplia och Monemvasia, sina sista städer på Morea, erkände förlusten av öarna i Egeiska havet och betalade 300 000 dukater. Den osmanska flottan var nu den starkaste i östra Medelhavet.
