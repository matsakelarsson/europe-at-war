Dates are Julian. The size of the fleets at Preveza differs widely between sources; most give the Holy League well over 100 galleys and many sailing ships, and Barbarossa about 120 galleys and galliots.: Datumen är julianska. Flottornas storlek vid Preveza skiljer sig kraftigt mellan källorna; de flesta ger Heliga ligan långt över 100 galärer och många segelfartyg, och Barbarossa omkring 120 galärer och galioter.
Venetian and imperial writers blamed each other for the defeat at Preveza. Venetians accused Andrea Doria, the Genoese admiral of Charles V, of holding back his ships on purpose, while imperial writers said the Venetians would not follow his orders.: Venetianska och kejserliga författare skyllde nederlaget vid Preveza på varandra. Venetianarna anklagade Andrea Doria, Karl V:s genuesiske amiral, för att avsiktligt ha hållit tillbaka sina fartyg, medan kejserliga författare hävdade att venetianarna inte ville lyda hans order.
Imperial and papal moves: Kejserliga och påvliga trupprörelser
