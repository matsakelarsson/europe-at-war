# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
Third Seminole War: Tredje seminolkriget
? The last war between the United States and the Seminoles of Florida, also called the Billy Bowlegs War. After the Second Seminole War some few hundred Seminoles and Miccosukees remained in southern Florida under Holata Micco (Billy Bowlegs) and Abiaka (Sam Jones). As settlement pushed south, Florida and the federal government pressed them to leave, built a chain of forts and sent surveyors into their lands. On 20 December 1855 Bowlegs and some 30 to 40 warriors attacked an army surveying patrol under Lieutenant George Hartsuff near the Big Cypress Swamp, whose men, Seminole accounts say, had destroyed his gardens; four soldiers were killed. In the war that followed, Seminole bands raided farms and posts as far north as Tampa Bay, while regulars and Florida volunteers, using boats to reach the islands of the Everglades and the Big Cypress, burned villages and crops; one of the largest actions was at the Tillis farm near Fort Meade in June 1856. Worn down by hunger and offered cash payments, Bowlegs agreed to emigrate, and in May 1858 he left for Indian Territory with about 165 people; the army declared the war over on 8 May 1858. Abiaka and between about 100 and 300 others never left, and their descendants are the Seminole Tribe of Florida and the Miccosukee Tribe of Indians of Florida, who never signed a peace treaty with the United States.
: Det sista kriget mellan USA och seminolerna i Florida, även kallat Billy Bowlegs-kriget. Efter andra seminolkriget fanns några få hundra seminoler och miccosukeer kvar i södra Florida under Holata Micco (Billy Bowlegs) och Abiaka (Sam Jones). När bosättningen trängde söderut pressade Florida och den federala regeringen dem att ge sig av, byggde en kedja av fort och sände lantmätare in i deras land. Den 20 december 1855 anföll Bowlegs och omkring 30 till 40 krigare en av arméns lantmäteripatruller under löjtnant George Hartsuff nära Big Cypress Swamp, vars män enligt seminolernas berättelser hade förstört hans odlingar; fyra soldater dödades. I det krig som följde plundrade seminolgrupper gårdar och poster så långt norrut som Tampa Bay, medan reguljära trupper och frivilliga från Florida, som använde båtar för att nå öarna i Everglades och Big Cypress, brände byar och grödor; en av de största striderna stod vid Tillis gård nära Fort Meade i juni 1856. Utmattad av svält och erbjuden kontant ersättning gick Bowlegs med på att emigrera, och i maj 1858 reste han till Indianterritoriet med omkring 165 människor; armén förklarade kriget avslutat den 8 maj 1858. Abiaka och mellan omkring 100 och 300 andra gav sig aldrig av, och deras ättlingar är Seminole Tribe of Florida och Miccosukee Tribe of Indians of Florida, som aldrig har undertecknat något fredsfördrag med USA.
