Third Taiwan Strait Crisis: Tredje Taiwansundskrisen
? A series of Chinese missile tests and military exercises around Taiwan in 1995–1996, meant to warn Taiwan’s president Lee Teng-hui against moves towards independence and to sway Taiwan’s first direct presidential election. After the United States allowed Lee to visit Cornell University, where he had studied, in June 1995, the PLA fired missiles into target zones in the sea north of Taiwan from 21 July and held naval and amphibious exercises in August and November. In March 1996, in the weeks before the election, it fired missiles into zones close to the ports of Keelung and Kaohsiung, disrupting shipping, and held live-fire exercises and landing drills in the strait, the largest at Pingtan from 18 to 25 March. The United States sent two aircraft carrier groups, led by the USS Independence and the USS Nimitz, to the waters near Taiwan, its largest show of force in Asia since the Vietnam War. No one was killed. Lee won the election on 23 March 1996 with 54 per cent of the vote. The crisis led China to build up forces able to keep American carriers away from the strait, and the United States to deepen its military ties with Taiwan.
: En serie kinesiska robotprov och militärövningar kring Taiwan 1995–1996, avsedda att varna Taiwans president Lee Teng-hui för steg mot självständighet och att påverka Taiwans första direkta presidentval. Sedan USA i juni 1995 hade låtit Lee besöka Cornell University, där han hade studerat, avfyrade Folkets befrielsearmé från den 21 juli robotar mot målområden i havet norr om Taiwan och höll marin- och amfibieövningar i augusti och november. I mars 1996, under veckorna före valet, avfyrade den robotar mot områden nära hamnarna i Keelung och Kaohsiung, vilket störde sjöfarten, och höll övningar med skarp ammunition och landstigningsövningar i sundet, de största vid Pingtan från den 18 till den 25 mars. USA sände två hangarfartygsgrupper, ledda av USS Independence och USS Nimitz, till farvattnen nära Taiwan, den största amerikanska maktdemonstrationen i Asien sedan Vietnamkriget. Ingen dödades. Lee vann valet den 23 mars 1996 med 54 procent av rösterna. Krisen fick Kina att bygga upp styrkor som kunde hålla amerikanska hangarfartyg borta från sundet, och USA att fördjupa sina militära band med Taiwan.
