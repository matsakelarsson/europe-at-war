Mercenaries: Legosoldater
Unable to pay its mercenaries, the Order pledged them its castles, and in 1455 they took over Malbork. Their Bohemian captain, Ulrich Czerwonka, sold it to the Poles, and on 6 June 1457 Malbork, Tczew and Iława were handed over for 190,000 Hungarian gold pieces, much of it lent by Gdańsk. The Grand Master moved to Königsberg, which became the Order’s capital. Teutonic troops retook the town of Malbork that September with the help of its burghers, but the castle stayed Polish, and the town fell again in 1460.: Eftersom orden inte kunde betala sina legosoldater pantsatte den sina borgar till dem, och 1455 tog de över Malbork. Deras böhmiske kapten, Ulrich Czerwonka, sålde borgen till polackerna, och den 6 juni 1457 överlämnades Malbork, Tczew och Iława mot 190 000 ungerska guldmynt, till stor del lånade av Gdańsk. Högmästaren flyttade till Königsberg, som blev ordens huvudstad. Ordenstrupper återtog staden Malbork i september samma år med hjälp av dess borgare, men borgen förblev polsk, och staden föll på nytt 1460.
The war turned once Poland stopped relying on noble levies and paid for a small professional army under Piotr Dunin. On 17 September 1462 Dunin beat the Order’s army at Świecino, west of Gdańsk, where its able commander Fritz Raweneck was killed. On 15 September 1463 ships from Gdańsk and Elbląg destroyed the Order’s fleet on the Vistula Lagoon, and Gniew surrendered on 1 January 1464 after a long siege. From then on the Order, short of money, was mostly on the defensive.: Kriget vände när Polen slutade förlita sig på adelsuppbåd och bekostade en liten yrkesarmé under Piotr Dunin. Den 17 september 1462 slog Dunin ordens armé vid Świecino väster om Gdańsk, där dess skicklige befälhavare Fritz Raweneck stupade. Den 15 september 1463 förintade fartyg från Gdańsk och Elbląg ordens flotta på Wislalagunen, och Gniew kapitulerade den 1 januari 1464 efter en lång belägring. Från och med då var orden, som led brist på pengar, mest på defensiven.
