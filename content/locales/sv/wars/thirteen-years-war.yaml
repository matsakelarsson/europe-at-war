After Grunwald the Order taxed Prussia heavily and kept a tight grip on its trade, and the towns and gentry wanted the rights their neighbours enjoyed in Poland. In 1440 they formed the Prussian Confederation, led by Gdańsk, Toruń and Elbląg and the knights of the Chełmno Land. When the Emperor banned it in 1453, it turned to Poland. On 4 February 1454 it renounced its allegiance to the Grand Master, and within weeks its forces held almost all of Prussia except Malbork, Sztum and Chojnice. On 6 March King Casimir IV took Prussia into his kingdom.: Efter Grunwald beskattade orden Preussen hårt och höll ett fast grepp om handeln, och städerna och lågadeln ville ha de rättigheter som deras grannar åtnjöt i Polen. År 1440 bildade de Preussiska förbundet, lett av Gdańsk, Toruń och Elbląg och riddarna i Chełmnoland. När kejsaren förbjöd förbundet 1453 vände det sig till Polen. Den 4 februari 1454 sade det upp sin trohet mot högmästaren, och inom några veckor höll dess styrkor nästan hela Preussen utom Malbork, Sztum och Chojnice. Den 6 mars införlivade kung Kasimir IV Preussen med sitt rike.
The Order hired mercenaries in Germany and Bohemia, and in September a relief army of about 15,000 under Duke Rudolf of Żagań and Bernard von Zinnenberg marched on Chojnice, which a Polish levy was besieging. On 18 September 1454 the Polish cavalry broke the first Teutonic line, killing Rudolf, but the mercenaries’ wagon fort held and a sally from the town struck the Poles from behind. Casimir had to be led from the field, and some 300 knights were captured. The Poles abandoned the siege of Malbork, and what both sides had expected to be a short war became a long, costly struggle for castles and towns.: Orden värvade legosoldater i Tyskland och Böhmen, och i september marscherade en undsättningsarmé på omkring 15 000 man under hertig Rudolf av Żagań och Bernard von Zinnenberg mot Chojnice, som ett polskt uppbåd belägrade. Den 18 september 1454 bröt det polska kavalleriet igenom den första ordenslinjen och dödade Rudolf, men legosoldaternas vagnborg höll och ett utfall från staden träffade polackerna i ryggen. Kasimir måste ledas bort från slagfältet, och omkring 300 riddare tillfångatogs. Polackerna övergav belägringen av Malbork, och det som båda sidor hade väntat sig skulle bli ett kort krig blev en lång och kostsam kamp om borgar och städer.
