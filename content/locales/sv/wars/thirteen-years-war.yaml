Dunin: Dunin
Talks in 1464 and 1465 failed, but the Order’s position kept slipping. In 1466 the Prince-Bishop of Warmia changed sides, and on 28 September Dunin took Chojnice, the Order’s last major stronghold in the west. With the papal legate Rudolf of Rüdesheim as mediator, peace was signed at Toruń on 19 October 1466. Thirteen years of war, raids and unpaid soldiers had left much of Prussia devastated.: Förhandlingar 1464 och 1465 misslyckades, men ordens ställning fortsatte att försvagas. År 1466 bytte furstbiskopen av Warmia sida, och den 28 september intog Dunin Chojnice, ordens sista stora fäste i väster. Med den påvlige legaten Rudolf av Rüdesheim som medlare undertecknades fred i Toruń den 19 oktober 1466. Tretton år av krig, räder och obetalda soldater hade lämnat stora delar av Preussen ödelagda.
"The Order gave up Gdańsk Pomerania, the Chełmno Land, the lands around Malbork and Elbląg, and the Prince-Bishopric of Warmia. These became Royal Prussia, a province of the Polish crown with its own diet and privileges. The Order kept eastern Prussia, ruled from Königsberg, but as a Polish fief: each Grand Master had to swear allegiance to the king within six months of taking office.": "Orden avstod Gdańskpommern, Chełmnoland, områdena kring Malbork och Elbląg samt furstbiskopsdömet Warmia. Dessa blev Kungliga Preussen, en provins under den polska kronan med egen lantdag och egna privilegier. Orden behöll östra Preussen, som styrdes från Königsberg, men som ett polskt län: varje högmästare måste svära kungen trohet inom sex månader efter att ha tillträtt."
