The Second Peace of Thorn: Andra freden i Thorn
Dates are Julian (Old Style), as the sources give them.: Datumen anges enligt den julianska kalendern (gamla stilen), så som källorna anger dem.
Also called the War of the Cities. Inside Prussia it was largely a civil war, and Lithuania, though ruled by Casimir IV, took almost no part.: Kallas också Städernas krig. Inom Preussen var det till stor del ett inbördeskrig, och Litauen, fast det styrdes av Kasimir IV, deltog nästan inte alls.
Places are given their modern names, with the German names of the time where useful, such as Malbork (Marienburg) and Chojnice (Konitz).: Orterna anges med sina nuvarande namn, med samtida tyska namn där det är till hjälp, till exempel Malbork (Marienburg) och Chojnice (Konitz).
