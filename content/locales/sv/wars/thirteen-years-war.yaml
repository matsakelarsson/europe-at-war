Thirteen Years’ War: Trettonåriga kriget
A war between the Teutonic Order and the Prussian Confederation of towns and gentry, allied with Poland under Casimir IV. Fought largely by mercenaries on both sides, it ended with the Second Peace of Thorn in 1466, which gave western Prussia to Poland as Royal Prussia and made the rest of the Order’s state a Polish fief.: Ett krig mellan Tyska orden och Preussiska förbundet av städer och lågadel, allierat med Polen under Kasimir IV. Kriget utkämpades till stor del av legosoldater på båda sidor och slutade med andra freden i Thorn 1466, som gav västra Preussen åt Polen som Kungliga Preussen och gjorde resten av ordensstaten till ett polskt län.
