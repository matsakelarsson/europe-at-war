# Svenska översättningar av katalogtexten (våg 10); stegtexterna kommer senare.
Thirty-Eight Years’ War: Trettioåttaårskriget
? "The long series of campaigns in which the Japanese imperial court brought the Emishi of northern Honshu under its rule. It began in 774, when Emishi of the Pacific coast attacked the frontier fort of Monofu, and grew in 780 when Iji no Azamaro, an Emishi chief in the court’s service, killed the provincial inspector and burned Taga, the headquarters of Mutsu. Emperor Kanmu sent ever larger armies north: in 789 the Emishi of Isawa under Aterui routed the army of Ki no Kosami at Sufuse on the Kitakami River, but in 801 Sakanoue no Tamuramaro, the second man to bear the title sei-i taishōgun, conquered the Isawa region. He built Isawa Castle in 802, Aterui and More surrendered and were executed, and Shiwa Castle followed in 803. After a last campaign by Fun’ya no Watamaro in 811 against the villages of Nisatai and Hei, the court declared the fighting over. The name, given by the historian Torao Toshiya in 1975, comes from Watamaro’s report that there had been “thirty-eight years in all” of border warfare since 774."
: "Den långa serie fälttåg genom vilka det japanska kejsarhovet lade under sig emishi i norra Honshu. Den började 774, när emishi vid Stillahavskusten angrep gränsfästet Monofu, och växte 780 när Iji no Azamaro, en emishihövding i hovets tjänst, dödade provinsinspektören och brände Taga, förvaltningssätet i Mutsu. Kejsar Kanmu sände allt större arméer norrut: 789 slog emishi i Isawa under Aterui Ki no Kosamis armé på flykten vid Sufuse vid Kitakamifloden, men 801 erövrade Sakanoue no Tamuramaro, den andre som bar titeln sei-i taishōgun, Isawaområdet. Han byggde Isawaborgen 802, Aterui och More kapitulerade och avrättades, och Shiwaborgen följde 803. Efter ett sista fälttåg under Fun’ya no Watamaro 811 mot byarna Nisatai och Hei förklarade hovet striderna avslutade. Namnet, som gavs av historikern Torao Toshiya 1975, kommer från Watamaros rapport om att gränskriget sedan 774 hade pågått ”sammanlagt trettioåtta år”."
