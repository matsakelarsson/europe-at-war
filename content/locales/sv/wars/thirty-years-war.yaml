Bohemian and Palatine success: Böhmiska och pfalziska framgångar
The mostly Protestant estates of Bohemia had won religious freedom from Rudolf II in his Letter of Majesty of 1609, but the choice of the strictly Catholic Ferdinand of Styria as their next king, and quarrels over Protestant churches on church land, convinced them that their rights were in danger. On 23 May 1618 Protestant nobles led by Count Heinrich Matthias Thurn threw two of the king’s regents and their secretary from a window of Prague Castle. All three survived. The estates set up a government of thirty directors and raised an army.: De till största delen protestantiska ständerna i Böhmen hade fått religionsfrihet av Rudolf II genom hans majestätsbrev 1609, men valet av den strängt katolske Ferdinand av Steiermark till deras nästa kung och tvister om protestantiska kyrkor på kyrklig mark övertygade dem om att deras rättigheter var i fara. Den 23 maj 1618 kastade protestantiska adelsmän under ledning av greve Heinrich Matthias Thurn två av kungens ståthållare och deras sekreterare ut genom ett fönster på Pragborgen. Alla tre överlevde. Ständerna tillsatte en regering med trettio direktorer och satte upp en armé.
In November the mercenary general Ernst von Mansfeld took the Catholic stronghold of Plzeň for the rebels. After Emperor Matthias died in March 1619, Thurn marched through Moravia, which now joined the revolt, to the edge of Vienna, but turned back when the imperial general Bucquoy beat Mansfeld at Sablat on 10 June. On 31 July Bohemia, Moravia, Silesia and the two Lusatias formed a confederation, and in August the estates deposed Ferdinand and elected the Calvinist Elector Palatine, Frederick V. He was crowned in Prague on 4 November, two months after Ferdinand had been elected Emperor.: I november intog legoknektsgeneralen Ernst von Mansfeld det katolska fästet Plzeň för rebellernas räkning. Sedan kejsar Matthias dött i mars 1619 marscherade Thurn genom Mähren, som nu anslöt sig till upproret, ända fram till Wiens utkanter, men vände tillbaka när den kejserlige generalen Bucquoy slog Mansfeld vid Sablat den 10 juni. Den 31 juli bildade Böhmen, Mähren, Schlesien och de båda Lausitz en konfederation, och i augusti avsatte ständerna Ferdinand och valde den kalvinistiske kurfursten av Pfalz, Fredrik V. Han kröntes i Prag den 4 november, två månader efter att Ferdinand hade valts till kejsare.
