Frederick fled to the Silesian capital, today’s Wrocław, and from there by way of Brandenburg into exile in the Dutch Republic.: Fredrik flydde till den schlesiska huvudstaden, dagens Wrocław, och därifrån via Brandenburg i exil i Nederländska republiken.
