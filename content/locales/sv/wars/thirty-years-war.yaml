By 1625 the Emperor Ferdinand II and the Catholic League had crushed the Bohemian revolt and overrun the Palatinate, and the Protestant princes of northern Germany feared that their lands and their former church estates would be next. Christian IV of Denmark–Norway, who as Duke of Holstein was also a prince of the Empire, took command of the forces of the Lower Saxon Circle in May 1625. He hoped as well to win north German bishoprics for his sons.: År 1625 hade kejsar Ferdinand II och katolska ligan krossat det böhmiska upproret och överskridit Pfalz, och de protestantiska furstarna i norra Tyskland fruktade att deras länder och deras tidigare kyrkogods stod på tur. Kristian IV av Danmark–Norge, som i egenskap av hertig av Holstein också var riksfurste, tog i maj 1625 befälet över styrkorna i Niedersächsiska kretsen. Han hoppades också vinna nordtyska biskopsdömen åt sina söner.
Christian had few trained troops, and England and the Dutch Republic agreed to pay for more only in the Treaty of The Hague in December 1625. Meanwhile the Emperor gained an army of his own, raised by the Bohemian nobleman Albrecht von Wallenstein and fed by the lands it occupied. In April 1626 Wallenstein beat Christian’s ally Ernst von Mansfeld at the Dessau Bridge on the Elbe, and Mansfeld’s army marched off towards Silesia and Hungary.: Kristian hade få utbildade trupper, och England och Nederländska republiken gick med på att betala för fler först genom fördraget i Haag i december 1625. Under tiden fick kejsaren en egen armé, uppsatt av den böhmiske adelsmannen Albrecht von Wallenstein och försörjd av de länder den ockuperade. I april 1626 slog Wallenstein Kristians bundsförvant Ernst von Mansfeld vid Dessaubron över Elbe, och Mansfelds armé drog i väg mot Schlesien och Ungern.
