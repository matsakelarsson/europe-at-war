Thirty Years’ War: Trettioåriga kriget
The long war in the Holy Roman Empire between the Catholic Emperor and his allies and Protestant princes backed by foreign powers, which devastated much of Germany. Denmark–Norway fought in it in 1625–1629 and Sweden from 1630; by the Peace of Westphalia in 1648 Sweden gained Western Pomerania, Wismar and Bremen-Verden.: Det långa kriget i tysk-romerska riket mellan den katolske kejsaren och hans allierade och protestantiska furstar med stöd av utländska makter, som ödelade stora delar av Tyskland. Danmark–Norge deltog 1625–1629 och Sverige från 1630; genom westfaliska freden 1648 fick Sverige Vorpommern, Wismar och Bremen-Verden.
