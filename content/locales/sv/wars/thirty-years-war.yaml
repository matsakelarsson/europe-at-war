Christian’s headquarters in the duchy of Brunswick, from where he set out against Tilly in the summer of 1626.: Kristians högkvarter i hertigdömet Braunschweig, varifrån han drog ut mot Tilly sommaren 1626.
Halberstadt: Halberstadt
Catholic League troops under Tilly occupied this Protestant-held bishopric early in 1625, while Wallenstein’s new imperial army moved against nearby Magdeburg.: Katolska ligans trupper under Tilly ockuperade detta protestantiskt kontrollerade biskopsdöme i början av 1625, medan Wallensteins nya kejserliga armé ryckte fram mot det närbelägna Magdeburg.
25 April 1626: 25 april 1626
Mansfeld’s attack on Wallenstein’s fortified bridgehead over the Elbe was beaten off with heavy losses.: Mansfelds anfall mot Wallensteins befästa brohuvud över Elbe slogs tillbaka med svåra förluster.
In late July 1626 Christian led his army out of Wolfenbüttel to seek battle with Tilly’s Catholic League army, not knowing that Wallenstein had sent Tilly more than 4,000 reinforcements. Outmanoeuvred and soaked by torrential rain, the Danes turned back, and for three days their rearguard fought off Tilly’s cavalry. On 27 August Christian decided to stand at Lutter am Barenberge.: I slutet av juli 1626 ledde Kristian sin armé ut från Wolfenbüttel för att söka strid med Tillys ligaarmé, ovetande om att Wallenstein hade sänt Tilly mer än 4 000 man i förstärkningar. Utmanövrerade och genomblöta av skyfall vände danskarna, och i tre dagar höll deras eftertrupp Tillys kavalleri stången. Den 27 augusti beslöt Kristian att göra front vid Lutter am Barenberge.
An unauthorised attack by his right wing drew the whole army into a general advance, which was thrown back with heavy losses. Christian had four horses shot under him and fled with his cavalry. He left behind about 3,000 dead and wounded and all his artillery, and 2,500 more men surrendered the next day; Tilly lost about 700. Most of Christian’s German allies now abandoned him, and he withdrew to winter quarters at Stade.: Ett otillåtet anfall av hans högra flygel drog med sig hela armén i en allmän framryckning, som slogs tillbaka med svåra förluster. Kristian fick fyra hästar skjutna under sig och flydde med sitt kavalleri. Han lämnade efter sig omkring 3 000 döda och sårade och hela sitt artilleri, och ytterligare 2 500 man kapitulerade dagen därpå; Tilly förlorade omkring 700. De flesta av Kristians tyska bundsförvanter övergav honom nu, och han drog sig tillbaka till vinterkvarter i Stade.
