About 3,000 killed or wounded and 2,500 captured: Omkring 3 000 döda eller sårade och 2 500 tillfångatagna
League losses: Ligans förluster
About 700 killed or wounded: Omkring 700 döda eller sårade
27 August 1626: 27 augusti 1626
Tilly’s veterans broke the Danish-German army at the foot of the Barenberg, twenty miles from Wolfenbüttel. The survivors who took refuge in Lutter castle surrendered the next day.: Tillys veteraner bröt den dansk-tyska armén vid foten av Barenberg, tjugo engelska mil från Wolfenbüttel. De överlevande som tagit sin tillflykt till borgen i Lutter kapitulerade dagen därpå.
Winter 1626–1627: vintern 1626–1627
Unable to hold Wolfenbüttel, Christian moved his winter quarters north to the lower Elbe.: Eftersom Kristian inte kunde hålla Wolfenbüttel flyttade han sina vinterkvarter norrut till nedre Elbe.
Retreat to Stade: Återtåg till Stade
In the summer of 1627 Wallenstein brought his army north and joined Tilly, and the Danish forces were swept out of Lower Saxony. In September the two armies invaded Holstein and then pushed up through Schleswig and the Jutland peninsula as far as the Limfjord, while Christian withdrew to the Danish islands, which his navy kept safe. The occupying troops lived off the land, and Jutland suffered heavy requisitions, looting and violence.: Sommaren 1627 förde Wallenstein sin armé norrut och förenade sig med Tilly, och de danska styrkorna sopades ut ur Niedersachsen. I september invaderade de två arméerna Holstein och trängde sedan upp genom Slesvig och Jylland ända till Limfjorden, medan Kristian drog sig tillbaka till de danska öarna, som hans flotta skyddade. Ockupationstrupperna levde på landet, och Jylland drabbades av hårda rekvisitioner, plundring och våld.
The Emperor rewarded Wallenstein with the duchy of Mecklenburg, whose dukes had sided with Christian, and in April 1628 named him “General of the Oceanic and Baltic Seas”. Together with Spain he planned an imperial fleet on the Baltic, to be built in the captured ports of Wismar, Rostock and Greifswald. The prospect of Habsburg power on the Baltic alarmed both Denmark and Sweden, which made an alliance in April 1628.: Kejsaren belönade Wallenstein med hertigdömet Mecklenburg, vars hertigar hade ställt sig på Kristians sida, och utnämnde honom i april 1628 till ”general över Oceanen och Östersjön”. Tillsammans med Spanien planerade han en kejserlig flotta på Östersjön, som skulle byggas i de erövrade hamnarna Wismar, Rostock och Greifswald. Utsikten till habsburgsk makt vid Östersjön skrämde både Danmark och Sverige, som slöt förbund i april 1628.
Invasion of Holstein: Invasionen av Holstein
September 1627: september 1627
Occupied: Ockuperat
Holstein, Schleswig and Jutland, 1627–1629: Holstein, Slesvig och Jylland, 1627–1629
Wallenstein: Wallenstein
Duke of Mecklenburg from January 1628: Hertig av Mecklenburg från januari 1628
Glückstadt: Glückstadt
Christian IV’s new fortress town on the Elbe held out, supplied by sea.: Kristian IV:s nya fästningsstad vid Elbe höll ut, försörjd sjövägen.
Imperial troops reached the Limfjord, and Wallenstein planned to use the port for his fleet. The Danes later raided it from the sea and destroyed the naval works.: Kejserliga trupper nådde Limfjorden, och Wallenstein planerade att använda hamnen för sin flotta. Danskarna anföll den senare från sjön och förstörde örlogsanläggningarna.
Güstrow: Güstrow
Wallenstein made the castle of the deposed dukes his residence as the new Duke of Mecklenburg.: Wallenstein gjorde de avsatta hertigarnas slott till sin residens som ny hertig av Mecklenburg.
Wallenstein and Tilly: Wallenstein och Tilly
Occupied by Imperial and League troops, 1627–1629: Ockuperat av kejserliga trupper och ligatrupper, 1627–1629
The Pomeranian port of Stralsund refused to take an imperial garrison, and in May 1628 imperial troops laid siege to it. Denmark sent help by sea, including 900 Scots of Donald Mackay’s regiment, of whom 500 were killed in the fighting. Swedish troops followed, and in June the town made a twenty-year alliance with Sweden. Wallenstein took command himself but lifted the siege on 4 August, his first serious setback.: Den pommerska hamnstaden Stralsund vägrade ta emot en kejserlig garnison, och i maj 1628 belägrade kejserliga trupper staden. Danmark sände hjälp sjövägen, bland annat 900 skottar ur Donald Mackays regemente, av vilka 500 dödades i striderna. Svenska trupper följde, och i juni slöt staden ett tjugoårigt förbund med Sverige. Wallenstein tog själv befälet men hävde belägringen den 4 augusti, hans första allvarliga motgång.
Christian IV used his command of the sea to raid the coasts. In August he landed on Usedom with 7,000 men and took Wolgast, but on 2 September Wallenstein beat him outside the town and the Danes re-embarked. Both men now wanted peace. By the Peace of Lübeck, signed on 22 May 1629, Christian got back all his lands without paying anything, but gave up his claims to the north German bishoprics and promised to stay out of the Empire’s affairs. The next year Sweden entered the war.: Kristian IV utnyttjade sitt herravälde till sjöss för att härja kusterna. I augusti landsteg han på Usedom med 7 000 man och intog Wolgast, men den 2 september slog Wallenstein honom utanför staden och danskarna gick åter ombord. Båda männen ville nu ha fred. Genom freden i Lübeck, undertecknad den 22 maj 1629, fick Kristian tillbaka alla sina länder utan att betala något, men avstod från sina anspråk på de nordtyska biskopsdömena och lovade att hålla sig utanför rikets angelägenheter. Året därpå gick Sverige in i kriget.
Siege of Stralsund: Belägringen av Stralsund
13 May – 4 August 1628, abandoned: 13 maj – 4 augusti 1628, avbruten
Battle of Wolgast: Slaget vid Wolgast
2 September 1628, Imperial victory: 2 september 1628, kejserlig seger
Peace of Lübeck: Freden i Lübeck
22 May 1629, ratified by the Emperor on 7 June: 22 maj 1629, ratificerad av kejsaren den 7 juni
13 May – 4 August 1628: 13 maj – 4 augusti 1628
Danish, Scottish and then Swedish troops helped the townspeople beat off repeated assaults. The town stayed in Swedish hands for most of the next two centuries.: Danska, skotska och sedan svenska trupper hjälpte stadsborna att slå tillbaka upprepade stormningar. Staden förblev i svenska händer under större delen av de två följande seklerna.
2 September 1628: 2 september 1628
Wallenstein, fresh from Stralsund, routed Christian’s landing force, which had to abandon the town.: Wallenstein, som kom direkt från Stralsund, slog Kristians landstigningsstyrka på flykten, och den måste överge staden.
22 May 1629: 22 maj 1629
Negotiated in secret by Christian and Wallenstein. Denmark–Norway lost no land but left the war.: Förhandlad i hemlighet av Kristian och Wallenstein. Danmark–Norge förlorade inget land men lämnade kriget.
Christian IV, 1628: Kristian IV, 1628
Occupied by Imperial and League troops until the peace: Ockuperat av kejserliga trupper och ligatrupper fram till freden
The Truce of Altmark with Poland in 1629 let Sweden keep Livonia and several Prussian ports, and it freed King Gustav II Adolf to intervene in Germany. In July 1630 he landed at Peenemünde on the island of Usedom with about 13,000 men.: Stilleståndet i Altmark med Polen 1629 lät Sverige behålla Livland och flera preussiska hamnar och gav kung Gustav II Adolf fria händer att ingripa i Tyskland. I juli 1630 landsteg han vid Peenemünde på ön Usedom med omkring 13 000 man.
Stettin fell within weeks, and a treaty with the Duke of Pomerania turned the duchy into Sweden’s bridgehead. In January 1631 France promised to pay for the war in the Treaty of Bärwalde.: Stettin föll inom några veckor, och ett fördrag med hertigen av Pommern gjorde hertigdömet till Sveriges brohuvud. I januari 1631 lovade Frankrike att bekosta kriget genom fördraget i Bärwalde.
King: Kung
Landing force: Landstigningsstyrka
About 13,000 men (10,000 foot, 3,000 horse): Omkring 13 000 man (10 000 till fots, 3 000 till häst)
Landing at Peenemünde: Landstigningen vid Peenemünde
6 July 1630 (New Style): 6 juli 1630 (n.s.)
A fleet of 27 ships brought the king and some 13,000 troops to Usedom, at the mouth of the Peene.: En flotta på 27 fartyg förde kungen och omkring 13 000 soldater till Usedom, vid Peenes mynning.
July 1630: juli 1630
The Pomeranian capital was taken soon after the landing. By the autumn it held the largest Swedish garrison in the duchy, over 4,200 men.: Den pommerska huvudstaden intogs strax efter landstigningen. På hösten hade den den största svenska garnisonen i hertigdömet, över 4 200 man.
Already a Swedish ally. In the autumn of 1630 about 3,100 Swedish soldiers were based here.: Redan en svensk bundsförvant. Hösten 1630 var omkring 3 100 svenska soldater förlagda här.
Prussian ports: Preussiska hamnar
Under the Truce of Altmark Sweden held coastal towns such as Pillau, Memel and Elbing and took a share of the tolls on Polish trade, which helped pay for the war in Germany.: Enligt stilleståndet i Altmark höll Sverige kuststäder som Pillau, Memel och Elbing och fick en andel av tullarna på den polska handeln, vilket hjälpte till att bekosta kriget i Tyskland.
In May 1631 Imperial troops under Tilly stormed the Protestant city of Magdeburg before the Swedes could relieve it, killing some 20,000 people. The massacre pushed wavering Protestant princes toward Sweden, and Saxony joined Gustav Adolf.: I maj 1631 stormade kejserliga trupper under Tilly den protestantiska staden Magdeburg innan svenskarna hann undsätta den, och omkring 20 000 människor dödades. Massakern drev vacklande protestantiska furstar mot Sverige, och Sachsen anslöt sig till Gustav Adolf.
On 17 September 1631, at Breitenfeld north of Leipzig, the Swedish-Saxon army of about 40,000 routed Tilly’s 31,000, even after the Saxons fled early in the battle. The king then swept west through Franconia to winter at Mainz on the Rhine.: Den 17 september 1631, vid Breitenfeld norr om Leipzig, slog den svensk-sachsiska armén på omkring 40 000 man Tillys 31 000 på flykten, trots att sachsarna flydde tidigt i slaget. Kungen drog sedan västerut genom Franken för att övervintra i Mainz vid Rhen.
Swedish-Saxon army: Svensk-sachsisk armé
About 40,000: Omkring 40 000
Imperial army: Kejserlig armé
About 31,000: Omkring 31 000
Sack of Magdeburg: Magdeburgs förstöring
20 May 1631: 20 maj 1631
Tilly’s army stormed the city after a two-month siege. Most of its inhabitants died in the massacre and fire that followed.: Tillys armé stormade staden efter en två månader lång belägring. De flesta av invånarna omkom i den massaker och brand som följde.
Battle of Breitenfeld: Slaget vid Breitenfeld
17 September 1631: 17 september 1631
The first great Protestant victory of the war. The Saxons broke, but the Swedish brigades held and destroyed Tilly’s army.: Krigets första stora protestantiska seger. Sachsarna bröt samman, men de svenska brigaderna höll stånd och förintade Tillys armé.
Winter quarters at Mainz: Vinterkvarter i Mainz
Winter 1631–32: vintern 1631–32
After conquering Franconia the king set up his winter quarters on the Rhine.: Efter att ha erövrat Franken förlade kungen sina vinterkvarter vid Rhen.
Into Franconia: In i Franken
In April 1632 the Swedes forced the river Lech at Rain over a pontoon bridge. Tilly was mortally wounded, and on 17 May the king rode into Munich. Wallenstein, back in command of the Emperor’s armies, then pinned him at Nuremberg, where a costly assault on Wallenstein’s camp at the Alte Veste failed in September.: I april 1632 forcerade svenskarna floden Lech vid Rain över en pontonbro. Tilly sårades dödligt, och den 17 maj red kungen in i München. Wallenstein, som åter hade befälet över kejsarens arméer, band sedan upp honom vid Nürnberg, där ett kostsamt anfall mot Wallensteins läger vid Alte Veste misslyckades i september.
The armies met again at Lützen on 16 November 1632. Sweden won the battle, but Gustav II Adolf was killed. His five-year-old daughter Christina became queen, and Chancellor Axel Oxenstierna took charge of the war.: Arméerna möttes på nytt vid Lützen den 16 november 1632. Sverige vann slaget, men Gustav II Adolf stupade. Hans femåriga dotter Kristina blev drottning, och rikskansler Axel Oxenstierna tog ledningen över kriget.
Killed at Lützen: Stupade vid Lützen
Gustav II Adolf, aged 37: Gustav II Adolf, 37 år gammal
New ruler: Ny regent
Queen Christina, with a regency: Drottning Kristina, med förmyndarregering
Battle of Rain: Slaget vid Rain
15 April 1632: 15 april 1632
Finnish cavalry crossed first, under fire. Tilly was badly wounded and died two weeks later.: Finskt kavalleri gick över först, under beskjutning. Tilly sårades svårt och dog två veckor senare.
17 May 1632: 17 maj 1632
The Bavarian capital paid a heavy ransom to avoid being plundered. It was the deepest Swedish thrust into the Empire.: Den bayerska huvudstaden betalade en tung brandskatt för att slippa plundring. Det var den djupaste svenska framstöten i riket.
Battle of the Alte Veste: Slaget vid Alte Veste
3–4 September 1632: 3–4 september 1632
Gustav Adolf attacked Wallenstein’s entrenched camp outside Nuremberg and was beaten back with heavy losses.: Gustav Adolf anföll Wallensteins förskansade läger utanför Nürnberg och slogs tillbaka med svåra förluster.
Battle of Lützen: Slaget vid Lützen
16 November 1632: 16 november 1632
A hard-fought Swedish victory over Wallenstein, paid for with the life of the king, who was killed in the fighting.: En hårt tillkämpad svensk seger över Wallenstein, betald med kungens liv; han stupade i striden.
To Lützen: Mot Lützen
Oxenstierna kept the war going through the Heilbronn League of German Protestant states, paid for by France. But on 6 September 1634 an Imperial army, reinforced by 15,000 Spanish troops, crushed the Swedish-German army at Nördlingen. The Swedes had to pull out of Bavaria.: Oxenstierna höll kriget vid liv genom Heilbronnförbundet av tyska protestantiska stater, som finansierades av Frankrike. Men den 6 september 1634 krossade en kejserlig armé, förstärkt med 15 000 spanska soldater, den svensk-tyska armén vid Nördlingen. Svenskarna måste dra sig ut ur Bayern.
In May 1635 Saxony and other Lutheran princes made the Peace of Prague with the Emperor, leaving Sweden almost alone. To free up troops, Sweden also gave up its Prussian ports in the Truce of Stuhmsdorf with Poland in September 1635, while keeping Livonia with Riga.: I maj 1635 slöt Sachsen och andra lutherska furstar freden i Prag med kejsaren, vilket lämnade Sverige nästan ensamt. För att frigöra trupper avstod Sverige också från sina preussiska hamnar genom stilleståndet i Stuhmsdorf med Polen i september 1635, men behöll Livland med Riga.
Swedish losses at Nördlingen: Svenska förluster vid Nördlingen
About 21,000 killed or captured: Omkring 21 000 döda eller tillfångatagna
Allies lost: Förlorade bundsförvanter
Saxony and most Lutheran princes: Sachsen och de flesta lutherska furstar
Heilbronn League: Heilbronnförbundet
An alliance of German Protestant states under Swedish leadership, formed after the king’s death and funded by France.: Ett förbund av tyska protestantiska stater under svensk ledning, bildat efter kungens död och finansierat av Frankrike.
Battle of Nördlingen: Slaget vid Nördlingen
6 September 1634: 6 september 1634
A crushing Imperial-Spanish victory that destroyed the Swedish field army in the south. Some historians call it the pivotal battle of the war.: En förkrossande kejserlig-spansk seger som förintade den svenska fältarmén i söder. Vissa historiker kallar det krigets avgörande slag.
30 May 1635: 30 maj 1635
Saxony and most German Lutheran rulers made peace with the Emperor and abandoned their Swedish alliance.: Sachsen och de flesta tyska lutherska furstar slöt fred med kejsaren och övergav sitt förbund med Sverige.
Truce of Stuhmsdorf: Stilleståndet i Stuhmsdorf
12 September 1635: 12 september 1635
The truce with Poland was extended by 26 years. Sweden gave up the Prussian ports and their tolls, and kept most of Livonia, including Riga.: Stilleståndet med Polen förlängdes med 26 år. Sverige avstod de preussiska hamnarna och deras tullar och behöll större delen av Livland, inklusive Riga.
Swedish retreat: Svenskt återtåg
After the Swedish defeat at Nördlingen and the Peace of Prague, Cardinal Richelieu could no longer fight the Habsburgs only through allies and subsidies. When Spanish troops seized Trier in March 1635 and carried off its archbishop-elector, who was under French protection, France declared war on Spain on 19 May. A French army won at Les Avins in the Spanish Netherlands the next day, but with its Dutch allies it failed before Leuven and melted away through disease and desertion. In October France took Bernhard of Saxe-Weimar’s German army into its pay.: Efter det svenska nederlaget vid Nördlingen och freden i Prag kunde kardinal Richelieu inte längre bekämpa habsburgarna enbart genom bundsförvanter och subsidier. När spanska trupper i mars 1635 intog Trier och förde bort dess ärkebiskop och kurfurste, som stod under franskt beskydd, förklarade Frankrike Spanien krig den 19 maj. En fransk armé segrade vid Les Avins i Spanska Nederländerna dagen därpå, men misslyckades tillsammans med sina nederländska bundsförvanter framför Leuven och smälte bort genom sjukdomar och deserteringar. I oktober tog Frankrike Bernhard av Sachsen-Weimars tyska armé i sin sold.
In July 1636 the Cardinal-Infante Ferdinand, governor of the Spanish Netherlands, invaded Picardy with Spanish troops and imperial cavalry under Ottavio Piccolomini and the Bavarian general Johann von Werth. They took La Capelle and Le Catelet, forced the Somme on 5 August and took Corbie on 15 August, while their horsemen raided as far as Compiègne and panic spread in Paris, about 120 km away. Louis XIII raised a new army, the invaders withdrew, and Corbie was retaken on 14 November. In the east an imperial invasion of Burgundy under Matthias Gallas stalled at Saint-Jean-de-Losne.: I juli 1636 invaderade kardinalinfanten Ferdinand, ståthållare i Spanska Nederländerna, Pikardiet med spanska trupper och kejserligt kavalleri under Ottavio Piccolomini och den bayerske generalen Johann von Werth. De intog La Capelle och Le Catelet, forcerade Somme den 5 augusti och intog Corbie den 15 augusti, medan deras ryttare härjade ända till Compiègne och panik spred sig i Paris, omkring 120 km bort. Ludvig XIII satte upp en ny armé, inkräktarna drog sig tillbaka och Corbie återtogs den 14 november. I öster körde en kejserlig invasion av Bourgogne under Matthias Gallas fast vid Saint-Jean-de-Losne.
France declares war on Spain: Frankrike förklarar Spanien krig
19 May 1635: 19 maj 1635
Corbie: Corbie
Taken by Spain 15 August, retaken 14 November 1636: Intogs av Spanien 15 augusti, återtogs 14 november 1636
Known in France as: I Frankrike känt som
l’année de Corbie, the Year of Corbie: l’année de Corbie, Corbieåret
Trier: Trier
26 March 1635: 26 mars 1635
Spanish troops from Luxembourg surprised the city and captured Archbishop-Elector Philipp Christoph von Sötern, who had put himself under French protection. He was held prisoner for ten years.: Spanska trupper från Luxemburg överrumplade staden och tillfångatog ärkebiskopen och kurfursten Philipp Christoph von Sötern, som hade ställt sig under franskt beskydd. Han hölls fången i tio år.
A French herald brought the declaration of war to the capital of the Spanish Netherlands, opening a war with Spain that lasted until 1659.: En fransk härold förde krigsförklaringen till Spanska Nederländernas huvudstad och inledde ett krig mot Spanien som varade till 1659.
Marshals Châtillon and Brézé beat a smaller Spanish army under Prince Thomas of Savoy near Huy.: Marskalkarna Châtillon och Brézé slog en mindre spansk armé under prins Tommaso av Savojen nära Huy.
June – July 1635: juni – juli 1635
The French and Dutch besieged the city for about ten days and then withdrew, their armies wasted by disease, hunger and desertion.: Fransmännen och nederländarna belägrade staden i omkring tio dagar och drog sig sedan tillbaka, med arméerna försvagade av sjukdomar, svält och deserteringar.
La Capelle: La Capelle
8 July 1636: 8 juli 1636
The frontier fortress surrendered after a short siege, opening the road into Picardy.: Gränsfästningen kapitulerade efter en kort belägring, vilket öppnade vägen in i Pikardiet.
15 August 1636: 15 augusti 1636
The fortress on the Somme above Amiens surrendered after a week. A French army of some 50,000 men won it back on 14 November after a six-week siege.: Fästningen vid Somme ovanför Amiens kapitulerade efter en vecka. En fransk armé på omkring 50 000 man återtog den den 14 november efter en sex veckor lång belägring.
Saint-Jean-de-Losne: Saint-Jean-de-Losne
November 1636: november 1636
The small Burgundian town on the Saône held out against Gallas’s army, which then retreated, weakened by hunger and disease.: Den lilla burgundiska staden vid Saône höll ut mot Gallas armé, som sedan drog sig tillbaka, försvagad av svält och sjukdomar.
Cardinal-Infante: Kardinalinfanten
Imperial cavalry: Kejserligt kavalleri
Louis XIII: Ludvig XIII
Gallas: Gallas
Imperial and Bavarian success: Kejserliga och bayerska framgångar
Imperial and Bavarian moves: Kejserliga och bayerska trupprörelser
With Saxony now an enemy, Johan Banér fought back from Sweden’s Baltic base. On 4 October 1636 he and the Scottish general Alexander Leslie beat a larger Imperial-Saxon army at Wittstock in Brandenburg, restoring Swedish power in northern Germany. A new subsidy treaty with France followed in 1638.: Med Sachsen nu som fiende slog Johan Banér tillbaka från Sveriges bas vid Östersjön. Den 4 oktober 1636 slog han och den skotske generalen Alexander Leslie en större kejserlig-sachsisk armé vid Wittstock i Brandenburg och återställde den svenska makten i norra Tyskland. Ett nytt subsidiefördrag med Frankrike följde 1638.
Banér beat the Saxons again at Chemnitz in 1639 and pushed into Bohemia. In the winter of 1640–41 he struck at Regensburg with French help, then had to fall back. He died at Halberstadt in May 1641.: Banér slog sachsarna på nytt vid Chemnitz 1639 och trängde in i Böhmen. Vintern 1640–41 slog han till mot Regensburg med fransk hjälp, men måste sedan dra sig tillbaka. Han dog i Halberstadt i maj 1641.
At Wittstock: Vid Wittstock
About 18,000 Swedes against about 25,000: Omkring 18 000 svenskar mot omkring 25 000
French subsidies: Franska subsidier
Treaty of Hamburg, 1638: Fördraget i Hamburg 1638
Battle of Wittstock: Slaget vid Wittstock
4 October 1636: 4 oktober 1636
A decisive victory over the Imperial-Saxon army, 93 km north-west of Berlin, which showed the Swedes were not a spent force after Nördlingen.: En avgörande seger över den kejserlig-sachsiska armén, 93 km nordväst om Berlin, som visade att svenskarna inte var en förbrukad kraft efter Nördlingen.
Battle of Chemnitz: Slaget vid Chemnitz
Banér defeated the Saxons, opening the way into Bohemia. It may have been his finest battle.: Banér besegrade sachsarna och öppnade vägen in i Böhmen. Det var kanske hans främsta slag.
Strike at Regensburg: Anfallet mot Regensburg
Winter 1640–41: vintern 1640–41
Banér and the French under Guébriant tried a surprise attack on the city where the Imperial Diet was meeting, but could not take it.: Banér och fransmännen under Guébriant försökte överrumpla staden där riksdagen sammanträdde, men kunde inte inta den.
Banér dies: Banér dör
May 1641: maj 1641
Worn out by the retreat, Banér died at Halberstadt after naming Lennart Torstenson his successor.: Utmattad av återtåget dog Banér i Halberstadt efter att ha utsett Lennart Torstensson till sin efterträdare.
Into Bohemia: In i Böhmen
Lennart Torstenson moved fast. He took Olomouc in Moravia in June 1642 and destroyed an Imperial army at the second battle of Breitenfeld on 2 November 1642.: Lennart Torstensson rörde sig snabbt. Han intog Olomouc i Mähren i juni 1642 och förintade en kejserlig armé i andra slaget vid Breitenfeld den 2 november 1642.
After a lightning campaign against Denmark (see the Torstenson War), he turned south again. At Jankau in Bohemia on 6 March 1645 he routed the Emperor’s army and headed for Vienna, but a long siege of Brno failed and he had to withdraw.: Efter ett blixtfälttåg mot Danmark (se Torstenssonska kriget) vände han söderut igen. Vid Jankau i Böhmen den 6 mars 1645 slog han kejsarens armé på flykten och drog mot Wien, men en lång belägring av Brno misslyckades och han måste dra sig tillbaka.
Lennart Torstenson: Lennart Torstensson
Brno siege: Belägringen av Brno
3 May – 23 August 1645, failed: 3 maj – 23 augusti 1645, misslyckad
Olomouc: Olomouc
14 June 1642: 14 juni 1642
The Moravian city fell after a short siege and stayed in Swedish hands for the rest of the war.: Den mähriska staden föll efter en kort belägring och förblev i svenska händer under resten av kriget.
Second Battle of Breitenfeld: Andra slaget vid Breitenfeld
2 November 1642: 2 november 1642
Fought on the same ground as in 1631. Torstenson turned on the army that had lifted his siege of Leipzig and won crushingly.: Utkämpades på samma mark som 1631. Torstensson vände sig mot den armé som hade tvingat honom att häva belägringen av Leipzig och vann en förkrossande seger.
Battle of Jankau: Slaget vid Jankau
6 March 1645: 6 mars 1645
One of the bloodiest battles of the war, about 50 km south-east of Prague. It opened the road to Vienna.: Ett av krigets blodigaste slag, omkring 50 km sydost om Prag. Det öppnade vägen till Wien.
Siege of Brno: Belägringen av Brno
May – August 1645: maj – augusti 1645
The last fortress between Torstenson and Vienna held out for more than three months. When his Transylvanian allies made peace, he gave up.: Den sista fästningen mellan Torstensson och Wien höll ut i mer än tre månader. När hans transsylvanska bundsförvanter slöt fred gav han upp.
Toward Vienna: Mot Wien
In 1638 Bernhard of Saxe-Weimar, a German Protestant general in French pay, took the Habsburg fortress of Breisach on the upper Rhine, and after his death in 1639 France took over his army and his conquests. It fought Bavaria for south-west Germany. In November 1643 Marshal Guébriant took Rottweil but died of his wounds, and on 24 November the Bavarian general Franz von Mercy, with Johann von Werth and Lorraine troops, surprised the French army in its winter quarters at Tuttlingen and captured most of it. In July 1644 Mercy took Freiburg im Breisgau.: År 1638 intog Bernhard av Sachsen-Weimar, en tysk protestantisk general i fransk sold, den habsburgska fästningen Breisach vid övre Rhen, och efter hans död 1639 tog Frankrike över hans armé och hans erövringar. Den stred mot Bayern om sydvästra Tyskland. I november 1643 intog marskalk Guébriant Rottweil men dog av sina sår, och den 24 november överraskade den bayerske generalen Franz von Mercy, med Johann von Werth och lothringska trupper, den franska armén i dess vinterkvarter vid Tuttlingen och tillfångatog större delen av den. I juli 1644 intog Mercy Freiburg im Breisgau.
The young Duke of Enghien, the future Great Condé, joined Turenne with fresh troops, and on 3, 5 and 9 August they stormed Mercy’s entrenchments on the wooded hills around Freiburg in some of the bloodiest fighting of the war. Mercy withdrew in good order, but the French went on to take Philippsburg, Speyer, Worms and Mainz. In May 1645 Mercy surprised Turenne at Herbsthausen, but on 3 August Enghien, Turenne and their Hessian allies beat the Bavarians at Allerheim near Nördlingen. Mercy was killed, and both armies were so badly mauled that the French fell back to the Rhine.: Den unge hertigen av Enghien, den blivande store Condé, förenade sig med Turenne med nya trupper, och den 3, 5 och 9 augusti stormade de Mercys förskansningar på de skogklädda höjderna kring Freiburg i några av krigets blodigaste strider. Mercy drog sig tillbaka i god ordning, men fransmännen fortsatte och intog Philippsburg, Speyer, Worms och Mainz. I maj 1645 överraskade Mercy Turenne vid Herbsthausen, men den 3 augusti slog Enghien, Turenne och deras hessiska bundsförvanter bayrarna vid Allerheim nära Nördlingen. Mercy stupade, och båda arméerna var så illa tilltygade att fransmännen drog sig tillbaka till Rhen.
Battle of Tuttlingen: Slaget vid Tuttlingen
24 November 1643, Bavarian victory: 24 november 1643, bayersk seger
Battle of Freiburg: Slaget vid Freiburg
3–9 August 1644, indecisive: 3–9 augusti 1644, oavgjort
Battle of Allerheim: Slaget vid Allerheim
3 August 1645, French victory; Mercy killed: 3 augusti 1645, fransk seger; Mercy stupade
Bernhard of Saxe-Weimar starved the Rhine fortress into surrender in December 1638. France kept it in the Peace of Westphalia, together with the Habsburg lands in Alsace.: Bernhard av Sachsen-Weimar svalt ut fästningen vid Rhen till kapitulation i december 1638. Frankrike behöll den vid westfaliska freden, tillsammans med de habsburgska besittningarna i Elsass.
Rottweil: Rottweil
19 November 1643: 19 november 1643
Guébriant took the imperial city but was mortally wounded during the siege, leaving the army to the less able Josias Rantzau.: Guébriant intog riksstaden men sårades dödligt under belägringen, och armén övergick till den mindre skicklige Josias Rantzau.
24 November 1643: 24 november 1643
Mercy’s and Werth’s cavalry fell on the scattered French quarters. Some 7,000 men were captured, Rantzau among them, and the French army in Germany ceased to exist for a time.: Mercys och Werths kavalleri föll över de spridda franska kvarteren. Omkring 7 000 man tillfångatogs, bland dem Rantzau, och den franska armén i Tyskland upphörde för en tid att existera.
3–9 August 1644: 3–9 augusti 1644
Three days of assaults on Mercy’s fortified lines cost the French perhaps 8,000 men and the Bavarians about half as many. Mercy then withdrew through the Black Forest.: Tre dagars stormningar av Mercys befästa linjer kostade fransmännen kanske 8 000 man och bayrarna ungefär hälften så många. Mercy drog sig sedan tillbaka genom Schwarzwald.
Philippsburg: Philippsburg
12 September 1644: 12 september 1644
The capture of this fortress, and of the cities of the middle Rhine, gave France control of the river. The Peace of Westphalia let it keep a garrison here.: Erövringen av denna fästning och av städerna vid mellersta Rhen gav Frankrike kontroll över floden. Westfaliska freden lät Frankrike behålla en garnison här.
Battle of Herbsthausen: Slaget vid Herbsthausen
5 May 1645: 5 maj 1645
Mercy surprised Turenne’s army near Mergentheim in Franconia and destroyed most of his infantry.: Mercy överraskade Turennes armé nära Mergentheim i Franken och förintade större delen av hans infanteri.
3 August 1645: 3 augusti 1645
Also called the Second Battle of Nördlingen. Each side lost about 4,000 men killed, wounded or captured, and Mercy was killed in the fighting.: Kallas också andra slaget vid Nördlingen. Vardera sidan förlorade omkring 4 000 man i döda, sårade eller tillfångatagna, och Mercy stupade i striden.
Mercy and Werth: Mercy och Werth
Enghien and Turenne, 1645: Enghien och Turenne, 1645
Bavarian and Imperial success: Bayerska och kejserliga framgångar
Bavarian and Imperial moves: Bayerska och kejserliga trupprörelser
Carl Gustaf Wrangel and the French under Turenne beat the last Imperial-Bavarian field army at Zusmarshausen on 17 May 1648. Königsmarck’s flying column then surprised Prague in July and looted the castle and the Lesser Town, but students and citizens held the Charles Bridge.: Carl Gustaf Wrangel och fransmännen under Turenne slog den sista kejserlig-bayerska fältarmén vid Zusmarshausen den 17 maj 1648. Königsmarcks flygande kolonn överrumplade sedan Prag i juli och plundrade borgen och Lillsidan, men studenter och borgare höll Karlsbron.
Peace was signed at Osnabrück and Münster on 24 October 1648. Sweden gained Western Pomerania with Stettin and Rügen, the port of Wismar, and the bishoprics of Bremen and Verden, together with 5 million thalers and a seat in the Imperial Diet.: Fred undertecknades i Osnabrück och Münster den 24 oktober 1648. Sverige fick Vorpommern med Stettin och Rügen, hamnstaden Wismar och stiften Bremen och Verden, tillsammans med 5 miljoner riksdaler och säte i riksdagen.
Gained: Vunnet
Western Pomerania, Wismar, Bremen-Verden: Vorpommern, Wismar, Bremen-Verden
5 million thalers: 5 miljoner riksdaler
Also: Dessutom
Brandenburg got Farther Pomerania, France most of Alsace: Brandenburg fick Hinterpommern, Frankrike större delen av Elsass
Battle of Zusmarshausen: Slaget vid Zusmarshausen
17 May 1648: 17 maj 1648
The last major battle of the war on German soil, won by a Franco-Swedish army under Wrangel and Turenne.: Krigets sista stora slag på tysk mark, vunnet av en fransk-svensk armé under Wrangel och Turenne.
Battle of Prague: Slaget vid Prag
25 July – 1 November 1648: 25 juli – 1 november 1648
The Swedes took and plundered the west bank of the city, including the castle, but never got across the river. Fighting stopped when news of the peace arrived.: Svenskarna intog och plundrade stadens västra flodstrand, med borgen, men tog sig aldrig över floden. Striderna upphörde när budet om freden kom.
Treaty of Osnabrück: Fördraget i Osnabrück
24 October 1648: 24 oktober 1648
Sweden negotiated its part of the Peace of Westphalia here, in a city held by Protestant forces.: Sverige förhandlade om sin del av westfaliska freden här, i en stad som hölls av protestantiska styrkor.
The Mecklenburg port and the island of Poel became Swedish under the peace.: Den mecklenburgska hamnstaden och ön Poel blev svenska genom freden.
Königsmarck: Königsmarck
Gained by Sweden in this peace: Vunnet av Sverige vid denna fred
Swedish on a 30-year pledge: Svenskt som pant på 30 år
