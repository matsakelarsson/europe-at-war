Ferdinand found allies where Frederick found none. In the Treaty of Munich of October 1619 Duke Maximilian of Bavaria put the army of the Catholic League at his disposal in return for his costs and, secretly, Frederick’s electoral title. Lutheran Saxony joined the Emperor for the promise of Lusatia, and Spain sent money and troops. In July 1620 the Protestant Union agreed at Ulm to stay neutral. Maximilian and his general Tilly then occupied Upper Austria, whose estates had joined the rebels, while John George of Saxony took Lusatia and a Spanish army invaded the Rhenish Palatinate.: Ferdinand fann bundsförvanter där Fredrik inte fann några. Genom fördraget i München i oktober 1619 ställde hertig Maximilian av Bayern den katolska ligans armé till hans förfogande mot ersättning för sina kostnader och, i hemlighet, Fredriks kurfurstevärdighet. Det lutherska Sachsen ställde sig på kejsarens sida mot löfte om Lausitz, och Spanien sände pengar och trupper. I juli 1620 enades den protestantiska unionen i Ulm om att förbli neutral. Maximilian och hans general Tilly ockuperade sedan Övre Österrike, vars ständer hade anslutit sig till rebellerna, medan Johan Georg av Sachsen intog Lausitz och en spansk armé invaderade Rhenpfalz.
The League and imperial armies under Tilly and Bucquoy marched into Bohemia, and on 8 November 1620 they attacked the Bohemian army under Christian of Anhalt on the White Mountain outside Prague. Within two hours it was routed, and Frederick fled, mocked ever after as the “Winter King”. On 21 June 1621 twenty-seven leaders of the revolt were executed on Prague’s Old Town Square. The rebels’ estates were confiscated, Bohemia became a hereditary Habsburg kingdom, Protestant worship was banned, and tens of thousands of Protestants went into exile.: Ligans och kejsarens arméer under Tilly och Bucquoy marscherade in i Böhmen, och den 8 november 1620 anföll de den böhmiska armén under Kristian av Anhalt på Vita berget utanför Prag. Inom två timmar var den slagen på flykten, och Fredrik flydde, för alltid hånad som ”vinterkungen”. Den 21 juni 1621 avrättades tjugosju ledare för upproret på Gamla stans torg i Prag. Rebellernas gods konfiskerades, Böhmen blev ett habsburgskt arvrike, protestantisk gudstjänst förbjöds och tiotusentals protestanter gick i exil.
