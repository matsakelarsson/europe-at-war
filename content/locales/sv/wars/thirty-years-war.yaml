The Swedish phase (1630–1648) was migrated from Sweden at War and is told from Sweden’s side. The Danish phase (1625–1629), the Bohemian and Palatine phases (1618–1623) and France’s war against Spain and Bavaria (1635–1645) were added for World at War.: Den svenska fasen (1630–1648) överfördes från Sweden at War och skildras från svensk sida. Den danska fasen (1625–1629), den böhmiska och den pfalziska fasen (1618–1623) samt Frankrikes krig mot Spanien och Bayern (1635–1645) lades till för World at War.
