Frederick was placed under the imperial ban in January 1621, and the Protestant Union dissolved itself that spring. Spanish troops already held the Palatinate west of the Rhine, and in the autumn Maximilian’s army took the Upper Palatinate. Frederick’s cause was kept alive by three commanders, Mansfeld, Margrave George Frederick of Baden-Durlach and Christian of Brunswick, the Protestant administrator of Halberstadt. In 1622 Mansfeld beat Tilly at Mingolsheim on 27 April, but Tilly, joined by Spanish troops under Gonzalo de Córdoba, routed Baden-Durlach at Wimpfen on 6 May and caught Christian crossing the Main at Höchst on 20 June.: Fredrik förklarades i riksacht i januari 1621, och den protestantiska unionen upplöste sig själv samma vår. Spanska trupper höll redan Pfalz väster om Rhen, och på hösten intog Maximilians armé Oberpfalz. Fredriks sak hölls vid liv av tre befälhavare, Mansfeld, markgreve Georg Fredrik av Baden-Durlach och Kristian av Braunschweig, den protestantiske administratorn av Halberstadt. År 1622 slog Mansfeld Tilly vid Mingolsheim den 27 april, men Tilly, förstärkt av spanska trupper under Gonzalo de Córdoba, slog Baden-Durlach på flykten vid Wimpfen den 6 maj och överraskade Kristian när han gick över Main vid Höchst den 20 juni.
Tilly took Heidelberg in September after a two-month siege, and Mannheim in November. Mansfeld and Christian cut their way through a Spanish army at Fleurus and went into Dutch service. On 25 February 1623, at an assembly of princes at Regensburg, Ferdinand transferred Frederick’s electoral title to Maximilian of Bavaria, despite Protestant protests and Spanish misgivings. When Christian marched again that summer, Tilly caught him at Stadtlohn near the Dutch border on 6 August and destroyed his army. The war in the Empire seemed over, and Frederick lived on in exile in The Hague.: Tilly intog Heidelberg i september efter en två månader lång belägring, och Mannheim i november. Mansfeld och Kristian banade sig väg genom en spansk armé vid Fleurus och gick i nederländsk tjänst. Den 25 februari 1623, vid en furstedag i Regensburg, överförde Ferdinand Fredriks kurfurstevärdighet till Maximilian av Bayern, trots protestantiska protester och spanska betänkligheter. När Kristian på nytt drog ut samma sommar överraskade Tilly honom vid Stadtlohn nära den nederländska gränsen den 6 augusti och förintade hans armé. Kriget i riket tycktes vara över, och Fredrik levde vidare i exil i Haag.
