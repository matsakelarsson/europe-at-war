The regents Vilém Slavata and Jaroslav Bořita of Martinice and the secretary Philipp Fabricius fell some 20 metres from a window of the Bohemian Chancellery into the castle moat and escaped with their lives. Catholics called it a miracle.: Ståthållarna Vilém Slavata och Jaroslav Bořita av Martinice samt sekreteraren Philipp Fabricius föll omkring 20 meter från ett fönster i det böhmiska kansliet ned i borgens vallgrav och kom undan med livet. Katolikerna kallade det ett mirakel.
