Dates are Gregorian. Kuruc bands had fought the Habsburg authorities since the early 1670s; the uprising is usually dated from Thököly’s leadership in 1678. The war of 1683–1699, including the siege of Vienna and Thököly’s later campaigns, is told in the entry on the Great Turkish War.: Datumen är gregorianska. Kuruczskaror hade bekämpat de habsburgska myndigheterna sedan början av 1670-talet; upproret brukar dateras från det att Thököly tog ledningen 1678. Kriget 1683–1699, med belägringen av Wien och Thökölys senare fälttåg, berättas i artikeln om Stora turkiska kriget.
Ilona Zrínyi’s son by her first marriage, Francis II Rákóczi, led the next great kuruc rising in 1703–1711, which has its own entry.: Ilona Zrínyis son i hennes första äktenskap, Frans II Rákóczi, ledde nästa stora kuruczuppror 1703–1711, som har en egen artikel.
