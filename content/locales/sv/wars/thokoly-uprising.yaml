Thököly Uprising: Thökölyupproret
? A rising of the kuruc, the Hungarian rebels against Habsburg rule, led by the young Upper Hungarian magnate Imre Thököly. After the Magnate Conspiracy of 1670–1671 Leopold I suspended the Hungarian constitution, ruled through a governing council and persecuted Protestants, and thousands of dispossessed nobles, discharged soldiers and runaway serfs fled to Ottoman Hungary and Transylvania. With French subsidies and Transylvanian help, Thököly took command in 1678 and invaded Royal Hungary, seizing the mining towns of Upper Hungary. In 1681 Leopold restored some of the estates’ rights at the Diet of Sopron, but Thököly turned to the Ottomans. In 1682, helped by the pasha of Buda, he took Kassa and Fülek, and the sultan recognised him as “King of Upper Hungary”, a title he used as prince, in return for tribute. In the same year he married Ilona Zrínyi, widow of Francis I Rákóczi. In 1683 his kuruc fought alongside the grand vizier’s army that besieged Vienna. After the Ottoman defeat his support melted away; imperial armies retook Upper Hungary, he was defeated near Eperjes in 1685, and in October the Ottoman pasha of Várad, suspecting him of dealing with the emperor, had him arrested and sent in chains to Edirne. Ilona Zrínyi held out in the castle of Munkács until January 1688. Thököly, later briefly prince of Transylvania, died in exile in İzmit in 1705.
: Ett uppror bland kuruczerna, de ungerska rebellerna mot det habsburgska styret, lett av den unge övreungerske magnaten Imre Thököly. Efter magnatsammansvärjningen 1670–1671 satte Leopold I den ungerska författningen ur spel, styrde genom ett regeringsråd och förföljde protestanter, och tusentals fördrivna adelsmän, avskedade soldater och förrymda livegna flydde till det osmanska Ungern och Transsylvanien. Med franska subsidier och transsylvansk hjälp tog Thököly befälet 1678 och invaderade Kungliga Ungern, där han intog gruvstäderna i Övre Ungern. År 1681 återställde Leopold en del av ständernas rättigheter vid riksdagen i Sopron, men Thököly vände sig till osmanerna. År 1682 intog han med hjälp av pashan i Buda Kassa och Fülek, och sultanen erkände honom som ”kung av Övre Ungern”, en titel han brukade som furste, mot tribut. Samma år gifte han sig med Ilona Zrínyi, änka efter Frans I Rákóczi. År 1683 stred hans kuruczer vid sidan av storvesirens armé som belägrade Wien. Efter det osmanska nederlaget smälte hans stöd bort; kejserliga arméer återtog Övre Ungern, han besegrades nära Eperjes 1685, och i oktober lät den osmanske pashan i Várad, som misstänkte honom för att förhandla med kejsaren, arrestera honom och föra honom i kedjor till Edirne. Ilona Zrínyi höll ut på borgen Munkács till januari 1688. Thököly, som senare en kort tid var furste av Transsylvanien, dog i exil i İzmit 1705.
