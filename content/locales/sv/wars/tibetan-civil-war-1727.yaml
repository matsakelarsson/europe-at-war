# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
Tibetan civil war of 1727–1728: Tibetanska inbördeskriget 1727–1728
? A war between the nobles of Ü and Tsang over the government of Tibet, which brought a permanent Qing garrison and resident officials (ambans) to Lhasa. After the Qing expedition of 1720 drove the Dzungars out, Tibet was governed by a council of ministers under Khangchenné Sönam Gyalpo, a noble from western Tsang favoured by the Qing, with the Ü nobles Ngapö Dorje Gyalpo, Lumpané Tashi Gyalpo and Jarraba Lodrö Gyalpo and the Tsang noble Polhané Sönam Topgyé. Rivalry between the two regions and over the Qing’s favour came to a head on 5 August 1727, when Ngapö, Lumpané and Jarraba had Khangchenné killed in Lhasa, with the backing of the young Seventh Dalai Lama’s father. Polhané, away at his estate, escaped the men sent to seize him, raised the levies of Tsang, allied with Khangchenné’s brother, the governor of Ngari, and appealed to the Yongzheng emperor. After about half a year of fighting he defeated Ngapö’s army near Gyantse, marched on Lhasa with some 9,000 men and took the city; his enemies, who had shut themselves in the Potala, were taken prisoner on 5 July 1728. A Qing army arrived in Lhasa on 4 September, after the fighting was over. On 1 November 1728 Qing officials had Ngapö and Lumpané executed by slicing, two lamas hanged and thirteen others beheaded, and some of their relatives killed or exiled. The Dalai Lama was sent to Gartar near Litang in Kham until 1735, Polhané was given charge of the government, ruling Tsang himself and Ü through two ministers under his direction, with two ambans supervising, and Qing troops were stationed in Lhasa. He governed Tibet until his death in 1747.
: Ett krig mellan adelsmännen i Ü och Tsang om Tibets styre, som förde en permanent Qinggarnison och residerande ämbetsmän (ambaner) till Lhasa. Sedan Qingexpeditionen 1720 hade drivit ut dzungarerna styrdes Tibet av ett ministerråd under Khangchenné Sönam Gyalpo, en adelsman från västra Tsang som Qing gynnade, tillsammans med adelsmännen Ngapö Dorje Gyalpo, Lumpané Tashi Gyalpo och Jarraba Lodrö Gyalpo från Ü och adelsmannen Polhané Sönam Topgyé från Tsang. Rivaliteten mellan de två regionerna och om Qings gunst ställdes på sin spets den 5 augusti 1727, när Ngapö, Lumpané och Jarraba lät döda Khangchenné i Lhasa, med stöd av den unge sjunde dalai lamas far. Polhané, som var på sitt gods, undkom de män som sänts för att gripa honom, uppbådade Tsangs manskap, allierade sig med Khangchennés bror, guvernören i Ngari, och vädjade till Yongzhengkejsaren. Efter ungefär ett halvårs strider besegrade han Ngapös armé nära Gyantse, tågade mot Lhasa med omkring 9 000 man och intog staden; hans fiender, som hade stängt in sig i Potala, togs till fånga den 5 juli 1728. En Qingarmé anlände till Lhasa den 4 september, sedan striderna var över. Den 1 november 1728 lät Qings ämbetsmän avrätta Ngapö och Lumpané genom långsam styckning, hänga två lamor och halshugga tretton andra, och en del av deras släktingar dödades eller förvisades. Dalai lama sändes till Gartar nära Litang i Kham fram till 1735, Polhané fick ansvaret för regeringen och styrde Tsang personligen och Ü genom två ministrar under sin ledning, med två ambaner som övervakare, och Qingtrupper förlades i Lhasa. Han styrde Tibet till sin död 1747.
