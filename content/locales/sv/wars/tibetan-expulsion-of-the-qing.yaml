# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
Expulsion of the Qing garrison from Tibet: Fördrivandet av Qinggarnisonen från Tibet
? The fighting in which Tibetans drove the Chinese garrison out of Lhasa and central Tibet after the fall of the Qing dynasty. A Qing army of some 2,000 men had entered Lhasa in February 1910, and the 13th Dalai Lama had fled to British India. When news of the Wuchang uprising of October 1911 reached Tibet, the unpaid garrison mutinied, plundered and split into factions. In the spring of 1912 the Dalai Lama, still in India, called on Tibetans to rise; Tibetan militias under Tsarong Dazang Dramdul besieged the Chinese in Lhasa, where the mutineers had plundered the city and occupied Sera monastery, while the garrisons of Gyantse and Shigatse surrendered and were sent to India through the mediation of the British trade agent David Macdonald. An agreement of 12 August 1912, concluded in the presence of Nepalese representatives, required the Chinese in Lhasa to seal their arms and leave within fifteen days. Fighting broke out again in September; a second armistice on 14 November was followed on 12 December 1912 by the departure from Lhasa of the last troops under Zhong Ying, who went home by way of India. The Dalai Lama returned to Lhasa in January 1913 and on 13 February 1913 issued a proclamation that Tibetans regard as a declaration of independence. The Republic of China maintained its claim to Tibet; a Sichuan army that reoccupied much of Kham in 1912 did not advance into central Tibet after Britain protested in August 1912. From 1913 to 1950 the Dalai Lama’s government governed central and western Tibet itself, although no major state recognised it as independent.
: De strider genom vilka tibetanerna drev ut den kinesiska garnisonen ur Lhasa och centrala Tibet efter Qingdynastins fall. En Qingarmé på omkring 2 000 man hade tågat in i Lhasa i februari 1910, och den trettonde Dalai lama hade flytt till Brittiska Indien. När nyheten om Wuchangupproret i oktober 1911 nådde Tibet gjorde den obetalda garnisonen myteri, plundrade och splittrades i fraktioner. Våren 1912 uppmanade Dalai lama, som fortfarande befann sig i Indien, tibetanerna att resa sig; tibetanska miliser under Tsarong Dazang Dramdul belägrade kineserna i Lhasa, där myteristerna hade plundrat staden och besatt Seraklostret, medan garnisonerna i Gyantse och Shigatse kapitulerade och sändes till Indien genom förmedling av den brittiske handelsagenten David Macdonald. Ett avtal den 12 augusti 1912, som slöts i närvaro av nepalesiska representanter, ålade kineserna i Lhasa att försegla sina vapen och lämna staden inom femton dagar. Striderna blossade upp igen i september; ett andra vapenstillestånd den 14 november följdes den 12 december 1912 av att de sista trupperna under Zhong Ying lämnade Lhasa och reste hem via Indien. Dalai lama återvände till Lhasa i januari 1913 och utfärdade den 13 februari 1913 en proklamation som tibetanerna betraktar som en självständighetsförklaring. Republiken Kina vidhöll sitt anspråk på Tibet; en sichuanesisk armé som återockuperade stora delar av Kham 1912 ryckte inte in i centrala Tibet sedan Storbritannien protesterat i augusti 1912. Från 1913 till 1950 styrde Dalai lamas regering själv centrala och västra Tibet, även om ingen större stat erkände den som självständig.
