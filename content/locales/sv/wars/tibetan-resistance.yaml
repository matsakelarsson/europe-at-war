# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
Tibetan armed resistance: Det tibetanska väpnade motståndet
? Guerrilla resistance to Chinese rule by Tibetans, chiefly Khampas from Kham, from 1956 to 1974. Kham and Amdo lay outside the territory of the Lhasa government and were governed as parts of Sichuan, Qinghai, Gansu and Yunnan, where land reform and campaigns against monasteries and chiefs began in the mid-1950s. Revolts broke out across eastern Kham early in 1956; the PLA besieged monasteries and in March 1956 bombed the monastery of Lithang from the air. Refugees and fighters moved west into central Tibet, and on 16 June 1958 the Khampa trader Andrug Gompo Tashi formed the Chushi Gangdruk (“Four Rivers, Six Ranges”) in Lhoka, south of Lhasa, while revolts spread through Amdo. From 1957 the CIA trained Tibetans on Saipan and at Camp Hale in Colorado, 259 there in all, and dropped some of them with arms into Tibet, where most were killed. The guerrillas held much of Lhoka in 1958–1959 and escorted the Dalai Lama to India in March 1959 (see the 1959 Tibetan uprising). After the PLA crushed the revolt inside Tibet, the CIA funded a base in Mustang in northern Nepal, where about 2,000 fighters under Baba Yeshi gathered from 1960 and raided across the border; a raid in 1961 captured a satchel of PLA documents. American support was reduced as the United States sought better relations with China and ended in 1974. That year, under Chinese pressure, Nepal’s army moved into Mustang; the Dalai Lama urged the guerrillas to lay down their arms, most surrendered, and their commander Gyatotsang Wangdu was killed in an ambush near the Tinkar pass as he tried to reach India. The number of people killed in Kham and Amdo is not known.
: Gerillamotstånd mot det kinesiska styret från tibetaners sida, främst khampa från Kham, från 1956 till 1974. Kham och Amdo låg utanför Lhasaregeringens territorium och styrdes som delar av Sichuan, Qinghai, Gansu och Yunnan, där jordreformer och kampanjer mot kloster och hövdingar inleddes i mitten av 1950-talet. Revolter bröt ut i hela östra Kham i början av 1956; Folkets befrielsearmé belägrade kloster och bombade i mars 1956 klostret i Lithang från luften. Flyktingar och krigare drog västerut in i centrala Tibet, och den 16 juni 1958 bildade khampahandlaren Andrug Gompo Tashi Chushi Gangdruk (”Fyra floder, sex bergskedjor”) i Lhoka, söder om Lhasa, medan revolter spred sig genom Amdo. Från 1957 utbildade CIA tibetaner på Saipan och i Camp Hale i Colorado, där sammanlagt 259 utbildades, och släppte ned en del av dem med vapen i Tibet, där de flesta dödades. Gerillan höll stora delar av Lhoka 1958–1959 och eskorterade Dalai lama till Indien i mars 1959 (se det tibetanska upproret 1959). Sedan Folkets befrielsearmé hade krossat revolten i själva Tibet finansierade CIA en bas i Mustang i norra Nepal, där omkring 2 000 krigare under Baba Yeshi samlades från 1960 och gjorde räder över gränsen; vid en räd 1961 erövrades en väska med dokument från Folkets befrielsearmé. Det amerikanska stödet minskades när USA sökte bättre förbindelser med Kina och upphörde 1974. Samma år ryckte Nepals armé under kinesiska påtryckningar in i Mustang; Dalai lama uppmanade gerillan att lägga ned vapnen, de flesta kapitulerade, och deras befälhavare Gyatotsang Wangdu dödades i ett bakhåll nära Tinkarpasset när han försökte ta sig till Indien. Antalet dödade i Kham och Amdo är inte känt.
