# Svenska översättningar av katalogtexten (våg 12); stegtexterna kommer senare.
Tigray War: Tigraykriget
? A war in northern Ethiopia between the federal government of Prime Minister Abiy Ahmed, allied with Eritrea and the forces of the Amhara region, and the Tigray People’s Liberation Front (TPLF), which had dominated Ethiopia’s government until 2018 and still ruled the Tigray region. It began on the night of 3–4 November 2020 when Tigrayan forces seized the bases of the federal army’s Northern Command. Federal, Amhara and Eritrean forces took Mekelle within a month, and Amhara forces occupied Western Tigray, from which Tigrayans were driven out. Massacres, mass rape and the looting and blockade of the region followed, and by mid-2021 hundreds of thousands of people in Tigray faced famine. In June 2021 the Tigray Defense Forces retook Mekelle and then advanced deep into the Amhara and Afar regions, coming within about 200 km of Addis Ababa in November, before a government counteroffensive built on drones drove them back. After a truce in 2022 and a last offensive by Ethiopian and Eritrean forces, the African Union brokered a cessation of hostilities signed in Pretoria on 2 November 2022. Estimates of the dead, most of them civilians who died of violence, hunger and lack of care, range from about 100,000 to 600,000.
: Ett krig i norra Etiopien mellan premiärminister Abiy Ahmeds federala regering, allierad med Eritrea och Amhararegionens styrkor, och Tigrayfolkets befrielsefront (TPLF), som hade dominerat Etiopiens regering fram till 2018 och fortfarande styrde Tigrayregionen. Det började natten mellan den 3 och 4 november 2020, när tigrayanska styrkor tog baserna för den federala arméns norra kommando. Federala och eritreanska styrkor och styrkor från Amhara intog Mekelle inom en månad, och styrkor från Amhara ockuperade Västra Tigray, varifrån tigrayer fördrevs. Massakrer, massvåldtäkter samt plundring och blockad av regionen följde, och i mitten av 2021 hotades hundratusentals människor i Tigray av hungersnöd. I juni 2021 återtog Tigrays försvarsstyrkor Mekelle och ryckte sedan långt in i Amhara- och Afarregionerna och kom i november inom omkring 200 km från Addis Abeba, innan en regeringsmotoffensiv som byggde på drönare drev dem tillbaka. Efter en vapenvila 2022 och en sista offensiv av etiopiska och eritreanska styrkor förmedlade Afrikanska unionen ett avtal om upphörande av fientligheterna, som undertecknades i Pretoria den 2 november 2022. Uppskattningarna av antalet döda, de flesta av dem civila som dog av våld, svält och brist på vård, varierar från omkring 100 000 till 600 000.
