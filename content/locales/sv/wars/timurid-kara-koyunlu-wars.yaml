# Svenska översättningar av katalogtexten (våg 7); stegtexterna kommer senare.
Timurid–Kara Koyunlu wars: Timuridisk-karakoyunluska krigen
? Shah Rukh’s three campaigns against the Kara Koyunlu (Black Sheep) Turkmen, who had taken Azerbaijan, Armenia and Iraq from the Timurids and the Jalayirids after Timur’s death. Qara Yusuf died in late 1420 as the first campaign began, and his sons fought over the succession. In 1421 Shah Rukh defeated Iskandar in a hard battle at Alashkert (Eleşkirt) and briefly occupied Tabriz, whose artists and calligraphers his son Baysunghur took to Herat. Iskandar won back Azerbaijan, and in 1429 Shah Rukh beat him again near Salmas and installed his brother Abu Said, whom Iskandar killed in 1431. A third campaign in 1434–1435 drove Iskandar out, and in 1436 Shah Rukh made another brother, Jahan Shah, ruler of Tabriz as his vassal; Iskandar was defeated by Jahan Shah and murdered by his own son at the fortress of Alinja. The Armenian chronicler Tovma Metsopetsi describes the wars as a catastrophe for Armenia, with towns sacked and many people carried off as slaves. After Shah Rukh’s death in 1447 Jahan Shah threw off Timurid rule.
: Shah Rukhs tre fälttåg mot turkmenerna i Kara Koyunlu (”svarta fåret”), som efter Timurs död hade tagit Azerbajdzjan, Armenien och Irak från timuriderna och jalayiriderna. Qara Yusuf dog i slutet av 1420 just som det första fälttåget inleddes, och hans söner stred om tronföljden. År 1421 besegrade Shah Rukh Iskandar i ett hårt slag vid Alashkert (Eleşkirt) och besatte en kort tid Tabriz, vars konstnärer och kalligrafer hans son Baysunghur förde med sig till Herat. Iskandar återvann Azerbajdzjan, och 1429 slog Shah Rukh honom på nytt nära Salmas och insatte hans bror Abu Said, som Iskandar dödade 1431. Ett tredje fälttåg 1434–1435 drev bort Iskandar, och 1436 gjorde Shah Rukh en annan bror, Jahan Shah, till härskare i Tabriz som sin vasall; Iskandar besegrades av Jahan Shah och mördades av sin egen son i fästningen Alinja. Den armeniske krönikören Tovma Metsopetsi beskriver krigen som en katastrof för Armenien, med plundrade städer och många människor bortförda som slavar. Efter Shah Rukhs död 1447 skakade Jahan Shah av sig det timuridiska styret.
