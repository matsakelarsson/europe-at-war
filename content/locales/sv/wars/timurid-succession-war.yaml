Timurid succession war: Timuridiska tronföljdskriget
The struggle among Timur’s sons and grandsons after his death at Otrar on 18 February 1405, on campaign against Ming China. His grandson Khalil Sultan seized Samarkand and the treasury; Pir Muhammad, the grandson Timur is said to have named as heir, was beaten by Khalil and murdered by one of his own nobles in 1407; and Timur’s youngest son, Shah Rukh, held Khorasan from Herat. In the west the Kara Koyunlu and the Jalayirids returned. Qara Yusuf beat Abu Bakr at Nakhchivan in October 1406 and on 20 April 1408 defeated and killed Miran Shah at Sardrud near Tabriz, ending Timurid rule in Azerbaijan. Khalil Sultan lost the support of his emirs in a famine, and Shah Rukh entered Samarkand unopposed on 13 May 1409. He gave it to his son Ulugh Beg and ruled the empire from Herat until 1447; Khalil was made governor of Ray, where he died in 1411.: Kampen mellan Timurs söner och sonsöner efter hans död i Otrar den 18 februari 1405, under ett fälttåg mot Mingdynastins Kina. Hans sonson Khalil Sultan bemäktigade sig Samarkand och skattkammaren; Pir Muhammad, den sonson som Timur enligt uppgift hade utsett till arvinge, besegrades av Khalil och mördades 1407 av en av sina egna stormän; och Timurs yngste son, Shah Rukh, behöll Khorasan med Herat som bas. I väster återvände Kara Koyunlu och jalayiriderna. Qara Yusuf slog Abu Bakr vid Nachitjevan i oktober 1406 och besegrade och dödade den 20 april 1408 Miran Shah vid Sardrud nära Tabriz, vilket gjorde slut på det timuridiska styret i Azerbajdzjan. Khalil Sultan förlorade sina emirers stöd under en hungersnöd, och Shah Rukh tågade utan motstånd in i Samarkand den 13 maj 1409. Han gav staden till sin son Ulugh Beg och styrde riket från Herat fram till 1447; Khalil blev guvernör i Ray, där han dog 1411.
