# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
Tivoli Incursion: Räden mot Tivoli Gardens
? The battle in West Kingston, Jamaica, in May 2010, when the security forces went into the Tivoli Gardens housing scheme to arrest Christopher “Dudus” Coke, wanted in the United States for drug and arms trafficking. Tivoli Gardens, built in the 1960s, was a stronghold of the Jamaica Labour Party (JLP) and part of Prime Minister Bruce Golding’s own constituency, and Coke, the leader of the Shower Posse, ruled it as a “don”, keeping order, giving out jobs and welfare and commanding armed men. The United States asked for his extradition in August 2009; Golding’s government resisted for nine months, arguing that the American evidence came from illegal wiretaps, and was found to have paid a US law firm, Manatt, Phelps & Phillips, to lobby in Washington on the case. Under mounting pressure Golding announced on 17 May 2010 that the extradition would go ahead. Coke’s supporters barricaded the approaches to Tivoli Gardens with vehicles, wire and explosives, and on 23 May gunmen attacked and burned police stations in West Kingston. The government declared a state of emergency in Kingston and St Andrew, and on 24 May more than 1,000 police of the Jamaica Constabulary Force and soldiers of the Jamaica Defence Force stormed the area; the army fired 37 mortar rounds into it, and a US surveillance aircraft filmed the operation, which the government at first denied. Coke was not found. In the fighting of the next few days more than 70 people were killed, nearly all of them civilians of West Kingston (the Public Defender counted 74 civilians and one soldier; other counts range from 73 to 77 dead), and more than 700 men were detained, most of them later released. Coke was arrested at a police checkpoint near Kingston on 22 June 2010 and extradited to New York on 24 June; he pleaded guilty to racketeering and assault charges and was sentenced in 2012 to 23 years in prison. The West Kingston Commission of Enquiry, chaired by Sir David Simmons, reported in June 2016 that the mortar fire was a serious error of judgement and named 15 people who may have been killed unlawfully by the police.
: "Striden i västra Kingston på Jamaica i maj 2010, när säkerhetsstyrkorna gick in i bostadsområdet Tivoli Gardens för att gripa Christopher ”Dudus” Coke, som var efterlyst i USA för narkotika- och vapensmuggling. Tivoli Gardens, byggt på 1960-talet, var ett fäste för Jamaica Labour Party (JLP) och en del av premiärminister Bruce Goldings egen valkrets, och Coke, ledare för Shower Posse, styrde området som ”don”: han upprätthöll ordningen, delade ut arbeten och understöd och förde befäl över beväpnade män. USA begärde hans utlämning i augusti 2009; Goldings regering gjorde motstånd i nio månader med argumentet att de amerikanska bevisen kom från olaglig telefonavlyssning, och det visade sig att den hade betalat en amerikansk advokatbyrå, Manatt, Phelps & Phillips, för att bedriva lobbying i Washington i ärendet. Under växande tryck meddelade Golding den 17 maj 2010 att utlämningen skulle genomföras. Cokes anhängare barrikaderade tillfarterna till Tivoli Gardens med fordon, ståltråd och sprängämnen, och den 23 maj angrep beväpnade män polisstationer i västra Kingston och satte eld på dem. Regeringen utlyste undantagstillstånd i Kingston och St Andrew, och den 24 maj stormade mer än 1 000 poliser ur Jamaica Constabulary Force och soldater ur Jamaica Defence Force området; armén avfyrade 37 granatkastargranater in i det, och ett amerikanskt spaningsflygplan filmade operationen, vilket regeringen först förnekade. Coke hittades inte. Under striderna de närmaste dagarna dödades mer än 70 människor, nästan alla civila från västra Kingston (den allmänna ombudsmannen, Public Defender, räknade 74 civila och en soldat; andra sammanräkningar varierar från 73 till 77 döda), och mer än 700 män greps, av vilka de flesta senare släpptes. Coke greps vid en polisspärr nära Kingston den 22 juni 2010 och utlämnades till New York den 24 juni; han erkände sig skyldig till anklagelser om organiserad brottslighet (racketeering) och misshandel och dömdes 2012 till 23 års fängelse. Undersökningskommissionen om västra Kingston, under ordförandeskap av Sir David Simmons, konstaterade i juni 2016 att granatkastarelden hade varit ett allvarligt omdömesfel och namngav 15 personer som kan ha dödats olagligt av polisen."
