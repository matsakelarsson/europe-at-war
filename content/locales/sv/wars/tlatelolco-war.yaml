# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
Tlatelolco War: Tlatelolcokriget
? "The war in which Tenochtitlan conquered Tlatelolco, its twin Mexica city on the north of the same island in Lake Texcoco. Tlatelolco had its own rulers and held the greatest market in central Mexico; it had fought beside Tenochtitlan against the Tepanecs but was not one of the three partners of the Triple Alliance. Its ruler Moquihuix was married to Chalchiuhnenetzin, the sister of Axayacatl, who had become ruler of Tenochtitlan in 1469. The sources give different causes: insults and fights between young nobles of the two cities in the market, a canal dug by Tlatelolco and filled in, and Moquihuix’s ill-treatment of his wife, who is said to have warned her brother that her husband was plotting war. According to the Dominican Diego Durán, a Tlatelolca night attack on Tenochtitlan was beaten off, and Axayacatl’s warriors then pushed into Tlatelolco and its market square. Moquihuix and his adviser Teconal took refuge on top of the great temple, where Axayacatl killed them, or, in the Codex Mendoza, Moquihuix threw himself down the steps. The chronicler Chimalpahin says the fighting lasted a year. Tlatelolco lost its dynasty and was ruled by military governors appointed from Tenochtitlan, and it paid tribute like a conquered town, though its people kept a separate identity. In 1521 Tlatelolco was the last part of the city to hold out against the Spaniards."
: "Det krig där Tenochtitlan erövrade sin tvillingstad Tlatelolco, den andra mexicastaden, på norra delen av samma ö i Texcocosjön. Tlatelolco hade egna härskare och den största marknaden i centrala Mexiko; staden hade stridit vid Tenochtitlans sida mot tepanekerna men var inte en av de tre parterna i trippelalliansen. Dess härskare Moquihuix var gift med Chalchiuhnenetzin, syster till Axayacatl, som hade blivit härskare i Tenochtitlan 1469. Källorna anger olika orsaker: förolämpningar och slagsmål mellan unga adelsmän från de båda städerna på marknaden, en kanal som Tlatelolco grävde och som fylldes igen, och Moquihuix dåliga behandling av sin hustru, som ska ha varnat sin bror för att hennes man planerade krig. Enligt dominikanen Diego Durán slogs ett nattligt anfall från Tlatelolco mot Tenochtitlan tillbaka, och Axayacatls krigare trängde därefter in i Tlatelolco och ut på dess marknadstorg. Moquihuix och hans rådgivare Teconal sökte skydd högst upp på det stora templet, där Axayacatl dödade dem, eller, enligt Codex Mendoza, kastade sig Moquihuix nedför trapporna. Krönikören Chimalpahin säger att striderna varade i ett år. Tlatelolco förlorade sin dynasti och styrdes av militära guvernörer som utsågs från Tenochtitlan, och staden betalade tribut som en erövrad stad, även om dess invånare behöll en egen identitet. År 1521 var Tlatelolco den del av staden som höll stånd längst mot spanjorerna."
