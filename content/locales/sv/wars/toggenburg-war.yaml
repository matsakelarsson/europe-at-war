Villmergerkrieg, Zweiter (Historical Dictionary of Switzerland, in German): Villmergerkrieg, Zweiter (Historisches Lexikon der Schweiz, på tyska)
Also called the Zwölferkrieg. Geneva, Neuchâtel and Biel supported Zürich and Bern, and the Valais the Catholic side; Basel, Schaffhausen, Fribourg, Solothurn, Glarus and Appenzell stayed neutral.: Kallas också Zwölferkrieg. Genève, Neuchâtel och Biel stödde Zürich och Bern, och Valais den katolska sidan; Basel, Schaffhausen, Fribourg, Solothurn, Glarus och Appenzell förblev neutrala.
The abbot regained the Toggenburg in the Peace of Baden in 1718. The Catholic cantons, angry at the loss of Baden, refused to meet there, and the Diet moved to Frauenfeld in 1713.: Abboten återfick Toggenburg genom freden i Baden 1718. De katolska kantonerna, som var förbittrade över förlusten av Baden, vägrade att sammanträda där, och dagsatsningen flyttade till Frauenfeld 1713.
