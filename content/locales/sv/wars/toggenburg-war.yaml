Toggenburg War (Second War of Villmergen): Toggenburgkriget (andra Villmergenkriget)
The last religious war of the old Swiss Confederacy, which grew out of a long dispute between the Prince-Abbot of St Gall and his mostly Protestant subjects in the Toggenburg valley. In April 1712 Zürich and Bern took the Toggenburgers’ side against the abbot, and the five Catholic cantons of central Switzerland joined him. The Protestant armies occupied the Thurgau and the abbey’s lands, took Mellingen, won at Bremgarten on 26 May and then took Baden. A first peace agreed at Aarau in July was rejected by the inner cantons, and on 25 July the Bernese decisively beat the Catholic army at Villmergen, where more than 3,000 men died. The Peace of Aarau of 11 August 1712 took the county of Baden and the lower Freie Ämter from the Catholic cantons, joining Zürich’s and Bern’s territories, and ended the Catholic majority’s control of the common lordships with equal rights for both faiths.: Det gamla schweiziska edsförbundets sista religionskrig, som växte fram ur en lång tvist mellan furstabboten i Sankt Gallen och hans till största delen protestantiska undersåtar i Toggenburgdalen. I april 1712 tog Zürich och Bern toggenburgarnas parti mot abboten, och de fem katolska kantonerna i Centralschweiz ställde sig på hans sida. De protestantiska arméerna ockuperade Thurgau och klostrets landområden, intog Mellingen, segrade vid Bremgarten den 26 maj och intog sedan Baden. En första fred som överenskommits i Aarau i juli förkastades av de inre kantonerna, och den 25 juli besegrade berneserna avgörande den katolska armén vid Villmergen, där mer än 3 000 man dog. Freden i Aarau den 11 augusti 1712 fråntog de katolska kantonerna grevskapet Baden och de nedre Freie Ämter, vilket förband Zürichs och Berns territorier, och gjorde slut på den katolska majoritetens kontroll över de gemensamma herradömena genom lika rättigheter för båda trosriktningarna.
