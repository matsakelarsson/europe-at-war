# Svenska översättningar av katalogtexten (våg 13); stegtexterna kommer senare.
Togoland campaign: Togolandfälttåget
? The British and French conquest of the German colony of Togoland in August 1914, the first Allied campaign of the First World War. Germany had ruled Togoland since 1884; its value to Berlin in 1914 lay in the new wireless station at Kamina, near Atakpamé, which linked Germany with its colonies, its warships and South America. The acting governor, Major Hans-Georg von Doering, had only about 1,500 police, reservists and levies, and offered neutrality, which Britain refused. French troops from Dahomey crossed the Mono on 6 August and took Aného; the British from the Gold Coast entered Lomé, which the Germans gave up without a fight, and advanced up the railway towards Kamina while smaller French and British columns closed in from the east, the west and the north. The German police delayed them at Agbeluvoe (15 August) and on the Khra river (22 August), then blew up the wireless masts and surrendered unconditionally on 26 August. Britain and France divided the colony between them; in 1922 it became the League of Nations mandates of British Togoland, which joined Ghana in 1957, and French Togoland, independent as Togo in 1960. The partition cut through the lands of the Ewe.
: Den brittiska och franska erövringen av den tyska kolonin Togoland i augusti 1914, de allierades första fälttåg under första världskriget. Tyskland hade styrt Togoland sedan 1884; dess värde för Berlin låg 1914 i den nya radiostationen i Kamina, nära Atakpamé, som förband Tyskland med dess kolonier, dess krigsfartyg och Sydamerika. Den tillförordnade guvernören, major Hans-Georg von Doering, hade bara omkring 1 500 poliser, reservister och uppbådade män och erbjöd neutralitet, vilket Storbritannien avvisade. Franska trupper från Dahomey gick över Mono den 6 augusti och intog Aného; britterna från Guldkusten tågade in i Lomé, som tyskarna övergav utan strid, och ryckte fram längs järnvägen mot Kamina medan mindre franska och brittiska kolonner närmade sig från öster, väster och norr. Den tyska polisen fördröjde dem vid Agbeluvoe (15 augusti) och vid floden Khra (22 augusti), sprängde sedan radiomasterna och kapitulerade villkorslöst den 26 augusti. Storbritannien och Frankrike delade kolonin mellan sig; 1922 blev den Nationernas förbunds mandat Brittiska Togoland, som gick upp i Ghana 1957, och Franska Togoland, som blev självständigt som Togo 1960. Delningen skar genom ewefolkets land.
