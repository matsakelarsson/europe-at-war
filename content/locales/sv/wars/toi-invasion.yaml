# Svenska översättningar av katalogtexten (våg 10); stegtexterna kommer senare.
Toi invasion: Toi-invasionen
? A raid on Tsushima, Iki and northern Kyushu by a fleet of about 50 ships, manned mostly by Jurchens from the north-east coast of the Korean peninsula, whom the Japanese called Toi, from a Korean word for the peoples to the east. From 5 May 1019 (the 28th day of the third month) the raiders plundered Tsushima and then Iki, where the governor and his 147 men were killed and the provincial temple was burned, and in mid-May the districts of Ito, Shima and Sawara in Chikuzen, carrying off people and killing cattle for food. They camped on Nokonoshima in Hakata Bay, but their attack on the guard post at Hakata was beaten off by warriors under Fujiwara no Takaie, the acting governor-general of the Dazaifu, and Ōkura no Taneki, and a landing at Matsuura in Hizen was repelled by local warriors. The Dazaifu counted 364 people killed and 1,280 carried off, and some 380 horses and cattle lost. Takaie forbade his pursuing ships to go beyond Tsushima into Korean waters. On their way home the raiders went on plundering the Korean coast until the Goryeo navy destroyed their fleet; about 270 Japanese captives were freed and sent back to Tsushima by a Goryeo envoy, Jeong Ja-ryang. The court in Kyoto at first took the raiders for Goryeo forces, and it learned who they were only from a Tsushima official who had crossed to Korea to look for his family.
: En räd mot Tsushima, Iki och norra Kyushu av en flotta på omkring 50 fartyg, bemannade mest av jurchener från Koreahalvöns nordöstra kust, som japanerna kallade toi, efter ett koreanskt ord för folken i öster. Från den 5 maj 1019 (den 28:e dagen i tredje månaden) plundrade angriparna Tsushima och sedan Iki, där guvernören och hans 147 man dödades och provinstemplet brändes, och i mitten av maj distrikten Ito, Shima och Sawara i Chikuzen, där de förde bort människor och slaktade boskap till föda. De slog läger på Nokonoshima i Hakatabukten, men deras angrepp på vaktposten i Hakata slogs tillbaka av krigare under Fujiwara no Takaie, tillförordnad generalguvernör i Dazaifu, och Ōkura no Taneki, och en landstigning vid Matsuura i Hizen avvärjdes av lokala krigare. Dazaifu räknade 364 dödade och 1 280 bortförda människor samt omkring 380 förlorade hästar och nötkreatur. Takaie förbjöd sina förföljande fartyg att segla bortom Tsushima in i koreanska farvatten. På hemvägen fortsatte angriparna att plundra den koreanska kusten tills Goryeos flotta förintade deras flotta; omkring 270 japanska fångar befriades och sändes tillbaka till Tsushima av ett sändebud från Goryeo, Jeong Ja-ryang. Hovet i Kyoto trodde först att angriparna var Goryeostyrkor och fick veta vilka de var först genom en ämbetsman från Tsushima som hade tagit sig över till Korea för att leta efter sin familj.
