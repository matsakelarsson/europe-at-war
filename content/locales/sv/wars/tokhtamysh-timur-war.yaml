Tokhtamysh–Timur war: Kriget mellan Tochtamysj och Timur
The war between Timur, master of Transoxiana and Iran, and Tokhtamysh, khan of the Golden Horde, whom Timur had helped to power a decade earlier. Tokhtamysh, who had reunited the Horde and sacked Moscow in 1382, claimed Azerbaijan and Khwarazm and resented Timur’s growing power. He attacked Timur’s army in Karabakh in 1387 and raided Transoxiana while Timur was in Iran. Timur answered with two great campaigns into the steppe. In 1391 he marched across the Kazakh steppe and defeated Tokhtamysh on the Kondurcha, near the Volga; in 1395 he crossed the Caucasus, defeated him again on the Terek, and then sacked the cities of the Golden Horde, from Tana on the Sea of Azov to Astrakhan and Sarai on the Volga. The Golden Horde never recovered its strength, and Tokhtamysh, overthrown by Edigu, died a fugitive in Siberia around 1406.: Kriget mellan Timur, herre över Transoxanien och Iran, och Tochtamysj, khan över Gyllene horden, som Timur ett decennium tidigare hade hjälpt till makten. Tochtamysj, som hade återförenat horden och plundrat Moskva 1382, gjorde anspråk på Azerbajdzjan och Khwarazm och såg med ovilja på Timurs växande makt. Han anföll Timurs armé i Karabach 1387 och gjorde räder in i Transoxanien medan Timur var i Iran. Timur svarade med två stora fälttåg ut på stäppen. År 1391 tågade han över den kazakiska stäppen och besegrade Tochtamysj vid Kondurtja, nära Volga; 1395 gick han över Kaukasus, besegrade honom på nytt vid Terek och plundrade sedan Gyllene hordens städer, från Tana vid Azovska sjön till Astrachan och Sarai vid Volga. Gyllene horden återfick aldrig sin styrka, och Tochtamysj, som störtades av Edigu, dog som flykting i Sibirien omkring 1406.
