# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
Toluid civil war: Toluidiska inbördeskriget
? The war of succession between two grandsons of Genghis Khan, the brothers Kublai and Ariq Böke, sons of Tolui, after the death of the Great Khan Möngke at the siege of Diaoyu in Sichuan in August 1259. Ariq Böke, left in charge at Karakorum, had the backing of most of Möngke’s family and court; Kublai, who commanded the armies in China, had himself elected Great Khan at Kaiping (later Shangdu) on 5 May 1260, and Ariq Böke was proclaimed at Karakorum a month later. Kublai’s generals won Gansu and the Hexi Corridor, and his blockade of grain from China starved Mongolia. Ariq Böke lost Karakorum twice, was beaten at Shimultai in 1261 and then fought Alghu, the Chagatayid khan he had installed, who had changed sides; his harsh rule in the Ili valley and famine cost him his followers, and on 21 August 1264 he surrendered to Kublai at Shangdu. The war left Kublai master of China and Mongolia, but the khans of the Golden Horde, the Chagatai lands and the house of Ögedei never fully accepted him, and the Mongol Empire was never again ruled as one.
: Tronföljdskriget mellan två av Djingis khans sonsöner, bröderna Khubilai och Ariq Böke, söner till Tolui, sedan storkhanen Möngke hade dött under belägringen av Diaoyu i Sichuan i augusti 1259. Ariq Böke, som hade lämnats som styresman i Karakorum, hade stöd av större delen av Möngkes familj och hov; Khubilai, som förde befälet över arméerna i Kina, lät välja sig till storkhan i Kaiping (senare Shangdu) den 5 maj 1260, och Ariq Böke utropades i Karakorum en månad senare. Khubilais fältherrar vann Gansu och Hexikorridoren, och hans blockad av spannmål från Kina svälte ut Mongoliet. Ariq Böke förlorade Karakorum två gånger, besegrades vid Shimultai 1261 och kämpade sedan mot Alghu, den tjagataidiske khan som han själv hade insatt men som hade bytt sida; hans hårda styre i Iliflodens dal och hungersnöd kostade honom hans anhängare, och den 21 augusti 1264 kapitulerade han inför Khubilai i Shangdu. Kriget gjorde Khubilai till herre över Kina och Mongoliet, men khanerna i Gyllene horden, i Tjagatais länder och i Ögedeis hus godtog honom aldrig helt, och Mongolriket styrdes aldrig mer som en enhet.
