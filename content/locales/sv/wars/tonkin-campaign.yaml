# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
French campaigns in Tonkin: Franska fälttågen i Tonkin
? The French conquest of Tonkin, the north of Nguyễn Vietnam (Đại Nam), in two attempts. In 1873 the naval officer Francis Garnier, sent from Saigon to settle a quarrel between the court and the arms trader Jean Dupuis over trade on the Red River, stormed the citadel of Hanoi and overran the delta, but he was killed by Liu Yongfu’s Black Flag Army outside Hanoi, and France withdrew under the treaty of 1874. In 1882 Henri Rivière took Hanoi again; his death at the Paper Bridge in May 1883 led France to send an expeditionary corps, attack Huế and force the court to accept a protectorate (August 1883). French armies took Sơn Tây from the Black Flags in December 1883 and Bắc Ninh and Hưng Hóa from the Chinese armies in Tonkin in March and April 1884, and the Treaty of Huế of June 1884 made the protectorate final. The clash with China that followed is told as the Sino-French War; after it the French fought local resistance across Tonkin and declared the country under control in April 1886, though fighting went on for another decade.
: Den franska erövringen av Tonkin, den norra delen av Nguyễndynastins Vietnam (Đại Nam), i två försök. År 1873 stormade sjöofficeren Francis Garnier, som hade sänts från Saigon för att bilägga en tvist mellan hovet och vapenhandlaren Jean Dupuis om handeln på Röda floden, citadellet i Hanoi och erövrade deltat, men han dödades utanför Hanoi av Svarta flaggornas armé under Liu Yongfu, och Frankrike drog sig tillbaka enligt fördraget 1874. År 1882 intog Henri Rivière Hanoi på nytt; hans död vid Pappersbron i maj 1883 fick Frankrike att sända en expeditionskår, angripa Huế och tvinga hovet att godta ett protektorat (augusti 1883). Franska arméer tog Sơn Tây från Svarta flaggorna i december 1883 och Bắc Ninh och Hưng Hóa från de kinesiska arméerna i Tonkin i mars och april 1884, och fördraget i Huế i juni 1884 gjorde protektoratet slutgiltigt. Den konflikt med Kina som följde skildras här som fransk-kinesiska kriget; därefter bekämpade fransmännen lokalt motstånd över hela Tonkin och förklarade landet under kontroll i april 1886, även om striderna fortsatte i ytterligare ett årtionde.
