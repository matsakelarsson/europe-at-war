# Svenska översättningar av katalogtexten (våg 13); stegtexterna kommer senare.
Torodbe revolution in Futa Toro: Torodberevolutionen i Futa Toro
? The Islamic revolution that overthrew the Denianke kings of Futa Toro, in the middle Senegal valley, set up an imamate ruled by elected clerics of the Torodbe class, and carried its wars to the neighbouring Moorish emirates and Wolof kingdoms. The Denianke had lost the support of the farmers of the valley by failing to protect them from raids by the nomads north of the river. From about 1769 the cleric Sulayman Bal led a movement against them, and in 1776 the Torodbe drove them from power; Sulayman Bal was killed in battle that year, and the Torodbe chose as first almami (imam) Abdul Kader Kan, a teacher and judge who had studied in Cayor and Mauritania. Ruling from Thilogne, he defeated the Brakna Moors, fought the last Denianke satigi, Sule Bubu Gayssiri, in western Futa until Sule’s death, defeated the buurba of Jolof in 1785 and, allied with the Brakna, defeated the Trarza near Dagana in 1786, killing their emir Ali Kouri. The new state banned the slave trade on its stretch of the river, and in 1785 the French at Saint-Louis agreed to stop buying Muslim slaves and to pay customs to Futa. Cayor and Waalo at first accepted Abdul Kader’s authority, but Amari Ngoone Ndella, damel of Cayor from 1790, broke with him and crushed a rising of Cayor’s clerics, selling many into slavery. In 1796 Abdul Kader, allied with Jolof, invaded Cayor with what was said to be the largest army ever seen in Senegambia; the damel poisoned the wells of his eastern provinces, and at Bungoy (Bunxoy) the exhausted Futa army was routed and Abdul Kader captured. Amari Ngoone treated him with honour and sent him home once Futa had chosen a new almami. The revolution’s expansion ended there; Abdul Kader was killed in 1806 in a war with Bundu and Kaarta.
: Den islamiska revolution som störtade deniankekungarna i Futa Toro, i mellersta Senegaldalen, upprättade ett imamat styrt av valda religiösa lärde ur torodbeklassen och förde sina krig in i de angränsande moriska emiraten och wolofrikena. Denianke hade förlorat stödet från dalens bönder genom att inte skydda dem mot räder från nomaderna norr om floden. Från omkring 1769 ledde den lärde Sulayman Bal en rörelse mot dem, och 1776 drev torodbe dem från makten; Sulayman Bal stupade samma år, och torodbe valde till förste almami (imam) Abdul Kader Kan, en lärare och domare som hade studerat i Cayor och Mauretanien. Med Thilogne som säte besegrade han braknamorerna, stred mot den siste deniankiske satigin, Sule Bubu Gayssiri, i västra Futa fram till Sules död, besegrade Jolofs buurba 1785 och besegrade, i allians med brakna, trarza nära Dagana 1786, varvid deras emir Ali Kouri dödades. Den nya staten förbjöd slavhandeln på sin del av floden, och 1785 gick fransmännen i Saint-Louis med på att sluta köpa muslimska slavar och att betala tull till Futa. Cayor och Waalo erkände till en början Abdul Kaders myndighet, men Amari Ngoone Ndella, damel av Cayor från 1790, bröt med honom och krossade en resning bland Cayors lärde, av vilka många såldes som slavar. År 1796 invaderade Abdul Kader, i allians med Jolof, Cayor med vad som sades vara den största armé som någonsin skådats i Senegambien; damelen förgiftade brunnarna i sina östra provinser, och vid Bungoy (Bunxoy) slogs den utmattade armén från Futa på flykten och Abdul Kader tillfångatogs. Amari Ngoone behandlade honom med heder och sände hem honom när Futa hade valt en ny almami. Där tog revolutionens expansion slut; Abdul Kader dödades 1806 i ett krig mot Bundu och Kaarta.
