Torstenson War: Torstenssonska kriget
A war in which Sweden, in the middle of the Thirty Years’ War, attacked Denmark–Norway from Germany and from Sweden. By the Peace of Brömsebro in 1645 Denmark–Norway lost Gotland, Ösel, Jämtland and Härjedalen, handed over Halland for 30 years and freed Swedish ships from the Sound Dues.: Ett krig där Sverige, mitt under trettioåriga kriget, anföll Danmark–Norge från Tyskland och från Sverige. Genom freden i Brömsebro 1645 förlorade Danmark–Norge Gotland, Ösel, Jämtland och Härjedalen, överlämnade Halland för 30 år och befriade svenska fartyg från Öresundstullen.
