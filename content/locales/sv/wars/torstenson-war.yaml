In the middle of the German war Sweden turned on Denmark–Norway. Torstenson overran Jutland from the south in December 1643 and January 1644, Gustav Horn invaded Scania, and a Swedish-Dutch fleet destroyed the Danish navy off Fehmarn in October 1644. Bremen and Verden were occupied in 1645.: Mitt under det tyska kriget vände sig Sverige mot Danmark–Norge. Torstensson överrände Jylland söderifrån i december 1643 och januari 1644, Gustav Horn invaderade Skåne, och en svensk-nederländsk flotta förintade den danska flottan vid Femern i oktober 1644. Bremen och Verden ockuperades 1645.
At the Peace of Brömsebro on 13 August 1645, Denmark–Norway gave up Gotland, Ösel, Jämtland, Härjedalen, Idre and Särna, handed over Halland for 30 years, and freed Swedish ships from the Sound Dues.: Vid freden i Brömsebro den 13 augusti 1645 avstod Danmark–Norge Gotland, Ösel, Jämtland, Härjedalen, Idre och Särna, överlämnade Halland för 30 år och befriade svenska fartyg från Öresundstullen.
