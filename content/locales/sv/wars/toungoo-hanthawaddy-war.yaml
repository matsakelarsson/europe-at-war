# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
Toungoo–Hanthawaddy War: Kriget mellan Toungoo och Hanthawaddy
"The war in which the small Burmese kingdom of Toungoo, in the Sittaung valley, conquered Hanthawaddy, the larger and richer Mon-speaking kingdom of Lower Burma, and began the second unification of Burma. Toungoo’s young king Tabinshwehti and his general and brother-in-law, later known as Bayinnaung, raided Pegu without success in three dry seasons from 1534. In 1538 a ruse led King Takayutpi to execute his best ministers; he then abandoned Pegu, and Bayinnaung destroyed his retreating army at Naungyo. Tabinshwehti made Pegu his capital, won over the Mon lords and hired Portuguese gunners, and in May 1541, after a seven-month siege, took and sacked the port of Martaban, whose viceroy had held out with Portuguese help. This entry also tells in brief the wars that followed until 1547: the conquest of Prome (1542) against armies sent by Ava, the Confederation of Shan States and Arakan; Toungoo’s advance to Pagan (1544); and the failed invasion of Arakan, where Mrauk U held out in January 1547.": "Kriget där det lilla burmesiska kungariket Toungoo i Sittaungdalen erövrade Hanthawaddy, det större och rikare monspråkiga kungariket i Nedre Burma, och inledde Burmas andra enande. Toungoos unge kung Tabinshwehti och hans general och svåger, sedermera känd som Bayinnaung, gjorde från 1534 under tre torrperioder fruktlösa räder mot Pegu. År 1538 fick en list kung Takayutpi att avrätta sina bästa ministrar; han övergav sedan Pegu, och Bayinnaung förintade hans retirerande armé vid Naungyo. Tabinshwehti gjorde Pegu till sin huvudstad, vann över monernas stormän och värvade portugisiska artillerister, och i maj 1541 intog och plundrade han efter en sju månader lång belägring hamnstaden Martaban, vars vicekung hade hållit stånd med portugisisk hjälp. Denna post berättar också i korthet om de krig som följde fram till 1547: erövringen av Prome (1542) mot arméer som sänts av Ava, Shanstaternas konfederation och Arakan; Toungoos frammarsch till Pagan (1544); och den misslyckade invasionen av Arakan, där Mrauk U höll stånd i januari 1547."
