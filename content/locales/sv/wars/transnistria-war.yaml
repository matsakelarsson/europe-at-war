Transnistria is shown as part of Moldova on the map, as it is internationally recognised. Casualty figures differ between Moldovan, Transnistrian and Russian sources.: Transnistrien visas på kartan som en del av Moldavien, i enlighet med det internationella erkännandet. Uppgifterna om antalet döda skiljer sig mellan moldaviska, transnistriska och ryska källor.
Fighting had begun on a small scale at Dubăsari in November 1990; the war is usually dated from 2 March 1992.: Striderna hade börjat i liten skala vid Dubăsari i november 1990; kriget brukar dateras från den 2 mars 1992.
