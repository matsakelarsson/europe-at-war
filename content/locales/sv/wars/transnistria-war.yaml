Transnistria War: Transnistrienkriget
In September 1990 leaders on the left bank of the Dniester, where many people were Russian or Ukrainian speakers wary of Moldova’s moves towards Romania, proclaimed the Pridnestrovian Moldavian Republic. Clashes began that November and grew into war in March 1992, with fighting around Dubăsari and the bridgeheads over the river and, worst of all, in Bender (Tighina) on 19–21 June. Cossack and other volunteers from Russia and Ukraine joined the separatists, and the Russian 14th Army, stationed in the region, armed them; after its new commander, Alexander Lebed, arrived, its artillery struck Moldovan forces near Bender on 3 July, in effect ending the fighting. About 1,000 people were killed. A ceasefire signed by Boris Yeltsin and Mircea Snegur on 21 July 1992 created joint peacekeeping forces, and Transnistria has stayed outside Moldovan control, recognised by no member of the United Nations.: I september 1990 utropade ledare på Dnestrs vänstra strand, där många var rysk- eller ukrainsktalande och misstrodde Moldaviens närmande till Rumänien, Pridnestroviska moldaviska republiken. Sammanstötningar började i november samma år och växte till krig i mars 1992, med strider kring Dubăsari och brohuvudena över floden och, värst av allt, i Bender (Tighina) den 19–21 juni. Kosacker och andra frivilliga från Ryssland och Ukraina anslöt sig till separatisterna, och den ryska 14:e armén, som var förlagd i regionen, beväpnade dem; sedan dess nye befälhavare Aleksandr Lebed anlänt slog dess artilleri till mot moldaviska styrkor nära Bender den 3 juli, vilket i praktiken avslutade striderna. Omkring 1 000 människor dödades. En vapenvila som undertecknades av Boris Jeltsin och Mircea Snegur den 21 juli 1992 inrättade gemensamma fredsbevarande styrkor, och Transnistrien har förblivit utanför moldavisk kontroll, utan erkännande från någon av FN:s medlemsstater.
