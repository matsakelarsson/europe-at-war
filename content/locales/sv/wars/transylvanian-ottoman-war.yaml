Transylvanian–Ottoman War (1658–1662): Transsylvansk-osmanska kriget (1658–1662)
? The war in which the Ottoman Empire crushed the attempts of George II Rákóczi and then John Kemény to free the Principality of Transylvania from Ottoman control. Rákóczi’s unauthorised invasion of Poland in 1657 ended in disaster, and the grand vizier Köprülü Mehmed Pasha ordered him deposed. When he refused to go, an Ottoman and Crimean Tatar army invaded in 1658; the Tatars ravaged the country, burning Gyulafehérvár (Alba Iulia) and carrying off many thousands of people, and the Ottomans annexed Jenő and the districts of Lugos and Karánsebes and installed Ákos Barcsay as prince. Rákóczi fought on, but in May 1660 he was defeated near Gyalu (Szászfenes) and died of his wounds at Várad on 7 June. The Ottomans besieged Várad, the key fortress of eastern Hungary, which surrendered on 27 August 1660 and became the seat of a new province. John Kemény, elected prince on 1 January 1661, declared Transylvania’s break with the Porte and asked Vienna for help; Leopold I sent Raimondo Montecuccoli, but the imperial troops did little and withdrew. The Ottomans installed Michael I Apafi as prince, and Kemény was killed in battle at Nagyszőllős in January 1662. Transylvania survived as a smaller, poorer Ottoman vassal, and the conflict led directly to the Austro-Turkish War of 1663–1664.
: Kriget där Osmanska riket krossade först Georg II Rákóczis och sedan János Keménys försök att frigöra furstendömet Transsylvanien från osmansk kontroll. Rákóczis egenmäktiga invasion av Polen 1657 slutade i katastrof, och storvesiren Köprülü Mehmed pasha beordrade att han skulle avsättas. När han vägrade att avgå invaderade en osmansk och krimtatarisk armé 1658; tatarerna härjade landet, brände Gyulafehérvár (Alba Iulia) och förde bort många tusen människor, och osmanerna annekterade Jenő samt distrikten Lugos och Karánsebes och insatte Ákos Barcsay som furste. Rákóczi fortsatte att kämpa, men i maj 1660 besegrades han nära Gyalu (Szászfenes) och dog av sina sår i Várad den 7 juni. Osmanerna belägrade Várad, östra Ungerns viktigaste fästning, som kapitulerade den 27 augusti 1660 och blev säte för en ny provins. János Kemény, som valdes till furste den 1 januari 1661, förklarade att Transsylvanien bröt med Höga porten och bad Wien om hjälp; Leopold I sände Raimondo Montecuccoli, men de kejserliga trupperna uträttade föga och drog sig tillbaka. Osmanerna insatte Mihály I Apafi som furste, och Kemény stupade i strid vid Nagyszőllős i januari 1662. Transsylvanien överlevde som en mindre och fattigare osmansk vasallstat, och konflikten ledde direkt till österrikisk-turkiska kriget 1663–1664.
