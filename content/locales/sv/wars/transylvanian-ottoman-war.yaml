Dates are Gregorian. Sources differ by a day on the date of Kemény’s death (22 or 23 January 1662) and give different dates in May 1660 for the battle near Gyalu.: Datum anges enligt den gregorianska kalendern. Källorna skiljer sig åt med en dag om datumet för Keménys död (22 eller 23 januari 1662) och anger olika datum i maj 1660 för slaget nära Gyalu.
Transylvanian politics in these years were split between Rákóczi and Kemény on one side and princes backed by the Ottomans, Francis Rhédey, Ákos Barcsay and Michael Apafi, on the other. Rákóczi’s Polish campaign of 1657 belongs to the Second Northern War, which has its own entry.: Transsylvansk politik under dessa år var splittrad mellan Rákóczi och Kemény på ena sidan och furstar som stöddes av osmanerna, Ferenc Rhédey, Ákos Barcsay och Mihály Apafi, på den andra. Rákóczis polska fälttåg 1657 hör till andra nordiska kriget, som har en egen artikel.
