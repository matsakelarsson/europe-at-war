# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
Trịnh–Nguyễn war: Kriget mellan Trịnh och Nguyễn
The intermittent war between the two families that ruled Đại Việt in the name of the powerless Lê emperors, the Trịnh lords in the north (Đàng Ngoài, known to Europeans as Tonkin) and the Nguyễn lords in the south (Đàng Trong, or Cochinchina). When the Nguyễn refused to send taxes and accept orders from the Trịnh-controlled court, Trịnh Tráng sent an army south in 1627. Over the next 45 years the Trịnh, with a much larger population, attacked seven times across the narrow coastal plain of Quảng Bình, but were held by the Nguyễn walls designed by Đào Duy Từ near Đồng Hới and by the Nguyễn’s cannon, made with Portuguese help; the Dutch East India Company, allied to the Trịnh, lost a warship at the Gianh River in 1643. A Nguyễn counter-offensive in 1655 reached Nghệ An before it was driven back. After a last failed Trịnh assault in 1672 the two sides made a truce with the Gianh River as the border. It held for a hundred years, while the Nguyễn expanded south into Champa and the Mekong delta.: Det periodvisa kriget mellan de två släkter som styrde Đại Việt i de maktlösa Lêkejsarnas namn, Trịnhfurstarna i norr (Đàng Ngoài, för européerna känt som Tonkin) och Nguyễnfurstarna i söder (Đàng Trong, eller Cochinkina). När Nguyễn vägrade att sända skatter och ta emot order från det Trịnhkontrollerade hovet sände Trịnh Tráng en armé söderut 1627. Under de följande 45 åren anföll Trịnh, med en mycket större befolkning, sju gånger över den smala kustslätten i Quảng Bình, men hejdades av de murar nära Đồng Hới som Đào Duy Từ hade utformat åt Nguyễn och av Nguyễns kanoner, som tillverkats med portugisisk hjälp; Nederländska ostindiska kompaniet, som var allierat med Trịnh, förlorade ett krigsskepp vid floden Gianh 1643. En motoffensiv från Nguyễn 1655 nådde Nghệ An innan den drevs tillbaka. Efter ett sista misslyckat anfall från Trịnh 1672 slöt de båda sidorna en vapenvila med floden Gianh som gräns. Den höll i hundra år, medan Nguyễn expanderade söderut in i Champa och Mekongdeltat.
