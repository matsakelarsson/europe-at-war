Tripartite Struggle: Trepartskampen
The long contest of the three great powers of India for Kannauj, the old imperial city on the Ganges, from the late 8th to the early 10th century. The Gurjara-Pratiharas of Malwa and Rajasthan, the Palas of Bengal and Bihar and the Rashtrakutas of the Deccan each took or controlled the city in turn. The Rashtrakuta kings Dhruva and Govinda III raided as far as the Ganges and went home again; the Pala king Dharmapala put his own candidate on the throne of Kannauj; and in about 816 the Pratihara Nagabhata II took the city and made it his capital, which it stayed for two centuries. A last great Rashtrakuta raid under Indra III sacked Kannauj in about 916. The struggle exhausted all three and left room for the regional kingdoms that followed.: Den långa kampen mellan Indiens tre stormakter om Kannauj, den gamla kejsarstaden vid Ganges, från slutet av 700-talet till början av 900-talet. Gurjara-pratiharadynastin i Malwa och Rajasthan, paladynastin i Bengalen och Bihar och rashtrakutadynastin i Deckan intog eller behärskade staden i tur och ordning. Rashtrakutakungarna Dhruva och Govinda III gjorde räder ända till Ganges och vände sedan hem igen; palakungen Dharmapala satte sin egen kandidat på Kannaujs tron; och omkring 816 intog pratiharakungen Nagabhata II staden och gjorde den till sin huvudstad, vilket den förblev i två sekel. En sista stor rashtrakutaräd under Indra III plundrade Kannauj omkring 916. Kampen uttömde alla tre och gav utrymme åt de regionala kungariken som följde.
