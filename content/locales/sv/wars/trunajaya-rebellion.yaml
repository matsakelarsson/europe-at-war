# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
Trunajaya rebellion: Trunajayaupproret
? "A rebellion against King Amangkurat I of Mataram, led by Trunajaya, a prince of Madura, and joined by Makassarese fighters who had left South Sulawesi after the Makassar War, by the spiritual lord of Giri and by Javanese nobles weary of the king’s cruelty. Raids on the north coast of Java from 1674 grew into open war: in 1676 a rebel army of about 9,000 crossed from Madura, routed the royal army at Gegodog near Tuban and took most of the north coast. In 1677 the Dutch East India Company (VOC), called in by Mataram, took Surabaya from Trunajaya, but the rebels took and plundered the royal capital, Plered; Amangkurat I died in flight, and his son Amangkurat II bought the Company’s help with sweeping concessions. Company troops, Bugis under Arung Palakka and Javanese levies took Trunajaya’s new capital, Kediri, in November 1678; Trunajaya surrendered in December 1679 and was stabbed to death by Amangkurat II in January 1680, and the last rebels at Giri were crushed in April. Amangkurat II built a new capital at Kartasura with a Company garrison beside his palace: Mataram survived, but the Company had become the arbiter of Javanese politics."
: "Ett uppror mot kung Amangkurat I av Mataram under ledning av Trunajaya, en prins från Madura; till honom slöt sig makassariska krigare som hade lämnat södra Sulawesi efter Makassarkriget, den andlige herren i Giri och javanesiska stormän som hade tröttnat på kungens grymhet. Räder mot Javas nordkust från 1674 växte till öppet krig: 1676 gick en rebellarmé på omkring 9 000 man över från Madura, slog den kungliga armén på flykten vid Gegodog nära Tuban och intog större delen av nordkusten. År 1677 tog Nederländska ostindiska kompaniet (VOC), som Mataram hade kallat in, Surabaya från Trunajaya, men rebellerna intog och plundrade den kungliga huvudstaden Plered; Amangkurat I dog under flykten, och hans son Amangkurat II köpte kompaniets hjälp med långtgående eftergifter. Kompanitrupper, buginer under Arung Palakka och javanesiska uppbåd intog Trunajayas nya huvudstad Kediri i november 1678; Trunajaya kapitulerade i december 1679 och stacks ihjäl av Amangkurat II i januari 1680, och de sista rebellerna i Giri krossades i april. Amangkurat II byggde en ny huvudstad i Kartasura med en kompanigarnison bredvid sitt palats: Mataram överlevde, men kompaniet hade blivit skiljedomare i javanesisk politik."
