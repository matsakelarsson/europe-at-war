# Svenska översättningar av katalogtexten (våg 12); stegtexterna kommer senare.
Tuareg capture of Timbuktu: Tuaregernas intagande av Timbuktu
? The end of Malian rule in Timbuktu and the town’s decades under the Maghsharen Tuareg. As Mali weakened in the early fifteenth century, Tuareg of the Maghsharen confederation under their chief Akil ag Malwal raided the country around Timbuktu year after year. The townspeople did not take up arms, and the Malian officials withdrew; according to the Tarikh al-Sudan, Akil took the town about 1433 and was its master for forty years. The Tuareg went on living in their tents and moving with their herds outside the town, which they governed through the Timbuktu-koi, the Sanhaja notable Muhammad Naddi, who had held the office under Mali and kept it, with all administrative and financial powers, under its new overlords. He built the mosque of Sidi Yahya and made his friend Sidi Yahya al-Tadilsi its imam. The Tarikh says Akil’s rule turned harsh in its last years, with houses broken into and women assaulted, and that he took the third of the taxes that by custom went to the Timbuktu-koi. Muhammad Naddi’s son and successor Ammar then secretly invited Sonni Ali of Gao to take the town. When Songhai horsemen appeared on the Gourma bank of the Niger, Akil fled to Walata with many of the scholars of Sankore, and Sonni Ali entered Timbuktu in January 1468 (see “Sonni Ali’s conquests”). The Tuareg chiefs’ authority, the chronicle notes, had never reached beyond the river.
: Slutet för det maliska styret i Timbuktu och stadens årtionden under maghsharentuaregerna. När Mali försvagades i början av 1400-talet plundrade tuareger ur maghsharenförbundet under sin hövding Akil ag Malwal trakten kring Timbuktu år efter år. Stadsborna grep inte till vapen, och de maliska ämbetsmännen drog sig tillbaka; enligt Tarikh al-Sudan intog Akil staden omkring 1433 och var dess herre i fyrtio år. Tuaregerna fortsatte att bo i sina tält och flytta med sina hjordar utanför staden, som de styrde genom Timbuktu-koi, sanhajanotabeln Muhammad Naddi, som hade innehaft ämbetet under Mali och behöll det, med alla administrativa och finansiella befogenheter, under de nya överherrarna. Han byggde Sidi Yahya-moskén och gjorde sin vän Sidi Yahya al-Tadilsi till dess imam. Enligt Tarikh blev Akils styre hårt under dess sista år, med inbrott i hus och övergrepp mot kvinnor, och han tog den tredjedel av skatterna som enligt sedvänja tillföll Timbuktu-koi. Muhammad Naddis son och efterträdare Ammar bjöd då i hemlighet in Sonni Ali av Gao att inta staden. När songhaiska ryttare visade sig på Gourmasidan av Niger flydde Akil till Walata med många av de lärda från Sankore, och Sonni Ali tågade in i Timbuktu i januari 1468 (se ”Sonni Alis erövringar”). Tuareghövdingarnas myndighet, noterar krönikan, hade aldrig nått bortom floden.
