# Svenska översättningar av katalogtexten (våg 12); stegtexterna kommer senare.
Tuareg rebellion of 1990–1995: Tuaregrebellionen 1990–1995
? Rebellions of Tuareg, and in Mali also Arab, movements against the governments of Mali and Niger in the early 1990s. The droughts of 1973–1974 and 1984–1985 destroyed the herds on which the nomads of the Sahara’s southern edge lived, and many young men left for Algeria and Libya, where some served in Muammar Gaddafi’s Islamic Legion. When they came back at the end of the 1980s to poverty and suspicion, a raid on the post at Tchin-Tabaraden in Niger in May 1990 brought army reprisals that killed hundreds of Tuareg civilians, and in June an attack on Ménaka opened the war in Mali. Algeria brokered the Tamanrasset accords in January 1991, and after a coup in Bamako Mali signed a National Pact with the rebel movements in April 1992, promising a special status for the north, the integration of fighters and development. Fighting flared again in 1994, when the Songhai militia Ganda Koy and the rebels killed civilians of each other’s communities, before local peace meetings ended it; the weapons of the Malian war were burned in Timbuktu on 27 March 1996. In Niger the government signed a peace accord with the Tuareg movements in Ouagadougou on 24 April 1995. More than 2,500 people were killed. New rebellions broke out in both countries in 2006–2009.
: Rebellioner av tuaregiska, och i Mali även arabiska, rörelser mot Malis och Nigers regeringar i början av 1990-talet. Torkperioderna 1973–1974 och 1984–1985 förstörde de hjordar som nomaderna vid Saharas södra rand levde av, och många unga män drog till Algeriet och Libyen, där en del tjänade i Muammar Gaddafis Islamiska legion. När de i slutet av 1980-talet kom tillbaka till fattigdom och misstänksamhet ledde en räd mot posteringen i Tchin-Tabaraden i Niger i maj 1990 till repressalier från armén som dödade hundratals tuaregiska civila, och i juni inledde ett anfall mot Ménaka kriget i Mali. Algeriet förmedlade Tamanrassetavtalen i januari 1991, och efter en kupp i Bamako undertecknade Mali i april 1992 Nationella pakten med rebellrörelserna, som utlovade särskild status för norra Mali, integrering av de stridande och utveckling. Striderna blossade upp igen 1994, när songhaimilisen Ganda Koy och rebellerna dödade civila ur varandras folkgrupper, innan lokala fredsmöten gjorde slut på dem; vapnen från kriget i Mali brändes i Timbuktu den 27 mars 1996. I Niger undertecknade regeringen ett fredsavtal med de tuaregiska rörelserna i Ouagadougou den 24 april 1995. Mer än 2 500 människor dödades. Nya rebellioner bröt ut i båda länderna 2006–2009.
