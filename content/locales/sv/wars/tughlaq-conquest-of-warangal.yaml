# Svenska översättningar av katalogtexten (våg 8); stegtexterna kommer senare.
Tughlaq conquest of Warangal: Tughlaqdynastins erövring av Warangal
? The campaigns that ended the Kakatiya kingdom of Telangana and made it a province of the Delhi Sultanate. The Kakatiya king Prataparudra had been a tributary of Delhi since Malik Kafur’s siege of Warangal in 1310. When he stopped paying, Sultan Qutb al-Din Mubarak Shah sent his general Khusrau Khan, who besieged Warangal in 1318 and forced Prataparudra to hand over 100 elephants, 12,000 horses and treasure and to give up five districts. Under the new Tughluq dynasty the tribute again stopped, and Ghiyath al-Din Tughluq sent his son Ulugh Khan, the future Muhammad bin Tughluq. His first siege of Warangal broke up when a false rumour of the sultan’s death set off a revolt in his camp, and the Kakatiya army chased him back to Devagiri. Within months he returned, took the outlying forts of Badrikot and Bodhan and, after a siege of about five months, forced Prataparudra to surrender in 1323. The king was sent towards Delhi as a prisoner and died on the way, probably by his own hand on the banks of the Narmada. Delhi’s rule in Telangana lasted only until 1336, when Kapaya Nayaka drove out its governor.
: De fälttåg som gjorde slut på kakatiyariket i Telangana och gjorde det till en provins i Delhisultanatet. Kakatiyakungen Prataparudra hade varit tributskyldig till Delhi sedan Malik Kafurs belägring av Warangal 1310. När han slutade betala sände sultan Qutb al-Din Mubarak Shah sin general Khusrau Khan, som belägrade Warangal 1318 och tvingade Prataparudra att lämna ut 100 elefanter, 12 000 hästar och skatter och att avstå fem distrikt. Under den nya tughluqdynastin upphörde tributen igen, och Ghiyath al-Din Tughluq sände sin son Ulugh Khan, den blivande Muhammad bin Tughluq. Hans första belägring av Warangal upplöstes när ett falskt rykte om sultanens död utlöste ett uppror i hans läger, och kakatiyaarmén jagade honom tillbaka till Devagiri. Inom några månader återvände han, intog de yttre fästena Badrikot och Bodhan och tvingade efter en belägring på omkring fem månader Prataparudra att kapitulera 1323. Kungen sändes som fånge mot Delhi och dog på vägen, troligen för egen hand vid Narmadas strand. Delhis välde i Telangana varade bara till 1336, då Kapaya Nayaka drev ut dess guvernör.
