# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
Tumu crisis: Tumukrisen
? The Oirat invasion of Ming China in 1449, in which the Zhengtong Emperor was captured. Esen, the Oirat taishi who had made himself master of the Mongolian steppe, attacked the Ming frontier in July 1449 after quarrels over the tribute trade and a refused marriage alliance. Urged on by the eunuch Wang Zhen, the 22-year-old emperor led a hastily gathered army out of Beijing, marched to Datong and turned back, and on 1 September 1449 his army was surrounded and destroyed at the post station of Tumu, about 90 km north-west of Beijing. Wang Zhen and many of the highest officials were killed and the emperor was taken prisoner. In Beijing the minister of war Yu Qian refused to abandon the capital, the emperor’s half-brother was enthroned as the Jingtai Emperor, and when Esen came to the walls in October 1449 he was beaten back within five days. Esen released the former emperor in September 1450, gaining little from his victory. No territory changed hands, but the defeat ended Ming campaigns on the steppe and turned the dynasty to defending the frontier with walls.
: Oiraternas invasion av Mingriket 1449, under vilken Zhengtongkejsaren tillfångatogs. Esen, den oiratiske taishi som hade gjort sig till herre över den mongoliska stäppen, angrep Mingrikets gräns i juli 1449 efter tvister om tributhandeln och en avvisad äktenskapsallians. Påhejad av eunucken Wang Zhen ledde den 22-årige kejsaren en hastigt samlad armé ut från Peking, marscherade till Datong och vände om, och den 1 september 1449 omringades och förintades hans armé vid poststationen Tumu, omkring 90 km nordväst om Peking. Wang Zhen och många av de högsta ämbetsmännen dödades och kejsaren togs till fånga. I Peking vägrade krigsministern Yu Qian att överge huvudstaden, kejsarens halvbror insattes på tronen som Jingtaikejsaren, och när Esen kom fram till murarna i oktober 1449 slogs han tillbaka inom fem dagar. Esen släppte den förre kejsaren i september 1450 och vann föga på sin seger. Inga landområden bytte ägare, men nederlaget gjorde slut på Mingrikets fälttåg på stäppen och fick dynastin att i stället försvara gränsen med murar.
