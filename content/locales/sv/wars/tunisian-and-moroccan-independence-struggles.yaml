# Svenska översättningar av katalogtexten (våg 12); stegtexterna kommer senare.
Armed struggles for Tunisian and Moroccan independence: Den väpnade kampen för Tunisiens och Marockos självständighet
? The armed phase of the independence movements in the French protectorates of Tunisia and Morocco. In Tunisia the arrest of Habib Bourguiba and other leaders of the Neo-Destour party on 18 January 1952 set off strikes, riots and a harsh French sweep of Cap Bon, and armed bands, the fellaghas, took to the hills of the centre and south. The murder of the trade union leader Farhat Hached on 5 December 1952 by La Main Rouge, a secret group linked to French intelligence, brought protests across North Africa. By 1954 several thousand fellaghas were in the field, and in October 1954 they defeated a French force at Tamerza; after the French prime minister Pierre Mendès France promised internal autonomy in his Carthage speech of 31 July 1954, many of them handed in their arms in late 1954 under an agreement with the French. In Morocco, France deposed Sultan Mohammed V on 20 August 1953 and exiled him to Corsica and Madagascar, which turned the nationalist movement into an urban armed resistance of bombings and assassinations, answered by settler counter-terror. On 20 August 1955 risings at Oued Zem and in the Khouribga mining region killed dozens of Europeans and were followed by reprisals that killed far more Moroccans, and on 1–2 October 1955 the Moroccan Army of Liberation attacked French posts on the edge of the Rif. France brought Mohammed V back on 16 November 1955. Morocco became independent on 2 March 1956, with the Spanish zone following on 7 April, and Tunisia on 20 March 1956; the war in Algeria went on until 1962.
: Den väpnade fasen av självständighetsrörelserna i de franska protektoraten Tunisien och Marocko. I Tunisien utlöste gripandet av Habib Bourguiba och andra ledare för Neo-Destourpartiet den 18 januari 1952 strejker, upplopp och en hårdhänt fransk razzia på Kap Bon, och väpnade grupper, fellagha, gick upp i bergen i landets centrala och södra delar. Mordet på fackföreningsledaren Farhat Hached den 5 december 1952, begånget av La Main Rouge, en hemlig grupp med kopplingar till den franska underrättelsetjänsten, väckte protester i hela Nordafrika. År 1954 var flera tusen fellagha i fält, och i oktober 1954 besegrade de en fransk styrka vid Tamerza; sedan den franske premiärministern Pierre Mendès France hade utlovat inre självstyre i sitt Karthagotal den 31 juli 1954 lämnade många av dem in sina vapen i slutet av 1954 enligt en överenskommelse med fransmännen. I Marocko avsatte Frankrike sultan Mohammed V den 20 augusti 1953 och förvisade honom till Korsika och Madagaskar, vilket förvandlade den nationalistiska rörelsen till ett väpnat motstånd i städerna med bombattentat och mord, som nybyggarna besvarade med motterror. Den 20 augusti 1955 dödade resningar i Oued Zem och i gruvdistriktet kring Khouribga dussintals européer och följdes av repressalier som dödade betydligt fler marockaner, och den 1–2 oktober 1955 anföll Marockanska befrielsearmén franska posteringar i utkanten av Rif. Frankrike lät Mohammed V återvända den 16 november 1955. Marocko blev självständigt den 2 mars 1956, följt av den spanska zonen den 7 april, och Tunisien den 20 mars 1956; kriget i Algeriet fortsatte till 1962.
