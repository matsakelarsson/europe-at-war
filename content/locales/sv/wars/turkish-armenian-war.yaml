Turkish–Armenian War: Turkisk-armeniska kriget
A war in the autumn of 1920 in which the army of the Turkish nationalist government in Ankara, under Kâzım Karabekir, invaded the Republic of Armenia, took Sarıkamış, Kars and Alexandropol (now Gyumri) and killed tens of thousands of Armenian civilians. In the Treaty of Alexandropol, signed on the night of 2–3 December 1920 as Armenia’s government handed power to the Bolsheviks, Armenia gave up Kars and its claims under the Treaty of Sèvres, and the Treaty of Kars of October 1921 confirmed the new border.: Ett krig hösten 1920 där den turkiska nationalistregeringens armé i Ankara under Kâzım Karabekir invaderade Republiken Armenien, intog Sarıkamış, Kars och Aleksandropol (i dag Gjumri) och dödade tiotusentals armeniska civila. Genom fördraget i Aleksandropol, som undertecknades natten mellan den 2 och 3 december 1920 samtidigt som Armeniens regering överlämnade makten till bolsjevikerna, avstod Armenien från Kars och från sina anspråk enligt Sèvresfreden, och fördraget i Kars i oktober 1921 bekräftade den nya gränsen.
