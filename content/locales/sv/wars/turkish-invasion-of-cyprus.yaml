The second Geneva conference broke down on 14 August, when the Turkish side demanded an immediate answer on separate zones and the Greek Cypriot and Greek delegations asked for time. Within hours the Turkish army attacked east and west. It took Famagusta on 15–16 August and Morphou in the west, and by the ceasefire of 16 August, with a few later advances, held about 36 per cent of the island. The ceasefire line became the United Nations buffer zone, the Green Line, running through the centre of Nicosia.: Den andra Genèvekonferensen bröt samman den 14 augusti, när den turkiska sidan krävde ett omedelbart svar om åtskilda zoner och de grekcypriotiska och grekiska delegationerna bad om betänketid. Inom några timmar anföll den turkiska armén österut och västerut. Den intog Famagusta den 15–16 augusti och Morfou i väster, och vid vapenvilan den 16 augusti höll den, med några senare framstötar, omkring 36 procent av ön. Vapenvilelinjen blev FN:s buffertzon, gröna linjen, som löper genom centrala Nicosia.
About 150,000 Greek Cypriots fled or were driven from the north, and over the following year about 60,000 Turkish Cypriots moved there from the south. Civilians were killed on both sides. Turkish Cypriot villagers at Maratha, Santalaris, Aloda and Tochni were massacred by EOKA-B, while Greek Cypriot civilians and prisoners were killed by Turkish troops and Turkish Cypriot fighters. Varosha, the modern quarter of Famagusta, was fenced off and left empty. The north declared itself the Turkish Republic of Northern Cyprus in 1983, recognised only by Turkey, and the island remains divided.: Omkring 150 000 grekcyprioter flydde eller fördrevs från norr, och under det följande året flyttade omkring 60 000 turkcyprioter dit från söder. Civila dödades på båda sidor. Turkcypriotiska bybor i Maratha, Santalaris, Aloda och Tochni massakrerades av EOKA-B, medan grekcypriotiska civila och fångar dödades av turkiska trupper och turkcypriotiska kämpar. Varosha, Famagustas moderna stadsdel, inhägnades och lämnades tom. Norra delen utropade sig 1983 till Turkiska republiken Nordcypern, erkänd endast av Turkiet, och ön är fortfarande delad.
