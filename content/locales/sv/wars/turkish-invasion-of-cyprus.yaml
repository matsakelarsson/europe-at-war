Turkish invasion of Cyprus: Turkiska invasionen av Cypern
Turkey’s military intervention in Cyprus in July and August 1974, five days after a coup backed by the Greek junta had overthrown President Makarios. In two offensives the Turkish army took about 36 per cent of the island in the north; some 150,000 Greek Cypriots and later about 60,000 Turkish Cypriots were uprooted, and the ceasefire line, patrolled by the United Nations, has divided the island ever since.: Turkiets militära intervention på Cypern i juli och augusti 1974, fem dagar efter att en kupp med stöd av den grekiska juntan hade störtat president Makarios. Genom två offensiver tog den turkiska armén omkring 36 procent av ön i norr; omkring 150 000 grekcyprioter och senare omkring 60 000 turkcyprioter rycktes upp från sina hem, och vapenvilelinjen, som patrulleras av FN, har delat ön sedan dess.
