National Guard and EOKA-B (the coup): Nationalgardet och EOKA-B (kuppen)
Before dawn on 20 July Turkish troops landed on a beach west of Kyrenia, while paratroopers dropped into the Turkish Cypriot enclave north of Nicosia. The National Guard and the Greek army contingent on the island fought back, and a Turkish destroyer was sunk by Turkish aircraft by mistake. Elsewhere Greek Cypriot forces overran Turkish Cypriot quarters and villages and took thousands of Turkish Cypriot men prisoner. When a ceasefire called for by the United Nations took hold on 22 July, Turkish forces held Kyrenia and a corridor to Nicosia, about 3 per cent of the island.: Före gryningen den 20 juli landsteg turkiska trupper på en strand väster om Kyrenia, medan fallskärmsjägare hoppade ned i den turkcypriotiska enklaven norr om Nicosia. Nationalgardet och den grekiska armékontingenten på ön gjorde motstånd, och en turkisk jagare sänktes av misstag av turkiska flygplan. På andra håll intog grekcypriotiska styrkor turkcypriotiska kvarter och byar och tog tusentals turkcypriotiska män till fånga. När en vapenvila som FN begärt trädde i kraft den 22 juli höll turkiska styrkor Kyrenia och en korridor till Nicosia, omkring 3 procent av ön.
The crisis brought down the junta in Athens, which handed power to civilians on 23 July, and Konstantinos Karamanlis returned from exile to lead Greece. In Cyprus, Sampson resigned and Glafcos Clerides became acting president. Britain, Greece and Turkey, the three guarantor powers, met in Geneva, but the Turkish army went on widening its bridgehead, and the Turkish Cypriot leadership pressed for a federation of two separate zones.: Krisen fällde juntan i Aten, som lämnade över makten till civila den 23 juli, och Konstantinos Karamanlis återvände från exilen för att leda Grekland. På Cypern avgick Sampson och Glafkos Klerides blev tillförordnad president. Storbritannien, Grekland och Turkiet, de tre garantimakterna, möttes i Genève, men den turkiska armén fortsatte att utvidga sitt brohuvud, och den turkcypriotiska ledningen drev kravet på en federation av två åtskilda zoner.
