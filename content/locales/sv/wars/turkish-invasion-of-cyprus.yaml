Turkey calls the operation the Cyprus Peace Operation and cites its rights as a guarantor under the Treaty of Guarantee of 1960; the Republic of Cyprus, Greece and the United Nations Security Council regard the continuing presence of Turkish troops in the north as an occupation. The Turkish Republic of Northern Cyprus, declared in 1983, is recognised only by Turkey.: Turkiet kallar operationen Fredsoperationen på Cypern och åberopar sina rättigheter som garantimakt enligt garantifördraget från 1960; Republiken Cypern, Grekland och FN:s säkerhetsråd betraktar den fortsatta närvaron av turkiska trupper i norr som en ockupation. Turkiska republiken Nordcypern, som utropades 1983, är erkänd endast av Turkiet.
The base map shows Cyprus as one state, as it is internationally recognised; the Turkish-held north and the ceasefire line are shown as areas.: Baskartan visar Cypern som en stat, i enlighet med det internationella erkännandet; den turkiskkontrollerade norra delen och vapenvilelinjen visas som områden.
Civilians were killed on both sides. The Committee on Missing Persons in Cyprus lists about 1,500 Greek Cypriots and 500 Turkish Cypriots missing from 1963–1964 and 1974, many of whom have since been identified from remains.: Civila dödades på båda sidor. Kommittén för försvunna personer på Cypern förtecknar omkring 1 500 grekcyprioter och 500 turkcyprioter som försvann 1963–1964 och 1974, av vilka många sedan har identifierats utifrån kvarlevor.
Greek Cypriot and Greek moves: Grekcypriotiska och grekiska trupprörelser
Greek Cypriot and Greek success: Grekcypriotiska och grekiska framgångar
Since the violence of 1963–1964, Turkish Cypriots had lived largely in armed enclaves, watched over by a United Nations force. President Makarios had given up enosis, union with Greece, as an aim, and the military junta in Athens backed the underground EOKA-B against him. On 2 July 1974 Makarios demanded that Greece withdraw the Greek officers who commanded the Cypriot National Guard. On 15 July the National Guard, led by those officers, attacked the presidential palace in Nicosia and seized the radio station and other key points across the island.: Sedan våldsamheterna 1963–1964 hade turkcyprioterna till stor del levt i beväpnade enklaver, övervakade av en FN-styrka. President Makarios hade övergett enosis, förening med Grekland, som mål, och militärjuntan i Aten stödde den underjordiska EOKA-B mot honom. Den 2 juli 1974 krävde Makarios att Grekland skulle dra tillbaka de grekiska officerare som förde befäl över Cyperns nationalgarde. Den 15 juli angrep nationalgardet, lett av dessa officerare, presidentpalatset i Nicosia och intog radiostationen och andra viktiga punkter över hela ön.
Makarios escaped through the back of the burning palace to Paphos, where he broadcast that he was alive; the British flew him out from their base at Akrotiri the next day. The coup leaders made Nikos Sampson, a former EOKA gunman known for his hostility to the Turkish Cypriots, president. Fighting between the coup forces and Makarios’s supporters killed many Greek Cypriots, with estimates ranging from about a hundred to several hundred. Turkey called the coup a step towards annexation by Greece, and when Britain declined to act with it, prepared to invade.: Makarios flydde genom baksidan av det brinnande palatset till Pafos, där han i en radiosändning meddelade att han levde; britterna flög ut honom från sin bas i Akrotiri dagen därpå. Kuppledarna gjorde Nikos Sampson, en före detta EOKA-skytt känd för sin fientlighet mot turkcyprioterna, till president. Strider mellan kuppstyrkorna och Makarios anhängare dödade många grekcyprioter; uppskattningarna varierar från omkring hundra till flera hundra. Turkiet betecknade kuppen som ett steg mot annektering av Grekland och förberedde en invasion när Storbritannien avböjde att agera tillsammans med Turkiet.
