# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
Tuscarora War: Tuscarorakriget
? "A war in North Carolina between the colony and the southern Tuscarora and their allies. The Tuscarora, an Iroquoian-speaking people of the coastal plain, had lost land to colonists, most recently to the Swiss and German settlers of New Bern, and many of their people had been kidnapped and sold as slaves. In September 1711 the southern Tuscarora under Hancock, with the Coree, Pamlico, Neuse, Bear River, Machapunga and other peoples, executed the surveyor John Lawson and attacked the farms along the Neuse, Trent and Pamlico rivers, killing well over a hundred colonists, while the northern Tuscarora under Tom Blount stayed out of the war. South Carolina sent two armies made up mostly of Native allies: John Barnwell’s in 1712, mainly Yamasee, and James Moore Jr.’s in 1712–1713, with many Cherokee and Catawba. In March 1713 Moore stormed the Tuscarora fort of Neoheroka, where about 950 people were killed or captured and sold into slavery. Most of the southern Tuscarora moved north and were accepted into the Haudenosaunee Confederacy as its sixth nation in about 1722; those who stayed received a reservation on the Roanoke River."
: "Ett krig i North Carolina mellan kolonin och de södra tuscarora och deras allierade. Tuscarora, ett irokesisktalande folk på kustslätten, hade förlorat land till kolonister, senast till de schweiziska och tyska nybyggarna i New Bern, och många av dem hade kidnappats och sålts som slavar. I september 1711 avrättade de södra tuscarora under Hancock, tillsammans med coree, pamlico, neuse, Bear River, machapunga och andra folk, lantmätaren John Lawson och anföll gårdarna längs floderna Neuse, Trent och Pamlico, där de dödade långt över hundra kolonister, medan de norra tuscarora under Tom Blount höll sig utanför kriget. South Carolina sände två arméer som till största delen bestod av ursprungsamerikanska allierade: John Barnwells 1712, huvudsakligen yamasee, och James Moore den yngres 1712–1713, med många cherokeser och catawba. I mars 1713 stormade Moore tuscarorafortet Neoheroka, där omkring 950 människor dödades eller tillfångatogs och såldes som slavar. De flesta av de södra tuscarora flyttade norrut och togs omkring 1722 upp i Haudenosauneeförbundet som dess sjätte nation; de som stannade fick ett reservat vid Roanokefloden."
Southern Tuscarora and their allies (Coree, Pamlico, Neuse, Bear River, Machapunga, Mattamuskeet): Södra tuscarora och deras allierade (coree, pamlico, neuse, Bear River, machapunga, mattamuskeet)
