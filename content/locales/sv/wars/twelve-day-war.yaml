Twelve-Day War: Tolvdagarskriget
? A war between Israel and Iran in June 2025, which the United States joined with strikes on Iran’s nuclear sites. After decades of shadow war, the two states had exchanged direct missile and air attacks twice in 2024. On 13 June 2025, the day after the International Atomic Energy Agency’s board found Iran in breach of its non-proliferation obligations, Israel launched a surprise air campaign against Iran’s nuclear facilities, missile forces and military leadership, killing the chief of staff of the armed forces, the commander of the Revolutionary Guards and at least ten nuclear scientists. Iran answered with more than 550 ballistic missiles and some 1,000 drones fired at Israel, most of which were intercepted, while Israeli aircraft struck targets across Iran. On 22 June American B-2 bombers struck the enrichment sites at Fordow and Natanz and the nuclear centre at Isfahan. After Iran fired missiles at a US air base in Qatar, President Donald Trump announced a ceasefire, which took effect on 24 June. Iran’s government reported about 1,060 dead and an Iranian human rights group about 1,190; in Israel 33 people were killed.
: Ett krig mellan Israel och Iran i juni 2025, som USA gick in i med angrepp mot Irans kärntekniska anläggningar. Efter årtionden av skuggkrig hade de två staterna två gånger under 2024 utväxlat direkta robot- och flyganfall. Den 13 juni 2025, dagen efter att Internationella atomenergiorganets styrelse hade funnit att Iran bröt mot sina åtaganden om icke-spridning, inledde Israel en överraskande flygkampanj mot Irans kärntekniska anläggningar, robotstyrkor och militära ledning och dödade de väpnade styrkornas stabschef, Revolutionsgardets befälhavare och minst tio kärnforskare. Iran svarade med att avfyra mer än 550 ballistiska robotar och omkring 1 000 drönare mot Israel, av vilka de flesta sköts ned, medan israeliska flygplan angrep mål över hela Iran. Den 22 juni angrep amerikanska B-2-bombplan anrikningsanläggningarna i Fordow och Natanz och kärnteknikcentret i Isfahan. Sedan Iran hade avfyrat robotar mot en amerikansk flygbas i Qatar tillkännagav president Donald Trump ett eldupphör, som trädde i kraft den 24 juni. Irans regering rapporterade omkring 1 060 döda och en iransk människorättsorganisation omkring 1 190; i Israel dödades 33 människor.
