Tyrolean Rebellion: Tyrolska upproret
A rising of the people of Tyrol, ceded to Bavaria in 1805, against Bavarian and French rule during Austria’s war with Napoleon in 1809. Led by the innkeeper Andreas Hofer and helped at first by Austrian troops, the insurgents won battles on the Bergisel above Innsbruck and held most of Tyrol for months, but after the Peace of Schönbrunn left Tyrol to Bavaria they were defeated in November; Hofer was captured and shot at Mantua in February 1810, and Tyrol was divided between Bavaria, Napoleon’s Kingdom of Italy and the Illyrian Provinces.: Ett uppror bland befolkningen i Tyrolen, som hade avträtts till Bayern 1805, mot bayerskt och franskt styre under Österrikes krig mot Napoleon 1809. Under ledning av värdshusvärden Andreas Hofer och till en början med hjälp av österrikiska trupper vann upprorsmännen slag på Bergisel ovanför Innsbruck och höll större delen av Tyrolen i flera månader, men sedan freden i Schönbrunn lämnat Tyrolen åt Bayern besegrades de i november; Hofer tillfångatogs och arkebuserades i Mantua i februari 1810, och Tyrolen delades mellan Bayern, Napoleons kungarike Italien och Illyriska provinserna.
