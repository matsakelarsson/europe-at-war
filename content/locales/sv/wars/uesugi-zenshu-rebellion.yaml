# Svenska översättningar av katalogtexten (våg 10); stegtexterna kommer senare.
Uesugi Zenshū’s Rebellion: Uesugi Zenshūs uppror
? A revolt in the Kantō against Ashikaga Mochiuji, the Kamakura kubō, who governed eastern Japan for the shogunate from Kamakura. Uesugi Ujinori, known by his Buddhist name Zenshū, of the Inukake branch of the Uesugi, had served as Mochiuji’s deputy (Kantō kanrei) since 1411, but after a quarrel in council in 1415 he was dismissed and replaced by Uesugi Norimoto of the rival Yamanouchi branch. Zenshū allied with Mochiuji’s uncle Ashikaga Mitsutaka and his adopted son Mochinaka and won over many eastern houses, among them the Takeda of Kai, the Chiba, the Iwamatsu and the Nasu. On the night of the 2nd day of the tenth month of 1416 they rose in Kamakura and took the city; Mochiuji and Norimoto escaped, Mochiuji to Suruga. The shogun Ashikaga Yoshimochi chose to back his kinsman Mochiuji and sent Imagawa Norimasa of Suruga, Uesugi Fusakata of Echigo and other lords against the rebels. Zenshū beat the Edo and Toshima of Musashi, who had turned against him, at Seyagahara on New Year’s Day 1417, but as the Imagawa army advanced into Sagami his support fell away. On the 10th day of the first month of 1417 Zenshū, Mitsutaka and Mochinaka took their own lives at Yukinoshita in Kamakura, by the Tsurugaoka Hachimangū shrine. Mochiuji then spent years punishing the rebels’ allies, among them houses that the shogunate protected, and his relations with Kyoto never recovered; the quarrel led to the Eikyō Rebellion of 1438.
: En revolt i Kantō mot Ashikaga Mochiuji, Kamakura kubō, som styrde östra Japan för shogunatets räkning från Kamakura. Uesugi Ujinori, känd under sitt buddhistiska namn Zenshū, av Inukakegrenen av Uesugi, hade tjänat som Mochiujis ställföreträdare (Kantō kanrei) sedan 1411, men efter ett gräl i rådet 1415 avsattes han och ersattes av Uesugi Norimoto av den rivaliserande Yamanouchigrenen. Zenshū allierade sig med Mochiujis farbror Ashikaga Mitsutaka och dennes adoptivson Mochinaka och vann över många hus i öster, bland dem Takeda i Kai, Chiba, Iwamatsu och Nasu. Natten den 2:a dagen i tionde månaden 1416 reste de sig i Kamakura och intog staden; Mochiuji och Norimoto flydde, Mochiuji till Suruga. Shogunen Ashikaga Yoshimochi valde att stödja sin släkting Mochiuji och sände Imagawa Norimasa från Suruga, Uesugi Fusakata från Echigo och andra herrar mot rebellerna. Zenshū slog Edo och Toshima från Musashi, som hade vänt sig mot honom, vid Seyagahara på nyårsdagen 1417, men när Imagawas armé ryckte fram in i Sagami föll hans stöd bort. Den 10:e dagen i första månaden 1417 tog Zenshū, Mitsutaka och Mochinaka sina liv i Yukinoshita i Kamakura, vid helgedomen Tsurugaoka Hachimangū. Mochiuji ägnade sedan flera år åt att straffa rebellernas allierade, bland dem hus som shogunatet beskyddade, och hans förbindelser med Kyoto återhämtade sig aldrig; tvisten ledde till Eikyōupproret 1438.
