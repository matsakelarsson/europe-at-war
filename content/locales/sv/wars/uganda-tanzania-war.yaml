# Svenska översättningar av katalogtexten (våg 13); stegtexterna kommer senare.
Uganda–Tanzania War: Kriget mellan Uganda och Tanzania
? The war between Idi Amin’s Uganda and Julius Nyerere’s Tanzania that ended with the fall of Amin. Relations had been hostile since Amin overthrew Milton Obote in 1971 and Obote took refuge in Tanzania. In October 1978 Ugandan troops, amid unrest in their own army, crossed the border, and on 30 October about 3,000 of them invaded the Kagera Salient, the Tanzanian land between the border and the Kagera River, killing some 1,500 civilians; on 1 November Amin announced its annexation. Nyerere declared war, mobilised the Tanzania People’s Defence Force (TPDF), which grew from under 40,000 to over 150,000, and drove the Ugandans out of Kagera by January 1979. With Ugandan exile forces, among them Obote’s supporters and Yoweri Museveni’s FRONASA, the TPDF then invaded Uganda, took and razed Masaka and Mbarara in February, and on 10–11 March defeated a Ugandan, Libyan and Palestinian force at Lukaya, the largest battle of the war; Muammar Gaddafi had sent about 4,500 Libyan troops to save Amin, and the PLO a few hundred fighters. While the exiles formed the Uganda National Liberation Front (UNLF) at Moshi, the Tanzanians took Entebbe on 7 April and Kampala on 10–11 April 1979; Amin fled to Libya and later Saudi Arabia, and the UNLF’s Yusuf Lule became president. Tanzanian forces reached the Sudanese border on 3 June. Tanzania lost 373 soldiers, 96 of them in combat, and about 1,500 civilians; about 1,000 Ugandan soldiers and at least 600 Libyans were killed. Numbers of Ugandan civilian deaths are uncertain; revenge killings by Ugandan rebels in the north and west were widespread. The war cost Tanzania between $500 million and $1 billion, and its troops stayed in Uganda until 1981, while Uganda slid into the Bush War.
: Kriget mellan Idi Amins Uganda och Julius Nyereres Tanzania, som slutade med Amins fall. Förbindelserna hade varit fientliga sedan Amin störtade Milton Obote 1971 och Obote tog sin tillflykt till Tanzania. I oktober 1978 gick ugandiska trupper, under oroligheter i den egna armén, över gränsen, och den 30 oktober invaderade omkring 3 000 av dem Kagerautbuktningen, det tanzaniska området mellan gränsen och Kagerafloden, och dödade omkring 1 500 civila; den 1 november meddelade Amin att området annekterats. Nyerere förklarade krig, mobiliserade Tanzanias folkförsvarsstyrka (TPDF), som växte från under 40 000 till över 150 000 man, och hade i januari 1979 drivit ut ugandierna ur Kagera. Med ugandiska exilstyrkor, bland dem Obotes anhängare och Yoweri Musevenis FRONASA, invaderade TPDF sedan Uganda, intog och jämnade Masaka och Mbarara med marken i februari och besegrade den 10–11 mars en ugandisk, libysk och palestinsk styrka vid Lukaya i krigets största slag; Muammar Gaddafi hade sänt omkring 4 500 libyska soldater för att rädda Amin, och PLO några hundra kämpar. Medan exilgrupperna bildade Ugandas nationella befrielsefront (UNLF) i Moshi intog tanzanierna Entebbe den 7 april och Kampala den 10–11 april 1979; Amin flydde till Libyen och senare till Saudiarabien, och UNLF:s Yusuf Lule blev president. Tanzaniska styrkor nådde den sudanesiska gränsen den 3 juni. Tanzania förlorade 373 soldater, varav 96 i strid, och omkring 1 500 civila; omkring 1 000 ugandiska soldater och minst 600 libyer dödades. Antalet döda ugandiska civila är osäkert; hämndmord utförda av ugandiska rebeller i norr och väster var utbredda. Kriget kostade Tanzania mellan 500 miljoner och 1 miljard dollar, och dess trupper stannade i Uganda till 1981, medan Uganda gled in i buskriget.
