# Svenska översättningar av katalogtexten (våg 13); stegtexterna kommer senare.
Ugandan Bush War: Buskriget i Uganda
? The civil war in Uganda between the governments of Milton Obote and, from July 1985, Tito Okello, with their Uganda National Liberation Army (UNLA), and several rebel groups, above all Yoweri Museveni’s National Resistance Army (NRA), which won it in January 1986. After Tanzania and Ugandan exiles overthrew Idi Amin in 1979, Obote returned to power in disputed elections in December 1980. Former Amin soldiers had already risen in West Nile in October 1980, and the UNLA’s reprisals there drove some 250,000 people into exile. Museveni, who said the elections had been rigged, began a guerrilla war on 6 February 1981 with an attack on Kabamba barracks; his Popular Resistance Army merged with Yusuf Lule’s fighters into the National Resistance Movement and its army, with its base in the Luwero Triangle north of Kampala. The UNLA, advised by North Korean officers, fought the NRA there with massacres, looting and the forced removal of hundreds of thousands of civilians into camps, notably in Operation Bonanza from June 1983. After Acholi officers under Bazilio Olara-Okello and Tito Okello overthrew Obote in July 1985, the NRA refused a power-sharing deal signed in Nairobi in December, took Masaka and Mbarara and entered Kampala on 26 January 1986; Museveni was sworn in as president on 29 January, and the NRA took the north in March. Estimates of the dead range from about 100,000 to 500,000, most of them civilians; the International Committee of the Red Cross estimated in 1985 that the Obote government was responsible for more than 300,000 civilian deaths since 1980. The NRA also committed abuses and used child soldiers, the kadogo. The defeated northern soldiers formed new rebel groups, among them those that led to the Lord’s Resistance Army.
: Inbördeskriget i Uganda mellan Milton Obotes och, från juli 1985, Tito Okellos regeringar med deras Ugandas nationella befrielsearmé (UNLA) och flera rebellgrupper, framför allt Yoweri Musevenis Nationella motståndsarmén (NRA), som vann kriget i januari 1986. Sedan Tanzania och ugandiska exilgrupper hade störtat Idi Amin 1979 återkom Obote till makten i omstridda val i december 1980. Tidigare soldater ur Amins armé hade redan rest sig i West Nile i oktober 1980, och UNLA:s repressalier där drev omkring 250 000 människor i exil. Museveni, som hävdade att valen hade riggats, inledde ett gerillakrig den 6 februari 1981 med ett anfall mot Kabambakasernen; hans Folkets motståndsarmé gick samman med Yusuf Lules kämpar i Nationella motståndsrörelsen och dess armé, med bas i Luwerotriangeln norr om Kampala. UNLA, med nordkoreanska officerare som rådgivare, bekämpade NRA där med massakrer, plundring och tvångsförflyttning av hundratusentals civila till läger, särskilt i Operation Bonanza från juni 1983. Sedan acholiofficerare under Bazilio Olara-Okello och Tito Okello hade störtat Obote i juli 1985 vägrade NRA godta en överenskommelse om maktdelning som undertecknades i Nairobi i december, intog Masaka och Mbarara och ryckte in i Kampala den 26 januari 1986; Museveni svors in som president den 29 januari, och NRA tog norra Uganda i mars. Uppskattningarna av antalet döda varierar från omkring 100 000 till 500 000, de flesta civila; Internationella rödakorskommittén uppskattade 1985 att Obotes regering var ansvarig för mer än 300 000 civila dödsfall sedan 1980. Även NRA begick övergrepp och använde barnsoldater, kadogo. De besegrade nordliga soldaterna bildade nya rebellgrupper, bland dem de som ledde fram till Herrens motståndsarmé.
