# Svenska översättningar av katalogtexten (våg 12); stegtexterna kommer senare.
Umar Tall’s jihad: Umar Talls jihad
? The holy war of al-Hajj Umar Tall, a Tijani scholar from Futa Toro on the Senegal, which in twelve years built the largest state of the western Sudan, the Umarian or Toucouleur Empire. From his community at Dinguiraye, in the hills east of Futa Jallon, Umar declared jihad after the king of Tamba attacked him in September 1852. He conquered Bambuk and the Khasso kingdoms in 1854 and the Bamana kingdom of Kaarta in 1855, making its capital Nioro his own. When he turned west towards his homeland on the Senegal he met the French of Governor Louis Faidherbe, who had built a fort at Médine; Umar besieged it from April to July 1857 and failed, and after recruiting thousands of emigrants in Futa Toro he left the Senegal valley to the French. In 1860–1861 he conquered the Bamana kingdom of Ségou, and in May 1862, after the battle of Cayawal, the Fulbe Caliphate of Hamdullahi in Massina, a Muslim state whose overthrow he had to justify in writing. Massina rose against him in 1863 under Ba Lobbo and the Kunta scholar Ahmad al-Bakkay; Umar was besieged in Hamdullahi, broke out in February 1864 and died in the cliffs of Degembere near Bandiagara. His son Ahmadu ruled from Ségou and his nephew Tidiani from Bandiagara until the French conquest of 1890–1893. Umar is remembered in Senegal as a reformer and a resister of the French, and in parts of Mali as a conqueror whose wars of booty and captives devastated the middle Niger.
: Det heliga krig som fördes av al-Hajj Umar Tall, en tijanitisk lärd från Futa Toro vid Senegalfloden, och som på tolv år byggde upp den största staten i västra Sudan, det umariska riket eller Toucouleurriket. Från sin gemenskap i Dinguiraye, i bergen öster om Futa Jallon, utropade Umar jihad sedan kungen av Tamba hade angripit honom i september 1852. Han erövrade Bambuk och khassorikena 1854 och bambarariket Kaarta 1855 och gjorde dess huvudstad Nioro till sin egen. När han vände västerut mot sitt hemland vid Senegalfloden mötte han fransmännen under guvernör Louis Faidherbe, som hade byggt ett fort i Médine; Umar belägrade det från april till juli 1857 utan framgång, och sedan han hade rekryterat tusentals utvandrare i Futa Toro lämnade han Senegaldalen åt fransmännen. Åren 1860–1861 erövrade han bambarariket Ségou och i maj 1862, efter slaget vid Cayawal, fulbekalifatet Hamdullahi i Massina, en muslimsk stat vars störtande han måste rättfärdiga i skrift. Massina reste sig mot honom 1863 under Ba Lobbo och Ahmad al-Bakkay, en lärd ur kunta; Umar belägrades i Hamdullahi, bröt sig ut i februari 1864 och dog i klippbranterna vid Degembere nära Bandiagara. Hans son Ahmadu styrde från Ségou och hans brorson Tidiani från Bandiagara fram till den franska erövringen 1890–1893. I Senegal minns man Umar som reformator och motståndsman mot fransmännen, och i delar av Mali som en erövrare vars krig för byte och fångar ödelade området kring mellersta Niger.
