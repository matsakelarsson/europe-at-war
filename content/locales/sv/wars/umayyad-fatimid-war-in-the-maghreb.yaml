# Svenska översättningar av katalogtexten (våg 12); stegtexterna kommer senare.
Umayyad–Fatimid struggle for the Maghreb: Kampen mellan umayyader och fatimider om Maghreb
? "Seventy years of war by proxy between the two rival caliphates of the west, the Ismaili Fatimids of Ifriqiya and Cairo and the Sunni Umayyads of Córdoba, for the lands of today’s Morocco and western Algeria. The Fatimids struck first: their Miknasa general Masala ibn Habus sacked Nekor in 917 and in 921 deposed the Idrisid ruler of Fez and restored their rule at Sijilmasa. Abd al-Rahman III answered by taking Melilla (927), Ceuta (931) and later Tangier as bridgeheads, and by winning over Berber chiefs such as Musa ibn Abi’l-Afiya and the Zenata emirs of the Maghrawa and the Banu Ifran. The Idrisids, driven from Fez to their mountain fortress of Hajar al-Nasr in the Rif, changed sides as each caliph gained the upper hand. Jawhar’s great expedition of 958–959 took Sijilmasa and Fez and carried Fatimid rule to the Atlantic, but after the Fatimids moved to Egypt, the Umayyad general Ghalib took the last Idrisid, al-Hasan ibn Qannun, to Córdoba in 974. A Zirid counter-offensive in 979–980 failed to hold the west, and when al-Hasan returned from Egypt in 985 he was defeated and killed. Fez and the north were left to Zenata emirs allied with Córdoba."
: "Sjuttio år av krig genom ombud mellan de två rivaliserande kalifaten i väster, de ismailitiska fatimiderna i Ifriqiya och Kairo och de sunnitiska umayyaderna i Córdoba, om områdena i dagens Marocko och västra Algeriet. Fatimiderna slog till först: deras fältherre Masala ibn Habus av miknasastammen plundrade Nekor 917 och avsatte 921 den idrisidiske härskaren i Fès och återupprättade fatimidernas styre i Sijilmasa. Abd al-Rahman III svarade med att inta Melilla (927), Ceuta (931) och senare Tanger som brohuvuden och med att vinna över berberhövdingar som Musa ibn Abi’l-Afiya och zenataemirerna av släkterna Maghrawa och Banu Ifran. Idrisiderna, som hade drivits från Fès till sin bergsfästning Hajar al-Nasr i Rif, bytte sida allteftersom den ena eller andra kalifen fick övertaget. Jawhars stora expedition 958–959 intog Sijilmasa och Fès och förde det fatimidiska styret ända till Atlanten, men sedan fatimiderna flyttat till Egypten förde den umayyadiske fältherren Ghalib 974 den siste idrisiden, al-Hasan ibn Qannun, till Córdoba. En ziridisk motoffensiv 979–980 lyckades inte hålla väst, och när al-Hasan återvände från Egypten 985 besegrades och dödades han. Fès och landet i norr lämnades åt zenataemirer allierade med Córdoba."
