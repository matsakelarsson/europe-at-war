The only near-contemporary source is a praise poem by Harald’s court poet, Thorbjørn Hornklove. The fuller story comes from Snorri Sturluson’s sagas, written more than 300 years later. Most historians now see the unification of Norway as a long process rather than the result of one battle.: Den enda nästan samtida källan är ett hyllningskväde av Haralds hovskald Torbjørn Hornklove. Den utförligare berättelsen kommer från Snorre Sturlassons sagor, skrivna mer än 300 år senare. De flesta historiker ser i dag Norges enande som en lång process snarare än resultatet av ett enda slag.
The start year shown is the traditional date, used for Norway’s millennial celebrations in 1872, not a firm date.: Det angivna startåret är det traditionella årtalet, som användes vid Norges tusenårsfirande 1872, inte ett säkert datum.
