Unification of Norway (Battle of Hafrsfjord): Norges enande (slaget i Hafrsfjord)
Harald Fairhair’s wars to make himself king over the petty kingdoms of western Norway, which culminated in his naval victory over a coalition of chieftains from Rogaland and the west coast in Hafrsfjord, near today’s Stavanger. The date is uncertain; the traditional year 872 is a 19th-century estimate, and historians have placed the battle anywhere between about 870 and 900, most now favouring the 880s. Later tradition held that many who refused to submit emigrated to Iceland.: Harald hårfagers krig för att göra sig till kung över småkungadömena i västra Norge, som kulminerade i hans sjöseger över en koalition av hövdingar från Rogaland och västkusten i Hafrsfjord, nära dagens Stavanger. Tidpunkten är osäker; det traditionella årtalet 872 är en uppskattning från 1800-talet, och historiker har placerat slaget någon gång mellan omkring 870 och 900, de flesta numera på 880-talet. Enligt senare tradition utvandrade många som vägrade underkasta sig till Island.
