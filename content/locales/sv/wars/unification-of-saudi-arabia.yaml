# Svenska översättningar av katalogtexten (våg 7); stegtexterna kommer senare.
Unification of Saudi Arabia: Saudiarabiens enande
The thirty years of wars in which Abdulaziz ibn Saud (Ibn Saud) rebuilt the Saudi state from exile in Kuwait. Starting with the capture of Riyadh by a small band in 1902, he defeated the Rashidi emirs of Ha’il, took al-Hasa from the Ottomans in 1913, conquered Ha’il in 1921 and the Hashemite Kingdom of the Hejaz in 1924–1925, and crushed the revolt of his own Ikhwan warriors in 1929–1930. In 1932 his lands were united as the Kingdom of Saudi Arabia.: De trettio år av krig under vilka Abdulaziz ibn Saud (Ibn Saud) byggde upp den saudiska staten på nytt, med landsflykten i Kuwait som utgångspunkt. Med början i att en liten skara intog Riyadh 1902 besegrade han de rashidiska emirerna i Ha’il, tog al-Hasa från osmanerna 1913, erövrade Ha’il 1921 och det hashimitiska kungariket Hijaz 1924–1925 och krossade 1929–1930 upproret bland sina egna ikhwankrigare. År 1932 förenades hans länder som Kungariket Saudiarabien.
