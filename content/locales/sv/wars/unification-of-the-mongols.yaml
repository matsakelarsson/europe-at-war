# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
Unification of the Mongol tribes: Enandet av de mongoliska stammarna
? The wars in which Temüjin, a chief of the Borjigin Mongols on the Onon River, brought the peoples of the Mongolian steppe under his rule and took the title Genghis (Chinggis) Khan. With his patron Toghrul, khan of the Kereit, and his sworn brother Jamukha he defeated the Merkits; elected khan of the Mongols in the 1180s, he was beaten by Jamukha at Dalan Baljut and disappears from the record for some years. From 1196 he fought the Tatars as an ally of the Jin dynasty, crushed the Taichiud and a coalition that had made Jamukha its gur-khan, and in 1202 destroyed the Tatars. In 1203 Toghrul turned on him and routed him at Qalaqaljid Sands, but within months Temüjin surprised and absorbed the Kereit. In 1204 he defeated the Naiman of Tayang Khan at Chakirmaut and then the Merkits. Jamukha was handed over by his own men and put to death, and in 1206 a great assembly at the source of the Onon proclaimed Temüjin Genghis Khan of the Great Mongol State. The last Merkit and Naiman leaders were defeated on the Irtysh in 1208–1209.
: De krig genom vilka Temüjin, hövding för borjiginmongolerna vid floden Onon, förde den mongoliska stäppens folk under sitt styre och antog titeln Djingis (Chinggis) khan. Med sin beskyddare Toghrul, kereiternas khan, och sin blodsbroder Jamukha besegrade han merkiterna; han valdes till mongolernas khan på 1180-talet, besegrades av Jamukha vid Dalan Baljut och försvinner sedan ur källorna under några år. Från 1196 bekämpade han tatarerna som Jindynastins bundsförvant, krossade taichiud och en koalition som hade gjort Jamukha till sin gur-khan, och 1202 förintade han tatarerna. År 1203 vände sig Toghrul mot honom och slog honom på flykten vid Qalaqaljids sanddyner, men inom några månader överrumplade Temüjin kereiterna och införlivade dem. År 1204 besegrade han Tayang khans naimaner vid Chakirmaut och därefter merkiterna. Jamukha utlämnades av sina egna män och avrättades, och 1206 utropade en stor församling vid Onons källor Temüjin till Djingis khan över Den stora mongoliska staten. De sista merkitiska och naimanska ledarna besegrades vid Irtysj 1208–1209.
