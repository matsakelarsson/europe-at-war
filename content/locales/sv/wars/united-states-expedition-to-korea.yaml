# Svenska översättningar av katalogtexten (våg 10); stegtexterna kommer senare.
United States expedition to Korea: Amerikanska expeditionen till Korea
"An American naval expedition to Korea, called Sinmi Yangyo in Korean (“the Western disturbance of 1871”). Frederick Low, the United States minister to China, and Rear Admiral John Rodgers sailed to Korea with five warships to learn the fate of the merchant schooner General Sherman, destroyed at Pyongyang in 1866, and to negotiate a treaty. On 1 June 1871 Korean batteries fired on American ships surveying the Ganghwa strait. When no apology came, about 650 sailors and marines landed on Ganghwa on 10 June, took the forts of Chojijin and Deokjinjin, and on 11 June stormed the citadel of Gwangseongbo, where the Korean commander Eo Jae-yeon and most of his men were killed: 243 Koreans by the American count, against three Americans. The Korean government still refused to negotiate, and the squadron left for China on 3 July. The regent Heungseon Daewongun set up stelae across the country warning against peace with Westerners; Korea and the United States signed a treaty only in 1882.": "En amerikansk flottexpedition till Korea, på koreanska kallad Sinmi Yangyo (”den västerländska oron 1871”). Frederick Low, USA:s minister i Kina, och konteramiral John Rodgers seglade till Korea med fem krigsfartyg för att ta reda på vad som hänt handelsskonaren General Sherman, som förstörts vid Pyongyang 1866, och för att förhandla fram ett fördrag. Den 1 juni 1871 öppnade koreanska batterier eld mot amerikanska fartyg som kartlade Ganghwasundet. När ingen ursäkt kom landsteg omkring 650 sjömän och marinkårssoldater på Ganghwa den 10 juni, intog fästena Chojijin och Deokjinjin och stormade den 11 juni citadellet Gwangseongbo, där den koreanske befälhavaren Eo Jae-yeon och de flesta av hans män dödades: 243 koreaner enligt den amerikanska räkningen, mot tre amerikaner. Den koreanska regeringen vägrade fortfarande att förhandla, och eskadern avseglade till Kina den 3 juli. Regenten Heungseon Daewongun lät resa stelar över hela landet med varningar mot fred med västerlänningar; Korea och USA undertecknade ett fördrag först 1882."
