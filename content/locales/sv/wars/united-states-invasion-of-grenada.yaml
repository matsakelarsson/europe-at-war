# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
United States invasion of Grenada: USA:s invasion av Grenada
? The American-led invasion of Grenada in October 1983, code-named Operation Urgent Fury, which overthrew the military council that had seized power after the killing of Prime Minister Maurice Bishop. Bishop’s New Jewel Movement had taken power in a revolution in 1979 and set up the People’s Revolutionary Government, which built close ties with Cuba and the Soviet Union and, with Cuban workers, a new international airport at Point Salines that the Reagan administration said was meant for military use. In October 1983 a rival faction around Deputy Prime Minister Bernard Coard put Bishop under house arrest; when a crowd freed him on 19 October, soldiers executed him and seven others at Fort Rupert, and General Hudson Austin’s Revolutionary Military Council took power under a shoot-on-sight curfew. At the request of the Organisation of Eastern Caribbean States, Barbados and Jamaica, and citing the safety of about 600 American medical students, President Reagan sent some 7,300 troops, joined by about 350 soldiers and police of a Caribbean Peace Force. They landed on 25 October against resistance from the People’s Revolutionary Army and armed Cuban construction workers and military personnel, and by 28 October held the island. The United States lost 19 killed and 116 wounded; 45 Grenadian soldiers, 25 Cubans and at least 24 Grenadian civilians were killed, 18 of them when American aircraft bombed a mental hospital by mistake. The UN General Assembly condemned the invasion as a flagrant violation of international law by 108 votes to 9, and Britain, whose queen was Grenada’s head of state, had not been consulted. The Governor-General, Sir Paul Scoon, appointed an interim government, American combat troops left in December 1983, and elections were held in December 1984.
: Den USA-ledda invasionen av Grenada i oktober 1983, med kodnamnet Operation Urgent Fury, som störtade det militärråd som hade tagit makten efter dödandet av premiärminister Maurice Bishop. Bishops New Jewel Movement hade tagit makten genom en revolution 1979 och inrättat Folkets revolutionära regering, som knöt nära band till Kuba och Sovjetunionen och, med kubanska arbetare, byggde en ny internationell flygplats vid Point Salines som Reaganadministrationen hävdade var avsedd för militärt bruk. I oktober 1983 satte en rivaliserande fraktion kring vice premiärministern Bernard Coard Bishop i husarrest; när en folkmassa befriade honom den 19 oktober avrättade soldater honom och sju andra vid Fort Rupert, och general Hudson Austins revolutionära militärråd tog makten under ett utegångsförbud med order om att skjuta på fläck. På begäran av Organisationen för östkaribiska stater, Barbados och Jamaica, och med hänvisning till säkerheten för omkring 600 amerikanska läkarstudenter, sände president Reagan omkring 7 300 soldater, som fick sällskap av omkring 350 soldater och poliser ur en karibisk fredsstyrka. De landsteg den 25 oktober mot motstånd från Folkets revolutionära armé och beväpnade kubanska byggnadsarbetare och militärer, och den 28 oktober kontrollerade de ön. USA förlorade 19 döda och 116 sårade; 45 grenadiska soldater, 25 kubaner och minst 24 grenadiska civila dödades, 18 av dem när amerikanska flygplan av misstag bombade ett mentalsjukhus. FN:s generalförsamling fördömde invasionen som en flagrant kränkning av folkrätten med 108 röster mot 9, och Storbritannien, vars drottning var Grenadas statschef, hade inte rådfrågats. Generalguvernören, Sir Paul Scoon, utsåg en interimsregering, de amerikanska stridstrupperna lämnade ön i december 1983, och val hölls i december 1984.
