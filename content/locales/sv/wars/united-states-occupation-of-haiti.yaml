# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
United States occupation of Haiti: USA:s ockupation av Haiti
? The occupation of Haiti by the United States Marine Corps from 1915 to 1934, and the Caco wars fought against it. After years of political turmoil, in which rival politicians used peasant armies called cacos to seize power, and with American banks in control of Haiti’s national bank, President Woodrow Wilson sent Marines ashore at Port-au-Prince on 28 July 1915, the day after President Vilbrun Guillaume Sam was killed by a crowd. The United States installed President Philippe Sudré Dartiguenave, took control of Haiti’s customs and finances by a treaty of 1915 and created a Gendarmerie officered by Marines. The cacos of the north were defeated in the First Caco War, ending with the fall of Fort Rivière on 17 November 1915. Forced road labour (the corvée) and a constitution of 1918 that let foreigners own land provoked a larger rising in 1918–1920 under Charlemagne Péralte and, after Marines killed him in 1919, Benoît Batraville. The Marines reported 2,250 to 3,250 Haitians killed in the fighting of 1915–1920; Haitian estimates of the dead of the whole occupation run to 15,000. After the killing of protesters at Marchaterre near Les Cayes in 1929 and the Forbes Commission, the United States handed back power, and the last Marines left on 15 August 1934; US control of Haiti’s finances lasted until 1947.
: USA:s marinkårs ockupation av Haiti 1915–1934 och de cacokrig som fördes mot den. Efter år av politiska oroligheter, då rivaliserande politiker använde bondearméer kallade cacos för att gripa makten, och med amerikanska banker i kontroll över Haitis nationalbank sände president Woodrow Wilson marinkårssoldater i land i Port-au-Prince den 28 juli 1915, dagen efter att president Vilbrun Guillaume Sam hade dödats av en folkmassa. USA insatte president Philippe Sudré Dartiguenave, tog genom ett fördrag 1915 kontroll över Haitis tullar och finanser och skapade ett gendarmeri med officerare från marinkåren. Cacos i norr besegrades i det första cacokriget, som slutade med att Fort Rivière föll den 17 november 1915. Tvångsarbete på vägarna (corvéen) och en författning från 1918 som lät utlänningar äga jord framkallade en större resning 1918–1920 under Charlemagne Péralte och, sedan marinkårssoldater hade dödat honom 1919, Benoît Batraville. Marinkåren rapporterade att 2 250 till 3 250 haitier dödades i striderna 1915–1920; haitiska uppskattningar av antalet döda under hela ockupationen uppgår till 15 000. Efter dödandet av demonstranter i Marchaterre nära Les Cayes 1929 och Forbeskommissionen lämnade USA tillbaka makten, och de sista marinkårssoldaterna lämnade landet den 15 augusti 1934; USA:s kontroll över Haitis finanser varade till 1947.
