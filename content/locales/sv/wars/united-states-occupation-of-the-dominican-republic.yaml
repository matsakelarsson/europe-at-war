# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
United States occupation of the Dominican Republic: USA:s ockupation av Dominikanska republiken
? The occupation of the Dominican Republic by the United States from 1916 to 1924. The country had been under an American customs receivership since 1905, and in 1916, with Dominican politics in turmoil and the First World War raising American fears of German influence, President Woodrow Wilson’s government demanded control of Dominican finances and armed forces. When the Secretary of War, Desiderio Arias, broke with President Juan Isidro Jimenes, US Marines landed at Santo Domingo on 5 May 1916; Jimenes resigned rather than accept American terms, and the Marines occupied the capital on 15 May. Colonel Joseph H. Pendleton’s Marines marched inland from Monte Cristi and Puerto Plata, defeated Arias’s men at Las Trencheras (27 June) and Guayacanas (3 July) and entered Santiago. When the provisional Dominican government still refused American demands, a US military government was proclaimed on 29 November 1916. It ruled by decree, built roads, disarmed the population and created a National Guard, while in the eastern sugar provinces guerrillas whom the Americans called gavilleros fought the Marines from 1917 to 1922. Under pressure at home and from Latin America, the United States agreed in 1922 to withdraw; Horacio Vásquez was elected president in 1924, and the last American forces left on 18 September 1924. The National Guard that the Marines trained became the base of Rafael Trujillo’s dictatorship from 1930.
: USA:s ockupation av Dominikanska republiken 1916–1924. Landet hade stått under amerikansk tullförvaltning sedan 1905, och 1916, när den dominikanska politiken präglades av oroligheter och första världskriget väckte amerikansk oro för tyskt inflytande, krävde president Woodrow Wilsons regering kontroll över Dominikanska republikens finanser och väpnade styrkor. När krigsministern Desiderio Arias bröt med president Juan Isidro Jimenes landsteg amerikanska marinkårssoldater i Santo Domingo den 5 maj 1916; Jimenes avgick hellre än att godta de amerikanska villkoren, och marinkåren besatte huvudstaden den 15 maj. Överste Joseph H. Pendletons marinkårssoldater marscherade inåt landet från Monte Cristi och Puerto Plata, besegrade Arias män vid Las Trencheras (27 juni) och Guayacanas (3 juli) och ryckte in i Santiago. När den provisoriska dominikanska regeringen fortfarande vägrade gå med på de amerikanska kraven utropades en amerikansk militärregering den 29 november 1916. Den styrde genom dekret, byggde vägar, avväpnade befolkningen och skapade ett nationalgarde, medan gerillakrigare som amerikanerna kallade gavilleros bekämpade marinkåren i de östra sockerprovinserna 1917–1922. Under tryck på hemmaplan och från Latinamerika gick USA 1922 med på att dra sig tillbaka; Horacio Vásquez valdes till president 1924, och de sista amerikanska styrkorna lämnade landet den 18 september 1924. Det nationalgarde som marinkåren utbildade blev grunden för Rafael Trujillos diktatur från 1930.
