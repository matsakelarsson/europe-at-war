# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
United States occupation of Veracruz: USA:s ockupation av Veracruz
? The seizure and seven-month occupation of Mexico’s main port by United States forces during the Mexican Revolution. President Woodrow Wilson had refused to recognise Victoriano Huerta, who had taken power in the coup of February 1913 in which President Francisco I. Madero was murdered. When soldiers of Huerta’s garrison briefly detained nine American sailors at Tampico on 9 April 1914, Admiral Henry Mayo demanded a 21-gun salute to the US flag, which Huerta refused, and on 21 April, told that the German steamer Ypiranga was about to land arms for Huerta, Wilson ordered the navy to seize the customs house at Veracruz. The Mexican commander withdrew his troops on orders from the capital, but naval cadets, freed prisoners and townspeople fought the landing parties in the streets for two days. Nineteen Americans were killed; Mexican losses are estimated at 150 to 200 dead, soldiers, cadets and civilians. The army under Frederick Funston governed the city until 23 November 1914, while Argentina, Brazil and Chile mediated at Niagara Falls. The occupation cut Huerta off from the customs revenue of the port and hastened his fall in July, and the Americans left the city, with the arms they had stored there, to Venustiano Carranza’s Constitutionalists. In Mexico it is remembered as an invasion, and it left lasting resentment.
: Amerikanska styrkors intagande och sju månader långa ockupation av Mexikos viktigaste hamn under mexikanska revolutionen. President Woodrow Wilson hade vägrat att erkänna Victoriano Huerta, som hade tagit makten genom kuppen i februari 1913, då president Francisco I. Madero mördades. När soldater ur Huertas garnison den 9 april 1914 för en kort tid grep nio amerikanska sjömän i Tampico krävde amiral Henry Mayo en salut på 21 skott för den amerikanska flaggan, vilket Huerta vägrade, och den 21 april, sedan Wilson fått veta att den tyska ångaren Ypiranga skulle lossa vapen åt Huerta, beordrade han flottan att besätta tullhuset i Veracruz. Den mexikanske befälhavaren drog tillbaka sina trupper på order från huvudstaden, men sjökadetter, frigivna fångar och stadsbor bekämpade landstigningsstyrkorna på gatorna i två dagar. Nitton amerikaner dödades; de mexikanska förlusterna uppskattas till 150–200 döda, soldater, kadetter och civila. Armén under Frederick Funston styrde staden till den 23 november 1914, medan Argentina, Brasilien och Chile medlade i Niagara Falls. Ockupationen skar av Huerta från hamnens tullintäkter och påskyndade hans fall i juli, och amerikanerna lämnade över staden, med de vapen de hade lagrat där, till Venustiano Carranzas konstitutionalister. I Mexiko minns man den som en invasion, och den lämnade ett bestående agg.
