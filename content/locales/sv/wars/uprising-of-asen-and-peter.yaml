Bulgarians and Cumans routed the Byzantine armies of the east and west under Alexios Gidos and Basil Vatatzes, who was killed.: Bulgarer och kumaner krossade de bysantinska arméerna i öst och väst under Alexios Gidos och Basileios Vatatzes, som stupade.
Battle of Serres: Slaget vid Serres
Asen beat a Byzantine army and captured its commander, the sebastokrator Isaac Komnenos, the emperor’s son-in-law.: Asen besegrade en bysantinsk armé och tillfångatog dess befälhavare, sebastokratorn Isak Komnenos, kejsarens svärson.
Asen was murdered here by the boyar Ivanko, who held the city briefly before fleeing to the Byzantines.: Asen mördades här av bojaren Ivanko, som höll staden en kort tid innan han flydde till bysantinerna.
Kaloyan stormed the Byzantine port with a siege tower and is said to have had its defenders buried alive in the moat.: Kalojan stormade den bysantinska hamnen med ett belägringstorn och lät enligt uppgift begrava dess försvarare levande i vallgraven.
