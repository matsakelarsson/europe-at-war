The main source is the Byzantine historian Niketas Choniates, who served Isaac II and took part in some of the campaigns. Historians debate how far the rising was Bulgarian or Vlach (Romanian-speaking) in character; the sources speak of both peoples, and the new state was ruled from Tarnovo as a Bulgarian empire.: Huvudkällan är den bysantinske historikern Niketas Choniates, som tjänade Isak II och deltog i några av fälttågen. Historiker diskuterar i vilken grad resningen var bulgarisk eller vlachisk (rumänsktalande) till sin karaktär; källorna talar om båda folken, och den nya staten styrdes från Tarnovo som ett bulgariskt rike.
Some accounts treat the uprising as ending with the truce of 1187, which left the rebels in control north of the Balkan Mountains; this entry follows the war to the peace Kaloyan made with Alexios III.: Vissa framställningar låter upproret sluta med stilleståndet 1187, som lämnade rebellerna i kontroll norr om Balkanbergen; denna artikel följer kriget fram till den fred som Kalojan slöt med Alexios III.
In 1185 the Byzantine emperor Isaac II Angelos raised a new tax to pay for his wedding to the daughter of Béla III of Hungary, and it fell heavily on the people of the Haemus (Balkan Mountains). Two brothers from the region, Theodore, later called Peter, and Asen, came to Isaac at Kypsella to ask for an estate and were refused and humiliated. On 26 October 1185, the feast of St Demetrius, they raised a revolt at Tarnovo, proclaiming that the saint had left Thessalonica to help them, and Peter took the title of tsar, reviving the Bulgarian Empire destroyed in 1018.: År 1185 införde den bysantinske kejsaren Isak II Angelos en ny skatt för att bekosta sitt bröllop med dottern till Béla III av Ungern, och den drabbade folket i Haemus (Balkanbergen) hårt. Två bröder från trakten, Teodor, senare kallad Peter, och Asen, kom till Isak i Kypsella för att be om ett gods men blev avvisade och förödmjukade. Den 26 oktober 1185, på den helige Demetrios festdag, startade de ett uppror i Tarnovo och förkunnade att helgonet hade lämnat Thessaloniki för att hjälpa dem, och Peter antog titeln tsar och återupprättade det bulgariska rike som hade krossats 1018.
Isaac’s campaign of 1186 drove many rebels north of the Danube, but they came back with Cuman horsemen from the steppe and held the land between the Haemus and the Danube. After a three-month siege of Lovech failed in 1187, Isaac agreed a truce that left them in control, taking the youngest brother, Kaloyan, as a hostage. In 1190 he tried again and besieged Tarnovo, but rumours of a Cuman army made him retreat, and in a mountain pass near Tryavna the Bulgarians ambushed his column. Isaac barely escaped, and the new state was secure.: Isaks fälttåg 1186 drev många rebeller norr om Donau, men de återvände med kumanska ryttare från stäppen och höll landet mellan Haemus och Donau. Sedan en tre månader lång belägring av Lovetj misslyckats 1187 gick Isak med på ett stillestånd som lämnade dem i kontroll, och han tog den yngste brodern, Kalojan, som gisslan. År 1190 försökte han igen och belägrade Tarnovo, men rykten om en kumansk armé fick honom att retirera, och i ett bergspass nära Trjavna överföll bulgarerna hans kolonn. Isak kom med nöd och näppe undan, och den nya staten var säkrad.
