Kypsella: Kypsella
The brothers met Isaac II here as he gathered his army against the Normans. Choniates says one of them was struck in the face for his insolence.: Bröderna mötte Isak II här när han samlade sin armé mot normanderna. Enligt Choniates fick en av dem ett slag i ansiktet för sin oförskämdhet.
The brothers built a church to St Demetrius and declared the rising here. Tarnovo became the capital of the new state.: Bröderna byggde en kyrka åt den helige Demetrios och utropade resningen här. Tarnovo blev den nya statens huvudstad.
Lovech: Lovetj
Isaac besieged the fortress for three months without success and then made a truce, which in practice recognised the brothers’ rule.: Isak belägrade fästningen i tre månader utan framgång och slöt sedan ett stillestånd som i praktiken erkände brödernas styre.
The Bulgarians attacked the retreating Byzantine army in a narrow pass. Isaac lost much of his army and baggage and barely escaped with his life.: Bulgarerna anföll den retirerande bysantinska armén i ett trångt pass. Isak förlorade en stor del av sin armé och sin tross och kom med nöd och näppe undan med livet.
Isaac II, 1190: Isak II, 1190
Now on the offensive, the Bulgarians and their Cuman allies raided Thrace and Macedonia. In 1194 they routed a Byzantine army at Arcadiopolis, and in 1196 Asen beat another near Serres. But the brothers made enemies among their own nobles. Asen was murdered by the boyar Ivanko in 1196, and Peter was killed the next year. Their younger brother Kaloyan, who had spent years as a hostage in Constantinople, took power in 1197.: Nu på offensiven härjade bulgarerna och deras kumanska allierade Thrakien och Makedonien. År 1194 krossade de en bysantinsk armé vid Arkadiopolis, och 1196 besegrade Asen en annan nära Serres. Men bröderna skaffade sig fiender bland sina egna stormän. Asen mördades av bojaren Ivanko 1196, och Peter dödades året därpå. Deras yngre bror Kalojan, som hade tillbringat flera år som gisslan i Konstantinopel, tog makten 1197.
Kaloyan pressed on. He took Constantia and, in March 1201, the Black Sea port of Varna, and the weak emperor Alexios III made peace with him in 1201 or 1202, accepting his rule over the lands he held. Kaloyan sought recognition from Pope Innocent III, and in November 1204 a papal legate crowned him king at Tarnovo. The Second Bulgarian Empire, which he called an empire of the Bulgarians and Vlachs, lasted until the Ottoman conquest of 1393–1396.: Kalojan fortsatte framåt. Han intog Konstantia och i mars 1201 Svarta havs-hamnen Varna, och den svage kejsaren Alexios III slöt fred med honom 1201 eller 1202 och godtog hans styre över de landområden han innehade. Kalojan sökte erkännande från påven Innocentius III, och i november 1204 krönte en påvlig legat honom till kung i Tarnovo. Det andra bulgariska riket, som han kallade bulgarernas och vlachernas rike, bestod fram till den osmanska erövringen 1393–1396.
