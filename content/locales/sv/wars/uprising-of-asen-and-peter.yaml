Uprising of Asen and Peter: Asens och Peters uppror
The revolt of the Bulgarians and Vlachs of the Balkan Mountains against Byzantine rule, led by the brothers Asen and Peter, which began at Tarnovo in 1185 and restored an independent Bulgarian state, the Second Bulgarian Empire. With Cuman help the rebels beat the emperor Isaac II at Tryavna in 1190 and went on to raid Thrace and Macedonia; their younger brother Kaloyan made peace with Byzantium in 1201 or 1202.: Bulgarernas och vlachernas uppror i Balkanbergen mot det bysantinska styret, lett av bröderna Asen och Peter, som började i Tarnovo 1185 och återupprättade en självständig bulgarisk stat, Andra bulgariska riket. Med hjälp av kumanerna besegrade rebellerna kejsar Isak II vid Trjavna 1190 och fortsatte med härjningar i Thrakien och Makedonien; deras yngre bror Kalojan slöt fred med Bysans 1201 eller 1202.
