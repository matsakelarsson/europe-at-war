Uprising of Georgi Voyteh: Georgi Vojtechs uppror
A rising against Byzantine rule in the Balkans after the defeat at Manzikert. Bulgarian nobles in Skopje led by Georgi Voyteh asked Prince Mihailo of Duklja for a leader, and his son Constantine Bodin, a descendant of Samuel’s family, was proclaimed tsar of the Bulgarians as Peter III at Prizren in the autumn of 1072. The rebels routed a Byzantine army and took Skopje; Bodin marched north to Niš while his general Petrilo took Ohrid and Devol but was beaten at Kastoria. In December Michael Saronites retook Skopje and captured Bodin and Voyteh near Kosovo Polje. Voyteh died on the way to Constantinople, and the last rebels were put down by Nikephoros Bryennios in 1073.: Ett uppror mot det bysantinska styret på Balkan efter nederlaget vid Manzikert. Bulgariska stormän i Skopje under ledning av Georgi Vojtech bad fursten Mihailo av Duklja om en ledare, och hans son Konstantin Bodin, en ättling till Samuels släkt, utropades till bulgarernas tsar som Peter III i Prizren hösten 1072. Rebellerna slog en bysantinsk armé på flykten och intog Skopje; Bodin marscherade norrut till Niš medan hans general Petrilo intog Ohrid och Devol men besegrades vid Kastoria. I december återtog Mikael Saronites Skopje och tillfångatog Bodin och Vojtech nära Kosovo Polje. Vojtech dog på vägen till Konstantinopel, och de sista rebellerna slogs ned av Nikeforos Bryennios 1073.
