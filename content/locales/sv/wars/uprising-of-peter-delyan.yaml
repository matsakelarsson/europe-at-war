The main source is John Skylitzes; Michael Psellos and the Norse sagas of Harald Hardrada add details. Whether Delyan was killed at Ostrovo or captured and taken to Constantinople is not known for certain.: Huvudkällan är Johannes Skylitzes; Michael Psellos och de nordiska sagorna om Harald hårdråde tillför detaljer. Om Deljan dödades vid Ostrovo eller tillfångatogs och fördes till Konstantinopel är inte säkert känt.
