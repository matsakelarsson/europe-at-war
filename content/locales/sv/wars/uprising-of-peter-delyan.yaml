Uprising of Peter Delyan: Peter Deljans uppror
The largest Bulgarian rising against Byzantine rule before 1185. Discontent grew when the government demanded taxes in coin instead of in kind, and in 1040 Peter Delyan, who claimed to be a grandson of Samuel, was proclaimed tsar in Belgrade. The rising spread south to Niš, Skopje and the region of Dyrrhachium, where a rival leader, Tihomir, was put to death. Alusian, a son of Ivan Vladislav, joined it but failed before Thessalonica; he then blinded Delyan and went over to the Byzantines. In 1041 the Emperor Michael IV defeated the rebels near Ostrovo, with Harald Hardrada among his Varangians, and the last resistance at Prilep and around Sofia was crushed.: Det största bulgariska upproret mot det bysantinska styret före 1185. Missnöjet växte när regeringen krävde skatt i mynt i stället för in natura, och 1040 utropades Peter Deljan, som påstod sig vara sonson till Samuel, till tsar i Belgrad. Upproret spred sig söderut till Niš, Skopje och trakten kring Dyrrachion, där en rivaliserande ledare, Tihomir, avrättades. Alusian, en son till Ivan Vladislav, anslöt sig men misslyckades framför Thessaloniki; han lät sedan blända Deljan och gick över till bysantinerna. År 1041 besegrade kejsar Mikael IV rebellerna nära Ostrovo, med Harald hårdråde bland sina varjager, och det sista motståndet vid Prilep och kring Sofia krossades.
