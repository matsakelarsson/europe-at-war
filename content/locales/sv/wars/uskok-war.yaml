Dates are Gregorian. A truce on the Isonzo front was agreed on 6 November 1617, and fighting at sea went on into that month.: Datum anges enligt den gregorianska kalendern. Ett stillestånd vid Isonzofronten överenskoms den 6 november 1617, och striderna till sjöss fortsatte in i samma månad.
The war ran alongside the War of the Montferrat Succession and was settled by the same treaties. Ferdinand, soon to be emperor, made peace partly to be free for the troubles in Bohemia that began the Thirty Years’ War.: Kriget pågick parallellt med monferratiska tronföljdskriget och avgjordes genom samma fördrag. Ferdinand, som snart skulle bli kejsare, slöt fred delvis för att få händerna fria inför oroligheterna i Böhmen som inledde trettioåriga kriget.
