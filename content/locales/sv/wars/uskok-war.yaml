Uskok War: Uskokkriget
A war between Venice and Archduke Ferdinand of Inner Austria, also called the War of Gradisca, fought mainly around Gradisca and Gorizia on the Isonzo. Its cause was the Uskoks of Senj, refugees from the Ottoman advance who served the Habsburgs as frontier troops and, often unpaid, raided Ottoman and Venetian shipping in the Adriatic. After Uskok raids on Venetian territory in late 1615, Venice besieged the Habsburg fortress of Gradisca in 1616 and again in 1617, without taking it; the young Albrecht von Wallenstein helped to relieve it. Venice hired some 4,000 Dutch soldiers and English volunteers, while Spain, Ferdinand’s ally, sent money, and the Duke of Osuna, viceroy of Naples, sent his ships into the Adriatic, where his fleet fought the Venetians off Ragusa in November 1617. The Peace of Madrid of September 1617 restored the conquests; many Uskoks were executed or driven from Senj, and a permanent imperial garrison was placed in the town.: Ett krig mellan Venedig och ärkehertig Ferdinand av Inre Österrike, även kallat Gradiscakriget, som främst utkämpades kring Gradisca och Gorizia vid Isonzo. Orsaken var uskokerna i Senj, flyktingar undan den osmanska framryckningen som tjänade habsburgarna som gränstrupper och, ofta obetalda, angrep osmansk och venetiansk sjöfart i Adriatiska havet. Efter uskokernas härjningar på venetianskt territorium i slutet av 1615 belägrade Venedig den habsburgska fästningen Gradisca 1616 och åter 1617, utan att inta den; den unge Albrecht von Wallenstein bidrog till att undsätta den. Venedig värvade omkring 4 000 nederländska soldater och engelska frivilliga, medan Spanien, Ferdinands allierade, sände pengar, och hertigen av Osuna, vicekung av Neapel, sände sina fartyg in i Adriatiska havet, där hans flotta stred mot venetianerna utanför Ragusa i november 1617. Freden i Madrid i september 1617 återställde erövringarna; många uskoker avrättades eller fördrevs från Senj, och en permanent kejserlig garnison förlades i staden.
