# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
Utah War: Utahkriget
? An armed confrontation in 1857–1858 between the government of the United States and the Latter-day Saints of Utah Territory, led by their church president and territorial governor Brigham Young. Believing reports that the Mormons were in rebellion against federal authority, President James Buchanan replaced Young as governor with Alfred Cumming and sent some 2,500 soldiers to install him. Young declared martial law, called out the territorial militia, the Nauvoo Legion, and prepared to resist. On 11 September 1857 Mormon militiamen from southern Utah, with some Southern Paiutes, killed about 120 men, women and children of the Baker–Fancher wagon train from Arkansas at Mountain Meadows, the worst atrocity of the conflict. In October Mormon raiders under Lot Smith burned three army supply trains and the army wintered near the burned-out Fort Bridger. In 1858, through the mediation of Thomas L. Kane, Cumming entered Salt Lake City as governor, some 30,000 Latter-day Saints left their homes in northern Utah in the Move South, Buchanan pardoned those who submitted, and the army marched through the empty city on 26 June to set up Camp Floyd. There were no battles; about 150 people died in the conflict, most of them at Mountain Meadows.
: En väpnad konfrontation 1857–1858 mellan USA:s regering och de sista dagars heliga i Utahterritoriet, under ledning av sin kyrkopresident och territoriets guvernör Brigham Young. President James Buchanan, som trodde på rapporter om att mormonerna hade gjort uppror mot den federala myndigheten, ersatte Young som guvernör med Alfred Cumming och sände omkring 2 500 soldater för att installera honom. Young utlyste krigslagar, kallade ut territoriets milis, Nauvoo Legion, och förberedde sig på att göra motstånd. Den 11 september 1857 dödade mormonska milismän från södra Utah, med några sydpaiuter, omkring 120 män, kvinnor och barn ur vagnståget Baker–Fancher från Arkansas vid Mountain Meadows, konfliktens värsta illdåd. I oktober brände mormonska angripare under Lot Smith tre av arméns försörjningståg, och armén övervintrade nära det nedbrända Fort Bridger. År 1858 gjorde Cumming genom Thomas L. Kanes medling sitt intåg i Salt Lake City som guvernör, omkring 30 000 sista dagars heliga lämnade sina hem i norra Utah i flytten söderut (Move South), Buchanan benådade dem som underkastade sig, och armén marscherade genom den tomma staden den 26 juni för att upprätta Camp Floyd. Det förekom inga slag; omkring 150 människor dog i konflikten, de flesta av dem vid Mountain Meadows.
