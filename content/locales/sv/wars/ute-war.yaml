# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
Ute War (White River War): Utekriget (White River-kriget)
? A short war in western Colorado in 1879 between the White River Ute and the United States, which ended with the removal of most Ute from Colorado. The treaty of 1868 had given the Ute most of western Colorado for their “absolute and undisturbed use and occupation”, but miners moved onto their land in the 1870s, and Colorado’s governor, Frederick Pitkin, campaigned on the slogan “The Utes Must Go!”. Nathan Meeker, the agent at the White River Agency from 1878, tried to make the White River Ute settle as farmers and become Christians, and in September 1879 he had a pasture and racetrack where they kept their horses ploughed. After a scuffle with the Ute leader Canalla (Johnson), Meeker asked for troops, and Major Thomas Thornburgh marched from Fort Fred Steele in Wyoming with about 150 soldiers. The Ute had warned that troops entering the reservation would mean war. On 29 September 1879 Ute fighters under Nicaagat (Captain Jack) and Colorow met Thornburgh’s column at Milk Creek, about 29 km north of today’s Meeker, killed him and 13 of his men and besieged the rest for almost a week, until a company of the 9th Cavalry, Buffalo Soldiers under Captain Francis Dodge, reached them on 2 October and Colonel Wesley Merritt’s relief column on 5 October. The same day as the battle, Ute men under Quinkent (Douglass) killed Meeker and ten agency employees and took five women and children captive, among them Meeker’s wife Arvilla and daughter Josephine; they were freed on 21 October through talks in which the Uncompahgre Ute leader Ouray, his wife Chipeta and his sister Shawsheen took part. Under an agreement of 1880 the White River Ute were removed to the Uintah Reservation in Utah in 1881 and the Uncompahgre Ute, who had not fought, to a reservation beside it; only the Southern Ute kept a strip of land in south-western Colorado, and millions of acres were opened to settlement.
: Ett kort krig i västra Colorado 1879 mellan ute från White River och USA, som slutade med att de flesta ute förflyttades från Colorado. Fördraget 1868 hade gett ute större delen av västra Colorado för deras ”absoluta och ostörda bruk och besittning”, men gruvarbetare flyttade in på deras land under 1870-talet, och Colorados guvernör, Frederick Pitkin, förde valkampanj under parollen ”The Utes Must Go!” (”Ute måste bort!”). Nathan Meeker, agent vid White River Agency från 1878, försökte få ute från White River att bli bofasta jordbrukare och kristna, och i september 1879 lät han plöja upp en betesmark och kapplöpningsbana där de höll sina hästar. Efter ett handgemäng med uteledaren Canalla (Johnson) begärde Meeker trupper, och major Thomas Thornburgh marscherade från Fort Fred Steele i Wyoming med omkring 150 soldater. Ute hade varnat för att trupper som gick in i reservatet skulle betyda krig. Den 29 september 1879 mötte utekrigare under Nicaagat (Captain Jack) och Colorow Thornburghs kolonn vid Milk Creek, omkring 29 km norr om dagens Meeker, dödade honom och 13 av hans män och belägrade resten i nästan en vecka, tills ett kompani ur 9:e kavalleriregementet, Buffalo Soldiers under kapten Francis Dodge, nådde dem den 2 oktober och överste Wesley Merritts undsättningskolonn den 5 oktober. Samma dag som slaget dödade utemän under Quinkent (Douglass) Meeker och tio anställda vid agenturen och tog fem kvinnor och barn till fånga, bland dem Meekers hustru Arvilla och dottern Josephine; de släpptes den 21 oktober efter förhandlingar i vilka uncompahgre-uteledaren Ouray, hans hustru Chipeta och hans syster Shawsheen deltog. Enligt en överenskommelse 1880 förflyttades ute från White River 1881 till Uintahreservatet i Utah och uncompahgre-ute, som inte hade stridit, till ett reservat intill det; endast sydute behöll en landremsa i sydvästra Colorado, och miljontals acres öppnades för bosättning.
