Valdemar’s conquest of Visby and his heavy dues on the Sound and the Scanian herring markets threatened the trade of the Hanseatic towns. In April 1362 a Hanseatic fleet under Johann Wittenborg of Lübeck laid siege to Helsingborg, but Valdemar fell on the ships and captured a dozen of them; Wittenborg was later executed by his own city. In 1367 the towns, from the Baltic to the Netherlands, formed the Confederation of Cologne and allied with King Albert of Sweden, the dukes of Mecklenburg and the counts of Holstein.: Valdemars erövring av Visby och hans tunga avgifter i Öresund och på de skånska sillmarknaderna hotade hansestädernas handel. I april 1362 belägrade en hanseatisk flotta under Johann Wittenborg från Lübeck Helsingborg, men Valdemar föll över skeppen och erövrade ett dussin av dem; Wittenborg avrättades senare av sin egen stad. År 1367 bildade städerna, från Östersjön till Nederländerna, Kölnkonfederationen och allierade sig med kung Albrekt av Sverige, hertigarna av Mecklenburg och grevarna av Holstein.
In 1368 their fleets sacked Copenhagen and raided the coasts of Denmark and Norway, whose king, Valdemar’s son-in-law Haakon VI, soon made a truce. Swedish and German troops overran most of Scania while the Holsteiners marched into Jutland. Valdemar left the country to seek allies, and when Helsingborg fell in 1369 his council sued for peace. By the Peace of Stralsund on 24 May 1370 the towns kept their privileges and held the Scanian castles of Skanör, Falsterbo, Malmö and Helsingborg, with two-thirds of their revenues, for fifteen years.: År 1368 plundrade deras flottor Köpenhamn och härjade kusterna i Danmark och Norge, vars kung, Valdemars svärson Håkan VI, snart slöt stillestånd. Svenska och tyska trupper överrände större delen av Skåne medan holsteinarna marscherade in i Jylland. Valdemar lämnade landet för att söka allierade, och när Helsingborg föll 1369 bad hans råd om fred. Genom freden i Stralsund den 24 maj 1370 behöll städerna sina privilegier och innehade de skånska borgarna Skanör, Falsterbo, Malmö och Helsingborg, med två tredjedelar av deras intäkter, i femton år.
