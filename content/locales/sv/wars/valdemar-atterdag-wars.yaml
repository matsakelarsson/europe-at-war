The allied fleet plundered the town and damaged its harbour so badly that it could not be used for the rest of the war.: Den allierade flottan plundrade staden och skadade dess hamn så svårt att den inte kunde användas under resten av kriget.
The castle commanding the Sound held out against the allies until September 1369.: Borgen som behärskade Öresund höll stånd mot de allierade till september 1369.
Negotiated for Denmark by the drost Henning Podebusk and for the towns by the mayors of Lübeck and Stralsund. It marked the height of Hanseatic power.: Förhandlad för Danmarks del av drotsen Henning Podebusk och för städernas del av borgmästarna i Lübeck och Stralsund. Den markerade höjdpunkten för Hansans makt.
