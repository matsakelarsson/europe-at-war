Valdemar Atterdag’s wars with Sweden: Valdemar Atterdags krig mot Sverige
Valdemar IV Atterdag of Denmark took Scania, Blekinge and Halland back from Sweden in 1360 and conquered Gotland and Visby in 1361. The Hanseatic towns, allied with Sweden, then fought him until the Peace of Stralsund in 1370, which confirmed their hold on Baltic trade.: Valdemar IV Atterdag av Danmark tog tillbaka Skåne, Blekinge och Halland från Sverige 1360 och erövrade Gotland och Visby 1361. Hansestäderna, allierade med Sverige, bekämpade honom sedan fram till freden i Stralsund 1370, som befäste deras grepp om Östersjöhandeln.
