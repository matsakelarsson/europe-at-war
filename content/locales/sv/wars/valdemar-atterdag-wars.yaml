While Denmark lay broken and pawned to German lords, Magnus Eriksson bought Scania and Blekinge in 1332 from Duke John of Holstein, after the local people said they would rather be ruled by the Swedes. He also gained Halland, and for almost thirty years the Swedish king held the whole southern coast.: Medan Danmark låg söndrat och pantsatt till tyska herrar köpte Magnus Eriksson 1332 Skåne och Blekinge av hertig Johan av Holstein, sedan lokalbefolkningen sagt att de hellre ville styras av svenskarna. Han vann också Halland, och i nästan trettio år behärskade den svenske kungen hela sydkusten.
Valdemar IV Atterdag rebuilt Denmark. In 1360, after the death of Magnus’s rebellious son Erik, he crossed the Sound, forced Magnus to give up Helsingborg and took back Scania, Blekinge and Halland. The next summer he landed on Gotland. On 27 July 1361 his professional soldiers slaughtered the island’s peasant army outside the walls of Visby, which then accepted him as ruler.: Valdemar IV Atterdag byggde upp Danmark på nytt. År 1360, efter att Magnus upproriske son Erik hade dött, gick han över Öresund, tvingade Magnus att lämna ifrån sig Helsingborg och tog tillbaka Skåne, Blekinge och Halland. Sommaren därpå landsteg han på Gotland. Den 27 juli 1361 nedgjorde hans yrkessoldater öns bondehär utanför Visbys murar, och staden godtog därefter honom som härskare.
