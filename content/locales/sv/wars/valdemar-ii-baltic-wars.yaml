Valdemar is remembered in Denmark as Valdemar Sejr, “the Victorious”. The main sources are German chronicles, Henry of Livonia’s chronicle for Estonia, and later Danish annals; numbers in them are unreliable.: Valdemar är i Danmark ihågkommen som Valdemar Sejr, ”Segraren”. Huvudkällorna är tyska krönikor, Henrik av Livlands krönika för Estland och senare danska annaler; siffrorna i dem är otillförlitliga.
The legend that the Danish flag, the Dannebrog, fell from the sky at Lyndanisse is first recorded about three centuries after the battle.: Legenden att den danska flaggan, Dannebrogen, föll från himlen vid Lyndanisse finns först upptecknad omkring tre sekler efter slaget.
