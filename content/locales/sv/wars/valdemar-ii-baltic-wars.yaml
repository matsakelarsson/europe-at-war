In May 1223 Count Henry of Schwerin, one of Valdemar’s German vassals, kidnapped the king and his eldest son while they were hunting on the island of Lyø and carried them off to his castles in Germany. The north German princes and cities rose against Danish rule, and a Danish army under Albert of Orlamünde was beaten at Mölln in 1225. To be freed, Valdemar had to give up his German conquests, pay 44,000 marks of silver and swear not to take revenge.: I maj 1223 bortförde greve Henrik av Schwerin, en av Valdemars tyska vasaller, kungen och hans äldste son medan de jagade på ön Lyø och förde dem till sina borgar i Tyskland. De nordtyska furstarna och städerna reste sig mot det danska styret, och en dansk här under Albrekt av Orlamünde besegrades vid Mölln 1225. För att bli fri tvingades Valdemar avstå från sina tyska erövringar, betala 44 000 mark silver och svära att inte hämnas.
The pope released him from his oath, and Valdemar tried to win his lands back. On 22 July 1227 he met Count Adolf IV of Holstein and his allies, among them Lübeck, Hamburg, the Duke of Saxony and Henry of Schwerin, at Bornhöved. The peasant army of Dithmarschen, fighting for the king, changed sides in mid-battle and the Danes were routed; Valdemar lost an eye. Denmark’s southern border went back to the Eider, and only Rügen was kept. In the same year the Sword Brothers took Danish Estonia, which was returned to Denmark in 1238.: Påven löste honom från eden, och Valdemar försökte vinna tillbaka sina landområden. Den 22 juli 1227 mötte han greve Adolf IV av Holstein och hans allierade, bland dem Lübeck, Hamburg, hertigen av Sachsen och Henrik av Schwerin, vid Bornhöved. Ditmarskens bondehär, som stred för kungen, bytte sida mitt under slaget och danskarna led ett förkrossande nederlag; Valdemar miste ett öga. Danmarks sydgräns återgick till Ejderån, och endast Rügen behölls. Samma år tog svärdsriddarna Danska Estland, som återlämnades till Danmark 1238.
