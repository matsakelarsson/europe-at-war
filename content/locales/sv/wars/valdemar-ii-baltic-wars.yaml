German crusaders and the Livonian Brothers of the Sword had been fighting the pagan Estonians for more than a decade when the bishop of Riga asked Valdemar for help. With the pope’s blessing, Valdemar sailed to northern Estonia in June 1219 with a large fleet, Archbishop Anders Sunesen of Lund, Prince Vitslav of Rügen and Count Albert. They camped at Lyndanisse, a hill-fort by the sea, and began to build a castle.: Tyska korsfarare och svärdsriddarorden hade stridit mot de hedniska esterna i mer än ett decennium när biskopen av Riga bad Valdemar om hjälp. Med påvens välsignelse seglade Valdemar i juni 1219 till norra Estland med en stor flotta, ärkebiskop Anders Sunesen av Lund, furst Vitslav av Rügen och greve Albrekt. De slog läger vid Lyndanisse, en fornborg vid havet, och började bygga en borg.
On 15 June the Estonians attacked the camp from several sides and took the crusaders by surprise. Bishop Theoderich, mistaken for the king, was killed. A counterattack by Vitslav’s men turned the battle, and many Estonians were killed. The Danes built their castle on the hill of Toompea; the town that grew up around it is today’s Tallinn. Over the next years northern Estonia was conquered and baptised, in rivalry with the Sword Brothers advancing from the south.: Den 15 juni anföll esterna lägret från flera håll och överraskade korsfararna. Biskop Theoderich, som togs för kungen, dödades. Ett motanfall av Vitslavs män vände slaget, och många ester dödades. Danskarna byggde sin borg på Domberget (Toompea); staden som växte upp runt den är dagens Tallinn. Under de följande åren erövrades och kristnades norra Estland, i rivalitet med svärdsriddarna som ryckte fram söderifrån.
