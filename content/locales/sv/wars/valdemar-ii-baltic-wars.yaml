A long, bloody battle in eastern Holstein ended Danish rule north of the Eider. Duke Otto of Brunswick, fighting for Valdemar, was taken prisoner.: Ett långt och blodigt slag i östra Holstein gjorde slut på det danska styret norr om Ejderån. Hertig Otto av Braunschweig, som stred för Valdemar, togs till fånga.
