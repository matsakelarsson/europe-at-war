Wars of Valdemar II: Valdemar II:s krig
The wars by which Valdemar II of Denmark built a Baltic empire stretching from Holstein and Lübeck to northern Estonia, and then lost most of it. After his kidnapping by a German count in 1223, his north German lands broke away, and his defeat at Bornhöved in 1227 pushed Denmark’s border back to the Eider.: De krig genom vilka Valdemar II av Danmark byggde upp ett östersjövälde som sträckte sig från Holstein och Lübeck till norra Estland, för att sedan förlora större delen av det. Sedan han kidnappats av en tysk greve 1223 bröt sig hans nordtyska landområden loss, och hans nederlag vid Bornhöved 1227 drev tillbaka Danmarks gräns till Ejderån.
