In 1201 Duke Valdemar of Schleswig, younger brother of King Canute VI, defeated Count Adolf III of Holstein at Stellau and captured him at Hamburg. Holstein and Lübeck submitted to Danish rule, and the count only bought his freedom in 1203 by giving up his claims. Valdemar became king on his brother’s death in November 1202 and set his nephew Albert of Orlamünde over Holstein.: År 1201 besegrade hertig Valdemar av Slesvig, yngre bror till kung Knut VI, greve Adolf III av Holstein vid Stellau och tillfångatog honom i Hamburg. Holstein och Lübeck underkastade sig danskt styre, och greven köpte sig fri först 1203 genom att avstå från sina anspråk. Valdemar blev kung vid broderns död i november 1202 och satte sin brorson Albrekt av Orlamünde över Holstein.
Taking advantage of the struggle for the German crown, Valdemar extended Danish power along the coast as far as Pomerania, and fought for control of the lower Elbe and Hamburg. In 1214 the young emperor Frederick II, in need of allies, formally granted Denmark all the lands north of the Elbe and the Elde. Denmark was then the leading power of the Baltic.: Valdemar utnyttjade striden om den tyska kronan till att utvidga den danska makten längs kusten ända till Pommern och kämpade om kontrollen över nedre Elbe och Hamburg. År 1214 överlät den unge kejsaren Fredrik II, som behövde allierade, formellt alla landområden norr om Elbe och Elde till Danmark. Danmark var då Östersjöns ledande makt.
