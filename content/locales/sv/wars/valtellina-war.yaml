Valtellina War: Valtellinakriget
A long struggle for the Valtellina, the Alpine valley between Milan and the Tyrol that was ruled by the Protestant-led Three Leagues of the Grisons and offered Spain its best road from Italy to Austria. On 19 July 1620 Catholic Valtellinese rose and killed several hundred Protestants, and Spanish troops from Milan occupied the valley while the Austrians invaded the Grisons. Papal troops took over the Valtellina forts in 1623, and in November 1624 a French army drove them out. The Treaty of Monzón of 1626 left the valley to the Grisons, self-governing and Catholic. In 1635 the Duke of Rohan led French and Grisons troops into the valley and beat Spanish and imperial armies, but France would not hand it back, and in 1637 the Grisons, led by Jürg Jenatsch, turned on the French and forced Rohan to leave. By the Treaty of Milan of 3 September 1639 Spain restored the valley to the Grisons, on condition that only Catholic worship was allowed, and gained free passage for its troops.: En lång kamp om Valtellina, alpdalen mellan Milano och Tyrolen som styrdes av De tre förbunden i Graubünden under protestantisk ledning och som erbjöd Spanien dess bästa väg från Italien till Österrike. Den 19 juli 1620 reste sig katolska valtellinare och dödade flera hundra protestanter, och spanska trupper från Milano ockuperade dalen medan österrikarna invaderade Graubünden. Påvliga trupper tog över fästena i Valtellina 1623, och i november 1624 drev en fransk armé ut dem. Fördraget i Monzón 1626 lämnade dalen åt Graubünden, självstyrande och katolsk. År 1635 ledde hertigen av Rohan franska och graubündnerska trupper in i dalen och besegrade spanska och kejserliga arméer, men Frankrike ville inte lämna tillbaka den, och 1637 vände sig graubündnarna under Jürg Jenatsch mot fransmännen och tvingade Rohan att ge sig av. Genom fördraget i Milano den 3 september 1639 återlämnade Spanien dalen till Graubünden, på villkor att endast katolsk gudstjänst tilläts, och fick fri genomfart för sina trupper.
