Vellore Mutiny: Myteriet i Vellore
? A rising of Indian sepoys of the Madras army in the fortress of Vellore, where the family of Tipu Sultan had been held since 1799. In November 1805 new regulations forbade Hindu soldiers to wear caste marks on duty, told Muslims to trim their beards, and introduced a new round turban with a leather cockade, which many saw as an attack on their religion and a step towards forced conversion. Protests were punished with floggings and dismissals. In the early hours of 10 July 1806 men of the 1st and 23rd Madras Native Infantry rose, killed or wounded about 200 soldiers of the British 69th Foot and many of their own officers, and raised the flag of Mysore over the fort, in the name of one of Tipu’s sons. Colonel Robert Gillespie rode in from Arcot, about 25 km away, with the 19th Light Dragoons and galloper guns, blew open the gate and retook the fort within hours. About 350 sepoys were killed, some 100 were executed on the spot and more after courts martial. The regulations were withdrawn, Tipu’s family was moved to Calcutta, and the Governor of Madras, Lord William Bentinck, and the commander-in-chief, Sir John Cradock, were recalled. It is also called the Vellore Revolt or Vellore Rebellion, and is often remembered as a forerunner of the rising of 1857.
: En resning bland indiska sepoyer i Madrasarmén i fästningen Vellore, där Tipu Sultans familj hade hållits sedan 1799. I november 1805 förbjöd nya föreskrifter hinduiska soldater att bära kastmärken i tjänsten, ålade muslimer att klippa skägget och införde en ny rund turban med en läderkokard, vilket många såg som ett angrepp på deras religion och ett steg mot tvångsomvändelse. Protester straffades med prygel och avsked. Under de tidiga morgontimmarna den 10 juli 1806 reste sig män ur 1:a och 23:e infödda infanteriregementet i Madras, dödade eller sårade omkring 200 soldater ur det brittiska 69:e infanteriregementet och många av sina egna officerare och hissade Mysores flagga över fortet i namn av en av Tipus söner. Överste Robert Gillespie red in från Arcot, omkring 25 km bort, med 19:e lätta dragonregementet och lätta fältkanoner, sprängde upp porten och återtog fortet inom några timmar. Omkring 350 sepoyer dödades, omkring 100 avrättades på stället och fler efter krigsrätt. Föreskrifterna drogs tillbaka, Tipus familj flyttades till Calcutta, och guvernören i Madras, lord William Bentinck, och överbefälhavaren, Sir John Cradock, kallades hem. Den kallas också Vellorerevolten eller Velloreupproret och brukar ses som en föregångare till resningen 1857.
