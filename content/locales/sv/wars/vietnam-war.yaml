# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
Vietnam War: Vietnamkriget
? The war for the south of Vietnam between the communist Democratic Republic of Vietnam (North Vietnam) and the National Liberation Front it directed in the South, on one side, and the Republic of Vietnam (South Vietnam) and the United States with its allies on the other. The Geneva Accords of 1954 divided Vietnam at the 17th parallel pending elections that were never held. From 1959 Hanoi backed an armed rising in the South, and the United States, which saw South Vietnam as a barrier against the spread of communism in Asia, sent first advisers and money, then, after the Gulf of Tonkin incident of August 1964, bombers and from March 1965 combat troops, more than half a million by 1968. The war of attrition that followed, fought in the villages, jungles and highlands of the South and in the air over the North, Laos and Cambodia, could not be won by either side. The Tết Offensive of 1968 failed militarily but turned American opinion against the war. Under Richard Nixon the United States handed the fighting to the South Vietnamese army, carried the war into Cambodia and Laos and withdrew after the Paris Peace Accords of January 1973. Two years later the North Vietnamese army overran the South, and Saigon fell on 30 April 1975. Estimates of the Vietnamese dead range from about 1 million to more than 3 million; some 58,000 Americans died.
: Kriget om södra Vietnam mellan å ena sidan den kommunistiska Demokratiska republiken Vietnam (Nordvietnam) och Nationella befrielsefronten (FNL), som den styrde i söder, och å andra sidan Republiken Vietnam (Sydvietnam) och USA med dess allierade. Genèveavtalen 1954 delade Vietnam vid 17:e breddgraden i väntan på val som aldrig hölls. Från 1959 stödde Hanoi en väpnad resning i söder, och USA, som såg Sydvietnam som en barriär mot kommunismens spridning i Asien, sände först rådgivare och pengar, sedan, efter Tonkinbuktsincidenten i augusti 1964, bombplan och från mars 1965 stridande trupper, över en halv miljon 1968. Det utnötningskrig som följde, utkämpat i Sydvietnams byar, djungler och högland och i luften över Nordvietnam, Laos och Kambodja, kunde inte vinnas av någon av sidorna. Tết-offensiven 1968 misslyckades militärt men vände den amerikanska opinionen mot kriget. Under Richard Nixon överlät USA striderna åt den sydvietnamesiska armén, förde kriget in i Kambodja och Laos och drog sig tillbaka efter Parisavtalet i januari 1973. Två år senare överskred den nordvietnamesiska armén Sydvietnam, och Saigon föll den 30 april 1975. Uppskattningarna av antalet döda vietnameser sträcker sig från omkring 1 miljon till över 3 miljoner; omkring 58 000 amerikaner dog.
