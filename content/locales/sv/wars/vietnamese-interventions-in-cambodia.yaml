# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
Nguyễn interventions in Cambodia: Nguyễnfurstarnas interventioner i Kambodja
? A century of wars in which the Nguyễn lords of Đàng Trong, the southern Vietnamese state, intervened in the quarrels of the Cambodian royal family, usually backing one branch while Ayutthaya backed another, and in the process took over the Mekong delta. Vietnamese settlers had been allowed to settle at Prey Nokor (Saigon) since about 1623, after a Nguyễn princess married King Chey Chettha II. In 1658, when Buddhist princes rose against King Ramathipadi I (Ponhea Chan), a convert to Islam, a Nguyễn army invaded at their call, captured the king and took him to Quảng Bình, where he died in 1659. After a further invasion in 1674 the Nguyễn recognised Ang Sor (Chey Chettha IV) as king at Longvek and Ang Nan as second king at Prey Nokor, both paying them tribute. In 1679 they settled some 3,000 Ming loyalist soldiers, under Dương Ngạn Địch and Trần Thượng Xuyên, at Mỹ Tho and Biên Hòa, and they fought again in Cambodia in 1688–1691. In 1698 Nguyễn Hữu Cảnh organised the region of Saigon as the prefecture of Gia Định, and in 1700 his army defeated Chey Chettha IV and entered Phnom Penh. Rivalry between Siamese-backed kings and the Nguyễn-backed prince Ang Em brought new wars in 1705 and 1714–1717, when Vietnamese armies besieged Longvek and Siam sent armies and a fleet; the settlement left Ang Em king, under Siamese overlordship. Hà Tiên, a port ruled by the Chinese merchant Mạc Cửu, became a Nguyễn vassal in 1708 and was sacked by a Siamese-backed Cambodian army in 1715. Cambodian attempts from 1739 to recover the delta failed; the Nguyễn gained Vĩnh Long in 1732 and, after new wars in the 1750s led by Nguyễn Cư Trinh, the rest of the delta by 1757.
: Ett sekel av krig där Nguyễnfurstarna i Đàng Trong, den sydvietnamesiska staten, ingrep i den kambodjanska kungafamiljens stridigheter, oftast till stöd för en gren medan Ayutthaya stödde en annan, och därvid tog över Mekongdeltat. Vietnamesiska nybyggare hade fått slå sig ned i Prey Nokor (Saigon) sedan omkring 1623, efter att en Nguyễnprinsessa hade gift sig med kung Chey Chettha II. År 1658, när buddhistiska prinsar reste sig mot kung Ramathipadi I (Ponhea Chan), som hade konverterat till islam, invaderade en Nguyễnarmé på deras kallelse, tillfångatog kungen och förde honom till Quảng Bình, där han dog 1659. Efter ytterligare en invasion 1674 erkände Nguyễnfurstarna Ang Sor (Chey Chettha IV) som kung i Longvek och Ang Nan som andrekung i Prey Nokor, båda tributskyldiga till dem. År 1679 lät de omkring 3 000 Mingtrogna soldater under Dương Ngạn Địch och Trần Thượng Xuyên slå sig ned i Mỹ Tho och Biên Hòa, och de stred åter i Kambodja 1688–1691. År 1698 organiserade Nguyễn Hữu Cảnh området kring Saigon som prefekturen Gia Định, och 1700 besegrade hans armé Chey Chettha IV och tågade in i Phnom Penh. Rivaliteten mellan kungar som stöddes av Siam och prinsen Ang Em, som stöddes av Nguyễnfurstarna, ledde till nya krig 1705 och 1714–1717, då vietnamesiska arméer belägrade Longvek och Siam sände arméer och en flotta; uppgörelsen lämnade Ang Em som kung, under siamesisk överhöghet. Hà Tiên, en hamn som styrdes av den kinesiske köpmannen Mạc Cửu, blev Nguyễnvasall 1708 och plundrades 1715 av en kambodjansk armé med siamesiskt stöd. Kambodjanska försök från 1739 att återvinna deltat misslyckades; Nguyễnfurstarna vann Vĩnh Long 1732, och efter nya krig på 1750-talet under ledning av Nguyễn Cư Trinh hade de 1757 lagt under sig resten av deltat.
