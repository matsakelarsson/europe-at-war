# Svenska översättningar av katalogtexten (våg 8); stegtexterna kommer senare.
Vijayabahu’s war against the Cholas: Vijayabahus krig mot cholariket
The war in which the Sinhalese prince Kitti, crowned as Vijayabahu I, drove the Chola Empire out of Sri Lanka. From 1055 he led the resistance in Ruhuna, the south-eastern province the Cholas had never firmly held, and by 1058 he controlled it. A first attack on the Chola capital of Polonnaruwa in 1066 was beaten back by reinforcements from India, but when the Chola kingdom was shaken by a disputed succession in 1069–1070, his armies took Anuradhapura and, after a siege of about seven months, Polonnaruwa. The Cholas withdrew in 1070, ending more than seventy years of occupation in the north, and the island was united under one king again for the first time in over a century.: Kriget där den singalesiske prinsen Kitti, krönt som Vijayabahu I, drev ut cholariket från Sri Lanka. Från 1055 ledde han motståndet i Ruhuna, den sydöstra provinsen som cholarikets styrkor aldrig hade haft ett fast grepp om, och 1058 behärskade han den. Ett första anfall mot cholahuvudstaden Polonnaruwa 1066 slogs tillbaka av förstärkningar från Indien, men när cholariket skakades av en omstridd tronföljd 1069–1070 intog hans arméer Anuradhapura och, efter en belägring på omkring sju månader, Polonnaruwa. Cholastyrkorna drog sig tillbaka 1070, vilket gjorde slut på mer än sjuttio års ockupation i norr, och ön enades åter under en kung för första gången på över ett sekel.
