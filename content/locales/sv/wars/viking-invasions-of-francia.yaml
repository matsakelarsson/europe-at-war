In 879 a large Viking army that had gathered on the Thames, finding no opening in Wessex after Alfred’s victory at Edington, crossed from England to the Low Countries. From camps at Ghent and elsewhere it ravaged the lands between the Scheldt and the Seine for years. King Louis III beat part of it at Saucourt-en-Vimeu on 3 August 881, a victory celebrated in the Old High German Ludwigslied, but the raids went on. In November 885 a fleet the monk Abbo puts at 700 ships came up the Seine under Sigfred and Sinric and found the way blocked by the fortified bridges of Paris, then confined to the Île de la Cité.: År 879 gick en stor vikingahär som hade samlats vid Themsen, och som inte fann någon öppning i Wessex efter Alfreds seger vid Edington, över från England till Nederländerna. Från läger i Gent och på andra håll härjade den i åratal landen mellan Schelde och Seine. Kung Ludvig III besegrade en del av den vid Saucourt-en-Vimeu den 3 augusti 881, en seger som hyllas i den fornhögtyska Ludwigslied, men plundringarna fortsatte. I november 885 kom en flotta som munken Abbo uppskattar till 700 skepp uppför Seine under Sigfred och Sinric och fann vägen spärrad av de befästa broarna vid Paris, som då var begränsat till Île de la Cité.
Count Odo of Paris and Bishop Gozlin held the city through a siege of almost a year, against towers, rams, fire and mining. In February 886 a flood swept away one bridge, and the twelve defenders of its tower were killed. Sigfred took 60 pounds of silver and left in the spring, but others stayed. The emperor Charles the Fat arrived only in October, camped at Montmartre and, instead of fighting, paid 700 pounds and let the Vikings sail on to plunder Burgundy, which was in revolt. Odo’s defence made his name; when Charles was deposed in 887, the West Franks chose Odo as their king.: Greve Odo av Paris och biskop Gozlin försvarade staden under en nästan ettårig belägring, mot torn, murbräckor, eld och minering. I februari 886 spolade en översvämning bort en av broarna, och de tolv försvararna av dess torn dödades. Sigfred tog emot 60 pund silver och drog bort på våren, men andra stannade. Kejsar Karl den tjocke anlände först i oktober, slog läger på Montmartre och betalade i stället för att strida 700 pund och lät vikingarna segla vidare för att plundra Burgund, som gjorde uppror. Odos försvar gjorde honom berömd; när Karl avsattes 887 valde västfrankerna Odo till kung.
