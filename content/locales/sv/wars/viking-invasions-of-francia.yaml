The main sources are Frankish annals, chiefly the Annals of St-Bertin and of St-Vaast, and the monk Abbo’s poem on the siege of Paris. They give large and often exaggerated numbers of ships and men, and they rarely say where the raiders came from; most seem to have been Danes, with Norwegians among them.: Huvudkällorna är frankiska annaler, främst Saint-Bertin- och Saint-Vaast-annalerna, och munken Abbos dikt om belägringen av Paris. De anger stora och ofta överdrivna antal skepp och män och säger sällan varifrån plundrarna kom; de flesta tycks ha varit daner, med norrmän bland dem.
The story of Rollo and the grant of 911 comes mostly from Dudo of Saint-Quentin, who wrote about a century later for Rollo’s descendants. No text of the agreement survives, and its date and place are traditional; a royal charter of 918 confirms that Charles had granted land on the lower Seine to the Northmen.: Berättelsen om Rollo och förläningen 911 kommer mest från Dudo av Saint-Quentin, som skrev omkring ett sekel senare för Rollos ättlingar. Ingen text till överenskommelsen finns bevarad, och dess datum och plats är traditionella; ett kungligt brev från 918 bekräftar att Karl hade förlänat nordmännen land vid nedre Seine.
Scandinavian raiders first struck the coast of the Frankish empire around 799, and Charlemagne ordered fleets and coastguards along the Channel and the North Sea. In 810 the Danish king Godfred sent some 200 ships against Frisia, which paid tribute. After Louis the Pious lost control of his sons in the 830s the attacks grew. Dorestad, the great trading town on the Rhine, was raided in 834 and in several years after. In 841 a fleet sailed up the Seine and burned Rouen and the abbey of Jumièges, and in 843 raiders took Nantes on the feast of St John and killed its bishop in the cathedral.: Skandinaviska plundrare slog första gången till mot Frankerrikets kust omkring 799, och Karl den store lät ordna flottor och kustbevakning längs Engelska kanalen och Nordsjön. År 810 sände danakungen Godfred omkring 200 skepp mot Frisland, som betalade tribut. Sedan Ludvig den fromme förlorat kontrollen över sina söner på 830-talet tilltog angreppen. Dorestad, den stora handelsstaden vid Rhen, plundrades 834 och flera år därefter. År 841 seglade en flotta uppför Seine och brände Rouen och klostret Jumièges, och 843 intog plundrare Nantes på midsommardagen och dödade dess biskop i katedralen.
The fleets then began to winter in Francia, on islands such as Noirmoutier at the mouth of the Loire and Oissel in the Seine. In March 845 about 120 ships under a leader the annals call Reginherus reached Paris at Easter and plundered it, and Charles the Bald paid 7,000 pounds of silver and gold to make them leave, the first of many such payments. In 864 he ordered fortified bridges across the rivers, and one was built at Pont-de-l’Arche on the Seine. On 2 July 866 Vikings under the chieftain Hastein and their Breton allies killed Robert the Strong, the Frankish commander in the west, at Brissarthe.: Flottorna började sedan övervintra i Frankerriket, på öar som Noirmoutier vid Loires mynning och Oissel i Seine. I mars 845 nådde omkring 120 skepp under en ledare som annalerna kallar Reginherus Paris vid påsk och plundrade staden, och Karl den skallige betalade 7 000 pund silver och guld för att få dem att ge sig av, den första av många sådana betalningar. År 864 beordrade han att befästa broar skulle byggas över floderna, och en byggdes vid Pont-de-l’Arche över Seine. Den 2 juli 866 dödade vikingar under hövdingen Hastein och deras bretonska bundsförvanter Robert den starke, den frankiske befälhavaren i väster, vid Brissarthe.
