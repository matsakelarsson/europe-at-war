Viking settlers had been living along the lower Seine for years when a band led by Rollo besieged Chartres in 911. On 20 July a Frankish army under Robert, marquis of Neustria and brother of the late King Odo, with Duke Richard of Burgundy and Count Ebles of Poitiers, came to the city’s relief. Bishop Gantelme led a sortie from the walls, by later tradition displaying the Virgin’s tunic, the cathedral’s relic, and the Vikings were beaten.: Vikingabosättare hade levt längs nedre Seine i åratal när en skara ledd av Rollo belägrade Chartres 911. Den 20 juli kom en frankisk armé under Robert, markgreve av Neustrien och bror till den avlidne kung Odo, tillsammans med hertig Rikard av Burgund och greve Ebles av Poitiers staden till undsättning. Biskop Gantelme ledde ett utfall från murarna, enligt senare tradition med Jungfru Marias tunika, katedralens relik, och vikingarna besegrades.
King Charles the Simple chose to make the Vikings defenders of the realm rather than fight them every year. According to Dudo, he met Rollo at Saint-Clair-sur-Epte and granted him the land from the Epte to the sea around Rouen; Rollo became the king’s man, agreed to defend the Seine against other raiders and was baptised, taking the name Robert. Further grants in 924 and 933 added the land around Bayeux and the Cotentin. Rollo’s descendants ruled as counts and then dukes of Normandy, and within a few generations the Normans spoke French.: Kung Karl den enfaldige valde att göra vikingarna till rikets försvarare i stället för att strida mot dem varje år. Enligt Dudo mötte han Rollo i Saint-Clair-sur-Epte och förlänade honom landet från Epte till havet kring Rouen; Rollo blev kungens vasall, åtog sig att försvara Seine mot andra plundrare och döptes, varvid han tog namnet Robert. Ytterligare förläningar 924 och 933 lade till landet kring Bayeux och Cotentin. Rollos ättlingar härskade som grevar och sedan hertigar av Normandie, och inom några generationer talade normanderna franska.
