Viking invasions of Francia: Vikingarnas invasioner av Frankerriket
A century of Scandinavian raids on the Frankish lands, from the first attacks on the coast around 800 to the great fleets that sacked Rouen, Nantes and Paris and the long siege of Paris in 885–886. It ended in 911, when King Charles the Simple granted the lower Seine to the Viking leader Rollo, whose county became the Duchy of Normandy.: Ett sekel av skandinaviska plundringståg mot de frankiska länderna, från de första anfallen mot kusten omkring 800 till de stora flottor som plundrade Rouen, Nantes och Paris och den långa belägringen av Paris 885–886. Perioden slutade 911, när kung Karl den enfaldige förlänade nedre Seine åt vikingahövdingen Rollo, vars grevskap blev hertigdömet Normandie.
