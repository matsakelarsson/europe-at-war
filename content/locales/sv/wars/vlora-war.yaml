Vlora War: Vlorakriget
A conflict in the summer of 1920 in which Albanian nationalists besieged the Italian garrison of Vlorë, held since 1914, whose troops were weakened by malaria and could not be reinforced after soldiers in Ancona mutinied rather than sail for Albania. By the Treaty of Tirana of 2 August 1920 Italy agreed to leave Vlorë, keeping only the island of Sazan (Saseno), and gave up its hopes of a mandate over Albania; the war is remembered in Albania as a turning point in securing its independence.: En konflikt sommaren 1920 där albanska nationalister belägrade den italienska garnisonen i Vlorë, som Italien hade hållit sedan 1914; trupperna var försvagade av malaria och kunde inte förstärkas sedan soldater i Ancona gjort myteri hellre än att segla till Albanien. Genom fördraget i Tirana den 2 augusti 1920 gick Italien med på att lämna Vlorë och behöll bara ön Sazan (Saseno), och gav upp sina förhoppningar om ett mandat över Albanien; i Albanien minns kriget som en vändpunkt i tryggandet av landets självständighet.
