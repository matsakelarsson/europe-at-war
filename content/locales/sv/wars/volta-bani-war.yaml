# Svenska översättningar av katalogtexten (våg 12); stegtexterna kommer senare.
Volta-Bani War: Volta-Bani-kriget
? A war against French colonial rule in the lands between the Bani and the Black Volta rivers, in what are now western Burkina Faso and south-eastern Mali, in 1915–1917, during the First World War. It began when representatives of about a dozen villages met at Bona in November 1915 and resolved to take up arms; the heavy forced recruitment of soldiers for the war in Europe was the main grievance, and many believed the colonial government could be beaten while France was weak. The movement spread to around a thousand villages with up to 900,000 people, among them Marka, Bwa, Samo, Minianka, Bobo, Nuna and others, without any single leader or state. Armed mostly with bows and flintlocks, the coalition threw back the first two French columns. In 1916 France brought in about 5,000 troops, mostly West African tirailleurs and auxiliaries, with artillery and machine guns, and waged a campaign of systematic destruction until the last strongholds fell in September 1916; scattered resistance went on into 1917. At least 30,000 Africans were killed, many of them civilians, against about 300 on the French side, and more than a hundred villages were razed; there was also fighting between the coalition and villages that sided with the French or tried to stay out. It was one of the largest armed challenges to colonial rule anywhere in Africa, and led France to create the colony of Upper Volta, today Burkina Faso, in 1919.
: Ett krig mot det franska kolonialstyret i landområdena mellan floderna Bani och Svarta Volta, i det som i dag är västra Burkina Faso och sydöstra Mali, 1915–1917, under första världskriget. Det började när företrädare för ett dussintal byar möttes i Bona i november 1915 och beslöt att gripa till vapen; den omfattande tvångsrekryteringen av soldater till kriget i Europa var det främsta klagomålet, och många trodde att kolonialregeringen kunde besegras medan Frankrike var svagt. Rörelsen spred sig till omkring tusen byar med upp till 900 000 invånare, bland dem marka, bwa, samo, minianka, bobo, nuna och andra, utan någon enskild ledare eller stat. Koalitionen, som mestadels var beväpnad med pilbågar och flintlåsgevär, slog tillbaka de två första franska kolonnerna. År 1916 förde Frankrike in omkring 5 000 soldater, mestadels västafrikanska tirailleurer och hjälptrupper, med artilleri och kulsprutor, och förde ett fälttåg av systematisk förstörelse tills de sista fästena föll i september 1916; spritt motstånd fortsatte in på 1917. Minst 30 000 afrikaner dödades, många av dem civila, mot omkring 300 på fransk sida, och mer än hundra byar jämnades med marken; det förekom också strider mellan koalitionen och byar som tog fransmännens parti eller försökte hålla sig utanför. Det var en av de största väpnade utmaningarna mot kolonialstyret någonstans i Afrika och fick Frankrike att 1919 skapa kolonin Övre Volta, dagens Burkina Faso.
