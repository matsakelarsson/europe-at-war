# Svenska översättningar av katalogtexten (våg 13); stegtexterna kommer senare.
Voortrekker–Zulu war: Kriget mellan voortrekkerna och zulu
? The war between the Zulu kingdom of Dingane and the Voortrekkers, the emigrant Boers of the Great Trek who crossed the Drakensberg into Natal in 1837. Their leader Piet Retief negotiated with Dingane for land south of the Thukela; on 6 February 1838 Dingane had Retief and about 100 of his party killed at his capital, uMgungundlovu, and his regiments then attacked the trekker camps along the Bushmans and Bloukrans rivers, killing over 500 men, women, children and servants. In April a Boer commando was beaten at Italeni and a force from Port Natal destroyed on the Thukela. In December 1838 a new commando under Andries Pretorius defeated the Zulu army at the Ncome River, the battle Afrikaners called Blood River, and burned out uMgungundlovu. The trekkers founded the Republic of Natalia, and in 1839 Dingane’s half-brother Mpande crossed into Natal with his followers and allied with them. In January 1840 Mpande’s army defeated Dingane at the Maqongqo hills; Dingane fled and was killed, and Pretorius proclaimed Mpande king of the Zulu, who ruled until 1872 as Natalia’s and then Britain’s neighbour.
: Kriget mellan Dinganes Zulurike och voortrekkerna, de utvandrade boerna under Stora trekket som 1837 korsade Drakensberg in i Natal. Deras ledare Piet Retief förhandlade med Dingane om land söder om Thukela; den 6 februari 1838 lät Dingane döda Retief och omkring 100 av hans följe i sin huvudstad uMgungundlovu, och hans regementen angrep sedan voortrekkernas läger längs floderna Bushmans och Bloukrans och dödade över 500 män, kvinnor, barn och tjänare. I april besegrades ett boerkommando vid Italeni och en styrka från Port Natal förintades vid Thukela. I december 1838 besegrade ett nytt kommando under Andries Pretorius zuluarmén vid Ncomefloden, det slag som afrikanderna kallade Blood River, och brände ned uMgungundlovu. Voortrekkerna grundade Republiken Natalia, och 1839 gick Dinganes halvbror Mpande över till Natal med sina anhängare och allierade sig med dem. I januari 1840 besegrade Mpandes armé Dingane vid Maqongqokullarna; Dingane flydde och dödades, och Pretorius utropade Mpande till zulukung. Mpande regerade sedan till 1872 som granne först till Natalia och därefter till Storbritannien.
