# Svenska översättningar av katalogtexten (våg 12); stegtexterna kommer senare.
Voulet–Chanoine Mission: Voulet–Chanoine-expeditionen
? The march of the French Central Africa mission (mission Afrique centrale) from the Niger towards Lake Chad in 1899, under Captains Paul Voulet and Julien Chanoine, the officers who had taken Ouagadougou in 1896. Sent with vague orders and little money to put the lands between the Niger and Lake Chad “under French protection” and to meet the columns of Foureau and Lamy from Algeria and Gentil from the Congo, the column of some 600 soldiers and about 2,000 porters and followers lived off the country, and from January 1899 burned villages and killed those who resisted or failed to supply it, across what is now western and southern Niger. Sarraounia Mangou, the ruler of the Azna of Lougou, fought it in April. At Birni-N’Konni in May the column destroyed a town of more than 10,000 people. When reports reached Paris, the government sent Lieutenant-Colonel Jean-François Klobb to take command; on 14 July Voulet had his men fire on Klobb and kill him at Dankori. Two and three days later the African soldiers of the column killed Chanoine and then Voulet. Under new officers the mission took Zinder, capital of the sultanate of Damagaram, on 30 July, and went on as the Joalland–Meynier mission to join the battle of Kousséri in April 1900. The killings were one of the great scandals of the European conquest of Africa; in 2025 descendants of the victims in Niger asked France for reparations.
: Den franska Centralafrikaexpeditionens (mission Afrique centrale) marsch från Niger mot Tchadsjön 1899 under kaptenerna Paul Voulet och Julien Chanoine, de officerare som hade intagit Ouagadougou 1896. Kolonnen, som skickades i väg med vaga order och lite pengar för att ställa länderna mellan Niger och Tchadsjön ”under franskt beskydd” och för att möta Foureaus och Lamys kolonner från Algeriet och Gentils från Kongo, bestod av omkring 600 soldater och omkring 2 000 bärare och följeslagare; den levde på landet och brände från januari 1899 byar och dödade dem som gjorde motstånd eller inte försåg den med förnödenheter, i det som i dag är västra och södra Niger. Sarraounia Mangou, härskarinna över azna i Lougou, bekämpade den i april. I Birni-N’Konni förstörde kolonnen i maj en stad med mer än 10 000 invånare. När rapporterna nådde Paris skickade regeringen överstelöjtnant Jean-François Klobb för att ta över befälet; den 14 juli lät Voulet sina män skjuta mot Klobb och döda honom vid Dankori. Två och tre dagar senare dödade kolonnens afrikanska soldater Chanoine och sedan Voulet. Under nya officerare intog expeditionen den 30 juli Zinder, huvudstad i sultanatet Damagaram, och fortsatte som Joalland–Meynier-expeditionen för att delta i slaget vid Kousséri i april 1900. Morden blev en av de stora skandalerna under den europeiska erövringen av Afrika; 2025 begärde ättlingar till offren i Niger gottgörelse av Frankrike.
