The figures in the sources are unreliable. Contemporaries put the Ottoman army at 90,000 to 300,000 or more, and modern historians at perhaps 60,000–90,000; Vlad may have had about 30,000 men. Vlad’s own figure of 23,884 Turks killed in his winter raid comes from his letter to Matthias Corvinus.: Siffrorna i källorna är otillförlitliga. Samtida uppskattade den osmanska armén till 90 000–300 000 man eller mer, och moderna historiker till kanske 60 000–90 000; Vlad kan ha haft omkring 30 000 man. Vlads egen siffra på 23 884 dödade turkar under hans vinterräd kommer från hans brev till Matthias Corvinus.
Accounts of the night attack differ widely, from great slaughter in the Ottoman camp to small losses of men and many of horses and camels, and its outcome is generally described as inconclusive.: Skildringarna av nattanfallet skiljer sig kraftigt, från ett stort blodbad i det osmanska lägret till små förluster av män och stora av hästar och kameler, och dess utgång beskrivs i allmänhet som oavgjord.
Wallachian moves: Valakiska trupprörelser
Vlad III had held the Wallachian throne since 1456 as an Ottoman vassal, but he stopped paying tribute and made an alliance with Matthias Corvinus of Hungary. When the bey of Nicopolis, Hamza, tried to seize him by a trick near Giurgiu in the winter of 1461–1462, Vlad ambushed and captured him, took Giurgiu and raided the Ottoman bank of the Danube from Serbia to the Black Sea in January and February 1462, killing, by his own count, 23,884 people. In the spring Mehmed II led a great army north, crossing the Danube in early June while his fleet attacked Brăila and Kiliia.: Vlad III hade innehaft den valakiska tronen sedan 1456 som osmansk vasall, men han slutade betala tribut och slöt en allians med Matthias Corvinus av Ungern. När bejen av Nikopolis, Hamza, försökte gripa honom genom en list nära Giurgiu vintern 1461–1462 lade Vlad ett bakhåll och tillfångatog honom, intog Giurgiu och härjade den osmanska stranden av Donau från Serbien till Svarta havet i januari och februari 1462, varvid han enligt egen räkning dödade 23 884 människor. På våren ledde Mehmed II en stor armé norrut och gick över Donau i början av juni medan hans flotta anföll Brăila och Kilija.
Vlad emptied the country before the invaders, burning crops and poisoning wells, and harried them with raids. On the night of 17 June, with several thousand horsemen, he attacked the Ottoman camp south of Târgoviște, perhaps hoping to kill the sultan, and caused great confusion before the janissaries drove him off. When Mehmed reached Târgoviște he found it deserted, and outside it a forest of stakes with thousands of impaled prisoners, among them Hamza. The sultan withdrew, burning Brăila on 29 June, and left Vlad’s younger brother Radu, raised at the Ottoman court, to win over the boyars. By the autumn most of the boyars had gone over to Radu. Vlad turned to Matthias Corvinus, who came to Transylvania in November, but the king had no wish to fight the sultan; he had Vlad arrested and kept him a prisoner until 1475.: Vlad tömde landet framför inkräktarna, brände grödor och förgiftade brunnar och ansatte dem med räder. Natten till den 17 juni anföll han med flera tusen ryttare det osmanska lägret söder om Târgoviște, kanske i hopp om att döda sultanen, och vållade stor förvirring innan janitsjarerna drev bort honom. När Mehmed nådde Târgoviște fann han staden övergiven, och utanför den en skog av pålar med tusentals spetsade fångar, bland dem Hamza. Sultanen drog sig tillbaka, brände Brăila den 29 juni och lämnade kvar Vlads yngre bror Radu, som vuxit upp vid det osmanska hovet, för att vinna över bojarerna. Till hösten hade de flesta bojarerna gått över till Radu. Vlad vände sig till Matthias Corvinus, som kom till Transsylvanien i november, men kungen hade ingen lust att strida mot sultanen; han lät arrestera Vlad och höll honom fången till 1475.
