Wallachian campaign of 1462: Fälttåget i Valakiet 1462
Mehmed II’s invasion of Wallachia to punish its prince, Vlad III, later known as Vlad the Impaler, who had stopped paying tribute, allied with Hungary and slaughtered thousands of people along the Ottoman bank of the Danube. Vlad fought a war of scorched earth and raids, and on the night of 17 June attacked the sultan’s camp near Târgoviște. Mehmed reached the capital but withdrew, and his candidate, Vlad’s brother Radu, won over the boyars; Vlad sought help from King Matthias of Hungary, who instead had him imprisoned.: Mehmed II:s invasion av Valakiet för att straffa dess furste Vlad III, senare känd som Vlad Pålspetsaren, som hade slutat betala tribut, allierat sig med Ungern och slaktat tusentals människor längs Donaus osmanska strand. Vlad förde ett krig med bränd jord och räder, och natten till den 17 juni anföll han sultanens läger nära Târgoviște. Mehmed nådde huvudstaden men drog sig tillbaka, och hans kandidat, Vlads bror Radu, vann bojarerna för sig; Vlad sökte hjälp hos kung Matthias av Ungern, som i stället lät fängsla honom.
