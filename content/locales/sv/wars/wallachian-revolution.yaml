Wallachian Revolution of 1848: Valakiska revolutionen 1848
A liberal and national revolution in Wallachia, an autonomous principality under Ottoman suzerainty and Russian protection. Young intellectuals and militia officers proclaimed a programme of reforms at Islaz on 21 June 1848, Prince Gheorghe Bibescu abdicated, and a provisional government in Bucharest abolished Roma slavery, ended censorship and promised land reform. Russia refused to accept it, and on 25 September Ottoman troops occupied Bucharest, after a clash with the city’s firemen on Dealul Spirii, while Russian troops entered the country. A joint Russian–Ottoman occupation lasted until 1851, but many of the revolutionaries later led the union of the principalities and the Romanian state. A smaller movement in Moldavia had been put down in the spring.: En liberal och nationell revolution i Valakiet, ett autonomt furstendöme under osmansk överhöghet och ryskt beskydd. Unga intellektuella och milisofficerare proklamerade ett reformprogram i Islaz den 21 juni 1848, furst Gheorghe Bibescu abdikerade, och en provisorisk regering i Bukarest avskaffade slaveriet av romer, upphävde censuren och utlovade en jordreform. Ryssland vägrade godta den, och den 25 september ockuperade osmanska trupper Bukarest efter en sammandrabbning med stadens brandmän på Dealul Spirii, medan ryska trupper ryckte in i landet. En gemensam rysk-osmansk ockupation varade till 1851, men många av revolutionärerna kom senare att leda unionen mellan furstendömena och den rumänska staten. En mindre rörelse i Moldavien hade slagits ned under våren.
