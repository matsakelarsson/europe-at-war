Wallachia used the Julian calendar, then 12 days behind the Gregorian, so Romanian accounts date the Islaz Proclamation 9 June and the entry of the Ottoman troops into Bucharest 13 September 1848 (Old Style).: Valakiet använde den julianska kalendern, som då låg 12 dagar efter den gregorianska, så rumänska framställningar daterar proklamationen i Islaz till den 9 juni och de osmanska truppernas intåg i Bukarest till den 13 september 1848 (g.s.).
