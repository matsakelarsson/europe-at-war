Wallachia used the Julian calendar, then 12 days behind the Gregorian. Romanian accounts date Vladimirescu’s proclamation at Padeș 23 January 1821 and his entry into Bucharest 21 March (Old Style).: Valakiet använde den julianska kalendern, som då låg 12 dagar efter den gregorianska. Rumänska framställningar daterar Vladimirescus proklamation i Padeș till den 23 januari 1821 och hans intåg i Bukarest till den 21 mars (g.s.).
Ypsilantis’s campaign in the principalities is also the first step of the Greek War of Independence.: Ypsilantis fälttåg i furstendömena är också det första steget i grekiska frihetskriget.
