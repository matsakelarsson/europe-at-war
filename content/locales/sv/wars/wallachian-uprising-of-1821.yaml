Wallachian Uprising of 1821: Valakiska upproret 1821
A rising in Wallachia, then an autonomous principality under Ottoman suzerainty, led by Tudor Vladimirescu and his Pandurs, irregular soldiers of Oltenia. Begun in early 1821 against the Greek Phanariote princes and the boyars, in uneasy partnership with the Filiki Eteria, whose army under Alexander Ypsilantis had crossed from Moldavia to start the Greek War of Independence, it took Bucharest in March. When Vladimirescu negotiated with the Ottomans, the Eterists seized and killed him; Ottoman troops then crushed the scattered Pandurs and routed Ypsilantis’s army, with its Sacred Band, at Drăgășani in June. The Porte then ended Phanariote rule and named native boyars as princes of Wallachia and Moldavia, and the rising is seen as the start of Romania’s national revival.: Ett uppror i Valakiet, då ett autonomt furstendöme under osmansk överhöghet, lett av Tudor Vladimirescu och hans pandurer, irreguljära soldater från Oltenien. Upproret inleddes i början av 1821 mot de grekiska fanariotiska furstarna och bojarerna, i ett spänt samarbete med Filiki Eteria, vars armé under Alexandros Ypsilantis hade gått över från Moldavien för att inleda det grekiska frihetskriget, och det intog Bukarest i mars. När Vladimirescu förhandlade med osmanerna grep och dödade eteristerna honom; osmanska trupper krossade sedan de splittrade pandurerna och slog Ypsilantis armé, med dess Heliga skara, på flykten vid Drăgășani i juni. Höga porten gjorde därefter slut på det fanariotiska styret och utnämnde inhemska bojarer till furstar i Valakiet och Moldavien, och upproret ses som början på Rumäniens nationella pånyttfödelse.
