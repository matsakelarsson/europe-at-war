# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
Wang Xiaobo and Li Shun rebellion: Wang Xiaobos och Li Shuns uppror
? The peasant rising in Sichuan led by Wang Xiaobo and Li Shun against the Song, which had conquered the region from the Later Shu in 965. The Song had carried off the Shu treasury and made the officials’ purchasing office the only buyer of the region’s silk and cloth, and in the crowded Chengdu plain many poor farmers could not live from their land. In the spring of 993 Wang Xiaobo, a farmer of Qingcheng county, rose with a few hundred followers under the slogan “I hate the inequality of rich and poor; today I will make it equal for you”. His band grew to tens of thousands and took counties in Qiongzhou and Shuzhou; at Pengshan they killed the hated county magistrate and stuffed his belly with coins. Wang Xiaobo was killed by an arrow in a battle at Jiangyuan late in 993, and his comrade Li Shun took the lead. In early 994 Li Shun took Chengdu, proclaimed himself King of Great Shu with an era name of his own, and sent his forces as far as the Jianmen Pass in the north and the Yangtze gorges in the east; his army failed in an eighty-day siege of Zizhou. The emperor Taizong sent the eunuch Wang Ji’en with armies over the Qinling and up the Yangtze. Chengdu was retaken in the summer of 994, with some 30,000 rebels killed, and Li Shun was captured and executed, though rumours long said he had escaped. His follower Zhang Yu fought on in eastern Sichuan until early 995, when his own men killed him. The new prefect of Chengdu, Zhang Yong, sent the captured rebels home to farm and restored order.
: Den bonderesning i Sichuan som Wang Xiaobo och Li Shun ledde mot Songdynastin, som hade erövrat regionen från Senare Shu 965. Song hade fört bort Shus skattkammare och gjort ämbetsmännens inköpskontor till den enda köparen av regionens siden och tyg, och på den tätbefolkade Chengduslätten kunde många fattiga bönder inte leva på sin jord. Våren 993 reste sig Wang Xiaobo, en bonde från Qingchengs härad, med några hundra anhängare under parollen ”Jag hatar ojämlikheten mellan rik och fattig; i dag ska jag göra den jämn för er”. Hans skara växte till tiotusentals och intog härad i Qiongzhou och Shuzhou; i Pengshan dödade de den hatade häradsmagistraten och stoppade hans buk full med mynt. Wang Xiaobo dödades av en pil i ett slag vid Jiangyuan i slutet av 993, och hans kamrat Li Shun tog över ledningen. I början av 994 intog Li Shun Chengdu, utropade sig till kung av Stora Shu med en egen regeringsdevis och sände sina styrkor ända till Jianmenpasset i norr och Yangtzeravinerna i öster; hans armé misslyckades med en åttio dagar lång belägring av Zizhou. Kejsar Taizong sände eunucken Wang Ji’en med arméer över Qinlingbergen och uppför Yangtze. Chengdu återtogs sommaren 994, varvid omkring 30 000 rebeller dödades, och Li Shun tillfångatogs och avrättades, även om rykten länge gjorde gällande att han hade undkommit. Hans anhängare Zhang Yu fortsatte kampen i östra Sichuan till början av 995, då hans egna män dödade honom. Chengdus nye prefekt, Zhang Yong, sände hem de tillfångatagna rebellerna för att bruka jorden och återställde ordningen.
