Sigismund: Sigismund
Sigismund, son of John III, was king of Poland–Lithuania as well as Sweden, and a Catholic. His Lutheran uncle Duke Charles governed Sweden and had himself chosen regent against the king’s will. In 1598 Sigismund landed at Kalmar with an army of mercenaries to take back control.: Sigismund, son till Johan III, var kung av Polen–Litauen såväl som av Sverige, och katolik. Hans lutherske farbror hertig Karl styrde Sverige och lät utse sig till riksföreståndare mot kungens vilja. År 1598 landsteg Sigismund i Kalmar med en här av legosoldater för att återta kontrollen.
He won a first clash at Stegeborg in September but let Charles escape. Two weeks later, on 25 September 1598, Charles attacked his army at the Stångebro bridges in Linköping and won. Sigismund went back to Poland and was deposed as king of Sweden in 1599, starting a long feud between the Polish and Swedish branches of the Vasa family.: Han vann en första sammandrabbning vid Stegeborg i september men lät Karl komma undan. Två veckor senare, den 25 september 1598, anföll Karl hans här vid Stångebro i Linköping och segrade. Sigismund återvände till Polen och avsattes som kung av Sverige 1599, vilket inledde en lång fejd mellan den polska och den svenska grenen av huset Vasa.
