Sigismund’s troops won, but he let Duke Charles get away with his army largely intact.: Sigismunds trupper segrade, men han lät hertig Karl komma undan med sin här i stort sett intakt.
Charles surprised the royal army at the two bridges over the Stångån. Many of Sigismund’s Swedish supporters refused to fight their countrymen.: Karl överraskade den kungliga hären vid de två broarna över Stångån. Många av Sigismunds svenska anhängare vägrade att strida mot sina landsmän.
