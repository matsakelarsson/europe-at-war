War against Sigismund: Kriget mot Sigismund
Sigismund III Vasa, king of both Poland–Lithuania and Sweden, landed in Sweden in 1598 to assert his rule against his uncle Duke Charles. Beaten at Stångebro, he was deposed in 1599, which began a long feud between the Swedish and Polish branches of the Vasa dynasty.: Sigismund III Vasa, kung av både Polen–Litauen och Sverige, landsteg i Sverige 1598 för att hävda sitt styre mot sin farbror hertig Karl. Sedan han besegrats vid Stångebro avsattes han 1599, vilket inledde en lång fejd mellan Vasaättens svenska och polska grenar.
