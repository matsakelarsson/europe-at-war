# Svenska översättningar av katalogtexten (våg 7); stegtexterna kommer senare.
War in Iraq against the Islamic State: Kriget i Irak mot Islamiska staten
The war in which the Islamic State (ISIS), the successor of al-Qaeda in Iraq, seized a third of Iraq in 2014 and was driven out again by 2017. Exploiting Sunni Arab anger at the Shia-led government of Nuri al-Maliki and the civil war in neighbouring Syria, its fighters took Fallujah in January 2014 and Mosul, Iraq’s second city, in June, and proclaimed a “caliphate” across the Syrian–Iraqi border. They massacred captured soldiers and Shia, and killed and enslaved thousands of Yazidis in a campaign the UN has called genocide. Iraqi forces, Shia volunteer militias of the Popular Mobilization Forces, Kurdish Peshmerga and a US-led coalition providing air power and advisers fought back, retaking Tikrit in 2015, Ramadi and Fallujah in 2016, and Mosul after a nine-month battle in July 2017. Prime Minister Haider al-Abadi declared victory on 9 December 2017, though an ISIS insurgency continued. Tens of thousands of civilians were killed and some five million people were displaced.: Kriget där Islamiska staten (IS), efterföljaren till al-Qaida i Irak, erövrade en tredjedel av Irak 2014 och hade drivits ut igen 2017. Dess kämpar utnyttjade sunniarabernas vrede mot Nuri al-Malikis shiitledda regering och inbördeskriget i grannlandet Syrien; de intog Fallujah i januari 2014 och Mosul, Iraks näst största stad, i juni och utropade ett ”kalifat” över den syrisk-irakiska gränsen. De massakrerade tillfångatagna soldater och shiiter och dödade och förslavade tusentals jezidier i en kampanj som FN har kallat folkmord. Irakiska styrkor, de shiitiska frivilligmiliserna i Folkmobiliseringsstyrkorna, kurdisk peshmerga och en USA-ledd koalition som bidrog med flygstridskrafter och rådgivare slog tillbaka och återtog Tikrit 2015, Ramadi och Fallujah 2016 och Mosul efter ett nio månader långt slag i juli 2017. Premiärminister Haider al-Abadi utropade segern den 9 december 2017, men ett IS-uppror fortsatte. Tiotusentals civila dödades och omkring fem miljoner människor fördrevs från sina hem.
