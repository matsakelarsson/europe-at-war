War in Abkhazia: Kriget i Abchazien
On 14 August 1992, amid a dispute over Abkhazia’s status, Georgian National Guard troops entered the region and took Sukhumi, and the Abkhaz leadership under Vladislav Ardzinba withdrew to Gudauta, where a Russian military base stood. Abkhaz forces, joined by thousands of volunteers from the North Caucasus, among them Shamil Basayev, and helped by arms and air support from parts of the Russian military, took Gagra in October 1992 and, after a ceasefire of July 1993 broke down, Sukhumi on 27 September 1993. Atrocities were committed on both sides, and the Abkhaz victory was followed by the killing and expulsion of ethnic Georgians, the largest group in Abkhazia before the war. About 250,000 people fled or were driven out, which the OSCE called ethnic cleansing. A ceasefire agreed in Moscow in May 1994 was policed by Russian peacekeepers.: Den 14 augusti 1992, mitt i en tvist om Abchaziens status, ryckte georgiska nationalgardestrupper in i regionen och intog Suchumi, och den abchaziska ledningen under Vladislav Ardzinba drog sig tillbaka till Gudauta, där det fanns en rysk militärbas. Abchaziska styrkor, förstärkta av tusentals frivilliga från norra Kaukasus, bland dem Sjamil Basajev, och med hjälp av vapen och flygunderstöd från delar av den ryska militären, intog Gagra i oktober 1992 och, sedan en vapenvila från juli 1993 brutit samman, Suchumi den 27 september 1993. Grymheter begicks av båda sidor, och den abchaziska segern följdes av mord på och fördrivning av etniska georgier, den största folkgruppen i Abchazien före kriget. Omkring 250 000 människor flydde eller fördrevs, vilket OSSE betecknade som etnisk rensning. En vapenvila som överenskoms i Moskva i maj 1994 övervakades av ryska fredsbevarande styrkor.
