Abkhazia is shown as part of Georgia on the map, as it is internationally recognised. Russia officially claimed neutrality; the extent of Russian military help to the Abkhaz side is disputed in detail but widely documented.: Abchazien visas på kartan som en del av Georgien, i enlighet med det internationella erkännandet. Ryssland hävdade officiellt neutralitet; omfattningen av den ryska militära hjälpen till den abchaziska sidan är omstridd i detalj men väl dokumenterad.
Numbers of dead are uncertain; sources give from about 10,000 to 30,000 in all.: Antalet döda är osäkert; källorna anger från omkring 10 000 till 30 000 sammanlagt.
