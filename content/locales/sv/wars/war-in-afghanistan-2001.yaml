# Svenska översättningar av katalogtexten (våg 7); stegtexterna kommer senare.
War in Afghanistan (2001–2021): Kriget i Afghanistan (2001–2021)
? The war that began when the United States and its allies attacked Afghanistan after the al-Qaeda attacks of 11 September 2001, because the Taliban government refused to hand over al-Qaeda’s leader, Osama bin Laden. With US air power and special forces, the Northern Alliance took Kabul in November 2001 and the Taliban lost their last city, Kandahar, in December. A new Afghan state was built under the Bonn Agreement, protected by a NATO-led force, but the Taliban regrouped in Pakistan and from 2006 fought a growing insurgency in the south and east. A US “surge” in 2009–2011 brought foreign troop numbers to about 140,000, and bin Laden was killed in Pakistan in 2011, but the insurgency survived the handover of security to Afghan forces in 2014. After a US–Taliban agreement in February 2020 foreign troops withdrew; the Afghan republic collapsed as the Taliban took Kabul on 15 August 2021, and the last US troops left on 30 August after a chaotic airlift. About 176,000 people were killed in Afghanistan by one widely used estimate, among them some 46,000 civilians.
: Kriget som började när USA och dess allierade angrep Afghanistan efter al-Qaidas attacker den 11 september 2001, eftersom talibanregeringen vägrade att lämna ut al-Qaidas ledare Usama bin Ladin. Med stöd av amerikanskt flyg och amerikanska specialstyrkor intog Norra alliansen Kabul i november 2001, och talibanerna förlorade sin sista stad, Kandahar, i december. En ny afghansk stat byggdes upp enligt Bonnavtalet, skyddad av en Natoledd styrka, men talibanerna omgrupperade sig i Pakistan och förde från 2006 ett växande uppror i söder och öster. Ett amerikanskt ”trupptillskott” 2009–2011 förde upp antalet utländska soldater till omkring 140 000, och bin Ladin dödades i Pakistan 2011, men upproret överlevde överlämnandet av säkerhetsansvaret till afghanska styrkor 2014. Efter ett avtal mellan USA och talibanerna i februari 2020 drogs de utländska trupperna tillbaka; den afghanska republiken föll samman när talibanerna intog Kabul den 15 augusti 2021, och de sista amerikanska trupperna lämnade landet den 30 augusti efter en kaotisk luftbro. Enligt en allmänt använd uppskattning dödades omkring 176 000 människor i Afghanistan, bland dem omkring 46 000 civila.
