War in Amhara: Kriget i Amhara
? Last updated 27 November 2026. The insurgency of the Fano, Amhara nationalist militias, against the Ethiopian federal government of Abiy Ahmed in the Amhara region, which since September 2026 has merged into a wider war. The Fano had fought beside the federal army against the TPLF in the Tigray War, but the Pretoria agreement of 2022, the government’s order in April 2023 to disband the regional special forces and the unresolved fate of Western Tigray turned them against it. In August 2023 Fano fighters briefly took Lalibela, Gondar and other towns, and the government declared a state of emergency. Since then the Fano, divided into regional commands in Gojjam, Gondar, Wollo and Shewa until they united as the Amhara Fano National Movement in January 2026, have controlled much of the countryside while the army holds the towns and main roads and strikes from the air; drone strikes, killings of civilians by all sides and mass arrests have been reported throughout. On 20 September 2026 the Fano joined the TPLF, the Oromo Liberation Army and other groups in an armed coalition against the government, and from 23 September fighting resumed in Tigray and spread along the fronts of Wollo, Wag Hemra and Afar, with Eritrea accused of backing the rebels.
: Senast uppdaterad 27 november 2026. Det uppror som Fano, amhariska nationalistiska miliser, för mot Abiy Ahmeds federala etiopiska regering i Amhararegionen, och som sedan september 2026 har gått upp i ett bredare krig. Fano hade stridit vid den federala arméns sida mot TPLF i Tigraykriget, men Pretoriaavtalet 2022, regeringens order i april 2023 om att upplösa de regionala specialstyrkorna och den olösta frågan om Västra Tigray vände dem mot regeringen. I augusti 2023 intog Fanokämpar för en kort tid Lalibela, Gondar och andra städer, och regeringen utlyste undantagstillstånd. Sedan dess har Fano, som var uppdelade i regionala kommandon i Gojjam, Gondar, Wollo och Shewa tills de enades som Amhara Fano National Movement i januari 2026, kontrollerat stora delar av landsbygden medan armén håller städerna och huvudvägarna och slår till från luften; drönarangrepp, alla sidors dödande av civila och massgripanden har rapporterats under hela perioden. Den 20 september 2026 anslöt sig Fano till TPLF, Oromos befrielsearmé och andra grupper i en väpnad koalition mot regeringen, och från den 23 september återupptogs striderna i Tigray och spred sig längs fronterna i Wollo, Wag Hemra och Afar, samtidigt som Eritrea anklagades för att stödja rebellerna.
