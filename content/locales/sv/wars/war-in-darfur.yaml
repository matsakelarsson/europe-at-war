# Svenska översättningar av katalogtexten (våg 12); stegtexterna kommer senare.
War in Darfur: Kriget i Darfur
? The war in Sudan’s western region of Darfur between rebel movements drawn mainly from the Fur, Masalit and Zaghawa peoples and the government of Omar al-Bashir, which fought them with its army and air force and with Arab militias known as the Janjaweed. The Sudan Liberation Movement/Army (SLM/A) and the Justice and Equality Movement (JEM) rose in 2003 against the region’s neglect and the arming of Arab groups against non-Arab farmers. The government answered with a campaign of bombing and militia raids that burned thousands of villages, killed tens of thousands of civilians and drove some 2–3 million people into camps in Darfur and Chad. The United States called it genocide in 2004; a UN commission found crimes against humanity and war crimes but no proven genocidal policy, and the case went to the International Criminal Court, which in 2009 and 2010 issued arrest warrants for Bashir, the second for genocide. African Union and then joint UN–AU peacekeepers (UNAMID) were deployed, peace agreements in 2006 and 2011 brought in only some of the rebels, and in 2013 the Janjaweed were reorganised as the Rapid Support Forces. The UN estimated about 300,000 deaths by 2008, most from disease and hunger; the government gave 10,000. After Bashir’s fall in 2019 most rebel groups signed the Juba Peace Agreement of October 2020, but Darfur became a battlefield again in the civil war of 2023.
: Kriget i Sudans västra region Darfur mellan rebellrörelser, som främst rekryterades bland fur-, masalit- och zaghawafolken, och Omar al-Bashirs regering, som bekämpade dem med armén och flygvapnet och med arabiska miliser kända som Janjaweed. Sudans befrielserörelse/befrielsearmé (SLM/A) och Rörelsen för rättvisa och jämlikhet (JEM) reste sig 2003 mot försummelsen av regionen och beväpningen av arabiska grupper mot icke-arabiska jordbrukare. Regeringen svarade med en kampanj av bombningar och milisräder som brände tusentals byar, dödade tiotusentals civila och drev omkring 2–3 miljoner människor in i läger i Darfur och Tchad. USA betecknade det som folkmord 2004; en FN-kommission fann brott mot mänskligheten och krigsförbrytelser men ingen bevisad folkmordspolitik, och fallet gick till Internationella brottmålsdomstolen, som 2009 och 2010 utfärdade arresteringsorder mot Bashir, den andra för folkmord. Afrikanska unionens och därefter FN:s och AU:s gemensamma fredsbevarande styrkor (UNAMID) sattes in, fredsavtal 2006 och 2011 omfattade bara en del av rebellerna, och 2013 omorganiserades Janjaweed till Rapid Support Forces. FN uppskattade antalet döda till omkring 300 000 fram till 2008, de flesta av sjukdomar och svält; regeringen uppgav 10 000. Efter Bashirs fall 2019 undertecknade de flesta rebellgrupper Jubafredsavtalet i oktober 2020, men Darfur blev åter ett slagfält i inbördeskriget 2023.
