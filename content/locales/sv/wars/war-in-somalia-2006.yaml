# Svenska översättningar av katalogtexten (våg 12); stegtexterna kommer senare.
War in Somalia (2006–2009): Kriget i Somalia (2006–2009)
? The Ethiopian intervention against the Islamic Courts Union and the insurgency that followed. In December 2006 Ethiopian forces, backing the internationally recognised but powerless Transitional Federal Government, defeated the Courts’ militias around Baidoa and drove them out of Mogadishu and Kismayo within two weeks, with American air strikes against suspected al-Qaeda members in the far south. The occupation of Mogadishu soon provoked an insurgency by former Courts fighters, clan militias and above all al-Shabaab, the Courts’ youth militia, which broke away to fight on its own. Shelling and street fighting in the capital killed thousands of civilians and drove hundreds of thousands into camps; African Union peacekeepers (AMISOM) arrived from March 2007. By late 2008 the insurgents held most of the south. A peace deal signed in Djibouti between the government and the moderate wing of the old Courts, led by Sharif Sheikh Ahmed, opened the way for Ethiopia’s withdrawal in January 2009 and Sharif’s election as president; al-Shabaab rejected it and fought on.
: Den etiopiska interventionen mot Islamiska domstolarnas union och det uppror som följde. I december 2006 besegrade etiopiska styrkor, som stödde den internationellt erkända men maktlösa federala övergångsregeringen, domstolarnas miliser kring Baidoa och drev ut dem ur Mogadishu och Kismayo inom två veckor, medan amerikanska flyganfall riktades mot misstänkta al-Qaidamedlemmar längst i söder. Ockupationen av Mogadishu framkallade snart ett uppror av före detta domstolskämpar, klanmiliser och framför allt al-Shabaab, domstolarnas ungdomsmilis, som bröt sig loss för att strida på egen hand. Beskjutning och gatustrider i huvudstaden dödade tusentals civila och drev hundratusentals in i läger; Afrikanska unionens fredsbevarande styrkor (AMISOM) anlände från mars 2007. I slutet av 2008 behärskade upprorsmännen större delen av södern. Ett fredsavtal som undertecknades i Djibouti mellan regeringen och den moderata flygeln av de gamla domstolarna, ledd av Sharif Sheikh Ahmed, öppnade vägen för Etiopiens tillbakadragande i januari 2009 och för valet av Sharif till president; al-Shabaab förkastade avtalet och fortsatte striden.
