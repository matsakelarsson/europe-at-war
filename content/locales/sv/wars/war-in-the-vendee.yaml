The insurgent region, the “Vendée militaire”, took in parts of four départements, Vendée, Maine-et-Loire, Loire-Inférieure (today Loire-Atlantique) and Deux-Sèvres. North of the Loire a related guerrilla war, the Chouannerie, went on in Brittany, Maine and Normandy until 1800, and smaller risings followed in the Vendée in 1799, 1815 and 1832.: "Upprorsområdet, ”Vendée militaire”, omfattade delar av fyra departement: Vendée, Maine-et-Loire, Loire-Inférieure (i dag Loire-Atlantique) och Deux-Sèvres. Norr om Loire pågick ett besläktat gerillakrig, chouanupproret (Chouannerie), i Bretagne, Maine och Normandie fram till 1800, och mindre resningar följde i Vendée 1799, 1815 och 1832."
Estimates of the dead have varied widely and are still debated. One recent estimate is about 200,000 in all, some 170,000 of them people of the insurgent region, a fifth or more of its population.: Uppskattningarna av antalet döda har varierat kraftigt och diskuteras fortfarande. En nyare uppskattning är omkring 200 000 sammanlagt, varav omkring 170 000 var invånare i upprorsområdet, en femtedel eller mer av dess befolkning.
