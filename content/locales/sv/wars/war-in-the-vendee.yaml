In March 1793, when the Republic ordered a levy of 300,000 men for its armies, the countryside south of the lower Loire rose in revolt. Its peasants already resented the Revolution’s treatment of the Church, which had driven out the priests who refused to swear the oath to the new constitution. At Machecoul insurgents killed well over a hundred republicans in the first weeks. The rebels chose leaders from among themselves, such as the carter Jacques Cathelineau and the gamekeeper Jean-Nicolas Stofflet, and from the local nobles, such as Charette, Bonchamps, d’Elbée and Henri de La Rochejaquelein. Their Catholic and Royal Army took Thouars, Fontenay, Saumur and Angers in May and June, but its attack on Nantes on 29 June failed, and Cathelineau was mortally wounded.: I mars 1793, när republiken beordrade en utskrivning av 300 000 man till sina arméer, reste sig landsbygden söder om nedre Loire i revolt. Bönderna där var redan förbittrade över revolutionens behandling av kyrkan, som hade drivit bort de präster som vägrade svära eden på den nya konstitutionen. I Machecoul dödade upprorsmän långt över hundra republikaner under de första veckorna. Rebellerna valde ledare ur sina egna led, som formannen Jacques Cathelineau och skogvaktaren Jean-Nicolas Stofflet, och bland den lokala adeln, som Charette, Bonchamps, d’Elbée och Henri de La Rochejaquelein. Deras katolska och kungliga armé intog Thouars, Fontenay, Saumur och Angers i maj och juni, men dess anfall mot Nantes den 29 juni misslyckades, och Cathelineau blev dödligt sårad.
The Convention ordered the Vendée to be destroyed and sent in the veteran Army of Mainz, freed by that city’s surrender. The Vendéans won at Torfou in September but were beaten at Cholet on 17 October, where d’Elbée and Bonchamps were mortally wounded; Bonchamps, dying, ordered his men to spare some 5,000 republican prisoners. Perhaps 60,000 to 100,000 people, soldiers with women, children and old people, then crossed the Loire at Saint-Florent-le-Vieil, hoping to meet a British fleet. They failed to take the port of Granville in November and turned back, and were destroyed at Le Mans on 12–13 December and at Savenay on 23 December, where thousands were killed in the fighting and the massacres that followed.: Konventet beordrade att Vendée skulle förstöras och sände dit den krigsvana Mainzarmén, som hade frigjorts genom den stadens kapitulation. Vendéerna segrade vid Torfou i september men besegrades vid Cholet den 17 oktober, där d’Elbée och Bonchamps blev dödligt sårade; den döende Bonchamps beordrade sina män att skona omkring 5 000 republikanska fångar. Kanske 60 000–100 000 människor, soldater tillsammans med kvinnor, barn och gamla, gick sedan över Loire vid Saint-Florent-le-Vieil i hopp om att möta en brittisk flotta. De misslyckades med att inta hamnstaden Granville i november och vände tillbaka, och förintades vid Le Mans den 12–13 december och vid Savenay den 23 december, där tusentals dödades i striderna och de massakrer som följde.
