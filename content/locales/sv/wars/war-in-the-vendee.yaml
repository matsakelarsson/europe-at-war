War in the Vendée: Upproret i Vendée
A royalist and Catholic rising in western France, south of the lower Loire, against the French Republic. Sparked by conscription in March 1793, the Catholic and Royal Army won a string of victories that summer but was destroyed after crossing the Loire, and the Republic’s repression killed tens of thousands of prisoners and civilians before the last leaders were captured and shot in 1796.: Ett rojalistiskt och katolskt uppror i västra Frankrike, söder om nedre Loire, mot Franska republiken. Upproret utlöstes av utskrivningarna i mars 1793, och den katolska och kungliga armén vann en rad segrar den sommaren men förintades efter att ha gått över Loire, och republikens repression dödade tiotusentals fångar och civila innan de sista ledarna tillfångatogs och arkebuserades 1796.
