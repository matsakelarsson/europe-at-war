The Republic’s revenge fell on prisoners and civilians alike. In Nantes the representative on mission Jean-Baptiste Carrier had prisoners, among them priests, women and children, drowned in the Loire from November 1793 to February 1794, perhaps 4,000 or more, and thousands more were shot or guillotined there and at Angers. From January 1794 General Louis-Marie Turreau sent twelve “infernal columns” across the region with orders to burn villages and kill the rebels, and they killed tens of thousands of people, many of them not rebels at all; at Les Lucs-sur-Boulogne in February some hundreds of villagers were massacred. The killing revived the revolt, and Charette and Stofflet fought on in the bocage.: Republikens hämnd drabbade fångar och civila lika. I Nantes lät konventskommissarien Jean-Baptiste Carrier dränka fångar, bland dem präster, kvinnor och barn, i Loire från november 1793 till februari 1794, kanske 4 000 eller fler, och ytterligare tusentals sköts eller giljotinerades där och i Angers. Från januari 1794 sände general Louis-Marie Turreau tolv ”helvetiska kolonner” genom området med order att bränna byar och döda rebellerna, och de dödade tiotusentals människor, av vilka många inte alls var rebeller; i Les Lucs-sur-Boulogne massakrerades i februari flera hundra bybor. Dödandet blåste nytt liv i upproret, och Charette och Stofflet fortsatte striden i bocagelandskapet.
After the fall of Robespierre in July 1794 the Republic changed course. By the Treaty of La Jaunaye on 17 February 1795 Charette made peace in return for an amnesty, freedom of worship and exemption from conscription, and Stofflet followed in May. But in June 1795 British ships landed émigré regiments on the Quiberon peninsula in Brittany, and Charette took up arms again. General Lazare Hoche crushed the landing in July and set about pacifying the west with both force and concessions. Stofflet was captured and shot at Angers on 25 February 1796, and Charette, taken in the woods near La Chabotterie, was shot at Nantes on 29 March. By the summer the west was at peace.: Efter Robespierres fall i juli 1794 ändrade republiken kurs. Genom fördraget i La Jaunaye den 17 februari 1795 slöt Charette fred mot amnesti, religionsfrihet och befrielse från värnplikt, och Stofflet följde efter i maj. Men i juni 1795 landsatte brittiska fartyg emigrantregementen på halvön Quiberon i Bretagne, och Charette grep åter till vapen. General Lazare Hoche krossade landstigningen i juli och tog itu med att pacificera västra Frankrike med både våld och eftergifter. Stofflet tillfångatogs och sköts i Angers den 25 februari 1796, och Charette, som togs i skogarna nära La Chabotterie, sköts i Nantes den 29 mars. På sommaren rådde fred i väster.
