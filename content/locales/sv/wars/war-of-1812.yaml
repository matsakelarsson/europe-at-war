# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
War of 1812: Brittisk-amerikanska kriget 1812
? The war between the United States and the United Kingdom, with its colonies in Canada and its Native allies, from 1812 to 1815. The United States declared war on 18 June 1812 over British restrictions on its trade with Napoleonic France, the impressment of American sailors into the Royal Navy and British support for the Native nations resisting American expansion in the Northwest, and many Americans hoped to conquer Canada. American invasions of Upper and Lower Canada failed in 1812 and 1813, against British regulars, Canadian militia and Native warriors, among them Tecumseh’s confederacy, whose leader was killed at the Thames in 1813 after the American naval victory on Lake Erie. York, the capital of Upper Canada, was burned in 1813, and after Napoleon’s fall British forces burned Washington in August 1814, but were beaten off at Baltimore and on Lake Champlain at Plattsburgh in September. The Treaty of Ghent, signed on 24 December 1814, restored the pre-war borders; before the news arrived, Andrew Jackson defeated the British attack on New Orleans on 8 January 1815. The war ended Native hopes of British-backed resistance south of the Great Lakes and became a founding story for Canadians; some Americans came to remember it as a “second war of independence”.
: Kriget mellan USA och Förenade kungariket, med dess kolonier i Kanada och dess ursprungsamerikanska allierade, från 1812 till 1815. USA förklarade krig den 18 juni 1812 på grund av de brittiska inskränkningarna i dess handel med Napoleons Frankrike, tvångsrekryteringen av amerikanska sjömän till Royal Navy och det brittiska stödet till de ursprungsnationer som gjorde motstånd mot den amerikanska expansionen i nordväst, och många amerikaner hoppades kunna erövra Kanada. Amerikanska invasioner av Övre och Nedre Kanada misslyckades 1812 och 1813 mot brittiska reguljära trupper, kanadensisk milis och ursprungsamerikanska krigare, bland dem Tecumsehs förbund, vars ledare stupade vid Thames 1813 efter den amerikanska sjösegern på Eriesjön. York, Övre Kanadas huvudstad, brändes 1813, och efter Napoleons fall brände brittiska styrkor Washington i augusti 1814, men de slogs tillbaka vid Baltimore och på Champlainsjön vid Plattsburgh i september. Freden i Gent, som undertecknades den 24 december 1814, återställde gränserna från före kriget; innan nyheten hade nått fram slog Andrew Jackson tillbaka det brittiska anfallet mot New Orleans den 8 januari 1815. Kriget gjorde slut på urfolkens förhoppningar om ett motstånd med brittiskt stöd söder om Stora sjöarna och blev en grundberättelse för kanadensarna; en del amerikaner kom att minnas det som ett ”andra frihetskrig”.
United States (with Seneca and other New York Haudenosaunee, Choctaw, Cherokee and Muscogee allies): USA (med allierade bland seneca och andra haudenosaunee i New York, choctaw, cherokeser och muscogee)
United Kingdom, with Upper and Lower Canada, Nova Scotia and New Brunswick (British regulars, Canadian militia and the Colonial Marines): Förenade kungariket, med Övre och Nedre Kanada, Nova Scotia och New Brunswick (brittiska reguljära trupper, kanadensisk milis och Colonial Marines)
Tecumseh’s confederacy and other Native allies of Britain (Shawnee, Potawatomi, Wyandot, Odawa, Ojibwe, Sauk, Kickapoo, Grand River Haudenosaunee, Kahnawake Mohawk and others): Tecumsehs förbund och Storbritanniens övriga ursprungsamerikanska allierade (shawnee, potawatomi, wyandot, odawa, ojibwe, sauk, kickapoo, haudenosaunee från Grand River, mohawker från Kahnawake med flera)
