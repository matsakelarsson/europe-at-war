# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
War of 1912 in Cuba: Kriget 1912 på Kuba
? The armed protest of the Partido Independiente de Color (Independent Party of Colour) in 1912 and the government campaign that crushed it, in which thousands of Afro-Cubans were killed. It is also called the Little Race War (la Guerrita de las Razas), the Race War of 1912 and the Negro Rebellion, and in Cuba often the Massacre of 1912. Afro-Cubans had made up a large part of the Liberation Army in the wars of independence, but under the republic they were largely shut out of public jobs, land and political office. In 1908 veterans led by Evaristo Estenoz and Pedro Ivonnet founded the Partido Independiente de Color to press for equal rights. In 1910 Congress passed the Morúa Amendment to the electoral law, which banned parties formed on racial lines, and President José Miguel Gómez’s government had the party disbanded and its leaders jailed for a time. On 20 May 1912 party members took up arms to force the repeal of the ban, mainly in Oriente, where many Afro-Cubans worked on the sugar and coffee estates, with smaller groups in Las Villas. The government, the army under General José de Jesús Monteagudo and volunteer militias answered with a campaign of killings in the countryside of Oriente, where many Black Cubans who had not taken up arms were shot or hanged, while the press spread fear of a Black uprising. The United States landed marines to guard American sugar estates, mines and railways, with about 2,800 men in Cuba by June; the rebels fought them only once, at El Cuero. Estenoz was killed on 27 June and Ivonnet on 18 July, after he had surrendered, and the rising was over. Estimates of the dead range from about 2,000 to 6,000, nearly all Afro-Cubans; losses on the government side were small. The party was destroyed, and the last marines left on 2 August.
: Den väpnade protesten 1912 från Partido Independiente de Color (De färgades oberoende parti) och den regeringskampanj som krossade den, då tusentals afrokubaner dödades. Den kallas också det lilla raskriget (la Guerrita de las Razas), raskriget 1912 och ”Negro Rebellion”, och på Kuba ofta massakern 1912. Afrokubaner hade utgjort en stor del av befrielsearmén i självständighetskrigen, men under republiken var de i stort sett utestängda från offentliga tjänster, jord och politiska ämbeten. År 1908 grundade veteraner under ledning av Evaristo Estenoz och Pedro Ivonnet Partido Independiente de Color för att driva kravet på lika rättigheter. År 1910 antog kongressen Morúatillägget till vallagen, som förbjöd partier bildade efter rasmässiga linjer, och president José Miguel Gómez regering lät upplösa partiet och fängsla dess ledare en tid. Den 20 maj 1912 grep partimedlemmar till vapen för att tvinga fram ett upphävande av förbudet, främst i Oriente, där många afrokubaner arbetade på socker- och kaffeplantagerna, med mindre grupper i Las Villas. Regeringen, armén under general José de Jesús Monteagudo och frivilliga miliser svarade med en kampanj av dödande på landsbygden i Oriente, där många svarta kubaner som inte hade gripit till vapen sköts eller hängdes, medan pressen spred skräck för ett svart uppror. USA landsatte marinkårssoldater för att skydda amerikanska sockerplantager, gruvor och järnvägar, med omkring 2 800 man på Kuba i juni; rebellerna stred mot dem bara en gång, vid El Cuero. Estenoz dödades den 27 juni och Ivonnet den 18 juli, sedan han hade gett sig, och resningen var över. Uppskattningarna av antalet döda sträcker sig från omkring 2 000 till 6 000, nästan alla afrokubaner; förlusterna på regeringssidan var små. Partiet utplånades, och de sista marinkårssoldaterna lämnade landet den 2 augusti.
