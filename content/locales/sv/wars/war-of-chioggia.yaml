War of Chioggia: Chioggiakriget
The fourth war between Venice and Genoa, fought over the island of Tenedos at the mouth of the Dardanelles. Allied with Hungary and Padua, the Genoese destroyed the Venetian fleet off Pola and took Chioggia in the Venetian lagoon in 1379, but Venice blockaded them there and forced their surrender in June 1380; the Peace of Turin in 1381 gave neither side much, but Genoa never again threatened Venice at home.: Det fjärde kriget mellan Venedig och Genua, utkämpat om ön Tenedos vid Dardanellernas mynning. I allians med Ungern och Padua förintade genueserna den venetianska flottan utanför Pola och intog Chioggia i den venetianska lagunen 1379, men Venedig blockerade dem där och tvingade dem att kapitulera i juni 1380; freden i Turin 1381 gav ingen av parterna mycket, men Genua hotade aldrig mer Venedig på hemmaplan.
