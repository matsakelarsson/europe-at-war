Venice’s only ally of note was Bernabò Visconti of Milan, who attacked Genoa by land but gave little direct help. Genoa’s allies were Louis I of Hungary, Francesco da Carrara of Padua and the Patriarch of Aquileia.: Venedigs enda betydande bundsförvant var Bernabò Visconti av Milano, som anföll Genua till lands men gav föga direkt hjälp. Genuas allierade var Ludvig I av Ungern, Francesco da Carrara av Padua och patriarken av Aquileia.
Guns were used on both sides, in the siege of Chioggia and on board ship, one of the first times in Italian warfare. Numbers of ships and men differ between sources.: Kanoner användes på båda sidor, vid belägringen av Chioggia och ombord på fartyg, en av de första gångerna i italiensk krigföring. Antalet fartyg och män skiljer sig mellan källorna.
Genoese and allied moves: Genuesiska och allierade trupprörelser
Genoese and allied success: Genuesiska och allierade framgångar
Venice and Genoa, the great trading rivals of the eastern Mediterranean, had fought three wars since the 1250s. A fourth broke out over Tenedos, an island that guarded the entrance to the Dardanelles and the route to the Black Sea. In 1376 the Byzantine emperor John V Palaiologos granted it to Venice, and Genoa, backing his rebellious son Andronikos IV, tried to take it. Genoa gathered a strong coalition, with Louis I of Hungary, who had taken Dalmatia from Venice in 1358, Francesco da Carrara, lord of Padua, and the Patriarch of Aquileia.: Venedig och Genua, de stora handelsrivalerna i östra Medelhavet, hade utkämpat tre krig sedan 1250-talet. Ett fjärde bröt ut om Tenedos, en ö som bevakade inloppet till Dardanellerna och vägen till Svarta havet. År 1376 överlät den bysantinske kejsaren Johannes V Palaiologos ön till Venedig, och Genua, som stödde hans upproriske son Andronikos IV, försökte ta den. Genua samlade en stark koalition, med Ludvig I av Ungern, som hade tagit Dalmatien från Venedig 1358, Francesco da Carrara, herre över Padua, och patriarken av Aquileia.
On 30 May 1378 the Venetian admiral Vettor Pisani beat a Genoese squadron off Anzio, but on 7 May 1379, off Pola in Istria, the Genoese under Luciano Doria destroyed his fleet. Doria was killed in the battle, and Pisani was imprisoned for his defeat. A new Genoese fleet under Pietro Doria entered the Adriatic and, with Paduan troops attacking from the mainland, broke into the lagoon and took Chioggia, at its southern end, on 16 August 1379. Venice was cut off by sea and land, and Doria rejected its offer of terms; he is said to have sworn to bridle the bronze horses of St Mark’s.: Den 30 maj 1378 besegrade den venetianske amiralen Vettor Pisani en genuesisk eskader utanför Anzio, men den 7 maj 1379 förintade genueserna under Luciano Doria hans flotta utanför Pola i Istrien. Doria stupade i slaget, och Pisani fängslades för sitt nederlag. En ny genuesisk flotta under Pietro Doria seglade in i Adriatiska havet och bröt sig, medan paduanska trupper anföll från fastlandet, in i lagunen och intog Chioggia vid dess södra ände den 16 augusti 1379. Venedig var avskuret till sjöss och till lands, och Doria avvisade stadens erbjudande om förhandlingar; han lär ha svurit att lägga betsel på bronshästarna vid San Marco.
