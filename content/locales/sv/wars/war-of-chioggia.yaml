Venice released Pisani to popular acclaim and armed every vessel it could. On the night of 22 December 1379 Pisani and Doge Andrea Contarini sank barges loaded with stones in the channels around Chioggia, trapping the Genoese fleet inside the lagoon. On 1 January 1380 Carlo Zeno came back with his galleys from raiding Genoese shipping in the eastern Mediterranean, and the besiegers were themselves besieged. Pietro Doria was killed by a Venetian cannon ball, and a Genoese relief fleet failed to break through in May.: Venedig frigav Pisani under folkets jubel och rustade varje fartyg staden kunde uppbringa. Natten till den 22 december 1379 sänkte Pisani och dogen Andrea Contarini pråmar lastade med sten i kanalerna kring Chioggia och stängde därmed in den genuesiska flottan i lagunen. Den 1 januari 1380 återvände Carlo Zeno med sina galärer från räder mot genuesisk sjöfart i östra Medelhavet, och belägrarna blev själva belägrade. Pietro Doria dödades av en venetiansk kanonkula, och en genuesisk undsättningsflotta misslyckades med att bryta igenom i maj.
On 24 June 1380 the starving Genoese in Chioggia surrendered, some 4,000 of them by most accounts. The war went on at sea and on the mainland, and in 1381 Venice handed Treviso to Duke Leopold III of Austria rather than let it fall to Padua. Exhausted, both sides accepted the mediation of Count Amadeus VI of Savoy. In the Peace of Turin of 8 August 1381 Tenedos was handed over to Savoy, its fortifications were razed and its people moved away, and Venice agreed to pay Hungary a yearly tribute and accepted the loss of Dalmatia. Genoa never again threatened Venice in its lagoon.: Den 24 juni 1380 kapitulerade de svältande genueserna i Chioggia, enligt de flesta uppgifter omkring 4 000 man. Kriget fortsatte till sjöss och på fastlandet, och 1381 överlämnade Venedig Treviso till hertig Leopold III av Österrike hellre än att låta staden falla i Paduas händer. Utmattade godtog båda sidor medling av greve Amadeus VI av Savojen. Genom freden i Turin den 8 augusti 1381 överlämnades Tenedos till Savojen, dess befästningar raserades och dess invånare flyttades bort, och Venedig gick med på att betala Ungern en årlig tribut och godtog förlusten av Dalmatien. Genua hotade aldrig mer Venedig i dess lagun.
