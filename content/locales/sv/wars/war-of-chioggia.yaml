Pisani’s ten galleys beat eleven Genoese galleys off the coast south of Rome and captured their commander, Luigi Fieschi.: Pisanis tio galärer besegrade elva genuesiska galärer utanför kusten söder om Rom och tillfångatog deras befälhavare, Luigi Fieschi.
