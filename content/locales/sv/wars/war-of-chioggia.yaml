Pisani, ordered out against his judgement, lost all but six of his galleys. Luciano Doria was killed early in the fighting.: Pisani, som mot sitt eget omdöme beordrats ut, förlorade alla utom sex av sina galärer. Luciano Doria stupade tidigt i striden.
