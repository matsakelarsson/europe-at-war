Venice gave the city to Leopold III to keep it from the Carraresi. Leopold sold it to Padua in 1384, and Venice won it back in 1388.: Venedig gav staden till Leopold III för att hålla den undan familjen Carrara. Leopold sålde den till Padua 1384, och Venedig återvann den 1388.
