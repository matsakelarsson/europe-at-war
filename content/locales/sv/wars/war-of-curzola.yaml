War of Curzola: Curzolakriget
The second great war between Venice and Genoa, named after the sea battle off the Dalmatian island of Curzola (Korčula). After the fall of Acre in 1291 the two republics fought for the trade of the Levant and the Black Sea. The Genoese beat a Venetian fleet at Laiazzo (Ayas) in Cilician Armenia in 1294 and attacked the Venetians in Constantinople; Venetian fleets raided Genoese Pera and in 1296 took Caffa in the Crimea. In September 1298 the Genoese admiral Lamba Doria destroyed the Venetian fleet under Andrea Dandolo off Curzola, taking thousands of prisoners; Dandolo is said to have killed himself in captivity, and Marco Polo, by tradition captured in the war, dictated the story of his travels in a Genoese prison. Exhausted, the two republics made peace at Milan on 25 May 1299, through the mediation of Matteo Visconti, on terms that left neither side the clear winner.: Det andra stora kriget mellan Venedig och Genua, uppkallat efter sjöslaget vid den dalmatiska ön Curzola (Korčula). Efter Akkos fall 1291 kämpade de båda republikerna om handeln i Levanten och Svarta havet. Genueserna besegrade en venetiansk flotta vid Laiazzo (Ayas) i Kilikiska Armenien 1294 och angrep venetianerna i Konstantinopel; venetianska flottor härjade det genuesiska Pera och intog 1296 Caffa på Krim. I september 1298 förintade den genuesiske amiralen Lamba Doria den venetianska flottan under Andrea Dandolo vid Curzola och tog tusentals fångar; Dandolo sägs ha tagit sitt liv i fångenskapen, och Marco Polo, som enligt traditionen tillfångatogs i kriget, dikterade berättelsen om sina resor i ett genuesiskt fängelse. Utmattade slöt de båda republikerna fred i Milano den 25 maj 1299, genom Matteo Viscontis medling, på villkor som inte gjorde någon av parterna till klar segrare.
Venice: Venedig
Genoa: Genua
