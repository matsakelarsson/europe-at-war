War of Devolution: Devolutionskriget
Louis XIV’s war to claim part of the Spanish Netherlands for his wife, Maria Theresa, daughter of Philip IV of Spain, under a custom of Brabant (the right of “devolution”) that favoured the children of a first marriage over those of a second. After Philip’s death in 1665, Turenne’s army invaded in May 1667 and took Charleroi, Tournai, Douai, Oudenaarde and, on 28 August, Lille, meeting little resistance from the weak Spanish forces. In February 1668 the Prince of Condé overran Franche-Comté in about two weeks. Alarmed by French success, England, the Dutch Republic and Sweden formed the Triple Alliance in January 1668 to press for peace. In the Treaty of Aix-la-Chapelle (Aachen) of 2 May 1668 France gave back Franche-Comté but kept Lille, Douai, Tournai, Oudenaarde, Courtrai, Charleroi and other towns in Flanders and Hainaut, which Vauban soon fortified. Louis resented the Dutch for the alliance, and four years later attacked them.: Ludvig XIV:s krig för att göra anspråk på en del av Spanska Nederländerna för sin hustru Maria Teresia, dotter till Filip IV av Spanien, med stöd av en brabantisk sedvana (”devolutionsrätten”) som gav barn i ett första äktenskap företräde framför barn i ett andra. Efter Filips död 1665 invaderade Turennes armé i maj 1667 och intog Charleroi, Tournai, Douai, Oudenaarde och den 28 augusti Lille, med föga motstånd från de svaga spanska styrkorna. I februari 1668 överrumplade prinsen av Condé Franche-Comté på ungefär två veckor. Oroade av de franska framgångarna bildade England, Nederländska republiken och Sverige trippelalliansen i januari 1668 för att driva fram en fred. Genom freden i Aix-la-Chapelle (Aachen) den 2 maj 1668 lämnade Frankrike tillbaka Franche-Comté men behöll Lille, Douai, Tournai, Oudenaarde, Courtrai, Charleroi och andra städer i Flandern och Hainaut, som Vauban snart befäste. Ludvig förlät inte nederländarna alliansen och anföll dem fyra år senare.
