The papacy fought on Venice’s side until December 1482 and against it afterwards. The war is also called the Salt War, after a dispute over salt from the Venetian saltworks.: Påvedömet stred på Venedigs sida till december 1482 och mot det därefter. Kriget kallas också Saltkriget, efter en tvist om salt från de venetianska saltverken.
