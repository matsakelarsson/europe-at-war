War of Ferrara, 1482–1484: Ferrarakriget 1482–1484
A war in which Venice, at first allied with Pope Sixtus IV, attacked Ercole I d’Este, Duke of Ferrara, who was backed by Naples, Milan, Florence and Mantua. On 21 August 1482 the papal and Venetian army under Roberto Malatesta beat the Neapolitans of Alfonso, Duke of Calabria, at Campomorto near Velletri, but in December Sixtus changed sides and later put Venice under interdict. Venetian forces overran the Polesine and threatened Ferrara itself, while the allies attacked Venetian territory in Lombardy. Exhausted, the powers made peace at Bagnolo on 7 August 1484; Venice kept the Polesine of Rovigo, and Sixtus, who had wanted a different outcome, died a few days later.: Ett krig där Venedig, till en början allierat med påven Sixtus IV, anföll Ercole I d’Este, hertig av Ferrara, som stöddes av Neapel, Milano, Florens och Mantua. Den 21 augusti 1482 besegrade den påvliga och venetianska armén under Roberto Malatesta neapolitanerna under Alfonso, hertig av Kalabrien, vid Campomorto nära Velletri, men i december bytte Sixtus sida och belade senare Venedig med interdikt. Venetianska styrkor överrumplade Polesine och hotade själva Ferrara, medan de allierade anföll venetianskt territorium i Lombardiet. Utmattade slöt makterna fred i Bagnolo den 7 augusti 1484; Venedig behöll Polesine di Rovigo, och Sixtus, som hade önskat en annan utgång, dog några dagar senare.
