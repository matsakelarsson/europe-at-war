# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
War of Jenkins’ Ear: Kriget om Jenkins öra
? A war between Great Britain and Spain in the Caribbean and on the border between Georgia and Spanish Florida. British merchants resented the Spanish coast guards who searched their ships for contraband, and the opposition to Robert Walpole made a cause of Captain Robert Jenkins, whose ear a Spanish officer had cut off in 1731; Spain and Britain also disputed the land between Georgia, founded in 1733, and Florida. Britain declared war in October 1739. Admiral Edward Vernon took Porto Bello on the Isthmus of Panama in November 1739, but the great expedition against Cartagena de Indias in 1741 was beaten by Blas de Lezo’s defence and by yellow fever, and an attempt on Santiago de Cuba also failed. On the mainland James Oglethorpe of Georgia besieged Saint Augustine in 1740 and was defeated at Fort Mose by Spanish troops and the free Black militia of Francisco Menéndez; in 1742 a Spanish invasion of Georgia was turned back on St. Simons Island at Gully Hole Creek and Bloody Marsh. From 1742 the war merged into the War of the Austrian Succession, and the Treaty of Aix-la-Chapelle in 1748 restored the state before the war.
: Ett krig mellan Storbritannien och Spanien i Karibien och vid gränsen mellan Georgia och Spanska Florida. Brittiska köpmän var förbittrade på de spanska kustbevakarna som genomsökte deras skepp efter smuggelgods, och oppositionen mot Robert Walpole gjorde en stridsfråga av kapten Robert Jenkins, vars öra en spansk officer hade skurit av 1731; Spanien och Storbritannien tvistade också om landet mellan Georgia, som grundats 1733, och Florida. Storbritannien förklarade krig i oktober 1739. Amiral Edward Vernon intog Porto Bello på Panamanäset i november 1739, men den stora expeditionen mot Cartagena de Indias 1741 slogs tillbaka av Blas de Lezos försvar och av gula febern, och ett försök mot Santiago de Cuba misslyckades också. På fastlandet belägrade James Oglethorpe från Georgia S:t Augustine 1740 och besegrades vid Fort Mose av spanska trupper och Francisco Menéndez fria svarta milis; 1742 slogs en spansk invasion av Georgia tillbaka på St. Simons Island vid Gully Hole Creek och Bloody Marsh. Från 1742 gick kriget upp i österrikiska tronföljdskriget, och freden i Aachen 1748 återställde läget från före kriget.
