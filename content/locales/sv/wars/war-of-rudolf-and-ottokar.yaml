Ottokar II, king of Bohemia since 1253, had built up the largest realm in the Empire. He took Austria in 1251, Styria after beating the Hungarians in 1260, the Egerland in 1266, and Carinthia and Carniola in 1269. When the electors chose Count Rudolf of Habsburg as king of the Romans in 1273, Ottokar refused to recognise him. A diet at Nuremberg in 1274 ordered all imperial lands taken since 1250 to be given back; Ottokar ignored the summons to answer for his, was placed under the imperial ban, and in June 1276 Rudolf declared war.: Ottokar II, kung av Böhmen sedan 1253, hade byggt upp det största väldet inom riket. Han tog Österrike 1251, Steiermark sedan han besegrat ungrarna 1260, Egerland 1266 och Kärnten och Krain 1269. När kurfurstarna valde greve Rudolf av Habsburg till romersk kung 1273 vägrade Ottokar att erkänna honom. En riksdag i Nürnberg 1274 beslöt att alla riksländer som tagits sedan 1250 skulle återlämnas; Ottokar struntade i kallelsen att stå till svars för sina, förklarades i riksacht, och i juni 1276 förklarade Rudolf krig.
Rudolf won over Duke Henry XIII of Lower Bavaria, Ottokar’s ally, and marched down the Danube into Austria, where towns and nobles came over to him, while Count Meinhard II of Tyrol led a second army through Carinthia into Styria. In Bohemia the powerful Vítkovci clan rose against Ottokar. With Vienna under siege and his support crumbling, Ottokar gave in. On 21 November 1276 he renounced Austria, Styria, Carinthia, Carniola and the Egerland, and he received Bohemia and Moravia back from Rudolf as fiefs. His son Wenceslaus was betrothed to Rudolf’s daughter Judith.: Rudolf vann över hertig Henrik XIII av Niederbayern, Ottokars bundsförvant, och marscherade nedför Donau in i Österrike, där städer och adelsmän gick över till honom, medan greve Meinhard II av Tyrolen ledde en andra armé genom Kärnten in i Steiermark. I Böhmen reste sig den mäktiga släkten Vítkovci mot Ottokar. Med Wien belägrat och sitt stöd i upplösning gav Ottokar upp. Den 21 november 1276 avsade han sig Österrike, Steiermark, Kärnten, Krain och Egerland och fick Böhmen och Mähren tillbaka av Rudolf som län. Hans son Wenzel trolovades med Rudolfs dotter Judit.
