The town held out. Ottokar gave up the siege when he learned that Rudolf had marched into the Marchfeld.: Staden höll stånd. Ottokar avbröt belägringen när han fick veta att Rudolf hade marscherat in i Marchfeld.
26 August 1278: 26 augusti 1278
Also called the battle of Dürnkrut and Jedenspeigen. A hidden reserve decided the day; such an ambush was thought dishonourable, and its commander apologised to his men in advance.: Kallas också slaget vid Dürnkrut och Jedenspeigen. En dold reserv avgjorde dagen; ett sådant bakhåll ansågs vanhedrande, och dess befälhavare bad sina män om ursäkt i förväg.
Rudolf had Ottokar’s body laid out in the Minorite church. It was taken to Prague only in 1297.: Rudolf lät lägga ut Ottokars kropp i minoritkyrkan. Den fördes till Prag först 1297.
