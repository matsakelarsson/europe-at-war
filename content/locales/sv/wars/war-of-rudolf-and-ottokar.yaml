Given up by Ottokar, 21 November 1276: Avträtt av Ottokar 21 november 1276
Ottokar soon quarrelled with Rudolf over how the treaty was carried out, and he found allies among the margraves of Brandenburg, the Polish and Silesian princes and, again, Henry XIII of Lower Bavaria. Rudolf won over the Viennese with new privileges and allied with the young King Ladislaus IV of Hungary. In the summer of 1278 Ottokar invaded Lower Austria and besieged Drosendorf and then Laa an der Thaya. Rudolf left Vienna and marched north-east into the Marchfeld, the plain along the river Morava, where Hungarian and Cuman horsemen joined him.: Ottokar råkade snart i tvist med Rudolf om hur fördraget skulle genomföras, och han fann allierade bland markgrevarna av Brandenburg, de polska och schlesiska furstarna och, återigen, Henrik XIII av Niederbayern. Rudolf vann över wienarna med nya privilegier och allierade sig med den unge kung Ladislaus IV av Ungern. Sommaren 1278 invaderade Ottokar Niederösterreich och belägrade Drosendorf och sedan Laa an der Thaya. Rudolf lämnade Wien och marscherade nordost in i Marchfeld, slätten längs floden March (Morava), där ungerska och kumanska ryttare anslöt sig till honom.
On 26 August the two armies, both almost entirely mounted, met between Dürnkrut and Jedenspeigen. Cuman horse archers harried Ottokar’s left, and the Hungarians drove it from the field; in the centre Rudolf, aged 60, was unhorsed and nearly killed. Around midday a reserve of heavy cavalry under Ulrich von Kapellen, hidden until then, struck Ottokar’s flank, and his army broke. Ottokar was killed in the rout. Rudolf held Moravia for five years, and Margrave Otto of Brandenburg became regent of Bohemia for the six-year-old Wenceslaus II. In 1282 Rudolf gave Austria and Styria to his sons.: Den 26 augusti möttes de två arméerna, båda nästan helt beridna, mellan Dürnkrut och Jedenspeigen. Kumanska beridna bågskyttar ansatte Ottokars vänstra flygel, och ungrarna drev den från slagfältet; i centrum kastades den 60-årige Rudolf av hästen och dödades nästan. Vid middagstid anföll en reserv av tungt kavalleri under Ulrich von Kapellen, som dittills hållits dold, Ottokars flank, och hans armé bröts. Ottokar dödades under flykten. Rudolf behöll Mähren i fem år, och markgreve Otto av Brandenburg blev regent i Böhmen för den sexårige Wenzel II. År 1282 gav Rudolf Österrike och Steiermark till sina söner.
