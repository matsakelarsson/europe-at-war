War of Rudolf I and Ottokar II: Kriget mellan Rudolf I och Ottokar II
The war in which Rudolf of Habsburg, elected king of the Romans in 1273, took Austria, Styria, Carinthia and Carniola from King Ottokar II of Bohemia. Ottokar submitted at Vienna in 1276, tried to win the lands back and was killed at the battle on the Marchfeld in 1278; the Habsburgs held Austria from then until 1918.: Kriget där Rudolf av Habsburg, vald till romersk kung 1273, tog Österrike, Steiermark, Kärnten och Krain från kung Ottokar II av Böhmen. Ottokar underkastade sig i Wien 1276, försökte återvinna länderna och stupade i slaget på Marchfeld 1278; habsburgarna behöll därefter Österrike fram till 1918.
