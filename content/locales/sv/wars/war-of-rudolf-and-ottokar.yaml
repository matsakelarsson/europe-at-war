Dates are Julian, as usual for the period. The war took place in the duchies of Austria, Styria and Carinthia and the March of Carniola, today divided between Austria and Slovenia; their medieval borders are shown only approximately.: Datum anges enligt den julianska kalendern, som brukligt för perioden. Kriget utkämpades i hertigdömena Österrike, Steiermark och Kärnten och markgrevskapet Krain, i dag delade mellan Österrike och Slovenien; deras medeltida gränser visas endast ungefärligt.
Rudolf was king of the Romans, the elected German king, but was never crowned emperor.: Rudolf var romersk kung, den valde tyske kungen, men kröntes aldrig till kejsare.
