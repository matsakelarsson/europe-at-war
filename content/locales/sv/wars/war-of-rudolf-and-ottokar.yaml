Rudolf’s first diet ruled that all crown lands seized since the death of Frederick II in 1250 must be returned, and summoned Ottokar to answer for his.: Rudolfs första riksdag beslöt att alla kronländer som tagits sedan Fredrik II:s död 1250 måste återlämnas och kallade Ottokar att stå till svars för sina.
Rising of the Vítkovci: Vítkovcis resning
Led by Záviš of Falkenstein, the great noble clan of southern Bohemia turned against Ottokar just as Rudolf invaded Austria.: Under ledning av Záviš av Falkenstein vände sig den stora adelssläkten i södra Böhmen mot Ottokar just när Rudolf invaderade Österrike.
Styria and Carinthia: Steiermark och Kärnten
Autumn 1276: hösten 1276
Meinhard of Tyrol, Rudolf’s ally, occupied Carinthia and moved into Styria, whose nobles had sworn to support Rudolf.: Meinhard av Tyrolen, Rudolfs bundsförvant, besatte Kärnten och ryckte in i Steiermark, vars adel hade svurit att stödja Rudolf.
In the camp before the besieged city, Ottokar gave up all his lands outside Bohemia and Moravia. Rudolf then entered Vienna.: I lägret framför den belägrade staden avstod Ottokar från alla sina länder utanför Böhmen och Mähren. Rudolf tågade sedan in i Wien.
