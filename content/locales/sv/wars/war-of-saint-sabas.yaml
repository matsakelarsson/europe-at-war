Pisa at first sided with Genoa and changed sides in 1257. In the Kingdom of Jerusalem the Templars and the Ibelins mostly backed Venice, and the Hospitallers and Philip of Montfort, lord of Tyre, backed Genoa. The war weakened the kingdom at the moment when the Mongols and then the Mamluks were advancing.: Pisa stod först på Genuas sida och bytte sida 1257. I kungariket Jerusalem stödde tempelherrarna och familjen Ibelin mestadels Venedig, och johanniterna och Filip av Montfort, herre över Tyros, Genua. Kriget försvagade kungariket just när mongolerna och sedan mamlukerna ryckte fram.
