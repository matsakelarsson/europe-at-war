War of Saint Sabas: Sankt Sabaskriget
A war between Genoa and Venice, each with its allies, that began in 1256 with fighting in Acre over property near the monastery of St Sabas and spread across the eastern Mediterranean, dividing the barons and military orders of the Kingdom of Jerusalem. Venice and Pisa drove the Genoese out of Acre after a naval victory in 1258, and Genoa moved its base to Tyre and in 1261 allied with the Byzantine emperor Michael VIII, who recovered Constantinople that year. Venetian fleets won again at Settepozzi in 1263 and at Trapani in 1266. Peace was made at Cremona in 1270, under pressure from Louis IX, who needed both cities’ ships for his crusade.: Ett krig mellan Genua och Venedig, var och en med sina allierade, som började 1256 med strider i Akko om egendom nära klostret Sankt Sabas och spred sig över östra Medelhavet, där det splittrade baronerna och riddarordnarna i kungariket Jerusalem. Venedig och Pisa drev ut genueserna ur Akko efter en sjöseger 1258, och Genua flyttade sin bas till Tyros och allierade sig 1261 med den bysantinske kejsaren Mikael VIII, som samma år återerövrade Konstantinopel. Venetianska flottor segrade åter vid Settepozzi 1263 och vid Trapani 1266. Fred slöts i Cremona 1270 under påtryckningar från Ludvig IX, som behövde båda städernas fartyg för sitt korståg.
