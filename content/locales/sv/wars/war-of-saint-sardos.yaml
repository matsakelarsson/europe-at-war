War of Saint-Sardos: Saint-Sardoskriget
A short war in which Charles IV of France seized most of the English king’s duchy of Aquitaine. It grew out of a dispute over a French bastide at Saint-Sardos in the Agenais, which a Gascon lord, Raymond-Bernard of Montpezat, burned in October 1323, hanging a royal sergeant. Charles declared the duchy forfeit, and in August–September 1324 Charles of Valois overran most of it, taking La Réole from the Earl of Kent after a siege. A truce negotiated by Queen Isabella in 1325 left the French in possession of their conquests, and her stay in France led to Edward II’s overthrow.: Ett kort krig där Karl IV av Frankrike lade beslag på större delen av den engelske kungens hertigdöme Aquitanien. Det växte fram ur en tvist om en fransk bastide i Saint-Sardos i Agenais, som en gaskognisk herre, Raymond-Bernard av Montpezat, brände i oktober 1323, varvid han hängde en kunglig sergeant. Karl förklarade hertigdömet förverkat, och i augusti–september 1324 överrumplade Karl av Valois större delen av det och tog La Réole från earlen av Kent efter en belägring. Ett stillestånd som drottning Isabella förhandlade fram 1325 lämnade fransmännen i besittning av sina erövringar, och hennes vistelse i Frankrike ledde till Edvard II:s störtande.
