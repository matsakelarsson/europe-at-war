Historians see the war as one of the forerunners of the Hundred Years’ War. Under the settlement the Agenais stayed in French hands, and English Gascony was reduced to a coastal strip around Bordeaux and Bayonne.: Historiker ser kriget som en av föregångarna till hundraårskriget. Enligt uppgörelsen förblev Agenais i franska händer, och det engelska Gascogne reducerades till en kustremsa kring Bordeaux och Bayonne.
