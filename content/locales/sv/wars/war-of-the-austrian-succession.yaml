When the Emperor Charles VI died on 20 October 1740, his 23-year-old daughter Maria Theresa inherited the Habsburg lands under the Pragmatic Sanction, a settlement that most of Europe had promised to respect. Frederick II, king of Prussia for only five months, saw his chance. Pressing old and doubtful Hohenzollern claims to Silesian duchies, he marched about 27,000 men into Silesia on 16 December without declaring war. The rich province was weakly garrisoned, and its capital, Breslau, let the Prussians in without a fight early in January 1741.: När kejsar Karl VI dog den 20 oktober 1740 ärvde hans 23-åriga dotter Maria Teresia de habsburgska länderna enligt den pragmatiska sanktionen, en uppgörelse som större delen av Europa hade lovat att respektera. Fredrik II, kung av Preussen sedan bara fem månader, såg sin chans. Med hänvisning till gamla och tvivelaktiga hohenzollernska anspråk på schlesiska hertigdömen marscherade han den 16 december in i Schlesien med omkring 27 000 man utan att förklara krig. Den rika provinsen var svagt försvarad, och dess huvudstad, Breslau, släppte in preussarna utan strid i början av januari 1741.
Only the fortresses of Glogau, Brieg and Neisse held out, and Glogau was stormed on 9 March. Late that month an Austrian army under Wilhelm Reinhard von Neipperg crossed the mountains from Moravia and relieved Neisse. On 10 April the two armies met in the snow at Mollwitz, near Brieg. The Austrian cavalry routed the Prussian horse, and Frederick, urged by Field Marshal Kurt von Schwerin, rode from the field; but Schwerin’s infantry held and drove the Austrians off with its steady fire. Each side lost some 4,500 to 5,000 men, and the victory encouraged France, Bavaria and Saxony to join the attack on Austria.: Endast fästningarna Glogau, Brieg och Neisse höll stånd, och Glogau stormades den 9 mars. I slutet av månaden gick en österrikisk armé under Wilhelm Reinhard von Neipperg över bergen från Mähren och undsatte Neisse. Den 10 april möttes de två arméerna i snön vid Mollwitz nära Brieg. Det österrikiska kavalleriet slog det preussiska rytteriet på flykten, och Fredrik red från slagfältet på inrådan av fältmarskalk Kurt von Schwerin; men Schwerins infanteri höll stånd och drev bort österrikarna med sin stadiga eld. Vardera sidan förlorade omkring 4 500–5 000 man, och segern uppmuntrade Frankrike, Bayern och Sachsen att ansluta sig till angreppet på Österrike.
