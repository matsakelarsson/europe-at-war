In 1743 the war turned against Charles VII. Prince Charles of Lorraine invaded Bavaria again, beat the Bavarians at Simbach on the Inn on 9 May, and drove them and their French allies out of the country. The emperor fled to Frankfurt, and on 27 June his generals agreed at Niederschönenfeld to keep the Bavarian army neutral while Austria governed Bavaria. Charles VII was left an emperor without lands, dependent on French subsidies.: År 1743 vände kriget sig mot Karl VII. Prins Karl av Lothringen invaderade åter Bayern, besegrade bayrarna vid Simbach am Inn den 9 maj och drev ut dem och deras franska allierade ur landet. Kejsaren flydde till Frankfurt, och den 27 juni kom hans generaler i Niederschönenfeld överens om att hålla den bayerska armén neutral medan Österrike styrde Bayern. Karl VII blev en kejsare utan länder, beroende av franska subsidier.
Britain, which was paying subsidies to Austria, sent an army to Germany. The Pragmatic Army of British, Hanoverian and Austrian troops, led by King George II, marched up the Main and was nearly trapped by a larger French army under Marshal Noailles. On 27 June at Dettingen a French force under the Duke of Gramont left its strong position to attack and was driven back across the river. It was the last battle in which a British monarch led his troops in person. In September Britain, Austria and Sardinia allied at Worms, and in the spring of 1744 France declared war on Britain and Austria.: Storbritannien, som betalade subsidier till Österrike, sände en armé till Tyskland. Den pragmatiska armén av brittiska, hannoveranska och österrikiska trupper, ledd av kung Georg II, marscherade uppför Main och blev nästan instängd av en större fransk armé under marskalk Noailles. Den 27 juni vid Dettingen lämnade en fransk styrka under hertigen av Gramont sin starka ställning för att anfalla och drevs tillbaka över floden. Det var det sista slag där en brittisk monark personligen ledde sina trupper. I september slöt Storbritannien, Österrike och Sardinien förbund i Worms, och våren 1744 förklarade Frankrike krig mot Storbritannien och Österrike.
