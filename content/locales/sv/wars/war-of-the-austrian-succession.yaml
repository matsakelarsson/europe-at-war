Away from Silesia the war was fought above all in the Low Countries and Italy, and there it went on after Prussia made peace. In Flanders the French under Marshal Maurice de Saxe beat the allied armies at Fontenoy in May 1745, Rocoux in 1746 and Lauffeld in 1747, and conquered the Austrian Netherlands. In Italy Austrian and Sardinian troops fought the Spanish and French. Britain and France also fought at sea, in North America and in India. In 1748, as the French besieged Maastricht, a Russian corps paid for by Britain and the Dutch was marching west across Germany.: Utanför Schlesien utkämpades kriget framför allt i Nederländerna och Italien, och där fortsatte det sedan Preussen slutit fred. I Flandern besegrade fransmännen under marskalk Moritz av Sachsen de allierade arméerna vid Fontenoy i maj 1745, Rocoux 1746 och Lauffeld 1747 och erövrade Österrikiska Nederländerna. I Italien stred österrikiska och sardiska trupper mot spanjorerna och fransmännen. Storbritannien och Frankrike stred också till sjöss, i Nordamerika och i Indien. År 1748, när fransmännen belägrade Maastricht, var en rysk kår, betald av Storbritannien och holländarna, på marsch västerut genom Tyskland.
A peace congress opened at Aachen (Aix-la-Chapelle) in April 1748, and the treaty was signed on 18 October. It confirmed Maria Theresa’s inheritance and her husband’s title as emperor, and guaranteed Silesia to Prussia. France gave back the Austrian Netherlands, and Britain and France returned each other’s colonial conquests. The Spanish Infante Philip received Parma, Piacenza and Guastalla, and Sardinia gained land in Lombardy. Silesia was the only great change north of the Alps, and Maria Theresa never accepted its loss; within a few years she had reformed her army and found new allies to win it back.: En fredskongress öppnades i Aachen (Aix-la-Chapelle) i april 1748, och fördraget undertecknades den 18 oktober. Det bekräftade Maria Teresias arv och hennes makes kejsartitel och garanterade Schlesien åt Preussen. Frankrike lämnade tillbaka Österrikiska Nederländerna, och Storbritannien och Frankrike återlämnade varandras koloniala erövringar. Den spanske infanten Filip fick Parma, Piacenza och Guastalla, och Sardinien vann land i Lombardiet. Schlesien var den enda stora förändringen norr om Alperna, och Maria Teresia accepterade aldrig förlusten; inom några år hade hon reformerat sin armé och funnit nya allierade för att vinna tillbaka det.
