War of the Austrian Succession: Österrikiska tronföljdskriget
A European war over the inheritance of Maria Theresa, in which Prussia seized Silesia and France, Bavaria, Spain and Saxony tried to divide the Habsburg lands, while Britain, Hanover, the Dutch Republic and Sardinia supported Austria. It spread to Italy, the Low Countries, the seas and the colonies, and the Treaty of Aix-la-Chapelle in 1748 confirmed Maria Theresa’s inheritance but left Silesia to Prussia.: Ett europeiskt krig om Maria Teresias arv, där Preussen lade beslag på Schlesien och Frankrike, Bayern, Spanien och Sachsen försökte dela upp de habsburgska länderna, medan Storbritannien, Hannover, Nederländska republiken och Sardinien stödde Österrike. Kriget spred sig till Italien, Nederländerna, haven och kolonierna, och freden i Aachen 1748 bekräftade Maria Teresias arv men lämnade Schlesien åt Preussen.
