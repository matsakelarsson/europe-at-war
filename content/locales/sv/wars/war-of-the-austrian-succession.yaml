Charles Albert, Elector of Bavaria, who was married to a daughter of the Emperor Joseph I, claimed the Habsburg lands for himself, and France backed him in the hope of breaking Habsburg power for good. Bavarian troops seized Passau at the end of July 1741 and French armies began crossing the Rhine on 15 August. At Linz, taken in September, Charles Albert received homage as Archduke of Austria. Saxony joined the allies, and Spain attacked the Habsburg lands in Italy. On 11 September Maria Theresa appealed for help to the Hungarian Diet at Pressburg, and the nobles voted her troops.: Karl Albrekt, kurfurste av Bayern, som var gift med en dotter till kejsar Josef I, gjorde anspråk på de habsburgska länderna för egen del, och Frankrike stödde honom i hopp om att bryta den habsburgska makten för gott. Bayerska trupper besatte Passau i slutet av juli 1741, och franska arméer började gå över Rhen den 15 augusti. I Linz, som intogs i september, mottog Karl Albrekt hyllning som ärkehertig av Österrike. Sachsen anslöt sig till de allierade, och Spanien angrep de habsburgska besittningarna i Italien. Den 11 september vädjade Maria Teresia om hjälp till den ungerska riksdagen i Pressburg, och adeln beviljade henne trupper.
In October she bought a secret truce from Frederick at Klein-Schnellendorf by handing over Neisse, and the allies, instead of marching on Vienna, turned north into Bohemia. In late November French, Bavarian and Saxon troops stormed Prague, and on 19 December Charles Albert received homage there as King of Bohemia. On 24 January 1742 the electors chose him as emperor, the first from outside the House of Habsburg in three centuries, and he was crowned at Frankfurt as Charles VII on 12 February. By then an Austrian army under Count Khevenhüller had retaken Linz and overrun Bavaria, and on 13 February it entered Munich.: I oktober köpte hon ett hemligt stillestånd av Fredrik i Klein-Schnellendorf genom att överlämna Neisse, och de allierade vände i stället för att marschera mot Wien norrut in i Böhmen. I slutet av november stormade franska, bayerska och sachsiska trupper Prag, och den 19 december mottog Karl Albrekt där hyllning som kung av Böhmen. Den 24 januari 1742 valde kurfurstarna honom till kejsare, den förste utanför huset Habsburg på tre sekler, och han kröntes i Frankfurt som Karl VII den 12 februari. Då hade en österrikisk armé under greve Khevenhüller återtagit Linz och överränt Bayern, och den 13 februari ryckte den in i München.
