In a night assault, with Maurice de Saxe leading the way over the walls, French, Bavarian and Saxon troops took the city with little bloodshed.: I ett nattligt anfall, med Moritz av Sachsen i täten över murarna, intog franska, bayerska och sachsiska trupper staden med litet blodsutgjutelse.
