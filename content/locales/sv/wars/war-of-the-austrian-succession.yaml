Dates are New Style (Gregorian). Britain still used the Julian calendar, eleven days behind, so British sources of the time date Dettingen 16 June 1743.: Datum anges enligt n.s. (den gregorianska kalendern). Storbritannien använde fortfarande den julianska kalendern, som låg elva dagar efter, så samtida brittiska källor daterar Dettingen till den 16 juni 1743.
The First (1740–1742) and Second (1744–1745) Silesian Wars between Prussia and Austria were part of this war. Saxony fought against Austria in 1741–1742 and on its side in 1744–1745.: Det första (1740–1742) och det andra (1744–1745) schlesiska kriget mellan Preussen och Österrike ingick i detta krig. Sachsen stred mot Österrike 1741–1742 och på dess sida 1744–1745.
Places in Silesia, Bohemia and Moravia are named in their German forms of the time; the markers give today’s names.: Orter i Schlesien, Böhmen och Mähren anges med sina dåtida tyska namnformer; markörerna ger dagens namn.
