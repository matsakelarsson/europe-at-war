In Italy, Philip V’s queen, Elisabeth Farnese, hoped to win a duchy in the north for her younger son, Philip. From the winter of 1741–1742 Spanish armies landed in Tuscany, and another marched through southern France into Savoy, which Spain occupied until the peace. Charles Emmanuel III of Sardinia, who could bargain with both sides, joined Maria Theresa in 1742 in return for promises of land. In August a British squadron forced Naples out of the war by threatening to bombard the city. The Austrians and Sardinians fought the Spanish to a bloody draw at Campo Santo near Modena in February 1743, and in August 1744 King Charles of Naples, back in the war, threw back an Austrian night attack on his headquarters at Velletri, south of Rome. In 1745 Genoa joined the Bourbons, and after their victory at Bassignana in September the French and Spanish entered Milan.: I Italien hoppades Filip V:s drottning, Elisabet Farnese, att vinna ett hertigdöme i norr åt sin yngre son Filip. Från vintern 1741–1742 landsteg spanska arméer i Toscana, och en annan marscherade genom södra Frankrike in i Savojen, som Spanien ockuperade fram till freden. Karl Emanuel III av Sardinien, som kunde förhandla med båda sidor, anslöt sig 1742 till Maria Teresia mot löften om land. I augusti tvingade en brittisk eskader Neapel ur kriget genom att hota att bombardera staden. Österrikarna och sardinierna utkämpade ett blodigt oavgjort slag mot spanjorerna vid Campo Santo nära Modena i februari 1743, och i augusti 1744 slog kung Karl av Neapel, som åter deltog i kriget, tillbaka ett österrikiskt nattanfall mot sitt högkvarter i Velletri söder om Rom. År 1745 anslöt sig Genua till bourbonerna, och efter deras seger vid Bassignana i september ryckte fransmännen och spanjorerna in i Milano.
The tide turned in 1746. Austrian troops freed by the peace with Prussia beat the French and Spanish in a hard battle at Piacenza on 16 June, and the Bourbon armies fell back to Provence. Genoa, left on its own, surrendered in September and was made to pay a heavy indemnity. On 5 December the Genoese rose against the Austrian occupiers – by tradition the revolt began when a boy known as Balilla threw a stone at soldiers dragging a mortar through the streets – and drove them out within days, and an Austrian siege the next spring failed. On 19 July 1747 a French army trying to break into Piedmont attacked the Sardinians entrenched on the Assietta ridge and was thrown back with heavy losses; its commander, the Chevalier de Belle-Isle, was killed. At the peace the Infante Philip received Parma, Piacenza and Guastalla.: Vinden vände 1746. Österrikiska trupper som frigjorts genom freden med Preussen besegrade fransmännen och spanjorerna i ett hårt slag vid Piacenza den 16 juni, och de bourbonska arméerna drog sig tillbaka till Provence. Genua, som lämnats ensamt, kapitulerade i september och tvingades betala ett tungt skadestånd. Den 5 december reste sig genueserna mot de österrikiska ockupanterna – enligt traditionen började revolten när en pojke känd som Balilla kastade en sten mot soldater som släpade en mörsare genom gatorna – och drev ut dem inom några dagar, och en österrikisk belägring följande vår misslyckades. Den 19 juli 1747 anföll en fransk armé, som försökte bryta sig in i Piemonte, sardinierna som låg förskansade på Assiettakammen och slogs tillbaka med svåra förluster; dess befälhavare, chevalier de Belle-Isle, stupade. Vid freden fick infanten Filip Parma, Piacenza och Guastalla.
