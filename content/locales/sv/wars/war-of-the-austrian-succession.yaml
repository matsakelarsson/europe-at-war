Occupied by Austria, 1743–1744: Ockuperat av Österrike 1743–1744
Austria’s successes alarmed Frederick, who feared that it would take back Silesia once it had beaten Bavaria and France. In August 1744 he invaded Bohemia with some 70,000 men and took Prague on 16 September, while the main Austrian army was across the Rhine in Alsace. It hurried back, and Field Marshal Otto Ferdinand von Traun, refusing battle, cut the Prussian supply lines until Frederick retreated to Silesia, losing thousands of men to hunger and desertion. Charles VII died on 20 January 1745, and in April his son made peace at Füssen, giving up his father’s claims in return for Bavaria.: Österrikes framgångar oroade Fredrik, som fruktade att Österrike skulle ta tillbaka Schlesien när det väl hade besegrat Bayern och Frankrike. I augusti 1744 invaderade han Böhmen med omkring 70 000 man och intog Prag den 16 september, medan den österrikiska huvudarmén befann sig på andra sidan Rhen i Elsass. Den skyndade tillbaka, och fältmarskalk Otto Ferdinand von Traun vägrade ta strid men skar av de preussiska förbindelselinjerna tills Fredrik drog sig tillbaka till Schlesien och förlorade tusentals man genom svält och desertering. Karl VII dog den 20 januari 1745, och i april slöt hans son fred i Füssen och avstod från faderns anspråk i utbyte mot Bayern.
At the end of May an Austrian and Saxon army under Prince Charles crossed the mountains into Silesia. At dawn on 4 June Frederick attacked it at Hohenfriedberg; the Bayreuth Dragoons broke the Austrian infantry, and the allies lost more than 10,000 men. He won again at Soor in Bohemia at the end of September, soon after Maria Theresa’s husband was elected emperor as Francis I. When they planned a winter march on Berlin, the old Prince Leopold of Anhalt-Dessau beat the Saxons at Kesselsdorf on 15 December, and Dresden fell. By the Peace of Dresden on 25 December Austria again gave up Silesia, and Prussia recognised Francis I.: I slutet av maj gick en österrikisk och sachsisk armé under prins Karl över bergen in i Schlesien. I gryningen den 4 juni anföll Fredrik den vid Hohenfriedberg; Bayreuthdragonerna bröt det österrikiska infanteriet, och de allierade förlorade mer än 10 000 man. Han segrade igen vid Soor i Böhmen i slutet av september, strax efter att Maria Teresias make valts till kejsare som Frans I. När de planerade en vintermarsch mot Berlin besegrade den gamle furst Leopold av Anhalt-Dessau sachsarna vid Kesselsdorf den 15 december, och Dresden föll. Genom freden i Dresden den 25 december avstod Österrike åter Schlesien, och Preussen erkände Frans I.
