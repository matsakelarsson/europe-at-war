Frederick repudiated the truce at the end of 1741, accusing Austria of letting it become known, and his troops took Olmütz in Moravia. In February 1742 he led Prussians, Saxons and French through Moravia towards Vienna, but the advance stalled before Brünn for lack of supplies, and in April he fell back into Bohemia. Prince Charles of Lorraine, Maria Theresa’s brother-in-law, followed with about 30,000 men and attacked him at Chotusitz, near Čáslav, on 17 May. The Austrians broke into the Prussian lines and set the village on fire, but were driven off. Each side lost some 5,000 to 7,000 men.: Fredrik sade upp stilleståndet i slutet av 1741 och anklagade Österrike för att ha låtit det bli känt, och hans trupper intog Olmütz i Mähren. I februari 1742 ledde han preussare, sachsare och fransmän genom Mähren mot Wien, men framryckningen stannade av framför Brünn i brist på förnödenheter, och i april drog han sig tillbaka till Böhmen. Prins Karl av Lothringen, Maria Teresias svåger, följde efter med omkring 30 000 man och anföll honom vid Chotusitz nära Čáslav den 17 maj. Österrikarna bröt sig in i de preussiska linjerna och satte byn i brand men drevs tillbaka. Vardera sidan förlorade omkring 5 000–7 000 man.
Maria Theresa now needed peace with Prussia to deal with France and Bavaria. By the preliminary Peace of Breslau on 11 June, confirmed in Berlin on 28 July, she gave up most of Silesia and the county of Glatz, keeping only Teschen and parts of Troppau, Jägerndorf and Neisse. Saxony made peace too, and the French in Prague were left besieged. On 16 December Marshal Belle-Isle broke out with 14,000 men and marched them through the snow to Eger in ten days, losing many to cold and sickness. The 6,000 left behind under François de Chevert, mostly sick or wounded, then marched out with the honours of war.: Maria Teresia behövde nu fred med Preussen för att kunna ta itu med Frankrike och Bayern. Genom preliminärfreden i Breslau den 11 juni, bekräftad i Berlin den 28 juli, avstod hon större delen av Schlesien och grevskapet Glatz och behöll endast Teschen och delar av Troppau, Jägerndorf och Neisse. Även Sachsen slöt fred, och fransmännen i Prag lämnades belägrade. Den 16 december bröt marskalk Belle-Isle ut med 14 000 man och lät dem marschera genom snön till Eger på tio dagar, varvid många gick förlorade genom köld och sjukdom. De 6 000 som lämnades kvar under François de Chevert, mest sjuka eller sårade, marscherade sedan ut med krigets honnörer.
