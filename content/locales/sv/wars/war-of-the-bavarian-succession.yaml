Prussians enter Bohemia: Preussarna går in i Böhmen
Early July 1778: början av juli 1778
Frederick’s army crossed the mountains from the county of Glatz and occupied Náchod, but advanced little further.: Fredriks armé gick över bergen från grevskapet Glatz och besatte Náchod men kom inte mycket längre.
Austrian lines on the Elbe: Österrikiska linjer vid Elbe
July – September 1778: juli – september 1778
Joseph II and Lacy fortified the heights along the upper Elbe around Jaroměř, and Frederick judged them too strong to attack.: Josef II och Lacy befäste höjderna längs övre Elbe kring Jaroměř, och Fredrik bedömde dem som för starka för att anfalla.
Prince Henry in Bohemia: Prins Henrik i Böhmen
Prince Henry’s Prussians and Saxons crossed from Saxony and pushed Laudon back behind the Iser, today’s Jizera, near Mnichovo Hradiště, but got no further.: Prins Henriks preussare och sachsare gick över från Sachsen och trängde tillbaka Laudon bakom Iser, dagens Jizera, nära Mnichovo Hradiště, men kom inte längre.
Habelschwerdt: Habelschwerdt
17–18 January 1779: 17–18 januari 1779
In one of the winter raids, Austrian troops surrounded and stormed the Prussian-held town in the county of Glatz, today’s Bystrzyca Kłodzka, and much of it burned.: Under en av vinterräderna omringade och stormade österrikiska trupper den preussiskkontrollerade staden i grevskapet Glatz, dagens Bystrzyca Kłodzka, och en stor del av den brann.
13 May 1779: 13 maj 1779
Signed in today’s Cieszyn. Austria kept the Innviertel and gave up its other claims, and Prussia’s right to inherit Ansbach and Bayreuth was recognised.: Undertecknad i dagens Cieszyn. Österrike behöll Innviertel och avstod från sina övriga anspråk, och Preussens rätt att ärva Ansbach och Bayreuth erkändes.
