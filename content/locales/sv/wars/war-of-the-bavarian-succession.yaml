The Potato War: Potatiskriget
July 1778 – May 1779: juli 1778 – maj 1779
Austrian moves: Österrikiska trupprörelser
Austrian success: Österrikiska framgångar
Prussian success: Preussiska framgångar
Losses: Förluster
Known in Prussia and Saxony as the Potato War (Kartoffelkrieg) and in Austria as the Plum Fuss (Zwetschgenrummel).: Kallas i Preussen och Sachsen Potatiskriget (Kartoffelkrieg) och i Österrike Plommonbråket (Zwetschgenrummel).
Places in Bohemia and Silesia are named in their German forms of the time; the markers give today’s names.: Orter i Böhmen och Schlesien anges med sina dåtida tyska namnformer; markörerna anger dagens namn.
Prussian and Saxon moves: Preussiska och sachsiska trupprörelser
When Maximilian III Joseph, the last elector of the Bavarian line of the Wittelsbachs, died childless on 30 December 1777, his heir was the Elector Palatine, Charles Theodore. Within days Charles Theodore agreed to hand Lower Bavaria to the Emperor Joseph II, who hoped to round off the Austrian lands, and Austrian troops marched in. Frederick II of Prussia, unwilling to see Austria grow, backed the protests of Charles Theodore’s own heir, Duke Charles August of Zweibrücken, and of Saxony. In early July 1778 he led a Prussian army into Bohemia, while his brother Prince Henry invaded from Saxony with Prussian and Saxon troops.: När Maximilian III Joseph, den siste kurfursten av den bayerska grenen av huset Wittelsbach, dog barnlös den 30 december 1777 var hans arvinge kurfursten av Pfalz, Karl Teodor. Inom några dagar gick Karl Teodor med på att överlämna Niederbayern till kejsar Josef II, som hoppades kunna runda av de österrikiska länderna, och österrikiska trupper ryckte in. Fredrik II av Preussen, som inte ville se Österrike växa, stödde protesterna från Karl Teodors egen arvinge, hertig Karl August av Zweibrücken, och från Sachsen. I början av juli 1778 ledde han en preussisk armé in i Böhmen, medan hans bror prins Henrik invaderade från Sachsen med preussiska och sachsiska trupper.
Joseph II and Field Marshal Franz Moritz von Lacy waited behind redoubts on the heights above the upper Elbe, and Laudon fell back behind the Iser before Prince Henry. Neither side attacked. The armies stripped the countryside bare, and thousands of soldiers died of disease or deserted; the Prussians named the campaign after the potatoes they dug up to eat. The Prussians withdrew in the autumn, and after a winter of raids Maria Theresa, against her son’s wishes, accepted French and Russian mediation. By the Peace of Teschen on 13 May 1779 Austria kept only the Innviertel, a strip along the Inn, and Saxony received six million gulden.: Josef II och fältmarskalk Franz Moritz von Lacy väntade bakom skansar på höjderna ovanför övre Elbe, och Laudon drog sig tillbaka bakom Iser undan prins Henrik. Ingen av sidorna anföll. Arméerna skövlade landsbygden, och tusentals soldater dog av sjukdomar eller deserterade; preussarna döpte fälttåget efter potatisen som de grävde upp för att äta. Preussarna drog sig tillbaka på hösten, och efter en vinter av räder godtog Maria Teresia, mot sin sons vilja, fransk och rysk medling. Genom freden i Teschen den 13 maj 1779 behöll Österrike endast Innviertel, en remsa längs Inn, och Sachsen fick sex miljoner gulden.
About 10,000 on each side, mostly from disease: Omkring 10 000 på vardera sidan, mest genom sjukdomar
