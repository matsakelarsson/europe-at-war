War of the Bavarian Succession: Bayerska tronföljdskriget
A war between Austria and Prussia, allied with Saxony, over Joseph II’s attempt to acquire much of Bavaria when its ruling line died out in 1777. The armies faced each other in Bohemia without fighting a major battle, and the Peace of Teschen in 1779 left Austria only the Innviertel.: Ett krig mellan Österrike och Preussen, allierat med Sachsen, om Josef II:s försök att förvärva stora delar av Bayern när dess regerande linje dog ut 1777. Arméerna stod mot varandra i Böhmen utan att utkämpa något större slag, och freden i Teschen 1779 lämnade bara Innviertel åt Österrike.
