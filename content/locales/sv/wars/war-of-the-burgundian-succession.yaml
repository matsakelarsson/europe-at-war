War of the Burgundian Succession: Burgundiska tronföljdskriget
The war between Louis XI of France and Maximilian of Habsburg over the lands of Charles the Bold, killed at Nancy in January 1477. Louis seized the duchy of Burgundy and Picardy and occupied Franche-Comté and Artois, while Charles’s daughter Mary married Maximilian and kept the Low Countries. Maximilian beat the French at Guinegate on 7 August 1479 but could not follow up his victory. After Mary’s death in a riding accident in 1482, the estates of Flanders forced him to accept the Treaty of Arras, which left the duchy of Burgundy and Picardy to France and promised Artois and Franche-Comté as the dowry of his daughter Margaret, betrothed to the future Charles VIII.: Kriget mellan Ludvig XI av Frankrike och Maximilian av Habsburg om Karl den djärves länder, sedan Karl stupat vid Nancy i januari 1477. Ludvig lade beslag på hertigdömet Burgund och Pikardiet och ockuperade Franche-Comté och Artois, medan Karls dotter Maria gifte sig med Maximilian och behöll Nederländerna. Maximilian besegrade fransmännen vid Guinegate den 7 augusti 1479 men kunde inte utnyttja sin seger. Sedan Maria omkommit i en ridolycka 1482 tvingade ständerna i Flandern honom att godta freden i Arras, som lämnade hertigdömet Burgund och Pikardiet åt Frankrike och utlovade Artois och Franche-Comté som hemgift för hans dotter Margareta, trolovad med den blivande Karl VIII.
