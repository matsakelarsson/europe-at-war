When Henry IV of Castile died in December 1474, his half-sister Isabella had herself proclaimed queen at Segovia. Her rival was Henry’s daughter Joanna, aged twelve. Joanna’s supporters, led by the Marquis of Villena and the Archbishop of Toledo, turned to her uncle, Afonso V of Portugal. He invaded on 10 May 1475, was betrothed to Joanna at Plasencia, where the two were proclaimed king and queen of Castile, and won over Toro and Zamora. In September Louis XI of France allied with him, and the next spring a French army attacked Fuenterrabía in the Basque country but was beaten off.: När Henrik IV av Kastilien dog i december 1474 lät hans halvsyster Isabella utropa sig till drottning i Segovia. Hennes rival var Henriks tolvåriga dotter Johanna. Johannas anhängare, ledda av markisen av Villena och ärkebiskopen av Toledo, vände sig till hennes farbror Alfons V av Portugal. Han invaderade den 10 maj 1475, trolovades med Johanna i Plasencia, där de båda utropades till kung och drottning av Kastilien, och vann över Toro och Zamora. I september allierade sig Ludvig XI av Frankrike med honom, och följande vår anföll en fransk armé Fuenterrabía i Baskien men slogs tillbaka.
Ferdinand gathered an army and in December 1475 won back the town of Zamora, though not its castle. In February 1476 Afonso, reinforced by his son, Prince John, besieged Ferdinand there in vain. On 1 March, as the Portuguese fell back, Ferdinand caught them near Toro, at Peleagonzalo, and they fought in the rain as darkness fell. Ferdinand’s wing broke Afonso’s, while Prince John beat the Castilians facing him and held the field. Both claimed the victory, but Isabella made the most of it. Zamora castle surrendered, nobles came over to her, and in the autumn Afonso sailed for France to beg Louis XI for help.: Ferdinand samlade en armé och återvann i december 1475 staden Zamora, dock inte dess borg. I februari 1476 belägrade Alfons, förstärkt av sin son prins Johan, förgäves Ferdinand där. Den 1 mars, när portugiserna drog sig tillbaka, hann Ferdinand upp dem nära Toro, vid Peleagonzalo, och de stred i regnet medan mörkret föll. Ferdinands flygel bröt Alfons flygel, medan prins Johan besegrade de kastilianer som stod mot honom och behöll slagfältet. Båda gjorde anspråk på segern, men Isabella utnyttjade den bäst. Borgen i Zamora kapitulerade, adelsmän gick över till henne, och på hösten seglade Alfons till Frankrike för att be Ludvig XI om hjälp.
