War of the Castilian Succession: Kastilianska tronföljdskriget
The war for the throne of Castile after the death of Henry IV in 1474, between his half-sister Isabella, married to Ferdinand of Aragon, and his daughter Joanna, called la Beltraneja, backed by her uncle and betrothed, Afonso V of Portugal, and by Louis XI of France. The indecisive battle of Toro in 1476 turned into a political victory for Isabella, while Portugal won the war at sea. By the Treaty of Alcáçovas in 1479 Afonso gave up his claim, Castile kept the Canary Islands and Portugal the rest of the Atlantic islands and the trade of Africa. Ferdinand had become king of Aragon that January, and the two crowns were now joined under the Catholic Monarchs.: Kriget om Kastiliens tron efter Henrik IV:s död 1474, mellan hans halvsyster Isabella, gift med Ferdinand av Aragonien, och hans dotter Johanna, kallad la Beltraneja, som stöddes av sin morbror och trolovade Alfons V av Portugal och av Ludvig XI av Frankrike. Det oavgjorda slaget vid Toro 1476 blev en politisk seger för Isabella, medan Portugal vann kriget till sjöss. Genom freden i Alcáçovas 1479 avstod Alfons från sina anspråk, Kastilien behöll Kanarieöarna och Portugal de övriga atlantöarna och handeln med Afrika. Ferdinand hade blivit kung av Aragonien i januari samma år, och de två kronorna var nu förenade under de katolska monarkerna.
