Joanna’s enemies claimed that she was not Henry IV’s daughter but that of his favourite, Beltrán de la Cueva, hence the nickname la Beltraneja. Historians still debate it; her supporters called her the Excellent Lady. Some historians prefer the neutral name War of 1475–1479.: Johannas fiender hävdade att hon inte var dotter till Henrik IV utan till hans gunstling Beltrán de la Cueva, därav öknamnet la Beltraneja. Historiker diskuterar det fortfarande; hennes anhängare kallade henne den Förträffliga damen. Vissa historiker föredrar den neutrala benämningen kriget 1475–1479.
Both sides claimed Toro as a victory, and historians still disagree about who won the battle itself. Dates are Julian.: Båda sidor gjorde anspråk på Toro som en seger, och historiker är fortfarande oeniga om vem som vann själva slaget. Datum anges enligt den julianska kalendern.
