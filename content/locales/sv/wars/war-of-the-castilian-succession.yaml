Louis XI gave Afonso nothing, and in 1478 he made peace with Castile. In Castile Isabella’s troops took the castle of Toro and reduced the remaining nobles of Joanna’s party one by one. The war went on along the frontier and at sea, where Castilian ships challenged Portugal’s hold on the trade of West Africa and the Atlantic islands. In 1478 a Portuguese fleet captured a Castilian fleet trading at the gold coast of Mina, in the Gulf of Guinea. On land, the last Portuguese invasion was beaten at La Albuera, near Badajoz, on 24 February 1479 by the Master of Santiago, Alonso de Cárdenas.: Ludvig XI gav Alfons ingenting, och 1478 slöt han fred med Kastilien. I Kastilien intog Isabellas trupper borgen i Toro och betvingade en efter en de återstående adelsmännen på Johannas sida. Kriget fortsatte längs gränsen och till sjöss, där kastilianska fartyg utmanade Portugals grepp om handeln med Västafrika och de atlantiska öarna. År 1478 erövrade en portugisisk flotta en kastiliansk flotta som idkade handel vid guldkusten i Mina i Guineabukten. Till lands besegrades den sista portugisiska invasionen vid La Albuera nära Badajoz den 24 februari 1479 av stormästaren i Santiagoorden, Alonso de Cárdenas.
The peace was arranged by Isabella’s aunt, Beatrice, Duchess of Viseu, who was also Afonso’s sister-in-law, in talks at Alcántara, and signed at Alcáçovas on 4 September 1479. Afonso gave up his claim to Castile, and Isabella and Ferdinand theirs to Portugal. Castile kept the Canary Islands; Portugal kept Madeira, the Azores and Cape Verde, the trade and conquest of the African coast and the right to conquer Fez. Joanna had to choose between a convent and a betrothal to Isabella’s infant son. She chose the convent, and lived on in Portugal until 1530, still signing herself “I, the Queen”.: Freden förmedlades av Isabellas moster Beatrix, hertiginna av Viseu, som också var Alfons svägerska, vid förhandlingar i Alcántara och undertecknades i Alcáçovas den 4 september 1479. Alfons avstod från sitt anspråk på Kastilien, och Isabella och Ferdinand från sina på Portugal. Kastilien behöll Kanarieöarna; Portugal behöll Madeira, Azorerna och Kap Verde, handeln med och erövringen av den afrikanska kusten samt rätten att erövra Fez. Johanna fick välja mellan ett kloster och en trolovning med Isabellas späde son. Hon valde klostret och levde kvar i Portugal till 1530 och undertecknade fortfarande med ”Jag, drottningen”.
