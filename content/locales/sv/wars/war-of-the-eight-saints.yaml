War of the Eight Saints: De åtta helgonens krig
A war between Florence, allied with Bernabò Visconti of Milan, and Pope Gregory XI, whose legates were extending papal rule in central Italy. In 1375 Florence encouraged revolts across the Papal States, and dozens of towns rose against their papal governors. The pope put Florence under interdict in March 1376, exposing its merchants abroad to arrest and seizure of their goods, and sent an army of Breton mercenaries under Cardinal Robert of Geneva; in February 1377 they massacred thousands of the people of Cesena. The war was run in Florence by a committee of eight, called the Eight Saints, and its cost helped bring on the Ciompi revolt of 1378. After Gregory, who had brought the papacy back from Avignon to Rome in 1377, died in March 1378, Catherine of Siena and others worked for peace, and Florence made peace with Pope Urban VI at Tivoli in July 1378, agreeing to pay a large indemnity.: Ett krig mellan Florens, allierat med Bernabò Visconti av Milano, och påven Gregorius XI, vars legater höll på att utvidga det påvliga styret i mellersta Italien. År 1375 uppmuntrade Florens revolter i hela Kyrkostaten, och dussintals städer reste sig mot sina påvliga guvernörer. Påven belade Florens med interdikt i mars 1376, vilket utsatte stadens köpmän utomlands för arrestering och beslag av deras varor, och sände en armé av bretonska legosoldater under kardinal Robert av Genève; i februari 1377 massakrerade de tusentals invånare i Cesena. Kriget leddes i Florens av en kommitté på åtta män, kallade de åtta helgonen, och kostnaderna bidrog till ciompiupproret 1378. Sedan Gregorius, som 1377 hade fört påvedömet tillbaka från Avignon till Rom, dött i mars 1378 verkade Katarina av Siena och andra för fred, och Florens slöt fred med påven Urban VI i Tivoli i juli 1378 och gick med på att betala ett stort skadestånd.
