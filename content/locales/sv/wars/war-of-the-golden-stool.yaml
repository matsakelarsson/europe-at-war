# Svenska översättningar av katalogtexten (våg 13); stegtexterna kommer senare.
War of the Golden Stool: Kriget om Gyllene stolen
? The last war between the Asante and the British, also called the Yaa Asantewaa War. After the British occupation of Kumasi in 1896 and the exile of the Asantehene Prempeh I, Asante was ruled by a British resident, and resentment grew over forced labour, taxes and the absence of the king. In March 1900 the governor of the Gold Coast, Sir Frederic Hodgson, told the assembled Asante chiefs in Kumasi that the Golden Stool, the sacred stool that embodies the soul of the Asante nation and on which not even the king sits, should be handed over so that he could sit on it. Led by Yaa Asantewaa, the queen mother of Ejisu, the Asante rose and besieged the British, the governor among them, in the Kumasi fort from April to July. A relief column under Colonel James Willcocks broke through on 15 July, and British columns spent the rest of the year breaking resistance across the country. Yaa Asantewaa was captured in March 1901 and exiled to the Seychelles with other leaders, and on 1 January 1902 Asante was annexed as a British colony. The Golden Stool itself was never found by the British; it remained hidden and is kept in Kumasi today.
: Det sista kriget mellan Ashanti och britterna, även kallat Yaa Asantewaa-kriget. Efter den brittiska ockupationen av Kumasi 1896 och förvisningen av asantehene Prempeh I styrdes Ashanti av en brittisk resident, och förbittringen växte över tvångsarbete, skatter och kungens frånvaro. I mars 1900 sade guvernören på Guldkusten, sir Frederic Hodgson, till de församlade ashantihövdingarna i Kumasi att Gyllene stolen, den heliga stol som förkroppsligar ashantinationens själ och som inte ens kungen sitter på, skulle lämnas ut så att han kunde sitta på den. Under ledning av Yaa Asantewaa, drottningmodern i Ejisu, reste sig ashanti och belägrade britterna, bland dem guvernören, i fortet i Kumasi från april till juli. En undsättningskolonn under överste James Willcocks bröt igenom den 15 juli, och brittiska kolonner ägnade resten av året åt att bryta motståndet över hela landet. Yaa Asantewaa tillfångatogs i mars 1901 och förvisades till Seychellerna tillsammans med andra ledare, och den 1 januari 1902 annekterades Ashanti som brittisk koloni. Själva Gyllene stolen hittades aldrig av britterna; den förblev gömd och förvaras i dag i Kumasi.
