The two claimants first fought together as the “possessing princes” against the Emperor’s commissioner in 1609–1610, then fell out. In 1614 Spain backed Neuburg and the Dutch backed Brandenburg, though the Spanish and Dutch armies avoided fighting each other during their Twelve Years’ Truce.: De två tronpretendenterna stred först tillsammans som de ”besittande furstarna” mot kejsarens kommissarie 1609–1610 och blev sedan osams. År 1614 stödde Spanien Neuburg och Nederländerna Brandenburg, men de spanska och nederländska arméerna undvek att strida mot varandra under sitt tolvåriga stillestånd.
Catholic and Protestant territories used different calendars, ten days apart; dates are as usually given. The partition was provisional and was confirmed by the Treaty of Cleves in 1666.: Katolska och protestantiska territorier använde olika kalendrar med tio dagars skillnad; datum anges så som de vanligen återges. Delningen var provisorisk och bekräftades genom fördraget i Kleve 1666.
