When the mentally ill Duke John William of Jülich-Cleves-Berg died childless on 25 March 1609, two Lutheran princes claimed his rich lands through his sisters, Elector John Sigismund of Brandenburg and Wolfgang William of Palatinate-Neuburg. On 10 June they agreed at Dortmund to rule jointly, but Emperor Rudolf II sent Archduke Leopold, who took over the fortress of Jülich. France, the Dutch Republic and the Protestant Union backed the claimants. Henry IV of France was preparing to intervene in force when he was assassinated on 14 May 1610, yet Dutch, French, English and Union troops besieged Jülich, which surrendered on 1 September.: "När den sinnessjuke hertig Johan Vilhelm av Jülich-Kleve-Berg dog barnlös den 25 mars 1609 gjorde två lutherska furstar anspråk på hans rika länder genom hans systrar: kurfurst Johan Sigismund av Brandenburg och Wolfgang Vilhelm av Pfalz-Neuburg. Den 10 juni kom de i Dortmund överens om att regera gemensamt, men kejsar Rudolf II sände ärkehertig Leopold, som tog över fästningen Jülich. Frankrike, Nederländska republiken och Protestantiska unionen stödde pretendenterna. Henrik IV av Frankrike förberedde en kraftfull intervention när han mördades den 14 maj 1610, men nederländska, franska, engelska och unionens trupper belägrade ändå Jülich, som kapitulerade den 1 september."
The two princes then fell out. In 1613 Wolfgang William became a Catholic and married a sister of Maximilian of Bavaria, and John Sigismund turned Calvinist. In 1614 the Dutch seized Jülich and Wolfgang William took Düsseldorf. Spain’s army under Ambrogio Spinola restored Aachen’s Catholic council in August and took Wesel, while Maurice of Nassau occupied Cleves and Mark. The two armies did not fight, and on 12 November the Treaty of Xanten divided the inheritance, giving Cleves, Mark and Ravensberg to Brandenburg and Jülich and Berg to Neuburg. Spanish and Dutch garrisons stayed on.: De två furstarna blev sedan osams. År 1613 blev Wolfgang Vilhelm katolik och gifte sig med en syster till Maximilian av Bayern, och Johan Sigismund övergick till kalvinismen. År 1614 besatte nederländarna Jülich och Wolfgang Vilhelm tog Düsseldorf. Spaniens armé under Ambrogio Spinola återinsatte i augusti Aachens katolska råd och intog Wesel, medan Moritz av Nassau besatte Kleve och Mark. De två arméerna stred inte, och den 12 november delade fördraget i Xanten arvet och gav Kleve, Mark och Ravensberg till Brandenburg och Jülich och Berg till Neuburg. Spanska och nederländska garnisoner blev kvar.
