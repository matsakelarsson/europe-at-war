The capital of the united duchies, where Duke John William died in 1609. Wolfgang William seized it in 1614 and made it the seat of his new duchy of Jülich-Berg.: De förenade hertigdömenas huvudstad, där hertig Johan Vilhelm dog 1609. Wolfgang Vilhelm besatte staden 1614 och gjorde den till säte för sitt nya hertigdöme Jülich-Berg.
Brandenburg and Neuburg agreed to hold the duchies jointly until their claims were settled, in defiance of the Emperor.: Brandenburg och Neuburg kom överens om att gemensamt inneha hertigdömena tills deras anspråk avgjorts, i trots mot kejsaren.
July – 1 September 1610: juli – 1 september 1610
Archduke Leopold’s garrison surrendered to an army of more than 30,000 Dutch, French, English and German Protestant troops under Maurice of Nassau.: Ärkehertig Leopolds garnison kapitulerade för en armé på mer än 30 000 nederländska, franska, engelska och tyska protestantiska soldater under Moritz av Nassau.
Aachen: Aachen
August 1614: augusti 1614
Spinola enforced the Emperor’s order to restore the Catholic council of the imperial city, where Protestants had taken power in 1611.: Spinola verkställde kejsarens order att återinsätta det katolska rådet i den fria riksstaden, där protestanter hade tagit makten 1611.
September 1614: september 1614
The loss of this Rhine crossing near their border shocked the Dutch. Spain kept it, with Orsoy and Rheinberg, after the treaty.: Förlusten av denna övergång över Rhen nära deras gräns chockade nederländarna. Spanien behöll den, tillsammans med Orsoy och Rheinberg, efter fördraget.
Negotiated by Spanish and Dutch envoys for the two princes, with English and French mediation. Both armies stayed close by while the talks went on.: Förhandlat av spanska och nederländska sändebud för de två furstarnas räkning, med engelsk och fransk medling. Båda arméerna låg kvar i närheten medan förhandlingarna pågick.
