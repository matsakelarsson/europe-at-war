War of the Jülich Succession: Jülichska tronföljdskriget
A war over the inheritance of the united duchies of Jülich, Cleves and Berg on the lower Rhine, claimed by Brandenburg and Palatinate-Neuburg after the last duke died in 1609, which drew in the Emperor, France, the Dutch Republic and Spain. The Treaty of Xanten in 1614 divided the lands, giving the Hohenzollerns of Brandenburg their first territories in western Germany.: Ett krig om arvet efter de förenade hertigdömena Jülich, Kleve och Berg vid nedre Rhen, som Brandenburg och Pfalz-Neuburg gjorde anspråk på sedan den siste hertigen dött 1609, och som drog in kejsaren, Frankrike, Nederländska republiken och Spanien. Fördraget i Xanten 1614 delade länderna och gav Brandenburgs Hohenzollern deras första territorier i västra Tyskland.
