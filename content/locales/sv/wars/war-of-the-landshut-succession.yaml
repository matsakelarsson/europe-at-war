War of the Landshut Succession: Landshutska tronföljdskriget
A war between two branches of the House of Wittelsbach over the duchy of Bavaria-Landshut, which Duke George the Rich had left at his death in December 1503 to his daughter Elisabeth and her husband Rupert of the Palatinate, against the family’s rule of male succession. Albert IV of Bavaria-Munich, backed by King Maximilian I, the Swabian League, Württemberg, Hesse and Nuremberg, fought the Palatine side in 1504, devastating Lower Bavaria and the Rhenish Palatinate; Maximilian beat a Bohemian mercenary army at Wenzenbach on 12 September 1504. Rupert and Elisabeth both died that year, and Maximilian’s award at the Diet of Cologne on 30 July 1505 gave most of the duchy to Munich, reuniting Bavaria. Their young sons received the new principality of Palatinate-Neuburg, Maximilian took Kufstein, Kitzbühel and Rattenberg for Tyrol, and Nuremberg kept Lauf, Hersbruck and Altdorf.: Ett krig mellan två grenar av huset Wittelsbach om hertigdömet Bayern-Landshut, som hertig Georg den rike vid sin död i december 1503 hade testamenterat till sin dotter Elisabeth och hennes make Rupert av Pfalz, i strid med släktens regel om manlig arvsföljd. Albrekt IV av Bayern-München, med stöd av kung Maximilian I, Schwabiska förbundet, Württemberg, Hessen och Nürnberg, bekämpade den pfalziska sidan 1504 och ödelade Niederbayern och Rhenpfalz; Maximilian besegrade en böhmisk legoarmé vid Wenzenbach den 12 september 1504. Rupert och Elisabeth dog båda samma år, och Maximilians skiljedom vid riksdagen i Köln den 30 juli 1505 gav större delen av hertigdömet åt München, vilket återförenade Bayern. Deras unga söner fick det nya furstendömet Pfalz-Neuburg, Maximilian tog Kufstein, Kitzbühel och Rattenberg till Tyrolen, och Nürnberg behöll Lauf, Hersbruck och Altdorf.
