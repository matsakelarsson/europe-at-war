The last duke, Waleran IV, died in 1279 or 1280; his daughter Ermengarde followed in 1283. Shortly before Worringen, Reginald of Guelders sold his own claim to Henry of Luxembourg.: Den siste hertigen, Walram IV, dog 1279 eller 1280; hans dotter Ermengard följde 1283. Strax före Worringen sålde Reinald av Geldern sitt eget anspråk till Henrik av Luxemburg.
After the battle Archbishop Siegfried was held for over a year at Schloss Burg by the Count of Berg, who gave Düsseldorf its town charter that August. The city of Cologne was formally recognised as a free imperial city only in 1475.: Efter slaget hölls ärkebiskop Siegfried fången i mer än ett år på Schloss Burg av greven av Berg, som samma augusti gav Düsseldorf stadsrättigheter. Staden Köln erkändes formellt som fri riksstad först 1475.
