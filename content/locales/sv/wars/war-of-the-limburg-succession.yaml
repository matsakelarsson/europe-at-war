War of the Limburg Succession: Limburgska tronföljdskriget
A war for the Duchy of Limburg, between the Meuse and Aachen, after its heiress Ermengarde died childless in 1283. Her widower, Count Reginald I of Guelders, kept the duchy with the backing of the Archbishop of Cologne, Siegfried of Westerburg, and Count Henry VI of Luxembourg, while Duke John I of Brabant bought the rival claim of the Count of Berg and allied with Berg, Mark, Loon and the townspeople of Cologne. At Worringen, north of Cologne, on 5 June 1288 John won a large and bloody battle; Henry of Luxembourg and two of his brothers were killed, and both the archbishop and Reginald were captured. Limburg passed to Brabant, and the city of Cologne was freed from its archbishop’s rule.: Ett krig om hertigdömet Limburg, mellan Maas och Aachen, sedan dess arvtagerska Ermengarde dött barnlös 1283. Hennes änkling, greve Reinald I av Geldern, behöll hertigdömet med stöd av ärkebiskopen av Köln, Siegfried av Westerburg, och greve Henrik VI av Luxemburg, medan hertig Johan I av Brabant köpte grevens av Berg konkurrerande anspråk och allierade sig med Berg, Mark, Loon och borgarna i Köln. Vid Worringen, norr om Köln, vann Johan den 5 juni 1288 ett stort och blodigt slag; Henrik av Luxemburg och två av hans bröder stupade, och både ärkebiskopen och Reinald togs till fånga. Limburg tillföll Brabant, och staden Köln befriades från ärkebiskopens styre.
