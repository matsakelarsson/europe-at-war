Vincenzo II Gonzaga died on 26 December 1627, three days after his niece Maria, heiress of Montferrat, had married the son of his cousin Charles Gonzaga, Duke of Nevers, a French peer. Nevers took over in Mantua in January 1628. The Spanish governor of Milan, Gonzalo Fernández de Córdoba, had already agreed with Charles Emmanuel I of Savoy to share Montferrat. The emperor had placed both duchies under sequestration until he decided the succession, but in March Córdoba laid siege to Casale, one of the strongest fortresses in Europe, and the Savoyards took Trino and Nizza Monferrato.: Vincenzo II Gonzaga dog den 26 december 1627, tre dagar efter att hans brorsdotter Maria, arvtagerska till Montferrat, hade gift sig med sonen till hans kusin Karl Gonzaga, hertig av Nevers, en fransk pär. Nevers tog över i Mantua i januari 1628. Den spanske guvernören i Milano, Gonzalo Fernández de Córdoba, hade redan kommit överens med Karl Emanuel I av Savojen om att dela Montferrat. Kejsaren hade satt båda hertigdömena under sekvestration tills han avgjort tronföljden, men i mars belägrade Córdoba Casale, en av Europas starkaste fästningar, och savojarna intog Trino och Nizza Monferrato.
Casale held out through the year, defended by Nevers’ troops with French volunteers, and a relief force Nevers raised in France was destroyed by the Savoyards in the Alps. Once the Huguenot stronghold of La Rochelle had surrendered in October 1628, France could act. In March 1629 Louis XIII and Cardinal Richelieu brought an army over the Montgenèvre and on 6 March stormed the barricades the Savoyards had built across the Pass of Susa. Charles Emmanuel came to terms at once, the Spanish lifted the siege of Casale, and French troops moved into Susa and Casale.: Casale höll stånd året ut, försvarat av Nevers trupper med franska frivilliga, och en undsättningsstyrka som Nevers samlat i Frankrike förintades av savojarna i Alperna. När hugenottfästet La Rochelle väl hade kapitulerat i oktober 1628 kunde Frankrike agera. I mars 1629 förde Ludvig XIII och kardinal Richelieu en armé över Montgenèvre och stormade den 6 mars de barrikader som savojarna hade byggt tvärs över passet vid Susa. Karl Emanuel gjorde genast upp, spanjorerna hävde belägringen av Casale, och franska trupper ryckte in i Susa och Casale.
