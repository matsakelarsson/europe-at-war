The French garrison held out against Spinola, who died during the siege. On 26 October Mazarin, riding out between the armies, announced the truce.: Den franska garnisonen höll stånd mot Spinola, som dog under belägringen. Den 26 oktober red Mazarin ut mellan arméerna och tillkännagav stilleståndet.
Signed by France, the emperor and Savoy, it confirmed Nevers as duke of Mantua and Montferrat.: Undertecknad av Frankrike, kejsaren och Savojen; den bekräftade Nevers som hertig av Mantua och Montferrat.
