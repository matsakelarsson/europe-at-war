Spain sent Ambrogio Spinola to try again, and Emperor Ferdinand II, now free of his war with Denmark, sent an army from Germany under Count Collalto. Spinola besieged Casale again, Savoy rejoined Spain, and the imperial army besieged Mantua from late 1629. A French army under Montmorency overran Savoy, and in March 1630 Richelieu took Pinerolo, the key to the western Alps. Plague came with the armies and killed perhaps a third of the people of northern Italy. The war grew savage. In April 1630, at Ostiglia, imperial soldiers killed about 600 villagers, women and children among them, in revenge for an attack by local bandits.: Spanien sände Ambrogio Spinola för att göra ett nytt försök, och kejsar Ferdinand II, som nu var fri från sitt krig med Danmark, sände en armé från Tyskland under greve Collalto. Spinola belägrade Casale på nytt, Savojen anslöt sig åter till Spanien, och den kejserliga armén belägrade Mantua från slutet av 1629. En fransk armé under Montmorency överrände Savojen, och i mars 1630 intog Richelieu Pinerolo, nyckeln till västra Alperna. Pesten kom med arméerna och dödade kanske en tredjedel av befolkningen i norra Italien. Kriget blev allt grymmare. I april 1630 dödade kejserliga soldater i Ostiglia omkring 600 bybor, bland dem kvinnor och barn, som hämnd för ett anfall av lokala banditer.
On 29 May 1630 the imperialists routed a Venetian relief army at Villabuona, and on 18 July they stormed Mantua, whose garrison plague had cut to about 700 fit men. The city and the Gonzaga collections were plundered for three days. Casale held out, and in late October, as a French relief army arrived, the papal envoy Giulio Mazarin rode between the lines to arrange a truce. Ferdinand, now facing Gustavus Adolphus of Sweden in Germany, made peace at Cherasco on 6 April and 19 June 1631. Nevers kept Mantua and Montferrat, Savoy gained Trino and Alba, and by a secret agreement Savoy let France keep Pinerolo, which it held until 1696.: Den 29 maj 1630 slog de kejserliga en venetiansk undsättningsarmé på flykten vid Villabuona, och den 18 juli stormade de Mantua, vars garnison pesten hade minskat till omkring 700 stridsdugliga män. Staden och Gonzagas samlingar plundrades i tre dagar. Casale höll stånd, och i slutet av oktober, när en fransk undsättningsarmé anlände, red det påvliga sändebudet Giulio Mazarin mellan linjerna för att ordna ett stillestånd. Ferdinand, som nu stod inför Gustav II Adolf av Sverige i Tyskland, slöt fred i Cherasco den 6 april och den 19 juni 1631. Nevers behöll Mantua och Montferrat, Savojen vann Trino och Alba, och genom en hemlig överenskommelse lät Savojen Frankrike behålla Pinerolo, som det innehade till 1696.
