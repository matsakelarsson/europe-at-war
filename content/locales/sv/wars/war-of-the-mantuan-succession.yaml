War of the Mantuan Succession: Mantuanska tronföljdskriget
A war over the succession to Mantua and Montferrat after the last Gonzaga duke of the main line died in December 1627. France backed his heir, the French-born Duke of Nevers, while Spain, Savoy and the emperor tried to keep him out; the fighting, a side theatre of the Thirty Years’ War, centred on the fortress of Casale and ended with Nevers confirmed as duke and France holding Pinerolo.: Ett krig om tronföljden i Mantua och Monferrato sedan den siste hertigen av huvudlinjen av Gonzaga dött i december 1627. Frankrike stödde hans arvinge, den franskfödde hertigen av Nevers, medan Spanien, Savojen och kejsaren försökte hålla honom borta; striderna, en bikrigsskådeplats under trettioåriga kriget, kretsade kring fästningen Casale och slutade med att Nevers bekräftades som hertig och att Frankrike behöll Pinerolo.
