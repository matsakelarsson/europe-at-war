Dates are Gregorian. Savoy fought with Spain in 1628, made peace with France at Susa in March 1629, and joined Spain again late that year.: Datum anges enligt den gregorianska kalendern. Savojen stred på Spaniens sida 1628, slöt fred med Frankrike i Susa i mars 1629 och anslöt sig åter till Spanien mot slutet av det året.
Plague, brought by the armies, killed perhaps a third of the people of northern Italy in 1629–1631; Milan and Venice lost about half their inhabitants. The epidemic is the background of Alessandro Manzoni’s novel The Betrothed.: Pesten, som fördes med av arméerna, dödade kanske en tredjedel av befolkningen i norra Italien 1629–1631; Milano och Venedig förlorade omkring hälften av sina invånare. Epidemin utgör bakgrunden till Alessandro Manzonis roman De trolovade.
Wikipedia’s article dates the French capture of Pinerolo to March 1629; it fell to Richelieu’s army on 29 March 1630.: Wikipedias artikel daterar den franska erövringen av Pinerolo till mars 1629; staden föll för Richelieus armé den 29 mars 1630.
