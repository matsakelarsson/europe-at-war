War of the Montferrat Succession: Monferratiska tronföljdskriget
? A war between Charles Emmanuel I of Savoy and Spain over Montferrat, the Gonzaga dukes of Mantua’s duchy in Piedmont. When Duke Francesco IV of Mantua died in December 1612 leaving a daughter, Charles Emmanuel, her grandfather, claimed Montferrat for her and invaded it in April 1613, taking Trino, Alba and Moncalvo. Spain, ruling Milan and anxious about the fortress of Casale on the road between Milan and Genoa, backed Francesco’s brother Ferdinando and drove the Savoyards out. In 1614–1615 the governor of Milan, the Marquis of Hinojosa, invaded Piedmont, until French mediation brought the Peace of Asti in June 1615. Spain disowned it, and in 1616–1617 Savoy fought on with Venetian money, help from the French governor of Dauphiné, Lesdiguières, and German mercenaries under Ernst von Mansfeld. The new governor of Milan, Pedro de Toledo, took Vercelli in July 1617. Treaties at Madrid in September and Pavia in October 1617 restored all conquests, and Ferdinando kept Montferrat. The question came back ten years later in the War of the Mantuan Succession.
: Ett krig mellan Karl Emanuel I av Savojen och Spanien om Monferrato, gonzagahertigarna av Mantuas hertigdöme i Piemonte. När hertig Francesco IV av Mantua dog i december 1612 och efterlämnade en dotter gjorde Karl Emanuel, hennes morfar, anspråk på Monferrato för hennes räkning och invaderade det i april 1613, varvid han intog Trino, Alba och Moncalvo. Spanien, som styrde Milano och var oroligt för fästningen Casale på vägen mellan Milano och Genua, stödde Francescos bror Ferdinando och drev ut savojarderna. Åren 1614–1615 invaderade guvernören i Milano, markisen av Hinojosa, Piemonte, tills fransk medling ledde till freden i Asti i juni 1615. Spanien underkände den, och 1616–1617 fortsatte Savojen kriget med venetianska pengar, hjälp från den franske guvernören i Dauphiné, Lesdiguières, och tyska legosoldater under Ernst von Mansfeld. Den nye guvernören i Milano, Pedro de Toledo, intog Vercelli i juli 1617. Fördragen i Madrid i september och i Pavia i oktober 1617 återställde alla erövringar, och Ferdinando behöll Monferrato. Frågan kom tillbaka tio år senare i mantuanska tronföljdskriget.
