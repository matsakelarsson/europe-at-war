Joanna II died in the capital, which declared for René. Isabella of Lorraine arrived to govern for him in October.: Johanna II dog i huvudstaden, som förklarade sig för René. Isabella av Lothringen anlände för att regera i hans ställe i oktober.
The fortress port north of Naples held out against Alfonso’s first siege, but fell to the Aragonese after his release.: Den befästa hamnstaden norr om Neapel höll stånd mot Alfons första belägring men föll för aragonierna efter hans frigivning.
5 August 1435: 5 augusti 1435
The Genoese, under Biagio Assereto, broke Alfonso’s fleet, and the king was taken with his brothers John and Henry.: Genueserna under Biagio Assereto krossade Alfons flotta, och kungen togs till fånga tillsammans med sina bröder Johan och Henrik.
Filippo Maria Visconti received his royal prisoner as a guest and sent him home as an ally.: Filippo Maria Visconti tog emot sin kunglige fånge som gäst och skickade hem honom som bundsförvant.
December 1435: december 1435
The Genoese rose against the Milanese governor and killed him, and the city became independent again.: Genueserna reste sig mot den milanesiske guvernören och dödade honom, och staden blev åter självständig.
Genoese fleet: Genuesisk flotta
The war became a slow struggle for castles and barons across the kingdom. René had the pope’s support and the services of Giacomo Caldora, the strongest of the kingdom’s captains, and Genoa sent him galleys, but he was always short of money. Alfonso’s brother Peter was killed by a cannon ball during a siege of Naples in October 1438, and the Aragonese garrison of the Castel Nuovo surrendered to René in 1439. But Caldora died that year, his son was a weaker ally, and Alfonso took one stronghold after another, Benevento in 1441, until he could close in on Naples itself.: Kriget blev en utdragen kamp om borgar och baroner över hela kungariket. René hade påvens stöd och tjänster av Giacomo Caldora, den mäktigaste av rikets befälhavare, och Genua sände honom galärer, men han led ständigt brist på pengar. Alfons bror Peter dödades av en kanonkula under en belägring av Neapel i oktober 1438, och den aragoniska garnisonen i Castel Nuovo kapitulerade för René 1439. Men Caldora dog samma år, hans son var en svagare bundsförvant, och Alfons intog det ena fästet efter det andra, Benevento 1441, tills han kunde närma sig själva Neapel.
On 2 June 1442 Aragonese soldiers entered the city through a disused aqueduct, as Belisarius’s men had done nine centuries earlier, and Naples fell. René escaped by sea and went back to Provence. On 26 February 1443 Alfonso entered Naples in a triumph in the Roman style, later commemorated by the marble arch of the Castel Nuovo, and on 14 June 1443, at Terracina, Eugenius IV recognised him as king and his illegitimate son Ferdinand as his heir. Naples became Alfonso’s capital. On his death in 1458 it went to Ferdinand, and Aragon and Sicily to his brother John.: Den 2 juni 1442 tog sig aragoniska soldater in i staden genom en övergiven akvedukt, så som Belisarius män hade gjort nio sekler tidigare, och Neapel föll. René flydde sjövägen och återvände till Provence. Den 26 februari 1443 höll Alfons ett triumftåg i romersk stil in i Neapel, senare förevigat av marmorbågen vid Castel Nuovo, och den 14 juni 1443 i Terracina erkände Eugenius IV honom som kung och hans utomäktenskaplige son Ferdinand som hans arvinge. Neapel blev Alfons huvudstad. Vid hans död 1458 gick det till Ferdinand, och Aragonien och Sicilien till hans bror Johan.
