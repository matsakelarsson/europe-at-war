The papal enclave inside the kingdom fell to Alfonso.: Den påvliga enklaven inne i kungariket föll för Alfons.
A party led through the aqueduct by a local mason opened the way. Earlier, in October 1438, Alfonso’s brother Peter had been killed besieging the city.: En grupp som leddes genom akvedukten av en lokal murare öppnade vägen. Redan i oktober 1438 hade Alfons bror Peter dödats under belägringen av staden.
