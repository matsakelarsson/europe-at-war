War of the Neapolitan Succession, 1435–1442: Neapolitanska tronföljdskriget 1435–1442
The war for the Kingdom of Naples after the death of Queen Joanna II, between her heir René of Anjou and Alfonso V of Aragon, King of Sicily. Captured by the Genoese at Ponza in 1435, Alfonso won over his captor, the Duke of Milan, and slowly conquered the kingdom; he took Naples in June 1442, and the pope recognised him as king in 1443.: Kriget om kungariket Neapel efter drottning Johanna II:s död, mellan hennes arvinge René av Anjou och Alfons V av Aragonien, kung av Sicilien. Sedan Alfons tagits till fånga av genueserna vid Ponza 1435 vann han över sin fångvaktare, hertigen av Milano, på sin sida och erövrade långsamt kungariket; han intog Neapel i juni 1442, och påven erkände honom som kung 1443.
