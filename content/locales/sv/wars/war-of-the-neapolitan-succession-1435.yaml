Angevin and allied success: Angevinska och allierade framgångar
Queen Joanna II of Naples, the last of her line, had adopted first Alfonso V of Aragon, King of Sicily, and then Louis III of Anjou as her heir. When she died on 2 February 1435 Louis was already dead, and her will named his brother René of Anjou. René was a prisoner of the Duke of Burgundy, so his wife Isabella of Lorraine came to Naples to rule for him, while Alfonso, who had never given up his claim, besieged Gaeta. Pope Eugenius IV claimed the right to decide as the kingdom’s overlord, and Filippo Maria Visconti of Milan, then master of Genoa, backed the Angevins.: Drottning Johanna II av Neapel, den sista av sin ätt, hade adopterat först Alfons V av Aragonien, kung av Sicilien, och sedan Ludvig III av Anjou som sin arvinge. När hon dog den 2 februari 1435 var Ludvig redan död, och hennes testamente utsåg hans bror René av Anjou. René var fånge hos hertigen av Burgund, så hans hustru Isabella av Lothringen kom till Neapel för att regera i hans ställe, medan Alfons, som aldrig hade gett upp sitt anspråk, belägrade Gaeta. Påven Eugenius IV gjorde anspråk på rätten att avgöra saken som rikets länsherre, och Filippo Maria Visconti av Milano, som då behärskade Genua, stödde angevinerna.
On 5 August 1435 a Genoese fleet sent to relieve Gaeta met Alfonso’s larger fleet off the island of Ponza and routed it, capturing Alfonso, two of his brothers and many nobles. They were taken to Milan, but Alfonso persuaded Filippo Maria that a French king in Naples would threaten Milan more than he would, and in October he was freed as the duke’s ally. Genoa, furious, threw off Milanese rule at the end of the year. The Aragonese took Gaeta, which became Alfonso’s base; René, ransomed, reached Naples only in May 1438.: Den 5 augusti 1435 mötte en genuesisk flotta, som sänts för att undsätta Gaeta, Alfons större flotta utanför ön Ponza och slog den på flykten och tillfångatog Alfons, två av hans bröder och många adelsmän. De fördes till Milano, men Alfons övertygade Filippo Maria om att en fransk kung i Neapel skulle hota Milano mer än han själv, och i oktober frigavs han som hertigens bundsförvant. Det rasande Genua kastade av sig det milanesiska styret i slutet av året. Aragonierna intog Gaeta, som blev Alfons bas; René, som friköpts, nådde Neapel först i maj 1438.
