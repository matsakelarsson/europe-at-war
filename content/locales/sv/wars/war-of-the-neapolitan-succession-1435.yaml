Alfonso V of Aragon is Alfonso I of Naples. The Kingdom of Naples is shown as one polity throughout; in 1442 it passed from René of Anjou to Alfonso, who ruled it alongside Aragon, Sicily and Sardinia until his death in 1458.: Alfons V av Aragonien är Alfons I av Neapel. Kungariket Neapel visas som en enda politisk enhet under hela perioden; 1442 övergick det från René av Anjou till Alfons, som styrde det jämte Aragonien, Sicilien och Sardinien fram till sin död 1458.
Milan and Genoa began the war on the Angevin side. After Ponza the Duke of Milan made peace with Alfonso, and Genoa, rebelling against Milan, kept up the war against him.: Milano och Genua inledde kriget på den angevinska sidan. Efter Ponza slöt hertigen av Milano fred med Alfons, och Genua, som gjorde uppror mot Milano, fortsatte kriget mot honom.
