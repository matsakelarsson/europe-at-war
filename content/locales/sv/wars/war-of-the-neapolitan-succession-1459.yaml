War of the Neapolitan Succession, 1459–1464: Neapolitanska tronföljdskriget 1459–1464
The war for the Kingdom of Naples after the death of Alfonso V of Aragon in 1458, who left it to his illegitimate son Ferdinand (Ferrante). Many barons, led by the Prince of Taranto, Giovanni Antonio Orsini del Balzo, rose against him and called in John of Anjou, son of René, who landed in October 1459 with help from French-ruled Genoa. On 7 July 1460 the Angevins and rebels beat Ferdinand near Sarno, and the condottiere Jacopo Piccinino overran the Abruzzi for them. Ferdinand held on with help from Pope Pius II, Francesco Sforza of Milan and the Albanian leader Skanderbeg, who crossed the Adriatic with troops in 1461, and on 18 August 1462 he and Alessandro Sforza routed John and Piccinino at Troia in Apulia. The Prince of Taranto made peace, other barons followed, and in 1464 John left the kingdom; Angevin holdouts on Ischia were beaten at sea in 1465.: Kriget om kungariket Neapel efter Alfons V av Aragoniens död 1458; han hade lämnat det åt sin utomäktenskaplige son Ferdinand (Ferrante). Många baroner under fursten av Taranto, Giovanni Antonio Orsini del Balzo, reste sig mot honom och kallade in Johan av Anjou, Renés son, som landsteg i oktober 1459 med hjälp från det franskstyrda Genua. Den 7 juli 1460 besegrade anjouerna och rebellerna Ferdinand nära Sarno, och kondottiären Jacopo Piccinino överrumplade Abruzzerna för deras räkning. Ferdinand höll stånd med hjälp av påven Pius II, Francesco Sforza av Milano och den albanske ledaren Skanderbeg, som gick över Adriatiska havet med trupper 1461, och den 18 augusti 1462 slog han och Alessandro Sforza Johan och Piccinino på flykten vid Troia i Apulien. Fursten av Taranto slöt fred, andra baroner följde efter, och 1464 lämnade Johan kungariket; anjouiska motståndsfästen på Ischia besegrades till sjöss 1465.
