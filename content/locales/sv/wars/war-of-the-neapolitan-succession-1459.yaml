Italian historians often call the barons’ revolt of 1459–1462 the first conspiracy of the barons, to distinguish it from that of 1485–1486. Genoa was under French rule from 1458 until it rebelled in 1461.: Italienska historiker kallar ofta baronupproret 1459–1462 den första baronsammansvärjningen, för att skilja det från det 1485–1486. Genua stod under franskt styre från 1458 tills staden gjorde uppror 1461.
