War of the Oranges: Apelsinkriget
A brief war in 1801 in which Spain, urged on by Napoleon, invaded Portugal to force it to break with Britain. Olivenza and Juromenha surrendered at once and Campo Maior after a siege, but Elvas held out, and by the Treaty of Badajoz Portugal closed its ports to British ships, paid an indemnity and ceded Olivenza to Spain.: Ett kort krig 1801 där Spanien, påhejat av Napoleon, invaderade Portugal för att tvinga landet att bryta med Storbritannien. Olivenza och Juromenha kapitulerade genast och Campo Maior efter en belägring, men Elvas höll stånd, och genom freden i Badajoz stängde Portugal sina hamnar för brittiska fartyg, betalade ett skadestånd och avträdde Olivenza till Spanien.
