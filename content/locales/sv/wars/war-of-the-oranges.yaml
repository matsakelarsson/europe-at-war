The town surrendered on the first day. Ceded to Spain at Badajoz, it has been Spanish ever since, though Portugal still claims it.: Staden kapitulerade den första dagen. Den avträddes till Spanien i Badajoz och har varit spansk sedan dess, men Portugal gör fortfarande anspråk på den.
