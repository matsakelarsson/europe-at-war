The fighting lasted less than three weeks. The name comes from the oranges Godoy picked under the walls of Elvas and sent to Queen Maria Luisa.: Striderna varade mindre än tre veckor. Namnet kommer från apelsinerna som Godoy plockade under murarna i Elvas och skickade till drottning Maria Luisa.
Portugal later declared the Treaty of Badajoz void, and has never formally recognised Spanish sovereignty over Olivenza (Olivença in Portuguese).: Portugal förklarade senare freden i Badajoz ogiltig och har aldrig formellt erkänt spansk suveränitet över Olivenza (Olivença på portugisiska).
Portuguese moves: Portugisiska trupprörelser
Portuguese success: Portugisiska framgångar
In 1800 and 1801 Napoleon, then First Consul, and Manuel Godoy, the chief minister of Charles IV of Spain, demanded that Portugal, Britain’s last ally on the Continent, break its alliance and close its ports to British ships. Portugal refused. At dawn on 20 May 1801 Godoy’s Spanish army of Extremadura crossed the border on the Guadiana. Olivenza and nearby Juromenha, their walls unfinished and held by a few hundred men, mostly militia, surrendered at once. The garrison of Campo Maior held two Spanish divisions for 17 days, and at Elvas the Portuguese threw back Godoy’s assault.: Åren 1800 och 1801 krävde Napoleon, då förste konsul, och Manuel Godoy, Karl IV av Spaniens förste minister, att Portugal, Storbritanniens sista allierade på kontinenten, skulle bryta sin allians och stänga sina hamnar för brittiska fartyg. Portugal vägrade. I gryningen den 20 maj 1801 gick Godoys spanska Extremaduraarmé över gränsen vid Guadiana. Olivenza och närbelägna Juromenha, vars murar var ofullbordade och som hölls av några hundra man, mest milis, kapitulerade genast. Garnisonen i Campo Maior band två spanska divisioner i 17 dagar, och vid Elvas slog portugiserna tillbaka Godoys stormning.
The war then stalled, with the Spanish tied down in sieges and a French corps waiting in Spain. Godoy picked oranges outside Elvas and sent them to Queen Maria Luisa, with word that he would go on to Lisbon. Portugal, with no help from Britain, gave way. By the Treaty of Badajoz of 6 June it agreed to close its ports to the British, give trade concessions to France and pay an indemnity, and it ceded Olivenza and its district east of the Guadiana; Spain returned the other towns it had taken. Napoleon, who wanted more, imposed a harsher Treaty of Madrid on 29 September. Meanwhile in South America the Portuguese seized the Spanish missions east of the Uruguay River, and kept them.: Kriget stannade sedan av, med spanjorerna bundna vid belägringar och en fransk kår som väntade i Spanien. Godoy plockade apelsiner utanför Elvas och skickade dem till drottning Maria Luisa med beskedet att han skulle fortsätta till Lissabon. Portugal, som inte fick någon hjälp från Storbritannien, gav vika. Genom freden i Badajoz den 6 juni gick landet med på att stänga sina hamnar för britterna, ge Frankrike handelsförmåner och betala ett skadestånd, och det avträdde Olivenza med dess distrikt öster om Guadiana; Spanien återlämnade de andra städer som det hade intagit. Napoleon, som ville ha mer, påtvingade en hårdare fred i Madrid den 29 september. Under tiden besatte portugiserna i Sydamerika de spanska missionerna öster om Uruguayfloden och behöll dem.
