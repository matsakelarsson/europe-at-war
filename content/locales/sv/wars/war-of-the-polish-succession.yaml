When Augustus II, king of Poland and elector of Saxony, died on 1 February 1733, the Polish nobles gathered near Warsaw elected Stanisław Leszczyński, who had been king under Swedish protection in 1704–1709 and whose daughter was married to Louis XV. Russia and Austria backed Augustus’s son, Frederick Augustus of Saxony; a Russian army crossed the border, and on 5 October a minority of nobles under its protection elected him Augustus III. Stanisław took refuge in Danzig, which Russian troops under Field Marshal Münnich, later joined by the Saxons, besieged from February 1734. A French force of about 2,000 men landed at the mouth of the Vistula in May but had to surrender, and the city capitulated at the end of June. Stanisław had escaped days before, disguised as a peasant.: När August II, kung av Polen och kurfurste av Sachsen, dog den 1 februari 1733 valde den polska adeln, samlad nära Warszawa, Stanisław Leszczyński, som hade varit kung under svenskt beskydd 1704–1709 och vars dotter var gift med Ludvig XV. Ryssland och Österrike stödde Augusts son, Fredrik August av Sachsen; en rysk armé gick över gränsen, och den 5 oktober valde en minoritet av adeln under dess beskydd honom till August III. Stanisław tog sin tillflykt till Danzig, som ryska trupper under fältmarskalk Münnich, senare förstärkta av sachsarna, belägrade från februari 1734. En fransk styrka på omkring 2 000 man landsteg vid Weichsels mynning i maj men tvingades kapitulera, och staden kapitulerade i slutet av juni. Stanisław hade flytt några dagar tidigare, förklädd till bonde.
France declared war on the Emperor Charles VI on 10 October 1733, allied with Spain and with Charles Emmanuel III of Sardinia, who was promised Milan. A French army crossed the Rhine and took Kehl at the end of October, and in 1734 it besieged Philippsburg. Prince Eugene, now seventy, could not gather an army strong enough to relieve it. The French commander, the Duke of Berwick, was killed by a cannonball in the trenches on 12 June, but the fortress surrendered on 18 July. After that the Rhine saw little fighting, and the war was decided in Italy.: Frankrike förklarade krig mot kejsar Karl VI den 10 oktober 1733, i allians med Spanien och med Karl Emanuel III av Sardinien, som lovades Milano. En fransk armé gick över Rhen och intog Kehl i slutet av oktober, och 1734 belägrade den Philippsburg. Prins Eugen, nu sjuttio år gammal, kunde inte samla en armé som var stark nog att undsätta staden. Den franske befälhavaren, hertigen av Berwick, dödades av en kanonkula i löpgravarna den 12 juni, men fästningen kapitulerade den 18 juli. Därefter förekom få strider vid Rhen, och kriget avgjordes i Italien.
