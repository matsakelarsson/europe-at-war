War of the Polish Succession: Polska tronföljdskriget
After Augustus II died in 1733, most of the Polish nobility elected Stanisław Leszczyński with French backing, while Russia and Austria put Augustus III of Saxony on the throne. Russian troops took Danzig, where Stanisław had taken refuge, in 1734, and the war between France, Spain and Sardinia and the Emperor was fought mostly in the Rhineland and Italy. The peace agreed at Vienna in 1735 left Augustus III king of Poland and gave Stanisław the Duchy of Lorraine for life.: Sedan August II dött 1733 valde större delen av den polska adeln Stanisław Leszczyński med franskt stöd, medan Ryssland och Österrike satte August III av Sachsen på tronen. Ryska trupper intog 1734 Danzig, dit Stanisław hade tagit sin tillflykt, och kriget mellan Frankrike, Spanien och Sardinien å ena sidan och kejsaren å den andra utkämpades mest i Rhenlandet och Italien. Den fred som överenskoms i Wien 1735 lämnade August III som kung av Polen och gav Stanisław hertigdömet Lothringen på livstid.
