Most of the nobility chose Stanisław at the electoral field of Wola. A smaller assembly, protected by Russian troops, elected Augustus III across the Vistula.: Större delen av adeln valde Stanisław på valfältet i Wola. En mindre församling, skyddad av ryska trupper, valde August III på andra sidan Weichsel.
The great Baltic port held out for Stanisław for four months. After its surrender it had to accept Augustus III.: Den stora östersjöhamnen höll stånd för Stanisław i fyra månader. Efter kapitulationen måste den godta August III.
