By 1735 Austria, with no help from Britain or the Dutch Republic, had lost almost all its Italian lands except Mantua, and a Russian corps sent to help it reached the Rhine too late to fight. Preliminaries of peace were agreed at Vienna on 3 October 1735, and after long negotiations the Treaty of Vienna was signed on 18 November 1738. Augustus III kept Poland. Stanisław gave up the crown and received the duchies of Lorraine and Bar for life, after which they were to pass to France, as they did when he died in 1766. Lorraine’s own duke, Francis Stephen, who married Maria Theresa in 1736, received Tuscany instead when the last Medici grand duke died in 1737.: År 1735 hade Österrike, utan hjälp från Storbritannien eller Nederländska republiken, förlorat nästan alla sina italienska besittningar utom Mantua, och en rysk kår som sänts till dess hjälp nådde Rhen för sent för att delta i striderna. Preliminärfred avtalades i Wien den 3 oktober 1735, och efter långa förhandlingar undertecknades freden i Wien den 18 november 1738. August III behöll Polen. Stanisław avsade sig kronan och fick hertigdömena Lothringen och Bar på livstid, varefter de skulle tillfalla Frankrike, vilket de gjorde när han dog 1766. Lothringens egen hertig, Frans Stefan, som gifte sig med Maria Teresia 1736, fick i stället Toscana när den siste mediceiske storhertigen dog 1737.
Don Carlos was recognised as king of Naples and Sicily, and gave up Parma and Piacenza to the Emperor, though he took the Farnese art collections to Naples with him. Charles Emmanuel of Sardinia gained Novara and Tortona from the Duchy of Milan, which returned to Austria. France also recognised the Pragmatic Sanction, the law by which Charles VI wanted his daughter Maria Theresa to inherit all his lands. When he died in 1740, that promise did not hold.: Don Carlos erkändes som kung av Neapel och Sicilien och avstod Parma och Piacenza till kejsaren, men han tog med sig de farnesiska konstsamlingarna till Neapel. Karl Emanuel av Sardinien vann Novara och Tortona från hertigdömet Milano, som återgick till Österrike. Frankrike erkände också den pragmatiska sanktionen, den lag genom vilken Karl VI ville att hans dotter Maria Teresia skulle ärva alla hans länder. När han dog 1740 höll det löftet inte.
