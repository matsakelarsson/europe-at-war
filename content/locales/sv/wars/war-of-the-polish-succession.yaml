In Italy the Austrians were caught unprepared. In the autumn of 1733 a French and Sardinian army under Charles Emmanuel and the aged Marshal Villars overran the Duchy of Milan, and only the fortress of Mantua held out. In 1734 the Austrians under Count Mercy came back over the Alps and pressed the allies back to Parma, but on 29 June Mercy was killed attacking their lines outside the city, at San Pietro or La Crocetta, in a battle that cost both sides heavily. On 19 September his successor, Count Königsegg, attacked the allies again at Guastalla on the Po and was beaten, and the Austrians fell back on Mantua and the Tyrol.: I Italien togs österrikarna på sängen. Hösten 1733 överrände en fransk och sardisk armé under Karl Emanuel och den åldrade marskalk Villars hertigdömet Milano, och endast fästningen Mantua höll stånd. År 1734 kom österrikarna under greve Mercy tillbaka över Alperna och trängde tillbaka de allierade till Parma, men den 29 juni dödades Mercy när han anföll deras linjer utanför staden, vid San Pietro eller La Crocetta, i ett slag som kostade båda sidor dyrt. Den 19 september anföll hans efterträdare, greve Königsegg, åter de allierade vid Guastalla vid Po och besegrades, och österrikarna drog sig tillbaka till Mantua och Tyrolen.
Meanwhile Elisabeth Farnese’s son Don Carlos, Duke of Parma since 1731, led a Spanish army of some 21,000 men south through the Papal States to claim Naples. He entered the city in May 1734, and on 25 May the Count of Montemar beat the outnumbered Austrians at Bitonto in Apulia. Gaeta fell in August and Capua in November, and Spanish troops crossed to Sicily, where the last Austrian fortresses fell in 1735. Philip V gave his son both kingdoms, and Carlos was crowned king of Sicily at Palermo on 3 July 1735. For the first time in more than two centuries Naples had a king who lived there.: Under tiden ledde Elisabet Farneses son don Carlos, hertig av Parma sedan 1731, en spansk armé på omkring 21 000 man söderut genom Kyrkostaten för att göra anspråk på Neapel. Han tågade in i staden i maj 1734, och den 25 maj besegrade greven av Montemar de underlägsna österrikarna vid Bitonto i Apulien. Gaeta föll i augusti och Capua i november, och spanska trupper gick över till Sicilien, där de sista österrikiska fästningarna föll 1735. Filip V gav sin son båda kungarikena, och Carlos kröntes till kung av Sicilien i Palermo den 3 juli 1735. För första gången på mer än två sekler hade Neapel en kung som bodde där.
