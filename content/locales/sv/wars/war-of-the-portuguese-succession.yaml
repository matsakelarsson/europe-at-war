War of the Portuguese Succession: Portugisiska tronföljdskriget
The war in which Philip II of Spain made good his claim to the Portuguese throne after the deaths of King Sebastian in 1578 and Cardinal-King Henry in 1580. The Duke of Alba defeated the rival claimant, António, Prior of Crato, at Alcântara outside Lisbon in 1580, and the Marquis of Santa Cruz won the Azores in 1582–1583, beginning sixty years of union between the Spanish and Portuguese crowns.: Kriget där Filip II av Spanien drev igenom sitt anspråk på den portugisiska tronen efter kung Sebastians död 1578 och kardinalkungen Henriks död 1580. Hertigen av Alba besegrade tronrivalen António, prior av Crato, vid Alcântara utanför Lissabon 1580, och markisen av Santa Cruz vann Azorerna 1582–1583, vilket inledde sextio år av union mellan den spanska och den portugisiska kronan.
