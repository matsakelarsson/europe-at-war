Only the Azores held out for António, above all Terceira, whose harbour at Angra was a port of call for the fleets returning from the Indies and America. On 25 July 1581 a Spanish landing at Salga Bay on Terceira was beaten off when the islanders drove half-wild cattle into the troops. Catherine de’ Medici, herself a claimant, backed a fleet of about 60 ships under the Florentine exile Filippo Strozzi, which reached the islands in July 1582. On 26 July, off São Miguel, Santa Cruz defeated it with fewer but larger ships. Strozzi was killed, and Santa Cruz had many prisoners executed as pirates, since France and Spain were not formally at war.: Endast Azorerna höll stånd för António, framför allt Terceira, vars hamn i Angra var en anlöpningshamn för flottorna som återvände från Indien och Amerika. Den 25 juli 1581 slogs en spansk landstigning vid Salgabukten på Terceira tillbaka när öborna drev halvvild boskap in bland trupperna. Katarina av Medici, själv tronpretendent, stödde en flotta på omkring 60 fartyg under den florentinske landsflyktingen Filippo Strozzi, som nådde öarna i juli 1582. Den 26 juli utanför São Miguel besegrade Santa Cruz den med färre men större fartyg. Strozzi dödades, och Santa Cruz lät avrätta många fångar som pirater, eftersom Frankrike och Spanien inte formellt låg i krig.
António went back to France for more men, and in 1583 Santa Cruz returned with nearly 100 ships and about 15,000 men. On 26 July he landed at the Baía das Mós, away from the defended harbours, stormed the beach defences and took Angra within days. The French and English soldiers were allowed to leave, but leading Portuguese supporters of António were executed, and the other islands submitted. António lived on in exile in France and England, joined an English attempt on Lisbon in 1589 and died in Paris in 1595. Portugal remained united with Spain until 1640.: António återvände till Frankrike för att skaffa fler män, och 1583 kom Santa Cruz tillbaka med nästan 100 fartyg och omkring 15 000 man. Den 26 juli landsteg han vid Baía das Mós, på avstånd från de försvarade hamnarna, stormade strandförsvaret och intog Angra inom några dagar. De franska och engelska soldaterna fick lämna ön, men ledande portugisiska anhängare till António avrättades, och de övriga öarna underkastade sig. António levde vidare i exil i Frankrike och England, deltog i ett engelskt försök mot Lissabon 1589 och dog i Paris 1595. Portugal förblev förenat med Spanien till 1640.
