Dates up to early October 1582 are Julian. Spain and Portugal adopted the Gregorian calendar in October 1582, so the dates of 1583 are Gregorian.: Datum fram till början av oktober 1582 anges enligt den julianska kalendern. Spanien och Portugal införde den gregorianska kalendern i oktober 1582, så datumen för 1583 är gregorianska.
Under the Iberian Union Portugal kept its own laws, coinage, Cortes and empire, and was ruled by the Spanish kings as a separate kingdom. On the map it stays Portugal.: Under den iberiska unionen behöll Portugal sina egna lagar, sitt eget mynt, sina cortes och sitt imperium och styrdes av de spanska kungarna som ett separat kungarike. På kartan förblir det Portugal.
