King Sebastian’s death at Alcácer Quibir left the throne to his great-uncle, Cardinal Henry, who was old and childless and died on 31 January 1580 without naming an heir. The strongest claimants were Philip II of Spain, a grandson of King Manuel I through his mother; Catherine, Duchess of Braganza, a granddaughter through a son; and António, Prior of Crato, Manuel’s grandson in the male line but born out of wedlock. Most of the nobles and higher clergy, many won over with Spanish money, accepted Philip. The common people of Lisbon and many towns favoured António, who was acclaimed king at Santarém on 24 July.: Kung Sebastians död vid Alcácer Quibir lämnade tronen till hans farfars bror, kardinal Henrik, som var gammal och barnlös och dog den 31 januari 1580 utan att ha utsett någon arvinge. De starkaste tronpretendenterna var Filip II av Spanien, sonson till kung Manuel I genom sin mor; Katarina, hertiginna av Bragança, sondotter genom en son; och António, prior av Crato, Manuels sonson på manssidan men född utom äktenskapet. De flesta adelsmännen och det högre prästerskapet, av vilka många vunnits över med spanska pengar, godtog Filip. Det vanliga folket i Lissabon och i många städer föredrog António, som hyllades som kung i Santarém den 24 juli.
Philip had already sent his army in. The aged Duke of Alba crossed the border near Elvas in late June with a large army, many of them German and Italian mercenaries, while a fleet under the Marquis of Santa Cruz took Setúbal and carried the troops round to Cascais. On 25 August Alba routed António’s hastily raised army of townsmen, peasants and freed slaves at the bridge of Alcântara, just west of Lisbon, and the city surrendered. Sancho Dávila took Porto in October; António hid for months and escaped to France. In April 1581 the Cortes at Tomar acclaimed Philip king, and he promised that Portugal would keep its own laws and offices.: Filip hade redan skickat in sin armé. Den åldrade hertigen av Alba gick över gränsen nära Elvas i slutet av juni med en stor armé, varav många var tyska och italienska legosoldater, medan en flotta under markisen av Santa Cruz intog Setúbal och förde trupperna runt till Cascais. Den 25 augusti krossade Alba Antónios hastigt uppbådade armé av stadsbor, bönder och frigivna slavar vid bron i Alcântara strax väster om Lissabon, och staden kapitulerade. Sancho Dávila intog Porto i oktober; António höll sig gömd i månader och flydde till Frankrike. I april 1581 hyllade cortes i Tomar Filip som kung, och han lovade att Portugal skulle behålla sina egna lagar och ämbeten.
