War of the Public Weal: Det allmänna bästas krig
A revolt of great French nobles against Louis XI, led by Charles the Bold, then Count of Charolais and heir to Burgundy, with the king’s brother Charles of Berry as figurehead and Francis II of Brittany, John of Bourbon and John of Calabria among its leaders. They called their alliance the League of the Public Weal, claiming to act for the common good against the king’s ministers and taxes. The Burgundian army fought the king to a draw at Montlhéry on 16 July 1465 and besieged Paris with its allies, and Louis bought peace in the treaties of Conflans and Saint-Maur that October, giving Normandy to his brother and the Somme towns back to Burgundy. He took Normandy back the next year, and spent the rest of his reign breaking up the coalition.: En revolt bland franska stormän mot Ludvig XI, ledd av Karl den djärve, då greve av Charolais och arvinge till Burgund, med kungens bror Karl av Berry som galjonsfigur och Frans II av Bretagne, Johan av Bourbon och Johan av Kalabrien bland ledarna. De kallade sin allians Ligan för det allmänna bästa och hävdade att de handlade för det gemensamma bästa mot kungens ministrar och skatter. Den burgundiska armén mötte kungen i ett oavgjort slag vid Montlhéry den 16 juli 1465 och belägrade Paris tillsammans med sina allierade, och Ludvig köpte fred genom fördragen i Conflans och Saint-Maur i oktober samma år, varvid han gav Normandie åt sin bror och lämnade tillbaka Sommestäderna till Burgund. Han tog tillbaka Normandie året därpå och ägnade resten av sin regeringstid åt att splittra koalitionen.
