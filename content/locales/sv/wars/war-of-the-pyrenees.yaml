The Republic, its internal revolts crushed, now sent larger armies south. General Dugommier, who had retaken Toulon, broke the Spanish lines on the Tech at Boulou on 29 April – 1 May 1794, and the Spanish fled over the border leaving their guns and baggage. Collioure fell in May with its 7,000-strong garrison, and Bellegarde was starved into surrender in September. From 17 to 20 November Dugommier attacked the Spanish entrenchments around the Black Mountain north of Figueres. Both commanders were killed, Dugommier and the Count of La Unión, and the Spanish army broke. The great fortress of Sant Ferran at Figueres surrendered within days with some 9,000 men, and Roses fell in February 1795.: Republiken, som hade krossat de inre revolterna, sände nu större arméer söderut. General Dugommier, som hade återtagit Toulon, bröt de spanska linjerna vid Tech vid Boulou den 29 april – 1 maj 1794, och spanjorerna flydde över gränsen och lämnade kvar sina kanoner och sin tross. Collioure föll i maj med sin garnison på 7 000 man, och Bellegarde svältes till kapitulation i september. Den 17–20 november anföll Dugommier de spanska förskansningarna kring Svarta berget norr om Figueres. Båda befälhavarna dödades, Dugommier och greven av La Unión, och den spanska armén bröts. Den stora fästningen Sant Ferran i Figueres kapitulerade inom några dagar med omkring 9 000 man, och Roses föll i februari 1795.
In the west General Moncey seized the Baztan valley in July 1794, then Fuenterrabía on 1 August and San Sebastián two days later, both with little resistance. In 1795 he pushed into Álava and Biscay, taking Vitoria on 17 July and Bilbao two days later, and crossed the Ebro. Spain, with its armies beaten and its treasury empty, made peace at Basel on 22 July 1795. France gave back all it had taken in Spain and received the Spanish half of the island of Hispaniola. Charles IV gave his minister Manuel Godoy the title “Prince of the Peace”, and in 1796 Spain allied itself with France against Britain.: I väster besatte general Moncey Baztándalen i juli 1794, sedan Fuenterrabía den 1 augusti och San Sebastián två dagar senare, båda med ringa motstånd. År 1795 trängde han in i Álava och Biscaya, intog Vitoria den 17 juli och Bilbao två dagar senare och gick över Ebro. Spanien, vars arméer var slagna och statskassa tom, slöt fred i Basel den 22 juli 1795. Frankrike lämnade tillbaka allt det hade intagit i Spanien och fick den spanska halvan av ön Hispaniola. Karl IV gav sin minister Manuel Godoy titeln ”Fredsfursten”, och 1796 allierade sig Spanien med Frankrike mot Storbritannien.
