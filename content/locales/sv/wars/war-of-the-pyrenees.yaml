Also called the War of Roussillon or the War of the Convention (in Spanish Guerra del Rosellón or Guerra de la Convención, in Catalan Guerra Gran). Spanish ships and troops also helped defend Toulon in 1793; that siege is told with the French Revolutionary Wars.: Kallas också Roussillonkriget eller Konventskriget (på spanska Guerra del Rosellón eller Guerra de la Convención, på katalanska Guerra Gran). Spanska fartyg och trupper hjälpte också till att försvara Toulon 1793; den belägringen skildras under de franska revolutionskrigen.
Dates are Gregorian. French sources of the time use the Revolutionary calendar from late 1793.: Datum anges enligt den gregorianska kalendern. Samtida franska källor använder revolutionskalendern från slutet av 1793.
Spanish and Portuguese moves: Spanska och portugisiska trupprörelser
France declared war on Spain on 7 March 1793, six weeks after guillotining Louis XVI, a Bourbon cousin of Charles IV. In April Captain General Antonio Ricardos crossed the eastern Pyrenees into Roussillon with a small but well-led army. He beat the French at Mas Deu on 19 May and besieged the frontier fort of Bellegarde, which surrendered on 24 June. In September he sent two divisions to cut off Perpignan, the provincial capital, but they were stopped at Peyrestortes on 17 September; five days later Ricardos beat the main French army at Truillas and fell back to a strong position on the River Tech.: Frankrike förklarade Spanien krig den 7 mars 1793, sex veckor efter att ha giljotinerat Ludvig XVI, en bourbonsk kusin till Karl IV. I april gick generalkaptenen Antonio Ricardos över östra Pyrenéerna in i Roussillon med en liten men väl ledd armé. Han besegrade fransmännen vid Mas Deu den 19 maj och belägrade gränsfortet Bellegarde, som kapitulerade den 24 juni. I september sände han två divisioner för att skära av Perpignan, provinsens huvudstad, men de hejdades vid Peyrestortes den 17 september; fem dagar senare besegrade Ricardos den franska huvudarmén vid Truillas och drog sig tillbaka till en stark ställning vid floden Tech.
"French attacks on his lines failed through the autumn. A Portuguese division of some 5,000 men under John Forbes joined the Spanish, and on 20 December General Cuesta took the ports of Collioure and Port-Vendres, so that the Spanish wintered on French soil. On the Basque frontier the war was a matter of raids and outposts along the Bidasoa. The French Republic was harsh with its own people as well as its enemies: generals who lost battles risked the guillotine, royalist prisoners were shot, and in March 1794, after some of their young men fled across the border, the people of Sare and other French Basque villages were deported to the Landes, where some 1,600 died. Ricardos died in Madrid on 6 March 1794.": "Franska anfall mot hans linjer misslyckades under hela hösten. En portugisisk division på omkring 5 000 man under John Forbes anslöt sig till spanjorerna, och den 20 december intog general Cuesta hamnarna Collioure och Port-Vendres, så att spanjorerna övervintrade på fransk mark. Vid den baskiska gränsen bestod kriget av räder och utpostfäktningar längs Bidasoa. Franska republiken var hård mot sitt eget folk såväl som mot sina fiender: generaler som förlorade slag riskerade giljotinen, rojalistiska fångar sköts, och i mars 1794, sedan några av deras unga män flytt över gränsen, deporterades invånarna i Sare och andra franska baskiska byar till Landes, där omkring 1 600 dog. Ricardos dog i Madrid den 6 mars 1794."
