The fort above the pass of Le Perthus was the key to the main road from Spain. Its garrison surrendered after a month.: Fortet ovanför passet vid Le Perthus var nyckeln till huvudvägen från Spanien. Dess garnison kapitulerade efter en månad.
The capital of Roussillon was never taken. The French victory at Peyrestortes on 17 September ended the Spanish attempt to cut it off.: Roussillons huvudstad intogs aldrig. Den franska segern vid Peyrestortes den 17 september gjorde slut på det spanska försöket att skära av den.
