War of the Pyrenees: Pyrenéiska kriget
The war between Revolutionary France and Spain, with a Portuguese contingent, fought on both ends of the Pyrenees in 1793–1795 as part of the War of the First Coalition. A Spanish army under Antonio Ricardos invaded Roussillon in 1793, but in 1794 the French drove it out, won the Battle of the Black Mountain and took Figueres, while in the west they overran the Basque provinces. Spain made peace at Basel in July 1795, giving up its half of Hispaniola.: Kriget mellan det revolutionära Frankrike och Spanien, med en portugisisk kontingent, som utkämpades i båda ändarna av Pyrenéerna 1793–1795 som en del av första koalitionskriget. En spansk armé under Antonio Ricardos invaderade Roussillon 1793, men 1794 drev fransmännen ut den, vann slaget vid Svarta berget och intog Figueres, medan de i väster överrumplade de baskiska provinserna. Spanien slöt fred i Basel i juli 1795 och avstod sin halva av Hispaniola.
