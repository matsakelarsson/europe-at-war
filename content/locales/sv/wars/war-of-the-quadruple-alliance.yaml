The Quadruple Alliance was agreed in London on 2 August 1718 by Britain, France and Austria; Savoy joined later in the year, and the Dutch Republic, whose name the alliance anticipated, in 1719.: Kvadrupelalliansen avtalades i London den 2 augusti 1718 av Storbritannien, Frankrike och Österrike; Savojen anslöt sig senare samma år, och Nederländska republiken, vars namn alliansen räknade med i förväg, 1719.
Britain and Spain fought at sea from 1718, but Britain declared war only in December 1718 and France in January 1719. There was also minor fighting in North America, around Pensacola.: Storbritannien och Spanien stred till sjöss från 1718, men Storbritannien förklarade krig först i december 1718 och Frankrike i januari 1719. Det förekom också mindre strider i Nordamerika, kring Pensacola.
Philip V’s queen, Elisabeth Farnese, and his minister, Cardinal Alberoni, wanted to win back the Italian lands Spain had lost at Utrecht. In August 1717 a Spanish expedition from Barcelona landed at Cagliari and by the end of October had taken all of Sardinia from the Emperor. On 1 July 1718 about 30,000 Spanish troops under the Marquis of Lede landed near Palermo, in the Kingdom of Sicily, which Victor Amadeus of Savoy had held since 1713. Palermo opened its gates, and the Spaniards overran most of the island and besieged the citadel of Messina. On 2 August Britain, France and Austria formed the Quadruple Alliance in London to force Spain to withdraw.: Filip V:s drottning, Elisabet Farnese, och hans minister, kardinal Alberoni, ville vinna tillbaka de italienska besittningar som Spanien hade förlorat i Utrecht. I augusti 1717 landsteg en spansk expedition från Barcelona i Cagliari och hade i slutet av oktober tagit hela Sardinien från kejsaren. Den 1 juli 1718 landsteg omkring 30 000 spanska soldater under markisen av Lede nära Palermo, i kungariket Sicilien, som Viktor Amadeus av Savojen hade innehaft sedan 1713. Palermo öppnade sina portar, och spanjorerna överrände större delen av ön och belägrade citadellet i Messina. Den 2 augusti bildade Storbritannien, Frankrike och Österrike kvadrupelalliansen i London för att tvinga Spanien att dra sig tillbaka.
Admiral Sir George Byng had already sailed with a British fleet. On 11 August, off Cape Passaro at the south-eastern tip of Sicily, he caught the Spanish fleet strung out along the coast and attacked, although Britain and Spain were not at war. In a running fight the Spanish lost seven ships of the line and six frigates, and more were scuttled by their crews. The Spanish army was now cut off on the island. It took the citadel of Messina at the end of September and beat an Austrian force from Naples at Milazzo on 15 October, but the Austrians held on to a bridgehead there. Britain declared war on Spain in December, and France in January 1719.: Amiral Sir George Byng hade redan seglat med en brittisk flotta. Den 11 augusti, utanför Kap Passaro på Siciliens sydöstra udde, hann han upp den spanska flottan, som låg utspridd längs kusten, och anföll, trots att Storbritannien och Spanien inte låg i krig. I en jaktstrid förlorade spanjorerna sju linjeskepp och sex fregatter, och fler sänktes av sina egna besättningar. Den spanska armén var nu avskuren på ön. Den intog citadellet i Messina i slutet av september och besegrade en österrikisk styrka från Neapel vid Milazzo den 15 oktober, men österrikarna höll fast vid ett brohuvud där. Storbritannien förklarade Spanien krig i december, och Frankrike i januari 1719.
