War of the Quadruple Alliance: Kvadrupelalliansens krig
? A war in which Spain, led by Philip V’s minister Cardinal Giulio Alberoni and Queen Elisabeth Farnese, tried to win back the Italian lands lost at Utrecht, and Britain, France, Austria and Savoy, later joined by the Dutch Republic, combined to stop it. Spain had seized Austrian Sardinia in 1717, and in July 1718 it landed an army in Sicily, then ruled by Savoy; on 11 August Admiral George Byng destroyed the Spanish fleet off Cape Passaro. Austrian troops fought the Spaniards in Sicily, losing at Francavilla in June 1719 but taking Messina that autumn, while a French army under the Duke of Berwick invaded northern Spain and took Fuenterrabía and San Sebastián, and a British force raided Vigo. Spain also backed the Jacobite rising of 1719 in Scotland. Philip V dismissed Alberoni in December 1719 and accepted the allies’ terms in the Treaty of The Hague of 17 February 1720. Spain left Sicily and Sardinia; Austria took Sicily and Savoy received Sardinia in exchange, and the Emperor Charles VI gave up his claim to Spain, while Don Carlos, Elisabeth Farnese’s son, was promised the succession to Parma and Tuscany.
: Ett krig där Spanien, lett av Filip V:s minister kardinal Giulio Alberoni och drottning Elisabet Farnese, försökte återvinna de italienska länder som gått förlorade vid Utrecht, och Storbritannien, Frankrike, Österrike och Savojen, senare även Nederländska republiken, gick samman för att stoppa det. Spanien hade lagt beslag på det österrikiska Sardinien 1717, och i juli 1718 landsatte det en armé på Sicilien, som då styrdes av Savojen; den 11 augusti förintade amiral George Byng den spanska flottan vid Kap Passaro. Österrikiska trupper bekämpade spanjorerna på Sicilien, förlorade vid Francavilla i juni 1719 men intog Messina samma höst, medan en fransk armé under hertigen av Berwick invaderade norra Spanien och intog Fuenterrabía och San Sebastián, och en brittisk styrka härjade Vigo. Spanien stödde också jakobiternas uppror 1719 i Skottland. Filip V avskedade Alberoni i december 1719 och godtog de allierades villkor i fördraget i Haag den 17 februari 1720. Spanien lämnade Sicilien och Sardinien; Österrike tog Sicilien och Savojen fick Sardinien i utbyte, och kejsar Karl VI avstod från sina anspråk på Spanien, medan Don Carlos, Elisabet Farneses son, utlovades tronföljden i Parma och Toscana.
