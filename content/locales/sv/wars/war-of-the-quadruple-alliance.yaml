Lede: Lede
Held by Spain, end of 1718: I spanska händer i slutet av 1718
In 1719 France attacked by land. The Duke of Berwick, who had won Almansa for Philip V twelve years before, led a French army into the Basque country and took Fuenterrabía in June and San Sebastián in August, and in October a British expedition seized Vigo. Spain backed a Jacobite landing in Scotland, which failed at Glen Shiel in June. In Sicily, an Austrian army of about 24,000 men under Count Mercy, ferried over by the British fleet, attacked the Spanish lines at Francavilla on 20 June and was beaten back with heavy losses. Mercy then besieged Messina, which fell in the autumn, but Lede’s army still held most of the island.: År 1719 anföll Frankrike till lands. Hertigen av Berwick, som tolv år tidigare hade vunnit slaget vid Almansa åt Filip V, ledde en fransk armé in i Baskien och intog Fuenterrabía i juni och San Sebastián i augusti, och i oktober besatte en brittisk expedition Vigo. Spanien stödde en jakobitisk landstigning i Skottland, som misslyckades vid Glen Shiel i juni. På Sicilien anföll en österrikisk armé på omkring 24 000 man under greve Mercy, överförd av den brittiska flottan, de spanska linjerna vid Francavilla den 20 juni och slogs tillbaka med svåra förluster. Mercy belägrade sedan Messina, som föll på hösten, men Ledes armé höll fortfarande större delen av ön.
Philip V dismissed Alberoni in December 1719 and accepted the allies’ terms in the Treaty of The Hague of 17 February 1720. The Spanish troops left Sicily and Sardinia, and the two islands changed rulers as the allies had agreed in 1718. Austria took Sicily, which was reunited with Naples under the Emperor, and Victor Amadeus received Sardinia instead, taking the title King of Sardinia; the island was handed over to him on 8 August 1720. The Emperor Charles VI recognised Philip V as king of Spain, and Elisabeth Farnese’s son Don Carlos was promised the succession to Parma and Tuscany.: Filip V avskedade Alberoni i december 1719 och godtog de allierades villkor i fördraget i Haag den 17 februari 1720. De spanska trupperna lämnade Sicilien och Sardinien, och de två öarna bytte härskare så som de allierade hade kommit överens om 1718. Österrike tog Sicilien, som återförenades med Neapel under kejsaren, och Viktor Amadeus fick i stället Sardinien och antog titeln kung av Sardinien; ön överlämnades till honom den 8 augusti 1720. Kejsar Karl VI erkände Filip V som kung av Spanien, och Elisabet Farneses son don Carlos tillförsäkrades tronföljden i Parma och Toscana.
