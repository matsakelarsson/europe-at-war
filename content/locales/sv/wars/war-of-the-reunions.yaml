War of the Reunions: Reunionskriget
A short war between France and Spain over Louis XIV’s “reunions”, the annexation of towns and lands along France’s eastern border, from Montbéliard to Luxembourg, which special courts, the Chambers of Reunion, claimed had once belonged to territories ceded to France. Strasbourg was seized in 1681 in the same policy. With the Emperor tied down by the Ottoman siege of Vienna, French troops entered the Spanish Netherlands in September 1683, and Spain declared war in October. The French took Courtrai and Dixmude, bombarded Luxembourg in December and besieged it in the spring; Vauban took the fortress in June 1684. In the Truce of Ratisbon (Regensburg) of 15 August 1684 Spain and the Emperor accepted France’s possession of Strasbourg, Luxembourg and the reunited lands for twenty years, and France gave back Courtrai and Dixmude.: Ett kort krig mellan Frankrike och Spanien om Ludvig XIV:s ”reunioner”, annekteringen av städer och landområden längs Frankrikes östgräns, från Montbéliard till Luxemburg, som särskilda domstolar, reunionskamrarna, hävdade en gång hade hört till territorier som avträtts till Frankrike. Strasbourg togs 1681 som en del av samma politik. Medan kejsaren var bunden av den osmanska belägringen av Wien ryckte franska trupper in i Spanska Nederländerna i september 1683, och Spanien förklarade krig i oktober. Fransmännen intog Courtrai och Dixmude, bombarderade Luxemburg i december och belägrade staden under våren; Vauban intog fästningen i juni 1684. Genom stilleståndet i Ratisbon (Regensburg) den 15 augusti 1684 godtog Spanien och kejsaren Frankrikes innehav av Strasbourg, Luxemburg och de reunierade områdena för tjugo år, och Frankrike lämnade tillbaka Courtrai och Dixmude.
France: Frankrike
Spain: Spanien
