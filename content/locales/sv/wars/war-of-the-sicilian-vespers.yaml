After 1282 both kingdoms still called themselves the Kingdom of Sicily. Historians call the island kingdom Sicily (or, after 1302, Trinacria) and the mainland kingdom Naples, as the map does.: Efter 1282 kallade sig båda rikena fortfarande Kungariket Sicilien. Historiker kallar örikets kungadöme Sicilien (eller, efter 1302, Trinacria) och fastlandsriket Neapel, och så gör även kartan.
Whether the rising was planned is disputed. Peter III and the Byzantine emperor Michael VIII, whom Charles was preparing to attack, had both been plotting against him, and later legend gave the leading role to the exile John of Procida.: Om resningen var planerad är omstritt. Peter III och den bysantinske kejsaren Mikael VIII, som Karl förberedde ett angrepp mot, hade båda konspirerat mot honom, och senare legender gav huvudrollen åt landsflyktingen Johannes av Procida.
The French crusade against Aragon in 1284–1285 has its own entry, the Aragonese Crusade. Frederick of Sicily is usually numbered Frederick III, though some historians call him Frederick II.: Det franska korståget mot Aragonien 1284–1285 har ett eget uppslag, Aragoniska korståget. Fredrik av Sicilien brukar räknas som Fredrik III, även om en del historiker kallar honom Fredrik II.
