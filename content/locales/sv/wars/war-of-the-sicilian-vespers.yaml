Charles of Anjou ruled the Kingdom of Sicily from Naples, and the island resented his heavy taxes, his French officials and the use of its wealth for his planned conquest of Constantinople. On Easter Monday, 30 March 1282, at the hour of vespers outside the church of Santo Spirito in Palermo, a French soldier is said to have insulted a Sicilian woman and was killed by her husband. The crowd turned on the French, and in the night and the days that followed, by the chroniclers’ count, some 2,000 French men, women and children were killed in Palermo. The rising spread across the island. Messina rose at the end of April and burned the ships gathered there for Charles’s expedition.: Karl av Anjou styrde Kungariket Sicilien från Neapel, och ön harmades över hans tunga skatter, hans franska ämbetsmän och att dess rikedomar användes till hans planerade erövring av Konstantinopel. På annandag påsk, 30 mars 1282, vid tiden för aftonsången utanför kyrkan Santo Spirito i Palermo, ska en fransk soldat ha förolämpat en siciliansk kvinna och dödats av hennes make. Folkmassan vände sig mot fransmännen, och under natten och dagarna som följde dödades enligt krönikörernas beräkning omkring 2 000 franska män, kvinnor och barn i Palermo. Resningen spred sig över ön. Messina reste sig i slutet av april och brände de fartyg som samlats där för Karls expedition.
The rebels formed communes and offered to place themselves under the pope, who refused. Charles crossed the strait with a large army and besieged Messina from July, but its people, women among them, held the walls. The Sicilians then offered the crown to Peter III of Aragon, whose wife Constance was Manfred’s daughter and heir. Peter, who had been waiting with a fleet at Collo on the African coast, landed at Trapani on 30 August and was proclaimed king in Palermo on 4 September. As his army marched on Messina, Charles, in danger of being cut off, withdrew to Calabria at the end of September.: Rebellerna bildade kommuner och erbjöd sig att ställa sig under påven, som avböjde. Karl gick över sundet med en stor armé och belägrade Messina från juli, men dess invånare, bland dem kvinnor, höll murarna. Sicilianarna erbjöd då kronan åt Peter III av Aragonien, vars hustru Konstantia var Manfreds dotter och arvtagerska. Peter, som hade väntat med en flotta vid Collo på den afrikanska kusten, landsteg i Trapani den 30 augusti och utropades till kung i Palermo den 4 september. När hans armé marscherade mot Messina drog sig Karl, som riskerade att bli avskuren, tillbaka till Kalabrien i slutet av september.
