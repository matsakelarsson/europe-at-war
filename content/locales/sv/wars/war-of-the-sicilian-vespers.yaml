In May 1302 Charles of Valois, brother of Philip IV of France, whom Boniface VIII had called to Italy, landed at Termini with a large army to join Robert of Calabria. Frederick avoided battle and let the invaders wear themselves out in the summer heat. Charles besieged Sciacca, on the south coast, where disease ravaged his army. With neither side able to win, Charles of Valois, Robert and Frederick met at Caltabellotta, a hill town above Sciacca, and agreed a peace on 31 August 1302.: I maj 1302 landsteg Karl av Valois, bror till Filip IV av Frankrike, som Bonifatius VIII hade kallat till Italien, i Termini med en stor armé för att förena sig med Robert av Kalabrien. Fredrik undvek slag och lät inkräktarna nöta ut sig i sommarhettan. Karl belägrade Sciacca på sydkusten, där sjukdomar härjade i hans armé. Eftersom ingen av sidorna kunde vinna möttes Karl av Valois, Robert och Fredrik i Caltabellotta, en bergsstad ovanför Sciacca, och kom överens om fred den 31 augusti 1302.
Frederick kept the island for life with the title King of Trinacria, the old Greek name for Sicily, and married Charles II’s daughter Eleanor. On his death the island was to return to the Angevins, and his heirs were to be compensated elsewhere. Each side gave back what it held in the other’s lands. Boniface VIII confirmed the peace in 1303. But Frederick never meant the island to go back, and when war broke out again in 1313–1314 the Sicilian parliament recognised his son Peter as heir. Sicily and Naples fought on and off until 1372.: Fredrik fick behålla ön på livstid med titeln kung av Trinacria, det gamla grekiska namnet på Sicilien, och gifte sig med Karl II:s dotter Eleonora. Vid hans död skulle ön återgå till anjouerna, och hans arvingar skulle kompenseras på annat håll. Båda sidor lämnade tillbaka det de höll i den andres länder. Bonifatius VIII bekräftade freden 1303. Men Fredrik hade aldrig för avsikt att låta ön gå tillbaka, och när kriget bröt ut igen 1313–1314 erkände det sicilianska parlamentet hans son Peter som arvinge. Sicilien och Neapel krigade med avbrott fram till 1372.
