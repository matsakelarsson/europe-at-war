Pope Martin IV, a Frenchman and Charles’s ally, excommunicated Peter, declared him deposed from Aragon and granted that kingdom to Charles of Valois, son of Philip III of France. Charles of Anjou challenged Peter to settle the war by a combat of a hundred knights each at Bordeaux on 1 June 1283; it was never fought, and each king claimed that the other had failed to appear. The war was decided at sea. On 8 July 1283 the Aragonese and Sicilian fleet under its admiral Roger of Lauria, a southern Italian exile in Aragonese service, destroyed an Angevin fleet sent to relieve the French garrison of Malta, and Aragonese troops held much of the Calabrian coast.: Påven Martin IV, en fransman och Karls bundsförvant, bannlyste Peter, förklarade honom avsatt i Aragonien och gav det riket åt Karl av Valois, son till Filip III av Frankrike. Karl av Anjou utmanade Peter att avgöra kriget genom en strid mellan hundra riddare på vardera sidan i Bordeaux den 1 juni 1283; den utkämpades aldrig, och båda kungarna hävdade att den andre inte hade infunnit sig. Kriget avgjordes till sjöss. Den 8 juli 1283 förintade den aragonisk-sicilianska flottan under amiralen Roger av Lauria, en syditaliensk landsflykting i aragonisk tjänst, en anjouisk flotta som sänts för att undsätta den franska garnisonen på Malta, och aragoniska trupper höll en stor del av Kalabriens kust.
On 5 June 1284 Lauria lured the fleet of Charles’s son, Charles of Salerno, out of Naples and captured him with many of his ships. Charles of Anjou besieged Reggio that summer but had to withdraw, and he died at Foggia on 7 January 1285. In 1285 Philip III of France invaded Aragon itself in a crusade that ended in disaster. Lauria destroyed the French fleet at Les Formigues, and Philip died at Perpignan in October on the retreat. Peter III died in November. Aragon passed to his elder son Alfonso III, and Sicily to his younger son James.: Den 5 juni 1284 lockade Lauria ut flottan under Karls son, Karl av Salerno, från Neapel och tillfångatog honom tillsammans med många av hans fartyg. Karl av Anjou belägrade Reggio den sommaren men tvingades dra sig tillbaka, och han dog i Foggia den 7 januari 1285. År 1285 invaderade Filip III av Frankrike själva Aragonien i ett korståg som slutade i katastrof. Lauria förintade den franska flottan vid Les Formigues, och Filip dog i Perpignan under återtåget i oktober. Peter III dog i november. Aragonien gick till hans äldre son Alfonso III och Sicilien till hans yngre son Jakob.
