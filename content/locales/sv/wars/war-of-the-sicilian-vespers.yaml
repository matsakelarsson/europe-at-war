The rising began at the church of Santo Spirito, outside the walls. Rebels are said to have made suspects say the word “ciciri”, which the French could not pronounce.: Resningen började vid kyrkan Santo Spirito, utanför murarna. Rebellerna ska ha tvingat misstänkta att säga ordet ”ciciri”, som fransmännen inte kunde uttala.
Led by Alaimo da Lentini, the townspeople beat off Charles’s assaults until the Aragonese approached.: Under ledning av Alaimo da Lentini slog stadsborna tillbaka Karls stormningar tills aragonierna närmade sig.
