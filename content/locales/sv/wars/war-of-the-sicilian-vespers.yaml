James was crowned King of Sicily in Palermo in 1286, and the war went on. On 23 June 1287 Lauria destroyed another Angevin fleet in the Bay of Naples, in what became known as the Battle of the Counts after the many nobles taken prisoner. Charles of Salerno, now King Charles II, was released in 1288 under the Treaty of Canfranc, promising to work for peace, but the pope annulled the agreement and crowned him king of the whole kingdom in 1289. Aragon itself was under pressure from France and the papacy, and in 1291 Alfonso III agreed at Tarascon to abandon Sicily, but he died that June.: Jakob kröntes till kung av Sicilien i Palermo 1286, och kriget fortsatte. Den 23 juni 1287 förintade Lauria ännu en anjouisk flotta i Neapelbukten, i det som blev känt som Grevarnas slag efter de många adelsmän som togs till fånga. Karl av Salerno, nu kung Karl II, släpptes 1288 enligt fördraget i Canfranc mot löfte att verka för fred, men påven ogiltigförklarade överenskommelsen och krönte honom till kung över hela riket 1289. Aragonien självt var under tryck från Frankrike och påvedömet, och 1291 gick Alfonso III i Tarascon med på att överge Sicilien, men han dog i juni samma år.
James now became King of Aragon too, and left his younger brother Frederick to govern Sicily. To secure Aragon, James made peace with France, the pope and Charles II in the Treaty of Anagni of 20 June 1295. He gave Sicily up to the Church, to be returned to the Angevins, and married Charles’s daughter Blanche; Pope Boniface VIII later granted him Sardinia and Corsica instead. The Sicilians refused to be handed back. Their parliament proclaimed Frederick king, and he was crowned in Palermo on 25 March 1296.: Jakob blev nu även kung av Aragonien och lät sin yngre bror Fredrik styra Sicilien. För att trygga Aragonien slöt Jakob fred med Frankrike, påven och Karl II genom fördraget i Anagni den 20 juni 1295. Han lämnade Sicilien till kyrkan, för att återlämnas till anjouerna, och gifte sig med Karls dotter Blanka; påven Bonifatius VIII gav honom senare Sardinien och Korsika i stället. Sicilianarna vägrade att lämnas tillbaka. Deras parlament utropade Fredrik till kung, och han kröntes i Palermo den 25 mars 1296.
