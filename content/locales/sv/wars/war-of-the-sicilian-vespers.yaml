Lauria, 1287: Lauria 1287
Frederick took the war to the mainland, invading Calabria and Apulia in 1296–1297. Roger of Lauria, who quarrelled with him, went over to James, now bound by the treaty to help the pope and the Angevins win back the island. In 1298 James and Lauria brought an Aragonese fleet to Sicily, and on 4 July 1299 off Cape Orlando they defeated Frederick’s fleet, though James then went home. Angevin troops under Charles II’s son Robert of Calabria landed and took Catania and other towns in the east of the island.: Fredrik förde kriget till fastlandet och invaderade Kalabrien och Apulien 1296–1297. Roger av Lauria, som hade blivit osams med honom, gick över till Jakob, som nu genom fördraget var bunden att hjälpa påven och anjouerna att vinna tillbaka ön. År 1298 förde Jakob och Lauria en aragonisk flotta till Sicilien, och den 4 juli 1299 besegrade de Fredriks flotta utanför Kap Orlando, även om Jakob sedan återvände hem. Anjouiska trupper under Karl II:s son Robert av Kalabrien landsteg och tog Catania och andra städer på öns östra del.
On land the Sicilians held their own. On 1 December 1299 Frederick routed an Angevin army at Falconaria near Trapani and captured its commander, Charles II’s son Philip of Taranto, and in 1300 his Aragonese captain Blasco de Alagón won again at Gagliano. At sea Lauria was still the master, and on 14 June 1300 he destroyed a Sicilian and Genoese fleet off Ponza. But the Angevins could not conquer the island, and Robert’s siege of Messina in 1301 failed through hunger and disease.: På land höll sicilianarna stånd. Den 1 december 1299 krossade Fredrik en anjouisk armé vid Falconaria nära Trapani och tillfångatog dess befälhavare, Karl II:s son Filip av Taranto, och 1300 segrade hans aragoniske kapten Blasco de Alagón åter vid Gagliano. Till sjöss var Lauria fortfarande herre, och den 14 juni 1300 förintade han en siciliansk och genuesisk flotta utanför Ponza. Men anjouerna kunde inte erövra ön, och Roberts belägring av Messina 1301 misslyckades på grund av svält och sjukdom.
