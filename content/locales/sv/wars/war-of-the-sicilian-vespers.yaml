War of the Sicilian Vespers: Den sicilianska aftonsångens krig
The war that followed the rising of the Sicilians against Charles of Anjou in 1282, when the island gave its crown to Peter III of Aragon. Aragonese and Sicilian fleets under Roger of Lauria won almost every battle at sea; when Aragon made peace in 1295, the Sicilians crowned Peter’s son Frederick and fought on against the Angevins, the papacy and Aragon itself, until the Peace of Caltabellotta in 1302 left Sicily to Frederick and split the old kingdom in two.: Kriget som följde på sicilianarnas resning mot Karl av Anjou 1282, när ön gav sin krona åt Peter III av Aragonien. Aragoniska och sicilianska flottor under Roger av Lauria vann nästan varje slag till sjöss; när Aragonien slöt fred 1295 krönte sicilianarna Peters son Fredrik och fortsatte kampen mot anjouerna, påvedömet och Aragonien självt, tills freden i Caltabellotta 1302 lämnade Sicilien åt Fredrik och delade det gamla kungariket i två.
