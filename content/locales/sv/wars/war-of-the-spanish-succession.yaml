15 August 1702: 15 augusti 1702
Eugene attacked Vendôme’s army by the Po. The fighting went on until midnight; the imperials lost about 2,000 men and the French perhaps twice as many, but neither side gave way.: Eugen angrep Vendômes armé vid Po. Striderna pågick till midnatt; de kejserliga förlorade omkring 2 000 man och fransmännen kanske dubbelt så många, men ingen av sidorna gav vika.
In the Low Countries the Earl of Marlborough, who commanded the allied army there, took the fortresses of the Meuse – Venlo, Roermond and Liège – in the autumn of 1702, and Bonn in May 1703. Maximilian II Emanuel, Elector of Bavaria, sided with Louis XIV and seized the imperial city of Ulm in September 1702, as his brother, the Elector of Cologne, had already done. Marshal Villars crossed the Rhine and fought the Margrave of Baden at Friedlingen, and in 1703 he joined the Elector on the Danube, where they beat an imperial army at Höchstädt on 20 September. With Hungary in revolt under Francis II Rákóczi, Vienna seemed in danger. But in 1703 Portugal joined the Grand Alliance, and Savoy changed sides.: I Nederländerna intog earlen av Marlborough, som förde befälet över den allierade armén där, Maasfästningarna – Venlo, Roermond och Liège – hösten 1702, och Bonn i maj 1703. Maximilian II Emanuel, kurfurste av Bayern, ställde sig på Ludvig XIV:s sida och tog den fria riksstaden Ulm i september 1702, så som hans bror, kurfursten av Köln, redan hade gjort. Marskalk Villars gick över Rhen och drabbade samman med markgreven av Baden vid Friedlingen, och 1703 förenade han sig med kurfursten vid Donau, där de slog en kejserlig armé vid Höchstädt den 20 september. Med Ungern i uppror under Frans II Rákóczi tycktes Wien vara i fara. Men 1703 anslöt sig Portugal till stora alliansen, och Savojen bytte sida.
In May 1704 Marlborough marched an allied army some 400 km from near Cologne to the Danube in five weeks, keeping friend and foe guessing where he was going. On 2 July he stormed the Schellenberg above Donauwörth, and his troops burned villages across Bavaria to force the Elector to change sides. On 13 August, near the village of Blindheim, Marlborough and Prince Eugene attacked the armies of the Elector and Marshals Tallard and Marsin. Marlborough broke the French centre, and some 10,000 French infantry trapped in Blindheim surrendered. Tallard was taken prisoner; the Franco-Bavarian army lost more than 30,000 men killed, wounded and captured, against some 12,000 allies. The Emperor occupied Bavaria until the peace.: I maj 1704 marscherade Marlborough med en allierad armé omkring 400 km från trakten av Köln till Donau på fem veckor, och höll vän och fiende ovetande om vart han var på väg. Den 2 juli stormade han Schellenberg ovanför Donauwörth, och hans trupper brände byar över hela Bayern för att tvinga kurfursten att byta sida. Den 13 augusti, nära byn Blindheim, angrep Marlborough och prins Eugen kurfurstens och marskalkarna Tallards och Marsins arméer. Marlborough bröt igenom det franska centrum, och omkring 10 000 franska infanterister som stängts inne i Blindheim kapitulerade. Tallard togs till fånga; den fransk-bayerska armén förlorade mer än 30 000 man i döda, sårade och fångar, mot omkring 12 000 allierade. Kejsaren ockuperade Bayern fram till freden.
