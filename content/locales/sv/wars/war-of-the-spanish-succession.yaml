When Charles II of Spain, the last of the Spanish Habsburgs, died childless on 1 November 1700, his will left the whole Spanish monarchy – Spain and its American empire, the Spanish Netherlands, Milan, Naples, Sicily and Sardinia – to Philip, Duke of Anjou, a grandson of Louis XIV, who accepted it for him. The Emperor Leopold I claimed it for his younger son, Archduke Charles. England and the Dutch at first recognised Philip V, but in February 1701 French troops replaced the Dutch garrisons in the barrier fortresses of the Spanish Netherlands, and Louis kept Philip’s right to the French throne. On 7 September 1701 the Emperor, England and the Dutch Republic formed the Grand Alliance at The Hague; they declared war in May 1702.: När Karl II av Spanien, den siste av de spanska habsburgarna, dog barnlös den 1 november 1700 testamenterade han hela den spanska monarkin – Spanien och dess amerikanska imperium, Spanska Nederländerna, Milano, Neapel, Sicilien och Sardinien – till Filip, hertig av Anjou, en sonson till Ludvig XIV, som tog emot arvet för hans räkning. Kejsar Leopold I gjorde anspråk på det för sin yngre son, ärkehertig Karl. England och nederländarna erkände först Filip V, men i februari 1701 ersatte franska trupper de nederländska garnisonerna i barriärfästningarna i Spanska Nederländerna, och Ludvig behöll Filips rätt till den franska tronen. Den 7 september 1701 bildade kejsaren, England och Nederländska republiken stora alliansen i Haag; de förklarade krig i maj 1702.
The fighting began in Italy, where Leopold wanted the Duchy of Milan, an imperial fief. In May 1701 Prince Eugene of Savoy led about 30,000 imperial troops over mountain tracks from Tyrol into the neutral Venetian lands, and on 9 July he drove a French force from Carpi on the Adige. On 1 September Marshal Villeroi attacked his entrenchments at Chiari and was thrown back with heavy losses. On the night of 31 January 1702 imperial soldiers got into Cremona through an old aqueduct and seized Villeroi, but Irish regiments in French service drove them out. In August Eugene fought Villeroi’s successor, the Duke of Vendôme, to a bloody draw at Luzzara, and by the end of 1702 the French had won back most of the lost ground.: Striderna började i Italien, där Leopold ville ha hertigdömet Milano, ett kejserligt län. I maj 1701 förde prins Eugen av Savojen omkring 30 000 kejserliga soldater över bergsstigar från Tyrolen in i de neutrala venetianska områdena, och den 9 juli drev han en fransk styrka från Carpi vid Adige. Den 1 september angrep marskalk Villeroi hans förskansningar vid Chiari och kastades tillbaka med svåra förluster. Natten den 31 januari 1702 tog sig kejserliga soldater in i Cremona genom en gammal akvedukt och grep Villeroi, men irländska regementen i fransk tjänst drev ut dem. I augusti utkämpade Eugen ett blodigt oavgjort slag vid Luzzara mot Villerois efterträdare, hertigen av Vendôme, och i slutet av 1702 hade fransmännen vunnit tillbaka större delen av den förlorade marken.
