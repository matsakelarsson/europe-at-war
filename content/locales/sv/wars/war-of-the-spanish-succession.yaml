Ghent and Bruges: Gent och Brygge
July 1708: juli 1708
Townspeople let French troops into both cities by surprise, cutting the allies’ waterways to the sea.: Stadsborna släppte överraskande in franska trupper i båda städerna och skar av de allierades vattenvägar till havet.
11 July 1708: 11 juli 1708
Marlborough’s army force-marched to the Scheldt and attacked the French as they crossed it. The French lost about 15,000 men, many of them captured.: Marlboroughs armé gick i ilmarsch till Schelde och angrep fransmännen medan de gick över floden. Fransmännen förlorade omkring 15 000 man, många av dem tillfångatagna.
Battle of Wijnendale: Slaget vid Wijnendale
