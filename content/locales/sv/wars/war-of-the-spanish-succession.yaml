The year 1707 went badly for the allies. In Spain the Duke of Berwick crushed the allied army at Almansa on 25 April, and Philip V took back Valencia and Aragon; in Germany Villars broke through the Lines of Stollhofen and raided deep into Swabia; and an attack on Toulon by Eugene and the Duke of Savoy, supported by the British fleet, failed in August. In Italy, though, Austrian troops marched through the Papal States and took Naples from Philip V. In July 1708 a French army under the Duke of Burgundy, Louis XIV’s grandson, and Vendôme retook Ghent and Bruges, whose citizens had tired of allied rule.: Året 1707 gick dåligt för de allierade. I Spanien krossade hertigen av Berwick den allierade armén vid Almansa den 25 april, och Filip V tog tillbaka Valencia och Aragonien; i Tyskland bröt Villars igenom Stollhofenlinjerna och gjorde räder djupt in i Schwaben; och ett angrepp på Toulon av Eugen och hertigen av Savojen, med stöd av den brittiska flottan, misslyckades i augusti. I Italien marscherade dock österrikiska trupper genom Kyrkostaten och tog Neapel från Filip V. I juli 1708 återtog en fransk armé under hertigen av Burgund, Ludvig XIV:s sonson, och Vendôme Gent och Brygge, vars borgare hade tröttnat på det allierade styret.
Marlborough, joined by Eugene, caught the French crossing the Scheldt at Oudenaarde on 11 July 1708. The battle was a scramble in which units joined as they arrived. Burgundy and Vendôme quarrelled, much of the French army never fought, and by nightfall Dutch troops under Overkirk had almost surrounded the French right. The allies then besieged Lille, one of France’s richest cities and its strongest fortress, rebuilt by Vauban. Marshal Boufflers held out for 120 days, while a convoy of munitions from Ostend fought its way through at Wijnendale. The town surrendered on 22 October and the citadel on 10 December, and early in 1709 the allies retook Ghent and Bruges.: Marlborough, som fått sällskap av Eugen, överraskade fransmännen när de gick över Schelde vid Oudenaarde den 11 juli 1708. Slaget var ett virrvarr där förbanden gick in i striden allteftersom de anlände. Burgund och Vendôme grälade, en stor del av den franska armén kom aldrig i strid, och vid mörkrets inbrott hade nederländska trupper under Overkirk nästan omringat den franska högerflygeln. De allierade belägrade sedan Lille, en av Frankrikes rikaste städer och dess starkaste fästning, ombyggd av Vauban. Marskalk Boufflers höll ut i 120 dagar, medan en ammunitionskonvoj från Oostende kämpade sig igenom vid Wijnendale. Staden kapitulerade den 22 oktober och citadellet den 10 december, och tidigt 1709 återtog de allierade Gent och Brygge.
Battle of Oudenaarde: Slaget vid Oudenaarde
