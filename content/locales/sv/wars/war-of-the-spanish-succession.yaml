Eugene’s last success in the war, taken after a short siege. Villars won it back in October.: Eugens sista framgång i kriget, intaget efter en kort belägring. Villars vann tillbaka det i oktober.
Landrecies: Landrecies
Eugene had to give up the siege after Denain.: Eugen tvingades avbryta belägringen efter Denain.
24 July 1712: 24 juli 1712
Villars stormed the fortified camp guarding the allies’ supply route. The bridge over the Scheldt broke under the fleeing troops, and many drowned.: Villars stormade det befästa lägret som skyddade de allierades underhållsväg. Bron över Schelde brast under de flyende trupperna, och många drunknade.
Marchiennes: Marchiennes
The allies’ main depot fell to Villars with its stores of munitions and its boats on the Scarpe.: De allierades huvudförråd föll i Villars händer med sina ammunitionsförråd och sina båtar på Scarpe.
