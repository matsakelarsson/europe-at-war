War of the Spanish Succession: Spanska tronföljdskriget
A European war over the inheritance of Charles II of Spain, in which France and Bourbon Spain, with Bavaria, fought the Emperor, Britain, the Dutch Republic and their allies to decide whether Louis XIV’s grandson Philip V or the Habsburg Archduke Charles would rule the Spanish monarchy. Marlborough’s and Eugene’s victories drove the French from Germany, Italy and the Spanish Netherlands, but the peace of Utrecht, Rastatt and Baden in 1713–1714 left Philip V on the Spanish throne and gave Spain’s lands in Italy and the Low Countries to Austria.: Ett europeiskt krig om arvet efter Karl II av Spanien, där Frankrike och det bourbonska Spanien, tillsammans med Bayern, stred mot kejsaren, Storbritannien, Nederländska republiken och deras allierade om huruvida Ludvig XIV:s sonson Filip V eller den habsburgske ärkehertigen Karl skulle styra den spanska monarkin. Marlboroughs och Eugens segrar drev ut fransmännen ur Tyskland, Italien och Spanska Nederländerna, men freden i Utrecht, Rastatt och Baden 1713–1714 lämnade Filip V kvar på den spanska tronen och gav Spaniens länder i Italien och Nederländerna åt Österrike.
