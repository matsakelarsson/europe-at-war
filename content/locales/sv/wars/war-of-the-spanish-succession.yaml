Portugal joined the Grand Alliance in 1703, and in March 1704 Archduke Charles, proclaimed Charles III of Spain, landed at Lisbon. In May an Anglo-Dutch fleet under Admiral Sir George Rooke, carrying Prince George of Hesse-Darmstadt, a former viceroy of Catalonia, failed to raise Barcelona for Charles. Rooke then turned on Gibraltar. After a heavy bombardment, English and Dutch marines and sailors stormed the town, and on 4 August 1704 its governor surrendered his small garrison; most of the townspeople left. On 24 August the French fleet from Toulon fought Rooke off Málaga in the largest sea battle of the war. Neither side lost a ship, but the French battle fleet did not put to sea in strength again during the war, and a Franco-Spanish siege of Gibraltar by land was given up in April 1705.: Portugal anslöt sig till stora alliansen 1703, och i mars 1704 landsteg ärkehertig Karl, utropad till Karl III av Spanien, i Lissabon. I maj misslyckades en engelsk-nederländsk flotta under amiral sir George Rooke, med prins Georg av Hessen-Darmstadt, en tidigare vicekung av Katalonien, ombord, med att få Barcelona att resa sig för Karl. Rooke vände sig då mot Gibraltar. Efter ett kraftigt bombardemang stormade engelska och nederländska marinsoldater och sjömän staden, och den 4 augusti 1704 kapitulerade guvernören med sin lilla garnison; de flesta av stadsborna lämnade staden. Den 24 augusti drabbade den franska flottan från Toulon samman med Rooke utanför Málaga i krigets största sjöslag. Ingen av sidorna förlorade något fartyg, men den franska slagflottan gick inte till sjöss med full styrka igen under kriget, och en fransk-spansk belägring av Gibraltar från landsidan gavs upp i april 1705.
In 1705 the allies turned to the lands of the Crown of Aragon, where many feared that a Bourbon king would govern them as the kings of France governed their provinces. An allied army under the Earl of Peterborough landed near Barcelona in August, stormed the hill fort of Montjuïc on 14 September, where Prince George was killed, and forced the city to surrender on 9 October. Catalonia and Valencia, and in 1706 Aragon and Mallorca, accepted Charles III. In April 1706 Philip V besieged Barcelona, but when an English fleet arrived with reinforcements he abandoned his guns and retreated into France. An allied army from Portugal under the Earl of Galway and the Marquis of Minas then marched on Madrid and entered it in June, but Castile rose for Philip, and by the autumn the allies had fallen back to Valencia.: År 1705 vände sig de allierade mot Aragoniska kronans länder, där många fruktade att en bourbonsk kung skulle styra dem så som kungarna av Frankrike styrde sina provinser. En allierad armé under earlen av Peterborough landsteg nära Barcelona i augusti, stormade bergsfästet Montjuïc den 14 september, där prins Georg stupade, och tvingade staden att kapitulera den 9 oktober. Katalonien och Valencia, och 1706 Aragonien och Mallorca, erkände Karl III. I april 1706 belägrade Filip V Barcelona, men när en engelsk flotta anlände med förstärkningar lämnade han kvar sina kanoner och drog sig tillbaka in i Frankrike. En allierad armé från Portugal under earlen av Galway och markisen av Minas marscherade sedan mot Madrid och tågade in där i juni, men Kastilien reste sig för Filip, och på hösten hade de allierade dragit sig tillbaka till Valencia.
