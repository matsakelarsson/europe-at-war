Vendôme surprised and beat the imperial army in Eugene’s absence, before he was recalled to Flanders after Ramillies.: Vendôme överraskade och slog den kejserliga armén i Eugens frånvaro, innan han kallades tillbaka till Flandern efter Ramillies.
