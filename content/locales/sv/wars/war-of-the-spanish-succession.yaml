A British-led escort under John Webb beat off a larger French force and brought a vital convoy from Ostend to the siege of Lille.: En brittiskledd eskort under John Webb slog tillbaka en större fransk styrka och förde fram en livsviktig konvoj från Oostende till belägringen av Lille.
The largest siege of the war. Boufflers surrendered the town in October and the citadel in December, with the honours of war.: Krigets största belägring. Boufflers överlämnade staden i oktober och citadellet i december, under krigets hedersbetygelser.
Burgundy and Vendôme: Burgund och Vendôme
Convoy: Konvoj
Held by the allies, end of 1708: I de allierades händer, slutet av 1708
On 25 April 1707 the Duke of Berwick, an illegitimate son of James II of England and a marshal of France, met the allied army of Galway, a French Huguenot in British service, and the Marquis of Minas at Almansa, on the road from Valencia to Madrid. Berwick’s Franco-Spanish army broke the Portuguese, British and Dutch regiments; the allies lost some 4,000 killed and wounded and thousands of prisoners. Valencia and Aragon returned to Philip V, and Lleida fell in the autumn. By the decrees of Nueva Planta of June 1707 Philip abolished the separate laws and institutions of Valencia and Aragon as punishment for their rebellion, and the town of Xàtiva, which had resisted, was burned. The allies held on in Catalonia, and in 1708 their fleet took Sardinia for Charles, while General James Stanhope captured Minorca and its harbour of Port Mahon.: Den 25 april 1707 mötte hertigen av Berwick, en utomäktenskaplig son till Jakob II av England och marskalk av Frankrike, den allierade armén under Galway, en fransk hugenott i brittisk tjänst, och markisen av Minas vid Almansa, på vägen från Valencia till Madrid. Berwicks fransk-spanska armé krossade de portugisiska, brittiska och nederländska regementena; de allierade förlorade omkring 4 000 man i döda och sårade och tusentals fångar. Valencia och Aragonien återgick till Filip V, och Lleida föll på hösten. Genom Nueva Planta-dekreten i juni 1707 avskaffade Filip Valencias och Aragoniens egna lagar och institutioner som straff för deras uppror, och staden Xàtiva, som hade gjort motstånd, brändes. De allierade höll sig kvar i Katalonien, och 1708 tog deras flotta Sardinien åt Karl, medan general James Stanhope erövrade Menorca och dess hamn Port Mahon.
In 1710 the allies tried once more. Under the Austrian general Guido Starhemberg and Stanhope they beat Philip at Almenar on 27 July and at Saragossa on 20 August, and Charles entered Madrid in September. Again the Castilians would not accept him. The city stayed sullen, guerrillas cut the roads, and a French army under the Duke of Vendôme came to join Philip. In December the allies retreated towards Catalonia in separate columns. On 8–9 December Vendôme trapped Stanhope’s British rearguard in the walled town of Brihuega and forced it to surrender, and then at Villaviciosa he fought Starhemberg in a bloody battle that both sides claimed. Starhemberg went on retreating, and only some 7,000 men reached Barcelona. Charles’s cause in Castile was finished.: År 1710 gjorde de allierade ett nytt försök. Under den österrikiske generalen Guido Starhemberg och Stanhope slog de Filip vid Almenar den 27 juli och vid Zaragoza den 20 augusti, och Karl tågade in i Madrid i september. Återigen vägrade kastilianerna att godta honom. Staden förblev fientlig, gerillakrigare skar av vägarna, och en fransk armé under hertigen av Vendôme kom för att förena sig med Filip. I december drog sig de allierade tillbaka mot Katalonien i skilda kolonner. Den 8–9 december stängde Vendôme in Stanhopes brittiska eftertrupp i den befästa staden Brihuega och tvingade den att kapitulera, och sedan utkämpade han vid Villaviciosa ett blodigt slag mot Starhemberg som båda sidor gjorde anspråk på att ha vunnit. Starhemberg fortsatte reträtten, och endast omkring 7 000 man nådde Barcelona. Karls sak i Kastilien var förlorad.
25 April 1707, Bourbon victory: 25 april 1707, bourbonsk seger
