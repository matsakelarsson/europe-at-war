Stanhope’s cavalry broke Philip V’s army north of Lleida, which fell back behind the Ebro.: Stanhopes kavalleri krossade Filip V:s armé norr om Lleida, och den drog sig tillbaka bakom Ebro.
Battle of Saragossa: Slaget vid Zaragoza
20 August 1710: 20 augusti 1710
Starhemberg beat Philip’s army outside the city, opening the road to Madrid.: Starhemberg slog Filips armé utanför staden och öppnade vägen till Madrid.
Brihuega: Brihuega
8–9 December 1710: 8–9 december 1710
Some 4,000 British troops quartered in the town held out until the walls were breached, then surrendered with Stanhope.: Omkring 4 000 brittiska soldater som var inkvarterade i staden höll ut tills murarna bröts igenom och kapitulerade sedan tillsammans med Stanhope.
Battle of Villaviciosa: Slaget vid Villaviciosa
10 December 1710: 10 december 1710
Starhemberg held his ground against Vendôme until nightfall, but the next day he abandoned his guns and retreated to Catalonia.: Starhemberg höll stånd mot Vendôme till mörkrets inbrott, men nästa dag lämnade han kvar sina kanoner och drog sig tillbaka till Katalonien.
Charles and Starhemberg: Karl och Starhemberg
Vendôme: Vendôme
Retreat, December 1710: Reträtt, december 1710
The winter of 1708–1709 was the coldest in Europe for centuries, and frost and a failed harvest brought famine to France. Louis XIV sought peace, and his envoys at The Hague accepted almost all of the allies’ demands. But the allies insisted that if Philip V would not give up Spain within two months, Louis must help drive his own grandson out. Louis refused and explained why in a public letter to his subjects. The allies took Tournai, whose citadel surrendered on 3 September after a grim underground war of mines, and Marshal Villars, now France’s chief commander, entrenched his army among the woods near Malplaquet to stop them besieging Mons.: Vintern 1708–1709 var den kallaste i Europa på flera hundra år, och frost och missväxt förde hungersnöd över Frankrike. Ludvig XIV sökte fred, och hans sändebud i Haag godtog nästan alla de allierades krav. Men de allierade krävde att Ludvig, om Filip V inte avstod från Spanien inom två månader, skulle hjälpa till att driva ut sin egen sonson. Ludvig vägrade och förklarade varför i ett offentligt brev till sina undersåtar. De allierade tog Tournai, vars citadell kapitulerade den 3 september efter ett grymt underjordiskt minkrig, och marskalk Villars, nu Frankrikes främste befälhavare, förskansade sin armé bland skogarna nära Malplaquet för att hindra dem från att belägra Mons.
On 11 September Marlborough and Eugene attacked Villars’s lines in the bloodiest battle of the war. Dutch infantry under the young Prince of Orange suffered terribly in repeated assaults on the French right, while the allies forced the French left back through the woods. Villars was badly wounded, and Boufflers withdrew the army in good order. The allies held the field and took Mons on 20 October, but they had lost about 21,000 men killed and wounded, perhaps twice the French losses. In Britain the cost turned many against the war, and in 1710 the Whig ministry gave way to a Tory one that wanted peace.: Den 11 september angrep Marlborough och Eugen Villars linjer i krigets blodigaste slag. Nederländskt infanteri under den unge prinsen av Oranien led fruktansvärda förluster i upprepade anfall mot den franska högerflygeln, medan de allierade trängde tillbaka den franska vänsterflygeln genom skogarna. Villars sårades svårt, och Boufflers förde armén tillbaka i god ordning. De allierade behöll slagfältet och tog Mons den 20 oktober, men de hade förlorat omkring 21 000 man i döda och sårade, kanske dubbelt så många som fransmännen. I Storbritannien vände kostnaderna många mot kriget, och 1710 fick whigregeringen ge vika för en toryregering som ville ha fred.
Battle of Malplaquet: Slaget vid Malplaquet
11 September 1709, allied victory at great cost: 11 september 1709, allierad seger till ett högt pris
Marlborough and Eugene; Villars and Boufflers: Marlborough och Eugen; Villars och Boufflers
About 21,000 allied and 11,000 French killed and wounded (estimates vary): Omkring 21 000 allierade och 11 000 franska döda och sårade (uppskattningarna varierar)
Peace talks at The Hague: Fredsförhandlingar i Haag
May – June 1709: maj – juni 1709
Louis XIV’s foreign minister, the Marquis de Torcy, came to negotiate in person. The preliminaries of 28 May failed over the demand that Louis help remove Philip V from Spain.: Ludvig XIV:s utrikesminister, markis de Torcy, kom för att förhandla personligen. Preliminärfreden den 28 maj föll på kravet att Ludvig skulle hjälpa till att avlägsna Filip V från Spanien.
June – September 1709: juni – september 1709
The town fell at the end of July and the citadel on 3 September, after weeks of fighting in the tunnels beneath it.: Staden föll i slutet av juli och citadellet den 3 september, efter veckor av strider i tunnlarna under det.
11 September 1709: 11 september 1709
The allies attacked the French entrenchments in the gap between two woods. The French lost the field, but the allies’ losses shocked Europe.: De allierade angrep de franska förskansningarna i passet mellan två skogar. Fransmännen förlorade slagfältet, men de allierades förluster chockade Europa.
September – October 1709: september – oktober 1709
The capital of Hainaut surrendered on 20 October, the allies’ last gain of the year.: Hainauts huvudstad kapitulerade den 20 oktober, de allierades sista vinst det året.
Marlborough and Eugene: Marlborough och Eugen
Villars: Villars
Talks at Geertruidenberg in 1710 broke down on the same issue, and the allies took Douai, Béthune, Aire and Saint-Venant. In Spain the allied army won at Almenara and Saragossa and entered Madrid for the second time in September 1710, but Castile stood by Philip V, and in December Vendôme beat the allies at Brihuega and Villaviciosa. In April 1711 the Emperor Joseph I died, and his brother, Archduke Charles, succeeded him; a Habsburg ruling both Spain and the Empire now worried the British almost as much as a Bourbon one. The new Tory ministry negotiated secretly with France, and Marlborough, who had slipped through Villars’s “Ne Plus Ultra” lines and taken Bouchain in 1711, was dismissed at the end of the year.: Förhandlingarna i Geertruidenberg 1710 strandade på samma fråga, och de allierade tog Douai, Béthune, Aire och Saint-Venant. I Spanien segrade den allierade armén vid Almenara och Zaragoza och tågade in i Madrid för andra gången i september 1710, men Kastilien stod fast vid Filip V, och i december slog Vendôme de allierade vid Brihuega och Villaviciosa. I april 1711 dog kejsar Josef I, och hans bror, ärkehertig Karl, efterträdde honom; en habsburgare som styrde både Spanien och riket oroade nu britterna nästan lika mycket som en bourbon. Den nya toryregeringen förhandlade i hemlighet med Frankrike, och Marlborough, som hade tagit sig igenom Villars ”Ne Plus Ultra”-linjer och intagit Bouchain 1711, avskedades vid årets slut.
The Duke of Ormonde, Marlborough’s successor, had secret orders not to fight, and in July the British withdrew under an armistice and took over Dunkirk as a pledge of peace. Eugene took Le Quesnoy and besieged Landrecies, but his supplies came from the depot at Marchiennes along a long fortified corridor across the Scheldt. On 24 July Villars feinted towards Landrecies and fell instead on the Earl of Albemarle’s Dutch and imperial troops at Denain, driving many of them into the river. Villars then took Marchiennes and retook Douai, Le Quesnoy and Bouchain. Denain ended the threat of an invasion of France and strengthened Louis XIV’s hand at the peace talks.: Hertigen av Ormonde, Marlboroughs efterträdare, hade hemliga order att inte strida, och i juli drog sig britterna tillbaka under ett vapenstillestånd och övertog Dunkerque som pant för freden. Eugen tog Le Quesnoy och belägrade Landrecies, men hans förnödenheter kom från förrådet i Marchiennes längs en lång befäst korridor över Schelde. Den 24 juli gjorde Villars en skenmanöver mot Landrecies och föll i stället över earlen av Albemarles nederländska och kejserliga trupper vid Denain och drev många av dem ut i floden. Villars tog sedan Marchiennes och återtog Douai, Le Quesnoy och Bouchain. Denain gjorde slut på hotet om en invasion av Frankrike och stärkte Ludvig XIV:s ställning vid fredsförhandlingarna.
Battle of Denain: Slaget vid Denain
