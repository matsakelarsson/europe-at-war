Dates are New Style (Gregorian). England and Scotland still used the Julian calendar, eleven days behind, so British sources of the time date Blenheim 2 August 1704.: Datum anges enligt nya stilen (gregorianska kalendern). England och Skottland använde fortfarande den julianska kalendern, elva dagar efter, så samtida brittiska källor daterar Blenheim till 2 augusti 1704.
England and Scotland joined as the Kingdom of Great Britain on 1 May 1707, during the war. Savoy fought on the French side until 1703 and then joined the allies, as did Portugal; Prussia, Hanover, Denmark and other German states supplied troops to the allied armies, many of them paid by Britain and the Dutch.: England och Skottland förenades till Kungariket Storbritannien den 1 maj 1707, under kriget. Savojen stred på fransk sida till 1703 och anslöt sig sedan till de allierade, liksom Portugal; Preussen, Hannover, Danmark och andra tyska stater ställde trupper till de allierade arméerna, många av dem betalda av Storbritannien och nederländarna.
The war in Spain and Portugal, at sea, and in the colonies (in North America called Queen Anne’s War) is only outlined here. Blenheim is called the Second Battle of Höchstädt in German and French; Oudenaarde is often spelt Oudenarde in English.: Kriget i Spanien och Portugal, till sjöss och i kolonierna (i Nordamerika kallat drottning Annas krig) skisseras här bara översiktligt. Blenheim kallas på tyska och franska andra slaget vid Höchstädt; Oudenaarde stavas på engelska ofta Oudenarde.
