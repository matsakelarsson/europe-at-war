Eugene and Victor Amadeus broke through the French lines, ending a siege that had begun in June. It decided the war in Italy.: Eugen och Viktor Amadeus bröt igenom de franska linjerna och gjorde slut på en belägring som börjat i juni. Det avgjorde kriget i Italien.
Battle of Castiglione: Slaget vid Castiglione
9 September 1706: 9 september 1706
Two days after Turin, a French force beat a Hessian corps of the imperial army near Mantua, too late to change anything.: Två dagar efter Turin slog en fransk styrka en hessisk kår ur den kejserliga armén nära Mantua, för sent för att ändra något.
Villeroi: Villeroi
