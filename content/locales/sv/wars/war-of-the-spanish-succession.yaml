25 April 1707: 25 april 1707
Perhaps the only battle in which an Englishman commanded the French and a Frenchman the English. It won back most of eastern Spain for Philip V.: Kanske det enda slag där en engelsman förde befälet över fransmännen och en fransman över engelsmännen. Det vann tillbaka större delen av östra Spanien åt Filip V.
Lleida: Lleida
September – November 1707: september – november 1707
The Duke of Orléans took the town in October and its castle in November, opening the way into Catalonia.: Hertigen av Orléans tog staden i oktober och dess borg i november, vilket öppnade vägen in i Katalonien.
Port Mahon: Port Mahon
September 1708: september 1708
Stanhope’s British and Dutch troops landed on 14 September and soon forced Fort St Philip to surrender. The harbour gave the Royal Navy a base in the western Mediterranean, and Britain kept Minorca at Utrecht.: Stanhopes brittiska och nederländska trupper landsteg den 14 september och tvingade snart Fort St Philip att kapitulera. Hamnen gav Royal Navy en bas i västra Medelhavet, och Storbritannien behöll Menorca vid freden i Utrecht.
August 1708: augusti 1708
Admiral Leake’s fleet took Sardinia for Charles III almost without a fight.: Amiral Leakes flotta tog Sardinien åt Karl III nästan utan strid.
Battle of Almenar: Slaget vid Almenar
