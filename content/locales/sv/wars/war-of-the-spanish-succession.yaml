The Peace of Utrecht was a set of treaties signed from April 1713 between France and Spain and the allies, except the Emperor. Philip V kept Spain and its empire but renounced his rights to the French throne. Britain kept Gibraltar and Minorca, taken in 1704 and 1708, and won Newfoundland, Acadia and Hudson Bay from France, and from Spain the asiento, the right to supply enslaved Africans to Spanish America. Victor Amadeus of Savoy received Sicily and a royal crown, and Prussia gained Upper Guelders and recognition of its kingship. France recognised the Protestant succession in Britain and promised to destroy Dunkirk’s fortifications.: Freden i Utrecht var en serie fördrag som undertecknades från april 1713 mellan Frankrike och Spanien och de allierade, med undantag för kejsaren. Filip V behöll Spanien och dess imperium men avsade sig sina rättigheter till den franska tronen. Storbritannien behöll Gibraltar och Menorca, som erövrats 1704 och 1708, och vann Newfoundland, Akadien och Hudson Bay från Frankrike och från Spanien asienton, rätten att leverera förslavade afrikaner till Spanska Amerika. Viktor Amadeus av Savojen fick Sicilien och en kungakrona, och Preussen vann Övre Geldern och erkännande av sin kungavärdighet. Frankrike erkände den protestantiska tronföljden i Storbritannien och lovade att förstöra Dunkerques befästningar.
The Emperor Charles VI fought on alone for another year, but in 1713 Villars took Landau and Freiburg. Villars and Eugene, old opponents, made peace at Rastatt on 7 March 1714, confirmed for the Empire at Baden in Switzerland on 7 September. Austria received the Spanish Netherlands, Milan, Naples and Sardinia; France kept Landau; and the Electors of Bavaria and Cologne got their lands back. Barcelona, which had fought on for Charles after the allied troops left Catalonia, fell to a Franco-Spanish army on 11 September 1714 after a siege of more than a year, and Philip V abolished the separate laws and institutions of the Crown of Aragon.: Kejsar Karl VI fortsatte kriget ensam i ytterligare ett år, men 1713 tog Villars Landau och Freiburg. Villars och Eugen, gamla motståndare, slöt fred i Rastatt den 7 mars 1714, vilket bekräftades för riket i Baden i Schweiz den 7 september. Österrike fick Spanska Nederländerna, Milano, Neapel och Sardinien; Frankrike behöll Landau; och kurfurstarna av Bayern och Köln fick tillbaka sina länder. Barcelona, som hade fortsatt att strida för Karl sedan de allierade trupperna lämnat Katalonien, föll för en fransk-spansk armé den 11 september 1714 efter en belägring på mer än ett år, och Filip V avskaffade Aragoniska kronans egna lagar och institutioner.
Peace of Utrecht: Freden i Utrecht
11 April 1713 (France and the allies); 13 July 1713 (Spain and Britain): 11 april 1713 (Frankrike och de allierade); 13 juli 1713 (Spanien och Storbritannien)
Treaty of Rastatt: Freden i Rastatt
7 March 1714, France and the Emperor: 7 mars 1714, Frankrike och kejsaren
Treaty of Baden: Freden i Baden
7 September 1714, France and the Empire: 7 september 1714, Frankrike och riket
11 April 1713: 11 april 1713
France signed treaties with Britain, the Dutch Republic, Savoy, Prussia and Portugal; Spain’s treaties followed from July 1713.: Frankrike undertecknade fördrag med Storbritannien, Nederländska republiken, Savojen, Preussen och Portugal; Spaniens fördrag följde från juli 1713.
June – August 1713: juni – augusti 1713
The fortress changed hands for the fourth time in the war, and France kept it at the peace.: Fästningen bytte ägare för fjärde gången under kriget, och Frankrike behöll den vid freden.
Freiburg: Freiburg
September – November 1713: september – november 1713
Taken by Villars after a hard siege, but returned to Austria at Rastatt.: Intogs av Villars efter en hård belägring, men återlämnades till Österrike i Rastatt.
7 March 1714: 7 mars 1714
Villars and Eugene negotiated the peace between Louis XIV and Charles VI in the margrave of Baden’s new palace.: Villars och Eugen förhandlade fram freden mellan Ludvig XIV och Karl VI i markgreven av Badens nya slott.
7 September 1714: 7 september 1714
The Holy Roman Empire made peace with France on the terms agreed at Rastatt.: Tysk-romerska riket slöt fred med Frankrike på de villkor som avtalats i Rastatt.
To Austria at Rastatt, now the Austrian Netherlands: Till Österrike i Rastatt, nu Österrikiska Nederländerna
Under the peace the allied troops left Catalonia, and Charles VI, emperor since 1711, called his wife home from Barcelona. The Catalans were promised an amnesty, but not their own laws. In July 1713 the Junta de Braços, an assembly of the Catalan estates, voted to fight on alone to defend the country’s constitutions. A Bourbon army under the Duke of Popoli blockaded Barcelona from late July. The city’s defence was led by its chief councillor, Rafael Casanova, at the head of the Coronela, the citizen militia, and by the general Antonio de Villarroel. Catalan irregulars fought on in the countryside, and the castle of Cardona and the island of Mallorca also held out for Charles.: Enligt freden lämnade de allierade trupperna Katalonien, och Karl VI, kejsare sedan 1711, kallade hem sin hustru från Barcelona. Katalanerna utlovades amnesti, men inte sina egna lagar. I juli 1713 beslöt Junta de Braços, en församling av de katalanska ständerna, att fortsätta kampen ensamma för att försvara landets konstitutioner. En bourbonsk armé under hertigen av Popoli blockerade Barcelona från slutet av juli. Stadens försvar leddes av dess främste rådman, Rafael Casanova, i spetsen för Coronela, borgarmilisen, och av generalen Antonio de Villarroel. Katalanska friskaror fortsatte striden på landsbygden, och borgen Cardona och ön Mallorca höll också ut för Karl.
In July 1714 Louis XIV sent the Duke of Berwick with French troops and a siege train, and the trenches crept towards the walls. The final assault began at half past four in the morning of 11 September. The attackers broke through in several places and fought their way into the streets; Casanova and Villarroel were both wounded, and that day the defenders asked for terms. Cardona surrendered a week later, and Mallorca and Ibiza in July 1715. Philip V abolished Catalonia’s government and laws by the Nueva Planta decree of 1716, and much of Barcelona’s Ribera quarter was pulled down to build a citadel to hold the city. Catalans mark 11 September as their national day, the Diada.: I juli 1714 sände Ludvig XIV hertigen av Berwick med franska trupper och belägringsartilleri, och löpgravarna kröp närmare murarna. Den slutliga stormningen började klockan halv fem på morgonen den 11 september. Angriparna bröt igenom på flera ställen och kämpade sig in på gatorna; Casanova och Villarroel sårades båda, och samma dag begärde försvararna kapitulationsvillkor. Cardona kapitulerade en vecka senare, och Mallorca och Ibiza i juli 1715. Filip V avskaffade Kataloniens regering och lagar genom Nueva Planta-dekretet 1716, och en stor del av Barcelonas stadsdel Ribera revs för att bygga ett citadell som skulle hålla staden i schack. Katalanerna firar den 11 september som sin nationaldag, Diada.
Siege of Barcelona: Belägringen av Barcelona
July 1713 – 11 September 1714: juli 1713 – 11 september 1714
Popoli, then Berwick; Villarroel and Casanova for Barcelona: Popoli, sedan Berwick; Villarroel och Casanova för Barcelona
Nueva Planta decree for Catalonia: Nueva Planta-dekretet för Katalonien
16 January 1716: 16 januari 1716
11 September 1714: 11 september 1714
The Bourbon assault broke into the city after a siege of more than a year. Terms were agreed the next day, and Berwick’s troops took over the city.: Den bourbonska stormningen bröt in i staden efter en belägring på mer än ett år. Villkoren avtalades nästa dag, och Berwicks trupper tog över staden.
Cardona: Cardona
18 September 1714: 18 september 1714
The mountain castle, the last Catalan stronghold on the mainland, surrendered a week after Barcelona.: Bergsborgen, det sista katalanska fästet på fastlandet, kapitulerade en vecka efter Barcelona.
July 1715: juli 1715
A Bourbon expedition under the Chevalier d’Asfeld landed in June 1715, and Palma surrendered in early July, ending the war in Spain.: En bourbonsk expedition under chevalier d’Asfeld landsteg i juni 1715, och Palma kapitulerade i början av juli, vilket avslutade kriget i Spanien.
Held for Charles until July 1715: I Karls händer till juli 1715
