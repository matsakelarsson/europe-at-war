The year 1705 settled little. The allies took Barcelona for Archduke Charles, proclaimed King Charles III of Spain, but Marlborough’s invasion of France along the Moselle came to nothing. In May 1706 Louis XIV ordered Marshal Villeroi to seek battle in the Spanish Netherlands. On 23 May his French, Spanish and Bavarian army of about 60,000 met Marlborough’s Dutch, British and Danish army of similar size at Ramillies, north of Namur. Marlborough moved troops from his right to his centre unseen behind a ridge, the Dutch and Danish cavalry broke through on the left, and Villeroi’s army fled. Within weeks Leuven, Brussels, Antwerp, Ghent and Bruges opened their gates and recognised Charles III, and Ostend, Menin and Ath fell to sieges.: Året 1705 avgjorde föga. De allierade tog Barcelona åt ärkehertig Karl, utropad till kung Karl III av Spanien, men Marlboroughs invasion av Frankrike längs Mosel ledde ingenstans. I maj 1706 beordrade Ludvig XIV marskalk Villeroi att söka slag i Spanska Nederländerna. Den 23 maj möttes hans franska, spanska och bayerska armé på omkring 60 000 man och Marlboroughs lika stora nederländska, brittiska och danska armé vid Ramillies, norr om Namur. Marlborough flyttade trupper från sin högra flygel till centrum, dolda bakom en ås, det nederländska och danska kavalleriet bröt igenom på vänster flygel, och Villerois armé flydde. Inom några veckor öppnade Leuven, Bryssel, Antwerpen, Gent och Brygge sina portar och erkände Karl III, och Oostende, Menen och Ath föll efter belägringar.
In Italy the French had overrun most of Piedmont, and from June 1706 an army under the Duke of La Feuillade besieged Turin, the capital of Victor Amadeus II of Savoy. Prince Eugene marched an imperial army from the Adige along the south bank of the Po, outpacing the French under the Duke of Orléans, and joined the Savoyard cavalry near Turin. On 7 September they stormed the French siege lines and routed the besiegers. The garrison had held out for three months; on the night of 29 August the miner Pietro Micca had blown up a tunnel, and himself, to stop French grenadiers getting into the citadel. The French left northern Italy, and Milan passed to Austrian rule.: I Italien hade fransmännen tagit större delen av Piemonte, och från juni 1706 belägrade en armé under hertigen av La Feuillade Turin, huvudstad för Viktor Amadeus II av Savojen. Prins Eugen marscherade med en kejserlig armé från Adige längs Pos södra strand, snabbare än fransmännen under hertigen av Orléans, och förenade sig med det savojardiska kavalleriet nära Turin. Den 7 september stormade de de franska belägringslinjerna och krossade belägrarna. Garnisonen hade hållit ut i tre månader; natten den 29 augusti hade minören Pietro Micca sprängt en tunnel, och sig själv, för att hindra franska grenadjärer från att ta sig in i citadellet. Fransmännen lämnade norra Italien, och Milano kom under österrikiskt styre.
