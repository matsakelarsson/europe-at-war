War of the Straits: Sundkriget
The third war between Venice and Genoa, fought over access to the Black Sea after the Genoese tightened their hold on Caffa, Pera (Galata) and the passage of the Bosporus and seized Chios. Venice allied with Peter IV of Aragon and the Byzantine emperor John VI Kantakouzenos, while the Genoese of Pera won the support of the Ottoman ruler Orhan. A bloody and indecisive battle in the Bosporus on 13 February 1352 left Genoa holding Pera, and Byzantium made a separate peace that May. An Aragonese–Venetian fleet crushed the Genoese off Alghero in Sardinia in August 1353, and Genoa placed itself under Giovanni Visconti of Milan; but on 4 November 1354 Paganino Doria captured almost the whole Venetian fleet at Porto Longo on the island of Sapienza. The peace signed through Visconti mediation on 1 June 1355 settled little; both sides agreed to stay away from Tana for three years.: Det tredje kriget mellan Venedig och Genua, utkämpat om tillträdet till Svarta havet sedan genueserna stärkt sitt grepp om Caffa, Pera (Galata) och passagen genom Bosporen och lagt beslag på Chios. Venedig allierade sig med Peter IV av Aragonien och den bysantinske kejsaren Johannes VI Kantakouzenos, medan genueserna i Pera vann stöd från den osmanske härskaren Orhan. Ett blodigt och oavgjort slag i Bosporen den 13 februari 1352 lämnade Pera i Genuas händer, och Bysans slöt separatfred i maj samma år. En aragonisk-venetiansk flotta krossade genueserna utanför Alghero på Sardinien i augusti 1353, och Genua ställde sig under Giovanni Visconti av Milano; men den 4 november 1354 erövrade Paganino Doria nästan hela den venetianska flottan vid Porto Longo på ön Sapienza. Freden som undertecknades genom Viscontis medling den 1 juni 1355 avgjorde föga; båda sidor gick med på att hålla sig borta från Tana i tre år.
