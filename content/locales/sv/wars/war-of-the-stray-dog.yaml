War of the Stray Dog: Den bortsprungna hundens krig
A brief Greek invasion of Bulgaria in October 1925, also called the Incident at Petrich, after a Greek soldier was shot at the border on Mount Belasitsa – by one account while chasing his dog across it – and the Greek dictator Theodoros Pangalos sent troops towards the town of Petrich. Bulgaria appealed to the League of Nations, which ordered a ceasefire and the withdrawal of Greek troops and made Greece pay £45,000 in compensation, a quick success that contrasted with the League’s failure in the Corfu incident two years earlier.: En kortvarig grekisk invasion av Bulgarien i oktober 1925, även kallad Petritjincidenten, sedan en grekisk soldat skjutits vid gränsen på berget Belasitsa – enligt en version när han jagade sin hund över den – och den grekiske diktatorn Theodoros Pangalos sänt trupper mot staden Petritj. Bulgarien vädjade till Nationernas förbund, som beordrade eld upphör och tillbakadragande av de grekiska trupperna och lät Grekland betala 45 000 pund i ersättning, en snabb framgång som stod i kontrast till förbundets misslyckande i Korfuincidenten två år tidigare.
Greece: Grekland
Bulgaria: Bulgarien
Incident at Petrich (Wikipedia): Petritjincidenten (Wikipedia)
Greece’s version was that Bulgarian soldiers had crossed the border and attacked a Greek outpost. Greek troops entered Bulgaria on 22 October; the League’s ceasefire came hours before their planned attack on Petrich.: Enligt den grekiska versionen hade bulgariska soldater gått över gränsen och angripit en grekisk utpost. Grekiska trupper gick in i Bulgarien den 22 oktober; förbundets eldupphör kom några timmar före deras planerade anfall mot Petritj.
