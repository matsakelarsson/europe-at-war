# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
War of the Two Capitals: Kriget mellan de två huvudstäderna
? The succession war of the Yuan dynasty after the death of the emperor Yesün Temür at Shangdu in August 1328, fought between a court at Dadu (Beijing) and a court at Shangdu, the summer capital. In Dadu the Kipchak commander El Temür, whose family had risen under the emperor Khayishan, seized power in September and brought Khayishan’s son Tugh Temür to the throne; at Shangdu the Muslim minister Dawlat Shah enthroned Yesün Temür’s young son Ragibagh in October. The Shangdu armies, drawing on Mongolia, Liaodong, Shaanxi, Sichuan and Yunnan, broke through the Great Wall passes and reached the outskirts of Dadu, but El Temür held the capital, and while the Shangdu forces were engaged on the wall, princes of the eastern wing on the Dadu side surrounded Shangdu on 14 November 1328. It surrendered the next day; Dawlat Shah and most of the Shangdu leaders were executed, and Ragibagh, about eight years old, disappeared. The loyalists in Shaanxi gave up in December and those in Sichuan in January 1329. Tugh Temür stood down for his elder brother Kusala, who was proclaimed khan north of Karakorum on 27 February 1329 but died on 30 August, four days after a banquet with Tugh Temür, probably poisoned on El Temür’s orders; Tugh Temür took the throne again on 8 September 1329. In Yunnan Prince Tugel, with the help of local peoples, held out against the Dadu court until March 1332. It was the bloodiest succession struggle in Yuan history, and left El Temür in control of the court until his death in 1333.
: Yuandynastins tronföljdskrig efter kejsar Yesün Temürs död i Shangdu i augusti 1328, utkämpat mellan ett hov i Dadu (Peking) och ett hov i sommarhuvudstaden Shangdu. I Dadu tog den kiptjakiske befälhavaren El Temür, vars släkt hade stigit i rang under kejsar Khayishan, makten i september och satte Khayishans son Tugh Temür på tronen; i Shangdu satte den muslimske ministern Dawlat Shah Yesün Temürs unge son Ragibagh på tronen i oktober. Shangduarméerna, som hämtade styrkor från Mongoliet, Liaodong, Shaanxi, Sichuan och Yunnan, bröt igenom passen i Kinesiska muren och nådde Dadus utkanter, men El Temür höll huvudstaden, och medan Shangdustyrkorna var bundna vid muren omringade furstar från den östra flygeln på Dadus sida Shangdu den 14 november 1328. Staden kapitulerade dagen därpå; Dawlat Shah och de flesta av Shangdus ledare avrättades, och Ragibagh, omkring åtta år gammal, försvann. Lojalisterna i Shaanxi gav upp i december och de i Sichuan i januari 1329. Tugh Temür avstod tronen till förmån för sin äldre bror Kusala, som utropades till khan norr om Karakorum den 27 februari 1329 men dog den 30 augusti, fyra dagar efter en bankett med Tugh Temür, troligen förgiftad på El Temürs order; Tugh Temür besteg tronen igen den 8 september 1329. I Yunnan höll prins Tugel, med hjälp av lokala folk, stånd mot Daduhovet till mars 1332. Det var den blodigaste tronföljdsstriden i Yuandynastins historia, och den lämnade El Temür i kontroll över hovet fram till hans död 1333.
