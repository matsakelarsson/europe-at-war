War of the Two Peters: De två Petrarnas krig
A war between Peter I of Castile and Peter IV of Aragon, fought mostly along their border in Aragon and Valencia. It began in 1356 after Catalan galleys in Aragonese service seized Genoese ships, allies of Castile, at Sanlúcar de Barrameda. Castile had the better of the fighting, taking Tarazona in 1357 and, in 1362–1363, a string of towns in Aragon and Valencia, among them Teruel, Segorbe and Murviedro (Sagunto), with help from Navarre, Portugal and Granada. The peaces of Terrer (1361) and Murviedro (1363) did not hold. Peter IV then backed Peter of Castile’s half-brother Henry of Trastámara, and from 1366 the war merged into the Castilian Civil War; Castile’s conquests were lost. A final peace was made at Almazán in 1375, sealed by the marriage of Peter IV’s daughter Eleanor to Henry’s heir, the future John I of Castile.: Ett krig mellan Peter I av Kastilien och Peter IV av Aragonien, som främst utkämpades längs deras gräns i Aragonien och Valencia. Det började 1356 sedan katalanska galärer i aragonisk tjänst lagt beslag på genuesiska fartyg, Kastiliens allierade, vid Sanlúcar de Barrameda. Kastilien hade övertaget i striderna och intog Tarazona 1357 och 1362–1363 en rad städer i Aragonien och Valencia, bland dem Teruel, Segorbe och Murviedro (Sagunto), med hjälp från Navarra, Portugal och Granada. Freden i Terrer (1361) och freden i Murviedro (1363) höll inte. Peter IV stödde sedan Peter av Kastiliens halvbror Henrik av Trastámara, och från 1366 gick kriget upp i det kastilianska inbördeskriget; Kastiliens erövringar gick förlorade. En slutlig fred slöts i Almazán 1375, beseglad genom giftermålet mellan Peter IV:s dotter Eleonora och Henriks arvinge, den blivande Johan I av Kastilien.
