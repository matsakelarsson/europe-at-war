Filippo Maria Visconti, Duke of Milan, set out to rebuild the state of his father Gian Galeazzo, which had broken up on his death in 1402. In 1423 he intervened in Forlì, in the Romagna, and Florence, fearing encirclement, went to war; its army was routed at Zagonara in July 1424. In December 1425 Venice joined Florence, urged on by Francesco Bussone, known as Carmagnola, a condottiere who had left Milan’s service. Carmagnola took Brescia for Venice in 1426.: Filippo Maria Visconti, hertig av Milano, föresatte sig att återuppbygga sin far Gian Galeazzos stat, som fallit sönder vid dennes död 1402. År 1423 ingrep han i Forlì i Romagna, och Florens, som fruktade att bli inringat, gick i krig; dess armé slogs på flykten vid Zagonara i juli 1424. I december 1425 anslöt sig Venedig till Florens, påskyndat av Francesco Bussone, känd som Carmagnola, en kondottiär som hade lämnat Milanos tjänst. Carmagnola intog Brescia åt Venedig 1426.
On 11 October 1427 Carmagnola drew the Milanese army under Carlo Malatesta onto marshy ground near Maclodio, west of Brescia, and destroyed it. Some 8,000 prisoners were taken, and as was usual among the condottieri most were soon released. In the Peace of Ferrara of April 1428 Milan gave up Brescia and Bergamo, carrying Venice’s mainland state west to the Adda. War broke out again in 1431; after several defeats Carmagnola was suspected of double-dealing, lured to Venice, tried and beheaded on 5 May 1432. A second Peace of Ferrara in 1433 confirmed Venice’s gains.: Den 11 oktober 1427 lockade Carmagnola ut den milanesiska armén under Carlo Malatesta på sank mark nära Maclodio, väster om Brescia, och förintade den. Omkring 8 000 fångar togs, och som brukligt bland kondottiärerna släpptes de flesta snart. I freden i Ferrara i april 1428 avstod Milano Brescia och Bergamo, vilket sträckte ut Venedigs fastlandsvälde västerut till Adda. Kriget bröt ut igen 1431; efter flera nederlag misstänktes Carmagnola för dubbelspel, lockades till Venedig, ställdes inför rätta och halshöggs den 5 maj 1432. En andra fred i Ferrara 1433 bekräftade Venedigs vinster.
