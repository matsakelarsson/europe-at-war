Wars in Lombardy: Krigen i Lombardiet
Thirty years of intermittent war between the Duchy of Milan under Filippo Maria Visconti and the Republics of Venice and Florence, fought largely by mercenary captains. Venice won Brescia and Bergamo after Maclodio (1427), Florence and the pope beat Milan at Anghiari (1440), and after Visconti’s death the condottiere Francesco Sforza beat Venice at Caravaggio (1448) and made himself duke; the Peace of Lodi in 1454 fixed the Venetian–Milanese border on the Adda and opened forty years of relative peace in Italy.: Trettio år av återkommande krig mellan hertigdömet Milano under Filippo Maria Visconti och republikerna Venedig och Florens, till stor del utkämpade av legoknektsanförare. Venedig vann Brescia och Bergamo efter Maclodio (1427), Florens och påven besegrade Milano vid Anghiari (1440), och efter Viscontis död besegrade kondottiären Francesco Sforza Venedig vid Caravaggio (1448) och gjorde sig själv till hertig; freden i Lodi 1454 fastställde den venetiansk-milanesiska gränsen vid Adda och inledde fyrtio år av relativ fred i Italien.
