The hungry Milanese rose against the republic’s government and let Sforza in. His family ruled Milan, with interruptions, until 1535.: De hungriga milaneserna reste sig mot republikens regering och släppte in Sforza. Hans släkt styrde Milano, med avbrott, fram till 1535.
The peace was agreed directly between Venice and Milan, without the allies, who joined later.: Freden avtalades direkt mellan Venedig och Milano, utan de allierade, som anslöt sig senare.
