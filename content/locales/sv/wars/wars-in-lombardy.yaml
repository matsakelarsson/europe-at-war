The armies were led by condottieri, mercenary captains hired by contract, who often changed employers. Francesco Sforza fought for and against both Milan and Venice before becoming Duke of Milan; Florence, his ally, then fought on Milan’s side.: Arméerna leddes av kondottiärer, legoknektsanförare som anställdes på kontrakt och ofta bytte uppdragsgivare. Francesco Sforza stred både för och mot Milano och Venedig innan han blev hertig av Milano; Florens, hans allierade, stred då på Milanos sida.
Historians divide the fighting into four or five wars between 1423 and 1454, separated by short-lived peaces (Venice 1426, Ferrara 1428 and 1433, Cremona 1441).: Historiker delar in striderna i fyra eller fem krig mellan 1423 och 1454, åtskilda av kortlivade fredsslut (Venedig 1426, Ferrara 1428 och 1433, Cremona 1441).
