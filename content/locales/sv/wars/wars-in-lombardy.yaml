When Filippo Maria died without a son on 13 August 1447, the Milanese proclaimed a republic, the Golden Ambrosian Republic, and hired Sforza to defend it against Venice, whose army was already advancing on the city. On 15 September 1448 Sforza routed the Venetians at Caravaggio. A month later he changed sides, made his own peace with Venice at Rivoltella and turned on Milan. He blockaded the starving city until it gave in, and on 26 February 1450 he entered it; in March he was proclaimed duke.: När Filippo Maria dog utan söner den 13 augusti 1447 utropade milaneserna en republik, Ambrosianska republiken, och anställde Sforza för att försvara den mot Venedig, vars armé redan ryckte fram mot staden. Den 15 september 1448 slog Sforza venetianarna på flykten vid Caravaggio. En månad senare bytte han sida, slöt egen fred med Venedig i Rivoltella och vände sig mot Milano. Han blockerade den svältande staden tills den gav upp, och den 26 februari 1450 tågade han in; i mars utropades han till hertig.
Venice, alarmed, allied with Alfonso V of Naples against Sforza, who had the support of Cosimo de’ Medici’s Florence, and the war went on in 1452–1454 without decisive battles. The fall of Constantinople to the Ottomans in May 1453 and the exhaustion of all sides brought peace. On 9 April 1454 Venice and Milan signed the Peace of Lodi, which recognised Sforza as duke and fixed their border on the Adda, leaving Bergamo, Brescia and Crema to Venice. Florence, Naples and the pope soon joined them in an Italian League that kept the peace between the main Italian states, with interruptions, for forty years.: Det oroade Venedig allierade sig med Alfons V av Neapel mot Sforza, som hade stöd av Cosimo de’ Medicis Florens, och kriget fortsatte 1452–1454 utan avgörande slag. Konstantinopels fall för osmanerna i maj 1453 och utmattningen på alla sidor ledde till fred. Den 9 april 1454 undertecknade Venedig och Milano freden i Lodi, som erkände Sforza som hertig och fastställde gränsen vid Adda, så att Bergamo, Brescia och Crema tillföll Venedig. Florens, Neapel och påven anslöt sig snart i en italiensk liga som med avbrott bevarade freden mellan de viktigaste italienska staterna i fyrtio år.
