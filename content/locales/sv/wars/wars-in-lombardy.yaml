War broke out again in 1434, and the rival condottieri dominated the campaigns, Niccolò Piccinino for Milan, Gattamelata and Francesco Sforza for the league. From 1438 Piccinino besieged Brescia, which held out for over two years, while Venice dragged a fleet of galleys overland from the Adige to Lake Garda to bring it help. In 1440 Piccinino crossed the Apennines with Florentine exiles to raise a revolt in Tuscany.: Kriget bröt ut igen 1434, och de rivaliserande kondottiärerna dominerade fälttågen, Niccolò Piccinino för Milano, Gattamelata och Francesco Sforza för förbundet. Från 1438 belägrade Piccinino Brescia, som höll ut i över två år, medan Venedig släpade en galärflotta över land från Adige till Gardasjön för att komma till undsättning. År 1440 gick Piccinino över Apenninerna med florentinska landsflyktingar för att uppvigla till revolt i Toscana.
On 29 June 1440, near Anghiari in the upper Tiber valley, the Florentine and papal army met Piccinino’s men as they came down from Sansepolcro and beat them after a long fight for a bridge. Machiavelli later mocked the battle, claiming that only one man died, crushed after falling from his horse; modern accounts give far higher losses. The war ended with the Peace of Cremona on 20 November 1441. Sforza married Filippo Maria’s only child, Bianca Maria, with Cremona as her dowry, and Venice kept Ravenna, which it had taken over that year.: Den 29 juni 1440, nära Anghiari i övre Tiberdalen, mötte den florentinska och påvliga armén Piccininos män när de kom ner från Sansepolcro och besegrade dem efter en lång strid om en bro. Machiavelli gjorde sig senare lustig över slaget och påstod att bara en man dog, krossad sedan han fallit av hästen; moderna framställningar anger betydligt större förluster. Kriget avslutades med freden i Cremona den 20 november 1441. Sforza gifte sig med Filippo Marias enda barn, Bianca Maria, med Cremona som hemgift, och Venedig behöll Ravenna, som det hade tagit över samma år.
