Wars of Castro: Castrokrigen
Two wars between the papacy and the Farnese dukes of Parma over the Duchy of Castro, their fief in northern Lazio. After Odoardo Farnese quarrelled with Pope Urban VIII’s Barberini nephews, Rome stopped buying grain from Castro, and Odoardo could not pay his Roman creditors. On 12 October 1641 a papal army took Castro almost without a fight, and the pope excommunicated Odoardo. In 1642 Odoardo’s cavalry rode deep into the Papal States and threatened Rome, and Venice, Tuscany and Modena allied with him. After fighting in the Po valley and around Lake Trasimeno, the papal army was beaten at Lagoscuro, near Ferrara, on 17 March 1644, and a peace signed at Ferrara on 31 March gave Castro back. In 1649 Odoardo’s son Ranuccio II stopped paying the creditors, and after the new bishop of Castro was murdered, Pope Innocent X sent troops who took the town. On 2 September 1649 Castro was razed on the pope’s orders, and a column was put up saying ‘Here stood Castro’. The duchy passed to the Papal States.: Två krig mellan påvedömet och farnesehertigarna av Parma om hertigdömet Castro, deras län i norra Lazio. Sedan Odoardo Farnese kommit i konflikt med påven Urban VIII:s brorsöner av släkten Barberini slutade Rom att köpa spannmål från Castro, och Odoardo kunde inte betala sina romerska fordringsägare. Den 12 oktober 1641 intog en påvlig armé Castro nästan utan strid, och påven bannlyste Odoardo. År 1642 red Odoardos kavalleri djupt in i Kyrkostaten och hotade Rom, och Venedig, Toscana och Modena allierade sig med honom. Efter strider i Podalen och kring Trasimenosjön besegrades den påvliga armén vid Lagoscuro nära Ferrara den 17 mars 1644, och en fred som undertecknades i Ferrara den 31 mars återgav Castro. År 1649 slutade Odoardos son Ranuccio II att betala fordringsägarna, och sedan den nye biskopen av Castro mördats sände påven Innocentius X trupper som intog staden. Den 2 september 1649 jämnades Castro med marken på påvens order, och en pelare restes med inskriften ”Här stod Castro”. Hertigdömet tillföll Kyrkostaten.
