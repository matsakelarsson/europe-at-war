Francesco Gonzaga of Mantua joined the league against Milan in 1397 but later went over to Visconti, and commanded troops for him at Casalecchio.: Francesco Gonzaga av Mantua anslöt sig till förbundet mot Milano 1397 men gick senare över till Visconti och förde befälet över trupper åt honom vid Casalecchio.
Francesco Novello da Carrara recovered Padua from Milan in 1390 and remained Florence’s ally. Florentine writers such as Leonardo Bruni later presented the war as a defence of republican liberty against tyranny.: Francesco Novello da Carrara återtog Padua från Milano 1390 och förblev Florens allierade. Florentinska skribenter som Leonardo Bruni framställde senare kriget som ett försvar för den republikanska friheten mot tyranniet.
