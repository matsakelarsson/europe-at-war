Wars of Gian Galeazzo Visconti: Gian Galeazzo Viscontis krig
The wars between Gian Galeazzo Visconti, lord and from 1395 Duke of Milan, and Florence and its allies, as Visconti built a state that covered most of northern and central Italy. Having taken Verona in 1387 and Padua in 1388, he went to war with Florence and Bologna in 1390. Florence’s captain John Hawkwood invaded Lombardy in 1391 but had to retreat, and its French ally, the Count of Armagnac, was defeated and killed outside Alessandria that July; the Peace of Genoa of 1392 settled little. After an attack on Mantua and a truce in 1398, Visconti bought Pisa in 1399 and took Siena, Perugia and much of Umbria under his rule, and in 1401 his army turned back the German king Rupert near Brescia. On 26 June 1402 it routed the Bolognese and Florentines at Casalecchio and took Bologna, leaving Florence isolated, but Gian Galeazzo died of plague at Melegnano on 3 September 1402, and his state broke up among his captains and young sons.: Krigen mellan Gian Galeazzo Visconti, herre och från 1395 hertig av Milano, och Florens med allierade, medan Visconti byggde upp en stat som omfattade större delen av norra och mellersta Italien. Sedan han intagit Verona 1387 och Padua 1388 gick han i krig mot Florens och Bologna 1390. Florens befälhavare John Hawkwood invaderade Lombardiet 1391 men tvingades dra sig tillbaka, och stadens franske allierade, greven av Armagnac, besegrades och dödades utanför Alessandria i juli samma år; freden i Genua 1392 avgjorde föga. Efter ett anfall mot Mantua och ett stillestånd 1398 köpte Visconti Pisa 1399 och lade Siena, Perugia och stora delar av Umbrien under sitt styre, och 1401 drev hans armé tillbaka den tyske kungen Rupert nära Brescia. Den 26 juni 1402 slog den bologneserna och florentinarna på flykten vid Casalecchio och intog Bologna, vilket lämnade Florens isolerat, men Gian Galeazzo dog i pest i Melegnano den 3 september 1402, och hans stat föll sönder mellan hans befälhavare och unga söner.
