Wars of Kappel: Kappelkrigen
Two wars between the Protestant and Catholic cantons of the Swiss Confederacy during the Reformation, named after Kappel am Albis on the border between Zürich and Zug. In June 1529 Zürich, led by the reformer Huldrych Zwingli, declared war on the five Catholic cantons of central Switzerland (Lucerne, Uri, Schwyz, Unterwalden and Zug), but the armies did not fight, and the First Peace of Kappel on 26 June made the Catholics give up their alliance with Austria. In 1531 a food blockade by Zürich and Bern drove the five cantons to declare war on 9 October. Two days later they routed the outnumbered Zürich army at Kappel, killing some 500 men, among them Zwingli, and on the night of 23–24 October beat a larger Protestant force on the Gubel near Menzingen. The Second Peace of Kappel, signed on 20 November 1531, let each canton choose its own faith but favoured Catholicism in the common territories, and checked the spread of the Reformation in Switzerland.: Två krig mellan de protestantiska och katolska kantonerna i Schweiziska edsförbundet under reformationen, uppkallade efter Kappel am Albis på gränsen mellan Zürich och Zug. I juni 1529 förklarade Zürich, under ledning av reformatorn Huldrych Zwingli, krig mot de fem katolska kantonerna i Centralschweiz (Luzern, Uri, Schwyz, Unterwalden och Zug), men arméerna kom aldrig i strid, och den första freden i Kappel den 26 juni tvingade katolikerna att ge upp sin allians med Österrike. År 1531 drev en livsmedelsblockad från Zürich och Bern de fem kantonerna att förklara krig den 9 oktober. Två dagar senare slog de den numerärt underlägsna zürcharmén på flykten vid Kappel och dödade omkring 500 man, bland dem Zwingli, och natten mellan den 23 och 24 oktober besegrade de en större protestantisk styrka på Gubel nära Menzingen. Den andra freden i Kappel, undertecknad den 20 november 1531, lät varje kanton välja sin egen tro men gynnade katolicismen i de gemensamma områdena och hejdade reformationens spridning i Schweiz.
