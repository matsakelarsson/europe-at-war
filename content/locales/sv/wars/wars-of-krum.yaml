Nikephoros’s first campaign against Bulgaria ended here, when he learned of a conspiracy among his officers and returned to Constantinople.: Nikeforos första fälttåg mot Bulgarien slutade här, när han fick veta om en sammansvärjning bland sina officerare och återvände till Konstantinopel.
Spring 809: våren 809
Krum took the city on terms and then, according to Theophanes, put the garrison of 6,000 men to death. Some officers escaped to Constantinople; the emperor refused them a hearing.: Krum intog staden på villkor och lät sedan enligt Theofanes avrätta garnisonen på 6 000 man. Några officerare flydde till Konstantinopel; kejsaren vägrade att höra dem.
Pliska: Pliska
The khans’ capital, a great walled enclosure with a stone palace in its centre. Nikephoros claimed to have celebrated Easter 809 in Krum’s palace; some historians doubt he got so far.: Khanernas huvudstad, en stor inhägnad med murar och ett stenpalats i mitten. Nikeforos påstod sig ha firat påsk 809 i Krums palats; en del historiker betvivlar att han kom så långt.
Krum: Krum
Nikephoros, 807: Nikeforos 807
In the summer of 811 Nikephoros invaded Bulgaria with a large army drawn from the themes of Thrace and Asia Minor and the guard regiments, and his son Staurakios at his side. He refused Krum’s offers of peace at the frontier fortress of Marcellae, crossed the Balkan Mountains and, after beating the forces Krum could gather in haste, took Pliska on 20 July. The palace was looted and burned. Later sources describe the Byzantine troops killing the people of the town, children among them.: Sommaren 811 invaderade Nikeforos Bulgarien med en stor armé hämtad från Thrakiens och Mindre Asiens themer och gardesregementena, med sin son Staurakios vid sin sida. Han avvisade Krums fredsanbud vid gränsfästningen Marcellae, gick över Balkanbergen och intog, sedan han slagit de styrkor som Krum i hast kunnat samla, Pliska den 20 juli. Palatset plundrades och brändes. Senare källor beskriver hur de bysantinska trupperna dödade stadens invånare, bland dem barn.
Krum armed everyone he could and blocked the passes with ditches and wooden palisades. As the army marched south through a narrow valley, usually identified as the Varbitsa Pass, it found itself trapped, and at dawn on 26 July the Bulgarians fell on its camp. The army broke; many men died at the palisades or in a river. Nikephoros was killed, the first Byzantine emperor to die in battle since Valens in 378. Theophanes writes that Krum had his skull lined with silver and drank from it. Staurakios, badly wounded in the neck, reigned for a few weeks and died in 812.: Krum beväpnade alla han kunde och spärrade passen med diken och träpalissader. När armén marscherade söderut genom en trång dal, som vanligen identifieras med Varbitsapasset, fann den sig instängd, och i gryningen den 26 juli föll bulgarerna över dess läger. Armén bröts sönder; många män dog vid palissaderna eller i en flod. Nikeforos stupade, den förste bysantinske kejsare som dog i strid sedan Valens 378. Theofanes skriver att Krum lät klä hans skalle med silver och drack ur den. Staurakios, svårt sårad i halsen, regerade i några veckor och dog 812.
