The main source is the chronicle of Theophanes the Confessor, a contemporary who was hostile to Nikephoros I, with a fragment by an anonymous writer (the Scriptor Incertus) for 811–815. Both were written on the Byzantine side; Bulgarian inscriptions add a little. Numbers are uncertain, and some events (the Struma defeat, the peace) are dated a year apart in different accounts.: Huvudkällan är krönikan av Theofanes Bekännaren, en samtida som var fientlig mot Nikeforos I, med ett fragment av en anonym författare (Scriptor Incertus) för 811–815. Båda skrevs på bysantinsk sida; bulgariska inskrifter tillför lite. Siffrorna är osäkra, och vissa händelser (nederlaget vid Struma, freden) dateras med ett års skillnad i olika framställningar.
Krum’s title was khan (in the inscriptions kanasubigi). Serdica is today’s Sofia, Develtos stood near Debelt south of Burgas, Mesembria is Nesebar, Adrianople is Edirne and Arcadiopolis is Lüleburgaz in Turkey.: Krums titel var khan (i inskrifterna kanasubigi). Serdica är dagens Sofia, Develtos låg nära Debelt söder om Burgas, Mesembria är Nesebar, Adrianopel är Edirne och Arcadiopolis är Lüleburgaz i Turkiet.
Krum, who became khan of the Bulgars around 800, first turned north-west, where the Avar khaganate had been broken by Charlemagne’s Franks; by about 805 he had taken over its eastern lands, bringing Bulgaria to the borders of the Frankish empire. In the south lay the Byzantine Empire, ruled since 802 by Nikephoros I, a former finance minister who meant to recover the Balkans. His first campaign, in 807, got no further than Adrianople, where he turned back after discovering a plot against him.: Krum, som blev bulgarernas khan omkring 800, vände sig först mot nordväst, där avarernas khaganat hade krossats av Karl den stores franker; omkring 805 hade han tagit över dess östra områden, vilket förde Bulgarien fram till Frankerrikets gränser. I söder låg Bysantinska riket, som sedan 802 styrdes av Nikeforos I, en tidigare finansminister som ville återvinna Balkan. Hans första fälttåg, 807, kom inte längre än till Adrianopel, där han vände om sedan han upptäckt en sammansvärjning mot sig.
In 808 or 809 the Bulgarians surprised a Byzantine army in the valley of the Struma and captured the money sent to pay it. Then, shortly before Easter 809, Krum took Serdica, the Byzantine stronghold on the main road across the Balkans. Theophanes writes that he killed the garrison of 6,000 men and many civilians, although they had surrendered on terms. Nikephoros marched north, claimed to have reached Krum’s capital, Pliska, and tried to rebuild Serdica. In 810 he moved settlers from Asia Minor into the Slav lands on the frontier to hold it.: År 808 eller 809 överraskade bulgarerna en bysantinsk armé i Strumadalen och erövrade de pengar som sänts för att betala den. Strax före påsk 809 intog sedan Krum Serdica, det bysantinska fästet vid huvudvägen över Balkan. Theofanes skriver att han dödade garnisonen på 6 000 man och många civila, trots att de hade kapitulerat på villkor. Nikeforos marscherade norrut, påstod sig ha nått Krums huvudstad Pliska och försökte återuppbygga Serdica. År 810 flyttade han nybyggare från Mindre Asien till de slaviska områdena vid gränsen för att hålla den.
