At this frontier fortress, near today’s Karnobat, Nikephoros turned down Krum’s offer of peace.: Vid denna gränsfästning, nära dagens Karnobat, avvisade Nikeforos Krums fredsanbud.
The Byzantines took the Bulgarian capital, looted Krum’s treasury and burned the palace.: Bysantinerna intog den bulgariska huvudstaden, plundrade Krums skattkammare och brände palatset.
26 July 811: 26 juli 811
The returning army was trapped behind wooden barriers in a mountain pass and destroyed in a dawn attack. Nikephoros and many of his senior officers were killed.: Den återvändande armén stängdes in bakom träbarriärer i ett bergspass och förintades i ett anfall i gryningen. Nikeforos och många av hans högre officerare stupade.
Nikephoros I: Nikeforos I
In 812 Krum took Develtos and, that autumn, the port of Mesembria, where he captured a supply of Greek fire and the bronze tubes used to throw it. Nikephoros’s son-in-law, Michael I, refused his offer of peace. In June 813 Michael led a large army north and met Krum near Versinikia, north of Adrianople. After two weeks of waiting the Byzantines attacked on 22 June and were routed. Byzantine writers later suspected Leo the Armenian, whose Anatolian troops were among the first to leave the field. Within weeks Michael had abdicated and Leo was emperor.: År 812 intog Krum Develtos och på hösten hamnstaden Mesembria, där han erövrade ett förråd av grekisk eld och de bronsrör som användes för att slunga den. Nikeforos svärson, Mikael I, avvisade hans fredsanbud. I juni 813 ledde Mikael en stor armé norrut och mötte Krum nära Versinikia, norr om Adrianopel. Efter två veckors väntan anföll bysantinerna den 22 juni och slogs på flykten. Bysantinska skribenter misstänkte senare Leo armeniern, vars anatoliska trupper var bland de första att lämna slagfältet. Inom några veckor hade Mikael abdikerat och Leo blivit kejsare.
On 17 July Krum appeared before Constantinople and made sacrifices outside the Golden Gate. Leo invited him to a parley and set archers to kill him; Krum escaped wounded. In revenge he burned the suburbs, took Adrianople and carried thousands of its people off beyond the Danube, among them the family of the future emperor Basil I. He was preparing siege engines for an assault on the city when he died on 13 April 814. His son Omurtag made a thirty-year peace in 815 or 816. The frontier ran from Develtos inland along an earthwork, later called the Erkesia, and it held for most of the century.: Den 17 juli visade sig Krum framför Konstantinopel och offrade utanför Gyllene porten. Leo bjöd in honom till överläggningar och placerade bågskyttar för att döda honom; Krum kom undan sårad. Som hämnd brände han förstäderna, intog Adrianopel och förde bort tusentals av dess invånare till andra sidan Donau, bland dem den blivande kejsaren Basileios I:s familj. Han förberedde belägringsmaskiner för ett anfall mot staden när han dog den 13 april 814. Hans son Omurtag slöt en trettioårig fred 815 eller 816. Gränsen gick från Develtos inåt landet längs en jordvall, senare kallad Erkesia, och den höll större delen av århundradet.
