Krum’s wars with Byzantium: Krums krig mot Bysans
The wars between Khan Krum of Bulgaria and the Byzantine Empire, in which Krum took Serdica (Sofia), destroyed the army of the Emperor Nikephoros I in the Balkan passes in 811 and killed him, routed Michael I at Versinikia in 813 and stood before the walls of Constantinople. After Krum’s death in 814 his son Omurtag made a thirty-year peace that fixed the frontier in northern Thrace.: Krigen mellan khan Krum av Bulgarien och Bysantinska riket, där Krum intog Serdica (Sofia), förintade kejsar Nikeforos I:s armé i Balkanpassen 811 och dödade honom, slog Mikael I på flykten vid Versinikia 813 och stod framför Konstantinopels murar. Efter Krums död 814 slöt hans son Omurtag en trettioårig fred som fastställde gränsen i norra Thrakien.
