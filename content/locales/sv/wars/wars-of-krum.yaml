The Black Sea port fell after a short siege. Theophanes says the Bulgarians found 36 bronze siphons for Greek fire and a store of the fire itself.: Hamnstaden vid Svarta havet föll efter en kort belägring. Theofanes uppger att bulgarerna fann 36 sifoner av brons för grekisk eld och ett förråd av själva elden.
Develtos: Develtos
Krum took the town and moved its people, with their bishop, into Bulgaria. Its site is near today’s Debelt, south of Burgas.: Krum intog staden och flyttade dess invånare, med deras biskop, till Bulgarien. Platsen ligger nära dagens Debelt, söder om Burgas.
22 June 813: 22 juni 813
The armies faced each other for two weeks. When the Byzantines attacked, their line broke almost at once and Krum’s cavalry pursued them. The exact site is unknown; some scholars place it near Elhovo.: Arméerna stod mot varandra i två veckor. När bysantinerna anföll bröts deras linje nästan genast, och Krums kavalleri förföljde dem. Den exakta platsen är okänd; en del forskare förlägger den nära Elhovo.
July 813: juli 813
Krum’s army could not storm the land walls, and he had no fleet. An attempt to kill him at a parley outside the walls failed.: Krums armé kunde inte storma landmurarna, och han hade ingen flotta. Ett försök att döda honom vid överläggningar utanför murarna misslyckades.
Krum’s brother besieged the city, which surrendered after Krum’s return. Thousands of its people were deported north of the Danube.: Krums bror belägrade staden, som kapitulerade efter Krums återkomst. Tusentals av dess invånare deporterades norr om Donau.
