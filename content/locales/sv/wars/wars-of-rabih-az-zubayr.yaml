# Svenska översättningar av katalogtexten (våg 12); stegtexterna kommer senare.
Wars of Rabih az-Zubayr: Rabih az-Zubayrs krig
? "The wars of Rabih az-Zubayr, a Sudanese soldier and slave trader who led the remnant of al-Zubayr Rahma Mansur’s private army from the Bahr el-Ghazal across Central Africa and made himself master of the ancient empire of Bornu. After the Egyptian government of the Sudan crushed the revolt of al-Zubayr’s son Suleiman in 1879, Rabih escaped west with about 400 men. For twelve years his army raided the peoples of today’s Central African Republic and southern Chad for captives and ivory, growing to some 5,000 riflemen. In 1892–1893 he drove the king of Baguirmi from Massenya, and in 1893–1894 he defeated the armies of the al-Kanemi shehus, sacked Kukawa and ruled Bornu from Dikwa as a military state. France, which claimed the Chad basin, declared him a usurper: his army destroyed a French column at Togbao in July 1899 and held off another at Kouno in October, but on 22 April 1900 three French columns, from the Congo, the Niger and Algeria, joined at Kousséri and defeated him; Rabih and the French commander, Amédée-François Lamy, were both killed. Rabih’s son Fadlallah fought on in the British sphere until he was killed at Gujba in August 1901. Rabih is remembered in Bornu and southern Chad for depopulation and devastation, and by others as one of the last great opponents of French rule in Africa."
: "Krigen under Rabih az-Zubayr, en sudanesisk soldat och slavhandlare som ledde resterna av al-Zubayr Rahma Mansurs privatarmé från Bahr el-Ghazal tvärs över Centralafrika och gjorde sig till herre över det gamla riket Bornu. Sedan Sudans egyptiska regering hade krossat revolten under al-Zubayrs son Suleiman 1879 flydde Rabih västerut med omkring 400 man. I tolv år plundrade hans armé folken i dagens Centralafrikanska republiken och södra Tchad på fångar och elfenben och växte till omkring 5 000 gevärsskyttar. Åren 1892–1893 drev han kungen av Baguirmi från Massenya, och 1893–1894 besegrade han arméerna hos shehuerna av al-Kanemi-dynastin, plundrade Kukawa och styrde Bornu från Dikwa som en militärstat. Frankrike, som gjorde anspråk på Tchadbäckenet, förklarade honom vara en usurpator: hans armé tillintetgjorde en fransk kolonn vid Togbao i juli 1899 och höll stånd mot en annan vid Kouno i oktober, men den 22 april 1900 förenades tre franska kolonner, från Kongo, Niger och Algeriet, vid Kousséri och besegrade honom; både Rabih och den franske befälhavaren Amédée-François Lamy stupade. Rabihs son Fadlallah fortsatte att strida i den brittiska intressesfären tills han dödades vid Gujba i augusti 1901. I Bornu och södra Tchad minns man Rabih för avfolkning och förödelse, medan andra minns honom som en av de sista stora motståndarna till det franska styret i Afrika."
