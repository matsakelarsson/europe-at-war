# Svenska översättningar av katalogtexten (våg 8); stegtexterna kommer senare.
Wars of Rana Kumbha: Rana Kumbhas krig
"The wars of Rana Kumbha, king of Mewar from 1433 to 1468, against the sultans of Malwa and Gujarat. When Sultan Mahmud Khalji of Malwa sheltered Mahpa Panwar, one of the murderers of Kumbha’s father, Kumbha marched against him and defeated him at Sarangpur in 1437; Mewar’s inscriptions say he took the sultan to Chittor as a prisoner and freed him after six months. Mahmud Khalji answered with almost yearly invasions: between 1442 and 1446 he attacked Kumbhalgarh and Chittor and fought indecisive battles at Mandalgarh and on the Banas, in 1444 he took the fort of Gagron, and in 1457 Mandalgarh. Kumbha’s capture of Nagaur in 1456 brought Gujarat into the war, and late that year the two sultans agreed at Champaner to divide Mewar between them. Their armies ravaged the country and besieged Kumbhalgarh, but neither took Kumbhalgarh or Chittor, and Kumbha held his kingdom until his son Udaysimha murdered him in 1468.": "De krig som Rana Kumbha, kung av Mewar från 1433 till 1468, förde mot sultanerna av Malwa och Gujarat. När sultan Mahmud Khalji av Malwa gav skydd åt Mahpa Panwar, en av mördarna av Kumbhas far, tågade Kumbha mot honom och besegrade honom vid Sarangpur 1437; enligt Mewars inskrifter förde han sultanen som fånge till Chittor och släppte honom efter sex månader. Mahmud Khalji svarade med nästan årliga invasioner: mellan 1442 och 1446 angrep han Kumbhalgarh och Chittor och utkämpade oavgjorda slag vid Mandalgarh och vid floden Banas, 1444 intog han fästningen Gagron och 1457 Mandalgarh. Kumbhas erövring av Nagaur 1456 drog in Gujarat i kriget, och sent samma år kom de två sultanerna i Champaner överens om att dela Mewar mellan sig. Deras arméer härjade landet och belägrade Kumbhalgarh, men ingen av dem intog Kumbhalgarh eller Chittor, och Kumbha behöll sitt rike tills hans son Udaysimha mördade honom 1468."
