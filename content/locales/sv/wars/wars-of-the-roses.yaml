Richard’s body was shown to the public and buried in the Greyfriars church. His remains were found under a car park in 2012 and reburied in Leicester Cathedral in 2015.: Rikards kropp visades offentligt och begravdes i gråbrödernas kyrka. Hans kvarlevor hittades under en parkeringsplats 2012 och begravdes på nytt i Leicesters katedral 2015.
Henry Tudor: Henrik Tudor
Richard III: Rikard III
Henry VII was crowned on 30 October 1485 and married Elizabeth of York in January 1486, joining the two houses, but his hold on the throne was weak. A boy of about ten, Lambert Simnel, was coached by an Oxford priest to pose as Edward, Earl of Warwick, the Yorkist heir whom Henry kept in the Tower. The plot was taken up by John de la Pole, Earl of Lincoln, Richard III’s nephew, and by Edward IV’s sister Margaret of York, dowager duchess of Burgundy, who paid for about 2,000 mercenaries, mostly German, under Martin Schwartz. In Ireland the Earl of Kildare and the Anglo-Irish lords took up the cause, and on 24 May 1487 Simnel was crowned “Edward VI” in Dublin.: Henrik VII kröntes den 30 oktober 1485 och gifte sig med Elisabet av York i januari 1486, vilket förenade de två husen, men hans grepp om tronen var svagt. En pojke på omkring tio år, Lambert Simnel, drillades av en präst från Oxford att utge sig för Edvard, earl av Warwick, den yorkistiske arvingen som Henrik höll i Towern. Komplotten togs upp av John de la Pole, earl av Lincoln, Rikard III:s brorson, och av Edvard IV:s syster Margareta av York, änkehertiginna av Burgund, som betalade omkring 2 000 legosoldater, mestadels tyska, under Martin Schwartz. På Irland tog earlen av Kildare och de anglo-irländska lorderna upp saken, och den 24 maj 1487 kröntes Simnel till ”Edvard VI” i Dublin.
The rebels, with several thousand Irish troops, landed at Furness in Lancashire on 4 June and marched across the Pennines and south towards Newark, finding little support. Henry met them at East Stoke on 16 June. The mercenaries fought hard and the lightly armed Irish suffered terribly, but the rebel army was destroyed; Lincoln and Schwartz were killed. Henry pardoned the boy and put him to work in the royal kitchens. Another pretender, Perkin Warbeck, troubled the king in the 1490s, but Stoke was the last battle between armies fighting for the throne.: Rebellerna, med flera tusen irländska soldater, landsteg i Furness i Lancashire den 4 juni och marscherade över Penninerna och söderut mot Newark utan att finna mycket stöd. Henrik mötte dem vid East Stoke den 16 juni. Legosoldaterna stred hårt och de lätt beväpnade irländarna led fruktansvärda förluster, men rebellarmén förintades; Lincoln och Schwartz dödades. Henrik benådade pojken och satte honom i arbete i de kungliga köken. En annan tronpretendent, Perkin Warbeck, besvärade kungen på 1490-talet, men Stoke var det sista slaget mellan arméer som stred om tronen.
