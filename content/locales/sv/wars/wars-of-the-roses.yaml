Edward IV died on 9 April 1483, leaving a twelve-year-old son, Edward V. The boy’s uncle, Richard, Duke of Gloucester, took charge of him, had the queen’s kinsmen arrested and later executed, and in June had Edward IV’s children declared illegitimate. He was crowned Richard III on 6 July. Edward V and his younger brother were not seen outside the Tower after that summer, and most people came to believe they had been killed. A rising that autumn, joined by Richard’s former ally the Duke of Buckingham, failed, and Buckingham was beheaded at Salisbury.: Edvard IV dog den 9 april 1483 och efterlämnade en tolvårig son, Edvard V. Pojkens farbror, Rikard, hertig av Gloucester, tog hand om honom, lät arrestera och senare avrätta drottningens släktingar och lät i juni förklara Edvard IV:s barn illegitima. Han kröntes till Rikard III den 6 juli. Edvard V och hans yngre bror sågs aldrig utanför Towern efter den sommaren, och de flesta kom att tro att de hade dödats. Ett uppror samma höst, som Rikards tidigare bundsförvant hertigen av Buckingham anslöt sig till, misslyckades, och Buckingham halshöggs i Salisbury.
Henry Tudor, Earl of Richmond, the Lancastrian claimant through his mother Margaret Beaufort, had lived in exile in Brittany since 1471. At Christmas 1483 he swore in Rennes Cathedral to marry Edward IV’s daughter Elizabeth. With French money, ships and mercenaries he landed at Mill Bay in Pembrokeshire on 7 August 1485 and gathered men as he marched through Wales. On 22 August he met Richard’s larger army near Market Bosworth. Richard charged at Henry with his household knights, Sir William Stanley’s men then fell on him, and he was killed, the last English king to die in battle.: Henrik Tudor, earl av Richmond, den lancastriske tronpretendenten genom sin mor Margareta Beaufort, hade levt i landsflykt i Bretagne sedan 1471. Vid julen 1483 svor han i katedralen i Rennes att gifta sig med Edvard IV:s dotter Elisabet. Med franska pengar, fartyg och legosoldater landsteg han vid Mill Bay i Pembrokeshire den 7 augusti 1485 och samlade folk under marschen genom Wales. Den 22 augusti mötte han Rikards större armé nära Market Bosworth. Rikard red till anfall mot Henrik med sina hovriddare, sir William Stanleys män föll då över honom, och han dödades, den siste engelske kung som stupat i strid.
