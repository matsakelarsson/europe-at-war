In 1464 Edward IV secretly married Elizabeth Woodville, a widow from a minor family, while Warwick was negotiating a French match for him. The rise of her relatives, and Edward’s alliance with Burgundy against France, drove Warwick into opposition. In 1469 he and the king’s brother George, Duke of Clarence, stirred up a rising in the north; its men beat a royal army at Edgcote on 24 July, and the queen’s father and a brother were executed. Edward was held for a time but regained control. In 1470 a second rising was crushed at Losecoat Field, and Warwick and Clarence fled to France, where Louis XI reconciled Warwick with Margaret of Anjou.: År 1464 gifte sig Edvard IV i hemlighet med Elizabeth Woodville, en änka från en obetydlig släkt, medan Warwick förhandlade om ett franskt äktenskap för honom. Hennes släktingars uppstigande, och Edvards allians med Burgund mot Frankrike, drev Warwick i opposition. År 1469 uppviglade han och kungens bror Georg, hertig av Clarence, till ett uppror i norr; dess män slog en kunglig armé vid Edgcote den 24 juli, och drottningens far och en av hennes bröder avrättades. Edvard hölls fången en tid men återtog kontrollen. År 1470 krossades ett andra uppror vid Losecoat Field, och Warwick och Clarence flydde till Frankrike, där Ludvig XI försonade Warwick med Margareta av Anjou.
Warwick landed in Devon in September 1470. Outnumbered, Edward fled from King’s Lynn to the Low Countries, ruled by his brother-in-law Charles the Bold, and Henry VI was brought out of the Tower and restored. With Burgundian help Edward landed at Ravenspurn on the Humber in March 1471, won Clarence back and entered London. On 14 April, in fog at Barnet, he beat and killed Warwick. That day Margaret and her son landed at Weymouth; Edward caught them at Tewkesbury on 4 May. The prince was killed, and Henry VI died in the Tower on the night Edward returned to London, almost certainly on his orders.: Warwick landsteg i Devon i september 1470. Numerärt underlägsen flydde Edvard från King’s Lynn till Nederländerna, som styrdes av hans svåger Karl den djärve, och Henrik VI hämtades ut ur Towern och återinsattes. Med burgundisk hjälp landsteg Edvard i Ravenspurn vid Humber i mars 1471, vann tillbaka Clarence och tågade in i London. Den 14 april, i dimma vid Barnet, besegrade och dödade han Warwick. Samma dag landsteg Margareta och hennes son i Weymouth; Edvard hann upp dem vid Tewkesbury den 4 maj. Prinsen dödades, och Henrik VI dog i Towern samma natt som Edvard återvände till London, nästan säkert på hans order.
