Dates are Julian (Old Style), as in English sources of the time. The chroniclers’ figures for armies and the dead are often far too large; modern estimates are given where they differ.: Datum anges enligt den julianska kalendern (gamla stilen), som i samtida engelska källor. Krönikörernas siffror för arméer och döda är ofta alldeles för höga; moderna uppskattningar anges där de skiljer sig åt.
The name “Wars of the Roses” came into common use only in the 19th century. The white rose was a Yorkist badge, but the red rose of Lancaster was mostly a Tudor invention; Henry VII’s Tudor rose joined the two. Contemporaries spoke simply of the civil wars.: Namnet ”Rosornas krig” kom i allmänt bruk först på 1800-talet. Den vita rosen var ett yorkistiskt märke, men Lancasters röda ros var till största delen en tudorisk uppfinning; Henrik VII:s tudorros förenade de två. Samtiden talade helt enkelt om inbördeskrigen.
Several leading figures changed sides, above all Richard Neville, Earl of Warwick, “the Kingmaker”, who fought for York until 1469 and died fighting for Lancaster in 1471.: Flera ledande gestalter bytte sida, framför allt Richard Neville, earl av Warwick, ”kungamakaren”, som stred för York fram till 1469 och stupade i strid för Lancaster 1471.
