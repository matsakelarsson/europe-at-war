In the cathedral of the Breton capital, Henry Tudor swore to marry Elizabeth of York, and his followers did homage to him as king.: I katedralen i den bretonska huvudstaden svor Henrik Tudor att gifta sig med Elisabet av York, och hans anhängare hyllade honom som kung.
1 August 1485: 1 augusti 1485
Henry sailed from the mouth of the Seine with a small fleet and an army of English exiles and French soldiers.: Henrik seglade från Seines mynning med en liten flotta och en armé av engelska landsflyktingar och franska soldater.
Mill Bay: Mill Bay
