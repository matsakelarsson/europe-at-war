The “princes in the Tower”, Edward V and Richard of Shrewsbury, were lodged here and seen less and less often. Their fate has never been settled.: ”Prinsarna i Towern”, Edvard V och Rikard av Shrewsbury, inkvarterades här och syntes allt mer sällan. Deras öde har aldrig klarlagts.
