Wars of the Roses: Rosornas krig
The civil wars for the English throne between the houses of Lancaster and York, two branches of the royal Plantagenet family. They began when Richard, Duke of York, challenged the court of the feeble Henry VI, brought Edward IV to the throne at Towton in 1461 and again at Barnet and Tewkesbury in 1471, and ended when Henry Tudor defeated Richard III at Bosworth in 1485 and crushed the last Yorkist rising at Stoke in 1487.: Inbördeskrigen om den engelska tronen mellan husen Lancaster och York, två grenar av den kungliga ätten Plantagenet. De började när Rikard, hertig av York, utmanade den svage Henrik VI:s hov, förde Edvard IV till tronen vid Towton 1461 och åter vid Barnet och Tewkesbury 1471, och slutade när Henrik Tudor besegrade Rikard III vid Bosworth 1485 och krossade det sista yorkistiska upproret vid Stoke 1487.
