Dublin: Dublin
York, the king’s lieutenant in Ireland, found refuge there. The Irish parliament stood by him and refused to act on his attainder.: York, kungens ståthållare på Irland, fann en tillflykt där. Det irländska parlamentet stod på hans sida och vägrade att verkställa domen mot honom.
Warwick was captain of Calais, England’s largest permanent garrison. He held it against the court and raided the Kent coast from it.: Warwick var kapten i Calais, Englands största stående garnison. Han höll staden mot hovet och gjorde därifrån räder mot Kents kust.
10 July 1460: 10 juli 1460
The royal army waited behind earthworks with guns, but rain soaked the powder and Lord Grey of Ruthin’s men let the Yorkists in. The Duke of Buckingham was killed and the king captured.: Den kungliga armén väntade bakom jordvallar med kanoner, men regnet blötte ner krutet och lord Grey of Ruthins män släppte in yorkisterna. Hertigen av Buckingham dödades och kungen tillfångatogs.
Warwick and March: Warwick och March
Queen Margaret would not accept her son’s disinheritance, and the northern lords gathered an army for her. York marched north to meet it, and on 30 December 1460 he left Sandal Castle to fight outside Wakefield and was killed with his son Edmund; Salisbury was beheaded at Pontefract the next day. The queen’s army moved south, plundering as it went, beat Warwick at the second battle of St Albans on 17 February 1461 and recovered the king. But London shut its gates, and the army turned back north. York’s eldest son Edward had already won at Mortimer’s Cross, and on 4 March he was proclaimed king in London as Edward IV.: Drottning Margareta ville inte godta att hennes son gjorts arvlös, och de nordliga lorderna samlade en armé åt henne. York marscherade norrut för att möta den, och den 30 december 1460 lämnade han Sandal Castle för att strida utanför Wakefield och dödades tillsammans med sin son Edmund; Salisbury halshöggs i Pontefract dagen därpå. Drottningens armé drog söderut under plundring, slog Warwick i andra slaget vid St Albans den 17 februari 1461 och återtog kungen. Men London stängde sina portar, och armén vände tillbaka norrut. Yorks äldste son Edvard hade redan segrat vid Mortimer’s Cross, och den 4 mars utropades han till kung i London som Edvard IV.
Edward followed the Lancastrians north. On 29 March, Palm Sunday, the armies met near Towton in a snowstorm and fought for most of the day, until the Duke of Norfolk’s late arrival turned the Lancastrian flank and the rout ended at the Cock Beck, where many drowned. The heralds were said to have counted 28,000 dead. Modern historians think that too high, but Towton was probably the largest and bloodiest battle ever fought on English soil. Henry and Margaret fled to Scotland and gave it Berwick for its help. Lancastrians held out in the Northumberland castles until 1464; Henry was captured in 1465.: Edvard följde efter lancastrarna norrut. Den 29 mars, på palmsöndagen, möttes arméerna nära Towton i en snöstorm och stred större delen av dagen, tills hertigen av Norfolks sena ankomst kringgick den lancastriska flanken och flykten slutade vid Cock Beck, där många drunknade. Härolderna sades ha räknat 28 000 döda. Moderna historiker anser det vara för högt, men Towton var troligen det största och blodigaste slag som någonsin utkämpats på engelsk mark. Henrik och Margareta flydde till Skottland och gav det Berwick för dess hjälp. Lancastrare höll ut i borgarna i Northumberland till 1464; Henrik tillfångatogs 1465.
