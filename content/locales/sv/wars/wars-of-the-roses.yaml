Henry landed near Dale at the mouth of Milford Haven, close to his birthplace at Pembroke, and marched north up the Welsh coast.: Henrik landsteg nära Dale vid mynningen av Milford Haven, nära sin födelseort Pembroke, och marscherade norrut längs den walesiska kusten.
