Henry VI had been king since he was nine months old. By 1453 almost all of English France was lost, and that August he fell into a stupor that lasted more than a year. Richard, Duke of York, the greatest landowner in England and a royal kinsman with his own claim to the throne, was made Protector and had his rival Edmund Beaufort, Duke of Somerset, sent to the Tower. When the king recovered, Somerset was freed and York shut out. On 22 May 1455 York and his allies, the Neville earls of Salisbury and Warwick, fought the king’s party in the streets of St Albans. Somerset was killed and Henry taken.: Henrik VI hade varit kung sedan han var nio månader gammal. År 1453 var nästan hela det engelska Frankrike förlorat, och i augusti det året föll han i ett dvalliknande tillstånd som varade i mer än ett år. Rikard, hertig av York, Englands störste jordägare och en kunglig släkting med eget anspråk på tronen, utsågs till protektor och lät sätta sin rival Edmund Beaufort, hertig av Somerset, i Towern. När kungen tillfrisknade släpptes Somerset och York stängdes ute. Den 22 maj 1455 drabbade York och hans allierade, Nevilleearlerna av Salisbury och Warwick, samman med kungens parti på St Albans gator. Somerset dödades och Henrik tillfångatogs.
An uneasy peace followed, with Queen Margaret of Anjou leading the court. Fighting resumed in 1459. Salisbury won at Blore Heath, but at Ludford Bridge the Yorkist army broke up when the Calais garrison went over to the king. York fled to Ireland, and his son Edward, Earl of March, went with Salisbury and Warwick to Calais. A parliament at Coventry declared them all traitors. In June 1460 the earls landed at Sandwich, entered London and, on 10 July, beat the royal army at Northampton and captured the king. In October Parliament made York Henry’s heir, passing over the king’s own son.: En orolig fred följde, med drottning Margareta av Anjou som ledare för hovet. Striderna återupptogs 1459. Salisbury segrade vid Blore Heath, men vid Ludford Bridge upplöstes den yorkistiska armén när Calaisgarnisonen gick över till kungen. York flydde till Irland, och hans son Edvard, earl av March, följde med Salisbury och Warwick till Calais. Ett parlament i Coventry förklarade dem alla som förrädare. I juni 1460 landsteg earlerna i Sandwich, tågade in i London och slog den 10 juli den kungliga armén vid Northampton och tillfångatog kungen. I oktober gjorde parlamentet York till Henriks arvinge och förbigick kungens egen son.
