The Stanleys kept their men apart until Richard made his charge. Excavations since 2009 place the battle about 3 km south-west of the traditional site at Ambion Hill.: Stanleyerna höll sina män utanför striden tills Rikard red till anfall. Utgrävningar sedan 2009 förlägger slaget omkring 3 km sydväst om den traditionella platsen vid Ambion Hill.
