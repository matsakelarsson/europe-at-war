Parliament reorganised its forces as the New Model Army under Sir Thomas Fairfax, with Cromwell commanding the cavalry. On 14 June 1645, at Naseby in Northamptonshire, it destroyed the King’s main field army. Some 4,500 Royalist infantry were captured, and so was the King’s correspondence, which showed him seeking Irish and foreign troops; Parliament published it. Fairfax beat the western Royalists at Langport in July, and in September Rupert surrendered Bristol. The remaining Royalist garrisons fell one by one.: Parlamentet organiserade om sina styrkor till New Model Army under sir Thomas Fairfax, med Cromwell som befälhavare för kavalleriet. Den 14 juni 1645 vid Naseby i Northamptonshire förintade den kungens huvudarmé. Omkring 4 500 rojalistiska infanterister tillfångatogs, liksom kungens brevväxling, som visade att han sökte irländska och utländska trupper; parlamentet offentliggjorde den. Fairfax slog rojalisterna i väster vid Langport i juli, och i september överlämnade Rupert Bristol. De återstående rojalistiska garnisonerna föll en efter en.
In Scotland, James Graham, Marquis of Montrose, leading Highlanders and Irish troops sent from Ulster, won six victories in a year, the last at Kilsyth on 15 August 1645. At Philiphaugh on 13 September a Covenanter army destroyed his force, and prisoners and camp followers were massacred. In Ireland Owen Roe O’Neill beat the Scottish army in Ulster at Benburb in June 1646. By then the war in England was over. On 5 May 1646 Charles gave himself up to the Scottish army besieging Newark, and Oxford surrendered on 24 June.: I Skottland vann James Graham, markis av Montrose, i spetsen för högländare och irländska trupper som sänts från Ulster, sex segrar på ett år, den sista vid Kilsyth den 15 augusti 1645. Vid Philiphaugh den 13 september förintade en covenanterarmé hans styrka, och fångar och trossfolk massakrerades. På Irland slog Owen Roe O’Neill den skotska armén i Ulster vid Benburb i juni 1646. Då var kriget i England över. Den 5 maj 1646 gav Karl upp sig till den skotska armé som belägrade Newark, och Oxford kapitulerade den 24 juni.
