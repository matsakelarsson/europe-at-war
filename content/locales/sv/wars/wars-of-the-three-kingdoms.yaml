Royalists and Irish Confederates: Rojalister och irländska konfedererade
Charles II landed in Scotland in June 1650 after swearing to the Covenants, and the Commonwealth struck first. Cromwell invaded in July, but David Leslie’s army blocked him outside Edinburgh until, short of food and sick, the English fell back to Dunbar. On 3 September Cromwell attacked the Scots as they came down from the hills and routed them. Estimates of the Scottish dead range from a few hundred to several thousand, and at least 6,000 were captured; thousands of the prisoners died on the march south and in captivity at Durham, and many survivors were sent to the colonies.: Karl II landsteg i Skottland i juni 1650 sedan han svurit på covenanterna, och samväldet slog till först. Cromwell invaderade i juli, men David Leslies armé spärrade vägen för honom utanför Edinburgh tills engelsmännen, sjuka och med ont om mat, drog sig tillbaka till Dunbar. Den 3 september angrep Cromwell skottarna när de kom ner från höjderna och slog dem på flykten. Uppskattningarna av antalet döda skottar varierar från några hundra till flera tusen, och minst 6 000 togs till fånga; tusentals av fångarna dog under marschen söderut och i fångenskapen i Durham, och många överlevande skickades till kolonierna.
Charles was crowned at Scone on 1 January 1651. In July an English army crossed the Firth of Forth and won at Inverkeithing, and Charles gambled on invading England with a mainly Scottish army, hoping English Royalists would rise. Few did. Cromwell caught him at Worcester on 3 September 1651, a year to the day after Dunbar, and destroyed his army. Charles escaped, hiding at one point in an oak tree at Boscobel, and reached France six weeks later. In Scotland General George Monck took Stirling and stormed Dundee, and the country was occupied.: Karl kröntes i Scone den 1 januari 1651. I juli gick en engelsk armé över Firth of Forth och segrade vid Inverkeithing, och Karl satsade allt på att invadera England med en huvudsakligen skotsk armé, i hopp om att engelska rojalister skulle resa sig. Få gjorde det. Cromwell hann upp honom vid Worcester den 3 september 1651, på dagen ett år efter Dunbar, och förintade hans armé. Karl kom undan, vid ett tillfälle gömd i en ek vid Boscobel, och nådde Frankrike sex veckor senare. I Skottland intog general George Monck Stirling och stormade Dundee, och landet ockuperades.
