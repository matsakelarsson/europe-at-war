Also called the British Civil Wars. The fighting in England is usually called the English Civil War (the First, 1642–1646, and the Second, 1648), and the war in Ireland the Irish Confederate Wars.: Kallas även de brittiska inbördeskrigen. Striderna i England brukar kallas det engelska inbördeskriget (det första 1642–1646 och det andra 1648), och kriget på Irland de irländska konfederationskrigen.
Alliances shifted. The Scots fought Charles I in 1639–1640 and 1644–1646, invaded England for him in 1648 (the Engagers), and fought for Charles II in 1650–1651. The Irish Confederates, Catholic rebels who governed most of Ireland from Kilkenny, made truces and treaties with the King’s Lord Lieutenant, the Marquis of Ormond, and joined him against the Commonwealth in 1649.: Allianserna skiftade. Skottarna stred mot Karl I 1639–1640 och 1644–1646, invaderade England för hans räkning 1648 (Engagers) och stred för Karl II 1650–1651. De irländska konfedererade, katolska rebeller som styrde större delen av Irland från Kilkenny, slöt stillestånd och fördrag med kungens lordlöjtnant, markisen av Ormond, och förenade sig med honom mot samväldet 1649.
Dates are Old Style (Julian), as usual in British history, ten days behind the calendar used on the Continent, with the year starting on 1 January.: Datum anges enligt gamla stilen (julianska kalendern), som brukligt i brittisk historia, tio dagar efter den kalender som användes på kontinenten, med året räknat från 1 januari.
