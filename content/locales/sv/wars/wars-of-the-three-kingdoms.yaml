In London, King and Parliament quarrelled over who should command the army needed to crush the Irish rising. On 4 January 1642 Charles came to the House of Commons with soldiers to arrest five members, who had fled, and soon afterwards he left the capital. In April the governor of Hull shut its gates and its arsenal against him, and on 22 August Charles raised his standard at Nottingham. Most of the north, the west and Wales sided with the King, and London, the south-east, East Anglia and the navy with Parliament, though almost every county was divided.: I London grälade kungen och parlamentet om vem som skulle föra befälet över den armé som behövdes för att krossa det irländska upproret. Den 4 januari 1642 kom Karl till underhuset med soldater för att arrestera fem ledamöter, som hade flytt, och kort därefter lämnade han huvudstaden. I april stängde guvernören i Hull stadens portar och dess arsenal för honom, och den 22 augusti reste Karl sitt baner i Nottingham. Större delen av norra och västra England samt Wales tog kungens parti, och London, sydöstra England, East Anglia och flottan parlamentets, även om nästan varje grevskap var splittrat.
The King recruited in the Welsh borders and marched on London. At Edgehill in Warwickshire on 23 October he met Parliament’s army under the Earl of Essex. Prince Rupert’s cavalry swept away the horse in front of them but rode off in pursuit, and the infantry fought to a bloody draw. Charles took Banbury and Oxford and pressed on, and his troops sacked Brentford on 12 November. The next day some 24,000 Parliamentarian soldiers and London trained bands barred the road at Turnham Green, and he fell back to Oxford, his capital for the rest of the war.: Kungen värvade trupper i de walesiska gränstrakterna och marscherade mot London. Vid Edgehill i Warwickshire mötte han den 23 oktober parlamentets armé under earlen av Essex. Prins Ruperts kavalleri sopade undan rytteriet framför sig men red i väg i förföljande, och infanteriet utkämpade ett blodigt oavgjort slag. Karl intog Banbury och Oxford och fortsatte framåt, och hans trupper plundrade Brentford den 12 november. Dagen därpå spärrade omkring 24 000 parlamentariska soldater och Londons borgarmilis vägen vid Turnham Green, och han drog sig tillbaka till Oxford, hans huvudstad under resten av kriget.
