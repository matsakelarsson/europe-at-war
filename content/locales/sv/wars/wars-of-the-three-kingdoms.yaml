Wars of the Three Kingdoms: De tre kungarikenas krig
The linked wars in Scotland, Ireland and England under Charles I and the Commonwealth, from the Scottish Covenanters’ revolt and the Irish rising of 1641 to the English Civil Wars between King and Parliament. They ended with the execution of Charles I in 1649, the abolition of the monarchy and the conquest of Ireland and Scotland by the English Commonwealth.: De sammanlänkade krigen i Skottland, Irland och England under Karl I och samväldet, från de skotska covenanternas revolt och det irländska upproret 1641 till de engelska inbördeskrigen mellan kungen och parlamentet. De slutade med avrättningen av Karl I 1649, monarkins avskaffande och det engelska samväldets erövring av Irland och Skottland.
