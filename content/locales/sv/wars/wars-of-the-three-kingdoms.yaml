The year 1643 went the King’s way. The Earl of Newcastle beat the Fairfaxes at Adwalton Moor in June and took most of Yorkshire, Royalist cavalry won at Roundway Down in July, and Rupert stormed Bristol, England’s second city, on 26 July. Essex saved Gloucester in September and fought his way home at Newbury. Both sides looked for allies. Charles made a truce with the Irish Confederates so that he could bring troops home, and Parliament agreed the Solemn League and Covenant with the Scots, promising to reform the Church of England on Presbyterian lines in return for an army.: Året 1643 gick kungens väg. Earlen av Newcastle slog familjen Fairfax vid Adwalton Moor i juni och tog större delen av Yorkshire, rojalistiskt kavalleri segrade vid Roundway Down i juli, och Rupert stormade Bristol, Englands näst största stad, den 26 juli. Essex räddade Gloucester i september och kämpade sig hem vid Newbury. Båda sidor sökte allierade. Karl slöt stillestånd med de irländska konfedererade för att kunna föra hem trupper, och parlamentet ingick Solemn League and Covenant med skottarna och lovade att reformera Engelska kyrkan efter presbyteriansk modell i utbyte mot en armé.
In January 1644 about 20,000 Scots under the Earl of Leven crossed the Tweed, and with the Fairfaxes and the Earl of Manchester’s army they besieged York. Rupert relieved the city, then attacked them at Marston Moor on 2 July. More than 40,000 men fought, and Oliver Cromwell’s cavalry broke the Royalist right and won the battle; about 4,000 Royalists were killed. York surrendered on 16 July, and the north was lost to the King. In the south he did better, trapping Essex’s army in Cornwall, where its infantry surrendered at Lostwithiel in September.: I januari 1644 gick omkring 20 000 skottar under earlen av Leven över Tweed, och tillsammans med familjen Fairfax och earlen av Manchesters armé belägrade de York. Rupert undsatte staden och angrep dem sedan vid Marston Moor den 2 juli. Mer än 40 000 man stred, och Oliver Cromwells kavalleri krossade den rojalistiska högerflygeln och vann slaget; omkring 4 000 rojalister dödades. York kapitulerade den 16 juli, och norra England var förlorat för kungen. I söder gick det bättre för honom; han stängde in Essex armé i Cornwall, där dess infanteri kapitulerade vid Lostwithiel i september.
