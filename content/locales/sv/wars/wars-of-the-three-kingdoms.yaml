The Scots handed Charles over to Parliament in January 1647 on payment of part of the money owed to their army. Parliament’s Presbyterian majority then tried to disband the New Model Army without its arrears of pay, and the army seized the King and marched on London; at Putney its officers and the radical Levellers debated who should have the vote. Charles escaped in November but was held at Carisbrooke Castle on the Isle of Wight, where he signed a secret Engagement with Scottish nobles, who would restore him in return for three years of Presbyterianism in England.: Skottarna lämnade över Karl till parlamentet i januari 1647 mot betalning av en del av de pengar som deras armé hade till godo. Parlamentets presbyterianska majoritet försökte sedan upplösa New Model Army utan att betala ut dess innestående sold, och armén tog kungen i sitt förvar och marscherade mot London; i Putney debatterade dess officerare och de radikala levellers om vem som skulle ha rösträtt. Karl flydde i november men hölls fången i Carisbrooke Castle på Isle of Wight, där han undertecknade en hemlig överenskommelse, Engagement, med skotska adelsmän, som skulle återinsätta honom i utbyte mot tre år av presbyterianism i England.
In 1648 risings broke out in South Wales, Kent and Essex, and part of the navy mutinied. The army crushed them one by one, the Welsh at St Fagans in May, Kent at Maidstone on 1 June, and Colchester after a siege of eleven weeks, after which two Royalist commanders were shot. On 8 July the Duke of Hamilton led the Engagers’ army into England, and on 17–19 August Cromwell, with fewer men, destroyed it around Preston. On 6 December soldiers under Colonel Thomas Pride kept out of the Commons the members who still wanted a settlement with the King.: År 1648 bröt uppror ut i södra Wales, Kent och Essex, och en del av flottan gjorde myteri. Armén krossade dem ett efter ett, walesarna vid St Fagans i maj, Kent vid Maidstone den 1 juni och Colchester efter en elva veckor lång belägring, varefter två rojalistiska befälhavare arkebuserades. Den 8 juli förde hertigen av Hamilton Engagers armé in i England, och den 17–19 augusti förintade Cromwell, med färre män, den kring Preston. Den 6 december stängde soldater under överste Thomas Pride ute de ledamöter av underhuset som fortfarande ville komma överens med kungen.
