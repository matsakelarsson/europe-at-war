Charles I ruled three kingdoms with three different churches. In 1637 he imposed a new prayer book on Scotland without consulting its Parliament or Kirk, and on 23 July its first reading in St Giles’ in Edinburgh set off a riot. In February 1638 thousands signed the National Covenant to defend the Reformed Kirk, and that December the General Assembly in Glasgow abolished the bishops. In the Bishops’ Wars Charles twice failed to force the Scots back into line, and in August 1640 a Covenanter army routed his troops at Newburn and occupied Newcastle.: Karl I styrde tre kungariken med tre olika kyrkor. År 1637 påtvingade han Skottland en ny bönbok utan att rådfråga dess parlament eller kyrka, och den 23 juli utlöste den första läsningen ur den i St Giles’ i Edinburgh ett upplopp. I februari 1638 undertecknade tusentals National Covenant för att försvara den reformerta kyrkan, och i december samma år avskaffade generalförsamlingen i Glasgow biskoparna. I biskopskrigen misslyckades Karl två gånger med att tvinga skottarna till lydnad, och i augusti 1640 slog en covenanterarmé hans trupper på flykten vid Newburn och ockuperade Newcastle.
To pay the Scots to leave, Charles had to summon the Long Parliament in November 1640, which sent his minister Strafford to the block and dismantled his personal rule. Irish Catholics feared a Puritan Parliament would take their land and religion. On 23 October 1641 a plot to seize Dublin Castle was betrayed, but in Ulster the rising led by Sir Phelim O’Neill spread fast. Thousands of Protestant settlers were robbed, driven out or killed, about 4,000 in the attacks and perhaps up to 12,000 with those who died of cold and disease, and settlers and soldiers killed Catholics in revenge. Exaggerated reports of massacre inflamed England and Scotland.: För att kunna betala skottarna för att dra sig tillbaka tvingades Karl i november 1640 sammankalla Långa parlamentet, som skickade hans minister Strafford till schavotten och monterade ner hans personliga styre. De irländska katolikerna fruktade att ett puritanskt parlament skulle ta deras jord och religion. Den 23 oktober 1641 röjdes en komplott om att inta Dublin Castle, men i Ulster spred sig upproret under sir Phelim O’Neill snabbt. Tusentals protestantiska nybyggare plundrades, fördrevs eller dödades, omkring 4 000 i angreppen och kanske upp till 12 000 om man räknar med dem som dog av kyla och sjukdomar, och nybyggare och soldater dödade katoliker som hämnd. Överdrivna rapporter om massakrer väckte upprördhet i England och Skottland.
