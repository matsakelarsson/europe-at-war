In Ireland, Ireton took Limerick in October 1651 after a long siege and died of plague a month later. Galway, the last city, surrendered on 12 May 1652, and the last organised Irish force gave up at Cloughoughter in County Cavan on 27 April 1653, though guerrillas fought on. War, famine and plague had cost Ireland perhaps a fifth of its people. Tens of thousands of Irish soldiers left to serve in Spain and France, and thousands of prisoners and destitute people were shipped as servants to the colonies, Barbados above all.: På Irland intog Ireton Limerick i oktober 1651 efter en lång belägring och dog i pest en månad senare. Galway, den sista staden, kapitulerade den 12 maj 1652, och den sista organiserade irländska styrkan gav upp vid Cloughoughter i grevskapet Cavan den 27 april 1653, även om gerillakrigare fortsatte striden. Krig, hungersnöd och pest hade kostat Irland kanske en femtedel av dess befolkning. Tiotusentals irländska soldater lämnade landet för att tjäna i Spanien och Frankrike, och tusentals fångar och utblottade skeppades som tjänare till kolonierna, framför allt till Barbados.
The Act for the Settlement of Ireland of August 1652 confiscated the land of those who had fought against Parliament, to pay the soldiers and the investors who had financed the war. Catholic landowners allowed to keep any land were to be moved west of the Shannon, to Connacht and Clare, and by some estimates Catholic ownership fell to about 8%. Scotland was declared united with the Commonwealth in February 1652 and held down by Monck’s garrisons. In England Cromwell dissolved the Rump in April 1653, and on 16 December he became Lord Protector of England, Scotland and Ireland.: Lagen om Irlands ordnande från augusti 1652 konfiskerade jorden från dem som hade stridit mot parlamentet, för att betala soldaterna och de investerare som hade finansierat kriget. Katolska jordägare som fick behålla någon jord skulle flyttas väster om Shannon, till Connacht och Clare, och enligt vissa uppskattningar sjönk den katolska andelen av jordägandet till omkring 8 %. Skottland förklarades förenat med samväldet i februari 1652 och hölls nere av Moncks garnisoner. I England upplöste Cromwell Rumpparlamentet i april 1653, och den 16 december blev han lordprotektor över England, Skottland och Irland.
