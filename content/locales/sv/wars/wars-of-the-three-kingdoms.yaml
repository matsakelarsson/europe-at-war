A High Court of Justice set up by the purged Commons tried Charles for treason against his people, and he was beheaded outside the Banqueting House in Whitehall on 30 January 1649. England abolished the monarchy and the House of Lords and became a Commonwealth. The Scots, who had not been consulted, proclaimed his son King Charles II. In Ireland the Confederates and the Royalists under the Marquis of Ormond joined forces and held almost all the country except Dublin and Derry.: En hög domstol som tillsatts av det utrensade underhuset ställde Karl inför rätta för förräderi mot sitt folk, och han halshöggs utanför Banqueting House i Whitehall den 30 januari 1649. England avskaffade monarkin och överhuset och blev ett samvälde. Skottarna, som inte hade rådfrågats, utropade hans son till kung Karl II. På Irland förenade de konfedererade och rojalisterna under markisen av Ormond sina styrkor och höll nästan hela landet utom Dublin och Derry.
On 2 August Colonel Michael Jones routed Ormond’s army at Rathmines, outside Dublin, and on 15 August Cromwell landed with about 12,000 veterans. He stormed Drogheda on 11 September, and his troops killed most of the garrison, many after they had surrendered, together with Catholic clergy and an unknown number of civilians. At Wexford in October between 1,500 and 2,000 soldiers and townspeople died in the sack. At Clonmel in May 1650 Hugh O’Neill’s garrison inflicted the New Model Army’s heaviest losses before slipping away. Cromwell returned to England that month, leaving the war to his son-in-law Henry Ireton.: Den 2 augusti slog överste Michael Jones Ormonds armé på flykten vid Rathmines utanför Dublin, och den 15 augusti landsteg Cromwell med omkring 12 000 veteraner. Han stormade Drogheda den 11 september, och hans trupper dödade större delen av garnisonen, många sedan de kapitulerat, tillsammans med katolska präster och ett okänt antal civila. I Wexford dog i oktober mellan 1 500 och 2 000 soldater och stadsbor under plundringen. I Clonmel tillfogade Hugh O’Neills garnison i maj 1650 New Model Army dess svåraste förluster innan den smet i väg. Cromwell återvände till England samma månad och överlät kriget åt sin svärson Henry Ireton.
