East Germany prepared two divisions for the invasion, but Moscow ordered them at the last moment not to cross the border, apart from a few specialists. Romania and Albania refused to take part, and Albania left the Warsaw Pact in September 1968.: Östtyskland förberedde två divisioner för invasionen, men Moskva beordrade dem i sista stund att inte gå över gränsen, bortsett från några få specialister. Rumänien och Albanien vägrade att delta, och Albanien lämnade Warszawapakten i september 1968.
The invasion was code-named Operation Danube. Czechoslovakia, a member of the Warsaw Pact itself, offered no armed resistance, and most of the dead were civilians.: Invasionen hade kodnamnet operation Donau. Tjeckoslovakien, som självt var medlem av Warszawapakten, gjorde inget väpnat motstånd, och de flesta av de döda var civila.
