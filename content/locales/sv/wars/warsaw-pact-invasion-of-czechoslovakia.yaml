In January 1968 the Slovak Communist Alexander Dubček replaced Antonín Novotný as party leader in Czechoslovakia. Under him censorship was relaxed and then effectively ended, victims of the purges of the 1950s were rehabilitated, and the party’s Action Programme of April promised “socialism with a human face”. Public debate flourished. The Soviet leadership under Leonid Brezhnev, and the leaders of Poland, East Germany, Hungary and Bulgaria, feared that the reforms would end the party’s monopoly of power and spread to their own countries. In July they demanded a halt in the Warsaw Letter, and talks at Čierna nad Tisou and Bratislava brought only a brief pause.: I januari 1968 efterträdde den slovakiske kommunisten Alexander Dubček Antonín Novotný som partiledare i Tjeckoslovakien. Under honom lättades censuren och upphörde sedan i praktiken, offren för 1950-talets utrensningar rehabiliterades, och partiets aktionsprogram från april utlovade ”socialism med mänskligt ansikte”. Den offentliga debatten blomstrade. Den sovjetiska ledningen under Leonid Brezjnev och ledarna i Polen, Östtyskland, Ungern och Bulgarien fruktade att reformerna skulle göra slut på partiets maktmonopol och sprida sig till deras egna länder. I juli krävde de ett stopp i Warszawabrevet, och samtalen i Čierna nad Tisou och Bratislava gav bara ett kort andrum.
At about 11 pm on 20 August some 250,000 Soviet, Polish, Hungarian and Bulgarian troops with about 2,000 tanks crossed the borders, and Soviet airborne troops landed at Prague’s Ruzyně airport. The Czechoslovak army was ordered not to resist. By morning Dubček and other leaders had been arrested, and they were soon flown to the Soviet Union. Crowds surrounded the tanks, argued with the young soldiers and took down street signs to confuse the invaders, while clandestine radio stations kept broadcasting. People were killed in Prague, Bratislava, Liberec and other towns, several outside the Prague radio building.: Omkring klockan 23 den 20 augusti gick omkring 250 000 sovjetiska, polska, ungerska och bulgariska soldater med omkring 2 000 stridsvagnar över gränserna, och sovjetiska luftlandsättningstrupper landade på Prags flygplats Ruzyně. Den tjeckoslovakiska armén beordrades att inte göra motstånd. På morgonen hade Dubček och andra ledare arresterats, och de flögs snart till Sovjetunionen. Folkmassor omringade stridsvagnarna, diskuterade med de unga soldaterna och tog ner gatuskyltar för att förvirra inkräktarna, medan hemliga radiostationer fortsatte att sända. Människor dödades i Prag, Bratislava, Liberec och andra städer, flera av dem utanför radiohuset i Prag.
