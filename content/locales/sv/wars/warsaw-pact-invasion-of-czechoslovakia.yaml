Warsaw Pact invasion of Czechoslovakia: Warszawapaktens invasion av Tjeckoslovakien
The invasion of Czechoslovakia on the night of 20–21 August 1968 by about 250,000 troops of the Soviet Union, Poland, Hungary and Bulgaria, which ended the reforms of the Prague Spring. The Czechoslovak army was ordered not to resist, and 137 Czechoslovak citizens were killed in the invasion and the months that followed. The reformist leaders were forced to accept the Moscow Protocol, Soviet troops stayed until 1991, and from 1969 Gustáv Husák’s “normalisation” restored strict Communist rule.: Invasionen av Tjeckoslovakien natten mellan den 20 och 21 augusti 1968 av omkring 250 000 soldater från Sovjetunionen, Polen, Ungern och Bulgarien, som gjorde slut på Pragvårens reformer. Den tjeckoslovakiska armén beordrades att inte göra motstånd, och 137 tjeckoslovakiska medborgare dödades under invasionen och de följande månaderna. De reformvänliga ledarna tvingades godta Moskvaprotokollet, sovjetiska trupper stannade kvar till 1991, och från 1969 återupprättade Gustáv Husáks ”normalisering” ett strikt kommunistiskt styre.
