The invaders had expected a new government to take over, but no credible collaborators came forward. An extraordinary party congress met secretly in a Prague factory on 22 August and backed Dubček. President Ludvík Svoboda flew to Moscow and insisted that the arrested leaders join the talks. On 26 August all of them except František Kriegel signed the Moscow Protocol, accepting renewed censorship and the presence of Soviet troops, which a treaty in October let stay “temporarily”; they remained until 1991. In 1968, 137 Czechoslovak citizens were killed during the invasion and occupation, and some 70,000 fled to the West.: Inkräktarna hade väntat sig att en ny regering skulle ta över, men inga trovärdiga kollaboratörer trädde fram. En extra partikongress samlades i hemlighet i en fabrik i Prag den 22 augusti och ställde sig bakom Dubček. President Ludvík Svoboda flög till Moskva och insisterade på att de arresterade ledarna skulle delta i förhandlingarna. Den 26 augusti undertecknade alla utom František Kriegel Moskvaprotokollet, som innebar att de godtog återinförd censur och närvaron av sovjetiska trupper, som ett fördrag i oktober lät stanna ”tillfälligt”; de blev kvar till 1991. Under 1968 dödades 137 tjeckoslovakiska medborgare under invasionen och ockupationen, och omkring 70 000 flydde till väst.
Resistance went on in other forms. In January 1969 the student Jan Palach set himself on fire in Wenceslas Square and died three days later; Jan Zajíc did the same in February. After crowds celebrating an ice-hockey victory over the Soviet Union in March 1969 attacked the Soviet airline office in Prague, Moscow forced Dubček out. On 17 April Gustáv Husák replaced him as party leader and began what was called “normalisation”. Purges removed hundreds of thousands from the party, reformers lost their jobs and censorship returned. The Brezhnev Doctrine justified the invasion as the defence of socialism in the bloc.: Motståndet fortsatte i andra former. I januari 1969 satte studenten Jan Palach eld på sig själv på Wenceslastorget och dog tre dagar senare; Jan Zajíc gjorde detsamma i februari. Sedan folkmassor som firade en ishockeyseger över Sovjetunionen i mars 1969 angripit det sovjetiska flygbolagets kontor i Prag tvingade Moskva bort Dubček. Den 17 april efterträddes han som partiledare av Gustáv Husák, som inledde det som kallades ”normalisering”. Utrensningar avlägsnade hundratusentals ur partiet, reformvänliga förlorade sina arbeten och censuren återkom. Brezjnevdoktrinen rättfärdigade invasionen som ett försvar av socialismen inom blocket.
