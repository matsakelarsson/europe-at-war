Waziristan campaign of 1936–1939: Waziristanfälttåget 1936–1939
A series of British Indian operations in Waziristan, on the North-West Frontier, against the followers of Mirzali Khan, a religious leader the British called the Faqir of Ipi. In 1936 a court in Bannu annulled the marriage of a Hindu girl who had converted to Islam, Islam Bibi, and the Faqir proclaimed a holy war against British interference in religion. In November 1936 a column sent through the Khaisora valley was ambushed and withdrew, and the rising spread among the Tori Khel Wazirs, Mahsuds and Bhittanis. At the height of the campaign in 1937 about 40,000 to 60,000 troops, with aircraft, armoured cars and artillery, faced perhaps 4,000 tribal fighters; villages were destroyed and the Royal Air Force bombed hostile areas. In April 1937 a convoy was ambushed in the Shahur Tangi gorge with the loss of 52 officers and men. The fighting died down by 1939, but the Faqir was never caught, and he kept up his resistance against Pakistan after 1947 until his death in 1960.: En serie brittisk-indiska operationer i Waziristan, vid nordvästgränsen, mot anhängarna till Mirzali Khan, en religiös ledare som britterna kallade fakiren av Ipi. År 1936 ogiltigförklarade en domstol i Bannu äktenskapet för en hinduisk flicka som hade konverterat till islam, Islam Bibi, och fakiren utropade ett heligt krig mot brittisk inblandning i religionen. I november 1936 hamnade en kolonn som sänts genom Khaisoradalen i ett bakhåll och drog sig tillbaka, och resningen spred sig bland Tori Khel-wazirerna, mahsuderna och bhittanierna. När fälttåget var som mest omfattande 1937 stod omkring 40 000 till 60 000 soldater, med flygplan, pansarbilar och artilleri, mot kanske 4 000 stamkrigare; byar förstördes och Royal Air Force bombade fientliga områden. I april 1937 överfölls en konvoj i ravinen Shahur Tangi, och 52 officerare och soldater dödades. Striderna ebbade ut fram till 1939, men fakiren greps aldrig, och han fortsatte sitt motstånd mot Pakistan efter 1947 fram till sin död 1960.
