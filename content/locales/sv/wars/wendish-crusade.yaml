Wendish Crusade: Vendiska korståget
A crusade of Saxon, Danish and Polish princes and bishops against the Slav peoples east of the Elbe, launched alongside the Second Crusade with the same indulgences, after the Saxons asked to fight their pagan neighbours instead of going to the Holy Land. The Obotrite prince Niklot struck first by raiding Wagria; one army besieged his fortress of Dobin and left after a token baptism of its defenders, while another, led by Albert the Bear and the bishops, retook Havelberg, failed before Demmin and turned on Szczecin, which was already Christian. The crusade won few converts, but it opened the way for German settlement east of the Elbe.: Ett korståg av sachsiska, danska och polska furstar och biskopar mot de slaviska folken öster om Elbe, som inleddes samtidigt med andra korståget och med samma avlat, sedan sachsarna bett att få bekämpa sina hedniska grannar i stället för att dra till Heliga landet. Obotriternas furste Niklot slog till först genom att härja Wagrien; en armé belägrade hans fästning Dobin och drog sig tillbaka efter ett symboliskt dop av försvararna, medan en annan, ledd av Albrekt björnen och biskoparna, återtog Havelberg, misslyckades framför Demmin och vände sig mot Szczecin, som redan var kristet. Korståget vann få konvertiter, men det banade väg för tysk kolonisation öster om Elbe.
