# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
West Indies campaign of the American Revolutionary War: Västindiska fälttåget under amerikanska frihetskriget
? The war for the sugar islands fought by Britain against France, Spain and the Dutch Republic after France allied itself with the United States in 1778. The French governor of Martinique, the Marquis de Bouillé, opened it by taking Dominica in September 1778; a British force answered by seizing Saint Lucia in December, beating off Admiral d’Estaing’s attempts to retake it. In 1779 the French took Saint Vincent, with the help of the Garifuna of Joseph Chatoyer, and Grenada, and d’Estaing mauled Admiral John Byron’s fleet off Grenada. When Britain went to war with the Dutch, Admiral George Rodney took Sint Eustatius, the free port that had supplied the American rebels, in February 1781 and plundered it; the French took Tobago that summer and retook Sint Eustatius in November, after Admiral de Grasse’s fleet had sailed north to seal the British defeat at Yorktown. In early 1782 de Grasse and Bouillé took St Kitts, Nevis and Montserrat, and France and Spain prepared to invade Jamaica, but on 12 April 1782 Rodney defeated and captured de Grasse at the Battle of the Saintes, and the invasion was abandoned. A Spanish force from Havana took Nassau in the Bahamas in May 1782; Loyalists retook it in April 1783. In the Peace of Versailles of 1783 France kept Tobago and the other islands were returned.
: Kriget om sockeröarna, som Storbritannien förde mot Frankrike, Spanien och Nederländska republiken sedan Frankrike hade allierat sig med USA 1778. Den franske guvernören på Martinique, markis de Bouillé, inledde det genom att inta Dominica i september 1778; en brittisk styrka svarade med att inta Saint Lucia i december och slog tillbaka amiral d’Estaings försök att återta ön. År 1779 intog fransmännen Saint Vincent, med hjälp av Joseph Chatoyers garifuna, och Grenada, och d’Estaing tilltygade amiral John Byrons flotta svårt utanför Grenada. När Storbritannien gick i krig med nederländarna intog amiral George Rodney i februari 1781 Sint Eustatius, den frihamn som hade försörjt de amerikanska rebellerna, och plundrade ön; fransmännen intog Tobago samma sommar och återtog Sint Eustatius i november, sedan amiral de Grasses flotta hade seglat norrut och beseglat det brittiska nederlaget vid Yorktown. I början av 1782 intog de Grasse och Bouillé Saint Kitts, Nevis och Montserrat, och Frankrike och Spanien förberedde en invasion av Jamaica, men den 12 april 1782 besegrade och tillfångatog Rodney de Grasse i slaget vid Les Saintes, och invasionen övergavs. En spansk styrka från Havanna intog Nassau på Bahamas i maj 1782; lojalister återtog staden i april 1783. Vid freden i Versailles 1783 behöll Frankrike Tobago, och de övriga öarna återlämnades.
