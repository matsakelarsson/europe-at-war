# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
West New Guinea dispute: Tvisten om Västra Nya Guinea
? The armed climax of the dispute between Indonesia and the Netherlands over the western half of New Guinea, which the Dutch had kept when they transferred sovereignty over the rest of the Dutch East Indies in 1949. Indonesia claimed it as part of the former colony; the Netherlands argued that the Papuans were a different people with a right to decide their own future, and from 1961 prepared them for self-government, with an elected New Guinea Council and a Papuan flag, the Morning Star. Indonesia broke off relations in August 1960, bought large quantities of Soviet arms, and on 19 December 1961 Sukarno ordered the territory to be taken by force (Trikora). An attempt to land troops by sea ended in the sinking of an Indonesian torpedo boat off Vlakke Hoek on 15 January 1962; through 1962 some 1,700 Indonesian soldiers were landed by sea or dropped by parachute, most of them killed or captured, while a full invasion was prepared. Under American pressure the Netherlands agreed in the New York Agreement of 15 August 1962 to hand the territory to a United Nations administration (UNTEA), which passed it to Indonesia on 1 May 1963, with a promise of an act of self-determination. In the Act of Free Choice of 1969, 1,025 Papuan representatives chosen by the Indonesian authorities voted unanimously for integration, a vote whose fairness is disputed to this day.
: Den väpnade kulmen på tvisten mellan Indonesien och Nederländerna om den västra halvan av Nya Guinea, som nederländarna hade behållit när de överlät suveräniteten över resten av Nederländska Ostindien 1949. Indonesien gjorde anspråk på området som en del av den tidigare kolonin; Nederländerna hävdade att papuanerna var ett annat folk med rätt att bestämma över sin egen framtid och förberedde dem från 1961 för självstyre, med ett valt Nya Guinea-råd och en papuansk flagga, Morgonstjärnan. Indonesien bröt de diplomatiska förbindelserna i augusti 1960 och köpte stora mängder sovjetiska vapen, och den 19 december 1961 beordrade Sukarno att området skulle tas med våld (Trikora). Ett försök att landsätta trupper från sjön slutade med att en indonesisk torpedbåt sänktes utanför Vlakke Hoek den 15 januari 1962; under 1962 landsattes omkring 1 700 indonesiska soldater från sjön eller släpptes ned med fallskärm, och de flesta av dem dödades eller tillfångatogs, medan en fullskalig invasion förbereddes. Under amerikanska påtryckningar gick Nederländerna i New York-avtalet den 15 augusti 1962 med på att överlämna området till en FN-förvaltning (UNTEA), som lämnade över det till Indonesien den 1 maj 1963 med ett löfte om en självbestämmandeakt. I Act of Free Choice (”det fria valets akt”) 1969 röstade 1 025 papuanska representanter, utvalda av de indonesiska myndigheterna, enhälligt för integration, en omröstning vars rättvisa är omstridd än i dag.
