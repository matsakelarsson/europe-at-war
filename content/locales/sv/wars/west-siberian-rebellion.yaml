# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
West Siberian rebellion: Västsibiriska upproret
? The largest peasant rising against Soviet rule, in western Siberia and the north of today’s Kazakhstan. After Kolchak’s defeat the Bolsheviks sent some 35,000 men of the food detachments to requisition grain in Siberia, where peasants had never known serfdom. The revolt began on 31 January 1921 in the Ishim district and spread within weeks across the Tyumen, Omsk, Akmolinsk and Chelyabinsk provinces, from Obdorsk (Salekhard) on the Arctic coast to Karkaralinsk in the steppe; estimates of the rebels in arms range from 30,000 to 150,000, with 55,000–100,000 the most often given. They took Petropavlovsk (briefly), Kokchetav, Tobolsk, Surgut, Berezovo and Obdorsk, and for about three weeks in February cut both lines of the Trans-Siberian Railway, stopping grain trains to central Russia. The Red Army, under a commission of Ivan Smirnov, Vasily Shorin and Ivan Pavlunovsky, reopened the railway in early March, retook Tobolsk on 8 April and crushed the main rebel army at Aromashevo at the end of April; the northern towns were retaken in May and June. Repression was severe, with hostages taken and villages shelled; Smirnov reported some 22,000 peasants killed in the Ishim and Petropavlovsk districts in the first six weeks alone. The end of requisitioning under the New Economic Policy helped bring the revolt to an end, though the last bands in the Ishim region were broken only at the end of 1922.
: Det största bondeupproret mot sovjetmakten, i västra Sibirien och norra delen av dagens Kazakstan. Efter Koltjaks nederlag sände bolsjevikerna omkring 35 000 man ur livsmedelsavdelningarna för att rekvirera spannmål i Sibirien, där bönderna aldrig hade känt till livegenskap. Revolten började den 31 januari 1921 i Isjimdistriktet och spred sig inom några veckor över guvernementen Tjumen, Omsk, Akmolinsk och Tjeljabinsk, från Obdorsk (Salechard) vid Ishavskusten till Karkaralinsk på stäppen; uppskattningarna av antalet beväpnade rebeller varierar från 30 000 till 150 000, och 55 000–100 000 är den oftast angivna siffran. De intog Petropavlovsk (en kort tid), Koktjetav, Tobolsk, Surgut, Berjozovo och Obdorsk och skar under omkring tre veckor i februari av båda linjerna av den transsibiriska järnvägen, så att spannmålstågen till centrala Ryssland stoppades. Röda armén, under en kommission bestående av Ivan Smirnov, Vasilij Sjorin och Ivan Pavlunovskij, öppnade järnvägen igen i början av mars, återtog Tobolsk den 8 april och krossade den viktigaste rebellarmén vid Aromasjevo i slutet av april; städerna i norr återtogs i maj och juni. Förtrycket var hårt, med gisslantagning och beskjutning av byar; Smirnov rapporterade att omkring 22 000 bönder hade dödats i distrikten Isjim och Petropavlovsk bara under de första sex veckorna. Slutet på rekvisitionerna under den nya ekonomiska politiken bidrog till att få slut på revolten, även om de sista banden i Isjimregionen krossades först i slutet av 1922.
