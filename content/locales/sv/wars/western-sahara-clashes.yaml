? "Last updated 27 November 2026. The low-intensity war between Morocco and the Polisario Front that resumed in November 2020 after 29 years of ceasefire. In October 2020 Sahrawi protesters blocked the road through the UN buffer strip at Guerguerat, the only road from Morocco and Moroccan-held Western Sahara to Mauritania. On 13 November Moroccan troops moved into the strip, cleared the road and extended the sand wall (the berm) to the Mauritanian border, and the next day the Polisario declared the 1991 ceasefire over. Since then Polisario units have fired on Moroccan positions along the berm, claiming daily attacks that are hard to verify, and Morocco has struck vehicles and fighters east of the berm with armed drones, killing Polisario commanders and also civilians, among them Algerian and Mauritanian traders and herders; by one count at least 120 people had been killed by drone strikes by November 2024. Shells fired at the town of Smara killed a civilian in October 2023. The diplomatic balance moved towards Morocco: the United States recognised Moroccan sovereignty in December 2020, as Morocco restored relations with Israel; Spain, France and others backed Morocco’s autonomy plan; and Algeria, the Polisario’s main supporter, broke off relations with Morocco in August 2021. On 31 October 2025 UN Security Council Resolution 2797, adopted with Russia, China and Pakistan abstaining and Algeria not voting, called for negotiations on the basis of Morocco’s autonomy plan and said that genuine autonomy “could represent a most feasible outcome”; the Polisario and Algeria rejected it. Morocco, the Polisario, Algeria and Mauritania met for three rounds of talks in Washington and Madrid in January and February 2026, but by October the UN envoy reported a stalemate. On 30 October 2026 Russia vetoed a US draft that would have renewed the UN mission (MINURSO) while dropping the referendum from its name and mandate, a rival Russian draft failed, and on 31 October the mission’s mandate lapsed for the first time since 1991; its withdrawal began on 1 November. On 10 November the Polisario declared a general mobilisation, citing what it called escalating Moroccan military movements along the berm, while Morocco said it remained committed to the ceasefire. Moroccan media reported a drone strike on Polisario vehicles the same day; few such reports could be independently confirmed, and it was uncertain whether Morocco would try to take the area east of the berm."
: "Senast uppdaterad 27 november 2026. Det lågintensiva krig mellan Marocko och Polisario som återupptogs i november 2020 efter 29 års vapenvila. I oktober 2020 blockerade sahrawiska demonstranter vägen genom FN:s buffertzon vid Guerguerat, den enda vägen från Marocko och det marockanskkontrollerade Västsahara till Mauretanien. Den 13 november ryckte marockanska trupper in i zonen, röjde vägen och förlängde sandvallen (bermen) till den mauretanska gränsen, och dagen därpå förklarade Polisario att vapenvilan från 1991 hade upphört. Sedan dess har Polisarios förband beskjutit marockanska ställningar längs vallen och gjort anspråk på dagliga anfall som är svåra att verifiera, och Marocko har angripit fordon och kämpar öster om vallen med beväpnade drönare och dödat befälhavare i Polisario men också civila, bland dem algeriska och mauretanska handelsmän och herdar; enligt en sammanställning hade minst 120 människor dödats i drönarangrepp fram till november 2024. Granater som avfyrades mot staden Smara dödade en civilperson i oktober 2023. Den diplomatiska balansen förskjöts till Marockos fördel: USA erkände marockansk suveränitet i december 2020, samtidigt som Marocko återupprättade förbindelserna med Israel; Spanien, Frankrike och andra ställde sig bakom Marockos autonomiplan; och Algeriet, Polisarios främsta stöd, bröt förbindelserna med Marocko i augusti 2021. Den 31 oktober 2025 antog FN:s säkerhetsråd resolution 2797, där Ryssland, Kina och Pakistan lade ned sina röster och Algeriet inte röstade. Den uppmanade till förhandlingar på grundval av Marockos självstyrelseplan och angav att verkligt självstyre ”skulle kunna utgöra den mest genomförbara lösningen”; Polisario och Algeriet förkastade den. Marocko, Polisario, Algeriet och Mauretanien möttes för tre förhandlingsrundor i Washington och Madrid i januari och februari 2026, men i oktober rapporterade FN:s sändebud ett dödläge. Den 30 oktober 2026 lade Ryssland in sitt veto mot ett amerikanskt förslag som skulle ha förlängt FN-insatsen (MINURSO) men strukit folkomröstningen ur dess namn och mandat, ett konkurrerande ryskt förslag föll, och den 31 oktober löpte insatsens mandat ut för första gången sedan 1991; dess tillbakadragande inleddes den 1 november. Den 10 november utlyste Polisario allmän mobilisering med hänvisning till vad rörelsen kallade upptrappade marockanska militära förflyttningar längs vallen, medan Marocko sade att landet stod fast vid vapenvilan. Samma dag rapporterade marockanska medier om ett drönarangrepp mot Polisarios fordon; få sådana uppgifter kunde bekräftas oberoende, och det var osäkert om Marocko skulle försöka inta området öster om vallen."
