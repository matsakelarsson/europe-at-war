# Svenska översättningar av katalogtexten (våg 12); stegtexterna kommer senare.
Western Sahara War: Västsaharakriget
? The war over the former Spanish Sahara between Morocco, Mauritania and the Polisario Front, the Sahrawi independence movement backed by Algeria. As Spain prepared to leave its colony in 1975, Morocco and Mauritania claimed it, while a UN mission found that most Sahrawis wanted independence, and the International Court of Justice found no tie of sovereignty that would override their right to self-determination. Morocco answered with the Green March of some 350,000 unarmed civilians in November 1975, and by the Madrid Accords Spain handed the administration to Morocco and Mauritania. Moroccan and Mauritanian troops moved in, tens of thousands of Sahrawis fled to camps near Tindouf in Algeria, and on 27 February 1976 the Polisario proclaimed the Sahrawi Arab Democratic Republic. With fast columns of Land Rovers the Polisario struck deep into Mauritania, raiding Nouakchott and the iron mines of Zouérat, until a coup in 1978 brought Mauritania to make peace in 1979; Morocco then took the Mauritanian share. Against Morocco the Polisario won battles in 1979–1981, but from 1980 Morocco built a sand wall, the berm, which by 1987 ran some 2,700 km and enclosed about four fifths of the territory, turning the war into a stalemate. A UN-brokered ceasefire took effect on 6 September 1991, with a promise of a referendum on independence that has never been held. Estimates of the dead range from about 10,000 to 20,000.
: Kriget om det forna Spanska Sahara mellan Marocko, Mauretanien och Polisario, den sahrawiska självständighetsrörelsen som stöddes av Algeriet. När Spanien förberedde sig för att lämna sin koloni 1975 gjorde Marocko och Mauretanien anspråk på den, medan en FN-delegation fann att de flesta sahrawier ville ha självständighet och Internationella domstolen inte fann några suveränitetsband som skulle väga tyngre än deras rätt till självbestämmande. Marocko svarade i november 1975 med den gröna marschen av omkring 350 000 obeväpnade civila, och genom Madridavtalet överlämnade Spanien förvaltningen till Marocko och Mauretanien. Marockanska och mauretanska trupper ryckte in, tiotusentals sahrawier flydde till läger nära Tindouf i Algeriet, och den 27 februari 1976 utropade Polisario Demokratiska arabiska republiken Sahara. Med snabba kolonner av Land Rover-fordon slog Polisario till djupt inne i Mauretanien och gjorde räder mot Nouakchott och järngruvorna i Zouérat, tills en statskupp 1978 ledde till att Mauretanien slöt fred 1979; Marocko tog då över den mauretanska delen. Mot Marocko vann Polisario strider 1979–1981, men från 1980 byggde Marocko en sandvall, bermen, som 1987 sträckte sig omkring 2 700 km och omslöt omkring fyra femtedelar av territoriet, vilket gjorde kriget till ett dödläge. En FN-förmedlad vapenvila trädde i kraft den 6 september 1991, med ett löfte om en folkomröstning om självständighet som aldrig har hållits. Uppskattningarna av antalet döda varierar från omkring 10 000 till 20 000.
