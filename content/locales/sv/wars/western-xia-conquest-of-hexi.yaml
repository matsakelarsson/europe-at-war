# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
Western Xia conquest of the Hexi Corridor: Västra Xias erövring av Hexikorridoren
? The campaigns in which the Tanguts, under Li Deming and his son Li Yuanhao, took the Hexi Corridor, the string of oases in today’s Gansu that carried the Silk Road between China and Central Asia. Since the fall of Tibetan rule in the 9th century the corridor had been divided between the Uyghur kingdom of Ganzhou (Zhangye), Tibetan tribes around Liangzhou (Wuwei), known as Xiliangfu, and the Chinese Guiyi circuit of the Cao family at Shazhou (Dunhuang) and Guazhou. In 1028 Li Deming sent Yuanhao against Ganzhou, already weakened by Liao attacks, and the Uyghur capital fell. The Uyghurs of Guazhou submitted in 1030. Yuanhao’s attack on the new Tibetan kingdom of Tsongkha under Gusiluo in Qinghai was beaten back, but in 1032 he took Liangzhou from the Tibetans of Xiliangfu, and in the same year succeeded his father. By 1036 he held the whole corridor, including Suzhou (Jiuquan) and Shazhou (Dunhuang), ending the Ganzhou kingdom and the Guiyi circuit; many Uyghurs moved west, some becoming the ancestors of the Yellow Uyghurs. In the same year the new Tangut script was put into official use. The corridor gave the Tanguts the Silk Road trade and the horses and resources for the empire Yuanhao proclaimed in 1038; they held it for almost two centuries.
: De fälttåg under vilka tanguterna, under Li Deming och hans son Li Yuanhao, tog Hexikorridoren, den kedja av oaser i dagens Gansu som Sidenvägen följde mellan Kina och Centralasien. Sedan det tibetanska styret föll på 800-talet hade korridoren varit delad mellan det uiguriska kungariket Ganzhou (Zhangye), tibetanska stammar kring Liangzhou (Wuwei), kända som Xiliangfu, och släkten Caos kinesiska Guiyikrets i Shazhou (Dunhuang) och Guazhou. År 1028 sände Li Deming Yuanhao mot Ganzhou, som redan var försvagat av angrepp från Liao, och den uiguriska huvudstaden föll. Uigurerna i Guazhou underkastade sig 1030. Yuanhaos angrepp på det nya tibetanska kungariket Tsongkha under Gusiluo i Qinghai slogs tillbaka, men 1032 tog han Liangzhou från tibetanerna i Xiliangfu och efterträdde samma år sin far. År 1036 behärskade han hela korridoren, inklusive Suzhou (Jiuquan) och Shazhou (Dunhuang), och hade gjort slut på kungariket Ganzhou och Guiyikretsen; många uigurer flyttade västerut, och en del av dem blev förfäder till de gula uigurerna. Samma år togs den nya tangutiska skriften i officiellt bruk. Korridoren gav tanguterna Sidenvägens handel och de hästar och resurser som krävdes för det kejsardöme som Yuanhao utropade 1038; de behöll den i nästan två sekler.
