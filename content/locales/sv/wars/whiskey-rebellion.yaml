# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
Whiskey Rebellion: Whiskyupproret
? Resistance by farmers on the western frontier, above all in western Pennsylvania, to the federal excise tax on distilled spirits. Treasury Secretary Alexander Hamilton’s tax of March 1791, meant to help pay the state war debts the federal government had taken over, fell hard on farmers west of the Appalachians, who turned their grain into whiskey to carry it over the mountains and used it as money, and who had to pay the tax in cash; large distillers in the East could pay less per gallon. Tax collectors were threatened and tarred and feathered from 1791 on. In July 1794, when a federal marshal came to serve writs, armed men besieged the house of the regional tax inspector, John Neville, at Bower Hill near Pittsburgh on 16–17 July; soldiers from Fort Pitt defended it, a rebel leader, James McFarlane, was killed, and the house was burned. On 1 August some 7,000 people gathered at Braddock’s Field and marched through Pittsburgh. Moderates such as Albert Gallatin and Hugh Henry Brackenridge urged restraint at a meeting at Parkinson’s Ferry, while President George Washington called out about 12,950 militia from Pennsylvania, New Jersey, Maryland and Virginia under Henry Lee, with Hamilton accompanying them; Washington rode with the army as far as Carlisle and Bedford in October, often described as the only time a sitting president has led troops in the field. The resistance melted away before the army arrived. About 20 men were taken to Philadelphia for trial; two were convicted of treason and pardoned by Washington. The rising was the first great test of the new federal government’s power to enforce its laws, and it deepened the divide between Federalists and Jefferson’s Republicans, who repealed the tax in 1802.
: Motstånd bland bönder vid den västra gränsen, framför allt i västra Pennsylvania, mot den federala punktskatten på destillerad sprit. Finansminister Alexander Hamiltons skatt från mars 1791, som skulle bidra till att betala de delstatliga krigsskulder som den federala regeringen hade övertagit, drabbade hårt bönderna väster om Appalacherna, som förvandlade sin säd till whisky för att kunna frakta den över bergen och använde den som betalningsmedel, och som måste betala skatten kontant; stora brännerier i öster kunde betala mindre per gallon. Skatteindrivare hotades och tjärades och fjädrades från 1791 och framåt. I juli 1794, när en federal marshal kom för att delge stämningar, belägrade beväpnade män den regionale skatteinspektören John Nevilles hus vid Bower Hill nära Pittsburgh den 16–17 juli; soldater från Fort Pitt försvarade det, en rebelledare, James McFarlane, dödades och huset brändes. Den 1 augusti samlades omkring 7 000 människor vid Braddock’s Field och marscherade genom Pittsburgh. Moderata som Albert Gallatin och Hugh Henry Brackenridge manade till återhållsamhet vid ett möte i Parkinson’s Ferry, medan president George Washington kallade ut omkring 12 950 milismän från Pennsylvania, New Jersey, Maryland och Virginia under Henry Lee, med Hamilton i följet; Washington red med armén ända till Carlisle och Bedford i oktober, vilket ofta beskrivs som det enda tillfälle då en sittande president har lett trupper i fält. Motståndet smälte bort innan armén kom fram. Omkring 20 män fördes till Philadelphia för rättegång; två dömdes för förräderi och benådades av Washington. Upproret var det första stora provet på den nya federala regeringens makt att upprätthålla sina lagar, och det fördjupade klyftan mellan federalisterna och Jeffersons republikaner, som avskaffade skatten 1802.
