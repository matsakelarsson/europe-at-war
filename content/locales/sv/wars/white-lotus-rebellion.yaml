# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
White Lotus Rebellion: Vita lotus-upproret
? A rebellion in the mountains where Hubei, Sichuan and Shaanxi meet, led by followers of the millenarian sects the Qing called the White Lotus, who taught that the Eternal Venerable Mother would send the Buddha Maitreya to save the faithful at the end of the age. The highlands of the upper Han River had filled with poor settlers in the 18th century, and the sects spread among them. A government campaign against the sects from 1794, carried out by extortionate local officials, drove them to revolt in 1796 in western Hubei and then in eastern Sichuan. Mobile rebel bands, among them one led by the young widow Wang Cong’er, moved through five provinces for years while badly led and corrupt Qing armies failed to catch them. After the death of the Qianlong Emperor and the fall of his favourite Heshen in 1799, the Jiaqing Emperor’s commanders moved the people into fortified villages, raised local militias and offered amnesty, and starved the bands out. The war was declared over in 1804. It cost the state, by its own reckoning, about 120 million taels, and some 100,000 rebels are thought to have been killed; civilian losses are unknown.
: Ett uppror i bergen där Hubei, Sichuan och Shaanxi möts, lett av anhängare till de millenaristiska sekter som Qing kallade Vita lotus och som lärde att Den eviga vördnadsvärda modern skulle sända buddhan Maitreya för att rädda de troende vid tidsålderns slut. Högländerna vid övre Hanfloden hade under 1700-talet fyllts av fattiga nybyggare, och sekterna spred sig bland dem. En regeringskampanj mot sekterna från 1794, genomförd av lokala ämbetsmän som pressade ut pengar, drev dem till uppror 1796 i västra Hubei och sedan i östra Sichuan. Rörliga rebellskaror, bland dem en som leddes av den unga änkan Wang Cong’er, drog i åratal genom fem provinser medan illa ledda och korrumperade Qingarméer misslyckades med att fånga dem. Efter Qianlongkejsarens död och hans gunstling Heshens fall 1799 flyttade Jiaqingkejsarens befälhavare befolkningen till befästa byar, satte upp lokala miliser och erbjöd amnesti, och svalt ut skarorna. Kriget förklarades avslutat 1804. Det kostade staten, enligt dess egen beräkning, omkring 120 miljoner tael, och omkring 100 000 rebeller tros ha dödats; de civila förlusterna är okända.
