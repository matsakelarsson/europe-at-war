In 1691 William’s Dutch general, Godert de Ginkel, took command in Ireland. After a ten-day bombardment his troops forded the Shannon and stormed Athlone on 30 June. The French general the Marquis de Saint-Ruth, sent by Louis XIV with officers and supplies, made a stand at Aughrim on 12 July. The Jacobites held until Saint-Ruth was killed by a cannonball and their left wing gave way. Estimates of the Jacobite dead run from 4,000 to 7,000, making Aughrim the bloodiest battle ever fought in Ireland. Galway surrendered on 21 July.: År 1691 tog Vilhelms nederländske general Godert de Ginkel befälet på Irland. Efter ett tio dagar långt bombardemang vadade hans trupper över Shannon och stormade Athlone den 30 juni. Den franske generalen markis de Saint-Ruth, som Ludvig XIV sänt med officerare och förnödenheter, tog strid vid Aughrim den 12 juli. Jakobiterna höll stånd tills Saint-Ruth dödades av en kanonkula och deras vänstra flygel gav vika. Uppskattningarna av antalet döda jakobiter varierar från 4 000 till 7 000, vilket gör Aughrim till det blodigaste slag som någonsin utkämpats på Irland. Galway kapitulerade den 21 juli.
Limerick, besieged again from late August, negotiated a surrender, and the Treaty of Limerick was signed on 3 October 1691. Its military articles let Jacobite soldiers go to France, and some 12,000 to 14,000 sailed with Sarsfield to serve Louis XIV, the “Flight of the Wild Geese”. Its civil articles promised Catholics the religious freedom they had had under Charles II and protected the estates of those who submitted. But the Protestant-controlled Irish Parliament ratified only part of them, in 1697, and passed the Penal Laws, which barred Catholics from public office and most professions and restricted their right to own land for much of the 18th century.: Limerick, som åter belägrades från slutet av augusti, förhandlade om kapitulation, och fördraget i Limerick undertecknades den 3 oktober 1691. Dess militära artiklar lät jakobitiska soldater dra till Frankrike, och omkring 12 000 till 14 000 seglade med Sarsfield för att tjäna Ludvig XIV, de ”vilda gässens flykt”. Dess civila artiklar utlovade katolikerna den religionsfrihet de haft under Karl II och skyddade godsen för dem som underkastade sig. Men det protestantiskt kontrollerade irländska parlamentet ratificerade bara en del av dem, 1697, och antog strafflagarna (Penal Laws), som utestängde katoliker från offentliga ämbeten och de flesta yrken och begränsade deras rätt att äga jord under större delen av 1700-talet.
