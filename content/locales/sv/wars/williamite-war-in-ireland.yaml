Dates are Old Style (Julian), as used in Britain and Ireland, ten days behind the New Style used in France and the Dutch Republic. The Boyne was fought on 1 July 1690 Old Style (11 July New Style) and is commemorated on 12 July.: Datum anges enligt gamla stilen (julianska kalendern), som användes i Storbritannien och på Irland, tio dagar efter nya stilen som användes i Frankrike och Nederländska republiken. Slaget vid Boyne utkämpades den 1 juli 1690 g.s. (11 juli n.s.) och högtidlighålls den 12 juli.
The war in Ireland was part of the Nine Years’ War between France and the Grand Alliance. For the rising in Scotland, see the Jacobite rising of 1689.: Kriget på Irland var en del av Pfalziska tronföljdskriget mellan Frankrike och stora alliansen. Om resningen i Skottland, se Jakobitupproret 1689.
