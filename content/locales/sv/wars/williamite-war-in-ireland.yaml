Williamite War in Ireland: Vilhelmskriget på Irland
The war that followed the Glorious Revolution of 1688, when William of Orange landed in England and James II fled to France. Backed by France, James held Ireland until William’s victory at the Boyne in 1690 and Ginkel’s at Aughrim in 1691. The Treaty of Limerick sent the Jacobite army to France and opened a century of Protestant Ascendancy in Ireland.: Kriget som följde på ärorika revolutionen 1688, när Vilhelm av Oranien landsteg i England och Jakob II flydde till Frankrike. Med franskt stöd höll Jakob Irland fram till Vilhelms seger vid Boyne 1690 och Ginkels vid Aughrim 1691. Fördraget i Limerick sände den jakobitiska armén till Frankrike och inledde ett sekel av protestantisk överhöghet (Protestant Ascendancy) på Irland.
