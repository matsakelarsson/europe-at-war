James landed at Kinsale on 12 March 1689 with French officers, money and arms, and the Irish Parliament he called to Dublin restored land confiscated from Catholics. From April his army besieged Derry. Crowded with Protestant refugees, the city held out for 105 days through famine and disease until on 28 July the ship Mountjoy broke the boom across the River Foyle and brought food; the siege was lifted on 1 August. On 31 July men from Enniskillen had beaten a Jacobite force at Newtownbutler. In August the Duke of Schomberg landed with a Williamite army, but disease ravaged it in camp near Dundalk.: Jakob landsteg i Kinsale den 12 mars 1689 med franska officerare, pengar och vapen, och det irländska parlament som han sammankallade i Dublin återställde jord som konfiskerats från katoliker. Från april belägrade hans armé Derry. Staden, fylld av protestantiska flyktingar, höll ut i 105 dagar genom hungersnöd och sjukdom tills fartyget Mountjoy den 28 juli bröt igenom bommen över floden Foyle och förde in mat; belägringen hävdes den 1 augusti. Den 31 juli hade män från Enniskillen slagit en jakobitisk styrka vid Newtownbutler. I augusti landsteg hertigen av Schomberg med en vilhelmitisk armé, men sjukdomar härjade i dess läger nära Dundalk.
William came himself, landing at Carrickfergus on 14 June 1690 with an army of English, Dutch, Danish, German and Huguenot troops, some 36,000 men. On 1 July he forced the crossing of the Boyne near Drogheda against James’s smaller Irish and French army. Schomberg was killed, but the Jacobites retreated in good order, and James fled to France. William entered Dublin, but in August his siege of Limerick failed after Patrick Sarsfield’s cavalry destroyed his siege train at Ballyneety. In the autumn John Churchill, now Earl of Marlborough, took Cork and Kinsale.: Vilhelm kom själv och landsteg i Carrickfergus den 14 juni 1690 med en armé av engelska, nederländska, danska, tyska och hugenottiska trupper, omkring 36 000 man. Den 1 juli forcerade han övergången över Boyne nära Drogheda mot Jakobs mindre irländska och franska armé. Schomberg stupade, men jakobiterna drog sig tillbaka i god ordning, och Jakob flydde till Frankrike. Vilhelm tågade in i Dublin, men i augusti misslyckades hans belägring av Limerick sedan Patrick Sarsfields kavalleri förstört hans belägringsartilleri vid Ballyneety. På hösten intog John Churchill, nu earl av Marlborough, Cork och Kinsale.
