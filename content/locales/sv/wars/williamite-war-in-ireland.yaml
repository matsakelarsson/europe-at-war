James II, a Catholic, had alarmed his Protestant subjects by appointing Catholics to the army and government and suspending the laws against them. The birth of his son on 10 June 1688 promised a Catholic dynasty, and on 30 June seven English politicians invited William of Orange, stadtholder of the Dutch Republic and husband of James’s Protestant daughter Mary, to intervene. William, expecting war with France, wanted England on his side. He sailed with a fleet of over 400 ships and about 15,000 soldiers and landed at Brixham in Torbay on 5 November 1688.: Jakob II, som var katolik, hade oroat sina protestantiska undersåtar genom att utnämna katoliker i armén och regeringen och upphäva lagarna mot dem. Födelsen av hans son den 10 juni 1688 utlovade en katolsk dynasti, och den 30 juni inbjöd sju engelska politiker Vilhelm av Oranien, ståthållare i Nederländska republiken och gift med Jakobs protestantiska dotter Maria, att ingripa. Vilhelm, som väntade krig med Frankrike, ville ha England på sin sida. Han seglade med en flotta på över 400 fartyg och omkring 15 000 soldater och landsteg i Brixham i Torbay den 5 november 1688.
James’s army, larger on paper, melted away as officers such as John Churchill went over to William, and after a skirmish at Reading on 9 December James tried to flee. Fishermen caught him near Faversham, but William let him escape, and he reached France on 25 December. A Convention declared that James had abandoned the throne and on 13 February 1689 offered the crown to William and Mary jointly, with a Declaration of Rights; Scotland followed in April. In Ireland, however, the Lord Deputy, the Earl of Tyrconnell, held the country for James, and only Protestant towns in Ulster, led by Derry, defied him.: Jakobs armé, större på papperet, smälte bort när officerare som John Churchill gick över till Vilhelm, och efter en skärmytsling vid Reading den 9 december försökte Jakob fly. Fiskare grep honom nära Faversham, men Vilhelm lät honom komma undan, och han nådde Frankrike den 25 december. En konvent förklarade att Jakob hade övergett tronen och erbjöd den 13 februari 1689 kronan åt Vilhelm och Maria gemensamt, tillsammans med en rättighetsförklaring; Skottland följde efter i april. På Irland höll dock lordställföreträdaren, earlen av Tyrconnell, landet åt Jakob, och endast protestantiska städer i Ulster, med Derry i spetsen, trotsade honom.
