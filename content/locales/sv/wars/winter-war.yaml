Places are named in Finnish as they were then. Viipuri is now Vyborg, Terijoki is Zelenogorsk, Koivisto is Primorsk and Käkisalmi is Priozersk, all in Russia.: Orter anges med sina etablerade svenska namn och i övrigt med de finska namn de hade då. Viborg (Viipuri) heter i dag Vyborg, Terijoki Zelenogorsk, Björkö (Koivisto) Primorsk och Kexholm (Käkisalmi) Priozersk, alla i Ryssland.
Losses are estimates. Finnish dead and missing numbered about 26,000; Soviet figures range from about 127,000 to 168,000 dead and missing.: Förlusterna är uppskattningar. De finska döda och saknade uppgick till omkring 26 000; de sovjetiska siffrorna varierar från omkring 127 000 till 168 000 döda och saknade.
Front lines and the area ceded around Salla are approximate.: Frontlinjerna och det avträdda området kring Salla är ungefärliga.
Under the secret protocol of the Molotov–Ribbentrop Pact, Finland fell in the Soviet sphere. In October 1939 Stalin demanded that Finland move its border on the Karelian Isthmus back from Leningrad, cede islands in the Gulf of Finland and its part of the Rybachy peninsula, and lease the Hanko peninsula as a naval base, offering larger but remote lands in East Karelia in return. Finland offered smaller concessions and refused Hanko. On 26 November the Soviet Union claimed that Finnish artillery had shelled its troops at the border village of Mainila. Finnish border posts reported that the shots came from the Soviet side, and most historians regard the incident as staged.: Enligt det hemliga tilläggsprotokollet till Molotov–Ribbentrop-pakten hamnade Finland i den sovjetiska intressesfären. I oktober 1939 krävde Stalin att Finland skulle flytta sin gräns på Karelska näset bort från Leningrad, avträda öar i Finska viken och sin del av Fiskarhalvön samt arrendera ut Hangöudd som flottbas, och erbjöd i gengäld större men avlägsna områden i Östkarelen. Finland erbjöd mindre eftergifter och vägrade upplåta Hangö. Den 26 november hävdade Sovjetunionen att finländskt artilleri hade beskjutit dess trupper vid gränsbyn Mainila. Finländska gränsposter rapporterade att skotten kom från den sovjetiska sidan, och de flesta historiker betraktar incidenten som iscensatt.
On 30 November the Red Army invaded along the whole border with about 450,000 men, and Soviet aircraft bombed Helsinki, killing about 100 people. The next day a puppet “Finnish Democratic Republic” under the exiled communist Otto Wille Kuusinen was proclaimed at Terijoki, the first town the Soviets took. The League of Nations expelled the Soviet Union on 14 December. Finland did not collapse, as Moscow had expected. The government was widened, Mannerheim took command, and the army fell back on the Isthmus to its main defences, while smaller forces met the Soviet columns in the northern forests.: Den 30 november invaderade Röda armén längs hela gränsen med omkring 450 000 man, och sovjetiska flygplan bombade Helsingfors och dödade omkring 100 människor. Dagen därpå utropades en marionettregering, ”Finska demokratiska republiken”, under den landsflyktige kommunisten Otto Wille Kuusinen i Terijoki, den första stad som sovjeterna intog. Nationernas förbund uteslöt Sovjetunionen den 14 december. Finland bröt inte samman, som Moskva hade väntat sig. Regeringen breddades, Mannerheim tog befälet, och armén drog sig tillbaka på näset till sina huvudsakliga försvarslinjer, medan mindre styrkor mötte de sovjetiska kolonnerna i de nordliga skogarna.
