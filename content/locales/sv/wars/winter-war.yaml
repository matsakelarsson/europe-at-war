Under the Moscow Peace Finland ceded the Karelian Isthmus with Viipuri, the northern shores of Lake Ladoga with Sortavala and Käkisalmi, the area around Salla and part of Kuusamo in the north, its part of the Rybachy peninsula and islands in the Gulf of Finland. It also leased Hanko to the Soviet Union for 30 years as a naval base. The ceded lands were about a tenth of Finland’s territory and held much of its industry. Rather than live under Soviet rule, almost all their inhabitants, more than 400,000 people, moved to the rest of Finland, many of them already evacuated during the fighting.: Genom Moskvafreden avträdde Finland Karelska näset med Viborg, Ladogas norra stränder med Sortavala och Kexholm, området kring Salla och en del av Kuusamo i norr, sin del av Fiskarhalvön och öar i Finska viken. Det arrenderade också ut Hangö till Sovjetunionen på 30 år som flottbas. De avträdda områdena utgjorde omkring en tiondel av Finlands territorium och rymde en stor del av dess industri. Hellre än att leva under sovjetiskt styre flyttade nästan alla deras invånare, mer än 400 000 människor, till övriga Finland, många av dem redan evakuerade under striderna.
Finland had kept its independence and avoided occupation, but at a heavy cost. About 26,000 Finns were dead or missing, and Soviet losses were several times higher, by different counts from about 127,000 to 168,000 dead or missing. The Red Army’s poor showing strengthened Hitler’s belief that it could be quickly beaten, while in Moscow it led to reforms. In Finland the loss, the resettlement of the Karelians and continued Soviet pressure pushed the government towards Germany, and in June 1941 Finland joined the German war against the Soviet Union.: Finland hade bevarat sin självständighet och undgått ockupation, men till ett högt pris. Omkring 26 000 finländare var döda eller saknade, och de sovjetiska förlusterna var flera gånger större, enligt olika beräkningar från omkring 127 000 till 168 000 döda eller saknade. Röda arméns svaga insats stärkte Hitlers tro på att den snabbt kunde besegras, medan den i Moskva ledde till reformer. I Finland drev förlusten, karelarnas omflyttning och det fortsatta sovjetiska trycket regeringen mot Tyskland, och i juni 1941 anslöt sig Finland till det tyska kriget mot Sovjetunionen.
