Winter War: Vinterkriget
A war in which the Soviet Union invaded Finland after Finland refused to cede territory near Leningrad and lease a naval base. The Finnish army held out for three and a half months against a much larger Red Army, but in the Moscow Peace of March 1940 Finland ceded about a tenth of its territory, including Viipuri, and more than 400,000 Karelians lost their homes.: Ett krig där Sovjetunionen invaderade Finland sedan Finland vägrat avträda territorium nära Leningrad och arrendera ut en flottbas. Den finska armén höll stånd i tre och en halv månad mot en mycket större Röda armé, men i Moskvafreden i mars 1940 avträdde Finland omkring en tiondel av sitt territorium, däribland Viborg, och mer än 400 000 karelare förlorade sina hem.
