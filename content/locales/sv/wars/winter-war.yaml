In the wilderness along the eastern border, from Lake Ladoga to Lapland, Soviet divisions trained for open country advanced along the few roads in long columns. The Finns, on skis and at home in the forest, cut them into isolated pockets they called motti, after the word for a stacked cubic metre of firewood, and destroyed them piece by piece in temperatures that fell below –40 °C. On 12 December a much smaller Finnish force under Paavo Talvela beat two Soviet divisions at Tolvajärvi, the first Finnish victory, and on the Kollaa river the Finns held their line throughout the war.: I ödemarkerna längs den östra gränsen, från Ladoga till Lappland, ryckte sovjetiska divisioner som var utbildade för öppen terräng fram längs de få vägarna i långa kolonner. Finnarna, på skidor och hemmastadda i skogen, skar upp dem i isolerade fickor som de kallade motti, efter ordet för en travad kubikmeter ved, och förintade dem bit för bit i temperaturer som sjönk under –40 °C. Den 12 december slog en mycket mindre finsk styrka under Paavo Talvela två sovjetiska divisioner vid Tolvajärvi, den första finska segern, och vid floden Kollaa höll finnarna sin linje under hela kriget.
At Suomussalmi the Soviet 163rd Division was trying to cut Finland in half at its narrow waist and reach Oulu on the Gulf of Bothnia. Colonel Hjalmar Siilasvuo’s troops surrounded and destroyed it by the end of December, and in the first week of January they destroyed the 44th Division, sent to relieve it, along the Raate road. Thousands of Soviet soldiers were killed or froze to death, and the Finns captured tanks, guns and lorries they badly needed. In Lapland the Soviet advance on Kemijärvi was stopped at Salla and Pelkosenniemi. The victories made Finland’s fight famous abroad, and volunteers came to help, among them about 8,000 Swedes.: Vid Suomussalmi försökte sovjetiska 163:e divisionen skära Finland i två delar vid dess smala midja och nå Uleåborg vid Bottenviken. Överste Hjalmar Siilasvuos trupper omringade och förintade den före slutet av december, och under den första veckan i januari förintade de 44:e divisionen, som sänts för att undsätta den, längs Raatevägen. Tusentals sovjetiska soldater dödades eller frös ihjäl, och finnarna erövrade stridsvagnar, kanoner och lastbilar som de hade stort behov av. I Lappland hejdades den sovjetiska framryckningen mot Kemijärvi vid Salla och Pelkosenniemi. Segrarna gjorde Finlands kamp berömd utomlands, och frivilliga kom till hjälp, bland dem omkring 8 000 svenskar.
