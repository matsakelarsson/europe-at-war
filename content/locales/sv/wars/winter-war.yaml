On the Karelian Isthmus the main Soviet effort ran into the Mannerheim Line, a chain of trenches, concrete bunkers and anti-tank obstacles from the Gulf of Finland to Taipale on Lake Ladoga. It was weaker than its later fame, but in December the Red Army attacked it in poorly coordinated waves and lost heavily, at Summa and at Taipale, where Finnish artillery broke assaults across the frozen river. Soviet tanks broke through at Summa on 19 December, but without infantry following they were destroyed or turned back.: På Karelska näset stötte den sovjetiska huvudansträngningen på Mannerheimlinjen, en kedja av skyttegravar, betongbunkrar och pansarhinder från Finska viken till Taipale vid Ladoga. Den var svagare än dess senare ryktbarhet gav sken av, men i december anföll Röda armén den i dåligt samordnade vågor och led svåra förluster, vid Summa och vid Taipale, där finskt artilleri bröt anfall över den frusna älven. Sovjetiska stridsvagnar bröt igenom vid Summa den 19 december, men utan infanteri som följde efter förstördes de eller drevs tillbaka.
Stalin replaced the commanders and gave the front to Semyon Timoshenko, who brought up fresh divisions, heavy artillery and tanks, until by February about 460,000 Soviet soldiers faced the Finns on the Isthmus. The new offensive opened on 1 February with days of bombardment, and on 11 February the Red Army broke through at Lähde near Summa. The exhausted Finnish troops fell back to an intermediate line and then, by the end of the month, to a rear line covering Viipuri. They were short of shells and reserves, and the help discussed in Britain and France had not come.: Stalin bytte ut befälhavarna och gav fronten åt Semjon Timosjenko, som förde fram nya divisioner, tungt artilleri och stridsvagnar, tills omkring 460 000 sovjetiska soldater i februari stod mot finnarna på näset. Den nya offensiven inleddes den 1 februari med dagar av bombardemang, och den 11 februari bröt Röda armén igenom vid Lähde nära Summa. De utmattade finska trupperna drog sig tillbaka till en mellanställning och sedan, i slutet av månaden, till en bakre ställning som täckte Viborg. De hade brist på granater och reserver, och den hjälp som diskuterats i Storbritannien och Frankrike hade inte kommit.
