By the end of February the Finns held a last line from Viipuri to the Vuoksi river and Taipale. The Red Army attacked Viipuri from the south and in early March sent troops across the frozen Bay of Viipuri, from the Koivisto islands the Finns had given up, to land on the western shore behind the city. Finnish coastal troops and hastily gathered units fought them on the ice and in the shore villages, while Viipuri itself, bombed almost to ruins, held out. Further east Soviet troops crossed the Vuoksi at Vuosalmi, and the defence was close to breaking.: I slutet av februari höll finnarna en sista linje från Viborg till Vuoksen och Taipale. Röda armén anföll Viborg söderifrån och sände i början av mars trupper över den frusna Viborgska viken, från Björköarna som finnarna hade övergett, för att landstiga på västra stranden bakom staden. Finska kusttrupper och hastigt hopsamlade förband bekämpade dem på isen och i strandbyarna, medan Viborg självt, bombat nästan till ruiner, höll ut. Längre österut gick sovjetiska trupper över Vuoksen vid Vuosalmi, och försvaret var nära att brytas.
At the end of January Moscow had let it be known, through Sweden, that it would negotiate with the Finnish government after all. Britain and France offered an expedition, but it would have had to cross Norway and Sweden, which refused transit, and the Finnish government judged it too small and too late. A delegation under Prime Minister Risto Ryti travelled to Moscow and accepted terms harsher than those Finland had refused in the autumn. The peace was signed late on 12 March, and the fighting ended the next day, with Viipuri still in Finnish hands.: I slutet av januari hade Moskva via Sverige låtit förstå att man trots allt var beredd att förhandla med den finländska regeringen. Storbritannien och Frankrike erbjöd en expedition, men den skulle ha behövt passera Norge och Sverige, som vägrade transitering, och den finländska regeringen bedömde den som för liten och för sen. En delegation under statsminister Risto Ryti reste till Moskva och godtog villkor som var hårdare än dem Finland hade avvisat på hösten. Freden undertecknades sent den 12 mars, och striderna upphörde dagen därpå, med Viborg fortfarande i finländska händer.
