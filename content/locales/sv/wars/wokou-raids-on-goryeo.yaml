# Svenska översättningar av katalogtexten (våg 10); stegtexterna kommer senare.
Wokou raids on Goryeo: Wokouräderna mot Goryeo
? Four decades of raids on Goryeo by the wokou, bands of raiders and smugglers who came mostly from Tsushima, Iki and northern Kyushu at a time when Japan was divided by the civil war between its Northern and Southern Courts; Koreans and Chinese also joined such bands. From the second month of 1350 the raids came almost every year, first on the southern coasts and then up the west coast to the approaches to Kaegyong, seizing the tax grain that Goryeo shipped by sea and carrying off people. The Goryeosa records more than a hundred raids under King Gongmin and 378 under King U (1374–1388), and coastal districts were abandoned. Goryeo rebuilt its navy and, on the advice of Choe Mu-seon, began making gunpowder and cannon in 1377. In 1380 its fleet burned some 500 wokou ships at Jinpo at the mouth of the Geum River, and the stranded raiders, after plundering inland, were destroyed by Yi Seong-gye at Hwangsan. After a further naval victory at Gwaneumpo in 1383 and a raid on Tsushima in 1389 the attacks declined, and Yi Seong-gye’s fame from these wars helped him found the Joseon dynasty in 1392.
: Fyra decennier av räder mot Goryeo av wokou, band av plundrare och smugglare som mest kom från Tsushima, Iki och norra Kyushu vid en tid då Japan var splittrat av inbördeskriget mellan Norra och Södra hovet; även koreaner och kineser anslöt sig till sådana band. Från andra månaden 1350 kom räderna nästan varje år, först mot sydkusterna och sedan uppför västkusten till farlederna in mot Kaegyong, och plundrarna beslagtog den skattespannmål som Goryeo skeppade sjövägen och förde bort människor. Krönikan Goryeosa uppger mer än hundra räder under kung Gongmin och 378 under kung U (1374–1388), och kustdistrikt övergavs. Goryeo byggde upp sin flotta igen och började på Choe Mu-seons inrådan tillverka krut och kanoner 1377. År 1380 brände dess flotta omkring 500 wokoufartyg vid Jinpo vid Geumflodens mynning, och de strandsatta plundrarna förintades, sedan de plundrat inåt land, av Yi Seong-gye vid Hwangsan. Efter ytterligare en seger till sjöss vid Gwaneumpo 1383 och en räd mot Tsushima 1389 avtog angreppen, och den berömmelse som Yi Seong-gye vunnit i dessa krig hjälpte honom att grunda Joseondynastin 1392.
