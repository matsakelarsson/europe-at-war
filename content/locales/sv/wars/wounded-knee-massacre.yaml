# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
The Ghost Dance and Wounded Knee: Andedansen och Wounded Knee
? The army’s campaign of 1890–1891 on the Lakota reservations of South Dakota against the Ghost Dance movement, in which Sitting Bull was killed and the 7th Cavalry killed between about 250 and 300 Lakota at Wounded Knee Creek. In 1889 the Great Sioux Reservation was broken up into six smaller reservations and about nine million acres of it opened to settlers; rations were cut, crops failed in drought, and disease spread. The Lakota learned of the Ghost Dance taught by Wovoka, a Northern Paiute prophet in Nevada, who promised that through the dance and right living the dead would return and the old world be restored, and by the autumn of 1890 thousands danced on Pine Ridge, Rosebud, Cheyenne River and Standing Rock. Alarmed agents called for troops, and in November 1890 General Nelson Miles sent thousands of soldiers onto the reservations; Ghost Dancers under Short Bull and Kicking Bear withdrew to the Stronghold in the Badlands. On 15 December Lakota police sent to arrest Sitting Bull at his home on the Grand River killed him in a fight with his followers. Spotted Elk (Big Foot) led his Miniconjou band, with Hunkpapa refugees, towards Pine Ridge; on 28 December the 7th Cavalry intercepted them and camped them on Wounded Knee Creek, and on the morning of 29 December, as the soldiers disarmed the men, a shot was fired and the troops and their Hotchkiss guns opened fire on the camp, killing men, women and children, many as they fled; 25 soldiers also died. The last Ghost Dance bands surrendered at Pine Ridge on 15 January 1891. Wounded Knee is often counted as the end of the wars between the United States and the Native nations of the plains.
: Arméns fälttåg 1890–1891 på lakotafolkets reservat i South Dakota mot andedansrörelsen, under vilket Sitting Bull dödades och 7:e kavalleriregementet dödade mellan omkring 250 och 300 lakota vid Wounded Knee Creek. År 1889 delades Stora siouxreservatet upp i sex mindre reservat, och omkring nio miljoner acres av det öppnades för nybyggare; ransonerna skars ned, skördarna slog fel i torkan och sjukdomar spred sig. Lakota fick höra talas om den andedans som lärdes ut av Wovoka, en profet ur nordpaiuterna i Nevada, som lovade att de döda genom dansen och ett rättfärdigt leverne skulle återvända och den gamla världen återupprättas, och hösten 1890 dansade tusentals på Pine Ridge, Rosebud, Cheyenne River och Standing Rock. Oroade agenter begärde trupper, och i november 1890 sände general Nelson Miles tusentals soldater in på reservaten; andedansare under Short Bull och Kicking Bear drog sig tillbaka till fästet Stronghold i Badlands. Den 15 december dödade lakotapoliser som sänts för att gripa Sitting Bull i hans hem vid Grand River honom i en strid med hans anhängare. Spotted Elk (Big Foot) ledde sin miniconjougrupp, med hunkpapaflyktingar, mot Pine Ridge; den 28 december genskjöt 7:e kavalleriregementet dem och lät dem slå läger vid Wounded Knee Creek, och på morgonen den 29 december, när soldaterna avväpnade männen, avlossades ett skott, och trupperna och deras Hotchkisskanoner öppnade eld mot lägret och dödade män, kvinnor och barn, många medan de flydde; 25 soldater dog också. De sista andedansgrupperna gav upp vid Pine Ridge den 15 januari 1891. Wounded Knee räknas ofta som slutet på krigen mellan USA och präriens ursprungsamerikanska nationer.
