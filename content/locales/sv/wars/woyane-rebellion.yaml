# Svenska översättningar av katalogtexten (våg 12); stegtexterna kommer senare.
Woyane rebellion: Woyaneupproret
? A rising in Tigray against the restored government of Emperor Haile Selassie in 1943. After the Italian defeat in 1941 the emperor’s government centralised power, sent Shewan officials into the provinces and raised new taxes, while the countryside was full of weapons left from the war and unrest among the Raya and Azebo and other groups. In May 1943 peasants and local nobles in eastern Tigray rose under the name woyane (Tigrinya, roughly “revolt” or “popular movement”), led by Fitawrari Yeebio Woldai, Dejazmach Negusse Bezabih and Blatta Haile Mariam Redda. Their aims, as the sources give them, were self-administration within Ethiopia, Tigrayan customary law and lower taxes, not separation. They defeated government forces at Quiha and Ara and took Mekelle, but the government, under Ras Abebe Aregai, gathered a larger army, and in early October British Blenheim bombers from Aden struck Mekelle, Hintalo and Corbetta, killing about 70 people by one account. The rebels were beaten in fighting around Amba Alagi, Alaje, Wukro and the Tembien and the rising was crushed by November. Abebe Aregai’s repression, with killings, land confiscations and heavy taxes, was long remembered in Tigray; the nobles were mostly pardoned within a few years, but Haile Mariam Redda spent 22 years in prison. The Tigray People’s Liberation Front later called its own struggle the second woyane.
: En resning i Tigray mot kejsar Haile Selassies återinsatta regering 1943. Efter det italienska nederlaget 1941 centraliserade kejsarens regering makten, sände ämbetsmän från Shewa ut i provinserna och tog ut nya skatter, samtidigt som landsbygden var full av vapen från kriget och det rådde oro bland raya och azebo och andra grupper. I maj 1943 reste sig bönder och lokala adelsmän i östra Tigray under namnet woyane (tigrinja, ungefär ”revolt” eller ”folkrörelse”), ledda av fitawrari Yeebio Woldai, dejazmach Negusse Bezabih och blatta Haile Mariam Redda. Deras mål, så som källorna anger dem, var självstyre inom Etiopien, tigrayansk sedvanerätt och lägre skatter, inte utbrytning. De besegrade regeringsstyrkor vid Quiha och Ara och intog Mekelle, men regeringen samlade under ras Abebe Aregai en större armé, och i början av oktober anföll brittiska Blenheimbombplan från Aden Mekelle, Hintalo och Corbetta och dödade enligt en uppgift omkring 70 människor. Rebellerna besegrades i strider kring Amba Alagi, Alaje, Wukro och Tembien, och i november var resningen krossad. Abebe Aregais förtryck, med dödande, jordkonfiskationer och tunga skatter, levde länge kvar i minnet i Tigray; adelsmännen benådades för det mesta inom några år, men Haile Mariam Redda satt 22 år i fängelse. Tigrayfolkets befrielsefront kallade senare sin egen kamp för den andra woyane.
