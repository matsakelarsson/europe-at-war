# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
Wushe incident: Wusheincidenten
? An uprising of Seediq people against Japanese rule at Wushe (Musha), a police and administrative centre in the mountains of central Taiwan, today in Ren’ai Township, Nantou County. Forced labour, police abuses and contempt for Seediq customs had built up resentment, and after a quarrel at a wedding feast in which a Japanese policeman was struck, the Tgdaya chief Mona Rudao led more than 300 warriors in attacks on police posts on 27 October 1930 and then on the elementary school where Japanese residents had gathered for a sports meet. About 134 Japanese were killed, and two Han Taiwanese by mistake. The colonial government sent about 2,000 troops and police with artillery and aircraft, which dropped bombs and, by many accounts, poison gas, which some describe as the first use of chemical weapons in Asia; it also set rival Seediq groups, notably the Toda, against the rebels. Mona Rudao shot himself in a cave in late November, and his son Tado Mona and the last fighters killed themselves on 8 December. Of the rising villages’ people, about 644 died, many of them by suicide. On 25 April 1931 Toda men, encouraged by the Japanese, attacked the shelters of the survivors and killed about 200 more (the second Wushe incident), and in May the 298 who remained were moved to Kawanakajima, today Qingliu. The governor-general resigned in January 1931. The incident is remembered in Taiwan as an act of resistance and was the subject of the film Seediq Bale (2011).
: Ett uppror bland seediqfolket mot det japanska styret i Wushe (Musha), ett polis- och förvaltningscentrum i bergen i centrala Taiwan, i dag i Ren’ai i Nantou härad. Tvångsarbete, polisövergrepp och förakt för seediqfolkets seder hade byggt upp en förbittring, och efter ett gräl vid en bröllopsfest där en japansk polis blev slagen ledde Tgdayahövdingen Mona Rudao den 27 oktober 1930 mer än 300 krigare i anfall mot polisposter och sedan mot den grundskola där japanska invånare hade samlats för en idrottsdag. Omkring 134 japaner dödades, och två hantaiwaneser av misstag. Kolonialregeringen sände omkring 2 000 soldater och poliser med artilleri och flygplan, som fällde bomber och, enligt många uppgifter, giftgas, vilket somliga beskriver som den första användningen av kemiska vapen i Asien; den ställde också rivaliserande seediqgrupper, särskilt toda, mot rebellerna. Mona Rudao sköt sig själv i en grotta i slutet av november, och hans son Tado Mona och de sista krigarna tog sina liv den 8 december. Av invånarna i de byar som hade rest sig dog omkring 644, många av dem genom självmord. Den 25 april 1931 angrep todamän, uppmuntrade av japanerna, de förläggningar där de överlevande hölls och dödade ytterligare omkring 200 (den andra Wusheincidenten), och i maj flyttades de 298 som återstod till Kawanakajima, dagens Qingliu. Generalguvernören avgick i januari 1931. Incidenten minns i Taiwan som en motståndshandling och skildrades i filmen Seediq Bale (2011).
