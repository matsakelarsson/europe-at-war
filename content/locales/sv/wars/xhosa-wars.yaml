# Svenska översättningar av katalogtexten (våg 13); stegtexterna kommer senare.
Xhosa Wars (Cape Frontier Wars): Xhosakrigen (Kapkolonins gränskrig)
? A century of intermittent war on the eastern frontier of the Cape Colony, between the Xhosa chiefdoms and the Dutch and then British colonial state, in which the Xhosa lost their independence and most of their land west of the Mbhashe. Nine wars are usually counted. In the first three (1779–1803) Boer commandos and Xhosa chiefdoms fought over the grazing of the Zuurveld, between the Bushmans and Great Fish rivers, and in 1799 Khoikhoi servants rose and joined the Xhosa. In 1811–1812 British troops drove the Xhosa of the Zuurveld across the Fish. In 1819 the prophet Makhanda led an attack on Grahamstown, and after its defeat the colony took the land up to the Keiskamma. The wars of 1834–1836 (in which the Gcaleka king Hintsa was killed while in British custody), 1846–1847 (the War of the Axe) and 1850–1853 (Mlanjeni’s War, with a rising of Khoikhoi in the Kat River settlement) ended with the land between the Keiskamma and the Kei annexed as British Kaffraria and the Ngqika driven from the Amatola mountains. In 1856–1857, after years of defeat, drought and cattle disease, the Xhosa followed the prophecies of Nongqawuse and killed their cattle; some 40,000 people died of hunger and the colony took much of their remaining land. The last war, in 1877–1878, brought Gcalekaland under colonial rule, and the Cape took over the rest of the Transkei by 1894.
: Ett sekel av återkommande krig vid Kapkolonins östra gräns mellan xhosahövdingadömena och den holländska och sedan brittiska kolonialstaten, där xhosa förlorade sin självständighet och större delen av sin mark väster om Mbhashe. Vanligen räknas nio krig. I de tre första (1779–1803) stred boerkommandon och xhosahövdingadömen om betesmarkerna i Zuurveld, mellan floderna Bushmans och Great Fish, och 1799 reste sig khoikhoiska tjänare och anslöt sig till xhosa. 1811–1812 drev brittiska trupper xhosa i Zuurveld över Fish. 1819 ledde profeten Makhanda ett anfall mot Grahamstown, och sedan anfallet slagits tillbaka tog kolonin marken ända fram till Keiskamma. Krigen 1834–1836 (då gcalekakungen Hintsa dödades i brittiskt förvar), 1846–1847 (yxkriget) och 1850–1853 (Mlanjenis krig, med en resning bland khoikhoi i bosättningen vid Kat River) slutade med att marken mellan Keiskamma och Kei annekterades som Brittiska Kaffraria och att ngqika drevs bort från Amatolabergen. 1856–1857, efter år av nederlag, torka och boskapssjukdom, följde xhosa Nongqawuses profetior och dödade sin boskap; omkring 40 000 människor dog av svält, och kolonin tog stora delar av deras återstående mark. Det sista kriget, 1877–1878, förde Gcalekaland under kolonialt styre, och 1894 hade Kapkolonin tagit över resten av Transkei.
