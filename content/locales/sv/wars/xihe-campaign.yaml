# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
Xihe campaign: Xihefälttåget
? The campaign in which the Song general Wang Shao conquered the Tibetan lands of the upper Tao and Huang rivers in today’s southern Gansu, west of the Song frontier. Under the reforming emperor Shenzong and his minister Wang Anshi, the Song wanted to break out of the passive defence of the previous reigns and outflank the Western Xia from the south-west. Wang Shao had proposed winning over or conquering the Tibetan tribes between the two powers, whose leader Mucheng, grandson of the Tsongkha king Gusiluo, held Hezhou and had sided with the Tanguts. In 1072 Wang Shao took Wushengjun, renamed Xizhou (today’s Lintao), and the new Xihe circuit was set up. He then took Hezhou (Linxia), in 1072 or 1073 according to different accounts, where 7,000 Tibetans were killed, 12,000 taken prisoner and more than 20,000 tents destroyed, and in 1073 went on to take Taozhou, Minzhou, Diezhou and Dangzhou, adding some 2,000 li of land to the empire. Mucheng escaped, and in 1074 he and the Tsongkha king Dongzhan submitted to the Song. The new circuit gave the Song a base for the war with the Xia in 1081 and for the later conquest of Tsongkha, but its Tibetan tribes stayed restless.
: Det fälttåg under vilket Songfältherren Wang Shao erövrade de tibetanska områdena vid de övre delarna av floderna Tao och Huang i dagens södra Gansu, väster om Songrikets gräns. Under reformkejsaren Shenzong och hans minister Wang Anshi ville Song bryta med de tidigare regeringarnas passiva försvar och kringgå Västra Xia från sydväst. Wang Shao hade föreslagit att man skulle vinna över eller erövra de tibetanska stammarna mellan de två makterna, vars ledare Mucheng, sonson till Tsongkhas kung Gusiluo, behärskade Hezhou och hade ställt sig på tanguternas sida. År 1072 intog Wang Shao Wushengjun, som fick namnet Xizhou (dagens Lintao), och den nya Xihekretsen inrättades. Därefter intog han Hezhou (Linxia), enligt olika uppgifter 1072 eller 1073, där 7 000 tibetaner dödades, 12 000 togs till fånga och mer än 20 000 tält förstördes, och 1073 fortsatte han med att inta Taozhou, Minzhou, Diezhou och Dangzhou och lade därmed omkring 2 000 li land till riket. Mucheng undkom, och 1074 underkastade han och Tsongkhas kung Dongzhan sig Song. Den nya kretsen gav Song en bas för kriget mot Xia 1081 och för den senare erövringen av Tsongkha, men dess tibetanska stammar förblev oroliga.
