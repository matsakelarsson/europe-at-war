# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
Xinhai Revolution: Xinhairevolutionen
The revolution that ended the Qing dynasty and two thousand years of imperial rule in China, also called the 1911 Revolution. After a summer of protest in Sichuan against the nationalisation of the provincial railways, revolutionary soldiers of the New Army rose at Wuchang on 10 October 1911 and set up a military government for Hubei. Within two months most provinces of the south and centre had declared their independence of the Qing, often after killing or driving out the Manchu garrisons. The court recalled Yuan Shikai, whose Beiyang Army retook Hankou and Hanyang, but the revolutionaries took Nanjing in December, and on 1 January 1912 Sun Yat-sen was inaugurated there as provisional president of the Republic of China. Yuan negotiated with both sides, and on 12 February 1912 the empress dowager Longyu issued the abdication of the six-year-old Xuantong emperor, Puyi. Sun stepped down and Yuan became president of the Republic. Outer Mongolia and Tibet broke away from Chinese rule in the same months.: Den revolution som gjorde slut på Qingdynastin och tvåtusen år av kejserligt styre i Kina, även kallad 1911 års revolution. Efter en sommar av protester i Sichuan mot förstatligandet av de provinsiella järnvägarna reste sig revolutionära soldater i Nya armén i Wuchang den 10 oktober 1911 och bildade en militärregering för Hubei. Inom två månader hade de flesta provinser i söder och i mellersta Kina förklarat sig oberoende av Qingdynastin, ofta sedan de dödat eller fördrivit de manchuiska garnisonerna. Hovet kallade tillbaka Yuan Shikai, vars Beiyangarmé återtog Hankou och Hanyang, men revolutionärerna intog Nanking i december, och den 1 januari 1912 installerades Sun Yat-sen där som provisorisk president i Republiken Kina. Yuan förhandlade med båda sidor, och den 12 februari 1912 utfärdade änkekejsarinnan Longyu abdikationen för den sexårige Xuantongkejsaren, Puyi. Sun avgick och Yuan blev republikens president. Yttre Mongoliet och Tibet bröt sig loss från kinesiskt styre under samma månader.
