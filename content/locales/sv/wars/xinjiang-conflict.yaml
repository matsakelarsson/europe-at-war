# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
Xinjiang conflict: Xinjiangkonflikten
? Armed attacks, riots and uprisings by Uyghurs in Xinjiang and elsewhere in China from 1990 to 2017, and the Chinese government’s response, which grew from security campaigns into mass surveillance and the detention of hundreds of thousands, by many estimates more than a million, Uyghurs, Kazakhs and other Muslims. Grievances over Han migration, restrictions on religion and language, birth-control rules and jobs fed a movement for an independent “East Turkestan”, a small part of which turned to violence; the government treats separatism, religious extremism and terrorism as one threat. The main events were the Baren uprising (1990), the Ghulja protests and the Ürümqi bus bombings (1997), the Kashgar attack before the 2008 Olympics, the Ürümqi riots of July 2009, in which 197 people were killed, and a wave of attacks in 2013–2014, among them the killing of 31 people at Kunming railway station. The government answered with the Strike Hard campaign of 2014 and, from 2017, the internment camps, which a UN report of 2022 said may amount to crimes against humanity. No attacks in Xinjiang have been reported since February 2017; the security regime and the detentions continue.
: Väpnade angrepp, upplopp och resningar bland uigurer i Xinjiang och på andra håll i Kina från 1990 till 2017, och den kinesiska regeringens svar, som växte från säkerhetskampanjer till massövervakning och frihetsberövande av hundratusentals, enligt många uppskattningar mer än en miljon, uigurer, kazaker och andra muslimer. Missnöje med hankinesisk inflyttning, inskränkningar av religion och språk, födelsekontrollregler och arbetstillfällen gav näring åt en rörelse för ett självständigt ”Östturkestan”, av vilken en liten del tog till våld; regeringen behandlar separatism, religiös extremism och terrorism som ett och samma hot. De viktigaste händelserna var Barenupproret (1990), protesterna i Ghulja och bussbombningarna i Ürümqi (1997), angreppet i Kashgar före olympiska spelen 2008, upploppen i Ürümqi i juli 2009, då 197 människor dödades, och en våg av angrepp 2013–2014, bland dem dödandet av 31 människor på järnvägsstationen i Kunming. Regeringen svarade med kampanjen ”Slå hårt” 2014 och från 2017 med interneringslägren, som enligt en FN-rapport från 2022 kan utgöra brott mot mänskligheten. Inga angrepp i Xinjiang har rapporterats sedan februari 2017; säkerhetsregimen och frihetsberövandena fortsätter.
