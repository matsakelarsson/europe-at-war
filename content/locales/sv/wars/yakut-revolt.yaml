# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
Yakut revolt: Jakutiska upproret
? The last campaign of the Russian Civil War, fought in Yakutia and on the Okhotsk coast. In September 1921 about 200 men under the White cornet Mikhail Korobeinikov rose in the Maya district east of Yakutsk, and Yakut and Tungus (Evenk) herders angered by requisitions and arrests joined them; a small White detachment landed at Okhotsk from Vladivostok. In March 1922 Yakut intellectuals formed the Provisional Yakut Regional People’s Administration at Churapcha, and its People’s Army drove the Reds from most of Yakutia and besieged Yakutsk. Moscow answered by proclaiming the Yakut Autonomous Soviet Socialist Republic on 27 April 1922 and sending about 5,000 troops, who by September had pushed the insurgents back to Ayan and Nelkan near the Pacific. In September 1922 General Anatoly Pepelyayev landed at Ayan with about 750 volunteers of the Siberian Volunteer Druzhina, sailing from White-held Vladivostok just before it fell. He took Amga in early 1923 but failed to take the Red detachment of Ivan Strod at the Sasyl-Sysyy farmstead in an eighteen-day siege in February and March, and fell back to the coast. A Red expedition under Stepan Vostretsov sailed from Vladivostok in April, took Okhotsk in early June, and on 18 June 1923 surrounded Ayan, where Pepelyayev surrendered without a fight. Losses are estimated at about 1,000 on the Red side and 500–1,000 killed among the insurgents, with more than 1,000 captured.
: Det ryska inbördeskrigets sista fälttåg, utkämpat i Jakutien och vid Ochotskkusten. I september 1921 reste sig omkring 200 man under den vite kornetten Michail Korobejnikov i Majadistriktet öster om Jakutsk, och jakutiska och tungusiska (evenkiska) herdar som uppretats av rekvisitioner och arresteringar anslöt sig till dem; en liten vit styrka landsteg i Ochotsk från Vladivostok. I mars 1922 bildade jakutiska intellektuella Provisoriska jakutiska regionala folkförvaltningen i Tjuraptja, och dess folkarmé drev ut de röda ur större delen av Jakutien och belägrade Jakutsk. Moskva svarade med att utropa Jakutiska autonoma socialistiska sovjetrepubliken den 27 april 1922 och sända omkring 5 000 soldater, som i september hade trängt tillbaka upprorsmännen till Ajan och Nelkan nära Stilla havet. I september 1922 landsteg general Anatolij Pepeljajev i Ajan med omkring 750 frivilliga ur Sibiriska frivilligdruzjinan, sedan de seglat från det vitkontrollerade Vladivostok strax innan staden föll. Han intog Amga i början av 1923 men misslyckades med att ta Ivan Strods röda styrka vid gården Sasyl-Sysyy under en arton dagar lång belägring i februari och mars, och drog sig tillbaka till kusten. En röd expedition under Stepan Vostretsov seglade från Vladivostok i april, intog Ochotsk i början av juni och omringade den 18 juni 1923 Ajan, där Pepeljajev kapitulerade utan strid. Förlusterna uppskattas till omkring 1 000 på den röda sidan och 500–1 000 dödade bland upprorsmännen, och mer än 1 000 upprorsmän togs till fånga.
