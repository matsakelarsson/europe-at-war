# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
Yamasee War: Yamaseekriget
? A war between South Carolina and a broad alliance of the Native nations of the Southeast, led by the Yamasee and the Muscogee (Creek). Carolina’s trade in deerskins and in Native captives sold as slaves had left the Yamasee and their neighbours deep in debt to traders who abused them, enslaved their kin and let planters’ cattle onto their lands. On Good Friday, 15 April 1715, the Yamasee killed the colony’s Indian agent Thomas Nairne and the traders at Pocotaligo, and within weeks the Muscogee, Catawba, Apalachee and others had killed some 90 of the 100 traders in their towns and raided the settlements to within a few miles of Charles Town. Governor Charles Craven’s militia, with help from Virginia and North Carolina, drove the Yamasee south into Spanish Florida, and the Catawba made peace in 1715. The war turned when the Cherokee allied with Carolina and killed a delegation of Muscogee leaders at Tugaloo in January 1716; the Muscogee moved their towns west to the Chattahoochee and made peace in late 1717. About seven per cent of South Carolina’s colonists had been killed; the war hastened the end of the Native slave trade and of proprietary rule, and set the Muscogee on a course of balancing the British, French and Spanish.
: Ett krig mellan South Carolina och en bred allians av ursprungsnationer i sydöstra Nordamerika, ledd av yamasee och muscogee (creeker). Carolinas handel med hjortskinn och med ursprungsamerikanska fångar som såldes som slavar hade försatt yamasee och deras grannar i djup skuld till handelsmän som misshandlade dem, förslavade deras anhöriga och lät plantageägarnas boskap beta på deras land. På långfredagen den 15 april 1715 dödade yamasee koloniens indianagent Thomas Nairne och handelsmännen i Pocotaligo, och inom några veckor hade muscogee, catawba, apalachee med flera dödat omkring 90 av de 100 handelsmännen i sina byar och gjort räder mot bosättningarna ända till några engelska mil från Charles Town. Guvernör Charles Cravens milis drev, med hjälp från Virginia och North Carolina, yamasee söderut in i Spanska Florida, och catawba slöt fred 1715. Kriget vände när cherokeserna allierade sig med Carolina och dödade en delegation av muscogeeledare i Tugaloo i januari 1716; muscogee flyttade sina byar västerut till Chattahoochee och slöt fred i slutet av 1717. Omkring sju procent av South Carolinas kolonister hade dödats; kriget påskyndade slutet för handeln med ursprungsamerikanska slavar och för koloniens ägarstyre, och det satte muscogee på en kurs där de balanserade mellan britterna, fransmännen och spanjorerna.
Yamasee, Muscogee (Creek), Catawba and allied nations (Apalachee, Savannah River Shawnee, Waxhaw, Santee and others): Yamasee, muscogee (creeker), catawba och allierade nationer (apalachee, shawnee vid Savannah River, waxhaw, santee med flera)
