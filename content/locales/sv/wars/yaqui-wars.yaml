# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
Yaqui Wars: Yaquikrigen
? The century of wars between the Yaqui (Yoeme) people of southern Sonora and the Mexican state over the lands of the eight Yaqui towns on the lower Yaqui River. The Yaqui had defeated Spanish expeditions in 1533 and 1609–1610 before accepting Jesuit missionaries on their own terms in 1617, and had risen in 1740. After independence Mexico’s attempts to tax the Yaqui, divide their land and open it to settlers led to the revolt of Juan Banderas (1825–1833), who tried to unite the Native peoples of Sonora, and to recurring wars. From 1875 the Yaqui leader Cajeme governed the valley as a self-ruling nation until the federal army broke it in 1886–1887. Tetabiate’s guerrillas fought on in the Bacatete mountains; after the massacre at Mazocoba in 1900, Porfirio Díaz’s government deported thousands of Yaqui to the henequen plantations of Yucatán and other parts of the south, where many died. Yaqui soldiers fought in the Mexican Revolution, and the last Yaqui rising was put down in 1926–1927 with aircraft. In 1937 President Lázaro Cárdenas recognised a reduced Yaqui territory, and in 2021 the Mexican government apologised to the Yaqui people.
: Det sekel av krig mellan yaquifolket (yoeme) i södra Sonora och den mexikanska staten som gällde landområdena kring de åtta yaquibyarna vid nedre Yaquifloden. Yaquifolket hade besegrat spanska expeditioner 1533 och 1609–1610 innan de på egna villkor tog emot jesuitmissionärer 1617, och de hade gjort uppror 1740. Efter självständigheten ledde Mexikos försök att beskatta yaquifolket, stycka upp deras land och öppna det för nybyggare till upproret under Juan Banderas (1825–1833), som försökte ena Sonoras ursprungsfolk, och till återkommande krig. Från 1875 styrde yaquiledaren Cajeme dalen som en självstyrande nation tills den federala armén krossade den 1886–1887. Tetabiates gerillakrigare fortsatte striden i Bacatetebergen; efter massakern vid Mazocoba 1900 deporterade Porfirio Díaz regering tusentals yaqui till henequenplantagerna i Yucatán och andra delar av södra Mexiko, där många dog. Yaquisoldater stred i mexikanska revolutionen, och det sista yaquiupproret slogs ned 1926–1927 med flygplan. År 1937 erkände president Lázaro Cárdenas ett minskat yaquiterritorium, och 2021 bad den mexikanska regeringen yaquifolket om ursäkt.
