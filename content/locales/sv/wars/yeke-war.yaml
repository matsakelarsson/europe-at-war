# Svenska översättningar av katalogtexten (våg 13); stegtexterna kommer senare.
End of the Yeke kingdom: Yekerikets undergång
? "The Congo Free State’s seizure of Katanga and the killing of Msiri, king of the Yeke (Garanganze). Msiri, a Nyamwezi trader from the Tabora region, settled in Katanga about 1856 and built a kingdom from his capital, Bunkeya, out of lands that had paid tribute to Kazembe, trading copper, ivory and slaves east to the Swahili and Arab merchants of Zanzibar’s sphere and west to Portuguese Angola through Ovimbundu caravans. The Berlin agreements of 1884–1885 gave Katanga to Leopold II’s Free State on paper, but only effective occupation would secure it, and Cecil Rhodes’s British South Africa Company was also seeking a treaty. Msiri turned away the company’s envoy Alfred Sharpe in 1890 and gave the Free State expedition of Paul Le Marinel only a vague letter in 1891. By then his kingdom was under strain: the Sanga and other subject peoples had risen against him, and his main army was away in the south. The Compagnie du Katanga, one of Leopold’s companies, sent an expedition under the Canadian-born British officer William Stairs, with about 400 Africans hired mostly in Zanzibar, which reached Bunkeya on 14 December 1891 with orders to take Katanga with or without Msiri’s agreement. Msiri received Stairs on 17 December but refused to accept the Free State flag, and left for the fortified village of Munema. On 20 December 1891 Stairs’s second-in-command, the Belgian captain Omer Bodson, went into Munema to arrest him; in the confrontation Bodson shot Msiri dead and was mortally wounded by Msiri’s son Masuka. The expedition’s askaris looted Munema and killed many of its people, Msiri’s head was cut off and displayed, according to the expedition’s Marquis de Bonchamps, and the people of Bunkeya, which may have had 60,000–80,000 inhabitants, scattered amid famine. Stairs recognised Msiri’s adopted son Mukanda-Bantu as chief of a reduced territory and restored the Sanga chiefs Msiri had overthrown, and by early January 1892 he had the treaties that secured Katanga for the Free State; the Anglo-Belgian agreement of 1894 fixed the border on the Luapula. Of the expedition’s 400 Africans, 189 returned to Zanzibar, most of the others having died of disease and hunger, and Stairs died of malaria on the Zambezi on 9 June 1892 (3 June in some accounts)."
: "Kongostatens maktövertagande i Katanga och dödandet av Msiri, kung över yeke (Garanganze). Msiri, en nyamwezihandelsman från trakten av Tabora, slog sig ned i Katanga omkring 1856 och byggde från sin huvudstad Bunkeya upp ett kungarike av landområden som tidigare hade betalat tribut till Kazembe; han handlade med koppar, elfenben och slavar, österut med de swahiliska och arabiska köpmännen i Zanzibars intressesfär och västerut med Portugisiska Angola genom ovimbundukaravaner. Berlinöverenskommelserna 1884–1885 gav på papperet Katanga till Leopold II:s Kongostat, men endast en faktisk ockupation kunde säkra området, och Cecil Rhodes bolag British South Africa Company sökte också ett fördrag. Msiri avvisade bolagets sändebud Alfred Sharpe 1890 och gav Kongostatens expedition under Paul Le Marinel bara ett vagt hållet brev 1891. Då var hans rike redan hårt ansträngt: sanga och andra underlydande folk hade rest sig mot honom, och hans huvudarmé befann sig långt borta i söder. Compagnie du Katanga, ett av Leopolds bolag, sände en expedition under den kanadafödde brittiske officeren William Stairs, med omkring 400 afrikaner som mestadels hade anställts på Zanzibar; den nådde Bunkeya den 14 december 1891 med order att ta Katanga med eller utan Msiris samtycke. Msiri tog emot Stairs den 17 december men vägrade att godta Kongostatens flagga och begav sig till den befästa byn Munema. Den 20 december 1891 gick Stairs närmaste man, den belgiske kaptenen Omer Bodson, in i Munema för att gripa honom; i konfrontationen sköt Bodson ihjäl Msiri och sårades själv dödligt av Msiris son Masuka. Expeditionens askarier plundrade Munema och dödade många av invånarna, Msiris huvud höggs av och ställdes ut enligt markis de Bonchamps, som deltog i expeditionen, och befolkningen i Bunkeya, som kan ha haft 60 000–80 000 invånare, skingrades under hungersnöd. Stairs erkände Msiris adoptivson Mukanda-Bantu som hövding över ett krympt område och återinsatte de sangahövdingar som Msiri hade störtat, och i början av januari 1892 hade han fått de fördrag som säkrade Katanga åt Kongostaten; det brittisk-belgiska avtalet 1894 fastställde gränsen vid Luapula. Av expeditionens 400 afrikaner återvände 189 till Zanzibar; de flesta av de övriga hade dött av sjukdom och hunger. Stairs dog i malaria vid Zambezi den 9 juni 1892 (den 3 juni enligt vissa framställningar)."
