# Svenska översättningar av katalogtexten (våg 7); stegtexterna kommer senare.
Yemeni Civil War (1994): Jemenitiska inbördeskriget (1994)
A short war between the armies of the former North and South Yemen, four years after the two states united in May 1990. The union had kept the two armies separate, and its leaders, President Ali Abdullah Saleh of the north and Vice-President Ali Salim al-Beidh of the south, fell out over the sharing of power and oil revenue and over a string of assassinations of southern Yemeni Socialist Party officials. After al-Beidh withdrew to Aden in 1993, a reconciliation accord signed in Amman in February 1994 failed, and full war broke out on 4 May. On 21 May al-Beidh proclaimed a Democratic Republic of Yemen in the south, which no state recognised. The larger northern forces, joined by Islamist volunteers and southerners who had fled after the South’s own civil war of 1986, besieged Aden and took it on 7 July, while the southern leaders fled abroad. Estimates of the dead range from under 1,000, the government’s figure, to about 10,000. The south’s grievances after the war later fed a secessionist movement.: Ett kort krig mellan arméerna från det forna Nord- och Sydjemen, fyra år efter att de två staterna hade enats i maj 1990. Unionen hade hållit de två arméerna åtskilda, och dess ledare, president Ali Abdullah Saleh från norr och vicepresident Ali Salim al-Beidh från söder, blev oense om fördelningen av makten och oljeintäkterna och om en rad mord på sydliga företrädare för Jemenitiska socialistpartiet. Sedan al-Beidh 1993 hade dragit sig tillbaka till Aden misslyckades ett försoningsavtal som undertecknades i Amman i februari 1994, och fullskaligt krig bröt ut den 4 maj. Den 21 maj utropade al-Beidh Demokratiska republiken Jemen i söder, som ingen stat erkände. De större nordliga styrkorna, förstärkta av islamistiska frivilliga och sydjemeniter som hade flytt efter Sydjemens eget inbördeskrig 1986, belägrade Aden och intog staden den 7 juli, medan de sydliga ledarna flydde utomlands. Uppskattningarna av antalet döda varierar från under 1 000, regeringens siffra, till omkring 10 000. Sydens missnöje efter kriget gav senare näring åt en separatiströrelse.
