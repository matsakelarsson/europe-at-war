# Svenska översättningar av katalogtexten (våg 7); stegtexterna kommer senare.
Yemeni Civil War: Jemenitiska inbördeskriget
? The war that began when the Houthis (Ansar Allah), a Zaydi Shia revivalist movement from the far north, took the capital Sanaa in September 2014, allied with the forces of the former president Ali Abdullah Saleh, and drove President Abd Rabbuh Mansur Hadi’s government south to Aden and into exile. In March 2015 a Saudi-led coalition intervened against the Houthis, whom it saw as Iran’s proxies, with air strikes and a blockade, and southern forces backed by the United Arab Emirates drove the Houthis out of Aden. The war then settled into years of stalemate, air strikes on Houthi-held areas, Houthi missile attacks on Saudi Arabia, and one of the world’s worst humanitarian crises. A UN-brokered truce of April 2022 largely held for four years, while the Houthis attacked shipping in the Red Sea in 2023–2025 and fought the United States and Israel. In 2026 the war flared up again, with a Houthi offensive on the Red Sea coast and around Taiz and a Saudi-backed government counter-offensive; the fighting was continuing in late November 2026. By the end of 2021 the UN estimated about 377,000 deaths, most of them from hunger and disease. Last updated 27 November 2026.
: Kriget som började när huthierna (Ansar Allah), en zayditisk-shiitisk väckelserörelse från landets yttersta norr, i september 2014 intog huvudstaden Sanaa i allians med den förre presidenten Ali Abdullah Salehs styrkor och drev president Abd Rabbuh Mansur Hadis regering söderut till Aden och i exil. I mars 2015 ingrep en saudiledd koalition mot huthierna, som den såg som Irans ombud, med flyganfall och en blockad, och sydliga styrkor med stöd av Förenade Arabemiraten drev ut huthierna ur Aden. Kriget övergick sedan i flera års dödläge, flyganfall mot huthikontrollerade områden, huthiernas robotangrepp mot Saudiarabien och en av världens värsta humanitära kriser. En vapenvila som FN hade förmedlat i april 2022 höll i stort sett i fyra år, medan huthierna angrep sjöfarten i Röda havet 2023–2025 och stred mot USA och Israel. År 2026 blossade kriget upp igen, med en huthioffensiv längs kusten vid Röda havet och kring Taiz och en saudistödd motoffensiv från regeringens sida; striderna pågick fortfarande i slutet av november 2026. Fram till slutet av 2021 uppskattade FN antalet döda till omkring 377 000, de flesta av svält och sjukdomar. Senast uppdaterad 27 november 2026.
