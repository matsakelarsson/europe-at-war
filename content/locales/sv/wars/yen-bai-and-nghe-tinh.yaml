# Svenska översättningar av katalogtexten (våg 11); stegtexterna kommer senare.
Yên Bái uprising and the Nghệ-Tĩnh soviets: Yên Bái-upproret och Nghệ-Tĩnh-sovjeterna
? Two risings against French rule in Vietnam in 1930–1931, one nationalist and one communist, both crushed. The Vietnamese Nationalist Party (Việt Nam Quốc Dân Đảng, VNQDĐ), founded in Hanoi in 1927 on the model of the Chinese Kuomintang and led by Nguyễn Thái Học, lost about 1,000 members to arrests after the killing of the labour recruiter Bazin in February 1929. It planned a general rising among the Vietnamese troops of Tonkin. On the night of 9–10 February 1930 about 50 Vietnamese riflemen of the Yên Bái garrison and about 60 party members attacked their French officers and killed five of them, but most of the 550 Vietnamese soldiers there did not join, and the rising was put down within the day; attacks at Hưng Hóa and Lâm Thao and bombs in Hanoi also failed. On 16 February French aircraft bombed the village of Cổ Am, killing about 200 people, most of them civilians. Courts tried 547 people and passed 80 death sentences, and on 17 June 1930 Nguyễn Thái Học and twelve others were guillotined at Yên Bái. From May 1930 strikes and peasant marches spread through the provinces of Nghệ An and Hà Tĩnh, led by local cadres of the Communist Party founded in February 1930 under Nguyễn Ái Quốc (later Ho Chi Minh) and renamed the Indochinese Communist Party in October. On 12 September aircraft bombed a march at Hưng Nguyên, killing an estimated 140 to 200 people. In many villages peasant associations, later called the Nghệ-Tĩnh soviets, drove out officials, cancelled taxes and shared out communal land and rice, until French troops, the Foreign Legion and new military posts broke them by late 1931. The historian Martin Bernal estimates that over 1,300 Vietnamese were killed and about 1,000 more died in prisons and camps; the party lost most of its cadres, but it soon replaced the VNQDĐ as the main force of Vietnamese resistance.
: Två resningar mot det franska styret i Vietnam 1930–1931, den ena nationalistisk och den andra kommunistisk, och båda slogs ned. Vietnamesiska nationalistpartiet (Việt Nam Quốc Dân Đảng, VNQDĐ), som hade grundats i Hanoi 1927 efter mönster av det kinesiska Kuomintang och leddes av Nguyễn Thái Học, förlorade omkring 1 000 medlemmar genom arresteringar efter mordet på arbetskraftsrekryteraren Bazin i februari 1929. Partiet planerade en allmän resning bland de vietnamesiska trupperna i Tonkin. Natten mellan den 9 och 10 februari 1930 anföll omkring 50 vietnamesiska skyttesoldater ur garnisonen i Yên Bái och omkring 60 partimedlemmar sina franska officerare och dödade fem av dem, men de flesta av de 550 vietnamesiska soldaterna där anslöt sig inte, och resningen slogs ned samma dag; anfall vid Hưng Hóa och Lâm Thao och bomber i Hanoi misslyckades också. Den 16 februari bombade franska flygplan byn Cổ Am och dödade omkring 200 människor, de flesta av dem civila. Domstolar ställde 547 personer inför rätta och utdömde 80 dödsstraff, och den 17 juni 1930 giljotinerades Nguyễn Thái Học och tolv andra i Yên Bái. Från maj 1930 spred sig strejker och bondemarscher genom provinserna Nghệ An och Hà Tĩnh, ledda av lokala kadrer i det kommunistparti som hade grundats i februari 1930 under Nguyễn Ái Quốc (senare Ho Chi Minh) och som i oktober bytte namn till Indokinesiska kommunistpartiet. Den 12 september bombade flygplan en marsch vid Hưng Nguyên och dödade uppskattningsvis 140 till 200 människor. I många byar drev bondeföreningar, senare kallade Nghệ-Tĩnh-sovjeterna, bort ämbetsmännen, avskaffade skatterna och delade ut byarnas gemensamma jord och ris, tills franska trupper, Främlingslegionen och nya militärposteringar krossade dem mot slutet av 1931. Historikern Martin Bernal uppskattar att över 1 300 vietnameser dödades och att ytterligare omkring 1 000 dog i fängelser och läger; partiet förlorade de flesta av sina kadrer, men det ersatte snart VNQDĐ som den främsta kraften i det vietnamesiska motståndet.
