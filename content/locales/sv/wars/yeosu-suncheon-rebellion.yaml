# Svenska översättningar av katalogtexten (våg 10); stegtexterna kommer senare.
Yeosu–Suncheon rebellion: Yeosu–Suncheon-upproret
? "A rebellion of the South Korean army’s 14th Regiment in South Jeolla in October 1948, known in Korea as the Yeosu–Suncheon 10·19 incident. On the night of 19 October, as the regiment prepared to sail from Yeosu to fight the Jeju uprising, members of the Workers’ Party of South Korea among its soldiers, led by Staff Sergeant Ji Chang-su and Lieutenant Kim Ji-hoe, seized the armoury and called on the troops to refuse to fight fellow Koreans. Some 2,000–3,000 soldiers joined them, with local leftists; they took Yeosu and Suncheon and spread to Gwangyang, Gurye, Boseong and other towns, killing police officers, officials and right-wing civilians. The government declared martial law and sent loyal regiments: Suncheon was retaken on 23 October and Yeosu, after two days of street fighting, on 27 October. In the reprisals that followed, troops and police screened the townspeople and executed many suspected of helping the rebels, often without trial. Estimates of the dead range from about 3,000 to more than 10,000, most of them killed by government forces. The surviving rebels withdrew to Mount Jiri and fought as guerrillas into the Korean War. The rebellion led to the National Security Act of December 1948 and a purge of suspected leftists in the army, in which Major Park Chung-hee, later president, was convicted and spared after cooperating with investigators. A special law of 2021 provided for investigating the killings and restoring the honour of the victims."
: "Ett uppror i den sydkoreanska arméns 14:e regemente i Södra Jeolla i oktober 1948, i Korea känt som Yeosu–Suncheon-incidenten 10·19. Natten den 19 oktober, när regementet förberedde sig för att avsegla från Yeosu för att bekämpa Jejuupproret, tog medlemmar av Sydkoreas arbetarparti bland dess soldater, ledda av översergeant Ji Chang-su och löjtnant Kim Ji-hoe, vapenförrådet och uppmanade trupperna att vägra strida mot andra koreaner. Omkring 2 000–3 000 soldater anslöt sig till dem, tillsammans med lokala vänsteranhängare; de intog Yeosu och Suncheon och spred sig till Gwangyang, Gurye, Boseong och andra städer och dödade poliser, ämbetsmän och högerinriktade civila. Regeringen utlyste krigslagar och sände lojala regementen: Suncheon återtogs den 23 oktober och Yeosu, efter två dagars gatustrider, den 27 oktober. Under de repressalier som följde sållade trupper och polis stadsborna och avrättade många som misstänktes ha hjälpt rebellerna, ofta utan rättegång. Uppskattningarna av antalet döda varierar från omkring 3 000 till mer än 10 000, de flesta dödade av regeringsstyrkorna. De överlevande rebellerna drog sig tillbaka till berget Jiri och stred som gerilla in i Koreakriget. Upproret ledde till lagen om nationell säkerhet i december 1948 och en utrensning av misstänkta vänsteranhängare i armén, där major Park Chung-hee, senare president, dömdes men skonades sedan han samarbetat med utredarna. En särskild lag från 2021 föreskrev en utredning av dödandet och ett återupprättande av offrens heder."
