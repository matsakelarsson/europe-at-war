# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
Yermak’s campaign and the conquest of the Khanate of Sibir: Jermaks fälttåg och erövringen av khanatet Sibir
The Russian conquest of the Khanate of Sibir, the Tatar state on the Tobol and Irtysh rivers east of the Urals, which opened Siberia to Russia. In 1581 or 1582 the Stroganov merchant family, who held frontier lands on the Kama and the Chusovaya, sent a band of about 840 Volga Cossacks and hired men under the ataman Yermak Timofeyevich over the Urals. Armed with muskets and a few small guns, they beat Khan Kuchum’s army at Chuvash Cape and took his capital, Qashliq, in October 1582. Ivan IV pardoned the Cossacks and sent troops, but famine, revolts and Tatar attacks wore the force down, and in August 1585 Kuchum surprised Yermak’s camp at the mouth of the Vagay, where Yermak drowned. The survivors left Siberia. Government expeditions then built forts at Tyumen (1586), Tobolsk (1587), Tara, Surgut and elsewhere, and on 20 August 1598 a force from Tara destroyed Kuchum’s camp on the upper Ob. Kuchum escaped and died in exile a few years later; his sons and grandsons raided the Russian frontier for decades.: Den ryska erövringen av khanatet Sibir, tatarstaten vid floderna Tobol och Irtysj öster om Ural, som öppnade Sibirien för Ryssland. År 1581 eller 1582 sände köpmanssläkten Stroganov, som innehade gränsländer vid Kama och Tjusovaja, en skara på omkring 840 volgakosacker och lejda män under atamanen Jermak Timofejevitj över Ural. Beväpnade med musköter och några små kanoner besegrade de khan Kutjums armé vid Tjuvasjudden och intog hans huvudstad Qashliq i oktober 1582. Ivan IV benådade kosackerna och sände trupper, men hungersnöd, uppror och tatariska anfall nötte ned styrkan, och i augusti 1585 överrumplade Kutjum Jermaks läger vid Vagajs mynning, där Jermak drunknade. De överlevande lämnade Sibirien. Statliga expeditioner byggde sedan fästen i Tiumen (1586), Tobolsk (1587), Tara, Surgut och på andra håll, och den 20 augusti 1598 förintade en styrka från Tara Kutjums läger vid övre Ob. Kutjum kom undan och dog i landsflykt några år senare; hans söner och sonsöner gjorde räder mot den ryska gränsen i årtionden.
