# Svenska översättningar av katalogtexten (våg 10); stegtexterna kommer senare.
Yi Gwal’s rebellion: Yi Gwals uppror
? A revolt by Yi Gwal, a general who had helped put King Injo on the throne in the coup of 1623 and was then sent north as deputy commander at Yeongbyeon against the Later Jin. Rewarded less than he expected, and accused of plotting by the ruling Westerners’ faction, he killed the officials sent to arrest his son and rose on 11 March 1624 with about 12,000 men, among them some 100 Japanese soldiers who had gone over to Korea in the Imjin War. Avoiding Pyongyang, where the commander-in-chief Jang Man had too few troops to stop him, he marched south by side roads, beat government forces at Hwangju and on the Imjin River, and on 26 March crossed the Imjin. Injo fled south to Gongju, and Yi Gwal entered Hanseong, the first rebel to take the capital in Joseon history, and set up Prince Heungan as king. On 29 March Jang Man and Jeong Chung-sin defeated him on the hill of Gilmajae (Anhyeon), just outside the city. He fled towards Icheon, where his own officers killed him and Han Myeong-ryeon and gave themselves up. The revolt weakened the northern defences, and Han Myeong-ryeon’s son, who escaped to the Later Jin, urged them to invade Korea, which they did in 1627.
: En revolt av Yi Gwal, en general som hade hjälpt till att sätta kung Injo på tronen genom kuppen 1623 och sedan sänts norrut som ställföreträdande befälhavare i Yeongbyeon mot Senare Jin. Han belönades sämre än han hade väntat sig och anklagades för konspiration av den styrande västfraktionen, och han dödade de ämbetsmän som sänts för att arrestera hans son och reste sig den 11 mars 1624 med omkring 12 000 man, bland dem omkring 100 japanska soldater som hade gått över till Korea under Imjinkriget. Han undvek Pyongyang, där överbefälhavaren Jang Man hade för få trupper för att stoppa honom, tågade söderut längs småvägar, besegrade regeringsstyrkor vid Hwangju och vid Imjinfloden och gick den 26 mars över Imjin. Injo flydde söderut till Gongju, och Yi Gwal tågade in i Hanseong, den förste rebell i Joseons historia som intog huvudstaden, och satte prins Heungan på tronen som kung. Den 29 mars besegrade Jang Man och Jeong Chung-sin honom på kullen Gilmajae (Anhyeon), strax utanför staden. Han flydde mot Icheon, där hans egna officerare dödade honom och Han Myeong-ryeon och gav upp. Revolten försvagade försvaret i norr, och Han Myeong-ryeons son, som flydde till Senare Jin, uppmanade dem att invadera Korea, vilket de gjorde 1627.
