# Svenska översättningar av katalogtexten (våg 10); stegtexterna kommer senare.
Yi In-jwa’s rebellion: Yi In-jwas uppror
? A revolt against King Yeongjo, also called the Musin rebellion after the year 1728 in the sixty-year cycle. Members of the radical Soron faction, driven from power after Yeongjo’s accession in 1724, and of the excluded Namin faction claimed that Yeongjo had poisoned his half-brother King Gyeongjong and was not King Sukjong’s son, and planned to replace him with Prince Milpung, a descendant of Crown Prince Sohyeon. The plan in the capital was betrayed, but in the provinces Yi In-jwa’s band, entering as a funeral party, took Cheongju on the night of 23 April 1728, killing the provincial army commander, and spread to the towns around it; in Gyeongsang, Jeong Hui-ryang raised troops and took Anui, Geochang, Hamyang and Hapcheon. A government army of some 2,300 men under O Myeong-hang, with Bak Mun-su as his aide, defeated Yi In-jwa at Anseong and Juksan at the start of May; Yi was captured and executed in Hanseong, local gentry retook Cheongju, and troops from Gyeongsang put down Jeong Hui-ryang. Yeongjo answered the revolt with his tangpyeong policy of appointing men from all factions.
: En revolt mot kung Yeongjo, även kallad Musinupproret efter året 1728 i sextioårscykeln. Medlemmar av den radikala Soronfraktionen, som hade drivits från makten efter Yeongjos trontillträde 1724, och av den utestängda Naminfraktionen hävdade att Yeongjo hade förgiftat sin halvbror kung Gyeongjong och inte var kung Sukjongs son, och planerade att ersätta honom med prins Milpung, en ättling till kronprins Sohyeon. Planen i huvudstaden förråddes, men i provinserna intog Yi In-jwas skara, som tog sig in förklädd till ett begravningsfölje, Cheongju natten den 23 april 1728, dödade provinsens armébefälhavare och spred sig till städerna runt omkring; i Gyeongsang samlade Jeong Hui-ryang trupper och intog Anui, Geochang, Hamyang och Hapcheon. En regeringsarmé på omkring 2 300 man under O Myeong-hang, med Bak Mun-su som medhjälpare, besegrade Yi In-jwa vid Anseong och Juksan i början av maj; Yi tillfångatogs och avrättades i Hanseong, den lokala adeln återtog Cheongju, och trupper från Gyeongsang slog ned Jeong Hui-ryang. Yeongjo besvarade revolten med sin tangpyeongpolitik, att utnämna män ur alla fraktioner.
