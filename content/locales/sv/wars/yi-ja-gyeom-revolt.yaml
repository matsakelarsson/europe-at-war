# Svenska översättningar av katalogtexten (våg 10); stegtexterna kommer senare.
Yi Ja-gyeom’s revolt: Yi Ja-gyeoms revolt
? A struggle for power at the Goryeo court that left most of the royal palace in ashes. Yi Ja-gyeom, head of the Inju (Gyeongwon) Yi clan, was both the grandfather and the father-in-law of King Injong, having married two of his daughters to the young king, and by the 1120s he controlled appointments and much of the government. In the second month of 1126 officials close to the king tried to remove him and his ally, the general Cheok Jun-gyeong, attacking at night and killing Cheok’s brother and son. Cheok Jun-gyeong’s soldiers set fire to the palace and broke in, killed the king’s supporters, and took Injong to Yi Ja-gyeom’s house; the palace burned almost to the ground. Yi Ja-gyeom, now in full control, also had Goryeo accept the Jurchen Jin empire as overlord. The king then secretly won Cheok Jun-gyeong over through the official Choe Sa-jeon, and in the fifth month of 1126 Cheok’s troops arrested Yi Ja-gyeom, who was exiled to Yeonggwang and died there the same year. Cheok Jun-gyeong was himself exiled in 1127.
: En maktkamp vid Goryeohovet som lade större delen av kungapalatset i aska. Yi Ja-gyeom, överhuvud för Yiklanen från Inju (Gyeongwon), var både morfar och svärfar till kung Injong, sedan han hade gift bort två av sina döttrar med den unge kungen, och på 1120-talet kontrollerade han utnämningarna och en stor del av regeringen. I andra månaden 1126 försökte ämbetsmän nära kungen avlägsna honom och hans bundsförvant, generalen Cheok Jun-gyeong, genom ett nattligt angrepp där Cheoks bror och son dödades. Cheok Jun-gyeongs soldater satte eld på palatset och bröt sig in, dödade kungens anhängare och förde Injong till Yi Ja-gyeoms hus; palatset brann nästan ner till grunden. Yi Ja-gyeom, som nu hade full kontroll, lät också Goryeo erkänna jurchenernas Jinrike som överherre. Kungen vann sedan i hemlighet över Cheok Jun-gyeong genom ämbetsmannen Choe Sa-jeon, och i femte månaden 1126 arresterade Cheoks trupper Yi Ja-gyeom, som förvisades till Yeonggwang och dog där samma år. Cheok Jun-gyeong förvisades själv 1127.
