# Svenska översättningar av katalogtexten (våg 10); stegtexterna kommer senare.
Yi Si-ae’s rebellion: Yi Si-aes uppror
? A rising in Hamgil (later Hamgyong) province in the north-east against King Sejo’s centralising rule. The north-east, the home region of the dynasty’s founder, had been governed by local landowning families who held the frontier against the Jurchens, but Sejo increasingly sent officials from the south and tightened control through a household tally system. Yi Si-ae, a former magistrate of Hoeryong from a powerful family of Gilju (Kilju), rose in the fifth month of 1467. He killed the provincial army commander Gang Hyo-mun at Gilju and spread rumours that troops from the south were coming to massacre the northerners; local people then killed the officials sent from the capital across the province, among them the governor, Sin Myeon, at Hamhung. Yi Si-ae also sent word to the court that Gang Hyo-mun had plotted with the great ministers Han Myeong-hoe and Sin Suk-ju, and Sejo briefly had them arrested. The king sent an army under Prince Guseong (Yi Jun), with Heo Jong, Gang Sun, Eo Yu-so and Nam I, which grew to some 30,000 men and more. Yi Si-ae’s forces, which included the province’s experienced frontier troops with firearms, held their own at Hongwon and Bukcheong, but late in the seventh month they were routed at the Mannyeong pass near Iwon. Yi Si-ae fled north towards the Jurchen lands, was seized by his own followers through a ruse of the government officer Heo Yu-rye, and was executed on the twelfth day of the eighth month. The province was split in two and the local self-governing councils (yuhyangso) were abolished.
: En resning i provinsen Hamgil (senare Hamgyong) i nordost mot kung Sejos centraliserande styre. Nordost, dynastigrundarens hemtrakt, hade styrts av lokala jordägande släkter som höll gränsen mot jurchenerna, men Sejo sände allt oftare ämbetsmän från söder och skärpte kontrollen genom ett system med hushållsbrickor. Yi Si-ae, en före detta prefekt i Hoeryong från en mäktig släkt i Gilju (Kilju), reste sig i femte månaden 1467. Han dödade provinsarméns befälhavare Gang Hyo-mun i Gilju och spred rykten om att trupper från söder var på väg för att massakrera nordborna; lokalbefolkningen dödade då de ämbetsmän som sänts från huvudstaden över hela provinsen, bland dem guvernören Sin Myeon i Hamhung. Yi Si-ae sände också bud till hovet om att Gang Hyo-mun hade konspirerat med de höga ministrarna Han Myeong-hoe och Sin Suk-ju, och Sejo lät för en kort tid arrestera dem. Kungen sände en armé under prins Guseong (Yi Jun), med Heo Jong, Gang Sun, Eo Yu-so och Nam I, som växte till omkring 30 000 man och fler. Yi Si-aes styrkor, som omfattade provinsens erfarna gränstrupper med eldvapen, höll stånd vid Hongwon och Bukcheong, men sent i sjunde månaden slogs de på flykten vid Mannyeongpasset nära Iwon. Yi Si-ae flydde norrut mot jurchenernas områden, greps av sina egna anhängare genom en list av regeringsofficeren Heo Yu-rye och avrättades på tolfte dagen i åttonde månaden. Provinsen delades i två och de lokala självstyrande råden (yuhyangso) avskaffades.
