Yongle Emperor’s campaigns against the Mongols: Yonglekejsarens fälttåg mot mongolerna
Five expeditions that the Yongle Emperor led in person into Mongolia between 1410 and 1424, after a Ming army under Qiu Fu was destroyed on the Kherlen River in 1409. The Mongols were divided between the Eastern Mongols, led by the chancellor Arughtai and his khan Bunyashiri, and the Oirats of the west under Mahmud. In 1410 the emperor defeated Bunyashiri on the Onon and Arughtai near the Taor River; in 1414 his cannon broke the Oirats between the Tuul and the Kherlen. The campaigns of 1422, 1423 and 1424, with armies of more than 200,000 men and enormous supply trains, failed to bring Arughtai to battle, and the emperor died on the way home from the last of them, on 12 August 1424. The expeditions kept the Mongols divided but won no lasting settlement; his successors gave them up and pulled the frontier back to the Great Wall line.: Fem expeditioner som Yonglekejsaren personligen ledde in i Mongoliet mellan 1410 och 1424, sedan en Mingarmé under Qiu Fu hade förintats vid floden Kerulen 1409. Mongolerna var delade mellan östmongolerna, ledda av kanslern Arughtai och hans khan Bunyashiri, och oiraterna i väster under Mahmud. År 1410 besegrade kejsaren Bunyashiri vid Onon och Arughtai nära floden Taor; 1414 krossade hans kanoner oiraterna mellan Tuul och Kerulen. Fälttågen 1422, 1423 och 1424, med arméer på mer än 200 000 man och enorma trängkolonner, lyckades inte tvinga Arughtai till strid, och kejsaren dog på hemvägen från det sista av dem, den 12 augusti 1424. Expeditionerna höll mongolerna splittrade men gav ingen varaktig uppgörelse; hans efterträdare upphörde med dem och drog tillbaka gränsen till Kinesiska murens linje.
