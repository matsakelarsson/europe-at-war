Zaian War: Zaiankriget
A war between France and the Zaian confederation of Berber tribes in the Middle Atlas of Morocco, part of the French conquest of the country. The Zaians, led since 1877 by Mouha ou Hammou Zayani, held the mountains around Khénifra, on the routes between Fez, Marrakesh and the south-east. French columns took Khénifra in June 1914, but on 13 November 1914 a French column that attacked the Zaian winter camp at El Herri was surrounded and lost 623 men killed, the heaviest French defeat in Morocco. During the First World War Lyautey, who had sent most of his troops to France, held a line of posts while the Zaians and their allies, aided with money and arms by German and Ottoman agents, raided it. After the war France won over Mouha ou Hammou’s sons, who submitted in 1920; he was killed in March 1921 fighting tribesmen who had gone over to the French, and a French offensive in September 1921 ended the war. His ally Moha ou Said and others fought on in the High Atlas into the 1930s.: Ett krig mellan Frankrike och zaianförbundet, en sammanslutning av berberstammar i Mellersta Atlas i Marocko, ett led i den franska erövringen av landet. Zaianerna, som sedan 1877 leddes av Mouha ou Hammou Zayani, behärskade bergen kring Khénifra, vid vägarna mellan Fès, Marrakech och sydost. Franska kolonner intog Khénifra i juni 1914, men den 13 november 1914 omringades en fransk kolonn som anföll zaianernas vinterläger vid El Herri och förlorade 623 man i stupade, det svåraste franska nederlaget i Marocko. Under första världskriget höll Lyautey, som hade skickat större delen av sina trupper till Frankrike, en linje av posteringar medan zaianerna och deras allierade, understödda med pengar och vapen av tyska och osmanska agenter, gjorde räder mot den. Efter kriget vann Frankrike över Mouha ou Hammous söner, som underkastade sig 1920; han stupade i mars 1921 i strid mot stammän som hade gått över till fransmännen, och en fransk offensiv i september 1921 avslutade kriget. Hans allierade Moha ou Said och andra fortsatte att strida i Höga Atlas in på 1930-talet.
