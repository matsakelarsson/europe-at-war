Zand–Qajar war: Zandisk-qajariska kriget
The struggle for Iran after the death of Karim Khan Zand in 1779. Agha Mohammad Khan, chief of the Qajar tribe and for sixteen years a hostage at the Zand court in Shiraz, escaped to the Caspian provinces, fought off his own brothers and several Zand armies, and made Tehran his capital in 1786, while the Zand princes fought each other for the throne. He took Shiraz in 1792 and in 1794 captured Kerman, where the last Zand ruler, Lotf Ali Khan, had made his stand, punishing its people with mass blinding and enslavement. Lotf Ali Khan was handed over at Bam and put to death, and the Qajars ruled Iran until 1925.: Kampen om Iran efter Karim Khan Zands död 1779. Agha Mohammad Khan, hövding för qajarstammen och i sexton år gisslan vid zandhovet i Shiraz, flydde till de kaspiska provinserna, slog tillbaka sina egna bröder och flera zandarméer och gjorde Teheran till sin huvudstad 1786, medan zandprinsarna stred med varandra om tronen. Han intog Shiraz 1792 och erövrade 1794 Kerman, där den siste zandhärskaren, Lotf Ali Khan, hade gjort sitt sista motstånd, och straffade invånarna genom att blända och förslava dem i stor skala. Lotf Ali Khan utlämnades i Bam och avrättades, och qajarerna härskade över Iran till 1925.
