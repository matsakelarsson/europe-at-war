# Svenska översättningar av katalogtexten (våg 7); stegtexterna kommer senare.
Zanj Rebellion: Zanjupproret
A rising of slaves and other poor people in the marshes and salt flats around Basra in southern Iraq, led by Ali ibn Muhammad, who claimed descent from the Prophet’s family. Many of his followers were East African slaves, the Zanj, who were made to clear the salt crust from the land. For fourteen years the rebels held the marshes of lower Iraq, sacked Ubulla, Basra, Ahvaz and Wasit and came within about 80 km of Baghdad, while the caliphate was also at war with the Saffarids of Iran. From 879 the regent al-Muwaffaq and his son Abu’l-Abbas, the future caliph al-Mu’tadid, won back the marshes, and in August 883 they took the rebel capital, al-Mukhtara.: Ett uppror bland slavar och andra fattiga i träskmarkerna och saltslätterna kring Basra i södra Irak, lett av Ali ibn Muhammad, som gjorde anspråk på att härstamma från Profetens familj. Många av hans anhängare var östafrikanska slavar, zanj, som tvingades skrapa bort saltskorpan från jorden. I fjorton år behärskade rebellerna träskmarkerna i nedre Irak, plundrade Ubulla, Basra, Ahvaz och Wasit och nådde fram till omkring 80 km från Bagdad, samtidigt som kalifatet också låg i krig med saffariderna i Iran. Från 879 återerövrade regenten al-Muwaffaq och hans son Abu’l-Abbas, den blivande kalifen al-Mu’tadid, träskmarkerna, och i augusti 883 intog de rebellernas huvudstad, al-Mukhtara.
