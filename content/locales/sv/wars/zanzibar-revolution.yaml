# Svenska översättningar av katalogtexten (våg 13); stegtexterna kommer senare.
Zanzibar Revolution: Zanzibarrevolutionen
? The overthrow of the Sultan of Zanzibar and his Arab-led government by African insurgents on 12 January 1964, a month after the islands became independent, and the killings of Arabs and South Asians that followed. Zanzibar’s population of about 300,000 included some 230,000 Africans, among them people of mainland origin and Shirazis who claimed Persian descent, about 50,000 Arabs, who owned most of the land, and 20,000 South Asians. In elections in 1961 and 1963 the African-led Afro-Shirazi Party (ASP) won the most votes but, under a constituency map drawn to its disadvantage, not a majority of seats, and the Zanzibar Nationalist Party and its ally formed the government that took Zanzibar to independence on 10 December 1963 under Sultan Jamshid bin Abdullah. Before dawn on 12 January 1964 some 600–800 poorly armed men, many from the ASP Youth League and joined by recently dismissed policemen, led by John Okello, a Ugandan labourer and self-styled “field marshal”, seized the police armouries, the radio station and the airstrip; the Sultan fled by yacht. Gangs then killed Arabs and South Asians across Unguja, looting their property and raping women. Estimates of the dead range from several hundred to 20,000; Western newspapers at the time gave 2,000–4,000. A Revolutionary Council under the ASP leader Abeid Karume proclaimed the People’s Republic of Zanzibar and Pemba. Britain and the United States evacuated their citizens and Britain drew up intervention plans it never carried out; the Soviet Union, China and East Germany recognised the new government at once. Karume sidelined Okello, who was barred from the islands in March, and on 26 April 1964 Zanzibar united with Tanganyika in what became the United Republic of Tanzania.
: Störtandet av sultanen av Zanzibar och hans araberledda regering genom afrikanska upprorsmän den 12 januari 1964, en månad efter att öarna blivit självständiga, och de mord på araber och sydasiater som följde. Zanzibars befolkning på omkring 300 000 omfattade omkring 230 000 afrikaner, bland dem människor med ursprung på fastlandet och shirazier som gjorde anspråk på persisk härkomst, omkring 50 000 araber, som ägde största delen av jorden, och 20 000 sydasiater. I valen 1961 och 1963 fick det afrikanskledda Afro-Shirazi Party (ASP) flest röster men, med en valkretsindelning som missgynnade partiet, inte majoritet av mandaten, och Zanzibar Nationalist Party och dess bundsförvant bildade den regering som förde Zanzibar till självständighet den 10 december 1963 under sultan Jamshid bin Abdullah. Före gryningen den 12 januari 1964 intog omkring 600–800 dåligt beväpnade män, många från ASP:s ungdomsförbund och förstärkta av nyligen avskedade poliser, under ledning av John Okello, en ugandisk arbetare och självutnämnd ”fältmarskalk”, polisens vapenförråd, radiostationen och flygfältet; sultanen flydde med en jakt. Gäng dödade sedan araber och sydasiater över hela Unguja, plundrade deras egendom och våldtog kvinnor. Uppskattningarna av antalet döda varierar från flera hundra till 20 000; västerländska tidningar angav vid tiden 2 000–4 000. Ett revolutionsråd under ASP-ledaren Abeid Karume utropade Folkrepubliken Zanzibar och Pemba. Storbritannien och USA evakuerade sina medborgare, och Storbritannien utarbetade interventionsplaner som aldrig genomfördes; Sovjetunionen, Kina och Östtyskland erkände genast den nya regeringen. Karume sköt undan Okello, som i mars portades från öarna, och den 26 april 1964 förenades Zanzibar med Tanganyika i det som blev Förenade republiken Tanzania.
