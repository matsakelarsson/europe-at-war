# Svenska översättningar av katalogtexten (våg 14); stegtexterna kommer senare.
Zapatista uprising: Zapatistupproret
? The armed rising of the Zapatista Army of National Liberation (EZLN) in Chiapas, Mexico’s southernmost and one of its poorest states, on 1 January 1994, the day the North American Free Trade Agreement (NAFTA) came into force. The EZLN, founded in the Lacandon Jungle in 1983 by a small group of urban leftists who joined Tzeltal, Tzotzil, Ch’ol and Tojolabal Maya communities, took its name from Emiliano Zapata and spoke for Indigenous peoples who demanded land, work, health care, education, democracy and an end to discrimination, and who saw NAFTA and the reform of 1992 that ended land redistribution as a threat to their communities. Several thousand insurgents, many of them women, seized San Cristóbal de las Casas, Ocosingo, Las Margaritas, Altamirano and other towns and declared war on the federal army and the government of President Carlos Salinas de Gortari. The army struck back with troops, aircraft and armour; the worst fighting was in the market of Ocosingo. On 12 January, as large crowds marched in Mexico City for peace, Salinas declared a ceasefire. Official figures gave about 145 dead, among them soldiers, police, insurgents and civilians; other estimates are higher. The EZLN’s spokesman, Subcomandante Marcos, became known around the world. Talks led to the San Andrés Accords on Indigenous rights in February 1996, which the government did not put into law, while an army offensive in February 1995 and paramilitary violence, above all the Acteal massacre of 1997, continued the conflict at lower intensity. The EZLN has kept its arms but has not fought the army since, and governs its own autonomous communities in Chiapas.
: Det väpnade upproret av Zapatistiska nationella befrielsearmén (EZLN) i Chiapas, Mexikos sydligaste och en av dess fattigaste delstater, den 1 januari 1994, samma dag som Nordamerikanska frihandelsavtalet (NAFTA) trädde i kraft. EZLN, som grundades i Lacandondjungeln 1983 av en liten grupp vänsteraktivister från städerna som anslöt sig till mayasamhällen bland tzeltal, tzotzil, ch’ol och tojolabal, tog sitt namn efter Emiliano Zapata och talade för urfolk som krävde jord, arbete, hälsovård, utbildning, demokrati och ett slut på diskrimineringen, och som såg NAFTA och 1992 års reform, som avslutade jordomfördelningen, som ett hot mot sina samhällen. Flera tusen upprorsmän, många av dem kvinnor, intog San Cristóbal de las Casas, Ocosingo, Las Margaritas, Altamirano och andra orter och förklarade krig mot den federala armén och president Carlos Salinas de Gortaris regering. Armén slog tillbaka med trupper, flygplan och pansar; de hårdaste striderna utkämpades på marknaden i Ocosingo. Den 12 januari, medan stora folkmassor demonstrerade för fred i Mexico City, utlyste Salinas vapenvila. Enligt officiella siffror dog omkring 145 människor, bland dem soldater, poliser, upprorsmän och civila; andra uppskattningar är högre. EZLN:s talesman, subcomandante Marcos, blev känd över hela världen. Förhandlingar ledde i februari 1996 till San Andrés-avtalen om urfolkens rättigheter, som regeringen inte omsatte i lag, medan en arméoffensiv i februari 1995 och paramilitärt våld, framför allt massakern i Acteal 1997, förde konflikten vidare med lägre intensitet. EZLN har behållit sina vapen men har inte stridit mot armén sedan dess, och styr sina egna autonoma samhällen i Chiapas.
