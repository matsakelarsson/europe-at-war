# Svenska översättningar av katalogtexten (våg 9); stegtexterna kommer senare.
Zhang Yichao’s revolt: Zhang Yichaos revolt
? The rising in which Zhang Yichao, a leading man of Shazhou (Dunhuang), drove the Tibetan garrisons out of the Hexi Corridor and returned it to nominal Tang rule. Tibet had held Dunhuang since about 781–786, but after the death of the emperor Langdarma in 842 its generals in the north-west fought each other. In 848 Zhang led the Han, Uyghur, Tuyuhun and Qiang people of Shazhou in a rising, the Tibetan garrison fled, and he took Guazhou and then, by about 850, Ganzhou, Suzhou and Yizhou (Hami). His brother carried maps of the recovered prefectures to Chang’an, and in 851 the emperor Xuanzong made Zhang military governor of a new Guiyi (“Return to Allegiance”) circuit based at Shazhou. Zhang took Liangzhou (Wuwei) with 7,000 men in 863, and in 866 his forces defeated the Tibetan general Lun Kongre near Xizhou; the Uyghurs of Qocho soon took Xizhou and the northern Tianshan for themselves. Zhang went to Chang’an in 867 and died there in 872. The Guiyi circuit, ruled by the Zhang and then the Cao families and in practice independent, held Dunhuang until the Tanguts took it in the 1030s.
: Den resning under vilken Zhang Yichao, en ledande man i Shazhou (Dunhuang), drev ut de tibetanska garnisonerna ur Hexikorridoren och återförde den under Tangrikets nominella styre. Tibet hade behärskat Dunhuang sedan omkring 781–786, men efter kejsar Langdarmas död 842 bekämpade dess fältherrar i nordväst varandra. År 848 ledde Zhang invånarna i Shazhou – hankineser, uigurer, tuyuhun och qiang – i en resning, den tibetanska garnisonen flydde, och han intog Guazhou och sedan, omkring 850, Ganzhou, Suzhou och Yizhou (Hami). Hans bror förde kartor över de återvunna prefekturerna till Chang’an, och 851 utnämnde kejsar Xuanzong Zhang till militärguvernör i en ny krets, Guiyi (”Återgång till troheten”), med säte i Shazhou. Zhang intog Liangzhou (Wuwei) med 7 000 man 863, och 866 besegrade hans styrkor den tibetanske fältherren Lun Kongre nära Xizhou; uigurerna i Qocho tog snart Xizhou och norra Tianshan för egen räkning. Zhang reste till Chang’an 867 och dog där 872. Guiyikretsen, som styrdes av släkten Zhang och sedan av släkten Cao och i praktiken var självständig, behärskade Dunhuang tills tanguterna intog staden på 1030-talet.
