Zhili–Anhui War: Zhili–Anhui-kriget
? A ten-day war in July 1920 for control of the Beijing government, fought in Zhili (today Hebei) between the Anhui clique of Duan Qirui and an alliance of the Zhili clique and Zhang Zuolin’s Fengtian clique. Duan had dominated the Beiyang government since 1916 through his army, the Anfu Club in parliament and large Japanese loans; the Zhili generals opposed his wish to conquer the south by force, and Zhang Zuolin was alarmed when Duan’s ally Xu Shuzheng took Outer Mongolia in 1919. On 12 July the Zhili and allied generals denounced Duan and the Anfu Club, and on 14 July the Anhui army, about 42,000 men, attacked on two fronts south and south-east of Beijing. Its western army under Duan Zhigui and Qu Tongfeng first pushed the Zhili troops back near Gaobeidian, but on 17 July Wu Peifu outflanked it, captured Qu Tongfeng and took Zhuozhou, and the eastern army under Xu Shuzheng, which had advanced along the railway to Yangcun, collapsed when the Fengtian troops attacked it the same day; Xu fled to Beijing. Duan resigned on 19 July, and on 23 July Zhili and Fengtian troops entered Beijing. The Anhui army lost about 35,000 men killed or scattered and 6,500 captured. Cao Kun, Wu Peifu and Zhang Zuolin shared the Beijing government until they fell out in 1922.
: Ett tio dagar långt krig i juli 1920 om kontrollen över regeringen i Peking, utkämpat i Zhili (dagens Hebei) mellan Duan Qiruis Anhuiklick och en allians av Zhiliklicken och Zhang Zuolins Fengtianklick. Duan hade dominerat Beiyangregeringen sedan 1916 genom sin armé, Anfuklubben i parlamentet och stora japanska lån; Zhiligeneralerna motsatte sig hans önskan att erövra södern med våld, och Zhang Zuolin oroades när Duans bundsförvant Xu Shuzheng tog Yttre Mongoliet 1919. Den 12 juli fördömde Zhiligeneralerna och deras allierade Duan och Anfuklubben, och den 14 juli anföll Anhuiarmén, omkring 42 000 man, på två fronter söder och sydost om Peking. Dess västra armé under Duan Zhigui och Qu Tongfeng trängde först tillbaka Zhilitrupperna nära Gaobeidian, men den 17 juli kringgick Wu Peifu den, tillfångatog Qu Tongfeng och intog Zhuozhou, och den östra armén under Xu Shuzheng, som hade ryckt fram längs järnvägen till Yangcun, bröt samman när Fengtiantrupperna anföll den samma dag; Xu flydde till Peking. Duan avgick den 19 juli, och den 23 juli tågade Zhili- och Fengtiantrupper in i Peking. Anhuiarmén förlorade omkring 35 000 man i döda eller skingrade och 6 500 tillfångatagna. Cao Kun, Wu Peifu och Zhang Zuolin delade på makten i Pekingregeringen tills de blev osams 1922.
