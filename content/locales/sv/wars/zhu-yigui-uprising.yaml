Zhu Yigui uprising: Zhu Yiguis uppror
? A rising of Han settlers in southern Taiwan that briefly drove out the Qing authorities. Angered by the exactions of the Taiwan prefect Wang Zhen and his officials, settlers in the hills of Fengshan county chose as their leader Zhu Yigui, a duck farmer of Zhangzhou origin whose surname was that of the Ming emperors. They rose on 14 May 1721 at Gangshan, joined forces with a band under Du Junying, a settler from Guangdong whose followers were largely Hakka, defeated the garrison troops at Chishan on 22 May and took the prefectural city (Tainan) on 26 May, while officials fled to Penghu. Zhu proclaimed himself Zhongxing Wang (“king of the restoration”) with the reign name Yonghe, and within days the rebels held most of the settled plains. Their coalition soon split along lines of origin, between Zhu’s Hoklo followers and Du’s Hakka, and the Hakka villages of the Liudui settlements in the south formed a militia that defeated the rebels on the Xia Danshui river in early July. A Qing fleet from Fujian under Shi Shibiao and Lan Tingzhen forced the Luermen channel on 10 July, took Anping on 12 July and retook the prefectural city on 17 July; the expedition grew to some 18,000 men. Zhu was handed over by village militia leaders on 28 July and executed by slicing in Beijing, and Du Junying later surrendered. The rising led the Qing to strengthen their garrison and administration in Taiwan, and Lan Tingzhen’s kinsman and adviser Lan Dingyuan wrote influential essays urging fuller settlement of the island.
: En resning bland hankinesiska nybyggare i södra Taiwan som för en kort tid drev ut Qingmyndigheterna. Upprörda över de pålagor som Taiwans prefekt Wang Zhen och hans ämbetsmän utkrävde valde nybyggare i bergen i Fengshan härad till sin ledare Zhu Yigui, en ankuppfödare med rötter i Zhangzhou som bar Mingkejsarnas efternamn. De reste sig den 14 maj 1721 vid Gangshan, förenade sig med en skara under Du Junying, en nybyggare från Guangdong vars anhängare till stor del var hakka, besegrade garnisonstrupperna vid Chishan den 22 maj och intog prefekturstaden (Tainan) den 26 maj, medan ämbetsmännen flydde till Penghu. Zhu utropade sig till Zhongxing wang (”återupprättelsens kung”) med regeringsnamnet Yonghe, och inom några dagar höll rebellerna större delen av de bebyggda slätterna. Deras koalition splittrades snart efter ursprung, mellan Zhus hoklo-anhängare och Dus hakka, och hakkabyarna i Liuduibosättningarna i söder bildade en milis som besegrade rebellerna vid floden Xia Danshui i början av juli. En Qingflotta från Fujian under Shi Shibiao och Lan Tingzhen forcerade Luermenkanalen den 10 juli, intog Anping den 12 juli och återtog prefekturstaden den 17 juli; expeditionen växte till omkring 18 000 man. Zhu utlämnades av byarnas milisledare den 28 juli och avrättades genom långsam styckning i Peking, och Du Junying kapitulerade senare. Resningen fick Qing att stärka sin garnison och förvaltning på Taiwan, och Lan Tingzhens släkting och rådgivare Lan Dingyuan skrev inflytelserika essäer som förordade en mer omfattande kolonisering av ön.
