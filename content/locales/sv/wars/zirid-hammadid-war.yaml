# Svenska översättningar av katalogtexten (våg 12); stegtexterna kommer senare.
Zirid–Hammadid War: Kriget mellan zirider och hammadider
? "The war that split the Zirid realm, which ruled Ifriqiya and the central Maghreb for the Fatimid caliphs of Cairo, into two Sanhaja Berber states. Hammad ibn Buluggin, uncle of the Zirid emir Badis and governor of the west from his new fortress capital, the Qal’a in the Hodna mountains, refused in about 1014 to give up Constantine and other towns to Badis’s heir; he had the Abbasid caliph named in the Friday sermon instead of the Fatimid and killed Shi’is in his lands. In 1015 he took and sacked Béja. Badis seized Ashir, beat Hammad on the Chelif river in the autumn and besieged him in the Qal’a from November, but died in his camp in May 1016, and the Zirid army went home. Hammad recovered his lands and beat a Zirid force near Ashir. The young emir al-Mu’izz ibn Badis defeated him in August 1017 while Hammad was besieging Baghaya, and by a treaty of 5 January 1018, sealed by a marriage, recognised him as independent ruler of M’Sila, Tobna, the Zab, Ashir, Tahert and whatever else he could conquer in the central Maghreb. The two branches stayed rivals for more than a century: they recognised opposite caliphs, backed rival Arab tribes after the Hilalian invasion, fought at Sbiba in 1065, and the Hammadids attacked Mahdia in 1135. The Normans ended Zirid rule in 1148 and the Almohads the Hammadids in 1152."
: "Det krig som splittrade det ziridiska riket, som styrde Ifriqiya och centrala Maghreb för fatimidkalifernas räkning i Kairo, i två sanhajaberbiska stater. Hammad ibn Buluggin, farbror till den ziridiske emiren Badis och guvernör över väst från sin nya befästa huvudstad, Qal’a i Hodnabergen, vägrade omkring 1014 att lämna ifrån sig Constantine och andra städer till Badis arvinge; han lät nämna den abbasidiske kalifen i fredagspredikan i stället för den fatimidiske och dödade shiiter i sina länder. År 1015 intog och plundrade han Béja. Badis tog Ashir, besegrade Hammad vid floden Chelif under hösten och belägrade honom i Qal’a från november, men dog i sitt läger i maj 1016, och den ziridiska armén vände hem. Hammad återvann sina länder och besegrade en ziridisk styrka nära Ashir. Den unge emiren al-Mu’izz ibn Badis besegrade honom i augusti 1017 medan Hammad belägrade Baghaya och erkände honom genom ett fördrag den 5 januari 1018, beseglat genom ett giftermål, som självständig härskare över M’Sila, Tobna, Zab, Ashir, Tahert och vad han i övrigt kunde erövra i centrala Maghreb. De två grenarna förblev rivaler i mer än ett sekel: de erkände var sin kalif, stödde rivaliserande arabiska stammar efter den hilaliska invasionen och stred vid Sbiba 1065, och hammadiderna anföll Mahdia 1135. Normanderna gjorde slut på ziridernas styre 1148 och almohaderna på hammadidernas 1152."
