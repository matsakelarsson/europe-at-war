Ziyarid–Buyid wars: Ziyaridisk-buyidiska krigen
The intermittent wars between the Ziyarids, a dynasty from Gilan founded by Mardavij in 931, and the Buyids, his former officers, over the Jibal, Tabaristan and Gorgan. After Mardavij’s murder in 935 the Buyid Hasan (Rukn al-Dawla) fought his brother and successor Vushmgir, taking Isfahan for good in 940 and Rayy in 943. Vushmgir held on to Gorgan and Tabaristan with the help of the Samanids, and the provinces changed hands repeatedly until a Samanid–Buyid treaty in 955; fighting broke out again before Vushmgir was killed by a boar while hunting in 967. In 980 his son Qabus sheltered the Buyid prince Fakhr al-Dawla and refused to give him up, and the Buyids conquered Gorgan and Tabaristan. Qabus spent eighteen years in exile in Samanid Khorasan. After Fakhr al-Dawla’s death in 997 he regained Gorgan in 998 and ruled until 1012, when his own officers deposed him; he died in captivity.: De periodvis återkommande krigen mellan ziyariderna, en dynasti från Gilan som grundades av Mardavij 931, och buyiderna, hans forna officerare, om Jibal, Tabaristan och Gorgan. Efter mordet på Mardavij 935 bekämpade buyiden Hasan (Rukn al-Dawla) hans bror och efterträdare Vushmgir och intog Isfahan för gott 940 och Rayy 943. Vushmgir höll sig kvar i Gorgan och Tabaristan med samanidernas hjälp, och provinserna bytte ägare gång på gång fram till ett samanidisk-buyidiskt fördrag 955; striderna blossade upp igen innan Vushmgir dödades av ett vildsvin under en jakt 967. År 980 gav hans son Qabus den buyidiske prinsen Fakhr al-Dawla skydd och vägrade lämna ut honom, och buyiderna erövrade Gorgan och Tabaristan. Qabus tillbringade arton år i landsflykt i det samanidiska Khorasan. Efter Fakhr al-Dawlas död 997 återtog han Gorgan 998 och härskade till 1012, då hans egna officerare avsatte honom; han dog i fångenskap.
