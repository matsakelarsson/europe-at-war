# Svenska översättningar av katalogtexten (våg 13); stegtexterna kommer senare.
Zulu civil war of 1856: Inbördeskriget i Zuluriket 1856
? "The succession war between two sons of King Mpande, decided at the battle of Ndondakusuka on the lower Tugela. Mpande, who had ruled the Zulu kingdom since 1840, named no heir, and in the 1850s his sons Cetshwayo, the eldest, and Mbuyazi, whom the king was thought to favour, built up rival followings: Cetshwayo’s party called itself the uSuthu, Mbuyazi’s the iziGqoza. In 1856 Mpande gave Mbuyazi land near the Tugela, and Mbuyazi moved south with his followers, their families and cattle, hoping for support from the Colony of Natal across the river. Cetshwayo followed with a larger army. On 2 December 1856, with the Tugela in flood behind them, the iziGqoza, about 7,000 fighting men, with the hunter John Dunn and a small party of Natal border police and African hunters on their side, were attacked by some 15,000 to 20,000 uSuthu near Ndondakusuka hill. Mbuyazi’s army broke, and his people were driven into the river: Mbuyazi and five of his brothers were killed, and the uSuthu killed many of the women and children who had come with the iziGqoza. Estimates of the dead, combatants and others, run to about 20,000, though no count was made; the place where the bodies washed up was afterwards called Mathambo, “the bones”. Cetshwayo was from then on the effective heir and, as Mpande aged, the real power in the kingdom; Mpande died in 1872 and Cetshwayo was installed in 1873. Dunn made his peace with him and became his adviser and a Zulu chief."
: "Tronföljdskriget mellan två av kung Mpandes söner, som avgjordes i slaget vid Ndondakusuka vid nedre Tugela. Mpande, som hade styrt Zuluriket sedan 1840, utsåg ingen arvinge, och på 1850-talet byggde hans söner Cetshwayo, den äldste, och Mbuyazi, som kungen ansågs gynna, upp rivaliserande anhängarskaror: Cetshwayos parti kallade sig uSuthu, Mbuyazis iziGqoza. 1856 gav Mpande Mbuyazi land nära Tugela, och Mbuyazi drog söderut med sina anhängare, deras familjer och boskap i hopp om stöd från kolonin Natal på andra sidan floden. Cetshwayo följde efter med en större armé. Den 2 december 1856, med den översvämmade Tugela bakom sig, angreps iziGqoza, omkring 7 000 stridande män som hade jägaren John Dunn och en liten grupp ur Natals gränspolis och afrikanska jägare på sin sida, av omkring 15 000 till 20 000 uSuthu nära kullen Ndondakusuka. Mbuyazis armé bröts, och hans folk drevs ut i floden: Mbuyazi och fem av hans bröder dödades, och uSuthu dödade många av de kvinnor och barn som hade följt med iziGqoza. Uppskattningarna av antalet döda, stridande och andra, uppgår till omkring 20 000, men ingen räkning gjordes; platsen där kropparna flöt i land kallades sedan Mathambo, ”benen”. Cetshwayo var därefter den faktiske arvingen och, när Mpande åldrades, den verkliga makten i riket; Mpande dog 1872 och Cetshwayo insattes 1873. Dunn försonades med honom och blev hans rådgivare och en zuluhövding."
