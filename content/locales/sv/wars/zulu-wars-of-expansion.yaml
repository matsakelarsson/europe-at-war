# Svenska översättningar av katalogtexten (våg 13); stegtexterna kommer senare.
Zulu wars of expansion and the Mfecane: Zulurikets expansionskrig och Mfecane
? "The wars in which the Zulu kingdom was built under Shaka, and the wider upheaval among the peoples of south-eastern Africa known as the Mfecane (in Sotho the Difaqane or Lifaqane). Around 1800 larger states were forming between the Phongolo and Thukela rivers, led by the Mthethwa of Dingiswayo and the Ndwandwe of Zwide. Shaka, who became chief of the small Zulu chiefdom in 1816 with Dingiswayo’s help, took over the leadership of the Mthethwa alliance after Zwide killed Dingiswayo, defeated the Ndwandwe in 1818–1820 and made the Zulu kingdom the strongest power in the region, until his assassination in September 1828. The Ndwandwe dispersed: Soshangane founded the Gaza kingdom in southern Mozambique and Zwangendaba led the Ngoni north across the Zambezi. Mzilikazi broke away from Shaka and took his Ndebele onto the highveld; the Hlubi, the amaNgwane of Matiwane and the Tlokwa of MaNthatisi fought and raided across the Caledon valley; Moshoeshoe gathered the survivors into the Basotho kingdom at Thaba Bosiu; and Sebetwane led the Kololo to the upper Zambezi. Many communities were destroyed or uprooted, and the new kingdoms remade the map of the region. Historians disagree about the causes and scale of the upheaval: older accounts blamed Shaka for one or two million deaths, while since the 1980s historians have pointed to drought, competition for land and the ivory and cattle trade at Delagoa Bay, slave and cattle raiding by Griqua and colonial groups, and the self-serving exaggerations of colonial writers."
: "De krig genom vilka Zuluriket byggdes upp under Shaka, och den större omvälvning bland folken i sydöstra Afrika som kallas Mfecane (på sotho Difaqane eller Lifaqane). Omkring 1800 höll större stater på att växa fram mellan floderna Phongolo och Thukela, ledda av Dingiswayos mthethwa och Zwides ndwandwe. Shaka, som 1816 med Dingiswayos hjälp blev hövding över det lilla zuluhövdingadömet, tog över ledningen för mthethwaalliansen sedan Zwide dödat Dingiswayo, besegrade ndwandwe 1818–1820 och gjorde Zuluriket till den starkaste makten i regionen, fram till att han mördades i september 1828. Ndwandwe skingrades: Soshangane grundade Gazariket i södra Moçambique och Zwangendaba ledde ngoni norrut över Zambezi. Mzilikazi bröt sig loss från Shaka och förde sina ndebele upp på Highveld; hlubi, Matiwanes amaNgwane och MaNthatisis tlokwa stred och plundrade över hela Caledondalen; Moshoeshoe samlade de överlevande i Basothoriket vid Thaba Bosiu; och Sebetwane ledde kololo till övre Zambezi. Många samhällen förintades eller rycktes upp med rötterna, och de nya kungarikena ritade om regionens karta. Historikerna är oense om omvälvningens orsaker och omfattning: äldre framställningar lade skulden för en eller två miljoner döda på Shaka, medan historiker sedan 1980-talet har pekat på torka, konkurrens om mark och handeln med elfenben och boskap vid Delagoabukten, slav- och boskapsräder av griqua och koloniala grupper samt koloniala skribenters självtjänande överdrifter."
