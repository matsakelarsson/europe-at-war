# Curated polities. Each polity has:
#   id        stable slug, used in border data and war files
#   name      display name
#   color     light-mode fill (pastel). Dark mode is derived automatically.
#   ink       strong colour token used when the polity leads a side in a war:
#             blue red purple orange green teal brown magenta gold slate navy olive
#   countries modern-country lens tags (ISO 3166 alpha-2, lower case)
#   aliases   historical-basemaps NAME values and/or Natural Earth adm0_a3 codes
#             that mean this polity
#   names     optional earlier names: [[until-date, name], ...], oldest first
#   label     optional preferred label position(s), [lon, lat], used when that
#             point is inside the polity and in view
# Polities not listed here are generated into polities.auto.yaml by
# `npm run draft`. Move an entry here to curate it.

