# Wave 10, writer D (Japan 774–1392): clans, warrior governments, rival courts
# and rebels that appear as sides in the wars of Heian, Kamakura and
# Nanboku-chō Japan. They own no land on the base map (Japan is one state
# throughout) and have no aliases; zones they held are drawn as areas in the
# war steps. Colours are placeholders for the coordinator.

