# Wave 10, writer E (Japan 1391–1591, from the Meitoku rebellion to the
# Kunohe rebellion): clans, leagues and regimes of the Muromachi and Sengoku
# periods that appear as sides in the wars. Japan is one state on the base map
# throughout; the domains these actors held are drawn as areas in the war
# steps. Colours are placeholders for the coordinator.
#
# Shared actors (used by other writers too): ikko-ikki, oda-clan, takeda-clan,
# uesugi-clan, mori-clan, hojo-clan, toyotomi-clan, shimazu-clan.

- id: ikko-ikki
  name: Ikkō-ikki (leagues of the Jōdo Shinshū Hongan-ji)
  color: "#e6d1bd"
  ink: gold
  countries: [jp]
