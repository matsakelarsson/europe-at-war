# Wave 10, writer F (Japan 1600–1945, Sakhalin and the Kurils): the Tokugawa,
# domains, alliances and rebels that appear as sides in the wars of Edo and
# Meiji Japan. They own no land on the base map (Japan is one state
# throughout); zones they held are drawn as areas in the war steps. Colours
# are placeholders for the coordinator.
#
# Shared actors (used by other writers too): tokugawa-shogunate (replaces the
# automatic polity of that id), choshu-domain, meiji-government.

# ---- Shared actors

- id: tokugawa-shogunate
  name: Tokugawa shogunate
  color: "#e6d1bd"
  ink: navy
  countries: [jp]

- id: choshu-domain
