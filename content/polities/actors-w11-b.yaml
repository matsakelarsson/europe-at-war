# Side-only polities for wave 11, writer B (Vietnam and Champa 930–1802).
# None of them is drawn on the base map, and none has aliases, so the drafted
# keyframes are unchanged.

- id: later-tran
  name: Later Trần (Hậu Trần)
  color: "#e6d1bd"
  ink: orange
  countries: [vn]
  # The Trần princes Trần Ngỗi (Giản Định, 1407–1409) and Trần Quý Khoáng
  # (Trùng Quang, 1409–1414) and their armies, who rose against Ming rule in
  # Jiaozhi.
- id: lam-son
  name: Lam Sơn army (Lê Lợi)
  color: "#e6d1bd"
  ink: green
  countries: [vn]
  # Lê Lợi's movement, raised at Lam Sơn in Thanh Hóa in 1418, until he took
  # the throne as the first emperor of the Later Lê dynasty in 1428 (from then
  # on `dai-viet`).
