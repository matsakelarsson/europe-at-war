# Side-only polities for wave 11, writer C (Burma, Siam, Laos and Cambodia,
# 1547–1812). None of them is drawn on the base map, and none has aliases, so
# the drafted keyframes are unchanged.

- id: toungoo-principality
  name: Toungoo (Minye Thihathu II and Natshinnaung)
  color: "#e6d1bd"
  ink: purple
  countries: [mm]
  # The lords of Toungoo who broke with Nanda Bayin in 1597, joined Arakan in
  # the siege of Pegu (1599) and held Toungoo until Anaukpetlun took it in
  # 1610.
- id: phitsanulok-regime
  name: Phitsanulok (Chao Phitsanulok)
  color: "#e6d1bd"
  ink: orange
  countries: [th]
  # The governor of Phitsanulok, Rueang, who made himself ruler of the north
  # after the fall of Ayutthaya (1767) until Chao Phra Fang took his city in
  # 1768.
- id: phimai-regime
  name: Phimai (Prince Thepphiphit)
  color: "#e6d1bd"
  ink: teal
  countries: [th]
  # Prince Thepphiphit, a son of King Borommakot, and his regime on the Khorat
  # plateau (1767–1768).
- id: nakhon-si-thammarat-regime
  name: Nakhon Si Thammarat (Chao Nakhon)
  color: "#e6d1bd"
  ink: green
  countries: [th]
  # The acting governor Nu, who ruled the south from Nakhon Si Thammarat
  # after 1767 until Taksin took the city in 1769.
- id: fang-regime
  name: Sawangkhaburi (Chao Phra Fang)
  color: "#e6d1bd"
  ink: magenta
  countries: [th]
  # The monk Ruean, known as Chao Phra Fang, and his followers, who ruled the
  # upper Nan valley from Sawangkhaburi (Fang, near Uttaradit) from 1767 and
  # Phitsanulok from 1768 until Taksin took both in 1770.
- id: cham-malay-forces-cambodia
  name: Cham and Malay forces (Okhna Laksmana)
  color: "#e6d1bd"
  ink: olive
  countries: [kh]
  # The Cham and Malay community of Cambodia and its leader, the Laksmana,
  # who destroyed the Spanish and Portuguese party at Phnom Penh in 1599.
