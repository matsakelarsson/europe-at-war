# Wave 11, writer D (the mainland 1824–1945): movements, armies and parties
# that appear as sides in the wars of Burma, Siam, Laos, Cambodia and Vietnam
# between the First Anglo-Burmese War and the Japanese coup of 1945. They own
# no land on the base map and have no aliases; zones they held are drawn as
# areas in the war steps. Colours are placeholders for the coordinator.

# ---- Shared actors (used by other wave 11 writers)

