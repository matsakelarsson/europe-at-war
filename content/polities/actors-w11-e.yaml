# Wave 11, writer E (the islands 1016–1606): rival kings, courts, port
# states and fleets that appear as sides in the wars of Java, Sumatra, the
# Malay Peninsula, the Philippines and Maluku from the fall of Medang to the
# Spanish conquest of the Philippines. None of them owns land on the base map
# and none has aliases, so the drafted keyframes are unchanged. Colours are
# placeholders for the coordinator.

