# Wave 11, writer F (Indonesia and Malacca, 1606–1830): the movements,
# rebel princes, local communities and leaders' armies that appear as sides
# in the wars of the Dutch East India Company and the Javanese, Moluccan and
# Sumatran states. They own no land on the base map and have no aliases; the
# zones they held are drawn as areas in the war steps. Colours are
# placeholders for the coordinator.
#
# Shared actor (used by other writers too): padri.

