# Wave 11, writer G (Malaya, Borneo and Indonesia, 1821–1914): the
# communities, chiefs, kongsis and movements that appear as sides in the wars
# of the Malay states, Borneo, Sumatra, Bali and Lombok against Siam, the
# British, the Dutch, the Brooke Raj and the North Borneo Chartered Company.
# They own no land on the base map and have no aliases; where they held
# ground it is drawn as areas in the war steps. Colours are placeholders for
