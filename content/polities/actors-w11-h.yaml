# Wave 11, writer H (the Philippines, 1578–1913): movements, revolutionary
# governments, communities in revolt and raiding fleets that appear as sides
# in the wars of the Spanish and early American Philippines. None of them owns
# land on the base map and none has aliases, so the drafted keyframes are
# unchanged; the land they held is drawn as areas in the war steps. Colours
# are placeholders for the coordinator. `katipunan` and
# `first-philippine-republic` are shared with the other wave 11 writers.

