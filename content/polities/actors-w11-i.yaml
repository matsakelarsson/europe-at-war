# Wave 11, writer I (Southeast Asia, 1926–1962): parties, armies, movements
# and Japanese-sponsored governments that appear as sides in the wars of the
# Second World War, the end of empire and the first years of independence.
# They own no land on the base map and have no aliases; the zones they held
# are drawn as areas in the war steps. Colours are placeholders for the
# coordinator. Other writers may use any of these (writer J2 uses
# `malayan-communist-party`). The Communist Party of Indonesia (`pki`), used
# in the revolts of 1926–1927 and the Madiun affair, is in writer J2's file.

- id: viet-minh
  name: Viet Minh
  color: "#e6d1bd"
  ink: red
  countries: [vn, la, kh]
- id: malayan-communist-party
