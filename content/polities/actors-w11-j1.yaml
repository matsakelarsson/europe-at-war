# Wave 11, writer J1 (Indochina, Thailand and Myanmar since 1948): parties,
# fronts, armies and governments in exile that appear as sides in the wars of
# Vietnam, Laos, Cambodia, Thailand and Myanmar after independence. They own
# no land on the base map and have no aliases; the zones they held are drawn
# as areas in the war steps. Colours are placeholders for the coordinator.

