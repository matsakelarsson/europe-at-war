# Side-only polities for wave 11, writer J2 (the islands of Southeast Asia
# since 1950). None of them is drawn on the base map, and none has aliases,
# so the drafted keyframes are unchanged. Shared with other writers:
# new-peoples-army, mnlf, milf, fretilin, free-aceh-movement,
# free-papua-movement.

- id: new-peoples-army
  name: New People’s Army
  color: "#e6d1bd"
  ink: red
  countries: [ph]
  # The armed wing of the Communist Party of the Philippines (founded
  # 26 December 1968), formed on 29 March 1969; the National Democratic
  # Front of the Philippines (1973) negotiates for both.
- id: mnlf
  name: Moro National Liberation Front
  color: "#e6d1bd"
  ink: green
  countries: [ph]
- id: milf
  name: Moro Islamic Liberation Front
  color: "#e6d1bd"
  ink: teal
  countries: [ph]
  # Split from the MNLF under Hashim Salamat (1977, the name from 1984);
  # its army is the Bangsamoro Islamic Armed Forces.
- id: abu-sayyaf
  name: Abu Sayyaf
  color: "#e6d1bd"
  ink: slate
  countries: [ph]
- id: maute-group
  name: Maute group
  color: "#e6d1bd"
  ink: slate
  countries: [ph]
  # Also called Dawlah Islamiyah (Islamic State of Lanao); led by the
  # brothers Omar and Abdullah Maute of Butig, Lanao del Sur.
- id: fretilin
  name: Fretilin
  color: "#e6d1bd"
  ink: red
  countries: [tl]
  # Revolutionary Front for an Independent East Timor (from 1974) and its
  # army, Falintil; from 1987 Falintil stood apart from the party under
  # Xanana Gusmão’s National Council of Maubere (later Timorese) Resistance.
- id: free-aceh-movement
  name: Free Aceh Movement
  color: "#e6d1bd"
  ink: red
  countries: [id]
  # Gerakan Aceh Merdeka (GAM), proclaimed by Hasan di Tiro on
  # 4 December 1976; its army was the Tentara Neugara Aceh (TNA).
- id: free-papua-movement
  name: Free Papua Movement
  color: "#e6d1bd"
  ink: red
  countries: [id]
  # Organisasi Papua Merdeka (OPM) and its armed wings, today mostly the
  # West Papua National Liberation Army (TPNPB).
- id: prri
  name: Revolutionary Government of the Republic of Indonesia
  color: "#e6d1bd"
  ink: purple
  countries: [id]
  # PRRI, proclaimed at Padang on 15 February 1958.
- id: permesta
  name: Permesta
  color: "#e6d1bd"
  ink: purple
  countries: [id]
  # Piagam Perjuangan Semesta (Charter of Universal Struggle), proclaimed in
  # Makassar on 2 March 1957, later based in Manado.
- id: tnku
  name: North Kalimantan National Army
  color: "#e6d1bd"
  ink: red
  countries: [bn, my]
  # Tentara Nasional Kalimantan Utara (TNKU), the armed wing of the Brunei
  # People’s Party (Partai Rakyat Brunei) under A. M. Azahari.
- id: north-kalimantan-communist-party
  name: North Kalimantan Communist Party
  names: [["1970-03-30", Sarawak Communist Organisation]]
  color: "#e6d1bd"
  ink: red
  countries: [my]
  # The communist underground of Sarawak (the British called it the
  # Clandestine Communist Organisation) and its guerrillas, the Sarawak
  # People’s Guerrilla Force (PGRS, 1964) and the North Kalimantan People’s
  # Army (PARAKU, 1965).
- id: g30s
  name: 30 September Movement
  color: "#e6d1bd"
  ink: red
  countries: [id]
- id: pki
  name: Communist Party of Indonesia
  color: "#e6d1bd"
  ink: red
  countries: [id]
- id: royal-sulu-forces
  name: Royal Security Forces of the Sultanate of Sulu
  color: "#e6d1bd"
  ink: green
  countries: [ph, my]
  # The armed followers of Jamalul Kiram III, one of several claimants to
  # the title of Sultan of Sulu, who landed at Lahad Datu in 2013.
- id: laskar-jihad
  name: Laskar Jihad
  color: "#e6d1bd"
  ink: green
  countries: [id]
