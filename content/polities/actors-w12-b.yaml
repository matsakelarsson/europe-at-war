# Side-only polities for wave 12, writer B (the Maghreb 1160–1560).
# None of them is drawn on the base map, and none has aliases, so the drafted
# keyframes are unchanged.

- id: banu-ghaniya
  name: Banu Ghaniya
  color: "#e6d1bd"
  ink: brown
  countries: [tn, dz, ly, es]
  # The Almoravid family that ruled the Balearic Islands after 1126, and the
  # army that Ali and Yahya ibn Ghaniya led in Ifriqiya and the central
  # Maghreb from 1184 to the 1230s. Their island emirate is `majorca` (Taifa
  # of Mallorca until 1203).
- id: qaraqush
  name: Qaraqush and the Ghuzz
  color: "#e6d1bd"
  ink: teal
  countries: [ly, tn]
  # Sharaf al-Din Qaraqush, an Armenian mamluk in the service of Saladin's
  # nephew Taqi al-Din, and his Turkish (Ghuzz) troops, who held Tripoli and
  # parts of southern Ifriqiya from the 1170s until his death in 1212.
- id: kuku
  name: Kingdom of Kuku
  color: "#e6d1bd"
  ink: olive
  countries: [dz]
  # The Kabyle principality of Ahmad ibn al-Qadi and his successors in the
  # Djurdjura mountains, first an ally and then a rival of the Barbarossa
  # brothers; it held Algiers in about 1520–1525.
- id: fez-sharifs
  name: Sharifs of Fez
  color: "#e6d1bd"
  ink: green
  countries: [ma]
  # The sharifian government of Muhammad ibn Imran (al-Juti) in Fez after the
  # revolt of 1465, until the Wattasid Muhammad al-Shaykh took the city in
  # 1471–1472.
