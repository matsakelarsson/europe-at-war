# Wave 12, writer C (the Maghreb 1550–1830): claimants, rival princes,
# religious and military leaders that appear as sides in the Saadian and
# Alaouite wars in Morocco, the Battle of Alcácer Quibir and the First
# Barbary War. None of them owns land on the base map and none has aliases,
# so the drafted keyframes are unchanged; the lands they held are drawn as
# areas in the war steps. Colours are placeholders for the coordinator.

- id: mutawakkil
  name: Abu Abdallah Mohammed al-Mutawakkil
  color: "#e6d1bd"
  ink: orange
  countries: [ma]
  # The Saadian sultan of 1574–1576, driven out by his uncle Abd al-Malik
  # with Ottoman help in 1576; he came back with King Sebastian of Portugal
  # and drowned at Alcácer Quibir (1578).
- id: saadi-fez
  name: Saadian sultans of Fez
  color: "#e6d1bd"
  ink: purple
  countries: [ma]
  # Ahmad al-Mansur’s sons Mohammed al-Shaykh al-Ma’mun and Abu Faris and
  # al-Ma’mun’s sons Abdallah al-Ghalib II and Abd al-Malik al-Mu’tasim, who
  # ruled from Fez (and at times Marrakesh) against Zidan in 1603–1627.
- id: abu-mahalli
  name: Ahmad ibn Abi Mahalli
  color: "#e6d1bd"
  ink: brown
  countries: [ma]
  # The religious scholar who declared himself the Mahdi, rose in Tafilalt
  # and the Draa and held Marrakesh in 1612–1613.
- id: al-ayyashi
  name: Muhammad al-Ayyashi
  color: "#e6d1bd"
  ink: teal
  countries: [ma]
  # The marabout and war leader of the Atlantic plains who fought the
  # Spanish and Portuguese presidios, broke with Zidan and held Salé from
  # 1627 until his death in 1641.
- id: dilaiyya
  name: Dila’iyya (zawiya of Dila)
  color: "#e6d1bd"
  ink: olive
  countries: [ma]
  # The Sufi lodge of Dila in the Middle Atlas and the state its leaders
  # built in central and northern Morocco (Fez 1641–1662), ended by al-Rashid
  # in 1668.
- id: ghailan
  name: al-Khadir Ghailan
  color: "#e6d1bd"
  ink: green
  countries: [ma]
  # The war leader of the Habt and the north-west, who fought Portuguese and
  # English Tangier and held the region around Ksar el-Kebir, Asilah and
  # Tetouan until al-Rashid defeated him (1666–1667).
- id: muhammad-ibn-sharif
  name: Muhammad ibn Sharif (Tafilalt)
  color: "#e6d1bd"
  ink: brown
  countries: [ma]
  # The Alaouite ruler of Tafilalt and the east until 1664, half-brother
  # and rival of al-Rashid, killed at Angad in 1664.
- id: hamet-karamanli
  name: Hamet Karamanli and William Eaton’s force
  color: "#e6d1bd"
  ink: orange
  countries: [ly, eg]
  # Yusuf Karamanli’s deposed elder brother and the force of Greek, Arab and
  # Berber soldiers and US Marines that marched with him from Egypt to Derna
  # in 1805.
