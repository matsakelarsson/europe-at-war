# Wave 12, writer D (the Maghreb and Libya 1830–1956): movements, armies,
# confederations and claimants that appear as sides in the French conquests
# of Algeria, Tunisia and Morocco, the Spanish and Italian wars in Morocco and
# Libya, the North African campaign of 1940–1943 and the struggles for
# Tunisian and Moroccan independence. None of them owns land on the base map
# and none has aliases, so the drafted keyframes are unchanged; zones they
# held are drawn as areas in the war steps. `abd-al-qadir` and `senussi` are
# shared with the other wave 12 writers (`rif-republic` already exists in
# wars-south-modern.yaml). Colours are placeholders for the coordinator.

# ---- Shared actors

- id: abd-al-qadir
  name: Emirate of Abd al-Qadir
  color: "#e6d1bd"
  ink: green
  countries: [dz]

- id: senussi
  name: Senussi order
  color: "#e6d1bd"
  ink: olive
  countries: [ly, eg, td]

