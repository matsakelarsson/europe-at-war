# Wave 12, writer E (the Maghreb and Libya since 1945): movements, armies,
# rival governments and armed groups that appear as sides in the Algerian
# War, the wars of Western Sahara, the Algerian Civil War, the insurgency in
# the Maghreb and the Libyan wars of 2011 and 2014–2020. None of them owns
# land on the base map and none has aliases, so the drafted keyframes are
# unchanged. `fln`, `polisario`, `aqim`, `lna` and `ntc` are shared with the
# other wave 12 writers. Colours are placeholders for the coordinator.

- id: fln
  name: National Liberation Front (FLN)
  color: "#e6d1bd"
  ink: green
  countries: [dz]
