# Wave 12, writer F (the Sahel 800–1660): Tuareg confederations, claimants,
# Saharan movements and one Hausa-land kingdom that appear as sides in the
# wars of Mali, Songhai, Kanem-Bornu and the western Sahara. None of them owns
# land on the base map and none has aliases, so the drafted keyframes are
# unchanged; where they held ground it is drawn as areas in the war steps.
# Kebbi (in today's Nigeria) may become a base-map polity when Africa south of
# the Sahara is added. Colours are placeholders for the coordinator.

- id: maghsharen
  name: Maghsharen Tuareg
  color: "#e6d1bd"
  ink: purple
  countries: [ml]
- id: sonni-baru
  name: Sonni Baru’s followers
  color: "#e6d1bd"
  ink: brown
  countries: [ml, ne]
- id: kebbi
  name: Kingdom of Kebbi
  color: "#f5dccc"
  ink: green
  countries: [ng, ne]
- id: nasir-al-din
  name: Nasir al-Din’s movement (the zawaya)
  color: "#e6d1bd"
  ink: green
  countries: [mr, sn]
- id: banu-hassan
  name: Banu Hassan (Banu Maghfar)
  color: "#e6d1bd"
  ink: brown
  countries: [mr]
