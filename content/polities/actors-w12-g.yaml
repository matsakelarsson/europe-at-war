# Wave 12, writer G (the Sahel 1660–1960): confederations, scholarly
# lineages, emirates without a polity of their own on the base map, and the
# movements and risings that appear as sides in the wars of Ségou, Massina,
# Umar Tall, Samori, Rabih and the French conquest of the Sahel and the
# Sahara. None of them owns land on the base map and none has aliases, so
# the drafted keyframes are unchanged; where they held ground it is drawn as
# areas in the war steps. Colours are placeholders for the coordinator.

