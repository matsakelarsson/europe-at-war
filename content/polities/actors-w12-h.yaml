# Wave 12, writer H (the Sahel since 1960): rebel movements, armed groups,
# a UN mission and a mercenary force that appear as sides in the wars of
# Chad, Mali, Niger and Burkina Faso since independence. None of them owns
# land on the base map and none has aliases, so the drafted keyframes are
# unchanged; the land they held is drawn as areas in the war steps. Colours
# are placeholders for the coordinator. `frolinat`, `mnla`, `jnim` and
# `wagner` are shared with the other wave 12 writers.

- id: frolinat
  name: National Liberation Front of Chad (FROLINAT)
  color: "#e6d1bd"
  ink: green
  countries: [td]
- id: fan-habre
  name: Armed Forces of the North (FAN, Hissène Habré)
  color: "#e6d1bd"
  ink: red
  countries: [td]
- id: gunt
