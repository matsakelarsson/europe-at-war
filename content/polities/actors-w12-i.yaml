# Wave 12, writer I (Sudan and South Sudan): movements, armies, militias and
# groups that appear as sides in the wars of Sudan and South Sudan. They own
# no land on the base map and have no aliases; the zones they held are drawn
# as areas in the war steps. Colours are placeholders for the coordinator.
# Shared with the other wave 12 writers: `anyanya`, `splm`, `rsf`, `sla-jem`
# and `splm-io`.

- id: abdallab
  name: Abdallab
  color: "#e6d1bd"
  ink: olive
  countries: [sd]
- id: shayqiyya
  name: Shayqiyya confederation
  color: "#e6d1bd"
  ink: brown
  countries: [sd]
- id: jaaliyyin
  name: Ja’aliyyin of Shendi
  color: "#e6d1bd"
  ink: olive
  countries: [sd]
- id: zubayr
  name: Al-Zubayr Rahma Mansur’s forces
  color: "#e6d1bd"
  ink: red
  countries: [sd, ss]
- id: anyanya
  name: Anyanya
  color: "#e6d1bd"
  ink: green
  countries: [ss]
  # From 1971 the Anyanya were united under Joseph Lagu as the Southern Sudan
  # Liberation Movement (SSLM); the side names say so where it matters.
- id: splm
  name: SPLM/SPLA
  color: "#e6d1bd"
  ink: green
  countries: [ss, sd]
- id: spla-nasir
  name: SPLA-Nasir
  color: "#e6d1bd"
  ink: teal
  countries: [ss]
  # Riek Machar's faction of 1991, later the SPLA-United (Lam Akol) and the
  # South Sudan Independence Movement (SSIM), which signed the Khartoum Peace
  # Agreement of 1997.
- id: splm-n
  name: SPLM-North
  color: "#e6d1bd"
  ink: teal
  countries: [sd]
- id: rsf
  name: Rapid Support Forces
  names: [["2013-08-01", Janjaweed]]
  color: "#e6d1bd"
  ink: orange
  countries: [sd]
- id: sla-jem
  name: Darfur rebel movements (SLM/A and JEM)
  color: "#e6d1bd"
  ink: purple
  countries: [sd]
- id: splm-io
  name: SPLM/A-in-Opposition
  color: "#e6d1bd"
  ink: teal
  countries: [ss]
- id: white-army
  name: Nuer White Army
  color: "#e6d1bd"
  ink: slate
  countries: [ss]
