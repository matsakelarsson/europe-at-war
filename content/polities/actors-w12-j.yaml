# Wave 12, writer J (the Horn of Africa to 1900): people, lords and states
# that appear as sides in the wars of the Ethiopian highlands and their
# neighbours from Gudit to Menelik II, and that the base map does not show as
# polities of their own. None has aliases, so the drafted keyframes are
# unchanged; the lands they held or fought over are drawn as areas in the war
# steps. Colours are placeholders for the coordinator.

- id: gudit
  name: Queen Gudit (Yodit) and her followers
  color: "#e6d1bd"
  ink: brown
  countries: [et, er]

- id: oromo-gadaa
  name: Oromo (Borana and Barentu groups)
  color: "#e6d1bd"
  ink: olive
  countries: [et]

- id: medri-bahri
  name: Medri Bahri (the Bahr Negash)
  color: "#e6d1bd"
  ink: navy
  countries: [er]

- id: yejju-regency
  name: Ras Ali II and the Yejju regency
  color: "#e6d1bd"
  ink: brown
  countries: [et]

- id: wube-semien
  name: Dejazmach Wube of Semien and Tigray
  color: "#e6d1bd"
  ink: purple
  countries: [et, er]

- id: ethiopian-rebel-lords
  name: Regional lords in revolt against Tewodros II
  color: "#e6d1bd"
  ink: olive
  countries: [et]

- id: gojjam
  name: Kingdom of Gojjam
  color: "#e6d1bd"
  ink: teal
  countries: [et]

- id: wolaita
  name: Kingdom of Wolaita
  color: "#e6d1bd"
  ink: orange
  countries: [et]
