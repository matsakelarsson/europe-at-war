# Wave 12, writer K1 (the Horn of Africa 1899–1974): movements and armies
# that appear as sides in the Somaliland campaign, the Italian occupation of
# Ethiopia and its resistance, and the Eritrean War of Independence. None of
# them owns land on the base map and none has aliases, so the drafted
# keyframes are unchanged; the zones they held are drawn as areas in the war
# steps. All four are shared with the other wave 12 writers. Colours are
# placeholders for the coordinator.

- id: dervish-state
  name: Dervish State (Daraawiish)
  color: "#e6d1bd"
  ink: brown
  countries: [so, et]

- id: arbegnoch
  name: Ethiopian Patriots (Arbegnoch)
  color: "#e6d1bd"
  ink: gold
  countries: [et]

- id: elf
  name: Eritrean Liberation Front
  color: "#e6d1bd"
  ink: green
  countries: [er]

- id: eplf
  name: Eritrean People’s Liberation Front
  color: "#e6d1bd"
  ink: red
  countries: [er]
