# Wave 12, writer K2 (the Horn of Africa since 1974): movements, fronts,
# militias and armed groups that appear as sides in the Ethiopian Civil War,
# the Ogaden War, the wars of Somalia and Somaliland, the Djiboutian Civil War,
# the Tigray War and the wars in Amhara and Oromia. None of them owns land on
# the base map and none has aliases, so the drafted keyframes are unchanged;
# the zones they held are drawn as areas in the war steps. `tplf`, `wslf`,
# `snm`, `icu`, `al-shabaab`, `fano` and `ola` are shared with the other
# wave 12 writers. Colours are placeholders for the coordinator.

- id: tplf
  name: Tigray People’s Liberation Front
  color: "#e6d1bd"
  ink: orange
  countries: [et]
- id: wslf
  name: Western Somali Liberation Front
  color: "#e6d1bd"
  ink: teal
  countries: [et, so]
- id: snm
  name: Somali National Movement
  color: "#e6d1bd"
  ink: green
  countries: [so]
- id: usc
