# Wave 13, writer A (West Africa 1000–1800): states, dynasties and peoples
# that appear as sides in the wars of the Akan forest, the Gold Coast, the
# Hausa lands, Futa Toro and Futa Jallon but are not on the base map. None has
# aliases, so the drafted keyframes are unchanged; where they held ground it is
# drawn as areas in the war steps. Akyem (Abuakwa and Kotoku) and Kwararafa
# held territory and may later become base-map polities. Colours are
# placeholders for the coordinator.

- id: akyem
  name: Akyem (Abuakwa and Kotoku)
  color: "#cae5d6"
  ink: teal
  countries: [gh]
