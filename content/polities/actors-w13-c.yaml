# Wave 13, writer C (Senegambia, Upper Guinea and the colonial wars to 1918):
# Muslim reform movements, the parties of the Soninke–Marabout wars, and
# peoples without a state of their own on the base map who fought as such in
# Sierra Leone, Liberia and Portuguese Guinea. None of them owns land on the
# base map and none has aliases; where they held ground it is drawn as areas
# in the war steps. Colours are placeholders for the coordinator.

