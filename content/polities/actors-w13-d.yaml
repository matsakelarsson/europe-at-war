# Wave 13, writer D (West Africa since 1945): secessionist states, rebel
# movements, armed groups and regional forces that appear as sides in the
# wars of Nigeria, Cameroon, Senegal, Guinea-Bissau, Liberia, Sierra Leone,
# Côte d'Ivoire and the Gambia since 1945. None of them owns land on the base
# map and none has aliases, so the drafted keyframes are unchanged; the land
# they held is drawn as areas in the war steps. Colours are placeholders for
# the coordinator. `biafra`, `boko-haram`, `iswap`, `npfl`, `ruf`, `ecomog`
# and `paigc` are shared with the other wave 13 writers.

- id: biafra
  name: Republic of Biafra
  color: "#e9dcc4"
  ink: orange
  countries: [ng]
