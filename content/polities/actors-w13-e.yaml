# Wave 13, writer E (Central Africa to 1960): invaders, mercenary bands,
# breakaway provinces, religious movements, traders' armies and insurgents
# that appear as sides in the wars of Kongo, Ndongo and Matamba, the Congo
# Free State, Portuguese Angola and French Equatorial Africa. None of them
# owns land on the base map and none has aliases, so the drafted keyframes are
# unchanged; the land they held is drawn as areas in the war steps. `soyo` is
# a state (Kongo's province of Soyo, independent in practice from the 1640s)
# that the coordinator may want to move to the base map. Colours are
# placeholders for the coordinator.

- id: jaga
  name: Jaga
  color: "#ecdcc4"
  ink: orange
  countries: [ao, cd]
- id: imbangala
  name: Imbangala bands and the Kasanje kingdom
  color: "#e4e0c6"
  ink: olive
  countries: [ao]
- id: soyo
  name: Soyo
  color: "#d3e6e2"
  ink: teal
  countries: [ao]
- id: antonians
  name: Antonian movement
  color: "#efe5c2"
  ink: gold
  countries: [ao]
- id: congo-arabs
  name: Swahili-Arab traders of the Upper Congo
  color: "#ecd6d0"
  ink: red
  countries: [cd, tz]
- id: batetela-rebels
  name: Tetela soldiers in revolt
  color: "#ecdcc4"
  ink: orange
  countries: [cd]
- id: dembos
  name: Dembos chiefdoms
  color: "#e4e0c6"
  ink: olive
  countries: [ao]
- id: kongo-wara
  name: Kongo-Wara insurgents
  color: "#ecdcc4"
  ink: orange
  countries: [cf, cm, cg, td]
