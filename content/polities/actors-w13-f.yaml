# Wave 13, writer F (Central Africa since 1960): liberation movements,
# rebel movements, militias, secessionist states and UN forces that appear
# as sides in the wars of Angola, the two Congos and the Central African
# Republic since independence. None of them owns land on the base map and
# none has aliases, so the drafted keyframes are unchanged; the land they
# held is drawn as areas in the war steps. Colours are placeholders for the
# coordinator. `mpla`, `unita`, `fnla`, `afdl`, `rcd`, `m23`, `seleka`,
# `anti-balaka` and `un-peacekeepers` are shared with the other wave 13
# writers.

- id: mpla
  name: People’s Movement for the Liberation of Angola (MPLA)
  color: "#e9d3c4"
  ink: red
  countries: [ao]
- id: unita
  name: National Union for the Total Independence of Angola (UNITA)
  color: "#e5e0c8"
  ink: green
  countries: [ao]
