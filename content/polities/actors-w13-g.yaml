# Wave 13, writer G (East Africa and Madagascar to 1945): movements, parties,
# a chartered company and peoples without a polity of their own on the base
# map, used as sides in the wars of the Swahili coast, Buganda, the German and
# British conquests and Madagascar. None of them owns land on the base map and
# none has aliases, so the drafted keyframes are unchanged; where they held
# ground it is drawn as areas in the war steps. Colours are placeholders for
# the coordinator.

