# Wave 13, writer H (East Africa and the Indian Ocean since 1945): rebel
# movements, armies, parties and militias that appear as sides in the wars of
# Kenya, Uganda, Rwanda, Burundi, Zanzibar, Madagascar and the Comoros. None of
# them owns land on the base map and none has aliases, so the drafted keyframes
# are unchanged; the land they held is drawn as areas in the war steps. Colours
# are placeholders for the coordinator. `mau-mau`, `lra`, `rpf`, `nrm` and
# `adf` are shared with the other wave 13 writers.

- id: mau-mau
  name: Mau Mau (Kenya Land and Freedom Army)
  color: "#e3dcc4"
  ink: green
  countries: [ke]
- id: lra
