# Wave 13, writer I (Southern Africa to 1880): peoples without a state,
# movements, factions and emigrant communities that appear as sides in the wars
# of the Cape, Natal, Zululand, the highveld and the Zimbabwe plateau before
# 1880. None of them owns land on the base map and none has aliases, so the
# drafted keyframes are unchanged; the land they held is drawn as areas in the
# war steps. Colours are placeholders for the coordinator.

