# Wave 13, writer J1 (Southern Africa 1880–1918): peoples, movements and
# armed groups that appear as sides in the First Boer War, the Matabele wars,
# the Herero and Nama war, the Bambatha rising, the South West Africa
# campaign (the Maritz Rebellion) and the Chilembwe rising. None of them owns
# land on the base map and none has aliases, so the drafted keyframes are
