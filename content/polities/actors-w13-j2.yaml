# Wave 13, writer J2 (Southern Africa since 1945): liberation movements,
# rebel groups and their armies that appear as sides in the wars of
# Mozambique, Rhodesia/Zimbabwe, Namibia, Angola and South Africa. None of
# them owns land on the base map and none has aliases, so the drafted
# keyframes are unchanged; the land they held is drawn as areas in the war
# steps. Colours are placeholders for the coordinator. `frelimo`, `renamo`,
# `zanu`, `zapu`, `swapo` and `anc` are shared with the other wave 13
# writers.

- id: frelimo
  name: Mozambique Liberation Front (FRELIMO)
  color: "#e3d9c6"
  ink: red
  countries: [mz]
- id: renamo
  name: Mozambican National Resistance (RENAMO)
  color: "#dfe3c6"
  ink: green
  countries: [mz]
- id: zanu
  name: Zimbabwe African National Union (ZANU) and its army (ZANLA)
  color: "#e3d6c6"
  ink: green
  countries: [zw]
- id: zapu
  name: Zimbabwe African People’s Union (ZAPU) and its army (ZIPRA)
  color: "#d6d9e8"
  ink: orange
  countries: [zw]
- id: swapo
  name: South West Africa People’s Organisation (SWAPO) and its army (PLAN)
  color: "#d6e3e8"
  ink: blue
  countries: [na]
- id: anc
  name: African National Congress (ANC) and Umkhonto we Sizwe (MK)
  color: "#e3e0c6"
  ink: green
  countries: [za]
