# Wave 14, writer A (Mesoamerica 1400–1620): city-states, lineages and
# peoples that appear as sides in the wars of central Mexico, Yucatán and the
# north-west but are not on the base map (or not apart from a larger state).
# None has aliases, so the drafted keyframes are unchanged; where they held
# ground it is drawn as areas in the war steps. `chichimecs` and `caxcanes`
# are shared with the other wave 14 writers. Colours are placeholders for the
# coordinator.

