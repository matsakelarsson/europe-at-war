# Side-only polities for wave 14, writer B (the Caribbean 1492–1797).
# None of them has aliases. `taino`, `kalinago` and `garifuna` share their ids
# with automatic polities in polities.auto.yaml, which the curated entries here
# supersede: the 1400 and 1492 keyframes draw `taino` (Greater Antilles,
# Bahamas) and `kalinago` (Lesser Antilles, 1400 only) with these names and
# colours, and the 1492 keyframe draws `garifuna` in Belize, which is a draft
# error (the Garifuna reached Central America in 1797).

- id: taino
  name: Taíno
  color: "#efe3c8"
  ink: brown
  countries: [do, ht, pr, cu, jm, bs]
  # The Taíno peoples of the Greater Antilles and the Bahamas (the Lucayans):
  # the chiefdoms (cacicazgos) of Hispaniola, Borikén (Puerto Rico) and Cuba,
  # and the rebels of the Bahoruco under Enriquillo (1519–1533).
- id: kalinago
  name: Kalinago
  color: "#e3ecd0"
  ink: olive
  countries: [kn, gp, mq, dm, vc, lc, gd, ag, ms]
  # The Kalinago (Island Caribs) of the Lesser Antilles, called "Yellow" or
  # "Red Caribs" by the British on Saint Vincent to tell them from the Garifuna.
- id: garifuna
  name: Garifuna
  color: "#d3ece6"
  ink: teal
  countries: [vc]
  # The Garifuna ("Black Caribs") of Saint Vincent, of Kalinago and African
  # descent, who fought the Carib Wars of 1769–1773 and 1795–1797 and were
  # deported to Roatán in 1797.
- id: jamaican-maroons
  name: Jamaican Maroons
  color: "#dcebd2"
  ink: green
  countries: [jm]
  # The free communities of formerly enslaved Africans in the mountains of
  # Jamaica: the Spanish-era maroons of Juan de Bolas and Juan de Serras
  # (1655–1660s), and the Windward (Nanny, Quao) and Leeward (Cudjoe,
  # Accompong) Maroons of the First Maroon War (1728–1739/40).
- id: tackys-rebels
  name: Tacky’s and Apongo’s rebels
  color: "#f1dbe6"
  ink: magenta
  countries: [jm]
  # The enslaved Coromantee (Akan) people who rose in Jamaica in 1760–1761
  # under Tacky in Saint Mary and Apongo (Wager) and Simon in Westmoreland.
- id: st-john-rebels
  name: Akwamu rebels of Saint John
  color: "#f4e1cf"
  ink: orange
  countries: [vi]
  # The enslaved Akwamu people who held most of Danish Saint John from
  # November 1733 to the spring of 1734.
