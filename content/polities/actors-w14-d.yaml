# Wave 14, writer D (colonial wars in North America, 1702–1774): Native
# nations and confederacies and the Acadian militia, who fought as sides in
# the wars of Queen Anne, the Tuscarora, Fox, Yamasee, Natchez and Chickasaw
# wars, the War of Jenkins’ Ear, King George’s War, Father Le Loutre’s War,
# the French and Indian War, the Anglo-Cherokee War, Pontiac’s War and Lord
# Dunmore’s War. None of them owns land on the base map, and none has
# aliases, so the drafted keyframes are unchanged; the lands they held are
# drawn as areas in the war steps. Some ids (cherokee, choctaw, shawnee,
# natchez, odawa, catawba) were automatic polities from historical-basemaps;
# these curated entries take their place. Colours are placeholders for the
# coordinator. The first twelve are shared with the other wave 14 writers.

