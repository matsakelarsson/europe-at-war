# Wave 14, writer F (Mexico and Texas, 1810–1901): insurgent armies, the
# parties and their armies in the civil wars of the Reform and the French
# intervention, Maximilian’s empire as a side, the Republic of Yucatán and
# the peoples who fought Mexico as such (the Maya of the Caste War and the
# Yaqui). None of them owns land on the base map and none has aliases, so the
# drafted keyframes are unchanged; the land they held is drawn as areas in
# the war steps. Colours are placeholders for the coordinator.
# `mexican-insurgents`, `mexican-conservatives`, `mexican-liberals`,
# `mexican-imperialists`, `maya-rebels` and `yaqui` are shared with the other
# wave 14 writers.

