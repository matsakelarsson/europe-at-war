# Wave 14, writer G1 (the East, the South, Utah and Canada, 1817–1885):
# Native nations, rebel movements and militias without a polity of their own
# on the base map, used as sides in the Seminole wars, the Black Hawk War, the
# rebellions of 1837–1838, the Mormon War and the Utah War, the Fenian raids
# and the Métis resistances of 1869–1870 and 1885. None of them owns land on
# the base map and none has aliases, so the drafted keyframes are unchanged;
# where they held ground it is drawn as areas in the war steps. Colours are
# placeholders for the coordinator.

