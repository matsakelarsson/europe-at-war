# Wave 14, writer G2 (the West, 1847–1891): Native nations and peoples of the
# Plains, the Southwest, California and the Pacific Northwest, used as sides
# in the wars of 1847–1891. None of them is drawn on the base map; their lands
# are drawn as areas in the war steps. Comanche, Kiowa, Apache, Navajo and Ute
# take over the automatic polities of the same id (and their one alias each),
# which came from the historical-basemaps drafts. Colours are placeholders for
# the coordinator.

