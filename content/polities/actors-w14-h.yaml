# Wave 14, writer H (the Civil War and the United States, 1854–1921): the
# Confederacy, the armed factions of Bleeding Kansas, John Brown’s raiders and
# the two sides of the coal mine wars. None of them owns land on the base map
# and none has aliases, so the drafted keyframes are unchanged; the land the
# Confederacy held is drawn as areas in the war steps. Colours are
# placeholders for the coordinator. `confederate-states` is shared with the
# other wave 14 writers.

- id: confederate-states
  name: Confederate States of America
  color: "#dcdcd2"
  ink: slate
  countries: [us]
- id: free-state-forces
  name: Free-State forces (Kansas)
  color: "#dfe8cf"
  ink: green
  countries: [us]
- id: proslavery-forces
  name: Proslavery forces (Kansas and Missouri)
  color: "#ecd6cf"
  ink: red
  countries: [us]
- id: john-browns-raiders
  name: John Brown’s raiders
  color: "#e6dcc8"
  ink: brown
  countries: [us]
- id: united-mine-workers
  name: United Mine Workers of America (UMWA)
  color: "#efd9cf"
  ink: red
  countries: [us]
- id: coal-operators
  name: Coal operators and their guards
  color: "#d9dde3"
