# Wave 14, writer I2 (Cuba, Puerto Rico and the islands, 1795–1933): rebel
# armies, insurgent movements, parties and risings of enslaved and free
# working people that appear as sides in the wars of Cuba, Jamaica, Grenada,
# Barbados and Saint Croix. None of them owns land on the base map and none
# has aliases, so the drafted keyframes are unchanged; the land they held is
# drawn as areas in the war steps. Colours are placeholders for the
# coordinator.

# Shared with writer J1 and others (see the wave 14 brief).
- id: cuban-liberation-army
  name: Cuban Liberation Army
  color: "#f2d4d4"
  ink: red
  countries: [cu]
  # The insurgent armies of the Cuban wars of independence, the mambises:
  # the Liberation Army of the Republic of Cuba in Arms (1868–1878), the
  # rebels of the Little War (1879–1880) and the Liberation Army of 1895–1898.

# Writer I2 only.
- id: fedon-insurgents
  name: Fédon’s insurgents
  color: "#e6daf0"
  ink: purple
  countries: [gd]
  # Julien Fédon’s republicans in Grenada (1795–1796): free people of colour,
  # French Grenadians and the enslaved people who joined them.
- id: bussa-rebels
  name: Bussa’s rebels
  color: "#efe0cc"
  ink: brown
  countries: [bb]
  # The enslaved people who rose in Barbados in April 1816.
- id: baptist-war-rebels
  name: Sharpe’s rebels (the Baptist War)
  color: "#f0dccc"
  ink: orange
  countries: [jm]
  # The enslaved people of western Jamaica who struck and rose under Samuel
  # Sharpe in 1831–1832, with the rebel "Black Regiment".
- id: morant-bay-rebels
  name: Morant Bay rebels
  color: "#e8e0c4"
  ink: olive
  countries: [jm]
  # Paul Bogle’s followers from Stony Gut and the small farmers and labourers
  # of Saint Thomas-in-the-East who rose in October 1865.
- id: fireburn-rebels
  name: Labourers of Saint Croix (Fireburn)
  color: "#f2dcc8"
  ink: orange
  countries: [vi]
  # The plantation labourers who rose on Contract Day, 1 October 1878.
- id: cuban-liberal-rebels
  name: Cuban Liberal rebels
  color: "#d6e2f0"
  ink: blue
  countries: [cu]
  # The armed Liberal Party opposition: the August revolution of 1906 and
  # the revolt of 1917 (La Chambelona).
- id: independientes-de-color
  name: Partido Independiente de Color
  color: "#e4d8ee"
  ink: purple
  countries: [cu]
  # The Independent Party of Colour, founded by Afro-Cuban veterans in 1908,
  # and its armed protest of 1912.
