# Wave 14, writer J1 (Mexico, Cuba and the world wars, 1910–1959): the
# revolutionary factions, rebel movements and armed groups that appear as
# sides in the Mexican Revolution, the Mexican Border War, the de la Huerta
# rebellion, the Cristero War, the Cuban Revolution of 1933 and the Cuban
# Revolution. None of them owns land on the base map and none has aliases, so
# the drafted keyframes are unchanged; the lands they held or fought over are
# drawn as areas in the war steps. Colours are placeholders for the
# coordinator. constitutionalists, villistas, zapatistas and cristeros are
# shared with the other wave 14 writers.

