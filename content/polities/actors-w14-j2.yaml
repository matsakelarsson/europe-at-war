# Wave 14, writer J2 (North America and the Caribbean since 1959): rebel
# movements, exile forces, guerrillas, cartels, gangs and other armed groups
# that appear as sides in the wars of Cuba, Canada, the Dominican Republic,
# Mexico, Grenada, Trinidad and Tobago, Jamaica and Haiti since 1959, and the
# multinational force in Haiti since 2024. None of them owns land on the base
# map and none has aliases, so the drafted keyframes are unchanged; the land
# they held is drawn as areas in the war steps. Colours are placeholders for
# the coordinator. 26th-of-july-movement, brigade-2506, ezln,
# mexican-cartels, haitian-gangs, jamaat-al-muslimeen and
# puerto-rican-nationalists are shared with the other wave 14 writers.

