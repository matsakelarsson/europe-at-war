# Wave 9, writer G (the Republic of China, 1912–1949): parties, armies and
# warlord cliques that appear as sides in the wars of the Republican era. They
# own no land on the base map and have no aliases; the zones they held are
# drawn as areas in the war steps. The Beiyang government in Beijing (to 1928)
# and the Nationalist government in Nanjing (from 1928) are `roc`. Colours are
# placeholders for the coordinator. Other writers may use any of these.

- id: ccp
  name: Chinese Communist Party
  color: "#e6d1bd"
  ink: red
  countries: [cn]
- id: kmt
  name: Kuomintang (Nationalist Party)
  names: [["1914-07-08", Kuomintang], ["1919-10-10", Chinese Revolutionary Party]]
  color: "#e6d1bd"
  ink: blue
  countries: [cn]
- id: wang-jingwei-regime
  name: Reorganized National Government (Wang Jingwei)
  color: "#e6d1bd"
  ink: olive
  countries: [cn]

