# Polities for the German lands, Austria, Bohemia and Switzerland (wave 2).
# Format as in ../polities.yaml. Some take over auto polities of the same id.
#
# Inside the Holy Roman Empire the map shows Habsburg Austria, Bohemia and the
# Swiss from about 1300, and the larger territorial states from 1500. The many
# small states (imperial cities, abbeys, counts, the ecclesiastical
# electorates) are grouped as `hre`.

