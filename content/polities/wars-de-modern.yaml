# Side-only polities for the wars of Germany, Austria, Czechoslovakia and
# Switzerland after 1815 (wave 2). Format as in ../polities.yaml.
# None of them is drawn on the base map, and none has aliases, so the drafted
# keyframes are unchanged.

- id: sonderbund
  name: Sonderbund
  color: "#dfe3ee"
  ink: navy
  countries: [ch]
- id: revolutionaries-1848
  name: Revolutionaries of 1848–1849
  color: "#f0d0cb"
  ink: red
  countries: [de, at]
- id: revolutionaries-1918
  name: Revolutionaries of 1918–1919
  color: "#f0d0cb"
  ink: red
  countries: [de]
- id: schutzbund
  name: Republican Protection League (Schutzbund)
  color: "#f0d0cb"
  ink: red
  countries: [at]
- id: austrian-nazis
  name: Austrian Nazis
  color: "#dcdcd2"
  ink: brown
  countries: [at]
- id: russian-liberation-army
  name: Russian Liberation Army
  color: "#e0dccf"
  ink: olive
  countries: [cz]
