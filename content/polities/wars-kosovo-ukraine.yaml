# Side-only polities for the Kosovo War, the Preševo Valley and Macedonian
# insurgencies of 1999–2001 and the Russo-Ukrainian War (wave 6). Format as in
# ../polities.yaml. None of them is drawn on the base map, which keeps the
# recognised borders of the time; steps show them with areas instead. No
# aliases, so the drafted keyframes are unchanged.

- id: kla
  name: Kosovo Liberation Army
  color: "#ecdcf3"
  ink: purple
  countries: [xk]
- id: ucpmb
  name: Liberation Army of Preševo, Medveđa and Bujanovac
  color: "#f0dcc6"
  ink: orange
  countries: [rs]
- id: nla-macedonia
  name: National Liberation Army (Macedonia)
  color: "#e6dcc6"
  ink: brown
  countries: [mk]
- id: nato
  name: NATO
  color: "#d6deef"
  ink: navy
- id: donetsk-pr
  name: Donetsk People’s Republic
  color: "#dfe3c8"
  ink: olive
  countries: [ua]
- id: luhansk-pr
  name: Luhansk People’s Republic
  color: "#e3dfc6"
  ink: olive
  countries: [ua]
