# Side-only polities for the wars after 1944 in the former Soviet Union.
# Format as in ../polities.yaml. These breakaway entities are not shown on
# the base map, which keeps internationally recognised borders; steps show
# them with areas instead. No aliases, so the drafted base map is unchanged.

- id: transnistria
  name: Transnistria
  color: "#e3d6c9"
  ink: brown
  countries: [md]
- id: abkhazia
  name: Abkhazia
  color: "#d5e3d0"
  ink: olive
  countries: [ge]
- id: south-ossetia
  name: South Ossetia
  color: "#e6dcc6"
  ink: purple
  countries: [ge]
- id: ichkeria
  name: Chechen Republic of Ichkeria
  color: "#d9dfc8"
  ink: purple
  countries: [ru]
- id: republic-of-artsakh
  name: Republic of Artsakh
  names: [["2017-02-20", Nagorno-Karabakh Republic]]
  color: "#f0dcc6"
  ink: orange
  countries: [az]
