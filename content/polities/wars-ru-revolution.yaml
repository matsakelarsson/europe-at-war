# Side-only polities for the wars of revolution and independence in Russia,
# Finland and the Baltic, 1917–1922 (wave 1). Format as in ../polities.yaml.
# None of them is drawn on the base map, and none has aliases, so the drafted
# keyframes are unchanged.

- id: white-movement
  name: White movement
  color: "#dde2ee"
  ink: blue
  countries: [ru, ua]
- id: czechoslovak-legion
  name: Czechoslovak Legion
  color: "#e2e5cf"
  ink: olive
  countries: [ru]
- id: finnish-reds
  name: Finnish Socialist Workers’ Republic (Reds)
  color: "#f0d2cd"
  ink: red
  countries: [fi]
- id: baltic-landeswehr
  name: Baltic Landeswehr and German Freikorps
  color: "#dcdcd2"
  ink: slate
  countries: [lv, ee]
- id: west-russian-army
  name: West Russian Volunteer Army (Bermontians)
  color: "#e0dccf"
  ink: brown
  countries: [lv, lt]
