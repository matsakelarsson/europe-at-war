# Side-only polities for the wars in Slovenia, Croatia and Bosnia, 1991–1995.
# Format as in ../polities.yaml. These self-proclaimed entities are not shown
# on the base map, which keeps internationally recognised borders; steps show
# them with areas instead. No aliases, so the drafted base map is unchanged.

- id: serbian-krajina
  name: Republic of Serbian Krajina
  names: [["1991-12-19", SAO Krajina]]
  color: "#efd6d0"
  ink: red
  countries: [hr]
- id: republika-srpska
  name: Republika Srpska
  names: [["1992-08-12", Serbian Republic of Bosnia and Herzegovina]]
  color: "#ecd3d8"
  ink: red
  countries: [ba]
- id: herzeg-bosnia
  name: Croatian Republic of Herzeg-Bosnia
  names: [["1993-08-28", Croatian Community of Herzeg-Bosnia]]
  color: "#d5dcef"
  ink: blue
  countries: [ba]
- id: western-bosnia
  name: Republic of Western Bosnia
  names: [["1995-07-26", Autonomous Province of Western Bosnia]]
  color: "#d4e5e2"
  ink: teal
  countries: [ba]
