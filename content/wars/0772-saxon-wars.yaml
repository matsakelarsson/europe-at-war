id: saxon-wars
name: Saxon Wars
start: "772"
end: "804"
tier: C
summary: The wars in which Charlemagne conquered the pagan Saxons of what is now north-west Germany, in some eighteen campaigns over more than thirty years. Led for years by Widukind, the Saxons rose again and again; the Franks answered with forced baptism, the death penalty for pagan practice and, at Verden in 782, the execution of about 4,500 prisoners, as the Frankish annals tell it. Widukind was baptised in 785, and after the last risings and mass deportations Saxony was part of the Frankish realm by 804.
