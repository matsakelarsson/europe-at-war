notes:
  - Almost everything known comes from Frankish writers, above all the Royal Frankish Annals and Einhard’s Life of Charlemagne; there is no Saxon account. Some historians have doubted the number killed at Verden, or suggested a scribal error, but most accept that a mass execution took place.
  - The war began with the destruction of the Saxon sanctuary of the Irminsul, near the Eresburg (Marsberg), in 772. The Saxons’ last rising, the Stellinga of 841–845, came after Charlemagne’s death.
