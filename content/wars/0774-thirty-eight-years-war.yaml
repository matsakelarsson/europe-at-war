id: thirty-eight-years-war
name: Thirty-Eight Years’ War
start: "774"
end: "811"
tier: B
summary: "The long series of campaigns in which the Japanese imperial court brought the Emishi of northern Honshu under its rule. It began in 774, when Emishi of the Pacific coast attacked the frontier fort of Monofu, and grew in 780 when Iji no Azamaro, an Emishi chief in the court’s service, killed the provincial inspector and burned Taga, the headquarters of Mutsu. Emperor Kanmu sent ever larger armies north: in 789 the Emishi of Isawa under Aterui routed the army of Ki no Kosami at Sufuse on the Kitakami River, but in 801 Sakanoue no Tamuramaro, the second man to bear the title sei-i taishōgun, conquered the Isawa region. He built Isawa Castle in 802, Aterui and More surrendered and were executed, and Shiwa Castle followed in 803. After a last campaign by Fun’ya no Watamaro in 811 against the villages of Nisatai and Hei, the court declared the fighting over. The name, given by the historian Torao Toshiya in 1975, comes from Watamaro’s report that there had been “thirty-eight years in all” of border warfare since 774."
countries: [jp]
sides:
  - id: jp
    name: Japanese imperial court
    polities: [japan]
    ink: red
    moves: Imperial moves
    success: Imperial success
  - id: emi
    name: Emishi
