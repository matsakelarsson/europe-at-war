  - title: Fun’ya no Watamaro and the end of the campaigns
    date: "811"
    when: "811"
    borders: "811-12"
    countries: [jp]
    body:
      - In the first month of 811 the court organised the land around Shiwa Castle into three new districts, Waga, Hienuki and Shiwa, probably made up of Emishi who had submitted. To secure them, the inspector of Mutsu and Dewa, Fun’ya no Watamaro, proposed a campaign against the Emishi villages of Nisatai to the north and Hei to the east, with 26,000 soldiers from the two provinces. He relied heavily on Emishi allies, who had feuds of their own with the chiefs of Nisatai, and sent a thousand Emishi troops against Hei. In the tenth month he reported that many had been killed or captured and many had surrendered.
      - In the twelfth month Watamaro declared the war over. Since 774, he wrote, “thirty-eight years in all”, the frontier had known constant raids and alarms, and now none of the enemy remained; he cut the garrison of Mutsu from 3,800 soldiers to 1,000. Shiwa Castle was replaced by the smaller Tokutan Castle in 812. The north of Honshu beyond the Kitakami basin remained outside the provinces, and the Emishi who lived under the court’s rule kept their own leaders, from whom powerful families such as the Abe would later rise.
    facts:
      - [Campaign against Nisatai and Hei, "811"]
      - [Watamaro’s victory report, "tenth month of 811"]
      - [Garrison of Mutsu after the war, "cut from 3,800 to 1,000 men"]
