steps:
  - title: Monofu, Taga and the Koromo River
    date: 774–789
    when: "774"
    borders: "800"
    countries: [jp]
    body:
      - By the 770s the court ruled the south of Mutsu and Dewa through a chain of fortified administrative posts, with Taga Castle, near today’s Sendai, as the seat of the provincial government and of the frontier command. Settlers were moved north from the Kantō, and Emishi groups that accepted the court’s rule were given titles and court ranks. In the seventh month of 774 Emishi of the coastal region burned bridges, blocked the roads and attacked Monofu Castle on the lower Kitakami River, breaking into its western enclosure. The governor Ōtomo no Surugamaro answered with a campaign that took the village of Tōyama, and in 776 the court sent some 20,000 men from Mutsu and 4,000 from Dewa against the Emishi of the mountain and coast roads. Hundreds of captured Emishi were deported to Kyushu and Shikoku.
      - In the third month of 780 Iji no Azamaro (Korehari no Azamaro), an Emishi chief who governed a district for the court and had been given court rank two years before, rose at Iji Castle, where the inspector Ki no Hirozumi had come to build a new fort further north. He killed Hirozumi and the local magnate Michishima no Ōtate, and a few days later his followers plundered and burned Taga Castle, which its garrison had abandoned. The armies sent north in 780–781 achieved little.
      - Emperor Kanmu, who came to the throne in 781, made the conquest of the north one of the two great works of his reign, with the building of a new capital. For the campaign of 789 more than 50,000 men were levied in the eastern provinces under Ki no Kosami. The main army crossed the Koromo River in the spring and waited there for a month, until Kanmu rebuked its commanders. In June, at the end of the fifth lunar month, 4,000 men crossed to the east bank of the Kitakami and marched north, burning villages, towards the home of the Isawa chief Aterui. Near the village of Sufuse they were attacked by about 800 Emishi in front and 400 more from the hills, and driven into the river. The court’s chronicle counts 25 killed in the fighting, 245 wounded by arrows and 1,036 drowned, while 1,257 men swam back without their armour. Kosami disbanded his army and was disgraced.
    facts:
      - [Attack on Monofu Castle, "seventh month of 774"]
      - [Iji no Azamaro’s rising, "third month of 780"]
      - [Battle of Sufuse, "end of the fifth month of 789, Emishi victory"]
      - [Imperial losses at Sufuse, "25 killed, 245 wounded, 1,036 drowned (court figures)"]
