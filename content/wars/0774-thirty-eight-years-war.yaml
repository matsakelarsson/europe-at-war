notes:
  - "Almost everything known comes from the court’s own chronicles (the Shoku Nihongi, the Nihon Kōki, which survives only in part, and later digests), which call the Emishi rebels and give only the court’s side. Who the Emishi were is still debated: they were probably several peoples of northern Honshu, some related to the ancestors of the Ainu, who lived by farming, hunting and horse-raising and fought as mounted archers."
  - Dates are given by year and month of the Japanese lunar calendar where the sources give no Western equivalent; day dates in the text are the Julian equivalents given by Japanese historians.
  - Emishi who submitted (fushū) were often deported to other provinces as far away as Kyushu, and served the court as soldiers. Fighting flared again after the war, in 813 and in the Gangyō rebellion of 878.
