  - title: Sakanoue no Tamuramaro and Aterui
    date: 794–805
    when: "801"
    borders: "803"
    countries: [jp]
    body:
      - Kanmu tried again with new commanders and a new kind of army that relied more on mounted archers. In 794, the year the court moved to Heian-kyō (Kyoto), Ōtomo no Otomaro led a campaign in which one of his four deputies, Sakanoue no Tamuramaro, played the leading part. Tamuramaro was made governor and frontier commander of Mutsu, settled thousands of colonists at Iji, and in 797 was given the title sei-i taishōgun, “great general who subdues the barbarians”. In 801 he marched north with an army the chronicles put at 40,000 men, and in the ninth month he reported that the Emishi had been subdued; his campaign seems to have reached as far as Hei on the Pacific coast.
      - In 802 Tamuramaro built Isawa Castle in the heart of Aterui’s country, on the Kitakami River near today’s Ōshū, and 4,000 settlers from ten eastern provinces were sent to farm around it. In the fourth month Aterui and More surrendered with more than 500 followers. Tamuramaro brought them to the capital and asked that they be sent back to win over the rest of the Emishi, but the nobles of the court refused, and on 13 September 802 the two leaders were beheaded in Kawachi province. Aterui is honoured today in Iwate as a defender of his people, and a memorial to him stands at Kiyomizu-dera in Kyoto, the temple linked to Tamuramaro.
      - In 803 Tamuramaro built Shiwa Castle, near today’s Morioka, the northernmost of the court’s great forts, and he was appointed to lead a fourth campaign. At the end of 805, however, Kanmu held a debate on good government in which Fujiwara no Otsugu argued that the wars and the building of the capital were ruining the people, and the emperor halted both.
    facts:
      - [Tamuramaro’s campaign, "801, about 40,000 men"]
      - [Isawa Castle built, "802"]
      - [Surrender of Aterui and More, "fourth month of 802"]
