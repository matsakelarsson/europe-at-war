  - title: Govinda III and Nagabhata II
    date: about 800–885
    when: "800"
    borders: "816"
    countries: [in, bd]
    body:
      - Vatsaraja’s son Nagabhata II restored Pratihara power, but in about 800 the Rashtrakuta king Govinda III marched north, defeated him and received the submission of Dharmapala and Chakrayudha. Rashtrakuta inscriptions boast that Govinda’s horses drank from the streams of the Himalaya. Like his father, Govinda went home again, and after his death in 814 the Rashtrakutas, ruled by the boy king Amoghavarsha, were busy with troubles in the Deccan.
      - In about 816 Nagabhata took Kannauj, removed Chakrayudha and made the city his capital. He then marched east and defeated Dharmapala near Monghyr (Mudgagiri) on the Ganges, in Bihar. The Palas under Dharmapala’s son Devapala recovered and claimed great victories of their own, but under Mihira Bhoja (about 836–885) and his son Mahendrapala the Pratiharas built the largest kingdom of northern India since Harsha; inscriptions of Mahendrapala’s reign have been found in Bihar and northern Bengal. The Arab merchant Sulayman, writing in 851, called the king of the “Juzr” the strongest enemy of the Arabs in India, with the finest cavalry. The Rashtrakutas still fought the Pratiharas in Malwa, and Krishna II defeated Bhoja near Ujjain.
    facts:
