id: tripartite-struggle
name: Tripartite Struggle
start: "786"
end: "916"
tier: B
summary: The long contest of the three great powers of India for Kannauj, the old imperial city on the Ganges, from the late 8th to the early 10th century. The Gurjara-Pratiharas of Malwa and Rajasthan, the Palas of Bengal and Bihar and the Rashtrakutas of the Deccan each took or controlled the city in turn. The Rashtrakuta kings Dhruva and Govinda III raided as far as the Ganges and went home again; the Pala king Dharmapala put his own candidate on the throne of Kannauj; and in about 816 the Pratihara Nagabhata II took the city and made it his capital, which it stayed for two centuries. A last great Rashtrakuta raid under Indra III sacked Kannauj in about 916. The struggle exhausted all three and left room for the regional kingdoms that followed.
