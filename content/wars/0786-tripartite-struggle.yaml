steps:
  - title: Vatsaraja, Dharmapala and Dhruva
    date: about 786–793
    when: "786"
    borders: "800"
    countries: [in, bd]
    body:
      - Since the days of Harsha in the 7th century, Kannauj on the Ganges had been the symbolic capital of northern India, and whoever held it could claim to be the paramount king of the north. In the late 8th century it was ruled by weak kings of the Ayudha family. Three powers wanted it. The Gurjara-Pratiharas ruled Malwa and much of Rajasthan, the Palas Bengal and Bihar, and the Rashtrakutas the western Deccan. Historians call their long contest the Tripartite Struggle.
      - In the 780s the Pratihara king Vatsaraja forced the Ayudha king Indrayudha of Kannauj to accept his overlordship and defeated the Pala king Dharmapala, who, a Rashtrakuta inscription says, lost his two white royal umbrellas. In about 786 the Rashtrakuta king Dhruva crossed the Narmada into Malwa. He defeated Vatsaraja, who fled into the Rajasthan desert, and then Dharmapala in the land between the Ganges and the Yamuna, and in about 790 he went home with his plunder. Dharmapala used the moment to depose Indrayudha and put his own candidate, Chakrayudha, on the throne of Kannauj. A Pala copper plate lists the kings of the Kurus, the Yadus, Avanti, Gandhara and others who attended the ceremony.
    facts:
