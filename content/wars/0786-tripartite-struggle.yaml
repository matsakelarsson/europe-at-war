notes:
  - The struggle is known almost only from the three dynasties’ own copper-plate grants and inscriptions, each of which claims victories over the others, and from a few later poems. The order of events is reasonably clear, but most dates are approximate and differ by up to a decade between historians; Govinda III’s northern campaign, for example, is dated anywhere from about 798 to 807.
  - The name “Tripartite Struggle” is a modern one. Kannauj is called Mahodaya in some inscriptions.
  - The base map begins in 800; the first step shows the map of that year.
