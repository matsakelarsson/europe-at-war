  - title: Indra III sacks Kannauj
    date: about 915–916
    when: "916"
    borders: "916"
    countries: [in]
    body:
      - In the early 10th century a disputed succession weakened the Pratiharas, and Mahipala I took the throne by force in about 913. The Rashtrakuta king Indra III (about 914–929) seized the chance. He marched north through Malwa, crossed the Yamuna and took Kannauj, which his Cambay copper plates say was utterly destroyed. According to the Kannada poet Pampa, Indra’s vassal Narasimha II of Vemulavada pursued the fleeing Mahipala eastwards as far as the Ganges. The Rashtrakutas held the city only until about 916.
      - Mahipala returned to Kannauj, probably helped by his vassal, the Chandela king Harsha. But the vassals were now the stronger party. The Chandelas, the Paramaras of Malwa and the Kalachuris made themselves independent, the Rashtrakutas raided the north again under Krishna III, and by the end of the century the Pratiharas held little more than the country around Kannauj, which Mahmud of Ghazni took in 1018. The Palas declined until a revival in the late 10th century, and the Rashtrakutas were overthrown by the Western Chalukyas in 973. None of the three had won.
    facts:
      - [Kannauj sacked by Indra III, "about 915–916"]
      - [Last Pratihara capital, "Kannauj, taken by Mahmud of Ghazni in 1018"]
