  - title: The great army and the siege of Paris
    date: 879–887
    when: "885-11-24"
    borders: "886-11"
    countries: [fr, be]
    body:
      - In 879 a large Viking army that had gathered on the Thames, finding no opening in Wessex after Alfred’s victory at Edington, crossed from England to the Low Countries. From camps at Ghent and elsewhere it ravaged the lands between the Scheldt and the Seine for years. King Louis III beat part of it at Saucourt-en-Vimeu on 3 August 881, a victory celebrated in the Old High German Ludwigslied, but the raids went on. In November 885 a fleet the monk Abbo puts at 700 ships came up the Seine under Sigfred and Sinric and found the way blocked by the fortified bridges of Paris, then confined to the Île de la Cité.
      - Count Odo of Paris and Bishop Gozlin held the city through a siege of almost a year, against towers, rams, fire and mining. In February 886 a flood swept away one bridge, and the twelve defenders of its tower were killed. Sigfred took 60 pounds of silver and left in the spring, but others stayed. The emperor Charles the Fat arrived only in October, camped at Montmartre and, instead of fighting, paid 700 pounds and let the Vikings sail on to plunder Burgundy, which was in revolt. Odo’s defence made his name; when Charles was deposed in 887, the West Franks chose Odo as their king.
    facts:
      - [Battle of Saucourt, "3 August 881, Frankish victory"]
      - [Siege of Paris, "24 or 25 November 885 – October 886"]
      - [Paid to the Vikings, "700 pounds of silver, with leave to raid Burgundy"]
    markers:
      - kind: battle
        side: fra
        name: Battle of Saucourt
        date: 3 August 881
        text: The young king Louis III routed a Viking army in the Vimeu, killing, it was said, several thousand. The raiders soon returned.
        lonlat: [1.616, 50.104]
      - kind: held
        side: vik
        name: Ghent
        date: 879–880
        text: The army that had crossed from England spent its first winter in the Low Countries at the abbey town on the Scheldt.
        lonlat: [3.72, 51.054]
      - kind: siege
        side: fra
        name: Siege of Paris
        date: November 885 – October 886
        text: A few hundred defenders on the island city held the two fortified bridges and their towers. Bishop Gozlin, who fought on the walls, died during the siege.
        lonlat: [2.347, 48.854]
      - kind: event
        name: Montmartre
        date: October 886
        text: Charles the Fat camped on the hill north of Paris with an imperial army, then bought the Vikings off instead of attacking them.
        lonlat: [2.342, 48.887]
        lp: t
    arrows:
