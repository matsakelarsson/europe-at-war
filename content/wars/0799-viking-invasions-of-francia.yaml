  - title: Rollo and the grant of Normandy
    date: "911"
    when: "911-07-20"
    borders: "911"
    countries: [fr]
    body:
      - Viking settlers had been living along the lower Seine for years when a band led by Rollo besieged Chartres in 911. On 20 July a Frankish army under Robert, marquis of Neustria and brother of the late King Odo, with Duke Richard of Burgundy and Count Ebles of Poitiers, came to the city’s relief. Bishop Gantelme led a sortie from the walls, by later tradition displaying the Virgin’s tunic, the cathedral’s relic, and the Vikings were beaten.
      - King Charles the Simple chose to make the Vikings defenders of the realm rather than fight them every year. According to Dudo, he met Rollo at Saint-Clair-sur-Epte and granted him the land from the Epte to the sea around Rouen; Rollo became the king’s man, agreed to defend the Seine against other raiders and was baptised, taking the name Robert. Further grants in 924 and 933 added the land around Bayeux and the Cotentin. Rollo’s descendants ruled as counts and then dukes of Normandy, and within a few generations the Normans spoke French.
    facts:
      - [Battle of Chartres, "20 July 911, Frankish victory"]
      - [Grant to Rollo, "911, traditionally at Saint-Clair-sur-Epte"]
      - [Later grants, "924 (around Bayeux) and 933 (the Cotentin and Avranchin)"]
    markers:
      - kind: battle
        side: fra
        name: Battle of Chartres
        date: 20 July 911
        text: Robert of Neustria and Richard of Burgundy relieved the besieged city. Rollo’s army withdrew to the Seine.
        lonlat: [1.484, 48.456]
      - kind: treaty
        name: Saint-Clair-sur-Epte
        date: "911"
        text: Here, on the river that became Normandy’s eastern border, Rollo is said to have done homage to Charles the Simple.
        lonlat: [1.68, 49.208]
      - kind: event
        side: vik
        name: Rouen
        date: From 911
        text: The old Roman city on the Seine became the capital of Rollo’s county. He was buried in its cathedral.
        lonlat: [1.099, 49.443]
        lp: l
