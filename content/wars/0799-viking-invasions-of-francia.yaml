id: viking-invasions-of-francia
name: Viking invasions of Francia
start: "799"
end: "911"
tier: B
summary: A century of Scandinavian raids on the Frankish lands, from the first attacks on the coast around 800 to the great fleets that sacked Rouen, Nantes and Paris and the long siege of Paris in 885–886. It ended in 911, when King Charles the Simple granted the lower Seine to the Viking leader Rollo, whose county became the Duchy of Normandy.
countries: [fr, nl, be]
sides:
  - id: vik
    name: Vikings
    polities: []
    ink: red
    moves: Viking moves
    success: Viking success
  - id: fra
    name: Franks
    polities: [carolingian, west-francia]
    ink: navy
    moves: Frankish moves
    success: Frankish success
notes:
  - The main sources are Frankish annals, chiefly the Annals of St-Bertin and of St-Vaast, and the monk Abbo’s poem on the siege of Paris. They give large and often exaggerated numbers of ships and men, and they rarely say where the raiders came from; most seem to have been Danes, with Norwegians among them.
  - The story of Rollo and the grant of 911 comes mostly from Dudo of Saint-Quentin, who wrote about a century later for Rollo’s descendants. No text of the agreement survives, and its date and place are traditional; a royal charter of 918 confirms that Charles had granted land on the lower Seine to the Northmen.
