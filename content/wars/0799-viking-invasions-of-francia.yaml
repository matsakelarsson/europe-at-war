steps:
  - title: Frisia, the Seine and the Loire
    date: 799–866
    when: "834"
    borders: "866-07-02"
    countries: [fr, nl]
    body:
      - Scandinavian raiders first struck the coast of the Frankish empire around 799, and Charlemagne ordered fleets and coastguards along the Channel and the North Sea. In 810 the Danish king Godfred sent some 200 ships against Frisia, which paid tribute. After Louis the Pious lost control of his sons in the 830s the attacks grew. Dorestad, the great trading town on the Rhine, was raided in 834 and in several years after. In 841 a fleet sailed up the Seine and burned Rouen and the abbey of Jumièges, and in 843 raiders took Nantes on the feast of St John and killed its bishop in the cathedral.
      - The fleets then began to winter in Francia, on islands such as Noirmoutier at the mouth of the Loire and Oissel in the Seine. In March 845 about 120 ships under a leader the annals call Reginherus reached Paris at Easter and plundered it, and Charles the Bald paid 7,000 pounds of silver and gold to make them leave, the first of many such payments. In 864 he ordered fortified bridges across the rivers, and one was built at Pont-de-l’Arche on the Seine. On 2 July 866 Vikings under the chieftain Hastein and their Breton allies killed Robert the Strong, the Frankish commander in the west, at Brissarthe.
    facts:
      - [Paris sacked, "March 845, after about 120 ships came up the Seine"]
      - [Tribute paid, "7,000 pounds of silver and gold"]
      - [Battle of Brissarthe, "2 July 866, Robert the Strong killed"]
    markers:
      - kind: taken
        side: vik
        name: Dorestad
        date: 834–837
        text: The largest port of the Frankish north, on a branch of the Rhine. It was attacked again and again and never recovered its trade.
        lonlat: [5.348, 51.98]
      - kind: taken
        side: vik
        name: Rouen
        date: May 841
        text: A fleet led by a chieftain the annals call Oscherus burned the town and the abbeys along the lower Seine.
        lonlat: [1.099, 49.443]
      - kind: taken
        side: vik
        name: Nantes
        date: 24 June 843
        text: Raiders took the city during the feast of St John and killed Bishop Gunhard and many townspeople in the cathedral.
        lonlat: [-1.553, 47.218]
      - kind: held
        side: vik
        name: Noirmoutier
        date: From 843
        text: The island at the mouth of the Loire, already raided for its monastery, became a base where Viking fleets spent the winter.
        lonlat: [-2.249, 47.009]
        lp: l
      - kind: taken
        side: vik
        name: Paris
        date: March 845
        text: Reginherus’s men plundered the city at Easter. Charles the Bald, whose army had been split by the river, paid them to leave.
        lonlat: [2.347, 48.854]
      - kind: event
        side: fra
        name: Pîtres and Pont-de-l’Arche
        date: 25 June 864
        text: At an assembly at Pîtres Charles ordered fortified bridges to bar the rivers. The one at Pont-de-l’Arche blocked the Seine above Rouen.
        lonlat: [1.155, 49.304]
        lp: b
      - kind: battle
        side: vik
