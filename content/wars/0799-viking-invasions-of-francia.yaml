        date: 2 July 866
        text: Robert the Strong and Count Ranulf of Poitiers were killed fighting Hastein’s Bretons and Vikings, who had sacked Le Mans. Robert was the forefather of the Capetian kings.
        lonlat: [-0.45, 47.70]
