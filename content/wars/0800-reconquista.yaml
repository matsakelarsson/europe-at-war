  - title: Simancas and the caliphate
    date: 912–961
    when: "939"
    borders: "0961-10-15"
    countries: [es]
    body:
      - Abd al-Rahman III, emir from 912, spent his first years crushing rebels, above all the sons of Umar ibn Hafsun in their mountain fortress of Bobastro, which fell in 928. In January 929 he took the title of caliph, setting himself up against the Abbasids of Baghdad and the Fatimids of North Africa. His summer campaigns beat León and Pamplona at Valdejunquera in 920 and sacked Pamplona in 924, and from 936 he built a palace city, Madinat al-Zahra, outside Córdoba.
      - In 939 he led a great expedition against León. Near Simancas, on the Duero, Ramiro II of León, with Count Fernán González of Castile and troops from Pamplona, met him in a battle that began on 19 July, the day of a solar eclipse, and lasted several days. The caliph’s army was beaten and then routed on its retreat at a place the Arab sources call al-Khandaq, “the ditch”. Abd al-Rahman barely escaped and never again campaigned in person. León settled the lands south of the Duero, and Fernán González made Castile a hereditary county that went its own way.
    facts:
      - [Caliphate proclaimed, "16 January 929"]
      - [Battle of Simancas, "from 19 July 939, Leonese victory"]
      - [Madinat al-Zahra, "built from 936"]
    markers:
      - kind: taken
        side: and
        name: Bobastro
        date: "928"
        text: The stronghold of Umar ibn Hafsun and his sons in the hills north of Málaga surrendered to Abd al-Rahman III after almost fifty years of revolt.
        lonlat: [-4.781, 36.903]
      - kind: battle
        side: and
        name: Battle of Valdejunquera
        date: "920"
        text: The emir’s army beat Ordoño II of León and Sancho Garcés I of Pamplona south-west of Pamplona.
        lonlat: [-1.933, 42.754]
        lp: b
      - kind: taken
        side: and
        name: Pamplona
        date: "924"
        text: Abd al-Rahman’s army sacked the capital of the kingdom of Pamplona.
        lonlat: [-1.65, 42.817]
      - kind: event
        side: and
        name: Madinat al-Zahra
        date: From 936
        text: The caliph’s palace city on the slopes of the Sierra Morena, west of Córdoba, was the seat of government until it was sacked in the civil wars after 1009.
        lonlat: [-4.867, 37.888]
      - kind: battle
        side: chr
        name: Battle of Simancas
        date: From 19 July 939
        text: Ramiro II’s army, with Castilians and Navarrese, beat the caliph after several days of fighting outside the town.
        lonlat: [-4.817, 41.6]
      - kind: taken
        side: chr
        name: Sepúlveda
