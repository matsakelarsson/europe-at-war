  - title: Córdoba and Seville
    date: 1224–1262
    when: "1236"
    borders: "1262-12-31"
    countries: [es, pt]
    body:
      - After Las Navas the Almohad empire broke up. From 1224 rival caliphs fought each other, and in al-Andalus Ibn Hud of Murcia rose against them. Ferdinand III, king of Castile and from 1230 also of León, uniting the two kingdoms for good, made the most of the chaos. In January 1236 frontier fighters seized a suburb of Córdoba by surprise, Ferdinand hurried south, and the old caliphal capital surrendered on 29 June. Its great mosque became a cathedral. Murcia accepted Castilian overlordship in 1243, and in 1246 Muhammad ibn al-Ahmar, founder of the Nasrid emirate of Granada, gave up Jaén and became Ferdinand’s vassal.
      - Seville, the Almohads’ Iberian capital, was besieged from the summer of 1247, with Nasrid troops in the Castilian camp. On 3 May 1248 a fleet from the ports of the Cantabrian coast under Ramón Bonifaz broke the bridge of boats that linked the city with Triana across the Guadalquivir, and Seville surrendered on 23 November. Most of its Muslims left. In 1249 Afonso III of Portugal took Faro and the last towns of the Algarve, completing Portugal’s conquests, and Ferdinand’s son Alfonso X took Niebla and Cádiz in 1262. Only Granada remained independent.
    facts:
      - [Córdoba surrenders, "29 June 1236"]
      - [Seville surrenders, "23 November 1248"]
      - [Faro taken, "1249, by Portugal"]
    markers:
      - kind: taken
        side: chr
        name: Córdoba
        date: 29 June 1236
        text: The city surrendered after a siege of five months, and its people were allowed to leave. Ferdinand III had the great mosque consecrated as a cathedral.
        lonlat: [-4.78, 37.89]
      - kind: event
        side: and
        name: Granada
        date: "1238"
        text: Ibn al-Ahmar made Granada his capital and began building the Alhambra.
        lonlat: [-3.6, 37.175]
      - kind: treaty
        side: chr
        name: Jaén
        date: "1246"
        text: Ibn al-Ahmar surrendered Jaén after a long siege and agreed to pay tribute and to serve Castile in war.
        lonlat: [-3.771, 37.767]
      - kind: naval
        side: chr
        name: Bridge of Triana
        date: 3 May 1248
        text: Driven by the wind and the tide, Bonifaz’s largest ships rammed and broke the chained bridge of boats, cutting Seville off from the land to the west.
        lonlat: [-6.005, 37.384]
        lp: l
      - kind: taken
        side: chr
        name: Seville
        date: 23 November 1248
        text: After a siege of sixteen months the city surrendered. Ferdinand entered on 22 December, and he was buried in its cathedral in 1252.
        lonlat: [-5.995, 37.389]
      - kind: taken
