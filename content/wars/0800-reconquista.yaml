  - title: Antequera and Gibraltar
    date: 1350–1462
    when: "1410"
    borders: "1462-08-20"
    countries: [es, gi]
    body:
      - For a century after Alfonso XI’s death Castile was taken up with civil wars, the war with England and quarrels with Portugal and Aragon. The frontier with Granada saw truces broken by raids and the occasional campaign, and Granada paid tribute when it had to and flourished; the Alhambra’s great courts were built under Yusuf I and Muhammad V. In 1410 Ferdinand, regent for his infant nephew John II of Castile, besieged Antequera, beat a relief army and took the town in September. Two years later, as Ferdinand of Antequera, he was chosen king of Aragon.
      - In 1431 John II’s favourite, Álvaro de Luna, led a great army to the walls of Granada and won the battle of La Higueruela on 1 July, but Castile used the victory only to stir up Granada’s dynastic quarrels. Frontier lords did more. In August 1462 a surprise attack by the governor of Tarifa, reinforced by the Duke of Medina Sidonia and the Count of Arcos, won Gibraltar, held by Muslims since 1333, and Archidona fell the same year. Granada, weakened by feuds within the Nasrid family, was left with the mountains and coast between Ronda and Almería. The Granada War of 1482–1492 would finish it.
    facts:
      - [Antequera taken, "September 1410"]
      - [Battle of La Higueruela, "1 July 1431, Castilian victory"]
      - [Gibraltar taken, August 1462]
    markers:
      - kind: taken
        side: chr
        name: Antequera
        date: September 1410
        text: Ferdinand’s army besieged the town for five months, with siege towers and early cannon, until the garrison surrendered and left for Granada.
        lonlat: [-4.56, 37.018]
      - kind: taken
        side: chr
        name: Archidona
        date: "1462"
        text: The hilltop town north-east of Antequera fell to the Master of the Order of Calatrava.
        lonlat: [-4.383, 37.1]
      - kind: battle
        side: chr
        name: Battle of La Higueruela
        date: 1 July 1431
        text: Fought by the Sierra Elvira, in sight of Granada. The battle is painted on the walls of the Hall of Battles in the Escorial.
        lonlat: [-3.708, 37.238]
      - kind: taken
        side: chr
        name: Gibraltar
        date: August 1462
        text: Much of the garrison was away, and the rest surrendered after a few days of talks. By tradition the town fell on the feast of Saint Bernard, 20 August, and he became its patron saint.
        lonlat: [-5.35, 36.14]
