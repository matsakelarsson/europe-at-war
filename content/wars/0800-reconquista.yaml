        name: Burriana
        date: July 1233
        text: James took the coastal town after a two-month siege, opening the road south along the coast.
        lonlat: [-0.092, 39.889]
      - kind: battle
        side: chr
        name: Battle of the Puig
        date: August 1237
        text: The garrison that James had left in the fort on the hill beat an army sent from Valencia to drive it out.
        lonlat: [-0.306, 39.59]
      - kind: taken
