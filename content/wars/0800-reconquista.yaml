  - title: Mallorca and Valencia
    date: 1229–1245
    when: "1229"
    borders: "1245"
    countries: [es]
    body:
      - James I of Aragon, who had come to the throne as a child in 1213, turned to the sea. The merchants of Barcelona wanted an end to raids from the Muslim taifa of Mallorca, and in September 1229 a fleet of about 150 ships sailed from Salou, Cambrils and Tarragona. The army landed at Santa Ponsa, won a battle at Portopí and on 31 December stormed Madina Mayurqa, today’s Palma, with great slaughter. Resistance in the mountains lasted until 1232; Menorca submitted as a tributary in 1231, and Ibiza was taken in 1235.
      - James then took the Muslim lands of Valencia piece by piece. Morella and Burriana fell in 1232–1233, and in 1237 his garrison on the Puig, a hill north of the city, held off a counter-attack. Valencia, besieged from April 1238, surrendered on 28 September, and its ruler, Zayyan ibn Mardanish, and many of its people left. The conquest went on south towards Xàtiva and Biar, and in 1244 the Treaty of Almizra fixed the line between Aragon’s conquests and Castile’s. Valencia became a separate kingdom of the Crown of Aragon, where a Muslim majority lived on under Christian rule.
    facts:
      - [Madina Mayurqa stormed, "31 December 1229"]
      - [Valencia surrenders, "28 September 1238"]
      - [Treaty of Almizra, "26 March 1244"]
    markers:
      - kind: event
        side: chr
