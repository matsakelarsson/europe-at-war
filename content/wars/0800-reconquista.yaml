id: reconquista
name: Reconquista
start: "800"
end: "1462"
tier: A
summary: The centuries of war in which the Christian kingdoms of the north of the Iberian Peninsula, Asturias–León, Castile, Navarre, Aragon, Catalonia and Portugal, conquered the Muslim lands of al-Andalus. Under the caliphs of Córdoba and the North African Almoravids and Almohads the Muslims long held the upper hand, but after the fall of Toledo in 1085, Lisbon in 1147, the battle of Las Navas de Tolosa in 1212 and the conquests of Córdoba, Valencia and Seville in 1236–1248, only the Nasrid emirate of Granada remained. The struggle for the Strait of Gibraltar followed, and the Granada War of 1482–1492 completed the conquest.
countries: [es, pt, fr, ma, gi]
sides:
  - id: chr
    name: Christian kingdoms
    polities: [carolingian, leon, castile, navarre, aragon, barcelona, portugal]
    ink: gold
    moves: Christian moves
    success: Christian success
  - id: and
    name: Al-Andalus
    polities: [cordoba, zaragoza, toledo, badajoz, seville, granada, valencia, denia, almeria, murcia]
    ink: green
    moves: Andalusi moves
    success: Andalusi success
  - id: afr
    name: Almoravids, Almohads and Marinids
    polities: [almoravid-dynasty, almohad-caliphate, morocco]
    ink: purple
    moves: North African moves
    success: North African success
notes:
  - The name Reconquista, “reconquest”, became usual only in the 19th century. It reflects the claim of the Christian kings to be restoring the Visigothic kingdom that the Muslims had conquered after 711. Historians debate how far the wars were one long religious struggle; Christian and Muslim rulers often allied with each other, and Christians fought Christians and Muslims fought Muslims at least as often as they fought each other.
  - This story begins around 800, where the map begins. The traditional starting point is the battle of Covadonga in Asturias, about 718–722. It ends in the 1460s; the Granada War (1482–1492), the fitna of al-Andalus (1009–1031) and the Mudéjar revolt of 1264–1266 have their own entries.
  - Christian documents of the time are dated by the Spanish era, 38 years ahead of the year of Christ, and Arabic sources by the Islamic calendar. Dates here are converted to the Julian calendar, as usual. Chronicles on both sides give armies and losses that are far too large.
  - Arabic names are simplified (Abd al-Rahman, al-Mansur). Places are given their modern names, with the Arabic name where it is often used (Madina Mayurqa for Palma).
