        lonlat: [2.469, 39.505]
        lp: l
      - kind: taken
        side: chr
        name: Palma (Madina Mayurqa)
        date: 31 December 1229
        text: After a siege of three months the city was stormed. Many of its people were killed, and its ruler, Abu Yahya, was captured.
        lonlat: [2.65, 39.567]
      - kind: taken
