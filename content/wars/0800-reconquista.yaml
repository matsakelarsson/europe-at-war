  - title: The taifas and Toledo
    date: 1031–1085
    when: "1031"
    borders: "1085-05-25"
    countries: [es, pt]
    body:
      - Almanzor’s sons could not hold his regime together, and from 1009 al-Andalus fell into a civil war, the fitna, in which Berber, Slav and Andalusi factions made and unmade caliphs, and Christian troops fought on both sides. In 1031 the caliphate was abolished. Its lands split into more than twenty taifas, kingdoms ruled from cities such as Zaragoza, Toledo, Badajoz, Seville and Granada, rich in trade and learning but weak, and often at war with each other.
      - The Christian kings now took tribute instead of paying it. Ferdinand I, count of Castile and from 1037 king of León, made the taifa rulers pay parias, protection money in gold, and took Coimbra in 1064. That year knights from France, Normandy and Catalonia, encouraged by the pope, took Barbastro, though Zaragoza won it back in 1065. His son Alfonso VI installed a client, al-Qadir, in Toledo, and when al-Qadir’s subjects turned against him Alfonso besieged the city. The old Visigothic capital surrendered in May 1085; its Muslims were promised their property and their great mosque, which was nevertheless made a cathedral the next year.
    facts:
      - [End of the caliphate, "1031"]
      - [Coimbra taken, "9 July 1064"]
      - [Toledo surrenders, "May 1085, to Alfonso VI"]
    markers:
      - kind: battle
        side: and
        name: Battle of Graus
        date: "1063"
        text: Ramiro I of Aragon was killed attacking this frontier town of the taifa of Zaragoza, which had Castilian troops to help defend it.
        lonlat: [0.334, 42.188]
        lp: t
      - kind: taken
        side: chr
        name: Barbastro
        date: "1064"
        text: The international army took the town and killed or enslaved many of its people. Al-Muqtadir of Zaragoza retook it the next year.
        lonlat: [0.127, 42.037]
        lp: b
      - kind: taken
        side: chr
        name: Coimbra
        date: 9 July 1064
        text: Ferdinand I took the city after a six-month siege and gave it to the Mozarab Sisnando Davides to govern.
        lonlat: [-8.414, 40.203]
      - kind: taken
        side: chr
        name: Toledo
        date: May 1085
        text: Alfonso VI entered the city on 25 May 1085. Toledo became the base for the Christian advance beyond the central mountains.
        lonlat: [-4.024, 39.857]
    arrows:
      - side: chr
        label: Ferdinand I, 1064
        phase: 1
        via: [[-5.57, 42.6], [-7.0, 41.8], [-7.92, 40.67], [-8.38, 40.22]]
