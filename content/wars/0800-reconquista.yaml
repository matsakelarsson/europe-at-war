steps:
  - title: Barcelona and the Duero frontier
    date: 801–910
    when: "801"
    borders: "0910-12-20"
    countries: [es, pt, fr]
    body:
      - By 800 the Umayyad emirate of Córdoba ruled most of the Iberian Peninsula, which Muslim armies had conquered from the Visigoths after 711. Two Christian frontiers faced it. In the north-east the Franks pushed south from the Pyrenees, and in 801, after a siege of several months, Louis the Pious, Charlemagne’s son and king of Aquitaine, took Barcelona. It became the seat of a count in the Frankish Spanish March. In the north-west the small kingdom of Asturias, ruled from Oviedo by Alfonso II (791–842), held the mountains between Galicia and the Basque lands.
      - Early in the 9th century a tomb in Galicia was proclaimed to be that of the apostle James, and Santiago de Compostela grew into a great shrine. While the emirate was distracted by revolts, Asturian kings and counts settled the thinly peopled lands to the south, taking over or refounding towns. León was resettled in 856, Porto taken in 868, Coimbra in 878, Burgos founded in 884 and Zamora resettled in 893. By about 910 the frontier ran along the Duero, and Alfonso III’s sons moved the court south to León, which gave the kingdom its new name.
    facts:
      - [Fall of Barcelona, "801, to Louis the Pious"]
      - [Duero lands settled, "León 856, Porto 868, Coimbra 878, Burgos 884, Zamora 893"]
      - [Court moved to León, "910"]
    markers:
