  - title: Almanzor
    date: 978–1002
    when: "978"
    borders: "1002-08-09"
    countries: [es, pt]
    body:
      - Under Abd al-Rahman’s son al-Hakam II the frontier was quiet, but when he died in 976 his heir Hisham II was a boy. Within a few years power passed to the chamberlain, Muhammad ibn Abi Amir, who took the title al-Mansur, “the victorious”, and is known to the Christians as Almanzor. He built a professional army of Berber troops from North Africa and paid Christian mercenaries, and he led raids against the Christian north almost every year, about fifty-six in all, for captives, cattle and loot.
      - His raids reached every Christian capital. In July 985 he took Barcelona and killed or enslaved many of its people; when the Frankish king sent no help, the counts of Barcelona drifted out of his kingdom. He took Coimbra in 987 and sacked León, and in August 997 he sacked Santiago de Compostela, which its bishop had evacuated, sparing the apostle’s tomb but carrying the cathedral’s bells to Córdoba. He fell ill on a raid into the Rioja in 1002 and died at Medinaceli that August. The later Christian story of his defeat at Calatañazor is a legend.
    facts:
      - [Sack of Barcelona, "6 July 985"]
      - [Sack of Santiago de Compostela, August 997]
      - [Death of Almanzor, "August 1002, at Medinaceli"]
    markers:
      - kind: taken
        side: and
        name: Barcelona
        date: 1–6 July 985
        text: After beating Count Borrell II’s army, Almanzor besieged Barcelona by land and sea and stormed it. The count escaped by sea.
        lonlat: [2.177, 41.383]
      - kind: taken
        side: and
        name: Coimbra
        date: 28 June 987
        text: Taken from León after more than a century, Coimbra stayed in Muslim hands until 1064.
        lonlat: [-8.414, 40.203]
      - kind: taken
        side: and
        name: León
        date: 980s–990s
        text: Almanzor’s armies took and sacked the Leonese capital more than once.
        lonlat: [-5.57, 42.606]
      - kind: taken
        side: and
        name: Santiago de Compostela
        date: August 997
        text: Almanzor’s army, supported by a fleet from Alcácer do Sal, sacked the town after its bishop, Pedro de Mezonzo, had led its people away.
        lonlat: [-8.544, 42.878]
      - kind: event
        name: Medinaceli
        date: August 1002
        text: Almanzor died in this frontier fortress on his way home from his last campaign.
        lonlat: [-2.435, 41.172]
      - kind: event
        name: Calatañazor
        date: 1002 (legend)
        text: Christian chronicles from the 13th century claim that Almanzor was beaten here just before his death. No source from the time mentions a battle.
        lonlat: [-2.817, 41.699]
        lp: t
