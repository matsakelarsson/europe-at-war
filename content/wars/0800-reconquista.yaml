  - title: The battle of the Strait
    date: 1275–1350
    when: "1340"
    borders: "1350-03-26"
    countries: [es, pt, ma, gi]
    body:
      - The last great struggle was for the Strait of Gibraltar. Granada’s emirs, squeezed by Castile, called on the Marinids, who had replaced the Almohads in Morocco, and from 1275 Marinid armies crossed to Algeciras and Tarifa to raid Andalusia. Castile fought for the ports. Sancho IV took Tarifa in 1292, and in 1294 its commander, Alonso Pérez de Guzmán, held it against a Marinid siege, refusing, by a famous tradition, to surrender it even to save his captive son. Ferdinand IV took Gibraltar in 1309, but the Marinids won it back in 1333.
      - In 1340 the Marinid sultan Abu al-Hasan destroyed the Castilian fleet off Algeciras, crossed with a large army and, with Yusuf I of Granada, besieged Tarifa. Alfonso XI of Castile and Afonso IV of Portugal marched to its relief, and on 30 October they routed the two Muslim rulers on the Río Salado. It was the last great invasion from North Africa. Alfonso then besieged Algeciras from 1342; crusaders from many lands joined him, the defenders used early gunpowder weapons, and the city surrendered in March 1344. In March 1350 Alfonso died of the Black Death while besieging Gibraltar.
    facts:
      - [Tarifa taken, "13 October 1292"]
      - [Battle of Río Salado, "30 October 1340, Castilian and Portuguese victory"]
      - [Algeciras surrenders, "26 March 1344"]
    markers:
      - kind: held
        side: chr
        name: Tarifa
        date: "1294"
        text: Guzmán “el Bueno” held the town against the Marinids and their ally, the Castilian prince John, who had his son in his power. The boy was killed.
        lonlat: [-5.606, 36.014]
        lp: b
      - kind: battle
        side: chr
        name: Battle of Río Salado
        date: 30 October 1340
        text: Alfonso XI attacked across the river while the Tarifa garrison sallied out, and the Portuguese beat the Granadans. The sultan’s camp was overrun.
        lonlat: [-5.615, 36.045]
        lp: l
      - kind: taken
        side: chr
        name: Algeciras
        date: 26 March 1344
        text: After a siege of twenty months the garrison and people left under a truce. Granada retook the town in 1369 and later razed it.
        lonlat: [-5.454, 36.127]
        lp: t
