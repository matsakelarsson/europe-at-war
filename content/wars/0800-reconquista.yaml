  - title: Alarcos and Las Navas de Tolosa
    date: 1172–1212
    when: "1195"
    borders: "1212-07-16"
    countries: [es, pt, ma]
    body:
      - The Almohads, ruling from Marrakesh, took over al-Andalus, and by 1172 they had absorbed the last independent kingdom, Ibn Mardanish’s Murcia. Castile, León and Portugal, now separate kingdoms, fought them and each other along a frontier guarded by new military orders such as Calatrava and Santiago. Alfonso VIII of Castile took Cuenca in 1177. But on 18 July 1195, at Alarcos, near today’s Ciudad Real, the caliph Abu Yusuf Yaqub al-Mansur routed him, and Almohad armies then raided as far as Toledo and Madrid.
      - Pope Innocent III proclaimed a crusade, and in 1212 Alfonso VIII, Peter II of Aragon and Sancho VII of Navarre gathered at Toledo with the military orders, a Portuguese contingent and crusaders from beyond the Pyrenees, most of whom went home after the capture of Calatrava. Crossing the Sierra Morena by a little-used pass, the army met the caliph Muhammad al-Nasir at Las Navas de Tolosa on 16 July 1212 and broke his army. Baeza was abandoned and Úbeda stormed, many of its people killed or enslaved. Almohad power never recovered.
    facts:
      - [Battle of Alarcos, "18 July 1195, Almohad victory"]
      - [Battle of Las Navas de Tolosa, "16 July 1212, Christian victory"]
    markers:
      - kind: taken
