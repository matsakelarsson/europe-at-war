        text: Fernán González resettled Sepúlveda, carrying Castile’s frontier south of the Duero.
        lonlat: [-3.745, 41.297]
      - kind: taken
        side: chr
        name: Salamanca
        date: After 939
        text: Ramiro II resettled Salamanca and Ledesma on the Tormes in the years after the battle.
        lonlat: [-5.664, 40.965]
    arrows:
