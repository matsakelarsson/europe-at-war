  - title: Sagrajas and El Cid’s Valencia
    date: 1086–1102
    when: "1086"
    borders: "1102-05-05"
    countries: [es, ma]
    body:
      - The fall of Toledo alarmed the taifa kings. Al-Mutamid of Seville and others called on Yusuf ibn Tashfin, emir of the Almoravids, a strict Berber religious movement that had conquered Morocco. His army crossed to Algeciras in the summer of 1086, and on 23 October, at Sagrajas (al-Zallaqa) near Badajoz, it routed Alfonso VI, who escaped wounded. Yusuf went home, but he returned in 1088 and, finding the taifa rulers as divided as ever, deposed them one by one from 1090, beginning with Granada and Seville, until al-Andalus was an Almoravid province.
      - In the east one Christian leader held his ground. Rodrigo Díaz de Vivar, El Cid, a Castilian noble twice exiled by Alfonso VI, had served the Muslim rulers of Zaragoza and built up a following of his own. He besieged Valencia from 1092, starved it into surrender in June 1094, beat an Almoravid army at Cuarte that October and ruled the city as an independent lord. After his death in 1099 his widow, Jimena, held it until 1102, when Alfonso VI judged it indefensible, evacuated it and set it on fire. The Almoravids entered on 5 May.
    facts:
      - [Battle of Sagrajas, "23 October 1086, Almoravid victory"]
      - [El Cid takes Valencia, June 1094]
      - [Valencia abandoned, May 1102]
    markers:
      - kind: event
        side: afr
        name: Algeciras
        date: July 1086
        text: Al-Mutamid of Seville handed over the port so that Yusuf’s army could land.
        lonlat: [-5.454, 36.127]
      - kind: battle
        side: afr
        name: Battle of Sagrajas
        date: 23 October 1086
        text: Yusuf’s Almoravids and the taifa armies routed Alfonso VI, who escaped with a leg wound. Christian losses were heavy.
        lonlat: [-6.901, 38.923]
      - kind: held
        side: chr
        name: Aledo
        date: "1088"
        text: A Castilian garrison in this castle held out against Yusuf and the taifa kings, whose quarrels during the siege persuaded him to depose them.
        lonlat: [-1.574, 37.796]
      - kind: taken
        side: afr
        name: Seville
        date: September 1091
        text: Almoravid troops took the city and sent al-Mutamid into exile at Aghmat in Morocco, where he died in 1095.
        lonlat: [-5.995, 37.389]
      - kind: taken
        side: chr
        name: Valencia
        date: June 1094
        text: After a siege of almost two years the starving city surrendered to the Cid, who later had its qadi, Ibn Jahhaf, burned alive.
        lonlat: [-0.376, 39.47]
      - kind: battle
        side: chr
        name: Battle of Cuarte
        date: 21 October 1094
        text: The Cid broke the Almoravid army that had come to retake Valencia, the first defeat of a large Almoravid army in the peninsula.
        lonlat: [-0.431, 39.481]
        lp: l
    arrows:
      - side: afr
        label: Yusuf ibn Tashfin
        phase: 1
        via: [[-5.32, 35.89], [-5.45, 36.13], [-5.99, 37.39], [-6.85, 38.86]]
      - side: chr
