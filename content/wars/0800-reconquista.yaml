  - title: Zaragoza and Alfonso the Battler
    date: 1108–1134
    when: "1108"
    borders: "1134-09-07"
    countries: [es, fr, ma]
    body:
      - The Almoravids pressed on against Castile. At Uclés, on 29 May 1108, they destroyed a Castilian army, and Sancho, Alfonso VI’s only son, was killed in the flight. When the old king died the next year his daughter Urraca married Alfonso I of Aragon and Navarre, a match that soon turned into war between them. In 1110 the Almoravids took Zaragoza, the last independent taifa. Its fall threatened the Ebro valley, where Aragon had been advancing for decades and had taken Huesca in 1096.
      - Alfonso I, the Battler, answered with a crusade. With French lords such as Gaston of Béarn, a veteran of the capture of Jerusalem, he besieged Zaragoza from May 1118 and took it on 18 December. Tudela, Tarazona and Calatayud followed, and in 1120 he beat an Almoravid relief army at Cutanda. In 1125–1126 he led a raid deep into Andalusia, bringing back thousands of Mozarab Christians to settle his new lands. In July 1134 the Almoravids routed him at Fraga, and he died that September, leaving his kingdoms to the military orders; nobody obeyed the will, and Aragon and Navarre went separate ways.
    facts:
      - [Battle of Uclés, "29 May 1108, Almoravid victory"]
      - [Zaragoza taken, "18 December 1118"]
      - [Battle of Fraga, "17 July 1134, Almoravid victory"]
    markers:
      - kind: battle
        side: afr
        name: Battle of Uclés
        date: 29 May 1108
        text: The Almoravid governor Tamim beat the Castilians. Many Leonese and Castilian nobles were killed, and the young prince Sancho was murdered by villagers as he fled.
        lonlat: [-2.862, 39.982]
      - kind: taken
        side: chr
        name: Huesca
        date: "1096"
        text: Peter I of Aragon took the town after beating a relief army from Zaragoza at Alcoraz.
        lonlat: [-0.417, 42.133]
      - kind: taken
        side: chr
        name: Zaragoza
        date: 18 December 1118
        text: After a seven-month siege the city surrendered on terms, and Alfonso made it his capital. Many of its Muslims left.
        lonlat: [-0.883, 41.65]
      - kind: taken
        side: chr
        name: Tudela
        date: "1119"
        text: The Ebro town fell soon after Zaragoza, with Tarazona and the rest of the lower Ebro valley.
        lonlat: [-1.607, 42.065]
      - kind: battle
        side: chr
        name: Battle of Cutanda
        date: 17 June 1120
        text: Alfonso and Duke William IX of Aquitaine beat an Almoravid army marching to relieve Calatayud, which then surrendered.
        lonlat: [-1.185, 40.936]
      - kind: battle
        side: afr
        name: Battle of Fraga
        date: 17 July 1134
        text: An Almoravid relief army caught Alfonso’s besieging army outside Fraga. He escaped but died seven weeks later.
        lonlat: [0.35, 41.52]
    arrows:
      - side: chr
        label: Alfonso I, 1125–26
        via: [[-0.88, 41.65], [-0.38, 39.47], [-1.13, 37.98], [-3.56, 37.18]]
  - title: Lisbon, Almería and Tortosa
    date: 1139–1149
    when: "1139"
    borders: "1149-10-24"
    countries: [es, pt]
    body:
      - By the 1140s Almoravid rule was collapsing. In Morocco the Almohads, a rival reform movement from the Atlas mountains, were taking the cities one by one, and in al-Andalus local leaders rebelled and set up new taifas. The Christian rulers moved fast. Afonso Henriques, count of Portugal, had won a battle at Ourique in 1139 and called himself king, a title Castile accepted in 1143, and on 15 March 1147 his men took Santarém by a night assault.
      - That summer a fleet of crusaders bound for the Holy Land, from England, Flanders and the Rhineland, put in at Porto and agreed to help him take Lisbon. After a siege of four months the city surrendered on 24 October, and the crusaders plundered it and killed many people, among them its Mozarab bishop. A week earlier Alfonso VII of León–Castile, with Genoese, Catalan and Navarrese help, had taken Almería, and Count Ramon Berenguer IV of Barcelona, ruler of Aragon by his betrothal to its heiress, went on to take Tortosa in December 1148 and Lleida in October 1149.
    facts:
      - [Siege of Lisbon, "1 July – 25 October 1147"]
      - [Almería taken, "17 October 1147"]
      - [Tortosa and Lleida taken, "30 December 1148 and 24 October 1149"]
