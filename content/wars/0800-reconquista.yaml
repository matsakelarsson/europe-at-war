        text: Louis the Pious’s army starved the city into surrender after a siege of several months. It became the seat of the counts of Barcelona.
        lonlat: [2.177, 41.383]
      - kind: event
        side: chr
        name: Oviedo
        date: 791–910
        text: Alfonso II made Oviedo the capital of Asturias and built its first churches.
        lonlat: [-5.845, 43.36]
      - kind: event
        name: Santiago de Compostela
        date: 9th century
        text: The supposed tomb of Saint James was found here, perhaps in the 820s or 830s. The shrine came to draw pilgrims from all over Europe.
        lonlat: [-8.544, 42.878]
      - kind: taken
        side: chr
        name: Porto
        date: "868"
        text: Count Vímara Peres took the town at the mouth of the Douro. The county that grew up around it gave Portugal its name.
        lonlat: [-8.611, 41.15]
      - kind: taken
        side: chr
        name: Coimbra
        date: "878"
        text: The town on the Mondego marked the southern limit of Asturian settlement in the west until Almanzor took it back in 987.
        lonlat: [-8.414, 40.203]
      - kind: event
