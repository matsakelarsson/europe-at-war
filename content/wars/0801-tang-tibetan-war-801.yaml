  - title: Raids, and the treaty of 821–822
    date: 802–823
    when: "821"
    borders: "822-06-01"
    countries: [cn]
    body:
      - After 802 the war became a matter of raids along a frontier that ran only about 150 km west of Chang’an. Tibetan armies struck at Qingzhou in 819 and at Yanzhou on the edge of the Ordos in 821, where the Tang governor drove them off, while Tibet fought the Uyghurs in the north, raiding towards their capital Ordu-Baliq in 816, and the Abbasid caliph al-Ma’mun in the west. Buddhist clergy on both sides urged peace, and the Tibetan emperor Ralpacan and the Tang emperor Muzong agreed to negotiate.
      - The treaty was sworn at a ceremony in Chang’an in the autumn of 821, and the Tang envoy Liu Yuanding carried it to Lhasa, where it was sworn again in 822. It described the two rulers as nephew and uncle, fixed the frontier where it then lay, leaving the Hexi Corridor and Longyou to Tibet, and promised that neither side would cross it. Pillars with the text in Tibetan and Chinese were set up at Chang’an, on the frontier and, in 823, in front of the Jokhang in Lhasa, where one still stands. The peace held for about twenty years, until the Tibetan Empire broke up after the death of Langdarma in 842.
    facts:
      - [Treaty sworn at Chang’an, "821"]
      - [Treaty sworn at Lhasa, "822"]
      - [Treaty pillar at the Jokhang, "823"]
