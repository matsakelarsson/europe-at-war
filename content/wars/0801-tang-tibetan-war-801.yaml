notes:
  - The war is known almost only from Chinese sources, the Old and New Books of Tang and the Zizhi Tongjian, which give Tang victories and Tibetan losses in round numbers; Tibetan records of the period say little about it. The year of the Weizhou siege and Lun Mangre’s capture is given as 801 or 802.
  - Nanzhao, the kingdom of the Erhai lake in Yunnan, is shown with the Dali Kingdom that later ruled the same lands.
