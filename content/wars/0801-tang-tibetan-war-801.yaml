steps:
  - title: Wei Gao and Nanzhao on the southern frontier
    date: 801–802
    when: "801"
    borders: "801-06-01"
    countries: [cn]
    body:
      - Since the An Lushan rebellion of the 750s the Tibetan Empire had taken the Tang lands west of the Long mountains, the Hexi Corridor and the Tarim Basin, and its armies raided the frontier circuits around Chang’an almost every year. On the south-western front Tibet had long been allied with Nanzhao, but in 794 the Nanzhao king Yimouxun, won over by years of letters from Wei Gao, the Tang military governor at Chengdu, turned on the Tibetans and submitted to the Tang.
      - In 801, with Tibetan armies pressing the Tang garrisons in the north, the emperor Dezong ordered Wei Gao to attack in the south-west to draw them off. Wei Gao’s troops and Nanzhao forces stormed and burned a string of Tibetan forts; Tang reports claimed more than 10,000 Tibetans killed, and among the prisoners were soldiers from the Abbasid lands whom Tibet had pressed into service. Wei Gao then besieged Weizhou, the fortress above the Min valley that Tibet had held since 763, and Kunming in today’s Yanyuan. A Tibetan army under Lun Mangre came to relieve them and was beaten, and Lun Mangre was taken prisoner and sent to Chang’an. But the sieges cost Wei Gao heavy losses and he withdrew without taking either town.
    facts:
      - [Nanzhao breaks with Tibet, "794"]
      - [Wei Gao’s offensive, "801"]
      - [Lun Mangre captured, "801–802"]
