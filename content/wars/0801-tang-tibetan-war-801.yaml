id: tang-tibetan-war-801
name: Tang–Tibetan war (801–821)
start: "801"
end: "822"
tier: B
summary: "The last phase of the long wars between Tang China and the Tibetan Empire, ended by the treaty of 821–822. Tibet then held the Hexi Corridor, Longyou and the Tarim Basin, and its armies raided the Tang frontier in the Ordos and the west every few years. In 801 the Tang governor of Xichuan (Sichuan), Wei Gao, and Nanzhao, which had broken with Tibet in 794, attacked the Tibetan forts on the south-eastern frontier; they besieged Weizhou and Kunming (today’s Yanyuan) and early in 802 captured the Tibetan commander Lun Mangre, but could not take the towns. Raids and counter-raids went on under the Tibetan emperors Tride Songtsen and Ralpacan, who were also fighting the Uyghurs and the Abbasids. In 821 envoys of Ralpacan and the Tang emperor Muzong swore a treaty at Chang’an, sworn again at Lhasa in 822, which fixed the frontier where it then lay. Its bilingual text, put up in 823 on a pillar in front of the Jokhang, still stands."
countries: [cn]
sides:
  - id: tang
    name: Tang China and Nanzhao
    polities: [tang, dali]
    ink: red
    moves: Tang and Nanzhao moves
    success: Tang or Nanzhao success
  - id: tib
