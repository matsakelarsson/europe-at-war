steps:
  - title: Serdica
    date: 807–809
    when: "807"
    borders: "809-04"
    countries: [bg, tr]
    body:
      - Krum, who became khan of the Bulgars around 800, first turned north-west, where the Avar khaganate had been broken by Charlemagne’s Franks; by about 805 he had taken over its eastern lands, bringing Bulgaria to the borders of the Frankish empire. In the south lay the Byzantine Empire, ruled since 802 by Nikephoros I, a former finance minister who meant to recover the Balkans. His first campaign, in 807, got no further than Adrianople, where he turned back after discovering a plot against him.
      - In 808 or 809 the Bulgarians surprised a Byzantine army in the valley of the Struma and captured the money sent to pay it. Then, shortly before Easter 809, Krum took Serdica, the Byzantine stronghold on the main road across the Balkans. Theophanes writes that he killed the garrison of 6,000 men and many civilians, although they had surrendered on terms. Nikephoros marched north, claimed to have reached Krum’s capital, Pliska, and tried to rebuild Serdica. In 810 he moved settlers from Asia Minor into the Slav lands on the frontier to hold it.
    facts:
      - [Serdica taken, "Spring 809, shortly before Easter"]
      - [Byzantine emperor, "Nikephoros I (802–811)"]
    markers:
      - kind: event
        side: byz
        name: Adrianople
        date: "807"
        text: Nikephoros’s first campaign against Bulgaria ended here, when he learned of a conspiracy among his officers and returned to Constantinople.
        lonlat: [26.556, 41.677]
      - kind: taken
        side: bg
        name: Serdica
        date: Spring 809
        text: Krum took the city on terms and then, according to Theophanes, put the garrison of 6,000 men to death. Some officers escaped to Constantinople; the emperor refused them a hearing.
        lonlat: [23.33, 42.7]
      - kind: event
        name: Pliska
        date: "809"
        text: The khans’ capital, a great walled enclosure with a stone palace in its centre. Nikephoros claimed to have celebrated Easter 809 in Krum’s palace; some historians doubt he got so far.
        lonlat: [27.132, 43.387]
    arrows:
