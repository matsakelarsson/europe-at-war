  - title: Pliska and the death of Nikephoros
    date: "811"
    when: "811-07"
    borders: "811-07-26"
    countries: [bg, tr]
    body:
      - "In the summer of 811 Nikephoros invaded Bulgaria with a large army drawn from the themes of Thrace and Asia Minor and the guard regiments, and his son Staurakios at his side. He refused Krum’s offers of peace at the frontier fortress of Marcellae, crossed the Balkan Mountains and, after beating the forces Krum could gather in haste, took Pliska on 20 July. The palace was looted and burned. Later sources describe the Byzantine troops killing the people of the town, children among them."
      - "Krum armed everyone he could and blocked the passes with ditches and wooden palisades. As the army marched south through a narrow valley, usually identified as the Varbitsa Pass, it found itself trapped, and at dawn on 26 July the Bulgarians fell on its camp. The army broke; many men died at the palisades or in a river. Nikephoros was killed, the first Byzantine emperor to die in battle since Valens in 378. Theophanes writes that Krum had his skull lined with silver and drank from it. Staurakios, badly wounded in the neck, reigned for a few weeks and died in 812."
    facts:
      - [Pliska taken, 20 July 811]
      - [Battle of Pliska, "26 July 811, Bulgarian victory; Nikephoros I killed"]
      - [Also called, the battle of the Varbitsa Pass]
    markers:
      - kind: event
        name: Marcellae
        date: July 811
        text: At this frontier fortress, near today’s Karnobat, Nikephoros turned down Krum’s offer of peace.
        lonlat: [27.05, 42.65]
        lp: l
      - kind: taken
        side: byz
        name: Pliska
        date: 20 July 811
        text: The Byzantines took the Bulgarian capital, looted Krum’s treasury and burned the palace.
        lonlat: [27.132, 43.387]
      - kind: battle
        side: bg
        name: Battle of Pliska
        date: 26 July 811
        text: The returning army was trapped behind wooden barriers in a mountain pass and destroyed in a dawn attack. Nikephoros and many of his senior officers were killed.
        lonlat: [26.65, 42.95]
    arrows:
      - side: byz
        label: Nikephoros I
        phase: 1
        via: [[28.9, 41.05], [26.7, 41.75], [27.05, 42.6], [27.1, 43.3]]
      - side: byz
        phase: 2
        via: [[27.08, 43.33], [26.8, 43.12], [26.67, 42.98]]
  - title: Versinikia, Constantinople and the peace
    date: 812–815
    when: "812"
    borders: "815"
    countries: [bg, tr]
    body:
      - "In 812 Krum took Develtos and, that autumn, the port of Mesembria, where he captured a supply of Greek fire and the bronze tubes used to throw it. Nikephoros’s son-in-law, Michael I, refused his offer of peace. In June 813 Michael led a large army north and met Krum near Versinikia, north of Adrianople. After two weeks of waiting the Byzantines attacked on 22 June and were routed. Byzantine writers later suspected Leo the Armenian, whose Anatolian troops were among the first to leave the field. Within weeks Michael had abdicated and Leo was emperor."
      - "On 17 July Krum appeared before Constantinople and made sacrifices outside the Golden Gate. Leo invited him to a parley and set archers to kill him; Krum escaped wounded. In revenge he burned the suburbs, took Adrianople and carried thousands of its people off beyond the Danube, among them the family of the future emperor Basil I. He was preparing siege engines for an assault on the city when he died on 13 April 814. His son Omurtag made a thirty-year peace in 815 or 816. The frontier ran from Develtos inland along an earthwork, later called the Erkesia, and it held for most of the century."
    facts:
      - [Battle of Versinikia, "22 June 813, Bulgarian victory"]
      - [Krum before Constantinople, 17 July 813]
      - [Peace, "815 or 816, for thirty years, under Omurtag"]
    markers:
      - kind: taken
        side: bg
        name: Mesembria
        date: Autumn 812
        text: The Black Sea port fell after a short siege. Theophanes says the Bulgarians found 36 bronze siphons for Greek fire and a store of the fire itself.
        lonlat: [27.733, 42.65]
      - kind: taken
        side: bg
        name: Develtos
        date: "812"
        text: Krum took the town and moved its people, with their bishop, into Bulgaria. Its site is near today’s Debelt, south of Burgas.
        lonlat: [27.27, 42.4]
        lp: b
      - kind: battle
        side: bg
        name: Battle of Versinikia
        date: 22 June 813
        text: The armies faced each other for two weeks. When the Byzantines attacked, their line broke almost at once and Krum’s cavalry pursued them. The exact site is unknown; some scholars place it near Elhovo.
        lonlat: [26.6, 42.1]
      - kind: held
        side: byz
        name: Constantinople
        date: July 813
        text: Krum’s army could not storm the land walls, and he had no fleet. An attempt to kill him at a parley outside the walls failed.
        lonlat: [28.975, 41.01]
      - kind: taken
        side: bg
        name: Adrianople
        date: "813"
        text: Krum’s brother besieged the city, which surrendered after Krum’s return. Thousands of its people were deported north of the Danube.
        lonlat: [26.556, 41.677]
        lp: l
