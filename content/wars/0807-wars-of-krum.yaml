id: wars-of-krum
name: Krum’s wars with Byzantium
start: "807"
end: "815"
tier: B
summary: The wars between Khan Krum of Bulgaria and the Byzantine Empire, in which Krum took Serdica (Sofia), destroyed the army of the Emperor Nikephoros I in the Balkan passes in 811 and killed him, routed Michael I at Versinikia in 813 and stood before the walls of Constantinople. After Krum’s death in 814 his son Omurtag made a thirty-year peace that fixed the frontier in northern Thrace.
countries: [bg, tr]
sides:
  - id: bg
    name: Bulgaria
    polities: [bulgaria]
    ink: green
    moves: Bulgarian moves
    success: Bulgarian success
  - id: byz
    name: Byzantine Empire
    polities: [byzantium]
    ink: purple
    moves: Byzantine moves
    success: Byzantine success
notes:
  - The main source is the chronicle of Theophanes the Confessor, a contemporary who was hostile to Nikephoros I, with a fragment by an anonymous writer (the Scriptor Incertus) for 811–815. Both were written on the Byzantine side; Bulgarian inscriptions add a little. Numbers are uncertain, and some events (the Struma defeat, the peace) are dated a year apart in different accounts.
  - Krum’s title was khan (in the inscriptions kanasubigi). Serdica is today’s Sofia, Develtos stood near Debelt south of Burgas, Mesembria is Nesebar, Adrianople is Edirne and Arcadiopolis is Lüleburgaz in Turkey.
