steps:
  - title: Rayy and the siege of Baghdad
    date: 811–813
    when: "811-07-03"
    borders: "813-09"
    countries: [iq, ir]
    body:
      - Harun al-Rashid had divided his succession. Al-Amin was to be caliph in Baghdad, and al-Ma’mun his heir and governor of Khorasan with wide powers over the east. After Harun died at Tus in March 809, al-Amin, urged by his vizier al-Fadl ibn al-Rabi, moved to replace al-Ma’mun as heir with his own son, and al-Ma’mun, advised by his minister al-Fadl ibn Sahl, refused to give way. In January 811 al-Amin sent Ali ibn Isa ibn Mahan, a former governor of Khorasan, east with an army said to number 40,000.
      - On 3 July 811, near Rayy, al-Ma’mun’s general Tahir ibn al-Husayn, with perhaps 4,000 to 5,000 men, routed this army, and Ali ibn Isa was killed. Tahir then beat a second army under Abd al-Rahman ibn Jabala near Hamadan and wintered at Hulwan, at the edge of Iraq. In 812, joined by Harthama ibn A’yan, he took Khuzestan, Wasit, Kufa and al-Mada’in, and in August he reached Baghdad.
      - Baghdad held out for more than a year. Most of al-Amin’s regular troops deserted, and the city was defended largely by its poor, lightly armed, against Tahir’s siege engines; whole quarters were burnt and destroyed. In September 813 Tahir’s troops took the city. Al-Amin tried to surrender to Harthama, but Tahir’s men seized him and killed him, and his head was sent to al-Ma’mun.
    facts:
      - [Battle of Rayy, "3 July 811, victory of al-Ma’mun’s army"]
      - [Siege of Baghdad, "August 812 – September 813"]
      - [Death of al-Amin, "September 813"]
