  - title: The caliph in Merv
    date: 813–819
    when: "817"
    borders: "819-08"
    countries: [iq, ir, tm]
    body:
      - Al-Ma’mun did not come to Baghdad. He ruled from Merv through al-Fadl ibn Sahl, while Iraq, left to his governors, fell into disorder. In January 815 the Alid rebel Abu’l-Saraya rose at Kufa, and the revolt spread to Basra, Mecca and Yemen before Harthama crushed it; Abu’l-Saraya was executed in October. In northern Syria and the Jazira, Nasr ibn Shabath led Arab tribesmen against al-Ma’mun’s governors, and Egypt was split between rival factions.
      - On 24 March 817 al-Ma’mun named an Alid, Ali al-Rida, the eighth imam of the Twelver Shi’a, as his heir, and replaced the black colour of the Abbasids with green. The Abbasid family in Baghdad answered by proclaiming his uncle, Ibrahim ibn al-Mahdi, caliph on 17 July 817. Al-Ma’mun left Merv for Iraq in January 818. On the way al-Fadl ibn Sahl was murdered at Sarakhs, and Ali al-Rida died near Tus on 5 September 818, possibly poisoned; his tomb grew into the shrine city of Mashhad.
      - Ibrahim’s support melted away and he went into hiding, and on 17 August 819 al-Ma’mun entered Baghdad unopposed. He returned to the black of the Abbasids, and in 821 he made Tahir governor of Khorasan, where Tahir’s family ruled for half a century. Nasr ibn Shabath submitted only in 825, and Egypt was pacified in 827.
    facts:
      - [Revolt of Abu’l-Saraya, "January – October 815"]
      - [Ibrahim ibn al-Mahdi proclaimed caliph, "17 July 817"]
      - [Al-Ma’mun enters Baghdad, "17 August 819"]
