id: fourth-fitna
name: Fourth Fitna
start: "811-01"
end: "819-08"
tier: B
summary: The Abbasid civil war between two sons of Harun al-Rashid, al-Amin, caliph in Baghdad, and his half-brother al-Ma’mun, governor of Khorasan at Merv. When al-Amin tried to cut al-Ma’mun out of the succession, war broke out in 811. Al-Ma’mun’s general Tahir ibn al-Husayn beat al-Amin’s armies at Rayy and Hamadan and, after a siege of more than a year that wrecked much of Baghdad, took the city in September 813, and al-Amin was killed. Al-Ma’mun stayed in Merv, and revolts in Iraq, Arabia, Syria and Egypt and the proclamation of a rival caliph in Baghdad in 817 kept the caliphate divided until he entered Baghdad in August 819.
countries: [iq, ir, tm]
sides:
  - id: amin
    name: Al-Amin
    polities: [abbasid]
    ink: green
    moves: Al-Amin’s moves
    success: Al-Amin’s success
  - id: mamun
    name: Al-Ma’mun
    polities: [abbasid]
    ink: navy
    moves: Al-Ma’mun’s moves
    success: Al-Ma’mun’s success
notes:
  - Both sides were the Abbasid caliphate, which the map shows in one colour. Al-Amin’s mother was Harun’s Arab wife Zubayda, while al-Ma’mun, the elder brother, was the son of a Persian concubine and drew his support mainly from Khorasan. Later writers made the war a struggle between Arabs and Persians, a view historians now consider too simple.
  - Fitna (“trial, discord”) is the Arabic word for the civil wars of early Islam; this was the fourth. Army sizes come from the chroniclers and are uncertain.
