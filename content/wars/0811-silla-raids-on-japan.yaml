notes:
  - "The raids are known only from Japanese chronicles (the Nihon Kōki, Nihon Sandai Jitsuroku, Nihon Kiryaku and Fusō Ryakki); Korean sources do not mention them. Who the raiders were is uncertain: the captive’s claim of a royal order in 894 is unconfirmed, and some historians see them as people of Silla’s rebellious coastal regions, where central authority had collapsed by the 890s. Japanese records of the time also called raiders from later Goryeo “Silla”."
  - Dates are years and months of the Japanese lunar calendar.
