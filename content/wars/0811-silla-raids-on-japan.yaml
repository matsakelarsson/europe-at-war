id: silla-raids-on-japan
name: Silla raids on Japan
start: "811"
end: "895"
tier: C
summary: "Raids by seafarers from Silla on Tsushima, the Gotō Islands and the coasts of northern Kyushu in the ninth century, at a time when official relations between the two states had broken down and Silla was sinking into famine and rebellion. Japanese records report three Silla ships off Tsushima in the twelfth month of 811, and in 813 a landing by 110 men on Ojika in the Gotō Islands, where nine islanders were killed and about a hundred taken prisoner. In the sixth month of 869 raiders in two ships entered Hakata Bay and carried off the silk and floss of a tax ship from Buzen; the court sent offerings to the shrines of Ise and others and strengthened Tsushima with frontier guards, crossbowmen and Emishi soldiers. In 893 raiders burned houses in Higo and appeared off Matsuura in Hizen. The largest attack came in the ninth month of 894, when 45 ships reached Tsushima. The governor, Fun’ya no Yoshitomo, met them with crossbows and local levies and reported about 300 raiders killed and eleven boats taken; a captive said that famine had emptied Silla’s granaries and that its king had sent a hundred ships and 2,500 men to seize grain and silk. Iki was raided again in 895. The raids deepened the Japanese court’s mistrust of its neighbours, which carried over to Goryeo after Silla’s fall in 935."
