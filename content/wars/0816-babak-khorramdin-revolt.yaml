  - title: Afshin and the fall of Badhdh
    date: 835–838
    when: "837-08"
    borders: "838-01"
    countries: [ir, az, am]
    body:
      - In 835 the caliph al-Mu’tasim gave command against Babak to al-Afshin Khaydhar ibn Kawus, a prince of Ushrusana in Central Asia. Afshin rebuilt the ruined forts on the roads from Ardabil, guarded his supply caravans with a relay of posts and advanced slowly from his base at Barzand. Babak’s attempt to seize a caravan carrying the army’s pay failed, though in 836–837 he routed a force under Afshin’s officer Bugha al-Kabir. In 837 the Byzantine emperor Theophilos, whose army included the Khurramite refugees, invaded the caliphate’s frontier lands on the upper Euphrates and sacked Sozopetra and Arsamosata.
      - Reinforced by the caliph, Afshin closed in on Badhdh and stormed it in August 837 after a hard fight, then plundered and demolished it. Babak escaped with his family and a few men, hoping to reach Byzantium, but Sahl Smbatean, the Armenian prince of Khachen, took him in and handed him over to Afshin for a reward.
      - In January 838 Afshin brought Babak to Samarra, where he was paraded before the caliph on an elephant. His hands and feet were cut off, he was killed, and his body was gibbeted. The war with Byzantium went on, and in the summer of 838 al-Mu’tasim sacked Amorium. Afshin, honoured as the victor, fell from favour two years later, accused of secret sympathy with Babak and Mazyar, and died in prison in 841.
    facts:
      - [Afshin takes command, "835"]
      - [Fall of Badhdh, "August 837"]
      - [Execution of Babak, "January 838, Samarra"]
