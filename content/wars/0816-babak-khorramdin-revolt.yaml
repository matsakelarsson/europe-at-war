id: babak-khorramdin-revolt
name: Revolt of Babak Khorramdin
start: "816"
end: "838-01"
tier: B
summary: The revolt of the Khurramites of Azerbaijan under their leader Babak against the Abbasid caliphate. From the mountain fortress of Badhdh, between Ardabil and the Aras River, Babak defeated one caliphal army after another for some twenty years, while Khurramites rose elsewhere in western Iran. The caliph al-Mu’tasim finally sent his general al-Afshin, who advanced step by step, stormed Badhdh in August 837 and received Babak from an Armenian prince who had captured him. Babak was executed at Samarra in January 838.
countries: [ir, az]
sides:
  - id: kh
    name: Khurramites
    polities: [khurramites]
    ink: orange
    moves: Khurramite moves
    success: Khurramite success
  - id: ab
    name: Abbasid Caliphate
    polities: [abbasid]
    ink: green
    moves: Abbasid moves
    success: Abbasid success
notes:
  - The Khurramites’ own writings are lost, and their beliefs are known only from hostile Muslim authors. The chroniclers’ figures for the size of Babak’s forces (100,000 to 200,000) and for the people killed in the revolt, up to 255,000 or more, are thought to be exaggerated.
  - Babak is a national hero in Iran and in the Republic of Azerbaijan today, and the ruins of the fortress near Kaleybar known as Babak Castle are usually identified with Badhdh. The site of the battle of Hashtadsar is not known.
