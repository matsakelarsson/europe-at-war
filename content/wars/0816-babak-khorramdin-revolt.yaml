steps:
  - title: Twenty years in the mountains
    date: 816–834
    when: "816"
    borders: "829-06-09"
    countries: [ir, az]
    body:
      - Babak, born in the Ardabil region in the 790s, became leader of the Khurramites of Azerbaijan around 816–817, after the death of their former leader Javidhan, whose widow he married. The Khurramites were followers of a religious movement of Iranian villagers that drew on older Iranian beliefs, on the teachings of Mazdak and on the memory of Abu Muslim, the leader of the Abbasid revolution, whom the caliph al-Mansur had put to death. Their stronghold was the fortress of Badhdh, high in the mountains south of the Aras between Ardabil and Ahar.
      - The caliphate, divided by the civil war between al-Amin and al-Ma’mun, sent one army after another. Yahya ibn Mu’adh fought Babak without success in 819–820, the troops of Isa ibn Muhammad ibn Abi Khalid were routed around 821–822, and Ahmad ibn al-Junayd was captured in 824–825. Muhammad ibn Humayd al-Tusi, who arrived in 827, won some early successes, but on 9 June 829 Babak defeated him at Hashtadsar, where he was killed and his army scattered.
      - In 833 Khurramites rose in the Jibal as well and took Karaj. Ishaq ibn Ibrahim defeated them near Hamadan, killing, according to the chroniclers, 60,000 or more. Many survivors fled into the Byzantine Empire, where the emperor Theophilos took them into his army under a leader called Nasr, baptised Theophobos.
    facts:
      - [Babak leads the Khurramites, "816–817"]
      - [Battle of Hashtadsar, "9 June 829, Khurramite victory"]
      - [Rising in the Jibal crushed, "833–834"]
