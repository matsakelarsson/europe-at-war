id: kyrgyz-uyghur-war
name: Fall of the Uyghur Khaganate
start: "820"
end: "847"
tier: B
summary: "The war in which the Yenisei Kyrgyz destroyed the Uyghur Khaganate, the empire that had ruled the Mongolian steppe since 744, and the Tang campaigns against the Uyghur refugees that followed. From about 820, according to the Tang histories, the Kyrgyz ruler on the upper Yenisei called himself khagan and fought the Uyghurs for some twenty years. After a coup, a famine and a hard winter had weakened the khaganate, a Kyrgyz army of about 80,000 horsemen, guided by a rebel Uyghur minister, sacked the Uyghur capital Ordu-Baliq in the Orkhon valley in 840 and killed the khagan. The Uyghurs scattered. Some went west to the Karluks, others to Turfan and the Gansu oases, where they founded the kingdoms of Qocho and Ganzhou; the largest group, under the new khagan Wujie, moved south to the Tang frontier in the great bend of the Yellow River. The Tang, allied with the Kyrgyz, attacked Wujie’s camp at Shahu in February 843 and broke his following; he was killed in 846, and the last Uyghur remnants on the frontier were defeated in 847. The Kyrgyz did not take over the steppe empire, and Mongolia was left without a dominant power until the Khitans."
