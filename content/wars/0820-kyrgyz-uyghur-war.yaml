  - title: The Uyghur flight and Shahu
    date: 840–847
    when: "843-02-13"
    borders: "843-02-13"
    countries: [mn, cn]
    body:
      - The Uyghurs scattered in several directions. Some fled west to the Karluks; others reached Turfan and the oases of the Hexi Corridor, where they later founded the kingdoms of Qocho and Ganzhou. Two large groups came south to the Tang frontier in the great bend of the Yellow River. One, said to number 30,000, under the noble Ormïzt, was given refuge in return for fighting the other. The second, about 100,000 people under the new khagan Wujie, camped on the frontier, intercepted Princess Taihe on her way home and asked for a Tang city to live in and for food. The emperor Wuzong refused, and in 841 Wujie’s horsemen raided the frontier circuits.
      - The Tang made common cause with the Kyrgyz, whose rulers claimed descent from the same Han-dynasty ancestor as the Tang emperors. On 13 February 843 the Tang general Shi Xiong rode out from Zhenwu and attacked Wujie’s camp at Shahu Mountain. About 10,000 Uyghurs were killed and many more captured; Wujie was wounded and fled, and Princess Taihe was brought back to Chang’an. Wuzong then ordered Ormïzt’s troops to be dispersed among Tang units; when they refused, they were cut down by the general Liu Mian. He also ordered the temples of Manichaeism, the religion of the Uyghur court, to be closed and their clergy killed. Wujie wandered the steppe until he was killed in 846, and his brother Enian was defeated by Tang troops in 847. The Kyrgyz sent envoys to Chang’an, but did not stay on the steppe they had conquered.
    facts:
      - [Battle of Shahu, "13 February 843"]
      - [Uyghur losses at Shahu, "about 10,000 killed"]
      - [Death of Wujie, "846"]
