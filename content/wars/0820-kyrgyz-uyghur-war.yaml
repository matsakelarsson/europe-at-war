notes:
  - The events are known mainly from the Tang histories and the letters of the Tang minister Li Deyu; there are no Uyghur or Kyrgyz accounts. The numbers are those of the Chinese sources.
  - Historians disagree about what the Kyrgyz did after 840. Some write of a Kyrgyz empire on the steppe until the 920s; others, such as Michael Drompp, find no sign that the Kyrgyz stayed in Mongolia after the 840s.
