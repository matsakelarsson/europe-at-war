steps:
  - title: The sack of Ordu-Baliq
    date: 820–840
    when: "840"
    borders: "840-06-01"
    countries: [mn, ru]
    body:
      - The Kyrgyz of the upper Yenisei had been subjects of the Uyghur khagans since 758, and were often in revolt. From about 820 their ruler took the title of khagan, and the Tang histories record some twenty years of war between the two peoples. In the 830s the Uyghur Khaganate was weakened by quarrels at court. In 839 the khagan Zhangxin was forced to kill himself and a minister, Qasar, took the throne with the help of Shatuo horsemen from the Ordos; in the same year famine, an epidemic and a severe winter killed much of the livestock on which the Uyghurs depended.
      - In 840 a rival Uyghur minister, Kulug Bagha, went over to the Kyrgyz and led them south. A Kyrgyz army said to number 80,000 horsemen took Ordu-Baliq, the walled Uyghur capital on the Orkhon, and burned it; Qasar was captured and beheaded, and other Uyghur towns were destroyed. The Kyrgyz also took the Tang princess Taihe, widow of an earlier khagan, and sent her towards China under escort.
    facts:
      - [Coup of Qasar, "839"]
      - [Kyrgyz army, "about 80,000 horsemen"]
      - [Ordu-Baliq sacked, "840"]
