id: kim-heon-chang-rebellion
name: Kim Heon-chang’s rebellion
start: "822"
end: "825"
tier: C
summary: "A rising against the Silla king led by Kim Heon-chang, governor of Ungcheon-ju (today’s Gongju), and renewed by his son three years later. Kim Heon-chang’s father, Kim Ju-won, a descendant of King Muyeol, had been chosen to succeed King Seondeok in 785 but was pushed aside by Kim Gyeong-sin, who became King Wonseong. In the third month of 822 Kim Heon-chang rose at Ungjin, citing that wrong as his cause, proclaimed a state called Jangan with the era name Gyeongun, and brought under his control the counties of four of Silla’s nine provinces (Mujin, Wansan, Cheong and Sabeol) and of three of its secondary capitals (Gugwon, Seowon and Geumgwan, today’s Chungju, Cheongju and Gimhae); Hansan, Udu and Sapnyang provinces, the Paegang garrison and Bugwon held out for the king. King Heondeok sent armies under Jang Ung, Wigong, Kim Gyun-jeong and Kim U-jing, which beat the rebels at Dodong pass, at Samnyeon fortress and Mount Songni, and at Seongsan, and besieged Ungjin. After about ten days Kim Heon-chang killed himself; when the city fell, 239 of his kin and leading followers were put to death and the rest were released. In the first month of 825 his son Kim Beom-mun rose again with about a hundred men, among them the outlaw leader Su-sin of Mount Godal, and attacked Bukhansan-ju, meaning to make Namp’yeongyang (in today’s Seoul) his capital, but he was defeated and killed by the provincial governor. The rebellion, which for a few weeks held almost half of Silla, is counted as the start of the long decline of the Silla state in the ninth century."
