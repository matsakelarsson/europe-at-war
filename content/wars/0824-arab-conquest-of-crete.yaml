id: arab-conquest-of-crete
name: Arab conquest of Crete
start: "824"
end: "827"
tier: B
summary: The conquest of Byzantine Crete by a band of Muslim exiles from al-Andalus, who had held Alexandria until the Abbasids expelled them. Led by Abu Hafs, they beat off the expeditions of the Emperor Michael II, founded Chandax (Heraklion) and made the island an emirate that raided the Aegean until the Byzantines retook it in 961.
countries: [gr, eg]
sides:
  - id: cr
    name: Andalusi exiles (Emirate of Crete)
    polities: [emirate-of-crete]
    ink: olive
    moves: Andalusi moves
    success: Andalusi success
  - id: byz
    name: Byzantine Empire
    polities: [byzantium]
    ink: purple
    moves: Byzantine moves
    success: Byzantine success
notes:
  - The date of the landing is uncertain. Muslim sources put it in 827 or 828, after the expulsion from Alexandria; Byzantine sources place it soon after the revolt of Thomas the Slav (821–823), and several historians now prefer about 824. The landing place is unknown.
  - The exiles are traditionally said to be survivors of the Revolt of the Suburb in Córdoba in 818, but Andalusi corsairs were active in Alexandria earlier, and their leader came from Fahs al-Ballut (Los Pedroches), north of Córdoba. Their numbers are estimated at about 12,000 people, of whom some 3,000 were fighting men.
  - The Byzantine reconquest is told in the Byzantine reconquest of Crete.
