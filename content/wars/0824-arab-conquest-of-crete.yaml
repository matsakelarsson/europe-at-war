steps:
  - title: The Andalusi exiles take Crete
    date: c. 824–827
    when: "824"
    borders: "828"
    countries: [gr, eg]
    body:
      - "In 818 the emir of Córdoba, al-Hakam I, crushed a revolt in the suburb south of his capital and exiled its people. Many of them, with other Andalusi sailors, made their way to Alexandria, where they seized power in the confusion of the Abbasid civil war. In 827 the Abbasid general Abdallah ibn Tahir besieged them and let them leave with their families in some forty ships. Led by Abu Hafs Umar al-Balluti, they landed on Crete, which they may already have raided. Byzantine writers say Abu Hafs burned the ships so his men could not turn back, but as they had brought their families, this is probably a later story."
      - "The Emperor Michael II, weakened by the revolt of Thomas the Slav, sent a force under Photeinos and Damian, which was beaten; Damian was killed. A second expedition of 70 ships under Krateros won a first battle but was routed in a night attack, and Krateros, who fled to Kos, was captured there and crucified. The Andalusis founded a new capital on the north coast, Chandax, “the castle of the moat”, recognised the Abbasid caliph as their nominal overlord and ruled the island as an independent emirate. Byzantine fleets cleared them from the nearby islands, but Crete became the base for raids across the Aegean for more than a century."
    facts:
      - [Leader, "Abu Hafs Umar al-Balluti, first emir of Crete"]
      - [Expelled from Alexandria, "827, in about 40 ships"]
      - [New capital, "Chandax (rabḍ al-khandaq), today’s Heraklion"]
