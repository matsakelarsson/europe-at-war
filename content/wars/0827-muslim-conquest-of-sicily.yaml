id: muslim-conquest-of-sicily
name: Muslim conquest of Sicily
start: "827-06"
end: "902-10-24"
tier: B
summary: The conquest of Byzantine Sicily by the Aghlabid emirs of Ifriqiya (Tunisia), who landed at Mazara in 827 to help a rebel Byzantine admiral. Palermo fell in 831, Enna in 859, Syracuse in 878 and Taormina in 902; from Sicily, Muslim raiders also held Bari as an emirate from about 847 to 871 and sacked the churches outside the walls of Rome in 846.
countries: [it, tn, mt]
sides:
  - id: mus
    name: Aghlabids and the Muslims of Sicily
    polities: [aghlabid-emirate, emirate-of-sicily, emirate-of-bari]
    ink: green
    moves: Muslim moves
    success: Muslim success
  - id: byz
    name: Byzantine Empire
    polities: [byzantium]
    ink: purple
    moves: Byzantine moves
    success: Byzantine success
  - id: lat
    name: The Franks, the papacy and the Italian states
    polities: [carolingian, papal-states, duchy-of-benevento, salerno, duchy-of-naples]
    ink: gold
    moves: Frankish and Italian moves
    success: Frankish and Italian success
notes:
  - The conquest was slow and piecemeal. Apart from a few sieges, the war was mostly raids on Byzantine strongholds and the countryside around them, for plunder, tribute and captives. Many dates come from Arab chronicles written centuries later and are approximate.
  - The Aghlabids ruled Ifriqiya in the name of the Abbasid caliphs. In 909 Sicily passed with Ifriqiya to the Fatimids, under whom (from the 950s through the Kalbid governors) the island became a largely independent emirate.
  - The Muslim states on the mainland, at Bari and Taranto and later on the Garigliano, often grew out of mercenary bands hired by the Lombard princes and the duchy of Naples in their own wars.
