steps:
  - title: Euphemius and the landing at Mazara
    date: 827–831
    when: "827-06"
    borders: "831-09"
    countries: [it, tn]
    body:
      - In 826 Euphemius, commander of the Byzantine fleet in Sicily, rebelled against Emperor Michael II, took Syracuse and had himself proclaimed emperor. Driven out by loyalist officers, he sailed to Ifriqiya and offered the Aghlabid emir Ziyadat Allah a yearly tribute for an army to win the island for him. The emir’s council was divided, but the elderly judge of Kairouan, Asad ibn al-Furat, argued for a holy war and was given command. In June 827 his fleet, carrying about 10,000 foot soldiers and 700 horsemen, sailed from Sousse and landed at Mazara.
      - Asad beat the Byzantine governor in the field and besieged Syracuse, but in the spring of 828 disease swept the camp and killed him, and a Byzantine fleet arrived. The Muslims burned their ships and retreated inland to Mineo. Euphemius, who had stayed with them, was murdered outside Enna while negotiating with its garrison. In 829 a new Byzantine army nearly drove the invaders out, until a raiding fleet from al-Andalus joined them in 830. Palermo, besieged for a year, surrendered in September 831; it became the capital of a new Aghlabid province, and western Sicily soon followed.
    facts:
      - [Landing at Mazara, "June 827, about 10,000 foot and 700 horse"]
      - [Siege of Syracuse, "827–828, abandoned"]
      - [Fall of Palermo, September 831]
    markers:
      - kind: event
        side: mus
        name: Mazara
        date: June 827
        text: Asad’s army landed here after three days at sea from the Bay of Sousse and beat the Byzantine governor’s forces on the plain to the south-east.
        lonlat: [12.59, 37.65]
      - kind: held
        side: byz
        name: Syracuse
        date: 827–828
        text: The Byzantine capital of the island held out until disease broke out in the besiegers’ camp, killing Asad, and a relief fleet came.
        lonlat: [15.29, 37.07]
      - kind: taken
        side: mus
        name: Mineo
        date: "828"
        text: The retreating Muslims took the hill town after three days. Blockaded there in 829, they were reduced to eating their horses until Andalusian raiders relieved them in 830.
        lonlat: [14.69, 37.27]
      - kind: event
        name: Enna
        date: "828"
        text: The garrison of the great inland fortress offered to recognise Euphemius, and killed him when he came out to meet its envoys.
        lonlat: [14.28, 37.57]
        lp: l
      - kind: taken
        side: mus
        name: Palermo
        date: September 831
        text: The city surrendered after a year’s siege in return for safe passage for its commander and officials. An Arab chronicler says that only 3,000 of its 70,000 people were left, probably an exaggeration.
        lonlat: [13.36, 38.12]
    arrows:
      - side: mus
        label: Asad, 827
        via: [[10.64, 35.83], [11.6, 36.8], [12.55, 37.62]]
      - side: mus
        label: To Syracuse
        via: [[12.7, 37.58], [13.6, 37.2], [14.5, 36.85], [15.2, 37.03]]
      - side: mus
        label: "830"
        via: [[12.62, 37.68], [12.95, 37.92], [13.3, 38.09]]
  - title: Enna, Bari and the raid on Rome
    date: 842–871
    when: "842"
    borders: "871-02"
    countries: [it]
    body:
      - With Neapolitan help the Muslims took Messina in 842 or 843, and in 845 they crushed a Byzantine army near Butera. Bands from Sicily had also crossed to the mainland as mercenaries in the civil war that split the Lombard principality of Benevento, and stayed to take Taranto in 840 and Bari in about 847. Bari became an emirate, recognised by the Abbasid caliph, whose raiders ranged across southern Italy. In August 846 a raiding fleet landed at Ostia and Portus and sacked St Peter’s and St Paul’s, which lay outside the walls of Rome; the city itself held. Pope Leo IV walled in the Vatican, and in 849 a fleet from Naples, Amalfi and Gaeta beat another raid off Ostia.
      - In Sicily the war was a slow round of raids and sieges. In January 859 the Muslims took Enna, the Byzantines’ main stronghold in the interior, with the help of a prisoner who showed them a way in, and slaughtered its defenders. Byzantine Sicily shrank to the east coast between Syracuse and Taormina. On the mainland the Carolingian emperor Louis II, king of Italy, besieged Bari from 867 with Frankish, Lombard and Slav troops, and in February 871 its citadel fell. Its last emir, Sawdan, was led away in chains to Benevento.
    facts:
      - [Raid on Rome, "August 846, St Peter’s and St Paul’s sacked"]
      - [Fall of Enna, January 859]
      - [Emirate of Bari, "about 847 – February 871"]
    markers:
      - kind: taken
        side: mus
        name: Messina
        date: 842 or 843
        text: Taken with the help of the duchy of Naples, then allied with the Muslims against Benevento. It gave them a foothold on the strait.
        lonlat: [15.55, 38.19]
      - kind: battle
        side: mus
        name: Battle of Butera
        date: "845"
        text: A Byzantine army reinforced from Asia Minor was routed, reportedly losing some 10,000 men.
        lonlat: [14.18, 37.19]
      - kind: taken
        side: mus
        name: Enna
        date: January 859
        text: The hitherto impregnable mountain fortress fell to the governor al-Abbas ibn al-Fadl. The Muslims refortified it and settled it as their base for the east.
        lonlat: [14.28, 37.57]
      - kind: event
        side: mus
        name: St Peter’s, Rome
        date: August 846
        text: Raiders plundered the basilicas of St Peter and St Paul outside the walls. In reply Leo IV built the Leonine Wall around the Vatican hill.
        lonlat: [12.45, 41.9]
      - kind: naval
        side: lat
        name: Battle of Ostia
        date: "849"
        text: Galleys of Naples, Amalfi and Gaeta under Caesarius, son of the duke of Naples, met a new raiding fleet, which a storm then scattered. Prisoners were put to work on the Leonine Wall.
        lonlat: [12.28, 41.74]
        lp: l
      - kind: taken
        side: lat
        name: Bari
        date: 847–871
        text: Taken from the Byzantines by the Berber commander Khalfun in about 847, Bari was the seat of the only Muslim state on the Italian mainland. Louis II took its citadel in February 871.
        lonlat: [16.87, 41.13]
    arrows:
      - side: mus
        label: Raid, 846
        via: [[13.2, 39.3], [12.5, 40.6], [12.28, 41.7]]
      - side: lat
        label: Louis II
        via: [[14.78, 41.13], [15.6, 41.28], [16.35, 41.22], [16.82, 41.13]]
  - title: Malta, Syracuse and Taormina
    date: 870–902
    when: "870"
    borders: "902-08-01"
    countries: [it, mt, tn]
    body:
      - A fleet from Sicily took Malta on 29 August 870, plundering its capital and razing the walls, and Byzantine Sicily was cut off. After Louis II’s death in 875 the Byzantines took over Bari, and over the next years they won back much of southern Italy. In Sicily the energetic emir Ibrahim II sent a new governor to finish the war. Syracuse was besieged from 877 with siege engines, received little help from Constantinople, and was stormed on 21 May 878 after nine months. Its people were killed or enslaved, and the city was looted for two months.
      - The conquest then stalled. Taormina beat off attack after attack, and from 886 the Muslims of Sicily fought among themselves, Palermo against Agrigento and against the governors from Africa, until Ibrahim’s son Abu’l-Abbas Abdallah took Palermo in 900 and sacked Reggio across the strait in 901. In 902 Ibrahim, forced to abdicate, came to Sicily himself as a volunteer for the holy war. Taormina fell on 1 August. He crossed into Calabria and died of dysentery while besieging Cosenza on 24 October. A few forts in the north-east held out; the last, Rometta, fell only in 965.
    facts:
      - [Fall of Malta, 29 August 870]
      - [Fall of Syracuse, "21 May 878, after a nine-month siege"]
      - [Fall of Taormina, 1 August 902]
    markers:
      - kind: taken
        side: mus
        name: Malta
        date: 29 August 870
        text: The fleet took the capital, Melite (today’s Mdina). Its governor was captured and its cathedral’s marble columns were carried off to decorate a palace in Africa.
        lonlat: [14.4, 35.89]
      - kind: taken
        side: byz
        name: Bari
        date: 875 or 876
        text: After Louis II’s death the city passed to the Byzantines and became the capital of their Italian provinces.
        lonlat: [16.87, 41.13]
      - kind: taken
        side: mus
        name: Syracuse
        date: 21 May 878
        text: The besiegers took the outer defences one by one and finally stormed the old capital of Byzantine Sicily.
        lonlat: [15.29, 37.07]
      - kind: taken
        side: mus
        name: Reggio
        date: 10 July 901
        text: Abu’l-Abbas crossed the strait to break up a Byzantine build-up and sacked the city, carrying off thousands of its people as slaves.
        lonlat: [15.65, 38.11]
      - kind: held
        side: byz
        name: Rometta
        date: until 965
        text: The hill fortress near Messina was the last Byzantine stronghold on the island.
        lonlat: [15.42, 38.17]
        lp: l
      - kind: taken
        side: mus
        name: Taormina
        date: 1 August 902
        text: Ibrahim II beat the garrison outside the walls and took the town after a short siege. Its fall is taken to mark the end of the conquest.
        lonlat: [15.29, 37.85]
      - kind: event
        name: Cosenza
        date: 24 October 902
        text: Ibrahim died of dysentery during the siege, and his grandson led the army back to Sicily.
        lonlat: [16.25, 39.3]
    arrows:
      - side: mus
        label: Ibrahim II, 902
        via: [[13.36, 38.12], [14.4, 38.05], [15.27, 37.87]]
      - side: mus
        label: Into Calabria
        via: [[15.3, 37.9], [15.62, 38.18], [16.0, 38.7], [16.24, 39.25]]
