  - title: Chengdu besieged, and the Dadu River
    date: 869–875
    when: "870"
    borders: "870-03-01"
    countries: [cn]
    body:
      - Shilong turned on Sichuan in 869. The Dongman people of Xizhou, Tang allies in the wars against Tibet but badly treated by their Tang governor, opened the gates of Xizhou to him, and his army marched north to Chengdu. For more than a month it assaulted the city with ladders, battering rams and a “bamboo tank” for undermining the walls, while the defenders under Lu Dan used hooks, burning oil and molten iron. Talks broke down in mutual suspicion. In the second month of the siege a relief army under Yan Qingfu, governor of Dongchuan, arrived and defeated the besiegers, killing about 5,000, and Shilong withdrew.
      - Nanzhao came back in the winter of 873–874, taking Qiongzhou and plundering the suburbs of Chengdu for three days, and raided Qianzhong in the east. In 875 the court sent Gao Pian to Chengdu. With 5,000 men he pursued the Nanzhao army to the Dadu River and defeated it there, and he rebuilt the city’s walls. In 877 a local force under the Yang family drove Nanzhao out of Bozhou (Zunyi), and Shilong died the same year. His successor Longshun agreed a marriage alliance with the Tang in 880, but the Huang Chao rebellion prevented it.
    facts:
      - [Siege of Chengdu, "869–870, over a month"]
      - [Battle on the Dadu River, "875"]
      - [Death of Shilong, "877"]
