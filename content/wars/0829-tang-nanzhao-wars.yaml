steps:
  - title: Wang Cuodian before Chengdu
    date: 829–831
    when: "829"
    borders: "829-12-01"
    countries: [cn]
    body:
      - After Nanzhao broke with Tibet in 794 it had been a Tang ally, sending its young nobles to study in Chengdu. In 829 the regent and general Wang Cuodian took advantage of disorder in Xichuan, whose governor Du Yuanying had neglected the frontier garrisons, and marched north almost unopposed. His army took Xizhou and other border towns, reached Chengdu and plundered the surrounding country, and withdrew in 830 with thousands of captives, among them artisans and Buddhist and Daoist clergy.
      - Wang Cuodian claimed that Nanzhao was still a loyal tributary and had only come to punish a bad governor. Relations were mended. In 831, at the request of the new governor Li Deyu, Nanzhao sent back more than 4,000 prisoners, and its envoys came to Chang’an regularly until 846.
    facts:
      - [Nanzhao invasion of Xichuan, "829–830"]
      - [Prisoners returned, "more than 4,000, in 831"]
