  - title: Annan, 858–866
    date: 858–866
    when: "863"
    borders: "863-03-01"
    countries: [vn, cn]
    body:
      - In Annan, the Tang protectorate in the Red River delta, quarrels between the governor Li Zhuo and the local chiefs drove some of them, among them the powerful Đỗ family, into alliance with Nanzhao. Nanzhao forces attacked the capital Songping in 858; in January 861 the Đỗ family, with Nanzhao contingents, took the city, which the Tang general Li Hu retook that summer. Early in 863 a Nanzhao army of about 50,000 under Yang Sijin besieged Songping again. The defenders under Cai Xi held out for some six weeks; the city fell late in February, Cai Xi drowned trying to escape, and Nanzhao held the delta for three years, while a Tang administration in exile gathered troops and a supply fleet at Haimen on the coast. The local people, who had at first welcomed the invaders, suffered heavily from them, and many fled to the hills.
      - In 864 the court gave the command to Gao Pian, a general known from the northern frontier. In September 865 his 5,000 men surprised a Nanzhao army scattered to gather rice in the villages, and in 866, reinforced to about 12,000, he defeated a fresh army and besieged Songping. He retook it in the autumn of 866, executing the Nanzhao commander Duan Qiuqian; the Tang histories claim 30,000 heads. Gao Pian rebuilt the city as Đại La and Annan became a military circuit, Jinghai.
    facts:
