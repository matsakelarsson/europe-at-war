id: tang-nanzhao-wars
name: Tang–Nanzhao wars
start: "829"
end: "875"
tier: B
summary: "The wars between Tang China and Nanzhao, the kingdom of the Erhai lake in Yunnan, after their alliance against Tibet broke down. In 829 the Nanzhao general Wang Cuodian invaded Xichuan (Sichuan), plundered the country around Chengdu and carried off thousands of captives before withdrawing in 830. Under King Shilong, who took the title of emperor in 859, Nanzhao attacked on two fronts. In Annan (northern Vietnam), allied with local chiefs, its armies took the capital Songping (Hanoi) in 861 and again in 863 and held the delta for three years, until the Tang general Gao Pian retook it in 864–866. In Sichuan it took Xizhou and besieged Chengdu in 869–870, and raided to the walls of Chengdu again in 874. Gao Pian, sent to Chengdu, drove the Nanzhao army back across the Dadu River in 875. The wars exhausted both states. A Tang official wrote that the conscription and the supplies they demanded had emptied the treasury and turned peasants into robbers, and the great rebellion of Huang Chao began in the same years."
countries: [cn, vn]
sides:
  - id: tang
    name: Tang China
    polities: [tang]
    ink: red
    moves: Tang moves
    success: Tang success
  - id: nz
    name: Nanzhao and its allies
    polities: [dali]
    ink: purple
    moves: Nanzhao moves
    success: Nanzhao success
notes:
  - The wars are known from the Tang histories, the Zizhi Tongjian and the Manshu of Fan Chuo, a Tang official who served in Annan in the 860s. Their numbers are large and round.
  - Nanzhao is shown with the Dali Kingdom that later ruled the same lands. Its kingdom was called Dameng until 859 and Dali (大禮) from 859.
