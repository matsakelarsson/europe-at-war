id: nanzhao-raids-on-the-pyu
name: Nanzhao’s raids on the Pyu
start: "832"
end: "835"
tier: C
summary: "Raids by Nanzhao, the kingdom of the Erhai lake in Yunnan, on the Pyu city-states of the Irrawaddy valley in today’s Myanmar. Nanzhao armies had raided Upper Burma since the 750s or 760s, and the Pyu had sent embassies with musicians to the Tang court in 800–802. According to the Manshu, written by the Tang official Fan Chuo in the 860s, Nanzhao plundered the Pyu kingdom (Biao) in the sixth year of the Dahe reign, about 832, and carried off more than 3,000 people, who were settled at Tuodong (Kunming) and made to support themselves. The raid is usually linked to Halin (Hanlin), the great walled Pyu city near Shwebo, though the Chinese text does not name the town; radiocarbon dates show that people went on living at Halin until about 870. In 835, the Manshu says, Nanzhao defeated the kingdoms of Mi-chen and Mi-nuo, took gold and silver and sent two to three thousand prisoners to Lishui to pan for gold; whether these were Pyu states is disputed. Historians no longer see the raids as the sudden end of the Pyu: there is no sign of a violent overthrow at Sri Ksetra, the largest Pyu city, but the raids weakened the city-states while Burman settlers moved into the dry zone. By the eleventh century Pagan had taken their place. Halin, Beikthano and Sri Ksetra were inscribed together as the Pyu Ancient Cities on the UNESCO World Heritage List in 2014."
