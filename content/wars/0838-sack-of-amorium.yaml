steps:
  - title: Anzen and Amorium
    date: 837–838
    when: "838-07"
    borders: "838-08-15"
    countries: [tr]
    body:
      - "In 837 the Emperor Theophilos raided the Abbasid frontier on the upper Euphrates, encouraged by the Khurramite rebels then fighting the caliph. He sacked Sozopetra, said by some sources to be the caliph’s birthplace, killed its men and enslaved its women and children. Once the revolt was crushed, al-Mu’tasim gathered a great army at Tarsus and chose as his target Amorium, the home of Theophilos’s family. One army under Afshin, with the emir of Melitene and Armenian princes, crossed the frontier in the north-east; the caliph led the other through the Cilician Gates. On 22 July Theophilos attacked Afshin at Anzen, near Dazimon. His army broke, and he escaped with difficulty."
      - "The caliph’s army found Ancyra abandoned, plundered it and laid siege to Amorium on 1 August. A defector showed the besiegers a stretch of wall that had been badly repaired, and they made a breach. After about two weeks Boiditzes, the officer holding the breach, went to bargain with the caliph on his own, and the Arabs broke in. The city was sacked and burned and its people killed or enslaved. Al-Mu’tasim turned home on hearing of a plot against him; many captives died on the march across the dry plateau. Forty-two officers who refused to convert were executed at Samarra in 845 and are venerated as the 42 Martyrs of Amorium."
    facts:
      - [Battle of Anzen, "22 July 838, Abbasid victory"]
      - [Siege of Amorium, "1 August to about 12–15 August 838"]
      - [Commanders, "Caliph al-Mu’tasim and Afshin; Emperor Theophilos"]
