id: sack-of-amorium
name: Sack of Amorium
start: "838-06"
end: "838-08"
tier: B
summary: The Abbasid caliph al-Mu’tasim’s revenge for the Byzantine sack of Sozopetra in 837. His armies beat the Emperor Theophilos at Anzen, took Ancyra and in August 838 stormed and destroyed Amorium, the home city of the ruling dynasty and one of the largest cities of Byzantine Asia Minor.
countries: [tr]
