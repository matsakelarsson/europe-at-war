    ink: green
    moves: Abbasid moves
    success: Abbasid success
  - id: byz
    name: Byzantine Empire
    polities: [byzantium]
    ink: purple
    moves: Byzantine moves
    success: Byzantine success
notes:
  - The campaign is described by Byzantine chroniclers and, in more detail, by the Arab historian al-Tabari; Michael the Syrian gives what is thought the most reliable figure for the caliph’s army, about 80,000 fighting men. Other writers give far larger numbers, as they do for the dead of Amorium (30,000 according to al-Mas’udi, 70,000 according to Theophanes Continuatus).
  - The date of the fall of Amorium is given by modern historians as 12, 13 or 15 August 838. Ancyra is today’s Ankara; Amorium lay near Emirdağ in Afyonkarahisar province, and the site of Sozopetra (Zibatra) is uncertain.
