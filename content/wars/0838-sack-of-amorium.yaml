        side: ab
        name: Battle of Anzen
        date: 22 July 838
        text: Afshin’s horse archers broke the Byzantine army after a promising start. Theophilos and his guard were surrounded and fought their way out.
        lonlat: [36.09, 40.39]
      - kind: taken
        side: ab
        name: Ancyra
        date: 26 July 838
        text: The inhabitants had fled to nearby mines, where an Arab detachment found them. The deserted city was plundered.
        lonlat: [32.855, 39.929]
      - kind: siege
        side: ab
        name: Siege of Amorium
        date: August 838
        text: The Arabs broke in through a weak stretch of wall, sacked the city and burned it. Its iron gates were carried off to Samarra and later ended up in Aleppo.
        lonlat: [31.29, 39.02]
