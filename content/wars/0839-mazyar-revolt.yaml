id: mazyar-revolt
name: Revolt of Mazyar
start: "839"
end: "839"
tier: C
summary: The revolt of Mazyar ibn Qarin, the Qarinvandid prince who ruled the mountains of Tabaristan, south of the Caspian Sea, under the Abbasid caliphs. Abdallah ibn Tahir, the Tahirid governor of Khorasan, claimed Tabaristan and its taxes; Mazyar refused to pay and rose in 839, relying on the Zoroastrian peasantry and imprisoning those he distrusted. Abdallah and the caliph al-Mu’tasim sent five armies into Tabaristan from different directions. The Bavandid prince Qarin went over to the Abbasids, the people of Sari rose against Mazyar, and his brother Quhyar captured him and handed him over. Mazyar was taken to Samarra and executed, and his body was hung beside Babak’s. Tabaristan passed under Tahirid rule until the Zaydi revolt of 864, and al-Afshin, the conqueror of Babak, was accused of having encouraged Mazyar and died in prison in 841.
