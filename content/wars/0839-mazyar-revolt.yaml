notes:
  - Accounts differ on whether Mazyar was executed in 839 or 840. A later local historian, Ibn Isfandiyar, reports that Mazyar, Afshin and Babak had sworn to take the country back from the Arabs; modern historians doubt that there was a real conspiracy.
