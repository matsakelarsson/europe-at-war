id: jang-bo-go-rebellion
name: Jang Bo-go and the fall of Cheonghaejin
start: "841"
end: "851"
tier: C
summary: "The conflict between the Silla court and Jang Bo-go, the commander of the Cheonghaejin garrison on Wando, which ended with his killing and the closing of the garrison. Jang Bo-go, a man of humble origins from the south-western islands, had served as an officer in Tang China and, after returning to Silla, persuaded King Heungdeok in 828 to let him set up a garrison of 10,000 men at Cheonghae (Wando) to stop the slave raiders who seized Silla people on the coasts. From there his fleet dominated the trade between Silla, Tang China and Heian Japan. In 838–839 he sent 5,000 men to help Kim U-jing seize the throne; they defeated the royal army, King Minae was killed, and Kim U-jing became King Sinmu. Sinmu’s son, King Munseong, promised to take Jang Bo-go’s daughter as a royal consort, but court nobles objected to his low birth. According to the Samguk sagi, Jang Bo-go then turned against the king, and the court sent Yeom Jang, a former follower of his, who pretended to defect to him and killed him at a banquet. Jang Bo-go’s officer Yi Chang-jin and others held out at Cheonghaejin until Yeom Jang defeated them. In 851 the court abolished the garrison and moved its people to Byeokgol (Gimje)."
