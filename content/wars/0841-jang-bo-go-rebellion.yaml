notes:
  - The Samguk sagi dates Jang Bo-go’s rising and death to 846, but the Japanese chronicle Shoku Nihon Kōki reports his death in the eleventh month of 841, and the monk Ennin’s diary mentions a former Cheonghaejin officer who fled to China in 845. Most historians, including the National Institute of Korean History’s New History of Korea, now prefer 841.
  - Whether Jang Bo-go actually took up arms against the king, or was killed before he could, is debated; the Korean chronicles were written by and for the court.
