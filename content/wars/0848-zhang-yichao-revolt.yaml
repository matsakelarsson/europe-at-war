id: zhang-yichao-revolt
name: Zhang Yichao’s revolt
start: "848"
end: "866"
tier: C
summary: "The rising in which Zhang Yichao, a leading man of Shazhou (Dunhuang), drove the Tibetan garrisons out of the Hexi Corridor and returned it to nominal Tang rule. Tibet had held Dunhuang since about 781–786, but after the death of the emperor Langdarma in 842 its generals in the north-west fought each other. In 848 Zhang led the Han, Uyghur, Tuyuhun and Qiang people of Shazhou in a rising, the Tibetan garrison fled, and he took Guazhou and then, by about 850, Ganzhou, Suzhou and Yizhou (Hami). His brother carried maps of the recovered prefectures to Chang’an, and in 851 the emperor Xuanzong made Zhang military governor of a new Guiyi (“Return to Allegiance”) circuit based at Shazhou. Zhang took Liangzhou (Wuwei) with 7,000 men in 863, and in 866 his forces defeated the Tibetan general Lun Kongre near Xizhou; the Uyghurs of Qocho soon took Xizhou and the northern Tianshan for themselves. Zhang went to Chang’an in 867 and died there in 872. The Guiyi circuit, ruled by the Zhang and then the Cao families and in practice independent, held Dunhuang until the Tanguts took it in the 1030s."
