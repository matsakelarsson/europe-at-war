id: rus-siege-of-constantinople
name: Rus’ siege of Constantinople (860)
start: "860-06-18"
end: "860-08"
tier: C
summary: The first recorded attack by the Rus’ on the Byzantine Empire. On 18 June 860, while the Emperor Michael III and the army were away fighting the Arabs in Asia Minor and the fleet was in the Mediterranean, a fleet of about 200 Rus’ ships sailed down the Bosporus and plundered the suburbs of Constantinople and the Princes’ Islands, killing many of the people they caught. They withdrew some weeks later; in a sermon of early August Patriarch Photios gave thanks for the city’s deliverance. Later tradition credited a miracle of the Virgin’s robe, and the Byzantines soon sent missionaries to the Rus’.
