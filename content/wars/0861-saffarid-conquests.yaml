notes:
  - The story is told mainly by the Arab historian al-Tabari, who wrote from the caliph’s side, and by the local Persian History of Sistan (Tarikh-i Sistan), which praises the Saffarids. Their dates sometimes differ by a year or more. The capture of Herat is put in 867 or 870, and Amr’s capture at Balkh in the spring or at the end of August 900.
  - Zaranj, the capital of Sistan, lay a little north-west of today’s Zaranj on the Afghan–Iranian border. The battlefield of Dayr al-Aqul, on the Tigris about 80 km south-east of Baghdad, and the place where the Zunbil was killed are approximate.
