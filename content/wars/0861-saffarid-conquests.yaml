  - title: Dayr al-Aqul
    date: 876–879
    when: "876-04-08"
    borders: "876-04-08"
    countries: [iq, ir]
    body:
      - Early in 876 Ya’qub marched from Fars into Iraq. The caliph’s government first offered to recognise his conquests, but he kept advancing, and in March the caliph al-Mu’tamid left Samarra for Baghdad and gathered an army under his brother al-Muwaffaq. On 24 March Ya’qub entered Wasit; an attempt to stop him by flooding the land outside the town had failed.
      - On 8 April 876 Ya’qub’s army, about 10,000 men, met the larger Abbasid army near Dayr al-Aqul on the Tigris, about 80 km south-east of Baghdad. Ya’qub was wounded and his army fell back, and as it retreated many men drowned in the water the caliph’s men released behind it. Muhammad ibn Tahir, a prisoner in the Saffarid camp, was freed. Some accounts date the battle to 1 or 10 April.
      - Ya’qub withdrew to Khuzestan and kept Fars, which the caliph’s forces could not retake. The Zanj rebels of southern Iraq offered him an alliance, which he refused. He died of colic at Jundishapur on 5 June 879, having refused his doctors’ treatment, and the army chose his brother Amr to succeed him.
    facts:
      - [Wasit entered, "24 March 876"]
      - [Battle of Dayr al-Aqul, "8 April 876, Abbasid victory"]
      - [Death of Ya’qub, "5 June 879 at Jundishapur"]
    markers:
