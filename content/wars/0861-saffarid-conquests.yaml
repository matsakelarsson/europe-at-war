  - title: Balkh
    date: 898–900
    when: "900"
    borders: "900-12"
    countries: [af, uz, tm, ir]
    body:
      - In 898 al-Mu’tadid granted Amr the governorship of Transoxiana, the lands beyond the Oxus held by the Samanid Ismail ibn Ahmad, who ruled from Bukhara. The grant set the two strongest powers of the east against each other. Ismail refused to submit, and Amr led his army towards the Oxus.
      - In 900 Ismail crossed the river and met Amr near Balkh. Amr’s army was defeated, many of his men went over to the Samanids, and Amr was captured. Ismail sent him in chains to Baghdad, where he was kept in prison and put to death in April 902, soon after al-Mu’tadid’s death. The caliph gave Ismail Amr’s titles to Khorasan, and the Samanids ruled it for a century.
      - Amr’s grandson Tahir ibn Muhammad held Sistan, Kerman and Fars for some years more, but the Abbasids took back Fars in 910 and the Samanids occupied Sistan in 911–912. Descendants of the Saffarids went on ruling Sistan as local princes for centuries.
    facts:
      - [Transoxiana granted to Amr, "898"]
      - [Battle of Balkh, "900, Samanid victory"]
      - [Amr executed in Baghdad, "April 902"]
    markers:
