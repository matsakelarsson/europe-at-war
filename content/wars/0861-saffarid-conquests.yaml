  - title: Herat, Kerman, Shiraz and Kabul
    date: 867–871
    when: "867"
    borders: "870"
    countries: [af, ir]
    body:
      - Ya’qub next turned on the Tahirid governors of the neighbouring provinces. He took Herat and Pushang from them, in 867 according to most accounts, and beat the Kharijites of the Herat region. In 869 he invaded Kerman, which the caliph’s government had promised both to him and to the governor of Fars, Ali ibn al-Husayn, reportedly to set them against each other. Ya’qub defeated Ali’s army, took him prisoner and entered Shiraz, then went home to Sistan with his booty, sending rich gifts to the caliph to keep his favour.
      - In 870 and 871 he campaigned east into the mountains of today’s Afghanistan. He took Kabul, from which the Shahi kings were driven east to Udabhandapura on the Indus, and plundered Bamiyan and its temples. According to the chronicles he sent captured idols to the caliph as trophies of a holy war on the unbelievers of the frontier.
    facts:
      - [Herat taken, "867 (870 in some accounts)"]
      - [Kerman and Shiraz, "869"]
      - [Kabul and Bamiyan, "870–871"]
    markers:
      - kind: taken
        side: saf
        name: Herat
        date: "867"
        text: Taken from the Tahirids, together with nearby Pushang.
        lonlat: [62.2, 34.35]
      - kind: taken
        side: saf
        name: Kerman
        date: "869"
        text: The province was claimed by both Ya’qub and the governor of Fars. Ya’qub took it and beat the governor’s army.
        lonlat: [57.08, 30.28]
      - kind: taken
