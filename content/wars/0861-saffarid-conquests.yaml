        name: Al-Rukhkhaj
        date: "864"
        text: Ya’qub defeated the Zunbil, the king of al-Rukhkhaj and Zamindawar, who was killed. The site is not known; the marker is placed near Kandahar.
        lonlat: [65.7, 31.62]
