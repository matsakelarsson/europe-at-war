  - title: The end of the Tahirids
    date: 873–875
    when: "873"
    borders: "875"
    countries: [ir, tm]
    body:
      - The Tahirids had governed Khorasan for the caliphs for half a century, but their power was failing under Muhammad ibn Tahir. On the pretext that he had sheltered a rival who had fled from Sistan, Ya’qub marched on Nishapur in 873. The city surrendered without a fight, and Muhammad ibn Tahir and his family were taken prisoner. The caliph refused to recognise the conquest.
      - In 874 Ya’qub followed his rival into Tabaristan on the Caspian coast, ruled by the Zaydi Alid al-Hasan ibn Zayd. He beat al-Hasan and collected taxes at Amul, but heavy rains in the mountains cost him many men and much of his baggage, and he withdrew by way of Rayy. In August 875 he invaded Fars, beat its ruler Muhammad ibn Wasil near Lake Bakhtegan and took control of the province.
    facts:
      - [Nishapur taken, "873; end of Tahirid rule"]
      - [Tabaristan campaign, "874"]
      - [Fars conquered, "875"]
    markers:
      - kind: taken
        side: saf
        name: Nishapur
        date: "873"
        text: The Tahirid capital surrendered. Muhammad ibn Tahir was taken prisoner and kept in Ya’qub’s camp until 876.
        lonlat: [58.8, 36.21]
      - kind: taken
        side: saf
        name: Amul
        date: "874"
        text: Ya’qub defeated al-Hasan ibn Zayd and collected taxes here, but lost many men in the rains on the way out of the mountains.
        lonlat: [52.35, 36.47]
      - kind: battle
