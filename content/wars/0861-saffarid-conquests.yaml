steps:
  - title: The emir of Sistan
    date: 861–865
    when: "861"
    borders: "865"
    countries: [ir, af]
    body:
      - Sistan, the country of lakes and marshes around the lower Helmand River on today’s Afghan–Iranian border, was a frontier province of the Abbasid caliphate, governed in the caliph’s name by the Tahirids of Khorasan. Kharijite rebels held much of the countryside, and the towns defended themselves with bands of volunteers, the ayyarun. Ya’qub ibn al-Layth, a coppersmith born near Zaranj around 840, rose in one of these bands under Salih ibn al-Nadr, who drove out the Tahirid governor in 854, and then under Dirham ibn Nasr. In 861 Ya’qub took power from Dirham and made himself emir of Sistan.
      - He turned first on his rivals and neighbours. In 864 he beat Salih at Bost on the Helmand and then marched east against the Zunbil, the king of al-Rukhkhaj and Zamindawar around today’s Kandahar, who was killed, leaving Ya’qub great booty. In 865 he beat the Kharijites of northern Sistan and killed their leader, Ammar ibn Yasir. Many Kharijites later joined his army, where they served as a corps of their own.
    facts:
      - [Ya’qub emir of Sistan, "861"]
      - [Bost and the Zunbil, "864"]
      - [Kharijites of Sistan defeated, "865"]
    markers:
      - kind: capital
        side: saf
        name: Zaranj
        date: "861"
        text: The capital of Sistan, where Ya’qub took power from Dirham ibn Nasr.
        lonlat: [61.8, 31.05]
      - kind: battle
        side: saf
        name: Bost
        date: "864"
        text: Ya’qub defeated his former leader Salih ibn al-Nadr at this fortress town on the Helmand.
        lonlat: [64.36, 31.5]
      - kind: battle
