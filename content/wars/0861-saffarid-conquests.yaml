id: saffarid-conquests
name: Saffarid conquests
start: "861"
end: "900"
tier: A
summary: The conquests of Ya’qub ibn al-Layth, a coppersmith (saffar) from Sistan who rose from the local volunteer bands to build an empire across eastern Iran and Afghanistan, and of his brother Amr. Ya’qub took power in Sistan in 861, fought the Kharijites and the Zunbils, took Herat, Kerman and Kabul, ended Tahirid rule in Khorasan in 873 and took Fars, but when he marched on Baghdad the caliph’s army beat him at Dayr al-Aqul in 876. Amr made peace with the caliphs and ruled Khorasan, Fars, Kerman and Sistan until the caliph granted him Transoxiana, held by the Samanids. In 900 the Samanid Ismail ibn Ahmad defeated and captured him near Balkh, and Khorasan passed to the Samanids.
