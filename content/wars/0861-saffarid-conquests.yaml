  - title: Amr and the caliphs
    date: 879–898
    when: "879-06"
    borders: "896"
    countries: [ir, tm, uz, af]
    body:
      - Amr ibn al-Layth made peace with the caliphate as soon as he succeeded his brother, and al-Muwaffaq recognised him as governor of Khorasan, Fars, Isfahan, Sistan, Kerman and Sind. Khorasan, however, had first to be won. Since the fall of the Tahirids it had been fought over by adventurers such as Ahmad al-Khujistani, a former Tahirid officer who held Nishapur until he was murdered by one of his own slaves in 882, and then Rafi ibn Harthama, whom the caliph’s government backed against Amr.
      - In 885 al-Muwaffaq declared Amr deposed and marched into Fars against him, and Amr fell back on Kerman and Sistan. When al-Mu’tadid became caliph in 892 he made peace with Amr and recognised his rule in Khorasan, eastern Iran and Fars. In 896 Amr defeated Rafi, who fled to Khwarazm and was killed there, and sent his head to Baghdad. In 897 the caliph added Rayy to Amr’s governorships.
    facts:
      - [Amr succeeds, "June 879"]
      - [Al-Muwaffaq’s campaign in Fars, "885"]
      - [Rafi ibn Harthama killed, "896"]
    markers:
      - kind: capital
