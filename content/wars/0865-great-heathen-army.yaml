steps:
  - title: York and East Anglia
    date: 865–870
    when: "865"
    borders: "870"
    countries: [gb, dk]
    body:
      - Viking raids on England had gone on for seventy years, but the force that landed in East Anglia in 865 came to stay. The Chronicle calls it the “great heathen army”; its leaders are said to have included Ivar the Boneless and Halfdan, sons of the legendary Ragnar Lothbrok. The East Anglians bought peace with horses. In November 866 the army rode north and took York, while the Northumbrians were divided by civil war. In March 867 the two rival kings, Osberht and Ælla, attacked the city together and were both killed.
      - The Vikings set up an English puppet king in Northumbria and moved into Mercia, taking Nottingham. A joint army of Mercia and Wessex besieged them there without result, and the Mercians paid them to leave. In 869 the army returned to East Anglia and took up winter quarters at Thetford. King Edmund fought it and was defeated, captured and killed. He was soon venerated as a martyr, St Edmund.
    facts:
      - [York taken, "November 866"]
      - [Kings killed, "Osberht and Ælla of Northumbria (867), Edmund of East Anglia (869)"]
      - [Leaders, "Ivar the Boneless, Halfdan and Ubba, according to later sources"]
