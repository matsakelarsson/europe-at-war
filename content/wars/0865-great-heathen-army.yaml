  - title: Edington and the Danelaw
    date: 878–880
    when: "878-05"
    borders: "880"
    countries: [gb, dk]
    body:
      - In midwinter 878, just after Twelfth Night, Guthrum fell on the royal estate of Chippenham. Much of Wessex submitted and Alfred fled with a small band to the marshes of Athelney in Somerset, from where he raided the Danes. In May he called out the men of Somerset, Wiltshire and part of Hampshire, and at Edington he defeated Guthrum’s army, then besieged it in Chippenham until it surrendered.
      - Guthrum agreed to leave Wessex and to be baptised, with Alfred as his godfather. In 879 his army moved to East Anglia, where he ruled as king under his baptismal name, Æthelstan. A treaty between the two kings, probably from the 880s, set the border along the Thames, the Lea and Watling Street. North and east of it lay the region of Danish law and settlement later called the Danelaw, where Scandinavian place names such as those ending in -by and -thorpe still abound.
    facts:
      - [Battle of Edington, "May 878, West Saxon victory"]
      - [Guthrum baptised, "878, at Aller, as Æthelstan"]
      - [Border, "The Thames, the Lea, the Ouse at Bedford and Watling Street"]
