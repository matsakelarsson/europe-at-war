id: great-heathen-army
name: Great Heathen Army
start: "865"
end: "880"
tier: B
summary: A large Scandinavian army, mostly Danish, which invaded England in 865 and over fifteen years destroyed the kingdoms of Northumbria, East Anglia and Mercia. Stopped by Alfred of Wessex at Edington in 878, its leaders settled the conquered lands, the area later called the Danelaw.
