notes:
  - The main source is the Anglo-Saxon Chronicle, written at Alfred’s court and partisan to Wessex. Its years began at Christmas or in September, so some events are a year earlier or later in other reckonings.
  - The name comes from the Chronicle’s “mycel hæþen here”. The army’s size is unknown; estimates range from a few hundred to several thousand men.
