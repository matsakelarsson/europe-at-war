  - title: Wessex resists; Mercia falls
    date: 870–877
    when: "871"
    borders: "877"
    countries: [gb, dk]
    body:
      - In late 870 the army invaded Wessex and fortified a camp at Reading. In the winter of 871 the West Saxons fought it again and again. King Æthelred and his brother Alfred won at Ashdown in January but lost several other battles, and in April Æthelred died. Alfred, now king, paid the Vikings to leave. They wintered in London, then at Torksey and in 873 at Repton, in the heart of Mercia, where they drove King Burgred into exile and put Ceolwulf, a Mercian thegn, in his place.
      - In 874 the army split. Halfdan took his men north, and in 876 he shared out the land of Northumbria among them; the Chronicle says they “were ploughing and providing for themselves”. Guthrum and two other kings went to Cambridge, then slipped into Wessex, holding Wareham and Exeter in 875–877. In 877 they divided Mercia, settling its eastern half and leaving the west to Ceolwulf.
    facts:
      - [Battle of Ashdown, "January 871, West Saxon victory"]
      - [Alfred becomes king, "April 871"]
      - [Mercia divided, "877"]
