  - title: The fall of al-Mukhtara
    date: 881–883
    when: "883-08"
    borders: "883-08"
    countries: [iq]
    body:
      - In February 881 al-Muwaffaq laid siege to al-Mukhtara. He built a town of his own facing it across the water, al-Muwaffaqiyya, with markets, a mosque and a mint, so that his army could stay through the summers, and blockaded the rebel capital by land and water. The siege lasted two and a half years. Abbasid troops broke into the city several times and were driven out, while the offers of pardon steadily drew defectors from the rebels.
      - In August 883 the Abbasid army stormed al-Mukhtara. Ali ibn Muhammad was killed in the fighting and his head was brought to al-Muwaffaq; most of his commanders were killed or captured. Abu’l-Abbas entered Baghdad with the head on 30 November 883. The fourteen-year revolt had ruined Basra and much of the farmland of southern Iraq, and the war against it gave al-Muwaffaq and his son the army and the authority with which al-Mu’tadid later restored the caliphate.
    facts:
      - [Siege of al-Mukhtara, "February 881 – August 883"]
      - [Fall of al-Mukhtara, "August 883"]
      - [Victory parade in Baghdad, "30 November 883"]
