id: zanj-rebellion
name: Zanj Rebellion
start: "869-09"
end: "883-08"
tier: A
summary: A rising of slaves and other poor people in the marshes and salt flats around Basra in southern Iraq, led by Ali ibn Muhammad, who claimed descent from the Prophet’s family. Many of his followers were East African slaves, the Zanj, who were made to clear the salt crust from the land. For fourteen years the rebels held the marshes of lower Iraq, sacked Ubulla, Basra, Ahvaz and Wasit and came within about 80 km of Baghdad, while the caliphate was also at war with the Saffarids of Iran. From 879 the regent al-Muwaffaq and his son Abu’l-Abbas, the future caliph al-Mu’tadid, won back the marshes, and in August 883 they took the rebel capital, al-Mukhtara.
countries: [iq, ir]
sides:
  - id: zanj
    name: Zanj rebels
    polities: [zanj]
    ink: red
    moves: Rebel moves
    success: Rebel success
  - id: ab
    name: Abbasid Caliphate
    polities: [abbasid]
    ink: green
    moves: Abbasid moves
    success: Abbasid success
notes:
  - Almost everything known about the revolt comes from the Abbasid historian al-Tabari, who was hostile to the rebels. Historians debate how far it was a slave revolt. Bedouin Arabs, people from Bahrayn, villagers of the marshes and free Africans also fought for Ali ibn Muhammad, and some historians think most of his followers were not slaves.
  - Medieval writers give death tolls for the whole revolt of 500,000 (al-Mas’udi, who called his own figure guesswork), 1.5 million and even 2.5 million, and 300,000 for Basra alone. Modern historians consider all of them gross exaggerations.
  - Al-Mukhtara (“the chosen”) lay on a canal south of Basra; its exact site is not known, and its marker is approximate. The rivers, canals and marshes of the 9th century were very different from today’s, and medieval Basra lay near today’s al-Zubayr, west of the modern city.
