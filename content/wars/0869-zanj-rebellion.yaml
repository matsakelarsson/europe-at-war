steps:
  - title: The rising in the salt flats
    date: 869–870
    when: "869-09"
    borders: "870-06"
    countries: [iq, ir]
    body:
      - East of Basra, gangs of slaves, many of them brought from East Africa and known as the Zanj, worked for landowners in the salt flats along the canals. They scraped off the salty, nitrous crust so that the land could be farmed, for a ration of flour and dates. Ali ibn Muhammad, a man of obscure origin who claimed descent from the Caliph Ali, had already tried to raise a revolt in Bahrayn in the 860s. In September 869 he came to the salt flats and promised the slaves freedom, wealth and houses of their own.
      - The rebels beat the first troops and town militias sent against them and built a capital, al-Mukhtara, on a canal south of Basra, in country of reeds and waterways that cavalry could not cross. In June 870 they took the port of Ubulla on the Tigris, killing many of its people and burning the town, and Abadan surrendered to them soon after. Weeks later another rebel force entered Suq al-Ahwaz, today’s Ahvaz, the main town of Khuzestan, whose garrison had fled. Their attacks cut Basra off from its hinterland and from the sea trade of the Gulf.
      - The caliphate was weak at the time. Since 861 the Turkish soldiers of Samarra had murdered or deposed four caliphs, and the new caliph, al-Mu’tamid, left the conduct of war to his brother, Abu Ahmad, known as al-Muwaffaq.
    facts:
      - [Revolt begins, "September 869"]
      - [Ubulla taken, "June 870"]
      - [Rebel leader, Ali ibn Muhammad]
