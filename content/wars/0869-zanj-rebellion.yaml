  - title: The Abbasid counter-offensive
    date: 879–881
    when: "880"
    borders: "880-12"
    countries: [iq, ir]
    body:
      - Late in 879 al-Muwaffaq sent his son Abu’l-Abbas, the future caliph al-Mu’tadid, down the Tigris with an army and a fleet of river boats. Abu’l-Abbas won back the Tigris below Wasit and began to clear the marshes, fighting the rebels’ boats in the narrow channels. In October 880 al-Muwaffaq joined him with more troops. They stormed the rebels’ marsh strongholds, Sulayman ibn Musa al-Sha’rani’s fortress of al-Mani’a and Sulayman ibn Jami’s town of al-Mansura at Tahitha, and freed thousands of captives held there.
      - In January 881 the Abbasid army turned east into Khuzestan, and Ali ibn Aban was recalled to al-Mukhtara. Al-Muwaffaq offered pardons and rewards to any rebel who came over to him, and many did, including some of Ali ibn Muhammad’s commanders. By February 881 the rebels held only the country around their capital.
    facts:
      - [Abu’l-Abbas’s campaign begins, "late 879"]
      - [Al-Muwaffaq takes command, "October 880"]
      - [Khuzestan retaken, "January–February 881"]
