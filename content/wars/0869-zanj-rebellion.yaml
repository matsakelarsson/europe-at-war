  - title: The sack of Basra
    date: 871
    when: "871-09"
    borders: "871-09"
    countries: [iq, ir]
    body:
      - In 871 the rebels fought on in Khuzestan, where Ali ibn Aban held the town of Jubba. Basra, blockaded for months and short of food, was divided by quarrels between its factions. In September 871 rebel forces under Ali ibn Aban al-Muhallabi and Yahya ibn Muhammad al-Bahrani broke into the city. Over several days they burnt much of it, including its great mosque, and killed many of its people; others were carried off as slaves.
      - Al-Mas’udi reported that 300,000 people died in Basra, a figure modern historians do not accept, but the sack shocked the caliphate. The rebels did not try to hold the ruined city, and they beat the army sent after them from Samarra. The following year al-Muwaffaq led an army south himself. His campaign of 872 failed, and the rebels stayed on the offensive.
    facts:
      - [Sack of Basra, "September 871"]
      - [Rebel commanders, "Ali ibn Aban and Yahya ibn Muhammad al-Bahrani"]
      - [Al-Muwaffaq’s first campaign, "872, failed"]
