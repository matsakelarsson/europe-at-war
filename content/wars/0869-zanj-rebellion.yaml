  - title: The height of the revolt
    date: 872–879
    when: "876"
    borders: "879"
    countries: [iq, ir]
    body:
      - For the next years the caliphate was drawn east by the Saffarid ruler Ya’qub ibn al-Layth, who took Fars and Khuzestan and in 876 marched on Baghdad. After al-Muwaffaq beat him at Dayr al-Aqul in April 876, Ali ibn Muhammad wrote to Ya’qub proposing an alliance. According to al-Tabari, Ya’qub answered only with a verse of the Qur’an, “Say, O unbelievers, I do not worship what you worship.”
      - The rebels used these years to spread through the great marshes between Basra and Wasit and into the district of Kaskar. Their boats moved freely through the reed beds, and they raided towns and villages and seized grain and cattle. Commanders such as Sulayman ibn Jami’ held fortified towns in the marshes.
      - In 879 the revolt reached its greatest extent. Rebel forces sacked Wasit on the Tigris and Ramhormoz in Khuzestan, then pushed up the Tigris, burning al-Numaniyya and reaching Jarjaraya, within about 80 km of Baghdad by one account; people from the countryside fled to the capital.
    facts:
      - [Battle of Dayr al-Aqul, "8 April 876, Abbasid victory over the Saffarids"]
      - [Wasit and Ramhormoz sacked, "879"]
      - [Farthest advance, "Jarjaraya on the Tigris, 879"]
