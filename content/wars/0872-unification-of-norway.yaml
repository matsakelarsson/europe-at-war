id: unification-of-norway
name: Unification of Norway (Battle of Hafrsfjord)
start: "872"
end: "872"
tier: C
summary: Harald Fairhair’s wars to make himself king over the petty kingdoms of western Norway, which culminated in his naval victory over a coalition of chieftains from Rogaland and the west coast in Hafrsfjord, near today’s Stavanger. The date is uncertain; the traditional year 872 is a 19th-century estimate, and historians have placed the battle anywhere between about 870 and 900, most now favouring the 880s. Later tradition held that many who refused to submit emigrated to Iceland.
countries: ["no"]
