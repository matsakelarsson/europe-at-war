    name: Harald Fairhair
    polities: [norway]
    ink: red
  - id: petty
    name: Western petty kings
    polities: [norse-petty-kingdoms]
    ink: olive
notes:
  - The only near-contemporary source is a praise poem by Harald’s court poet, Thorbjørn Hornklove. The fuller story comes from Snorri Sturluson’s sagas, written more than 300 years later. Most historians now see the unification of Norway as a long process rather than the result of one battle.
  - The start year shown is the traditional date, used for Norway’s millennial celebrations in 1872, not a firm date.
