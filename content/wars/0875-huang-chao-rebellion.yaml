  - title: Back to the north
    date: 879–880
    when: "880-07"
    borders: "880-07-01"
    countries: [cn]
    body:
      - Late in 879 the rebels built rafts at Guizhou (Guilin) and floated down the Xiang River to Tanzhou (Changsha), which fell in a day. Shang Rang took Jiangling, whose commander Wang Duo fled. But north of Jiangling the rebels were beaten by Liu Jurong, governor at Xiangyang, and the Tang general Cao Quanzhen, who stopped their pursuit short, so the sources say, for fear the court would no longer need them once the rebellion was over. Huang turned east down the Yangtze, plundering Ezhou and the prefectures around it, and was repeatedly beaten by Zhang Lin, Gao Pian’s officer.
      - Gao Pian, now governor of Huainan at Yangzhou, was put in charge of the campaign. When Huang offered to submit, Gao, hoping to take the credit alone, sent home the troops other circuits had lent him. Huang then broke off the talks and in the spring of 880 defeated and killed Zhang Lin. In the summer he crossed the Yangtze at Caishi and besieged towns near Yangzhou, but Gao Pian would not fight. The troops gathered to hold the Huai scattered after a rising of soldiers at Xu Prefecture (Xuchang), and Huang crossed the Huai with an army the sources put at 150,000, pressing young men into its ranks as he went.
    facts:
      - [Changsha taken, "winter 879"]
      - [Zhang Lin killed, "spring 880"]
      - [Yangtze crossed at Caishi, "summer 880"]
