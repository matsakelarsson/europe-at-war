  - title: Li Keyong and the end of Huang Chao
    date: 883–884
    when: "884-07-13"
    borders: "884-07-13"
    countries: [cn]
    body:
      - The decisive help came from the north. Li Keyong, a young chief of the Shatuo Turks who had been in revolt against the Tang, was pardoned and crossed the Yellow River in the winter of 882 with his black-clad cavalry, known as the Crows. In the spring of 883 he and the other Tang commanders defeated Shang Rang’s main army, said to be 150,000 strong, and in the summer he drove Huang Chao out of Chang’an. The Tang troops again stopped to plunder the city, and Huang escaped east with much of his army. The emperor returned to a ruined capital in 885.
      - Huang marched into Henan, won over the governor of Caizhou, Qin Zongquan, and besieged Chenzhou, whose prefect Zhao Chou held out for nearly 300 days. Short of food, his army is recorded as seizing people in the countryside for food. In the spring of 884 the governors Zhu Quanzhong at Bianzhou, Shi Pu at Xuzhou and Zhou Ji at Xu Prefecture (Xuchang) called on Li Keyong, now governor of Hedong at Taiyuan. He came south with 50,000 men, routed the rebels at Taikang and Xihua, and forced Huang to lift the siege; when Huang made for the Yellow River, Li Keyong caught and crushed his army at the Wangman crossing. Shang Rang and many other commanders surrendered.
      - With a few followers Huang fled east into the hills of Shandong. Beaten again near Yanzhou, he took refuge in the Langhu valley near Laiwu, where on 13 July 884 his nephew Lin Yan killed him, his brothers, his wife and his children to take their heads to the Tang; another account says Huang killed himself. Zhu Quanzhong and Li Keyong, rivals from the moment the war ended, became the two strongest men in northern China.
    facts:
      - [Chang’an retaken by Li Keyong, "summer 883"]
      - [Siege of Chenzhou, "883–884, nearly 300 days"]
      - [Wangman crossing, "spring 884"]
      - [Death of Huang Chao, "13 July 884"]
