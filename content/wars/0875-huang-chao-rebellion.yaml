  - title: Qi in Chang’an
    date: 881–882
    when: "881-06"
    borders: "882-09-01"
    countries: [cn]
    body:
      - Several Tang governors at first submitted to Qi and then changed sides again. Zheng Tian, governor of Fengxiang west of the capital, refused to submit and in the spring of 881 defeated the Qi forces sent against him. In the summer the Tang armies converged on Chang’an and the townspeople rose against the rebels; Huang withdrew, but the Tang soldiers broke ranks to loot the city, and Huang came back, killed two Tang governors and drove the rest out. In revenge for the help the people had given the Tang, his men carried out a massacre in the city that the sources call “washing the city”.
      - In 882 the court, from Chengdu, put the veteran minister Wang Duo in command, and the Tang armies slowly closed in. Qi held little more than Chang’an and the prefectures of Tongzhou and Huazhou to the east. Farming had stopped in the Wei valley, and both sides are recorded as eating human flesh in the famine that followed. In the autumn of 882 Zhu Wen, the Qi commander at Tongzhou, went over to the Tang; the court gave him the name Zhu Quanzhong, “Complete Loyalty”, and in 883 made him governor of Xuanwu at Bianzhou (Kaifeng). Huazhou followed him in the winter.
    facts:
      - [Tang armies driven from Chang’an, "summer 881"]
      - [Zhu Wen goes over to the Tang, "autumn 882"]
    markers:
