  - title: Luoyang and Chang’an
    date: November 880 – January 881
    when: "881-01-08"
    borders: "881-01-08"
    countries: [cn]
    body:
      - In the winter of 880 Huang Chao marched on the capitals, declaring that he would make the emperor answer for his crimes. Luoyang fell quickly. Its defender Qi Kerang withdrew to the Tong Pass, the gate of the Wei valley, where he was joined by Shence Army troops from Chang’an; these palace troops were largely paid substitutes, poorly trained and equipped. After fighting for more than a day, Qi’s hungry men broke, the pass fell, and other Tang troops, angry at the better equipment of newly raised units, turned against their officers and guided the rebels on.
      - On 8 January 881 the young emperor Xizong and the eunuch Tian Lingzi fled Chang’an for Chengdu, and the same day Huang’s vanguard entered the capital. Huang moved into the palace and proclaimed himself emperor of a new state, Qi. Shang Rang announced that the people’s property would be respected, but the soldiers plundered the city repeatedly; members of the Tang imperial clan were killed, and officials of the third rank and above, and those who would not submit, were executed.
    facts:
      - [Luoyang taken, "December 880"]
      - [Xizong flees Chang’an, "8 January 881"]
      - [Huang Chao emperor of Qi, "January 881"]
