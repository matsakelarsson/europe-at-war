  - title: Guangzhou
    date: "879"
    when: "879-09"
    borders: "879-10-01"
    countries: [cn]
    body:
      - From Fujian, Huang turned towards Lingnan, the far south. He wrote to the court asking to be made governor of Tianping and then of Lingnan East, with its capital Guangzhou, the richest port of the empire. Both requests were refused, and he was offered only a post in the palace guard, which he took as an insult. In the autumn of 879 he took Guangzhou after a siege of a day and executed its governor Li Tiao, who refused to write to the court on his behalf.
      - Guangzhou was home to large communities of Arab, Persian and other merchants. Arab writers of the following century say that when the city fell, 120,000 Muslims, Jews, Christians and Zoroastrians were killed, or 200,000 according to al-Masudi, besides the Chinese inhabitants, and that the mulberry groves were cut down. Chinese sources do not mention the massacre, the numbers are probably inflated, and some historians think that the port the Arab writers meant was Qinzhou. Foreign trade at Guangzhou declined for decades.
      - The army now suffered from the diseases of the south, and the sources say that between three and four in ten of its men died. Huang’s officers urged him to go back north, and he agreed.
    facts:
      - [Guangzhou taken, "autumn 879, after a day’s siege"]
      - [Foreign merchants killed, "120,000 or 200,000 according to Arab writers; not mentioned in Chinese sources"]
    markers:
      - kind: taken
        side: reb
        name: Guangzhou
        date: autumn 879
        text: The great southern port, taken after a one-day siege. Its governor Li Tiao was executed.
        lonlat: [113.260, 23.130]
      - kind: event
        side: reb
        name: Qinzhou
