id: huang-chao-rebellion
name: Huang Chao rebellion
start: "875"
end: "884-07-13"
tier: A
summary: "The great rising against the Tang dynasty led first by Wang Xianzhi and then by Huang Chao, salt smugglers from the eastern plain. Out of famine and heavy taxes, rebel bands formed in 874–875 between the Yellow River and the Huai. After Wang was killed in 878, Huang Chao led his army in a march of thousands of kilometres: across the Yangtze, through Fujian to Guangzhou, which he took in 879, and back north through Hunan and along the Yangtze. In the winter of 880–881 he took Luoyang and Chang’an, the emperor Xizong fled to Chengdu, and Huang proclaimed himself emperor of Qi. Tang armies and the regional governors closed in on Chang’an, where famine followed. In 883 the Shatuo Turk Li Keyong retook the capital, and Huang, pursued across Henan, was killed in a valley in Shandong in July 884. Huge numbers died, in the sack of Guangzhou, the massacres in Chang’an and the famine. The Tang survived in name, but power passed to the generals who had fought the rebels, among them Huang’s former officer Zhu Wen, who ended the dynasty in 907."
countries: [cn]
sides:
  - id: reb
    name: Wang Xianzhi and Huang Chao (Qi)
    polities: [huang-chao]
    ink: orange
    moves: Rebel moves
    success: Rebel success
  - id: tang
    name: Tang dynasty and its governors
    polities: [tang]
    ink: red
    moves: Tang moves
    success: Tang success
notes:
  - The rebels had no territory of their own for most of the war; they moved through the Tang empire, which is shown on the base map throughout. The land their state of Qi held around Chang’an in 881–883 is drawn as an area.
  - The rebellion is told mainly by the official Tang histories and the Zizhi Tongjian, written by the rebels’ enemies. Dates are given as the sources convert them; the rising is dated 874 or 875.
  - The Arab writers Abu Zayd al-Sirafi and al-Masudi say that 120,000 or 200,000 foreign merchants were killed when Huang Chao took the port they call Khanfu. Chinese sources do not mention the massacre; historians think the numbers inflated, and some argue that Khanfu was Qinzhou rather than Guangzhou.
