steps:
  - title: Famine and the salt smugglers
    date: 875–876
    when: "875"
    borders: "875-06-01"
    countries: [cn]
    body:
      - In the last years of the emperor Yizong, droughts and floods brought famine to the plain between the Yellow River and the Huai. Taxes were not lowered but raised, to pay for the court and for the wars against Nanzhao, and bands of desperate men formed in the countryside. Many were led by salt smugglers, who had grown rich and armed by evading the state salt monopoly. In 874 or 875 one of them, Wang Xianzhi, rose at Changyuan in Henan with Shang Junzhang, and in 875 he repeatedly defeated the governor of Tianping. Huang Chao, from a family of salt smugglers at Yuanqu near today’s Heze, who had failed the imperial examinations several times, joined him with several thousand men.
      - The rebels moved fast through the provinces south of the Yellow River, plundering towns and avoiding the armies sent against them. In late 876 the court tried to buy Wang off with an army post, mediated by the prefect of Qizhou on the Yangtze. Huang Chao, who was offered nothing, struck Wang and the soldiers protested; Wang turned against the prefect and sacked Qizhou, and the rebels split into two armies, one under Wang and Shang Junzhang, the other under Huang.
    facts:
      - [Wang Xianzhi rises at Changyuan, "874 or 875"]
      - [Huang Chao joins him, "875"]
      - [The rebels split at Qizhou, "late 876"]
