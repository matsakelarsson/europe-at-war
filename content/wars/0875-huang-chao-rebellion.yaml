  - title: Huang Chao goes south
    date: 877–878
    when: "878"
    borders: "878-06-01"
    countries: [cn]
    body:
      - In 877 Huang Chao took Yunzhou, the seat of Tianping, killing its governor, and joined Wang again to besiege Song Prefecture until a Tang army drove them off. Early in 878 Wang Xianzhi was crushed by the Tang general Zeng Yuanyu at Huangmei and killed. Shang Rang brought Wang’s men to Huang Chao at Bozhou and offered him the title of king; Huang called himself instead “Generalissimo Who Charges to the Heavens” and gave his own era name. He offered to submit if made a regional governor, but the court would only make him a guard general if he disarmed first, and he refused.
      - With Tang troops gathering to protect Luoyang, Huang marched south. He crossed the Yangtze and took prefectures in Jiangxi, failed to take Xuanzhou, and in the autumn of 878 turned south-east into Zhedong. The army cut a road of some 700 li through the mountains into Fujian and took Fuzhou late in the year. On the way it was beaten several times by Zhang Lin and Liang Zuan, officers of Gao Pian, the governor at Zhenjiang, and several of Huang’s commanders went over to the Tang.
    facts:
      - [Yunzhou taken, "spring 877"]
      - [Wang Xianzhi killed at Huangmei, "early 878"]
      - [Fuzhou taken, "winter 878"]
