id: gangyo-rebellion
name: Gangyō rebellion
start: "878"
end: "879"
tier: C
summary: "A rising of the Emishi of northern Dewa against the officials of Akita Castle, the court’s frontier headquarters on the Sea of Japan coast. After years of harsh rule and a famine, Emishi living under the court’s authority (fushū) attacked Akita Castle in the third month of 878; its commander and the governor of Dewa fled, and the rebels burned the castle and the settlements around it. An army of 5,000 men from Mutsu and Dewa sent against them was routed at Akita in the sixth month, losing hundreds of suits of armour, its rice and some 1,500 horses. Twelve Emishi villages north of the Akita River joined the rising, with support from the Emishi of Tsugaru and Watarishima, and the rebels demanded that the land north of the river be recognised as their own. The regent Fujiwara no Mototsune sent Fujiwara no Yasunori, a governor known for good administration, as acting governor of Dewa, with the soldier Ono no Harukaze as frontier commander. Yasunori kept his troops on the defensive, opened the state granaries and offered pardons; from the eighth month the rebel groups came in to surrender, and in the third month of 879 the court called off the campaign. The settlement showed that the court could no longer impose its rule in the north by force. Akita Castle was rebuilt under a strengthened commander, the Akita-jō no suke."
