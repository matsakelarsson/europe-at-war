notes:
  - The rising is known from the court chronicle Nihon Sandai Jitsuroku and a biography of Fujiwara no Yasunori, which give only the government’s side; the names of the rebel leaders are not recorded. Watarishima is usually taken to mean Hokkaido or the far north of Honshu. Dates are months of the Japanese lunar calendar.
