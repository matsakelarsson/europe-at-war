id: late-silla-peasant-rebellions
name: Peasant rebellions of late Silla
start: "889"
end: "896"
tier: C
summary: "The wave of risings that broke Silla’s hold on its provinces under Queen Jinseong. After a drought in 888 the provinces stopped sending their taxes, and in 889 the court, its storehouses empty, sent officials to press for payment. Revolts broke out across the country. The first recorded was that of Wonjong and Aeno, who held the fortress of Sabeol-ju (today’s Sangju) in 889; the official sent against them, the naema Yeonggi, did not dare to attack, and the village head U-ryeon was killed fighting them. The queen had Yeonggi executed and gave U-ryeon’s son, about ten years old, his father’s post; what became of the rebels is not recorded. About 891 Gi Hwon rose at Jukju (Juksan) and Yanggil at Bugwon (Wonju); Gung Ye served first Gi Hwon, then Yanggil. In 892 the Silla officer Gyeon Hwon seized Mujinju (Gwangju) in the south-west. In 896 a band known for its red trousers, the Jeokgojeok (“Red Trousers”), plundered the counties south-west of the capital and reached Moryang-ri, on the western edge of Geumseong (Gyeongju) itself. By then Silla controlled little beyond the area around its capital, and the local strongmen who had risen during these years founded the kingdoms of the Later Three Kingdoms period."
