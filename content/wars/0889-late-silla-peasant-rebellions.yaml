notes:
  - The Samguk sagi, the main source, calls all of these groups thieves or bandits and records them only briefly; it gives dates by lunar years and months.
  - The risings of Yanggil, Gung Ye and Gyeon Hwon, which grew into kingdoms, are told in the Later Three Kingdoms war.
