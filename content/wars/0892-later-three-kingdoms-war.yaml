  - title: Gochang
    date: 929–930
    when: "930-01"
    borders: "930-03"
    countries: [kr]
    body:
      - In the seventh month of 929 Gyeon Hwon took Uiseong, killing its lord Hong Sul, one of Wang Geon’s supporters, and in the twelfth month he laid siege to Gochang (today’s Andong), the road junction of the upper Nakdong valley. Wang Geon marched to relieve it. Gochang’s local leaders, Kim Seon-pyeong, Gwon Haeng and Jang Gil, brought their people over to Goryeo and supplied his army.
      - In the first month of 930, after first cutting the Later Baekje supply line, Goryeo’s army, with Yu Geum-pil’s troops, defeated Gyeon Hwon at Byeongsan near Gochang after several days of fighting; the records say 8,000 Later Baekje soldiers were killed. The three Gochang leaders were honoured as founders of the Andong clans of Kim, Gwon and Jang.
      - The battle turned the war. About thirty districts around Andong and, by the chronicles’ count, 110 fortresses along the east coast from Myeongju (Gangneung) to Heungnye (Ulsan) went over to Goryeo. In 931 King Gyeongsun received Wang Geon in Gyeongju with honour.
    facts:
