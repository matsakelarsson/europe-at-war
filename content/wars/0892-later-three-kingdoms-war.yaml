    body:
      - In the sixth month of 936 Gyeon Hwon urged Wang Geon to destroy his son. The crown prince Wang Mu and Bak Sul-hui went ahead to Cheonan, and in the ninth month Wang Geon followed with the main army, Gyeon Hwon riding with him. They met Singeom’s army at the Illicheon stream in Ilseon county, in today’s Gumi. The Goryeosa gives Goryeo 87,500 men in three divisions, including 9,500 horsemen of the Heuksu, Dalgo and Cheolleuk peoples of the north under Yu Geum-pil; the Samguk sagi gives more than 100,000. Historians disagree on how far these figures are inflated.
      - Seeing their old king in the enemy ranks, the Later Baekje generals Hyobong, Deoksul, Aesul and Myeonggil surrendered, and the army broke. According to the chronicles 5,700 were killed and 3,200 taken prisoner. Goryeo pursued the survivors to Hwangsan (today’s Yeonsan, Nonsan), where Singeom, his brothers and his officials surrendered. Yanggeom and Yonggeom were exiled and later killed, but Singeom was spared. Gyeon Hwon died a few days later in a temple at Hwangsan.
      - Wang Geon had united the peninsula south of the Taedong River under one state, which also took in many refugees from Balhae, conquered by the Khitans in 926. Goryeo lasted until 1392, and from it the name Korea comes.
