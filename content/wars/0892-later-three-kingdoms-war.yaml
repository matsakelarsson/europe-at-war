  - title: Three kingdoms again
    date: 901–917
    when: "903"
    borders: "911-12"
    countries: [kr, kp]
    body:
      - In 901 Gung Ye proclaimed himself king and named his state Goryeo, after the old northern kingdom of Goguryeo; historians call it Later Goguryeo. He renamed it Majin in 904, moved his capital to Cheorwon in 905, and renamed it Taebong in 911. Silla was reduced to the south-east, around its capital Geumseong (Gyeongju), and the peninsula was again divided among three kingdoms.
      - The two new kingdoms fought along the south-western coast and in the Nakdong valley. In 903, according to the Goryeosa, Gung Ye sent Wang Geon with a fleet down the west coast; he took Geumseong in the far south-west, behind Gyeon Hwon’s back, and renamed it Naju. In 910 Gyeon Hwon besieged Naju for ten days but withdrew when Gung Ye’s fleet came, and his ships kept control of the south-western coast and its trade routes to China.
      - Gyeon Hwon twice attacked Daeya fortress at today’s Hapcheon, the Silla stronghold on the road to Gyeongju, in 901 and 916, and failed both times. In Cheorwon, Gung Ye called himself the Maitreya, the Buddha of the future, and according to the chronicles ruled more and more through fear, killing his queen and two of his sons.
    facts:
      - [Gung Ye proclaimed king, "901"]
      - [Capital moved to Cheorwon, "905"]
      - [Naju taken by Wang Geon, "903 (some historians, 909–910)"]
      - [Later Baekje attacks on Daeya, "901 and 916, both repulsed"]
