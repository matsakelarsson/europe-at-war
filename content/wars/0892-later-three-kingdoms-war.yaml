  - title: Wang Geon’s Goryeo
    date: 918–926
    when: "918-07"
    borders: "920-12"
    countries: [kr, kp]
    body:
      - On the night of 24 July 918 four of Gung Ye’s generals, Hong Yu, Bae Hyeon-gyeong, Sin Sung-gyeom and Bok Ji-gyeom, overthrew him and put Wang Geon, his chief minister, on the throne. Gung Ye fled and was killed. Wang Geon, known after his death as King Taejo, restored the name Goryeo, and in 919 he moved the capital to his home town of Songak, renamed Gaegyeong (Kaegyong). He put down risings by Gung Ye’s followers, though several towns went over to Later Baekje, among them Ungju (Gongju), which had joined Gung Ye in 904. He resettled the ruined city of Pyongyang as his Western Capital, and sought good relations with Silla and with the local lords, many of whom he bound to himself by marriage.
      - In 920 Gyeon Hwon finally took Daeya fortress and pushed on towards Jillye near Gimhae. Silla appealed to Goryeo, which sent troops, and from then on Silla generally sided with Goryeo. After an indecisive battle at Jomul fortress in 925 the two kings made peace and exchanged hostages, but in 926 Gyeon Hwon’s nephew Jin Ho, his hostage at Kaegyong, died. Gyeon Hwon blamed Goryeo, had the Goryeo hostage Wang Sin killed and resumed the war.
    facts:
      - [Gung Ye overthrown, "24 July 918"]
      - [Capital moved to Kaegyong, "919"]
      - [Daeya taken by Later Baekje, "920"]
      - [Hostages exchanged, "925"]
