notes:
  - "The main sources, the Samguk sagi (1145) and the Goryeosa (1451), were written under Goryeo and Joseon and are hostile to Gung Ye and Gyeon Hwon. They give dates in the lunar calendar; months here are lunar months, and the two chronicles sometimes differ (the sack of Gyeongju is placed in the ninth or the eleventh month of 927)."
  - The capture of Naju by Wang Geon’s fleet is dated 903 in the Goryeosa and in most Korean accounts, but some historians place it in 909–910. The army sizes given for Illicheon (87,500 in the Goryeosa, more than 100,000 in the Samguk sagi) are disputed; some researchers think Wang Geon’s own troops numbered no more than about 10,000.
  - Gung Ye’s state is often called Later Goguryeo; Gung Ye himself named it Goryeo in 901, Majin in 904 and Taebong in 911. The base map shows it as Taebong throughout.
