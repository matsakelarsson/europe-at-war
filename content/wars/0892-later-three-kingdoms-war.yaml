  - title: Gyeon Hwon’s fall and the end of Silla
    date: "935"
    when: "935-11"
    borders: "935-12-31"
    countries: [kr, kp]
    body:
      - In the third month of 935 Gyeon Hwon’s eldest son Singeom, passed over in favour of his younger brother Geumgang, seized power with his brothers Yanggeom and Yonggeom. They killed Geumgang and shut their father up in Geumsansa monastery near Jeonju. After about three months Gyeon Hwon escaped to Naju, which was held by Goryeo, and asked Wang Geon for refuge. Wang Geon received his old enemy with honour, gave him a high title and an estate, and fetched him by sea to Kaegyong.
      - In the tenth month of 935 King Gyeongsun and his officials decided to submit to Goryeo. By tradition his son, the crown prince, opposed it and withdrew to the Geumgang mountains, where he lived in hemp clothes. In the eleventh month Gyeongsun travelled to Kaegyong with a long procession and handed over his kingdom, ending a state that by tradition had lasted almost a thousand years. Wang Geon married him to his daughter and made him overseer of Gyeongju.
    facts:
      - [Gyeon Hwon deposed, "third month of 935"]
      - [Gyeon Hwon reaches Goryeo, "sixth month of 935"]
      - [Silla’s surrender, "eleventh month of 935"]
