  - title: The sack of Gyeongju and the battle of Gongsan
    date: "927"
    when: "927-11"
    borders: "927-12"
    countries: [kr]
    body:
      - In the autumn of 927 Gyeon Hwon struck at Silla itself. His army took Geunpum (in today’s Mungyeong) and Goulbu (Yeongcheon) and marched on Gyeongju. King Gyeongae appealed to Wang Geon, who sent 10,000 men, but before they arrived Later Baekje troops broke into the capital. The king, caught at the Poseokjeong pavilion south of the city, was forced to kill himself. Gyeon Hwon’s men plundered the city and carried off the king’s brother, ministers and craftsmen, and he put a relative of the royal house, Kim Bu, on the throne as King Gyeongsun.
      - Wang Geon himself rode south with 5,000 picked cavalry to cut off the returning army at Gongsan (today’s Palgongsan, north of Daegu). Gyeon Hwon learned of the plan and surrounded the Goryeo force at Dongsu. Wang Geon escaped only because Sin Sung-gyeom put on the king’s armour to draw the attack, and was killed; Kim Nak and six other generals also died. Tradition says only about 70 of the 5,000 horsemen came back.
      - It was the worst defeat of Wang Geon’s career, and Later Baekje held the upper hand for the next three years, taking towns in the Nakdong valley and, in 928, Gangju (Jinju). Many place names around Daegu, among them Pagunjae, “the pass where the army was broken”, are said to recall the battle.
    facts:
      - [Death of King Gyeongae, "927, at Poseokjeong"]
      - [Battle of Gongsan, "927, Later Baekje victory"]
      - [Goryeo losses, "eight generals; by tradition about 4,930 of 5,000 cavalry"]
