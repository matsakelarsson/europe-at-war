id: later-three-kingdoms-war
name: Wars of the Later Three Kingdoms
start: "892"
end: "936-09"
tier: A
summary: "The wars in which Silla broke apart and Korea was reunited under Goryeo. As Silla’s authority collapsed in the late 880s, local strongmen took over the provinces. Gyeon Hwon, a Silla officer, seized the south-west in 892 and proclaimed the kingdom of Baekje (Later Baekje) at Jeonju in 900; Gung Ye, a former monk, built up a state in the centre and north and proclaimed himself king in 901, naming it Goryeo, then Majin and Taebong. Silla was left with the south-east around its capital, Gyeongju. In 918 Gung Ye’s generals overthrew him and made Wang Geon king of a new Goryeo. Later Baekje held the upper hand in the 920s, sacking Gyeongju in 927 and routing Wang Geon at Gongsan, but Goryeo’s victory at Gochang in 930 brought the east coast over to it. In 935 Gyeon Hwon was deposed by his son Singeom and fled to Goryeo, and the last Silla king, Gyeongsun, handed his kingdom over to Wang Geon. In 936 Goryeo destroyed the Later Baekje army at Illicheon, near today’s Gumi, and Singeom surrendered, leaving Goryeo the master of the peninsula south of the Taedong River."
countries: [kr, kp]
sides:
