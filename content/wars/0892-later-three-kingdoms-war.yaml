  - title: Unju and the west coast
    date: 932–934
    when: "934-09"
    borders: "934-12"
    countries: [kr, kp]
    body:
      - Later Baekje answered with raids from the sea. In the ninth month of 932 its fleet under Sang-gwi sailed into the Yeseong River, close to Kaegyong, and stayed for three days; according to the Samguk sagi it burned 100 ships of Yeomju, Baekju and Jeongju and carried off 300 horses from the island pastures of Jeosan. In 933 Gyeon Hwon threatened Gyeongju again.
      - In 934 Wang Geon led an army to Unju (today’s Hongseong) on the west coast. Gyeon Hwon came against him with 5,000 men, but before they could form up Yu Geum-pil charged with several thousand cavalry and killed or captured some 3,000; the generals Sangdal and Choe Pil were taken. More than thirty fortresses north of Ungjin (Gongju) then submitted to Goryeo.
    facts:
      - [Raid on the Yeseong River, "ninth month of 932"]
      - [Battle of Unju, "934, Goryeo victory"]
      - [Later Baekje losses, "about 3,000 of 5,000"]
