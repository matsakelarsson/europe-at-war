steps:
  - title: Gyeon Hwon and Gung Ye
    date: 892–900
    when: "892"
    borders: "900-12"
    countries: [kr, kp]
    body:
      - By the early 890s the Silla court had lost control of most of its provinces (see the peasant rebellions of late Silla). In 892 Gyeon Hwon, the son of a strongman from the Sangju area who had served as an officer on the south-western coast, gathered a following and took Mujinju (today’s Gwangju). In 900 he moved to Wansanju (Jeonju) and proclaimed himself king of Baekje, appealing to the memory of the kingdom that Silla and Tang China had destroyed in 660. He sent envoys to the Chinese kingdom of Wuyue, across the Yellow Sea. Historians call his state Later Baekje.
      - Gung Ye, said in the chronicles to be an unwanted son of a Silla king who had grown up as a monk, joined the rebel Gi Hwon at Jukju in 891 and then Yanggil, the strongman of Bugwon (Wonju). Leading Yanggil’s troops, he crossed the mountains and took Myeongju (Gangneung) on the east coast in 894, and then moved west into the middle of the peninsula. The local lords north of the Yeseong River submitted to him; in 896 Wang Ryung of Songak (Kaesong) came over with his son Wang Geon, and in 898 Gung Ye made Songak his base. In 899 he defeated Yanggil at Binoeseong and took over his lands.
    facts:
      - [Gyeon Hwon takes Mujinju, "892"]
      - [Later Baekje proclaimed at Wansanju (Jeonju), "900"]
      - [Gung Ye takes Myeongju (Gangneung), "894"]
      - [Gung Ye’s base moved to Songak, "898"]
