notes:
  - The campaign is known mainly from later Omani Ibadi chronicles, which are hostile to Muhammad ibn Nur, and the size of his army is uncertain. Julfar lay near today’s Ras al-Khaimah in the United Arab Emirates, and Tu’am in the Buraimi–al-Ain oasis.
