id: abbasid-conquest-of-oman
name: Abbasid conquest of Oman
start: "893"
end: "893"
tier: C
summary: The Abbasid invasion of Oman in 893, which ended the second Ibadi imamate. During a civil war among the Omani tribes, one faction asked Muhammad ibn Nur, the caliph’s governor of Bahrayn, to intervene, and the caliph al-Mu’tadid approved an expedition. Muhammad’s army, said to number 25,000, marched overland while supplies came by sea from Basra. It took Julfar after a brief fight, advanced in April 893 by way of Tu’am to Nizwa, which fell without resistance, and in mid-May defeated the imam Azzan ibn Tamim, who was killed with many of his followers; their heads were sent to Baghdad. A last tribal alliance was crushed at Dama. Ibadi sources describe harsh repression, with torture, mutilation and killings, the burning of books and the destruction of irrigation channels, and called Muhammad ibn Bur, “son of desolation”. He returned to Bahrayn in 896, leaving a deputy in Oman.
