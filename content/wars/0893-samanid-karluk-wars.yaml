id: samanid-karluk-wars
name: Samanid campaigns against the Karluks
start: "893"
end: "893"
tier: C
summary: The campaigns of the Samanid rulers of Transoxiana against the Karluk Turks of the steppes to the north-east, which culminated in 893, when Ismail ibn Ahmad marched beyond the Syr Darya and took Taraz (Talas), the Karluks’ chief town. His troops carried off large numbers of slaves and livestock, and a Nestorian church in the town was turned into a mosque. With Ismail’s annexation of the principality of Ushrusana in the same years, the campaign secured the Samanid frontier on the Syr Darya and opened the steppe to Muslim merchants and missionaries. Many Turkic groups north of the river became Muslim in the following century, among them the Kara-Khanids, who overthrew the Samanids in 999.
