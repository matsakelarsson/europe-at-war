id: byzantine-bulgarian-war-of-894-896
name: Byzantine–Bulgarian war of 894–896
start: "894"
end: "896"
tier: B
summary: A war that began when the Byzantine government moved the Bulgarian merchants’ market from Constantinople to Thessalonica. Simeon I of Bulgaria invaded Thrace; the Byzantines brought in the Magyars, who ravaged Bulgaria, but Simeon and the Pechenegs drove the Magyars from their steppe homeland and in 896 he routed the Byzantine army at Bulgarophygon, winning a yearly tribute.
