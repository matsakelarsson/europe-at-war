notes:
  - The main sources are the Byzantine chronicle of Theophanes Continuatus, Constantine VII’s De administrando imperio, written some fifty years later, and Simeon’s own letters to the Byzantine envoy Leo Choirosphaktes. They give few places and dates; the battle on the Southern Buh is dated to 895 or 896, and its site is unknown.
  - Bulgarophygon is today’s Babaeski in Turkish Thrace, and Dristra is Silistra on the Danube. The war is sometimes called the first trade war in Europe; many historians think Simeon was defending his merchants rather than looking for a pretext.
  - The Magyars’ move into the Carpathian Basin that followed is told in the Hungarian conquest of the Carpathian Basin.
