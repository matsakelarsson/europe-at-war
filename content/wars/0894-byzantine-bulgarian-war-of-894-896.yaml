steps:
  - title: The trade war and the Magyar alliance
    date: 894–896
    when: "894"
    borders: "896-03"
    countries: [bg, tr, ro, ua, md]
    body:
      - "In 894 Stylianos Zaoutzes, the chief minister of the Emperor Leo VI, let two merchants with links to his household move the market for Bulgarian traders from Constantinople to Thessalonica, where they paid heavier duties. Simeon, who had become ruler of Bulgaria the year before after studying in Constantinople, protested and was ignored. That autumn he invaded Byzantine Thrace and defeated an army under Prokopios Krenites and Kourtikios, who were both killed. He had the noses of the captured Khazar guardsmen cut off and sent them back to Constantinople."
      - "Leo paid the Magyars, then living on the steppes between the Dnieper and the Danube, to attack Bulgaria from the north. In 895 a Byzantine fleet ferried them across the Danube while Nikephoros Phokas the Elder threatened Bulgaria from the south. The Magyars beat Simeon, who shut himself up in Dristra, and plundered the country up to Preslav. Simeon bought time with talks about prisoners, then made an alliance with the Pechenegs. In 896, or perhaps late 895, his army beat the Magyars on the Southern Buh while the Pechenegs ravaged their homeland."
    facts:
      - [Cause, "The Bulgarian market moved from Constantinople to Thessalonica, 894"]
      - [Magyar leaders, Árpád and Kurszán]
      - [Southern Buh, "895 or 896, Bulgarian victory over the Magyars"]
