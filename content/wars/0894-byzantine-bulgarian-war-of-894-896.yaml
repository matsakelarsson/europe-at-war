  - title: Bulgarophygon and the peace
    date: "896"
    when: "896"
    borders: "897"
    countries: [bg, tr]
    body:
      - "With the Magyars gone, Simeon demanded that the Byzantines return all their Bulgarian prisoners. Leo, at war with the Arabs in the east and without Nikephoros Phokas, who had died or fallen from favour, gave way. Simeon then claimed that not all had been sent back and in the summer of 896 invaded Thrace again. The Byzantines made a truce in the east and brought over the armies of Asia Minor under the Domestic of the Schools, Leo Katakalon. At Bulgarophygon the Bulgarians routed them; the second-in-command, the protovestiarios Theodosios, was among the dead, and Katakalon escaped with a few men."
      - "An Arab historian, al-Tabari, writes that the Bulgarians then marched on Constantinople and that Leo considered arming Arab prisoners against them. In the peace that followed the market returned to Constantinople and Byzantium agreed to pay Bulgaria a yearly tribute. Bulgaria gained land between the Strandzha mountains and the Black Sea and released its captives, said to number 120,000. The peace lasted until Leo’s death in 912, apart from 904, when Simeon used the Arab sack of Thessalonica to win more of Macedonia."
    facts:
      - [Battle of Bulgarophygon, "Summer 896, Bulgarian victory"]
      - [Byzantine commander, "Leo Katakalon, Domestic of the Schools"]
      - [Peace, "Yearly tribute to Bulgaria; lasted until 912"]
