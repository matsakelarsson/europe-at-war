notes:
  - The near-contemporary sources are foreign, chiefly the Annals of Fulda, Regino of Prüm and the Byzantine emperor Constantine VII; the Hungarian chronicles, the Gesta Hungarorum of about 1200 and the 14th-century Illuminated Chronicle, are much later and partly legendary. Hungary traditionally dates the conquest to 895–896 and celebrated its millennium in 1896.
  - The Magyars were then led by two rulers, the kende and the gyula; Árpád and Kurszán held these offices around 895, but which was which is disputed. Their route over the mountains is also disputed. The Magyars’ western raids and the battle of Pressburg in 907 are told in the Hungarian invasions of Europe, and their part in the Byzantine–Bulgarian war of 894–896 in that war’s own entry.
