id: hungarian-conquest-of-the-carpathian-basin
name: Hungarian conquest of the Carpathian Basin
start: "895"
end: "902"
tier: B
summary: The migration of the Magyars (Hungarians) from the steppes north of the Black Sea into the Carpathian Basin. Driven out of their homeland by the Bulgarians and the Pechenegs after a war in Bulgaria in 895, they crossed the Carpathians, took Pannonia from the East Franks in 900 and destroyed Great Moravia in the early 900s, founding the Hungarian state. In Hungarian it is called the honfoglalás, the “taking of the homeland”.
