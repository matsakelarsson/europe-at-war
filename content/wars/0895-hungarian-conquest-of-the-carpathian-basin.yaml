  - title: Pannonia and the end of Great Moravia
    date: 896–902
    when: "899"
    borders: "902"
    countries: [hu, sk, cz, at, si, hr, it, de]
    body:
      - "Arnulf, crowned emperor in 896, put the Slav prince Braslav in charge of Pannonia, west of the Danube, while Great Moravia was torn by a war between the sons of Svatopluk I. The Magyars served Arnulf again, and in 899 they invaded Italy, apparently at his urging, and routed King Berengar on the Brenta. Arnulf died in December 899. Coming back from Italy in 900, the Magyars took Pannonia, the old Frankish march around Braslav’s fortress at Mosaburg (Zalavár), and raided Bavaria. On 20 November Margrave Luitpold beat one of their bands on the Danube, and the Bavarians built a fortress on the Enns."
      - "Moravia, already plundered, made peace with East Francia at Regensburg in 901, but it was too late. Under 902 a German chronicle records a war with the Hungarians in Moravia in which “the land succumbed”, and the last Moravian ruler, Mojmír II, is not heard of after about 906. Its strongholds were destroyed and many of its people fled to Bulgaria, Croatia and elsewhere. The Bavarians murdered Kurszán at a banquet in 902 or 904, and the Magyars, now masters of the Carpathian Basin, turned to raiding the West."
    facts:
      - [Pannonia taken, "900, after Arnulf’s death"]
      - [Great Moravia, "Destroyed between 902 and 906"]
      - [Kurszán murdered, "902 or 904, by the Bavarians"]
