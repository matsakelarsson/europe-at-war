steps:
  - title: The Bulgar war and the crossing of the Carpathians
    date: c. 895–896
    when: "895"
    borders: "896"
    countries: [hu, ro, ua, md, bg, sk]
    body:
      - "In the late 9th century the Magyars, a federation of seven tribes of horsemen joined by the Kabars, lived in Etelköz, the steppe between the Dnieper and the lower Danube. They already raided far to the west: in 892 they fought for the East Frankish king Arnulf against Great Moravia, and in 894 they plundered Pannonia as allies of the Moravians. That year the Byzantine emperor Leo VI hired them against Simeon of Bulgaria. In 895 Byzantine ships carried them across the Danube; they routed Simeon, who took refuge in Dristra, plundered Bulgaria and sold their captives to the Byzantines."
      - "Simeon took his revenge. While the Magyar warriors were away, the Pechenegs, his allies, fell on their camps in Etelköz and killed or drove off their families, and the Bulgarians defeated the Magyars on the Southern Buh. The survivors crossed the Carpathians in search of new pastures, perhaps through the north-eastern passes such as Verecke, as the Gesta says, or into Transylvania, as the Illuminated Chronicle has it, where the chronicle says their leader Álmos was killed. They settled first along the upper Tisza, in a thinly peopled land on the edges of Bulgaria, Moravia and the Frankish march."
    facts:
      - [Leaders, "Árpád and Kurszán (and Álmos, Árpád’s father)"]
      - [Homeland left, "Etelköz, between the Dnieper and the lower Danube"]
      - [Crossing of the Carpathians, "c. 895–896"]
