  - title: Henry the Fowler’s truce and Riade
    date: 924–933
    when: "924"
    borders: "933-03-15"
    countries: [de, ch, fr, hu]
    body:
      - In 924 a Magyar army rode into Saxony. King Henry I, the Saxon duke who had been elected king of East Francia in 919, took refuge in the fortress of Werla, but his men captured a Hungarian leader, and in 926 Henry bought a nine-year truce with his release and a yearly tribute. The truce protected Henry’s Saxony, not the south. That spring the raiders crossed Swabia, plundered the abbey of St. Gallen and rode on into Alsace and France.
      - Henry used the truce to build and garrison strongholds and to train a force of armoured horsemen, which he tried out against the Slavs east of the Elbe. In 932, backed by a church synod at Erfurt, he stopped the tribute. The Magyars invaded the next year, and on 15 March 933 Henry’s army routed them at a place called Riade, somewhere near the Unstrut. Most of the Magyars fled before the horsemen could close with them. Raids on Saxony became rare, but the Magyars went on raiding elsewhere, reaching Reims in 937 and Catalonia in 942.
    facts:
      - [Truce, "926, for nine years, with yearly tribute"]
      - [Battle of Riade, "15 March 933, Hungarian defeat"]
    markers:
      - kind: held
        side: ef
        name: Werla
        date: "924"
        text: Henry sheltered in this royal fortress north of the Harz. The capture of a Hungarian leader nearby gave him the means to bargain for a truce.
        lonlat: [10.55, 52.05]
      - kind: event
        side: mag
        name: St. Gallen
        date: May 926
        text: The monks had fled with their books and treasures. A party of raiders found the recluse Wiborada, who had refused to leave her cell nearby, and killed her.
        lonlat: [9.37, 47.42]
      - kind: event
        name: Synod of Erfurt
        date: "932"
        text: Bishops and nobles backed Henry’s decision to stop paying tribute, which meant war.
        lonlat: [11.03, 50.98]
        lp: l
      - kind: battle
        side: ef
        name: Battle of Riade
        date: 15 March 933
        text: The site is unknown. Widukind of Corvey names Riade as Henry’s camp, and several villages on the Unstrut claim the battle.
        lonlat: [11.34, 51.36]
    arrows:
      - side: mag
        label: "926"
