        label: "955"
        phase: 1
        via: [[16.3, 48.2], [14.3, 48.3], [12.5, 48.45], [11.0, 48.36]]
      - side: ef
        label: Otto I
        phase: 2
        via: [[9.99, 48.4], [10.45, 48.38], [10.85, 48.34]]
