  - title: The Lechfeld
    date: 954–955
    when: "954"
    borders: "955-08-10"
    countries: [de, hu, cz, at, fr, be]
    body:
      - The last great raids exploited a German civil war. In 954, during the revolt of Otto I’s son Liudolf and son-in-law Conrad the Red against him, a Hungarian army crossed Bavaria and Franconia. Conrad received it at Worms and sent it on into Lorraine against his enemies, and it went on to plunder what is now Belgium and northern France before going home through Burgundy and Italy. The rebels were blamed for inviting it, and the revolt collapsed. In the summer of 955 the Magyars, perhaps 8,000–10,000 strong, invaded Bavaria again and besieged Augsburg, which its bishop, Ulrich, held.
      - Otto came south with a small Saxon force, gathered Bavarians, Swabians, Franconians and a Bohemian contingent, and moved to relieve the city. On 10 August, on the Lechfeld plain by the river Lech, the Magyars routed his rearguard, but Conrad, now reconciled with Otto, drove them off, and Otto’s armoured horsemen broke the main Hungarian army. Conrad was killed by an arrow. Many fleeing Magyars were cut down over the next days, and their leaders were hanged at Regensburg. The raids to the west were over; Otto was crowned emperor in Rome in 962, and Hungary became a Christian kingdom under Stephen I around 1000.
    facts:
      - [Battle of Lechfeld, "10 August 955, German victory"]
      - [Commanders, "Otto I; Bulcsú, Lehel and Súr"]
      - [Otto crowned emperor, 2 February 962]
    markers:
      - kind: event
        side: mag
        name: Worms
        date: March 954
        text: The Hungarian army camped at Worms, the seat of Conrad the Red, who sent it west against his enemies in Lorraine.
        lonlat: [8.36, 49.63]
      - kind: battle
        side: ef
        name: Battle of Lechfeld
        date: 10 August 955
        text: Otto relieved Augsburg, whose defenders had beaten off a Hungarian assault two days before. The Magyars lost heavily in the battle and even more in the flight that followed.
        lonlat: [10.92, 48.33]
      - kind: event
        side: ef
        name: Regensburg
        date: August 955
        text: The captured Hungarian leaders Bulcsú, Lehel and Súr were hanged here.
        lonlat: [12.08, 49.02]
    arrows:
