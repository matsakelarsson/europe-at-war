steps:
  - title: The raids begin
    date: 899–910
    when: "899"
    borders: "910"
    countries: [hu, sk, at, de, it, cz]
    body:
      - The Magyars were a federation of tribes of mounted archers from the steppes north of the Black Sea. In the 890s, pushed west by the Pechenegs and the Bulgarians, they crossed the Carpathians and took over the plains of the Danube basin. In 899 they rode into Italy and on 24 September routed the army of King Berengar I on the river Brenta. In 900 they took Pannonia from Bavaria, and by about 906 they had broken up Great Moravia, the Slav state to their north.
      - In 907 Margrave Luitpold of Bavaria led a large army down the Danube to drive them out. Near a place called Brezalauspurc, traditionally identified with Pressburg (Bratislava), it was destroyed in fighting that began on 4 July; Luitpold, Archbishop Theotmar of Salzburg and the bishops of Freising and Säben were among the dead. Bavaria lost everything east of the Enns. The Magyars beat the Thuringians near Eisenach in 908 and the army of the young King Louis the Child near Augsburg in 910, and for decades they raided almost at will.
    facts:
      - [Brenta, "24 September 899, Berengar I of Italy defeated"]
      - [Pressburg, "4 July 907, Bavarian army destroyed"]
      - [Near Augsburg, "910, Louis the Child defeated"]
    markers:
      - kind: battle
        side: mag
        name: Battle of the Brenta
        date: 24 September 899
        text: The retreating Magyars offered to give back their plunder. When Berengar refused, they attacked his resting army and routed it, then ranged across the Po plain.
        lonlat: [11.77, 45.55]
      - kind: battle
        side: mag
        name: Battle of Pressburg
        date: 4 July 907
        text: The site is uncertain; some historians place Brezalauspurc near Lake Balaton instead. Few of the Bavarians escaped, and the Magyars followed up with raids deep into Bavaria.
        lonlat: [17.11, 48.14]
      - kind: battle
        side: mag
        name: Battle of Eisenach
        date: 3 August 908
        text: A Thuringian army was beaten; Duke Burchard of Thuringia and Bishop Rudolf of Würzburg were killed.
        lonlat: [10.32, 50.98]
      - kind: battle
        side: mag
        name: First battle of the Lechfeld
        date: "910"
        text: The Magyars drew the army of Louis the Child, then sixteen, into a trap near Augsburg and destroyed it.
        lonlat: [10.88, 48.27]
