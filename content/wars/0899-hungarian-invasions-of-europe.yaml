id: hungarian-invasions-of-europe
name: Hungarian invasions of Europe
start: "899"
end: "955"
tier: B
summary: The raids of the Magyars (Hungarians), who settled in the Danube basin in the 890s and for over half a century raided Germany, Italy, Burgundy and France almost every year. After destroying a Bavarian army at Pressburg in 907 they were held off in Saxony by Henry I at Riade in 933, and Otto I’s victory on the Lechfeld in 955 ended their raids to the west.
countries: [hu, de, at, sk, cz, it, fr, ch]
sides:
  - id: mag
    name: Magyars
    polities: [hungary]
    ink: olive
    moves: Hungarian moves
    success: Hungarian success
  - id: ef
    name: East Francia
    polities: [east-francia, hre]
    ink: gold
    moves: East Frankish moves
    success: East Frankish success
notes:
  - The sources are almost all written by the Magyars’ victims, above all Liutprand of Cremona, Widukind of Corvey and the annals of Bavarian and Swabian monasteries; numbers and many places are uncertain. Hungarian accounts were written down only centuries later.
  - East Francia, the eastern kingdom of the Franks, is the medieval German kingdom; its kings were crowned emperors from 962. The Magyars also raided the Byzantine Empire, until 970; those raids are not told here.
