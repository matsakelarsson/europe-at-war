id: qarmatian-wars
name: Qarmatian wars
start: "899"
end: "977-03"
tier: B
summary: The wars of the Qarmatians of Bahrayn, a radical Ismaili Shi’i movement that built a state in eastern Arabia around the oasis of al-Ahsa, against the Abbasid caliphate. Abu Sa’id al-Jannabi took Qatif and Hajar in 899–903 and destroyed a caliphal army in 900. Under his son Abu Tahir the Qarmatians sacked Basra in 923, plundered the pilgrim caravans, came within sight of Baghdad in 928 and in January 930 sacked Mecca during the pilgrimage and carried off the Black Stone of the Kaaba, which they gave back only in 951. In the 970s they fought the Fatimids for Syria and Egypt.
countries: [sa, bh, iq]
sides:
