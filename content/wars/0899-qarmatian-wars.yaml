notes:
  - The Qarmatians (Qaramita) are named after Hamdan Qarmat, an Ismaili missionary in southern Iraq. The state in Bahrayn did not recognise the Fatimid caliphs as its imams, though the two sometimes acted together. In medieval usage Bahrayn meant the whole east coast of Arabia; the island of Bahrain was called Awal.
  - Most accounts of the Qarmatians come from their enemies. There is no reliable count of the pilgrims killed at Mecca in 930. The return of the Black Stone is dated 951 or 952.
  - This entry ends with the death of al-Hasan al-A’sam in 977. The Qarmatian state of Bahrayn survived as a local power until the 1070s.
