steps:
  - title: The state of Bahrayn
    date: 899–906
    when: "899"
    borders: "903"
    countries: [sa, bh]
    body:
      - Abu Sa’id al-Jannabi, from Jannaba on the coast of Fars, came to Bahrayn as an Ismaili missionary, probably in the 880s, and won over Bedouin tribes and villagers. By 899 his followers held Qatif and most of the country except its capital, Hajar. Early in 900 he laid siege to Hajar and built his own base, al-Ahsa, nearby. The caliph al-Mu’tadid sent al-Abbas ibn Amr al-Ghanawi against him with about 2,000 men, but on 31 July 900 Abu Sa’id destroyed this army in a salt marsh two days’ march from Qatif.
      - Hajar surrendered late in 903 after its water supply was cut off, and many of its people fled or were killed. Abu Sa’id also took the island of Awal, briefly held Sohar in Oman and raided al-Yamama in central Arabia. In the same years other Qarmatian groups rose in the Syrian desert and in Iraq, and in 906 one of them ambushed a pilgrim caravan returning from Mecca, killing, it is said, some 20,000 people.
    facts:
      - [Qatif taken, "899"]
      - [Defeat of al-Abbas ibn Amr al-Ghanawi, "31 July 900"]
      - [Hajar surrenders, "late 903"]
