  - title: The sack of Mecca
    date: 930–977
    when: "930-01-11"
    borders: "930-01"
    countries: [sa, iq, bh]
    body:
      - On 11 January 930, as the pilgrimage rites were about to begin, Abu Tahir’s men entered Mecca, ostensibly as pilgrims, and fell on the crowds. For eight to eleven days they killed and plundered, leaving bodies unburied or throwing them into the well of Zamzam; the governor of Mecca was among the dead. They stripped the Kaaba and carried the Black Stone off to al-Ahsa. Both the Abbasid caliph and the Fatimid caliph al-Mahdi demanded its return in vain. Historians disagree about the motive. Some think the Qarmatians hoped to win concessions or to draw the pilgrimage to al-Ahsa; others see a deliberate act announcing the end of the Islamic era.
      - In 931 Abu Tahir handed power to a young Persian captive whom he proclaimed the Mahdi. Within about 80 days the man had executed leading Qarmatians and was himself killed, a crisis that weakened the movement. The Qarmatians sacked Kufa the same year, but in 939 they made peace with the caliphate, and the Black Stone was returned to Mecca in 951.
      - After the Fatimids took Egypt in 969, the Qarmatians under al-Hasan al-A’sam fought them, with Buyid and Hamdanid support. They took Damascus in 971 and twice invaded Egypt, but were beaten at Ayn Shams outside Cairo in December 971 and again in April 974. Al-A’sam died at Ramla in March 977.
    facts:
      - [Sack of Mecca, "11 January 930"]
      - [Peace with the caliphate, "939"]
      - [Black Stone returned, "951"]
