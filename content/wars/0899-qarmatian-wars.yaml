  - title: Basra, the pilgrims and Baghdad
    date: 923–928
    when: "923-08"
    borders: "928"
    countries: [iq, sa, sy]
    body:
      - Abu Sa’id was murdered in 913. In 923 his young son Abu Tahir took control and began ten years of raids into Iraq and on the pilgrim routes. In August 923 the Qarmatians stormed Basra and plundered it for more than two weeks. In March 924 Abu Tahir attacked the returning pilgrim caravans at al-Habir in the desert. Many pilgrims were killed, others died of thirst after their camels and supplies were taken, and members of the caliph’s court were carried off for ransom. Riots in Baghdad brought down the vizier Ibn al-Furat, who was executed.
      - In late 927 Abu Tahir led about 2,300 men into Iraq. On 7 December 927 near Kufa he beat and captured the caliph’s general Yusuf ibn Abi’l-Saj, whose army was much larger, then crossed the Euphrates at Anbar and marched on Baghdad. The commander-in-chief Mu’nis flooded the fields, broke the canals and pulled down the bridges, and on 7 January 928 the Qarmatians were halted at Aqarquf, within sight of the city. They turned up the Euphrates, sacked al-Rahba, attacked Raqqa without success and in the summer went home unopposed.
    facts:
      - [Sack of Basra, "August 923"]
      - [Pilgrim caravans attacked at al-Habir, "March 924"]
      - [Halt at Aqarquf, "7 January 928"]
