notes:
  - The fullest account is the history of the mission written for the Fatimid court about fifty years later by the Ismaili jurist al-Qadi al-Nu’man; Sunni chroniclers such as Ibn Idhari and Ibn al-Athir tell the story from the other side. The dates are the Gregorian equivalents given in the modern works cited; some events are dated only to a year.
  - Ifriqiya is the old Roman province of Africa, today’s Tunisia and eastern Algeria. The Aghlabids had ruled it since 800 as emirs in the name of the Abbasid caliphs of Baghdad. The Kutama lived in the mountains of Lesser Kabylia between Sétif, Mila and the coast at Jijel.
  - Sunni sources call the imam Ubayd Allah; Fatimid sources call him Abdallah. He had travelled from Salamiyya in Syria and lived as a merchant in Sijilmasa from about 905 until the Midrarid emir put him under house arrest.
