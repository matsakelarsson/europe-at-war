id: fatimid-conquest-of-ifriqiya
name: Fatimid conquest of Ifriqiya
start: "902"
end: "909-08-27"
tier: B
summary: "The overthrow of the Aghlabid emirs of Ifriqiya by the Ismaili missionary Abu Abdallah al-Shi’i and the Kutama Berbers of Lesser Kabylia, which brought the Fatimid caliphate to power. Abu Abdallah had lived among the Kutama since 893, preaching the coming of the Mahdi, a hidden imam descended from the Prophet’s daughter Fatima. From 902 his Kutama army took the Aghlabid fortress towns of the west one by one: Mila, Sétif (904), Tobna (906), Belezma and Baghaya (907). On 18 March 909 it destroyed the last Aghlabid army at al-Urbus (Laribus); the emir Ziyadat Allah III fled to Egypt, and a week later Abu Abdallah entered the palace city of Raqqada. In the summer he marched west, ended the Rustamid imamate of Tahert and on 26 August 909 freed the Ismaili imam Abdallah from house arrest at Sijilmasa. Proclaimed caliph as al-Mahdi, Abdallah reached Raqqada in January 910; in 911 he had Abu Abdallah killed. The dynasty he founded would rule Ifriqiya and Sicily and, from 969, Egypt."
countries: [tn, dz, ma, ly]
