  - title: Al-Urbus and Raqqada
    date: March 909
    when: "909-03"
    borders: "909-03-26"
    countries: [tn, dz]
    body:
      - In 908 Abu Abdallah’s columns raided south towards Kasserine and the oases of the Djerid, while Ziyadat Allah gathered his last army at al-Urbus (Laribus), the fortress that guarded the way from the western plateaus into the Medjerda valley and was called the gateway of Ifriqiya. On 18 March 909 the Kutama overwhelmed the Aghlabid army there. The town surrendered the next day and its inhabitants were massacred and its houses looted.
      - When the news reached Raqqada, Ziyadat Allah loaded his treasure and fled east by way of Tripoli to Egypt; he died in exile a few years later. For five days local people ransacked the palaces, until Abu Abdallah sent a thousand horsemen to stop the looting and the notables of Kairouan surrendered. On 25 March 909 he entered Raqqada and took up residence in the emir’s palace. He granted a pardon to the people of Kairouan and the Aghlabid servants, and changed the coinage, the call to prayer and the Friday sermon; the new ruler was not yet named in public, and official formulas praised the Family of Muhammad instead. A century of Aghlabid rule was over.
    facts:
      - [Battle of al-Urbus (Laribus), "18 March 909, Kutama victory"]
      - [Raqqada entered, "25 March 909"]
