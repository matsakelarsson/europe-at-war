  - title: To Sijilmasa and the coming of the Mahdi
    date: June 909 – January 910
    when: "909-08"
    borders: "909-08-27"
    countries: [dz, ma, tn]
    body:
      - On 6 June 909 Abu Abdallah left Raqqada with the Kutama army to fetch the imam. On the way the Zenata chief Muhammad ibn Khazar submitted, and at Tahert the Rustamid imamate, which had ruled the central Maghreb as an Ibadi Kharijite state since the 770s, was overthrown and a Kutama governor installed. The army reached Sijilmasa, the caravan city on the edge of the Sahara, on 26 August. The Midrarid emir al-Yasa ibn Midrar, who had held the imam and his son under house arrest, fled and was later caught and killed.
      - The next day, 27 August 909, the imam Abdallah was presented to the army and acclaimed. He took the title al-Mahdi bi’llah and, as caliph and Commander of the Faithful, claimed the leadership of all Muslims against the Abbasids of Baghdad. The army set out for the east on 12 October; on 4 January 910 the notables of Kairouan came out to greet him, and he rode on to Raqqada, where his name was proclaimed in the Friday sermon the next day. Abu Abdallah soon fell out with the new caliph, who kept the power the missionary had held. Accused of plotting with Kutama chiefs, he and his brother were killed in the palace on 18 February 911.
    facts:
      - [Tahert taken, "summer 909"]
