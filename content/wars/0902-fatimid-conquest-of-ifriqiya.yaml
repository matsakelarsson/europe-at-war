steps:
  - title: The mission among the Kutama
    date: 893–907
    when: "902"
    borders: "907-06-01"
    countries: [dz, tn]
    body:
      - Abu Abdallah al-Shi’i, a missionary (da’i) of the Ismaili branch of Shi’ism, born in Kufa in Iraq and trained in Yemen, met pilgrims of the Kutama Berbers at Mecca and went home with them to Lesser Kabylia in June 893. From the mountain village of Ikjan, and later from Tazrut, he preached that the Mahdi, an imam of the line of Ali and Fatima, would soon appear to restore justice. The Kutama, who had never been closely ruled by the Aghlabid emirs of Kairouan, gave him an army; he organised it by clans and kept the movement’s treasury and discipline in his own hands.
      - In late 902 the Kutama took the walled town of Mila, the first Aghlabid stronghold to fall. The Aghlabids answered with expeditions into the mountains, but most of their regular troops had followed the former emir Ibrahim II to Italy in 902, and his successor Abdallah II was murdered by his own son, Ziyadat Allah III, in July 903. In 904 the Kutama took Sétif and destroyed an Aghlabid army under Ibrahim ibn Habashi at Kayuna. Tobna, the old capital of the Zab, surrendered in October 906 after a siege of almost a year, and in the spring of 907 the Kutama sacked Belezma; Baghaya and Tijis then opened their gates. The road into the heart of Ifriqiya lay open.
    facts:
      - [Abu Abdallah among the Kutama, "from June 893"]
      - [Mila taken, "late 902"]
      - [Sétif taken, "904"]
      - [Tobna surrenders, "October 906"]
      - [Baghaya opens its gates, "907"]
