  - title: The fall of Daliang
    date: May – November 923
    when: "923-11-18"
    borders: "923-11-18"
    countries: [cn]
    body:
      - In the spring of 923 Li Cunxu proclaimed himself emperor at Weizhou, calling his dynasty Tang to claim the succession of the old dynasty; historians call it the Later Tang. His position looked weak, with Khitan raids in the north and a rebellion at Luzhou, but a Liang officer who defected revealed that the Tianping circuit south of the Yellow River was poorly defended. Li Siyuan crossed the river and took its seat Yunzhou in a surprise attack.
      - The Liang court changed commanders, its general Wang Yanzhang took Desheng, and it broke the Yellow River dikes at Huazhou to flood the approaches. Its new commander Duan Ning planned a four-pronged offensive that took the main army north of the river. Another defector told Li Cunxu that Daliang lay undefended. He joined Li Siyuan at Yunzhou, defeated and captured Wang Yanzhang at Zhongdu, and rode straight for the capital. The Liang emperor Zhu Zhen had an officer kill him on 18 November 923, and Li Cunxu entered Daliang; the Liang governors submitted, and he moved his capital to Luoyang.
    facts:
      - [Li Cunxu proclaims the Later Tang, "spring 923"]
      - [Yunzhou taken, "923"]
      - [Death of Zhu Zhen, "18 November 923"]
