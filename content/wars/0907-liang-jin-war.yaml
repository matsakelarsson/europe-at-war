id: liang-jin-war
name: Later Liang–Jin war
start: "907"
end: "923-11-18"
tier: B
summary: "The sixteen-year war for northern China between the Later Liang, founded in 907 by Zhu Wen when he deposed the last Tang emperor, and the Jin state of the Shatuo Turk Li Keyong and his son Li Cunxu in Shanxi, which refused to recognise him. Jin held out at the siege of Luzhou (907–908), and Li Cunxu, who succeeded his father in 908, relieved the city in a surprise attack. With the Hebei governors of Zhao and Yiwu as allies, he crushed the Liang army at Baixiang in 911, conquered the Yan state of Liu Shouguang at Youzhou (Beijing) in 913, and in 915 won the great Weibo circuit when its army rose against Liang. Years of fighting along the Yellow River followed, including the costly battle of Huliupo (918–919). In 923 Li Cunxu proclaimed himself emperor of a restored Tang (the Later Tang), sent Li Siyuan behind the Liang lines to take Yunzhou, and marched on the undefended Liang capital Daliang (Kaifeng), where the last Liang emperor had himself killed on 18 November 923."
