  - title: Yan, Weibo and the Yellow River
    date: 911–919
    when: "915"
    borders: "916-01-01"
    countries: [cn]
    body:
      - In the north, Liu Shouguang, ruler of the Lulong circuit at Youzhou, declared himself emperor of Yan in 911 and attacked Yiwu. Li Cunxu sent Zhou Dewei, who advanced deep into Yan; Youzhou fell late in 913, and Liu Shouguang and his father were taken to Taiyuan and executed. Jin now held the whole north-east of the plain, which also brought it face to face with the Khitans, whose ruler Abaoji besieged Youzhou in 917 before Li Cunxu’s generals drove him off.
      - In 915 the Liang emperor Zhu Zhen split the great Weibo (Tianxiong) circuit in two to weaken its army. The soldiers at Weizhou rose against the order and offered the circuit to Jin, and Li Cunxu took it over, bringing the front to the Yellow River. For years the two armies faced each other across the river around the fort of Desheng. Around the new year of 919 they met at Huliupo, south of the river; Li Cunxu attacked against Zhou Dewei’s advice, and Zhou was killed in the rout, but Li Cunxu rallied his men on a hill and inflicted heavy losses in turn. Both armies were badly mauled.
    facts:
      - [Fall of Youzhou, "913"]
      - [Weibo goes over to Jin, "915"]
      - [Battle of Huliupo, "turn of 918 and 919"]
