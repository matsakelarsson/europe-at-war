steps:
  - title: Luzhou and Baixiang
    date: 907–911
    when: "908"
    borders: "911-03-01"
    countries: [cn]
    body:
      - When Zhu Wen made the last Tang emperor abdicate in 907 and founded the Later Liang, Li Keyong, the Shatuo governor of Hedong at Taiyuan and his rival since the Huang Chao war, refused to recognise him, as did the rulers of Qi, Wu and Shu. Zhu sent Kang Huaizhen to besiege Luzhou, the Jin stronghold in south-eastern Shanxi, inside a double ring of walls and ditches that cut it off; relief armies under Zhou Dewei could not break through. Li Keyong died on 24 February 908, telling his son Li Cunxu that his first task was to save Luzhou. A few months later Li Cunxu led his army through a morning fog and surprised and destroyed the Liang siege camp.
      - In 910 Zhu Wen tried to seize the Hebei circuits of Zhao (Chengde, ruled by Wang Rong) and Yiwu (Wang Chuzhi) by a trick, massacring the Zhao garrisons at Shenzhou and Jizhou. Both turned to Jin. Early in 911 a joint army of Jin, Zhao and Yiwu crushed the Liang army under Wang Jingren at Baixiang. Li Cunxu advanced and besieged Weizhou, but withdrew when a new Liang army approached; Zhao and Yiwu stayed allied with Jin.
    facts:
      - [Death of Li Keyong, "24 February 908"]
      - [Siege of Luzhou lifted, "908"]
      - [Battle of Baixiang, "early 911"]
