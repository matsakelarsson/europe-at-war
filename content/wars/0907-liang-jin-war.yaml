notes:
  - Jin’s rulers held the Tang title Prince of Jin and kept using the Tang era name, refusing to recognise Liang. Zhao (Chengde, at Zhenzhou) and Yiwu (at Dingzhou) were Hebei circuits that left Liang for Jin in 910–911; they are shown with their overlords on the map.
  - Dates are converted from the Chinese calendar by the sources; the battle of Huliupo was fought at the turn of 918 and 919.
