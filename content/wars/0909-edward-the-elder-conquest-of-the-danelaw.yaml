id: edward-the-elder-conquest-of-the-danelaw
name: Edward the Elder’s conquest of the Danelaw
start: "909"
end: "920"
tier: C
summary: The campaigns in which Edward the Elder of Wessex and his sister Æthelflæd, Lady of the Mercians, conquered the Danish-ruled lands of England south of the Humber. After a West Saxon and Mercian army destroyed a Northumbrian Danish raiding army at Tettenhall on 5 August 910, the two built chains of fortified burhs and pushed into the Danelaw. In 917 the English stormed the Danish fort at Tempsford, killing the last Danish king of East Anglia, and East Anglia, Essex and Derby fell; in 918 Leicester, Stamford and Nottingham submitted, and after Æthelflæd’s death that June Edward took direct rule of Mercia. In 920 at Bakewell the rulers of York, Bamburgh, the Scots and Strathclyde accepted Edward, by the Chronicle’s account, as “father and lord”, though historians doubt how much that meant.
