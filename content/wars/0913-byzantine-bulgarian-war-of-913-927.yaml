    success: Serbian and Croatian success
notes:
  - Almost all the narrative comes from Byzantine chroniclers hostile to Simeon, above all Theophanes Continuatus, with the letters that Patriarch Nicholas Mystikos and Romanos I wrote to him. What Simeon was crowned in 913, and what Romanos conceded in 924, are disputed; many historians think Simeon was crowned emperor of the Bulgarians, not of the Romans.
  - The size of the armies at Achelous is not known; figures such as 60,000 for the Byzantines are modern guesses. Anchialos is today’s Pomorie, and Katasyrtai was a place near Constantinople whose site is unknown.
  - The Croatian victory of 926 is told in its own entry, the Croatian–Bulgarian war.
