id: byzantine-bulgarian-war-of-913-927
name: Byzantine–Bulgarian war of 913–927
start: "913"
end: "927-10"
tier: B
summary: Simeon I of Bulgaria’s war to win the throne of Constantinople. He extracted an imperial coronation from the regents of the boy emperor Constantine VII in 913, destroyed the Byzantine army at Achelous in 917 and raided Thrace and Greece for years, but without a fleet he could not take the city. After his death in 927 his son Peter made a peace that recognised him as emperor (tsar) of the Bulgarians.
countries: [bg, tr, gr, rs, hr, ba, me]
