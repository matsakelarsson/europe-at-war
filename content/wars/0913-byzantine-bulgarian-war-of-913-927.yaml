    name: Bulgaria
    polities: [bulgaria]
    ink: green
    moves: Bulgarian moves
    success: Bulgarian success
  - id: byz
    name: Byzantine Empire
    polities: [byzantium]
    ink: purple
    moves: Byzantine moves
