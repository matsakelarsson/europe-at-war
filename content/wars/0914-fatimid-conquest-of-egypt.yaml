  - title: Alexandria, Abukir and the retreat from the Fayyum
    date: April 919 – July 921
    when: "920"
    borders: "920-03-12"
    countries: [eg, ly]
    body:
      - Al-Qa’im set out again from Raqqada on 5 April 919. His vanguard entered Alexandria on 9 July; the governor fled without a fight, and the Kutama sacked the city. This time a Fatimid fleet of about 80 ships came too, to carry the war up the Nile. On 12 March 920 the Abbasid admiral Thamal al-Dulafi, whose ships carried Greek fire, destroyed it near Abukir; the Fatimid admiral and more than a hundred officers were taken, and about 700 Kutama and Zawila guardsmen were lynched in Fustat. Mu’nis reached the capital in May with 3,000 men and dug in at Giza.
      - In July 920 al-Qa’im bypassed Giza and seized the Fayyum, where he taxed the people, while both sides waged a war of letters and propaganda; Mu’nis avoided battle. In the spring of 921 the Kutama pushed up the Nile to al-Ushmunayn, cutting Fustat’s grain supply from Upper Egypt. Then Thamal’s fleet retook Alexandria, and at the end of June Mu’nis, Takin and the fleet closed in on the Fayyum. On 8 July 921 al-Qa’im abandoned his heavy baggage and retreated across the desert to the coast road and Barqa, losing many men on the way. Fatimid and Abbasid troops clashed again west of Alexandria in 922 and 928, and in 935–936 Fatimid troops briefly held Alexandria during the struggles in Egypt from which the Ikhshidid dynasty emerged.
    facts:
      - [Alexandria taken, "9 July 919"]
      - [Battle of Abukir, "12 March 920, Abbasid victory at sea"]
      - [Fayyum occupied, "July 920 – July 921"]
      - [Fatimid retreat, "8 July 921"]
