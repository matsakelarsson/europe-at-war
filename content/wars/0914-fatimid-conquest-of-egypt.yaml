steps:
  - title: Habasa and al-Qa’im before Fustat
    date: January 914 – May 915
    when: "914"
    borders: "914-12-13"
    countries: [eg, ly]
    body:
      - Five years after taking power in Ifriqiya, the Fatimid caliph al-Mahdi turned east, against the Abbasids whose authority he denied. In January 914 his general Habasa ibn Yusuf left Tripoli along the coast road with a Kutama army and on 6 February entered Barqa, which its garrison abandoned; Sunni writers tell of extortion and killings there. The caliph sent his son and heir, al-Qa’im, to take command and ordered Habasa to wait, but Habasa pressed on, beat an Abbasid force at al-Hanniya and entered Alexandria on 27 August 914. Al-Qa’im joined him there in November.
      - Fustat had meanwhile been reinforced from Syria, and the governor Takin al-Khazari fortified Giza, on the west bank opposite the capital. In mid-December the Fatimid army attacked at Giza and was thrown back by the Abbasid troops, among them Turkish horse-archers; sources speak of about 7,000 Fatimids killed and as many captured. Al-Qa’im moved into the Fayyum, quarrelled with Habasa, and on 8 January 915 lost a second battle at Giza. When the Abbasid commander-in-chief Mu’nis arrived from Baghdad in April, al-Qa’im evacuated Alexandria; he was back at Raqqada on 28 May 915. Barqa then rose and killed its Kutama garrison, and was retaken only in 917 after an eighteen-month siege. Habasa, who had deserted, was executed.
    facts:
