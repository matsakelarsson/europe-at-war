id: fatimid-conquest-of-egypt
name: Fatimid conquest of Egypt
start: "914-01-24"
end: "969-07-09"
tier: B
summary: "The Fatimid caliphs’ fifty-year effort to take Egypt, the gateway to Syria and Iraq, from the Abbasid caliphate and its governors. Two invasions led by the heir al-Qa’im took Barqa and Alexandria and reached the Fayyum, but failed before Fustat, the capital: the Kutama army was beaten at Giza in December 914 and January 915, and in 919–921 its fleet was destroyed off Abukir and the army had to retreat across the desert. Half a century later, with Egypt weakened by years of low Nile floods and famine and leaderless after the death of the regent Kafur in 968, the caliph al-Mu’izz sent his general Jawhar with a large, well-paid army. It left Ifriqiya in February 969, occupied Alexandria without a fight, forced the crossing of the Nile at Giza on 3 July and took Fustat on 6 July. Jawhar founded a new palace city beside it, which became al-Qahira, Cairo; al-Mu’izz moved there in 973, and Egypt was the centre of the Fatimid caliphate until 1171."
countries: [eg, ly, tn]
