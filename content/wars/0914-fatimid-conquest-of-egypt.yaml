  - title: Jawhar takes Fustat
    date: February – July 969
    when: "969-07"
    borders: "969-07-06"
    countries: [eg, ly, tn]
    body:
      - In the 960s Egypt was in crisis. The Nile floods failed year after year from 962, the flood of 967 was the lowest recorded in the early Islamic period, and famine and plague followed; Nubian raids from the south, Qarmatian and Bedouin attacks in Syria and Byzantine victories in Crete, Cyprus and Cilicia added to the strain. When Kafur died in April 968 without an heir, the regime broke into factions, and some of the Egyptian elite wrote to the caliph al-Mu’izz asking him to intervene. Al-Mu’izz had been preparing for years. His general Jawhar, a former slave soldier born in Sicily and called al-Siqilli, “the Sicilian”, and al-Rumi, “the Greek”, had recruited among the Kutama, the road to Egypt was furnished with wells, and a war chest said to have held more than a thousand chests of gold was raised from special taxes and Saharan trade.
      - The army, given by Arab writers as over 100,000 men, left Raqqada on 6 February 969 and reached Alexandria in May, which it occupied without resistance. Jawhar offered the people of Fustat a written guarantee of safety, promising to respect their lives, property and offices and to restore the pilgrim routes; the notables accepted it, but the Ikhshidid soldiers rejected it and held the Nile crossing at Rawda island, between Fustat and Jawhar’s camp at Giza. After a failed first attack on 29 June, part of Jawhar’s army crossed the river in boats elsewhere, and on 3 July it defeated the Ikhshidid troops sent against it. On 6 July the notables came over the bridge to submit, and Jawhar took possession of Fustat; on 9 July the Friday sermon was said in al-Mu’izz’s name.
      - North of Fustat Jawhar laid out a walled palace city for the caliph and the Kutama, at first called al-Mansuriya; work on its great mosque, al-Azhar, began in April 970. Fatimid armies went on into Palestine and Syria, where they were soon driven back by the Qarmatians. Al-Mu’izz left Ifriqiya in the care of Buluggin ibn Ziri in 972 and entered the new city on 10 June 973; it was renamed al-Qahira al-Mu’izziyya, Cairo, and remained the Fatimid capital until the end of the dynasty in 1171.
    facts:
      - [Army leaves Raqqada, "6 February 969"]
      - [Crossing of the Nile at Giza, "3 July 969, Fatimid victory"]
      - [Fustat taken, "6 July 969"]
      - [Al-Mu’izz enters Cairo, "10 June 973"]
