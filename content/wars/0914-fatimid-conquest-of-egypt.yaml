notes:
  - The dates are the Gregorian equivalents given in the modern works cited. Fatimid writers such as al-Qadi al-Nu’man and later Egyptian historians such as al-Maqrizi tell these campaigns from opposite sides, and their figures for armies, treasure and the dead are large and uncertain.
  - "Egypt was ruled for the Abbasids by governors until 935, when Muhammad ibn Tughj, called al-Ikhshid, founded a dynasty of his own under nominal Abbasid sovereignty; the eunuch Abu al-Misk Kafur held power for his sons from 946 and ruled in his own name from 966 to 968. Fustat was the old capital on the east bank of the Nile, opposite Giza; Cairo grew up just north of it."
  - The Fatimids’ wars with the Qarmatians, who invaded Egypt in 971 and 974 and were beaten outside Cairo, are told in the Qarmatian wars.
