  - title: Jawhar’s march to the Atlantic
    date: 931–959
    when: "958"
    borders: "959-11-01"
    countries: [ma, dz, es]
    body:
      - The Fatimids answered Musa ibn Abi’l-Afiya’s defection with expeditions in 933 and 935, and Musa, beaten and abandoned, was hunted down and killed by the Idrisids. But the Fatimids were soon fighting for their lives against the Kharijite revolt of Abu Yazid (944–947), and Córdoba gained ground. The Zenata chiefs of the Maghrawa and the Banu Ifran became Umayyad clients; the Idrisids in the Rif recognised Abd al-Rahman III, and Tangier passed to the Umayyads around 949–951. In 955 a Fatimid fleet from Sicily raided Almería, the Umayyad naval base.
      - In 958 the caliph al-Mu’izz sent his general Jawhar west with a large army, joined by Ziri ibn Manad and his Sanhaja horsemen. Jawhar defeated and killed the Banu Ifran chief Ya’la ibn Muhammad, an Umayyad ally, and in September 958 occupied Sijilmasa, whose ruler Muhammad ibn Wasul had proclaimed himself caliph; Ibn Wasul fled, was handed over and was taken away a prisoner. Ziri laid siege to Fez in the winter, and the city was stormed in November 959, according to most accounts (one gives November 960). Jawhar reached the Atlantic and sent the caliph live sea fish in jars as a token. Apart from Ceuta and Tangier, the whole Maghreb now recognised the Fatimid caliph, and the Idrisids again gave hostages.
    facts:
      - [Musa ibn Abi’l-Afiya killed, "after 935"]
      - [Fatimid raid on Almería, "955"]
      - [Sijilmasa taken, "September 958"]
      - [Fez stormed, "November 959 (some accounts 960)"]
