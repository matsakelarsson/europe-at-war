steps:
  - title: Nekor, Fez and the Miknasa
    date: 917–931
    when: "921"
    borders: "921-06-01"
    countries: [ma, dz, es]
    body:
      - The Fatimid caliph al-Mahdi claimed the whole Islamic west. His governor of Tahert, Masala ibn Habus, a chief of the Miknasa Berbers, led the advance. In June 917 he sacked Nekor, the small emirate on the Rif coast; its princes fled to al-Andalus and soon came back with Umayyad help. The same year he forced the Idrisid ruler of Fez, Yahya IV, to accept Fatimid overlordship. In 921 Masala returned, drove out the emir of Nekor again, deposed Yahya at Fez, put a Fatimid governor in the city and restored Fatimid rule over Sijilmasa. His fellow tribesman Musa ibn Abi’l-Afiya was left in charge of the rest of the country.
      - Masala was killed by the Zenata chief Muhammad ibn Khazar in 924, and in 925 an Idrisid, al-Hasan al-Hajjam, retook Fez. Musa ibn Abi’l-Afiya captured and killed him in 927, and it was the last time the Idrisids held Fez; they withdrew to the Jbala hills and the fortress of Hajar al-Nasr, where the Miknasa besieged them. Across the Strait, Abd al-Rahman III of Córdoba, who proclaimed himself caliph in 929, took Melilla in 927 and Ceuta in 931 as forward posts against a Fatimid crossing, and in 931 Musa ibn Abi’l-Afiya changed sides and recognised him.
    facts:
      - [Nekor sacked, "June 917"]
      - [Yahya IV deposed at Fez, "921"]
      - [Umayyads take Melilla and Ceuta, "927 and 931"]
      - [Musa ibn Abi’l-Afiya joins Córdoba, "931"]
