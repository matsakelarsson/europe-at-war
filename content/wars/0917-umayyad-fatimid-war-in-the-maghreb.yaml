  - title: Ghalib, Buluggin and the end of the Idrisids
    date: 972–985
    when: "974"
    borders: "974-09-01"
    countries: [ma, dz, es, tn]
    body:
      - When the Fatimid court moved to Egypt in 972–973, it left the Maghreb to its Sanhaja governor Buluggin ibn Ziri, and Córdoba struck back. In 973 the caliph al-Hakam II sent his best general, Ghalib, across the Strait with an army. He drove the Idrisid al-Hasan ibn Qannun from his towns and besieged him in his fortress of Hajar al-Nasr until he surrendered. In September 974 Ghalib entered Córdoba in triumph with al-Hasan and many of his family as captives; the Idrisids had to swear allegiance to the Umayyads and to the Maliki school of law in place of the Shi’ism of the Fatimids.
      - In 979 Buluggin led a great expedition west. He took Fez and Sijilmasa, punished the Barghawata of the Atlantic plains, whose leader claimed to be a prophet, and carried off many captives to Ifriqiya, but he turned back before Ceuta when he saw its walls and Zenata reinforcements arriving by sea from al-Andalus. Córdoba’s chief minister, Ibn Abi Amir al-Mansur, restored the Umayyad position, and from the 980s the Maghrawa Zenata chief Ziri ibn Atiyya governed Fez in Córdoba’s name. Buluggin died in May 984. In 985 al-Hasan ibn Qannun, who had been expelled from Córdoba and gone to Egypt, came back to the Maghreb with Fatimid support; an army sent by al-Mansur defeated him, and he was killed. With him the Idrisid dynasty ended.
    facts:
      - [Ghalib’s campaign, "973–974"]
      - [Al-Hasan ibn Qannun taken to Córdoba, "September 974"]
      - [Buluggin’s expedition, "979–980"]
      - [Death of al-Hasan, the last Idrisid, "985"]
