id: umayyad-fatimid-war-in-the-maghreb
name: Umayyad–Fatimid struggle for the Maghreb
start: "917"
end: "985"
tier: B
summary: "Seventy years of war by proxy between the two rival caliphates of the west, the Ismaili Fatimids of Ifriqiya and Cairo and the Sunni Umayyads of Córdoba, for the lands of today’s Morocco and western Algeria. The Fatimids struck first: their Miknasa general Masala ibn Habus sacked Nekor in 917 and in 921 deposed the Idrisid ruler of Fez and restored their rule at Sijilmasa. Abd al-Rahman III answered by taking Melilla (927), Ceuta (931) and later Tangier as bridgeheads, and by winning over Berber chiefs such as Musa ibn Abi’l-Afiya and the Zenata emirs of the Maghrawa and the Banu Ifran. The Idrisids, driven from Fez to their mountain fortress of Hajar al-Nasr in the Rif, changed sides as each caliph gained the upper hand. Jawhar’s great expedition of 958–959 took Sijilmasa and Fez and carried Fatimid rule to the Atlantic, but after the Fatimids moved to Egypt, the Umayyad general Ghalib took the last Idrisid, al-Hasan ibn Qannun, to Córdoba in 974. A Zirid counter-offensive in 979–980 failed to hold the west, and when al-Hasan returned from Egypt in 985 he was defeated and killed. Fez and the north were left to Zenata emirs allied with Córdoba."
countries: [ma, dz, es]
