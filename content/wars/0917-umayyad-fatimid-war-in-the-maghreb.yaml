notes:
  - The sources are Arabic chronicles written from the Fatimid side (al-Qadi al-Nu’man) or the Andalusi and Maghribi side (Ibn Hayyan, Ibn Idhari, Ibn Abi Zar, Ibn Khaldun), most of them long after the events. Modern accounts disagree on several dates; the main differences are given in the text.
  - Most of the fighting in Morocco was done by Berber confederations, the Miknasa, the Maghrawa and Banu Ifran (both Zenata), and the Sanhaja of the central Maghreb, whose chiefs took titles and subsidies from one caliph or the other and switched sides more than once. Abd al-Rahman III took the title of caliph in 929, partly to answer the Fatimid claim.
