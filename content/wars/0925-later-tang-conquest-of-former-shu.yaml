id: later-tang-conquest-of-former-shu
name: Later Tang conquest of Former Shu
start: "925-10"
end: "925-12-18"
tier: C
summary: "The campaign in which the Later Tang, newly master of northern China, conquered the Former Shu kingdom in Sichuan in little more than two months at the end of 925. Li Cunxu (Emperor Zhuangzong) gave the nominal command to his son Li Jiji and the real command to his chief of staff Guo Chongtao. The Shu emperor Wang Yan, son of the founder Wang Jian, had paid little heed to the threat and was touring his realm when the invasion came. The Later Tang army marched south from Fengxiang over the Qinling, defeated the Shu forces sent against it and took the passes and the frontier towns as their garrisons surrendered. In Chengdu the general Wang Zongbi, Wang Yan’s adoptive brother, seized the palace and the treasury and surrendered the realm, and Wang Yan submitted in December 925. Shu, with its large population and wealth, became part of the Later Tang. The victory brought little lasting gain: in 926 the emperor had Guo Chongtao and Wang Yan’s family killed, risings spread through the army, and Li Cunxu himself was killed in Luoyang. Sichuan broke away again under Meng Zhixiang, who founded the Later Shu in 934."
