  - title: Dongdan
    date: 926–936
    when: "926-09-06"
    borders: "926-09-06"
    countries: [cn, kp, ru]
    body:
      - Within a month Abaoji made Balhae a client kingdom, Dongdan (in Khitan Dan gur, “the Dan country”), with Yelü Bei as its king, its own officials and the Balhae royal family still in high places, and its capital at Huhan, renamed Tianfu. Resistance went on in parts of the country. Abaoji stayed four months and then started home, but fell ill at Fuyu and died there on 6 September 926. A brother of the Balhae king then tried to retake Fuyu, without success.
      - Yelü Deguang, not Yelü Bei, succeeded his father. Seeing his elder brother as a rival, he ordered the capital of Dongdan and its people moved to Liaoyang in 929, and Liao settlers and garrisons were sent into the former Balhae lands; the region east of the Songhua was largely abandoned to the Jurchen tribes. Yelü Bei fled by sea to the Later Tang in 930, and Dongdan was absorbed into the Liao, in most accounts in 936. Large numbers of Balhae people, according to Goryeo records over 100,000 in all, moved to Goryeo, where the last crown prince, Dae Gwanghyeon, was received in 934. Others were resettled across the Liao empire, and Balhae nobles in the east kept a separate state, Jeongan (Ding’an), until the late 10th century.
