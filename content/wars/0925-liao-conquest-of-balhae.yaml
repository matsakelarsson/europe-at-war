notes:
  - Balhae is known as Bohai in Chinese and Parhae or Balhae in Korean. Whether it was a Korean, a Mohe (Tungusic) or a mixed state is disputed between Korean, Chinese, Russian and Japanese historians.
  - The site of Fuyu (Buyeo) prefecture is debated; it is often placed near today’s Nong’an in Jilin. When Dongdan was finally absorbed into the Liao is also disputed; most accounts give 936, some 982.
