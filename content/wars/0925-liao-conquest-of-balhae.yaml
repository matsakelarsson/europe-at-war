id: liao-conquest-of-balhae
name: Liao conquest of Balhae
start: "925-12"
end: "926-09-06"
tier: B
summary: "The Khitan campaign that destroyed Balhae (Bohai, Parhae), the kingdom that had ruled Manchuria, the Russian Far East and north-eastern Korea since about 698. The Khitan ruler Abaoji (Emperor Taizu of Liao) had fought Balhae over the Liao River valley since the 900s. At the end of 925 he marched east with his sons Yelü Bei and Yelü Deguang. In February 926 his army took the western stronghold of Fuyu after a three-day siege, defeated the Balhae army and besieged the capital Huhan (the Upper Capital, near today’s Ning’an), whose king Da Yinzhuan surrendered after three days. Abaoji turned Balhae into a client kingdom, Dongdan (“Eastern Dan”), under Yelü Bei, and died at Fuyu on his way home on 6 September 926. Risings followed in the conquered lands. In 929 the Liao moved Dongdan’s capital and much of its people west to Liaoyang, and the kingdom was absorbed into the Liao in the 930s. Tens of thousands of Balhae families fled to Goryeo, among them the last crown prince."
countries: [cn, kp, ru]
sides:
  - id: liao
    name: Khitans (Liao)
    polities: [liao]
    ink: blue
    moves: Khitan moves
    success: Khitan success
  - id: bh
