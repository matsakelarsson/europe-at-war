steps:
  - title: Fuyu and Huhan
    date: December 925 – March 926
    when: "926-02"
    borders: "926-02-01"
    countries: [cn, kp, ru]
    body:
      - The Khitans and Balhae had been rivals since Abaoji took the Liao River basin in the 900s, and in 924 Balhae attacked the Khitans. Having secured his western flank with a campaign into the Mongolian steppe in 924–925, Abaoji set out from his Supreme Capital at the end of 925, taking his sons Yelü Bei and Yelü Deguang. Balhae was weakened by the defection of nobles and people to Goryeo, and Silla is said to have sent help to the Khitans.
      - In February 926 the Khitans besieged Fuyu, the Balhae stronghold facing the steppe, and took it after three days. Six days later they defeated the Balhae army and besieged the capital, Huhan (Sanggyeong, the Upper Capital) on the Mudan River. After three days the last king, Da Yinzhuan (Dae Inseon), came out and surrendered.
    facts:
      - [Fuyu taken, "February 926, after three days"]
      - [Surrender of Huhan, "February 926"]
