id: croatian-bulgarian-war
name: Croatian–Bulgarian war
start: "926"
end: "927"
tier: C
summary: A short war between Simeon I of Bulgaria and King Tomislav of Croatia. After annexing Serbia in 924, Simeon regarded Croatia, which sheltered Serbian exiles and was allied to Byzantium, as a threat to his rear, and in 926 he sent an army under Alogobotur against it. The Croats destroyed it in the mountains of eastern Bosnia, in what is called the battle of the Bosnian Highlands. Papal envoys led by Bishop Madalbert arranged a peace after Simeon’s death in 927, with no change of borders.
