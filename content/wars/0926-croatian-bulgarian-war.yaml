notes:
  - The only accounts are Byzantine, in Constantine VII’s De administrando imperio and Theophanes Continuatus. The battlefield is unknown, and the date of 27 May 926 found in some modern works is uncertain. Constantine VII’s figures for the Croatian army (100,000 foot and 60,000 horse) are generally thought greatly exaggerated.
  - Simeon’s wider war with Byzantium is told in the Byzantine–Bulgarian war of 913–927.
