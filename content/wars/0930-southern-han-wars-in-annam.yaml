id: southern-han-wars-in-annam
name: Southern Han invasions of Tĩnh Hải and the battle of Bạch Đằng
start: "0930"
end: "0939"
tier: B
summary: "Two attempts by the Southern Han, the kingdom founded at Guangzhou in 917, to take the old Tang circuit of Tĩnh Hải (Jinghai), the Red River plain of today’s northern Vietnam, which local governors of the Khúc family had ruled since about 905. In 930 a Southern Han army took Đại La (Hanoi) and carried off the governor Khúc Thừa Mỹ, but in 931 Dương Đình Nghệ, a Khúc general from Ái Châu (Thanh Hóa), drove out the garrison and killed the relief commander. When Dương Đình Nghệ was murdered in 937 by his officer Kiều Công Tiễn, his son-in-law Ngô Quyền marched north to avenge him, and Kiều Công Tiễn called in the Southern Han. Ngô Quyền killed him before help arrived, then trapped the Southern Han fleet of Liu Hongcao on iron-tipped stakes in the estuary of the Bạch Đằng in late 938; the prince and about half his men died. In 939 Ngô Quyền proclaimed himself king at Cổ Loa. Vietnamese history counts the battle as the end of a thousand years of Chinese rule."
countries: [vn, cn]
