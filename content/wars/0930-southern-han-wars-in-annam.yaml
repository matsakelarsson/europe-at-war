notes:
  - Chinese records (the Zizhi Tongjian and the histories of the Five Dynasties) date the Southern Han capture of Đại La to 930; some Vietnamese accounts place it several years earlier. Both traditions date Dương Đình Nghệ’s rising to 931, his murder to the third lunar month of 937 and the battle of Bạch Đằng to the winter of 938. The day of the battle is not known.
  - Chinese names are in pinyin with the Vietnamese reading in brackets where Vietnamese books use it (Liu Hongcao, Lưu Hoằng Tháo; Li Jin, Lý Tiến; Cheng Bao, Trình Bảo). Some sources write Dương Diên Nghệ for Dương Đình Nghệ, from a similar-looking character.
  - Vietnamese tradition counts three battles on the Bạch Đằng, in 938, 981 and 1288 (see the Song–Đại Cồ Việt war and the Mongol invasions of Đại Việt). The base map shows Tĩnh Hải until Ngô Quyền’s proclamation in 939.
