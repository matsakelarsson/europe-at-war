  - title: Ngô Quyền and the stakes of Bạch Đằng
    date: 937–939
    when: "0938"
    borders: "0938-12-01"
    countries: [vn, cn]
    body:
      - In the third lunar month of 937 Dương Đình Nghệ was murdered by one of his officers, Kiều Công Tiễn, a notable from Phong Châu (in today’s Phú Thọ) and by one account his adopted son, who took the title of governor for himself. Ngô Quyền raised the men of Ái Châu and marched north to avenge his father-in-law. Kiều Công Tiễn asked Liu Yan for help. Liu Yan named his son Liu Hongcao (Lưu Hoằng Tháo) King of Jiao and governor of Tĩnh Hải and sent him with a fleet, while he himself followed with a second army and waited on the coast at Haimen. Before the fleet arrived, in late 938, Ngô Quyền took Đại La and had Kiều Công Tiễn killed.
      - Ngô Quyền expected the fleet to come in by the Bạch Đằng, the estuary that leads from the Gulf of Tonkin into the delta, and had large stakes with iron points driven into the riverbed at its mouth, where the high tide covered them. When the Southern Han ships entered on the rising tide, light Vietnamese boats engaged them and fell back upstream, drawing them on. As the tide ebbed the Vietnamese turned and attacked, and the Southern Han ships, trying to escape to the sea, were caught and held fast on the stakes. More than half of the Southern Han soldiers were killed or drowned, Liu Hongcao among them. When the news reached Liu Yan, the Chinese account says, he wept, gathered what was left of his forces and returned to Guangzhou.
      - In the spring of 939 Ngô Quyền gave up the title of governor, proclaimed himself king and made his capital at Cổ Loa, the citadel of the ancient kingdom of Âu Lạc north of the Red River. The Southern Han never tried again; the Song conquered it in 971. Ngô Quyền died in 944, and his realm broke up among rival families and local lords until Đinh Bộ Lĩnh reunited it in 968, but no Chinese government ruled the delta again until the Ming conquest of 1407. Vietnamese histories since the 13th century have treated the battle as the moment the country regained its independence.
