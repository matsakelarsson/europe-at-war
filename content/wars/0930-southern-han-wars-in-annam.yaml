steps:
  - title: Dương Đình Nghệ retakes Đại La
    date: 930–931
    when: "0930"
    borders: "0931-06-01"
    countries: [vn, cn]
    body:
      - After the Tang lost its grip on the far south, the Khúc family governed Tĩnh Hải, the circuit around the Red River plain, from about 905 as its military governors, recognised first by the Tang and then by the Later Liang. Liu Yan, who proclaimed the kingdom of Han (the Southern Han) at Guangzhou in 917, regarded the circuit as part of his realm, and was angered when Khúc Thừa Mỹ sought his titles from the Later Liang instead. In 930 his generals Liang Kezhen and Li Shouyong took Đại La, the walled seat of the governors on the site of today’s Hanoi, and sent Khúc Thừa Mỹ to Guangzhou as a prisoner. Li Jin (Lý Tiến) was left to hold the province with a garrison.
      - In Ái Châu, the coastal plain of today’s Thanh Hóa, a former Khúc general, Dương Đình Nghệ, had raised a band of 3,000 men whom he treated as his adopted sons. In 931 he marched north and laid siege to Đại La. Li Jin, who according to the Chinese account had taken his bribes and kept silent, fled back to Guangzhou, where Liu Yan had him executed. The relief army under Cheng Bao (Trình Bảo) arrived after the city had fallen; it besieged Dương Đình Nghệ in Đại La, and when he came out to fight, Cheng Bao was defeated and killed. Dương Đình Nghệ took the title of military governor, and the Southern Han left him alone for the rest of his life. He gave command of Ái Châu to his son-in-law, Ngô Quyền.
    facts:
      - [Đại La taken by the Southern Han, "930"]
