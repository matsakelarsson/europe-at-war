id: ziyarid-buyid-wars
name: Ziyarid–Buyid wars
start: "932"
end: "1012"
tier: C
summary: The intermittent wars between the Ziyarids, a dynasty from Gilan founded by Mardavij in 931, and the Buyids, his former officers, over the Jibal, Tabaristan and Gorgan. After Mardavij’s murder in 935 the Buyid Hasan (Rukn al-Dawla) fought his brother and successor Vushmgir, taking Isfahan for good in 940 and Rayy in 943. Vushmgir held on to Gorgan and Tabaristan with the help of the Samanids, and the provinces changed hands repeatedly until a Samanid–Buyid treaty in 955; fighting broke out again before Vushmgir was killed by a boar while hunting in 967. In 980 his son Qabus sheltered the Buyid prince Fakhr al-Dawla and refused to give him up, and the Buyids conquered Gorgan and Tabaristan. Qabus spent eighteen years in exile in Samanid Khorasan. After Fakhr al-Dawla’s death in 997 he regained Gorgan in 998 and ruled until 1012, when his own officers deposed him; he died in captivity.
