  - title: Baghdad
    date: 945–946
    when: "945-12-19"
    borders: "946-08"
    countries: [iq]
    body:
      - In 945, after Tuzun’s death, Ahmad invaded Iraq again, joined by the caliph’s officer Yanal Kushah, and on 19 December 945 he entered Baghdad without a fight. The caliph al-Mustakfi made him amir al-umara and gave the three brothers their honorific titles, Imad al-Dawla, Rukn al-Dawla and Mu’izz al-Dawla. In January 946 Ahmad had al-Mustakfi blinded and deposed, and put al-Muti’ in his place.
      - Nasir al-Dawla, the Hamdanid ruler of Mosul, then marched south, and on 15 April 946 he took western Baghdad. For about three months the Tigris divided the city between the two armies. On 1 August Buyid troops crossed the river and took the eastern side, the Hamdanids withdrew, and peace was made at Ukbara. The Abbasid caliphs stayed in Baghdad as religious figureheads under Buyid rule until the Seljuk Tughril entered the city in 1055.
    facts:
      - [Ahmad enters Baghdad, "19 December 945"]
      - [Al-Mustakfi deposed, "January 946"]
      - [Hamdanids driven out, "1 August 946"]
