notes:
  - The brothers are known by the honorific titles the caliph gave them in 945, Imad al-Dawla (Ali), Rukn al-Dawla (Hasan) and Mu’izz al-Dawla (Ahmad), “pillar”, “support” and “strengthener of the state”. The family is also called the Buwayhids.
  - The Buyids were Shi’a, but they kept the Sunni Abbasid caliphs as the source of legitimate authority. The dates of the early campaigns in Fars differ by a year among the sources.
