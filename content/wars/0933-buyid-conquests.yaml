steps:
  - title: Ali ibn Buya takes Fars
    date: 932–935
    when: "934"
    borders: "934-06"
    countries: [ir]
    body:
      - The Buyids were three brothers, Ali, Hasan and Ahmad, sons of a fisherman named Buya from Daylam, the mountain country south-west of the Caspian whose foot soldiers served in armies across Iran and Iraq. They rose as officers of Daylamite warlords, first Makan ibn Kaki and then the Ziyarid Mardavij, who had made himself master of northern and central Iran in 930–931. Mardavij gave Ali the town of Karaj in the Jibal in 932, but Ali soon broke with him and, with a few hundred Daylamites, made for Fars, which the caliph’s governor Yaqut held.
      - Ali took Arrajan, on the border of Fars and Khuzestan, in 933 and wintered there. In 934 he defeated Yaqut after a series of battles and in May or June entered Shiraz, which became the Buyid capital. The caliph confirmed him as governor in return for a tribute that was never paid. In January 935 Mardavij was murdered in Isfahan by his own Turkish soldiers, and the Buyids were rid of their most dangerous rival.
    facts:
      - [Arrajan taken, "933"]
      - [Shiraz entered, "May or June 934"]
      - [Mardavij murdered, "January 935"]
