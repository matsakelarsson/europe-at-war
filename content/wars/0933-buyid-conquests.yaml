  - title: Isfahan, Rayy and Khuzestan
    date: 935–944
    when: "943"
    borders: "943"
    countries: [ir, iq]
    body:
      - After Mardavij’s death the brothers divided the work. Hasan fought Mardavij’s brother and successor Vushmgir for the Jibal. Isfahan changed hands several times before Hasan took it for good in 940, and in 943 he took Rayy, which became his capital. Ahmad, the youngest, was sent to Kerman in 935–936, where he was badly wounded and failed to hold the province, and then to Khuzestan. There the Baridi brothers, tax farmers turned warlords, were fighting the caliph’s commanders for control of Iraq.
      - In Baghdad the caliphs had become the puppets of military strongmen who from 936 took the title amir al-umara, “commander of commanders”, among them Ibn Ra’iq, the Hamdanid Nasir al-Dawla of Mosul and the Turk Tuzun. In 944 Ahmad took Wasit, but he fell back to Ahvaz in July when Tuzun broke the bridge on the road to Baghdad.
    facts:
      - [Isfahan taken for good, "940"]
      - [Rayy taken, "943"]
      - [Wasit taken and given up, "944"]
