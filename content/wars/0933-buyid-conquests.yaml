id: buyid-conquests
name: Buyid conquests
start: "933"
end: "946-08"
tier: B
summary: The rise of the Buyids, three brothers from Daylam south of the Caspian Sea who began as officers of Daylamite warlords and within twelve years ruled western Iran and Iraq. Ali ibn Buya took Fars in 934, his brother Hasan won the Jibal from the Ziyarids with Isfahan and Rayy, and the youngest, Ahmad, took Khuzestan and in December 945 entered Baghdad, where he deposed the caliph and made his successors figureheads under Buyid protection. A Hamdanid attempt to take Baghdad from him failed in 946.
countries: [ir, iq]
