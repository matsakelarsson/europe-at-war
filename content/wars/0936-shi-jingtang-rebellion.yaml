notes:
  - Chinese historians long condemned Shi Jingtang as the “son-emperor” who sold the frontier to the Khitans; the cession left the North China Plain open to horsemen from the north for centuries, and recovering the prefectures was a goal of the Later Zhou and Song.
  - The Khitan state took the dynastic name Great Liao in 947; it is called Liao here throughout.
