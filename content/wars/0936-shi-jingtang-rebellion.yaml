  - title: The fall of the Later Tang
    date: December 936 – 938
    when: "937-01-11"
    borders: "937-01-11"
    countries: [cn]
    body:
      - A Later Tang relief army under Zhao Dejun, governor of Lulong at Youzhou, came up but stopped short of Jin’an while Zhao bargained secretly with the Khitans to be made emperor himself. Sang Weihan persuaded Deguang to keep his word to Shi. At Jin’an the starving soldiers’ deputy commander, Yang Guangyuan, killed Zhang Jingda and surrendered the army. The Khitan and Jin forces then routed Zhao Dejun at Tuanbo valley, and Zhao fled to Luzhou and surrendered.
      - Deguang stayed at Luzhou, saying the Chinese would fear his horsemen, and let Shi march on alone. In Luoyang Li Congke saw that all was lost, and on 11 January 937 he burned himself to death in a tower of the palace with his family and the empress dowager. Shi entered the city unopposed and soon moved his capital to Daliang (Kaifeng).
      - In 938 Shi formally handed over the Sixteen Prefectures, the band of land along the mountains from Youzhou to Yunzhou with the forts and passes that guarded the plain, and agreed to send the Liao a large amount of silk every year. The Liao made Youzhou their Southern Capital. Shi treated Deguang as his overlord until his death in 942.
    facts:
      - [Battle of Tuanbo valley, "December 936"]
      - [Death of Li Congke, "11 January 937"]
      - [Cession of the Sixteen Prefectures, "938"]
