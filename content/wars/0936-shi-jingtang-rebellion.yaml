steps:
  - title: Taiyuan and the Khitan alliance
    date: June – November 936
    when: "936-11-28"
    borders: "936-11-28"
    countries: [cn]
    body:
      - Shi Jingtang and Li Congke had been rival officers under the emperor Li Siyuan, and when Li Congke seized the throne in 934 Shi, governor of Hedong at Taiyuan, built up money and troops there. In the summer of 936 Li Congke ordered him transferred to Tianping in Shandong. On the advice of his officers Liu Zhiyuan and Sang Weihan, Shi refused, called Li Congke an adopted son with no right to the throne and demanded that he abdicate. Li Congke stripped him of his offices, executed his sons and brother at Luoyang, and sent Zhang Jingda to besiege Taiyuan, which Liu Zhiyuan defended.
      - Shi had Sang Weihan write to the Khitan emperor Yelü Deguang, offering to call himself his son, though he was ten years older, and to cede all of Lulong circuit and the northern prefectures of Hedong if Deguang made him emperor. Deguang came south through the passes of northern Shanxi in the autumn with about 50,000 horsemen, though he gave out that he had 300,000, defeated Zhang Jingda’s army before Taiyuan and surrounded what was left of it in the camp at Jin’an. On 28 November 936, while the siege went on, he invested Shi Jingtang as emperor of Jin.
    facts:
      - [Shi Jingtang refuses his transfer, "summer 936"]
      - [Khitan army, "about 50,000 horsemen"]
      - [Shi invested as emperor, "28 November 936"]
