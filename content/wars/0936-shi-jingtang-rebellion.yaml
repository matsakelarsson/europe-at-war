id: shi-jingtang-rebellion
name: Shi Jingtang’s revolt
start: "936-06"
end: "937-01-11"
tier: B
summary: "The revolt of Shi Jingtang, the Shatuo governor of Hedong at Taiyuan, against his brother-in-law Li Congke, emperor of the Later Tang, which he won with the help of the Khitan (Liao) emperor at the price of the Sixteen Prefectures. When Li Congke ordered him moved from Taiyuan in the summer of 936, Shi refused and called on him to abdicate. Besieged in Taiyuan by an imperial army under Zhang Jingda, he asked the Khitan emperor Yelü Deguang (Taizong) for help, promising to treat him as a father and to cede the prefectures along the northern frontier. Deguang came through the passes with about 50,000 horsemen in the autumn, defeated Zhang and trapped the rest of his army at Jin’an, and on 28 November 936 invested Shi as emperor of a new Jin dynasty, the Later Jin. The trapped army surrendered, the relief army of Zhao Dejun was routed at Tuanbo valley, and as Shi advanced on Luoyang Li Congke burned himself to death with his family on 11 January 937. In 938 Shi handed over the Sixteen Prefectures, from Youzhou (Beijing) to Yunzhou (Datong), with the passes that guarded the North China Plain, and promised the Liao a large amount of silk every year."
