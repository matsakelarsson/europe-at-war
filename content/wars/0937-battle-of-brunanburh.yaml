id: battle-of-brunanburh
name: Battle of Brunanburh
start: "937"
end: "937"
tier: C
summary: A battle in 937 in which King Æthelstan of England and his brother Edmund defeated an alliance of Olaf Guthfrithson, king of Dublin, Constantine II of Alba and Owain of Strathclyde, who had joined forces to break Æthelstan’s overlordship of Britain after his invasion of Scotland in 934. A poem in the Anglo-Saxon Chronicle celebrates the slaughter, telling of five young kings and seven of Olaf’s earls killed, as well as Constantine’s son. Olaf fled back to Dublin and Constantine to Scotland, and the victory secured the unity of the English kingdom, although Olaf took York after Æthelstan’s death in 939.
countries: [gb, ie]
