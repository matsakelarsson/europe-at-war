  - title: Sumitomo on the Inland Sea
    date: 939–941
    when: "941"
    borders: "941"
    countries: [jp]
    body:
      - Fujiwara no Sumitomo belonged to a minor branch of the great Fujiwara family and served as a junior official of Iyo province on Shikoku, where in the 930s he took part in the suppression of raiders on the Inland Sea. Many of the men who had been settled along the coast for that task were, like him, soldiers and minor officials who felt cheated by the governors sent from the capital, and by 939 Sumitomo had become their leader, with a base on the island of Hiburi off western Iyo. In the twelfth month of 939 one of his men, Fujiwara no Fumimoto, attacked the governor of Bizen on the road at Suki in Settsu. The court tried to buy Sumitomo off with court rank, but in the second month of 940 his men raided the armoury of Awaji, and fires broke out in the capital.
      - "Once Masakado was dead, the court turned on Sumitomo. In the eighth month of 940 he sailed with a fleet said to number 400 ships, burned the provincial headquarters of Sanuki and attacked Iyo, burned more than a hundred government ships of Bizen and Bingo and plundered Nagato; in the following months he raided the mint of Suō and the coast of Tosa. In the second month of 941 one of his lieutenants, Fujiwara no Tsunetoshi, went over to the court, and the government forces took Hiburi. Sumitomo sailed west and seized the Dazaifu, the government headquarters of Kyushu."
      - "In the fifth month of 941 Ono no Yoshifuru arrived with an army by land and Ōkura no Harumi by sea. Sumitomo burned the Dazaifu and met the government fleet in Hakata Bay, where he was defeated and lost more than 800 ships. He escaped in a small boat to Iyo, where he was captured by Tachibana no Tōyasu in the sixth month and died in prison. The commanders who defeated him, among them Minamoto no Tsunemoto, founder of the Seiwa Genji, gained rank and offices, and the Ōkura family became leading warriors of northern Kyushu."
