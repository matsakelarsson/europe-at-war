id: johei-tengyo-rebellion
name: Jōhei–Tengyō rebellion
start: "939"
end: "941"
tier: B
summary: "Two risings that broke out at almost the same time at opposite ends of Japan and shook the court in Heian-kyō: that of Taira no Masakado in the Kantō plain and that of Fujiwara no Sumitomo on the Inland Sea. Masakado, a grandson of an imperial prince who had settled in the east, won a long feud with his uncles in the 930s. In the eleventh month of 939 he took the side of a local strongman against the governor of Hitachi and seized the provincial headquarters, and within weeks he had driven the governors out of the eight Kantō provinces, appointed his own and taken the title Shinnō, “new emperor”. He was killed in battle by his cousin Taira no Sadamori and Fujiwara no Hidesato on 25 March 940. Sumitomo, a former provincial official of Iyo who had been sent to suppress raiders on the Inland Sea, became the leader of armed men of the coast and from the end of 939 attacked officials, provincial offices and granaries from Settsu to Tosa. In 941 he seized and burned the Dazaifu in Kyushu, but his fleet was destroyed in Hakata Bay, and he was captured in Iyo and died in prison. The court won both wars only by rewarding the provincial warriors who fought for it, which is why historians see the rebellion as the moment when the warrior class came of age."
