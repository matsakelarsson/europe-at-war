notes:
  - "The rebellion is named after the era names Jōhei (931–938) and Tengyō (938–947); Japanese historians now often call it the Tengyō rebellion, since Masakado’s fighting in the Jōhei years was a private feud that the court did not treat as rebellion. The rumour at court that Masakado and Sumitomo had plotted together, later told as a legend of an oath on Mount Hiei, has no support in the sources."
  - Most of what is known about Masakado comes from the Shōmonki, a war tale written soon after his death that is partly sympathetic to him. Dates are months of the Japanese lunar calendar; the eleventh and twelfth months of Tengyō 2, called 939 here as in most accounts, fell in the first weeks of 940 by the Julian calendar.
  - Masakado was later worshipped as a protector of the east; his head mound stands in the Ōtemachi business district of Tokyo, and he is one of the deities of the Kanda Shrine.
