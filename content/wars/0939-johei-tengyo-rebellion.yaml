steps:
  - title: Masakado, the “new emperor” of the Kantō
    date: 939–940
    when: "940"
    borders: "940"
    countries: [jp]
    body:
      - "Masakado’s grandfather, Prince Takamochi, had been given the surname Taira and sent east as a provincial official at the end of the ninth century, and his sons became landholders and warrior chiefs in the Kantō. From 935 Masakado fought a series of private wars with his uncles and their in-laws, killing his uncle Taira no Kunika and defeating Taira no Yoshikane. In 939 he took in Fujiwara no Haruaki, a man of Hitachi wanted by the governor for refusing to pay taxes and seizing government stores. When the governor, Fujiwara no Korechika, demanded his surrender, Masakado marched on the provincial headquarters with about a thousand men in the eleventh month, defeated a force of 3,000, and forced Korechika to hand over the provincial seals; his men plundered the town."
      - "Urged on by Prince Okiyo, a former official of Musashi, Masakado now went further. In the twelfth month he occupied the provincial headquarters of Shimotsuke and Kōzuke, and the other governors of the Kantō fled. He appointed his brothers and followers as governors of eight provinces and, on the word of a shrine medium, called himself Shinnō, “new emperor”, though his own letter to his former patron, the regent Fujiwara no Tadahira, protested his loyalty. The court made Fujiwara no Tadafumi general of an eastern expedition and promised rank and land to whoever killed Masakado."
      - "The war was decided before the court’s army arrived. Masakado had just sent most of his men home when his cousin Taira no Sadamori, whose father he had killed, and Fujiwara no Hidesato, the police commander of Shimotsuke, raised 4,000 men. On the 13th day of the second month they burned Masakado’s base at Iwai, and the next day, 25 March 940, they fought him with his last 400 men. The wind first favoured Masakado’s archers and then turned; he was struck by an arrow and killed. His head was displayed in the capital, his brothers and chief followers were hunted down, and Hidesato and Sadamori were rewarded with court rank and governorships."
