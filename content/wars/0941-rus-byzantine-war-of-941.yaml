id: rus-byzantine-war-of-941
name: Rus’–Byzantine War of 941
start: "941-06"
end: "944"
tier: B
summary: A raid on Constantinople by the fleet of Prince Igor of Kiev, which was burned with Greek fire at the mouth of the Bosporus in June 941. The survivors plundered the Asian coast for months before their last boats were destroyed off Thrace. A second expedition in 944 was bought off, and a treaty restored trade between Kiev and the empire on stricter terms.
countries: [tr, ua, ru]
sides:
  - id: rus
    name: Kievan Rus’
    polities: [kievan-rus]
    ink: brown
    moves: Rus’ moves
    success: Rus’ success
  - id: byz
    name: Byzantine Empire
    polities: [byzantium]
    ink: purple
    moves: Byzantine moves
    success: Byzantine success
notes:
  - The main accounts are the Byzantine chronicle of Theophanes Continuatus, Liudprand of Cremona, whose stepfather saw the Rus’ prisoners executed in Constantinople, and the Rus’ Primary Chronicle, compiled about 1113, which preserves the text of the treaty. Their figures for the Rus’ fleet, from about 1,000 ships (Liudprand) to 10,000, are far too high to trust.
  - The treaty is dated 944 or 945. Hieron was a customs post at the Black Sea entrance of the Bosporus, near today’s Anadolu Kavağı.
