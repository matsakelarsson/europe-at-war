      - kind: event
        side: rus
        name: Nicomedia
        date: Summer 941
        text: The Rus’ raided the coasts and countryside of Bithynia as far as this city, looting churches and monasteries.
        lonlat: [29.92, 40.77]
      - kind: naval
        side: byz
        name: Off the Thracian coast
        date: September 941
        text: Theophanes’ fleet intercepted the Rus’ as they crossed back towards Thrace and destroyed most of their boats. The exact place is not recorded.
        lonlat: [28.5, 41.35]
        lp: l
      - kind: treaty
        name: Treaty of 944/945
        date: 944 or 945
        text: Igor swore to the treaty in Kiev by the god Perun, and his Christian followers in the church of Saint Elias. Rus’ merchants needed the prince’s letters, entered Constantinople unarmed in groups of fifty and could not winter there.
        lonlat: [30.523, 50.45]
