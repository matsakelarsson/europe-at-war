steps:
  - title: Igor’s fleet and the Greek fire
    date: 941–944
    when: "941-06"
    borders: "944"
    countries: [tr, ua, ru]
    body:
      - "In 941 Igor, prince of Kiev, sent a great fleet of boats down the Dnieper and across the Black Sea. The Bulgarians sent warning, but the Byzantine navy was away fighting the Arabs and the army was on the eastern frontier. The Emperor Romanos I had fifteen old warships fitted with tubes for Greek fire and sent them out under the protovestiarios Theophanes. On 11 June, near Hieron at the mouth of the Bosporus, the Rus’ surrounded the ships to capture them and were met with fire. Liudprand of Cremona writes that men leapt into the sea to escape the flames and sank under their armour."
      - "The survivors landed on the Asian shore and for months plundered Bithynia and Paphlagonia as far as Nicomedia; the chroniclers describe captives crucified and nailed to the ground. Bardas Phokas and then John Kourkouas, recalled with the army of the east, hemmed them in. In September, as the Rus’ tried to slip home, Theophanes’ fleet caught them off the Thracian coast and burned most of their boats; prisoners were beheaded in Constantinople. In 944 Igor came again with Rus’ and Pecheneg allies, but Romanos sent envoys with gifts to meet him on the Danube. In the treaty that followed, Rus’ merchants were let back into Constantinople, but on stricter terms than before."
    facts:
      - [Battle off Hieron, "11 June 941, Byzantine victory"]
      - [Byzantine commanders, "Theophanes the protovestiarios, Bardas Phokas, John Kourkouas"]
      - [Treaty, "944 or 945, preserved in the Primary Chronicle"]
    markers:
