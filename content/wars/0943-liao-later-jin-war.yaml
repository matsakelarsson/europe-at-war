id: liao-later-jin-war
name: Liao–Later Jin war
start: "943"
end: "947-05-18"
tier: A
summary: "The war in which the Khitan Liao empire destroyed the Later Jin, the dynasty it had put on the throne of northern China in 936. Shi Jingtang’s nephew and successor Shi Chonggui, urged on by his minister Jing Yanguang, refused to call himself the Liao emperor’s subject, arrested the Liao trade envoy and killed Khitan merchants. The Liao emperor Yelü Deguang (Taizong) invaded in 944 and again in the winter of 944–945, reaching the Yellow River, but his armies were held at Majiakou and Qicheng and in 945 were routed at Yangcheng, where the emperor is said to have escaped on a camel. In 946 the Jin court sent almost its whole army north under Du Chongwei to retake the Sixteen Prefectures; surrounded by Deguang on the Hutuo River, Du surrendered it in the hope of being made emperor himself. Deguang entered the undefended capital Daliang (Kaifeng) early in 947, sent Shi Chonggui into exile and ruled as emperor of China, but the plundering of his troops set off risings everywhere. Liu Zhiyuan, governor at Taiyuan, proclaimed himself emperor (the Later Han), and Deguang withdrew north and died on the way, on 18 May 947."
countries: [cn]
sides:
  - id: liao
    name: Liao (Khitans)
    polities: [liao]
    ink: blue
    moves: Liao moves
    success: Liao success
  - id: jin
