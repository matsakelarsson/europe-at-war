  - title: The invasion of 944
    date: January – April 944
    when: "944-03"
    borders: "944-03-01"
    countries: [cn]
    body:
      - Early in 944 Deguang invaded with Zhao Yanshou in the vanguard. The Liao took Beizhou in southern Hebei and gathered around Yedu (Weizhou), the great city of the former Weibo circuit. Shi Chonggui’s envoys could not even get through the Liao lines. He named Jing Yanguang to oversee the defence and went to the front himself. A second Liao army under Yelü Andu, sent against Hedong, was beaten back by its governor Liu Zhiyuan.
      - Yang Guangyuan, the governor of Pinglu in Shandong, rebelled in league with the Liao. The prefect of Bozhou surrendered his town and encouraged the Liao to cross the Yellow River at Majiakou to join Yang, but the Jin army fought them at the crossing and stopped them. At Qicheng near the river three Jin generals were surrounded; when Jing refused to relieve them, the emperor led the relief himself, and afterwards removed Jing from command and gave it to Sang Weihan. The two emperors faced each other near Yedu but did not give battle, and in the spring the Liao withdrew, plundering Hebei as they went. Yang Guangyuan was besieged in Qingzhou, and at the end of 944 his son arrested him and surrendered.
    facts:
      - [Beizhou taken, "early 944"]
      - [Crossing at Majiakou stopped, "944"]
      - [Liao withdrawal, "spring 944"]
