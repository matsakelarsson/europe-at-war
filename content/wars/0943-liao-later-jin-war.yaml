  - title: Yangcheng
    date: winter 944 – spring 945
    when: "945-04"
    borders: "945-04-01"
    countries: [cn]
    body:
      - In the winter of 944 Deguang came again. Shi Chonggui fell ill, and his generals, after first trying to cut the Liao off, fell back to Yedu, so that the Liao plundered their way across Hebei almost unopposed. In the spring of 945 they withdrew, and Du Wei (Du Chongwei), the emperor’s uncle by marriage, and Li Shouzhen followed them across the frontier and took the prefectures of Qi and Tai.
      - The Liao army turned back and surrounded the Jin army near Yangcheng, south of today’s Baoding, cutting it off from water. Du Wei hesitated, but when a strong north-east wind rose, Fu Yanqing, Yao Yuanfu, Zhang Yanze, Huangfu Yu and Li Shouzhen led their men out against the wind in a fierce attack. The Liao army broke and fled. According to the Chinese histories Deguang escaped first in a cart and then on a camel, and back at Youzhou he had his chieftains caned for the defeat.
      - Both sides were exhausted. The border districts of Hebei had been laid waste, the Khitans had lost many men and horses, and the empress dowager Shulü and Sang Weihan both urged peace. In the summer of 945 Shi Chonggui sent an envoy to apologise, but Deguang demanded that Sang Weihan and Jing Yanguang come to him in person and that the Hebei circuits of Chengde and Yiwu be ceded, and the talks broke off.
    facts:
      - [Qi and Tai taken by the Jin, "spring 945"]
      - [Battle of Yangcheng, "spring 945"]
