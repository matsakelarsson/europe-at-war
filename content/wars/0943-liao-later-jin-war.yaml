  - title: Risings and the Later Han
    date: March – May 947
    when: "947-05-18"
    borders: "947-05-18"
    countries: [cn]
    body:
      - The risings began at Shanzhou on the Yellow River, where the garrison killed the Liao-appointed deputy governor, and spread through the circuits and among the peasants. In March 947 Liu Zhiyuan proclaimed himself emperor at Taiyuan, at first keeping the Jin era name, and many of the rebels pledged loyalty to him; his state became known as the Han, called by historians the Later Han. Deguang is reported to have said that he had not known the Chinese were so hard to rule.
      - In late spring Deguang left his brother-in-law Xiao Han in charge at Daliang and set out for the north with the leading officials of the Jin court, passing through towns his own army had laid waste. The Yellow River crossing at Heyang fell to the rebels behind him. He fell ill on the march and died at Luancheng, near Zhenzhou, on 18 May 947. The Liao kept the Sixteen Prefectures but gave up the rest of the plain. Xiao Han left Daliang, and in the summer Liu Zhiyuan marched in and made it his capital.
    facts:
      - [Liu Zhiyuan proclaimed emperor, "March 947"]
      - [Death of Deguang, "18 May 947, at Luancheng"]
      - [Liu Zhiyuan enters Daliang, "summer 947"]
