  - title: The surrender on the Hutuo
    date: autumn – December 946
    when: "946-12"
    borders: "946-12-01"
    countries: [cn]
    body:
      - In 946 a rumour spread that Zhao Yanshou wanted to come back to China. The Jin chiefs of staff Li Song and Feng Yu believed it and had Du Chongwei write to him. Zhao, on Deguang’s orders, answered asking for a large army to come and fetch him, and the Liao prefect of Yingzhou also pretended he would surrender. Sang Weihan, who might have warned against the plan, had been removed. Shi Chonggui gave Du Chongwei and Li Shouzhen almost the whole imperial army and ordered them north to retake the Sixteen Prefectures and destroy the Liao.
      - Deguang came south with a large army to meet them. The Jin army was held at the Hutuo River near Zhenzhou and then surrounded at Zhongdu bridge, its supplies cut. Deguang secretly promised Du Chongwei that he would make him emperor in Shi Chonggui’s place, and in December 946 Du and Li Shouzhen surrendered the army. Deguang had Zhao Yanshou put an imperial robe on Du in mockery, and then marched south with the surrendered generals.
    facts:
      - [Jin army surrenders, "December 946"]
