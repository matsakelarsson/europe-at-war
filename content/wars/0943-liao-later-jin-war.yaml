  - title: Emperor in Daliang
    date: January – March 947
    when: "947-02"
    borders: "947-02-01"
    countries: [cn]
    body:
      - With the army gone, Daliang could not be defended. The Jin general Zhang Yanze, who had gone over with Du, rode ahead to the capital, and Shi Chonggui, who had thought of burning himself to death, surrendered. Early in 947 Deguang entered the city. He broke his promises to Du Chongwei and Zhao Yanshou and took the title of emperor of China himself, made Shi Chonggui “the marquess who turned against righteousness” and sent him with his family into exile at Huanglong, deep in the former Balhae lands, where he lived until 974. The Khitan state took, or took again, the Chinese dynastic name Great Liao.
      - Almost all the Jin officials and governors submitted, but Deguang did not pay his army. He sent his horsemen into the countryside to feed themselves, which they called “threshing the grass seeds”; many people were killed, and the plain around Daliang and Luoyang was stripped of its wealth and animals. Money was also extorted from the officials and the towns. Liu Zhiyuan, the governor of Hedong at Taiyuan, made excuses not to come to Daliang and waited.
    facts:
      - [Shi Chonggui surrenders, "January 947"]
      - [Deguang enters Daliang, "early 947"]
