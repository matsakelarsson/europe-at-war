steps:
  - title: Grandson, not subject
    date: 942–943
    when: "943"
    borders: "943-06-01"
    countries: [cn]
    body:
      - Shi Jingtang, who owed his throne to the Khitans, died in 942 and was succeeded by his nephew and adopted son Shi Chonggui. The new emperor’s chief minister, Jing Yanguang, wanted to end the dependence on the north. Shi Chonggui did not report his accession to the Liao emperor Yelü Deguang as a vassal would, but wrote to him as an equal, calling himself grandson but not subject. When Deguang sent envoys to protest, Jing answered them insolently.
      - Jing then persuaded the emperor to arrest the Liao trade envoy Qiao Rong in Daliang, put Khitan merchants to death and seize their goods. In the Liao camp, Zhao Yanshou, a former Later Tang general who hoped to rule in Daliang himself, urged war, and Deguang resolved to invade. The Liao already held the Sixteen Prefectures ceded in 938, which gave them the passes and the city of Youzhou, their Southern Capital, at the edge of the plain.
    facts:
      - [Death of Shi Jingtang, "942"]
      - [Khitan merchants killed, "943"]
