notes:
  - The Khitan state took or revived the Chinese dynastic name Great Liao either in 938 or on the conquest of 947; it is called Liao here throughout.
  - Many of the Liao commanders were Han Chinese, among them Zhao Yanshou, a former Later Tang general who hoped to be made emperor in Daliang himself.
  - The site of Zhongdu bridge, where Du Chongwei surrendered, is placed on the Hutuo River near Zhenzhou (today’s Zhengding) by the Chinese accounts; some English accounts place it near Baoding.
