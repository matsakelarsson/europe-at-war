  - title: Sousse and the hidden death of al-Qa’im
    date: January – May 946
    when: "946-05"
    borders: "946-05-17"
    countries: [tn]
    view:
      center: [10.50, 35.70]
      size: [200, 180]
    body:
      - On 13 January 946 Abu Yazid laid siege to Sousse, the first regular siege of the war, with siege engines. The town held out for more than four months. On 16 or 17 May the caliph al-Qa’im died in al-Mahdiya. His son Isma’il kept his death secret, so that the rebels would not take heart, and governed in his father’s name, calling himself only the Sword of the Imam.
      - Isma’il’s first act was to save Sousse. On 26 May 946 the garrison sallied out while Kutama cavalry and troops landed from the sea fell on the besiegers, and Abu Yazid’s army broke and fled inland towards Kairouan.
    facts:
      - [Siege of Sousse, "13 January – 26 May 946"]
      - [Death of al-Qa’im, "16–17 May 946, kept secret"]
      - [Sousse relieved, "26 May 946, Fatimid victory"]
