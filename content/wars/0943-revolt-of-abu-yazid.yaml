  - title: Kairouan falls
    date: August – October 944
    when: "944-10"
    borders: "944-10-14"
    countries: [tn]
    body:
      - Al-Aribus (Laribus), the fortress that guarded the way into the Medjerda valley, surrendered on 7 August 944. In October Abu Yazid defeated the Fatimid commander Bushra near Béja, and the town was sacked for three days. The road to the capital of Ifriqiya lay open. On 13 October his men plundered the old Aghlabid palace city of Raqqada, and on 14 October Kairouan fell. Its garrison commander, Khalil ibn Ishaq al-Tamimi, and the chief qadi were taken and executed.
      - Many of the people of Kairouan, Maliki Sunnis who had suffered under Fatimid taxes and religious pressure, welcomed the rebels at first. The caliph al-Qa’im sent his eunuch general Maysur al-Fata against them with the main Fatimid army, but in a night attack on 29–30 October 944 the rebels destroyed it and killed Maysur. Sousse, the port north of al-Mahdiya, was sacked soon after. Within eight months of leaving the Aurès, Abu Yazid held almost all of Ifriqiya except the capital itself.
    facts:
      - [Al-Aribus (Laribus) surrenders, "7 August 944"]
      - [Raqqada plundered, "13 October 944"]
      - [Kairouan taken, "14 October 944"]
      - [Maysur’s army destroyed, "29–30 October 944"]
