  - title: The battle for Kairouan
    date: May – August 946
    when: "946-08"
    borders: "946-08-13"
    countries: [tn, dz, es]
    body:
      - When Abu Yazid came back from Sousse, the people of Kairouan shut their gates on him. Isma’il reached the city at the end of May, offered the townspeople an amnesty and camped outside the walls. Abu Yazid attacked the Fatimid camp on 5 June and was beaten back, and for two months the armies fought outside the city while his followers drifted away, until only the Hawwara and the Banu Kamlan stayed loyal. Al-Hasan ibn Ali brought up Kutama levies from Constantine, having retaken Béja and Tunis on the way.
      - On 13 August 946 the Fatimids stormed the rebel camp and Abu Yazid’s army broke and fled west. An Umayyad fleet sent by Abd al-Rahman III to help him had got as far as Ténès on the Algerian coast; when the news of the battle arrived, it turned back. Isma’il later built his new capital, al-Mansuriya, on the site of his camp.
    facts:
      - [Isma’il reaches Kairouan, "end of May 946"]
      - [Rebel camp stormed, "13 August 946, Fatimid victory"]
