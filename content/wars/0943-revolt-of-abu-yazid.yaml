notes:
  - The main sources are Fatimid, above all the memoirs of the court official Ja’far al-Hajib and the works of al-Qadi al-Nu’man, which are hostile to Abu Yazid and call him the “false Messiah”, and later Sunni chroniclers such as Ibn Idhari and Ibn Khaldun. The dates are the Gregorian equivalents given in the modern works cited. The rising began in the Hijri year 332 (943–944); the first attacks came in February 944.
  - "The Kharijites were the oldest dissenting movement in Islam, who held that any upright Muslim could lead the community. The Ibadis among them had ruled Tahert under the Rustamid imams until 909; the Nukkaris were an Ibadi branch that rejected the hereditary Rustamids and insisted on electing the leader. The people of Kairouan were mostly Maliki Sunnis, who resented the Ismaili Shi’ism of the Fatimids."
  - Al-Mahdiya, on a peninsula on the coast south-east of Kairouan, was the Fatimid palace city from 921; Raqqada was the old Aghlabid one near Kairouan. Al-Mansur’s new capital, al-Mansuriya (Sabra), was built in 948 on the site of his camp outside Kairouan.
