  - title: Tunis, Béja and the turn of Kairouan
    date: September 945 – January 946
    when: "945-11"
    borders: "945-11-01"
    countries: [tn, dz]
    body:
      - In the autumn of 945 the war spread across the north. Tunis and Béja rose against the rebels and changed hands more than once, and both towns were left in ruins. Abu Yazid’s son Ayyub beat a Fatimid army coming from M’Sila, but in November 945 the Fatimid general al-Hasan ibn Ali al-Kalbi defeated Ayyub, was beaten by him in turn and withdrew into the Kutama country of Lesser Kabylia and took the fortresses of Tijis and Baghaya behind the rebels’ backs.
      - In Kairouan Abu Yazid had taken to a life of luxury, until Abu Ammar rebuked him and he returned to his austere ways, which won back many of his Berber followers. But the townspeople had turned against him. Some made contact with the Fatimids, a plot to kill him was uncovered, and riots broke out over the abduction of local women and concubines by his soldiers. He promised to stop it and left the city, and the people freed many of the women by force.
    facts:
      - [Al-Hasan ibn Ali defeats Ayyub, "November 945"]
      - [Tunis and Béja, "taken and retaken, left in ruins"]
    markers:
