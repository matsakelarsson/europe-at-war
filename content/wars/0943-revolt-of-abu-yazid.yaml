id: revolt-of-abu-yazid
name: Revolt of Abu Yazid
start: "943"
end: "947-08-19"
tier: A
summary: "The great Kharijite rising against the Fatimid caliphs in Ifriqiya, led by Abu Yazid Makhlad ibn Kaydad, an Ibadi schoolmaster of the Nukkari school from the oases of the Djerid, called “the man on the donkey” after the animal he rode. Coming down from the Aurès mountains with the Hawwara Berbers early in 944, his followers took the fortress towns of the west, beat the Fatimid armies and in October 944 entered Kairouan, whose Sunni townspeople at first welcomed them. For eight months in 945 they blockaded the Fatimid capital, al-Mahdiya, and Abu Yazid recognised the Umayyad caliph of Córdoba. But his peasant army melted away, his men’s plunder and abductions turned the cities against him, and the siege of Sousse in 946 failed. The young caliph al-Mansur, who had kept his father’s death secret, broke the rebels outside Kairouan in August 946 and hunted Abu Yazid through the Zab and the Hodna mountains to the fortress of Kiyana, which he stormed on 14 August 947. Abu Yazid died of his wounds five days later; his stuffed skin was paraded through the towns. Militant Kharijism never again threatened the Maghreb, and the Fatimids went on to conquer Egypt."
countries: [tn, dz]
