steps:
  - title: The man on the donkey
    date: 928 – September 944
    when: "944-02"
    borders: "944-02-01"
    countries: [tn, dz]
    body:
      - Abu Yazid was the son of Kaydad, a Zenata Berber merchant of the trans-Saharan trade from Taqyus in the Djerid, the district of the salt lake Chott el Djerid; he was probably born south of the Sahara, at Tadmakka or Gao, to an African mother. Orphaned young, he earned his living as a schoolmaster around Tozeur and studied Ibadi doctrine at Tahert, where in 909 he saw the Kutama armies of the Fatimids overthrow the last Rustamid imam. From 928 he preached against the Fatimids, whose Ismaili doctrine, taxes and Kutama soldiers were resented by many Sunnis and Kharijites. Arrested in 934, he made the pilgrimage, was arrested again on his return in 937 and was freed by his blind teacher Abu Ammar with about forty armed men. He took refuge with the Hawwara Berbers of the Aurès mountains.
      - In February 944 his followers came down from the mountains and attacked the forts around Baghaya. The Kutama troops of the caliph al-Qa’im could not catch their small, fast-moving bands. Tébessa surrendered first, then Marmajanna, where Abu Yazid was given the donkey that earned him the name Sahib al-Himar, “the man on the donkey”; the Fatimids called him the false Messiah. Sbiba fell, and at Dougga a Kutama army was destroyed. Under the Nukkari principle that the community chooses its most worthy member, Abu Ammar deferred to his pupil as leader.
    facts:
      - [Rising begins, "February 944"]
      - [Abu Yazid’s first arrest, "934"]
      - [Base, "the Aurès mountains, with the Hawwara"]
