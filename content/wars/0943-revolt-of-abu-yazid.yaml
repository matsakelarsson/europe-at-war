  - title: Kiyana
    date: April – August 947
    when: "947-08"
    borders: "947-08-14"
    countries: [dz, tn]
    body:
      - Abu Yazid made his last stand in Kiyana, a mountain fortress in the Hodna range near where the Hammadids would later build their capital, the Qal’a. Isma’il laid siege to it on 26 April 947 with siege engines and took the nearby forts of Shakir and Aqqar in June. On 14 August the Fatimids breached the walls and stormed the fortress. Abu Ammar was killed; Abu Yazid tried to escape, fell into a ravine and was captured, badly wounded.
      - He was questioned by the caliph and died of his wounds on 19 August 947. His skin was salted and stuffed and paraded through the towns on a camel, and his head was displayed. That day Isma’il made his father’s death public and took the title al-Mansur bi-Nasr Allah, “the one made victorious by God’s help”. Abu Yazid’s son Fadl fought on until he was killed in 948, and his other sons died later in the Aurès. In 947 the Umayyads’ ally Hamid ibn Yasal seized Tahert, but the Fatimids took it back and he fled to al-Andalus.
      - The defeat of Abu Yazid was a turning point. The Fatimids recovered their hold on Ifriqiya and moved their court in 948 to al-Mansuriya, outside Kairouan; twenty years later they conquered Egypt. Militant Kharijism faded from the Maghreb, and the Ibadis survived in quieter communities, on Djerba, in the Mzab and Wargla and in the Nafusa mountains, where they still live.
