  - title: Pursuit to the Hodna
    date: October 946 – March 947
    when: "946-12"
    borders: "946-12-09"
    countries: [dz, tn]
    body:
      - On 24 October 946 Isma’il set out in pursuit with his army. By early December he had retaken Marmajanna, Billizma, Tobna and Biskra; the Zenata leader Muhammad ibn Khazar and the governor of M’Sila and the Zab submitted. On 9 December Abu Yazid made a stand at Maqqara and was defeated again; he fled across the desert to the Jabal Salat, west of the salt lake of the Hodna.
      - An eleven-day chase through the desert failed. Isma’il turned north, where Ziri ibn Manad, chief of the Sanhaja Berbers of the central Maghreb, came to the caliph’s camp and was richly rewarded, and a hard winter followed. Abu Yazid settled in Azbih, the ruins of a Byzantine fortress near M’Sila. When Isma’il, with 4,000 horsemen and 500 Sanhaja, found it deserted on 6 March 947, the rebels fell on his rearguard; they were beaten off, Abu Yazid was wounded and his son Yunus killed, and 1,070 severed heads were sent to Kairouan.
    facts:
      - [Pursuit begins, "24 October 946"]
      - [Battle of Maqqara, "9 December 946, Fatimid victory"]
      - [Fight at Azbih, "6 March 947"]
