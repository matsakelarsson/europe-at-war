  - title: The siege of al-Mahdiya
    date: January – September 945
    when: "945-01"
    borders: "945-01-20"
    countries: [tn, es]
    view:
      center: [10.55, 35.75]
      size: [260, 240]
    body:
      - Abu Yazid reached al-Mahdiya on 9 January 945. On 20 January his men stormed up to the wall of the palace city, the Fatimids’ fortified capital on its rocky peninsula, but were thrown back, and the assault became a blockade. The rebels captured grain ships that ran aground on the coast, but they could not close the sea, and the caliph al-Qa’im held out behind the walls. Most of Abu Yazid’s men were untrained peasants, many of whom went home to their fields or came only for plunder; Fatimid sorties sometimes found the rebel camp almost empty.
      - Abu Yazid looked for allies abroad. He sent notables of Kairouan as envoys to Córdoba and then his son Ayyub to pledge allegiance to the Umayyad caliph Abd al-Rahman III, the Fatimids’ great rival, who promised help. The blockade of al-Mahdiya broke on 16 September 945, when Arab troops from al-Aribus turned on the rebels during a battle with a Fatimid sortie, and Abu Yazid withdrew to Kairouan.
    facts:
      - [Rebels reach al-Mahdiya, "9 January 945"]
      - [Assault on the wall, "20 January 945"]
      - [Blockade broken, "16 September 945"]
