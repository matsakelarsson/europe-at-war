id: battle-of-takkolam
name: Battle of Takkolam
start: "949"
end: "949"
tier: C
summary: "The battle in which the Rashtrakuta emperor Krishna III defeated the army of the Chola king Parantaka I near Takkolam, in today’s Ranipet district of Tamil Nadu, in 949. Krishna III invaded the Chola country with his brother-in-law and vassal, the Western Ganga king Butuga II. The Chola army was led by the crown prince Rajaditya, who was killed on his war elephant; a Ganga inscription at Atakur says that Butuga shot him with an arrow, and the Cholas remembered him as the prince “who died on the elephant”. The Chola army broke, and the Rashtrakutas took Tondaimandalam, the northern Chola lands around Kanchipuram, which they held for about twenty years. Krishna III took the title “who took Kanchi and Tanjore”, and his inscriptions claim that he advanced as far as Rameswaram. The defeat set the Cholas back for a generation, until the rise of Rajaraja I after 985."
