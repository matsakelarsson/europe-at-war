notes:
  - The Southern Tang called its state Great Tang, claiming the succession of the Tang dynasty; after 958 it used the name Jiangnan. It is called Southern Tang here throughout.
  - The 959 campaign took two of the Sixteen Prefectures ceded to the Liao in 938, Mo and Ying, with the land south of the passes; the Song inherited them, but the rest of the prefectures stayed with the Liao until 1122.
