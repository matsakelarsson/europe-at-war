  - title: The northern expedition
    date: May – July 959
    when: "959-06"
    borders: "959-06-01"
    countries: [cn]
    body:
      - In the spring of 959 Chai Rong turned against the Liao, hoping to recover the Sixteen Prefectures ceded in 938. His army moved north through Hebei by river and road. The Liao emperor Muzong, absorbed in hunting and in plots at his court, was slow to respond. The Liao commanders of Ningzhou surrendered, then the frontier passes of Yijin, Waqiao and Yukou, then the prefectures of Mo and Ying, so that in a few weeks the Zhou took the land south of the passes almost without fighting.
      - Muzong now led a large army to his Southern Capital at Youzhou. Before the armies met, Chai Rong fell ill, and he turned back with the march on Youzhou abandoned. He died on 27 July 959, aged 38, leaving a six-year-old son. The new frontier ran along the Juma and Baigou rivers; the Zhou fortified the passes as Xiongzhou and Bazhou, and the Song kept this line until the 1120s. In early 960 Zhao Kuangyin, commander of the palace army, took the throne and founded the Song dynasty.
    facts:
      - [Mo and Ying surrender, "959"]
      - [Death of Chai Rong, "27 July 959"]
