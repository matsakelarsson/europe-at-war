id: later-zhou-conquest-of-huainan
name: Later Zhou campaigns against Southern Tang and Liao
start: "956-01"
end: "959-07-27"
tier: B
summary: "The wars of Chai Rong (Emperor Shizong of Later Zhou), the strongest ruler of the Five Dynasties, which set the stage for the Song reunification of China. Having beaten the Northern Han and the Liao at Gaoping in 954 and taken four prefectures from Later Shu in 955, he turned on the Southern Tang, the largest southern state, in early 956. His armies crossed the Huai on a pontoon bridge, crushed the Tang relief army at Zhengyang, and took Chuzhou and Yangzhou, with Zhao Kuangyin, the future founder of the Song, among the leading generals; Wuyue joined in from the south-east. The fortress of Shouzhou on the Huai held out for fourteen months until April 957, after the Tang relief army was destroyed at Purple Mountain. In 958 the Southern Tang ruler Li Jing ceded all his land north of the Yangtze, some quarter of a million households, gave up the title of emperor and became the vassal King of Jiangnan. In 959 Chai Rong marched north against the Liao and took the prefectures of Ning, Mo and Ying and the frontier passes south of Youzhou, but he fell ill before reaching the city and died on 27 July 959. Six months later Zhao Kuangyin took the throne."
