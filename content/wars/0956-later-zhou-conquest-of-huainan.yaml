  - title: Purple Mountain and Shouzhou
    date: winter 956 – April 958
    when: "957-04-23"
    borders: "958-05-01"
    countries: [cn]
    body:
      - By the spring of 957 Shouzhou was starving, but it still held, and many at the Zhou court wanted to give up the siege. The Tang army under Li Jingda gathered at Haozhou and built stockades on Purple Mountain near the city. The Tang general Zhu Yuan, distrusted by his own court, went over to the Zhou with more than 10,000 men. On 9 April 957 Chai Rong, back at the front, stormed the stockades; about 40,000 Tang soldiers were killed, and the generals Bian Hao, Xu Wenzhen and Yang Shouzhong were captured. On 23 April Shouzhou surrendered after fourteen months; Liu Renzhan, near death from illness, died soon after.
      - Through the winter of 957–958 the Zhou took the rest of Huainan and joined hands with Wuyue. In 958 Li Jing accepted the Zhou terms. He gave up all his land north of the Yangtze, with almost a quarter of a million households, renounced the title of emperor and called himself King of Jiangnan, and adopted the Zhou calendar as a vassal.
    facts:
