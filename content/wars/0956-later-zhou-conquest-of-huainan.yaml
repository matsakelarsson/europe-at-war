steps:
  - title: Across the Huai
    date: January – June 956
    when: "956-04-04"
    borders: "956-04-04"
    countries: [cn]
    body:
      - The minister Wang Pu had argued that the long Southern Tang frontier on the Huai was the easiest to break, and canals were dredged to bring the Zhou armies south quickly. The Tang had stopped posting winter guards on the north bank of the Huai to save money. In January 956 Li Gu crossed the river on a pontoon bridge at Zhengyang and laid siege to Shouzhou, the fortress that controlled traffic on the Huai, held by Liu Renzhan. When a Tang army of 20,000 under Liu Yanzhen came up the river with several hundred ships, Li Gu, fearing for his bridge, pulled back to the north bank.
      - Chai Rong arrived at Zhengyang on 5 March 956, replaced Li Gu with his cousin Li Chongjin, and turned on the Tang army as it advanced. Liu Yanzhen and more than 10,000 of his men were killed. Zhao Kuangyin lured the Tang flotilla on the Huai into a trap and captured the ships that became the first Zhou navy, then drove the Tang army from the Qingliu Pass and took Chuzhou. On 4 April a few hundred Zhou horsemen surprised Yangzhou, the Tang Eastern Capital, and its garrison fled. Wuyue, a vassal of the Zhou, attacked the Tang from the south-east, but its army was routed before Changzhou by Chai Kehong.
      - Li Jing sued for peace, offering to give up his imperial title and six prefectures, but Chai Rong wanted all the land north of the Yangtze. Tang counter-attacks retook several prefectures and briefly Yangzhou, until Zhao Kuangyin’s cavalry destroyed Li Jingda’s army west of the city. Chai Rong went back to Kaifeng in June, leaving his armies before Shouzhou.
    facts:
      - [Chai Rong at Zhengyang, "5 March 956"]
      - [Yangzhou taken, "4 April 956"]
