  - title: The fall of Chandax
    date: "961"
    when: "961-03-06"
    borders: "961-03-06"
    countries: [gr]
    body:
      - "The emir, Abd al-Aziz ibn Shu’ayb, appealed to the Ikhshidid ruler of Egypt and to the Fatimid caliph al-Mu’izz. The Fatimid promised a fleet, but nothing came in time. In March 961 Nikephoros attacked again. While the defenders were drawn to a battering ram, his miners dug beneath the walls, propped the tunnel with timber and set it on fire, and a great stretch of wall fell. On 6 March the Byzantines broke in, and the city was given over to plunder for three days."
      - "Many inhabitants were killed or enslaved, and the mosques and walls were torn down. The emir and his son al-Nu’man were taken to Constantinople, where Nikephoros celebrated a triumph. Crete became a province again, and missionaries such as Nikon the Metanoeite worked to convert the remaining Muslims. Al-Nu’man, baptised as Anemas, later died fighting for the empire against the Rus’ at Dorostolon. Nikephoros went on to campaign in Cilicia and Syria and took the throne in 963."
    facts:
      - [Chandax stormed, 6 March 961]
      - [Captives, "Emir Abd al-Aziz ibn Shu’ayb and his son al-Nu’man"]
      - [Afterwards, "Crete Byzantine until the Fourth Crusade (1204)"]
    markers:
      - kind: taken
        side: byz
        name: Chandax
        date: 6 March 961
        text: Miners brought down part of the wall and the Byzantines stormed the city. It was sacked for three days.
        lonlat: [25.134, 35.34]
      - kind: event
        side: byz
        name: Triumph in Constantinople
        date: "961"
        text: Nikephoros paraded the emir, his family and the spoils of Chandax through the capital.
        lonlat: [28.975, 41.01]
