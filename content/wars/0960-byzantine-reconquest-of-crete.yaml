    name: Byzantine Empire
    polities: [byzantium]
    ink: purple
    moves: Byzantine moves
    success: Byzantine success
  - id: cr
    name: Emirate of Crete
    polities: [emirate-of-crete]
    ink: olive
    moves: Cretan moves
    success: Cretan success
notes:
  - The main accounts are by Byzantine writers, above all Leo the Deacon, with a verse poem on the conquest by Theodosios the Deacon. Their figures for the armies, such as Leo’s 40,000 men in the Cretan relief force, are not reliable.
  - The city fell on 6 March 961 in most accounts; some give 7 March. Chandax is today’s Heraklion.
  - The Arab conquest of the island is told in the Arab conquest of Crete.
