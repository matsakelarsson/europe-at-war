id: byzantine-reconquest-of-crete
name: Byzantine reconquest of Crete
start: "960"
end: "961-03-06"
tier: B
summary: The expedition in which the Byzantine general Nikephoros Phokas, the future emperor, landed on Crete in 960 and after a winter siege stormed Chandax (Heraklion), the capital of the emirate that had raided the Aegean for more than a century. Crete became a Byzantine province again.
countries: [gr]
