steps:
  - title: The armada and the siege
    date: "960"
    when: "960-07"
    borders: "960-12"
    countries: [gr, tr]
    body:
      - "Raiders from Crete had plundered the coasts and islands of the Aegean for over a century, and in 904 a Syrian fleet that used the island as a base had sacked Thessalonica. Byzantine expeditions to retake it failed in 911 and 949. Constantine VII prepared another, and his son Romanos II gave the command to the Domestic of the Schools, Nikephoros Phokas. The fleet, with dromons carrying Greek fire and transports fitted with ramps for horses, sailed in June or July 960 and landed near Chandax."
      - "Nikephoros scattered the Cretan army on the beach, but Chandax had earthen walls wide enough for two wagons to pass on top and a double moat, and his first attempt to storm it failed. He built a fortified camp, and the fleet blockaded the harbour. A foraging party under Nikephoros Pastilas was ambushed and destroyed in the hills. Nikephoros then surprised a relief army at night, cut off the heads of the dead and threw some into the city with catapults. A second assault failed too, and he settled down to starve the city over the winter while his engineers built heavier siege engines."
    facts:
      - [Commander, "Nikephoros Phokas, Domestic of the Schools"]
      - [Sailed, June or July 960]
      - [Emir of Crete, "Abd al-Aziz ibn Shu’ayb"]
