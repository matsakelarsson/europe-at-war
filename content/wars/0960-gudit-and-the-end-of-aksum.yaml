id: gudit-and-the-end-of-aksum
name: Gudit and the end of Aksum
start: "0960"
end: "0980"
tier: C
summary: "The tradition of a queen who destroyed the last Christian kingdom of Aksum in the second half of the 10th century. Ethiopian tradition calls her Gudit or Yodit (Judith) and remembers her as a non-Christian, in some versions Jewish, who burned the churches of Aksum, sacked the monastery of Debre Damo, killed the princes of the royal house and ruled for about forty years. Two outside sources seem to speak of her. The Arab geographer Ibn Hawqal, writing between about 943 and 977, says that a woman had ruled the land of the Habasha for many years, had killed their king, called the hadani, and still held her own country. The History of the Patriarchs of Alexandria tells of a king of Abyssinia who wrote to King George II of Makuria, in the time of Patriarch Philotheos (979–1003), that a queen of the Bani al-Hamwiya had ravaged his country, burned its churches and driven him from place to place, and asked him to obtain a new bishop. Who she was is not known. Scholars have proposed a queen of Damot, a non-Christian kingdom in the south (Carlo Conti Rossini), a Cushitic-speaking queen from the Lake Hayq region (Tekeste Negash) and a convert to Judaism; Steven Kaplan and others doubt that she was Jewish. The sources are few, late and contradictory, and the identification of the Arab writers’ queen with the Gudit of tradition is not certain. Most historians agree that Aksum’s power ended in this period and that the Zagwe dynasty rose in Lasta in the next century and a half."
