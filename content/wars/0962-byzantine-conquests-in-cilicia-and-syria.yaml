id: byzantine-conquests-in-cilicia-and-syria
name: Byzantine conquests in Cilicia and Syria
start: "962"
end: "975"
tier: B
summary: The campaigns in which Nikephoros Phokas, general and then emperor, sacked Aleppo, the capital of the Hamdanid emir Sayf al-Dawla, in 962, conquered Cilicia with Tarsus and Mopsuestia in 965 while his fleet took Cyprus, and in 969 recovered Antioch, lost to the Arabs more than three centuries before. His successor John I Tzimiskes led raids deep into Syria and Palestine in 974–975.
countries: [tr, sy, cy, lb, il]
