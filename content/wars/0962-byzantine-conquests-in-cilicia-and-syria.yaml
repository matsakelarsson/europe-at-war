  - title: Antioch and Tzimiskes’ campaigns
    date: 968–975
    when: "968"
    borders: "970-01"
    countries: [tr, sy, lb, il]
    body:
      - "Sayf al-Dawla died in 967, and his realm fell into revolt. In late 968 Nikephoros raided Syria as far as Tripoli, and before going home he built a fort at Baghras in the Amanus mountains, from which Michael Bourtzes and the eunuch general Peter were to blockade Antioch. Against orders, Bourtzes bribed a defender and seized a tower by night; on 28 October 969 Peter came up and the city fell. A few weeks later Nikephoros was murdered by Tzimiskes. Under the treaty of Safar, made in the winter of 969–970, Aleppo became a Byzantine tributary, and a Fatimid siege of Antioch in 971 failed."
      - "In 974 Tzimiskes, now emperor, raided Upper Mesopotamia. In 975 he marched south from Antioch: Emesa and Baalbek fell, Damascus paid tribute, and he went on to Tiberias, Nazareth and Caesarea. He wrote to King Ashot III of Armenia that only fear of the Fatimids kept him from Jerusalem; historians disagree how far to trust the letter. On the way back he took Beirut but failed before Tripoli. He died in January 976, and most of his conquests south of Antioch were soon lost."
    facts:
      - [Antioch taken, 28 October 969]
      - [Treaty of Safar, "Winter 969–970; Aleppo a Byzantine tributary"]
      - [Tzimiskes in Syria, "975: Emesa, Baalbek, Damascus, Tiberias, Beirut"]
    markers:
      - kind: event
        side: byz
        name: Baghras
        date: "968"
        text: Nikephoros built this fort guarding the Syrian Gates over the Amanus, as a base for the blockade of Antioch.
        lonlat: [36.23, 36.4]
        lp: l
      - kind: taken
        side: byz
        name: Antioch
        date: 28 October 969
        text: Michael Bourtzes took a section of wall at night and the stratopedarches Peter stormed the city. It stayed Byzantine until 1084.
        lonlat: [36.182, 36.205]
        lp: l
      - kind: treaty
        name: Treaty of Safar
        date: Winter 969–970
        text: Aleppo’s ruler, Qarghuya, agreed to pay tribute, let the emperor name future emirs and bar other Muslim armies from passing through.
        lonlat: [37.16, 36.2]
      - kind: taken
        side: byz
        name: Baalbek
        date: "975"
        text: Tzimiskes took the city on his march into southern Syria. Damascus, close by, chose to pay tribute.
        lonlat: [36.207, 34.006]
      - kind: event
        side: byz
        name: Tiberias
        date: "975"
        text: The southernmost point of Tzimiskes’ campaign, according to his letter to Ashot III, along with Nazareth and Caesarea.
        lonlat: [35.533, 32.794]
      - kind: taken
        side: byz
        name: Beirut
        date: "975"
        text: Taken from its Fatimid garrison on the march back north along the coast.
        lonlat: [35.506, 33.898]
        lp: l
      - kind: held
        side: mus
        name: Tripoli
        date: 968 and 975
        text: The Fatimid-held port held out against both Nikephoros and Tzimiskes.
        lonlat: [35.84, 34.44]
        lp: l
    arrows:
