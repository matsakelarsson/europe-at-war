steps:
  - title: Aleppo
    date: 961–962
    when: "962"
    borders: "962-12-24"
    countries: [tr, sy]
    body:
      - "For twenty years Sayf al-Dawla, the Hamdanid emir of Aleppo, had led the Muslim holy war on the frontier, raiding Byzantine Asia Minor almost every year. In 960, while Nikephoros Phokas was away in Crete, his brother Leo ambushed the emir in the Taurus passes and destroyed his army. Back from Crete, Nikephoros took Anazarbus in Cilicia, emptied it of its people and pulled down its walls. In 962 he took Marash and Manbij, where he captured the emir’s cousin, the poet Abu Firas, securing the passes to the north of Aleppo."
      - "In December, when campaigning normally stopped, he marched on Aleppo with a large army. Sayf al-Dawla’s few troops were scattered and he fled. The Byzantines plundered his palace outside the walls and on 23 or 24 December stormed the city, which they sacked for over a week. The citadel held out, and in revenge for a nephew killed attacking it Nikephoros is said to have beheaded 1,200 prisoners. He withdrew with some 10,000 captives, mostly young men. Sayf al-Dawla returned to a half-empty city, and revolts troubled his last years."
    facts:
      - [Aleppo stormed, "23 or 24 December 962"]
      - [Hamdanid emir, "Sayf al-Dawla (r. 945–967)"]
      - [Byzantine commanders, "Nikephoros Phokas and John Tzimiskes"]
    markers:
      - kind: taken
        side: byz
        name: Anazarbus
        date: Late 961 or early 962
        text: Nikephoros took the Cilician city, killed or expelled its people and destroyed its walls, cutting Cilicia off from Syria.
        lonlat: [35.906, 37.264]
      - kind: taken
        side: byz
        name: Manbij
        date: November 962
        text: The last town north of Aleppo fell, and its governor, the poet Abu Firas al-Hamdani, spent years as a prisoner in Constantinople.
        lonlat: [37.955, 36.528]
      - kind: taken
        side: byz
        name: Aleppo
        date: December 962
        text: The city was sacked and its walls torn down, but its Daylamite garrison held the citadel.
        lonlat: [37.16, 36.2]
    arrows:
      - side: byz
        label: Nikephoros Phokas
        phase: 2
        via: [[35.9, 37.3], [36.6, 37.0], [36.95, 36.5], [37.12, 36.23]]
      - side: byz
        phase: 1
        via: [[36.9, 37.55], [37.5, 37.0], [37.93, 36.56]]
  - title: Tarsus, Mopsuestia and Cyprus
    date: 963–965
    when: "965"
    borders: "965-08-16"
    countries: [tr, cy]
    body:
      - "Nikephoros became emperor in August 963 and turned to Cilicia, the plain whose fortified cities, Tarsus above all, had been bases for raids into Asia Minor for two centuries. Tzimiskes beat the army of Tarsus near Adana, and in 964 Nikephoros took Adana and other towns but failed before Mopsuestia. In 965 he came back with a larger army. Mopsuestia was stormed on 13 July and its people enslaved. Tarsus, besieged and short of food, surrendered on 16 August on condition that its people could leave for Syria with what they could carry."
      - "Many Muslims left Cilicia, and Christians, many of them Armenians and Syrians, were settled in the emptied lands. Nikephoros carried the bronze gates of Tarsus and Mopsuestia to Constantinople as trophies. In the same year, or perhaps in 964, a fleet under Niketas Chalkoutzes took Cyprus, which had been shared between the empire and the Arabs since the late 7th century, and the whole island became a Byzantine province."
    facts:
      - [Mopsuestia stormed, 13 July 965]
      - [Tarsus surrendered, 16 August 965]
      - [Cyprus, "Annexed by Niketas Chalkoutzes, 965 (perhaps 964)"]
    markers:
      - kind: taken
        side: byz
        name: Adana
        date: "964"
        text: Tzimiskes had routed the army of Tarsus nearby, and the town fell to Nikephoros in his first Cilician campaign.
        lonlat: [35.321, 37.0]
      - kind: taken
        side: byz
        name: Mopsuestia
        date: 13 July 965
        text: The city on the Pyramus (Ceyhan) was stormed after a siege, and its people were enslaved.
        lonlat: [35.624, 36.958]
      - kind: taken
        side: byz
        name: Tarsus
        date: 16 August 965
        text: The great frontier city surrendered; its Muslim inhabitants were allowed to leave for Syria.
        lonlat: [34.895, 36.916]
        lp: l
      - kind: taken
        side: byz
        name: Cyprus
        date: "965"
        text: Niketas Chalkoutzes ended three centuries of shared rule and became the island’s first Byzantine governor. The sources give no details of the campaign.
        lonlat: [33.35, 35.15]
    arrows:
