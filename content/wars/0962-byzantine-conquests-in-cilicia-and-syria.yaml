    moves: Moves by other Muslim powers
    success: Success for other Muslim powers
notes:
  - The fullest accounts are Arabic (Yahya of Antioch, Ibn al-Adim’s history of Aleppo and others), with the Byzantine historians Leo the Deacon and John Skylitzes. Dates in Arabic sources follow the Islamic calendar and are sometimes uncertain by a year; Anazarbus fell in late 961 or early 962.
  - Cilicia’s cities, Tarsus above all, were frontier strongholds of the Muslim holy war, nominally under the Abbasid caliph and at times under the Hamdanids or the Ikhshidids of Egypt. Cyprus had been shared between the Byzantines and the Arabs since the late 7th century.
  - Mopsuestia is today’s Yakapınar near Adana, Anazarbus is Anavarza, and Antioch is Antakya.
