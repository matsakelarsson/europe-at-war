  - title: Taiyuan
    date: February – June 979
    when: "979-06"
    borders: "979-06-01"
    countries: [cn]
    body:
      - In early 979 Taizong led a great army against the Northern Han himself, with Pan Mei in command of the siege of Taiyuan. The Song generals blocked the roads from the north. When the Liao sent an army to relieve their ally, Guo Jin defeated it at the Baima Ridge in Shanxi; the Liao commander Yelü Dilie, a cousin of the Liao emperor, was killed.
      - Taiyuan, its walls and ditches strengthened over decades, held out for about two months under constant attack. In June 979 the Northern Han ruler Liu Jiyuan surrendered. Taizong had the old city of Jinyang burned and its people moved, and a new Taiyuan was built nearby. With the last of the Ten Kingdoms gone, he marched straight from Taiyuan against the Liao to recover the Sixteen Prefectures, a campaign that ended in defeat at the Gaoliang River weeks later.
    facts:
      - [Liao relief army defeated, "March 979"]
      - [Siege of Taiyuan, "about two months"]
      - [Liu Jiyuan surrenders, "June 979"]
