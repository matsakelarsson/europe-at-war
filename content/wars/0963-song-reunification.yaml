steps:
  - title: Jingnan and Hunan
    date: January – March 963
    when: "963-03"
    borders: "963-06-01"
    countries: [cn]
    body:
      - The first opening came in the middle Yangtze. When Zhou Xingfeng, the ruler of Hunan (the Wuping circuit), died in 962, his young son Zhou Baoquan faced a rebellion by the general Zhang Wenbiao and asked the Song for help. Taizu sent an army under Murong Yanzhao and Li Chuyun, which asked for passage through Jingnan (Nanping), the small state of the Gao family at Jiangling that lay on its road.
      - Instead of passing through, the Song army seized Jiangling, and its ruler Gao Jichong surrendered his three prefectures early in 963. The Song troops went on into Hunan. Zhang Wenbiao had already been defeated by Zhou Baoquan’s generals, who now resisted the Song, but they were beaten and Langzhou and Tanzhou (Changsha) were taken; Zhou Baoquan was captured and taken to Kaifeng. Within weeks the Song held the middle Yangtze, separating Sichuan from the Southern Tang and opening the way to the south.
    facts:
      - [Jingnan surrenders, "963"]
      - [Hunan taken, "963"]
