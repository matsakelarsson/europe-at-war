  - title: The Southern Tang
    date: October 974 – January 976
    when: "976-01-01"
    borders: "976-01-01"
    countries: [cn]
    body:
      - After losing Huainan in 958, the Southern Tang had become a vassal, calling itself Jiangnan. Its ruler Li Yu, better known as a poet than a statesman, sent tribute but refused repeated summonses to Kaifeng, pleading illness. A Tang defector, Fan Ruoshui, had already given the Song a survey of the Yangtze crossings, and on Song prompting Li Yu had executed his best general, Lin Renzhao.
      - In the autumn of 974 Cao Bin led the Song army and fleet down the Yangtze from Jiangling, with Pan Mei under him. At Caishi, on Fan Ruoshui’s plan, the Song built a pontoon bridge of boats across the Yangtze, and the army crossed to the south bank. Wuyue attacked the Tang from the south-east and took Changzhou. From the spring of 975 the Song besieged Jinling.
      - The Tang held out for most of a year. A large relief fleet under Zhu Lingyun came down the river from Hukou, but was destroyed by fire in a battle on the Yangtze, according to the sources when the wind turned the Tang fire weapons back on their own ships. Jinling fell at the beginning of January 976. Cao Bin kept his troops from a massacre, and Li Yu was taken to Kaifeng with his family, where he was given the title “Marquess Who Disobeyed Orders”. He died there in 978.
    facts:
