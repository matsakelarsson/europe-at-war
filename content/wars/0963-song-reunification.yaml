  - title: The Later Shu
    date: December 964 – February 965
    when: "965-02"
    borders: "965-02-01"
    countries: [cn]
    body:
      - Meng Chang, emperor of the Later Shu in Sichuan for thirty years, ruled a rich and peaceful state with a weak army. In 964 his minister Wang Zhaoyuan persuaded him to send secret letters, hidden in wax pills, to the Northern Han proposing a joint attack on the Song. One of the messengers handed his letter to the Song, and Taizu had his reason for war.
      - In the winter of 964 the Song attacked with 60,000 men on two fronts. Wang Quanbin came down from Fengzhou in the north, broke the Shu defences on the road to the Jianmen Pass and captured Wang Zhaoyuan; Liu Guangyi, with Cao Bin, fought his way up the Yangtze gorges from Guizhou and took Kuizhou and the towns beyond. Meng Chang surrendered in early 965, within seventy days of the invasion. He was taken to Kaifeng and died there soon after.
      - The plundering of Wang Quanbin’s troops and the mistreatment of the surrendered Shu soldiers set off a great rising under Quan Shixiong, which took the Song about two years to put down. Cao Bin, who had kept his own men from looting, rose high in Taizu’s favour.
    facts:
