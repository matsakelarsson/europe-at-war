notes:
  - The plan of taking the south first is traditionally credited to Taizu and his minister Zhao Pu; historians debate how far it was a plan rather than a series of opportunities.
  - The Chinese year of the fall of Jinling is the eighth year of Kaibao, usually given as 975; by the Western calendar the city fell at the beginning of January 976.
