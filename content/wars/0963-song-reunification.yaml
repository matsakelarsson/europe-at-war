  - title: The Southern Han
    date: October 970 – March 971
    when: "971-02"
    borders: "971-03-01"
    countries: [cn]
    body:
      - Liu Chang, the last ruler of the Southern Han at Guangzhou, was remembered by the Song historians as cruel and extravagant, governing through eunuchs. In 970 Pan Mei, who had guarded the Hunan frontier against Southern Han raids for seven years, led the Song army south over the Nanling ranges. He defeated a Southern Han army of 10,000 at Fuchuan and took Hezhou; Zhaozhou, Guizhou (Guilin) and Lianzhou followed, and the prefectures along the West River surrendered.
      - Pan Mei then turned east, killed more than 10,000 enemy soldiers at Shaozhou and advanced to within 120 li of Guangzhou, where some 150,000 Southern Han soldiers had dug in behind bamboo stockades. On a windy night he sent several thousand men with torches against the stockades and set them ablaze, and tens of thousands died in the fire and the attack that followed. Liu Chang was captured in Guangzhou early in 971, five months after the campaign began.
    facts:
      - [Fuchuan and Hezhou, "970"]
      - [Liu Chang captured, "early 971"]
