  - title: Wuyue and Qingyuan
    date: 976–978
    when: "978-05"
    borders: "978-05-01"
    countries: [cn]
    body:
      - Taizu died suddenly in November 976 and was succeeded by his brother Zhao Guangyi (Taizong), in circumstances that later gave rise to suspicion. That year Taizu had again sent an army against the Northern Han, as he had in 968 and 969, when he tried and failed to take Taiyuan by flooding it with the waters of the Fen River; the 976 campaign was called off at his death.
      - The two states left in the south-east had been Song allies and vassals. In 978 Chen Hongjin, who ruled Quanzhou and Zhangzhou in southern Fujian as the Qingyuan circuit, surrendered his two prefectures. In May Qian Chu, king of Wuyue, who had come to Kaifeng to pay homage, handed over his kingdom of thirteen prefectures, centred on Hangzhou. Both rulers were given high titles and lived out their lives at the Song court, and Wuyue was spared the destruction of war.
    facts:
      - [Death of Taizu, "November 976"]
      - [Qian Chu surrenders Wuyue, "May 978"]
