id: song-reunification
name: Song reunification of China
start: "963"
end: "979-06"
tier: A
summary: "The wars in which the Song dynasty, founded in 960 by the Later Zhou general Zhao Kuangyin (Emperor Taizu), brought the southern kingdoms and the Northern Han under its rule and ended the division of China that had followed the fall of the Tang. Taizu followed a plan of “the south first, the north later”, taking the weaker southern states before turning on the stronger north: Jingnan and Hunan in 963, the Later Shu in Sichuan in 964–965, the Southern Han in the far south in 970–971, and the Southern Tang on the lower Yangtze in 974–976, whose capital Jinling fell after a siege of almost a year. His attacks on the Northern Han at Taiyuan, protected by the Liao, failed in 968–969 and 976. His brother and successor Zhao Guangyi (Emperor Taizong) received the peaceful surrender of Wuyue and the Qingyuan circuit in 978, and in 979 besieged Taiyuan, beat off a Liao relief army and took the surrender of the last Northern Han ruler, Liu Jiyuan. Except for the Sixteen Prefectures held by the Liao, the far north-west and the south-west beyond Sichuan, China was united again. The Song went straight on from Taiyuan to attack the Liao, starting the Song–Liao war."
countries: [cn]
