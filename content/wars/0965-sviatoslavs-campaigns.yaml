notes:
  - The main sources are the Rus’ Primary Chronicle, compiled in Kiev about 1113, and the Byzantine historians Leo the Deacon and John Skylitzes. They often disagree on dates. The Khazar campaign is dated anywhere from 965 to 969, and the first invasion of Bulgaria to 967 or 968.
  - Bulgarians, Pechenegs and Magyars fought against the Rus’ at some times and alongside them at others.
  - Dorostolon is today’s Silistra in Bulgaria, Philippopolis is Plovdiv, and Arcadiopolis is Lüleburgaz in Turkey. Pereyaslavets is thought to have stood near Nufăru in the Danube delta, in Romania.
