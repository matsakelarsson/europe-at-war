id: sviatoslavs-campaigns
name: Sviatoslav’s campaigns
start: "965"
end: "972"
tier: B
summary: The wars of Sviatoslav I of Kiev, who broke the power of the Khazar khaganate on the Don and the Volga, then invaded Bulgaria at Byzantium’s invitation and tried to keep it for himself. Defeated by the Byzantine emperor John I Tzimiskes at Dorostolon in 971, he was killed by the Pechenegs at the Dnieper rapids on his way home.
