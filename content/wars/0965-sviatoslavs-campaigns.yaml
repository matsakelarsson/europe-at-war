steps:
  - title: The fall of Khazaria
    date: c. 964–969
    when: "965"
    borders: "969"
    countries: [ru, ua]
    body:
      - "Sviatoslav, the son of Igor and Olga, took over the government of Kiev from his mother in the early 960s and spent the rest of his life at war. The Primary Chronicle says he travelled like his warriors, without tents or wagons, and warned his enemies with a short message: “I want to come at you.” He first made the Vyatichi on the Oka, who paid tribute to the Khazars, pay it to Kiev instead. Under the year 965 the chronicle says he defeated the Khazars and took their fortress on the Don, Sarkel, which the Rus’ called Belaya Vezha, the White Tower."
      - "The Arab geographer Ibn Hawqal wrote that the Rus’ sacked the Khazar capital Atil in the Volga delta, Samandar on the Caspian coast and Bulghar on the middle Volga, around 968–969. Many historians link these raids to Sviatoslav, although the order of events is disputed. The chronicle also tells of victories over the Alans and the Circassians of the north Caucasus. Sviatoslav did not try to rule the Khazar lands, but the khaganate, for two centuries the leading power of the steppe, never recovered, and the Pechenegs and other nomads took its place."
    facts:
      - [Sarkel taken, "965, according to the Primary Chronicle"]
      - [Atil sacked, "c. 965–969; its site has not been found for certain"]
      - [Prince of Kiev, "Sviatoslav I (c. 943–972)"]
    markers:
      - kind: taken
        side: rus
        name: Sarkel (Belaya Vezha)
        date: "965"
        text: The Khazars’ brick fortress on the lower Don, built with Byzantine help in the 830s. The Rus’ kept it as an outpost. Its ruins now lie under the Tsimlyansk Reservoir.
        lonlat: [42.273, 47.705]
      - kind: taken
        side: rus
        name: Atil
        date: c. 968–969
        text: The Khazar capital in the Volga delta was sacked and never recovered. Its exact site is unknown; the settlement found at Samosdelka is one candidate.
        lonlat: [47.84, 46.024]
    arrows:
      - side: rus
        label: Sviatoslav
        phase: 1
        via: [[30.6, 50.35], [35.5, 49.4], [39.5, 48.4], [42.1, 47.75]]
      - side: rus
        phase: 2
        via: [[42.45, 47.6], [44.8, 47.0], [47.7, 46.1]]
  - title: Pereyaslavets on the Danube
    date: 967/968–970
    when: "968"
    borders: "970"
    countries: [bg, ro, ua, tr]
    body:
      - "In 966 the Byzantine emperor Nikephoros II Phokas stopped paying the tribute promised to Bulgaria in 927. Rather than fight in the Bulgarian mountains, he paid Sviatoslav to attack from the north; his envoy, Kalokyros of Cherson, is said to have brought 1,500 pounds of gold. In August 967 or 968 the Rus’ sailed along the Black Sea coast, crossed the Danube, beat a Bulgarian army and overran the Dobruja. Sviatoslav settled at Pereyaslavets in the Danube delta. In 968 the Pechenegs besieged Kiev, and he hurried home to drive them off."
      - "His mother Olga died in 969. Sviatoslav set his sons over Kiev, the Drevlian land and Novgorod and returned to the Danube, saying, in the chronicle’s words, that Pereyaslavets would be the centre of his lands, where all good things flowed. He stormed the Bulgarian capital, Preslav, and kept Tsar Boris II as a figurehead. In early 970 his army of Rus’, Bulgarians, Pechenegs and Magyars crossed the Balkan Mountains and sacked Philippopolis, where Leo the Deacon says 20,000 people were impaled. Near Arcadiopolis in Thrace the Byzantine general Bardas Skleros drew the Pechenegs into an ambush and routed the invaders."
    facts:
      - [Paid by Byzantium, "1,500 pounds of gold, according to Leo the Deacon"]
      - [Preslav, "Taken by the Rus’ in 969"]
      - [Battle of Arcadiopolis, "Spring 970, Byzantine victory"]
    markers:
      - kind: battle
        side: rus
        name: Dorostolon
        date: August 967 or 968
        text: The Rus’ beat a Bulgarian army after crossing the Danube, and the Bulgarians withdrew into the fortress.
        lonlat: [27.261, 44.117]
        lp: l
      - kind: event
        side: rus
        name: Pereyaslavets
        date: 968–969
        text: Sviatoslav’s seat on the Danube, a trading town thought to have stood near today’s Nufăru in Romania.
        lonlat: [28.917, 45.15]
      - kind: held
        side: rus
        name: Siege of Kiev
        date: "968"
        text: The Pechenegs besieged the city, where Olga and Sviatoslav’s sons were. The chronicle says a small force under the voivode Pretich bluffed them into a truce, and Sviatoslav then drove them into the steppe.
        lonlat: [30.523, 50.45]
      - kind: taken
        side: rus
        name: Preslav
        date: "969"
        text: Sviatoslav stormed the Bulgarian capital and ruled through Tsar Boris II, who stayed there as his vassal.
        lonlat: [26.817, 43.167]
      - kind: taken
        side: rus
        name: Philippopolis
        date: Early 970
        text: The Rus’ stormed and sacked the city. Leo the Deacon writes that 20,000 surviving inhabitants were impaled.
        lonlat: [24.75, 42.15]
      - kind: battle
        side: byz
        name: Battle of Arcadiopolis
        date: Spring 970
        text: Bardas Skleros, with perhaps 10,000–12,000 men, lured the Pecheneg contingent into an ambush with a feigned retreat, and the rest of the Rus’ army fled north.
        lonlat: [27.357, 41.406]
