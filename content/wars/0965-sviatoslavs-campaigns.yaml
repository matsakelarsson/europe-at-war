  - title: Dorostolon and the Dnieper rapids
    date: 971–972
    when: "971-04"
    borders: "972"
    countries: [bg, ua, tr]
    body:
      - "John I Tzimiskes, who had murdered Nikephoros and taken the throne in December 969, first put down a revolt in Asia Minor. In the spring of 971 he marched north with perhaps 30,000–40,000 men, while a fleet carrying Greek fire sailed for the Danube. The passes through the Balkan Mountains were unguarded. Preslav was stormed on 13 April and Boris II was captured. Sviatoslav, who had some 300 Bulgarian nobles executed for fear of a rising, fell back to Dorostolon on the Danube, where the Byzantines besieged him by land and river."
      - "The siege lasted about three months, with several battles outside the walls. Starving and cut off, the Rus’ came to terms in late July. They gave up Bulgaria and their captives, swore never again to attack Byzantine lands, and were given food for the journey; Leo the Deacon describes Sviatoslav rowing his own boat to meet the emperor. Tzimiskes annexed eastern Bulgaria. The Rus’ wintered hungry at the mouth of the Dnieper. In the spring of 972, as they passed the rapids, the Pecheneg khan Kurya ambushed them and killed Sviatoslav, and the chronicle says he made a drinking cup of his skull."
    facts:
      - [Preslav stormed, "13 April 971"]
      - [Siege of Dorostolon, "April–July 971, about three months (65 days in some accounts)"]
      - [Death of Sviatoslav, "Spring 972, at the Dnieper rapids"]
    markers:
      - kind: taken
        side: byz
        name: Preslav
        date: 13 April 971
        text: The Byzantines stormed the Bulgarian capital and captured Boris II and his family. Tzimiskes renamed the city Ioannopolis after himself.
        lonlat: [26.817, 43.167]
      - kind: siege
        side: byz
        name: Siege of Dorostolon
        date: April – July 971
        text: The Byzantine army and fleet blockaded the Rus’ in the fortress. After a last, bloody battle in late July, Sviatoslav agreed to leave Bulgaria.
        lonlat: [27.261, 44.117]
      - kind: event
        name: Winter at the Dnieper mouth
        date: 971–972
        text: The Rus’ wintered at a place the chronicle calls Beloberezhye, probably near the Dnieper estuary, where famine set in.
        lonlat: [31.41, 46.6]
        lp: l
      - kind: battle
        side: pe
        name: Dnieper rapids
        date: Spring 972
        text: The Pechenegs ambushed Sviatoslav at the rapids, traditionally near the island of Khortytsia, and killed him with most of his men.
        lonlat: [35.1, 47.85]
