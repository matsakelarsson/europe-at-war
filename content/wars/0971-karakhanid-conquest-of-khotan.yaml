  - title: The fall of Khotan
    date: about 1000 – 1006
    when: "1006"
    borders: "1006-01-01"
    countries: [cn]
    body:
      - Yusuf Qadir Khan, a son of the Karakhanid ruler Hasan Bughra Khan, who held Kashgar, took up the war again. Later Muslim legends tell how four imams from Mada’in came to help him take Yarkand and Khotan, and how, after years of battles in which “blood flowed like the Oxus”, the Buddhists were driven back to Khotan and the imams were killed. By 1006 at the latest Yusuf Qadir Khan had conquered Khotan, and the kingdom ended. In 1009 the Song court received an embassy from the new Muslim rulers of Khotan.
      - The conquest was followed by the destruction of Buddhist temples and images. A short Turkic poem preserved in Mahmud al-Kashgari’s dictionary of the 1070s boasts of coming down on the cities like a flood and tearing down the idol temples. Some historians think that the monks of Dunhuang, alarmed by the fall of Khotan, sealed the Library Cave (Cave 17) of the Mogao Caves, where tens of thousands of manuscripts lay hidden until 1900; others suggest different reasons. Over the following century the people of the western Tarim Basin came to speak Turkic and became Muslim.
    facts:
      - [Fall of Khotan, "by 1006"]
      - [Muslim embassy from Khotan to the Song, "1009"]
