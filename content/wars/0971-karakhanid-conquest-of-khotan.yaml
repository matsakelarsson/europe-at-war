steps:
  - title: Kashgar and Khotan
    date: about 950 – 999
    when: "971"
    borders: "971-01-01"
    countries: [cn]
    body:
      - Satuq Bughra Khan, a Karakhanid prince who had become a Muslim, took Kashgar in the 930s or 940s, and he and his son Musa made the conversion of the Turks and the conquest of their non-Muslim neighbours a cause. The nearest of these was Khotan, a Buddhist kingdom on the southern edge of the Taklamakan Desert, whose king Viśa’ Saṃbhava (Li Shengtian) used the title of emperor and had married a daughter of Cao Yijin, the ruler of Dunhuang. A long war followed between the two oases; the Karakhanid prince Ali Arslan was said to have been killed by the Buddhists.
      - The war swung both ways. In about 970 Khotan took Kashgar, and in 971 a Khotanese monk, Jixiang, brought a letter from his king to the Song emperor Taizu, offering him a dancing elephant captured there. The Karakhanids soon retook the city. In 999 they put an end to the Samanid state in Transoxiana, and their growing power turned again against Khotan.
    facts:
      - [Conversion of Satuq Bughra Khan, "934"]
      - [Khotan takes Kashgar, "about 970"]
      - [Elephant offered to the Song, "971"]
