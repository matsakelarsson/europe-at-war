notes:
  - The dates of the war are poorly known. Muslim accounts of it survive mainly as legends written down centuries later, such as the Tazkirah of the Four Sacrificed Imams, and the Chinese sources record only Khotan’s embassies. The date 1006 is the latest by which Khotan had fallen.
  - The Khotanese spoke Khotanese Saka, an Iranian language; their kings took Chinese names and titles, claiming descent from the Tang imperial family.
