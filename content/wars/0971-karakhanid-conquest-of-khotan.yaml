id: karakhanid-conquest-of-khotan
name: Kara-Khanid conquest of Khotan
start: "970"
end: "1006"
tier: B
summary: "The long war between the Muslim Turkic Karakhanids of Kashgar and the Buddhist kingdom of Khotan, the last independent state of the old Iranian-speaking oasis peoples of the Tarim Basin. After the Karakhanid prince Satuq Bughra Khan converted to Islam in 934 and took Kashgar, he and his son Musa pressed on Khotan, and a war of raids and sieges followed between the two oases, some 500 km apart along the southern edge of the Taklamakan. Khotan, allied by marriage with the Cao rulers of Dunhuang and in contact with the Song court, took Kashgar for a time in about 970 and in 971 offered the Song emperor a dancing elephant captured there. The Karakhanids recovered, and sometime before or in 1006 Yusuf Qadir Khan of Kashgar conquered Khotan. The conquest ended Buddhism in Khotan and with it a thousand years of the kingdom’s history, and the western Tarim Basin became Turkic-speaking and Muslim. Much of what is known of the war comes from later Muslim legends and from Mahmud al-Kashgari’s dictionary of the 1070s."
