  - title: The settlement at Ohrid
    date: "1018"
    when: "1018-03"
    borders: "1018-12"
    countries: [mk, al, bg, gr, rs, hr, tr]
    body:
      - "In the spring of 1018 Basil marched west. Krakra surrendered Pernik and its neighbouring forts, and commanders and nobles came to his camp with the keys of their towns. At Ohrid Ivan Vladislav’s widow, Maria, gave herself up with her children and the treasury. His sons held out for a time on Mount Tomorr, and the last commanders surrendered or were captured within the year. Basil then went south through Thessaly to Athens, gave thanks in the Parthenon, then the church of the Mother of God, and celebrated a triumph in Constantinople in 1019."
      - "Basil’s settlement was mild by the standards of the war. The Bulgarian lands became the provinces of Bulgaria, with its seat at Skopje, Sirmium and, on the lower Danube, Paristrion. Taxes were still taken in kind, as under Samuel, and the church kept its own archbishop at Ohrid, a Bulgarian, appointed by the emperor. Many nobles received Byzantine titles and posts. The Serbs and Croats acknowledged Basil’s overlordship, and for the first time since the 7th century the empire’s border ran along the Danube."
    facts:
      - [Surrender at Ohrid, "1018"]
      - [New provinces, "Bulgaria (Skopje), Sirmium, Paristrion"]
      - [Archbishopric of Ohrid, "Self-governing church for the Bulgarian lands"]
    markers:
      - kind: treaty
        side: byz
        name: Surrender at Ohrid
        date: "1018"
        text: Maria, widow of Ivan Vladislav, surrendered Samuel’s capital, the royal family and the treasury to Basil.
        lonlat: [20.802, 41.117]
      - kind: event
        side: byz
        name: Pernik
        date: "1018"
        text: Krakra, who had twice held Pernik against Basil, surrendered it with some 35 forts and was made a patrikios.
        lonlat: [23.033, 42.6]
      - kind: event
        name: Mount Tomorr
        date: "1018"
        text: Ivan Vladislav’s eldest son, Presian, and two of his brothers took refuge on the mountain before surrendering.
        lonlat: [20.15, 40.7]
        lp: l
      - kind: event
        side: byz
        name: Skopje
        date: "1018"
        text: Seat of the governor of the new province of Bulgaria.
        lonlat: [21.433, 42.0]
      - kind: event
        side: byz
        name: Athens
        date: "1018"
        text: Basil gave thanks for his victory in the Parthenon, then a church of the Virgin, and gave it rich gifts.
        lonlat: [23.726, 37.971]
