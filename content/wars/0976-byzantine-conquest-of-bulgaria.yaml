steps:
  - title: The Cometopuli and the Gates of Trajan
    date: 976–986
    when: "976"
    borders: "986-08-17"
    countries: [bg, mk, gr]
    body:
      - "When John I Tzimiskes died in January 976, Byzantium held eastern Bulgaria, but the west had never been conquered. There four brothers, the sons of a count and so called the Cometopuli, rose against the empire; two were soon killed, and the youngest, Samuel, came to rule. Boris II and his brother Roman escaped from Constantinople, but Boris was killed at the frontier by a guard who took him for a Byzantine. Roman, who had been castrated in captivity, was proclaimed tsar, but Samuel held real power. While Basil II fought the rebel Bardas Skleros in Asia Minor, Samuel raided Greece and starved Larissa into surrender after years of blockade."
      - "In 986 Basil marched on Serdica through the pass known as the Gates of Trajan and besieged it for twenty days. The defenders sallied out, burned his siege engines and captured his draught animals, and he turned back. On 17 August, in the pass, the Bulgarians fell on his army and routed it. Basil barely escaped, and his baggage and treasury were lost. The historian Leo the Deacon, who was with the army, only just escaped himself."
    facts:
      - [Byzantine emperor, "Basil II (976–1025)"]
      - [Siege of Serdica, "July–August 986, 20 days"]
      - [Gates of Trajan, "17 August 986, Bulgarian victory"]
    markers:
      - kind: event
        side: bg
        name: Serres
        date: "976"
        text: Moses, one of the four Cometopuli brothers, was killed by a stone while besieging the town.
        lonlat: [23.55, 41.09]
      - kind: taken
        side: bg
        name: Larissa
        date: c. 983–986
        text: The key town of Thessaly fell to Samuel after a long blockade. He took the relics of its patron, Saint Achillius, to a new church on an island in Lake Prespa.
        lonlat: [22.417, 39.642]
      - kind: held
        side: bg
        name: Serdica (Sredets)
        date: July–August 986
        text: The Bulgarian garrison held out for twenty days and destroyed the Byzantine siege engines.
        lonlat: [23.33, 42.7]
      - kind: battle
        side: bg
        name: Battle of the Gates of Trajan
        date: 17 August 986
        text: The retreating army was ambushed in the pass near Ihtiman. Basil reached Philippopolis with a few of his guard.
        lonlat: [23.918, 42.356]
        lp: b
      - kind: event
        name: Prespa
        date: from the 980s
        text: Samuel’s seat, with his church of Saint Achillius on an island in the Small Prespa lake.
        lonlat: [21.1, 40.82]
        lp: l
    arrows:
      - side: byz
        label: Basil II, 986
        via: [[24.75, 42.15], [24.1, 42.3], [23.6, 42.55], [23.38, 42.68]]
      - side: byz
        via: [[23.42, 42.64], [23.7, 42.45], [23.9, 42.37]]
