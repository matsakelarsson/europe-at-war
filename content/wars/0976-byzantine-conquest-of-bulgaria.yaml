  - title: Kleidion
    date: "1014"
    when: "1014-07-29"
    borders: "1014-10-06"
    countries: [bg, mk, gr]
    body:
      - "In 1014 Samuel tried to stop Basil’s yearly invasion in the narrow valley of the Strumitsa at Kleidion, “the key”, where he built a thick wooden wall between the mountains of Belasitsa and Ograzhden. Basil’s attacks on the wall failed, and a Bulgarian force sent to distract him was beaten outside Thessalonica by its governor, Theophylact Botaneiates. Nikephoros Xiphias then led a detachment along mountain paths over Belasitsa, and on 29 July he fell on the Bulgarians from behind while Basil stormed the wall. Samuel escaped with the help of his son Gabriel Radomir."
      - "Skylitzes says Basil took 15,000 prisoners (Kekaumenos says 14,000), blinded ninety-nine of every hundred and left the hundredth one eye to lead the others home; modern historians think the numbers exaggerated but do not doubt the blinding. It may have been revenge for Botaneiates, killed soon afterwards in an ambush in a pass near Strumitsa. When the blinded men reached Prespa, Samuel collapsed at the sight and died on 6 October 1014."
    facts:
      - [Battle of Kleidion, "29 July 1014, Byzantine victory"]
      - [Prisoners blinded, "14,000 or 15,000 according to Byzantine writers; probably fewer"]
      - [Samuel’s death, 6 October 1014]
    markers:
      - kind: battle
        side: byz
        name: Battle of Kleidion
        date: 29 July 1014
        text: Samuel’s palisade across the Strumitsa valley was taken from behind by Nikephoros Xiphias. Thousands of Bulgarians were killed or captured.
        lonlat: [23.018, 41.363]
      - kind: battle
        side: byz
        name: Thessalonica
        date: July 1014
        text: Theophylact Botaneiates beat the Bulgarian force under Nestoritsa that Samuel had sent to draw Basil away.
        lonlat: [22.94, 40.64]
      - kind: battle
        side: bg
        name: Ambush near Strumitsa
        date: Summer 1014
        text: Botaneiates, sent to clear the passes towards Thessalonica, was trapped in a narrow valley and killed, reportedly by Gabriel Radomir himself. Basil gave up the siege of Strumitsa.
        lonlat: [22.64, 41.4]
        lp: l
      - kind: event
        name: Death of Samuel
        date: 6 October 1014
        text: Samuel died at Prespa after seeing his blinded soldiers. A grave identified as his was found in the church on the island of Saint Achillius in 1965.
        lonlat: [21.1, 40.82]
        lp: l
    arrows:
      - side: byz
        label: Basil II
        via: [[23.55, 41.1], [23.35, 41.3], [23.08, 41.37]]
      - side: byz
