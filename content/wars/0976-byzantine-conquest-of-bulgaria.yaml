id: byzantine-conquest-of-bulgaria
name: Byzantine conquest of Bulgaria
start: "976"
end: "1018"
tier: A
summary: The forty-year war in which the Byzantine emperor Basil II destroyed the western Bulgarian realm of Samuel, centred on Prespa and Ohrid. After a defeat at the Gates of Trajan in 986 and years of Bulgarian raids deep into Greece, the Byzantines won at the Spercheios in 997, took fortress after fortress from 1000 and broke Samuel’s army at Kleidion in 1014, blinding thousands of prisoners. The last Bulgarian leaders surrendered in 1018, and Bulgaria was ruled from Constantinople until 1185.
countries: [bg, mk, gr, al, rs, me, xk, ro, tr]
sides:
  - id: byz
    name: Byzantine Empire
    polities: [byzantium]
    ink: purple
    moves: Byzantine moves
    success: Byzantine success
  - id: bg
    name: Bulgaria
    polities: [bulgaria]
    ink: green
    moves: Bulgarian moves
    success: Bulgarian success
notes:
  - The main source is John Skylitzes, who wrote in the late 11th century; Leo the Deacon, who was at the Gates of Trajan, Yahya of Antioch and the Armenian Stepanos Taronetsi add details. Their chronologies often disagree, so several dates here are given as alternatives (the Spercheios 996 or 997, Vidin 1002 or 1003, Skopje 1003 or 1004). Yahya of Antioch has Tsar Roman captured in 991 and dying in 997, while Skylitzes has him surrender Skopje in 1004. No Bulgarian account survives.
  - Samuel’s state is one of the subjects of competing national histories in Bulgaria and North Macedonia. Contemporary Byzantine, Armenian and Arab writers called it Bulgaria, and Basil’s nickname Boulgaroktonos, “Bulgar-slayer”, appears in writing only from the 12th century.
  - Places are given their Byzantine names where these are usual in English, with modern names in the text. Serdica or Sredets is Sofia, Berroia is Veria, Vodena is Edessa, Dyrrhachium is Durrës and Kleidion is near today’s Klyuch in Bulgaria. Sviatoslav’s war of 965–971, after which Byzantium annexed eastern Bulgaria, is told in Sviatoslav’s campaigns.
