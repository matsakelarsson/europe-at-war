  - title: Samuel’s high tide and the Spercheios
    date: 987–998
    when: "987"
    borders: "998"
    countries: [gr, mk, bg, al, me]
    body:
      - "For three years Basil was fighting the rebel Bardas Phokas, and Samuel took the chance. He took Berroia and Servia in Macedonia, gained Dyrrhachium on the Adriatic by marrying the daughter of its leading citizen and at some point won back north-eastern Bulgaria. Basil campaigned in Macedonia from 991 and captured Roman, but in 995 he had to go east to save Aleppo from the Fatimids. Samuel’s men then killed the governor of Thessalonica, Gregory Taronites, outside the city, captured his son Ashot and raided through Thessaly and central Greece into the Peloponnese."
      - "Basil’s general Nikephoros Ouranos followed him. On the way home the Bulgarians camped behind the flooded Spercheios near Lamia, sure that no one could cross. Ouranos found a ford, crossed at night and attacked at dawn. Most of the Bulgarian army was killed or captured; Samuel and his son Gabriel Radomir, both wounded, escaped by lying among the dead and fled over the Pindus mountains. When Roman died in captivity in 997, Samuel had himself proclaimed tsar. In 998 he subdued Duklja, on today’s Montenegrin coast, and raided Dalmatia."
    facts:
      - [Battle of Thessalonica, "995 or 996, Bulgarian victory"]
      - [Battle of the Spercheios, "997 (some date it 996), Byzantine victory"]
      - [Samuel proclaimed tsar, "997, after Roman’s death"]
    markers:
      - kind: battle
        side: bg
        name: Battle of Thessalonica
        date: 995 or 996
        text: Samuel drew the city’s governor, Gregory Taronites, into an ambush and killed him; his son Ashot was captured and later married Samuel’s daughter.
        lonlat: [22.94, 40.64]
      - kind: event
        side: bg
        name: Raid into the Peloponnese
        date: c. 996
        text: The Bulgarians passed Thermopylae and plundered as far as the Peloponnese.
        lonlat: [22.88, 37.94]
      - kind: battle
        side: byz
        name: Battle of the Spercheios
        date: "997"
        text: A night crossing of the flooded river and a dawn attack destroyed Samuel’s army and ended his raids into Greece.
        lonlat: [22.43, 38.88]
      - kind: held
        side: bg
        name: Dyrrhachium
        date: by the 990s
        text: The great Adriatic port came under Samuel through his marriage to the daughter of John Chryselios, its leading citizen.
        lonlat: [19.446, 41.313]
      - kind: taken
        side: bg
        name: Duklja
        date: "998"
        text: Samuel besieged Ulcinj and made Prince Jovan Vladimir submit. Vladimir was taken to Prespa, married Samuel’s daughter and returned as his vassal.
        lonlat: [19.2, 41.93]
        lp: l
    arrows:
      - side: bg
        label: Samuel
        via: [[22.1, 40.6], [22.4, 39.7], [22.55, 38.85], [22.85, 37.98]]
      - side: byz
        label: Nikephoros Ouranos
        via: [[22.94, 40.6], [22.45, 39.6], [22.45, 38.95]]
      - side: bg
        via: [[22.35, 38.9], [21.6, 39.55], [21.15, 40.5]]
  - title: Vidin, Skopje and Dyrrhachium
    date: 1000–1005
    when: "1000"
    borders: "1005"
    countries: [bg, gr, mk, al, ro, tr]
    body:
      - "From 1000 Basil, at peace in the east, campaigned in the Balkans almost every year. His generals Theodorokanos and Nikephoros Xiphias retook Pliska and the two Preslavs, Great and Little, in the north-east. Basil himself then took Berroia, whose commander changed sides, stormed Servia, recovered the forts of Thessaly and took Vodena after a long siege, moving its people to Thrace. Then he besieged Vidin on the Danube for eight months and took it. While he was there, Samuel raided Adrianople on the feast of the Dormition, 15 August."
      - "Marching south, Basil found Samuel’s army camped across the Vardar near Skopje. A soldier found a ford, the Byzantines crossed and routed the Bulgarians, and the governor of Skopje surrendered the town. Basil then besieged Pernik, but its commander, Krakra, held out and the Byzantines withdrew with heavy losses. In 1005 the Chryselios family handed Dyrrhachium to a Byzantine fleet, while Samuel’s son-in-law Ashot slipped away to Constantinople. For the next nine years the war went on in yearly raids and sieges, of which little is recorded."
    facts:
      - [Vidin, "Taken after eight months, 1002 or 1003"]
      - [Battle of Skopje, "1004 (some date it 1003), Byzantine victory"]
      - [Dyrrhachium, "Handed over to Byzantium, 1005"]
    markers:
      - kind: taken
        side: byz
        name: Preslav and Pliska
        date: 1000 or 1001
        text: Theodorokanos and Nikephoros Xiphias retook the old Bulgarian capitals in the north-east.
        lonlat: [26.817, 43.167]
      - kind: taken
        side: byz
        name: Berroia, Servia and Vodena
        date: 1001 or 1002
        text: Berroia surrendered, Servia was stormed and Vodena fell after a long siege; its people were moved to the plain between the Mesta and the Maritsa.
        lonlat: [22.2, 40.52]
        lp: l
      - kind: siege
        side: byz
        name: Siege of Vidin
        date: 1002 or 1003
        text: The Danube fortress held out for eight months, beating off attacks with Greek fire, before it fell.
        lonlat: [22.872, 43.993]
      - kind: event
        side: bg
        name: Adrianople
        date: 15 August 1002 or 1003
        text: Samuel struck in the opposite direction while Basil was at Vidin, and plundered the city on the feast of the Dormition.
        lonlat: [26.556, 41.677]
      - kind: battle
        side: byz
        name: Battle of Skopje
        date: "1004"
        text: Basil found a ford over the Vardar and surprised Samuel’s camp, as Ouranos had done on the Spercheios. Skopje then surrendered.
        lonlat: [21.433, 42.0]
      - kind: held
        side: bg
        name: Pernik
        date: "1004"
        text: Krakra, the fortress’s commander, refused Basil’s offers of titles and wealth and beat off his assaults.
        lonlat: [23.033, 42.6]
      - kind: taken
        side: byz
        name: Dyrrhachium
        date: "1005"
        text: John Chryselios’s family surrendered the port to the Byzantine commander Eustathios Daphnomeles in return for court titles.
        lonlat: [19.446, 41.313]
    arrows:
