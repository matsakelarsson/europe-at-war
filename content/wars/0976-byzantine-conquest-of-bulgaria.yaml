  - title: The end of resistance
    date: 1015–1018
    when: "1015"
    borders: "1018-02"
    countries: [mk, bg, al, gr, me]
    body:
      - "Gabriel Radomir reigned for a year before his cousin Ivan Vladislav, whose life he had once saved, murdered him while hunting in 1015, reportedly with Basil’s encouragement. Ivan offered to submit, then fought on. Basil retook Vodena, which had rebelled, captured Moglena and reached Ohrid, Samuel’s capital, but withdrew when another Byzantine force was ambushed and destroyed. In 1016 Ivan lured Jovan Vladimir of Duklja to Prespa and had him killed, while Basil besieged Pernik for 88 days and again failed to take it."
      - "Basil campaigned every year, wasting the country and taking forts one by one. Ivan Vladislav tried to win the Pechenegs as allies and, with Krakra of Pernik, to retake lost towns, without success. In February 1018 he was killed in a skirmish outside the walls of Dyrrhachium, which he was besieging. With him the last Bulgarian ruler with an army in the field was gone, and the nobles began to surrender."
    facts:
      - [Gabriel Radomir murdered, "1015, by Ivan Vladislav"]
      - [Siege of Pernik, "1016, 88 days, Bulgarian success"]
      - [Death of Ivan Vladislav, "February 1018, at Dyrrhachium"]
    markers:
      - kind: taken
        side: byz
        name: Vodena and Moglena
        date: "1015"
        text: Basil recaptured Vodena, which had risen against its Byzantine garrison, and took the fortress of Moglena by diverting the river beneath its walls.
        lonlat: [22.05, 40.8]
      - kind: event
        side: byz
        name: Ohrid
        date: "1015"
        text: Basil reached Samuel’s capital and seized its treasury, but withdrew after news that a detachment he had sent ahead had been destroyed.
        lonlat: [20.802, 41.117]
      - kind: event
        side: bg
        name: Prespa
        date: 22 May 1016
        text: Jovan Vladimir, prince of Duklja and Samuel’s son-in-law, was killed here on Ivan Vladislav’s orders. He is venerated as a saint.
        lonlat: [21.1, 40.82]
        lp: b
      - kind: held
        side: bg
        name: Pernik
        date: "1016"
        text: Krakra held the fortress for a second time, against a siege of 88 days.
        lonlat: [23.033, 42.6]
      - kind: battle
        side: byz
        name: Death of Ivan Vladislav
        date: February 1018
        text: The Bulgarian ruler was killed in fighting outside Dyrrhachium. Later legend said he was struck down by a mysterious warrior.
        lonlat: [19.446, 41.313]
    arrows:
      - side: byz
        label: Basil II, 1015
        via: [[22.9, 40.7], [22.05, 40.85], [21.3, 41.0], [20.85, 41.1]]
      - side: bg
