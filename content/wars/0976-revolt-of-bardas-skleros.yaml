notes:
  - The main sources are Leo the Deacon, Michael Psellos and John Skylitzes on the Byzantine side, with Yahya of Antioch and other Arabic writers. Accounts of the battles differ; the last is said to have been decided by single combat between the two Bardases, in which Skleros was wounded.
  - Skleros returned in 987 and joined, then was imprisoned by, Bardas Phokas; see the revolt of Bardas Phokas.
