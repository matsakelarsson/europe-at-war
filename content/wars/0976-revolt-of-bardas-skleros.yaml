id: revolt-of-bardas-skleros
name: Revolt of Bardas Skleros
start: "976"
end: "979-03-24"
tier: C
summary: The rebellion of Bardas Skleros, the leading general of the East, who was proclaimed emperor by his troops in 976 after the regent Basil Lekapenos, ruling for the young Basil II, removed him from his command. Skleros won over the eastern frontier, defeated the loyalist armies and took most of Asia Minor; his fleet tried to close the Dardanelles and he besieged Nicaea. The government released his old rival Bardas Phokas, who, with 12,000 Georgian horsemen sent by David III of Tao, was beaten twice before defeating Skleros on 24 March 979 in a battle decided, the chroniclers say, by single combat between the two Bardases. Skleros fled to Baghdad. The revolt kept Byzantium from stopping the rise of Samuel’s Bulgaria.
