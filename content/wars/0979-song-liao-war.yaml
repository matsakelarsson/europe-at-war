steps:
  - title: The Gaoliang River
    date: June – July 979
    when: "979-07"
    borders: "979-07-01"
    countries: [cn]
    body:
      - The Song had just taken Taiyuan when Taizong, against the advice of generals whose troops were tired and unpaid, decided to march on to the Sixteen Prefectures. His army crossed the Taihang into Hebei, took Yizhou and Zhuozhou, whose Liao garrisons surrendered, and laid siege to Youzhou, the Liao Southern Capital, defended by Yelü Xuegu.
      - The city held, and Liao relief armies came up. Near the Gaoliang River, just north-west of the city, Taizong attacked the first of them under Yelü Xiezhen and, thinking the battle won, threw in his whole army. Yelü Xiuge then struck at the emperor’s own camp from the side, while Yelü Xuegu came out of the city. The Song army broke and was cut to pieces in the rout. Taizong, wounded by arrows, escaped south in a donkey cart. The defeat ended his hopes of taking the prefectures by force for several years.
    facts:
      - [Yizhou and Zhuozhou surrender, "June 979"]
      - [Battle of the Gaoliang River, "July 979"]
