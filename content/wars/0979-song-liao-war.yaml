  - title: Annual raids
    date: 999–1003
    when: "1003"
    borders: "1003-06-01"
    countries: [cn]
    body:
      - Taizong died in 997 and was succeeded by his son Zhenzong. Having secured the submission of Goryeo in 993–994, the Liao began a series of yearly campaigns against the Song in 999. The Liao horsemen raided deep into Hebei, avoiding the fortified towns. The Song held the walled cities, and behind a growing line of ponds and flooded fields along the border their generals, among them Yang Ye’s son Yang Yanzhao at Suicheng, beat off many attacks; but the raids did great damage and the Song armies won no decisive battle.
      - In 1003 the Song general Wang Jizhong was captured by the Liao in a battle near Wangdu. The Liao gave him rank and office, and he came to argue at the Liao court, where Xiao Chuo was tiring of war, that peace would serve both sides better. Through the prefect of Mozhou he sent the first message to the Song court proposing talks.
    facts:
      - [Liao annual campaigns begin, "999"]
      - [Wang Jizhong captured near Wangdu, "1003"]
