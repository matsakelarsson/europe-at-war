    moves: Liao moves
    success: Liao success
notes:
  - The Song–Liao frontier ran across the open plain of Hebei, where the Song made a line of ponds, flooded fields and planted forests to slow the Khitan cavalry; in Shanxi it followed the mountains south of Datong.
  - Yang Ye and his sons became the heroes of the popular cycle of stories and plays known as the Generals of the Yang Family, which differs much from the historical record.
