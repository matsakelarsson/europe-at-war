  - title: Chenjiagu and Junziguan
    date: July – December 986
    when: "986-08"
    borders: "986-08-01"
    countries: [cn]
    body:
      - After Cao Bin’s defeat Taizong ordered a general retreat. The western army was told to bring the people of the four Shanxi prefectures back into Song territory, while Yelü Xiezhen came west with a large army and retook Huanzhou. Yang Ye proposed to draw the Liao army off while the people withdrew. The army supervisor Wang Shen accused him of cowardice and of disloyalty to his new masters, and Yang, protesting that it would end in disaster, agreed to attack, asking Pan Mei and Wang Shen to post archers at the mouth of the valley of Chenjiagu to cover his retreat.
      - Yelü Xiezhen ambushed Yang Ye’s force, which fought from noon until dusk and fell back to Chenjiagu, but the supporting troops had already gone. Yang’s son Yang Yanyu was killed, and Yang Ye, badly wounded, was captured and died soon after. The Song abandoned the four prefectures. Taizong demoted Pan Mei and dismissed Wang Shen.
      - In the winter the Liao counter-attacked into Hebei. At Junziguan near Yingzhou (Hejian) in December 986 they destroyed a Song army in bitter cold, and raided far into Hebei before withdrawing. Taizong gave up the idea of retaking the prefectures, and the Song turned to defending the border.
    facts:
