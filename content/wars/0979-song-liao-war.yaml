id: song-liao-war
name: Song–Liao war
start: "979-06"
end: "1005-01"
tier: A
summary: "The quarter-century of war between the Song dynasty and the Khitan Liao empire over the Sixteen Prefectures, the band of land around today’s Beijing and Datong that the Liao had held since 938. Fresh from the conquest of the Northern Han, the Song emperor Taizong marched on Youzhou (Yanjing, Beijing) in 979, but was routed at the Gaoliang River and fled south wounded. After years of raids, he tried again in 986, while a boy emperor, Shengzong, reigned in the Liao under his mother, the empress dowager Xiao Chuo. Three Song armies crossed the border; Yelü Xiuge destroyed the eastern army under Cao Bin, the western army lost the four prefectures it had taken in Shanxi, and its general Yang Ye was captured at Chenjiagu and died. From 999 the Liao raided the Song every year, and in 1004 Shengzong and his mother drove deep into Hebei to Chanzhou on the Yellow River, where the Song emperor Zhenzong came to meet them. In January 1005 the Treaty of Chanyuan made peace: the Song paid the Liao 200,000 bolts of silk and 100,000 taels of silver a year, and the two emperors called each other brothers. The border stayed where it was, and peace between the two empires lasted more than a century."
countries: [cn]
sides:
  - id: song
    name: Song dynasty
    polities: [song]
    ink: red
    moves: Song moves
    success: Song success
  - id: liao
    name: Liao
    polities: [liao]
