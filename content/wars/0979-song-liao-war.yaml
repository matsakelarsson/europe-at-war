  - title: Yanmen and the raids
    date: 980–985
    when: "980-03"
    borders: "982-01-01"
    countries: [cn]
    body:
      - The Liao struck back. In 980 an army said to be 100,000 strong appeared before the Yanmen Pass, the gate of central Shanxi. While Pan Mei came up from Daizhou, the former Northern Han general Yang Ye led a few hundred horsemen by a hidden path around to the enemy’s rear, and the Liao army, attacked from two sides, was badly beaten; a Liao governor was killed and a general captured. Later that year the Liao emperor Jingzong led a punitive campaign into Hebei and defeated a Song army near the Waqiao Pass, but in 982 another Liao attack was beaten off.
      - Jingzong died in 982. His son Shengzong was still a child, and his widow, the empress dowager Xiao Chuo (Xiao Yanyan), ruled for him, with Han Derang and the generals Yelü Xiezhen and Yelü Xiuge. The Song court, hearing that the Liao was ruled by a woman and a child, began to plan a new invasion.
    facts:
      - [Battle of Yanmen, "980"]
      - [Death of Jingzong, "982"]
