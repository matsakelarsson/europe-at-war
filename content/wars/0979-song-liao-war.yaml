  - title: The Yongxi campaign
    date: March – June 986
    when: "986-05"
    borders: "986-05-01"
    countries: [cn]
    body:
      - In the spring of 986, the third year of the Yongxi era, Taizong sent three armies against the prefectures. The eastern army, the largest, under Cao Bin, was to advance slowly on Youzhou from Xiongzhou and tie down the main Liao forces; the central army under Tian Zhongjin went through the Feihu Pass towards Weizhou; and the western army under Pan Mei, with Yang Ye, came through the Yanmen Pass into northern Shanxi. In little more than a month the western army took Huanzhou, Shuozhou, Yingzhou and Yunzhou (Datong), and the central army took Weizhou.
      - Cao Bin took Zhuozhou early but, short of supplies and harassed by Yelü Xiuge’s horsemen, fell back to Xiongzhou for food. Pressed by his officers, jealous of the western army’s success, he advanced on Zhuozhou a second time, in the heat of early summer. Xiao Chuo and the young emperor came up with the main Liao army, and Yelü Xiuge caught the exhausted Song troops as they fell back at the Qigou Pass and on the Juma River. The eastern army was destroyed, tens of thousands of men dying in the rout and in the river.
    facts:
      - [Three Song armies, "spring 986"]
      - [Four prefectures taken in Shanxi, "spring 986"]
      - [Cao Bin defeated at Qigou Pass, "May 986"]
