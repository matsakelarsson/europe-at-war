  - title: Chanyuan
    date: October 1004 – January 1005
    when: "1005-01"
    borders: "1005-01-01"
    countries: [cn]
    body:
      - In the autumn of 1004 Shengzong and Xiao Chuo led the whole Liao army south. Leaving the Song fortresses behind them after failing to take Yingzhou, they rode through Hebei to Chanzhou (today’s Puyang), the last city before the Yellow River, about 150 km from the Song capital Kaifeng. Some at the Song court urged Zhenzong to flee south, but the chief minister Kou Zhun persuaded him to go north to the army. Zhenzong crossed the river into the city, and his arrival raised the defenders’ spirits.
      - The Liao commander Xiao Talin was killed by a bolt from a Song crossbow while inspecting the lines before Chanzhou, and the Liao offensive faltered. Both sides were ready to talk. The Song envoy Cao Liyong negotiated with Xiao Chuo, and in January 1005 the two courts agreed to the Treaty of Chanyuan. The Song would send the Liao 200,000 bolts of silk and 100,000 taels of silver every year; the border stayed where it was, and neither side was to build new fortifications on it. Zhenzong and Shengzong would call each other elder and younger brother.
      - Many at the Song court thought the treaty humiliating, but the payments were small beside the cost of war, and much of the silver came back through the border markets. Apart from a crisis in 1042, when the payments were raised, the peace held for well over a century, until the Song allied with the Jurchens against the Liao.
    facts:
      - [Xiao Talin killed, "December 1004"]
      - [Treaty of Chanyuan, "January 1005"]
      - [Yearly payment, "200,000 bolts of silk and 100,000 taels of silver"]
