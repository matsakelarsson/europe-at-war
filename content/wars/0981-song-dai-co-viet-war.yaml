id: song-dai-co-viet-war
name: Song–Đại Cồ Việt war
start: "0980"
end: "0982"
tier: B
summary: "The Song dynasty’s attempt to restore Chinese rule over the Red River plain after the murder of Đinh Bộ Lĩnh, the first king of Đại Cồ Việt, in 979. With a boy king on the throne and Song armies gathering on the border, the court made the commander-in-chief Lê Hoàn king in 980. In early 981 one Song army marched from Guangxi by the Lạng Sơn road while a fleet sailed into the Bạch Đằng estuary. Song records claim a victory on the river; Vietnamese tradition counts the second battle of Bạch Đằng as Lê Hoàn’s. The land army stalled, lost men to disease, and its commander Hou Renbao was lured into an ambush at Chi Lăng and killed; by the spring the Song had withdrawn. Lê Hoàn returned the captured Song officers and sent tribute, and the Song later recognised him. In 982 he turned south, killed the Cham king in battle and sacked Indrapura, the capital of Champa."
countries: [vn, cn]
