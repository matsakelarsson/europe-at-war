notes:
  - The main accounts are the History of Song and the Vietnamese chronicles (the Đại Việt sử ký toàn thư, compiled in the 15th century). They disagree about the fighting on the Bạch Đằng, which the Song record as their victory and Vietnamese tradition as Lê Hoàn’s; both agree that the invasion failed after the death of Hou Renbao. Dates are given in lunar months in both; the Song withdrawal came in the third month of 981.
  - Đại Cồ Việt was the name Đinh Bộ Lĩnh gave his kingdom in 968; it became Đại Việt in 1054. Chinese names are in pinyin (Hou Renbao, Hầu Nhân Bảo; Sun Quanxing, Tôn Toàn Hưng; Liu Cheng, Lưu Trừng).
  - Champa is the coastal kingdom of the Cham people in today’s central Vietnam. Its capital Indrapura stood near Đồng Dương in Quảng Nam.
