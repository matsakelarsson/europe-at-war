  - title: The sack of Indrapura
    date: 979–983
    when: "0982"
    borders: "0982-06-01"
    countries: [vn]
    body:
      - Champa had tried to profit from the murder of Đinh Bộ Lĩnh. Ngô Nhật Khánh, a grandson of Ngô Quyền who had fled to Champa after losing his lands to Đinh Bộ Lĩnh, persuaded the Cham king Jaya Paramesvaravarman I to send a fleet north in 979; a storm wrecked it, and Ngô Nhật Khánh was drowned. When Lê Hoàn sent envoys to announce his accession, the Cham king detained them.
      - In 982 Lê Hoàn led an expedition south by sea. The Cham army was defeated and Paramesvaravarman was killed in battle; the Vietnamese sacked Indrapura, the Cham capital in today’s Quảng Nam, destroyed its citadel and carried off gold and silver, women of the royal household and an Indian monk. The new king, Jaya Indravarman IV, took refuge in the south and appealed in vain to the Song. In 983 Lưu Kế Tông, a Vietnamese officer, seized power in northern Champa and held it against Lê Hoàn, proclaiming himself king in 986; many Cham fled to Hainan and Guangzhou. After his death in 989 a Cham king, Harivarman II, was crowned, and the Cham raided the Vietnamese border again in the 990s. By about 1000 the Cham kings ruled from Vijaya, further south in today’s Bình Định.
