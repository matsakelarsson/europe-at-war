steps:
  - title: Lê Hoàn and the Song invasion
    date: 979–981
    when: "0981"
    borders: "0981-03-01"
    countries: [vn, cn]
    body:
      - In the tenth lunar month of 979 Đinh Bộ Lĩnh, who had reunited the country in 968 and ruled from Hoa Lư, was murdered in his palace with his heir Đinh Liễn. His six-year-old son Đinh Toàn was enthroned with the general Lê Hoàn as regent, while revolts broke out in the provinces. Hou Renbao, the Song governor of Yongzhou (Nanning), urged the emperor Taizong to take the chance, and the Song assembled armies in Guangxi under Hou Renbao and Sun Quanxing and a fleet under Liu Cheng. Facing invasion, the court turned to Lê Hoàn; in 980 the queen mother Dương Vân Nga put the royal robe on him, and he became king, the founder of the Early Lê dynasty. A letter sent in Đinh Toàn’s name asking the Song for investiture was refused.
      - In early 981 the Song attacked by land from Guangxi and by sea up the Bạch Đằng. The Song history records that Liu Cheng’s fleet defeated the Vietnamese on the river, taking a thousand heads and two hundred boats; Vietnamese tradition remembers a second battle of Bạch Đằng in which Lê Hoàn planted stakes in the estuary as Ngô Quyền had done and held the river. Either way, the fleet and the land army failed to join. The land army halted to wait for it, malaria and dysentery spread through the camps, and the commanders quarrelled. Lê Hoàn sent word that he would surrender, and when Hou Renbao came forward to receive him at Chi Lăng, on the road to Lạng Sơn, he was ambushed and killed and his army routed.
      - The Song withdrew in the third lunar month of 981, and Taizong had Sun Quanxing executed for the failure. Lê Hoàn sent back the Song officers he had captured and offered tribute, and the Song court, at war with the Liao in the north, accepted. Song envoys came to Hoa Lư in 990, and the Song named Lê Hoàn King of Jiaozhi in 993 and Nam Bình Vương (King of the Pacified South) in 997.
