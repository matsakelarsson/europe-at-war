id: li-jiqian-revolt
name: Li Jiqian’s revolt
start: "982"
end: "1004-01-06"
tier: C
summary: "The twenty-year struggle in which the Tangut chief Li Jiqian resisted the Song and laid the foundations of the Western Xia state. The Tangut Li family had ruled the Dingnan circuit around Xiazhou in the Ordos, on the north-western frontier, almost independently since the late Tang. In 982 its head, Li Jipeng, facing opposition among the Tangut elite, went to the Song court and handed over his lands. His kinsman Li Jiqian refused to submit and fled into the steppe with a band of followers. A Song attack on his camp in 984 captured his mother and wife, but in 985 he took Yinzhou and its stores, and his following grew. He paid tribute to the Liao from 986, married a Khitan princess in 989 and was named King of Xia by the Liao in 990, while making gestures of submission to the Song when it suited him. He defeated Li Jipeng, sent against him by the Song, in 994, and raided Lingzhou in 996 and 997. In 998 the new Song emperor Zhenzong recognised him as governor of Dingnan, but he soon began raiding again, and in 1002 took Lingzhou, the great Song stronghold on the Yellow River, which he made his capital as Xiping. He was wounded fighting the Tibetans of Liangzhou and died on 6 January 1004. His son Li Deming kept peace with the Song, and his grandson Li Yuanhao proclaimed the Western Xia empire in 1038."
