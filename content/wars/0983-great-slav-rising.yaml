id: great-slav-rising
name: Great Slav Rising
start: "983"
end: "983"
tier: C
summary: A rising of the pagan Polabian Slavs between the Elbe and the Oder, led by the Lutici and joined by the Obotrites, against the German rule and Christian mission imposed on them by Henry I and Otto I. In 983, while Otto II was in Italy after his defeat at Stilo, they destroyed the bishops’ seats of Havelberg and Brandenburg and sacked Hamburg; the Northern March and the Billung March were lost, and German expansion east of the Elbe stopped for more than 150 years.
countries: [de]
