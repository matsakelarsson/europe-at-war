    name: Lutici and Obotrites
    polities: [wends]
    ink: olive
    moves: Slav moves
    success: Slav success
  - id: hre
    name: Holy Roman Empire
    polities: [hre]
    ink: gold
    moves: Imperial moves
    success: Imperial success
notes:
  - Also called the Slavic revolt of 983. The main source is the chronicle of Thietmar of Merseburg, written a generation later. Havelberg was taken on 29 June 983 and Brandenburg three days later.
  - Saxon campaigns in the following years, some of them with the Polish dukes Mieszko I and Bolesław I, failed to win the land back; the bishoprics of Havelberg and Brandenburg existed only in name until the 12th century.
