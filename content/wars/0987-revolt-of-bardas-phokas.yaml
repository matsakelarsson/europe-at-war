notes:
  - The main sources are Michael Psellos, John Skylitzes, Yahya of Antioch and the Armenian Stepanos Taronetsi. Phokas was proclaimed emperor in the summer of 987; the battle of Chrysopolis is dated to 988 or early 989. Some writers suspected that he had been poisoned.
