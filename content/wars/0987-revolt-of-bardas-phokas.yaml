id: revolt-of-bardas-phokas
name: Revolt of Bardas Phokas
start: "987"
end: "989-04-13"
tier: C
summary: The rebellion of Bardas Phokas, who in 987, after Basil II’s defeat by the Bulgarians at the Gates of Trajan, had himself proclaimed emperor in Asia Minor. He made an alliance with the returning rebel Bardas Skleros, then imprisoned him, took over almost all of Asia Minor and besieged Abydos on the Dardanelles. Basil II obtained 6,000 Varangian warriors from Prince Vladimir of Kiev, who was promised the emperor’s sister Anna in marriage and accepted baptism. The Varangians routed a rebel army at Chrysopolis, and at Abydos on 13 April 989 Phokas died, apparently of a seizure, as he rode out to attack Basil. His army broke up, and Skleros submitted later that year. The Varangians became the emperors’ guard.
