  - title: Kudal-Sangamam and the struggle for Vengi
    date: about 1059–1120
    when: "1062"
    borders: "1120"
    countries: [in]
    body:
      - Someshvara tried again and was beaten on the Tungabhadra at Mudakkaru in about 1059 and at Kudal-Sangamam, probably at the meeting of the Krishna and the Tungabhadra, in about 1062, where Rajendra II and his brother Virarajendra routed armies led by Someshvara’s sons Vikramaditya and Jayasimha. In 1067 Someshvara challenged Virarajendra, now king, to fight again at Kudal-Sangamam on a fixed day, but did not come; the Chola army waited for a month, ravaged the country and set up a pillar of victory on the Tungabhadra. Gravely ill, Someshvara drowned himself in the Tungabhadra at Kuruvatti on 29 March 1068. Virarajendra defeated a Chalukya army near Vijayawada and restored his candidate in Vengi.
      - The war then became a contest of alliances. Virarajendra backed Someshvara’s younger son Vikramaditya VI against his elder brother and gave him his daughter in marriage. After Virarajendra died, the Eastern Chalukya prince Kulottunga I took the Chola throne in 1070 and joined Vengi to it, and Vikramaditya, who seized the Chalukya throne in 1076, fought him for the rest of his long reign. A Chalukya invasion was routed near Nangili in Kolar in the 1070s, but in about 1118 Vikramaditya took Vengi. The Cholas recovered most of it in the years after his death in 1126. By then both empires were exhausted, and in the next century their vassals, the Hoysalas, Yadavas and Kakatiyas, and the Pandyas in the far south, took their place.
    facts:
      - [Battle of Kudal-Sangamam, "about 1062, Chola victory"]
      - [Death of Someshvara I, "29 March 1068"]
      - [Vengi taken by Vikramaditya VI, "about 1118"]
