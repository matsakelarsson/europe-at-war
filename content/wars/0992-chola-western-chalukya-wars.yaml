notes:
  - Almost everything is known from the two dynasties’ inscriptions, which record their own victories in grand terms and pass over their defeats. Chola and Chalukya records often claim the same battle, and the dates and sites of several battles, among them Koppam and Kudal-Sangamam, are disputed.
  - The Western Chalukyas are also called the Chalukyas of Kalyani or the Later Chalukyas, to tell them from the Chalukyas of Badami of the 6th–8th centuries.
