  - title: Kalyani and Koppam
    date: about 1044–1054
    when: "1045"
    borders: "1054"
    countries: [in]
    body:
      - Someshvara I (1042–1068) made Kalyani his capital and pressed on Vengi, and the Chola emperor Rajadhiraja I answered with a series of invasions. He beat a Chalukya army at Dannada on the Krishna, burned the Chalukya palace at Kampili, set up a pillar of victory at Yadgir and, in about 1045, sacked Kalyani, where he had himself crowned and took the title Vijayarajendra. Among the spoils was a carved door guardian, a dvarapala, whose inscription records that it was brought from Kalyani; it is now in the art gallery at Thanjavur.
      - In 1054 (1052 in some accounts) Rajadhiraja invaded again, and Someshvara met him at Koppam, on the Krishna. Fighting from his elephant, Rajadhiraja was shot dead by Chalukya archers, and the Chola army began to give way. His younger brother Rajendra II, commanding the reserve, rallied it and drove Someshvara from the field, capturing his queens, treasure and elephants, and was crowned king on the battlefield. He set up a pillar of victory at Kolhapur. The Cholas remembered Rajadhiraja as “the king who died on the elephant”. The site of Koppam is disputed; it has been placed at Khidrapur near Kolhapur and near Koppal.
    facts:
      - [Kalyani sacked, "about 1045"]
      - [Battle of Koppam, "1054 (or 1052), Chola victory; Rajadhiraja I killed"]
