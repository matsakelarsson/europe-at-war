id: chola-western-chalukya-wars
name: Chola–Western Chalukya wars
start: "992"
end: "1120"
tier: B
summary: The wars of more than a century between the Chola Empire of the Tamil country and the Western Chalukyas of Kalyani in the Deccan. They fought over the rich lands of the Raichur Doab between the Krishna and the Tungabhadra, over Gangavadi in southern Karnataka, and above all over Vengi, the Eastern Chalukya kingdom in the Godavari and Krishna deltas. Chola armies sacked the Chalukya capitals Manyakheta (1007) and Kalyani (about 1045), and Chola kings won great battles at Koppam (1054), where the emperor Rajadhiraja I was killed, and at Kudal-Sangamam (about 1062). The Chalukyas held their ground in the Deccan, and under Vikramaditya VI took Vengi in about 1118. Neither side won lasting control, and the long war wore both empires down.
