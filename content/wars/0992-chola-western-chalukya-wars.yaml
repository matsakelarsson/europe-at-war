steps:
  - title: Manyakheta, Vengi and Maski
    date: about 992–1021
    when: "1007"
    borders: "1007"
    countries: [in]
    body:
      - In 973 the Chalukya Tailapa II overthrew the Rashtrakutas and founded a new empire in the Deccan, just as the Cholas under Rajaraja I (985–1014) were expanding north from the Kaveri delta. Rajaraja conquered Gangavadi and Nolambavadi in southern Karnataka and took the side of the Eastern Chalukyas of Vengi, marrying his daughter to the Vengi prince Vimaladitya; Vengi became a Chola protectorate and the main prize between the two empires. In 1007 the Chola crown prince Rajendra invaded the Chalukya country. An inscription of the Chalukya king Satyashraya at Hottur says the Chola army numbered 900,000 and plundered the land, killing women, children and Brahmins, while Chola inscriptions claim that Rajendra destroyed the Chalukya capital Manyakheta. Satyashraya drove the invaders back south of the Tungabhadra.
      - Rajendra, king from 1014, fought the next Chalukya king, Jayasimha II, both in the Raichur Doab and over the succession in Vengi. In about 1020 he defeated Jayasimha at Maski, and in 1021 he placed his nephew Rajaraja Narendra on the throne of Vengi against Jayasimha’s candidate. The Tungabhadra became the rough frontier between the two empires.
    facts:
      - [Rajendra’s invasion, "1007; Manyakheta sacked according to Chola records"]
      - [Battle of Maski, "about 1020, Chola victory"]
