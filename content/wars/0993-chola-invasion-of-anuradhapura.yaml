steps:
  - title: Rajaraja I takes the north
    date: "993"
    when: "993"
    borders: "993"
    countries: [lk, in]
    body:
      - Under Rajaraja I (985–1014) the Cholas of the Kaveri delta became the leading power of southern India. The Sinhalese kings of Anuradhapura had long backed the Pandyas, the Cholas’ rivals in the far south, and in the 10th century a defeated Pandya king had fled to the island and left his crown and royal regalia there, which the Cholas wanted. In Sri Lanka, Mahinda V faced a revolt of his foreign mercenaries over unpaid wages and withdrew to Ruhuna in the south-east.
      - In 993 a Chola army crossed the Palk Strait and took the north of the island. The Culavamsa says that Anuradhapura, the royal city for more than a thousand years, was “utterly destroyed in every way by the Chola army”, its monasteries plundered and its relic shrines broken open. The Tiruvalangadu plates boast that Rajaraja had outdone Rama, who in the Ramayana needed a bridge of monkeys to reach Lanka. The Cholas made the north a province, Mummudi-sola-mandalam, and governed it from Polonnaruwa, which they renamed Jananathamangalam. At the port of Mahatittha (Mantai) a Chola official built a temple of Shiva, the Rajarajeshvara.
