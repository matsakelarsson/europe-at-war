id: chola-invasion-of-anuradhapura
name: Chola conquest of Anuradhapura
start: "993"
end: "1017"
tier: B
summary: The conquest of northern Sri Lanka by the Chola Empire of southern India. In 993 the army of Rajaraja I crossed the Palk Strait while the Sinhalese king Mahinda V was struggling with a mutiny of his mercenaries, and sacked Anuradhapura, the island’s capital for more than a thousand years. The north became a Chola province governed from Polonnaruwa. In 1017 Rajaraja’s son Rajendra I invaded Ruhuna in the south-east, captured Mahinda V with his queen, his crown and his treasure, and took him to India, where he died in 1029. Anuradhapura was never a capital again, and the Cholas held the north until Vijayabahu I drove them out in 1070.
