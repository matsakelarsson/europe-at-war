  - title: Rajendra I takes Ruhuna and the king
    date: "1017"
    when: "1017"
    borders: "1017"
    countries: [lk, in]
    body:
      - Rajaraja’s son Rajendra I, king from 1014, sent his army into Ruhuna in 1017. According to the Culavamsa and the Karandai plates, Mahinda V was captured with his queen and daughter, his crown and his treasure, and the Cholas also recovered the Pandya regalia left in the island decades before. Mahinda was taken to the Chola country, where he died a prisoner in 1029. Rajendra’s inscriptions claim the conquest of all of Lanka, but the Cholas never held the south firmly.
      - Mahinda’s son Kassapa escaped and was crowned in Ruhuna as Vikramabahu, but neither he nor the short-lived rulers who followed could drive the Cholas from the north. For more than half a century Polonnaruwa was a Chola provincial capital, and the Shiva temple known as Siva Devale No. 2, built in the Chola style, is the oldest surviving building there. The Cholas were driven out by Vijayabahu I between 1055 and 1070; Polonnaruwa, not Anuradhapura, became the capital of the restored Sinhalese kingdom.
    facts:
      - [Mahinda V captured, "1017"]
      - [Death of Mahinda V, "1029, a prisoner in the Chola country"]
