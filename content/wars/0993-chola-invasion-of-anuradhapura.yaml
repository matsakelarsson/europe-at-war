notes:
  - The sources are the Chola inscriptions, above all the Tiruvalangadu and Karandai copper plates, which celebrate the conquest, and the Sinhalese chronicle Culavamsa (the later part of the Mahavamsa), which mourns it. The year 993 comes from Rajaraja’s inscriptions; the Culavamsa dates the fall of Mahinda V to the 36th year of his reign, about 1017.
