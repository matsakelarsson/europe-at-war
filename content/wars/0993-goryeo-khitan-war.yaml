id: goryeo-khitan-war
name: Goryeo–Khitan War
start: "993"
end: "1019-03-10"
tier: A
summary: "Three invasions of Goryeo by the Khitan Liao empire, which ended with a Goryeo victory at Gwiju and a lasting peace. Goryeo had been hostile to the Khitans since they destroyed Balhae in 926, and it traded and exchanged envoys with Song China, Liao’s rival. In 993 a Liao army under Xiao Sunning crossed the Yalu; the Goryeo envoy Seo Hui negotiated a settlement in which Goryeo became a Liao tributary but gained the land up to the Yalu, where it built six fortified garrisons. In 1010 Emperor Shengzong invaded in person, using a palace coup in Goryeo as his pretext; he defeated and killed the general Kang Jo, and early in 1011 burned the capital, Kaegyong, while King Hyeonjong fled to Naju, but his army was harassed all the way home. When Goryeo refused to hand back the garrisons, Liao attacked again, and in 1018–1019 Xiao Paiya’s army marched almost to Kaegyong before Kang Gam-chan destroyed it at Gwiju on 10 March 1019. Goryeo remained a nominal tributary of Liao, kept the land up to the Yalu, and guarded its north with a long wall built between 1033 and 1044."
countries: [kp, kr, cn]
sides:
  - id: gor
    name: Goryeo
    polities: [goryeo]
    ink: blue
    moves: Goryeo moves
    success: Goryeo success
  - id: liao
    name: Liao (Khitans)
    polities: [liao]
    ink: orange
    moves: Liao moves
    success: Liao success
notes:
  - The Korean chronicles (the Goryeosa and the Goryeosa jeolyo) give dates in the lunar calendar. The first invasion began in the tenth lunar month of 993, the second in the eleventh month of 1010 and the third in the twelfth month of 1018, which falls in January 1019. Gwiju was fought on the first day of the second month, 10 March 1019.
  - "The army sizes come from the chronicles and are probably inflated: Xiao Sunning claimed 800,000 men in 993, the Goryeosa gives 400,000 for Shengzong’s army in 1010 and 300,000 for Kang Jo’s, and 100,000 for the Liao army of 1018 against 208,300 for Goryeo’s."
  - Historians differ on the terms of 1020–1022. Older accounts say Goryeo broke off relations with Song and took the Liao era name in 1022; Hans Bielenstein argues that it kept up its relations with Song and that the two states made peace as equals.
