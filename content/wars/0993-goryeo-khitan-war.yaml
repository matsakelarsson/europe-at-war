  - title: The burning of Kaegyong
    date: December 1010 – March 1011
    when: "1011-01"
    borders: "1011-03"
    countries: [kp, kr]
    body:
      - Leaving Pyongyang untaken, Shengzong marched on Kaegyong. In the twelfth month of 1010 King Hyeonjong fled south with his queens and a handful of officials, by way of Gwangju and Gongju, to Naju; on the way some local officials and strongmen robbed and threatened his party. In the first month of 1011 Liao troops entered Kaegyong and burned the palaces, temples, government buildings and the royal archives.
      - The official Ha Gong-jin went to the Liao camp and promised that Hyeonjong would come to the Liao court in person. After about ten days in Kaegyong Shengzong withdrew. On the way north his columns were attacked again and again. Yang Gyu and Kim Suk-heung ambushed them repeatedly and freed thousands of captives before both were killed in battle, and the Liao army abandoned much of its equipment before it recrossed the Yalu. Ha Gong-jin, taken to Liao as a hostage, was executed after refusing to serve the emperor.
    facts:
      - [Hyeonjong flees, "twelfth month of 1010"]
      - [Kaegyong burned, "first month of 1011"]
      - [Liao army back across the Yalu, "early 1011"]
