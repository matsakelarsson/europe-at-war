  - title: Gwiju
    date: 10 March 1019
    when: "1019-03-10"
    borders: "1019-03-10"
    countries: [kp]
    body:
      - The Liao army retreated north through the north-west, attacked along the way by Kang Min-cheom’s cavalry. On 10 March 1019, the first day of the second month, Kang Gam-chan met it on the plain outside Gwiju (today’s Kusong). The battle was evenly fought until Kim Jong-hyeon’s cavalry, which had followed the Liao from the south, struck its rear; by tradition the wind then turned and blew rain into the Khitans’ faces. The Goryeo army surrounded the Liao army and broke it, and Kang Min-cheom pursued the survivors to Ballyeong.
      - Korean records say that only a few thousand of the 100,000 got back across the Yalu. The Liao history records that many senior officers fell and many men drowned crossing the rivers, and that Shengzong sent Xiao Paiya a furious rebuke. Gwiju is counted among the greatest victories in Korean history; Hyeonjong came out of the capital to meet Kang Gam-chan on his return.
    facts:
      - [Battle of Gwiju, "10 March 1019, Goryeo victory"]
      - [Liao survivors, "a few thousand of about 100,000 (Korean records)"]
