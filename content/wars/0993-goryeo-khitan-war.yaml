  - title: Kang Jo’s coup and Shengzong’s invasion
    date: 1009–1010
    when: "1010-12"
    borders: "1011-01-01"
    countries: [kp]
    body:
      - In 1009 King Mokjong called Kang Jo, the military commander of the north-west, to Kaegyong to stop a plot by Kim Chi-yang, the lover of the queen mother, to put their son on the throne. Kang Jo came with 5,000 men, killed Kim Chi-yang, deposed Mokjong and had him killed, and made Mokjong’s cousin Hyeonjong king. The Liao emperor Shengzong, whose investiture Mokjong had received, used the killing as his pretext. In the eleventh month of 1010 he crossed the Yalu at the head of an army that the Goryeosa puts at 400,000.
      - Yang Gyu held Heunghwajin for a week against the Liao siege. Shengzong left the fort behind and marched on Tongju (today’s Seoncheon), where Kang Jo waited with an army the Goryeosa puts at 300,000. Kang Jo won the first engagements, but the Liao general Yelü Pennu then broke through his camp. Kang Jo was captured and, after refusing to serve the emperor, was killed; a forged letter in his name ordering Heunghwajin to surrender was then sent to Yang Gyu, who refused it.
      - Gwakju fell, and the Liao army moved on towards the Western Capital, Pyongyang, which held out. Yang Gyu came out of Heunghwajin with 700 men, gathered the survivors of Kang Jo’s army at Tongju and retook Gwakju from its Liao garrison, cutting the invaders’ route home.
    facts:
      - [Kang Jo’s coup, "1009"]
      - [Liao army crosses the Yalu, "eleventh month of 1010"]
      - [Death of Kang Jo, "end of 1010, after the battle of Tongju"]
