  - title: Heunghwajin and the march on Kaegyong
    date: 1011 – February 1019
    when: "1019-01"
    borders: "1019-02"
    countries: [kp]
    body:
      - Hyeonjong never went to the Liao court, and Goryeo refused to give up the six garrisons. Liao attacked in 1015, when Xiao Dilie besieged Heunghwajin, and again in 1016 and 1017, without result, while Goryeo strengthened its forts. In the twelfth month of 1018 Xiao Paiya crossed the Yalu with 100,000 men. Goryeo appointed Kang Gam-chan, then about seventy, as commander, with Kang Min-cheom as his deputy and an army the chronicles put at 208,300.
      - At Heunghwajin, by the traditional account, Kang Gam-chan dammed the Samgyo stream with ropes and cowhides and let the water loose as the Liao army crossed, then attacked it with 12,000 horsemen hidden in the hills. Xiao Paiya did not turn back but pushed south towards Kaegyong. Kang Min-cheom beat his army at Jaju, and the official Jo Won beat it again at Matan on the Taedong River, where the chronicles say the Liao lost 10,000 men.
      - In the first month of 1019 the Liao army reached Sineun (today’s Singye), about 100 li from Kaegyong. Hyeonjong had the people of the countryside brought inside the walls and the fields cleared of anything an army could live on. Finding the capital ready for a siege, Xiao Paiya turned back.
    facts:
      - [Liao attacks, "1015, 1016 and 1017"]
      - [Third invasion, "twelfth month of 1018 (January 1019)"]
      - [Goryeo army, "208,300 (chronicles)"]
