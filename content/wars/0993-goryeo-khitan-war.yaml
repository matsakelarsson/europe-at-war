steps:
  - title: Xiao Sunning’s invasion and Seo Hui’s talks
    date: 993–996
    when: "993-11"
    borders: "996-12"
    countries: [kp, cn]
    body:
      - The Khitan Liao empire had destroyed Balhae in 926, and Goryeo, which took in Balhae refugees, treated the Khitans as enemies; in 942 King Taejo exiled a Khitan embassy and let its gift of camels starve. Goryeo instead exchanged envoys with Song China. After crushing the Balhae successor state of Jeongan on the middle Yalu in 986 and building forts along the river, Liao turned on Goryeo. In the tenth month of 993 Xiao Sunning crossed the Yalu with an army he claimed was 800,000 strong, took Bongsan county and demanded Goryeo’s submission, claiming the old lands of Goguryeo for Liao. His advance was stopped at Anyungjin on the Cheongcheon River, which Dae Do-su held.
      - Some at the Goryeo court wanted to buy peace by giving up everything north of Pyongyang. Instead the official Seo Hui went to Xiao Sunning’s camp. He argued that Goryeo, as its name showed, was the heir of Goguryeo, and that it could not send envoys to Liao only because Jurchen tribes held the land along the Yalu. In the settlement Goryeo broke off relations with Song, adopted the Liao calendar in 994 and became a Liao tributary, and Liao accepted Goryeo’s claim to the land up to the Yalu. Between 994 and 996 Seo Hui drove out the Jurchens and built six fortified garrisons east of the river, at Heunghwa, Yongju, Tongju, Cheolju, Gwiju and Gwakju.
    facts:
      - [Liao invasion, "tenth month of 993"]
      - [Settlement, "993–994; Goryeo adopts the Liao calendar in 994"]
      - [Six garrisons built, "994–996"]
