  - title: Peace and the Thousand-li Wall
    date: 1019–1044
    when: "1022"
    borders: "1044-12"
    countries: [kp, kr, cn]
    body:
      - Shengzong planned another campaign, but neither side could win outright. In 1020 Hyeonjong sent tribute again, and Liao stopped asking for the king to come in person or for the six garrisons back. In 1022 a Liao envoy invested Hyeonjong as king, and Goryeo, by most accounts, took up the Liao era name and broke off official relations with Song; apart from one embassy in 1030 it sent none to Song until 1071. Relations with Liao stayed peaceful until the Liao empire fell to the Jurchens in 1125.
      - Goryeo built defences against future invasions. An outer wall around Kaegyong was finished in 1029, and between 1033 and 1044 a wall known as the Thousand-li Wall (Cheolli Jangseong) was built across the north of the country, from the mouth of the Yalu to Doryeonpo on the east coast near today’s Hamhung, against both Liao and the Jurchens.
    facts:
      - [Tribute resumed, "1020"]
      - [Investiture of Hyeonjong by Liao, "1022"]
      - [Outer wall of Kaegyong, "finished 1029"]
      - [Thousand-li Wall, "1033–1044"]
