id: wang-xiaobo-li-shun-rebellion
name: Wang Xiaobo and Li Shun rebellion
start: "993-02"
end: "995-02"
tier: C
summary: "The peasant rising in Sichuan led by Wang Xiaobo and Li Shun against the Song, which had conquered the region from the Later Shu in 965. The Song had carried off the Shu treasury and made the officials’ purchasing office the only buyer of the region’s silk and cloth, and in the crowded Chengdu plain many poor farmers could not live from their land. In the spring of 993 Wang Xiaobo, a farmer of Qingcheng county, rose with a few hundred followers under the slogan “I hate the inequality of rich and poor; today I will make it equal for you”. His band grew to tens of thousands and took counties in Qiongzhou and Shuzhou; at Pengshan they killed the hated county magistrate and stuffed his belly with coins. Wang Xiaobo was killed by an arrow in a battle at Jiangyuan late in 993, and his comrade Li Shun took the lead. In early 994 Li Shun took Chengdu, proclaimed himself King of Great Shu with an era name of his own, and sent his forces as far as the Jianmen Pass in the north and the Yangtze gorges in the east; his army failed in an eighty-day siege of Zizhou. The emperor Taizong sent the eunuch Wang Ji’en with armies over the Qinling and up the Yangtze. Chengdu was retaken in the summer of 994, with some 30,000 rebels killed, and Li Shun was captured and executed, though rumours long said he had escaped. His follower Zhang Yu fought on in eastern Sichuan until early 995, when his own men killed him. The new prefect of Chengdu, Zhang Yong, sent the captured rebels home to farm and restored order."
