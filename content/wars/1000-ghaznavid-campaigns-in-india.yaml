  - title: Thanesar, Nandana and Kashmir
    date: 1010–1015
    when: "1010"
    borders: "1015"
    countries: [pk, in]
    body:
      - In 1010 Mahmud returned to Multan, where Dawud had broken his treaty. This time he took Dawud prisoner and ended Ismaili rule there; the chroniclers say many of the Ismailis were killed. Anandapala kept the peace until his death in about 1010–1011. In 1011 or 1012 Mahmud crossed the Punjab and fell on Thanesar, a pilgrimage town north of Delhi, whose ruler fled. The town was plundered, and the bronze image of Chakrasvamin from its temple was taken to Ghazni and, according to al-Biruni, thrown into the hippodrome there.
      - Anandapala’s son Trilochanapala held the Shahi kingdom from the fortress of Nandana in the Salt Range. In March 1014 Mahmud forced the pass held by Trilochanapala’s son Bhimapala and took Nandana. Trilochanapala sought help from Kashmir, whose Lohara king Sangramaraja sent an army under his commander Tunga, but Mahmud defeated them on the river Tausi, and the land as far as the Jhelum became Ghaznavid. Years later al-Biruni used the hill at Nandana to measure the size of the Earth.
      - In 1015 Mahmud tried to follow the Kashmiris into their valley. He besieged Lohkot, a fortress in the Pir Panjal mountains on the road into Kashmir, for about a month, but could not take it. Snow and floods caught his army on the way back, and many men were lost. A second attempt in 1021 also failed, and Kashmir was never conquered by the Ghaznavids.
    facts:
      - [Thanesar plundered, "1011 or 1012"]
      - [Nandana taken, "March 1014"]
      - [Siege of Lohkot, "1015, abandoned"]
