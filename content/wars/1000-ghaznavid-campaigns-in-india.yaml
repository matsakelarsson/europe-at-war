id: ghaznavid-campaigns-in-india
name: Ghaznavid campaigns in India
start: "1000"
end: "1027"
tier: A
summary: "The raids and conquests of Mahmud of Ghazni in north-western and northern India. Between 1000 and 1027 the Ghaznavid sultan led some seventeen expeditions across the Indus. He broke the Hindu Shahi kingdom in battles from Peshawar (1001) to Nandana (1014), took Multan from its Ismaili rulers, plundered the temple towns of Nagarkot, Thanesar and Mathura, received the submission of the Pratihara king of Kannauj in 1018 and of the kings of Gwalior and Kalinjar in 1022–1023, and in January 1026 sacked the temple of Somnath on the coast of Gujarat. The treasure and captives paid for his wars in Central Asia and his buildings in Ghazni. The lasting conquest was the Punjab, which his successors ruled from Lahore until the Ghurids took it in 1186."
countries: [af, pk, in]
