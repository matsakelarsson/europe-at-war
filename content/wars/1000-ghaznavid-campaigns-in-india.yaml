steps:
  - title: Peshawar and the fall of Jayapala
    date: 1000–1002
    when: "1001-11-27"
    borders: "1001-11-27"
    countries: [af, pk]
    body:
      - At the end of the 10th century the Hindu Shahis ruled from Udabhandapura, also called Waihind, today Hund on the Indus, over the land between the Kabul valley and the Punjab. Their neighbour to the west was the Turkish state of Ghazni, founded by a former slave commander of the Samanids. Its ruler Sabuktigin defeated the Shahi king Jayapala twice in Laghman, east of Kabul, in about 988 and in 991, and the Shahis lost their lands in the Kabul valley. Sabuktigin’s son Mahmud took the throne in 998 and was soon recognised by the caliph in Baghdad. According to his court historian al-Utbi, he vowed to lead an expedition to India every year.
      - In 1000 Mahmud took some frontier forts, and in September 1001 he came down to Peshawar. On 27 November he met Jayapala’s army there. The chroniclers give Mahmud 15,000 horsemen and some 10,000 volunteers, and Jayapala 12,000 horsemen, 30,000 foot soldiers and 300 elephants. The Shahi army was routed, and Jayapala was captured with fifteen of his sons and grandsons. He was released for a ransom said to be 250,000 dinars and 50 elephants, leaving a son and a grandson as hostages, and Mahmud went on to take the Shahi capital at Hund. Jayapala, the chroniclers say, handed the throne to his son Anandapala and burned himself on a pyre; some historians doubt parts of the story.
    facts:
      - [Battle of Peshawar, "27 November 1001, Ghaznavid victory"]
      - [Strength as the chroniclers give it, "Mahmud about 25,000; Jayapala 42,000 and 300 elephants"]
      - [Jayapala’s ransom, "250,000 dinars and 50 elephants"]
