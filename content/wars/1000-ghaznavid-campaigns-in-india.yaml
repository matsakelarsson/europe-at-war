  - title: The Jats of the Indus and Mahmud’s last years
    date: 1027–1030
    when: "1027"
    borders: "1027"
    countries: [pk, af]
    body:
      - In 1027 Mahmud led his last campaign in India, against the Jats of the Indus who had attacked his army on its way back from Somnath. According to the chroniclers he had some 1,400 boats built at Multan, armed with iron spikes and each manned by archers and men with naphtha, and defeated the Jats’ much larger fleet on the river. The figures, which grow in the later histories, are uncertain. Mahmud fell ill on this campaign and never returned to India. He died at Ghazni on 30 April 1030.
      - His successors lost Khorasan to the Seljuks at Dandanaqan in 1040 and became, more and more, a dynasty of Ghazni and the Punjab. Lahore became a centre of Persian learning and of the Sufi saints who settled there, and raids from it reached as far as Benares in 1033. The Ghaznavid campaigns did not create an empire in northern India, but they broke the Hindu Shahis, weakened the Pratiharas and left a Muslim state on the Indus that the Ghurids took over in 1186 and used as their base for the conquest of the Ganges plain.
    facts:
      - [Battle with the Jats, "1027, Ghaznavid victory"]
      - [Death of Mahmud, "30 April 1030, Ghazni"]
    link: { href: "#/war/ghaznavid-seljuk-war", text: Ghaznavid–Seljuk war }
