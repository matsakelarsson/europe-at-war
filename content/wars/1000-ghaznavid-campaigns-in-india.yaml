notes:
  - The record is almost entirely Persian and Arabic. Al-Utbi’s Tarikh-i Yamini was written at Mahmud’s court; Gardizi wrote a generation later; al-Biruni, who lived in the Ghaznavid lands and travelled in the Punjab, described India and the effect of the raids. Later histories, above all Firishta’s of about 1600, add details that are not in the early sources. Indian inscriptions and chronicles say very little about the raids. Dates often differ by a year between the chroniclers, and their figures for armies, the dead, captives and treasure are claims, often inflated.
  - The count of seventeen expeditions is traditional; some were small raids and some lasted more than one season.
  - Historians differ on Mahmud’s aims. Encyclopaedia Iranica calls the primary motive “clearly financial rather than religious”; others stress the image of the ghazi, the warrior for the faith, that he cultivated with the caliph in Baghdad. The memory of the raids, above all of Somnath, has been retold very differently by Persian, Sanskrit and Jain writers and in colonial and modern times; Romila Thapar’s study of Somnath traces these accounts.
