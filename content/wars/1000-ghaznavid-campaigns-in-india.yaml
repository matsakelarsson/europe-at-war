  - title: Mathura and Kannauj
    date: 1018–1019
    when: "1018-12-20"
    borders: "1018-12-20"
    countries: [in]
    body:
      - In the autumn of 1018 Mahmud led his largest army yet into the Ganges plain. He crossed the Yamuna early in December. At Baran, today’s Bulandshahr, the raja Hardatta submitted and paid tribute. At Mahaban the chief Kulachand fought; his army was driven into the Yamuna, where many drowned, and he killed his wife and then himself. Mathura, the city of Krishna, was taken without resistance, and its temples were plundered and burned over several days. Al-Utbi quotes a letter in which Mahmud wrote that its greatest temple could not be built again for less than a hundred million dinars or in less than two hundred years.
      - On 20 December Mahmud reached Kannauj, the capital of the Gurjara-Pratihara kings, which had been fought over by the great powers of India for two centuries. Its king Rajyapala abandoned the city, whose forts on the Ganges fell in a single day, and later accepted Ghaznavid overlordship. Mahmud took the forts of Munj and Asi, and on 6 January 1019 defeated the raja Chandar Ray and captured his elephants. He returned to Ghazni with so many captives that, according to al-Utbi, slaves sold there for a few dirhams.
    facts:
