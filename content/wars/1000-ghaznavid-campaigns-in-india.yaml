  - title: Somnath
    date: October 1025 – April 1026
    when: "1026-01-08"
    borders: "1026-01-08"
    countries: [in, pk, af]
    body:
      - On 18 October 1025 Mahmud left Ghazni for Gujarat with, the chroniclers say, about 30,000 horsemen and many volunteers. He rested at Multan in late November and then crossed the Thar desert, with camels carrying water and fodder, taking the fort of Lodurva near today’s Jaisalmer on the way. In late December he reached Anhilwara (Patan), the capital of the Chaulukya king Bhima I, who fled to the fortress of Kanthkot in Kutch. Mahmud then marched south-west across the Kathiawar peninsula, scattering local forces that tried to stop him.
      - He reached Somnath on the coast on 6 January 1026. Its temple of Shiva was one of the richest and most visited in India, and the town was defended by its people and by chiefs of the neighbourhood. After two days of fighting the walls were stormed, and the town fell on 8 January. The temple was plundered and its stone linga broken; pieces of it, the Persian historians say, were set into the steps of the Friday mosque at Ghazni. The booty was said to be worth 20 million dinars. The later claim that 50,000 defenders were killed became a set figure in Persian writing; Romila Thapar calls it a boastful claim.
      - To avoid an army gathering under the ruler of Mount Abu, Mahmud returned through Kutch and Sindh, plundering Kanthkot and Mansura, the old Arab capital of Sindh, whose ruler was driven out. Jats of the lower Indus harassed the column, and many men and animals died in the desert before the army reached Ghazni on 2 April 1026. The caliph sent Mahmud new titles. In Gujarat the temple was repaired within a few years; a Kadamba inscription of 1038 that records a royal pilgrimage there does not mention any damage, and the Chaulukya king Kumarapala rebuilt it in stone in 1169. The raid became a symbol, told and retold by Persian, Sanskrit and Jain writers and later by colonial and nationalist historians, and historians still disagree about what it meant at the time.
    facts:
