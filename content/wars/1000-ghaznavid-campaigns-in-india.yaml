  - title: Kalinjar, Gwalior and Lahore
    date: 1019–1023
    when: "1019"
    borders: "1023"
    countries: [in, pk]
    body:
      - Rajyapala’s submission angered the Chandela king Vidyadhara of Kalinjar, the strongest ruler of central India. He and his allies killed Rajyapala and put Rajyapala’s son on the throne of Kannauj. Mahmud marched again in 1019. He defeated the Shahi king Trilochanapala, who had joined the Chandelas, on the river Rahib, probably the Ramganga east of the Ganges, and faced Vidyadhara’s army, which withdrew without a decisive battle. Trilochanapala was killed by his own mutinous troops in 1021, and in 1021–1022 Mahmud besieged Lahore, from which his son Bhimapala fled. The Punjab was annexed and given a Ghaznavid governor.
      - In 1022 Mahmud returned to central India. Gwalior, held by the Kachchhapaghata king Kirtiraja, surrendered after four days and gave 35 elephants. Vidyadhara, besieged in Kalinjar, offered 300 elephants and became a tributary, and Mahmud left him fifteen fortresses. Bhimapala, the last Hindu Shahi king, died in 1026. The Ghaznavids now held the land from the Hindu Kush to the Punjab, and Lahore, with Multan, became the base of Ghaznavid India for more than 150 years.
    facts:
