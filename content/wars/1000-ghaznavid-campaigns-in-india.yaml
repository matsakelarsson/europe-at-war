  - title: Multan, Chach and Nagarkot
    date: 1004–1009
    when: "1006"
    borders: "1009"
    countries: [pk, in]
    body:
      - In 1004–1005 Mahmud attacked Bhatiya, a town whose site is disputed, and its ruler killed himself after a three-day battle. In the spring of 1006 he marched against Multan, ruled by the Ismaili Abu’l-Fath Dawud. Anandapala refused him passage through the Shahi lands and was defeated near the Indus, fleeing into the Kashmir hills. Multan was besieged for about a week and agreed to pay tribute. When the Kara-Khanids crossed the Oxus into Khorasan, Mahmud hurried back, leaving Multan to Sukhapala, a grandson of Jayapala who had become a Muslim. Sukhapala returned to his old faith and rebelled, and in 1008 Mahmud came back, captured him and imprisoned him for life.
      - Anandapala now gathered a larger army; later chroniclers say that the kings of Ujjain, Gwalior, Kalinjar, Kannauj, Delhi and Ajmer sent troops, which modern historians doubt. The armies faced each other on the plain of Chach, near Hazro east of the Indus, for some forty days. When battle came, around the turn of 1008–1009, a charge by the Khokhar (or Gakhar) hillmen on the Shahi side broke into the Ghaznavid camp, but Mahmud’s guard attacked from the rear and the Shahi army fled. Mahmud pursued it to the Kangra valley and took the fort of Nagarkot after a siege of three days, carrying off the treasure of its temples. Anandapala made peace, becoming a tributary who sent troops when asked.
    facts:
      - [Multan, "1006, submits and pays tribute"]
      - [Battle of Chach, "31 December 1008 (or early 1009), Ghaznavid victory"]
      - [Nagarkot, "1009, taken after a three-day siege"]
