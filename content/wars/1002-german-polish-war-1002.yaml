id: german-polish-war-1002
name: German–Polish War, 1002–1018
start: "1002"
end: "1018"
tier: B
summary: A series of wars between Bolesław I the Brave of Poland and the German king Henry II over Lusatia, Meissen and Bohemia. Bolesław briefly ruled Bohemia and lost Lusatia in 1005, but held off three German invasions and kept Lusatia and Milsko under the Peace of Bautzen in 1018.
