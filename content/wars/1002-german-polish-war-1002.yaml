  - id: pl
    name: Poland
    polities: [poland]
    ink: magenta
    moves: Polish moves
    success: Polish success
  - id: de
    name: Henry II and his allies
    polities: [hre, east-francia, bohemia]
    ink: gold
    moves: Moves by Henry II and his allies
    success: Success for Henry II and his allies
notes:
  - Most of what is known comes from the chronicle of Thietmar, bishop of Merseburg, a contemporary who was hostile to Bolesław. Dates and details are often uncertain.
  - Milsko (Milzenerland) was the land around Bautzen, later called Upper Lusatia; Lusatia proper was later Lower Lusatia.
