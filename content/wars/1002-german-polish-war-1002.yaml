steps:
  - title: Meissen, Lusatia and Bohemia
    date: 1002–1005
    when: "1002"
    borders: "1005"
    countries: [pl, de, cz]
    body:
      - "Bolesław had been a friend and ally of Emperor Otto III, who visited him at Gniezno in 1000. When Otto died without an heir in January 1002 and Margrave Eckard of Meissen, a claimant to the throne, was murdered that April, Bolesław moved into the eastern marches. He occupied Lusatia and Milsko, the land around Bautzen, and took Meissen. At Merseburg in July the new king, Henry II, let him keep Lusatia and Milsko as fiefs but not Meissen. As Bolesław left, armed men attacked him; he blamed Henry."
      - "Early in 1003 Bolesław intervened in Bohemia, had its duke, Boleslaus III, blinded and ruled the country himself, refusing to do homage to Henry for it. Henry made an alliance with the pagan Lutici, which shocked many Saxon churchmen, and in 1004 drove the Poles out of Bohemia, installed Duke Jaromír and took Bautzen. In 1005 he crossed the Oder and marched to Poznań. Bolesław avoided battle and harried the invaders, but in the peace that followed he gave up Lusatia and Milsko, though he kept Moravia."
    facts:
      - [Merseburg, 25 July 1002]
      - [Bolesław in Bohemia, 1003–1004]
      - [Peace of Poznań, "1005, Lusatia and Milsko given up"]
    markers:
      - kind: taken
        side: pl
        name: Meissen
        date: "1002"
