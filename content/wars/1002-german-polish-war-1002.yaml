  - title: Niemcza and the Peace of Bautzen
    date: 1007–1018
    when: "1007"
    borders: "1018-01-30"
    countries: [pl, de]
    body:
      - "War broke out again in 1007. Bolesław retook Lusatia and Milsko and raided as far as the neighbourhood of Magdeburg, and German campaigns in 1010 and 1012 achieved little. At Merseburg in 1013 he did homage to Henry and kept the two lands as fiefs. But he did not help Henry in Italy as promised, and in 1015 the king, again with the Lutici, invaded once more. He got no further than Krosno on the Oder, and in the fighting Margrave Gero and some 200 knights were killed."
      - "In 1017 Henry marched to Głogów, found it too strong to besiege and turned on Niemcza instead. Its defenders held out, and with sickness in his army he withdrew through Bohemia. Peace was made at Bautzen on 30 January 1018. Bolesław kept Lusatia and Milsko, whether as imperial fiefs or outright is still debated, and married Oda, a daughter of Eckard of Meissen. That summer, with German and Hungarian help, he marched on Kiev, entered it on 14 August and restored his son-in-law Sviatopolk to its throne."
    facts:
      - [Peace of Merseburg, "1013, Bolesław does homage to Henry"]
      - [Siege of Niemcza, "1017, held by the Poles"]
      - [Peace of Bautzen, 30 January 1018]
    markers:
      - kind: battle
        side: pl
        name: Krosno
        date: "1015"
        text: Henry II’s invasion stalled here on the Oder. In the fighting Margrave Gero and some 200 German knights were killed, many by Polish bowmen.
        lonlat: [15.1, 52.05]
      - kind: held
        side: pl
        name: Głogów
        date: "1017"
        text: Bolesław waited here with his army. Henry judged the town too strongly fortified to attack.
        lonlat: [16.0803, 51.6589]
        lp: l
      - kind: held
        side: pl
        name: Siege of Niemcza
        date: Late summer 1017
        text: Reinforcements twice slipped into the besieged town. Even Thietmar, no friend of the Poles, praised the defenders’ courage.
        lonlat: [16.8333, 50.7167]
      - kind: treaty
        side: pl
        name: Peace of Bautzen
        date: 30 January 1018
        text: Agreed by Henry’s envoys and Bolesław. Thietmar called it a peace “not as it should have been, but as it could be made”.
        lonlat: [14.4242, 51.1814]
