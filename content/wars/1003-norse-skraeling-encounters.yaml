notes:
  - The dates are estimates. The sagas give no years, and historians date Thorvald’s voyage to about 1003–1005 and Karlsefni’s to about 1009–1012 by counting back from the lives of the people in them; the tree rings at L’Anse aux Meadows show the Norse there in 1021. The sagas contradict each other on many points and include legendary episodes, such as the one-legged creature that kills Thorvald in the Saga of Erik the Red.
  - Skræling was the Norse name for the people, not their own. Where Vinland lay is debated; L’Anse aux Meadows may have been a base for voyages farther south, since butternuts found there grow no farther north than New Brunswick. The Icelandic annals record that in 1379 Skrælings attacked the Greenlanders, killed eighteen men and carried off two boys.
