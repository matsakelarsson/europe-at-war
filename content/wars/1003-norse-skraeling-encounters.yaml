id: norse-skraeling-encounters
name: Norse encounters with the Skrælings in Vinland
start: "1003"
end: "1012"
tier: C
summary: "The first recorded fighting between Europeans and the peoples of the Americas, during the Norse voyages from Greenland to the lands they called Helluland, Markland and Vinland in the early eleventh century. The two Icelandic sagas of Vinland, the Saga of the Greenlanders and the Saga of Erik the Red, written down some two centuries later, tell that Leif Eriksson’s brother Thorvald and his men killed eight people they found sleeping under three skin boats; the next day a large party attacked the Norse ships and Thorvald was killed by an arrow. A few years later Thorfinn Karlsefni tried to settle Vinland with, by one saga’s count, three ships and 140 or more people. At first they traded red cloth and milk for furs with the people the Norse called Skrælings, but after a quarrel, or by the other saga after a bull frightened them, the Skrælings came back in force; two Norse were killed and many of the attackers, and Karlsefni’s people, outnumbered and with no hope of help, went back to Greenland after about three years. The site at L’Anse aux Meadows in northern Newfoundland, where wood was cut with metal tools in 1021, is the only confirmed Norse site in North America outside Greenland. The people the Norse met in Vinland were probably ancestors of the Beothuk, the Innu or the Mi’kmaq; in Greenland, where the word skræling was later used for the Thule ancestors of the Inuit, the Norse traded and sometimes fought with them until the Norse settlements were abandoned in the fifteenth century."
