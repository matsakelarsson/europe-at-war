notes:
  - Some sources name the battlefield after the bridge of Charkhiyan near Balkh, and some date the battle to 1007. The figure of about 50,000 men for the Kara-Khanid army and of 500 elephants for Mahmud’s come from the chroniclers and are uncertain.
