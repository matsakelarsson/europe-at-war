id: ghaznavid-karakhanid-war
name: Ghaznavid–Karakhanid war
start: "1006"
end: "1008-01-05"
tier: C
summary: The war over Khorasan between Mahmud of Ghazni and the Kara-Khanid ruler Nasr, the Ilig Khan, who had divided the lands of the Samanids between them along the Oxus in 999. In 1006, while Mahmud was campaigning at Multan in India, the Ilig Khan sent two armies across the river; Chaghartigin took Balkh and Subashitigin took Herat. Mahmud hurried back and drove them out within months. In 1008 the Ilig Khan returned with his kinsman Yusuf Qadir Khan and a large army, but on 5 January 1008, on the plain of Katar about 20 km from Balkh, Mahmud’s army and its war elephants routed them, and many Kara-Khanid soldiers drowned in the Oxus as they fled. The frontier stayed on the Oxus, and relations improved under the Ilig Khan’s successors.
