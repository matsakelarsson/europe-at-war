steps:
  - title: Coup, counter-coup and the sack of Córdoba
    date: 1009–1013
    when: "1009"
    borders: "1013-05-31"
    countries: [es]
    body:
      - Almanzor’s son Abd al-Malik ruled al-Andalus in the name of the caliph Hisham II until he died in 1008. His brother Abd al-Rahman, nicknamed Sanchuelo, went further and made the childless caliph name him heir, outraging the Umayyad family and the people of Córdoba. While he was campaigning against Castile early in 1009, an Umayyad prince, Muhammad, seized Córdoba, forced Hisham to abdicate and took the title al-Mahdi. Sanchuelo was killed in March, and the palace city of Almanzor’s family, Madinat al-Zahira, was plundered and destroyed.
      - The Berber troops whom Almanzor had brought over were hated in the city, and they set up a caliph of their own, another Umayyad, Sulayman. With help from Count Sancho García of Castile they beat al-Mahdi outside Córdoba and took the city that autumn. Al-Mahdi and the Slav general Wadih then hired the counts of Barcelona and Urgell, whose troops helped retake Córdoba in 1010 and plundered it. Al-Mahdi was murdered that July and Hisham II restored, but the Berbers sacked Madinat al-Zahra and blockaded Córdoba until they stormed it in May 1013, killing and plundering. Sulayman was caliph again, and Hisham II disappeared.
    facts:
      - [Coup of al-Mahdi, early 1009]
      - [Catalan expedition to Córdoba, "1010"]
      - [Córdoba sacked by the Berbers, "May 1013"]
    markers:
