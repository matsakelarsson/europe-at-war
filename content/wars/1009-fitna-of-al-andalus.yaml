  - title: Hammudids and the end of the caliphate
    date: 1016–1031
    when: "1016"
    borders: "1031-11-30"
    countries: [es, ma]
    body:
      - Sulayman ruled a shrunken realm. Slav generals had taken over the east around Almería, Denia and Valencia, and Berber chiefs held much of the south. In 1016 Ali ibn Hammud, governor of Ceuta and a descendant of the Prophet’s family, claimed that the vanished Hisham II had named him heir, took Córdoba, executed Sulayman and made himself caliph. For fifteen years Hammudids and Umayyads followed one another on the throne, some for only weeks, while real power passed to local rulers.
      - On 30 November 1031 the notables of Córdoba deposed the last Umayyad caliph, Hisham III, abolished the caliphate and governed the city as a council. Al-Andalus was left as a patchwork of taifa kingdoms. The Abbadids ruled Seville, the Aftasids Badajoz and the Dhul-Nunids Toledo; Zaragoza went to the Tujibids and then the Hudids, Granada to the Zirid Berbers, and the east to Slav rulers. Their rivalries let the Christian kingdoms demand tribute from them and, in time, conquer them.
    facts:
      - [Ali ibn Hammud takes Córdoba, "July 1016"]
      - [End of the caliphate, "30 November 1031"]
    markers:
      - kind: event
        side: ber
        name: Ceuta
        date: "1016"
        text: Ali ibn Hammud set out from Ceuta, where he was governor. His brother al-Qasim held Algeciras across the Strait.
        lonlat: [-5.316, 35.888]
      - kind: taken
        side: ber
        name: Córdoba
        date: July 1016
        text: Ali ibn Hammud entered the palace and had Sulayman executed. The city deposed its last caliph in 1031.
        lonlat: [-4.78, 37.89]
      - kind: event
        name: Seville
        date: From 1023
        text: The qadi Abu al-Qasim ibn Abbad took power in the city, founding the Abbadid dynasty, the strongest of the taifas.
        lonlat: [-5.995, 37.389]
      - kind: event
        name: Granada
        date: From 1013
        text: The Zirid Berber chief Zawi ibn Ziri made Granada his seat, and his family ruled it until 1090.
        lonlat: [-3.6, 37.175]
      - kind: event
        name: Denia
        date: From 1014
        text: The Slav ruler Mujahid made Denia a sea power, ruling the Balearic Islands and raiding Sardinia in 1015–1016.
        lonlat: [0.106, 38.84]
