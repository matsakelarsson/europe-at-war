        side: ber
        name: Córdoba
        date: 1009–1013
        text: The caliphal capital, perhaps the largest city in western Europe, changed hands four times in four years and was plundered each time, worst of all by the Berbers in 1013.
        lonlat: [-4.78, 37.89]
      - kind: taken
        side: ber
        name: Madinat al-Zahra
        date: "1010"
        text: The Berbers plundered and burned Abd al-Rahman III’s palace city. Its ruins were quarried for building stone for centuries.
        lonlat: [-4.867, 37.888]
        lp: l
      - kind: event
        side: chr
        name: Barcelona
        date: "1010"
        text: Count Ramon Borrell led a Catalan army to Córdoba for al-Mahdi. His brother Ermengol, count of Urgell, was killed in the campaign.
        lonlat: [2.177, 41.383]
      - kind: event
        side: chr
        name: Gormaz
        date: 1010–1011
        text: Sancho García of Castile won back the Duero fortresses Almanzor had taken, among them Gormaz, Osma and San Esteban, as the price of his help or his neutrality.
        lonlat: [-3.008, 41.494]
