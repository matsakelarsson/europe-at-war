id: fitna-of-al-andalus
name: Fitna of al-Andalus
start: "1009"
end: "1031-11-30"
tier: B
summary: The civil war that destroyed the caliphate of Córdoba. A coup against Almanzor’s son in 1009 set the people of Córdoba, the Berber troops and the Slav generals against each other, with Castilian and Catalan armies hired by rival caliphs; Córdoba and the palace city of Madinat al-Zahra were sacked, and after two decades in which Umayyad and Hammudid caliphs came and went, the caliphate was abolished in 1031 and al-Andalus broke up into taifa kingdoms.
countries: [es, ma]
sides:
  - id: cor
    name: Córdoba and the Umayyad party
    polities: [cordoba]
    ink: green
    moves: Moves by the Córdoban party
    success: Success for the Córdoban party
  - id: ber
    name: The Berber troops and their caliphs
    polities: []
    ink: orange
    moves: Berber moves
    success: Berber success
  - id: chr
    name: Christian allies
    polities: [castile, barcelona]
    ink: gold
    moves: Moves by Christian allies
    success: Success for Christian allies
notes:
  - Fitna is Arabic for strife or civil war. The sources, written later and mostly by Andalusi authors hostile to the Berbers, disagree on many dates; those given here are the ones most historians accept.
  - The Slavs (Saqaliba) were soldiers and officials of European, often slave, origin. The Berbers were North African troops brought over in large numbers by Almanzor.
  - The war is part of the longer story told in the Reconquista.
