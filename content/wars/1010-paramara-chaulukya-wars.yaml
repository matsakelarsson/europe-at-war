notes:
  - The start and end dates are approximate. The first wars fall in Bhoja’s reign, which began in about 1010, and the last in Arjunavarman’s, which ended in about 1215; there were earlier border fights over Lata (southern Gujarat) in the late 10th century.
  - Much of the detail comes from Jain chronicles of the 13th and 14th centuries, such as Merutunga’s Prabandha-Chintamani, which historians treat with caution, and from the two dynasties’ inscriptions, which each claim victories over the other.
