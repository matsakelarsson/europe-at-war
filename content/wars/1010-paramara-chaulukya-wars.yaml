id: paramara-chaulukya-wars
name: Paramara–Chaulukya wars
start: "1010"
end: "1215"
tier: C
summary: "The wars, on and off for two centuries, between the Paramaras of Malwa, ruling from Dhara, and their western neighbours, the Chaulukyas (Solankis) of Gujarat, ruling from Anahilapataka (Patan). Under the scholar-king Bhoja (about 1010–1055) the Paramaras had the upper hand; a later Jain chronicle says his general Kulachandra sacked the Chaulukya capital while Bhima I was away fighting in Sindh. Bhima allied with the Kalachuri king Lakshmi-Karna, and the two invaded Malwa from both sides as Bhoja lay dying in about 1055. In 1135–1136 Jayasimha Siddharaja took Dhara and annexed Malwa after a long war with the Paramara kings Naravarman and Yashovarman, and in about 1150 his successor Kumarapala defeated the usurper Ballala and kept Malwa as a Chaulukya province. The Paramara Vindhyavarman restored the kingdom between the 1170s and 1190s, defeating Mularaja II, and his successors carried the war into Gujarat. Subhatavarman invaded it in about 1204, when the Chaulukyas were weakened by the Ghurid invasions, and Arjunavarman defeated the usurper Jayantasimha in the early 1210s."
countries: [in]
