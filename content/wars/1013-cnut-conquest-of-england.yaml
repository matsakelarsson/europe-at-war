id: cnut-conquest-of-england
name: Danish conquest of England
start: "1013-08"
end: "1016-11-30"
tier: B
summary: The conquest of England by the Danish king Sweyn Forkbeard in 1013 and, after his death, by his son Cnut in 1015–1016. Cnut’s victory at Assandun made him king of England, and later of Denmark and Norway, ruling a North Sea empire until 1035.
