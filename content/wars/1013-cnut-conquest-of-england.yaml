    name: Denmark
    polities: [denmark]
    ink: red
    moves: Danish moves
    success: Danish success
  - id: eng
    name: England
    polities: [england]
    ink: navy
    moves: English moves
    success: English success
notes:
  - The main English source is the Anglo-Saxon Chronicle; the Encomium Emmae Reginae, written for Cnut’s queen, gives a Danish-friendly account.
  - The site of the Battle of Assandun is disputed. It is shown at Ashingdon in south-east Essex, the traditional identification; some historians prefer Ashdon in the north of the county.
