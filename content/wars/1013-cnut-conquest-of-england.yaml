  - title: Cnut, Assandun and the North Sea empire
    date: 1015–1035
    when: "1016-10-18"
    borders: "1016-11-30"
    countries: [gb, dk, "no"]
    body:
      - The Danish army chose Cnut as its king, but the English recalled Æthelred and drove him out. Cnut sailed for Denmark, leaving the mutilated hostages his father had taken on the beach at Sandwich. He returned in September 1015 with a great fleet and harried Dorset, Wiltshire and Somerset. Ealdorman Eadric Streona went over to him, and Wessex submitted. When Æthelred died in April 1016, the Londoners chose his son Edmund Ironside as king, while the leading men gathered at Southampton chose Cnut.
      - Edmund fought hard all summer. He fought the Danes at Penselwood and Sherston, relieved the siege of London and won at Brentford and Otford. But on 18 October 1016, at Assandun in Essex, Eadric withdrew his men in the middle of the battle and the English were routed. At Alney, an island near Deerhurst, the kings agreed that Edmund would keep Wessex and Cnut take the lands north of the Thames. Edmund died on 30 November, and Cnut became king of all England.
      - Cnut married Æthelred’s widow, Emma of Normandy, and in 1018 raised a vast tax of £72,000, plus £10,500 from London, to pay off his fleet. He became king of Denmark after his brother Harald, beat the Norwegians and Swedes at the Helgeå, probably in 1026, and in 1028 drove Olaf Haraldsson out of Norway. When he died at Shaftesbury in 1035, his North Sea empire soon fell apart.
    facts:
      - [Battle of Assandun, "18 October 1016, Danish victory"]
      - [Cnut king of England, "From November 1016"]
      - [Cnut’s kingdoms, "England, Denmark (from about 1018) and Norway (1028–1035)"]
