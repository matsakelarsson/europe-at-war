steps:
  - title: Sweyn Forkbeard takes England
    date: 1013–1014
    when: "1013-08"
    borders: "1013-12"
    countries: [gb, dk]
    body:
      - For more than twenty years Viking armies had raided England and been paid ever larger sums of silver, the Danegeld, to leave. In 1002 King Æthelred ordered the killing of the Danes living in England, the St Brice’s Day massacre. Between 1009 and 1012 the army of Thorkell the Tall ravaged the south-east, took Canterbury and killed its archbishop, before Thorkell changed sides and entered Æthelred’s service.
      - In August 1013 the Danish king, Sweyn Forkbeard, came with his son Cnut to conquer the country. He sailed up the Humber and the Trent to Gainsborough, where Northumbria, Lindsey and the Danish towns of the east Midlands submitted at once. Marching south, he took Oxford and Winchester. London, held by Æthelred and Thorkell, beat off his attack, but after the western thegns submitted at Bath, the Londoners gave in too. Æthelred fled to Normandy, and Sweyn was accepted as king. He died at Gainsborough on 3 February 1014.
    facts:
      - [Sweyn lands, "August 1013, at Sandwich"]
      - [Sweyn accepted as king, "December 1013"]
      - [Sweyn’s death, "3 February 1014, at Gainsborough"]
