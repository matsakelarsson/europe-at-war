notes:
  - The main sources are the Georgian Chronicles, the Armenian historian Aristakes Lastivertsi and John Skylitzes; they disagree on the battles of 1021–1022. Byzantine and Georgian fighting over the borderlands flared again in 1028.
  - Tao and Artaan lie in today’s north-eastern Turkey (around Yusufeli and Ardahan), Javakheti in southern Georgia.
