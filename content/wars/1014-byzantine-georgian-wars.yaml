id: byzantine-georgian-wars
name: Byzantine–Georgian wars
start: "1014"
end: "1022"
tier: C
summary: The war between Basil II and King George I of Georgia over the inheritance of David III of Tao, who on his death in 1000 had left his lands in the Byzantine–Georgian borderland to the emperor. George occupied Tao in 1014–1016, while Basil was fighting Bulgaria. In 1021 Basil invaded with a large army, including the Varangian Guard, and ravaged Georgian lands; George allied with two Byzantine generals who rebelled in Basil’s rear, and in the winter the Armenian king of Vaspurakan ceded his kingdom to the empire. After a crushing defeat at Svindax in 1022, George gave up Tao, Phasiane, Kola, Artaan and Javakheti and sent his young son Bagrat to Constantinople as a hostage.
countries: [ge, tr, am]
