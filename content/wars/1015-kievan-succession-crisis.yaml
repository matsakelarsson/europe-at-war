id: kievan-succession-crisis
name: Kievan succession crisis, 1015–1019
start: "1015"
end: "1019"
tier: C
summary: A war among the sons of Vladimir I of Kiev after his death in 1015. Sviatopolk seized Kiev, and three of his brothers, Boris, Gleb and Sviatoslav, were murdered; Boris and Gleb were later venerated as the first saints of Rus’. Yaroslav of Novgorod drove Sviatopolk out after a battle at Liubech, lost Kiev in 1018 to Sviatopolk and his father-in-law, Bolesław I of Poland, who is said to have taken the Cherven towns on his way home, and won the throne for good on the Alta in 1019.
countries: [ua, ru, by, pl]
sides:
  - id: yar
    name: Yaroslav of Novgorod
    polities: [kievan-rus]
    ink: green
    moves: Yaroslav’s moves
    success: Success for Yaroslav
  - id: svp
    name: Sviatopolk and his allies
    polities: [poland, pechenegs]
    ink: magenta
    moves: Moves by Sviatopolk and his allies
    success: Success for Sviatopolk and his allies
notes:
  - The Primary Chronicle, compiled about a century later under Yaroslav’s descendants, blames Sviatopolk, whom it calls “the Accursed”, for the murders. Thietmar of Merseburg and the Norse Eymund saga tell different stories, and some historians think Yaroslav was behind the death of Boris.
  - The battle at Liubech is dated to the autumn of 1015 or to 1016. Bolesław’s march on Kiev in 1018 is also told under the German–Polish War, 1002–1018.
