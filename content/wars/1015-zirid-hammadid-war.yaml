id: zirid-hammadid-war
name: Zirid–Hammadid War
start: "1015"
end: "1018-01-05"
tier: C
summary: "The war that split the Zirid realm, which ruled Ifriqiya and the central Maghreb for the Fatimid caliphs of Cairo, into two Sanhaja Berber states. Hammad ibn Buluggin, uncle of the Zirid emir Badis and governor of the west from his new fortress capital, the Qal’a in the Hodna mountains, refused in about 1014 to give up Constantine and other towns to Badis’s heir; he had the Abbasid caliph named in the Friday sermon instead of the Fatimid and killed Shi’is in his lands. In 1015 he took and sacked Béja. Badis seized Ashir, beat Hammad on the Chelif river in the autumn and besieged him in the Qal’a from November, but died in his camp in May 1016, and the Zirid army went home. Hammad recovered his lands and beat a Zirid force near Ashir. The young emir al-Mu’izz ibn Badis defeated him in August 1017 while Hammad was besieging Baghaya, and by a treaty of 5 January 1018, sealed by a marriage, recognised him as independent ruler of M’Sila, Tobna, the Zab, Ashir, Tahert and whatever else he could conquer in the central Maghreb. The two branches stayed rivals for more than a century: they recognised opposite caliphs, backed rival Arab tribes after the Hilalian invasion, fought at Sbiba in 1065, and the Hammadids attacked Mahdia in 1135. The Normans ended Zirid rule in 1148 and the Almohads the Hammadids in 1152."
