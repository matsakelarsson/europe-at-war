notes:
  - The war is known mainly from the North African chroniclers Ibn Idhari and Ibn Khaldun, who wrote two to three centuries later. Modern accounts differ on some dates and on how Badis died in his camp before the Qal’a. Some historians hold that the Hammadids recognised the Fatimids again for a time after the peace.
