id: fall-of-medang
name: Fall of Medang and Airlangga’s reconquest
start: "1016"
end: "1037"
tier: C
summary: "The destruction of the East Javanese kingdom of Medang (Mataram) and its rebuilding by Airlangga. In 1016 Haji Wurawari of Lwaram, a vassal king, fell on the capital, Wwatan, during a royal wedding; King Dharmawangsa Teguh was killed with much of his court, and the kingdom broke up into rival lordships. Many historians see Srivijaya behind the attack, as revenge for Dharmawangsa’s naval attack on Palembang in about 990, but the Javanese sources do not say so. Airlangga, Dharmawangsa’s nephew and the bridegroom, a son of King Udayana of Bali, escaped with his servant Narottama and lived among hermits at Vanagiri (Wonogiri). From 1019 former officials of Medang rallied to him, and between 1028 and 1035 he fought the kings who had taken parts of the old kingdom: Wisnuprabhawa of Wuratan, Wijayawarma of Wengker and Panuda of Lewa in 1029–1031; a queen of the south, remembered as Dyah Tulodong of Lodoyong, who sacked his capital Watan Mas in 1031 and was defeated in 1032; Wurawari himself at the end of 1032; and Wengker again in 1035, whose king fled and was killed by his own people. By 1037 Airlangga ruled eastern Java from his new capital Kahuripan in the Brantas delta. He made peace with Srivijaya, which the Chola raid of 1025 had weakened, and before his death in 1049 divided the kingdom between his sons as Janggala and Kediri (Panjalu)."
