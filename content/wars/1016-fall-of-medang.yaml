notes:
  - The war is known almost only from Airlangga’s own Pucangan inscription (the Calcutta Stone) of 1041 and his other charters. The year of the fall of Wwatan is read from the inscription as 938 Śaka, 1016 (Kern, de Casparis); older books, Britannica among them, give 1006, and Griffiths and others read 1017. Many of the places named in the inscriptions, Lwaram, Wuratan and Lewa among them, cannot be located with certainty; Wwatan is placed near Maospati in Magetan, and Wengker around Ponorogo.
