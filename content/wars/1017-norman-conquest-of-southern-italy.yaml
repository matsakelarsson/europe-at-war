steps:
  - title: Melus and the first Normans
    date: 1009–1030
    when: "1017"
    borders: "1030"
    countries: [it]
    side_names:
      nor: Melus and his Norman mercenaries
    body:
      - On 9 May 1009 Melus, a Lombard noble of Bari, led a revolt against Byzantine rule in Apulia. It failed, and he fled. The chroniclers tell how in about 1016 he met Norman pilgrims at the shrine of St Michael on Monte Gargano and asked them to bring fighting men; whatever the truth of the story, Norman knights, many of them younger sons with no land at home, were soon serving in the south. In 1017 Melus rose again with their help and won several battles in northern Apulia.
      - In 1018 the new Byzantine catepan, Basil Boioannes, crushed Melus and his Normans on the Ofanto near Cannae, where Hannibal had beaten the Romans. Melus fled to the Emperor Henry II and died in 1020. The surviving Normans hired themselves out to whoever would pay, the abbots of Montecassino, the Lombard princes of Capua and Salerno, the dukes of Naples and the Byzantines themselves. In early 1030 Duke Sergius IV of Naples gave one of their leaders, Rainulf Drengot, the town of Aversa, the first Norman lordship in Italy.
    facts:
      - [Revolt of Melus, "9 May 1009, Bari"]
      - [Battle of Cannae, "1018, Byzantine victory"]
      - [Aversa, "given to Rainulf Drengot, 1030"]
    markers:
      - kind: event
        side: nor
        name: Bari
        date: 9 May 1009
        text: Melus and his brother-in-law Dattus led the rising in the capital of Byzantine Italy. Both later fought on with Norman help.
        lonlat: [16.87, 41.13]
      - kind: event
        name: Monte Gargano
        date: about 1016
        text: According to Amatus of Montecassino, Norman pilgrims at the shrine of the archangel Michael promised Melus that they would come back with an army.
        lonlat: [15.96, 41.71]
      - kind: battle
        side: byz
        name: Battle of Cannae
        date: "1018"
        text: Boioannes, with a strong army that included Varangians sent from Constantinople, destroyed the rebels. Most of the Normans were killed.
        lonlat: [16.13, 41.31]
      - kind: event
        side: nor
        name: Aversa
        date: "1030"
        text: Sergius IV gave Rainulf the town between Naples and Capua, and his sister’s hand, in return for his help against Prince Pandulf IV of Capua.
        lonlat: [14.21, 40.97]
    arrows:
      - side: nor
        label: Melus, 1017
        via: [[14.9, 41.45], [15.4, 41.52], [15.95, 41.38]]
      - side: byz
        label: Boioannes
        via: [[16.85, 41.12], [16.5, 41.24], [16.17, 41.3]]
  - title: Maniakes and Melfi
    date: 1038–1047
    when: "1038"
    borders: "1042-09"
    countries: [it]
    body:
      - In 1038 the Byzantine general George Maniakes invaded Muslim Sicily, then torn between rival emirs. With him went Lombard troops and a few hundred Norman knights, among them William and Drogo, sons of Tancred of Hauteville, a minor lord from the Cotentin in Normandy. Maniakes took Messina and Syracuse and won a battle at Troina in 1040, but he quarrelled with his allies, the Normans went home unpaid, and he was recalled to Constantinople. The Muslims soon won back everything except Messina, which fell in 1042.
      - In 1041 the Normans joined a new Lombard rising in Apulia. From Melfi, a hill town on the Byzantine frontier, they beat the Byzantines three times in a year, on the Olivento on 16 March, at Montemaggiore near Cannae on 4 May and at Montepeloso on 3 September, where they captured the catepan. In September 1042 the Norman leaders met at Melfi and chose William Iron Arm as Count of Apulia, and soon afterwards they shared out the towns they had taken among twelve chiefs. William died in 1046, and in 1047 the Emperor Henry III recognised his brother Drogo as count.
    facts:
      - [Expedition of Maniakes, 1038–1040]
      - [Battle of Montepeloso, "3 September 1041, Norman victory"]
      - [William Iron Arm, "Count of Apulia, September 1042"]
    markers:
      - kind: battle
        side: byz
        name: Battle of Troina
        date: "1040"
        text: Maniakes beat a Muslim army in the hills west of Etna. Norman knights from Aversa fought for him.
        lonlat: [14.6, 37.78]
      - kind: taken
        side: byz
        name: Syracuse
        date: "1040"
        text: Maniakes took the city, the high point of the expedition. It was lost again soon after his recall.
        lonlat: [15.29, 37.07]
      - kind: battle
        side: nor
        name: Battle of the Olivento
        date: 16 March 1041
        text: The first Norman victory over the Byzantine army, on a stream near Venosa.
        lonlat: [15.8, 41.05]
        lp: l
      - kind: battle
        side: nor
        name: Battle of Montemaggiore
        date: 4 May 1041
        text: The catepan Michael Dokeianos brought up Varangians and other troops from Sicily and was beaten again, near Cannae.
        lonlat: [16.22, 41.35]
      - kind: battle
        side: nor
        name: Battle of Montepeloso
        date: 3 September 1041
        text: The new catepan, Exaugustus Boioannes, son of the victor of Cannae, was defeated and taken prisoner.
        lonlat: [16.24, 40.75]
      - kind: event
        side: nor
        name: Melfi
        date: September 1042
        text: The Normans’ base in Apulia. Their leaders met here to choose William Iron Arm as their count.
        lonlat: [15.65, 41.0]
    arrows:
      - side: byz
        label: Maniakes
        via: [[15.55, 38.19], [15.0, 37.88], [14.62, 37.78], [15.22, 37.12]]
      - side: nor
        label: Normans, 1041
        via: [[15.65, 41.0], [15.95, 40.9], [16.2, 40.77]]
  - title: Civitate and the Treaty of Melfi
    date: 1051–1059
    when: "1051"
    borders: "1059-08-23"
    countries: [it]
    body:
      - The Normans’ plundering made them hated in Apulia and feared by their neighbours. Drogo was murdered in 1051, and Pope Leo IX, who had just taken Benevento under papal rule, raised an army against them, with the Byzantine governor Argyrus, Melus’s son, as his ally. Before the two could join forces, the Normans under Drogo’s brother Humphrey, Richard of Aversa and Robert Guiscard, another son of Tancred, met the pope’s Italian levies and Swabian foot soldiers at Civitate on 18 June 1053. The Swabians fought almost to the last man, and the pope was taken and held at Benevento for nine months.
      - Leo’s successors made their peace with the Normans. Humphrey died in 1057 and Robert Guiscard took over in Apulia; Reggio fell to him in 1060, completing the conquest of Calabria. Richard of Aversa made himself Prince of Capua in 1058. Pope Nicholas II, who needed allies against the Roman nobles and the German court, came to Melfi in 1059. On 23 August he invested Robert as “by the grace of God and St Peter Duke of Apulia and Calabria and, with their help, hereafter of Sicily”, and confirmed Richard in Capua. Both swore fealty to the pope.
    facts:
      - [Battle of Civitate, "18 June 1053, Norman victory; Leo IX captured"]
      - [Treaty of Melfi, 23 August 1059]
    markers:
      - kind: battle
        side: nor
        name: Battle of Civitate
        date: 18 June 1053
        text: The Normans, fewer and short of food, attacked before Argyrus could arrive. The pope, who had stayed in the town, fell into their hands after the battle.
        lonlat: [15.27, 41.73]
      - kind: event
        side: nor
        name: Benevento
        date: June 1053 – March 1054
        text: The Normans treated the captured pope with respect but kept him in the city until he had recognised their conquests.
        lonlat: [14.78, 41.13]
      - kind: taken
        side: nor
        name: Capua
        date: "1058"
        text: Richard of Aversa took the title of prince from the last Lombard ruler, Landulf VIII. The citadel held out until 1062.
        lonlat: [14.21, 41.11]
        lp: l
      - kind: treaty
        side: nor
        name: Melfi
        date: 23 August 1059
        text: At a synod in the Norman stronghold, Nicholas II turned the Normans from enemies of the papacy into its vassals.
        lonlat: [15.65, 41.0]
      - kind: taken
        side: nor
        name: Reggio
        date: "1060"
        text: Guiscard and his brother Roger took the last Byzantine town of note in Calabria.
        lonlat: [15.65, 38.11]
    arrows:
      - side: pap
        label: Leo IX
        via: [[13.5, 42.0], [14.3, 41.85], [15.2, 41.74]]
      - side: nor
        label: Humphrey and Guiscard
        via: [[15.65, 41.0], [15.55, 41.4], [15.32, 41.7]]
  - title: Messina, Cerami and Palermo
    date: 1061–1072
    when: "1061"
    borders: "1072-01-10"
    countries: [it]
    body:
      - Muslim Sicily had broken up among rival emirs, and in 1061 one of them, Ibn al-Thumna of Syracuse and Catania, asked the Normans for help against his rival Ibn al-Hawwas of Enna. In May Robert Guiscard and his youngest brother Roger crossed the strait and took Messina. They pushed inland but could not take Enna. Roger held on in the north-east, where in the winter of 1062–63 he and his wife were besieged in Troina by its own Greek townspeople. In June 1063, at Cerami, his small force routed a much larger army of Sicilian Muslims and Zirid troops from Africa.
      - Progress was slow while Guiscard was busy in Apulia. Roger won again at Misilmeri in 1068, and after Bari fell in 1071 the brothers turned on Palermo with an army and a fleet. The city was besieged by land and sea from August, and on 7 January 1072 the Normans broke into the outer city; the inner city surrendered a few days later, on terms that let the Muslims keep their religion and laws. Guiscard kept Palermo and parts of the north-east for himself and invested Roger with the rest as Count of Sicily.
    facts:
      - [Messina taken, May 1061]
      - [Battle of Cerami, "June 1063, Norman victory"]
      - [Palermo taken, "7–10 January 1072"]
    markers:
      - kind: taken
        side: nor
        name: Messina
        date: May 1061
        text: The Normans crossed at night and found the town almost undefended. It was their bridgehead for the next thirty years.
        lonlat: [15.55, 38.19]
      - kind: held
        side: mus
        name: Enna
        date: 1061–1087
        text: The mountain fortress, called Castrogiovanni by the Normans, held out for a quarter of a century.
        lonlat: [14.28, 37.57]
      - kind: held
        side: nor
        name: Troina
        date: 1062–1063
        text: Roger’s first capital in Sicily. He and his wife Judith survived a winter siege in the citadel after the townspeople rose against their Norman garrison.
        lonlat: [14.6, 37.78]
      - kind: battle
        side: nor
        name: Battle of Cerami
        date: June 1063
        text: Malaterra’s claim that 130 knights beat 35,000 men is not credible, but the victory secured the Normans’ hold on the north-east.
        lonlat: [14.5, 37.81]
        lp: l
      - kind: battle
        side: nor
        name: Battle of Misilmeri
        date: "1068"
        text: Roger destroyed a Muslim army near Palermo. The Zirids withdrew their troops from Sicily soon afterwards.
        lonlat: [13.45, 38.03]
        lp: b
      - kind: taken
        side: nor
        name: Palermo
        date: 7–10 January 1072
        text: The largest city of Muslim Sicily fell after a five-month siege. The great mosque was made a church again.
        lonlat: [13.36, 38.12]
    arrows:
      - side: nor
        label: Robert and Roger, 1061
        via: [[15.6, 38.2], [15.2, 37.95], [14.85, 37.62], [14.35, 37.57]]
      - side: nor
        label: Guiscard’s fleet, 1071
        via: [[15.65, 38.2], [15.0, 38.3], [14.0, 38.2], [13.42, 38.14]]
  - title: Bari, Amalfi and Salerno
    date: 1068–1080
    when: "1068-08"
    borders: "1077-05"
    countries: [it]
    body:
      - By 1068 the Byzantines held only a few towns on the Apulian coast. In August Guiscard laid siege to Bari, the capital of Byzantine Italy, closing its harbour with a line of ships. The town held out for nearly three years, and a relief fleet was beaten off. On 16 April 1071 Bari surrendered, ending more than five centuries of Byzantine rule in Italy. That August the Byzantines were routed by the Seljuk Turks at Manzikert, and they never came back. In 1073 Amalfi, afraid of its neighbour Salerno, accepted Guiscard as its lord.
      - The last Lombard principality, Salerno, was ruled by Gisulf II, brother of Guiscard’s wife Sichelgaita. Guiscard besieged it in 1076; the starving city surrendered on 13 December, and Gisulf held out in the citadel until May 1077. Guiscard made Salerno his capital. The last Lombard prince of Benevento died the same year, and the city passed to the pope. Gregory VII, who had excommunicated Guiscard for raiding papal lands, needed him against the Emperor Henry IV, and at Ceprano in June 1080 he lifted the ban and invested Guiscard with his lands again.
    facts:
      - [Fall of Bari, "16 April 1071, after a siege of nearly three years"]
      - [Fall of Salerno, "13 December 1076; citadel May 1077"]
      - [Treaty of Ceprano, June 1080]
    markers:
      - kind: taken
        side: nor
        name: Bari
        date: 16 April 1071
        text: The surrender ended Byzantine rule on the Italian mainland. Guiscard left the townspeople their property and customs.
        lonlat: [16.87, 41.13]
      - kind: event
        side: nor
        name: Amalfi
        date: "1073"
        text: The trading republic gave itself to Guiscard for protection against Gisulf of Salerno.
        lonlat: [14.6, 40.63]
        lp: b
      - kind: taken
        side: nor
        name: Salerno
        date: December 1076 – May 1077
        text: Guiscard blockaded the city by land and sea. Gisulf was allowed to leave and ended his days in papal service.
        lonlat: [14.76, 40.68]
      - kind: event
        side: pap
        name: Benevento
        date: "1077"
        text: When Prince Landulf VI died without an heir, the city passed to the papacy, which held it for most of the next 800 years.
        lonlat: [14.78, 41.13]
      - kind: treaty
        name: Ceprano
        date: June 1080
        text: Gregory VII and Guiscard made peace on the border of the Papal States.
        lonlat: [13.52, 41.55]
    arrows:
      - side: nor
        label: Guiscard, 1068
        via: [[15.65, 41.0], [16.2, 41.12], [16.82, 41.12]]
      - side: nor
        label: Guiscard, 1076
        via: [[15.6, 40.95], [15.2, 40.76], [14.82, 40.69]]
  - title: Durazzo, Rome and Noto
    date: 1081–1091
    when: "1081"
    borders: "1091-02"
    countries: [it, al, gr, mt]
    body:
      - In 1081 Guiscard attacked the Byzantine Empire itself, crossing the Adriatic with his son Bohemond. He beat the Emperor Alexios I Komnenos outside Dyrrhachium (Durrës) on 18 October and took the city in February 1082, but revolts in Apulia, encouraged with Byzantine money, called him home. In May 1084 he marched on Rome to rescue Gregory VII, besieged in Castel Sant’Angelo by Henry IV. His army freed the pope and then sacked the city, burning much of it, and Gregory had to leave with the Normans. Guiscard died of fever on Cephalonia on 17 July 1085, during a second Balkan campaign.
      - In Sicily Count Roger finished the conquest. Trapani fell in 1077 and Taormina in 1079. In May 1086 Roger attacked Syracuse, whose emir, known to the Normans as Benavert, was killed in a sea fight off the harbour; the city surrendered in October. The emir of Enna gave up his fortress in 1087 and became a Christian, Butera fell in 1088, and in February 1091 Noto, the last Muslim town, surrendered. That summer Roger raided Malta and made its emir pay tribute. Sicily’s Muslims, still perhaps the majority of its people, kept their faith and much of their law under Norman rule.
    facts:
      - [Battle of Dyrrhachium, "18 October 1081, Norman victory"]
      - [Sack of Rome, May 1084]
      - [Noto surrenders, "February 1091, end of the conquest of Sicily"]
    markers:
      - kind: battle
        side: nor
        name: Battle of Dyrrhachium
        date: 18 October 1081
        text: The Normans broke Alexios’s army, whose Varangian Guard, many of them English exiles, was cut down after charging too far ahead.
        lonlat: [19.45, 41.32]
      - kind: taken
        side: nor
        name: Rome
        date: May 1084
        text: Henry IV withdrew as Guiscard approached. The Normans freed Gregory VII, but their sack turned the Romans against the pope, who died in exile at Salerno in 1085.
        lonlat: [12.48, 41.89]
      - kind: event
        name: Cephalonia
        date: 17 July 1085
        text: Guiscard died of fever on the island during his second campaign against Byzantium, and the Balkan venture was given up.
        lonlat: [20.5, 38.25]
      - kind: taken
        side: nor
        name: Syracuse
        date: October 1086
        text: Roger’s fleet sailed from Messina and his son Jordan besieged the city by land for five months.
        lonlat: [15.29, 37.07]
      - kind: taken
        side: nor
        name: Enna
        date: "1087"
        text: The emir Ibn Hamud surrendered Castrogiovanni and became a Christian.
        lonlat: [14.28, 37.57]
      - kind: taken
        side: nor
        name: Noto
        date: February 1091
        text: The last Muslim stronghold surrendered, thirty years after the Normans first crossed the strait.
        lonlat: [15.07, 36.89]
      - kind: event
        side: nor
        name: Malta
        date: "1091"
        text: Roger landed, freed Christian captives and made the island’s Muslim ruler his tributary. Malta was fully annexed only in 1127.
        lonlat: [14.4, 35.89]
    arrows:
      - side: nor
        label: Guiscard, 1081
        via: [[18.0, 40.65], [18.9, 41.0], [19.4, 41.3]]
      - side: nor
        label: Guiscard, 1084
        via: [[14.76, 40.68], [14.0, 41.3], [12.6, 41.85]]
      - side: nor
        label: Roger, 1086
        via: [[15.55, 38.19], [15.35, 37.6], [15.31, 37.12]]
  - title: Roger II’s kingdom
    date: 1127–1139
    when: "1127"
    borders: "1139-07-25"
    countries: [it]
    side_names:
      pap: Innocent II, Lothair III and the rebel barons
    body:
      - Count Roger’s son Roger II, Count of Sicily since 1105, claimed Apulia when Guiscard’s grandson Duke William died childless in 1127. The pope and the mainland barons opposed him, but in 1128 Pope Honorius II had to invest him as duke. When the papal election of 1130 split the Church, Roger backed Anacletus II, who made him king, and he was crowned in Palermo on Christmas Day 1130. The rival pope, Innocent II, whom most of Europe recognised, and the Emperor Lothair III refused to accept the new kingdom, and the mainland barons rose under Roger’s brother-in-law Ranulf of Alife and Prince Robert II of Capua.
      - Ranulf beat Roger at Nocera on 24 July 1132. In 1137 Lothair and Innocent marched south through Apulia, took Bari and Salerno and made Ranulf duke. When Lothair turned for home, Roger struck back, but Ranulf beat him again at Rignano on 30 October 1137. Lothair died that December and Ranulf in April 1139. On 22 July 1139 Roger’s son ambushed the papal army at Galluccio and captured Innocent II, who three days later at Mignano recognised Roger as King of Sicily, Duke of Apulia and Prince of Capua. Naples submitted that year and the Abruzzi were conquered in 1140.
    facts:
      - [Coronation of Roger II, "Palermo, 25 December 1130"]
      - [Battle of Rignano, "30 October 1137, victory for Ranulf"]
      - [Treaty of Mignano, "25 July 1139, Roger recognised as king"]
    markers:
      - kind: event
        side: nor
        name: Palermo
        date: 25 December 1130
        text: Roger was crowned in the cathedral by a cardinal sent by Anacletus II. Palermo, with its Arab, Greek and Latin courtiers, became the capital of the kingdom.
        lonlat: [13.36, 38.12]
      - kind: battle
        side: pap
        name: Battle of Nocera
        date: 24 July 1132
        text: Ranulf and Robert of Capua routed Roger’s army near the Sarno, and Roger fled to Salerno.
        lonlat: [14.64, 40.75]
      - kind: taken
        side: pap
        name: Bari
        date: "1137"
        text: The townspeople rose against Roger, and Lothair’s army took the citadel after a siege.
        lonlat: [16.87, 41.13]
      - kind: battle
        side: pap
        name: Battle of Rignano
        date: 30 October 1137
        text: Roger’s second defeat by Ranulf. Duke Sergius VII of Naples, fighting for Roger, was killed.
        lonlat: [15.59, 41.68]
      - kind: battle
        side: nor
        name: Battle of Galluccio
        date: 22 July 1139
        text: Roger’s son, Duke Roger of Apulia, fell on the papal army with about a thousand knights and took the pope prisoner.
        lonlat: [13.95, 41.35]
        lp: l
      - kind: treaty
        side: nor
        name: Mignano
        date: 25 July 1139
        text: The captive pope recognised the kingdom, which lasted, in one form or another, until 1861.
        lonlat: [13.98, 41.41]
      - kind: taken
        side: nor
        name: Naples
        date: "1139"
        text: Without a duke since Rignano, the city accepted Roger’s rule and his son Alfonso as its duke.
        lonlat: [14.25, 40.85]
    arrows:
      - side: pap
        label: Lothair III, 1137
        via: [[13.9, 42.4], [15.0, 41.95], [16.0, 41.5], [16.8, 41.16]]
      - side: nor
        label: Duke Roger, 1139
        via: [[14.35, 41.05], [14.1, 41.25], [13.98, 41.34]]
