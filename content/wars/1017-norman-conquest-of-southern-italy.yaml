id: norman-conquest-of-southern-italy
name: Norman conquest of southern Italy
start: "1017"
end: "1139-07-25"
tier: A
summary: The piecemeal conquest of southern Italy and Sicily by Norman adventurers, who came as mercenaries for Lombard rebels and princes and made themselves lords. Led by the Hauteville brothers and the Drengots of Aversa and Capua, they took Byzantine Apulia and Calabria (Bari fell in 1071), the last Lombard principalities and Muslim Sicily (1061–1091), and in 1130 Roger II united their lands as the Kingdom of Sicily, which the papacy recognised in 1139.
countries: [it, mt, al, gr]
sides:
  - id: nor
    name: The Normans
    polities: [apulia, capua, sicily]
    ink: blue
    moves: Norman moves
    success: Norman success
  - id: byz
    name: Byzantine Empire
    polities: [byzantium]
    ink: purple
    moves: Byzantine moves
    success: Byzantine success
  - id: mus
    name: Muslims of Sicily
    polities: [emirate-of-sicily]
    ink: green
    moves: Muslim moves
    success: Muslim success
  - id: pap
    name: Popes, emperors and Lombard princes
    polities: [papal-states, hre, salerno, duchy-of-benevento, duchy-of-naples, gaeta]
    ink: gold
    moves: Papal, imperial and Lombard moves
    success: Papal, imperial and Lombard success
notes:
  - The Normans did not come as one army. Bands led by different families fought for themselves, for whoever paid them and often against each other; the Hautevilles in Apulia, Calabria and Sicily and the Drengots at Aversa and Capua became the leading families.
  - The main narrative sources, Amatus of Montecassino, William of Apulia and Geoffrey Malaterra, wrote for Norman patrons and often exaggerate the odds the Normans faced. Their numbers are not reliable.
  - Capua was a Lombard principality until Richard of Aversa made himself its prince in 1058. Benevento passed to the papacy in 1051 and for good in 1077.
