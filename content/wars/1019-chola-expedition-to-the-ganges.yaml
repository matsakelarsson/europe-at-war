id: chola-expedition-to-the-ganges
name: Chola expedition to the Ganges
start: "1019"
end: "1021"
tier: C
summary: "The northern campaign of the Chola emperor Rajendra I, about 1019–1021, which took a Chola army through Kalinga and Odisha to Bengal and the Ganges. It grew out of a disputed succession in Vengi, where Rajendra backed his nephew Rajaraja Narendra against a rival supported by the kings of Kalinga and Odisha. While Rajendra waited on the Godavari, his general Araiyan Rajarajan led the army north, defeating the Somavamshi king Indraratha in Odisha, Dharmapala of Dandabhukti, Ranasura of southern Radha, Govindachandra of Vangala in eastern Bengal and the Pala king Mahipala I, and brought back water from the Ganges. The campaign won no lasting territory in the north, but Rajendra took the title Gangaikonda, “who took the Ganges”, built a new capital, Gangaikonda Cholapuram, and made a great tank there, the Cholagangam, which his inscriptions call a liquid pillar of victory. Some historians once read the expedition as a pilgrimage; the Chola records describe it as a war. It is known almost only from Chola inscriptions, above all the Tiruvalangadu copper plates."
