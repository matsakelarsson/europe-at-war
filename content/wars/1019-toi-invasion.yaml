id: toi-invasion
name: Toi invasion
start: "1019-05-05"
end: "1019-05"
tier: C
summary: "A raid on Tsushima, Iki and northern Kyushu by a fleet of about 50 ships, manned mostly by Jurchens from the north-east coast of the Korean peninsula, whom the Japanese called Toi, from a Korean word for the peoples to the east. From 5 May 1019 (the 28th day of the third month) the raiders plundered Tsushima and then Iki, where the governor and his 147 men were killed and the provincial temple was burned, and in mid-May the districts of Ito, Shima and Sawara in Chikuzen, carrying off people and killing cattle for food. They camped on Nokonoshima in Hakata Bay, but their attack on the guard post at Hakata was beaten off by warriors under Fujiwara no Takaie, the acting governor-general of the Dazaifu, and Ōkura no Taneki, and a landing at Matsuura in Hizen was repelled by local warriors. The Dazaifu counted 364 people killed and 1,280 carried off, and some 380 horses and cattle lost. Takaie forbade his pursuing ships to go beyond Tsushima into Korean waters. On their way home the raiders went on plundering the Korean coast until the Goryeo navy destroyed their fleet; about 270 Japanese captives were freed and sent back to Tsushima by a Goryeo envoy, Jeong Ja-ryang. The court in Kyoto at first took the raiders for Goryeo forces, and it learned who they were only from a Tsushima official who had crossed to Korea to look for his family."
