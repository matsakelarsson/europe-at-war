notes:
  - The main sources are the reports of the Dazaifu and the diary of the courtier Fujiwara no Sanesuke (Shōyūki), which also preserves the statements of two women carried off by the raiders. The figures for the dead and captured differ slightly between the reports. Day dates are the Julian equivalents of the Japanese lunar dates given by Japanese historians; some English accounts give the lunar dates as if they were Western ones.
