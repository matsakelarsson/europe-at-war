notes:
  - The raid is known almost only from Rajendra’s own inscriptions, above all the list of conquests carved on the Brihadisvara temple at Thanjavur in 1025. Most of the places it names have been identified, some only tentatively, and the inscription gives no details of the fighting.
  - The reasons for the expedition are unknown. K. A. Nilakanta Sastri suggested that Srivijaya was obstructing Chola trade with China; others link it to the Khmer and their rivals on the Malay Peninsula, or see it simply as a show of power.
