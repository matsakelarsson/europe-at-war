id: chola-invasion-of-srivijaya
name: Chola invasion of Srivijaya
start: "1025"
end: "1025"
tier: B
summary: The overseas expedition of the Chola emperor Rajendra I against Srivijaya, the maritime power of Sumatra and the Malay Peninsula that controlled the Strait of Malacca. In 1025 a Chola fleet crossed the Bay of Bengal and attacked Srivijaya’s ports, from Kadaram (Kedah) in the north to the capital at Palembang in the south; the king, Sangrama Vijayottungavarman, was taken prisoner. The raid brought plunder and fame rather than lasting conquest, but it weakened Srivijaya, and Chola influence in the straits lasted for decades.
