steps:
  - title: Kadaram and Palembang
    date: "1025"
    when: "1025"
    borders: "1025"
    countries: [in, id, my, th]
    body:
      - Srivijaya, ruled from Palembang on the Musi river in Sumatra, controlled the Strait of Malacca and the trade between India and China that passed through it. Its relations with the Cholas had been friendly. Under Rajaraja I, the Srivijayan king Mara Vijayottungavarman built a Buddhist monastery, the Chudamani Vihara, at the Chola port of Nagapattinam, and Rajaraja granted it the revenue of a village.
      - In 1025 Rajendra I sent a fleet across the Bay of Bengal. His inscription at Thanjavur lists the places it took. Among them are Kadaram (Kedah), Srivijaya itself, whose “jewelled gate of war” was carried off, Malaiyur (Jambi) and Pannai on Sumatra, Ilamuridesam (Lamuri, in Aceh), Talaittakkolam (probably Takua Pa) and Ilangasogam (Langkasuka) on the Malay Peninsula, and Manakkavaram, the Nicobar Islands. The Srivijayan king, Sangrama Vijayottungavarman, was captured.
      - Rajendra took the title Kadaram-konda, “who took Kadaram”, but did not try to rule the straits. Srivijaya survived, weakened, and made peace with the rising Javanese kingdom of Airlangga. Chola merchants and missions to China remained active, and Virarajendra’s inscriptions claim that in about 1068 he conquered Kadaram again for a king who had asked for his help.
