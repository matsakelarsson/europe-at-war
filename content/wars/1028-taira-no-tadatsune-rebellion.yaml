id: taira-no-tadatsune-rebellion
name: Taira no Tadatsune’s rebellion
start: "1028"
end: "1031"
tier: C
summary: "The rising of Taira no Tadatsune, a great landholder of the Bōsō peninsula east of today’s Tokyo, against the provincial governors of Kazusa, Shimōsa and Awa. In the sixth month of 1028 Tadatsune burned the governor of Awa to death and occupied the provincial headquarters of Kazusa, and much of the local gentry joined him. The court’s commander, Taira no Naokata, whose branch of the clan was an old rival of Tadatsune’s, campaigned for two years without result, while Tadatsune drove the next governor out of Awa in 1030 and held out in a stronghold at Ishimi in Isumi district. The fighting and requisitions ruined the three provinces; the governor of Shimōsa was said to be starving. In 1030 the court replaced Naokata with Minamoto no Yorinobu, governor of Kai, whom Tadatsune had once served. In the spring of 1031, before Yorinobu had even marched, Tadatsune shaved his head as a monk and surrendered with his sons. He died of illness at Nogami in Mino on the way to the capital, in the sixth month. His sons were pardoned and founded the Chiba and Kazusa clans, and the affair made the Kawachi branch of the Minamoto the leading warrior house of eastern Japan."
