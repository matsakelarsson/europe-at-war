notes:
  - The sources disagree on the dates. Some give the fall of Ganzhou as 1028 and its final annexation as 1036, and the date of the surrender of Shazhou (Dunhuang) is uncertain; Uyghur rulers seem to have kept some autonomy there under the Tanguts.
