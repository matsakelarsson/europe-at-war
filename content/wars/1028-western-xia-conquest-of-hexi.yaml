id: western-xia-conquest-of-hexi
name: Western Xia conquest of the Hexi Corridor
start: "1028"
end: "1036"
tier: C
summary: "The campaigns in which the Tanguts, under Li Deming and his son Li Yuanhao, took the Hexi Corridor, the string of oases in today’s Gansu that carried the Silk Road between China and Central Asia. Since the fall of Tibetan rule in the 9th century the corridor had been divided between the Uyghur kingdom of Ganzhou (Zhangye), Tibetan tribes around Liangzhou (Wuwei), known as Xiliangfu, and the Chinese Guiyi circuit of the Cao family at Shazhou (Dunhuang) and Guazhou. In 1028 Li Deming sent Yuanhao against Ganzhou, already weakened by Liao attacks, and the Uyghur capital fell. The Uyghurs of Guazhou submitted in 1030. Yuanhao’s attack on the new Tibetan kingdom of Tsongkha under Gusiluo in Qinghai was beaten back, but in 1032 he took Liangzhou from the Tibetans of Xiliangfu, and in the same year succeeded his father. By 1036 he held the whole corridor, including Suzhou (Jiuquan) and Shazhou (Dunhuang), ending the Ganzhou kingdom and the Guiyi circuit; many Uyghurs moved west, some becoming the ancestors of the Yellow Uyghurs. In the same year the new Tangut script was put into official use. The corridor gave the Tanguts the Silk Road trade and the horses and resources for the empire Yuanhao proclaimed in 1038; they held it for almost two centuries."
