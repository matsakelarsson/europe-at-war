    polities: [denmark]
    ink: navy
notes:
  - The traditional date of 29 July comes from Snorri Sturluson’s saga, written about 200 years later. The sagas also describe a solar eclipse during the battle, but the eclipse visible in Norway in 1030 fell on 31 August, so the exact date is uncertain.
  - Olaf was declared a saint by the bishop of Nidaros in 1031. His shrine in Trondheim made Nidaros a pilgrimage centre, and Olsok, 29 July, is still kept in Norway.
