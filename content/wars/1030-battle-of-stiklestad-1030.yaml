id: battle-of-stiklestad-1030
name: Battle of Stiklestad
start: "1028"
end: "1030-07-29"
tier: C
summary: The battle in which King Olaf Haraldsson, driven out of Norway in 1028 when Cnut the Great took the country, was killed on 29 July 1030 trying to win back his throne with an army raised in Sweden. He was defeated in the Verdal valley north of Trondheim by a peasant army led by Norwegian chieftains loyal to Cnut. Within a year Olaf was revered as a saint, and harsh Danish rule soon turned Norwegians against Cnut; Olaf’s son Magnus took the throne in 1035.
