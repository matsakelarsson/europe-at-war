    moves: Ghaznavid moves
    success: Ghaznavid success
notes:
  - The size of the armies at Dandanaqan is uncertain. The Seljuks are usually put at about 16,000 men; estimates of the Ghaznavid army range from about the same to 50,000, with anything from a dozen to 300 war elephants.
  - The Ghaznavid side of the war is described in detail by Mas’ud’s secretary, the historian Bayhaqi. Some accounts date the battle of Nasa and the grant of land to 1034. Dandanaqan lay in the desert about 10 farsakhs (60 km) from Merv on the road to Sarakhs; its marker is approximate.
