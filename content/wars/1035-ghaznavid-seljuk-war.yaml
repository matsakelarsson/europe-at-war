  - title: Dandanaqan
    date: 1039–1040
    when: "1040-05-23"
    borders: "1040-06"
    countries: [tm, ir, af]
    body:
      - In 1039 Mas’ud took the field himself with a large army and war elephants and drove the Seljuks out of Herat and Nishapur. The Seljuks avoided a pitched battle. Their horsemen harassed his columns, cut off his supplies and denied his men the wells, while drought and famine gripped Khorasan. In May 1040 Mas’ud marched from Sarakhs towards Merv through the sands, and on 23 May, near the small caravan town of Dandanaqan, his hungry and thirsty army was attacked by the Seljuks under Tughril, Chaghri and their kinsmen. Some of his Turkish troops went over to the enemy, and the Ghaznavid army broke.
      - Mas’ud escaped to Ghazni and set out for India, where his own troops deposed him in favour of his brother Muhammad; he was killed in prison early in 1041. On the battlefield the Seljuk leaders proclaimed Tughril their sovereign, and they divided Khorasan among themselves, Chaghri keeping Merv and the east while Tughril turned west into Iran. The Ghaznavids never recovered western Khorasan and became a power of eastern Afghanistan and northern India.
    facts:
      - [Battle of Dandanaqan, "23 May 1040, Seljuk victory"]
      - [Death of Mas’ud I, "early 1041"]
    markers:
