steps:
  - title: Nasa, Merv and Nishapur
    date: 1035–1038
    when: "1035-06"
    borders: "1038"
    countries: [tm, ir]
    body:
      - The Seljuks were a family of chiefs of the Oghuz Turkmen, nomads who had moved south from the steppes north of the Aral Sea and taken service with the rulers of Transoxiana. After they lost their pastures in Transoxiana and Khwarazm to their enemies, and their ally Harun, the rebellious Ghaznavid governor of Khwarazm, was murdered in 1035, the Seljuks under Tughril, his brother Chaghri and their uncle Musa crossed the Oxus into Khorasan with their families and herds and asked Sultan Mas’ud I for grazing land.
      - Mas’ud sent an army under the chamberlain Begtoghdi, which drove them away from Nasa but then fell to quarrelling over the spoils. Chaghri counter-attacked and routed it in June 1035, and Mas’ud granted the Seljuks Nasa, Farawa and Dihistan, on the edge of the desert, in return for their recognition of his authority. Their bands went on raiding the settled lands, and Mas’ud, occupied with campaigns in India, could not stop them. Merv submitted to the Seljuks in 1037. In 1038 they beat the Ghaznavid general Sübashi near Sarakhs, and Nishapur opened its gates. Tughril entered the city, sat on Mas’ud’s throne and had the Friday sermon read in his own name.
    facts:
      - [Battle of Nasa, "June 1035, Seljuk victory"]
      - [Merv submits, "1037"]
      - [Nishapur taken, "1038"]
