id: ghaznavid-seljuk-war
name: Ghaznavid–Seljuk war
start: "1035"
end: "1040-05-23"
tier: B
summary: The war in which the Seljuk Turkmen, led by the brothers Tughril and Chaghri, took Khorasan from the Ghaznavid sultan Mas’ud I. After crossing the Oxus in 1035 they beat a Ghaznavid army at Nasa and were granted grazing lands on the edge of the Karakum desert. They then took Merv and, in 1038, Nishapur, where Tughril was proclaimed sultan. Mas’ud’s great campaign of 1039–1040 ended in his defeat at Dandanaqan, between Sarakhs and Merv, on 23 May 1040, which gave the Seljuks Khorasan and opened the way to their conquest of Iran.
countries: [tm, ir, af]
sides:
