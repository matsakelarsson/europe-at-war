  - title: Haoshuichuan
    date: February 1041
    when: "1041-02"
    borders: "1041-02-01"
    countries: [cn]
    body:
      - Han Qi favoured attack. Early in 1041, when the Xia raided the southern frontier near Weizhou, he sent Ren Fu with an army of some 30,000 to cut them off. Ren Fu defeated a small Xia force and pressed on quickly, his men short of food, into the valley of the Haoshui. There Yuanhao had set his main army in ambush; it is said that boxes left on the road released pigeons when opened, signalling the Song position. Attacked from front and rear, the Song army was destroyed, and Ren Fu was killed with many of his officers.
      - The defeat shook the Song court, and Han Qi and Fan Zhongyan were both demoted for a time. But Yuanhao still could not take the walled towns, garrisoned by some 200,000 troops on rotation from the capital, and gained no land. Later in 1041 the Song beat off several Xia attacks, though the Xia took Fengzhou in the north-east.
    facts:
      - [Battle of Haoshuichuan, "February 1041"]
      - [Song army, "about 30,000"]
