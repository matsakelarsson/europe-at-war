  - title: The peace of 1044
    date: 1043–1044
    when: "1044-10"
    borders: "1044-12-01"
    countries: [cn]
    body:
      - Talks began in 1043. Yuanhao at first insisted on equal status, but in 1044 he accepted the title of lord of the Xia state and agreed to address the Song emperor as a subject, while remaining emperor at home. In return the Song promised yearly gifts, in all some 250,000 units of silver, silk and tea, and the reopening of the border markets.
      - In the same year the Liao, whose Tangut subjects on the border had gone over to the Xia, turned on their former ally. The Liao emperor Xingzong invaded the Xia with some 100,000 men in the autumn of 1044. After an early success his army was badly defeated in the Ordos, and Song spies reported a line of carts carrying the Liao dead back across the desert. Peace between the Liao and the Xia followed. Yuanhao, who had made the Xia one of the three great powers of the region, was killed by his own son in 1048.
    facts:
