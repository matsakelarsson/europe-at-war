steps:
  - title: The Great Xia
    date: 1038–1039
    when: "1038-11-10"
    borders: "1038-11-10"
    countries: [cn]
    body:
      - Li Yuanhao had succeeded his father Li Deming in 1032 and spent his first years building a state. He took the Tangut clan name Weiming in place of the Chinese surname Li, ordered his men to shave the crown of the head in Tangut fashion, introduced the new Tangut script in 1036, conquered the Hexi Corridor, and set up a Chinese-style government with sixteen bureaus. He raised every man between 15 and 60, and is said to have had as many as 370,000 men under arms across five military zones, with an elite heavy cavalry of 3,000.
      - In 1038 he declared himself emperor of the Great Xia, with his capital at Xingqing (Yinchuan), and wrote to the Song court asking to be recognised. The Song emperor Renzong refused, cut off the border trade and offered a reward for his head. Both sides prepared for war along a frontier of several hundred kilometres, from the Yellow River bend in the north to the Liupan mountains in the south.
    facts:
      - [Yuanhao proclaims the Great Xia, "1038"]
      - [Men under arms, "up to 370,000, according to Song sources"]
