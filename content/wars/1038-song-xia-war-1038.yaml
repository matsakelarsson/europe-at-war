  - title: Sanchuankou
    date: winter 1039–1040
    when: "1040-02"
    borders: "1040-02-01"
    countries: [cn]
    body:
      - In the winter of 1039–1040 Yuanhao came down on Yanzhou with more than 100,000 men, taking the forts in front of it. The prefect, Fan Yong, gave his commander Liu Ping contradictory orders, marching his men back and forth, until Liu Ping’s 9,000 met some 50,000 Xia troops at Sanchuankou, where three rivers meet outside the city. The Song force was destroyed and Liu Ping taken prisoner.
      - Yanzhou itself was poorly defended, but heavy snow set in and Yuanhao withdrew. The Song court sent the scholar-officials Fan Zhongyan and Han Qi to take charge of the Shaanxi frontier. Fan reorganised the troops at Yanzhou, recruited local archers and built a deep defence of forts and walled settlements, and won over many of the Qiang and other border peoples.
    facts:
      - [Battle of Sanchuankou, "early 1040"]
      - [Song and Xia forces, "about 9,000 against 50,000"]
