notes:
  - The Tanguts called their state the Great Xia; the name Western Xia (Xi Xia) is the Chinese one. Sizes of armies and losses come from Song sources and vary widely.
  - The yearly gifts of 1044 are usually given as 72,000 taels of silver, 153,000 bolts of silk and 30,000 jin of tea, with further gifts on festivals and the emperor’s birthday.
