id: song-xia-war-1038
name: Song–Xia war (1038–1044)
start: "1038-11-10"
end: "1044-12"
tier: A
summary: "The war that followed Li Yuanhao’s proclamation of the Tangut empire of the Great Xia, known as the Western Xia, in 1038. The Song refused to recognise a second emperor on its north-western frontier, cut off trade and put a price on Yuanhao’s head. Yuanhao, with an army of mounted warriors raised from all Tangut men between 15 and 60, struck at the Song frontier in Shaanxi and Gansu and won three great battles: at Sanchuankou near Yan’an in early 1040, at Haoshuichuan in 1041, where the Song general Ren Fu and most of his army were killed, and at Dingchuan fort in 1042. But he could not take the walled towns and forts that Fan Zhongyan and Han Qi built up along the border, and the war, the loss of trade and the drain on his men exhausted the Xia. The Liao used the Song’s difficulty to win higher payments in 1042, then attacked the Xia themselves in 1044 and were heavily defeated. In 1044 Yuanhao agreed to call himself lord of Xia and a subject of the Song, in return for gifts each year of silver, silk and tea worth some 250,000 units and the reopening of the border markets."
