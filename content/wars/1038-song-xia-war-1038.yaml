  - title: Dingchuan
    date: autumn 1042
    when: "1042-10"
    borders: "1042-10-01"
    countries: [cn]
    body:
      - In 1042 Yuanhao struck again at the southern frontier and surrounded the Song army under Ge Huaimin at the fort of Dingchuan near Zhenrong. Ge tried to break out and was killed, and most of his army, put by the sources at between ten and twenty thousand men, was lost. The Xia raided south towards Weizhou, but two Song forces, one threatening their rear and the other defeating their vanguard, drove them back. Xia attacks on Linzhou in the north-east were also turned back.
      - The same year the Liao, seeing the Song in difficulty, massed troops on the border and demanded the land south of the passes taken by the Later Zhou in 959. The envoy Fu Bi talked them down, but the Song had to add 100,000 bolts of silk and 100,000 taels of silver to their yearly payment to the Liao. By now half of Yuanhao’s soldiers were said to have died from the hardships of war, trade with China had stopped, and the Xia could no longer afford the war.
    facts:
      - [Battle of Dingchuan, "autumn 1042"]
      - [Song payments to the Liao raised, "1042"]
