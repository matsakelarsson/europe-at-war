steps:
  - title: Rayy, Isfahan and the Jibal
    date: 1040–1051
    when: "1043"
    borders: "1051"
    countries: [ir, tm, uz]
    body:
      - After Dandanaqan the Seljuk leaders divided the conquered lands. Chaghri kept Merv and eastern Khorasan, and Tughril led the advance west. In 1041–1042 he took Gorgan and Tabaristan, whose Ziyarid ruler became his vassal, and his forces moved into Khwarazm. His half-brother Ibrahim Inal took Rayy, which Tughril made his first capital in 1043. From there the Seljuks pushed into the Jibal, held by the Kakuyids of Isfahan and Hamadan and by the Buyids, and in 1046–1049 Ibrahim Inal campaigned across western Iran as far as the Byzantine frontier in Armenia.
      - The Kakuyid Faramurz of Isfahan accepted Tughril’s overlordship, then turned back to the Buyids. In 1050 Tughril besieged Isfahan. The city held out for a year before it surrendered in 1051; Faramurz was given Yazd and Abarkuh instead, and Tughril made Isfahan his capital. In the south-east, Chaghri’s son Qavurt took Kerman in 1048, where his descendants ruled for more than a century.
    facts:
      - [Gorgan and Tabaristan, "1041–1042"]
      - [Rayy made Tughril’s capital, "1043"]
      - [Siege of Isfahan, "1050–1051"]
