  - title: Tughril in Baghdad
    date: 1054–1055
    when: "1055-12-18"
    borders: "1055-12"
    countries: [iq, ir, sy]
    body:
      - In 1054 Tughril campaigned in Azerbaijan, where the Rawwadid ruler of Tabriz and other local princes accepted his overlordship. In Baghdad the last Buyid ruler, al-Malik al-Rahim, had little power. The strongest man in Iraq was his Turkish commander al-Basasiri, who quarrelled with the caliph al-Qa’im and his vizier Ibn al-Muslima and was suspected of leaning towards the Fatimid caliphs of Cairo. The caliph turned to Tughril, a Sunni ruler, for protection.
      - Tughril came to Iraq in 1055, announcing that he was on his way to Mecca as a pilgrim. On 15 December the Friday sermon in Baghdad was read in his name, and on 18 December 1055 he entered the city. Fighting broke out between his Turkmen and the people of Baghdad, and Tughril arrested al-Malik al-Rahim, who died a prisoner a few years later; Buyid rule in Iraq was over. Al-Basasiri fled up the Euphrates to al-Rahba and entered the service of the Fatimids, and three years later he took Baghdad for them while Tughril was away.
    facts:
      - [Azerbaijan submits, "1054"]
      - [Tughril enters Baghdad, "18 December 1055"]
      - [Al-Malik al-Rahim imprisoned, "December 1055"]
