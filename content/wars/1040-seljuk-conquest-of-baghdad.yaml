id: seljuk-conquest-of-baghdad
name: Seljuk conquest of Iran and Baghdad
start: "1040"
end: "1055-12-18"
tier: B
summary: The fifteen years after the battle of Dandanaqan in which the Seljuk Turkmen under Tughril Beg conquered the Iranian plateau from the Kakuyids, the Buyids and other local dynasties. Tughril took Gorgan, Rayy and Khwarazm in 1041–1043, made Rayy his capital, besieged and took Isfahan in 1050–1051, and in 1054 brought the princes of Azerbaijan under his rule. Invited by the caliph al-Qa’im, he entered Baghdad on 18 December 1055 and imprisoned the last Buyid ruler of Iraq, becoming the protector of the Abbasid caliphate.
countries: [ir, iq, tm, uz]
sides:
  - id: sel
    name: Seljuks
    polities: [seljuk]
    ink: olive
    moves: Seljuk moves
    success: Seljuk success
  - id: buy
    name: Buyids
    polities: [buyids]
    ink: blue
    moves: Buyid moves
    success: Buyid success
notes:
  - Much of the conquest was done by Turkmen bands in search of pasture and plunder, who went ahead of Tughril and often beyond his control. Tughril’s half-brother Ibrahim Inal led many of the campaigns in western Iran. Dates for the conquests of the 1040s differ by a year or two among the sources.
  - Tughril’s entry into Baghdad is dated 17 or 18 December 1055. The Kakuyids of Isfahan and Hamadan, who also fought the Seljuks, are not drawn on the base map.
