id: uprising-of-peter-delyan
name: Uprising of Peter Delyan
start: "1040"
end: "1041"
tier: C
summary: The largest Bulgarian rising against Byzantine rule before 1185. Discontent grew when the government demanded taxes in coin instead of in kind, and in 1040 Peter Delyan, who claimed to be a grandson of Samuel, was proclaimed tsar in Belgrade. The rising spread south to Niš, Skopje and the region of Dyrrhachium, where a rival leader, Tihomir, was put to death. Alusian, a son of Ivan Vladislav, joined it but failed before Thessalonica; he then blinded Delyan and went over to the Byzantines. In 1041 the Emperor Michael IV defeated the rebels near Ostrovo, with Harald Hardrada among his Varangians, and the last resistance at Prilep and around Sofia was crushed.
