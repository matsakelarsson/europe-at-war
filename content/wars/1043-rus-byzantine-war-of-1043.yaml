id: rus-byzantine-war-of-1043
name: Rus’–Byzantine War of 1043
start: "1043"
end: "1043"
tier: C
summary: The last Rus’ attack on Constantinople, sent by Yaroslav the Wise of Kiev under his eldest son, Vladimir of Novgorod, after a quarrel in the city in which, according to one account, a Rus’ merchant was killed. The Emperor Constantine IX’s fleet met the Rus’ boats at the entrance to the Bosporus and destroyed many with Greek fire, and a storm wrecked more. Some 6,000 men who were cast ashore and tried to march home under Vyshata were caught near Varna, and 800 of them were blinded. Peace was restored about 1046 and sealed by the marriage of Yaroslav’s son Vsevolod to a Byzantine princess of Constantine IX’s family; their son was Vladimir Monomakh.
