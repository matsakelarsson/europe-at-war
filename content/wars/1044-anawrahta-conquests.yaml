  - title: The eastern hills and Dali
    date: 1050s–1061
    when: "1058"
    borders: "1061-02-07"
    countries: [mm, cn]
    body:
      - The chronicles credit Anawrahta with two journeys to the hills east of the Irrawaddy plain, where chiefs of the peoples later known as the Shan paid him tribute. On the first, in the early or middle 1050s, he founded the Bawrithat pagoda at Nyaungshwe near Inle Lake. After the conquest of Thaton, a seventeenth-century source says from 16 December 1057, he marched north to Dali, the kingdom in Yunnan that had succeeded Nanzhao, to ask for a tooth of the Buddha. The ruler of Dali first closed his gates; in the end the two kings exchanged gifts, and Anawrahta went home with a jade image that had touched the relic, but not the tooth itself.
      - Historians see the march to Dali as a show of strength on the frontier rather than a pilgrimage. On his way back, by a royal order of 7 February 1061, Anawrahta set up 43 forts along the eastern foothills to guard the plains from the hills; 33 of them still exist as villages. The chiefs’ allegiance seems to have been nominal, but the line of forts marked the eastern edge of Pagan’s core lands for two centuries.
    facts:
      - [March to Dali, "from late 1057, by one late source"]
      - [Royal order for 43 forts, "7 February 1061"]
