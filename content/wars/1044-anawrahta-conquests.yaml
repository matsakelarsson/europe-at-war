steps:
  - title: Anawrahta takes Thaton
    date: 1044–1057
    when: "1057"
    borders: "1057-06-01"
    countries: [mm]
    body:
      - In the early eleventh century Pagan was one of several small states in the dry zone of Upper Burma, where Burman settlers had taken over the lands of the Pyu. According to the chronicles, Min Saw, a royal son living at Mount Popa, rebelled and killed King Sokkate in single combat near Pagan in 1044, and was crowned as Anawrahta on 16 December 1044. He built up the irrigated rice lands of Kyaukse and Minbu, which fed his armies, and, the chronicles say, was converted to Theravada Buddhism by Shin Arahan, a monk from the south, in about 1056.
      - In the chronicles’ account Anawrahta asked Manuha, king of the Mon city of Thaton on the Gulf of Martaban, for copies of the Pali scriptures, and when Manuha refused, sent his armies under four commanders the chronicles call the Four Paladins, among them the future king Kyansittha. They besieged Thaton for about three months and took it on 17 May 1057. Manuha, his family and, the chronicles say, more than 30,000 people, many of them monks and craftsmen, were brought to Pagan with the scriptures. The ruler of Pegu, who had helped against Thaton, kept his throne as a vassal.
      - Historians read the demand for scriptures as a demand for submission. Several see the campaign as a move to control the coast and its trade, and to keep out the Khmer Empire, which was pressing westward into the Chao Phraya basin. Michael Aung-Thwin has argued that the conquest and its civilising influence on Pagan are a later legend with no contemporary evidence. Whatever happened at Thaton, Pagan ruled the coast of Lower Burma from the later eleventh century.
    facts:
      - [Anawrahta crowned, "16 December 1044"]
      - [Thaton taken, "17 May 1057, after a siege of about three months"]
      - [Taken to Pagan, "King Manuha and, the chronicles say, more than 30,000 people"]
