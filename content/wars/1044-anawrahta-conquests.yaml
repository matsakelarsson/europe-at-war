id: anawrahta-conquests
name: Anawrahta’s wars
start: "1044"
end: "1077-04-11"
tier: B
summary: "The wars by which Anawrahta, king of Pagan from 1044 to 1077, made his small kingdom in the dry zone of Upper Burma the first state to rule the whole Irrawaddy valley. According to the Burmese chronicles he seized the throne by killing King Sokkate in 1044, and in 1057 his armies took Thaton, the Mon city on the Gulf of Martaban, after a three-month siege, bringing its king Manuha, its monks, scriptures and artisans to Pagan; Pegu became his vassal. He received the submission of chiefs in the eastern hills, marched to the gates of Dali in Yunnan, guarded the plains with a line of 43 forts (1061), raided Arakan and drove a Khmer army out of Tenasserim. He sent help to Vijayabahu I of Sri Lanka against the Cholas, and monks to restore the Buddhist ordination there. Historians accept the outline of his rule, which the inscriptions confirm, but treat many chronicle stories as later legends; whether the conquest of Thaton happened as told, and how much it changed Pagan, is disputed."
countries: [mm, th]
