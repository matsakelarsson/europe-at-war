notes:
  - The wars are known almost only from Burmese chronicles written from the fifteenth to the nineteenth centuries, which give round numbers and many legends; contemporary inscriptions confirm Anawrahta’s reign and some of his works, but not the details of his campaigns. Dates are those of the chronicles as converted by modern historians; the chronicles themselves differ by a year or more.
  - Michael Aung-Thwin (2005) argues that the story of the conquest of Thaton and its civilising influence on Pagan is a legend of later centuries; other historians, such as Victor Lieberman, accept that Pagan took control of Lower Burma under Anawrahta but doubt the scale of Mon influence the chronicles describe.
