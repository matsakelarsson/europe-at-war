  - title: Arakan, Tenasserim and Sri Lanka
    date: 1060s–1077
    when: "1070"
    borders: "1070-01-01"
    countries: [mm, th]
    body:
      - To the west, the chronicles say, Anawrahta led an army over the Arakan Yoma by the pass from Ngape to An, besieged the Arakanese capital and tried to carry off the Mahamuni, the great Buddha image of Arakan. It proved too heavy to move, and he took the gold and silver vessels of its shrine instead. Arakanese chronicles also tell of his raids, but their dates are far off. Historians doubt that Pagan had real authority in Arakan; the campaign may have been a raid to stop Arakanese attacks on the Irrawaddy valley.
      - In the south, a Khmer army invaded Tenasserim and was driven back by Anawrahta’s forces; the date is not known. Thai chronicles that have him sack Angkor and take tribute from the Khmer king are not borne out by other sources. Further afield, in 1069 Vijayabahu I of Sri Lanka, at war with the Cholas, asked Anawrahta for help, and the Culavamsa says Pagan sent ships laden with goods; in 1071 Anawrahta sent monks and scriptures to restore the Buddhist ordination on the island, and received a replica of the Buddha’s tooth relic, enshrined in the Lawkananda pagoda at Pagan.
      - Anawrahta died on 11 April 1077 by the most widely accepted date; legends tell of an ambush or of a wild buffalo. His son Sawlu was overthrown and killed by the rebel governor of Pegu, and Kyansittha restored the kingdom in 1084; the realm Anawrahta had brought together, from the hills of the north to the Gulf of Martaban, lasted until the Mongol invasions two centuries later.
    facts:
      - [Help sent to Sri Lanka, "1069 and 1071"]
      - [Death of Anawrahta, "11 April 1077 (the chronicles point to March 1078)"]
