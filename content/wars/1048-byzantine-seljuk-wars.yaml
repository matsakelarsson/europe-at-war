id: byzantine-seljuk-wars
name: Byzantine–Seljuk wars
start: "1048"
end: "1081"
tier: B
summary: The wars in which the Seljuk Turks and the Turkmen tribes that followed them broke Byzantine power in Armenia and Asia Minor. After two decades of raids, during which Alp Arslan took Ani in 1064, the sultan defeated and captured the Emperor Romanos IV Diogenes at Manzikert in 1071. The Byzantine civil wars that followed let Turkish bands settle across Anatolia, and by 1081 a Seljuk prince ruled from Nicaea, close to Constantinople.
countries: [tr, am, ge, sy]
sides:
  - id: byz
    name: Byzantine Empire
    polities: [byzantium]
    ink: purple
    moves: Byzantine moves
    success: Byzantine success
  - id: sel
    name: Seljuks and Turkmen
    polities: [seljuk, rum]
    ink: olive
    moves: Seljuk and Turkmen moves
    success: Seljuk and Turkmen success
notes:
  - Many raiders were Turkmen bands, only loosely under the Seljuk sultans, who were often more concerned with Iran, Iraq and the Fatimids of Egypt. Byzantine writers called all of them Turks.
  - The main sources are Byzantine (Michael Attaleiates, who was at Manzikert, Michael Psellos, John Skylitzes and Nikephoros Bryennios), Armenian (Aristakes Lastivertsi and Matthew of Edessa) and Arabic and Persian historians such as Ibn al-Athir. They differ on numbers, on the terms agreed after Manzikert and on what happened to the troops sent to Khliat.
  - Place names. Manzikert is Malazgirt, Khliat is Ahlat, Theodosiopolis is Erzurum, Kapetron is Pasinler, Sebasteia is Sivas, Melitene is Malatya, Caesarea is Kayseri, Iconium is Konya, Chonae is Honaz, Dokeia is Tokat, Kotyaion is Kütahya and Nicaea is İznik. Ani, the old Armenian capital, lies in ruins on today’s Turkish–Armenian border.
