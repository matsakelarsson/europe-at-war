steps:
  - title: Kapetron and the first raids
    date: 1048–1059
    when: "1048"
    borders: "1059"
    countries: [tr, am, ge]
    body:
      - "By the 1040s Byzantium had annexed the Armenian kingdoms of Vaspurakan and Ani, and Constantine IX let the local troops of the eastern provinces pay taxes instead of serving. In Iran the Seljuks, a ruling family of Oghuz Turks, had built an empire, and Turkmen bands began raiding Byzantine Armenia. In 1048 Ibrahim Inal, half-brother of the sultan Tughril, invaded in force. The Byzantine commanders, Aaron and Katakalon Kekaumenos, were ordered to wait for the Georgian prince Liparit IV, and meanwhile the Turks burned Artze, a rich, unwalled market town, killing many of its people."
      - "On the night of 18 September the allies fought Ibrahim at Kapetron. The Byzantine wings drove the Turks off, but in the centre Liparit was captured, and Ibrahim went home with his plunder. Liparit was later freed and embassies passed between the two courts, but the raids resumed in 1054, when Tughril himself besieged Manzikert and was beaten off by its commander, Basil Apokapes. With many Byzantine troops away fighting the Pechenegs in the Balkans, the raiders went deeper: Melitene was sacked in 1057 and Sebasteia in 1059."
    facts:
      - [Battle of Kapetron, "18 September 1048, indecisive; Liparit IV captured"]
      - [Seljuk commander, "Ibrahim Inal"]
      - [Siege of Manzikert, "1054, held by Basil Apokapes"]
    markers:
      - kind: taken
        side: sel
        name: Artze
        date: "1048"
        text: The Turks set fire to the barricaded trading town and killed its people as they fled. Skylitzes’ figure of 150,000 dead is much exaggerated. The site is uncertain, near Erzurum.
        lonlat: [41.05, 39.95]
        lp: l
      - kind: battle
        name: Battle of Kapetron
        date: 18 September 1048
        text: A night battle on the plain of Basean. The Byzantines held the field, but the Turks captured Liparit and kept their plunder.
        lonlat: [41.676, 39.98]
      - kind: held
        side: byz
        name: Manzikert
        date: "1054"
        text: Tughril besieged the fortress north of Lake Van, but its commander, Basil Apokapes, held out and the sultan withdrew.
        lonlat: [42.544, 39.148]
      - kind: taken
        side: sel
        name: Melitene
        date: "1057"
        text: Turkmen raiders sacked the city, which had been Byzantine since 934.
        lonlat: [38.317, 38.35]
      - kind: taken
        side: sel
        name: Sebasteia
        date: "1059"
        text: The raiders sacked the city, deep inside Byzantine Asia Minor.
        lonlat: [37.015, 39.751]
