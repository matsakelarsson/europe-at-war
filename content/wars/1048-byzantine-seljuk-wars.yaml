  - title: Ani and the raids into Anatolia
    date: 1064–1070
    when: "1064"
    borders: "1070"
    countries: [tr, am, ge, sy]
    body:
      - "In 1064 Tughril’s nephew and successor, Alp Arslan, invaded Georgia and Armenia and besieged Ani, the former Armenian royal city, now held by a Byzantine garrison. It fell on 16 August, and Armenian and Arab writers describe the slaughter of many of its people. The next year the Armenian king of Kars handed his land to the empire in exchange for estates in Asia Minor. Turkmen bands now rode deep into Anatolia almost every year: they plundered Caesarea in 1067, Neocaesarea and Amorium in 1068, Iconium in 1069 and Chonae, near the Aegean, in 1070."
      - "In 1068 the general Romanos Diogenes married the widowed empress Eudokia and became emperor. He set out to rebuild the eastern army, much of it now foreign mercenaries, and campaigned every year. In 1068 he marched into Syria and took Hierapolis (Manbij); in 1069 he campaigned in Cappadocia and towards Lake Van with little result. In 1070, while he stayed in Constantinople, his general Manuel Komnenos was defeated and captured near Sebasteia. Romanos resolved to secure the frontier by retaking the fortresses around Lake Van."
    facts:
      - [Ani taken, "16 August 1064"]
      - [Sultan, "Alp Arslan (1063–1072)"]
      - [Emperor, "Romanos IV Diogenes (1068–1071)"]
    markers:
      - kind: siege
        side: sel
        name: Ani
        date: 16 August 1064
        text: Alp Arslan took the walled city on its river gorge after a siege. Many of its people were killed or enslaved, and it never fully recovered.
        lonlat: [43.572, 40.507]
      - kind: event
        side: byz
        name: Kars
        date: "1065"
        text: The last Armenian king of Kars, Gagik-Abas, ceded his kingdom to Byzantium and moved to Asia Minor.
        lonlat: [43.096, 40.608]
        lp: l
      - kind: taken
        side: sel
        name: Caesarea
        date: "1067"
        text: Turkmen raiders sacked the city and looted the shrine of its patron, Saint Basil.
        lonlat: [35.487, 38.722]
      - kind: taken
        side: sel
        name: Amorium
        date: "1068"
        text: The great city of the Anatolian plateau was sacked again, two centuries after al-Mu’tasim.
        lonlat: [31.29, 39.02]
      - kind: taken
        side: sel
        name: Iconium
        date: "1069"
        text: Turkmen raiders plundered the city, which became the Seljuk capital in Anatolia a generation later.
        lonlat: [32.493, 37.874]
      - kind: taken
        side: sel
        name: Chonae
        date: "1070"
        text: The furthest raid yet, into western Asia Minor; the famous church of the Archangel Michael was desecrated.
        lonlat: [29.27, 37.76]
      - kind: taken
        side: byz
        name: Hierapolis (Manbij)
        date: November 1068
        text: Romanos took the Syrian town from the Mirdasid emirs of Aleppo, allies of the Seljuks.
        lonlat: [37.955, 36.528]
    arrows:
      - side: sel
