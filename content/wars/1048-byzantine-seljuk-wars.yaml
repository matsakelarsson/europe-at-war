  - title: Manzikert and the Turkish settlement of Anatolia
    date: 1071–1081
    when: "1071-08-26"
    borders: "1081-06"
    countries: [tr, am]
    body:
      - "In the spring of 1071 Romanos marched east with a large but mixed army: Byzantine regiments, Armenian and Georgian levies, Norman and Frankish mercenaries under Roussel de Bailleul, Pecheneg and Uz horsemen and part of the Varangian Guard, perhaps 40,000 men in all. Alp Arslan, who had been campaigning in northern Syria on his way to fight the Fatimids, hurried north. Unaware how close he was, Romanos split his forces, sending Joseph Tarchaneiotes and Roussel with about half the army towards Khliat, and took Manzikert himself on 23 August. The Khliat force took no further part; Muslim writers say it was beaten, Byzantine writers that it withdrew."
      - "On 26 August, having rejected a Seljuk offer of terms, Romanos advanced across the plain. The Turkish horse archers fell back before him, shooting into his flanks. By evening he had reached the sultan’s camp without forcing a battle and ordered a return to his own. In the confusion Andronikos Doukas, commanding the rearguard and the son of Romanos’s rival, the Caesar John Doukas, marched off the field instead of covering the withdrawal. The Turks attacked, the wings broke and Romanos, fighting on, was wounded and captured, the first Byzantine emperor to become the prisoner of a Muslim ruler. Most of the army escaped, and losses may have been lower than later writers claimed."
      - "Alp Arslan treated Romanos generously and freed him after a week, on terms that included a ransom, a yearly tribute and, in some accounts, Manzikert, Antioch, Edessa and Hierapolis. But the Doukas family had already made Michael VII emperor; Romanos was defeated, surrendered at Adana and was blinded in June 1072, dying of his wounds. In the civil wars of the next decade, against Roussel de Bailleul, Nikephoros Botaneiates and Nikephoros Melissenos, emperors and rebels alike hired Turkish bands and let them garrison towns, while Turkmen settled across the plateau. When Alexios I Komnenos seized the throne in April 1081, Suleiman ibn Qutulmish ruled from Nicaea. Many historians see these civil wars, more than the battle itself, as the cause of the loss of Anatolia."
    facts:
      - [Battle of Manzikert, "26 August 1071, Seljuk victory; Romanos IV captured"]
      - [Romanos IV blinded, "29 June 1072, at Kotyaion"]
      - [Nicaea, "Seat of Suleiman ibn Qutulmish by 1081"]
    markers:
      - kind: taken
        side: byz
        name: Manzikert
        date: 23 August 1071
        text: The Turkish garrison surrendered the fortress to Romanos three days before the battle.
        lonlat: [42.544, 39.148]
        lp: t
      - kind: event
        name: Khliat
        date: August 1071
        text: Romanos sent about half his army under Joseph Tarchaneiotes and Roussel de Bailleul to this fortress on Lake Van. What happened to it is unclear.
        lonlat: [42.494, 38.753]
      - kind: battle
        side: sel
        name: Battle of Manzikert
        date: 26 August 1071
        text: Romanos’s withdrawal at nightfall turned into a rout when the rearguard under Andronikos Doukas left the field. The emperor was captured and brought before Alp Arslan.
        lonlat: [42.59, 39.08]
        lp: b
      - kind: event
        name: Adana
        date: "1072"
        text: Besieged here by Andronikos Doukas, Romanos surrendered on a promise of safety. He was blinded at Kotyaion on 29 June 1072 and died soon after.
        lonlat: [35.321, 37.0]
      - kind: taken
        side: sel
        name: Nicaea
        date: c. 1080–1081
        text: Turkish troops brought in by rival Byzantine claimants garrisoned the city, and Suleiman ibn Qutulmish made it his capital. In 1081 Alexios I agreed with him a frontier on the river Drakon, on the Gulf of Nicomedia.
        lonlat: [29.72, 40.43]
