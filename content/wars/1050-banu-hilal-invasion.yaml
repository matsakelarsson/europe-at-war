  - title: The sack of Kairouan
    date: 1057 and after
    when: "1057"
    borders: "1057-12-01"
    countries: [tn, dz, ly]
    body:
      - In 1057 al-Mu’izz gave up Kairouan and moved with his court to the fortified port of Mahdia. The tribes entered the abandoned city and plundered it; Ibn Khaldun wrote that nothing the Sanhaja princes had left in their palaces escaped the plunderers. Kairouan, for nearly four centuries the chief city and religious centre of Ifriqiya, never recovered its place. The Zirids held only the coast around Mahdia; Tamim, who succeeded his father in 1062, won back Sousse and, in 1083, Kairouan, but never the interior.
      - Ifriqiya broke up into small states that paid the Arab chiefs for protection or hired them as soldiers. Tunis asked the Hammadids for a governor, and his family, the Banu Khurasan, made it a principality of their own. Gabès, Sfax and Gafsa also had their own rulers. The Hammadids, whose capital in the Hodna lay open to the tribes, gave them half their harvests and moved their court to Bougie on the coast, in 1090 according to most accounts. The Arab tribes spread over the plains and plateaus of Ifriqiya and the Constantinois, while the Berbers of the mountains, the Kabylias and the Aurès kept their land and language.
      - Ibn Khaldun, writing three centuries later, saw the Hilalians as a swarm of locusts that destroyed whatever they found, and French historians of the colonial period made the “Hilalian catastrophe” the cause of North Africa’s decline. Later historians have argued that the Zirid state and the cities were already weakening, that the migration was slow and that settled rulers used the tribes for their own ends. What is not disputed is that the Banu Hilal and Banu Sulaym, followed by the Ma’qil who moved on towards Morocco, brought Arabic speech and pastoral nomadism deep into the countryside of the Maghreb.
    facts:
      - [Kairouan sacked, "1057"]
      - [New Zirid capital, "Mahdia"]
      - [Hammadid capital moved to Bougie, "about 1090"]
