id: banu-hilal-invasion
name: Hilalian invasion of Ifriqiya
start: "1050"
end: "1057"
tier: B
summary: "The arrival in Ifriqiya of the Banu Hilal and Banu Sulaym, Arab Bedouin tribes whom the Fatimid caliphs of Cairo turned loose on their former governors, the Zirids, after the Zirid emir al-Mu’izz ibn Badis broke with Cairo and recognised the Abbasid caliph in Baghdad in the 1040s. On the advice of the vizier al-Yazuri, the caliph al-Mustansir granted the Maghreb to the tribes, then camping in Upper Egypt, in 1050. The Sulaym settled in Cyrenaica; the Hilal moved on into Tripolitania and southern Ifriqiya, and on 14 April 1052 they routed al-Mu’izz’s much larger army at Haydaran, near Gabès. For five years they roamed and plundered the countryside around Kairouan, until in 1057 al-Mu’izz withdrew to the coastal fortress of Mahdia and the tribes sacked his abandoned capital. Ifriqiya broke up into small principalities paying the Arab chiefs for protection. Medieval writers, above all Ibn Khaldun, compared the Hilalians to a swarm of locusts that left ruin behind; many modern historians see a slower migration of families that did less damage than once claimed but changed the Maghreb for good, spreading pastoral nomadism and the Arabic language in the countryside."
countries: [tn, ly, dz, eg]
