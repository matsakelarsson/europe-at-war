steps:
  - title: The break with Cairo and the march west
    date: 1048–1051
    when: "1050"
    borders: "1050-06-01"
    countries: [tn, ly, eg]
    body:
      - The Zirids had governed Ifriqiya for the Fatimids since the caliphs moved to Cairo in 972–973, and over the years they ruled it more and more as their own. Their subjects in Kairouan were mostly Maliki Sunnis who hated the Ismaili doctrine of Cairo, and Shi’is were killed in riots in the towns of Ifriqiya around the time al-Mu’izz ibn Badis came to the throne in 1016. In the 1040s al-Mu’izz turned openly to Sunni Islam. Around 1048–1049 he had the Abbasid caliph of Baghdad named in the Friday sermon instead of the Fatimid, changed the coinage and received titles from Baghdad; in a letter to Cairo he set his own name before the caliph’s.
      - The Fatimid caliph al-Mustansir had no army to spare for the west. On the advice of his vizier al-Yazuri he granted the Maghreb in 1050 to the Banu Hilal and Banu Sulaym, Arab Bedouin tribes from Najd who had fought for the Qarmatians in Syria and had been moved to Upper Egypt in the 970s, where they lived as herders and raiders. Drought in Egypt made them ready to go. Decret writes that their chiefs received deeds to the towns and lands they were to take. The Sulaym stopped in Cyrenaica, around Barqa; the Hilal moved on with their families and herds along the coast into Tripolitania and the south of Ifriqiya.
    facts:
      - [Zirid recognition of the Abbasids, "about 1048–1049 (dates in the sources range from 1041 to 1051)"]
      - [Maghreb granted to the tribes, "1050"]
      - [Sulaym settle, "Cyrenaica"]
