  - title: Haydaran and the blockade of Kairouan
    date: April 1052 – 1057
    when: "1052-04"
    borders: "1052-04-14"
    countries: [tn]
    body:
      - Al-Mu’izz marched south to stop the tribes. On 14 April 1052, at Haydaran near Gabès, his army, said to number some 30,000 Sanhaja horsemen, was routed by about 3,000 Hilali cavalry, a day after a first clash. The figures come from the chroniclers and are uncertain, and the exact site of the battle is not known. The defeat opened the road to Kairouan.
      - For five years the tribes roamed the plains and the steppe around the capital, cutting it off from its farmland and trade, while al-Yazuri urged them on from Cairo. They drove the Zenata nomads out of the south of Ifriqiya, plundered villages and pastured their herds on the fields; country people fled to the walled towns, and many townspeople left for Egypt, Sicily, al-Andalus and Fez. The Hammadids of the Qal’a, rivals of the Zirids, made terms with the Arabs and used them as allies, and later had to pay them a share of their harvests.
    facts:
      - [Battle of Haydaran, "14 April 1052, Hilali victory"]
      - [Forces, "about 3,000 Hilali horsemen against a Zirid army said to be ten times larger"]
      - [Kairouan cut off, "1052–1057"]
    markers:
