notes:
  - The main accounts are by Ibn al-Athir, Ibn Idhari and Ibn Khaldun, written between one and three centuries after the events by men of the settled, urban world, drawing on lost earlier histories. The date of al-Mu’izz’s break with Cairo is disputed; the sources point to years between 1041 and 1051, most often 1048–1049.
  - "Estimates of the number of migrants range from a few tens of thousands of fighters to about 250,000 people; one historian has suggested up to a million with the Banu Sulaym. François Decret cites an estimate of 50,000 warriors and 200,000 Bedouin in all. The tribes came with their families and herds. The Hilal’s main branches were the Athbaj, Riyah, Zughba, Jusham, Adi and Rabi’a."
  - "The debate: French colonial-era historians such as Georges Marçais and Émile-Félix Gautier made the “Hilalian catastrophe” a key to North African history, setting destructive nomads against settled Berbers. From the 1960s historians such as Jean Poncet, who called it a myth, and Michael Brett argued that the decline of Ifriqiya’s cities had other causes as well, that the tribes arrived gradually and were used as allies by local rulers, and that the sources exaggerate. Almost all agree that the migration made the countryside of the Maghreb largely Arabic-speaking over the following centuries. The tribes’ journey west is also the subject of a great oral epic, the Sirat Bani Hilal."
