id: former-nine-years-war
name: Former Nine Years’ War
start: "1051"
end: "1062"
tier: B
summary: "The war in which the governor of Mutsu, Minamoto no Yoriyoshi, destroyed the Abe, a family of Emishi descent who ruled the six districts of the Kitakami basin in northern Honshu almost as an independent power. After the Abe defeated a governor at Onikiribe around 1051, the court sent Yoriyoshi, a warrior of the Kawachi branch of the Minamoto, as governor and later frontier commander. Peace held until 1056, when an attack on his officials at the Akuto River, blamed on Abe no Sadato, led to open war. Abe no Yoritoki was killed in 1057, but his son Sadato routed Yoriyoshi at Kinomi in a snowstorm that winter, and for five years the Abe collected taxes south of their border while the governor could do nothing. In 1062 Yoriyoshi won over the Kiyohara, an Emishi-descended family of Dewa, whose 10,000 men turned the war: within six weeks the allies took the Abe forts one after another, and on the 17th day of the ninth month of 1062 Kuriyagawa, near today’s Morioka, fell to fire. Sadato died of his wounds, and his brother-in-law Fujiwara no Tsunekiyo was beheaded. The Kiyohara inherited the Abe lands, and the victory became a founding legend of the Minamoto warrior house."
countries: [jp]
