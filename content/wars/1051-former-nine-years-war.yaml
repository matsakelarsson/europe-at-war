steps:
  - title: Onikiribe, the Akuto River and Kinomi
    date: 1051–1057
    when: "1057"
    borders: "1057"
    countries: [jp]
    body:
      - "Since the ninth century the land north of the Koromo River, the six districts of Iwate, Shiwa, Hienuki, Waga, Esashi and Isawa, had been governed for the court by chiefs of Emishi descent, and by the eleventh century the Abe held them by inheritance, collected their taxes and sent the court only a share. When Abe no Yoriyoshi (later Yoritoki) pushed his power south of the Koromo River, the governor of Mutsu, Fujiwara no Naritō, attacked him and was defeated at Onikiribe, west of today’s Ōsaki. The court replaced him with Minamoto no Yoriyoshi, a veteran of the campaign against Taira no Tadatsune. An amnesty in 1052 allowed a peace; the Abe chief, whose name was pronounced like the governor’s, changed it to Yoritoki out of deference, and in 1053 Yoriyoshi was also made frontier commander, the chinjufu shōgun."
      - "In 1056, as Yoriyoshi’s term was ending, the camp of one of his officials was attacked by night at the Akuto River. The official blamed Yoritoki’s son Sadato, whose suit for his sister he had refused; Yoriyoshi demanded that Sadato be handed over, and Yoritoki closed the barrier on the Koromo River. Yoriyoshi suspected his own officers who had married into the Abe and executed one of them, Taira no Nagahira, whereupon another, Fujiwara no Tsunekiyo, went over to the Abe with 800 horsemen. Yoriyoshi persuaded Abe no Tomitada, a chief of the far north, to turn on his kinsman, and in the seventh month of 1057 Yoritoki was wounded in an ambush and died at his fort of Torinomi."
      - "In the eleventh month of 1057 Yoriyoshi advanced with 1,800 horsemen against Sadato, who held the fort of Kawasaki with about 4,000 men. They met at Kinomi in a snowstorm; the governor’s army, cold and short of food, lost several hundred men, and Yoriyoshi escaped with only six riders, among them his son Yoshiie, who became famous for his archery that day. For the next four years the Abe collected taxes south of the Koromo River under Tsunekiyo’s “white tallies” rather than the governor’s red ones."
