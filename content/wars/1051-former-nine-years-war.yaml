  - title: The Kiyohara and the fall of Kuriyagawa
    date: "1062"
    when: "1062"
    borders: "1062"
    countries: [jp]
    body:
      - "Yoriyoshi’s second term ran out in 1062, but the officials of Mutsu refused to obey his successor, and Yoriyoshi stayed on. With repeated gifts he won over Kiyohara no Mitsuyori, chief of the Emishi-descended families of Senboku in Dewa, and in the seventh month Mitsuyori’s brother Kiyohara no Takenori crossed the mountains with 10,000 men. On the ninth day of the eighth month they joined Yoriyoshi’s 3,000 at Tamurogaoka; most of the seven divisions of the allied army were commanded by Kiyohara kinsmen."
      - "The allies took the fort of Komatsu on the 17th, beat off an attack by Sadato with 8,000 men on the fifth day of the ninth month, and forced the Koromo River barrier the next day, when soldiers crossed the river and set fires. The Abe abandoned Torinomi and their forts along the Kitakami one after another, and on the 15th the allies surrounded Kuriyagawa and Ubato, the last Abe strongholds. Arrows, stones and boiling water cost the attackers hundreds of men until Yoriyoshi had houses torn down and piled against the stockade and set alight. Kuriyagawa fell on the 17th day of the ninth month."
      - "Sadato was carried wounded before Yoriyoshi and died; Tsunekiyo was beheaded with a blunt sword to prolong his death, and Sadato’s young son was killed. His brothers Munetō and Ietō surrendered and were exiled to the west. The heads of Sadato, Tsunekiyo and Sadato’s brother Shigetō were paraded through the capital in 1063. Yoriyoshi was made governor of Iyo and Takenori frontier commander with the six districts. Tsunekiyo’s widow, Yoritoki’s daughter, married Takenori’s son, and her son by Tsunekiyo grew up as a Kiyohara; he was Fujiwara no Kiyohira, who would found the Northern Fujiwara after the Later Three Years’ War."
