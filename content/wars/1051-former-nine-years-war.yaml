notes:
  - "The war lasted twelve years; the name “nine years” comes from medieval chronicles that counted only Yoriyoshi’s campaigns, and from the war tale Mutsu waki, written soon after it, which gives the main account and the court’s side. It is also called the Zenkunen War or the Early Nine Years’ War."
  - Historians disagree on whether the Akuto River incident was a provocation staged by Yoriyoshi or local officials to justify a war; the Mutsu waki’s account has several inconsistencies. Dates are months of the Japanese lunar calendar.
