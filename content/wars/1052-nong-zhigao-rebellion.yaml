  - title: The Kunlun Pass
    date: September 1052 – February 1053
    when: "1053-02"
    borders: "1053-02-01"
    countries: [cn, vn]
    body:
      - Nong Zhigao marched back to Yongzhou and held it, defeating five Song commanders sent against him. The Song court then gave the command to Di Qing, who had made his name in the war against the Xia. He gathered 31,000 men and 32 generals, among them Fanluo horsemen from the north-west who were said to ride up and down mountains as if on level ground. The Lý emperor offered 20,000 troops, but the Song declined, fearing they would not leave again. When one general, Chen Shu, attacked early and was beaten, Di Qing had him and 31 officers executed.
      - Early in 1053, during the Lantern Festival according to the Song accounts, Di Qing took his army by night over the Kunlun Pass north-east of Yongzhou, which the rebels had left unguarded. Nong Zhigao attacked him at Guiren Pu. His men, in crimson, advanced behind long shields and at first drove the Song back, but the Song infantry broke their shields with heavy swords and axes while the cavalry struck their flanks. The rebels lost 5,341 men, and Di Qing retook Yongzhou.
      - Nong Zhigao fled to the Dali kingdom in Yunnan. His mother A Nong and his sons were caught at Temo by local chiefs allied to the Song and executed. According to some sources he was killed in Dali and his head sent to the Song; others say his fate is unknown, and stories tell of his flight further south.
    facts:
