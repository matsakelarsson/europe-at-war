notes:
  - Most of what is known comes from Song accounts, which call Nong Zhigao a “barbarian bandit”, and from Vietnamese chronicles; modern Chinese, Vietnamese and Zhuang writers each claim him in different ways.
  - Some English accounts date the battle at the Kunlun Pass to 1054; the Song records and Di Qing’s victory stele at Guilin, put up in 1053, date it to the first month of 1053.
