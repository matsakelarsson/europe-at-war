steps:
  - title: The Great South and Guangzhou
    date: May – August 1052
    when: "1052-07"
    borders: "1052-07-01"
    countries: [cn, vn]
    body:
      - Nong Zhigao’s father had proclaimed a kingdom in the hills around Guangyuan (today’s Cao Bằng) and was executed by the Lý emperor Lý Thái Tông in 1039. Nong Zhigao himself proclaimed kingdoms in 1042 and 1048, and each time a Vietnamese army drove him off. He asked the Song to take him under its protection, sending gold and tame elephants, but the court refused, regarding him as a subject of Đại Việt. In 1052, urged on by his mother A Nong and by Chinese advisers, he proclaimed the Kingdom of the Great South and took the title of emperor.
      - In the spring he ordered his villages burned and led some 5,000 followers out of the hills. He took Yongzhou (Nanning) and went down the West River, taking one Song prefecture after another, and by summer reached Guangzhou with an army said to number 50,000. He cut off the city’s water, but it was well stocked and its crossbowmen held the walls, and a magistrate, Xiao Zhu, burned the rebel boats in an attack from the river. After 57 days, with Song reinforcements arriving, Nong Zhigao gave up the siege.
    facts:
      - [Kingdom of the Great South proclaimed, "1052"]
      - [Yongzhou taken, "1052"]
      - [Siege of Guangzhou, "57 days"]
