id: nong-zhigao-rebellion
name: Nong Zhigao’s rebellion
start: "1052-05"
end: "1053-02"
tier: B
summary: "The rising of Nong Zhigao (Nùng Trí Cao), a chief of the Tai-speaking Nong clan of the hills on today’s border between Guangxi and Vietnam, ancestors of the Zhuang and the Nùng. Caught between the Lý emperors of Đại Việt, who had killed his father and twice crushed his attempts to found a kingdom, and the Song, which refused to accept him as a vassal, he proclaimed the Kingdom of the Great South (Danan) in 1052. With a few thousand followers who had burned their own villages, he took Yongzhou (Nanning), swept down the West River and besieged Guangzhou, the greatest port of the Song, for 57 days with an army that had grown to some 50,000. Failing to take it, he fell back to Yongzhou and beat several Song armies sent against him. Early in 1053 the Song general Di Qing, a veteran of the wars with the Xia, crossed the Kunlun Pass by night and routed the rebels outside Yongzhou. Nong Zhigao fled to the Dali kingdom, where his fate is unknown; his mother and sons were captured and executed. He is honoured today as a hero by many Zhuang and Nùng."
countries: [cn, vn]
sides:
