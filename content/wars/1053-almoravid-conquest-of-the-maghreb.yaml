  - title: Sijilmasa and Awdaghust
    date: 1054–1056
    when: "1054"
    borders: "1055-06-01"
    countries: [ma, mr]
    body:
      - Sijilmasa, the caravan city on the northern edge of the Sahara, was ruled by Zenata emirs of the Maghrawa. In 1054 or 1055 the Almoravids took the city and killed its emir, Mas’ud ibn Wanudin. It was their first great conquest, and from 1058 its mint struck their gold dinars. The same year they turned south against Awdaghust, the trading town at the southern end of the route, which recognised the authority of the king of Ghana. Al-Bakri, writing a few years later, says they violated its women and declared everything they seized booty of the community, because the town had accepted the rule of Ghana. Awdaghust may never have recovered.
      - The conquests strained the movement. The Gudala refused to follow, and in 1056 Yahya ibn Umar was killed fighting them at Tabfarilla. His brother Abu Bakr ibn Umar took command. In Sijilmasa the Maghrawa rose and killed the Lamtuna garrison, and Abu Bakr had to take the city again in 1056; he left his cousin Yusuf ibn Tashfin in command there.
    facts:
      - [Sijilmasa taken, "1054 or 1055"]
      - [Awdaghust sacked, "1054 or 1055"]
      - [Yahya ibn Umar killed at Tabfarilla, "1056"]
      - [Sijilmasa retaken, "1056"]
    markers:
