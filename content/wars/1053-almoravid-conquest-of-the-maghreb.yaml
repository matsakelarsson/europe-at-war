  - title: The Sous, Aghmat and the Barghawata
    date: 1056–1060
    when: "1058"
    borders: "1059-07-07"
    countries: [ma]
    body:
      - Abu Bakr and Ibn Yasin now turned north-west across the Atlas. In 1057 they took Taroudant and the Sous valley, and in 1058 Aghmat, the capital of the Maghrawa emir Laqut at the foot of the High Atlas, which became their capital. Laqut’s widow, Zaynab al-Nafzawiyya, married Abu Bakr and later Yusuf ibn Tashfin.
      - Beyond the Oum Er-Rbia lay the Barghawata, a confederation of the Atlantic plains of Tamesna between Salé and Safi, who had followed their own religion for three centuries, a faith that mixed Islam with Berber beliefs, with a scripture of eighty chapters attributed to their prophet Salih ibn Tarif. They had beaten off the Umayyads, the Fatimids and the Banu Ifran, and they fought the Almoravids hard. Ibn Yasin was killed in battle against them at Krifla, south-east of today’s Rabat, on 7 July 1059 (some sources give 1058); his tomb is still there. Abu Bakr avenged him with a campaign that broke the Barghawata state and forced them to accept orthodox Islam, though they were finally eliminated as a group only by the Almohads in 1149. Abu Bakr then advanced as far as Meknes.
    facts:
      - [Taroudant taken, "1057"]
      - [Aghmat taken, "1058"]
      - [Death of Ibn Yasin at Krifla, "7 July 1059 (or 1058)"]
    markers:
