  - title: Ceuta and the call from al-Andalus
    date: 1083–1087
    when: "1083"
    borders: "1083-08-01"
    countries: [ma, es]
    body:
      - Ceuta, the last port of the Strait still outside Almoravid hands, surrendered in 1083 (some accounts say 1084). Yusuf ibn Tashfin now ruled the whole of the western Maghreb from the Sous to Algiers, a realm held together by the Lamtuna and Massufa commanders of the desert, by Maliki jurists, who were given great influence, and by the gold that came north through Sijilmasa.
      - Across the Strait the taifa kings of al-Andalus were paying tribute to Alfonso VI of Castile, who took Toledo in 1085. They called on Yusuf for help. In 1086 his army crossed to Algeciras and on 23 October routed Alfonso at Sagrajas (al-Zallaqa); within a few years the Almoravids had taken over al-Andalus itself, a story told in the Reconquista. Abu Bakr ibn Umar was killed in the Tagant in November 1087, and Yusuf, who took the title Commander of the Muslims and recognised the Abbasid caliph, ruled al-Andalus as well as the Maghreb and the Sahara until his death in 1106.
    facts:
      - [Ceuta surrenders, "1083 (or 1084)"]
      - [Almoravids cross to al-Andalus, "1086"]
      - [Battle of Sagrajas, "23 October 1086, Almoravid victory"]
    markers:
