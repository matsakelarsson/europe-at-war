notes:
  - The main sources are al-Bakri’s geography (1068), the only one written while the conquests were going on, and later chronicles, above all Ibn Idhari, Ibn Abi Zar’s Rawd al-Qirtas (14th century) and Ibn Khaldun. They often disagree on dates by several years, especially for the founding of Marrakesh (1062 or 1070) and the taking of Fez (1069–1070 or 1074–1075); the text gives the ranges.
  - "The name al-Murabitun, from which “Almoravid” comes, is explained in several ways: as the men of a ribat, a fortified retreat for religious warriors, perhaps on an island; as an honorific given after an early battle; or from the school of Waggag ibn Zallu, Dar al-Murabitin, where Ibn Yasin studied. The Sanhaja men of the desert covered their faces with a veil, the litham, and their enemies called them al-mulaththamun, the veiled ones."
  - The Almoravid wars in al-Andalus from 1086 are told in the Reconquista; the question whether the Almoravids conquered Ghana is in a separate entry, The Almoravids and Ghana.
