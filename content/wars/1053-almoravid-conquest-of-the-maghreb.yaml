id: almoravid-conquest-of-the-maghreb
name: Almoravid conquest of the Maghreb
start: "1053"
end: "1083"
tier: A
summary: "The rise of the Almoravids (al-Murabitun), a movement of religious reform among the veiled Sanhaja Berbers of the western Sahara, and their conquest of what is now Morocco and western Algeria. Brought to the Gudala and Lamtuna tribes by the Maliki scholar Abdallah ibn Yasin in the 1040s, the movement took the caravan cities at both ends of the western Saharan trade in 1054–1055, Sijilmasa in the north and Awdaghust in the south. Under the Lamtuna chiefs Yahya ibn Umar and Abu Bakr ibn Umar it conquered the Sous, Aghmat (1058) and the Barghawata of the Atlantic plains, whose own faith it stamped out; Ibn Yasin was killed fighting them in 1059. Abu Bakr founded Marrakesh and went back to the desert, leaving the north to his cousin Yusuf ibn Tashfin, who took Fez from its Zenata emirs (1069–1075), then Tangier, Tlemcen and Algiers, and in 1083 Ceuta on the Strait. The Almoravids ruled from the Senegal to the Mediterranean, and in 1086 they crossed into al-Andalus at the call of its Muslim kings."
countries: [ma, dz, mr, eh]
