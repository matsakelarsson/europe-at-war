  - title: Tangier, Tlemcen and Algiers
    date: 1077–1082
    when: "1080"
    borders: "1082-06-01"
    countries: [ma, dz]
    body:
      - Tangier and Ceuta on the Strait were ruled by Suqut, a commander of Barghawata origin who had governed them for the Hammudid caliphs of Málaga and made himself independent shortly before 1061; he could field about 12,000 horsemen. In 1078–1079 Yusuf’s armies defeated his forces and took Tangier, while his family held out in Ceuta. In 1080 the Almoravids destroyed Nekor, the old capital of the Rif.
      - In the east the Zenata Banu Ya’la of Tlemcen and the Maghrawa still held the land from the Moulouya to the central Maghreb. In 1079 Yusuf’s general Mazdali ibn Tilankan defeated the Banu Ya’la with an army said to number 20,000 near the Moulouya, and in 1079–1081 Yusuf took Oujda and Tlemcen, where he founded a new town, Tagrart, next to the old one. In 1082 his armies took Oran, Ténès and Algiers, which became the eastern frontier of the Almoravid realm, facing the Hammadids.
    facts:
      - [Tangier taken, "1078–1079"]
      - [Nekor destroyed, "1080"]
      - [Oujda and Tlemcen, "1079–1081"]
      - [Algiers taken, "1082"]
