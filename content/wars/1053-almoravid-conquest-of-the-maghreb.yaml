        side: alm
        name: Sijilmasa
        date: 1054–1055, again 1056
        text: The Maghrawa emir Mas’ud ibn Wanudin was killed. After a rising killed the garrison, Abu Bakr retook the city in 1056 and left Yusuf ibn Tashfin in command.
        lonlat: [-4.270, 31.290]
      - kind: taken
        side: alm
        name: Awdaghust
        date: 1054–1055
        text: The trading town of the southern Sahara, then under Ghana’s authority, was sacked; al-Bakri says the Almoravids abused its women and took all its goods as booty. Its ruins are at Tegdaoust in Mauritania.
        lonlat: [-10.417, 17.417]
