  - title: Fez and the Zenata emirs
    date: 1063–1075
    when: "1070-03"
    borders: "1075-06-01"
    countries: [ma]
    body:
      - The north of Morocco was divided among Zenata emirs of the Maghrawa and the Banu Ifran, who had ruled it for Córdoba and then on their own since the fall of the caliphate. Fez itself had been split between two rival emirs ruling its two walled halves, and in 1062 the Hammadids of the central Maghreb briefly took it. From 1063 Yusuf ibn Tashfin campaigned against the Zenata strongholds of the Middle Atlas and the Saïs plain, and their chiefs submitted or fled.
      - Fez was taken in 1069 or 1070, on 18 March 1070 according to one modern reckoning, though some historians date the conquest to 1074 or 1075. The Almoravids sacked the city and killed many of its Zenata defenders. Yusuf then tore down the walls between the two banks of the river, joining the old Idrisid towns into one city inside a new wall, built bridges and a citadel and extended its water system, and is sometimes called its second founder.
    facts:
      - [Campaign against the Zenata, "from 1063"]
      - [Fez taken, "1069–1070 (some historians 1074–1075)"]
    markers:
      - kind: taken
        side: alm
        name: Fez
        date: 1069–1075
        text: Taken from the Zenata emirs, perhaps on 18 March 1070, and sacked; its defenders were massacred. Yusuf joined its two walled towns into one city.
        lonlat: [-4.978, 34.062]
      - kind: capital
        side: alm
        name: Marrakesh
        date: "1070"
        text: Yusuf’s capital.
        lonlat: [-7.989, 31.629]
