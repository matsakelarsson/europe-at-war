  - title: Marrakesh and the parting of the cousins
    date: 1060–1072
    when: "1070"
    borders: "1070-01-01"
    countries: [ma, mr]
    body:
      - On the plain of the Tensift, a few hours’ ride from Aghmat, Abu Bakr set up a camp that grew into a new capital, Marrakesh. The chronicles date its founding to 1062 or to 1070; most modern historians prefer 1070. Its first buildings were a fortress of stone, the Qasr al-Hajar, and a mosque, and Yusuf ibn Tashfin completed the city and is counted as its co-founder.
      - News of a revolt among the Gudala, which threatened the caravan routes, called Abu Bakr back to the Sahara, in about 1060 according to some chronicles and in 1071 according to others. He left the north in the hands of Yusuf, and before going he divorced Zaynab, who married Yusuf. When Abu Bakr came back, he found Yusuf too strong to be displaced and accepted the division. Abu Bakr remained nominal head of the Almoravids and kept the Sahara, while Yusuf ruled the north, striking coins in Abu Bakr’s name until his death. Abu Bakr spent the rest of his life fighting in the desert and the Sahel, and was killed by a poisoned arrow in the Tagant in 1087.
    facts:
      - [Marrakesh founded, "1070 (some chronicles 1062)"]
      - [Abu Bakr returns to the Sahara, "about 1060 or 1071"]
      - [Death of Abu Bakr, "1087, in the Tagant"]
    markers:
