steps:
  - title: Ibn Yasin and the veiled Sanhaja
    date: about 1040–1053
    when: "1050"
    borders: "1050-01-01"
    countries: [mr, eh, ma]
    body:
      - In the western Sahara, between the Senegal river and the Draa, lived Sanhaja Berber tribes, the Gudala near the Atlantic, the Lamtuna in the Adrar and the Massufa to the east, camel herders who controlled the caravan routes between the Maghreb and the gold-producing lands of the Sahel. Their Islam was recent and, in the eyes of North African scholars, shallow. About 1040 the Gudala chief Yahya ibn Ibrahim, returning from the pilgrimage, asked the Maliki jurist Abu Imran al-Fasi in Kairouan for a teacher for his people. He was sent on to Waggag ibn Zallu, whose school at Aglu in the Sous gave him one of its pupils, Abdallah ibn Yasin.
      - Ibn Yasin preached a strict Maliki Islam, with harsh punishments, the payment of only the taxes the law allowed and war on those who would not follow. After Yahya ibn Ibrahim’s death the Gudala drove him out. The Lamtuna chief Yahya ibn Umar took him in, and his followers, the Almoravids, became a disciplined army of the desert, led in religious matters by Ibn Yasin and in war by Yahya ibn Umar. By the early 1050s they were strong enough to move north.
    facts:
      - [Yahya ibn Ibrahim’s pilgrimage, "about 1040"]
      - [Ibn Yasin’s teacher, "Waggag ibn Zallu of Aglu"]
      - [First allies, "the Lamtuna under Yahya ibn Umar"]
