id: almoravids-and-ghana
name: The Almoravids and Ghana
start: "1054"
end: "1076"
tier: C
summary: "The contacts and conflict between the Almoravid movement of the western Sahara and the Soninke kingdom of Ghana in the Sahel, and the long debate about whether the Almoravids conquered Ghana in 1076. What is certain is that in 1054–1055 the Almoravids sacked Awdaghust, a Saharan trading town that recognised the king of Ghana. Al-Bakri, writing in 1068, describes Ghana under its kings Bassi and Tunka Manin as rich and powerful, with a royal town and a Muslim merchants’ town with twelve mosques, Muslim officials at court and a king who kept the old religion; Tunka Manin is said to have corresponded with Yusuf ibn Tashfin. Hints in later Arabic writers, above all Ibn Khaldun, gave rise to the long-held view that the Almoravids conquered Ghana in 1076–1077 and forced its people to convert. In 1982 David Conrad and Humphrey Fisher argued that this conquest was largely a misreading of the sources; others accept that Almoravid pressure and agitation weakened Ghana, and archaeology at Koumbi Saleh, the site most often identified with the capital, shows no sign of a sudden destruction. Ghana’s rulers did become Muslim around this time, and in 1154 al-Idrisi described the country as Muslim and its capital as the greatest town of the Sudan."
