notes:
  - "Everything written about these events comes from North African and Andalusi writers in Arabic: al-Bakri (1068) never saw Ghana himself but used merchants’ reports; al-Zuhri (about 1140), al-Idrisi (1154) and Ibn Khaldun (late 14th century) wrote later. The identification of the capital with the ruins of Koumbi Saleh in south-eastern Mauritania is widely accepted but disputed."
  - Ghana’s later decline, the rise of the Sosso kingdom and the Mali Empire are told in the entries on the Sosso and the battle of Kirina.
