steps:
  - title: Ruhuna and the first attack on Polonnaruwa
    date: 1055–1066
    when: "1055"
    borders: "1066"
    countries: [lk, in]
    body:
      - Since Rajendra I captured Mahinda V in 1017, the Cholas had ruled the north of Sri Lanka from Polonnaruwa, while Sinhalese princes held out in the forests and hills of Ruhuna. In 1055 a young prince of the royal line, Kitti, took the lead of the resistance under the name Vijayabahu, and by 1058 he had made himself master of Ruhuna. The Chola king Virarajendra sent the army stationed in the island against him, and Vijayabahu sought help from abroad; the Culavamsa says that Anawrahta, the king of Pagan in Burma, sent him ships laden with goods.
      - In 1066 Vijayabahu marched north and took Polonnaruwa, but fresh Chola troops landed from India and drove him out. He fell back into the hills of the south-west and later made Kataragama his base, keeping up raids and stirring revolts in the Chola-held north.
    facts:
      - [Vijayabahu leads the resistance, "1055"]
      - [Ruhuna freed, "about 1058"]
      - [First capture of Polonnaruwa, "1066, lost again"]
