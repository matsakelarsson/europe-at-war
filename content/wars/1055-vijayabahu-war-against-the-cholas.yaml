notes:
  - The war is known mainly from the Sinhalese chronicle Culavamsa, written long afterwards, and from a few Chola inscriptions, which claim victories in the island under Virarajendra. The dates of the early campaigns are uncertain, and historians give Vijayabahu’s coronation as anything from 1055 to 1073, depending on how they count his reign.
