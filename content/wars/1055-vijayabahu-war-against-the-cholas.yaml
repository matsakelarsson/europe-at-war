id: vijayabahu-war-against-the-cholas
name: Vijayabahu’s war against the Cholas
start: "1055"
end: "1070"
tier: B
summary: The war in which the Sinhalese prince Kitti, crowned as Vijayabahu I, drove the Chola Empire out of Sri Lanka. From 1055 he led the resistance in Ruhuna, the south-eastern province the Cholas had never firmly held, and by 1058 he controlled it. A first attack on the Chola capital of Polonnaruwa in 1066 was beaten back by reinforcements from India, but when the Chola kingdom was shaken by a disputed succession in 1069–1070, his armies took Anuradhapura and, after a siege of about seven months, Polonnaruwa. The Cholas withdrew in 1070, ending more than seventy years of occupation in the north, and the island was united under one king again for the first time in over a century.
