  - title: The fall of Polonnaruwa
    date: 1069–1070
    when: "1070"
    borders: "1070"
    countries: [lk, in]
    body:
      - Virarajendra died in 1069, and his son Adhirajendra was killed within months in a disturbance that brought the Eastern Chalukya prince Kulottunga I to the Chola throne in 1070. Vijayabahu used the confusion. He sent three armies north, one along the west coast towards Mahatittha, one through Magama in the east, and the main force by way of Mahiyangana. Anuradhapura fell quickly; the Chola garrison of Polonnaruwa held out for about seven months before the city was taken. After some indecisive fighting the Cholas withdrew from the island, and Kulottunga, busy on the mainland, did not try to win it back.
      - Vijayabahu was crowned and made Polonnaruwa his capital, more central than Anuradhapura and closer to the turbulent south. In about 1084 his Velakkara mercenaries, from southern India, refused to fight the Cholas and rose against him; he fled the city for a time before crushing them. He rebuilt the monasteries that had decayed under Chola rule and invited monks from Burma to restore the Buddhist ordination, and he reigned until 1110.
    facts:
      - [Polonnaruwa taken, "1070, after a siege of about seven months"]
      - [Cholas leave Sri Lanka, "1070"]
