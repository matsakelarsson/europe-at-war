id: basasiri-revolt
name: Revolt of al-Basasiri
start: "1058-12"
end: "1060-01"
tier: C
summary: The seizure of Baghdad for the Fatimid caliphate of Cairo by al-Basasiri, the Turkish commander of the last Buyids in Iraq. Driven out when the Seljuk Tughril entered Baghdad in 1055, al-Basasiri took service with the Fatimid caliph al-Mustansir, defeated a Seljuk force at Sinjar in January 1057 and briefly held Mosul. In 1058 Tughril’s half-brother Ibrahim Inal rebelled in western Iran and drew Tughril away, and in late December al-Basasiri entered Baghdad with his Arab allies, the Uqaylid emir Quraysh and the Mazyadid Dubays. For about forty weeks the Friday sermon was read in the name of the Fatimid caliph. The Abbasid caliph al-Qa’im was sent into custody at Haditha on the Euphrates, and his vizier Ibn al-Muslima was executed. After defeating and executing Ibrahim Inal, Tughril marched back to Iraq. Al-Basasiri left Baghdad in December 1059, al-Qa’im was restored, and al-Basasiri was defeated and killed near Kufa in January 1060.
