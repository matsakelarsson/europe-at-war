        via: [[0.57, 50.86], [0.53, 50.88], [0.5, 50.905]]
  - title: Submission and coronation
    date: October–December 1066
    when: "1066-10-15"
    borders: "1066-12-25"
    countries: [gb]
    body:
      - No one came to submit. In London the leading men, with the earls Edwin and Morcar and the archbishops Stigand and Ealdred, chose as king Edgar Ætheling, a teenage great-nephew of Edward the Confessor. William waited at Hastings for some days, then moved along the Kent coast, punishing Romney, where some of his men had been killed. Dover castle surrendered and Canterbury submitted, while a detachment took the submission of Winchester, the old royal city. At Southwark William beat off an English force and burned the suburb, but he could not cross London Bridge.
      - Instead he circled London to the west, ravaging the land as he went, crossed the Thames at Wallingford, where Archbishop Stigand submitted, and turned east. At Berkhamsted Edgar, Ealdred, Edwin, Morcar and the leading Londoners came to submit. William was crowned in Westminster Abbey on Christmas Day 1066 by Ealdred. When the congregation shouted their acclamation in English and French, Norman guards outside took it for a riot and set fire to houses nearby. In March 1067 William went back to Normandy, taking Edgar, the earls and Stigand with him, and left his half-brother Odo and William FitzOsbern in charge.
    facts:
      - [Edgar Ætheling chosen king, "October 1066, never crowned"]
      - [Submission at Berkhamsted, "December 1066"]
      - [Coronation of William, "25 December 1066, Westminster Abbey"]
    markers:
      - kind: taken
        side: nor
        name: Dover
        date: October 1066
        text: The garrison of the fortified town on the cliffs surrendered. Many of William’s men fell ill with dysentery here.
        lonlat: [1.32, 51.128]
      - kind: taken
        side: nor
        name: Canterbury
        date: October–November 1066
        text: The men of Canterbury came out to submit before William reached the city.
        lonlat: [1.08, 51.28]
      - kind: battle
        side: nor
        name: Southwark
        date: November 1066
        text: Norman knights drove back an English sortie and burned the suburb at the south end of London Bridge.
        lonlat: [-0.09, 51.502]
        lp: b
      - kind: event
        side: nor
        name: Wallingford
        date: Late 1066
        text: William crossed the Thames at this fortified town. Stigand, archbishop of Canterbury, came to submit.
        lonlat: [-1.125, 51.6]
      - kind: event
        side: nor
        name: Berkhamsted
        date: December 1066
        text: Edgar Ætheling and the English leaders submitted to William and gave hostages.
        lonlat: [-0.563, 51.76]
      - kind: event
        side: nor
        name: Westminster Abbey
        date: 25 December 1066
        text: William was crowned in Edward the Confessor’s new abbey church, where Harold had been crowned less than a year before.
        lonlat: [-0.128, 51.499]
        lp: l
