id: norman-conquest-of-england
name: Norman Conquest of England
start: "1066-09-28"
end: "1071"
tier: A
summary: The conquest of England by William, duke of Normandy, who landed in Sussex in September 1066, defeated and killed King Harold at Hastings and was crowned at Westminster on Christmas Day. Over the next five years he put down a series of English risings, some backed by the Danes and the Welsh, laid waste to the north and took the last rebel stronghold, the Isle of Ely, in 1071. A French-speaking Norman aristocracy and church replaced the English ruling class.
countries: [gb, fr, dk]
sides:
  - id: nor
    name: William and the Normans
    polities: []
    ink: blue
    moves: Norman moves
    success: Norman success
  - id: eng
    name: English
    polities: [england]
    ink: red
    moves: English moves
    success: English success
  - id: dan
    name: Denmark
    polities: [denmark]
    ink: gold
    moves: Danish moves
    success: Danish success
notes:
  - The main sources are the Anglo-Saxon Chronicle and, on the Norman side, William of Poitiers and William of Jumièges, both writing to justify the conquest; Orderic Vitalis and the chroniclers of the next generation add detail. The Bayeux Tapestry, made in England probably in the 1070s for William’s half-brother Odo, tells the Norman story in pictures.
  - Numbers are uncertain. Writers of the time give impossible figures; modern estimates for each army at Hastings range from about 5,000 to more than 10,000 men.
  - The Norwegian invasion of September 1066 and the Battle of Stamford Bridge are told in their own story, the Norwegian invasion of England.
