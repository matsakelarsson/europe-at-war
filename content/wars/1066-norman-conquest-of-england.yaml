steps:
  - title: The claim and the landing
    date: January–September 1066
    when: "1066-09-28"
    borders: "1066-09-28"
    countries: [gb, fr]
    body:
      - Edward the Confessor died childless on 5 January 1066, and the next day Harold Godwinson, earl of Wessex and the most powerful man in England, was crowned king. William, duke of Normandy, a great-nephew of Edward’s Norman mother, Emma, claimed that Edward had promised him the throne, probably in 1051, and that Harold had sworn on holy relics to support him during a visit to Normandy around 1064. Norman writers later said the pope had blessed the invasion with a banner, but no other source supports this. A third claimant, Harald Hardrada of Norway, invaded the north in September; that story is told in the Norwegian invasion of England.
      - William gathered knights from Normandy, Brittany, Flanders and other parts of France and built a fleet of several hundred ships. The army was ready by August, but contrary winds, and perhaps caution, kept it waiting at the mouth of the Dives and then at Saint-Valery-sur-Somme. Harold guarded the south coast all summer but sent his levies home on 8 September when their supplies ran out, then hurried north to destroy the Norwegians at Stamford Bridge on 25 September. Three days later William landed unopposed at Pevensey. He built a timber castle at Hastings and ravaged the countryside around it, much of it Harold’s own land.
    facts:
      - [William’s landing, "28 September 1066, at Pevensey"]
      - [William’s fleet, "Several hundred ships; one contemporary list gives 776"]
      - [William’s army, "Perhaps 7,000–12,000 men, by modern estimates"]
