  - title: The Danes and the Harrying of the North
    date: 1069–1070
    when: "1069-01-28"
    borders: "1070-03"
    countries: [gb, dk]
    side_names:
      eng: English rebels
    move_names:
      eng: Rebel moves
    body:
      - On 28 January 1069 the Northumbrians broke into Durham and killed the new Norman earl, Robert de Comines, and many of his several hundred men. Rebels joined by Edgar Ætheling besieged York’s castle until William hurried north, relieved it and built a second one. In late summer a Danish fleet of 240 or 300 ships, sent by King Sweyn Estridsson, a nephew of Cnut, came down the coast under his brother Asbjørn and his sons. Beaten off at Dover, Sandwich, Ipswich and Norwich, it entered the Humber, where Edgar, Gospatric and Earl Waltheof joined it with the men of Yorkshire. In September they stormed York and destroyed the garrisons of both castles. Risings followed at Shrewsbury, Exeter and Montacute.
      - William dealt with them in turn. He drove the Danes back across the Humber, beat the Mercian rebels at Stafford, forced the crossing of the Aire at Pontefract and retook York, where he wore his crown at Christmas. He paid the Danes, who agreed to leave in the spring. Through the winter his troops laid waste the land between the Humber and the Tees and beyond, burning villages, crops and livestock so that the north could not feed another rebellion. Famine followed. Orderic Vitalis, writing some fifty years later, said that more than 100,000 people died, a figure historians treat as rhetoric, and in 1086 Domesday Book still recorded much of Yorkshire as waste. Early in 1070 William crossed the Pennines in deep winter and built castles at Chester and Stafford.
    facts:
      - [Danish fleet, "240 or 300 ships, August–September 1069"]
      - [York taken by the Danes and English, "September 1069"]
      - [Harrying of the North, "Winter 1069–1070"]
    markers:
      - kind: taken
        side: eng
        name: Durham
        date: 28 January 1069
        text: Robert de Comines ignored the bishop’s warning and entered the city. The rebels burned the bishop’s house, where he had taken refuge.
        lonlat: [-1.575, 54.775]
      - kind: taken
        side: eng
        name: York
        date: September 1069
        text: The Danes and the English rebels took the city together and killed or captured the Norman garrisons. William retook it before Christmas.
        lonlat: [-1.08, 53.96]
      - kind: siege
        side: nor
        name: Shrewsbury
        date: Autumn 1069
        text: Eadric the Wild, the Welsh and the men of Cheshire burned the town but could not take the Norman castle.
        lonlat: [-2.75, 52.708]
      - kind: battle
        side: nor
        name: Stafford
        date: Late 1069
        text: William defeated the Mercian rebels here before turning north again.
        lonlat: [-2.117, 52.806]
        lp: b
      - kind: taken
        side: nor
        name: Chester
        date: Early 1070
        text: The last major English town to be occupied. William reached it after a winter march across the Pennines and built a castle.
        lonlat: [-2.89, 53.19]
        lp: l
