  - title: The first risings
    date: 1067–1068
    when: "1067"
    borders: "1068-12"
    countries: [gb, fr]
    side_names:
      eng: English rebels
    move_names:
      eng: Rebel moves
    body:
      - William rewarded his followers with the lands of the English who had fought at Hastings, and his men built castles to hold down the towns. Resistance broke out while he was away. In 1067 Eadric the Wild, a Shropshire thegn, joined the Welsh kings of Gwynedd and Powys to ravage Herefordshire, and rebels in Kent called in Count Eustace of Boulogne, who attacked Dover castle and was beaten off. William returned in December. Early in 1068 Exeter, where Harold’s mother Gytha had taken refuge, refused to take an oath to him; he besieged it for eighteen days, with heavy losses, before it surrendered on terms. Gytha escaped by boat.
      - In the summer of 1068 Earls Edwin and Morcar rose in Mercia with Welsh help, while the north, not yet occupied, stirred under its new earl, Gospatric. William marched north, building castles at Warwick and Nottingham, and York submitted without a fight. Edwin and Morcar gave in again, and Gospatric and Edgar Ætheling fled to King Malcolm III in Scotland. On the way south William ordered castles at Lincoln, Huntingdon and Cambridge. Meanwhile Harold’s sons, who had fled to Ireland, raided Somerset and Devon from the sea.
    facts:
      - [Siege of Exeter, "Early 1068, eighteen days"]
      - [Castles of 1068, "Exeter, Warwick, Nottingham, York, Lincoln, Huntingdon and Cambridge"]
    markers:
      - kind: held
        side: nor
        name: Dover
        date: Autumn 1067
        text: Eustace of Boulogne, who had fought for William at Hastings, crossed with a small force at the invitation of Kentish rebels but failed to take the castle.
        lonlat: [1.32, 51.128]
      - kind: event
        side: eng
        name: Hereford
        date: "1067"
        text: Eadric the Wild and his Welsh allies attacked the Normans based in Hereford and ravaged the land up to the River Lugg.
        lonlat: [-2.716, 52.056]
      - kind: siege
        side: nor
        name: Exeter
        date: Early 1068
        text: The city held out for eighteen days and then surrendered on generous terms. William built Rougemont Castle inside its walls.
        lonlat: [-3.53, 50.726]
      - kind: event
        side: nor
        name: Warwick
        date: Summer 1068
        text: The first of the castles William built on his march north. Edwin and Morcar submitted soon after.
        lonlat: [-1.585, 52.282]
      - kind: taken
        side: nor
        name: York
        date: Summer 1068
        text: The northern capital submitted as William approached. He built a castle there and left a garrison.
        lonlat: [-1.08, 53.96]
    arrows:
      - side: nor
        label: William, early 1068
        via: [[-0.13, 51.5], [-1.3, 51.07], [-2.5, 50.83], [-3.48, 50.73]]
