  - title: Ely and Hereward
    date: 1070–1072
    when: "1070"
    borders: "1071"
    countries: [gb, dk]
    side_names:
      eng: English rebels
    move_names:
      eng: Rebel moves
    body:
      - In the spring of 1070 King Sweyn came to England himself. His men went into the fens around the Isle of Ely, then an island in the marshes, and joined local rebels led by Hereward, a Lincolnshire landholder. Together they plundered Peterborough Abbey, whose new abbot was a Norman, and carried its treasure to the ships. Sweyn then made peace with William, took a payment and sailed home with the loot, leaving the English in the fens on their own.
      - In 1071 Edwin and Morcar fled from William’s court. Edwin was betrayed and killed by his own men; Morcar reached Ely, where Bishop Æthelwine of Durham and other exiles had joined Hereward. William came with an army and a fleet. According to later accounts his first causeway sank into the marsh, and the Normans got across only when the monks showed them a way; the island surrendered. Morcar spent the rest of his life in prison, while Hereward escaped into legend. In 1072 William marched into Scotland, and at Abernethy Malcolm III submitted to him. By the time of Domesday Book in 1086 almost all the great estates and bishoprics of England were held by Normans and other Frenchmen.
    facts:
      - [Danes at Ely, "Spring–summer 1070"]
      - [Siege of Ely, "1071, Norman victory"]
      - [Treaty of Abernethy, "1072, Malcolm III submits to William"]
    markers:
      - kind: taken
        side: eng
        name: Peterborough
        date: "1070"
        text: Hereward and the Danes sacked the abbey to keep its treasure from the new Norman abbot, Turold. The town was burned.
        lonlat: [-0.244, 52.572]
      - kind: siege
        side: nor
        name: Isle of Ely
        date: "1071"
        text: The last English stronghold, ringed by fens. The abbey on the island was the rebels’ base.
        lonlat: [0.263, 52.399]
      - kind: event
        side: nor
        name: Aldreth
        date: "1071"
        text: Tradition places William’s causeway here, on the old route from Cambridge. An earthwork nearby is still called Belsar’s Hill after one of his knights.
        lonlat: [0.115, 52.35]
        lp: l
    arrows:
      - side: dan
        label: Sweyn’s Danes
        via: [[0.35, 52.95], [0.3, 52.7], [0.27, 52.43]]
      - side: nor
        label: William
        via: [[0.12, 52.2], [0.1, 52.32], [0.23, 52.39]]
