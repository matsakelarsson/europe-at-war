  - title: Hastings
    date: 14 October 1066
    when: "1066-10-14"
    borders: "1066-10-14"
    countries: [gb, fr]
    body:
      - Harold came back to London and stayed about a week gathering men, then marched into Sussex, perhaps hoping to surprise William as he had surprised the Norwegians. Norman scouts gave warning, and on the morning of 14 October William led his army out of Hastings. Harold had taken up position on a ridge about ten kilometres to the north-west, where the town of Battle now stands. The armies were probably of similar size, but the English all fought on foot, the housecarls and the fyrd levies, with few archers, while William had archers, infantry and mounted knights.
      - The battle lasted from about nine in the morning until dusk. The English shield wall held against arrows and charges, and part of William’s army, the Bretons on the left, broke and fled until William showed himself to quell a rumour that he was dead; the English who ran after them were cut down. Norman writers say the knights twice more feigned flight to draw men out of the line. Late in the day Harold was killed, with his brothers Gyrth and Leofwine. How he died is not known; the arrow in the eye may be a later story. The English broke, though many of the housecarls fought on around their dead king.
    facts:
      - [Battle of Hastings, "14 October 1066, Norman victory"]
      - [Killed, "King Harold and his brothers Gyrth and Leofwine"]
      - [Battle Abbey, "Founded by William on the battlefield, its altar where Harold fell"]
    markers:
      - kind: battle
        side: nor
        name: Battle of Hastings
        date: 14 October 1066
        text: Fought on Senlac Hill, eleven kilometres from Hastings. William later built Battle Abbey on the site.
        lonlat: [0.487, 50.913]
      - kind: held
        side: nor
        name: Hastings
        date: October 1066
        text: William’s base and castle, which he left early on the morning of the battle.
        lonlat: [0.573, 50.856]
        lp: b
      - kind: event
        side: eng
        name: London
        date: Early October 1066
        text: Harold waited here for about a week, gathering troops, before marching south. Many levies had not arrived when he left.
        lonlat: [-0.093, 51.51]
