steps:
  - title: Hardrada lands; Fulford
    date: September 1066
    when: "1066-09-20"
    borders: "1066-09-20"
    countries: ["no", gb]
    body:
      - When Edward the Confessor died in January 1066, the English chose Harold Godwinson as king. Two foreign rulers also claimed the throne, William of Normandy and Harald Hardrada of Norway, a veteran warrior who had served the Byzantine emperor. Harold’s brother Tostig, driven out as earl of Northumbria in 1065, had raided the English coast that spring and now joined Hardrada. In September a Norwegian fleet, 300 ships according to the Chronicle, sailed by way of Orkney to the coast of Yorkshire.
      - The fleet rowed up the Humber and the Ouse to Riccall, south of York. On 20 September the northern earls, Edwin of Mercia and Morcar of Northumbria, met the invaders at Fulford, just outside the city. After heavy fighting on both sides the English broke. York surrendered on condition that it would not be sacked, and agreed to hand over hostages and supplies. The Norwegians went back to their ships to wait.
