notes:
  - The English sources are the Anglo-Saxon Chronicle and later Anglo-Norman writers; the Norwegian story is told in Snorri Sturluson’s saga of Harald Hardrada, written about 170 years later. Numbers of ships and men are uncertain.
  - The battle is traditionally seen as the end of the Viking Age, though Danish and Norwegian kings still sent fleets to Britain and Ireland in the following decades.
