id: norwegian-invasion-of-england-1066
name: Norwegian invasion of England
start: "1066-09"
end: "1066-09-25"
tier: B
summary: King Harald Hardrada of Norway invaded England in September 1066 to claim its throne, together with the exiled Earl Tostig. He won at Fulford but was killed with most of his army at Stamford Bridge by King Harold Godwinson, three weeks before Harold’s own defeat at Hastings.
