  - title: Stamford Bridge
    date: 25 September 1066
    when: "1066-09-25"
    borders: "1066-09-25"
    countries: ["no", gb]
    body:
      - King Harold had spent the summer guarding the south coast against William. Hearing of the invasion, he marched north from London, covering some 185 miles in about four days, and passed through York on the morning of 25 September. The Norwegians had gone to Stamford Bridge on the Derwent to collect the hostages, many of them without their mail shirts in the warm weather. They were taken completely by surprise.
      - The fighting lasted most of the day. Hardrada was killed early, struck in the throat by an arrow according to the sagas, and Tostig soon after. Men from the ships at Riccall under Eystein Orre ran to join the battle and were cut down in turn. Harold let the survivors, among them Hardrada’s son Olaf and the earl of Orkney, sail home; only 24 ships were needed to carry them. Three days later William landed in Sussex, and on 14 October Harold was killed at Hastings.
    facts:
