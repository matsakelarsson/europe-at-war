id: ly-champa-war
name: Lý–Champa war of 1069
start: "1069"
end: "1069"
tier: C
summary: "A seaborne expedition against Champa led by the Lý emperor Lý Thánh Tông of Đại Việt, with the eunuch general Lý Thường Kiệt in command of the vanguard. The Vietnamese chronicles give as its cause the Cham raids on the border that followed a tribute mission in 1068. In the spring of 1069 the fleet sailed south, defeated the Cham army and burned the capital, Vijaya (in today’s Bình Định); the king, whom the chronicles call Chế Củ and modern historians usually identify with Rudravarman III, fled towards Cambodia and was captured. Brought to Thăng Long, he bought his release by ceding three northern districts, Địa Lý, Ma Linh and Bố Chính, which make up most of today’s Quảng Bình and northern Quảng Trị; thousands of Cham captives were settled near the capital. It was Đại Việt’s first lasting gain of Cham land, though Vietnamese settlement there was slow. The account rests almost entirely on the Vietnamese chronicles: the historian Michael Vickery argued that the raid may have struck a regional Cham ruler at Amaravati rather than the king at Vijaya, and the chronicles’ claim that Champa then paid tribute until 1074 has no Cham confirmation. After a civil war, Harivarman IV reunited Champa by 1074 and fought off a new Vietnamese attack."
