id: uprising-of-georgi-voyteh
name: Uprising of Georgi Voyteh
start: "1072"
end: "1073"
tier: C
summary: A rising against Byzantine rule in the Balkans after the defeat at Manzikert. Bulgarian nobles in Skopje led by Georgi Voyteh asked Prince Mihailo of Duklja for a leader, and his son Constantine Bodin, a descendant of Samuel’s family, was proclaimed tsar of the Bulgarians as Peter III at Prizren in the autumn of 1072. The rebels routed a Byzantine army and took Skopje; Bodin marched north to Niš while his general Petrilo took Ohrid and Devol but was beaten at Kastoria. In December Michael Saronites retook Skopje and captured Bodin and Voyteh near Kosovo Polje. Voyteh died on the way to Constantinople, and the last rebels were put down by Nikephoros Bryennios in 1073.
