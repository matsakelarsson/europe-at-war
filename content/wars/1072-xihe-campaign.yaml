id: xihe-campaign
name: Xihe campaign
start: "1072"
end: "1074"
tier: C
summary: "The campaign in which the Song general Wang Shao conquered the Tibetan lands of the upper Tao and Huang rivers in today’s southern Gansu, west of the Song frontier. Under the reforming emperor Shenzong and his minister Wang Anshi, the Song wanted to break out of the passive defence of the previous reigns and outflank the Western Xia from the south-west. Wang Shao had proposed winning over or conquering the Tibetan tribes between the two powers, whose leader Mucheng, grandson of the Tsongkha king Gusiluo, held Hezhou and had sided with the Tanguts. In 1072 Wang Shao took Wushengjun, renamed Xizhou (today’s Lintao), and the new Xihe circuit was set up. He then took Hezhou (Linxia), in 1072 or 1073 according to different accounts, where 7,000 Tibetans were killed, 12,000 taken prisoner and more than 20,000 tents destroyed, and in 1073 went on to take Taozhou, Minzhou, Diezhou and Dangzhou, adding some 2,000 li of land to the empire. Mucheng escaped, and in 1074 he and the Tsongkha king Dongzhan submitted to the Song. The new circuit gave the Song a base for the war with the Xia in 1081 and for the later conquest of Tsongkha, but its Tibetan tribes stayed restless."
