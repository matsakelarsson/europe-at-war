notes:
  - Also called the Saxon Rebellion or Saxon War. The main narrative, by Lambert of Hersfeld, is hostile to Henry IV; Bruno’s Saxon War is openly partisan for the rebels.
  - The surrender at Spier near Sondershausen on 27 October 1075 came just as the quarrel with Pope Gregory VII began. The Saxons rose again in 1077 and backed the anti-kings Rudolf of Rheinfelden and Hermann of Salm, a war usually treated as part of the Investiture Controversy.
