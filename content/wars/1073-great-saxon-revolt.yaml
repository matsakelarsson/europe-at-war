id: great-saxon-revolt
name: Great Saxon Revolt
start: "1073"
end: "1075"
tier: C
summary: A rising of the Saxon nobles and peasants, led by Otto of Northeim and Bishop Burchard II of Halberstadt, against King Henry IV, whose castles around the Harz and their garrisons of Swabian ministeriales were resented as an occupation. Henry escaped from the besieged Harzburg in August 1073 and had to agree to slight his castles at Gerstungen in February 1074, but when peasants razed the Harzburg and desecrated the royal graves there, the princes rallied to him. He crushed the Saxon army at Homburg on the Unstrut, near Langensalza, on 9 June 1075, and the Saxon leaders surrendered unconditionally that October.
