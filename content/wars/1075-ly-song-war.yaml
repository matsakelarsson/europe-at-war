  - title: The Song counter-invasion
    date: 1076 – January 1077
    when: "1076-12"
    borders: "1077-01-15"
    countries: [vn, cn]
    body:
      - The Song court gave command of the counter-attack to Guo Kui, a veteran of the wars against the Western Xia, with Zhao Xie as his deputy. The Song asked Champa and Cambodia to attack Đại Việt from the south; both are said to have gathered troops, but neither did much. Guo Kui took months to assemble his army; Zhao Xie argued in vain for a quick strike through the mountains at Thăng Long. At the end of 1076 the Song army, for which the sources give between 50,000 and 100,000 soldiers with up to twice as many porters, crossed the border, while a fleet under Yang Congxian was to sail down the coast and join it in the delta.
      - The Song took Quảng Nguyên and the other border districts, capturing the chieftain Lưu Kỷ, who had attacked Yongzhou in 1075; the Lý war elephants were turned back with long blades. The army forced the passes of the Lạng Sơn road and in early 1077 reached the north bank of the Như Nguyệt, today’s Cầu River, the last natural barrier before the delta and Thăng Long. The fleet never arrived. A Lý fleet under Lý Kế Nguyên held the coast near the Bạch Đằng, and the Song ships could not get through.
    facts:
      - [Song army, "50,000–100,000 soldiers and their porters (Song figures)"]
      - [Quảng Nguyên taken, "January 1077"]
      - [Song fleet stopped on the coast, "early 1077"]
