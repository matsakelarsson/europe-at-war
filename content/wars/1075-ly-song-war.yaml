  - title: The fall of Yongzhou
    date: January – March 1076
    when: "1076-01"
    borders: "1076-03-01"
    countries: [cn]
    body:
      - The two Lý armies met before Yongzhou in January 1076. A Song relief force of local militia under Zhang Shoujie, the commander of Guangnan West, was defeated at the Kunlun Pass north-east of the city, and Zhang Shoujie was killed. Yongzhou, defended by its prefect Su Jian with a garrison of about 3,000, held out for 42 days. The besiegers attacked with scaling towers, which the defenders burned with fire arrows, and Su Jian sent out vain appeals to Liu Yi at Guizhou, who never came. Inside the city food and water ran short, the wells dried up and dysentery spread.
      - On 1 March 1076 the Lý army, which had local people build ramps of earth-filled bags against the walls, broke in. Su Jian killed his family and died in his burning house. The Vietnamese razed the city. Song accounts put the dead of Yongzhou at about 58,000, and the dead of the whole campaign in Qinzhou, Lianzhou and Yongzhou at between 80,000 and 100,000; these figures come only from the Song side. When scouts reported a large Song army approaching from the north, Lý Thường Kiệt fell back across the border with his plunder and thousands of captives.
    facts:
      - [Battle of the Kunlun Pass, "January 1076, Lý victory"]
      - [Siege of Yongzhou, "42 days"]
      - [Yongzhou stormed, "1 March 1076"]
      - [Dead in the campaign (Song accounts), "80,000–100,000"]
