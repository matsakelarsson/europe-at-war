  - title: Captives, districts and a border
    date: 1077–1084
    when: "1077-03"
    borders: "1077-06-01"
    countries: [vn, cn]
    body:
      - The Song kept the border districts it had taken, Quảng Nguyên (renamed Shunzhou) among them, and the Lý held thousands of captives from Yongzhou, Qinzhou and Lianzhou. Raids went on along the border, and in 1079 the Song executed the Nùng chief Nùng Trí Xuân. The Song found Quảng Nguyên, with its gold mines but deadly climate, hard to hold, and over the next years the two courts traded the captives for the return of the districts.
      - At talks at the Song garrison of Yongping from July to August 1084, the Lý envoy Lê Văn Thịnh agreed a border with the Song between Quảng Nguyên and the Song prefecture of Guihua. The line held, with few changes, through the following centuries, and the modern border between Vietnam and China largely follows it. The Nùng and Zhuang communities it divided went separate ways, the Zhuang drawn into Chinese administration and the Nùng ruled through their own hereditary chiefs under the Vietnamese courts.
    facts:
      - [Border talks at Yongping, "July–August 1084"]
    markers:
      - kind: event
        side: song
        name: Quảng Nguyên
        date: 1077 – about 1079
        text: Held by the Song after the war as Shunzhou, then returned to the Lý in exchange for the captives.
        lonlat: [106.257, 22.666]
        lp: l
    areas:
