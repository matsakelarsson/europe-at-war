id: ly-song-war
name: Lý–Song war
start: "1075-10"
end: "1077-03"
tier: A
summary: "A war between Đại Việt under the Lý dynasty and the Song dynasty of China over the hill country between them, home of the Tai-speaking Nùng (Zhuang) clans whose allegiance both courts claimed. As the Song tightened its hold on the frontier under Wang Anshi’s New Policies, the Lý regent Lý Thường Kiệt struck first: in late 1075 one army of upland troops under Nùng Tông Đán marched down the Zuo River while a fleet took Qinzhou and Lianzhou on the coast, and in March 1076, after a siege of 42 days, the Vietnamese stormed Yongzhou (Nanning), destroyed the city and carried off thousands of captives. Song accounts put the dead of the campaign at 80,000 to 100,000. The Song answered with an invasion under Guo Kui at the end of 1076. It took the border districts and reached the Như Nguyệt (Cầu) river within a day’s march of Thăng Long, but failed to break Lý Thường Kiệt’s line, lost more than half its men to fighting and disease, and withdrew in the spring of 1077 after a peace offer. Talks over the captives and the border districts ended in 1084 with a line that the modern border largely follows."
countries: [vn, cn]
sides:
  - id: dv
    name: Đại Việt (Lý dynasty)
    polities: [dai-viet]
    ink: red
    moves: Lý moves
    success: Lý success
  - id: song
    name: Song dynasty
    polities: [song]
    ink: gold
    moves: Song moves
    success: Song success
notes:
  - The war is known from the Song records (the Long Draft Continuation of the Comprehensive Mirror and the History of Song) and the Vietnamese chronicles, which differ on numbers and on many details. Army sizes and casualty figures are those of the sources and are best read as orders of magnitude. The dates are the Gregorian equivalents of lunar dates given in the English sources cited.
  - Historians disagree about the causes. Vietnamese scholarship long described a pre-emptive strike against a Song plan of conquest; others, among them James Anderson, stress the Lý court’s fear of losing the frontier clans to the Song, and Tuong Vu sees an attempt to win back upland territory from a militarily weak Song. Song writers treated the frontier clans as subjects of the empire and the Vietnamese attack as banditry; Lý Thường Kiệt’s own proclamation presented the invasion as a rescue of the Chinese people from the New Policies.
  - Guizhou in this story is the Song city of Guilin, not today’s province of Guizhou. Chinese names are in pinyin (Su Jian, Tô Giám; Guo Kui, Quách Quỳ; Zhao Xie, Triệu Tiết).
