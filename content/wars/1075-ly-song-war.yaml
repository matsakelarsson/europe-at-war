  - title: Lý Thường Kiệt’s offensive
    date: October 1075 – January 1076
    when: "1075-10"
    borders: "1075-12-01"
    countries: [vn, cn]
    body:
      - Lý Thường Kiệt divided his forces. In October 1075 Nùng Tông Đán led an army of about 23,000, many of them upland troops, along the Zuo River into Song territory and took the frontier garrisons of Guwan, Taiping, Yongping and Qianlong, drawing the Song forces towards Yongzhou. The main force under Lý Thường Kiệt himself went by sea from the coast near today’s Móng Cái; the whole invasion force is put at more than 80,000 men.
      - In the last weeks of 1075 the fleet landed at Qinzhou and took the city, then took Lianzhou (Hepu), whose garrisons were unprepared; the Song had expected any attack to come overland. Lý Thường Kiệt had a proclamation posted in the conquered districts which said that he had come to punish the Song ministers whose New Policies oppressed the people, and to seize the rebels who had fled to them, and called on the population not to resist. From the coast the army marched north to join Nùng Tông Đán before Yongzhou.
    facts:
      - [Nùng Tông Đán’s army, "about 23,000"]
      - [Qinzhou and Lianzhou taken, "December 1075 – January 1076"]
