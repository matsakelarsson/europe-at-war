  - title: The battle on the Như Nguyệt
    date: January – March 1077
    when: "1077-02"
    borders: "1077-03-01"
    countries: [vn, cn]
    body:
      - Lý Thường Kiệt had built a long earthen rampart on the south bank of the Như Nguyệt, faced with layers of bamboo stakes, and kept boats on the river. Zhao Xie had catapults built that drove the Vietnamese boats off the water and floating bridges thrown across. Several hundred Song soldiers crossed before the bridges were burned and attacked the rampart, and a party of Song cavalry is said to have ridden to within a few kilometres of Thăng Long, but the Vietnamese counter-attacked and drove the Song back across the river. Further attempts to cross at the Như Nguyệt and at the Phú Lương ferry upstream failed.
      - According to a later Buddhist text, at the height of the fighting verses were heard from a temple on the river claiming that the southern land belonged to the southern emperor by the decree of Heaven, which put new heart into the Vietnamese. The poem, Nam quốc sơn hà, is often called Vietnam’s first declaration of independence and attributed to Lý Thường Kiệt; historians such as Keith Taylor doubt that he wrote it or that it was recited in this form. A Lý night attack across the river failed in turn, and two Lý princes were drowned.
      - The Song army, stuck on the north bank in the hot season, was dying of disease; Song accounts say it lost more than half its men. Lý Thường Kiệt, wary of a long war so close to the capital, offered peace in conciliatory terms, and Guo Kui accepted and withdrew in March 1077, keeping Quảng Nguyên and four other border districts. The Song court punished Guo Kui and Zhao Xie for the failure.
    facts:
      - [Battle of the Như Nguyệt River, "January–March 1077"]
      - [Song losses (Song accounts), "more than half the army"]
      - [Song withdrawal, "March 1077"]
    markers:
