steps:
  - title: A frontier between two courts
    date: 1053–1075
    when: "1065"
    borders: "1074-01-01"
    countries: [vn, cn]
    body:
      - After the Song crushed Nong Zhigao’s rising in 1053, the hill valleys between the Red River plain and the Song cities of Guangxi lost the clan chiefs who had kept a balance between the two courts. Han Chinese soldiers settled in the Song districts, and the surviving Nùng leaders were courted by both sides. Nùng Tông Đán, a kinsman of Nong Zhigao, offered his valley of Leihuo to the Song in 1062 and then went back to the Lý in 1065. In the same year the Song prefect of Guizhou (Guilin), Lu Shen, enrolled 44,500 men of 45 upland communities on the Zuo and You rivers into militia; the Lý had divided its own side of the frontier into new districts and tattooed the conscripts of its upland units with the words “Army of the Son of Heaven”.
      - In the 1060s raids and seizures of men and cattle across the border were followed by envoys, apologies and gifts. Under the young emperor Shenzong the Song court took up Wang Anshi’s New Policies, which drew the frontier into state trade and military colonies. In 1072 Lý Thánh Tông died and the six-year-old Lý Nhân Tông came to the throne, with the eunuch general Lý Thường Kiệt, who had led the war against Champa in 1069, among his regents. In 1075 the Song refused to return a chieftain who had gone over to them with 700 followers, and sent new officials to Guizhou, Shen Qi and Liu Yi, with orders to train the uplanders in river warfare and to stop their trade with Đại Việt. Lý Thường Kiệt took this as preparation for an attack on Thăng Long.
    facts:
      - [Nong Zhigao defeated, "1053"]
      - [Song militia on the Zuo and You rivers, "44,500 men (1065)"]
      - [Accession of Lý Nhân Tông, "1072"]
