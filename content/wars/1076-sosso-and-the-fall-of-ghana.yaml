id: sosso-and-the-fall-of-ghana
name: Sosso and the fall of Ghana
start: "1076"
end: "1235"
tier: C
summary: "The end of the old kingdom of Ghana (Wagadu) and the rise of the Sosso kingdom, which ruled much of the western Sahel from about 1200 until its defeat by Sunjata Keita of Mali in about 1235. After the Almoravid wars of the 1050s–1070s (told in “The Almoravids and Ghana”), Ghana survived as a smaller kingdom; al-Idrisi, writing in 1154, still described it as rich, with a Muslim king. Soninke traditions tell of civil wars among the rulers of Wagadu and of rivalry between the provinces of Kaniaga and Diara. Out of this came the Sosso kingdom of Kaniaga, led by a Kante dynasty of smiths. Its best-known king, Sumaoro (Sumanguru) Kante, is said to have conquered the Soninke lands of Ghana, Diara, the gold country of Bure and the Mande chiefdoms to the south, which tradition says he “broke” nine times; a date of about 1203 is often given for his conquest of Ghana, but it is a modern reconstruction. Traditions remember him as a powerful sorcerer king, hostile to Islam and harsh to his subjects, and say that Muslim merchants left Ghana’s capital for Walata and Djenné; Kante smith lineages tell a kinder story. Ibn Khaldun, writing in the 1390s from informants, says only that the Susu overpowered the people of Ghana and were later subdued by Mari Jata (Sunjata) of Mali. The war that ended Sosso is told in “Battle of Kirina”."
