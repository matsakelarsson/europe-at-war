notes:
  - "The written sources are thin. After al-Bakri (1068) and al-Idrisi (1154), the only Arabic account is a few lines in Ibn Khaldun; the story of Sosso comes almost entirely from Soninke and Mande oral traditions, recorded since the late nineteenth century. Historians such as David Conrad warn that the traditions may have folded several Sosso kings into the one figure of Sumaoro, and that the dynastic lists and dates given by colonial writers such as Maurice Delafosse were partly invented."
  - "The site of the Sosso capital has not been found or excavated. Griots have placed it at the village of Sosso near Koulikoro since the 1880s; a minority view (Bühnen) puts the kingdom further south-west, in the Futa Jallon."
