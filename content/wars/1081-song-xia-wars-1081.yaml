  - title: Yongle and Lanzhou
    date: 1082–1085
    when: "1082-09"
    borders: "1085-04-01"
    countries: [cn]
    body:
      - In 1082 the Song built a fortress at Yongle, west of Mizhi, to hold the Ordos. In September the Xia came against it with an army the Song put at 300,000, using their cavalry to keep relief away. The commander Xu Xi drew up his men outside the gates but would not attack the Xia as they forded the river, and then would not let his men back in when the Xia heavy cavalry charged. Yongle fell, and the Song lost 17,300 men.
      - The Xia then tried to retake Lanzhou, in March, April and May 1083 and again for ten days in January 1084, but each time the garrison held, once after a night sortie by its commander Wang Wenyu, and the Xia ran out of supplies. Shenzong died in April 1085, and the new government, led by opponents of his policies, made peace, returning four of the six captured towns in exchange for 100 Song prisoners. Lanzhou stayed with the Song.
    facts:
      - [Fall of Yongle, "September 1082"]
      - [Song losses at Yongle, "17,300"]
      - [Death of Shenzong, "April 1085"]
