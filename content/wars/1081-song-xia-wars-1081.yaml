id: song-xia-wars-1081
name: Song–Xia wars (1081–1119)
start: "1081-06"
end: "1119"
tier: B
summary: "The second round of wars between the Song and the Tangut Western Xia, fought in the loess hills and deserts of today’s Shaanxi, Ningxia and Gansu. In 1081 the Song emperor Shenzong, whose reforms had filled his treasury, sent five armies, more than 300,000 men, to destroy the Xia while its court was torn by a struggle between the young emperor Huizong and his mother’s family. The Song took Lanzhou and much of the Ordos, but the siege of Lingzhou failed when the Xia broke the Yellow River dikes and flooded the Song camps, and the retreat became a rout. In 1082 the Xia destroyed the new Song fortress of Yongle, killing more than 17,000 men, and the war ended with Shenzong’s death in 1085. In 1097–1099 the Song tried again with a policy of advancing step by step and fortifying each position, and beat off a great Xia attack at Pingxia in 1098; in 1103–1104 it conquered the Tibetan kingdom of Tsongkha. A last offensive under the eunuch Tong Guan from 1113 ended in disaster in 1119, when Liu Fa’s army was destroyed, and a ceasefire was agreed. The wars gained the Song Lanzhou and a belt of forts, at enormous cost."
