  - title: Advance and fortify
    date: 1097–1119
    when: "1098"
    borders: "1119-06-01"
    countries: [cn]
    body:
      - In 1096 the Song stopped its payments to the Xia, and from 1097 it advanced by building forts on the hills and in the river valleys, some 40 in three years, slowly pushing the frontier into the Xia lands. In 1098 the empress dowager Liang sent an army said to be 100,000 strong against the new fort of Pingxia near Zhenrong. It failed to dislodge the Song from their high ground and was routed, and two Xia generals were captured. In 1103–1104 the Song conquered Tsongkha and renamed Qingtang as Xining.
      - In 1113 the Xia built forts in the disputed land, and the emperor Huizong sent his eunuch general Tong Guan against them. The Song took the fortresses of Gugulong, Rendequan and Zangdihe at great cost. In 1119 Tong Guan ordered Liu Fa to march with a large army into the heart of the Xia. A larger Xia army under the prince Chage surrounded it and destroyed half of it in a night, and routed the rest the next day; Liu Fa was killed. A ceasefire was agreed in 1119. Within a few years both states faced the rising power of the Jurchens.
    facts:
