steps:
  - title: Five armies against the Xia
    date: June – December 1081
    when: "1081-12-21"
    borders: "1081-12-21"
    countries: [cn]
    body:
      - In 1081 the Xia emperor Huizong was imprisoned by his mother, the empress dowager Liang, and her brother Liang Yimai, after a plot to hand the southern lands of the Xia to the Song was uncovered. Shenzong saw his chance. Five armies, led by the eunuchs Li Xian, Wang Zhongzheng and Liu Changzuo, the general Chong E and the emperor’s uncle Gao Zunyu, invaded the Xia in the summer from the south-west, the north-east and the south, the largest of them 96,000 strong, with 30,000 Tibetans sent by the Tsongkha king Dongzhan.
      - The Xia gave ground and laid waste the land before the invaders. Chong E won a victory early on, Li Xian took Lanzhou in October, and Liu Changzuo beat a Xia army of 30,000 and advanced on Lingzhou, the great city on the Yellow River south of the Xia capital. By November the Xia had abandoned the middle of the Ordos, including Xiazhou. But the Song commanders quarrelled. Wang Zhongzheng’s army, short of food, lost 20,000 men on its retreat. Gao Zunyu, who had taken over Liu Changzuo’s army, came to Lingzhou without siege equipment, and on 21 December the Xia broke the dikes of the Yellow River and flooded the Song camps. The retreat turned into a rout.
    facts:
      - [Song armies, "five, more than 300,000 men in all"]
      - [Lanzhou taken, "October 1081"]
      - [Song camps at Lingzhou flooded, "21 December 1081"]
