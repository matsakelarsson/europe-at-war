id: later-three-years-war
name: Later Three Years’ War
start: "1083"
end: "1087-12-11"
tier: B
summary: "A succession war within the Kiyohara, the family that had ruled northern Mutsu and Dewa since the Former Nine Years’ War, in which the governor of Mutsu, Minamoto no Yoshiie, took sides and Fujiwara no Kiyohira emerged as master of the north. When Yoshiie arrived as governor in 1083 the Kiyohara chief Sanehira was fighting his half-brother Iehira and his step-brother Kiyohira. Sanehira died suddenly on campaign, and Yoshiie divided his six districts between the two brothers; in 1086 Iehira burned Kiyohira’s house and killed his wife and children, and Yoshiie took up Kiyohira’s cause. Yoshiie failed against Iehira at the fort of Numa in the winter of 1086, and in 1087 besieged Iehira and his uncle Takehira in the fort of Kanazawa in Dewa. After a siege through the autumn, in which women and children who came out were killed so that the defenders’ food would run out faster, the starving garrison set fire to the fort and fled on 11 December 1087; Takehira was captured and beheaded and Iehira was killed in flight. The court refused to treat the war as a public campaign, gave Yoshiie no reward and dismissed him, but his generosity to his eastern warriors from his own purse built the loyalty on which his descendant Yoritomo would draw. Kiyohira took his father’s name of Fujiwara and founded the Northern Fujiwara of Hiraizumi."
