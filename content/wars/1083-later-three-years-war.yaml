notes:
  - The main source is the Ōshū gosannen ki, a war tale known through the illustrated scrolls Gosannen kassen emaki; a first version of the scrolls was made in 1171, and the surviving set of 1347 is in the Tokyo National Museum. Courtiers’ diaries confirm the outline. The day date is the Julian equivalent of the 14th day of the eleventh month; other dates are months of the Japanese lunar calendar.
