  - title: The siege of Kanazawa
    date: "1087"
    when: "1087-12-11"
    borders: "1087"
    countries: [jp]
    body:
      - "In the ninth month of 1087 Yoshiie and Kiyohira laid siege to Kanazawa, a hill fort above the Yokote basin. Yoshiie’s younger brother Yoshimitsu had left his post at court without leave to join him, and the court had already decided to send an envoy to order the fighting stopped. Legend tells that on the march Yoshiie noticed wild geese breaking formation over a field and found an ambush there, remembering a lesson in Chinese military texts from the scholar Ōe no Masafusa. Assaults failed, and on Hidetake’s advice Yoshiie settled down to starve the garrison out. As autumn turned to winter, women and children came out of the fort; Yoshiie had them killed in sight of the walls so that no more would leave and the food would run out faster."
      - "On 11 December 1087 the garrison set fire to the fort and broke out. Takehira was found hiding in a pond and beheaded after Yoshiie refused his brother’s plea for mercy, and Iehira, disguised as a servant, was killed by a warrior named Agata no Tsugitō. Yoshiie asked the court for a decree recognising the war as a campaign against rebels, but it called the affair a private war, refused any reward and dismissed him as governor; he paid his eastern warriors from his own wealth. Kiyohira, the only survivor of the brothers, inherited all the Kiyohara lands, took his father’s surname of Fujiwara, and around 1100 moved his seat to Hiraizumi, where he built the temple of Chūson-ji. His descendants ruled the north until 1189."
    facts:
