steps:
  - title: Yoshiie and the Kiyohara feud
    date: 1083–1086
    when: "1086"
    borders: "1086"
    countries: [jp]
    body:
      - "Kiyohara no Takenori’s grandson Sanehira headed the family in the 1080s and ruled the six districts of the Kitakami basin from Mutsu as well as the family’s homeland around Yokote in Dewa. A quarrel with Kimiko no Hidetake, a kinsman by marriage, set him against his half-brother Iehira and his step-brother Kiyohira, the son of Fujiwara no Tsunekiyo and the Abe princess whom Sanehira’s father had married after the Former Nine Years’ War. In the autumn of 1083 Minamoto no Yoshiie, the son of Yoriyoshi, came to Mutsu as governor and supported Sanehira, whose adopted son had married Yoshiie’s half-sister; with the help of Yoshiie’s men, Sanehira’s garrison beat off an attack by Iehira and Kiyohira. Sanehira then died of illness while marching against Hidetake."
      - "Yoshiie divided the six districts between the brothers, giving Kiyohira the rich southern districts of Isawa, Esashi and Waga and Iehira the northern ones of Iwate, Shiwa and Hienuki. In the summer of 1086 Iehira, resentful, attacked Kiyohira’s residence and burned it, killing his wife and children; Kiyohira escaped and appealed to Yoshiie. That winter Yoshiie attacked Iehira in his fort at Numa in Dewa with several thousand horsemen, but snow and cold forced him back after many of his men had frozen or starved. Iehira’s uncle Takehira joined him and persuaded him to move to the stronger fort of Kanazawa."
