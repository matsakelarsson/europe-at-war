id: byzantine-pecheneg-war
name: Byzantine–Pecheneg war
start: "1087"
end: "1091-04-29"
tier: B
summary: The war in which the Pechenegs, Turkic nomads settled along the lower Danube, defeated the Byzantine emperor Alexios I Komnenos at Dristra in 1087 and raided Thrace for four years, coming close to Constantinople. With the help of the Cumans, Alexios destroyed their host at Levounion near the mouth of the Hebros on 29 April 1091.
