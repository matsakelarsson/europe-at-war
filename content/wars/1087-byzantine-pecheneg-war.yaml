notes:
  - Almost everything known about this war comes from the Alexiad, the history of Alexios’s reign written decades later by his daughter Anna Komnene, who calls the Pechenegs “Scythians”. Her numbers are very large and her dates are not always clear.
  - The Pechenegs had crossed the lower Danube into the Byzantine province of Paristrion (Paradounavon) in the 1040s and lived there beside local lords who were only loosely subject to the empire.
