steps:
  - title: Alamut
    date: 1090–1105
    when: "1090-09-04"
    borders: "1092-10"
    countries: [ir]
    body:
      - Hasan-i Sabbah, born in Qom and brought up in Rayy, became a missionary of the Ismaili Fatimid caliphate in Iran. He found followers among the Daylamites of the Alborz mountains and among townspeople who resented Seljuk rule. On the night before 4 September 1090 he entered the castle of Alamut, on a rock in a high valley north-east of Qazvin, and took it over, paying its commander for it. In 1091 the Ismailis of Quhistan in eastern Iran rose too and took several towns.
      - Sultan Malik-Shah sent armies against both in 1092. Arslan-Tash’s siege of Alamut was broken by Nizari reinforcements, and a force under Qizil-Sarigh that was besieging Dara in Quhistan withdrew when the sultan died. On 14 October 1092 the vizier Nizam al-Mulk was stabbed to death near Nahavand by a man disguised as a Sufi, the first of the killings attributed to the Nizaris. Malik-Shah died a month later.
      - Malik-Shah’s sons fought each other for over a decade, and the Ismailis gained a chain of fortresses, among them Lammasar in the Alborz, Girdkuh near Damghan and, around 1100, Shahdiz on the mountain above Isfahan, the Seljuk capital. In 1094, after a disputed succession in Cairo, the Ismailis of Iran backed the excluded Fatimid heir, Nizar, and broke with the Fatimid government. In 1101 Sultan Berkyaruq turned against them, and Ismailis were massacred in Isfahan and Baghdad.
    facts:
      - [Alamut taken, "4 September 1090"]
      - [Siege of Alamut fails, "1092"]
      - [Nizam al-Mulk killed, "14 October 1092"]
