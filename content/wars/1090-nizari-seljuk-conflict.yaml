id: nizari-seljuk-conflict
name: Nizari–Seljuk conflict
start: "1090-09-04"
end: "1118-04"
tier: B
summary: The struggle between the Seljuk sultans and the Nizari Ismailis of Iran, led by Hasan-i Sabbah, who seized the mountain castle of Alamut in 1090 and built a state of scattered fortresses in the Alborz, in Quhistan and near Isfahan. A Seljuk army failed to take Alamut in 1092, and in the same year the vizier Nizam al-Mulk was killed, the first of the assassinations for which the Nizaris became notorious. They gained more castles during the Seljuk succession wars. Sultan Muhammad Tapar took Shahdiz near Isfahan in 1107 and laid waste the country around Alamut for years, but his siege of Alamut was abandoned when he died in 1118, and the Nizari state survived.
countries: [ir]
sides:
  - id: niz
    name: Nizari Ismailis
    polities: [nizaris]
    ink: magenta
    moves: Nizari moves
    success: Nizari success
  - id: sel
