  - title: Shahdiz and the siege of Alamut
    date: 1105–1118
    when: "1107"
    borders: "1118-04"
    countries: [ir]
    body:
      - When Muhammad Tapar became sole sultan in 1105, he made war on the Nizaris a priority. In 1107 he besieged Shahdiz, which fell after a long siege. Its commander, Ahmad ibn Abd al-Malik ibn Attash, was executed with his son, and the castle was demolished. From 1106 the vizier Ahmad, a son of Nizam al-Mulk, laid waste the valleys around Alamut without taking the castle, and from 1109 Seljuk troops came back every year for eight years to destroy the crops of Rudbar, the Nizari country around Alamut.
      - The Nizaris answered with killings of commanders, officials and judges across Iran and Iraq, among them the qadi of Isfahan. In 1117 the emir Anushtegin Shirgir besieged Lammasar in June and Alamut in July. The defenders were hard pressed, but in April 1118 news came that Muhammad Tapar had died, and the besieging army broke up. Hasan-i Sabbah died at Alamut in 1124. His state of castles outlived the Seljuk sultanate of Iran and lasted until the Mongols took Alamut in 1256.
    facts:
      - [Shahdiz taken, "1107"]
      - [Siege of Alamut, "1117–1118"]
      - [Death of Muhammad Tapar, "April 1118"]
