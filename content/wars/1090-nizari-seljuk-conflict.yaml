    moves: Seljuk moves
    success: Seljuk success
notes:
  - The Nizaris are named after Nizar, the Fatimid heir they supported after the split in the Ismaili movement in 1094. Their enemies called them hashishi, the origin of the word “assassin”. The stories of drugged recruits and a garden of paradise at Alamut come from hostile writers and later legend. The Nizaris’ own chronicles were lost when the Mongols took Alamut in 1256, and most accounts come from their Sunni enemies.
  - This entry covers the conflict up to 1118. Wars and truces between the Nizaris and the Seljuks went on until the end of the Seljuk sultanate in Iran in 1194. No reliable figures exist for the Ismailis killed in the massacres.
