    success: Fatimid success
notes:
  - Dates are Julian. Most of what is known comes from Latin chronicles written by participants (the anonymous Gesta Francorum, Raymond of Aguilers, Fulcher of Chartres), from Anna Komnene’s Alexiad, written decades later, and from Arabic historians such as Ibn al-Athir, writing a century later. Numbers of soldiers and of the dead come from these chroniclers and are uncertain.
  - Places have the names usual in histories of the crusades, with modern names where they help, such as Nicaea (İznik), Dorylaeum (near Eskişehir), Iconium (Konya), Edessa (Şanlıurfa), Antioch (Antakya), Ma‘arra (Maarat al-Numan) and Ascalon (Ashkelon).
  - The Crusade of 1101, the Byzantine recovery of western Anatolia and the Second Crusade have their own entries. Robert Guiscard’s and Bohemond’s earlier war against Alexios, with the battle of Dyrrhachium in 1081, is told under the Norman conquest of southern Italy.
