id: first-crusade
name: First Crusade
start: "1096"
end: "1099-08-12"
tier: A
summary: The first of the great expeditions from Latin Europe to the eastern Mediterranean, called by Pope Urban II at Clermont in 1095 after the Byzantine emperor Alexios I asked for help against the Seljuk Turks. After the People’s Crusade was destroyed in Anatolia, the armies of the princes took Nicaea for Byzantium, beat the Turks at Dorylaeum, took Antioch after an eight-month siege and stormed Jerusalem in July 1099, killing much of its population. They founded the County of Edessa, the Principality of Antioch and the Kingdom of Jerusalem, later joined by the County of Tripoli.
countries: [fr, de, be, it, hu, rs, bg, gr, tr, sy, lb, il, ps, eg]
