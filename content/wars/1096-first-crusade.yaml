steps:
  - title: Clermont and the People’s Crusade
    date: 1095–1097
    when: "1096-04"
    borders: "1096-10-21"
    countries: [fr, de, be, it, hu, rs, bg, tr, al, gr, hr]
    body:
      - In March 1095 envoys of the Byzantine emperor Alexios I Komnenos asked Pope Urban II for soldiers to fight the Seljuk Turks, who since the 1070s had overrun most of Anatolia and taken much of Syria and Palestine. On 27 November 1095, at Clermont in France, Urban called on the knights of the West to go east, help the Christians there and free Jerusalem, promising that the journey would count as full penance for their sins. Preachers carried the call across France and Germany, and the response went far beyond anything the pope had planned.
      - The first to set out were crowds of poor people and minor knights, stirred by preachers such as Peter the Hermit. In May and June 1096 bands led by Count Emicho and others massacred the Jews of Speyer, Worms, Mainz and Cologne; King Coloman of Hungary later scattered several of these bands. Peter’s followers crossed Hungary, fought the Byzantine garrison at Niš and reached Constantinople on 1 August. Alexios ferried them over to Civetot in Asia Minor. A German group seized the fort of Xerigordos and was starved into surrender, and on 21 October the Turks of Kilij Arslan I destroyed the main body near Civetot.
      - The armies of the great lords followed. Godfrey of Bouillon, Duke of Lower Lorraine, came through Hungary and reached Constantinople on 23 December 1096. Bohemond of Taranto, Raymond of Saint-Gilles, Count of Toulouse, Robert of Normandy, Robert of Flanders and Stephen of Blois came by way of Italy, Dalmatia and the old Roman road across the Balkans, the Via Egnatia, in the spring of 1097. How many took part is uncertain, but these were the largest armies the Latin West had ever sent east, with many non-combatants among them.
    facts:
      - [Council of Clermont, 27 November 1095]
      - [Battle of Civetot, "21 October 1096, Turkish victory"]
      - [Godfrey of Bouillon at Constantinople, 23 December 1096]
    markers:
      - kind: event
        name: Clermont
        date: 27 November 1095
        text: Urban II preached the crusade in a field outside the town at the end of a church council. The crowd is said to have answered “Deus vult” (God wills it).
        lonlat: [3.087, 45.777]
      - kind: event
        name: Mainz
        date: 27 May 1096
        text: Crusaders following Emicho broke into the archbishop’s palace, where the Jews had taken refuge, and killed hundreds; some took their own lives rather than be forcibly baptised.
        lonlat: [8.27, 50.0]
      - kind: battle
        side: by
        name: Niš
        date: July 1096
        text: A quarrel with the Byzantine garrison turned into a fight in which Peter the Hermit lost many followers and much of his baggage.
        lonlat: [21.896, 43.321]
      - kind: event
        name: Constantinople
        date: August 1096 – May 1097
        text: The crusading armies gathered outside the walls of the imperial city, where Alexios supplied them and kept them out of the city itself.
        lonlat: [28.955, 41.014]
      - kind: siege
        side: tu
        name: Xerigordos
        date: late September – October 1096
        text: German crusaders seized this fort but were surrounded by the Turks and, without water, surrendered after eight days. Those who refused to convert to Islam were killed.
        lonlat: [29.804, 40.392]
      - kind: battle
        side: tu
        name: Battle of Civetot
        date: 21 October 1096
        text: The Turks ambushed the People’s Crusade as it marched out of its camp. Few survived. Peter the Hermit, who was in Constantinople, later joined the princes’ armies.
        lonlat: [29.156, 40.432]
        lp: l
    arrows:
      - side: cr
        label: Peter the Hermit
        phase: 1
        via: [[6.96, 50.94], [17.5, 48.0], [21.9, 43.32], [28.9, 41.03]]
