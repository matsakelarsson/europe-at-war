    name: Byzantine Empire
    polities: [byzantium]
    ink: purple
    moves: Byzantine moves
    success: Byzantine success
  - id: tu
    name: Seljuk Turks and the Syrian emirs
    polities: [rum, seljuk, danishmendids]
    ink: olive
