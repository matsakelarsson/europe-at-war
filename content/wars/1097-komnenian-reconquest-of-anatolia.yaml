notes:
  - The main Byzantine sources are Anna Komnene’s Alexiad and the histories of John Kinnamos and Niketas Choniates; dates, especially for John II’s campaigns, are often known only to the year.
  - The frontier was never a line. Turkish nomads grazed and raided far inside the lands the empire claimed, and towns changed hands repeatedly; the map shows the broad picture.
