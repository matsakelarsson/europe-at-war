steps:
  - title: Alexios I recovers the coasts
    date: 1097–1118
    when: "1097-06"
    borders: "1118-08-15"
    countries: [tr]
    body:
      - The First Crusade gave Alexios I Komnenos his chance. After Nicaea surrendered to him in June 1097 and the crusaders marched east, his brother-in-law John Doukas led an army and a fleet down the west coast. Smyrna, held by the emir Tzachas, gave up without a fight, and in 1097–1098 Ephesus, Sardis, Philadelphia and Laodicea were taken from the Turks, restoring imperial rule over the rich valleys of western Anatolia. The Seljuks of Rum, who had lost Nicaea, moved their capital to Iconium and kept the central plateau.
      - For the rest of his reign Alexios defended these gains against Turkish raids while also fighting Bohemond and the Normans. In 1116, already ill, he led an army into the interior and beat Sultan Malik Shah near Philomelion. The sultan agreed to a peace, and Alexios brought the Greek inhabitants of the region back with him to settle inside the empire. When he died in August 1118, the Byzantines again held the northern and western coastlands of Anatolia, though the frontier with the Turks remained open to raids.
    facts:
      - [Smyrna and Ephesus recovered, 1097]
      - [Battle of Philomelion, "1116, Byzantine victory"]
