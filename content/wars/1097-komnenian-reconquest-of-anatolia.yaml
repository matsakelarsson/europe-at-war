id: komnenian-reconquest-of-anatolia
name: Komnenian reconquest of Anatolia
start: "1097"
end: "1177"
tier: B
summary: The campaigns in which the Byzantine emperors of the Komnenos dynasty, Alexios I, John II and Manuel I, recovered the coasts and river valleys of western and northern Anatolia from the Seljuk Turks after the First Crusade and pushed into Cilicia and Syria. Their attempt to destroy the Sultanate of Rum ended with Manuel’s defeat at Myriokephalon in 1176, which left the central plateau to the Turks.
