  - title: John II’s campaigns
    date: 1119–1143
    when: "1119"
    borders: "1143-04-08"
    countries: [tr, sy]
    body:
      - Alexios’s son John II Komnenos spent most of his reign on campaign. He took Laodicea in 1119 and Sozopolis in 1120, reopening the road to Attaleia on the south coast. In the 1130s he fought the Danishmendids of the north, taking Kastamonu in 1133 and Gangra soon after, though Kastamonu was lost again. In 1137 he marched into Cilicia and conquered the Armenian principality there, taking Tarsus, Adana, Mopsuestia and Anazarbus; its prince, Levon I, was taken prisoner to Constantinople with his family.
      - From Cilicia John marched on Antioch, besieged it and made its prince, Raymond of Poitiers, accept him as overlord. In 1138 he led a Byzantine and Frankish army into Muslim Syria, but the siege of Shaizar failed, while his Frankish allies held back, and when Zengi’s army approached John accepted the emir’s tribute and withdrew. A campaign against Neocaesarea in 1140 failed in bad weather. In 1142 John came back to Cilicia, intending to take Antioch itself, but in April 1143 he died after a hunting accident in the Taurus mountains.
    facts:
      - [Sozopolis taken, 1120]
      - [Conquest of Cilicia, 1137]
      - [Siege of Shaizar, "April–May 1138, abandoned"]
    markers:
