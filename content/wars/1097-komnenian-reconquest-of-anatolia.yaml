  - title: Manuel I and Myriokephalon
    date: 1146–1177
    when: "1146"
    borders: "1176-09-17"
    countries: [tr]
    body:
      - John’s son Manuel I Komnenos mostly kept the peace with the Seljuks of Rum, leading an army to the walls of Iconium only once, in 1146. Sultan Kilij Arslan II visited Constantinople in 1161–1162 and accepted Manuel as his overlord, but used the peace to conquer the Danishmendid emirates. In 1176 Manuel set out with a large army and a siege train to take Iconium and end the sultanate. On 17 September the Turks ambushed the long column in the Tzybritze pass, near the ruined fortress of Myriokephalon in the mountains west of Iconium.
      - The baggage train and the right wing, led by Manuel’s brother-in-law Baldwin of Antioch, were cut to pieces. The main army fought its way through, and Kilij Arslan offered peace on condition that Manuel demolished the forts he had built at Dorylaeum and Sublaeum. Manuel himself compared the defeat to Manzikert, but most of his army survived, and in 1177 a Byzantine army destroyed a Turkish raiding force at Hyelion and Leimocheir on the Meander. Myriokephalon nonetheless ended the Byzantine hope of recovering the plateau, and after Manuel’s death in 1180 the empire’s hold on Anatolia weakened again.
    facts:
      - [Battle of Myriokephalon, "17 September 1176, Seljuk victory"]
      - [Battle of Hyelion and Leimocheir, "1177, Byzantine victory"]
    markers:
      - kind: event
        side: by
        name: Iconium
        date: "1146"
        text: Manuel reached the Seljuk capital and ravaged its suburbs, but withdrew without a siege.
        lonlat: [32.493, 37.874]
      - kind: event
        side: by
        name: Dorylaeum
        date: "1175"
        text: Manuel rebuilt the ruined town as a fortress to protect the Byzantine lands from Turkish nomads. Kilij Arslan made its demolition a condition of peace.
        lonlat: [30.52, 39.78]
      - kind: battle
        side: tu
        name: Battle of Myriokephalon
        date: 17 September 1176
        text: The Turks attacked from the heights as the Byzantine column wound through the pass. The exact site is disputed.
        lonlat: [31.15, 38.0]
      - kind: battle
        side: by
        name: Battle of Hyelion and Leimocheir
        date: "1177"
        text: Byzantine troops caught a Turkish army returning from a raid as it crossed the Meander and destroyed it.
        lonlat: [28.0, 37.75]
    arrows:
      - side: by
        label: Manuel I, 1176
        via: [[28.52, 38.35], [29.1, 37.84], [30.16, 38.07], [31.1, 38.0]]
