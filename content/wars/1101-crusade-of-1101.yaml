notes:
  - The largest army, mainly Lombards, marched north-east from Nicaea in the hope of freeing Bohemond of Antioch, held prisoner by the Danishmendids, against the advice of Raymond of Toulouse and the Byzantine escort. The other two, the Nivernais and the Aquitanians and Bavarians, followed the route of the First Crusade and were ambushed near Heraclea. Some Western writers blamed the Byzantines for the disasters.
