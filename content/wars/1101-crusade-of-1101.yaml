name: Crusade of 1101
start: "1101"
end: "1102"
tier: C
summary: A second wave of crusaders, inspired by the capture of Jerusalem, who set out in 1100–1101 from Lombardy, France and Germany under leaders including Stephen of Blois, Stephen of Burgundy, William IX of Aquitaine and Welf IV of Bavaria, with Raymond of Toulouse as their guide. Crossing Anatolia in three separate armies in the summer of 1101, they were destroyed by Kilij Arslan I of Rum and the Danishmendids, at Mersivan in August and at Heraclea in August and September. Only a few survivors, among them several of the leaders, reached the Holy Land in 1102.
