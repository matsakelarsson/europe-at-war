  - title: The Nine Fortresses
    date: 1107–1108
    when: "1107-12"
    borders: "1108-04"
    countries: [kp]
    body:
      - In the twelfth month of 1107, under King Yejong, Yun Gwan and his deputy O Yeon-chong crossed the wall from Jeongju with an army of 170,000 in several columns, while 2,600 men sailed up the coast from Doryeonpo. They overran 135 Jurchen villages; the Goryeosa records 4,940 Jurchens killed and 1,030 captured.
      - Over the next months Goryeo built fortresses at Hamju (Hamhung), where it set up a grand protectorate, and at Yeongju, Ungju, Bokju (Tanchon), Gilju (Kilju) and Gongheomjin, followed in 1108 by Sungnyeong, Tongtae and Jinyang. These were the Nine Fortresses. Settlers were moved in from the south, and by tradition Yun Gwan set up a stone marking “the boundary of Goryeo” at Seonchunryeong. He returned to Kaegyong in triumph in 1108.
    facts:
      - [Campaign begins, "twelfth month of 1107"]
      - [Goryeo army, "170,000 and a fleet of 2,600 men"]
      - [Jurchen losses, "4,940 killed, 1,030 captured, 135 villages taken (Goryeosa)"]
