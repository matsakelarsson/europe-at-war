  - title: The fortresses given back
    date: 1108–1109
    when: "1109-07"
    borders: "1109-08"
    countries: [kp]
    body:
      - The Jurchens fought back at once. In 1108 Yun Gwan was surrounded at Gahancheon and saved only by Cheok Jun-gyeong, and Ungju was besieged; in 1109 the Jurchens besieged Gilju and ambushed Yun Gwan and O Yeon-chong near Gongheomjin. The forts were far apart, across mountain country, and hard to supply. Jurchen envoys asked for the land back, promising tribute and an end to raids.
      - In the seventh month of 1109, over Yun Gwan’s objections, the court agreed, and the garrisons withdrew. Yun Gwan was stripped of his offices and died in 1111. In 1115 Wuyashu’s younger brother Aguda proclaimed the Jin empire; it destroyed Liao by 1125, and in 1126 Goryeo accepted Jin as its overlord.
    facts:
      - [Fortresses given back, "seventh month of 1109"]
      - [Jin empire proclaimed, "1115"]
