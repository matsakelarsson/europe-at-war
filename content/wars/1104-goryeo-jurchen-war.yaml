steps:
  - title: Wuyashu’s advance and the Byeolmuban
    date: "1104"
    when: "1104-02"
    borders: "1104-12"
    countries: [kp]
    body:
      - Since the late eleventh century the Wanyan clan of the Jurchens, under Yingge and then his nephew Wuyashu, had been bringing the Jurchen tribes of Manchuria and the north-east under its control, including the communities along Goryeo’s border that had paid tribute to Goryeo. Early in 1104 Wanyan forces chasing their opponents reached the frontier near Jeongju (today’s Jeongpyeong), at the eastern end of the Thousand-li Wall. In the second month they defeated a Goryeo army under Im Gan. Yun Gwan, sent in his place, was also beaten and made peace.
      - Yun Gwan told King Sukjong that the Jurchens had won because they fought on horseback and Goryeo on foot. At the end of 1104 the king set up the Byeolmuban, or “special army”. It had a cavalry corps (Singigun) raised from everyone who owned a horse, an infantry corps (Sinbogun), and a corps of Buddhist monks (Hangmagun), and it trained for three years.
    facts:
      - [Defeat of Im Gan, "second month of 1104"]
      - [Byeolmuban founded, "twelfth month of 1104"]
    markers:
