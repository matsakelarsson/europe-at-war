        side: jur
        name: Jeongju
        date: "1104"
        text: The Goryeo border fortress (today’s Jeongpyeong) where Jurchen forces beat Im Gan’s and then Yun Gwan’s armies.
        lonlat: [127.380, 39.780]
        lp: l
    arrows:
      - side: jur
