id: goryeo-jurchen-war
name: Goryeo–Jurchen war
start: "1104"
end: "1109-07"
tier: B
summary: "Goryeo’s war with the Jurchens of the north-east, then being united by the Wanyan clan. In 1104 Wanyan forces under Wuyashu reached Goryeo’s border near Jeongju, the eastern end of the Thousand-li Wall, and defeated two Goryeo armies. The general Yun Gwan then built up a new force, the Byeolmuban, with cavalry, infantry and a corps of monks, and at the end of 1107 he and O Yeon-chong crossed the wall with an army of 170,000. They overran the Jurchen villages of the north-eastern coastal plain and built nine fortresses, from Hamju (Hamhung) northwards. The Jurchens counterattacked again and again, the forts proved hard to hold and supply, and in 1109 the Goryeo court gave them back in return for promises of peace and tribute. Six years later Wuyashu’s brother Aguda founded the Jin empire, which destroyed Liao and in 1126 made Goryeo accept it as overlord."
countries: [kp]
sides:
  - id: gor
    name: Goryeo
    polities: [goryeo]
    ink: blue
    moves: Goryeo moves
    success: Goryeo success
  - id: jur
    name: Jurchens (Wanyan)
    polities: [jurchens]
    ink: green
    moves: Jurchen moves
    success: Jurchen success
notes:
  - The location of the Nine Fortresses is disputed. The traditional view places them on the coastal plain between Hamhung and Kilju; the Annals of King Sejong and some modern historians place the northernmost fort, Gongheomjin, and Yun Gwan’s boundary stone at Seonchunryeong beyond the Tumen River. The area on the map follows the traditional view.
  - Dates are lunar months from the Goryeosa. The campaign began in the twelfth month of 1107, which falls early in 1108.
