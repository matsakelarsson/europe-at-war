  - title: The end of the Liao
    date: 1123 – March 1125
    when: "1125-03-26"
    borders: "1125-03-26"
    countries: [cn, mn]
    body:
      - Tianzuo held out in the Yin mountains and the steppe. In the early summer of 1123 the Jin captured Yelü Dashi and made him lead them to the emperor’s camp, where most of the imperial family was taken; Tianzuo escaped with one son. He sought refuge with the Western Xia, but in 1124 the Xia emperor Chongzong, warned by the Jin, declared himself their vassal. Yelü Dashi escaped and rejoined Tianzuo, but when the emperor insisted on attacking the Jin, he left in 1124 with a band of followers for the Liao garrison of Kedun on the Orkhon, the start of the westward journey that led to the Qara Khitai empire.
      - Tianzuo, reduced to trading his clothes for food with the Khongirad, was finally captured by the Jin general Wanyan Loushi in March 1125 near Yingzhou in northern Shanxi. He was given the title “king of the seashore” and died in captivity. The Liao dynasty, which had ruled the north for two centuries, was at an end, and the Jin, now the strongest power in East Asia, invaded the Song before the end of the year.
    facts:
      - [Yelü Dashi leaves for the west, "1124"]
      - [Tianzuo captured, "March 1125"]
    markers:
