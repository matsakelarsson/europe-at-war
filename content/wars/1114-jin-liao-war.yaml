  - title: Liaodong and the alliance at sea
    date: 1116–1120
    when: "1116-05"
    borders: "1116-05-01"
    countries: [cn]
    body:
      - In 1116 a Balhae officer, Gao Yongchang, seized the Liao Eastern Capital at Liaoyang and proclaimed a kingdom of Great Bohai. When the Liao attacked him he asked the Jin for help; the Jin sent an army, defeated the Liao, then turned on Gao Yongchang and took Liaoyang. All of Liaodong, east of the Liao River, came under the Jin, and in 1117 Jin forces crossed the river and took more towns. The Liao, short of food and torn by risings and defections, sought peace, but the talks dragged on.
      - The Song had been watching. In 1117, using the pretext of buying horses, it sent envoys by sea from Shandong to the Jin. Over the next six years seven Song embassies and six Jin embassies crossed the Bohai Sea, and in 1120 the two sides agreed what became known as the Alliance Conducted at Sea. They would attack the Liao together, the Song striking at the Southern Capital, Yanjing. In return the Jin would hand the Sixteen Prefectures to the Song, and the Song would pay the Jin the yearly sums it had paid the Liao since 1005.
    facts:
      - [Jin take Liaoyang, "1116"]
      - [First Song embassy by sea, "1117"]
      - [Alliance Conducted at Sea agreed, "1120"]
