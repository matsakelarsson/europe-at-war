  - title: Yanjing handed to the Song
    date: December 1122 – April 1123
    when: "1123-04"
    borders: "1123-04-01"
    countries: [cn]
    body:
      - In December 1122 Aguda’s army came through the Juyong Pass, and Yanjing surrendered to the Jin without a fight. The Liao princes fled; Xiao Gan went to the Xi tribes and set up his own short-lived state. The Song had failed to take the city, and the Jin had seen how weak its ally was.
      - After long bargaining, the Jin agreed in 1123 to hand over Yanjing and six of the Sixteen Prefectures, but not the Western Capital and the lands north of the mountains. The Song agreed to pay the Jin 200,000 taels of silver and 300,000 bolts of silk a year, as it had paid the Liao, plus a large sum for the tax revenue of the region. The Jin first carried off the wealth of Yanjing and most of its leading families and craftsmen, and the Song took over an empty city in April 1123. Aguda died that summer and was succeeded by his brother Wuqimai (Taizong of Jin).
    facts:
      - [Yanjing surrenders to the Jin, "December 1122"]
      - [Yanjing handed to the Song, "April 1123"]
      - [Yearly payment to the Jin, "200,000 taels of silver and 300,000 bolts of silk"]
