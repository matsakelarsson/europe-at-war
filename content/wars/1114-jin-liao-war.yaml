steps:
  - title: Aguda’s rising
    date: 1112–1114
    when: "1114-11"
    borders: "1114-12-01"
    countries: [cn]
    body:
      - The Jurchens of the forests and river valleys of Manchuria paid tribute to the Liao in furs, horses, pearls and the prized gyrfalcons, and resented the Liao envoys and officials who came to collect it. In early 1112 the Liao emperor Tianzuo held his spring fishing camp on the Songhua River and ordered the Jurchen chiefs to dance for him. Aguda of the Wanyan clan alone refused. Tianzuo wanted to have him killed but was talked out of it. In 1113 Aguda became chief of the Wanyan, who had come to lead the Jurchen tribes.
      - In the autumn of 1114, after demanding in vain the return of a rival chief who had fled to the Liao, Aguda gathered some 2,500 men and rose in revolt. His horsemen took Ningjiangzhou, the Liao fort and market on the frontier, and in November routed a Liao army at Chuhedian. Other tribes joined him, and by the end of the year the Jurchens had taken several towns.
    facts:
      - [Aguda refuses to dance, "1112"]
      - [Revolt begins, "autumn 1114, with about 2,500 men"]
      - [Battle of Chuhedian, "November 1114"]
