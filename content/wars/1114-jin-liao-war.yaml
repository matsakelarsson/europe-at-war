id: jin-liao-war
name: Jin–Liao war
start: "1114-09"
end: "1125-03-26"
tier: A
summary: "The war in which the Jurchens of Manchuria, united by the Wanyan chief Aguda, overthrew the Khitan Liao empire that had ruled them for two centuries. Aguda rose in 1114 with a few thousand horsemen, took the frontier fort of Ningjiang and routed a Liao army at Chuhedian. In January 1115 he proclaimed himself emperor of the Jin (“Gold”) dynasty, and that year he took Huanglong and destroyed the army that the Liao emperor Tianzuo led against him at Hubudagang. By 1116 the Jin held all of Liaodong. The Song, hoping to recover the Sixteen Prefectures, made an alliance with the Jin by envoys sent across the Bohai Sea. The Jin took the Liao Supreme Capital in 1120, the Central Capital in the winter of 1121–1122, and the Western and Southern Capitals in 1122, while Song attacks on the Southern Capital, Yanjing (Beijing), were beaten off by the Liao. In 1123 the Jin handed Yanjing and six prefectures to the Song for a large payment, after carrying off their people and wealth. Tianzuo fled into the steppe and was captured in March 1125; the Liao prince Yelü Dashi went west and founded the Qara Khitai empire in Central Asia. Before the year was out, the Jin turned on the Song."
countries: [cn, mn]
sides:
  - id: jin
    name: Jurchens (Jin)
    polities: [jurchens, jurchen-jin]
    ink: gold
    moves: Jin moves
    success: Jin success
  - id: liao
    name: Liao
    polities: [liao]
    ink: blue
    moves: Liao moves
    success: Liao success
  - id: song
    name: Song dynasty, allied to the Jin
    polities: [song]
    ink: red
    moves: Song moves
    success: Song success
notes:
  - The Jin and Song accounts give very large figures for the Liao armies, such as 700,000 at Hubudagang, which modern historians do not accept.
  - In 1122–1123 the Liao princes at Yanjing set up a separate regime under Yelü Chun, known to historians as the Northern Liao, while the emperor Tianzuo was in the west. Both are shown here as Liao.
