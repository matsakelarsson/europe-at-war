  - title: The Supreme Capital
    date: spring – summer 1120
    when: "1120-05"
    borders: "1120-05-01"
    countries: [cn]
    body:
      - In the spring of 1120 Aguda broke off the talks with the Liao and marched west. In the summer the Jin took the Supreme Capital, the city on the steppe that Abaoji had built two centuries earlier, and then halted to escape the summer heat. The Liao heartland on the Xar Moron was lost.
      - The Song was meant to strike at Yanjing at the same time, and Tong Guan was given command of an army for the purpose. But at the end of 1120 the rebellion of Fang La broke out in Zhejiang, and Tong Guan’s army was sent south to put it down, so that the Song attack on the Liao was put off until 1122.
    facts:
      - [Supreme Capital taken, "summer 1120"]
