  - title: The fall of the capitals
    date: winter 1121 – autumn 1122
    when: "1122-06"
    borders: "1122-06-01"
    countries: [cn]
    body:
      - In 1121 a plot at the Liao court led one of its generals, Yelü Yudu, to go over to the Jin, and he guided them to the Central Capital, which fell in the winter of 1121–1122. Tianzuo left his uncle Yelü Chun in charge of the Southern Capital and fled west to the Yin mountains. A Liao army reinforced by Tanguts sent by the Western Xia was beaten, and the Jin took the Western Capital (Datong) in 1122.
      - At Yanjing the Liao officials and generals, among them Yelü Dashi, made Yelü Chun emperor in the spring of 1122, a regime historians call the Northern Liao. The Song now attacked. In the summer Tong Guan’s army advanced to the Baigou River on the old frontier and was routed by Yelü Dashi and Xiao Gan. Yelü Chun died in June, and in the autumn a second Song army, joined by the Liao general Guo Yaoshi, who had gone over to the Song, got into Yanjing by surprise, but it was driven out again with heavy losses.
    facts:
      - [Central Capital taken, "winter 1121–1122"]
      - [Western Capital taken, "1122"]
      - [Song defeat on the Baigou River, "summer 1122"]
