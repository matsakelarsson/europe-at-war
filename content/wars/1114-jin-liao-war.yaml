  - title: The Jin empire
    date: January – December 1115
    when: "1115-12"
    borders: "1115-12-01"
    countries: [cn]
    body:
      - In January 1115 Aguda proclaimed himself emperor of a new dynasty, the Jin, “Gold”, said to contrast with the Liao, whose name meant iron; historians know him as Taizu of Jin. Talks with the Liao failed. In the autumn the Jin took Huanglong, the great Liao stronghold of the north-east on the site of the old Balhae prefecture of Fuyu.
      - Tianzuo now led a great army against the Jin himself, the sources say 700,000 men. A conspiracy at his court to depose him forced him to turn back, and at Hubudagang, at the end of 1115, Aguda’s army, said to be 20,000 horsemen, fell on the Liao and routed them. The Liao never again put a field army of that size against the Jin.
    facts:
      - [Jin dynasty proclaimed, "January 1115"]
      - [Huanglong taken, "autumn 1115"]
      - [Battle of Hubudagang, "end of 1115"]
