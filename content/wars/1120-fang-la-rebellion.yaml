id: fang-la-rebellion
name: Fang La rebellion
start: "1120-11-01"
end: "1122-04"
tier: C
summary: "The great rising in the lower Yangtze region led by Fang La, the owner of a lacquer-tree plantation from Qingxi county in Muzhou (today’s Chun’an in Zhejiang) or from neighbouring Shezhou. Under the emperor Huizong, the people of the region were burdened with heavy taxes and with the requisitions of the “flower and rock convoys”, which shipped rare plants and stones to the emperor’s gardens in Kaifeng. On 1 November 1120 Fang La rose, calling himself the Sage Lord and proclaiming an era of his own, Yongle. His followers, soon tens of thousands strong, destroyed a government army of 5,000, took Qingxi, Muzhou and Shezhou, and in late December 1120 took Hangzhou, where they killed the regional officials. At its height the rising held six prefectures and 52 counties in Zhejiang, Anhui and Jiangxi. The court called off the convoys and sent the eunuch Tong Guan south with the army gathered for the war against the Liao. In 1121 the government armies retook Hangzhou and the other towns and trapped Fang La in the Bangyuan caves near Qingxi, where Han Shizhong, a junior officer, captured him in the spring or early summer of 1121. He was executed in Kaifeng that autumn, and the last of his followers were defeated in eastern Zhejiang in the spring of 1122. Song writers said two million people died, a figure that is probably exaggerated. The rising delayed the Song attack on the Liao and was later linked, probably wrongly, with the Manichaeans."
