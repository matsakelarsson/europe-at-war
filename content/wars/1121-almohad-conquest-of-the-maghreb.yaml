id: almohad-conquest-of-the-maghreb
name: Almohad conquest of the Maghreb
start: "1121"
end: "1160-01"
tier: A
summary: "The rise of the Almohads (al-Muwahhidun, “those who affirm the unity of God”), a religious movement founded among the Masmuda Berbers of the High Atlas by the preacher Ibn Tumart, and their conquest of North Africa from the Atlantic to Tripolitania. Proclaimed the Mahdi in 1121, Ibn Tumart made the mountain village of Tinmel his base and waged war on the Almoravids, whom he accused of corrupting Islam; his first attack on Marrakesh was crushed at al-Buhayra in 1130, and he died a few months later. His successor Abd al-Mu’min, a Zenata from near Tlemcen, fought his way along the mountains for years, broke the Almoravid army near Tlemcen and Oran in 1144–1145, took Fez in 1146 and Marrakesh in 1147, and crushed a great revolt with mass executions. He then turned east, ending the Hammadid kingdom at Bougie in 1152, defeating the Arab tribes at Sétif in 1153 and, in 1159–1160, taking Tunis and driving the Normans of Sicily from Mahdia. For the first time the whole Maghreb was united under one ruler, a Berber dynasty that also held al-Andalus."
countries: [ma, dz, tn, ly]
