  - title: Bougie and Sétif
    date: 1151–1153
    when: "1152-08"
    borders: "1153-04-27"
    countries: [dz]
    body:
      - In 1151 Abd al-Mu’min led an expedition east, perhaps prompted by the Norman conquests on the coast of Ifriqiya. He took Algiers, where the exiled Zirid emir al-Hasan ibn Ali had been living, and in August 1152 Bougie (Béjaïa), the Hammadid capital; the last Hammadid ruler, Yahya ibn Abd al-Aziz, fled by sea. The Almohads also took the old Hammadid capital in the Hodna, the Qal’a, and Constantine submitted.
      - The Arab tribes of the Banu Hilal and Banu Sulaym, allies of the Hammadids and masters of the plains, gathered to resist. Abd al-Mu’min’s army drew them into the hills near Sétif, then turned and charged, and on 27 April 1153 the Arabs were routed; their families and herds fell into Almohad hands. The caliph kept the women and children in safe custody and settled them in Marrakesh with pensions, and the tribesmen came to join them. Arab tribes were settled on the Atlantic plains of Morocco, emptied by the wars against the Barghawata, and enrolled in the Almohad army, a step in the Arabisation of those plains.
    facts:
      - [Bougie taken, "August 1152"]
      - [Battle of Sétif, "27 April 1153, Almohad victory"]
    markers:
