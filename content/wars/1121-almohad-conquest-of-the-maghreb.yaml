notes:
  - "The main sources are Almohad and post-Almohad: the memoirs of al-Baydhaq, a companion of Ibn Tumart, the letters of the Almohad chancery, and later chronicles such as Ibn al-Qattan, Ibn Idhari, the Rawd al-Qirtas and Ibn Khaldun. They often differ on dates by a year or more; the text gives the main alternatives."
  - "Ibn Tumart taught a strict doctrine of the unity of God (tawhid) and rejected any likening of God to his creatures; he accused the Almoravids, who followed the Maliki jurists, of anthropomorphism and of neglecting the Quran and the Prophet’s example. His followers were organised by tribe under a Council of Ten and an assembly of tribal shaykhs. The Almohad wars in al-Andalus from 1147 are told in the Reconquista; the end of Norman rule in Ifriqiya also in Norman conquests in Ifriqiya."
