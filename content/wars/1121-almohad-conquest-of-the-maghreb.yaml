  - title: Al-Buhayra
    date: 1124–1130
    when: "1130"
    borders: "1130-05-01"
    countries: [ma]
    body:
      - From Tinmel the Almohads waged a guerrilla war in the High Atlas, threatening the roads south of Marrakesh and the route to Sijilmasa, while the Almoravids built forts such as Tasghimut, which guarded the approach to Aghmat, to hem them in. Ibn Tumart organised his followers by tribe under a Council of Ten and an assembly of tribal chiefs, and his lieutenant al-Bashir enforced unity with a purge, the tamyiz, in the winter of 1129–1130, in which, according to one modern estimate, about 15,000 men were killed in the Tinmel area.
      - Early in 1130 the Almohads came down from the mountains, beat an Almoravid column near Aghmat and pursued it to Marrakesh, which they besieged for about forty days. In April or May 1130 the Almoravids sallied out and routed them in the gardens of al-Buhayra outside the walls; a sudden downpour let the survivors escape. Al-Bashir was killed with four other members of the Council of Ten, and the Hargha alone are said to have lost 12,000 men. Ibn Tumart died at Tinmel in August 1130; according to the chroniclers his death was kept secret for two or three years while Abd al-Mu’min established himself as his successor.
    facts:
      - [Purge (tamyiz), "winter 1129–1130"]
      - [Siege of Marrakesh, "about forty days, spring 1130"]
      - [Battle of al-Buhayra, "April or May 1130, Almoravid victory"]
      - [Death of Ibn Tumart, "August 1130"]
