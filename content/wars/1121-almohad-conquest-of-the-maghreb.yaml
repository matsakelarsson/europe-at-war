  - title: The Massa revolt and the purge
    date: 1147–1150
    when: "1148"
    borders: "1148-06-01"
    countries: [ma]
    body:
      - The conquest of Marrakesh was followed by a great revolt. In the Sous, Muhammad ibn Abd Allah al-Massi, from the ribat of Massa on the Atlantic coast, rose against the Almohads, and the rising spread; Ceuta, Salé and Sijilmasa overthrew their Almohad governors.
      - Abd al-Mu’min’s lieutenant Umar al-Hintati put the revolt down and killed al-Massi. The caliph then held a reckoning (i’tiraf) among the tribes in which those judged disloyal were put to death; one source puts the number executed at about 30,000. The Almohads also turned on the Barghawata of the Atlantic plains, the old confederation with its own Berber-language faith that the Almoravids had fought, and in 1149 eliminated them as a political and religious group. In 1150–1151 Abd al-Mu’min received the oaths of the leaders of al-Andalus at his new camp-fortress, Ribat al-Fath, the future Rabat, across the river from Salé.
    facts:
      - [Massa revolt, "1147–1148"]
      - [End of the Barghawata, "1149"]
      - [Executions after the revolt, "about 30,000 according to one source"]
