  - title: Abd al-Mu’min’s long march
    date: 1130–1144
    when: "1140"
    borders: "1143-01-01"
    countries: [ma]
    body:
      - In 1132 the Almohads took the Almoravid fort of Tasghimut. About 1133 Abd al-Mu’min was proclaimed caliph, at first as “successor of the Mahdi”, an unusual choice because he was not a Masmuda but a Zenata from Tagra near Tlemcen. He resolved to avoid the plains, where the Almoravid cavalry was strong, and to win over the mountain tribes one by one.
      - From 1139 he led his army north and east along the Middle Atlas and into the Rif, tribe by tribe, while the Almoravids held the plains and the cities. Their best troops included a militia of Christian captives and mercenaries led by the Catalan noble Reverter, a former prisoner who had taken service with Ali ibn Yusuf and was for years their most effective commander. About 1142 Abd al-Mu’min founded a ribat and a great mosque at Taza, on the pass between Morocco and the central Maghreb. Ali ibn Yusuf died in 1143 and was succeeded by his son Tashfin.
    facts:
      - [Tasghimut taken, "1132"]
      - [Abd al-Mu’min proclaimed caliph, "about 1133"]
      - [Campaign through the mountains, "1139–1144"]
      - [Ribat at Taza, "about 1142"]
