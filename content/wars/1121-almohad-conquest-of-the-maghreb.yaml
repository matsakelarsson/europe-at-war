  - title: Fez and Marrakesh
    date: 1145–1147
    when: "1147"
    borders: "1147-04-01"
    countries: [ma, es]
    body:
      - Abd al-Mu’min turned back west. Fez fell in 1146 after a siege of about nine months, and the other cities of the north submitted. Then he marched on Marrakesh, the Almoravid capital, and besieged it for about eleven months. When it was taken in 1147, the young emir Ishaq ibn Ali was killed, and the Almohads purged the Almoravid population over three days. The Almoravid mosques were demolished or left to decay, and next to the old palace Abd al-Mu’min founded the Kutubiyya mosque.
      - From 1146 Almohad troops also crossed to al-Andalus, where the Almoravid governors were losing the cities to local rebels and to the Christian kings, and in 1147 Seville became the Almohad capital in the peninsula; the Almohad wars there are told in the Reconquista. The last Almoravids held out in the Balearic Islands, where their heirs, the Banu Ghaniya, would later carry the war back to Ifriqiya.
    facts:
      - [Fez taken, "1146, after a siege of about nine months"]
      - [Marrakesh taken, "1147, after a siege of about eleven months"]
      - [Death of Ishaq ibn Ali, "1147"]
