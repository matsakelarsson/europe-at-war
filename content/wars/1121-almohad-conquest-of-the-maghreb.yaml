  - title: Tunis and Mahdia
    date: 1159 – January 1160
    when: "1159"
    borders: "1160-01-22"
    countries: [tn, ly, dz]
    body:
      - In 1156 the towns of the coast of Ifriqiya rose against the Normans of Sicily, who had held them since 1148, and their envoys asked Abd al-Mu’min for help. In 1159 he left Salé with an army that Ibn al-Athir puts at 100,000 men, with the Arab tribes now marching in it and the exiled Zirid al-Hasan ibn Ali in his train, while a fleet of seventy galleys followed along the coast. Tunis, ruled by the Banu Khurasan, refused to surrender and was taken by force in 1159 after a three-day siege.
      - Mahdia, the old Zirid capital, held by a Norman garrison, was besieged by land and sea from the summer of 1159. The Almohad fleet beat a Sicilian relief fleet, and in January 1160, after about seven months, the garrison surrendered and sailed home. Sfax, Gabès, Kairouan and the coast as far as Tripoli recognised the caliph. For the first time the whole of North Africa from the Atlantic to Tripolitania was ruled by a single power, and a Berber one, which also held al-Andalus; Abd al-Mu’min died at Ribat al-Fath in 1163.
    facts:
      - [Tunis taken, "1159"]
      - [Mahdia surrenders, "January 1160"]
      - [Almohad army, "100,000 men according to Ibn al-Athir; 70 galleys"]
