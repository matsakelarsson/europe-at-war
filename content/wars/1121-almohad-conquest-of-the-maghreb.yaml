  - title: Tlemcen and Oran
    date: 1144 – March 1145
    when: "1145-03"
    borders: "1145-03-23"
    countries: [dz, ma]
    body:
      - In 1144 Abd al-Mu’min moved east into the land of his own people. Zenata tribes of western Algeria joined him, and the Almoravid army, led by the emir Tashfin ibn Ali, came out to fight. Reverter, the Almoravids’ Catalan commander, was killed in battle, possibly near Tlemcen (the sources give 1142 or 1144), and the Zenata crucified his body; after his death the Almoravid army broke down quickly. With the help of the Zenata the Almohads defeated Tashfin and took Tlemcen in 1144.
      - Tashfin fell back to Oran, where the Almohads besieged him. He sent for a fleet from Almería to take him off by sea and burned his camp, but riding at night towards the harbour he fell from a cliff and was killed, on 23 or 25 March 1145. His young son Ibrahim and then his brother Ishaq ibn Ali succeeded him, with little left to rule but Marrakesh, Fez and a few towns.
    facts:
      - [Death of Reverter, "1142 or 1144"]
      - [Tlemcen taken, "1144"]
      - [Death of Tashfin ibn Ali near Oran, "23 or 25 March 1145"]
