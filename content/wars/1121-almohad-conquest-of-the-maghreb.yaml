steps:
  - title: The Mahdi of the Masmuda
    date: 1117–1124
    when: "1121"
    borders: "1121-12-01"
    countries: [ma, dz, tn]
    body:
      - Ibn Tumart, born about 1080 at Igiliz in the Anti-Atlas into a family of the Hargha, a tribe of the Masmuda Berbers, studied in Córdoba and in the East. He came back in 1117 or 1118, landing at Mahdia and travelling west through Tunis and Bougie (Béjaïa), preaching against wine, music and the mixing of men and women in public and denouncing the Maliki jurists who served the Almoravids. Expelled from Bougie, he camped at nearby Mallala, where his first followers joined him, among them a young Zenata scholar from near Tlemcen, Abd al-Mu’min.
      - In 1120 he debated the Maliki scholars of Fez and was expelled, and in Marrakesh he confronted the Almoravid emir Ali ibn Yusuf and his jurists; the emir had him flogged and banished. He withdrew to the Sous, and near the end of Ramadan in late 1121, at Igiliz, his followers recognised him as the Mahdi, the rightly guided leader expected to fill the world with justice, a declaration of war on the Almoravids. At the invitation of the Hintata chief Umar al-Hintati he moved into the High Atlas, and in 1122 or about 1124 he settled with his followers at Tinmel in the valley of the Nfis, a mountain stronghold that became the movement’s centre.
    facts:
      - [Return to the Maghreb, "1117 or 1118"]
      - [Proclaimed the Mahdi, "late 1121, at Igiliz"]
      - [Tinmel, "the Almohad base from 1122 or about 1124"]
