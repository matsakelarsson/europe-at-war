notes:
  - "Dates are given as the sources give them, converted from the Chinese calendar to the Julian calendar. Sources sometimes give the Chinese month and day with a Western year, so a few dates differ by a month or more between accounts: the Battle of Yancheng, fought on the 8th day of the 7th month of 1140, appears as “8 July” in some sources and as 21 August in others."
  - "The Jin princes and generals had Jurchen names and Chinese names: Wuzhu is Wanyan Zongbi, Nianhan is Wanyan Zonghan, Walibu is Wanyan Zongwang, Loushi is Wanyan Loushi. The Song capital Kaifeng was then called Bianjing (Dongjing); Lin’an is Hangzhou, Jiankang is Nanjing."
  - "Troop numbers in the Song and Jin histories are often far apart (the Jin army at Huangtiandang was 100,000 men in the History of Song and 4,000 in the History of Jin) and are given here as the sources report them."
  - "Yue Fei became one of China’s best-known national heroes, and Qin Hui its archetypal traitor, long after the war. Modern historians debate how decisive his victories of 1140 were and whether the Song could have recovered the north; the story here keeps to the events."
