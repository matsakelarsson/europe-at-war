  - title: Shunchang, Yancheng and the twelve plaques
    date: 1139–1140
    when: "1140-08-21"
    borders: "1140-08-21"
    countries: [cn]
    body:
      - In 1138 Gaozong’s chief minister Qin Hui negotiated a peace. Gaozong would call himself a vassal of the Jin, and in 1139 the Jin handed Henan and Shaanxi, the former lands of Qi, back to the Song. The peace did not last. At the Jin court Wuzhu and his allies overthrew the ministers who had made it, and in the early summer of 1140 Jin armies marched back into Henan and Shaanxi and retook them within weeks.
      - Liu Qi, on his way to take up a post at Kaifeng, stopped at Shunchang (Fuyang) with fewer than 20,000 men, fortified the town and beat off attacks by Wuzhu’s much larger army in June. Yue Fei then marched north from Ezhou with the largest Song army. On the 8th day of the 7th month, in August 1140, Wuzhu attacked his camp at Yancheng with infantry and his heavy cavalry and was driven off; a few days later Yue Fei’s son Yue Yun beat the Jin again at Yingchang (Xuchang). Yue Fei’s forces reached Zhuxianzhen, about 20 km from Kaifeng, and his officers took Zhengzhou and Luoyang.
      - The court did not want a war of reconquest. Gaozong feared the power of his generals, and the return of his captive mother depended on peace. Tradition says Yue Fei received twelve orders to withdraw in one day, sent on gold-lettered plaques. He obeyed, and the towns he had taken fell back to the Jin. The western armies under Wu Lin and the eastern army of Han Shizhong also returned to their bases.
    facts:
      - [Jin return Henan and Shaanxi, "1139"]
      - [Jin reoccupation, "May–June 1140"]
      - [Battle of Shunchang, "June 1140, Song victory"]
      - [Battle of Yancheng, "August 1140, Song victory"]
