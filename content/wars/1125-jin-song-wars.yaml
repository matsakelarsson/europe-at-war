  - title: Qi, the client state
    date: 1130–1137
    when: "1134"
    borders: "1134-06"
    countries: [cn]
    body:
      - The Jin did not want to govern the Chinese lands between the Yellow River and the Huai themselves. In the autumn of 1130 they made Liu Yu, a Song prefect of Jinan who had gone over to them in 1128, emperor of Qi (often called Da Qi, “Great Qi”), with his capital first at Daming and from 1132 at Kaifeng. Qi ruled Henan, Shandong and Shaanxi under Jin protection, raised its own armies and fought the Song alongside the Jin.
      - In November 1133 the Qi general Li Cheng took Xiangyang, the key to the middle Yangtze. In 1134 Yue Fei, now in command at Ezhou (Wuchang), retook it with six prefectures around it. A joint Qi and Jin offensive towards the Yangtze in the winter of 1134 ended when news came of the death of the Jin emperor Taizong early in 1135. In the same year Yue Fei ended the rising of Yang Yao, whose followers had held the shores of Lake Dongting since 1130.
      - A second Qi invasion of the Huainan region in late 1136 was defeated, and in 1137 a Song general, Li Qiong, killed his superior and went over to Qi with tens of thousands of men. But the Jin court had lost faith in Liu Yu. In December 1137 it abolished Qi, made Liu Yu a prince and took over his lands directly. Gaozong, who had made Hangzhou his residence under the name Lin’an, “temporary peace”, declared it the capital in 1138.
    facts:
