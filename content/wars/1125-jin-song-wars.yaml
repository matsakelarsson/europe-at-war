  - title: Across the Yangtze
    date: 1128 – summer 1130
    when: "1130-01-22"
    borders: "1130-01-22"
    countries: [cn]
    body:
      - Gaozong did not stay in the north. His court moved to Yangzhou in late 1127, while the old general Zong Ze held Kaifeng and rallied the volunteer bands of Henan and Hebei until his death in 1128. In February 1129 Jin cavalry raided Yangzhou and the emperor escaped across the Yangtze to Hangzhou only just in time. There two officers of his guard, Miao Fu and Liu Zhengyan, forced him to abdicate in April; loyal generals, Han Shizhong among them, restored him within a month.
      - In the winter of 1129 Wuzhu (Wanyan Zongbi) led a Jin army across the Huai and the Yangtze. The Song commander Du Chong surrendered Jiankang (Nanjing); Hangzhou fell on 22 January 1130 and Yuezhou (Shaoxing) on 4 February. Gaozong fled from Mingzhou (Ningbo) by sea and spent weeks on ships off the coast of Taizhou and Wenzhou, while a Jin squadron sent after him was turned back by a Song fleet. Wuzhu, far from his bases, withdrew in the spring, burning and looting Hangzhou as he left.
      - On the way back Han Shizhong, with about 8,000 men and a fleet, met the Jin army on the Yangtze near Zhenjiang, his wife Liang Hongyu beating the drums. He drove Wuzhu’s boats into Huangtiandang, a dead-end stretch of water downstream from Jiankang, and blocked its mouth for 48 days. The Jin dug a channel to escape towards Jiankang and finally, on a windless day, set the Song sails alight with fire arrows and broke out to the north. Yue Fei, then a young commander, retook Jiankang, and the Jin did not cross the Yangtze again for thirty years.
    facts:
      - [Jin raid on Yangzhou, "February 1129"]
      - [Hangzhou taken, "22 January 1130"]
      - [Huangtiandang, "spring 1130, 48 days"]
      - [Han Shizhong’s force, "about 8,000 men"]
