id: jin-song-wars
name: Jin–Song wars
start: "1125-11"
end: "1142-10-11"
tier: A
summary: "The wars in which the Jurchen Jin dynasty, having destroyed the Liao with Song help, turned on its ally and conquered northern China. Jin armies besieged the Song capital Kaifeng in 1126, took it in January 1127 and carried the retired emperor Huizong, the reigning emperor Qinzong and some 14,000 members of the court north into captivity, the Jingkang incident. A surviving prince, Zhao Gou, was proclaimed emperor (Gaozong) and founded the Southern Song. In 1129–1130 the Jin general Wuzhu crossed the Yangtze and chased the court to the sea, but was trapped for 48 days at Huangtiandang on his way back; in the west the Wu brothers held the passes into Sichuan. The Jin ruled Henan and Shaanxi for a time through a client state, Qi, which they abolished in 1137. After a short-lived peace, Wuzhu attacked again in 1140; Liu Qi and Yue Fei defeated him at Shunchang, Yancheng and Yingchang, but the court of Gaozong and Qin Hui recalled Yue Fei, had him killed in prison and made the peace of Shaoxing (agreed 1141, ratified 1142). It fixed the border on the Huai River and the Dasan Pass, made the Song emperor a vassal of the Jin and bound the Song to yearly payments of silver and silk."
countries: [cn]
