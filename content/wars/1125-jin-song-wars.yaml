  - title: The passes to Sichuan
    date: 1130–1134
    when: "1130-09"
    borders: "1131-03"
    countries: [cn]
    body:
      - To draw the Jin away from the Yangtze, the Song commissioner in the north-west, Zhang Jun, gathered the armies of Shaanxi, about 180,000 men by one account, for an offensive. In September 1130 they met the Jin under Loushi and Wuzhu at Fuping, north-east of Xi’an. The Song divisions fought without coordinating, one of them collapsed, and the army was routed. By March 1131 the Jin held nearly all of Shaanxi; some Song officers went over to the Jin or to the Western Xia.
      - The way into Sichuan was held by the brothers Wu Jie and Wu Lin, who gathered the survivors in the passes of the Qinling mountains. At Heshangyuan, a plateau above the Dasan Pass south-west of Baoji, they beat off a Jin vanguard in the spring of 1131 and the main army under Wuzhu in November; Wuzhu was hit by two arrows and escaped with difficulty, and more than a thousand Jin soldiers were captured.
      - The Jin took Heshangyuan at the end of 1133, when its garrison had been drawn off, and early in 1134 attacked the second line at Xianrenguan, on the road from Baoji to Hanzhong, with what the Song sources call 100,000 cavalry. Wu Jie and Wu Lin, with perhaps 10,000 men, held an inner wall and then routed the Jin camp in a night attack. The Jin fell back to Fengxiang. Sichuan, with its people, grain and salt, stayed in Song hands for the rest of the dynasty, and the Wu family governed it for three generations.
    facts:
      - [Battle of Fuping, "September 1130, Jin victory"]
      - [Heshangyuan, "1131, Song victory"]
      - [Xianrenguan, "1134, Song victory"]
