  - title: The peace of Shaoxing
    date: 1141–1142
    when: "1142-10-11"
    borders: "1142-10-11"
    countries: [cn]
    body:
      - Early in 1141 Wuzhu crossed the Huai again. A Song army under Yang Qizhong and Liu Qi defeated him at Zhegao, north of the Chao lake, in March, though the Jin took Haozhou before they withdrew. In the spring Gaozong and Qin Hui took the armies away from their great generals by promoting Han Shizhong, Zhang Jun and Yue Fei to the Bureau of Military Affairs at court. Yue Fei, who had spoken against the peace, was dismissed and in the autumn arrested on charges of plotting rebellion. Asked for proof, Qin Hui is said to have answered “mo xu you”, “perhaps there was”, a phrase that came to mean a trumped-up charge. On 27 January 1142 Yue Fei was killed in prison in Lin’an, and his son Yue Yun and his officer Zhang Xian were executed.
      - The peace was agreed in the 11th month of 1141 and ratified when a Jin envoy came to Lin’an on 11 October 1142. The border ran along the middle of the Huai River and in the west to the Dasan Pass; the Song gave up Tang and Deng prefectures and about half of Shang and Qin. The Song emperor called himself a vassal and was invested by the Jin emperor, and the Song paid 250,000 taels of silver and 250,000 bolts of silk a year. In return the Jin sent back Gaozong’s mother, the empress dowager Wei, with the coffin of Huizong; she left Wuguocheng on 1 May 1142 and reached Lin’an in September.
      - The peace held for almost twenty years and gave the Southern Song a long period of growth in the Yangtze valley and the south. Gaozong’s successor Xiaozong cleared Yue Fei’s name in 1162, and his tomb and temple by the West Lake in Hangzhou became a place of pilgrimage, with kneeling iron statues of Qin Hui, his wife and two of his associates before it.
