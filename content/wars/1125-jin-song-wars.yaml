  - title: The Jingkang incident
    date: September 1126 – June 1127
    when: "1127-01-09"
    borders: "1127-01-09"
    countries: [cn]
    body:
      - The Song court did not hand over the three prefectures, and in June 1126 relief armies sent towards Taiyuan were beaten. Taiyuan fell in September. In the autumn both Jin armies marched on the capital again, Nianhan by Luoyang and Walibu across Hebei, and by the middle of December Kaifeng was besieged a second time. Its garrison was weaker than in the spring, and on 9 January 1127 the Jin broke in. Qinzong went to the Jin camp to negotiate and was held there, and the city was stripped of its gold, silver, silk and treasures over the following weeks.
      - On 20 March the Jin deposed both emperors and made them commoners, and set up a former Song minister, Zhang Bangchang, as emperor of a new state of Chu. When they left in the spring, they took with them more than 14,000 people, among them Huizong, Qinzong, empresses and consorts, most of the imperial clan, officials, palace women, musicians and craftsmen, along with the imperial library, the ritual vessels and the printing blocks. Many died on the road. The two emperors were held in Manchuria; Huizong died at Wuguocheng on the Sungari in 1135, and Qinzong lived in captivity until 1156. The disaster is named after Qinzong’s reign period, Jingkang.
      - One son of Huizong escaped capture. Zhao Gou, Prince Kang, had been sent out of the capital to raise troops, and on 12 June 1127 he was enthroned at Yingtianfu (Shangqiu) as Emperor Gaozong. Zhang Bangchang, who had never wanted the throne, gave up his title and submitted to him. The dynasty that Gaozong refounded is called the Southern Song.
    facts:
      - [Taiyuan falls, "September 1126"]
      - [Fall of Kaifeng, "9 January 1127"]
      - [Emperors deposed, "20 March 1127"]
      - [Captives taken north, "more than 14,000"]
      - [Gaozong enthroned, "12 June 1127 at Yingtianfu"]
