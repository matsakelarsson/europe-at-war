steps:
  - title: The first siege of Kaifeng
    date: November 1125 – March 1126
    when: "1125-11"
    borders: "1125-12-31"
    countries: [cn]
    body:
      - In 1120 the Song had agreed with the new Jurchen Jin state to destroy the Liao together, the “alliance conducted at sea”. The Jurchens did most of the fighting; Song armies failed twice to take the Liao southern capital, Yanjing (today Beijing), which the Jin took and handed over in 1123 in return for heavy payments. Quarrels over the payments and the border, and the Song welcome given to a Liao governor who had defected from the Jin, ended the alliance. Once the last Liao emperor was captured in March 1125, the Jin emperor Taizong ordered war on the Song in November.
      - Two Jin armies marched south. In the west Nianhan (Wanyan Zonghan) advanced from Datong and laid siege to Taiyuan, where the Song commander Wang Bing held out for 260 days. In the east Walibu (Wanyan Zongwang) entered Yanjing in December, when its commander Guo Yaoshi, a former Liao general, went over to him with his troops, and rode south across the Hebei plain. The Song emperor Huizong abdicated in favour of his son Qinzong on 18 January 1126 and left the capital; on 27 January the Jin cavalry crossed the Yellow River.
      - From 31 January Walibu besieged Kaifeng, a city of perhaps a million people. The official Li Gang organised its defence, and a night attack on the Jin camp failed. The Jin demanded a ransom of five million taels of gold and fifty million of silver, with silk, horses and cattle, the cession of the three prefectures of Taiyuan, Zhongshan and Hejian, and a prince as hostage. The court agreed, scraped together what gold and silver it could, and the Jin army withdrew on 5 March after 33 days.
    facts:
      - [Jin declaration of war, "November 1125"]
      - [Huizong abdicates, "18 January 1126"]
      - [First siege of Kaifeng, "31 January – 5 March 1126"]
      - [Ransom demanded, "5 million taels of gold, 50 million of silver"]
