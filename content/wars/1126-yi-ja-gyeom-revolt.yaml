id: yi-ja-gyeom-revolt
name: Yi Ja-gyeom’s revolt
start: "1126-02"
end: "1126-05"
tier: C
summary: "A struggle for power at the Goryeo court that left most of the royal palace in ashes. Yi Ja-gyeom, head of the Inju (Gyeongwon) Yi clan, was both the grandfather and the father-in-law of King Injong, having married two of his daughters to the young king, and by the 1120s he controlled appointments and much of the government. In the second month of 1126 officials close to the king tried to remove him and his ally, the general Cheok Jun-gyeong, attacking at night and killing Cheok’s brother and son. Cheok Jun-gyeong’s soldiers set fire to the palace and broke in, killed the king’s supporters, and took Injong to Yi Ja-gyeom’s house; the palace burned almost to the ground. Yi Ja-gyeom, now in full control, also had Goryeo accept the Jurchen Jin empire as overlord. The king then secretly won Cheok Jun-gyeong over through the official Choe Sa-jeon, and in the fifth month of 1126 Cheok’s troops arrested Yi Ja-gyeom, who was exiled to Yeonggwang and died there the same year. Cheok Jun-gyeong was himself exiled in 1127."
