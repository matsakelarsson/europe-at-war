id: norwegian-civil-wars
name: Norwegian civil wars
start: "1130"
end: "1240"
tier: C
summary: More than a century of wars between rival kings and pretenders to the Norwegian throne, begun when Harald Gille broke his oath and claimed the crown on the death of Sigurd the Crusader in 1130. From the 1170s the wars were fought between two parties, the Birkebeiner, who brought King Sverre to power, and the church-backed Bagler. The parties were reconciled in 1217 under Haakon IV, and the defeat of Duke Skule Bårdsson’s rising in 1240 ended the era, leaving a stronger monarchy and clearer rules of succession.
countries: ["no"]
sides:
  - id: kings
    name: Rival kings and parties
    polities: [norway]
    ink: red
notes:
  - The main sources are the kings’ sagas, notably Snorri Sturluson’s Heimskringla and Sverris saga, which was written with King Sverre’s help. Some two dozen kings and pretenders took part, and the parties changed over time, so they are not shown as fixed sides here.
