id: myocheong-rebellion
name: Myocheong’s rebellion
start: "1135-01"
end: "1136-02"
tier: C
summary: "A rising at the Western Capital, Seogyeong (Pyongyang), led by the Buddhist monk Myocheong. After the palace fire of 1126 and Goryeo’s submission to the Jin, Myocheong and his allies, the officials Jeong Ji-sang and Baek Su-han, urged King Injong to move the capital to Seogyeong, which they said had better geomantic power, to call himself emperor and to attack the Jin. A new palace, Daehwagung, was built there in 1128–1129, but officials of the capital, Kaegyong, led by Kim Bu-sik, opposed the move, and the king held back. In the first month of 1135 Myocheong and his supporters seized Seogyeong, proclaimed a state called Daewi with the era name Cheongae, and called their army the “heaven-sent loyal and righteous army”. The court made Kim Bu-sik commander and had Jeong Ji-sang and others killed in Kaegyong. Within weeks Jo Gwang, one of the rebel leaders, killed Myocheong and sent his head to the court hoping for pardon, but when the court would not pardon him he fought on. Kim Bu-sik besieged the city for more than a year, and Seogyeong fell in the second month of 1136. The defeat ended the Western Capital faction, and Kim Bu-sik went on to compile the Samguk sagi."
