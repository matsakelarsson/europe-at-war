steps:
  - title: Djerba and Tripoli
    date: 1123–1146
    when: "1135"
    borders: "1146-07-01"
    countries: [tn, ly, it]
    body:
      - After the Hilalian migration the Zirid emirs held little more than Mahdia and the coast around it, and they lived largely from the sea, from trade and from raiding. Sicily, conquered from its Muslim emirs by the Normans between 1061 and 1091, sold them grain and had long kept agents in Mahdia. Relations broke down in the 1120s. In July 1123 a Sicilian fleet, said to have been 300 ships, landed near Mahdia and seized the fort of al-Dimas, but the emir al-Hasan ibn Ali attacked by night and the invaders fled to their ships, losing most of the fleet and the men left behind.
      - Roger II, king of Sicily from 1130, tried again with better preparation. In the autumn of 1135 his fleet occupied the island of Djerba, and as drought and famine struck Ifriqiya in the following years, Mahdia came to depend on Sicilian grain and by 1142 was a Sicilian protectorate in all but name. An attack on Tripoli in 1143 was beaten off by its rulers, the Banu Khazrun. Three years later, when famine and civil strife had driven the Banu Khazrun out of the city, George of Antioch, Roger’s Greek admiral, took Tripoli from the sea in June 1146. He stayed about six months to organise its defence and left it under a local Muslim governor who paid tribute to Sicily.
    facts:
      - [Landing at al-Dimas, "July–August 1123, Zirid victory"]
      - [Djerba taken, "autumn 1135"]
