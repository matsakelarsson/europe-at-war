notes:
  - The fullest accounts are Arabic, above all Ibn al-Athir, al-Tijani and Ibn Khaldun, with Latin chronicles from Sicily such as Romuald of Salerno’s and the history of “Hugo Falcandus”. Modern historians call the Norman possessions on the African coast the Kingdom of Africa.
  - The coastal towns were never fully governed from Palermo. They kept their Muslim governors, judges and law, paid tribute, and in some cases chose their own rulers; the Norman garrisons were small.
