  - title: Revolt and the Almohad reconquest
    date: 1156 – January 1160
    when: "1159"
    borders: "1160-01-22"
    countries: [tn, ly, it, ma]
    body:
      - Roger II died in 1154, and his son William I faced rebellion in Sicily and southern Italy. In 1156 Tripoli, Sfax, Djerba and Gabès rose and expelled their Sicilian garrisons, and delegations from Ifriqiya asked the Almohad caliph Abd al-Mu’min, who had taken Bougie in 1152, for help. In 1159 he led an army that Ibn al-Athir puts at 100,000 men east from Salé, with the exiled emir al-Hasan ibn Ali in his train, while a fleet of seventy galleys sailed along the coast. Tunis, ruled by the Banu Khurasan, was taken after a three-day siege.
      - The army then laid siege to Mahdia by land and sea in the summer of 1159. The Almohad fleet defeated a Sicilian fleet sent to relieve it, and in January 1160, after a siege of about seven months, the garrison negotiated its surrender and was allowed to sail back to Sicily; according to some accounts, the Christians and Jews who stayed were given the choice of Islam or death. Sfax, Gabès and the rest of the coast as far as Tripoli recognised the Almohads. Al-Hasan ibn Ali was allowed to live in Zawila, outside the walls of his former capital. Sicily made a lasting peace with the Almohads in 1180.
    facts:
      - [Towns rise against Sicily, "1156"]
      - [Tunis taken by the Almohads, "1159"]
      - [Mahdia surrenders, "January 1160"]
