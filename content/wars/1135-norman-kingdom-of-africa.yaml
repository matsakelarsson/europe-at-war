  - title: Mahdia, Sousse and Sfax
    date: June – July 1148
    when: "1148-06"
    borders: "1148-07-12"
    countries: [tn, ly, it]
    body:
      - In 1148, with Ifriqiya again struck by famine, Roger II sent George of Antioch against Mahdia with a fleet of about 300 ships. It arrived on 22 June. The emir, unable to resist, fled with his family and what treasure he could carry, first to the Arab tribes and then to his Hammadid relatives in Algiers, who held him in what amounted to house arrest. The Sicilians plundered the city for two hours before Roger’s safe-conduct was proclaimed to its people.
      - Sousse surrendered without a fight on 1 July, and Sfax fell after brief resistance on 12 July; Gabès and other towns of the coast accepted Sicilian overlordship, and the Kerkennah islands were taken too. The coast from Tripoli to beyond Sousse was now Sicilian. Roger had gold coins struck at Mahdia and governed the towns through Muslim governors and judges, who collected tribute for the king. In 1152 or 1153 Roger’s admiral Philip of Mahdia also took Bône (Annaba).
    facts:
      - [Mahdia taken, "22 June 1148"]
      - [Sousse surrenders, "1 July 1148"]
      - [Sfax taken, "12 July 1148"]
