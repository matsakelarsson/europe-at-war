id: norman-kingdom-of-africa
name: Norman conquests in Ifriqiya
start: "1135"
end: "1160-01"
tier: B
summary: "The conquest of the coast of Ifriqiya and Tripolitania by the Norman kings of Sicily, and its loss to the Almohads. Weakened by the Hilalian migration, famine and civil strife, the Zirid emirs of Mahdia came to depend on Sicilian grain and trade. After a failed landing near Mahdia in 1123, Roger II took the island of Djerba in 1135 and Tripoli in 1146, and in June 1148 his admiral George of Antioch occupied Mahdia, the Zirid capital, without a fight, followed by Sousse, Sfax and Gabès. Roger styled himself king of Africa and ruled the towns through Muslim governors and judges, in return for tribute. From 1156 the towns rose against William I, Roger’s successor, and asked the Almohad caliph Abd al-Mu’min for help. His army and fleet took Tunis in 1159 and besieged Mahdia, whose Norman garrison surrendered in January 1160 and was allowed to sail home, ending the Norman kingdom in Africa."
