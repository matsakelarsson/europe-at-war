notes:
  - The size of the armies at Qatwan is unknown. Muslim chroniclers give the Qara Khitai anything from 20,000 to 700,000 men and the dead from 11,000 to 100,000; some contemporaries thought the two armies were about equal.
  - News of a defeat of the Muslims by a ruler from the east reached the crusader states during the Second Crusade and helped give rise to the legend of Prester John.
