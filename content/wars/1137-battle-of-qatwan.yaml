steps:
  - title: Khujand and Qatwan
    date: 1137–1142
    when: "1141-09-09"
    borders: "1141-09-10"
    countries: [uz, tj, kz, kg, tm]
    body:
      - When the Jurchen Jin dynasty destroyed the Khitan Liao empire of northern China in 1125, the Liao prince Yelü Dashi led a band of followers west into Central Asia. In the early 1130s he took Balasagun from the eastern Karakhanids and made it his capital, taking the title gurkhan. In 1137 he defeated Mahmud II, the khan of the western Karakhanids at Samarkand, near Khujand. Mahmud was the nephew and vassal of the Seljuk sultan Ahmad Sanjar, who ruled the eastern Seljuk lands from Merv. In 1141, after a quarrel with the Karluk tribes in his lands, who turned to the Qara Khitai for help, Mahmud appealed to Sanjar. The Khwarazmshah Atsiz, a rebellious Seljuk vassal whom Sanjar had defeated in 1138, is said to have encouraged the Qara Khitai to attack.
      - Sanjar crossed the Oxus with a large army and reached Samarkand. On 9 September 1141 the Qara Khitai and their Karluk allies met him on the Qatwan steppe north of the city, surrounded the Seljuk army and drove its centre into a valley called Dargham, about 12 km from Samarkand. The Seljuk army was destroyed. Sanjar escaped with a handful of horsemen, while his wife and many of his commanders were captured; the chroniclers give the dead as anything from 11,000 to 100,000. It was the first defeat of Sanjar’s long reign.
      - Yelü Dashi spent ninety days in Samarkand, made Mahmud’s brother Ibrahim khan there as his vassal and left the Burhan family of religious leaders in charge of Bukhara. Transoxiana now paid tribute to a non-Muslim ruler, who left its Muslim life largely alone. Atsiz used Sanjar’s defeat to invade Khorasan and plunder Merv, but in 1142 a Qara Khitai force ravaged Khwarazm and he agreed to pay the gurkhan 30,000 dinars a year. Sanjar re-established his rule in Khorasan within two years, but never recovered the lands beyond the Oxus.
