id: battle-of-qatwan
name: Qara Khitai–Seljuk war and the Battle of Qatwan
start: "1137"
end: "1142"
tier: B
summary: The war in which the Qara Khitai, Khitans from northern China who had moved west after the fall of their Liao empire, took Transoxiana from the Seljuk sultan Ahmad Sanjar and his Karakhanid vassals. After beating the Karakhanid khan near Khujand in 1137, the Qara Khitai ruler Yelü Dashi destroyed Sanjar’s army on the Qatwan steppe north of Samarkand on 9 September 1141. Transoxiana passed under the overlordship of a non-Muslim empire for the next seventy years, the Khwarazmshah Atsiz plundered Merv, and the Seljuk empire in the east began to decline.
