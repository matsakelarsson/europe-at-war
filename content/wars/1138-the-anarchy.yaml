id: the-anarchy
name: The Anarchy
start: "1138"
end: "1153-11"
tier: B
summary: A civil war in England and Normandy over the succession to Henry I, fought between his nephew King Stephen and his daughter, the Empress Matilda, with King David I of Scotland taking her side and seizing the north. Neither side could win, and in 1153 Stephen recognised Matilda’s son Henry as his heir; Henry II succeeded him in 1154.
countries: [gb, fr]
sides:
  - id: ste
    name: King Stephen
    polities: [england]
    ink: red
    moves: Stephen’s moves
    success: Success for Stephen
  - id: mat
    name: Empress Matilda and the Angevins
    polities: []
    ink: purple
    moves: Angevin moves
    success: Angevin success
  - id: sco
    name: Scotland
    polities: [scotland]
    ink: navy
    moves: Scottish moves
    success: Scottish success
notes:
  - The name “the Anarchy” was given by Victorian historians; contemporaries wrote of the troubles of Stephen’s reign. The main chronicles, the Gesta Stephani, William of Malmesbury and Henry of Huntingdon, each lean to one side.
  - Matilda is called the Empress because her first husband was the Emperor Henry V. To avoid confusion with her, Stephen’s queen is called Matilda of Boulogne.
