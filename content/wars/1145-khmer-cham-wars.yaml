steps:
  - title: Suryavarman II takes Vijaya
    date: "1145"
    when: "1145"
    borders: "1145-12-01"
    countries: [kh, vn]
    body:
      - Suryavarman II, who ruled the Khmer Empire from 1113 to about 1150 and built Angkor Wat, was the most warlike of the kings of Angkor. From 1128 he attacked Đại Việt, sending an army of 20,000 men against Nghệ An, where it was routed. In 1132 he persuaded the Cham king Jaya Indravarman III to join him, and their armies briefly held Nghệ An and raided Thanh Hóa, but after a Vietnamese counter-attack across Laos in 1136 Champa made its own peace with Đại Việt and refused to go on.
      - In 1145 Suryavarman turned on Champa. His army crossed the mountains, took the Cham capital Vijaya in today’s Bình Định and ended the reign of Jaya Indravarman III, who disappears from the record. The Khmer occupied the north of Champa, and temples at Mỹ Sơn, the holy valley of the Cham kings, were destroyed.
    facts:
      - [Vijaya taken, "1145"]
      - [Khmer king, "Suryavarman II (about 1113–1150)"]
    markers:
      - kind: capital
        side: kh
        name: Yaśodharapura (Angkor)
        date: "1145"
