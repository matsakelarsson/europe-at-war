  - title: The Cham fleet on the Tonle Sap
    date: 1167–1177
    when: "1177"
    borders: "1177-07-01"
    countries: [kh, vn]
    body:
      - In 1167 Jaya Indravarman IV seized the throne of Champa. He made peace with Đại Việt and in 1170 attacked the Khmer Empire by land, without result. He tried to buy horses from China for a new overland invasion and failed, but Song records say that Chinese crossbows reached Champa at about this time, and the Chams mounted them on war elephants. In Angkor, meanwhile, the throne had been seized in about 1165 by an official, Tribhuvanadityavarman.
      - In 1177 Jaya Indravarman sent a fleet along the coast and up the Mekong, through the Tonle Sap river and across the great lake, and took Yaśodharapura by surprise. King Tribhuvanadityavarman was killed and the city, defended only by wooden palisades, was sacked; a Cham inscription of 1183 records the Khmer treasures carried off to Champa. The Chams held the capital for some years, in the accounts of Coedès and Maspero about four.
    facts:
      - [Cham attack on Yaśodharapura, "1177 (the date has been questioned)"]
      - [Khmer king killed, "Tribhuvanadityavarman"]
