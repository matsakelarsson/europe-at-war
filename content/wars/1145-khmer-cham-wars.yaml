id: khmer-cham-wars
name: Khmer–Cham wars
start: "1145"
end: "1220"
tier: A
summary: "Seventy-five years of war between the Khmer Empire of Angkor and the Cham kingdoms on the coast of today’s central and southern Vietnam. In 1145 Suryavarman II, the builder of Angkor Wat, took the Cham capital Vijaya, but by 1150 Jaya Harivarman I had driven the Khmer and their Cham allies out. In 1177 Jaya Indravarman IV sent a fleet up the Mekong and across the Tonle Sap lake, took the Khmer capital Yaśodharapura by surprise and killed its king. Jayavarman VII drove the Chams out in a series of battles, among them a battle on the water shown on the walls of the Bayon, was crowned in 1181 and rebuilt the capital as Angkor Thom. In 1190 a Khmer army under the Cham prince Vidyanandana took Vijaya; after years of revolts and new invasions Champa was ruled as a Khmer province from 1203 until the Khmer withdrew in 1220 and Jaya Paramesvaravarman II restored its independence."
countries: [kh, vn]
sides:
  - id: kh
    name: Khmer Empire
    polities: [cambodia]
    ink: navy
    moves: Khmer moves
    success: Khmer success
  - id: ch
    name: Champa
    polities: [champa]
    ink: teal
    moves: Cham moves
    success: Cham success
notes:
  - The wars are known from Sanskrit, Khmer and Cham inscriptions, from Chinese records and from the reliefs of the Bayon and Banteay Chhmar. The inscriptions praise their kings and give few precise dates; historians such as Michael Vickery have questioned the date of the Cham attack on Yaśodharapura and the length of the Cham occupation that followed, which the older accounts of George Coedès and Georges Maspero put at about four years.
  - Champa was not one kingdom but a group of regions, among them Amaravati (around Mỹ Sơn), Vijaya (Bình Định), Kauthara (Nha Trang) and Panduranga (Phan Rang), each of which could have its own king. Vijaya, the capital in this period, is the citadel the Vietnamese call Chà Bàn or Đồ Bàn. Yaśodharapura is the city of Angkor.
