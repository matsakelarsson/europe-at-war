  - title: Jayavarman VII drives out the Chams
    date: 1177–1182
    when: "1180"
    borders: "1181-06-01"
    countries: [kh, vn]
    body:
      - Jayavarman, a son of King Dharanindravarman II who had stood aside when Tribhuvanadityavarman took the throne, now gathered an army against the Chams. Over about four years he won a series of battles, among them a battle on the water, probably on the Tonle Sap or the rivers that feed it, which his sculptors later carved on the walls of the Bayon and of Banteay Chhmar, with Khmer and Cham war boats grappling, the Chams in their flower-shaped helmets and men falling to the crocodiles. By 1181 the Chams had been driven out, and Jayavarman was crowned as Jayavarman VII.
      - He went on to put down a revolt at Malyang, in the region of today’s Battambang, with the help of a Cham prince, Vidyanandana, who had come to his court in 1182 and was trained in the Khmer army. Jayavarman then rebuilt the capital as Angkor Thom, enclosed by stone walls about 3 km on each side and a wide moat, with the Bayon at its centre, and covered the empire with temples, hospitals and rest houses. Preah Khan, which he dedicated to his father, is said to stand on the site of one of his victories over the Chams.
    facts:
      - [Coronation of Jayavarman VII, "1181 (some sources 1182)"]
      - [Angkor Thom, "walls about 3 km square, built after 1181"]
