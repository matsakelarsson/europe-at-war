  - title: The Khmer province of Champa
    date: 1192–1220
    when: "1203"
    borders: "1203-06-01"
    countries: [kh, vn]
    body:
      - Jayavarman VII sent armies against Champa again in 1192, 1195, 1198–1199 and 1201–1203. In 1203 a Cham prince on the Khmer side, Dhanapatigrama, drove Vidyanandana out, and Vidyanandana fled to Đại Việt. For the next seventeen years Champa was ruled as a province of the Khmer Empire, first by Dhanapatigrama and then by Prince Angsaraja, a son of Jaya Harivarman I who had been brought up at the Khmer court. In 1207 Angsaraja went with a Khmer army, which included Burmese and Siamese troops, against Đại Việt.
      - Jayavarman VII died in about 1218, and the Khmer presence in Champa dwindled. In 1220 the Khmer withdrew of their own accord, and Angsaraja took power as Jaya Paramesvaravarman II, restoring Champa’s independence. The Khmer Empire never again attacked Champa on this scale; Champa’s later wars were with Đại Việt and the Mongols, and the Bayon’s reliefs remained the great record of the wars.
    facts:
      - [Khmer invasions, "1192, 1195, 1198–1199, 1201–1203"]
      - [Champa a Khmer province, "1203–1220"]
      - [Independence restored, "1220, under Jaya Paramesvaravarman II"]
    markers:
