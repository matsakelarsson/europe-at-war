  - title: Vidyanandana takes Vijaya
    date: 1190–1192
    when: "1190"
    borders: "1190-12-01"
    countries: [kh, vn]
    body:
      - When Jaya Indravarman IV attacked again in 1190, Jayavarman VII put Vidyanandana at the head of a Khmer army. He took Vijaya, captured Jaya Indravarman IV and sent him to Angkor as a prisoner. Champa was divided between two kings under Khmer overlordship. Jayavarman’s brother-in-law, Prince In, became king at Vijaya as Suryajayavarman, and Vidyanandana took Panduranga in the south and the name Suryavarmadeva.
      - The settlement did not last. In 1191 a revolt at Vijaya drove In back to Cambodia and put a Cham prince on the throne as Jaya Indravarman V. Vidyanandana, with Khmer help, retook Vijaya and killed him; Jaya Indravarman IV, whom the Khmer had released to win back his throne, was defeated and put to death by Vidyanandana in about 1192. Vidyanandana then ruled all of Champa himself and broke with Angkor.
    facts:
      - [Vijaya taken, "1190"]
      - [Jaya Indravarman IV, "captured 1190, killed about 1192"]
