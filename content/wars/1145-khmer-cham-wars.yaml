  - title: Jaya Harivarman I fights back
    date: 1147–1150
    when: "1148"
    borders: "1149-06-01"
    countries: [kh, vn]
    body:
      - In 1147 Sivanandana, a prince of Panduranga in the south of Champa, was crowned as Jaya Harivarman I and took up the fight. Suryavarman sent against him a Khmer army, with Chams who had gone over to the Khmer, under the general Sankara; Harivarman defeated it at Rajapura in 1148. A larger Khmer army was beaten at Virapura and then at Caklyang. None of these places has been identified with certainty; they lay somewhere between Quy Nhơn and Phan Rang.
      - In 1149 Suryavarman made a Cham prince, Harideva, king at Vijaya under Khmer protection. Harivarman marched north, defeated Harideva’s army on the plain of Mahisa, took Vijaya and put Harideva to death with his Khmer and Cham officers, ending the occupation. In 1150 another rival, Vamsaraja, who had fled to Đại Việt and raised troops among the highland peoples, was defeated and killed at Mỹ Sơn. Suryavarman II died at about this time, possibly on campaign, and under his successors the Khmer made no new attack for a generation, while Harivarman spent the rest of his reign putting down revolts in Champa.
    facts:
      - [Jaya Harivarman I crowned, "1147"]
      - [Battle of Rajapura, "1148, Cham victory"]
      - [Vijaya retaken, "1149"]
      - [Battle of Mỹ Sơn, "1150, Vamsaraja killed"]
