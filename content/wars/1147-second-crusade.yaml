id: second-crusade
name: Second Crusade
start: "1147-05"
end: "1148-07-28"
tier: B
summary: The crusade called after Zengi took Edessa in 1144, led by Louis VII of France and Conrad III of Germany. Both armies were badly beaten by the Seljuks of Rum in Anatolia, Conrad’s near Dorylaeum and Louis’s at Mount Cadmus, and the survivors’ siege of Damascus in July 1148 was abandoned after four days. Other crusaders took Lisbon in 1147 and campaigned against the Wends on the Baltic.
countries: [tr, sy, il, lb, fr, de]
sides:
  - id: cr
    name: Crusaders and the Latin East
    polities: [kingdom-of-jerusalem, antioch, tripoli-county]
    ink: red
    moves: Crusader moves
    success: Crusader success
  - id: tu
    name: Seljuks of Rum
    polities: [rum]
    ink: brown
    moves: Seljuk moves
    success: Seljuk success
  - id: da
    name: Zengids and Damascus
    polities: [zengid]
    ink: olive
    moves: Zengid and Damascene moves
    success: Zengid or Damascene success
notes:
  - Dates are Julian. The main Western account of the French march is by Odo of Deuil, Louis VII’s chaplain; the siege of Damascus is described by William of Tyre and by Ibn al-Qalanisi, a citizen of Damascus.
  - Damascus was ruled by the Burid dynasty, in practice by the commander Mu‘in al-Din Unur, a rival of the Zengids until the crusade drove him to seek their help.
  - The capture of Lisbon in 1147 is told under the Reconquista, and the crusade against the Wends has its own entry.
