  - title: Damascus
    date: March–July 1148
    when: "1148-06-24"
    borders: "1148-07-28"
    countries: [sy, il, lb, tr]
    body:
      - At Antioch Prince Raymond, uncle of Louis’s queen Eleanor of Aquitaine, urged an attack on Aleppo, now ruled by Zengi’s son Nur al-Din. Louis refused and, after a quarrel with Eleanor, went on to Jerusalem. On 24 June 1148 a great council near Acre, with Louis, Conrad, the young King Baldwin III and the barons of the kingdom, decided to attack Damascus, the largest Muslim city near the kingdom, although its ruler, Unur, had been the Franks’ ally against Zengi.
      - The crusaders reached Damascus on 24 July and advanced through the orchards west of the city, where they had water and timber but were harried from the walls and gardens. On 27 July they moved to the open plain on the eastern side, where the walls were weaker but there was no water. As Nur al-Din’s army approached and the leaders quarrelled over who should have the city, they gave up the siege on 28 July. The crusade ended in failure and mutual blame, and in 1154 Nur al-Din took Damascus, uniting Muslim Syria against the Franks.
    facts:
      - [Council of Acre, 24 June 1148]
      - [Siege of Damascus, "24–28 July 1148, abandoned"]
    markers:
      - kind: event
        side: cr
        name: Antioch
        date: March 1148
        text: Louis stayed ten days with Prince Raymond. Rumours of an affair between Raymond and Eleanor, probably untrue, helped end Louis’s marriage four years later.
        lonlat: [36.161, 36.203]
      - kind: event
        side: da
        name: Aleppo
        date: "1148"
        text: Nur al-Din, Zengi’s son, ruled here and came south to help Damascus when the crusaders attacked.
        lonlat: [37.16, 36.2]
      - kind: event
        side: cr
        name: Acre
        date: 24 June 1148
        text: The crusade leaders and the barons of Jerusalem met near the city and chose Damascus as their target.
        lonlat: [35.082, 32.928]
        lp: l
      - kind: siege
        side: da
        name: Damascus
        date: 24–28 July 1148
        text: The defenders, reinforced by Turkish troops from the north, fought the crusaders among the orchards. The move to the waterless eastern side made the siege impossible.
        lonlat: [36.309, 33.513]
    arrows:
      - side: cr
        label: Crusaders
        phase: 1
        via: [[35.53, 32.79], [35.69, 33.25], [36.0, 33.45], [36.24, 33.5]]
      - side: da
        label: Nur al-Din
        phase: 2
        via: [[37.16, 36.2], [36.75, 35.1], [36.71, 34.73], [36.4, 33.62]]
