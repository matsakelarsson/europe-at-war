        via: [[29.72, 40.43], [27.3, 39.3], [27.13, 38.42], [27.34, 37.94]]
      - side: cr
        phase: 2
        via: [[27.4, 37.92], [28.6, 37.85], [29.26, 37.76], [30.65, 36.92]]
      - side: cr
