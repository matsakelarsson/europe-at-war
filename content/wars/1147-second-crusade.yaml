steps:
  - title: Edessa and Dorylaeum
    date: 1144–1147
    when: "1147-05"
    borders: "1147-10-25"
    countries: [tr, de, hu, rs, bg]
    body:
      - On 24 December 1144 Zengi, atabeg of Mosul and Aleppo, took Edessa, the first of the crusader states. Pope Eugenius III called a new crusade, and Bernard of Clairvaux preached it with great effect, at Vézelay before Louis VII of France in March 1146 and then in Germany, where King Conrad III took the cross at Christmas. Other crusaders were sent against the Moors in Iberia, where they helped take Lisbon in October 1147, and against the pagan Wends on the Baltic.
      - Conrad left in May 1147 with a large German army, marched through Hungary and the Byzantine Balkans, plundering as he went, and crossed to Asia in September without waiting for the French. The emperor Manuel I, who had just made a truce with the Seljuks of Rum, advised him to keep to the coast road. Instead Conrad struck across the plateau towards Iconium. Near Dorylaeum, on 25 October 1147, short of food and water, his army was attacked by Turkish horse archers and destroyed. Conrad, wounded, led the remnant back to Nicaea.
    facts:
      - [Fall of Edessa, 24 December 1144]
      - [Battle of Dorylaeum, "25 October 1147, Seljuk victory"]
    markers:
      - kind: taken
        side: da
        name: Edessa
        date: 24 December 1144
        text: Zengi stormed the city after a four-week siege while Count Joscelin II was away. Many of its Frankish inhabitants were killed.
        lonlat: [38.79, 37.155]
      - kind: event
        side: cr
        name: Constantinople
        date: September 1147
        text: Conrad’s army camped outside the city, where its plundering strained relations with Manuel, before crossing to Asia.
        lonlat: [28.955, 41.014]
      - kind: battle
        side: tu
        name: Battle of Dorylaeum
        date: 25 October 1147
        text: Fifty years after the First Crusade’s victory on the same ground, the Turks cut down Conrad’s exhausted army as it turned back from the plateau.
        lonlat: [30.517, 39.783]
    arrows:
      - side: cr
        label: Conrad III
        phase: 1
        via: [[29.05, 40.98], [29.72, 40.43], [30.45, 39.82]]
      - side: cr
        phase: 2
        via: [[30.5, 39.75], [30.0, 40.05], [29.75, 40.4]]
  - title: The march to Attaleia
    date: November 1147 – March 1148
    when: "1147-11"
    borders: "1148-03-19"
    countries: [tr]
    body:
      - Louis VII reached Constantinople in October 1147 and crossed to Asia, where he met the survivors of Conrad’s army near Nicaea. The French took the longer road along the coast by way of Pergamon and Smyrna to Ephesus, where Conrad, ill, turned back to Constantinople; he later sailed to the Holy Land. Turning inland up the Meander valley at the end of December, the French beat off Turkish attacks and forced a crossing of the river.
      - On 6 January 1148, as the army crossed Mount Cadmus east of Laodicea, the vanguard pushed on too far, against orders, and the Turks fell on the strung-out column. Louis himself barely escaped, and many were killed. The army reached the Byzantine port of Attaleia in late January, starving. There were not enough ships for everyone, and in March Louis sailed for Antioch with his knights, leaving most of the foot soldiers and pilgrims to march overland. Most of them died or were captured, though some, Odo of Deuil wrote, were fed and helped by the Turks.
    facts:
      - [Battle of Mount Cadmus, "6 January 1148, Seljuk victory"]
      - [Louis VII lands at St Symeon, 19 March 1148]
    markers:
      - kind: event
        side: cr
        name: Ephesus
        date: December 1147
        text: The crusaders spent Christmas near the town, where Conrad left the army and Turkish raiders began to attack the French column.
        lonlat: [27.342, 37.941]
      - kind: battle
        side: tu
        name: Battle of Mount Cadmus
        date: 6 January 1148
        text: The vanguard under Geoffrey of Rancon crossed the mountain and camped beyond it, leaving the baggage and rearguard exposed in the pass.
        lonlat: [29.264, 37.758]
      - kind: event
        name: Attaleia
        date: January–March 1148
        text: The Byzantine port could not feed or ship the whole army. Louis blamed the Greeks for the crusade’s troubles, as French writers long did.
        lonlat: [30.703, 36.887]
    arrows:
