notes:
  - Pope Eugenius III authorised the crusade in the bull Divina dispensatione of 11 April 1147, after Bernard of Clairvaux had urged a fight against the Wends until they were converted or destroyed. The main source is Helmold of Bosau’s Chronicle of the Slavs, written two decades later.
  - At Szczecin Bishop Albert of Pomerania and Duke Ratibor I met the crusaders, and Albert told the crusaders that if they had come to strengthen the faith, they should have done so by preaching, not by arms. Duke Henry the Lion of Saxony and the rival Danish kings Sweyn III and Canute V led the army at Dobin.
