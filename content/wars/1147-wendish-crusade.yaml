id: wendish-crusade
name: Wendish Crusade
start: "1147"
end: "1147"
tier: C
summary: A crusade of Saxon, Danish and Polish princes and bishops against the Slav peoples east of the Elbe, launched alongside the Second Crusade with the same indulgences, after the Saxons asked to fight their pagan neighbours instead of going to the Holy Land. The Obotrite prince Niklot struck first by raiding Wagria; one army besieged his fortress of Dobin and left after a token baptism of its defenders, while another, led by Albert the Bear and the bishops, retook Havelberg, failed before Demmin and turned on Szczecin, which was already Christian. The crusade won few converts, but it opened the way for German settlement east of the Elbe.
