  - title: Ghazni regained and Lahore taken
    date: 1173–1186
    when: "1173"
    borders: "1186"
    countries: [af, pk]
    body:
      - Ala al-Din’s nephew Ghiyath al-Din Muhammad became sultan of Ghor in 1163 and shared power with his younger brother Mu’izz al-Din, better known as Muhammad of Ghor. In 1173 Ghiyath al-Din drove the Oghuz out of Ghazni and installed Mu’izz al-Din there as sultan, and in 1175 the Ghurids took Herat from its Seljuk governor. Ghiyath al-Din ruled the west from Firuzkuh, while Mu’izz al-Din turned east from Ghazni against the remaining Ghaznavid lands and northern India.
      - In 1175 Mu’izz al-Din came down through the Gomal Pass and took Multan and Uch. An expedition across the Thar desert into Gujarat was routed near Mount Abu in 1178, after which he turned on the Ghaznavid Punjab. He took Peshawar in 1179, besieged Lahore in 1181, when Khusrau Malik bought him off and gave his son as a hostage, and took Sialkot in 1185. In 1186 he besieged Lahore again; Khusrau Malik surrendered on a promise of safety, but was taken to Ghor with his sons and imprisoned, and all of them were killed a few years later. The Ghurids now ruled from Herat to the Punjab, and from Lahore Mu’izz al-Din began the campaigns against the Rajput kings of northern India that led, after his death, to the Delhi Sultanate.
    facts:
      - [Ghazni taken from the Oghuz, "1173"]
      - [Multan taken, "1175"]
      - [Lahore taken, "1186; end of the Ghaznavid dynasty"]
