steps:
  - title: The burning of Ghazni
    date: 1148–1152
    when: "1150"
    borders: "1150"
    countries: [af, pk]
    body:
      - The Ghurids were Persian-speaking chiefs of Ghor, a poor and isolated mountain land between Herat and Ghazni, who paid tribute to the Ghaznavid sultans and, after 1117, to the Seljuk sultan Sanjar as well. In the 1140s one of the brothers of the Ghurid ruler Sayf al-Din Suri, Qutb al-Din Muhammad, quarrelled with his family, took refuge at Ghazni and was poisoned there on the orders of the Ghaznavid sultan Bahram Shah. Sayf al-Din marched on Ghazni in 1148 and took it while Bahram fled east, but when Bahram came back in the winter the Ghurid garrison deserted. Sayf al-Din was captured, paraded through the city and executed. His brother Baha al-Din Sam died while gathering an army to avenge him.
      - The next brother, Ala al-Din Husayn, set out in 1150. He beat Bahram’s army at Tiginabad in the Zamindawar district and again twice outside Ghazni, and Bahram fled to his lands in India. For seven days, the chroniclers say, the Ghurids plundered and burned the city, killing many of its people and destroying the palaces, colleges and libraries of the Ghaznavid sultans; the tombs of all but three of them were opened and the remains burned. The great palaces at Bost on the Helmand were also destroyed. Ala al-Din was known ever after as Jahansuz, the “world-burner”.
      - Ala al-Din then stopped paying tribute to Sanjar. In June 1152 the two met at Nab, in the Hari Rud valley near Herat; the Oghuz and other Turkish horsemen in the Ghurid army went over to the Seljuks, and Ala al-Din was defeated and captured. He was released for a ransom about two years later and spent the rest of his reign building up Ghor around his new capital, Firuzkuh. Bahram Shah returned to Ghazni, but in the early 1160s Oghuz bands driven out of Khorasan seized the city, and his son Khusrau Malik ruled what was left of the Ghaznavid state from Lahore.
    facts:
      - [Ghazni sacked, "1150 (or 1151)"]
      - [Battle of Nab, "June 1152, Seljuk victory; Ala al-Din captured"]
      - [Ghaznavid capital, "Lahore from the early 1160s"]
