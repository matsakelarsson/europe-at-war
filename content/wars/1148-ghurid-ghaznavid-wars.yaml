id: ghurid-ghaznavid-wars
name: Ghurid–Ghaznavid wars
start: "1148"
end: "1186"
tier: B
summary: The wars in which the Ghurids, chiefs of the mountain land of Ghor in central Afghanistan, overthrew the Ghaznavid dynasty they had once served. In revenge for the killing of two of his brothers by the Ghaznavid sultan Bahram Shah, Ala al-Din Husayn took Ghazni in 1150 and burned it, earning the name Jahansuz, “world-burner”. After an interval in which Oghuz Turkmen held Ghazni, his nephews Ghiyath al-Din and Mu’izz al-Din took the city in 1173, and from there Mu’izz al-Din conquered the last Ghaznavid lands in the Punjab, taking Lahore and the last sultan, Khusrau Malik, in 1186.
