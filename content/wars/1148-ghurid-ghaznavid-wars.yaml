notes:
  - The chronicles, above all Juzjani’s Tabaqat-i Nasiri, written in Delhi in the 1250s for the Ghurids’ successors, are the main source; dates for the 1140s and 1150s vary by a year or two between them. The sack of Ghazni is dated 1150 or 1151.
  - The Oghuz occupation of Ghazni is dated to the early 1160s; some sources put the final Ghurid capture of the city later than 1173.
