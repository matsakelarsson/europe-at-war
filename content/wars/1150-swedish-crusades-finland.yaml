    body:
      - "Medieval Sweden pushed east across the Baltic. Later chronicles tell of a first crusade to south-western Finland in the 1150s under King Eric and Bishop Henry, though historians doubt how much of the story is true. Raids went both ways: in 1164 Swedes attacked Ladoga, and in 1187 raiders from the eastern Baltic sacked Sigtuna."
      - In July 1240 a Swedish force that sailed up the Neva was beaten by Prince Alexander of Novgorod, who earned the name Nevsky for it. Sweden turned instead to Tavastia in inner Finland. Around 1249–1250 Birger Jarl led an expedition there, defeated the Tavastians and began building a castle, bringing the region under Swedish rule.
    facts:
      - - Battle of the Neva
        - July 1240, Novgorodian victory
      - - Tavastia
        - Under Swedish rule from c. 1249–1250
