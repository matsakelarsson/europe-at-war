notes:
  - The Oghuz who rebelled were Turkmen tribes settled in Khuttal and around Balkh, kin of the Seljuks themselves. Accounts of the size of the armies and of the killings in Merv and Nishapur come from chroniclers writing later and are not reliable as numbers.
