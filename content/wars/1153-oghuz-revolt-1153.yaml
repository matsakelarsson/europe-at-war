id: oghuz-revolt-1153
name: Oghuz revolt and the captivity of Sanjar
start: "1153"
end: "1157-05"
tier: C
summary: In 1153 Oghuz (Ghuzz) Turkmen tribes who grazed their flocks in the uplands around Balkh rose against the Seljuk sultan Ahmad Sanjar, the last ruler of the Great Seljuk Empire, after a quarrel over the tribute of sheep they owed his court and the killing of one of his officials. Sanjar’s governor of Balkh, Qumach, attacked them and was beaten, and when Sanjar marched out with his army in the spring of 1153 he too was defeated near Balkh and taken prisoner. The Oghuz then plundered Khorasan for several years. Merv and Nishapur were largely destroyed and, according to the chroniclers, tens of thousands of people were killed. Sanjar was carried around with the tribes as a captive sultan for two to three years, the sources differ, until he escaped in 1156; he died at Merv in May 1157. His death ended Seljuk rule in the east. Khorasan was divided among his former slave commanders, such as Mu’ayyad Ay-Aba at Nishapur, Oghuz bands held towns such as Ghazni and moved into Kerman, and the Khwarazmshahs and the Ghurids competed for what was left.
