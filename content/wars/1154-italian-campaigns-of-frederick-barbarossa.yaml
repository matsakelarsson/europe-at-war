steps:
  - title: Tortona and the imperial crown
    date: 1154–1155
    when: "1154-10"
    borders: "1155-06-18"
    countries: [it]
    body:
      - Frederick I was elected King of the Romans in 1152 and meant to restore the emperor’s authority in Italy. The cities of Lombardy had grown rich and governed themselves through elected consuls, collecting tolls and dues that had once belonged to the crown. Milan, the largest, dominated its neighbours and had destroyed Lodi in 1111 and Como in 1127. Frederick crossed the Alps in October 1154 with a small army and held a diet at Roncaglia near Piacenza, where Lodi, Pavia and others brought their complaints against Milan.
      - Instead of attacking Milan itself, Frederick besieged its ally Tortona with the help of Pavia, Milan’s rival. The town surrendered in April 1155 after two months and was destroyed. Frederick was crowned King of Italy at Pavia and marched on Rome, where he handed over to the pope Arnold of Brescia, the preacher who had led the Roman commune against papal rule, to be executed. Adrian IV crowned him emperor in St Peter’s on 18 June 1155, while his troops beat off an attack by the Romans. Summer fever thinned his army, and he went home without fighting the Normans of Sicily as he had promised the pope.
    facts:
      - [Diet of Roncaglia, December 1154]
      - [Destruction of Tortona, April 1155]
      - [Imperial coronation, "Rome, 18 June 1155"]
    markers:
      - kind: event
        name: Roncaglia
        date: December 1154
        text: The traditional meeting place of the German kings with the Italian lords and cities, on the Po near Piacenza.
        lonlat: [9.73, 45.05]
        lp: b
      - kind: taken
        side: emp
        name: Tortona
        date: April 1155
        text: Thirst forced the town to surrender after the besiegers poisoned its water supply. Its people were allowed to leave before it was razed; Milan helped rebuild it the next year.
        lonlat: [8.87, 44.89]
      - kind: event
        side: emp
        name: Pavia
        date: April 1155
        text: Frederick was crowned King of Italy in the church of San Michele, in the old Lombard capital.
        lonlat: [9.16, 45.19]
      - kind: event
        side: emp
        name: Rome
        date: 18 June 1155
        text: The Romans attacked the imperial camp on the evening of the coronation and were driven back with heavy losses.
        lonlat: [12.45, 41.9]
    arrows:
      - side: emp
        label: Frederick I, 1154
        via: [[11.4, 46.6], [11.0, 45.55], [10.1, 45.15], [9.78, 45.06]]
      - side: emp
        label: To Rome, 1155
        via: [[9.16, 45.19], [10.1, 44.4], [11.3, 43.3], [12.43, 41.95]]
  - title: Roncaglia and the fall of Milan
    date: 1158–1162
    when: "1158"
    borders: "1162-03"
    countries: [it]
    body:
      - Frederick returned in 1158 with a much larger army, refounded Lodi on a new site and besieged Milan, which surrendered in early September. At a second diet at Roncaglia that November, lawyers from Bologna listed the regalia, the rights of the crown, which Frederick now claimed in full, among them tolls, mints and the appointment of magistrates. Imperial officials were sent to govern the cities, and when they reached Milan early in 1159 the city rose again. That autumn the papal election split, and Frederick backed Victor IV against Alexander III, who had the support of the Lombard cities, Sicily and most of Europe.
      - From July 1159 Frederick besieged Crema, Milan’s ally. Both sides killed prisoners in sight of the walls, and the Germans tied hostages, children among them, to their siege towers. Crema surrendered in January 1160 and was destroyed. The Milanese beat an imperial army at Carcano that August, but Milan was blockaded and its harvests burned, and after a hungry winter it surrendered unconditionally on 1 March 1162. Its people were expelled, and from late March its walls and most of its buildings were pulled down, much of the work done by men from its old rivals Lodi, Cremona, Pavia, Novara and Como.
    facts:
      - [Second Diet of Roncaglia, November 1158]
      - [Siege of Crema, "July 1159 – January 1160"]
      - [Surrender of Milan, 1 March 1162]
    markers:
      - kind: event
        side: emp
        name: Lodi
        date: August 1158
        text: Frederick refounded the town, destroyed by Milan in 1111, on a hill by the Adda a few kilometres from the old site.
        lonlat: [9.5, 45.31]
        lp: b
      - kind: event
        name: Roncaglia
        date: November 1158
        text: Four doctors of law from Bologna advised the emperor on the regalia. Their list became the basis of his demands on the cities.
        lonlat: [9.73, 45.05]
        lp: b
      - kind: taken
        side: emp
        name: Crema
        date: January 1160
        text: The town held out for six months. Its people were allowed to leave with what they could carry, and it was burned and levelled.
        lonlat: [9.69, 45.36]
      - kind: battle
        side: lea
        name: Battle of Carcano
        date: 9 August 1160
        text: The Milanese attacked Frederick while he was besieging the castle of Carcano and drove him off.
        lonlat: [9.23, 45.78]
      - kind: taken
        side: emp
        name: Milan
        date: 1 March 1162
        text: Milan’s leaders submitted to Frederick barefoot at Lodi. The people were moved to four villages outside the city, which was largely demolished.
        lonlat: [9.19, 45.46]
    arrows:
      - side: emp
        label: Frederick I, 1158
        via: [[10.95, 45.45], [10.2, 45.5], [9.3, 45.47]]
  - title: Rome, the plague and the Lombard League
    date: 1163–1168
    when: "1163"
    borders: "1168-03"
    countries: [it]
    body:
      - The imperial officials governed harshly, and resentment spread. In 1164 Verona, Vicenza, Padua and Venice formed the Veronese League, which Frederick, with few troops, could not break. In 1166 he returned with a new army and marched on Rome to install his own pope, besieging Ancona on the way. On 29 May 1167 his commanders Rainald of Dassel and Christian of Mainz routed a much larger Roman army at Monte Porzio near Tusculum, and in July Frederick stormed St Peter’s, held by Alexander III’s supporters. His antipope, Paschal III, crowned him and the empress there.
      - Days later an epidemic swept the imperial army in the August heat, killing Rainald, thousands of soldiers and many princes. Frederick retreated north through a hostile Lombardy. In his absence the cities had united. In 1167, by tradition after an oath at the abbey of Pontida, Milan’s neighbours, Cremona among them, joined the Lombard League, and in April they helped the Milanese return and rebuild their walls. In March 1168 Frederick slipped back over the Alps in disguise, and the League founded a new fortified city on the Tanaro, naming it Alessandria after the pope.
    facts:
      - [Battle of Monte Porzio, "29 May 1167, imperial victory"]
      - [Lombard League, "1167; oath of Pontida by tradition 7 April"]
      - [Alessandria founded, "1168"]
    markers:
      - kind: siege
        name: Ancona
        date: "1167"
        text: The port, which recognised the Byzantine emperor and received his money, was besieged by Frederick and bought him off.
        lonlat: [13.52, 43.62]
      - kind: battle
        side: emp
        name: Battle of Monte Porzio
        date: 29 May 1167
        text: A few hundred German knights scattered the army of the Roman commune, which had attacked Frederick’s ally Tusculum.
        lonlat: [12.72, 41.82]
      - kind: taken
        side: emp
        name: Rome
        date: July 1167
        text: Imperial troops stormed St Peter’s, setting fire to its porch. Alexander III escaped and fled to Benevento.
        lonlat: [12.45, 41.9]
        lp: l
      - kind: event
        side: lea
        name: Pontida
        date: 7 April 1167
        text: By a later tradition, envoys of the cities swore here to stand together against the emperor.
        lonlat: [9.5, 45.73]
      - kind: event
        side: lea
        name: Milan
        date: 27 April 1167
        text: Troops of the League brought the Milanese back to their ruined city and helped them rebuild its defences.
        lonlat: [9.19, 45.46]
        lp: l
      - kind: event
        side: lea
        name: Alessandria
        date: "1168"
        text: The League’s new city guarded the routes between Pavia, Montferrat and Genoa, imperial strongholds and allies.
        lonlat: [8.62, 44.91]
    arrows:
      - side: emp
        label: Frederick I, 1166–67
        via: [[10.3, 45.2], [12.0, 44.3], [13.45, 43.6], [12.5, 41.94]]
      - side: emp
        label: Retreat, 1167–68
        via: [[12.4, 41.95], [10.6, 43.9], [9.3, 45.05], [7.05, 45.14]]
  - title: Alessandria and Legnano
    date: 1174–1176
    when: "1174-09"
    borders: "1176-05-29"
    countries: [it]
    body:
      - Frederick’s fifth expedition crossed the Mont Cenis pass in September 1174 and burned Susa, whose townspeople had nearly captured him in 1168. He besieged Alessandria through the winter, but the new city, defended by earthen ramparts, held out, and in April 1175 a League army came to relieve it. At Montebello the two sides agreed preliminaries of peace, which broke down over Alessandria and the pope. Frederick sent to Germany for reinforcements; his cousin Henry the Lion, Duke of Saxony and Bavaria, refused to come.
      - In May 1176 Frederick met new troops from Germany at Como and set out for Pavia. On 29 May, between Legnano and Borsano, his knights scattered the League’s cavalry and charged the Milanese foot soldiers gathered round the carroccio, the sacred ox-drawn cart that carried the city’s standard. The infantry held until the League’s horsemen, reinforced from Brescia, came back and struck the imperial flank. Frederick’s army broke; he was unhorsed and believed dead, and reached Pavia only days later. Legnano showed that he could not win the war by force.
    facts:
      - [Siege of Alessandria, "October 1174 – April 1175"]
      - [Preliminaries of Montebello, 16 April 1175]
      - [Battle of Legnano, "29 May 1176, Lombard League victory"]
    markers:
      - kind: taken
        side: emp
        name: Susa
        date: September 1174
        text: The town at the foot of the Mont Cenis road was burned in revenge for 1168.
        lonlat: [7.05, 45.14]
      - kind: held
        side: lea
        name: Alessandria
        date: October 1174 – April 1175
        text: Frederick tried to take the city by a tunnel and by assault, and failed. Its enemies mocked it as a city of straw, after its thatched roofs.
        lonlat: [8.62, 44.91]
      - kind: treaty
        name: Montebello
        date: 16 April 1175
        text: The preliminaries agreed here between the emperor and the League were never turned into a peace.
        lonlat: [9.1, 45.0]
      - kind: event
        name: Chiavenna
        date: early 1176
        text: By tradition Frederick met Henry the Lion here and asked in vain for his help. Henry’s refusal led to his fall in 1180.
        lonlat: [9.4, 46.32]
      - kind: battle
        side: lea
        name: Battle of Legnano
        date: 29 May 1176
        text: The imperial army lost its camp and baggage, and the Milanese captured Frederick’s shield, banner and lance.
        lonlat: [8.9, 45.61]
    arrows:
      - side: emp
        label: Frederick I, 1174
        via: [[6.9, 45.25], [7.6, 45.07], [8.3, 44.95], [8.58, 44.92]]
      - side: emp
        label: German reinforcements
        via: [[8.95, 46.5], [9.08, 46.0], [9.0, 45.68]]
      - side: lea
        label: League army
        via: [[9.19, 45.46], [9.03, 45.55], [8.93, 45.6]]
  - title: Venice and Constance
    date: 1177–1183
    when: "1177"
    borders: "1183-06-25"
    countries: [it, de]
    body:
      - Frederick now made peace with the pope, his main opponent, partly at the cities’ expense. After preliminary talks at Anagni in November 1176 the parties met in Venice. On 24 July 1177 Frederick, freed from excommunication, knelt before Alexander III at the door of St Mark’s, and on 1 August the peace was sworn. Frederick recognised Alexander and abandoned his own antipope, and he agreed a fifteen-year truce with William II of Sicily and a six-year truce with the Lombard League.
      - The truce gave time for a lasting settlement. In the Peace of Constance, sealed on 25 June 1183, Frederick granted the League’s cities the regalia within their walls and many outside them, and the right to fortify, to keep their league and to elect their own consuls, who would be invested by the emperor. The cities swore fealty, paid a sum of money and owed the emperor supplies when he came to Italy. Alessandria was refounded as Caesarea, the emperor’s city. The communes stayed in the Empire but governed themselves, and in 1186 Frederick’s son Henry married Constance, heiress to the Kingdom of Sicily, in Milan.
    facts:
      - [Peace of Venice, 1 August 1177]
      - [Peace of Constance, 25 June 1183]
    markers:
      - kind: treaty
        name: Anagni
        date: November 1176
        text: Envoys of Frederick and Alexander III agreed the outline of a peace in the pope’s home town.
        lonlat: [13.16, 41.74]
      - kind: treaty
        name: Venice
        date: 24 July – 1 August 1177
        text: The neutral city hosted the reconciliation of emperor and pope, which ended an eighteen-year schism.
        lonlat: [12.34, 45.43]
      - kind: treaty
        side: lea
        name: Constance
        date: 25 June 1183
        text: The peace was sealed at a diet in the city on Lake Constance. Later generations of Italian communes saw it as the charter of their liberties.
        lonlat: [9.17, 47.66]
      - kind: event
        side: emp
        name: Milan
        date: 27 January 1186
        text: The wedding of Henry and Constance in the rebuilt city prepared the union of the Empire and Sicily, which the papacy had long feared.
        lonlat: [9.19, 45.46]
