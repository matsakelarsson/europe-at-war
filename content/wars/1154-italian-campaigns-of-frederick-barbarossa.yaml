id: italian-campaigns-of-frederick-barbarossa
name: Italian campaigns of Frederick Barbarossa
start: "1154-10"
end: "1183-06-25"
tier: A
summary: The emperor Frederick I’s attempts to restore imperial rights over the self-governing cities of northern Italy. He destroyed Tortona, Crema and Milan, but the Lombard League, formed in 1167 with the backing of Pope Alexander III, defeated him at Legnano in 1176; he made peace with the pope at Venice in 1177 and recognised the cities’ self-government in the Peace of Constance in 1183.
countries: [it, de]
sides:
  - id: emp
    name: Frederick I and his allies
    polities: [hre]
    ink: gold
    moves: Imperial moves
    success: Imperial success
  - id: lea
    name: Milan and the Lombard League
    polities: [venice]
    ink: red
    moves: Moves by Milan and the League
    success: Success for Milan and the League
  - id: pap
    name: Pope Alexander III and Sicily
    polities: [papal-states, sicily]
    ink: navy
    moves: Papal and Sicilian moves
    success: Papal and Sicilian success
notes:
  - Frederick, called Barbarossa (“red beard”) by the Italians, led six expeditions to Italy, in 1154–1155, 1158–1162, 1163–1164, 1166–1168, 1174–1178 and 1184–1186. The third and the sixth saw little fighting.
  - The cities never stood together as a whole. Pavia, and until 1167 Cremona and Lodi, fought on Frederick’s side against Milan, and the League itself was an alliance of old rivals.
  - On the map the cities of the League remain part of the Holy Roman Empire, as they did under the Peace of Constance.
