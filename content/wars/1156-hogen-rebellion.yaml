notes:
  - The war tale Hōgen monogatari, written in the following century, dramatises the fighting, especially the archery of Minamoto no Tametomo; the courtiers’ diaries and the Gukanshō of the monk Jien give the sober outline. Jien saw the rebellion as the beginning of the “age of warriors”. Day dates are the Julian equivalents of the Japanese lunar dates.
