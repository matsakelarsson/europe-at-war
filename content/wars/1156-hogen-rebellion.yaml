id: hogen-rebellion
name: Hōgen rebellion
start: "1156-07-28"
end: "1156-08-16"
tier: C
summary: "A short clash in Heian-kyō (Kyoto) over the imperial succession and the leadership of the Fujiwara regents’ house, in which warrior bands decided a dispute at court for the first time. When the retired emperor Toba died in the seventh month of 1156, his son the retired emperor Sutoku, whose line had been passed over in favour of his half-brother Go-Shirakawa, joined forces with the Minister of the Left Fujiwara no Yorinaga, who had lost out to his brother, the regent Fujiwara no Tadamichi. Both sides called in warriors, splitting families: Minamoto no Tameyoshi, his son Tametomo and Taira no Tadamasa joined Sutoku, while Tameyoshi’s eldest son Minamoto no Yoshitomo and Tadamasa’s nephew Taira no Kiyomori sided with Go-Shirakawa. Before dawn on 29 July 1156 (the eleventh day of the seventh month) Kiyomori and Yoshitomo attacked Sutoku’s headquarters at the Shirakawa palace with about 600 horsemen and set it on fire. Yorinaga died of an arrow wound; Sutoku was exiled to Sanuki on Shikoku, where he died in 1164; Tameyoshi and Tadamasa were beheaded, the first executions ordered by the court since 810, and Tametomo was exiled to Izu Ōshima. The victory made Kiyomori and Yoshitomo powers at court, and their rivalry led to the Heiji rebellion three years later."
