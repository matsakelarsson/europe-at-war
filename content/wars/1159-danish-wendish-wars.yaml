id: danish-wendish-wars
name: Danish–Wendish wars
start: "1159"
end: "1185"
tier: B
summary: A series of Danish seaborne campaigns under King Valdemar I and Bishop Absalon against the Slavic Wends of the southern Baltic coast, who had raided Denmark for decades. The Danes conquered and converted the island of Rügen in 1168 and in 1185 made the Duke of Pomerania a vassal of the Danish king.
countries: [dk, de, pl]
sides:
  - id: dk
    name: Denmark
    polities: [denmark]
    ink: red
    moves: Danish moves
    success: Danish success
  - id: wend
    name: Wends and Pomerania
    polities: [wends, pomerania]
    ink: olive
    moves: Wendish and Pomeranian moves
    success: Wendish and Pomeranian success
notes:
  - Almost everything known about these wars comes from Saxo Grammaticus’s Gesta Danorum, written for Absalon, which celebrates his deeds. Dates and numbers are often uncertain; the fall of Arkona is usually dated 1168, but some historians argue for 1169.
  - Contemporaries saw the campaigns against the pagan Rani as crusades, like the German Wendish Crusade of 1147, though the Pomeranian dukes were already Christian.
