        atoms: [DE-MV~pomN]
  - title: Pomerania submits
    date: 1170–1185
    when: "1184"
    borders: "1185"
    countries: [dk, de, pl]
    body:
      - The Danes now turned on the Christian dukes of Pomerania, whose lands at the mouth of the Oder were also bases for raiders. In 1170 they destroyed a stronghold at Dziwnów and fought their way past a Pomeranian army and fleet at the bridge of Wolin. In 1177 the dukes bought peace with heavy tribute. Valdemar also built a great castle at Vordingborg as a base for further raids.
      - After Valdemar’s death in 1182 his son Canute VI refused to do homage to the emperor Frederick Barbarossa, who had made Duke Bogislaw I of Pomerania an imperial prince. In 1184 Bogislaw attacked Rügen on the emperor’s behalf, but Absalon, now archbishop of Lund, destroyed the Pomeranian fleet off the coast near Stralsund at Whitsun. Danish raids followed, and in 1185 Bogislaw submitted and took his duchy as a fief from Canute VI.
    facts:
      - [Peace of 1177, "Pomerania pays tribute to Denmark"]
      - [Naval battle off Rügen, "Whitsun 1184, Danish victory"]
      - [Bogislaw I submits, "1185"]
    markers:
      - kind: taken
        side: dk
        name: Dziwnów
        date: "1170"
        text: The Danes destroyed this stronghold on the island of Wolin, a base for raids across the Baltic.
        lonlat: [14.75, 54.017]
      - kind: battle
        side: dk
        name: Bridge of Wolin
        date: "1170"
        text: Duke Casimir of Pomerania tried to trap the Danish fleet at the bridge by the town of Wolin, but the Danes forced their way through.
        lonlat: [14.5, 53.917]
        lp: l
      - kind: naval
        side: dk
        name: Naval battle off Rügen
        date: Whitsun 1184
        text: Absalon’s fleet surprised and destroyed the Pomeranian ships that had attacked Prince Jaromar of Rügen.
        lonlat: [13.4, 54.2]
      - kind: event
        side: dk
        name: Vordingborg
        date: "1175"
        text: King Valdemar’s new castle on the Zealand coast guarded the Danish islands and served as a base for raids on the German coast.
        lonlat: [11.9, 55.0]
        lp: l
