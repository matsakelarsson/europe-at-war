steps:
  - title: The fall of Arkona
    date: 1159–1169
    when: "1168"
    borders: "1168"
    countries: [dk, de]
    body:
      - During Denmark’s civil wars of the 1140s and 1150s, Wendish fleets from Rügen and the Pomeranian coast raided the Danish islands almost at will, and by one account a third of the kingdom lay waste when Valdemar I became sole king in 1157. With his foster brother Absalon, bishop of Roskilde from 1158, Valdemar struck back. From 1159 Danish fleets sailed against the Wendish coast almost every year, burning settlements and taking captives, at times in alliance with Duke Henry the Lion of Saxony and at times in rivalry with him.
      - The main target was Rügen, home of the pagan Rani and their temple of Svantevit at Arkona. In 1168 Valdemar and Absalon, with Pomeranian allies, took the temple fortress after a siege of only a few days. The great four-headed idol was chopped up and burned. The other strongholds of the island then surrendered, its people were baptised, and their prince, Jaromar, became Valdemar’s vassal. To guard Zealand against raids, Absalon built a castle at Havn, the beginning of Copenhagen.
    facts:
      - [Leaders, "Valdemar I and Bishop Absalon"]
      - [Fall of Arkona, "1168, after a siege of eight days according to Saxo"]
      - [Outcome, "Rügen a Danish vassal principality until 1325"]
    markers:
      - kind: siege
        side: dk
        name: Arkona
        date: "1168"
        text: A fire under one of the towers distracted the defenders, and the Danes stormed the gate. The temple was plundered and destroyed.
        lonlat: [13.438, 54.676]
      - kind: taken
        side: dk
        name: Charenza (Garz)
        date: "1168"
        text: Rügen’s main stronghold surrendered without a fight. Absalon had the seven-headed idol of Rugievit cut down and burned.
        lonlat: [13.35, 54.32]
        lp: l
      - kind: event
        side: dk
        name: Havn
        date: "1167"
        text: Absalon’s castle on a small island in the harbour of Havn protected the Sound against Wendish raiders. The town grew into Copenhagen.
        lonlat: [12.58, 55.676]
      - kind: event
        side: dk
        name: Roskilde
        date: From 1158
        text: Seat of Absalon, who led most of the expeditions in person as bishop and commander of the fleet.
        lonlat: [12.083, 55.65]
        lp: l
    arrows:
      - side: dk
        label: Valdemar and Absalon
        via: [[12.1, 55.0], [12.9, 54.85], [13.4, 54.7]]
    areas:
