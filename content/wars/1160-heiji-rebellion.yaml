id: heiji-rebellion
name: Heiji rebellion
start: "1160-01-19"
end: "1160-02-05"
tier: C
summary: "A coup and counter-coup in Heian-kyō (Kyoto) that left Taira no Kiyomori the dominant power at court and nearly destroyed the Minamoto. After the Hōgen rebellion, the retired emperor Go-Shirakawa’s adviser Fujiwara no Michinori (Shinzei) favoured Kiyomori, while his rival Fujiwara no Nobuyori found an ally in Minamoto no Yoshitomo, who resented the execution of his father in 1156 and the rewards given to the Taira. When Kiyomori left the capital on a pilgrimage to Kumano, Nobuyori and Yoshitomo struck on the night of 19 January 1160 (the ninth day of the twelfth month of Heiji 1, which began in 1159): they burned Go-Shirakawa’s Sanjō palace, held him and the young emperor Nijō in the imperial palace, and hunted down Shinzei, who was killed. Kiyomori hurried back, the emperor and the retired emperor escaped to his Rokuhara mansion, and on 5 February his son Shigemori lured the Minamoto out of the palace and defeated them at Rokuhara. Nobuyori was executed; Yoshitomo fled east and was murdered by a retainer in Owari, and his eldest sons were killed, but Kiyomori spared the twelve-year-old Yoritomo, who was exiled to Izu, and the infant Yoshitsune. Kiyomori rose to be chancellor in 1167, and the Minamoto rising of 1180 began the Genpei War."
