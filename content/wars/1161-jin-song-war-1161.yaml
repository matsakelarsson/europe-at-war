id: jin-song-war-1161
name: Jin–Song war of 1161–1165
start: "1161-10"
end: "1165"
tier: B
summary: "The war begun by the Jin emperor Wanyan Liang (Prince of Hailing), who broke the peace of Shaoxing to conquer the Southern Song. In the autumn of 1161 he led a huge army from Kaifeng to the Huai and the Yangtze and sent a fleet by sea against the Song capital Lin’an. The fleet was destroyed off the Shandong coast at Tangdao on 16 November, and on 26–27 November a Song force under the official Yu Yunwen, with paddle-wheel warships throwing gunpowder bombs, threw back the Jin attempt to cross the Yangtze at Caishi. While Wanyan Liang prepared a new crossing near Yangzhou, his cousin Wanyan Yong had been proclaimed emperor (Shizong) at Liaoyang, and on 15 December Wanyan Liang was killed by his own officers. The new Song emperor Xiaozong tried to reconquer the north in 1163, but his armies were routed at Fuli. The peace of Longxing (1164–1165) kept the Huai border, turned the Song emperor from a vassal into a “nephew” of the Jin emperor and cut the yearly payments; it held until 1206."
