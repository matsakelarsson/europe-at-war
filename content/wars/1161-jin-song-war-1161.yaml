  - title: Fuli and the peace of Longxing
    date: 1162–1165
    when: "1163-06"
    borders: "1165-01"
    countries: [cn]
    body:
      - The Song emperor Gaozong abdicated in 1162 in favour of his adopted son Xiaozong, who wanted to recover the north. In 1163 the veteran Zhang Jun planned an offensive across the Huai with about 130,000 men. Its two columns under Li Xianzhong and Shao Hongyuan took Lingbi, Hongxian and Suzhou in June, but the generals quarrelled, and when a Jin army under Heshilie Zhining counter-attacked, the Song army broke at Fuli. In Shaanxi Wu Lin had already been ordered to give up the prefectures he had taken in 1161–1162.
      - In 1164 Jin armies crossed the Huai and raided towards the Yangtze, and both courts turned to talks. The peace, agreed in the last month of 1164 and called after the Song reign period Longxing (or after Qiandao, the next), kept the border of 1142. The Song emperor no longer called himself a vassal but addressed the Jin emperor as his uncle; the yearly payments, now called “annual coins” rather than tribute, were cut to 200,000 taels of silver and 200,000 bolts of silk; and the Song handed back the prefectures they had taken during the war. The peace lasted forty years, the most stable period in the relations of the two states.
