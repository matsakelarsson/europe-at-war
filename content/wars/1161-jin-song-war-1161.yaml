steps:
  - title: Tangdao and Caishi
    date: October – December 1161
    when: "1161-11-26"
    borders: "1161-11-26"
    countries: [cn]
    body:
      - Wanyan Liang, who had seized the Jin throne in 1150 and moved the main capital to Zhongdu (Beijing), meant to unite all China under his rule. He moved his court to Kaifeng in 1161, raised soldiers among Jurchens, Khitans and Chinese alike, and built a fleet. The levies stirred revolts behind him, among them a large Khitan rising in the north-west. On 15 October 1161 his army left Kaifeng, and on 28 October it reached the Huai. The Song armies of the Huai region fell back to the Yangtze, while in the west Wu Lin advanced into Jin-held Shaanxi.
      - A Jin fleet of about 600 ships was to sail down the coast and strike at Lin’an. On 16 November a Song squadron of some 120 ships under Li Bao surprised it at anchor off Tangdao, near today’s Qingdao, and burned most of it with fire arrows and gunpowder weapons; the Jin admiral drowned. Ten days later, on 26 November, Wanyan Liang’s army began crossing the Yangtze at Caishi, south-west of Jiankang. Yu Yunwen, a civil official sent to the front, had rallied about 18,000 leaderless soldiers and a fleet that included paddle-wheel warships. Hidden behind an island, the Song ships fell on the Jin boats, throwing “thunderclap” bombs of gunpowder and lime with trebuchets, and the Jin troops who reached the south bank were destroyed. A second attempt the next day failed too.
      - Wanyan Liang burned his remaining boats and marched downstream to Yangzhou to cross at Guazhou instead. But in his absence his cousin Wanyan Yong, the governor at Liaoyang, had been proclaimed emperor on 27 October, and the army in the south had had enough. On 15 December 1161 Wanyan Liang was killed in his camp near Yangzhou by his own officers, who then withdrew the army. He was later demoted posthumously to Prince of Hailing.
    facts:
