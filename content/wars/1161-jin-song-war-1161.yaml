notes:
  - Dates are given as the sources give them, converted from the Chinese calendar to the Julian calendar.
  - "The size of Wanyan Liang’s army is uncertain. Song sources speak of 600,000 men, a figure that may count everyone mobilised before the Huai crossing; the force at Caishi itself is put at 40,000 or more in some modern accounts. Jin losses at Caishi are given as anything from a few thousand to 24,000."
