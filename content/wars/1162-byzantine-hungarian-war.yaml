id: byzantine-hungarian-war
name: Byzantine–Hungarian war of 1162–1167
start: "1162"
end: "1167-07-08"
tier: B
summary: A war between the Byzantine emperor Manuel I Komnenos and King Stephen III of Hungary over the succession to the Hungarian throne and over Sirmium, Dalmatia and Bosnia, which Manuel claimed as the inheritance of Stephen’s brother Béla, then living in Constantinople as Manuel’s heir. It ended with a Byzantine victory at Sirmium in 1167 and a peace that left these lands to the empire until Manuel’s death in 1180.
