steps:
  - title: Sirmium
    date: 1162–1167
    when: "1162"
    borders: "1167-07-08"
    countries: [hu, rs, hr, ba]
    body:
      - When Géza II of Hungary died in 1162, Manuel I backed the claims of Géza’s brothers against his young son Stephen III, whose supporters drove them out. In 1163 the two sides made a deal. Stephen’s younger brother Béla went to Constantinople, where he was betrothed to Manuel’s daughter, renamed Alexios and made heir to the empire, and his inheritance of Croatia, Dalmatia and Sirmium (Srem) was to pass with him. Stephen would not give it up, and for four years Byzantine and Hungarian armies fought over Sirmium, Zemun and the Dalmatian towns, which changed hands several times.
      - In 1167 Manuel sent a large army under his nephew Andronikos Kontostephanos. On 8 July 1167, near Zemun in the region of Sirmium, it met the Hungarian army under Dénes, count of Bács, and routed it. Hungary made peace and accepted Byzantine rule over Sirmium, Bosnia and most of Dalmatia. The gains did not last. When Manuel’s own son was born, Béla lost his place as heir, and he became king of Hungary in 1172 with Byzantine support. After Manuel died in 1180, Béla III took Sirmium and Dalmatia back.
