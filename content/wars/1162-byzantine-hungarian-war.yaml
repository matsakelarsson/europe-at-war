notes:
  - The fullest accounts are by the Byzantine historians John Kinnamos and Niketas Choniates; Hungarian sources say little. The fighting of 1162–1167 is sometimes treated as several short wars.
  - Croatia had been in union with the Hungarian crown since 1102 and is shown on the map as a separate kingdom. The Dalmatian towns were contested between Hungary, Venice and Byzantium throughout the 12th century.
