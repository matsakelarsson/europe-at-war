steps:
  - title: Diarmait’s allies take the east
    date: 1169–1171
    when: "1169-05-01"
    borders: "1171-09"
    countries: [ie, gb]
    body:
      - In 1166 Diarmait Mac Murchada, king of Leinster, was driven out by a coalition led by the high king, Ruaidrí Ua Conchobair of Connacht, and Tigernán Ua Ruairc of Bréifne, whose wife Diarmait had carried off years before. Diarmait went to Henry II, who let him recruit among his subjects. In south Wales he found Norman lords ready to fight for land, chief among them Richard de Clare, earl of Pembroke, known as Strongbow, to whom he promised his daughter Aífe and the succession to Leinster. On 1 May 1169 Robert FitzStephen landed at Bannow Bay with some 40 knights, 60 men-at-arms and 360 archers, and the Norse-Irish town of Wexford surrendered after two days.
      - In May 1170 Raymond FitzGerald dug in on the headland of Baginbun and routed a much larger force from Waterford. Strongbow landed nearby on 23 August with about 200 knights and 1,000 other soldiers, stormed Waterford and married Aífe in the town. On 21 September, while Diarmait was negotiating with Dublin’s Norse king, Ascall mac Ragnaill, Norman knights broke in and took the city. Diarmait died in May 1171, and Strongbow claimed Leinster, against Irish custom. Ascall returned with a Norse fleet and was beaten and executed. Then Ruaidrí besieged Dublin with an army from most of Ireland for two months, until a sortie routed his camp at Castleknock.
