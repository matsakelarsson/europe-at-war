        side: nor
        name: Waterford
        date: 17 October 1171
        text: Henry’s fleet brought siege towers in case the Norman towns resisted him. The king of Desmond came to submit here.
        lonlat: [-7.11, 52.259]
      - kind: event
        side: nor
        name: Cashel
        date: Winter 1171–1172
        text: The Irish bishops met in synod, acknowledged Henry as their lord and agreed to bring church practice into line with England.
        lonlat: [-7.885, 52.516]
      - kind: event
        side: nor
        name: Dublin
        date: Winter 1171–1172
        text: Henry spent the winter in the city, where the kings of Leinster, Meath, Bréifne, Airgialla and Ulaid came to submit. He gave Dublin to the men of Bristol to settle.
        lonlat: [-6.27, 53.347]
      - kind: battle
        side: iri
        name: Battle of Thurles
        date: "1174"
        text: Domnall Ua Briain, king of Thomond, defeated a large part of Strongbow’s army on its way to Limerick, forcing him to turn back.
        lonlat: [-7.8, 52.68]
      - kind: taken
        side: iri
        name: Trim
        date: "1174"
        text: Ruaidrí’s army destroyed Hugh de Lacy’s new castle, the centre of the lordship of Meath. It was rebuilt the next year.
        lonlat: [-6.79, 53.555]
