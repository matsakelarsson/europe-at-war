  - title: Henry II and the Treaty of Windsor
    date: 1171–1175
    when: "1171-10-17"
    borders: "1175-10-06"
    countries: [ie, gb]
    body:
      - Henry feared that Strongbow would make himself an independent king across the Irish Sea, and came himself. On 17 October 1171 he landed near Waterford with at least 500 knights and 4,000 men-at-arms and archers, the first reigning king of England to set foot in Ireland. Strongbow did homage and kept Leinster as a fief, while Henry kept Dublin, Wexford and Waterford for the crown. Many Irish kings submitted to him at Waterford and Dublin, probably hoping he would restrain the barons; Ruaidrí did not. A synod at Cashel brought the Irish church into line with English practice. Henry granted Meath, still unconquered, to Hugh de Lacy, and sailed home in April 1172.
      - The barons kept pushing outwards. De Lacy’s men killed Tigernán Ua Ruairc at a parley in 1172, and Strongbow raided Offaly. When many Normans left in 1173 to fight in the great revolt against Henry, the Irish struck back. In 1174 Domnall Ua Briain of Thomond beat Strongbow’s army at Thurles, the townsmen of Waterford killed its garrison, and Ruaidrí’s army destroyed the castles at Trim and Duleek and marched on Dublin before reinforcements arrived. By the Treaty of Windsor of 6 October 1175 Henry kept Dublin, Meath, Leinster and Waterford to Dungarvan, while Ruaidrí ruled the rest as his vassal and paid a tribute in hides. It soon broke down as the barons pushed on.
    facts:
      - [Henry lands, "17 October 1171, near Waterford"]
      - [Battle of Thurles, "1174, Irish victory"]
      - [Treaty of Windsor, "6 October 1175"]
    markers:
