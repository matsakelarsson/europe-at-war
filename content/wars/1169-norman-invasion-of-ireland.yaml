id: norman-invasion-of-ireland
name: Norman invasion of Ireland
start: "1169-05-01"
end: "1175-10-06"
tier: B
summary: The arrival of Cambro-Norman knights in Ireland, invited in 1169 by Diarmait Mac Murchada, the exiled king of Leinster. They took Wexford, Waterford and Dublin, and their leader Strongbow claimed Leinster; in 1171 King Henry II came himself and received the submission of the Normans and of many Irish kings. The Treaty of Windsor of 1175 left Henry lord of the conquered east and the high king Ruaidrí Ua Conchobair overlord of the rest under him, the start of English rule in Ireland.
countries: [ie, gb]
sides:
  - id: nor
    name: Cambro-Normans and Henry II
    polities: [ireland, england]
    ink: red
    moves: Norman moves
    success: Norman success
  - id: iri
    name: Irish and Norse-Irish
    polities: [irish-lordships, dublin]
    ink: brown
    moves: Irish moves
    success: Irish success
notes:
  - The invaders are often called Anglo-Normans; many came from the Norman lordships of south Wales and had Welsh and Flemish soldiers with them, so historians also call them Cambro-Normans. The main accounts are Gerald of Wales’s Expugnatio Hibernica, written by a relative of several of the leaders, the Old French Song of Dermot and the Earl, and the Irish annals.
  - Henry claimed papal backing from the bull Laudabiliter, said to have been issued by Pope Adrian IV in about 1155; its authenticity has long been debated, but Pope Alexander III endorsed Henry’s lordship in 1172.
