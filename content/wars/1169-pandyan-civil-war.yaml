notes:
  - The war is known from the Sinhalese chronicle Culavamsa and from Chola inscriptions, each of which tells it as a victory for its own side. Their chronologies are hard to reconcile, and historians differ on the dates, on the order of events and on how Kulasekhara died; some give the war’s span as about 1166–1182.
