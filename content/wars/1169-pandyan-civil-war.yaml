id: pandyan-civil-war
name: Pandyan civil war
start: "1169"
end: "1177"
tier: C
summary: "A war of succession in the Pandya kingdom of Madurai that drew in the two great powers of the south, the Sinhalese kingdom of Polonnaruwa and the Chola Empire. In 1169 Kulasekhara Pandya besieged Madurai, and the reigning king, Parakrama Pandya, appealed to Parakramabahu I of Polonnaruwa but was killed before help came. A Sinhalese army under the general Lankapura Dandanatha landed at Rameswaram, joined Parakrama’s son Vira Pandya and took Madurai, and Kulasekhara turned to the Chola king Rajadhiraja II. Chola armies under the generals Tiruchirrambalamudaiyan Perumanambi and Annan Pallavarayan defeated the Sinhalese, set up the heads of Lankapura and other commanders on the gates of Madurai in about 1174, and raided northern Sri Lanka. The alliances then shifted. Parakramabahu won Kulasekhara over, the Cholas drove him out and put Vira Pandya on the throne as their client, and fighting went on into the late 1170s, with Sinhalese and Pandya forces holding Rameswaram until 1182. The Cholas came out on top, but the war revived the Pandyas, who within a century overshadowed both their former patrons."
