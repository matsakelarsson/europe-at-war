notes:
  - Dates are lunar months from the Goryeosa, which was written under the following dynasty and is hostile to the military officers.
  - The three risings were separate. Kim Bo-dang and Jo Wi-chong were officials who opposed the coup; Mangi and Mangsoi led people of a so, a settlement whose inhabitants owed special labour and had lower status than ordinary commoners.
