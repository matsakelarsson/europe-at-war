id: goryeo-military-coup
name: Military coup of 1170 and the risings against it
start: "1170-08"
end: "1177-07"
tier: C
summary: "The seizure of power by Goryeo’s military officers and the risings that followed. Under King Uijong, military officers were kept below civil officials in rank and treated with contempt. In the eighth month of 1170, during a royal outing to the Bohyeonwon hostel near Kaegyong, the generals Jeong Jung-bu, Yi Ui-bang and Yi Go had the guards kill the civil officials and eunuchs in the king’s party; more than fifty officials were killed in the capital. Uijong was exiled to Geoje and his brother was made king as Myeongjong. In the eighth month of 1173 Kim Bo-dang, a civil official commanding the north-eastern frontier, rose to restore Uijong; his allies brought the former king from Geoje to Gyeongju, but they were defeated, Kim Bo-dang was executed, and in the tenth month Yi Ui-min killed Uijong at Gyeongju. Many more civil officials were killed in reprisal. In the ninth month of 1174 Jo Wi-chong, governor of the Western Capital (Pyongyang), rose with more than forty towns of the north-west; his army reached Kaegyong but was driven back, and Seogyeong held out until the sixth month of 1176, when it fell and he was killed. Meanwhile, in the first month of 1176, Mangi and Mangsoi led the people of Myeonghak-so, a settlement of bound craftsmen in Gongju (today in Daejeon), in a rising that took Gongju; the court raised Myeonghak-so to a county to win them over, but they rose again in 1177 and surrendered in the sixth month. The officers kept power, under a succession of military strongmen, for a century."
countries: [kp, kr]
