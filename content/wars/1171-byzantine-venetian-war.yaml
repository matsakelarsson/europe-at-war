id: byzantine-venetian-war
name: Byzantine–Venetian war of 1171
start: "1171-03-12"
end: "1172"
tier: C
summary: On 12 March 1171 the emperor Manuel I Komnenos had all the Venetians in the Byzantine Empire arrested and their ships and goods seized, after Venetians had attacked the Genoese quarter in Constantinople. Venice sent a large fleet under Doge Vitale II Michiel, which attacked Byzantine towns on Euboea and wintered on Chios, but while the doge negotiated, plague broke out in the fleet and it returned home in 1172. The doge was murdered in Venice soon after. Relations were restored only in the 1180s, and the grievance was remembered when the Fourth Crusade turned on Constantinople.
