notes:
  - Mu’izz al-Din Muhammad ibn Sam was called Shihab al-Din before 1173. Modern writers call him Muhammad of Ghor or Muhammad Ghori. Prithviraj III of the Chahamana (Chauhan) dynasty is better known as Prithviraj Chauhan.
  - The main sources are Persian works written at Delhi for the conquerors’ successors, above all Hasan Nizami’s Taj al-Ma’athir and Minhaj-i-Siraj Juzjani’s Tabaqat-i Nasiri (about 1260), with later histories such as Firishta’s (about 1600). On the Indian side there are inscriptions, Jain chronicles and Sanskrit poems such as the Prithviraja Vijaya. The Prithviraj Raso, a bardic epic that grew over later centuries, is legend rather than history. Dates vary by a year or so between the sources, and figures for armies, the dead and captives are the chroniclers’ claims.
  - The Punjab campaigns of 1175–1186 against the last Ghaznavids are told more fully under the Ghurid–Ghaznavid wars, and the conquest of Bihar and Bengal under Bakhtiyar Khalji’s campaigns.
