id: ghurid-campaigns-in-india
name: Ghurid campaigns in India
start: "1175"
end: "1206-03-15"
tier: A
summary: "The conquest of northern India by Mu’izz al-Din Muhammad of Ghor, known as Muhammad Ghori, and his commanders. From Ghazni he took Multan and Uch in 1175, was defeated by the Chaulukyas of Gujarat at Kasahrada in 1178 and took the last Ghaznavid lands in the Punjab by 1186. Beaten by the Chahamana king Prithviraj III at the first battle of Tarain in 1191, he returned the next year and destroyed Prithviraj’s army on the same field. His slave commander Qutb al-Din Aibak then took Delhi, the Gahadavala king Jayachandra was killed at Chandawar in 1194, and Gwalior, Anhilwara, Kalinjar and, under Bakhtiyar Khalji, Bihar and Bengal followed. When Mu’izz al-Din was killed in 1206, his Indian conquests passed to Aibak and the other commanders, and the Delhi Sultanate grew out of them."
