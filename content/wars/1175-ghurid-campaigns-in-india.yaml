  - title: Chandawar and Benares
    date: "1194"
    when: "1194"
    borders: "1194"
    countries: [in]
    body:
      - East of the Yamuna lay the largest kingdom of the Ganges plain, that of the Gahadavala king Jayachandra (Jaichand) of Kannauj and Benares. A later legend, told in the Prithviraj Raso, makes him Prithviraj’s enemy because Prithviraj eloped with his daughter Samyogita; the Gahadavala records say nothing of it. In 1194 Mu’izz al-Din came from Ghazni with, the chroniclers say, 50,000 horsemen, with Aibak leading the vanguard. Aibak took Koil (Aligarh) on the way. At Chandawar on the Yamuna, near today’s Firozabad, the armies fought a hard battle until Jayachandra was killed and his army broke.
      - The Ghurids took the Gahadavala treasury fort of Asni and went on to Benares, which was plundered; Hasan Nizami claims that a thousand temples were destroyed there. Jayachandra’s son Harishchandra kept a smaller kingdom for some years, but Kannauj was taken in 1198 and Benares was retaken after a rising. The Ghurid governors now held the Doab, the land between the Ganges and the Yamuna.
    facts:
      - [Battle of Chandawar, "1194, Ghurid victory; Jayachandra killed"]
      - [Kannauj taken, "1198"]
