  - title: Bayana, Gwalior and Anhilwara
    date: 1195–1197
    when: "1196"
    borders: "1197"
    countries: [in]
    body:
      - In 1195–1196 Mu’izz al-Din came to India again and took the fortress of Thangir near Bayana, south of Delhi, from its Jadon ruler, leaving his commander Baha al-Din Tughril there. Tughril laid siege to Gwalior, the great fortress on its rock in central India, and its Parihar ruler Sallakshanapala surrendered after a long blockade, probably in about 1196; the sources disagree on the date.
      - In 1196 the Mers of the Aravalli hills, with Chaulukya support, besieged Aibak in Ajmer until help arrived from Ghazni. In 1197 Aibak struck back. He defeated the Chaulukya army at the foot of Mount Abu, close to where the Ghurids had been beaten in 1178, and sacked Anhilwara (Patan), the capital of Bhima II. The Ghurids did not hold Gujarat; Bhima II recovered his capital and ruled until 1240.
    facts:
