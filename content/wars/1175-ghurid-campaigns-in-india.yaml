  - title: The Khokhars and the death of Mu’izz al-Din
    date: 1204–1206
    when: "1206-03-15"
    borders: "1206-03-15"
    countries: [pk, af, in]
    body:
      - After Andkhud the Khokhars, a people of the Salt Range and the country between the Jhelum and the Chenab, rose in revolt and cut the road between Lahore and Ghazni. Mu’izz al-Din marched from Ghazni at the end of 1205, and Aibak came from Lahore; with the help of the young Iltutmish, Aibak’s slave and later his son-in-law, they defeated the Khokhars near the Jhelum and killed great numbers of them. On the way back to Ghazni, on 15 March 1206, Mu’izz al-Din was stabbed to death at Dhamiak while at his evening prayers. Some chroniclers blame Khokhars, others Ismaili assassins. He was buried at Ghazni.
      - He left no son. His nephew Ghiyath al-Din Mahmud took Ghor, while his Turkish slave commanders kept his conquests. Taj al-Din Yildiz held Ghazni, Nasir al-Din Qubacha held Multan and Uch, and the Khalji amirs held Bengal. Aibak took power at Lahore on 25 June 1206 and was recognised as ruler of Hindustan by Ghiyath al-Din Mahmud in 1208–1209. Historians date the Delhi Sultanate from 1206; it was united under Aibak’s successor Iltutmish, who defeated Yildiz in 1216 and Qubacha in 1228.
    facts:
      - [Khokhars defeated, "about February 1206, near the Jhelum"]
      - [Death of Mu’izz al-Din, "15 March 1206, Dhamiak"]
      - [Aibak takes power at Lahore, "25 June 1206"]
