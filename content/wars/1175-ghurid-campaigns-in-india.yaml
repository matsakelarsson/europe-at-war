  - title: The second battle of Tarain
    date: "1192"
    when: "1192"
    borders: "1192"
    countries: [in]
    body:
      - Mu’izz al-Din spent the winter raising a new army at Ghazni; Minhaj-i-Siraj puts it at 120,000 armoured horsemen. Prithviraj called on his vassals and allies; Firishta’s figure of 300,000 men and 3,000 elephants is generally thought an exaggeration. The armies met again at Tarain in 1192. The chroniclers say that Mu’izz al-Din offered a truce and then attacked before dawn, when the Rajput camp was unready. His mounted archers, in four divisions, wore down the Rajput army from every side, and a fifth division drew it into a pursuit by pretending to flee. A reserve of 12,000 armoured horsemen then charged, and the Chahamana army broke.
      - Govindaraja of Delhi died in the battle. Prithviraj fled from his elephant on horseback and was caught near Sarsuti. What happened next is told in many ways. Minhaj-i-Siraj’s words suggest that he was killed soon after; Hasan Nizami and some Indian sources say he was taken to Ajmer and allowed to rule for a time as a vassal, and executed when he was caught plotting, and coins from Delhi bearing both his name and that of Muhammad ibn Sam have been read as support for this. The Prithviraj Raso’s story that he was blinded, taken to Ghazni and shot Mu’izz al-Din with an arrow is legend; Mu’izz al-Din lived for fourteen more years.
    facts:
      - [Second battle of Tarain, "1192, Ghurid victory"]
      - [Ghurid army, "120,000 horsemen according to Minhaj-i-Siraj"]
