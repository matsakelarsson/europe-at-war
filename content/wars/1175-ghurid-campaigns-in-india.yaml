  - title: Ajmer and Delhi
    date: 1192–1195
    when: "1192"
    borders: "1193"
    countries: [in]
    body:
      - After the battle the Ghurids took Hansi, Sirsa, Samana and Kuhram, and Ajmer was sacked; Hasan Nizami writes that its temples were destroyed. Mu’izz al-Din left Prithviraj’s son Govindaraja IV on the throne of Ajmer as his vassal. Prithviraj’s brother Hariraja soon drove Govindaraja out, and Govindaraja withdrew to Ranthambore, where his family went on ruling. Hariraja held out until about 1195, when an army sent by Aibak drove him to take his own life, and Ajmer was given a Muslim governor.
      - Mu’izz al-Din went back to Ghazni and left his Indian conquests to Qutb al-Din Aibak, a Turkish slave who had risen to command his army. In September 1192 Aibak crushed a rising at Hansi. He then took Meerut and Baran, and in 1193 Delhi, whose Tomara ruler he deposed. Delhi became his headquarters. There he began a congregational mosque, later called the Quwwat al-Islam, built, as its inscription says, from the materials of 27 temples.
    facts:
      - [Delhi taken, "1193"]
      - [Ajmer, "vassal kingdom 1192, Ghurid governor about 1195"]
