  - title: Kalinjar
    date: 1202–1203
    when: "1202"
    borders: "1203"
    countries: [in]
    body:
      - The Chandela king Paramardi (Parmal) of Jejakabhukti had been weakened by Prithviraj’s raid on Mahoba in 1182–1183, the war remembered in the ballads of Alha and Udal. In 1202 Aibak besieged Paramardi’s fortress of Kalinjar. According to Hasan Nizami, Paramardi agreed to submit and pay tribute but died before he could; Firishta says his minister killed him for giving in. The minister, Aja Deva, held out until the fort’s water tanks ran dry in a drought, and Kalinjar surrendered in 1203. Hasan Nizami writes that its temples were turned into mosques and 50,000 men were taken as slaves. Aibak also took Mahoba and Khajuraho, and left a governor at Kalinjar; the Chandelas under Paramardi’s son Trailokyavarman won it back a few years later.
      - Meanwhile Bakhtiyar Khalji, a Ghurid officer in Awadh, had conquered Bihar and was moving into Bengal. In the west, Ghiyath al-Din died in 1203 and Mu’izz al-Din became sole sultan. He invaded Khwarazm, but in 1204 the Qara Khitai and their allies crushed his army at Andkhud near the Oxus, and he escaped only by paying a ransom. Rumours of his death spread through his Indian lands.
    facts:
      - [Kalinjar surrenders, "1203"]
      - [Battle of Andkhud, "1204, Qara Khitai victory"]
