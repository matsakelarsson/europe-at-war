steps:
  - title: Multan, Kasahrada and Lahore
    date: 1175–1186
    when: "1175"
    borders: "1178"
    countries: [pk, in, af]
    body:
      - The Ghurids, chiefs of the mountain land of Ghor in central Afghanistan, took Ghazni from the Oghuz in 1173, and Ghiyath al-Din, the Ghurid sultan, installed his younger brother Mu’izz al-Din there. While Ghiyath al-Din fought for Khorasan in the west, Mu’izz al-Din turned east. In 1175 he came down through the Gomal Pass and took Multan from its Ismaili rulers, whom the chroniclers call Qarmatians, and then Uch.
      - In 1178 he marched from Uch across the Thar desert towards Gujarat, sacking Nadol and desecrating a temple at Kiradu on the way. At Kasahrada, at the foot of Mount Abu, the army of the young Chaulukya king Mularaja II and his feudatories, among them Dharavarsha of Abu and Kelhanadeva of Nadol, routed the invaders, and Mu’izz al-Din struggled back through the desert. Jain chroniclers later said that the king’s mother, Naikidevi, led the army. After this defeat Mu’izz al-Din turned to the Punjab, still held by the last Ghaznavid, Khusrau Malik. He took Peshawar in 1179, received the submission of the Soomras at Debal in Sindh in 1182, and in 1186 took Lahore and Khusrau Malik with it. The Ghurid lands now bordered the Chahamana kingdom, which reached from Ajmer to Delhi and Hansi.
    facts:
      - [Multan and Uch taken, "1175"]
      - [Battle of Kasahrada, "1178, Chaulukya victory"]
      - [Lahore taken, "1186; end of the Ghaznavids"]
