  - title: Bathinda and the first battle of Tarain
    date: 1190–1191
    when: "1191"
    borders: "1191"
    countries: [in, pk]
    body:
      - The Chahamana king Prithviraj III ruled from Ajmer over most of today’s Rajasthan and Haryana, with Delhi, held by a vassal, Govindaraja (Govind Rai), on his northern frontier. In the 1180s he had raided the Chandela kingdom, sacking Mahoba, and fought a long war with the Chaulukyas of Gujarat. Late in 1190 Mu’izz al-Din took the fort of Tabarhindah, probably today’s Bathinda, and left a garrison of 1,200 to 2,000 horsemen there (the sources differ) under Qazi Zia al-Din Tulaki.
      - Prithviraj marched north with his vassals and met the Ghurid army in 1191 at Tarain (Taraori), on the plain near Thanesar. The Rajput wings closed in on the Ghurids. According to Minhaj-i-Siraj, Mu’izz al-Din charged Govindaraja and broke two of his teeth with a lance, but was struck in the arm by Govindaraja’s javelin and would have fallen had a young soldier not led his horse away. His army fled. Prithviraj did not pursue it but laid siege to Tabarhindah, whose garrison held out for some thirteen months before it surrendered.
    facts:
      - [First battle of Tarain, "1191, Chahamana victory"]
      - [Siege of Tabarhindah, "about 13 months; the Ghurid garrison surrenders"]
