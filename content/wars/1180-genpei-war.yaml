  - title: Dan-no-ura
    date: "1185"
    when: "1185-04-25"
    borders: "1185"
    countries: [jp]
    body:
      - "Yoshitsune assembled a fleet from the warriors of Suō, Iyo and Kumano and on 25 April 1185 met the Taira in the narrow strait of Shimonoseki off Dan-no-ura. The Azuma kagami gives the Minamoto 840 ships and the Taira 500. In the morning the Taira, better seamen in their home waters, attacked with the current behind them and pressed the Minamoto back. In the afternoon, by the traditional account when the tide turned, Taguchi Shigeyoshi of Awa, whose son the Minamoto held prisoner, went over to them with his squadron and pointed out the ship carrying the emperor. The Minamoto archers shot down the rowers and helmsmen, and the Taira fleet broke up."
      - "Seeing the battle lost, Kiyomori’s widow, Taira no Tokiko, took her six-year-old grandson Antoku in her arms and leapt into the sea with the sacred sword, and many Taira nobles and their women drowned themselves. Tomomori is said to have tied an anchor to his body. Munemori was pulled from the water and captured, and Antoku’s mother was rescued. The mirror and the jewel were recovered, but the sword was lost."
      - "Munemori was beheaded in the sixth month, and Shigehira was handed over to the monks of Nara, whose temples he had burned, and executed. The victory soon divided the victors: Yoritomo turned against Yoshitsune, who fled, and at the end of 1185 Go-Shirakawa gave Yoritomo the right to appoint military governors and stewards throughout the country, the foundation of the Kamakura shogunate. Yoritomo destroyed the Northern Fujiwara, who had sheltered Yoshitsune, in 1189 and was appointed shōgun in 1192."
    facts:
      - [Battle of Dan-no-ura, "25 April 1185, Minamoto victory"]
      - [Fleets (Azuma kagami), "840 Minamoto ships, 500 Taira"]
      - [Losses, "Emperor Antoku and most Taira leaders drowned"]
      - [Yoritomo’s right to appoint governors and stewards, "end of 1185"]
