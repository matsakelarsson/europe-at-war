  - title: Nara, Sunomata and the great famine
    date: 1181–1182
    when: "1181"
    borders: "1181"
    countries: [jp]
    body:
      - "Back in Heian-kyō, Kiyomori struck at the great temples that had sided with Mochihito. On 15 January 1181 his son Shigehira attacked Nara; in the fighting the city caught fire, and the Tōdai-ji, with its great bronze Buddha, and the Kōfuku-ji, the family temple of the Fujiwara, burned, with many people who had sheltered in them. The destruction shocked the court. Kiyomori died of a fever in the spring, reportedly ordering that Yoritomo’s head be laid on his grave, and his son Munemori took over the leadership of the clan."
      - "In the third month of 1181 Shigehira defeated Yoritomo’s uncle Minamoto no Yukiie on the Sunomata River on the border of Mino and Owari, but the Taira could not follow up their victory. In the north, Yoshinaka routed the Taira ally Jō Sukemochi (also read Nagamochi) of Echigo at Yokotagawara and spread his power into the Hokuriku region. Then drought and a failed harvest brought the Yōwa famine of 1181–1182, which the monk Kamo no Chōmei described in the Hōjōki, with corpses lying in the streets of the capital. Neither side could feed an army, and for nearly two years there was little fighting."
    facts:
      - [Burning of Nara, "15 January 1181"]
      - [Death of Kiyomori, "spring of 1181"]
      - [Battle of the Sunomata River, "third month of 1181, Taira victory"]
      - [Yōwa famine, "1181–1182"]
