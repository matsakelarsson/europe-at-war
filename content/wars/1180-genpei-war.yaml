  - title: Mizushima and the fall of Yoshinaka
    date: late 1183 – early 1184
    when: "1184-03-04"
    borders: "1184"
    countries: [jp]
    body:
      - "Go-Shirakawa ordered Yoshinaka to pursue the Taira, and he sent an army west along the Inland Sea. On 17 November 1183 it tried to cross from Mizushima in Bitchū towards Yashima and was caught by the Taira fleet, whose men lashed their ships together into a fighting platform and then rode their horses ashore to rout the Minamoto. With his army weakened and Yoritomo’s envoys gaining favour at court, Yoshinaka turned on Go-Shirakawa: on 3 January 1184 he stormed the retired emperor’s Hōjūji palace, killing courtiers and monks who defended it, took him and the young Go-Toba into custody, and soon had himself given the title of shōgun."
      - "Yoritomo had already sent his half-brothers Minamoto no Noriyori and Minamoto no Yoshitsune west with an army. In the first month of 1184 Yoshitsune forced the crossing of the Uji River and Noriyori the bridge at Seta, and Yoshinaka, abandoned by most of his men, fled east. On 4 March 1184 he was overtaken at Awazu on Lake Biwa with a handful of followers, among them his foster brother Imai Kanehira; his horse foundered in a frozen rice field and he was shot down. Kanehira killed himself. The Tale of the Heike gives Yoshinaka a woman warrior, Tomoe Gozen, who fought beside him to the end."
    facts:
      - [Battle of Mizushima, "17 November 1183, Taira victory"]
      - [Attack on the Hōjūji palace, "3 January 1184"]
      - [Battles of Uji and Seta, "first month of 1184"]
      - [Death of Yoshinaka at Awazu, "4 March 1184"]
