  - title: Yashima
    date: "1185"
    when: "1185-03-22"
    borders: "1185"
    countries: [jp]
    body:
      - "In early 1185 Yoshitsune gathered ships at Watanabe at the mouth of the Yodo River. A storm damaged the fleet, and when he insisted on sailing anyway, against the advice of Kajiwara Kagetoki, only five ships with about 150 men put out with him. They crossed overnight to Katsuura in Awa, gathered local warriors and marched north over the hills into Sanuki, and on 22 March 1185 they burned the houses along the shore facing Yashima."
      - "Expecting an attack from the sea, and deceived by the fires into believing a large army had come overland, the Taira abandoned their palace and took to their ships with Antoku and the regalia. The fighting went on along the shore and in the shallows; the Tale of the Heike tells how Nasu no Yoichi rode into the sea and shot down a fan that the Taira had set up on a pole as a challenge. When Kagetoki’s main fleet came up, the Taira sailed west to join Tomomori at Hikoshima. In Kyushu, Noriyori had defeated Taira supporters at Ashiya, and the Taira were now trapped at the western end of the Inland Sea."
    facts:
      - [Yoshitsune’s crossing, "five ships, about 150 men"]
      - [Battle of Yashima, "22 March 1185, Minamoto victory"]
