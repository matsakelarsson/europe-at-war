  - title: Ichi-no-Tani and the road west
    date: 1184 – early 1185
    when: "1184-03-20"
    borders: "1184"
    countries: [jp]
    body:
      - "While the Minamoto fought each other, the Taira returned to the mainland and fortified a line along the narrow shore west of today’s Kobe, from the woods of Ikuta to the camp of Ichi-no-Tani, with the sea behind them and their fleet offshore. On 20 March 1184 Noriyori attacked the eastern end at Ikuta while Yoshitsune, who had marched round through the hills, fell on Ichi-no-Tani from the north with a small band of horsemen; tradition has them riding down the steep slope of Hiyodorigoe. The Taira broke and fled to their ships. Taira no Tadanori and many young nobles were killed, among them Atsumori, whose death at the hands of Kumagai Naozane is one of the best-known episodes of the Tale of the Heike, and Shigehira was captured."
      - "The Minamoto had no fleet to follow the Taira to Yashima. In the autumn of 1184 Noriyori led an army west along the San’yō road towards Kyushu, to cut the Taira off from their supporters there, but it went short of food and ships. On 10 January 1185 at Fujito, Sasaki Moritsuna found a ford across the channel to Kojima and the Minamoto drove off the Taira force there, and early in 1185 Noriyori crossed to Kyushu. The Taira, under Kiyomori’s son Tomomori, held the island of Hikoshima at the western end of the Inland Sea."
    facts:
      - [Battle of Ichi-no-Tani, "20 March 1184, Minamoto victory"]
      - [Battle of Fujito, "10 January 1185, Minamoto victory"]
      - [Noriyori crosses to Kyushu, "early 1185"]
