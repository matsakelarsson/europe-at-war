  - title: Yoritomo rises in the east
    date: eighth to tenth month of 1180
    when: "1180-11-09"
    borders: "1180"
    countries: [jp]
    body:
      - "Minamoto no Yoritomo, the son of Yoshitomo, had lived as an exile in Izu since the Heiji rebellion, married to Masako, the daughter of his local guardian Hōjō Tokimasa. On the night of 8 September 1180 his small band killed the Taira deputy governor of Izu, Yamaki Kanetaka. With about 300 men he marched towards Sagami, but on 14 September at Ishibashiyama he was caught by 3,000 men under the Taira partisan Ōba Kagechika and routed; he hid in the Hakone hills and escaped by boat from Manazuru to Awa across the bay."
      - "In Awa and Kazusa the great landholders of the Bōsō peninsula joined him, and as he marched round the bay through Shimōsa and Musashi his army grew; he entered Kamakura, the old seat of his ancestor Yoriyoshi, in the tenth month and made it his headquarters. Further west the Takeda and other Minamoto of Kai had risen and destroyed the Taira forces in Suruga, and in Shinano Yoritomo’s cousin Yoshinaka gathered an army of his own."
      - "The Taira sent an army east under Kiyomori’s grandson Koremori, which dwindled through desertion and hunger as it marched. On 9 November 1180 it faced the Minamoto across the Fuji River. During the night, the Tale of the Heike says, a great flock of water birds rose from the marshes, and the Taira, taking the noise for an attack, fled in panic. Yoritomo did not pursue; he turned back to secure the east, attacked the Satake of Hitachi and set up a board of retainers in Kamakura to govern his vassals."
    facts:
      - [Attack on Yamaki Kanetaka, "8 September 1180"]
      - [Battle of Ishibashiyama, "14 September 1180, Taira victory"]
      - [Yoritomo enters Kamakura, "tenth month of 1180"]
      - [Battle of Fujigawa, "9 November 1180, Taira withdrawal"]
