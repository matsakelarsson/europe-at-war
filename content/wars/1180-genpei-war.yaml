  - title: Kurikara and the Taira flight from the capital
    date: "1183"
    when: "1183-06-02"
    borders: "1183"
    countries: [jp]
    body:
      - "In the spring of 1183 the Taira raised a great army, partly by forced levies in the famine-stricken provinces, and sent it north under Koremori against Yoshinaka, who had just settled a quarrel with Yoritomo by sending his son to Kamakura as a hostage. The Taira took the Hiuchi fort in Echizen and pushed into Kaga, but on the night of 2 June 1183 Yoshinaka attacked their camp in the pass of Kurikara on Mount Tonami from several sides, and much of the Taira army was driven into the ravines. A later version of the tale has Yoshinaka stampede a herd of oxen with torches tied to their horns into the Taira camp. He defeated the survivors again at Shinohara in Kaga, where the old warrior Saitō Sanemori died after dyeing his white hair black so as not to be spared."
      - "Yoshinaka marched on the capital, with the warrior monks of Mount Hiei on his side, while Yukiie approached from the east. In the seventh month Munemori abandoned Heian-kyō and fled west with Antoku, his mother and the three imperial regalia, burning the Taira mansions at Rokuhara. Go-Shirakawa had slipped away to Mount Hiei and returned with Yoshinaka; the court declared the Taira rebels and enthroned another grandson of Go-Shirakawa, the three-year-old Go-Toba, without the regalia. Japan now had two emperors."
      - "The Taira took their court to the Dazaifu in Kyushu, but local warriors stirred up by Go-Shirakawa drove them out, and they settled at Yashima off the coast of Sanuki, from where their fleets controlled the Inland Sea. In the capital, Yoshinaka’s hungry army plundered the city, and Go-Shirakawa turned to Yoritomo, recognising his authority over the eastern provinces in the tenth month."
    facts:
