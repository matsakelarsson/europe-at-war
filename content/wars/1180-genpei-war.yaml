id: genpei-war
name: Genpei War
start: "1180-05"
end: "1185-04-25"
tier: A
summary: "The civil war between the Taira and the Minamoto, the two great warrior houses of late Heian Japan, which ended the Taira’s hold on the court and led to the first warrior government in Kamakura. Taira no Kiyomori had dominated the court since the Heiji rebellion, and in 1179–1180 he put the retired emperor Go-Shirakawa under arrest and placed his own infant grandson Antoku on the throne. Prince Mochihito’s call to arms against him failed at Uji in June 1180, but it set off risings across the east: Minamoto no Yoritomo, after a defeat at Ishibashiyama, made himself master of the Kantō from Kamakura, and his cousin Minamoto no Yoshinaka rose in Shinano. After two years of famine, Yoshinaka destroyed the main Taira army at Kurikara in 1183 and drove the Taira, with the boy emperor and the imperial regalia, out of the capital. Yoshinaka then fell out with Go-Shirakawa and Yoritomo and was killed by Yoritomo’s brothers Yoshitsune and Noriyori early in 1184. Yoshitsune defeated the Taira at Ichi-no-Tani in 1184 and Yashima in 1185 and destroyed their fleet at Dan-no-ura on 25 April 1185, where Antoku drowned. Yoritomo was given the right to appoint military governors and stewards across the country at the end of 1185, and in 1192 he became shōgun."
countries: [jp]
sides:
