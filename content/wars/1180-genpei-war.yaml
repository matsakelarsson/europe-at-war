notes:
  - "Japanese historians often prefer the name Jishō–Juei war, after the era names, because the fighting was not simply a contest between two clans: many Taira fought for Yoritomo, the Minamoto fought each other, and much of the war was a struggle among provincial warriors over land and local power. Yoshinaka fought the Taira until 1183 and Yoritomo’s forces in 1184, and is shown here as a side of his own."
  - "The Tale of the Heike, the war tale that made the war famous, was shaped by blind storytellers over the following century; its battle scenes, numbers and speeches are literature. The courtier Kujō Kanezane’s diary Gyokuyō and the Kamakura chronicle Azuma kagami give a sober but partisan account. Day dates are the Julian equivalents of the Japanese lunar dates given by Japanese historians."
