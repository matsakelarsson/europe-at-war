steps:
  - title: Prince Mochihito’s call and the battle of Uji
    date: 1179–1180
    when: "1180-06-20"
    borders: "1180"
    countries: [jp]
    body:
      - "Taira no Kiyomori had risen from the Hōgen and Heiji rebellions to become chancellor in 1167, and his family filled the high offices of the court and governed some thirty provinces. His daughter Tokuko was the consort of Emperor Takakura, the son of the retired emperor Go-Shirakawa. As the two men fell out, Kiyomori marched on the capital at the end of 1179, dismissed Go-Shirakawa’s supporters and confined the retired emperor, and in the spring of 1180 Takakura abdicated in favour of his and Tokuko’s son Antoku, not yet two years old."
      - "Go-Shirakawa’s son Prince Mochihito, passed over for the throne, issued an order in the fourth month of 1180 calling on the Minamoto and the great temples to rise against the Taira, with the support of Minamoto no Yorimasa, an old warrior who had stayed at court through the years of Taira rule. The plot was discovered. Mochihito fled to the temple of Onjō-ji, and then, with Yorimasa and the warrior monks, towards Nara. The Taira caught them at Uji on 20 June 1180: the monks tore up the planks of the bridge and held it, but the Taira horsemen forded the river. Yorimasa killed himself at the Byōdō-in temple, and Mochihito was killed as he fled."
      - "A few days later Kiyomori moved the court to his port of Fukuhara on the Inland Sea, where he had built a villa and handled trade with Song China; it was so unpopular with the nobles that the capital returned to Heian-kyō at the end of the year. Mochihito’s order, meanwhile, was circulating among Minamoto exiles in the provinces."
    facts:
      - [Kiyomori’s coup, "end of 1179"]
      - [Antoku enthroned, "spring of 1180, aged one"]
      - [Battle of Uji, "20 June 1180, Taira victory"]
      - [Court moved to Fukuhara, "sixth to eleventh month of 1180"]
