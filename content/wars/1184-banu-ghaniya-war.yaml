steps:
  - title: Bougie, Qaraqush and al-Mansur
    date: 1184–1188
    when: "1184-11"
    borders: "1187-10-01"
    countries: [tn, dz, ly, es]
    body:
      - The Banu Ghaniya were a branch of the Almoravid ruling family. When the Almohads overthrew the Almoravids in Morocco and al-Andalus in the 1140s, the family kept the Balearic Islands as an independent emirate, which lived in part from raids at sea. In 1183 the emir Ishaq died; his son Muhammad offered to submit to the Almohads, and the family’s leading men deposed him in favour of his brother Ali, who beat off an Almohad fleet sent to take the islands.
      - Instead of waiting for the next attack, Ali took the war to Africa. In November 1184, a few months after the caliph Abu Yaqub Yusuf had died of his wounds at Santarém in Portugal, Ali’s ships landed at Bougie and took the city. With the help of Arab tribes who resented Almohad rule he went on to take Algiers and Miliana and besieged Constantine. He recognised the Abbasid caliph of Baghdad as his overlord and presented himself as the heir of the Almoravids. The new caliph, Abu Yusuf Yaqub al-Mansur, sent an army and a fleet that retook Bougie and Algiers in 1185, about seven months after Ali’s landing. In his absence the Almohads also seized the Balearic Islands, but another brother, Abdallah, won them back by 1187.
      - Ali fell back to the Jarid, the oases of southern Ifriqiya, and joined Qaraqush, an Armenian mamluk who had come west in the 1170s in the service of Saladin’s nephew Taqi al-Din and had made himself master of Tripoli with his Turkish (Ghuzz) troops. Together they took Gafsa and much of the south, and Qaraqush moved his headquarters to Gabès. In 1187 al-Mansur came east himself. His vanguard was beaten near Gafsa, but in the autumn he routed the allies near al-Hamma, west of Gabès, and retook Gabès and Gafsa. He then moved many of the Arab tribesmen who had joined the rebels to the plains of Morocco. Ali died in 1187 or 1188, and his brother Yahya took command.
    facts:
