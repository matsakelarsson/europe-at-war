  - title: Raids from the desert and the Hafsids
    date: 1207–1237
    when: "1207"
    borders: "1234-01-01"
    countries: [tn, dz, ly]
    body:
      - Beaten on the coast, Yahya went back to the steppe and the desert, where Arab tribes and Zenata Berbers gave him men and refuge. For a quarter of a century his horsemen raided from Tripolitania to the Zab and the central Maghreb, plundering towns and caravans, and the Almohad governors in Tunis and Tlemcen could defeat them but not end the raids. In 1212, after a last quarrel, Yahya defeated his old ally Qaraqush and had him executed at Waddan, an oasis in the desert south of Sirte.
      - After Abd al-Wahid died in Tunis in 1221 the Almohad caliphate itself began to break up. His son Abu Zakariya, governor of Ifriqiya from 1228, threw off Almohad rule in 1229 and founded the Hafsid kingdom, and in 1234 he drove Yahya out of the country south of Constantine. Yahya, the last Almoravid pretender, died some time between 1233 and 1237; the sources disagree on the year. His war had cost the Almohads dearly in men and money, and historians see it as one reason why they never held the eastern Maghreb securely and why their Hafsid governors became its rulers.
    facts:
      - [Qaraqush executed at Waddan, "1212"]
      - [Hafsid independence, "1229"]
      - [Death of Yahya ibn Ghaniya, "between 1233 and 1237"]
