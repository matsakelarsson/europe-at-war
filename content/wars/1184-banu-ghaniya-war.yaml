id: banu-ghaniya-war
name: Banu Ghaniya’s war in Ifriqiya
start: "1184-11"
end: "1237"
tier: B
summary: "Half a century of war in the eastern Maghreb between the Almohad Caliphate and the Banu Ghaniya, the last branch of the Almoravid ruling family, who had kept the Balearic Islands after the Almohads overthrew the Almoravids. In November 1184 Ali ibn Ghaniya landed at Bougie and, with the help of Arab tribes, overran much of the central Maghreb; driven back by the caliph Abu Yusuf Yaqub al-Mansur, he joined forces with Qaraqush, a mamluk commander from Ayyubid Egypt who held Tripoli, until al-Mansur defeated them in 1187. Ali’s brother Yahya kept the war going, took Mahdia and Tunis and by 1203 ruled most of Ifriqiya. The caliph Muhammad al-Nasir won it back in 1205–1206 and left Abd al-Wahid ibn Abi Hafs as governor, and Yahya went on raiding from the desert until his death in the 1230s. The war kept the Almohads from ever ruling the east securely, and their Hafsid governors became the rulers of Ifriqiya."
countries: [tn, dz, ly, es]
