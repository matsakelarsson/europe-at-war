  - title: Yahya ibn Ghaniya and the fall of Tunis
    date: 1188–1207
    when: "1188"
    borders: "1205-10-01"
    countries: [tn, ly, es]
    body:
      - Yahya ibn Ghaniya kept up the war with the Arab tribes of the steppe and, for a time, with Qaraqush, although the two allies also fell out and fought each other. Saladin made peace with the Almohads in 1190, and Qaraqush now fought for himself alone. Al-Mansur, taken up with Castile and Portugal, where he won his great victory at Alarcos in 1195, did not come east again, and Yahya slowly won back the south and then the coast. He took Mahdia and, in 1203, Tunis, and for a time he ruled almost all of Ifriqiya in the name of the Abbasid caliph.
      - The Almohads struck first at his family’s base. In 1203 a fleet from Denia took Majorca, where Abdallah ibn Ghaniya was killed, and the islands were ruled by Almohad governors until the Aragonese conquest of 1229. Then the caliph Muhammad al-Nasir led a large army east and recovered Tunis. In October 1205 Abu Muhammad Abd al-Wahid ibn Abi Hafs, a son of one of Ibn Tumart’s first companions, crushed Yahya’s army with about 4,000 horsemen at Jabal Tajra, south-east of Gabès, and in January 1206 Mahdia surrendered; its governor, Yahya’s cousin Ali ibn Ghazi, went over to the Almohads.
      - Before he returned to Morocco in 1207, al-Nasir made Abd al-Wahid governor of Ifriqiya with unusually wide powers, so that someone strong would stay in the east to face the Banu Ghaniya. Abd al-Wahid ruled from Tunis until his death in 1221, and his sons and grandsons, the Hafsids, later made the province their own kingdom.
    facts:
