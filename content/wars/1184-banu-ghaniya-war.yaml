notes:
  - The war is known mainly from Arabic chroniclers writing after the events, above all Ibn Khaldun, Ibn Idhari and the traveller al-Tijani. They often disagree on years, and the dates here are the Julian equivalents given by modern historians; several battles can be dated only to a year.
  - The family took its name from Ghaniya, an Almoravid princess, the mother of Muhammad ibn Ali, who governed the Balearic Islands for the Almoravids from 1126. Bougie is today’s Béjaïa, and Madina Mayurqa today’s Palma.
  - The Arab tribes of the Banu Sulaym and the Banu Hilal fought on both sides at different times, and the Almohad caliphs moved some of them from Ifriqiya to the plains of Morocco.
