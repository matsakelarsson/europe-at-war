notes:
  - The main source is the Byzantine historian Niketas Choniates, who served Isaac II and took part in some of the campaigns. Historians debate how far the rising was Bulgarian or Vlach (Romanian-speaking) in character; the sources speak of both peoples, and the new state was ruled from Tarnovo as a Bulgarian empire.
  - Some accounts treat the uprising as ending with the truce of 1187, which left the rebels in control north of the Balkan Mountains; this entry follows the war to the peace Kaloyan made with Alexios III.
