steps:
  - title: The rising and Tryavna
    date: 1185–1190
    when: "1185-10-26"
    borders: "1190-12-31"
    countries: [bg, tr, ro]
    body:
      - In 1185 the Byzantine emperor Isaac II Angelos raised a new tax to pay for his wedding to the daughter of Béla III of Hungary, and it fell heavily on the people of the Haemus (Balkan Mountains). Two brothers from the region, Theodore, later called Peter, and Asen, came to Isaac at Kypsella to ask for an estate and were refused and humiliated. On 26 October 1185, the feast of St Demetrius, they raised a revolt at Tarnovo, proclaiming that the saint had left Thessalonica to help them, and Peter took the title of tsar, reviving the Bulgarian Empire destroyed in 1018.
      - Isaac’s campaign of 1186 drove many rebels north of the Danube, but they came back with Cuman horsemen from the steppe and held the land between the Haemus and the Danube. After a three-month siege of Lovech failed in 1187, Isaac agreed a truce that left them in control, taking the youngest brother, Kaloyan, as a hostage. In 1190 he tried again and besieged Tarnovo, but rumours of a Cuman army made him retreat, and in a mountain pass near Tryavna the Bulgarians ambushed his column. Isaac barely escaped, and the new state was secure.
    facts:
      - [Rising at Tarnovo, 26 October 1185]
      - [Siege of Lovech, "1187, failed"]
      - [Battle of Tryavna, "1190, Bulgarian victory"]
    markers:
      - kind: event
        name: Kypsella
        date: "1185"
        text: The brothers met Isaac II here as he gathered his army against the Normans. Choniates says one of them was struck in the face for his insolence.
        lonlat: [26.38, 40.92]
      - kind: event
        side: bg
        name: Tarnovo
        date: 26 October 1185
        text: The brothers built a church to St Demetrius and declared the rising here. Tarnovo became the capital of the new state.
        lonlat: [25.617, 43.078]
      - kind: held
        side: bg
        name: Lovech
        date: "1187"
        text: Isaac besieged the fortress for three months without success and then made a truce, which in practice recognised the brothers’ rule.
        lonlat: [24.717, 43.135]
      - kind: battle
        side: bg
        name: Battle of Tryavna
        date: "1190"
        text: The Bulgarians attacked the retreating Byzantine army in a narrow pass. Isaac lost much of his army and baggage and barely escaped with his life.
        lonlat: [25.5, 42.867]
        lp: b
