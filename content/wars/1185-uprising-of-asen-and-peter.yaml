  - title: The new Bulgarian state
    date: 1190–1202
    when: "1194"
    borders: "1201-12-31"
    countries: [bg, gr, tr]
    body:
      - Now on the offensive, the Bulgarians and their Cuman allies raided Thrace and Macedonia. In 1194 they routed a Byzantine army at Arcadiopolis, and in 1196 Asen beat another near Serres. But the brothers made enemies among their own nobles. Asen was murdered by the boyar Ivanko in 1196, and Peter was killed the next year. Their younger brother Kaloyan, who had spent years as a hostage in Constantinople, took power in 1197.
      - Kaloyan pressed on. He took Constantia and, in March 1201, the Black Sea port of Varna, and the weak emperor Alexios III made peace with him in 1201 or 1202, accepting his rule over the lands he held. Kaloyan sought recognition from Pope Innocent III, and in November 1204 a papal legate crowned him king at Tarnovo. The Second Bulgarian Empire, which he called an empire of the Bulgarians and Vlachs, lasted until the Ottoman conquest of 1393–1396.
    facts:
      - [Battle of Arcadiopolis, "1194, Bulgarian victory"]
      - [Kaloyan takes Varna, March 1201]
      - [Coronation of Kaloyan, November 1204]
    markers:
      - kind: battle
        side: bg
        name: Battle of Arcadiopolis
        date: "1194"
        text: Bulgarians and Cumans routed the Byzantine armies of the east and west under Alexios Gidos and Basil Vatatzes, who was killed.
        lonlat: [27.251, 41.44]
      - kind: battle
        side: bg
        name: Battle of Serres
        date: "1196"
        text: Asen beat a Byzantine army and captured its commander, the sebastokrator Isaac Komnenos, the emperor’s son-in-law.
        lonlat: [23.55, 41.083]
      - kind: event
        name: Tarnovo
        date: "1196"
        text: Asen was murdered here by the boyar Ivanko, who held the city briefly before fleeing to the Byzantines.
        lonlat: [25.617, 43.078]
      - kind: taken
        side: bg
        name: Varna
        date: March 1201
        text: Kaloyan stormed the Byzantine port with a siege tower and is said to have had its defenders buried alive in the moat.
        lonlat: [27.91, 43.21]
