id: uprising-of-asen-and-peter
name: Uprising of Asen and Peter
start: "1185-10-26"
end: "1202"
tier: B
summary: The revolt of the Bulgarians and Vlachs of the Balkan Mountains against Byzantine rule, led by the brothers Asen and Peter, which began at Tarnovo in 1185 and restored an independent Bulgarian state, the Second Bulgarian Empire. With Cuman help the rebels beat the emperor Isaac II at Tryavna in 1190 and went on to raid Thrace and Macedonia; their younger brother Kaloyan made peace with Byzantium in 1201 or 1202.
