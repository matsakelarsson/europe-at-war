notes:
  - Dates are Julian. The main sources are the crusader chronicles of Ambroise and the Itinerarium Peregrinorum, the German accounts of Frederick’s expedition, and Saladin’s secretaries Baha al-Din ibn Shaddad and Imad al-Din al-Isfahani, with the later historian Ibn al-Athir. Numbers of soldiers come from these sources and are uncertain.
  - Places have the names usual in histories of the crusades, with modern names where they help, such as Acre (Akko), Ascalon (Ashkelon), Iconium (Konya), the Saleph (Göksu), Philippopolis (Plovdiv) and Adrianople (Edirne).
  - Saladin (Salah al-Din Yusuf ibn Ayyub) was a Kurd who had made himself master of Egypt in 1169–1171 and of Muslim Syria after 1174. His dynasty is known as the Ayyubids.
