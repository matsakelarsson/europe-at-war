steps:
  - title: Cresson and Hattin
    date: May–July 1187
    when: "1187-05-01"
    borders: "1187-07-04"
    countries: [il, sy, jo]
    body:
      - By the 1180s Saladin, sultan of Egypt and of Damascus and Aleppo, surrounded the Kingdom of Jerusalem, which was bitterly divided. In 1186 Queen Sibyl, sister of the leper king Baldwin IV, had her husband Guy of Lusignan crowned, against the wishes of the barons led by Raymond III of Tripoli, who made a separate truce with Saladin. When Raynald of Châtillon, lord of Kerak, broke the general truce by seizing a caravan, Saladin prepared for holy war. On 1 May 1187 his scouts destroyed a small force of Templars and Hospitallers at the Springs of Cresson near Nazareth.
      - At the end of June Saladin crossed the Jordan with perhaps 30,000 men, and on 2 July he took the town of Tiberias, where Raymond’s wife still held the citadel. Against Raymond’s advice, Guy led the kingdom’s whole army, some 20,000 men with about 1,200 knights, from the springs of Sephoria across a dry plateau. Harassed by archers and tormented by thirst and the smoke of grass fires, it was surrounded near the Horns of Hattin and destroyed on 4 July. Guy was captured with the relic of the True Cross. Saladin killed Raynald with his own hand and had some 200 Templars and Hospitallers executed.
    facts:
      - [Battle of Cresson, "1 May 1187, Ayyubid victory"]
      - [Battle of Hattin, "4 July 1187, Ayyubid victory"]
      - [Captured, "King Guy and the True Cross"]
    markers:
      - kind: battle
        side: ay
        name: Battle of Cresson
        date: 1 May 1187
        text: About 140 knights led by the Templar master Gerard of Ridefort charged a much larger Muslim force. Almost all were killed; Gerard escaped.
        lonlat: [35.355, 32.735]
        lp: b
      - kind: event
        side: cr
        name: Sephoria
        date: 2–3 July 1187
        text: The kingdom’s army gathered at these springs, the usual mustering place, and marched out on the morning of 3 July to relieve Tiberias.
        lonlat: [35.279, 32.746]
        lp: l
      - kind: taken
        side: ay
        name: Tiberias
        date: 2–5 July 1187
        text: Saladin stormed the town to draw the Franks out. Countess Eschiva held the citadel until after Hattin, then surrendered and was allowed to leave.
        lonlat: [35.533, 32.794]
      - kind: battle
        side: ay
        name: Battle of Hattin
        date: 4 July 1187
        text: Fought around a double-peaked extinct volcano west of the Sea of Galilee. Raymond of Tripoli and Balian of Ibelin broke out; most of the army was killed or captured and sold into slavery.
        lonlat: [35.444, 32.804]
        lp: t
    arrows:
      - side: ay
        label: Saladin
        via: [[35.85, 32.66], [35.6, 32.7], [35.52, 32.78]]
      - side: cr
        label: Guy of Lusignan
        via: [[35.28, 32.75], [35.36, 32.77], [35.43, 32.8]]
  - title: The fall of Jerusalem
    date: July 1187 – 1189
    when: "1187-07-10"
    borders: "1188-12-31"
    countries: [il, ps, lb, sy, jo, tr, fr, gb, de]
    body:
      - With its army gone, the kingdom had few defenders left. Acre surrendered on 10 July, and within weeks Saladin and his brother al-Adil had taken Nablus, Jaffa, Sidon, Beirut and, in early September, Ascalon. Tyre was about to give up when Conrad of Montferrat arrived by sea on 14 July and took charge of its defence. Jerusalem, crowded with refugees, was held by Balian of Ibelin. When Saladin’s miners breached the northern wall, Balian negotiated a surrender, and on 2 October 1187 the city passed to Saladin, 88 years after the crusaders had taken it.
      - Saladin let the inhabitants buy their freedom. Those who could pay left for Tyre, Tripoli or Egypt, but many thousands of the poor, perhaps 15,000, were sold into slavery. There was no massacre, and Eastern Christians could stay. The Dome of the Rock and the al-Aqsa Mosque were returned to Muslim worship. Saladin failed to take Tyre that winter, released Guy in 1188 and took Kerak and many castles in the north. By 1189 the Franks held little more than Tyre, Tripoli, Antioch and a few fortresses.
      - The news reached Europe in the autumn of 1187. Pope Gregory VIII called a new crusade, and Henry II of England and Philip II of France took the cross in January 1188 and raised a tax, the Saladin tithe, to pay for it. The emperor Frederick Barbarossa took the cross at Mainz in March. When Henry died in July 1189 his son Richard I took his place. The kings’ quarrels delayed them, but fleets from Pisa, Sicily and northern Europe were soon sailing east.
    facts:
      - [Jerusalem surrenders, 2 October 1187]
      - [Siege of Tyre, "November 1187 – 1 January 1188, failed"]
      - [Saladin tithe, "1188, a tenth of income and movable goods"]
    markers:
      - kind: taken
        side: ay
        name: Acre
        date: 10 July 1187
        text: The kingdom’s richest port surrendered without a fight. Its merchants were allowed to leave with their goods.
        lonlat: [35.082, 32.928]
        lp: l
      - kind: held
        side: cr
        name: Tyre
        date: November 1187 – 1 January 1188
        text: Conrad of Montferrat held the island city against Saladin’s siege. After his galleys were beaten at sea, Saladin withdrew, and Tyre became the base for the counter-attack.
        lonlat: [35.196, 33.271]
      - kind: taken
        side: ay
        name: Ascalon
        date: September 1187
        text: The town surrendered after a short siege, in exchange for the release of King Guy, which Saladin granted the next year.
        lonlat: [34.558, 31.671]
      - kind: taken
        side: ay
        name: Jerusalem
        date: 2 October 1187
        text: The city surrendered on terms after a siege of twelve days. Saladin entered on the anniversary of the Prophet’s Night Journey from Jerusalem, as his contemporaries noted.
        lonlat: [35.234, 31.777]
      - kind: taken
        side: ay
        name: Kerak
        date: November 1188
        text: Raynald of Châtillon’s great castle east of the Dead Sea surrendered after a long blockade.
        lonlat: [35.701, 31.181]
      - kind: taken
        side: ay
        name: Latakia
        date: July 1188
        text: Saladin’s northern campaign of 1188 took Latakia and much of the Principality of Antioch, which was left with little beyond the city itself.
        lonlat: [35.778, 35.52]
    arrows:
      - side: ay
        label: Saladin, 1187
        via: [[35.08, 32.93], [34.75, 32.05], [34.56, 31.67], [35.2, 31.76]]
  - title: Frederick Barbarossa’s march
    date: May 1189 – October 1190
    when: "1189-05-11"
    borders: "1190-06-10"
    countries: [de, at, hu, rs, bg, gr, tr]
    move_names:
      cr: Moves by Frederick’s army
    body:
      - Frederick Barbarossa, now in his late sixties, left Regensburg on 11 May 1189 with the best-organised of the crusading armies, perhaps 12,000–20,000 men, several thousand of them knights. He crossed Hungary in peace and was welcomed at Niš by Stefan Nemanja of Serbia, who offered to become his vassal. But the Byzantine emperor Isaac II Angelos, who had an understanding with Saladin, imprisoned Frederick’s envoys and harassed his march. Frederick occupied Philippopolis and then Adrianople, where he spent the winter, and threatened to attack Constantinople. In February 1190 Isaac gave way, and in March Byzantine ships carried the army over the Dardanelles.
      - In Anatolia the army was harried by the Turks of the Sultanate of Rum, whose aged sultan Kilij Arslan II had promised safe passage but no longer controlled his sons. Short of food and water, the Germans beat a Turkish army near Philomelion on 7 May and stormed Iconium, the Seljuk capital, on 18 May 1190. They crossed the Taurus into Armenian Cilicia, but on 10 June Frederick drowned in the river Saleph. His army broke up. Many went home, and his son Frederick of Swabia led the rest by way of Antioch to Acre, where he died in January 1191.
    facts:
      - [Battle of Iconium, "18 May 1190, crusader victory"]
      - [Death of Frederick Barbarossa, "10 June 1190, river Saleph"]
    markers:
      - kind: event
        name: Regensburg
        date: 11 May 1189
        text: The army set out from the Danube city, and much of it travelled downstream by boat.
        lonlat: [12.1, 49.02]
      - kind: event
        name: Niš
        date: July 1189
        text: Stefan Nemanja, who had thrown off Byzantine rule, offered Frederick his allegiance and help. The Bulgarian rebels Asen and Peter also sent offers.
        lonlat: [21.896, 43.321]
      - kind: taken
        side: cr
        name: Philippopolis
        date: August 1189
        text: The Germans found the city abandoned and occupied it while Frederick negotiated with Isaac II.
        lonlat: [24.75, 42.15]
      - kind: event
        side: cr
        name: Adrianople
        date: November 1189 – March 1190
        text: Frederick wintered here and wrote to his son Henry to prepare a fleet against Constantinople. The Treaty of Adrianople of February 1190 secured his passage.
        lonlat: [26.556, 41.677]
      - kind: battle
        side: cr
        name: Battle of Philomelion
        date: 7 May 1190
        text: The Germans beat a Turkish army that blocked their road, after weeks of harassment in the mountains.
        lonlat: [31.416, 38.358]
      - kind: taken
        side: cr
        name: Iconium
        date: 18 May 1190
        text: While Frederick beat the sultan’s army outside, his son stormed the lower city. The Germans rested and took supplies, then marched on.
        lonlat: [32.493, 37.874]
      - kind: event
        name: River Saleph
        date: 10 June 1190
        text: Frederick drowned near Seleucia, either while crossing the river on horseback or while bathing. His flesh was buried at Antioch and his bones, it is said, at Tyre.
        lonlat: [33.93, 36.38]
        lp: b
    arrows:
      - side: cr
        label: Frederick Barbarossa
        via: [[12.1, 49.02], [19.0, 47.5], [21.9, 43.32], [26.56, 41.68]]
      - side: cr
        via: [[26.67, 40.35], [28.52, 38.35], [31.42, 38.36], [32.45, 37.87]]
      - side: cr
        via: [[32.5, 37.85], [33.22, 37.18], [33.93, 36.4]]
  - title: The siege of Acre
    date: August 1189 – April 1191
    when: "1189-08-28"
    borders: "1190-12-31"
    countries: [il, lb, fr, gb, de, it, dk]
    body:
      - Released by Saladin on a promise not to fight him again, Guy of Lusignan was refused entry to Tyre by Conrad, who now claimed the kingdom himself. In August 1189 Guy marched south with a few thousand men and on 28 August began a siege of Acre, camping on a hill outside the walls. Saladin came up and surrounded the besiegers, who were thus besieged in their turn. The crusaders dug ditches facing both ways, and as ships brought more men from the West, the siege grew into a long war of attrition.
      - On 4 October 1189 the Franks attacked Saladin’s camp and were thrown back with heavy losses; the Templar master Gerard of Ridefort was killed. Fleets from Pisa, Denmark, Frisia, England and France kept the camp supplied, while Egyptian ships fought their way into the harbour. Henry of Champagne arrived in July 1190 with French troops. Disease and hunger killed thousands in the camp, among them, in 1190, Queen Sibyl and her daughters; Conrad then married her half-sister Isabella and claimed the throne. Philip II of France landed on 20 April 1191.
    facts:
      - [Siege begun, 28 August 1189]
      - [Battle of Acre, "4 October 1189, Ayyubid victory"]
      - [Philip II arrives, 20 April 1191]
    markers:
      - kind: siege
        side: cr
        name: Acre
        date: 28 August 1189 – 12 July 1191
        text: The longest siege of the crusades. Both sides used siege towers, Greek fire and mining, and the harbour was fought over by Christian and Egyptian fleets.
        lonlat: [35.082, 32.928]
        lp: l
      - kind: battle
        side: ay
        name: Battle of Acre
        date: 4 October 1189
        text: The crusaders broke into Saladin’s camp but scattered to plunder it and were driven back. Several thousand were killed.
        lonlat: [35.12, 32.9]
        lp: b
      - kind: held
        side: cr
        name: Tyre
        date: 1189–1191
        text: Conrad of Montferrat’s base. He joined the siege only reluctantly and kept much of the fleet’s supplies under his control.
        lonlat: [35.196, 33.271]
    arrows:
      - side: cr
        label: Guy of Lusignan
        via: [[35.2, 33.25], [35.15, 33.1], [35.09, 32.95]]
      - side: ay
        label: Saladin
        via: [[35.35, 32.78], [35.22, 32.86], [35.14, 32.9]]
  - title: Richard, Cyprus and the fall of Acre
    date: July 1190 – August 1191
    when: "1191-05-06"
    borders: "1191-07-12"
    countries: [cy, il, it, gb, fr]
    side_names:
      cr: Crusaders
    body:
      - Richard I of England and Philip II set out together from Vézelay on 4 July 1190 and wintered in Sicily, where Richard sacked Messina in a quarrel with King Tancred. In April 1191, on the way to Acre, part of Richard’s fleet was wrecked off Cyprus, which had been ruled since 1184 by Isaac Komnenos, a rebel member of the Byzantine imperial family, and Isaac seized the survivors and their goods. Richard landed at Limassol on 6 May, married Berengaria of Navarre there on 12 May and conquered the island in a month. Isaac surrendered at the end of May.
      - Richard reached Acre on 8 June 1191. With the two kings’ siege engines battering the walls and the town starving, the garrison surrendered on 12 July, against Saladin’s wishes, promising a ransom, the release of Christian prisoners and the return of the True Cross. Guy was confirmed as king for life, with Conrad as his heir. Philip, ill and at odds with Richard, sailed home at the end of July. When the ransom was delayed, Richard had about 2,700 Muslim prisoners killed outside the town on 20 August.
    facts:
      - [Conquest of Cyprus, "6 May – end of May 1191"]
      - [Acre surrenders, 12 July 1191]
      - [Execution of prisoners, "20 August 1191, about 2,700 killed"]
    markers:
      - kind: taken
        side: cr
        name: Messina
        date: October 1190
        text: Richard’s troops stormed the city after quarrels with its people. Tancred of Sicily bought peace and paid the dowry of Richard’s sister Joan.
        lonlat: [15.55, 38.19]
      - kind: taken
        side: cr
        name: Limassol
        date: 6 May 1191
        text: Richard landed under fire and took the town. Berengaria was married and crowned queen of England in its chapel six days later.
        lonlat: [33.044, 34.675]
        lp: b
      - kind: event
        side: cr
        name: Cape Andreas
        date: late May 1191
        text: Isaac Komnenos surrendered here, at the tip of the Karpas peninsula. He was said to have asked not to be put in irons, so Richard had him bound in silver chains.
        lonlat: [34.59, 35.69]
      - kind: taken
        side: cr
        name: Acre
        date: 12 July 1191
        text: The kings’ banners were raised over the town. The banner of Leopold V of Austria was thrown down, an insult he avenged by imprisoning Richard in 1192.
        lonlat: [35.082, 32.928]
    arrows:
      - side: cr
        label: Richard I
        via: [[15.6, 38.15], [24.5, 35.5], [28.2, 36.4], [32.95, 34.65]]
      - side: cr
        via: [[33.94, 35.12], [34.6, 34.0], [35.07, 32.95]]
    areas:
      - style: occupied
        side: cr
        label: Conquered by Richard I, May 1191
        atoms: [CY-01, CY-02, CY-03, CY-04, CY-05, "CYN+00?"]
  - title: Arsuf
    date: August 1191 – July 1192
    when: "1191-08-22"
    borders: "1191-09-10"
    countries: [il, ps, lb]
    body:
      - On 22 August 1191 Richard led the army south from Acre along the coast towards Jaffa, the port nearest Jerusalem, with the fleet keeping pace offshore. Marching in close order, with infantry and crossbowmen shielding the knights and the baggage on the seaward side, the crusaders bore daily attacks by Saladin’s horse archers. On 7 September, on the plain north of Arsuf, Saladin threw his whole army at them. The Hospitallers in the rear charged before Richard gave the signal, and Richard sent in the rest of the knights. Saladin’s army was driven from the field, though not destroyed.
      - Richard occupied Jaffa on 10 September, while Saladin had the walls of Ascalon pulled down so the crusaders could not use them. Twice, in January and in June 1192, the crusaders came within a day’s march of Jerusalem at Beit Nuba, and twice turned back, since even if they took the city they could not hold it once the crusaders went home. In April 1192 the barons chose Conrad as king, but on 28 April he was murdered in Tyre by two Assassins. Henry of Champagne married the widowed Isabella and ruled in his place, and Guy was compensated with Cyprus.
    facts:
      - [Battle of Arsuf, "7 September 1191, crusader victory"]
      - [Advances on Jerusalem, "January and June 1192, turned back at Beit Nuba"]
      - [Conrad of Montferrat murdered, 28 April 1192]
    markers:
      - kind: battle
        side: cr
        name: Battle of Arsuf
        date: 7 September 1191
        text: The only great pitched battle between Richard and Saladin. The crusaders’ charge broke the Ayyubid army, which rallied in the woods inland.
        lonlat: [34.812, 32.203]
        lp: l
      - kind: taken
        side: cr
        name: Jaffa
        date: 10 September 1191
        text: The crusaders found the town’s walls destroyed and spent weeks rebuilding them.
        lonlat: [34.753, 32.052]
        lp: l
      - kind: event
        name: Beit Nuba
        date: January and June 1192
        text: The furthest point of Richard’s two advances on Jerusalem. From the hills nearby, tradition says, he refused to look at the city he could not take.
        lonlat: [35.032, 31.853]
      - kind: event
        side: ay
        name: Ascalon
        date: September 1191
        text: Saladin had the town’s walls demolished rather than let the crusaders use it as a base. Richard rebuilt them in 1192.
        lonlat: [34.558, 31.671]
      - kind: event
        name: Tyre
        date: 28 April 1192
        text: Conrad of Montferrat was stabbed in the street by two members of the Nizari Isma‘ili sect known as the Assassins, days after his election as king.
        lonlat: [35.196, 33.271]
    arrows:
      - side: cr
        label: Richard I
        via: [[35.08, 32.92], [34.89, 32.5], [34.81, 32.21], [34.76, 32.07]]
      - side: cr
        label: 1192
        via: [[34.77, 32.04], [34.87, 31.93], [35.02, 31.86]]
  - title: Jaffa and the Treaty of Jaffa
    date: July–October 1192
    when: "1192-07-27"
    borders: "1192-09-02"
    countries: [il, ps, cy, at]
    body:
      - While Richard was at Acre preparing to sail home, Saladin attacked Jaffa on 27 July 1192, broke into the town after three days and was about to take the citadel. Richard hurried south by sea with a few galleys, waded ashore and drove the Ayyubid troops out. A few days later, in early August, Saladin attacked Richard’s small camp outside the walls. Richard had about 2,000 men, mostly Italian crossbowmen and spearmen, and only some fifty knights. The spearmen knelt behind their shields with the crossbowmen between them, beat off repeated cavalry charges, and Richard fought in the front line.
      - Both sides were exhausted, Richard was ill, and news from home urged him back. On 2 September 1192 he and Saladin agreed the Treaty of Jaffa, a truce of three years and eight months. The Franks kept the coast from Tyre to Jaffa; Ascalon was to be demolished and returned to Saladin; and Christian pilgrims could visit Jerusalem freely. Richard sailed on 9 October and was captured on his way home by Leopold of Austria, whom he had insulted at Acre. Saladin died in Damascus on 4 March 1193. The kingdom, now ruled from Acre, lasted another century.
    facts:
      - [Battle of Jaffa, "early August 1192, crusader victory"]
      - [Treaty of Jaffa, 2 September 1192]
      - [Truce, three years and eight months]
    markers:
      - kind: battle
        side: cr
        name: Battle of Jaffa
        date: early August 1192
        text: Richard’s small force of spearmen and crossbowmen held off Saladin’s cavalry all day. It was the last battle of the crusade.
        lonlat: [34.753, 32.052]
        lp: l
      - kind: treaty
        name: Treaty of Jaffa
        date: 2 September 1192
        text: Negotiated through envoys, as Richard and Saladin never met. Muslims and Christians were free to travel through each other’s lands.
        lonlat: [34.862, 31.927]
      - kind: event
        side: ay
        name: Ascalon
        date: "1192"
        text: Under the treaty the town, which Richard had refortified, was demolished again and handed back to Saladin.
        lonlat: [34.558, 31.671]
      - kind: event
        side: cr
        name: Acre
        date: 9 October 1192
        text: Richard sailed from here for Europe. He was imprisoned by Leopold of Austria and the emperor Henry VI until February 1194.
        lonlat: [35.082, 32.928]
    arrows:
      - side: cr
        label: Richard, by sea
        via: [[35.07, 32.93], [34.83, 32.5], [34.73, 32.07]]
      - side: ay
        label: Saladin
        via: [[34.9, 31.9], [34.82, 31.98], [34.77, 32.04]]
