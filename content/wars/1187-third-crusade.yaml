id: third-crusade
name: Third Crusade
start: "1187-05-01"
end: "1192-09-02"
tier: A
summary: The war that followed Saladin’s destruction of the army of the Kingdom of Jerusalem at Hattin in 1187 and his capture of Jerusalem. Frederick Barbarossa’s German army crossed Anatolia but broke up after he drowned in Cilicia; Philip II of France and Richard I of England, who conquered Cyprus on the way, retook Acre in 1191, and Richard beat Saladin at Arsuf and Jaffa but did not try to take Jerusalem. The Treaty of Jaffa of 1192 left the crusaders a coastal kingdom from Tyre to Jaffa, with access to Jerusalem for Christian pilgrims.
