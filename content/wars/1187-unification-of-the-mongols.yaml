notes:
  - "The story rests on a few sources written after the events and from the victors’ side: the Secret History of the Mongols (written in Mongolian in the 13th century, probably 1228 or 1252), the Persian history of Rashid al-Din (about 1300–1310), a Chinese chronicle of Genghis Khan’s campaigns (the Shengwu qinzheng lu) and the official Yuan history (1370). They disagree on the order and dates of events, above all before 1196. Temüjin’s birth is put in 1155, 1162 or 1167 (most often 1162), his election as khan and the battle of Dalan Baljut in about 1187 or as late as 1193, and the battle of Köyiten in 1201 or 1202."
  - "The battle sites are known only from names in the chronicles, and most cannot be located closely. Markers for them are approximate, and the text says so."
  - "Names: Temüjin is Genghis (Chinggis) Khan; Toghrul, khan of the Kereit (Keraites), was given the Jin title wang, “prince”, and is known as Ong Khan or Wang Khan. The Mongol confederation before 1206 is sometimes called the Khamag Mongol."
