  - title: Genghis Khan
    date: 1205–1209
    when: "1206"
    borders: "1206-06"
    countries: [mn, kz, ru]
    body:
      - In 1205 Jamukha, a fugitive with a handful of men, was seized by his own companions and handed over to Temüjin, who had the traitors executed. According to the Secret History, Temüjin offered his old anda his friendship again; Jamukha asked to die instead, and was put to death without his blood being shed, as befitted a noble. Other accounts tell of a crueller end.
      - In the spring of 1206 an assembly (kurultai) of the princes and commanders met at the source of the Onon. Under a white banner with nine tails, Temüjin was proclaimed Genghis (Chinggis) Khan, a title whose meaning is still debated, and his state was named the Great Mongol State (Yeke Mongghol Ulus). He divided its people into 95 units of a thousand under commanders he named, many of them men of humble birth, and ended the old tribal divisions; Tatars, Kereit, Naiman and Merkits became “people of the felt-walled tents” under one ruler.
      - The last enemies were hunted down. Buyruq Khan was surprised and killed in the winter of 1206. In late 1208 or early 1209 a Mongol army guided by the Oirat chief Qutuqa Beki caught Toqto’a and Kuchlug where the Bukhtarma joins the Irtysh. Toqto’a was killed and many of his men drowned; Kuchlug fled to the Qara Khitai, and Toqto’a’s sons to the Kipchak steppe, where the Mongols defeated them again in 1217–1218. Genghis Khan had already turned to the forest peoples of Siberia and to the Western Xia, and would soon attack the Jin.
    facts:
      - [Jamukha executed, "1205 (1206 in some sources)"]
      - [Kurultai at the source of the Onon, "spring 1206"]
      - [Units of a thousand, "95"]
      - [Battle on the Irtysh, "late 1208 or early 1209"]
    markers:
      - kind: event
        side: mon
        name: Source of the Onon
        date: spring 1206
        text: The kurultai that proclaimed Temüjin Genghis Khan of the Great Mongol State met near the source of the Onon in the Khentii mountains.
        lonlat: [108.788, 48.841]
      - kind: battle
        side: mon
        name: Irtysh and Bukhtarma
        date: late 1208 or early 1209
        text: The Mongols defeated the last Merkit and Naiman forces. Toqto’a was killed by an arrow; Kuchlug escaped to the Qara Khitai.
        lonlat: [83.800, 49.600]
    arrows:
      - side: mon
        label: To the Irtysh
        via: [[97.000, 49.900], [92.000, 50.000], [87.500, 49.300], [84.200, 49.550]]
      - side: nai
        label: Kuchlug
        via: [[83.600, 49.400], [82.300, 47.000], [80.500, 45.000], [77.000, 43.200]]
