  - title: The break with Toghrul
    date: spring – autumn 1203
    when: "1203"
    borders: "1203-10"
    countries: [mn, cn]
    body:
      - Temüjin asked for a daughter of Toghrul for his son Jochi and offered a daughter of his own to Toghrul’s grandson. Toghrul’s son Senggüm, who saw Temüjin as a rival for his father’s inheritance, refused, and with Jamukha and Altan and Quchar he persuaded the old khan to strike. The Kereit invited Temüjin to a betrothal feast, meaning to seize him; two herdsmen overheard the plan and warned him. Pursued by a larger army, Temüjin fought it at Qalaqaljid Sands in the east of Mongolia and was badly beaten. His son Ögedei was wounded and found only after the battle.
      - Temüjin fell back with a few thousand men along the Khalkh river to Baljuna, a lake or river whose site is unknown. There, according to the Chinese and Persian sources, he and a small band of followers drank its muddy water and swore to share his fortune. The nineteen “Baljuna drinkers” came from many peoples and faiths, among them Khitans, Kereit and Naiman, three Muslim merchants, Christians and Buddhists.
      - Over the summer he regathered his forces. In the autumn his brother Qasar sent Toghrul false messages of submission, and Temüjin’s army rode through the night and surprised the Kereit at their camp at Jeje’er Heights. After three days of fighting the Kereit surrendered and were divided among the Mongols. Toghrul fled west and was killed by a Naiman officer who did not recognise him; Senggüm escaped to the Western Xia and was later killed further west.
    facts:
      - [Battle of Qalaqaljid Sands, "1203, Kereit victory"]
      - [Baljuna Covenant, "summer 1203"]
      - [Kereit surrender at Jeje’er Heights, "autumn 1203"]
    markers:
      - kind: battle
        side: ker
        name: Qalaqaljid Sands (approximate)
        date: "1203"
        text: Toghrul’s and Jamukha’s army defeated Temüjin, who escaped east along the Khalkh river.
        lonlat: [116.800, 47.100]
      - kind: event
        side: mon
        name: Baljuna (approximate)
        date: summer 1203
        text: Temüjin and his remaining followers swore to share his fortune. The site is unknown; the most likely place is on the Khalkh river.
        lonlat: [118.600, 47.600]
        lp: r
      - kind: taken
        side: mon
        name: Jeje’er Heights (approximate)
        date: autumn 1203
        text: Temüjin surprised Toghrul’s camp after a night march. The Kereit surrendered after three days; the site lay somewhere between the Kherlen and the Tuul.
        lonlat: [108.300, 47.500]
