  - title: The gur-khan, the Taichiud and the end of the Tatars
    date: 1200–1202
    when: "1201"
    borders: "1201-06"
    countries: [mn, cn]
    body:
      - In 1200 Temüjin and Toghrul defeated the Taichiud, the lineage that had abandoned Temüjin’s family, on the Onon. Temüjin was wounded in the neck by an arrow; the archer, a Taichiud warrior later known as Jebe, “the arrow”, went over to him and became one of his greatest generals. The peoples who feared the two allies, among them the Tatars, Merkits, Oirats, Onggirat, Ikires, Qatagin, Salji’ut and Dörben, with the Naiman Buyruq Khan and the remaining Taichiud, met by the Kan river in the Ergune region in 1201 and raised Jamukha as gur-khan, “universal khan”.
      - Temüjin was warned and struck first. The coalition broke up after a battle in the Ergune region, and again at Köyiten, near Lake Buir, where its shamans tried to call up a storm that blew back into their own faces; the date is given as 1201 or 1202. Jamukha plundered his own allies on the way back and went over to Toghrul. Temüjin then destroyed what was left of the Taichiud.
      - In 1202 he turned on the Tatars, the enemies of his father, and defeated them at Dalan Nemürges, near the Khalkh river. Before the battle he forbade his men to stop and loot until the fighting was over, and punished the princes Altan and Quchar when they disobeyed; they left him and joined his enemies. The Tatar men were killed, all those, the Secret History says, taller than the linchpin of a cart, and the women and children were divided among the Mongols. Two Tatar sisters, Yisügen and Yisüi, became Temüjin’s wives.
    facts:
      - [Taichiud defeated on the Onon, "1200"]
      - [Jamukha raised as gur-khan, "1201"]
      - [Battle of Köyiten, "1201 or 1202"]
      - [Tatars destroyed, "1202, Dalan Nemürges"]
    markers:
