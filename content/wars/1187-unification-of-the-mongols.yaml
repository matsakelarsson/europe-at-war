  - title: Khan of the Mongols, and Dalan Baljut
    date: about 1186 – 1195
    when: "1187"
    borders: "1187"
    countries: [mn]
    body:
      - Temüjin and Jamukha camped together for a year and a half and then parted. Many Mongol families followed Temüjin, and a group of senior Borjigin princes, among them Altan, Quchar and Sacha Beki of the Jurkin, elected him khan of the Mongols. Mongolian tradition places the election at the Blue Lake (Köke Na’ur) near the Kherlen in 1189; most historians date it a few years earlier or later. Temüjin rewarded his early companions, such as Bo’orchu and Jelme, with posts in his household, and promoted followers for loyalty rather than birth.
      - When Jamukha’s younger brother Taichar was killed while stealing horses from one of Temüjin’s men, Jamukha attacked with a coalition of thirteen groups, about 30,000 men by one count. At Dalan Baljut, near the Onon, Temüjin was beaten and fell back into a gorge of the river. Later Persian accounts claim a victory for him, but the earliest sources agree it was a defeat. Jamukha is said to have boiled seventy young captives alive in cauldrons, and the cruelty drove some of his allies over to Temüjin.
      - After the battle Temüjin vanishes from the sources for almost a decade. A Song envoy of the 1220s, Zhao Hong, wrote that he had been a slave of the Jin for some years, and several historians think it likely that he spent part of this time in north China or in the service of the Jin. He reappears in 1195 or 1196.
    facts:
      - [Elected khan of the Mongols, "about 1186–1189"]
      - [Battle of Dalan Baljut, "about 1187 (1193 in some accounts), Jamukha victory"]
      - [Jamukha’s army, "about 30,000 men"]
    markers:
      - kind: event
        side: mon
        name: Blue Lake (Köke Na’ur)
        date: about 1189
        text: Where Mongolian tradition places Temüjin’s election as khan. A small lake in the Khentii foothills is commemorated as the site.
        lonlat: [108.948, 48.020]
        lp: b
      - kind: battle
        side: jam
        name: Dalan Baljut (approximate)
        date: about 1187
        text: Jamukha defeated Temüjin near the Onon. Temüjin withdrew into the Jerene gorge of the river.
        lonlat: [110.300, 48.900]
    arrows:
      - side: jam
        label: Jamukha
        via: [[111.800, 49.400], [111.000, 49.150], [110.400, 48.950]]
  - title: With the Jin against the Tatars
    date: 1196–1199
    when: "1196"
    borders: "1196-06"
    countries: [mn, cn]
    body:
      - In 1196 the Jin turned against the Tatars, long their allies on the steppe, who had grown too strong and unruly, and the Jin chancellor Wanyan Xiang led an army north against them. As the Tatars under Megüjin Se’ültü retreated up the Ulja (Ulz) river, Temüjin and Toghrul fell on their fortified camps from the north, killed Megüjin and took rich booty. The Jin rewarded Toghrul with the title wang, prince, from which he became Ong Khan, and gave Temüjin a lesser Jin title. The victory also avenged the death of Temüjin’s father.
      - The Jurkin princes had refused to join the campaign and had plundered Temüjin’s camp while he was away. He attacked them in 1196 and again in the winter of 1197–1198, absorbed their people and had their leaders Sacha Beki and Taichu executed. He also helped Toghrul back to power after a brother, supported by the Naiman, had driven him into exile.
      - In 1199 Temüjin and Toghrul campaigned together against Buyruq Khan, one of the two Naiman rulers who had divided the Naiman lands after the death of their father in 1198. On the way back Toghrul slipped away by night and left Temüjin alone facing a Naiman army; the two khans made up their quarrel, but mistrust between them grew.
    facts:
      - [Jin campaign against the Tatars, "1196, led by Wanyan Xiang"]
      - [Tatar khan Megüjin Se’ültü killed, "1196"]
      - [Jurkin leaders executed, "1197–1198"]
    markers:
      - kind: battle
        side: mon
        name: Ulja (Ulz) river (approximate)
        date: "1196"
        text: Temüjin and Toghrul stormed the Tatar camps as the Tatars fled from the Jin army. Megüjin Se’ültü was killed.
        lonlat: [113.500, 49.400]
      - kind: battle
        side: jin
        name: Kherlen
        date: "1196"
        text: The Jin army of Wanyan Xiang drove the Tatars north from the Kherlen towards the Ulja.
        lonlat: [116.000, 47.800]
        lp: b
      - kind: event
        side: tat
        name: Tatar lands
        date: 1190s
        text: The Tatars grazed their herds around the Buir and Hulun lakes and the Khalkh river.
        lonlat: [117.700, 48.400]
