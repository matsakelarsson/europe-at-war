  - title: Chakirmaut and the Naiman
    date: 1204
    when: "1204-05"
    borders: "1204-05"
    countries: [mn]
    body:
      - The Naiman of the west, now the strongest people left on the steppe, prepared to finish Temüjin. Their ruler Tayang Khan sought allies, and Jamukha, the Merkit chief Toqto’a, the Oirats and the remnants of the Kereit, Tatars and Taichiud joined him; the Ongud on the Jin frontier refused and warned Temüjin. In the spring of 1204 Temüjin reorganised his army into units of tens, hundreds and thousands under commanders he chose himself and formed a guard of picked men, the keshig. Then he marched west from the Khalkh river.
      - Tayang marched east from the Altai down the Tamir and crossed the Orkhon. Temüjin’s scouts made each man light five fires at night on the Sa’ari steppe to make his army seem larger. At Chakirmaut, at the foot of Mount Naqu east of the Orkhon (some accounts place the battle in the Altai), the Mongols drove the Naiman back up the mountain in May 1204, and many fell to their deaths in the ravines while fleeing at night. Tayang was mortally wounded, and the Naiman people submitted. His son Kuchlug escaped to his uncle Buyruq. Jamukha left the Naiman before the end of the battle.
      - In the autumn Temüjin defeated the Merkits of Toqto’a, who fled to Buyruq; some Merkit clans submitted, and one of their chiefs gave his daughter Qulan to Temüjin. With the Naiman beaten, nobody on the Mongolian steppe could challenge him.
    facts:
      - [Army reorganised in units of 10, 100 and 1,000, "spring 1204"]
      - [Battle of Chakirmaut, "May 1204, Mongol victory"]
      - [Merkits of Toqto’a defeated, "autumn 1204"]
    markers:
      - kind: battle
        side: mon
        name: Chakirmaut (approximate)
        date: May 1204
        text: Temüjin defeated the Naiman of Tayang Khan, with Jamukha and the Merkits, at the foot of Mount Naqu. Tayang was killed and Kuchlug fled.
        lonlat: [103.600, 47.700]
      - kind: event
        side: nai
        name: Naiman lands
        date: "1204"
        text: The Naiman ruled western Mongolia from the Khangai to the Altai and the Irtysh.
        lonlat: [92.000, 47.800]
