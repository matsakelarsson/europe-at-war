id: unification-of-the-mongols
name: Unification of the Mongol tribes
start: "1187"
end: "1206"
tier: A
summary: "The wars in which Temüjin, a chief of the Borjigin Mongols on the Onon River, brought the peoples of the Mongolian steppe under his rule and took the title Genghis (Chinggis) Khan. With his patron Toghrul, khan of the Kereit, and his sworn brother Jamukha he defeated the Merkits; elected khan of the Mongols in the 1180s, he was beaten by Jamukha at Dalan Baljut and disappears from the record for some years. From 1196 he fought the Tatars as an ally of the Jin dynasty, crushed the Taichiud and a coalition that had made Jamukha its gur-khan, and in 1202 destroyed the Tatars. In 1203 Toghrul turned on him and routed him at Qalaqaljid Sands, but within months Temüjin surprised and absorbed the Kereit. In 1204 he defeated the Naiman of Tayang Khan at Chakirmaut and then the Merkits. Jamukha was handed over by his own men and put to death, and in 1206 a great assembly at the source of the Onon proclaimed Temüjin Genghis Khan of the Great Mongol State. The last Merkit and Naiman leaders were defeated on the Irtysh in 1208–1209."
