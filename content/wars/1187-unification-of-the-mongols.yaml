steps:
  - title: Temüjin and the Merkits
    date: 1170s–1180s
    when: "1185"
    borders: "1185"
    countries: [mn, ru]
    body:
      - In the 12th century the Mongolian steppe was divided among peoples of herders and hunters, each led by its own khans and chiefs. The Kereit held the centre around the Tuul and Orkhon rivers, the Naiman the west up to the Altai and the Irtysh, the Merkits the lower Selenge south of Lake Baikal, and the Tatars the east around the Buir and Hulun lakes, where they often served the Jin dynasty of northern China against their neighbours. The Mongols proper, between the Onon and the Kherlen, had been united under khans of their own earlier in the century but were now split among rival lineages such as the Borjigin, the Taichiud and the Jurkin.
      - Temüjin was the son of Yesügei, a Borjigin chief, and his wife Hö’elün, whom Yesügei had carried off from a Merkit. When Temüjin was about nine, Tatars poisoned his father, and the Taichiud abandoned the widow and her children. The family survived by hunting and fishing; Temüjin was once captured by the Taichiud and escaped. As a young man he married Börte of the Onggirat and won the protection of Toghrul, khan of the Kereit and a sworn brother of his father.
      - Soon afterwards about 300 Merkits raided his camp in revenge for Hö’elün and carried off Börte, while Temüjin hid on the mountain of Burkhan Khaldun. He turned to Toghrul and to his own sworn brother (anda) Jamukha of the Jadaran, and the three, with a large force (20,000 men each from Toghrul and Jamukha, according to the Secret History), fell on the Merkits by night and freed Börte. Her first son, Jochi, was born soon after, and his parentage was questioned for the rest of his life. The date of the raid is uncertain; some historians think the story mixes it with a later campaign against the Merkits in about 1191.
    facts:
      - [Temüjin born, "about 1162 (1155 and 1167 in some sources)"]
      - [Merkit raid on his camp, "about 300 riders"]
    markers:
