id: oshu-campaign
name: Ōshū campaign
start: "1189"
end: "1189"
tier: C
summary: "The campaign in which Minamoto no Yoritomo destroyed the Northern Fujiwara of Hiraizumi, who had ruled Mutsu and Dewa for a century, and brought the warriors of all Japan under his regime in Kamakura. Yoritomo’s brother Yoshitsune, who had fallen out with him after the Genpei War, had found refuge with Fujiwara no Hidehira at Hiraizumi. After Hidehira’s death his son Yasuhira gave in to pressure from Kamakura and the court and attacked Yoshitsune at his residence on the Koromo River in the leap fourth month of 1189; Yoshitsune killed himself. Yoritomo marched north anyway, without waiting for an imperial mandate, with three armies, along the Pacific coast, the inland road and the Sea of Japan coast, raised from across the country. On the tenth day of the eighth month his army stormed the earthworks the Fujiwara had built at Atsukashiyama, where Yasuhira’s half-brother Kunihira was killed; Yasuhira abandoned Taga and set fire to Hiraizumi, which the Kamakura army entered on the 22nd. Fleeing north, Yasuhira was killed by one of his own retainers, Kawada Jirō, early in the ninth month. Yoritomo executed the killer, displayed Yasuhira’s head as his ancestor Minamoto no Yoriyoshi had displayed Abe no Sadato’s, and made Kasai Kiyoshige his commissioner for Mutsu. A rising by a former Fujiwara vassal, Ōkawa Kanetō, was put down in 1190. Yoritomo was appointed shōgun in 1192."
