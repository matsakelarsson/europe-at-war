notes:
  - The main source, the Azuma kagami, is a chronicle of the Kamakura shogunate; the old name “Ōshū punitive expedition” (Ōshū seibatsu) follows its view, and Japanese historians now prefer “Ōshū campaign” (Ōshū kassen). Some historians count it as the last campaign of the Genpei War. Dates are months of the Japanese lunar calendar.
