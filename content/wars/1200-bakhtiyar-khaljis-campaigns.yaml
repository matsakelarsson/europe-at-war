  - title: The expedition towards Tibet
    date: "1206"
    when: "1206-03"
    borders: "1206-03"
    countries: [in, cn]
    body:
      - Early in 1206 Bakhtiyar set out from Devkot with, Minhaj says, about 10,000 horsemen to attack Tibet, perhaps to win control of the trade in horses that came down from the mountains. He was guided by Ali Mech, a chief of the Mech people of the foothills who had become a Muslim. After crossing a river by an old stone bridge of many arches, the army marched for about two weeks into the hills and reached open country, where it was attacked from every side by the local people. The ruler of Kamarupa, whom Bakhtiyar had asked to join him, refused.
      - On the retreat the army ran out of food and ate its horses, and when it came back to the river it found the bridge broken. Many men drowned trying to cross, and Minhaj says that only about a hundred reached Devkot. A rock inscription at Kanai-barasi-bowa near Guwahati records the destruction of the Turks who came to Kamarupa in March 1206. Bakhtiyar fell ill at Devkot and died later that year; Minhaj reports that he was stabbed by one of his officers, Ali Mardan Khalji. His Khalji successors fought among themselves for Bengal, which was only loosely tied to Delhi until the 1220s.
    facts:
      - [Expedition, "March–June 1206"]
      - [Survivors, "about 100 of some 10,000, according to Minhaj"]
      - [Death of Bakhtiyar, "1206, at Devkot"]
