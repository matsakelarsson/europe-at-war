steps:
  - title: Bihar, Nadia and Lakhnauti
    date: about 1200–1205
    when: "1200"
    borders: "1205"
    countries: [in, bd]
    body:
      - Bakhtiyar was a Khalaj Turk from Garmsir on the Helmand. According to Minhaj-i-Siraj he was turned away from the army at Ghazni and at Delhi because of his unpromising looks, and found service under the Ghurid governor of Awadh, who gave him two estates near Mirzapur. From there, with Khalji followers who gathered round him, he raided Bihar, then held by local chiefs and the remnants of Pala and Gahadavala power. In about 1200 he took a walled place that Minhaj calls the city of Bihar, killed its shaven-headed inhabitants and found that it was a college full of books. It was the Buddhist monastery of Odantapuri. The monasteries of Vikramashila and Nalanda were also destroyed or abandoned in these years, a blow from which Buddhism in its Indian homeland did not recover.
      - In 1203 Bakhtiyar brought his plunder to Qutb al-Din Aibak at Badaun and was confirmed in his conquests. He then turned on Bengal, ruled by the aged Sena king Lakshmana Sena. Marching through the forests of Jharkhand, he rode so fast that only eighteen horsemen kept up with him when he reached Nadia (Nabadwip). The townspeople took the party for horse-dealers; the guards were cut down at the palace gate, and Lakshmana Sena, at his meal, escaped by a back door and fled to Vikrampur in eastern Bengal. The main army arrived and plundered Nadia. Bakhtiyar made Lakhnauti, the old city of Gauda, his capital and ruled the land from Purnia and Devkot to Rangpur, with Bihar, for the Ghurids, building mosques and colleges there.
    facts:
      - [Odantapuri sacked, "about 1200 (dates from 1193 to 1203 are given)"]
      - [Nadia taken, "about 1204 (estimates range from 1202 to 1205)"]
      - [Capital, "Lakhnauti (Gauda)"]
