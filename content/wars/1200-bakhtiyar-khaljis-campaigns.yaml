id: bakhtiyar-khaljis-campaigns
name: Bakhtiyar Khalji’s campaigns
start: "1200"
end: "1206"
tier: B
summary: The conquest of Bihar and north-western Bengal by Muhammad Bakhtiyar Khalji, a Turkish officer in the service of the Ghurids, and his failed expedition towards Tibet. From his fiefs near Mirzapur he raided Bihar, where the great Buddhist monasteries of Odantapuri and Vikramashila were destroyed in these years. In about 1204 he surprised the Sena king Lakshmana Sena at Nadia with a small advance party, made Lakhnauti (Gauda) his capital and ruled northern Bengal for the Ghurids. In 1206 he led about 10,000 horsemen north into the Himalaya to attack Tibet. The expedition ended in disaster; only about a hundred men came back, and Bakhtiyar died, perhaps murdered, at Devkot later that year. The Sena kings kept eastern Bengal for another half-century.
