notes:
  - Almost everything is known from one source, the Tabaqat-i Nasiri of Minhaj-i-Siraj Juzjani, who visited Bengal about forty years later and talked to men who had served with Bakhtiyar. Its dates are uncertain; modern estimates for the fall of Nadia range from 1202 to 1205.
  - Minhaj describes the sack of a walled place he calls Bihar, full of books and of shaven-headed men he took for Brahmins; it was the Buddhist monastery of Odantapuri, at today’s Bihar Sharif. Historians disagree on whether Bakhtiyar also destroyed Nalanda, which was attacked and declined in the same years.
  - The route of the Tibet expedition is uncertain. Some historians think it went up the Teesta valley through Sikkim to the Chumbi valley in Tibet; others that it never left the hills of Sikkim, Bhutan or Kamarupa.
