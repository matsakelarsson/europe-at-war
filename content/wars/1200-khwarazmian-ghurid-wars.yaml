  - title: Gurganj and Andkhud
    date: 1204–1206
    when: "1204-09-29"
    borders: "1204-10"
    countries: [af, tm, uz]
    body:
      - In the spring of 1204, while Mu’izz al-Din was putting down a revolt at Lahore, Muhammad besieged Herat from March to May and forced its governor to pay him off. Mu’izz al-Din answered with a full invasion of Khwarazm. Marching by way of Merv, he defeated the Khwarazmians east of Gurganj and laid siege to the capital, but his army was held up by flooding and the townspeople, rallied by the Shah’s mother Terken Khatun and a Shafi’i preacher, defended the walls. Muhammad had appealed to his overlords, the Qara Khitai, who sent a large army under their general Tayangu with Uthman, the Karakhanid khan of Samarkand.
      - Mu’izz al-Din broke off the siege and retreated up the Amu Darya, losing heavily to the pursuing Khwarazmians near Hazarasp. On 29 September 1204 the Qara Khitai caught his tired army near Andkhud and routed it; Mu’izz al-Din, wounded, took refuge in the fortress there and was allowed to go only after Uthman intervened and he paid a heavy ransom, including an elephant. The Ghurids gave up Khorasan except Herat and Balkh. News of the disaster set off revolts across the Ghurid empire, which Mu’izz al-Din put down; in 1205 his governor of Balkh took Termez from the Qara Khitai, and he was preparing a new war beyond the Oxus when he was assassinated on the Jhelum on 15 March 1206.
    facts:
      - [Siege of Herat, "March – May 1204"]
      - [Battle of Andkhud, "29 September 1204, Qara Khitai and Khwarazmian victory"]
      - [Mu’izz al-Din assassinated, "15 March 1206"]
