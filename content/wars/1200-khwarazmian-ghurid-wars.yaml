  - title: Herat, Firuzkuh and Ghazni
    date: 1206–1216
    when: "1208-07"
    borders: "1215-12"
    countries: [af]
    body:
      - After Mu’izz al-Din’s death the Ghurid empire broke apart. His Turkish slave commanders took over the Indian conquests, Qutb al-Din Aibak at Lahore and Delhi, Nasir al-Din Qubacha at Multan and Taj al-Din Yildiz at Ghazni, while Ghiyath al-Din’s son Mahmud held Firuzkuh and Ghor. In 1206 the governor of Herat, Husayn ibn Kharmil, went over to the Khwarazmshah, and Muhammad besieged Balkh, which surrendered in November, then took Termez, Taliqan, Maymana and Andkhud.
      - When Muhammad was defeated by the Qara Khitai in 1207, Herat rose against its Khwarazmian masters. The besiegers dammed the streams around the city and let the water loose to undermine the walls, which only turned the ground to mud; Muhammad took the city by storm in July 1208, after a riot over food inside the walls. Mahmud of Ghor became the Khwarazmshah’s vassal and was later killed. In November and December 1215 Muhammad took Firuzkuh and Bamyan and deposed the last Ghurid princes, and the governor of Ghazni handed the city over to him while Yildiz was away; Yildiz fled to India, where Iltutmish of Delhi defeated and executed him in 1216. Muhammad made his eldest son, Jalal al-Din, governor of Ghazni, three years before the Mongols came.
    facts:
      - [Balkh surrenders, "November 1206"]
      - [Herat stormed, "July 1208"]
      - [Firuzkuh and Bamyan taken, "November – December 1215"]
