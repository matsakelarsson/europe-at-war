steps:
  - title: Khorasan changes hands
    date: 1200–1203
    when: "1201-04"
    borders: "1201-06"
    countries: [ir, tm, af]
    body:
      - The Khwarazmshah Tekish, who had taken most of Khorasan and western Iran from the last Seljuks, died on 3 July 1200. His son Ala al-Din Muhammad II was challenged by a nephew, Hindu Khan, who held Merv and asked the Ghurids for help. The Ghurid sultan Ghiyath al-Din and his brother Mu’izz al-Din, rulers of an empire that reached from Herat to the Ganges, saw their chance. Early in 1201 their armies, with Indian war elephants, took Merv, Sarakhs, Nasa, Abivard and Tus, and in April Nishapur surrendered after a short siege. Mu’izz al-Din raided on towards Gorgan and Bistam, plundering as he went, which led to the only recorded quarrel between the brothers.
      - Muhammad gathered his army at Gurganj and struck back in the autumn. He retook Merv in September 1201 and Nishapur after a two-month siege, letting the Ghurid garrison go home, but was tricked at Sarakhs, whose defenders promised to surrender and instead used the respite to bring in food. In early 1202 he besieged Herat, but withdrew when Mu’izz al-Din came up from Ghazni, and the Ghurids occupied Merv again. Ghiyath al-Din died in Herat early in 1203, leaving Mu’izz al-Din sole sultan, and soon afterwards the Khwarazmians took Merv once more and beheaded its Ghurid governor.
    facts:
      - [Death of Tekish, "3 July 1200"]
      - [Nishapur taken by the Ghurids, "April 1201"]
      - [Merv retaken by Muhammad II, "September 1201"]
