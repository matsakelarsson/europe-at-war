notes:
  - The chronicles of Juzjani, who served the Ghurids, Juvayni and Ibn al-Athir disagree on the order of events in 1201–1204 and on who did what at Andkhud; some accounts give the Khwarazmians the main part in the battle, others the Qara Khitai.
  - Ghiyath al-Din died in Herat in early 1203 (13 March in most accounts). Mu’izz al-Din was killed on 15 March 1206 at Dhamiak on the Jhelum, by Ismaili assassins or by Khokhar tribesmen; the sources differ.
