id: khwarazmian-ghurid-wars
name: Khwarazmian–Ghurid wars
start: "1200"
end: "1215"
tier: B
summary: The struggle between the Khwarazmshah Ala al-Din Muhammad II and the Ghurid sultans for Khorasan after the collapse of Seljuk rule there. The Ghurid brothers Ghiyath al-Din and Mu’izz al-Din overran Khorasan in 1201, but the Khwarazmshah won most of it back. In 1204 Mu’izz al-Din invaded Khwarazm itself, was forced back from its capital Gurganj and was routed at Andkhud by the Qara Khitai, the Khwarazmshah’s overlords. After his assassination in 1206 the Ghurid state broke up, and by 1215–1216 Muhammad had taken Herat, Firuzkuh, Bamyan and Ghazni, while the Ghurids’ Indian conquests passed to their Turkish commanders in Delhi, Multan and Lahore.
countries: [af, ir, tm, uz]
