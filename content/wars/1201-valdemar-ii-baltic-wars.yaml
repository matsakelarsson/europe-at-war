steps:
  - title: North of the Elbe
    date: 1201–1216
    when: "1201"
    borders: "1214"
    countries: [dk, de]
    body:
      - In 1201 Duke Valdemar of Schleswig, younger brother of King Canute VI, defeated Count Adolf III of Holstein at Stellau and captured him at Hamburg. Holstein and Lübeck submitted to Danish rule, and the count only bought his freedom in 1203 by giving up his claims. Valdemar became king on his brother’s death in November 1202 and set his nephew Albert of Orlamünde over Holstein.
      - Taking advantage of the struggle for the German crown, Valdemar extended Danish power along the coast as far as Pomerania, and fought for control of the lower Elbe and Hamburg. In 1214 the young emperor Frederick II, in need of allies, formally granted Denmark all the lands north of the Elbe and the Elde. Denmark was then the leading power of the Baltic.
    facts:
      - [Battle of Stellau, "1201, Danish victory"]
      - [Valdemar II king, "November 1202"]
      - [Golden Bull of Eger, "1214: Frederick II recognises Danish rule north of the Elbe"]
    markers:
      - kind: battle
        side: dk
        name: Battle of Stellau
        date: "1201"
        text: Duke Valdemar’s army beat Count Adolf of Holstein near Wrist, in western Holstein.
        lonlat: [9.78, 53.94]
      - kind: taken
        side: dk
        name: Hamburg
        date: "1201"
        text: Adolf fell back on Hamburg, where Valdemar besieged and captured him.
        lonlat: [10.0, 53.55]
      - kind: taken
        side: dk
        name: Lübeck
        date: "1201"
        text: The young trading city submitted to the Danish king and kept its privileges.
        lonlat: [10.686, 53.87]
    arrows:
