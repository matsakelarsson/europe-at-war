notes:
  - Valdemar is remembered in Denmark as Valdemar Sejr, “the Victorious”. The main sources are German chronicles, Henry of Livonia’s chronicle for Estonia, and later Danish annals; numbers in them are unreliable.
  - The legend that the Danish flag, the Dannebrog, fell from the sky at Lyndanisse is first recorded about three centuries after the battle.
