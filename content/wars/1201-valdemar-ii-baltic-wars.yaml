id: valdemar-ii-baltic-wars
name: Wars of Valdemar II
start: "1201"
end: "1227-07-22"
tier: B
summary: The wars by which Valdemar II of Denmark built a Baltic empire stretching from Holstein and Lübeck to northern Estonia, and then lost most of it. After his kidnapping by a German count in 1223, his north German lands broke away, and his defeat at Bornhöved in 1227 pushed Denmark’s border back to the Eider.
countries: [dk, de, ee]
sides:
  - id: dk
    name: Denmark
    polities: [denmark]
    ink: red
    moves: Danish moves
    success: Danish success
  - id: nde
    name: North German princes and cities
    polities: [holstein, lubeck]
    ink: slate
    moves: North German moves
    success: North German success
  - id: est
    name: Estonians
    polities: [ests]
    ink: olive
    moves: Estonian moves
