notes:
  - Philip’s side of the story was told by his chaplain William the Breton, who also wrote a long poem on the king’s deeds; on John’s side the main sources are English chroniclers such as Roger of Wendover, who disliked him. Numbers at Bouvines are uncertain; modern estimates give each army between about 6,000 and 9,000 men.
