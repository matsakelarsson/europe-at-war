        side: fra
        name: Château Gaillard
        date: 1203 – 6 March 1204
        text: Philip starved and stormed Richard I’s castle on its cliff above Les Andelys. The townspeople who had taken refuge there were driven out and many died of cold and hunger between the lines.
        lonlat: [1.403, 49.238]
      - kind: taken
        side: fra
        name: Rouen
        date: 24 June 1204
        text: With no hope of help from John, the Norman capital opened its gates to Philip.
        lonlat: [1.099, 49.443]
      - kind: taken
        side: fra
        name: Chinon
        date: June 1205
