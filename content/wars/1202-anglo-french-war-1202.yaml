  - title: La Roche-aux-Moines and Bouvines
    date: 1213–1214
    when: "1213-05-30"
    borders: "1214-09-18"
    countries: [fr, gb, be, de]
    body:
      - John spent years raising money and allies to win back his lands. In 1213 Philip prepared to invade England, but on 30–31 May an English fleet under William Longespée, earl of Salisbury, caught the French fleet at Damme in Flanders with most of its crews ashore, captured some 300 ships and burned about 100 more. John then joined a coalition with his nephew, the Emperor Otto IV, Count Ferrand of Flanders, Count Renaud of Boulogne and princes of the Low Countries. The plan was to attack from two sides. John landed at La Rochelle in February 1214, won over some Poitevin lords and crossed into Anjou, but when Prince Louis came to relieve the castle of La Roche-aux-Moines on 2 July, the Poitevins would not fight and John retreated.
      - In the north Otto gathered the allied army at Valenciennes. On 27 July 1214, near the bridge of Bouvines between Lille and Tournai, Philip turned and gave battle. The allied infantry broke into the French centre and Philip was unhorsed, but the French knights routed the allied wings and centre; Otto fled, and Ferrand, Renaud and Salisbury were taken prisoner. On 18 September John agreed a five-year truce at Chinon and gave up hope of recovering the north. Otto lost his throne to Frederick II, and John came home weakened to face his rebellious barons, the beginning of the First Barons’ War.
    facts:
      - [Battle of Damme, "30–31 May 1213, English victory"]
      - [La Roche-aux-Moines, "2 July 1214, John retreats"]
      - [Battle of Bouvines, "27 July 1214, French victory"]
    markers:
      - kind: naval
        side: eng
        name: Battle of Damme
        date: 30–31 May 1213
        text: The English fleet found the French ships at anchor in the harbour of Bruges and destroyed the invasion fleet. Philip burned what was left.
        lonlat: [3.267, 51.25]
      - kind: event
        side: eng
        name: La Rochelle
        date: February 1214
        text: John landed in the port that had stayed loyal to him and spent the spring winning over the lords of Poitou.
        lonlat: [-1.152, 46.16]
      - kind: siege
        side: fra
        name: La Roche-aux-Moines
        date: 19 June – 2 July 1214
        text: John abandoned the siege of the castle on the Loire when Prince Louis approached, and his rearguard suffered in the retreat.
        lonlat: [-0.656, 47.384]
      - kind: battle
        side: fra
        name: Battle of Bouvines
        date: 27 July 1214
        text: One of the few great pitched battles of the age. The French took the imperial eagle standard, which Philip sent to Frederick II.
        lonlat: [3.225, 50.58]
      - kind: treaty
        name: Chinon
        date: 18 September 1214
        text: John and Philip agreed a truce for five years, which left Philip’s conquests in his hands.
        lonlat: [0.242, 47.167]
