id: anglo-french-war-1202
name: Anglo-French War of 1202–1214
start: "1202-04-28"
end: "1214-09-18"
tier: B
summary: The war in which Philip II of France took Normandy, Anjou, Maine and Touraine from King John of England in 1202–1205, ending the Angevin hold on northern France. John’s attempt to win them back with a coalition led by Emperor Otto IV failed at La Roche-aux-Moines and Bouvines in 1214.
