steps:
  - title: The fall of Normandy and Anjou
    date: 1202–1206
    when: "1202-04-28"
    borders: "1206-10-26"
    countries: [fr, gb]
    body:
      - In 1200 King John married Isabella of Angoulême, who had been promised to Hugh of Lusignan, and the Lusignans appealed to Philip II, John’s overlord for his lands in France. John refused to answer a summons to the French king’s court, which in April 1202 declared his French fiefs forfeit. Philip invaded Normandy and recognised John’s young nephew, Arthur of Brittany, as lord of Anjou, Maine, Touraine and Poitou. On 1 August, after a forced march from Le Mans, John surprised Arthur and the Lusignans besieging his mother, Eleanor of Aquitaine, at Mirebeau and captured them all. Arthur disappeared in prison in 1203, almost certainly killed on John’s orders, and many of John’s barons turned against him.
      - In the late summer of 1203 Philip laid siege to Château Gaillard, the great castle Richard I had built above the Seine to guard Normandy. John failed to relieve it and left the duchy in December. The castle fell on 6 March 1204, after French soldiers got in through a latrine chute, and on 24 June Rouen surrendered. Normandy, ruled with England since 1066, was lost. Philip went on to take Anjou, Maine, Touraine and much of Poitou; Chinon and Loches held out until 1205. John landed at La Rochelle in 1206, but the truce agreed at Thouars that October left him only Gascony, part of Poitou and, off the Norman coast, the Channel Islands.
    facts:
      - [Château Gaillard falls, "6 March 1204"]
      - [Rouen surrenders, "24 June 1204"]
      - [Left to John, "Gascony, part of Poitou and the Channel Islands"]
    markers:
      - kind: battle
        side: eng
        name: Mirebeau
        date: 1 August 1202
        text: John’s surprise attack freed his mother and captured Arthur, Hugh of Lusignan and some 250 knights. It was the high point of his war.
        lonlat: [0.183, 46.787]
