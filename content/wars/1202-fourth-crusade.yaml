steps:
  - title: Venice and Zara
    date: 1198–1203
    when: "1202-10"
    borders: "1202-11-24"
    countries: [it, hr, fr, be, hu]
    body:
      - Pope Innocent III called a new crusade in 1198 to recover Jerusalem, this time by attacking Egypt, the centre of Ayyubid power. Its leaders, mostly French and Flemish nobles under Boniface of Montferrat, agreed in 1201 that Venice would build a fleet to carry 33,500 men and 4,500 horses for 85,000 marks of silver. Venice put much of its trade aside for a year to build and crew the ships. But in the summer of 1202 only about a third of the expected army came to Venice, and the crusaders could not pay.
      - The aged and nearly blind doge, Enrico Dandolo, offered to put off the debt if the crusaders helped Venice recover Zara (Zadar), a Dalmatian port that had rebelled against Venice and put itself under the King of Hungary, who had himself taken the cross. Despite the pope’s ban, the fleet sailed in October 1202, reached Zara on 10 November and took it on 24 November; the city was sacked. Some crusaders, among them Simon de Montfort, refused to take part. Innocent excommunicated the army, then absolved the crusaders but not the Venetians.
      - At Zara envoys came from Alexios Angelos, son of the Byzantine emperor Isaac II, whom his brother Alexios III had deposed and blinded in 1195. If he were put on the throne, the young Alexios promised 200,000 marks, 10,000 soldiers for the crusade, 500 knights to guard the Holy Land and the submission of the Greek Church to Rome. Most of the leaders accepted, though many crusaders objected and some left for Syria on their own, and in April 1203 the fleet sailed for Constantinople.
    facts:
      - [Treaty of Venice, "1201, 85,000 marks for the fleet"]
      - [Siege of Zara, "10–24 November 1202"]
    markers:
      - kind: event
        side: ven
        name: Venice
        date: summer 1202
        text: The crusaders camped on the Lido while the Venetians waited for payment. In September Dandolo took the cross himself in St Mark’s.
        lonlat: [12.336, 45.438]
      - kind: taken
        side: ven
        name: Zara
        date: 24 November 1202
        text: The citizens hung crosses on the walls to remind the besiegers that they too were Christians. The city surrendered after two weeks and was sacked and divided between the Venetians and the crusaders.
        lonlat: [15.228, 44.114]
    arrows:
      - side: ven
        label: Crusader fleet
        via: [[12.4, 45.4], [13.6, 44.85], [15.18, 44.13]]
  - title: Constantinople, 1203
    date: June–August 1203
    when: "1203-06-24"
    borders: "1203-08-01"
    countries: [tr, gr, al]
    body:
      - The fleet called at Durazzo and Corfu, sailed up the Dardanelles and on 24 June 1203 anchored off Constantinople, the largest city in Christendom. The crusaders camped on the Asian shore, then on 5 July landed at Galata across the Golden Horn, took the tower that held the chain across the harbour and let the Venetian ships into the Horn. The city’s people showed no wish to welcome the young Alexios. On 17 July the crusaders attacked; the French assault near the Blachernae palace was beaten back by the Varangian Guard, but the Venetians, with the doge at their head, seized some 25 towers of the sea walls and set fire to the houses behind.
      - Alexios III led his army out but would not fight, and that night he fled with his treasure. The courtiers restored the blind Isaac II, and on 1 August his son was crowned co-emperor as Alexios IV. He paid part of what he had promised but could not raise the rest, and his efforts to bring the Church under Rome angered his subjects. In August a group of crusaders attacked a mosque in the city; the fire they started burned for days and destroyed a large part of Constantinople, and relations between the Latins and the citizens went from bad to worse.
    facts:
      - [Arrival at Constantinople, 24 June 1203]
      - [First assault, 17 July 1203]
      - [Alexios IV crowned, 1 August 1203]
    markers:
