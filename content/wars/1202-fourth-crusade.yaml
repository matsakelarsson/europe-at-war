id: fourth-crusade
name: Fourth Crusade
start: "1202-10"
end: "1205-04-14"
tier: A
summary: A crusade called by Pope Innocent III to recover Jerusalem by way of Egypt, which instead sacked the Christian city of Zara in 1202 and, after taking up the cause of the exiled Byzantine prince Alexios Angelos, captured and sacked Constantinople in April 1204. The crusaders and Venice divided the Byzantine Empire among themselves, founding the Latin Empire and Latin lordships in Greece, while Byzantine successor states arose at Nicaea, Trebizond and in Epirus. The Latin emperor Baldwin was captured by the Bulgarians at Adrianople in 1205.
