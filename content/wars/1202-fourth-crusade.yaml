        side: cr
        name: Abydos
        date: June 1203
        text: The fleet stopped here on its way up the Dardanelles, and the crusaders gathered the ripe harvest from the fields.
        lonlat: [26.41, 40.195]
      - kind: event
        side: cr
        name: Chalcedon
        date: 24–26 June 1203
        text: The army landed on the Asian shore and camped in the imperial palaces at Chalcedon and Scutari.
        lonlat: [29.03, 40.985]
        lp: b
      - kind: taken
        side: cr
        name: Galata
        date: 6 July 1203
        text: The crusaders took the tower holding the great chain across the Golden Horn, and the Venetian fleet broke into the harbour.
        lonlat: [28.974, 41.025]
        lp: t
      - kind: battle
        side: ven
        name: Assault on the sea walls
        date: 17 July 1203
        text: Venetian ships ran up to the walls along the Golden Horn and their crews took a long stretch of them. The fires they set burned a large part of the city.
        lonlat: [28.95, 41.032]
        lp: l
      - kind: event
        name: Great fire
        date: 19–21 August 1203
        text: A fire started by crusaders who attacked a mosque burned across the city from the Golden Horn to the Sea of Marmara.
        lonlat: [28.966, 41.012]
        lp: b
    arrows:
      - side: cr
        label: Fleet, June 1203
        via: [[26.4, 40.2], [27.6, 40.72], [28.98, 40.98]]
  - title: The sack of Constantinople
    date: January–April 1204
    when: "1204-02-08"
    borders: "1204-04-13"
    countries: [tr]
    body:
      - In January 1204 a revolt in the city ended the crusaders’ hopes of payment. The courtier Alexios Doukas, known as Mourtzouphlos, seized the throne as Alexios V, had Alexios IV strangled on 8 February (Isaac II had already died) and broke with the Latins. Short of food and camped outside the walls, the crusaders and Venetians decided to take the city for themselves, and their clergy told them the war against the schismatic Greeks was just. In March they agreed how to share the conquest. Six Venetians and six crusaders would elect a Latin emperor, who would have a quarter of the empire, and the rest would be divided equally between Venice and the crusaders.
      - A first assault from the ships on the Golden Horn on 9 April was driven off. On 12 April the attack was renewed; ships lashed together in pairs reached the towers, and knights forced their way through a walled-up gate. Alexios V fled in the night, and on the morning of 13 April the city lay open. For three days it was sacked. Soldiers killed and raped, churches and monasteries were plundered, and the altar of Hagia Sophia was broken up for its silver, as the historian Niketas Choniates, who fled the city, recorded.
      - Much of the loot was melted down, and relics and treasures went west, among them the four bronze horses now at St Mark’s in Venice. Innocent III, who had forbidden attacks on Christians, condemned the crusaders’ violence, though he accepted the new Latin Church in Constantinople. The sack deepened the hostility between Greek and Latin Christians for centuries; in 2001 and 2004 Pope John Paul II expressed sorrow for it.
    facts:
      - [Alexios IV murdered, 8 February 1204]
      - [Constantinople taken, 12–13 April 1204]
      - [Sack of the city, 13–15 April 1204]
    markers:
      - kind: battle
        side: by
        name: First assault
        date: 9 April 1204
        text: The defenders under Alexios V beat off an attack from the ships on the Golden Horn.
        lonlat: [28.945, 41.033]
        lp: l
      - kind: taken
        side: cr
        name: Constantinople
        date: 13 April 1204
        text: The city fell to the second assault, launched from ships against the walls along the Golden Horn near the Petrion.
        lonlat: [28.955, 41.025]
        lp: t
      - kind: event
        name: Hagia Sophia
        date: April 1204
        text: Soldiers stripped the great church, smashed its altar and loaded its treasures onto mules led into the sanctuary.
        lonlat: [28.98, 41.008]
        lp: b
  - title: The partition of the empire
    date: May 1204 – 1205
    when: "1204-05-09"
    borders: "1205-04-01"
    countries: [tr, gr, it, fr, be, ge]
    body:
      - On 9 May 1204 the electors chose Count Baldwin of Flanders rather than Boniface as emperor; he was crowned in Hagia Sophia on 16 May, and a Venetian, Thomas Morosini, became Latin patriarch. A treaty of partition gave the emperor Constantinople and the lands around it, and Venice three-eighths of the empire, from which it chose ports and islands for its trade. Boniface took Thessalonica as a kingdom under the emperor and sold Venice his claim to Crete. Much of this had still to be conquered.
      - That autumn the Franks spread out. Boniface marched through Thessaly into Greece; Othon de la Roche became lord of Athens and Thebes, and William of Champlitte and Geoffrey of Villehardouin, nephew of the chronicler, conquered most of the Peloponnese, beating local forces at the olive grove of Kountouras in 1205 and founding the Principality of Achaea. In Asia Minor Latin knights beat Theodore Laskaris at Poimanenon in December 1204. But Greek states survived at Nicaea under Laskaris, at Trebizond, where the Komnenos brothers had taken power with Georgian help in April 1204, and in Epirus under Michael Komnenos Doukas.
    facts:
      - [Baldwin I crowned, 16 May 1204]
      - [Venice’s share, three-eighths of the empire]
      - [Byzantine successor states, "Nicaea, Trebizond, Epirus"]
    markers:
