notes:
  - Dates are Julian. The main eyewitness accounts are by two crusaders, Geoffrey of Villehardouin, one of the leaders, and the knight Robert of Clari, and by the Byzantine official and historian Niketas Choniates, who lived through the sack.
  - Historians have long argued whether the diversion to Constantinople was planned, by Venice or by the leaders, or was the result of debt, accident and opportunism. Most now favour the second view.
  - The wars of the Latin Empire with Bulgaria and with Nicaea have their own entries.
