  - title: Adrianople and the aftermath
    date: 1205
    when: "1205-02"
    borders: "1205-04-14"
    countries: [bg, tr, gr]
    body:
      - The Greek nobles of Thrace, ill treated by their new lords, rose early in 1205 and called on Kaloyan, ruler of the Bulgarians, whose offers of alliance the Latins had scorned. Baldwin besieged Adrianople, and on 14 April 1205 Kaloyan’s army, with many Cuman horsemen, drew the Latin knights into a reckless pursuit and destroyed them. Louis of Blois was killed and Baldwin taken prisoner; he died in Bulgarian captivity. Dandolo, who helped Villehardouin lead the survivors back, died at Constantinople that summer and was buried in Hagia Sophia.
      - Baldwin’s brother Henry, crowned in 1206, steadied the Latin Empire, but it remained weak, squeezed between the Bulgarians and the Greeks of Nicaea, until the Byzantines recovered Constantinople in 1261. The crusade never reached the Holy Land. Venice gained an empire of ports and islands in the Aegean that lasted for centuries, and Latin lordships in Greece outlived the Latin Empire by many years. The restored Byzantine Empire never regained its former strength, which, many historians argue, eased the Ottoman conquest of the Balkans.
    facts:
      - [Battle of Adrianople, "14 April 1205, Bulgarian victory"]
      - [Emperor Baldwin I, "captured, died in captivity"]
      - [Recovery of Constantinople, 25 July 1261]
    markers:
      - kind: battle
        side: bg
        name: Battle of Adrianople
        date: 14 April 1205
        text: Cuman horse archers feigned flight and drew the Latin knights away from their camp, where Kaloyan’s main army surrounded them.
        lonlat: [26.567, 41.667]
      - kind: event
        side: bg
        name: Tarnovo
        date: 1205–1206
        text: Kaloyan’s capital, where Baldwin was held prisoner and died; how he died is uncertain.
        lonlat: [25.617, 43.078]
      - kind: event
        name: Constantinople
        date: "1205"
        text: Enrico Dandolo died here, in his nineties, and was buried in Hagia Sophia.
        lonlat: [28.955, 41.014]
    arrows:
