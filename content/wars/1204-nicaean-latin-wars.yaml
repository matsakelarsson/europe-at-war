notes:
  - On the map the Empire of Nicaea is shown as the continuation of the Byzantine Empire, which is how it saw itself. The main source is the Nicaean official George Akropolites, who was taken prisoner by the Epirotes and later served Michael VIII.
  - Alliances shifted constantly. Bulgaria fought both Nicaea and the Latins at different times, and Epirus was a rival of Nicaea for the Byzantine inheritance; the battle of Klokotnitsa (1230) has its own entry.
