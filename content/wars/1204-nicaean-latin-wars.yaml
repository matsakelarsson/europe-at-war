  - title: The siege of Constantinople
    date: 1230–1237
    when: "1235"
    borders: "1236-12-31"
    countries: [tr, bg, gr]
    body:
      - After Ivan Asen II of Bulgaria crushed Theodore of Epirus at Klokotnitsa in 1230, Bulgaria was the strongest power in the Balkans. The Latin barons, who had hinted that Asen might become regent for their boy emperor Baldwin II, chose instead the aged John of Brienne, a former king of Jerusalem, as co-emperor. In 1235 Asen allied with Vatatzes. Asen’s daughter married Vatatzes’s son, the Bulgarian Church was recognised as a patriarchate, and Vatatzes crossed into Europe and took Gallipoli and the Latin lands in Thrace.
      - In 1235 and again in 1236 the allies besieged Constantinople by land and sea. John of Brienne, with a few hundred knights, held the walls, and fleets from Venice, Achaea, Genoa and Pisa broke the Nicaean blockade and destroyed many of its ships. Asen, who had come to fear that a Nicaean Constantinople would be a stronger neighbour than a Latin one, changed sides in 1237, then made peace with Vatatzes again. The Latin Empire survived, but it was now little more than the city itself, kept alive by Venetian ships and Western money; Baldwin II pawned the Crown of Thorns and even his own son to Venetian merchants.
    facts:
      - [Nicaean–Bulgarian alliance, 1235]
      - [Siege of Constantinople, "1235–1236, failed"]
    markers:
      - kind: battle
        side: bg
        name: Battle of Klokotnitsa
        date: 9 March 1230
        text: Ivan Asen II beat and captured Theodore of Epirus, ending his bid to take Constantinople and making Bulgaria the leading Balkan power.
        lonlat: [25.5, 41.983]
      - kind: taken
        side: ni
        name: Gallipoli
        date: "1235"
        text: Vatatzes took the Venetian-held town, which gave Nicaea a foothold in Europe and control of the Dardanelles crossing.
        lonlat: [26.67, 40.41]
      - kind: event
        name: Lampsakos
        date: "1235"
        text: The alliance was sealed here with the marriage of Asen’s daughter Helena to Vatatzes’s son Theodore, and a church council recognised the Bulgarian patriarchate.
        lonlat: [26.684, 40.344]
        lp: b
      - kind: siege
        side: la
        name: Constantinople
        date: 1235–1236
        text: The small Latin garrison under the elderly John of Brienne held the land walls, while Italian and Achaean fleets saved the city by sea.
        lonlat: [28.955, 41.014]
