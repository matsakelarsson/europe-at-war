  - title: Pelagonia and the recovery of Constantinople
    date: 1246–1261
    when: "1259"
    borders: "1261-07-25"
    countries: [gr, mk, al, tr, it]
    body:
      - Vatatzes took Thessalonica in 1246 and much of Macedonia from Bulgaria and Epirus. In 1258 the general Michael Palaiologos became regent for the boy emperor John IV Laskaris, and soon co-emperor. Against him gathered Michael II of Epirus, William II of Villehardouin, prince of Achaea, and Manfred of Sicily, who sent German knights. In 1259 the Nicaean army under Michael’s brother John Palaiologos met them at Pelagonia in western Macedonia. The allies fell out, Michael II and his son left the field, and the Nicaeans destroyed the Achaean and German knights. William was captured and in 1262 gave up the fortresses of Mistras, Monemvasia and Maina as his ransom.
      - Constantinople, held by a small Latin garrison and the Venetian fleet, was now isolated. In March 1261 Michael VIII allied with Genoa, Venice’s rival, by the Treaty of Nymphaeum. In July the general Alexios Strategopoulos, passing near the city with some 800 soldiers, learned that the Venetian fleet and much of the garrison had sailed to attack the Nicaean-held island of Daphnousia in the Black Sea. On the night of 24–25 July his men slipped in through a passage near the Gate of the Spring and opened the gates, and the city was taken almost without a fight. Baldwin II fled on a Venetian ship. Michael VIII entered Constantinople on 15 August 1261.
    facts:
      - [Battle of Pelagonia, "1259, Nicaean victory"]
      - [Constantinople recovered, 25 July 1261]
      - [Michael VIII enters the city, 15 August 1261]
    markers:
      - kind: taken
        side: ni
        name: Thessalonica
        date: December 1246
        text: The city’s leading citizens opened the gates to Vatatzes, ending Epirote rule there.
        lonlat: [22.936, 40.64]
      - kind: battle
        side: ni
        name: Battle of Pelagonia
        date: "1259"
        text: Deserted by the Epirotes, the Latin knights were surrounded and cut down or captured, among them Prince William of Achaea, found hiding under a haystack, Akropolites says.
        lonlat: [21.567, 40.817]
      - kind: treaty
        name: Treaty of Nymphaeum
        date: 13 March 1261
        text: Michael VIII promised Genoa the trading privileges Venice had enjoyed in return for the help of its fleet against the Latins.
        lonlat: [27.42, 38.43]
      - kind: event
        name: Daphnousia
        date: July 1261
        text: The Venetian fleet sailed to attack this island off the Black Sea coast of Bithynia, leaving Constantinople nearly undefended.
        lonlat: [30.27, 41.2]
      - kind: taken
        side: ni
        name: Constantinople
        date: 25 July 1261
        text: Strategopoulos’s men entered at night, helped by Greek townspeople. The Latin emperor fled, and the returning Venetian fleet could only evacuate the Latin inhabitants.
        lonlat: [28.955, 41.014]
