id: nicaean-latin-wars
name: Nicaean–Latin wars
start: "1204"
end: "1261-07-25"
tier: B
summary: The long struggle between the Empire of Nicaea, the main Byzantine successor state, and the Latin Empire of Constantinople. After early Latin successes, John III Vatatzes beat the Latins at Poimanenon in 1224 and drove them from Asia Minor; with Bulgaria he besieged Constantinople in vain in 1235–1236. Michael VIII Palaiologos defeated the Latins of Greece and their allies at Pelagonia in 1259, and his general Alexios Strategopoulos took Constantinople almost without a fight on 25 July 1261, restoring the Byzantine Empire.
