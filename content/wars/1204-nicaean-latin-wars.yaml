steps:
  - title: Poimanenon and Nicaea’s advance
    date: 1204–1225
    when: "1224"
    borders: "1225-12-31"
    countries: [tr, gr]
    body:
      - After 1204 Theodore Laskaris built a Byzantine state in exile at Nicaea, and in 1208 he was crowned emperor. The Latins, who claimed north-western Asia Minor, beat him at Poimanenon in 1204 and on the Rhyndacus in 1211, just after he had defeated the Seljuks of Rum at Antioch on the Meander, where their sultan was killed. The Treaty of Nymphaeum of 1214 divided the region, leaving the Latins the coast from Nicomedia to Adramyttion. When Theodore died in 1221, his son-in-law John III Doukas Vatatzes succeeded him.
      - Theodore’s brothers Alexios and Isaac Laskaris, who had opposed the succession, fled to the Latins, and in 1224 a Latin army marched with them against Vatatzes. At Poimanenon, south of Cyzicus, Vatatzes won a decisive victory, and the two brothers were captured and blinded. In the peace of 1225 the Latins gave up all their lands in Asia except the shore opposite Constantinople and the region of Nicomedia. The Nicaean fleet took Lesbos, Chios, Samos and other islands, and Nicaean troops entered Adrianople, but had to hand it over to Theodore Komnenos Doukas of Epirus, who had taken Thessalonica in 1224.
    facts:
      - [Treaty of Nymphaeum, 1214]
      - [Battle of Poimanenon, "1224, Nicaean victory"]
      - [Peace with the Latins, 1225]
