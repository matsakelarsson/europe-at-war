notes:
  - Dates are Julian. The main sources are the crusader chroniclers Geoffrey of Villehardouin and Henry of Valenciennes and the Byzantine historians Niketas Choniates and George Akropolites; numbers of soldiers vary widely between them.
  - Fighting between Bulgaria and the Latin Empire flared up again later, notably in the siege of Constantinople of 1235–1236, told under the Nicaean–Latin wars.
