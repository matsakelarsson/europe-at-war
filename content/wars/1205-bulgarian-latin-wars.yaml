  - title: Kaloyan’s campaigns and Philippopolis
    date: 1206–1213
    when: "1206-01-31"
    borders: "1208-06-30"
    countries: [bg, tr, gr]
    body:
      - Kaloyan pressed on. On 31 January 1206 he destroyed a Latin force at Rusion, and his armies ravaged Thrace, taking and wrecking towns and carrying off their people. He called himself “the Roman-slayer”, answering the Byzantine emperor Basil II’s name of “Bulgar-slayer”, and the Thracian Greeks, alarmed, turned back to the Latins. Baldwin’s brother Henry, crowned emperor in August 1206, relieved Didymoteicho and won back much of Thrace. In September 1207 Boniface of Thessalonica was killed in a Bulgarian ambush, and Kaloyan besieged Thessalonica, but in October he died in his camp, perhaps murdered.
      - His nephew Boril seized the throne and carried on the war. In June 1208 he beat the Latins near Beroe (Stara Zagora), but on 30 June 1208, near Philippopolis, Henry’s army routed him, and the Latins recovered the plain of Philippopolis. Boril’s cousin Alexius Slav, lord of the Rhodopes, went over to the Latins. In 1213 Henry married Boril’s daughter and the two states made peace, which held for the rest of Henry’s reign.
    facts:
      - [Battle of Rusion, "31 January 1206, Bulgarian victory"]
      - [Death of Kaloyan, "October 1207, before Thessalonica"]
      - [Battle of Philippopolis, "30 June 1208, Latin victory"]
    markers:
      - kind: battle
        side: bg
        name: Battle of Rusion
        date: 31 January 1206
        text: Kaloyan’s Cumans ambushed and destroyed a Latin force of more than a hundred knights and their men near the town.
        lonlat: [26.633, 40.853]
      - kind: event
        side: bg
        name: Mosynopolis
        date: 4 September 1207
        text: Boniface of Montferrat, king of Thessalonica, was killed in a Bulgarian ambush in the Rhodope foothills near the town. His head was sent to Kaloyan.
        lonlat: [25.4, 41.12]
      - kind: held
        side: la
        name: Thessalonica
        date: October 1207
        text: Kaloyan’s siege ended with his sudden death. Legend credited St Demetrius, the city’s patron, with killing him.
        lonlat: [22.936, 40.64]
      - kind: battle
        side: bg
        name: Beroe
        date: June 1208
        text: Boril surprised Henry’s army in camp at night and inflicted heavy losses, though the Latins withdrew in good order.
        lonlat: [25.63, 42.42]
      - kind: battle
        side: la
        name: Battle of Philippopolis
        date: 30 June 1208
        text: Henry’s knights broke the Bulgarian army in the hills near the city. Boril fled, and the Latins took back the plain of Philippopolis.
        lonlat: [24.75, 42.15]
        lp: l
