    name: Bulgaria
    polities: [bulgaria]
    ink: green
    moves: Bulgarian moves
    success: Bulgarian success
  - id: la
    name: Latin Empire
    polities: [latin-empire, kingdom-of-thessalonica]
    ink: orange
    moves: Latin moves
    success: Latin success
  - id: gr
