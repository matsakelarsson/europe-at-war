steps:
  - title: Adrianople
    date: February–summer 1205
    when: "1205-02"
    borders: "1205-04-14"
    countries: [bg, tr, gr]
    body:
      - Kaloyan had offered the crusaders friendship after they took Constantinople in 1204, but the emperor Baldwin I treated him as a rebel against lands that had belonged to the Byzantine Empire. The Greek nobles of Thrace, ill-used by their new Latin lords, rose in February 1205, killed or drove out Latin garrisons in Adrianople and Didymoteicho, and called on Kaloyan for help. Baldwin marched to besiege Adrianople with Count Louis of Blois and the doge Enrico Dandolo before all his forces had gathered.
      - Kaloyan came south with Bulgarians, Vlachs and a large force of Cuman horsemen. On 14 April 1205 the Cumans drew the Latin knights into a headlong pursuit, and Kaloyan’s army surrounded them. Louis of Blois was killed and Baldwin taken prisoner; he died in captivity at Tarnovo. Villehardouin and Dandolo led the survivors back to Rodosto. In the summer Kaloyan took Serres and much of Thrace, and he destroyed Philippopolis after its Greek leaders had submitted to him.
    facts:
      - [Thracian Greek rising, February 1205]
      - [Battle of Adrianople, "14 April 1205, Bulgarian victory"]
      - [Emperor Baldwin I, "captured, died in captivity"]
    markers:
      - kind: event
        side: gr
        name: Didymoteicho
        date: February 1205
        text: The Greeks rose here and at Adrianople and drove out the Latins, beginning the revolt that brought Kaloyan into Thrace.
        lonlat: [26.5, 41.35]
        lp: b
      - kind: battle
        side: bg
        name: Battle of Adrianople
        date: 14 April 1205
        text: Cuman horse archers feigned flight and drew the Latin knights away from their camp. The Latin army was destroyed and its emperor captured.
        lonlat: [26.567, 41.667]
      - kind: event
        side: la
        name: Rodosto
        date: April 1205
        text: The survivors fell back to this port on the Sea of Marmara, which the Venetians held.
        lonlat: [27.515, 40.978]
      - kind: taken
        side: bg
        name: Serres
        date: June 1205
        text: Kaloyan took the town after a short siege; the Latin garrison surrendered on terms but was killed.
        lonlat: [23.55, 41.083]
      - kind: taken
        side: bg
        name: Philippopolis
        date: summer 1205
        text: Kaloyan razed the walls of the city and had many of its leading citizens executed.
        lonlat: [24.75, 42.15]
