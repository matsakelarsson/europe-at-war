id: bulgarian-latin-wars
name: Bulgarian–Latin wars
start: "1205-02"
end: "1213"
tier: B
summary: The wars between the Second Bulgarian Empire and the Latin Empire founded by the Fourth Crusade. Tsar Kaloyan, joined by the Greek nobles of Thrace, destroyed the Latin army at Adrianople in 1205, captured the emperor Baldwin I and ravaged Thrace until his death at Thessalonica in 1207; his successor Boril was beaten by the emperor Henry at Philippopolis in 1208, and peace followed in 1213.
countries: [bg, gr, tr]
