  - title: Lingzhou and the frozen Yellow River
    date: Autumn – December 1226
    when: "1226-11"
    borders: "1226-12-04"
    countries: [cn]
    body:
      - From Liangzhou the Mongols turned east across the desert to the Yellow River, took Yingli (near today’s Zhongwei) and marched down the river towards the heart of the kingdom. In November 1226 they laid siege to Lingzhou, the old fortress city about 30 km south of the capital, which guarded the eastern approach to Zhongxing.
      - Li Xian sent the main Xia army, reported at 300,000 men and led by Weiming Linggong, to relieve the city. On 4 December 1226 Genghis Khan met it on the plain by the frozen Yellow River and destroyed it. Lingzhou fell and was sacked; the Khitan scholar Yelü Chucai, who served the khan, is said to have taken from the loot only books and a supply of rhubarb, which he later used against an epidemic among the troops.
      - With its last field army gone, Western Xia could only hold the walls of its capital. The Mongols closed in on Zhongxing over the winter.
    facts:
      - [Siege of Lingzhou begins, "November 1226"]
      - [Battle by the Yellow River, "4 December 1226, Mongol victory"]
      - [Xia army, "reported at 300,000"]
