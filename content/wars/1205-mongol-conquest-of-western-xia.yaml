id: mongol-conquest-of-western-xia
name: Mongol conquest of Western Xia
start: "1205"
end: "1227-09"
tier: A
summary: "The wars in which the Mongols under Genghis Khan raided, subdued and finally destroyed Western Xia, the Tangut kingdom of the Ordos, the Helan Mountains and the Hexi Corridor. After raids in 1205 and 1207, a full invasion in 1209 defeated the Xia armies and besieged the capital, Zhongxing (today Yinchuan); the siege failed when a dike the Mongols had built to flood the city burst, but the Xia ruler submitted in 1210 and became a Mongol vassal and ally against the Jin dynasty. When Western Xia refused troops for the campaign against Khwarazm and later made peace with the Jin, Genghis Khan returned. In 1226 his armies took the towns of the Hexi Corridor one by one and destroyed the Xia field army near Lingzhou on 4 December; Zhongxing was besieged through 1227. Genghis Khan died in August 1227, and the last Xia ruler, who surrendered the next month, was killed on his orders. The capital and much of the country were devastated, and the Tangut state, which had lasted since 1038, came to an end."
countries: [cn, mn]
sides:
