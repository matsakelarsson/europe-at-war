  - title: The end of the Tangut state
    date: 1227 and after
    when: "1227-09"
    borders: "1227-10-01"
    countries: [cn]
    body:
      - The destruction of Western Xia was among the most thorough of the Mongol conquests. Towns that resisted were sacked and their people killed, the countryside was laid waste, and the capital was emptied. The Secret History of the Mongols has Genghis Khan order on his deathbed that the Tanguts be wiped out, and the historian John Man has called the campaign possibly the first recorded attempt at genocide and “certainly very successful ethnocide”. There is no reliable count of the dead, and modern estimates of the losses rest on the scale of the destruction rather than on figures.
      - Yet the Tanguts did not vanish. Many had surrendered and served the Mongols as soldiers, officials and Buddhist monks; Chagaan rose to high command, and Tangut scriptures were printed under the Yuan. Members of the royal clan fled south to the Tibetan borderlands, where a small Xia principality is said to have survived on the upper Yalong River. Tangut communities lived on in north China for centuries, and two pillars inscribed in the Tangut script were set up at Baoding, south of Beijing, as late as 1502. The Yuan named the region Ningxia, “Xia pacified”, the name it still bears.
    facts:
      - [Population of Western Xia, "about 3 million at its height (estimate)"]
      - [Zhongxing renamed Ningxia, "1288"]
      - [Last dated Tangut inscriptions, "Baoding, 1502"]
    markers:
      - kind: event
        side: mon
        name: Western Xia tombs
        date: "1227"
        text: The imperial tombs west of the capital, plundered after the fall of Western Xia. The last three emperors had no tombs.
        lonlat: [105.987, 38.435]
        lp: l
      - kind: event
        side: mon
        name: Zhongxing (Yinchuan)
        date: "1227"
        text: The former capital, largely emptied by the massacres of 1227. Under the Yuan it became the seat of the Ningxia circuit.
        lonlat: [106.270, 38.470]
    areas:
      - style: gained
        side: mon
        label: Former lands of Western Xia under Mongol rule (approximate)
        atoms: [CN-NX!, CN-NM~alxa, CN-NM~ordos, CN-GS~hexi, CN-GS~dunhuang, CN-SN~xiazhou]
