steps:
  - title: The first raids
    date: 1205–1208
    when: "1205"
    borders: "1205-06-01"
    countries: [cn, mn]
    body:
      - The Tangut state of Western Xia had ruled the Ordos, the Helan Mountains and the Hexi Corridor since 1038, with its capital at Zhongxing (Xingqing, today Yinchuan) on the Yellow River. Its people, perhaps three million at their height, farmed the irrigated lands along the river and the oases of the corridor and raised herds on the steppe; the state had its own script and Buddhism as its state religion, and it grew rich as a middleman in the trade between China and Central Asia. Its rulers paid tribute to the Jurchen Jin dynasty in the east, and its northern frontier faced the Gobi and the Mongolian steppe.
      - In 1205, two years after he had destroyed the Kereit, Temüjin led the first Mongol raid into Xia territory. The Kereit prince Nilqa Senggum, son of Toghrul, had fled through Xia lands, and the raid served both as revenge and as a test of the Tangut defences. According to the Yuan history the Mongols took two frontier strongholds and drove off people and camels. A boy captured in these years, Chagaan, son of an Xia officer from Ganzhou, was raised in Temüjin’s household and later became one of his generals.
      - In 1206 Temüjin was proclaimed Genghis Khan, and in Western Xia the emperor Huanzong was deposed by his cousin Li Anquan, who took the throne as Xiangzong. In the autumn of 1207 the Mongols returned, raided the Ordos and took the frontier fortress of Wulahai (Wuluohai), whose exact site is unknown; they stayed into the following spring and withdrew in 1208. The Jin did not come to the help of their vassal.
    facts:
      - [First raid, "1205"]
      - [Coup of Li Anquan (Xiangzong), "1206"]
      - [Second raid and the taking of Wulahai, "autumn 1207 – spring 1208"]
