  - title: The Hexi Corridor
    date: 1225 – August 1226
    when: "1226-02"
    borders: "1226-08-31"
    countries: [cn, mn]
    body:
      - Genghis Khan returned to Mongolia in the spring of 1225 after seven years in the west and prepared a final campaign against Western Xia. Asha Gambu is said to have taunted his envoys and invited the Mongols to come and fight. The army, reported at about 180,000 men, set out in the winter; on the march Genghis Khan was thrown from his horse during a hunt and badly hurt, but he refused to turn back.
      - Early in 1226 the Mongols took Khara-Khoto (Heishui), the fortress on the Ejin River at the north-western edge of the kingdom, and followed the river south into the Hexi Corridor. The Xia commanders avoided a pitched battle and left the towns to defend themselves, and the Mongols took them one by one. Suzhou (Jiuquan) fell after a siege of about five weeks and was sacked. At Ganzhou (Zhangye) Chagaan’s father agreed to surrender but was killed by his own officers, and the town held out for months; when it fell, Genghis Khan spared all but the 35 conspirators at Chagaan’s request. A column under Subutai took the towns further west.
      - In August 1226 Liangzhou (Xiliang), the second city of the kingdom, surrendered without a fight. The emperor Xianzong died in the same summer, and Li Xian, the last ruler of Western Xia, came to the throne of a state that had lost its whole western half.
    facts:
      - [Mongol army, "about 180,000 (reported)"]
      - [Khara-Khoto taken, "early 1226"]
      - [Suzhou taken, "after about five weeks"]
      - [Liangzhou surrenders, "August 1226"]
