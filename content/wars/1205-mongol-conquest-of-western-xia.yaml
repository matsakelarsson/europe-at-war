  - title: The fall of Zhongxing and the death of Genghis Khan
    date: January – September 1227
    when: "1227-01"
    borders: "1227-08-01"
    countries: [cn]
    body:
      - Early in 1227 Genghis Khan left his commanders to besiege Zhongxing and crossed the Yellow River with part of the army. According to the Yuan history he took Jishi and Lintao from the Jin in the second month, Taozhou, Hezhou and Xining in the third, and Longde and Deshun in the fourth, where the Jin governor Ailishen died defending the town. He spent the summer in the cool of the Liupan Mountains and turned away Jin envoys who came to ask for peace.
      - In Zhongxing, after half a year of siege, food ran out and disease spread. Li Xian offered to surrender and asked for a month to prepare gifts. Before he came out, Genghis Khan died, in August 1227; the date is given as 18 or 25 August. The place is also uncertain. The Yuan history names a camp on the Sali plain, and many historians place his death in or near the Liupan Mountains. The cause is unknown; the sources speak of the fall from his horse, of illness, or of a wound, and later legends blamed a captive Tangut princess. His death was kept secret so that the siege would not falter.
      - In September 1227 Li Xian surrendered and was put to death, as Genghis Khan had ordered before he died. The Mongols sacked Zhongxing, killed much of its population and plundered the imperial tombs at the foot of the Helan Mountains. Western Xia, which had lasted for 189 years, came to an end, and Genghis Khan’s body was carried back to Mongolia for a secret burial.
    facts:
      - [Lintao taken from the Jin, "second month of 1227"]
      - [Death of Genghis Khan, "August 1227 (18 or 25 August)"]
      - [Surrender of Li Xian, "September 1227"]
      - [Western Xia, "1038–1227"]
