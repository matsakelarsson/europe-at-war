        label: Genghis Khan
        via: [[106.900, 41.800], [106.700, 40.600], [106.200, 39.400], [106.230, 38.600]]
  - title: Vassal and ally
    date: 1210–1225
    when: "1211"
    borders: "1218-01-01"
    countries: [cn, mn]
    body:
      - As a Mongol vassal, Western Xia turned on the Jin, attacking its frontier in 1210, and from 1211 it fought alongside the Mongols in their war against the Jin dynasty. In 1211 Xiangzong was overthrown by his nephew Li Zunxu, who reigned as Shenzong and kept up the war. For more than a decade the Xia and Jin armies raided each other’s towns in what is now Gansu and Shaanxi; the fighting gained Western Xia little and drained its treasury and manpower.
      - In the winter of 1217–1218 Western Xia refused a Mongol demand for troops. A Mongol army besieged Zhongxing again, and Shenzong left the capital for Liangzhou (Xiliang) until the Mongols withdrew. When Genghis Khan asked once more before setting out against Khwarazm in 1219, the Xia commander Asha Gambu answered, according to the Secret History of the Mongols, that if the khan’s forces were not enough, he had no business being khan. Genghis Khan left Muqali in charge of the war in northern China and is said to have vowed to settle with the Tanguts on his return.
      - Xia troops did join Muqali’s campaigns in Shaanxi in 1221–1223, but when Muqali died during the siege of Fengxiang in 1223 they went home without leave. Shenzong abdicated that year in favour of his son, Li Dewang (Xianzong), who opened talks with the Jin; in the autumn of 1225 the two states made peace, and the Jin no longer treated Western Xia as a vassal. Xianzong also refused to send a son to the Mongol court as a hostage.
    facts:
      - [Shenzong (Li Zunxu) takes the throne, "1211"]
      - [Refusal of troops, "winter 1217–1218"]
      - [Xianzong (Li Dewang) succeeds, "1223"]
      - [Peace between Western Xia and the Jin, "autumn 1225"]
