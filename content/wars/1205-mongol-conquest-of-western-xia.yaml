notes:
  - Dates are converted from the Chinese lunar calendar as the sources give them (Julian calendar). The Chinese, Persian and Mongol sources often disagree on the order and the year of events, and modern accounts differ, for example, on when the Mongols arrived before Zhongxing in 1209 and on the day Genghis Khan died (18 or 25 August 1227).
  - The sizes of the armies are uncertain. The figures here (an Xia garrison of up to 70,000 in the Helan Mountains in 1209, a Mongol army of about 180,000 in 1226 and an Xia army of 300,000 at Lingzhou) are those reported in the sources and repeated in modern accounts; historians treat the larger ones with caution. No reliable count of the dead exists.
  - Western Xia called itself Great Xia; Tibetan sources call it Minyak, and the Mongols called its people the Tangut. Place names are the Chinese names of the time, with today’s names in brackets.
  - The Yuan dynasty never compiled an official history of Western Xia, as it did for the Liao, Jin and Song, so much of the story comes from Mongol, Jin and Persian sources written by its enemies.
