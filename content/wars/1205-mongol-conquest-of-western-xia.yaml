  - title: The siege of Zhongxing
    date: 1209 – January 1210
    when: "1209"
    borders: "1209-10-01"
    countries: [cn, mn]
    body:
      - In the spring of 1209 the Uyghur kingdom of Qocho in the Turfan basin went over to Genghis Khan, and he led his first full invasion of Western Xia. An Xia army under the crown prince was beaten in the north, its deputy commander Gao Lianghui was captured, and Wulahai fell again. Xiangzong asked the Jin for help, but the new Jin emperor, Wanyan Yongji, refused, reportedly saying that it was to the Jin’s advantage when their enemies attacked each other.
      - The road to the capital ran through Kiemen (Keyimen), the fortress guarding the pass through the Helan Mountains. Its garrison, reported at up to 70,000 men with 50,000 more sent as reinforcements, was led by Weiming Linggong. After a stand-off of two months the Mongols feigned a retreat, drew the Xia troops out of their positions and destroyed them; Weiming Linggong was captured.
      - The Mongols then besieged Zhongxing, which was well walled and strongly garrisoned; they had little siege equipment and failed to take it in months of fighting. In the winter they dammed the Yellow River’s irrigation channels to flood the city, but in January 1210 the dike burst and the water flooded their own camp, and they gave up the siege. Xiangzong, with his country’s harvest ruined and no help from the Jin, nevertheless submitted. He gave Genghis Khan his daughter Chaka in marriage, sent tribute of camels, falcons and woollen cloth, and promised to be the Mongols’ “right hand”.
    facts:
      - [Uyghurs of Qocho submit, "spring 1209"]
      - [Kiemen garrison, "up to 70,000, with 50,000 reinforcements (reported)"]
      - [Dike bursts, "January 1210"]
      - [Xia submission, "1210"]
    markers:
      - kind: siege
        side: mon
        name: Zhongxing (Yinchuan)
        date: 1209 – January 1210
        text: Besieged for months. The Mongols’ attempt to flood the city failed when the dike broke, but the Xia ruler submitted.
        lonlat: [106.270, 38.470]
      - kind: event
        side: mon
        name: Helan Mountains
        date: "1209"
        text: The Xia army guarding the pass of Kiemen (Keyimen) was drawn out by a feigned retreat and destroyed. The exact site of the fortress is uncertain.
        lonlat: [105.900, 38.850]
        lp: l
