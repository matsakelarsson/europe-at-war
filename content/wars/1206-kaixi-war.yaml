id: kaixi-war
name: Kaixi war
start: "1206-05"
end: "1208"
tier: C
summary: "The Southern Song attempt to recover northern China from the Jin, named after the Song reign period Kaixi (1205–1207) and also called the Kaixi Northern Expedition. The chief minister Han Tuozhou, who had dominated the court since 1194, judged the Jin weakened by floods, unrest and the rising Mongols. Song troops crossed the border in May 1206, and war was formally declared on 14 June. Apart from Bi Zaiyu’s capture of Sizhou, the attacks on Suzhou, Shouzhou, Tangzhou and Caizhou failed, and in the autumn Jin armies under Pusan Kui crossed the Huai, besieged Xiangyang and reached the Yangtze. In December 1206 Wu Xi, the Song commander in Sichuan and grandson of Wu Lin, went over to the Jin, ceded four prefectures and was made King of Shu; Song loyalists led by Li Haoyi and Yang Juyuan killed him in his palace on 29 March 1207. With the war lost, a court faction around Shi Miyuan and Empress Yang had Han Tuozhou killed on 24 November 1207, and his head was later sent to the Jin as the price of peace. The peace of Jiading (1208) restored the border of 1142, raised the yearly payments to 300,000 taels of silver and 300,000 bolts of silk and added a war indemnity of three million taels. Dates are converted from the Chinese calendar as the sources give them."
