id: khwarazmian-qara-khitai-war
name: Khwarazmian–Qara Khitai war
start: "1207"
end: "1212"
tier: C
summary: The war in which the Khwarazmshah Ala al-Din Muhammad II threw off the overlordship of the Qara Khitai, the non-Muslim Khitan empire of Central Asia whose vassals the Khwarazmshahs had been since the Battle of Qatwan in 1141. Having driven the Ghurids out of Khorasan with Qara Khitai help, Muhammad turned on his overlords in 1207, when he entered Bukhara and the Karakhanid ruler of Samarkand, Uthman, went over to him. The first campaigns beyond the Oxus went badly; in one battle Muhammad was captured, unrecognised, and escaped by passing himself off as a servant. He stopped paying tribute, had a Qara Khitai envoy killed, and in 1210 defeated the Qara Khitai army on the Ilamish plain and captured its general Tayangu. The Qara Khitai empire was also attacked from within by the Naiman prince Kuchlug, a refugee from Genghis Khan, who seized its ruler Yelü Zhilugu in 1211. When Uthman of Samarkand turned against him in 1212 and had the Khwarazmians in the city killed, Muhammad stormed Samarkand, sacked it and executed Uthman, ending Karakhanid rule there. Transoxiana became Khwarazmian, and the Syr Darya the border with Kuchlug’s realm, which the Mongols conquered in 1218.
