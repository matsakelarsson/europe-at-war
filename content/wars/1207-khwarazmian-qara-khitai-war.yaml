notes:
  - The order and dates of the campaigns between 1207 and 1212 are uncertain; the Persian and Arabic chroniclers disagree, and the battle on the Ilamish plain is dated to 1210 by most modern historians. Uthman of Samarkand changed sides more than once.
  - Death tolls given for the sack of Samarkand in 1212 (up to 200,000 in one chronicle) are much larger than the city’s probable population; modern estimates are far lower.
