id: mongol-conquest-of-the-forest-peoples
name: Mongol conquest of the forest peoples
start: "1207"
end: "1218"
tier: C
summary: "The campaigns in which the Mongols brought the “forest peoples” (hoi-yin irgen) of southern Siberia under their rule, from Lake Baikal to the upper Yenisei. In 1207 Genghis Khan sent his eldest son Jochi north-west. The Oirat chief Qutuqa Beki submitted first and guided the Mongols, and the Buryats, Barguts, Ursut, Qabqanas, Tuba (Tuvans) and the Yenisei Kyrgyz submitted without a battle, sending white gyrfalcons, white horses and sables as tribute; the Oirats were bound to Genghis Khan’s family by marriages. In 1217 the Tumad (Khori-Tumed) west of Lake Baikal, ruled by their queen Botoqui Tarqun, rose and seized the Mongol commanders sent to them, Qorchi and Qutuqa Beki, according to the Secret History; Boroqul, one of Genghis Khan’s oldest companions, led a force against them and was ambushed and killed in the forest. The Kyrgyz refused to send troops and joined the rising, as did several smaller peoples. In the winter of 1217–1218 Dörbei Doqshin surprised the Tumad by cutting a new path through the forest, and Jochi subdued the Kyrgyz and the other peoples of the upper Yenisei. Botoqui was given to Qutuqa Beki as a wife, and a hundred Tumad were handed over to Boroqul’s family in atonement (some accounts say they were killed). The Kyrgyz lands became a Mongol province of craftsmen and farmers. Dates and the order of events follow the Secret History of the Mongols and Rashid al-Din, which do not always agree."
