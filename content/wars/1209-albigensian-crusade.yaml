id: albigensian-crusade
name: Albigensian Crusade
start: "1209-06-24"
end: "1229-04-12"
tier: B
summary: A crusade called by Pope Innocent III against the Cathar heretics of Languedoc and the southern lords who tolerated them. Northern French barons led by Simon de Montfort massacred Béziers and took the lands of the Trencavel family and most of the County of Toulouse, but the southerners fought back, and only the royal crusade of Louis VIII forced Count Raymond VII to accept the Treaty of Paris in 1229, which brought Languedoc under the French crown.
countries: [fr, es]
