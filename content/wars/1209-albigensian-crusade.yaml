    name: Crusaders and France
    polities: [france]
    ink: navy
    moves: Crusader moves
    success: Crusader success
  - id: tou
    name: Toulouse and its allies
    polities: [toulouse, aragon]
    ink: orange
    moves: Southern moves
    success: Southern success
notes:
  - The Cathars, whom their enemies called Albigensians after the town of Albi, held that the material world was the work of an evil principle and rejected the Catholic Church and its sacraments; their leaders, the perfects, were known to their followers as good men and good women. How organised and widespread the movement was is debated by historians.
  - The chief sources are the crusade’s chronicler Peter of Vaux-de-Cernay, the Song of the Albigensian Crusade (in Occitan, its first part by a pro-crusade author and its second by a southern one) and William of Puylaurens.
