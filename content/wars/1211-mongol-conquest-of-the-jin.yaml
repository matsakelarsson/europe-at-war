  - title: Ögedei’s war and Tolui’s march
    date: 1229 – January 1232
    when: "1231"
    borders: "1231-12-01"
    countries: [cn]
    body:
      - After Muqali’s death and Genghis Khan’s in 1227, the Jin recovered ground in Shaanxi and along the Yellow River. Their generals Wanyan Heda and Yila Pu’a held a line from Tongguan along the river, and the Zhongxiao army of Wanyan Chenheshang won victories at Dachangyuan and elsewhere. Ögedei, elected Great Khan in 1229, refused Jin offers of peace. In 1230–1231 the Jin drove the Mongols from Weizhou, and Subutai was beaten at Tongguan and at Daohuigu. In the spring of 1231 Ögedei and Tolui took Fengxiang after a long siege, and the Jin abandoned Jingzhao (Chang’an).
      - The Jin line along the Yellow River and the fortress of Tongguan were too strong to force, and the Mongols planned to come at Kaifeng from several directions at once; some accounts say Genghis Khan had advised a march through Song territory before he died. While Ögedei led the main army towards the river from Shanxi, Tolui, with perhaps 30,000 horsemen, was to cross Song territory and strike from the south. The Song refused passage and a Mongol envoy was killed, and in the autumn of 1231 Tolui forced his way over the Qinling Mountains into the Hanzhong basin, plundered the Song towns there and followed the Han River east. In January 1232 he crossed the Han near Guanghua into Jin territory.
      - The main Jin army, under Heda and Pu’a, marched south from the Yellow River to Dengzhou to meet him. At the end of January 1232 Ögedei’s army, under Subutai’s command, crossed the frozen Yellow River at Baipo and took Zhengzhou.
    facts:
      - [Ögedei elected Great Khan, "1229"]
      - [Fengxiang taken, "spring 1231"]
      - [Tolui crosses the Han River, "January 1232"]
      - [Ögedei’s army crosses the Yellow River, "28 January 1232"]
