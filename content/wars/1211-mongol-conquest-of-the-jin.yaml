  - title: Through the passes
    date: July 1213 – spring 1214
    when: "1213-07"
    borders: "1213-10-01"
    countries: [cn]
    body:
      - In the summer of 1213 Genghis Khan returned. He took Xuande and Dexing, beat a Jin army under Wanyan Gang and Zhuhu Gaoqi at Huailai and pursued it to the Juyong Pass, which the Jin had fortified strongly. Leaving a force before the pass, he led the main army south-west through the Zijing Pass, beat the Jin at the Wuhui Ridge and took Zhuozhou and Yizhou, while Jebe took the Juyong Pass from the south. The Mongols were again before Zhongdu.
      - The defeats brought a crisis in the capital. In the autumn of 1213 the general Heshilie Zhizhong, known as Hushahu, who had fled from Xijing, seized Zhongdu, killed Wanyan Yongji and put the late emperor’s nephew Wanyan Xun on the throne as the Xuanzong emperor. Within weeks Hushahu was himself killed by Zhuhu Gaoqi, who took his place as the leading general.
      - Leaving troops before Zhongdu, the Mongols split into three armies for the autumn and winter. The princes Jochi, Chagatai and Ögedei marched south along the Taihang Mountains and back north through Shanxi; Genghis Khan’s brother Qasar rode along the coast towards Liaoxi; Genghis Khan and his son Tolui swept across the Hebei plain into Shandong. They sacked some ninety prefectures, driving captured peasants before them in their assaults, and only a handful of walled cities held out. In the spring of 1214 the armies met again north of Zhongdu.
    facts:
      - [Battle of Huailai, "1213, Mongol victory"]
      - [Juyong Pass taken by Jebe, "autumn 1213"]
      - [Murder of Wanyan Yongji, "autumn 1213"]
      - [Prefectures sacked, "about 90"]
