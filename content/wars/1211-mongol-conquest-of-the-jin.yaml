  - title: Liaodong, Yelü Liuge and Eastern Xia
    date: 1213–1233
    when: "1215"
    borders: "1217-06-01"
    countries: [cn, ru]
    body:
      - In Liaodong the Jin lost control of the old Jurchen and Khitan heartland. Yelü Liuge took Dongjing (Liaoyang) in 1215 and went in person to Genghis Khan to submit. In his absence some of his followers, led by Yelü Sibu, rejected Mongol overlordship and in 1216 proclaimed a rival Liao; driven east into Korea, they were destroyed at Kangdong in 1219 by a Mongol, Eastern Xia and Korean army. Yelü Liuge died in 1220, and his family went on serving the Mongols.
      - Puxian Wannu, a Jurchen general whom the Jin had sent to Liaodong in 1214, was beaten by Yelü Liuge near Kaiyuan. In 1215 he broke with the Jin and proclaimed a state of his own at Dongjing. He submitted to the Mongols in 1216 and sent his son Tege as a hostage, but in 1217 he broke away again, killed the Mongol residents and moved east into the mountains of the upper Tumen and Mudan rivers. There he ruled as king of Eastern Xia (Dongxia), with his capital at Nanjing near today’s Yanji, over Jurchen lands that reached to the Sea of Japan in today’s Russian Primorye.
      - Eastern Xia outlasted the Jin rule in Manchuria by more than a decade, sometimes allied with the Mongols and sometimes defying them. In 1233 Ögedei sent his son Güyük against it; Nanjing was taken, Puxian Wannu was captured and killed, and Eastern Xia came to an end.
    facts:
      - [Yelü Liuge takes Dongjing, "1215"]
      - [Puxian Wannu’s state proclaimed, "1215"]
      - [Eastern Xia breaks with the Mongols, "1217"]
      - [Eastern Xia conquered by Güyük, "1233"]
