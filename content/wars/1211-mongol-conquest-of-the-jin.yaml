  - title: The siege of Kaifeng
    date: April 1232 – May 1233
    when: "1232-04-08"
    borders: "1232-06-01"
    countries: [cn]
    body:
      - Kaifeng, the old Northern Song capital, had huge walls and was crowded with refugees. Subutai laid siege to it on 8 April 1232. In sixteen days of assaults the defenders used thunder-crash bombs (zhentianlei), iron casings filled with gunpowder thrown from trebuchets, and fire lances, tubes of gunpowder on spears that shot flame several metres; the Mongols answered with catapults and dug approaches under cowhide shelters. Talks led to a pause, and Ögedei and Tolui returned north, leaving Subutai in command.
      - In the summer of 1232 an epidemic struck the city. The Jin history records that in fifty days more than 900,000 dead were carried out of its gates, not counting the poor who could not be buried. The number may be exaggerated, and historians still debate what the disease was; some have suggested plague. The talks ended when the Mongol envoy Tang Qing and his party were killed in the city.
      - In January 1233 Aizong left Kaifeng with an army, crossed the Yellow River and tried to take Weizhou. Beaten at Baigongmiao, he slipped back across the river at night and reached Guide (Shangqiu). In Kaifeng the general Cui Li killed the ministers left in charge and surrendered to Subutai, and the Mongols entered the city on 29 May 1233. The men of the Jin imperial clan were killed and the empress dowager and court ladies taken north. Subutai wanted to massacre the city that had resisted so long; according to his biography in the Yuan history, Yelü Chucai persuaded Ögedei to punish only the imperial clan, and 1,470,000 people sheltering in Kaifeng were spared.
    facts:
      - [Siege begins, "8 April 1232"]
      - [Epidemic, "summer 1232; over 900,000 dead in 50 days, by the Jin history’s count"]
      - [Aizong leaves Kaifeng, "January 1233"]
      - [Kaifeng surrenders, "29 May 1233"]
