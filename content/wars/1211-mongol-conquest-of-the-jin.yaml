  - title: Sanfengshan
    date: January – February 1232
    when: "1232-02-09"
    borders: "1232-02-10"
    countries: [cn]
    body:
      - The Jin army, by most accounts well over 100,000 men, met Tolui at Mount Yu near Dengzhou. The fighting was indecisive, and the Jin claimed a victory, but Tolui split his force and slipped past them to the north, plundering the country on the way to Kaifeng. Ordered back to defend the capital, Heda and Pu’a followed him north, harassed by Mongol horsemen who cut off their supplies.
      - Near Junzhou (today Yuzhou) the Jin army was caught in a snowstorm that lasted three days. It reached the hill of Sanfengshan exhausted and short of food, while reinforcements from Ögedei joined Tolui. On 9 February 1232 the Mongols let the Jin begin to retreat along a road that seemed open and then fell on them, and the army collapsed. Heda and Wanyan Chenheshang escaped to Junzhou and were killed when it fell; Chenheshang is said to have refused to kneel. Pu’a was captured and later executed.
      - The battle destroyed the last Jin field army. The towns of Henan surrendered or were taken, the garrison of Tongguan gave up, and the emperor Aizong was left with the troops in Kaifeng.
    facts:
      - [Battle of Sanfengshan, "9 February 1232, Mongol victory"]
      - [Mongol army, "Tolui’s 20,000–40,000 with Ögedei’s reinforcements (Atwood)"]
