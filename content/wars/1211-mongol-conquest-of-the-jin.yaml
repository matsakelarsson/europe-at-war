notes:
  - Dates are converted from the Chinese lunar calendar as the sources give them (Julian calendar). The Yuan history compresses several years’ campaigns, and the Chinese, Persian and Mongol accounts disagree on the order of some events; Jebe’s capture of Liaoyang, for example, is dated to the winter of 1211–1212 in some accounts and to 1212–1213 in others, and Zhongdu’s surrender to 31 May or 1 June 1215.
  - The sizes of the armies are very uncertain. For 1211 Paul Ratchnevsky estimated about 65,000 Mongols and 10,000 Önggüd allies; Jin numbers in the sources range from 30,000–50,000 to more than 600,000 at Yehuling. At Sanfengshan Christopher Atwood puts Tolui’s army at 20,000–40,000 men and the Jin at 100,000–200,000.
  - The Jin called Kaifeng (Bianjing) their Southern Capital, Nanjing, after 1153; Eastern Xia’s capital near Yanji was also called Nanjing. Place names are those of the time, with today’s names in brackets.
  - Much of the war was fought by Khitan, Chinese and Jurchen commanders on both sides, and many changed sides. The areas drawn for the Mongol conquests, Eastern Xia and the Jin territory are approximate.
