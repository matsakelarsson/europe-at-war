  - title: Caizhou and the end of the Jin
    date: August 1233 – 9 February 1234
    when: "1234-02-09"
    borders: "1234-02-08"
    countries: [cn]
    body:
      - At Guide the general Pucha Guannu made himself master of the court and killed many officials; after his night victory over the Mongols, Aizong had him killed and in August 1233 moved to Caizhou (Runan), further south. He asked the Song for grain, warning that once the Jin were gone the Mongols would turn on the Song. The Song court, which had lost the north to the Jin a century earlier, chose instead to ally with the Mongols, who promised it part of Henan.
      - Late in 1233 a Mongol army under Taghachar besieged Caizhou, and a Song army under Meng Gong and Jiang Hai joined it, 10,000 men by the Jin history’s account and 20,000 by others, bringing 300,000 shi of grain. The besiegers drained the lake and river that protected the walls, broke into the outer city in January 1234, and starved the defenders.
      - On 9 February 1234, as the Mongols and the Song broke in, Aizong handed the throne to the general Wanyan Chenglin and hanged himself. Chenglin, the last Jin emperor, was killed in the street fighting the same day. Meng Gong carried part of Aizong’s remains back to the Song court. Months later Song armies marched north to occupy Kaifeng and Luoyang, beginning the long war between the Song and the Mongols. Northern China, fought over for 23 years, was devastated; later registers counted far fewer households than the Jin census, but how much of the fall came from killing, famine, disease, flight south or escape from registration is debated.
    facts:
      - [Siege of Caizhou, "December 1233 – 9 February 1234"]
      - [Song contingent, "10,000–20,000 men and 300,000 shi of grain"]
      - [Death of Aizong, "9 February 1234"]
      - [End of the Jin dynasty, "9 February 1234"]
