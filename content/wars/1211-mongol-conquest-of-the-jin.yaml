  - title: Muqali in the north
    date: 1217–1223
    when: "1217"
    borders: "1220-06-01"
    countries: [cn]
    body:
      - In 1217 Genghis Khan made Muqali “Prince of State” (guowang) and gave him command of the war in northern China, while he himself turned west against Khwarazm. Muqali had perhaps 20,000 Mongol troops; with the Önggüd, Khitan, Jurchen and Chinese auxiliaries his forces may have numbered 40,000 to 70,000. He changed the war from raiding to occupation, taking towns in Hebei and Shandong in 1217 and Taiyuan, Pingyang and the other cities of Shanxi in 1218.
      - Much of the conquest was done by Chinese commanders who had raised militias in the chaos and now went over to the Mongols, keeping their troops and lands. Among them were Zhang Rou, captured in 1218, Shi Tianni, Yan Shi at Dongping and Wu Xian, who surrendered Zhending in 1220. They became the hereditary lords of the Mongol north. In Shandong the Red Coat bands of Yang An’er and Li Quan played the Jin, the Song and the Mongols against one another.
      - The Jin, hemmed in to Henan, Shaanxi and the land between the Yellow River and the Huai, attacked the Song in 1217 to make up their losses and fought Western Xia as well; neither war gained them anything. In 1221–1222 Muqali crossed the Ordos into Shaanxi and took the towns of the north, and late in 1222 he took Hezhong on the Yellow River, but Jingzhao (Chang’an) and Fengxiang held out. He died in the spring of 1223 at Wenxi in Shanxi. The new Jin emperor, Aizong, who came to the throne in 1224, made peace with the Song that year and with Western Xia in 1225.
    facts:
