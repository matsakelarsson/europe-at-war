  - title: Liaoyang, Xijing and the Khitan rising
    date: Winter 1211 – 1213
    when: "1212"
    borders: "1212-06-01"
    countries: [cn, mn]
    body:
      - The Mongols wintered on the Jin frontier. While the princes Jochi, Chagatai and Ögedei raided the towns of northern Shanxi, Jebe rode east to Dongjing (Liaoyang), the Jin eastern capital. He feigned a retreat, leaving his baggage behind, then returned by forced marches and took the city while its garrison was off guard; like most of the towns taken in these years, it was plundered and abandoned. In 1212 Genghis Khan besieged Xijing (Datong), the western capital, but was wounded by an arrow and lifted the siege, and the Mongols withdrew to the steppe for the summer. The Jin reoccupied much of what they had lost.
      - In the north-east the Mongols found an ally. Yelü Liuge, a Khitan officer of the old Liao imperial clan, rose against the Jin in 1212 at Long’an (Nong’an) and sent envoys to Genghis Khan. In 1213 he proclaimed himself King of Liao, made his capital at Xianping (Kaiyuan), and with Mongol help defeated a Jin army sent against him. He declined to take the title of emperor and remained a Mongol ally until his death in 1220.
    facts:
      - [Jebe takes Dongjing (Liaoyang), "winter 1211–1212 (some accounts 1212–1213)"]
      - [Siege of Xijing, "1212, Genghis Khan wounded"]
      - [Yelü Liuge’s rising, "1212; King of Liao 1213"]
