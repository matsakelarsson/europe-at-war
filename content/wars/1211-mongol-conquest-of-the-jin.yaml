steps:
  - title: Yehuling
    date: Spring – autumn 1211
    when: "1211-03"
    borders: "1211-03-01"
    countries: [cn, mn]
    body:
      - The Jurchen Jin dynasty had ruled Manchuria and northern China since it destroyed the Liao in 1125 and drove the Song south in 1127. Its capital was Zhongdu (today Beijing), and its census of 1207 counted some 45 million people. The Jin kept large armies of Jurchen, Khitan and Chinese troops, a ring of walled cities, and a frontier of walls and ditches on the edge of the steppe, guarded by allied tribes such as the Önggüd. For generations they had played the steppe peoples against one another; in the 12th century they had put to death the Mongol khan Ambaghai, and in 1196 they had fought the Tatars with Temüjin as their ally.
      - By 1210 Genghis Khan had united the Mongols and made Western Xia his vassal. When a Jin envoy came to announce the accession of the emperor Wanyan Yongji, he refused to receive the edict on his knees. The Önggüd, whose chief Alaqush had joined him years before, opened the frontier. In the spring of 1211 Genghis Khan assembled his army on the Kherlen River; the historian Paul Ratchnevsky estimated it at about 65,000 Mongols with 10,000 Önggüd.
      - The Mongols crossed the Gobi, took the frontier forts of Wushabao and Wuyueying and the town of Fuzhou, and met the main Jin army under the chancellor Wanyan Chengyu and the general Wanyan Jiujin in the passes of Yehuling (Wild Fox Ridge), north of today’s Zhangjiakou. The Khitan officer Shimo Ming’an, sent by the Jin to negotiate, went over to the Mongols and told them where the Jin troops stood. In late summer Muqali led a charge up the defile of Huan’erzui (Badger’s Mouth); the Jin centre broke, Jiujin was killed, and the army fled. Its survivors were caught and destroyed at Huihebao. The Mongols took Xuande and Dexing, Jebe forced the Juyong Pass, and Mongol riders reached the walls of Zhongdu, but they had no means of taking it. They carried off the Jin’s great state horse herds on the northern pastures.
    facts:
      - [Mongol army, "about 65,000 with 10,000 Önggüd (Ratchnevsky’s estimate)"]
      - [Battle of Yehuling, "late summer 1211, Mongol victory"]
      - [Huihebao, "autumn 1211, the Jin survivors destroyed"]
