  - title: The fall of Zhongdu
    date: Winter 1214 – May 1215
    when: "1215-05-31"
    borders: "1215-06-01"
    countries: [cn]
    body:
      - Through the winter the Jin commanders around Zhongdu went over to the Mongols one by one; early in 1215 Pucha Qijin surrendered Tongzhou, east of the city, with his troops. The court in Kaifeng sent a relief column with grain under Li Ying, but it was routed at Bazhou in the spring and its supplies captured. Inside Zhongdu food ran out, and later writers told of people eating the dead.
      - The commander of the city, Wanyan Chenghui, took poison, and his fellow general Moran Jinzhong fled south. Zhongdu surrendered on 31 May 1215. The Mongols sacked it; thousands were killed and much of the city burned. Genghis Khan, who was camped on the steppe to the north, sent officers to take over the treasury. Among those who entered his service was the Khitan scholar Yelü Chucai, who later became an adviser to Genghis Khan and Ögedei.
      - In the same year Muqali took the Jin Northern Capital, Dading, and the lands of Liaoxi. Genghis Khan returned to Mongolia in 1216, leaving the north China plain a battleground in which Mongol garrisons, Jin officers and local strongmen with their own militias fought for control.
    facts:
      - [Tongzhou surrenders, "early 1215"]
      - [Relief column routed at Bazhou, "spring 1215"]
      - [Zhongdu surrenders, "31 May 1215"]
      - [Dading taken by Muqali, "1215"]
    markers:
