  - title: A princess, and the flight to Kaifeng
    date: Spring – summer 1214
    when: "1214-04"
    borders: "1214-08-01"
    countries: [cn]
    body:
      - In the spring of 1214 the Mongols camped north of Zhongdu. Their generals urged an assault, but the army was weakened by disease and the city was too strong, and Genghis Khan offered terms instead. Xuanzong accepted. He sent Genghis Khan a princess of the imperial house, the Princess of Qiguo, a daughter of the murdered emperor, with 500 boys and girls, 3,000 horses and great quantities of gold and silk. In May the Mongols withdrew through the Juyong Pass to summer on the steppe.
      - Xuanzong did not trust the peace. In June 1214, over the objections of some of his ministers, he left Zhongdu with his court for the Southern Capital, Bianjing (Kaifeng), behind the Yellow River, leaving the crown prince and his generals to hold the old capital. On the march the Khitan auxiliaries of the escort rose near Liangxiang, killed their officers and went over to the Mongols, seizing the Lugou Bridge south-west of Zhongdu.
      - Genghis Khan treated the move as a breach of the peace. Late in 1214 he sent his armies back under Samuqa, with Shimo Ming’an and the Khitan deserters, to besiege Zhongdu. The crown prince was called away to Kaifeng.
    facts:
      - [Peace before Zhongdu, "April 1214"]
      - [Tribute, "a princess, 500 boys and girls, 3,000 horses, gold and silk"]
      - [Court leaves Zhongdu, "June 1214; reaches Kaifeng in August"]
    markers:
