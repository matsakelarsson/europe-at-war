id: mongol-conquest-of-the-jin
name: Mongol conquest of the Jin dynasty
start: "1211"
end: "1234-02-09"
tier: A
summary: "The 23-year war in which the Mongols destroyed the Jurchen Jin dynasty, which ruled northern China and Manchuria. Genghis Khan invaded in 1211, routed the Jin field army at Yehuling, and in 1213–1214 his armies ravaged the north China plain while the Jin court was torn by a coup. The Jin bought a truce in 1214 with a princess and tribute, then moved their capital from Zhongdu (today Beijing) to Kaifeng; the Mongols returned and took Zhongdu on 31 May 1215. In the north-east the Khitan Yelü Liuge and the Jurchen general Puxian Wannu, founder of Eastern Xia, broke away. From 1217 Muqali turned raiding into occupation north of the Yellow River, helped by Chinese and Khitan commanders who changed sides, while the Jin fought the Song and Western Xia as well. Under Ögedei the Mongols outflanked the Jin defences by marching through Song territory, destroyed the last Jin army at Sanfengshan in February 1232 and besieged Kaifeng, which surrendered in May 1233 after an epidemic. The last Jin emperor, Aizong, killed himself at Caizhou on 9 February 1234 as a Mongol and Song army broke in. The war devastated northern China, though how many died is unknown."
countries: [cn, mn, ru]
