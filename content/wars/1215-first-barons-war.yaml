        side: roy
        name: Gloucester
        date: 28 October 1216
        text: The papal legate Guala presided at Henry’s hurried coronation in the abbey church, now the cathedral.
        lonlat: [-2.246, 51.867]
      - kind: battle
        side: roy
        name: Battle of Lincoln
        date: 20 May 1217
        text: The royalists got into the city through a disused gate and attacked the besiegers of the castle in the streets. The plunder that followed was mocked as the Lincoln Fair.
        lonlat: [-0.539, 53.234]
      - kind: siege
