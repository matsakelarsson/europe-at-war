notes:
  - The rebels were also joined by Alexander II of Scotland, who took Carlisle in 1216, and by Llywelyn ab Iorwerth of Gwynedd, who took castles in south Wales. Philip II officially disowned his son’s expedition, and the pope excommunicated Louis.
  - The chief chronicler of the war, Roger of Wendover, was hostile to John. The peace of September 1217 is called the Treaty of Lambeth or of Kingston, after the places where it was negotiated and confirmed.
