  - title: Lincoln, Sandwich and the peace
    date: 1216–1217
    when: "1216-10-28"
    borders: "1217-09-20"
    countries: [gb, fr]
    side_names:
      roy: Henry III
    body:
      - John’s son Henry III, aged nine, was crowned at Gloucester on 28 October 1216, since London was in Louis’s hands. The elderly William Marshal became regent, and on 12 November Magna Carta was reissued in Henry’s name. With John gone, the barons began to drift back to the crown. Louis went to France for reinforcements early in 1217 and on his return began a second siege of Dover. Meanwhile a rebel and French army was besieging Lincoln castle, held for the king by its castellan, Nicola de la Haye. On 20 May Marshal’s army broke into the city and routed it. Its commander, the count of Perche, was killed, many rebel barons were captured, and the royalists sacked the city.
      - On 24 August a French fleet under the former monk and pirate Eustace sailed to bring Louis reinforcements. Off Sandwich, Hubert de Burgh’s ships attacked from windward and captured the flagship, and Eustace was beheaded on its deck. Louis had to negotiate. By the treaty agreed near Kingston and confirmed at Lambeth on 20 September 1217, he gave up his claim and left England, the rebels were pardoned, and he was paid 10,000 marks. In November the charter was issued again, with a new Charter of the Forest.
    facts:
      - [Battle of Lincoln, "20 May 1217, royalist victory"]
      - [Battle of Sandwich, "24 August 1217, English victory"]
      - [Treaty of Lambeth, "September 1217, Louis paid 10,000 marks to leave"]
