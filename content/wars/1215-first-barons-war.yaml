id: first-barons-war
name: First Barons’ War
start: "1215-09"
end: "1217-09-20"
tier: B
summary: A civil war in England that broke out after King John repudiated Magna Carta. The rebel barons offered the crown to Prince Louis of France, who invaded in 1216 and held London and much of the south-east, but after John’s death the regents of the boy king Henry III won the barons back, beat Louis’s forces at Lincoln and at sea off Sandwich in 1217, and paid him to leave.
