steps:
  - title: Magna Carta and Louis’s invasion
    date: 1215–1216
    when: "1215-09"
    borders: "1216-10-19"
    countries: [gb, fr]
    body:
      - The loss of Normandy and Anjou, heavy taxes and a long quarrel with the church turned many barons against King John. At Runnymede in June 1215 they forced him to accept Magna Carta, but neither side kept to it. Pope Innocent III annulled the charter in August, and by September the country was at war. The rebels held London. John besieged Rochester castle from 11 October; his miners brought down a corner of the keep by burning its props with the fat of forty pigs, and the starving garrison surrendered on 30 November. Over the winter John’s mercenaries ravaged the rebels’ lands in the north and East Anglia, and the rebels offered the crown to Prince Louis, son of Philip II of France.
      - Louis landed in Kent in May 1216. John fell back to Winchester, and Louis entered London without a fight and was proclaimed king at St Paul’s, though never crowned. He took Winchester after a ten-day siege and soon held more than half the kingdom, and Alexander II of Scotland came south to do homage to him. But Dover castle, defended by Hubert de Burgh, held out against a long siege, and so did Windsor. In October John, campaigning in the east, lost part of his baggage crossing the estuaries of the Wash, fell ill with dysentery and died at Newark on the night of 18–19 October.
    facts:
      - [Magna Carta, "Agreed at Runnymede, 15 June 1215"]
      - [Siege of Rochester, "11 October – 30 November 1215, royalist victory"]
      - [Louis enters London, "June 1216"]
