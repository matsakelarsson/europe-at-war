id: khitan-invasion-of-goryeo
name: Khitan invasion of Goryeo
start: "1216-08"
end: "1219-02"
tier: C
summary: "The invasion of Goryeo by Khitans fleeing the Mongols, which ended in Goryeo’s first alliance with the Mongol Empire. After the Khitan prince Yelü Liuge rebelled against the Jin in Manchuria in 1211 and allied himself with Genghis Khan, his brother Yelü Sibu and other Khitan leaders broke away and set up a rival Liao state (Later Liao). Driven out of Liaodong by the Mongols and by Yelü Liuge, these Khitans, led by the princes Jinshan and Jinshi, crossed the Yalu into Goryeo in the eighth month of 1216, an estimated 90,000 people. They plundered the north-west and in 1217 raided deep into the centre of the country, until defeats at the hands of Kim Chwi-ryeo and other generals drove them back north. In the winter of 1218, 10,000 Mongol troops under Hajin and Jala, with 20,000 Jurchens of Eastern Xia under Wanyan Ziyuan, entered Goryeo from the north-east in pursuit, and the remaining Khitans shut themselves up in the fortress of Gangdong, east of Pyongyang. Snow cut the Mongols’ supplies, and the Goryeo commander of the north-west, Jo Chung, sent them 1,000 sacks of rice and then troops under Kim Chwi-ryeo. Early in 1219 the Khitan leader Hamsa hanged himself and about 50,000 Khitans surrendered. Hajin and Jo Chung swore an oath of brotherhood between the Mongols and Goryeo, which was soon followed by heavy Mongol demands for tribute."
