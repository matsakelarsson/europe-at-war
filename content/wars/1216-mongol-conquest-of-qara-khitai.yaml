id: mongol-conquest-of-qara-khitai
name: Mongol conquest of Qara Khitai
start: "1216"
end: "1218"
tier: C
summary: "The campaign in which the Mongol general Jebe destroyed the realm of Kuchlug, the Naiman prince who had taken over the Qara Khitai (Western Liao) empire of Central Asia. After his defeat by Genghis Khan in 1204 and on the Irtysh in 1208–1209, Kuchlug had fled to the Qara Khitai, married into the ruling family and in 1211 seized the gurkhan Yelü Zhilugu while he was out hunting, ruling in his name until the old ruler’s death in 1213. The Karluks of Qayaliq and the Uyghurs of Qocho had already gone over to the Mongols. Kuchlug, a convert from Christianity to Buddhism, turned the Muslim towns of Kashgar and Khotan against him by quartering troops on their people, burning their harvests and, according to Juvaini, forcing Muslims to give up their faith or their dress; he is said to have crucified the imam of Khotan on the door of his college. When he besieged Almaliq and killed its Karluk ruler, Ozar, a Mongol vassal married into Genghis Khan’s family, Almaliq appealed to Genghis Khan. Jebe, with about 20,000 men and Uyghur and Karluk allies, relieved Almaliq, defeated a Qara Khitai army of about 30,000 near Balasagun and marched on Kashgar, proclaiming that everyone might keep his own religion. The townspeople killed Kuchlug’s soldiers quartered among them, and Kuchlug fled across the Pamirs; hunters caught him on the borders of Badakhshan and Wakhan and handed him to the Mongols, who beheaded him in 1218. The conquest gave the Mongol Empire a long border with the Khwarazmian Empire, which it invaded in 1219. Sources differ on the dates: Jebe’s campaign is put in 1216, 1217 or 1218, and Kuchlug’s death in 1217 or 1218."
