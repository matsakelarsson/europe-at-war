        date: 1219–1221
        text: The crusaders held the city for almost two years and gave it back under the surrender terms in September 1221.
        lonlat: [31.81, 31.415]
      - kind: battle
        side: ay
        name: Battle of Mansurah
        date: August 1221
        text: Cut off by water on all sides, the crusader army could neither advance nor retreat and had to accept al-Kamil’s terms.
        lonlat: [31.4, 31.06]
