id: fifth-crusade
name: Fifth Crusade
start: "1217"
end: "1221-08-30"
tier: B
summary: A crusade called by Pope Innocent III to recover Jerusalem by conquering Egypt. After a Hungarian and Austrian expedition in Syria in 1217, the crusaders took Damietta in the Nile delta in 1219 after a siege of a year and a half, refusing the sultan al-Kamil’s offer to trade it for Jerusalem. Their march on Cairo in 1221 was trapped by the Nile flood near al-Mansurah, and they gave up Damietta in exchange for their freedom and an eight-year truce.
