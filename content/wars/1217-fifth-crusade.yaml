  - title: The march on Cairo
    date: 1220–1221
    when: "1221-07"
    borders: "1221-08-30"
    countries: [eg, de]
    body:
      - For a year and a half the crusaders waited at Damietta for the emperor Frederick II, who had promised to come. Instead he sent troops under Duke Louis of Bavaria, who arrived in May 1221. In July, against John of Brienne’s advice, Pelagius led the army south towards Cairo, just as the Nile began its annual flood. Al-Kamil’s army waited behind a branch of the Nile at al-Mansurah, the camp town he had founded, and his brothers brought reinforcements from Syria.
      - By late August the crusaders were trapped. The Egyptians broke the dykes and flooded the land around them, and their ships cut the river behind. Starving and stuck in the mud, the army surrendered on about 30 August 1221. In return for being allowed to leave, the crusaders gave up Damietta and agreed to an eight-year truce, and al-Kamil promised to return the relic of the True Cross, which could not be found. The crusaders sailed away in September having gained nothing, and many blamed Frederick for staying away.
    facts:
      - [Louis of Bavaria arrives, May 1221]
      - [Surrender near al-Mansurah, "about 30 August 1221"]
      - [Truce, eight years]
    markers:
