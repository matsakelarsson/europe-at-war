notes:
  - Dates are Julian. The crusade had no single leader. John of Brienne, king of Jerusalem, commanded in the field, but the papal legate Pelagius of Albano claimed authority over the army, and their disputes shaped its decisions.
  - The Hungarian and Austrian campaign of 1217–1218 in Syria under Andrew II of Hungary and Leopold VI of Austria is often counted as the first part of the crusade.
