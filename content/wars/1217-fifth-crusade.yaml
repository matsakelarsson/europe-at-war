steps:
  - title: Damietta
    date: 1217–1219
    when: "1218-05-27"
    borders: "1219-11-05"
    countries: [eg, il, hu, at, de, nl, it, fr]
    body:
      - The crusade called at the Fourth Lateran Council of 1215 began in 1217, when Andrew II of Hungary and Leopold VI of Austria led an army to Acre and raided Ayyubid lands in Galilee and beyond the Jordan without lasting result. In May 1218, joined by fleets from Frisia and the Rhineland, the crusaders sailed for Egypt, the centre of Ayyubid power, under John of Brienne, king of Jerusalem, and besieged Damietta at the mouth of the Nile. On 24 August they took the Chain Tower that barred the river, news that is said to have hastened the death of Sultan al-Adil a week later.
      - The siege lasted more than a year, through floods and disease. The papal legate Pelagius, who arrived in September 1218, claimed the leadership and rejected the new sultan al-Kamil’s offer to give up Jerusalem and much of the old kingdom in exchange for Damietta. An attack on the Egyptian camp at Fariskur on 29 August 1219 was beaten back with heavy losses. Francis of Assisi crossed the lines that autumn to preach before al-Kamil, who received him courteously. On 5 November 1219 the crusaders entered Damietta to find most of its people dead of hunger and disease.
    facts:
      - [Chain Tower taken, 24 August 1218]
      - [Battle of Fariskur, "29 August 1219, Ayyubid victory"]
      - [Damietta taken, 5 November 1219]
