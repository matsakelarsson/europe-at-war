        lonlat: [66.976, 39.655]
      - kind: event
        side: mon
        name: The Irtysh
        date: summer 1219
        text: Genghis Khan gathered his army on the upper Irtysh before marching on the Syr Darya.
        lonlat: [84.0, 47.9]
    arrows:
