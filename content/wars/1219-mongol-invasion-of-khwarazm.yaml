id: mongol-invasion-of-khwarazm
name: Mongol invasion of the Khwarazmian Empire
start: "1219-09"
end: "1221-11-24"
tier: A
summary: The invasion in which Genghis Khan destroyed the Khwarazmian Empire, which stretched from the Syr Darya to the Persian Gulf and from the Zagros to the Indus. After the governor of Otrar killed the merchants of a Mongol caravan in 1218 and the Khwarazmshah Muhammad II killed one of Genghis Khan’s envoys, the Mongols crossed the Syr Darya in the autumn of 1219. The Shah spread his troops among the cities, and the Mongols took them one by one, Otrar, Bukhara and Samarkand in 1220, Gurganj, Merv, Nishapur and Herat in 1221, killing much of their populations. Muhammad fled west and died on a Caspian island at the end of 1220. His son Jalal al-Din beat a Mongol army at Parwan but was routed by Genghis Khan on the Indus in November 1221. The war was among the most destructive in history; Khorasan and Transoxiana took generations to recover.
countries: [kz, uz, tm, tj, af, ir, pk]
sides:
  - id: mon
    name: Mongol Empire
    polities: [mongol-empire]
    ink: olive
    moves: Mongol moves
    success: Mongol success
  - id: kw
    name: Khwarazmian Empire
    polities: [khwarazmian-dynasty]
    ink: teal
    moves: Khwarazmian moves
    success: Khwarazmian success
notes:
  - The size of the armies is unknown. Persian chroniclers give the Mongols 600,000 to 800,000 men, which is impossible; modern estimates range from about 75,000 to 200,000, most often 100,000 to 150,000. The Khwarazmian numbers are just as uncertain; older accounts make them larger than the Mongol army, some recent historians smaller, and they were scattered among the cities.
  - The death tolls in the chronicles (700,000 or 1.3 million at Merv, 1,747,000 at Nishapur, 1.2 million at Gurganj, 1.6 to 2.4 million at Herat) are far larger than the cities’ populations and cannot be taken literally, but they reflect a catastrophe that contemporaries could not measure. Juvayni and Rashid al-Din wrote under Mongol rule, Ibn al-Athir in Mosul and Nasawi, Jalal al-Din’s secretary, outside it.
  - Merv’s fall is dated to late February or early March 1221 in most accounts, and to April in some. Some historians place the siege of Bamyan in the autumn rather than the spring of 1221.
