  - title: Gurganj
    date: late 1220 – April 1221
    when: "1221-04"
    borders: "1221-04"
    countries: [uz, tm]
    body:
      - Gurganj, the old capital of Khwarazm in the delta of the Amu Darya, was the richest city still in Khwarazmian hands. Terken Khatun had fled it when the Shah ran, and after his death Jalal al-Din and his brothers came there, but a plot by the Turkish commanders against him forced him to flee south across the Karakum desert, in February 1221 reaching Nishapur, which he left after a few days. Another commander, Khumar Tegin, proclaimed himself sultan in the city.
      - Jochi came from the north and Chagatai and Ögedei from the south. There were no stones for the catapults in the marshy delta, so the Mongols cut down mulberry trees and soaked the trunks to harden them. The brothers quarrelled, Jochi wanting to spare a city that was to be his, and Genghis Khan put Ögedei in command. The defenders fought street by street, and the Mongols lost heavily. The city fell in April 1221. Craftsmen were sent east and young women and children enslaved, and the rest of the people were killed; Juvayni’s story that each of 50,000 soldiers killed 24 people, which would make 1.2 million, cannot be true, but the massacre was one of the worst of the war. Then the Mongols broke the dams on the Amu Darya and flooded what was left.
    facts:
      - [Fall of Gurganj, "April 1221"]
      - [Siege, "several months; seven according to Rashid al-Din"]
      - [Commanders, "Jochi, Chagatai, then Ögedei"]
    markers:
      - kind: taken
        side: mon
        name: Gurganj
        date: April 1221
        text: Taken after a long siege and street fighting. Its people were killed or enslaved and the city was flooded. Its site is today’s Konye-Urgench.
        lonlat: [59.152, 42.326]
    arrows:
