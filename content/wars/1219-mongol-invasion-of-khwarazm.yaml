  - title: Parwan and the Indus
    date: September – November 1221
    when: "1221-11-24"
    borders: "1221-11-24"
    countries: [af, pk]
    body:
      - Jalal al-Din reached Ghazni, which his father had given him, and gathered an army of Turkish soldiers and Afghan and Khalaj tribesmen, 60,000 in the chronicles and perhaps 15,000 in fact. Genghis Khan crossed the Hindu Kush and besieged Bamyan, where his favourite grandson Mutukan was killed by an arrow; when the town fell, everyone in it was killed. Jalal al-Din first beat a Mongol force besieging Walyan, then, at Parwan north of Kabul, defeated Shigi Qutuqu’s army, 30,000 men in Juvayni’s account and perhaps 10,000 in fact, in a two-day battle in a narrow valley. It was the Mongols’ first defeat in a pitched battle in the war. But his commanders quarrelled over the plunder, and the Afghan and Khalaj contingents left him.
      - Genghis Khan marched south with his main army, passing Ghazni, and caught Jalal al-Din on the west bank of the Indus on 24 November 1221 as he was preparing to cross. The Khwarazmians held their ground until a Mongol force climbed a ridge and fell on their flank. Jalal al-Din then rode his horse off the high bank into the river and swam across, and Genghis Khan is said to have stopped his archers from shooting at him in admiration. His army was destroyed and his young sons were killed.
      - Mongol troops followed Jalal al-Din into the Punjab in 1222 and besieged Multan for 42 days before the heat drove them back. Genghis Khan spent 1222 putting down the last revolts and returned slowly to Mongolia, leaving governors in Transoxiana. In the division of the Mongol Empire, the northern cities of the Khwarazmian Empire later passed to the Chagatai Khanate and Khwarazm to the Golden Horde, and western and southern Iran, which the Mongols had only raided, was conquered after 1230. Jalal al-Din went on fighting for ten more years.
