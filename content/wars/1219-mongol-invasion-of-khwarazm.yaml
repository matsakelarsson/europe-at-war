  - title: Bukhara
    date: February 1220
    when: "1220-02-10"
    borders: "1220-02-10"
    countries: [uz]
    body:
      - The Shah expected the Mongols to march on Samarkand, where his field army could support the garrison of Bukhara. Instead Genghis Khan and Tolui, with perhaps 30,000 to 50,000 men, crossed the Kyzylkum desert from oasis to oasis, guided by captured nomads, and took the small towns of Zarnuq and Nur on the way. They appeared before Bukhara, a city of perhaps 300,000 people famous for its scholars and libraries, in February 1220.
      - Bukhara had a single wall and a garrison of Turkish troops, perhaps 20,000 strong in the chronicles and far fewer in fact. On the third night the garrison broke out, and was cut down on its way to the Amu Darya. The city’s leaders opened the gates on 10 February. According to Juvayni, Genghis Khan rode into the Friday mosque, and at the festival prayer ground told the notables that he was “the punishment of God” sent for their sins. The citadel held out for about twelve days; when it fell, everyone in it was killed. The townspeople were driven out of the city and stripped of their goods, craftsmen were sent east and young men taken to fight for the Mongols, and a fire burned most of the city, which was built largely of wood.
    facts:
      - [Bukhara surrenders, "10 February 1220"]
      - [Citadel taken, "about twelve days later"]
      - [Mongol force, "perhaps 30,000–50,000 men"]
    markers:
      - kind: taken
        side: mon
        name: Nur
        date: early 1220
        text: A small town on the edge of the desert, today’s Nurata, which surrendered to Genghis Khan’s vanguard.
        lonlat: [65.69, 40.56]
      - kind: taken
        side: mon
        name: Bukhara
        date: 10 February 1220
        text: The city surrendered after its garrison’s failed sortie. The citadel was stormed, the city plundered and largely burned.
        lonlat: [64.423, 39.767]
      - kind: siege
        side: mon
        name: Otrar
        date: to February 1220
        text: Chagatai and Ögedei were still besieging the town when Bukhara fell.
        lonlat: [68.303, 42.852]
    arrows:
      - side: mon
        label: Genghis Khan and Tolui
        via: [[68.15, 42.75], [66.6, 41.6], [65.75, 40.65], [64.5, 39.82]]
  - title: Samarkand
    date: March – autumn 1220
    when: "1220-03"
    borders: "1220-03"
    countries: [uz]
    body:
      - From Bukhara Genghis Khan marched up the Zarafshan valley to Samarkand, where Chagatai and Ögedei joined him from Otrar. Samarkand had new walls and a large garrison of Turkish troops, put at 50,000 to 110,000 in the chronicles and perhaps 10,000 to 30,000 in fact. The Mongols drove prisoners from Bukhara before them as shields. Muhammad sent two small relief forces, which were driven off, and on the third day of the siege a sortie by the garrison was drawn into an ambush and destroyed.
      - On the fifth day the city’s clergy and leading men negotiated a surrender and opened the gates. The Turkish soldiers, who surrendered hoping to be taken into Mongol service, were killed; the citadel held out for about a month, and about half its defenders broke out and escaped across the Amu Darya. The townspeople were ordered out onto the plain while the city was plundered. Many were killed, tens of thousands of craftsmen were sent east, and many others were taken to serve as labourers in the coming sieges.
      - Muhammad had already left Transoxiana. Genghis Khan sent his generals Jebe and Subutai with two or three tumens after him, and rested the rest of his army through the summer of 1220 in the pastures around Nasaf. In the autumn he stormed Termez on the Amu Darya after an eleven-day siege and had its people killed.
    facts:
      - [Samarkand surrenders, "March 1220"]
      - [Citadel taken, "about a month later"]
      - [Termez stormed, "autumn 1220"]
    markers:
