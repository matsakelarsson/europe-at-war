  - title: The flight of the Shah
    date: April – December 1220
    when: "1220-12"
    borders: "1220-12"
    countries: [ir, af, tm, az]
    body:
      - Muhammad fled south across the Amu Darya to Balkh and then west to Nishapur, where he arrived on 18 April 1220. He left in mid-May, a day before Jebe and Subutai rode in, and fled on to Qazvin and western Iran with the Mongols on his heels. Nishapur submitted, and the Mongols passed on, but a Mongol commander was later killed there. Jebe and Subutai plundered Rayy, Qom and Qazvin and took the submission of Hamadan, while the Shah’s mother Terken Khatun was captured with his harem and treasure in a fortress in Mazandaran and sent to Mongolia.
      - Muhammad reached the Caspian coast and took refuge on an island off Abaskun, near the mouth of the Gorgan river. There, ill and abandoned by most of his followers, he died in December 1220, after naming his eldest son, Jalal al-Din, as his heir. Jebe and Subutai wintered on the Mughan steppe, defeated the Georgians and went on through the Caucasus into the steppes north of it, where they beat the Rus’ princes and the Cumans on the Kalka in 1223 before rejoining Genghis Khan.
    facts:
      - [Shah at Nishapur, "18 April – mid-May 1220"]
      - [Death of Muhammad II, "December 1220, on a Caspian island"]
      - [Pursuers, "Jebe and Subutai, perhaps 20,000–30,000 men"]
    markers:
      - kind: event
        side: kw
        name: Nishapur
