  - title: Otrar and the Syr Darya towns
    date: autumn 1219 – spring 1220
    when: "1219-09"
    borders: "1220-02"
    countries: [kz, uz, tj]
    body:
      - Genghis Khan reached Otrar in the autumn of 1219 and divided his army. His sons Chagatai and Ögedei stayed to besiege the town, his eldest son Jochi marched down the Syr Darya against Sighnaq and Jand, a smaller force went upriver against Benakat and Khujand, and the Khan himself and his youngest son Tolui set off across the Kyzylkum desert towards Bukhara. At Sighnaq the townspeople killed Jochi’s envoy; the town was stormed after seven days and its people killed.
      - Otrar held out for about five months. In February 1220 one of its commanders, Qaracha, went over to the Mongols with his men, and the town was stormed; the Mongols, who despised his disloyalty to his master, executed him. Inalchuq held the citadel for another month, throwing down tiles from the roofs when his men ran out of arrows, and was then taken and executed. Upriver, Timur Malik, the governor of Khujand, held an island fortress in the Syr Darya against a large force of Mongols and prisoners, and finally broke out downstream with his men in boats.
    facts:
      - [Siege of Otrar, "autumn 1219 – February 1220"]
      - [Sighnaq stormed, "after seven days"]
      - [Khujand, "Timur Malik’s island fortress held for weeks, then evacuated by boat"]
    markers:
      - kind: taken
        side: mon
        name: Otrar
        date: February 1220
        text: Stormed after about five months; the citadel fell a month later. Inalchuq was executed, and the townspeople were killed or enslaved.
        lonlat: [68.303, 42.852]
      - kind: taken
        side: mon
        name: Sighnaq
        date: early 1220
        text: The people killed the envoy Jochi sent to demand their surrender; the town was stormed after seven days and almost all its inhabitants killed.
        lonlat: [66.958, 44.158]
      - kind: taken
        side: mon
        name: Khujand
        date: early 1220
        text: The town surrendered, but its governor, Timur Malik, held an island fortress in the river until he escaped downstream by boat.
        lonlat: [69.632, 40.279]
    arrows:
      - side: mon
        label: Jochi
        phase: 1
        via: [[68.2, 42.95], [67.6, 43.6], [67.0, 44.1], [65.6, 44.75], [64.2, 45.4]]
