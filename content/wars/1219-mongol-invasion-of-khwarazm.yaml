  - title: Khorasan laid waste
    date: February – June 1221
    when: "1221-04-10"
    borders: "1221-05"
    countries: [tm, ir, af]
    body:
      - Early in 1221 Genghis Khan crossed the Amu Darya and took Balkh, then laid siege to the fortress of Taliqan. He sent Tolui with an army into Khorasan, the rich province of oasis cities south of the Karakum. Tolui reached Merv in late February. After six days spent studying its defences and a general assault on the seventh, its governor surrendered on a promise of good treatment. The Mongols drove the whole population out onto the plain and killed them, sparing about 400 craftsmen and some children. Ibn al-Athir put the dead at 700,000, and Juvayni reported that a cleric spent thirteen days counting 1.3 million bodies.
      - At Nishapur the Khan’s son-in-law Toghachar had been killed by an arrow from the walls in November 1220. Tolui arrived on 7 April 1221, refused the town’s offer of surrender, breached the walls on 9 April and took the city the next day. According to Juvayni, Toghachar’s widow presided over the killing of everyone in it, even the cats and dogs, apart from 400 craftsmen, and the site was ploughed over. Tus, Abivard and other towns were sacked by detachments.
      - Herat surrendered to Tolui after an eight-day assault; he killed the garrison, said to number 12,000, and spared the townspeople. But after news of Jalal al-Din’s victory at Parwan, Herat and Merv rose against the Mongols. Herat was besieged again for months by the general Eljigidei and destroyed in June 1222, and Merv was ravaged a second time. Modern historians reject the chroniclers’ figures, but Khorasan lost a large part of its people, and its irrigation works were wrecked.
    facts:
      - [Fall of Merv, "late February or early March 1221"]
      - [Fall of Nishapur, "10 April 1221"]
      - [Herat, "surrendered in 1221; destroyed after a rebellion in June 1222"]
    markers:
