steps:
  - title: The caravan at Otrar
    date: 1218–1219
    when: "1218"
    borders: "1218-12"
    countries: [kz, kg, uz]
    body:
      - By 1218 the Khwarazmshah Ala al-Din Muhammad II ruled an empire built in a few decades, from Transoxiana and Khorasan to western Iran and Afghanistan. In the same years Genghis Khan had united the Mongol tribes and attacked the Jin empire in northern China. In 1218 his general Jebe hunted down the Naiman prince Kuchlug, who had seized the Qara Khitai empire, and killed him in Badakhshan, so that the two empires now met along the Syr Darya. Muhammad had also quarrelled with the Abbasid caliph al-Nasir, and in 1217 marched on Baghdad until snow in the Zagros turned him back.
      - In 1218 a large caravan of Muslim merchants sent by Genghis Khan and his family, said to number 450 men, reached the frontier town of Otrar. Its governor, Inalchuq, a kinsman of the Shah’s mother Terken Khatun, accused them of spying, seized their goods and had them killed. Genghis Khan sent envoys to demand that Inalchuq be handed over; Muhammad had one of them killed and the others humiliated. Leaving a small army under Muqali to carry on the war in China, the Khan gathered his forces on the upper Irtysh in the summer of 1219 and marched west.
      - The Shah’s commanders urged him to fight in the field, but he did not trust them or his mother’s Turkish kinsmen who led much of his army, and feared the Mongols’ speed. He decided instead to garrison his cities separately, Otrar, Bukhara, Samarkand and the cities of Khorasan, and to let the Mongols wear themselves out against their walls.
    facts:
      - [Caravan massacred at Otrar, "1218"]
      - [Mongol army, "perhaps 100,000–150,000 men (estimates range from 75,000 to 200,000)"]
      - [Mongol commanders, "Genghis Khan, his sons Jochi, Chagatai, Ögedei and Tolui, Jebe, Subutai"]
    markers:
      - kind: event
        side: kw
        name: Otrar
        date: "1218"
        text: The governor Inalchuq had the merchants of the Mongol caravan killed and took their goods; only one man is said to have escaped to tell the Khan.
        lonlat: [68.303, 42.852]
