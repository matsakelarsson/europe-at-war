steps:
  - title: India and the return to Iran
    date: 1221–1224
    when: "1222"
    borders: "1224"
    countries: [pk, in, ir]
    body:
      - Jalal al-Din got about 4,000 of his men across the Indus after his defeat in November 1221 and gathered them in the Salt Range of the Punjab. He asked Iltutmish, the sultan of Delhi, for refuge, but Iltutmish, unwilling to draw the Mongols onto his lands, sent gifts and kept him away. Jalal al-Din made alliances with local chiefs, fought others, and quarrelled with Nasir al-Din Qubacha, the ruler of Multan and Sind. A Mongol army under Dorbei followed him into the Punjab in 1222, took the fort of Nandana and besieged Multan for 42 days before the summer heat drove it back.
      - In 1223 or 1224, hearing that his brother Ghiyath al-Din held much of western Iran, Jalal al-Din marched west through Makran. In Kerman he confirmed Buraq Hajib, a Qara Khitai commander who had seized the province, as its governor. In Fars he married a daughter of the Salghurid atabeg Sa’d, and in Isfahan his brother accepted him as overlord. He then clashed with the army of the Abbasid caliph al-Nasir, his father’s old enemy, and plundered the country north of Baghdad.
    facts:
      - [Crossing of the Indus, "November 1221, with about 4,000 men"]
      - [Mongol siege of Multan, "1222, 42 days"]
      - [Return through Kerman, "1224"]
