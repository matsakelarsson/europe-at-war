  - title: Akhlat, Yassıçemen and the end
    date: 1227–1231
    when: "1230-08"
    borders: "1230-08"
    countries: [tr, ir, az]
    body:
      - In 1227 or 1228 a Mongol army invaded central Iran and fought Jalal al-Din outside Isfahan. Part of his army deserted, and the Mongols are usually counted the victors, but they lost so heavily that they withdrew across the Oxus. His brother Ghiyath al-Din rebelled and fled to Kerman, where Buraq Hajib had him killed. In 1229 Jalal al-Din besieged Akhlat again, and in April 1230 took it after about eight months and sacked it.
      - The fall of Akhlat brought the Seljuk sultan of Rum, Kayqubad I, into alliance with the Ayyubid prince al-Ashraf, who had held the town. Jalal al-Din marched west, with the support of the rebel Seljuk governor of Erzurum, and met their combined army at Yassıçemen, west of Erzincan. After a first skirmish on 10 August 1230 that he won, the allies, with the advantage of numbers, beat off his attacks in two days of fighting, and he left the field and fled east.
      - In 1231 a Mongol army of three tumens under Chormaqan, sent by the Great Khan Ögedei, rode into Azerbaijan. Jalal al-Din’s army melted away; he fled from the Mughan steppe westwards by way of Akhlat and Amid, and in August 1231 he was killed by a Kurd in a village near Mayyafariqin, today’s Silvan. The Mongols took over north-western Iran, from where they attacked Georgia and Armenia in the following years. Bands of his Khwarazmian soldiers took service with the Ayyubids in Syria, sacked Jerusalem in 1244 and fought on until they were destroyed near Homs in 1246.
    facts:
      - [Akhlat taken, "April 1230"]
      - [Battle of Yassıçemen, "10–12 August 1230, Seljuk and Ayyubid victory"]
      - [Death of Jalal al-Din, "August 1231, near Mayyafariqin"]
    markers:
