  - title: Tabriz, Garni and Tbilisi
    date: 1225–1226
    when: "1225-08"
    borders: "1225-08"
    countries: [ir, az, am, ge]
    body:
      - In 1225 Jalal al-Din marched into Azerbaijan, whose Eldiguzid atabeg Özbeg had paid tribute to the Mongols, and took Tabriz on 25 July; Özbeg fled to Ganja and died soon after, and Jalal al-Din married his wife. He then demanded the submission of Queen Rusudan of Georgia, whose kingdom had raided Azerbaijan and Armenia for decades. In August 1225 he met the Georgian army near Garni. The Georgian vanguard under the brothers Shalva and Ivane Akhaltsikheli fought alone while the main army under the atabeg Ivane Mkhargrdzeli held back, which Georgian chroniclers blamed on a feud between the commanders, and the Georgians were routed. Ivane Akhaltsikheli was killed, and Shalva was captured and later executed.
      - Rusudan withdrew to Kutaisi in western Georgia. In March 1226 Jalal al-Din took Tbilisi, according to the chroniclers after its Muslim inhabitants opened a gate; the city was sacked, its churches were destroyed and many Christians who refused to convert were killed. The same year he besieged the Ayyubid town of Akhlat on Lake Van without success and had to march east to put down a revolt by Buraq Hajib in Kerman. His realm now reached from Kerman to the Caucasus, but he ruled it mainly by plunder and constant campaigning.
    facts:
      - [Tabriz taken, "25 July 1225"]
      - [Battle of Garni, "August 1225, Khwarazmian victory"]
      - [Sack of Tbilisi, "March 1226"]
    markers:
