id: jalal-al-din-campaigns
name: Campaigns of Jalal al-Din Mangburni
start: "1221-11"
end: "1231-08"
tier: B
summary: The wars of the last Khwarazmshah, Jalal al-Din Mangburni, after Genghis Khan destroyed his father’s empire. Having escaped across the Indus in 1221, he spent three years in the Punjab and Sind, then came back to Iran in 1224 and built a new realm in Kerman, Fars, central Iran and Azerbaijan, taking Tabriz from the Eldiguzids in 1225. He crushed the Georgians at Garni and sacked Tbilisi, fought the Abbasid caliph and the Mongols, and took the Ayyubid town of Akhlat in 1230 after a long siege. That conquest united the Seljuks of Rum and the Ayyubids against him, and they defeated him near Erzincan in August 1230. When a new Mongol army came in 1231 his followers scattered, and he was killed by a Kurd near Mayyafariqin in August 1231.
