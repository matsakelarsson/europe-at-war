notes:
  - The main source is the biography of Jalal al-Din by his secretary, al-Nasawi, which is sympathetic to him; Juvayni and Ibn al-Athir are more critical. The dates of the battle of Garni (1225 in most accounts, 1226 in some) and of the battle with the Mongols near Isfahan (1227 or 1228) differ between the sources.
  - The claim of a Georgian chronicle that 100,000 people were killed at Tbilisi for refusing to give up Christianity is not a reliable number, but the sack is well attested.
