notes:
  - "Historians disagree on Go-Toba’s aim: his decree named only Yoshitoki, and some read it as an attempt to bring the shogunate under the court by removing the Hōjō rather than to abolish it. The figures for the armies come from the Azuma kagami and the war tale Jōkyūki and are certainly exaggerated."
  - Dates are months and days of the Japanese lunar calendar; the sixth month of 1221 fell roughly in July.
