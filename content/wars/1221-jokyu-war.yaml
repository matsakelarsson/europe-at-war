steps:
  - title: Go-Toba’s decree and the march from Kamakura
    date: fifth and sixth months of 1221
    when: "1221-06"
    borders: "1221"
    countries: [jp]
    body:
      - "Go-Toba, who had abdicated in 1198 but ruled the court as retired emperor, had added a western guard of warriors to the palace guards of his predecessors and drew warriors of the west and the capital region into his service. Relations with Kamakura soured after Sanetomo’s death: Go-Toba refused to send one of his sons as shōgun and demanded that the shogunate remove the stewards from two of his estates, which Yoshitoki refused. In the fourth month of 1221 Emperor Juntoku abdicated in favour of his young son so as to support his father freely, and Go-Toba gathered more than a thousand warriors in the capital under the cover of a temple festival. On the 15th day of the fifth month his men killed the shogunate’s deputy in Kyoto, Iga Mitsusue, and Go-Toba issued orders throughout the country to strike down Yoshitoki."
      - "In Kamakura Hōjō Masako, the widow of Yoritomo, called the shogunate’s vassals together and reminded them of all they owed her husband, and on the advice of the official Ōe no Hiromoto the shogunate chose to march at once rather than defend the passes at Hakone. On the 22nd day of the fifth month the first troops left Kamakura. Yoshitoki’s son Yasutoki and brother Tokifusa led the main army along the Pacific coast road, Takeda Nobumitsu and Ogasawara Nagakiyo of Kai the army of the mountain road, and Yoshitoki’s son Tomotoki the army of the Sea of Japan coast, and warriors joined them on the way. The court’s commander, Fujiwara no Hideyasu, spread his 17,500 men along the Kiso River on the border of Mino and Owari. On the fifth day of the sixth month the mountain army broke through at the Ōido crossing, and the court’s commanders fell back towards the capital; when the main army crossed the river the next day it found the camp at Sunomata empty and routed the last defenders on the Kuise River. The northern army defeated the court’s forces in Etchū on the eighth."
