  - title: Uji and Seta, and the fall of Kyoto
    date: sixth and seventh months of 1221
    when: "1221-07"
    borders: "1221"
    countries: [jp]
    body:
      - "Go-Toba went to Mount Hiei to ask for the help of its warrior monks, who refused, and the court placed its remaining forces behind the Uji River, at the bridges of Uji and Seta that guarded the approaches to the capital, with courtiers and monks among the commanders. On the 13th day of the sixth month the Kamakura armies attacked. The defenders had pulled up the bridge planks, and the river was swollen with rain; on the 14th Sasaki Nobutsuna led horsemen across the flood at Uji, many men drowned, and the line broke. When the defeated commanders came to Go-Toba’s palace for a last stand, he shut the gates on them, and he disowned the war, blaming his advisers. On the 15th the Kamakura army entered Kyoto."
      - "Yasutoki and Tokifusa stayed in Kyoto as the shogunate’s deputies at Rokuhara, the old Taira quarter, and carried out Yoshitoki’s settlement. Go-Toba was exiled to the Oki Islands in the seventh month and Juntoku to Sado; Tsuchimikado, who had opposed the war, chose to follow them into exile in Tosa. The three-year-old emperor Chūkyō was deposed after less than three months on the throne in favour of Go-Horikawa, a nephew of Go-Toba, and the courtiers who had led the plot were executed or exiled. More than 3,000 estates of the court’s supporters were confiscated, and many were given to eastern warriors as stewards, carrying the shogunate’s power into western Japan. From then on Kamakura decided the imperial succession."
    facts:
