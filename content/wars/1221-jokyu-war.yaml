id: jokyu-war
name: Jōkyū War
start: "1221"
end: "1221"
tier: B
summary: "The short war in which the retired emperor Go-Toba tried to break the power of the Hōjō regents of the Kamakura shogunate and was crushed within a month, leaving the warrior government master of the court. After the assassination of the third Minamoto shōgun, Sanetomo, in 1219, the shogunate was run by his mother Hōjō Masako and her brother, the regent Hōjō Yoshitoki, with an infant from the Kujō family as nominal shōgun, while Go-Toba built up his own warrior guard and quarrelled with Kamakura over the stewards it placed on his estates. In the fifth month of 1221 Go-Toba had the shogunate’s deputy in Kyoto killed and declared Yoshitoki an outlaw, expecting the eastern warriors to abandon him. Instead, rallied by Masako, they marched on Kyoto in three armies, which the shogunate’s chronicle puts at 190,000 horsemen, against perhaps 17,500 for the court. The court’s forces were routed on the Kiso River on the fifth and sixth days of the sixth month and at Uji and Seta on the 13th and 14th, and Kamakura’s army entered Kyoto. Go-Toba was exiled to the Oki Islands, where he died in 1239, the retired emperors Juntoku and Tsuchimikado were sent to Sado and Tosa, and the child emperor Chūkyō was deposed. The shogunate confiscated more than 3,000 estates of the court’s supporters and set up the Rokuhara deputies to watch over the court."
