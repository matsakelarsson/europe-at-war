  - title: Yaghmurasen, the Marinids and the death of al-Said
    date: 1236–1248
    when: "1236"
    borders: "1248-06-01"
    countries: [ma, dz]
    body:
      - In the central Maghreb the Almohads had settled the Banu Abd al-Wad, a nomadic Zenata Berber tribe, in the country around Tlemcen. In 1236 their chief Yaghmurasen ibn Zayyan made himself master of the city, and his descendants, the Zayyanids, ruled the kingdom of Tlemcen for three centuries. He had to accept Hafsid overlordship after 1242, but he held his own against the Almohads, the Marinids and the Arab tribes of the region.
      - The Marinids, another Zenata tribe from the steppes between the Zab and eastern Morocco, had been taxing the farmers of north-eastern Morocco, between Nador and Berkane, since about 1213, and fighting the Almohads since 1215. An Almohad army defeated them in 1217 and their chief Abd al-Haqq was killed, but they kept coming back. Under his son Abu Yahya, chief from 1244, they took Meknes in 1244 or 1245. The caliph Abu al-Hasan al-Said (1242–1248), the last caliph to try to restore the empire, drove them back east of Taza and forced them to submit, at least in name.
      - In 1248 al-Said marched east to win back Tlemcen and then Ifriqiya. Yaghmurasen would not meet him in open battle and shut himself up in a mountain fortress, and in June 1248 the caliph was ambushed and killed near Oujda. His army scattered, and his head was sent to his mother. It was the last Almohad attempt to recover the lost provinces.
    facts:
      - [Yaghmurasen takes Tlemcen, "1236"]
      - [Marinids take Meknes, "1244 or 1245"]
      - [Al-Said killed near Oujda, "June 1248"]
