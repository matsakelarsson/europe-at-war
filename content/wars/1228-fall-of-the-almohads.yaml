  - title: The Marinids take Fez
    date: 1248–1258
    when: "1248"
    borders: "1258-01-01"
    countries: [ma]
    body:
      - The Marinid chief Abu Yahya had sent a contingent with al-Said’s army. When the caliph was killed, he caught the remains of the Almohad army at Guercif on its way home and destroyed it, and later in 1248 he took Fez, which became the Marinid capital. Taza, Rabat and Salé also passed to him. Fez rose against Marinid rule while he was away the following year, and he put the revolt down harshly.
      - The new caliph, al-Murtada (1248–1266), a cultivated man who copied Qur’ans in his own hand, held Marrakesh, the High Atlas and the Sous, and in a series of campaigns the Marinids pushed him back. Abu Yahya took the oasis city of Sijilmasa, the northern end of the caravan routes across the Sahara, in 1255 (some sources give a later date), and Yaghmurasen fought him for it. When Abu Yahya died of illness in 1258, the Almohads held only Marrakesh, the High Atlas and the Sous.
    facts:
