  - title: Abu Yusuf takes Marrakesh
    date: 1258–1269
    when: "1258"
    borders: "1269-09-30"
    countries: [ma, dz]
    body:
      - Abu Yahya’s brother Abu Yusuf Yaqub (1258–1286), regarded as the real founder of the Marinid state, faced Castile as well as the Almohads. In September 1260 a Castilian fleet surprised and sacked Salé, and Abu Yusuf drove the invaders out. He besieged Marrakesh without success, and then turned to intrigue. An Almohad prince, Idris Abu Dabbus, came to him for help, and with Marinid backing he took Marrakesh in 1266 and overthrew his cousin al-Murtada. Once in power, however, Abu Dabbus refused to become Abu Yusuf’s vassal, and Yaghmurasen of Tlemcen took his side.
      - Abu Yusuf dealt with his enemies one at a time. In 1268 he defeated Yaghmurasen on the Moulouya, and then laid siege to Marrakesh. Abu Dabbus was killed in 1269, and in September 1269 Abu Yusuf entered the city. A century and a half after Ibn Tumart had preached in the Atlas, the Almohad caliphate was at an end.
    facts:
      - [Castilian sack of Salé, "September 1260"]
      - [Abu Dabbus takes Marrakesh, "1266"]
      - [Zayyanids defeated on the Moulouya, "1268"]
      - [Marrakesh taken by the Marinids, "September 1269"]
    markers:
