steps:
  - title: Rival caliphs and al-Ma’mun’s break
    date: 1224–1232
    when: "1228"
    borders: "1229-06-01"
    countries: [ma, es]
    body:
      - After the defeat at Las Navas de Tolosa in 1212 the Almohad caliphate was governed for a decade by the court of the boy caliph Yusuf II al-Mustansir. When he died without an heir early in 1224, the officials in Marrakesh chose his elderly great-uncle Abd al-Wahid, but the caliph’s uncle Abdallah al-Adil, governor of Murcia, claimed the throne, and Abd al-Wahid was deposed and killed. It was the first time the ruling family had fought itself for the caliphate, and it set off a chain of coups. Al-Adil was murdered in Marrakesh in October 1227 and the Almohad sheikhs there proclaimed Yahya al-Mu’tasim, a son of al-Nasir, while al-Adil’s brother Idris al-Ma’mun claimed the caliphate in Seville.
      - Al-Ma’mun bought a truce from Ferdinand III of Castile and hired Castilian troops, 500 knights according to the Arabic chronicler Ibn Idhari and many more in later Christian accounts. In October 1228 he left Seville for Morocco with most of the Almohad army in Spain. It was the end of Almohad rule in al-Andalus, whose towns went over to Ibn Hud of Murcia and were taken one by one by Castile, León, Portugal and Aragon. In 1229 al-Ma’mun defeated Yahya and entered Marrakesh. There he renounced the movement’s central teaching, that its founder Ibn Tumart had been the Mahdi, recognised the Abbasid caliph in Baghdad, had the Almohad sheikhs who had backed Yahya executed, and allowed his Castilian soldiers a church in the city.
      - The break with the doctrine on which the caliphate rested gave its governors a reason to break with the caliph. In Ifriqiya the Hafsid governor stopped naming him in the Friday prayer in 1229. In Morocco the war between the rival caliphs went on. In 1232, while al-Ma’mun was besieging rebels in Ceuta, Yahya took Marrakesh, and al-Ma’mun died on the march back in October. His son Abd al-Wahid II al-Rashid (1232–1242) won Marrakesh back and made peace with the sheikhs, but the caliphs now ruled little more than the plains and mountains of central and southern Morocco.
    facts:
      - [Death of Yusuf II, "early 1224"]
      - [Al-Ma’mun leaves Seville, "October 1228"]
      - [Al-Ma’mun takes Marrakesh, "1229"]
      - [Death of al-Ma’mun, "October 1232"]
