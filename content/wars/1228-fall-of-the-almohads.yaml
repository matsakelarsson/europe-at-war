  - title: Tinmel and the three kingdoms
    date: 1269–1276
    when: "1269"
    borders: "1276-01-01"
    countries: [ma, dz, tn]
    body:
      - The last Almohad loyalists withdrew to Tinmel, the village in the High Atlas where Ibn Tumart had founded the movement in the 1120s, where he was buried and where a great mosque stood beside the tombs of the caliphs. They made a final stand there, and their last leaders were defeated and captured in 1275. In 1276 Abu Yusuf founded a new royal city, Fes el-Jdid, beside old Fez.
      - In place of one empire there were now three kingdoms, each ruled by a dynasty that had begun as Almohad governors or tribal allies. The Marinids in Fez, Zenata Berbers without the religious mission of the Almoravids or Almohads, built madrasas and patronised Maliki scholars to give themselves legitimacy; the Zayyanids held Tlemcen and the central Maghreb; and the Hafsids in Tunis presented themselves as the true heirs of Ibn Tumart. Their wars over the next three centuries, with the Marinids pressing east against Tlemcen and twice taking Tunis, have their own entries, as do the Marinid campaigns in Spain that began in 1275.
    facts:
      - [Last Almohads defeated at Tinmel, "1275"]
      - [Fes el-Jdid founded, "1276"]
    markers:
