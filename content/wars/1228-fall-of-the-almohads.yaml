id: fall-of-the-almohads
name: Fall of the Almohads
start: "1228"
end: "1275"
tier: A
summary: "The break-up of the Almohad Caliphate, which had ruled the Maghreb and al-Andalus from Marrakesh, into the three kingdoms that shared North Africa for the next three centuries. After the defeat at Las Navas de Tolosa (1212) and the death of the young caliph Yusuf II in 1224, members of the ruling family fought each other for the throne. Idris al-Ma’mun brought the Almohad army over from Spain in 1228 with Castilian mercenaries, took Marrakesh and renounced the movement’s founding doctrine that Ibn Tumart had been the Mahdi. His governors and the Zenata Berber tribes used the chance to break away: the Hafsid governor Abu Zakariya made Ifriqiya an independent kingdom from Tunis in 1229, Yaghmurasen ibn Zayyan ruled Tlemcen from 1236, and the Marinids, who had been raiding north-eastern Morocco since about 1215, took Meknes (1244) and, after the caliph al-Said was killed near Oujda in 1248, Fez. The caliphs were left with Marrakesh and the High Atlas, until the Marinid Abu Yusuf Yaqub took Marrakesh in September 1269; the last Almohads were defeated at Tinmel in 1275."
countries: [ma, dz, tn, ly, es]
