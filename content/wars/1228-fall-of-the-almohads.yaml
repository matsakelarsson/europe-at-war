notes:
  - The main sources are Arabic chroniclers of the 13th and 14th centuries, above all Ibn Idhari, Ibn Abi Zar (the Rawd al-Qirtas) and Ibn Khaldun, who wrote for the Marinid and Hafsid courts. Their dates, converted here to the Julian calendar, sometimes differ by a year or more (Meknes 1244 or 1245; Sijilmasa 1255 or later), and the text then says so.
  - The Zayyanids are also called the Abdalwadids, after their tribe, the Banu Abd al-Wad. The Almohad caliphs are named by their regnal titles (al-Ma’mun, al-Rashid, al-Said, al-Murtada); the last, Idris al-Wathiq, is usually called Abu Dabbus.
  - The loss of al-Andalus after 1228 is told in the Reconquista, and the Marinid crossings into Spain from 1275 in the same story. The Hafsid wars with the Banu Ghaniya have their own entry.
