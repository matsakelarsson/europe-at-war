  - title: The Hafsids in Tunis
    date: 1229–1242
    when: "1229"
    borders: "1242-08-01"
    countries: [tn, dz, ly]
    body:
      - Abu Zakariya Yahya was a grandson of Abu Hafs Umar, one of Ibn Tumart’s first companions, and a son of Abd al-Wahid ibn Abi Hafs, who had governed Ifriqiya for the Almohads from 1207 to 1221. He had been governor of Gabès, and in 1228, when the troops of his brother Abu Muhammad Abdallah deserted at Kairouan, he took over the government of Ifriqiya. In 1229, giving al-Ma’mun’s abandonment of the doctrine as his reason, he stopped naming the caliph in the Friday prayer and ruled from Tunis on his own account, as the true heir of Ibn Tumart’s movement.
      - He then expanded his realm in every direction. He took Constantine and Bougie in 1229–1230, Tripoli in 1234 and Algiers in 1235, drove Yahya ibn Ghaniya’s raiders from the lands south of Constantine, and by 1236 had reached the Chelif river, bringing the Berber tribes of the mountains under his rule in the years that followed. Tunis traded with Sicily, Genoa, Pisa and Venice, and in 1238 Abu Zakariya sent a fleet to help Muslim Valencia against James I of Aragon.
      - In July 1242 he took Tlemcen, and Yaghmurasen kept his throne as his vassal. Sijilmasa and Ceuta also recognised him, and when the caliph al-Rashid died in December 1242, Abu Zakariya was the strongest ruler in the Maghreb; the Marinids and several towns of al-Andalus named him in their prayers. He died in 1249. His son Muhammad al-Mustansir took the title of caliph, and in 1259 the Sharif of Mecca recognised him for a time.
    facts:
