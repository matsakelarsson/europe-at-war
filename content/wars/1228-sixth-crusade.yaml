notes:
  - The treaty was unpopular on both sides. Many Muslims condemned al-Kamil for giving up Jerusalem, and the patriarch of Jerusalem and the military orders rejected an agreement made by an excommunicated emperor. Jerusalem, left unwalled, was lost again in 1244.
  - Frederick’s wars with the papacy and the Lombard cities are told under Frederick II and the Lombard League.
