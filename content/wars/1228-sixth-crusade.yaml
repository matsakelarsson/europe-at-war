id: sixth-crusade
name: Sixth Crusade
start: "1228-06"
end: "1229-05"
tier: C
summary: The crusade of the emperor Frederick II, who had married the heiress of the Kingdom of Jerusalem and sailed east in 1228 while excommunicated by Pope Gregory IX. Without fighting a battle, he negotiated the Treaty of Jaffa with the Ayyubid sultan al-Kamil on 18 February 1229, which returned Jerusalem, Bethlehem, Nazareth and a corridor to the coast to the kingdom for ten years, while the Muslims kept the Temple Mount. Frederick crowned himself in the Church of the Holy Sepulchre on 18 March 1229 and hurried home in May, as papal troops had invaded his Kingdom of Sicily.
