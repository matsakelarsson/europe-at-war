id: epirote-bulgarian-war
name: Epirote–Bulgarian war
start: "1230-03"
end: "1230-03-09"
tier: C
summary: A short war in which Theodore Komnenos Doukas, ruler of Epirus and emperor at Thessalonica, broke his alliance with Tsar Ivan Asen II of Bulgaria and invaded Bulgaria in 1230, intending to go on to take Constantinople. At Klokotnitsa, near Haskovo, Asen routed his army on 9 March 1230 and took him prisoner. Bulgaria then occupied most of Thrace, Macedonia and Albania, becoming the leading power in the Balkans, and Theodore’s empire was reduced to Thessalonica, Thessaly and Epirus under his brother Manuel.
