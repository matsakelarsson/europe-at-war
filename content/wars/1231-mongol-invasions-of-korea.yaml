  - title: Ganghwa and the death of Saritai
    date: 1232–1233
    when: "1232-12"
    borders: "1233-06"
    countries: [kp, kr]
    body:
      - In the sixth month of 1232 Choe U decided to move the king and court to Ganghwa Island, and the king moved there in the seventh month, close to the coast but separated from it by fast tidal channels, and ordered the people of the provinces to take refuge in mountain fortresses and on islands. An official who spoke against the move was executed. That summer the Mongol overseers in the north-west were killed. Saritai invaded again and swept south into the valley of the Han River; the fortress of Gwangju held out, and the first set of printing blocks of the Buddhist canon, kept at Buinsa near today’s Daegu, was burned.
      - In the twelfth month of 1232 Saritai attacked the small earth-walled fortress of Cheoin, near today’s Yongin, held by about a hundred monks and a thousand refugees. He was killed by an arrow, traditionally credited to the monk Kim Yun-hu, and the Mongol army withdrew, leaving Hong Bok-won in charge of the north-west. In 1233 Goryeo forces drove Hong out of the Western Capital, Pyongyang, and he fled to Liaodong.
    facts:
      - [Court moves to Ganghwa, "seventh month of 1232"]
      - [Death of Saritai, "twelfth month of 1232, at Cheoin"]
      - [Hong Bok-won driven from Pyongyang, "1233"]
    markers:
