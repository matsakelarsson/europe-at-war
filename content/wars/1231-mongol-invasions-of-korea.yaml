  - title: Jalairtai’s campaigns
    date: 1254–1257
    when: "1254-09"
    borders: "1257-10"
    countries: [kp, kr]
    body:
      - In September 1254 the Mongol general Jalairtai crossed the Yalu and led the most destructive of the invasions. His army besieged Chungju until a storm forced it to withdraw, and then attacked the mountain fortress of Sangju, where it lost heavily and a Mongol officer was shot by the monk Hongji. According to the Goryeosa the Mongols carried off 206,800 men and women in 1254, and the dead were beyond counting; famine followed, and the chronicles describe abandoned infants left tied to trees.
      - Jalairtai returned in 1255 and stayed through 1256, camping at Haeyang (today’s Gwangju) in the south-west and building ships to attack the islands where people had taken refuge; Goryeo forces beat off some of these attacks. Another invasion came in 1257. In October 1257 the envoy Kim Su-gang persuaded the Mongol court to withdraw the army.
    facts:
