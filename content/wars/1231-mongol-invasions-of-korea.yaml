  - title: Kuju and Jaju hold out
    date: 1231–1232
    when: "1231-10"
    borders: "1232-03"
    countries: [kp]
    body:
      - Behind the Mongol advance several fortresses refused to surrender. At Kuju (Gwiju, today’s Kusong), Pak Seo, with Kim Gyeong-son and troops gathered from the surrounding towns, held out for months. The Mongols attacked with siege towers and carts of brushwood, mined the walls and bombarded the south wall with fifteen large catapults; the defenders poured molten iron on the siege engines, put out fires with mud and water, repaired the breaches and drove the attackers off with sorties. Jaju, under Choe Chun-myeong, also held. Both gave up only after repeated orders from the court, which had already submitted.
      - Saritai demanded 20,000 horses, 10,000 bolts of silk, 20,000 otter skins, clothing for a million soldiers and hostages from the royal family and the great officials. Goryeo sent a large tribute but no hostages. In the spring of 1232 Saritai withdrew his main army, leaving 72 Mongol overseers (darughachi) in the towns of the north-west to see that Goryeo kept its word.
    facts:
      - [Siege of Kuju, "1231–1232, the fortress held out"]
      - [Mongol overseers left behind, "72, in the spring of 1232"]
    markers:
      - kind: held
        side: gor
        name: Kuju
        date: 1231–1232
        text: Pak Seo held the fortress through a long siege with catapults, towers and mines, surrendering only on the court’s orders.
        lonlat: [125.230, 39.960]
        lp: l
      - kind: held
