id: mongol-invasions-of-korea
name: Mongol invasions of Korea
start: "1231-08-26"
end: "1259"
tier: A
summary: "A series of Mongol invasions of Goryeo over nearly three decades, which ended with Goryeo becoming a subordinate ally of the Mongol Yuan empire but keeping its own dynasty. After a Mongol envoy was killed on his way home from Goryeo in 1225, Saritai invaded in 1231, defeated the Goryeo army and forced the court to submit. In 1232 the military ruler Choe U moved the court to Ganghwa Island, off the west coast, which the Mongols never attacked, and told the people to take refuge in mountain fortresses and on islands; Saritai was killed by an arrow at Cheoin later that year. Further invasions in 1235–1239, 1247–1248 and 1253–1257 spread devastation across the country while the court held out on Ganghwa. Mountain fortresses such as Kuju and Chungju resisted long sieges, but the countryside was stripped: the chronicles record 206,800 people carried off in 1254 alone, and the nine-storey pagoda of Hwangnyongsa and the first printing blocks of the Buddhist canon were burned. In 1258 the last of the Choe dictators was killed, the north-east went over to the Mongols, and in 1259 the court made peace and sent the crown prince to the Mongol court. The court moved back to the old capital, Kaegyong, in 1270, which set off the Sambyeolcho rebellion."
countries: [kp, kr]
sides:
  - id: gor
    name: Goryeo
    polities: [goryeo]
    ink: blue
    moves: Goryeo moves
    success: Goryeo success
  - id: mon
    name: Mongols, with Eastern Xia Jurchens and Korean defectors
    polities: [mongol-empire, yuan, eastern-xia]
    ink: slate
    moves: Mongol moves
    success: Mongol success
notes:
  - The usual count of six or nine invasions varies between historians. English dates for the invasions follow William Henthorn’s study (1963) as given on Wikipedia; other dates are lunar months from the Goryeosa.
  - The figure of 206,800 people carried off in 1254 comes from the Goryeosa and is the only number the chronicles give for the losses; the total death toll of the invasions is unknown.
  - Some English accounts say the Mongols massacred the people of Chungju at the end of the siege of 1253; the Korean chronicles and the Encyclopedia of Korean Culture record that the fortress held out and the Mongols withdrew.
