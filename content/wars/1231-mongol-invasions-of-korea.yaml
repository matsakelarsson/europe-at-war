  - title: Tangut-Batur and the burning of Hwangnyongsa
    date: 1235–1241
    when: "1236"
    borders: "1239-04"
    countries: [kp, kr]
    body:
      - After the Mongols destroyed the Jin empire in 1234, Ögedei Khan ordered a new campaign against Goryeo. From 1235 an army of Mongols and Eastern Xia Jurchens under Tangut-Batur ranged across the country for four years, reaching Cheongju and the area of today’s Seoul in 1236 and the south-east in 1238, when the great wooden pagoda of Hwangnyongsa in Gyeongju, nine storeys high, was burned. Goryeo fielded no large army. The court stayed on Ganghwa, the people sheltered in mountain fortresses and on islands, and small mobile units, the byeolcho, ambushed Mongol detachments.
      - In 1237 the court began carving a new set of printing blocks for the Buddhist canon as a prayer for the country’s protection; the more than 80,000 blocks of the Tripitaka Koreana, finished in 1248, survive at Haeinsa. After talks in the winter of 1238 the Mongols withdrew in 1239. They demanded that the king come to their court in person; Gojong excused himself on grounds of mourning, age and illness, and in 1241 Goryeo sent a royal relative, Wang Sun, passing him off as the king’s son.
    facts:
      - [Third invasion, "1235–1239"]
      - [Hwangnyongsa pagoda burned, "1238"]
      - [Tripitaka Koreana carved, "1237–1248"]
