  - title: Yegü and the siege of Chungju
    date: 1247–1254
    when: "1253-08-03"
    borders: "1254-01"
    countries: [kp, kr]
    body:
      - A Mongol army under Amukan invaded again in 1247–1248, and Mongol forces held the land north of the Cheongcheon River. Choe U died in 1249 and was succeeded by his son Choe Hang. When Möngke became khan in 1251 he repeated the demands that the king come to the Mongol court and that the court leave Ganghwa. They were refused, and on 3 August 1253 an army under Prince Yegü, Amukan and Hong Bok-won crossed the Yalu and swept south.
      - The mountain fortress of Chungju, in the centre of the country, held out for about seventy days. Its commander, Kim Yun-hu, the monk credited with killing Saritai, burned the registers of government slaves and promised rank to all who fought, and the defenders beat off the siege. Yegü fell ill and went north. A Mongol envoy met King Gojong on the mainland opposite Ganghwa, at Seungcheon-bu, and Gojong sent his second son Wang Chang as a hostage, but Choe Hang stayed on the island and the Mongols withdrew early in 1254.
    facts:
      - [Fourth invasion, "1247–1248"]
      - [Fifth invasion, "3 August 1253 – January 1254"]
      - [Siege of Chungju, "about 70 days, 1253"]
    markers:
