steps:
  - title: Saritai’s first invasion
    date: August 1231 – January 1232
    when: "1231-08-26"
    borders: "1231-12-31"
    countries: [kp]
    body:
      - Goryeo had sworn brotherhood with the Mongols in 1219, when they helped it destroy the Khitan invaders, but resented their heavy demands for tribute. In 1225 the Mongol envoy Zhuguyu was killed on his way home after crossing the Yalu; the Mongols blamed Goryeo and broke off relations. On 26 August 1231 an army under Saritai crossed the Yalu, and the frontier fortress of Hamsinjin (Uiju) surrendered. At Inju Hong Bok-won went over to the Mongols with 1,500 households, and his family later guided Mongol armies in Korea. At Cheolju, rather than surrender, the defenders killed their families and themselves. Yongju, Seonju and Gwakju fell in October.
      - The military ruler Choe U raised the Three Armies, which marched north and were defeated at Anju. Bypassing the fortresses that held out, the Mongols reached Kaegyong and surrounded it late in December. The court submitted, and the Three Armies laid down their arms.
    facts:
      - [Mongols cross the Yalu, "26 August 1231"]
      - [Defeat of the Three Armies, "1231, at Anju"]
      - [Goryeo submits, "December 1231 – January 1232"]
