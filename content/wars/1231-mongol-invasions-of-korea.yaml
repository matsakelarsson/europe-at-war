  - title: The end of military rule and the peace of 1259
    date: 1258–1270
    when: "1259-04"
    borders: "1270-06"
    countries: [kp, kr]
    body:
      - In the third month of 1258 Kim Jun and the official Yu Gyeong killed Choe Ui, the last of the Choe dictators, and power returned, for the time being, to the king. The Mongols ravaged the country again, and late in 1258 Jo Hwi and Tak Cheong, local men of the north-east, killed the Goryeo governor and went over to the Mongols, who made the land north of the Cheollyeong pass the Ssangseong commandery. In 1259 the court made peace and sent the crown prince, Wang Jeon, to the Mongols. King Gojong died while he was away. The prince met Kublai, who was then making his bid for the throne and welcomed him warmly; he came home in 1260 as King Wonjong.
      - Under the peace Goryeo kept its own dynasty and customs but became a subordinate ally of the Mongols, and its kings later married into the family of the Yuan emperors. The military men who opposed the peace remained strong for another decade. In 1269 Choe Tan, an officer in Pyongyang, went over to the Mongols with the towns of the north-west, which became the Yuan’s Dongnyeong prefecture in 1270. In the fifth month of 1270 the last military ruler, Im Yu-mu, was killed, and the court moved back to Kaegyong, which set off the Sambyeolcho rebellion.
    facts:
      - [Death of Choe Ui, "third month of 1258"]
      - [Ssangseong commandery, "1258"]
      - [Peace with the Mongols, "1259"]
      - [Court returns to Kaegyong, "fifth month of 1270"]
