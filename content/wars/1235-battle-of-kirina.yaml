notes:
  - "No Arabic writer of the thirteenth century mentions the war. The story comes from the epic of Sunjata, told by Mande griots and recorded in many versions since the late nineteenth century (the best-known is D. T. Niane’s 1960 prose version, from the griot Mamadou Kouyaté), and from a few lines in Ibn Khaldun, written in the 1390s. The date of about 1235 is a modern estimate worked back from the Malian king lists. The site of the battle is not known exactly; the present village of Kirina is a later foundation. Names vary between versions and languages: Sundiata, Sunjata or Sondiata; Sumaoro, Soumaoro or Sumanguru."
