        label: Sunjata returns from Mema
        via: [[-5.100, 15.300], [-6.300, 14.300], [-7.500, 13.100], [-8.280, 12.420]]
  - title: Kirina
    date: about 1235
    when: "1235"
    borders: "1235"
    countries: [ml]
    body:
      - "After two battles that settled nothing, the armies met at Kirina, near the Niger. In the epic, Sumaoro’s strength lay in his magic, and Nana Triban, who had fled from his house, told her brother Sunjata its secret: Sumaoro could be harmed by an arrow tipped with the spur of a white cockerel. Sunjata grazed him with such an arrow, his powers left him and the Sosso army broke. The griots’ accounts give no numbers, and none of the details can be checked against written sources."
      - "Sumaoro fled north with Sunjata and Fakoli in pursuit and, the epic says, vanished in the hills of Koulikoro. The Sosso capital was taken and razed, and Sunjata went on to defeat Sumaoro’s allies, among them the king of Kita, while Tiramakhan was sent west against the Jolof. At an assembly at Kurukan Fuga, near Kangaba, the allied chiefs proclaimed Sunjata mansa and, according to tradition, laid down the rights and duties of the Mande clans. The text known today as the Charter of Kurukan Fuga was put together from oral traditions in the twentieth century. Kaniaga became a province of Mali, and parts of the Sosso population moved west and south-west, where the Susu and Yalunka of Guinea trace their origins to them."
    facts:
      - [Battle of Kirina, "about 1235, Mande victory"]
      - [Assembly of Kurukan Fuga, "soon after, near Kangaba"]
