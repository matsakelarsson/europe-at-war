id: battle-of-kirina
name: Battle of Kirina
start: "1235"
end: "1235"
tier: B
summary: "The war in which Sunjata (Sundiata) Keita and a coalition of Mande chiefdoms overthrew Sumaoro (Sumanguru) Kante, king of Sosso, in about 1235, the founding event of the Mali Empire. Sumaoro had made the Mande chiefdoms of the upper Niger his tributaries. According to the epic of Sunjata, the young prince, who had grown up in exile in Mema, was called home by the Mande chiefs, gathered allies at Sibi and, after two indecisive battles, defeated Sumaoro at Kirina, near the Niger south-west of today’s Bamako. Sumaoro fled north into the hills of Koulikoro and disappeared, and the Sosso capital was razed. The battle is known almost entirely from oral tradition, which mixes history with sorcery and spirit powers; the only early written source, Ibn Khaldun, says just that Mari Jata (Sunjata) overcame the Susu and took their kingdom."
