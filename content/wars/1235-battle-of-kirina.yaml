steps:
  - title: Sumaoro and the Mande chiefdoms
    date: about 1200–1235
    when: "1230"
    borders: "1230"
    countries: [ml]
    body:
      - "In the early thirteenth century the strongest power of the western Sahel was Sosso, a kingdom of Kaniaga ruled by the Kante, a lineage of smiths. Its king Sumaoro Kante had taken over the Soninke lands of old Ghana and pushed south against the Mande (Malinke) chiefdoms of the upper Niger, which the traditions say he “broke” nine times. The Mande king Dankaran Tuman submitted, paid tribute and gave Sumaoro his sister Nana Triban as a wife, then fled south when the burden grew too heavy. The traditions remember Sumaoro as a sorcerer king of great power, harsh to his subjects and hostile to Islam; the Kante smiths’ own traditions remember him more kindly, as a ruler who opposed the trade in slaves."
      - "Sunjata, a son of the former Mande king Naré Maghan Konaté by Sogolon, had left the country as a boy with his mother to escape his half-brother’s hostility. In the epic he grows up as a guest of the king of Mema, on the edge of the inland Niger delta, until Mande envoys find him and beg him to come home. Sumaoro’s own camp was divided: his nephew and general Fakoli Koroma went over to the Mande after the king took his wife. Sunjata’s allies gathered on the plain of Sibi: Kamajan Kamara of Sibi, Tabon Wana of Tabon, Faony Konde, Siara Kuman Konate and the young general Tiramakhan Traore."
    facts:
      - [Sosso hegemony, "about 1200–1235"]
      - [Mande allies, "Sunjata Keita, Fakoli Koroma, Kamajan Kamara, Tiramakhan Traore"]
