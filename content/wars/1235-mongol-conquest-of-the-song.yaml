  - title: Yamen
    date: early 1279
    when: "1279-03-19"
    borders: "1279-03-19"
    countries: [cn]
    body:
      - The last Song stronghold was a floating city. At Yamen, a channel between the hills of Yashan and the islands at the mouth of the delta, Zhang Shijie chained his ships, more than a thousand of them, most of them transports, into a great block with the emperor’s ship in the middle, and coated their hulls with mud against fire. On board were perhaps 200,000 people, many of them officials, servants and their families, with some tens of thousands of soldiers. Wen Tianxiang had been captured at Haifeng on the coast to the east, early in 1279 by most accounts. In Sichuan Diaoyucheng, the fortress that had defied Möngke, surrendered about this time.
      - The Yuan fleet of Zhang Hongfan, a northern Chinese commander, blockaded the anchorage, cutting off its water and firewood, and was joined by Li Heng, who had taken Guangzhou. On 19 March 1279 the Yuan attacked from north and south. At noon, with music played on the Yuan ships as if for a feast, troops hidden on deck boarded the Song line, and the chained ships could neither fight nor flee.
      - When the Yuan reached the centre, Lu Xiufu took the seven-year-old emperor and jumped into the sea, and both drowned. Many officials and women of the court followed them. The Song History says that over 100,000 bodies floated on the sea; the Yuan losses are not known. Zhang Shijie broke out with a few ships and was drowned in a storm days later. Wen Tianxiang, who had watched the battle as a prisoner, refused every offer of office and was executed at Dadu in January 1283. Kublai now ruled all of China; one Sichuan fortress, Lingxiao, is said to have held out until 1288.
    facts:
      - [Battle of Yamen, "19 March 1279, Yuan victory"]
      - [Song fleet, "over 1,000 ships, mostly transports"]
      - [Dead, "over 100,000 according to the Song History"]
      - [Wen Tianxiang executed, "9 January 1283"]
