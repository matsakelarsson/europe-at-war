  - title: The court at sea
    date: 1276–1278
    when: "1276-06-14"
    borders: "1278-05-08"
    countries: [cn, hk]
    body:
      - The two princes who had escaped from Lin’an, Zhao Shi and Zhao Bing, aged about seven and four, were taken to Fuzhou, where Zhao Shi was enthroned as Emperor Duanzong on 14 June 1276. Lu Xiufu, Zhang Shijie and Chen Yizhong led the loyalist government, and Wen Tianxiang, who had escaped from Mongol captivity after being sent to negotiate with Bayan, raised armies in Fujian and Jiangxi. In Yangzhou Li Tingzhi held out until the summer of 1276, then left to join the new court and was captured and executed.
      - Yuan armies entered Fujian at the end of 1276, and the court took to its ships. At Quanzhou the powerful official in charge of maritime trade, Pu Shougeng, refused to give it his ships and went over to the Yuan, killing members of the Song imperial clan in the city. The fleet sailed on along the coast of Guangdong. Wen Tianxiang won victories in Jiangxi in 1277 before his army was destroyed by Yuan forces under Zhang Hongfan, and in Sichuan the mountain fortresses surrendered one by one; Chongqing fell in 1278.
      - The boy emperor nearly drowned when his boat capsized in a storm, and he died of illness on 8 May 1278 on an island the chronicles call Gangzhou, which is variously placed on Lantau Island near today’s Hong Kong or further west. His brother Zhao Bing, now six, was proclaimed emperor, and Zhang Shijie took the court to Yamen, an anchorage in the mouth of the Pearl River delta west of Guangzhou.
    facts:
      - [Zhao Shi enthroned at Fuzhou, "14 June 1276"]
      - [Pu Shougeng goes over at Quanzhou, "1277"]
      - [Death of Emperor Duanzong, "8 May 1278"]
      - [Chongqing falls, "1278"]
