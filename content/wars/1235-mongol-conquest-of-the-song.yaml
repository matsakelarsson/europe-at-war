id: mongol-conquest-of-the-song
name: Mongol conquest of the Song dynasty
start: "1235-02"
end: "1279-03-19"
tier: A
summary: "The 45-year war in which the Mongols, from 1271 the Yuan dynasty of Kublai Khan, conquered the Southern Song, the richest and most populous state of its time. After the Song and the Mongols had destroyed the Jin together in 1234, a Song army tried to occupy the old capitals of Kaifeng and Luoyang and was driven out, and in 1235 Ögedei sent his sons against the Song. For two decades the Song held the line of the Huai, the Han and the Yangtze, and in Sichuan a chain of mountain fortresses wore down every invasion; the Great Khan Möngke died before one of them, Diaoyucheng, in 1259. Kublai then changed his strategy, built a fleet and besieged the twin cities of Xiangyang and Fancheng on the Han River for five years (1268–1273). Their fall opened the Yangtze. Bayan led the Yuan army down the river in 1274–1275, destroyed the Song army at Dingjiazhou and received the surrender of the capital, Lin’an (Hangzhou), in February 1276. Loyalists carried two boy emperors south along the coast, until the last Song fleet was destroyed at Yamen near Guangzhou on 19 March 1279. For the first time all of China was ruled by a dynasty from the steppe."
countries: [cn]
sides:
  - id: mon
    name: Mongol Empire, from 1271 the Yuan
    polities: [mongol-empire, yuan]
    ink: olive
    moves: Mongol and Yuan moves
    success: Mongol and Yuan success
  - id: song
    name: Southern Song
    polities: [song]
    ink: red
    moves: Song moves
    success: Song success
notes:
  - Dates are converted from the Chinese calendar as the sources give them; where the Song and Yuan histories disagree by a few days, the more common date is used. Möngke’s death date comes from Rashid al-Din.
  - The Mongol armies were largely made up of northern Chinese, Khitan and Jurchen troops, and later of surrendered Song soldiers and sailors; many of their commanders, such as Liu Zheng, Shi Tianze, Zhang Hongfan and Lü Wenhuan, were Chinese. Troop numbers in the chronicles are round figures and often inflated, and no count of the war’s dead exists.
  - The dynasty Kublai proclaimed on 18 December 1271 is called the Yuan; before that the side is called the Mongols. Place names are given as they were then, with today’s names in brackets (Lin’an for Hangzhou, Jiankang for Nanjing, Ezhou for Wuchang in today’s Wuhan, Tanzhou for Changsha, Dadu for Beijing).
