  - title: Bayan goes down the Yangtze
    date: autumn 1274 – April 1275
    when: "1275-03-17"
    borders: "1275-04-01"
    countries: [cn]
    body:
      - After Xiangyang fell, Kublai gave the command against the Song to Bayan of the Baarin, a general who had served under Hülegü in Persia. The emperor Duzong died in August 1274 and was succeeded by his four-year-old son, Emperor Gong, with the grand empress dowager Xie as regent and Jia Sidao still in power. In the autumn of 1274 Bayan set out from Xiangyang with Aju, the main army going down the Han River with the new fleet, and Lü Wenhuan leading the way; a second army moved against the Huai cities.
      - In January 1275 the Yuan forced a crossing of the Yangtze at Yangluobao, downstream of Ezhou, and Ezhou and Hanyang surrendered. One Song city after another down the river opened its gates, many to commanders related to or befriended by Lü Wenhuan. Jia Sidao himself led the last great Song army, about 130,000 men, with Xia Gui’s fleet of some 2,500 ships blocking the river.
      - At Dingjiazhou, a sandbank near today’s Tongling, Bayan attacked on 17 March 1275 with cavalry on both banks, ships on the river and catapults on the shore. The Song vanguard under Sun Huchen and Xia Gui’s fleet gave way almost at once, and the army dissolved. Within weeks Jiankang (Nanjing) and the other cities of the lower river surrendered. Jia Sidao was dismissed and sent into exile, and was killed on the way by the officer escorting him later that year.
    facts:
      - [Yangtze crossing at Yangluobao, "January 1275"]
      - [Battle of Dingjiazhou, "17 March 1275, Yuan victory"]
      - [Song army, "about 130,000 men and 2,500 ships"]
    markers:
