  - title: The fall of Lin’an
    date: July 1275 – March 1276
    when: "1276-02-04"
    borders: "1276-02-04"
    countries: [cn]
    body:
      - The Song still had armies and fleets, and loyal officials such as Wen Tianxiang raised new troops. In July 1275 Zhang Shijie gathered a great fleet, said to number thousands of ships chained together, at Jiaoshan on the Yangtze below Zhenjiang. Aju, Zhang Hongfan and Dong Wenbing attacked it from three sides with fire arrows and broke it in half a day, capturing about 700 ships.
      - In the autumn Bayan moved on Lin’an in three columns, one along the coast by sea, one through the hills to the west by the Dusong Pass and his own through the cities of the Grand Canal. Changzhou, which had surrendered and then risen again, was stormed in December 1275 and most of its people were killed, a massacre meant to frighten other cities into surrender. Far to the south-west, Tanzhou (Changsha) fell in January 1276 after a long siege; its commander Li Fu and many of its defenders and their families killed themselves.
      - In January 1276 Bayan’s army camped at Gaoting Mountain outside Lin’an. Zhang Shijie and others wanted to fight on or take the court to sea; the grand empress dowager Xie chose to surrender to spare the city. On 4 February 1276 the surrender and the imperial seal were sent to Bayan. Lin’an was spared, and in March the five-year-old emperor, his grandmother and the court were taken north to Kublai at Shangdu, where the boy was made Duke of Ying. Two of his half-brothers had been smuggled out of the city.
    facts:
      - [Battle of Jiaoshan, "July 1275, Yuan victory"]
      - [Changzhou stormed, "December 1275"]
      - [Tanzhou falls, "January 1276"]
      - [Surrender of Lin’an, "4 February 1276"]
