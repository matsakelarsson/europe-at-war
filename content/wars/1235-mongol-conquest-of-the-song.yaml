  - title: Ögedei’s war
    date: 1235–1241
    when: "1235-02"
    borders: "1236-12-01"
    countries: [cn]
    body:
      - Early in 1235 Ögedei sent armies against the Song on three fronts. His second son Köten (Godan) attacked Sichuan from the north-west, his third son and chosen heir Köchü the middle Han River and Xiangyang, and other commanders the Huai. In the autumn of 1236 Köten’s army broke through the passes into the Sichuan basin, defeated the Song armies and sacked Chengdu. Most of the basin was overrun, and only a few cities held out; Sichuan, one of the most populous regions of China, lost a large part of its people in the following decades of war.
      - On the Han River, Xiangyang fell to the Mongols in 1236, the year Köchü died during the campaign. Mongol raids reached the Yangtze around Huangzhou and the Huai cities, where Du Gao held Anfeng (Shouchun) in 1237 and Luzhou (Hefei) in 1238 against large armies. The Song general Meng Gong, who had fought beside the Mongols at Caizhou, became the main defender of the middle Yangtze; he retook Xiangyang in 1239 and pushed the Mongols back from Hubei.
      - In Sichuan the Mongols took Chengdu again in 1241 and this time kept it, their only lasting gain of these years. Ögedei died in December 1241, and with the empire’s attention on the succession and the campaigns in Europe and the Middle East, the fighting in China died down to raids and sieges along the frontier.
    facts:
      - [Mongol offensive begins, "early 1235"]
      - [Chengdu sacked, "autumn 1236"]
      - [Xiangyang lost and retaken, "1236 and 1239"]
      - [Chengdu taken and held, "1241"]
