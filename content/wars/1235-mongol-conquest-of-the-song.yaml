  - title: The mountain fortresses
    date: 1242–1257
    when: "1243"
    borders: "1254-01-01"
    countries: [cn]
    body:
      - Sichuan’s cities lay open on the plains, and the Song changed its defence. Yu Jie, appointed to command in Sichuan in the early 1240s, moved its headquarters to Chongqing and built a network of fortresses on flat-topped mountains, cliff-edged and often surrounded by rivers on three sides, with fields and water on their summits so that they could feed their garrisons and the refugees of the plains. About 80 such fortresses were built in the following years, linked by the rivers and centred on Chongqing, Jiading and Kuizhou. The most famous, Diaoyucheng, on a hill above the meeting of the Jialing, Fu and Qu rivers near Hechuan, was fortified in 1242–1243.
      - The fortresses could not be starved quickly or taken by cavalry, and through the 1240s and 1250s Mongol columns rode through the Sichuan plains without being able to hold them. After the short reign of Güyük (1246–1248) the Mongols elected Möngke in 1251, and he took up the war against the Song again.
      - Möngke chose to outflank the Song from the west. In 1253 his brother Kublai marched through the Tibetan borderlands and conquered the Dali Kingdom in Yunnan, and the general Uriyangkhadai, son of Subutai, completed the conquest by 1256 and went on to attack Đại Việt in 1257–1258. The Song now faced Mongol armies on its northern, western and south-western borders.
    facts:
      - [Diaoyucheng fortified, "1242–1243"]
      - [Möngke elected Great Khan, "1 July 1251"]
      - [Conquest of the Dali Kingdom, "1253–1256"]
