steps:
  - title: Kaifeng and Luoyang
    date: June – August 1234
    when: "1234-07-05"
    borders: "1234-07-05"
    countries: [cn]
    body:
      - In 1233 the Song had joined the Mongols against the Jin, their old enemy, which had taken northern China from them in 1127. Song troops under Meng Gong helped besiege the last Jin emperor in Caizhou, which fell in February 1234. The Song believed it had been promised Henan, but the Mongols held most of it when the Jin collapsed, and their main armies went back north for the summer.
      - At the court in Lin’an a party around the brothers Zhao Fan and Zhao Kui argued that the moment had come to recover the three old capitals, Kaifeng, Luoyang and Shangqiu, and to hold the line of the Yellow River. In June 1234 Quan Zicai led over 10,000 men from the Huai frontier into Henan. Kaifeng, ruined by war and siege and with only about a thousand households left, was handed to him on 5 July by a former Jin officer who killed its Mongol-appointed commander. Zhao Kui followed with about 50,000 men, and Xu Minzi was sent on with some 13,000 to Luoyang, which he entered in late July and found almost empty.
      - The Mongols answered quickly. They broke the dikes of the Yellow River, flooding the plain and the Song supply routes, and a Mongol force under Liu Heng’an ambushed the Song support column east of Luoyang. Without food, Xu Minzi’s army retreated in early August and was cut to pieces on the way. The Song abandoned Kaifeng. Late in 1234 a Mongol envoy, Wang Ji, came to Lin’an to accuse the Song of breaking the alliance, and Ögedei prepared for war.
    facts:
      - [Fall of Caizhou and end of the Jin, "February 1234"]
      - [Song troops enter Kaifeng, "5 July 1234"]
      - [Retreat from Luoyang, "early August 1234"]
