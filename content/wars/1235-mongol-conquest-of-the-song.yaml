  - title: Ezhou and the truce
    date: autumn 1259 – 1260
    when: "1259-10"
    borders: "1259-11-01"
    countries: [cn]
    body:
      - Kublai, leading the army against the middle Yangtze, learned of his brother’s death on the march but went on. In the autumn of 1259 he crossed the Yangtze and besieged Ezhou (Wuchang, in today’s Wuhan). Uriyangkhadai, coming from Yunnan through Guangxi, besieged Tanzhou (Changsha). The chief councillor Jia Sidao took charge of the defence of Ezhou, and the city held.
      - News came that Ariq Böke was gathering troops and support for his own election as Great Khan. Kublai broke off the siege in December 1259 and hurried north, after Jia Sidao had offered to pay tribute and accept the Yangtze as a border; Uriyangkhadai’s army was brought back across the river in early 1260, with Song troops attacking its rearguard. Jia Sidao reported a great victory and kept the offer quiet. When Kublai’s envoy, Hao Jing, came to Lin’an in 1260 to settle the terms, he was detained, and was held for fifteen years.
      - Kublai was proclaimed Great Khan at Kaiping (later Shangdu) in May 1260, and the Mongols fought each other until Ariq Böke surrendered in 1264. On the Song border there were raids but no great campaign.
    facts:
