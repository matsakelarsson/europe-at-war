  - title: Xiangyang and Fancheng
    date: 1268–1273
    when: "1268-10-16"
    borders: "1273-03-14"
    countries: [cn]
    body:
      - The war turned after 1261, when Liu Zheng, a northern-born Song general at odds with his superiors, went over to the Mongols with Luzhou and the prefectures under it in southern Sichuan. He urged Kublai to stop wasting armies on the Sichuan fortresses and to strike instead at Xiangyang, where the Han River joins the road from the north to the Yangtze, and to build a navy to fight the Song on its rivers. A rising against Kublai in Shandong, Li Tan’s rebellion of 1262, was put down in a few months.
      - In 1268 Aju and Liu Zheng began the siege of Xiangyang and Fancheng, twin cities facing each other across the Han, defended by Lü Wenhuan. They ringed the cities with forts and blocked the river with stakes and stone platforms, and Kublai ordered thousands of ships built. Song relief fleets were beaten back in 1269, 1270 and 1271. In 1272 a flotilla of about 3,000 men under two officers named Zhang broke through with supplies; after that the court, where Jia Sidao kept the gravity of the siege from the emperor, sent no more.
      - The end came with a new weapon. Two engineers sent by the Ilkhan Abaqa from Persia, Ismail and Ala al-Din, built counterweight trebuchets, said to throw stones of up to 300 kg and to reach some 500 metres. Fancheng was stormed early in 1273 and its garrison and people were killed. When the trebuchets turned on Xiangyang, Lü Wenhuan surrendered on 14 March 1273 on the promise that its people would be spared. He was given office under the Yuan, and many of his kin and officers followed him.
    facts:
      - [Liu Zheng defects, "1261"]
      - [Siege of Xiangyang and Fancheng, "1268–1273"]
      - [Fancheng stormed, "early 1273"]
      - [Xiangyang surrenders, "14 March 1273"]
