  - title: Möngke and Diaoyucheng
    date: 1258–1259
    when: "1259-02"
    borders: "1259-08-11"
    countries: [cn]
    body:
      - In 1258 Möngke led the main Mongol army against the Song himself. He left Karakorum in the care of his youngest brother Ariq Böke and in May set up his camps by the Liupan Mountains. His plan was a converging attack. He would take Sichuan; the prince Taghachar, later replaced by Kublai, would strike at the middle Yangtze; and Uriyangkhadai would march north from Yunnan through Guangxi and Hunan to meet them. Möngke crossed the Dasan Pass, went through Hanzhong and into Sichuan, where Langzhong (Paoning) and many of the fortresses surrendered.
      - In February 1259 he reached Diaoyucheng. Its commander, Wang Jian, had perhaps 20,000 to 30,000 men against a Mongol army of over 100,000, and he refused to surrender. For five months the Mongols attacked the gates and the outer works in vain. Their vanguard commander, Wang Dechen, was killed by a stone from the walls, and summer heat and disease spread through the camp.
      - Möngke died near the fortress on 11 August 1259, the date given by Persian sources. Chinese sources say he was mortally wounded by a crossbow bolt or a stone from a catapult, Persian ones that he died of dysentery or cholera. The army in Sichuan withdrew, carrying his body back to Mongolia for burial. Diaoyucheng became famous as the fortress that killed a Great Khan; it held out for twenty more years.
    facts:
      - [Siege of Diaoyucheng, "February – August 1259"]
      - [Garrison, "about 20,000–30,000"]
      - [Mongol army, "over 100,000"]
      - [Death of Möngke, "11 August 1259"]
