id: frederick-ii-and-the-lombard-league
name: Frederick II’s war with the Lombard League
start: "1236-08"
end: "1250-12-13"
tier: B
summary: The war between the emperor Frederick II, also King of Sicily, and the Lombard League led by Milan, allied with Popes Gregory IX and Innocent IV. Frederick crushed the Milanese at Cortenuova in 1237 but could not take Brescia or Milan; excommunicated and declared deposed, he lost his siege camp at Parma in 1248 and his son Enzo at Fossalta in 1249, and the war ended with his death in 1250.
countries: [it, fr]
sides:
  - id: emp
    name: Frederick II and the Ghibellines
    polities: [hre, sicily]
    ink: gold
    moves: Imperial moves
    success: Imperial success
  - id: gue
    name: The Lombard League and the papacy
    polities: [papal-states, genoa, venice]
    ink: red
    moves: Moves by the League and the papacy
    success: Success for the League and the papacy
notes:
  - The party names Guelph and Ghibelline, from the Welf dynasty and the Hohenstaufen castle of Waiblingen, came into use in Italy in these years for the papal and imperial sides. Many cities and lords changed sides; Cremona, Pavia and, under Ezzelino da Romano, Verona and Padua mostly stood by the emperor.
  - Frederick had already been excommunicated in 1227 for delaying his crusade, and papal troops invaded his kingdom while he was in the Holy Land (the War of the Keys, 1228–1230). That conflict ended with the Peace of San Germano in 1230 and is not told here.
