        via: [[12.25, 41.75], [8.93, 44.4], [6.8, 45.2], [4.9, 45.74]]
  - title: Parma, Fossalta and the emperor’s death
    date: 1247–1250
    when: "1247-06"
    borders: "1250-12-13"
    countries: [it]
    body:
      - In June 1247 exiled Guelphs seized Parma, an imperial city on the road between Frederick’s allies in Lombardy and the south. Frederick, on his way to Lyon, turned back to besiege it and built a fortified camp outside the walls, a whole town of wooden houses and churches which he named Vittoria, “victory”. On 18 February 1248, while he was out hawking, the hungry Parmesans and their allies sallied, broke into Vittoria and burned it. Thousands of the emperor’s men were killed or captured, his justiciar Thaddeus of Suessa was killed, and his treasury and crown fell into the townspeople’s hands.
      - The defeat broke the spell of Frederick’s power. His chief minister, Pier della Vigna, was arrested for treason in 1249 and died in prison. On 26 May 1249 the Bolognese beat an imperial army at Fossalta near Modena and captured Enzo, who spent the last 23 years of his life a prisoner in Bologna. Frederick still held much of Italy, and his fortunes were recovering, when he died of dysentery at Castel Fiorentino in Apulia on 13 December 1250. The League broke up, and the papacy carried on the struggle against his sons Conrad IV and Manfred.
    facts:
      - [Fall of Vittoria, "18 February 1248, victory for Parma and the League"]
      - [Battle of Fossalta, "26 May 1249, Enzo captured"]
      - [Death of Frederick II, 13 December 1250]
    markers:
      - kind: taken
        side: gue
        name: Parma
        date: June 1247
        text: Guelph exiles, backed by the pope’s legate, took the city in a surprise attack.
        lonlat: [10.33, 44.8]
      - kind: battle
        side: gue
        name: Vittoria
        date: 18 February 1248
        text: The siege town west of Parma was taken and burned. Among the plunder was the emperor’s crown, which the townspeople kept.
        lonlat: [10.27, 44.79]
        lp: l
      - kind: battle
        side: gue
        name: Battle of Fossalta
        date: 26 May 1249
        text: The Bolognese and their allies beat the Ghibellines of Modena and Cremona under Enzo on the Panaro.
        lonlat: [10.98, 44.63]
      - kind: held
        side: gue
        name: Bologna
        date: 1249–1272
        text: Enzo was kept in a palace that still bears his name. The city refused every offer to ransom him.
        lonlat: [11.34, 44.49]
      - kind: event
        name: Castel Fiorentino
        date: 13 December 1250
        text: Frederick died in a small castle near Lucera, in the Kingdom. He was buried in Palermo cathedral.
        lonlat: [15.25, 41.7]
