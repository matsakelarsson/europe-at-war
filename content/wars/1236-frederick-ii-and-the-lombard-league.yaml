  - title: Excommunication and the war with the popes
    date: 1239–1245
    when: "1239-03-20"
    borders: "1245-07-17"
    countries: [it, fr]
    body:
      - Gregory IX excommunicated Frederick again on 20 March 1239, and Genoa and Venice joined the League. Frederick made his son Enzo, newly married to the heiress of Torres and Gallura in Sardinia, his legate for Italy, and occupied the papal duchy of Spoleto and March of Ancona. He took Ravenna in 1240 and Faenza in April 1241, after an eight-month siege. When Gregory called a council to Rome to depose him, a Sicilian and Pisan fleet intercepted the Genoese galleys carrying the prelates off the island of Giglio on 3 May 1241 and captured two cardinals and about a hundred bishops and abbots.
      - Frederick’s army closed on Rome, but Gregory died on 22 August 1241 and Frederick drew back. The next pope, Innocent IV, elected in 1243, proved a harder opponent still. That year Viterbo, urged on by Cardinal Raniero Capocci, rose against its imperial garrison and beat off Frederick’s siege, and in 1244 Innocent escaped by sea to Genoa and went on to Lyon, beyond Frederick’s reach. On 17 July 1245 the Council of Lyon declared Frederick deposed and released his subjects from their oaths, and the pope had a crusade preached against him.
    facts:
      - [Second excommunication, 20 March 1239]
      - [Battle of Giglio, "3 May 1241, prelates captured"]
      - [Frederick declared deposed, "Council of Lyon, 17 July 1245"]
    markers:
      - kind: taken
        side: emp
        name: Ravenna
        date: August 1240
        text: The Romagna city surrendered to Frederick after a short siege.
        lonlat: [12.2, 44.42]
      - kind: taken
        side: emp
        name: Faenza
        date: 14 April 1241
        text: The city held out through the winter. Frederick, short of money, paid his troops in leather coins that he redeemed later.
        lonlat: [11.88, 44.29]
        lp: l
      - kind: naval
        side: emp
        name: Battle of Giglio
        date: 3 May 1241
        text: Enzo’s Sicilian and Pisan galleys took or sank most of the Genoese fleet. The captured prelates were held in Apulia, and the council never met.
        lonlat: [10.58, 42.34]
      - kind: held
        side: gue
        name: Viterbo
        date: October – November 1243
        text: The rebel city held out against the emperor himself, a blow to his prestige in central Italy.
        lonlat: [12.1, 42.42]
      - kind: event
        side: gue
        name: Lyon
        date: 17 July 1245
        text: At the council, Innocent IV pronounced the sentence of deposition against Frederick, who was defended in vain by his envoy Thaddeus of Suessa.
        lonlat: [4.83, 45.76]
    arrows:
      - side: emp
        label: Frederick II, 1241
        via: [[11.88, 44.29], [12.5, 43.1], [12.62, 42.25]]
      - side: gue
