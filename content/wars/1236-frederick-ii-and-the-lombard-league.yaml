steps:
  - title: Cortenuova and Brescia
    date: 1236–1238
    when: "1236-08"
    borders: "1238-10-09"
    countries: [it]
    body:
      - Frederick II, Barbarossa’s grandson, was emperor, King of Sicily and, by marriage, King of Jerusalem. The Lombard cities, led by Milan, had renewed their League in 1226 to resist his plans to restore imperial power in the north, and Pope Gregory IX, who feared being surrounded by Frederick’s lands, was their natural ally. Having made peace with the pope in 1230 and put down a revolt by his own son Henry in Germany in 1235, Frederick came to Italy in August 1236. With Ezzelino da Romano, the Ghibelline master of Verona, he took and sacked Vicenza on 1 November.
      - In November 1237 Frederick, with German knights, Saracen archers from Lucera and troops from Cremona and other allied cities, caught the Milanese army crossing the Oglio near Cortenuova. The League’s cavalry fled; its infantry made a stand round the carroccio, the city’s standard-cart, until nightfall and then scattered. Thousands were killed or taken, among them the Milanese podestà Pietro Tiepolo, son of the doge of Venice, and Frederick sent the carroccio to Rome as a trophy. But he demanded unconditional surrender, and Milan and its allies fought on. In 1238 he besieged Brescia from July and withdrew in October, having failed to take it.
    facts:
      - [Sack of Vicenza, 1 November 1236]
      - [Battle of Cortenuova, "27 November 1237, imperial victory"]
      - [Siege of Brescia, "July – October 1238, abandoned"]
    markers:
      - kind: taken
        side: emp
        name: Vicenza
        date: 1 November 1236
        text: The city was stormed and sacked by Frederick’s army and handed to Ezzelino, who now ruled much of the March of Treviso.
        lonlat: [11.55, 45.55]
      - kind: battle
        side: emp
        name: Battle of Cortenuova
        date: 27 November 1237
        text: Frederick feigned a withdrawal to winter quarters at Cremona and then fell on the Milanese as they marched home.
        lonlat: [9.78, 45.53]
      - kind: held
        side: gue
        name: Brescia
        date: July – October 1238
        text: The city beat off three months of assaults, and its defence revived the League. Each side was said to have tied prisoners to its walls or siege engines.
        lonlat: [10.22, 45.54]
      - kind: held
        side: emp
        name: Cremona
        date: 1236–1250
        text: The city, Milan’s old rival, was the emperor’s main base in Lombardy throughout the war.
        lonlat: [10.02, 45.13]
        lp: b
    arrows:
