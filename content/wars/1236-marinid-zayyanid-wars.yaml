  - title: Abu Hammu II and Marinid overlordship
    date: 1359–1424
    when: "1359"
    borders: "1389-06-01"
    countries: [dz, ma]
    body:
      - Abu Hammu Musa II (1359–1389) ruled for thirty years in several separate reigns, interrupted by Marinid invasions and family revolts. The Marinids took Tlemcen again in 1360 and in 1370, and each time they could not hold it against the Zayyanids and their Arab allies. In 1366 Abu Hammu attacked the Hafsids at Bougie and was defeated, and the Hafsids then backed his cousin Abu Zayyan, starting a civil war that lasted until 1378, when Abu Hammu captured his rival in Algiers. Ibn Khaldun, who served both courts and their Arab allies, spent these years moving between Fez, Tlemcen, Bougie and the tents of the tribes.
      - In 1387 Abu Hammu’s son Abu Tashufin II overthrew and imprisoned him. Abu Hammu escaped and retook Tlemcen in 1388, but Abu Tashufin came back with a Marinid army, and from 1389 he and his successors ruled as vassals of Fez. By then the Marinids too were in decline, ruled by their viziers, and the war between the two dynasties gave way to a struggle of factions in which each court backed pretenders at the other’s.
    facts:
      - [Marinid occupations of Tlemcen, "1360 and 1370"]
      - [Zayyanid civil war, "1366–1378"]
      - [Zayyanids under Marinid overlordship, "1389 to about 1424"]
