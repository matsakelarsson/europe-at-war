  - title: Hafsid overlords, Spain and the Ottomans
    date: 1424–1554
    when: "1424"
    borders: "1551-03-01"
    countries: [dz, ma, tn, es]
    body:
      - In the 15th century Tlemcen’s overlords came from the east. The Hafsid sultan Abu Faris defeated the Zayyanid sultan in 1424 and installed a vassal in Tlemcen, and he died in 1434 on another expedition against the city; his successor Abu Amr Uthman marched on Tlemcen in 1462 and 1466. The Marinids could no longer intervene. Their last sultan was killed in a revolt in Fez in 1465, and the Wattasids who took power after them in 1471–1472 were fighting the Portuguese on their own coast.
      - In the 16th century the old rivalry was taken over by new powers. Spain took Mers el-Kébir in 1505 and Oran in 1509, and in 1512 the Zayyanid sultan swore allegiance to Spain. The Ottoman corsair Oruç Barbarossa took Tlemcen in 1517–1518, and for thirty years Spain and the Ottoman rulers of Algiers each set up Zayyanid princes of their own on the throne. In June 1550 the Saadians, who had taken Fez from the Wattasids the year before, sent an army under Muhammad al-Harran that took Tlemcen.
      - In February 1551 an Ottoman army from Algiers under Hasan Pasha drove the Saadians out, and the last Zayyanid sultan escaped to Spanish Oran. Tlemcen became an Ottoman protectorate in 1554 and was later ruled directly from Algiers. The Saadians and the Ottomans fought on for the borderland, now as Morocco and the Regency of Algiers. In January 1554 Salah Rais of Algiers took Fez and installed the Wattasid Abu Hassun, and in September the Saadians took it back. The frontier between them settled east of Oujda, near the old line between the Marinid and Zayyanid kingdoms and roughly where the border between Morocco and Algeria runs today.
    facts:
      - [Hafsid overlordship of Tlemcen, "from 1424"]
      - [Oran taken by Spain, "1509"]
