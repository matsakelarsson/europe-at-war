notes:
  - The main source for most of this story is Ibn Khaldun (1332–1406), who served the Marinid, Zayyanid and Hafsid courts in turn and wrote the Muqaddimah in 1377 at Qal’at Ibn Salama, a castle in western Algeria. His dates, converted here to the Julian calendar, sometimes differ from those of other chroniclers by a year.
  - The Zayyanids are also called the Abdalwadids, after their tribe, the Banu Abd al-Wad. Both dynasties came from the Zenata, the Berber nomads of the steppes between Morocco and Ifriqiya, and both relied on Arab tribes for much of their cavalry, which often changed sides.
  - The Marinid campaigns in Ifriqiya in 1347–1357 and the fall of the Marinids in 1465 have their own entries.
