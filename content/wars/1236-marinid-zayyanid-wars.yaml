  - title: Revolt and reconquest
    date: 1348–1359
    when: "1348"
    borders: "1352-07-01"
    countries: [dz, ma]
    body:
      - Abu al-Hasan’s empire did not survive his campaign in Ifriqiya. After his defeat by the Arab tribes near Kairouan in April 1348, his son Abu Inan, governor of Tlemcen, went to Fez and proclaimed himself sultan, and in Tlemcen the Zayyanid princes Abu Said Uthman II and Abu Thabit took back their ancestors’ throne. When Abu al-Hasan came back from Tunis by sea, his fleet was wrecked off Bougie; he gathered his supporters at Algiers and marched on Tlemcen, but the Zayyanid brothers beat him near the Chelif, and he fled to Sijilmasa and then Marrakesh, where his son defeated him in 1350. He died in the High Atlas in May 1351.
      - Abu Inan then took up his father’s plans. In 1352 he defeated the Zayyanids, took Tlemcen and reconquered the central Maghreb; both brothers were killed. He took Bougie in 1353 and Tunis in 1357, but his own troops forced him to leave Ifriqiya, and he was murdered by his vizier in Fez in January 1358. In 1359 a Zayyanid prince, Abu Hammu Musa II, came back from exile and won back Tlemcen.
    facts:
      - [Zayyanid restoration, "1348"]
      - [Tlemcen retaken by Abu Inan, "1352"]
      - [Death of Abu Inan, "January 1358"]
      - [Abu Hammu II takes Tlemcen, "1359"]
