id: marinid-zayyanid-wars
name: Marinid–Zayyanid wars
start: "1236"
end: "1554"
tier: A
summary: "Three centuries of intermittent war between the two Zenata Berber dynasties that rose from the ruins of the Almohad Caliphate: the Marinids of Fez and the Zayyanids (Abdalwadids) of Tlemcen. Yaghmurasen ibn Zayyan, who took Tlemcen in 1236, fought the Marinids over Sijilmasa and eastern Morocco and lost Oujda in 1272. The Marinid sultan Abu Yaqub Yusuf besieged Tlemcen for eight years (1299–1307) from a new city he built beside it, al-Mansura, until he was murdered in his camp. Abu al-Hasan took Tlemcen in May 1337 after a two-year siege and went on to Tunis, and his son Abu Inan took it again in 1352, but each time the Zayyanids returned, under Abu Hammu II from 1359. From about 1389 Tlemcen accepted Marinid and then Hafsid overlordship. In the 16th century the struggle passed to new powers: Spain held Oran from 1509, the Ottoman rulers of Algiers and the Saadian sultans of Morocco fought over Tlemcen, and in 1551–1554 the Ottomans took it and ended the Zayyanid kingdom."
countries: [ma, dz, tn]
