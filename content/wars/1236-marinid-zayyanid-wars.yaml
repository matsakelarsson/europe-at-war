  - title: Abu Tashufin and the fall of Tlemcen
    date: 1308–1337
    when: "1318"
    borders: "1337-05-31"
    countries: [dz, tn, ma]
    body:
      - The Zayyanids recovered quickly. Abu Hammu I (1308–1318) took Algiers in 1313, and his son Abu Tashufin I (1318–1337) turned east against the Hafsids, who were divided between rival branches in Tunis and Bougie. From 1325 his armies besieged Bougie and raided deep into Ifriqiya, and for a time they occupied Tunis, while the Hafsid sultan Abu Bakr II withdrew to Constantine. Abu Bakr appealed to Fez, and the Marinid sultan Abu al-Hasan married his daughter Fatima, sealing an alliance against Tlemcen.
      - Early in 1335 Abu al-Hasan invaded the Zayyanid kingdom from the west, while a Marinid fleet sailed east to help the Hafsids. He besieged Tlemcen for two years, breaking off only to deal with a rebel brother at Sijilmasa. In May 1337 the city was stormed, and Abu Tashufin was killed in the fighting. The Marinids now ruled the whole of the central Maghreb, and Abu al-Hasan, master of the Maghreb from the Atlantic to the borders of Ifriqiya, turned to the war against Castile, which ended in his defeat on the Río Salado in 1340.
    facts:
