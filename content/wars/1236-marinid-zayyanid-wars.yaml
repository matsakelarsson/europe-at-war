  - title: The great siege of Tlemcen
    date: 1295–1307
    when: "1299-05"
    borders: "1303-01-01"
    countries: [ma, dz]
    body:
      - Abu Yusuf’s son Abu Yaqub Yusuf (1286–1307) set out to end the Zayyanid kingdom. He took Taourirt in 1295, Oujda in 1296 and Nedroma in 1298, and in May 1299 his army arrived before Tlemcen. Rather than storm the walls, he settled down to starve the city out. His camp, al-Mahalla al-Mansura, the Camp of Victory, grew into a walled city beside Tlemcen with palaces, baths, markets and a great mosque, begun in 1303, whose ruined minaret still stands.
      - While the main army held the siege, Marinid detachments took the Zayyanid towns of the coast and the plains as far as Algiers. Inside Tlemcen the sultan Uthman I died in 1303, and his son Abu Zayyan I kept up the resistance. In 1306 a Marinid pretender backed by Granada, Uthman ibn Abi al-Ula, landed at Ceuta and won over much of northern Morocco, but Abu Yaqub would not leave Tlemcen.
      - In May 1307 Abu Yaqub was murdered in his camp by a eunuch of his household. His successor Abu Thabit needed the army in Morocco to deal with the pretender, lifted the siege and marched away, and the Zayyanids destroyed much of al-Mansura. After eight years of siege the war had won the Marinids nothing.
    facts:
      - [Siege begins, "May 1299"]
      - [Death of Uthman I, "1303"]
      - [Abu Yaqub murdered, "May 1307"]
