steps:
  - title: Yaghmurasen against the Marinids
    date: 1236–1286
    when: "1236"
    borders: "1272-06-01"
    countries: [ma, dz]
    body:
      - Yaghmurasen ibn Zayyan made himself master of Tlemcen in 1236, while the Marinids were still fighting the Almohads for Morocco. Both dynasties came from Zenata Berber tribes of the steppes and drew on the same Arab and Berber nomads for their armies, and once the Marinids held Fez (1248), the two fought for the borderlands between them, eastern Morocco and the caravan city of Sijilmasa. Yaghmurasen tried to take Sijilmasa in 1257 and won it from the Marinids in 1264.
      - The Marinid sultan Abu Yusuf Yaqub defeated Yaghmurasen on the Moulouya in 1268, just before he took Marrakesh from the last Almohads, and in 1272 he took Oujda and, in 1274, after a siege, Sijilmasa. To keep the stronger Marinids busy, Yaghmurasen allied with their enemies in Spain, the Nasrid emir of Granada and Alfonso X of Castile, while Abu Yusuf crossed the Strait four times from 1275 to fight Castile. Yaghmurasen died at Miliana in 1283 and Abu Yusuf at Algeciras in 1286, with the frontier between their kingdoms roughly where it had been, at the Moulouya and the hills east of Oujda.
    facts:
      - [Yaghmurasen takes Tlemcen, "1236"]
      - [Sijilmasa taken by the Zayyanids, "1264"]
      - [Battle on the Moulouya, "1268, Marinid victory"]
      - [Oujda and Sijilmasa taken by the Marinids, "1272 and 1274"]
