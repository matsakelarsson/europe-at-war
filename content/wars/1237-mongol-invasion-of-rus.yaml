  - title: Kiev, and the Golden Horde
    date: 1240–1243
    when: "1240-11-28"
    borders: "1243"
    countries: [ua, ru]
    body:
      - "Batu’s cousin Möngke had demanded Kiev’s surrender, and his envoys were killed. Its prince, Michael of Chernigov, fled to Hungary, and by 1240 the city was held for Prince Daniel of Galicia by his commander, Dmytro. In late November 1240, once the river had frozen, Batu’s whole army crossed and surrounded Kiev. Catapults battered the walls, and on 6 December the Mongols broke in. The last defenders crowded into the Church of the Tithes, which collapsed under their weight. Most of the people were killed; a papal envoy who passed in 1246 saw countless skulls and bones and only about 200 houses."
      - "The Mongols moved on through Volhynia and Galicia in the winter of 1240–1241, taking Volodymyr and Halych, though Kremenets and a few other strongholds held out. In 1241 they invaded Poland and Hungary. News of the death of the Great Khan Ögedei reached them, and in 1242 Batu led his army back to the lower Volga, leaving Rus’ in ruins. Many towns had been burned, many thousands of people killed or carried off, and stone building stopped for decades."
      - "Batu’s realm, the ulus of Jochi, later known as the Golden Horde, held the steppe from the lower Danube to beyond the Urals, with its capital at Sarai on the Volga. The Rus’ principalities kept their own princes, but each prince had to travel to the khan, and sometimes on to Karakorum in Mongolia, to receive a patent to rule, the yarlik. In 1243 Yaroslav of Vladimir was the first to be confirmed as senior prince of Rus’. Censuses were taken in the 1250s, and tribute was paid to the Horde for more than two centuries."
    facts:
      - [Siege of Kiev, "28 November – 6 December 1240 by one recent reconstruction; older accounts give other dates"]
      - [First yarlik, "1243, to Yaroslav II of Vladimir"]
      - [Golden Horde, "Capital at Sarai on the lower Volga"]
    markers:
      - kind: taken
        side: mn
        name: Kiev
        date: 6 December 1240
        text: The old capital of Rus’ was stormed and sacked. Dmytro, wounded in the fighting, was spared for his courage.
        lonlat: [30.523, 50.45]
      - kind: taken
        side: mn
        name: Volodymyr
        date: Winter 1240–1241
        text: The chief city of Volhynia was stormed, and the chronicle says no one was left alive.
        lonlat: [24.322, 50.848]
      - kind: held
        side: rus
        name: Kremenets
        date: Early 1241
        text: One of the few Rus’ strongholds that the Mongols failed to take and had to bypass.
        lonlat: [25.728, 50.108]
      - kind: taken
        side: mn
        name: Halych
        date: Early 1241
        text: The capital of Galicia was taken while Prince Daniel was in Hungary seeking help.
        lonlat: [24.729, 49.125]
      - kind: event
        side: mn
        name: Sarai
        date: From the 1240s
        text: Batu’s camp and capital on the lower Volga. Rus’ princes came here to submit and receive the yarlik.
        lonlat: [47.452, 47.169]
