  - title: Chernigov and Pereyaslavl
    date: 1239
    when: "1239-03-03"
    borders: "1239-10-18"
    countries: [ua, ru]
    body:
      - "The Mongols spent 1238 and 1239 subduing the steppe. They drove the Cumans west, and their khan Köten fled to Hungary with, it is said, 40,000 families. Other forces conquered the Alans in the north Caucasus and the Crimean steppe, and raiding parties struck the north again in 1239, burning Murom and Gorokhovets and fighting along the Klyazma. By then most of the princes of Rus’ were quarrelling over Kiev and Galicia rather than preparing to defend themselves."
      - "On 3 March 1239 the Mongols stormed Pereyaslavl, south-east of Kiev, burned it and killed Bishop Simeon and many of the townspeople. In the autumn they besieged Chernigov, one of the largest cities of Rus’. A relief army under Prince Mstislav Glebovich was beaten outside the walls, and the city was taken and burned on 18 October 1239. Its bishop was taken prisoner and later let go. The left bank of the Dnieper was now in Mongol hands, and Kiev lay across the river."
    facts:
      - [Pereyaslavl, "Stormed 3 March 1239"]
      - [Chernigov, "Taken 18 October 1239"]
      - [Cumans, "Driven west; Khan Köten fled to Hungary"]
    markers:
      - kind: taken
        side: mn
        name: Pereyaslavl
        date: 3 March 1239
        text: The fortress town guarding Kiev against the steppe was stormed and burned.
        lonlat: [31.445, 50.065]
      - kind: taken
        side: mn
        name: Chernigov
        date: 18 October 1239
        text: The Mongols beat a relief army outside the walls and took the city. The chronicle says their catapults threw stones that four strong men could barely lift.
        lonlat: [31.295, 51.494]
      - kind: taken
        side: mn
        name: Murom
        date: "1239"
        text: Burned by a Mongol raiding force that also took the Mordvin lands and Gorokhovets.
        lonlat: [42.033, 55.567]
    arrows:
      - side: mn
        via: [[34.6, 48.6], [33.0, 49.5], [31.6, 50.0]]
      - side: mn
        via: [[34.0, 50.7], [32.6, 51.2], [31.45, 51.45]]
      - side: mn
