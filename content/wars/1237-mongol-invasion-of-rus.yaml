  - title: Kozelsk, and Novgorod spared
    date: March – May 1238
    when: "1238-03-05"
    borders: "1238-05"
    countries: [ru]
    body:
      - "Another Mongol force besieged Torzhok, Novgorod’s outpost on the road to the grain lands of the south. It held out for two weeks, hoping for help from Novgorod that never came, and fell on 5 March. The Mongols then rode north-west towards Novgorod itself, but about a hundred versts from the city, at a place the chronicles call the Ignach Cross, they turned back. The spring thaw was coming, which would turn the forests and marshes into a morass, and the army had suffered heavy losses. Novgorod, the richest city of the north, was spared."
      - "Heading south, the Mongols passed east of Smolensk, which was also spared, and at the end of March reached Kozelsk, a small town of the Chernigov lands whose prince, Vasily, was a boy of about twelve. Protected by its ramparts and the flooded rivers, the town held out for seven weeks and is said to have killed 4,000 of the besiegers. When it fell in May, the Mongols killed everyone; the chronicle says the young prince drowned in blood, and that the Mongols called Kozelsk the “evil town”. They then withdrew into the steppe to rest."
    facts:
      - [Torzhok, "Taken 5 March 1238 after a two-week siege"]
      - [Ignach Cross, "About 100 versts (100 km) short of Novgorod; the site is unknown"]
      - [Kozelsk, "Besieged for seven weeks, spring 1238"]
    markers:
      - kind: siege
        side: mn
        name: Torzhok
        date: February – 5 March 1238
        text: Novgorod’s southern outpost fell the day after the battle on the Sit, and its people were killed.
        lonlat: [34.967, 57.033]
      - kind: held
        side: rus
        name: Novgorod
        date: Spring 1238
        text: The Mongols turned back about a hundred versts away. Novgorod escaped the invasion, but later had to pay tribute like the rest of Rus’.
        lonlat: [31.267, 58.55]
      - kind: siege
        side: mn
        name: Kozelsk
        date: Late March – May 1238
        text: The small town held out for seven weeks, longer than any other in the campaign, and was destroyed when it fell.
        lonlat: [35.777, 54.035]
    arrows:
