id: mongol-invasion-of-rus
name: Mongol invasion of Rus’
start: "1237"
end: "1240"
tier: A
summary: The conquest of the Rus’ principalities by the Mongol armies of Batu Khan, who sacked Ryazan, Vladimir, Chernigov and Kiev between 1237 and 1240. The principalities kept their own princes but became tributaries of the Golden Horde, whose khans confirmed each prince with a patent, the yarlik, for more than two centuries.
countries: [ru, ua]
sides:
  - id: mn
    name: Mongols
    polities: [mongol-empire, golden-horde]
    ink: olive
    moves: Mongol moves
    success: Mongol success
  - id: rus
    name: Rus’ principalities
    polities: [russia, ryazan, novgorod, chernigov, smolensk, principality-of-kyiv, galicia-volhynia, other-rus-principalities, pskov]
    ink: green
    moves: Rus’ moves
    success: Rus’ success
  - id: st
    name: Volga Bulgars, Cumans and Alans
    polities: [volga-bulgars, cuman-kipchak-confederation, alans]
    ink: purple
    moves: Moves by the Volga and steppe peoples
    success: Success for the Volga and steppe peoples
notes:
  - The dates come from the Rus’ chronicles, which use the Julian calendar and often contradict one another; Persian and Chinese sources, such as Rashid al-Din, add some details from the Mongol side. Numbers in all of them are unreliable.
  - The Rus’ chroniclers called the invaders Tatars. The raid on Poland and Hungary that followed in 1241 is told under the Mongol invasion of Poland.
  - Rus’ was divided into many principalities ruled by branches of the Rurikid dynasty. The strongest were Vladimir-Suzdal in the north-east, Novgorod in the north, and Chernigov, Kiev and Galicia–Volhynia in the south.
