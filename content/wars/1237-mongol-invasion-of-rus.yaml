steps:
  - title: Volga Bulgaria and Ryazan
    date: 1236–1237
    when: "1237-12-16"
    borders: "1237-12-21"
    countries: [ru]
    body:
      - "In 1235 a kurultai, the great council of the Mongols, sent Batu, a grandson of Genghis Khan, with the veteran general Subutai and many princes of Genghis’s line to conquer the lands to the west. Their armies, which included many Turkic troops, gathered on the lower Volga in 1236. That autumn they destroyed Volga Bulgaria and its great trading city of Bilär. In 1237 they fought the Cumans and Alans in the steppe and subdued the Mordvins and Burtas on the forest edge, and by the end of the year they stood on the border of Ryazan, the southernmost Rus’ principality."
      - "According to the Novgorod chronicle, Mongol envoys demanded a tenth of everything: people, horses and goods. The princes of Ryazan refused, and Grand Prince Yuri II of Vladimir sent no help. The Mongols beat Ryazan’s forces on the Voronezh river and on 16 December 1237 surrounded its capital. Catapults broke the wooden walls, and on 21 December the city was stormed. Prince Yuri Igorevich and his family were killed with most of the inhabitants, and archaeologists have found mass graves from the sack. Old Ryazan never fully recovered; its princes later moved to Pereyaslavl-Ryazansky, today’s Ryazan."
    facts:
      - [Volga Bulgaria, "Conquered in 1236–1237"]
      - [Ryazan stormed, "21 December 1237"]
      - [Mongol army, "Batu and Subutai; estimates range from a few tens of thousands to more than 100,000 men"]
    markers:
      - kind: taken
        side: mn
        name: Bilär
        date: Autumn 1236
        text: The largest city of Volga Bulgaria was stormed and burned. The whole country was in Mongol hands by the spring of 1237.
        lonlat: [50.398, 54.985]
      - kind: siege
        side: mn
        name: Ryazan
        date: 16–21 December 1237
        text: The first Rus’ city to be besieged. It fell after five days and was burned; the chronicler wrote that there was “none left to groan and cry”.
        lonlat: [40.428, 54.397]
    arrows:
      - side: st
        via: [[48.6, 52.6], [49.9, 54.0], [50.35, 54.9]]
      - side: mn
        label: Batu
        via: [[44.5, 51.0], [41.6, 51.6], [40.5, 53.2], [40.42, 54.3]]
    areas:
      - style: occupied
        side: mn
        label: Volga Bulgaria, conquered by the Mongols in 1236–1237
        atoms: [RU-TA, RU-ULY, RU-SAM, RU-CU]
  - title: Vladimir and the Sit
    date: January – March 1238
    when: "1238-01"
    borders: "1238-03-04"
    countries: [ru]
    body:
      - "From Ryazan the Mongols moved up the frozen rivers into the grand principality of Vladimir. In January 1238 they beat Yuri II’s army under his son Vsevolod at Kolomna, where Kulkan, a son of Genghis Khan, was killed. Moscow, then a small fortified town, was burned and Yuri’s son Vladimir taken prisoner. Yuri had left his capital to raise troops in the north. On 3 February the Mongols reached Vladimir and on 7 February they stormed it. The grand prince’s wife and family, who had taken refuge in the Dormition Cathedral, died when it was set on fire."
      - "Suzdal fell the same week, and Mongol columns spread out across the north-east. The chronicles list fourteen towns taken that February, from Rostov and Yaroslavl to Tver; some, such as Rostov and Uglich, seem to have submitted and escaped the worst. Yuri gathered his army on the Sit, a river north of the Volga. On 4 March 1238 a Mongol force under Burundai caught it unprepared and destroyed it, and Yuri was killed. His brother Yaroslav, prince of Kiev, came north to take over the ruined principality."
    facts:
      - [Vladimir stormed, "7 February 1238 (8 February in some accounts)"]
      - [Battle of the Sit River, "4 March 1238, Mongol victory"]
      - [Grand Prince, "Yuri II of Vladimir, killed at the Sit"]
    markers:
      - kind: battle
        side: mn
        name: Kolomna
        date: January 1238
        text: The army of Vladimir was beaten on the Oka. Kulkan, killed here, was the only son of Genghis Khan to die in the western campaign.
        lonlat: [38.783, 55.083]
      - kind: taken
        side: mn
        name: Moscow
        date: January 1238
        text: A small town on the Moskva river, burned after a siege of a few days.
        lonlat: [37.618, 55.756]
      - kind: taken
        side: mn
        name: Vladimir
        date: 7 February 1238
        text: The capital of the grand principality fell after a short siege. Bishop Mitrofan and the grand prince’s family died in the burning cathedral.
        lonlat: [40.406, 56.129]
      - kind: taken
        side: mn
        name: Suzdal
        date: February 1238
        text: The old princely city near Vladimir was taken and burned.
        lonlat: [40.45, 56.417]
        lp: t
      - kind: taken
        side: mn
        name: Yaroslavl
        date: February 1238
        text: One of the fourteen towns of the north-east taken that month.
        lonlat: [39.893, 57.626]
      - kind: taken
        side: mn
        name: Tver
        date: February 1238
        text: Taken and burned in the same month.
        lonlat: [35.924, 56.863]
      - kind: battle
        side: mn
        name: Battle of the Sit River
        date: 4 March 1238
        text: Yuri II’s hastily gathered army was surrounded and destroyed. The battle ended organised resistance in the north-east.
        lonlat: [37.852, 58.069]
