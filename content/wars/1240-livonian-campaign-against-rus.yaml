steps:
  - title: Izborsk, Pskov and Koporye
    date: 1240–1241
    when: "1240-09"
    borders: "1240-12"
    countries: [ru, ee]
    body:
      - "In July 1240 Prince Alexander Yaroslavich of Novgorod beat a Swedish landing on the Neva, a victory that later earned him the name Nevsky. Bishop Hermann of Dorpat, knights of the Livonian Order, vassals of the Danish king and Yaroslav Vladimirovich, an exiled claimant to the throne of Pskov, took the border fortress of Izborsk by storm in September. The Pskovians marched out to retake it and were routed; the Rhymed Chronicle says 800 of them fell. The Livonians burned the villages around Pskov for a week, and the boyar Tverdilo Ivankovich and his party opened the gates."
      - "Pskov was left under Yaroslav, with two knights of the Order and a small garrison. That winter Alexander quarrelled with the Novgorodians and left the city. The Order and the Bishop of Ösel–Wiek then occupied Votia, the land of the Votes between Narva and the Neva, built a fort at Koporye and raided as far as Tesovo, close to Novgorod. Alarmed, the Novgorodians asked Alexander’s father, Grand Prince Yaroslav of Vladimir, to send him back. In 1241 Alexander stormed Koporye. He took some of its Germans to Novgorod, let others go and hanged the Votes and Estonians who had served the Order."
    facts:
      - [Izborsk, "Taken by the Livonians in September 1240"]
      - [Pskov, "Surrendered in 1240; retaken in March 1242"]
      - [Koporye, "Built by the Order in 1240–1241; taken by Alexander in 1241"]
