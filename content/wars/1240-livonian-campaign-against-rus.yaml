id: livonian-campaign-against-rus
name: Livonian campaign against Rus’
start: "1240"
end: "1242"
tier: B
summary: A war in which the Livonian Order and the Bishopric of Dorpat, with an exiled prince of Pskov, took Izborsk and Pskov in 1240 and occupied Votia on the Gulf of Finland. Alexander Nevsky of Novgorod won both back and defeated the Order’s army at Lake Peipus, the “Battle on the Ice”, on 5 April 1242.
countries: [ru, ee]
sides:
  - id: to
    name: Livonian Order and the Bishopric of Dorpat
    polities: [teutonic-order]
    ink: slate
    moves: Livonian moves
    success: Livonian success
  - id: rus
    name: Novgorod, Pskov and Vladimir-Suzdal
    polities: [novgorod, pskov, russia]
    ink: green
    moves: Novgorodian and allied moves
    success: Novgorodian success
notes:
  - Dates follow the Novgorod First Chronicle. The other main source, the Livonian Rhymed Chronicle, was written in the 1290s from the Order’s side, and the two disagree on numbers.
  - The Livonian Order was the former Order of the Brothers of the Sword, merged into the Teutonic Order in 1237. Vassals of the Danish king in northern Estonia joined its campaigns, and the exiled Prince Yaroslav Vladimirovich and his supporters fought on its side, so that Rus’ fought on both sides.
  - The Battle of the Neva in July 1240, in which Alexander defeated a Swedish force, is told under the Swedish crusades into Finland.
  - Pskov, Izborsk and Koporye are in Russia today; Dorpat is Tartu, Odenpäh is Otepää and Fellin is Viljandi, all in Estonia.
