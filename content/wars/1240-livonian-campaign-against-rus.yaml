  - title: Pskov retaken, and the Battle on the Ice
    date: March – April 1242
    when: "1242-03"
    borders: "1242-04-05"
    countries: [ru, ee]
    body:
      - "In March 1242 Alexander and his brother Andrei, who had brought troops from Vladimir-Suzdal, drove the small garrison out of Pskov and sent the captured knights to Novgorod. Alexander then carried the war into the land of the Estonians around Dorpat. An advance party under Domash Tverdislavich, the brother of Novgorod’s posadnik, was caught by the Germans and beaten, and Domash was killed. Alexander fell back to the shore of Lake Peipus and drew up his army “at Uzmen, by the Raven’s Rock”, near the narrow strait between the main lake and Lake Pskov."
      - "On 5 April 1242 the Order’s knights and the bishop’s men, with Estonian foot soldiers, charged the Novgorodian line. The Novgorod chronicle says they drove through it like a wedge but were then surrounded, and that 400 Germans were killed and 50 captured, along with countless Estonians; the Rhymed Chronicle admits to 20 brothers dead and six taken. The story of knights drowning when the ice broke is not in any medieval source and seems to come from Eisenstein’s 1938 film. Later in 1242 the Order made peace, gave up its claims to Pskov and Votia and exchanged prisoners."
    facts:
      - [Battle on the Ice, "5 April 1242, Novgorodian victory"]
      - [Commanders, "Alexander and Andrei Yaroslavich against Bishop Hermann of Dorpat and the Livonian Order"]
      - [Losses, "400 Germans according to Novgorod; 20 knights according to the Rhymed Chronicle"]
