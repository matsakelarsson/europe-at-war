steps:
  - title: Sandomierz and Kraków
    date: Winter 1240 – March 1241
    when: "1241-02-13"
    borders: "1241-03-24"
    countries: [pl]
    body:
      - "In the winter of 1240–1241, as the main Mongol armies under Batu and Subutai prepared to invade Hungary, a smaller force under Baidar, Kadan and Orda turned on the Polish duchies to keep their princes from helping the Hungarians. Riding out of Volhynia, which the Mongols had just conquered, it destroyed the stronghold of Sutiejsk and sacked Lublin. In February 1241 it crossed the frozen Vistula, beat a Polish force near Tursko and took Sandomierz, which was sacked after it surrendered on 13 February."
      - "The force then split. Orda’s men ravaged central Poland as far as Łęczyca, while Baidar and Kadan headed for Kraków. On 18 March at Chmielnik they destroyed the knightly levies of Kraków and Sandomierz, whose voivodes were killed; Duke Bolesław V had already withdrawn. Many people fled Kraków for the forests and hills, and the Mongols burned the nearly empty city by 24 March. They crossed the Oder near Racibórz and rode on towards Wrocław, where, according to tradition, the townspeople burned their own town and held out in the castle."
    facts:
      - [Sandomierz, "Sacked after surrendering on 13 February 1241"]
      - [Battle of Chmielnik, "18 March 1241, Mongol victory"]
      - [Kraków, Burned by 24 March 1241]
