id: mongol-invasion-of-poland
name: Mongol invasion of Poland
start: "1240"
end: "1241"
tier: B
summary: A Mongol raid on the divided Polish duchies, sent to protect the flank of the main Mongol invasion of Hungary. In early 1241 the Mongols sacked Sandomierz and Kraków and destroyed a Polish and allied army at Legnica on 9 April, killing Duke Henry II the Pious, before riding south to join the main army.
