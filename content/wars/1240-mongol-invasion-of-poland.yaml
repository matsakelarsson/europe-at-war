  - id: pl
    name: Polish dukes and their allies
    polities: [poland]
    ink: magenta
    moves: Polish and allied moves
    success: Polish or allied success
  - id: mn
    name: Mongols
    polities: [mongol-empire]
    ink: olive
    moves: Mongol moves
    success: Mongol success
notes:
  - Much of the detail comes from Jan Długosz, writing more than two centuries later, and the sources often disagree on dates and numbers. Some give 3 March rather than 13 February for the fight at Tursko.
  - Poland was then divided among several dukes of the Piast dynasty; Henry the Pious of Silesia also ruled Kraków as high duke.
