  - title: Legnica, 9 April 1241
    date: April 1241
    when: "1241-04-09"
    borders: "1241-04-09"
    countries: [pl, cz]
    body:
      - "Duke Henry II the Pious of Silesia, the strongest of the Polish princes, gathered his Silesians, survivors from Kraków and levies from Greater Poland, troops from Opole under Mieszko II the Fat, Moravians, miners from Złotoryja and a few dozen Templars. Estimates of his army range from about 2,000 to 25,000. His brother-in-law, King Wenceslaus I of Bohemia, was marching to join him with a larger army. The Mongols left Wrocław to strike before the two could meet, and on 9 April they caught Henry at Legnickie Pole, south-east of Legnica."
      - "Mongol horsemen drew the Polish cavalry out with feigned retreats, cut it off from the infantry behind a smokescreen and destroyed the army piece by piece. Henry was killed as he tried to escape, and his head was carried on a spear before the walls of Legnica. The Mongols did not stay. After a clash with Bohemian cavalry near Kłodzko they rode south through Moravia to join the main army, which had crushed the Hungarians at Mohi on 11 April. Henry’s death set back the reunification of Poland for decades."
    facts:
      - [Battle of Legnica, "9 April 1241, Mongol victory"]
      - [Polish commander, "Henry II the Pious, Duke of Silesia, killed"]
      - [Mongol commanders, Baidar and Kadan]
