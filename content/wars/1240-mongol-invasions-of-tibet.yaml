id: mongol-invasions-of-tibet
name: Mongol invasions of Tibet
start: "1240"
end: "1247"
tier: C
summary: "The first Mongol campaign into central Tibet and the submission that followed. Tibet then had no central government; power was shared among the great monasteries and the noble families allied with them. In 1240 Köten (Godan), a son of Ögedei who held the former Tangut lands around Liangzhou, sent his general Doorda Darkhan, himself a Tangut, into central Tibet with a force given as 30,000 men, though probably much smaller. It reached the Phanyul valley north of Lhasa, burned the temple of Gyal Lhakhang and killed many monks at Reting; one account gives about 500 dead. The monastery of Drikung was spared. The Mongols withdrew, perhaps after the death of Ögedei in 1241. In 1244 Köten summoned Sakya Pandita, head of the Sakya school, who set out with his nephews Phagpa and Chakna Dorje, reached Liangzhou in 1246 and met Köten early in 1247. He accepted Mongol overlordship and in a letter of 1249 urged the lords of Tibet to submit and pay tribute, with the Sakya as their intermediaries. Further Mongol armies under Möngke in 1251–1255 brought most of Tibet under Mongol control, and from 1264 the Sakya governed it for the Yuan. Historians disagree on the date and purpose of the 1240 campaign, which some see as a reconnaissance or a raid for tribute, and on how far Tibet then became part of the Mongol state. The meaning of the relationship that began in 1247 is also contested: Chinese official histories treat it as the start of Chinese sovereignty over Tibet, while Tibetan and many Western historians describe it as a bond between a religious teacher and a lay patron, or as submission to the Mongol Empire rather than to China."
