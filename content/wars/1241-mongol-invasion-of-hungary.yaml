        side: hu
        name: Székesfehérvár
        date: early 1242
        text: The coronation town, surrounded by marshes swollen by the thaw, resisted the Mongol attack.
        lonlat: [18.409, 47.196]
      - kind: held
        side: hu
        name: Pannonhalma
        date: early 1242
        text: The Benedictine abbey on its hill was one of the places that held out against the Mongols.
        lonlat: [17.761, 47.553]
