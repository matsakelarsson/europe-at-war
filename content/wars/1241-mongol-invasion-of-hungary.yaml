    name: Kingdom of Hungary
    polities: [hungary, croatia]
    ink: red
    moves: Hungarian moves
    success: Hungarian success
  - id: mn
    name: Mongols
    polities: [mongol-empire]
    ink: olive
    moves: Mongol moves
    success: Mongol success
notes:
  - The main sources are the Carmen miserabile of Master Roger, a canon of Várad who was captured by the Mongols and escaped, the history of Thomas, archdeacon of Split, and the Persian historians who wrote for the Mongols, among them Rashid al-Din. Numbers of soldiers and of the dead are very uncertain.
  - The invasion of Poland in the same months, with the battle of Legnica, has its own entry. Hungary was invaded again by the Golden Horde in 1285–1286.
