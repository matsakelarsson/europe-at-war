  - title: The Mongols on the Danube
    date: April 1241 – January 1242
    when: "1241-04-15"
    borders: "1241-12-25"
    countries: [hu, at, sk, ro, rs]
    body:
      - The Mongols sacked Pest within days and spent the rest of 1241 east of the Danube, plundering and killing across the Great Hungarian Plain and organising the conquered land as their own. Béla fled to Austria, where Duke Frederick II, known as the Quarrelsome, took his treasure and forced him to pledge three western counties. Béla appealed to the pope, the emperor Frederick II and the kings of the West, but no help came. The Danube held the Mongols back, and on the far bank the Hungarians guarded the crossings.
      - In the hard winter of 1241–1242 the Danube froze, and around Christmas the Mongols crossed on the ice. They stormed Esztergom, the royal seat, though its citadel held out, and burned Buda. Székesfehérvár, protected by marshes, held out, as did the abbey of Pannonhalma and other stone fortresses. Hungary had few such castles, and the lesson was not lost; after the invasion Béla encouraged nobles and towns to build them. Meanwhile, on 11 December 1241, the Great Khan Ögedei had died in Mongolia.
    facts:
      - [Pest sacked, April 1241]
      - [Danube crossed on the ice, "about Christmas 1241"]
      - [Esztergom, "town stormed, citadel held"]
    markers:
