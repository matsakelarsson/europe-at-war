id: mongol-invasion-of-hungary
name: Mongol invasion of Hungary
start: "1241-03"
end: "1242-04"
tier: B
summary: The invasion of the Kingdom of Hungary by the Mongol armies of Batu and Subutai in 1241–1242. They destroyed King Béla IV’s army at Mohi on the Sajó on 11 April 1241, ravaged the country east of the Danube for most of the year, crossed the frozen river in the winter and pursued Béla to the Dalmatian coast, before withdrawing through Serbia and Bulgaria in the spring of 1242. Perhaps a fifth of Hungary’s people died.
countries: [hu, ro, sk, rs, hr, at, ua, me, bg]
sides:
