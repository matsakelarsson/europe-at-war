  - title: Béla in Dalmatia and the withdrawal
    date: January–April 1242
    when: "1242-01"
    borders: "1242-05-01"
    countries: [hr, me, rs, bg, ba, hu, al]
    body:
      - From Zagreb Béla fled to the Dalmatian coast with his family, and a Mongol force under Kadan pursued him across Croatia. In March 1242 it attacked the fortress of Klis above Split, believing the king was there, and threatened Split and Trogir, while Béla waited on an island off Trogir, ready to flee by sea. Finding him out of reach, the Mongols rode south through the hinterland of the coast, sacking Kotor and other towns, and turned inland.
      - In the spring of 1242 the Mongols left Hungary as suddenly as they had come, the main army withdrawing through Serbia and Bulgaria, which they plundered and forced to pay tribute, to the steppe north of the Black Sea. Why Batu left is still debated. The death of Ögedei, losses and Cuman unrest, and a cold, wet spring that flooded the plains have all been suggested. Hungary was devastated; estimates of the dead range from 15 to 25 per cent of the population. Béla rebuilt the kingdom, building castles and inviting settlers, and is remembered as its second founder.
    facts:
      - [Klis attacked, March 1242]
      - [Mongol withdrawal, spring 1242]
      - [Population loss, "estimated 15–25 per cent"]
    markers:
      - kind: event
        name: Zagreb
        date: winter 1241–1242
        text: Béla stayed here before moving to the coast. In 1242 he made Zagreb’s Gradec a free royal town in thanks for its help.
        lonlat: [15.98, 45.81]
      - kind: held
        side: hu
        name: Klis
        date: March 1242
        text: The Mongols attacked the fortress, where they thought the king was hiding, and fought their way close to the walls before giving up.
        lonlat: [16.524, 43.56]
        lp: t
      - kind: event
        side: hu
        name: Trogir
        date: March 1242
        text: Béla and his family sheltered on an island off the town, with ships ready to take them away if the Mongols tried to cross.
        lonlat: [16.251, 43.517]
        lp: l
      - kind: taken
        side: mn
        name: Kotor
        date: spring 1242
        text: The Mongols burned the town on their way south along the Adriatic before turning inland through Serbia.
        lonlat: [18.77, 42.42]
