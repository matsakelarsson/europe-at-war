        side: mn
        name: Pest
        date: April 1241
        text: The largest town of the kingdom was taken and burned, and many of the people who had fled there were killed.
        lonlat: [19.1, 47.5]
        lp: b
      - kind: taken
        side: mn
        name: Esztergom
        date: January 1242
        text: The Mongols bombarded the town with stone-throwers and killed most of those inside, but the citadel, defended by crossbowmen under Simon, a knight from Spain, held.
        lonlat: [18.74, 47.786]
