steps:
  - title: Mohi
    date: March–April 1241
    when: "1241-03-12"
    borders: "1241-04-11"
    countries: [hu, ro, ua, sk]
    body:
      - In 1239 King Béla IV of Hungary took in Köten and tens of thousands of Cumans fleeing the Mongols, which angered both the Mongols and many Hungarian nobles. Having conquered the Rus’ principalities, the Mongols attacked Hungary in March 1241. Batu and Subutai’s main army broke through the barricades at the Verecke Pass on 12 March, while other columns crossed the Carpathians into Transylvania, destroying Rodna and Várad, and a northern force came down from Poland. At Pest, where Béla was gathering his army, a mob killed Köten, suspected of treachery, and the Cumans left, plundering as they went.
      - Béla marched east after the Mongol vanguard to the river Sajó, where his army camped near the village of Mohi inside a ring of wagons. On the night of 10–11 April the Mongols forced the bridge with the help of stone-throwers, while Subutai crossed further south. At dawn they surrounded the camp, leaving a gap through which the Hungarians fled, and cut them down along the road to Pest. Many thousands were killed, among them the archbishops of Esztergom and Kalocsa. Béla escaped; his brother Coloman died of his wounds.
    facts:
      - [Verecke Pass forced, 12 March 1241]
      - [Battle of Mohi, "11 April 1241, Mongol victory"]
    markers:
      - kind: taken
        side: mn
