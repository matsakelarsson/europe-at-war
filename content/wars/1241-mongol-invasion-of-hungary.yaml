        date: 12 March 1241
        text: The main Mongol army swept aside the troops of the palatine guarding the barricades on the pass and rode for Pest in a few days.
        lonlat: [23.13, 48.8]
      - kind: taken
        side: mn
        name: Rodna
        date: late March 1241
        text: The German mining town in northern Transylvania was the first place taken by the column under Kadan, which forced its people to guide them west.
        lonlat: [24.812, 47.422]
      - kind: taken
        side: mn
        name: Várad
        date: April 1241
        text: The cathedral town was sacked and its people massacred, as the canon Master Roger, who was taken prisoner, described.
        lonlat: [21.921, 47.072]
      - kind: event
        name: Pest
        date: March 1241
        text: Béla gathered his army here. The killing of the Cuman leader Köten by a Hungarian mob lost him his most experienced allies.
        lonlat: [19.1, 47.5]
      - kind: battle
        side: mn
        name: Battle of Mohi
        date: 11 April 1241
        text: Arrows, fire and stone-throwers battered the crowded Hungarian camp. The rout along the road to Pest lasted two days.
        lonlat: [20.913, 47.978]
