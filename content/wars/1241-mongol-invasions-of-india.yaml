  - title: Jaran-Manjur and Sivistan
    date: 1297–1299
    when: "1298-02-06"
    borders: "1298-02-06"
    countries: [pk, in]
    body:
      - Alauddin Khalji, who seized the throne in 1296, faced a stronger enemy. Duwa, khan of the Chagatai Khanate, now ruled the Mongol lands from Transoxiana to the borders of the Punjab, and sent army after army into India. In the winter of 1297 the Chagatai noyan Kadar crossed the Indus and plundered the Punjab as far as Kasur, south of Lahore. Alauddin sent his brother Ulugh Khan, probably with his best general, Zafar Khan, and on 6 February 1298 they defeated the Mongols at Jaran-Manjur, on the Sutlej or near Jalandhar (the sources differ). Amir Khusrau claimed 20,000 Mongols killed; the prisoners were taken to Delhi and trampled to death by elephants.
      - Later that year another Mongol band, under Saldi and his brother, perhaps fugitives from the Negüderi lands in Afghanistan, seized the fort of Sivistan (Sehwan) in Sindh. While Ulugh Khan and Nusrat Khan were away conquering Gujarat, Zafar Khan marched south, stormed the fort without siege engines and brought Saldi and his men to Delhi in chains. The victory made Zafar Khan the most famous general in the sultanate, and, according to Barani, a man the sultan and his brother had begun to fear.
    facts:
      - [Battle of Jaran-Manjur, "6 February 1298, Delhi victory"]
      - [Sivistan retaken, "1298 or 1299"]
    markers:
      - kind: event
        side: mon
        name: Kasur
        date: Winter 1297
        text: The furthest point reached by Kadar’s raiders.
        lonlat: [74.45, 31.12]
      - kind: battle
        side: dl
        name: Jaran-Manjur
        date: 6 February 1298
        text: Ulugh Khan’s victory over Kadar. Amir Khusrau puts the battle on the banks of the Sutlej; it has also been placed at Jalandhar, where it is marked here, and near Lahore.
        lonlat: [75.58, 31.33]
      - kind: taken
        side: dl
        name: Sivistan (Sehwan)
        date: 1298–1299
        text: Seized by Saldi’s Mongols and stormed by Zafar Khan. The prisoners were taken to Delhi, where they were probably put to death.
        lonlat: [67.86, 26.43]
      - kind: capital
        side: dl
        name: Delhi
        date: 1297–1299
        text: Alauddin Khalji’s capital.
        lonlat: [77.18, 28.52]
    arrows:
      - side: mon
        label: Kadar
        via: [[71.5, 32.4], [72.9, 31.8], [74.0, 31.35], [74.42, 31.15]]
      - side: dl
        label: Ulugh Khan
        via: [[77.15, 28.62], [76.5, 29.7], [75.95, 30.7], [75.62, 31.28]]
      - side: dl
