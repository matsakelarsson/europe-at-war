        side: mon
        name: Lahore
        date: December 1241
        text: Stormed after its governor fled. The Mongols massacred and enslaved many of the townspeople and left the walls in ruins; the city was not fully rebuilt until Balban’s reign.
        lonlat: [74.31, 31.59]
      - kind: siege
        side: dl
        name: Uch
        date: "1245"
        text: Besieged by a Mongol army, which withdrew as a relief army from Delhi approached.
        lonlat: [71.08, 29.24]
      - kind: event
        side: mon
        name: Multan
        date: 1250s
        text: Attacked several times by Sali Noyan. In 1257 Sindh and Multan submitted for a time to Hülegü.
        lonlat: [71.47, 30.2]
        lp: l
      - kind: capital
        side: dl
        name: Delhi
        date: 1241–1260
        text: The sultan’s capital. Between 1236 and 1246 four of Iltutmish’s children and grandchildren reigned here, and the Turkish slave officers known as the Forty held the real power.
        lonlat: [77.18, 28.52]
    arrows:
