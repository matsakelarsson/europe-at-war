steps:
  - title: The fall of Lahore
    date: 1241–1260
    when: "1241-12"
    borders: "1241-12-30"
    countries: [pk, in, af]
    body:
      - Twenty years after Genghis Khan chased Jalal al-Din across the Indus, the Mongols held Ghazni and the hills west of the river, and their commanders there raided the Punjab when they pleased. The Delhi Sultanate was in turmoil after the death of Iltutmish in 1236, as three of his children were raised to the throne and removed within six years. In the winter of 1241 a Mongol army under the noyan Dayir crossed the Indus and besieged Lahore, the sultanate’s great city in the Punjab. Its governor, Ikhtiyar al-Din Qaraqash, slipped away, and at the end of December the Mongols stormed the city, killed or enslaved many of its people and pulled down parts of its walls before withdrawing. Dayir himself died in the assault. Delhi could do nothing, and in May 1242 the sultan, Muizz al-Din Bahram Shah, was besieged in his palace and killed by his own nobles.
      - For the next two decades the western Punjab and Sindh were a no man’s land between the two powers. In 1245 a Mongol army besieged Uch and fell back when a Delhi army approached the Beas. In the 1250s the Mongol commander Sali Noyan attacked Multan and Lahore again and again, and in 1257 the governor of Sindh offered his province to Hülegü, whose army under Sali entered Sindh. Balban, the regent for Sultan Nasir al-Din Mahmud, defended the line of the Beas and the Sutlej and kept up an exchange of envoys with Hülegü, who did not send his main armies into the sultanate.
    facts:
      - [Sack of Lahore, "December 1241"]
      - [Siege of Uch, "1245, Mongol withdrawal"]
      - [Sali Noyan enters Sindh, "1257"]
    markers:
