  - title: Balban’s frontier
    date: 1266–1292
    when: "1285-03-09"
    borders: "1285-03-09"
    countries: [pk, in]
    body:
      - Balban, sultan from 1266, made the defence of the north-west the first task of his reign. He rebuilt Lahore, strengthened the forts of Samana, Sunam, Dipalpur and Multan that guarded the routes from the Indus to Delhi, and gave the command of the frontier to his eldest son, Prince Muhammad, at Multan. The Mongols still raided the Punjab almost every year, but they no longer took its cities.
      - In early 1285 a Mongol army under Tamar (Samar) raided towards Lahore and Dipalpur. Prince Muhammad marched out from Multan and drove it back, but on 9 March he was killed in the fighting, near the Beas. The poet Amir Khusrau, who served at his court, was taken prisoner and escaped, and wrote an elegy for him. The loss broke the old sultan, who died in 1287. In 1292, in the reign of the first Khalji sultan, Jalal al-Din, a large Mongol force under Abdullah, whom the chronicler Barani calls a grandson of Hülegü, entered the Punjab. After skirmishes at a place called Bar-ram the Mongols agreed to withdraw, and a prince called Ulghu and some 4,000 of his followers became Muslims and were allowed to settle in the sultanate, where they were known as the “New Muslims”.
    facts:
      - [Death of Prince Muhammad, "9 March 1285, near the Beas"]
      - [Abdullah’s invasion, "1292, Mongol withdrawal"]
      - [New Muslims, "about 4,000 Mongols settled in the sultanate"]
    markers:
      - kind: held
        side: dl
        name: Multan
        date: 1270s–1285
        text: Seat of Prince Muhammad, warden of the frontier, whose court drew poets such as Amir Khusrau and Amir Hasan.
        lonlat: [71.47, 30.2]
        lp: l
      - kind: event
        side: mon
        name: Dipalpur
        date: March 1285
        text: Tamar’s Mongols raided towards Lahore and Dipalpur. Prince Muhammad was killed in the fighting nearby, at a site on the Beas that is not known exactly.
        lonlat: [73.65, 30.67]
      - kind: held
        side: dl
        name: Samana
        date: 1266–1292
        text: One of the fortress towns, with Sunam, that Balban garrisoned to bar the road from the Punjab to Delhi.
        lonlat: [76.19, 30.15]
      - kind: held
        side: dl
        name: Lahore
        date: "1270"
        text: Rebuilt on Balban’s orders, almost thirty years after the Mongol sack.
        lonlat: [74.31, 31.59]
      - kind: capital
        side: dl
        name: Delhi
        date: 1266–1292
        text: Balban’s capital, where Mongol princes and refugees from the Mongol conquests found refuge at his court.
        lonlat: [77.18, 28.52]
    arrows:
      - side: mon
        label: Tamar
