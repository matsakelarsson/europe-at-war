id: mongol-invasions-of-india
name: Mongol invasions of India
start: "1241-12"
end: "1327"
tier: A
summary: "The Mongol attacks on the Delhi Sultanate after Jalal al-Din’s flight across the Indus. In 1241 a Mongol army sacked Lahore, and for two decades the western Punjab and Sindh lay open to raids from Mongol-held Afghanistan. Sultan Balban answered with a chain of frontier forts, and his son Prince Muhammad was killed fighting the Mongols in 1285. The great invasions came from the Chagatai Khanate under its khan Duwa: Alauddin Khalji’s armies beat them at Jaran-Manjur (1298) and Sivistan, held them at Kili outside Delhi (1299), outlasted a two-month siege of Delhi in 1303 and crushed them at Amroha (1305) and on the Ravi (1306), killing or enslaving tens of thousands of prisoners. After Duwa’s death in 1307 the raids dwindled; the last major one, under the Chagatai prince Tarmashirin in 1327, reached the Yamuna."
countries: [pk, in, af]
sides:
  - id: dl
    name: Delhi Sultanate
    polities: [delhi-sultanate]
    ink: green
    moves: Delhi moves
    success: Delhi success
  - id: mon
    name: Mongols (Mongol Empire, Chagatai Khanate)
    polities: [mongol-empire, chagatai-khanate]
    ink: orange
    moves: Mongol moves
    success: Mongol success
notes:
  - The story starts with the sack of Lahore in 1241. Jalal al-Din’s flight to India in 1221 and the Mongol pursuit of him are told in the Campaigns of Jalal al-Din Mangburni, and Timur’s invasion of 1398 in the Campaigns of Timur.
  - "Almost everything known comes from the Persian chroniclers of the sultanate: Juzjani for the 13th century, then Amir Khusrau, Barani, Isami and, much later, Firishta. They wrote to praise the sultans, and their numbers for Mongol armies (up to 200,000) and Mongol dead are not reliable; modern historians, above all Peter Jackson, put the largest armies at a few tens of thousands. Several battle sites, among them Kili, Jaran-Manjur and the Ravi battle of 1306, cannot be located exactly."
  - The raiders came from two Mongol powers. In the 13th century most were sent by the commanders of the Mongol Empire, and later the Ilkhanate, in Afghanistan, including the Qara’unas or Negüderis; from the 1290s the main invasions came from the Chagatai Khanate of Central Asia.
