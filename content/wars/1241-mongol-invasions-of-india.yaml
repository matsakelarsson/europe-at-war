        label: Malik Kafur
        phase: 2
        via: [[77.15, 28.62], [76.3, 29.9], [75.1, 31.0], [74.25, 31.42]]
  - title: The last invasions
    date: 1307–1327
    when: "1327"
    borders: "1327"
    countries: [pk, in, af]
    body:
      - After Duwa’s death the Chagatai Khanate fell into civil war, and the frontier grew quieter. Ghazi Malik, warden of the marches at Dipalpur, now raided Mongol-held country beyond the Indus almost every year, and an inscription at Multan credits him with 29 victories over the Mongols. In 1320 he took the throne of Delhi as Ghiyath al-Din Tughluq. Smaller raids went on. That same year a Qara’unas army under Zulju (Dulucha) came down the Jhelum valley into Kashmir, which was not part of the sultanate, killed and enslaved many of its people and lost many of its own men in the snow as it left.
      - The last great raid came in 1327, when the Chagatai prince Tarmashirin, soon to be khan, sacked Lamghan and Multan and pushed on as far as Meerut and the Yamuna. The sources disagree on what followed. In the first version of his chronicle Barani says that Sultan Muhammad bin Tughluq gathered his army, drove the invaders back and pursued them to Kalanaur; later writers say the sultan paid them to leave. It was the last Mongol invasion to reach the heart of the sultanate. Tarmashirin, a convert to Islam, was overthrown in his own lands a few years later, and the Chagatai Khanate split apart.
    facts:
      - [Ghazi Malik’s raids, "about 1307–1320, 29 victories claimed"]
      - [Zulju in Kashmir, "1320"]
      - [Tarmashirin’s raid, "1327"]
    markers:
      - kind: held
        side: dl
        name: Dipalpur
        date: 1307–1320
        text: Base of Ghazi Malik, the warden of the marches, who raided the Mongol lands beyond the Indus almost every year.
        lonlat: [73.65, 30.67]
      - kind: taken
        side: mon
        name: Multan
        date: "1327"
        text: Sacked by Tarmashirin on his way into India.
        lonlat: [71.47, 30.2]
        lp: l
      - kind: event
        side: mon
        name: Meerut
        date: "1327"
        text: According to Barani, Tarmashirin’s army reached Meerut and the Yamuna before it turned back.
        lonlat: [77.71, 28.98]
      - kind: event
        side: dl
        name: Kalanaur
        date: "1327"
        text: In Barani’s account, Muhammad bin Tughluq pursued the retreating Mongols as far as this town in the northern Punjab.
        lonlat: [75.15, 32.02]
      - kind: taken
        side: mon
        name: Srinagar
        date: "1320"
        text: Zulju’s army sacked the Kashmir valley; its king, Suhadeva, fled to Kishtwar.
        lonlat: [74.8, 34.08]
      - kind: event
        side: mon
        name: Lamghan
        date: "1327"
        text: Sacked by Tarmashirin before he crossed into India.
        lonlat: [70.2, 34.65]
    arrows:
      - side: mon
        label: Tarmashirin
        phase: 1
        via: [[70.2, 34.6], [71.0, 32.2], [71.45, 30.3], [74.6, 30.3], [77.6, 28.98]]
      - side: dl
        label: Muhammad bin Tughluq
        phase: 2
        via: [[77.2, 28.62], [76.2, 30.2], [75.6, 31.2], [75.18, 31.95]]
      - side: mon
        label: Zulju
        phase: 1
        via: [[73.4, 34.15], [74.1, 34.18], [74.75, 34.08]]
