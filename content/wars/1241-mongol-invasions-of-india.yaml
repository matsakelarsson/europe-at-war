  - title: The battle of Kili
    date: Late 1299
    when: "1299-12"
    borders: "1299-12"
    countries: [in, pk]
    body:
      - In late 1299 Duwa sent his son Qutlugh Khwaja with a far larger army, which Barani numbers at up to 200,000 horsemen and modern historians at perhaps 100,000. This time the Mongols did not stop to besiege the frontier forts but rode straight for Delhi. Refugees from the countryside crowded into the city and food ran short. Against the advice of his counsellors, who urged him to negotiate, Alauddin led his army out and drew it up at Kili, a few miles from the city, with the Yamuna on one side.
      - Zafar Khan, on the right, attacked the Mongol division of Hijlak without waiting for orders. The Mongols feigned flight and drew him some 55 km away, and then the general Targhi cut off his retreat. Ulugh Khan did not come to his aid, and Zafar Khan died fighting with about a thousand horsemen. Elsewhere the Delhi lines held. After two days of waiting the Mongols withdrew on the third night; Qutlugh Khwaja had been badly wounded and died on the way home. Alauddin, who resented Zafar Khan’s disobedience, had his name left out of the court chronicles.
    facts:
      - [Battle of Kili, "late 1299, Mongol withdrawal"]
      - [Mongol army, "perhaps 100,000; Barani says 200,000"]
      - [Killed, "Zafar Khan (Delhi); Qutlugh Khwaja died of his wounds"]
    markers:
      - kind: battle
        side: dl
        name: Kili
        date: Late 1299
        text: Alauddin’s camp, on ground bounded by the Yamuna and scrub, about 10 km from the suburbs of Delhi. Its exact site is not known.
        lonlat: [77.2, 28.76]
      - kind: event
        side: mon
        name: Zafar Khan’s last fight
        date: Late 1299
        text: Lured away from the main army by a feigned retreat, Zafar Khan and his men were surrounded and killed. The place is not recorded; the sources say it was some 55 km from Kili.
        lonlat: [77.03, 29.24]
      - kind: capital
        side: dl
        name: Delhi
        date: "1299"
        text: Crowded with refugees during the invasion, and short of food.
        lonlat: [77.18, 28.52]
        lp: b
    arrows:
      - side: mon
        label: Qutlugh Khwaja
        via: [[71.6, 32.9], [73.9, 31.4], [75.9, 30.2], [77.0, 29.3], [77.18, 28.82]]
      - side: dl
        label: Alauddin
        via: [[77.18, 28.53], [77.2, 28.62], [77.2, 28.72]]
  - title: The siege of Delhi
    date: 1303
    when: "1303-09"
    borders: "1303-09"
    countries: [in]
    body:
      - In 1303 Alauddin was away besieging Chittor, and another of his armies was coming back, much weakened, from a failed campaign against Warangal in the Deccan. The Mongols heard that Delhi was almost undefended. Taraghai, one of the commanders of 1299, rode in with 20,000 to 40,000 horsemen (the manuscripts of Barani differ) and seized the fords of the Yamuna, so that the governors of the eastern provinces could not bring their troops to the capital. Alauddin hurried back from Chittor, but with a tired army he would not risk a battle.
      - Instead he entrenched himself on the plain of Siri, protected on three sides by the Yamuna, thick jungle and the old city, behind a ditch and a rampart made of planks taken from the doors of Delhi’s houses. For about two months the Mongols plundered the city and its suburbs, even the royal stores, but could not break into his camp, and then Taraghai withdrew with his booty. Alauddin made Siri his capital, repaired the walls of old Delhi, rebuilt the frontier forts and stationed large armies at Dipalpur and Samana. His famous controls on prices and grain were meant to pay for this army.
    facts:
      - [Siege of Delhi, "about two months in 1303"]
      - [Mongol army, "20,000–40,000 horsemen under Taraghai"]
      - [Result, "Mongol withdrawal; Siri becomes the capital"]
    markers:
      - kind: held
        side: dl
        name: Siri
        date: "1303"
        text: Alauddin’s entrenched camp, which the Mongols could not storm. He later walled it and made it his capital.
        lonlat: [77.22, 28.55]
        lp: r
      - kind: event
        side: mon
        name: Old Delhi
        date: "1303"
        text: The old city of Qila Rai Pithora and its suburbs, plundered by the Mongols for about two months.
        lonlat: [77.18, 28.52]
        lp: l
      - kind: siege
        side: dl
        name: Chittor
        date: January – August 1303
        text: Alauddin was besieging Chittor when the Mongols invaded, and came back to Delhi soon after it fell.
        lonlat: [74.65, 24.89]
    arrows:
      - side: mon
        label: Taraghai
        via: [[72.0, 32.6], [74.3, 31.2], [76.3, 29.9], [77.1, 28.9], [77.25, 28.68]]
      - side: dl
        label: Alauddin
        via: [[74.7, 24.95], [75.8, 26.3], [76.7, 27.6], [77.2, 28.5]]
  - title: Amroha and the Ravi
    date: 1305–1306
    when: "1305-12-20"
    borders: "1305-12-20"
    countries: [in, pk]
    body:
      - In 1305 Duwa sent another army. Its commander Taraghai turned back after crossing the Jhelum, but Ali Beg and Tartaq, with 30,000 to 50,000 horsemen, went on. They avoided the strong frontier garrisons, plundered the foothills of the Shivaliks and rode south-east along the Himalayas into the plains of the Ganges. On 20 December 1305 a Delhi army of 30,000 horsemen under Malik Nayak met them at Amroha and routed them. Ali Beg and Tartaq surrendered and were spared for a time; Barani says that the other prisoners were trampled by elephants in Delhi and that 20,000 horses were taken from the dead.
      - Duwa answered in 1306 with an army under Kopek, Iqbalmand and Tai-Bu. Kopek plundered his way to the Ravi while the others turned south towards Nagaur. Malik Kafur, with Ghazi Malik (the later sultan Ghiyath al-Din Tughluq) leading his vanguard, caught Kopek near the Ravi, broke his army and took him prisoner, and drove the other columns back across the Indus. The chroniclers speak of tens of thousands of Mongol dead. The men among the captives were killed and the women and children sold as slaves, and a tower of Mongol skulls stood at the Badaun Gate of Delhi in Barani’s day. Duwa died in 1307, and the great invasions ended with him.
    facts:
      - [Battle of Amroha, "20 December 1305, Delhi victory"]
      - [Battle on the Ravi, "1306, Delhi victory"]
      - [Death of Duwa, "1307"]
    markers:
      - kind: battle
        side: dl
        name: Amroha
        date: 20 December 1305
        text: Malik Nayak’s cavalry destroyed the army of Ali Beg and Tartaq, which had ridden round the frontier defences.
        lonlat: [78.47, 28.9]
      - kind: battle
        side: dl
        name: Ravi
        date: "1306"
        text: Malik Kafur’s victory over Kopek. The chroniclers name different places for the battle, which cannot be identified with certainty; it is marked here on the Ravi near Lahore.
        lonlat: [74.15, 31.45]
      - kind: event
        side: mon
        name: Nagaur
        date: "1306"
        text: The goal of Iqbalmand’s and Tai-Bu’s columns, which fled back across the Indus after Kopek’s defeat.
        lonlat: [73.73, 27.2]
      - kind: capital
        side: dl
        name: Siri (Delhi)
        date: 1305–1306
        text: Mongol prisoners were brought here to be killed or sold, and a tower of skulls was raised at the Badaun Gate.
        lonlat: [77.22, 28.55]
        lp: b
    arrows:
      - side: mon
        label: Ali Beg and Tartaq
        phase: 1
        via: [[73.7, 32.95], [75.4, 31.9], [77.1, 30.5], [78.1, 29.6], [78.45, 28.98]]
      - side: dl
