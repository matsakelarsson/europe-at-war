id: saintonge-war
name: Saintonge War
start: "1242"
end: "1243"
tier: C
summary: A revolt of the lords of Poitou, led by Hugh X of Lusignan, count of La Marche, against Louis IX’s brother Alphonse, newly installed as count of Poitou, which Henry III of England joined in the hope of winning back his family’s lost lands. Louis took the Lusignan castles and beat the English and the rebels at the bridge of Taillebourg on the Charente on 21–22 July 1242 and at Saintes the next day. Henry withdrew to Bordeaux, Hugh submitted on 24 July, and a rising by Raymond VII of Toulouse collapsed by the end of the year. A truce followed in 1243, and the Treaty of Paris of 1259 settled the English king’s claims.
