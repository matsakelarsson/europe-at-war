steps:
  - title: Damietta
    date: 1244–1249
    when: "1248-08-25"
    borders: "1249-06-06"
    countries: [fr, cy, eg, il]
    body:
      - In the summer of 1244 Khwarazmian horsemen, nomads in the service of al-Salih Ayyub, the Ayyubid sultan of Egypt, sacked Jerusalem, which the Franks had regained by treaty in 1229, and in October the army of the Latin East and its Syrian allies was destroyed by the Egyptians and Khwarazmians at La Forbie near Gaza. Louis IX of France, who had vowed to go on crusade during a serious illness that year, spent three years preparing. He sailed from his new port of Aigues-Mortes on 25 August 1248 with perhaps 15,000–25,000 men, spent the winter in Cyprus and in May 1249 sailed for Egypt.
      - On 5 June 1249 the crusaders landed on the beach before Damietta in the face of the Egyptian army, Louis wading ashore with his knights. The Egyptian commander, Fakhr al-Din, withdrew that night, the garrison and people of Damietta fled after him, and on 6 June the crusaders occupied the city without a fight. Louis then waited for the Nile flood to pass and for his brother Alphonse of Poitiers to bring reinforcements, and only in November did he march south towards Cairo.
    facts:
      - [Battle of La Forbie, "17 October 1244, Egyptian and Khwarazmian victory"]
      - [Louis sails from Aigues-Mortes, 25 August 1248]
      - [Damietta occupied, 6 June 1249]
    markers:
      - kind: event
        side: fr
        name: Aigues-Mortes
        date: 25 August 1248
        text: Louis had built this walled port in the marshes of the Camargue so that he could sail from his own lands rather than from Marseille, then part of the Empire.
        lonlat: [4.193, 43.568]
      - kind: event
        side: fr
        name: Limassol
        date: September 1248 – May 1249
        text: The army wintered on Cyprus, where Louis gathered supplies and lost many men to disease.
        lonlat: [33.044, 34.675]
      - kind: battle
        side: eg
        name: Battle of La Forbie
        date: 17 October 1244
        text: The Franks and their allies from Damascus and Homs were destroyed by the Egyptian army and the Khwarazmians. It was the worst defeat of the Latin East since Hattin.
        lonlat: [34.546, 31.606]
      - kind: taken
        side: fr
        name: Damietta
        date: 6 June 1249
        text: The city that the Fifth Crusade had besieged for a year and a half was abandoned by its garrison and fell in a day.
        lonlat: [31.81, 31.415]
    arrows:
      - side: fr
        label: Louis IX
        via: [[4.2, 43.5], [9.8, 38.7], [24.0, 35.4], [32.95, 34.62]]
      - side: fr
        via: [[33.0, 34.55], [32.6, 32.6], [31.85, 31.48]]
  - title: Mansurah and Fariskur
    date: November 1249 – May 1250
    when: "1249-11-20"
    borders: "1250-05-06"
    countries: [eg, fr]
    body:
      - As the crusaders marched south, al-Salih Ayyub died on 22 November 1249; his widow Shajar al-Durr hid his death, and the army fought on. The crusaders were held up for weeks at the Bahr al-Saghir canal opposite al-Mansurah until a local man showed them a ford. On 8 February 1250 the vanguard crossed and surprised the Egyptian camp, killing Fakhr al-Din, but Louis’s brother Robert of Artois, instead of waiting, charged into al-Mansurah with the Templars. In its narrow streets the Mamluk regiments, among them the future sultan Baibars, killed almost all of them. Louis held the bridgehead against fierce counter-attacks, but could go no further.
      - Disease and hunger spread while Egyptian ships cut the crusaders off from Damietta, and the new sultan, Turanshah, arrived from Syria. In April Louis ordered a retreat. On 6 April 1250 at Fariskur the exhausted army was overwhelmed, and Louis, sick with dysentery, was captured with most of his men; many of the sick and wounded prisoners were killed. On 2 May the Mamluk officers murdered Turanshah. They released Louis for a huge ransom, half paid at once, and the return of Damietta, and he went to Acre, where he stayed until 1254 strengthening the coastal towns.
    facts:
      - [Battle of al-Mansurah, "8–11 February 1250, Egyptian victory"]
      - [Battle of Fariskur, "6 April 1250, Louis IX captured"]
      - [Murder of Turanshah, 2 May 1250]
    markers:
      - kind: battle
        side: eg
        name: Battle of al-Mansurah
        date: 8–11 February 1250
        text: Robert of Artois and almost all the Templars who followed him were killed in the town. The crusaders then beat off attacks on their camp for three days.
        lonlat: [31.383, 31.05]
      - kind: battle
        side: eg
        name: Battle of Fariskur
        date: 6 April 1250
        text: The retreating army was surrounded and destroyed. Louis was taken prisoner in a nearby village and held at al-Mansurah.
        lonlat: [31.715, 31.33]
        lp: l
      - kind: event
        side: eg
        name: Damietta
        date: 6 May 1250
        text: The city was handed back to the Egyptians in exchange for the king’s release; Queen Margaret, who had given birth there, had kept the garrison from abandoning it.
        lonlat: [31.81, 31.415]
    arrows:
      - side: fr
        label: Louis IX
        via: [[31.8, 31.4], [31.7, 31.33], [31.52, 31.16], [31.42, 31.07]]
      - side: fr
        label: Retreat, April 1250
        via: [[31.42, 31.09], [31.56, 31.2], [31.69, 31.31]]
