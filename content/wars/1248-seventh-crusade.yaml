id: seventh-crusade
name: Seventh Crusade
start: "1248-08-25"
end: "1250-05-06"
tier: B
summary: The crusade of King Louis IX of France against Ayyubid Egypt, launched after the sack of Jerusalem and the defeat of the Latin East at La Forbie in 1244. Louis took Damietta without a fight in June 1249, but his advance on Cairo was stopped at al-Mansurah in February 1250, and on the retreat his army was destroyed at Fariskur and he was captured. The Mamluk officers who murdered the last Ayyubid sultan of Egypt released him for a ransom and the return of Damietta.
countries: [eg, fr, cy, il]
sides:
  - id: fr
    name: Louis IX and the crusaders
    polities: [france, kingdom-of-jerusalem, cyprus]
    ink: navy
    moves: Crusader moves
    success: Crusader success
  - id: eg
    name: Ayyubid Egypt and the Mamluks
    polities: [ayyubid, mamluk]
    ink: purple
    moves: Egyptian moves
    success: Egyptian success
notes:
  - Dates are Julian. The crusade is known in unusual detail from the memoirs of Jean de Joinville, a Champagne nobleman who served Louis and wrote his account decades later, and from Arabic historians.
  - The Mamluks were slave soldiers, mostly of Kipchak Turkish origin, bought and trained by the Ayyubid sultan al-Salih Ayyub. After murdering his son Turanshah in May 1250 their commanders ruled Egypt as sultans; the Mamluk Sultanate lasted until 1517.
