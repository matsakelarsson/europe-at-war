  - title: Montecatini and Altopascio
    date: 1310–1328
    when: "1310"
    borders: "1325-09-23"
    countries: [it]
    body:
      - The Ghibellines’ hopes revived when the King of the Romans, Henry VII, came to Italy in 1310 to be crowned emperor. Florence led the resistance. Henry besieged it in vain in the autumn of 1312 and died near Siena in August 1313, as he was preparing to attack Robert of Anjou, King of Naples. His captain Uguccione della Faggiuola became lord of Pisa and, in 1314, of Lucca. On 29 August 1315, at Montecatini, he routed the army of Florence and its Guelph allies, commanded by Robert’s brother Philip of Taranto; Philip’s brother Peter and his son Charles were among the dead.
      - In 1316 Pisa and Lucca threw out Uguccione, and Lucca came under one of his captains, Castruccio Castracani, a gifted soldier who built up a strong state in western Tuscany. On 23 September 1325 at Altopascio he beat a large Florentine army under the Catalan Ramon de Cardona, who was taken prisoner, and raided up to Florence’s walls, holding races outside its gates in mockery. Florence put itself under Robert’s son Charles of Calabria. The emperor Louis IV made Castruccio Duke of Lucca in 1327, but Castruccio died of fever on 3 September 1328, and his state fell apart.
    facts:
      - [Battle of Montecatini, "29 August 1315, Ghibelline victory"]
      - [Battle of Altopascio, "23 September 1325, Ghibelline victory"]
      - [Death of Castruccio, 3 September 1328]
    markers:
      - kind: held
        side: gue
        name: Florence
        date: September – October 1312
        text: Henry VII camped outside the city for six weeks but was too weak to take it or to cut it off.
        lonlat: [11.26, 43.77]
      - kind: event
        name: Buonconvento
        date: 24 August 1313
        text: The emperor died of fever here, and his army broke up. Dante, who had hoped he would bring peace to Italy, was bitterly disappointed.
        lonlat: [11.48, 43.13]
      - kind: battle
        side: gib
        name: Battle of Montecatini
        date: 29 August 1315
        text: Uguccione’s Pisans, Lucchese and German horsemen broke the much larger Guelph army in the Val di Nievole.
        lonlat: [10.77, 43.88]
      - kind: battle
        side: gib
        name: Battle of Altopascio
        date: 23 September 1325
        text: Castruccio caught the Florentines as they withdrew from the siege of Altopascio, a castle on the road to Lucca.
        lonlat: [10.68, 43.82]
        lp: l
      - kind: event
        side: gib
        name: Lucca
        date: 1316–1328
        text: Castruccio ruled from here and took Pistoia in 1325 and again in 1328, shortly before his death.
        lonlat: [10.5, 43.84]
        lp: l
