steps:
  - title: Montaperti
    date: 1250–1266
    when: "1250"
    borders: "1260-09-04"
    countries: [it]
    body:
      - After Frederick II’s death the struggle between Guelphs and Ghibellines went on in every city of Tuscany, where it merged with family feuds and rivalries between neighbouring towns. In Florence a new popular government took power in 1250, and in 1258 the Guelphs drove out the leading Ghibelline families, headed by the Uberti, who went to Siena. Siena, Florence’s old rival, was Ghibelline and looked for help to Frederick’s son Manfred, who had made himself King of Sicily in 1258 and sent it German cavalry.
      - In 1260 Florence and its Guelph allies, Lucca among them, marched on Siena with a large army. On 4 September, at Montaperti on the Arbia, the Sienese, the Florentine exiles under Farinata degli Uberti and Manfred’s Germans routed them. By tradition the battle turned when Bocca degli Abati, a Ghibelline in the Florentine ranks, cut off the hand of the standard-bearer. Thousands were killed or captured and the Florentine carroccio was taken. The Guelphs fled Florence, and at a meeting of the Ghibelline cities at Empoli, Farinata alone spoke against razing it. After Manfred fell at Benevento in 1266, the Guelphs returned to Florence for good.
    facts:
      - [Ghibellines expelled from Florence, "1258"]
      - [Battle of Montaperti, "4 September 1260, Ghibelline victory"]
      - [Guelphs return to Florence, 1266–1267]
    markers:
      - kind: battle
        side: gib
        name: Battle of Montaperti
        date: 4 September 1260
        text: The Florentine carroccio was taken to Siena as a trophy. Dante put Bocca degli Abati in the lowest circle of Hell among the traitors.
        lonlat: [11.44, 43.32]
      - kind: taken
        side: gib
        name: Florence
        date: September 1260
        text: The Guelph families fled without a fight, and the Ghibelline exiles came home with Manfred’s vicar, Guido Novello.
        lonlat: [11.26, 43.77]
      - kind: event
        side: gib
        name: Empoli
        date: September 1260
        text: Siena and Pisa wanted Florence destroyed. Farinata’s refusal saved it, as Dante has him recall in the Inferno.
        lonlat: [10.95, 43.72]
        lp: l
    arrows:
      - side: gue
        label: Florentine army
        via: [[11.26, 43.75], [11.27, 43.55], [11.42, 43.35]]
  - title: Campaldino
    date: 1267–1289
    when: "1267"
    borders: "1289-06-11"
    countries: [it]
    body:
      - With Charles of Anjou, the papacy’s champion and now King of Sicily, as their protector, the Guelphs took over most of Tuscany. In June 1269 the Florentines and French knights beat the Sienese at Colle di Val d’Elsa, where Siena’s Ghibelline leader Provenzan Salvani was killed, and Siena itself soon came under Guelph rule. Pisa and Arezzo remained the Ghibellines’ strongholds. Pisa was crippled by its defeat by Genoa at Meloria in 1284, and the Guelph cities joined in the war against it. In Arezzo the Ghibelline nobles, led by the warlike bishop Guglielmino degli Ubertini, drove out the Guelphs in 1287.
      - In June 1289 Florence and its Guelph allies, under the Angevin captain Amerigo of Narbonne, marched over the hills into the Casentino against Arezzo. On 11 June they met the Aretines on the plain of Campaldino below Poppi. The Ghibelline cavalry charged and drove back the Florentine front line, in which the young Dante Alighieri rode, but the Guelph infantry held, and a flank attack by the reserve under Corso Donati decided the day. Bishop Guglielmino and Buonconte da Montefeltro were among the many Aretines killed. Ghibelline power in Tuscany never fully recovered.
    facts:
      - [Battle of Colle di Val d’Elsa, "June 1269, Guelph victory"]
      - [Battle of Meloria, "6 August 1284, Genoa defeats Pisa"]
      - [Battle of Campaldino, "11 June 1289, Guelph victory"]
    markers:
      - kind: battle
        side: gue
        name: Battle of Colle di Val d’Elsa
        date: June 1269
        text: Florentine troops and the French knights of Charles of Anjou’s vicar routed the Sienese, avenging Montaperti.
        lonlat: [11.13, 43.42]
      - kind: naval
        name: Battle of Meloria
        date: 6 August 1284
        text: Genoa destroyed the Pisan fleet off Livorno and took thousands of prisoners. Pisa never regained its strength at sea.
        lonlat: [10.22, 43.55]
      - kind: event
        side: gib
        name: Arezzo
        date: "1287"
        text: Ghibelline nobles and the bishop took over the city and expelled its Guelphs, who turned to Florence.
        lonlat: [11.88, 43.46]
      - kind: battle
        side: gue
        name: Battle of Campaldino
        date: 11 June 1289
        text: Dante later described the battle, and the death of Buonconte, whose body was never found, in the Purgatorio.
        lonlat: [11.77, 43.73]
    arrows:
