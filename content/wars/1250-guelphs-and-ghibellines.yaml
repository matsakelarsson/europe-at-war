id: guelphs-and-ghibellines
name: Guelph and Ghibelline wars in Tuscany
start: "1250"
end: "1328-09-03"
tier: B
summary: The wars between the Guelph (papal and Angevin) and Ghibelline (imperial) parties in Tuscany after the death of Frederick II, in which Guelph Florence fought Ghibelline Siena, Arezzo, Pisa and Lucca. The Ghibellines won at Montaperti in 1260 and again under Uguccione della Faggiuola and Castruccio Castracani at Montecatini (1315) and Altopascio (1325), but the Guelphs’ victories after 1266 and at Campaldino in 1289 made Florence the leading power in Tuscany.
countries: [it]
sides:
  - id: gue
    name: Florence and the Guelphs
    polities: [tuscany, naples, papal-states]
    ink: red
    moves: Guelph moves
    success: Guelph success
  - id: gib
    name: The Ghibellines
    polities: [siena, pisa, lucca, sicily]
    ink: slate
    moves: Ghibelline moves
    success: Ghibelline success
notes:
  - The parties took their names from the Welf dynasty and the Hohenstaufen castle of Waiblingen. In Tuscany they were as much about rivalries between cities and feuds between families as about pope and emperor, and the losing party in a city was usually exiled.
  - Cities changed sides. Siena was Ghibelline until 1269–1270 and Guelph afterwards; Lucca was Guelph until Uguccione della Faggiuola and Castruccio Castracani ruled it (1314–1328). Arezzo and Pisa were the main Ghibelline cities.
  - The struggles in Lombardy, Romagna and the March of Treviso, and the split of Florence’s Guelphs into Whites and Blacks that exiled Dante in 1302, are not told here.
