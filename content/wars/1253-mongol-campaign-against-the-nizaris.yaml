notes:
  - The main source is Juvayni, who served Hülegü in the campaign, took part in the negotiations and examined the library of Alamut; his account is hostile to the Nizaris and has to be corrected from other sources. The site of Maymun-Diz is disputed.
  - The Nizaris of Syria were not part of this campaign; they submitted to the Mamluk sultan Baybars between 1265 and 1273.
