steps:
  - title: Quhistan and Gerdkuh
    date: 1253–1256
    when: "1253-05"
    borders: "1253-05"
    countries: [ir]
    body:
      - Since Hasan-i Sabbah seized Alamut in 1090, the Nizari Ismailis had held dozens of castles in Rudbar and Daylam in the Alborz mountains, at Gerdkuh in Qumis and in the towns and forts of Quhistan in the east, and they defended them against their Sunni neighbours with fortifications and, at times, with the murder of enemy leaders. After the Mongol conquest of Iran, Sunni notables at the Mongol court urged action against them, and in 1252 Möngke Khan gave his brother Hülegü the task of destroying the Nizari state and then dealing with the Abbasid caliph.
      - Hülegü’s advance guard of about 12,000 men under Kitbuqa crossed the Oxus in March 1253. In April it took several Nizari forts in Quhistan and killed their people, and in May it laid siege to Gerdkuh, the Nizari stronghold near Damghan. In July Kitbuqa sacked Tun and Turshiz. Gerdkuh held out; a night sortie in December 1253 killed a hundred Mongols and their commander, and reinforcements from Alamut got through. In December 1255 the imam Ala al-Din Muhammad was murdered, and his son and successor, Rukn al-Din Khurshah, opened negotiations with the Mongols.
      - Hülegü himself moved west at a leisurely pace with a great army, which by the time he reached Iran numbered five tumens, with Chinese, Khitan and Muslim siege engineers. He crossed the Oxus in January 1256 and entered Quhistan in April, where Tun was stormed again and most of its people killed.
    facts:
      - [Kitbuqa crosses the Oxus, "March 1253"]
      - [Siege of Gerdkuh, "from May 1253"]
      - [Hülegü in Quhistan, "April 1256"]
