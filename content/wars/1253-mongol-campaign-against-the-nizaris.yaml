  - title: Maymun-Diz and Alamut
    date: November – December 1256
    when: "1256-11-19"
    borders: "1256-12"
    countries: [ir]
    body:
      - In September 1256 Hülegü attacked Rudbar from three sides. His right wing marched through Tabaristan, his left wing by way of Khuwar and Semnan, and he himself led the centre through the Taleqan valley. Khurshah, in the castle of Maymun-Diz, tried to play for time, offering submission, demolishing some of his forts and sending a brother as a hostage, but would not come down in person. On 8 November Hülegü encamped before Maymun-Diz, which, unlike Alamut, was within reach of his mangonels. After several days of bombardment Khurshah came down and surrendered on 19 November 1256, accompanied by the scholar Nasir al-Din al-Tusi and other men of learning who had lived under Nizari protection.
      - Khurshah ordered the castles of Rudbar, about forty of them, to surrender and be demolished. Alamut refused at first, its commander believing that the imam was acting under duress, but capitulated in December. Juvayni went through its famous library, kept copies of the Qur’an, scientific instruments and some books, and burned the works of Ismaili doctrine; the castle was then pulled down. Lambsar fell in January 1257 after an epidemic in the garrison, and Gerdkuh held out until 1270. Khurshah was sent to Mongolia, where Möngke refused to see him, and was killed on the way back in 1257. Möngke then ordered the killing of all Nizaris in Mongol hands, and Khurshah’s family and many others were put to death. Hülegü moved on to Azerbaijan and in the next year marched on Baghdad.
    facts:
      - [Khurshah surrenders at Maymun-Diz, "19 November 1256"]
      - [Alamut capitulates, "December 1256"]
      - [Lambsar falls, "January 1257"]
