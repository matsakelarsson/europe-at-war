id: mongol-campaign-against-the-nizaris
name: Mongol campaign against the Nizaris
start: "1253-03"
end: "1256-12"
tier: B
summary: The campaign in which the Mongols destroyed the Nizari Ismaili state, a network of mountain castles in northern and eastern Iran that had resisted the Seljuks and the Khwarazmshahs for more than 150 years and whose fida’is were known in the West as the Assassins. The Great Khan Möngke sent his brother Hülegü west in 1253 with orders to destroy the Nizaris and bring the Abbasid caliph to heel. His general Kitbuqa took castles in Quhistan and besieged Gerdkuh from 1253, and in 1256 Hülegü himself entered the Nizari heartland of Rudbar in the Alborz. The imam Rukn al-Din Khurshah surrendered at Maymun-Diz on 19 November 1256 and ordered his castles to give up; Alamut capitulated in December. Some castles held out for years, but Khurshah was killed in 1257 on Möngke’s orders, and many Nizaris in Mongol hands were massacred.
countries: [ir]
