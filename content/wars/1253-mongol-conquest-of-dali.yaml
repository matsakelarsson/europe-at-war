notes:
  - Dates are converted from the Chinese calendar as the sources give them. The fall of the capital is dated to December 1253 or January 1254, and Duan Xingzhi’s capture or surrender to 1254, 1255 or 1256, in different accounts.
  - The routes of the three columns are known only in outline; the arrows are approximate. The story of the crossing of the Jinsha on rafts of inflated skins comes from Chinese accounts.
  - The Dali Kingdom was ruled by the Duan dynasty of the Bai people, but real power had long been with the Gao family of chief ministers. Its lands included many Yi and other peoples who were only loosely under its rule.
