  - title: Shanchan and the end of the kingdom
    date: 1254–1256
    when: "1254"
    borders: "1254-12-01"
    countries: [cn]
    body:
      - Kublai went back north in 1254 and left Uriyangkhadai to finish the conquest. Duan Xingzhi had fled east to Shanchan, today’s Kunming, the kingdom’s eastern capital, and rallied local lords against the Mongols. Uriyangkhadai took Shanchan and captured the king near Kunze (Yiliang) in 1254; other accounts date his surrender to 1256.
      - Möngke chose to rule through the old dynasty. Duan Xingzhi was received at the Mongol court, presented maps of Yunnan to the Great Khan and was sent back with the title of maharaja, and the Duan family went on governing Dali under Mongol princes and governors until the Ming conquest of 1381–1382. Uriyangkhadai spent the next two years subduing the Yi and other peoples of Yunnan and the Tibetan tribes to the north, and set up Mongol military units in the conquered lands, with local troops under them. Resistance around Shanchan continued for years.
      - Yunnan gave the Mongols a base south-west of the Song. In 1257–1258 Uriyangkhadai invaded Đại Việt and took its capital, Thăng Long, and in 1259 he marched north through Guangxi and Hunan to join Kublai on the Yangtze. In 1274 Kublai sent Sayyid Ajall Shams al-Din to govern Yunnan, which became a province of the Yuan.
    facts:
      - [Duan Xingzhi captured, "1254 (1256 in some accounts)"]
      - [Yunnan subdued, "by 1256"]
      - [Province of Yunnan under Sayyid Ajall, "from 1274"]
