id: mongol-conquest-of-dali
name: Mongol conquest of the Dali Kingdom
start: "1253-09"
end: "1254"
tier: B
summary: "The campaign in which the Mongols conquered the Dali Kingdom, the Bai state in today’s Yunnan that had succeeded Nanzhao in 937. To outflank the Southern Song from the west, the Great Khan Möngke sent his brother Kublai south through the Tibetan borderlands in 1253 with the general Uriyangkhadai. After the Dali court, dominated by the Gao family of chief ministers, had killed the Mongol envoys, three Mongol columns crossed the upper Yangtze (the Jinsha) and converged on the capital, Dali, which was taken around the turn of 1253–1254 and spared. The chief minister Gao Taixiang was caught and executed, and King Duan Xingzhi fled east to Shanchan (Kunming), where Uriyangkhadai captured him in 1254. Möngke kept Duan as ruler under Mongol overlordship, with the title of maharaja, and Uriyangkhadai subdued the rest of Yunnan by 1256. Yunnan became a Mongol base for attacks on the Song and Đại Việt, and later a province of the Yuan."
countries: [cn]
