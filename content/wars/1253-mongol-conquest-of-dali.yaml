steps:
  - title: Across the Jinsha to Dali
    date: September 1253 – January 1254
    when: "1253-09"
    borders: "1253-12-01"
    countries: [cn]
    body:
      - Since the Mongols had failed to break the Song defences in Sichuan and on the Yangtze, Möngke planned to encircle the Song from the west. In 1252 he gave his brother Kublai command of an expedition against the Dali Kingdom, the old Bai state in Yunnan that had kept its independence for three centuries between Tibet, the Song and the kingdoms of Southeast Asia. Mongol envoys sent to demand its submission were killed by the court, where the Gao family of chief ministers held power under King Duan Xingzhi.
      - Kublai gathered his army at Lintao in the summer of 1253 and in the autumn split it into three columns. Uriyangkhadai, son of the great general Subutai, led the western column through the Tibetan lands of Kham; Wang Dezhen led the eastern through Sichuan and Jianchang; Kublai himself led the centre. Dali’s army defended the line of the Jinsha, the upper Yangtze, and beat back several attempts to cross it, until Kublai’s men crossed at night, by Chinese accounts on rafts of inflated skins, and routed it.
      - The three columns met before the capital, Dali, which lay between Erhai Lake and the Cang Mountains, defended by fortified passes at either end. The city was taken at the turn of 1253 and 1254. Although his envoys had been killed, Kublai, urged by his Chinese advisers, forbade a massacre and spared its people. Duan Xingzhi and his chief minister Gao Taixiang fled; Gao was caught at Yaozhou and beheaded at Dali.
    facts:
      - [Campaign ordered, "1252"]
      - [Columns divide, "autumn 1253"]
      - [Dali taken, "December 1253 or January 1254"]
