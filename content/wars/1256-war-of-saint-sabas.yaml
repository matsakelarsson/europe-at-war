    polities: [venice, pisa]
    ink: red
    moves: Venetian and Pisan moves
    success: Venetian and Pisan success
notes:
  - Pisa at first sided with Genoa and changed sides in 1257. In the Kingdom of Jerusalem the Templars and the Ibelins mostly backed Venice, and the Hospitallers and Philip of Montfort, lord of Tyre, backed Genoa. The war weakened the kingdom at the moment when the Mongols and then the Mamluks were advancing.
