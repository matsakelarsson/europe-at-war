id: war-of-saint-sabas
name: War of Saint Sabas
start: "1256"
end: "1270"
tier: C
summary: A war between Genoa and Venice, each with its allies, that began in 1256 with fighting in Acre over property near the monastery of St Sabas and spread across the eastern Mediterranean, dividing the barons and military orders of the Kingdom of Jerusalem. Venice and Pisa drove the Genoese out of Acre after a naval victory in 1258, and Genoa moved its base to Tyre and in 1261 allied with the Byzantine emperor Michael VIII, who recovered Constantinople that year. Venetian fleets won again at Settepozzi in 1263 and at Trapani in 1266. Peace was made at Cremona in 1270, under pressure from Louis IX, who needed both cities’ ships for his crusade.
countries: [il, lb, it, gr]
