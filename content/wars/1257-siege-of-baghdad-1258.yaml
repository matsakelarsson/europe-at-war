id: siege-of-baghdad-1258
name: Siege of Baghdad (1258)
start: "1257-11"
end: "1258-02-20"
tier: B
summary: The Mongol conquest of Baghdad, capital of the Abbasid caliphate for five hundred years. After destroying the Nizari Ismailis, Hülegü demanded that the caliph al-Musta’sim submit; the caliph refused, and in the winter of 1257–1258 Mongol armies converged on Iraq from three directions. A caliphal army was destroyed by flooding near the Dujayl canal on 17 January, the city was surrounded, and after the walls were breached the caliph surrendered on 10 February. The Mongols sacked Baghdad for about a week and killed a great many of its people; the caliph was executed on 20 February. The fall of Baghdad ended the Abbasid caliphate there and made Iraq a province of the new Mongol Ilkhanate.
countries: [iq, ir]
sides:
