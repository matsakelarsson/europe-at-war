    success: Abbasid success
notes:
  - The number of people killed is unknown. Later Muslim writers gave figures from 800,000 to two million, which are probably far too high; the true toll was certainly very large, and was raised further by epidemics in the weeks afterwards.
  - The story that Hülegü locked the caliph up with his treasure to starve, told by Marco Polo and other Christian writers, is a legend.
  - Some later Sunni writers accused the Shi’i vizier Ibn al-Alqami of betraying the caliph to the Mongols; modern historians treat the charge with caution.
