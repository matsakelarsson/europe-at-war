steps:
  - title: The road to Baghdad
    date: September 1257 – January 1258
    when: "1258-01-17"
    borders: "1258-01-17"
    countries: [iq, ir]
    body:
      - The Abbasid caliph al-Musta’sim, who had reigned since 1242, ruled little more than Iraq, and his court was divided between rival ministers; in 1256 Sunni–Shi’i rioting in Baghdad had ended with troops sacking the Shi’i quarter of Karkh. Hülegü had expected the caliph to send troops against the Nizaris, and he had not. In September 1257, from his camp on the plain of Hamadan, Hülegü wrote demanding that the caliph pull down the city’s outer walls and come to him in person. Al-Musta’sim answered that the whole Muslim world would rise to defend him; in fact the Mamluks of Egypt were hostile to him and the Ayyubid princes of Syria were looking to their own survival.
      - In November 1257 the Mongols, with Georgian, Armenian and Seljuk contingents, moved on Iraq from three sides. Hülegü led the centre through the Zagros and sacked Kermanshah on 6 December. On the right, the general Baiju crossed the Tigris at Mosul with the help of its ruler Badr al-Din Lu’lu’ and marched south along the west bank, while princes of the Golden Horde came by way of the Shahrizor plain. On the left, Kitbuqa came through Luristan and Khuzistan. On 16 January 1258 the caliph’s commander, the dawatdar Aybak, with some 20,000 men drove back Baiju’s vanguard west of Baghdad. That night the Mongols broke the dykes of the Dujayl canal and flooded the Abbasid camp, and the next morning they routed the survivors; only a few, the dawatdar among them, got back to the city.
    facts:
      - [Kermanshah sacked, "6 December 1257"]
      - [Battle at the Dujayl canal, "16–17 January 1258, Mongol victory"]
      - [Mongol army, "perhaps 120,000–150,000 with its vassals"]
