  - title: Siege and sack
    date: 22 January – 20 February 1258
    when: "1258-02-10"
    borders: "1258-02-20"
    countries: [iq]
    body:
      - Hülegü reached the eastern suburbs on 22 January, while Kitbuqa and Baiju closed in on the western side. Within a day the Mongols surrounded the city with a palisade and a ditch, and they built pontoon bridges across the Tigris above and below it so that no one could escape by boat. Stones for the catapults were brought from the Jebel Hamrin, three days away. The assault began on 29 or 30 January; the first breach was made in the Ajami tower on 1 February, and by 4 February the Mongols held the whole eastern wall. The caliph sent envoys, among them his vizier and the Nestorian patriarch, but Hülegü would accept nothing but unconditional surrender. Soldiers who came out to surrender were killed.
      - On 10 February al-Musta’sim came out with his sons and some 3,000 notables and surrendered. The people were ordered to lay down their arms and leave the city, and those who did were killed. The sack began on 13 February and lasted about a week. Christians, on whose behalf Hülegü’s Christian wife Doquz Khatun interceded, and some groups of scholars and merchants were spared; the rest of the city was plundered and many of its people killed, and mosques, palaces and libraries were burned. On 20 February, after Hülegü had stopped the killing and moved his camp away from the smell of the dead, the caliph and his family were executed; according to the usual account, the caliph was rolled in a carpet and trampled by horses, since the Mongols avoided shedding royal blood.
      - Hilla and Kufa submitted, while Wasit resisted and was sacked. Hülegü sent much of the caliph’s treasure to his base in Azerbaijan and left Baghdad under a governor; under the Ilkhans it recovered, though it was no longer a capital. An Abbasid survivor was installed as caliph in Cairo by the Mamluk sultan Baybars in 1261, but he and his successors had no power of their own.
    facts:
      - [Assault begins, "29 or 30 January 1258"]
      - [Caliph surrenders, "10 February 1258"]
      - [Caliph executed, "20 February 1258"]
