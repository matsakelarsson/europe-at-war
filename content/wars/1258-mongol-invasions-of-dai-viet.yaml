  - title: Toghon’s invasion
    date: January – March 1285
    when: "1285-02"
    borders: "1285-03-01"
    countries: [vn, cn]
    body:
      - The Trần refused Toghon passage, judging that the road to Champa was a pretext for conquest. King Trần Nhân Tông gave command of the army to his uncle, Prince Trần Quốc Tuấn, known by his title Trần Hưng Đạo, and soldiers had the words Sát Thát, “Death to the Tatars”, tattooed on their arms. On 27 January 1285 Toghon and the Uyghur general Ariq Qaya crossed the border at the Nam Quan pass with an army for which the sources give anything from 80,000 to 300,000 or more men, while Nasr al-Din, governor of Yunnan, came down the Red River from Yunnan. The Vietnamese army is put at about 100,000.
      - The Yuan defeated the Vietnamese at Khả Ly and Nội Bàng, in today’s Bắc Giang, reached Trần Hưng Đạo’s base at Vạn Kiếp on 10 February and forced the crossing of the river on 18 February; prisoners with the tattoo were executed. In late February Omar’s fleet came up the rivers and took Thăng Long, which the Vietnamese had emptied of grain, and Toghon entered an abandoned palace. The court withdrew to its estates at Thiên Trường and then by sea. Many nobles went over to the Yuan, among them the king’s uncle Prince Trần Ích Tắc. According to Vietnamese tradition, King Nhân Tông asked Trần Hưng Đạo whether to surrender and was told that he would first have to cut off his commander’s head.
    facts:
      - [Yuan army crosses the border, "27 January 1285"]
      - [Vạn Kiếp reached, "10 February 1285"]
      - [Thăng Long taken, "late February 1285"]
