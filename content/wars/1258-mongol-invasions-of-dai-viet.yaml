  - title: Sogetu marches north
    date: February – May 1285
    when: "1285-03"
    borders: "1285-04-01"
    countries: [vn]
    body:
      - Toghon ordered Sogetu, still in Champa, to march north and close a pincer on the Trần. Sogetu’s army came overland through the passes of the south, took Nghệ An and Thanh Hóa and the Vietnamese supply bases further north, and captured about 400 former Song officers who were fighting for the Trần. Trần Hưng Đạo divided his forces to stop Sogetu joining Toghon, but was beaten, and the two Yuan armies closed in on the delta from north and south.
      - In April Omar’s fleet attacked twice more along the coast and nearly caught the king. The Trần kings slipped away by sea and along the coast to Thanh Hóa while the princes kept their private armies in the field. The Yuan held the capital and the main rivers, but the countryside had been stripped of food, the summer heat and disease were coming, and the occupying armies, spread along a long line of communications, began to run short of supplies.
    facts:
      - [Sogetu’s march north, "February–April 1285"]
      - [Song officers captured fighting for the Trần, "about 400"]
