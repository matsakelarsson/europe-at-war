steps:
  - title: Uriyangkhadai takes Thăng Long
    date: December 1257 – February 1258
    when: "1258-01"
    borders: "1258-01-20"
    countries: [vn, cn]
    body:
      - After the conquest of Dali (1253–1256), the Mongol general Uriyangkhadai, son of Subutai, held Yunnan as a base from which to outflank the Song. In the autumn of 1257 he sent envoys to the Trần king Trần Thái Tông demanding his submission and a road through his kingdom to attack the Song from the south. The king, whose kingdom was a Song tributary, had the envoys imprisoned and prepared his army and war elephants. In early 1258 Uriyangkhadai came down the Red River from Yunnan. Vietnamese sources give him 30,000 men; modern estimates are closer to 3,000 Mongols and 10,000 or more Yi and other troops from Yunnan.
      - On 17 January 1258 the two armies met at Bình Lệ Nguyên, north-west of the capital. Trần Thái Tông led his army from the back of an elephant; the Mongol commander Aju had his archers shoot at the elephants’ feet, and the panicked animals broke the Vietnamese ranks. The Trần army was beaten again the next day at the Phù Lỗ bridge, and the king abandoned Thăng Long and withdrew down the river. The Mongols entered the capital, found one of their envoys dead in prison and massacred the inhabitants.
      - How the invasion ended is told differently. The Vietnamese chronicles say the Trần army counter-attacked at Đông Bộ Đầu, on the Red River beside the capital, and drove the Mongols out, and that they retreated so quickly that people called them the Buddhist enemy, because they did not loot on the way. The Yuan History says Uriyangkhadai left Thăng Long after nine days to join Möngke’s offensive against the Song. Both agree that the Trần then opened relations with the Mongols; in March 1258 Trần Thái Tông abdicated in favour of his son Trần Thánh Tông, who sent envoys to Yunnan, and in 1259 Uriyangkhadai marched north through Guangxi into the Song.
    facts:
      - [Battle of Bình Lệ Nguyên, "17 January 1258, Mongol victory"]
      - [Mongol force, "about 3,000 Mongols and 10,000 Yi (modern estimate); 30,000 (Vietnamese sources)"]
      - [Thăng Long held by the Mongols, "about nine days"]
