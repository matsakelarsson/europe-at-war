  - title: The third invasion and Vân Đồn
    date: October 1287 – March 1288
    when: "1288-01"
    borders: "1288-02-01"
    countries: [vn, cn]
    body:
      - Kublai abandoned his plans for a third invasion of Japan and in 1286 named Trần Ích Tắc, the prince who had gone over to the Yuan, king of Annam in place of Trần Nhân Tông. In late 1287 Toghon came south again from Guangxi with Nasr al-Din’s troops from Yunnan, while a fleet under Omar and Fan Yi sailed from Qinzhou on 17 December with about 500 ships. The sources give the whole force as about 70,000 Yuan troops with more than 20,000 auxiliaries from Yunnan, Guangxi and Hainan, up to 170,000 men with the crews.
      - The army and the fleet met at Vạn Kiếp, drove the king out of Thăng Long again in early February 1288 and found no grain there. Toghon was waiting for a supply fleet under Zhang Wenhu. In late January Prince Trần Khánh Dư, who had been ordered to answer for letting Omar’s fleet slip past, ambushed it near Vân Đồn, among the islands of Hạ Long Bay; most of the transports were sunk or captured, and Zhang Wenhu fled to Hainan. Trần Nhân Tông released the captured Yuan sailors so that they would tell Toghon the news. The Yuan troops plundered the delta for food, and Omar desecrated the tomb of Trần Thái Tông.
    facts:
      - [Yuan fleet leaves Qinzhou, "17 December 1287"]
      - [Supply fleet destroyed at Vân Đồn, "late January 1288"]
      - [Thăng Long taken, "February 1288"]
