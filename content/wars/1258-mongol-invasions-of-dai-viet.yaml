  - title: The Trần counter-offensive
    date: May – June 1285
    when: "1285-06"
    borders: "1285-06-15"
    countries: [vn, cn]
    body:
      - In May 1285 the Trần went over to the offensive. Toghon, short of food and losing men to disease, ordered Sogetu to take Nam Định and then fall back to Champa, while he himself prepared to withdraw to Siming in Guangxi. In late May a Yuan force was defeated in a river battle at Hàm Tử by Prince Trần Nhật Duật with local militia and a unit of former Song soldiers under Zhao Zhong. On 9 June the Yuan abandoned Thăng Long.
      - Trần Hưng Đạo sailed north and attacked the Yuan camp at Vạn Kiếp, cutting the line of retreat; the Tangut general Li Heng was killed by a poisoned arrow. Princes Trần Quang Khải and Trần Hưng Đạo and the general Phạm Ngũ Lão defeated the Yuan at Chương Dương on the Red River, and Sogetu, trying to reach Toghon from the south, was killed in the fighting (at Tây Kết, by the Vietnamese account). Toghon escaped to Guangxi, by one account hidden in a copper box carried by his soldiers; Omar and Liu Gui escaped by sea in a small boat. By late June the Yuan armies were gone, and the Trần court returned to the capital. Some accounts put the Yuan soldiers captured in the campaign at 50,000.
    facts:
      - [Battle of Hàm Tử, "late May 1285, Trần victory"]
