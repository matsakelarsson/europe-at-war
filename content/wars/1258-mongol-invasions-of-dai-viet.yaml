  - title: Bạch Đằng, April 1288
    date: March – April 1288
    when: "1288-04"
    borders: "1288-04-09"
    countries: [vn, cn]
    body:
      - On 5 March 1288 Toghon fell back from Thăng Long to Vạn Kiếp, and on 30 March, with no supplies coming, ordered a retreat to China, the army by land and Omar’s fleet by the Bạch Đằng, the way it had come. Trần Hưng Đạo had already prepared the river as Ngô Quyền had in 938, with beds of iron-tipped stakes in the channels where the Bạch Đằng meets its northern branches, covered at high tide, and boats and troops hidden along both banks.
      - On the morning of 9 April the Yuan fleet entered the trap at high tide. Small Vietnamese boats attacked and fell back, drawing the Yuan ships on, and as the tide went out the ships ran onto the stakes. The Vietnamese attacked the stranded fleet from all sides and fought until sunset. Fan Yi was killed and Omar was captured, and the Vietnamese took about 400 ships. A few days later Zhang Wenhu’s remaining transports, unaware of the defeat, sailed into the river and were destroyed in their turn.
      - The land army fared no better. The Vietnamese had broken the bridges and roads and lay in ambush along the way, and on 10 April, near Lạng Sơn, Toghon was wounded by a poisoned arrow and escaped through the forests to Siming with a few followers. Most of his army was killed or captured or lost in the hills; Lê Tắc, who went north with the retreat, wrote that ten thousand died in the mountain passes.
    facts:
      - [Battle of Bạch Đằng, "9 April 1288, Trần victory"]
      - [Yuan ships captured, "about 400"]
      - [Yuan commander captured, Omar]
    markers:
