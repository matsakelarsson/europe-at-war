id: mongol-invasions-of-dai-viet
name: Mongol invasions of Đại Việt and Champa
start: "1258-01"
end: "1288-04"
tier: A
summary: "Four campaigns of the Mongol Empire and Kublai Khan’s Yuan dynasty against Đại Việt, ruled by the Trần dynasty, and Champa. In January 1258 Uriyangkhadai, coming from the newly conquered kingdom of Dali, routed the Trần army and took Thăng Long, which he left after a few days; the Trần then sent tribute. In 1283 a Yuan fleet under Sogetu landed in Champa and took its capital Vijaya, but the Cham king withdrew to the hills and fought on. In 1285 Kublai’s son Toghon invaded Đại Việt, took Thăng Long and, with Sogetu marching north from Champa, drove the Trần court to the coast; by June a Vietnamese counter-offensive led by Trần Hưng Đạo had killed Sogetu and driven the Yuan armies out. A third invasion in 1287–1288 again took the capital, but the loss of its supply fleet at Vân Đồn forced a retreat, and on 9 April 1288 its fleet was destroyed on the stakes of the Bạch Đằng. Đại Việt and Champa kept their independence and sent tribute to the Yuan; Vietnam remembers the wars as a national victory."
countries: [vn, cn]
sides:
  - id: dv
    name: Đại Việt (Trần dynasty)
    polities: [dai-viet]
    ink: red
    moves: Trần moves
    success: Trần success
  - id: mg
    name: Mongol Empire, then Yuan dynasty
    polities: [mongol-empire, yuan]
