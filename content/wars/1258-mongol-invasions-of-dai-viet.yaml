  - title: Tribute without conquest
    date: 1288–1294
    when: "1289"
    borders: "1290-01-01"
    countries: [vn, cn]
    body:
      - Kublai banished Toghon to Yangzhou and wanted to invade again. The Trần sent back most of the prisoners in 1289, but Omar, whose return Kublai especially demanded, was drowned when the boat carrying him was made to sink. Trần Nhân Tông sent tribute and a golden statue in place of the personal visit to the Khan’s court that Kublai demanded, and wrote describing the devastation the Yuan armies had caused. Kublai detained a Vietnamese envoy in 1293 and was planning a fourth campaign to put Trần Ích Tắc on the throne when he died in 1294; his successor Temür ended the war and released the envoys.
      - Đại Việt and Champa both kept their kings and their independence and sent regular tribute to the Yuan. The wars left Đại Việt’s capital burned and its countryside devastated, and famine followed in 1290–1292. In 1306 the Cham king Chế Mân married Trần Nhân Tông’s daughter, Princess Huyền Trân, and ceded the districts of Ô and Lý (today’s Quảng Trị and Thừa Thiên Huế) to Đại Việt. Trần Hưng Đạo became one of Vietnam’s national heroes, and the stakes of Bạch Đằng, some of which survive in the fields along the river, a symbol of resistance to invasion.
    facts:
      - [Death of Kublai Khan, "1294"]
      - [Ô and Lý ceded to Đại Việt, "1306"]
