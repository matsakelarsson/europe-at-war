notes:
  - The main sources are the Yuan History and the Vietnamese chronicles (the Đại Việt sử ký toàn thư), with the An Nam chí lược of Lê Tắc, a Vietnamese official who went over to the Yuan in 1285. They differ widely on numbers, on the order of some battles and on how the first invasion ended; where they disagree, both versions are given. Army sizes are those of the sources and best read as orders of magnitude. Lunar dates are converted as in the English sources cited.
  - Mongol and Chinese names are given in their usual English forms (Uriyangkhadai, Sogetu, Toghon, Omar); Vietnamese books call them Ngột Lương Hợp Thai, Toa Đô, Thoát Hoan and Ô Mã Nhi. Trần Hưng Đạo is the title of Prince Trần Quốc Tuấn, commander of the Trần armies.
  - Many historians count the campaigns as a Mongol success, since both kingdoms became Yuan tributaries; Vietnamese historiography counts them as victories, since the Yuan never achieved their aims of a royal visit to the Khan’s court, direct oversight of the kingdom or a king of their choosing. The base map shows Đại Việt and Champa throughout; the ground held by the invaders is drawn in the steps.
