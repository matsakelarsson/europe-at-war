  - title: Sogetu in Champa
    date: 1282–1284
    when: "1283-02"
    borders: "1283-03-01"
    countries: [vn]
    body:
      - After the fall of the Song in 1279, Kublai wanted Champa, which lay on the sea routes between China and the Indian Ocean, as an obedient vassal. The old Cham king Jaya Indravarman V had accepted a Mongol protectorate, but his son, Prince Harijit, sheltered Song refugees and in 1282 detained Yuan envoys passing on their way to the countries of the south. Kublai ordered Sogetu, the governor of Guangzhou, to punish Champa. Most Yuan ships had been lost in the invasion of Japan in 1281, and Sogetu sailed with about 5,000 men, 100 ships and 250 landing craft.
      - The fleet reached Thị Nại Bay, the harbour of the Cham capital, in February 1283. On the night of 13 February the Yuan landed and stormed the Cham wooden stockade on the shore after a battle with about 10,000 Cham troops and war elephants, and two days later Sogetu took Vijaya. The king had burned his storehouses and gone into the hills with, a captured spy said, 20,000 men, and sent for help from Panduranga in the south, from Đại Việt, Cambodia and Java. The Cham spun out negotiations, and on 16 March a Yuan column sent into the mountains to seize the king was ambushed and driven back with heavy losses.
      - Sogetu withdrew to his beach camp, planted rice and asked for reinforcements. A second fleet with more than 20,000 men arrived in March 1284, but Harijit kept up the war in the hills. Kublai accepted Sogetu’s plan to send an army overland to Champa through Đại Việt, under the command of his son Toghon, and ordered the Trần to give it passage and supplies.
    facts:
      - [Yuan landing at Thị Nại, "13 February 1283"]
      - [Vijaya taken, "February 1283"]
      - [Yuan reinforcements, "more than 20,000 men (March 1284)"]
