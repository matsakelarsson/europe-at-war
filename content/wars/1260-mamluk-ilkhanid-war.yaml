  - title: Wadi al-Khaznadar and Damascus
    date: December 1299 – May 1300
    when: "1299-12-22"
    borders: "1300-01"
    countries: [sy, lb, ps, il]
    body:
      - The Ilkhan Ghazan, who had become a Muslim on taking power in 1295, presented his invasion of Syria as a response to a Mamluk raid on Mardin and to the misrule of the Mamluk emirs. In December 1299 he crossed the Euphrates with a large army, joined by the Armenians under King Hethum II and Georgian troops, and took Aleppo, whose citadel held out. The young sultan al-Nasir Muhammad came north from Damascus with 20,000 to 30,000 men and met Ghazan at Wadi al-Khaznadar, north-east of Homs, on 22 December 1299. After a day of fighting the Mamluk right wing gave way and the army fled south towards Egypt, harried by local mountain peoples on the way.
      - Damascus surrendered at the end of December, though the Mamluk governor held the citadel throughout. The Friday sermon was read in Ghazan’s name in the Umayyad mosque, and the city paid a heavy ransom, though Ghazan could not prevent his troops from plundering the suburbs and the villages around. Mongol raiders under Mulay rode as far as Gaza. In February 1300 Ghazan returned to Iran, and in May the Mamluks reoccupied Syria without a fight. A second invasion in the winter of 1300–1301 was abandoned when heavy rains bogged down the Mongol army.
    facts:
      - [Battle of Wadi al-Khaznadar, "22 December 1299, Ilkhanid victory"]
      - [Damascus under Ilkhanid rule, "about January – May 1300; citadel never taken"]
      - [Mamluk army, "20,000–30,000"]
