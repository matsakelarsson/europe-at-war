steps:
  - title: Aleppo and Damascus
    date: September 1259 – March 1260
    when: "1260-03-01"
    borders: "1260-03"
    countries: [sy, tr, lb, il, ps, jo]
    body:
      - After the fall of Baghdad, Hülegü wintered in Azerbaijan and in September 1259 marched west with an army that included the Armenians of Cilicia under King Hethum I and the Georgians, with Bohemond VI of Antioch also joining him. He crossed the upper Euphrates, took Nusaybin, Harran and Edessa, and in January 1260 laid siege to Aleppo, the city of the Ayyubid sultan al-Nasir Yusuf. After about a week of bombardment the city was stormed on 24 or 25 January and sacked for several days; many of its people were killed, though some districts were spared. The citadel held out until late February.
      - Al-Nasir Yusuf fled from Damascus, and its notables surrendered without a fight. On 1 March 1260 the Mongol general Kitbuqa entered the city, according to some accounts with Hethum and Bohemond at his side. Mongol detachments raided south through Palestine to Nablus and Gaza, and al-Nasir Yusuf was captured and sent to Hülegü. Then Hülegü learned that the Great Khan Möngke had died in China the previous August. He withdrew to Azerbaijan with most of his army, leaving Kitbuqa in Syria with perhaps 10,000 to 20,000 men, and sent envoys to Cairo demanding the Mamluks’ submission. The sultan Qutuz had them killed and their heads hung from a gate of Cairo.
    facts:
      - [Aleppo stormed, "24–25 January 1260"]
      - [Damascus surrenders, "1 March 1260"]
      - [Force left with Kitbuqa, "perhaps 10,000–20,000"]
