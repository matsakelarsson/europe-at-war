  - title: Homs, 1281
    date: October 1280 – October 1281
    when: "1281-10-29"
    borders: "1281-10"
    countries: [sy, iq]
    body:
      - After Baybars’ death the Mamluk emir Qalawun took the throne in 1279, and the governor of Damascus, Sunqur al-Ashqar, rebelled and called on the Ilkhans for help. In October 1280 a Mongol raid sacked Aleppo, burning its mosques and markets. In 1281 Abaqa sent his brother Möngke Temür into Syria with the largest army the Ilkhans had sent there, perhaps 40,000 to 50,000 men, including the Armenians under King Leo II and the Georgians under King Demetrius II, while Abaqa himself besieged the Mamluk fortress of al-Rahba on the Euphrates. Qalawun, who had come to terms with Sunqur, gathered his army at Damascus and marched north.
      - The armies met near Homs on 29 October 1281. The Mongol right wing, with the Armenians and Georgians, routed the Mamluk left and pursued it to the gates of Homs, but the Mamluk right and centre broke the Mongol left. Möngke Temür was wounded and left the field, and his centre followed. The Mongols retreated to the Euphrates, losing many men in the pursuit. Abaqa died the next spring, and his successor Tegüder Ahmad, a Muslim, sought peace, but he was overthrown in 1284. The Mamluks used the respite to take the last crusader towns, Tripoli in 1289 and Acre in 1291, and in 1292 the Armenian Catholicos’ fortress of Qal’at al-Rum on the Euphrates.
    facts:
      - [Aleppo sacked, "20 October 1280"]
      - [Second battle of Homs, "29 October 1281, Mamluk victory"]
