  - title: Marj al-Saffar and the peace
    date: 1303–1323
    when: "1303-04-20"
    borders: "1323"
    countries: [sy, iq]
    body:
      - In the spring of 1303 Ghazan sent his general Qutlugh-Shah across the Euphrates with a large army while he stayed behind. The Mongols raided Hama and advanced on Damascus, where al-Nasir Muhammad joined the Syrian army with his troops from Egypt. The scholar Ibn Taymiyya preached that it was lawful to fight the Mongols even though they called themselves Muslims, and that the troops might break the Ramadan fast to do it. On 20 April 1303 the armies met on the plain of Marj al-Saffar, near Kiswa south of Damascus. The Mongol left drove back the Mamluk right, but the Mamluk centre and left held, and Qutlugh-Shah and his men were surrounded on a hill. After two days the Mongols broke out and retreated; many died of thirst in the desert or drowned crossing the flooded Euphrates.
      - Ghazan died in 1304. His brother Öljaitü crossed the Euphrates once more in 1312 and besieged al-Rahba for about a month, but heavy losses and a shortage of supplies forced him to withdraw. It was the last Ilkhanid invasion. Envoys were exchanged under his son Abu Sa’id, guided by the emir Chupan, and in 1322–1323 a peace was agreed with al-Nasir Muhammad, sometimes called the Treaty of Aleppo. Raiding stopped and trade and pilgrimage across the frontier resumed. The Ilkhanate broke up after Abu Sa’id’s death in 1335, while the Mamluk Sultanate lasted until the Ottoman conquest of 1517.
    facts:
      - [Battle of Marj al-Saffar, "20–22 April 1303, Mamluk victory"]
      - [Siege of al-Rahba, "about a month, winter 1312–1313"]
      - [Peace, "1322–1323"]
