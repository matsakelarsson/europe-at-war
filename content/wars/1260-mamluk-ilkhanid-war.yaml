  - title: The Euphrates frontier and Elbistan
    date: 1261–1277
    when: "1277-04-15"
    borders: "1277-04"
    countries: [sy, tr, iq]
    body:
      - Baybars made the Euphrates a fortified frontier. He installed a refugee Abbasid prince as caliph in Cairo in 1261 and sent him with a small force to retake Baghdad, but the caliph was killed by the Mongols in Iraq late that year. The Ilkhans attacked the Mamluk fortress of al-Bira, which guarded a crossing of the Euphrates, in 1264–1265 and again in the 1270s, without success, and each side sent raiders deep into the other’s lands; the country between Harran and Aleppo was largely abandoned. Baybars allied with Berke of the Golden Horde, and turned on the Ilkhans’ allies, defeating the Armenians at Mari and sacking their capital, Sis, in 1266, and taking Antioch from the Franks in 1268. In October 1271 a Mongol force under Samagar raided Aleppo, and withdrew when Baybars approached.
      - In 1277 Baybars invaded Seljuk Anatolia, a Mongol protectorate, encouraged by disaffected Seljuk emirs. On 15 April 1277 he met a Mongol army of perhaps 11,000 under Tuqu and Tudawun, with Georgian contingents, near Elbistan. The Mongols broke the Mamluk left, but the larger Mamluk army surrounded them and they fought on foot until most were killed; the Seljuk vizier Pervane and his troops stood aside. Baybars entered Kayseri and had himself proclaimed sultan there, but could not hold Anatolia and withdrew. The Ilkhan Abaqa came west in fury, had the Pervane executed and ravaged eastern Anatolia. Baybars died in Damascus that summer.
    facts:
      - [Battle of Elbistan, "15 April 1277, Mamluk victory"]
      - [Baybars in Kayseri, "April 1277"]
      - [Battle of Mari and sack of Sis, "August 1266"]
