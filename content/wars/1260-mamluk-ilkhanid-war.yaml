id: mamluk-ilkhanid-war
name: Mamluk–Ilkhanid war
start: "1260-01"
end: "1323"
tier: A
summary: The sixty-year conflict between the Mongol Ilkhanate of Iran and the Mamluk Sultanate of Egypt and Syria. In 1260 Hülegü took Aleppo and Damascus and ended Ayyubid rule in Syria, but when he withdrew most of his army, the Mamluks destroyed the force he had left behind at Ain Jalut. The Euphrates became the frontier, fortified on both sides and crossed by raiders almost every year. The Ilkhans invaded Syria in strength, with Armenian and Georgian allies, in 1281, 1299–1300 and 1303, and the Mamluks struck into Cilician Armenia and Seljuk Anatolia, winning at Elbistan in 1277. The Mongols won only once in the field, at Wadi al-Khaznadar in 1299, after which they held Damascus for a few months; their defeat at Marj al-Saffar in 1303 ended their attempts to conquer Syria. After a last siege of al-Rahba in 1312–1313, the Ilkhan Abu Sa’id made peace with the sultan al-Nasir Muhammad in 1322–1323.
countries: [sy, tr, iq, lb, il, ps, jo]
sides:
  - id: ilk
    name: Ilkhanate and its vassals
    polities: [ilkhanate, mongol-empire, cilician-armenia, georgia]
    ink: orange
    moves: Ilkhanid moves
    success: Ilkhanid success
  - id: mam
    name: Mamluk Sultanate
    polities: [mamluk]
    ink: green
    moves: Mamluk moves
    success: Mamluk success
notes:
  - “Mamluk–Ilkhanid war” is a modern name for a long rivalry of raids, frontier sieges, diplomacy and a few great campaigns. Most of the detailed narrative comes from Mamluk chroniclers, who tend to inflate Mongol numbers and losses and play down Mamluk defeats; Rashid al-Din gives the Ilkhanid view.
  - The Mamluks were allied with the Golden Horde against the Ilkhans from the 1260s; the Ilkhans sought alliances with the papacy and the kings of France and England, which produced embassies but no joint campaign.
  - The Mamluk conquest of the crusader states in 1265–1291 and of Cilician Armenia in 1375 are told as separate stories.
