  - title: Ain Jalut
    date: July – December 1260
    when: "1260-09-03"
    borders: "1260-12"
    countries: [il, sy, ps, eg]
    body:
      - Qutuz marched from Egypt in July 1260 with the Mamluk army and refugees from Syria, perhaps 15,000 to 20,000 men. His vanguard under Baybars drove a Mongol outpost out of Gaza. The Franks of Acre, who distrusted the Mongols, especially after Kitbuqa sacked Sidon that summer, allowed the Mamluks to pass through their territory and buy supplies. Kitbuqa came south from the Bekaa valley with his army and Syrian auxiliaries, and the two armies met at the spring of Ain Jalut, in the Jezreel valley, on 3 September 1260.
      - The battle lasted much of the day. The Mongols broke the Mamluk left, but Qutuz rallied his men, and the Mamluks, perhaps helped by the desertion of the Ayyubid contingent of Homs from the Mongol side, gained the upper hand. Kitbuqa was killed and his army broke; the survivors were pursued past Baysan and cut down. Within weeks the Mongols evacuated Damascus and Aleppo. On his way back to Egypt Qutuz was murdered by a group of emirs led by Baybars, who became sultan. A Mongol force that returned to Syria was defeated near Homs on 10 December 1260 by the Ayyubid princes of Homs and Hama.
      - Ain Jalut was the first defeat of a Mongol army that the Mongols never managed to avenge, and it is often seen as the end of their expansion to the south-west. Hülegü was drawn into the war with Berke of the Golden Horde in the Caucasus, and the Mamluks were left in control of Syria up to the Euphrates.
    facts:
      - [Battle of Ain Jalut, "3 September 1260, Mamluk victory"]
      - [Armies, "each perhaps 10,000–20,000; Mamluk numbers probably larger"]
      - [First battle of Homs, "10 December 1260, Ayyubid victory"]
