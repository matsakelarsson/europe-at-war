id: toluid-civil-war
name: Toluid civil war
start: "1260-05-05"
end: "1264-08-21"
tier: B
summary: "The war of succession between two grandsons of Genghis Khan, the brothers Kublai and Ariq Böke, sons of Tolui, after the death of the Great Khan Möngke at the siege of Diaoyu in Sichuan in August 1259. Ariq Böke, left in charge at Karakorum, had the backing of most of Möngke’s family and court; Kublai, who commanded the armies in China, had himself elected Great Khan at Kaiping (later Shangdu) on 5 May 1260, and Ariq Böke was proclaimed at Karakorum a month later. Kublai’s generals won Gansu and the Hexi Corridor, and his blockade of grain from China starved Mongolia. Ariq Böke lost Karakorum twice, was beaten at Shimultai in 1261 and then fought Alghu, the Chagatayid khan he had installed, who had changed sides; his harsh rule in the Ili valley and famine cost him his followers, and on 21 August 1264 he surrendered to Kublai at Shangdu. The war left Kublai master of China and Mongolia, but the khans of the Golden Horde, the Chagatai lands and the house of Ögedei never fully accepted him, and the Mongol Empire was never again ruled as one."
