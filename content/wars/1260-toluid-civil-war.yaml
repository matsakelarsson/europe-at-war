  - title: Shimultai, Almaliq and the surrender
    date: 1261 – August 1264
    when: "1262"
    borders: "1264-08-21"
    countries: [mn, cn, kz]
    body:
      - In 1261 Ariq Böke returned and retook Karakorum. Kublai’s army defeated him at Shimultai, and ten days later a second battle near the Khingan mountains, without Kublai, ended in a stalemate. A rebellion in Shandong, led by the Chinese commander Li Tan, then drew Kublai back to China in 1262. Ariq Böke turned west against Alghu, the grandson of Chagatai whom he had made khan of the Chagatai lands and who had gone over to Kublai, seizing the goods and animals collected for Ariq Böke’s army.
      - Alghu defeated Ariq Böke’s vanguard near the Ili, but Ariq Böke took his headquarters at Almaliq and wintered there in 1262–1263. His troops’ killing of Alghu’s men and the famine that followed in the Ili valley drove many of his princes and soldiers to desert him, and Alghu came back. With no grain, no allies left within reach and his following melting away, Ariq Böke rode to Shangdu and surrendered to his brother on 21 August 1264. Kublai had his chief supporters executed and kept Ariq Böke under guard; he died in 1266, and rumours said he had been poisoned.
      - Kublai had won, but he was never accepted as Great Khan by all the Mongols. Berke and Hülegü had spent the war fighting each other in the Caucasus, the house of Ögedei under Kaidu refused to come to his court, and from 1268 Kaidu waged a war against him that lasted beyond his death. Kublai ruled from China, and in 1271 named his dynasty Yuan.
    facts:
      - [Battle of Shimultai, "1261, Kublai’s victory"]
      - [Ariq Böke takes Almaliq, "1262"]
      - [Ariq Böke surrenders at Shangdu, "21 August 1264"]
      - [Ariq Böke dies, "1266"]
