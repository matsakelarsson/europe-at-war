notes:
  - "Both brothers claimed to be the lawful Great Khan, each elected by a kurultai of his own supporters. Kublai’s was held outside Mongolia and attended mainly by the princes and commanders of the east; Ariq Böke’s was held in the homeland and had the support of most of Möngke’s family and of the Golden Horde. Kublai’s victory decided the matter, and the Chinese and Persian histories, written under his descendants and allies, tell the story from his side."
  - "The places of the battles of 1261 in Mongolia, Shimultai and the battle near the Khingan, are not known closely and have no markers."
