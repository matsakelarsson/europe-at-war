steps:
  - title: Two Great Khans
    date: August 1259 – winter 1260
    when: "1260-05-05"
    borders: "1260-06"
    countries: [cn, mn]
    body:
      - The Great Khan Möngke died on 11 August 1259 during the siege of the Song fortress of Diaoyu, near Chongqing. His brother Kublai, besieging Ezhou (Wuchang) on the Yangtze, learned that their youngest brother Ariq Böke, regent in Karakorum, was raising troops and calling an assembly. Kublai agreed a truce with the Song and hurried north. On 5 May 1260 a kurultai of his supporters at his summer capital Kaiping, mostly princes and commanders from northern China and Manchuria, elected him Great Khan; about a month later a kurultai at Karakorum proclaimed Ariq Böke, who had the support of most of Möngke’s family and of the khan of the Golden Horde, Berke. Their brother Hülegü, in Iran, sided with Kublai.
      - The war was decided by supplies. Mongolia depended on grain and goods from China, and Kublai cut them off. In Gansu and the Hexi Corridor his cousin Kadan defeated and killed Ariq Böke’s general Alandar, and the official Lian Xixian defeated Liu Taiping and drove Ariq Böke’s supporters from Liangzhou and Ganzhou, securing Sichuan and the north-west. In the autumn Kublai’s army advanced on Karakorum, and Ariq Böke withdrew north-west to the upper Yenisei, the land of the Kyrgyz, for the winter.
    facts:
      - [Möngke dies, "11 August 1259, at Diaoyu"]
      - [Kublai elected at Kaiping, "5 May 1260"]
      - [Ariq Böke proclaimed at Karakorum, "about a month later"]
