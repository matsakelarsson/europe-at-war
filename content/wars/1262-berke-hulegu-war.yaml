steps:
  - title: Shirvan, Derbent and the Terek
    date: 1262 – January 1263
    when: "1263-01-13"
    borders: "1263-01"
    countries: [az, ru]
    body:
      - Berke had converted to Islam before he became khan in 1257, and Rashid al-Din has him protest that Hülegü had “sacked all the cities of the Muslims”. The causes of the war were also material. Several Jochid princes serving in Hülegü’s army died suspiciously in 1259–1260, Hülegü kept the rich pastures of Azerbaijan and the shares of Iranian revenues that the Jochids claimed, and when the Great Khan Möngke died in 1259 Hülegü backed Kublai while Berke backed Ariq Böke. Berke opened contacts with the Mamluk sultan Baybars, the Ilkhans’ enemy in Syria.
      - Early in 1262 Berke sent his kinsman Nogai with a vanguard of perhaps 30,000 men through the pass of Derbent into Shirvan. In mid-October they beat Hülegü’s vanguard near Shamakhi, but on 15 November the Ilkhanid general Abatai defeated them near Shabaran. Hülegü pressed on, stormed Derbent on 7 December, beat Berke’s army beyond the town and Nogai again on 15 December, and crossed the frozen Terek to plunder the Golden Horde camps. On 13 January 1263 Berke’s main army fell on the scattered Ilkhanid troops on the Terek and, after a battle that lasted all day, routed them. As they fled back across the river the ice broke under them and many drowned. Hülegü withdrew to Azerbaijan and Berke to Derbent.
    facts:
      - [Battle near Shabaran, "15 November 1262, Ilkhanid victory"]
      - [Derbent stormed, "7 December 1262"]
      - [Battle on the Terek, "13 January 1263, Golden Horde victory"]
