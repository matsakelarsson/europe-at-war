  - title: The Aksu and the Kura
    date: 1265–1266
    when: "1265-07"
    borders: "1266"
    countries: [az, ge]
    body:
      - Hülegü died on 8 February 1265, and his son Abaqa succeeded him in June. About a month later Nogai came through Derbent again with a large army. Abaqa’s brother Yoshmut met him on the Aksu river north of Shamakhi, and in a hard-fought battle Nogai was wounded in the eye by an arrow and his army driven back.
      - Berke himself then arrived with the main army of the Golden Horde. Abaqa withdrew behind the Kura, destroyed the bridges and fortified the south bank, and for fourteen days the two armies faced each other across the river, exchanging arrows. Berke marched up the river towards Tbilisi to find a crossing, but fell ill and died on the way, probably in 1266. His army dispersed and carried his body back to Sarai. Abaqa had a long line of fortifications built along the Kura, and the frontier between the two khanates stayed there; the Golden Horde invaded again under later khans, and its claim to Azerbaijan led to wars until 1357.
    facts:
      - [Death of Hülegü, "8 February 1265"]
      - [Battle of the Aksu, "1265, Ilkhanid victory"]
      - [Death of Berke, "1266, on the march towards Tbilisi"]
