id: berke-hulegu-war
name: Berke–Hülegü war
start: "1262"
end: "1266"
tier: B
summary: The first open war between two khanates of the Mongol Empire, fought in the eastern Caucasus between Berke, khan of the Golden Horde, and his cousin Hülegü, founder of the Ilkhanate in Iran. Berke, a convert to Islam, resented the sack of Baghdad, the deaths of Jochid princes in Hülegü’s service and Hülegü’s seizure of Azerbaijan and its pastures, which the Jochids claimed; the two also backed rival candidates in the succession war for the title of Great Khan. In 1262 Berke’s general Nogai crossed the Derbent pass into Shirvan. Hülegü drove him back and took Derbent, but his army was routed on the Terek in January 1263, many drowning when the river ice broke. After Hülegü’s death in 1265 Nogai invaded again and was beaten on the Aksu; Berke died while trying to cross the Kura in 1266. The Derbent–Kura frontier between the two khanates remained a war zone for decades, and Berke’s alliance with the Mamluks of Egypt lasted.
countries: [az, ru, ge]
sides:
  - id: ilk
    name: Ilkhanate
    polities: [ilkhanate]
    ink: orange
    moves: Ilkhanid moves
    success: Ilkhanid success
  - id: gh
