id: li-tan-rebellion
name: Li Tan’s rebellion
start: "1262-02-22"
end: "1262-08-06"
tier: C
summary: "A rising in Shandong against Kublai Khan while he was fighting his brother Ariq Böke for the throne. Li Tan, son of the Shandong warlord Li Quan, had governed Yidu (Qingzhou) for the Mongols for some thirty years as a hereditary lord, commanding the coast and the border with the Song; his father-in-law Wang Wentong was one of Kublai’s chief ministers. After recovering his son, who had been held at the Mongol court, Li Tan rose on 22 February 1262, killed the Mongol troops in his territory and handed Lianshui, Haizhou and Donghai on the Huai frontier to the Song, which made him a military governor. He then seized Jinan. Kublai sent Prince Qabichi and the Chinese generals Shi Tianze, Shi Shu and Zhang Hongfan against him; Song relief troops turned back, though the Song general Xia Gui took a number of towns along the border. From about May Jinan was ringed with walls and ditches and starved. When it fell in early August, Li Tan tried to drown himself in Daming Lake, was pulled out and was executed on 6 August 1262, beheaded according to most accounts or trampled by horses according to others. Wang Wentong was executed for corresponding with him. The revolt left Kublai distrustful of the Chinese lords of the north: he separated civil from military authority, ended many of their hereditary commands and relied more on Mongol and Central Asian officials."
