id: scottish-norwegian-war
name: Scottish–Norwegian War
start: "1262"
end: "1266-07-02"
tier: C
summary: A war between Scotland and Norway over the Hebrides and the Isle of Man, Norwegian since 1098. In 1263 King Haakon IV sailed with more than 120 ships to defend the isles, but the clash at Largs on 2 October was indecisive and Haakon died in Orkney that winter. By the Treaty of Perth in 1266 Norway sold the Hebrides and Man to Scotland for 4,000 marks and an annual payment of 100 marks, while Scotland recognised Norwegian rule over Orkney and Shetland.
countries: ["no", gb]
sides:
  - id: nor
    name: Norway
    polities: [norway]
    ink: red
  - id: sco
    name: Scotland
    polities: [scotland]
    ink: navy
notes:
  - Largs is often remembered in Scotland as a great victory, but the Norwegian sources describe a skirmish fought by part of the army on the shore after storms drove ships aground; most historians see it as indecisive.
