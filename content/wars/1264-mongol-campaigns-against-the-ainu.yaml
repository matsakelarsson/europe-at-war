id: mongol-campaigns-against-the-ainu
name: Mongol campaigns against the Ainu
start: "1264"
end: "1308"
tier: C
summary: "An intermittent war on Sakhalin and the lower Amur between the Mongol Yuan dynasty and the Ainu. In 1263 the Mongols set up a post at Nurgan on the lower Amur and received the submission of the Nivkh (Gilyaks), who complained that they were attacked every year by the Guwei, the Ainu, who had been moving north from Hokkaido into southern Sakhalin. A Mongol force attacked the Ainu on Sakhalin in late 1264. Attempts to cross the Strait of Tartary failed in 1272–1273, and later expeditions crossed in winter, when the strait froze. Large campaigns followed in 1284–1286, with up to 10,000 men in a thousand small boats; a fort of continental type at Cape Crillon, at the southern tip of Sakhalin, may date from them. After the rebellion of Nayan in 1287 drew Mongol troops away, some Nivkh went over to the Ainu, and in 1297 an Ainu force under the chief Waying crossed to the mainland and raided the Amur estuary before it was defeated near Lake Kizi; it raided again in 1305. In 1308 Waying and another chief, Yushannu, offered submission through the Nivkh and promised a yearly tribute of furs at Nurgan, which became a trade in furs, silk and iron that linked the Amur with Hokkaido and Japan. Whether the campaigns had anything to do with Kublai’s invasions of Japan is doubted by most historians."
