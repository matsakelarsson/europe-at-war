notes:
  - The war is known only from Chinese records of the Yuan dynasty (the Yuanshi and the Jingshi dadian), which call the Ainu Guwei and the Nivkh Jilimi; there are no Ainu or Japanese accounts. Identifying the places named in them is uncertain.
