id: mudejar-revolt
name: Mudéjar Revolt of 1264–1266
start: "1264"
end: "1266"
tier: C
summary: A rising of the Muslims living under Castilian rule (Mudéjars) in Lower Andalusia and Murcia against Alfonso X, whose policy of removing them from towns and resettling Christians in their place had bred resentment. Encouraged and supplied by Muhammad I of Granada, with some North African volunteers, the rebels took Jerez in August 1264, then Arcos, Lebrija, Medina-Sidonia and the city of Murcia. Castile retook Jerez that autumn and invaded the Vega of Granada in 1265, while Alfonso’s father-in-law, James I of Aragon, besieged Murcia from January 1266; it surrendered on 31 January, and James handed it back to Castile. A rebellion of the Banu Ashqilula against Muhammad I forced Granada to make peace and pay a heavy tribute. The Muslims of the retaken towns were expelled and Christians settled in their place.
countries: [es]
