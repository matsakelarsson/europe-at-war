id: second-barons-war
name: Second Barons’ War
start: "1264"
end: "1267"
tier: C
summary: A civil war in England between Henry III and barons led by Simon de Montfort, earl of Leicester, who wanted to hold the king to the Provisions of Oxford of 1258, which put royal government under a baronial council. After Louis IX of France annulled the Provisions in the Mise of Amiens in January 1264, war broke out, and Montfort’s followers attacked the Jewish communities of London and other towns. On 14 May 1264 Montfort defeated and captured the king and his son Edward at Lewes, and ruled in the king’s name, summoning a parliament in January 1265 that included representatives of the towns. Edward escaped in May 1265 and on 4 August killed Montfort at Evesham, where his body was mutilated. Rebels held out at Kenilworth until December 1266 and in the Isle of Ely until 1267; the Dictum of Kenilworth let them buy back their lands, and the Treaty of Montgomery of September 1267 recognised Montfort’s ally Llywelyn ap Gruffudd as Prince of Wales.
