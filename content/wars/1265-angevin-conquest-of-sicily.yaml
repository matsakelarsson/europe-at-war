  - title: Tagliacozzo
    date: 1267–1269
    when: "1267"
    borders: "1268-10-29"
    countries: [it, de]
    body:
      - Charles’s rule and his French officials were soon resented, and the Ghibellines called on Conradin, Frederick II’s fifteen-year-old grandson and the last legitimate Hohenstaufen, to claim his inheritance. He crossed the Alps in the autumn of 1267 and was welcomed at Verona, Pavia and Pisa. Revolts broke out in the south. The Saracens of Lucera rose, and exiles landed in Sicily with troops from Tunis, where much of the island declared for Conradin. On 24 July 1268 he entered Rome in triumph, received by its senator, Henry of Castile, a Castilian prince who had fallen out with Charles.
      - On 23 August 1268 Conradin’s army met Charles’s smaller force on the Palentine plain near Tagliacozzo, in the Abruzzi. The Ghibellines routed Charles’s first lines and scattered to plunder his camp. Charles, who on the advice of the veteran crusader Érard de Valéry had kept a reserve hidden behind a hill, then fell on them and destroyed them. Conradin fled towards the coast and was betrayed and captured at Torre Astura. After a trial he was beheaded in the market square of Naples on 29 October 1268, with his friend Frederick of Baden. Lucera surrendered in August 1269, and the rising in Sicily was crushed with great cruelty; at Augusta the people were massacred.
    facts:
      - [Battle of Tagliacozzo, "23 August 1268, Angevin victory"]
      - [Execution of Conradin, "Naples, 29 October 1268"]
      - [Lucera surrenders, August 1269]
    markers:
      - kind: event
        side: hoh
        name: Verona
        date: October 1267
        text: Conradin waited here for three months, gathering money and allies among the Ghibelline cities of the north.
        lonlat: [10.99, 45.44]
      - kind: event
        side: hoh
        name: Rome
        date: 24 July 1268
        text: The city gave Conradin a lavish welcome while Clement IV, who had excommunicated him, sat in Viterbo.
        lonlat: [12.48, 41.89]
      - kind: battle
        side: ang
        name: Battle of Tagliacozzo
        date: 23 August 1268
        text: Fought near Scurcola Marsicana, a few kilometres from Tagliacozzo. Charles founded an abbey on the site in thanks for his victory.
        lonlat: [13.4, 42.03]
      - kind: event
        side: ang
        name: Torre Astura
        date: August 1268
        text: Conradin hoped to escape by sea, but the lord of the tower, Giovanni Frangipane, handed him over to Charles.
        lonlat: [12.76, 41.41]
