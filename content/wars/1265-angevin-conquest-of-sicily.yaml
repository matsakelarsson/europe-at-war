        date: 6 January 1266
        text: Five cardinals crowned Charles and his wife Beatrice, acting for Clement IV, who never came to Rome during his reign.
        lonlat: [12.45, 41.9]
      - kind: taken
        side: ang
        name: San Germano
        date: 10 February 1266
        text: The fortified town guarding the road into Campania fell to a rapid assault, opening the way south.
        lonlat: [13.83, 41.49]
      - kind: battle
        side: ang
        name: Battle of Benevento
        date: 26 February 1266
        text: Manfred’s body was found two days later. Buried by a bridge under a cairn of stones, it was later dug up on the pope’s orders and thrown out of the kingdom, as Dante tells in the Purgatorio.
        lonlat: [14.77, 41.13]
      - kind: taken
        side: ang
        name: Naples
        date: 7 March 1266
        text: Charles entered the city, which became the capital of the Angevin kingdom.
        lonlat: [14.25, 40.85]
