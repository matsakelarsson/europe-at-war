steps:
  - title: Benevento
    date: 1263–1266
    when: "1265-05"
    borders: "1266-03-07"
    countries: [it, fr]
    body:
      - The popes feared the Hohenstaufen hold on both the Empire and the Kingdom of Sicily. After Frederick II’s death his son Manfred, at first regent for his young nephew Conradin, took the Sicilian crown himself in 1258 and backed the Ghibellines across Italy. The French pope Urban IV offered the kingdom to Charles of Anjou, brother of Louis IX of France and Count of Provence, and his successor Clement IV confirmed the grant. Charles reached Rome by sea in May 1265, and on 6 January 1266 cardinals crowned him King of Sicily in St Peter’s, while his army, which had come over the Alps and through Lombardy that winter, joined him.
      - In February Charles crossed into the kingdom at Ceprano, where the bridge over the Liri had been left undefended, and stormed San Germano below Montecassino. Manfred chose to fight before more of his barons went over. On 26 February 1266, on the plain outside Benevento, his German knights and Saracen archers from Lucera at first drove back the French, but Charles’s men-at-arms, told to strike at the horses, broke the German cavalry, and many of Manfred’s barons left the field. Manfred rode into the fighting and was killed. Benevento was sacked, Manfred’s wife and children were imprisoned, and Charles entered Naples on 7 March.
    facts:
      - [Coronation of Charles, "Rome, 6 January 1266"]
      - [Battle of Benevento, "26 February 1266, Angevin victory; Manfred killed"]
    markers:
