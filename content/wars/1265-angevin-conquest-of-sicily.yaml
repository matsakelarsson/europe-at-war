id: angevin-conquest-of-sicily
name: Angevin conquest of the Kingdom of Sicily
start: "1265-05"
end: "1269-08"
tier: B
summary: The conquest of the Hohenstaufen Kingdom of Sicily by Charles of Anjou, brother of Louis IX of France, invited by the popes to take it from Frederick II’s heirs. Charles defeated and killed King Manfred at Benevento in 1266 and beat Manfred’s nephew Conradin at Tagliacozzo in 1268, after which Conradin was beheaded in Naples and the risings in his favour were crushed.
countries: [it, fr, de]
sides:
  - id: ang
    name: Charles of Anjou and the papacy
    polities: [provence, papal-states]
    ink: blue
    moves: Angevin moves
    success: Angevin success
  - id: hoh
    name: Manfred, Conradin and the Ghibellines
    polities: [sicily]
    ink: slate
    moves: Hohenstaufen moves
    success: Hohenstaufen success
notes:
  - The popes regarded the Kingdom of Sicily, which took in both the island and the mainland south of the Papal States, as a fief of the Holy See. Charles ruled the whole kingdom until the Sicilian Vespers of 1282; on the map it keeps its name, Kingdom of Sicily.
  - Charles was Count of Anjou and, through his wife Beatrice, Count of Provence. His army was largely French and Provençal, and was paid for with loans from Tuscan bankers guaranteed by the papacy and with church taxes raised as for a crusade.
