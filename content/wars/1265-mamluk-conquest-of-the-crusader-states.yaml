steps:
  - title: Baibars
    date: 1265–1271
    when: "1265-02"
    borders: "1268-05-18"
    countries: [il, lb, sy, tr]
    body:
      - After the Mamluks beat the Mongols at Ain Jalut in 1260, their commander Baibars murdered Sultan Qutuz and took the throne. Master of Egypt and Syria, he turned on the Frankish states, which were divided among themselves and had sometimes sided with the Mongols. In 1265 he took Caesarea and Arsuf, and in 1266 the Templar castle of Safed, whose garrison was killed after it had surrendered. In August 1266 his army crushed the Armenians of Cilicia at Mari, in the mountains north of Antioch, and sacked their towns.
      - In 1268 Baibars took Jaffa in March and the castle of Beaufort in April, then marched north. Antioch, whose prince Bohemond VI was away in Tripoli, fell on 18 May 1268 after a siege of a few days. Much of its population was killed or enslaved, and the great city, a Frankish principality for 170 years, never recovered. In 1271 Baibars took the Hospitaller castle of Krak des Chevaliers and the Teutonic Knights’ castle of Montfort, and the arrival of the Lord Edward of England that year brought only a truce.
    facts:
      - [Safed surrenders, July 1266]
      - [Antioch taken, 18 May 1268]
      - [Krak des Chevaliers taken, 8 April 1271]
    markers:
      - kind: taken
        side: ma
        name: Caesarea
        date: March 1265
        text: The town fell at once and the citadel after a week. Baibars had its walls demolished, as he did at most of the places he took.
        lonlat: [34.892, 32.5]
        lp: l
      - kind: taken
        side: ma
        name: Arsuf
        date: April 1265
        text: The Hospitaller garrison surrendered after a siege of some six weeks and was taken prisoner despite the terms.
        lonlat: [34.807, 32.195]
        lp: l
      - kind: taken
        side: ma
        name: Safed
        date: July 1266
        text: The Templar garrison surrendered on terms, but Baibars had the defenders executed on a hill near the castle.
        lonlat: [35.498, 32.966]
      - kind: battle
        side: ma
        name: Battle of Mari
        date: 24 August 1266
        text: A Mamluk army routed the Armenian forces in the Amanus mountains; one son of King Hethum I was killed and another captured.
        lonlat: [36.4, 36.55]
      - kind: taken
        side: ma
        name: Jaffa
        date: 7 March 1268
        text: The town surrendered after a short siege. Baibars let the garrison go to Acre.
        lonlat: [34.753, 32.052]
        lp: l
      - kind: taken
