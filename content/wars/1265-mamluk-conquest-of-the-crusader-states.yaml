        lonlat: [35.532, 33.324]
      - kind: taken
        side: ma
        name: Antioch
        date: 18 May 1268
        text: The city was stormed and sacked. Contemporaries wrote of tens of thousands killed or enslaved, and Baibars wrote to the absent Bohemond to describe the destruction.
        lonlat: [36.161, 36.203]
      - kind: taken
        side: ma
        name: Krak des Chevaliers
        date: 8 April 1271
        text: After a month of siege and mining, the Hospitallers in the inner castle surrendered and were allowed to leave for Tripoli.
        lonlat: [36.295, 34.757]
