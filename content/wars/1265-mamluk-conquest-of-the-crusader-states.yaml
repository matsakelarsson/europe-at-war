id: mamluk-conquest-of-the-crusader-states
name: Mamluk conquest of the crusader states
start: "1265-02"
end: "1291-08-14"
tier: B
summary: The campaigns in which the Mamluk sultans of Egypt and Syria, Baibars, Qalawun and al-Ashraf Khalil, conquered the remaining crusader states on the Syrian and Palestinian coast. Baibars took Caesarea, Arsuf, Safed, Jaffa and Antioch in 1265–1268 and Krak des Chevaliers in 1271; Qalawun took Tripoli in 1289; and the fall of Acre on 18 May 1291 was followed by the surrender of the last Frankish towns and castles on the mainland.
countries: [il, lb, sy, tr, cy, eg]
sides:
  - id: ma
    name: Mamluk Sultanate
    polities: [mamluk]
    ink: brown
    moves: Mamluk moves
    success: Mamluk success
  - id: cr
    name: Crusader states and military orders
    polities: [kingdom-of-jerusalem, antioch, tripoli-county, cyprus]
    ink: red
    moves: Frankish moves
    success: Frankish success
  - id: ar
    name: Armenian Kingdom of Cilicia
    polities: [cilician-armenia]
    ink: orange
    moves: Armenian moves
    success: Armenian success
notes:
  - Dates are Julian. The Mamluk campaigns are described in detail by Arabic historians, some of them eyewitnesses such as Abu’l-Fida, who fought at Acre; the main Frankish account of the fall of Acre is by an author known as the Templar of Tyre.
  - The Mamluks also fought the Mongols of the Ilkhanate, with whom the Franks and the Armenians of Cilicia sometimes allied; the threat of Mongol invasion explains much of the timing of the Mamluk campaigns. The crusades of Louis IX to Tunis (1270) and of the Lord Edward to Acre (1271–1272) have their own entries.
