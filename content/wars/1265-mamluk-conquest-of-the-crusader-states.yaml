  - title: Tripoli
    date: 1277–1289
    when: "1281"
    borders: "1289-04-26"
    countries: [sy, lb, tr]
    body:
      - Baibars died in 1277. His successor Qalawun beat a Mongol invasion at Homs in 1281 and renewed truces with the Franks while he dealt with his rivals, then resumed the conquest. He took the Hospitaller fortress of Margat in 1285 and Latakia, the last town of the old Principality of Antioch, in 1287. In Tripoli, after Bohemond VII died in 1287, the townspeople, the heiress Lucia and the Genoese fought over the government, and some of the Franks themselves urged Qalawun to intervene.
      - In March 1289 Qalawun besieged Tripoli with a large army and many siege engines. Reinforcements came from Cyprus and Acre, but the walls were breached, and on 26 April the city was stormed. Many of its people were killed or enslaved, and others escaped by ship to Cyprus. Qalawun had the city destroyed and a new Tripoli built a few kilometres inland, and the remaining towns of the county surrendered soon after.
    facts:
      - [Battle of Homs, "29 October 1281, Mamluk victory over the Mongols"]
      - [Margat taken, May 1285]
      - [Fall of Tripoli, 26 April 1289]
    markers:
      - kind: battle
        side: ma
        name: Battle of Homs
        date: 29 October 1281
        text: Qalawun beat an army of the Ilkhanate, with Armenian and Georgian allies, in a hard-fought battle that kept the Mongols out of Syria.
        lonlat: [36.709, 34.731]
      - kind: taken
        side: ma
        name: Margat
        date: May 1285
        text: The great Hospitaller castle surrendered when Mamluk miners brought down one of its towers.
        lonlat: [35.949, 35.151]
      - kind: taken
        side: ma
        name: Latakia
        date: April 1287
        text: The port surrendered after an earthquake had damaged its fortifications.
        lonlat: [35.778, 35.52]
      - kind: taken
        side: ma
        name: Tripoli
        date: 26 April 1289
        text: The city was taken by storm after a siege of a month. Its people fled to the harbour and the nearby island of St Thomas, where many were killed.
        lonlat: [35.834, 34.437]
    arrows:
      - side: ma
        label: Qalawun, 1289
        via: [[36.3, 33.52], [36.2, 34.0], [35.88, 34.42]]
  - title: Acre
    date: 1290–1291
    when: "1291-04-06"
    borders: "1291-08-14"
    countries: [il, lb, sy, cy]
    body:
      - In August 1290 newly arrived Italian crusaders killed Muslim merchants and peasants in Acre, and Qalawun prepared to punish the city. He died in November, but his son al-Ashraf Khalil brought a vast army from Egypt and Syria, with dozens of siege engines, before Acre on 6 April 1291. The city was held by the military orders, the Italian communes, troops of the kingdom and men sent from Cyprus by King Henry II, perhaps 15,000 in all. For six weeks the Mamluks bombarded and mined its double walls.
      - On 18 May the Mamluks broke through at the Accursed Tower and poured into the city. The Templar master William of Beaujeu was killed, thousands of townspeople crowded onto ships in the harbour, many drowned, and those left behind were killed or enslaved. The Templars held their fortress by the sea until 28 May, when it collapsed during the final assault. Tyre, Sidon, Beirut, Haifa, Tortosa and the Templar castle of Athlit were given up without a fight by mid-August. The crusader states on the mainland were at an end, though the Templars held the island of Ruad until 1302 and the Latin kingdom of Cyprus lived on.
    facts:
      - [Siege of Acre, "6 April – 18 May 1291"]
      - [Templar fortress falls, 28 May 1291]
      - [Athlit evacuated, 14 August 1291]
    markers:
      - kind: taken
        side: ma
        name: Acre
        date: 18 May 1291
        text: The capital of the kingdom since 1191 fell after a six-week siege. Al-Ashraf had it demolished so that the Franks could never use it again.
        lonlat: [35.082, 32.928]
        lp: l
      - kind: taken
        side: ma
        name: Tyre
        date: 19 May 1291
        text: The garrison abandoned the city, which had withstood Saladin in 1187, without a fight.
        lonlat: [35.196, 33.271]
        lp: l
      - kind: taken
        side: ma
        name: Sidon
        date: July 1291
        text: The Templars held out for a few weeks in the sea castle before leaving by ship for Tortosa and Cyprus.
        lonlat: [35.376, 33.561]
        lp: l
      - kind: taken
        side: ma
        name: Beirut
        date: 31 July 1291
        text: The town surrendered to a Mamluk army soon after Sidon was abandoned.
        lonlat: [35.506, 33.898]
        lp: l
      - kind: taken
        side: ma
        name: Athlit
        date: 14 August 1291
        text: The Templars evacuated their great coastal castle, Château Pèlerin, the last Frankish stronghold on the mainland of Palestine.
        lonlat: [34.934, 32.705]
        lp: l
      - kind: held
        side: cr
        name: Ruad
        date: 1291–1302
        text: The Templars kept a garrison on this small island off Tortosa for eleven years before the Mamluks took it.
        lonlat: [35.86, 34.856]
        lp: l
