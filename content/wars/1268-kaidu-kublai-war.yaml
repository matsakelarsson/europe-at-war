notes:
  - "Kaidu is sometimes said to have aimed at the title of Great Khan, but he seems to have been concerned above all with restoring the inheritance of the house of Ögedei. The war was fought mostly by raids and short campaigns over vast distances, and many of its battles are known only by names that cannot be located; only the places that can be are marked."
  - "The Golden Horde supported Kaidu at times, and made peace with Kublai in 1284; the Ilkhanate was allied with the Yuan. Rashid al-Din and the Yuan history, the main sources, were written by the Ilkhanid and Yuan courts."
