  - title: Temür Khan and the battle of 1301
    date: 1294–1304
    when: "1301-09-03"
    borders: "1301-09"
    countries: [mn, cn, kz]
    body:
      - Kublai died in 1294 and was succeeded by his grandson Temür. Late in 1298 Du’a surprised the Yuan frontier army in Mongolia and captured Temür’s brother-in-law Körgüz (George), prince of the Christian Ongud, whom Du’a and Kaidu later put to death; another Yuan prince, Ananda, defeated Du’a in Gansu. Temür gave the command in Mongolia to his nephew Khaishan, and the armies clashed again in 1300.
      - In 1301 Kaidu and Du’a led a large army against Karakorum. On 3 September, at Mount Tiejiangu, Kaidu was defeated and wounded, and escaped pursuit by having campfires lit to deceive the enemy; a second battle, at Qaraqada, went better for him and Du’a, but Du’a was wounded and neither side won. Kaidu died soon afterwards, late in 1301. In 1303–1304 Du’a and Kaidu’s son Chapar made peace with Temür and recognised him as nominal overlord of all the Mongols. Du’a then turned on Chapar, and by 1310 the lands of the house of Ögedei had been divided between the Chagatai Khanate and the Yuan.
    facts:
      - [Kublai dies, "1294"]
      - [Körgüz captured, "late 1298"]
      - [Kaidu wounded at Mount Tiejiangu, "3 September 1301"]
      - [Kaidu dies, "late 1301"]
      - [Peace with the Yuan, "1303–1304"]
