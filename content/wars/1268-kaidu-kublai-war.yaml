id: kaidu-kublai-war
name: Kaidu–Kublai war
start: "1268"
end: "1304"
tier: B
summary: "The long war between Kaidu, a grandson of the Great Khan Ögedei, and Kublai Khan and his successor Temür, fought over the steppe and oases of Central Asia, the Uyghur lands and Mongolia. Kaidu, who held lands south-east of Lake Balkhash, never accepted Kublai’s victory over Ariq Böke. From 1268 he fought Kublai’s armies around Almaliq, won control of the Chagatai lands after the Chagatayid khan Baraq was defeated by the Ilkhan at Herat in 1270, and was recognised as ruler of the house of Ögedei in 1271. With the Chagatayid Du’a he raided the Uyghur kingdom of Qocho, took Beshbaliq from its Yuan garrison in 1286 and captured Karakorum in 1289, and he was allied with the Mongol princes of Manchuria in Nayan’s rebellion of 1287. Kublai held Mongolia and China but slowly gave up the Tarim oases. After Kublai’s death in 1294 the war went on under Temür Khan; in 1301 Kaidu was wounded in battle with the Yuan army under Khaishan and died soon after. Du’a and Kaidu’s son Chapar made peace with the Yuan in 1303–1304, recognising the Yuan emperor as nominal overlord."
countries: [cn, mn, kz, kg]
sides:
