  - title: The princes’ revolt and the loss of the west
    date: 1276–1293
    when: "1289"
    borders: "1289"
    countries: [cn, mn, kz]
    body:
      - In 1276 (1277 in some accounts) princes in Nomukhan’s army, led by Möngke’s son Shiregi, rebelled at Almaliq, seized Nomukhan and the Yuan general Antong, and handed the prince to the Golden Horde and Antong to Kaidu. The rebels took Karakorum in 1277 before Kublai’s armies, under Bayan, drove them back west of the Altai; their alliance fell apart in quarrels, and the last of them submitted in 1282. Kaidu took Almaliq. Kublai built up a garrison and military farms at Beshbaliq and Khotan, linked them to China by post stations and imposed Yuan laws and paper money on the Uyghur lands, but Kaidu and Du’a raided them again and again and took Beshbaliq in 1286.
      - In 1287 Kaidu agreed to join Nayan, a descendant of Genghis Khan’s brothers who led the princes of Manchuria in revolt; Kublai crushed Nayan before the allies could meet. In 1288–1289 the Yuan began pulling back from Kashgar, Khotan and Beshbaliq towards China. Kaidu then struck into north-western Mongolia, defeated Kublai’s grandson Kammala, and in 1289 took Karakorum. He withdrew when Kublai, at 74, led an army north in person. Bayan commanded in Mongolia until 1293 and held it; in 1293 Kipchak troops under Tutugh took the lands of Kaidu’s allies on the upper Yenisei and Ob.
    facts:
