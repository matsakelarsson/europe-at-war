steps:
  - title: Kaidu and the western khanates
    date: 1264–1276
    when: "1268"
    borders: "1271-09"
    countries: [kz, kg, cn]
    body:
      - Kaidu, a posthumous son of Ögedei’s son Kashin, had held Qayaliq, south-east of Lake Balkhash, since 1252. He supported Ariq Böke in the civil war and ignored Kublai’s summons to his court in 1264. In 1266 Kublai sent a Chagatayid prince, Baraq, to take the Chagatai throne and keep Kaidu in check, but Baraq soon turned against Kublai too. In 1268 Kublai’s forces defeated Kaidu near Almaliq, and Kaidu regrouped around Talas; with troops sent by Möngke-Temür of the Golden Horde he then defeated Baraq on the Syr Darya.
      - In the spring of 1269 the three made peace at an assembly on the Talas and divided the revenues of the oasis cities of Transoxiana among them. When Baraq invaded the Ilkhanate he was routed at Herat on 22 July 1270, and he died in 1271. In the late summer of 1271, at another assembly on the Talas, Kaidu was invested as ruler of the house of Ögedei, and the Chagatayid princes submitted to him. Kublai, who named his own dynasty Yuan that year, sent his son Nomukhan with an army to Almaliq to hold the Ili valley. In 1275 Kaidu and Baraq’s son Du’a invaded the lands of the Uyghur idiqut, a Yuan vassal, and called on him to submit; the idiqut held out in Qocho until a Yuan relief force arrived.
    facts:
      - [Kaidu defeated near Almaliq, "1268"]
      - [Peace of Talas, "spring 1269"]
      - [Kaidu head of the house of Ögedei, "1271"]
      - [Qocho threatened, "1275"]
