id: battle-of-herat-1270
name: Battle of Herat (1270)
start: "1270"
end: "1270-07-22"
tier: C
summary: A war between two Mongol khanates over Khorasan. Baraq, khan of the Chagatai ulus in Central Asia, had been forced by his rival Kaidu to share the revenues of Transoxiana, and in 1270, with Kaidu’s encouragement, he invaded the Ilkhanate’s eastern province instead. He beat Abaqa’s brother Tübshin near Herat and at Maruchaq, sacked Nishapur and made the Kartid ruler of Herat, Shams al-Din, pay tribute, but the princes Kaidu had sent with him soon deserted. The Ilkhan Abaqa marched east from Azerbaijan in late April, keeping his presence secret, and on 22 July 1270 met Baraq on the plain near Herat. After a hard fight in which Baraq’s men broke the Ilkhanid left wing, Abaqa’s counter-attacks won the day; Baraq was thrown from his horse and fled to Bukhara. His army broke up, Kaidu took over the Chagatai lands, and Baraq died in 1271. Abaqa’s troops raided across the Oxus and burned Bukhara in 1273, but the river remained the frontier between the Ilkhanate and the Chagatai lands.
