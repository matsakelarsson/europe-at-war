id: eighth-crusade
name: Eighth Crusade
start: "1270-07-01"
end: "1270-11"
tier: C
summary: The second crusade of Louis IX of France, which was diverted to Tunis, perhaps in the hope of converting its Hafsid ruler, of gaining a base against Mamluk Egypt, or at the urging of Louis’s brother Charles of Anjou, king of Sicily. The army landed near the ruins of Carthage in July 1270 and was struck by disease, and Louis died in his camp on 25 August. Charles arrived the same day, and after some fighting the crusaders made a treaty with the emir Muhammad al-Mustansir, who paid an indemnity and tribute, and sailed home in November.
