steps:
  - title: From Ganghwa to Jindo
    date: "1270"
    when: "1270-06"
    borders: "1270-12"
    countries: [kr]
    body:
      - The Sambyeolcho (“three elite patrols”) had been the main fighting force of the military rulers during the Mongol wars. In the fifth month of 1270 the last military ruler was killed and the court moved back from Ganghwa to Kaegyong; when it ordered the Sambyeolcho disbanded and their rolls seized, the soldiers feared they would be handed over to the Mongols. In the sixth month Bae Jung-son and No Yeong-hui rebelled on Ganghwa, proclaimed Wang On, the Marquis of Seunghwa, king, and set up their own government. With more than 1,000 ships carrying officials, soldiers, families and the stores of the island, they sailed south to Jindo, off the south-western tip of the peninsula.
      - On Jindo they built the fortress of Yongjang, with a palace in the grounds of a temple. From there they controlled the islands and coasts of the south-west, seized tax grain bound for Kaegyong and raided the coasts of Jeolla and Gyeongsang. A first attack by Kim Bang-gyeong and the Mongol commander Ahai failed, and in the eleventh month of 1270 a Sambyeolcho force took Jeju from its Goryeo garrison. They also sent a letter to Japan seeking help against the Mongols.
    facts:
      - [Rebellion on Ganghwa, "sixth month of 1270"]
      - [Ships taken south, "more than 1,000"]
      - [Jeju taken, "eleventh month of 1270"]
