    success: Goryeo and Yuan success
notes:
  - Dates are lunar months from the Goryeosa. The Sambyeolcho were the Left and Right Night Patrols and the Sinuigun, a unit of men who had escaped from Mongol captivity.
  - Twentieth-century Korean historians often presented the Sambyeolcho as patriots resisting foreign rule; others stress that they were the private soldiers of the military regime, defending its power against the king.
