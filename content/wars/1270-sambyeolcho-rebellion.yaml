  - title: Jeju
    date: 1271–1273
    when: "1273-04"
    borders: "1273-06"
    countries: [kr]
    body:
      - On Jeju Kim Tong-jeong built the earth-walled fortress of Hangpaduri, near today’s Aewol, and raided the coasts of the peninsula as far as Gyeonggi, seizing tax ships. Kublai, who needed Jeju and Goryeo’s shipyards for his planned invasion of Japan, ordered an end to the rebellion. In the fourth month of 1273 a force of 12,000 Goryeo, Mongol and Chinese troops under Kim Bang-gyeong and Hindu landed at Hamdeok and took Hangpaduri. Kim Tong-jeong fled into the Halla mountains, where he was later found dead.
      - The Yuan put Jeju, then called Tamna, under its own administration and set up horse ranches there, and kept it until 1294. A year after Jeju fell, Goryeo and Yuan forces sailed from Korea for the first invasion of Japan.
    facts:
      - [Jeju taken, "fourth month of 1273"]
      - [Allied force, "12,000"]
      - [Yuan rule on Jeju, "1273–1294"]
