id: sambyeolcho-rebellion
name: Sambyeolcho rebellion
start: "1270-06"
end: "1273-04"
tier: B
summary: "The last resistance to the peace between Goryeo and the Mongols, led by the Sambyeolcho, the elite units that had served Goryeo’s military rulers. When the court moved back from Ganghwa Island to Kaegyong in 1270 and ordered the units disbanded, their commander Bae Jung-son rebelled, made a royal relative, Wang On, king, and sailed south with more than 1,000 ships to the island of Jindo. From the fortress of Yongjang there the Sambyeolcho controlled the south-western coasts and islands and raided the provinces, and they took Jeju. In the fifth month of 1271 a Goryeo and Mongol army stormed Jindo; Wang On and Bae Jung-son were killed and more than 10,000 people were carried off. Kim Tong-jeong carried on the fight from Jeju until a force of 12,000 Goryeo, Mongol and Chinese troops took the island in 1273. Jeju then came under direct Yuan rule until 1294, and the way was clear for the Mongol invasions of Japan."
countries: [kr]
