  - title: The fall of Jindo
    date: "1271"
    when: "1271-05"
    borders: "1271-06"
    countries: [kr]
    body:
      - In the fifth month of 1271 a Goryeo and Mongol army under Kim Bang-gyeong and the Mongol commanders Hindu and Hong Da-gu attacked Jindo in three columns. The main force landed at Byeokpajin, at the island’s north-eastern tip, while the others came ashore further along the coast. Yongjang fell. Wang On was caught and killed by Hong Da-gu, and Bae Jung-son died in the fighting, by tradition at Namdo fortress in the south-west of the island.
      - More than 10,000 people, Sambyeolcho soldiers, their families and islanders, were captured and carried off. Kim Tong-jeong escaped with the survivors to Jeju.
    facts:
