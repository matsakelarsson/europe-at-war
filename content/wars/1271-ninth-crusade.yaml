id: ninth-crusade
name: Ninth Crusade
start: "1271-05-09"
end: "1272-09"
tier: C
summary: The expedition of the Lord Edward, heir to the English throne and later Edward I, who reached Acre in May 1271 with about a thousand men after his uncle Louis IX died at Tunis. He raided Mamluk territory and tried to work with the Mongol Ilkhan Abaqa, whose horsemen raided around Aleppo, but could not stop Sultan Baibars, and in May 1272 the Kingdom of Jerusalem made a ten-year truce with him at Caesarea. Edward survived an assassin’s poisoned dagger in June 1272 and sailed home that September, learning on the way that his father had died.
