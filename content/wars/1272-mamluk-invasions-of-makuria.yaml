  - title: A Muslim king at Dongola
    date: 1311–1317
    when: "1317-05-29"
    borders: "1317-05-29"
    countries: [sd, eg]
    body:
      - In 1311 Kudanbes killed his brother King Ayay and took the throne. Sultan al-Nasir Muhammad backed another member of the royal house, Abdallah Barshambu, who had lived at the Mamluk court and had become a Muslim. A Mamluk army put him on the throne in 1316, the first Muslim king of Makuria. On 29 May 1317, by the date of its foundation inscription, the upper hall of the royal palace at Dongola was consecrated as a mosque. The building still stands at Old Dongola.
      - Barshambu was unpopular and was killed within the year by Kanz al-Dawla, the chief of the Banu Kanz, an Arabised family of Aswan related to the Nubian royal house through the female line. The sultan sent Kudanbes back with an army in 1323, but Kanz al-Dawla retook the throne when the Mamluks left and was recognised as a tributary. A Christian king, Siti, ruled again in about 1330, and the record of the following decades is fragmentary. With the central power gone, Arab Bedouin groups such as the Juhayna moved south past the cataracts, Islam spread along the Nile, and the kings withdrew to Lower Nubia, where a small Christian kingdom, Dotawo, is last attested in 1463.
    facts:
      - [Barshambu installed, "1316"]
      - [Throne hall becomes a mosque, "29 May 1317"]
      - [Last known Nubian Christian king, "Joel of Dotawo, 1463"]
    markers:
      - kind: event
        side: mam
        name: Throne hall of Dongola
        date: 29 May 1317
        text: The two-storey palace of the Makurian kings, consecrated as a mosque under Abdallah Barshambu. It served as a mosque until 1969.
        lonlat: [30.743, 18.223]
        lp: l
