id: mamluk-invasions-of-makuria
name: Mamluk invasions of Makuria
start: "1272"
end: "1317"
tier: B
summary: "A series of wars in which the Mamluk sultans of Egypt broke the Christian Nubian kingdom of Makuria and made it a vassal. For six centuries a treaty, the baqt, had kept the peace between Egypt and Makuria. In 1272 King David of Makuria raided the Red Sea port of Aidhab and later Aswan; in 1276 Sultan Baybars answered with an army that defeated the Nubians at Dongola, sacked the capital and put David’s rival Shakanda on the throne as a tributary. Under Qalawun the Mamluks sent at least two more expeditions (1287 and 1289 in the usual dating) against King Semamun, and the land between the Second Cataract and Dongola was laid waste. In 1316 Sultan al-Nasir Muhammad installed a Muslim Nubian prince, Abdallah Barshambu, and on 29 May 1317 the throne hall of Dongola was consecrated as a mosque. Christian kings reappeared after him, but Makuria never recovered; Arab Bedouin moved south along the Nile, and by the 15th century only a small kingdom remained in Lower Nubia."
countries: [sd, eg]
sides:
  - id: mam
    name: Mamluk Sultanate and its Nubian clients
    polities: [mamluk]
    ink: brown
