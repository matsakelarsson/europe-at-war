notes:
  - "Almost everything known about these wars comes from Mamluk chroniclers writing in Cairo (Ibn Abd al-Zahir, al-Nuwayri, Baybars al-Mansuri, later al-Maqrizi), who wrote from the sultans’ side and often contradict each other on the order of the later expeditions and on who replaced whom on the Nubian throne. Nubian sources are a few inscriptions and documents; archaeology at Old Dongola confirms heavy destruction in the late 13th century."
  - Names of Nubian kings are given in the forms of the English literature, which takes them from Arabic (Shakanda is also written Mashkouda or Shekenda, Semamun as Simamon or Shamamun, Barshambu as Barshanbu, Kudanbes as Kerenbes).
