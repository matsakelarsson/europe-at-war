  - title: Qalawun and King Semamun
    date: 1286–1290
    when: "1287"
    borders: "1289-06-01"
    countries: [sd, eg]
    body:
      - Shakanda was soon murdered, and the Mamluk grip slackened while Baybars’s successors fought among themselves. By 1286 a new king, Semamun, ruled at Dongola and had stopped the tribute. Sultan Qalawun sent an army under Izz al-Din al-Kurani in 1287, which fought its way up the Nile to Dongola; Semamun withdrew to the far south, a nephew was made king in his place, and a Mamluk garrison stayed at Dongola. When the army left, Semamun returned, drove out the garrison and took back his throne.
      - A second expedition, usually dated 1289, again reached Dongola and again failed to hold Semamun, who in the end sent tribute and was left in peace. The chroniclers disagree on the sequence of these campaigns. Al-Nuwayri describes the land between the island of Meinarti at the Second Cataract and Dongola as laid waste, and excavations at Old Dongola show burned and abandoned quarters from these decades. The raids also carried off large numbers of Nubians as slaves.
    facts:
      - [Mamluk expeditions, "1287 and 1289 (usual dating)"]
      - [Mamluk commander in 1287, "Izz al-Din al-Kurani"]
    markers:
