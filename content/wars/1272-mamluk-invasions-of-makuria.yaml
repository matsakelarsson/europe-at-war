steps:
  - title: Aidhab, Aswan and the fall of Dongola
    date: 1272–1276
    when: "1276"
    borders: "1276-06-04"
    countries: [sd, eg]
    body:
      - Since the Arab conquest of Egypt, Egypt and the Christian kingdom of Makuria, with its capital at Dongola on the middle Nile, had lived under the baqt, a treaty under which Nubia sent slaves each year and received grain, cloth and wine in return. Makuria had united with the northern kingdom of Nobadia and was at its height in the 10th and 11th centuries. The Mamluks, the slave soldiers who took power in Cairo in 1250, were a more aggressive neighbour than the Fatimids or the Ayyubids. King David of Makuria, who had seized the throne in about 1268, stopped meeting the baqt and in 1272 raided Aidhab, the Red Sea port through which pilgrims and spices passed between Egypt and Arabia. Sultan Baybars, busy against the crusaders and the Mongols, sent only a punitive raid into Lower Nubia.
      - After a Nubian raid on Aswan in 1275, Baybars prepared a real campaign. A large army under the emirs Aqsunqur al-Farikani and Aybak al-Afram left Cairo in January 1276, with a pretender from the royal family, Shakanda, at its side. It took the fortresses of Lower Nubia, defeated the Nubian army before Dongola and sacked the capital; Arab writers say about 10,000 prisoners were taken. David fled south to the kingdom of al-Abwab, whose king handed him over to the Mamluks, and he was imprisoned in Cairo. On 4 June 1276 Shakanda was crowned as Baybars’s vassal. He swore to pay tribute, gave up the northern province of al-Maris to direct Mamluk rule, and agreed that his Christian subjects would pay the poll tax due from non-Muslims under Muslim rule.
    facts:
      - [Raid on Aidhab, "1272"]
      - [Raid on Aswan, "1275"]
      - [Mamluk army leaves Cairo, "January 1276"]
      - [Shakanda crowned as a vassal, "4 June 1276"]
