  - title: Hakata Bay, 1274
    date: 19–20 November 1274
    when: "1274-11-19"
    borders: "1274"
    countries: [jp]
    body:
      - "Warriors from all over Kyushu gathered at Hakata under Shōni Kagesuke and the Ōtomo. On 19 November 1274 the main Yuan force landed at Momochibara, west of Hakata, and other units at points round the bay, and took the higher ground at Akasaka. The Kyushu warriors, says the shrine history Hachiman gudōkun, were thrown into confusion by the invaders’ close formations, drums and gongs and the exploding iron bombs called tetsuhau, though modern historians think the contrast between Mongol mass tactics and Japanese single combat has been overdrawn. Takezaki Suenaga, a minor warrior of Higo who later had his deeds painted in the Mōko shūrai ekotoba, rode against the enemy with five men and was saved only by the arrival of another band."
      - "By nightfall the invaders had driven the defenders off the shore and burned Hakata and the Hakozaki shrine, and the Japanese fell back to Mizuki, the earthwork barrier built before the Dazaifu six centuries earlier. But the Yuan general Liu Fuheng had been wounded by an arrow, and the commanders, fearing a night attack and Japanese reinforcements, took their troops back on board. The next morning the fleet was gone. The Yuanshi and the Goryeosa say that a great storm wrecked many ships on the way back, and a Korean source says that 13,500 men did not return; Japanese courtiers heard that a wind had driven the enemy away."
    facts:
      - [Landing in Hakata Bay, "19 November 1274"]
      - [Forces in the battle, "perhaps 3,000 on each side (Conlan) to 4,000–6,000 Japanese"]
      - [Yuan losses on the expedition, "about 13,500 who did not return (Korean figure)"]
