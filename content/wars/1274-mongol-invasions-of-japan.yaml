  - title: Tsushima and Iki
    date: November 1274
    when: "1274-11-13"
    borders: "1274"
    countries: [jp, kr]
    body:
      - "The first invasion fleet, built in Goryeo in a few months at Korean expense, numbered about 900 ships: 300 large ships, 300 fast landing boats and 300 small water boats. It carried about 15,000 Mongol, Chinese and Jurchen soldiers under the Mongol commander Qudun (Hudun) and his deputies Hong Dagu and Liu Fuheng, 6,000–8,000 Korean soldiers under Kim Bang-gyeong, and about 7,000 Korean sailors. It sailed from Happo, today’s Masan, on 2 November 1274."
      - "Two days later the invaders landed on Tsushima at Komoda beach near Sasuura. The deputy governor, Sō Sukekuni, met them with about 80 horsemen and was killed with all his men, and the invaders burned Sasuura and spread over the island. On 13 November they landed on Iki, where the deputy governor Taira no Kagetaka fought with about 100 horsemen, was driven back to his fort and killed himself with his family the next day. Japanese accounts tell of islanders killed and women and children carried off, and on their return the Yuan commander presented 200 Japanese boys and girls to the Goryeo king and his Mongol queen. The fleet then raided the Matsuura coast of Hizen, where the local warrior bands lost hundreds of men."
    facts:
