  - title: Takashima and the typhoon
    date: July–August 1281
    when: "1281-08-16"
    borders: "1281"
    countries: [jp, cn, kr]
    body:
      - "The Southern Route army, made up largely of former Song soldiers under Fan Wenhu and said to number 100,000 men in 3,500 ships, sailed from the Ningbo region in June, after its first commander fell ill and died. Its first ships reached Hirado in July, and by the end of the month the two fleets had joined off the island of Takashima in Imari Bay, from where they planned to march on the Dazaifu. Many of the southern ships were river boats and merchant vessels poorly suited to the open sea. Japanese warriors kept up raids on the anchorage."
      - "On the night of 15–16 August 1281 a typhoon struck the fleet crowded at anchor. Ships smashed into one another and sank; according to a Chinese survivor, Fan Wenhu and other commanders took the soundest ships and sailed away, abandoning their men. The Japanese attacked the ships that remained and on 22 August stormed Takashima, where the stranded soldiers had dug in. The Yuanshi says that the Japanese took 20,000–30,000 prisoners to Hakata and killed the Mongols, Koreans and northern Chinese among them, sparing the southern Chinese, whom they made slaves. The Goryeosa records that 7,592 of the 26,989 Koreans did not return; Chinese and Mongol sources suggest losses of 60 to 90 per cent for the whole force."
      - "Kublai planned a third invasion but abandoned it in 1286, when wars in Vietnam and Central Asia took priority. In Japan the temples and shrines claimed the credit for the storms, and the idea of the kamikaze took root. The coastal guard continued until the fall of the shogunate, and because a defensive war yielded no land with which to reward the warriors, many were left in debt and resentment that weakened Hōjō rule in the decades before 1333."
    facts:
      - [Southern Route army (Yuanshi), "100,000 men, 3,500 ships"]
      - [Typhoon, "night of 15–16 August 1281"]
      - [Attack on Takashima, "22 August 1281"]
      - [Prisoners, "20,000–30,000, most killed"]
      - [Korean losses, "7,592 of 26,989 did not return"]
