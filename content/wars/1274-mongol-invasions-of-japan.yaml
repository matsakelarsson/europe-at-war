steps:
  - title: Kublai’s letters
    date: 1266–1273
    when: "1268"
    borders: "1273"
    countries: [jp, kr, cn]
    body:
      - "Goryeo had submitted to the Mongols in 1259 after nearly thirty years of invasions, and its kings became Kublai’s vassals and in-laws. In 1266 Kublai, who had made himself emperor and was waging war on the Song dynasty in southern China, sent envoys to Japan through Goryeo. A storm turned the first mission back, but in 1268 a Goryeo envoy delivered Kublai’s letter at the Dazaifu. Addressed from “the Emperor of the Great Mongols” to “the King of Japan”, it invited Japan to enter friendly relations and ended by asking who would want to resort to arms. Japan sent no answer, and the seventeen-year-old Hōjō Tokimune (eighteen by Japanese count) became regent the same year. When further Mongol letters came in 1269–1270, the court in Kyoto drafted a reply, but the shogunate, which took them as demands for submission, refused to send it."
      - "Five more missions followed until 1273, and all went home without an answer. Kublai’s plans were delayed by the war against Song and by the Sambyeolcho, Goryeo soldiers who rebelled against their king’s surrender to the Mongols and held out on the islands of Jindo and Jeju until 1273; their envoys asked Japan for help in 1271. The shogunate ordered its vassals with lands in Kyushu to go there and organised a rota of guard duty on the coast of northern Kyushu, which was to last for sixty years."
    facts:
      - [Yuan and Goryeo embassies, "six missions, 1266–1273"]
      - [Kublai’s letter reaches the Dazaifu, "1268"]
      - [Hōjō Tokimune becomes regent, "1268, aged 17"]
      - [End of the Sambyeolcho rebellion, "1273"]
