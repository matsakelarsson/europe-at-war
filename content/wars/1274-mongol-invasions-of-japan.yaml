id: mongol-invasions-of-japan
name: Mongol invasions of Japan
start: "1274-11-02"
end: "1281-08-22"
tier: A
summary: "The two attempts by Kublai Khan, the Mongol emperor of the Yuan dynasty, to conquer Japan, with armies drawn from Mongols, Chinese, Jurchens and Koreans and ships and sailors levied from Goryeo and southern China. After the Kamakura shogunate, led by the young regent Hōjō Tokimune, ignored six embassies between 1266 and 1273, a fleet of some 900 ships sailed from Korea in November 1274, overran Tsushima and Iki and landed in Hakata Bay on 19 November. The invaders drove the Kyushu warriors inland and burned Hakata, but withdrew to their ships the same night, and many ships were wrecked by a storm on the way home. The shogunate executed Kublai’s next envoys and built a stone wall around Hakata Bay. In 1281, after the conquest of Song China, Kublai sent two fleets, an Eastern Route army from Korea and a much larger Southern Route army from China; Yuan records give 140,000 men, a figure modern historians think greatly inflated. The Eastern Route army could not get past the wall and was harried at sea and on the islands of Shika and Iki for weeks. When the two fleets had joined off Takashima in Imari Bay, a typhoon on the night of 15–16 August 1281 destroyed most of the ships, and the Japanese killed or captured the men left stranded on the island. The storms became the kamikaze, the “divine wind” sent by the gods to protect Japan, while the cost of the defence, which brought no conquered land to reward its warriors, weakened the shogunate."
countries: [jp, kr, cn]
sides:
  - id: yuan
    name: Yuan dynasty and Goryeo
    polities: [yuan, goryeo]
    ink: blue
    moves: Yuan moves
    success: Yuan success
  - id: jp
    name: Japan (Kamakura shogunate)
    polities: [japan, kamakura-shogunate]
    ink: red
    moves: Japanese moves
    success: Japanese success
notes:
  - "The size of both invasion forces is uncertain. The figures here for 1274 are those most often given; for 1281 the Yuanshi gives 40,000 men in the Eastern Route army and 100,000 in the Southern, which Thomas Conlan thinks exaggerated by an order of magnitude and Morris Rossabi by about half. Nothing reliable is known of the size of the Japanese forces. Whether the storm of 1274 struck the fleet in Hakata Bay or on its way home is debated; it came in late November, outside the typhoon season."
  - "The main sources are the Yuanshi and the Goryeosa, Japanese court diaries, the shrine history Hachiman gudōkun, and the illustrated scrolls Mōko shūrai ekotoba commissioned by the Kyushu warrior Takezaki Suenaga. Day dates are the Julian equivalents of the Japanese lunar dates; by the Japanese calendar the typhoon struck on the night of the 30th day of the seventh month of Kōan 4."
  - Wrecks of the Yuan fleet have been found on the sea floor off Takashima since the 1980s and are protected as a national historic site.
