  - title: The wall and the envoys
    date: 1275–1280
    when: "1276"
    borders: "1276"
    countries: [jp]
    body:
      - "The shogunate expected the Mongols to return. In 1275 Kublai sent five envoys to demand Japan’s submission; Tokimune had them brought to Kamakura and beheaded at Tatsunokuchi, and when another mission arrived in 1279 its members were executed at Hakata. The shogunate also planned an expedition of its own against Goryeo in 1276, and ordered ships and crews raised across the west, but the plan was dropped."
      - "From the third month of 1276 the warriors of Kyushu built a stone wall about 20 kilometres long round the shore of Hakata Bay, from Imazu in the west to Kashii in the east, each province responsible for a stretch in proportion to its rice land. About two metres high, with a steep face towards the sea and a ramp behind for horsemen, it was backed by stakes driven into the beaches and river mouths. The shogunate tightened its control of Kyushu and the coastal guard and won the right to call up warriors who were not its vassals. In China the Song dynasty fell in 1279, and in 1280 Kublai set up an office to direct the invasion of Japan and ordered ships built in Korea and the south."
    facts:
      - [Yuan envoys beheaded, "1275 at Tatsunokuchi, 1279 at Hakata"]
      - [Stone wall around Hakata Bay, "begun 1276, about 20 km"]
      - [Fall of the Song dynasty, "1279"]
    markers:
