  - title: The Eastern Route army, 1281
    date: May–July 1281
    when: "1281-06-23"
    borders: "1281"
    countries: [jp, kr]
    body:
      - "Kublai’s orders for the second invasion came early in 1281. The Eastern Route army, of Mongol, northern Chinese and Korean troops under Hindu, Hong Dagu and Kim Bang-gyeong, sailed from Happo on 22 May in 900 ships; the Yuanshi gives it 40,000 men, and the Goryeosa counts 26,989 Korean soldiers and sailors among them. It was to meet the Southern Route army at Iki, but after taking Tsushima in early June and Iki in mid-June its commanders went on alone. Three hundred ships attacked the coast of Nagato, at the western tip of Honshu, and were driven off."
      - "The main fleet reached Hakata Bay in late June, found the shore lined with the wall and its defenders, and seized the island of Shika and the long sand spit linking it to the mainland as an anchorage. For a week the Japanese attacked it by land along the spit and by sea in small boats at night: Kusano Jirō boarded and burned a ship, Kawano Michiari of Iyo boarded another and killed its commander though wounded, and Takezaki Suenaga fought on the spit. After a week of defeats the Eastern Route army withdrew to Iki at the end of June, where disease killed some 3,000 of its men and the Japanese attacked it again in mid-July; it then moved to Hirado to meet the Southern Route fleet."
    facts:
      - [Eastern Route army sails, "22 May 1281, 900 ships"]
      - [Eastern Route army, "40,000 men (Yuanshi), including 26,989 Koreans (Goryeosa)"]
      - [Fighting around Shika island, "late June 1281"]
      - [Japanese attack on Iki, "mid-July 1281"]
