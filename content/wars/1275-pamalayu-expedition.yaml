id: pamalayu-expedition
name: Pamalayu expedition
start: "1275"
end: "1293"
tier: C
summary: "The expedition that King Kertanagara of Singhasari in eastern Java sent to Malayu (Melayu), the kingdom on the Batang Hari river in Sumatra that had taken over much of Srivijaya’s place in the Strait of Malacca and whose capital was then Dharmasraya. The Pararaton, a Javanese chronicle, dates the order to 1275 and calls it the pamalayu, “the Malayu affair”. How much fighting there was is unknown: Britannica describes envoys, while other historians date a military campaign to around 1290. In 1286 Kertanagara sent a statue of the bodhisattva Amoghapasa with fourteen attendant figures from Java to Dharmasraya, and the inscription on its base (the Padang Roco inscription) says that the people of Malayu, and above all their king Tribhuwanaraja Mauliwarmadewa, rejoiced at the gift; historians read it as a sign of Javanese overlordship or of an alliance between equals. Kertanagara’s aim was probably to control the trade of the strait and to build a bloc of island states against the Yuan, whose envoy he humiliated in 1289. With much of his army overseas, he was overthrown and killed by Jayakatwang of Kediri in 1292. The expedition, led according to Javanese poems by Mahisa Anabrang, came back in 1293, after Raden Wijaya and the Yuan army had defeated Jayakatwang, bringing two princesses of Malayu, Dara Petak and Dara Jingga. Dara Petak married Raden Wijaya, the founder of Majapahit, and was the mother of its second king, Jayanagara; Dara Jingga was the mother of Adityawarman, who later ruled Malayu and the Minangkabau highlands."
