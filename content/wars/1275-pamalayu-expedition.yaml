notes:
  - Almost everything known about the expedition comes from the Pararaton, written in its present form in the 15th and 16th centuries, from later Javanese poems such as the Kidung Panji Wijayakrama, and from the Padang Roco inscription of 1286. Batak and West Bornean traditions tell of leaders of the expedition who stayed behind and founded kingdoms of their own.
