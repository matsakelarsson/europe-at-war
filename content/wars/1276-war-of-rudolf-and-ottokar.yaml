notes:
  - Dates are Julian, as usual for the period. The war took place in the duchies of Austria, Styria and Carinthia and the March of Carniola, today divided between Austria and Slovenia; their medieval borders are shown only approximately.
  - Rudolf was king of the Romans, the elected German king, but was never crowned emperor.
