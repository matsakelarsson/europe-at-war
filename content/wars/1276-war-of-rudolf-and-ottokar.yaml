    name: Rudolf I
    polities: [hre]
    ink: gold
    moves: Moves by Rudolf and his German allies
    success: Success for Rudolf
  - id: hu
    name: Hungary
    polities: [hungary]
    ink: olive
    moves: Hungarian moves
    success: Hungarian success
  - id: cz
    name: Ottokar II
    polities: [bohemia]
    ink: purple
