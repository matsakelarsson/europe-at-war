id: war-of-rudolf-and-ottokar
name: War of Rudolf I and Ottokar II
start: "1276"
end: "1278-08-26"
tier: B
summary: The war in which Rudolf of Habsburg, elected king of the Romans in 1273, took Austria, Styria, Carinthia and Carniola from King Ottokar II of Bohemia. Ottokar submitted at Vienna in 1276, tried to win the lands back and was killed at the battle on the Marchfeld in 1278; the Habsburgs held Austria from then until 1918.
