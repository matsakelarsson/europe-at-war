steps:
  - title: The ban and the surrender at Vienna
    date: 1273–1276
    when: "1276"
    borders: "1276-11-21"
    countries: [at, cz, de, si]
    body:
      - Ottokar II, king of Bohemia since 1253, had built up the largest realm in the Empire. He took Austria in 1251, Styria after beating the Hungarians in 1260, the Egerland in 1266, and Carinthia and Carniola in 1269. When the electors chose Count Rudolf of Habsburg as king of the Romans in 1273, Ottokar refused to recognise him. A diet at Nuremberg in 1274 ordered all imperial lands taken since 1250 to be given back; Ottokar ignored the summons to answer for his, was placed under the imperial ban, and in June 1276 Rudolf declared war.
      - Rudolf won over Duke Henry XIII of Lower Bavaria, Ottokar’s ally, and marched down the Danube into Austria, where towns and nobles came over to him, while Count Meinhard II of Tyrol led a second army through Carinthia into Styria. In Bohemia the powerful Vítkovci clan rose against Ottokar. With Vienna under siege and his support crumbling, Ottokar gave in. On 21 November 1276 he renounced Austria, Styria, Carinthia, Carniola and the Egerland, and he received Bohemia and Moravia back from Rudolf as fiefs. His son Wenceslaus was betrothed to Rudolf’s daughter Judith.
    facts:
      - [Rudolf elected, "1 October 1273, at Frankfurt"]
      - [War declared, June 1276]
      - [Treaty of Vienna, 21 November 1276]
