  - title: The Marchfeld
    date: 1277–1278
    when: "1278"
    borders: "1278-08-26"
    countries: [at, cz, hu, sk, pl]
    body:
      - Ottokar soon quarrelled with Rudolf over how the treaty was carried out, and he found allies among the margraves of Brandenburg, the Polish and Silesian princes and, again, Henry XIII of Lower Bavaria. Rudolf won over the Viennese with new privileges and allied with the young King Ladislaus IV of Hungary. In the summer of 1278 Ottokar invaded Lower Austria and besieged Drosendorf and then Laa an der Thaya. Rudolf left Vienna and marched north-east into the Marchfeld, the plain along the river Morava, where Hungarian and Cuman horsemen joined him.
      - On 26 August the two armies, both almost entirely mounted, met between Dürnkrut and Jedenspeigen. Cuman horse archers harried Ottokar’s left, and the Hungarians drove it from the field; in the centre Rudolf, aged 60, was unhorsed and nearly killed. Around midday a reserve of heavy cavalry under Ulrich von Kapellen, hidden until then, struck Ottokar’s flank, and his army broke. Ottokar was killed in the rout. Rudolf held Moravia for five years, and Margrave Otto of Brandenburg became regent of Bohemia for the six-year-old Wenceslaus II. In 1282 Rudolf gave Austria and Styria to his sons.
    facts:
      - [Battle on the Marchfeld, "26 August 1278, victory for Rudolf and Ladislaus IV"]
      - [Ottokar II, Killed in the battle]
      - [Austria and Styria, "granted to Rudolf’s sons Albert and Rudolf, 1282"]
    markers:
