        name: Drosendorf
        date: Summer 1278
        text: Ottokar’s invasion of Lower Austria began with the siege of this border town.
        lonlat: [15.62, 48.87]
      - kind: held
        side: de
        name: Laa an der Thaya
        date: August 1278
        text: The town held out. Ottokar gave up the siege when he learned that Rudolf had marched into the Marchfeld.
        lonlat: [16.38, 48.72]
      - kind: battle
        side: de
        name: Battle on the Marchfeld
        date: 26 August 1278
        text: Also called the battle of Dürnkrut and Jedenspeigen. A hidden reserve decided the day; such an ambush was thought dishonourable, and its commander apologised to his men in advance.
        lonlat: [16.88, 48.48]
      - kind: event
        name: Vienna
        date: August 1278
        text: Rudolf had Ottokar’s body laid out in the Minorite church. It was taken to Prague only in 1297.
        lonlat: [16.37, 48.21]
