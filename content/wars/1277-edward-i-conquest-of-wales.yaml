steps:
  - title: The war of 1277 and the Treaty of Aberconwy
    date: 1276–1277
    when: "1276-11"
    borders: "1277-11-10"
    countries: [gb]
    body:
      - By the Treaty of Montgomery of 1267 Henry III recognised Llywelyn ap Gruffudd of Gwynedd as Prince of Wales and overlord of the other Welsh rulers. Relations with Henry’s son Edward I soon broke down. Llywelyn would not come to do homage, quarrelled with the marcher lords over the border, and objected that Edward sheltered his brother Dafydd and Gruffudd ap Gwenwynwyn of Powys, who had plotted against his life. When Llywelyn married Eleanor de Montfort, the daughter of Edward’s old enemy Simon, by proxy, Edward had her ship seized at sea on her way from France in 1275. In November 1276 he declared Llywelyn a rebel.
      - In 1277 royal armies advanced from Chester, Montgomery and Carmarthen, and the lords of Powys and Deheubarth submitted. In July Edward led the main army west from Chester along the coast, with hundreds of woodcutters clearing a road and new castles begun at Flint and Rhuddlan, while his fleet landed troops on Anglesey to take its harvest, the granary of Gwynedd. Facing a winter of hunger in the mountains, Llywelyn gave in. By the Treaty of Aberconwy in November he kept his title but only Gwynedd west of the Conwy; the land between the Conwy and the Dee went to Edward and to Dafydd, and the other Welsh lords became Edward’s vassals.
    facts:
      - [Llywelyn declared a rebel, "November 1276"]
      - [Treaty of Aberconwy, "November 1277"]
      - [Left to Llywelyn, "Anglesey and Gwynedd west of the Conwy"]
