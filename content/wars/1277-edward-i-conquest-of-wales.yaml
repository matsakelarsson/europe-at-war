        lonlat: [-3.972, 52.658]
      - kind: event
        side: eng
        name: Caernarfon
        date: From 1283
        text: Edward’s grandest castle, near the Roman fort of Segontium, with banded walls thought to echo those of Constantinople. His son, the future Edward II, was born there in 1284.
        lonlat: [-4.276, 53.139]
      - kind: event
        side: eng
