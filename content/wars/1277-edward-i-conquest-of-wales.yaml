  - title: Dafydd’s rising and the fall of Gwynedd
    date: 1282–1283
    when: "1282-03-22"
    borders: "1283-10-03"
    countries: [gb]
    body:
      - English officials and English law in the lands taken in 1277 caused bitter resentment, and Dafydd felt poorly rewarded for his help. On Palm Sunday, 22 March 1282, he attacked Hawarden castle and went on to besiege Rhuddlan; risings followed in Deheubarth and northern Powys, and Llywelyn joined the war. Edward advanced along the north coast once more and sent a force to Anglesey. On 6 November, while Archbishop Peckham of Canterbury was trying to make peace, Luke de Tany led a surprise attack across a bridge of boats over the Menai Strait and was routed at Moel-y-don; many of his knights drowned.
      - Llywelyn went south to raise mid-Wales, and on 11 December he was killed near Cilmeri, by Builth, apparently cut off from his army by English troops at Orewin Bridge. His head was sent to London and set up at the Tower. In January 1283 Edward pushed into Snowdonia and took Dolwyddelan, and Castell y Bere fell on 25 April. Dafydd, who had taken the title of prince, was captured in June and hanged, drawn and quartered at Shrewsbury on 3 October. By the Statute of Rhuddlan of 1284 the principality was annexed to the English crown and divided into shires, and Edward began great castles at Conwy, Caernarfon and Harlech to hold it.
    facts:
      - [Attack on Hawarden, "22 March 1282"]
      - [Death of Llywelyn, "11 December 1282, near Cilmeri"]
      - [Statute of Rhuddlan, "3 March 1284"]
    markers:
