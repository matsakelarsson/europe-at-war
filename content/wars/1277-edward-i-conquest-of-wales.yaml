        lonlat: [-4.154, 53.23]
        lp: l
      - kind: battle
        side: eng
        name: Cilmeri
        date: 11 December 1282
        text: Llywelyn, the last native Prince of Wales, was killed here. According to English accounts the soldier who struck him did not at first know who he was.
        lonlat: [-3.462, 52.152]
      - kind: taken
        side: eng
        name: Dolwyddelan
        date: January 1283
        text: The castle guarding the pass into the heart of Snowdonia fell to Edward’s winter campaign.
        lonlat: [-3.908, 53.053]
      - kind: taken
        side: eng
        name: Castell y Bere
        date: 25 April 1283
