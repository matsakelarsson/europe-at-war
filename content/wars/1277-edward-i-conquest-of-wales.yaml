id: edward-i-conquest-of-wales
name: Edward I’s conquest of Wales
start: "1276-11"
end: "1283-06"
tier: B
summary: The wars in which Edward I of England conquered the principality of Wales. In 1277 he forced Llywelyn ap Gruffudd, Prince of Wales, back into western Gwynedd; when Llywelyn and his brother Dafydd rose in 1282, Edward overran Snowdonia, Llywelyn was killed and Dafydd executed, and the Statute of Rhuddlan of 1284 annexed their lands to the English crown, held down by a ring of great castles.
countries: [gb]
sides:
  - id: eng
    name: England
    polities: [england]
    ink: red
    moves: English moves
    success: English success
  - id: wal
    name: Wales
    polities: [wales]
    ink: green
    moves: Welsh moves
    success: Welsh success
notes:
  - Much of Wales, notably the south and the border, was already held by Anglo-Norman marcher lords; the wars were fought over the principality that Llywelyn had built up and that Henry III had recognised in 1267.
  - The Welsh chronicle Brut y Tywysogion and English royal records are the main sources. The circumstances of Llywelyn’s death were told differently on each side and remain unclear.
