id: mongol-invasions-of-burma
name: Mongol invasions of Burma
start: "1277"
end: "1301-04-08"
tier: B
summary: "The wars between the Mongol Yuan dynasty, which had made the old Dali Kingdom its province of Yunnan, and the Pagan Kingdom of Burma. After King Narathihapate refused Kublai Khan’s demands for tribute, Mongol troops defeated a Burmese army at Ngasaunggyan on the frontier in 1277. In 1283–1285 a Mongol army took the forts of the upper Irrawaddy and Tagaung, and Narathihapate fled to Lower Burma. A treaty of 1287 accepted Mongol overlordship, but the king was murdered by one of his sons that July and a Mongol army marched south again; whether it reached Pagan is disputed. The Pagan empire broke apart, and power in central Burma passed to three brothers based at Myinsaing. When they deposed the king the Mongols had recognised, a Yuan army of about 12,000 besieged Myinsaing in 1301 but withdrew after the brothers paid it off, and in 1303 the Mongols left northern Burma."
countries: [mm, cn]
