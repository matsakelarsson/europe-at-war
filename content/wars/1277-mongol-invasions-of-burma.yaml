  - title: The fall of Pagan
    date: 1283–1287
    when: "1285"
    borders: "1287-07-02"
    countries: [mm, cn]
    body:
      - When Narathihapate again refused to send a submission mission, Kublai ordered the conquest of northern Burma. A Mongol army under Sangqudar set out on 22 September 1283, took Ngasaunggyan on 3 December after a siege of more than two months and Kaungsin six days later, and reached Tagaung on the Irrawaddy on 5 February 1284. It withdrew in the hot season, but on 26 January 1285 the Mongols took Tagaung again and defeated a Burmese army near Hanlin. Narathihapate fled down the river to Lower Burma, where his sons governed Bassein, Prome and Dala; Burmese tradition remembers him as Tayokpyemin, “the king who fled from the Chinese”.
      - Talks began late in 1285, and in March 1286 the two sides agreed that central Burma would become a Mongol province. A Burmese embassy led by the monk Shin Ditha Pamauk reached Beijing in January 1287; the treaty it made accepted Mongol overlordship and yearly tribute, and the emperor agreed to withdraw his troops. But on 1 July 1287, on his way back to Pagan, Narathihapate was seized and killed by his son Thihathu, the governor of Prome, and the treaty collapsed. A Mongol army under Prince Ye-sin Temür marched south that year. The chronicles say it took Pagan after losing 7,000 men; recent research suggests it was halted about 160 km north of the city and fell back to Tagaung.
      - Either way the empire of Pagan broke up. Wareru made Martaban independent in 1287, Arakan and the Shan chiefs of the hills went their own way, and the Mongols kept a province in the north, Zhengmian, with its base at Tagaung. Narathihapate’s son Kyawswa became king at Pagan in 1289 but ruled little beyond the capital.
    facts:
      - [Ngasaunggyan taken, "3 December 1283"]
      - [Tagaung taken, "5 February 1284, and again 26 January 1285"]
      - [Narathihapate murdered, "1 July 1287"]
