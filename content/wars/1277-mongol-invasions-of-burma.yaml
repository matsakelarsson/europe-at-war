steps:
  - title: Ngasaunggyan
    date: 1271–1278
    when: "1277"
    borders: "1277-06-01"
    countries: [mm, cn]
    body:
      - After conquering the Dali Kingdom in 1253–1254 the Mongols turned it into a base on the borders of Southeast Asia, and in 1274 made it the province of Yunnan. Kublai Khan’s envoys came to Pagan in January 1271 to ask for tribute; King Narathihapate sent them home without an audience. A second embassy arrived on 3 March 1273 with a letter demanding submission, which the king refused. The Burmese chronicles say that the envoys were put to death, but inscriptions and the Yuan records show that they were not. In 1275 the governor of Yunnan advised war, and Kublai allowed his commanders to secure the borderlands.
      - In 1277 a Burmese army with war elephants marched against the chief of Kaungai, a border state that had pledged allegiance to Kublai. At Ngasaunggyan, in about April, it met a smaller force of Mongol horsemen under Khudu. When the Mongols’ horses shied at the elephants, the riders dismounted (Marco Polo says they tied their horses in a wood) and shot at the animals on foot until the elephants stampeded back through their own lines; then they remounted and charged. Marco Polo, who heard of the battle in Yunnan, gave a famous account of it. Late in 1277 Nasr al-Din, son of the governor of Yunnan, raided the fort of Kaungsin with about 3,800 men but withdrew in the heat, and the Burmese rebuilt their frontier forts the next year.
    facts:
      - [Mongol envoys at Pagan, "January 1271 and March 1273"]
      - [Battle of Ngasaunggyan, "about April 1277, Mongol victory"]
