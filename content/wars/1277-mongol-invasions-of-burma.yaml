  - title: The siege of Myinsaing
    date: 1297–1303
    when: "1301"
    borders: "1301-02-01"
    countries: [mm, cn]
    body:
      - After 1287 the real power in central Burma lay with three brothers, Athinkhaya, Yazathingyan and Thihathu, commanders who had fought the Mongols and held the rice lands of Kyaukse from their base at Myinsaing. To secure his throne King Kyawswa sent his son to the Mongols at Tagaung in January 1297 and was recognised as a vassal of the Yuan emperor on 20 March 1297. On 17 December 1297 the brothers deposed him and made him a monk; on 10 May 1299 they had him executed. In 1300 Athinkhaya attacked the Mongol garrisons at Nga Singu and Male, north of today’s Mandalay.
      - On 22 June 1300 the Yuan emperor Temür declared Kyawswa’s son Kumara Kassapa the rightful king and sent an army from Yunnan, about 12,000 men in the Yuan records. It reached Myinsaing on 25 January 1301 and surrounded it, but could not break the walls. The brothers bribed the commanders, and on 6 April 1301 the besiegers began to withdraw. The Yuan court had the commanders executed but sent no new army, and on 4 April 1303 it abolished the province of Zhengmian and withdrew its garrison from Tagaung. Myinsaing became the kingdom of Pinya in 1313, and the brothers’ successors founded Ava.
    facts:
      - [Kyawswa deposed, "17 December 1297; executed 10 May 1299"]
      - [Siege of Myinsaing, "25 January – 6 April 1301"]
      - [Mongols leave Tagaung, "April 1303"]
