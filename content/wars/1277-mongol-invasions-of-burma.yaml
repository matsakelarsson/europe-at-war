notes:
  - The main sources are the Yuan History and other Chinese records, Marco Polo, contemporary Burmese inscriptions and the much later Burmese chronicles, which often disagree. Since the work of Than Tun and Michael Aung-Thwin most historians follow the inscriptions and the Chinese records against the chronicles, which say that the Mongol envoys were executed in 1273 and that the Mongols sacked Pagan in 1287.
  - The places of the frontier forts of Ngasaunggyan and Kaungsin, east of Bhamo, are not known exactly; the marker for Ngasaunggyan is approximate.
