notes:
  - Charles held Durazzo, Valona and other places on the Albanian coast, which he ruled as the Kingdom of Albania from 1272. By the Treaty of Viterbo of 1267 the exiled Latin emperor Baldwin II had promised him the overlordship of Achaea and a share of any reconquered lands.
  - The Sicilian Vespers, which Michael VIII’s diplomacy and money helped to encourage, are told under the War of the Sicilian Vespers.
