id: byzantine-angevin-war
name: Byzantine–Angevin war in Albania
start: "1280"
end: "1281"
tier: C
summary: The war in which Charles of Anjou, king of Sicily and heir by treaty to the claims of the Latin emperors, sent an army from his Albanian possessions to attack the restored Byzantine Empire. His troops under Hugh of Sully besieged the Byzantine fortress of Berat from 1280, but in the spring of 1281 a relief army under Michael Tarchaneiotes captured Sully in an ambush and routed his army, which fled to the coast. The Byzantines recovered much of inland Albania, and Charles’s plans for a larger expedition against Constantinople were ended by the Sicilian Vespers in 1282.
