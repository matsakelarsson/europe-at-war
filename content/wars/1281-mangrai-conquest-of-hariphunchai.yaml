id: mangrai-conquest-of-hariphunchai
name: Mangrai’s conquest of Hariphunchai
start: "1281"
end: "1296"
tier: C
summary: "The conquest of Hariphunchai, the old Mon kingdom of the Ping valley centred on today’s Lamphun, by Mangrai, the Tai ruler of Ngoenyang in the far north of Thailand, and the founding of Chiang Mai. Mangrai, who became king of Ngoenyang in 1259 and founded Chiang Rai as his capital in about 1262, extended his rule over the Tai principalities of the Kok valley and around Fang. To take Hariphunchai, the chronicles say, he sent a merchant, Ai Fa, as a spy; Ai Fa rose to be chief minister of King Yi Ba and spread discontent among the people. Mangrai’s army then took the city and Yi Ba fled south to Lampang. Some accounts date the fall to 1281, others to 1291 or 1292. In 1287 Mangrai made a pact of friendship with Ngam Mueang of Phayao and Ram Khamhaeng of Sukhothai, which kept the peace between the three Tai kings. After a first capital at Wiang Kum Kam, which flooded, he founded Chiang Mai, the “new city”, on the Ping in 1296, with the advice, the chronicles say, of his two allies. A later attack on Chiang Mai by Yi Ba’s son, the ruler of Lampang, was beaten by Mangrai’s son Khram, and Lampang came under Lan Na. Chiang Mai remained the capital of the kingdom of Lan Na until the Burmese conquest of 1558."
countries: [th]
