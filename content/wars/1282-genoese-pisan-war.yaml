notes:
  - Many prisoners stayed in Genoa for years. One of them, Rustichello da Pisa, later wrote down Marco Polo’s account of his travels while both were prisoners there.
  - Numbers of ships and of the dead and captured at Meloria come from the chroniclers and differ between sources.
