id: genoese-pisan-war
name: Genoese–Pisan War, 1282–1290
start: "1282"
end: "1290"
tier: C
summary: A war between the maritime republics of Genoa and Pisa for Corsica, Sardinia and the trade of the Tyrrhenian Sea, which began in 1282 when Pisa backed a Corsican lord’s revolt against Genoa. On 6 August 1284, off the islet of Meloria near Livorno, the Genoese fleet under Oberto Doria, with a second squadron under Benedetto Zaccaria, destroyed the Pisan fleet led by the podestà Albertino Morosini and Count Ugolino della Gherardesca; some 5,000 Pisans were killed and about 9,000 taken to Genoa, where many died in captivity. Florence, Lucca and other Guelph cities then joined the war against Pisa. Ugolino, who ruled Pisa after the battle, gave castles to Florence and Lucca to break up the alliance; overthrown in 1288, he was starved to death in a tower with his sons and grandsons, a story made famous by Dante. By 1290 Genoese raids had wrecked Porto Pisano, the city’s harbour, and Pisa never recovered its power at sea.
countries: [it, fr]
