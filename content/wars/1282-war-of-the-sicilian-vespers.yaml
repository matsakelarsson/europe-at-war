id: war-of-the-sicilian-vespers
name: War of the Sicilian Vespers
start: "1282-03-30"
end: "1302-08-31"
tier: A
summary: The war that followed the rising of the Sicilians against Charles of Anjou in 1282, when the island gave its crown to Peter III of Aragon. Aragonese and Sicilian fleets under Roger of Lauria won almost every battle at sea; when Aragon made peace in 1295, the Sicilians crowned Peter’s son Frederick and fought on against the Angevins, the papacy and Aragon itself, until the Peace of Caltabellotta in 1302 left Sicily to Frederick and split the old kingdom in two.
countries: [it, es, fr, mt, dz]
sides:
  - id: sic
    name: Sicily
    polities: [sicily]
    ink: red
    moves: Sicilian moves
    success: Sicilian success
  - id: ara
    name: Crown of Aragon
    polities: [aragon]
    ink: gold
    moves: Aragonese moves
    success: Aragonese success
  - id: ang
    name: Angevins, France and the papacy
    polities: [naples, france, papal-states]
    ink: blue
    moves: Angevin and allied moves
    success: Angevin and allied success
notes:
  - After 1282 both kingdoms still called themselves the Kingdom of Sicily. Historians call the island kingdom Sicily (or, after 1302, Trinacria) and the mainland kingdom Naples, as the map does.
  - Whether the rising was planned is disputed. Peter III and the Byzantine emperor Michael VIII, whom Charles was preparing to attack, had both been plotting against him, and later legend gave the leading role to the exile John of Procida.
  - The French crusade against Aragon in 1284–1285 has its own entry, the Aragonese Crusade. Frederick of Sicily is usually numbered Frederick III, though some historians call him Frederick II.
