id: war-of-the-limburg-succession
name: War of the Limburg Succession
start: "1283"
end: "1289"
tier: C
summary: A war for the Duchy of Limburg, between the Meuse and Aachen, after its heiress Ermengarde died childless in 1283. Her widower, Count Reginald I of Guelders, kept the duchy with the backing of the Archbishop of Cologne, Siegfried of Westerburg, and Count Henry VI of Luxembourg, while Duke John I of Brabant bought the rival claim of the Count of Berg and allied with Berg, Mark, Loon and the townspeople of Cologne. At Worringen, north of Cologne, on 5 June 1288 John won a large and bloody battle; Henry of Luxembourg and two of his brothers were killed, and both the archbishop and Reginald were captured. Limburg passed to Brabant, and the city of Cologne was freed from its archbishop’s rule.
countries: [de, be, nl, lu]
