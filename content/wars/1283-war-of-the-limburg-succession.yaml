notes:
  - The last duke, Waleran IV, died in 1279 or 1280; his daughter Ermengarde followed in 1283. Shortly before Worringen, Reginald of Guelders sold his own claim to Henry of Luxembourg.
  - After the battle Archbishop Siegfried was held for over a year at Schloss Burg by the Count of Berg, who gave Düsseldorf its town charter that August. The city of Cologne was formally recognised as a free imperial city only in 1475.
