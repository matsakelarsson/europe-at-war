id: aragonese-crusade
name: Aragonese Crusade
start: "1284"
end: "1285-10-05"
tier: B
summary: A crusade proclaimed by Pope Martin IV against Peter III of Aragon, who had taken Sicily from Charles of Anjou after the Sicilian Vespers of 1282. Philip III of France, allied with James II of Majorca, invaded Catalonia in 1285 to win Aragon for his son Charles of Valois and took Girona, but Roger of Lauria’s fleet destroyed the French at sea, disease ravaged the army, and the king died at Perpignan during the retreat. Peace with France and the pope came at Tarascon in 1291 and Anagni in 1295.
countries: [es, fr]
sides:
  - id: fr
    name: France and Majorca
    polities: [france, majorca]
    ink: navy
    moves: French moves
    success: French success
  - id: ara
    name: Crown of Aragon
    polities: [aragon]
    ink: orange
    moves: Aragonese and Catalan moves
    success: Aragonese success
notes:
  - The crusade was one front of the War of the Sicilian Vespers (1282–1302), which has its own entry.
  - The chronicles of Bernat Desclot and Ramon Muntaner, both Catalan, are the main narratives; they give the French army as well over 100,000 men, far more than it can have been. Dates are Julian.
