        side: ara
        name: Col de Panissars
        date: June 1285
        text: Peter’s troops blocked the old Roman road over the Pyrenees, so the French had to find another way.
        lonlat: [2.856, 42.456]
        lp: l
      - kind: taken
        side: fr
        name: Girona
        date: 7 September 1285
        text: The starving city surrendered after a siege of more than two months, the one real prize of the campaign.
        lonlat: [2.821, 41.984]
    arrows:
      - side: fr
        label: Philip III
        via: [[3.0, 43.18], [2.93, 42.72], [3.0, 42.47], [2.84, 42.03]]
  - title: Les Formigues and the retreat
    date: September–October 1285
    when: "1285-09-04"
    borders: "1285-10-05"
    countries: [es, fr]
    body:
      - Peter’s admiral, Roger of Lauria, brought his galleys back from Sicily. Early on 4 September, probably near the Formigues islets off the Catalan coast, he attacked a French and Genoese galley fleet and destroyed or captured much of it, and then swept the French supply ships from the coast. Without command of the sea the invaders could not feed an army that disease was already destroying. Philip III, himself ill, ordered a retreat.
      - Peter let the French king and his household pass through the mountains, but on 30 September and 1 October his troops fell on the rearguard and baggage at the Col de Panissars and slaughtered many of them. Philip died at Perpignan on 5 October, and Peter III on 11 November. His son Alfonso III punished James II of Majorca by taking Mallorca from him in 1285–1286 and conquered Muslim Menorca in 1287. The Treaty of Tarascon (1291) reconciled Aragon with the pope and France, and by the Treaty of Anagni (1295) Aragon gave up Sicily, which the Sicilians fought on to keep, and agreed to return the Balearics to James II.
    facts:
      - [Battle of Les Formigues, "4 September 1285, Aragonese victory"]
      - [Battle of the Col de Panissars, "30 September – 1 October 1285"]
      - [Death of Philip III, "5 October 1285, at Perpignan"]
    markers:
      - kind: naval
        side: ara
        name: Battle of Les Formigues
        date: 4 September 1285
        text: Lauria’s Catalan and Sicilian galleys surprised the French fleet at night. The chroniclers disagree on where it was fought, some placing it off Roses.
        lonlat: [3.183, 41.85]
      - kind: battle
        side: ara
        name: Battle of the Col de Panissars
        date: 30 September – 1 October 1285
        text: Almogàvers, Peter’s light infantry, attacked the retreating army in the pass and plundered its baggage.
        lonlat: [2.856, 42.456]
        lp: l
      - kind: event
        name: Perpignan
        date: 5 October 1285
        text: Philip III died here of the fever he had caught in Catalonia. He was buried at Narbonne and Saint-Denis.
        lonlat: [2.896, 42.699]
        lp: l
      - kind: taken
        side: ara
        name: Mallorca
        date: 1285–1286
        text: Alfonso III took the island from his uncle James II, who had sided with France. It was returned to James in 1298.
        lonlat: [2.65, 39.567]
