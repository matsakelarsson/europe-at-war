steps:
  - title: Elne and the siege of Girona
    date: 1284–1285
    when: "1284"
    borders: "1285-09-07"
    countries: [es, fr]
    body:
      - After the Sicilian Vespers of 1282, Peter III of Aragon took the crown of Sicily from Charles of Anjou, the brother of Saint Louis of France. Pope Martin IV, a Frenchman, excommunicated Peter and declared him deposed, and in 1284 Philip III of France accepted the crown of Aragon for his younger son, Charles of Valois. The pope proclaimed the war a crusade. Peter’s own brother, James II of Majorca, who held Roussillon and Montpellier as well as the Balearic Islands, sided with France. In the spring of 1285 Philip and Charles led a large army south into Roussillon.
      - On 25 May 1285 the crusaders stormed Elne, whose people had resisted them, burned the cathedral and massacred many of the inhabitants. Peter’s troops held the main pass over the Pyrenees, the Col de Panissars, but in June the French crossed by another pass farther east and descended on the Empordà. They besieged Girona from late June. Its garrison under Ramon Folc of Cardona held out through the summer while dysentery spread through the French camp, and the city surrendered only on 7 September, too late in the year to be of much use.
    facts:
      - [Sack of Elne, "25 May 1285"]
      - [Siege of Girona, "June – 7 September 1285"]
    markers:
      - kind: event
        side: fr
        name: Perpignan
        date: May 1285
        text: James II of Majorca received the French army in his mainland capital.
        lonlat: [2.896, 42.699]
        lp: l
      - kind: taken
        side: fr
        name: Elne
        date: 25 May 1285
        text: The town was defended by the illegitimate son of the last count of Roussillon. When it fell, the cathedral was burned and most of the people killed, despite the papal legates in the army.
        lonlat: [2.971, 42.6]
