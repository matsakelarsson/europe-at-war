id: drikung-rebellion
name: Drikung rebellion
start: "1285"
end: "1290"
tier: C
summary: "The revolt of the Drikung Kagyu school against the Sakya regime that governed Tibet for Kublai Khan. The monastery of Drikung Thil, north-east of Lhasa, founded in 1179, headed one of the myriarchies (tribute districts) of central Tibet and had been the strongest rival of Sakya before the Mongols made the Sakya lamas their regents. In 1285 Drikung forces attacked and destroyed the monastery of Jayül, killing its abbot, and the Drikung looked for help to the Mongol princes of Central Asia who were at war with Kublai; some sources name the Chagatai khan Du’a, an ally of Kaidu. In 1290 the Sakya ponchen (chief administrator) Aglen, with Mongol troops led by Kublai’s grandson Temür Buqa, defeated the Drikung and burned Drikung Thil; one account gives 10,000 dead. The monastery was rebuilt in the following decades with the help of the emperor and of Sakya, but Drikung lost its political influence for a long time, and Sakya rule lasted until the Phagmodrupa rose in the 1350s."
