id: nayan-rebellion
name: Nayan’s rebellion
start: "1287-05"
end: "1287-07"
tier: C
summary: "The rising of the Mongol princes of the eastern wing against Kublai Khan in Manchuria. Nayan, a descendant of one of Genghis Khan’s brothers, probably Temüge, held large appanage lands between the Khingan mountains and the Liao river. In the spring of 1287 he rose with Shiktür, of the line of Qasar, and Qadan, of the line of Qachiun, and was in contact with Kaidu, who had been at war with Kublai since the 1260s. Kublai, then 72, sent his general Bayan to hold Karakorum so that Kaidu could not join the rebels, and marched into Manchuria himself with Mongol and Chinese troops, supplied by ships that sailed to the mouth of the Liao. Around 16 July 1287 his army surprised Nayan’s camp, protected by a ring of wagons, and after a morning’s fighting the rebels broke. Kublai, who directed the battle from a palanquin carried by elephants, had Nayan executed at once without shedding his blood, by having him rolled in a carpet. Nayan was a Christian of the Church of the East, and Marco Polo says his standards bore the cross. After the victory Kublai reorganised Manchuria as the province of Liaoyang. Qadan and other rebels fought on against Yuan troops in Liaodong, among them those of Kublai’s grandson Temür, and in 1290–1291 Qadan invaded Goryeo until a Yuan and Korean army defeated him at Yeongi in May 1291."
