  - title: Wijaya turns on the Yuan
    date: May – November 1293
    when: "1293-05"
    borders: "1293-11-10"
    countries: [id, cn]
    body:
      - After Daha fell, Raden Wijaya asked to go back to Majapahit to prepare his tribute and a new letter of submission. Gao Xing distrusted him, but Shi Bi and Ike Mese let him go, and when Wijaya asked that the escort sent to collect the tribute and the promised princesses come unarmed, they sent two officers and 200 men without weapons. In May Wijaya’s forces killed the escort on the road, then fell on the Yuan camp and drove its men towards their ships. Shi Bi, cut off from the main force, had to fight his way across some 120 km of hostile country, losing much of the plunder taken at Daha.
      - With the monsoon about to change and no wish to wait six months on a hostile island, the Yuan commanders put Jayakatwang and his son to death and sailed for home. Javanese inscriptions and poems speak of a sea fight with Wijaya’s fleet and of Yuan ships destroyed or taken. The History of Yuan counts more than 3,000 of Shi Bi’s men lost; modern estimates of all Yuan losses run much higher, some to more than half of the army. The fleet reached China after 68 days, bringing back captives, gold, perfumes and textiles worth, it was claimed, more than 500,000 taels of silver. Shi Bi was flogged and fined for the failure and Gao Xing rewarded; Kublai’s plans for a new expedition were dropped at his death in 1294.
      - Wijaya was crowned at Majapahit on 10 November 1293 as Kertarajasa Jayawardhana, and married Kertanagara’s four daughters. The army of the Pamalayu came back from Sumatra in the same year, bringing two princesses of Malayu, and Arya Wiraraja was rewarded with lands in the east of Java. Majapahit became the strongest state of the archipelago, and the cannon the Yuan had brought helped to start the making of Javanese guns.
    facts:
      - [Yuan escort ambushed, "May 1293"]
      - [Yuan losses, "more than 3,000 (History of Yuan); modern estimates much higher"]
      - [Coronation of Kertarajasa, "10 November 1293"]
