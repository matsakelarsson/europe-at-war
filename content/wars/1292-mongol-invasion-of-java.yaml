  - title: The Yuan fleet and the fall of Daha
    date: January – April 1293
    when: "1293-03"
    borders: "1293-04"
    countries: [id, cn]
    body:
      - The Yuan fleet, by the History of Yuan’s count 20,000 to 30,000 men in 500 to 1,000 ships under Shi Bi, Ike Mese (Yighmish) and Gao Xing, sailed from Quanzhou in Fujian along the coasts of Đại Việt and Champa. Ports on the Malay Peninsula and Sumatra sent envoys and accepted Yuan officials, and the fleet gathered at the island of Gelam off Borneo, where Ike Mese went ahead with the emperor’s orders. In early 1293 it sailed by way of Karimunjawa to Tuban on the north coast of Java, which it seems to have plundered, and divided. One part went on by sea to the mouth of the Kali Mas, the other marched overland.
      - Raden Wijaya sent envoys to tell the Yuan commanders that Kertanagara was dead and that a usurper ruled in his place. He offered to submit to the emperor and promised tribute, and gave them a map of Jayakatwang’s kingdom. In March the Yuan forces assembled on the Kali Mas, where a Kediri minister had blocked the river with boats; he fled in the night, and more than a hundred large boats with demon heads at their bows were taken. When Kediri’s army attacked Wijaya at Majapahit from three directions, Gao Xing beat it back in a day of fighting.
      - The allies then advanced up the Brantas in three columns, by river and along both banks, with Wijaya’s men behind them. In April they reached Daha. Its defenders were beaten after a battle that lasted from morning to early afternoon; according to the History of Yuan, some thousands drowned trying to cross the river and 5,000 were killed. Jayakatwang surrendered to the Yuan with his family and officers, and Wijaya’s men freed the Singhasari princesses Jayakatwang had held. Kebo Mundarang was caught by Sora and executed.
    facts:
      - [Yuan army, "20,000–30,000 men, 500–1,000 ships"]
      - [Battle of Daha, "April 1293, Kediri defeated"]
      - [Jayakatwang, "surrendered and taken prisoner"]
