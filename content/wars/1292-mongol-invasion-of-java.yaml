steps:
  - title: Kertanagara’s defiance and Jayakatwang’s coup
    date: 1289–1292
    when: "1292"
    borders: "1292-06"
    countries: [id, cn]
    body:
      - Kertanagara, king of Singhasari in eastern Java from 1268, was the first Javanese ruler to build power overseas. He sent an expedition to Malayu in Sumatra (the Pamalayu), brought Bali under his rule in 1284 and made an alliance with Champa, apparently to hold the sea lanes against the Yuan, whose emperor Kublai Khan was demanding the submission of the states of Southeast Asia. In 1289 a Yuan envoy, Meng Qi, came to Java to demand tribute. Kertanagara had his face branded and sent him back, and in 1292 Kublai ordered a punitive expedition from Fujian, Jiangxi and Huguang.
      - With much of Singhasari’s army overseas, Jayakatwang, the vassal king of Kediri, a descendant of the old Kediri royal line, rose against his overlord, encouraged by Arya Wiraraja, a former minister of Kertanagara whom the king had sent away to govern Sumenep on Madura. A Kediri force attacked from the north and drew off the troops still at the capital, among them those of Kertanagara’s son-in-law Raden Wijaya. A second army under Kebo Mundarang came round the mountains from the south and took the capital, Kutaraja, by surprise. Kertanagara was killed in his palace with many of his court, in about May or June 1292, and Jayakatwang made himself king of Java, ruling from Daha.
      - Raden Wijaya failed to retake the capital and fled with a few companions, among them Rangga Lawe, Sora and Nambi, to Arya Wiraraja on Madura. Through Wiraraja’s mediation he submitted to Jayakatwang and was pardoned, and was allowed to clear land in the Tarik forest on the Brantas. The new settlement was named Majapahit, after the bitter maja fruit that grew there.
    facts:
      - [Yuan envoy humiliated, "1289"]
      - [Fall of Singhasari, "about May–June 1292"]
      - [Kertanagara’s successor, "Jayakatwang of Kediri"]
