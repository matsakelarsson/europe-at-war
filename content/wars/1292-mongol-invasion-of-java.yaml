notes:
  - The campaign is known from the History of Yuan, which dates events by the Chinese calendar, and from Javanese sources (the Pararaton, the Kidung Panji Wijayakrama and inscriptions such as Kudadu, 1294). English accounts convert the Chinese dates differently (the Yuan departure is given as 24 April or 31 May 1293), so the dates here are given by month. The History of Yuan gives the Javanese more than 100,000 men, a number modern historians think much too high.
  - Daha is today’s Kediri. Jayakatwang’s first seat, Gelang-gelang, was near today’s Madiun; the Yuan sources call his kingdom Kalang. The Kali Mas is the arm of the Brantas that reaches the sea at Surabaya, where the port of Hujung Galuh stood.
