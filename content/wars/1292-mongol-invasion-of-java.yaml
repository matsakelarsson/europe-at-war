id: mongol-invasion-of-java
name: Mongol invasion of Java
start: "1292"
end: "1293-11-10"
tier: B
summary: "The Yuan expedition that Kublai Khan sent to Java to punish King Kertanagara of Singhasari, who had refused to submit and had sent back the emperor’s envoy Meng Qi with his face branded. Before the fleet arrived, Kertanagara had been overthrown and killed in 1292 by Jayakatwang, the vassal king of Kediri, and his son-in-law Raden Wijaya had submitted to Jayakatwang and founded a settlement at Majapahit in the Tarik forest on the Brantas. When the Yuan army of 20,000 to 30,000 men landed at Tuban early in 1293, Wijaya offered his submission to the emperor and his help against Kediri. Together they defeated Jayakatwang’s fleet at the mouth of the Brantas, beat off his attack on Majapahit and in April took his capital, Daha, where he surrendered. Wijaya then turned on his allies: he ambushed a Yuan escort, attacked their camp and harried them back to their ships, and the Yuan army sailed home with heavy losses, killing Jayakatwang before it left. On 10 November 1293 Wijaya was crowned at Majapahit as Kertarajasa Jayawardhana, the first king of the empire that was to dominate the archipelago for two centuries. It was the last of Kublai Khan’s overseas expeditions."
