  - title: Viborg and the Treaty of Nöteborg
    date: 1293–1323
    when: "1293"
    borders: "1323"
    countries:
      - se
    view:
      center:
        - 27.424
        - 61.3134
      size:
        - 745
        - 592
    body:
      - In 1293 a Swedish army under the marshal Torgils Knutsson won part of western Karelia and built Viborg Castle on the site of a destroyed Karelian fort. In 1300 the Swedes went further, building a fortress called Landskrona where the Okhta meets the Neva, but Novgorod soon destroyed it.
      - Novgorod hit back hard. In 1318 its forces burned Turku and its cathedral, and a few years later they besieged Viborg and built the fortress of Oreshek, Nöteborg in Swedish, where the Neva leaves Lake Ladoga. There, on 12 August 1323, the two sides agreed on their first border, dividing Karelia between them. How far north the line ran is still debated.
    facts:
      - - Viborg Castle
        - Founded 1293
      - - Treaty of Nöteborg
        - 12 August 1323, the first Swedish–Novgorodian border
