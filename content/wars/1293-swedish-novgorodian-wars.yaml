  - title: King Magnus’s crusade
    date: 1348–1351
    when: "1348"
    borders: "1323"
    countries:
      - se
    view:
      center:
        - 28.3
        - 60.5787
      size:
        - 642
        - 481
    body:
      - In 1348 King Magnus Eriksson, encouraged by the visionary Bridget of Sweden, challenged Novgorod to a debate on religion and then attacked. He led his army up the Neva and took Nöteborg.
      - The Novgorodians won the fortress back in 1349 after a seven-month siege, and the Black Death, then spreading through the West, ended Magnus’s plans. The fighting petered out by 1351 with the old border unchanged.
    facts:
      - - Result
        - No change of border
      - - Nöteborg
        - Taken by the Swedes in 1348, retaken by Novgorod in 1349
