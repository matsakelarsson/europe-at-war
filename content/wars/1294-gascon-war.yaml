id: gascon-war
name: Gascon War
start: "1294-05-19"
end: "1303-05-20"
tier: C
summary: A war between Philip IV of France and Edward I of England over the Duchy of Aquitaine, which Edward held as Philip’s vassal. After years of clashes between Norman and Gascon and English sailors, Philip summoned Edward to his court; Edward’s brother Edmund agreed in secret to a token French occupation of the duchy’s strongholds, but the Parlement of Paris declared the fief forfeit on 19 May 1294, and French armies under Charles of Valois and Robert of Artois took most of Gascony, including Bordeaux. English expeditions held only Bayonne and a few other places, and Edward’s alliance with Count Guy of Flanders and German princes achieved little; the Flemings were beaten at Furnes in August 1297 and a truce followed that October. By the Treaty of Montreuil of 1299 Edward married Philip’s sister Margaret, and after the French defeat by the Flemings at Courtrai in 1302 the Treaty of Paris of 20 May 1303 gave Gascony back to Edward.
