id: war-of-curzola
name: War of Curzola
start: "1294"
end: "1299-05-25"
tier: C
summary: The second great war between Venice and Genoa, named after the sea battle off the Dalmatian island of Curzola (Korčula). After the fall of Acre in 1291 the two republics fought for the trade of the Levant and the Black Sea. The Genoese beat a Venetian fleet at Laiazzo (Ayas) in Cilician Armenia in 1294 and attacked the Venetians in Constantinople; Venetian fleets raided Genoese Pera and in 1296 took Caffa in the Crimea. In September 1298 the Genoese admiral Lamba Doria destroyed the Venetian fleet under Andrea Dandolo off Curzola, taking thousands of prisoners; Dandolo is said to have killed himself in captivity, and Marco Polo, by tradition captured in the war, dictated the story of his travels in a Genoese prison. Exhausted, the two republics made peace at Milan on 25 May 1299, through the mediation of Matteo Visconti, on terms that left neither side the clear winner.
