notes:
  - The Byzantine emperor Andronikos II, Genoa’s ally, arrested the surviving Venetians in Constantinople but soon came to terms with Venice. Accounts differ on whether Marco Polo was taken at Curzola, at Laiazzo or in a smaller clash.
