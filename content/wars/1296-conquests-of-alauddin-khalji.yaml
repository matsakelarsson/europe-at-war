steps:
  - title: The raid on Devagiri
    date: February – October 1296
    when: "1296-02-26"
    borders: "1296-03"
    countries: [in]
    body:
      - Alauddin, nephew and son-in-law of Sultan Jalal al-Din Khalji, was governor of Kara on the Ganges. In 1293 he had raided Bhilsa in Malwa, and there he heard of the wealth of the Yadava kingdom of Devagiri in the Deccan, which no army from Delhi had ever reached. On 26 February 1296 he left Kara with about 8,000 horsemen, saying he was going to Chanderi, crossed the Vindhyas, rested at Achalpur and forced the Lasura pass. The Yadava king Ramachandra, whose son Simhana was away with the main army, shut himself up in the hill fort, and the undefended lower town was plundered.
      - Ramachandra agreed to pay, but Simhana came back and attacked. Alauddin beat him, and the besieged found that the sacks in the fort’s stores held salt rather than grain. The Yadavas paid a far larger ransom, which Firishta, writing three centuries later, lists as 600 mann of gold, 1,000 mann of silver and quantities of pearls and jewels, and promised the revenues of Achalpur. It was the first time an army from the north had plundered the Deccan. With the treasure Alauddin raised an army, had his uncle murdered at Kara on 20 July 1296 and was crowned in Delhi on 21 October.
    facts:
      - [Left Kara, "26 February 1296, with about 8,000 horsemen"]
      - [Jalal al-Din murdered, "20 July 1296"]
      - [Alauddin crowned, "21 October 1296"]
