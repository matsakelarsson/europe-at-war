    name: Delhi Sultanate
    polities: [delhi-sultanate]
    ink: green
    moves: Delhi moves
    success: Delhi success
  - id: raj
    name: Kingdoms of Gujarat, Rajputana and Malwa
    polities: [chaulukyas, chahamanas, mewar, paramaras]
    ink: red
