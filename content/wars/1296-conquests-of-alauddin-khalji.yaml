        date: 1293 and 1296
        text: The Paramara town Alauddin had raided in 1293. In 1296 he passed this way, hiding his real goal.
        lonlat: [77.81, 23.52]
      - kind: event
        side: dl
        name: Achalpur
        date: March 1296
        text: Alauddin rested his men here for two days before crossing into the Yadava kingdom. Its revenues were promised to him in the peace.
        lonlat: [77.51, 21.26]
      - kind: taken
        side: dl
        name: Devagiri
        date: "1296"
        text: The lower town was plundered and the fort besieged. Ramachandra bought peace with an enormous ransom and a promise of tribute.
        lonlat: [75.215, 19.943]
      - kind: capital
        side: dl
        name: Delhi
        date: 21 October 1296
        text: Alauddin was crowned here, after winning over the nobles with gold from Devagiri.
        lonlat: [77.18, 28.52]
