notes:
  - "The main sources are the Persian works of Amir Khusrau, who wrote at Alauddin’s court and took part in some campaigns, of Barani and Isami a generation later, and of Firishta around 1600, with Jain chronicles, Rajput bardic tradition and inscriptions on the other side. The court writers celebrated the destruction of temples and the killing of Hindus as religious merit; their figures for booty and for the dead are often exaggerated, and some may have been miscopied (Khusrau’s 30,000 killed at Chittor may be 3,000)."
  - The story that Alauddin besieged Chittor to win its queen, Padmini, comes from the poem Padmavat by Malik Muhammad Jayasi, written in 1540. None of the early chroniclers mention her, and most historians regard the story as legend.
  - The Mongol invasions that Alauddin fought at the same time are told in the Mongol invasions of India; the later Tughluq conquest of Warangal (1323) is a war of its own.
