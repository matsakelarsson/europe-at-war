  - title: Dwarasamudra and Madurai
    date: November 1310 – October 1311
    when: "1311-02-26"
    borders: "1311-03"
    countries: [in]
    body:
      - On 17 November 1310 Kafur set out again, this time for the far south. From Devagiri, where Ramachandra again supplied him, he rode with 10,000 picked horsemen to Dwarasamudra (Halebidu), the capital of the Hoysala king Ballala III, and arrived on 26 February 1311. Ballala, whose army was away in the Pandya country, chose not to fight. The next morning he agreed to a truce, gave up his treasure, elephants and horses, became a tributary and guided the invaders south.
      - The Pandya kingdom was split by a war between the brothers Vira and Sundara Pandya, and neither would meet Kafur in battle. In March and April 1311 his army plundered Vira’s headquarters at Birdhul, Kannanur near Srirangam, the temple town of Chidambaram and Madurai, which Sundara had already left, and burnt temples. Unable to make the Pandyas submit, Kafur turned home on 25 April and reached Delhi in October with what Amir Khusrau describes as 512 elephants, 5,000 horses and 500 mann of gold and jewels. The southern kingdoms became tributaries, not provinces; their conquest was left to the Tughluqs.
    facts:
      - [Truce at Dwarasamudra, "27 February 1311"]
      - [Pandya campaign, "March – April 1311"]
      - [Booty (Khusrau), "512 elephants, 5,000 horses, 500 mann of gold and jewels"]
    markers:
      - kind: siege
        side: dl
        name: Dwarasamudra (Halebidu)
        date: 26–27 February 1311
        text: The Hoysala capital. Ballala III submitted the day after Kafur arrived, without a battle.
        lonlat: [75.995, 13.213]
      - kind: taken
        side: dl
        name: Birdhul
        date: April 1311
        text: Vira Pandya’s headquarters, usually identified with Virudhachalam. Vira had fled, and Khusrau joked that “the drum was empty”.
        lonlat: [79.32, 11.52]
      - kind: taken
        side: dl
        name: Kannanur
        date: April 1311
        text: Many people were killed here and 108 elephants captured.
        lonlat: [78.74, 10.93]
        lp: l
      - kind: taken
        side: dl
        name: Chidambaram
        date: April 1311
        text: The great temple town, identified with Khusrau’s Barmatpuri. Its golden temple was plundered.
        lonlat: [79.69, 11.4]
      - kind: taken
        side: dl
        name: Madurai
        date: April 1311
        text: The Pandya capital, abandoned by Sundara Pandya. A temple was set on fire.
        lonlat: [78.12, 9.92]
      - kind: event
        side: dec
        name: Devagiri
