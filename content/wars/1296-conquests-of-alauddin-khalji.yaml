id: conquests-of-alauddin-khalji
name: Conquests of Alauddin Khalji
start: "1296-02-26"
end: "1311-10"
tier: A
summary: "The campaigns of Alauddin Khalji, sultan of Delhi from 1296 to 1316, and his general Malik Kafur, which carried the Delhi Sultanate’s armies across western and central India and deep into the south. As governor of Kara he plundered the Yadava capital Devagiri in 1296 and used the treasure to seize the throne. As sultan he conquered Gujarat (1299–1304), the Rajput fortresses of Ranthambore (1301) and Chittor (1303), Malwa (1305), Siwana (1308) and Jalore (1311). From 1308 Malik Kafur made the kingdoms of the Deccan and the south tributaries, besieging Warangal in 1310, forcing the Hoysala king to submit at Dwarasamudra in 1311 and plundering the Pandya country as far as Madurai. The wars brought enormous booty to Delhi, and the sieges ended with massacres, jauhar (the self-immolation of Rajput women) and the destruction of temples."
countries: [in]
sides:
