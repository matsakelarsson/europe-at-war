  - title: Gujarat and Somnath
    date: 1299
    when: "1299-02-25"
    borders: "1299-06"
    countries: [in]
    body:
      - In February 1299 two armies set out against Gujarat, the rich kingdom of the Vaghela king Karna, Nusrat Khan from Delhi and the sultan’s brother Ulugh Khan from Sindh, attacking Jaisalmer on the way. They joined near Chittor, marched through Mewar and fell on Gujarat. Karna fled, and his capital Anahilavada (Patan) was plundered; his queen Kamala Devi was captured and later married to Alauddin. Nusrat Khan stripped the merchants of the port of Cambay (Khambhat) of their wealth and took from one of them a slave, Malik Kafur, who would lead the sultan’s armies in the south.
      - The army then marched on Somnath. An inscription records the death of the temple’s defenders on 6 June 1299; the temple was destroyed and its main idol taken to Delhi, and many other towns and temples were sacked. On the way home, near Jalore, the generals demanded a fifth of the soldiers’ loot. Mongol converts in the army rose in revolt, killed Nusrat Khan’s brother and attacked Ulugh Khan’s camp; after the revolt was crushed, the families of the rebels were punished with a cruelty that shocked even Barani. Some of the rebels found refuge with Hammira of Ranthambore. Karna won back part of his kingdom, but a second invasion in 1304 ended Vaghela rule, and Gujarat became a province of the sultanate.
    facts:
      - [Armies set out, "February 1299"]
      - [Fighting at Somnath, "6 June 1299"]
      - [Gujarat annexed, "1304, after a second invasion"]
    markers:
      - kind: event
        side: dl
