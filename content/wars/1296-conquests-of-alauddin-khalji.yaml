  - title: Ranthambore
    date: 1299–1301
    when: "1301-07-10"
    borders: "1301-07-10"
    countries: [in]
    body:
      - Hammira (Hammiradeva), the Chahamana king of Ranthambore, refused to hand over the Mongol rebels who had fled to him. Ulugh Khan and Nusrat Khan marched against him; they won a fight on the Banas, where Hammira’s general Bhimasimha was killed, and laid siege to his great fortress. Two or three days into the siege Nusrat Khan was killed by a stone from a mangonel, and the besiegers were driven back. In 1301 Alauddin came in person and had a great ramp of earth and timber built up against the walls.
      - On the way he had survived an attempt on his life by his nephew Akat Khan, and while the siege went on there were risings in Awadh and in Delhi itself. Inside the fort food ran out and some of Hammira’s officers went over to the sultan. In July 1301, on 10 July according to Firishta, Hammira and his companions rode out to die fighting, and the women of the fort, among them his queens and daughters, died in a jauhar. Amir Khusrau’s account of it is the earliest description of a jauhar in Persian. Ulugh Khan became governor of Ranthambore.
    facts:
      - [Fall of Ranthambore, "July 1301 (10 July in Firishta)"]
      - [Killed, "Nusrat Khan (Delhi), Hammira and Bhimasimha (Ranthambore)"]
    markers:
      - kind: taken
        side: dl
        name: Ranthambore
        date: July 1301
        text: The Chahamana fortress on a hill above the forest, taken after a long siege. Hammira died fighting and the women of the fort in a jauhar.
        lonlat: [76.46, 26.02]
      - kind: capital
        side: dl
        name: Delhi
        date: "1301"
        text: A rising in the city, led by a former official named Haji Maula, was put down while the sultan was at Ranthambore.
        lonlat: [77.18, 28.52]
    arrows:
      - side: dl
        label: Ulugh Khan and Nusrat Khan
        phase: 1
        via: [[77.15, 28.55], [76.9, 27.6], [76.55, 26.6], [76.47, 26.08]]
      - side: dl
        label: Alauddin
        phase: 2
        via: [[77.25, 28.5], [77.1, 27.5], [76.7, 26.6], [76.5, 26.1]]
  - title: Chittor
    date: January – August 1303
    when: "1303-01-28"
    borders: "1303-08-26"
    countries: [in]
    body:
      - On 28 January 1303 Alauddin laid siege to Chittor, the hill fortress of the Guhila king Ratnasimha of Mewar. He camped between the Berach and Gambhiri rivers and directed the siege from a hillock nearby. Two assaults failed, and through the monsoon the besiegers could get no further than halfway up the hill. On 26 August, perhaps after famine or disease had broken out in the fort, he entered it. The women of the fort died in a jauhar and most of the defenders fell fighting. Amir Khusrau, who was with the army, says that 30,000 Hindus were then killed on the sultan’s orders; some historians think the number should be read as 3,000. Ratnasimha’s fate is told differently by different sources, from surrender and pardon to death in battle.
      - Chittor was renamed Khizrabad after Alauddin’s young son Khizr Khan, and was later entrusted to Maladeva, a Chahamana chief loyal to the sultan. Mewar tradition says that the Sisodia branch of the Guhilas, under Hammir Singh, took it back in the 1320s. While Alauddin was at Chittor, an army he had sent against the Kakatiya kingdom of Warangal came back with heavy losses, either beaten or, as Barani says, driven back by the rains, and the Mongols took the chance to besiege Delhi.
    facts:
      - [Siege of Chittor, "28 January – 26 August 1303"]
      - [Killed after the fall, "30,000 according to Amir Khusrau (perhaps 3,000)"]
      - [Renamed, "Khizrabad"]
    markers:
      - kind: taken
        side: dl
        name: Chittor
        date: 26 August 1303
        text: The fort fell after nearly eight months. The town was sacked and its temples desecrated.
        lonlat: [74.645, 24.887]
      - kind: capital
        side: dl
        name: Delhi
        date: "1303"
        text: Besieged by the Mongols for about two months after the sultan’s return.
        lonlat: [77.18, 28.52]
    arrows:
      - side: dl
        label: Alauddin
        via: [[77.15, 28.5], [76.4, 27.3], [75.4, 25.9], [74.7, 24.95]]
  - title: Gujarat and Malwa annexed
    date: 1304–1305
    when: "1305-11-23"
    borders: "1305-12"
    countries: [in]
    body:
      - In 1304 a second army invaded Gujarat, where Karna had regained part of his kingdom, and ended Vaghela rule; Karna fled to the Deccan, and Gujarat became a province of the sultanate. In 1305 another army, perhaps under Ain al-Mulk Multani, invaded Malwa, defeated and killed the powerful Paramara minister Goga, and besieged the last Paramara king, Mahlakadeva, in the hill fort of Mandu. The fort fell, according to one account on 23 November 1305, and Mahlakadeva was killed. Ain al-Mulk became governor of Malwa, and the old Paramara capital, Dhar, was plundered.
      - With Gujarat, Malwa, Ranthambore and Chittor in its hands, the sultanate held the roads from Delhi to the Deccan and the ports of the western coast. Many Rajput and Gond chiefs kept their lands as tributaries, and in the Deccan Alauddin’s aim was tribute and plunder rather than annexation.
    facts:
      - [Vaghela rule ended, "1304"]
      - [Mandu taken, "23 November 1305 (one account)"]
      - [Governor of Malwa, "Ain al-Mulk Multani"]
    markers:
      - kind: taken
        side: dl
        name: Anahilavada (Patan)
        date: "1304"
        text: Karna’s capital, taken a second time. Gujarat was now governed from here for the sultan.
        lonlat: [72.12, 23.85]
      - kind: taken
        side: dl
        name: Mandu
        date: November 1305
        text: The hill fort where Mahlakadeva took refuge after the defeat of his army. He was killed when it fell.
        lonlat: [75.4, 22.36]
      - kind: taken
        side: dl
        name: Dhar
        date: 1305
        text: The old capital of the Paramaras of Malwa, plundered by Ain al-Mulk.
        lonlat: [75.3, 22.6]
        lp: l
      - kind: held
        side: dl
        name: Chittor
        date: 1303–1305
        text: Held for the sultan since 1303, on the road from Delhi to Gujarat and Malwa.
        lonlat: [74.645, 24.887]
    arrows:
      - side: dl
        label: Ain al-Mulk
        via: [[77.15, 28.5], [76.3, 26.3], [75.8, 24.4], [75.42, 22.42]]
    areas:
      - style: gained
        side: dl
        label: Annexed by the sultanate, 1304–1305
        atoms: [IN-GJ, IN-GJ~saurashtra, IN-MP~malwa]
  - title: Devagiri, Siwana and Jalore
    date: 1308–1311
    when: "1308"
    borders: "1308-11"
    countries: [in]
    body:
      - Ramachandra of Devagiri had stopped paying the tribute he promised in 1296. In 1308 Malik Kafur, now the sultan’s favourite, marched against him, defeated the Yadava army and brought Ramachandra to Delhi, where he was received with honour and sent home as a vassal. He kept faith for the rest of his life and helped Kafur’s later campaigns with supplies, troops and guides. Karna of Gujarat, who had found refuge in the Deccan, was driven out, and according to the chroniclers his daughter Devaladevi was captured and married to Khizr Khan.
      - In Marwar, Alauddin himself besieged the Paramara fort of Siwana from the summer of 1308. It was breached after some months, and its chief Sitaladeva was killed on 10 November as he tried to escape to Jalore. Siwana was renamed Khairabad and given to Kamal al-Din Gurg, who had run the siege engines. In 1311 Kamal al-Din took Jalore and killed its Chahamana king Kanhadadeva, whose stand is the subject of the Rajasthani epic Kanhadade Prabandha, written in 1455.
    facts:
      - [Ramachandra submits, "1308"]
      - [Siwana taken, "November 1308"]
      - [Jalore taken, "1311"]
    markers:
      - kind: taken
        side: dl
        name: Devagiri
        date: "1308"
        text: Malik Kafur defeated the Yadava army. Ramachandra became a loyal vassal and the base for the campaigns further south.
        lonlat: [75.215, 19.943]
      - kind: taken
        side: dl
        name: Siwana
        date: 10 November 1308
        text: Besieged by the sultan himself. Sitaladeva was killed while fleeing and his head brought to Alauddin.
        lonlat: [72.42, 25.65]
      - kind: taken
        side: dl
        name: Jalore
        date: "1311"
        text: Taken by Kamal al-Din Gurg. Kanhadadeva and his son Viramadeva were killed.
        lonlat: [72.62, 25.35]
        lp: b
    arrows:
      - side: dl
        label: Malik Kafur
        via: [[77.15, 28.5], [77.6, 25.2], [76.6, 22.3], [75.3, 20.05]]
      - side: dl
        label: Alauddin
        via: [[77.1, 28.5], [75.4, 27.2], [73.6, 26.2], [72.5, 25.7]]
  - title: The siege of Warangal
    date: October 1309 – June 1310
    when: "1310-01-19"
    borders: "1310-02"
    countries: [in]
    body:
      - On 31 October 1309 Alauddin sent Malik Kafur against the Kakatiya king Prataparudra of Warangal, with orders to take his treasure and make him a tributary rather than annex his kingdom. Kafur marched south through Malwa and the Yadava lands, where Ramachandra supplied markets and an escort. He took the border fort of Sabar (Sirpur), where some of the defenders burnt themselves rather than surrender, and on 19 January 1310 pitched his camp on the hill of Hanamkonda overlooking Warangal.
      - Warangal had two rings of walls, an outer one of earth and an inner one of stone. The besiegers took the outer wall by 16 February but could not climb the smooth stone walls of the inner fort, and Prataparudra offered terms. He handed over his treasure, which Barani lists as 100 elephants, 7,000 horses and great quantities of gold and jewels, and promised a yearly tribute. Kafur left on 20 March, and on 23 June 1310 laid the loot, carried on 1,000 camels, before the sultan in Delhi. An 18th-century writer claimed that the Koh-i-Noor diamond was among it.
    facts:
      - [Siege of Warangal, "19 January – February 1310"]
      - [Tribute (Barani), "100 elephants, 7,000 horses, gold and jewels"]
      - [Loot shown in Delhi, "23 June 1310"]
    markers:
      - kind: taken
        side: dl
        name: Sabar (Sirpur)
        date: January 1310
        text: A Kakatiya border fort, taken by surprise. Its surviving defenders made terms, and the commander’s brother was made governor.
        lonlat: [79.6, 19.48]
      - kind: event
        side: dl
        name: Hanamkonda
        date: 18–19 January 1310
        text: The hill overlooking Warangal, seized by a cavalry detachment. Kafur pitched his tent here.
        lonlat: [79.56, 18.01]
        lp: l
      - kind: siege
        side: dl
        name: Warangal
        date: January – February 1310
        text: The outer earthen wall was stormed, but the stone citadel held. Prataparudra bought peace with his treasure and became a tributary.
        lonlat: [79.605, 17.957]
      - kind: event
        side: dec
        name: Devagiri
        date: 1309–1310
        text: Ramachandra, now a vassal of Delhi, supplied the army on its way south and back.
        lonlat: [75.215, 19.943]
    arrows:
      - side: dl
        label: Malik Kafur
        phase: 1
        via: [[78.1, 24.7], [78.2, 22.6], [79.0, 20.6], [79.58, 19.52]]
      - side: dl
        phase: 2
        via: [[79.6, 19.45], [79.5, 18.6], [79.57, 18.05]]
      - side: dl
        phase: 3
