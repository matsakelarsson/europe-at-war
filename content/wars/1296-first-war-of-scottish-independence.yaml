  - title: Bannockburn
    date: 1310–1314
    when: "1310"
    borders: "1314-06-24"
    countries: [gb]
    body:
      - Edward II, at odds with his barons, made only one real campaign in Scotland before 1314, in 1310–1311, and it found no one to fight. Bruce took the war into northern England, burning towns and selling truces to communities for large sums. One by one the English-held castles fell, often to night attacks, and Bruce had them pulled down so they could not be used against him. Perth was taken on 8 January 1313, Roxburgh by James Douglas in February 1314 and Edinburgh in March by Thomas Randolph, whose men climbed the castle rock. Edward Bruce, the king’s brother, besieged Stirling, and its commander agreed to surrender if it was not relieved by midsummer 1314.
      - Edward II came north with the largest army England had yet sent into Scotland. He had summoned 25,000 foot and 2,000 horse; historians think fewer came, but the army was still much larger than Bruce’s, perhaps 6,000–7,000 men. On 23 June, as the English approached Stirling, Bruce killed the knight Henry de Bohun in single combat in front of the armies, and English attempts to get past the Scots were beaten back. That night the English camped on the low ground by the Bannock Burn. Next morning the Scottish schiltrons advanced and pinned them between the streams; the English army broke, and many drowned in the Forth or the burn.
      - The Earl of Gloucester was among the dead, and Edward II fled to Dunbar and from there by boat to Berwick. Stirling Castle surrendered, and prisoners such as the Earl of Hereford were exchanged for Bruce’s wife, daughter and sister and Bishop Wishart, held in England since 1306. Bannockburn made Bruce’s rule in Scotland secure, but England did not give up its claim.
    facts:
      - [Battle of Bannockburn, "23–24 June 1314, Scottish victory"]
      - [Castles retaken, "Perth 1313, Roxburgh and Edinburgh 1314"]
      - [Commanders, "Robert I; Edward II"]
    markers:
      - kind: taken
        side: sco
        name: Perth
        date: 8 January 1313
        text: Bruce led a night assault, wading through the moat up to his neck to set ladders against the walls.
        lonlat: [-3.433, 56.396]
      - kind: taken
        side: sco
        name: Roxburgh
        date: February 1314
        text: James Douglas’s men, reportedly disguised as cattle under dark cloaks, climbed the walls on Shrove Tuesday night while the garrison feasted.
        lonlat: [-2.457, 55.596]
      - kind: taken
        side: sco
        name: Edinburgh Castle
        date: 14 March 1314
        text: Randolph’s men climbed the north face of the rock at night. By John Barbour’s account their guide had once used the path to visit a girl in the town.
        lonlat: [-3.201, 55.949]
      - kind: battle
        side: sco
        name: Battle of Bannockburn
        date: 23–24 June 1314
        text: The exact site is still debated. Stirling Castle, whose relief the English had come for, stood about 3 km to the north.
        lonlat: [-3.938, 56.093]
      - kind: event
        name: Dunbar
        date: 24 June 1314
        text: Edward II fled from the battle to Dunbar Castle, whose earl let him in, and escaped by sea.
        lonlat: [-2.521, 55.977]
    arrows:
      - side: eng
        label: Edward II
        phase: 2
        via: [[-2.0, 55.77], [-3.2, 55.93], [-3.78, 55.99], [-3.93, 56.08]]
      - side: eng
        label: Edward II’s flight
        phase: 3
        via: [[-3.9, 56.09], [-3.2, 55.96], [-2.55, 55.98]]
      - side: sco
        label: Bruce’s raids
        phase: 1
        via: [[-3.0, 55.2], [-2.6, 54.95], [-1.6, 54.78]]
  - title: From Arbroath to Edinburgh–Northampton
    date: 1315–1328
    when: "1318-04-01"
    borders: "1328-05-01"
    countries: [gb]
    body:
      - In 1315 the king’s brother Edward Bruce invaded Ireland, opening a second front that lasted until his death in 1318. In April 1318 the Scots took Berwick, the last English stronghold in Scotland, and held it against Edward II’s siege the next year. To draw him away, Randolph and Douglas raided deep into Yorkshire and on 20 September 1319 routed a hastily raised force, led by the Archbishop of York and including many clergy, at Myton. Scottish raids reached Yorkshire and Lancashire, and the north of England paid heavily for truces.
      - Bruce was still excommunicated, and the pope would not call him king. In April 1320 the Scottish barons sent Pope John XXII the letter known as the Declaration of Arbroath, asking him to persuade Edward to leave the Scots in peace and declaring that “as long as but a hundred of us remain alive, never will we on any conditions be brought under English rule”. In 1322 Edward invaded again, found the Lowlands stripped of food and withdrew; the Scots followed and nearly captured him at Old Byland in Yorkshire on 14 October. In May 1323 the two kingdoms agreed a thirteen-year truce at Bishopthorpe.
      - Edward II was deposed in January 1327, and the Scots attacked at once. That summer they outmanoeuvred the young Edward III’s army in Weardale, and in a night raid on the English camp at Stanhope Park Douglas nearly took the king prisoner. The regents, Queen Isabella and Roger Mortimer, made peace. By the treaty sealed at Edinburgh on 17 March 1328 and confirmed by the English parliament at Northampton on 1 May, England recognised Scotland as an independent kingdom under Robert I and his heirs, with the border as it had been under Alexander III, in return for £20,000. Bruce’s son David married Edward’s sister Joan, and Bruce died in June 1329.
    facts:
      - [Declaration of Arbroath, 6 April 1320]
      - [Truce of Bishopthorpe, "30 May 1323, for thirteen years"]
      - [Treaty of Edinburgh–Northampton, "17 March 1328, confirmed 1 May 1328"]
    markers:
      - kind: taken
        side: sco
        name: Berwick
        date: 1–2 April 1318
        text: An English burgess helped the Scots over the walls at night. Edward II’s attempt to win the town back in 1319 failed.
        lonlat: [-2.002, 55.769]
      - kind: battle
        side: sco
        name: Battle of Myton
        date: 20 September 1319
        text: So many priests were killed that the rout was mocked as the Chapter of Myton.
        lonlat: [-1.341, 54.096]
        lp: l
      - kind: event
        side: sco
        name: Arbroath
        date: 6 April 1320
        text: The letter was dated at the abbey. It was probably drafted by its abbot, Bernard, who was also Bruce’s chancellor.
        lonlat: [-2.582, 56.563]
      - kind: battle
        side: sco
        name: Battle of Old Byland
        date: 14 October 1322
        text: The Scots stormed an English position on a ridge near Rievaulx Abbey, where Edward II was staying. He fled, leaving his baggage and treasure behind.
        lonlat: [-1.159, 54.227]
      - kind: treaty
        name: Bishopthorpe
        date: 30 May 1323
        text: The truce was agreed at the Archbishop of York’s palace and ratified by Bruce at Berwick in June.
        lonlat: [-1.092, 53.925]
        lp: b
      - kind: battle
        side: sco
        name: Stanhope Park
        date: 3–4 August 1327
        text: Douglas led a night raid into the English camp in Weardale and, it is said, cut the ropes of the king’s tent. The Scots then slipped away.
        lonlat: [-2.006, 54.747]
      - kind: treaty
        name: Edinburgh
        date: 17 March 1328
        text: The treaty was sealed at Holyrood Abbey. Many in England called it the shameful peace.
        lonlat: [-3.172, 55.953]
    arrows:
      - side: sco
        label: Randolph and Douglas
        via: [[-2.5, 55.5], [-1.9, 54.8], [-1.36, 54.12]]
      - side: eng
        label: Edward II, 1322
        via: [[-1.6, 54.5], [-2.0, 55.77], [-3.15, 55.94]]
      - side: sco
        label: Scots, 1322
        via: [[-2.4, 55.6], [-1.7, 54.7], [-1.17, 54.24]]
      - side: sco
        label: Douglas, 1327
