steps:
  - title: Berwick, Dunbar and the conquest
    date: 1286–1296
    when: "1296-03-30"
    borders: "1296-08-28"
    countries: [gb]
    body:
      - When Alexander III died in 1286 and his granddaughter and heir Margaret, the Maid of Norway, died in 1290, thirteen claimants came forward for the Scottish crown. Edward I of England, asked to judge between them, first made them accept him as overlord, and in 1292 he chose John Balliol. Edward then treated Scotland as a dependency, hearing appeals against Scottish courts and demanding Scottish service in his war with France. In 1295 the Scots took the government out of Balliol’s hands, gave it to a council of twelve and made an alliance with Philip IV of France, the beginning of what was later called the Auld Alliance.
      - Edward invaded in March 1296. On 30 March his army stormed Berwick, then Scotland’s richest town, and killed a large part of its people; chroniclers’ figures run into thousands. On 27 April the Earl of Surrey routed the Scottish army near Dunbar, and the castles of Roxburgh, Edinburgh and Stirling soon surrendered. In July Balliol submitted at Stracathro near Montrose and gave up his kingdom; the royal arms were torn from his surcoat, which earned him the nickname Toom Tabard, “empty coat”. Edward marched as far as Elgin, sent the Stone of Scone, on which Scottish kings were inaugurated, to Westminster, and at Berwick in August took oaths of fealty from the Scottish landholders, recorded in the Ragman Roll.
    facts:
      - [Sack of Berwick, 30 March 1296]
      - [Battle of Dunbar, "27 April 1296, English victory"]
      - [Balliol’s abdication, "July 1296, at Stracathro"]
