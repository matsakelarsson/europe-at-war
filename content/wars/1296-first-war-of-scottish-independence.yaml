  - title: Wallace, Moray and Stirling Bridge
    date: 1297–1298
    when: "1297-05"
    borders: "1298-07-22"
    countries: [gb]
    body:
      - English rule soon met resistance. In May 1297 William Wallace, a younger son of a minor landholder, killed the English sheriff of Lanark, while in the north Andrew Moray led a rising that drove the English from most of the castles beyond the Forth. Joining forces, they faced the Earl of Surrey and the treasurer Hugh de Cressingham at Stirling on 11 September. The English began to cross the narrow bridge over the Forth, and when part of their army was over, the Scots charged down from the slopes above and cut it off. Cressingham was among the many killed and, it is said, flayed. Moray died of his wounds later that year.
      - Wallace raided Northumberland and Cumberland that autumn and was made Guardian of Scotland in the name of King John. In July 1298 Edward I invaded with a large army, perhaps 25,000 foot, many of them Welsh. On 22 July at Falkirk Wallace drew up his spearmen in schiltrons, tight rings bristling with spears, which held off the English cavalry until Edward’s archers and crossbowmen shot gaps in them; the knights then broke in, and many Scots were killed. Edward lacked the supplies to hold the country and withdrew, but Wallace gave up the guardianship.
    facts:
      - [Battle of Stirling Bridge, "11 September 1297, Scottish victory"]
      - [Battle of Falkirk, "22 July 1298, English victory"]
    markers:
      - kind: event
        side: sco
        name: Lanark
        date: May 1297
        text: Wallace killed the English sheriff, William Heselrig, the first act of his rising.
        lonlat: [-3.777, 55.675]
      - kind: battle
        side: sco
        name: Battle of Stirling Bridge
        date: 11 September 1297
        text: The bridge was so narrow that only two horsemen could cross side by side. Surrey, who had stayed on the south bank, fled to Berwick.
        lonlat: [-3.935, 56.13]
      - kind: battle
        side: eng
        name: Battle of Falkirk
        date: 22 July 1298
        text: The Scottish cavalry fled early, leaving the schiltrons exposed to the archers. Wallace escaped.
        lonlat: [-3.76, 55.987]
      - kind: event
        side: sco
        name: Hexham
        date: October–November 1297
        text: Wallace’s army burned and plundered across Northumberland and Cumberland. Many people fled behind the walls of Newcastle.
        lonlat: [-2.1, 54.97]
    arrows:
      - side: sco
        label: Moray
        via: [[-4.2, 57.45], [-3.6, 56.8], [-3.92, 56.16]]
      - side: eng
