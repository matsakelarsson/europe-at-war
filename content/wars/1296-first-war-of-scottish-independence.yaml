  - title: Edward I’s conquest and Wallace’s death
    date: 1298–1305
    when: "1298-12"
    borders: "1305-09-15"
    countries: [gb]
    body:
      - Scotland was now governed by Guardians, among them Robert Bruce, Earl of Carrick, grandson of one of the claimants of 1291, and his rival John Comyn of Badenoch, Balliol’s nephew. They could not work together, and Bruce resigned in 1300 and later made his peace with Edward. Edward campaigned in Scotland almost every year, while Scottish envoys worked in Rome and Paris to restore Balliol, now released into papal keeping. On 24 February 1303 the Scots under Comyn beat an English force at Roslin, but that May Philip IV made peace with England and left Scotland out of it.
      - In 1303 Edward marched up the east as far as Moray and wintered at Dunfermline, and in February 1304 Comyn and most of the Scottish leaders submitted. Stirling Castle held out for three months against the largest siege train Edward could gather, including a giant trebuchet called the War Wolf, which he insisted on trying out after the garrison had offered to surrender. Wallace refused to submit. Betrayed near Glasgow in August 1305, he was taken to London, tried for treason and on 23 August hanged, drawn and quartered at Smithfield; his limbs were displayed at Newcastle, Berwick, Stirling and Perth. In September Edward issued an ordinance for governing Scotland as a land of the English crown.
    facts:
      - [Battle of Roslin, "24 February 1303, Scottish victory"]
      - [Siege of Stirling Castle, "April–July 1304"]
      - [Execution of Wallace, "23 August 1305, London"]
    markers:
      - kind: battle
        side: sco
        name: Battle of Roslin
        date: 24 February 1303
        text: John Comyn and Simon Fraser surprised and beat an English force advancing in separate divisions south of Edinburgh.
        lonlat: [-3.164, 55.855]
      - kind: event
        side: eng
        name: Dunfermline
        date: Winter 1303–1304
        text: Edward wintered at the abbey, burial place of Scottish kings, and burned much of it when he left.
        lonlat: [-3.46, 56.07]
      - kind: siege
        side: eng
        name: Stirling Castle
        date: April–July 1304
        text: The last castle to hold out for the Scots. Its commander, William Oliphant, surrendered in July after a bombardment by a dozen siege engines.
        lonlat: [-3.948, 56.124]
      - kind: event
        side: eng
        name: Robroyston
        date: 3 August 1305
        text: Wallace was captured near Glasgow by men of Sir John Menteith, a Scot in English service, and handed over to the English.
        lonlat: [-4.19, 55.89]
    arrows:
      - side: eng
        label: Edward I, 1303
        via: [[-2.0, 55.77], [-3.2, 55.95], [-3.43, 56.4], [-3.57, 57.62]]
  - title: Bruce’s rising
    date: 1306–1309
    when: "1306-02-10"
    borders: "1308-05-23"
    countries: [gb]
    body:
      - On 10 February 1306 Robert Bruce met John Comyn in the church of the Greyfriars at Dumfries and killed him, probably in a quarrel rather than by plan. With nothing left to lose, Bruce had himself crowned at Scone on 25 March. Edward I, now old and ill, ordered that no mercy be shown. On 19 June Aymer de Valence surprised Bruce’s army in its camp at Methven, and in the west John MacDougall of Lorne, a kinsman of Comyn, beat him again at Dalrigh. Bruce became a fugitive, probably in the Hebrides or Ireland. Three of his brothers were executed, and his sister Mary and Isabella, Countess of Buchan, who had crowned him, were kept in cages at Roxburgh and Berwick.
      - In February 1307 Bruce landed in his own earldom of Carrick and fought a guerrilla war in the hills of the south-west. He ambushed an English force at Glen Trool in April and on 10 May beat Valence at Loudoun Hill. Edward I set out north once more but died at Burgh by Sands on the Solway on 7 July 1307, and his son Edward II soon went home. Bruce turned on his Scottish enemies, defeating the Earl of Buchan near Inverurie on 23 May 1308 and laying waste his lands, the “harrying of Buchan”, and then breaking the MacDougalls in Argyll. In 1309 he held his first parliament, at St Andrews.
    facts:
      - [Killing of John Comyn, "10 February 1306, Dumfries"]
      - [Coronation of Robert I, "25 March 1306, Scone"]
      - [Battle of Loudoun Hill, "10 May 1307, Scottish victory"]
    markers:
      - kind: event
        side: sco
        name: Dumfries
        date: 10 February 1306
        text: Bruce stabbed Comyn before the high altar, and his followers finished him off. The killing in a church led to Bruce’s excommunication.
        lonlat: [-3.603, 55.07]
      - kind: event
        side: sco
        name: Scone
        date: 25 March 1306
        text: Bruce was crowned in a hurried ceremony; two days later Isabella MacDuff, Countess of Buchan, set a crown on his head, as her family had the right to do.
        lonlat: [-3.436, 56.425]
      - kind: battle
        side: eng
        name: Battle of Methven
        date: 19 June 1306
        text: Valence put off Bruce’s challenge to battle until the next day, then fell on his camp by surprise and scattered his army.
        lonlat: [-3.582, 56.42]
      - kind: battle
        side: eng
        name: Battle of Dalrigh
        date: July or August 1306
        text: The MacDougalls caught Bruce’s small band near Tyndrum as it fled west.
        lonlat: [-4.688, 56.424]
      - kind: battle
        side: sco
        name: Glen Trool
        date: April 1307
        text: By tradition, Bruce’s men rolled boulders down on an English force in the narrow glen and then charged from the hillside.
        lonlat: [-4.487, 55.09]
      - kind: battle
        side: sco
        name: Battle of Loudoun Hill
        date: 10 May 1307
        text: Bruce dug trenches across the boggy ground to narrow the front and beat Valence’s heavy cavalry, his first victory in open battle.
        lonlat: [-4.211, 55.609]
      - kind: event
        name: Burgh by Sands
        date: 7 July 1307
        text: Edward I, called the Hammer of the Scots, died on the shore of the Solway within sight of Scotland.
        lonlat: [-3.05, 54.923]
      - kind: battle
        side: sco
        name: Battle of Inverurie
        date: 23 May 1308
        text: Bruce, just recovered from a serious illness, routed the Earl of Buchan, then had Comyn lands burned and their people killed.
        lonlat: [-2.318, 57.335]
    arrows:
      - side: sco
        label: Bruce, 1306
        via: [[-3.58, 56.42], [-4.3, 56.45], [-4.69, 56.42], [-5.5, 55.9]]
      - side: sco
