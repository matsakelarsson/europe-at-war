        text: Scottish earls led by John Comyn, Earl of Buchan, attacked the English border city and were beaten off, the first fighting of the war.
        lonlat: [-2.942, 54.897]
      - kind: taken
        side: eng
        name: Berwick
        date: 30 March 1296
        text: Edward’s army stormed the town’s weak defences, and the killing went on for a day or more. Edward made Berwick the seat of English government in Scotland.
        lonlat: [-2.002, 55.769]
      - kind: battle
        side: eng
        name: Battle of Dunbar
        date: 27 April 1296
        text: The Scottish army came down from the hills to attack Surrey’s cavalry and was routed. Many Scottish nobles were captured.
        lonlat: [-2.521, 55.977]
      - kind: event
        side: eng
        name: Scone
        date: "1296"
        text: The Stone of Scone was carried off from the abbey and placed in Westminster Abbey, where it stayed until 1996.
        lonlat: [-3.436, 56.425]
      - kind: event
        side: eng
        name: Stracathro
        date: July 1296
        text: John Balliol confessed his rebellion and resigned his kingdom to Edward. He was sent to the Tower of London and later allowed to go to France.
        lonlat: [-2.622, 56.779]
      - kind: event
        side: eng
        name: Elgin
        date: July 1296
        text: The northernmost point of Edward’s march through Scotland, before he turned back south to Berwick.
        lonlat: [-3.315, 57.649]
