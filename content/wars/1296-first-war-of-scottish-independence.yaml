id: first-war-of-scottish-independence
name: First War of Scottish Independence
start: "1296-03-26"
end: "1328-05-01"
tier: A
summary: The war in which Scotland resisted English rule after Edward I deposed King John Balliol in 1296. Led first by William Wallace and Andrew Moray and then by Robert the Bruce, who made himself king in 1306 and beat Edward II at Bannockburn in 1314, the Scots won recognition of their independence in the Treaty of Edinburgh–Northampton in 1328.
countries: [gb]
sides:
  - id: sco
    name: Scotland
    polities: [scotland]
    ink: navy
    moves: Scottish moves
    success: Scottish success
  - id: eng
    name: England and its Scottish allies
    polities: [england]
    ink: red
    moves: English moves
    success: English success
notes:
  - Dates are Julian, with years beginning on 1 January.
  - The war was also a Scottish civil war. Many Scots fought for the English at different times, above all the Comyns and their allies after Bruce killed John Comyn in 1306.
  - Much of what is popularly told about William Wallace comes from The Wallace, a poem by Blind Harry written about 170 years after his death. Little is known for certain about his early life.
  - Edward Bruce’s invasion of Ireland in 1315–1318 has its own entry, the Bruce campaign in Ireland.
