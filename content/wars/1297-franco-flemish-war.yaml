  - title: Mons-en-Pévèle and the Treaty of Athis
    date: 1302–1305
    when: "1303-04-04"
    borders: "1305-06-23"
    countries: [be, fr, nl]
    body:
      - After Courtrai the rebels took Lille, Douai and the rest of Flanders, and the guilds took over the town governments. Philip led an army to the border in September 1302 but withdrew without fighting, and in April 1303 the Flemish held off a French attack at Arques near Saint-Omer. Guy of Namur took the war into Zeeland, which the counts of Flanders claimed against the counts of Holland, but on 10–11 August 1304 a French fleet under the Genoese Rainier Grimaldi, with ships from Holland, defeated his fleet off Zierikzee and took him prisoner.
      - A week later, on 18 August 1304, Philip IV fought the Flemish militias at Mons-en-Pévèle, south of Lille. After a long, hot day in which the king himself was nearly killed, the Flemish left the field, with William of Jülich among the dead. Both sides claimed victory, and when the Flemish raised a new army to relieve Lille, Philip agreed a truce. By the Treaty of Athis-sur-Orge, sealed on 23 June 1305, Guy’s son Robert of Béthune was restored as count, but Flanders had to pay huge fines, pull down the walls of its great towns, send 3,000 men of Bruges on pilgrimage and hand Lille, Douai and Orchies to the king. A further agreement in 1312 made the cession permanent.
    facts:
      - [Battle of Zierikzee, "10–11 August 1304, French and Hollandish victory"]
      - [Battle of Mons-en-Pévèle, "18 August 1304, claimed by both sides"]
      - [Treaty of Athis-sur-Orge, 23 June 1305]
    markers:
      - kind: battle
        side: fla
        name: Battle of Arques
        date: 4 April 1303
        text: William of Jülich’s men, mostly from Ypres, held their ground against repeated French attacks, at a heavy cost.
        lonlat: [2.303, 50.736]
      - kind: naval
        side: fra
        name: Battle of Zierikzee
        date: 10–11 August 1304
        text: The French galleys and the Hollanders broke the Flemish fleet besieging the town, and Zeeland went back to the Count of Holland.
        lonlat: [3.916, 51.65]
      - kind: battle
        side: fra
        name: Battle of Mons-en-Pévèle
        date: 18 August 1304
        text: Late in the day the Flemish broke into the royal camp, and Philip had to fight for his life. The French held the field.
        lonlat: [3.103, 50.48]
      - kind: treaty
        name: Athis-sur-Orge
        date: 23 June 1305
        text: The peace was sealed at Athis, south of Paris, three months after the old count Guy had died a prisoner at Compiègne.
        lonlat: [2.389, 48.707]
