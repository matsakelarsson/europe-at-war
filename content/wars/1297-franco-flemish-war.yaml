steps:
  - title: Annexation and the Golden Spurs
    date: 1297–1302
    when: "1297-01-07"
    borders: "1302-07-11"
    countries: [be, fr]
    body:
      - Guy of Dampierre, Count of Flanders, was caught between his overlord Philip IV, who pressed royal justice and taxes on the county, and its great cloth towns, which lived on English wool. In January 1297 he allied with Edward I of England and renounced his homage. A French army besieged Lille, Robert of Artois beat the Flemish at Furnes on 20 August, and Lille, Bruges and Kortrijk gave in. Edward landed with a small army but, with Scotland in revolt, made a truce and went home. When it ran out in 1300, Charles of Valois overran the rest of the county; Guy surrendered and was imprisoned, and Philip annexed Flanders to the royal domain.
      - The new governor, Jacques de Châtillon, ruled harshly with the support of the town patricians, the Leliaerts or “men of the lily”, and raised new taxes. At dawn on 18 May 1302, in the Matins of Bruges, the guildsmen of Bruges led by the weaver Pieter de Coninck killed the French soldiers quartered in the town; tradition says that anyone who could not say the Flemish words “schild en vriend” was cut down. Led by Guy’s son Guy of Namur and his grandson William of Jülich, the rebels then besieged the French garrison in the castle of Kortrijk.
      - On 11 July Robert of Artois attacked them outside the town with a royal army of about 8,000, including some 2,500 mounted men-at-arms. The Flemish, perhaps 9,000 townsmen and peasants on foot, armed with pikes and the spiked club called the goedendag, stood behind streams and ditches. The French cavalry floundered in the marshy ground and was slaughtered, since the militiamen took few prisoners. Robert and hundreds of knights were killed, and some 500 pairs of golden spurs were hung in the Church of Our Lady in Kortrijk.
    facts:
      - [Matins of Bruges, 18 May 1302]
      - [Battle of the Golden Spurs, "11 July 1302, Flemish victory"]
      - [Commanders, "Guy of Namur and William of Jülich; Robert II of Artois"]
