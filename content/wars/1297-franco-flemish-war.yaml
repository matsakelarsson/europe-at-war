id: franco-flemish-war
name: Franco-Flemish War
start: "1297-01-07"
end: "1305-06-23"
tier: B
summary: A war between Philip IV of France and the County of Flanders, whose count had allied with England. France overran Flanders and annexed it by 1300, but in 1302 the towns rose and their militias destroyed a French army of knights at Courtrai, the Battle of the Golden Spurs. After the hard-fought battle of Mons-en-Pévèle in 1304, the Treaty of Athis-sur-Orge restored the count as a French vassal at the price of heavy payments and the towns of Walloon Flanders.
countries: [be, fr, nl]
sides:
  - id: fla
    name: Flanders
    polities: [flanders]
    ink: gold
    moves: Flemish moves
    success: Flemish success
  - id: fra
    name: France and its allies
    polities: [france]
    ink: navy
    moves: French moves
    success: French and allied success
notes:
  - Dates are Julian. Places in Belgium are given their Dutch names, with the French form where it is common in English, such as Courtrai for Kortrijk and Furnes for Veurne.
  - In Flanders the battle of Courtrai is known as the Guldensporenslag, and 11 July is the official holiday of the Flemish Community in Belgium.
  - The war ran alongside the Anglo-French Gascon War of 1294–1303 and the first years of the First War of Scottish Independence.
