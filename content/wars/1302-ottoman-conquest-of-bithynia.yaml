steps:
  - title: Bapheus
    date: 1299–1303
    when: "1302-07-27"
    borders: "1302-07-27"
    countries: [tr]
    body:
      - Osman was one of many Turkish warlords on the Byzantine frontier after the decline of the Seljuk sultanate of Rum. From his base at Söğüt in the Sakarya valley he raided ever deeper into Bithynia, and Ottoman tradition credits him with taking Bilecik, İnegöl and Yenişehir around 1299. By 1301 his men were blockading Nicaea and plundering the outskirts of Prusa (Bursa), and they kept the people of Nicomedia from bringing in their harvest. Shortly before, the co-emperor Michael IX had led an army into western Anatolia, but it melted away at Magnesia without fighting.
      - To relieve Nicomedia, Andronikos II sent some 2,000 men across the Bosporus under George Mouzalon, about half of them newly hired Alan mercenaries. On 27 July 1302, at Bapheus, a plain near Nicomedia, they met perhaps 5,000 Turkish horsemen led by Osman. The Alans stood aside, the Turks broke the Byzantine line and Mouzalon fled into the city. Bapheus was the first Ottoman victory over an imperial army. The Byzantines kept only their walled towns, and refugees crowded across the strait to Constantinople.
    facts:
      - [Battle of Bapheus, "27 July 1302, Ottoman victory"]
      - [Armies, "about 2,000 Byzantines against perhaps 5,000 Turks"]
