  - title: Bursa
    date: 1317–1326
    when: "1317"
    borders: "1326-04-06"
    countries: [tr]
    body:
      - The Ottomans had no siege engines able to break the walls of Prusa, the rich city at the foot of Mount Olympus (Uludağ), so from about 1317 they starved it, building forts around it and cutting its roads. The Byzantines, caught up from 1321 in the civil war between Andronikos II and his grandson, sent no relief. Osman, old and ill, left the war to his son Orhan.
      - On 6 April 1326, after years of blockade, the city surrendered to Orhan. Osman died about this time; by some accounts he heard of the victory on his deathbed, and he was buried in Bursa. Orhan made Bursa his capital, built mosques, baths and inns, and drew merchants to it, and the Moroccan traveller Ibn Battuta, who visited it in about 1331, praised its bazaars and wide streets. It remained the chief Ottoman city until the 1360s, and the early sultans were buried there.
    facts:
      - [Siege of Bursa, "about 1317–1326"]
      - [Surrender, 6 April 1326]
      - [Death of Osman, "1323–1326; sources differ"]
    markers:
      - kind: taken
        side: ott
        name: Bursa
        date: 6 April 1326
        text: Prusa surrendered after years of blockade and became the first Ottoman capital, where Osman and Orhan are buried.
        lonlat: [29.062, 40.197]
      - kind: event
        side: ott
        name: Yenişehir
        date: 1317–1326
        text: The Ottoman base for the blockade of Bursa and Nicaea.
        lonlat: [29.653, 40.264]
        lp: r
    arrows:
