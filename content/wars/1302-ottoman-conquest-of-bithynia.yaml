id: ottoman-conquest-of-bithynia
name: Ottoman conquest of Bithynia
start: "1302-07-27"
end: "1337"
tier: B
summary: The conquest of Byzantine Bithynia, the north-western corner of Anatolia facing Constantinople, by Osman, founder of the Ottoman dynasty, and his son Orhan. After Osman’s victory at Bapheus in 1302 the Byzantines lost the countryside and kept only walled towns, which fell one by one after long blockades; Bursa in 1326, Nicaea in 1331 and Nicomedia in 1337. Andronikos III’s attempt to relieve them was beaten at Pelekanon in 1329, the last Byzantine campaign in Asia Minor.
countries: [tr]
sides:
  - id: ott
    name: Ottomans
    polities: [ottoman]
    ink: teal
    moves: Ottoman moves
    success: Ottoman success
  - id: byz
    name: Byzantine Empire
    polities: [byzantium]
    ink: purple
    moves: Byzantine moves
    success: Byzantine success
notes:
  - The early history of the Ottomans is known mainly from Byzantine historians such as George Pachymeres and from Ottoman chronicles written more than a century later, which mix fact and legend. Many dates are uncertain; the battle of Bapheus is dated 1302 by most modern historians, but 1299 by some older ones, and Osman’s death is placed between 1323 and 1326.
