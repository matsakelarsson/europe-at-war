  - title: Pelekanon, Nicaea and Nicomedia
    date: 1329–1337
    when: "1329-06-10"
    borders: "1337"
    countries: [tr]
    body:
      - In 1329 Andronikos III, now sole emperor, and his chief minister John Kantakouzenos crossed to Asia with about 4,000 men, the largest army they could raise, to relieve Nicaea and Nicomedia. At Pelekanon, on the coast of the Gulf of Nicomedia, Orhan’s army blocked the road from the hills. After a day of skirmishing on 10 June the Byzantines began to withdraw; both leaders were slightly wounded, a rumour spread that the emperor was dying, and on 11 June the retreat became a rout. Kantakouzenos brought the survivors home by sea.
      - No Byzantine army tried to win back Asia Minor again. Nicaea, where the church council of 325 had met and the emperors had ruled in exile after 1204, surrendered on 2 March 1331, and many of its people soon became Muslims; Orhan turned its great church into a mosque. Andronikos offered tribute in return for peace, but Orhan went on to besiege Nicomedia, which surrendered in 1337. With the annexation of the neighbouring beylik of Karasi, the Ottomans held most of the Asian shore of the Sea of Marmara.
    facts:
      - [Battle of Pelekanon, "10–11 June 1329, Ottoman victory"]
      - [Fall of Nicaea, 2 March 1331]
      - [Fall of Nicomedia, "1337"]
    markers:
      - kind: battle
        side: ott
        name: Battle of Pelekanon
        date: 10–11 June 1329
        text: The first battle between a Byzantine emperor and an Ottoman ruler, near present-day Maltepe. The Byzantine retreat turned into a rout.
        lonlat: [29.13, 40.93]
      - kind: taken
        side: ott
        name: Nicaea
        date: 2 March 1331
        text: The old imperial city (İznik) surrendered on terms. For a short time it was the Ottoman capital.
        lonlat: [29.721, 40.429]
      - kind: taken
        side: ott
        name: Nicomedia
        date: "1337"
        text: The port at the head of the gulf (İzmit) gave up after a long blockade, short of food; its people were allowed to leave for Constantinople.
        lonlat: [29.92, 40.76]
