        text: The Company’s attempt on the empire’s second city failed.
        lonlat: [22.936, 40.64]
        lp: l
      - kind: battle
        side: cat
        name: Battle of Halmyros
        date: 15 March 1311
        text: The Frankish knights of Athens and Achaea charged across flooded fields and were destroyed. Duke Walter of Brienne was killed.
        lonlat: [22.76, 39.18]
      - kind: taken
        side: cat
        name: Thebes
        date: "1311"
        text: The capital of the duchy fell to the Catalans after the battle, and Athens soon followed.
        lonlat: [23.318, 38.321]
