id: campaigns-of-the-catalan-company
name: Campaigns of the Catalan Company
start: "1303"
end: "1311-03-15"
tier: B
summary: The wars of the Grand Catalan Company, mercenaries from the War of the Sicilian Vespers hired by the Byzantine emperor Andronikos II to fight the Turks in Anatolia. After victories over the Turks in 1303–1304 the Company fell out with its employers, and when its leader Roger de Flor was murdered in 1305 it turned on the Byzantines, ravaging Thrace and Macedonia for years. In 1311 it destroyed the army of the Duke of Athens at Halmyros and took over his duchy, which it ruled until 1388.
