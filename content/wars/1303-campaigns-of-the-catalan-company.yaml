steps:
  - title: Anatolia and the murder of Roger de Flor
    date: 1303–1305
    when: "1303"
    borders: "1305-04-30"
    countries: [tr]
    body:
      - The peace of 1302 that ended the War of the Sicilian Vespers left thousands of Catalan and Aragonese soldiers in Sicily without pay, many of them almogavars, hardy light infantry from the frontier wars in Spain. Their leader, the former Templar Roger de Flor, offered them to Andronikos II, who badly needed soldiers against the Turks. The Company reached Constantinople in 1303, and Roger married the emperor’s niece and was made megas doux, commander of the fleet. After a bloody fight with the city’s Genoese, the Company was shipped to Cyzicus, where it surprised and routed the Turks of Karasi in October.
      - In the spring of 1304 Roger marched south with his Catalans and Alan allies, beat the Turks of Germiyan and Aydın besieging Philadelphia at Aulax, and relieved the city. He went on as far as the Cilician Gates, where on 15 August he won another battle at Kibistra. But the Catalans plundered Greek towns as freely as Turkish ones and quarrelled over pay, and the emperor called them back to Europe; they wintered at Gallipoli. On 30 April 1305 Roger was murdered at a banquet in Adrianople by Alan mercenaries of the co-emperor Michael IX, with many of his escort, and Catalans in Constantinople were killed.
    facts:
      - [Company arrives, "1303; about 6,500 men by Muntaner’s account"]
      - [Battle of Kibistra, 15 August 1304]
      - [Murder of Roger de Flor, "30 April 1305, Adrianople"]
