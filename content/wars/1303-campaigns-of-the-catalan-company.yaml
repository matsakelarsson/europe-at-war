notes:
  - The main account of the Company is the chronicle of Ramon Muntaner, who served in it and tells its story from the Catalan side; the Byzantine historians George Pachymeres and Nikephoros Gregoras saw the Catalans as plunderers. Their numbers for the Company differ widely, from about 1,000 men to Muntaner’s 6,500 fighting men with their families and servants.
  - The battle of 15 March 1311 was long called the battle of the Cephissus and placed near Orchomenos in Boeotia; most historians now place it at Halmyros in southern Thessaly.
  - The Company’s revenge after 1305 is remembered in Catalan as the venjança catalana. After 1311 the Duchy of Athens, and from 1319 Neopatras, were ruled by the Catalans under the Aragonese kings of Sicily, until Nerio Acciaioli of Corinth took Athens in 1388.
