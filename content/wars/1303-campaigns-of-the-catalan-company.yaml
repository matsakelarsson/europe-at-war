  - title: Thrace, Macedonia and Halmyros
    date: 1305–1311
    when: "1305-06-21"
    borders: "1311-03-15"
    countries: [tr, gr]
    body:
      - Led now by Berenguer d’Entença and Bernat de Rocafort, the Company took its revenge. On 21 June 1305 the garrison of Gallipoli sallied out and routed the besieging Byzantines, and in July the Catalans crushed Michael IX’s army near Apros. For two years, joined by Turkish bands, they ravaged Thrace from Gallipoli. When the land was exhausted they moved west, wintered on the Kassandra peninsula, plundered the monasteries of Mount Athos and in 1308 failed to take Thessalonica. Their leaders fell out; Rocafort was seized in 1309 by an agent of Charles of Valois and died in prison in Naples.
      - In 1309 the Company reached Thessaly, and in 1310 Walter of Brienne, the new Duke of Athens, hired it against his Greek neighbours. When he refused to pay and tried to drive it out, the Catalans met his army near Halmyros on 15 March 1311. They had flooded the marshy ground in front of their line, and the duke’s heavy cavalry charged into the mud and was cut down. Walter and most of the knights of Frankish Greece were killed. The Company took over the duchy and placed it under the Aragonese kings of Sicily; Catalans ruled Athens and Thebes until 1388.
    facts:
      - [Battle of Apros, "July 1305, Catalan victory"]
      - [Battle of Halmyros, "15 March 1311, Catalan victory; Walter of Brienne killed"]
      - [Catalan Duchy of Athens, 1311–1388]
    markers:
      - kind: held
        side: cat
        name: Gallipoli
        date: 21 June 1305
        text: A garrison of about 1,500 under Muntaner and Rocafort beat off the Byzantine army besieging the town.
        lonlat: [26.67, 40.414]
      - kind: battle
        side: cat
        name: Battle of Apros
        date: July 1305
        text: The Alans fled and the Turkish auxiliaries changed sides; Michael IX was unhorsed and carried from the field by his guards. Thrace lay open to the Catalans.
        lonlat: [27.521, 40.967]
      - kind: event
        side: cat
        name: Kassandreia
        date: 1307–1308
        text: The Company wintered behind the old wall across the neck of the Kassandra peninsula and raided Chalcidice from there.
        lonlat: [23.413, 40.048]
      - kind: event
        side: cat
        name: Mount Athos
        date: 1307–1308
        text: The Catalans and their Turkish allies plundered the monasteries of the Holy Mountain.
        lonlat: [24.327, 40.158]
      - kind: held
        side: byz
        name: Thessalonica
