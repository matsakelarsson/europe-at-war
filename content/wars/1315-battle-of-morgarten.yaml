id: battle-of-morgarten
name: Battle of Morgarten
start: "1315"
end: "1315-11-15"
tier: C
summary: The first great victory of the Swiss Confederates over the Habsburgs. After men of Schwyz raided the Habsburg-protected abbey of Einsiedeln in January 1314, and with the Forest Cantons backing Louis the Bavarian against the Habsburg Frederick the Fair in the disputed royal election of that year, Duke Leopold I of Austria marched on Schwyz. On 15 November 1315 men of Schwyz, Uri and Unterwalden ambushed his column of knights on the narrow path between Lake Ägeri and Sattel, killing many and driving others into the lake. Less than a month later the three cantons renewed their alliance in the Pact of Brunnen.
