id: bruce-campaign-in-ireland
name: Bruce campaign in Ireland
start: "1315-05-26"
end: "1318-10-14"
tier: C
summary: The invasion of Ireland by Edward Bruce, brother of Robert I of Scotland, who landed near Larne in May 1315 at the invitation of Domnall Ó Néill of Tír Eógain and was proclaimed High King of Ireland. With Irish allies he beat the forces of the Lordship of Ireland at Connor, Kells and Skerries and took Carrickfergus, and Robert joined him in 1317 for a march as far as Limerick. The campaign came during the Great Famine and devastated much of Ireland; it ended when Edward was defeated and killed at Faughart, near Dundalk, on 14 October 1318.
countries: [ie, gb]
sides:
  - id: sco
    name: Scots and their Irish allies
    polities: [scotland, irish-lordships]
    ink: navy
  - id: ire
    name: Lordship of Ireland
    polities: [ireland, england]
    ink: red
notes:
  - The campaign was part of the First War of Scottish Independence, a second front against England. Its destruction is hard to separate from that of the Great Famine of 1315–1317, which struck Ireland at the same time.
