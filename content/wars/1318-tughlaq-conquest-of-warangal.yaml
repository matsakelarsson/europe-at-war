id: tughlaq-conquest-of-warangal
name: Tughlaq conquest of Warangal
start: "1318"
end: "1323"
tier: C
summary: "The campaigns that ended the Kakatiya kingdom of Telangana and made it a province of the Delhi Sultanate. The Kakatiya king Prataparudra had been a tributary of Delhi since Malik Kafur’s siege of Warangal in 1310. When he stopped paying, Sultan Qutb al-Din Mubarak Shah sent his general Khusrau Khan, who besieged Warangal in 1318 and forced Prataparudra to hand over 100 elephants, 12,000 horses and treasure and to give up five districts. Under the new Tughluq dynasty the tribute again stopped, and Ghiyath al-Din Tughluq sent his son Ulugh Khan, the future Muhammad bin Tughluq. His first siege of Warangal broke up when a false rumour of the sultan’s death set off a revolt in his camp, and the Kakatiya army chased him back to Devagiri. Within months he returned, took the outlying forts of Badrikot and Bodhan and, after a siege of about five months, forced Prataparudra to surrender in 1323. The king was sent towards Delhi as a prisoner and died on the way, probably by his own hand on the banks of the Narmada. Delhi’s rule in Telangana lasted only until 1336, when Kapaya Nayaka drove out its governor."
