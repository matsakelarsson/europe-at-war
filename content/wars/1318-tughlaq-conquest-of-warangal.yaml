notes:
  - "The dates of Ulugh Khan’s first siege differ between sources (1321, 1322 or early 1323). The end of Prataparudra’s life is known only from hints: a Musunuri inscription of 1330 says he died on the Narmada while being taken to Delhi, and a Reddi inscription of 1423 that he “departed to the world of the gods by his own desire”."
