notes:
  - Andronikos III was disinherited after his men killed his brother Manuel by mistake in 1320; their father, the co-emperor Michael IX, died soon after. The war came in three rounds, separated by agreements in 1321 and 1322 and by Andronikos III’s coronation as co-emperor in 1325.
