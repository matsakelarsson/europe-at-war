id: byzantine-civil-war-of-1321-1328
name: Byzantine civil war of 1321–1328
start: "1321"
end: "1328-05-24"
tier: C
summary: A struggle for the throne between the elderly Emperor Andronikos II Palaiologos and his grandson Andronikos III, whom he had disinherited in 1320. Backed by ambitious young nobles such as John Kantakouzenos, Syrgiannes Palaiologos and Theodore Synadenos, the younger Andronikos raised Thrace against his grandfather in 1321 and forced him to share the empire. Fighting flared up again in 1322 and in 1327–1328, when the Serbian king Stefan Dečanski backed the old emperor and the Bulgarian tsar Michael Shishman the young one. Thessalonica went over to Andronikos III early in 1328, and on the night of 23–24 May he entered Constantinople; his grandfather abdicated and died as a monk in 1332. While the Byzantines fought each other, the Ottomans took Prusa (Bursa) in 1326.
