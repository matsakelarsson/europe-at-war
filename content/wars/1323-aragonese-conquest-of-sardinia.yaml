steps:
  - title: Villa di Chiesa and Cagliari
    date: 1323–1326
    when: "1323-04-11"
    borders: "1324-06-19"
    countries: [it, es]
    body:
      - In 1297 Pope Boniface VIII had granted Sardinia and Corsica to James II of Aragon in return for his giving up Sicily, but the island was not his to take. Pisa ruled the south and east, the Genoese Doria and Malaspina families much of the north, and the Judicate of Arborea, the last of Sardinia’s native kingdoms, the west. In April 1323 Judge Hugh II of Arborea declared himself James’s vassal and attacked the Pisans. On 13 June an Aragonese fleet of some 300 ships under James’s heir, the Infante Alfonso, landed at Palma di Sulcis in the south-west.
      - Alfonso besieged the silver-mining town of Villa di Chiesa (Iglesias), which held out for seven months until hunger forced it to surrender on 7 February 1324, while malaria took a heavy toll of his army. He then turned on Cagliari. On 29 February a Pisan relief army was beaten at Lucocisterna, near Elmas, and the same day the Aragonese fleet beat the Pisan ships off Cagliari. In the peace of June 1324 Pisa gave up its Sardinian lands, keeping only the castle of Cagliari as a fief; after another war it lost that too in 1326. Its Pisan people were expelled, and Cagliari, settled by Catalans, became the capital of the Kingdom of Sardinia.
    facts:
      - [Landing at Palma di Sulcis, 13 June 1323]
      - [Surrender of Villa di Chiesa, 7 February 1324]
      - [Battle of Lucocisterna, "29 February 1324, Aragonese victory"]
