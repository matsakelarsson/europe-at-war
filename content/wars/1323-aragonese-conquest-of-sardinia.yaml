notes:
  - Medieval Sardinia was divided into four judicates (giudicati), native kingdoms ruled by judges. By 1323 only Arborea survived; Pisa held the former judicates of Cagliari and Gallura, and the Genoese Doria and Malaspina families and the city of Sassari held most of the north.
  - Arborea fought on Aragon’s side in 1323–1324 and against it from 1353. The war of 1353–1420 is often called the Sardinian–Catalan or Sardinian–Aragonese war, and was broken by several truces and peaces (1355, 1388).
