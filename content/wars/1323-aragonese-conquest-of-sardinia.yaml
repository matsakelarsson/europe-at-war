  - title: The war with Arborea
    date: 1353–1420
    when: "1353"
    borders: "1420"
    countries: [it, es]
    body:
      - Aragon struggled to hold the island. The Doria rebelled repeatedly with Genoese backing, and in 1353 Judge Marianus IV of Arborea, who wanted the whole of Sardinia for his own house, joined them. That August an Aragonese and Venetian fleet beat the Genoese off Porto Conte, and in 1354 King Peter IV took Alghero, expelled its people and resettled it with Catalans, whose language is still spoken there. Marianus’s armies overran most of the island in the 1360s, leaving Aragon little more than Cagliari and Alghero. His daughter Eleanor, who ruled for her sons from 1383, kept up the struggle and in about 1392 issued the Carta de Logu, a law code that stayed in force until 1827.
      - In 1409 Martin the Younger, King of Sicily and heir to Aragon, brought an army to Sardinia. On 30 June at Sanluri he crushed the army of Arborea and its Genoese allies under the new judge, William III of Narbonne, a French grandson of Eleanor’s sister; thousands of Sardinians were killed. Martin died of malaria at Cagliari on 25 July, but Oristano surrendered in 1410, and its lord, Leonardo Cubello, became Marquis of Oristano under the crown. William held out in the north until 1420, when he sold his remaining rights to Alfonso V for 100,000 gold florins. Castelsardo, the last Doria stronghold, fell in 1448.
    facts:
      - [Battle of Porto Conte, "27 August 1353, Aragonese and Venetian victory"]
      - [Battle of Sanluri, "30 June 1409, Aragonese victory"]
      - [Arborean rights sold, "1420, for 100,000 florins"]
    markers:
