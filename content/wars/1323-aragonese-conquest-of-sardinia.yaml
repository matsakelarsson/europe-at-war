        side: ara
        name: Battle of Sanluri
        date: 30 June 1409
        text: Martin’s Aragonese, Sicilian and Catalan troops broke the Arborean army in a single day. Sardinians remember the battle as sa battalla.
        lonlat: [8.9, 39.56]
      - kind: event
        name: Cagliari
        date: 25 July 1409
        text: Martin the Younger died here of fever, leaving his father Martin I of Aragon without a legitimate heir.
        lonlat: [9.12, 39.22]
