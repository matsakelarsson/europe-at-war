id: aragonese-conquest-of-sardinia
name: Aragonese conquest of Sardinia
start: "1323-04-11"
end: "1420"
tier: B
summary: The long conquest of Sardinia by the Crown of Aragon, to which the pope had granted the island in 1297. The Infante Alfonso took the Pisan lands in 1323–1324, creating the Kingdom of Sardinia, but Aragon then fought the Doria and Genoa and, from 1353, the native Judicate of Arborea, which at times held most of the island; Martin the Younger’s victory at Sanluri in 1409 broke Arborea, and its last judge sold his rights in 1420.
