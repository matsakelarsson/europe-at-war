id: peasant-revolt-in-flanders
name: Peasant revolt in Flanders
start: "1323-11"
end: "1328-08-23"
tier: C
summary: A rising of the peasants of coastal Flanders against the taxes and officials of Count Louis of Nevers, partly levied to pay the fines of the Treaty of Athis-sur-Orge. It began with rural riots in late 1323 and grew into a rebellion led by the farmer Nicolaas Zannekin, joined by Bruges and Ypres, which captured the count at Kortrijk in 1325. A peace made at Arques in 1326 soon broke down, and in 1328 the new French king, Philip VI, came to the count’s aid and crushed the rebel army at Cassel on 23 August, followed by harsh reprisals.
countries: [be, fr]
