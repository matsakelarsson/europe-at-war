id: war-of-saint-sardos
name: War of Saint-Sardos
start: "1324-08"
end: "1325-03-31"
tier: C
summary: A short war in which Charles IV of France seized most of the English king’s duchy of Aquitaine. It grew out of a dispute over a French bastide at Saint-Sardos in the Agenais, which a Gascon lord, Raymond-Bernard of Montpezat, burned in October 1323, hanging a royal sergeant. Charles declared the duchy forfeit, and in August–September 1324 Charles of Valois overran most of it, taking La Réole from the Earl of Kent after a siege. A truce negotiated by Queen Isabella in 1325 left the French in possession of their conquests, and her stay in France led to Edward II’s overthrow.
countries: [fr, gb]
sides:
  - id: fra
    name: France
    polities: [france]
    ink: navy
  - id: eng
    name: England
    polities: [england]
    ink: red
notes:
  - Historians see the war as one of the forerunners of the Hundred Years’ War. Under the settlement the Agenais stayed in French hands, and English Gascony was reduced to a coastal strip around Bordeaux and Bayonne.
