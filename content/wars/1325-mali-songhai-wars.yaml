id: mali-songhai-wars
name: Mali and Gao
start: "1325"
end: "1464"
tier: C
summary: "The long contest for Gao and the middle Niger between the Mali Empire and the Songhai kings of Gao. Malian armies probably conquered the kingdom of Gao in the late thirteenth century, between about 1275 and 1300; the Timbuktu chronicles date its submission to Mansa Musa’s pilgrimage of 1324–1325, when he built a mosque at Gao on his way home, and Ibn Battuta, who passed through Gao in 1353, still found it part of Mali. Malian rule was not continuous: the ruler of Gao paid tribute and broke away whenever Mali was in difficulty. Songhai tradition tells how two princes held at the Mali court, Ali Kolon and Sulayman Nar, slipped away, beat off the horsemen sent after them and made themselves independent at Gao, founding the Sonni dynasty; its date is uncertain, but Gao seems to have been free of Mali by the end of the fourteenth century, when Mali was weakened by succession quarrels. Mali held Timbuktu and the inland Niger delta for longer. A Mossi army sacked Timbuktu in the 1330s, but Malian governors returned and stayed until the Tuareg took the town in 1433. The last Sonni kings before Sonni Ali carried the war west: Sonni Madawu raided Niani, the Malian capital, and carried off twenty-four groups of the mansa’s servile people, and Sonni Sulayman Dama sacked Mema, the centre of Mali’s Soninke province. Sonni Ali’s conquests from 1464 made Gao the master of the Niger bend."
