notes:
  - "Almost everything known comes from the two Timbuktu chronicles of the seventeenth century (the Tarikh al-Sudan and the Tarikh al-Fattash), from Ibn Battuta and Ibn Khaldun, and from Songhai tradition. The date of Mali’s conquest of Gao is disputed: Maurice Delafosse put it in 1324–1325, Charles Monteil and later historians earlier. The story of Ali Kolon’s escape is a legend whose date historians place anywhere from the thirteenth to the late fourteenth century."
