id: polish-teutonic-war-1326
name: Polish–Teutonic War, 1326–1332
start: "1326"
end: "1332"
tier: C
summary: A war between the Kingdom of Poland under Władysław I the Elbow-high and the Teutonic Order, which had seized Gdańsk Pomerania in 1308 and was allied with King John of Bohemia. The Order overran Kuyavia and the Dobrzyń Land; the battle of Płowce on 27 September 1331 was hard fought and indecisive, and a truce in 1332 left the Order holding its conquests. By the Treaty of Kalisz in 1343 it returned Kuyavia and Dobrzyń, while Poland gave up its claim to Pomerania and the Chełmno Land.
