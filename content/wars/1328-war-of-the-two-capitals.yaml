id: war-of-the-two-capitals
name: War of the Two Capitals
start: "1328-09"
end: "1332-03"
tier: C
summary: "The succession war of the Yuan dynasty after the death of the emperor Yesün Temür at Shangdu in August 1328, fought between a court at Dadu (Beijing) and a court at Shangdu, the summer capital. In Dadu the Kipchak commander El Temür, whose family had risen under the emperor Khayishan, seized power in September and brought Khayishan’s son Tugh Temür to the throne; at Shangdu the Muslim minister Dawlat Shah enthroned Yesün Temür’s young son Ragibagh in October. The Shangdu armies, drawing on Mongolia, Liaodong, Shaanxi, Sichuan and Yunnan, broke through the Great Wall passes and reached the outskirts of Dadu, but El Temür held the capital, and while the Shangdu forces were engaged on the wall, princes of the eastern wing on the Dadu side surrounded Shangdu on 14 November 1328. It surrendered the next day; Dawlat Shah and most of the Shangdu leaders were executed, and Ragibagh, about eight years old, disappeared. The loyalists in Shaanxi gave up in December and those in Sichuan in January 1329. Tugh Temür stood down for his elder brother Kusala, who was proclaimed khan north of Karakorum on 27 February 1329 but died on 30 August, four days after a banquet with Tugh Temür, probably poisoned on El Temür’s orders; Tugh Temür took the throne again on 8 September 1329. In Yunnan Prince Tugel, with the help of local peoples, held out against the Dadu court until March 1332. It was the bloodiest succession struggle in Yuan history, and left El Temür in control of the court until his death in 1333."
