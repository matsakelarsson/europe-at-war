  - title: Sabr ad-Din’s war
    date: February – spring 1332
    when: "1332-02"
    borders: "1332-02-18"
    countries: [et]
    body:
      - Sabr ad-Din seized goods being carried for the emperor from Zeila and, according to the chronicle, set out not merely to free Ifat but to rule all Ethiopia, appointing governors for the Christian provinces and calling the war a jihad. Dawaro and Hadiya joined him, and he sent three columns against Amhara, Angot and Shewa.
      - The emperor marched east on 24 Yakatit (about 18 February 1332) with the troops he could gather; many soldiers at first refused to follow him into the hot, roadless lowlands. An advance force drove Sabr ad-Din from his camp, and the main army burned his capital, although he escaped. He then tried to make peace through Queen Jan Mengesha, who refused, and finally surrendered. Amda Seyon spared his life, kept him prisoner and appointed his brother Jamal ad-Din governor of Ifat.
    facts:
