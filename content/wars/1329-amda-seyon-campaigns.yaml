id: amda-seyon-campaigns
name: Amda Seyon’s campaigns against Ifat and its allies
start: "1329"
end: "1332"
tier: B
summary: "Wars of the Ethiopian emperor Amda Seyon I (r. 1314–1344) against the Muslim sultanate of Ifat and the states of the south and east that made the Solomonic kingdom the leading power of the Horn of Africa. After campaigns against Damot and Hadiya in 1316–1317, Amda Seyon invaded Ifat when its sultan Haqq ad-Din I had his envoy, returning from Mamluk Cairo, put to death. In 1332 Haqq ad-Din’s brother Sabr ad-Din rose against him, joined by Hadiya and Dawaro, and the Muslims of Adal and Mora under the religious leader Salih joined in. In a long campaign told in the chronicle known as the Glorious Victories of Amda Seyon, the emperor defeated them one after another, installed a succession of Walashma princes in Ifat as his vassals, and extended his overlordship over Dawaro, Hadiya, Bale and the lands across the Awash. Arab writers of the time, among them al-Umari, list seven Muslim states in the region, all paying tribute to the Christian king."
countries: [et, dj, so]
