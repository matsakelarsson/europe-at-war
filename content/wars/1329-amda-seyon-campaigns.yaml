notes:
  - "The main source is the Glorious Victories of Amda Seyon, an Ethiopian chronicle that tells the war from the emperor’s side, with long speeches and religious framing. Most editors treat it as nearly contemporary; Bertrand Hirsch has argued that it is a later epic that condenses a longer conflict. The Muslim side is known mainly from Arab writers in Egypt and Syria (al-Umari, later al-Maqrizi)."
  - "The great campaign is dated to 1332 by most scholars (Dillmann, Conti Rossini, Cerulli, Taddesse Tamrat); Huntingford, following James Bruce, dated it to 1329. The dates of the first invasion of Ifat are uncertain."
  - Many of the places named in the chronicle (Talag, Das, Bequlzar, Dilhoya) cannot be located today, so the regions are drawn as approximate areas.
