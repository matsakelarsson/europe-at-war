steps:
  - title: Hadiya, Damot and the envoy killed in Ifat
    date: 1316 – about 1329
    when: "1328"
    borders: "1328-01-01"
    countries: [et]
    body:
      - Amda Seyon came to the throne in 1314, the fifth ruler of the Solomonic line that had taken power from the Zagwe in 1270. His kingdom was a mobile court and army moving between the highlands of Amhara and Shewa, surrounded by states it did not rule. To the south-west lay the non-Christian kingdom of Damot and the Muslim kingdom of Hadiya; to the east, along the escarpment and the Awash valley, the Muslim sultanate of Ifat of the Walashma dynasty, which controlled the caravan trade with the port of Zeila, and beyond it Dawaro, Bale and the Muslim communities of Adal.
      - A note in a manuscript of the island monastery of Lake Hayq dates his campaigns against Damot and Hadiya to 1316–1317. Amano, the king of Hadiya, had refused tribute; the chronicle blames a Muslim preacher it calls Bel’am. Amda Seyon invaded, carried Amano and many of his people away and settled them elsewhere, and Hadiya became a tributary.
      - In about 1320 the Mamluk sultan al-Nasir Muhammad was persecuting the Copts in Egypt and closing churches. Amda Seyon sent envoys to Cairo threatening reprisals against Muslims in his kingdom, and, according to the chronicle, to divert the Nile. On the way home his envoy Ti’yintay was seized by Haqq ad-Din I, sultan of Ifat, and put to death when he refused to convert. Amda Seyon invaded Ifat, sacked its capital and towns, and pillaged its provinces, taking many prisoners. Muslim forces struck back at Christian districts, and in Menz the emperor’s men defeated one of them and killed its leader, Dedadir, a son of Haqq ad-Din. Haqq ad-Din was succeeded by his brother Sabr ad-Din.
