  - title: Adal and the lands beyond the Awash
    date: spring – autumn 1332
    when: "1332-06"
    borders: "1332-10-01"
    countries: [et, dj, so]
    body:
      - Instead of going home before the rains, as his troops wished, Amda Seyon stayed in the lowlands. The Muslims of Adal and Mora, led by the religious leader Salih, raised an army from the clans of the region and attacked his camp at night; the chronicle says the emperor was struck from behind, killed his attacker, and that the attackers were pursued to a river and cut down. Jamal ad-Din now joined Salih, and at a place the chronicle calls Das they tried to surround the emperor, who, though ill, defeated them.
      - Amda Seyon then took Talag, which the chronicle calls the capital of Adal, where the governor’s brother and sons surrendered. Back in Ifat he deposed Jamal ad-Din for refusing to hand over Christians who had converted to Islam and appointed another brother, Nasir ad-Din. Further raids reached Dilhoya, the pastoralists of the Warjih and Sharkha, whose governor he imprisoned. The Muslim states from Ifat to Dawaro, Bale and Hadiya now paid him tribute, and Christian military colonies were settled in the borderlands.
      - The war set the pattern of the next two centuries. Ifat’s Walashma sultans kept their dynasty as vassals but rose again and again, until their heirs moved east and founded the sultanate of Adal, which in the 16th century came close to destroying the Christian kingdom.
    facts:
      - [Night attack and the battle of Das, "1332"]
      - [Nasir ad-Din, "made governor of Ifat"]
      - [Tributaries, "Ifat, Dawaro, Hadiya, Bale and Sharkha"]
