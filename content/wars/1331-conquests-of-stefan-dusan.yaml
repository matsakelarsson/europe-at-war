notes:
  - Dates are Julian. Dušan’s titles grew with his conquests; Serbian documents use “Romans” or “Greeks” for the Byzantines, and he was crowned “Emperor of the Serbs and Romans”.
  - The Byzantine civil wars of 1321–1328 and 1341–1347, which made many of these conquests possible, have their own entries.
