id: conquests-of-stefan-dusan
name: Conquests of Stefan Dušan
start: "1330-07-28"
end: "1355-12-20"
tier: B
summary: The expansion of medieval Serbia to its greatest extent under King, later Emperor, Stefan Dušan. After the Serbian victory over Bulgaria at Velbazhd in 1330, Dušan took the throne from his father and, exploiting the Byzantine civil wars, conquered Macedonia, Albania, Epirus and Thessaly. In 1346 he was crowned Emperor of the Serbs and Greeks at Skopje, but his empire broke apart soon after his death in 1355.
