steps:
  - title: Velbazhd and the conquest of Macedonia
    date: 1330–1345
    when: "1330-07-28"
    borders: "1345-09-25"
    countries: [rs, bg, mk, al, gr, xk]
    body:
      - Alarmed by Serbia’s advance into northern Macedonia, the Bulgarian tsar Michael Shishman and the Byzantine emperor Andronikos III agreed to attack it together. Before the Byzantines arrived, King Stefan Dečanski and his son Dušan caught the Bulgarian army near Velbazhd (Kyustendil) on 28 July 1330. The Bulgarians were routed and Michael Shishman was mortally wounded; Dečanski’s nephew Ivan Stefan was put on the Bulgarian throne. The following year nobles eager for southern conquests turned against Dečanski, and Dušan seized power; he was crowned king on 8 September 1331, and his father died in prison at Zvečan soon after.
      - Dušan made peace with Bulgaria, marrying Helena, the sister of its new tsar Ivan Alexander, and turned south. With the help of the Byzantine rebel Syrgiannes he took Ohrid, Prilep and Strumica, which the Byzantines recognised as Serbian in 1334. When the Byzantine civil war broke out in 1341 he backed first John Kantakouzenos and then the regency in Constantinople, while his armies took Albania except Durrës, the towns of western Macedonia and, on 25 September 1345 after a long siege, Serres.
    facts:
      - [Battle of Velbazhd, "28 July 1330, Serbian victory"]
      - [Dušan crowned king, 8 September 1331]
      - [Serres taken, 25 September 1345]
