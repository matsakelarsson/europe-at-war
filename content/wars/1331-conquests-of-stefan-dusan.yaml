  - title: Emperor of the Serbs and Greeks
    date: 1346–1355
    when: "1346-04-16"
    borders: "1348"
    countries: [mk, gr, al, rs, xk, tr, ba]
    body:
      - On Easter Sunday, 16 April 1346, an assembly at Skopje raised the Serbian archbishopric to a patriarchate with its seat at Peć, and the new patriarch crowned Dušan Emperor of the Serbs and Romans, with the Bulgarian patriarch and monks of Mount Athos present; Constantinople’s patriarch excommunicated him. In 1347–1348, as the Black Death ravaged the Byzantine lands, his armies took Epirus, Aetolia and Thessaly. Dušan made his half-brother Simeon Uroš governor of Epirus and the general Preljub governor of Thessaly. His law code, proclaimed at Skopje in 1349, was meant to bind the many peoples of his realm together.
      - Dušan’s empire now stretched from the Danube to the Gulf of Corinth, but Thessalonica and Constantinople were beyond him without a fleet, and Venice refused to lend him one. In 1350 Kantakouzenos, now emperor, briefly won back Veria and Edessa with Turkish help. In 1352 a Serbian force sent to help John V against Kantakouzenos was beaten near Didymoteicho by Ottoman troops under Orhan’s son Süleyman. Dušan beat off a Hungarian invasion in 1354 and died, aged about 47, on 20 December 1355. Under his son Uroš V the provinces fell away to their governors.
    facts:
      - [Coronation at Skopje, 16 April 1346]
      - [Thessaly taken, "1348"]
      - [Death of Dušan, 20 December 1355]
