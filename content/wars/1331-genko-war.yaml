  - title: Chihaya, Mount Senjō and the fall of Rokuhara
    date: 1332–1333
    when: "1333-06-19"
    borders: "1333"
    countries: [jp]
    body:
      - "At the end of 1332 Masashige reappeared and retook Akasaka, and Prince Morinaga, who had given up his post as head of the Tendai school to fight, raised troops at Yoshino and sent out orders calling the warriors to arms. In early 1333 Kamakura sent a great army against them. Yoshino and upper Akasaka fell, but Masashige held Chihaya, a mountain fort on Mount Kongō, for about three months with a small garrison, using rocks, fire, raids on the besiegers’ camps and, the Taiheiki says, armoured straw dummies to draw their arrows. The news of the siege spread across Japan; Akamatsu Norimura rose in Harima and marched on Kyoto, and Kikuchi Taketoki attacked the shogunate’s headquarters in Kyushu and was killed."
      - "In the leap second month Go-Daigo escaped from Oki with the help of the shipowner Nawa Nagatoshi and set up his court on Mount Senjō in Hōki, where his supporters beat off the provincial governor. Kamakura sent Ashikaga Takauji and Nagoe Takaie west. Takaie was killed by Akamatsu’s men, and Takauji, whose family descended from the Minamoto and had long married into the Hōjō, declared for Go-Daigo at the shrine of Shinomura in Tanba on the 29th day of the fourth month. With Akamatsu Norimura and Sasaki Dōyo he stormed Rokuhara on 19 June 1333. The two deputies fled east with the emperor Kōgon and two retired emperors; one was killed on the way, and the other, Hōjō Nakatoki, killed himself with more than 400 followers at the temple of Renge-ji at Banba in Ōmi. The besiegers of Chihaya broke up."
    facts:
