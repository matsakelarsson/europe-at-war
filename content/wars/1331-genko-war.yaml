notes:
  - "The war is named after the era name Genkō, which Go-Daigo proclaimed in 1331 and Kamakura did not recognise. Much of the familiar story, including Masashige’s stratagems at Chihaya and the tide that let Nitta Yoshisada past Inamuragasaki, comes from the Taiheiki, a war chronicle completed decades later, and its numbers are not reliable."
