steps:
  - title: Kasagi and Akasaka
    date: 1331–1332
    when: "1331-10"
    borders: "1331"
    countries: [jp]
    body:
      - "By the early fourteenth century the Hōjō regents ruled through puppet shōguns, and the imperial family was split between two rival lines that took turns on the throne under Kamakura’s supervision. Many warriors were impoverished by the cost of guarding the coast after the Mongol invasions and by the division of their lands among heirs, and armed bands the documents call akutō, “evil bands”, defied estate owners and officials. Go-Daigo, who came to the throne in 1318, wanted to rule in person and to keep the throne in his own line. A first plot was discovered in 1324; in the spring of 1331 one of his closest advisers, Yoshida Sadafusa, revealed a second one to the shogunate’s deputies at Rokuhara on 5 June 1331."
      - In the eighth month Go-Daigo slipped out of the palace, reportedly in women’s clothes, and took refuge with the regalia in the temple on Mount Kasagi above the Kizu River, while Kusunoki Masashige rose in his support at his fort of Akasaka in Kawachi. The shogunate’s armies, among them Ashikaga Takauji and Nitta Yoshisada, took Kasagi in the ninth month; Go-Daigo fled and was captured. Masashige held Akasaka with stratagems such as a false outer wall that collapsed on the attackers, then burned the fort in the tenth month and disappeared. Kamakura put Kōgon of the rival line on the throne, executed several of Go-Daigo’s advisers, and in 1332 exiled him to the Oki Islands.
