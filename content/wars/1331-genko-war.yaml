id: genko-war
name: Genkō War
start: "1331-06-05"
end: "1333-07-17"
tier: B
summary: "The war in which Emperor Go-Daigo and the warriors who rallied to him overthrew the Kamakura shogunate and the Hōjō family that had ruled it as regents for more than a century. Go-Daigo, determined to rule in person rather than through retired emperors or the shogunate, was betrayed by an adviser in 1331, fled to the mountain temple of Kasagi and was captured; Kamakura enthroned his rival Kōgon and exiled him to the Oki Islands in 1332. His son Prince Morinaga and Kusunoki Masashige, a warrior of Kawachi, kept up the fight, and Masashige’s defence of Chihaya against a huge besieging army in 1333 encouraged risings across the country. Go-Daigo escaped from Oki and raised his banner at Mount Senjō in Hōki. The shogunate sent Ashikaga Takauji, head of a great Minamoto branch family, against him, but Takauji changed sides and took Rokuhara, the shogunate’s headquarters in Kyoto, on 19 June 1333. Days later Nitta Yoshisada rose in Kōzuke, defeated the Hōjō armies on the plains of Musashi and broke into Kamakura, where the regent Hōjō Takatoki and some 800 of his family and followers killed themselves on 4 July 1333. The shogunate’s headquarters in Kyushu fell three days later, and Go-Daigo returned to Kyoto to begin the Kenmu Restoration."
countries: [jp]
