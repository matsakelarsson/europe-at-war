  - title: Nitta Yoshisada and the fall of Kamakura
    date: June–July 1333
    when: "1333-07-04"
    borders: "1333"
    countries: [jp]
    body:
      - "On 20 June 1333, a day after the fall of Rokuhara, Nitta Yoshisada, a Minamoto warrior of Kōzuke who had served in the siege of Chihaya, raised Go-Daigo’s banner at the Ikushina shrine near his home and marched south. Takauji’s young son, the future shōgun Yoshiakira, joined him, and warriors flocked to the army, which grew to tens of thousands. Yoshisada met the Hōjō armies at Kotesashi, where they fell back after two days of fighting, and on 27–28 June at Bubaigawara on the Tama River, where he defeated Hōjō Yasuie after a first setback."
      - "Yoshisada attacked Kamakura from three sides, but the narrow cuttings through the hills that ringed the city were strongly held, and the attack on the Gokurakuji pass stalled. On 3 July his men got round the cape of Inamuragasaki along the beach at low tide, which the Taiheiki turned into a miracle answering Yoshisada’s offering of his sword to the sea, and broke into the city. After a day of street fighting Hōjō Takatoki, the former regent, and the remnants of the government, some 800 people, killed themselves at Tōshō-ji, the Hōjō family temple, on 4 July 1333. The shogunate’s headquarters in Kyushu was taken on 7 July, and on 17 July Go-Daigo entered Kyoto and set Kōgon aside."
    facts:
      - [Nitta Yoshisada rises, "20 June 1333"]
      - [Battle of Bubaigawara, "27–28 June 1333"]
      - [Fall of Kamakura, "4 July 1333"]
      - [Suicides at Tōshō-ji, "Hōjō Takatoki and about 800 others"]
      - [Go-Daigo returns to Kyoto, "17 July 1333"]
