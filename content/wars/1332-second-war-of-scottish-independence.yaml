id: second-war-of-scottish-independence
name: Second War of Scottish Independence
start: "1332-08-06"
end: "1357-10-03"
tier: C
summary: The war that followed the death of Robert I, when Edward Balliol, son of King John, and the “Disinherited” nobles invaded Scotland in 1332 with English backing and routed the regent’s army at Dupplin Moor. Edward III joined in and won at Halidon Hill in 1333, and Balliol ceded much of southern Scotland to him, but supporters of the young David II, who was sent to safety in France, won back most of the kingdom by 1341. David was captured at Neville’s Cross in 1346 and released by the Treaty of Berwick in 1357 for a ransom of 100,000 marks.
countries: [gb]
sides:
  - id: sco
    name: David II’s Scotland
    polities: [scotland]
    ink: navy
  - id: eng
    name: Edward Balliol and England
    polities: [england]
    ink: red
notes:
  - The war became bound up with the Hundred Years’ War, as France backed David II and the Scots invaded England in 1346 to help Philip VI. Balliol gave up his claim to the Scottish crown to Edward III in 1356, the year of the English raid on Lothian remembered as the Burnt Candlemas. Berwick stayed in English hands.
