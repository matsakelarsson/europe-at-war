  - title: Warangal, Vijayanagara and Bengal
    date: 1336–1343
    when: "1336"
    borders: "1338"
    countries: [in, bd]
    body:
      - In Telangana a league of Telugu chiefs led since about 1330 by Prolaya Nayaka of the Musunuri family had already freed the Godavari country from Delhi’s rule. In 1336 his cousin and successor Kapaya Nayaka drove the governor Malik Maqbul out of Warangal, and Maqbul fled to Delhi. On the Tungabhadra, near the ruins of Kampili, the brothers Harihara and Bukka founded a new kingdom in 1336, with its capital at Vijayanagara. The Hoysala king Ballala III, ruling from Tiruvannamalai, won back much of his land and fought the Madurai sultans until they captured and killed him in 1343.
      - In Bengal, after the governor Bahram Khan died in 1336 or 1337, his armour-bearer Fakhruddin Mubarak Shah made himself independent at Sonargaon, and the province split into rival sultanates, which Shamsuddin Ilyas Shah united in 1352. Muhammad, struggling with famine in the north and revolts nearer home, could not send armies everywhere at once.
    facts:
      - [Kapaya Nayaka takes Warangal, "1336"]
      - [Vijayanagara founded, "1336"]
      - [Fakhruddin independent in Bengal, "1338 (or 1334)"]
      - [Ballala III killed, "1343"]
    markers:
