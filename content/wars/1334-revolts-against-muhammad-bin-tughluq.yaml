steps:
  - title: Ma’bar breaks away
    date: 1326–1335
    when: "1335"
    borders: "1335"
    countries: [in]
    body:
      - Muhammad bin Tughluq, sultan from 1325, ruled the largest empire Delhi ever held. To govern the Deccan he moved much of Delhi’s elite to Devagiri, renamed Daulatabad, in 1327, and his token copper currency, his heavy taxes and his harsh punishments made him many enemies. The first rising in the south, by his cousin Bahauddin Gurshasp in 1326–1327, was crushed. Gurshasp fled to the Hindu kingdom of Kampili on the Tungabhadra, which the sultan’s army destroyed, and he was handed over and put to death.
      - In 1334 or 1335 Jalaluddin Ahsan Shah, the governor of Ma’bar, the Tamil country, declared himself sultan at Madurai. Muhammad marched south in 1335, but an epidemic broke out in his army in the Deccan, he fell ill himself and turned back to Daulatabad, and Ma’bar was lost for good. Famine in northern India and risings nearer Delhi kept him from trying again.
    facts:
      - [Daulatabad made a second capital, "1327"]
      - [Madurai Sultanate founded, "1334–1335 (Firishta says 1340)"]
      - [Epidemic in the sultan’s army, "1335"]
