id: revolts-against-muhammad-bin-tughluq
name: Revolts against Muhammad bin Tughluq
start: "1334"
end: "1347-08-03"
tier: B
summary: "The break-up of the Delhi Sultanate’s empire in the south and east under Muhammad bin Tughluq (1325–1351), whose realm at its height reached from the Punjab to Madurai. In 1334–1335 the governor of Ma’bar founded the Madurai Sultanate, and an epidemic forced the sultan’s army back from the Deccan. In 1336 Kapaya Nayaka drove the Delhi governor out of Warangal, and Harihara and Bukka founded the Vijayanagara kingdom on the Tungabhadra; the Hoysalas recovered for a time, and Bengal went its own way from 1338. In 1345–1347 the commanders of the Deccan and Gujarat rose against the sultan’s tax officials, seized Daulatabad and, after defeating his generals, crowned Zafar Khan as Alauddin Bahman Shah, founder of the Bahmani Sultanate, on 3 August 1347."
countries: [in, bd]
sides:
  - id: dl
    name: Delhi Sultanate
    polities: [delhi-sultanate]
    ink: green
    moves: Delhi moves
    success: Delhi success
  - id: reb
    name: Rebels and breakaway states
    polities: [madurai-sultanate, musunuri, vijayanagara, hoysalas, bengal-sultanate, bahmani]
    ink: red
