notes:
  - "The main sources are the chronicler Barani, who served at Muhammad’s court, the Moroccan traveller Ibn Battuta, who lived in Delhi from 1334 to 1342, Isami and, later, Firishta, with Telugu and Kannada inscriptions for the southern kingdoms. Several dates are uncertain by a year or two: coins date the Madurai Sultanate to 1335 while Firishta gives 1340, and Fakhruddin’s independence in Bengal is dated 1334 or 1338."
  - The early lives of Harihara and Bukka are known mainly from later tradition, which says that they served the kingdom of Kampili, were taken prisoner by the sultan’s army and became Muslims in his service, and were sent back south to restore order, only to found a kingdom of their own and return to Hinduism. Historians disagree on how much of this is true.
