  - title: The Deccan revolt and the Bahmani Sultanate
    date: 1345–1347
    when: "1347-08-03"
    borders: "1347-08-03"
    countries: [in]
    body:
      - In 1345–1346 Muhammad sent new officials to squeeze more revenue out of Gujarat and the Deccan and to watch the amiran-i sada, the “commanders of a hundred” who held the land, many of them Afghans, Turks and Mongol converts. They rose in revolt. The sultan crushed the rising in Gujarat himself, but at Daulatabad the commanders killed the officers sent to fetch them, shared out the treasury and made the Afghan noble Ismail Mukh their king. Muhammad marched south, beat the rebels and besieged them in the citadel of Daulatabad for three months, until a new rising in Gujarat under Taghi drew him away.
      - The rebels then gathered under Zafar Khan, also called Hasan, who defeated and killed the sultan’s general Imad al-Mulk and routed the army besieging Daulatabad. Ismail Mukh stood down in his favour, and on 3 August 1347 the commanders crowned him as Alauddin Hasan Bahman Shah. He made Gulbarga his capital. Muhammad chased Taghi into Sindh, where he died near Thatta on 20 March 1351, and his successor Firuz Shah made no serious attempt to win back the Deccan.
    facts:
      - [Revolt at Daulatabad, "1345–1346"]
      - [Siege of Daulatabad, "three months, abandoned"]
      - [Bahman Shah crowned, "3 August 1347"]
    markers:
      - kind: siege
        side: reb
        name: Daulatabad
        date: 1346–1347
        text: Seized by the rebels and besieged by the sultan. The besiegers he left behind were routed by Zafar Khan.
        lonlat: [75.215, 19.943]
      - kind: capital
        side: reb
        name: Gulbarga
        date: from 1347
        text: Capital of the new Bahmani Sultanate, renamed Ahsanabad.
        lonlat: [76.82, 17.33]
      - kind: event
        side: dl
        name: Broach (Bharuch)
        date: 1345–1347
        text: The sultan put down the risings in Gujarat from here and marched on Daulatabad.
        lonlat: [72.98, 21.7]
