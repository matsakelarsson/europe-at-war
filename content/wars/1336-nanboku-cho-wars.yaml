  - title: Akiie, Yoshisada and the death of Go-Daigo
    date: 1337–1339
    when: "1338-06-10"
    borders: "1338"
    countries: [jp]
    body:
      - "Nitta Yoshisada took Go-Daigo’s sons Tsunenaga and Takanaga north to Echizen, where the shogunate’s armies besieged them in the fort of Kanegasaki on the bay of Tsuruga; it fell in the third month of 1337, the crown prince Takanaga killed himself and Tsunenaga was captured. In the autumn of 1337 Kitabatake Akiie marched south from Mutsu a second time, took Kamakura at the end of the year and pushed on through Mino, where he defeated an Ashikaga army at Aonogahara early in 1338, towards Nara. Kō no Moronao, Takauji’s chief commander, stopped him, and on 10 June 1338 Akiie was defeated and killed at Ishizu near Sakai, aged twenty. On 17 August 1338 Yoshisada was killed by an arrow in a skirmish at Fujishima in Echizen."
      - "Takauji was appointed shōgun by the Northern Court in the eighth month of 1338. Go-Daigo died at Yoshino on 19 September 1339, sword in hand according to the Taiheiki, and was succeeded by his son Go-Murakami. Kitabatake Chikafusa, Akiie’s father and the chief strategist of the Southern Court, tried to build a base in the east and held out in forts in Hitachi from 1338 to 1343, where he wrote the Jinnō shōtōki, a history of Japan arguing the Southern line’s right to rule."
