  - title: Prince Kaneyoshi and Kyushu
    date: 1336–1372
    when: "1359-08-29"
    borders: "1359"
    countries: [jp]
    body:
      - "In 1336 Go-Daigo sent his young son Prince Kaneyoshi to Kyushu as seisei taishōgun, general for the subjugation of the west. It took the prince six years to land in Satsuma and more to reach Higo, where from 1348 he made his headquarters with the Kikuchi family, whose head Kikuchi Takemitsu became his commander. The quarrels of the Ashikaga gave them their chance: Tadafuyu’s campaign in Kyushu split the shogunate’s supporters, and when the Shōni turned back against the South, Kikuchi Takemitsu and the prince met Shōni Yorihisa and his allies on the Chikugo River on 29 August 1359."
      - "The battle of the Chikugo River, or of Ōhoharu, was the largest of the Nanboku-chō wars in Kyushu; later accounts give 40,000 men to the South and 60,000 to the Shōni, and both the prince and Takemitsu were wounded. The Shōni were defeated, and in 1361 the prince took the Dazaifu and made it the seat of his government. By 1365 most of Kyushu acknowledged him. When envoys of the new Ming dynasty arrived to demand the suppression of the wokou, the Japanese and Korean raiders of the coasts of China and Korea, the prince eventually sent tribute, and the Ming emperor recognised him as “Ryōkai, King of Japan”."
      - "In 1370 the shogunate appointed Imagawa Sadayo, a capable general and poet who took the name Ryōshun as a monk, as its commissioner for Kyushu. He crossed to Kyushu in 1371 with armies converging from several directions, took the Dazaifu in 1372, and over the next decade drove the Southern forces back into Higo. The Ming envoys who arrived in 1372 to invest the prince found the Dazaifu in Ryōshun’s hands. Kaneyoshi died in 1383, and Southern resistance in Kyushu faded in the following years."
    facts:
      - [Battle of the Chikugo River, "29 August 1359, Southern victory"]
      - [Dazaifu taken by Prince Kaneyoshi, "1361"]
      - [Dazaifu retaken by Imagawa Sadayo, "1372"]
      - [Death of Prince Kaneyoshi, "1383"]
