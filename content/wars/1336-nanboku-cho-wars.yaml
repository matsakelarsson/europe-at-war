notes:
  - "Which court was legitimate became a political question in modern Japan: in 1911 the government declared the Southern Court the legitimate line, and Kusunoki Masashige was celebrated as a model of loyalty to the emperor until 1945. Historians now describe the war as a long struggle among provincial warrior families and within the Ashikaga house, in which the rival courts often served as banners."
  - "The Taiheiki, a chronicle completed in the 1370s, is the main narrative source and the origin of many famous episodes; Kitabatake Chikafusa’s Jinnō shōtōki argues the Southern Court’s case. Day dates are the Julian equivalents of the Japanese lunar dates given by Japanese historians; some English accounts date Minatogawa to 5 July 1336."
