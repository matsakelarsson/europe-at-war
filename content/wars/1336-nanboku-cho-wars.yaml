  - title: Shijōnawate and the burning of Yoshino
    date: 1347–1348
    when: "1348-02-04"
    borders: "1348"
    countries: [jp]
    body:
      - "For a decade the Southern Court was confined to the mountains of Yoshino and to scattered strongholds in the provinces. In 1347 Masashige’s son Kusunoki Masatsura came out of Kawachi and defeated the shogunate’s armies twice, at Fujii-dera and at Sumiyoshi, so that the shogunate sent its leading commanders, Kō no Moronao and his brother Moroyasu, with a large army."
      - "On 4 February 1348 Masatsura attacked Moronao’s camp between Nozaki and Kitajō, at the foot of the Ikoma hills in Kawachi, and drove him back, but his army was overwhelmed; he and his brother Masatoki killed each other to avoid capture, and dozens of Southern commanders died. Moronao marched on to Yoshino, where Emperor Go-Murakami had already fled, and burned the palace and temples. The Southern Court moved deeper into the mountains to Anō. The victory made Moronao the strongest man in the shogunate, which led to its split."
    facts:
