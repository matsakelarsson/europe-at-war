  - title: The Kannō disturbance
    date: 1349–1355
    when: "1351"
    borders: "1351"
    countries: [jp]
    body:
      - "The shogunate had been run jointly by Takauji, who led the warriors, and his brother Tadayoshi, who directed the government and its courts. Tadayoshi’s quarrel with Kō no Moronao came to a head in 1349, when Moronao surrounded Takauji’s residence and forced Tadayoshi into retirement as a monk. Tadayoshi’s adopted son Ashikaga Tadafuyu, an unacknowledged son of Takauji, raised the west and Kyushu in his name. At the end of 1350 Tadayoshi escaped from Kyoto and went over to the Southern Court. His army took Kyoto in the first month of 1351 and defeated Takauji at Uchidehama in Settsu, and in the peace that followed Moronao and Moroyasu were killed by Tadayoshi’s supporters by the Muko River as they were being escorted to the capital."
      - "The brothers’ reconciliation lasted only months. In the tenth month of 1351 Takauji in turn submitted to the Southern Court, accepting Go-Murakami as sole emperor in what was called the Shōhei unity, and marched against Tadayoshi, defeating him at the Satta pass on the Tōkaidō in the twelfth month and taking him prisoner at Kamakura. Tadayoshi died there suddenly on 12 March 1352, poisoned according to the Taiheiki."
      - "The Southern Court used the unity to strike: in 1352 its forces took Kyoto, drove out Takauji’s son Yoshiakira and carried off the three retired emperors of the Northern Court and the crown prince to Anō. The shogunate retook the city within a month, and had to set up a new northern emperor without the regalia. Southern armies, joined by Tadafuyu and former followers of Tadayoshi, took Kyoto again in 1353 and 1355, and once more in 1361, but could never hold it."
    facts:
