id: nanboku-cho-wars
name: Nanboku-chō wars
start: "1335"
end: "1392-11-19"
tier: A
summary: "The civil wars of the Northern and Southern Courts, in which the Ashikaga shogunate and the emperors it set up in Kyoto fought the line of Emperor Go-Daigo, which kept its court in the mountains of Yoshino, for more than half a century. Ashikaga Takauji, who had helped Go-Daigo overthrow the Kamakura shogunate in 1333, broke with him in 1335. Driven to Kyushu early in 1336, he returned with a new army, destroyed Kusunoki Masashige at Minatogawa on 4 July 1336, took Kyoto and put Kōmyō of the rival imperial line on the throne. Go-Daigo escaped to Yoshino in January 1337 and proclaimed himself the true emperor. His generals Kitabatake Akiie and Nitta Yoshisada were killed in 1338, the year Takauji became shōgun, and Go-Daigo died in 1339, but the Southern Court survived, aided by the quarrel between Takauji and his brother Tadayoshi in the Kannō disturbance of 1350–1352, when both brothers allied with the South in turn and southern armies took Kyoto four times. In Kyushu, Go-Daigo’s son Prince Kaneyoshi and the Kikuchi family defeated the shogunate’s supporters on the Chikugo River in 1359 and ruled most of the island until Imagawa Sadayo retook the Dazaifu in 1372. The third shōgun, Ashikaga Yoshimitsu, ended the war by negotiation: on 19 November 1392 the southern emperor Go-Kameyama returned to Kyoto and handed the regalia to the northern emperor Go-Komatsu."
countries: [jp]
