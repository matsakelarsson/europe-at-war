  - title: The reunion of the courts
    date: "1392"
    when: "1392-11-19"
    borders: "1392-11"
    countries: [jp]
    body:
      - "Under the third shōgun, Ashikaga Yoshimitsu, who came to power as a boy in 1368, the shogunate gradually brought the great provincial families under control; in 1391 he broke the power of the Yamana, who held a sixth of the provinces of Japan, in the Meitoku rebellion. Chihaya and the other Southern strongholds in Kawachi fell, and the Southern Court was confined to the mountains of Yoshino. Through Ōuchi Yoshihiro, the governor of the neighbouring provinces of Izumi and Kii, Yoshimitsu opened negotiations."
      - "On the 27th day of the tenth month (12 November 1392) the two sides agreed that Go-Kameyama would hand over the regalia in a ceremony of abdication, that the throne would in future alternate between the two lines, and that the provincial public lands would go to the Southern line and the Chōkōdō estates to the Northern. On 16 November 1392 Go-Kameyama came from Yoshino to the Daikaku-ji temple in Kyoto, and on 19 November the regalia were taken from there to Go-Komatsu’s palace. The Northern Court, which had not been consulted, treated the transfer as a simple return of the regalia, and the promise of alternation was never kept: in 1412 Go-Komatsu passed the throne to his own son. Descendants and followers of the Southern line, called the Later Southern Court, raised revolts into the fifteenth century."
