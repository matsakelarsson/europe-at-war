  - title: Tatarahama, Minatogawa and the two courts
    date: 1336–1337
    when: "1336-07-04"
    borders: "1336"
    countries: [jp]
    body:
      - "In Kyushu Takauji was joined by the Shōni, Ōtomo and Shimazu, and on 13 April 1336 at Tatarahama, outside Hakata, his much smaller army defeated the Kikuchi and other supporters of Go-Daigo. He sailed east with a fleet that grew as the warriors of the Inland Sea and Shikoku joined him, while his brother Tadayoshi led an army along the coast road. Masashige advised Go-Daigo to abandon the capital and trap Takauji in it, but the courtiers refused, and he was ordered to join Nitta Yoshisada at Hyōgo."
      - "On 4 July 1336 the Ashikaga attacked at the mouth of the Minato River from the land and the sea. Yoshisada’s army, fearing that the fleet would land behind it, fell back eastward, and Masashige’s small force was surrounded and destroyed; he and his brother Masasue killed themselves after fighting through the day. Takauji entered Kyoto, and in the eighth month put Kōmyō, Kōgon’s brother, on the throne. Go-Daigo, besieged on Mount Hiei, came to terms and handed over the regalia, and in the eleventh month Takauji’s government issued the Kenmu Code, its programme of rule."
      - "On 23 January 1337 Go-Daigo escaped to Yoshino in the mountains south of Nara, declared that the regalia he had surrendered were copies and that he was still the rightful emperor, and set up his court there. Two imperial courts now faced each other, the Northern Court in Kyoto and the Southern Court in Yoshino, and they would last for 56 years."
    facts:
      - [Battle of Tatarahama, "13 April 1336, Ashikaga victory"]
      - [Battle of Minatogawa, "4 July 1336, Ashikaga victory"]
      - [Kōmyō enthroned, "eighth month of 1336"]
      - [Go-Daigo escapes to Yoshino, "23 January 1337"]
