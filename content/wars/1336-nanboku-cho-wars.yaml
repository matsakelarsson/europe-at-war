steps:
  - title: Takauji breaks with Go-Daigo
    date: 1335–1336
    when: "1336-02"
    borders: "1336"
    countries: [jp]
    body:
      - "Go-Daigo’s Kenmu Restoration disappointed many of the warriors who had fought for him: rewards were slow and uneven, and the emperor gave the highest posts to courtiers and to his sons. In the seventh month of 1335 Hōjō Tokiyuki, the young son of Hōjō Takatoki, rose in Shinano and took Kamakura in what was called the Nakasendai rebellion. Ashikaga Takauji marched east without the emperor’s leave, retook Kamakura and stayed there, granting lands to his followers on his own authority. Go-Daigo declared him a rebel and sent Nitta Yoshisada against him, but Takauji defeated Yoshisada at Takenoshita in the Hakone mountains in the twelfth month and pursued him to the capital, which he entered early in 1336."
      - "Go-Daigo had fled to Mount Hiei, and his allies converged on the capital: Kitabatake Akiie, governor of Mutsu, brought his northern army south at great speed, and with Nitta Yoshisada and Kusunoki Masashige he drove Takauji out of Kyoto and defeated him again at Teshima-gawara in Settsu in March 1336. Takauji fled by sea to Kyushu, gathering support in the west on the way and obtaining an order from the retired emperor Kōgon of the rival imperial line, which gave him a cause of his own."
    facts:
