id: hundred-years-war
name: Hundred Years’ War
start: "1337-05-24"
end: "1453-10-19"
tier: A
summary: A long series of wars and truces between the kings of England and France, fought over the English king’s lands in France and his claim, from 1340, to the French crown. England won the great battles of Sluys, Crécy, Poitiers and Agincourt and at times ruled much of France, but France recovered its lost lands in the 1370s and again after Joan of Arc and the relief of Orléans in 1429, and by 1453 England held only Calais.
countries: [fr, gb, be, nl, es]
sides:
  - id: eng
    name: England and its allies
    polities: [england]
    ink: red
    moves: English and allied moves
    success: English success
  - id: fra
    name: France and its allies
    polities: [france, scotland, castile]
    ink: navy
    moves: French and allied moves
    success: French success
  - id: bur
    name: Burgundy
    polities: [burgundy]
    ink: purple
    moves: Burgundian moves
    success: Burgundian success
notes:
  - The name Hundred Years’ War was coined in the 19th century. Historians often divide the fighting into an Edwardian phase (1337–1360), a Caroline phase (1369–1389) and a Lancastrian phase (1415–1453), separated by long truces. No peace treaty ended it.
  - Dates are Julian, as was usual at the time. The English year then began on 25 March, but years here begin on 1 January.
  - Chronicles give armies and losses that are often far too large. Numbers here follow modern estimates where they exist, and historians still disagree about many of them, Agincourt’s in particular.
  - Sluys is today’s Sluis in the Netherlands and Agincourt is Azincourt. Guyenne was the French name for the English king’s duchy of Aquitaine, which by 1337 meant little more than Gascony around Bordeaux and Bayonne.
  - The Breton War of Succession (1341–1365), the Jacquerie (1358) and the Armagnac–Burgundian Civil War (1407–1435) have their own entries.
