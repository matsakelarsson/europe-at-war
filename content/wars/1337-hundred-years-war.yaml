        side: eng
        name: Battle of Verneuil
        date: 17 August 1424
        text: Called a second Agincourt by the English. The Scots, who had said they would give no quarter, were given none.
        lonlat: [0.94, 48.755]
      - kind: siege
        side: fra
        name: Orléans
        date: 12 October 1428 – 8 May 1429
        text: The English ringed the city with forts but never closed it off. The storming of the Tourelles, the fort at the bridge, on 7 May decided the siege.
        lonlat: [1.909, 47.903]
        lp: l
      - kind: battle
        side: eng
        name: Battle of the Herrings
        date: 12 February 1429
        text: Fastolf’s wagons, carrying salt fish for Lent, were drawn up as a fort, and the French and Scots attack on them failed.
        lonlat: [1.733, 48.067]
        lp: t
      - kind: battle
        side: fra
        name: Battle of Patay
        date: 18 June 1429
        text: The French vanguard under La Hire and Poton de Xaintrailles charged before the English were ready, and the archers bore most of the losses. Joan was with the main army, behind.
        lonlat: [1.705, 48.03]
        lp: b
      - kind: event
        side: fra
        name: Chinon
        date: March 1429
        text: Joan met Charles in the castle and convinced him and his theologians, who questioned her at Poitiers, to let her go to Orléans.
        lonlat: [0.244, 47.168]
      - kind: event
        side: fra
        name: Reims
        date: 17 July 1429
        text: Charles was anointed and crowned in the cathedral, the traditional place for French coronations, deep in territory held by his enemies.
        lonlat: [4.034, 49.254]
      - kind: held
        side: eng
        name: Paris
        date: 8 September 1429
        text: An attack on the walls by Charles’s army failed, and Joan was wounded by a crossbow bolt.
        lonlat: [2.352, 48.857]
