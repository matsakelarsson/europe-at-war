  - title: Castillon and the fall of Bordeaux
    date: 1451–1453
    when: "1451-05"
    borders: "1453-10-19"
    countries: [fr, gb]
    body:
      - In the spring of 1451 French armies under Jean de Dunois entered Guyenne. Blaye, Bourg and Fronsac fell, Bordeaux agreed terms and opened its gates on 30 June, and Bayonne surrendered in August. But the Gascons had been ruled by English kings for three hundred years, their wine trade with England was their living, and many resented the new king’s taxes. Bordeaux invited the English back, and on 23 October 1452 John Talbot, Earl of Shrewsbury, then in his sixties, was let into the city with 3,000 men. Much of western Gascony went over to him.
      - In 1453 three French armies converged on Guyenne. One besieged Castillon on the Dordogne, where Jean Bureau built a fortified camp packed with guns. On 17 July Talbot, told that the French were retreating, attacked the camp before all his troops had come up. His men were cut down by the guns and then routed by Breton cavalry, and Talbot and his son were killed. Bordeaux held out until 19 October 1453.
      - No peace treaty ended the war, and no one at the time knew it was over. Calais stayed English until 1558, and English and later British monarchs called themselves kings of France until 1801. The war had devastated much of France. Many historians think it strengthened royal power and a sense of nationhood in both kingdoms, and in England defeat helped to bring on the Wars of the Roses, which began within two years.
    facts:
      - [Bordeaux surrenders, "30 June 1451, and again 19 October 1453"]
      - [Battle of Castillon, "17 July 1453, French victory"]
      - [Left to England, "Calais, until 1558"]
    markers:
      - kind: taken
        side: fra
        name: Blaye
        date: May 1451
        text: The fortress on the Gironde estuary fell after a short siege, opening the way to Bordeaux.
        lonlat: [-0.663, 45.128]
      - kind: event
        side: eng
        name: Soulac
        date: 17 October 1452
        text: Talbot’s fleet landed in the Médoc, north of Bordeaux, where the citizens opened the gates to him six days later.
        lonlat: [-1.12, 45.51]
      - kind: taken
