  - title: Agincourt
    date: 1389–1415
    when: "1415-08-13"
    borders: "1415-10-25"
    countries: [fr, gb]
    body:
      - For a generation the war went on mostly in truces. One agreed at Leulinghem in 1389 was extended in 1396, when Richard II married the French king’s daughter Isabella. Richard was deposed in 1399 by his cousin Henry of Lancaster, while in France Charles VI suffered bouts of madness from 1392 and his kinsmen fought to control the government. After the Duke of Burgundy’s men murdered the king’s brother, Louis of Orléans, in 1407, the Burgundian and Armagnac factions slid into civil war, and both sought English help. Henry V, king from 1413, revived the claim to the French throne and demanded the Brétigny lands and Normandy.
      - On 13 August 1415 Henry landed near Harfleur, at the mouth of the Seine, with about 12,000 men. The town held out until 22 September, and dysentery killed or disabled many of his men. Henry left a garrison and set out with perhaps 6,000–9,000 men to march to Calais. Finding the fords of the Somme guarded, he had to go far upstream before crossing on 19 October, and on 24 October a much larger French army, led by the Constable Charles d’Albret and the great lords of the Armagnac party, blocked his road near Azincourt.
      - On 25 October, St Crispin’s Day, the French men-at-arms advanced on foot across a narrow, freshly ploughed and rain-soaked field between two woods. Shot at by archers from both flanks, they crowded together and were cut down or crushed in the mud when they reached the English line. Fearing a renewed attack, Henry ordered many of the prisoners to be killed. Several thousand French died, among them the Constable and the dukes of Alençon, Bar and Brabant, and Charles of Orléans was taken prisoner. The English lost a few hundred at most, among them the Duke of York.
    facts:
      - [Siege of Harfleur, "18 August – 22 September 1415"]
      - [Battle of Agincourt, "25 October 1415, English victory"]
      - [French dead, "several thousand, including many great nobles"]
