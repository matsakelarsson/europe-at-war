  - title: The Jacquerie and the Treaty of Brétigny
    date: 1358–1360
    when: "1358-02-22"
    borders: "1360-10-24"
    countries: [fr, gb]
    body:
      - In Paris Étienne Marcel, provost of the merchants, led the Estates’ demands for reform, and on 22 February 1358 his followers murdered two of the dauphin’s marshals in front of him. The dauphin left the city. In late May the peasants of the Beauvaisis rose against the nobles, whom they blamed for the defeat and for the plundering of the countryside. Bands of rebels, the Jacques, burned manor houses and killed noble families. On 9–10 June the nobles struck back. Charles of Navarre routed the main rebel army near Mello, and knights relieved the fortified market of Meaux; thousands of peasants were killed in the reprisals. Marcel was killed in Paris on 31 July.
      - In London King John agreed to treaties ceding half his kingdom, but the Estates-General rejected the second of them in May 1359. Edward landed at Calais in October with one of the largest armies of the war and besieged Reims, where he probably meant to be crowned, from December to January. The city held. He moved into Burgundy, whose duke paid him to leave, and then towards Paris, but the dauphin would not fight. On 13 April 1360, near Chartres, a violent hailstorm killed many men and horses in the English army, a day remembered as Black Monday.
      - At Brétigny near Chartres a treaty was drawn up on 8 May 1360 and ratified at Calais on 24 October. Edward was to give up his claim to the French throne, and John to give up sovereignty over an enlarged Aquitaine, which Edward would hold outright, with Calais, Guînes and Ponthieu. John’s ransom was set at three million gold écus. The two renunciations were put in a separate agreement that was never carried out, which left both kings grounds to reopen the war. John went home, but when a son left as a hostage broke his parole, he returned to captivity in London and died there in 1364.
    facts:
      - [Jacquerie, "late May – June 1358"]
      - [Treaty of Brétigny, "8 May 1360, ratified at Calais 24 October 1360"]
      - [Ransom of John II, three million gold écus]
    markers:
