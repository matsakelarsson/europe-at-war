  - title: Verneuil, Orléans and Reims
    date: 1423–1429
    when: "1423-07-31"
    borders: "1429-07-17"
    countries: [fr, gb]
    body:
      - Henry’s brother John, Duke of Bedford, governed Lancastrian France as regent for the infant Henry VI, in alliance with Burgundy. Charles VII, mocked as the “king of Bourges”, held the lands south of the Loire, and Scotland sent him thousands of soldiers. The allies won at Cravant in 1423, and on 17 August 1424 at Verneuil Bedford destroyed a Franco-Scottish army in one of the bloodiest battles of the war; some 6,000 French and Scots were killed, among them the earls of Douglas and Buchan. The English went on to conquer Maine.
      - In October 1428 the English laid siege to Orléans, which guarded the crossings of the Loire. The Earl of Salisbury was killed by a cannon shot early in the siege, and in February 1429 John Fastolf beat off an attack on a supply convoy at Rouvray, the Battle of the Herrings. In March a peasant girl from Domrémy, Joan of Arc, who said that the voices of saints had sent her to drive out the English and have the dauphin crowned, won over Charles at Chinon. She entered Orléans with a relief convoy on 29 April, the French took the English forts one by one, and on 8 May the English abandoned the siege.
      - In June the French took Jargeau, Meung and Beaugency, and on 18 June they caught the English army in the open at Patay before its archers could set their stakes; John Talbot was among those captured. Charles then marched through enemy-held Champagne, where Troyes and Châlons opened their gates, and on 17 July 1429 he was crowned in Reims Cathedral, with Joan beside him. An attack on Paris that September failed.
    facts:
      - [Battle of Verneuil, "17 August 1424, English victory"]
      - [Siege of Orléans, "12 October 1428 – 8 May 1429"]
      - [Coronation of Charles VII, "17 July 1429, Reims"]
