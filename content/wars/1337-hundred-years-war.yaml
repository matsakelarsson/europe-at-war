steps:
  - title: Sluys and the claim to the throne
    date: 1337–1340
    when: "1337-05-24"
    borders: "1340-09-25"
    countries: [fr, gb, be, nl]
    body:
      - When Charles IV of France died in 1328 without a son, the French nobles chose his cousin Philip of Valois as king, passing over Edward III of England, whose claim came through his mother Isabella, Charles’s sister. Edward, who was also Duke of Aquitaine, did homage to Philip VI for Gascony. But quarrels over the duchy, French help for the Scots and Edward’s shelter of Philip’s enemy Robert of Artois led Philip to confiscate Gascony on 24 May 1337. Edward bought allies in the Low Countries and the Empire, and French and Genoese galleys raided the English coast, burning much of Southampton in October 1338.
      - Flanders depended on English wool, but its count was loyal to France. In 1338 the cloth towns, led by Jacob van Artevelde of Ghent, took control of the county and came to terms with Edward. At Ghent on 26 January 1340 Edward took the title King of France, so that the Flemish could support him without breaking their oath to the French crown. On 24 June he attacked the French fleet gathered in the Zwin estuary at Sluys. Its ships, chained together in three lines, were taken one by one; most were captured, both French commanders died, and some 16,000–20,000 men were killed or drowned.
      - That summer Edward and his allies besieged Tournai, while a Flemish army under Robert of Artois was routed outside Saint-Omer. Tournai held out, Edward ran out of money, and on 25 September 1340 the two kings agreed the Truce of Esplechin. Sluys gave England command of the Channel, but the war had settled nothing.
    facts:
      - [Gascony confiscated, 24 May 1337]
      - [Battle of Sluys, "24 June 1340, English victory"]
      - [Truce of Esplechin, 25 September 1340]
