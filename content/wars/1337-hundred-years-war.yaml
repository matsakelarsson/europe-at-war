  - title: Joan’s death, Arras and Paris
    date: 1430–1436
    when: "1430-05-23"
    borders: "1436-04-13"
    countries: [fr, gb]
    body:
      - On 23 May 1430 Joan was captured by Burgundian troops during a sortie from Compiègne, and John of Luxembourg, in whose hands she was held, sold her to the English. A church court at Rouen, led by Pierre Cauchon, Bishop of Beauvais, tried her for heresy, and she was burned in the city’s market place on 30 May 1431, aged about 19. Henry VI, aged ten, was crowned king of France in Notre-Dame in Paris that December, but the Lancastrian cause was weakening, and Philip the Good was tiring of the alliance.
      - At a peace congress at Arras in 1435 the English would not give up the claim to the French throne and left. On 21 September, a week after Bedford died at Rouen, Philip made a separate peace with Charles VII, who disowned the murder at Montereau and ceded the towns on the Somme and the counties of Mâcon and Auxerre; Philip was released from homage for life. Risings broke out in Normandy, and the French took Dieppe and Harfleur. On 13 April 1436 the Constable, Arthur de Richemont, entered Paris with Burgundian help after the townspeople rose against the English garrison, which withdrew into the Bastille and was allowed to leave. Philip’s attempt to take Calais that summer failed.
    facts:
      - [Execution of Joan of Arc, "30 May 1431, Rouen"]
      - [Treaty of Arras, "21 September 1435, Burgundy makes peace with Charles VII"]
      - [Paris retaken, 13 April 1436]
    markers:
      - kind: event
        side: bur
        name: Compiègne
