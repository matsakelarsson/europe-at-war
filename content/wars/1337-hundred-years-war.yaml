  - title: The Truce of Tours and Formigny
    date: 1441–1450
    when: "1441-09-19"
    borders: "1450-08-12"
    countries: [fr, gb]
    body:
      - Charles VII took Pontoise in 1441. In 1444 a truce was agreed at Tours, and Henry VI married the French queen’s niece, Margaret of Anjou; Henry secretly promised to give up Maine, and Le Mans was handed over, under threat of a siege, in March 1448. Charles used the truce to reform his army, with standing companies of cavalry paid from permanent taxes, archers raised by the parishes and a powerful artillery train under the brothers Jean and Gaspard Bureau.
      - In March 1449 a captain in English pay, the Aragonese François de Surienne, sacked the Breton town of Fougères, and that summer Charles reopened the war. Town after town in Normandy surrendered, some to the guns, some to their own citizens. Rouen fell in October, and the Duke of Somerset bought his own freedom by giving up other towns and hostages, among them John Talbot. A relief army under Thomas Kyriell landed at Cherbourg in March 1450, and on 15 April it was caught at Formigny between the Count of Clermont’s army and Richemont’s Breton cavalry; most of the English were killed or captured. Caen surrendered on 1 July and Cherbourg, the last English stronghold in Normandy, on 12 August.
    facts:
      - [Truce of Tours, 28 May 1444]
      - [Battle of Formigny, "15 April 1450, French victory"]
      - [Fall of Cherbourg, "12 August 1450, end of English Normandy"]
    markers:
      - kind: taken
