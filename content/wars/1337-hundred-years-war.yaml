  - title: Charles V and Du Guesclin
    date: 1364–1380
    when: "1364-05-16"
    borders: "1380-09-16"
    countries: [fr, gb, es]
    body:
      - Charles V, king from 1364, chose to rebuild his kingdom rather than risk great battles. His captain Bertrand du Guesclin, a minor Breton noble, beat the Navarrese at Cocherel in May 1364, but in September an Anglo-Breton victory at Auray, where Charles of Blois was killed, ended the Breton war in favour of John of Montfort. To rid France of the free companies, Du Guesclin led many of them into Castile in 1366 to put Henry of Trastámara on the throne in place of his half-brother Peter. The Black Prince restored Peter by winning at Nájera on 3 April 1367, but Henry won the kingdom in 1369, and Castile became France’s ally.
      - The Nájera campaign left the prince ill and in debt, and a hearth tax he raised in Aquitaine led great Gascon lords to appeal to the king in Paris. Charles accepted the appeals as their overlord, since the renunciations of 1360 had never been made, and in 1369 the war resumed. The French avoided battle, wore down English garrisons and took towns by siege, bribery and persuasion. Du Guesclin, made Constable in 1370, destroyed part of Robert Knolles’s army at Pontvallain that December. The Black Prince retook Limoges, which had gone over to the French, and sacked it; Froissart’s figure of 3,000 dead is now thought much too high.
      - In June 1372 a Castilian galley fleet destroyed an English fleet off La Rochelle, and Poitou and Saintonge fell to the French within months. John of Gaunt marched from Calais to Bordeaux in 1373 without bringing the French to battle, losing many men and most of his horses. A truce was agreed at Bruges in 1375; the Black Prince died in 1376 and Edward III in 1377. When Du Guesclin died at the siege of Châteauneuf-de-Randon in July 1380, and Charles V that September, England held little more than Calais, Bordeaux and Bayonne with a strip of the Gascon coast, and Brest and Cherbourg.
    facts:
      - [Battle of Nájera, "3 April 1367, victory for the Black Prince and Peter of Castile"]
      - [Battle of La Rochelle, "22–23 June 1372, Castilian victory"]
      - [Deaths of Du Guesclin and Charles V, "13 July and 16 September 1380"]
