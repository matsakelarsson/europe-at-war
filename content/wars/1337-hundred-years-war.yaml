        text: After a week’s march upstream, the English crossed the river at unguarded fords near Béthencourt and Voyennes.
        lonlat: [3.0, 49.77]
      - kind: battle
        side: eng
        name: Battle of Agincourt
        date: 25 October 1415
        text: About four-fifths of Henry’s army were archers. The French dead included a large part of the nobility of northern France.
        lonlat: [2.142, 50.464]
      - kind: held
        side: eng
        name: Calais
        date: 29 October 1415
        text: Henry’s exhausted army reached Calais four days after the battle and sailed for England in November.
        lonlat: [1.856, 50.948]
