  - title: Normandy and the Treaty of Troyes
    date: 1417–1422
    when: "1417-08-01"
    borders: "1420-05-21"
    countries: [fr, gb]
    body:
      - Henry returned in August 1417 to conquer Normandy, landing at Touques. Caen was stormed on 4 September and many of its people killed. Town after town surrendered over the next year, while the Armagnac government was paralysed; in May 1418 the Burgundians seized Paris and killed hundreds of Armagnacs, among them the Count of Armagnac himself. From July 1418 Henry besieged Rouen. The city expelled more than 12,000 of its poor to save food, and Henry would not let them through his lines; many starved in the ditch below the walls. Rouen surrendered on 19 January 1419, and by the end of the year almost all of Normandy was in English hands.
      - The dauphin Charles and the Duke of Burgundy, John the Fearless, met on the bridge at Montereau on 10 September 1419 to make common cause, and the dauphin’s men killed the duke. His son Philip the Good allied with England. By the Treaty of Troyes, sealed on 21 May 1420, Charles VI recognised Henry as his heir and as regent of France, disinheriting the dauphin, and Henry married the king’s daughter Catherine on 2 June. Henry took Montereau and Melun and entered Paris with Charles VI on 1 December 1420.
      - The dauphin still held France south of the Loire, and with Scottish help his army beat the English at Baugé on 22 March 1421, killing Henry’s brother Thomas, Duke of Clarence. Henry came back to take Meaux after a siege of seven months, but he fell ill with dysentery and died at Vincennes on 31 August 1422, aged 35. Charles VI died seven weeks later. Henry’s nine-month-old son was proclaimed Henry VI, king of England and France, and the dauphin took the title Charles VII.
    facts:
      - [Siege of Rouen, "29 July 1418 – 19 January 1419"]
      - [Treaty of Troyes, "21 May 1420, Henry V heir and regent of France"]
      - [Death of Henry V, "31 August 1422, at Vincennes"]
