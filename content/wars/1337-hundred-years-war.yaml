        text: The capital of English Gascony surrendered twice. After the second time Charles VII built new forts to hold it down and took away many of its privileges.
        lonlat: [-0.58, 44.84]
      - kind: taken
        side: fra
        name: Bayonne
        date: August 1451
        text: The last English town in the south-west surrendered to Dunois and the Count of Foix.
        lonlat: [-1.48, 43.49]
      - kind: battle
        side: fra
        name: Battle of Castillon
        date: 17 July 1453
        text: The last battle of the war and one of the first decided by gunpowder artillery. A monument marks the spot where Talbot is said to have fallen.
        lonlat: [-0.019, 44.852]
