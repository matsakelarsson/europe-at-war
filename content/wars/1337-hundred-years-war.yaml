  - title: Poitiers and a captive king
    date: 1355–1357
    when: "1355-10-05"
    borders: "1357-03-23"
    countries: [fr, gb]
    body:
      - After the plague the war went on in raids, sieges and fights between garrisons, and in 1350 John II succeeded Philip VI. In October 1355 Edward, Prince of Wales, the Black Prince, led an Anglo-Gascon army from Bordeaux on a great raid, a chevauchée, across Languedoc to Narbonne on the Mediterranean. It burned the lower town of Carcassonne and hundreds of villages and returned to Bordeaux in December laden with loot. Such raids were meant to ruin the French king’s lands and revenues, show his subjects he could not protect them and draw him into battle.
      - In August 1356 the prince marched north from Bergerac towards the Loire, while Henry of Grosmont, now Duke of Lancaster, raided Normandy. Finding the Loire crossings held near Tours, the prince turned back south, and King John caught up with him near Poitiers. On 19 September about 6,000 Anglo-Gascons, fighting on foot behind hedges and marshy ground, met an attack by some 14,000–16,000 French. They threw back several assaults; then, as the king’s own division attacked, a small mounted force came round the French rear and the army broke. John and his youngest son Philip were taken, with some 2,000 knights and men-at-arms.
      - The prince took his royal prisoner to Bordeaux, where a two-year truce was agreed in March 1357, and then to London. In France the defeat discredited the nobility and the crown. The king’s son Charles, the dauphin, ruled as lieutenant, facing the Estates-General in Paris, a rival in his cousin Charles II of Navarre, and bands of unemployed soldiers who lived off the countryside.
    facts:
      - [Black Prince’s chevauchée, "October–December 1355, Bordeaux to Narbonne"]
      - [Battle of Poitiers, "19 September 1356, Anglo-Gascon victory"]
      - [Truce of Bordeaux, 23 March 1357]
