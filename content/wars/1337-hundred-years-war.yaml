  - title: Crécy and Calais
    date: 1341–1347
    when: "1341-04-30"
    borders: "1347-09-28"
    countries: [fr, gb]
    body:
      - The truce did not hold for long. In 1341 the death of Duke John III of Brittany without children set off a war of succession there, with France backing Charles of Blois, husband of the duke’s niece, and England backing the duke’s half-brother John of Montfort; it went on, with English garrisons in Brittany, until 1364. In 1345 Henry of Grosmont, Earl of Derby, won back much of the Dordogne and Garonne valleys for Edward and beat a larger French force at Auberoche. The next spring Philip’s son John, Duke of Normandy, besieged Aiguillon on the Garonne.
      - On 12 July 1346 Edward landed with some 10,000–15,000 men at Saint-Vaast-la-Hougue in the Cotentin. His army burned and plundered its way across Normandy, stormed and sacked Caen on 26 July and marched up the Seine to within sight of Paris before turning north. With Philip’s army in pursuit it forced the ford of Blanchetaque across the tidal Somme on 24 August. Two days later Edward drew up his army on a slope near Crécy-en-Ponthieu, his men-at-arms on foot and his archers on the flanks.
      - Late on 26 August the French attacked before they were fully formed. Their Genoese crossbowmen were shot down by English and Welsh longbowmen, and charge after charge of mounted knights broke against the English line until nightfall. By one count more than 1,500 French knights and squires died, among them the blind King John of Bohemia. Edward went on to besiege Calais, which held out for eleven months; Philip came to relieve it but withdrew, and the starving town surrendered on 3 August 1347. Edward expelled most of its people and settled English in their place. A truce followed in September 1347, and the next year the Black Death reached France and England.
    facts:
      - [Battle of Crécy, "26 August 1346, English victory"]
      - [Siege of Calais, "4 September 1346 – 3 August 1347"]
      - [Battle of Neville’s Cross, "17 October 1346, David II of Scotland captured"]
