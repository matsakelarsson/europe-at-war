id: sarbadar-revolt
name: Sarbadar revolt and the wars of the Sarbadars
start: "1337"
end: "1381"
tier: C
summary: After the death of the Ilkhan Abu Sa’id in 1335 the Mongol state in Iran fell apart, and in western Khorasan, where the Ilkhanid claimant Togha Temür and his emirs taxed the countryside heavily, the people of the Bayhaq district rose in revolt. In 1337 a local notable, Abd al-Razzaq, killed a tax official and took to the hills with followers who called themselves sarbadar, “heads on the gallows”, and that summer they seized Sabzevar. Under his brother Mas’ud, who shared power with the Shi’i dervish leader Hasan Juri, the Sarbadars drove Togha Temür’s forces out of Nishapur, Jajarm, Damghan and Gorgan. On 18 July 1342 they attacked the Kartids of Herat at Zawa; Hasan Juri was killed in the battle, perhaps on Mas’ud’s orders, his followers left the field and the Kartids won. In 1344 Mas’ud was captured and executed while campaigning against Togha Temür in Mazandaran, and most of the conquests were lost. Ruled by a succession of commanders and dervish leaders, several of whom were murdered, the Sarbadars killed Togha Temür in 1353, fought the Kartids, the Ja’un-i Qurban Mongols of Tus and the emir Vali of Astarabad, and lost Sabzevar for a time in about 1376 to dervishes armed by the Muzaffarids of Shiraz. In 1381 their last ruler, Ali-yi Mu’ayyad, besieged by Vali, submitted to Timur, who left him to govern Sabzevar.
