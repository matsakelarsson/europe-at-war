notes:
  - The Sarbadars had no dynasty; power passed to whoever could hold it, and the movement was split between moderate Shi’i notables and the dervishes of Shaikh Khalifa’s and Hasan Juri’s order. Dates for the later rulers are uncertain.
  - Zawa is today’s Torbat-e Heydarieh, south of Mashhad.
