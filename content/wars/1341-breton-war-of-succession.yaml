id: breton-war-of-succession
name: Breton War of Succession
start: "1341-04-30"
end: "1365-04-12"
tier: C
summary: A war for the Duchy of Brittany after Duke John III died without children in 1341, between his half-brother John of Montfort, backed by England, and Charles of Blois, husband of his niece Joan of Penthièvre, backed by France. Fought as part of the Hundred Years’ War, it saw Joanna of Flanders’ defence of Hennebont in 1342, Charles’s capture at La Roche-Derrien in 1347 and the Combat of the Thirty in 1351. It ended when Charles was killed at Auray in 1364, and by the Treaty of Guérande in 1365 Montfort’s son John IV was recognised as duke.
countries: [fr, gb]
sides:
  - id: mon
    name: Montfort and England
    polities: [england]
    ink: red
  - id: blo
    name: Blois and France
    polities: [france]
    ink: navy
notes:
  - The war is also called the War of the Two Joans, after Joanna of Flanders, Montfort’s wife, who led his party while he was a prisoner, and Joan of Penthièvre, Charles of Blois’s wife, in whose right he claimed the duchy.
