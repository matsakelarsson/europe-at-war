notes:
  - Dates are Julian. Kantakouzenos later wrote a history of these years in which he justified himself; the other main account, by Nikephoros Gregoras, is also partisan.
  - Dušan fought for Kantakouzenos in 1342–1343 and then went over to the regency, taking towns for himself throughout. Umur Bey of Aydın and, from 1345, the Ottoman ruler Orhan sent troops to Kantakouzenos; Bulgaria took Philippopolis and other Thracian towns as the regency’s price.
