  - title: Peritheorion and the road to Constantinople
    date: 1344–1347
    when: "1344"
    borders: "1347-02-08"
    countries: [gr, tr, bg]
    body:
      - The regency bought Bulgarian help with Philippopolis and other towns in northern Thrace, and courted the Rhodope warlord Momchil, a former brigand. On 7 July 1345 Kantakouzenos and Umur crushed Momchil at Peritheorion on the Aegean coast, and he was killed. Weeks earlier, on 11 June, Apokaukos had been murdered by political prisoners in the new prison he was inspecting in Constantinople. Dušan took Serres in September and was crowned emperor in 1346. Kantakouzenos had himself crowned at Adrianople on 21 May 1346 and married his daughter Theodora to the Ottoman ruler Orhan, whose troops plundered Thrace.
      - On the night of 2–3 February 1347 supporters opened the walled-up Golden Gate of Constantinople, and Kantakouzenos entered with about a thousand men. After a few days the empress gave in. A settlement on 8 February made him senior emperor for ten years beside John V, who married his daughter Helena. Thessalonica’s Zealots held out until 1350. The war had ruined Thrace, cost the empire most of its European lands to Serbia, and left Turkish soldiers familiar with the country, while the Black Death reached Constantinople that year.
    facts:
      - [Battle of Peritheorion, "7 July 1345, Momchil killed"]
      - [Murder of Apokaukos, 11 June 1345]
      - [Kantakouzenos enters Constantinople, 3 February 1347]
    markers:
      - kind: battle
        side: kan
        name: Battle of Peritheorion
        date: 7 July 1345
        text: Kantakouzenos and Umur’s Turks routed Momchil, who had set himself up as an independent prince in the Rhodopes, under the walls of the coastal town.
        lonlat: [25.091, 41.102]
      - kind: event
        side: reg
        name: Philippopolis
        date: "1344"
        text: The regency handed the town and others in northern Thrace to the Bulgarian tsar Ivan Alexander in return for an alliance.
        lonlat: [24.75, 42.15]
      - kind: taken
        side: ser
