id: byzantine-civil-war-of-1341-1347
name: Byzantine civil war of 1341–1347
start: "1341-10-26"
end: "1347-02-08"
tier: B
summary: The war for power in the Byzantine Empire after the death of Andronikos III, between his chief minister John Kantakouzenos and the regency for the boy emperor John V, led by the empress Anna of Savoy, Patriarch John Kalekas and Alexios Apokaukos. It set the landed aristocracy against the towns, where the Zealots seized Thessalonica, and both sides called in Serbs, Bulgarians and Turks. Kantakouzenos won and entered Constantinople in 1347 as co-emperor, but the war let Stefan Dušan conquer half the empire and brought the Ottomans into Thrace.
