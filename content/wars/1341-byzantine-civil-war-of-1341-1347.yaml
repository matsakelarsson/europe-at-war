steps:
  - title: Kantakouzenos against the regency
    date: 1341–1343
    when: "1341-06-15"
    borders: "1343"
    countries: [gr, tr, rs, mk]
    body:
      - Andronikos III died on 15 June 1341, leaving a nine-year-old heir, John V. His friend and chief minister, the grand domestic John Kantakouzenos, expected to govern, but while he was campaigning in Thrace the empress Anna of Savoy, Patriarch John Kalekas and the ambitious admiral Alexios Apokaukos took control in Constantinople and declared him an enemy. On 26 October 1341 his army and supporters proclaimed him emperor at Didymoteicho. The great landowners mostly sided with him; the townspeople, crushed by taxes, rose against the rich in Adrianople and elsewhere and declared for the regency.
      - In 1342 the Zealots, a popular party, seized Thessalonica and drove out the aristocrats, and Kantakouzenos, his army melting away, fled to Stefan Dušan of Serbia. With Serbian help he invaded Macedonia but failed before Serres. His fortunes turned when his friend Umur Bey, emir of Aydın, sailed up the Evros with a large fleet and relieved Didymoteicho, where Kantakouzenos’s wife Irene was besieged. Thessaly accepted his rule and he won Veria, but in 1343 Dušan, who had been taking towns for himself, went over to the regency.
    facts:
      - [Kantakouzenos proclaimed emperor, "26 October 1341, Didymoteicho"]
      - [Zealots take Thessalonica, "1342"]
