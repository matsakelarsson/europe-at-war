notes:
  - The Nagarakretagama of 1365 records the conquest of Bali in 1265 Śaka (1343) but gives no details. The names of the Balinese king and his ministers, and the story of the campaign, come from Balinese chronicles (babad) written down centuries later, which disagree on many points; Arya Damar’s identity is also disputed.
