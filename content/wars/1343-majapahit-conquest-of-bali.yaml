id: majapahit-conquest-of-bali
name: Majapahit conquest of Bali
start: "1343"
end: "1343"
tier: C
summary: "The invasion that brought the Balinese kingdom of Bedulu (Bedahulu) under the rule of Majapahit, the empire of eastern Java. Bali had long been linked to Java: Airlangga was a son of the Balinese king Udayana, and Kertanagara of Singhasari had attacked the island in 1284. Under Queen Tribhuwana Wijayatunggadewi, her chief minister Gajah Mada, who had sworn not to rest until the islands of the archipelago were united under Majapahit, sent a fleet against Bali. According to the Babad Arya Tabanan, a later Balinese chronicle, the army landed in 1342 under Gajah Mada with Arya Damar, the regent of Palembang, as his second in command, and after seven months of fighting took the royal centre at Bedulu, near today’s Gianyar, in 1343. Balinese tradition names the last king of Bedulu as Sri Astasura Ratna Bumi Banten and tells how Majapahit first got rid of his great minister Kebo Iwa and then defeated the last commander to hold out, Pasung Grigis. Majapahit gave the government of the island to Arya Damar’s brothers, among them Arya Kenceng, the ancestor of the royal houses of Tabanan and Badung, and in about 1352 installed a Javanese prince, Sri Aji Kresna Kepakisan, as vassal king at Samprangan. His descendants ruled Bali from Gelgel and kept the Hindu-Javanese court culture of Majapahit after Java itself became Muslim."
