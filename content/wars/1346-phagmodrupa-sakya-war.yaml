id: phagmodrupa-sakya-war
name: Phagmodrupa–Sakya war
start: "1346"
end: "1354"
tier: C
summary: "The struggle in which Changchub Gyaltsen, lord of the Phagmodru myriarchy in Ü, overthrew the Sakya regime that had governed Tibet for the Yuan emperors. He had fought the neighbouring Yazang myriarchy over land since the 1330s, and when he drove back a new Yazang attack in 1346, the Sakya ponchen (chief administrator) Gyalwa Zangpo lured him to a meeting at a bridge, seized him and took him to Sakya, where he was tortured; his retainers still refused to give up his castle at Nedong. Gyalwa Zangpo, who feared his rival Wangtson more, released him after some months to gain an ally. Changchub Gyaltsen beat off Wangtson’s attack and by 1349 held most of Ü, Lhasa included. In 1353 a coalition of Sakya, Drikung, Yazang and other lords attacked him and was driven back, and in 1354, when Gyalwa Zangpo asked for his help against his enemies in Tsang, Changchub Gyaltsen’s general Rinchen Zangpo won a battle on the Shab river and marched on Sakya. Fighting was halted; Sakya kept only its own lands, and most of Tsang came under Phagmodru. Tibetan tradition dates the end of Sakya rule to 1354, though feuds within Sakya went on until 1358, when Changchub Gyaltsen defeated Wangtson and left a garrison at Sakya. The Yuan court, fighting the Red Turbans, accepted the change and gave him the title tai situ in 1357. Ruling from Nedong as regent (desi), he replaced the Mongol administration with districts under castle governors (dzongpon) and revived the laws of the old Tibetan kings; the Phagmodrupa were the leading power in Tibet until the civil war of 1434."
