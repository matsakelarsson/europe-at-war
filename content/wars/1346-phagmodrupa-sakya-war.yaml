notes:
  - The main source is Changchub Gyaltsen’s own testament and autobiographical writings, which tell the story from his side. Sakya was weakened at the same time by feuds between its ponchens and between the branches of the Khön family.
  - Historians date the change of regime variously between 1354 and 1358; opposition to Phagmodru lasted until at least 1361, and Sakya was still regarded as its formal superior for some years.
