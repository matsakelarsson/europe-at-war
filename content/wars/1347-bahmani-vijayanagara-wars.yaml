  - title: Ahmad Shah’s revenge
    date: 1423–1436
    when: "1423"
    borders: "1423"
    countries: [in]
    body:
      - Ahmad Shah I took his revenge in 1423. For forty days he faced the Vijayanagara army across the Tungabhadra; then he crossed it, and in the confusion the king, Vira Vijaya Bukka, was nearly captured hiding in a sugarcane field. Ahmad did not besiege the capital but marched through the kingdom killing men and taking women and children as slaves. Firishta says he paused to celebrate each time the count of the dead reached 20,000. Vijayanagara paid its arrears of tribute, sent in a procession led by the crown prince, and gave back the Doab.
      - Ahmad then moved his capital north from Gulbarga to Bidar, further from the Vijayanagara frontier and closer to his other wars against Malwa, Gujarat and the Velama chiefs of Telangana. In Vijayanagara, Deva Raya II (1424–1446) drew his own lesson from the defeats. He enlisted Muslim horsemen and archers, gave them land and built them a mosque in his capital, and trained his Hindu soldiers in archery from horseback.
    facts:
      - [Ahmad Shah’s invasion, "1423, Bahmani victory"]
      - [Capital moved to Bidar, "1425–1429"]
