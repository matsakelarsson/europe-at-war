  - title: The Battle of Raichur
    date: 1520–1527
    when: "1520-05-19"
    borders: "1520-05-19"
    countries: [in]
    body:
      - In 1520 Krishnadevaraya marched north with a huge army to retake Raichur from Bijapur. Fernão Nunes, a Portuguese who wrote about fifteen years later, gave it as 703,000 foot, 32,600 horse and 551 elephants; historians treat the infantry figure as wildly inflated. Ismail Adil Shah crossed the Krishna to relieve the fort. On 19 May 1520 his artillery at first threw back the Vijayanagara army, but Krishnadevaraya rallied it and drove the Bijapuris back across the river. Raichur surrendered soon after its governor was killed; Portuguese soldiers under Cristóvão de Figueiredo had helped by picking off the defenders on the walls with their arquebuses.
      - Krishnadevaraya then occupied Bijapur for a time and later razed the fort of Gulbarga, and he claimed to have restored the Bahmani dynasty by placing a son of Mahmud Shah II on its throne. The victory made Vijayanagara the strongest power in the Deccan, but it pushed the sultans into alliances against it. Krishnadevaraya died in 1529. The last Bahmani sultan, Kalimullah, fled from Bidar in 1527, and the successor states fought on for the Doab until their combined armies destroyed Vijayanagara at Talikota in 1565.
