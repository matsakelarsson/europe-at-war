  - title: Deva Raya II and the war of 1443
    date: 1443
    when: "1443"
    borders: "1443"
    countries: [in]
    body:
      - In 1443 Deva Raya II, who had stopped paying tribute, survived a plot in which his brother killed several of his nobles. The Persian envoy Abdur Razzaq, who was in Vijayanagara that year, told of the plot and described the city, “such that the pupil of the eye has never seen a place like it”. Soon after, Deva Raya invaded the Doab, took Mudgal and besieged Raichur and Bankapur.
      - Sultan Alauddin Ahmad Shah II sent armies under Malik al-Tujjar Khalaf Hasan and Khan-i Zaman. In three battles near Mudgal over two months, the first won by Vijayanagara and the next two by the Bahmanis, Deva Raya’s eldest son was killed. Deva Raya agreed to pay the arrears of tribute, and the frontier went back to where it had been. It was the last great war between the two states for a generation.
    facts:
      - [Battles near Mudgal, "1443, two Bahmani victories after a Vijayanagara one"]
      - [Peace, "tribute resumed, frontier restored"]
