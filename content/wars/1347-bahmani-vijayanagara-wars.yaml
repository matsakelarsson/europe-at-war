steps:
  - title: The Doab and the first war
    date: 1347–1367
    when: "1366-07-20"
    borders: "1366-07-20"
    countries: [in]
    body:
      - The Bahmani Sultanate, proclaimed in 1347 by the officers who rebelled against Muhammad bin Tughluq, and Vijayanagara, founded in 1336 by the brothers Harihara and Bukka on the Tungabhadra, were both born of the collapse of Delhi’s rule in the Deccan. Between them lay the Raichur Doab, the rich land between the Krishna and the Tungabhadra rivers, with the strong forts of Raichur and Mudgal. For almost two centuries it was the prize of their wars, which were also fought for tribute, plunder and prestige.
      - In 1362 Sultan Muhammad Shah I attacked Kapaya Nayaka of Warangal, an ally of Bukka Raya I; he captured and executed Kapaya’s son Vinayaka Deva, and by 1364 had forced Kapaya to give up Golconda and his jewelled throne. Then he turned on Vijayanagara. In 1366 Bukka’s army took Mudgal and killed its garrison. The sultan retook it, crossed the Tungabhadra and on 20 July 1366 routed the Vijayanagara army at Kauthal, near Adoni. He went on to ravage the country around Vijayanagara and kill many of its people; Firishta’s figures run to hundreds of thousands. Peace was made in 1367, by tradition with a promise from both sides to spare prisoners and civilians in future wars, a promise often broken.
    facts:
      - [Bahmani Sultanate founded, "3 August 1347"]
      - [Golconda ceded to the Bahmanis, "about 1364"]
      - [Battle of Kauthal, "20 July 1366, Bahmani victory"]
