notes:
  - "Most of the narrative comes from Firishta, who wrote at Bijapur around 1600 and used older Bahmani histories. His numbers, armies of hundreds of thousands and massacres of “half a million”, are not reliable. Vijayanagara inscriptions and Telugu and Sanskrit works tell some wars differently, and for the 16th century the Portuguese Domingos Paes and Fernão Nunes (Nuniz) described Vijayanagara and the campaign of 1520."
  - Both sides wrote of holy war, and both destroyed temples or mosques and enslaved civilians, but historians see these as wars for land, tribute and prestige. Vijayanagara recruited Muslim cavalry and archers from the 1430s, and Hindu chiefs served the sultans.
  - "The dates of several wars differ between sources by a year or two. The breakaway states of the Bahmani Sultanate were Bijapur, Ahmadnagar and Berar (from 1490), Golconda (1518) and Bidar, where the Barid Shahis ruled in the name of the last sultans until 1527."
