id: bahmani-vijayanagara-wars
name: Bahmani–Vijayanagara wars
start: "1347"
end: "1527"
tier: A
summary: "The wars between the Bahmani Sultanate of the Deccan and the Vijayanagara Empire of the south, fought for almost two centuries over the Raichur Doab, the fertile land between the Krishna and the Tungabhadra, with its forts of Raichur and Mudgal. Both states were born in the 1330s and 1340s from the collapse of the Delhi Sultanate’s rule in the south. In repeated wars (1362–1367, 1375–1378, 1398, 1406, 1417–1420, 1423, 1443) the Bahmani sultans usually had the better of the field and forced Vijayanagara to pay tribute, but could not hold the land south of the Tungabhadra, and both sides ravaged the country and killed civilians. Under Mahmud Gawan the Bahmanis took Goa and the west coast (1472). After the sultanate broke up into five states, Krishnadevaraya of Vijayanagara won the Doab, defeating Bijapur at the Battle of Raichur in 1520; the last Bahmani sultan fled in 1527."
countries: [in]
sides:
