  - title: Firuz Shah and Deva Raya
    date: 1398–1420
    when: "1406"
    borders: "1407"
    countries: [in]
    body:
      - Under Firuz Shah (1397–1422) the wars became almost constant. In 1398 Harihara II’s army advanced to the Krishna and was beaten back, and Vijayanagara paid a large sum for peace. In 1406 a new war broke out over a quarrel that Firishta tells as a romance, Deva Raya I’s attempt to carry off a goldsmith’s daughter from near Mudgal. A Vijayanagara force sent across the Tungabhadra was beaten, the Bahmani general Fazlullah Inju took Bankapur, and Firuz’s assault on Vijayanagara failed and left him wounded. But his armies ravaged the kingdom for months until Deva Raya asked for peace. He paid a large indemnity and gave Firuz his daughter in marriage, with Bankapur as her dowry.
      - In 1417 Firuz besieged the fort of Pangal, held for Vijayanagara. The siege dragged on for two years until disease broke out in his camp, and in 1419 or 1420 Deva Raya I’s army routed the Bahmanis and pursued them into their own country, killing many prisoners. Firuz lost the lands he had gained, and in 1422, broken by the defeat, he gave up the throne to his brother Ahmad.
    facts:
      - [War of the Goldsmith’s Daughter, "1406, Bahmani victory"]
      - [Bankapur, "ceded to the Bahmanis as a dowry"]
      - [Defeat at Pangal, "1419 or 1420, Vijayanagara victory"]
    markers:
