  - title: Mahmud Gawan and the west coast
    date: 1466–1481
    when: "1472-02"
    borders: "1472-03"
    countries: [in]
    body:
      - After Deva Raya II’s death in 1446 Vijayanagara declined under weak kings, while the Gajapati king Kapilendra of Odisha raided both states. Under the vizier Mahmud Gawan, a Persian merchant who ran the Bahmani state from 1466 to 1481, the sultanate reached its greatest extent. From 1469 he campaigned along the west coast against the hill and sea forts of the Konkan, which preyed on shipping and on the trade in war horses from Arabia and Persia. In February 1472 he took Goa, with Dabhol the richest port of Vijayanagara. When Vijayanagara tried to win it back, he and the sultan Muhammad Shah III answered by besieging and taking Belgaum.
      - On 5 April 1481 Mahmud Gawan was executed on the sultan’s orders, after rivals among the Deccani nobles produced a forged letter in which he seemed to invite the Gajapati king to invade. Without him the sultanate fell apart. From 1490 the governors of Bijapur, Ahmadnagar and Berar ruled as sultans in all but name, Qasim Barid held the sultan himself at Bidar, and Golconda broke away in 1518. In Vijayanagara the general Saluva Narasimha seized the throne around 1485, and the Doab changed hands more than once in these years.
    facts:
      - [Goa taken by the Bahmanis, "February 1472"]
      - [Mahmud Gawan executed, "5 April 1481"]
      - [Bijapur, Ahmadnagar and Berar break away, "from 1490"]
