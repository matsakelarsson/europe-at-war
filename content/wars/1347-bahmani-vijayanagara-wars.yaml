  - title: Krishnadevaraya and the sultans
    date: 1501–1518
    when: "1509"
    borders: "1512"
    countries: [in]
    body:
      - In 1501 the Deccani nobles at Bidar agreed to send an army against Vijayanagara every year, a holy war that cost the sultanates more than it cost the enemy. Krishnadevaraya, of the Tuluva dynasty, came to the Vijayanagara throne in 1509, and met that year’s invasion at Diwani. The Deccani army broke, the Bahmani sultan Mahmud Shah was badly injured, and Yusuf Adil Khan, the founder of the Bijapur Sultanate, died about this time, by some accounts in the fighting.
      - In 1512 Krishnadevaraya took Raichur. He then turned east against the Gajapati kingdom of Odisha, and in 1513 a Vijayanagara army was beaten at Pangal by Quli Qutb Shah, the governor and soon sultan of Golconda. Raichur was lost again to Ismail Adil Shah of Bijapur, and the stage was set for a decisive battle.
    facts:
      - [Battle of Diwani, "1509, Vijayanagara victory"]
      - [Raichur taken by Vijayanagara, "1512"]
      - [Battle at Pangal, "1513, Golconda victory"]
