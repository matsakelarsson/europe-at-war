  - title: Adoni and the murder of Mujahid
    date: 1375–1378
    when: "1375-06"
    borders: "1377"
    countries: [in]
    body:
      - When Mujahid Shah came to the Bahmani throne in 1375 he demanded the forts of the Doab, which the two kingdoms had shared. Bukka answered that the Krishna was the true frontier, claimed Raichur and Mudgal as his family’s ancestral lands and asked for the return of the elephants taken in the last war. Mujahid invaded. Bukka avoided battle and withdrew into the hills, and for months the Bahmani armies ravaged the country and destroyed temples. An attack on Vijayanagara itself broke into its outer defences but was driven back by a relieving army, and a nine-month siege of Adoni failed when the monsoon refilled the fort’s water tanks. Peace was made, and historians still disagree on who had won.
      - On the way home, on the night of 16 April 1378, Mujahid was stabbed to death in his tent by his cousin Daud, who was himself murdered a month later. In the turmoil Vijayanagara forces advanced to the Krishna and besieged Raichur. In the far south, meanwhile, Bukka’s son Kumara Kampana had destroyed the Madurai Sultanate in the 1370s, and Vijayanagara now ruled most of the peninsula south of the Tungabhadra.
    facts:
      - [Siege of Adoni, "nine months, 1377–1378, lifted"]
      - [Mujahid Shah murdered, "16 April 1378"]
    markers:
