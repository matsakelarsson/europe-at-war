id: marinid-conquest-of-ifriqiya
name: Marinid conquests of Ifriqiya
start: "1347"
end: "1358"
tier: B
summary: "Two attempts by the Marinid sultans of Fez to add Hafsid Ifriqiya to their empire and rebuild the unity of the Maghreb that the Almohads had lost. After taking Tlemcen in 1337, Abu al-Hasan used a succession dispute among the Hafsids to march east, and in September 1347 he entered Tunis. His attempt to bring the Arab tribes of the steppe under control led to a revolt, and in April 1348 they routed his army near Kairouan; his son Abu Inan seized the throne in Fez, the Zayyanids took back Tlemcen, and Abu al-Hasan, shipwrecked off Bougie on his way home, died a fugitive in 1351. Abu Inan, having retaken Tlemcen, took Bougie in 1353 and Tunis in August 1357, but his troops forced him to turn back, and he was murdered in Fez in January 1358. The Hafsids recovered, and no Moroccan ruler tried again."
countries: [tn, dz, ma]
