steps:
  - title: Abu al-Hasan in Tunis
    date: 1347–1350
    when: "1347"
    borders: "1347-12-01"
    countries: [tn, dz, ma]
    body:
      - Abu al-Hasan, the Marinid sultan, had taken Tlemcen in 1337 and was married to Fatima, a daughter of the Hafsid sultan Abu Bakr II. When Abu Bakr died in 1346, his heir Abu al-Abbas was killed in Tunis by his brother Umar, and the Hafsid princes and governors fell out. Abu al-Hasan took the chance to intervene. Early in 1347 his army marched east through the central Maghreb, Bougie and Constantine submitted, Umar was overthrown, and in September 1347 the sultan entered Tunis. For a few months one ruler held the Maghreb from the Atlantic to Tripolitania, as the Almohad caliphs had done a century before.
      - The Arab tribes of the Ifriqiyan steppe, above all the Banu Sulaym, had grown used to collecting taxes from the farmers and towns and to being courted by rival Hafsid princes. Abu al-Hasan tried to curb these rights and bring the tribes under his own governors. They rose against him, and in April 1348 they routed his army near Kairouan. The sultan escaped, but his authority was broken. That year the Black Death reached Tunis and killed many of his court and army, and in the west his son Abu Inan, governor of Tlemcen, went to Fez and proclaimed himself sultan, while the Zayyanid princes took back Tlemcen.
      - Abu al-Hasan held on in Tunis for more than a year. In 1349 the Hafsid chamberlain Ibn Tafragin came back with the support of the tribes and installed a new Hafsid sultan, Abu Ishaq II, and Abu al-Hasan sailed west. A storm wrecked his fleet off Bougie. He reached Algiers, was beaten by the Zayyanids near the Chelif while trying to retake Tlemcen, and fled to Sijilmasa and then Marrakesh. Abu Inan defeated him on the Oum er-Rbia in May 1350, and he died in the High Atlas in May 1351.
    facts:
