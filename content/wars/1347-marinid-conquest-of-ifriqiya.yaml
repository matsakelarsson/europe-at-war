  - title: Abu Inan’s campaign
    date: 1352–1358
    when: "1352"
    borders: "1357-09-01"
    countries: [tn, dz, ma]
    body:
      - Abu Inan, who had overthrown his father, took up his plans. In 1352 he retook Tlemcen from the Zayyanids, and in 1353 he took Bougie from its Hafsid emir. In 1357 he marched east again, took Constantine, and in August 1357 his forces took Tunis; for the second time in ten years a Marinid sultan was master of Ifriqiya.
      - It lasted only weeks. His troops, far from home and unwilling to winter in Ifriqiya, forced him to turn back, and the chroniclers also blame the intrigues of his vizier. Abu Inan returned to Fez, fell ill in November 1357, and on 10 January 1358 was strangled by another vizier, Hasan ibn Umar al-Fududi, who feared for his life over the succession. The Hafsids returned to Tunis. In 1370 Abu al-Abbas Ahmad II, emir of Bougie and Constantine, took Tunis and reunited the Hafsid kingdom, which outlasted the Marinids by sixty years.
