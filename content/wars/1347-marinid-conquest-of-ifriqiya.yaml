notes:
  - The fullest account is by Ibn Khaldun, who was a young man in Tunis when Abu al-Hasan’s court arrived there in 1347 and who soon afterwards lost both his parents in the Black Death. His dates, and those of other chroniclers, are converted here to the Julian calendar.
  - The tribes who defeated Abu al-Hasan were mostly of the Banu Sulaym, Arab nomads who had come to Ifriqiya with the Banu Hilal in the 11th century and whose chiefs held rights to tax the lands they grazed.
  - The wars between the Marinids and the Zayyanids of Tlemcen, through whose kingdom both campaigns passed, have their own entry.
