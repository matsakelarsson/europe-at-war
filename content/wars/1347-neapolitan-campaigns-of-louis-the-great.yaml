id: neapolitan-campaigns-of-louis-the-great
name: Neapolitan campaigns of Louis the Great
start: "1347-11"
end: "1352-03-23"
tier: C
summary: Two invasions of the Kingdom of Naples by Louis I (the Great) of Hungary, to avenge his brother Andrew, husband of Queen Joanna I, who was murdered at Aversa in September 1345, and to claim the kingdom. Louis marched through Italy in late 1347, beat Joanna’s new husband Louis of Taranto at Capua on 11 January 1348 and entered Naples, after having Joanna’s cousin Charles of Durazzo executed at Aversa. Joanna fled to Provence and sold Avignon to the pope to pay for her return. The Black Death and the Neapolitans’ dislike of Hungarian rule drove Louis home that spring. He returned in 1350 and took Aversa after a long siege, but left again; after a papal court cleared Joanna of the murder, peace was made on 23 March 1352, leaving her the kingdom.
