id: hook-and-cod-wars
name: Hook and Cod wars
start: "1350"
end: "1490"
tier: C
summary: A long series of feuds and civil wars in the County of Holland and Zeeland between two parties, the Hooks (Hoeken), mostly nobles, and the Cods (Kabeljauwen), drawn largely from the towns. They began in 1350 in a struggle between Countess Margaret and her son William V, flared again when Jacqueline of Bavaria fought her uncle John and then Philip the Good of Burgundy for the county, and became a lasting rivalry between factions in the towns. Philip, backed by the Cods, beat Jacqueline’s English allies at Brouwershaven in 1426 and took over Holland in 1433. The last rising, the Hook revolt of Frans van Brederode (1488–1490), ended with his defeat and death.
countries: [nl, be]
