id: war-of-the-straits
name: War of the Straits
start: "1350"
end: "1355-06-01"
tier: C
summary: The third war between Venice and Genoa, fought over access to the Black Sea after the Genoese tightened their hold on Caffa, Pera (Galata) and the passage of the Bosporus and seized Chios. Venice allied with Peter IV of Aragon and the Byzantine emperor John VI Kantakouzenos, while the Genoese of Pera won the support of the Ottoman ruler Orhan. A bloody and indecisive battle in the Bosporus on 13 February 1352 left Genoa holding Pera, and Byzantium made a separate peace that May. An Aragonese–Venetian fleet crushed the Genoese off Alghero in Sardinia in August 1353, and Genoa placed itself under Giovanni Visconti of Milan; but on 4 November 1354 Paganino Doria captured almost the whole Venetian fleet at Porto Longo on the island of Sapienza. The peace signed through Visconti mediation on 1 June 1355 settled little; both sides agreed to stay away from Tana for three years.
