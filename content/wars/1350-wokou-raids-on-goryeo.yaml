notes:
  - The word wokou (in Korean waegu, in Japanese wakō) means “Japanese raiders”, but the bands also included Koreans and Chinese; how many is debated between Japanese and Korean historians. The wokou of this period, based mainly in Tsushima, Iki and the Matsuura area of Kyushu, are distinguished from the largely Chinese wokou of the sixteenth century.
  - Dates are lunar months from the Goryeosa. The numbers of raids and of ships (500 at Jinpo) come from the Korean chronicles; another source names 30 ships burned at Jinpo. Some Japanese historians think the account of Hwangsan was exaggerated to glorify Yi Seong-gye.
