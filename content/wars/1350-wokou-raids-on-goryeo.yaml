id: wokou-raids-on-goryeo
name: Wokou raids on Goryeo
start: "1350-02"
end: "1389-02"
tier: B
summary: "Four decades of raids on Goryeo by the wokou, bands of raiders and smugglers who came mostly from Tsushima, Iki and northern Kyushu at a time when Japan was divided by the civil war between its Northern and Southern Courts; Koreans and Chinese also joined such bands. From the second month of 1350 the raids came almost every year, first on the southern coasts and then up the west coast to the approaches to Kaegyong, seizing the tax grain that Goryeo shipped by sea and carrying off people. The Goryeosa records more than a hundred raids under King Gongmin and 378 under King U (1374–1388), and coastal districts were abandoned. Goryeo rebuilt its navy and, on the advice of Choe Mu-seon, began making gunpowder and cannon in 1377. In 1380 its fleet burned some 500 wokou ships at Jinpo at the mouth of the Geum River, and the stranded raiders, after plundering inland, were destroyed by Yi Seong-gye at Hwangsan. After a further naval victory at Gwaneumpo in 1383 and a raid on Tsushima in 1389 the attacks declined, and Yi Seong-gye’s fame from these wars helped him found the Joseon dynasty in 1392."
countries: [kr, jp]
sides:
