  - title: Jinpo and Hwangsan
    date: "1380"
    when: "1380-08"
    borders: "1380-10"
    countries: [kr]
    body:
      - In the eighth month of 1380 a wokou fleet of some 500 ships came into Jinpo, the mouth of the Geum River, tied the ships together and sent raiding parties inland. Sim Deok-bu, Na Se and Choe Mu-seon sailed against it with 100 warships and, using Choe’s cannon for the first time at sea, burned the whole fleet. The raiders who had landed were stranded. They killed most of their captives (334 escaped to the Goryeo army) and plundered their way across Chungcheong, Gyeongsang and Jeolla, defeating a Goryeo army at Sageunnae.
      - In the ninth month they gathered at Inwol station near Unbong, below the Jiri mountains, and threatened to march on Kaegyong. Yi Seong-gye, sent south as commander, attacked them on the heights of Hwangsan. His archers killed their young leader, known in Korean records as Ajibaldo, and the band was destroyed. According to the chronicles the river ran red for days, 1,600 horses were taken, and only about 70 raiders escaped into the mountains.
