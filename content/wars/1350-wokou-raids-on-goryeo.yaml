  - title: Gwaneumpo and the raid on Tsushima
    date: 1383–1389
    when: "1389-02"
    borders: "1389-03"
    countries: [kr, jp]
    body:
      - In 1383 Jeong Ji, with 47 ships armed with Choe Mu-seon’s cannon, defeated a much larger wokou fleet at Gwaneumpo, off Namhae island on the south coast. In the second month of 1389 Bak Wi, commander of Gyeongsang, sailed to Tsushima with 100 ships, burned some 300 ships and many buildings, and brought back more than a hundred Korean captives.
      - The raids grew rarer after 1389, helped by the end of the civil war in Japan in 1392 and by the new Joseon dynasty’s mix of diplomacy, trade privileges and force, which led to a larger expedition against Tsushima in 1419. Yi Seong-gye, whose victories over the wokou had made him the leading general of Goryeo, became the first king of Joseon in 1392.
    facts:
      - [Battle of Gwaneumpo, "1383"]
      - [Raid on Tsushima, "second month of 1389"]
      - [Ships burned on Tsushima, "about 300"]
