steps:
  - title: The raids
    date: 1350–1377
    when: "1350-02"
    borders: "1377-10"
    countries: [kr, kp, jp]
    body:
      - Raiders from Japan had attacked the Korean coasts before, but from the second month of 1350, when they struck Goseong, Jukrim and Geoje on the south coast, the raids became almost yearly and grew in scale. Fleets of dozens or hundreds of ships attacked the south coast and then moved up the west coast; in 1357 raiders took Gyodong island and plundered grain ships at the mouth of the Han, close to Kaegyong. They targeted the tax grain that Goryeo shipped to the capital by sea, and carried off people to sell or ransom. Many coastal districts and islands were abandoned.
      - Goryeo set up coastal garrisons and rebuilt its fleet. In 1376 Choe Yeong defeated a large raiding force at Hongsan, inland from the west coast. Choe Mu-seon, who had learned to refine saltpetre from a Chinese merchant, persuaded the court to set up an Office of Gunpowder Weapons in the tenth month of 1377, which made cannon and fire arrows and fitted warships to carry them.
    facts:
      - [First of the great raids, "second month of 1350"]
      - [Raids under King U, "378 in 1374–1388 (Goryeosa)"]
      - [Office of Gunpowder Weapons, "tenth month of 1377"]
