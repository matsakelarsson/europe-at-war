  - title: The fall of Angkor
    date: 1430–1434
    when: "1431"
    borders: "1431-12-01"
    countries: [kh, th]
    body:
      - In 1430 Borommaracha II, king of Ayutthaya from 1424 to 1448, marched on Angkor again. The Thai chronicles say he took the city in 1431 after a siege of seven months, by treachery within the walls, and made his son king there. His army looted the city and carried off its people and treasures; tradition holds that bronze statues taken from Angkor in 1431 were carried on to Pegu by the Burmese in 1564, to Mrauk U in 1599 and to Amarapura in 1785, and six of them stand today at the Mahamuni pagoda in Mandalay.
      - The Khmer recovered the city within a year or so, but Ponhea Yat did not stay. He moved his court south-east to Basan, near Srei Santhor, and after floods there to Chaktomuk, where the Tonle Sap river meets the Mekong, today’s Phnom Penh, traditionally in 1434. Angkor was never wholly abandoned, for Angkor Wat remained a Buddhist shrine and later kings came back to it, but it was no longer the capital. Historians link the move to the Siamese wars, to the growth of trade along the Mekong and with China by sea, to the decay of Angkor’s reservoirs and canals and to severe droughts in the early fifteenth century.
    facts:
      - [Siege of Angkor, "1430–1431, seven months (Thai chronicles)"]
      - [Court moved to Chaktomuk (Phnom Penh), "traditionally 1434"]
