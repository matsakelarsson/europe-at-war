  - title: Ramesuan takes Angkor
    date: 1393–1394
    when: "1394"
    borders: "1394-01-01"
    countries: [kh, th]
    body:
      - Uthong’s son Ramesuan, king of Ayutthaya from 1388 to 1395, attacked Angkor again. According to the Cambodian chronicles the city was besieged and taken in 1393, during the reign of Thommo Saok, who died. In 1394 the Siamese made a Khmer prince, Ponhea Prek, king as their vassal and took 70,000 Cambodian captives and much wealth back to Ayutthaya. The number, like most in the chronicles, is best read as a sign of the scale of the deportations.
      - About five months later Ponhea Yat, a Khmer prince who held out at Srei Santhor on the Mekong, marched on Angkor, killed Ponhea Prek and took the throne.
    facts:
      - [Angkor taken, "1393 (some sources 1394)"]
      - [Captives taken, "70,000 in the Cambodian chronicles"]
