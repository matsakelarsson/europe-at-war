notes:
  - Almost nothing survives from Cambodia itself for these years; the wars are known from the Ayutthaya chronicles and from Cambodian royal chronicles written down from the late eighteenth century, which give different dates and names. Michael Vickery and others have argued that the Cambodian chronicles’ account of the fourteenth century was partly reconstructed from Thai sources, so the sieges of 1352 and 1393–1394 are less certain than the fall of Angkor in 1431.
