steps:
  - title: Uthong’s siege of Angkor
    date: 1351–1357
    when: "1352"
    borders: "1352-06-01"
    countries: [kh, th]
    body:
      - In 1351 Uthong, a ruler with ties to Lopburi and Suphanburi, founded Ayutthaya on an island in the lower Chao Phraya and took the name Ramathibodi. The country around it had been part of the Khmer Empire in the twelfth and thirteenth centuries, and Ayutthaya took over much of Angkor’s court culture, its Brahmin rituals and its Khmer vocabulary of kingship, while claiming the Khmer lands to the east.
      - According to the Cambodian chronicles, Uthong besieged Angkor in 1351 for about seventeen months. The Khmer king Lampong Reachea died during the siege, his son Soryavong fled to Laos with the royal regalia, and Angkor fell in 1352. Uthong carried captives and treasure back to Ayutthaya and made his sons kings at Angkor one after the other, until Soryavong came back with an army in 1357, drove the Siamese out and took the throne. No contemporary inscription confirms this war, and historians are divided on how much of the account to believe.
    facts:
      - [Ayutthaya founded, "1351"]
      - [Angkor taken, "1352, after a siege of about seventeen months (Cambodian chronicles)"]
      - [Siamese driven out, "1357"]
