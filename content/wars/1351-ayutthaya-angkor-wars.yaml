id: ayutthaya-angkor-wars
name: Ayutthaya’s wars with Angkor
start: "1351"
end: "1431"
tier: B
summary: "The wars between the new Siamese kingdom of Ayutthaya and the Khmer kingdom of Angkor, which ended with the Khmer court leaving Angkor. Ayutthaya, founded in 1351 on the lower Chao Phraya, in lands the Khmer had once ruled, attacked Angkor three times according to the chronicles. Its founder Uthong took the city in 1352 after a long siege and put his sons on the Khmer throne until a Khmer prince drove them out in 1357; Ramesuan took it again in 1393–1394 and carried off many captives; and in 1431 Borommaracha II took Angkor after a siege of seven months. The Khmer king Ponhea Yat then moved his court south-east, first to Basan near Srei Santhor and then to Chaktomuk, today’s Phnom Penh. Historians agree that the court left Angkor in the fifteenth century, but treat the chronicles’ account of the earlier wars with caution, and see the Siamese attacks as one cause among several, with the shift of trade to the Mekong and the sea, the decay of Angkor’s waterworks and long droughts."
countries: [kh, th]
