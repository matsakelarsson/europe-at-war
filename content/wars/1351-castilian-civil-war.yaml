id: castilian-civil-war
name: Castilian Civil War
start: "1351"
end: "1369-03-23"
tier: B
summary: The war between Peter I of Castile and his illegitimate half-brother Henry of Trastámara, which became a side theatre of the Hundred Years’ War. Henry, backed by France, Aragon and the Free Companies under Bertrand du Guesclin, drove Peter out in 1366; the Black Prince restored him by his victory at Nájera in 1367, but Henry returned, beat Peter at Montiel in 1369 and killed him, founding the Trastámara dynasty and making Castile an ally of France.
countries: [es, fr, gb]
sides:
  - id: ped
    name: Peter I and his allies
    polities: [castile, england]
    ink: gold
    moves: Moves by Peter and his allies
    success: Success for Peter
  - id: tra
    name: Henry of Trastámara and his allies
    polities: [aragon, france]
    ink: purple
    moves: Moves by Henry and his allies
    success: Success for Henry
notes:
  - Peter’s enemies called him the Cruel and his supporters the Just. The main chronicle of his reign was written by Pero López de Ayala, who changed sides to Henry in 1366; Froissart tells the story from the English and French side.
  - Historians date the war differently. Some count it from the first noble revolts against Peter in the early 1350s, others only from Henry’s invasion of 1366. It overlapped with the War of the Two Peters (1356–1369) between Castile and Aragon, which has its own entry; Nájera and the Castilian alliance with France also appear in the Hundred Years’ War.
  - Dates are Julian. Nájera is sometimes called the battle of Navarrete.
