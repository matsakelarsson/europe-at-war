  - title: The fall of Zhang Shicheng
    date: 1365 – early 1368
    when: "1366-12-27"
    borders: "1367-10-01"
    countries: [cn]
    body:
      - Zhang Shicheng had ended his submission to the Yuan in October 1363 and proclaimed himself king of Wu. He ruled the richest lands in China, from Pingjiang (Suzhou) and Hangzhou to Shaoxing, and north of the Yangtze from Gaoyou to Xuzhou, and was a generous patron of scholars, but he stayed on the defensive. In 1365–1366 Zhu Yuanzhang’s armies took his lands north of the river, Gaoyou falling in April 1366.
      - In the autumn of 1366 Xu Da and Chang Yuchun led about 200,000 men against the delta. Huzhou surrendered in December and Hangzhou soon after, and on 27 December 1366 the siege of Pingjiang began. The city was ringed by siege works and towers from which cannon and catapults fired over the walls, and it held out for ten months. On 1 October 1367 the walls were breached; Zhang Shicheng was captured and hanged himself in Yingtian. Many of the delta’s rich families were later moved to Zhu’s home region around Haozhou, and the delta was taxed heavily for generations.
      - In January 1367 Han Lin’er drowned when his boat overturned as he crossed the Yangtze at Guabu on his way to Yingtian; the escort was commanded by Zhu’s officer Liao Yongzhong, and many historians suspect the accident was arranged. Zhu stopped using the Song reign title. In the autumn of 1367 his armies and fleets took the ports of Fang Guozhen, who fled to sea and surrendered in December, and then turned south; Fujian was conquered in February 1368, and the governor of Guangdong, He Zhen, surrendered in April.
    facts:
      - [Zhang Shicheng king of Wu, "October 1363"]
      - [Siege of Pingjiang (Suzhou), "27 December 1366 – 1 October 1367"]
      - [Death of Han Lin’er, "January 1367"]
      - [Fang Guozhen surrenders, "December 1367"]
