  - title: Chen Youliang and the battle of Longwan
    date: 1357–1362
    when: "1360-06"
    borders: "1360-06-30"
    countries: [cn]
    body:
      - On the middle Yangtze, Tianwan was now in the hands of its generals. In 1357 Ni Wenjun tried to murder Xu Shouhui and seize the throne; he failed and was killed by his own officer Chen Youliang, the son of a fisherman, who took over his army. Chen conquered Anqing and much of Jiangxi in 1358–1359, while another Tianwan general, Ming Yuzhen, led an army up the river into Sichuan, where he later founded his own state of Xia. In December 1359 Chen had Xu Shouhui’s guards killed at Jiangzhou and kept the emperor in his power.
      - In June 1360 Chen’s fleet took Taiping from Zhu Yuanzhang. At Caishi nearby he had Xu Shouhui killed and proclaimed himself emperor of Han, then sailed on down the river towards Yingtian (Nanjing), hoping that Zhang Shicheng would attack from the east. Zhang did not move. Zhu Yuanzhang had an officer who had known Chen, Kang Maocai, send him a letter offering to open the way and to meet him at a wooden bridge outside the city.
      - When Chen’s ships arrived, the bridge was of stone and no one answered his signals. His troops landed at Longwan, the Dragon Bay north-west of the city, and were attacked from ambush by Zhu’s forces as the falling river left many of his ships stranded. Chen escaped to Jiangzhou, but lost thousands of men as prisoners and a large part of his fleet; the captured ships strengthened Zhu’s own. In 1361 Zhu went over to the attack, took Anqing and Jiangzhou and drove Chen back to Wuchang, and in 1362 Hongdu (Nanchang) and much of Jiangxi went over to him.
    facts:
      - [Chen Youliang proclaims Han, "June 1360, at Caishi"]
      - [Battle of Longwan, "June 1360, victory of Zhu Yuanzhang"]
      - [Anqing and Jiangzhou taken by Zhu, "1361"]
