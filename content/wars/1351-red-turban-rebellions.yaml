  - title: The Song restored and the Yangtze crossed
    date: 1355–1357
    when: "1355-03-16"
    borders: "1356-04-10"
    countries: [cn]
    body:
      - Liu Futong found Han Lin’er, the son of Han Shantong, and on 16 March 1355 proclaimed him emperor of a restored Song dynasty at Bozhou, with the title Lesser Prince of Light. The new Song claimed to continue the dynasty the Mongols had overthrown in 1279; many rebel leaders on the Huai and the Yangtze accepted its titles while acting on their own.
      - Guo Zixing died in 1355, and Zhu Yuanzhang soon commanded his army. With the boats of the lake fleets of Chaohu, whose leaders joined him, he crossed the Yangtze in July 1355 and took Taiping. Two attacks on Jiqing (Nanjing) failed, and in the second Guo Zixing’s son and brother-in-law were killed, leaving Zhu in sole command. In March 1356 the Yuan commander Chen Zhaoxian went over to him with about 36,000 men, and on 10 April Zhu took Jiqing and renamed it Yingtian. The Song court made him its governor of the region south of the Yangtze.
      - Zhang Shicheng also crossed the river. His brother Zhang Shide took Changshu and in March 1356 Pingjiang (Suzhou), the richest city of the delta, and Zhang moved his capital there. In 1357 Zhu’s troops captured Zhang Shide, who starved himself to death in prison, and under pressure from Zhu and the Yuan Zhang submitted to the Yuan that autumn, taking the title of grand commandant. Until 1363 he shipped rice to Dadu by sea each year in the ships of Fang Guozhen, a salt trader turned sea captain who had defied the Yuan since 1348 and now held the ports of Qingyuan (Ningbo), Taizhou and Wenzhou as a Yuan official.
    facts:
