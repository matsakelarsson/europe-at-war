  - title: The Yuan generals in the north
    date: 1359–1367
    when: "1362-07"
    borders: "1362-12-01"
    countries: [cn]
    body:
      - In the north the Yuan dynasty now lived on the strength of its regional commanders, who raised their own troops and taxes. The strongest was Chaghan Temür, who after taking Kaifeng moved into Shandong in 1361. The Red Turban leader Tian Feng submitted to him, Jinan was retaken, and the last rebels were shut up in Yidu. In the summer of 1362 Tian Feng and Wang Shicheng murdered Chaghan Temür when he visited their camp outside the city. His nephew and adopted son, Köke Temür, known in Chinese as Wang Baobao, took over his army, stormed Yidu at the end of 1362 and executed the murderers. Shandong was in Yuan hands again.
      - The Song of Han Lin’er was by then a shadow. Early in 1363 Zhang Shicheng, nominally a Yuan subject, sent his general Lü Zhen against its last base at Anfeng, and Liu Futong was killed, according to most accounts. Zhu Yuanzhang, against the advice of his officers, marched north, drove off the attackers and took Han Lin’er to Chuzhou, where he lived under Zhu’s protection.
      - The Yuan commanders could not stop fighting one another. Bolad Temür, who held Datong, quarrelled with Köke Temür over Shanxi and the succession at court; in 1364 he occupied Dadu, and in 1365 Köke Temür drove him out and Bolad Temür was killed. In 1366–1367 Köke Temür, now prince of Henan and commander of the armies, was at war with Li Siqi and the other generals of Shaanxi, and in 1367 the court stripped him of his command. The Yuan’s best troops were thus engaged against each other in the years when Zhu Yuanzhang defeated his rivals in the south.
    facts:
      - [Chaghan Temür murdered, "summer 1362, outside Yidu"]
      - [Yidu stormed by Köke Temür, "end of 1362"]
      - [Anfeng attacked by Zhang Shicheng’s troops, "early 1363"]
      - [Bolad Temür occupies Dadu, "1364"]
