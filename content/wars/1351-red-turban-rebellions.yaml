  - title: The northern expedition and the fall of Dadu
    date: November 1367 – September 1368
    when: "1368-09-14"
    borders: "1368-09-14"
    countries: [cn]
    body:
      - In November 1367, with Suzhou taken, Zhu Yuanzhang sent Xu Da and Chang Yuchun north with about 250,000 men. A proclamation drafted for him by the scholar Song Lian called on the people of the north to expel the Mongols and restore Chinese rule, while promising that Mongols and Semu who accepted the new order would be treated as his subjects. Shandong was taken in the winter, and on 23 January 1368 Zhu proclaimed himself emperor at Yingtian, naming his dynasty Ming, the “radiant”, and his reign Hongwu.
      - In the spring the Ming armies took Henan. Kaifeng surrendered, a Yuan army was defeated near Luoyang, and Feng Sheng took the Tong Pass, closing the road from Shaanxi. The Yuan commanders were divided; Köke Temür, deprived of his command the year before and at odds with the court and with Li Siqi, held Shanxi with the strongest Yuan army but did not reach the capital in time.
      - In August Xu Da marched north along the Grand Canal by Linqing, Dezhou and Zhigu (Tianjin), and on 10 September took Tongzhou, east of Dadu. That night Toghon Temür left the capital with his empresses, the heir apparent and the court through the Jiande Gate, heading for Shangdu. On 14 September 1368 the Ming army entered Dadu; Prince Temür Buqa, left to defend it, was killed, and the city was renamed Beiping, “the north pacified”. The Yuan court lived on in Mongolia, and the wars with it are told in the Ming campaigns against the Northern Yuan.
    facts:
      - [Northern expedition sets out, "November 1367, about 250,000 men"]
      - [Ming dynasty proclaimed, "23 January 1368, at Yingtian (Nanjing)"]
      - [Kaifeng surrenders, "spring 1368"]
      - [Tongzhou taken, "10 September 1368"]
      - [Ming army enters Dadu, "14 September 1368"]
