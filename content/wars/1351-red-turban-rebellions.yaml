steps:
  - title: The Yellow River and the rising of 1351
    date: 1344 – autumn 1351
    when: "1351-05-28"
    borders: "1351-06-01"
    countries: [cn]
    body:
      - The last Yuan emperor, Toghon Temür, came to the throne in 1333 after a series of short reigns and the War of the Two Capitals. His court was split by feuds between Mongol and Semu (Central Asian) ministers, and its paper money was losing value. In 1344 the Yellow River broke its dykes at Baimao near Caozhou, flooded large parts of Shandong and Henan, silted up the Grand Canal that carried the grain of the south to the capital, and threatened the salt works on the coast. Famine and epidemics followed in the Huai valley for years.
      - In 1349 the reforming chancellor Toghto returned to power, and in April 1351 he had the engineer Jia Lu begin to close the breaches and force the river back into an older course to the south-east, where it joined the Huai. About 150,000 labourers and 20,000 soldiers were brought together on the dykes, and the work was finished by the end of the year. The great gangs of hungry workers gave the White Lotus sect an audience. Its preachers taught that the world was about to fall into chaos, that the Buddha Maitreya would descend and that a Prince of Light (Ming wang) would appear. Han Shantong, a sect leader from Hebei, claimed to descend from the Song emperor Huizong; his follower Liu Futong claimed a Song general as an ancestor. A story told later has them burying a one-eyed stone figure on the works, inscribed with a prophecy that its discovery would set the empire in revolt.
      - The plot was discovered before it began. Han Shantong was captured and executed, but his wife and his young son Han Lin’er escaped, and on 28 May 1351 Liu Futong took the town of Yingzhou. His followers wore red headcloths and burned incense at their rites. Within months risings spread across the Huai plain and into Henan, among them Zhima Li’s at Xuzhou on the Grand Canal in the autumn of 1351 and Guo Zixing’s at Haozhou early in 1352. The garrisons of the Yuan, long unused to war, made little headway against them.
    facts:
      - [Yellow River works, "April – end of 1351, about 150,000 labourers and 20,000 soldiers"]
      - [Liu Futong takes Yingzhou, "28 May 1351"]
      - [Xuzhou taken by Zhima Li, "autumn 1351"]
