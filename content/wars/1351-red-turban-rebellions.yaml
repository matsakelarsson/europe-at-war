  - title: The northern expeditions
    date: 1357–1359
    when: "1357-07"
    borders: "1358-06-11"
    countries: [cn]
    body:
      - In the summer of 1357 Liu Futong sent three armies north. Mao Gui led one into Shandong, Guan Xiansheng, Po Toulu and others a second over the Taihang mountains into Shanxi, and Bai Buxin, Da Dao’ao and Li Xixi a third into Shaanxi. Mao Gui took Jinan in March 1358 and in April reached Jizhou, less than 100 km east of Dadu; the court talked of abandoning the capital. He was beaten at Liulin, near Dadu, by the Yuan commander Liu Haranbuqa and fell back to Jinan, where a rival Red Turban leader, Zhao Junyong, killed him in 1359. On 11 June 1358 Liu Futong took Kaifeng, the old capital of the Northern Song, and installed Han Lin’er there.
      - The western army took Xingyuan (Hanzhong) in October 1357 and threatened Fengxiang and Chang’an, but was beaten by Chaghan Temür and Li Siqi. Chaghan Temür, born in Henan to a family of Naiman origin, had raised a militia in 1351–1352 at his own cost and become the most successful Yuan commander in the north. The remnants of the western army scattered into Sichuan and Gansu.
      - The central army marched the length of Shanxi and out onto the steppe. On 8 January 1359 it took Shangdu, the Yuan summer capital where Kublai had been proclaimed khan, and burned its palaces; in February it took Liaoyang in Manchuria. From there these Red Turbans invaded Goryeo in 1359 and again in 1361, when they took its capital, Kaesong, before the Korean armies destroyed them.
      - In the meantime Chaghan Temür gathered his forces against Kaifeng and retook it on 10 September 1359. Liu Futong and Han Lin’er fled to Anfeng, and the Song never again threatened the north. The campaigns devastated the northern plain; famine and epidemics killed many in the capital region in 1358.
