id: red-turban-rebellions
name: Red Turban rebellions
start: "1351-05-28"
end: "1368-09-14"
tier: A
summary: "The risings that ended Mongol rule in China. In 1351, as the Yuan government put 170,000 men to work on new dykes for the Yellow River in a decade of floods, famine and epidemics, followers of the White Lotus teaching, who awaited the coming of the Buddha Maitreya, rose in the Huai valley under Liu Futong; in Hubei Xu Shouhui proclaimed the state of Tianwan. The rebels wore red headcloths and became known as the Red Turbans. The chancellor Toghto came close to crushing them, but was dismissed in the middle of the siege of Gaoyou in 1355, and the rebellion spread. In the north the Song state of Han Lin’er and Liu Futong sent armies as far as Shangdu and Liaoyang before Yuan commanders such as Chaghan Temür and Köke Temür drove them back. In the Yangtze valley rival regimes fought each other: Zhu Yuanzhang, a former monk who took Nanjing in 1356, defeated Chen Youliang’s Han at Lake Poyang in 1363 and Zhang Shicheng’s Wu at Suzhou in 1367, proclaimed the Ming dynasty in January 1368 and took the Yuan capital Dadu (Beijing) in September 1368."
countries: [cn]
