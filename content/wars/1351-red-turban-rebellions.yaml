  - title: Toghto, Gaoyou and a fatal dismissal
    date: 1352 – January 1355
    when: "1352-10"
    borders: "1354-11-28"
    countries: [cn]
    body:
      - Toghto took the field himself. In the autumn of 1352 he retook Xuzhou after a short siege; the city was sacked and, the histories say, many of its people were killed. The rebel leaders Peng Da and Zhao Junyong escaped to Haozhou, where Guo Zixing held out. A Yuan army besieged Haozhou in the winter of 1352–1353, but gave up after its commander, Jia Lu, the engineer of the river works, died in camp. Among the defenders was Zhu Yuanzhang, a 24-year-old former novice monk from a poor family of the district, most of whom had died in the famine of 1344. He had joined Guo Zixing on 15 April 1352, married his adopted daughter, the future Empress Ma, and in 1353–1354 recruited his own troops and took Chuzhou.
      - On the coast a new rising cut the Grand Canal. Zhang Shicheng, a boatman who carried salt for the state monopoly near Taizhou, rose with his brothers and a few followers in 1353 and within weeks had more than 10,000 men. He took Taizhou, Xinghua and Gaoyou, and early in 1354 proclaimed himself king of a state he called Great Zhou.
      - In the autumn of 1354 Toghto marched south with one of the largest armies the Yuan ever raised, including troops from Central Asia, Tibet and Goryeo; the histories speak of a million men. He defeated Zhang Shicheng outside Gaoyou on 28 November 1354 and besieged the city. At court his rivals, led by the minister Hama and supported by the heir apparent and his mother, Empress Ki, accused him of wasting the treasury, and the emperor stripped him of his offices. Toghto received the decree in his camp on 7 January 1355 and obeyed it. His army broke up, many of its soldiers joining the rebels, and he died in exile in Yunnan in January 1356, poisoned on Hama’s orders. Historians see the dismissal as a turning point; the Yuan never again put a single great army into the field, and its defence passed to regional commanders and local militias.
    facts:
      - [Xuzhou retaken by Toghto, "autumn 1352"]
      - [Zhu Yuanzhang joins Guo Zixing, "15 April 1352"]
      - [Zhang Shicheng proclaims Great Zhou, "early 1354, at Gaoyou"]
      - [Battle outside Gaoyou, "28 November 1354, Yuan victory"]
      - [Toghto receives his dismissal, "7 January 1355"]
