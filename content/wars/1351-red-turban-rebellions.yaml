  - title: Lake Poyang
    date: June 1363 – March 1364
    when: "1363-08-30"
    borders: "1363-10-04"
    countries: [cn]
    body:
      - While Zhu Yuanzhang was away at Anfeng, Chen Youliang built a fleet of great tower ships, painted red and several decks high, and in June 1363 sailed with his whole army, 600,000 men according to the Ming histories, to retake Hongdu (Nanchang). Zhu’s nephew Zhu Wenzheng and the general Deng Yu held the city, by the count of the Ming histories for 85 days, repairing the walls as fast as they were breached.
      - Zhu came to its relief with an army usually given as about 100,000 men, in smaller and handier ships. His fleet entered the lake at Hukou, Chen lifted the siege, and from 30 August the fleets fought in the south-east of the lake near Kanglang Mountain. Both sides used gunpowder weapons as well as bows and fire arrows. Chen had lashed his big ships together into battle lines; on 31 August, when the wind turned, Zhu sent fire ships into them and burned several hundred. After more fighting Zhu blockaded the narrow outlet of the lake to the Yangtze.
      - After a month, short of food, Chen tried to break out on 4 October 1363. In the running fight he was killed by an arrow, and most of his army surrendered. His son Chen Li escaped to Wuchang and surrendered in March 1364. On 4 February 1364 Zhu proclaimed himself king of Wu, still using the reign title of the Song. Lake Poyang, one of the largest naval battles in history by the number of men engaged, left him master of the middle Yangtze.
    facts:
      - [Siege of Hongdu (Nanchang), "June – August 1363"]
      - [Battle of Lake Poyang, "30 August – 4 October 1363, victory of Zhu Yuanzhang"]
      - [Death of Chen Youliang, "4 October 1363 (3 October in some accounts)"]
      - [Zhu Yuanzhang king of Wu, "4 February 1364"]
      - [Wuchang surrenders, "March 1364"]
