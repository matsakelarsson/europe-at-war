notes:
  - Dates are converted from the Chinese lunar calendar as the sources give them (Julian calendar); sources often differ by days or weeks, and for some events give only the season.
  - "The rebels were called Red Turbans (hongjin) after their red headcloths, or the Incense Army (xiangjun) after their rites. Yuan records call them “bandits” and “sorcerers”; the official history of the Yuan was compiled under the Ming in 1369–1370, and the Ming histories tell the story from the side of the winner, Zhu Yuanzhang."
  - Army sizes in the Chinese histories (a million men for Toghto at Gaoyou, 600,000 for Chen Youliang at Lake Poyang) are generally regarded as exaggerated, and few battle losses were recorded.
  - Fang Guozhen, who held the Zhejiang coast from 1348 to 1367, and Ming Yuzhen, who ruled Sichuan as the state of Xia from 1362, are described in the text but not shown as sides.
  - Place names are given in the forms of the time, with today’s names where they differ (Jiqing or Yingtian for Nanjing, Pingjiang for Suzhou, Dadu, Khanbaliq to the Mongols, for Beijing).
