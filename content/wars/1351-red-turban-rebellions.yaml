  - title: Tianwan, the southern Red Turbans
    date: 1351–1355
    when: "1351-09"
    borders: "1352-08-01"
    countries: [cn]
    body:
      - In eastern Hubei a separate movement rose in the late summer of 1351. Its preacher was the monk Peng Yingyu, a veteran of earlier Maitreyan risings; its general was Zou Pusheng; and the man they made emperor was Xu Shouhui, a cloth pedlar. They took Qizhou in September and set up their state, Tianwan, with Xu as emperor at Qishui. The southern Red Turbans shared the red headcloths and the hope in Maitreya with the rebels of the north, but took no orders from Liu Futong.
      - In 1352 Tianwan’s armies took Hanyang and Wuchang on the middle Yangtze, sailed down the river past Jiangzhou (Jiujiang) and spread into Jiangxi, Hunan and southern Anhui. One column crossed the hills to the coast and held Hangzhou for a short time in the summer of 1352. The Yuan provincial armies were weak, and much of the defence of the cities fell to local gentry, who raised militias of their own.
      - The rebels could not hold what they had overrun. After drought and famine in 1353, Yuan armies retook Qishui at the end of that year; Xu Shouhui fled into the hills of Huangmei, and many of his officials were killed. The movement revived only in 1355, when Ni Wenjun took Hanyang and made it Tianwan’s new capital.
    facts:
      - [Tianwan proclaimed, "autumn 1351, at Qishui"]
      - [Hanyang and Wuchang taken, "1352"]
      - [Qishui retaken by the Yuan, "end of 1353"]
