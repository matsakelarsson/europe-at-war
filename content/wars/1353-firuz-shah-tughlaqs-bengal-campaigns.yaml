notes:
  - The site of Ekdala is disputed. Suggestions include a village in Dinajpur about 37 km north of Pandua, Basankot near Pandua and places near Dhaka.
  - The Delhi chroniclers describe the first campaign as a victory and say that Firuz chose not to annex Bengal; Bengal’s coins and later histories show that its sultans kept their independence.
