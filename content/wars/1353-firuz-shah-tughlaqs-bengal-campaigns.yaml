id: firuz-shah-tughlaqs-bengal-campaigns
name: Firuz Shah Tughlaq’s Bengal campaigns
start: "1353-11"
end: "1359"
tier: C
summary: "Two attempts by Firuz Shah Tughlaq, sultan of Delhi, to win back Bengal, which had broken away under Muhammad bin Tughluq and been united in 1352 by Shamsuddin Ilyas Shah, who had also raided Nepal and Odisha. In November 1353 Firuz marched east with a large army, occupied Ilyas’s capital Pandua and besieged him in Ekdala, a mud fort ringed by rivers and marshes. After about two months, and a battle in which the Bengal army, pursuing a feigned retreat, suffered heavy losses, Firuz withdrew before the rains in 1354 without taking the fort. In 1358–1359, after Ilyas’s death, he marched again, founding the city of Jaunpur on the way, and besieged Ilyas’s son Sikandar Shah in Ekdala. Again the fort held, and a peace was made with an exchange of gifts. Bengal remained an independent sultanate, ruled from Pandua and later Gaur, until the 16th century."
