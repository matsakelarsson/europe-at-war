  - title: Adrianople and Philippopolis
    date: 1359–1369
    when: "1360"
    borders: "1369"
    countries: [tr, gr, bg]
    body:
      - Under Orhan’s son Murad I, who succeeded him in about 1362, Ottoman forces and independent frontier warriors pushed up the valley of the Maritsa. Didymoteicho fell in 1360 or 1361. Philippopolis, held by Bulgaria since 1344, was taken in about 1363 by Lala Şahin Pasha, Murad’s tutor and commander in Europe. Turkish settlers and nomads followed the soldiers onto the Thracian plain, and the Ottomans pushed towards the Rhodopes and the Balkan Mountains.
      - In 1366 Count Amadeus VI of Savoy, the emperor’s cousin, led a small crusade that retook Gallipoli, but it was not enough to reverse the tide; Andronikos IV handed the town back to the Ottomans in 1376 or 1377 for their help in his own bid for the throne. Adrianople, the third city of the empire, surrendered after its ruler fled by boat; Ottoman tradition dates this to 1361–1362, Byzantine sources to 1369. Many of its people were carried off into captivity. Renamed Edirne, it became the Ottoman military centre in Europe and later the sultans’ capital.
    facts:
      - [Fall of Didymoteicho, "1360 or 1361"]
      - [Fall of Philippopolis, "about 1363"]
      - [Fall of Adrianople, "between 1361 and 1369; probably 1369"]
