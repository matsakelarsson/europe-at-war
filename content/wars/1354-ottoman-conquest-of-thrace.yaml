steps:
  - title: Gallipoli
    date: 1352–1357
    when: "1352"
    borders: "1354-03"
    countries: [tr, gr]
    body:
      - The Byzantine civil wars brought Turkish soldiers into Europe as allies of John VI Kantakouzenos, and their plundering of Thrace showed them its wealth. In about 1352, as a reward for help against John V and his Serbian allies, Kantakouzenos let Orhan’s son Süleyman Pasha garrison Tzympe, a small fortress on the Gallipoli peninsula. On 2 March 1354 a severe earthquake destroyed hundreds of villages and towns in the area. The walls of Gallipoli collapsed and its Greek inhabitants fled; within a month Süleyman occupied the town, repaired its defences and brought in Turkish settlers from Anatolia.
      - Kantakouzenos offered money to have it back, but Orhan replied that God had given him the town. Panic spread in Constantinople, and in November 1354 John V seized the city and Kantakouzenos abdicated and became a monk. From Gallipoli, the gateway between Asia and Europe, Süleyman’s men raided and settled the Thracian plain, taking towns such as Rodosto (Tekirdağ), Malkara and İpsala. Süleyman died in a hunting accident in 1357, and the advance slowed for a time when Orhan’s young son Halil was kidnapped by pirates and held at Phocaea until 1359.
    facts:
      - [Earthquake at Gallipoli, 2 March 1354]
      - [Gallipoli occupied, "March 1354"]
      - [Kantakouzenos abdicates, "late 1354"]
