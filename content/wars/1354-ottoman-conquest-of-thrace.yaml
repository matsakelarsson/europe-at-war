id: ottoman-conquest-of-thrace
name: Ottoman conquest of Thrace
start: "1352"
end: "1369"
tier: B
summary: The Ottoman advance from a first foothold on the Gallipoli peninsula across the plains of Thrace. Turkish troops hired by John VI Kantakouzenos were given the fortress of Tzympe around 1352, and after an earthquake ruined Gallipoli in March 1354 Orhan’s son Süleyman occupied it and refused to leave. Within fifteen years Didymoteicho, Philippopolis and Adrianople had fallen, the last at a date that sources give between 1361 and 1369, and Adrianople became the Ottomans’ main base in Europe.
