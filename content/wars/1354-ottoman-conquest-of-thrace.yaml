notes:
  - Dates for the conquest of Thrace are very uncertain. Later Ottoman chronicles put the fall of Adrianople in 1361 or 1362; Byzantine sources studied by Elisabeth Zachariadou point to 1369, which most modern historians accept. Some of the conquests may have been made by independent bands of frontier warriors rather than by the Ottoman ruler’s own troops.
  - Ottoman tradition tells of a great victory over a Serbian and Hungarian army near Adrianople, at Sırp Sındığı (“the rout of the Serbs”), in 1364; historians think the story may be a confused memory of the battle of the Maritsa in 1371, and it is not told here.
