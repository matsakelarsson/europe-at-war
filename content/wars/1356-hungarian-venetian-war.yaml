id: hungarian-venetian-war
name: Hungarian–Venetian War of 1356–1358
start: "1356"
end: "1358-02-18"
tier: C
summary: The war in which Louis I of Hungary took Dalmatia from Venice. Left out of the Venetian–Genoese peace of 1355, Louis claimed the Dalmatian towns as king of Croatia and in 1356 invaded the Venetian mainland with the support of the Patriarch of Aquileia, the Count of Gorizia and Francesco da Carrara of Padua, besieging Treviso, while Croatian and Hungarian forces attacked the coast. Split, Trogir and Šibenik went over to him, and Zadar was taken at the end of 1357. In the Treaty of Zadar of 18 February 1358 Venice gave up Dalmatia from the Kvarner to Durazzo and dropped Dalmatia from the doge’s title, though it kept Istria and its supremacy at sea. Ragusa (Dubrovnik) accepted Hungarian overlordship later that year and became, in practice, an independent republic.
countries: [hr, it, hu]
