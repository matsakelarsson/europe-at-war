id: war-of-the-two-peters
name: War of the Two Peters
start: "1356"
end: "1369"
tier: C
summary: A war between Peter I of Castile and Peter IV of Aragon, fought mostly along their border in Aragon and Valencia. It began in 1356 after Catalan galleys in Aragonese service seized Genoese ships, allies of Castile, at Sanlúcar de Barrameda. Castile had the better of the fighting, taking Tarazona in 1357 and, in 1362–1363, a string of towns in Aragon and Valencia, among them Teruel, Segorbe and Murviedro (Sagunto), with help from Navarre, Portugal and Granada. The peaces of Terrer (1361) and Murviedro (1363) did not hold. Peter IV then backed Peter of Castile’s half-brother Henry of Trastámara, and from 1366 the war merged into the Castilian Civil War; Castile’s conquests were lost. A final peace was made at Almazán in 1375, sealed by the marriage of Peter IV’s daughter Eleanor to Henry’s heir, the future John I of Castile.
