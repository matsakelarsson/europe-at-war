id: battle-of-bubat
name: Battle of Bubat
start: "1357"
end: "1357"
tier: C
summary: "The killing of the king of Sunda and his party at Bubat, a field on the north side of Trowulan, the capital of Majapahit, in 1357. King Hayam Wuruk of Majapahit had asked for the hand of Dyah Pitaloka (Citra Rashmi), daughter of King Linggabuana of Sunda, the kingdom of western Java. The king sailed to Java with his family, nobles and guards, went up the Brantas river and camped at Bubat to await the wedding. There Majapahit’s chief minister, Gajah Mada, demanded that the princess be handed over not as a queen but as a token of Sunda’s submission. The Sundanese refused, and Majapahit troops surrounded the camp. In the fight that followed the king and almost all his party, said to number fewer than a hundred against several thousand, were killed; according to tradition the princess and the other Sundanese women took their own lives. Hayam Wuruk married his cousin instead, and Gajah Mada is said to have lost the king’s favour. Sunda seems to have acknowledged Majapahit’s overlordship for a time and then regained its independence; Linggabuana’s young son Niskala Wastu Kancana, who had stayed at Kawali, cut off relations with Majapahit. The Sundanese remember Linggabuana as Prabu Wangi, and the story is still told in wayang, drama and novels; in 2018 the governors of East Java, West Java and Yogyakarta renamed streets in Surabaya, Bandung and Yogyakarta to mark a reconciliation."
