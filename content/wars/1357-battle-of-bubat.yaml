notes:
  - The story is told in the Pararaton (15th century), briefly in the Sundanese Carita Parahyangan (16th century) and at length in the Balinese poem Kidung Sunda. The Nagarakretagama, the court poem of Majapahit written in 1365, does not mention it, and some historians have doubted that the event took place as told; most accept the core of the story. The number of the dead is not known.
