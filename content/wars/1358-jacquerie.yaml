id: jacquerie
name: Jacquerie
start: "1358-05-28"
end: "1358-06"
tier: C
summary: A peasant rising in the Beauvaisis and neighbouring districts north of Paris in late May and June 1358, two years after the capture of King John II at Poitiers. Led by Guillaume Cale, bands of rebels, called Jacques, burned noble houses and killed many nobles and their families, and Étienne Marcel’s Paris briefly made common cause with them. On 9–10 June the nobles, led by Charles II of Navarre, crushed the rebels at Mello and Meaux, and thousands of peasants were killed in the reprisals that followed.
