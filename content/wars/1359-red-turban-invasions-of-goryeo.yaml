id: red-turban-invasions-of-goryeo
name: Red Turban invasions of Goryeo
start: "1359-11"
end: "1362-01"
tier: B
summary: "Two invasions of Goryeo by a northern army of the Red Turbans, the rebel movement that rose against the Yuan dynasty in China in 1351. After failing to take the Yuan capital Dadu in 1358, Red Turban forces under Guan Xiansheng and others burned the summer capital Shangdu and moved into Liaodong; pressed by the Yuan, they turned on Goryeo. In the twelfth month of 1359 Mao Jujing crossed the frozen Yalu with 40,000 men and took the Western Capital, Pyongyang, but Goryeo retook it within weeks and drove the invaders out early in 1360. In the tenth month of 1361 a much larger army, said to number over 100,000, under Pan Cheng, Sha Liu, Guan Xiansheng and others swept south. King Gongmin fled to Bokju (Andong), and the Red Turbans held Kaegyong for about two months, burning the palace. In the first month of 1362 a Goryeo army of about 200,000 under Jeong Se-un stormed the city, killing Sha Liu and Guan Xiansheng, and the survivors fled across the Yalu. The war left the north devastated, and generals such as Choe Yeong and Yi Seong-gye rose to prominence."
countries: [kp, kr, cn]
sides:
  - id: gor
    name: Goryeo
    polities: [goryeo]
    ink: blue
    moves: Goryeo moves
    success: Goryeo success
  - id: rt
