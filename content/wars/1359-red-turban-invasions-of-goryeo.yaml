    ink: red
    moves: Red Turban moves
    success: Red Turban success
notes:
  - Dates are lunar months from the Goryeosa; the sources differ on whether the second invasion began in the ninth, tenth or eleventh month of 1361. The army sizes and the figure of about 100,000 Red Turban casualties at Kaegyong come from the Goryeosa.
  - The Red Turbans in Korea were a northern branch of the movement, cut off from the Song regime of Han Lin’er and from Zhu Yuanzhang’s forces in the south. Korean records call them the Honggeonjeok, “Red Turban bandits”.
