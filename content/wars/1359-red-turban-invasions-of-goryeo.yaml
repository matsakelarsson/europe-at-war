  - title: The fall and recapture of Kaegyong
    date: 1361–1362
    when: "1361-11"
    borders: "1362-02"
    countries: [kp, kr]
    body:
      - In the tenth month of 1361 a Red Turban army said to number over 100,000, led by Pan Cheng, Sha Liu, Guan Xiansheng and Zhu Yuanshuai, crossed the Yalu, took Sakju and Anju and swept south. King Gongmin fled from Kaegyong by way of Gwangju and Chungju to Bokju (Andong), and five days later the Red Turbans entered the capital. They held it for about two months, burned the palace at Manwoldae and, according to the Goryeosa, committed atrocities against the people; they built ramparts of the hides of slaughtered cattle and horses and poured water on them to make walls of ice.
      - Gongmin made Jeong Se-un commander and called up troops from the whole country. About 200,000 men gathered near Kaegyong, and in the first month of 1362, under An U, Yi Bang-sil, Kim Deuk-bae, Choe Yeong and Yi Seong-gye, they attacked the city at dawn in heavy snow and took it. Sha Liu and Guan Xiansheng were killed, the Goryeosa counts about 100,000 Red Turban dead, and the survivors fled across the Yalu. A few days later An U, Kim Deuk-bae and Yi Bang-sil killed Jeong Se-un, at the instigation of the court official Kim Yong, and were themselves executed. Bokju was raised to the Andong Grand Protectorate.
    facts:
      - [Kaegyong taken, "eleventh month of 1361"]
      - [Kaegyong retaken, "first month of 1362"]
      - [Red Turban losses, "about 100,000 (Goryeosa)"]
