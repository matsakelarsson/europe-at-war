steps:
  - title: The first invasion
    date: 1359–1360
    when: "1359-12"
    borders: "1360-03"
    countries: [kp]
    body:
      - A raid by about 3,000 Red Turbans across the Yalu in the eleventh month of 1359 was followed in the twelfth month by Mao Jujing’s army of 40,000, which crossed the frozen river and took Uiju, then Jeongju and Inju the next day. The Goryeo commanders sent north, among them An U, fell back, and twenty days after the crossing the Red Turbans entered the Western Capital, Pyongyang. Kaegyong prepared to evacuate.
      - In the first month of 1360, after heavy fighting with thousands of casualties on both sides, Goryeo retook Pyongyang. An U and Yi Bang-sil then beat the Red Turbans at Hamjong and Seoncheon, and within about two more months they had been driven back across the Yalu, plundering the north-west as they went.
    facts:
      - [Red Turbans cross the Yalu, "twelfth month of 1359"]
      - [Pyongyang retaken, "first month of 1360"]
