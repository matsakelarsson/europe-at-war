  - title: The Hanseatic war and the Peace of Stralsund
    date: 1362–1370
    when: "1368"
    borders: "1370-05-24"
    countries: [dk, de, "no"]
    body:
      - Valdemar’s conquest of Visby and his heavy dues on the Sound and the Scanian herring markets threatened the trade of the Hanseatic towns. In April 1362 a Hanseatic fleet under Johann Wittenborg of Lübeck laid siege to Helsingborg, but Valdemar fell on the ships and captured a dozen of them; Wittenborg was later executed by his own city. In 1367 the towns, from the Baltic to the Netherlands, formed the Confederation of Cologne and allied with King Albert of Sweden, the dukes of Mecklenburg and the counts of Holstein.
      - In 1368 their fleets sacked Copenhagen and raided the coasts of Denmark and Norway, whose king, Valdemar’s son-in-law Haakon VI, soon made a truce. Swedish and German troops overran most of Scania while the Holsteiners marched into Jutland. Valdemar left the country to seek allies, and when Helsingborg fell in 1369 his council sued for peace. By the Peace of Stralsund on 24 May 1370 the towns kept their privileges and held the Scanian castles of Skanör, Falsterbo, Malmö and Helsingborg, with two-thirds of their revenues, for fifteen years.
    facts:
      - [Battle of Helsingborg, "1362, Danish victory"]
      - [Confederation of Cologne, "1367"]
      - [Peace of Stralsund, "24 May 1370"]
