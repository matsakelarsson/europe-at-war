id: valdemar-atterdag-wars
name: Valdemar Atterdag’s wars with Sweden
start: "1360"
end: "1370"
tier: B
summary: Valdemar IV Atterdag of Denmark took Scania, Blekinge and Halland back from Sweden in 1360 and conquered Gotland and Visby in 1361. The Hanseatic towns, allied with Sweden, then fought him until the Peace of Stralsund in 1370, which confirmed their hold on Baltic trade.
