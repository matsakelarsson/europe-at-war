    body:
      - While Denmark lay broken and pawned to German lords, Magnus Eriksson bought Scania and Blekinge in 1332 from Duke John of Holstein, after the local people said they would rather be ruled by the Swedes. He also gained Halland, and for almost thirty years the Swedish king held the whole southern coast.
      - Valdemar IV Atterdag rebuilt Denmark. In 1360, after the death of Magnus’s rebellious son Erik, he crossed the Sound, forced Magnus to give up Helsingborg and took back Scania, Blekinge and Halland. The next summer he landed on Gotland. On 27 July 1361 his professional soldiers slaughtered the island’s peasant army outside the walls of Visby, which then accepted him as ruler.
