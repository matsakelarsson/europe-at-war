  - title: Vijaya, 1377, and the march on the delta
    date: 1376–1383
    when: "1377"
    borders: "1377-06-01"
    countries: [vn]
    body:
      - After new Cham raids on Hóa Châu in 1376, King Trần Duệ Tông gathered an army that the chronicles number at 120,000 men from the delta, Nghệ An, Quảng Bình and Thuận Hóa, with Hồ Quý Ly in charge of supplies and Đỗ Tử Bình in command, and marched on Vijaya. In early 1377 he found an apparently deserted camp before the city and, ignoring warnings, advanced into it. The Cham sprang an ambush, southern troops in his army went over to them, and the king and several of his generals were killed. The Cham captured a Trần prince, Trần Húc, whom Chế Bồng Nga married to his daughter.
      - The Cham followed the beaten army north, took Thanh Hóa and Nghệ An, where many local people joined them, and sacked Thăng Long again in 1377 and, with Trần Húc claiming the Vietnamese throne, in 1378. The court hid its treasures in the mountains and caves near the coast. In 1380 and 1382 Hồ Quý Ly and the general Nguyễn Đa Phương drove Cham attacks back from Thanh Hóa, raising taxes and men to keep the war going. In 1383 Chế Bồng Nga, on the advice of his general La Khai, took a western route through the mountains, came down on the delta near Sơn Tây, west of the capital, and sacked Thăng Long a fourth time, holding it for six months.
