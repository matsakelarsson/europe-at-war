notes:
  - The war is known mostly from the Vietnamese chronicles, with notices in the Ming Shilu; no Cham inscriptions survive from these years. The chronicles count the Cham sacks of Thăng Long differently (in 1371, 1377, 1378 and 1383 in some accounts, twice in 1377 in others). Wikipedia dates the war proper to 1367–1390; it is dated here from the first Cham raids in 1361.
  - Chế Bồng Nga is the Vietnamese form of the king’s name; Cham tradition remembers him as Po Binasuor. The Ming Shilu gives another account of his death, in which his general La Khai murdered him and took the throne.
