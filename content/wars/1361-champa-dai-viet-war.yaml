  - title: Handguns on the Hải Triều
    date: 1389–1390
    when: "1390"
    borders: "1390-03-01"
    countries: [vn]
    body:
      - In 1389, with Thanh Hóa in revolt against Hồ Quý Ly and a monk leading a rising north-west of the capital, Chế Bồng Nga sailed north again with a Trần prince who had gone over to him, and the Vietnamese defence broke up; Nguyễn Đa Phương killed himself. In early 1390 the Trần general Trần Khát Chân made a stand on the Hải Triều, the Luộc River in today’s Hưng Yên. A Cham officer who had deserted showed the Vietnamese which of the several hundred boats was the king’s, and Trần Khát Chân’s men concentrated the fire of their handguns, weapons recently come from Ming China, on it. Chế Bồng Nga was killed, and his head was brought to Thăng Long.
      - The Cham army withdrew, and La Khai took the throne at Vijaya as Jaya Simhavarman VI; Chế Bồng Nga’s sons fled to Đại Việt. The war ended without any change of borders. By one modern estimate Đại Việt lost about a quarter of its population to war, famine and disease in the late 14th century. Hồ Quý Ly, chief minister from 1387, used his power to push through radical reforms, deposed the last Trần king in 1400 and founded the Hồ dynasty; in 1402–1403 he attacked Champa and took its northern districts, which helped bring on the Ming invasion of 1406.
    facts:
      - [Battle on the Hải Triều (Luộc) River, "early 1390, Trần victory"]
      - [Chế Bồng Nga killed, "1390"]
      - [Hồ Quý Ly takes the throne, "1400"]
