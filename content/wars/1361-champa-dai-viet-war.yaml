steps:
  - title: Chế Bồng Nga’s fleet and the sack of 1371
    date: 1361–1376
    when: "1371"
    borders: "1371-06-01"
    countries: [vn]
    body:
      - In the 14th century Đại Việt, like Cambodia, was weakened by plague, famine and failing harvests, while Champa recovered. Chế Bồng Nga, a son of King Chế A Nan, became king in 1360 and united the Cham lands. In 1361 Cham ships raided the coast of Đại Việt around Hóa Châu (near today’s Huế) and carried off young people gathered for a festival. In 1368 he sent envoys demanding back the districts of Ô and Lý, today’s Quảng Trị and Thừa Thiên Huế, which King Chế Mân had given Đại Việt in 1306 as the price of marrying a Trần princess. The Trần king answered by sending an army towards the old Cham lands around Indrapura, and it was beaten back.
      - In 1369 the childless Trần Dụ Tông died and the crown went to Dương Nhật Lễ, who was not of the Trần blood; in 1370 the Trần princes overthrew and killed him. His mother fled to Champa and urged Chế Bồng Nga to take revenge. In the spring of 1371 a Cham fleet crossed the Gulf of Tonkin, entered the delta by the river mouths and found no army to oppose it. The Cham sacked Thăng Long and set it on fire, carrying off women, jewels and silk, and the books of the royal palace were lost. Chế Bồng Nga also sent tribute to the new Ming emperor and, in 1372, asked him for protection and weapons against Đại Việt.
