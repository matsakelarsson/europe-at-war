id: champa-dai-viet-war
name: Champa–Đại Việt war of 1361–1390
start: "1361"
end: "1390"
tier: B
summary: "Three decades of war in which Champa, reunited under Chế Bồng Nga (Po Binasuor), nearly overthrew the Trần dynasty of Đại Việt. Cham fleets raided the coast from 1361, and in 1368 Chế Bồng Nga demanded back the districts of Ô and Lý, ceded to Đại Việt in 1306. In 1371, after a succession crisis in Thăng Long, his fleet sailed into the Red River delta and sacked the capital. In 1377 the Trần king Trần Duệ Tông led a large army against the Cham capital Vijaya and was killed in an ambush; the Cham marched north, overran Nghệ An and Thanh Hóa with the help of Vietnamese defectors, and sacked Thăng Long again in 1377–1378 and in 1383. The war ended in 1390 on the Hải Triều (Luộc) River, where a volley of handguns hit Chế Bồng Nga’s barge and killed him. Neither side gained land, both were exhausted, and the general Hồ Quý Ly, who had risen in the war, took the Trần throne in 1400."
countries: [vn]
sides:
  - id: ch
    name: Champa (Chế Bồng Nga)
    polities: [champa]
