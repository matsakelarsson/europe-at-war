  - title: Brunkeberg
    date: 1448–1471
    when: "1448"
    borders: "1470"
    countries:
      - se
      - dk
      - no
    view:
      center:
        - 17.3647
        - 59.4269
      size:
        - 357
        - 372
    body:
      - For decades Swedish nobles fought over whether to stay in the union. Karl Knutsson was elected king three times between 1448 and 1467, in between struggles with Christian I of Denmark. After Karl died, his nephew Sten Sture the Elder became regent, and in 1471 Christian sailed to Stockholm with an army to reclaim the Swedish crown.
      - On 10 October 1471 Sture’s army of peasants, miners and townsmen attacked Christian’s camp on the Brunkeberg ridge just north of the city, while the Stockholm garrison struck from inside. Christian was hit in the face and his army was routed. Sweden stayed in the union in name, but Sture ruled it in practice.
    facts:
      - - Battle of Brunkeberg
        - 10 October 1471
      - - Danish-unionist losses
        - About 1,370 killed and 630 captured
