  - title: Engelbrekt’s rebellion
    date: 1434–1436
    when: "1434"
    borders: "1397"
    countries:
      - se
      - dk
      - no
    view:
      center:
        - 15.3749
        - 59.2427
      size:
        - 512
        - 568
    body:
      - Under Eric of Pomerania, Swedes complained of heavy taxes and harsh foreign bailiffs. In the summer of 1434 miners and peasants of Dalarna and Bergslagen rose under Engelbrekt Engelbrektsson, a mine owner from Norberg, and burned Borganäs castle.
      - The revolt spread through Svealand and Götaland, castle after castle was attacked, and Engelbrekt was chosen captain of the realm. On 4 May 1436 he was murdered on an islet in Lake Hjälmaren by the nobleman Måns Bengtsson. The council chose Karl Knutsson as regent, and Eric was deposed a few years later.
    facts:
      - - Leader
        - Engelbrekt Engelbrektsson, from Norberg
      - - Killed
        - 4 May 1436
    markers:
