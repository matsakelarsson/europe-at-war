id: kalmar-union-wars
name: Wars of the Kalmar Union
start: "1364"
end: "1520"
tier: A
summary: The wars over the Scandinavian thrones from the deposition of Magnus Eriksson in 1364 to the Stockholm Bloodbath of 1520. Queen Margaret united Denmark, Norway and Sweden in the Kalmar Union in 1397, but Swedish nobles, peasants and miners fought the union kings again and again.
