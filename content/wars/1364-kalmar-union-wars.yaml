  - title: Margaret, Albert and the Kalmar Union
    date: 1364–1397
    when: "1364"
    borders: "1397"
    countries:
      - se
      - dk
      - no
      - de
    view:
      center:
        - 13.6615
        - 58.1889
      size:
        - 805
        - 843
    body:
      - In 1364 Swedish nobles deposed Magnus Eriksson and chose a German prince, Albert of Mecklenburg, as king. By the 1380s Albert had fallen out with the same nobles, and the Swedish council turned for help to Margaret, the widowed queen who already ruled Denmark and Norway.
      - On 24 February 1389 Margaret’s army defeated Albert at Åsle near Falköping and captured him and his son. His German supporters held out in Stockholm, supplied by the Victual Brothers, until the Hanseatic League stepped in. Albert was released in 1395 and Stockholm passed to Margaret in 1398. In June 1397 her great-nephew Eric of Pomerania was crowned at Kalmar as king of all three kingdoms.
    facts:
      - - Battle of Åsle
        - 24 February 1389
      - - Kalmar Union
        - Eric of Pomerania crowned 17 June 1397
