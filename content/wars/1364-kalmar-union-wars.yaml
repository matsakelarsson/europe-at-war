    name: Sweden
    polities:
      - sweden
    ink: blue
    moves: Swedish and allied moves
    success: Swedish success
  - id: dk
    name: Denmark–Norway
    polities:
      - denmark-norway
      - danish-duchies
    ink: red
    moves: Danish–Norwegian moves
    success: Danish–Norwegian success
notes:
  - Medieval dates are as given in the chronicles.
  - Migrated from Sweden at War, so the story is told from Sweden’s side.
