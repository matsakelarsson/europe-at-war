  - title: Bogesund and the Stockholm Bloodbath
    date: 1517–1520
    when: "1517"
    borders: "1495"
    countries:
      - se
      - dk
      - no
    view:
      center:
        - 15.5046
        - 58.7491
      size:
        - 524
        - 502
    body:
      - Sten Sture the Younger, regent from 1512, fought off Christian II of Denmark twice, winning at Brännkyrka outside Stockholm in 1518. In January 1520 Christian came again with a large mercenary army. On the ice of Lake Åsunden near Bogesund on 19 January, a cannonball struck Sture in the leg. He died on 3 February, and resistance collapsed except in Stockholm, held by his widow Christina Gyllenstierna.
      - Stockholm surrendered that autumn in return for an amnesty, and Christian was crowned king. Days later, on 7–9 November 1520, he had more than 80 nobles, clergy and burghers of the Sture party executed in the Stockholm Bloodbath. Among the dead was the father of a young nobleman, Gustav Eriksson Vasa.
    facts:
      - - Battle of Bogesund
        - 19 January 1520
      - - Stockholm Bloodbath
        - 7–9 November 1520, 80–90 executed
    markers:
      - kind: battle
        side: se
        name: Battle of Brännkyrka
        date: 27 July 1518
        lonlat:
          - 17.999
          - 59.2796
        lp: l
        text: Sture’s troops beat the Danish army just south of Stockholm.
      - kind: battle
        side: dk
        name: Battle of Bogesund
        date: 19 January 1520
        lonlat:
          - 13.4029
          - 57.7699
        text: Fought on frozen Lake Åsunden. Sture was carried off on a sledge and died on the ice of Lake Mälaren on the way to Stockholm.
      - kind: event
        side: dk
        name: Stockholm Bloodbath
        date: 7–9 November 1520
        lonlat:
          - 18.0729
          - 59.3281
        lp: b
        text: Despite his promise of amnesty, Christian II had leading supporters of the Sture party beheaded.
