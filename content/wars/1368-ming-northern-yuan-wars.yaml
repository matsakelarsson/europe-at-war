    moves: Yuan moves
    success: Yuan success
notes:
  - "“Northern Yuan” is the name used by Chinese historians for the Yuan court after 1368. Its khans went on calling their state the Great Yuan and claimed to be the rightful rulers of China."
  - "Köke Temür, the leading Yuan general, is also known by his Chinese name Wang Baobao. The Ming called Beijing Beiping (“the north pacified”) from 1368 until Zhu Di renamed it Beijing in 1403; it became the capital in 1421."
  - "Chinese sources date events by the lunar calendar; the dates here are the Julian equivalents given by the sources used. The accounts disagree over several dates and numbers, above all for the 1372 campaign, and casualty figures come almost only from the Ming side."
  - The capture of Dadu in 1368 belongs to the end of the Red Turban rebellions and is told there. The Ming conquests of Sichuan (1371) and Yunnan (1381–1382) are separate entries.
