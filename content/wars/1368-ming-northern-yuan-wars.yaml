  - title: Shen’er valley and Yingchang
    date: January – June 1370
    when: "1370-05"
    borders: "1370-06-10"
    countries: [cn, mn]
    body:
      - "Köke Temür came back from the west in the winter of 1369–1370 and laid siege to Lanzhou, which held out. In the spring the Hongwu Emperor sent two armies north: Xu Da from Xi’an against Köke Temür, and Li Wenzhong, the emperor’s nephew, from Beiping against the Yuan court. In May 1370 Xu Da caught Köke Temür’s army in the Shen’er valley near Dingxi, in Gansu, and destroyed it. Ming records claim tens of thousands of prisoners, among them Yuan princes and officials. Köke Temür escaped again, crossed the Yellow River and the Gobi, and reached the Yuan court in Mongolia."
      - "Toghon Temür died at Yingchang on 23 May 1370. Li Wenzhong, who had crossed the steppe from the passes north of Beiping, took the town on 10 June. He captured the late emperor’s grandson Maidiribala with many of the court, but the heir, Ayushiridara, escaped with a small escort to Karakorum, the old Mongol capital on the Orkhon, where he became khan as Biligtü Khan."
      - "The Hongwu Emperor treated Maidiribala well, gave him a title and sent him back to the steppe in 1374. He also wrote to Köke Temür several times, inviting him to submit; Köke Temür never answered with anything but refusal and stayed with the khan."
    facts:
      - [Battle in the Shen’er valley, "May 1370, Ming victory"]
      - [Death of Toghon Temür, "23 May 1370, at Yingchang"]
      - [Yingchang taken, "10 June 1370"]
