  - title: Buir Lake
    date: December 1387 – 1388
    when: "1388-05-18"
    borders: "1388-05-18"
    countries: [mn, cn]
    body:
      - "In December 1387 the emperor gave Lan Yu 150,000 men and ordered him to find and destroy the khan. The army marched out through Daning in the spring of 1388 towards Qingzhou, where scouts reported that Tögüs Temür was camped by Buir Lake, far to the north beyond the Gobi. The march across the desert was long, and when the army came within 40 li (about 20 km) of the lake without seeing the Mongols, Lan Yu thought of turning back; his officer Wang Bi persuaded him to go on. Learning that the camp lay north-east of the lake, they approached at night under cover of a sandstorm."
      - "On 18 May 1388 the Ming army fell on the unsuspecting camp. Tögüs Temür escaped with a few followers, but the Ming took one of his sons and, by the various accounts, some 3,000 princes and officials and 70,000 to 77,000 other men and women, with the Yuan seals and about 150,000 horses, cattle and sheep. Ming losses were slight. Lan Yu was made Duke of Liang."
      - "Tögüs Temür fled west towards Karakorum. On the Tuul River he was killed by Yesüder, a descendant of Kublai’s brother Ariq Böke, who had the backing of the Oirats. The khanate survived in name, but the Yuan line lost its authority, and for decades khans were made and unmade by the Oirats in the west and by rival lords in the east. The Ming organised the Mongols who submitted near the frontier as the Three Guards of the Uriankhai in 1389, and the wars of the steppe continued under the Yongle Emperor."
    facts:
      - [Ming army, "150,000 under Lan Yu"]
      - [Battle of Buir Lake, "18 May 1388"]
      - [Captured, "about 3,000 notables and 70,000–77,000 people (sources differ)"]
      - [Tögüs Temür killed, "1388, on the Tuul River"]
