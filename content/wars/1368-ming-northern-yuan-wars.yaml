id: ming-northern-yuan-wars
name: Ming campaigns against the Northern Yuan
start: "1368-09"
end: "1388-05"
tier: A
summary: "The wars between the new Ming dynasty and the Yuan court after it left China. When Ming armies took Dadu (Beijing) in September 1368, the last Yuan emperor, Toghon Temür, withdrew to the steppe, and the dynasty lived on in Mongolia as what Chinese historians call the Northern Yuan. In 1369–1370 the Ming took Shanxi, Shaanxi and Gansu, captured the summer capital Shangdu and the refuge at Yingchang, and defeated the Yuan general Köke Temür near Dingxi. A great Ming expedition into Mongolia in 1372 ended in defeat on the Tuul River, and for fifteen years the Hongwu Emperor held a defensive frontier while the Mongol commander Naghachu kept Manchuria for the Yuan. In 1387 a Ming army of about 200,000 forced Naghachu to surrender, and in May 1388 Lan Yu surprised the camp of the khan Tögüs Temür at Buir Lake, taking tens of thousands of prisoners. Tögüs Temür was murdered by a rival soon afterwards. The Yuan line survived, but its power in the steppe was broken and the Oirats rose in the west."
countries: [cn, mn]
sides:
  - id: mg
    name: Ming dynasty
    polities: [ming]
    ink: red
    moves: Ming moves
    success: Ming success
  - id: ny
    name: Northern Yuan
    polities: [northern-yuan, yuan]
