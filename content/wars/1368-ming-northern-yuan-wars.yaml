  - title: The expedition of 1372
    date: spring – autumn 1372
    when: "1372-06"
    borders: "1372-12-01"
    countries: [cn, mn]
    body:
      - "To finish the Yuan, the Hongwu Emperor sent three armies into Mongolia in the spring of 1372, put at 150,000 men in all. Xu Da’s central army was to march on Karakorum; Li Wenzhong was to take the eastern route by Yingchang and the Kherlen River; Feng Sheng, with Fu Youde, was to clear the Hexi Corridor in Gansu."
      - "The central army drove off Mongol forces on the Tuul River but was then badly beaten by Köke Temür in the steppe beyond the Gobi, the region the Chinese called Lingbei. It is said that he killed 20,000 Ming soldiers; the Ming histories say little about the defeat. Li Wenzhong reached the Tuul and the Orkhon and fought costly battles before he turned back with heavy losses, and another Ming army under Tang He was defeated at Duantou Mountain on 10 August. Only in the west did the plan succeed: Feng Sheng’s army took Ganzhou, Suzhou and the oases as far as Dunhuang."
      - "The defeat changed Ming policy. The emperor gave up the idea of conquering Mongolia and turned to defence: Feng Sheng made the Jiayu Pass, built that year at the western end of the Hexi Corridor, the frontier, and abandoned Dunhuang. Along the whole northern border the Ming built forts and garrison colonies, and placed the emperor’s sons as princes in command of the frontier armies."
    facts:
      - [Ming armies, "three, about 150,000 men in all"]
      - [Battle of Duantou Mountain, "10 August 1372, Ming defeat"]
      - [Jiayu Pass fortress, "built 1372"]
