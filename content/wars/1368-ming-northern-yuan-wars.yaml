  - title: Naghachu surrenders
    date: March – October 1387
    when: "1387-07"
    borders: "1387-10-01"
    countries: [cn]
    body:
      - "Having secured Yunnan in 1382, the Hongwu Emperor turned to the north-east. At the turn of 1386–1387 he gave Feng Sheng command of an army of about 200,000, with Fu Youde and Lan Yu as his deputies; the Prince of Yan led a guard of his own. On 20 March the army marched north through the Great Wall. It first built four fortresses in the hills beyond, at Daning, Fuyu, Huizhou and Kuanhe, and filled them with grain carried up by peasants from four provinces; about 50,000 men were left to hold them."
      - "In July the army crossed the Liao River and within days surrounded Naghachu’s stronghold at Jinshan. A Ming division under Chen Yong had been ambushed and its commander killed on 7 July, but Feng Sheng chose talks over battle. He sent back one of Naghachu’s former officers with a letter offering terms, and Naghachu submitted, on 14 July by one account and in October by another. Some of his chiefs took the surrender for betrayal and fought on, and the Ming rearguard was ambushed on the way home and its commander killed."
      - "Naghachu, his officers and their families were taken to Nanjing. He was made a marquis, given an estate and a house, and died near Wuchang in August 1388. Feng Sheng was accused of taking the best captured horses and lost his command in September 1387. With Naghachu gone, Liaodong was secure, and Daning became the seat of a regional military commission and later of Zhu Quan, Prince of Ning."
    facts:
      - [Ming army, "about 200,000, of whom 50,000 in the new fortresses"]
      - [Army crosses the Great Wall, "20 March 1387"]
      - [Naghachu submits, "July or October 1387 (sources differ)"]
