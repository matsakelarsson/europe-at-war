steps:
  - title: The Yuan court leaves China
    date: September 1368 – July 1369
    when: "1368-09-14"
    borders: "1369-07-20"
    countries: [cn, mn]
    body:
      - "In the summer of 1368 the armies of Zhu Yuanzhang, who had proclaimed the Ming dynasty at Nanjing in January as the Hongwu Emperor, marched north under Xu Da and Chang Yuchun. The Yuan emperor Toghon Temür did not wait for them. On the night of 10 September he left Dadu (Beijing) by a northern gate with his family and court, and on 14 September the Ming army entered the city, which it renamed Beiping. The court moved to the summer capital, Shangdu, beyond the mountains, and from there tried to organise a return."
      - "The Yuan still had a large army in Shanxi under Köke Temür, the strongest of its generals, who had spent the previous years fighting rival Yuan commanders rather than the rebels. When he marched north to threaten Beiping, Xu Da struck at his base. Taiyuan fell on 9 January 1369 after a night attack scattered Köke Temür’s camp, and he escaped with a handful of riders to Gansu. Datong was taken in March, and in the spring Xu Da moved into Shaanxi, where the Yuan commander Li Siqi surrendered in May."
      - "Meanwhile Chang Yuchun led a fast column of cavalry across the steppe and took Shangdu on 20 July 1369. Toghon Temür had already moved on to Yingchang, a walled town by a lake about 200 km further north-east. Chang Yuchun fell ill and died on the way back."
    facts:
      - [Toghon Temür leaves Dadu, "10 September 1368"]
      - [Ming army enters Dadu, "14 September 1368"]
      - [Taiyuan taken, "9 January 1369"]
      - [Shangdu taken, "20 July 1369"]
