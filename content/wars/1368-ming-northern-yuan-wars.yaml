  - title: A defended frontier
    date: 1373–1386
    when: "1375"
    borders: "1380-01-01"
    countries: [cn, mn]
    body:
      - "For the next fifteen years the war was one of raids and counter-raids along a frontier that the Ming now meant to hold rather than push forward. Köke Temür raided the borderlands until he was beaten near Huairou, north of Beiping, in November 1373; he died in 1375. Ayushiridara died in 1378 and was succeeded by Tögüs Temür, who kept the court in the steppe and sent armies against the frontier."
      - "In the north-east the Yuan were still strong. Naghachu, the Yuan commander in Liaoyang province, gathered the tribes of the Liao River and Manchuria under his leadership. In 1372 his men burned the Ming grain stores at Niujiazhuang in Liaodong, and in 1375 he attacked the Ming garrisons on the peninsula, which held. The Ming had landed troops in Liaodong by sea from Shandong in 1371 and set up a regional military commission at Liaoyang in 1375, but they could not go further while Naghachu stood on their flank."
      - "The Hongwu Emperor relied on garrisons and on his sons. Zhu Di, the Prince of Yan, took up his post at Beiping in 1380, and his elder brothers, the princes of Qin and Jin, held Xi’an and Taiyuan. Ming columns struck at Mongol camps beyond the Wall almost every year, and in 1380, by some accounts, one of them reached and sacked Karakorum before turning back. The Yuan court survived these raids, but its hold on the tribes slowly weakened."
    facts:
      - [Death of Köke Temür, "1375"]
      - [Death of Ayushiridara, "1378; Tögüs Temür khan 1378–1388"]
      - [Ming princes on the frontier, "Yan at Beiping from 1380"]
