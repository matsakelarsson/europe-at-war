id: fernandine-wars
name: Fernandine Wars
start: "1369"
end: "1382-08"
tier: C
summary: Three wars between Ferdinand I of Portugal and the Trastámara kings of Castile, fought over Ferdinand’s claim to the Castilian throne after the murder of Peter I in 1369 and tied to the Hundred Years’ War. The first (1369–1371) ended with the Peace of Alcoutim. In the second (1372–1373), after Ferdinand allied with John of Gaunt, Henry II invaded Portugal, besieged Lisbon and burned part of the city; by the Treaty of Santarém Portugal had to side with Castile and France, and Ferdinand built new walls around Lisbon. In the third (1381–1382) an English army under the Earl of Cambridge came to Portugal, but the Castilian fleet destroyed the Portuguese at Saltés in July 1381, and Ferdinand made peace at Elvas in 1382. His daughter Beatrice was married to John I of Castile, which led to the crisis of 1383–1385.
