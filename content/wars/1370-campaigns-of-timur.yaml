  - title: The march on China
    date: December 1404 – February 1405
    when: "1405-02-18"
    borders: "1405-02-18"
    countries: [uz, kz]
    body:
      - The Ming emperors had treated Timur as a tributary, and he had detained their envoys. In December 1404, now about seventy, he set out from Samarkand with a great army, put at 200,000 men, to invade China, an unusual winter campaign. The army crossed the frozen Syr Darya, but Timur fell ill in the bitter cold and died at Otrar on 17 or 18 February 1405. The campaign was abandoned and his body was taken back to Samarkand and buried in the Gur-e Amir.
      - Timur had named his grandson Pir Muhammad as his heir, but another grandson, Khalil Sultan, seized Samarkand, and his sons and grandsons fought over the empire for years. His son Shah Rukh, ruling from Herat, eventually reunited most of Iran and Transoxiana, while the Kara Koyunlu took Azerbaijan and Iraq. Timur’s conquests left Samarkand and Herat as the centres of a brilliant court culture in the fifteenth century, and much of western Asia devastated.
    facts:
      - [Death of Timur, "17 or 18 February 1405, at Otrar"]
      - [Burial, "Gur-e Amir, Samarkand"]
    markers:
      - kind: event
