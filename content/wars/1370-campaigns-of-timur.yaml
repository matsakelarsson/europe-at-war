  - title: Georgia, Syria and Baghdad
    date: 1399–1401
    when: "1401-03"
    borders: "1401-07"
    countries: [ge, tr, sy, lb, iq]
    body:
      - In 1399 Timur set out on his last great campaign in the west, the Seven-Year Campaign. He ravaged eastern Georgia in the winter of 1399–1400 and in the spring defeated King George VII, carrying off tens of thousands of captives. In August 1400 he took and sacked Sivas, an Ottoman city, then turned south against the Mamluks, who had given refuge to Ahmad Jalayir and killed his envoys, and whose sultan was now the boy Faraj. On 30 October 1400 he routed the army of the Syrian governors outside Aleppo; the city was taken, its citadel surrendered on 2 November, and many of its people were killed and their heads built into towers. Hama, Homs and Baalbek followed.
      - Faraj came from Egypt with his army to relieve Damascus, but after some fighting outside the city he hurried back to Cairo in January 1401 to forestall a plot among his emirs. The city’s notables negotiated with Timur, among them the historian Ibn Khaldun, who met him several times. Damascus surrendered and paid a heavy ransom; the citadel held out for weeks. Timur’s troops then plundered the city, killing many of its people, and in March 1401 a fire destroyed much of it, including the Umayyad Mosque. Thousands of craftsmen were deported to Samarkand.
      - Ahmad Jalayir had returned to Baghdad, and in June 1401 Timur laid siege to it. After about forty days the city was stormed in the midday heat in July. Timur ordered each of his soldiers to bring him heads of the inhabitants; estimates of the dead range from 20,000 to 90,000. Apart from mosques, madrasas and hospitals, the city was largely destroyed. Timur then withdrew to winter in Karabakh and prepared for war with the Ottoman sultan Bayezid I.
    facts:
      - [Battle outside Aleppo, "30 October 1400, Timurid victory"]
      - [Damascus sacked, "February – March 1401"]
      - [Baghdad stormed, "July 1401; estimates range from 20,000 to 90,000 dead"]
