  - title: The Five-Year Campaign
    date: 1392–1396
    when: "1393-08"
    borders: "1394"
    countries: [ir, iq, tr, ge]
    body:
      - In 1392 Timur set out again on a campaign that lasted until 1396. He first subdued Mazandaran, where the Sayyids of Amol held out in their fortresses, then marched on Fars, which the Muzaffarid Shah Mansur had seized. In the spring of 1393, outside Shiraz, Mansur charged into Timur’s centre with a few thousand men and is said to have come within reach of Timur himself before he was cut down. The surviving Muzaffarid princes submitted, but in May 1393 Timur had them all executed at Qumisha south of Isfahan, except for two sons of Shah Shuja who were sent to Samarkand.
      - In August 1393 Timur came on Baghdad by a rapid march. Sultan Ahmad Jalayir fled to Syria, where the Mamluk sultan Barquq gave him refuge and had Timur’s envoys killed. Baghdad was plundered and heavily taxed, and its scholars, musicians and painters were sent to Samarkand. Timur then stormed Tikrit, killing its defenders and building towers of their heads, and moved north through Mardin and the Diyarbakir region into Armenia and, in 1394, Georgia. In the autumn of 1394 Tokhtamysh raided Shirvan, and in 1395 Timur crossed the Caucasus, routed him on the Terek and sacked the cities of the Golden Horde before returning to Samarkand in 1396. Behind him, Ahmad Jalayir had already retaken Baghdad with Mamluk help in 1394.
    facts:
      - [Battle outside Shiraz, "March 1393, Timurid victory"]
      - [Baghdad taken, "August 1393"]
      - [Battle of the Terek, "April 1395"]
