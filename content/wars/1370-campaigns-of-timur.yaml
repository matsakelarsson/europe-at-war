  - title: Ankara and the return to Samarkand
    date: 1402–1404
    when: "1402-07-28"
    borders: "1404"
    countries: [tr, ge, az, ir, uz]
    body:
      - In 1402 Timur invaded Anatolia and on 28 July destroyed the Ottoman army at Ankara and captured Bayezid, who died in captivity the next year; the war is told separately. Timur’s troops raided as far as the Aegean and the Sea of Marmara, and in December 1402 he took Smyrna from the Knights Hospitaller after a two-week siege. He restored the Turkish emirates that Bayezid had annexed, and the Mamluk sultan Faraj made peace with him.
      - Timur returned east in 1403, forced George VII of Georgia to pay a heavy tribute and recognise his overlordship, and sent his grandson Abu Bakr to take back Baghdad from Qara Yusuf of the Kara Koyunlu. In the summer of 1404 he was back in Samarkand, where he received the Castilian ambassador Ruy González de Clavijo and held months of festivities while he prepared his next campaign, against Ming China.
    facts:
      - [Battle of Ankara, "28 July 1402, Timurid victory"]
      - [Smyrna taken, "December 1402"]
      - [Return to Samarkand, "summer 1404"]
