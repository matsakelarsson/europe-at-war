  - title: Khwarazm and Moghulistan
    date: 1370–1380
    when: "1379"
    borders: "1379"
    countries: [uz, tm, kz, kg]
    body:
      - Timur spent the 1370s securing his frontiers and keeping the tribal emirs busy with plunder. He led or sent repeated expeditions into Moghulistan, the lands of the eastern Chagatai khans beyond the Syr Darya and the Tian Shan, defeating their armies but never holding the country. He also gave refuge and troops to Tokhtamysh, a Jochid prince fighting for the throne of the eastern Golden Horde, who became khan with his help in 1378 and later his most dangerous enemy.
      - In Khwarazm, the Sufi dynasty had made itself independent in the delta of the Amu Darya and claimed the towns of Khiva and Kath. Timur invaded in 1372–1373, and Yusuf Sufi submitted and gave his daughter Khanzada in marriage to Timur’s son Jahangir. But Yusuf raided Timur’s lands again, and in 1379 Timur besieged Urgench. Yusuf died during the siege, the city refused to surrender, and after three months it was stormed, its people massacred and the city burned. Khwarazm was annexed, though it rose again in the 1380s and was punished even more harshly in 1388.
    facts:
      - [First invasion of Khwarazm, "1372–1373"]
      - [Siege of Urgench, "1379, about three months"]
      - [Tokhtamysh becomes khan with Timur’s help, "1378"]
