notes:
  - The main narratives are the court histories of Nizam al-Din Shami and Sharaf al-Din Ali Yazdi, written to glorify Timur, and the hostile biography by Ibn Arabshah, who was carried off from Damascus as a boy. Ibn Khaldun, who met Timur outside Damascus, and the Castilian envoy Clavijo, who visited Samarkand in 1404, left first-hand accounts.
  - The death tolls of Timur’s massacres come from chroniclers on both sides and are often rounded or inflated, but the killings at Isfahan, Delhi, Baghdad and elsewhere are well attested. Some modern writers put the total number of deaths caused by his campaigns at up to 17 million; such figures are guesses.
  - Timur’s wars with Tokhtamysh of the Golden Horde (1386–1396) and with the Ottoman sultan Bayezid I (1400–1402) are told as separate stories, as is the war among his heirs after 1405.
