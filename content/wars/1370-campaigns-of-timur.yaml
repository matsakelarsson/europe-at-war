id: campaigns-of-timur
name: Campaigns of Timur
start: "1370-04"
end: "1405-02-18"
tier: A
summary: The conquests of Timur, known in Europe as Tamerlane, a Turkic emir of the Barlas tribe who made himself master of Transoxiana in 1370 and spent the next 35 years at war. From his capital, Samarkand, he took Khwarazm and Khorasan, and in a series of long campaigns between 1386 and 1404 overran Iran, Iraq, the Caucasus and eastern Anatolia, twice defeated the Golden Horde, sacked Delhi, and beat the Mamluks in Syria and the Ottomans at Ankara. His campaigns were marked by deliberate mass killings of cities that resisted or rebelled, such as Isfahan, Delhi and Baghdad, and by the deportation of craftsmen and scholars to adorn Samarkand. He built no lasting administration outside his heartland, and after his death at Otrar in 1405, on the way to attack China, his sons and grandsons fought over his empire, which soon shrank to Transoxiana and eastern Iran.
