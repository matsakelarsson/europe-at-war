  - title: The Three-Year Campaign
    date: 1386–1388
    when: "1387-11"
    borders: "1388"
    countries: [ir, az, ge, am, tr]
    body:
      - In 1386 Timur set out on what his historians called the Three-Year Campaign. He took Tabriz, whose Jalayirid ruler Sultan Ahmad fled, and marched into the Caucasus. He took Kars and on 21 November 1386 stormed Tbilisi and captured King Bagrat V of Georgia, who was released after professing Islam. Timur wintered on the Karabakh plain, where his troops beat off an attack by Tokhtamysh in the spring of 1387. He then campaigned against the Kara Koyunlu Turkmen around Lake Van and took the fortress of Van, whose defenders, according to Armenian chroniclers, were thrown from the rock.
      - In the autumn of 1387 Timur turned on the Muzaffarid lands in central and southern Iran. Isfahan surrendered and agreed to pay a ransom, but while it was being collected the townspeople rose and killed the Timurid soldiers in the city, said to number some 3,000. Timur ordered a general massacre, with each unit of his army required to deliver a quota of heads. Estimates of the dead range from 70,000 to 200,000; an eyewitness counted 28 towers of about 1,500 heads each. Shiraz then submitted. Timur was preparing to go further when news came that Tokhtamysh had invaded Transoxiana, and early in 1388 he hurried back to Samarkand.
    facts:
      - [Tbilisi stormed, "21 November 1386"]
      - [Massacre at Isfahan, "November 1387; estimates range from 70,000 to 200,000 dead"]
      - [Return to Samarkand, "early 1388"]
    markers:
