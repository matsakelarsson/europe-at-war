  - title: India
    date: 1398–1399
    when: "1398-12-17"
    borders: "1399-03"
    countries: [pk, in, af]
    body:
      - The Delhi Sultanate had broken apart under the last Tughluq rulers, and in 1398 two cousins claimed the throne, Nasir al-Din Mahmud Shah, controlled by his minister Mallu Iqbal, in Delhi, and Nusrat Shah at nearby Firozabad. Timur’s grandson Pir Muhammad crossed the Indus first and besieged Multan, which fell after six months. Timur left Samarkand in the spring of 1398, campaigned in the mountains of today’s Nuristan on the way, and crossed the Indus at the end of September with perhaps 90,000 men. He sacked Tulamba and massacred its people, joined Pir Muhammad, and in November stormed the fortress of Bhatner on the edge of the Thar desert, killing its defenders, before marching on Delhi.
      - Before the battle, at Loni outside Delhi, Timur had the Indian prisoners taken during the campaign killed, fearing they would rise during the fighting; his historians give their number as 100,000. On 17 December 1398 he met Mahmud Shah and Mallu Iqbal, whose army included some 120 war elephants, on the plain outside the city. Timur’s men had dug ditches and strewn caltrops in front of their lines, and when the elephants were driven back the Delhi army broke. Mahmud Shah fled to Gujarat. The city surrendered, but when Timur’s soldiers, sent in to collect the ransom, clashed with the townspeople, Delhi was sacked for several days. Many thousands were killed and many more taken as slaves; stonemasons and craftsmen were sent to Samarkand, where they worked on Timur’s great mosque.
      - Timur left Delhi at the beginning of January 1399, stormed Meerut, reached the Ganges at Haridwar and returned along the foot of the Himalayas by way of Jammu, crossing the Indus in March. He left Khizr Khan as his governor in Multan and Lahore; Khizr Khan took Delhi in 1414 and founded the Sayyid dynasty. Delhi was struck by famine and disease after the sack and took decades to recover.
    facts:
      - [Indus crossed, "end of September 1398"]
      - [Battle of Delhi, "17 December 1398, Timurid victory"]
      - [Return across the Indus, "March 1399"]
