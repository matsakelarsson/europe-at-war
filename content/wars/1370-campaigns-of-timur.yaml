steps:
  - title: Master of Transoxiana
    date: 1360–1370
    when: "1370-04"
    borders: "1370-04"
    countries: [uz, af, tj, kz]
    body:
      - Timur was born in the 1320s near Kesh, today’s Shahrisabz, into a family of the lesser nobility of the Barlas, a Mongol tribe that had become Turkic in speech and Muslim in religion. Transoxiana was nominally ruled by khans of the house of Chagatai, but real power lay with the tribal emirs, and after the emir Qazaghan was murdered in 1358 the country fell into anarchy. When the khan of Moghulistan, Tughlugh Timur, invaded in 1360 and 1361, Timur submitted to him and was given Kesh, but soon broke away and joined Qazaghan’s grandson, Amir Husayn, whose sister he married. In these years, fighting as a soldier of fortune in Sistan, he was wounded in the right leg and hand, which earned him the Persian nickname Timur-i Lang, “Timur the Lame”, the origin of the European “Tamerlane”.
      - After Tughlugh Timur’s death in 1363, Husayn and Timur drove his son Ilyas Khoja out of Transoxiana, but in 1365 Ilyas Khoja defeated them near Tashkent in the “Battle of the Mire”, fought in pouring rain, and they abandoned Samarkand. The townspeople, led by a popular movement known as the Sarbadars, defended the city themselves until an epidemic among the Moghuls’ horses forced them to withdraw. Husayn and Timur then returned and put most of the Sarbadar leaders to death. The two allies became rivals, and in 1370 Timur besieged Husayn in Balkh. Husayn surrendered and was killed by an emir with a blood feud against him, with Timur’s consent. In April 1370 Timur was recognised at Balkh as ruler of the Chagatai realm. As he was not a descendant of Genghis Khan, he ruled through puppet khans and took the title güregen, “son-in-law”, after marrying Husayn’s widow Saray Mulk Khanum, a Chinggisid princess. He made Samarkand his capital.
    facts:
      - [Battle of the Mire, "1365, Moghul victory"]
      - [Siege of Balkh, "1370"]
      - [Timur recognised as ruler, "April 1370"]
