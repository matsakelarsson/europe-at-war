  - title: Herat and Khorasan
    date: 1381–1384
    when: "1381-04"
    borders: "1384"
    countries: [af, ir, tm]
    body:
      - Khorasan was divided between the Kartid kings of Herat, the Sarbadars of Sabzevar and a number of emirs. In 1381 Timur invaded. After storming the nearby town of Fushanj and killing its people, he besieged Herat. Its walls were taken after four days, and in April 1381 the Kartid king Ghiyath al-Din Pir Ali surrendered on terms. The people were spared on payment of a heavy ransom, the walls were pulled down, the treasures of the Kartids were carried off and the city’s iron gates were sent to Kesh. The Sarbadar ruler Ali Mu’ayyad submitted and joined Timur’s army.
      - In 1383 Herat rose and was put down by Timur’s son Miran Shah, who built towers of the rebels’ heads; the Kartid family was put to death in 1389. Other rebellions in Khorasan were crushed with deliberate cruelty. At Isfizar, according to the chroniclers, some 2,000 prisoners were built alive into towers of brick and mortar. Timur then ravaged Sistan, destroying its capital, Zaranj, and its irrigation works, and took Kandahar. In 1384 he moved west through Mazandaran and took Soltaniyeh, the old Ilkhanid capital, from the Jalayirids.
    facts:
      - [Herat surrenders, "April 1381"]
      - [Herat’s revolt crushed, "1383"]
      - [Zaranj destroyed, "1383"]
