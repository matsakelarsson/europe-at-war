id: goryeo-liaodong-campaigns
name: Goryeo’s Liaodong campaigns
start: "1370-01"
end: "1388-06"
tier: B
summary: "Goryeo’s two attempts to push into Liaodong as the Yuan empire collapsed, the second of which ended in Yi Seong-gye’s coup. After breaking with the Yuan in 1356 and retaking the north-east, King Gongmin sent armies across the Yalu in 1370 against the Yuan forces left in Liaodong. Yi Seong-gye took the mountain fortress of Uraseong (Wunu shan) in the first month, and in the eleventh month he and Ji Yong-su took Liaoyang, the main city of the region, but withdrew for lack of supplies. In the following years the new Ming dynasty took over Liaodong. In 1388, when the Ming announced that it would claim the lands north of Cheollyeong, King U and his chief minister Choe Yeong sent an army of nearly 39,000 to attack Liaodong. Yi Seong-gye, one of its two commanders, had argued against the war; when the army reached Wihwado, an island in the Yalu, in the rains, he and Jo Min-su turned it around, marched on Kaegyong, exiled Choe Yeong and deposed the king. Four years later Yi Seong-gye founded the Joseon dynasty."
countries: [kp, cn, kr]
