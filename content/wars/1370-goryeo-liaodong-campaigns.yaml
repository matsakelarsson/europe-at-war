notes:
  - Dates are lunar months from the Goryeosa. In 1388 the army left Pyongyang on the eighteenth day of the fourth month, reached Wihwado on the seventh day of the fifth month and turned back on the twenty-second, which fell in late June by the Julian calendar.
  - Goryeo fought no battle with the Ming. The figure of nearly 39,000 soldiers (38,830, with 11,634 porters and 21,682 horses) is from the Goryeosa; some accounts give up to 100,000.
