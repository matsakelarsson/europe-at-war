steps:
  - title: Uraseong and Liaoyang
    date: "1370"
    when: "1370-01"
    borders: "1370-12"
    countries: [cn, kp]
    body:
      - In 1356 King Gongmin broke with the Yuan, destroyed the pro-Yuan faction of the Gi family at court and retook the Ssangseong commandery in the north-east, where Yi Seong-gye’s father Yi Ja-chun went over to Goryeo. After the Ming took the Yuan capital in 1368 and the Yuan court fled north, Goryeo turned on the Yuan’s remaining officials in Liaodong, among them Gi Saein-temur, a son of the executed Gi Cheol. In the first month of 1370 Yi Seong-gye, then commander of the north-east, crossed the Yalu and the Pojeo (Hun) River and besieged the mountain fortress of Uraseong, today’s Wunu shan near Huanren. Its commander, Ilihuntimur (Yi Oro-temur), surrendered with his people.
      - In the eleventh month of 1370 Ji Yong-su and Yi Seong-gye marched on Liaoyang, held by Gi Saein-temur, and took it. Without supplies to hold the city, they called on its people to accept Goryeo’s rule and withdrew. In the following years the Ming set up a military command in Liaodong and took control of the region.
    facts:
      - [Uraseong taken, "first month of 1370"]
      - [Liaoyang taken, "eleventh month of 1370"]
