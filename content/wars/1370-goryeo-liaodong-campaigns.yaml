  - title: Wihwado
    date: "1388"
    when: "1388-05"
    borders: "1388-06"
    countries: [kp, kr]
    body:
      - In the second month of 1388 an envoy returning from the Ming reported that the Ming emperor claimed the lands north of Cheollyeong, the former Ssangseong commandery, for a new Tieling commandery. King U and his chief minister Choe Yeong decided to attack Liaodong. Yi Seong-gye objected, giving four reasons. A small country should not defy a great one. A campaign in summer would take men from the fields. The wokou would raid while the army was away. And the monsoon rains would loosen the glue of the bows and spread disease. He was overruled. On the eighteenth day of the fourth month an army of 38,830 men, with 11,634 porters and 21,682 horses, left Pyongyang under Jo Min-su and Yi Seong-gye, while the king and Choe Yeong stayed behind.
      - The army reached Wihwado, an island in the Yalu, on the seventh day of the fifth month. The rains had come, the river was in flood and men were deserting, and the court refused requests to turn back. On the twenty-second day Yi Seong-gye persuaded Jo Min-su to lead the army home. They marched on Kaegyong, overcame Choe Yeong’s troops and took the capital. Choe Yeong was exiled and executed at the end of the year, and King U was deposed and sent to Ganghwa. Yi Seong-gye now held power, and in 1392 he took the throne himself as the first king of Joseon.
    facts:
