id: ming-conquest-of-sichuan
name: Ming conquest of Sichuan
start: "1371-01"
end: "1371-09"
tier: C
summary: "The campaign in which the Ming dynasty took Sichuan from the Xia state founded by Ming Yuzhen, whose family name has nothing to do with the dynasty’s name. Ming Yuzhen, a Red Turban commander, had made himself master of Sichuan, declared himself king in 1360 and emperor of the Great Xia in 1362, with his capital at Chongqing; at his death in 1366 his nine-year-old son Ming Sheng succeeded him. Xia refused to submit to the Hongwu Emperor, and when its general Wu Youren raided Xingyuan and Hanzhong in 1370, the Ming prepared an invasion from two sides. Early in 1371 Tang He and Liao Yongzhong led a fleet up the Yangtze, while Fu Youde marched south from Shaanxi and Gansu. Fu Youde took Jiezhou, Mianzhou and Hanzhou (Guanghan) between May and July; on the river, the Xia defences in the Qutang Gorge, with chained bridges and catapults, held up Tang He until Liao Yongzhong broke them with cannon fire. The fleets reached Chongqing, where Ming Sheng surrendered on 3 August 1371, and Chengdu, whose defenders had used war elephants against Fu Youde, gave up about a month later. Ming Sheng was given a title and sent in 1372 to live in Goryeo (Korea), and Wu Youren was executed in Nanjing. The conquest opened the way to Yunnan, taken in 1381–1382."
