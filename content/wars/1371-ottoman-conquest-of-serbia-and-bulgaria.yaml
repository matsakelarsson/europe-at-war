id: ottoman-conquest-of-serbia-and-bulgaria
name: Ottoman conquest of Serbia and Bulgaria
start: "1371-09-26"
end: "1396-10"
tier: A
summary: The quarter-century in which the Ottomans broke the Serbian and Bulgarian states that had dominated the central Balkans. After the Serbian lords of Macedonia were destroyed at the Maritsa in 1371, their heirs and the tsar of Tarnovo became Ottoman vassals; Sofia and Niš fell in the 1380s, and although the Serbs and Bosnians won at Pločnik and Bileća, the battle of Kosovo in 1389, in which both Prince Lazar and Sultan Murad I were killed, left Serbia a vassal state. Bayezid I took Tarnovo in 1393 and Nicopolis in 1395, and after the crusade of Nicopolis in 1396 he annexed Vidin, the last Bulgarian realm.
countries: [rs, bg, xk, mk, gr, tr, ba, al, ro]
sides:
  - id: ott
    name: Ottoman Empire and its vassals
    polities: [ottoman]
