notes:
  - Dates are Julian, as usual for the period. The battle of Kosovo was fought on 15 June 1389 by the Julian calendar; it is commemorated on St Vitus’ Day (Vidovdan), now 28 June.
  - Sources for these years are scarce and often written long afterwards, and many dates are uncertain. The chronicles’ numbers are much too large; modern historians think most armies of the time numbered a few thousand to a few tens of thousands.
  - The battle of Kosovo became the centre of a Serbian national tradition, the Kosovo myth, that grew in the 19th century; Albanian, Bosnian and other historians stress their own peoples’ part in Lazar’s army. Who fought, and how the battle went, is still argued over.
  - Places are given their usual English names, with others in brackets where helpful (Chernomen/Ormenio, Velbazhd/Kyustendil, Tarnovo/Veliko Tarnovo, Nicopolis/Nikopol). The crusade of Nicopolis (1396) has its own entry.
