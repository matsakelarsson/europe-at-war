steps:
  - title: The Maritsa and the vassal lords
    date: 1371–1383
    when: "1371-09-26"
    borders: "1383-09"
    countries: [gr, tr, mk, bg, rs]
    body:
      - After the death of Stefan Dušan in 1355 his Serbian empire broke up among regional lords. In 1371 two brothers who ruled the south, Vukašin Mrnjavčević, king alongside the weak emperor Uroš V, and Despot Jovan Uglješa, lord of Serres, led an army east to strike at the Ottomans in Thrace while Sultan Murad I was in Anatolia. On 26 September 1371 Ottoman frontier troops under Lala Şahin Pasha and Hacı İlbey fell on their camp by night near Chernomen on the Maritsa, west of Adrianople. Both brothers were killed and their army destroyed. Uroš V died in December, the last of the Nemanjić dynasty.
      - The lords of Macedonia submitted to the sultan, paying tribute and sending troops when called. Vukašin’s son Marko ruled from Prilep and the brothers Jovan Dragaš and Konstantin Dejanović held the lands around Velbazhd (Kyustendil) as Ottoman vassals; Byzantium recovered Serres for a time, but the Ottomans took it in 1383. In Bulgaria, Ivan Shishman of Tarnovo lost northern Thrace and in 1373 accepted Ottoman overlordship, marrying his sister Kera Tamara to Murad. In the north Prince Lazar Hrebeljanović built up a strong state in the Morava valley, and his men drove off Ottoman raiders at Dubravnica.
    facts:
      - [Battle of Maritsa, "26 September 1371, Ottoman victory"]
      - [Death of Uroš V, "December 1371, end of the Nemanjić line"]
      - [Ivan Shishman a vassal, 1373]
    markers:
      - kind: battle
        side: ott
        name: Battle of Maritsa
        date: 26 September 1371
        text: Ottoman troops surprised the Serbian camp at night near Chernomen (Ormenio). King Vukašin and Despot Uglješa were both killed.
        lonlat: [26.217, 41.717]
      - kind: event
        side: ott
        name: Prilep
        date: 1371–1395
        text: Vukašin’s son Marko, the Kraljević Marko of Serbian epic songs, ruled a small lordship from Prilep as an Ottoman vassal.
        lonlat: [21.553, 41.344]
      - kind: event
        side: ott
        name: Velbazhd
        date: 1371–1395
        text: Jovan Dragaš and then his brother Konstantin Dejanović ruled the lands between the Struma and the Vardar from here as vassals of the sultan.
        lonlat: [22.683, 42.283]
      - kind: taken
        side: ott
        name: Serres
        date: "1383"
        text: Uglješa’s capital, recovered by the Byzantines after the Maritsa, fell to the Ottomans after a siege.
        lonlat: [23.55, 41.083]
      - kind: event
        side: ott
        name: Tarnovo
        date: "1373"
        text: Tsar Ivan Shishman accepted Ottoman overlordship and gave up lands in Thrace; some fortresses were returned to him.
        lonlat: [25.65, 43.083]
      - kind: battle
        side: ser
        name: Battle of Dubravnica
        date: 1380 or 1381
        text: Lazar’s commanders Crep and Vitomir beat an Ottoman raiding force near Paraćin.
        lonlat: [21.41, 43.86]
    arrows:
      - side: ser
        label: Vukašin and Uglješa
        via: [[23.55, 41.09], [24.9, 41.15], [25.9, 41.5], [26.2, 41.7]]
  - title: Sofia and Niš
    date: 1382–1386
    when: "1382"
    borders: "1386"
    countries: [bg, rs, al, mk]
    body:
      - In the early 1380s the Ottomans pressed west along the great road from Adrianople towards Belgrade. Sofia, which commanded the routes into Serbia and Macedonia, beat off Lala Şahin Pasha until a renegade lured its governor, Yanuka, out of the town to hunt; he was captured and the leaderless defenders surrendered. The fall is dated to 1382 or to 1385. The walls were pulled down and Sofia became the seat of an Ottoman governor. In 1386 Murad himself took Pirot and, after a siege, Niš, driving a wedge between Bulgaria and Lazar’s Serbia.
      - The Ottomans were also drawn into the feuds of the Albanian and Serbian lords on the Adriatic. Called in by Karl Thopia against Balša II of Zeta, who had taken Durrës from him, Hayreddin Pasha brought an army from Ohrid into the plain near Lushnjë. On 18 September 1385 Balša rode out against it with a small force and was killed in the battle of Savra. Afterwards many lords of the region accepted Ottoman overlordship, and in 1386 Ottoman raiders appeared for the first time in Bosnia.
    facts:
      - [Fall of Sofia, "1382 or 1385"]
      - [Battle of Savra, "18 September 1385, Ottoman victory; Balša II killed"]
      - [Fall of Niš, "1386"]
    markers:
      - kind: taken
        side: ott
        name: Sofia
        date: 1382 or 1385
        text: Taken after its governor Yanuka was captured by a ruse. It became the seat of an Ottoman sanjak.
        lonlat: [23.33, 42.7]
      - kind: taken
        side: ott
        name: Pirot
        date: "1386"
        text: The fortress on the Nišava fell to Murad’s army on its way west.
        lonlat: [22.586, 43.153]
        lp: b
      - kind: taken
        side: ott
        name: Niš
        date: "1386"
        text: Murad took the town after a siege, opening the way into the Morava valley. By some accounts Lazar then agreed to pay tribute.
        lonlat: [21.896, 43.321]
      - kind: battle
        side: ott
        name: Battle of Savra
        date: 18 September 1385
        text: Balša II of Zeta, with about a thousand men from Durrës, attacked Hayreddin Pasha’s much larger army and was killed.
        lonlat: [19.683, 40.9]
    arrows:
      - side: ott
        label: Murad I
        via: [[24.75, 42.15], [23.33, 42.7], [22.6, 43.15], [21.93, 43.31]]
      - side: ott
        label: Hayreddin Pasha
        via: [[20.8, 41.12], [20.3, 40.95], [19.72, 40.9]]
  - title: Pločnik and Bileća
    date: 1386–1388
    when: "1386"
    borders: "1388-08-27"
    countries: [rs, ba, bg, tr]
    body:
      - The sultan’s demands and the plundering of his raiders pushed the Serbian lords together. In 1386 or 1387 an Ottoman raiding army entered the Toplica valley; while most of its men were scattered plundering, Lazar’s army caught it near Pločnik, close to Prokuplje, and routed it. In August 1388 Lala Şahin Pasha, called in by Đurađ II Balšić of Zeta against King Tvrtko I of Bosnia, plundered Hum in the south of Tvrtko’s kingdom. Ragusa took in refugees, and near Bileća the Bosnian grand duke Vlatko Vuković destroyed the raiders; Şahin escaped with a few men.
      - Encouraged, Ivan Shishman of Tarnovo refused to send troops to the sultan. In 1388 the grand vizier Çandarlı Ali Pasha crossed the Balkan Mountains with a large army, took Shumen and other fortresses and besieged Shishman in Nicopolis on the Danube. Shishman promised to give up Silistra, then broke his word; Ali Pasha returned, took more towns and besieged him again, and this time he submitted on harder terms, with Ottoman garrisons in Silistra and Shumen. His half-brother Ivan Sratsimir of Vidin also accepted Ottoman overlordship and a garrison.
    facts:
      - [Battle of Pločnik, "1386 or 1387, Serbian victory"]
      - [Battle of Bileća, "about 27 August 1388, Bosnian victory"]
      - [Ali Pasha’s campaign, "1388, Shishman submits again"]
    markers:
      - kind: battle
        side: ser
        name: Battle of Pločnik
        date: 1386 or 1387
        text: Lazar’s army, with many heavy cavalry, surprised an Ottoman raiding force under Şahin Bey and drove it off with heavy losses.
        lonlat: [21.356, 43.202]
      - kind: battle
        side: bos
        name: Battle of Bileća
        date: August 1388
        text: Vlatko Vuković’s Bosnians caught the Ottoman raiders after days of looting in Hum, north-east of Ragusa. It was the first Ottoman defeat in Bosnian lands.
        lonlat: [18.433, 42.867]
      - kind: taken
        side: ott
        name: Shumen
        date: "1388"
        text: The fortress was the first of several taken by Ali Pasha north of the Balkan Mountains, and later received an Ottoman garrison.
        lonlat: [26.933, 43.283]
      - kind: siege
        side: ott
        name: Nicopolis
        date: "1388"
        text: Ivan Shishman took refuge in the Danube fortress and was besieged there twice before he submitted.
        lonlat: [24.9, 43.7]
      - kind: event
        side: ott
        name: Silistra
        date: "1388"
        text: The most populous Bulgarian town on the Danube, demanded by the Ottomans as the price of peace.
        lonlat: [27.261, 44.117]
    arrows:
      - side: ott
        label: Ali Pasha
        via: [[26.56, 41.68], [27.0, 42.55], [26.93, 43.25], [24.95, 43.68]]
      - side: ott
        label: Lala Şahin
        via: [[19.26, 42.44], [18.85, 42.7], [18.47, 42.85]]
  - title: Kosovo
    date: June 1389
    when: "1389-06-15"
    borders: "1389-06-15"
    countries: [xk, rs, ba, tr, mk]
    body:
      - In the spring of 1389 Murad gathered his army at Philippopolis and, with his sons Bayezid and Yakub, marched west by way of Ihtiman, Velbazhd and Kratovo, where vassal contingents probably joined him, and on through Kumanovo to Pristina, which he reached on 14 June. Lazar, who had assembled his army near Niš, moved through Prokuplje to meet him. With him came his son-in-law Vuk Branković, lord of Kosovo, and Bosnian troops under Vlatko Vuković sent by Tvrtko; Albanian lords and others may also have fought. Modern estimates give Murad perhaps 27,000–30,000 men and Lazar 15,000–20,000.
      - "On 15 June 1389 the armies met on the Field of Blackbirds north-west of Pristina. Few reliable details survive. The Serbian cavalry broke into the Ottoman left before the Ottomans, with Bayezid on the right, gained the upper hand. Murad was killed, by a Serbian knight whom later tradition calls Miloš Obilić; Lazar was captured and executed, and Bayezid had his brother Yakub strangled to secure the throne. Both armies lost heavily. Tvrtko proclaimed a victory, but Serbia could not raise such an army again: Lazar’s widow Milica, ruling for their son Stefan Lazarević, accepted Ottoman overlordship, and Stefan’s sister Olivera was married to Bayezid."
    facts:
      - [Battle of Kosovo, "15 June 1389"]
      - [Commanders, "Murad I and Bayezid; Prince Lazar, Vuk Branković and Vlatko Vuković"]
      - [Result, "both rulers killed; Serbia becomes an Ottoman vassal"]
    markers:
      - kind: battle
        name: Battle of Kosovo
        date: 15 June 1389
        text: Murad I and Prince Lazar both died, and the armies were badly mauled. The Ottomans held the field, and historians differ on whether to call the battle a victory for them or a draw.
        lonlat: [21.085, 42.718]
      - kind: event
        side: ott
        name: Pristina
        date: 14 June 1389
        text: Murad’s army reached the plain of Kosovo here after a march from Philippopolis through Velbazhd and Kratovo.
        lonlat: [21.167, 42.667]
        lp: b
      - kind: event
        side: ott
        name: Kratovo
        date: spring 1389
        text: Murad halted at the mining town, in the lands of his vassal Konstantin Dejanović, before turning towards Kosovo.
        lonlat: [22.18, 42.08]
      - kind: held
        side: ser
        name: Kruševac
        date: "1389"
        text: Lazar’s capital, from which he ruled the Morava valley. His army gathered near Niš.
        lonlat: [21.331, 43.581]
    arrows:
      - side: ott
        label: Murad I
        via: [[24.75, 42.15], [22.68, 42.28], [21.72, 42.14], [21.17, 42.62]]
      - side: ser
        label: Lazar
        via: [[21.9, 43.32], [21.59, 43.24], [21.25, 42.9], [21.1, 42.74]]
  - title: The fall of Tarnovo
    date: 1392–1394
    when: "1392"
    borders: "1393-07-17"
    countries: [bg, mk, rs, xk, tr]
    body:
      - Bayezid I, called Yıldırım, the Thunderbolt, replaced vassal rule with direct rule wherever he could. Vuk Branković, who had refused to submit after Kosovo, lost Skopje in 1392 and was forced to pay tribute; Ottoman forces took Thessaly in 1393. Ivan Shishman, who was negotiating in secret with King Sigismund of Hungary, was the next target. In the spring of 1393 Bayezid gathered troops from Anatolia and the Balkans and sent his son Süleyman Çelebi to besiege Tarnovo, the Bulgarian capital.
      - Shishman was at Nicopolis, and Patriarch Euthymius led the defence. After three months Tarnovo fell on 17 July 1393. Its churches were turned into mosques, leading citizens were killed and Euthymius was sent into exile; the Bulgarian patriarchate ceased to exist and its sees came under Constantinople. Shishman kept only Nicopolis and a few towns on the Danube. That winter Bayezid summoned his Christian vassals, among them Emperor Manuel II and Stefan Lazarević, to Serres, where by Byzantine accounts he thought of having them killed.
    facts:
      - [Skopje taken, "1392"]
      - [Fall of Tarnovo, "17 July 1393, after a three-month siege"]
      - [Ottoman commander, Süleyman Çelebi]
    markers:
      - kind: siege
        side: ott
        name: Tarnovo
        date: April – 17 July 1393
        text: The capital on the Yantra, with its royal and patriarchal citadels of Tsarevets and Trapezitsa, held out for three months.
        lonlat: [25.65, 43.083]
      - kind: held
        side: bul
        name: Nicopolis
        date: 1393–1395
        text: Ivan Shishman’s last refuge, where he hoped for help from Hungary.
        lonlat: [24.9, 43.7]
      - kind: taken
        side: ott
        name: Skopje
        date: "1392"
        text: Taken from Vuk Branković, who then became a tributary of the sultan.
        lonlat: [21.432, 41.996]
      - kind: event
        side: ott
        name: Serres
        date: winter 1393–1394
        text: Bayezid gathered his Byzantine and Serbian vassals here. Manuel II left in fear and soon afterwards stopped obeying the sultan’s summons.
        lonlat: [23.55, 41.083]
    arrows:
      - side: ott
        label: Süleyman Çelebi
        via: [[26.56, 41.68], [25.65, 42.4], [25.35, 42.75], [25.62, 43.05]]
  - title: Rovine and the end of Vidin
    date: 1395–1396
    when: "1395-05-17"
    borders: "1396-10"
    countries: [ro, bg, rs, mk, tr]
    body:
      - "Mircea the Elder of Wallachia had seized Silistra and Dobruja and raided across the Danube. In 1395 Bayezid crossed into Wallachia with his Serbian vassals, among them Stefan Lazarević, Marko and Konstantin Dejanović. On 17 May 1395 Mircea’s army, its archers to the fore, met the Ottomans at Rovine, a marshy place probably near the Argeș; Marko and Konstantin were killed. The battle’s outcome is disputed: Christian sources speak of a Wallachian victory, Ottoman ones of their own, and many historians of a bloody draw. Bayezid set up a rival prince, Vlad, but Mircea soon regained his throne."
      - On his way back Bayezid took Nicopolis, and Ivan Shishman was put to death, on 3 June 1395 according to a Bulgarian chronicle. The last Bulgarian ruler, Ivan Sratsimir of Vidin, joined King Sigismund’s crusade the next year and opened Vidin to the crusaders. After the Ottoman victory at Nicopolis on 25 September 1396, Bayezid marched on Vidin, took it and sent Sratsimir to prison in Bursa, where he probably died. His son Konstantin claimed the title of tsar in exile until 1422; Bulgaria remained under Ottoman rule until 1878.
    facts:
      - [Battle of Rovine, "17 May 1395 (some historians date it to October 1394); outcome disputed"]
      - [Death of Ivan Shishman, "3 June 1395, by the main account"]
      - [Fall of Vidin, "autumn 1396"]
    markers:
      - kind: battle
        name: Battle of Rovine
        date: 17 May 1395
        text: The site is uncertain; most historians place it near the Argeș river. Both sides suffered heavily, and both claimed the victory.
        lonlat: [25.05, 44.7]
      - kind: taken
        side: ott
        name: Nicopolis
        date: "1395"
        text: Bayezid took the fortress by surprise from the north. Ivan Shishman was executed, or by some accounts died in prison.
        lonlat: [24.9, 43.7]
      - kind: battle
        side: ott
        name: Battle of Nicopolis
        date: 25 September 1396
        text: Bayezid destroyed the crusader army of Sigismund of Hungary and John of Nevers outside the town (see the crusade of Nicopolis).
        lonlat: [24.85, 43.66]
        lp: l
      - kind: taken
        side: ott
        name: Vidin
        date: autumn 1396
        text: Ivan Sratsimir, who had sided with the crusaders, was deposed and taken to Bursa. It was the end of the Bulgarian state.
        lonlat: [22.872, 43.993]
    arrows:
      - side: ott
        label: Bayezid I
        via: [[24.9, 43.72], [24.95, 44.15], [25.03, 44.65]]
      - side: wal
        label: Mircea
        via: [[24.65, 45.15], [24.9, 44.9], [25.04, 44.73]]
