id: war-of-the-eight-saints
name: War of the Eight Saints
start: "1375"
end: "1378-07-28"
tier: C
summary: A war between Florence, allied with Bernabò Visconti of Milan, and Pope Gregory XI, whose legates were extending papal rule in central Italy. In 1375 Florence encouraged revolts across the Papal States, and dozens of towns rose against their papal governors. The pope put Florence under interdict in March 1376, exposing its merchants abroad to arrest and seizure of their goods, and sent an army of Breton mercenaries under Cardinal Robert of Geneva; in February 1377 they massacred thousands of the people of Cesena. The war was run in Florence by a committee of eight, called the Eight Saints, and its cost helped bring on the Ciompi revolt of 1378. After Gregory, who had brought the papacy back from Avignon to Rome in 1377, died in March 1378, Catherine of Siena and others worked for peace, and Florence made peace with Pope Urban VI at Tivoli in July 1378, agreeing to pay a large indemnity.
