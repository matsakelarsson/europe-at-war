id: bulala-wars
name: Bulala wars
start: "1376"
end: "1507"
tier: B
summary: "The wars in which the Bulala, a pastoral people of the Lake Fitri region, drove the Sayfawa kings out of Kanem, north-east of Lake Chad, and forced them to rebuild their kingdom in Bornu, west of the lake. Taking advantage of a succession war among the Sayfawa, the Bulala king Abd al-Jalil killed Mai Dawud about 1376; between then and about 1389 seven kings fell fighting the Bulala or their Arab allies, and Mai Umar b. Idris abandoned the capital Njimi and Kanem altogether. In Bornu the dynasty survived a century of civil war between two branches of the royal family, while the Bulala built a strong kingdom in Kanem. Mai Ali Gaji ended the civil wars, beat a Bulala raid about 1471 and founded a fortified capital at Ngazargamu; his son Idris Katakarmabe defeated the Bulala and entered Njimi in triumph early in his reign, 122 years after his ancestors had been driven out. He did not move the capital back, and the wars went on at intervals until Idris Alooma’s campaigns of the 1570s."
countries: [td, ne, ng]
sides:
  - id: kb
    name: Sayfawa kings of Kanem and Bornu
    polities: [kanem-bornu]
    ink: teal
    moves: Sayfawa moves
    success: Sayfawa success
  - id: bul
    name: Bulala
    polities: [bulala]
    ink: olive
    moves: Bulala moves
    success: Bulala success
notes:
  - "The sources are few: the Diwan, a short chronicle of the Sayfawa kings that gives little more than names, reign lengths and deaths; a letter of Mai Bir b. Idris to the sultan of Egypt of about 1391; a notice by al-Maqrizi; and the imam Ahmad ibn Furtu’s account of Idris Alooma, written in the 1570s, which looks back on the earlier wars. Reign dates follow the reconstruction of Dierk Lange and are approximate. The site of Njimi has never been found with certainty; a site at Tié, in Chad, was proposed in 2019. Leo Africanus knew the Bulala kingdom as “Gaoga” and described it, probably from merchants’ reports, as stronger than Bornu."
