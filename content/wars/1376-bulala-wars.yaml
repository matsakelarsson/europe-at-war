steps:
  - title: Driven out of Kanem
    date: about 1376–1390
    when: "1376"
    borders: "1390"
    countries: [td, ne, ng]
    body:
      - "In the fourteenth century the Sayfawa mais ruled from Njimi in Kanem, north-east of Lake Chad, over lands that reached the Fezzan, and had vassals in Bornu, west of the lake. A succession war between Mai Dawud b. Ibrahim Nikale and the sons of his brother and predecessor Idris weakened the kingdom, and the Bulala, herders of the Lake Fitri region to the south-east who may have been pushed by Arab migrations from the Nile, broke in. Their king Abd al-Jalil killed Dawud about 1376, and each of his next three successors died fighting them. The fourth, Umar b. Idris, gave up Njimi and Kanem and led his followers west into Bornu, where he was killed by Arabs."
      - "Two more kings, Sa’id and Kaday Afnu, fell in battle against the Bulala before Mai Bir (Uthman) b. Idris, who reigned about 1389–1421, held them off and apparently carried the war into their country. In a letter to the sultan of Egypt he complained of Arab tribes raiding his people and selling them as slaves. The Sayfawa built a new kingdom in Bornu with its capital at Kaka, while the Bulala ruled Kanem, with Tubu and Arab allies; al-Maqrizi, in Cairo, heard that the people of Kanem had rebelled and abandoned Islam, though the Bornu chronicles do not say so."
    facts:
      - [Mai Dawud killed, "about 1376"]
      - [Kings fallen in the war, "seven, about 1376–1389"]
      - [Njimi abandoned, "under Umar b. Idris, about 1382–1387"]
