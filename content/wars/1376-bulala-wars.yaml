  - title: Ngazargamu and the return to Njimi
    date: about 1465–1507
    when: "1471"
    borders: "1500"
    countries: [td, ng, ne]
    body:
      - "For most of the fifteenth century the descendants of Dawud and of Idris fought each other for the throne of Bornu, and several kings were deposed or killed. Mai Ali b. Dunama, known as Ali Gaji (about 1465–1497), ended the strife by defeating the rival branch. When the Bulala raided Bornu again about 1471 he beat them, without following up his victory, and about 1472 he built a walled capital, Birni Ngazargamu, by the Komadugu Yobe. It remained the Sayfawa capital until 1808."
      - "The Bulala attacked again after Ali Gaji’s death, and his son Idris Katakarmabe (about 1497–1519) defeated them early in his reign and entered Njimi in triumph, 122 years after the Sayfawa had been driven out, according to Ahmad ibn Furtu. He made an agreement with the Bulala and went back to Bornu; Njimi was never again the capital. The truce did not last, and fighting went on at intervals for another sixty years."
    facts:
      - [Bulala raid beaten, "about 1471"]
      - [Birni Ngazargamu founded, "about 1472"]
      - [Idris Katakarmabe enters Njimi, "early 16th century"]
