id: muscovite-horde-war
name: Moscow against the Horde, 1378–1382
start: "1378"
end: "1382"
tier: B
summary: The war between Grand Prince Dmitry of Moscow and the Golden Horde during its civil war. Dmitry beat Mamai’s armies on the Vozha in 1378 and at Kulikovo in 1380, but in 1382 Khan Tokhtamysh, who had reunited the Horde, burned Moscow and forced Dmitry to pay tribute again.
countries: [ru, ua]
sides:
  - id: mos
    name: Moscow and its allies
    polities: [russia]
    ink: green
    moves: Muscovite moves
    success: Muscovite success
  - id: hd
    name: Golden Horde
    polities: [golden-horde]
    ink: olive
    moves: Horde moves
    success: Horde success
notes:
  - Dates are Julian (Old Style), as in the Russian chronicles. Most of the detail about Kulikovo comes from tales written decades or centuries later, and their numbers are not reliable; one recent historian has even questioned whether the battle on the Vozha took place as described.
  - Mamai was not a descendant of Genghis Khan and ruled the western Horde through puppet khans. Tokhtamysh, a Genghisid backed by Timur, took over the eastern Horde in the late 1370s and reunited it after Kulikovo.
  - Moscow’s rulers held the title of grand prince of Vladimir, granted by the khans, and led the princes of north-eastern Rus’ who joined them.
