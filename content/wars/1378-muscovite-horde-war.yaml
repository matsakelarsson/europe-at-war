steps:
  - title: The Vozha
    date: 1374–1378
    when: "1378-08-11"
    borders: "1378-08-11"
    countries: [ru]
    body:
      - "After 1359 the Golden Horde fell into two decades of civil war, the “Great Troubles”, in which more than twenty khans came and went. In the west the beylerbey Mamai ruled through puppet khans. Dmitry Ivanovich of Moscow, who had kept the khan’s patent for the grand principality of Vladimir against the princes of Tver, broke with Mamai in 1374 and later stopped paying tribute. In 1376 a Muscovite army forced the town of Bulgar on the middle Volga to pay tribute, and in 1377 Mamai’s Tatars surprised and destroyed a Russian army on the Pyana river, then plundered Nizhny Novgorod."
      - "In 1378 Mamai sent an army under Murza Begich to bring Moscow to heel. Dmitry met it in the Ryazan lands on the Vozha, a tributary of the Oka, and held the ford. On 11 August, after a long wait, Begich crossed the river. His cavalry was beaten back by the Russian centre under Dmitry and the wings under Timofey Velyaminov and Andrei of Polotsk, and a counter-attack drove the Tatars into the river, where many drowned. Begich was killed. It was Moscow’s first victory over a large Horde army. That autumn Mamai took his revenge on Ryazan and burned its capital."
    facts:
      - [Battle of the Vozha, "11 August 1378, Muscovite victory"]
      - [Horde commander, "Murza Begich, killed"]
      - [Grand Prince, "Dmitry Ivanovich of Moscow (1350–1389)"]
