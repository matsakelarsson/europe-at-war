  - title: Kulikovo
    date: August – September 1380
    when: "1380-09-08"
    borders: "1380-09-08"
    countries: [ru, ua]
    body:
      - "In 1380 Mamai, threatened in the east by Tokhtamysh, led a large army north himself. He allied with Grand Duke Jogaila of Lithuania, and Prince Oleg of Ryazan, caught between the two sides, nominally joined him. Dmitry gathered troops from most of north-eastern Rus’ at Kolomna and refused the higher tribute Mamai’s envoys demanded. He marched west along the Oka, crossed it at Lopasnya in late August and headed south to fight before Mamai and Jogaila could join forces. On the morning of 8 September his army crossed the Don to Kulikovo Field, the “snipe field”, near the mouth of the Nepryadva."
      - "Later tales begin the battle with a duel in which the monk Peresvet and a Tatar champion killed each other. The armies then fought a long, bloody mêlée until an ambush regiment under Prince Vladimir Andreyevich and Dmitry Bobrok fell on the Tatars’ flank and routed them. Dmitry was found wounded among the dead. Chroniclers wrote of hundreds of thousands of men; modern estimates range from a few thousand to several tens of thousands. Jogaila turned back, and Mamai, beaten soon afterwards by Tokhtamysh, was killed at Caffa in the Crimea. Dmitry became known as Donskoy, “of the Don”."
    facts:
      - [Battle of Kulikovo, "8 September 1380, Muscovite victory"]
      - [Commanders, "Dmitry of Moscow against Mamai"]
      - [Allies who did not arrive, "Jogaila of Lithuania and Oleg of Ryazan, for Mamai"]
    markers:
