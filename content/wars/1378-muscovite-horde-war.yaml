  - title: Tokhtamysh burns Moscow
    date: August 1382
    when: "1382-08-26"
    borders: "1382-08-26"
    countries: [ru]
    body:
      - "Tokhtamysh, now khan of a reunited Horde, demanded that Moscow submit. In the summer of 1382 he moved north so fast that Dmitry could not gather an army, and the princes of Nizhny Novgorod and Ryazan, hoping to save their own lands, helped him; Oleg of Ryazan is said to have shown him the fords of the Oka. Dmitry left for Kostroma to raise troops, and the metropolitan also left the city. After riots, the townspeople chose a Lithuanian prince, Ostey, a grandson of Algirdas, to lead the defence of the Kremlin, which Dmitry had rebuilt in stone in 1367."
      - "The Tatars arrived on 23 August and failed to storm the walls. On 26 August the princes of Nizhny Novgorod who rode with the khan swore that the city would be spared if it opened its gates. Ostey went out to negotiate and was killed, and the Tatars broke in, massacred the people and burned the city; a figure of 24,000 dead is often cited. Detachments sacked Pereslavl, Kolomna and other towns, though Vladimir Andreyevich beat one near Volok Lamsky. Dmitry kept his title but paid tribute again, and in 1383 sent his son Vasily to the Horde as a hostage."
    facts:
      - [Moscow taken, "26 August 1382"]
      - [Defender, "Prince Ostey of Lithuania, killed"]
      - [Outcome, "Tribute to the Horde resumed"]
