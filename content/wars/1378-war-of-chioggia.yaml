      - kind: naval
        side: ven
        name: Battle of Anzio
        date: 30 May 1378
        text: Pisani’s ten galleys beat eleven Genoese galleys off the coast south of Rome and captured their commander, Luigi Fieschi.
        lonlat: [12.63, 41.45]
      - kind: naval
