        name: Battle of Pola
        date: 7 May 1379
        text: Pisani, ordered out against his judgement, lost all but six of his galleys. Luciano Doria was killed early in the fighting.
        lonlat: [13.85, 44.87]
      - kind: taken
        side: gen
        name: Chioggia
        date: 16 August 1379
        text: The Genoese and Paduans stormed the town after occupying Brondolo, capturing its garrison of some 3,000.
        lonlat: [12.28, 45.22]
    arrows:
