        text: Carlo Zeno’s fleet anchored off the southern entrance to the lagoon, closing the trap on the Genoese.
        lonlat: [12.29, 45.18]
        lp: b
      - kind: taken
        side: ven
        name: Chioggia
        date: 24 June 1380
        text: The Genoese garrison, out of food, surrendered with its remaining galleys.
