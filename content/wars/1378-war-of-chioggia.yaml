id: war-of-chioggia
name: War of Chioggia
start: "1378"
end: "1381-08-08"
tier: B
summary: The fourth war between Venice and Genoa, fought over the island of Tenedos at the mouth of the Dardanelles. Allied with Hungary and Padua, the Genoese destroyed the Venetian fleet off Pola and took Chioggia in the Venetian lagoon in 1379, but Venice blockaded them there and forced their surrender in June 1380; the Peace of Turin in 1381 gave neither side much, but Genoa never again threatened Venice at home.
countries: [it, hr, tr]
sides:
  - id: ven
    name: Venice and its allies
    polities: [venice, milan]
    ink: red
    moves: Venetian moves
    success: Venetian success
  - id: gen
    name: Genoa and its allies
    polities: [genoa, hungary, padua, aquileia]
    ink: green
    moves: Genoese and allied moves
    success: Genoese and allied success
notes:
  - Venice’s only ally of note was Bernabò Visconti of Milan, who attacked Genoa by land but gave little direct help. Genoa’s allies were Louis I of Hungary, Francesco da Carrara of Padua and the Patriarch of Aquileia.
  - Guns were used on both sides, in the siege of Chioggia and on board ship, one of the first times in Italian warfare. Numbers of ships and men differ between sources.
