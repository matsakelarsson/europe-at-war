steps:
  - title: Pola and the fall of Chioggia
    date: 1376–1379
    when: "1378"
    borders: "1379-08-16"
    countries: [it, hr, tr]
    body:
      - Venice and Genoa, the great trading rivals of the eastern Mediterranean, had fought three wars since the 1250s. A fourth broke out over Tenedos, an island that guarded the entrance to the Dardanelles and the route to the Black Sea. In 1376 the Byzantine emperor John V Palaiologos granted it to Venice, and Genoa, backing his rebellious son Andronikos IV, tried to take it. Genoa gathered a strong coalition, with Louis I of Hungary, who had taken Dalmatia from Venice in 1358, Francesco da Carrara, lord of Padua, and the Patriarch of Aquileia.
      - On 30 May 1378 the Venetian admiral Vettor Pisani beat a Genoese squadron off Anzio, but on 7 May 1379, off Pola in Istria, the Genoese under Luciano Doria destroyed his fleet. Doria was killed in the battle, and Pisani was imprisoned for his defeat. A new Genoese fleet under Pietro Doria entered the Adriatic and, with Paduan troops attacking from the mainland, broke into the lagoon and took Chioggia, at its southern end, on 16 August 1379. Venice was cut off by sea and land, and Doria rejected its offer of terms; he is said to have sworn to bridle the bronze horses of St Mark’s.
    facts:
      - [Battle of Anzio, "30 May 1378, Venetian victory"]
      - [Battle of Pola, "7 May 1379, Genoese victory"]
      - [Fall of Chioggia, 16 August 1379]
