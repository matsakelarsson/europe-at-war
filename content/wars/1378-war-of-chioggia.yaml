  - title: The besiegers besieged
    date: 1379–1381
    when: "1379-12-22"
    borders: "1381-08-08"
    countries: [it, hr, tr]
    body:
      - Venice released Pisani to popular acclaim and armed every vessel it could. On the night of 22 December 1379 Pisani and Doge Andrea Contarini sank barges loaded with stones in the channels around Chioggia, trapping the Genoese fleet inside the lagoon. On 1 January 1380 Carlo Zeno came back with his galleys from raiding Genoese shipping in the eastern Mediterranean, and the besiegers were themselves besieged. Pietro Doria was killed by a Venetian cannon ball, and a Genoese relief fleet failed to break through in May.
      - On 24 June 1380 the starving Genoese in Chioggia surrendered, some 4,000 of them by most accounts. The war went on at sea and on the mainland, and in 1381 Venice handed Treviso to Duke Leopold III of Austria rather than let it fall to Padua. Exhausted, both sides accepted the mediation of Count Amadeus VI of Savoy. In the Peace of Turin of 8 August 1381 Tenedos was handed over to Savoy, its fortifications were razed and its people moved away, and Venice agreed to pay Hungary a yearly tribute and accepted the loss of Dalmatia. Genoa never again threatened Venice in its lagoon.
    facts:
      - [Blockade of the channels, 22 December 1379]
      - [Genoese surrender at Chioggia, 24 June 1380]
      - [Peace of Turin, 8 August 1381]
    markers:
