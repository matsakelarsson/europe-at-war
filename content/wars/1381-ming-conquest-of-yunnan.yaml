id: ming-conquest-of-yunnan
name: Ming conquest of Yunnan
start: "1381-09"
end: "1383-02"
tier: B
summary: "The campaign that brought Yunnan, the last province held for the Yuan inside China, under the Ming dynasty. Basalawarmi, the Yuan Prince of Liang, governed Yunnan from Kunming and stayed loyal to the Yuan court in Mongolia, refusing the Hongwu Emperor’s embassies and killing his envoy Wang Wei in 1374. In September 1381 the emperor sent Fu Youde with Lan Yu and Mu Ying and an army of about 250,000–300,000 men through Guizhou. Mu Ying defeated the Yuan army of more than 100,000 at the Baishi River near Qujing, and Basalawarmi killed himself on 6 January 1382 as Kunming surrendered. In April Lan Yu and Mu Ying stormed the passes of Dali and captured Duan Shi, the last of the hereditary Duan governors; the final stronghold fell in February 1383. Mu Ying stayed in Yunnan with a large military colony, and his descendants commanded the province until the end of the dynasty."
