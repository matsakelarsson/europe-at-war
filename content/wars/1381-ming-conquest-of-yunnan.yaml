steps:
  - title: Qujing and Kunming
    date: September 1381 – January 1382
    when: "1381-12"
    borders: "1381-12-31"
    countries: [cn]
    body:
      - "On 18 September 1381 the Hongwu Emperor named Fu Youde General for Subduing the South, with Lan Yu and Mu Ying as his deputies, and ordered them to take Yunnan. The main army marched up the Yuan River through western Hunan into Guizhou, where it took Puding and Pu’an, while a second column came south from Sichuan towards Wusa. The Prince of Liang, Basalawarmi, sent his general Dalima with more than 100,000 men to hold the road at Qujing, the gateway to the Yunnan plateau."
      - "Mu Ying reached the Baishi River at Qujing under cover of fog. When it lifted, he kept his main army on the bank as if to cross there, while a detachment crossed downstream and appeared behind the Yuan lines. As the Yuan army turned, the Ming crossed in force and broke it with cavalry. Dalima was captured. The Ming histories say the dead covered more than ten li."
      - "Basalawarmi fled from Kunming. On 6 January 1382 he drowned his wife, ordered his ministers to kill themselves and took his own life; his family was later exiled to Jeju Island in Korea. The Yuan officials surrendered Kunming, and the prefectures around it submitted. Fu Youde turned north-east to fight the Yi chiefs of Wusa and Wumeng, who resisted the Ming for several more years."
    facts:
      - [Ming army, "about 250,000–300,000"]
      - [Battle of the Baishi River (Qujing), "late December 1381"]
      - [Death of Basalawarmi, "6 January 1382"]
