notes:
  - "Dates are converted from the Chinese lunar calendar. Army sizes are those of the Ming records and are certainly rounded; the Hongwu Emperor is quoted as saying the campaign cost him about 50,000 men from battle, desertion and disease."
  - "Both armies had large numbers of Muslim (Hui) soldiers, descendants of the Central Asians settled in Yunnan under the Yuan; Mu Ying and Lan Yu led Muslim troops on the Ming side."
