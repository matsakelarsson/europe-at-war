  - title: The passes of Dali
    date: April 1382 – February 1383
    when: "1382-04-07"
    borders: "1382-04-07"
    countries: [cn]
    body:
      - "West of Kunming, the old kingdom of Dali was still governed by the Duan family, who had ruled it as kings before the Mongol conquest of 1253 and as hereditary governors under the Yuan. Duan Shi, the thirteenth governor, offered to send tribute but refused to accept Ming officials. Lan Yu and Mu Ying marched on Dali in the spring of 1382. Duan Shi held the Lower Pass at the southern end of the narrow plain between Lake Erhai and the Cang mountains."
      - "A Ming detachment climbed the Cang mountains by night and raised its banners above the pass, and Mu Ying led an attack across the river, so that the defenders were caught from front and rear. The pass fell, Dali was taken on 7 April 1382, and Duan Shi was captured. The last Duan stronghold, Dengchuan, fell in February 1383, and the family was taken to Nanjing."
      - "Risings broke out across Yunnan and Guizhou as soon as the main armies moved on, and Fu Youde and Lan Yu did not return until 1384. Mu Ying stayed behind with a large garrison whose soldiers were settled with hereditary status as military colonists; many married local women, and their descendants, the Tunbao people, still live in Guizhou. The Mu family held the chief command in Yunnan until the end of the dynasty. Among the captives taken in Yunnan were boys who were castrated and sent to serve at court, one of them the Muslim boy Ma He, later the admiral Zheng He."
    facts:
