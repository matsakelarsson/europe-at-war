id: peasants-revolt
name: Peasants’ Revolt
start: "1381-05-30"
end: "1381-07-15"
tier: C
summary: A rising in England in the summer of 1381, set off by the third poll tax in four years, raised to pay for the war with France. Rebels from Essex and Kent, led by Wat Tyler and inspired by the preacher John Ball, entered London on 13 June, burned John of Gaunt’s Savoy Palace and killed the Archbishop of Canterbury and the Treasurer. The fourteen-year-old Richard II met the rebels at Mile End and at Smithfield, where Tyler was killed on 15 June. The king’s promises to end serfdom were revoked, and the revolt, which had spread to East Anglia and beyond, was put down.
