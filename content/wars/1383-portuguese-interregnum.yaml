  - title: Coimbra and Aljubarrota
    date: 1385
    when: "1385-04-06"
    borders: "1385-10-15"
    countries: [pt, es, gb]
    body:
      - At Coimbra, on 6 April 1385, the Cortes heard the lawyer João das Regras argue that neither Beatrice nor the sons of Ferdinand’s father by Inês de Castro had a valid claim, and proclaimed the Master of Aviz king as John I. In May a Castilian raiding force was beaten at Trancoso, and in June John I of Castile invaded with a large army, including French knights, and marched by Coimbra and Leiria towards Lisbon. On 14 August John of Aviz and Nuno Álvares, now his constable, barred its road at Aljubarrota, south of Leiria, with a few thousand Portuguese and some hundreds of English and Gascon soldiers, among them longbowmen.
      - The Portuguese and English fought on foot behind ditches and pits on a narrow front. The French vanguard charged and was cut down, and prisoners taken from it were killed for fear of an attack from behind. When the main Castilian army came up late in the day it broke within about an hour, and many Castilian nobles were among the dead. John of Castile fled to Santarém and by sea to Seville. That October Nuno Álvares carried the war into Castile and won at Valverde. John I founded the monastery of Batalha near the battlefield, and in 1386 he made an alliance with England at Windsor.
    facts:
      - [Cortes of Coimbra, "6 April 1385, John I proclaimed king"]
      - [Battle of Aljubarrota, "14 August 1385, Portuguese victory"]
      - [Treaty of Windsor, "9 May 1386"]
    markers:
