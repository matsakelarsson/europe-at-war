id: portuguese-interregnum
name: Portuguese Interregnum
start: "1383-10-22"
end: "1385-10-15"
tier: B
summary: The succession war, also called the 1383–1385 Crisis, that followed the death of Ferdinand I of Portugal, whose only child, Beatrice, was married to John I of Castile. Fearing union with Castile, Lisbon and much of the country rallied to John, Master of the Order of Aviz, Ferdinand’s illegitimate half-brother. The Castilians failed to take Lisbon in 1384, the Cortes of Coimbra proclaimed the Master king as John I in 1385, and on 14 August 1385 he and his constable Nuno Álvares Pereira, with English help, routed the Castilian army at Aljubarrota, securing Portugal’s independence and the new house of Aviz. Border fighting went on until truces in 1389–1393 and a final peace in 1411.
countries: [pt, es, gb]
sides:
  - id: avz
    name: John of Aviz and his supporters
    polities: [portugal]
    ink: green
    moves: Moves by John of Aviz’s side
    success: Success for John of Aviz
  - id: cas
    name: Castile and Beatrice’s supporters
    polities: [castile]
    ink: gold
    moves: Castilian moves
    success: Castilian success
notes:
  - The main account is the chronicle of Fernão Lopes, written for the house of Aviz some fifty years later. Many Portuguese nobles and towns took Beatrice’s side, so this was a civil war as well as a war with Castile.
  - The chronicles say John I of Castile invaded in 1385 with 31,000 men; modern estimates are lower, but his army was much larger than the Portuguese one.
  - Dates are Julian.
