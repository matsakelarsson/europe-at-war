steps:
  - title: The Master of Aviz and the siege of Lisbon
    date: 1383–1384
    when: "1383-10-22"
    borders: "1384-09-03"
    countries: [pt, es]
    body:
      - Ferdinand I of Portugal died on 22 October 1383, leaving one child, Beatrice, who that May had married John I of Castile. By the marriage treaty her mother, Queen Leonor Teles, became regent until Beatrice had a son old enough to reign. Many Portuguese, above all in Lisbon and Porto, feared that Portugal would be swallowed by Castile, and the queen and her favourite, the Galician-born Count João Fernandes Andeiro, were widely hated. On 6 December John, Master of the Order of Aviz, Ferdinand’s illegitimate half-brother, killed Andeiro in the palace, and Lisbon made him Defender of the Realm.
      - Leonor called on her son-in-law, and John I of Castile entered Portugal and took over the regency; much of the nobility and many towns sided with him. On 6 April 1384 the Master’s young commander, Nuno Álvares Pereira, beat a Castilian force at Atoleiros, his men fighting on foot as the English did. From May the Castilians besieged Lisbon by land and from the Tagus. A Portuguese fleet from Porto fought its way through with food in July, and hunger in the Castilian camp was followed by plague. On 3 September John of Castile lifted the siege and went home.
    facts:
      - [Death of Ferdinand I, "22 October 1383"]
      - [Battle of Atoleiros, "6 April 1384, Portuguese victory"]
      - [Siege of Lisbon, "May – 3 September 1384"]
