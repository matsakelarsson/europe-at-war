  - title: Arakan and the Sittaung front
    date: 1404–1408
    when: "1408"
    borders: "1408-08-01"
    countries: [mm]
    body:
      - During the truce Ava expanded. Between 1404 and 1406 it brought the Shan states of Onbaung (Hsipaw), Nyaungshwe, Bhamo and Mohnyin under its rule, which drew a protest from the Ming court in 1406, and in November 1406 Minkhaung’s son Minye Kyawswa crossed the mountains and took Launggyet, the capital of Arakan. Its king fled, and Ava placed its own nominee, Anawrahta, on the throne. Razadarit, fearing that Pegu would be next, gave refuge to Arakanese and Avan exiles, and in early March 1408 his forces took Sandoway and Launggyet and put Ava’s nominee king to death.
      - In April 1408 Minkhaung invaded down the Sittaung valley with a large army, about 22,000 men in its vanguard alone by the chronicles’ count. Razadarit fell back to Pankyaw, burned the towns along the Avan line of march and attacked its supply lines. By July Minkhaung was seeking terms, and when he withdrew in the rains in August, Razadarit’s army fell on his retreating columns, destroyed much of the rearguard and captured his queen, Shin Mi-nauk, the mother of Minye Kyawswa.
    facts:
      - [Ava takes Launggyet, "November 1406"]
      - [Hanthawaddy takes Launggyet, "March 1408"]
      - [Minkhaung’s invasion, "April–August 1408"]
