  - title: Martaban, the delta and the truce of 1391
    date: 1387–1391
    when: "1390"
    borders: "1390-04-01"
    countries: [mm]
    body:
      - While Swa was drawn north by raids of the Shan state of Maw (Möng Mao) on Ava’s vassal Kale, Razadarit turned on his rebel governors. He took Donwun by a ruse, and in 1388 or early 1389 Martaban and Moulmein surrendered to his army. In late 1389 he moved against Laukpya, who had fortified Myaungmya and Bassein. He seized Dala, whose governor had secretly gone over to Laukpya, and attacked Bassein, defended by about 1,000 men and more than fifty war boats, some crewed by foreign mercenaries with guns.
      - Frontal assaults failed, so Razadarit planted stakes across the river and sent his general Lagun Ein to lure Bassein’s war boats into the trap, where most of their crews were captured. His minister Dein took the fort of Daybathwe by pretending to defect, and at Myaungmya Razadarit wounded and captured its commander in single combat. Laukpya was caught as he fled and was spared. By the end of March 1390 Hanthawaddy held the whole delta, and Razadarit occupied the Avan border towns of Gu-Htut and Ahlwe.
      - Ava, at peace with Maw after Min Swe married the Maw princess Shin Mi-nauk, struck back in the dry season of 1390–1391. Its river fleet, about 17,000 men by the chronicles’ count, attacked Gu-Htut again and again, and a Hanthawaddy squadron under Maha Thamun came close enough to Swa’s royal barge to strip gold ornaments from it. Tarabya’s army failed before Pankyaw. Early in 1391 the two kings agreed to peace; Ava recognised Hanthawaddy, and Razadarit gave back Gu-Htut and Ahlwe.
    facts:
      - [Martaban surrenders, "1388 or early 1389"]
      - [Delta conquered, "by the end of March 1390"]
      - [Truce, "early 1391, kept until 1401"]
