  - title: Minye Kyawswa falls at Dala
    date: October 1414 – March 1415
    when: "1415"
    borders: "1415-03-14"
    countries: [mm]
    body:
      - In early October 1414 Minye Kyawswa invaded the delta again with an army of about 8,000 men and a river fleet of about 13,000. He stormed the fort of Khebaung, leading the last assault himself, and took Panko, where the Hanthawaddy flotilla commander Smin Bayan was captured and went over to Ava. Razadarit withdrew to Martaban, and in about December Bassein and Myaungmya surrendered. In January 1415 a force backed by the Chinese attacked Ava’s northern frontier and was beaten off.
      - Razadarit returned to Pegu early in 1415 and launched a counterattack on 2 March. On 13 March 1415, when the Hanthawaddy army came out of Dala, Minye Kyawswa attacked it against his officers’ advice. He broke three regiments of the vanguard but was mortally wounded fighting the regiment of General Awa Naing, and died in Hanthawaddy hands at the age of 24. Razadarit gave him a royal funeral.
      - The Avan armies left the delta, and its towns went back to Hanthawaddy. Minkhaung, grieving, came south, had his son’s remains dug up and cast into the waters near Twante, and marched on Bassein, but found it strongly held and withdrew after three days.
    facts:
      - [Fifth Avan invasion, "from early October 1414"]
      - [Battle of Dala, "13 March 1415, Hanthawaddy’s victory"]
      - [Minye Kyawswa, "died of his wounds, aged 24"]
