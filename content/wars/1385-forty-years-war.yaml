steps:
  - title: Razadarit and the first Ava invasions
    date: December 1385 – May 1387
    when: "1386"
    borders: "1386-03-01"
    countries: [mm]
    body:
      - Two kingdoms had risen from the ruins of Pagan. In Upper Burma, Ava, founded in 1365, claimed Pagan’s inheritance; in Lower Burma the Mon-speaking kingdom later called Hanthawaddy had moved its capital from Martaban to Pegu in 1369. In 1383 the young prince Binnya Nwe rebelled against his ailing father, King Binnya U, and in January 1384, at sixteen, he took the throne as Razadarit. Three of his governors refused to recognise him, among them Laukpya, the viceroy of Myaungmya in the delta, who offered King Swa Saw Ke of Ava to hold Pegu as his vassal. Swa accepted.
      - In December 1385 two Ava armies of about 7,000 and 6,000 men, under the crown prince Tarabya and Prince Min Swe, marched south while Laukpya’s war boats came up from the delta. Min Swe took Hlaing after weeks of fighting, and Tarabya stormed Fort Pankyaw on the Sittaung, north-east of Pegu. Razadarit doubled back, retook Pankyaw behind the Avan army, broke through its cavalry and got back to Pegu. With the rains coming, Ava withdrew in May 1386.
      - Razadarit sent an embassy asking for peace, calling Swa his “royal paternal elder uncle”, but Swa returned in the dry season of 1386–1387 with about 29,000 men, an army under Tarabya and a river fleet under the king himself. Hlaing held out against three assaults and the river forces failed before Dagon and Dala. In about April 1387 Razadarit lured the Avan garrison of Hmawbi out of its fort with a small decoy force, ambushed it and burned the fort, and in May Ava withdrew again.
    facts:
      - [Razadarit’s accession, "January 1384, aged 16"]
      - [First Ava invasion, "December 1385 – May 1386"]
      - [Second Ava invasion, "late 1386 – May 1387, about 29,000 men"]
