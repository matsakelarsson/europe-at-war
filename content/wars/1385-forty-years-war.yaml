id: forty-years-war
name: Forty Years’ War
start: "1385-12"
end: "1423"
tier: A
summary: "The intermittent war between Ava, the Burmese kingdom of Upper Burma, and Hanthawaddy, the Mon-speaking kingdom of Lower Burma with its capital at Pegu, fought between 1385 and 1423 in four rounds separated by truces. Ava’s kings, who saw themselves as heirs of Pagan, tried to bring the south under their rule; Hanthawaddy’s king Razadarit, who came to the throne in 1384 at sixteen, defended its independence and carried the war up the Irrawaddy. Ava was first invited in by a rebel viceroy in the delta, which Razadarit then conquered (1385–1391). He took his fleet up the Irrawaddy as far as Ava in 1401–1403; the two kingdoms then fought over Arakan, which changed hands several times, while the Ming court and the Shan state of Hsenwi opened a northern front against Ava. Ava’s crown prince Minye Kyawswa overran the delta in 1414–1415 but was killed at Dala in March 1415, and after his death the war lost its force. Both kings died in 1421, and a last campaign ended in 1423 with a marriage of state. Neither side gained lasting territory: Hanthawaddy kept its independence, and Ava’s attempt to restore the realm of Pagan failed."
countries: [mm, cn]
