  - title: The end of the war
    date: 1416–1423
    when: "1418"
    borders: "1418-06-01"
    countries: [mm]
    body:
      - In about April 1416 Razadarit sent about 7,000 men up the Sittaung towards Toungoo, but Minkhaung’s younger son Thihathu drove them back, and was made crown prince in his dead brother’s place. In late 1417 Thihathu invaded the delta with a fleet while the general Nawrahta led an army from Tharrawaddy. They broke into Dagon and captured its commander Binnya Set, took Hmawbi in about May 1418 and besieged Dala and Syriam through the rains, then withdrew. Minkhaung declared that Binnya Set’s capture had paid for his son’s death and that the two kingdoms were even. There was no treaty, but the peace held.
      - Minkhaung died in late 1421 and Razadarit, after an accident, about two months later. Razadarit’s sons Binnya Dhammaraza, Binnya Ran and Binnya Kyan fought over his throne, and Thihathu, now king of Ava, sent troops in 1422 and invaded the delta at the end of the year. In early 1423 Binnya Ran made peace at Dagon by giving Thihathu his sister Shin Sawbu in marriage, and the Avan army went home. Years later Shin Sawbu escaped from Ava and reigned as queen of Hanthawaddy from 1454 to 1471.
      - Forty years of war had changed almost no borders. Hanthawaddy kept its independence and the delta, Arakan had been a tributary of Pegu from 1412 to 1421, and Ava kept its nearer Shan states but was worn out. Neither kingdom could unite the Irrawaddy valley; that was done in the next century by Toungoo.
    facts:
      - [Thihathu’s delta invasion, "late 1417 – 1418"]
      - [Deaths of Minkhaung and Razadarit, "late 1421 – early 1422"]
      - [Treaty of Dagon, "early 1423, Shin Sawbu married to Thihathu"]
    markers:
      - kind: battle
        side: av
