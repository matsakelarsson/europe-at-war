  - title: Razadarit’s fleet before Ava
    date: November 1401 – 1403
    when: "1402"
    borders: "1402-03-01"
    countries: [mm]
    body:
      - Swa Saw Ke died in April 1400. His son Tarabya was murdered five months later, and in November 1400 Min Swe came to the throne as Minkhaung I, facing revolts among his vassals. Razadarit saw his chance. In about mid-November 1401 his army and a great fleet invaded, overran Tharrawaddy and Gu-Htut and reached Prome, whose governor drove off the first assault with guns on the walls. Leaving an army to besiege Prome, Razadarit took the fleet up the Irrawaddy past Pagan and camped north of Ava, facing Sagaing. Ava’s army stayed behind its walls.
      - In February 1402 a monk sent by Minkhaung, Shin Zawtayanta, preached to Razadarit on the evils of war, and Razadarit used the sermon to withdraw with honour. On the way down Ava’s forces defeated his siege army near Prome and captured his daughter, Princess Tala Mi Kyaw, whom Minkhaung made his queen. In September 1402 Razadarit came back and besieged Prome by land and river. On 26 December 1402 Minkhaung, with about 12,000 men, surprised the Hanthawaddy garrison at Nawin outside the city and broke into Prome, but Razadarit’s war boats raided upriver and burned Ava’s rice stores at Thayet, Myede, Malun and Magwe.
      - Short of supplies, both sides opened talks in January 1403. At the Myathitin pagoda in Prome the two kings agreed to restore the old border and exchange prisoners, and a later treaty sealed the peace with a marriage of state, and Hanthawaddy was to pay Ava each year the customs revenue of the port of Bassein and thirty war elephants.
    facts:
      - [Hanthawaddy invasion, "from about 15 November 1401"]
      - [Battle of Nawin, "26 December 1402, Ava’s victory"]
      - [Treaty of Prome, "early 1403"]
