notes:
  - The war is known from Burmese chronicles (the Maha Yazawin and the Hmannan Yazawin) and from the Mon chronicle of Razadarit (the Razadarit Ayedawbon), written down from the sixteenth century onwards; they often disagree by a year or more, and the Ming records add the northern front. The dates here are those of modern historians’ reconstructions, mainly Jon Fernquest’s; the last campaign is dated 1422–1423 in some chronicles and 1423–1424 in others.
  - The chronicles’ army sizes, given here where they help, are likely inflated; G. E. Harvey thought by about ten times.
  - "Places are given by their names of the time with today’s in brackets where it helps: Pankyaw is Waw, Gu-Htut is Myanaung, Dagon is Yangon, Theinni is Hsenwi."
