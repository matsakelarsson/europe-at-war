  - title: Hsenwi and the Ming
    date: 1409–1413
    when: "1412"
    borders: "1412-10-01"
    countries: [mm, cn]
    body:
      - Ava now had to fight on three fronts. In the north the Shan state of Hsenwi (Theinni), which Ava had raided, complained to the Ming court, which in 1409 approved a punitive expedition and later urged Hsenwi to attack Ava. In the south Ava invaded Hanthawaddy again in October 1409 and in 1410–1411, when Minye Kyawswa besieged Myaungmya and Bassein in vain; in the west Launggyet and Sandoway changed hands twice in 1411, ending under Hanthawaddy’s control.
      - In about April 1412 Hsenwi attacked Ava’s vassal Hsipaw. Ava defeated its army at Wetwin, killing the ruler of Hsenwi, and from late May Minye Kyawswa besieged Hsenwi through the rains. In about October 1412 he ambushed a Chinese army sent to relieve the town, 20,000 strong by the Burmese count, in the Sinkhan forest, and drove it back.
      - In November 1412 Razadarit marched on Prome and built a stockade at Talezi, but a Siamese army from Ayutthaya invaded his southern districts and he had to divide his forces. He beat the Siamese in March 1413, but at Talezi his general Lagun Ein was mortally wounded and the Hanthawaddy army withdrew. In April and May 1413 Avan forces took Dala, Dagon and Syriam, but Minye Kyawswa was soon recalled north, where Hsenwi’s raids went on.
    facts:
      - [Ming approves a campaign against Ava, "1409"]
      - [Battle of Wetwin, "about April 1412, Ava’s victory"]
      - [Chinese relief army ambushed, "about October 1412"]
