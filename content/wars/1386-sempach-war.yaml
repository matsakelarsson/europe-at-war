notes:
  - Dates are Julian, as usual for the period. Few accounts of the battles were written before about 1470, and many details, including the story of Arnold von Winkelried, come from Swiss chronicles of around 1500.
  - The Confederacy then had eight members, Uri, Schwyz, Unterwalden, Lucerne, Zurich, Glarus, Zug and Bern. Bern took no part at Sempach but used the war to take Habsburg lands around it.
