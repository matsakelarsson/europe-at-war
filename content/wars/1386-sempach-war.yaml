steps:
  - title: Sempach
    date: 1385–1386
    when: "1386"
    borders: "1386-07-09"
    countries: [ch, at]
    body:
      - Lucerne had joined the Confederacy in 1332 but was still ringed by Habsburg lands, and in the 1380s it set out to build a territory of its own. In 1385 its men and those of Zurich and Zug attacked Habsburg strongholds such as Rothenburg and Wolhusen. Lucerne had already taken the people of the Entlebuch into its citizenship, and in January 1386 it did the same for the town of Sempach. Duke Leopold III of Austria gathered knights from the Aargau, Alsace, Swabia and Tyrol, with mercenaries, at Brugg. Instead of attacking Zurich, as the Confederates expected, he marched south, burning Willisau and the harvest on his way.
      - On 9 July 1386 the men of Lucerne, Uri, Schwyz and Unterwalden, hurrying back from Zurich, met Leopold’s army near Sempach, by the village of Hildisrieden. On ground unsuited to horses the knights fought on foot. After hard fighting the Confederates broke their line, and Leopold and a great many nobles were killed. Swiss tradition later credited the breakthrough to Arnold von Winkelried, who gathered the enemy’s spears into his own body. The defeat broke Habsburg power west of the Rhine, and Lucerne, Bern and Solothurn took over many of its towns and lands.
    facts:
      - [Battle of Sempach, "9 July 1386, Confederate victory"]
      - [Killed, Duke Leopold III and many Habsburg nobles]
