id: sempach-war
name: Sempach War
start: "1386"
end: "1389-04-01"
tier: B
summary: A war between the Swiss Confederates and the Habsburg dukes of Austria, set off by Lucerne’s expansion into Habsburg lands. Duke Leopold III was killed with many of his nobles at Sempach in 1386, Glarus won its freedom at Näfels in 1388, and the peace of 1389 left the Confederates their gains.
