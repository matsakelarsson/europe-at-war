  - title: Näfels and the peace
    date: 1386–1389
    when: "1388"
    borders: "1389-04-01"
    countries: [ch, at]
    body:
      - Leopold’s brother Albert III carried on the war on behalf of Leopold’s young sons. The Confederates took Weesen on the Walensee in August 1386, and in March 1387 the people of Glarus declared themselves free of Habsburg rule. Bern, which had stayed out of the fighting at Sempach, seized Habsburg towns and castles around it. On the night of 21–22 February 1388, remembered as the Murder Night of Weesen, Habsburg troops took Weesen back by surprise.
      - In early April two Habsburg columns set out to subdue Glarus. On 9 April 1388 the main army, perhaps 5,000 strong, stormed the earthwork wall at Näfels, held by about 400 men of Glarus and a few from Schwyz and Uri. As the attackers scattered to plunder, the defenders fell on them from the hillside. The Habsburg troops fled towards Weesen, a bridge collapsed under them, and many drowned; Glarus lost 54 men. On 1 April 1389 Albert agreed to a seven-year peace, extended in 1394 for twenty years, which left the Confederates what they had won.
    facts:
      - [Battle of Näfels, "9 April 1388, victory for Glarus"]
      - [Peace, "1 April 1389, for seven years; extended in 1394"]
      - [Habsburg losses at Näfels, "several hundred to 1,700, by different estimates"]
    markers:
