id: tokhtamysh-timur-war
name: Tokhtamysh–Timur war
start: "1386"
end: "1396"
tier: B
summary: The war between Timur, master of Transoxiana and Iran, and Tokhtamysh, khan of the Golden Horde, whom Timur had helped to power a decade earlier. Tokhtamysh, who had reunited the Horde and sacked Moscow in 1382, claimed Azerbaijan and Khwarazm and resented Timur’s growing power. He attacked Timur’s army in Karabakh in 1387 and raided Transoxiana while Timur was in Iran. Timur answered with two great campaigns into the steppe. In 1391 he marched across the Kazakh steppe and defeated Tokhtamysh on the Kondurcha, near the Volga; in 1395 he crossed the Caucasus, defeated him again on the Terek, and then sacked the cities of the Golden Horde, from Tana on the Sea of Azov to Astrakhan and Sarai on the Volga. The Golden Horde never recovered its strength, and Tokhtamysh, overthrown by Edigu, died a fugitive in Siberia around 1406.
countries: [az, uz, kz, ru, ir]
sides:
  - id: tim
    name: Timur
    polities: [timurid-empire]
    ink: purple
    moves: Timurid moves
    success: Timurid success
  - id: gh
    name: Golden Horde (Tokhtamysh)
    polities: [golden-horde]
    ink: blue
    moves: Golden Horde moves
    success: Golden Horde success
notes:
  - The main sources are Timur’s court histories, especially Sharaf al-Din Ali Yazdi, which glorify him; Russian chronicles and Mamluk envoys add details. The dates of the battle on the Terek are given as 14, 15 or 15–16 April 1395, and its exact site is not known.
  - Tokhtamysh’s sack of Moscow in 1382 is part of the Muscovite–Horde war, and his invasion of Lithuania’s allies and the battle of the Vorskla in 1399 are told elsewhere.
