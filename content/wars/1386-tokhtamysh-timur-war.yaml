steps:
  - title: Karabakh, Sawran and Gurganj
    date: 1386–1389
    when: "1387"
    borders: "1389"
    countries: [az, kz, uz, tm]
    body:
      - Tokhtamysh, a descendant of Jochi, had taken the throne of the eastern Horde with Timur’s help in 1378, then overthrown Mamai and united the whole Golden Horde. In the winter of 1384–1385 he crossed the Caucasus, stormed Tabriz, the capital of the Jalayirids, and carried off a vast booty and many thousands of captives. In 1386 Timur conquered Azerbaijan himself, and in the spring of 1387 Tokhtamysh’s army came through Derbent and fell on Timur’s forces wintering in Karabakh. Timur’s commanders were nearly beaten before his son Miran Shah arrived with reinforcements and drove the enemy off. Timur released the prisoners with gifts.
      - In the winter of 1387–1388, while Timur was in Fars, Tokhtamysh invaded Transoxiana. Part of his army besieged Sawran on the Syr Darya and another crossed Khwarazm and laid siege to Bukhara. Timur hurried back from Shiraz in February 1388, and the Horde troops withdrew. Timur then turned on the Sufi dynasty of Khwarazm, which had sided with Tokhtamysh, and in 1388 razed its capital, Gurganj; according to his historians he had barley sown on the site. Tokhtamysh attacked Sawran again, was driven off by Timur in the snows of January 1389, came back later that year and plundered Yasi, today’s Turkistan, before Timur crossed the Syr Darya after him and took Sighnaq.
    facts:
      - [Battle in Karabakh, "spring 1387, Timurid victory"]
      - [Horde invasion of Transoxiana, "winter 1387–1388"]
      - [Gurganj razed, "1388"]
