  - title: Across the steppe to the Kondurcha
    date: February – July 1391
    when: "1391-06-18"
    borders: "1391-07"
    countries: [kz, ru]
    body:
      - Tokhtamysh sought allies against Timur, among them the Mamluk sultan Barquq. Timur decided to strike at the heart of the Horde. In February 1391 he set out from Tashkent with a large army, ignored Tokhtamysh’s envoys and marched north across the Kazakh steppe, where the army lived largely by hunting. On 28 April, in the Ulu Tagh hills, he had an inscription carved on a rock recording his passage. Only after reaching the upper Tobol did he learn that Tokhtamysh was waiting west of the Ural river; he crossed it upstream and pressed on towards the Volga before the Horde’s reinforcements could arrive.
      - On 18 June 1391 he forced Tokhtamysh to battle on the Kondurcha, a tributary of the Sok east of the Volga. Tokhtamysh tried to envelop Timur’s flanks, but the Timurid army held and its counterattack broke the Horde. Tokhtamysh fled; many of his men, trapped against the Volga, were killed or captured. Timur’s army spent a month celebrating on the river and returned to Samarkand by the end of the year with great herds and many captives. He did not try to occupy the Horde’s lands, and Tokhtamysh, who had kept much of his army, soon re-established his rule.
    facts:
      - [Timur leaves Tashkent, "February 1391"]
      - [Battle of the Kondurcha, "18 June 1391, Timurid victory"]
      - [March across the steppe, "about four months"]
    markers:
