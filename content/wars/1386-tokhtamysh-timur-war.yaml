  - title: The Terek and the sack of the Horde’s cities
    date: 1394–1396
    when: "1395-04-15"
    borders: "1396"
    countries: [ru, az]
    body:
      - In the autumn of 1394 Tokhtamysh raided Shirvan, now a Timurid vassal, and withdrew as Timur approached. In March 1395 Timur marched north through Derbent. His army ravaged the land up to the Terek and destroyed the Horde’s vanguard, and on 15 April 1395 the two main armies met on the Terek. The battle was as hard-fought as the Kondurcha, and Timur himself was nearly killed in the fighting, but some of Tokhtamysh’s emirs, among them one named Aktau, left the field with their men, and his army broke. Tokhtamysh fled north.
      - Timur’s troops pursued him to the Volga, and Timur himself advanced north to Yelets on the borders of Ryazan, which he sacked in August, before turning back without advancing on Moscow; Russian tradition credits the icon of the Virgin of Vladimir with saving the city. He then took Azaq, the Venetian and Genoese trading town of Tana at the mouth of the Don, enslaving its Christian merchants, ravaged Circassia, and in the winter of 1395–1396 destroyed the cities of the lower Volga, Hajji Tarkhan (Astrakhan) and Sarai, whose surviving people were driven off as slaves. In the spring of 1396 he returned through Derbent with his plunder and captives.
      - The trading cities of the Horde never fully recovered, and the caravan trade shifted south to routes through Timur’s lands. Tokhtamysh lost his throne to Timur Qutlugh and the emir Edigu, fled to Lithuania, was defeated with the Lithuanians on the Vorskla in 1399, and was killed in Siberia around 1406.
    facts:
      - [Battle of the Terek, "15 April 1395, Timurid victory"]
      - [Yelets sacked, "August 1395"]
      - [Sarai and Astrakhan destroyed, "winter 1395–1396"]
