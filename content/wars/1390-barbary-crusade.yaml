notes:
  - The main narrative is the chronicle of Jean Froissart, who was not present; another account is the biography of the Duke of Bourbon by Jean Cabaret d’Orville. Their figures for the armies, especially for the Hafsid force, are unreliable.
  - Christian writers called Mahdia’s ships pirates; for the Hafsids and the ports of Ifriqiya, raids at sea and the ransoming of captives were part of a long war at sea in which Genoese, Catalan and Sicilian ships raided the African coast in turn. Aragon followed with expeditions against Tedelis (Dellys) in 1398 and Bône in 1399.
