id: barbary-crusade
name: Barbary Crusade (Mahdia, 1390)
start: "1390-07"
end: "1390-10"
tier: C
summary: "A French and Genoese expedition against Mahdia, a port of the Hafsid kingdom of Tunis from which ships raided Christian shipping and coasts. Genoa, whose trade suffered from the raids, offered ships, supplies and soldiers if France would provide the knights, and Charles VI allowed his uncle Louis II, Duke of Bourbon, to lead about 1,500 French knights and squires, with some English volunteers such as John Beaufort; Pope Boniface IX gave the enterprise crusade privileges. The fleet landed before Mahdia in July 1390 and laid siege to it. The Hafsid sultan Abu al-Abbas Ahmad II came to its relief with an army that included troops from Bougie and Tlemcen; it avoided a pitched battle and harassed the crusaders, who fortified their camp, while disease and shortages wore them down and a last assault on the walls failed. After about two months the Genoese negotiated a ten-year truce, and the army was back in Genoa by mid-October, having lost 274 knights and squires to fighting and disease. Both sides claimed victory; the town stayed Hafsid, and many of the French leaders went on to fight at Nicopolis in 1396."
