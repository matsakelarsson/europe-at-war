notes:
  - Francesco Gonzaga of Mantua joined the league against Milan in 1397 but later went over to Visconti, and commanded troops for him at Casalecchio.
  - Francesco Novello da Carrara recovered Padua from Milan in 1390 and remained Florence’s ally. Florentine writers such as Leonardo Bruni later presented the war as a defence of republican liberty against tyranny.
