id: wars-of-gian-galeazzo-visconti
name: Wars of Gian Galeazzo Visconti
start: "1390-05"
end: "1402-09-03"
tier: C
summary: The wars between Gian Galeazzo Visconti, lord and from 1395 Duke of Milan, and Florence and its allies, as Visconti built a state that covered most of northern and central Italy. Having taken Verona in 1387 and Padua in 1388, he went to war with Florence and Bologna in 1390. Florence’s captain John Hawkwood invaded Lombardy in 1391 but had to retreat, and its French ally, the Count of Armagnac, was defeated and killed outside Alessandria that July; the Peace of Genoa of 1392 settled little. After an attack on Mantua and a truce in 1398, Visconti bought Pisa in 1399 and took Siena, Perugia and much of Umbria under his rule, and in 1401 his army turned back the German king Rupert near Brescia. On 26 June 1402 it routed the Bolognese and Florentines at Casalecchio and took Bologna, leaving Florence isolated, but Gian Galeazzo died of plague at Melegnano on 3 September 1402, and his state broke up among his captains and young sons.
