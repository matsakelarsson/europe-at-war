id: meitoku-rebellion
name: Meitoku Rebellion
start: "1391"
end: "1392-01"
tier: C
summary: "A rising of the Yamana clan against the Ashikaga shogun Yoshimitsu, fought out in a single day in Kyoto. The Yamana held the military governorships (shugo) of eleven of Japan’s sixty-six provinces and were called “the lords of one-sixth” (rokubun-no-ichi dono), but after the death of their head Yamana Tokiyoshi in 1389 the branches of the family fell out. Yoshimitsu, who was cutting the great governors down to size, first backed Yamana Ujikiyo and Yamana Mitsuyuki against their kinsmen Tokihiro and Ujiyuki, then received the latter back into favour and in late 1391 took Izumo from Mitsuyuki for seizing an estate of the retired emperor. Mitsuyuki and Ujikiyo raised their men, obtained a banner from the Southern Court, and marched on the capital from Tanba and from Sakai. On the last day of the twelfth month of Meitoku 2 (January 1392) they attacked Kyoto and were beaten at Uchino, the empty ground of the old imperial palace, and on Ōmiya avenue by the shogun’s own guards and the troops of Hosokawa Yoriyuki, Ōuchi Yoshihiro, the Hatakeyama, the Isshiki and the Kyōgoku. Ujikiyo was killed. The Yamana were left with three provinces, Tajima, Inaba and Hōki; Izumi and Kii went to Ōuchi Yoshihiro and the rest to other supporters of the shogun. Mitsuyuki escaped, but was caught in 1395 and executed. The victory strengthened Yoshimitsu, who brought the Southern Court to end the schism later in 1392."
