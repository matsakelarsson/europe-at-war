notes:
  - Japanese dates are in the lunar calendar. The battle in Kyoto was fought on the 30th day of the twelfth month of Meitoku 2, which some sources count as 1391 and which fell in January 1392 in the Julian calendar.
  - The chronicle Meitokuki gives about 5,000 men for the shogunate’s army at Uchino, with another 5,000 under Yoshimitsu in reserve, against about 3,000 under Ujikiyo and 2,000 under Mitsuyuki. How far Yoshimitsu deliberately provoked the rising, and how far it grew out of the Yamana’s own quarrels, is debated.
