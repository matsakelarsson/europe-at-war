notes:
  - The start of the blockade is dated to 1394 in most accounts; Anadolu Hisarı was built in 1394 or 1395. After Bayezid’s defeat, the Treaty of Gallipoli (1403) gave Thessalonica and some of the coast back to Byzantium.
