id: siege-of-constantinople-1394
name: Siege of Constantinople, 1394–1402
start: "1394"
end: "1402-07-28"
tier: C
summary: The long blockade of Constantinople by Sultan Bayezid I. By 1391 Ottoman conquests had cut the city off from its hinterland, and after Emperor Manuel II refused to come to him as a vassal, Bayezid built the castle of Anadolu Hisarı (Güzelce Hisar) on the Asian shore of the Bosporus and tried to starve the city into surrender, by land and less effectively by sea. The Crusade of Nicopolis, launched partly to relieve it, was destroyed in 1396. In 1399 Marshal Boucicaut arrived with about 1,200 French soldiers but could do little, and in December Manuel left the city to seek help in Venice, Paris and London, leaving his nephew John VII in charge. The siege ended when Timur invaded Anatolia and defeated and captured Bayezid at Ankara in July 1402.
