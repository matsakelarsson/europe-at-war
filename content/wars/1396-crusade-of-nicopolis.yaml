steps:
  - title: Down the Danube
    date: April – September 1396
    when: "1396-04-30"
    borders: "1396-09-12"
    countries: [hu, bg, ro, fr, rs]
    body:
      - The fall of Tarnovo and Ottoman raids across the Danube led Sigismund of Hungary to appeal to the West, and with England and France at truce, French nobles answered eagerly. Duke Philip of Burgundy paid for much of the expedition and gave its command to his son John, Count of Nevers, aged 24, advised by veterans such as Enguerrand de Coucy, Jean de Vienne and Marshal Boucicaut. The French and Burgundians left Dijon on 30 April 1396 and joined Sigismund at Buda in July, together with German knights, Wallachians under Mircea the Elder and others; Venetian ships brought the Hospitallers of Rhodes into the Black Sea and up the Danube.
      - Rather than wait for Bayezid in Hungary, the crusaders marched down the Danube and crossed it at Orșova over eight days. Ivan Sratsimir opened Vidin to them, and the Turkish officers of its garrison were put to death. At Oryahovo (Rahova) the townspeople surrendered to Sigismund on promise of their lives, but the French sacked the town and massacred many of them, Turks and Bulgarians, keeping about a thousand for ransom. On 12 September the army reached Nicopolis, a strong fortress on a cliff above the river. Having brought no siege engines, it settled down to starve the garrison out.
    facts:
      - [Crusaders leave Dijon, 30 April 1396]
      - [Vidin surrenders, September 1396]
      - [Siege of Nicopolis begins, 12 September 1396]
