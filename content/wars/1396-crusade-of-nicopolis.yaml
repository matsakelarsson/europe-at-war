id: crusade-of-nicopolis
name: Crusade of Nicopolis
start: "1396-04-30"
end: "1396-09-25"
tier: B
summary: The great crusade of 1396, in which King Sigismund of Hungary and an army of French, Burgundian, German and other knights, with Wallachians, Hospitallers and a Venetian fleet, marched down the Danube to drive the Ottomans from the Balkans. After taking Vidin and Oryahovo they besieged Nicopolis, where on 25 September the army of Sultan Bayezid I and his Serbian vassals destroyed them. Bayezid had thousands of prisoners killed, and annexed Vidin, the last Bulgarian realm.
countries: [bg, ro, hu, fr, tr, rs]
sides:
  - id: cru
    name: Sigismund and the crusaders
    polities: [hungary, france, burgundy, wallachia, malta, venice]
    ink: olive
    moves: Crusader moves
    success: Crusader success
  - id: ott
    name: Ottoman Empire and Serbia
    polities: [ottoman, serbia]
    ink: teal
    moves: Ottoman moves
    success: Ottoman success
notes:
  - Dates are Julian. The chroniclers give armies of 100,000 or more on each side; modern historians think each numbered perhaps 15,000 to 20,000. The reported English contingent seems never to have existed.
  - The main accounts are French (Froissart, the Monk of Saint-Denis and others) and blame the defeat on the French knights’ haste; the young Johann Schiltberger, a Bavarian squire who survived the massacre, left an eyewitness account of it.
