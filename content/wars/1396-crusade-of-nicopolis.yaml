  - title: The battle of Nicopolis
    date: 25 September 1396
    when: "1396-09-25"
    borders: "1396-10"
    countries: [bg, hu, fr, ro, rs, tr]
    body:
      - Bayezid broke off his blockade of Constantinople and came north through the Shipka Pass, joined by Stefan Lazarević and his Serbian knights. On 25 September the French insisted on leading the attack, against Sigismund’s advice to let the Wallachian infantry open the battle. Their knights rode down the Ottoman light troops and irregular infantry and then, many of them on foot after crossing lines of sharpened stakes, climbed the slope beyond, only to meet fresh Ottoman cavalry held in reserve at the top. Surrounded, Nevers and the surviving French surrendered.
      - The Wallachians and Transylvanians left the field, and Sigismund, the Hospitallers and the Germans were overwhelmed after the Serbian horsemen joined the battle. Sigismund escaped in a boat to the Venetian ships; many others drowned trying to reach them. Enraged by his losses and by the killing of prisoners at Oryahovo, Bayezid had several thousand captives put to death the next day, sparing the richest nobles, among them Nevers and Boucicaut, who were ransomed for 200,000 florins. Coucy died in captivity at Bursa. Bayezid then took Vidin and returned to his siege of Constantinople.
    facts:
      - [Battle of Nicopolis, "25 September 1396, Ottoman victory"]
      - [Prisoners executed, "several thousand by the chroniclers’ accounts; modern estimates 300–3,000"]
      - [Ransom of the nobles, "200,000 florins"]
    markers:
      - kind: battle
        side: ott
        name: Battle of Nicopolis
        date: 25 September 1396
        text: The French charge broke against the Ottoman reserve on the plateau south of the town; the rest of the army was then defeated in turn.
        lonlat: [24.85, 43.66]
        lp: l
      - kind: held
        side: ott
        name: Nicopolis
        date: 25 September 1396
        text: The garrison held out until the sultan arrived; the crusader camp below the walls was abandoned.
        lonlat: [24.9, 43.7]
