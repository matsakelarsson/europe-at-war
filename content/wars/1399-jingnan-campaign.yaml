  - title: Dongchang and the battles of 1401
    date: January – October 1401
    when: "1401-01-09"
    borders: "1401-10-01"
    countries: [cn]
    body:
      - "In the winter Zhu Di marched south again, past Dezhou, towards the Grand Canal. On 9–10 January 1401 Sheng Yong met him at Dongchang (Liaocheng) in western Shandong with an army that used firearms and rockets to great effect. Zhu Di was nearly surrounded, lost tens of thousands of men, among them his leading general Zhang Yu, and escaped back to Beiping. It was the worst defeat of his campaign."
      - "In spring he came back by a more westerly route. On 5–6 April he beat Sheng Yong at Jiahe, south of Wuyi in Hebei, helped, the accounts say, by a north-easterly storm that blew dust into the faces of the government troops, and on 27 April he defeated the cavalry of Ping An at Gaocheng. The court dismissed Qi Tai and Huang Zicheng in a vain attempt to make peace, but Zhu Di would not negotiate."
      - "Through the summer and autumn the war became one of raids on supply lines. Sheng Yong tried to cut the Yan army’s supplies on the Grand Canal, and Ping An struck north towards Beiping, but Zhu Di’s forces regrouped and drove the government troops out of the region. After more than two years, Zhu Di held little beyond the land around Beiping, and Shandong was closed to him."
    facts:
      - [Battle of Dongchang, "9–10 January 1401, government victory"]
      - [Battle of Jiahe, "5–6 April 1401, Yan victory"]
      - [Battle of Gaocheng, "27 April 1401, Yan victory"]
