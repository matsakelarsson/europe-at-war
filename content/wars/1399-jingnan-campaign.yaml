  - title: Nanjing
    date: July 1402
    when: "1402-07-13"
    borders: "1402-07-17"
    countries: [cn]
    body:
      - "On 1 July Sheng Yong’s fleet held the Yan army back at Pukou, opposite Nanjing. Two days later the admiral Chen Xuan went over to Zhu Di with his ships, and the Yan army crossed the Yangtze from Guazhou and advanced on the capital. The emperor sent Li Jinglong and his uncle Zhu Hui, Prince of Gu, to offer peace on 9 July; Zhu Di refused to talk."
      - "On 13 July Li Jinglong and the Prince of Gu opened the Jinchuan Gate in the north-west wall to the Yan army. The palace went up in flames, and three charred bodies were later said to be those of the emperor, the empress and their eldest son. The emperor was most likely killed in the fire, but rumours that he had escaped disguised as a monk followed the Yongle Emperor all his life, and the Qing-era official history leaves the question open."
      - "Zhu Di was enthroned on 17 July 1402 as the Yongle Emperor. He abolished the Jianwen reign title, burned most of the government archives and dealt harshly with those who would not serve him. Qi Tai and Huang Zicheng were executed, and when Fang Xiaoru refused to write the proclamation of his accession, he was put to death with members of his family, his students and friends. The purges took the lives of thousands and touched tens of thousands. The new emperor rewarded his generals, restored the princes his nephew had deposed, and in 1403 renamed Beiping Beijing, the capital he moved to in 1421."
    facts:
      - [Chen Xuan changes sides, "3 July 1402"]
      - [Jinchuan Gate opened, "13 July 1402"]
      - [Zhu Di enthroned as the Yongle Emperor, "17 July 1402"]
