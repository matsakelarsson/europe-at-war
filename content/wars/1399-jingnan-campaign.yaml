  - title: Zhending and the siege of Beiping
    date: September – December 1399
    when: "1399-09-25"
    borders: "1399-12-02"
    countries: [cn]
    body:
      - "The court sent the veteran general Geng Bingwen north with 130,000 men, who reached Zhending in September. Zhu Di attacked them there in late September, routed the army north of the city and besieged it for three days before withdrawing. The emperor replaced Geng Bingwen with Li Jinglong, the son of one of Hongwu’s generals, who gathered a larger army and marched on Beiping."
      - "Zhu Di did not wait to be besieged. In mid-October he left Beiping with much of his army, defended by his eldest son Zhu Gaochi, and rode north-east beyond the Wall to Daning, the seat of his younger brother Zhu Quan, Prince of Ning. He took the prince and his guard, among them three units of Mongol cavalry of the Uriankhai, into his own army."
      - "Li Jinglong laid siege to Beiping on 12 November. The city held, and on 2 December Zhu Di, back with his new troops, attacked the besiegers’ camp at Zhengcunba east of the city and forced them to retreat south in the winter cold."
