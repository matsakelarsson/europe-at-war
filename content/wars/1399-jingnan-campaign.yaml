  - title: The march to the Yangtze
    date: January – June 1402
    when: "1402-05-28"
    borders: "1402-06-17"
    countries: [cn]
    body:
      - "In January 1402 Zhu Di changed his plan. Rather than besiege the cities of Shandong one by one, he left them behind and struck straight south along the western edge of the province towards the Huai River and Nanjing, living off the land. He set out on 15 January, and Xuzhou fell on 3 March."
      - "The court sent Xu Huizu, the son of the great general Xu Da and brother of Zhu Di’s own wife, with its best troops, and on 23 May he beat the Yan army at Mount Qimei in northern Anhui. But the emperor then recalled him to Nanjing, and about 28 May Zhu Di surrounded and captured the government army at Lingbi, taking Ping An and other generals. The road south was open."
      - "On 7 June the Yan army crossed the Huai River, and on 17 June Yangzhou on the north bank of the Yangtze surrendered. Many officials and commanders now began to change sides or wait on events."
    facts:
