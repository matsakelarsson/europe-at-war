  - title: The Baigou River and Jinan
    date: January – September 1400
    when: "1400-05"
    borders: "1400-09-04"
    countries: [cn]
    body:
      - "After a raid into Shanxi towards Datong in January 1400, Zhu Di met Li Jinglong’s rebuilt army in May on the Baigou River near Baoding, south of Beiping. By the Chinese accounts the two armies together numbered 600,000 men. Heavy rain and floods hampered the government army’s flanking move, and after a hard fight it broke. Li Jinglong fell back on 30 May to Dezhou and then to Jinan, losing many men and much of his equipment."
      - "Zhu Di took Dezhou and its stores early in June and laid siege to Jinan, the capital of Shandong, from 8 June. Its defence was led by the provincial official Tie Xuan and the general Sheng Yong. For three months the city resisted every assault, and on 4 September Zhu Di broke off the siege and went back to Beiping. The court made Sheng Yong commander in place of Li Jinglong and Tie Xuan minister of war."
    facts:
      - [Battle of the Baigou River, "May 1400, Yan victory"]
      - [Siege of Jinan, "8 June – 4 September 1400"]
