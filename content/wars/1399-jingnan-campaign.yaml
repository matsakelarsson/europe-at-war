id: jingnan-campaign
name: Jingnan campaign
start: "1399-08-06"
end: "1402-07-17"
tier: A
summary: "The civil war in which Zhu Di, Prince of Yan, a son of the Hongwu Emperor, overthrew his nephew the Jianwen Emperor and took the throne as the Yongle Emperor. Jianwen, who succeeded his grandfather in 1398, set out with his advisers Qi Tai and Huang Zicheng to reduce the power of his uncles, the princes who commanded armies on the frontiers. Zhu Di, the strongest of them, rose at Beiping (Beijing) on 6 August 1399, claiming to rescue the throne from evil ministers; he called his campaign jingnan, “quelling the troubles”. With about 100,000 men against a government with three times as many, he beat the first imperial armies near Zhending and before Beiping in 1399, won a great battle on the Baigou River in 1400, but failed before Jinan and was badly beaten at Dongchang in January 1401. In 1402 he bypassed the fortified cities of Shandong, crossed the Huai and the Yangtze, and on 13 July entered Nanjing when its gates were opened to him. The palace burned and the Jianwen Emperor was never seen again. Zhu Di was enthroned on 17 July 1402 and purged the late emperor’s followers, killing thousands; he later moved the capital to Beijing."
countries: [cn]
sides:
  - id: yan
    name: Zhu Di, Prince of Yan
    polities: [prince-of-yan]
    ink: blue
    moves: Yan moves
    success: Yan success
  - id: jw
    name: Jianwen Emperor’s government
    polities: [ming]
    ink: red
    moves: Government moves
    success: Government success
notes:
  - "Dates are converted from the Chinese lunar calendar. The Yongle Emperor had the records of his nephew’s reign rewritten or destroyed and its years renamed as the 32nd to 35th years of Hongwu, so the surviving accounts were written by the winners; details of Zhu Di’s own setbacks and of the Jianwen court are uncertain. Army sizes are those of the Chinese histories and are probably inflated."
  - "Beijing was called Beiping until 1403, when Zhu Di renamed it and began to make it the capital."
