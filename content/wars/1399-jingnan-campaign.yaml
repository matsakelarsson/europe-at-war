steps:
  - title: The emperor and his uncles
    date: June 1398 – August 1399
    when: "1399-08-06"
    borders: "1399-08-06"
    countries: [cn]
    body:
      - "The Hongwu Emperor died on 24 June 1398. His eldest son had died before him, and the throne passed to his grandson Zhu Yunwen, then 21, who reigned as the Jianwen Emperor. The old emperor had made his other sons princes with their own guards and placed the strongest of them on the northern frontier to face the Mongols. The young emperor’s advisers, the scholars Qi Tai, Huang Zicheng and Fang Xiaoru, saw the princes as a danger to the throne and persuaded him to “reduce the feudatories”."
      - "Within a year five princes were removed. The Prince of Zhou was arrested and exiled, the princes of Qi, Dai and Min were stripped of their ranks, and the Prince of Xiang, ordered to come to court, burned himself in his palace with his family. The greatest of the uncles, Zhu Di, Prince of Yan, who had commanded against the Mongols from Beiping for nearly twenty years, was watched by officials sent from Nanjing. According to the later official histories he played mad for a time to put them off guard."
      - "When two of his officers were arrested and executed in the summer of 1399, Zhu Di struck first. On 6 August he had the court’s officials in Beiping seized and killed and took control of the city. Citing his father’s injunction that allowed the princes to act against evil ministers, he declared that he was rising to rescue the emperor from his advisers. In the following days his troops took the Juyong Pass, Huailai, Miyun, Zunhua and Yongping, securing the land around Beiping and the passes to the steppe."
    facts:
      - [Death of the Hongwu Emperor, "24 June 1398"]
      - [Zhu Di seizes Beiping, "6 August 1399"]
      - [Zhu Di’s army, "about 100,000 men"]
