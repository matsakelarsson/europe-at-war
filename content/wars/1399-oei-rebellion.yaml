id: oei-rebellion
name: Ōei Rebellion
start: "1399-11"
end: "1400-01"
tier: C
summary: "The rising of Ōuchi Yoshihiro against the retired shogun Ashikaga Yoshimitsu, ended by the siege and burning of the port of Sakai. Yoshihiro was governor (shugo) of six provinces, Suō, Nagato, Iwami, Buzen, Izumi and Kii, grew rich on trade with Korea, and had served the shogunate well: in Kyushu, against the Yamana in 1391 and as a go-between in the reunion of the Northern and Southern Courts in 1392. He fell out with Yoshimitsu, who was reducing the great governors one by one. He refused to send men to build Yoshimitsu’s Kitayama villa, resented that his brother Mitsuhiro had died fighting in Kyushu without reward, and heard rumours that he would lose Izumi and Kii or be killed if he went to Kyoto. Through Imagawa Ryōshun he made a secret pact with the Kamakura kubō Ashikaga Mitsukane, and he sounded out other discontented lords and the old supporters of the Southern Court. In the tenth month of Ōei 6 (November 1399) he landed his army at Sakai but would not go on to the capital, and on 18 November Yoshimitsu ordered his punishment. Yoshihiro fortified Sakai with a wooden wall and 48 towers. The chronicle Ōeiki gives the shogun’s army about 30,000 horsemen against about 5,000, while ships from Shikoku and Awaji closed the port from the sea. Risings in his support in Ōmi and Mino failed, and Mitsukane, who marched with over 10,000 men into Musashi, stopped there. On the 21st day of the twelfth month (January 1400) the besiegers set fire to the defences with the wind behind them, and Yoshihiro was killed in the last fight. Yoshimitsu took away Izumi, Kii, Iwami and Buzen; Suō and Nagato went to Yoshihiro’s brother Hiromo, who had surrendered, but another brother, Ōuchi Morimi, fought on, defeated Hiromo in 1402 and was soon recognised by the shogunate as head of the house."
