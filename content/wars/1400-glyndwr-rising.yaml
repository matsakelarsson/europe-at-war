  - title: Machynlleth, the French and defeat
    date: 1404–1415
    when: "1404"
    borders: "1409-02"
    countries: [gb, fr]
    body:
      - In 1404 Owain took the great castles of Harlech and Aberystwyth, held a parliament of all Wales at Machynlleth and made a treaty with Charles VI of France. In February 1405, in the Tripartite Indenture, he, Mortimer and the Earl of Northumberland agreed to divide England and Wales between them, with Wales stretching to the Severn and the Mersey. That August a French army of some 2,500 men landed at Milford Haven, took Carmarthen with the Welsh and marched into England as far as Woodbury Hill near Worcester, where it faced the king’s army for several days before turning back.
      - But the tide was turning. Owain’s forces were beaten at Grosmont in March 1405 and at Pwll Melyn near Usk in May, where his brother Tudur was killed and his son Gruffudd captured; Adam of Usk says 300 prisoners were beheaded. In 1406 Owain’s letter from Pennal offered to bring the Welsh church under the pope at Avignon and set out plans for two Welsh universities, but French help was drying up. Prince Henry, the future Henry V, used the castles still in English hands to blockade the country, and one district after another submitted and paid fines.
      - Anglesey was lost in 1406, Aberystwyth fell in 1408 and Harlech in February 1409, where Mortimer died and Owain’s wife and daughters were captured; Catrin and her children died in captivity in London. After a failed raid into Shropshire in 1410 Owain went into hiding. He never accepted Henry V’s offers of pardon and probably died around 1415; his son Maredudd accepted a pardon in 1421.
    facts:
      - [Parliament at Machynlleth, "1404"]
      - [French expedition, "August 1405, from Milford Haven to Woodbury Hill"]
      - [Fall of Harlech, "February 1409"]
    markers:
