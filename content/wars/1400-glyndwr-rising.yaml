steps:
  - title: Prince of Wales
    date: 1400–1403
    when: "1400-09-16"
    borders: "1403-07-21"
    countries: [gb]
    body:
      - Owain Glyndŵr, lord of Glyndyfrdwy and Cynllaith and a descendant of the princes of Powys and Deheubarth, had served English kings in war. A land dispute with his neighbour Reginald Grey, Lord of Ruthin, came to a head after Henry IV deposed Richard II, who had been well liked in Wales. On 16 September 1400 a small band of followers proclaimed Owain Prince of Wales at Glyndyfrdwy. Two days later they sacked Ruthin, and within a week they had burned the English towns of north-east Wales from Denbigh and Flint to Oswestry and Welshpool. Henry IV marched round north Wales but found no one to fight.
      - The revolt spread in 1401. Owain’s cousins Rhys and Gwilym ap Tudur seized Conwy Castle on Good Friday while most of its garrison was at church, and Owain beat a much larger force from Pembrokeshire at Mynydd Hyddgen. Parliament answered with harsh laws barring Welshmen from office, from bearing arms and from buying land in England. In 1402 Owain captured Grey and held him for ransom, and on 22 June at Bryn Glas, near Pilleth, he routed the levies of Herefordshire and took Sir Edmund Mortimer prisoner. Mortimer married Owain’s daughter Catrin and joined him.
      - In July 1403 Owain swept down the Tywi valley, where castles and towns fell or surrendered, and took Carmarthen. That month Henry “Hotspur” Percy, who had fought the Welsh for the king, rebelled in Cheshire with Welsh support, but he was killed fighting Henry IV and his son Prince Henry at Shrewsbury on 21 July. Owain, far away in the south, took no part in the battle.
    facts:
      - [Owain proclaimed Prince of Wales, "16 September 1400, Glyndyfrdwy"]
      - [Battle of Bryn Glas, "22 June 1402, Welsh victory"]
      - [Battle of Shrewsbury, "21 July 1403, Hotspur killed"]
