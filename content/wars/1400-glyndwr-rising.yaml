id: glyndwr-rising
name: Glyndŵr Rising
start: "1400-09-16"
end: "1415"
tier: B
summary: The last great Welsh revolt against English rule, led by Owain Glyndŵr, who was proclaimed Prince of Wales in 1400. At its height in 1404–1405 he controlled most of Wales, held a parliament at Machynlleth and allied with France, but English armies and an economic blockade wore the rising down. After Harlech fell in 1409 Glyndŵr became a fugitive, and he disappeared around 1415.
