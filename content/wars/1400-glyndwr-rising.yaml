notes:
  - Dates are Julian. Many events of the rising are known only from a few chronicles, above all that of Adam of Usk, and several dates are uncertain, among them those of the battles of Grosmont and Pwll Melyn, usually put in March and May 1405.
  - Owain’s name is also written Owen Glendower in older English. The date and place of his death are unknown; a Welsh annal records it under 1415.
