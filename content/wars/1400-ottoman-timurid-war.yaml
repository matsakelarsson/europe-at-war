notes:
  - The battle of Ankara is dated 28 July 1402 in many accounts and 20 July in others. The size of the armies is unknown; the chroniclers’ figures of hundreds of thousands are impossible, and modern guesses range widely.
  - The story that Timur carried Bayezid around in an iron cage comes from later writers and is doubted; historians at Timur’s court said that the sultan was treated well.
