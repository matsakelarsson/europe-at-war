id: ottoman-timurid-war
name: Ottoman–Timurid War
start: "1400-08"
end: "1402-12"
tier: B
summary: The war between Sultan Bayezid I and the Central Asian conqueror Timur (Tamerlane), whose empire stretched from Samarkand to eastern Anatolia. After years of insulting letters and quarrels over the Turkish lords of eastern Anatolia, Timur sacked Sivas in 1400, and in 1402 he destroyed the Ottoman army near Ankara and took Bayezid prisoner. Timur restored the Turkish beyliks that Bayezid had annexed, and the Ottoman state nearly fell apart in the civil war that followed.
countries: [tr, sy]
