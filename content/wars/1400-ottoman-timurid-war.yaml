    name: Timur
    polities: [timurid-empire]
    ink: red
    moves: Timurid moves
    success: Timurid success
  - id: ott
    name: Ottoman Empire and its vassals
    polities: [ottoman, serbia]
    ink: teal
    moves: Ottoman moves
