steps:
  - title: Sivas
    date: 1400–1401
    when: "1400-08"
    borders: "1400-09"
    countries: [tr, sy]
    body:
      - In the 1390s Bayezid annexed the Turkish beyliks of western and central Anatolia and in 1398 took Sivas and the lands of Kadi Burhan al-Din, and then Malatya, reaching the frontier of Timur’s empire. Rulers he had driven out, among them the lords of Aydın, Germiyan and Menteşe, fled to Timur, and the lord of Erzincan, Taharten, was Timur’s vassal. Insulting letters passed between the two rulers. In August 1400 Timur invaded Anatolia and besieged Sivas, which surrendered after about three weeks. According to the chroniclers, he had the Christian soldiers of the garrison, said to number some 4,000, mostly Armenians, buried alive, and the town was destroyed.
      - Timur did not march west at once. He turned south against the Mamluks of Egypt and Syria, sacked Aleppo in late 1400 and took Damascus early in 1401, massacring much of its population and carrying off its craftsmen to Samarkand, and then stormed Baghdad. Bayezid used the respite to attack Taharten and take the castle of Kemah on the upper Euphrates, while keeping up his blockade of Constantinople. In 1402 Timur retook Kemah and set out for central Anatolia.
    facts:
      - [Sack of Sivas, "August 1400"]
      - [Sack of Aleppo, "late 1400"]
      - [Damascus taken, "early 1401"]
