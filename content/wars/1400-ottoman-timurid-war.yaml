  - title: Ankara
    date: July 1402
    when: "1402-07-28"
    borders: "1402-12"
    countries: [tr, rs]
    body:
      - In the summer of 1402 Timur marched by way of Sivas and Kayseri towards Ankara. Bayezid broke off his blockade of Constantinople and hurried east in the heat, but Timur slipped round behind him and camped in the plain of Çubuk, north-east of Ankara, where he controlled the water. When the armies met on 28 July, the Tatars in Bayezid’s army and the soldiers of the beyliks he had annexed went over to Timur, whose horse archers wore down the tired and thirsty Ottomans. The Serbian knights of Stefan Lazarević fought hard and broke out with Bayezid’s son Süleyman, but Bayezid was surrounded and captured with another son, Musa.
      - Timur’s grandson Muhammad Sultan sacked Bursa and its treasury, and in December Timur took the Hospitallers’ sea castle at Smyrna after a two-week siege and had many of its people killed. He gave back their lands to the lords of Karaman, Germiyan, Aydın, Saruhan, Menteşe and the other beyliks. Bayezid died in captivity at Akşehir on 8 March 1403, and Timur went home to Samarkand. The Ottoman realm in Europe survived, but Bayezid’s sons were soon fighting each other for what was left.
    facts:
      - [Battle of Ankara, "28 July 1402, Timurid victory"]
      - [Bayezid captured, "28 July 1402; died 8 March 1403"]
      - [Siege of Smyrna, "December 1402"]
