notes:
  - Ottoman chronicles written later, under Mehmed’s descendants, present him as the rightful heir; only he called himself sultan on his coins during the civil war. Many dates are uncertain. A fifth brother, Mustafa, who had been captured at Ankara, reappeared in 1416 and again in 1421–1422 to challenge Mehmed and his son Murad II.
  - The Christian neighbours changed sides as suited them. Byzantium, Venice and Genoa backed Süleyman, who gave back Thessalonica and other places in the Treaty of Gallipoli of 1403. Mircea of Wallachia and, by most accounts, the Serbian despot Stefan Lazarević backed Musa against him, but when Musa turned on his former allies, Stefan and Manuel II helped Mehmed defeat him.
