steps:
  - title: The brothers’ war
    date: 1402–1411
    when: "1402-07-28"
    borders: "1411-02-17"
    countries: [tr, bg, gr, ro]
    body:
      - After Ankara, Bayezid’s eldest son Süleyman held the European provinces from Edirne. To win friends he signed the Treaty of Gallipoli early in 1403 with Byzantium, Venice, Genoa, the Knights of Rhodes and the Duke of Naxos, returning Thessalonica and part of the Black Sea and Marmara coasts to the emperor. In Anatolia, İsa took Bursa and Mehmed ruled from Amasya. In 1403 Mehmed beat İsa at Ulubad and took Bursa; İsa fled and was later killed by Mehmed’s agents. Süleyman then crossed into Anatolia, took Bursa and Ankara in 1404, and for some years held Mehmed in check.
      - Mehmed sent their brother Musa, released from Timurid captivity, across the Black Sea to attack Süleyman’s European lands with the help of Mircea of Wallachia. Süleyman returned to Thrace and beat Musa on 15 June 1410 at Kosmidion, just outside the walls of Constantinople, but by the chroniclers’ account his idleness and drinking cost him support. In February 1411 his army went over to Musa at Edirne, and Süleyman was caught and strangled on 17 February. Musa now ruled the Ottoman Balkans and turned on Süleyman’s allies, besieging Constantinople and attacking Serbia and Thessalonica.
    facts:
      - [Treaty of Gallipoli, "1403; Thessalonica returned to Byzantium"]
      - [Battle of Kosmidion, "15 June 1410, Süleyman defeats Musa"]
      - [Death of Süleyman, 17 February 1411]
