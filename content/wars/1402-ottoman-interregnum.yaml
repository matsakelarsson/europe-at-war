  - title: Çamurlu
    date: 1411–1413
    when: "1411-02-17"
    borders: "1413-07-05"
    countries: [bg, tr, rs, gr]
    body:
      - Musa’s attacks drove his enemies together. Emperor Manuel II called on Mehmed, whose troops crossed to defend Constantinople; after failed sorties and a revolt at home Mehmed had to withdraw, but in 1413 he crossed again with Byzantine help and joined forces with the Serbian despot Stefan Lazarević, whose lands Musa had ravaged. Many of Musa’s commanders in the Balkans, alienated by his harsh rule, went over to Mehmed.
      - On 5 July 1413 the armies met at Çamurlu, near Samokov in the mountains of western Bulgaria. Hasan, aga of Mehmed’s janissaries, rode out to urge Musa’s men to change sides; Musa cut him down but was wounded by one of Hasan’s companions. Musa’s men fought well, but Mehmed won, and Musa fled and was caught and strangled. Mehmed, now sole sultan, kept peace with Byzantium and Serbia and spent his eight-year reign restoring Ottoman rule in Anatolia and the Balkans.
    facts:
      - [Battle of Çamurlu, "5 July 1413, Mehmed’s victory"]
      - [Mehmed’s allies, "Manuel II and Stefan Lazarević"]
    markers:
      - kind: battle
        side: meh
        name: Battle of Çamurlu
        date: 5 July 1413
        text: The last battle of the civil war, fought on the plain of Çamurlu near Samokov. Musa was killed soon after.
        lonlat: [23.556, 42.337]
      - kind: siege
        side: musa
        name: Constantinople
        date: 1411–1412
        text: Musa besieged the city to punish Manuel II for backing Süleyman; Mehmed’s troops helped defend it.
        lonlat: [28.98, 41.01]
      - kind: held
        side: byz
        name: Thessalonica
        date: "1412"
        text: Musa’s attack on the city failed.
        lonlat: [22.936, 40.64]
