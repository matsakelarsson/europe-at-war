id: ottoman-interregnum
name: Ottoman Interregnum
start: "1402-07-28"
end: "1413-07-05"
tier: B
summary: The civil war among the sons of Bayezid I after his defeat and capture by Timur at Ankara. Süleyman ruled the European provinces from Edirne, while İsa held Bursa and Mehmed Amasya; Mehmed defeated İsa, and their brother Musa, sent by Mehmed into the Balkans, overthrew and killed Süleyman in 1411. Allied with the Byzantine emperor and the Serbian despot, Mehmed finally defeated Musa at Çamurlu in 1413 and reunited the Ottoman state as Mehmed I.
