notes:
  - The Pararaton calls the war the parĕgrĕg, “the Regreg affair”, from which the common but mistaken name Paregreg comes. Its dates and the Chinese side of the story come from the Pararaton and from Ming records, among them Ma Huan’s Yingya Shenglan. In later Javanese literature the war became the legend of Damarwulan and Menak Jingga of Blambangan.
