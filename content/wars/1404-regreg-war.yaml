id: regreg-war
name: Regreg war
start: "1404"
end: "1406"
tier: C
summary: "A civil war in Majapahit between the western court at Trowulan, ruled by King Wikramawardhana, and the eastern court of Bhre Wirabhumi, the lord of the Blambangan region in the east of Java. Since the 1370s Majapahit had had two courts, both of which sent their own envoys to the Ming: an eastern court had grown up under Wijayarajasa, the husband of Hayam Wuruk’s aunt, and after his death in 1398 passed to Bhre Wirabhumi, Hayam Wuruk’s son by a concubine, who believed he had a better right to the throne than Wikramawardhana, Hayam Wuruk’s nephew and son-in-law. A quarrel over titles in 1400–1402 led to a breach, and Wirabhumi received recognition and a seal from the Ming court. Fighting began in 1404 and went on with halts and reverses, which is what regreg means. In 1406 the western army under Wikramawardhana’s son Bhre Tumapel broke into the eastern court; Wirabhumi fled by boat at night, was overtaken and killed by Raden Gajah, and his head was brought to Trowulan. During the fighting about 170 men of a Ming mission sent by Zheng He’s fleet were killed at the eastern court; the Yongle emperor demanded 60,000 taels of gold in compensation, of which Majapahit paid 10,000 by 1408 before the rest was forgiven. Majapahit was reunited, but the war hastened the loss of its overseas dependencies as Malacca, Palembang and Brunei went their own way."
