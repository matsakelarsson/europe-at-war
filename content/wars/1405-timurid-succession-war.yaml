id: timurid-succession-war
name: Timurid succession war
start: "1405-02-18"
end: "1409-05-13"
tier: C
summary: The struggle among Timur’s sons and grandsons after his death at Otrar on 18 February 1405, on campaign against Ming China. His grandson Khalil Sultan seized Samarkand and the treasury; Pir Muhammad, the grandson Timur is said to have named as heir, was beaten by Khalil and murdered by one of his own nobles in 1407; and Timur’s youngest son, Shah Rukh, held Khorasan from Herat. In the west the Kara Koyunlu and the Jalayirids returned. Qara Yusuf beat Abu Bakr at Nakhchivan in October 1406 and on 20 April 1408 defeated and killed Miran Shah at Sardrud near Tabriz, ending Timurid rule in Azerbaijan. Khalil Sultan lost the support of his emirs in a famine, and Shah Rukh entered Samarkand unopposed on 13 May 1409. He gave it to his son Ulugh Beg and ruled the empire from Herat until 1447; Khalil was made governor of Ray, where he died in 1411.
