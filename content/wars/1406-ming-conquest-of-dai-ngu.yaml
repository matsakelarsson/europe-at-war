  - title: The Later Trần risings
    date: 1407–1414
    when: "1409"
    borders: "1409-01-01"
    countries: [vn, cn]
    body:
      - In late 1407 Trần Ngỗi, a son of the Trần king Nghệ Tông, proclaimed himself emperor (Giản Định Đế) at Mô Độ in today’s Ninh Bình. Ming sources called him an impostor. Joined by the generals Đặng Tất, governor of Hóa Châu, and Nguyễn Cảnh Chân, his army won control of the south and on 30 December 1408 defeated Mu Sheng’s army of about 40,000 at Bô Cô, on the Đáy River near Nam Định; the Ming commander Lü Yi was killed. But Trần Ngỗi, suspicious of his generals, had Đặng Tất and Nguyễn Cảnh Chân executed in 1409. Their sons, Đặng Dung and Nguyễn Cảnh Dị, made another Trần prince, Trần Quý Khoáng, emperor (Trùng Quang Đế) in Nghệ An, and Trần Ngỗi later joined him as senior emperor.
      - The Yongle Emperor sent Zhang Fu back with 47,000 men and the fleet captured in 1407. In September 1409 he destroyed the Trần fleet, and Trần Ngỗi was captured and executed. Trần Quý Khoáng fought on from Nghệ An and Thuận Hóa, sent envoys asking to be recognised by the Ming, and rejected the post of provincial commissioner he was offered. Zhang Fu defeated his forces near Nam Định in 1411 and in Thanh Hóa and the south over the next two years; by the end of 1413 the Later Trần had lost most of their men and were raiding Ming granaries for food. Trần Quý Khoáng was captured with his wife and brother on 30 March 1414 and died on the way to Nanjing, by the Vietnamese account by throwing himself into the sea.
    facts:
      - [Trần Ngỗi proclaimed emperor, "1407"]
      - [Battle of Bô Cô, "30 December 1408, Later Trần victory"]
      - [Trần Quý Khoáng captured, "30 March 1414"]
