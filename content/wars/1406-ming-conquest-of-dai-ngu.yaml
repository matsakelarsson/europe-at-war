id: ming-conquest-of-dai-ngu
name: Ming conquest of Đại Ngu and the Later Trần risings
start: "1406-04"
end: "1414-03"
tier: B
summary: "The Ming conquest of the kingdom of Đại Ngu, as Hồ Quý Ly had renamed Đại Việt after taking the Trần throne in 1400, and the risings of the Later Trần princes against Ming rule. When Hồ troops ambushed a Ming escort bringing back a Trần claimant in April 1406, the Yongle Emperor sent two armies, from Guangxi under Zhang Fu and from Yunnan under Mu Sheng, with about 215,000 men and a large train of firearms. They stormed the Hồ fortress of Đa Bang on the Red River in January 1407, took both capitals within days, destroyed the Hồ fleets and in June 1407 captured Hồ Quý Ly and his sons. Instead of restoring the Trần, the Ming annexed the country as the province of Jiaozhi. In 1407 the Trần prince Trần Ngỗi rose in the south and defeated Mu Sheng at Bô Cô in December 1408; after his capture his nephew Trần Quý Khoáng fought on from Nghệ An and Thuận Hóa until Zhang Fu captured him in 1414."
