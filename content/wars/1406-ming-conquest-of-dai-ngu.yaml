steps:
  - title: The Hồ, the Trần claimant and the Ming
    date: 1400–1406
    when: "1406-04"
    borders: "1406-06-01"
    countries: [vn, cn]
    body:
      - In 1400 the chief minister Lê Quý Ly deposed the last Trần king, took the family name Hồ and renamed the kingdom Đại Ngu; the next year he passed the throne to his son Hồ Hán Thương and ruled as senior king. He crushed a Trần plot by executing some 370 people, issued paper money, reformed land holding and moved the capital to his new stone citadel of Tây Đô in Thanh Hóa. In 1402 he forced Champa to cede its northern districts. In 1403 the Ming invested Hồ Hán Thương as king of Annam on the claim that the Trần line had died out.
      - In October 1404 a man calling himself Trần Thiêm Bình, a Trần prince, arrived at the Ming court in Nanjing and told the Yongle Emperor what had happened. The emperor ordered the Hồ to receive him as king, and Hồ Quý Ly agreed. But on 4 April 1406, when the claimant and his Ming escort crossed into the country at Chi Lăng in Lạng Sơn, Hồ troops ambushed them and killed him. Hồ Quý Ly expected war. He had stakes planted in the rivers, raised new units and built the great fortress of Đa Bang on the south bank of the Red River, where the Ming armies from Guangxi and Yunnan were likely to meet. On 16 July 1406 the Yongle Emperor proclaimed twenty reasons for war.
    facts:
      - [Hồ Quý Ly takes the throne, "1400"]
      - [Ambush of the Trần claimant, "4 April 1406"]
