notes:
  - The war is known from Ming records, among them Huang Fu’s campaign diary and the Ming Shilu, and from the Vietnamese chronicles. Ming victory reports give casualty figures that are not credible (one claims seven million enemy dead); the figures given here are the more modest ones of the sources cited. The dates of the Later Trần risings differ by up to a year between Ming and Vietnamese accounts.
  - Hồ Quý Ly renamed the kingdom Đại Ngu in 1400 and moved the capital to Tây Đô in Thanh Hóa; Thăng Long was called Đông Đô, and the Ming renamed it Dongguan (Đông Quan). The base map shows Đại Ngu until the Ming annexation in July 1407.
