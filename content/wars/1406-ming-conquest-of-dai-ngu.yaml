  - title: Đa Bang and the fall of the Hồ
    date: November 1406 – June 1407
    when: "1407-01"
    borders: "1406-12-01"
    countries: [vn, cn]
    body:
      - The Ming armies, about 135,000 men from Guangxi and 80,000 from Yunnan by modern estimates, carried thousands of handguns and cannon and almost seven tonnes of gunpowder. Their commander Zhu Neng died at Longzhou on the border, and Zhang Fu took his place. On 19 November 1406 Zhang Fu crossed from Guangxi and broke through the passes, while Mu Sheng came down the Red River from Yunnan; the two armies met before Đa Bang. On 19 January 1407 they stormed the fortress with ladders and firearms; the Ming gunners drove back the Hồ war elephants, and after two days of fighting the fortress fell and the defence of the Red River collapsed. The Ming took Đông Đô the next day and Tây Đô six days later. Leading families of the delta, among them Mạc Thúy and his brothers, went over to the Ming.
      - On 21 February Hồ Quý Ly’s son Hồ Nguyên Trừng attacked with 500 ships on the Thái Bình River and was defeated, and on 4 May the Hồ lost their last army of some 70,000 men and its fleet at Hàm Tử on the Red River. Hồ Quý Ly burned his palace at Tây Đô and fled south by sea. On 16 June 1407 he and Hồ Hán Thương were captured in today’s Hà Tĩnh and taken to Nanjing in cages; Hồ Nguyên Trừng later made firearms for the Ming. In July the Yongle Emperor annexed the country as the province of Jiaozhi. The Ming carried off thousands of craftsmen, among them the young Nguyễn An, later an architect of the Forbidden City in Beijing, and removed the Vietnamese archives and books. Champa, which had sided with the Ming, took back the districts south of the Hải Vân pass that it had lost to the Hồ.
    facts:
