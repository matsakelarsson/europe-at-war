notes:
  - After 1419 the Armagnacs were in effect the party of the dauphin, later Charles VII, and the civil war merged into the Hundred Years’ War. Paris also saw the Cabochien revolt of 1413, a rising of butchers and craftsmen on the Burgundian side.
