id: armagnac-burgundian-civil-war
name: Armagnac–Burgundian Civil War
start: "1407-11-23"
end: "1435-09-21"
tier: C
summary: A civil war between two branches of the French royal family for control of the government of the mentally ill Charles VI. It began when John the Fearless, Duke of Burgundy, had the king’s brother Louis of Orléans murdered in Paris in 1407; Louis’s son Charles and Charles’s father-in-law Bernard VII of Armagnac led the opposing party. Both sides sought English help. The Burgundians took Paris in 1418 and massacred Armagnacs, the dauphin’s men killed John the Fearless at Montereau in 1419, and his son Philip the Good allied with England until the Treaty of Arras reconciled Burgundy with Charles VII in 1435.
countries: [fr, be]
