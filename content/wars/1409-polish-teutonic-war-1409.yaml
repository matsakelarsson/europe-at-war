        via: [[18.45, 53.42], [19.1, 53.38], [19.75, 53.52], [20.08, 53.5]]
  - title: Malbork holds, and the First Peace of Thorn
    date: July 1410 – February 1411
    when: "1410-07-26"
    borders: "1411-02-01"
    countries: [pl, lt]
    body:
      - "The victors stayed three days on the battlefield and moved slowly, reaching Malbork only on 26 July. By then Heinrich von Plauen, left with about 3,000 men at Świecie, had reached the castle and organised its defence. Most Prussian towns and castles, Gdańsk, Toruń and Elbląg among them, submitted to Jagiełło, and only eight castles held out. But Malbork resisted. The besiegers ran short of powder, suffered from dysentery and wanted to be home for the harvest, and the siege was lifted on 19 September."
      - "The Order quickly won back most of its castles. A fresh Polish army beat a Teutonic force at Koronowo on 10 October, and von Plauen, elected Grand Master in November, agreed to talk. By the First Peace of Thorn on 1 February 1411 the Order returned the Dobrzyń Land and gave up Samogitia, but only for the lifetimes of Jagiełło and Vytautas, and paid 100,000 kopas of Prague groschen for its prisoners. Its losses of land were slight, but the payments and the taxes raised for them weakened the Order for good."
    facts:
      - [Siege of Malbork, 26 July – 19 September 1410]
      - [First Peace of Thorn, 1 February 1411]
      - [Ransom, "100,000 kopas of Prague groschen, about 20 tonnes of silver"]
    markers:
      - kind: held
        side: to
        name: Siege of Malbork
        date: 26 July – 19 September 1410
        text: Heinrich von Plauen burned the town outside the walls and held the castle for eight weeks until the allies gave up.
        lonlat: [19.0278, 54.0397]
      - kind: battle
        side: pl
        name: Battle of Koronowo
        date: 10 October 1410
        text: A Polish victory over a newly raised Teutonic army, which helped bring the Order to the table.
        lonlat: [17.8111, 53.3569]
      - kind: treaty
        name: First Peace of Thorn
        date: 1 February 1411
        text: Signed at Toruń. The borders went back to those of 1409, apart from Samogitia, and the Order paid a huge ransom in four instalments.
        lonlat: [18.6111, 53.0222]
