        via: [[19.83, 51.5], [20.05, 51.95], [20.28, 52.37]]
      - side: lt
        label: Vytautas
        via: [[23.83, 53.67], [22.6, 53.15], [21.2, 52.7], [20.36, 52.42]]
      - side: pl
        label: Allied army
        via: [[20.3, 52.45], [19.85, 53.2], [20.15, 53.27], [20.1, 53.46]]
      - side: to
