        polygon: [[18.78, 52.95], [19.1, 53.13], [19.5, 53.2], [19.75, 53.05], [19.72, 52.75], [19.45, 52.6], [19.1, 52.68], [18.85, 52.82]]
  - title: Grunwald
    date: June–July 1410
    when: "1410-07-15"
    borders: "1410-07-15"
    countries: [pl, lt, by]
    body:
      - "The allies did what the Order did not expect and joined forces. Between 24 and 30 June 1410 the Polish army and Vytautas’s Lithuanians and Ruthenians, with Tatar and Czech contingents, crossed the Vistula at Czerwińsk on a pontoon bridge. Joined by the Masovians, they marched north and entered Prussia on 9 July. Ulrich von Jungingen blocked the crossing of the Drwęca at Kurzętnik, so Jagiełło turned east around the river’s headwaters, and his troops plundered the small town of Dąbrówno (Gilgenburg) on the way."
      - "On 15 July the armies met in the fields near Grunwald and Stębark (Tannenberg). Modern estimates range from about 16,500 to 39,000 men on the allied side and from 11,000 to 27,000 for the Order. After more than an hour of heavy fighting the Lithuanian wing fell back, in flight or as a planned feint, which is still debated, but it returned to the field, and the Grand Master was killed trying to break through. The Order’s camp was overrun. Some 200 of its brother knights died, with most of its leaders, and thousands were taken prisoner."
    facts:
      - [Battle of Grunwald, "15 July 1410, Polish–Lithuanian victory"]
      - [Commanders, "Władysław II Jagiełło and Vytautas; Ulrich von Jungingen, killed"]
      - [Other names, "Tannenberg in German, Žalgiris in Lithuanian"]
    markers:
      - kind: event
        side: pl
        name: Czerwińsk
        date: 24–30 June 1410
        text: The Polish and Lithuanian armies met here and crossed the Vistula on a pontoon bridge prepared in advance.
        lonlat: [20.3094, 52.3956]
      - kind: held
        side: to
        name: Kurzętnik
        date: 11 July 1410
        text: The Order’s army held the crossing of the Drwęca, and Jagiełło chose not to force it.
        lonlat: [19.5769, 53.3992]
        lp: l
      - kind: taken
        side: pl
        name: Dąbrówno
        date: 13 July 1410
        text: The allied army took and plundered the little town of Gilgenburg. The Order later made much of the atrocities it said were committed there.
        lonlat: [20.0333, 53.4333]
        lp: b
      - kind: battle
        side: pl
        name: Battle of Grunwald
        date: 15 July 1410
        text: One of the largest battles of medieval Europe. Ulrich von Jungingen and most of the Order’s leaders were killed.
        lonlat: [20.1247, 53.4861]
    arrows:
      - side: pl
