steps:
  - title: The Order, the union and Samogitia
    date: 1226–1409
    when: "1409"
    borders: "1409-05-01"
    countries: [pl, lt, by]
    body:
      - "In the 1220s Duke Konrad of Masovia invited the Teutonic Knights, a German crusading order, to help him against the pagan Prussians. From the Chełmno Land the knights conquered Prussia by the 1280s and made it a state of their own. In 1308–1309 they seized Gdańsk Pomerania from Poland and moved their headquarters to Malbork. By the Treaty of Kalisz in 1343 Poland won back Kuyavia and Dobrzyń but gave up its claim to Pomerania, while the Order kept up a long crusade against pagan Lithuania."
      - "That crusade lost its purpose in 1385. At Krewo the Lithuanian grand duke Jogaila agreed to become a Catholic and marry the young Queen Jadwiga of Poland. He was crowned in Kraków in 1386 as Władysław II Jagiełło, and Lithuania was baptised the next year. The Order doubted the conversion and fought on over Samogitia, the Lithuanian land that separated Prussia from Livonia. Jogaila’s cousin Vytautas, who ruled Lithuania, ceded it to the Order in 1398 and again in 1404. In May 1409 the Samogitians rose in revolt, with his support."
    facts:
      - [Union of Krewo, 14 August 1385]
      - [Samogitia, "Ceded to the Order in 1398 and 1404, in revolt from May 1409"]
      - [Grand Master, Ulrich von Jungingen (from 1407)]
    markers:
      - kind: event
        side: to
        name: Chełmno Land
        date: c. 1230
        text: The Order’s first base in Prussia, granted by Konrad of Masovia. The knights founded Toruń and Chełmno here in 1233.
        lonlat: [18.42, 53.35]
        lp: l
      - kind: taken
        side: to
        name: Gdańsk
        date: November 1308
        text: The Order took the town and castle and killed many of the townspeople; the death toll is disputed. The rest of Gdańsk Pomerania followed by 1309.
        lonlat: [18.6453, 54.3475]
      - kind: event
        side: to
        name: Malbork
        date: "1309"
        text: The Grand Master moved his seat to this great brick castle on the Nogat, which became the capital of the Order’s state.
        lonlat: [19.0278, 54.0397]
      - kind: treaty
        name: Union of Krewo
        date: 14 August 1385
        text: Jogaila promised to accept Catholic baptism for himself and Lithuania and to marry Jadwiga, joining Poland and Lithuania under one ruler.
        lonlat: [26.284, 54.31]
      - kind: event
        name: Jagiełło crowned
        date: 4 March 1386
        text: Baptised, married to Jadwiga and crowned king of Poland in Kraków within three weeks.
        lonlat: [19.9372, 50.0614]
      - kind: event
        side: lt
        name: Samogitian revolt
        date: May 1409
        text: The Samogitians rose against the Order’s rule with Vytautas’s backing, and Poland let it be known that it would stand by Lithuania.
        lonlat: [22.6, 55.7]
    areas:
      - style: contested
        side: to
        label: Samogitia, ceded to the Order in 1398 and 1404
        atoms: [LT-TE, LT-TA, LT-SA]
  - title: The Order strikes first
    date: August 1409 – June 1410
    when: "1409-08-06"
    borders: "1409-10-08"
    countries: [pl, lt]
    body:
      - "On 6 August 1409 Ulrich von Jungingen declared war on Poland and Lithuania, hoping to beat them one at a time. His army overran the Dobrzyń Land, burned the castle at Dobrzyń, took Bobrowniki after a fourteen-day siege and seized Bydgoszcz, while other forces raided Kuyavia and Greater Poland. The Poles, caught unprepared, gathered their levies and won Bydgoszcz back in the autumn. In the north the Samogitians attacked Memel."
      - "Neither side was ready for a long war. Wenceslaus, King of the Romans and of Bohemia, arranged a truce on 8 October 1409 that was to last until 24 June 1410, and offered to judge the dispute. Early in 1410 he ruled that Samogitia belonged to the Order and only Dobrzyń should go back to Poland; the Order had given him 60,000 florins. The allies rejected the verdict and spent the winter planning a joint campaign against Malbork, while the Order hired mercenaries across the Empire."
    facts:
      - [Declaration of war, 6 August 1409]
      - [Truce, 8 October 1409 – 24 June 1410]
    markers:
      - kind: taken
        side: to
        name: Dobrzyń
        date: August 1409
        text: The knights burned the castle and overran the Dobrzyń Land, which the Order had held in pawn until 1405.
        lonlat: [19.3214, 52.6378]
      - kind: siege
        side: to
        name: Bobrowniki
        date: August 1409
        text: The castle on the Vistula fell after a fourteen-day siege.
        lonlat: [18.9472, 52.7794]
        lp: l
      - kind: siege
        side: pl
        name: Bydgoszcz
        date: Autumn 1409
        text: Taken by the knights in August and won back by the Poles before the truce.
        lonlat: [18.0003, 53.1219]
        lp: l
      - kind: event
        side: lt
        name: Memel attacked
        date: "1409"
        text: The Samogitians struck at the Order’s castle at the mouth of the Neman.
        lonlat: [21.13, 55.71]
    arrows:
