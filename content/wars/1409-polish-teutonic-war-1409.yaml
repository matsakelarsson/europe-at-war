id: polish-teutonic-war-1409
name: Polish–Lithuanian–Teutonic War, 1409–1411
start: "1409"
end: "1411"
tier: A
summary: A war between the Teutonic Order and the allied Kingdom of Poland and Grand Duchy of Lithuania, sparked by a revolt in Samogitia. The allies crushed the Order at Grunwald in July 1410 but failed to take Malbork, and the First Peace of Thorn in 1411 changed little on the map while leaving the Order heavily in debt.
sides:
  - id: pl
    name: Poland
    polities: [poland, poland-lithuania]
    ink: magenta
    moves: Polish moves
    success: Polish or Polish–Lithuanian success
  - id: lt
    name: Lithuania
    polities: [lithuania]
    ink: brown
    moves: Lithuanian moves
    success: Lithuanian success
  - id: to
    name: Teutonic Order
    polities: [teutonic-order]
    ink: slate
    moves: Teutonic moves
    success: Teutonic success
notes:
  - Dates are Julian (Old Style), as the sources give them; the Gregorian calendar came only in 1582.
  - Places are given their modern names, with the German names of the time where useful, such as Malbork (Marienburg) and Toruń (Thorn).
  - Also called the Great War, and in Lithuania the war of Žalgiris.
