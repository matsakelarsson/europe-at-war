id: ming-kotte-war
name: Ming–Kotte war
start: "1410"
end: "1411"
tier: C
summary: "A brief war in Sri Lanka between the treasure fleet of Ming China under Admiral Zheng He and the Sinhalese ruler Alakeshvara (Vira Alakeshvara), of the Alagakkonara family, who held power at Kotte. The Chinese accused Alakeshvara of piracy against the shipping of the Indian Ocean and of hostility to Ming envoys and to neighbouring states that traded with China. On one of the fleet’s voyages, most authorities say on its way home in 1411, Alakeshvara drew Zheng He and about 2,000 soldiers inland to Kotte and then cut them off from the fleet at Colombo. The Chinese stormed Kotte instead, captured Alakeshvara and his family, beat off the Sinhalese armies that surrounded them and fought their way back to the ships in six days. Zheng He reached Nanjing on 6 July 1411 with his prisoners. The Yongle Emperor freed them and sent them home, and the Ming court recognised a new ruler; Parakramabahu VI, who took the throne of Kotte in 1412, kept good relations with China."
