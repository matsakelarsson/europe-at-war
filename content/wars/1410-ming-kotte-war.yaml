notes:
  - "The Chinese sources (the Ming Shilu and the History of Ming) are the main record; Sri Lankan chronicles barely mention the war. Historians disagree whether it took place on the outward voyage in 1410 or the return in 1411, and over who was placed on the throne afterwards."
  - The trilingual stone that Zheng He set up at Galle in 1409, in Chinese, Tamil and Persian, records offerings to the Buddha, Shiva (or Vishnu) and Allah from an earlier, peaceful visit.
