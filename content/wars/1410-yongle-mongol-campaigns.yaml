id: yongle-mongol-campaigns
name: Yongle Emperor’s campaigns against the Mongols
start: "1409-09"
end: "1424-08-12"
tier: B
summary: "Five expeditions that the Yongle Emperor led in person into Mongolia between 1410 and 1424, after a Ming army under Qiu Fu was destroyed on the Kherlen River in 1409. The Mongols were divided between the Eastern Mongols, led by the chancellor Arughtai and his khan Bunyashiri, and the Oirats of the west under Mahmud. In 1410 the emperor defeated Bunyashiri on the Onon and Arughtai near the Taor River; in 1414 his cannon broke the Oirats between the Tuul and the Kherlen. The campaigns of 1422, 1423 and 1424, with armies of more than 200,000 men and enormous supply trains, failed to bring Arughtai to battle, and the emperor died on the way home from the last of them, on 12 August 1424. The expeditions kept the Mongols divided but won no lasting settlement; his successors gave them up and pulled the frontier back to the Great Wall line."
countries: [cn, mn]
sides:
  - id: mg
    name: Ming dynasty
    polities: [ming]
    ink: red
    moves: Ming moves
    success: Ming success
  - id: em
    name: Eastern Mongols (Arughtai)
    polities: [northern-yuan]
    ink: olive
    moves: Eastern Mongol moves
    success: Eastern Mongol success
  - id: oi
