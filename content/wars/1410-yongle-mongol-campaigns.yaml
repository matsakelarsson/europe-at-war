steps:
  - title: The Kherlen and the first campaign
    date: September 1409 – September 1410
    when: "1410-06-15"
    borders: "1410-06-15"
    countries: [cn, mn]
    body:
      - "In 1403 the Yongle Emperor withdrew the garrisons his father had placed beyond the Great Wall around Daning and left the land to the Uriankhai Mongols, who were Ming vassals. In the steppe the Eastern Mongol chancellor Arughtai had put Bunyashiri, a descendant of the Yuan emperors, on the throne as khan. In 1409 Bunyashiri had a Ming envoy, Guo Ji, put to death. The emperor sent Qiu Fu against him with an army the Ming histories put at 100,000 cavalry. On the Kherlen River Qiu Fu believed a captured Mongol who told him the enemy was in disorder, rode ahead with about 1,000 horsemen in pursuit and was cut off and killed with his generals on 23 September 1409."
      - "The emperor then took the field himself. He left Beijing on 25 March 1410 with an army probably of about 100,000 men and 30,000 carts, marched north by Xuanfu and Xinghe and reached the Kherlen in May. Bunyashiri and Arughtai had quarrelled and split up. On 15 June the Ming army caught Bunyashiri on the Onon River and destroyed his force, though he escaped; the army then turned east and defeated Arughtai near the Taor River. The emperor was back in Beijing on 15 September. Arughtai sent tribute horses and was given a Ming title, and in 1412 the Oirats killed Bunyashiri."
    facts:
      - [Qiu Fu’s defeat on the Kherlen, "23 September 1409"]
      - [First campaign, "25 March – 15 September 1410"]
      - [Bunyashiri defeated on the Onon, "15 June 1410"]
