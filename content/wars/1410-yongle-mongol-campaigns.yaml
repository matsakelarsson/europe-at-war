  - title: The last three campaigns
    date: 1422–1424
    when: "1422-04-12"
    borders: "1424-08-12"
    countries: [cn, mn]
    body:
      - "Arughtai stopped sending tribute in 1421, and in 1422 he overran the frontier fortress of Xinghe and brought the Uriankhai under his control. On 12 April 1422 the emperor marched out with one of the largest armies China had sent into the steppe: 235,146 men, 340,000 donkeys, 117,573 carts and 370,000 dan of grain. Arughtai, camped near Dolon Nor, retreated into the steppe, and the Ming army destroyed his camps and fell on three Uriankhai tribes that had played no part in the raids. The army was back on 23 September. The minister of war, Fang Bin, who had opposed the expedition, killed himself, and the minister of revenue, Xia Yuanji, was imprisoned for the same reason."
      - "In August 1423 the emperor set out again by Xinghe and Wanquan. Arughtai again withdrew, and the Eastern Mongol commander Esen Tügel came over to the Ming. In April 1424 he made a fifth expedition, by Tumu to Kaiping, the old Shangdu; Arughtai again could not be found, and the emperor, judging that his army had gone far enough, turned back. He fell ill on the march and died on 12 August 1424 at Yumuchuan, in what is now Duolun County."
      - "The campaigns had cost enormous sums and won no decisive victory. His successors gave them up; the Ming abandoned Kaiping in 1430 and the Great Wall line became the frontier. In the following years the Oirats rebuilt their power under Toghon and his son Esen, and the next Ming expedition into the steppe, in 1449, ended at Tumu."
    facts:
      - [Third campaign, "12 April – 23 September 1422, 235,146 men"]
      - [Fourth campaign, "August – December 1423"]
      - [Fifth campaign, "April – August 1424"]
      - [Death of the Yongle Emperor, "12 August 1424, at Yumuchuan"]
