  - title: Against the Oirats
    date: April – August 1414
    when: "1414-06"
    borders: "1414-06-15"
    countries: [cn, mn]
    body:
      - "With the Eastern Mongols weakened, the Oirats of western Mongolia became the stronger power. Their leader Mahmud had a khan of his own, Delbeg, besieged Karakorum in 1413 and sent 30,000 men to the Kherlen. Arughtai, now a Ming vassal, reported their advance and asked for help."
      - "The emperor left Beijing on 6 April 1414. In the summer his army met the Oirats between the upper Tuul and Kherlen rivers, and the Ming cannon broke the Oirat cavalry charges. Mahmud and Delbeg fled, and the emperor returned to Beijing in August. In 1416 Arughtai attacked and killed Mahmud and Delbeg, and the Oirats fell back to the west."
    facts:
      - [Second campaign, "6 April – August 1414"]
      - [Battle between the Tuul and the Kherlen, "summer 1414, Ming victory"]
    markers:
