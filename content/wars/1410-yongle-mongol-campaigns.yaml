notes:
  - "Dates are converted from the Chinese lunar calendar. The Ming histories give much larger armies than are likely (500,000 for 1410); modern estimates are given where they exist. Britannica gives 5 August 1424 for the emperor’s death; most sources give 12 August."
  - "The Ming called the Eastern Mongols the Tatars (Dada) and the Oirats the Wala. Many battle sites in the steppe are known only by the river or district named in the Chinese records, and the markers for them are approximate."
