id: conquest-of-ceuta
name: Conquest of Ceuta
start: "1415-07-25"
end: "1415-08-21"
tier: C
summary: The Portuguese capture of Ceuta, a Marinid port on the African shore of the Strait of Gibraltar, often taken as the start of Portugal’s overseas expansion. John I prepared the expedition in secret, letting rumours spread that it was aimed at Holland. A fleet of about 200 ships sailed from Lisbon on 25 July 1415, and on 21 August the army, with the king’s sons Duarte, Pedro and Henry (later called the Navigator), stormed the city in a single day; its governor, Salah ibn Salah, fled. The princes were knighted in the city’s mosque, made a church. Ceuta held out against Marinid and Granadan sieges, but a Portuguese attack on Tangier in 1437 failed. The city stayed Portuguese until it passed to Spain in 1668.
