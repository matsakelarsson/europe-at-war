id: ethiopian-adal-wars-1415
name: Ethiopian wars with Ifat and Adal (1415–1445)
start: "1415"
end: "1445-12-25"
tier: B
summary: "Wars between the Solomonic emperors of Ethiopia and the Walashma sultans, first of Ifat and then of Adal, in the first half of the 15th century. Sa’ad ad-Din II, the last great sultan of Ifat, was besieged and killed at Zeila by an Ethiopian army, in 1403 under Dawit I according to al-Maqrizi, or in 1415 under Yeshaq according to a Walashma chronicle, and Ifat was overrun. His sons fled to the Rasulid court in Yemen, returned, and rebuilt their state farther east as the sultanate of Adal, from which they raided the Christian provinces for decades. Emperor Yeshaq (r. 1414–1429/1430) fought them for most of his reign and may have died in battle against Jamal ad-Din II. The wars ended for a generation when Zara Yaqob defeated and killed Sultan Badlay at Gomit in Dawaro on 25 December 1445."
countries: [et, so, dj]
sides:
