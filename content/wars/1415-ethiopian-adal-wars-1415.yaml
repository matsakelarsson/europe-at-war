steps:
  - title: Zeila and the end of Ifat
    date: 1403 or 1415
    when: "1415"
    borders: "1415-06-01"
    countries: [et, so, dj]
    body:
      - Sa’ad ad-Din II, sultan of Ifat from about 1386, had moved the centre of his state east towards the Harar plateau and the coast and kept up raids into the Christian provinces. An Ethiopian army defeated his forces on the Harar plateau and pursued him to Zeila, where he took refuge on a peninsula or island by the town. The Ethiopians besieged it and cut him off from water, and he was killed. Al-Maqrizi, writing in Cairo, places this in 1403, under Emperor Dawit I; a later History of the Walashma dates it to 1415, the second year of Yeshaq, and many historians have followed one date or the other.
      - With the sultan dead, Ifat ceased to exist as a state. Its heartland on the eastern escarpment of Shewa came under Christian governors and garrisons, and its Muslim population became subjects of the emperor. Sa’ad ad-Din’s ten sons escaped across the sea to Yemen and the court of the Rasulid sultan at Ta’izz.
    facts:
      - [Death of Sa’ad ad-Din II, "Zeila, 1403 (al-Maqrizi) or 1415 (History of the Walashma)"]
      - [His sons, "in exile at the Rasulid court in Yemen"]
