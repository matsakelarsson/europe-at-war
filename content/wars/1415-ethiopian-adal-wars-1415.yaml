  - title: Badlay and the battle of Gomit
    date: 1443 – 25 December 1445
    when: "1445-12-25"
    borders: "1445-12-25"
    countries: [et]
    body:
      - Zara Yaqob, who became emperor in 1434, was the most forceful of the medieval emperors, a reformer of the church who ruled the provinces through his own appointees. Badlay ibn Sa’ad ad-Din, another of the brothers and now sultan of Adal, invaded the frontier province of Dawaro in 1443 and again in 1445. The Muslim governor (garad) of Hadiya, Mohammed, the emperor’s father-in-law, was suspected of dealing with both sides, and Zara Yaqob kept his men under watch.
      - Zara Yaqob marched south to meet Badlay with a smaller army and attacked him at Gomit, also called Egubba or Ayfars, in Dawaro, on 25 December 1445. According to the royal chronicle, Badlay was wounded by an arrow, charged at the emperor and was killed by his spear; his army broke, and his brother Khair ad-Din was caught while crossing the Awash and killed. Badlay’s body was cut up and the pieces sent to the provinces, and his possessions were given to monasteries; the chronicle’s claim that his whole army was destroyed may be exaggerated.
      - The emperor garrisoned Dawaro and the frontier with regiments from Shewa but made no attempt to conquer Adal itself. According to some accounts Badlay’s son Muhammad agreed to pay tribute. The border between the two states stayed quiet for much of the next generation, until raids resumed later in the century; in the early 16th century Adal grew strong enough to invade the highlands.
    facts:
      - [Badlay’s invasions of Dawaro, "1443 and 1445"]
      - [Battle of Gomit, "25 December 1445, Ethiopian victory"]
      - [Killed, "Sultan Badlay and his brother Khair ad-Din"]
