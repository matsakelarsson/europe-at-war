notes:
  - "The sources are few: the Ethiopian royal chronicles of Zara Yaqob, a hymn of Yeshaq’s reign, Arab historians in Egypt (al-Maqrizi, Ibn Taghribirdi) and a later History of the Walashma. They disagree on many dates, above all on when and under which emperor Sa’ad ad-Din II died at Zeila (1403 or 1415), and on the numbering of the sultans."
  - Most places named in the accounts, among them the Adal capital of Dakkar and the battlefield of Gomit, cannot be located precisely; the regions are drawn as approximate areas.
