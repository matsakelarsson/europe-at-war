  - title: Sabr ad-Din, Yeshaq and the new Adal
    date: about 1415 – 1430
    when: "1420"
    borders: "1425-01-01"
    countries: [et, so, dj]
    body:
      - The eldest son, Sabr ad-Din, returned from Arabia with ten horsemen and arms from the Rasulid sultan and gathered his father’s followers in the lowlands east of the old Ifat. The Arab sources tell of a string of victories over Christian forces, of churches burned and an imperial camp taken, but also of raids that failed. From this base the brothers built a new state, called Adal by its neighbours, with a capital at Dakkar near the later city of Harar. Sabr ad-Din died in 1422 or 1423 and was followed by his brothers Mansur ad-Din and Jamal ad-Din II.
      - Emperor Yeshaq, who reigned from 1414, fought the Walashma brothers for most of his reign, and also crushed a rising of the Beta Israel in Wegera and pushed west beyond Agawmeder. Al-Maqrizi says he hired Mamluk soldiers from Egypt to train his army in gunnery and swordsmanship. A hymn celebrating his victory over the sultan of Ifat contains the first known mention of the Somali. In 1428 a letter from him proposing an alliance against the Muslims reached Alfonso V of Aragon. The manner of his death in 1429 or 1430 is uncertain. Al-Maqrizi says he was killed at Harjah, where Jamal ad-Din’s army surprised his exhausted troops, while the Ethiopian sources are silent or speak of a murder.
    facts:
      - [Sabr ad-Din’s return, "about 1415 (some sources give 1412)"]
      - [Death of Sabr ad-Din, "1422 or 1423"]
      - [Death of Yeshaq, "1429 or 1430"]
