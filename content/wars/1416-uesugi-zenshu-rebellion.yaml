id: uesugi-zenshu-rebellion
name: Uesugi Zenshū’s Rebellion
start: "1416"
end: "1417"
tier: C
summary: "A revolt in the Kantō against Ashikaga Mochiuji, the Kamakura kubō, who governed eastern Japan for the shogunate from Kamakura. Uesugi Ujinori, known by his Buddhist name Zenshū, of the Inukake branch of the Uesugi, had served as Mochiuji’s deputy (Kantō kanrei) since 1411, but after a quarrel in council in 1415 he was dismissed and replaced by Uesugi Norimoto of the rival Yamanouchi branch. Zenshū allied with Mochiuji’s uncle Ashikaga Mitsutaka and his adopted son Mochinaka and won over many eastern houses, among them the Takeda of Kai, the Chiba, the Iwamatsu and the Nasu. On the night of the 2nd day of the tenth month of 1416 they rose in Kamakura and took the city; Mochiuji and Norimoto escaped, Mochiuji to Suruga. The shogun Ashikaga Yoshimochi chose to back his kinsman Mochiuji and sent Imagawa Norimasa of Suruga, Uesugi Fusakata of Echigo and other lords against the rebels. Zenshū beat the Edo and Toshima of Musashi, who had turned against him, at Seyagahara on New Year’s Day 1417, but as the Imagawa army advanced into Sagami his support fell away. On the 10th day of the first month of 1417 Zenshū, Mitsutaka and Mochinaka took their own lives at Yukinoshita in Kamakura, by the Tsurugaoka Hachimangū shrine. Mochiuji then spent years punishing the rebels’ allies, among them houses that the shogunate protected, and his relations with Kyoto never recovered; the quarrel led to the Eikyō Rebellion of 1438."
