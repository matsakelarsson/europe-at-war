notes:
  - Japanese dates are in the lunar calendar (Ōei 23 and 24); English sources give no Julian equivalents for the days.
  - The Takeda leader Takeda Nobumitsu fled to Kai and took his own life; Iwamatsu Mitsuzumi was captured and beheaded. The shogun’s brother Ashikaga Yoshitsugu fled Kyoto on the day the shogunate decided to back Mochiuji; Zenshū was the father of his concubine, and he was suspected of acting with the rebels. He was confined and in 1418 killed or made to take his own life.
