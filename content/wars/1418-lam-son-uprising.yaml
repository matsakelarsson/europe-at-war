  - title: The turn to Nghệ An
    date: October 1424 – May 1425
    when: "1424-12"
    borders: "1425-01-01"
    countries: [vn]
    body:
      - In August 1424 the Yongle Emperor died, and his successor, the Hongxi Emperor, cut taxes and offered amnesties in Jiaozhi and tried to win Lê Lợi over with titles. At a council in late 1424 Lê Lợi adopted the plan of the general Nguyễn Chích, a native of the region, to leave the hills of Thanh Hóa, which the Ming could encircle, and strike south into Nghệ An, where the Ming garrisons were small and far from their bases. On 12 October 1424 the rebels overran the Ming post at Đa Căng and defeated the troops sent to relieve it.
      - In December they besieged Trà Lân, the fortress of the upper Lam River, held for the Ming by the Tai chief Cầm Bành. While the Ming envoy Shan Shou negotiated with Lê Lợi, who pretended to accept a Ming post, Cầm Bành, without hope of relief, surrendered after more than two months. The Ming commanders Chen Zhi and Fang Zheng came up the Lam River and were beaten at Khả Lưu and Bồ Ải. They shut themselves into the citadel of Nghệ An, which the Lam Sơn army besieged from a fortified camp on Thiên Nhẫn mountain opposite, taking all 20 districts of the prefecture. In May 1425 a Ming sortie up the river was ambushed and driven back, and Chen Zhi left for Đông Quan by sea.
    facts:
      - [Đa Căng taken, "12 October 1424"]
      - [Trà Lân surrenders, "early 1425"]
      - [Battles of Khả Lưu and Bồ Ải, "early 1425, Lam Sơn victories"]
