  - title: Chi Lăng and Xương Giang
    date: September – October 1427
    when: "1427-10"
    borders: "1427-10-15"
    countries: [vn, cn]
    body:
      - The Xuande Emperor sent 115,200 men in two armies, under Liu Sheng from Guangxi and Mu Sheng from Yunnan. A first force from Guangxi under Gu Xingzu was routed at the Pha Lũy pass in July 1427. On 28 September, after a long siege, the Lam Sơn army stormed Xương Giang before the relief could reach it; its commander Li Ren killed himself, and by the Vietnamese account thousands of soldiers and civilians were killed in the town. When Liu Sheng crossed the Pha Lũy pass, Trần Lựu fell back before him to the pass of Chi Lăng. Liu Sheng rode ahead with about a hundred horsemen and was killed in an ambush at the foot of Mã Yên mountain.
      - His army under Huang Fu and Cui Ju marched on to Xương Giang, found it fallen and was surrounded on the plain by Lê Sát, Trần Nguyên Hãn and others. Cui Ju was killed, and Huang Fu, the former administrator of Jiaozhi, was captured and spared. The Battle of Chi Lăng article puts the Ming losses at 70,000 to 90,000. Mu Sheng, waiting at the Lê Hoa pass, withdrew to Yunnan when he heard the news and was attacked as he went.
    facts:
      - [Xương Giang taken, "28 September 1427"]
      - [Liu Sheng killed at Chi Lăng, "early October 1427"]
      - [Ming relief armies, "115,200 men"]
    markers:
