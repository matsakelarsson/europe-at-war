id: lam-son-uprising
name: Lam Sơn uprising
start: "1418-02-07"
end: "1428-01"
tier: A
summary: "The rising led by Lê Lợi, a landowner of Lam Sơn in the hills of Thanh Hóa, against Ming rule in Jiaozhi, the former Đại Việt annexed by the Ming in 1407. For six years his small army survived in the mountains, at times close to destruction, and in 1423 accepted a truce. In late 1424, on Nguyễn Chích’s advice, it turned south to Nghệ An, where Ming garrisons were thin, and by the end of 1425 held the whole country from Thanh Hóa to Thuận Hóa except a few walled towns. In 1426 the Lam Sơn armies came north, destroyed the army of the new Ming commander Wang Tong at Tốt Động–Chúc Động on 7 November and besieged him in Đông Quan (Hanoi). In the autumn of 1427 they took Xương Giang and destroyed the relief army from Guangxi, whose commander Liu Sheng was killed at Chi Lăng, and the army from Yunnan withdrew. Wang Tong agreed to leave, and the last Ming troops went home in January 1428. Lê Lợi took the throne as the first emperor of the Later Lê dynasty, and Nguyễn Trãi’s proclamation, the Bình Ngô đại cáo, declared the restored Đại Việt the equal of China."
countries: [vn, cn]
sides:
  - id: ls
    name: Lam Sơn army (Lê Lợi)
    polities: [lam-son]
    ink: red
    moves: Lam Sơn moves
    success: Lam Sơn success
  - id: ming
    name: Ming dynasty
    polities: [ming]
    ink: gold
    moves: Ming moves
    success: Ming success
notes:
  - The main sources are the Lam Sơn thực lục, a chronicle written for Lê Lợi after his victory, the later Vietnamese chronicles, the letters Nguyễn Trãi wrote for Lê Lợi, and the Ming Shilu. They disagree on numbers by large margins. Dates are the Gregorian equivalents of lunar dates given in the English sources cited; for the battle of Chi Lăng the Wikipedia articles give 18 September and early October 1427, and the later date fits the fall of Xương Giang on 28 September.
  - Lê Lợi proclaimed himself Bình Định vương in 1418. Vietnamese histories call the war a war of national liberation; Ming sources treated it as a rebellion in a Chinese province. The base map shows Ming Jiaozhi until the withdrawal; the ground held by Lê Lợi’s army is drawn in the steps.
