  - title: The oath at Đông Quan and the Lê dynasty
    date: December 1427 – 1431
    when: "1427-12"
    borders: "1428-05-01"
    countries: [vn, cn]
    body:
      - With no relief to wait for, Wang Tong agreed to leave. After an exchange of hostages, he and the Lam Sơn commanders swore an oath south of Đông Quan on 16 December 1427, and Lê Lợi sent envoys to Beijing asking the emperor to recognise Trần Cảo. Lê Lợi had the roads and bridges repaired and gave the departing army boats, horses and food. The Ming troops left on 29 December, and Wang Tong followed on 3 January 1428. According to Ming records 84,640 soldiers and officials went home; some Vietnamese estimates of all the Ming people repatriated, soldiers and civilians, run to 200,000 or more.
      - Trần Cảo died in early 1428, by the chronicles’ account forced to take poison after he fled; some historians think Lê Lợi had him killed. On 29 April 1428 Lê Lợi took the throne at Thăng Long as Lê Thái Tổ, restored the name Đại Việt and founded the Later Lê dynasty, which ruled, at least in name, until 1789. Nguyễn Trãi’s proclamation, the Bình Ngô đại cáo, announced the victory and described Đại Việt as a realm with its own mountains, rivers and customs, equal to the north. The Ming accepted Lê Lợi as acting administrator in 1431 and recognised him as king of Annam in 1435, and tribute relations resumed.
    facts:
      - [Oath at Đông Quan, "16 December 1427"]
      - [Ming soldiers and officials released (Ming records), "84,640"]
      - [Lê Lợi crowned, "29 April 1428"]
    markers:
      - kind: treaty
        name: Đông Quan
        date: 16 December 1427
        text: Wang Tong and the Lam Sơn commanders swore an oath south of the city to end the war. The Ming troops left between 29 December and 3 January.
        lonlat: [105.840, 21.035]
      - kind: event
        side: ls
