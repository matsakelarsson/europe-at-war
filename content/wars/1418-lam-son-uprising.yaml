  - title: The south won
    date: June – December 1425
    when: "1425-08"
    borders: "1425-09-01"
    countries: [vn]
    body:
      - With the Ming forces of the south shut in Nghệ An, Lê Lợi’s generals moved north. In June 1425 Đinh Lễ besieged Diễn Châu, ambushed the supply column sent to it and went on into Thanh Hóa; Lý Triện, Lê Sát and others followed with 2,000 men and two elephants. The countryside went over to them, and the Ming garrison of Tây Đô shut its gates. By July the Lam Sơn army held the three prefectures of Thanh Hóa, Diễn Châu and Nghệ An except for their walled towns.
      - In August 1425 Trần Nguyên Hãn marched south with 1,000 men and an elephant along the mountain road while Lê Ngân sailed with 70 warships, and they defeated the Ming garrisons on the Gianh River and in Tân Bình and Thuận Hóa. In ten months the rebels had won the country from Thanh Hóa to Thuận Hóa; the remaining Ming garrisons stood, a Vietnamese text says, “like islands in the sea”. In the north new risings broke out, among them that of the Red Coat mountain peoples in the north-west.
    facts:
