  - title: The siege of Đông Quan
    date: November 1426 – September 1427
    when: "1427-03"
    borders: "1427-04-01"
    countries: [vn, cn]
    body:
      - Lê Lợi came north and on the night of 22 November 1426 his troops burned the Ming outposts around Đông Quan and shut Wang Tong into the city. Too weak to storm its walls, they besieged it, and Nguyễn Trãi wrote letter after letter urging the Ming commanders to surrender. Wang Tong pointed to the Yongle Emperor’s promise of 1407 to withdraw if a Trần heir were found, and Lê Lợi installed Trần Cảo, said to be a grandson of the Trần king Nghệ Tông, as king; but when news came of a new relief army under Liu Sheng, the talks stopped.
      - Lê Lợi chose to besiege the city and destroy the relief armies as they came, and first took the Ming fortresses on the roads from China. Khâu Ôn fell on 9 February 1427, Điêu Diêu surrendered, Thị Cầu surrendered to Nguyễn Chích and Tam Giang, on the road to Yunnan, on 2 April. The Ming garrison made sorties. On 4 March Fang Zheng killed the general Lý Triện in a raid, and on 4 April Wang Tong captured Đinh Lễ and Nguyễn Xí, and Đinh Lễ was killed. Tây Đô and Nghệ An, isolated, were evacuated under agreements later in the year.
    facts:
      - [Siege of Đông Quan, "22 November 1426 – December 1427"]
      - [Khâu Ôn taken, "9 February 1427"]
      - [Tam Giang surrenders, "2 April 1427"]
