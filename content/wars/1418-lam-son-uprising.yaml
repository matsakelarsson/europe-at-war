steps:
  - title: The rising in the hills of Thanh Hóa
    date: 1418–1423
    when: "1418-02"
    borders: "1418-06-01"
    countries: [vn, la]
    body:
      - Lê Lợi was a wealthy hereditary chief of Lam Sơn, in the uplands south-west of the Hồ citadel of Tây Đô, now a Ming stronghold. In 1416 he and eighteen companions swore an oath at Lũng Nhai to drive out the Ming. When a Vietnamese official in Ming service reported him, he rose openly on 7 February 1418 and took the title Bình Định vương. A week later he left Lam Sơn for Lạc Thủy, on the road to Lan Xang, from where he hoped for rice, weapons and elephants, and on 18 February ambushed the pursuing Ming troops of Ma Qi there. But he was soon forced to retreat to Chí Linh mountain, deeper in the hills; the Ming dug up his family’s graves and captured his wife and children.
      - For the next years the rebels lived in the mountains, rebuilt their forces when the Ming were busy with other risings and were driven back to Chí Linh three times. In May 1419, when the Ming had surrounded the mountain, Lê Lai, one of Lê Lợi’s companions, put on his commander’s robes and led a sortie; the Ming captured and killed him, believing they had Lê Lợi, who escaped. Nguyễn Trãi, a scholar whose father had been taken to China with the Hồ, joined around 1420. Lan Xang, an early ally, sided with the Ming in 1421 and joined a Ming attack in 1423. Reduced to eating bamboo shoots and killing their elephants and horses for food, the rebels made a truce in May 1423 and exchanged gifts with the Ming commanders, while secretly training troops; the truce broke down in 1424.
    facts:
      - [Rising proclaimed, "7 February 1418"]
      - [Lê Lai killed in Lê Lợi’s place, "1419"]
      - [Truce with the Ming, "May 1423 – 1424"]
