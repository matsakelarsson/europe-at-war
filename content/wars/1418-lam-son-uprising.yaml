  - title: North to Tốt Động–Chúc Động
    date: September – November 1426
    when: "1426-11"
    borders: "1426-11-07"
    countries: [vn, cn]
    body:
      - The new Xuande Emperor, who came to the throne in 1425, wavered between restoring a Trần king as a Ming vassal and fighting on, and in April 1426 sent Wang Tong with reinforcements. Before they arrived, in September, Lê Lợi sent three small armies north. Phạm Văn Xảo and Lý Triện, with 3,000 men and one elephant, beat the Đông Quan garrison at Ninh Kiều on 12 October and on 20 October routed a column of 10,000 from Yunnan on the Red River. On 31 October Wang Tong reached Đông Quan and took command, and on 5 November marched out in three columns; one was trapped in the flooded fields of Tam La.
      - On 7 November 1426 Wang Tong’s main army crossed the Đáy River to attack the Lam Sơn camp at Cao Bộ. Warned by spies, the Lam Sơn commanders let the vanguard advance into an ambush at Tốt Động, in muddy rice fields in the rain, while the rear guard was caught at Chúc Động as it crossed the river. The Ming army broke. The minister of war Chen Qia was killed and Wang Tong, wounded, escaped to Đông Quan, where he melted down bronze treasures of the Vietnamese, among them the great bell of the Quy Điền temple, to make weapons. Vietnamese sources give a Ming army of 100,000 and 50,000 Ming dead and 10,000 captured; the Ming sources give 54,000 men and 20,000 to 30,000 dead. The Lam Sơn force is put at about 6,000.
    facts:
      - [Battle of Tốt Động–Chúc Động, "7 November 1426, Lam Sơn victory"]
      - [Ming army, "54,000 (Ming sources) to 100,000 (Vietnamese sources)"]
      - [Ming dead, "20,000–30,000 (Ming sources) to 50,000 (Vietnamese sources)"]
