id: hussite-wars
name: Hussite Wars
start: "1419-07-30"
end: "1436-07-05"
tier: A
summary: The wars that followed the burning of the Czech reformer Jan Hus in 1415, in which his followers in Bohemia defended their faith against King Sigismund and five crusades from across the Empire. Using wagon forts and early firearms, Hussite armies under Jan Žižka and Prokop the Great beat every crusade and raided deep into neighbouring lands, until moderate Hussites and Catholics crushed the radicals at Lipany in 1434 and made peace with the Church and Sigismund in the Compacts of 1436.
countries: [cz, de, pl, hu, sk, at, ch, lt]
sides:
  - id: hus
    name: Hussites
    polities: [bohemia]
    ink: red
    moves: Hussite moves
    success: Hussite success
  - id: cru
    name: Sigismund and the crusaders
    polities: [hre, hungary]
    ink: gold
    moves: Royalist and crusader moves
    success: Royalist and crusader success
  - id: lea
    name: Bohemian League
    polities: []
    ink: navy
    moves: Moves by the Bohemian League
    success: Success for the Bohemian League
notes:
  - Dates are Julian, as usual for the period. The chronicles give huge numbers for the armies, often tens of thousands; modern historians think they were much smaller.
  - The Hussites soon split into moderates (Utraquists or Calixtines, strongest in Prague and among the nobles) and radicals (the Taborites, the eastern Bohemian brotherhood known after Žižka’s death as the Orphans, and others). Historians number the crusades differently, and the Hussites fought each other as well as the crusaders.
  - Places are named in Czech, with the German name where it is often used in English (Kutná Hora/Kuttenberg, Německý Brod/Deutschbrod, Ústí nad Labem/Aussig, Stříbro/Mies, Domažlice/Taus).
