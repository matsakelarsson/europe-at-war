steps:
  - title: The landing on Tsushima
    date: May – July 1419
    when: "1419-07-12"
    borders: "1419-07-12"
    countries: [kr, jp]
    body:
      - Tsushima, rocky and short of farmland, lived by fishing, trade and, in bad years, raiding. Its lord Sō Sadashige had kept the raiders in check, but after his death in 1418 his heir Sadamori was a boy and the island went hungry. On 31 May 1419 a wokou fleet of about fifty ships attacked Biin on the west coast of Korea, killing many of the garrison, and went on to raid Haeju before sailing for China. On 7 June the retired king Taejong, who kept control of the army after handing the throne to Sejong, decided to attack Tsushima while its raiders were away.
      - Yi Jong-mu sailed from Geoje on 11 July with 227 ships, 17,285 men and food for 65 days, and landed at Ozaki in Asō Bay on 12 July. Islanders at first mistook the leading ships for their own men returning. According to the Annals of King Sejong the Koreans took 129 ships, burned 1,939 houses, killed 114 people and captured 21 on the first days, and freed 131 Chinese captives. They then built a palisade across the narrow neck of the island at Funakoshi to cut its communications, meaning to starve out the people who had fled into the hills.
    facts:
      - [Wokou raid on Biin, "31 May 1419"]
      - [Joseon fleet, "227 ships, 17,285 men"]
      - [Landing in Asō Bay, "12 July 1419"]
