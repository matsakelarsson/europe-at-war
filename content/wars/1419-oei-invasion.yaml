id: oei-invasion
name: Ōei invasion (Gihae eastern expedition)
start: "1419-07-11"
end: "1419-07-25"
tier: B
summary: "A Joseon expedition against the island of Tsushima, the main base of the wokou who raided Korea. In May 1419 a wokou fleet attacked Biin on the west coast of Korea and then Haeju. The retired king Taejong, who still controlled the army under his son Sejong, decided to strike the island while many of its fighting men were away raiding. On 11 July 1419 Yi Jong-mu sailed from Geoje with 227 ships and 17,285 men, and the next day the fleet landed in Asō Bay. The Koreans burned houses and ships, freed Chinese captives and fenced off the island’s narrow neck at Funakoshi. On 21 July a Korean column was ambushed at Nukadake and lost heavily, and with the typhoon season coming and the lord of the island, Sō Sadamori, asking for peace, the fleet sailed home on 25 July. Joseon dropped its demand that Tsushima submit, and the island’s trade with Korea was regulated through the Sō, by the Treaty of Gyehae in 1443. The invasion is known in Japan by its era name, Ōei, and in Korea as the eastern expedition of the gihae year."
countries: [jp, kr]
