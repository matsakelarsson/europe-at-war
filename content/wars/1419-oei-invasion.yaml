  - title: Nukadake and the withdrawal
    date: July 1419 – 1443
    when: "1419-07-21"
    borders: "1419-07-25"
    countries: [kr, jp]
    body:
      - On 21 July Yi Jong-mu sent columns to search the island again and landed troops in Nii district. The Tsushima men, reinforced from Iki, lay in wait in the mountains, and Bak Sil’s left army was ambushed at Nukadake; more than a hundred Koreans were killed in the fighting or fell from the cliffs before the right army came up and the officer Yi Sun-mong shot the enemy’s leader. Sō Sadamori wrote asking for peace and warning that the storms of the seventh month made a long stay dangerous, and Taejong had already told his commanders not to remain. On 25 July the fleet sailed back to Geoje.
      - A second expedition was discussed but not carried out. Envoys went back and forth, and in 1420 Song Hui-gyeong travelled to the shogun’s court in Kyoto. Joseon gave up its demand that Tsushima submit and instead licensed the island’s trade through the Sō, who issued passes to ships bound for Korea. The Treaty of Gyehae of 1443 allowed Tsushima 50 trading ships a year, and the great raids on Korea came to an end.
    facts:
      - [Ambush at Nukadake, "21 July 1419"]
      - [Korean dead, "180 (Annals of King Sejong)"]
      - [Fleet back at Geoje, "25 July 1419"]
      - [Treaty of Gyehae, "1443"]
