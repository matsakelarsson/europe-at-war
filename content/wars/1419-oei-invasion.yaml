notes:
  - Dates are Julian equivalents of the lunar dates in the Annals of King Sejong, as given in Japanese and English sources. The fleet sailed on the nineteenth day of the sixth month, landed on the twentieth, fought at Nukadake on the twenty-ninth and left on the third day of the seventh month.
  - "Losses are disputed. The Annals of King Sejong record 180 Korean dead and say Tsushima lost close to 200 people; the report of the Kyushu deputy Shōni Mitsusada claimed 3,700 Korean dead, and the Sō family genealogy of 1719 gives 123 Japanese and more than 2,500 Korean dead. The Muromachi court at first feared a Mongol or Chinese invasion."
