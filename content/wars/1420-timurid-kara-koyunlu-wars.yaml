id: timurid-kara-koyunlu-wars
name: Timurid–Kara Koyunlu wars
start: "1420"
end: "1436"
tier: C
summary: Shah Rukh’s three campaigns against the Kara Koyunlu (Black Sheep) Turkmen, who had taken Azerbaijan, Armenia and Iraq from the Timurids and the Jalayirids after Timur’s death. Qara Yusuf died in late 1420 as the first campaign began, and his sons fought over the succession. In 1421 Shah Rukh defeated Iskandar in a hard battle at Alashkert (Eleşkirt) and briefly occupied Tabriz, whose artists and calligraphers his son Baysunghur took to Herat. Iskandar won back Azerbaijan, and in 1429 Shah Rukh beat him again near Salmas and installed his brother Abu Said, whom Iskandar killed in 1431. A third campaign in 1434–1435 drove Iskandar out, and in 1436 Shah Rukh made another brother, Jahan Shah, ruler of Tabriz as his vassal; Iskandar was defeated by Jahan Shah and murdered by his own son at the fortress of Alinja. The Armenian chronicler Tovma Metsopetsi describes the wars as a catastrophe for Armenia, with towns sacked and many people carried off as slaves. After Shah Rukh’s death in 1447 Jahan Shah threw off Timurid rule.
