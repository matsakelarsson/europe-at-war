steps:
  - title: The Venetian city and the fall
    date: 1422–1430
    when: "1422-06"
    borders: "1430-03-29"
    countries: [gr, tr, it]
    body:
      - When Murad II became sultan in 1421, the Byzantines backed his uncle Mustafa as a rival. After crushing Mustafa, Murad besieged Constantinople in the summer of 1422 and sent troops to blockade Thessalonica from June. Its ruler, the despot Andronikos Palaiologos, a son of Manuel II, was ill and had neither men nor money to defend it, and in September 1423 he handed the city to Venice. Murad refused to accept the transfer. For years the blockade went on, broken by assaults on the walls, while Venetian and Ottoman ships raided each other’s coasts and Venetian fleets tried in vain to close the Dardanelles at Gallipoli.
      - The city starved, and many of its people fled. Resentment of the Venetian governors grew, and although the metropolitan Symeon urged resistance, most citizens came to prefer surrender to a sack. Venice formally declared war in March 1429 but sent too few soldiers. Early in 1430 Murad gathered a large army before the walls, and on 29 March his troops stormed them. The city was plundered and thousands of its people were enslaved, some 7,000 by one account; its population fell to perhaps 2,000, and Murad later brought in new settlers. Venice made peace in July 1430, accepting the loss.
