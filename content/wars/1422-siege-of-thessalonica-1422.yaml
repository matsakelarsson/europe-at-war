notes:
  - Dates are Julian. The city’s population before the siege is estimated at up to 40,000; the main accounts are by the metropolitan Symeon of Thessalonica, who died in 1429, and the eyewitness John Anagnostes, who described the fall.
  - Thessalonica had already been under Ottoman rule from 1387 until 1403, when the Treaty of Gallipoli returned it to Byzantium. Murad II’s siege of Constantinople in 1422 is not told here.
