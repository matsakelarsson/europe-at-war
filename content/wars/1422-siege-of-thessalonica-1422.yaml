id: siege-of-thessalonica-1422
name: Siege of Thessalonica, 1422–1430
start: "1422-06"
end: "1430-03-29"
tier: B
summary: The eight-year Ottoman blockade of Thessalonica, the second city of the Byzantine world. Sultan Murad II attacked it in 1422 to punish the Byzantines for backing a rival claimant, and in 1423 its despot Andronikos Palaiologos handed it to Venice, which could neither defend it properly nor make peace on its own terms. Murad took the starving city by storm on 29 March 1430, and it remained Ottoman until 1912.
