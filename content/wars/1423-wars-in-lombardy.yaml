  - title: Caravaggio and the Peace of Lodi
    date: 1446–1454
    when: "1446"
    borders: "1454-04-09"
    countries: [it]
    side_names:
      ven: Venice and its allies
      mil: Milan and Francesco Sforza
    body:
      - When Filippo Maria died without a son on 13 August 1447, the Milanese proclaimed a republic, the Golden Ambrosian Republic, and hired Sforza to defend it against Venice, whose army was already advancing on the city. On 15 September 1448 Sforza routed the Venetians at Caravaggio. A month later he changed sides, made his own peace with Venice at Rivoltella and turned on Milan. He blockaded the starving city until it gave in, and on 26 February 1450 he entered it; in March he was proclaimed duke.
      - Venice, alarmed, allied with Alfonso V of Naples against Sforza, who had the support of Cosimo de’ Medici’s Florence, and the war went on in 1452–1454 without decisive battles. The fall of Constantinople to the Ottomans in May 1453 and the exhaustion of all sides brought peace. On 9 April 1454 Venice and Milan signed the Peace of Lodi, which recognised Sforza as duke and fixed their border on the Adda, leaving Bergamo, Brescia and Crema to Venice. Florence, Naples and the pope soon joined them in an Italian League that kept the peace between the main Italian states, with interruptions, for forty years.
    facts:
      - [Battle of Caravaggio, "15 September 1448, victory for Milan under Sforza"]
      - [Sforza enters Milan, 26 February 1450]
      - [Peace of Lodi, 9 April 1454]
    markers:
      - kind: battle
        side: mil
        name: Battle of Caravaggio
        date: 15 September 1448
        text: Sforza surprised the Venetian army under Micheletto Attendolo, which had been besieging Caravaggio, and took most of it prisoner.
        lonlat: [9.64, 45.5]
      - kind: treaty
        name: Rivoltella
        date: 18 October 1448
        text: Sforza agreed with Venice to give up Crema and the Ghiara d’Adda in return for its help in taking Milan for himself.
        lonlat: [10.55, 45.47]
      - kind: taken
        side: mil
        name: Milan
        date: 26 February 1450
        text: The hungry Milanese rose against the republic’s government and let Sforza in. His family ruled Milan, with interruptions, until 1535.
        lonlat: [9.19, 45.46]
      - kind: treaty
        name: Lodi
        date: 9 April 1454
        text: The peace was agreed directly between Venice and Milan, without the allies, who joined later.
        lonlat: [9.5, 45.31]
    arrows:
      - side: ven
        label: Venetian army, 1448
        phase: 1
        via: [[10.22, 45.54], [9.95, 45.53], [9.68, 45.5]]
      - side: mil
