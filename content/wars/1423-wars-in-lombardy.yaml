id: wars-in-lombardy
name: Wars in Lombardy
start: "1423-05"
end: "1454-04-09"
tier: B
summary: Thirty years of intermittent war between the Duchy of Milan under Filippo Maria Visconti and the Republics of Venice and Florence, fought largely by mercenary captains. Venice won Brescia and Bergamo after Maclodio (1427), Florence and the pope beat Milan at Anghiari (1440), and after Visconti’s death the condottiere Francesco Sforza beat Venice at Caravaggio (1448) and made himself duke; the Peace of Lodi in 1454 fixed the Venetian–Milanese border on the Adda and opened forty years of relative peace in Italy.
countries: [it]
sides:
  - id: ven
    name: Venice, Florence and their allies
    polities: [venice, tuscany, papal-states]
    ink: red
    moves: Venetian and allied moves
    success: Venetian and allied success
  - id: mil
    name: Milan and its allies
    polities: [milan]
    ink: purple
    moves: Milanese moves
    success: Milanese success
notes:
  - The armies were led by condottieri, mercenary captains hired by contract, who often changed employers. Francesco Sforza fought for and against both Milan and Venice before becoming Duke of Milan; Florence, his ally, then fought on Milan’s side.
  - Historians divide the fighting into four or five wars between 1423 and 1454, separated by short-lived peaces (Venice 1426, Ferrara 1428 and 1433, Cremona 1441).
