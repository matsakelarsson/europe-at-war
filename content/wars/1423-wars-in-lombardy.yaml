steps:
  - title: Maclodio
    date: 1423–1433
    when: "1423-05"
    borders: "1428-04-19"
    countries: [it]
    body:
      - Filippo Maria Visconti, Duke of Milan, set out to rebuild the state of his father Gian Galeazzo, which had broken up on his death in 1402. In 1423 he intervened in Forlì, in the Romagna, and Florence, fearing encirclement, went to war; its army was routed at Zagonara in July 1424. In December 1425 Venice joined Florence, urged on by Francesco Bussone, known as Carmagnola, a condottiere who had left Milan’s service. Carmagnola took Brescia for Venice in 1426.
      - On 11 October 1427 Carmagnola drew the Milanese army under Carlo Malatesta onto marshy ground near Maclodio, west of Brescia, and destroyed it. Some 8,000 prisoners were taken, and as was usual among the condottieri most were soon released. In the Peace of Ferrara of April 1428 Milan gave up Brescia and Bergamo, carrying Venice’s mainland state west to the Adda. War broke out again in 1431; after several defeats Carmagnola was suspected of double-dealing, lured to Venice, tried and beheaded on 5 May 1432. A second Peace of Ferrara in 1433 confirmed Venice’s gains.
    facts:
      - [Battle of Zagonara, "July 1424, Milanese victory"]
      - [Battle of Maclodio, "11 October 1427, Venetian victory"]
      - [Peace of Ferrara, "April 1428, Brescia and Bergamo to Venice"]
