  - title: Anghiari
    date: 1434–1441
    when: "1434"
    borders: "1441-11-20"
    countries: [it]
    body:
      - War broke out again in 1434, and the rival condottieri dominated the campaigns, Niccolò Piccinino for Milan, Gattamelata and Francesco Sforza for the league. From 1438 Piccinino besieged Brescia, which held out for over two years, while Venice dragged a fleet of galleys overland from the Adige to Lake Garda to bring it help. In 1440 Piccinino crossed the Apennines with Florentine exiles to raise a revolt in Tuscany.
      - On 29 June 1440, near Anghiari in the upper Tiber valley, the Florentine and papal army met Piccinino’s men as they came down from Sansepolcro and beat them after a long fight for a bridge. Machiavelli later mocked the battle, claiming that only one man died, crushed after falling from his horse; modern accounts give far higher losses. The war ended with the Peace of Cremona on 20 November 1441. Sforza married Filippo Maria’s only child, Bianca Maria, with Cremona as her dowry, and Venice kept Ravenna, which it had taken over that year.
    facts:
      - [Galleys to Lake Garda, "1439"]
      - [Battle of Anghiari, "29 June 1440, Florentine and papal victory"]
      - [Peace of Cremona, 20 November 1441]
    markers:
      - kind: held
        side: ven
        name: Brescia
        date: 1438–1440
        text: The city held out against Piccinino’s siege, suffering famine and plague, until Sforza relieved it.
        lonlat: [10.22, 45.54]
      - kind: event
        side: ven
        name: Torbole
        date: "1439"
        text: Galleys and smaller boats were hauled over the mountains on rollers by oxen and launched on Lake Garda here.
        lonlat: [10.87, 45.87]
      - kind: battle
        side: ven
        name: Battle of Anghiari
        date: 29 June 1440
        text: Florence later commissioned Leonardo da Vinci to paint the battle in its council hall; the unfinished mural is lost.
        lonlat: [12.07, 43.55]
      - kind: event
        side: ven
        name: Ravenna
        date: "1441"
        text: Venice took over the city from its last Polenta lord and held it until 1509.
        lonlat: [12.2, 44.42]
      - kind: treaty
        name: Cremona
        date: 20 November 1441
        text: The peace was sealed with the wedding of Sforza and Bianca Maria Visconti in the city a few weeks earlier.
        lonlat: [10.02, 45.13]
