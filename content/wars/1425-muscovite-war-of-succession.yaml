notes:
  - Also called the Muscovite Civil War. Dates are Julian (Old Style), as in the Russian chronicles.
  - Both sides sought the backing of the khans. The capture of Vasily II by the Tatars of Ulugh Muhammad at Suzdal in 1445, which weakened him before Shemyaka’s coup, is told under the Russo-Kazan Wars.
