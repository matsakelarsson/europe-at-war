id: muscovite-war-of-succession
name: Muscovite War of Succession
start: "1425"
end: "1453"
tier: C
summary: A civil war in the grand principality of Moscow between Vasily II and his uncle, Yury of Zvenigorod and Galich, and then Yury’s sons Vasily Kosoy and Dmitry Shemyaka, who claimed the throne under the older custom of succession from brother to brother. Moscow changed hands several times, and both sides blinded captured rivals, Vasily II himself in 1446. Vasily regained his throne in 1447, and after Shemyaka was poisoned in Novgorod in 1453 succession from father to son was secure.
