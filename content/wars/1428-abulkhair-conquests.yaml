id: abulkhair-conquests
name: Wars of Abu’l-Khayr Khan
start: "1428"
end: "1468"
tier: C
summary: "The campaigns by which Abu’l-Khayr, a Shaybanid prince of the house of Jochi, built the Uzbek Khanate on the steppe east of the Urals and the Volga, and the defeats that broke it. Proclaimed khan in 1428 at about the age of seventeen, in the lands of the Tura and the Tobol around Chimgi-Tura (today’s Tyumen), he defeated rival Jochid khans, among them Hajji Muhammad of Sibir and, near Astrakhan, Mustafa Khan. In 1430–1431 his army sacked Urgench in Timurid Khwarazm, and in about 1446 he took the towns of the middle Syr Darya, Sighnaq, Sozak, Uzgend and Arquq, and made Sighnaq his capital. In 1451 he helped the Timurid Abu Sa’id take Samarkand and married a daughter of Ulugh Beg. In about 1457 an Oirat army under Uz Temür taishi routed him at Kök Kashane near Sighnaq and plundered his lands, and soon after the sultans Kerei and Janibek left him with their followers and settled in Moghulistan, where they founded the Kazakh Khanate. Abu’l-Khayr died in 1468 (some sources say 1469) on a campaign against them; his khanate broke up, and his grandson Muhammad Shaybani later founded the Shaybanid state in Mawarannahr."
