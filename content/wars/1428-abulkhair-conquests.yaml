notes:
  - “Uzbek” here is the name of the nomadic tribes of the eastern Jochid lands who followed Abu’l-Khayr, not yet the people of today’s Uzbekistan. The chronology rests on Persian chronicles written for his descendants, and many dates, including that of the Oirat defeat, are approximate.
  - The wars between the Kazakhs and Abu’l-Khayr’s successors are told in the entry on the Kazakh–Uzbek wars.
