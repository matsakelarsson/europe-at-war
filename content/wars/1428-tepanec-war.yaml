id: tepanec-war
name: Tepanec War
start: "1428"
end: "1428"
tier: B
summary: "The war in which the Mexica of Tenochtitlan, the Acolhua of Texcoco and the Tepanec city of Tlacopan overthrew the Tepanec state of Azcapotzalco, which had dominated the Valley of Mexico, and founded the Triple Alliance that became the Aztec Empire. When the Tepanec king Tezozomoc died in 1426 or 1427, his son Maxtla seized the throne from the heir he had chosen. Chimalpopoca, ruler of Tenochtitlan, died soon afterwards, by most accounts on Maxtla’s orders, and his successor Itzcoatl refused to submit. Nezahualcoyotl, the exiled heir of Texcoco, whose father the Tepanecs had killed in 1418, raised Acolhua towns and won help from Huexotzinco and Tlaxcala, and Tlacopan broke with Azcapotzalco. In 1428 the allies retook Texcoco and its towns and stormed and destroyed Azcapotzalco; Maxtla was killed or fled. The victors divided the Tepanec lands and agreed to wage their wars together, and over the next years they conquered Coyoacán and the chinampa towns of the southern lakes. Nezahualcoyotl became king of Texcoco in 1431."
