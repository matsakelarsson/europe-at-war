  - title: The Triple Alliance
    date: "1428–1433"
    when: "1430"
    borders: "1431-06-01"
    countries: [mx]
    view: {center: [-99.0, 19.40], size: [110, 85]}
    body:
      - Huexotzinco and Tlaxcala went home after the victory. Tenochtitlan, Texcoco and Tlacopan divided the Tepanec lands among themselves and agreed to fight their future wars together and to share the tribute, two-fifths each to Tenochtitlan and Texcoco and one-fifth to Tlacopan, whose ruler Totoquihuaztli became the third king of the alliance. This Triple Alliance is what modern historians call the Aztec Empire; the sources date its formal founding to 1428 or to about 1430. Itzcoatl helped Nezahualcoyotl subdue the rest of Acolhuacan, and in 1431 Nezahualcoyotl was enthroned as king of Texcoco.
      - The allies conquered Coyoacán and then turned south to the towns on the freshwater lakes of Xochimilco and Chalco, whose raised fields (chinampas) could feed Tenochtitlan. Mexica annals date the conquest of Xochimilco to 1430, Mixquic to 1432 and Cuitlahuac to 1433. In 1439 the alliance went beyond the valley against Cuauhnahuac (Cuernavaca). In Tenochtitlan, according to later Mexica tradition, Itzcoatl and Tlacaelel had older painted histories burned so that a new official history, giving the Mexica and their god Huitzilopochtli the central place, could take their place. Itzcoatl died in 1440 and was succeeded by Moctezuma I.
    facts:
      - [Triple Alliance founded, "1428 or about 1430"]
      - [Nezahualcoyotl king of Texcoco, "1431"]
      - [Xochimilco conquered, "1430"]
