steps:
  - title: Maxtla and the death of Chimalpopoca
    date: "1426–1427"
    when: "1427"
    borders: "1427-06-01"
    countries: [mx]
    view: {center: [-98.75, 19.42], size: [150, 110]}
    body:
      - In the early 1400s the Tepanecs of Azcapotzalco, on the western shore of Lake Texcoco, ruled the largest state in the Valley of Mexico under their long-lived king Tezozomoc. The Mexica of Tenochtitlan and Tlatelolco, on their island in the lake, paid him tribute and fought his wars. With their help he defeated the Acolhua of Texcoco on the eastern shore, whose king Ixtlilxochitl was killed by Tepanec warriors in 1418, and gave Texcoco to Tenochtitlan as a tributary. Ixtlilxochitl’s son Nezahualcoyotl, then sixteen, saw his father die and spent the next years as a fugitive, in Tlaxcala and later in Tenochtitlan, whose royal family were his mother’s kin.
      - Tezozomoc died in 1426 or 1427, the sources differ. He had chosen his son Tayatzin to succeed him, but another son, Maxtla, lord of Coyoacán, seized Azcapotzalco and had Tayatzin killed. Chimalpopoca, the ruler of Tenochtitlan, who had supported Tayatzin, died soon afterwards. Most accounts say Maxtla had him murdered and some that he killed himself in prison; some historians suspect a coup by Mexica nobles who wanted to break with Azcapotzalco. The ruler of Tlatelolco, Tlacateotl, was also killed.
      - The Mexica chose Chimalpopoca’s uncle Itzcoatl, a son of the first Mexica king Acamapichtli, as their ruler. Advised by his nephews Tlacaelel and Moctezuma, he refused to submit, and Maxtla cut off Tenochtitlan’s trade and demanded heavier tribute. Nezahualcoyotl, who escaped several attempts by Maxtla to have him killed, sought allies among the Acolhua towns that resented Tepanec rule and in Huexotzinco and Tlaxcala beyond the volcanoes. Tlacopan, a Tepanec city on the lake shore south of Azcapotzalco, went over to the rebels.
    facts:
      - [Death of Tezozomoc, "1426 or 1427"]
      - [Itzcoatl ruler of Tenochtitlan, "1427"]
