notes:
  - "The war is known from accounts written down after the Spanish conquest from older painted books and oral tradition, above all the Codex Xolotl and Fernando de Alva Ixtlilxochitl for Texcoco, and Diego Durán, the Codex Mendoza and the Annals of Cuauhtitlan for the Mexica side. Each city told the story in its own favour: the Mexica histories make Itzcoatl and Tlacaelel the victors, the Texcocan ones Nezahualcoyotl. They disagree on the dates (1426 to 1430), on how Chimalpopoca died and on what became of Maxtla, and the army sizes they give are not reliable."
  - "Names: Tenochtitlan is today’s Mexico City; Azcapotzalco and Tlacopan (Tacuba) are boroughs of it. Itzcoatl is also written Izcóatl, and Nezahualcoyotl’s Texcoco Tetzcoco."
