  - title: The fall of Azcapotzalco
    date: "1428"
    when: "1428"
    borders: "1427-12-31"
    countries: [mx]
    view: {center: [-98.85, 19.52], size: [130, 95]}
    body:
      - In 1428 the allies took the offensive. Troops from Huexotzinco and Tlaxcala and Nezahualcoyotl’s Acolhua followers gathered at Calpulalpan, east of the valley; the Texcocan accounts speak of more than 100,000 men, a figure modern historians do not accept. Nezahualcoyotl’s army marched on the Acolhua towns, took Acolman, where a son of Tezozomoc ruled, and recovered Texcoco, while the Mexica, with Tlacopan’s help, fought the Tepanecs on the western shore of the lake and broke the blockade of their island.
      - The allied armies then joined against Azcapotzalco. After a siege and hard fighting the city fell; it was sacked and burned, its lands were divided among the victors, and in later times its market became a market for slaves. The Texcocan accounts say that Nezahualcoyotl found Maxtla hiding and sacrificed him himself; others say that Maxtla fled south. The fighting moved on to Coyoacán and the other Tepanec towns, and to the Tepanec garrisons left in Acolhuacan.
    facts:
      - [Fall of Azcapotzalco, "1428"]
