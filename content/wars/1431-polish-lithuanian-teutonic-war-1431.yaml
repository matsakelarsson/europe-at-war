id: polish-lithuanian-teutonic-war-1431
name: Polish–Teutonic War, 1431–1435
start: "1431"
end: "1435"
tier: C
summary: A war fought alongside the Lithuanian civil war that followed Vytautas’s death, in which the Teutonic Order backed Švitrigaila against Poland and, from 1432, against Sigismund Kęstutaitis, Poland’s ally in Lithuania. The Order ravaged the Dobrzyń Land in 1431 before being beaten at Dąbki, and in 1433 a Polish army with Hussite allies from Bohemia marched through Pomerelia to the Baltic near Gdańsk. On 1 September 1435 Sigismund and his Polish allies routed Švitrigaila and the Livonian Order at Wiłkomierz (Pabaiskas), and the Peace of Brześć Kujawski on 31 December 1435 kept the border of 1422 and bound the Order to stop meddling in Lithuania.
