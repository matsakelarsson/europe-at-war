id: joseon-jurchen-campaigns
name: Joseon’s Jurchen campaigns
start: "1433-04"
end: "1491-10"
tier: B
summary: "The campaigns in which Joseon pushed its northern frontier to the Yalu and Tumen rivers and fought the Jurchen tribes beyond them. After Jianzhou Jurchens under Li Manzhu raided the upper Yalu in 1432, King Sejong sent Choe Yun-deok across the river in 1433 with 15,000 men against their villages on the Pojeo (Hun) River, and a second campaign followed in 1437; four new commanderies were set up along the upper Yalu. In the north-east, after the Jurchen chief Möngke Temür was killed in 1433, Kim Jong-seo built six fortified garrisons along the Tumen and settled them with people from the south. The upper-Yalu commanderies proved too costly and were abandoned in the 1450s, but the Tumen line held, and the two rivers became Korea’s border. Joseon joined Ming attacks on the Jianzhou Jurchens in 1467, when Li Manzhu was killed, and in 1479, and in 1491 Heo Jong led some 20,000 men across the Tumen against the Udige."
countries: [kp, cn]
sides:
