  - title: The six garrisons on the Tumen
    date: 1434–1449
    when: "1434"
    borders: "1449-12"
    countries: [kp]
    body:
      - In 1433 Möngke Temür, chief of the Odoli Jurchens who lived around Hoeryong and an ancestor of the later Qing emperors, was killed in a feud with other Jurchens. Sejong seized the chance to take the lower Tumen valley. From 1434 Kim Jong-seo, commander of Hamgil province, built fortified garrisons at Hoeryong, Jongseong, Onseong, Gyeongwon, Gyeongheung and Buryeong, with the help of officers such as Yi Jing-ok, and thousands of families from the southern provinces were moved north to settle them.
      - The six garrisons held, and with the line of forts on the Yalu they made the two rivers the northern border of Korea, as they have remained. The settlers and local strongmen of the north-east, however, resented the burdens of frontier defence and the officials sent from the south, which later fed Yi Si-ae’s rebellion of 1467.
    facts:
      - [Death of Möngke Temür, "1433"]
      - [Six garrisons built, "from 1434, completed by the 1440s"]
