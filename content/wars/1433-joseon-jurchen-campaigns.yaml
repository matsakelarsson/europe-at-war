steps:
  - title: The Pojeo River and the four commanderies
    date: 1432–1443
    when: "1433-04"
    borders: "1433-12"
    countries: [kp, cn]
    body:
      - At the end of 1432 Jianzhou Jurchens under Li Manzhu, whose people lived along the Pojeo (Hun) River north of the Yalu, raided Yeoyeon on the upper Yalu, killing and carrying off dozens of people. In the fourth month of 1433 King Sejong sent Choe Yun-deok with 15,000 men from Ganggye. They crossed the Yalu in seven columns and attacked the Jurchen villages; the Korean records count 178 Jurchens killed and 248 captured. In 1437 Yi Cheon led a second campaign of 8,000 men across the river.
      - To hold the upper Yalu, Joseon set up four commanderies, Yeoyeon, Jaseong, Muchang and Uye, by 1443. They were exposed and hard to supply, and between 1455 and 1459 they were abandoned, becoming known as the “abandoned four commanderies”.
    facts:
      - [Choe Yun-deok’s campaign, "fourth month of 1433, 15,000 men"]
      - [Jurchen losses, "178 killed, 248 captured (Korean records)"]
      - [Second campaign, "1437, 8,000 men under Yi Cheon"]
