  - title: Joining the Ming against Jianzhou
    date: 1467–1491
    when: "1467-10"
    borders: "1491-12"
    countries: [kp, cn]
    body:
      - In 1467, after crushing Yi Si-ae’s rebellion, King Sejo sent an army to join a Ming campaign against the Jianzhou Jurchens. Under Gang Sun, with Nam I and Eo Yu-so leading the vanguard, it crossed the Yalu from Manpo and attacked the villages on the Pojeo River, killing Li Manzhu, his son and many of their people. In 1479 Yun Pil-sang led 5,000 men across the river to join another Ming attack on Jianzhou, after a first force under Eo Yu-so had turned back.
      - In the north-east, the Udige Jurchens raided the Tumen garrisons. In the tenth month of 1491 Heo Jong led about 20,000 men across the Tumen against their villages. The Jurchen tribes beyond the rivers remained divided until Nurhaci, a descendant of Möngke Temür, united them at the end of the sixteenth century.
    facts:
      - [Joint campaign with the Ming, "1467; Li Manzhu killed"]
      - [Second joint campaign, "1479, 5,000 men under Yun Pil-sang"]
      - [Heo Jong’s expedition, "tenth month of 1491, about 20,000 men"]
