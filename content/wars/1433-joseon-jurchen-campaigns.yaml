notes:
  - Dates are lunar months from the Annals of the Joseon Dynasty. Numbers of Jurchens killed and captured come from the Korean records.
  - The four commanderies were Yeoyeon, Jaseong, Muchang and Uye; the six garrisons were Hoeryong, Jongseong, Onseong, Gyeongwon, Gyeongheung and Buryeong. Historians differ on the dates at which each was founded, between 1434 and 1449.
