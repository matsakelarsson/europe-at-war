id: tuareg-capture-of-timbuktu
name: Tuareg capture of Timbuktu
start: "1433"
end: "1468-01"
tier: C
summary: "The end of Malian rule in Timbuktu and the town’s decades under the Maghsharen Tuareg. As Mali weakened in the early fifteenth century, Tuareg of the Maghsharen confederation under their chief Akil ag Malwal raided the country around Timbuktu year after year. The townspeople did not take up arms, and the Malian officials withdrew; according to the Tarikh al-Sudan, Akil took the town about 1433 and was its master for forty years. The Tuareg went on living in their tents and moving with their herds outside the town, which they governed through the Timbuktu-koi, the Sanhaja notable Muhammad Naddi, who had held the office under Mali and kept it, with all administrative and financial powers, under its new overlords. He built the mosque of Sidi Yahya and made his friend Sidi Yahya al-Tadilsi its imam. The Tarikh says Akil’s rule turned harsh in its last years, with houses broken into and women assaulted, and that he took the third of the taxes that by custom went to the Timbuktu-koi. Muhammad Naddi’s son and successor Ammar then secretly invited Sonni Ali of Gao to take the town. When Songhai horsemen appeared on the Gourma bank of the Niger, Akil fled to Walata with many of the scholars of Sankore, and Sonni Ali entered Timbuktu in January 1468 (see “Sonni Ali’s conquests”). The Tuareg chiefs’ authority, the chronicle notes, had never reached beyond the river."
