notes:
  - "The only detailed account is in the Tarikh al-Sudan of al-Sa’di, written in Timbuktu in the 1650s, two centuries after the events, by a scholar of the town; it is hostile to both the Tuareg and Sonni Ali. The year 1433 (837 of the Hijra) is the one usually given; the chronicle’s “forty years” of Tuareg rule is a round number, since Sonni Ali took the town about 35 years later."
