notes:
  - Much of this history comes from Kapilendra’s own inscriptions, above all at the Jagannath temple in Puri and at Gopinathpur, which list his victories and titles; Bahmani and Vijayanagara sources give a different picture, and several dates are uncertain. He died on the banks of the Krishna, on 25 November 1466 according to some historians, in 1467 according to others.
