id: gajapati-conquests
name: Conquests of Kapilendra Deva
start: "1435"
end: "1467"
tier: C
summary: "The wars of Kapilendra Deva, who seized the throne of Odisha from the last Eastern Ganga king in 1434–1435 and founded the Suryavamsi Gajapati dynasty. After putting down rebellious vassals, he turned south against the Reddi kingdoms of coastal Andhra and their ally Vijayanagara. His son Hamvira took Rajahmundry by 1448, and by 1454 the Gajapatis held Kondavidu and the other Reddi lands south to the Krishna. He fought the Bengal Sultanate in the north, took the fort of Mahur during a campaign against Malwa (1457) and defeated the Bahmanis at Devarakonda in 1458, after which he called himself lord of Kalaburagi (Gulbarga); a march on Bidar in 1461 ended when Husain Shah Sharqi of Jaunpur invaded Odisha. From 1460 Hamvira’s generals took Udayagiri and Chandragiri from Vijayanagara and raided as far south as Tiruchirappalli, and in 1464 Kapilendra’s inscriptions claim an empire from the Ganges to the Kaveri. After his death in 1466 or 1467 his sons fought over the throne, and the southern conquests were soon lost to Vijayanagara and the Bahmanis."
