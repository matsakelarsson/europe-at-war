steps:
  - title: Ponza
    date: 1435–1438
    when: "1435-02-02"
    borders: "1435-12"
    countries: [it, es]
    body:
      - Queen Joanna II of Naples, the last of her line, had adopted first Alfonso V of Aragon, King of Sicily, and then Louis III of Anjou as her heir. When she died on 2 February 1435 Louis was already dead, and her will named his brother René of Anjou. René was a prisoner of the Duke of Burgundy, so his wife Isabella of Lorraine came to Naples to rule for him, while Alfonso, who had never given up his claim, besieged Gaeta. Pope Eugenius IV claimed the right to decide as the kingdom’s overlord, and Filippo Maria Visconti of Milan, then master of Genoa, backed the Angevins.
      - On 5 August 1435 a Genoese fleet sent to relieve Gaeta met Alfonso’s larger fleet off the island of Ponza and routed it, capturing Alfonso, two of his brothers and many nobles. They were taken to Milan, but Alfonso persuaded Filippo Maria that a French king in Naples would threaten Milan more than he would, and in October he was freed as the duke’s ally. Genoa, furious, threw off Milanese rule at the end of the year. The Aragonese took Gaeta, which became Alfonso’s base; René, ransomed, reached Naples only in May 1438.
    facts:
      - [Death of Joanna II, 2 February 1435]
      - [Battle of Ponza, "5 August 1435, Genoese victory; Alfonso captured"]
      - [Alfonso freed by Milan, October 1435]
