id: war-of-the-neapolitan-succession-1435
name: War of the Neapolitan Succession, 1435–1442
start: "1435-02-02"
end: "1442-06-02"
tier: B
summary: The war for the Kingdom of Naples after the death of Queen Joanna II, between her heir René of Anjou and Alfonso V of Aragon, King of Sicily. Captured by the Genoese at Ponza in 1435, Alfonso won over his captor, the Duke of Milan, and slowly conquered the kingdom; he took Naples in June 1442, and the pope recognised him as king in 1443.
countries: [it, es]
sides:
  - id: ara
    name: Alfonso V of Aragon
    polities: [aragon, sicily]
    ink: gold
    moves: Aragonese moves
    success: Aragonese success
  - id: anj
    name: René of Anjou and his allies
    polities: [naples, papal-states, genoa]
    ink: blue
    moves: Angevin and allied moves
    success: Angevin and allied success
notes:
  - Alfonso V of Aragon is Alfonso I of Naples. The Kingdom of Naples is shown as one polity throughout; in 1442 it passed from René of Anjou to Alfonso, who ruled it alongside Aragon, Sicily and Sardinia until his death in 1458.
  - Milan and Genoa began the war on the Angevin side. After Ponza the Duke of Milan made peace with Alfonso, and Genoa, rebelling against Milan, kept up the war against him.
