  - title: The fall of Naples
    date: 1438–1443
    when: "1438-05"
    borders: "1442-06-02"
    countries: [it]
    body:
      - The war became a slow struggle for castles and barons across the kingdom. René had the pope’s support and the services of Giacomo Caldora, the strongest of the kingdom’s captains, and Genoa sent him galleys, but he was always short of money. Alfonso’s brother Peter was killed by a cannon ball during a siege of Naples in October 1438, and the Aragonese garrison of the Castel Nuovo surrendered to René in 1439. But Caldora died that year, his son was a weaker ally, and Alfonso took one stronghold after another, Benevento in 1441, until he could close in on Naples itself.
      - On 2 June 1442 Aragonese soldiers entered the city through a disused aqueduct, as Belisarius’s men had done nine centuries earlier, and Naples fell. René escaped by sea and went back to Provence. On 26 February 1443 Alfonso entered Naples in a triumph in the Roman style, later commemorated by the marble arch of the Castel Nuovo, and on 14 June 1443, at Terracina, Eugenius IV recognised him as king and his illegitimate son Ferdinand as his heir. Naples became Alfonso’s capital. On his death in 1458 it went to Ferdinand, and Aragon and Sicily to his brother John.
    facts:
      - [Fall of Naples, 2 June 1442]
      - [Alfonso’s triumph, 26 February 1443]
      - [Treaty of Terracina, 14 June 1443]
    markers:
      - kind: taken
        side: ara
        name: Benevento
        date: January 1441
        text: The papal enclave inside the kingdom fell to Alfonso.
        lonlat: [14.78, 41.13]
      - kind: taken
        side: ara
        name: Naples
        date: 2 June 1442
        text: A party led through the aqueduct by a local mason opened the way. Earlier, in October 1438, Alfonso’s brother Peter had been killed besieging the city.
        lonlat: [14.25, 40.85]
      - kind: treaty
        side: ara
        name: Terracina
        date: 14 June 1443
        text: In return for recognition, Alfonso abandoned the Council of Basel and its antipope and promised the pope help in the Marche.
        lonlat: [13.25, 41.29]
