  - title: Mong Yang
    date: March 1449
    when: "1449"
    borders: "1449-04-01"
    countries: [cn, mm]
    body:
      - In March 1449 Wang Ji led a fourth campaign, of 130,000 or 150,000 men in different passages of the records, against Si Jifa at Mong Yang, west of the Irrawaddy. The army was badly supplied and badly disciplined, and many men were trampled to death in the crush on the first day of the march. It stormed the stockades of Mong Yang, but Si Jifa escaped again. The campaign ended in a compromise, by which the Möng Mao ruling family could stay in Mong Yang if they never crossed the Irrawaddy eastwards. Sources disagree on Si Jifa’s fate, but his son Si Hongfa went on ruling Mong Yang, whose chiefs later led the Shan confederation that took Ava in 1527.
      - The four campaigns ended Möng Mao’s power in the Shweli valley, but the historian Wang Gungwu judges that they disrupted the economy of the south-west, damaged Ming prestige among the border chiefs and drained resources from the north. Months later, in September 1449, Wang Zhen led the emperor against the Oirat Mongols, and at Tumu the emperor was captured and Wang Zhen killed.
    facts:
      - [Fourth campaign, "March 1449, 130,000–150,000 men"]
      - [Tumu crisis, "September 1449"]
