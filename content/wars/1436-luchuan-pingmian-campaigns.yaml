id: luchuan-pingmian-campaigns
name: Luchuan–Pingmian campaigns
start: "1436"
end: "1449"
tier: B
summary: "Four Ming campaigns against Möng Mao, the Tai (Shan) state of the Shweli valley on today’s border between Yunnan and Myanmar, which the Ming called the Luchuan–Pingmian pacification commission. Its ruler Si Renfa (Thonganbwa in Burmese) stopped paying tribute and from 1437 annexed the lands of neighbouring chiefs under Ming protection. A first campaign under Mu Sheng and Fang Zheng ended in defeat in 1439. Under the influence of the palace eunuch Wang Zhen the court sent a much larger army under the minister of war Wang Ji, which took Si Renfa’s base in January 1442. Si Renfa fled to Ava, whose king Narapati held him as a bargaining counter and handed him over in 1445–1446, after Ming armies had come into Burma. Two more campaigns, in 1443 and 1449, pursued his son Si Jifa to Mong Yang (Mohnyin), west of the Irrawaddy, without capturing him; the Shan were allowed to stay there if they never crossed the river eastwards. The wars broke Möng Mao but cost the Ming dearly, and the Tumu crisis, in which the Mongols captured the emperor and killed Wang Zhen, followed months after the last campaign."
countries: [cn, mm]
