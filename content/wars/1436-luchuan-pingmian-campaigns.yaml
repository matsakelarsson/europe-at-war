notes:
  - The campaigns are known mainly from the Ming Veritable Records (Ming Shilu) and from Burmese and Shan chronicles, which tell a different story of Ava’s part and of Si Renfa’s death. The Chinese numbers, up to 150,000 men in one army, are those of the court records and may include porters and local levies.
  - "Names: the Chinese, Burmese and Shan forms differ. Si Renfa is Thonganbwa in the Burmese chronicles, his son Si Jifa is Thokyeinbwa, Möng Mao is Maw, Mong Yang (Mengyang) is Mohnyin, and Yongchang is today’s Baoshan."
