steps:
  - title: Si Renfa and the first campaign
    date: 1436–1439
    when: "1438"
    borders: "1438-12-08"
    countries: [cn, mm]
    body:
      - Möng Mao, the Tai state of the Shweli valley around today’s Ruili and Mangshi, had been the strongest power of the Shan hills since the fourteenth century; in 1364 its raiders sacked Sagaing and Pinya in Upper Burma. After the Ming conquest of Yunnan in 1381–1382 its rulers accepted the title of pacification commissioner of Luchuan–Pingmian, but they kept their own armies and their claims over the neighbouring chiefs. Si Renfa, who succeeded his brother in 1413, asked in 1436 to be excused 2,500 taels of unpaid tribute, and the young Zhengtong emperor agreed.
      - In November 1437 Si Renfa attacked the neighbouring chiefdom of Nandian and took its lands, and the Ming commander in Yunnan, Mu Sheng, reported raid after raid on chiefs under Ming protection. On 8 December 1438 the court ordered a punitive campaign. The Ming army came up to the Salween near Yongchang, where Si Renfa’s stockades stood on the far bank; the general Fang Zheng crossed by night and drove them off, and pursued Si Renfa westward. Early in 1439 Fang Zheng, his supplies cut and with few reinforcements, was ambushed by war elephants at Kongni and killed with his troops. Mu Sheng fell back to Yongchang, was reprimanded by the court and died on 2 May 1439.
    facts:
      - [Si Renfa annexes Nandian, "November 1437"]
      - [Campaign ordered, "8 December 1438"]
      - [Fang Zheng killed, "early 1439"]
