  - title: Wang Ji takes Luchuan
    date: 1441–1446
    when: "1442"
    borders: "1442-01-15"
    countries: [cn, mm]
    body:
      - At court the eunuch Wang Zhen, who dominated the young emperor, pressed for a second, far larger campaign; officials who argued that the money was needed against the Mongols were overruled, and the Hanlin scholar Liu Qiu, who opposed Wang Zhen, was arrested and put to death. The campaign was launched on 27 February 1441 under the minister of war Wang Ji, with an army the records put at 150,000 men. In September 1441 the Ming beat off an advance by 30,000 Möng Mao troops with 80 elephants; in November Si Renfa’s ambush of a Ming column failed and he was besieged in his stronghold of Shangjiang, from which he escaped through a water gate. In January 1442 the Ming took his base, and Si Renfa fled into Burma.
      - At Ava King Narapati I held him as a prisoner and a bargaining counter. The Ming demanded his surrender; in 1443 Wang Ji’s third campaign took the base of Si Renfa’s son Si Jifa, who escaped to Mong Yang, but the Ming did not follow him, fearing an alliance of Ava and Hsenwi against them. The Burmese chronicles say a Chinese army was held off near Bhamo in 1444 and that in 1445 the Chinese came down the Irrawaddy to Ava and helped Narapati take Yamethin in return for Si Renfa. In the Ming records Ava handed him over in August 1445 in return for Ming support against Hsenwi, and he was executed in January 1446; the Burmese chronicles say he took his own life and that his body was handed over.
    facts:
      - [Second campaign launched, "27 February 1441"]
      - [Si Renfa’s base taken, "January 1442"]
      - [Si Renfa handed over by Ava, "1445–1446"]
