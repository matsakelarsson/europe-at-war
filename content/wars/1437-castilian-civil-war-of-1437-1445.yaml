id: castilian-civil-war-of-1437-1445
name: Castilian Civil War of 1437–1445
start: "1437-08-13"
end: "1445-05-19"
tier: C
summary: A struggle for power in Castile between John II’s all-powerful favourite, the constable Álvaro de Luna, and a league of great nobles led by the Infantes of Aragon, John, king consort of Navarre, and Henry, Master of the Order of Santiago, sons of Ferdinand of Antequera. It began with the arrest of the noble Pedro Manrique in 1437. The league twice forced Luna into exile from the court, won control of the king after taking Medina del Campo in 1441, and in 1443 seized John II at Rágama. Luna, the king and the heir, Prince Henry, fought back, and on 19 May 1445, at the battle of Olmedo, the royal army beat the Infantes and their allies. The Infante Henry died of his wounds, and John of Navarre withdrew. The victory restored the crown’s authority for a time, though Luna himself was overthrown and executed in 1453.
