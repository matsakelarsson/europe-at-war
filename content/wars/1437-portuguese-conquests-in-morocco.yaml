steps:
  - title: The disaster of Tangier
    date: 1437–1443
    when: "1437-08"
    borders: "1437-10-01"
    countries: [ma, pt]
    body:
      - Portugal had held Ceuta, on the African shore of the Strait, since 1415, and its princes wanted more. In August 1437 Prince Henry (later called the Navigator) and his younger brother Ferdinand sailed from Lisbon with about 6,000 men, well short of the 14,000 planned, to take Tangier. They reached Ceuta on 27 August, marched overland and on 13 September laid siege to the city, held by Salah ibn Salah, the former governor of Ceuta. Two assaults on the walls failed.
      - Morocco was then ruled in the name of the young Marinid sultan Abd al-Haqq II by the Wattasid regent Abu Zakariya Yahya. Relief armies gathered, and on 9 October a large army under Abu Zakariya overran the Portuguese siege guns and penned Henry’s men in their camp. Cut off from their ships, the Portuguese agreed terms on 17 October. They were allowed to re-embark, leaving their guns, horses and baggage; Henry promised to hand Ceuta back and left Ferdinand as a hostage until he did.
      - In January 1438 the Cortes of Leiria were divided, the burghers and clergy largely for the exchange and the nobles against it, and broke up without a decision; in June 1438, after a meeting at Portel between King Edward and Henry, the government decided to keep Ceuta, and the treaty was never carried out. Ferdinand was held at Asilah and then, from 1438, in Fez, where he died on 5 June 1443. In Portugal he was venerated as the Holy Prince, a martyr for Ceuta; for the regent Abu Zakariya, the victory strengthened his hold on power.
    facts:
      - [Siege of Tangier, "13 September – 17 October 1437"]
      - [Portuguese army, "about 6,000 men"]
      - [Death of Ferdinand in Fez, "5 June 1443"]
