  - title: Asilah and Tangier
    date: 1468–1471
    when: "1471-08"
    borders: "1471-09-01"
    countries: [ma, pt]
    body:
      - In 1468 a Portuguese fleet sacked Anfa, the port on the site of today’s Casablanca. Morocco was by then divided. After the revolt of 1465 in Fez, which killed the last Marinid sultan, the city was ruled by a sharif, Muhammad ibn Imran, while the surviving Wattasid, Muhammad al-Shaykh, held the north from Asilah and fought to win Fez.
      - Afonso V sailed from Lagos with about 400 ships and 30,000 men and reached the coast at Asilah on 22 August 1471, while Muhammad al-Shaykh was away besieging Fez. A storm wrecked several ships and drowned more than 200 men in the landing, but on 24 August the town was stormed after hard fighting. About 2,000 of its people were killed and some 5,000 taken captive, among them two wives and a young son of Muhammad al-Shaykh, who was taken to Portugal. The capture was celebrated in four great tapestries woven in Tournai, now at Pastrana in Spain.
      - Tangier’s people, fearing the same fate, fled, and on 28 August the Portuguese entered the city without a fight. Muhammad al-Shaykh, who needed peace in the north to take Fez, agreed a truce, and soon after entered Fez as the first Wattasid sultan. Afonso V took the title “king of Portugal and of the Algarves on this side and beyond the sea in Africa”, and was remembered as Afonso the African.
    facts:
