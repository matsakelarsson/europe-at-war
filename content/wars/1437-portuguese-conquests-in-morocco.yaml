  - title: Forts on the Atlantic coast
    date: 1486–1514
    when: "1505"
    borders: "1514-06-01"
    countries: [ma, pt]
    body:
      - Under John II and Manuel I the Portuguese turned to the Atlantic coast south of the Wattasid kingdom, a land of local lords and tribal confederations. Its ports exported wheat, horses and woollen cloth, which the Portuguese needed for their garrisons and for their trade on the coasts of West Africa. Azemmour agreed to pay tribute to John II in 1486, and Safi came under Portuguese control in 1488. In 1505 a Portuguese private venture built a fort at Santa Cruz do Cabo de Gué, beside today’s Agadir, which the crown later bought, and in 1506 Manuel built Castelo Real at Mogador; it was given up a few years later.
      - Portuguese troops occupied Safi in 1508 and made it a royal fortress. When Azemmour’s governor stopped paying tribute, Manuel sent a fleet of about 400 ships with 18,000 foot and 2,450 horse under James, Duke of Braganza; the town was taken on 1 September 1513, and among the wounded was Ferdinand Magellan. In 1514 the Portuguese built a fort at Mazagan, the present El Jadida, about 15 km down the coast. From Safi and Azemmour their captains and Moroccan allies raided deep into the plains of Doukkala and Abda and collected tribute from the tribes.
    facts:
      - [Safi under Portuguese control, "1488 (occupied 1508)"]
      - [Santa Cruz do Cabo de Gué founded, "1505"]
      - [Azemmour taken, "1 September 1513"]
      - [Mazagan fort built, "1514"]
