  - title: Ksar es-Seghir and the Tangier campaigns
    date: 1458–1464
    when: "1458-10"
    borders: "1458-11-01"
    countries: [ma, pt]
    body:
      - Afonso V had raised an army for the crusade against the Ottomans that the pope had called after the fall of Constantinople, but when the crusade came to nothing, the governor of Ceuta persuaded him to use it in Morocco. In October 1458 a fleet of more than 200 ships carrying about 25,000 men landed at Ksar es-Seghir, the small port between Tangier and Ceuta from which ships crossed to Spain. After a short assault the town surrendered. Its mosque became a church, and Duarte de Meneses became its captain.
      - The Marinid sultan Abd al-Haqq II arrived too late to save it, and besieged it from November 1458 to January 1459 and again from July to August 1459, without success. Afonso V then tried for Tangier. A first attack in 1463 was scattered by a storm, and two assaults led by his brother Ferdinand in January 1464 failed. On 20 January 1464, during a raid the king insisted on making into the hills south of Tétouan, the Portuguese were ambushed, and Duarte de Meneses was killed covering Afonso’s escape.
    facts:
      - [Ksar es-Seghir taken, "October 1458"]
      - [Marinid sieges, "1458–1459"]
      - [Attacks on Tangier, "1463–1464"]
