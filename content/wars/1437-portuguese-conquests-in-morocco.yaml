id: portuguese-conquests-in-morocco
name: Portuguese conquests in Morocco
start: "1437-08"
end: "1550"
tier: A
summary: "More than a century of Portuguese war on the coasts of Morocco after the capture of Ceuta in 1415. An attack on Tangier in 1437 ended in a humiliating capitulation, and Prince Ferdinand, left as a hostage, died a captive in Fez. Afonso V, “the African”, took Ksar es-Seghir in 1458 and, after failed attacks on Tangier in 1463–1464, stormed Asilah in August 1471 and occupied Tangier, while the Wattasid Muhammad al-Shaykh, fighting for Fez, made a truce with him. Under John II and Manuel I Portugal turned to the Atlantic coast, with its wheat, horses and cloth, and built or took forts at Santa Cruz do Cabo de Gué (Agadir, 1505), Safi (1508), Azemmour (1513) and Mazagan (1514). A disaster at Mamora in 1515 stopped the advance, and the rise of the Saadian sharifs, who preached holy war against the Portuguese from the Sous, turned it back: Agadir fell to the Saadians in 1541, after which Portugal abandoned Safi and Azemmour (1541), Ksar es-Seghir (1549) and Asilah (1550), keeping only Ceuta, Tangier and Mazagan."
countries: [ma, pt]
