notes:
  - The Portuguese side is told in detail by royal chroniclers such as Gomes Eanes de Zurara and Rui de Pina, and by the captains’ own letters; the Moroccan side by later Arabic chronicles and by Leo Africanus, who knew the country in the 1510s. Portuguese figures for Moroccan armies are usually much too large. Dates are Julian.
  - Until 1465 Morocco was ruled in the name of the Marinid sultans by regents of the Wattasid family; after 1471 the Wattasids ruled as sultans from Fez, while the south fell to local lords and, from the 1520s, to the Saadians. Portuguese sources call the towns by their Portuguese names (Alcácer-Ceguer for Ksar es-Seghir, Arzila for Asilah, Azamor, Safim, Santa Cruz do Cabo de Gué for Agadir).
  - The capture of Ceuta (1415) and the battle of Alcácer Quibir (1578) have their own entries, as does the rise of the Saadians.
