  - title: The Saadians and the withdrawals
    date: 1541–1550
    when: "1541"
    borders: "1550-06-01"
    countries: [ma, pt]
    body:
      - In the Sous the Saadians, a family of sharifs from the Draa valley, had been recognised in 1510 as leaders of the holy war against the Portuguese at Santa Cruz do Cabo de Gué. By the 1530s they ruled Marrakesh and the south. In 1533 Muhammad al-Shaykh failed to take Santa Cruz, but in 1541 he besieged it again. After a siege of about six months, during which an explosion in the powder store blew a breach in the walls, the fortress fell; its captain, Guterre de Monroy, and many of its people were taken captive.
      - The loss convinced John III that the southern forts could not be held against the Saadians at a cost Portugal could bear while it was fighting in Asia. In October 1541 Safi and Azemmour were evacuated, and Mazagan was rebuilt in the following years as a modern fortress. After the Saadians took Fez from the Wattasids in January 1549, Portugal gave up Ksar es-Seghir in 1549 and Asilah in 1550. Of all its conquests it kept only Ceuta, Tangier and Mazagan, which held out against a great Saadian siege in 1562. Twenty-eight years later King Sebastian’s attempt to reverse the retreat ended in disaster at Alcácer Quibir.
    facts:
      - [Fall of Santa Cruz do Cabo de Gué, "1541, after a siege of about six months"]
      - [Safi and Azemmour evacuated, "October 1541"]
      - [Ksar es-Seghir and Asilah abandoned, "1549 and 1550"]
