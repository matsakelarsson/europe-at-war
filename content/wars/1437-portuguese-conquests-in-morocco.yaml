  - title: Mamora and Marrakesh
    date: "1515"
    when: "1515"
    borders: "1515-08-01"
    countries: [ma, pt]
    body:
      - In 1515 Manuel I tried to close the Wattasid kingdom’s access to the Atlantic with a new fortress, São João da Mamora, at the mouth of the Sebou. A fleet of about 200 ships with some 8,000 men under António de Noronha arrived in July, but at low tide the ships were caught on the sandbars of the river mouth, and the Wattasid sultan Muhammad al-Burtughali and his brother Moulay Nasir surrounded the half-built fort with a large army. When the Portuguese tried to re-embark in August, thousands were killed or drowned; estimates give about 4,000 dead and 100 ships lost.
      - The same year the captain of Safi, Nuno Fernandes de Ataíde, with his Moroccan allies, marched on Marrakesh, then held by the Hintata emirs. The city was defended with the help of the Saadian sharifs, who were gathering the tribes of the south against the Portuguese, and the attack failed. The defeats of 1515 marked the limit of Portuguese expansion in Morocco.
    facts:
      - [Battle of Mamora, "July–August 1515, Wattasid victory"]
      - [Portuguese losses at Mamora, "about 4,000 dead"]
      - [Attack on Marrakesh, "1515, repulsed"]
