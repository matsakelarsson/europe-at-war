  - title: The fall of Kazan
    date: 1545–1552
    when: "1552-08"
    borders: "1552-10-02"
    countries: [ru, ua]
    body:
      - "When Ivan IV came of age, Moscow set out to end the threat from Kazan for good. His winter campaigns of 1547–1548 and 1549–1550 failed for lack of supplies. In 1551 a wooden fortress, cut and fitted at Uglich, was floated down the Volga and put up in four weeks at Sviyazhsk, about 30 kilometres above Kazan. The peoples on the right bank of the Volga went over to Moscow, and the pro-Russian Shah Ali was briefly restored as khan, but the Kazan nobles soon drove him out and called in a new khan, Yadegar Muhammad, who brought Nogai horsemen."
      - "In June 1552 Ivan led a large army, said to number 150,000, from Moscow. A Crimean attack meant to divert him was beaten off at Tula, and in late August the Russians surrounded Kazan. Their engineers built a wooden siege tower carrying cannon, and sappers blew up the passage to the city’s water source. On 2 October mines brought down the walls, and after hard street fighting the city was taken. Many defenders and inhabitants were killed, and Yadegar Muhammad was captured. Resistance in the countryside lasted until 1556, and Ivan celebrated the victory by building St Basil’s Cathedral in Moscow."
    facts:
      - [Sviyazhsk, "Built in 1551, about 30 km above Kazan"]
      - [Siege of Kazan, "Late August – 2 October 1552"]
      - [Last khan, "Yadegar Muhammad, captured"]
    markers:
      - kind: event
        side: ru
        name: Sviyazhsk
        date: "1551"
        text: The fortress on an island in the Volga became the Russian base for the final campaign.
        lonlat: [48.653, 55.77]
        lp: l
      - kind: held
        side: ru
        name: Tula
        date: June 1552
        text: Devlet I Giray of Crimea attacked the town to draw Ivan’s army south, but was driven off.
        lonlat: [37.617, 54.2]
      - kind: siege
        side: ru
        name: Kazan
        date: Late August – 2 October 1552
        text: Mines blew breaches in the walls near the Nogai Gate, and the city was stormed and sacked. Most of its buildings, mosques included, were destroyed.
        lonlat: [49.109, 55.796]
