id: russo-kazan-wars
name: Russo-Kazan Wars
start: "1437"
end: "1552"
tier: B
summary: A series of wars between Moscow and the Kazan khanate on the middle Volga, founded by Ulugh Muhammad after he beat a Muscovite army at Belyov in 1437. For a century they fought mostly over who should rule in Kazan, with Moscow installing friendly khans whenever it could, until Ivan IV besieged and took Kazan in 1552 and annexed the khanate.
countries: [ru, ua]
sides:
  - id: ru
    name: Moscow
    polities: [russia]
    ink: green
    moves: Muscovite moves
    success: Muscovite success
  - id: kaz
    name: Kazan khanate
    polities: [kazan-khanate]
    ink: navy
    moves: Kazan moves
    success: Kazan success
  - id: cr
    name: Crimean khanate
    polities: [crimean-khanate]
    ink: olive
    moves: Crimean moves
    success: Crimean success
notes:
  - Dates are Julian (Old Style), as in the Russian chronicles, which are the main source; Tatar accounts are few. The khanate’s founding is dated variously from 1438 to 1445.
  - Moscow was allied with the Crimean khans from the 1470s until about 1519 and backed the candidates they favoured in Kazan. Later the Crimean Girays put their own relatives on the Kazan throne and the two khanates fought Moscow together.
  - Rebellions in the countryside after the fall of Kazan lasted until 1556.
