        text: Ulugh Muhammad made the town on the Kazanka his capital. The khanate covered much of the old Volga Bulgar lands.
        lonlat: [49.109, 55.796]
      - kind: event
        side: kaz
        name: Moscow
        date: "1439"
        text: The Tatars ravaged the outskirts for ten days and burned Kolomna on their way home.
        lonlat: [37.618, 55.756]
      - kind: taken
        side: kaz
        name: Nizhny Novgorod
        date: "1445"
        text: The Muscovite commanders set the fortress on fire and abandoned it to the Tatars.
        lonlat: [44.008, 56.327]
