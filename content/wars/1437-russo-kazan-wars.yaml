  - title: Khans from Moscow
    date: 1467–1530
    when: "1487-06"
    borders: "1521"
    countries: [ru, ua]
    body:
      - "Moscow and Kazan fought a string of short wars, usually over who should be khan. In 1469 Prince Daniil Kholmsky besieged Kazan and forced Khan Ibrahim to free his Russian captives, and nearly twenty years of peace followed. When Ibrahim died, Ivan III, allied with Mengli Giray of Crimea, backed Ibrahim’s son Muhammad Amin, Mengli’s stepson, against his half-brother Ilham. In 1487 Kholmsky took Kazan after a siege of several weeks. Ilham was sent in chains to Vologda, and for most of the next thirty years Kazan was ruled by khans who were allies or protégés of Moscow."
      - "Muhammad Amin himself broke with Moscow in 1505. The Russian merchants at the Kazan fair were massacred, a Tatar and Nogai army besieged Nizhny Novgorod, and in 1506 a Russian army was routed outside Kazan. In 1521 Sahib Giray, a brother of the Crimean khan, took the throne, and that summer Crimean and Kazan Tatars raided to the outskirts of Moscow and carried off many thousands of captives. Vasily III answered by founding Vasilsursk on the Volga in 1523, banning his subjects from the Kazan fair and sending large armies against Kazan in 1524 and 1530."
    facts:
      - [Kazan taken, "1487, Muhammad Amin installed as khan"]
      - [Arsk Field, "25 June 1506, Tatar victory"]
      - [Crimean and Kazan raid on Moscow, "Summer 1521"]
    markers:
