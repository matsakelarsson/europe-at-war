steps:
  - title: Belyov and Suzdal
    date: 1437–1445
    when: "1437-12-05"
    borders: "1445-07-07"
    countries: [ru]
    body:
      - "Ulugh Muhammad, once khan of the Golden Horde, lost the struggle for its throne and came north with a small army in 1437. When his Tatars, camped near Belyov on the upper Oka, began raiding, Vasily II of Moscow sent his cousins Dmitry Shemyaka and Dmitry Krasny to drive them off. The Tatars held out in a fort of wicker walls packed with snow and frozen with water, and on 5 December 1437, during peace talks, they attacked through a fog and routed the larger Russian army. Ulugh Muhammad moved to the middle Volga and made Kazan the capital of a new khanate."
      - "In 1439 his Tatars ravaged the outskirts of Moscow while Vasily fled across the Volga, and in 1445 they took Nizhny Novgorod. On 7 July 1445, near the Monastery of St Euthymius at Suzdal, the khan’s sons Mahmud and Yakub beat Vasily’s hastily gathered army and took him prisoner. He was freed in the autumn for an enormous ransom, which weakened him in his war with Shemyaka. Two other sons of the khan later entered Vasily’s service, and in 1452 one of them, Qasim, was given the town later named Kasimov, the seat of a Tatar khanate loyal to Moscow."
    facts:
      - [Battle of Belyov, "5 December 1437, Tatar victory"]
      - [Battle of Suzdal, "7 July 1445; Vasily II captured"]
      - [Kazan khanate, "Founded by Ulugh Muhammad, c. 1438–1445"]
    markers:
      - kind: battle
        side: kaz
        name: Battle of Belyov
        date: 5 December 1437
        text: The Russians failed to storm the khan’s ice fort and were surprised during negotiations the next morning.
        lonlat: [36.133, 53.81]
      - kind: event
        side: kaz
