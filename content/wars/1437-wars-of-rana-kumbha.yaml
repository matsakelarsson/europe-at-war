id: wars-of-rana-kumbha
name: Wars of Rana Kumbha
start: "1437"
end: "1468"
tier: C
summary: "The wars of Rana Kumbha, king of Mewar from 1433 to 1468, against the sultans of Malwa and Gujarat. When Sultan Mahmud Khalji of Malwa sheltered Mahpa Panwar, one of the murderers of Kumbha’s father, Kumbha marched against him and defeated him at Sarangpur in 1437; Mewar’s inscriptions say he took the sultan to Chittor as a prisoner and freed him after six months. Mahmud Khalji answered with almost yearly invasions: between 1442 and 1446 he attacked Kumbhalgarh and Chittor and fought indecisive battles at Mandalgarh and on the Banas, in 1444 he took the fort of Gagron, and in 1457 Mandalgarh. Kumbha’s capture of Nagaur in 1456 brought Gujarat into the war, and late that year the two sultans agreed at Champaner to divide Mewar between them. Their armies ravaged the country and besieged Kumbhalgarh, but neither took Kumbhalgarh or Chittor, and Kumbha held his kingdom until his son Udaysimha murdered him in 1468."
