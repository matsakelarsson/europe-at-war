notes:
  - "The Rajput sources (Kumbha’s own inscriptions at Chittor and Kumbhalgarh and later bardic chronicles) and the Persian ones (the Ma’asir-i Mahmud Shahi of Malwa and Firishta) claim most of these battles as victories for their own side. Historians generally see the wars as indecisive: Mewar kept its heartland, while Malwa held the border forts it had taken."
  - The Vijay Stambha (Tower of Victory) at Chittor, built by Kumbha and probably finished between 1458 and 1468, celebrates his victories over Malwa and Gujarat.
