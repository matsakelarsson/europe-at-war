id: eikyo-rebellion
name: Eikyō Rebellion and the Yūki War
start: "1438"
end: "1441"
tier: C
summary: "The war in which the shogun Ashikaga Yoshinori destroyed his kinsman Ashikaga Mochiuji, the Kamakura kubō who governed eastern Japan, followed by a last stand of Mochiuji’s supporters at Yūki castle. Mochiuji had hoped to become shogun himself in 1428 and never accepted Yoshinori: he went on using the old era name after the change to Eikyō, and he quarrelled with his own deputy (Kantō kanrei), Uesugi Norizane, who kept close to Kyoto. In the sixth month of 1438 Mochiuji held the coming-of-age ceremony of his son Yoshihisa without the shogun’s leave, and in the eighth month Norizane fled to his castle of Hirai in Kōzuke. Mochiuji sent troops after him, and Yoshinori, with an imperial edict and banner, ordered Imagawa Norimasa, Ogasawara Masayasu, Uesugi Mochifusa and other lords to march on the Kantō. The shogun’s armies crossed the Ashigara and Hakone passes in the ninth month; Miura Tokitaka, left to guard Kamakura, changed sides and attacked the city, and Mochiuji’s army broke up. Mochiuji surrendered and became a monk, but Yoshinori refused Norizane’s pleas to spare him: on 24 March 1439 Norizane’s troops attacked the temple of Yōan-ji (Eian-ji) in Kamakura, where Mochiuji took his life, and his heir Yoshihisa killed himself at Hōkoku-ji. In the third month of 1440 Yūki Ujitomo of Shimōsa took up the cause of Mochiuji’s younger sons Haruōmaru and Yasuōmaru and rose with other eastern houses. An army under Uesugi Kiyokata besieged Yūki castle from the seventh month, and it fell in the fourth month of 1441; Ujitomo and his son died in the fighting, and the two boys were taken and killed in Mino on Yoshinori’s orders. A younger brother, later Ashikaga Shigeuji, survived and was made Kamakura kubō in 1449. Yoshinori was murdered at a banquet given in Kyoto to celebrate the victory (the Kakitsu incident)."
