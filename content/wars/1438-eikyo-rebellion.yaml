notes:
  - Japanese dates are in the lunar calendar (Eikyō 10 to Kakitsu 1). The Julian date of Mochiuji’s death, 24 March 1439, is the one given on the memorial stone at the site of Yōan-ji.
  - After Mochiuji’s death Norizane retired and his brother Uesugi Kiyokata led the Yamanouchi Uesugi; the Kantō was governed by the Uesugi for the shogunate until the Kamakura office was restored in 1449.
