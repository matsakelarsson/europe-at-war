notes:
  - Dates are Julian, as usual for the period. The Dauphin, later King Louis XI, was leading an army of unemployed mercenaries, the Armagnacs or écorcheurs, left idle by a truce in the Hundred Years’ War; numbers are uncertain.
  - Zurich’s burgomaster Rudolf Stüssi was killed at St. Jakob an der Sihl on 22 July 1443. At Greifensee, which surrendered at the end of May 1444 after a four-week siege, some sixty of the defenders were beheaded, which shocked contemporaries.
  - The war showed that the Confederacy had become a league whose members could not go their own way against the rest. France and the Confederates made peace at Ensisheim in October 1444.
