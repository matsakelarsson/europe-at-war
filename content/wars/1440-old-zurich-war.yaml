id: old-zurich-war
name: Old Zurich War
start: "1440"
end: "1446"
tier: C
summary: A war within the Swiss Confederacy over the lands of the last Count of Toggenburg, who died in 1436 without heir or will. Zurich claimed them against Schwyz and Glarus, was beaten by the other cantons in 1440 and in 1442 allied with the Habsburg king Frederick III. The Confederates routed Zurich at St. Jakob an der Sihl in 1443, besieged the city and in 1444 beheaded the surrendered garrison of Greifensee. Frederick called in France, whose Armagnac mercenaries under the Dauphin Louis wiped out some 1,500 Swiss at St. Jakob an der Birs near Basel on 26 August 1444, but lost so many men that the Dauphin made peace. A truce in 1446 ended the fighting, and in 1450 Zurich rejoined the Confederacy and gave up its alliance with the Habsburgs.
