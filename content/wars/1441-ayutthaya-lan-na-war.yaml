  - title: Chaliang and the peace
    date: 1474–1475
    when: "1474"
    borders: "1474-12-01"
    countries: [th]
    body:
      - In 1474 Trailok retook Chaliang and drove the Lan Na forces from his lands, and in 1475 Tilokarat sent to ask for peace. Neither side had gained much. Lan Na kept Nan and Phrae, Ayutthaya kept the old Sukhothai cities, and the border between them stayed where it had been when the war began. An Ayutthayan court poet celebrated Trailok’s victory in the Lilit Yuan Phai, one of the oldest works of Thai literature.
      - Tilokarat turned to the north and east, campaigning in the Shan states, and in 1477 held a great Buddhist council at Wat Chet Yot in Chiang Mai. He died in 1487 and Trailok in 1488. Fighting between the two kingdoms broke out again in the early sixteenth century, and Lan Na fell to the Burmese in 1558.
