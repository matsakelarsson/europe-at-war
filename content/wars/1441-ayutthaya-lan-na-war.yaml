  - title: The war for the northern cities
    date: 1448–1465
    when: "1460"
    borders: "1460-06-01"
    countries: [th]
    body:
      - Borommaracha II died in 1448 and Ramesuan became king of Ayutthaya as Borommatrailokkanat, usually shortened to Trailok. Soon afterwards Yuthitthira, a prince of the Sukhothai royal line who had expected to be made viceroy in the north, went over to Tilokarat, and with his help Lan Na armies attacked the old Sukhothai cities. The sources give different dates for his defection, 1451 and 1456, and for the campaigns that followed. In 1460 the governor of Chaliang surrendered his city to Tilokarat, and Lan Na attacked Phitsanulok and Kamphaeng Phet.
      - In 1463 Trailok moved his court to Phitsanulok to direct the war, and Phitsanulok remained his seat until his death in 1488. That year Lan Na invaded again; Trailok’s son Intharacha defeated Yuthitthira, but was killed fighting the Lan Na army. In 1465 Trailok was ordained as a Buddhist monk for some months at Wat Chulamani in Phitsanulok, and the fighting died down for some years.
    facts:
      - [Trailok becomes king, "1448"]
      - [Chaliang surrenders to Lan Na, "1460"]
      - [Court moved to Phitsanulok, "1463"]
