id: ayutthaya-lan-na-war
name: Ayutthaya–Lan Na war
start: "1441"
end: "1475"
tier: B
summary: "The long war between the Siamese kingdom of Ayutthaya and the northern Tai kingdom of Lan Na, fought mainly over the old Sukhothai lands of the upper Chao Phraya valley. When Tilokarat seized the throne of Chiang Mai in 1441, his rebel brother’s side called in Borommaracha II of Ayutthaya, whose army was driven back from Chiang Mai in 1442; Tilokarat went on to take Nan and Phrae. After Borommaracha’s son Trailok (Borommatrailokkanat) became king in 1448, a prince of the Sukhothai line, Yuthitthira, went over to Lan Na, and Lan Na armies raided the northern cities; in 1460 the governor of Chaliang (Si Satchanalai) surrendered to Tilokarat. Trailok moved his court to Phitsanulok in 1463 to lead the war, and his son Intharacha was killed fighting the Lan Na army that year. Ayutthaya retook Chaliang in 1474, and in 1475 Tilokarat asked for peace. The war, celebrated on the Ayutthayan side in the poem Lilit Yuan Phai, left the border much as it had been."
countries: [th]
sides:
  - id: ay
    name: Ayutthaya
    polities: [ayutthaya]
    ink: blue
    moves: Ayutthayan moves
    success: Ayutthayan success
  - id: ln
    name: Lan Na
    polities: [lan-na]
    ink: magenta
    moves: Lan Na moves
    success: Lan Na success
notes:
  - The war is known from the Ayutthaya chronicles and from the Lan Na chronicles (the Chiang Mai Chronicle and the Jinakalamali), which date many events differently, sometimes by several years; the dates here are those most often given in modern accounts. Yuthitthira’s name is also written Yutthisathian and Yutthitthira.
  - Chaliang is the city later called Sawankhalok and today known as Si Satchanalai. The Siamese called the people of Lan Na “Yuan”, hence the title of the poem Yuan Phai, “the defeat of the Yuan”.
