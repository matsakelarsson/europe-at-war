steps:
  - title: Tilokarat and the first Ayutthayan invasion
    date: 1438–1449
    when: "1442"
    borders: "1442-06-01"
    countries: [th]
    body:
      - In 1438, when the last king of Sukhothai died, Borommaracha II of Ayutthaya annexed his kingdom and made his own young son Ramesuan its viceroy at Phitsanulok, bringing Ayutthaya to the borders of Lan Na. In Chiang Mai in 1441 Thao Lok, a son of King Sam Fang Kaen, seized the palace with the help of an official while his father was away, and became king as Tilokarat. His brother Thao Choi rose against him at Fang; defeated, he fled to Thoeng and was killed there, and his followers appealed to Ayutthaya for help.
      - Borommaracha marched north and, in 1442 by most accounts, attacked Chiang Mai. Lan Na raiders crept into his camp at night and cut loose his war elephants, and the Ayutthayan army withdrew. Tilokarat then took the principalities of Nan and Phrae, using guns in the siege of Nan by some accounts, and Lan Na emerged from these years as the leading power of the north.
    facts:
      - [Tilokarat seizes the throne, "1441"]
      - [Ayutthayan attack on Chiang Mai, "1442, repulsed"]
