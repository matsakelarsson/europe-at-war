notes:
  - "The date is uncertain. Landa, writing in the 1560s from Maya informants, put the fall about a century before his time, and the Books of Chilam Balam place it in a katun 8 Ahau, a twenty-year period that ran from about 1441 to 1461; some archaeologists date the end of the city to about 1450 or later. The colonial accounts came largely from the Xiu, who allied with the Spaniards, and from the Spaniards themselves, and they are unfavourable to the Cocom."
