id: fall-of-mayapan
name: Fall of Mayapan
start: "1441"
end: "1441"
tier: C
summary: "The revolt that destroyed Mayapan, the walled city in northern Yucatán that had been the seat of a league of Maya lords since about 1220. The Cocom lineage ruled the city, with the lords of the provinces living there and mercenaries from Tabasco, whom the Maya called Ah Canul, keeping order. According to Diego de Landa and the Maya chronicles, the Xiu lineage, led by Ah Xiu Xupan, rose against the Cocom ruler, whom they accused of tyranny and of bringing in the foreign troops, and in about 1441 killed every Cocom lord in the city except one son who was away trading in Honduras. Mayapan was sacked, burned and abandoned. Excavations have found burned buildings and a mass grave at the foot of the Temple of Kukulcan with bodies that show stab wounds and other violence, radiocarbon-dated to the mid-1400s; a stalagmite from a cave under the temple records a drought from the late 1300s, and the city’s population was already falling. After the fall, northern Yucatán broke up into some sixteen to eighteen independent provinces ruled by lineages: the Xiu at Maní, the surviving Cocom at Sotuta, the Chel at Tecoh and others. Their rivalries, above all the feud between the Xiu and the Cocom, were still alive when the Spaniards came in the 1520s."
