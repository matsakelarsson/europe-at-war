notes:
  - Japanese dates are in the lunar calendar; the Julian dates of the murder (12 July 1441) and of Mitsusuke’s death (25 September 1441) are those given in English sources.
  - Mitsusuke’s son Noriyasu escaped from Shiroyama but was killed in Ise soon after. The Akamatsu house was restored under Akamatsu Masanori after 1458.
