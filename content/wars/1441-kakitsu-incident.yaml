id: kakitsu-incident
name: Kakitsu Incident
start: "1441-07-12"
end: "1441-09-25"
tier: C
summary: "The murder of the shogun Ashikaga Yoshinori by Akamatsu Mitsusuke, and the campaign that destroyed the Akamatsu. Yoshinori, chosen by lot in 1428, ruled harshly: he meddled in the successions of the great houses, crushed the Kamakura kubō in 1439, and punished courtiers and warriors for small offences, so that a contemporary diarist wrote of “terror for all men”. Mitsusuke, governor of Harima, Bizen and Mimasaka and one of the senior lords, feared that his provinces would go to a favoured kinsman, Akamatsu Sadamura. On 12 July 1441 (the 24th day of the sixth month of Kakitsu 1) his son Noriyasu invited the shogun and many lords to his house in Kyoto to celebrate the victory at Yūki castle. During a performance armed men burst in and killed Yoshinori; several of his companions, among them Kyōgoku Takakazu and Ōuchi Mochiyo, died or were mortally wounded, and the other guests were let go. Mitsusuke set fire to his house and withdrew to Harima with the shogun’s head, set up a descendant of Ashikaga Tadafuyu, Ashikaga Yoshitaka, as a rival lord, and waited. The leaders in Kyoto were slow to act; Yoshinori’s eight-year-old son Yoshikatsu was named shogun, and the court issued an order to punish the Akamatsu only after a delay. Armies under Yamana Mochitoyo (later known as Sōzen) and Hosokawa Mochitsune invaded Harima and Mimasaka in the seventh and eighth months, the Akamatsu’s men deserted, and on 25 September 1441 Mitsusuke took his own life in Shiroyama castle near Tatsuno. The Yamana took Harima, Bizen and Mimasaka, which made them the rivals of the Hosokawa, and in the confusion a great debt rising (the Kakitsu tokusei ikki) forced the shogunate to cancel debts. With child shoguns the shogunate never regained Yoshinori’s power."
