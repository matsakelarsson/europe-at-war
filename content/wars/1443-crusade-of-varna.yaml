id: crusade-of-varna
name: Crusade of Varna
start: "1443-10"
end: "1444-11-10"
tier: B
summary: The last great crusade against the Ottomans in the Balkans, led by Władysław III, king of Poland and Hungary, and John Hunyadi. Their “long campaign” of 1443 reached the Balkan Mountains before winter drove them back, and in 1444 Sultan Murad II agreed to a ten-year truce that restored the Serbian despotate. Urged on by the papal legate, the king renounced the truce and marched to the Black Sea, where on 10 November 1444 the crusaders were crushed at Varna and Władysław was killed.
countries: [hu, pl, rs, bg, ro, tr]
