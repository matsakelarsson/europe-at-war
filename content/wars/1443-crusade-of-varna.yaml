steps:
  - title: The long campaign
    date: October 1443 – February 1444
    when: "1443-10"
    borders: "1443-12"
    countries: [hu, rs, bg]
    body:
      - Since 1439 the Ottomans had annexed the Serbian despotate and besieged Belgrade, and Hunyadi, the voivode of Transylvania, had beaten their raiders in 1441 and 1442. Pope Eugene IV proclaimed a crusade on 1 January 1443, and in October Władysław, Hunyadi and the exiled despot Đurađ Branković crossed into Serbia with a Hungarian, Polish and Serbian army, counting on the Ottoman cavalry having gone home after the harvest. Hunyadi’s vanguard defeated the Ottoman forces near Niš on 2 or 3 November, and the crusaders marched on to Sofia. In the confusion, Skanderbeg and his Albanians left the Ottoman army and rode home to Krujë.
      - Beyond Sofia the Ottomans burned the countryside and blocked the passes over the Balkan Mountains. On 12 December, in deep snow and bitter cold, the crusaders failed to break through at the Zlatitsa pass and turned back. On 2 or 5 January 1444 they ambushed their pursuers at Kunovica, between Niš and Pirot, and captured Mahmud Bey, the sultan’s brother-in-law and brother of the grand vizier. The army reached Buda in February to a heroes’ welcome; the setback at Zlatitsa was played down.
    facts:
      - [Battle of Niš, "2 or 3 November 1443, crusader victory"]
      - [Zlatitsa pass, "12 December 1443, crusaders turned back"]
      - [Battle of Kunovica, "2 or 5 January 1444, crusader victory"]
