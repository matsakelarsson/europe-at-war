    name: Hungary, Poland and Wallachia
    polities: [hungary, poland, wallachia]
    ink: olive
    moves: Crusader moves
    success: Crusader success
  - id: ser
    name: Đurađ Branković of Serbia
    polities: [serbia]
    ink: red
