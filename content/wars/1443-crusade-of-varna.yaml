  - title: Szeged and the broken truce
    date: June – September 1444
    when: "1444-06-12"
    borders: "1444-08-22"
    countries: [hu, rs, tr]
    body:
      - Under pressure from his Serbian wife Mara and from Mahmud Bey’s family, and threatened by Karaman in Anatolia, Murad II offered peace. The terms agreed at Edirne on 12 June 1444 returned the Serbian despotate, with Smederevo, Golubac and some two dozen towns, to Branković as an Ottoman vassal, released his two blinded sons and set a ten-year truce with Hungary. At the same time, Cardinal Julian Cesarini, the papal legate, kept pressing for a new crusade, and the Venetians and the pope were preparing a fleet to close the straits.
      - On 4 August, with Cesarini’s help, Władysław swore in advance that he renounced any treaty he had made or would make with the sultan, and on 15 August the truce was ratified by oath. Branković took back Serbia on 22 August and stayed out of the coming fight. Murad, believing the peace secure, gave up the throne to his twelve-year-old son Mehmed II and retired. On 20 September the crusading army set out from Szeged, crossed the Danube and marched east along its southern bank, joined near Nicopolis by Wallachian cavalry under Mircea, son of Vlad Dracul.
    facts:
      - [Treaty agreed at Edirne, 12 June 1444]
      - [Truce ratified, 15 August 1444]
      - [Serbia restored to Branković, 22 August 1444]
    markers:
      - kind: treaty
        name: Edirne
        date: 12 June 1444
        text: The sultan swore to a ten-year truce and the restoration of Serbia; the text was sent to Hungary for ratification.
        lonlat: [26.556, 41.677]
      - kind: treaty
        name: Szeged
        date: August 1444
        text: The Ottoman envoys met the king here. The treaty is known as the Peace of Szeged, although the oaths may have been taken at Várad.
        lonlat: [20.145, 46.255]
      - kind: held
        side: ser
        name: Smederevo
        date: 22 August 1444
        text: Returned to Branković under the truce, with the rest of the despotate.
        lonlat: [20.928, 44.669]
    arrows:
      - side: cru
        label: Crusaders
        via: [[20.15, 46.2], [22.4, 44.7], [23.0, 43.95], [24.85, 43.72]]
  - title: Varna
    date: October – November 1444
    when: "1444-10-18"
    borders: "1444-11-10"
    countries: [bg, hu, pl, ro, tr]
    body:
      - The Christian fleet failed to stop Murad, recalled from retirement, from bringing his Anatolian army across the Bosporus on 18 October, and he marched north to cut the crusaders off. On 9 November they found him behind them near Varna, trapped between the sea, Lake Varna and the hills. Hunyadi drew up the army in an arc between the lake and the heights, with the wagon fort behind.
      - On 10 November the Ottoman light cavalry drove in the crusader right wing, many of whom died in the marshes; Cesarini disappeared in the rout. Hunyadi held the left, but the twenty-year-old king, ignoring his advice, charged the janissaries in the Ottoman centre with his Polish household knights. Władysław was killed and his head was shown to his army, which broke. Hunyadi escaped, only to be held for a time in Wallachia by Vlad Dracul. Thousands of crusaders were killed or captured, and no Western army would try again to drive the Ottomans out of the Balkans for many years.
    facts:
      - [Murad crosses the Bosporus, 18 October 1444]
      - [Battle of Varna, "10 November 1444, Ottoman victory"]
      - [Killed, "King Władysław III and Cardinal Cesarini"]
    markers:
      - kind: battle
        side: ott
        name: Battle of Varna
        date: 10 November 1444
        text: The king fell in a charge on the janissaries guarding Murad. His head was carried on a lance and the crusaders broke.
        lonlat: [27.883, 43.217]
      - kind: event
        side: ott
        name: Bosporus
        date: 18 October 1444
        text: Murad’s army crossed from Asia here; the Venetian, papal and Burgundian ships failed to stop it.
        lonlat: [29.065, 41.083]
        lp: r
