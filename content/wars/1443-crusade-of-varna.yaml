    ink: teal
    moves: Ottoman moves
    success: Ottoman success
notes:
  - The size of the armies is uncertain. The crusaders probably had about 20,000 men in 1444, including several thousand Wallachians; estimates for Murad’s army at Varna range from 40,000 to 60,000 or more.
  - Whether the king broke his word is still argued over. Before the truce was sworn, Cardinal Cesarini had Władysław declare in advance that any treaty with the sultan was void, so that it could be ratified without stopping the crusade. Ottoman tradition says that Murad fought at Varna with the broken treaty fixed to his standard.
  - Władysław’s death was not witnessed by his own men and his body was never found, which gave rise to legends that he survived.
