        lonlat: [24.1, 42.75]
      - kind: battle
        side: cru
        name: Kunovica
        date: 2 or 5 January 1444
        text: The retreating crusaders ambushed the pursuing Ottomans in the hills and took many prisoners, among them Mahmud Bey.
        lonlat: [22.176, 43.18]
        lp: b
