  - title: Albulena and the later sieges
    date: 1451–1467
    when: "1451-03"
    borders: "1467-04-23"
    countries: [al, mk, it]
    body:
      - Short of money after the siege, Skanderbeg allied with King Alfonso V of Naples by the Treaty of Gaeta in March 1451, accepting him as overlord in return for troops and supplies. In 1455 he lost much of his cavalry in a surprise attack while besieging Berat, and in 1456 his nephew Hamza, who had lost hope of succeeding him, went over to the Ottomans. In 1457 a large Ottoman army under Isa Bey and Hamza ravaged the lowlands and camped at Albulena (Ujëbardha), between Lezhë and Krujë. Having hidden in the mountains for weeks, Skanderbeg fell on the camp on 2 September and routed the army. Pope Calixtus III named him captain-general of the Holy See.
      - After an expedition to Italy in 1460–1462 to help Alfonso’s son Ferdinand against his rivals, and a short-lived truce with Mehmed in the spring of 1463, Skanderbeg returned to war later that year, now allied with Venice. In 1466 Mehmed II besieged Krujë in person and, when it held, built the fortress of Elbasan in the plain to keep it under pressure. Skanderbeg, back from seeking aid in Rome and Naples, attacked the besiegers with Lekë Dukagjini in April 1467; their commander Ballaban Pasha was killed on 23 April, and the siege was broken. Mehmed came back that summer and laid waste much of the country, but Krujë still held.
    facts:
      - [Treaty of Gaeta, "26 March 1451"]
      - [Battle of Albulena, "2 September 1457, Albanian victory"]
      - [Second siege of Krujë, "June 1466 – 23 April 1467"]
    markers:
      - kind: battle
        side: alb
        name: Albulena
        date: 2 September 1457
        text: Skanderbeg surprised the Ottoman camp in the plain of Ujëbardha and took its baggage and standards. Hamza Kastrioti was captured.
        lonlat: [19.718, 41.602]
        lp: l
      - kind: battle
