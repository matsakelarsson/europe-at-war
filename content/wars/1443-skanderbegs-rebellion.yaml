steps:
  - title: Krujë and the League of Lezhë
    date: 1443–1450
    when: "1443-11-28"
    borders: "1450-10"
    countries: [al, mk]
    body:
      - Skanderbeg, son of the Albanian lord Gjon Kastrioti, had been sent to the Ottoman court as a hostage and rose high in the sultan’s service. In November 1443, during the Hungarian crusade, he left the Ottoman army with a few hundred Albanians, and on 28 November he took Krujë, his family’s old stronghold, with a forged order from the sultan. He returned to Christianity and raised a red flag with a black double-headed eagle. On 2 March 1444, at Venetian-held Lezhë, the leading Albanian families formed an alliance under his command, known as the League of Lezhë.
      - On 29 June 1444 Skanderbeg defeated an Ottoman army at Torvioll, using a force hidden in the woods to fall on its flank, and in 1446 he won again at Otonetë. A quarrel over the inheritance of the fortress of Dagnum led to war with Venice in 1447–1448, while the Ottomans took the border fortress of Svetigrad in 1448 and Berat in 1450. In May 1450 Murad II himself, with his son Mehmed, besieged Krujë. While Vrana Konti held the castle, Skanderbeg harried the besiegers from the mountains, and in the autumn, after costly assaults had failed, Murad withdrew.
    facts:
      - [Krujë seized, 28 November 1443]
      - [League of Lezhë, 2 March 1444]
      - [First siege of Krujë, "May – autumn 1450, Ottomans withdraw"]
