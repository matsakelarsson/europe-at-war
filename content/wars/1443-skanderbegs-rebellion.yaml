        text: The defenders of Rozafa castle beat off every assault and were blockaded until Venice ceded the town by treaty.
        lonlat: [19.512, 42.068]
      - kind: taken
        side: ott
        name: Drisht
        date: "1478"
        text: Stormed during the siege of Shkodër; many of its people were killed.
        lonlat: [19.591, 42.123]
        lp: r
    arrows:
