  - title: The fall of Krujë and Shkodër
    date: 1468–1479
    when: "1468-01-17"
    borders: "1479-04-25"
    countries: [al, me]
    body:
      - In January 1468 Skanderbeg called the remaining Albanian lords to Lezhë to plan the war, but he fell ill, perhaps with malaria, and died there on 17 January, aged about 62. His widow and young son fled to Italy, and Venice took over Krujë and carried on the war with the help of Albanian and Montenegrin lords such as Lekë Dukagjini and Ivan Crnojević. In 1474 the Ottomans besieged Venetian Shkodër for three months without success.
      - In 1477 Ottoman troops blockaded Krujë, and in September they routed a Venetian and Albanian relief army. Starving, the town surrendered on 15 or 16 June 1478, and many of its defenders are said to have been killed despite promises of safety. Mehmed II then besieged Shkodër in person; its small garrison beat off five great assaults in July, so the sultan took the nearby forts of Žabljak, Drisht and Lezhë, left an army to blockade the town and went home. In the peace of 25 January 1479 Venice gave up Shkodër, and in April its surviving defenders sailed for Venice. Of Venetian Albania only Durrës and a few coastal places were left.
    facts:
      - [Death of Skanderbeg, 17 January 1468]
      - [Fall of Krujë, "15 or 16 June 1478"]
      - [Shkodër handed over, April 1479]
    markers:
      - kind: event
        side: alb
        name: Lezhë
        date: 17 January 1468
        text: Skanderbeg died here and was buried in the cathedral of St Nicholas. Lezhë fell to the Ottomans in 1478.
        lonlat: [19.644, 41.782]
        lp: l
      - kind: taken
        side: ott
        name: Krujë
        date: June 1478
        text: After more than a year of blockade the starving Venetian garrison surrendered to Mehmed II.
        lonlat: [19.793, 41.511]
