notes:
  - The main narrative source, Marin Barleti’s life of Skanderbeg written about forty years after his death, is a heroic biography, and its figures for Ottoman armies and losses, often repeated, are much exaggerated. Modern estimates are given here where they exist; Ottoman, Venetian and Ragusan documents give a more sober picture.
  - The League of Lezhë was a loose alliance of noble families. Several of its members, including Skanderbeg’s own nephew Hamza, changed sides at times, and Venice fought against Skanderbeg in 1447–1448 before becoming his ally in 1463.
