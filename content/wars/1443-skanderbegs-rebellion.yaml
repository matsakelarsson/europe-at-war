id: skanderbegs-rebellion
name: Skanderbeg’s rebellion
start: "1443-11-28"
end: "1479-04-25"
tier: B
summary: The Albanian revolt against the Ottomans led by Gjergj Kastrioti, called Skanderbeg, a former Ottoman commander who seized Krujë in 1443. With the League of Lezhë, and later with help from Naples, the papacy and Venice, he held the mountains of northern and central Albania for a quarter of a century, beating several Ottoman armies and twice seeing sultans fail before Krujë. After his death in 1468 the struggle went on under Venetian leadership until Krujë fell in 1478 and Venice gave up Shkodër in 1479.
