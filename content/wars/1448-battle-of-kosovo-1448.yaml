id: battle-of-kosovo-1448
name: Second Battle of Kosovo
start: "1448-10-17"
end: "1448-10-20"
tier: C
summary: A three-day battle on the Field of Blackbirds in Kosovo, where Sultan Murad II defeated a Hungarian-led army under the regent John Hunyadi on the same ground as the battle of 1389. Seeking revenge for Varna, Hunyadi crossed the Danube in September 1448 with Hungarians, Wallachians and German and Bohemian mercenaries, hoping to join Skanderbeg’s Albanians, who were held up on the way; the Serbian despot Đurađ Branković, bound by his truce with the Ottomans, refused to join. Fighting from a wagon fort from 17 October, Hunyadi’s army was worn down by the larger Ottoman army, in which the young Mehmed fought his first battle; on the third day the Wallachians went over to the sultan, by some accounts, and the rest of the army was destroyed. Hunyadi escaped but was held prisoner by Branković until he paid a ransom. It was the last great Hungarian offensive into the Balkans for decades.
