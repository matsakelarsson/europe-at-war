  - title: The return of the former emperor
    date: 1450–1457
    when: "1450-09"
    borders: "1450-09-07"
    countries: [cn, mn]
    body:
      - Oirat raids continued through the winter and spring, and the Datong commander Guo Deng won a name by beating Oirat bands in early 1450. Esen gained little from holding the emperor, since the court had a new one, and his men wanted the trade that the war had cut off. In the summer of 1450 the envoy Yang Shan reached Esen’s camp and secured the captive’s release without a ransom. The former emperor left the Oirats on 7 September and was back in Beijing in the middle of the month, after more than a year in captivity. The Jingtai Emperor received him coolly and kept him in the Southern Palace for six and a half years.
      - Esen’s position on the steppe weakened. He fought and defeated his khan, Toghtoa Bukha, who was killed while fleeing in early 1452, proclaimed himself khan of the Great Yuan in 1453, the first non-Chinggisid to take the title, and was killed by one of his own men in 1454 or 1455. Oirat power in Mongolia collapsed with him.
      - In February 1457, when the Jingtai Emperor was ill, a group of generals and officials restored the former emperor in a palace coup. Yu Qian was accused of treason and executed; he was rehabilitated a decade later. The crisis ended the early Ming policy of campaigning on the steppe. The court turned to defending the frontier, and over the following century and a half the walls that became the Great Wall of today were built along it.
    facts:
      - [Release of the former emperor, "September 1450"]
      - [Esen proclaims himself khan, "1453"]
      - [Restoration of Yingzong, "11 February 1457"]
