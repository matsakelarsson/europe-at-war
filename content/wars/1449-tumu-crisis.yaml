  - title: The emperor’s march to Datong
    date: 4–30 August 1449
    when: "1449-08-04"
    borders: "1449-08-18"
    countries: [cn]
    body:
      - The army left Beijing on 4 August after only four days of preparation. Its size is traditionally put at half a million men; it was certainly very large and poorly supplied. The emperor was accompanied by some twenty senior generals and as many high officials, including the ministers of war and revenue, but Wang Zhen gave the orders. The army passed through the Juyong Pass on 7 August and reached Xuanfu on 11 August, slowed by heavy rain.
      - On 16 August it crossed the battlefield of Yanghe, still covered with the bodies of the Datong army, and on 18 August it reached Datong. Esen had withdrawn north of the frontier. On reports of the scale of the losses and on the advice of the eunuch commander at Datong, Wang Zhen declared the expedition a success and ordered a retreat on 20 August.
      - Wang Zhen at first meant to return by a southern route through his home district of Yuzhou (Yuxian), then turned back to the road by which the army had come, apparently to spare his estates from the passing troops. The army, short of food and losing discipline, was back at Xuanfu on 27 August. Esen’s horsemen followed it.
    facts:
      - [Departure from Beijing, "4 August 1449"]
      - [At Datong, "18–20 August 1449"]
      - [Back at Xuanfu, "27 August 1449"]
