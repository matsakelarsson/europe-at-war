  - title: A new emperor in Beijing
    date: September 1449
    when: "1449-09-22"
    borders: "1449-09-22"
    countries: [cn]
    body:
      - The news reached Beijing on the night of 2–3 September. The empress dowager and the empress sent treasure to Esen to ransom the emperor. Fewer than 100,000 troops, many of them poor, were left in the capital, and at a meeting of the court the official Xu Cheng (later Xu Youzhen) proposed moving the government south to Nanjing. Yu Qian, now acting minister of war, answered that whoever spoke of moving south should be executed, recalling the fate of the Song court in 1127, and the court decided to stay.
      - The empress dowager made the Prince of Cheng regent and named the captive emperor’s two-year-old son heir. Wang Zhen’s family was killed and his property confiscated. Yu Qian, appointed minister of war, brought grain from the depots at Tongzhou into the city and summoned troops from Shandong, Henan and the south. To deny Esen the advantage of holding the emperor, the officials pressed the prince to take the throne, and on 22 September he was enthroned as the Jingtai Emperor, with his captive brother given the honorary title of “Grand Emperor Emeritus”.
      - Esen brought his prisoner to the gates of Xuanfu and Datong and demanded that they be opened in the emperor’s name. The defenders of Xuanfu refused; at Datong the commanders Guo Deng and Liu An kept the gates shut but gave the emperor the city’s silver, which he handed to the Oirat chiefs.
    facts:
      - [News of Tumu in Beijing, "2–3 September 1449"]
      - [Yu Qian minister of war, "September 1449"]
      - [Jingtai Emperor enthroned, "22 September 1449"]
