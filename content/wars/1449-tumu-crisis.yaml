steps:
  - title: Esen and the Ming frontier
    date: 1439–1449
    when: "1449-02"
    borders: "1449-06-01"
    countries: [cn, mn]
    body:
      - After the expulsion of the Yuan in 1368 the Mongols split into the Eastern Mongols, whose khans claimed the Yuan succession, and the Oirats of the west. In the 1430s the Oirat leader Toghon took control of both and set up a Chinggisid, Toghtoa Bukha, as khan, keeping the real power himself with the title of taishi. His son Esen succeeded him in about 1439 and extended Oirat power from Hami and the oases of the Tarim basin in the west to the Uriankhai of the Three Guards and the Jurchens on the borders of Korea in the east.
      - The Mongols needed Chinese grain, tea, silk and metal goods, and obtained them through tribute missions and frontier markets, chiefly at Datong, where they exchanged horses. Esen’s missions grew to more than 2,000 men, all fed and rewarded at Ming expense. In 1449 the Ming court, where the eunuch Wang Zhen dominated the young Zhengtong Emperor, cut the gifts and the price paid for horses and refused Esen’s request for a Ming princess as a bride for his son.
      - Ming defences had decayed since the Yongle Emperor’s campaigns. Only about half of the soldiers on the garrison registers were actually serving, and the forward posts on the steppe had been given up. The frontier was held by the walled cities of Xuanfu and Datong, guarding the approaches to Beijing, which had been the capital since 1421.
    facts:
      - [Esen becomes taishi, "about 1439"]
      - [Nominal khan, "Toghtoa Bukha (Taisun Khan)"]
      - [Ming emperor, "Zhengtong (Zhu Qizhen), aged 22 in 1449"]
