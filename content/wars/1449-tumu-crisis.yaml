  - title: Tumu
    date: 30 August – 1 September 1449
    when: "1449-09-01"
    borders: "1449-09-01"
    countries: [cn]
    body:
      - On 30 August the Oirats caught the rearguard east of Xuanfu. The brothers Wu Kezhong and Wu Keqin were killed, and a relief force of cavalry under the duke of Chengguo, Zhu Yong, put at 40,000 men, rode into an ambush at the pass of Yao’erling and was wiped out. On 31 August the main army camped at the post station of Tumu. The walled town of Huailai was only about 10 km further on, but Wang Zhen, waiting for his baggage train, would not go on. The camp was on high ground without water.
      - Esen’s horsemen took the river to the south and surrounded the camp. After a day without water the Ming army was offered talks, and on the morning of 1 September Wang Zhen ordered it to move towards the river. As the lines broke up, the Oirats charged. Only about 20,000 Oirat horsemen are said to have taken part, and the thirsty Ming troops collapsed. Wang Zhen was killed, according to some accounts by his own officers.
      - The dead included the duke of Yingguo, Zhang Fu, who had led the Ming conquest of Vietnam in 1406–1407, two ministers, the grand secretaries Cao Nai and Zhang Yi and dozens of nobles, generals and officials; the History of Ming speaks of several hundred thousand dead, an unverifiable figure. The Oirats took large numbers of horses, weapons and armour. The emperor, who had stayed seated amid the slaughter, was taken alive and brought to Esen’s camp on 3 September. Esen, who had not expected such a prize, spared him and sent word to Beijing.
    facts:
      - [Rearguard destroyed, "30 August 1449"]
      - [Battle of Tumu, "1 September 1449, Oirat victory"]
      - [Emperor taken to Esen’s camp, "3 September 1449"]
