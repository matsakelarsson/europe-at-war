  - title: The defence of Beijing
    date: October – November 1449
    when: "1449-10-27"
    borders: "1449-10-29"
    countries: [cn]
    body:
      - In October Esen returned, saying that he was bringing the emperor home. He was at Datong on 17 October and, turning away from the strongly held Juyong Pass, broke through the Zijing Pass south-west of Beijing on 25 October after several days of resistance; its commander, Sun Xiang, was killed. On 27 October the Oirats, about 70,000 strong, reached the walls of Beijing.
      - Yu Qian had gathered about 220,000 men. He put the generals Shi Heng and others outside the nine gates instead of behind the walls, and had the gates shut behind them. On 27 October the commanders Gao Li and Mao Fushou drove off an attack at the Zhangyi Gate. On 29 October the Oirats attacked the Desheng Gate on the north side, where Shi Heng had hidden troops with firearms in empty houses; the attackers were lured in by a feigned retreat and caught by gunfire and flank attacks, and Esen’s younger brother was among the dead. Sun Tang held the Xizhi Gate with help from Shi Heng, and on 30 October an attack at the Zhangyi Gate was driven back with the help of townspeople throwing bricks and stones from the roofs.
      - Esen asked for talks and a ransom, but the court would only send envoys of low rank. On 31 October, after five days at the walls, with Ming reinforcements approaching and an attack on the Juyong Pass beaten off, he withdrew, plundering as he went, and left through the Zijing Pass on 2 November. A few days later Toghtoa Bukha sent tribute to the Ming court.
    facts:
      - [Zijing Pass taken, "25 October 1449"]
      - [Oirats at Beijing, "27–31 October 1449"]
      - [Forces, "about 220,000 Ming against about 70,000 Oirats"]
      - [Oirats leave through the Zijing Pass, "2 November 1449"]
