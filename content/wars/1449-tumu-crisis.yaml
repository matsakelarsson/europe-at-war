id: tumu-crisis
name: Tumu crisis
start: "1449-07"
end: "1450-09"
tier: A
summary: "The Oirat invasion of Ming China in 1449, in which the Zhengtong Emperor was captured. Esen, the Oirat taishi who had made himself master of the Mongolian steppe, attacked the Ming frontier in July 1449 after quarrels over the tribute trade and a refused marriage alliance. Urged on by the eunuch Wang Zhen, the 22-year-old emperor led a hastily gathered army out of Beijing, marched to Datong and turned back, and on 1 September 1449 his army was surrounded and destroyed at the post station of Tumu, about 90 km north-west of Beijing. Wang Zhen and many of the highest officials were killed and the emperor was taken prisoner. In Beijing the minister of war Yu Qian refused to abandon the capital, the emperor’s half-brother was enthroned as the Jingtai Emperor, and when Esen came to the walls in October 1449 he was beaten back within five days. Esen released the former emperor in September 1450, gaining little from his victory. No territory changed hands, but the defeat ended Ming campaigns on the steppe and turned the dynasty to defending the frontier with walls."
countries: [cn, mn]
sides:
  - id: mg
    name: Ming China
    polities: [ming]
    ink: red
    moves: Ming moves
    success: Ming success
  - id: oi
    name: Oirats and Mongols under Esen and Toghtoa Bukha
    polities: [oirats, northern-yuan]
    ink: brown
    moves: Oirat and Mongol moves
    success: Oirat success
notes:
  - The Ming records give dates in the Chinese lunar calendar with cyclical day names. They are given here converted to the Julian calendar, as in most English accounts, so that the battle at Tumu falls on 1 September 1449 (the 15th day of the 8th month of the 14th year of Zhengtong).
  - The size of the emperor’s army is traditionally given as 500,000 men, a figure most historians think greatly exaggerated; the History of Ming says “several hundred thousand” died at Tumu. Esen is said to have engaged only about 20,000 horsemen in the battle itself. All numbers are uncertain.
  - The emperor reigned as Zhengtong (1436–1449) and again as Tianshun (1457–1464); he is known by his temple name, Yingzong. His half-brother Zhu Qiyu reigned as the Jingtai Emperor (1449–1457). Ming sources call the Oirats Wala and the Eastern Mongols Dada (Tatars).
