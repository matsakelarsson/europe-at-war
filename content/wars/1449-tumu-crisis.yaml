  - title: The Oirat invasion
    date: July 1449
    when: "1449-07-30"
    borders: "1449-07-30"
    countries: [cn, mn]
    body:
      - In July 1449 Esen invaded along the whole frontier. The khan Toghtoa Bukha led the eastern column with the Uriankhai into Liaodong, the chancellor Alag attacked Xuanfu and the passes north of Beijing, and Esen himself marched on Datong. A smaller force raided Ganzhou (Zhangye) in the Gansu corridor. The aim seems to have been plunder and pressure for better terms of trade rather than conquest.
      - Datong was attacked on 30 July and the assistant commander Wu Hao was killed. On 3 August the Datong army under the marquis of Xining, Song Ying, and the earl of Wujin, Zhu Mian, was destroyed at Yanghe and both commanders died. The news reached Beijing in pieces, and on 30 July the emperor announced that he would lead an army against the Oirats in person.
      - The ministers protested. The minister of war Kuang Ye and his deputy Yu Qian argued that the army was not ready, the minister of personnel Wang Zhi led the court in a memorial against the campaign, and one official tried to block the emperor’s palanquin. Wang Zhen, who expected an easy victory, prevailed, and the emperor’s half-brother Zhu Qiyu, Prince of Cheng, was left in charge of the capital.
    facts:
      - [Datong attacked, "30 July 1449"]
      - [Battle of Yanghe, "3 August 1449, Oirat victory"]
