id: flower-wars
name: Flower wars
start: "1450"
end: "1519"
tier: C
summary: "The xochiyaoyotl or “flower wars” fought for some seventy years between the Aztec Triple Alliance and the Nahua city-states of the Puebla–Tlaxcala valley east of the volcanoes: Tlaxcala, Huexotzinco and Cholula, with smaller towns such as Atlixco. The Texcocan chronicler Fernando de Alva Ixtlilxochitl, writing about 1600, says they began after the drought and famine of 1450–1454, when the rulers agreed to fight regular battles so that captives could be sacrificed to the gods. Unlike the empire’s wars of conquest, they were fought by appointment on a chosen field, with equal numbers on each side, mostly nobles, and with hand weapons rather than darts and slings, so that warriors could show their skill and take prisoners; they could be fought at any time of year. Moctezuma II told one of Cortés’s captains, Andrés de Tapia, that the empire could have conquered Tlaxcala but kept the war going to train its warriors and supply captives. Historians disagree on how far to believe this: Ross Hassig sees the flower wars as a cheap way of wearing down enemies too strong to conquer at once while the empire surrounded them, and the Tlaxcalan historian Diego Muñoz Camargo records that the Aztecs besieged Tlaxcalan towns and cut off their trade. Over time the wars became bloodier, the alliance of the valley towns frayed, and in about 1517 Cholula left the Tlaxcalan alliance and went over to the Aztecs. Tlaxcala’s long war with the Triple Alliance made it the Spaniards’ most important ally in 1519."
