notes:
  - "The term and its meaning are debated. Much of what is known comes from sources written after the Spanish conquest by authors from Texcoco, Tlaxcala and Tenochtitlan, each with reasons to explain why Tlaxcala was never conquered; the account of the origin rests on Alva Ixtlilxochitl alone. The dates are approximate."
