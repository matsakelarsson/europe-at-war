id: hausa-wars
name: Wars of the Hausa kingdoms
start: "1450"
end: "1650"
tier: C
summary: "Wars among the Hausa kingdoms of today’s northern Nigeria and southern Niger, and with the empires around them, from about 1450 to 1650, as the Kano Chronicle and other Hausa, Bornu and Timbuktu writings tell them. Kano, Katsina, Zazzau (Zaria), Gobir and the other walled city-states grew rich on the trade between the forest and the Sahara and fought one another for routes, farmland and tribute, while Zazzau, on the southern frontier, raided southwards and supplied the others with slaves. Bornu claimed overlordship: the Kano Chronicle says that Abdullahi Burja (1438–1452 in its reckoning) paid tribute to Bornu, and that Muhammad Kisoki (1509–1565) raided the Bornu province of Birnin Unguru and beat off a Bornu army that attacked Kano soon after. The same chronicle tells of the first war between Kano and Katsina, under Muhammad Rumfa (1463–1499), which lasted eleven years without a victor. Songhai’s Askia Muhammad led an expedition to Katsina in 1512–1513, and Kanta Kotal of Kebbi broke away from Songhai to found a kingdom in the west (see Askia Muhammad’s wars); Leo Africanus wrote that the askia had conquered the Hausa states, which historians doubt. Hausa tradition remembers Amina, queen of Zazzau, as a conqueror who took tribute as far as Nupe and Kwararafa and built walled camps; the Kano Chronicle places her in the early fifteenth century, other traditions and the historian Abdullahi Smith in the sixteenth, after 1576, and the details of her life are debated. Under Muhammad Zaki (1582–1618), after years in which Katsina harried Kano, a Kano army defeated Katsina at Guraji and took about 400 horses; Kutumbi (1623–1648) besieged Katsina and, by the chronicle’s account, died of wounds after a later battle with it. Pressed by the raids of Kwararafa from the south, Kano and Katsina made peace about 1650."
