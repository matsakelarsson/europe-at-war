id: kotte-conquest-of-jaffna
name: Kotte conquest of Jaffna
start: "1450"
end: "1450"
tier: C
summary: "The conquest of the Tamil Jaffna Kingdom in northern Sri Lanka by Parakramabahu VI of Kotte, the last Sinhalese king to rule the whole island. His adopted son Sapumal Kumaraya (Chempaka Perumal), a prince of South Indian descent, first subdued the Vanni chiefs who lay between the two kingdoms. A first invasion of Jaffna failed; a second, around 1450 (some sources say 1447), took the kingdom, and its king Kanakasuriya Cinkaiariyan fled to South India with his family. Sapumal ruled Jaffna for Kotte for some seventeen years. Around 1467, when he went south after Parakramabahu’s death (he later reigned at Kotte as Bhuvanaikabahu VI), Kanakasuriya came back from Madurai with mercenaries and restored the Jaffna Kingdom’s independence."
