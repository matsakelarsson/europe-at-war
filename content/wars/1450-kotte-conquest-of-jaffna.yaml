notes:
  - "The main sources are Sinhalese chronicles (the Rajavaliya), Tamil works from Jaffna (the Yalpana Vaipava Malai) and the Sinhalese poems of the time, such as the Kokila Sandesaya, which describe Sapumal’s campaign; they differ on dates. An inscription at Tenkasi in South India, of about 1449–1454, may refer to these wars."
