id: delhi-jaunpur-wars
name: Delhi–Jaunpur wars
start: "1452"
end: "1479"
tier: C
summary: "The wars between the Lodi sultans of Delhi and the Sharqi sultans of Jaunpur, which since Timur’s sack of Delhi in 1398 had been the strongest state in the Ganges plain. In 1452 Mahmud Shah Sharqi besieged Delhi while its new Afghan sultan, Bahlul Lodi, was away in the Punjab; Bahlul returned and defeated him, and the two fought over Etawah and Shamsabad until peace was made in 1457. Husain Shah Sharqi, sultan from 1458, kept a four-year truce, then renewed the war. In 1478 and 1479 he marched on Delhi three times and was beaten each time on the Yamuna or soon after; Bahlul took Kampil, Patiali, Shamsabad and other districts, defeated him again on the Rahab and took Jaunpur. Husain won it back briefly but was driven out and fled to the protection of the sultan of Bengal at Kahalgaon. Bahlul made his son Barbak Shah king of Jaunpur in 1486, and Husain’s last attempt to return was defeated near Benares in 1494."
