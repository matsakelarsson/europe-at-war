  - title: The final assault
    date: 29 May 1453
    when: "1453-05-29"
    borders: "1453-05-29"
    countries: [tr, it]
    body:
      - After a day of rest and prayer in the Ottoman camp, and a last service of both Greeks and Latins in Hagia Sophia on the evening of 28 May, the general assault began after midnight on Tuesday 29 May. Mehmed sent in his irregular troops first, then the Anatolian regiments, against the breach in the Lycus valley and the weaker walls at Blachernae; both waves were thrown back. As the janissaries came on in the third wave towards dawn, Giustiniani was badly wounded and carried to a ship, and his men began to fall back. By one account Ottoman soldiers also found a small gate, the Kerkoporta, left open and raised their flag on a tower.
      - The janissaries broke in near the Gate of St Romanus. Constantine XI threw himself into the fighting and was never seen again; his fate is unknown. By midday the city was in Ottoman hands, and some Venetian, Genoese and Byzantine ships escaped from the harbour crowded with refugees. Mehmed had promised his soldiers three days of plunder; the city was sacked, thousands of people were killed and some 30,000, by one estimate, were enslaved. Mehmed rode to Hagia Sophia and had it turned into a mosque, and he is said to have stopped the looting early. The grand duke Loukas Notaras was executed a few days later.
    facts:
      - [Final assault, "29 May 1453, from after midnight to midday"]
      - [Constantine XI, "killed; his body was never identified"]
      - [Enslaved, "about 30,000 by one estimate"]
    markers:
      - kind: taken
        side: ott
        name: Gate of St Romanus
        date: 29 May 1453
        text: The janissaries broke through the stockade in the Lycus valley after Giustiniani was carried away wounded.
        lonlat: [28.921, 41.018]
        lp: l
      - kind: event
        side: ott
        name: Kerkoporta
        date: 29 May 1453
        text: According to Doukas, a postern near the Blachernae palace was left unbarred, and some fifty Turks got onto the walls through it.
        lonlat: [28.937, 41.032]
        lp: l
      - kind: event
        side: ott
        name: Hagia Sophia
        date: 29 May 1453
        text: People who had taken refuge in the church were seized as slaves. Mehmed entered it the same day and ordered it to be made a mosque.
        lonlat: [28.98, 41.008]
      - kind: event
        side: byz
        name: Escape from the harbour
        date: 29 May 1453
        text: Venetian, Genoese and some Byzantine ships cut through the boom and sailed away with refugees while the Ottoman sailors, ashore to loot, could not stop them.
        lonlat: [28.988, 41.017]
        lp: t
    arrows:
