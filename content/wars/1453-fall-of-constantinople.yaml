        lonlat: [28.962, 41.037]
        lp: l
      - kind: naval
        side: ott
        name: Fireship attack
        date: 28 April 1453
        text: Ottoman guns, warned of the attack, sank Coco’s galley as it approached the anchored fleet before dawn.
        lonlat: [28.955, 41.034]
        lp: b
      - kind: held
        side: byz
