  - title: The chain, the ships and the mines
    date: 20 April – 25 May 1453
    when: "1453-04-20"
    borders: "1453-05-25"
    countries: [tr, it]
    body:
      - On 20 April three Genoese ships hired by the pope and a Byzantine grain transport came up the Sea of Marmara. Baltoğlu’s galleys swarmed around them in full view of the walls and of the sultan, who rode his horse into the shallows, but the tall sailing ships, fighting from above, held them off and slipped behind the chain at nightfall. Mehmed had Baltoğlu flogged and dismissed. Two days later he had some seventy ships hauled on greased rollers from the Bosporus at the Double Columns over the hill behind Pera and launched into the Golden Horn at the Valley of the Springs.
      - The defenders now had to man the harbour walls too. A night attack with fireships on 28 April, led by the Venetian Giacomo Coco, was betrayed and failed; Mehmed had captured sailors impaled in sight of the walls, and the defenders beheaded some 260 Turkish prisoners on the ramparts. The Ottomans built a pontoon bridge across the upper harbour. Serbian miners from Novo Brdo dug tunnels towards the walls at Blachernae, but an engineer named Johannes Grant countermined and destroyed them between 16 and 25 May, and a great siege tower was burnt. On 21 May Mehmed offered terms; Constantine refused to give up the city.
    facts:
      - [Sea fight, "20 April 1453, the Christian ships break through"]
      - [Ships taken over land, "22 April 1453, about 70 vessels"]
      - [Mines destroyed, 16–25 May 1453]
    markers:
