id: fall-of-constantinople
name: Fall of Constantinople
start: "1452-04"
end: "1453-05-29"
tier: A
summary: The siege and capture of Constantinople, capital of the Byzantine Empire for more than a thousand years, by the Ottoman sultan Mehmed II. After blocking the Bosporus with the fortress of Rumeli Hisarı in 1452, Mehmed besieged the city from 6 April 1453 with a large army, a fleet and great bronze guns; its few thousand Greek and Italian defenders held out for 53 days until the final assault of 29 May, in which Emperor Constantine XI was killed. Mehmed made the city his capital, and the last Byzantine states in the Morea and at Trebizond fell by 1461.
countries: [tr, gr, it]
sides:
  - id: byz
    name: Byzantines and their Italian allies
    polities: [byzantium]
    ink: purple
    moves: Byzantine and allied moves
    success: Byzantine and allied success
  - id: ott
    name: Ottoman Empire
    polities: [ottoman]
    ink: teal
    moves: Ottoman moves
    success: Ottoman success
notes:
  - Dates are Julian, as usual for the period. The main eyewitness accounts, by the Venetian ship’s doctor Nicolò Barbaro, the Byzantine official George Sphrantzes and others, disagree on many details, and the later Greek historians Doukas, Kritoboulos and Chalkokondyles add stories of their own, such as the open postern of the Kerkoporta.
  - Numbers are uncertain. Contemporaries gave the Ottomans 160,000 men or more; modern estimates range from about 50,000 to 100,000, against some 7,000 defenders.
  - The Ottomans called the city Kostantiniyye as well as Istanbul, the name that became official in the 20th century. The Genoese colony of Pera (Galata), across the Golden Horn, was officially neutral during the siege.
