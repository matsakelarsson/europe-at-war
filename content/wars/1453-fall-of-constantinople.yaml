  - title: The siege begins
    date: April 1453
    when: "1453-04-02"
    borders: "1453-04-18"
    countries: [tr]
    body:
      - The Ottoman army camped before the land walls on 2 April, and Mehmed arrived on 5 April; the siege is counted from the next day. Modern historians estimate his army at 50,000 to 100,000 men, with a fleet of more than a hundred vessels under Baltoğlu Süleyman. Constantine could muster about 7,000 men, some 2,000 of them foreigners, to hold some 20 km of walls. The Theodosian land walls, a double line with a moat, ran for about 6 km from the Golden Horn to the Sea of Marmara, and a chain floated on logs closed the mouth of the Golden Horn.
      - Constantine took charge of the Mesoteichion, where the walls dipped into the valley of the Lycus stream, the weakest stretch; Giustiniani stood first at the Charisian Gate and later moved beside the emperor. Mehmed pitched his tent opposite, near the Gate of St Romanus, and his guns pounded the walls day after day, though the defenders rebuilt each breach by night with timber, earth and barrels. Detachments took the outlying castles at Therapia and Stoudios, and the fleet took the Princes’ Islands. An assault on the Lycus breach on 18 April was beaten back.
    facts:
      - [Siege begins, 6 April 1453]
      - [Ottoman army, "perhaps 50,000–100,000 men"]
      - [Defenders, "about 7,000, some 2,000 of them foreigners"]
    markers:
