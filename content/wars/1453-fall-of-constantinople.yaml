        side: byz
        name: Fight off the Acropolis point
        date: 20 April 1453
        text: Four sailing ships fought their way through the Ottoman fleet after hours of boarding attempts and reached the harbour.
        lonlat: [28.995, 41.004]
      - kind: event
        side: ott
