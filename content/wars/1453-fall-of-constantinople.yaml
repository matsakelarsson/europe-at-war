  - title: Mehmed’s new capital
    date: 1453–1461
    when: "1453-06-01"
    borders: "1461-08-15"
    countries: [tr, gr]
    body:
      - Mehmed made Constantinople his capital. Genoese Pera surrendered and on 1 June received a charter protecting its people’s property and trade. To fill the half-empty city he brought in settlers, Muslim, Christian and Jewish, from across his lands, many of them by force, and in January 1454 he installed the monk Gennadios Scholarios, an opponent of church union, as patriarch and head of the Orthodox community. The Old Palace was built, and from 1459 the Topkapı palace on the old acropolis. The city remained the Ottoman capital until 1922.
      - The rest of the Byzantine world soon followed. The Ottomans took Athens in 1456 and its Acropolis in 1458, and in 1458–1460 Mehmed conquered the Despotate of the Morea, ruled by Constantine’s quarrelling brothers; Mystras surrendered on 29 May 1460, seven years to the day after Constantinople. Trebizond, the empire of the Komnenoi on the Black Sea, fell on 15 August 1461. Greek scholars carried manuscripts and learning to Italy. The fall shocked western Europe, but Pope Pius II died at Ancona in 1464 waiting for a crusade that never sailed.
    facts:
      - [Charter for Pera, 1 June 1453]
      - [Fall of Mystras, 29 May 1460]
      - [Fall of Trebizond, 15 August 1461]
    markers:
      - kind: event
        side: ott
        name: Constantinople
        date: from 1453
        text: The new Ottoman capital, repopulated by settlers from Anatolia and the Balkans. The Topkapı palace was built from 1459.
        lonlat: [28.983, 41.012]
      - kind: taken
        side: ott
        name: Athens
        date: 1456–1458
        text: The Florentine dukes of Athens lost the city in 1456; the garrison of the Acropolis surrendered in 1458.
        lonlat: [23.726, 37.971]
      - kind: taken
        side: ott
        name: Mystras
        date: 29 May 1460
        text: Despot Demetrios surrendered his capital and entered the sultan’s service; his brother Thomas fled to Italy.
        lonlat: [22.383, 37.067]
      - kind: taken
        side: ott
        name: Trebizond
        date: 15 August 1461
        text: Emperor David Komnenos surrendered after a blockade by land and sea. He and his family were executed in 1463.
        lonlat: [39.722, 41.005]
