steps:
  - title: Rumeli Hisarı and the preparations
    date: 1452 – March 1453
    when: "1452-04"
    borders: "1452-08-31"
    countries: [tr, it]
    body:
      - Mehmed II became sultan for the second time in February 1451, aged 19, and set out to take Constantinople, by then a shrunken city of perhaps 50,000 people surrounded by Ottoman lands. In the spring of 1452 he had a fortress built on the European shore of the Bosporus at its narrowest point, opposite the Anadolu Hisarı of his great-grandfather Bayezid I. Finished in about four months, Rumeli Hisarı, which the Turks called Boğazkesen, the cutter of the strait or of the throat, let his guns control all shipping to and from the Black Sea. In November a Venetian ship that refused to stop was sunk and its captain, Antonio Rizzo, impaled.
      - Emperor Constantine XI looked to the West for help. To win it, the union of the Orthodox and Catholic churches agreed at Florence in 1439 was proclaimed in Hagia Sophia on 12 December 1452, to the anger of many Greeks. The help was small. In January 1453 the Genoese soldier Giovanni Giustiniani Longo arrived with about 700 men, and Venetian ships in the harbour agreed to stay and fight, but the fleet voted by Venice in February sailed too late. Meanwhile Orban, a Hungarian gun-founder, cast huge bronze guns for Mehmed at Adrianople, and Turahan Bey invaded the Morea to keep the emperor’s brothers busy.
    facts:
      - [Rumeli Hisarı built, "spring–August 1452"]
      - [Church union proclaimed, 12 December 1452]
      - [Giustiniani arrives, "January 1453, with about 700 men"]
