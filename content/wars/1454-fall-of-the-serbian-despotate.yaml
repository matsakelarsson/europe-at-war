id: fall-of-the-serbian-despotate
name: Fall of the Serbian Despotate
start: "1454-07"
end: "1459-06-20"
tier: C
summary: Mehmed II’s campaigns that ended medieval Serbia. In July 1454 he invaded the despotate of Đurađ Branković and besieged Smederevo, but withdrew when John Hunyadi approached; Hunyadi and the Serbs then beat the Ottoman force left at Kruševac, and the voivode Nikola Skobaljić won near Leskovac before he was defeated and executed in November. In 1455 the Ottomans took the south of the country, including the silver-mining town of Novo Brdo after a forty-day bombardment, and in 1456 they failed before Belgrade. After the deaths of Đurađ (1456) and his son Lazar (1458) the despotate was torn by quarrels among his heirs and squeezed by Hungary and Bosnia; Ottoman armies invaded again in 1458. In 1459 Stephen Tomašević, son of the Bosnian king, became despot, and when Mehmed arrived at Smederevo he handed the capital over without a fight on 20 June 1459.
