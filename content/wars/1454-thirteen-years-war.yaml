id: thirteen-years-war
name: Thirteen Years’ War
start: "1454"
end: "1466"
tier: B
summary: A war between the Teutonic Order and the Prussian Confederation of towns and gentry, allied with Poland under Casimir IV. Fought largely by mercenaries on both sides, it ended with the Second Peace of Thorn in 1466, which gave western Prussia to Poland as Royal Prussia and made the rest of the Order’s state a Polish fief.
sides:
  - id: pl
    name: Poland and the Prussian Confederation
    polities: [poland, poland-lithuania]
    ink: magenta
    moves: Polish and Prussian Confederation moves
    success: Polish or Confederation success
  - id: to
    name: Teutonic Order
    polities: [teutonic-order]
    ink: slate
    moves: Teutonic moves
    success: Teutonic success
notes:
  - Dates are Julian (Old Style), as the sources give them.
  - Also called the War of the Cities. Inside Prussia it was largely a civil war, and Lithuania, though ruled by Casimir IV, took almost no part.
  - Places are given their modern names, with the German names of the time where useful, such as Malbork (Marienburg) and Chojnice (Konitz).
