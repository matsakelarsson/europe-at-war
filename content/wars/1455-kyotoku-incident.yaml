notes:
  - Japanese sources date the war from the murder of Uesugi Noritada on the 27th day of the twelfth month of Kyōtoku 3, which Japanese Wikipedia converts to 15 January 1455, to the peace (the “peace of capital and country”, Tohi wayo) of the 27th day of the eleventh month of Bunmei 14, converted to 6 January 1483. In Japanese years it is therefore often given as 1454–1482. Shigeuji refused the era names of the shogun’s court and kept counting years of Kyōtoku until 1478.
  - The Nagao Kageharu revolt is dated from 1476 or from the first month of 1477; Ōta Dōkan put it down for the Ōgigayatsu Uesugi by 1480.
