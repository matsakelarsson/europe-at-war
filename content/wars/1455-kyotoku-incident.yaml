id: kyotoku-incident
name: Kyōtoku Incident
start: "1455-01"
end: "1483-01"
tier: C
summary: "A war of almost thirty years in the Kantō between Ashikaga Shigeuji, the Kamakura kubō, and the Uesugi, backed by the shogunate, which broke eastern Japan into rival camps and began its Sengoku period. Shigeuji, the surviving son of Ashikaga Mochiuji, was made kubō in 1449 with Uesugi Noritada, son of his father’s enemy Norizane, as his deputy (Kantō kanrei). After an armed clash in 1450 the two sides made an uneasy peace, but at the end of Kyōtoku 3 (January 1455) Shigeuji had Noritada killed at his residence in Kamakura and attacked the Uesugi mansions. He won at Bubaigawara and elsewhere in the first months of 1455, but the shogunate declared him a rebel, and in the sixth month Imagawa Noritada of Suruga took and burned Kamakura. Shigeuji made Koga, in Shimōsa, his seat, and he and his successors became known as the Koga kubō. The Uesugi built strongholds against him at Kawagoe and Edo, the second traditionally credited to Ōta Dōkan, and from about 1459 the two camps faced each other along the Tone River, Shigeuji’s allies (the Chiba, Utsunomiya, Oyama and Yūki among them) holding the east and the Uesugi the west. The shogun Yoshimasa sent his brother Ashikaga Masatomo as a new kubō in 1457–1458, but Masatomo could not enter Kamakura and stayed at Horigoe in Izu (the Horigoe kubō). The war dragged on through the Ōnin War, which kept the shogunate from helping; the Uesugi took Koga in 1471, Shigeuji won it back, and from 1476 the revolt of Nagao Kageharu split the Uesugi side. A peace between the shogunate and Shigeuji was finally agreed at the end of Bunmei 14 (January 1483): Shigeuji was recognised as kubō at Koga and Masatomo kept Izu. The Kantō remained divided, and in the 1490s Ise Sōzui (Hōjō Sōun) took Izu from Masatomo’s heirs, the first step of the Later Hōjō."
