steps:
  - title: St Albans to Northampton
    date: 1455–1460
    when: "1455-05-22"
    borders: "1460-07-10"
    countries: [gb, fr, ie]
    body:
      - Henry VI had been king since he was nine months old. By 1453 almost all of English France was lost, and that August he fell into a stupor that lasted more than a year. Richard, Duke of York, the greatest landowner in England and a royal kinsman with his own claim to the throne, was made Protector and had his rival Edmund Beaufort, Duke of Somerset, sent to the Tower. When the king recovered, Somerset was freed and York shut out. On 22 May 1455 York and his allies, the Neville earls of Salisbury and Warwick, fought the king’s party in the streets of St Albans. Somerset was killed and Henry taken.
      - An uneasy peace followed, with Queen Margaret of Anjou leading the court. Fighting resumed in 1459. Salisbury won at Blore Heath, but at Ludford Bridge the Yorkist army broke up when the Calais garrison went over to the king. York fled to Ireland, and his son Edward, Earl of March, went with Salisbury and Warwick to Calais. A parliament at Coventry declared them all traitors. In June 1460 the earls landed at Sandwich, entered London and, on 10 July, beat the royal army at Northampton and captured the king. In October Parliament made York Henry’s heir, passing over the king’s own son.
    facts:
      - [First Battle of St Albans, "22 May 1455, Yorkist victory"]
      - [Rout of Ludford Bridge, "12 October 1459, the Yorkist army breaks up"]
      - [Battle of Northampton, "10 July 1460, Yorkist victory; Henry VI captured"]
    markers:
      - kind: battle
        side: yor
        name: First Battle of St Albans
        date: 22 May 1455
        text: Warwick’s men broke into the town through back gardens and attacked the king’s party in the streets. Somerset, Northumberland and Lord Clifford were killed, and Henry VI was wounded in the neck by an arrow.
        lonlat: [-0.339, 51.749]
      - kind: battle
        side: yor
        name: Battle of Blore Heath
        date: 23 September 1459
        text: Marching to join York at Ludlow, Salisbury beat a larger Lancastrian force; its commander, Lord Audley, was killed.
        lonlat: [-2.425, 52.914]
      - kind: event
        side: lan
        name: Ludford Bridge
        date: 12 October 1459
        text: Faced with the king himself and his larger army, the Yorkists lost heart when the Calais veterans under Andrew Trollope changed sides. Their leaders slipped away in the night.
        lonlat: [-2.719, 52.364]
      - kind: held
        side: yor
        name: Dublin
        date: 1459–1460
        text: York, the king’s lieutenant in Ireland, found refuge there. The Irish parliament stood by him and refused to act on his attainder.
        lonlat: [-6.27, 53.345]
      - kind: held
        side: yor
        name: Calais
        date: 1459–1460
        text: Warwick was captain of Calais, England’s largest permanent garrison. He held it against the court and raided the Kent coast from it.
        lonlat: [1.856, 50.948]
      - kind: battle
        side: yor
        name: Battle of Northampton
        date: 10 July 1460
        text: The royal army waited behind earthworks with guns, but rain soaked the powder and Lord Grey of Ruthin’s men let the Yorkists in. The Duke of Buckingham was killed and the king captured.
        lonlat: [-0.884, 52.223]
    arrows:
      - side: yor
        label: Warwick and March
        via: [[1.85, 50.96], [1.34, 51.28], [-0.12, 51.52], [-0.86, 52.21]]
      - side: yor
        label: Salisbury
        via: [[-1.81, 54.28], [-2.2, 53.45], [-2.42, 52.93]]
  - title: Wakefield and Towton
    date: 1460–1464
    when: "1460-12-30"
    borders: "1461-04-25"
    countries: [gb]
    body:
      - Queen Margaret would not accept her son’s disinheritance, and the northern lords gathered an army for her. York marched north to meet it, and on 30 December 1460 he left Sandal Castle to fight outside Wakefield and was killed with his son Edmund; Salisbury was beheaded at Pontefract the next day. The queen’s army moved south, plundering as it went, beat Warwick at the second battle of St Albans on 17 February 1461 and recovered the king. But London shut its gates, and the army turned back north. York’s eldest son Edward had already won at Mortimer’s Cross, and on 4 March he was proclaimed king in London as Edward IV.
      - Edward followed the Lancastrians north. On 29 March, Palm Sunday, the armies met near Towton in a snowstorm and fought for most of the day, until the Duke of Norfolk’s late arrival turned the Lancastrian flank and the rout ended at the Cock Beck, where many drowned. The heralds were said to have counted 28,000 dead. Modern historians think that too high, but Towton was probably the largest and bloodiest battle ever fought on English soil. Henry and Margaret fled to Scotland and gave it Berwick for its help. Lancastrians held out in the Northumberland castles until 1464; Henry was captured in 1465.
    facts:
      - [Battle of Wakefield, "30 December 1460, Lancastrian victory; York killed"]
      - [Edward IV proclaimed king, "4 March 1461"]
      - [Battle of Towton, "29 March 1461, Yorkist victory"]
    markers:
      - kind: battle
        side: lan
        name: Battle of Wakefield
        date: 30 December 1460
        text: For reasons still debated, York left the safety of Sandal Castle to fight a larger army and was surrounded. His head, in a paper crown, was set over a gate of York.
        lonlat: [-1.492, 53.68]
        lp: l
      - kind: battle
        side: yor
        name: Battle of Mortimer’s Cross
        date: 2 February 1461
        text: Edward of March beat a Welsh and Lancastrian army under Jasper Tudor. Jasper’s father, Owen Tudor, was captured and beheaded at Hereford.
        lonlat: [-2.838, 52.259]
      - kind: battle
        side: lan
        name: Second Battle of St Albans
        date: 17 February 1461
        text: The queen’s northern army outflanked Warwick’s defences and routed him. Henry VI, brought along by the Yorkists, was found sitting under a tree and returned to his wife.
        lonlat: [-0.336, 51.755]
        lp: t
      - kind: event
        side: yor
        name: London
        date: 4 March 1461
        text: The city would not admit the queen’s army. Edward entered it unopposed and was proclaimed king.
        lonlat: [-0.09, 51.51]
        lp: b
      - kind: battle
        side: yor
        name: Battle of Towton
        date: 29 March 1461
        text: Fought in driving snow between two very large armies. Mass graves found near the battlefield show the brutality of the fighting.
        lonlat: [-1.268, 53.84]
      - kind: event
        side: lan
        name: Berwick-upon-Tweed
        date: 25 April 1461
        text: The fugitive Lancastrians handed the border town to the Scots in return for refuge and help. England recovered it in 1482.
        lonlat: [-2.004, 55.771]
      - kind: battle
        side: yor
        name: Battle of Hexham
        date: 15 May 1464
        text: John Neville, Lord Montagu, routed the last Lancastrian army in the north. The Duke of Somerset and other leaders were executed.
        lonlat: [-2.1, 54.97]
    arrows:
      - side: lan
        label: Queen Margaret
        via: [[-1.08, 53.96], [-1.2, 52.95], [-0.8, 52.2], [-0.35, 51.78]]
      - side: yor
        label: Edward
        via: [[-2.84, 52.26], [-1.6, 51.9], [-0.15, 51.52]]
      - side: yor
        label: Edward IV
        via: [[-0.1, 51.54], [-0.75, 52.6], [-1.15, 53.4], [-1.26, 53.82]]
    areas:
      - style: contested
        side: lan
        label: Lancastrian castles hold out, 1461–1464
        atoms: [GB-NBL]
  - title: Warwick’s rebellion, Barnet and Tewkesbury
    date: 1469–1471
    when: "1469-07-24"
    borders: "1471-05-04"
    countries: [gb, fr, nl, be]
    side_names:
      lan: Success for Warwick and the Lancastrians
    move_names:
      lan: Moves by Warwick and the Lancastrians
    body:
      - In 1464 Edward IV secretly married Elizabeth Woodville, a widow from a minor family, while Warwick was negotiating a French match for him. The rise of her relatives, and Edward’s alliance with Burgundy against France, drove Warwick into opposition. In 1469 he and the king’s brother George, Duke of Clarence, stirred up a rising in the north; its men beat a royal army at Edgcote on 24 July, and the queen’s father and a brother were executed. Edward was held for a time but regained control. In 1470 a second rising was crushed at Losecoat Field, and Warwick and Clarence fled to France, where Louis XI reconciled Warwick with Margaret of Anjou.
      - Warwick landed in Devon in September 1470. Outnumbered, Edward fled from King’s Lynn to the Low Countries, ruled by his brother-in-law Charles the Bold, and Henry VI was brought out of the Tower and restored. With Burgundian help Edward landed at Ravenspurn on the Humber in March 1471, won Clarence back and entered London. On 14 April, in fog at Barnet, he beat and killed Warwick. That day Margaret and her son landed at Weymouth; Edward caught them at Tewkesbury on 4 May. The prince was killed, and Henry VI died in the Tower on the night Edward returned to London, almost certainly on his orders.
    facts:
      - [Battle of Edgcote, "24 July 1469, victory for Warwick’s rebels"]
      - [Battle of Barnet, "14 April 1471, Yorkist victory; Warwick killed"]
      - [Battle of Tewkesbury, "4 May 1471, Yorkist victory"]
    markers:
      - kind: battle
        side: lan
        name: Battle of Edgcote
        date: 24 July 1469
        text: Northern rebels raised by Warwick’s kinsmen beat a royal army under the earls of Pembroke and Devon, whose Welsh troops suffered heavy losses. Pembroke was executed after the battle.
        lonlat: [-1.247, 52.114]
      - kind: battle
        side: yor
        name: Battle of Losecoat Field
        date: 12 March 1470
        text: Edward routed the Lincolnshire rising of Sir Robert Welles. Papers said to have been found on the field implicated Warwick and Clarence.
        lonlat: [-0.536, 52.686]
      - kind: event
        side: lan
        name: Dartmouth
        date: September 1470
        text: Warwick and Clarence landed in the West Country with French help and marched on London.
        lonlat: [-3.58, 50.35]
      - kind: event
        side: yor
        name: King’s Lynn
        date: 2 October 1470
        text: Edward escaped by sea with a few followers and found refuge with Louis de Gruuthuse, governor of Holland for the Duke of Burgundy.
        lonlat: [0.4, 52.75]
      - kind: event
        side: yor
        name: Ravenspurn
        date: 14 March 1471
        text: Edward landed on the Humber with a small force paid for by Burgundy, at first claiming to want only his duchy of York.
        lonlat: [0.167, 53.603]
      - kind: battle
        side: yor
        name: Battle of Barnet
        date: 14 April 1471
        text: In thick fog the armies’ lines were misaligned, and Lancastrians attacked their own side by mistake. Warwick was killed trying to escape.
        lonlat: [-0.199, 51.666]
        lp: t
      - kind: battle
        side: yor
        name: Battle of Tewkesbury
        date: 4 May 1471
        text: Edward caught the queen’s army before it could cross the Severn. Edward of Westminster, the last Lancastrian heir in the male line, was killed and Somerset was executed.
        lonlat: [-2.161, 51.986]
      - kind: event
        side: yor
        name: Tower of London
        date: 21 May 1471
        text: Henry VI died here that night. The official story was that he died of melancholy.
        lonlat: [-0.076, 51.508]
        lp: b
    arrows:
      - side: yor
        label: Edward IV
        via: [[0.17, 53.6], [-1.08, 53.96], [-1.5, 52.4], [-0.21, 51.68]]
      - side: lan
        label: Margaret
        via: [[-2.46, 50.61], [-2.36, 51.38], [-2.4, 51.75], [-2.17, 51.97]]
      - side: yor
        label: Edward IV
        via: [[-0.6, 51.48], [-1.97, 51.72], [-2.15, 51.97]]
  - title: Bosworth
    date: 1483–1485
    when: "1483-04-09"
    borders: "1485-08-22"
    countries: [gb, fr]
    body:
      - Edward IV died on 9 April 1483, leaving a twelve-year-old son, Edward V. The boy’s uncle, Richard, Duke of Gloucester, took charge of him, had the queen’s kinsmen arrested and later executed, and in June had Edward IV’s children declared illegitimate. He was crowned Richard III on 6 July. Edward V and his younger brother were not seen outside the Tower after that summer, and most people came to believe they had been killed. A rising that autumn, joined by Richard’s former ally the Duke of Buckingham, failed, and Buckingham was beheaded at Salisbury.
      - Henry Tudor, Earl of Richmond, the Lancastrian claimant through his mother Margaret Beaufort, had lived in exile in Brittany since 1471. At Christmas 1483 he swore in Rennes Cathedral to marry Edward IV’s daughter Elizabeth. With French money, ships and mercenaries he landed at Mill Bay in Pembrokeshire on 7 August 1485 and gathered men as he marched through Wales. On 22 August he met Richard’s larger army near Market Bosworth. Richard charged at Henry with his household knights, Sir William Stanley’s men then fell on him, and he was killed, the last English king to die in battle.
    facts:
      - [Coronation of Richard III, "6 July 1483"]
      - [Henry Tudor lands, "7 August 1485, Mill Bay, Pembrokeshire"]
      - [Battle of Bosworth, "22 August 1485, Tudor victory; Richard III killed"]
    markers:
      - kind: event
        side: yor
        name: Tower of London
        date: "1483"
        text: The “princes in the Tower”, Edward V and Richard of Shrewsbury, were lodged here and seen less and less often. Their fate has never been settled.
        lonlat: [-0.076, 51.508]
      - kind: event
        side: yor
        name: Salisbury
        date: 2 November 1483
        text: The Duke of Buckingham, betrayed after his rising collapsed in floods and desertion, was beheaded here without trial.
        lonlat: [-1.795, 51.07]
      - kind: event
        side: lan
        name: Rennes
        date: 25 December 1483
        text: In the cathedral of the Breton capital, Henry Tudor swore to marry Elizabeth of York, and his followers did homage to him as king.
        lonlat: [-1.683, 48.111]
      - kind: event
        side: lan
        name: Harfleur
        date: 1 August 1485
        text: Henry sailed from the mouth of the Seine with a small fleet and an army of English exiles and French soldiers.
        lonlat: [0.199, 49.507]
      - kind: event
        side: lan
        name: Mill Bay
        date: 7 August 1485
        text: Henry landed near Dale at the mouth of Milford Haven, close to his birthplace at Pembroke, and marched north up the Welsh coast.
        lonlat: [-5.17, 51.71]
      - kind: battle
        side: lan
        name: Battle of Bosworth
        date: 22 August 1485
        text: The Stanleys kept their men apart until Richard made his charge. Excavations since 2009 place the battle about 3 km south-west of the traditional site at Ambion Hill.
        lonlat: [-1.41, 52.591]
        lp: l
      - kind: event
        name: Leicester
        date: August 1485
        text: Richard’s body was shown to the public and buried in the Greyfriars church. His remains were found under a car park in 2012 and reburied in Leicester Cathedral in 2015.
        lonlat: [-1.137, 52.635]
    arrows:
      - side: lan
        label: Henry Tudor
        via: [[0.15, 49.55], [-3.0, 49.6], [-6.1, 50.0], [-5.25, 51.65]]
      - side: lan
        label: Henry Tudor
        via: [[-5.17, 51.71], [-4.08, 52.41], [-2.75, 52.71], [-1.43, 52.59]]
      - side: yor
        label: Richard III
        via: [[-1.15, 52.95], [-1.14, 52.64], [-1.39, 52.59]]
  - title: Stoke
    date: 1486–1487
    when: "1487-05-24"
    borders: "1487-06-16"
    countries: [gb, ie, be]
    body:
      - Henry VII was crowned on 30 October 1485 and married Elizabeth of York in January 1486, joining the two houses, but his hold on the throne was weak. A boy of about ten, Lambert Simnel, was coached by an Oxford priest to pose as Edward, Earl of Warwick, the Yorkist heir whom Henry kept in the Tower. The plot was taken up by John de la Pole, Earl of Lincoln, Richard III’s nephew, and by Edward IV’s sister Margaret of York, dowager duchess of Burgundy, who paid for about 2,000 mercenaries, mostly German, under Martin Schwartz. In Ireland the Earl of Kildare and the Anglo-Irish lords took up the cause, and on 24 May 1487 Simnel was crowned “Edward VI” in Dublin.
      - The rebels, with several thousand Irish troops, landed at Furness in Lancashire on 4 June and marched across the Pennines and south towards Newark, finding little support. Henry met them at East Stoke on 16 June. The mercenaries fought hard and the lightly armed Irish suffered terribly, but the rebel army was destroyed; Lincoln and Schwartz were killed. Henry pardoned the boy and put him to work in the royal kitchens. Another pretender, Perkin Warbeck, troubled the king in the 1490s, but Stoke was the last battle between armies fighting for the throne.
    facts:
      - [Coronation of “Edward VI”, "24 May 1487, Christ Church Cathedral, Dublin"]
      - [Battle of Stoke, "16 June 1487, victory for Henry VII"]
      - [Lambert Simnel, "pardoned; later a falconer in the royal household"]
    markers:
      - kind: event
        side: yor
        name: Mechelen
        date: 1486–1487
        text: Margaret of York, Edward IV’s sister and widow of Charles the Bold, kept her court here and backed the plot with money and soldiers.
        lonlat: [4.481, 51.028]
      - kind: event
        side: yor
        name: Dublin
        date: 24 May 1487
        text: The Earl of Kildare, the king’s deputy, and most of the lords of the Pale accepted the boy as king, and he was crowned in Christ Church Cathedral.
        lonlat: [-6.271, 53.343]
      - kind: event
        side: yor
        name: Furness
        date: 4 June 1487
        text: The rebel fleet landed near Piel Island, on the Lancashire coast opposite Ireland.
        lonlat: [-3.175, 54.064]
      - kind: held
        side: lan
        name: Kenilworth
        date: May 1487
        text: Henry gathered his army at the castle in the Midlands, ready to move north.
        lonlat: [-1.592, 52.348]
      - kind: battle
        side: lan
        name: Battle of Stoke
        date: 16 June 1487
        text: The battle lasted about three hours on a ridge above the Trent. Almost all the rebel leaders were killed; Lord Lovell disappeared and was never seen again.
        lonlat: [-0.888, 53.035]
    arrows:
      - side: yor
        label: Lincoln and Schwartz
        via: [[-6.15, 53.4], [-3.25, 54.05], [-1.65, 54.22], [-0.9, 53.05]]
      - side: lan
        label: Henry VII
        via: [[-1.59, 52.35], [-1.15, 52.95], [-0.91, 53.02]]
