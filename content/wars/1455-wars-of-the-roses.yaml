id: wars-of-the-roses
name: Wars of the Roses
start: "1455-05-22"
end: "1487-06-16"
tier: A
summary: The civil wars for the English throne between the houses of Lancaster and York, two branches of the royal Plantagenet family. They began when Richard, Duke of York, challenged the court of the feeble Henry VI, brought Edward IV to the throne at Towton in 1461 and again at Barnet and Tewkesbury in 1471, and ended when Henry Tudor defeated Richard III at Bosworth in 1485 and crushed the last Yorkist rising at Stoke in 1487.
countries: [gb, ie, fr, be, nl]
sides:
  - id: lan
    name: Lancastrians and Tudors
    polities: [england]
    ink: red
    moves: Lancastrian and Tudor moves
    success: Lancastrian and Tudor success
  - id: yor
    name: Yorkists
    polities: [england]
    ink: blue
    moves: Yorkist moves
    success: Yorkist success
notes:
  - Dates are Julian (Old Style), as in English sources of the time. The chroniclers’ figures for armies and the dead are often far too large; modern estimates are given where they differ.
  - The name “Wars of the Roses” came into common use only in the 19th century. The white rose was a Yorkist badge, but the red rose of Lancaster was mostly a Tudor invention; Henry VII’s Tudor rose joined the two. Contemporaries spoke simply of the civil wars.
  - Several leading figures changed sides, above all Richard Neville, Earl of Warwick, “the Kingmaker”, who fought for York until 1469 and died fighting for Lancaster in 1471.
