  - title: The assault and the sortie
    date: 21 July – 11 August 1456
    when: "1456-07-21"
    borders: "1456-08"
    countries: [rs, hu]
    body:
      - On the evening of 21 July Mehmed launched a general assault that went on all night. The janissaries broke into the lower town and climbed towards the citadel, but the defenders threw down burning wood and tar, and a wall of fire cut off those inside the walls from their comrades. The janissaries trapped inside were killed, and the attack outside the walls was beaten off with heavy losses.
      - On 22 July crusaders slipped out against orders to skirmish with the Ottomans, and others followed until Capistrano, unable to call them back, led them across the Sava against the Ottoman flank, while Hunyadi charged out of the fortress and seized the Ottoman guns. Mehmed fought in person and was wounded, and the Ottomans recovered their camp, but that night they withdrew, leaving much of their artillery and baggage behind. Plague broke out in the Christian camp; Hunyadi died of it at Zemun on 11 August, and Capistrano in October.
    facts:
      - [General assault, "21–22 July 1456"]
      - [Ottomans withdraw, "night of 22–23 July 1456"]
      - [Death of Hunyadi, 11 August 1456]
