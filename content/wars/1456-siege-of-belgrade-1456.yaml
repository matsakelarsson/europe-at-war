steps:
  - title: The siege and the river battle
    date: June – 14 July 1456
    when: "1456-07-04"
    borders: "1456-07-14"
    countries: [rs, hu]
    body:
      - After campaigns against the Serbian despotate in 1454 and 1455, Mehmed II marched on Belgrade, the “key to Hungary”, which Hunyadi had strengthened at his own expense. The sultan brought a large army, many heavy cannon cast for the campaign and a fleet of river boats to close the Danube. The fortress, on a headland between the two rivers, was held by Hunyadi’s brother-in-law Michael Szilágyi with a few thousand men. Meanwhile the Franciscan friar John of Capistrano preached the crusade in Hungary, and thousands of peasants, townsmen and minor nobles, poorly armed but eager, gathered with Hunyadi at Zemun on the opposite bank.
      - From 4 July the Ottoman guns battered the walls. Hunyadi gathered boats along the Danube, and on 14 July, attacked from upstream by his flotilla and from the fortress by about forty vessels manned by Serbian boatmen, the Ottoman fleet was broken after five hours of fighting; several large galleys were sunk and others captured. Hunyadi could now bring his troops and supplies into the fortress.
    facts:
      - [Bombardment begins, 4 July 1456]
      - [River battle, "14 July 1456, Hungarian victory"]
