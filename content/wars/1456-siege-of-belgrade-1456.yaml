notes:
  - Numbers vary widely. The garrison had perhaps 5,000–7,000 men, and Hunyadi brought a larger relief force, many of them peasant crusaders. Modern estimates of the Ottoman army range from about 30,000 to 60,000 or more, with dozens of cannon and a river fleet.
  - Pope Callixtus III’s order that church bells be rung at noon to pray for the defenders is often said to commemorate the victory; in fact it was issued before the battle. The story of Titusz Dugovics, who is said to have thrown himself from the walls with a Turkish standard-bearer, is a later legend.
