id: siege-of-belgrade-1456
name: Siege of Belgrade, 1456
start: "1456-06"
end: "1456-08-11"
tier: B
summary: Mehmed II’s attempt, three years after taking Constantinople, to capture Belgrade, Hungary’s great fortress where the Sava meets the Danube. Defended by Michael Szilágyi and relieved by John Hunyadi’s fleet and an army of crusaders raised by the friar John of Capistrano, the fortress beat off a general assault on 21–22 July, and a sortie the next day overran the Ottoman guns. The sultan, wounded, withdrew, and Ottoman expansion into Hungary was checked for some seventy years.
