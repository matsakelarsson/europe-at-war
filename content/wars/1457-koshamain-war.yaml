id: koshamain-war
name: Koshamain’s War
start: "1457"
end: "1458"
tier: C
summary: "An Ainu rising against the Japanese (Wajin) settlements in the far south of Ezo (Hokkaido). From the early 1400s traders and warriors from northern Honshu, under the Andō of Tsugaru, had settled along the coast of the Oshima peninsula, and by the 1450s their lords held a chain of fortified residences (tate) from Shinori, east of today’s Hakodate, to Hanazawa at Kaminokuni, later remembered as the twelve forts (Dōnan jūni-tate). Trade with them mattered more to the Ainu after Ming China’s hold on the lands to the north weakened, and quarrels grew. In 1456 at Shinori a Japanese smith killed an Ainu man in a dispute over the quality and price of a knife (makiri) he had ordered. In the fifth month of 1457 the Ainu, led by Koshamain, a chief of the east, rose from Mukawa in the east to Yoichi in the west, took the fort at Shinori and went on to take ten of the twelve forts; only Mobetsu, held by Andō Iemasa, and Hanazawa, held by Kakizaki Sueshige, did not fall. In 1458 Takeda Nobuhiro, a warrior who had crossed from northern Honshu with the Andō in 1454 and served at Hanazawa, killed Koshamain and his son with arrows at Nanaehama near Hakodate, and the rising fell apart. Nobuhiro married into the Kakizaki as Sueshige’s son-in-law and heir, and his descendants, renamed Matsumae, later ruled the Japanese enclave and its trade with the Ainu as the Matsumae domain. Fighting between Ainu and Wajin flared up again and again for about a century."
