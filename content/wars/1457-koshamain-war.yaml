notes:
  - Almost everything known about the war comes from the Shinra no Kiroku, a history of the Matsumae family written in 1646, two centuries later; historians treat its details with caution. The name of the man killed at Shinori is given as Okkai or Otsugai, which may simply mean “man”, and archaeology has not confirmed the site of every fort.
  - On the base map the Japanese hold on southern Ezo is shown only from 1604, when the shogunate granted the Matsumae the sole right to trade with the Ainu.
  - Since 1994 a memorial service for Koshamain and the dead of both sides has been held each July at Kaminokuni.
