id: war-of-the-neapolitan-succession-1459
name: War of the Neapolitan Succession, 1459–1464
start: "1459-10"
end: "1464"
tier: C
summary: The war for the Kingdom of Naples after the death of Alfonso V of Aragon in 1458, who left it to his illegitimate son Ferdinand (Ferrante). Many barons, led by the Prince of Taranto, Giovanni Antonio Orsini del Balzo, rose against him and called in John of Anjou, son of René, who landed in October 1459 with help from French-ruled Genoa. On 7 July 1460 the Angevins and rebels beat Ferdinand near Sarno, and the condottiere Jacopo Piccinino overran the Abruzzi for them. Ferdinand held on with help from Pope Pius II, Francesco Sforza of Milan and the Albanian leader Skanderbeg, who crossed the Adriatic with troops in 1461, and on 18 August 1462 he and Alessandro Sforza routed John and Piccinino at Troia in Apulia. The Prince of Taranto made peace, other barons followed, and in 1464 John left the kingdom; Angevin holdouts on Ischia were beaten at sea in 1465.
