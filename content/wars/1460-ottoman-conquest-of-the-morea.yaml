id: ottoman-conquest-of-the-morea
name: Ottoman conquest of the Morea
start: "1458-05"
end: "1461-07"
tier: C
summary: The conquest of the Despotate of the Morea, the last Byzantine state in Greece, by Mehmed II. The despots Thomas and Demetrios Palaiologos, brothers of the last emperor, quarrelled constantly and neglected their tribute. In May 1458 Mehmed invaded, took the Acrocorinth after a siege and annexed the north of the peninsula, including Corinth and Patras, leaving the brothers the south as tributaries. When they went to war with each other again, Thomas seeking help from the West and Demetrios from the Ottomans, Mehmed returned in 1460. Demetrios surrendered Mystras on 29 May 1460 and went into Ottoman service; Thomas fled to Corfu and Rome. Castles such as Salmeniko held out until July 1461. Venice kept Modon, Coron, Nauplia and Argos, and Monemvasia placed itself under the pope and later Venice.
