id: fall-of-trebizond
name: Fall of Trebizond
start: "1461"
end: "1461-08-15"
tier: C
summary: Mehmed II’s campaign of 1461 against the Empire of Trebizond, the last Byzantine Greek state, on the Black Sea coast of Anatolia. Emperor David Megas Komnenos had refused tribute and relied on alliances with the Aq Qoyunlu ruler Uzun Hasan, Georgia and the Turkish lords of the north. Mehmed’s fleet sailed along the coast while his army forced the Candarid lord of Sinope to give up his realm, marched east, made peace with Uzun Hasan and crossed the Pontic mountains. Trebizond was blockaded by land and sea, and on 15 August 1461 David surrendered the city on terms. He and his family were given estates near Serres in Macedonia but were executed in Constantinople in 1463; many of the city’s people were deported to Constantinople or enslaved, and boys were taken for the janissaries.
