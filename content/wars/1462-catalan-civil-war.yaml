id: catalan-civil-war
name: Catalan Civil War
start: "1462"
end: "1472-10-16"
tier: C
summary: A civil war in the Principality of Catalonia between John II of Aragon and the Catalan institutions, the Generalitat and its Council of the Principality. Anger at John’s treatment of his son Charles of Viana, who died in Barcelona in 1461, combined with the revolt of the remença peasants against their lords and the conflicts within Barcelona. In 1462 John pledged Roussillon and Cerdanya to Louis XI of France for an army that rescued his queen and their son Ferdinand from the old fort of Girona, and France kept those counties until 1493. The Catalans declared John deposed and offered their crown in turn to Henry IV of Castile, to Peter, constable of Portugal, who lost at Calaf in 1465 and died in 1466, and to René of Anjou, whose son John of Lorraine fought on until his death in 1470. Barcelona, besieged by land and sea through 1472, surrendered by the Capitulation of Pedralbes on 16 October 1472; John granted a general pardon and swore to respect Catalonia’s laws.
