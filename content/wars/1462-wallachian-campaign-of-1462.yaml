id: wallachian-campaign-of-1462
name: Wallachian campaign of 1462
start: "1462-02"
end: "1462-11"
tier: B
summary: Mehmed II’s invasion of Wallachia to punish its prince, Vlad III, later known as Vlad the Impaler, who had stopped paying tribute, allied with Hungary and slaughtered thousands of people along the Ottoman bank of the Danube. Vlad fought a war of scorched earth and raids, and on the night of 17 June attacked the sultan’s camp near Târgoviște. Mehmed reached the capital but withdrew, and his candidate, Vlad’s brother Radu, won over the boyars; Vlad sought help from King Matthias of Hungary, who instead had him imprisoned.
