steps:
  - title: The night attack
    date: February – November 1462
    when: "1462-06-17"
    borders: "1462-09"
    countries: [ro, bg]
    body:
      - Vlad III had held the Wallachian throne since 1456 as an Ottoman vassal, but he stopped paying tribute and made an alliance with Matthias Corvinus of Hungary. When the bey of Nicopolis, Hamza, tried to seize him by a trick near Giurgiu in the winter of 1461–1462, Vlad ambushed and captured him, took Giurgiu and raided the Ottoman bank of the Danube from Serbia to the Black Sea in January and February 1462, killing, by his own count, 23,884 people. In the spring Mehmed II led a great army north, crossing the Danube in early June while his fleet attacked Brăila and Kiliia.
      - Vlad emptied the country before the invaders, burning crops and poisoning wells, and harried them with raids. On the night of 17 June, with several thousand horsemen, he attacked the Ottoman camp south of Târgoviște, perhaps hoping to kill the sultan, and caused great confusion before the janissaries drove him off. When Mehmed reached Târgoviște he found it deserted, and outside it a forest of stakes with thousands of impaled prisoners, among them Hamza. The sultan withdrew, burning Brăila on 29 June, and left Vlad’s younger brother Radu, raised at the Ottoman court, to win over the boyars. By the autumn most of the boyars had gone over to Radu. Vlad turned to Matthias Corvinus, who came to Transylvania in November, but the king had no wish to fight the sultan; he had Vlad arrested and kept him a prisoner until 1475.
    facts:
      - [Winter raid across the Danube, January – February 1462]
      - [Night attack, "17 June 1462, inconclusive"]
