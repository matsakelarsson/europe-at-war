notes:
  - The figures in the sources are unreliable. Contemporaries put the Ottoman army at 90,000 to 300,000 or more, and modern historians at perhaps 60,000–90,000; Vlad may have had about 30,000 men. Vlad’s own figure of 23,884 Turks killed in his winter raid comes from his letter to Matthias Corvinus.
  - Accounts of the night attack differ widely, from great slaughter in the Ottoman camp to small losses of men and many of horses and camels, and its outcome is generally described as inconclusive.
