id: first-ottoman-venetian-war
name: First Ottoman–Venetian War
start: "1463-04-03"
end: "1479-01-25"
tier: B
summary: Sixteen years of war between the Republic of Venice and Mehmed II, fought in the Morea, the Aegean, Albania and finally on Venice’s own doorstep in Friuli. Venice began with hopes of a crusade alongside Hungary and the pope, but its offensive in the Peloponnese failed, it lost Negroponte, its chief base in the Aegean, in 1470, and after the fall of Krujë and the long siege of Shkodër it made peace in 1479, giving up Shkodër, Lemnos and the Mani and paying for its trading rights.
countries: [gr, al, it, me, tr]
sides:
  - id: ven
    name: Venice and its allies
    polities: [venice, hungary]
    ink: red
    moves: Venetian moves
    success: Venetian success
  - id: ott
    name: Ottoman Empire
    polities: [ottoman]
    ink: teal
    moves: Ottoman moves
    success: Ottoman success
notes:
  - Venice’s allies came and went. Hungary attacked Bosnia in 1463–1464, Pope Pius II died at Ancona in 1464 before his crusade could sail, and Venice later sought help from Uzun Hasan of the Aq Qoyunlu, who was beaten by Mehmed in 1473. Skanderbeg and other Albanian and Montenegrin lords fought alongside Venice in Albania.
  - The siege of Negroponte is dated 14 June – 12 July 1470 in some accounts and 10 July – 5 August in others. The legend that its commander Paolo Erizzo was sawn in half is contradicted by an eyewitness who says he died in the fighting.
