steps:
  - title: The Morea
    date: 1463–1466
    when: "1463-04-03"
    borders: "1464-12"
    countries: [gr]
    body:
      - After the fall of the Morea in 1460, Venice’s ports at Koroni, Methoni and Nafplio bordered Ottoman land. A quarrel over a runaway slave led to Ottoman attacks, and on 3 April 1463 the Ottoman governor took Venetian Argos by treachery. Urged on by Cardinal Bessarion and the pope, the Venetian Senate voted for war on 28 July and allied with Matthias Corvinus of Hungary, who invaded Bosnia. In August a Venetian army retook Argos, rebuilt the Hexamilion wall across the Isthmus of Corinth with many cannon and besieged the Acrocorinth.
      - On 20 October 1463 the besiegers were badly beaten, and their commander Bertoldo d’Este was mortally wounded. When the grand vizier Mahmud Pasha arrived with an army, the Venetians, weakened by dysentery, abandoned the Hexamilion and sailed away; the Ottomans razed the wall and retook Argos. In 1464 Sigismondo Malatesta, lord of Rimini, besieged Mistra without success, and the war in the peninsula settled into raids from the Venetian fortresses, while the countryside was emptied. In 1466 Vettore Cappello attacked Athens but failed to take the Acropolis, and the Venetian siege of Patras ended in a heavy defeat.
    facts:
      - [Argos lost, 3 April 1463]
      - [Venice declares war, 28 July 1463]
      - [Defeat at the Acrocorinth, 20 October 1463]
