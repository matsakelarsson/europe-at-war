  - title: Negroponte
    date: 1466–1472
    when: "1470-06"
    borders: "1470-07-12"
    countries: [gr, tr]
    body:
      - In 1470 Mehmed II struck at Negroponte (Chalcis), the Venetian capital of Euboea and its main base in the Aegean. A large fleet under Mahmud Pasha sailed from Gallipoli while the sultan led an army overland, and the Ottomans built a bridge of boats across the narrow Euripus strait to bring their guns onto the island. The Venetian fleet under Niccolò Canal, sent to relieve the town, failed to break the bridge or the blockade.
      - "After several costly assaults the city was stormed in July. It had refused to surrender, so by the custom of the time it was given over to plunder: the men were killed and the women and children enslaved, and the whole island passed to the Ottomans. Canal was disgraced and exiled. Venice now looked for allies in the east, and in 1472 its fleet under Pietro Mocenigo raided the Anatolian coast, sacking Smyrna, while it waited for Uzun Hasan of the Aq Qoyunlu to attack the Ottomans by land."
    facts:
      - [Fall of Negroponte, "12 July 1470 (some sources 5 August)"]
      - [Dead in the siege, "more than 6,000 Venetians and Greeks"]
    markers:
      - kind: taken
        side: ott
        name: Negroponte
        date: July 1470
        text: Stormed and sacked after a siege of about a month; Euboea remained Ottoman until 1830.
        lonlat: [23.595, 38.463]
      - kind: naval
        side: ott
        name: Euripus
        date: June – July 1470
        text: The Ottoman bridge of boats linked the mainland and the island. Canal’s fleet did not manage to destroy it.
        lonlat: [23.6, 38.48]
        lp: t
      - kind: taken
        side: ven
        name: Smyrna
        date: "1472"
        text: Mocenigo’s fleet sacked the Ottoman port while Venice negotiated with Uzun Hasan.
        lonlat: [27.14, 38.42]
