  - title: Shkodër and the peace of 1479
    date: 1474–1479
    when: "1474-05"
    borders: "1479-04-25"
    countries: [al, me, it, gr]
    body:
      - In 1474 Hadım Süleyman Pasha besieged Venetian Shkodër (Scutari) in Albania from May to August without success. In November 1477 Ottoman raiders under Ömer Bey crossed the Isonzo into Friuli, killed the Venetian commanders who rode out against them, and burned villages as far as the Tagliamento, within sight of Venice; they came again in 1478. With the plague in the city, no allies left and its trade with the Levant cut off, Venice sought peace.
      - "Mehmed raised his terms. In 1478 he came to Albania in person: Krujë surrendered in June after a year’s blockade, Drisht and Lezhë were stormed, and Shkodër withstood a great siege and was left under blockade. On 25 January 1479 Giovanni Dario signed the Treaty of Constantinople. Venice gave up Shkodër, the island of Lemnos and the Mani, accepted the loss of Negroponte and Krujë, and agreed to pay 100,000 ducats and 10,000 ducats a year for the right to trade freely in the Ottoman Empire. In April the defenders of Shkodër left for Venice, and later in 1479 the Ottomans took the Ionian islands of Lefkada, Cephalonia and Zakynthos from the Tocco family."
    facts:
      - [First siege of Shkodër, "May – August 1474, failed"]
      - [Raid on Friuli, November 1477]
      - [Treaty of Constantinople, 25 January 1479]
    markers:
      - kind: siege
        side: ven
        name: Shkodër
        date: 1474 and 1478–1479
        text: Twice besieged; it never fell by assault, but Venice handed it over in the peace.
        lonlat: [19.512, 42.068]
      - kind: battle
        side: ott
        name: Isonzo
        date: November 1477
        text: Ottoman cavalry lured the Venetian garrison out with a feigned retreat and then raided Friuli for thirteen days.
        lonlat: [13.55, 45.95]
      - kind: treaty
        name: Constantinople
        date: 25 January 1479
        text: Venice gave up Shkodër, Lemnos and the Mani and paid for the renewal of its trading rights.
        lonlat: [28.98, 41.01]
      - kind: taken
        side: ott
        name: Lefkada
        date: "1479"
        text: Taken with Cephalonia and Zakynthos by Gedik Ahmed Pasha soon after the peace.
        lonlat: [20.65, 38.717]
        lp: l
