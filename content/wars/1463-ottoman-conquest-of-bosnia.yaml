notes:
  - Accounts of the king’s death differ. One version says Mehmed’s scholar Ali al-Bistami ruled that the promise of safety was not binding on the sultan and beheaded the king himself; others say Mehmed did it. Later stories that he was flayed or used as a target are not supported by contemporary sources.
  - The Hungarian conquest of Jajce is dated 16 or 25 December 1463 in different sources. Herzegovina’s last fortress, Novi (Herceg Novi), fell at the end of 1481, and the duchy is often said to have ended in 1482.
