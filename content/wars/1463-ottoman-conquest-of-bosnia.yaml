steps:
  - title: The fall of the kingdom
    date: May – December 1463
    when: "1463-05-19"
    borders: "1463-12-25"
    countries: [ba, hr, me]
    body:
      - Stephen Tomašević, crowned in 1461 with a crown sent by Pope Pius II, refused the customary tribute to the sultan, counting on Hungarian help that did not come in time. His kingdom was divided, his people largely indifferent and the powerful Duke Stjepan Vukčić Kosača of Herzegovina at war with his own son. In the spring of 1463 Mehmed II marched into Bosnia with a large army. His grand vizier Mahmud Pasha Angelović besieged the royal fortress of Bobovac on 19 May, and it surrendered within days. The king fled west, but Mahmud Pasha caught up with him at Ključ, where after a four-day siege he gave himself up in return for a written promise of safety.
      - Taken before the sultan at Jajce, Stephen ordered his commanders to give up their castles, and some seventy towns surrendered in a week. On 25 May he was beheaded, and Bosnia became an Ottoman province. Mahmud Pasha then attacked Herzegovina, where the old duke had to give up his lands north of Blagaj. When the sultan’s army had gone home, Matthias Corvinus invaded in the autumn, besieged Jajce and took it in December, forming a Hungarian frontier province that held until 1527. Herzegovina was conquered piece by piece; its last fortress, Herceg Novi on the Bay of Kotor, fell at the end of 1481.
