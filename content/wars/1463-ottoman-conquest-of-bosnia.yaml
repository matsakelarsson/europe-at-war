id: ottoman-conquest-of-bosnia
name: Ottoman conquest of Bosnia
start: "1463-05"
end: "1463-12-25"
tier: B
summary: Mehmed II’s rapid conquest of the Kingdom of Bosnia in 1463. King Stephen Tomašević had refused to pay tribute, trusting in help from Hungary and the pope, but when the sultan invaded in May the royal fortress of Bobovac fell within days, and the king was captured at Ključ and beheaded. Matthias Corvinus of Hungary retook Jajce and the north at the end of the year, and the duchy of Herzegovina to the south held out in part until its last fortress fell in 1481–1482.
