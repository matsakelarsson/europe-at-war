id: sonni-ali-conquests
name: Sonni Ali’s conquests
start: "1464"
end: "1492-11-06"
tier: B
summary: "The campaigns by which Sonni Ali, king of Gao from about 1464, turned the small Songhai kingdom into the leading power of the Niger bend. With a cavalry army and a fleet of river boats he took Timbuktu from the Maghsharen Tuareg in January 1468, besieged and took Djenné (in 1473 by the usual reckoning), fought a long war with the Mossi, who reached Walata in 1480 before Sonni Ali defeated them in 1483, and campaigned against the Tuareg, the Fulani, the Dogon of the cliffs and the peoples of the Gourma. He drowned on his way back from the Gourma in November 1492. The Timbuktu chroniclers, who wrote for the scholars he had persecuted and for the Askia dynasty that overthrew his son, remember him as a tyrant; Songhai tradition remembers Si Ali Ber as a great king and magician, and modern historians see in him the real founder of the Songhai Empire."
countries: [ml, ne, bf]
