  - title: The last campaigns
    date: 1483–1492
    when: "1485"
    borders: "1492-11-06"
    countries: [ml, ne, bf]
    body:
      - "In his last years Sonni Ali turned against the peoples of the escarpments and hills south of the Niger bend, whom the chronicle calls “the mountains”; all submitted except Dom. He also conquered Bara and the country of the Nunu Sanhaja, then ruled by a queen, and the lands of the Kunta, raided the Fulani and sent women captured from them to the notables of Timbuktu, and tried in vain to conquer Borgu. In 1485 he had the wall of Kabara, the port of Timbuktu, rebuilt. By the end of his reign Songhai held the Niger from the delta below Djenné to Dendi in the south-east."
      - "His last campaign took him into the Gourma, the country in the bend south of the river, against the Zaghrani and the Fulani. On the way back, on 6 November 1492 by the Tarikh al-Sudan’s date, he was swept away by a torrent and drowned. His son Abu Bakr Dao (Sonni Baru) was proclaimed king, but within months one of Sonni Ali’s generals, Muhammad Ture, seized the throne as Askia Muhammad (see “Askia Muhammad’s wars”). Songhai oral tradition, in which Si Ali Ber is a magician king, tells of his end differently, and some versions say he did not die but disappeared."
    facts:
      - [Kabara’s wall rebuilt, "1485"]
      - [Death of Sonni Ali, "6 November 1492"]
