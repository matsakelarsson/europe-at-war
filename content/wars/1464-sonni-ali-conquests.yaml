steps:
  - title: The taking of Timbuktu
    date: 1464–1470
    when: "1468"
    borders: "1468-01-30"
    countries: [ml]
    body:
      - "Sonni Ali came to the throne of Gao about 1464 and, in the words of the Tarikh al-Sudan, spent his whole reign on campaigns and conquests. His first war was against the Mossi, who were driven back from the river. Timbuktu was then held by the Maghsharen Tuareg under Akil ag Malwal, who left its government to the Timbuktu-koi. When Akil kept back the governor’s share of the taxes, the new Timbuktu-koi Ammar secretly invited Sonni Ali to take the town. Songhai horsemen appeared on the Gourma bank of the Niger, Ammar sent boats to ferry them across, and Akil fled to Walata, taking with him many of the scholars of Sankore."
      - "Sonni Ali entered Timbuktu on 29 or 30 January 1468 and sacked it. The scholar Ahmad Baba later counted it among the three sacks the town suffered, and the Tarikh al-Sudan says more blood was shed in it than when the Mossi had sacked Timbuktu. Accusing the scholars who had stayed of being friends of the Tuareg, the king had several of them killed or humiliated, and until 1470 or 1471 he pursued those who fled; at Tadjit his men overtook a party on its way to Walata and killed many of them. He also showed favour to other scholars and appointed a new qadi. The chroniclers, scholars of Timbuktu themselves, call him a tyrant who made light of Islam; historians point out that he was breaking a town elite that had sided with the Tuareg."
    facts:
      - [Accession of Sonni Ali, "about 1464"]
      - [Timbuktu taken, "29 or 30 January 1468"]
