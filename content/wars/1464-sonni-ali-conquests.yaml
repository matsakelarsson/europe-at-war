notes:
  - "Nearly everything comes from the two Timbuktu chronicles of the seventeenth century, the Tarikh al-Sudan and the Tarikh al-Fattash, both hostile to Sonni Ali. Dates are their Hijri years as converted by their translators; the chronicles disagree on some of them, notably the siege of Djenné, which is dated anywhere from 1468 to 1473, and the Tarikh al-Sudan repeats the legend that it lasted seven years, seven months and seven days. Which Mossi kingdom fought Songhai in the Niger bend is debated."
