  - title: Djenné and the Mossi war
    date: 1470–1483
    when: "1473"
    borders: "1480-08-01"
    countries: [ml, bf, mr]
    body:
      - "Djenné, the trading city of the inland Niger delta, was the next prize. Sonni Ali blockaded it with his river fleet, withdrawing each year when the flood surrounded the town and returning when the waters fell. Famine finally forced the city to surrender, by the usual reckoning in 1473. Its young king, whose father had died during the siege, came out on foot to submit; Sonni Ali received him as an equal and married his mother, and the rulers of Songhai and Djenné thereafter sat on the same carpet."
      - "Meanwhile the Mossi, the other military power of the Niger bend, struck back. Their raids reached the river in 1477, when their king took Sama, between the Niger and Walata. In July and August 1480 they besieged Walata for a month, took it and carried off families as captives, though the townspeople caught up with them and won them back. Sonni Ali began digging a canal from Ras el-Ma, at the western end of the lakes north of the Niger, towards Walata so that his boats could reach it, but abandoned the work when he heard that the Mossi were advancing against him. In 1483 he caught the Mossi king at Djiniki-To’oi near Kobi as the Mossi were returning home, routed him and pursued him into his own country."
    facts:
      - [Djenné surrenders, "1473 (sources vary)"]
      - [Mossi siege of Walata, "July–August 1480"]
      - [Battle of Kobi (Djiniki-To’oi), "1483, Songhai victory"]
