id: fall-of-the-marinids
name: Fall of the Marinids
start: "1465-05"
end: "1472"
tier: C
summary: "The overthrow of the last Marinid sultan of Morocco and the struggle for Fez that brought the Wattasids to power. From 1420 the Marinid sultan Abd al-Haqq II, put on the throne as a small child, was a figurehead for regents of the Wattasid family, a related Zenata lineage. In 1458 he massacred most of the Wattasids and ruled through a Jewish vizier, Harun ibn Battash, while the Portuguese held Ceuta and Ksar es-Seghir and Castile took Gibraltar in 1462. In May 1465, while the sultan was away, an insult to a woman of a sharifian (Prophet-descended) family started a riot in Fez; a preacher called for action against the Jews, the senior mufti approved a revolt, the Jewish quarter was attacked and the governor killed. The sharif Muhammad ibn Imran (al-Juti) was installed as ruler of the city, and when Abd al-Haqq returned he was killed, on 18 May 1465 according to one chronicler (23 May according to another). Whether a general massacre of the Jews of Fez took place is debated, since no Jewish source mentions it before the 19th century. Muhammad ibn Imran ruled Fez for six years and kept the surviving Wattasids out. One of them, Muhammad al-Shaykh, governor of Asilah, fought for the city from the north; to free his hands he made a truce with Portugal after it took Asilah and Tangier in August 1471, and he entered Fez in 1471 or 1472, founding the Wattasid sultanate."
