notes:
  - The main accounts are Arabic chronicles written later, such as those of Abd al-Basit ibn Khalil, an Egyptian traveller who was in North Africa at the time, and Ahmad ibn al-Qadi. They disagree on details and dates, and the year of the Wattasid entry into Fez is given as 1471 or 1472.
  - The Portuguese conquests in Morocco, which took Asilah and Tangier in the middle of this struggle, have their own entry.
