steps:
  - title: Kerei and Janibek leave Abu’l-Khayr
    date: 1457–1471
    when: "1465"
    borders: "1466-01-01"
    countries: [kz, kg]
    body:
      - Kerei and Janibek were Jochid princes of the house of Barak, a khan of the eastern steppe killed in 1428 (Janibek was his son), and they did not accept the rule of Abu’l-Khayr, the Shaybanid khan who had brought most of the eastern Jochid lands under his rule. After the Oirats defeated Abu’l-Khayr near Sighnaq in 1457, the two sultans led their followers east into Moghulistan. Its khan, Esen Buqa II, who needed allies against his brother Yunus and against the Uzbeks, gave them pastures in the valleys of the Chu and the Talas. People who left their rulers in this way were called qazaq, “free wanderers”, and the name stuck to them.
      - Kazakh tradition dates the founding of the Kazakh Khanate, with Kerei as its first khan, to about 1465. In 1468 Abu’l-Khayr set out against them but died on the way, and his Uzbek Khanate fell apart. His son and heir Shaykh Haydar was attacked by Ibak, khan of Tyumen, and the Nogais, and was killed in 1471; many Uzbek clans went over to the Kazakhs, who took over much of the steppe north of the Syr Darya.
    facts:
      - [Migration to Moghulistan, "1457 or soon after"]
      - [Founding of the Kazakh Khanate, "about 1465"]
      - [Death of Abu’l-Khayr, "1468"]
