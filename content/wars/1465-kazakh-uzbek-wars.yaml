  - title: Kasym Khan and the end of Shaybani
    date: 1508–1513
    when: "1510"
    borders: "1511-01-01"
    countries: [kz, uz]
    body:
      - Shaybani tried to cut the Kazakhs off from the trade of the Syr Darya towns and in 1508–1509 raided north into their lands. In the winter of 1509–1510 he led a large army against the camps of Kasym, Janibek’s son and the leading Kazakh sultan, in the foothills of the Ulytau, but the campaign failed with heavy losses. In the autumn of 1510 the Safavid shah Ismail I invaded Khorasan, and on 2 December 1510 Shaybani was defeated and killed near Merv.
      - Kasym became khan of the Kazakhs on Burunduk’s fall in 1511. He backed the Timurid Babur against the Shaybanids, took Sayram in 1513 and pushed towards Tashkent before he was wounded and turned back. Under Kasym the Kazakh Khanate ruled the steppe from the Syr Darya and the Karatau to Lake Balkhash and the Yaik, and in about 1520 he took the Nogai capital Saray-Juk. Shaybani’s successors held Bukhara and Samarkand, and the frontier between the two peoples remained the Syr Darya towns, which changed hands again in the wars of the 16th century.
    facts:
      - [Shaybani’s winter campaign, "1509–1510, Kazakh victory"]
      - [Battle of Merv, "2 December 1510, Shaybani killed by the Safavids"]
      - [Sayram taken by Kasym Khan, "1513"]
