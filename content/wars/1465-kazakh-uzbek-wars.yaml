notes:
  - Kazakh historiography dates the founding of the khanate to 1465–1466, following the Tarikh-i Rashidi of Mirza Haidar Dughlat; Russian historians have dated it to Abu’l-Khayr’s death in 1468–1471. Kazakh writers call the wars of 1468–1500 the Kazakh War of Independence.
  - The main written sources are Persian chronicles written for the Shaybanids, such as the Shaybani-nama, and Mirza Haidar Dughlat’s history, written by a Moghul prince who knew the Kazakhs. Their dates often differ, and numbers such as the million men later credited to Kasym Khan are not reliable.
  - Abu’l-Khayr’s own wars before 1468 have their own entry.
