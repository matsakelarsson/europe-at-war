id: kazakh-uzbek-wars
name: Kazakh–Uzbek wars
start: "1465"
end: "1513"
tier: B
summary: "The wars between the Kazakh sultans Kerei and Janibek and their successors and the Uzbek descendants of Abu’l-Khayr Khan, in which the Kazakh Khanate was founded and took the steppe north of the Syr Darya. In 1457 or soon after, Kerei and Janibek, Jochid princes of a rival line, left Abu’l-Khayr’s Uzbek Khanate with their followers and settled in the Chu and Talas valleys with the permission of the khan of Moghulistan; the Kazakh Khanate is usually dated from about 1465. When Abu’l-Khayr died on a campaign against them in 1468, his realm broke up and many of his people joined the Kazakhs. His grandson Muhammad Shaybani fought the Kazakh khans Burunduk and Kasym for the towns of the middle Syr Darya (Sighnaq, Sauran, Otrar, Yasi) for three decades, then turned south and conquered Mawarannahr in 1500–1507. His last campaign against the Kazakhs failed in the winter of 1509–1510, months before he was killed fighting the Safavids at Merv, and under Kasym Khan the Kazakh Khanate became the leading power of the steppe."
countries: [kz, uz, kg]
sides:
  - id: kz
    name: Kazakh Khanate
    polities: [kazakh-khanate]
    ink: teal
