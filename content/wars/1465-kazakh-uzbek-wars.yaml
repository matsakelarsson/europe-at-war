  - title: Shaybani and the Syr Darya towns
    date: 1470–1500
    when: "1473"
    borders: "1496-01-01"
    countries: [kz, uz]
    body:
      - Abu’l-Khayr’s grandson Muhammad Shaybani, backed at times by the Timurids of Samarkand, tried again and again to win back the towns of the middle Syr Darya, the trading and farming centres the steppe khans needed. In 1470 he took several fortresses, but the Kazakh sultans Mahmud and Erenshy took Sozak and Sauran and drove him back to Bukhara. After Kerei’s death in 1473 his son Burunduk became khan and beat Shaybani in a series of fights in the Karatau and around Otrar, Yasi (Turkestan) and Arquq, and Shaybani withdrew to the Mangyshlak.
      - In 1485–1486, now allied with the Moghul khan Mahmud, Shaybani seized Sighnaq, Arquq and Uzgend, but Burunduk and Janibek’s son Kasym drove him out again. Mahmud rewarded Shaybani with the town of Yasi for deserting the Timurid army in a battle on the Chirchiq in 1488, and in about 1495–1496 Burunduk and Shaybani agreed to share the region. The Kazakhs kept Sighnaq and the northern towns, and the Shaybanids Otrar, Yasi, Arquq and Uzgend. Shaybani then turned south, took Samarkand in 1500–1501 and Bukhara in the following years, and by 1507 ruled Mawarannahr and Herat.
    facts:
      - [Khan Burunduk, "1473–1511"]
      - [Division of the Syr Darya towns, "about 1495–1496"]
      - [Shaybani takes Samarkand, "1500–1501"]
