id: liege-wars
name: Liège Wars
start: "1465"
end: "1468-11"
tier: C
summary: Three risings of the city and Prince-Bishopric of Liège against Burgundian control, encouraged by Louis XI of France. Liège rejected its prince-bishop, Louis of Bourbon, a nephew of Duke Philip the Good, and was defeated at Montenaken in 1465. In 1466 Charles the Bold destroyed the allied town of Dinant and had many of its men drowned in the Meuse, and in 1467 he beat the Liégeois at Brustem and tore down their walls. When the city rose again in 1468, Charles took it by storm with Louis XI, his virtual prisoner after their meeting at Péronne, at his side. A desperate night attack on the duke’s camp by about 600 men of Franchimont failed, and Liège was sacked and burned over several weeks; many of its people were killed.
countries: [be, nl]
