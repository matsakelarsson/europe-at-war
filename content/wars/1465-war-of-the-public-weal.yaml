id: war-of-the-public-weal
name: War of the Public Weal
start: "1465-03"
end: "1465-10-29"
tier: C
summary: A revolt of great French nobles against Louis XI, led by Charles the Bold, then Count of Charolais and heir to Burgundy, with the king’s brother Charles of Berry as figurehead and Francis II of Brittany, John of Bourbon and John of Calabria among its leaders. They called their alliance the League of the Public Weal, claiming to act for the common good against the king’s ministers and taxes. The Burgundian army fought the king to a draw at Montlhéry on 16 July 1465 and besieged Paris with its allies, and Louis bought peace in the treaties of Conflans and Saint-Maur that October, giving Normandy to his brother and the Somme towns back to Burgundy. He took Normandy back the next year, and spent the rest of his reign breaking up the coalition.
