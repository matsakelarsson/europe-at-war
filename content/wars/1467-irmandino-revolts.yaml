id: irmandino-revolts
name: Irmandiño Revolts
start: "1467"
end: "1469"
tier: C
summary: The great rising of the brotherhoods (irmandades) of Galicia against the nobles who ruled the countryside from their castles. With the approval of Henry IV of Castile, peasants, townspeople, lower clergy and some lesser nobles formed a Holy Brotherhood in 1467 and, led by men such as Alonso de Lanzós and Diego de Lemos, destroyed about 130 castles and towers of families like the Andrade, Lemos and Moscoso, while the lords fled to Portugal or Castile. In 1469 Pedro Álvarez de Sotomayor, “Pedro Madruga”, led a counter-attack from Portugal with the archbishop of Santiago, other nobles and support from the kings of Castile and Portugal, and the brotherhoods were crushed. The castles were rebuilt by forced labour, until the Catholic Monarchs curbed the Galician nobility in the 1480s. An earlier rising, the Irmandade Fusquenlla of 1431–1435, had been put down in the same way.
