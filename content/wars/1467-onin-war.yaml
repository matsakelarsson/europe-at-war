steps:
  - title: Two heirs and two Hatakeyama
    date: 1464 – February 1467
    when: "1467-02"
    borders: "1467-02-22"
    countries: [jp]
    view:
      center: [135.757, 35.032]
      size: [16, 13]
    body:
      - By the 1460s the Ashikaga shoguns governed through a council of great lords, the shugo, military governors of provinces who spent much of their time in Kyoto. Two of the three families that took turns as the shogun’s deputy (kanrei), the Hatakeyama and the Shiba, were split by succession quarrels, and the two most powerful men at court, Hosokawa Katsumoto and his father-in-law Yamana Sōzen, increasingly took opposite sides in them. The shogun Ashikaga Yoshimasa, who had no son, persuaded his younger brother, a monk, to return to lay life as his heir in 1464 under the name Ashikaga Yoshimi; in 1465 Yoshimasa’s wife Hino Tomiko bore a son, Yoshihisa, and the succession too became uncertain.
      - The fighting began with the Hatakeyama. In the winter of 1466 Hatakeyama Yoshinari, backed by Yamana, marched into Kyoto with a large army, and early in 1467 the shogun took the office of kanrei and the headship of the Hatakeyama from his rival Hatakeyama Masanaga. Masanaga burned his own mansion and took position with his men in the grove of the Kamigoryō shrine, just north of the city. On the 18th day of the first month (February 1467) Yoshinari attacked him there with help from Yamana’s men. Yoshimasa had ordered the great lords to stay out of the quarrel, and Hosokawa did not come to Masanaga’s aid; Masanaga was beaten and escaped to the Hosokawa. The clash at Goryō is remembered as the first battle of the Ōnin War.
    facts:
      - [Yoshimi named heir, "1464"]
      - [Yoshihisa born, "1465"]
      - [Battle of Goryō, "18th day of the first month, Bunshō 2 (February 1467)"]
    markers:
