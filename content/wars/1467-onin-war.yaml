  - title: Fighting in the capital
    date: May – July 1467
    when: "1467-06"
    borders: "1467-06-28"
    countries: [jp]
    view:
      center: [135.755, 35.028]
      size: [16, 13]
    body:
      - Through the spring of 1467 both sides gathered troops in and around the capital. Hosokawa’s side was called the Eastern army from the position of its camp around the shogun’s palace and Hosokawa’s own residence, Yamana’s side the Western army from his headquarters a short way to the west, which gave its name to the Nishijin (“western camp”) district. In the fifth month, before fighting broke out in the capital, Akamatsu Masanori, on the Hosokawa side, invaded Harima and took back the province his family had lost to the Yamana after the Kakitsu incident, and other Eastern lords attacked Western lands in Wakasa, Echizen and Ise.
      - Before dawn on the 26th day of the fifth month (late June 1467) Eastern troops attacked the mansion of Isshiki Yoshinao, a Western lord, next to the shogun’s palace, and the battle spread through the northern city. Katsumoto took control of the palace and the shogun, saying he was protecting them from the fighting, and in the following days he obtained the shogun’s banner and orders naming the Yamana side rebels, with Ashikaga Yoshimi as commander of the forces sent against them. The fires of the street fighting burned much of Kamigyō, the upper city, from Funaokayama in the north to Nijō street in the south. Then the two armies dug in around their headquarters, a few hundred metres apart.
    facts:
      - [Akamatsu Masanori retakes Harima, "fifth month of 1467"]
      - [Fighting begins in Kyoto, "26th day of the fifth month (late June 1467)"]
      - [Strength, "about 85,000 East, 80,000 West (estimates)"]
