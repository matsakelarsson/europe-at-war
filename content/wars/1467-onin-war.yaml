id: onin-war
name: Ōnin War
start: "1467-02"
end: "1477-12-17"
tier: A
summary: "The civil war of 1467–1477 between the great lords of the Ashikaga shogunate, fought mainly in the streets of Kyoto, which left the capital in ruins and opened the Sengoku period, the age of warring states. Quarrels over the succession in the Hatakeyama and Shiba families and in the shogun’s own house drew the two most powerful men at court into opposing camps: the Eastern army of Hosokawa Katsumoto, which held the shogun Ashikaga Yoshimasa and the emperor, and the Western army of Yamana Sōzen, joined in 1467 by Ōuchi Masahiro from the far west. After the first battles of 1467 the armies faced each other across trenches inside the city for years, while hired foot soldiers burned and looted and the fighting spread to the provinces. Both commanders died in 1473, but the war dragged on until the last Western lords simply went home in December 1477. The shogunate never recovered its authority, and for more than a century real power in Japan lay with provincial warlords."
countries: [jp]
sides:
  - id: east
    name: Eastern army (Hosokawa Katsumoto, Hatakeyama Masanaga, Shiba Yoshitoshi, Akamatsu Masanori; the shogun Ashikaga Yoshimasa)
    polities: [hosokawa-clan, ashikaga-shogunate]
    ink: blue
    moves: Eastern army moves
    success: Eastern army success
  - id: west
    name: Western army (Yamana Sōzen, Hatakeyama Yoshinari, Shiba Yoshikado, Ōuchi Masahiro; from 1468 Ashikaga Yoshimi)
    polities: [yamana-clan, ouchi-clan]
    ink: red
    moves: Western army moves
    success: Western army success
notes:
  - Dates are given by the lunar month where the Western equivalent is uncertain; where English sources give a Western date, it is in the Julian calendar. The war began in the Bunshō era and takes its name from the Ōnin era (1467–1469); it ended in the ninth year of Bunmei.
  - The traditional story, told in the chronicle Ōninki written decades later, is that Hino Tomiko, the shogun’s wife, asked Yamana Sōzen to secure the succession for her infant son against the shogun’s brother Yoshimi, and that this caused the war. Historians now give more weight to the Hatakeyama and Shiba quarrels and the rivalry of the great lords, and doubt the Ōninki’s account of Tomiko’s role.
  - The Ōninki gives the Eastern army 160,000 men and the Western army more than 110,000; these figures are regarded as exaggerated, and English sources suggest about 85,000 and 80,000.
