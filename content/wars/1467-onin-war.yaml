  - title: Ōuchi Masahiro comes to Kyoto
    date: August – September 1467
    when: "1467-09"
    borders: "1467-09-21"
    countries: [jp]
    body:
      - The Western lords had called for help from Ōuchi Masahiro, lord of Suō and Nagato and the strongest power in western Japan, whose family had long quarrelled with the Hosokawa over the Inland Sea, its trade and the voyages to Ming China. Masahiro set out by sea with the troops of his own provinces and of his allies, landed at the port of Hyōgo in the seventh month and entered Kyoto on the 23rd day of the eighth month (September 1467) with an army put at about 20,000 men, camping first at the temple of Tō-ji and then on the hill of Funaokayama. His arrival gave the West the upper hand in the city.
      - As the Ōuchi army approached, the emperor Go-Tsuchimikado and the retired emperor Go-Hanazono were moved into the shogun’s palace under Eastern protection, and Ashikaga Yoshimi slipped away from Kyoto to Ise, where the Kitabatake gave him shelter. Why he left is not known; he may have feared for his safety, or been suspected of sympathy for the West. The East now held the shogun and the court but was hemmed into the north-eastern corner of the city, while the West held most of the rest.
    facts:
      - [Ōuchi fleet lands at Hyōgo, "seventh month of 1467"]
      - [Ōuchi Masahiro enters Kyoto, "23rd day of the eighth month (September 1467)"]
      - [Ōuchi army, "about 20,000"]
