  - title: Shōkoku-ji and the long stalemate
    date: October 1467 – 1469
    when: "1467-11-01"
    borders: "1467-11-01"
    countries: [jp]
    view:
      center: [135.765, 35.004]
      size: [14, 11]
    body:
      - In the autumn the fighting in the city reached its height. In the ninth month the armies clashed on the hills east of the city around the temple of Nanzen-ji, and on the 3rd day of the tenth month (1 November 1467) the West attacked the great Zen temple of Shōkoku-ji, next to the Eastern camp. The temple burned, both sides lost heavily, and neither gained a decision. After that the armies settled into a siege war inside the city, behind wooden towers and a trench about 3 m deep and 6 m wide that divided the two camps, while raiding parties burned temples and houses all around the capital.
      - The war brought a new kind of soldier. Both sides hired ashigaru, lightly armed foot soldiers recruited from townsmen, labourers and men without a lord, who raided, burned and looted behind the enemy lines. One of the Eastern ashigaru captains, Honekawa Dōken, harried the Western supply routes from the Inari shrine south of the city until the Western lords attacked him there in the spring of 1468; he was killed and the shrine burned. Contemporaries such as the courtier Ichijō Kaneyoshi blamed the ashigaru for much of the ruin of the city.
      - Meanwhile the cause of the war turned upside down. Yoshimi returned to Kyoto in 1468 but quarrelled with the shogun’s advisers, and late that year he fled to the Western camp, which set him up as a rival shogun with his own officials. Yoshimasa had him declared a rebel and named his own son Yoshihisa heir. The Eastern army, which had gone to war with Yoshimi as its commander, now fought for Yoshihisa, and the Western army for Yoshimi.
    facts:
      - [Battle of Shōkoku-ji, "1 November 1467"]
      - [Honekawa Dōken killed at Inari, "spring 1468"]
      - [Yoshimi joins the West, "late 1468"]
      - [Yoshihisa named heir, "1469"]
