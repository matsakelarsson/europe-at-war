  - title: The armies go home
    date: 1477–1488
    when: "1477-12-17"
    borders: "1477-12-17"
    countries: [jp]
    body:
      - By 1477 the war had lost its purpose. Ōuchi Masahiro, worried by the fighting in his home provinces, made his peace with the shogun, who confirmed him as governor of Suō, Nagato, Buzen and Chikuzen. In the autumn Hatakeyama Yoshinari left Kyoto for Kawachi, where he seized the province from his rival’s men, and on 17 December 1477 the Ōuchi army burned its camp and marched home. Toki Shigeyori of Mino and Hatakeyama Yoshimune of Noto burned their mansions and left too, and Ashikaga Yoshimi went with Toki to Mino. No peace treaty was signed; the Western army simply went away.
      - Kyoto lay in ruins. Much of the upper city, many of its temples and noble houses and many of the court’s records had burned, and a poem in the Ōninki laments that the capital had become an open field where skylarks rose at dusk. The shogunate never regained its authority. The lords went back to provinces where their deputies and vassals had grown strong, and in the following decades many of them were overthrown by those deputies and vassals, while the Hatakeyama cousins went on fighting each other for years.
      - Local people also took matters into their own hands. In 1485 the warriors and farmers of southern Yamashiro formed a league, forced the two Hatakeyama armies out of their district and governed it themselves for eight years, meeting at the Byōdō-in at Uji to set its laws; in 1488 the Ikkō-ikki of Kaga overthrew their governor Togashi Masachika. Historians date the beginning of the Sengoku period from the Ōnin War; it lasted until the unification of Japan under Oda Nobunaga and Toyotomi Hideyoshi more than a century later.
    facts:
      - [Ōuchi army leaves Kyoto, "16 December 1477"]
      - [Yamashiro league formed, "1485"]
      - [Kaga taken by the Ikkō-ikki, "1488"]
