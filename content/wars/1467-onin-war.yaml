  - title: War in the provinces, death of the leaders
    date: 1468–1474
    when: "1471"
    borders: "1473-06-01"
    countries: [jp]
    body:
      - As the war in the capital stalled, it spread to the provinces, where governors’ deputies, local warriors and rival branches of the great houses fought over the lands of lords who were away in Kyoto. Akamatsu Masanori won back Harima, Bizen and Mimasaka from the Yamana. The East encouraged risings in the Ōuchi lands, and in 1470 Masahiro’s uncle Ōuchi Noriyuki rebelled against him in Suō, though the Ōuchi deputy at home beat him. In Echizen, Asakura Takakage (also read Toshikage), the leading retainer of the Shiba, who had fought hard for the West in Kyoto, went over to the East in 1471 in return for the governorship of the province and fought for years to drive his rivals out of it; his castle town of Ichijōdani became the seat of one of the first Sengoku warlords. In the east, the war between the Uesugi and the Koga kubō went on alongside the war in the capital.
      - In 1473 both commanders died during an epidemic, Yamana Sōzen in the spring at the age of 69 and Hosokawa Katsumoto two months later. Yoshimasa then retired, and the eight-year-old Yoshihisa became shogun. In the spring of 1474 the heirs of the two houses, Yamana Masatoyo and Hosokawa Masamoto, made peace, and Masatoyo went over to the East. But the other Western lords, above all Ōuchi Masahiro and Hatakeyama Yoshinari, fought on in Kyoto, and the Western shogunate of Yoshimi survived for three more years.
    facts:
      - [Asakura Takakage joins the East, "1471"]
      - [Yamana Sōzen dies, "spring 1473"]
      - [Hosokawa Katsumoto dies, "1473"]
      - [Yamana–Hosokawa peace, "spring 1474"]
