id: yi-si-ae-rebellion
name: Yi Si-ae’s rebellion
start: "1467-05"
end: "1467-08"
tier: C
summary: "A rising in Hamgil (later Hamgyong) province in the north-east against King Sejo’s centralising rule. The north-east, the home region of the dynasty’s founder, had been governed by local landowning families who held the frontier against the Jurchens, but Sejo increasingly sent officials from the south and tightened control through a household tally system. Yi Si-ae, a former magistrate of Hoeryong from a powerful family of Gilju (Kilju), rose in the fifth month of 1467. He killed the provincial army commander Gang Hyo-mun at Gilju and spread rumours that troops from the south were coming to massacre the northerners; local people then killed the officials sent from the capital across the province, among them the governor, Sin Myeon, at Hamhung. Yi Si-ae also sent word to the court that Gang Hyo-mun had plotted with the great ministers Han Myeong-hoe and Sin Suk-ju, and Sejo briefly had them arrested. The king sent an army under Prince Guseong (Yi Jun), with Heo Jong, Gang Sun, Eo Yu-so and Nam I, which grew to some 30,000 men and more. Yi Si-ae’s forces, which included the province’s experienced frontier troops with firearms, held their own at Hongwon and Bukcheong, but late in the seventh month they were routed at the Mannyeong pass near Iwon. Yi Si-ae fled north towards the Jurchen lands, was seized by his own followers through a ruse of the government officer Heo Yu-rye, and was executed on the twelfth day of the eighth month. The province was split in two and the local self-governing councils (yuhyangso) were abolished."
