notes:
  - Dates are lunar months from the Annals of the Joseon Dynasty. Some English accounts give the lunar dates as if they were Western ones (for example “10 May 1467” for the killing of Gang Hyo-mun).
  - Gang Sun and Nam I, who commanded against Yi Si-ae, led the attack on the Jianzhou Jurchens later in 1467; see Joseon’s Jurchen campaigns.
