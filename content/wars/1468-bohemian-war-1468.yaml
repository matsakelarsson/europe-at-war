id: bohemian-war-1468
name: Bohemian War, 1468–1478
start: "1468"
end: "1478"
tier: C
summary: A war for the crown of Bohemia between King Matthias Corvinus of Hungary and the Utraquist King George of Poděbrady, whom Pope Paul II had condemned as a heretic and declared deposed in 1466. Matthias invaded Moravia in 1468 at the call of the Catholic lords and was elected king of Bohemia by them at Olomouc in 1469, but he never took Prague. When George died in 1471 the Bohemian estates chose the Polish prince Vladislaus II Jagiellon, and Poland joined the war. In the peace of Brno in 1478, confirmed at Olomouc in 1479, both kings kept the title; Vladislaus ruled Bohemia itself, and Matthias kept Moravia, Silesia and the two Lusatias, which Bohemia could buy back for 400,000 florins after his death.
