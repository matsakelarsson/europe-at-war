notes:
  - Dates are Julian, as usual for the period. The Catholic lords had formed the League of Zelená Hora against George in 1465. Matthias, George’s former son-in-law, had the backing of the pope and at first of Emperor Frederick III.
  - In February 1469 George’s army trapped Matthias near Vilémov, and the two kings met and agreed a truce, which Matthias soon broke. In 1474 Vladislaus and his father, Casimir IV of Poland, besieged Matthias in Breslau without success. Matthias died in 1490, Vladislaus succeeded him as king of Hungary, and the crown lands returned to Bohemia.
