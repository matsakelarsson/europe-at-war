id: ottoman-conquest-of-karaman
name: Ottoman conquest of Karaman
start: "1468"
end: "1474"
tier: C
summary: The Ottoman annexation of the Karamanid beylik of central and southern Anatolia, for two centuries the Ottomans’ strongest Turkish rival. After the death of İbrahim Bey in 1464 his sons fought over the succession, and Mehmed II backed first one and then another. In 1468 he occupied Konya and Karaman (Larende) and made the country an Ottoman province under his son Mustafa, but Pir Ahmed and his brother Kasım held out in the Taurus mountains with the help of the Turkmen tribes and of Uzun Hasan of the Aq Qoyunlu, whose army drove into Karaman in 1472. After Uzun Hasan’s defeat at Otlukbeli in 1473, Gedik Ahmed Pasha took the remaining castles in the mountains and on the coast, such as Silifke, by 1474. Karamanid pretenders kept up resistance for some years more.
