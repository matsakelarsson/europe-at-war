notes:
  - The campaign is known almost only from the Vietnamese chronicles, with notices in the Ming Shilu and the Malay Annals; no Cham inscription from Vijaya survives after 1456. Army sizes and casualty figures are those of the Vietnamese sources and cannot be checked. Lê Thánh Tông justified the war by Cham raids, which some historians think his reports to the Ming exaggerated.
  - Historians differ over how to describe the war. Ben Kiernan and others point to the emperor’s edict of 1470, which described the Cham as animals, and to the killing and deportation of Cham after the conquest, as a case of genocide; others treat it as a war of conquest typical of the period. Vietnamese historiography has long counted it as a step in the southward advance (Nam tiến).
