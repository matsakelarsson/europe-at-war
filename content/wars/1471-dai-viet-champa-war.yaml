  - title: The new frontier at Cù Mông
    date: 1471–1509
    when: "1471-06"
    borders: "1471-06-01"
    countries: [vn]
    body:
      - Lê Thánh Tông annexed the conquered land as far as the Cù Mông pass, just south of Vijaya, and made it Đại Việt’s thirteenth province, Quảng Nam, with 42 military colonies of soldier-settlers under a Vietnamese governor. The Cham general Bố Trì Trì escaped south and made himself ruler at Panduranga (around today’s Phan Rang); he and two other Cham rulers, in the Central Highlands and on the coast of today’s Phú Yên and Khánh Hòa, submitted to Lê Thánh Tông as vassals. The Ming reproached Đại Việt but did nothing.
      - Thousands of Cham were enslaved and settled in the north, among them 50 members of the royal family; in 1509 the emperor Lê Uy Mục had the remaining Cham prisoners of the war killed. The southern Cham principalities kept their kings and their trade, and, by the Malay Annals, Cham princes found refuge in Malacca and Aceh. The Cù Mông frontier held until 1611, when the Nguyễn lords annexed Phú Yên, and the last Cham principality, Panduranga, was absorbed by the Nguyễn emperor Minh Mạng in 1832.
    facts:
