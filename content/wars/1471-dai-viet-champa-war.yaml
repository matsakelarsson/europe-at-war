id: dai-viet-champa-war
name: Đại Việt–Champa war of 1471
start: "1470-11"
end: "1471-03"
tier: B
summary: "The invasion of Champa by the Lê emperor Lê Thánh Tông of Đại Việt, which destroyed the Cham capital Vijaya and ended Champa as a major power. After a Cham attack on the Vietnamese frontier at Hóa Châu in 1470, Lê Thánh Tông led south a fleet and army that the Vietnamese sources put at 250,000 men, with firearms on the Ming model. Landing on the coast of today’s Quảng Nam and Quảng Ngãi in February 1471, it overran northern Champa in two weeks, took the port of Thị Nại on 18 March and, after a siege of four days, stormed Vijaya on 22 March. The king, Trà Toàn, was captured and deported to the north; by the figures of the Vietnamese chronicles more than 30,000 Cham were captured and 40,000 executed. Đại Việt annexed the land as far as the Cù Mông pass, south of Vijaya, as the province of Quảng Nam, and the rest of Champa, centred on Panduranga in the far south, survived as a group of small principalities under Vietnamese overlordship until 1832."
countries: [vn]
