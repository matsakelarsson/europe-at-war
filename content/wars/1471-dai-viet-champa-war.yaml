steps:
  - title: The fall of Vijaya
    date: November 1470 – March 1471
    when: "1471-03"
    borders: "1471-02-01"
    countries: [vn]
    body:
      - Champa had been weakened by civil wars, and Cambodia, which it had attacked earlier, refused to help it. In 1470, by the Vietnamese account, a Cham army under King Maha Sajan besieged the Vietnamese garrison at Hóa Châu, near today’s Huế. Lê Thánh Tông informed the Ming, issued an edict setting out the reasons for war, and on 28 November 1470 led a fleet south from Hóa Châu, with a second wave of supply troops following on 8 December. The Vietnamese sources give 100,000 soldiers by sea and 150,000 more on land.
      - On 24 February 1471 a Vietnamese fleet blocked a Cham force of 5,000 men and elephants at Sa Kỳ, while the emperor landed the main army further north, near Hội An, and another column came down west of the mountains. The Vietnamese took the citadel of Mễ Cần in Quảng Ngãi with artillery on 26 February and in two weeks overran today’s Đà Nẵng, Quảng Nam and Quảng Ngãi. They took Thị Nại on the coast on 18 March and on 19 March surrounded Vijaya, where King Trà Toàn had taken refuge; the emperor rejected his offer to submit. The besiegers bombarded the walls and opened a breach in the east, and on 22 March the city fell. Trà Toàn and his family were captured and deported to the north. The chronicles give more than 30,000 Cham captured, 40,000 beheaded and, by some accounts, 60,000 killed in the fighting.
    facts:
      - [Fleet leaves Hóa Châu, "28 November 1470"]
