id: muscovite-novgorodian-war
name: Muscovite–Novgorodian War
start: "1471"
end: "1478"
tier: B
summary: The war in which Ivan III of Moscow ended the independence of the Novgorod Republic. After Novgorod turned to Lithuania for support, Ivan’s army routed the Novgorodians on the Shelon in 1471, and in January 1478 a second campaign forced the city to surrender; its assembly was abolished and its vast northern lands passed to Moscow.
countries: [ru]
sides:
  - id: mos
    name: Moscow and its allies
    polities: [russia, pskov, tver]
    ink: green
    moves: Muscovite and allied moves
    success: Muscovite success
  - id: nov
    name: Novgorod
    polities: [novgorod]
    ink: navy
    moves: Novgorodian moves
    success: Novgorodian success
notes:
  - Dates are Julian (Old Style). Most of the chronicles were written or revised in Moscow after the conquest and are hostile to Novgorod; the Moscow account claims a Novgorodian army of 40,000 at the Shelon and 12,000 dead, figures historians consider exaggerated.
  - Novgorod, called “Lord Novgorod the Great”, was governed by its assembly, the veche, its archbishop and its boyars. Its princes, by then the grand princes of Moscow, were bound by treaty and had limited powers.
