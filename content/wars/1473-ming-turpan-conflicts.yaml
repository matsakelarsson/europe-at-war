  - title: Ahmad, the embargo and Xu Jin’s raid
    date: 1488–1499
    when: "1493"
    borders: "1493-06-01"
    countries: [cn]
    body:
      - In 1488, the year the Ming finally made Hanshen prince, Ahmad (Ahmad Alaq, called Aheima in Chinese) came to Hami offering a marriage alliance, lured Hanshen to a meeting and killed him, and put Yaghlan back in the town. Hami officers retook it the next year with help from Chijin and Handong, and in 1491, under pressure from the Ming, Ahmad handed back the seal. In 1492 the Ming installed Shanba, a descendant of the old princely house, as prince. In the spring of 1493 Ahmad attacked again, captured Shanba and had the Hami commander Amulang put to death.
      - This time the Ming used trade as a weapon. The court detained Turfan’s envoys, expelled the Uyghurs and other western traders from Gansu and closed the Jiayu Pass to missions from the west. Since Turfan’s wealth came from the caravan trade, the embargo also turned Ahmad’s neighbours against him. In 1495 the governor of Gansu, Xu Jin, and the general Liu Ning made a surprise night march on Hami; Yaghlan escaped, but his garrison was killed or surrendered. The History of Ming notes that no Ming army had been there since the beginning of the dynasty.
      - Ahmad attacked Hami once more and failed, but its people, unable to hold out, burned their houses and fled to Suzhou. In 1497, with the trade still closed, Ahmad sent Shanba and the Hami people home and asked for tribute to be restored. Trade reopened, Shanba was reinstated in 1498 and peace was made in 1499, which freed Ahmad to campaign against the Oirats in the north. Ahmad died in 1504, and his son Mansur succeeded him in Turfan.
    facts:
      - [Hanshen killed by Ahmad, "1488"]
      - [Shanba captured, "spring 1493"]
      - [Xu Jin’s raid on Hami, "1495"]
      - [Shanba returned and trade restored, "1497–1499"]
