  - title: Mansur and the end of the Hami Guard
    date: 1513–1529
    when: "1524"
    borders: "1524-09-01"
    countries: [cn]
    body:
      - In 1513 Baiyaji, Shanba’s son, who had been made prince in 1505, went over to Turfan, and Mansur Khan sent Khoja Tajidin to hold Hami, which became part of the Turfan Khanate and was converted to Islam. The Ming envoy Peng Ze paid Turfan to give the town back in 1516, but in the winter of 1516–1517 Tajidin seized it again, raided Shazhou (Dunhuang) and marched into the Gansu corridor. At Shaziba a Ming detachment of 700 men under Rui Ning was wiped out, and Suzhou (Jiuquan) was threatened until its commander, Chen Jiuchou, uncovered the plotters inside the city. The raiders were beaten at Guazhou on their way back.
      - In the autumn of 1524 Mansur himself, with a force put at 20,000 horsemen, besieged Suzhou and sent raiders towards Ganzhou (Zhangye). Chen Jiuchou, now governor of Gansu, and the general Jiang Shi drove them off, and Tajidin was killed. Turfan attacked Suzhou again in 1525. In Beijing the war became part of a bitter factional struggle, and Chen Jiuchou was later imprisoned on charges of having provoked it.
      - In 1528 Yaghlan, the old commander of Hami, deserted to the Ming with his followers, and a Turfan force with some 2,000 Oirat horsemen raided towards Suzhou and was beaten. The minister of war Hu Shining then argued that Hami, whose prince served Turfan and whose people had scattered, could not be restored and was not worth the cost. The court agreed in 1529, kept the Jiayu Pass as its frontier and allowed Turfan to send tribute again. Hami stayed under Turfan, and the Ming never returned to the oasis.
    facts:
      - [Hami annexed by Turfan, "1513"]
      - [Siege of Suzhou, "autumn 1524"]
      - [Ming decides not to restore Hami, "1529"]
