steps:
  - title: Turfan takes Hami
    date: 1473–1482
    when: "1473"
    borders: "1473-06-01"
    countries: [cn]
    body:
      - Hami lay on the road from the Gansu corridor to the oases of the Tarim basin. Its rulers, descendants of the Chagatai prince Gunashiri, had accepted a Ming guard and the title of Loyal and Obedient Prince (Zhongshun Wang) in 1404–1406, and Hami became the station where missions from Central Asia were checked and fed on their way to Beijing. By the 1460s it was weak, raided by Mongols and ruled by the widow of a prince. Turfan, to the west, had absorbed the neighbouring oases of Qara-Khoja and Lukchun and grown strong under its ruler Sultan Ali (Sutan Ali in Chinese), who styled himself sultan; some historians identify him with Yunus Khan of Moghulistan.
      - In the spring of 1473 Sultan Ali took Hami, carried off the princess dowager and the gold seal of the Hami princes, and left his brother-in-law Yaghlan to hold the town. The Ming court sent the generals Li Wen and Liu Wen to Gansu. In the winter of 1474 they led troops of the Hami chief Hanshen and the Mongol and Tibetan guards of Chijin and Handong as far as the Bulongjir river near Guazhou, but turned back without fighting. The Ming built a new fort at Kuyu, inside the frontier, for the Hami refugees and moved the Hami Guard there.
      - In the spring of 1482 Hanshen gathered about 10,000 men, 1,300 of them from Chijin and Handong, attacked Hami by night and took it. Yaghlan fled, and eight more towns were retaken. According to the History of Ming, Sultan Ali had died in 1478 and been succeeded by his son Ahmad.
    facts:
      - [Turfan takes Hami, "spring 1473"]
      - [Ming expedition turns back, "winter 1474"]
      - [Hanshen retakes Hami, "spring 1482"]
