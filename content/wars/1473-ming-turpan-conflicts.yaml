id: ming-turpan-conflicts
name: Ming–Turfan conflicts
start: "1473"
end: "1529"
tier: B
summary: "A long struggle between Ming China and the Turfan Khanate, the eastern successor of Moghulistan, over the oasis of Hami (Kumul) at the western end of the Gansu corridor. Hami, ruled by a branch of the Chinggisid house known in Chinese as the Hami Guard, was the Ming’s gate to Central Asia and a vassal that sent tribute. Sultan Ali of Turfan seized it in 1473; Ming-backed Hami princes retook it in 1482, Ali’s son Ahmad took it again in 1488 and 1493, and the Ming answered with trade embargoes, the closing of the Jiayu Pass and, in 1495, a raid that briefly retook the oasis. Under Mansur Khan, Turfan annexed Hami in 1513 and raided the Gansu corridor in 1516–1517, 1524 and 1528, besieging Suzhou (Jiuquan). The garrisons held, but in 1529 the Ming court decided not to restore the Hami Guard and to accept Turfan’s tribute, leaving Hami to Turfan."
countries: [cn]
sides:
  - id: mg
    name: Ming China and the Hami princes
    polities: [ming, kara-del]
    ink: red
    moves: Ming and Hami moves
    success: Ming success
  - id: tf
    name: Turfan Khanate
    polities: [turfan-khanate]
    ink: teal
    moves: Turfan moves
    success: Turfan success
notes:
  - Most of the record is Chinese, from the Ming Veritable Records and the History of Ming, which tell the story from the court’s side; Persian and Turkic sources such as Mirza Haidar Dughlat’s Tarikh-i Rashidi say little about Hami. Years are given as in those sources; exact days are rarely known.
  - Names are given in their common English forms with the Chinese forms used in the Ming sources in brackets where they help (Sultan Ali for Sutan Ali, Ahmad for Aheima, Mansur for Mansu’er, Yaghlan for Yalan).
