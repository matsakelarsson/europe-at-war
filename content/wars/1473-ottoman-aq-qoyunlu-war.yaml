id: ottoman-aq-qoyunlu-war
name: Ottoman–Aq Qoyunlu War
start: "1472"
end: "1473-08-11"
tier: C
summary: The war between Mehmed II and Uzun Hasan, ruler of the Aq Qoyunlu (White Sheep) Turkmen, who had made himself master of eastern Anatolia, Iran and Iraq. Allied with Venice and the Karamanids, Uzun Hasan sent an army into Anatolia in 1472 that sacked Tokat and drove into Karaman before it was beaten back. In 1473 Mehmed marched east with a large army and his sons Bayezid and Mustafa. On the upper Euphrates near Tercan, an Ottoman force that crossed the river was routed early in August, but on 11 August 1473 at Otlukbeli the Ottoman janissaries, guns and firearms broke Uzun Hasan’s army. Mehmed did not pursue him into Iran, but the Aq Qoyunlu never again threatened Ottoman Anatolia, and the Karamanids and Venice lost their eastern ally.
countries: [tr, ir]
