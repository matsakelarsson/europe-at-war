id: tlatelolco-war
name: Tlatelolco War
start: "1473"
end: "1473"
tier: C
summary: "The war in which Tenochtitlan conquered Tlatelolco, its twin Mexica city on the north of the same island in Lake Texcoco. Tlatelolco had its own rulers and held the greatest market in central Mexico; it had fought beside Tenochtitlan against the Tepanecs but was not one of the three partners of the Triple Alliance. Its ruler Moquihuix was married to Chalchiuhnenetzin, the sister of Axayacatl, who had become ruler of Tenochtitlan in 1469. The sources give different causes: insults and fights between young nobles of the two cities in the market, a canal dug by Tlatelolco and filled in, and Moquihuix’s ill-treatment of his wife, who is said to have warned her brother that her husband was plotting war. According to the Dominican Diego Durán, a Tlatelolca night attack on Tenochtitlan was beaten off, and Axayacatl’s warriors then pushed into Tlatelolco and its market square. Moquihuix and his adviser Teconal took refuge on top of the great temple, where Axayacatl killed them, or, in the Codex Mendoza, Moquihuix threw himself down the steps. The chronicler Chimalpahin says the fighting lasted a year. Tlatelolco lost its dynasty and was ruled by military governors appointed from Tenochtitlan, and it paid tribute like a conquered town, though its people kept a separate identity. In 1521 Tlatelolco was the last part of the city to hold out against the Spaniards."
