notes:
  - "The war is known from accounts written down after the Spanish conquest, above all Durán’s History of the Indies of New Spain, the Codex Mendoza and Chimalpahin’s annals, which come from the Tenochca side or from Tlatelolco and disagree on the causes, the course and the death of Moquihuix. The year 1473 is the one they generally give."
