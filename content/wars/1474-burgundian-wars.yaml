id: burgundian-wars
name: Burgundian Wars
start: "1474"
end: "1477-01-05"
tier: B
summary: The wars between Charles the Bold, Duke of Burgundy, and the Swiss Confederates and their allies on the upper Rhine and in Lorraine. Swiss infantry beat the Burgundian army at Grandson and Morat in 1476, and Charles was killed at Nancy in January 1477; his death broke up the Burgundian state, divided between France and the Habsburgs through his daughter Mary’s marriage to Maximilian.
countries: [ch, fr, de, be, nl, lu, at]
sides:
