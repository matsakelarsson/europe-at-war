    polities: [hre]
    ink: gold
    moves: Imperial moves
    success: Imperial success
  - id: fr
    name: France
    polities: [france]
    ink: navy
    moves: French moves
    success: French success
notes:
  - The Swiss allies were Sigismund of Austria, ruler of Tyrol and the Habsburg lands on the upper Rhine; the Lower Union of Basel, Strasbourg, Colmar, Sélestat and other Alsatian towns; and, from 1475, René II of Lorraine. Louis XI of France paid subsidies but sent no army against Charles until after his death.
  - Places in the Vaud are given their French names, with the German name where English accounts often use it (Morat/Murten).
