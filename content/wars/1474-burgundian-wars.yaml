  - title: Grandson and Morat
    date: "1476"
    when: "1476-02-28"
    borders: "1476-06-22"
    countries: [ch, fr]
    body:
      - In February 1476 Charles crossed the Jura with a large army and besieged Grandson, on Lake Neuchâtel, which the Bernese had taken from its Savoyard lord. The garrison of about 400 men surrendered on 28 February, and Charles had them hanged from the trees or drowned in the lake. On 2 March the Swiss army marching to relieve the town ran into the Burgundians a few kilometres to the north-east. As the Swiss columns of pikemen came on, Charles tried to redeploy; the movement turned into panic and his army fled, leaving its guns, tents and the duke’s treasure. Pieces of this “Burgundian booty” are still kept in Swiss museums.
      - Charles raised a new army in camp near Lausanne and in June besieged Morat (Murten), held by a Bernese garrison under Adrian von Bubenberg. The Confederates gathered with René of Lorraine and contingents from Alsace and Austria, and on 22 June, after a morning of rain, they stormed the palisade the Burgundians had built facing east. Charles had not expected an attack that day, and his army was caught strung out between its camp and the lake. Thousands were cut down or drowned in Lake Morat; some estimates put the Burgundian dead at 10,000 or more. Savoy soon made its peace with the Swiss and France.
    facts:
      - [Garrison of Grandson, "about 400 men killed after surrendering, 28 February 1476"]
      - [Battle of Grandson, "2 March 1476, Swiss victory"]
      - [Battle of Morat, "22 June 1476, Swiss and allied victory"]
    markers:
      - kind: taken
        side: bur
        name: Grandson
        date: 28 February 1476
        text: After a short siege the castle surrendered. The garrison, expecting mercy, was put to death on the duke’s orders.
        lonlat: [6.646, 46.809]
        lp: l
      - kind: battle
        side: ch
        name: Battle of Grandson
        date: 2 March 1476
        text: The Swiss vanguard met the Burgundians between Concise and Grandson. Their army scattered with few losses, but abandoned everything it carried.
        lonlat: [6.715, 46.85]
      - kind: event
        side: bur
        name: Lausanne
        date: March – May 1476
        text: Charles rebuilt and drilled his army in a great camp above the town.
        lonlat: [6.633, 46.52]
      - kind: event
        side: ch
        name: Bern
        date: June 1476
        text: The leading city of the confederates gathered the relief army for its threatened outpost at Morat.
        lonlat: [7.447, 46.948]
      - kind: battle
        side: ch
        name: Battle of Morat
        date: 22 June 1476
        text: The town held out for nearly two weeks of siege until the Confederates attacked. The Burgundian army was destroyed as a fighting force.
        lonlat: [7.117, 46.93]
        lp: l
