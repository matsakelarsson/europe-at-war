  - title: Nancy
    date: 1476–1477
    when: "1477-01-05"
    borders: "1477-01-04"
    countries: [fr, ch, be, nl, lu]
    body:
      - René II won back Nancy in October 1476, and Charles, against advice, besieged it again with a much weakened army through a hard winter. René raised an army of Swiss mercenaries, Alsatians and Lorrainers, paid partly with French money, and on 5 January 1477 attacked the Burgundian lines south of the town in snow. While part of the Swiss held the Burgundians in front, a column marched round through the woods and fell on their flank, and the army broke. Charles was killed in the rout. His body, stripped and with the head split open, was found two days later frozen in a pond.
      - His only child, Mary, aged nineteen, inherited his lands. Louis XI at once occupied the duchy of Burgundy and sent troops into Picardy, Artois and Franche-Comté. In Ghent the estates made Mary grant them the Great Privilege, restoring the local liberties her father and grandfather had curbed. In August 1477 she married Maximilian of Habsburg, the Emperor’s son, who took up the war with France. The Swiss gained little land, but their victories made their pikemen the most sought-after mercenaries in Europe.
    facts:
      - [Battle of Nancy, "5 January 1477, victory for Lorraine and the Swiss; Charles the Bold killed"]
      - [Great Privilege, "11 February 1477"]
      - [Mary of Burgundy marries Maximilian, "19 August 1477, Ghent"]
    markers:
      - kind: battle
        side: ch
        name: Battle of Nancy
        date: 5 January 1477
        text: The far outnumbered Burgundians were overwhelmed. A Swiss saying sums up the war — Charles lost his goods at Grandson, his courage at Morat and his blood at Nancy.
        lonlat: [6.199, 48.677]
      - kind: event
        side: ch
        name: Saint-Nicolas-de-Port
        date: 4 January 1477
        text: René’s army gathered here on the Meurthe, a few kilometres from the Burgundian siege lines.
        lonlat: [6.3, 48.633]
        lp: b
      - kind: taken
        side: fr
        name: Dijon
        date: early 1477
        text: Royal troops occupied the capital of the duchy of Burgundy, which Louis XI claimed had reverted to the crown for lack of a male heir.
        lonlat: [5.017, 47.317]
      - kind: event
        side: bur
        name: Ghent
        date: 11 February 1477
        text: The estates of the Low Countries, meeting in Ghent, forced Mary to grant the Great Privilege before they would help her.
        lonlat: [3.72, 51.05]
