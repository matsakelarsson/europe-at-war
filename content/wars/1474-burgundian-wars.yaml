steps:
  - title: Neuss and Héricourt
    date: 1474–1475
    when: "1474-05-09"
    borders: "1475-11-30"
    countries: [fr, de, ch, at]
    body:
      - Charles the Bold, Duke of Burgundy since 1467, ruled most of the Low Countries as well as the duchy and county of Burgundy, and hoped to join them into a kingdom. In 1469 Sigismund of Austria pledged him the Habsburg lands in Upper Alsace and the Breisgau for 50,000 florins. Charles’s bailiff there, Peter von Hagenbach, ruled harshly and harassed the trade of Basel, Strasbourg and Mulhouse, which turned to Bern for help. In 1474 Sigismund made a lasting peace with his old enemies the Swiss and joined them and the Alsatian towns against Burgundy. The pledged lands rose, and Hagenbach was tried and beheaded at Breisach on 9 May.
      - That summer Charles laid siege to Neuss, on the Rhine, to support his ally Archbishop Ruprecht of Cologne against the chapter and towns that had rejected him. The town held out for almost eleven months, and when the Emperor Frederick III came with an imperial army, Charles came to terms and withdrew in June 1475. Meanwhile the Swiss declared war and, with their allies, beat a Burgundian army at Héricourt on 13 November 1474, and in 1475 Bern overran the Vaud, which belonged to Charles’s ally Savoy. Charles made a truce with Louis XI and turned on Lorraine, whose young duke René II had joined his enemies. Nancy fell on 30 November 1475.
    facts:
      - [Execution of Hagenbach, "9 May 1474, Breisach"]
      - [Siege of Neuss, "July 1474 – June 1475"]
      - [Battle of Héricourt, "13 November 1474, Swiss and allied victory"]
    markers:
      - kind: event
        side: ch
        name: Breisach
        date: 9 May 1474
        text: Hagenbach was tried by judges sent from the towns of the upper Rhine for the crimes of his rule and beheaded. The trial is sometimes called the first international war crimes trial.
        lonlat: [7.583, 48.033]
      - kind: held
        side: emp
        name: Neuss
        date: July 1474 – June 1475
        text: The small, well-fortified town beat off repeated assaults and was finally relieved by the approach of the imperial army.
        lonlat: [6.69, 51.2]
      - kind: battle
        side: ch
        name: Battle of Héricourt
        date: 13 November 1474
        text: Swiss, Austrian and Alsatian troops besieging the Burgundian castle of Héricourt routed a relief army sent from Franche-Comté.
        lonlat: [6.767, 47.583]
      - kind: taken
        side: bur
        name: Nancy
        date: 30 November 1475
        text: Charles took the capital of Lorraine after a short siege, making it the link between his northern and southern lands.
        lonlat: [6.185, 48.694]
