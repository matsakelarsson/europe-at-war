id: moldavian-ottoman-war
name: Moldavian–Ottoman War, 1474–1476
start: "1474-11"
end: "1476-08"
tier: B
summary: The war between Stephen III (the Great) of Moldavia and Mehmed II after Stephen stopped paying tribute and fought for control of Wallachia. In January 1475 Stephen destroyed an Ottoman army in the fog at Vaslui, one of the worst Ottoman defeats of the century. The next year Mehmed invaded in person and beat Stephen at Valea Albă, but he could not take Suceava or Neamț, and hunger and plague forced him to withdraw.
countries: [ro, md, ua]
