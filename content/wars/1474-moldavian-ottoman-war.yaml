steps:
  - title: Vaslui
    date: 1474–1475
    when: "1474-11"
    borders: "1475-12"
    countries: [ro, md, ua]
    body:
      - Stephen III had fought his way into Wallachia to drive out the Ottoman vassal Radu the Handsome, and in 1473 he stopped paying tribute. Late in 1474 Mehmed II ordered Hadım Süleyman Pasha, the governor of Rumelia, to break off the siege of Shkodër and march on Moldavia. His tired army, joined by Wallachians, crossed the frozen country towards Vaslui. Stephen, with Moldavian peasants and boyars, Székelys and Polish and Hungarian contingents, waited at Podul Înalt, the high bridge over the Bârlad river.
      - On the foggy morning of 10 January 1475 the Moldavians lured the Ottoman army into the marshy valley with the sound of drums and bugles, then attacked it from the woods on all sides. The Ottomans broke and fled with heavy losses. Stephen sent captured standards to the king of Poland and the pope, who praised him as a champion of Christendom, but little help followed. That summer an Ottoman fleet took the Genoese port of Caffa in the Crimea, and in December Mangup, capital of the Greek principality of Theodoro, whose ruler was Stephen’s brother-in-law, fell after a long siege.
    facts:
      - [Battle of Vaslui, "10 January 1475, Moldavian victory"]
      - [Caffa surrenders to the Ottomans, 6 June 1475]
      - [Mangup falls, "December 1475"]
    markers:
