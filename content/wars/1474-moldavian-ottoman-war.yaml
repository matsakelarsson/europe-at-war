  - title: Valea Albă
    date: 1476
    when: "1476-06"
    borders: "1476-08"
    countries: [ro, md]
    body:
      - In the summer of 1476 Mehmed II led a large army into Moldavia, with Wallachians under Basarab Laiotă, while the Crimean Tatars attacked from the north; the Moldavians drove the Tatars back. With many of his men away defending their homes, Stephen faced the sultan with a small army near Neamț. On 26 July, at Valea Albă (Războieni), he was surrounded and defeated, and escaped with few followers.
      - Mehmed advanced to Suceava, which he burned, but the citadel held out, as did the fortresses of Neamț and Hotin. The Ottoman army ran short of food, plague broke out, and a Hungarian and Transylvanian army under Stephen Báthory and Vlad III approached. In August Mehmed withdrew across the Danube. Stephen soon rebuilt his army and helped Vlad back onto the Wallachian throne in November, though Vlad was killed within weeks. Moldavia kept its independence for now, but in 1484 the Ottomans took Kiliia and Cetatea Albă, its ports on the Black Sea.
    facts:
      - [Battle of Valea Albă, "26 July 1476, Ottoman victory"]
      - [Ottomans withdraw, August 1476]
    markers:
      - kind: battle
        side: ott
        name: Valea Albă
        date: 26 July 1476
        text: Also called Războieni. Stephen attacked the Ottoman vanguard but was surrounded as the sultan fed in more troops.
        lonlat: [26.56, 47.078]
      - kind: held
        side: mol
        name: Suceava
        date: August 1476
        text: The town was burnt, but the citadel resisted the Ottoman siege.
        lonlat: [26.256, 47.651]
      - kind: held
        side: mol
        name: Neamț
