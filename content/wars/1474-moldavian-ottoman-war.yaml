    name: Moldavia
    polities: [moldavia]
    ink: brown
    moves: Moldavian moves
    success: Moldavian success
  - id: ott
    name: Ottoman Empire and its allies
    polities: [ottoman, wallachia, crimean-khanate]
    ink: teal
    moves: Ottoman moves
    success: Ottoman success
notes:
  - The figures are uncertain. Polish and Venetian reports of 40,000 to 100,000 Ottoman dead at Vaslui are surely exaggerated, though the defeat was severe. A Polish chronicler put Stephen’s army at 30,000–40,000, including Székely, Polish and Hungarian contingents.
  - Wallachia changed rulers several times in these years. Basarab Laiotă, first Stephen’s candidate, went over to the Ottomans and joined their army in 1475 and 1476.
