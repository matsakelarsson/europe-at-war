id: war-of-the-castilian-succession
name: War of the Castilian Succession
start: "1475-05-10"
end: "1479-09-04"
tier: B
summary: The war for the throne of Castile after the death of Henry IV in 1474, between his half-sister Isabella, married to Ferdinand of Aragon, and his daughter Joanna, called la Beltraneja, backed by her uncle and betrothed, Afonso V of Portugal, and by Louis XI of France. The indecisive battle of Toro in 1476 turned into a political victory for Isabella, while Portugal won the war at sea. By the Treaty of Alcáçovas in 1479 Afonso gave up his claim, Castile kept the Canary Islands and Portugal the rest of the Atlantic islands and the trade of Africa. Ferdinand had become king of Aragon that January, and the two crowns were now joined under the Catholic Monarchs.
countries: [es, pt, fr]
sides:
  - id: isa
    name: Isabella and Ferdinand
    polities: [castile, aragon]
    ink: gold
    moves: Moves by Isabella and Ferdinand
    success: Success for Isabella and Ferdinand
  - id: jua
    name: Joanna, Portugal and France
    polities: [portugal, france]
    ink: green
    moves: Portuguese and allied moves
    success: Success for Joanna’s side
notes:
  - Joanna’s enemies claimed that she was not Henry IV’s daughter but that of his favourite, Beltrán de la Cueva, hence the nickname la Beltraneja. Historians still debate it; her supporters called her the Excellent Lady. Some historians prefer the neutral name War of 1475–1479.
  - Both sides claimed Toro as a victory, and historians still disagree about who won the battle itself. Dates are Julian.
