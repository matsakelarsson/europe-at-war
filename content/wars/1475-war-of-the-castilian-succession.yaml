  - title: The war at sea and the Treaty of Alcáçovas
    date: 1476–1479
    when: "1477"
    borders: "1479-09-04"
    countries: [es, pt]
    body:
      - Louis XI gave Afonso nothing, and in 1478 he made peace with Castile. In Castile Isabella’s troops took the castle of Toro and reduced the remaining nobles of Joanna’s party one by one. The war went on along the frontier and at sea, where Castilian ships challenged Portugal’s hold on the trade of West Africa and the Atlantic islands. In 1478 a Portuguese fleet captured a Castilian fleet trading at the gold coast of Mina, in the Gulf of Guinea. On land, the last Portuguese invasion was beaten at La Albuera, near Badajoz, on 24 February 1479 by the Master of Santiago, Alonso de Cárdenas.
      - The peace was arranged by Isabella’s aunt, Beatrice, Duchess of Viseu, who was also Afonso’s sister-in-law, in talks at Alcántara, and signed at Alcáçovas on 4 September 1479. Afonso gave up his claim to Castile, and Isabella and Ferdinand theirs to Portugal. Castile kept the Canary Islands; Portugal kept Madeira, the Azores and Cape Verde, the trade and conquest of the African coast and the right to conquer Fez. Joanna had to choose between a convent and a betrothal to Isabella’s infant son. She chose the convent, and lived on in Portugal until 1530, still signing herself “I, the Queen”.
    facts:
      - [Battle of Guinea, "1478, Portuguese victory"]
      - [Battle of La Albuera, "24 February 1479, Castilian victory"]
      - [Treaty of Alcáçovas, "4 September 1479"]
    markers:
