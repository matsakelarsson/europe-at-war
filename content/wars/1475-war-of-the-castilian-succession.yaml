steps:
  - title: Toro
    date: 1474–1476
    when: "1474-12-13"
    borders: "1476-03-01"
    countries: [es, pt, fr]
    body:
      - When Henry IV of Castile died in December 1474, his half-sister Isabella had herself proclaimed queen at Segovia. Her rival was Henry’s daughter Joanna, aged twelve. Joanna’s supporters, led by the Marquis of Villena and the Archbishop of Toledo, turned to her uncle, Afonso V of Portugal. He invaded on 10 May 1475, was betrothed to Joanna at Plasencia, where the two were proclaimed king and queen of Castile, and won over Toro and Zamora. In September Louis XI of France allied with him, and the next spring a French army attacked Fuenterrabía in the Basque country but was beaten off.
      - Ferdinand gathered an army and in December 1475 won back the town of Zamora, though not its castle. In February 1476 Afonso, reinforced by his son, Prince John, besieged Ferdinand there in vain. On 1 March, as the Portuguese fell back, Ferdinand caught them near Toro, at Peleagonzalo, and they fought in the rain as darkness fell. Ferdinand’s wing broke Afonso’s, while Prince John beat the Castilians facing him and held the field. Both claimed the victory, but Isabella made the most of it. Zamora castle surrendered, nobles came over to her, and in the autumn Afonso sailed for France to beg Louis XI for help.
    facts:
      - [Isabella proclaimed queen, "13 December 1474, at Segovia"]
      - [Afonso V invades, "10 May 1475"]
      - [Battle of Toro, "1 March 1476, indecisive"]
