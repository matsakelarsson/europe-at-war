  - title: The defeat near Taximaroa
    date: "1476–1479"
    when: "1478"
    borders: "1478-06-01"
    countries: [mx]
    view: {center: [-100.35, 19.1], size: [320, 210]}
    body:
      - Axayacatl led his army west across the mountains, 24,000 men by Durán’s count and 32,000 in other accounts, and took several Purépecha frontier towns around Taximaroa. Near Taximaroa he met a Purépecha army that the chronicles put at 40,000 to 50,000. The Purépecha surrounded the Aztec army and routed it. The Mexica histories say that of more than 20,000 men only about 200 came home; whatever the true figure, it was the first great defeat of the Triple Alliance, and a song lamenting the dead, the Huehue cuicatl, is attributed to Axayacatl himself.
      - The sources date the defeat to 1476, 1478 or 1479. Axayacatl fought no more great campaigns and died in 1481. On the other side Tzitzipandáquare fortified the eastern frontier with military centres such as Cutzamala in the south, and let Otomí and Matlatzinca refugees driven out by the Aztecs settle on the border on condition that they defended it.
      - From the 1480s Axayacatl’s brother Ahuitzotl renewed the conflict, backing attacks on Michoacán by the Matlatzinca, Chontales and Cuitlatecs; the Purépecha, now under Zuangua, drove them back. The frontier held for the rest of the Aztec Empire’s history. In 1520, when the Mexica asked for help against the Spaniards, Zuangua refused.
    facts:
      - [Defeat near Taximaroa, "1476, 1478 or 1479"]
      - [Aztec army, "24,000–32,000 (chronicle figures)"]
