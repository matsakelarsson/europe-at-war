id: aztec-tarascan-war
name: Aztec–Tarascan War
start: "1476"
end: "1479"
tier: B
summary: "The attempt by the Aztec ruler Axayacatl to conquer the Purépecha (Tarascan) kingdom of Michoacán, the other great power of central Mexico, which ended in the worst defeat the Triple Alliance ever suffered. After taking the Toluca Valley from the Matlatzinca, Axayacatl marched west with an army that the chronicles put at 24,000 to 32,000 men, took several frontier towns and was routed near Taximaroa by a larger Purépecha army; the Mexica histories say only a few hundred men came home. The Purépecha then fortified their eastern border, which held until the Spanish conquest."
countries: [mx]
sides:
  - id: az
    name: Aztec Triple Alliance (Axayacatl)
    polities: [aztec-empire]
    ink: red
    moves: Aztec moves
    success: Aztec success
  - id: pur
    name: Purépecha (Tarascan) kingdom (Tzitzipandáquare)
    polities: [tarascan-state]
    ink: purple
    moves: Purépecha moves
    success: Purépecha success
notes:
  - "The war is known mainly from Mexica chronicles written down after the Spanish conquest, above all those of Diego Durán and Hernando Alvarado Tezozomoc, which drew on a common older source. The Purépecha side is barely recorded. The sources give the year of the defeat as 1476, 1478 or 1479, and their figures for the armies and the dead are not reliable."
  - "The Spaniards called the Purépecha Tarascans, a name many Purépecha today reject. Taximaroa is today’s Ciudad Hidalgo in Michoacán."
