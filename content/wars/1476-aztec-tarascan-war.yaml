steps:
  - title: The Toluca Valley
    date: "1472–1476"
    when: "1474"
    borders: "1474-06-01"
    countries: [mx]
    view: {center: [-100.35, 19.45], size: [320, 170]}
    body:
      - By the middle of the 1400s two expanding states faced each other across the mountains west of the Valley of Mexico. The Aztec Triple Alliance pushed west from Tenochtitlan; the Purépecha kingdom, ruled from Tzintzuntzan on Lake Pátzcuaro, pushed east under its king Tzitzipandáquare, reaching the Pacific coast at Zacatula and the Toluca Valley in about 1460. Between them lived the Matlatzinca, Mazahua and Otomí of the Toluca Valley.
      - Axayacatl, ruler of Tenochtitlan from 1469, crushed the neighbouring city of Tlatelolco in 1473 and then turned on the Toluca Valley. In campaigns dated to about 1474 his armies took Toluca and the Matlatzinca towns, and many Matlatzinca fled west into Michoacán. With the valley in his hands, Axayacatl prepared to attack the Purépecha themselves.
    facts:
      - [Axayacatl ruler of Tenochtitlan, 1469–1481]
      - [Toluca Valley conquered, "about 1474"]
