id: austrian-hungarian-war-1477
name: Austrian–Hungarian War, 1477–1488
start: "1477"
end: "1488"
tier: C
summary: A war between King Matthias Corvinus of Hungary and Emperor Frederick III, as ruler of the Austrian lands, fought mostly in Lower Austria. Matthias declared war in June 1477 after Frederick had invested his rival Vladislaus II with Bohemia, and by the peace of Gmunden and Korneuburg that December won recognition as king of Bohemia. When fighting resumed in the early 1480s, Matthias’s mercenary Black Army took Hainburg, Korneuburg and other strongholds, starved Vienna into surrender on 1 June 1485 and took Wiener Neustadt in August 1487. Matthias held Vienna, where he kept his court, most of Lower Austria and parts of Styria and Carinthia until his death in 1490, after which Frederick’s son Maximilian recovered them.
