notes:
  - Dates are Julian, as usual for the period. Frederick received little help from the princes of the Empire; an imperial army under Duke Albert of Saxony was raised only in 1487. Albert agreed an armistice with Matthias at St. Pölten, which was extended until Matthias died.
  - Vienna was held for Hungary from 1485 to 1490 but was not made the capital of Hungary. Under the Peace of Pressburg of 1491, Maximilian gave up the claim to the Hungarian throne for the time being in return for the right to succeed if Vladislaus II died without a son.
