id: war-of-the-burgundian-succession
name: War of the Burgundian Succession
start: "1477-01"
end: "1482-12-23"
tier: C
summary: The war between Louis XI of France and Maximilian of Habsburg over the lands of Charles the Bold, killed at Nancy in January 1477. Louis seized the duchy of Burgundy and Picardy and occupied Franche-Comté and Artois, while Charles’s daughter Mary married Maximilian and kept the Low Countries. Maximilian beat the French at Guinegate on 7 August 1479 but could not follow up his victory. After Mary’s death in a riding accident in 1482, the estates of Flanders forced him to accept the Treaty of Arras, which left the duchy of Burgundy and Picardy to France and promised Artois and Franche-Comté as the dowry of his daughter Margaret, betrothed to the future Charles VIII.
countries: [fr, be, nl, lu]
