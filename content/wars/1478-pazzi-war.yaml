id: pazzi-war
name: Pazzi War
start: "1478-07"
end: "1480-12-03"
tier: C
summary: The war that followed the Pazzi conspiracy of 26 April 1478, in which conspirators backed by Pope Sixtus IV killed Giuliano de’ Medici in Florence cathedral and wounded his brother Lorenzo; the Florentines hanged the Archbishop of Pisa and others in revenge. The pope excommunicated Lorenzo, put Florence under interdict and, with Ferdinand I of Naples, made war on it. Neapolitan and papal armies under Alfonso, Duke of Calabria, invaded Tuscany, while Florence’s allies Milan and Venice gave little help; on 7 September 1479 Alfonso routed the Florentines at Poggio Imperiale near Poggibonsi and went on to take Colle di Val d’Elsa. In December 1479 Lorenzo sailed to Naples and in three months of talks won Ferdinand over to peace. The Ottoman capture of Otranto in August 1480 then pushed Sixtus to make his own peace with Florence in December 1480.
countries: [it]
sides:
