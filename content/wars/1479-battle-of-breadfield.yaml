id: battle-of-breadfield
name: Battle of Breadfield
start: "1479-10-09"
end: "1479-10-13"
tier: C
summary: The defeat of a large Ottoman raiding army in Transylvania by the forces of King Matthias Corvinus. In October 1479 Ottoman akıncı raiders and other troops under Ali Koca Bey, with Wallachian infantry of Basarab the Younger, crossed into southern Transylvania, plundering villages and taking captives. On 13 October the voivode of Transylvania, Stephen Báthory, attacked their camp on the Breadfield (Kenyérmező) near Alkenyér (Șibot) on the Mureș. The Ottomans had the upper hand, and Báthory was nearly captured, until Pál Kinizsi, count of Temes, charged with the heavy cavalry and Serbian horsemen and broke first their left and then their centre. Hungarian, Székely, Saxon, Serbian and Romanian soldiers fought on the Christian side, and losses were heavy on both sides. The victory kept large Ottoman raids out of Transylvania and southern Hungary for years.
countries: [ro, hu, rs, tr]
