notes:
  - The war is pieced together from the Lao chronicles, the chronicles of Nan and Chiang Mai, the Ming Shilu and the Vietnamese chronicles, which disagree on almost every point. The Vietnamese sources give Lê Thánh Tông 300,000 men and the Lao chronicles give the Lao army 200,000 men and 2,000 elephants; these are not credible as counts. The Ming Shilu reports two Vietnamese defeats in late 1479, with 20,000 and 30,000 losses, before the main invasion. Dates beyond the year are uncertain except for the Ming reports.
  - Historians judge the outcome differently. Lao, Lan Na and Chinese sources record a Vietnamese defeat and withdrawal; Vietnamese writers saw the destruction of Xieng Khouang and the securing of the western frontier as a success.
