  - title: Nan, the Ming and the withdrawal
    date: 1480–1484
    when: "1481"
    borders: "1481-01-01"
    countries: [vn, la, th, cn]
    body:
      - The Vietnamese armies began to lose men to malaria and other diseases. Lê Thánh Tông sent edicts to Sipsong Panna and Lan Na as if he were their overlord, and from Luang Prabang one army appears to have gone up the Mekong towards Sipsong Panna and another downstream towards Lan Na. The Lao chronicles credit Prince Then Kham, a son of Chakkaphat, with defeating the Vietnamese at Pak Phun; the chronicles of Nan and Chiang Mai say that in 1480 or 1481 the Vietnamese attacked Nan and were defeated by Tao Kha Kan, the governor of Nan, with 40,000 men sent by King Tilok, who then demoted him for pursuing them too far and taking prisoners.
      - The Ming court, alarmed by the conquest of Champa and now of Lan Xang, sent envoys to reprimand Đại Việt in 1480, warned it in July 1481 not to encroach on its neighbours and rewarded Tilok with silver and silk for protecting Lan Xang. Đại Việt denied the reports of further pressure on Sipsong Panna in 1483. On 31 October 1484 Lan Xang and Lan Na each reported to the Ming that the Vietnamese had withdrawn. Lan Xang recovered under Then Kham, who became king as Suvarna Banlang, and Muang Phuan, though it rebelled, remained a tributary of both Đại Việt and Lan Xang.
    facts:
      - [Vietnamese defeat near Nan, "1480/1481"]
      - [Ming warning to Đại Việt, "July 1481"]
      - [Withdrawal reported to the Ming, "31 October 1484"]
