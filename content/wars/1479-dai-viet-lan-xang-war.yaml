steps:
  - title: Five routes into the Lao uplands
    date: 1478–1480
    when: "1479-11"
    borders: "1479-10-01"
    countries: [vn, la]
    body:
      - Since 1448 the Phuan principality of Xieng Khouang had been a tributary district of Đại Việt, and in 1471 Lê Thánh Tông tried to turn it into a prefecture under Vietnamese officials. In 1478 the Phuan rose and killed Vietnamese there, with Lan Xang suspected of backing them. The Lao chronicles tell a different story. King Chakkaphat Phaen Phaeo had received a white elephant, and when Lê Thánh Tông asked to see it, he sent only a gold casket of its hair and nail clippings; the casket reached the Vietnamese court filled with dung, put there either by the king’s son Chao Kon Keo or by the chief of Xieng Khouang. The Vietnamese chronicles do not mention the elephant; Lê Thánh Tông’s edicts accuse the Lao king of insolence, among other things for calling the Lê emperors his younger brother and nephew.
      - The Vietnamese army set out in September 1479 and attacked by five routes, from the upper Lam River towards Xieng Khouang, from Điện Biên towards upper Laos, from the Ngàn Phố valley, from Mường Muổi on the Black River and from the Mã River valley. Chao Kon Keo met the invaders near the Plain of Jars; the Lao chronicles describe three days of fighting with thousands killed on each side before the Lao broke, and Chao Kon Keo drowned when his boat overturned as he fled. The Vietnamese destroyed Xieng Khouang, took more than twenty stockades, killed more than 20,000 people by the reports of Ming spies and in 1480 took Luang Prabang. Chakkaphat fled down the Mekong to Vientiane.
    facts:
      - [Phuan revolt, "1478"]
      - [Invasion begins, "September 1479"]
      - [Luang Prabang taken, "1480"]
