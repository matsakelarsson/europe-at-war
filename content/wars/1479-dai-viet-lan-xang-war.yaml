id: dai-viet-lan-xang-war
name: Đại Việt–Lan Xang war
start: "1479-09"
end: "1484-10"
tier: B
summary: "The invasion of the Lao kingdom of Lan Xang and the principality of Muang Phuan by Lê Thánh Tông of Đại Việt, also called the White Elephant War after the story the Lao chronicles tell of its cause. After a revolt in Muang Phuan in 1478, in which Vietnamese officials were killed, Vietnamese armies entered the Lao uplands in the autumn of 1479 by five routes. They defeated the Lao army near the Plain of Jars, destroyed the Phuan capital Xieng Khouang and took the Lao capital Luang Prabang, while King Chakkaphat Phaen Phaeo fled to Vientiane. But the invaders suffered from disease, and when one army pushed west towards Lan Na it was defeated near Nan in 1480 or 1481 by Tao Kha Kan, a governor of King Tilok of Lan Na. Under pressure from the Ming, who warned Đại Việt off its neighbours, the Vietnamese withdrew; by October 1484 Lan Xang and Lan Na reported to the Ming that they were gone. Muang Phuan remained a tributary of Đại Việt and Lan Xang in turn."
countries: [vn, la, th]
