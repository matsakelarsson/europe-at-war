id: dayan-khan-wars
name: Dayan Khan’s wars
start: "1480"
end: "1517"
tier: C
summary: "The wars by which Dayan Khan (Batumöngke), a boy of the Chinggisid line proclaimed khan of the Eastern Mongols in about 1479–1480, reunited the Mongols east of the Altai after the collapse of Oirat power. In his early years the campaigns were led by Mandukhai Khatun, widow of the previous khan, who later married him; she defeated the Oirats, and in 1483 the two drove out the taishi Ismayil, who fled towards Hami and was killed there. The right-wing tümens of the Ordos, Tümed and Yöngshiyebü, dominated by the chiefs Ibarai and Mandulai, rejected his authority and killed his son Ulus Bolad when he came to them as jinong. After a defeat at the Turgen stream, Dayan Khan crushed them in 1510 at Dalan Terigün; Mandulai was killed and Ibarai fled to Kokonor, and in 1513 another son, Barsu Bolad, was installed as jinong. Dayan Khan organised the Eastern Mongols into six tümens ruled by his descendants, a structure that lasted until the 17th century. Throughout these years the Mongols raided the Ming frontier, attacking Ningxia in 1500 and Datong and Xuanfu repeatedly, and in 1517 a large raid was turned back by the Zhengde Emperor at Yingzhou; the Ming answered by extending its frontier walls. Dayan Khan’s death is usually dated 1517, though dates up to 1543 are given."
