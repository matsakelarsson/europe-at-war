notes:
  - The Mongol chronicles of the 17th century (the Altan Tobchi and Sagang Sechen’s Erdeni-yin Tobchi) and the Ming records disagree on almost every date of Dayan Khan’s life, including his birth (1464 or 1474), his accession (1479 or 1480) and his death (1517 to 1543). The date and place of Dalan Terigün are also uncertain; the battle is usually put in 1510, on the Ordos frontier. The Ming sources call him the Xiao Wangzi, the “little prince”.
