steps:
  - title: To the Ugra
    date: June – October 1480
    when: "1480-10-08"
    borders: "1480-10-08"
    countries: [ru]
    body:
      - "Ivan III of Moscow had stopped paying tribute to the Horde in the 1470s and allied with the Crimean khan, Mengli Giray. Khan Akhmat of the Great Horde allied in turn with Casimir IV of Poland and Lithuania, and in 1480, while Ivan was quarrelling with two of his brothers, he led north what may have been the largest Tatar army of the century. Ivan held the line of the Oka, the river that had long been Moscow’s southern frontier, with his son Ivan the Young at Serpukhov and himself at Kolomna."
      - "Akhmat did not try the Oka but moved west between the upper Don and the Oka, towards the mouth of the Ugra near Kaluga, hoping to meet Casimir’s army. Casimir never came; he was tied down by a Crimean raid on Podolia and unrest at home. Ivan sent his treasury and family north to Beloozero and set up his headquarters at Kremenets, behind the Ugra. On 8 October the Tatars tried to force a crossing near the river’s mouth. For four days they were driven back by Russian guns and arrows, and a later attempt to cross upstream at Opakov was also blocked."
    facts:
      - [Battle on the Ugra, "8–11 October 1480, Muscovite success"]
      - [Commanders, "Ivan III and Ivan the Young against Khan Akhmat"]
      - [Ivan’s headquarters, "Kremenets, from 3 October"]
