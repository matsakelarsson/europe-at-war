id: great-stand-on-the-ugra
name: Great Stand on the Ugra
start: "1480"
end: "1480"
tier: B
summary: A standoff in the autumn of 1480 between Ivan III of Moscow and Khan Akhmat of the Great Horde, who had marched north to restore the Horde’s overlordship. After failing to cross the Ugra river, Akhmat waited in vain for his Lithuanian allies and withdrew in November; the event is traditionally seen as the end of Mongol rule over Russia.
countries: [ru]
sides:
  - id: mos
    name: Moscow
    polities: [russia]
    ink: green
    moves: Muscovite moves
    success: Muscovite success
  - id: gh
    name: Great Horde
    polities: [great-horde]
    ink: olive
    moves: Moves by the Great Horde
    success: Success for the Great Horde
notes:
  - Dates are Julian (Old Style). The Russian sources disagree on many details, and the size of both armies is unknown.
  - The Great Horde was the core of the old Golden Horde on the lower Volga, after the Kazan, Crimean and other khanates had broken away. Moscow was allied with the Crimean khan Mengli Giray, and Akhmat with King Casimir IV of Poland and Lithuania, whose lands then began just west of the Ugra.
