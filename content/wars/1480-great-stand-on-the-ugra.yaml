  - title: The stand
    date: October 1480 – January 1481
    when: "1480-10-26"
    borders: "1481-01-06"
    countries: [ru]
    body:
      - "For a month the two armies watched each other across the river while envoys came and went. Ivan made peace with his brothers, whose troops came to join him, and sent the exiled Crimean prince Nur Devlet and Prince Vasily Nozdrovaty down the Volga to raid the Horde’s lands behind Akhmat. Archbishop Vassian of Rostov urged Ivan in a famous letter to stand firm. As the river began to freeze and could no longer stop cavalry, Ivan pulled his troops back on 26 October to Kremenets and then to Borovsk, where they could cover Moscow and strike wherever the Tatars crossed."
      - "Akhmat did not follow. With winter coming, his horses short of fodder and no sign of Casimir, he began to withdraw on 8 November, plundering a dozen Lithuanian towns, among them Mtsensk, on his way. Ivan returned to Moscow on 28 November. On 6 January 1481 Akhmat was killed in the steppe by Ibak, khan of Tyumen, and the Nogais. No khan again claimed a say over who ruled in Moscow, and Russian historians have long dated the end of the “Tatar yoke” to the Ugra, though some modern historians think the standoff itself changed little."
    facts:
      - [Russian withdrawal, "From 26 October 1480, to Kremenets and Borovsk"]
      - [Akhmat’s retreat, "From 8 November 1480"]
      - [Death of Akhmat, "6 January 1481"]
