notes:
  - The traditional account, followed by the Church, says that on 14 August 1480 about 800 men of Otranto were beheaded on a nearby hill for refusing to give up their faith; they were canonised in 2013. Some modern historians question the religious motive and the larger figures given for the population and the dead, such as 12,000 killed out of 22,000, which are much exaggerated.
  - Some contemporaries suspected that Venice, then at peace with the Ottomans, had encouraged the attack on its rival Naples; this has never been proved.
