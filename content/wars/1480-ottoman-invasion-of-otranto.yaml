    countries: [it, al]
    body:
      - In the summer of 1480 Gedik Ahmed Pasha, who had just taken the Ionian islands, gathered a fleet at Vlorë and crossed the strait of Otranto. He had meant to land near Brindisi but turned south, and on 28 July his army came ashore near Otranto, the easternmost town of the Kingdom of Naples. The town was bombarded, and on 11 August it was stormed. Many of its people were killed or enslaved, and on 14 August, according to tradition, some 800 men who refused to convert were beheaded. Ottoman raiders rode towards Lecce, Brindisi and Taranto.
      - King Ferdinand of Naples recalled his son Alfonso, Duke of Calabria, from Tuscany, and Pope Sixtus IV called for a league of the Italian states; Hungary sent troops, but Venice stayed out. Over the winter the Ottomans held the town while Gedik Ahmed went back to Albania for reinforcements. The news that Mehmed II had died on 3 May 1481 ended any hope of relief, and the Neapolitan and Hungarian besiegers tightened their grip. On 10 September 1481 the garrison surrendered, and the threat of an Ottoman invasion of Italy passed for a generation.
