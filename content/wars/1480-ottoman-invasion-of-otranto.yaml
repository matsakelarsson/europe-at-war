id: ottoman-invasion-of-otranto
name: Ottoman invasion of Otranto
start: "1480-07-28"
end: "1481-09-10"
tier: B
summary: The Ottoman landing in southern Italy in 1480, when Gedik Ahmed Pasha crossed from Albania and stormed the Neapolitan port of Otranto. The capture, and the killing of many of its people, caused panic in Italy and led the pope to call the Italian states and Hungary to its defence. After Mehmed II’s death in May 1481 the isolated garrison surrendered to Alfonso of Calabria in September.
