steps:
  - title: The siege
    date: 23 May – 17 August 1480
    when: "1480-05-23"
    borders: "1480-08-17"
    countries: [gr, tr]
    body:
      - The Knights of St John had ruled Rhodes since 1310, raiding Muslim shipping from its harbours. After the peace with Venice, Mehmed II sent a fleet of about 160 ships and a large army under Mesih Pasha, a member of the Byzantine imperial family who had become an Ottoman commander. They landed on 23 May and set up their heavy guns. The first attacks, from 9 June, fell on the Tower of St Nicholas guarding the harbour mole; d’Aubusson himself led its defence, and the assaults were driven off.
      - The Ottomans then battered the weak eastern walls by the Jewish quarter, in the sector of the knights of Italy, while the defenders dug a new ditch and wall behind them. At dawn on 27 July janissaries stormed the breach, raised their flags on the Tower of Italy and entered the city. In three hours of fighting, with the grand master wounded five times, they were thrown back, and the counter-attack reached the Ottoman camp. After losing thousands of men, Mesih Pasha re-embarked his army, and the fleet sailed away by 17 August. Mehmed planned a new expedition but died in May 1481.
