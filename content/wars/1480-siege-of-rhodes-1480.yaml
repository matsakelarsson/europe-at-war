id: siege-of-rhodes-1480
name: Siege of Rhodes, 1480
start: "1480-05-23"
end: "1480-08-17"
tier: B
summary: The failed Ottoman attempt to take Rhodes from the Knights Hospitaller. A fleet and army under Mesih Pasha landed in May 1480 and bombarded the city for nearly three months, but the Knights and the townspeople under Grand Master Pierre d’Aubusson beat off the attacks on the harbour tower of St Nicholas and, on 27 July, a great assault that had already broken into the city. In August the Ottomans withdrew. Rhodes fell to Suleiman the Magnificent in 1522.
