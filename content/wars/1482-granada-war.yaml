steps:
  - title: Zahara and Alhama
    date: 1481–1482
    when: "1481-12-26"
    borders: "1482-07-15"
    countries: [es]
    body:
      - By 1481 the Nasrid emirate of Granada was the last Muslim state in the Iberian Peninsula, a mountainous land with the ports of Málaga and Almería and the city of Granada itself, crowned by the Alhambra. Its emir, Abu’l-Hasan Ali, had stopped paying tribute to Castile. Isabella of Castile and Ferdinand of Aragon, married since 1469 and secure after the War of the Castilian Succession, were ready to end its independence. In late December 1481, in reprisal for a Christian raid, Granadan troops surprised the Castilian border town of Zahara by night and carried off its people as captives.
      - Castile struck back on 28 February 1482, when Rodrigo Ponce de León, Marquis of Cádiz, scaled the walls of Alhama, a rich town on the road between Granada and Málaga, and took it after hard street fighting. Abu’l-Hasan besieged it twice, and the Catholic Monarchs made its defence a royal cause; Ferdinand himself took command there in May. In July he besieged Loja and was driven off. On the day Loja was relieved, Abu’l-Hasan’s son Abu Abdallah, Boabdil, rose against his father and took the Alhambra, splitting Granada between rival emirs.
    facts:
      - [Zahara taken by Granada, late December 1481]
      - [Alhama taken by Castile, "28 February 1482"]
      - [Ferdinand’s siege of Loja, "July 1482, failed"]
    markers:
      - kind: taken
        side: gra
        name: Zahara
        date: December 1481
        text: Granadan troops took the hilltop town in a night attack during a truce. Its people were led away to Ronda as captives.
        lonlat: [-5.383, 36.833]
      - kind: taken
        side: cas
        name: Alhama
        date: 28 February 1482
        text: The Marquis of Cádiz’s men climbed the walls at night. The townspeople fought on in the streets, and many were killed or enslaved.
        lonlat: [-3.988, 37.003]
      - kind: held
        side: gra
        name: Loja
        date: July 1482
        text: The town’s commander, Ali al-Attar, beat off Ferdinand’s army. The Master of Calatrava was among the Castilian dead.
        lonlat: [-4.15, 37.167]
      - kind: event
        name: Granada
        date: July 1482
        text: Boabdil, backed by the powerful Abencerraje family, seized the Alhambra. His father held out in Málaga and the west.
        lonlat: [-3.59, 37.178]
    arrows:
