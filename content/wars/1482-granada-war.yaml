  - title: Vélez-Málaga and Málaga
    date: 1487
    when: "1487-04-17"
    borders: "1487-08-18"
    countries: [es]
    body:
      - In April 1487 Ferdinand marched on Málaga, the emirate’s great port, by way of Vélez-Málaga to the east. Al-Zagal came down from Granada to relieve Vélez, but while he was away Boabdil’s supporters seized the capital, and al-Zagal fell back to Guadix. Vélez surrendered on 27 April. With the coast road open, the Castilians besieged Málaga by land and sea from 7 May. Its commander, Hamet el Zegrí, with North African troops and Christian renegades, refused all terms, and the city held out for three months while famine set in.
      - Málaga surrendered on 18 August 1487. Ferdinand refused terms, having offered them twice, and as punishment most of its people, many thousands, were enslaved; some were sold, some given away and some allowed to ransom themselves. The city’s Jews were ransomed by the Jews of Castile, and renegades were put to death. The fall of Málaga cut Granada off from North Africa. Boabdil held Granada as the Monarchs’ vassal, and al-Zagal was left with the east of the emirate around Guadix, Baza and Almería.
    facts:
      - [Vélez-Málaga surrenders, "27 April 1487"]
      - [Siege of Málaga, "7 May – 18 August 1487"]
    markers:
      - kind: taken
        side: cas
        name: Vélez-Málaga
        date: 27 April 1487
        text: The town surrendered after al-Zagal’s relief army was driven off, with Boabdil’s supporters inside helping the besiegers.
        lonlat: [-4.1, 36.783]
      - kind: taken
        side: cas
        name: Málaga
        date: 18 August 1487
        text: The city surrendered after Hamet el Zegrí withdrew to the Gibralfaro fortress, which gave up the next day.
        lonlat: [-4.42, 36.719]
      - kind: event
        name: Granada
        date: April 1487
        text: Boabdil’s supporters took the city while al-Zagal was away. He now ruled it as the vassal of Ferdinand and Isabella.
        lonlat: [-3.59, 37.178]
    arrows:
