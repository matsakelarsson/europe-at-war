  - title: Baza, Almería and Guadix
    date: 1488–1489
    when: "1488"
    borders: "1489-12-30"
    countries: [es]
    body:
      - In 1488 the Monarchs turned east, where Vera, Mojácar and other towns submitted without a fight. In June 1489 a large army besieged Baza, al-Zagal’s strongest fortress, defended by his kinsman Sidi Yahya al-Nayar. The city was hard to surround and the guns were of little use against it, so the siege dragged on through the autumn rains, at enormous cost. Queen Isabella came to the camp in November to show that it would not be lifted, and Baza surrendered on generous terms on 4 December 1489.
      - Sidi Yahya went over to the Christians and helped persuade al-Zagal that further resistance was hopeless. In December al-Zagal handed over Almería and Guadix in return for a lordship in the Alpujarras and a pension; he later left for North Africa. Now only the city of Granada and the mountains of the Alpujarras remained to Boabdil, who had promised to surrender Granada once his uncle was beaten. Unhappy with his rewards, he refused and broke with the Monarchs, and the war entered its last phase.
    facts:
      - [Siege of Baza, "June – 4 December 1489"]
      - [Almería and Guadix surrender, December 1489]
    markers:
      - kind: taken
        side: cas
        name: Vera
        date: June 1488
        text: Vera and the towns of the coast around it submitted as the Monarchs’ army approached.
        lonlat: [-1.867, 37.25]
      - kind: taken
        side: cas
        name: Baza
        date: 4 December 1489
        text: The garrison, still largely unbeaten, surrendered after six months on terms that let its people stay or leave with their goods.
        lonlat: [-2.773, 37.49]
      - kind: taken
        side: cas
        name: Almería
        date: December 1489
        text: The great port was handed over under the agreement with al-Zagal.
        lonlat: [-2.464, 36.842]
      - kind: taken
        side: cas
        name: Guadix
        date: December 1489
        text: Al-Zagal’s capital in the east surrendered at the end of the year.
        lonlat: [-3.135, 37.301]
    arrows:
      - side: cas
        label: Ferdinand, 1489
        via: [[-3.37, 38.01], [-3.0, 37.8], [-2.8, 37.52]]
  - title: Santa Fe and the surrender of Granada
    date: 1490–1492
    when: "1490"
    borders: "1492-01-02"
    countries: [es]
    body:
      - Through 1490 Castilian armies burned the crops of the Vega, while Boabdil, hoping for help from North Africa and Egypt that never came, struck back at nearby castles and tried to win back an outlet to the sea. In April 1491 Ferdinand camped before Granada with a large army. When fire destroyed the camp that July, the Monarchs rebuilt it in stone as a town, Santa Fe, a sign that they would stay until the city fell. Hunger grew inside, Boabdil’s advisers quarrelled, and secret talks began.
      - By the Treaty of Granada of 25 November 1491 the city was to surrender on generous terms. Its Muslims would keep their property, laws, mosques and religion, and could emigrate freely. Boabdil handed over the Alhambra on 2 January 1492, received a lordship in the Alpujarras and left for Morocco in October 1493. The terms did not last. The Jews of Castile and Aragon were ordered that March to convert or leave, and after forced conversions provoked a revolt in 1499–1501, the Muslims of Granada had to choose between baptism and exile.
    facts:
      - [Treaty of Granada, "25 November 1491"]
      - [Surrender of Granada, "2 January 1492"]
    markers:
      - kind: held
        side: cas
        name: Salobreña
        date: August 1490
        text: Boabdil besieged the coastal castle to reopen a route to North Africa, but it held out until a relief army came.
        lonlat: [-3.587, 36.747]
      - kind: event
        side: cas
        name: Santa Fe
        date: "1491"
        text: The camp town built in about three months before Granada. Here, in April 1492, the Monarchs agreed terms with Christopher Columbus for his first voyage.
        lonlat: [-3.718, 37.189]
        lp: l
      - kind: treaty
        side: cas
        name: Granada
        date: 25 November 1491 – 2 January 1492
        text: Boabdil surrendered the Alhambra and the city after the treaty’s terms were agreed. Ferdinand and Isabella entered on 6 January.
        lonlat: [-3.59, 37.178]
