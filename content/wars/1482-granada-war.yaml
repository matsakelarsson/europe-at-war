  - title: The Ajarquía and Lucena
    date: 1483
    when: "1483-03-20"
    borders: "1483-08-31"
    countries: [es]
    body:
      - In March 1483 a large Castilian raiding force of nobles and knights of the military orders, led by the Master of Santiago and the Marquis of Cádiz, rode into the Ajarquía, the hill country east of Málaga, to plunder it. Lost in the ravines at night, they were ambushed by the local people and by troops under Abu’l-Hasan’s brother Muhammad, known as al-Zagal. Hundreds were killed and many more captured. It was the worst Castilian defeat of the war.
      - A month later Boabdil, wanting a victory of his own, attacked Lucena with his father-in-law Ali al-Attar. The Count of Cabra and his nephew, the alcaide of the Donceles, beat his army near the town; Ali al-Attar was killed and Boabdil himself was captured. Ferdinand and Isabella saw the value of a divided Granada. By the Pact of Córdoba that August they freed him as their vassal, promising him help against his father and uncle in return for tribute and his son as a hostage. From then on the war ran alongside a Nasrid civil war.
    facts:
      - [Rout in the Ajarquía, "March 1483, Granadan victory"]
      - [Battle of Lucena, "April 1483, Boabdil captured"]
      - [Pact of Córdoba, August 1483]
    markers:
      - kind: battle
        side: gra
        name: Ajarquía
        date: March 1483
        text: The raiders were trapped in steep valleys and cut down or captured. Prisoners included many nobles, ransomed later at great cost.
        lonlat: [-4.27, 36.79]
      - kind: battle
        side: cas
        name: Battle of Lucena
        date: April 1483
        text: Boabdil was taken prisoner as his army retreated. He was held in the tower of Porcuna castle, still called the Torre de Boabdil.
        lonlat: [-4.485, 37.409]
      - kind: treaty
        side: cas
        name: Córdoba
        date: August 1483
        text: Boabdil agreed to rule as the vassal of Ferdinand and Isabella, who promised to help him win Granada from his father.
        lonlat: [-4.78, 37.89]
    arrows:
      - side: cas
        label: Master of Santiago
        phase: 1
        via: [[-4.56, 37.02], [-4.45, 36.88], [-4.3, 36.8]]
      - side: gra
        label: Boabdil
        phase: 2
        via: [[-3.6, 37.18], [-4.15, 37.17], [-4.35, 37.33], [-4.46, 37.4]]
  - title: Ronda and Loja
    date: 1484–1486
    when: "1484"
    borders: "1486-07-31"
    countries: [es]
    body:
      - Castile now fought a war of sieges, town by town. Its decisive weapon was artillery. The Monarchs hired gunners and founders from France, Burgundy and Italy, and trains of heavy bombards were dragged along mountain roads that labourers built ahead of them. Álora fell in 1484 and Setenil that September. In May 1485, after a bombardment of about two weeks and talks with its leaders, Ronda surrendered, and Marbella and the western hills followed. That year al-Zagal pushed aside his ageing brother, who died soon after, and fought both the Christians and his nephew Boabdil.
      - In May 1486 Ferdinand besieged Loja again, where Boabdil, who had come to terms with his uncle and broken with the Monarchs, had joined the defence. English volunteers under Lord Scales were among the besiegers. The town surrendered at the end of May, and Boabdil was captured and released once more. Íllora and Moclín, fortresses guarding the approaches to Granada, fell that summer. The western half of the emirate was gone, and Castile’s armies could reach the Vega, the fertile plain around the capital.
    facts:
      - [Ronda surrenders, May 1485]
      - [Loja surrenders, May 1486]
    markers:
      - kind: taken
        side: cas
        name: Álora
        date: June 1484
        text: The castle above the Guadalhorce valley surrendered after its walls were battered by cannon.
        lonlat: [-4.7, 36.817]
      - kind: taken
        side: cas
        name: Setenil
        date: September 1484
        text: The town, built into the cliffs of a river gorge, had beaten off earlier sieges. The guns took it in days.
        lonlat: [-5.181, 36.864]
        lp: t
      - kind: taken
        side: cas
        name: Ronda
        date: May 1485
        text: The Castilian army arrived while much of the garrison was away raiding, and the town gave up after about two weeks of bombardment. Its commander, Hamet el Zegrí, later defended Málaga.
        lonlat: [-5.165, 36.737]
      - kind: taken
        side: cas
        name: Marbella
        date: June 1485
        text: The port, a base of the Granadan fleet, surrendered after the fall of Ronda.
        lonlat: [-4.883, 36.517]
      - kind: taken
        side: cas
        name: Loja
        date: May 1486
        text: The key to the western Vega surrendered after a short siege. Boabdil, who had joined its defence, was taken and freed again.
        lonlat: [-4.15, 37.167]
      - kind: taken
        side: cas
        name: Moclín
        date: Summer 1486
        text: The castle on the northern edge of the Vega fell, like nearby Íllora, to Ferdinand’s guns.
        lonlat: [-3.786, 37.34]
    arrows:
      - side: cas
        label: Ferdinand, 1485
        phase: 1
