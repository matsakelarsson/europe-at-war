id: granada-war
name: Granada War
start: "1482-02-28"
end: "1492-01-02"
tier: A
summary: The ten-year war in which Isabella of Castile and Ferdinand of Aragon conquered the Nasrid emirate of Granada, the last Muslim state in western Europe. Helped by a civil war within the Nasrid family and by their siege artillery, the Catholic Monarchs took Granada’s towns one by one, among them Ronda, Málaga and Baza, until Boabdil surrendered the city and the Alhambra on 2 January 1492, completing the Reconquista.
countries: [es]
sides:
  - id: cas
    name: Castile and Aragon
    polities: [castile, aragon]
    ink: gold
    moves: Castilian moves
    success: Castilian success
  - id: gra
    name: Emirate of Granada
    polities: [granada]
    ink: green
    moves: Granadan moves
    success: Granadan success
notes:
  - Spanish sources call the emir Abu’l-Hasan Ali “Muley Hacén”, his son Abu Abdallah Muhammad “Boabdil” and his brother Muhammad “el Zagal”, the valiant. Historians number these last two differently as Muhammad XI, XII or XIII.
  - The chronicles give the Castilian armies as 50,000 or more in the main campaigns and the Granadan ones as tens of thousands. Some modern historians think the real numbers were much smaller, perhaps 8,000–20,000 Castilian soldiers and a few thousand Granadans.
  - Dates are Julian. The centuries before 1482 are told in the Reconquista.
