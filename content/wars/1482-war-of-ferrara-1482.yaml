id: war-of-ferrara-1482
name: War of Ferrara, 1482–1484
start: "1482-05"
end: "1484-08-07"
tier: C
summary: A war in which Venice, at first allied with Pope Sixtus IV, attacked Ercole I d’Este, Duke of Ferrara, who was backed by Naples, Milan, Florence and Mantua. On 21 August 1482 the papal and Venetian army under Roberto Malatesta beat the Neapolitans of Alfonso, Duke of Calabria, at Campomorto near Velletri, but in December Sixtus changed sides and later put Venice under interdict. Venetian forces overran the Polesine and threatened Ferrara itself, while the allies attacked Venetian territory in Lombardy. Exhausted, the powers made peace at Bagnolo on 7 August 1484; Venice kept the Polesine of Rovigo, and Sixtus, who had wanted a different outcome, died a few days later.
countries: [it]
