id: conspiracy-of-the-barons
name: Conspiracy of the Barons
start: "1485-09-26"
end: "1486-08-11"
tier: C
summary: A revolt of great barons of the Kingdom of Naples, led by Antonello Sanseverino, Prince of Salerno, against King Ferdinand I and his heir Alfonso, Duke of Calabria, whose efforts to strengthen royal power threatened their privileges. Pope Innocent VIII, the kingdom’s overlord, backed them. The rebels took L’Aquila under the papal banner on 26 September 1485, and papal troops under the condottiere Roberto Sanseverino fought Alfonso’s army around Rome, while Milan and Florence sent help to Ferdinand. In August 1486 the pope made peace with Ferdinand, who promised the barons an amnesty. He did not keep it. The leaders, among them his former secretary Antonello Petrucci and the Count of Sarno, Francesco Coppola, were arrested and later executed, and many other barons died in prison; the Prince of Salerno escaped and joined the French court.
