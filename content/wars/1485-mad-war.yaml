id: mad-war
name: Mad War and the Franco-Breton War
start: "1485"
end: "1491-12-06"
tier: C
summary: The last revolt of the great French princes against the crown, and the war that ended Brittany’s independence. During the regency of Anne of Beaujeu for the young Charles VIII, Louis of Orléans, Francis II of Brittany and their allies rose in what was called the Mad War (la Guerre folle). On 28 July 1488 the royal army under Louis de La Trémoille routed the Breton army at Saint-Aubin-du-Cormier and captured Orléans, and the Treaty of Le Verger forbade the duke to marry off his daughters without the king’s consent. Francis died weeks later, and his heir, the young Duchess Anne, fought on with English, Spanish and Habsburg help and married Maximilian of Austria by proxy. The French besieged her in Rennes in 1491, and on 6 December she married Charles VIII, bringing Brittany to the French crown.
