id: campaigns-of-ahuitzotl
name: Campaigns of Ahuitzotl
start: "1486"
end: "1502"
tier: C
summary: "The wars of Ahuitzotl, ruler of Tenochtitlan from 1486 to 1502, who roughly doubled the lands that paid tribute to the Aztec Triple Alliance. He succeeded his brother Tizoc, whose short reign had brought few victories, and began with a campaign against rebel towns in the Huasteca on the Gulf coast, whose captives were sacrificed at the dedication of the enlarged Templo Mayor in 1487; the sources give numbers from about 4,000 to Diego Durán’s 80,400, and modern historians think the higher figures much exaggerated. In the west, in what is now Guerrero, his armies took Teloloapan, Oztoman and Alahuiztlan near the Tarascan frontier and resettled them with colonists from the Valley of Mexico to hold the border. His main wars went south. In Oaxaca the Mexica fought the Mixtec and Zapotec kingdoms, and in the Isthmus of Tehuantepec Cosijoeza, the Zapotec king of Zaachila, allied with the Mixtec, held out in the mountain fortress of Guiengola, near Tehuantepec, through a siege that Zapotec accounts say lasted seven months, in the later 1490s. The war ended in a settlement sealed by Cosijoeza’s marriage to a daughter of Ahuitzotl, and Tehuantepec kept its own kings while Aztec armies used the road through it. Beyond the isthmus Ahuitzotl’s armies conquered Xoconochco (Soconusco) on the Pacific coast of today’s Chiapas, rich in cacao and tropical feathers, and raided into what is now Guatemala; the date of the conquest is given as 1486 in some sources and about 1500 in others. Ahuitzotl died in 1502 and was succeeded by his nephew Moctezuma II."
