id: kaga-rebellion
name: Kaga Rebellion and the Ikkō-ikki province
start: "1488"
end: "1580"
tier: C
summary: "The rising in which the leagues (ikki) of the Jōdo Shinshū followers of the Hongan-ji, the Ikkō-ikki, overthrew the governor of Kaga and ruled the province for almost a century. The preacher Rennyo, head of the Hongan-ji, had won a great following of farmers, village warriors (jizamurai), merchants and monks in Kaga and Echizen while he lived at Yoshizaki in 1471–1475. In 1473–1474 the leagues helped Togashi Masachika win the governorship (shugo) of Kaga from his brother Kōchiyo, but Masachika soon turned on them. In 1487 he marched to Ōmi with the shogun Ashikaga Yoshihisa against the Rokkaku, and the leagues, led by Rennyo’s sons and joined by Togashi vassals, rose in his absence. In the sixth month of 1488 an army put at 100,000 to 200,000 besieged him in Takao castle, near today’s Kanazawa, and he killed himself as it fell. The leagues set up his kinsman Togashi Yasutaka as a figurehead governor, and Kaga became known as “the province held by the peasants” (hyakushō no mochitaru kuni), governed by the leagues, the temples and the local warriors, and from 1546 from the Oyama Gobō, a fortified temple on the site of Kanazawa. The leagues fought among themselves in 1531, against the Asakura of Echizen and the Uesugi, and supported the Hongan-ji in its war with Oda Nobunaga. After the Hongan-ji made peace in 1580, Nobunaga’s general Shibata Katsuie took the Oyama Gobō; the last resistance in the mountains near Hakusan was crushed in 1582."
