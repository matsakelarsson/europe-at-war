notes:
  - Japanese dates are in the lunar calendar. The siege of Takao ended in the sixth month of Chōkyō 2 (1488); English sources date the start of the rising to late 1487.
  - Rennyo himself disapproved of the rising and of the leagues’ political aims; at the shogun’s demand he reprimanded the Kaga followers but did not cast them out.
  - The size of the leagues’ army comes from contemporary reports and is probably exaggerated.
