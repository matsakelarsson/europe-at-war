id: koli-tenguella-wars
name: Wars of Koli Tenguella
start: "1490"
end: "1537"
tier: C
summary: "The wars by which the Fulbe leader Tenguella and his son Koli Tenguella built a kingdom in the Senegal valley, founding the Denianke dynasty that ruled Futa Toro until 1776. Tenguella, a Fulbe chief from Futa Toro, had led his followers east into the lands of the kingdom of Diara (Zara), in today’s western Mali, where he founded the state of Futa Kingi, and by about 1490 his raids on the upper Gambia threatened Mali’s routes to Kaabu and the Bambuk gold fields. In 1511 he invaded Diara itself; its rulers appealed to Songhai, and in 1512 an army under the askia’s brother Umar Komdiagho defeated and killed him (see Askia Muhammad’s wars). His son Koli had gathered Fulbe, Mandinka and others in the highlands of Futa Jallon, at Dena (Badiar), from where he raided Wuli and Niani on the Gambia and fought Saloum. After his father’s death, driven by Malian pressure and famine, he led his people north, defeated the small kingdoms of eastern Senegal one by one, overcame the governors (farba) whom the buurba of Jolof and the rulers of Diara kept in Futa Toro, made Anyam-Godo his capital and reconquered Kingi. He defeated Jolof several times, which helped bring about its breakup at Danki in 1549. The Portuguese called his kingdom that of the “Great Fulo”. Koli died in 1537 and was succeeded by his brother Labba. The dates rest on the Timbuktu chronicles and later Fulbe and Mandinka traditions and are approximate; some accounts put Koli’s arrival in Futa Toro in 1512–1513, others earlier."
