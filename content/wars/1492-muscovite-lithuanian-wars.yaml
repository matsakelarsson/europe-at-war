id: muscovite-lithuanian-wars
name: Muscovite–Lithuanian Wars, 1492–1537
start: "1492"
end: "1537"
tier: B
summary: A series of wars in which the Grand Duchy of Moscow, claiming the lands of the old Kievan Rus’, took a large part of eastern Lithuania. The peace of 1494 and the truce of 1503 cost Lithuania Vyazma, Chernihiv and Siveria, and Smolensk fell in 1514 despite the Polish–Lithuanian victory at Orsha; a last war in 1534–1537 changed little.
sides:
  - id: lt
    name: Lithuania and Poland
    polities: [lithuania, poland-lithuania, poland]
    ink: brown
    moves: Lithuanian and Polish moves
    success: Lithuanian or Polish success
  - id: ru
    name: Moscow
    polities: [russia]
    ink: green
    moves: Muscovite moves
    success: Muscovite success
notes:
  - Dates are Julian (Old Style), as the sources give them.
  - Lithuania and Poland were separate states under one dynasty; Polish troops fought in strength only from 1514. Moscow was often allied with the Crimean Khanate, and Lithuania at times with the Livonian Order.
  - The wars are usually counted as five, in 1487–1494, 1500–1503, 1507–1508, 1512–1522 and 1534–1537. Only the two that changed the border most are told here.
