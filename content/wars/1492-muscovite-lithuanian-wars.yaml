  - title: Smolensk and Orsha
    date: 1512–1522
    when: "1514"
    borders: "1522"
    countries: [lt, pl, ru, by]
    body:
      - "Ivan’s son Vasily III renewed the war in December 1512, aiming at Smolensk, the great fortress on the upper Dnieper. Sieges in 1513 failed, but a third, with heavy artillery, forced the town to surrender on 30 July 1514. Muscovite forces pushed on towards Orsha and Mstsislaw. King Sigismund I raised an army of about 35,000, more than half of them Poles, and gave the field command to Konstanty Ostrogski, who had escaped from Muscovite captivity."
      - "On 8 September 1514 Ostrogski crossed the Dnieper near Orsha on pontoon bridges and routed the Muscovite army, whose commander Ivan Chelyadnin was captured. Sigismund celebrated the victory across Europe, but his army could not retake Smolensk. The war dragged on in raids until a truce in 1522 left Smolensk with Moscow, which kept it until 1611. A further war in 1534–1537 ended with Lithuania regaining Homel and Moscow keeping Sebezh."
    facts:
      - [Smolensk, "Surrendered to Moscow, 30 July 1514"]
      - [Battle of Orsha, "8 September 1514, Polish–Lithuanian victory"]
      - [Size of the armies, "Disputed; a contemporary claimed 80,000 Muscovites, modern estimates are much lower"]
    markers:
      - kind: siege
        side: ru
        name: Smolensk
        date: July 1514
        text: After two failed sieges, Vasily III’s artillery forced the garrison to give up the city.
        lonlat: [32.0453, 54.7828]
      - kind: battle
        side: lt
        name: Battle of Orsha
        date: 8 September 1514
        text: Ostrogski’s Lithuanian and Polish cavalry, with infantry and guns, beat the Muscovites on the banks of the Krapivna.
        lonlat: [30.3833, 54.5]
