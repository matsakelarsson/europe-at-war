steps:
  - title: Vedrosha and the loss of Siveria
    date: 1500–1503
    when: "1500"
    borders: "1503-03-25"
    countries: [lt, ru, by, ua]
    body:
      - "Ivan III of Moscow called himself sovereign of all Russia and claimed the lands of the old Kievan Rus’, many of them ruled by Lithuania. A first border war in 1492–1494 cost Lithuania Vyazma and towns on the upper Oka. In May 1500, citing the treatment of the Orthodox in Lithuania, Ivan attacked again, and several Orthodox border princes went over to him. Bryansk, Dorogobuzh, Putyvl and other towns fell quickly. On 14 July 1500 his army crushed a Lithuanian force on the Vedrosha river near Dorogobuzh and captured its commander, Grand Hetman Konstanty Ostrogski."
      - "Lithuania was beaten again at Mstsislaw in 1501. The Livonian Order came in on its side and won on the Seritsa in August 1501, and a Muscovite siege of Smolensk in 1502 failed. A six-year truce was agreed on 25 March 1503, the feast of the Annunciation. Moscow kept Chernihiv, Novhorod-Siverskyi, Starodub, Bryansk and the upper Oka lands, by some estimates about a third of the Grand Duchy."
    facts:
      - [Battle of Vedrosha, "14 July 1500, Muscovite victory"]
      - [Truce of 1503, 25 March 1503]
      - [Grand dukes, Alexander of Lithuania and Ivan III of Moscow]
    markers:
      - kind: taken
        side: ru
        name: Bryansk
        date: "1500"
        text: One of the first Lithuanian towns to fall to Ivan III’s armies.
        lonlat: [34.3667, 53.2425]
      - kind: battle
        side: ru
        name: Battle of Vedrosha
        date: 14 July 1500
        text: The Lithuanians attacked a larger Muscovite army across the river and were routed. Ostrogski spent seven years as a prisoner.
        lonlat: [33.4769, 54.8186]
      - kind: battle
        side: ru
        name: Mstsislaw
        date: November 1501
        text: A second Lithuanian defeat, east of the Dnieper.
        lonlat: [31.73, 54.02]
        lp: l
      - kind: held
        side: lt
        name: Smolensk
        date: "1502"
        text: The fortress on the Dnieper withstood a Muscovite siege.
        lonlat: [32.0453, 54.7828]
        lp: l
    arrows:
      - side: ru
        label: Ivan III’s army
        phase: 1
        via: [[36.9, 55.55], [34.3, 55.2], [33.55, 54.86]]
      - side: lt
        label: Ostrogski
        phase: 2
        via: [[32.1, 54.78], [32.9, 54.78], [33.4, 54.81]]
