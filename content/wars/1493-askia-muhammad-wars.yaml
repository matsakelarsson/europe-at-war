steps:
  - title: Anfao and the Mossi war
    date: 1493–1498
    when: "1493"
    borders: "1498"
    countries: [ml, bf]
    body:
      - "When Sonni Ali drowned in November 1492, his son Abu Bakr Dao, known as Sonni Baru, was proclaimed king. One of Sonni Ali’s leading commanders, Muhammad Ture, attacked him on the night of 18 February 1493 and was driven off, but he gathered his men at Anfao, near Gao, and there won a hard-fought battle in early 1493; the Tarikh al-Sudan dates it to 3 March in one place, while it counts the new reign from 2 April. Sonni Baru fled and spent the rest of his life in exile. The victor took the title askiya and was welcomed by the scholars of Timbuktu, whom Sonni Ali had persecuted. He made his brother Umar Komdiagho kurmina-fari, governor of the western provinces, with his seat at Tendirma."
      - "In late 1495 Askia Muhammad left for Mecca with a large escort and a great sum in gold, and in Cairo the Abbasid caliph made him his deputy for the lands of Takrur. Back in Gao in August 1497, he turned against the Mossi, Songhai’s old enemies in the Niger bend. He sent the scholar Mur Salih Jawara to summon their king, Na’asira, to accept Islam; when the king refused after consulting his ancestors, the Songhai army invaded, killed many men, laid waste the fields and took the women and children captive. The chronicle calls it the only true holy war ever fought in the region. The northern Mossi lost the initiative to Songhai, but their kingdom survived."
    facts:
      - [Battle of Anfao, "early 1493, victory of Muhammad Ture"]
      - [Pilgrimage, "1495–1497"]
      - [Expedition against the Mossi, "1497–1498"]
