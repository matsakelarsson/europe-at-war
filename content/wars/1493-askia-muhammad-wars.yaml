  - title: From Aïr to Diara and Katsina
    date: 1498–1513
    when: "1500"
    borders: "1513"
    countries: [ml, ne, ng, mr, bj]
    body:
      - "Year after year the askiya’s armies went out from Gao. In 1498–1499 he arrested the governor of Baghana and killed the Fulani chief Dinba-Donbi; in 1499–1500 he marched against Aïr. In 1500–1501 Umar Komdiagho failed to take Zalen, held for Mali by its governor Qama-Fiti-Qalli, until the askiya came in person, sacked the town, plundered the palace of the Malian king and carried off members of his family. Djenné had submitted of its own accord when he came to the throne. In 1504–1505 an expedition against Borgu cost the lives of many of the best Songhai commanders; Umar wept, and the askiya is said to have answered that those who had died would have made trouble for him at home."
      - "In 1506–1507 he campaigned again against Mali. In 1511–1512 his army killed Tengella, a Fulani leader who had built up a following in Diara, at Zara; Tengella’s son Koli Tengella fled west with his men to Futa Toro, where he founded a dynasty. At the end of 1512 the askiya led an expedition to Katsina, in Hausaland, returning in May or June 1513."
    facts:
      - [Aïr, "1499–1500"]
