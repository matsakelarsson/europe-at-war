id: askia-muhammad-wars
name: Askia Muhammad’s wars
start: "1493-02"
end: "1528-08-26"
tier: B
summary: "The wars of Askia Muhammad (Muhammad Ture), who seized the Songhai throne from Sonni Ali’s son in 1493 and ruled until his own son deposed him in 1528. After defeating Sonni Baru at Anfao, near Gao, he made the pilgrimage to Mecca, returned with the title of caliph for the lands of Takrur, and led a campaign against the Mossi in 1497–1498 that the Timbuktu chronicle calls the only true holy war of the region. In the following years his armies marched against Aïr (1500), the Malian town of Zalen (1501), Borgu (1505, with heavy losses), Mali (1506–1507), the Fulani leader Tengella in Diara (1512), Katsina in Hausaland (1513) and the sultan of Agadez (1514–1515). On the way back from Agadez, Kanta Kotal of Kebbi rebelled over his share of the plunder and held off a Songhai expedition in 1516–1517, founding an independent Kebbi. Under Askia Muhammad the Songhai Empire reached its greatest extent, from the upper Senegal to Aïr; in 1528, old and nearly blind, he was deposed by his son Musa."
