  - title: Agadez and Kebbi
    date: 1514–1528
    when: "1515"
    borders: "1528-08-26"
    countries: [ne, ng, ml]
    body:
      - "At the end of 1514 the askiya marched against al-Adala, sultan of Agadez, and finished the campaign in 1515; Aïr became tributary to Songhai, though not for long. Among his allies on the expedition was Kanta Kotal, chief of Leka in Kebbi, who expected his share of the plunder when he got home. The Dendi-fari warned him that to claim it would be treated as rebellion. Kanta’s men insisted, so he rebelled, beat the troops sent against him and stopped recognising the askiya. An expedition against him in 1516–1517 achieved nothing, and Kebbi remained independent; under Kanta it became a power that contested Agadez with both Songhai and Bornu."
      - "In his last years Askia Muhammad went blind, and his sons fought over the succession. His son Musa, the fari-mondzo, rebelled at Kukiya, where the askiya’s brother Yahya was killed trying to bring him to obedience, and on the feast of the sacrifice, 26 August 1528, Musa deposed his father at Gao. The old askiya was confined on an island in the Niger and died in 1538, after another of his sons, Askia Ismail, had brought him back to Gao."
    facts:
      - [Agadez campaign, "1514–1515"]
      - [Kebbi’s revolt, "1515; Songhai expedition 1516–1517 fails"]
      - [Askia Muhammad deposed, "26 August 1528"]
