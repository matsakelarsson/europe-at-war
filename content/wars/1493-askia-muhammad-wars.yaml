notes:
  - "The main sources are the Tarikh al-Sudan and the Tarikh al-Fattash, written in Timbuktu more than a century later by scholars who admired Askia Muhammad; dates are their Hijri years as converted by their translators, and many are given only to the year. Leo Africanus, who travelled in the region about 1510–1513, says the askiya conquered Katsina, Kano, Zamfara, Zaria and Gobir; the chronicles mention only the Katsina expedition, and historians doubt that Songhai rule over the Hausa states was more than brief."
