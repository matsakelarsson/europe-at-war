id: croatian-ottoman-war
name: Hundred Years’ Croatian–Ottoman War
start: "1493-09-09"
end: "1593-06-22"
tier: C
summary: The name Croatian historians give to the century of border warfare between Croatia and the Ottoman Empire, from the defeat at Krbava Field to the victory at Sisak. On 9 September 1493 an army of Croatian nobles under Ban Emerik Derenčin tried to cut off Ottoman raiders returning from Carniola and was destroyed near Udbina; Derenčin was captured and many nobles died. Ottoman raids and conquests then ate away at Croatia for decades. Knin fell in 1522, Jajce in 1528, Požega in 1536, and Klis, defended by the Uskok captain Petar Kružić, in 1537; in the same year a Habsburg army under Johann Katzianer was destroyed at Gorjani in Slavonia. After Mohács the Croatian estates elected Ferdinand of Habsburg king at Cetin in 1527, and the frontier gradually became the Military Frontier, financed by the Austrian lands and garrisoned by soldiers and refugees, Croats, Vlachs and Serbs, settled as frontiersmen; Karlovac was founded as its stronghold in 1579. What remained free was called “the remnants of the remnants” of the old kingdom. The fall of Bihać in 1592 opened the way to the heartland, but on 22 June 1593 an army of Croatian, Slovene and Austrian troops destroyed the army of Hasan Pasha Predojević, governor of Bosnia, at Sisak. The battle started the Long Turkish War and is seen in Croatia as the end of the Ottoman advance.
