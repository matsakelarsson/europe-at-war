notes:
  - The term is used mainly in Croatian historiography. Most of the fighting was raiding and small-scale siege warfare rather than open battles, and thousands of people were carried off and sold as slaves.
  - The Ottoman conquest of Hungary and the Long Turkish War have their own entries.
