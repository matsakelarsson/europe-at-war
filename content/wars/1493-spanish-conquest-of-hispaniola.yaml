id: spanish-conquest-of-hispaniola
name: Spanish conquest of Hispaniola
start: "1493-11"
end: "1504"
tier: B
summary: "The conquest of the Taíno chiefdoms of Hispaniola (Ayiti or Quisqueya) by the Crown of Castile in the decade after Christopher Columbus’s first voyage. In November 1493 Columbus’s second expedition found the fort of La Navidad destroyed by the warriors of the cacique Caonabo, and in January 1494 he founded La Isabela on the north coast and sent men into the gold-bearing Cibao. Alonso de Ojeda captured Caonabo, and in March 1495 Columbus defeated an alliance of caciques in the Vega Real and imposed a tribute in gold and cotton on the Taíno. His brother Bartolomé put down the rising of Guarionex in 1497–1498, while the Spanish colonists themselves rebelled under Francisco Roldán. Governor Nicolás de Ovando, who arrived in 1502, ended the last independent chiefdoms: in 1503 his men burned some eighty caciques in a house at Xaraguá and hanged its ruler Anacaona, and in 1503–1504 Juan de Esquivel conquered Higüey, whose cacique Cotubanamá was hanged in Santo Domingo. The surviving Taíno were divided among the colonists in encomiendas. War, famine, forced labour, enslavement and disease destroyed them within a generation: estimates of the population in 1492 range from under 100,000 to several million, a Spanish count of 1508 found about 60,000, and the repartimiento of 1514 listed about 26,000."
countries: [do, ht, es]
sides:
