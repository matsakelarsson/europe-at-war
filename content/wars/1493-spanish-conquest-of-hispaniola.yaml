  - title: Ovando, Xaraguá and Higüey
    date: "1502–1504"
    when: "1503"
    borders: "1504"
    countries: [do, ht, es]
    body:
      - "Nicolás de Ovando arrived as governor in April 1502 with about thirty ships and 2,500 colonists. In the east, a Spaniard’s dog had killed the cacique of the island of Saona, and the Taíno of Higüey killed eight Spanish sailors in revenge; Juan de Esquivel led a punitive war against Higüey in 1502–1503, which ended in an agreement with the cacique Cotubanamá."
      - "In 1503 Ovando marched to Xaraguá with about 300 foot soldiers and 70 horsemen, saying that Anacaona, who now ruled after her brother’s death, was plotting a rising. Anacaona received him with feasts and gathered the caciques of the region. Las Casas, who was on the island, wrote that at a signal Ovando’s men seized the caciques and bound them, set fire to the house in which some eighty of them were held, and cut down the people outside, children among them. Anacaona was hanged, then or after a trial in Santo Domingo. Historians such as Samuel M. Wilson see the killings as a calculated blow against the last autonomous chiefdom rather than the answer to a real plot."
      - "In 1504 Higüey rose again. Esquivel’s second campaign, in which Juan Ponce de León and the young Las Casas served, killed many Taíno who had surrendered; Cotubanamá fled to Saona, was captured and hanged in Santo Domingo. With the chiefdoms destroyed, Ovando divided the Taíno among the colonists in encomiendas, nominally to be paid and taught Christianity, in practice to work in the gold mines and fields, and Spanish raiders began to carry off Lucayans from the Bahamas to replace the dead. A count of 1508 found some 60,000 Taíno on the island, and the repartimiento of 1514 about 26,000 (32,000 in some figures). The Dominican Antonio de Montesinos denounced the colonists from the pulpit in 1511, and the Laws of Burgos of 1512 tried to regulate the encomienda, with little effect."
    facts:
      - [Ovando arrives, "April 1502"]
      - [Massacre at Xaraguá, "1503 (July or later in the year, by different accounts)"]
      - [Second war of Higüey, "1504"]
      - [Taíno counted, "about 60,000 (1508); about 26,000 (1514)"]
