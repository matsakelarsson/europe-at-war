  - title: Guarionex, Roldán and Santo Domingo
    date: "1496–1500"
    when: "1497"
    borders: "1498-08-30"
    countries: [do, ht, es]
    body:
      - "Columbus sailed for Spain in March 1496 and left Bartolomé in charge. Bartolomé moved the colony’s centre to the south coast, where Santo Domingo was founded on the Ozama river in 1496–1498 near new gold deposits, and built a chain of forts across the Cibao. He marched to Xaraguá, where Bohechío and his sister Anacaona agreed to pay tribute in cotton and cassava bread, since their land had no gold."
      - "In 1497 Guarionex of Maguá, who had tried to accommodate the Spaniards, joined other caciques in a plan to attack the fort of Concepción. Bartolomé fell on their camp by night and captured them; he executed some and pardoned Guarionex. At the same time the colony’s chief magistrate, Francisco Roldán, rebelled against the Columbus brothers with many of the colonists and moved to Xaraguá, where the rebels lived off Taíno labour. Guarionex fled to Mayobanex, cacique of the Ciguayos in the northern mountains, and Bartolomé hunted both down in 1498. When Columbus returned in August 1498 he settled with Roldán by granting the rebels land and the labour of Taíno communities, a forerunner of the encomienda."
      - "Complaints about the brothers’ rule reached the Catholic Monarchs, who sent Francisco de Bobadilla as royal investigator. He arrived in August 1500, arrested Christopher, Bartolomé and Diego Columbus and sent them to Spain in chains. Guarionex, held in Santo Domingo, was shipped to Spain in 1502 and drowned when the fleet sank in a hurricane."
    facts:
      - [Santo Domingo founded, "1496–1498"]
      - [Rising of Guarionex, "1497–1498"]
      - [Roldán’s rebellion, "1497–1499"]
      - [Columbus brothers arrested, "August 1500"]
