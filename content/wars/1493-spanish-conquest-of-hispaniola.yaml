steps:
  - title: La Navidad, La Isabela and the Vega Real
    date: "November 1493 – March 1495"
    when: "1494"
    borders: "1495-03-31"
    countries: [do, ht, es]
    body:
      - "On his first voyage Columbus reached the Bahamas in October 1492 and the island the Taíno called Ayiti or Quisqueya in December. Spanish chroniclers describe it as divided among great caciques: Guacanagarí of Marién in the north-west, Guarionex of Maguá in the fertile Vega Real, Caonabo of Maguana in the centre, Bohechío of Xaraguá in the south-west and Cayacoa of Higüey in the east, each with many lesser chiefs. When the Santa María ran aground near Guacanagarí’s town on Christmas Day 1492, Columbus built a fort from her timbers, La Navidad, and left 39 men there. Returning in November 1493 with seventeen ships and some 1,200 to 1,500 men, he found it burned and its garrison dead. Guacanagarí told him that the Spaniards had quarrelled and seized women and gold, and that Caonabo’s warriors had killed them."
      - "In January 1494 Columbus founded La Isabela on the north coast and sent parties inland to the gold-bearing Cibao, where he built the fort of Santo Tomás. Food ran short, disease spread among Spaniards and Taíno alike, and Spanish raids for food, gold and women turned the caciques against the newcomers. Alonso de Ojeda seized Caonabo, by a trick according to Las Casas, and Caonabo’s brother Manicaotex gathered an alliance of caciques. In late March 1495 Columbus, his brother Bartolomé and Ojeda, with about 200 men, 20 horses, 20 hunting dogs and Guacanagarí’s warriors, routed them in the Vega Real, near the hill the Spaniards later called the Santo Cerro. Caonabo died at sea on the way to Spain. Early in 1495 Columbus had already shipped several hundred Taíno captives to Spain to be sold, and many of them died on the voyage."
      - "Columbus then imposed a tribute on the island: every Taíno over fourteen in the gold districts was to hand over a hawk’s bell full of gold dust every three months, and others a measure of cotton, and wear a token around the neck as proof of payment. There was not enough gold to meet it. Many Taíno fled to the mountains or stopped planting in the hope of starving the Spaniards out, and in the famine of 1495–1496 Taíno died in great numbers."
    facts:
      - [La Navidad found destroyed, "27 November 1493"]
      - [La Isabela founded, "January 1494"]
      - [Battle of the Vega Real, "late March 1495 (Columbus left La Isabela on 24 March)"]
