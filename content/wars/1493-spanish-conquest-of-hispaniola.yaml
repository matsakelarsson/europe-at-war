notes:
  - "Almost everything known about these years comes from Spanish writers: Columbus and his son Ferdinand, Bartolomé de las Casas (who arrived in 1502 and took part in the war in Higüey before he became the conquest’s great critic), Gonzalo Fernández de Oviedo and Peter Martyr. Their numbers and many of their stories cannot be checked; archaeology at La Isabela, La Navidad and Taíno sites adds what it can."
  - "The five great chiefdoms named by the chroniclers (Marién, Maguá, Maguana, Xaraguá and Higüey) are a simplification; recent studies suggest the island had many more chiefdoms. The population of Hispaniola in 1492 is one of the most disputed numbers in American history: estimates run from the low tens of thousands (an ancient-DNA study of 2020) and about 100,000 to several million."
  - The Indies belonged to the Crown of Castile, not to Aragon; the united crown is shown as Spain from 1516.
