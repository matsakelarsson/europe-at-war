  - title: The Sack of Rome and the siege of Florence
    date: 1526–1530
    when: "1526-05-22"
    borders: "1530-08-12"
    countries: [it, fr, es, va, de]
    body:
      - Within weeks of his release Francis joined Pope Clement VII, Venice, Florence and Francesco Sforza in the League of Cognac (22 May 1526). German landsknechts under Georg von Frundsberg crossed the Alps and joined Bourbon’s Spaniards, and in the spring of 1527 this army, unpaid for months, marched south. On 6 May it stormed the walls of Rome; Bourbon was shot dead on the ladders. For months the soldiers, many of them Lutherans, killed, tortured and plundered, while the pope held out in Castel Sant’Angelo; most of the Swiss Guard died defending him. Rome’s population fell from about 55,000 to perhaps 10,000 through killing, flight, famine and plague.
      - Florence drove out the Medici and restored its republic. A French army under Lautrec besieged Naples in 1528, but the Genoese admiral Andrea Doria, whose galleys were blockading the city, went over to Charles V that summer; plague swept the French camp, Lautrec died in August and his army surrendered. Doria made Genoa an independent republic allied with Spain. After another French defeat at Landriano (21 June 1529), Francis made peace at Cambrai on 3 August. This Ladies’ Peace, negotiated by his mother and Charles’s aunt, gave up his claims in Italy.
      - Charles and Clement were reconciled, and on 24 February 1530 the pope crowned him emperor at Bologna, the last coronation of an emperor by a pope. Florence, left alone, was besieged by an imperial army from October 1529. Its field commander Francesco Ferrucci was defeated and killed at Gavinana on 3 August 1530, in a battle where the imperial commander, the Prince of Orange, also fell, and the city surrendered on 12 August. The pope’s kinsman Alessandro de’ Medici became its ruler, and in 1532 its first duke.
