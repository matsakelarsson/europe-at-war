  - title: The Holy League and Ravenna
    date: 1510–1512
    when: "1510"
    borders: "1512-12-29"
    countries: [it, fr, es, ch, va]
    body:
      - Julius II now meant to drive the French out of Italy; his reported watchword was “Out with the barbarians!” In January 1511, aged sixty-seven, he directed the siege of Mirandola in person through the snow. In October he formed a Holy League with Venice and Ferdinand of Aragon, and Henry VIII of England joined it. Louis XII’s young nephew Gaston de Foix, Duke of Nemours, answered with a lightning campaign. In February 1512 he relieved Bologna, then retook Brescia, which had gone back to Venice, and his troops sacked it, killing thousands of its people.
      - On Easter Sunday, 11 April 1512, Gaston attacked the Spanish and papal army of Ramón de Cardona, viceroy of Naples, outside Ravenna. After an artillery duel in which Alfonso d’Este’s guns raked the League cavalry from the flank, the French won the bloodiest battle Italy had yet seen, but Gaston was killed pursuing the retreating Spanish infantry, and Ravenna was sacked. Without him the French lost their grip. In May some 18,000 Swiss hired by the pope came down through the Alps, and by the summer the French had abandoned almost all of Lombardy.
      - The victors shared the spoils. The Swiss took Lugano, Locarno and the Ossola valley, and the Grisons the Valtellina, Bormio and Chiavenna; the pope took Parma, Piacenza and Reggio. Massimiliano Sforza, Ludovico’s son, entered Milan as duke in December. In August Cardona’s Spaniards sacked Prato, and Florence took back the Medici. Ferdinand of Aragon used the war to seize the Kingdom of Navarre, an ally of France; the Duke of Alba took Pamplona on 25 July 1512, and Upper Navarre was joined to Castile.
    facts:
      - [Holy League, "proclaimed 4 October 1511"]
      - [Battle of Ravenna, "11 April 1512, French victory"]
      - [Sack of Prato, 29 August 1512]
    markers:
      - kind: taken
        side: pap
        name: Mirandola
        date: 20 January 1511
        text: Julius II, in armour, directed the siege in deep snow and entered through a breach when the town surrendered.
        lonlat: [11.07, 44.89]
      - kind: taken
        side: fr
        name: Brescia
        date: February 1512
        text: The French stormed the city, which had returned to Venice. The sack lasted for days, and thousands of people were killed.
        lonlat: [10.22, 45.54]
      - kind: battle
        side: fr
        name: Battle of Ravenna
        date: 11 April 1512
        text: Perhaps 10,000 men or more died in all. The French lost their commander, Gaston de Foix, and many officers.
        lonlat: [12.2, 44.42]
      - kind: taken
        side: sp
        name: Prato
        date: 29 August 1512
        text: Cardona’s Spanish troops sacked the town, killing many of its people. Florence gave in, and the Medici returned.
        lonlat: [11.1, 43.88]
      - kind: taken
        side: sw
        name: Milan
        date: 29 December 1512
        text: Massimiliano Sforza entered Milan as duke, a ruler kept in power by Swiss pikes.
        lonlat: [9.19, 45.47]
    arrows:
      - side: fr
        label: Gaston de Foix, February 1512
        phase: 1
        via: [[11.34, 44.49], [10.7, 45.0], [10.24, 45.5]]
      - side: fr
        phase: 2
        via: [[10.25, 45.48], [11.0, 44.85], [12.12, 44.43]]
      - side: sw
