        label: Cremona, Venetian from 1499
        atoms: [IT-CR]
  - title: Naples, Cerignola and the Garigliano
    date: 1501–1504
    when: "1500-11-11"
    borders: "1504-01-31"
    countries: [it, fr, es]
    body:
      - By the secret Treaty of Granada of 11 November 1500, Louis XII and Ferdinand of Aragon agreed to depose Frederick of Naples, their kinsman, and share his kingdom. Louis would take Naples, Campania and the Abruzzi with the royal title, and Ferdinand Apulia and Calabria. In the summer of 1501 a French army marched south, stormed Capua on 24 July with great slaughter and entered Naples; Frederick gave up and retired to France. The partners soon quarrelled over the Capitanata, the rich grazing plain the treaty had failed to assign, and by 1502 they were at war.
      - Outnumbered, Gonzalo Fernández de Córdoba held out in Barletta through the winter. Reinforced in the spring, he marched out and on 28 April 1503 dug in behind a ditch and bank at Cerignola. The French heavy cavalry and Swiss pikemen of the Duke of Nemours attacked and were shot down by Spanish arquebusiers; Nemours was killed, and Gonzalo entered Naples on 16 May. A new French army came south that autumn and faced him across the Garigliano through weeks of rain.
      - On the night of 28–29 December Gonzalo crossed the river upstream on a bridge of boats, took the French by surprise and routed them. Gaeta surrendered on 1 January 1504, and an armistice signed at Lyon at the end of the month left the whole kingdom to Ferdinand. Naples, like Sicily and Sardinia, would be ruled by Spanish viceroys for two centuries. In 1505 Louis gave up his claim as the dowry of his niece Germaine de Foix, who married the widowed Ferdinand.
    facts:
      - [Treaty of Granada, "11 November 1500, partition of Naples"]
      - [Battle of Cerignola, "28 April 1503, Spanish victory"]
      - [Battle of the Garigliano, "29 December 1503, Spanish victory"]
    markers:
      - kind: taken
        side: fr
        name: Capua
        date: 24 July 1501
        text: French troops, with Cesare Borgia’s, broke into the town; contemporaries spoke of thousands killed.
        lonlat: [14.21, 41.11]
      - kind: held
        side: sp
        name: Barletta
        date: 1502–1503
        text: Gonzalo held the Adriatic port through the winter. Nearby, in February 1503, thirteen Italian knights fighting for Spain beat thirteen French knights in a famous challenge.
        lonlat: [16.28, 41.32]
      - kind: battle
        side: sp
        name: Battle of Cerignola
        date: 28 April 1503
        text: Often called the first battle won by handguns. About 1,000 arquebusiers behind a ditch broke the French attacks.
        lonlat: [15.9, 41.27]
      - kind: taken
        side: sp
        name: Naples
        date: 16 May 1503
        text: Gonzalo entered the capital; its castles were taken soon after.
        lonlat: [14.25, 40.84]
      - kind: battle
        side: sp
        name: Battle of the Garigliano
        date: 29 December 1503
        text: Gonzalo’s men crossed the flooded river by night and rolled up the scattered French army, which fled to Gaeta.
        lonlat: [13.76, 41.25]
      - kind: taken
        side: sp
        name: Gaeta
        date: 1 January 1504
        text: The last French stronghold in the kingdom surrendered on terms.
        lonlat: [13.57, 41.21]
        lp: l
