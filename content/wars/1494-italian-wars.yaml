  - title: Saint-Quentin, Calais and Cateau-Cambrésis
    date: 1557–1559
    when: "1557-08-10"
    borders: "1559-04-03"
    countries: [fr, be, es, gb, it]
    body:
      - In the north the war turned on the frontier between France and the Netherlands. In August 1557 Philip II’s army under Emmanuel Philibert, the exiled Duke of Savoy, besieged Saint-Quentin. On 10 August, the feast of St Lawrence, it caught the relief army of Constable Montmorency as it withdrew and destroyed it; Montmorency was captured, and the town was stormed on 27 August despite Admiral Coligny’s defence. Philip later built the Escorial, dedicated to St Lawrence, in thanks. The road to Paris lay open, but Philip did not take it.
      - England had joined the war in June 1557, since its queen, Mary I, was Philip’s wife. In midwinter, when no attack was expected, the Duke of Guise struck at Calais, which surrendered on 7 January 1558 after a week’s siege, ending more than two centuries of English rule. In June Guise took Thionville. On 13 July 1558 a French army returning from a raid along the coast was destroyed at Gravelines by Count Egmont, with English ships firing into its flank. Both kings were bankrupt and alarmed by the spread of Protestantism in their lands, and talks began that autumn.
      - By the treaties of Cateau-Cambrésis (2 and 3 April 1559) France gave up its claims in Italy, handed back Savoy and Piedmont to Emmanuel Philibert, though it kept five fortresses for a time, and returned Corsica to Genoa; it kept Calais and, in practice, Metz, Toul and Verdun. Spain was left master of Milan, Naples, Sicily and Sardinia, and Italy stayed under its sway for a century and a half. At a tournament celebrating the marriages that sealed the peace, Henry II was wounded by a splintered lance and died on 10 July 1559.
    facts:
      - [Battle of Saint-Quentin, "10 August 1557, Spanish victory"]
      - [Fall of Calais, 7 January 1558]
      - [Peace of Cateau-Cambrésis, 2–3 April 1559]
