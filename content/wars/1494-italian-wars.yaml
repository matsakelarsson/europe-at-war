  - title: The League of Cambrai and Agnadello
    date: 1508–1510
    when: "1508-12-10"
    borders: "1509-06-15"
    countries: [it, fr, at, es, va]
    side_names:
      sp: Imperial success
      ita: Ferrarese success
    move_names:
      sp: Maximilian’s moves
    body:
      - Julius II, pope from 1503, wanted back the Romagna towns that Venice had seized after Cesare Borgia’s fall, and Venice’s growth on the mainland worried all its neighbours. On 10 December 1508 Louis XII and Maximilian I agreed at Cambrai to partition the Venetian mainland, and Julius and Ferdinand of Aragon joined them. In April 1509 the pope placed Venice under an interdict. On 14 May a French army under Louis XII caught the Venetian rearguard of Bartolomeo d’Alviano at Agnadello, near the Adda, and destroyed it while the other Venetian commander, the Count of Pitigliano, kept his men out of the fight.
      - Venice’s mainland empire collapsed in weeks. Bergamo, Brescia and Cremona opened their gates to the French; Verona, Vicenza and Padua submitted to Maximilian’s envoys; the Romagna towns went back to the pope and the Apulian ports to Ferdinand. But on 17 July Venetian troops retook Padua, and in September Maximilian besieged it with a huge army and failed. In December Duke Alfonso d’Este of Ferrara destroyed a Venetian river fleet on the Po at Polesella. Julius had got what he wanted; in February 1510 he made peace with Venice and soon turned against the French.
    facts:
      - [League of Cambrai, 10 December 1508]
      - [Battle of Agnadello, "14 May 1509, French victory"]
      - [Siege of Padua, "September 1509, Maximilian fails"]
    markers:
      - kind: battle
        side: fr
        name: Battle of Agnadello
        date: 14 May 1509
        text: Also called Vailà. Alviano’s rearguard was cut to pieces, with more than 4,000 dead; Machiavelli wrote that Venice lost in one day what it had won in eight hundred years.
        lonlat: [9.57, 45.45]
      - kind: taken
        side: fr
        name: Brescia
        date: May 1509
        text: Brescia and Bergamo surrendered to Louis XII within days of the battle.
        lonlat: [10.22, 45.54]
      - kind: taken
        side: sp
        name: Verona
        date: June 1509
        text: The city submitted to Maximilian’s representatives and stayed in imperial hands until 1517.
        lonlat: [10.99, 45.44]
      - kind: held
        side: ven
        name: Padua
        date: July–October 1509
        text: Retaken by the Venetians on 17 July, the city held out against the imperial siege; Maximilian gave up in early October.
        lonlat: [11.87, 45.41]
      - kind: taken
        side: pap
        name: Ravenna
        date: May–June 1509
        text: Venice handed back Ravenna, Cervia, Faenza and Rimini to the pope.
        lonlat: [12.2, 44.42]
      - kind: naval
        side: ita
        name: Polesella
        date: 22 December 1509
        text: Ferrarese guns on the riverbank wrecked the Venetian galleys that had sailed up the Po.
        lonlat: [11.75, 44.96]
