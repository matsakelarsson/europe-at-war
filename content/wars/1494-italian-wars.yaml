  - title: Charles V and Bicocca
    date: 1521–1524
    when: "1521"
    borders: "1522-05-30"
    countries: [it, fr, es, ch, va]
    body:
      - In 1519 Charles of Habsburg, already king of Spain, Naples and Sicily and lord of the Netherlands, was elected emperor as Charles V, defeating Francis I’s bid. War between them began in 1521 on several fronts. A French-backed army overran Navarre while Castile was in turmoil and was beaten at Noáin, near Pamplona, on 30 June. In Italy Charles allied with Pope Leo X, and in November an imperial and papal army under Prospero Colonna took Milan from the French commander Lautrec, restoring the Sforza under Francesco II, Ludovico’s younger son.
      - Lautrec regrouped with Venetian help and Swiss mercenaries. The Swiss, unpaid, demanded battle, and on 27 April 1522 they attacked Colonna’s entrenched camp in the park of the Bicocca, north of Milan, head-on across open ground. Volleys from Spanish arquebusiers behind a sunken road and earthworks shot them down by the thousand, and the survivors marched home. Genoa fell to the imperialists and was sacked on 30 May. In 1524 a new French army was driven out of Lombardy, and the knight Bayard was killed covering its retreat across the Sesia. The imperialists followed it into Provence but failed to take Marseille.
