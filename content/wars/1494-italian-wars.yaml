id: italian-wars
name: Italian Wars
start: "1494-09-02"
end: "1559-04-03"
tier: A
summary: Sixty-five years of war for mastery of Italy, fought mainly between the kings of France and the Spanish and Austrian Habsburgs, with Venice, the popes, the Swiss, Milan, Florence and the other Italian states changing sides as their interests shifted. The wars began when Charles VIII of France marched on Naples in 1494 and ended with the Peace of Cateau-Cambrésis in 1559, which left Spain dominant in Italy, holding Milan, Naples, Sicily and Sardinia, while France kept Calais and the bishoprics of Metz, Toul and Verdun.
countries: [it, fr, es, ch, va, at, de, be, gb, tr]
sides:
  - id: fr
    name: France
    polities: [france]
    ink: navy
    moves: French moves
    success: French success
  - id: sp
    name: Spain and the Habsburgs
    polities: [aragon, castile, spain, naples, sicily, sardinia, habsburg, habsburg-netherlands]
    ink: gold
    moves: Spanish and imperial moves
    success: Spanish and imperial success
  - id: ven
    name: Venice
    polities: [venice]
    ink: teal
    moves: Venetian moves
    success: Venetian success
  - id: pap
    name: The papacy
    polities: [papal-states]
    ink: magenta
    moves: Papal moves
    success: Papal success
  - id: sw
    name: The Swiss
    polities: [switzerland, three-leagues]
    ink: red
    moves: Swiss moves
    success: Swiss success
  - id: ita
    name: Milan, Florence and other Italian states
    polities: [milan, tuscany, siena, genoa, savoy, mantua, montferrat, modena, urbino, lucca, parma]
    ink: purple
    moves: Moves by Italian states
    success: Success for Italian states
  - id: eng
    name: England
    polities: [england]
    ink: orange
    moves: English moves
    success: English success
notes:
  - Dates are Julian, as usual for the period; the Gregorian calendar came into use only in 1582. Numbers of soldiers and dead come from chroniclers and are often uncertain.
  - Historians divide the wars differently. A common scheme is the Italian War of 1494–1495, the war of 1499–1504, the War of the League of Cambrai (1508–1516), the war of 1521–1526, the War of the League of Cognac (1526–1530) and the wars of 1536–1538, 1542–1546 and 1551–1559. Alliances changed often, so a state shown as an ally of France in one step may be its enemy in the next.
  - Related wars have their own entries, among them the Swabian War of 1499, Flodden (the Anglo-Scottish War of 1513), the Guelders Wars and the Princes’ Revolt of 1552, in which France took Metz. Charles V’s expeditions against Tunis (1535) and Algiers (1541) are not told here.
