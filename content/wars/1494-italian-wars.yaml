  - title: Novara and Marignano
    date: 1513–1516
    when: "1513-06-06"
    borders: "1516-11-29"
    countries: [it, fr, ch, gb, be, at, es]
    body:
      - Louis XII tried again in 1513, now allied with Venice. On 6 June a Swiss army that had marched through the night attacked the French camp at Novara and routed it, and the French left Italy once more. That summer Henry VIII and Maximilian invaded northern France; at Guinegate on 16 August the French cavalry fled so fast that the English called it the Battle of the Spurs, and the allies took Thérouanne and Tournai. The Swiss besieged Dijon in September and were bought off, and the Scots, invading England as France’s allies, were crushed at Flodden. Louis made peace in 1514 and died on 1 January 1515.
      - His successor Francis I, aged twenty, crossed the Alps in August 1515 by the high Col de l’Argentière, avoiding the Swiss who were waiting at Susa. On 13 September the Swiss attacked his camp at Marignano, now Melegnano, south-east of Milan, and fought on into the night. The next morning French guns and cavalry held them until Venetian troops under Alviano arrived, and the Swiss withdrew in good order, leaving perhaps 10,000 dead. The old Marshal Trivulzio called it a battle of giants.
      - Francis entered Milan, and Massimiliano Sforza retired to France on a pension. By the Treaty of Noyon (13 August 1516) Francis kept Milan and left Naples to the young Charles of Habsburg, who had inherited Spain that January; Venice recovered Brescia and, in January 1517, Verona. The Perpetual Peace of Fribourg on 29 November 1516 made the Swiss, who kept Ticino, France’s allies and suppliers of soldiers until the French Revolution.
    facts:
      - [Battle of Novara, "6 June 1513, Swiss victory"]
      - [Battle of Marignano, "13–14 September 1515, French victory"]
      - [Perpetual Peace of Fribourg, 29 November 1516]
