  - title: Savoy, Provence and Ceresole
    date: 1535–1546
    when: "1535-11-01"
    borders: "1544-09-18"
    countries: [fr, it, es, gb, tr, de]
    side_names:
      ita: Savoyard success
    body:
      - When Francesco II Sforza died childless on 1 November 1535, Charles V kept Milan for his own family, and Francis I went to war again. In 1536 French troops overran Savoy and most of Piedmont, whose duke, Charles III, was the emperor’s ally; France held them for twenty-three years. In July Charles invaded Provence, but Marshal Montmorency stripped the country bare and waited in a fortified camp near Avignon. Hunger and dysentery wrecked the imperial army, which retreated in September. Pope Paul III brought the two rulers to a ten-year truce at Nice on 18 June 1538.
      - War came again in 1542. Francis, now openly allied with the Ottoman sultan Suleiman, sent his son Henry to besiege Perpignan, without success, and in August 1543 a Franco-Ottoman fleet under Khair ad-Din Barbarossa bombarded and took the town of Nice, though its castle held out. The Ottoman fleet wintered at Toulon, whose inhabitants had been sent away. On 14 April 1544 the young Count of Enghien won a bloody victory over the Marquis del Vasto at Ceresole in Piedmont, but could not follow it up.
      - That summer Charles V and Henry VIII invaded northern France. Charles took Saint-Dizier after a six-week siege and advanced towards Paris; Henry took Boulogne in September. On 18 September Charles and Francis made peace at Crépy, giving back their conquests, but England kept Boulogne until 1550. The French stayed in Piedmont, and in 1545 Pope Paul III made his son Pier Luigi Farnese duke of Parma and Piacenza.
    facts:
