  - title: Louis XII takes Milan
    date: 1499–1500
    when: "1499-08"
    borders: "1500-04-10"
    countries: [it, fr, ch]
    move_names:
      ita: Ludovico Sforza’s moves
    body:
      - Charles VIII died in April 1498, and his cousin and successor Louis XII claimed Milan as well as Naples, through his grandmother Valentina Visconti. He bought the help of Venice, promised Cremona and the Ghiara d’Adda, and of Pope Alexander VI, whose son Cesare Borgia received a French duchy and French troops for his conquests in the Romagna. In August 1499 a French army under the Milanese exile Gian Giacomo Trivulzio invaded the duchy from Asti while the Venetians attacked from the east. Ludovico Sforza fled to the Tyrol, and Louis entered Milan on 6 October.
      - French rule soon made enemies, and in February 1500 Ludovico came back with Swiss and German mercenaries and was welcomed in Milan. When the French returned in force, the Swiss on both sides would not fight each other. At Novara on 10 April Ludovico’s Swiss marched off, and he was betrayed and captured while trying to slip away among them disguised as a pikeman. He died a prisoner in France in 1508. The men of Uri, Schwyz and Nidwalden kept Bellinzona, which France ceded to them in 1503.
    facts:
      - [Louis XII enters Milan, 6 October 1499]
      - [Capture of Ludovico Sforza, "Novara, 10 April 1500"]
      - [Cremona, "Venetian 1499–1509"]
    markers:
      - kind: event
        name: Asti
        date: August 1499
        text: Louis XII’s own county, inherited from the dukes of Orléans, was the French base for the invasion.
        lonlat: [8.21, 44.9]
        lp: l
      - kind: taken
        side: fr
        name: Alessandria
        date: late August 1499
        text: The fortress fell after a short siege, and the Milanese army broke up.
        lonlat: [8.62, 44.91]
        lp: b
      - kind: taken
        side: fr
        name: Milan
        date: 6 October 1499
        text: Trivulzio entered in September and the castle surrendered after a few days. Louis XII made his formal entry on 6 October.
        lonlat: [9.19, 45.47]
      - kind: taken
        side: ven
        name: Cremona
        date: September 1499
        text: Cremona and the Ghiara d’Adda were Venice’s reward under the Treaty of Blois.
        lonlat: [10.02, 45.13]
      - kind: event
        side: fr
        name: Novara
        date: 10 April 1500
        text: Ludovico Sforza’s Swiss mercenaries would not fight the Swiss in French pay. He was recognised and handed over as they marched away.
        lonlat: [8.62, 45.45]
        lp: l
      - kind: taken
        side: sw
        name: Bellinzona
        date: April 1500
        text: The three cantons occupied the town and its castles, which guarded the road to the St Gotthard pass.
        lonlat: [9.03, 46.2]
      - kind: taken
        side: pap
        name: Forlì
        date: January 1500
        text: Cesare Borgia, with French troops, took Imola and Forlì from Caterina Sforza. By 1502 he had added Pesaro, Rimini, Faenza and Urbino.
        lonlat: [12.04, 44.22]
