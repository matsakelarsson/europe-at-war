  - title: Pavia
    date: 1524–1526
    when: "1524-10"
    borders: "1526-01-14"
    countries: [it, fr, es, ch, de]
    body:
      - Francis I came over the Alps himself in October 1524, retook plague-stricken Milan and laid siege to Pavia, held for the emperor by Antonio de Leyva with about 6,000 Spanish and German troops. The siege dragged on through the winter, while Francis sent part of his army south under the Duke of Albany to threaten Naples. In late January an imperial relief army under Charles de Lannoy, viceroy of Naples, the Duke of Bourbon and the Marquis of Pescara came up and dug in facing the French around the walled hunting park of Mirabello, north of the town.
      - Before dawn on 24 February 1525, the emperor’s 25th birthday, imperial troops broke through the park wall. Francis led his heavy cavalry in a charge that masked his own guns, and in the fog Spanish arquebusiers and German landsknechts cut the French army apart. Many of France’s leading nobles were killed, and Francis, his horse killed under him, was taken prisoner. He wrote to his mother that nothing was left to him but honour and his life. Taken to Spain, he signed the Treaty of Madrid on 14 January 1526, giving up Burgundy, Milan and Naples, and left his two eldest sons as hostages. Freed in March, he declared that a promise made in prison did not bind him.
    facts:
      - [Battle of Pavia, "24 February 1525, imperial victory"]
