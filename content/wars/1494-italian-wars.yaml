  - title: Siena and the pope’s war
    date: 1551–1557
    when: "1551"
    borders: "1557-07-03"
    countries: [it, fr, es, va, tr]
    side_names:
      sp: Spanish, imperial and Florentine success
    body:
      - Henry II, who succeeded Francis I in 1547, renewed the war in 1551 in support of Ottavio Farnese, Duke of Parma, and in 1552 he allied with the German Protestant princes and occupied Metz, Toul and Verdun. In July 1552 the people of Siena rose against their Spanish garrison and, with French help, drove it out. In 1553 a French army, carried by the Ottoman fleet, invaded Corsica, which belonged to Genoa, and took most of the island.
      - Cosimo I de’ Medici, Duke of Florence, joined Charles V against Siena. On 2 August 1554 his army under Gian Giacomo Medici, Marquis of Marignano, routed the Franco-Sienese army of the Florentine exile Piero Strozzi at Marciano in the Val di Chiana. Siena was besieged and starved; much of its countryside was laid waste, and many of its poor were driven out of the city to die between the lines. It surrendered on 17 April 1555, though republicans and French troops held out at Montalcino until 1559. In 1557 Charles’s son Philip II gave Siena to Cosimo as a fief, keeping its coastal fortresses for Spain.
      - Charles V gave up his thrones in 1555–1556, leaving Spain, Italy and the Netherlands to Philip and the Empire to his brother Ferdinand. A truce agreed at Vaucelles in February 1556 was broken when Pope Paul IV, a Neapolitan bitterly hostile to Spain, called in the French. The Duke of Alba invaded the Papal States from Naples, and a French army under the Duke of Guise marched south in 1557 but failed before Civitella del Tronto. After the French defeat at Saint-Quentin Guise was recalled, and in September 1557 Paul IV made peace with Alba.
    facts:
      - [Battle of Marciano, "2 August 1554, imperial and Florentine victory"]
