steps:
  - title: Charles VIII and Fornovo
    date: 1494–1496
    when: "1494-09-02"
    borders: "1495-07-06"
    countries: [it, fr, es]
    body:
      - For forty years after the Peace of Lodi of 1454 the Italian states had kept an uneasy balance. Charles VIII of France had inherited the Angevin claim to the Kingdom of Naples, and Ludovico Sforza, who ruled Milan in his young nephew’s name and feared the nephew’s Neapolitan in-laws, encouraged him to press it. In early September 1494 Charles crossed the Alps by the Montgenèvre pass with perhaps 25,000 men and the best siege guns in Europe. His troops sacked Mordano and Fivizzano, killing many of their people, a shock to Italians used to less bloody wars.
      - In Florence, Piero de’ Medici handed over the Tuscan fortresses and was driven out on 9 November; Pisa threw off Florentine rule the same day. Charles entered Florence on 17 November and Rome on 31 December. Alfonso II of Naples abdicated in favour of his son Ferdinand II, whose army melted away. The French stormed Monte San Giovanni in February, killing its garrison and many townspeople, and on 22 February 1495 Charles entered Naples. A new disease, syphilis, spread among the soldiers there and was carried across Europe as the “French disease”.
      - Alarmed, Venice, Milan, Pope Alexander VI, Ferdinand of Aragon and Maximilian I formed the League of Venice on 31 March. Charles left a garrison in Naples and marched north. On 6 July 1495, at Fornovo on the Taro, a larger League army, mostly Venetian and led by Francesco Gonzaga of Mantua, attacked him. It lost more men, but the French lost their baggage, and both sides claimed victory. Charles reached safety and made peace with Milan at Vercelli in October. In the south, Spanish troops under Gonzalo Fernández de Córdoba helped Ferdinand II win back his kingdom; the last French garrisons surrendered in 1496.
    facts:
      - [Charles VIII enters Naples, 22 February 1495]
      - [League of Venice, 31 March 1495]
      - [Battle of Fornovo, "6 July 1495, both sides claimed victory"]
    markers:
      - kind: event
        side: fr
        name: Montgenèvre pass
        date: early September 1494
        text: Charles VIII crossed the Alps here. His bronze guns, drawn by horses and fired with iron balls, moved and shot much faster than the siege artillery of the Italian states.
        lonlat: [6.72, 44.93]
      - kind: event
        side: fr
        name: Florence
        date: 17 November 1494
        text: Charles entered the city in arms. The Florentines had just expelled Piero de’ Medici for surrendering their fortresses, and Pisa had rebelled against them.
        lonlat: [11.25, 43.77]
      - kind: event
        side: fr
        name: Rome
        date: 31 December 1494
        text: Pope Alexander VI shut himself in Castel Sant’Angelo, then came to terms and let the French march on through the Papal States.
        lonlat: [12.48, 41.9]
      - kind: taken
        side: fr
        name: Monte San Giovanni
        date: 9 February 1495
        text: The French stormed this border fortress of the Kingdom of Naples in a few hours and killed most of the defenders and townspeople.
        lonlat: [13.51, 41.64]
      - kind: taken
        side: fr
        name: Naples
        date: 22 February 1495
        text: Ferdinand II fled to Ischia and then Sicily, and the city and most of the kingdom submitted to Charles without a battle.
        lonlat: [14.25, 40.84]
      - kind: treaty
        name: League of Venice
        date: 31 March 1495
        text: Publicly a league to defend Christendom against the Ottomans; in fact it was formed to drive the French out of Italy.
        lonlat: [12.34, 45.44]
      - kind: battle
        side: fr
        name: Battle of Fornovo
        date: 6 July 1495
        text: The first great battle of the wars, fought on both banks of the swollen Taro. The French cut their way through and marched on to Asti.
        lonlat: [10.1, 44.7]
      - kind: battle
        side: fr
        name: Battle of Seminara
        date: 28 June 1495
        text: French cavalry and Swiss pikemen routed a Neapolitan and Spanish army in Calabria. Its commander, Gonzalo Fernández de Córdoba, learned from the defeat and reformed the Spanish infantry.
        lonlat: [15.87, 38.33]
