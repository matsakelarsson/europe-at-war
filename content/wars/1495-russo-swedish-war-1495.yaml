name: Russo-Swedish War, 1495–1497
start: "1495"
end: "1497"
tier: B
summary: A war between Sweden under the regent Sten Sture and Ivan III’s Muscovy, allied with King Hans of Denmark. The Russians besieged Viborg in 1495 and the Swedes stormed Ivangorod in 1496, before a truce in 1497 left the border unchanged.
