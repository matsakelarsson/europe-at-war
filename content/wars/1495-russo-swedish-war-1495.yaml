    body:
      - Moscow had swallowed Novgorod in 1478 and inherited its quarrel with Sweden. In 1495 Ivan III, allied with King Hans of Denmark against Sten Sture, sent a large army to besiege Viborg. The commander Knut Posse held out, and the siege is remembered for the “Viborg Bang”, a huge explosion that, according to legend, scattered the attackers.
      - In August 1496 a Swedish force crossed the Gulf of Finland and stormed the new Russian fortress of Ivangorod opposite Narva. A six-year truce ended the war in March 1497. That same year King Hans defeated Sture and took the Swedish throne, though only for a few years.
