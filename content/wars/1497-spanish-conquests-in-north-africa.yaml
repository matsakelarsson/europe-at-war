steps:
  - title: Melilla, Mers el-Kébir and Oran
    date: 1497–1509
    when: "1497-09"
    borders: "1509-05-20"
    countries: [es, ma, dz]
    body:
      - After the conquest of Granada in 1492, the Spanish crowns looked across the sea. The Treaty of Tordesillas of 1494 left most of the Moroccan coast to Portugal but placed Melilla and Cazaza in the Castilian sphere, and on 17 September 1497 an expedition sent by the Duke of Medina Sidonia under Pedro de Estopiñán occupied Melilla almost without fighting; the town, on the border between the kingdoms of Fez and Tlemcen, had been fought over many times and left in ruins. The duke agreed to keep a garrison of 700 men there.
      - The next target was the Zayyanid coast. A fleet of about 170 ships with some 7,000 soldiers sailed from Málaga under Ramón de Cardona and Diego Fernández de Córdoba and on 13 September 1505 took the fortress of Mers el-Kébir, whose defenders, when no relief came, marched out with their families and goods. In 1507 a raid from the fortress was ambushed by the Zayyanid army, and most of the 3,000 Spanish soldiers were killed or captured. In 1508 Pedro Navarro took the island fort of Peñón de Vélez de la Gomera off the Rif coast.
      - Cardinal Francisco Jiménez de Cisneros, archbishop of Toledo, paid for a larger expedition and sailed with it. The fleet, about 80 ships and 10 galleys with 8,000–12,000 foot and 3,000–4,000 horse under Pedro Navarro, left Cartagena on 16 May 1509, and on 18 May the army stormed Oran, the main port of the kingdom of Tlemcen. Spanish accounts give their own losses as fewer than 30 and those of the defenders as about 4,000. Cisneros entered the city on 20 May.
    facts:
      - [Melilla occupied, "17 September 1497"]
      - [Mers el-Kébir taken, "13 September 1505"]
      - [Spanish defeat near Mers el-Kébir, "1507"]
      - [Oran stormed, "18 May 1509"]
