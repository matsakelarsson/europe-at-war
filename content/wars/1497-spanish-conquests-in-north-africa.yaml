id: spanish-conquests-in-north-africa
name: Spanish conquests in North Africa
start: "1497-09-17"
end: "1510-09"
tier: B
summary: "A run of Castilian and Aragonese conquests along the coast of the Maghreb after the fall of Granada, aimed at the ports from which ships raided the Spanish coasts and at carrying the war against Islam into Africa. Melilla was occupied in 1497, Mers el-Kébir taken in 1505, and in May 1509 an army financed and accompanied by Cardinal Cisneros and led by Pedro Navarro stormed Oran. In 1510 Navarro took Bougie, the towns of the central Maghreb from Algiers to Tlemcen accepted Spanish garrisons or paid tribute, and in July he took Tripoli after hard street fighting, killing and enslaving many thousands of its people. Then, at the end of August 1510, an army of about 15,000 that landed on Djerba was routed by its people and the heat, and its commander García Álvarez de Toledo was killed. Spain kept Melilla, Oran, Bougie, Tripoli and the island fort off Algiers, but the advance was over, and the ports of the Maghreb soon turned to the Barbarossa brothers for help."
countries: [es, ma, dz, tn, ly]
