notes:
  - Castile and Aragon were joined in the persons of Ferdinand and Isabella, but they remained separate crowns. Melilla, Mers el-Kébir and Oran were Castilian conquests, financed partly by the Duke of Medina Sidonia and by Cardinal Cisneros; Tripoli was attached to the kingdom of Sicily, which belonged to Aragon. After Isabella’s death in 1504 Ferdinand ruled Castile as regent.
  - Spanish chronicles call the corsairs of the Maghreb pirates. Many of their crews were Muslims who had left al-Andalus after 1492, and their raids were one reason for the expeditions; Christian corsairs raided the African coasts in the same way. Spanish and Arabic sources often disagree on dates, numbers and losses; the Spanish accounts are given here, with the main differences noted.
  - The Barbarossa brothers’ war against the Spanish garrisons from 1512 has its own entry. Spain lost Bougie in 1555 and Tripoli in 1551; Oran was Ottoman from 1708 to 1732 and was given up in 1792. Melilla is still Spanish.
