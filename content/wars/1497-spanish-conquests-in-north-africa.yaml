  - title: The disaster of Djerba
    date: August – October 1510
    when: "1510-08"
    borders: "1510-09-01"
    countries: [tn, ly]
    body:
      - At the end of July Navarro demanded the submission of Djerba, the island off southern Ifriqiya, and was refused. García Álvarez de Toledo, a son of the Duke of Alba, then arrived with 3,000 more men and took over command. On 29 August 1510 an army of about 15,000 landed on the island in the summer heat, without pack animals, dragging its guns and carrying its powder and supplies, and marched inland. Tormented by thirst, many soldiers broke ranks to reach the wells in a palm grove, where the island’s horsemen fell on them; García de Toledo was killed fighting with a pike near the wells.
      - The army fled back to the shore. Many men drowned trying to reach overloaded boats, and about 3,000 still waiting on the beach at nightfall were killed or captured. Estimates of the dead run from 2,000 to 4,000. The fleet left on 3 September and was scattered by storms; when about 8,000 men sailed from Tripoli in October, another storm sank more ships, and the survivors spent the winter on Lampedusa. In Spain the disaster passed into a proverb, “Los Gelves, madre, malos son de ganar” (“Djerba, mother, is hard to win”). Ferdinand turned his attention to the wars in Italy, and the Spanish advance in Africa came to an end.
    facts:
      - [Landing on Djerba, "29 August 1510"]
      - [Spanish dead, "about 2,000–4,000"]
      - [Commander killed, "García Álvarez de Toledo"]
