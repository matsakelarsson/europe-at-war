  - title: Bougie, Algiers and Tripoli
    date: January – July 1510
    when: "1510-01"
    borders: "1510-07-26"
    countries: [dz, ly, tn]
    body:
      - Pedro Navarro sailed again on 1 January 1510 and reached Bougie, then ruled by a Hafsid emir, on 5 January. According to the Spanish account the emir’s troops gave way and the city was taken with little fighting; Arabic chronicles describe weeks of sorties and date its fall to 25 May. The coastal towns of the central Maghreb hurried to make terms. Algiers, under its ruler Salim al-Tumi, agreed to pay tribute and to let the Spaniards build a fort with a garrison of 200 on an island off the harbour, the Peñón; Dellys and Ténès submitted, and on 5 June 1510 the sultan of Tlemcen agreed to pay tribute to Aragon.
      - Navarro then turned east. With about 15,000 men, among them 3,000 from Sicily, he sailed by way of Malta and attacked Tripoli on 25 July 1510. The city, which governed itself under the nominal rule of the Hafsids, fell after about three hours of street fighting. Spanish losses were about 300. Of perhaps 15,000–20,000 inhabitants, between 3,000 and 5,000 were killed and 5,000 to 10,000 enslaved, and about 170 Christian captives were freed. Tripoli was attached to the kingdom of Sicily.
    facts:
      - [Bougie taken, "January 1510 (Spanish account) or 25 May 1510 (Arabic chronicles)"]
      - [Tlemcen agrees to pay tribute, "5 June 1510"]
      - [Tripoli stormed, "25 July 1510"]
