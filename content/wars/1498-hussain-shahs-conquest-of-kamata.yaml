id: hussain-shahs-conquest-of-kamata
name: Hussain Shah’s conquest of Kamata
start: "1498"
end: "1499"
tier: C
summary: "The conquest of the Kamata kingdom, in today’s northern West Bengal, western Assam and northern Bangladesh, by Alauddin Hussain Shah, sultan of Bengal. Its last king, Nilambar of the Khen dynasty, had enlarged his realm from Cooch Behar to Kamrup. Helped by a minister of Nilambar who had gone over to him, Hussain invaded with an army said to number 24,000 infantry and cavalry and a war flotilla, defeated the allied local rulers, and sent his general Shah Ismail Ghazi against Nilambar’s capital, Kamatapur. After a long siege the city fell, was sacked and destroyed, and Nilambar was taken prisoner. Hussain annexed Kamata and Kamrup as far as Hajo, near Guwahati, and made his son Danyal governor, styling himself on his coins conqueror of Kamarupa and Kamata. Bengal’s rule did not last: Danyal and his officers were killed by local chiefs, the Baro-Bhuyans, and in the 1510s the Koch kingdom rose in Kamata’s place."
