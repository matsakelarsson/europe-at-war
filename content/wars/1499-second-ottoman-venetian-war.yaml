        side: ot
        name: Modon
        date: 9 August 1500
        text: Bayezid II’s army stormed the town after a Venetian relief fleet was beaten off. It stayed Ottoman until 1686.
        lonlat: [21.71, 36.82]
        lp: l
      - kind: taken
        side: ot
        name: Coron
        date: August 1500
        text: Surrendered after the fall of Modon, as did Navarino.
        lonlat: [21.96, 36.8]
      - kind: taken
        side: sp
        name: Kefalonia
        date: December 1500
        text: The Spanish and Venetian fleet stormed the Ottoman castle of St George after a siege of several weeks. The island stayed Venetian until 1797.
        lonlat: [20.53, 38.14]
      - kind: taken
        side: ot
        name: Durazzo
        date: 1501
