steps:
  - title: Zonchio and Lepanto
    date: 1499
    when: "1499-07"
    borders: "1499-09-01"
    countries: [gr, it, hr, tr]
    body:
      - In the summer of 1499 Bayezid II sent a great fleet, some 260 ships under the kapudan pasha Davud with the corsair captain Kemal Reis, to support the siege of Venetian Lepanto at the mouth of the Gulf of Corinth. The Venetian captain-general Antonio Grimani, with a smaller but heavier fleet, met it off Cape Zonchio near Navarino on 12 August. His captains failed to attack together, the great carrack of Andrea Loredan burned with an Ottoman ship locked to it, and in clashes over the following two weeks the Venetians could not stop the Ottoman fleet as it worked its way north along the coast.
      - With the Ottoman fleet and its guns in the Gulf of Corinth, Lepanto surrendered to the sultan’s army at the end of August. Ottoman horsemen from Bosnia raided Venetian Friuli that autumn, burning villages as far as the Tagliamento. In Venice the defeat caused uproar; Grimani was arrested, tried and exiled, though he later returned and became doge. Venetian attacks on Lepanto in the winter failed.
    facts:
      - [Battle of Zonchio, "12–25 August 1499, Ottoman victory"]
      - [Ottoman fleet, "about 260 ships, 60–70 of them galleys"]
      - [Lepanto surrenders, late August 1499]
    markers:
      - kind: naval
        side: ot
        name: Battle of Zonchio
        date: 12–25 August 1499
        text: Fought over several days off Navarino and Sapienza. The Venetians failed to stop the Ottoman fleet, and two of their great ships were lost.
        lonlat: [21.6, 36.88]
      - kind: taken
        side: ot
        name: Lepanto
        date: late August 1499
        text: The Venetian fortress at the entrance to the Gulf of Corinth surrendered once the Ottoman fleet arrived with its siege guns.
        lonlat: [21.83, 38.39]
    arrows:
      - side: ot
        label: Davud Pasha and Kemal Reis
        via: [[23.3, 36.3], [22.1, 36.65], [21.55, 37.4], [21.75, 38.3]]
  - title: Modon and the peace
    date: 1500–1503
    when: "1500-07"
    borders: "1503"
    countries: [gr, al, it, es, tr]
    body:
      - In 1500 Bayezid II led his army against Modon, Venice’s chief port in the Morea, while Kemal Reis blockaded it from the sea and beat off a Venetian relief fleet. On 9 August the town was stormed and sacked, and many of its people were killed. Coron and Navarino surrendered soon after. Venice had lost the “two eyes of the Republic”, its stations on the route to the Levant. In December a Venetian and Spanish fleet under Benedetto Pesaro and Gonzalo Fernández de Córdoba took the castle of St George on Kefalonia.
      - In 1501 Ottoman forces took Durazzo, Venice’s last important port in Albania. A French and Venetian attack on Mytilene failed, and in 1502 Pesaro took Lefkada. Venice, short of money and facing war in Italy, made peace at the end of 1502, confirmed in 1503. It kept Kefalonia but gave back Lefkada and recognised the loss of Lepanto, Modon, Coron and Durazzo. The Ottomans had shown that their fleet could defeat Venice’s.
    facts:
      - [Fall of Modon, 9 August 1500]
      - [Kefalonia taken by Venice and Spain, December 1500]
      - [Peace, "end of 1502, confirmed 1503"]
    markers:
