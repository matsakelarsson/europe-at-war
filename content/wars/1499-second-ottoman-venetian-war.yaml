id: second-ottoman-venetian-war
name: Second Ottoman–Venetian War
start: "1499"
end: "1503"
tier: B
summary: A war between the Republic of Venice and the Ottoman Empire of Bayezid II, fought at sea off western Greece and in the Venetian outposts of the Morea and Albania. The Ottoman fleet beat the Venetians at Zonchio in 1499 and took Lepanto, Modon, Coron and Durazzo, while Venice, with Spanish help, won Kefalonia; the peace of 1502–1503 confirmed the Ottoman conquests and showed that the sultan was now a naval power.
countries: [gr, al, it, hr, es, tr]
sides:
  - id: ve
    name: Republic of Venice
    polities: [venice]
    ink: red
    moves: Venetian moves
    success: Venetian success
  - id: sp
    name: Spain
    polities: [castile, aragon]
    ink: gold
    moves: Spanish moves
    success: Spanish success
  - id: ot
    name: Ottoman Empire
    polities: [ottoman]
    ink: teal
    moves: Ottoman moves
    success: Ottoman success
notes:
  - Dates are Julian. The sources give different dates for the end of the war; the peace was agreed at the end of 1502 and confirmed in 1503.
  - Venetian Dalmatia was raided from Ottoman Bosnia throughout the war, and in 1501 Venice agreed to pay the king of Hungary to defend Croatia, which shielded its Dalmatian towns.
