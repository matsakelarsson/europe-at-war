steps:
  - title: From the Val Müstair to Calven
    date: January–May 1499
    when: "1499-01-20"
    borders: "1499-05-22"
    countries: [ch, at, de, it]
    body:
      - The Swiss had refused the reforms of the Diet of Worms in 1495, with its new imperial court and tax, and would not join the Swabian League on their northern border. The spark came in the Grisons, whose Three Leagues had allied with the Confederates in 1497–98. On 20 January 1499 Habsburg troops from Tyrol occupied the Val Müstair, on the route from Tyrol to Milan, and plundered its convent. They were driven out and a truce was made, but troops from Uri, coming to help the Leagues, clashed with Habsburg soldiers on the Rhine, and within weeks the war had spread along the whole frontier.
      - The Swabian League called up its forces, and Maximilian placed the Confederates under the imperial ban. The war became a series of raids, burnings and plundering expeditions by both sides, broken by battles that the experienced Swiss infantry nearly always won, at Hard on Lake Constance on 20 February, Bruderholz near Basel on 22 March, Schwaderloh near Constance on 11 April and Frastanz near Feldkirch on 20 April. On 22 May the men of the Three Leagues stormed the Habsburg entrenchments at the Calven gorge near Glurns and ravaged the Vinschgau before Maximilian could arrive.
    facts:
      - [Battle of Schwaderloh, "11 April 1499, over 1,000 Swabians killed"]
      - [Battle of Calven, "22 May 1499, victory for the Three Leagues"]
