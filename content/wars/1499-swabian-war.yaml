id: swabian-war
name: Swabian War
start: "1499-01-20"
end: "1499-09-22"
tier: B
summary: The last great war between the Swiss Confederacy and the Habsburgs, fought from the Grisons to Basel against King Maximilian I and the Swabian League. The Swiss and their allies of the Three Leagues won almost every battle, ending at Dornach, and the Peace of Basel freed them from the imperial reforms of 1495, so that in practice they stood outside the Empire.
countries: [ch, at, de, it, fr]
sides:
  - id: ch
    name: Swiss Confederates and the Three Leagues
    polities: [switzerland, three-leagues]
    ink: red
    moves: Confederate moves
    success: Confederate success
  - id: sw
    name: Maximilian I and the Swabian League
    polities: [habsburg, hre]
    ink: purple
    moves: Habsburg and Swabian moves
    success: Habsburg and Swabian success
notes:
  - Dates are Julian, as usual for the period. The war is called the Schwabenkrieg (Swabian War) in Switzerland and the Schweizerkrieg (Swiss War) in Germany; in Austria it was also called the Engadine War.
  - The Swabian League, founded in 1488, joined the Swabian imperial cities and knights with the Habsburg lands and the Count of Württemberg. Maximilian I had been king of the Romans since 1486 and ruled all the Habsburg lands from 1493.
