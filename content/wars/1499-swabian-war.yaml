  - title: Dornach and the Peace of Basel
    date: July–September 1499
    when: "1499-07-22"
    borders: "1499-09-22"
    countries: [ch, de, at, fr]
    body:
      - Maximilian came to Lake Constance to take command, but the Swabian League refused to send its troops to the Grisons, and for weeks little happened. By July his unpaid mercenaries and the League’s peasant soldiers, eager to bring in the harvest, were close to leaving. On 21 July a Swabian force crossed the lake and burned Rheineck and Rorschach. The next day an army of about 16,000 under Count Heinrich von Fürstenberg, besieging the castle of Dorneck above Dornach near Basel, was attacked by a hurriedly gathered Confederate army. Fürstenberg was killed early on, and after a long, hard fight the Swabians fled, leaving about 3,000 dead and all their guns.
      - Neither side wanted to go on, and the Duke of Milan, who needed both Swiss soldiers and Maximilian’s help against France, mediated. The Peace of Basel, signed on 22 September 1499, treated the war as one between the Confederates and the Habsburgs rather than the Empire. The imperial ban was quietly dropped, and the Confederates stayed outside the new imperial court and taxes. No land changed hands, but the Confederates took over the high court of the Thurgau from the city of Constance. Formally the Swiss stayed in the Empire until 1648; in practice they had left it.
    facts:
      - [Battle of Dornach, "22 July 1499, Confederate victory"]
      - [Losses at Dornach, "about 3,000 Swabian and 500 Swiss dead"]
      - [Peace of Basel, 22 September 1499]
    markers:
      - kind: taken
        side: sw
        name: Rheineck and Rorschach
        date: 21 July 1499
        text: One of the few Swabian successes. Troops crossed Lake Constance by boat, surprised the small Swiss garrison and burned the two places.
        lonlat: [9.58, 47.47]
      - kind: battle
        side: ch
        name: Battle of Dornach
        date: 22 July 1499
        text: The last battle of the war. The Swabian army was surprised in its camp below Dorneck castle; Fürstenberg fell early in the fighting.
        lonlat: [7.62, 47.48]
      - kind: treaty
        name: Peace of Basel
        date: 22 September 1499
        text: Mediated by Milan. Basel, which had stayed neutral, joined the Confederacy two years later, as did Schaffhausen.
        lonlat: [7.59, 47.56]
        lp: l
