        text: The Zamorin’s base for the campaign, in the land of his ally the chief of Edappally.
        lonlat: [76.31, 10.03]
      - kind: taken
        side: pt
        name: Cranganore
        date: 1504
        text: Sacked by Lopo Soares’ men. The neighbouring ruler of Tanur went over to the Portuguese.
        lonlat: [76.2, 10.22]
        lp: l
      - kind: naval
