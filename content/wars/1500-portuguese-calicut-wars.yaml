id: portuguese-calicut-wars
name: Portuguese–Calicut wars
start: "1500-12"
end: "1531"
tier: A
summary: "The wars between Portugal and the Zamorin of Calicut, the ruler of the greatest pepper port on the Malabar Coast, which began when Pedro Álvares Cabral bombarded Calicut in December 1500 and made an alliance with its rival Cochin. Vasco da Gama returned in 1502 with a war fleet and burned a pilgrim ship with hundreds aboard. The Zamorin’s armies burned Cochin in 1503 but were held off at its fords in 1504 by Duarte Pacheco Pereira’s small garrison, and Portuguese fleets beat Calicut’s at Cannanore (1506) and elsewhere. Albuquerque’s assault on Calicut failed in 1510, but the Portuguese blockade forced a peace in 1513 that gave Portugal a fortress there. War broke out again in the 1520s; the Zamorin took the fort at Calicut in 1526, and in 1531 the Portuguese built a new one at Chaliyam. Truces and wars followed for the rest of the century."
countries: [in, pt]
sides:
  - id: pt
    name: Portugal and Cochin
    polities: [portugal, cochin]
    ink: green
    moves: Portuguese and Cochin moves
    success: Portuguese or Cochin success
  - id: cal
    name: Calicut (the Zamorin) and his allies
    polities: [calicut]
    ink: red
    moves: Calicut moves
    success: Calicut success
notes:
  - "The ruler of Calicut was known by his title, the Samoothiri (Zamorin in Portuguese and English). The Portuguese chroniclers Castanheda, Correia, Barros and Albuquerque’s son Brás are the main sources, with the Arabic Tuhfat al-Mujahidin of Zain al-Din Makhdum, written in the 1580s from the side of the Muslim merchants of Malabar. Numbers for the Calicut armies (50,000 to 84,000 at Cochin in 1504) come from the Portuguese side and are probably too high."
  - The Battle of Chaul (1508) and the Battle of Diu (1509), in which Calicut’s ships fought beside the fleets of the Mamluk sultan and Gujarat, are told in their own war, as is Albuquerque’s conquest of Goa (1510).
  - The war at sea went on after 1531, led by the Kunjali Marakkars, Calicut’s Muslim admirals. The Zamorin starved out the fort at Chaliyam in 1571, and in 1600 he joined the Portuguese to destroy the last Kunjali’s stronghold.
