        name: Chaliyam
        date: "1531"
        text: The new Portuguese fortress south of Calicut. The Zamorin starved it into surrender in 1571.
        lonlat: [75.81, 11.16]
        lp: l
      - kind: event
        side: pt
        name: Tanur
        date: 1531
        text: Its ruler, an ally of the Portuguese since 1504, allowed the fort to be built in his land.
        lonlat: [75.87, 10.97]
      - kind: held
        side: pt
