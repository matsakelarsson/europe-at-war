steps:
  - title: Cabral at Calicut
    date: 1500
    when: "1500-12"
    borders: "1500-12-24"
    countries: [in, pt]
    body:
      - Vasco da Gama had reached Calicut, the greatest pepper port of the Malabar Coast, in May 1498. Its Hindu ruler, the Zamorin, lived from the trade, which was largely in the hands of Muslim merchants, both local Mappilas and traders from Egypt and Arabia, who carried the spices on to the Red Sea. In 1500 a royal fleet under Pedro Álvares Cabral reached Calicut, made a treaty with the Zamorin and opened a trading post. The merchants saw the Portuguese as rivals, and the Portuguese found it hard to buy pepper.
      - In December 1500, after Cabral seized a Muslim ship loading spices in the harbour, a crowd stormed the trading post and killed about 50 Portuguese, among them the factor Aires Correia. Cabral blamed the Zamorin. He seized ten merchant ships in the harbour, killed their crews and burned them, and bombarded the city for two days, killing an estimated 500 to 600 people. Then he sailed south to Cochin, a smaller port whose raja, Unni Goda Varma, was a vassal of the Zamorin and resented it. On 24 December the raja made an alliance with the Portuguese, who loaded pepper and left factors in his town. Cannanore, to the north, also welcomed them.
    facts:
      - [Da Gama at Calicut, "May 1498"]
      - [Trading post attacked, "December 1500, about 50 Portuguese killed"]
      - [Treaty with Cochin, "24 December 1500"]
    markers:
      - kind: naval
        side: pt
        name: Calicut
        date: December 1500
        text: After the attack on the trading post Cabral burned the ships in the harbour and bombarded the city for two days.
        lonlat: [75.77, 11.25]
      - kind: treaty
        side: pt
        name: Cochin
        date: 24 December 1500
        text: Its raja, eager to be free of the Zamorin, became Portugal’s ally. The alliance lasted, with Cochin a Portuguese client, until the Dutch came in 1663.
        lonlat: [76.24, 9.965]
      - kind: event
        side: pt
        name: Cannanore
        date: January 1501
        text: Its ruler, the Kolathiri, also offered pepper to Cabral, who called here on his way home.
        lonlat: [75.37, 11.86]
    arrows:
      - side: pt
        label: Cabral
        via: [[75.7, 11.22], [75.82, 10.6], [76.07, 10.2], [76.2, 9.99]]
  - title: Da Gama returns
    date: 1502–1503
    when: "1502-10"
    borders: "1503-08"
    countries: [in, pt]
    body:
      - In 1502 da Gama came back with a war fleet. Off Madayi, north of Cannanore, he captured the Miri, a ship carrying more than 400 pilgrims home from Mecca, took its cargo and burned it with most of its passengers, women and children among them, locked aboard. At Calicut he demanded that the Zamorin expel all Muslims from the city. When the Zamorin refused, da Gama bombarded Calicut and hanged and mutilated fishermen and traders he had seized. He loaded pepper at Cochin and Cannanore, and in January 1503 his ships, sailing in line and firing broadsides, routed a large Calicut fleet off the city.
      - In April 1503, after the fleets had gone, the Zamorin marched on Cochin with an army of some 50,000. Narayan, a prince of Cochin, was killed defending the ford at Edappally, the town was burned, and the raja and the Portuguese factors fled to the island of Vypin. In August the arrival of squadrons under Francisco and Afonso de Albuquerque forced the Zamorin back, and with the raja’s leave the Portuguese built a wooden fort at Cochin, Fort Manuel, their first fortress in India.
    facts:
      - [Burning of the Miri, "October 1502, over 400 pilgrims aboard"]
      - [Battle off Calicut, "January 1503, Portuguese victory"]
      - [Fort Manuel built at Cochin, "1503"]
    markers:
      - kind: event
        side: pt
        name: The Miri
        date: October 1502
        text: The pilgrim ship was plundered and burned off Madayi. A few children were spared and baptised.
        lonlat: [75.25, 12.03]
      - kind: naval
        side: pt
        name: Calicut
        date: November 1502 – January 1503
        text: Bombarded by da Gama, who later beat a Calicut fleet of some 20 large ships and many smaller ones off the harbour.
        lonlat: [75.77, 11.25]
      - kind: battle
        side: cal
        name: Edappally
        date: April 1503
        text: The ford where the Cochin prince Narayan fell. Its chief was an ally of the Zamorin.
        lonlat: [76.31, 10.03]
      - kind: held
        side: pt
        name: Cochin
        date: 1503
        text: Burned by the Zamorin’s army in 1503, while the raja took refuge on the island of Vypin across the harbour. Fort Manuel was built here after the Zamorin withdrew.
        lonlat: [76.24, 9.965]
        lp: l
    arrows:
