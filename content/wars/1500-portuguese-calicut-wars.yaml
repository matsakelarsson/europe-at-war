  - title: Albuquerque at Calicut and the peace of 1513
    date: 1510–1513
    when: "1510-01-04"
    borders: "1510-01-04"
    countries: [in, pt]
    body:
      - Afonso de Albuquerque, governor from November 1509, struck at Calicut itself. On 4 January 1510, while the Zamorin was away, a force of about 2,000 men landed, stormed the shore and broke into the palace. But the marshal Fernando Coutinho, who led the attack, was killed as the Nairs counter-attacked in the narrow streets, and Albuquerque was badly wounded; the Portuguese lost some 300 dead. Albuquerque fell back on a blockade and turned his strength to Goa (1510), Malacca (1511) and the Red Sea.
      - The blockade strangled Calicut’s trade. The Zamorin died in 1513, poisoned on his heir’s orders at Albuquerque’s urging according to the Portuguese, and on 24 December 1513 his successor signed a peace that let the Portuguese build a fortress at Calicut and buy pepper there.
    facts:
      - [Attack on Calicut, "4 January 1510, Portuguese repulse"]
      - [Portuguese losses, "about 300 dead, including Fernando Coutinho"]
      - [Peace of Calicut, "24 December 1513"]
    markers:
      - kind: battle
        side: cal
        name: Calicut
        date: 4 January 1510
        text: The Portuguese broke into the palace but were driven back to their boats with heavy losses.
        lonlat: [75.77, 11.25]
      - kind: event
        side: pt
        name: Cochin
        date: 31 December 1509
        text: Albuquerque’s fleet of 20 ships sailed from here for Calicut.
        lonlat: [76.24, 9.965]
      - kind: taken
        side: pt
        name: Goa
        date: 1510
        text: Albuquerque took Goa from Bijapur later that year, and it became the capital of Portuguese India.
        lonlat: [73.91, 15.5]
    arrows:
      - side: pt
        label: Albuquerque
        via: [[76.2, 9.98], [76.1, 10.3], [75.88, 10.85], [75.74, 11.22]]
  - title: The fort at Calicut and Chaliyam
    date: 1525–1531
    when: "1526-06-03"
    borders: "1531"
    countries: [in, pt]
    body:
      - The peace did not last. The Muslim merchants of Calicut and their sea captains, the Kunjali Marakkars, kept up a war at sea against Portuguese shipping and the passes (cartazes) the Portuguese tried to force on Indian traders. In March 1525 a Portuguese fleet destroyed a Calicut fleet at Ponnani. On 3 June 1526 the Zamorin besieged the Portuguese fort at Calicut, held by about 300 men under João de Lima. A fleet from Goa arrived in September, and the Portuguese decided to abandon the fort, which they partly destroyed before leaving.
      - In 1531, after a new peace with the Zamorin, the governor Nuno da Cunha built a fortress at Chaliyam, on a river mouth south of Calicut, in the land of the ruler of Tanur, an ally of Portugal. From there the Portuguese could watch the trade of Calicut, and the seat of their government moved from Cochin to Goa. The war between Portugal and Calicut went on, broken by truces, for the rest of the century.
    facts:
      - [Calicut fleet destroyed at Ponnani, "March 1525"]
      - [Siege of the fort at Calicut, "June – September 1526, fort abandoned"]
      - [Fort at Chaliyam built, "1531"]
    markers:
      - kind: naval
        side: pt
        name: Ponnani
        date: March 1525
        text: The Zamorin’s fleet was destroyed in the river mouth here.
        lonlat: [75.92, 10.77]
      - kind: siege
        side: cal
        name: Calicut fort
        date: June – September 1526
        text: The fortress built under the peace of 1513, besieged by the Zamorin and abandoned by its garrison.
        lonlat: [75.77, 11.25]
      - kind: held
