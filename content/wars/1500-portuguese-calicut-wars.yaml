  - title: The defence of Cochin
    date: March – July 1504
    when: "1504-03-16"
    borders: "1504-07"
    countries: [in, pt]
    body:
      - When the Portuguese fleets sailed home in early 1504 they left Duarte Pacheco Pereira at Cochin with about 150 Portuguese, a few ships and the raja’s remaining forces, fewer than 5,000 men. In March the Zamorin came back with an army the chroniclers put at 57,000 or more, with European-style guns, and a fleet of about 160 boats. Cochin’s defence was its backwaters, which could be crossed only at a few fords.
      - Pacheco used the tides to shift his ships and men between the crossings at Kumbalam, Palluruthy and Panangad. From Palm Sunday, 31 March, to July he beat off seven assaults, sinking the war boats by the score with his guns. Cholera broke out in the Calicut camp, and in July 1504 the Zamorin withdrew. The defeat cost him much of his standing among the rulers of Malabar. In the autumn a new fleet under Lopo Soares de Albergaria bombarded Calicut, sacked Cranganore, and on 31 December 1504 burned 17 Muslim merchant ships at Pandarane.
    facts:
      - [Battle of Cochin, "16 March – 3 July 1504, Portuguese and Cochin victory"]
      - [Defenders, "about 150 Portuguese and under 5,000 Cochin soldiers"]
      - [Battle of Pandarane, "31 December 1504"]
    markers:
      - kind: battle
        side: pt
        name: Kumbalam
        date: 31 March – April 1504
        text: The main ford south of Cochin, where Pacheco’s ships beat off the first three assaults. Later attacks came at Palluruthy and Panangad nearby.
        lonlat: [76.31, 9.9]
        lp: r
      - kind: held
        side: pt
        name: Fort Manuel (Cochin)
        date: 1504
        text: The Portuguese base, held throughout the siege.
        lonlat: [76.24, 9.965]
        lp: l
