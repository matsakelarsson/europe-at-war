  - title: Almeida and the Battle of Cannanore
    date: 1505–1507
    when: "1506-03"
    borders: "1506-03"
    countries: [in, pt]
    body:
      - In 1505 King Manuel I sent Francisco de Almeida as the first viceroy of India, with 21 ships and about 1,500 men, to build fortresses and rule the sea. He built forts on the island of Anjediva, at Cannanore with the leave of its ruler, the Kolathiri, and at Cochin, where the Portuguese crowned a new raja. When the Portuguese at Kollam (Quilon) were killed, his son Lourenço burned 24 Calicut merchant ships in its harbour.
      - In March 1506 the Zamorin sent a fleet of more than 200 vessels against them. Lourenço de Almeida met it off Cannanore with a few carracks, a caravel and some smaller ships and defeated it; the young Ferdinand Magellan was among the wounded. In 1507 a new Kolathiri, who owed his throne to the Zamorin, turned on the Portuguese. With Calicut’s men and guns he besieged their fort at Cannanore from 27 April until Tristão da Cunha’s fleet relieved it on 27 August.
    facts:
      - [Almeida arrives, "1505, with 21 ships"]
      - [Battle of Cannanore, "March 1506, Portuguese victory"]
      - [Siege of Cannanore, "27 April – 27 August 1507, relieved"]
    markers:
      - kind: event
        side: pt
        name: Anjediva
        date: 1505
        text: An island off the Kanara coast where Almeida built his first fort, a watering place for the fleets.
        lonlat: [74.1, 14.76]
      - kind: naval
        side: pt
        name: Cannanore
        date: March 1506
        text: Lourenço de Almeida’s squadron beat the Zamorin’s fleet off the harbour. The fort of Sant’Angelo held out against a four-month siege in 1507.
        lonlat: [75.37, 11.86]
      - kind: naval
        side: pt
        name: Kollam (Quilon)
        date: November 1505
        text: After the Portuguese traders here were killed, Lourenço de Almeida burned the Calicut ships in the port.
        lonlat: [76.58, 8.88]
      - kind: held
        side: pt
        name: Cochin
        date: 1505
        text: Almeida strengthened the fort and crowned a new raja friendly to Portugal.
        lonlat: [76.24, 9.965]
      - kind: capital
        side: cal
        name: Calicut
        date: 1505–1507
        text: The Zamorin’s capital, where Italian gunfounders helped him cast cannon.
        lonlat: [75.77, 11.25]
    arrows:
