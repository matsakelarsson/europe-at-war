steps:
  - title: The Qizilbash and Shirvan
    date: 1499 – early 1501
    when: "1500-12"
    borders: "1500-12"
    countries: [az, tr, ir]
    body:
      - The Safavids were the hereditary sheikhs of a Sufi order based at Ardabil, whose followers among the Turkmen tribes of eastern Anatolia and Azerbaijan revered them almost as divine. The Turkmen followers were called Qizilbash, “red heads”, after the red caps they wore. Ismail’s grandfather Junayd and his father Haydar had both been killed fighting the Shirvanshahs, in 1460 and 1488, and in 1494 the Aq Qoyunlu killed his elder brother Ali. Ismail, then seven, was hidden in Gilan. In 1499, aged twelve, he left Lahijan to claim his inheritance, while the Aq Qoyunlu confederation that ruled western Iran was splitting between rival princes.
      - In the summer of 1500 about 7,000 Qizilbash of the Ustajlu, Shamlu, Rumlu, Takkalu, Dulkadir, Afshar, Qajar and other tribes gathered around him at Erzincan. Rather than attack the Aq Qoyunlu at once, Ismail led them against Shirvan to avenge his father. In December 1500 they crossed the Kura and defeated the Shirvanshah Farrukh Yasar, who was killed, in a battle near Shamakhi. The Qizilbash went on to take Baku in 1501. The Shirvanshahs survived as Safavid vassals until 1538.
    facts:
      - [Qizilbash gathered at Erzincan, "about 7,000, summer 1500"]
      - [Farrukh Yasar of Shirvan killed, "December 1500"]
