  - title: Hamadan and the Iranian plateau
    date: 1503–1504
    when: "1503-06-21"
    borders: "1504-12"
    countries: [ir]
    body:
      - Southern and central Iran were ruled, mostly in name, by Alvand’s cousin Sultan Murad, whose provinces were wasted by war, famine and plague. Ismail offered him peace if he submitted. Murad refused and marched against him, and on 21 June 1503, near Hamadan, Ismail’s army of about 12,000 routed him. The chronicles give Murad 70,000 men or more and his losses as 10,000 or more. Murad fled west, and Ismail took Persian Iraq and Fars, entering Shiraz on 24 September 1503; Isfahan and Kerman also fell.
      - In 1504 Ismail turned on the local rulers south of the Caspian. The fortress of Firuzkuh, held by the Gilani lord Kiya Husayn, was taken after a siege; its defenders were killed, Kiya Husayn was shut in a cage, where he died, and a court painting shows a captured Aq Qoyunlu commander being roasted on a spit. Mazandaran and Gorgan submitted, and Yazd was taken from a rebel ruler. By the end of 1504 Ismail ruled almost all of western and central Iran.
    facts:
      - [Battle of Hamadan, "21 June 1503, Safavid victory"]
      - [Shiraz taken, "24 September 1503"]
      - [Firuzkuh taken, "1504"]
    markers:
      - kind: battle
        side: saf
