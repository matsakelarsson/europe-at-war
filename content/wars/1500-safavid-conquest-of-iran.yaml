  - title: Sharur and Tabriz
    date: "1501"
    when: "1501-07"
    borders: "1501-12-22"
    countries: [az, ir]
    body:
      - The Aq Qoyunlu prince Alvand, who held Azerbaijan, marched north from Tabriz across the Aras to stop the Qizilbash. In 1501 the two armies met at Sharur, near Nakhchivan. Alvand’s army is said to have been more than four times larger, but the Qizilbash routed it; a later Safavid account claims up to 18,000 of his men were killed. Alvand fled, and Ismail entered Tabriz, the Aq Qoyunlu capital, without resistance.
      - In Tabriz Ismail, aged fourteen, was proclaimed shah. He made Twelver Shi‘ism, until then the faith of a minority in Iran, the religion of the state, and ordered the first three caliphs, revered by Sunnis, to be cursed in public. The new faith was imposed by force, and Sunni clerics who resisted were killed or fled. Alvand briefly retook Tabriz in 1502 but was driven out again, and the same year Ismail took Erzincan and Erzurum.
    facts:
      - [Battle of Sharur, "1501, Safavid victory"]
      - [Safavid army, "about 7,000"]
      - [Ismail proclaimed shah, "1501, in Tabriz"]
    markers:
