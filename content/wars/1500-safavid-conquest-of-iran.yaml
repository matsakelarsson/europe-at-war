  - title: Diyarbakır and Baghdad
    date: 1507–1508
    when: "1508"
    borders: "1508-12"
    countries: [tr, iq, ir]
    body:
      - The last Aq Qoyunlu princes found shelter in the west, and the Dulkadir prince Ala al-Dawla of Elbistan, a vassal of the Mamluks, refused to recognise Ismail. In 1507 Ismail marched against him across Ottoman territory, and his Qizilbash commander Muhammad Khan Ustajlu conquered Diyarbakır, the old Aq Qoyunlu homeland, where he became governor. The march through his lands, and the Safavid preaching among the Turkmen of Anatolia, worried the Ottoman sultan Bayezid II.
      - In 1508 the rulers of Khuzestan, Luristan and Kurdistan accepted Ismail as their overlord. The same year Ismail and his commander Husayn Beg Shamlu marched on Baghdad, from which Sultan Murad had fled. The city was taken, ending the Aq Qoyunlu state, and on Ismail’s orders the tombs of Sunni figures revered across the Muslim world, among them Abu Hanifa, ‘Abd al-Qadir Gilani and the Abbasid caliphs, were destroyed.
    facts:
      - [Diyarbakır conquered, "1507"]
      - [Baghdad taken, "1508"]
    markers:
      - kind: taken
        side: saf
        name: Diyarbakır
