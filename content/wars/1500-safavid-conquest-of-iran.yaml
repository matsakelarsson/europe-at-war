notes:
  - Army sizes come from later Safavid chronicles, which made Ismail’s victories as great as possible; the Aq Qoyunlu numbers at Sharur and Hamadan in particular are not reliable.
  - The date of Ismail’s enthronement is uncertain. Most histories place it in Tabriz in the summer of 1501; the chronicler Hayati Tabrizi gives 22 December 1501.
  - The conversion of Iran to Twelver Shi‘ism, begun by force under Ismail, took more than a century to complete.
