  - title: Merv
    date: 1510
    when: "1510-12-02"
    borders: "1510-12-02"
    countries: [tm, ir, af]
    body:
      - While Ismail conquered the west, the Uzbek khan Muhammad Shaybani had taken Transoxiana from the Timurids, Khwarazm in 1505 and Herat and Khorasan in 1507, and his raids reached Kerman. Letters between the two rulers turned to insults; the Sunni khan called on Ismail to return to the faith of his forefathers. In 1510 Ismail marched east and took Mashhad, while Shaybani, whose army was scattered, fell back to the fortress of Merv to wait for help.
      - After a month of siege the Safavids pretended to retreat. On 2 December 1510 Shaybani came out in pursuit and was trapped near Merv by about 17,000 Qizilbash. Some 10,000 Uzbeks are said to have been killed, and Shaybani was caught and killed as he fled. Ismail had his skull covered in gold and made into a drinking cup and sent parts of his body around the empire. Herat surrendered and Khorasan became a Safavid province, the base of a century of wars with the Uzbeks. Ismail sent back Babur’s sister, who had been married to Shaybani, and helped Babur in his attempt to win back Samarkand.
    facts:
      - [Battle of Merv, "2 December 1510, Safavid victory"]
      - [Safavid army, "about 17,000"]
      - [Uzbek dead, "some 10,000"]
    markers:
