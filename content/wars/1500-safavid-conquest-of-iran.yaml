id: safavid-conquest-of-iran
name: Safavid conquest of Iran
start: "1500"
end: "1510-12-02"
tier: A
summary: The campaigns in which Ismail, the teenage head of the Safavid Sufi order of Ardabil, and his Turkmen followers, the Qizilbash, conquered Iran in ten years. In 1500–1501 they killed the Shirvanshah, defeated the Aq Qoyunlu at Sharur and took Tabriz, where Ismail was proclaimed shah and made Twelver Shi‘ism the religion of the state. His victory at Hamadan in 1503 gave him western and central Iran; by 1508 he had taken Diyarbakır and Baghdad, ending the Aq Qoyunlu; and in 1510 he defeated and killed the Uzbek ruler Muhammad Shaybani at Merv and annexed Khorasan. The Safavid state lasted until 1736, and its frontiers roughly foreshadowed those of modern Iran.
countries: [ir, az, iq, tr, tm, af, am]
