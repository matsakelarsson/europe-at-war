id: shaybanid-timurid-wars
name: Shaybanid–Timurid wars
start: "1500"
end: "1512-11-12"
tier: B
summary: The wars in which the Uzbeks under Muhammad Shaybani drove the last Timurid princes out of Central Asia. Shaybani took Samarkand and Bukhara in 1500–1501, beating the young Babur at Sar-e-Pul, defeated the Moghul khans at Akhsi in 1503, conquered Khwarazm and in 1507 took Herat, the last Timurid capital. Babur escaped to Kabul. After Shah Ismail of Persia killed Shaybani at Merv in 1510, Babur, with Persian help, retook Samarkand in 1511, but the Uzbeks beat him at Kul-i Malik in 1512 and destroyed a Persian army at Ghazdewan. Transoxiana stayed Uzbek, and Babur turned towards India.
