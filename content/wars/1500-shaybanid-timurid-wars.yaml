  - title: Akhsi, Kabul and Herat
    date: 1503–1507
    when: "1503-06"
    borders: "1507-12"
    countries: [uz, kg, tm, af]
    body:
      - Babur went to his maternal uncles, the Moghul (Chagatai) khans Mahmud of Tashkent and Ahmad of eastern Moghulistan, who joined him to recover Ferghana. In June 1503 Shaybani surprised them at Akhsi in the Ferghana valley and took both khans prisoner. Tashkent and Ferghana passed to the Uzbeks, and Babur fled with a few hundred followers. In October 1504 he crossed the Hindu Kush and took Kabul from the Arghun chiefs, making it his new kingdom.
      - Shaybani conquered Khwarazm in 1505. In Herat, the old Timurid ruler Husayn Bayqara died in 1506 while preparing a campaign against him, and his sons could not agree. In 1507 Shaybani took Herat, ending Timurid rule there, and occupied Khorasan, while his raids reached as far as Kerman. Babur, who had visited Herat shortly before, returned to Kabul and took the title of padshah, emperor, as the senior surviving Timurid.
    facts:
      - [Battle of Akhsi, "June 1503, Uzbek victory"]
      - [Babur takes Kabul, "October 1504"]
      - [Herat taken by Shaybani, "1507"]
