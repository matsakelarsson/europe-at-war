  - title: Babur’s return and Ghazdewan
    date: 1511–1512
    when: "1512-11-12"
    borders: "1512-12"
    countries: [uz, tj, af]
    body:
      - After Shaybani’s death at Merv, Shah Ismail sent back Babur’s sister and offered him help. Babur accepted Persian overlordship, crossed the mountains with Persian troops and in 1511 took Samarkand for the third time, and Bukhara too. But his Persian alliance, and the Shi‘i Qizilbash dress he wore, cost him the support of the Sunni townspeople. In May 1512 Shaybani’s nephew Ubaydullah defeated him at Kul-i Malik near Bukhara, and he fell back to Hisar.
      - Ismail sent his vakil Najm-e Sani with an army from Khorasan. Joined by Babur, the force, said to number 60,000, crossed the Amu Darya and stormed Qarshi, where the inhabitants were massacred without regard to age or sex, among them the poet Bana’i; Babur’s pleas to spare the town were ignored. On 12 November 1512 the Uzbeks under Ubaydullah defeated the army at Ghazdewan, near Bukhara. Najm-e Sani was captured and executed, and the survivors fled across the Amu Darya. Babur returned to Kabul, and the Shaybanids held Transoxiana for the rest of the century.
    facts:
      - [Babur retakes Samarkand, "1511"]
      - [Battle of Kul-i Malik, "May 1512, Uzbek victory"]
      - [Battle of Ghazdewan, "12 November 1512, Uzbek victory"]
