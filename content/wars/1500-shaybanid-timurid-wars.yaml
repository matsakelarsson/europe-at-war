steps:
  - title: Samarkand lost
    date: 1500–1501
    when: "1501-05"
    borders: "1501"
    countries: [uz]
    body:
      - By 1500 the Timurid realm in Central Asia had split among quarrelling princes. Muhammad Shaybani, a grandson of the Uzbek khan Abu’l-Khayr, led the Uzbek tribes south from the steppe and in 1500 took Samarkand from its Timurid ruler, and Bukhara too. Babur, the eighteen-year-old Timurid prince of Ferghana, who had held Samarkand for a hundred days in 1497, slipped into the city with a small band and retook it while Shaybani was away.
      - In the spring of 1501 Shaybani returned from Bukhara. Babur marched out against him and, in April or May, was defeated at Sar-e-Pul on the Zarafshan river, where the larger Uzbek army turned his flank. He was besieged in Samarkand for months until hunger forced him to make terms; he gave his sister Khanzada to Shaybani as a wife and was allowed to leave. Samarkand became the capital of the Shaybanid khanate.
    facts:
      - [Battle of Sar-e-Pul, "April–May 1501, Uzbek victory"]
      - [Samarkand surrendered to Shaybani, "1501"]
    markers:
      - kind: siege
        side: uz
        name: Samarkand
        date: "1501"
        text: Babur, beaten at Sar-e-Pul, was besieged in the city and left it under a settlement with Shaybani.
        lonlat: [66.98, 39.65]
      - kind: taken
        side: uz
        name: Bukhara
        date: 1500–1501
