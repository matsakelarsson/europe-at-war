id: guelders-wars
name: Guelders Wars
start: "1502"
end: "1543-09-07"
tier: C
summary: Forty years of intermittent war between the dukes of Guelders and the Habsburg rulers of the Netherlands. Charles of Egmond, who had won back his duchy in 1492, fought Philip the Fair, Margaret of Austria and Charles V with French support, and for a time held Groningen, Friesland and the lands of Utrecht. The wars were mostly raids, ambushes and sieges rather than battles, but civilians suffered badly; the Guelders commander Maarten van Rossum sacked The Hague in 1528 and besieged Antwerp in 1542. Charles V gradually took Friesland, Utrecht and Groningen, and after he destroyed the town of Düren in 1543, Duke William of Jülich-Cleves gave up Guelders and Zutphen in the Treaty of Venlo, bringing all the northern Low Countries under Habsburg rule.
