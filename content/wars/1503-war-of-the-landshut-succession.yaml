id: war-of-the-landshut-succession
name: War of the Landshut Succession
start: "1503"
end: "1505"
tier: C
summary: A war between two branches of the House of Wittelsbach over the duchy of Bavaria-Landshut, which Duke George the Rich had left at his death in December 1503 to his daughter Elisabeth and her husband Rupert of the Palatinate, against the family’s rule of male succession. Albert IV of Bavaria-Munich, backed by King Maximilian I, the Swabian League, Württemberg, Hesse and Nuremberg, fought the Palatine side in 1504, devastating Lower Bavaria and the Rhenish Palatinate; Maximilian beat a Bohemian mercenary army at Wenzenbach on 12 September 1504. Rupert and Elisabeth both died that year, and Maximilian’s award at the Diet of Cologne on 30 July 1505 gave most of the duchy to Munich, reuniting Bavaria. Their young sons received the new principality of Palatinate-Neuburg, Maximilian took Kufstein, Kitzbühel and Rattenberg for Tyrol, and Nuremberg kept Lauf, Hersbruck and Altdorf.
countries: [de, at]
sides:
  - id: bav
    name: Albert IV of Bavaria-Munich and Maximilian I
    polities: [bavaria, hre, habsburg, wurttemberg, hesse]
    ink: navy
  - id: pal
    name: Rupert and Elisabeth, and the Elector Palatine
    polities: [palatinate]
    ink: orange
notes:
  - Also called the Bavarian War of Succession or the Landshut War. Götz von Berlichingen, fighting for Munich, lost his right hand to a cannon shot before Landshut in July 1504 and afterwards wore the iron hand that made him famous.
  - Elisabeth’s side was supported by the Elector Palatine Philip, Rupert’s father, and hired Bohemian troops; the Electoral Palatinate also lost land to Hesse and Württemberg in the peace.
