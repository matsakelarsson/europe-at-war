id: funj-conquest-of-alwa
name: Funj and Abdallab conquest of Alwa
start: "1504"
end: "1505"
tier: C
summary: "The end of Alwa (Alodia), the last of the Christian Nubian kingdoms, whose capital Soba stood on the Blue Nile just above its meeting with the White Nile, and the rise of the Funj Sultanate of Sennar. By the 15th century Arab Bedouin had settled much of the central Nile valley and Alwa was in decline. Sudanese tradition credits its fall to an alliance between Abdallah Jamma, the ancestor of the Abdallab, who led Arab groups from his seat at Qerri, and Amara Dunqas, king of the Funj, cattle-keepers from the south who founded Sennar on the Blue Nile. The dates are uncertain: the Tabaqat of Wad Dayfallah (about 1700) puts the Funj victory over the “kingdom of the Nuba” in 1504–1505, documents from Shendi give 1509 for the destruction of Soba after an attack in 1474, and the 19th-century Funj Chronicle gives an earlier date. Most modern scholars think Arabs rather than the Funj destroyed Soba, around 1500. When the traveller David Reubeni passed in 1523 he found Soba in ruins, though he still heard of a “kingdom of Soba”, and tradition says Alwan princes held out in the Fazughli hills until the Funj took them in 1685. The Abdallab became vassals of the Funj, who ruled the Gezira from Sennar while the Abdallab governed the north from Qerri, and the Funj Sultanate lasted until the Egyptian conquest of 1821."
