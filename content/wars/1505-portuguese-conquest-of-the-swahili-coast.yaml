id: portuguese-conquest-of-the-swahili-coast
name: Portuguese conquest of the Swahili coast
start: "1505-07-24"
end: "1512"
tier: B
summary: "The Portuguese campaigns that forced the Swahili city-states of East Africa into tribute in the first years of the sixteenth century. The towns of the coast, Muslim trading cities from Mogadishu to Sofala, lived on the Indian Ocean trade in gold, ivory and slaves from the interior and cloth, beads and porcelain from India and beyond. Vasco da Gama found an ally in Malindi in 1498 and frightened Kilwa into paying tribute in 1502; Zanzibar was bombarded into submission in 1503. In 1505 Francisco de Almeida, sailing to India as the first viceroy, sacked Kilwa on 24 July, built a fort there and set up a ruler of his own, then stormed and burned Mombasa in August. Pêro de Anaia built a fort at Sofala, the outlet of the gold of the Zimbabwe plateau, and in 1507 the Portuguese moved their main base to Mozambique Island. Tristão da Cunha and Afonso de Albuquerque sacked Oja and Barawa in 1507, and by 1509 most towns north of Mozambique paid tribute. The Portuguese gave up their fort at Kilwa in 1512. They held the sea and a few forts, but not the coast itself: Mombasa was rebuilt and defied them again, and only Malindi stayed their constant ally."
countries: [tz, ke, mz, so]
sides:
  - id: pt
    name: Portugal and Malindi
    polities: [portugal, malindi]
    ink: green
    moves: Portuguese moves
    success: Portuguese success
  - id: sw
    name: Kilwa, Mombasa and the Swahili towns
    polities: [kilwa, mombasa, pate]
    ink: purple
    moves: Swahili moves
    success: Swahili success
notes:
  - "Almost everything known about these campaigns comes from Portuguese chroniclers and from the account of the German Hans Mayr, who sailed with Almeida; the Kilwa Chronicle and Swahili traditions say little about them. Numbers and some dates differ between the accounts: the attack on Mombasa is dated 13–15 August 1505, and the sack of Barawa April 1507."
  - "“Swahili” is used here for the Muslim, Swahili-speaking towns of the coast; the Portuguese called their people Moors. Each town had its own ruler, and they were often rivals: Malindi sided with Portugal against Mombasa and Kilwa."
