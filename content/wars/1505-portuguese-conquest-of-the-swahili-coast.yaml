  - title: Sofala and Mozambique Island
    date: 1505–1507
    when: "1505-09"
    borders: "1507-12-01"
    countries: [mz]
    body:
      - "Sofala, far to the south, was the port through which the gold of the Zimbabwe plateau reached the coast, and the Portuguese wanted that trade for themselves. In 1505 Pêro de Anaia arrived with a separate squadron and, with the leave of Sofala’s blind ruler Yusuf, who had made a treaty with Portugal in 1502, began a fort, São Caetano, in September. Relations soon broke down. Early in 1506, after an attack on the fort failed, the Portuguese entered Yusuf’s town at night and killed him, and set up one of his sons as ruler in his place."
      - "Malaria killed Anaia in March 1506 and dozens of his men by the summer, and the gold trade disappointed: traders took other routes, through Angoche and the Zambezi. In September 1507 Vasco Gomes de Abreu occupied Mozambique Island, which had a better harbour and healthier air, and built a fort, São Gabriel, there. The island became the capital of Portuguese East Africa and the stopping place of the India fleets."
    facts:
      - [Fort São Caetano at Sofala begun, "25 September 1505"]
      - [Portuguese dead of fever at Sofala, "76 by June 1506"]
      - [Mozambique Island occupied, "September 1507"]
    markers:
      - kind: taken
        side: pt
        name: Sofala
        date: 1505–1506
        text: Pêro de Anaia built Fort São Caetano here. Sofala’s ruler Yusuf was killed in early 1506 and one of his sons installed in his place.
        lonlat: [34.72, -20.17]
      - kind: taken
        side: pt
        name: Mozambique Island
        date: September 1507
        text: Occupied by Vasco Gomes de Abreu, who built Fort São Gabriel. It became the Portuguese capital in East Africa.
        lonlat: [40.735, -15.035]
      - kind: event
        side: sw
        name: Angoche
        date: 1505–1507
        text: A Swahili port to which traders turned to avoid the Portuguese at Sofala.
        lonlat: [39.91, -16.23]
        lp: l
