steps:
  - title: Almeida at Kilwa and Mombasa
    date: July – August 1505
    when: "1505-07-24"
    borders: "1505-08-15"
    countries: [tz, ke]
    body:
      - "When Vasco da Gama reached East Africa in 1498, Mombasa received him with hostility and Malindi, its rival, with a pilot for the crossing to India; Malindi stayed Portugal’s ally for a century. Pedro Álvares Cabral called at Kilwa in 1500 without result. In 1502 Gama returned with a large fleet and threatened to bombard Kilwa, the richest town of the southern coast, which controlled the gold trade of Sofala; its ruler, the emir Ibrahim, agreed to pay a yearly tribute in gold. In 1503 Rui Lourenço Ravasco seized more than twenty vessels off Zanzibar and bombarded the town until its sultan agreed to pay tribute too."
      - "Kilwa stopped paying, and in 1505 King Manuel I ordered Francisco de Almeida, the first viceroy of India, to build forts on the coast on his way east. Almeida’s ships anchored off Kilwa on 22 July. On 24 July about 500 men landed in two columns under Almeida and his son Lourenço and fought their way through the town to the palace; Ibrahim escaped with his household, and the town was plundered. Almeida set up Muhammad Arcone (Muhammad ibn Rukn ad-Din), a Kilwa notable who had sided with the Portuguese, as ruler and vassal, and began a fort, Santiago, the next day."
      - "On 13 August the fleet reached Mombasa, the strongest town of the coast. Its bastion at the harbour mouth fired on the ships and was silenced, and the sultan answered Almeida’s demands with defiance; a Spanish gunner who had settled in the town warned the Portuguese that it would not be easily taken. On 15 August the Portuguese landed in two squadrons and took the town after fighting in its narrow streets. The sultan and many townspeople fled to the palm groves on the mainland. The Portuguese, who lost few men, plundered Mombasa, burned the ships in the harbour and set fire to the town, then sailed to Malindi, whose ruler welcomed the ruin of his rival."
    facts:
      - [Almeida’s ships, "8 at Kilwa, 13 at Mombasa"]
      - [Sack of Kilwa, "24 July 1505"]
      - [Sack of Mombasa, "13–15 August 1505"]
