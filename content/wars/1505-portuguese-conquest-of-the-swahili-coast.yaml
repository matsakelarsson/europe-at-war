  - title: Oja, Barawa and the end of the Kilwa garrison
    date: 1506–1512
    when: "1507-04"
    borders: "1512-12-31"
    countries: [ke, so, tz]
    body:
      - "In May 1506 Muhammad Arcone, the ruler the Portuguese had set up at Kilwa, was lured away and killed by a rival chief, and Kilwa’s politics turned against its occupiers. Further north, Tristão da Cunha’s fleet, with Afonso de Albuquerque, came to the aid of Malindi in February 1507: the Portuguese sacked Oja, near the mouth of the Tana, which had refused to submit, and Lamu agreed to pay tribute without a fight. In April 1507 they summoned Barawa, a walled town of the Benadir coast, to submit; when it refused they breached its wall, sacked it and burned it after hard fighting. They sailed on past Mogadishu, which was too strong for them, and on to Socotra."
      - "In 1509 Duarte de Lemos made Mafia, Zanzibar and Pemba pay tribute. By then most of the towns between Mozambique and Barawa had accepted Portuguese overlordship, but it rested on the threat of the fleets rather than on garrisons. The fort at Kilwa cost more than it earned, and in 1512 the Portuguese abandoned it. Malindi stayed loyal, while Mombasa recovered and was sacked again in 1528. The coming of the Portuguese disrupted the trade on which the towns lived, but did not end it; their hold on the northern coast was challenged by the Ottomans in the 1580s and ended by Oman in 1698."
    facts:
      - [Oja sacked, Lamu submits, "February 1507"]
      - [Sack of Barawa, "April 1507"]
      - [Portuguese leave Kilwa, "1512"]
    markers:
