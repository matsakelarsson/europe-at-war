id: portuguese-conquest-of-hormuz
name: Portuguese conquest of Hormuz
start: "1507-08"
end: "1515-12"
tier: B
summary: Afonso de Albuquerque’s campaigns to bring the island kingdom of Hormuz, which controlled the trade between India, Persia and Arabia at the mouth of the Persian Gulf, under Portuguese control. In 1507 his small squadron sacked Qurayyat, Muscat and Khor Fakkan on the Omani coast, a dependency of Hormuz, and forced the king of Hormuz to accept Portuguese overlordship, but the mutiny of his captains forced him to leave early in 1508. In 1515 he returned with a larger fleet, had the strongman of Hormuz killed and built a fortress there. Hormuz, with the ports of Oman, stayed a Portuguese protectorate until 1622.
countries: [om, ae, ir]
