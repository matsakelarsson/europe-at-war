        via: [[59.85, 22.6], [58.75, 23.72], [56.95, 24.6], [56.72, 26.3], [56.52, 26.98]]
  - title: Hormuz taken
    date: March – December 1515
    when: "1515-03"
    borders: "1515-04-01"
    countries: [ir, om, bh]
    body:
      - Albuquerque became governor of Portuguese India in 1509 and took Goa in 1510 and Malacca in 1511, but failed to take Aden in 1513. In Hormuz, meanwhile, Khwaja Ata had died, King Sayf al-Din had been poisoned and replaced by his brother Turan Shah, and real power had passed to Rais Ahmad, who ruled by terror. In March 1515 Albuquerque returned with 27 ships, about 1,500 Portuguese soldiers and 700 from Malabar. Turan Shah, who hoped for help against Rais Ahmad, let him land without a fight, and on 1 April the Portuguese flag was raised over the island.
      - A few weeks later Albuquerque had Rais Ahmad stabbed to death by his captains at a meeting in the king’s presence. He built the fortress of Our Lady of the Conception on the northern tip of the island, with a garrison of 400, and left the king on his throne as a disarmed vassal paying tribute; he also received an envoy of Shah Ismail of Persia with great ceremony. Albuquerque fell ill and died off Goa on 16 December 1515. Hormuz, with the ports of Oman that depended on it, stayed a Portuguese protectorate for more than a century. Revolts in Hormuz in 1521, Sohar in 1523 and Muscat and Qalhat in 1526 were put down, and in 1521 the Portuguese conquered Bahrain for the king of Hormuz.
    facts:
      - [Portuguese land at Hormuz, "1 April 1515"]
      - [Garrison of the new fortress, "400 men"]
      - [Death of Albuquerque, "16 December 1515"]
    markers:
      - kind: taken
        side: pt
        name: Hormuz
        date: 1 April 1515
        text: The king, Turan Shah, let the Portuguese land and take possession of the island without bloodshed. Their fortress was built on its northern tip.
        lonlat: [56.46, 27.1]
      - kind: held
        side: pt
        name: Muscat
        date: 1515–1650
        text: Muscat and the other Omani ports stayed under Hormuz and the Portuguese. After Hormuz fell in 1622, Muscat became the main Portuguese base in the Gulf.
        lonlat: [58.59, 23.62]
      - kind: taken
        side: pt
        name: Bahrain
        date: "1521"
        text: When the ruler of Bahrain refused tribute to Hormuz, António Correia conquered the islands with 400 Portuguese and some 3,000 Hormuzi and Arab soldiers.
        lonlat: [50.58, 26.2]
