notes:
  - The Portuguese chroniclers, above all Albuquerque’s son Brás, are the main sources; Hormuzi and Persian accounts are few. Albuquerque’s own letters give the Hormuzi fleet of 1507 as 50–60 large ships and some 120–200 rowing boats.
