steps:
  - title: The Omani coast and Hormuz
    date: August 1507 – February 1508
    when: "1507-08-22"
    borders: "1507-10-10"
    countries: [om, ae, ir]
    body:
      - King Manuel I of Portugal meant to control the trade of the Indian Ocean by seizing its gateways, Aden at the mouth of the Red Sea, Hormuz at the mouth of the Persian Gulf and Malacca. In 1507 a fleet under Tristão da Cunha took the island of Socotra. Afonso de Albuquerque stayed behind with six ships and, short of food, sailed in August for the Strait of Hormuz. The towns of the Omani coast were then governed for the king of Hormuz. Qalhat gave him supplies; Qurayyat resisted and was stormed and sacked; at Muscat the governor offered to surrender but the garrison fought, and the town was sacked as well. Sohar submitted without a fight and was spared, and Khor Fakkan was sacked.
      - On 25 September Albuquerque anchored before Hormuz, a rich island city that lived on the trade between India, Persia and Arabia. It was ruled for its fifteen-year-old king, Sayf al-Din, by the vizier Khwaja Ata, who refused to submit and gathered a large fleet in the harbour. The Portuguese guns sank or burnt many of the ships and Albuquerque set fire to the shipyards, and the vizier asked for terms. On 10 October the king agreed to become a vassal of Portugal, to pay a yearly tribute of 15,000 ashrafis and to allow a fortress on the island. But Albuquerque’s captains resented staying in the heat with so few men; three of them sailed off to India in January 1508, and on 8 February Albuquerque too had to leave.
    facts:
      - [Muscat sacked, "August 1507"]
      - [Hormuz accepts Portuguese overlordship, "10 October 1507"]
      - [Albuquerque leaves Hormuz, "8 February 1508"]
