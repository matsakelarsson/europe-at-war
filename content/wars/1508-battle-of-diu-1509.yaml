notes:
  - The accounts are mostly Portuguese (Castanheda, Correia, Barros and Almeida’s own letters), with the Arabic history of Ibn Iyas in Cairo and the Tuhfat al-Mujahidin from Malabar. The numbers of ships, men and dead differ widely between them.
  - Diu was ruled for the sultan of Gujarat by Malik Ayaz, a former slave who had risen in the sultan’s service. He kept most of his own fleet out of the main fight at Diu and made peace with the Portuguese immediately afterwards.
