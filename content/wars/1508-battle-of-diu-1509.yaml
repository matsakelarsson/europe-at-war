  - title: The battle off Diu
    date: December 1508 – February 1509
    when: "1509-02-03"
    borders: "1509-02-03"
    countries: [in, pt, eg]
    body:
      - The viceroy Francisco de Almeida, who would not give up his office to his appointed successor, Afonso de Albuquerque, until he had avenged his son, sailed north in December 1508 with 18 ships, about 800 Portuguese and some 400 Nair soldiers from Cochin. On the way he sacked the port of Dabhol, whose people had killed a Portuguese captain, and burned the town. On 2 February 1509 he reached Diu, where the Mamluk ships lay at anchor near the shore with the Gujarati fleet and the boats of Calicut.
      - On 3 February the Portuguese attacked. Their carracks fired low, so that the shot skipped across the water into the enemy hulls, and their boarding parties took the Mamluk ships one by one. Malik Ayaz kept most of his ships out of the fight, and the Calicut boats withdrew when they could not get through. By nightfall the Mamluk fleet was sunk or taken. The Portuguese lost 32 killed and about 300 wounded; their opponents lost perhaps 1,300 Gujaratis and over 400 Mamluks. Almeida had most of his Mamluk prisoners put to death. Malik Ayaz gave back the prisoners from Chaul and made peace, and in November Almeida handed over to Albuquerque. No fleet seriously challenged the Portuguese in the Arabian Sea until the Ottomans besieged Diu in 1538.
