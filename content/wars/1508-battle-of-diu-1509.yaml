steps:
  - title: The Mamluk fleet and Chaul
    date: 1507–1508
    when: "1508-03"
    borders: "1508-03"
    countries: [in, eg]
    body:
      - The Portuguese attacks on Indian shipping hurt the Mamluk sultan Qansuh al-Ghawri, whose treasury lived on the customs of the spice trade through the Red Sea to Egypt, and the Venetians who bought the spices at Alexandria. Calicut and Gujarat asked him for help, and he had a war fleet built at Suez. It sailed in February 1507 under Amir Husain al-Kurdi, with six round ships, six great galleys and about 1,500 fighting men, spent months putting down trouble at Jeddah and reached Diu in 1508. There Malik Ayaz, governor of the port for the sultan of Gujarat, joined it with his light ships.
      - In March 1508 the allies found Lourenço de Almeida, the viceroy’s son, with a small squadron in the harbour of Chaul, south of Bombay. After two days of fighting the Portuguese tried to break out. Lourenço’s flagship ran onto fishing stakes in the river mouth, was cut off and sunk, and he was killed; his body was never found. It was the first Portuguese defeat at sea in the Indian Ocean, but it was costly for the victors, and by one account Husain lost 600 to 700 of his 800 soldiers.
    facts:
      - [Mamluk fleet sails from Suez, "February 1507"]
      - [Battle of Chaul, "March 1508, Mamluk and Gujarati victory"]
      - [Killed, "Lourenço de Almeida"]
