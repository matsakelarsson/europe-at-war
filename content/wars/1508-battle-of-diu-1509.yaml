id: battle-of-diu-1509
name: Battle of Diu (1509)
start: "1508-03"
end: "1509-02-03"
tier: B
summary: "The naval war of 1508–1509 in which Portugal destroyed the fleet that the Mamluk sultan of Egypt, Qansuh al-Ghawri, had sent to India to break the Portuguese hold on the spice trade. Joined at Diu by the ships of Malik Ayaz, governor for the sultan of Gujarat, and supported by Calicut, the Mamluk fleet under Amir Husain al-Kurdi trapped a Portuguese squadron at Chaul in March 1508 and killed its commander Lourenço de Almeida, son of the viceroy. On 3 February 1509 the viceroy Francisco de Almeida took his revenge off Diu, where his carracks’ guns and boarding parties destroyed the Mamluk ships. The victory gave Portugal the mastery of the Arabian Sea for decades."
