  - title: The war of 1511 and Yagüecas
    date: "late 1510 – 1511"
    when: "1511"
    borders: "1511-06"
    countries: [pr, es]
    body:
      - "Agüeybaná II and his caciques met in secret, at areítos, to plan a rising. The chroniclers tell how they first tested whether the Spaniards could die: Urayoán, cacique of Yagüeca in the west, had his men carry a young Spaniard, Diego Salcedo, across the Guaorabo (Añasco) river and hold him under the water, then watched his body for days until they were sure he would not rise. Warned by his interpreter Juan González and by Agüeybaná’s sister, Sotomayor set out for Caparra with Taíno carriers, but warriors led by Agüeybaná II caught up with him and killed him and his companions, while Guarionex of Otoao burned Sotomayor’s settlement and killed many of its people. González escaped wounded to raise the alarm."
      - "Ponce de León gathered about a hundred men and struck at the caciques one by one: at Agüeybaná’s lands in the south in February 1511 and at Urayoán’s at Yagüeca in March. The decisive battle came at Yagüecas, where the chroniclers set some 11,000 to 15,000 Taíno against 80 to 100 Spaniards. Before it, a Spanish arquebusier shot a man wearing the gold medallion of a high chief; the traditional account holds that this was Agüeybaná II, and that the Taíno, seeing him fall, withdrew. Later documents still mention him, and some historians think he escaped and fought on, perhaps from Guadeloupe, where he was reported in the following years. In November 1511 the Crown restored Juan Cerón as governor under Diego Colón, and Ponce de León turned to exploration, reaching Florida in 1513."
    facts:
