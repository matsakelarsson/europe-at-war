  - title: Slave raids, the burning of Caparra and the flight east
    date: "1512–1515"
    when: "1513"
    borders: "1513-06"
    countries: [pr, vi, es]
    body:
      - "Royal orders allowed the Spaniards to enslave Taíno taken in war, and in 1512 Cerón, Díaz and their captains rode out on eighteen raids against the lands of Agüeybaná II, Orocobix, Guayama, Humacao and a cacique the Spaniards called Alonso in the mountains of Otoao; captives were branded on the forehead and sold, many at San Germán. The raids grew to twenty-three in 1513. The Taíno answered with a war of movement, crossing to and from the smaller islands by canoe. Fighters from Vieques and Saint Croix, whom older histories call Caribs (Kalinago) but Jalil Sued Badillo sees as Taíno allies and refugees, fought alongside them, and in 1513, while Viceroy Colón was on the island, the warriors of the belligerent caciques burned Caparra, Ponce de León’s house among it; older historians blamed Carib raiders, but the eyewitnesses blamed the caciques."
      - "Spanish columns pushed into the Daguao in the east in 1514–1515, and many Taíno fled to the Lesser Antilles, from where raids on the island went on until 1529. Others ran from the encomiendas into the mountains. Smallpox reached the island in 1519, and a census of 1530 counted 1,148 Taíno. The Spaniards turned to enslaved Africans, the first of whom had arrived in 1513, but Taíno ancestry, words and customs survived in Puerto Rico’s rural population."
    facts:
