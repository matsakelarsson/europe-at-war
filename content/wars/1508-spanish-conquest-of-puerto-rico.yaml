notes:
  - "The war is known from Spanish chroniclers (Gonzalo Fernández de Oviedo, Bartolomé de las Casas, Antonio de Herrera, Juan de Castellanos) and from letters and lawsuits in the Archive of the Indies; the chroniclers contradict one another, and the story of Diego Salcedo’s drowning, like the numbers at Yagüecas, comes from them alone."
  - "Salvador Brau’s nineteenth-century account, which made the death of Agüeybaná II at Yagüecas in 1511 the end of the war, long shaped Puerto Rican history. Historians since Salvador Tío in the 1950s and 1960s, and above all Jalil Sued Badillo (2008), have pointed to documents from 1512–1518 that still name him, and see the war as a longer struggle lasting into the 1520s."
  - Estimates of the Taíno population of Puerto Rico in 1508 range from about 30,000 to 60,000 or more.
