steps:
  - title: Ponce de León and Agüeybaná
    date: "1508–1510"
    when: "1508"
    borders: "1509-08-14"
    countries: [pr, es]
    body:
      - "Columbus passed the island on his second voyage in November 1493 and named it San Juan Bautista, but no Spaniard settled there for fifteen years. Its Taíno called it Borikén. The most powerful of their caciques was Agüeybaná, whose lands lay in the fertile south around Guaynía and the Cayabo; caciques across the island, from Urayoán in the west to Caguax and Jumacao in the east, followed him in war. Having heard what had happened on Hispaniola, Agüeybaná, on his mother’s advice according to the chroniclers, chose to receive the Spaniards in peace."
      - "In 1508, with the Crown’s permission and under Governor Ovando, Juan Ponce de León crossed from Higüey with about fifty men in one ship. Agüeybaná exchanged names with him in the guaytiao, a ritual of brotherhood, and Ponce de León founded Caparra, a fortified house and storehouse a few kilometres inland from San Juan Bay, and found gold in the rivers. Appointed governor in 1509, he brought his family over and divided the Taíno among himself and the colonists in encomiendas to wash gold and grow food. Cristóbal de Sotomayor, a nobleman bound to Agüeybaná’s family by the same ritual, founded a settlement in the south-west. Hunger, overwork and the seizure of Taíno land and labour bred anger, and Viceroy Diego Colón in Santo Domingo disputed Ponce de León’s right to govern. Agüeybaná died in 1510, and his brother, known as Agüeybaná II, succeeded him."
    facts:
      - [Ponce de León’s expedition, "1508, about 50 men"]
      - [Caparra founded, "1508"]
      - [Ponce de León confirmed as governor, "14 August 1509"]
