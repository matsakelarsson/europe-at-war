id: spanish-conquest-of-puerto-rico
name: Spanish conquest of Puerto Rico
start: "1508"
end: "1515"
tier: B
summary: "The conquest of Borikén, the island the Spaniards called San Juan Bautista and later Puerto Rico, and the Taíno war against it. In 1508 Juan Ponce de León, a veteran of the conquest of Higüey, came from Hispaniola with about fifty men, was received by the high chief Agüeybaná, who exchanged names with him in the guaytiao ritual, and founded Caparra near San Juan Bay. As governor from 1509 he divided the Taíno among the colonists in encomiendas to work the gold placers. After Agüeybaná’s death in 1510 his brother Agüeybaná II formed an alliance of caciques; according to the chroniclers, Urayoán’s men drowned a Spaniard, Diego Salcedo, to prove that the newcomers were mortal. Early in 1511 the Taíno killed Cristóbal de Sotomayor and burned his settlement, and Ponce de León answered with campaigns in the south and west that culminated in a battle at Yagüecas, where by the traditional account Agüeybaná II was shot dead. Some historians, citing later documents, think he survived and fought on. Under Juan Cerón and Miguel Díaz the Spaniards carried out dozens of slave raids in 1512–1513, while the Taíno and their Kalinago allies burned Caparra in 1513 and fought on from the east of the island and the neighbouring islands into the 1520s. A census of 1530 counted 1,148 Taíno on the island."
countries: [pr, es]
sides:
  - id: cas
    name: Crown of Castile (Juan Ponce de León, Juan Cerón and Miguel Díaz)
    polities: [castile, puerto-rico]
