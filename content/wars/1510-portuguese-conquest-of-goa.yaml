notes:
  - The figures come from Albuquerque’s letters and the Portuguese chroniclers, chiefly his son Brás de Albuquerque and Gaspar Correia. Albuquerque spared the Hindu population and later relied on them; Timoji was made the first chief of the Hindu community under Portuguese rule.
