id: portuguese-conquest-of-goa
name: Portuguese conquest of Goa
start: "1510-02-16"
end: "1510-11-25"
tier: C
summary: "The capture of Goa, the main port of the Bijapur Sultanate on India’s west coast, by Afonso de Albuquerque, governor of Portuguese India. Encouraged by Timoji, a Hindu privateer, and taking advantage of the recent death of Bijapur’s founder, Yusuf Adil Shah, Albuquerque sailed into the Mandovi river and took the fort of Pangim on 16 February 1510; the next day he occupied Goa without a fight. In May the new sultan, Ismail Adil Shah, sent an army of tens of thousands under Pulad Khan across the Banastarim ford, and on 31 May the Portuguese abandoned the city, killing many of its Muslim inhabitants as they left. Trapped at the river mouth by the monsoon, they sailed south in August. On 25 November 1510, St Catherine’s Day, Albuquerque returned with about 1,700 men and 34 ships and stormed Goa. The Portuguese lost about 50 dead; Albuquerque himself wrote that some 6,000 Muslim defenders and townspeople were killed. Bijapur tried to retake Goa in 1511–1512 and failed. It became the capital of Portuguese India in 1530 and stayed Portuguese until India annexed it in 1961."
