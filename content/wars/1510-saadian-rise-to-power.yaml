steps:
  - title: Holy war in the Sous
    date: 1510–1525
    when: "1510"
    borders: "1525-06-01"
    countries: [ma]
    body:
      - In the early 16th century the Wattasid sultans of Fez had little power south of the Oum er-Rbia. The south was divided between tribal confederations, local lords such as the Hintata emirs of Marrakesh, and the Portuguese, who had built forts at Santa Cruz do Cabo de Gué (Agadir) in 1505 and at Safi and raided the plains around them. Sufi brotherhoods, above all the followers of the 15th-century mystic al-Jazuli, preached holy war against the Christians. In 1510, at Tidsi in the Sous valley near Taroudant, the tribes and Sufi groups of the Sous recognised Muhammad al-Qa’im, the head of a family of sharifs that had come from the Draa valley, as their war leader.
      - In 1513 al-Qa’im moved north of the Atlas to Afughal in the Haha, where al-Jazuli was buried, and left his elder son Ahmad al-Araj in charge of the Sous. In 1515 the Saadians helped the Hintata defend Marrakesh against the Portuguese. When al-Qa’im died in 1517 and was buried beside al-Jazuli, Ahmad al-Araj took the lands north of the Atlas and his younger brother Muhammad al-Shaykh the Sous. Ahmad married the daughter of the Hintata lord of Marrakesh, Bu Shantuf; later he had him killed, and in 1524 or 1525 he took the city’s kasbah and made Marrakesh the Saadian capital, moving the remains of his father and of al-Jazuli there.
    facts:
      - [Muhammad al-Qa’im recognised as war leader, "1510"]
      - [Death of al-Qa’im, "1517"]
      - [Marrakesh taken, "1524 or 1525"]
