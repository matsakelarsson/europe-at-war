  - title: Fez, Tlemcen and the Ottomans
    date: 1547–1554
    when: "1549-01"
    borders: "1554-09-30"
    countries: [ma, dz]
    body:
      - In 1547 Muhammad al-Shaykh laid siege to Fez, and on 28 January 1549 the city surrendered, leaving him sole ruler of Morocco; Portugal gave up Ksar es-Seghir and Asilah in 1549–1550. In June 1550 his son Muhammad al-Harran marched east and took Tlemcen from its Zayyanid sultan. Al-Harran died of illness there, and in February 1551 an Ottoman army sent from Algiers by its beylerbey Hasan Pasha, Hayreddin Barbarossa’s son, defeated the Saadians in the Chelif valley and drove them out of Tlemcen.
      - In 1552 Suleiman the Magnificent sent an embassy demanding that the Saadian sultan accept Ottoman overlordship, which he refused. In January 1554 Salah Rais, the beylerbey of Algiers, invaded Morocco, defeated the Saadians, took Fez and installed Ali Abu Hassun, the last of the Wattasids, as a vassal of the sultan. Once the Ottoman army had gone home, Muhammad al-Shaykh struck back. He defeated Abu Hassun, who was killed, in a battle usually placed near Tadla, and in September 1554 he entered Fez again. The Wattasid dynasty was at an end, and the Saadians, seeking Spanish help against the Ottomans, ruled Morocco for the rest of the century; in October 1557 Muhammad al-Shaykh was murdered by Turkish soldiers of his guard, reportedly on the orders of Hasan Pasha.
    facts:
      - [Fez taken by the Saadians, "28 January 1549"]
      - [Tlemcen taken and lost, "June 1550 – February 1551"]
      - [Fez taken by Salah Rais, "January 1554"]
      - [Fez retaken by Muhammad al-Shaykh, "September 1554"]
