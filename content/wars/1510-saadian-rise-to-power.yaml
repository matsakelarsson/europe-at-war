id: saadian-rise-to-power
name: Saadian rise to power
start: "1510"
end: "1554-09"
tier: B
summary: "The rise of the Saadians, a family of sharifs (descendants of the Prophet) from the Draa valley, from leaders of the holy war against the Portuguese in the Sous to rulers of all Morocco. Recognised as war leader by the tribes and Sufi brotherhoods of the Sous in 1510, Muhammad al-Qa’im left the movement to his sons Ahmad al-Araj and Muhammad al-Shaykh, who took Marrakesh in 1524 or 1525. After the treaty of Tadla (1527) Morocco was divided between them and the Wattasid sultans of Fez, until the Saadians routed the Wattasids in 1536. In 1541 Muhammad al-Shaykh took the Portuguese fortress at Agadir, which made his name and led Portugal to abandon Safi and Azemmour; he then pushed his brother aside and in January 1549 took Fez. His attempt to take Tlemcen in 1550 brought him into conflict with the Ottomans of Algiers, who drove his army out in 1551 and in January 1554 took Fez and restored the Wattasid Abu Hassun. Muhammad al-Shaykh defeated and killed Abu Hassun and retook Fez in September 1554, ending the Wattasid dynasty."
countries: [ma, dz]
