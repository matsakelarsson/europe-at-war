  - title: Two sultans in Morocco
    date: 1526–1543
    when: "1527"
    borders: "1541-12-01"
    countries: [ma]
    body:
      - The Wattasid sultan Ahmad tried to win back Marrakesh, but his siege of the city in 1527 failed, and the two sides agreed at Tadla to divide Morocco roughly along the Oum er-Rbia, with the Saadians ruling the south. The peace did not last. A Wattasid attack at Animay near Demnate failed in 1529, and in 1536 the Saadians routed the Wattasid army at the Wadi al-Abid, which won them recognition of their rule in the south; in 1537 they took the Tafilalt.
      - Muhammad al-Shaykh, who held the Sous, turned against the Portuguese. After a failed attempt in 1533 he besieged Santa Cruz do Cabo de Gué again and took it in 1541, after a siege of about six months. The victory gave him great prestige as a fighter of the holy war, and Portugal evacuated Safi and Azemmour the same year. The brothers then fell out. Muhammad imprisoned Ahmad, made an agreement with him in 1542 and defeated him in open war in 1543, sending him into exile in the Tafilalt.
    facts:
      - [Treaty of Tadla, "1527"]
      - [Wattasids routed at the Wadi al-Abid, "1536"]
      - [Agadir taken from Portugal, "1541"]
      - [Ahmad al-Araj defeated by his brother, "1543"]
