notes:
  - The main sources are Moroccan chronicles, such as al-Ifrani’s Nuzhat al-hadi (early 18th century), and Portuguese and Spanish reports from the coastal forts. They disagree on several dates; the quarrel between the two Saadian brothers, for example, is dated to 1542–1543 in some accounts and to 1539–1540 by the historian Jamil Abun-Nasr.
  - The Saadian state is called Morocco on the map once it holds Marrakesh. Its full story, from Alcácer Quibir (1578) and the conquest of Songhai (1591) to the civil war after 1603, has its own entries.
