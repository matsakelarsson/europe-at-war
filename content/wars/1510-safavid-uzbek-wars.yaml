id: safavid-uzbek-wars
name: Safavid–Uzbek wars
start: "1510"
end: "1598-08"
tier: B
summary: The long struggle for Khorasan between Safavid Persia and the Shaybanid Uzbeks of Bukhara, which began when Shah Ismail I defeated and killed Muhammad Shaybani at Merv in 1510. The Uzbeks raided and besieged Herat, Mashhad and Astarabad again and again whenever Persia was weak or busy fighting the Ottomans. The young Shah Tahmasp beat Ubaydullah Khan at Jam in 1528, but in 1588–1589 Abdullah Khan II took Herat and his son sacked Mashhad, and the Uzbeks held most of Khorasan for a decade. After Abdullah’s death Shah Abbas I won it back with his reformed army, retaking Mashhad and defeating the Uzbeks outside Herat in August 1598.
countries: [ir, af, tm, uz]
sides:
  - id: saf
    name: Safavid Persia
    polities: [persia]
    ink: green
    moves: Safavid moves
    success: Safavid success
  - id: uz
    name: Uzbeks (Shaybanids of Bukhara)
    polities: [bukhara]
    ink: gold
    moves: Uzbek moves
    success: Uzbek success
notes:
  - The Battle of Merv (1510) and the Uzbek victory at Ghazdewan (1512) are told in the stories of the Safavid conquest of Iran and the Shaybanid–Timurid wars.
  - The chroniclers’ army sizes are not reliable; for Jam they give the Uzbeks well over 100,000 men, which modern historians do not accept.
