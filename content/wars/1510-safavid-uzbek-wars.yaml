steps:
  - title: Jam
    date: 1524–1530
    when: "1528-09-24"
    borders: "1528-09-24"
    countries: [ir, af]
    body:
      - After Ismail I died in 1524, his ten-year-old son Tahmasp came to the throne, and the Qizilbash tribal chiefs fought each other for power. The Uzbek khan of Bukhara, Ubaydullah, a nephew of Muhammad Shaybani, used the chaos to invade Khorasan year after year. In 1528 he took Astarabad and Tus near Mashhad and laid siege to Herat, where Safavid princes were traditionally brought up.
      - Tahmasp, aged fourteen, led an army east and met the Uzbeks at Jam, between Mashhad and Herat, on 24 September 1528. The Safavids fought in the Ottoman manner, with cannon and musketeers behind a line of chained wagons. The Uzbek wings at first broke the Safavid flanks, but the centre held and a counter-attack routed Ubaydullah, who was wounded. The victory did not last. A revolt in Baghdad drew Tahmasp west, the Uzbeks returned, and Herat surrendered in exchange for safe passage; only in late 1530 were the Uzbeks driven out again. Their raids into Khorasan went on for most of the century.
    facts:
      - [Battle of Jam, "24 September 1528, Safavid victory"]
      - [Uzbek commander, "Ubaydullah Khan of Bukhara"]
