  - title: Abbas wins back Khorasan
    date: April – August 1598
    when: "1598-08-09"
    borders: "1598-09"
    countries: [ir, af]
    body:
      - Abdullah Khan died early in 1598 and Abd al-Mumin was murdered by his own men a few months later, leaving the Uzbeks divided. In April Abbas marched east with his new army and retook Mashhad without a fight. The Uzbek commander Din Muhammad Khan held Herat. Abbas drew him out of the city by pretending to retreat, and on 9 August 1598 defeated him at Rabat-i Pariyan, near Herat. Din Muhammad was wounded and killed by his own followers during the flight, and Herat surrendered.
      - The victory gave Persia most of Khorasan, with Herat, for more than a century. Abbas pushed on to Balkh in 1601–1602 but was beaten there by Baqi Muhammad Khan, the first of the new Janid (Ashtarkhanid) dynasty of Bukhara, and the frontier settled roughly where it had been under Tahmasp. Abbas restored the shrine of Imam Reza and in 1601 walked from Isfahan to Mashhad as a pilgrim.
    facts:
      - [Mashhad retaken, "1598"]
      - [Battle of Rabat-i Pariyan, "9 August 1598, Safavid victory"]
    markers:
      - kind: taken
        side: saf
        name: Mashhad
        date: "1598"
        text: Retaken by Abbas without resistance at the start of the campaign.
        lonlat: [59.6, 36.3]
      - kind: battle
        side: saf
        name: Rabat-i Pariyan
        date: 9 August 1598
        text: Fought near Herat after a feigned Safavid retreat drew the Uzbeks out of the city. Din Muhammad Khan was wounded and later killed by his own men.
        lonlat: [62.1, 34.36]
        lp: b
