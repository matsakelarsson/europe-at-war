  - title: Herat and Mashhad fall
    date: 1587–1590
    when: "1588"
    borders: "1590"
    countries: [ir, af]
    body:
      - After Tahmasp’s death in 1576 Persia fell back into civil war, and from 1578 the Ottomans conquered its north-western provinces. The Uzbeks had a new leader in Abdullah Khan II, who had united the Shaybanid lands of Bukhara, Samarkand, Tashkent and Balkh and taken Badakhshan in 1584. In 1588 he besieged Herat, held by Ali Quli Khan Shamlu, who had been the guardian of the young prince Abbas. Abbas, just placed on the throne by a coup, could not relieve the city. Herat fell early in 1589 after a long siege, and Ali Quli Khan was killed.
      - In 1589 Abdullah’s son Abd al-Mumin took Mashhad, plundered the shrine of Imam Reza and killed many of the townspeople and pilgrims. The Uzbeks went on to overrun most of Khorasan. Abbas, unable to fight on two fronts, made peace with the Ottomans in 1590 on very hard terms and spent the next years rebuilding his army around regiments of slave soldiers (ghulams) and musketeers.
    facts:
      - [Herat taken by the Uzbeks, "early 1589, after a siege of many months"]
      - [Mashhad sacked, "1589"]
