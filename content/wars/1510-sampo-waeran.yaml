notes:
  - Dates are lunar months from the Annals of the Joseon Dynasty. Japanese sources number the force of 1510 at about 4,500; Korean accounts give 4,000–5,000.
  - The raiders of 1555 are described in Korean records as Japanese; they came at the height of the largely Chinese-led wokou raids on the Ming coast (see the Jiajing wokou raids).
