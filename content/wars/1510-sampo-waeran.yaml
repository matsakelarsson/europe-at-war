id: sampo-waeran
name: Revolt of the three ports (Sampo waeran)
start: "1510-04"
end: "1555-06"
tier: C
summary: "A revolt by the Japanese living in the three Korean ports open to Japanese trade, and the later clashes that grew out of it. From the early fifteenth century Joseon allowed Japanese ships to trade only at Busanpo (Busan), Jepo (Naeipo, in today’s Changwon) and Yeompo (Ulsan). Japanese from Tsushima settled there in growing numbers, from 206 in 1436 to more than 3,000 by 1494, while Joseon restricted the trade and from 1506 under King Jungjong enforced its laws strictly. In 1510, after Korean officials killed Japanese fishermen as suspected raiders, the residents rose on the fourth day of the fourth month with reinforcements from Tsushima under a member of the Sō family, about 4,500 men in all. They took the forts at Busanpo, killing its commander, and Jepo, capturing its commander, and attacked Dongnae and Ungcheon. Joseon troops retook Jepo on the nineteenth day of the month and the Japanese withdrew to Tsushima; a second landing at the end of the sixth month was beaten off. Relations were broken off until the Treaty of Imsin of 1512 reopened Jepo alone and halved the Sō’s trading ships. In the fourth month of 1544 some twenty Japanese ships raided the fort of Saryangjin (in today’s Tongyeong), and Joseon again cut off relations until 1547, when trade was limited to Busanpo. In the fifth month of 1555 a raiding fleet of more than seventy ships attacked Dalyangpo in Haenam and the forts of the south-west coast. Ten forts fell and the Jeolla army commander Won Jeok was killed before Yi Jun-gyeong’s army drove the raiders off, and an attack on Jeju was repulsed. After this Eulmyo incident Joseon made its Border Defence Council (Bibyeonsa) permanent."
