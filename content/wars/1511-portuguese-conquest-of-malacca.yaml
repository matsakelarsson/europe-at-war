steps:
  - title: Sequeira, Albuquerque and the fall of the city
    date: September 1509 – August 1511
    when: "1511-07"
    borders: "1511-08-24"
    countries: [my, id, pt]
    body:
      - Malacca was a city of perhaps 40,000 people, with merchant communities from Gujarat, the Coromandel Coast, Java, China, Pegu, Siam and the Ryukyus, but it had no walls, only temporary stockades, and it depended on rice brought by sea from Java, Siam and Pegu. King Manuel I of Portugal, whose captains had reached India in 1498, wanted to control the spice trade at its gateways. In September 1509 a squadron under Diogo Lopes de Sequeira arrived and was allowed to open a trading post. The Gujarati and Javanese merchants persuaded Sultan Mahmud Shah and his chief minister that the newcomers were a threat, and the Malaccan fleet attacked the Portuguese ships. Sequeira escaped to India, leaving about twenty men behind as prisoners.
      - Afonso de Albuquerque, governor of Portuguese India, who had taken Goa in 1510, sailed from Cochin in April 1511 with 18 ships and about 700 Portuguese and 300 Malabari soldiers, by the figures in his letters. He reached Malacca on 1 July and demanded the release of the prisoners. The sultan, playing for time, strengthened the city with the help of Gujarati, Javanese, Turkish and Persian soldiers and gunners; his son-in-law, the sultan of Pahang, was in the city for his wedding with his men. In mid-July the Portuguese burned houses along the shore and the Gujarati ships in the harbour, and the prisoners were freed, but Mahmud refused Albuquerque’s demands for compensation and a site for a fortress.
      - At dawn on 25 July the Portuguese landed on both sides of the bridge over the Malacca river, the key to the city. The sultan, his son Alauddin and the sultan of Pahang led a charge of war elephants, which was turned back, and by midday the bridge was taken, but Albuquerque, short of supplies, withdrew at nightfall and burned the palace and the mosque. A second assault in August took and fortified the bridge, and the fleet bombarded the town for ten days. The Peguan, Chinese and Hindu communities, led by the merchant Nina Chatu, came to terms with the Portuguese, and on 24 August Albuquerque’s columns cleared the streets; the sultan withdrew inland with his treasure and his remaining men. For three days the Portuguese plundered the city, sparing the houses of those who had come over to them, and Albuquerque began a stone fortress, A Famosa, built partly with stone from the mosque and from old tombs. The Portuguese reported 28 dead of their own; many defenders and townspeople were killed.
    facts:
      - [Sequeira’s mission attacked, "September 1509"]
      - [Albuquerque’s force, "18 ships, about 1,000 men (his figures)"]
      - [City taken, "24 August 1511"]
