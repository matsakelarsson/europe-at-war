  - title: The sultan’s war from Muar and Bintan
    date: 1512–1526
    when: "1513"
    borders: "1526"
    countries: [my, id, sg, pt]
    body:
      - After Albuquerque left in January 1512, Mahmud Shah’s men raided the city from his camp on the Muar, until in May the Portuguese, with some 2,000 local allies, drove him out. He went to Pahang and sent an envoy to the Ming court, to which Malacca had sent tribute, to ask for help; none came, but the Portuguese conquest of a tributary state soured the Portuguese embassy to China in 1520–1521. In January 1513 a Javanese fleet of about 100 ships under Pati Unus, the ruler of Japara and later of Demak, attacked Malacca and was beaten off at sea by Fernão Pires de Andrade.
      - Mahmud gathered his former vassals, among them Pahang, Lingga and Indragiri, and fortified a camp at Pagoh, up the Muar river. In 1518 he besieged Malacca by land while 85 boats attacked from the sea, and withdrew after 17 days. On 15 July 1520 António Correia led 150 Portuguese and 300 Malay allies up the Muar, broke through the stockades and stormed Pagoh, and Mahmud withdrew by way of Pahang to the island of Bintan, south of Singapore, where he built a new capital at Kopak. From there his fleets attacked Malacca’s shipping. A Portuguese attack on Bintan failed in 1521, Portuguese crews were killed at Pahang in 1522, and in 1524 Mahmud’s forces, 16,000 men by a Portuguese count, besieged Malacca for a month; that year Martim Afonso de Sousa blockaded Bintan, burned the ships in the river at Pahang and killed hundreds of its people, and burned the port of Patani, which had sided with Bintan.
      - In 1526 Pedro Mascarenhas brought 15 ships, 600 Portuguese and 300 Malay auxiliaries against Bintan, took Kopak in a night assault and razed it. Mahmud Shah fled to Kampar in Sumatra, where he died in 1528, remembered as Marhum Kampar. His son Alauddin Riayat Shah II built a new capital on the Johor river, the beginning of the sultanate of Johor, and another son, Muzaffar, became the first sultan of Perak. Portuguese Malacca, now at peace with most of its neighbours for a time, remained Portuguese until the Dutch took it in 1641; the wars that Aceh, Johor and Japara waged against it from 1537 are told in their own story.
    facts:
