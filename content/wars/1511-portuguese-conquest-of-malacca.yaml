notes:
  - The fighting is known mainly from Portuguese chronicles (Albuquerque’s letters, Gaspar Correia, João de Barros) and from the Malay Annals (Sejarah Melayu); numbers differ widely between them. Albuquerque reported the sultan’s army at 20,000 men, of whom he thought only about 4,000 fit for battle; Portuguese accounts of their own force range from about 1,000 to over 2,000 men with their Indian and Malay allies.
  - The Malay Annals give Malay names for many places in the story (Pagoh, Kopak on Bintan). Sultan Mahmud’s son Ahmad briefly reigned in his place until about 1513; Malay and Portuguese sources date Mahmud’s death at Kampar to 1527 or 1528.
