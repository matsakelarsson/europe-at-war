id: portuguese-conquest-of-malacca
name: Portuguese conquest of Malacca
start: "1511-07-01"
end: "1526"
tier: B
summary: "The Portuguese capture of Malacca, the greatest port of Southeast Asia, and Sultan Mahmud Shah’s fifteen-year war to win it back. Malacca, a Muslim sultanate founded around 1400, controlled the strait through which the trade between India and China passed, and ruled much of the Malay Peninsula and parts of the east coast of Sumatra. In 1509 Mahmud Shah received a Portuguese trading mission under Diogo Lopes de Sequeira, then, urged on by Gujarati and Javanese merchants who feared Portuguese competition, attacked it and held about twenty men prisoner. In 1511 Afonso de Albuquerque, governor of Portuguese India, came with 18 ships and about 1,000 men, stormed the city in two assaults on 25 July and in August, and after ten days of bombardment took it on 24 August. The city was plundered, and Albuquerque built the fortress later called A Famosa. Mahmud Shah fought on from the Muar river, from Pahang and from Bintan, at the head of a league of former vassals, besieging Malacca in 1518 and 1524, while a Javanese fleet under Pati Unus of Japara attacked it in 1513. In 1526 the Portuguese destroyed his capital on Bintan, and he died in exile at Kampar in Sumatra in 1528. His sons founded the sultanates of Johor and Perak, which, with Aceh, fought the Portuguese at Malacca for another century."
