id: spanish-conquest-of-cuba
name: Spanish conquest of Cuba
start: "1511-01"
end: "1514"
tier: B
summary: "The conquest of Cuba by Diego Velázquez de Cuéllar in 1511–1514. Velázquez crossed from western Hispaniola early in 1511 with some 300 men and landed in the east of the island, where Hatuey, a cacique who had fled from Hispaniola, led the Taíno in a guerrilla war for several months; he was captured and burned at the stake on 2 February 1512. Reinforced by Pánfilo de Narváez and archers from Jamaica, Velázquez founded Baracoa and in 1513 sent columns west along both coasts and through the interior. At Caonao, in the Camagüey region, Narváez’s men massacred a village that had come out to meet them with food; Bartolomé de las Casas, who saw it, wrote that more than three thousand people were killed. By 1515 Velázquez had founded seven towns, from Baracoa and Bayamo to Trinidad, Sancti Spíritus, Puerto Príncipe, Havana and Santiago, and divided the Taíno in encomiendas to work the gold placers. Disease, forced labour and flight destroyed most of the island’s Indigenous population within a few decades; Taíno resistance went on in the eastern mountains under Guamá until 1533."
countries: [cu, es]
sides:
  - id: cas
    name: Crown of Castile (Diego Velázquez de Cuéllar and Pánfilo de Narváez)
    polities: [castile, cuba]
