notes:
  - "The main account is by Bartolomé de las Casas, who came to Cuba in 1512, served as Narváez’s chaplain, received an encomienda and gave it up in 1514 to denounce the conquest; his Short Account of the Destruction of the Indies (1552) and History of the Indies give the speech of Hatuey and the number killed at Caonao. His figures cannot be checked, and other chroniclers, such as Gonzalo Fernández de Oviedo, wrote from the conquerors’ side."
  - "Las Casas put the Taíno population of Cuba at about 350,000 in 1492; modern estimates are generally lower and vary widely. The place where Hatuey was burned, called Yara, is traditionally identified with Yara near Bayamo; some historians place it in the far east of the island."
