steps:
  - title: Velázquez, Hatuey and Baracoa
    date: "1511 – February 1512"
    when: "1511"
    borders: "1512-02-02"
    countries: [cu, ht, es]
    body:
      - "Columbus had sailed along Cuba’s coasts in 1492 and 1494, and Sebastián de Ocampo sailed round it in 1508, but no Spaniard had settled there. In 1510 Viceroy Diego Colón chose Diego Velázquez de Cuéllar, one of the richest colonists of Hispaniola and a commander in Ovando’s wars, to conquer it. Velázquez sailed from Salvatierra de la Sabana in western Hispaniola with some 300 men early in 1511 and landed in the province of Maisí, at the eastern tip of the island."
      - "He was expected. Hatuey, a cacique from Hispaniola, had crossed to Cuba by canoe with several hundred of his people to escape the Spaniards and warned the caciques of the east of what to expect. Las Casas has him show them a basket of gold and say that this was the lord the Christians served. Few caciques joined him, but for some two months his warriors fought the Spaniards from the forests until they were hunted down with dogs and captured Taíno were tortured for information. Hatuey was taken and on 2 February 1512 burned alive at a place called Yara. Las Casas tells that when a friar urged him to be baptised so that he could go to heaven, Hatuey asked whether Christians went there, and on hearing that they did, said he would rather not go where they were."
      - "By August 1511 Velázquez had founded Nuestra Señora de la Asunción de Baracoa, a fort and huts on the north-east coast, the first Spanish town in Cuba. Later that year Pánfilo de Narváez joined him from Jamaica with thirty archers and Native auxiliaries and became his second in command. More than a year was spent bringing the east of the island under Spanish control."
    facts:
      - [Velázquez’s expedition, "about 300 men, early 1511"]
      - [Baracoa founded, "by August 1511"]
      - [Hatuey burned at Yara, "2 February 1512"]
