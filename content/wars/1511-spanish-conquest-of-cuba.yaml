  - title: Narváez, Caonao and the seven towns
    date: "1513–1515"
    when: "1513"
    borders: "1514"
    countries: [cu, es]
    body:
      - "In 1513 Velázquez sent three expeditions west: Narváez through the interior, with Las Casas as chaplain, and Velázquez himself and a lieutenant along the south and north coasts. At Bayamo the Taíno attacked Narváez’s camp by night and were driven off. Further west, near the south coast, Narváez struck first at a force of some 2,500 Taíno under the cacique Caguax, killing about a hundred; it was the last large-scale resistance in the west."
      - "At Caonao, in the Camagüey region, the people of a large village came out to meet the column with fish and cassava bread. Las Casas, who was there, wrote that without cause the soldiers suddenly drew their swords and killed the men, women and children sitting before them, more than three thousand people in his count, and that Narváez stood by. The survivors fled to the forests and the offshore cays. Las Casas, who received an encomienda near Trinidad for his services, gave it up in 1514 and began his long campaign at court against the encomienda and the conquest."
      - "In October 1513 the king authorised Velázquez to assign the Taíno in encomiendas and found towns. Bayamo was founded in 1513, Trinidad, Sancti Spíritus and San Cristóbal de La Habana, first on the south coast, in 1514, Santa María del Puerto del Príncipe in 1514–1515, and Santiago de Cuba, which became the capital, in July 1515. Gold was found in several places and the Taíno were put to work washing it until the placers ran out around 1520. Many died of overwork and disease, and smallpox struck in 1519; the Spaniards then raided other islands and the mainland for slaves. In the forests of the east, Guamá led a band of rebels from the 1520s until he was killed in 1533."
    facts:
      - [Massacre of Caonao, "1513"]
      - [Killed at Caonao (Las Casas), "more than 3,000"]
      - [Towns founded, "Bayamo 1513; Trinidad, Sancti Spíritus, Havana 1514; Puerto Príncipe; Santiago 1515"]
