id: anglo-scottish-war-1513
name: Anglo-Scottish War of 1513
start: "1513-08-22"
end: "1513-09-09"
tier: C
summary: James IV of Scotland invaded England to support his French allies while Henry VIII was campaigning in France. He took the border castles of Norham, Etal and Ford and waited on Flodden Hill, but the English army under the Earl of Surrey marched round to his rear. On 9 September 1513, near Branxton, the Scottish pikemen advanced downhill, lost their order in marshy ground and were cut down at close quarters by English billmen. James IV was killed, the last monarch in Britain to die in battle, with many of his nobles and perhaps 10,000 of his men, though estimates vary widely. His infant son became James V.
