id: demak-wars
name: Demak’s wars
start: "1513-01"
end: "1546"
tier: B
summary: "The wars of Demak, the first Muslim sultanate of Java, which in the first half of the 16th century made itself the leading power of the island. Demak, a port on the north coast of Central Java that had broken away from Majapahit, led the Javanese ports against the Portuguese after their capture of Malacca: in January 1513 Pati Unus, the ruler of Japara, attacked Malacca with about 100 ships and was defeated, and Javanese tradition tells of a second attack in 1521 in which he was killed. Under Sultan Trenggana Demak then overcame the last Hindu-Buddhist powers. It defeated Daha, the successor of Majapahit in the Brantas valley, a victory dated by different sources between 1518 and about 1527, and when the Hindu kingdom of Sunda made an alliance with the Portuguese in 1522, Trenggana sent Fatahillah with troops from Demak and Cirebon to take Banten and Sunda Kelapa, which he renamed Jayakarta, in 1527. Campaigns followed against the ports and inland principalities of eastern Java: Tuban, Madiun, Surabaya (1530), Pasuruan and Malang. In 1546 Trenggana was killed while besieging Panarukan, the port of the Hindu kingdom of Blambangan. Demak broke up in a succession war, and its lands passed to Pajang in 1568 and later to Mataram."
