  - title: Trenggana in the east, and his death at Panarukan
    date: 1527–1546
    when: "1535"
    borders: "1546"
    countries: [id]
    body:
      - Trenggana, remembered as the greatest ruler of Demak and crowned, by tradition, by Sunan Gunungjati, spent the following two decades extending Demak’s rule over the inland principalities and the ports of eastern Java, many of which were still Hindu. The Javanese chronicles date the conquest of Madiun to about 1529–1530, while Surabaya, the great port at the mouth of the Brantas, whose Muslim lord had long resisted Demak, submitted in 1530. Pasuruan followed in about 1535, and the principalities of the Malang highlands were brought under Demak by the mid-1540s. Majapahit’s heirlooms were carried to Demak as royal treasures. Trenggana gave Japara and Kalinyamat to his daughter, later known as Ratu Kalinyamat, and her husband, and Pajang to his son-in-law Jaka Tingkir.
      - The last great Hindu state in Java was Blambangan in the eastern tip of the island, whose port of Panarukan was its commercial and political centre. In 1546 Trenggana besieged Panarukan and was killed there. Javanese tradition says that he was stabbed by a ten-year-old boy of the ruling family of Surabaya who was serving him betel; the Portuguese writer Fernão Mendes Pinto also tells of his death at Panarukan. The siege was abandoned.
      - Trenggana’s death set off a war of succession. His son Sunan Prawata was murdered in 1549 on the orders of his cousin Arya Penangsang of Jipang, whose father Prawata had killed, and Penangsang was in turn defeated and killed by Hadiwijaya (Jaka Tingkir) of Pajang, Trenggana’s son-in-law, who took the regalia of Demak to Pajang in 1568. Surabaya became an independent principality, Blambangan held out until the 17th century, and Japara under Ratu Kalinyamat sent fleets against Portuguese Malacca in 1551 and 1574.
    facts:
      - [Surabaya submits, "1530"]
      - [Pasuruan taken, "about 1535"]
      - [Trenggana killed at Panarukan, "1546"]
