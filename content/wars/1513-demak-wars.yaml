notes:
  - The history of Demak rests on the Portuguese writer Tomé Pires, who knew Java in 1512–1515, on later Portuguese reports (Fernão Mendes Pinto describes Trenggana’s death at Panarukan) and on Javanese chronicles (babad) written down long afterwards. The dates of Demak’s conquests differ between these sources by years, and the relationship of Pati Unus and Trenggana, and the order of their reigns, are disputed.
  - The traditional date of the conquest of Sunda Kelapa, 22 June 1527, is celebrated as the founding day of Jakarta.
