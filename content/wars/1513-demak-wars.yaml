steps:
  - title: Pati Unus against Malacca
    date: 1512–1513
    when: "1513-01"
    borders: "1513-01"
    countries: [id, my, pt]
    body:
      - Demak, founded in the late 15th century by Raden Patah on a channel that then separated the Muria peninsula from Java, had become the strongest of the Muslim port states of the north coast. It exported rice to Malacca and held the ports of Japara, Semarang, Tuban and Gresik, and Jambi and Palembang in Sumatra. The Portuguese capture of Malacca in 1511 threatened the trade on which these ports lived, and the Portuguese writer Tomé Pires reported that Pate Unus (Pati Unus), the young ruler of Japara and a kinsman of the ruler of Demak, had spent years building a fleet to make himself master of Malacca.
      - At the end of 1512 Pati Unus sailed with about 100 ships and some 5,000 men from Japara and Palembang, among them about 30 large junks. In January 1513 the fleet attacked Malacca and was defeated by the Portuguese ships under Fernão Pires de Andrade, who reported that the cannonballs could not pierce Pati Unus’s own junk, built in layers of planking and plate. Pati Unus returned to Java with what was left of his fleet and is said to have laid up his junk as a memorial. He became ruler of Demak in 1518, and Javanese tradition tells that he led a second, larger fleet against Malacca in 1521 and was killed by a cannon shot; he is remembered as Pangeran Sabrang Lor, “the prince who crossed to the north”. The losses of ships crippled the trade of the Javanese ports for years.
    facts:
      - [Javanese fleet, "about 100 ships, some 5,000 men"]
      - [Attack on Malacca, "January 1513, Portuguese victory"]
