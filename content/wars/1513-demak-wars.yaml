  - title: Daha, and the conquest of Sunda Kelapa
    date: 1518–1527
    when: "1527"
    borders: "1527-06-22"
    countries: [id, pt]
    body:
      - In the Brantas valley the old Majapahit court survived at Daha (Kediri), held from 1498 by the minister Patih Udara, who seized the throne from Girindrawardhana. Demak’s rulers claimed descent from the Majapahit king Kertabhumi, whom Girindrawardhana had overthrown, and Javanese sources say that Udara sought Portuguese help against Demak. Demak’s armies marched on Daha overland by way of Madiun while its fleet sailed by way of Sedayu, and Daha fell to Demak. The date is uncertain; the Demak tradition gives 1518, other sources about 1527, the year usually given for the end of Majapahit. Tuban, Majapahit’s old port, was taken in about 1527. Many courtiers, priests and artisans of the old court are said to have fled to the mountains of the east and to Bali.
      - In western Java the Hindu kingdom of Sunda, ruled from Pakuan Pajajaran near today’s Bogor, felt threatened by Demak and by Cirebon, which had stopped paying tribute to Sunda in 1482. King Surawisesa made a treaty with the Portuguese of Malacca, signed on 21 August 1522, which allowed them to build a fortress at Sunda Kelapa, the kingdom’s port at the mouth of the Ciliwung, in return for pepper and protection; a stone pillar, the padrão, marked the site. Before the Portuguese came back to build it, Sultan Trenggana of Demak sent Fatahillah, a commander who by most accounts came from Pasai, with troops from Demak and Cirebon. They took the port of Banten and, by tradition on 22 June 1527, Sunda Kelapa, where the harbour master and his people were killed and the town destroyed; a relief force from Pakuan was too weak to retake it. The port was renamed Jayakarta. When a Portuguese squadron arrived to build the fortress, some thirty sailors from a ship wrecked on the coast were killed, and the rest sailed back to Malacca.
      - Banten became the seat of a new sultanate under Hasanuddin, son of Sunan Gunungjati of Cirebon, married to Trenggana’s sister. Surawisesa, by Sundanese tradition, fought fifteen battles against the Muslim forces before a peace with Cirebon in 1531, but Sunda had lost its ports for good and was finally conquered by Banten in 1579.
    facts:
      - [Treaty of Sunda and Portugal, "21 August 1522"]
      - [Sunda Kelapa taken, "22 June 1527 (traditional date)"]
      - [Fall of Daha, "between 1518 and about 1527"]
