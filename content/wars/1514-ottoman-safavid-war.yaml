steps:
  - title: Chaldiran and the conquest of eastern Anatolia
    date: 1514–1517
    when: "1514-04"
    borders: "1517"
    countries: [tr, ir]
    body:
      - Selim I, who had pushed his father from the throne in 1512, saw a deadly danger in Ismail I, the young shah who had made Shi‘i Islam the faith of Persia. Ismail’s Qizilbash followers were strong among the Turkmen tribes of Anatolia and had risen in a great revolt there in 1511. Armed with rulings that called them heretics, Selim had many of them killed or imprisoned; chroniclers speak of 40,000, a figure historians treat with caution. In the spring of 1514 he marched east. On 23 August, at Chaldiran north-east of Lake Van, the Safavid cavalry charged the Ottoman wings and was shot down by guns and janissary muskets behind a barrier of carts. Ismail was wounded and fled.
      - Selim entered Tabriz in early September and carried off its treasury and many of its craftsmen, but his janissaries refused to winter there and he withdrew. In 1515 he took the fortress of Kemah, and his vizier Hadım Sinan Pasha destroyed the army of Dulkadir at Turnadağ; its ruler was killed and replaced by a vassal. Diyarbakır and many Kurdish lords went over to the Ottomans, won over by the scholar Idris Bitlisi, and in 1516 Bıyıklı Mehmed Pasha beat a Safavid army near Mardin, which fell soon after. Tabriz stayed Persian, but eastern Anatolia was now Ottoman.
    facts:
      - [Battle of Chaldiran, "23 August 1514, Ottoman victory"]
      - [Battle of Turnadağ, "June 1515, Ottoman victory over Dulkadir"]
      - [Conquered, "Erzincan, Kemah, Diyarbakır, Mardin and the Kurdish emirates"]
