id: ottoman-safavid-war
name: Ottoman–Safavid War (1514–1517)
start: "1514"
end: "1517"
tier: B
summary: The first war between the Ottoman sultan Selim I and the Safavid shah Ismail I of Persia, whose Shi‘i Qizilbash followers had a large following among the Turkmen of Anatolia. Selim’s guns and janissaries routed Ismail at Chaldiran in 1514 and briefly occupied Tabriz, and in the following years the Ottomans conquered the Dulkadir beylik and eastern Anatolia from Erzincan to Diyarbakır, a frontier fought over until the Peace of Amasya in 1555.
