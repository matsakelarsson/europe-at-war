notes:
  - Dates are Julian. Sources differ on some dates, such as the Ottoman entry into Tabriz (5 or 7 September 1514).
  - The size of both armies at Chaldiran is uncertain; modern estimates run from about 60,000 to 100,000 Ottomans and 40,000 to 80,000 Safavids. No peace was made, and the later Ottoman–Safavid wars, which began again in 1532, are not told here.
