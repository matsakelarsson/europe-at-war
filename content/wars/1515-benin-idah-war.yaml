id: benin-idah-war
name: Benin–Idah war
start: "1515"
end: "1516"
tier: C
summary: "A war between the Kingdom of Benin under Oba Esigie and the Igala kingdom of Idah, on the lower Niger, in 1515–1516, known from Benin tradition and a Portuguese letter. Esigie had come to power after a civil war against his brother Arhuaran, who held the town of Udo, and one account says that Benin nobles who opposed the oba’s dealings with the Portuguese conspired with the Attah (king) of Idah. The Igala attacked Benin and were driven back. Tradition gives a great part to Esigie’s mother Idia, whom he made the first Iyoba (queen mother): she is said to have raised troops and gone to war at his side, and a servant of hers is credited with killing the Igala general. Portuguese missionaries went with the Benin army: on 20 October 1516 the priest Duarte Pires wrote to King Manuel I that they had stayed with the oba “during a whole year of war”, that the oba hoped to finish the war that summer, and that he had given his son and some of his greatest officials to be made Christians. Whether Portuguese soldiers or guns took part is disputed: some accounts credit Portuguese firepower with Benin’s victory, others say Benin won without it. Benin was then selling captives to the Portuguese, who carried many of them to Elmina on the Gold Coast to buy gold."
countries: [ng]
