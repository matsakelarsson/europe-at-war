notes:
  - The brothers came from Lesbos. Spanish and Italian writers called them pirates; they sailed as corsairs, at first with the permission of the Hafsid sultan, who took a share of their prizes, and from 1519 as Ottoman officers. Christian corsairs, above all the Knights of St John, raided Muslim shipping in the same way. They also carried Muslims who left Spain to North Africa.
  - The main sources are Spanish accounts such as those of Diego de Haedo and Luis del Mármol Carvajal, and the Ottoman Gazavât-ı Hayreddin Paşa, a life of Hayreddin written in his lifetime. They disagree on many dates, and on where Oruç was killed.
  - The earlier Spanish conquests on the coast and the later wars of the Regency of Algiers (Tunis 1534–1535, Algiers 1541) have their own entries.
