id: barbarossa-brothers-in-algiers
name: The Barbarossa brothers and the Ottoman conquest of Algiers
start: "1516"
end: "1529-05"
tier: B
summary: "The war in which two Turkish corsair brothers, Oruç and Hayreddin, called Barbarossa by the Europeans, fought the Spanish garrisons of the central Maghreb and made Algiers an Ottoman province. Invited by the rulers of Bougie and Algiers to drive out the Spaniards, Oruç failed at Bougie in 1512 and 1514 but took Jijel and, in 1516, Algiers, where he had its ruler Salim al-Tumi killed and beat off a Spanish expedition. He took Ténès and Tlemcen in 1517, but a Spanish army from Oran besieged him there, and he was killed while trying to escape in May 1518. Hayreddin, holding only the coast, put himself under the Ottoman sultan Selim I in 1519 and received the title of beylerbey with 2,000 janissaries. Driven out of Algiers in 1520 by a coalition of the Kabyle kingdom of Kuku and the Hafsids, he won it back in 1525, and in May 1529 he took the Spanish fort on the Peñón, the island facing the city, and joined it to the shore with a mole to make the harbour of Algiers."
countries: [dz, tn, es, tr]
