  - title: Hayreddin, the sultan and the Peñón
    date: 1519–1529
    when: "1519"
    borders: "1529-06-01"
    countries: [dz, tn, es, tr]
    body:
      - Hayreddin, left with Algiers and a few coastal towns, beat off a Spanish expedition under Hugo de Moncada in August 1519, and in October he sent envoys to Istanbul to offer Algiers to the Ottoman Empire. Selim I accepted, made Hayreddin beylerbey (governor-general) of Algiers and sent him 2,000 janissaries with guns and ships. His Kabyle ally had already turned against him. In 1519 Hayreddin was defeated by Ahmad ibn al-Qadi, reinforced by the Hafsid sultan of Tunis, on the Oued Isser, and in 1520 the coalition took Algiers, while Hayreddin withdrew to Jijel.
      - From Jijel he rebuilt his fleet and his alliances, and in 1525 he defeated Ahmad ibn al-Qadi and retook Algiers. In May 1529 he bombarded and took the Peñón fort, which had been in Spanish hands since 1510, and used its stones to build a mole joining the island to the town, which gave Algiers a sheltered harbour. That year his ships also carried many thousands of Muslims from Spain to North Africa; one figure given is 70,000. In 1533 Suleiman the Magnificent made Hayreddin admiral of the Ottoman fleet, and Algiers remained an Ottoman regency until the French conquest of 1830.
    facts:
      - [Moncada’s expedition repulsed, "August 1519"]
      - [Hayreddin made beylerbey, "1519"]
      - [Algiers held by Kuku, "1520–1525"]
      - [Peñón of Algiers taken, "May 1529"]
    markers:
