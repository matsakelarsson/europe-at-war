steps:
  - title: Bougie, Jijel and Algiers
    date: 1512–1516
    when: "1516"
    borders: "1516-10-01"
    countries: [dz, tn, es]
    body:
      - Oruç and his brother Hızır, later known as Hayreddin, had made their name raiding Christian shipping from Djerba, and from 1504 the Hafsid sultan let them use La Goulette, the port of Tunis, for a third of their prizes. After Spain took the coastal towns of the central Maghreb in 1509–1510, local rulers turned to them. In August 1512 the dispossessed ruler of Bougie asked them to drive out the Spanish garrison; the attack failed, and Oruç lost his left arm. In 1514 they came back with twelve galliots and about 1,000 Turks, destroyed two Spanish forts outside Bougie but could not take the town, and seized Jijel, further east, which became their base.
      - In 1516 Salim al-Tumi, the ruler of Algiers, called on them to remove the Spanish fort on the Peñón, the island facing his harbour. Oruç came with about 800 Turks and some 5,000 Kabyle fighters led by his ally Ahmad ibn al-Qadi, the founder of the kingdom of Kuku. The fort held out, and Oruç had Salim strangled, accusing him of plotting with the Spaniards, and made himself ruler of Algiers. On 30 September 1516 a Spanish army of 10,000 or more under Diego de Vera landed to retake the city; its line broke, a storm wrecked much of its fleet, and some 3,000 men were killed or wounded and 400 captured.
    facts:
      - [Attacks on Bougie, "August 1512 and 1514"]
      - [Jijel taken, "1514"]
      - [Algiers taken by Oruç, "1516"]
      - [Diego de Vera’s expedition defeated, "30 September 1516"]
