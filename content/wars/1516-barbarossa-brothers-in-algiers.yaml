  - title: Tlemcen and the death of Oruç
    date: 1517–1518
    when: "1517"
    borders: "1518-05-31"
    countries: [dz]
    body:
      - Oruç pushed inland. He took Miliana and Médéa, and in June 1517 he defeated Hamid bin Abid, a Spanish vassal, at the Oued Djer and took Ténès. Tlemcen was then torn by a quarrel between Zayyanid princes; Oruç took the city late in 1517 and executed its sultan, Abu Zayyan III, and the deposed sultan Abu Hammu III fled to Spanish Oran.
      - The new king of Spain, Charles I (the Emperor Charles V), sent reinforcements, and the governor of Oran, the Marquis of Comares, marched on Tlemcen with about 10,000 Spanish soldiers and Abu Hammu’s supporters. Oruç’s brother Ishak was killed, and Oruç, with some 1,500 Turks and 5,000 local fighters, held Tlemcen for six months until its people, turning against the Turks, opened the gates in May 1518. Oruç was overtaken and killed while trying to escape; the sources disagree on where. Abu Hammu III was restored as a vassal of Spain.
    facts:
      - [Ténès taken, "June 1517"]
      - [Tlemcen taken by Oruç, "late 1517"]
      - [Oruç killed, "May 1518"]
    markers:
      - kind: taken
        side: bb
        name: Ténès
        date: June 1517
        text: Taken by Oruç after he defeated its lord, a vassal of Spain, at the Oued Djer.
        lonlat: [1.307, 36.512]
      - kind: taken
