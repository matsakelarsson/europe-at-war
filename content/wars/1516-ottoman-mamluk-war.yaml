steps:
  - title: Marj Dabiq and Syria
    date: 1516
    when: "1516-06"
    borders: "1516-12"
    countries: [sy, tr, lb, il, ps, jo]
    body:
      - After Chaldiran, the Mamluk Sultanate, which ruled Egypt, Syria and the Hejaz, stood between the Ottomans and their Safavid enemy, and the two had long quarrelled over the Turkmen beyliks between them. In the summer of 1516 the old sultan Qansuh al-Ghawri marched north to Aleppo with his Mamluk cavalry. Selim I, who had set out as if against Persia, turned south. On 24 August the armies met on the plain of Marj Dabiq, north of Aleppo. The Mamluk right drove back the Ottoman wing, but the governor of Aleppo, Khayr Bey, who had secretly gone over to Selim, left the field with the left wing, and the Ottoman guns broke the rest.
      - Al-Ghawri died on the battlefield, perhaps of a stroke. Aleppo opened its gates to Selim, and the Abbasid caliph, who had come with the Mamluk army, fell into his hands. Damascus surrendered in October without a fight, and Tripoli, Beirut and Jerusalem followed. In Cairo the Mamluks chose Tuman Bay as their sultan, but on 28 October the Ottoman vizier Hadım Sinan Pasha defeated a Mamluk army at Khan Yunis near Gaza, opening the road to Egypt.
    facts:
      - [Battle of Marj Dabiq, "24 August 1516, Ottoman victory"]
      - [Damascus surrenders, October 1516]
      - [Battle of Khan Yunis, "28 October 1516, Ottoman victory"]
