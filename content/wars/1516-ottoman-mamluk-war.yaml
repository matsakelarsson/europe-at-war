  - title: Ridaniya and Cairo
    date: 1517
    when: "1517-01"
    borders: "1517-04-15"
    countries: [eg, ps, tr]
    body:
      - In January 1517 Selim crossed the Sinai desert, with water carried by camels. Tuman Bay had dug in at Ridaniya on the edge of Cairo with guns and fresh recruits, but on 22 January the Ottomans went round his position and attacked it from the flank and rear, and his army broke. Hadım Sinan Pasha was among the Ottoman dead. Ottoman troops entered Cairo, and for days there was fighting in the streets as Tuman Bay’s men attacked them by night; many of the city’s people were killed.
      - Tuman Bay kept up the fight from the countryside with Bedouin help until he was betrayed and captured. On 15 April he was hanged at Bab Zuwayla, one of Cairo’s gates. Egypt became an Ottoman province, governed at first by Khayr Bey, and the sharif of Mecca sent his submission, making the sultan protector of the holy cities. Selim returned home with the caliph and with many of Cairo’s craftsmen and scholars, having nearly doubled the size of his empire.
    facts:
      - [Battle of Ridaniya, "22 January 1517, Ottoman victory"]
      - [Tuman Bay hanged, 15 April 1517]
      - [Egypt’s first Ottoman governor, Khayr Bey]
    markers:
      - kind: battle
        side: ot
        name: Battle of Ridaniya
        date: 22 January 1517
        text: The Ottomans turned the flank of Tuman Bay’s fortified line, and the last Mamluk army broke.
        lonlat: [31.31, 30.09]
      - kind: event
        side: ot
        name: Bab Zuwayla
        date: 15 April 1517
        text: The last Mamluk sultan, Tuman Bay, was hanged at this gate of Cairo, and his body left there for three days.
        lonlat: [31.26, 30.04]
        lp: l
    arrows:
      - side: ot
        label: Selim I across the Sinai
        via: [[34.45, 31.5], [33.8, 31.13], [32.3, 30.8], [31.42, 30.15]]
