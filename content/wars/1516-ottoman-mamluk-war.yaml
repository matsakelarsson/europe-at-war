id: ottoman-mamluk-war
name: Ottoman–Mamluk War
start: "1516"
end: "1517-04"
tier: B
summary: The war in which Sultan Selim I destroyed the Mamluk Sultanate of Egypt and Syria. The Ottomans won at Marj Dabiq near Aleppo in August 1516, where the Mamluk sultan Qansuh al-Ghawri died, took Syria and Palestine, crossed the Sinai and beat the last Mamluk sultan, Tuman Bay, at Ridaniya outside Cairo in January 1517. Egypt, Syria and the protection of Mecca and Medina passed to the Ottoman Empire.
countries: [tr, sy, lb, il, ps, jo, eg]
sides:
  - id: ot
    name: Ottoman Empire
    polities: [ottoman]
    ink: teal
    moves: Ottoman moves
    success: Ottoman success
  - id: ma
    name: Mamluk Sultanate
    polities: [mamluk]
    ink: brown
    moves: Mamluk moves
    success: Mamluk success
notes:
  - Dates are Julian. Some sources date the battle of Ridaniya to 24 January 1517 rather than 22 January, and Tuman Bay’s execution to 13 or 15 April; some place the battle of Khan Yunis in December 1516.
  - A later story held that the last Abbasid caliph, whom Selim took to Constantinople, formally handed the caliphate to the Ottoman sultans. Historians regard this as a legend from the 18th century, though the conquest did make the Ottoman sultan the guardian of the holy cities.
