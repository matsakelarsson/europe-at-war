steps:
  - title: Into the Bahoruco
    date: "1519–1528"
    when: "1519"
    borders: "1520"
    countries: [do, es]
    body:
      - "Enriquillo was born around 1500 into the ruling family of Xaraguá; most historians identify him with Guarocuya, a nephew of Anacaona, whose father was among the caciques killed by Ovando’s men in 1503. He was brought up by Franciscan friars, learned to read and write Spanish and married Mencía, by tradition a granddaughter of Anacaona. As a cacique he was assigned in encomienda, with his people, to Francisco de Valenzuela near San Juan de la Maguana, and after Francisco’s death to his son Andrés. Andrés de Valenzuela took Enriquillo’s mare and abused Mencía. When Enriquillo complained, the lieutenant governor of San Juan, Pedro de Vadillo, jailed him, and a letter he obtained from the Audiencia in Santo Domingo was ignored. In 1519 he took his people into the Bahoruco mountains."
      - "Other Taíno fleeing the encomiendas and Africans escaping slavery joined him. Enriquillo, who knew Spanish ways of war, collected weapons, posted lookouts and moved his camps through the steep, forested ranges, avoiding pitched battles; Las Casas wrote that he forbade needless killing. Expedition after expedition failed: that of Diego de Peñalosa about 1520, in which Peñalosa and eight soldiers died, those of the judge Juan Ortiz de Matienzo in 1523, of Vadillo and Íñigo Ortiz in 1525 and of Hernando de San Miguel in 1526. In October 1523 the colony formally declared war on the rebels, paying for it with a tax on meat and wine; by 1528 the campaigns had cost some 19,000 gold pesos. Rebel bands under other leaders raided far from the mountains."
      - "Slavery itself was changing the island. Sugar mills were replacing the exhausted gold mines, and enslaved Africans the dying Taíno. Around Christmas 1521 Wolof Africans on the sugar estate of the governor, Diego Colón, on the Nigua river west of Santo Domingo, rose and marched west, killing several Spaniards, until Colón’s horsemen caught them; the leaders were hanged, and an ordinance of January 1522 restricted the movement and arms of enslaved people. It is the first recorded African revolt in the Americas. Spanish documents of the 1520s speak of “indios y negros” in arms together in the mountains."
