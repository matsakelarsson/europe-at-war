notes:
  - "The main sources are Bartolomé de las Casas, who knew Enriquillo and wrote of him with sympathy, Gonzalo Fernández de Oviedo, Peter Martyr, and letters of the Audiencia and the Crown; they disagree on details, including where the peace of 1533 was agreed and where Enriquillo’s people settled afterwards."
  - "A minority of historians hold that Guarocuya and Enriquillo were different people. Manuel de Jesús Galván’s novel Enriquillo (1882) made him a symbol of Dominican identity."
