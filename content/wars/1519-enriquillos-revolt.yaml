  - title: Barrionuevo’s peace
    date: "1533–1535"
    when: "1533"
    borders: "1533-08"
    countries: [do, es]
    body:
      - "Neither side could win. Charles V, urged by the friars and tired of the expense, sent Captain Francisco de Barrionuevo, who reached Santo Domingo in February 1533 with about 200 soldiers and orders to offer peace first and make war only if it failed. Barrionuevo marched west and, after long efforts to make contact, met Enriquillo in mid-1533, by several accounts on Cabritos island in the great salt lake below the Bahoruco, and gave him a letter from the emperor."
      - "After consulting his captains, Enriquillo accepted. The agreement promised his people a royal pardon, freedom from the encomienda and land where they chose to live, under their own cacique and the Crown alone; in return Enriquillo submitted to the emperor and undertook to help return runaway Taíno and enslaved Africans to their owners for a reward. Las Casas went into the mountains to see him and confirm the peace, to the anger of the Audiencia. In a letter of 1534 Enriquillo pledged his loyalty to Charles V."
      - "Enriquillo died on 27 September 1535, according to an official report as a Christian, and Mencía and his cousin Martín de Alfaro were named to lead his people. Tradition places their settlement and his grave at Boyá, north-east of Santo Domingo, while documents point to Azua and the lands around the lake. By then perhaps a thousand Taíno survived on the island. The peace was one of the few treaties a Spanish colony ever made with Indigenous rebels on equal terms, and Enriquillo became a hero of the Dominican Republic."
    facts:
      - [Barrionuevo arrives, "February 1533"]
      - [Peace agreed, "mid-1533"]
      - [Death of Enriquillo, "27 September 1535"]
