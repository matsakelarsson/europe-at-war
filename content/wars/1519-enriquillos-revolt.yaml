id: enriquillos-revolt
name: Enriquillo’s revolt
start: "1519"
end: "1533-08"
tier: B
summary: "The war of the Taíno cacique Enriquillo against the Spanish colony of Hispaniola, fought from the Bahoruco mountains in the south-west of the island from 1519 to 1533. Enriquillo, whom most historians identify with Guarocuya, a nephew of Anacaona of Xaraguá, had been raised by Franciscan friars and was held in encomienda near San Juan de la Maguana; when his encomendero Andrés de Valenzuela took his mare and abused his wife Mencía, and the colony’s courts gave him no redress, he led his people into the mountains. For fourteen years the rebels, joined by other Taíno and by Africans who had escaped slavery, beat off expedition after expedition and raided the settlements, at a cost to the colony of tens of thousands of gold pesos, while enslaved Wolof Africans rose on Diego Colón’s sugar estate in 1521 in the first recorded African revolt in the Americas. In 1533 Charles V sent Francisco de Barrionuevo with a royal letter, and Enriquillo agreed to a peace that gave his people freedom, a pardon and land of their own, in return for submission to the Crown and help in catching runaways. He died in 1535. Enriquillo is a national hero of the Dominican Republic, and the lake below the Bahoruco bears his name."
countries: [do, es]
