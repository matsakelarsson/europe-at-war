id: polish-teutonic-war-1519
name: Polish–Teutonic War, 1519–1521
start: "1519"
end: "1521"
tier: C
summary: The last war between Poland and the Teutonic Order, fought after Grand Master Albert of Hohenzollern refused the homage owed under the Second Peace of Thorn and allied with Moscow. Neither side won, and a four-year truce was agreed at Toruń in April 1521. In 1525 Albert became a Lutheran, turned the Order’s Prussia into a hereditary duchy and did homage for it to his uncle, King Sigismund I, in the Prussian Homage at Kraków on 10 April.
