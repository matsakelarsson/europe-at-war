id: revolt-of-the-brotherhoods
name: Revolt of the Brotherhoods
start: "1519"
end: "1523-03-08"
tier: C
summary: A revolt of the armed guilds, the germanies, of the Kingdom of Valencia against the nobles and the royal government of Charles I, with a related rising on Majorca. In 1519, when plague drove many nobles from the city of Valencia, the guilds took over its government through a Council of Thirteen, and in 1520 they forced out the new viceroy, Diego Hurtado de Mendoza. Open war came in 1521. The agermanats under Vicent Peris beat the viceroy at Gandia in July and forcibly baptised the Muslim peasants of the region, but within weeks they were crushed by the Marquis of Los Vélez at Oriola, and the city of Valencia surrendered on 1 November. Peris, trying to revive the revolt, was captured after a night of street fighting and executed in March 1522; Xàtiva and Alzira held out until December, and the Majorcan rebels surrendered Palma on 8 March 1523. Hundreds of rebels were executed, and the forced baptisms were upheld, turning Valencia’s Muslims into Moriscos.
