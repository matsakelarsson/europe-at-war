notes:
  - Dates are Julian, as usual for the period. The revolt is known in Catalan as the Germanies and in Spanish as the Germanías, from germania, brotherhood.
  - King Ferdinand and Charles I had allowed the guilds to arm against Barbary corsairs raiding the coast. The revolt ran alongside the Revolt of the Comuneros in Castile but had different aims and no common leadership.
