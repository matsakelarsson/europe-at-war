  - title: The siege begins
    date: "May–June 1521"
    when: "1521-05-22"
    borders: "1521-05-22"
    countries: [mx]
    view: {center: [-99.07, 19.42], size: [70, 55]}
    body:
      - Cortés had by Díaz’s count 84 horsemen, 194 crossbowmen and arquebusiers and 650 Spanish foot soldiers, 25 men on each of the thirteen brigantines, and some 20,000 warriors from Tlaxcala, Huexotzinco and Cholula; other accounts give far larger numbers of allies, and more joined as the siege went on. He divided the army into three. Pedro de Alvarado took Tlacopan and Cristóbal de Olid Coyoacán, each with about 8,000 Tlaxcalans, and Gonzalo de Sandoval Iztapalapa with about 8,000 warriors from Chalco and Huexotzinco; they were in position by 22 May 1521.
      - Alvarado and Olid first cut the aqueduct that brought fresh water from the springs of Chapultepec. Cortés sailed from Texcoco with the brigantines, scattered a fleet of canoes, said to be more than a thousand, and from then on the Spaniards held the lake. Tenochtitlan was cut off from food and fresh water, and anyone trying to bring supplies across the lake was intercepted. By day the besiegers fought their way along the causeways and filled the gaps with rubble; at night the defenders dug them out again and staked the shallows against the brigantines.
      - On 30 June a push towards the market of Tlatelolco failed when the defenders counterattacked across an unfilled channel. Cortés was wounded and nearly captured, and sixty-five Spaniards were taken alive and sacrificed on the temples in sight of the Spanish camps. For a while most of the allies went home, but they came back when the Aztec victory that the priests had foretold did not come.
    facts:
      - [Siege of Tenochtitlan, "22 May – 13 August 1521"]
      - [Spanish force, "about 930 Spaniards and 13 brigantines"]
      - [Defeat on the causeway, "30 June 1521"]
