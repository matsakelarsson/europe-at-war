  - title: Smallpox and Tepeaca
    date: "August–December 1520"
    when: "1520-10"
    borders: "1520-10-01"
    countries: [mx]
    body:
      - From 1 August 1520 the Spaniards and their Tlaxcalan allies campaigned around Tepeaca, a tributary of the Aztecs where Spaniards had been killed, took many of its people as slaves and founded a town there, Segura de la Frontera. Town after town of the empire’s tributaries, held by fear or interest rather than loyalty, went over to them. In Tlaxcala, the shipwright Martín López began building thirteen brigantines to be carried to Lake Texcoco in pieces, and ships from Cuba and Spain brought reinforcements.
      - Smallpox had come with Narváez’s expedition; Spanish sources say it was carried by Francisco de Eguía, an enslaved African who fell ill at Cempoala. It spread inland and raged in the Valley of Mexico for some seventy days, from about October to December 1520. The Nahua accounts in the Florentine Codex describe people covered in sores, unable to move, many of them dying of hunger because no one could care for them. Cuitláhuac died on 4 December 1520 after ruling for eighty days, and the disease also killed the Tlaxcalan ruler Maxixcatzin. One estimate puts the dead of this first epidemic at 5 to 8 million across Mesoamerica; all such figures are uncertain.
    facts:
      - [Campaign around Tepeaca, "from 1 August 1520"]
      - [Smallpox in the Valley of Mexico, "about October–December 1520"]
      - [Death of Cuitláhuac, "4 December 1520"]
    markers:
      - kind: taken
        side: es
        name: Tepeaca
        date: "August–September 1520"
        text: Taken by the Spaniards and Tlaxcalans, who enslaved many of its people and founded Segura de la Frontera.
        lonlat: [-97.904, 18.966]
        lp: b
      - kind: event
        side: al
        name: Tlaxcala
