  - title: Tlaxcala
    date: "August–September 1519"
    when: "1519-09"
    borders: "1519-09-01"
    countries: [mx]
    body:
      - The march inland led up past Xalapa and the Cofre de Perote onto the cold high plateau, where the Totonacs from the hot coast suffered badly. Moctezuma’s envoys pressed Cortés to go on through lands loyal to the empire, but he turned instead towards Tlaxcala, an independent confederation of four city-states that had resisted the Triple Alliance for generations in the flower wars.
      - Tlaxcala first met the newcomers with war. From 31 August Otomí warriors on the border and then the armies of Tlaxcala under Xicotencatl the Younger attacked the Spaniards, at times surrounding them; the Spaniards held their camp by day and raided villages by night. After about eighteen days of fighting, in which by one account the Spaniards lost a fifth of their men and half their horses, the rulers of Tlaxcala, Maxixcatzin of Ocotelolco and the elder Xicotencatl, overruled the war leader and chose an alliance against their old enemy.
      - Cortés entered the city of Tlaxcala on 23 September 1519 and stayed twenty days. Encircled by Aztec tributaries and cut off from trade, Tlaxcala was short of salt and cotton cloth. Its alliance with the Spaniards, sealed with gifts and marriages, was to be the most important of the conquest.
    facts:
      - [Fighting with Tlaxcala, "31 August – about 18 September 1519"]
      - [Cortés enters Tlaxcala, "23 September 1519"]
    markers:
