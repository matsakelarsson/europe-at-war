    success: Allied success
  - id: az
    name: Aztec Triple Alliance (Moctezuma II, Cuitláhuac, Cuauhtémoc)
    polities: [aztec-empire, mexica, tlatelolco]
    ink: red
    moves: Aztec moves
    success: Aztec success
notes:
  - "The Spanish side is told by Cortés’s own letters to Charles V, written to justify himself, by Bernal Díaz del Castillo, who wrote his True History decades later, and by Francisco López de Gómara, Cortés’s chaplain, who was never in Mexico. Indigenous accounts were written down after the conquest, above all the Nahua testimony collected by Bernardino de Sahagún in Book 12 of the Florentine Codex, which tells the war from Tenochtitlan and Tlatelolco, and the histories and the Lienzo of Tlaxcala, which stress the Tlaxcalans’ part. The numbers of fighters and dead differ widely from source to source."
  - "Dates are in the Julian calendar, as the sources give them; add ten days for the Gregorian calendar. Moctezuma is also written Motecuhzoma, Malintzin is also known as La Malinche or Doña Marina, and Cempoala is also written Zempoala."
