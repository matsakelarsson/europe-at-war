  - title: The fall of Tenochtitlan
    date: "July – 13 August 1521"
    when: "1521-08-13"
    borders: "1521-08-12"
    countries: [mx]
    view: {center: [-99.12, 19.42], size: [55, 50]}
    body:
      - In July the besiegers changed their method. As they advanced they pulled down every block of houses they took and used the rubble to fill the canals, so that the defenders could not fight from the rooftops and the water. Famine spread in the city, people drank brackish water from the lake, and the defenders were slowly pushed north into Tlatelolco. On 1 August Spanish, Tlaxcalan and Texcocan forces reached the great market square of Tlatelolco, and Alvarado’s men set fire to its temple.
      - After several offers of peace had been refused, the last attack fell on the quarter where Cuauhtémoc had taken refuge. On 13 August 1521, as hundreds of canoes fled the city, Cuauhtémoc tried to escape by water with his family and was captured by one of the brigantines; with his capture the defence ended. For days afterwards the allied armies, above all the Tlaxcalans, looted the ruins and killed thousands of survivors.
      - Estimates of those killed in the siege and the campaign around it, warriors and civilians, range from 100,000 to 240,000. The Spaniards lost over 100 men in the siege, though some reports say as few as forty, and the Tlaxcalans thousands; about 1,800 Spaniards are thought to have died of all causes in the two years from Veracruz to the fall of the city. The survivors left the ruins, and Nahua songs written down later mourned the fall of the city.
    facts:
      - [Spaniards reach the Tlatelolco market, "1 August 1521"]
      - [Fall of Tenochtitlan, "13 August 1521"]
      - [Killed in the siege, "estimates range from 100,000 to 240,000"]
