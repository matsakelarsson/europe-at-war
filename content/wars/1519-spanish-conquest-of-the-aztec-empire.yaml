        via: [[-98.24, 19.30], [-98.10, 19.12], [-97.92, 18.98]]
  - title: Texcoco and the lakeside towns
    date: "December 1520 – April 1521"
    when: "1521-02"
    borders: "1521-02-01"
    countries: [mx]
    view: {center: [-99.05, 19.32], size: [100, 100]}
    body:
      - On the day after Christmas 1520 Cortés left Tlaxcala with his Spaniards and more than 10,000 Tlaxcalan warriors under Chichimecatecuhtli and crossed into the Valley of Mexico. At the end of December he entered Texcoco, the second city of the Triple Alliance, and replaced its ruler Coanacoch with Ixtlilxochitl II, a son of the old king Nezahualpilli who had been an enemy of Moctezuma since a war over the succession in 1516, and Texcoco became the Spaniards’ base and ally.
      - In Tenochtitlan the lords chose Cuauhtémoc, a son of the former ruler Ahuitzotl and a cousin of Moctezuma, early in 1521. Through the following months the Spaniards and their allies worked round the lake, fighting some towns and winning others over. In January they attacked Iztapalapa, where by Cortés’s own account his allies killed more than 6,000 people, men, women and children, before the defenders broke a dyke and flooded the town. In February they attacked Xaltocan in the north and fought at Tlacopan; Chalco and Tlalmanalco in the south-east joined them; in April they took Yautepec and Cuernavaca beyond the mountains, and at Xochimilco they fought a hard battle in which Cortés was nearly captured, then withdrew.
      - Thousands of Tlaxcalan porters carried the timbers of the brigantines over the mountains to Texcoco, where they were assembled and launched into the lake at the end of April 1521. By then only Tenochtitlan, Tlatelolco and a few towns still held out with Cuauhtémoc.
    facts:
      - [Cortés at Texcoco, "end of December 1520"]
      - [Cuauhtémoc chosen ruler, "early 1521"]
      - [Brigantines launched, "late April 1521"]
