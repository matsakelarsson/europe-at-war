steps:
  - title: Cozumel and Potonchán
    date: "February–March 1519"
    when: "1519-03"
    borders: "1519-03-01"
    countries: [mx]
    body:
      - Two Spanish expeditions from Cuba had explored the coasts of Yucatán and the Gulf of Mexico, under Francisco Hernández de Córdoba in 1517 and Juan de Grijalva in 1518, and brought back news of a rich land inland. Governor Diego Velázquez chose Hernán Cortés to lead a third expedition, for trade and exploration only, then tried to replace him. Cortés sailed anyway, leaving Cuba on 10 February 1519 with 11 ships and about 630 men, among them a few hundred Taíno from Cuba and some Africans, free and enslaved.
      - On Cozumel he heard of Spaniards shipwrecked on the coast in 1511. One of them, Gerónimo de Aguilar, who had learned Maya, joined him; the other, Gonzalo Guerrero, stayed with his Maya family at Chetumal. Sailing round the peninsula, the expedition reached the Chontal Maya town of Potonchán at the mouth of the Grijalva River, where it defeated the local warriors in two battles, the second known as the battle of Centla.
      - The lords of Potonchán made peace and gave the Spaniards twenty enslaved women. One of them, a Nahua woman baptised Marina and known as Malintzin, spoke both Maya and Nahuatl. Speaking through Aguilar and Malintzin, who soon learned Spanish, Cortés could now talk to the peoples of the Aztec Empire, and Malintzin became his interpreter and adviser throughout the conquest.
    facts:
      - [Expedition leaves Cuba, "10 February 1519"]
      - [Spanish force, "11 ships and about 630 men"]
      - [Battle of Centla, "March 1519"]
