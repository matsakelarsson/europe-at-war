  - title: New Spain
    date: "1521–1525"
    when: "1522"
    borders: "1522-06-01"
    countries: [mx]
    body:
      - Cortés had the ruins cleared and a Spanish city, Mexico City, built on the site of Tenochtitlan as the capital of New Spain, while he lived at Coyoacán; in October 1522 Charles V made him governor and captain-general. Expeditions sent out in 1521–1523 brought the Purépecha of Michoacán, the lords of Oaxaca and the Pacific coast under Spanish rule, and Tlaxcalan and other allied warriors went on to fight in the Spanish conquests of Guatemala and the north. Tlaxcala was rewarded with privileges, and many of the Indigenous lords who had sided with the Spaniards kept their rank under Spanish rule.
      - Cuauhtémoc was tortured, his feet burned with oil, to make him reveal the gold lost on La Noche Triste, and was kept as the nominal ruler of Tenochtitlan. In 1524 Cortés took him on an expedition to Honduras, and in February 1525, at Itzamkanac in the Chontal Maya land of Acalan, had him hanged, with Tetlepanquetzal of Tlacopan and another lord, for an alleged plot; accounts differ on whether Coanacoch of Texcoco died with them.
      - Epidemics did more than the war to empty the land. After the smallpox of 1520 came the great cocoliztli epidemic of 1545–1548, which killed perhaps 800,000 people in the Valley of Mexico alone, and another in 1576–1580 that killed about two million. Estimates of the population of the Aztec lands in 1519 vary widely, and by the end of the 1500s the Indigenous population of Mexico had fallen, by some estimates, to little more than a million.
    facts:
      - [Cortés governor of New Spain, "October 1522"]
      - [Execution of Cuauhtémoc, "February 1525"]
      - [Cocoliztli epidemics, "1545–1548 and 1576–1580"]
