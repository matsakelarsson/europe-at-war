  - title: Veracruz and Cempoala
    date: "April–August 1519"
    when: "1519-06"
    borders: "1519-06-01"
    countries: [mx]
    body:
      - The expedition anchored off San Juan de Ulúa on 21 April 1519, Maundy Thursday, and landed the next day, Good Friday. Envoys of Moctezuma II, ruler of Tenochtitlan, came with rich gifts and tried to keep the strangers away from the capital; Cortés showed off his guns and horses. To free himself from Velázquez, he had his men found a town, La Villa Rica de la Vera Cruz, whose council made him its chief justice and captain-general, answerable only to the king.
      - The Totonacs of Cempoala, who paid tribute to the Aztecs, welcomed the Spaniards. Their ruler Xicomecoatl, whom the Spaniards called the fat cacique, agreed to an alliance, and at Cortés’s urging the Totonacs seized five of Moctezuma’s tribute collectors and broke with the empire. They helped build Villa Rica on a new site to the north, near the Totonac town of Quiahuiztlan.
      - Men loyal to Velázquez plotted to seize a ship and sail back to Cuba. Cortés had two of them hanged and had his ships run aground and sunk, so that there was no way back; the story that he burned them came later. On 16 August 1519 he marched inland with most of his men, some forty Totonac nobles and hundreds of porters, leaving a garrison at Villa Rica.
    facts:
      - [Landing at San Juan de Ulúa, "21–22 April 1519"]
      - [March inland, "16 August 1519"]
