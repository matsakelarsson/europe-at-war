  - title: La Noche Triste and Otumba
    date: "June–July 1520"
    when: "1520-06-30"
    borders: "1520-07-01"
    countries: [mx]
    view: {center: [-98.70, 19.52], size: [135, 85]}
    body:
      - Cortés’s return did not calm the city. The lords of Tenochtitlan chose Moctezuma’s brother Cuitláhuac as their ruler, and the Spaniards in the palace of Axayacatl were attacked day after day. Cortés made Moctezuma speak to his people from the palace roof; he was struck by stones and darts and died soon afterwards. Spanish accounts say his own people killed him, Aztec accounts that the Spaniards did.
      - On the rainy night of 30 June to 1 July 1520 the Spaniards and their allies tried to slip out of the city along the causeway to Tlacopan, carrying a portable bridge to cross the gaps where the bridges had been removed. They were seen, and warriors in hundreds of canoes attacked them along the causeway. Many drowned in the gaps, weighed down by armour and gold; the guns and most of the horses were lost, and Cacamatzin and a son of Moctezuma, held by the Spaniards, were among the dead. The Spaniards called it La Noche Triste, the Sad Night. Estimates of the dead range from about 150 to more than 1,000 Spaniards and from 1,000 to more than 4,000 of their allies.
      - The survivors went north round the lakes, harassed all the way. On 7 July, on the plain near Otumba, a large Aztec army under the cihuacoatl Matlatzincatzin caught them; the Spanish horsemen charged the Aztec commanders, and when one of their leaders was killed the army broke off the battle. On 11 or 12 July the survivors, nearly all wounded, reached Tlaxcala, whose rulers, over the objections of Xicotencatl the Younger, refused the Aztec envoys’ offers and kept the alliance.
    facts:
      - [La Noche Triste, "30 June – 1 July 1520"]
      - [Battle of Otumba, "7 July 1520"]
      - [Spanish dead, "about 150 to over 1,000 (sources differ)"]
