        lonlat: [-98.240, 19.313]
        lp: r
      - kind: toll
        side: es
        name: Cholula
        date: "October 1519"
        text: The Spaniards and their Tlaxcalan allies killed the nobles gathered in the temple courtyard and sacked the city. Spanish accounts give 3,000 to 6,000 dead.
        lonlat: [-98.302, 19.058]
        lp: b
      - kind: event
