  - title: Narváez and the Toxcatl massacre
    date: "April–June 1520"
    when: "1520-05"
    borders: "1520-05-15"
    countries: [mx]
    body:
      - In April 1520 a fleet of nineteen ships with about 1,400 men under Pánfilo de Narváez arrived on the coast, sent by Velázquez to arrest Cortés. Cortés left Pedro de Alvarado in Tenochtitlan to guard Moctezuma and marched to the coast with most of his Spaniards. Late in May he fell on Narváez by night at Cempoala, took him prisoner and won his men over with promises of gold.
      - In Tenochtitlan, meanwhile, the nobles held the festival of Toxcatl in the temple precinct. In mid-May, during the dancing, Alvarado’s men attacked the unarmed nobles and dancers, killing many of them. Alvarado said that he had learned of a plan to attack the Spaniards after the festival; the Nahua accounts describe a massacre without warning. The city rose and besieged the Spaniards in their palace.
      - Cortés hurried back with the men of both expeditions and Tlaxcalan warriors, by one account 1,300 Spaniards, 96 horses and 2,000 Tlaxcalans, and re-entered the city on 24 June 1520 to find it in revolt.
    facts:
      - [Toxcatl massacre, "mid-May 1520"]
      - [Narváez defeated at Cempoala, "late May 1520"]
      - [Cortés back in Tenochtitlan, "24 June 1520"]
