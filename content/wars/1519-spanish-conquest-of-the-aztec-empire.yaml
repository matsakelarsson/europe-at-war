  - title: Tenochtitlan
    date: "November 1519 – April 1520"
    when: "1519-11-08"
    borders: "1519-11-08"
    countries: [mx]
    view: {center: [-98.72, 19.25], size: [120, 80]}
    body:
      - The Spaniards crossed between the volcanoes Popocatépetl and Iztaccíhuatl and came down into the Valley of Mexico by Amecameca and Chalco. On 8 November 1519 Moctezuma met Cortés on the causeway from Iztapalapa, with the rulers of Texcoco and Tlacopan and his brother Cuitláhuac, and lodged the Spaniards in the palace of his father Axayacatl. Tenochtitlan, built on islands in Lake Texcoco, was one of the largest cities in the world; estimates of its population range from 60,000 to more than 300,000.
      - About a week later, after news came that Aztec forces under Qualpopoca had killed Spaniards left on the coast, Cortés seized Moctezuma in his own palace. Moctezuma went on ruling as Cortés’s prisoner. Qualpopoca and his captains were burned alive, the ruler of Texcoco, Cacamatzin, was arrested when he plotted against the Spaniards, and Moctezuma and his lords were made to swear allegiance to Charles V. The Spaniards melted down the treasure of Axayacatl and placed Christian images in the great temple, and the nobility of Tenochtitlan turned against them.
    facts:
      - [Entry into Tenochtitlan, "8 November 1519"]
      - [Moctezuma held prisoner, "from 14 November 1519"]
