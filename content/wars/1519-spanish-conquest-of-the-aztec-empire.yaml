  - title: Cholula
    date: "October 1519"
    when: "1519-10"
    borders: "1519-10-15"
    countries: [mx]
    body:
      - Moctezuma’s envoys urged Cortés to take the road to Tenochtitlan through Cholula, the most sacred city of central Mexico, with its great pyramid, which had left the Tlaxcalan alliance for the Aztecs two years before. Cortés went, with Totonac warriors and Tlaxcalan porters and fighters, a thousand of them by one account.
      - After two or three days the Cholulans stopped bringing food, and the Spaniards’ allies reported preparations against them; Malintzin said she had heard of a plan to kill them. Cortés gathered the nobles in the courtyard of the main temple and, on his command, the Spaniards and Tlaxcalans killed them and then sacked and burned the city. Cortés wrote that 3,000 people were killed in three hours, Gómara that 6,000 died, and one witness claimed 30,000, which is unlikely since many people had fled.
      - The Nahua accounts collected by Sahagún say that the victims were unarmed, and historians still disagree whether there was a plot at all. Cholula was given rulers friendly to Tlaxcala, and the news of the massacre spread fear through the cities of the empire. Moctezuma, blaming his own commanders for the plot, now invited Cortés to his capital.
    facts:
      - [Cholula massacre, "October 1519"]
      - [Killed, "3,000 to 6,000 in Spanish accounts"]
    markers:
