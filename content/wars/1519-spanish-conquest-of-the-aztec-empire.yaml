id: spanish-conquest-of-the-aztec-empire
name: Spanish conquest of the Aztec Empire
start: "1519-02-10"
end: "1521-08-13"
tier: A
summary: "The overthrow of the Aztec Triple Alliance by a few hundred Spaniards under Hernán Cortés and tens of thousands of Indigenous allies, above all the Tlaxcalans, between 1519 and 1521. Cortés landed on the Gulf coast in April 1519, won over the Totonacs of Cempoala and, after a short war, Tlaxcala, massacred the people of Cholula and entered Tenochtitlan in November, where he held Moctezuma II prisoner. In 1520 the city rose after the Toxcatl massacre, and the Spaniards were driven out with heavy losses on La Noche Triste. Smallpox then killed many people in central Mexico, among them Moctezuma’s successor Cuitláhuac. From Texcoco Cortés and his allies cut Tenochtitlan off by land and, with thirteen brigantines, by water; after a siege of about three months the city fell on 13 August 1521 and Cuauhtémoc was captured. The empire’s lands became New Spain."
countries: [mx]
sides:
  - id: es
    name: Spanish expedition (Hernán Cortés)
    polities: [spain, new-spain]
    ink: gold
    moves: Spanish moves
    success: Spanish success
  - id: al
    name: Indigenous allies (Tlaxcala, the Totonacs of Cempoala, Huexotzinco, Texcoco under Ixtlilxochitl II and others)
    polities: [tlaxcala, totonacs, huexotzinco, texcoco]
    ink: blue
