id: revolt-of-the-comuneros
name: Revolt of the Comuneros
start: "1520-04-16"
end: "1522-02-03"
tier: B
summary: A rising of the cities of Castile against the government of the young Charles I, the emperor Charles V, his Flemish advisers and the taxes he demanded before leaving for Germany. The rebel towns formed a Holy Junta and tried to rule in the name of his mother, Queen Joanna, but the great nobles rallied to the crown, and the comunero army was crushed at Villalar on 23 April 1521. Toledo held out under María Pacheco into 1522.
countries: [es, fr, pt]
sides:
  - id: com
    name: Comuneros
    polities: []
    ink: purple
    moves: Comunero moves
    success: Comunero success
  - id: roy
    name: Royalists
    polities: [spain]
    ink: gold
    moves: Royalist moves
    success: Royalist success
notes:
  - Dates are Julian, as usual for the period.
  - The comunidades were the councils that took over the rebel cities. At its height the Holy Junta spoke for fourteen cities, among them Toledo, Segovia, Salamanca, Valladolid, Ávila, León, Zamora, Toro and Madrid; Burgos left it in the autumn of 1520. Andalusia stayed loyal to the crown.
  - The revolt ran alongside the Revolt of the Brotherhoods in the Kingdom of Valencia, which had different causes. Since the 19th century the comuneros have been remembered as defenders of Castile’s liberties, and 23 April is now the regional day of Castile and León.
