notes:
  - Almost everything known about the battle comes from Antonio Pigafetta, an Italian member of the expedition. None of the European writers says that he saw Lapulapu, and it is not certain that Lapulapu fought in person. His name, first written Çilapulapu, has been spelled Lapulapu by the Philippine government since 2021. The date follows the Julian calendar used by the expedition.
