id: battle-of-mactan
name: Battle of Mactan
start: "1521-04-27"
end: "1521-04-27"
tier: C
summary: "The battle on the island of Mactan, off Cebu, in which the warriors of the datu Lapulapu defeated a landing party of Ferdinand Magellan’s Spanish expedition and killed Magellan. The expedition, sailing west to reach the Spice Islands, arrived among the Visayan islands in March 1521. At Cebu, Rajah Humabon made an alliance with Magellan and was baptised with his queen and many of his people, and Magellan required the neighbouring chiefs to submit to Humabon and to the King of Spain. On Mactan one of the two chiefs, Zula, sent gifts, but Lapulapu refused to submit or pay tribute. Before dawn on 27 April Magellan crossed to Mactan with about 60 Spaniards and 20 to 30 boats of Humabon’s warriors, whom he told to stay back and watch. Because of the reef the boats could not come near the shore, and Magellan waded in with 49 armoured men; the guns firing from the boats were out of range. Lapulapu’s men, about 1,500 according to the chronicler Antonio Pigafetta, attacked from the front and both flanks with arrows, bamboo spears and swords, aiming at the soldiers’ unprotected legs. Magellan burned some houses, was wounded in the leg and the arm and was killed in the shallows while covering the retreat. Pigafetta counted eight Spaniards and four baptised Cebuanos dead, and fifteen of the Mactan warriors. A few days later Humabon turned on his guests and had some two dozen of them killed at a feast, and the survivors sailed on; under Juan Sebastián Elcano one ship completed the first voyage around the world in 1522. Spain returned to the islands with Legazpi in 1565. In the Philippines Lapulapu is honoured as the first to resist foreign rule, and 27 April is Lapulapu Day."
