notes:
  - "The dates of the fight at Tunmen are uncertain: some accounts put it in April or May 1521, others give 21 June to 8 September 1521. The site of Tamão is also disputed; Tuen Mun, Lintin Island and Lantau Island have been proposed. Xicaowan is placed by the History of Ming in Xinhui county, but some researchers put it near Macau."
  - Chinese records count by the lunar calendar; the dates here are those of the Western accounts, in the Julian calendar.
