id: first-portuguese-ming-war
name: First Portuguese–Ming war
start: "1521"
end: "1522-08"
tier: C
summary: "The first armed clashes between China and a European power, fought at the mouth of the Pearl River. Portuguese ships from Malacca, which Portugal had taken in 1511 from a sultan who sent tribute to the Ming, reached Guangdong in 1513, and in 1517 Fernão Pires de Andrade brought an embassy under Tomé Pires to Guangzhou (Canton). In 1519 his brother Simão de Andrade built a fort at Tunmen (Tamão), kept other foreign traders away, struck a Ming official and was accused of buying or kidnapping Chinese children to sell as slaves in Malacca. Envoys of the exiled sultan of Malacca also complained of the Portuguese. After the Zhengde Emperor died on 20 April 1521 the court rejected the embassy and ordered the Portuguese out. Wang Hong, the coastal defence commander, blockaded the Portuguese ships at Tunmen with some fifty junks and fire ships in 1521; the Portuguese lost two ships and many men before a storm let the rest escape to Malacca. In August 1522 a new squadron under Martim Afonso de Melo Coutinho was beaten at Xicaowan, losing two ships and 42 men taken prisoner; 23 Portuguese prisoners were executed in Guangzhou in September 1523. Tomé Pires and his companions were held in Guangzhou, where Pires probably died in about 1524. The Ming copied the captured breech-loading guns as folangji, and the Portuguese traded illegally on the coast of Fujian and Zhejiang until officials in Guangdong let them settle at Macau in the 1550s."
