id: ottoman-conquest-of-hungary
name: Ottoman conquest of Hungary
start: "1521"
end: "1547"
tier: A
summary: The wars in which Suleiman the Magnificent broke the medieval Kingdom of Hungary. After taking Belgrade in 1521 the Ottomans destroyed the Hungarian army at Mohács in 1526, where King Louis II died; two rival kings, John Zápolya and the Habsburg Ferdinand I, then fought for the crown, Zápolya with Ottoman backing. Suleiman besieged Vienna in 1529 and was held up at Kőszeg in 1532, and in 1541 he occupied Buda, leaving Hungary divided between Habsburg Royal Hungary, Ottoman Hungary and the eastern kingdom that became the Principality of Transylvania.
countries: [hu, rs, hr, sk, at, si, ro, tr]
