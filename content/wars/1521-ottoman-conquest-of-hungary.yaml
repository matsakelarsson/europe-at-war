steps:
  - title: The fall of Belgrade
    date: 1521
    when: "1521-05"
    borders: "1521-08-29"
    countries: [rs, hu, tr]
    body:
      - Belgrade, where the Sava meets the Danube, had been the key to Hungary’s southern defences since John Hunyadi held it against Mehmed II in 1456. In 1520 the young Suleiman I became sultan, and Hungary was weak; its king, Louis II, was fifteen, and its great nobles were divided and its treasury empty. When Louis’s council refused the sultan’s demand for tribute and held his envoy, Suleiman led an army north from Constantinople in May 1521, with little help coming to Hungary from the rest of Christendom.
      - Suleiman himself took Šabac on the Sava, where the defenders were killed to the last man, while the grand vizier Piri Mehmed Pasha took Zemun and laid siege to Belgrade. The fortress had only about 700 defenders, and no relief army came. After weeks of bombardment and mining the citadel surrendered at the end of August; most sources give 29 August. About 70 defenders survived and were spared, and many of the Serbian townspeople were deported to Constantinople. The road up the Danube into Hungary was open.
    facts:
      - [Fall of Belgrade, "late August 1521 (usually dated 29 August)"]
      - [Defenders of Belgrade, "about 700"]
      - [Sultan, Suleiman I (r. 1520–1566)]
    markers:
      - kind: taken
        side: ot
        name: Šabac
        date: July 1521
        text: The first fortress to fall to Suleiman. Its defenders fought to the end and were all killed.
        lonlat: [19.7, 44.75]
        lp: l
      - kind: taken
        side: ot
        name: Zemun
        date: 1521
        text: Piri Mehmed Pasha took this fortress across the Sava from Belgrade before closing in on the city.
        lonlat: [20.4, 44.85]
        lp: l
      - kind: taken
        side: ot
        name: Belgrade
        date: late August 1521
        text: The citadel surrendered after weeks of siege. It stayed Ottoman, apart from short Habsburg occupations, until the 19th century.
        lonlat: [20.45, 44.82]
    arrows:
      - side: ot
        label: Suleiman I
        via: [[21.9, 43.32], [21.0, 44.15], [19.8, 44.7]]
      - side: ot
        label: Piri Mehmed Pasha
        via: [[21.1, 44.2], [20.6, 44.55], [20.42, 44.8]]
  - title: Mohács
    date: 1526
    when: "1526-04"
    borders: "1526-08-29"
    countries: [hu, hr, rs, tr]
    body:
      - In April 1526 Suleiman marched again with a large army, probably 50,000–60,000 fighting men and perhaps many more with the irregulars. Petrovaradin on the Danube fell in July after a stubborn defence, and in August the Ottomans crossed the Drava at Osijek on a bridge of boats. King Louis gathered some 25,000–30,000 men, Hungarians, Croats, Poles, Germans, Czechs and Serbs, at Mohács, but the Transylvanian army of John Zápolya and the Croatian troops of Christoph Frankopan were still far away. His commanders, among them Pál Tomori, archbishop of Kalocsa, chose to fight on the open plain rather than retreat to Buda.
      - The battle was fought on the afternoon of 29 August. A Hungarian charge broke into the Ottoman front line, but was caught by the janissaries and the guns and then surrounded; within a few hours the royal army was destroyed. More than 14,000 Hungarian soldiers died, among them seven bishops and archbishops, Tomori one of them, and 28 barons, and about 2,000 prisoners were killed after the battle. Louis drowned in the flooded Csele stream as he fled. Suleiman entered Buda, which had been abandoned, on 11 September; his troops burned it and Pest, and the army went home in October with much plunder and many captives, keeping only a few fortresses in Syrmia.
    facts:
      - [Battle of Mohács, "29 August 1526, Ottoman victory"]
      - [Hungarian army, "about 25,000–30,000"]
      - [Hungarian dead, "more than 14,000, with King Louis II"]
    markers:
      - kind: taken
        side: ot
        name: Petrovaradin
        date: July 1526
        text: This fortress on the Danube held out for about two weeks. Its fall opened the way into Syrmia and up the river.
        lonlat: [19.86, 45.25]
      - kind: event
        side: ot
        name: Osijek
        date: August 1526
        text: The Ottoman army crossed the Drava here on a bridge of boats, which was then destroyed behind it.
        lonlat: [18.69, 45.56]
        lp: l
      - kind: battle
        side: ot
        name: Battle of Mohács
        date: 29 August 1526
        text: The Hungarian army was destroyed in a few hours on the plain south of Mohács. King Louis II drowned while fleeing.
        lonlat: [18.65, 45.94]
      - kind: taken
        side: ot
        name: Buda
        date: 11 September 1526
        text: The royal capital had been abandoned by Queen Mary and the court. Suleiman stayed in the palace while his troops burned the town and Pest.
        lonlat: [19.04, 47.5]
    arrows:
      - side: ot
        label: Suleiman I
        via: [[20.45, 44.82], [19.86, 45.25], [18.7, 45.56], [18.62, 45.88]]
      - side: hu
        label: Louis II
        via: [[19.04, 47.5], [18.86, 46.95], [18.75, 46.4], [18.67, 46.0]]
      - side: ot
        label: To Buda
        via: [[18.75, 46.0], [18.95, 46.6], [19.07, 47.42]]
  - title: Two kings
    date: 1526–1528
    when: "1526-11-10"
    borders: "1528-03-31"
    countries: [hu, sk, hr, rs, at, pl, tr]
    body:
      - With Louis dead and childless, Hungary had two kings. The lesser nobles, who wanted a native ruler, proclaimed John Zápolya, voivode of Transylvania and the country’s richest lord, at Székesfehérvár on 10 November 1526, and he was crowned the next day. On 17 December a rival diet at Pozsony, led by magnates and churchmen, elected Ferdinand of Habsburg, archduke of Austria and brother of the Emperor Charles V, who had married Louis’s sister and claimed the throne by family treaties. The Croatian estates chose Ferdinand at Cetin on 1 January 1527, while many Slavonian nobles backed Zápolya.
      - In the south a Serbian soldier, Jovan Nenad, who called himself emperor, ruled much of the Bačka from Subotica until he was killed in 1527. That summer Ferdinand’s German mercenaries entered Hungary, took Buda and beat Zápolya at Tokaj on 27 September; Ferdinand was crowned at Székesfehérvár on 3 November. Defeated again at Szina in March 1528, Zápolya fled to Poland. From there he sent the Polish nobleman Hieronim Łaski to Constantinople, and in 1528 Suleiman agreed to support him as his vassal.
    facts:
      - [Zápolya crowned, 11 November 1526]
      - [Ferdinand elected at Pozsony, 17 December 1526]
      - [Battle of Tokaj, "27 September 1527, Habsburg victory"]
    markers:
      - kind: event
        side: zap
        name: Székesfehérvár
        date: 10–11 November 1526
        text: Hungarian kings were crowned here. Zápolya was proclaimed king by a diet of the lesser nobles and crowned the next day; Ferdinand was crowned in the same church a year later.
        lonlat: [18.41, 47.19]
        lp: l
      - kind: event
        side: hb
        name: Pozsony
        date: 17 December 1526
        text: A rival diet, led by magnates and prelates, elected Ferdinand I king of Hungary.
        lonlat: [17.11, 48.14]
      - kind: event
        side: hb
        name: Cetin
        date: 1 January 1527
        text: The Croatian estates, meeting in Cetin castle, chose Ferdinand as their king in return for his promise to defend Croatia.
        lonlat: [15.74, 45.16]
      - kind: event
        name: Subotica
        date: 1526–1527
        text: Seat of Jovan Nenad, the “Black Man”, who led a large Serbian peasant army in the Bačka and was killed in 1527.
        lonlat: [19.67, 46.1]
      - kind: battle
        side: hb
        name: Battle of Tokaj
        date: 27 September 1527
        text: Ferdinand’s army beat Zápolya’s on the Tisza, and much of the country went over to Ferdinand.
        lonlat: [21.41, 48.12]
        lp: b
      - kind: battle
        side: hb
        name: Battle of Szina
        date: March 1528
        text: A second defeat, near Košice, drove Zápolya out of the kingdom.
        lonlat: [21.27, 48.57]
    arrows:
      - side: hb
        label: Ferdinand’s army, 1527
        via: [[16.6, 48.1], [17.63, 47.68], [19.0, 47.55], [21.3, 48.1]]
      - side: zap
        label: Zápolya to Poland
        via: [[21.27, 48.62], [21.2, 49.4], [20.99, 50.01]]
  - title: The siege of Vienna
    date: 1529
    when: "1529-05-10"
    borders: "1529-10-15"
    countries: [at, hu, sk, tr]
    body:
      - Suleiman set out from Constantinople on 10 May 1529, but the spring rains were so heavy that he had to leave his largest siege guns behind and lost many camels on the way. On 18 August Zápolya met him on the field of Mohács and paid homage, and on 8 September Buda surrendered and was handed back to Zápolya. Most of the castles Ferdinand had taken gave up without a fight, and the army marched on up the Danube into Austria, its light cavalry raiding far ahead.
      - The siege of Vienna began on 27 September. Count Niklas Salm and Wilhelm von Roggendorf had perhaps 16,000 soldiers, with Spanish arquebusiers and German landsknechts among them, and some 5,000 armed citizens; the Ottomans may have had 75,000–100,000 men at the walls. Their miners blew several breaches, but every assault was thrown back. With winter coming, supplies short and more rain falling, a last great attack on 14 October failed, and the next day the army began its retreat, killing many of its captives as it went.
    facts:
      - [Siege of Vienna, 27 September – 15 October 1529]
      - [Defenders, "about 16,000 soldiers and 5,000 militia"]
      - [Buda handed to Zápolya, 8 September 1529]
    markers:
      - kind: event
        side: zap
        name: Mohács
        date: 18 August 1529
        text: On the battlefield of 1526 Zápolya met the sultan, kissed his hand and was recognised as king under Ottoman protection.
        lonlat: [18.68, 45.99]
      - kind: taken
        side: ot
        name: Buda
        date: 8 September 1529
        text: The capital surrendered and was given to Zápolya, who held it as the sultan’s vassal for the rest of his life.
        lonlat: [19.04, 47.5]
      - kind: held
        side: hb
        name: Siege of Vienna
        date: 27 September – 15 October 1529
        text: The old city walls were patched with earthworks and held against mines and assaults. The furthest point of the Ottoman advance until 1683.
        lonlat: [16.37, 48.21]
    arrows:
      - side: ot
        label: Suleiman I
        via: [[18.67, 45.95], [19.0, 47.4], [17.65, 47.72], [16.47, 48.15]]
  - title: Kőszeg
    date: 1530–1533
    when: "1532-04-25"
    borders: "1533-07-22"
    countries: [hu, at, si, hr, tr]
    body:
      - In 1530 Ferdinand’s army besieged Buda but could not take it. In April 1532 Suleiman led another huge army north, aiming, he said, to fight Charles V himself. In early August it stopped before Kőszeg, a small town near the Austrian border. Its captain, the Croatian nobleman Nikola Jurišić, had a handful of soldiers and several hundred townspeople and peasants, with almost no guns. For more than three weeks they beat off assault after assault while mines brought down parts of the walls.
      - How the siege ended is told two ways. In one account Jurišić refused to surrender; in the other he accepted a token surrender in which a few Ottoman soldiers raised their flag on the walls. Either way the sultan, with the season late, did not go on to Vienna, where Charles was gathering an imperial army of some 80,000 men. He turned south through Styria, plundering the land, while part of his raiding cavalry was destroyed at Leobersdorf. In 1533 a truce at Constantinople left Ferdinand the west and north of Hungary that he held, and Zápolya the rest as the sultan’s vassal.
    facts:
      - [Siege of Kőszeg, "August 1532, about 25 days"]
      - [Defender, Nikola Jurišić]
      - [Truce of Constantinople, 1533]
    markers:
      - kind: held
        side: hb
        name: Kőszeg
        date: August 1532
        text: Jurišić’s small garrison held this border town against the main Ottoman army for more than three weeks and is credited with saving Vienna from a second siege.
        lonlat: [16.55, 47.38]
      - kind: event
        side: hb
        name: Vienna
        date: September 1532
        text: Charles V gathered imperial, Spanish and Italian troops here, but the Ottomans had turned away and there was no battle.
        lonlat: [16.37, 48.21]
      - kind: battle
        side: hb
        name: Battle of Leobersdorf
        date: September 1532
        text: Imperial troops caught a large force of Ottoman raiding cavalry south of Vienna and destroyed it.
        lonlat: [16.22, 47.92]
        lp: l
    arrows:
      - side: ot
        label: Suleiman I
        via: [[18.69, 45.6], [17.6, 46.55], [16.65, 47.3]]
      - side: ot
        label: Through Styria
        via: [[16.5, 47.33], [15.5, 47.07], [15.65, 46.56], [16.4, 46.05]]
  - title: Buda and the three-way division
    date: 1537–1547
    when: "1537-10-09"
    borders: "1547-06"
    countries: [hu, ro, hr, at, tr]
    body:
      - In 1537 a Habsburg army under Johann Katzianer was destroyed at Gorjani in Slavonia. By the secret Treaty of Nagyvárad in February 1538 the two kings agreed to keep what they held, with Ferdinand to inherit Zápolya’s share. But in July 1540, days after the birth of his son John Sigismund, Zápolya died. His supporters, led by his widow Isabella and the monk George Martinuzzi, made the baby king, and the sultan accepted him. Ferdinand sent an army under Roggendorf to besiege Buda in May 1541.
      - Suleiman came to the city’s relief and routed the besiegers on 21 August. On 29 August, the anniversary of Mohács, while the Hungarian lords were in his tent, Ottoman soldiers took over Buda, and the city became the seat of an Ottoman province. Isabella and her son were sent east to rule the lands beyond the Tisza and Transylvania as Ottoman vassals. In 1543 the Ottomans took Pécs, Siklós, Esztergom and Székesfehérvár, and in 1544 Visegrád, Nógrád and Hatvan. By the Truce of Adrianople in 1547 Ferdinand agreed to pay 30,000 florins a year for his part of Hungary, which was now split three ways.
    facts:
      - [Ottomans occupy Buda, 29 August 1541]
      - [Treaty of Nagyvárad, 24 February 1538]
      - [Truce of Adrianople, "1547, tribute of 30,000 florins a year"]
    markers:
      - kind: battle
        side: ot
        name: Battle of Gorjani
        date: 9 October 1537
        text: After failing to take Osijek, Katzianer’s army of about 24,000 was caught in the marshes near Đakovo and destroyed. Katzianer fled and was later killed for treason.
        lonlat: [18.38, 45.4]
      - kind: treaty
        name: Treaty of Nagyvárad
        date: 24 February 1538
        text: A secret agreement between the two kings. Zápolya kept his lands for life, and Ferdinand was to inherit them.
        lonlat: [21.92, 47.07]
      - kind: taken
        side: ot
        name: Buda
        date: 29 August 1541
        text: After routing Roggendorf’s besieging army, the Ottomans took the city by surprise. It was the seat of an Ottoman province until 1686.
        lonlat: [19.04, 47.5]
      - kind: taken
        side: ot
        name: Esztergom
        date: August 1543
        text: The seat of Hungary’s archbishops fell after a short siege, followed in September by the coronation city of Székesfehérvár.
        lonlat: [18.74, 47.79]
      - kind: taken
        side: ot
        name: Pécs
        date: 1543
        text: The bishop’s city in southern Transdanubia surrendered to the Ottomans, as did nearby Siklós.
        lonlat: [18.23, 46.07]
    arrows:
      - side: ot
        label: Suleiman I, 1541
        via: [[19.86, 45.25], [18.95, 46.4], [19.05, 47.4]]
      - side: zap
        label: Isabella and John Sigismund
        via: [[19.15, 47.5], [21.0, 47.25], [23.57, 46.07]]
