notes:
  - Dates are Julian, as usual for the period. The numbers of soldiers come mostly from chroniclers and are uncertain; modern estimates are often much lower than the figures of the time.
  - Places are given by their usual English or modern names, with the Hungarian or German name where it is often used (Buda, Pozsony/Pressburg for Bratislava, Kőszeg/Güns, Nagyvárad for Oradea, Eszék for Osijek).
  - The fighting between the two kings and their backers in 1527–1538 is often called the Little War in Hungary. The later wars in Hungary have their own entries, among them the war of 1551–1562, the war of 1565–1568 with the siege of Szigetvár, the Long Turkish War of 1593–1606 and the Great Turkish War of 1683–1699.
