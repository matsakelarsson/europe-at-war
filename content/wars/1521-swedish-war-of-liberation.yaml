    body:
      - Gustav Eriksson Vasa escaped to Dalarna, and in January 1521 the people of northern Dalarna made him their commander. His peasant army took Västerås on 29 April 1521, the Sture party joined him, and later that year he became regent. In 1522 the Hanseatic city of Lübeck joined the war against Denmark with ships and money.
      - Kalmar fell on 27 May 1523. On 6 June, now Sweden’s national day, Gustav was elected king at Strängnäs, and Stockholm surrendered on 17 June after a siege of about two years. By September Finland too was in his hands. The Kalmar Union was over.
    facts:
      - - Elected king
        - 6 June 1523, at Strängnäs
      - - Ally
        - Lübeck, from 1522
