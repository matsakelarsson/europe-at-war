name: Swedish War of Liberation
start: "1521"
end: "1523"
tier: B
summary: The Swedish rising led by Gustav Vasa against Christian II of Denmark–Norway after the Stockholm Bloodbath. With help from Lübeck, Gustav drove out the Danish forces and was elected king in 1523, which ended the Kalmar Union.
