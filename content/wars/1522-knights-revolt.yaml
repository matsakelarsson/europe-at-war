id: knights-revolt
name: Knights’ Revolt
start: "1522-08"
end: "1523-05"
tier: C
summary: A rising of imperial knights from the Rhineland and Swabia, led by Franz von Sickingen and supported by the humanist Ulrich von Hutten, who hoped to win the Electorate of Trier for the Reformation and restore the declining power of the lesser nobility against the princes. Sickingen’s siege of Trier in September 1522 failed, and in the spring of 1523 the Archbishop-Elector of Trier, the Elector Palatine and Landgrave Philip of Hesse besieged him in his castle of Nanstein at Landstuhl. Mortally wounded by cannon fire, he surrendered on 6 May 1523 and died the next day. That summer the Swabian League destroyed some two dozen knights’ castles in Franconia, and Hutten died in exile on the island of Ufenau in Lake Zürich.
countries: [de]
sides:
  - id: kn
    name: Sickingen and the knights
    ink: brown
  - id: pr
    name: Trier, the Palatinate and Hesse
    polities: [palatinate, hesse]
