id: oromo-expansion
name: Oromo expansion
start: "1522"
end: "1618"
tier: C
summary: "The great movement of the Oromo from their homelands in the southern highlands, around the lakes and the Bale and Borana country, into much of what is now central, western and eastern Ethiopia in the 16th and early 17th centuries. The Oromo had no kings; they were organised in the gadaa system, in which age-sets of men took over leadership and warfare every eight years, and each gadaa period was expected to make its own raid (butta). The monk Bahrey, writing in about 1593 and the main written source, names the gadaa periods from Melbah (1522–1530) on, and his dates are the basis of the usual chronology, although some are questioned. Early raids reached Bale and Dawaro and returned home; from the 1550s the Oromo began to settle the lands they took. The Borana groups moved west and north into Shewa, Damot, Gojjam and the Gibe region, the Barentu east and north-east against Adal, Harar, Fatagar, Wollo and Angot. Both the Christian empire and the Muslim sultanate of Adal had been weakened by their war of 1529–1543, and neither could stop them: the emir Nur ibn Mujahid built the wall of Harar against Oromo raids, and the emperors Gelawdewos, Sarsa Dengel and Susenyos fought them for decades, while Sarsa Dengel and Susenyos also enlisted Oromo groups as allies and settled them in Gojjam and Begemder. The Ethiopian kingdom lost Fatagar, Bale, Dawaro and much of Shewa, and the Harari population fell sharply. Over time many Oromo adopted Christianity or Islam and settled as farmers, and Oromo lords became powerful at the Gondar court. Oromo historians such as Asafa Jalata count twelve butta wars between 1522 and 1618 and describe them as a recovery as well as an expansion, into lands lost to earlier Christian and Muslim conquests; the movement continued in places after that, and the Macha reached Ennarea in the early 18th century. Older works call these events the “Galla invasions”, using a name the Oromo reject; historians now speak of the Oromo expansion or migrations."
