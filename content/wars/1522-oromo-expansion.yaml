notes:
  - The Oromo kept no written records of the period. Its history rests on Bahrey’s History of the Galla (about 1593), Ethiopian royal chronicles, Portuguese and Arabic writings and Oromo oral tradition, which do not always agree on dates or on whether particular movements were raids or settlement.
