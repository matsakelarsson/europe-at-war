id: siege-of-rhodes-1522
name: Siege of Rhodes, 1522
start: "1522-06-26"
end: "1523-01-01"
tier: B
summary: Suleiman the Magnificent’s siege of Rhodes, held since 1310 by the Knights Hospitaller, a military religious order whose galleys raided Muslim shipping between Constantinople and Egypt. After six months of bombardment, mining and assaults, Grand Master Philippe Villiers de L’Isle-Adam surrendered on generous terms in December 1522, and the knights left the island; in 1530 they settled on Malta.
