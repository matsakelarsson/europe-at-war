steps:
  - title: Six months under the walls
    date: June 1522 – January 1523
    when: "1522-06-26"
    borders: "1522-12-22"
    countries: [gr, tr]
    body:
      - The knights of St John had ruled Rhodes and its neighbouring islands for two centuries, and their raids on Muslim ships and pilgrims were a constant affront to the sultans. On 26 June 1522 an Ottoman fleet of some 400 ships landed an army under Çoban Mustafa Pasha, and Suleiman came over from the mainland near Marmaris on 28 July to take command. The new grand master, Philippe Villiers de L’Isle-Adam, had about 700 knights and sergeants of the order and a few thousand mercenaries and Rhodian militia behind some of the strongest walls in Europe, each section held by one of the order’s national “tongues”.
      - The Ottoman guns and miners slowly broke the walls. On 4 September two mines brought down part of the bastion of England, and on 24 September a great assault on four bastions was thrown back with very heavy losses. Ahmed Pasha, an experienced siege engineer, took over and kept up the mining into the winter. With no relief coming from Europe and the townspeople pressing him, the grand master agreed terms on 22 December. The knights could leave with their arms, and the people who stayed were promised freedom of worship. On 1 January 1523 the knights sailed for Crete with several thousand Rhodians, and their castles at Bodrum and Kos were handed over.
