notes:
  - Dates are Julian. The size of the Ottoman army is uncertain; accounts of the time give 100,000 or more, including the men who rowed the fleet and dug the mines, and modern historians suggest fewer.
  - The knights had beaten off an earlier Ottoman siege in 1480, under Mehmed II, which has its own entry.
