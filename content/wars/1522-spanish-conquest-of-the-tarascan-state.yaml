id: spanish-conquest-of-the-tarascan-state
name: Spanish conquest of the Tarascan state
start: "1522"
end: "1530-02-14"
tier: C
summary: "The submission of the Purépecha (Tarascan) kingdom of Michoacán to the Spaniards and its end with the execution of its last king. The Purépecha state, ruled from Tzintzuntzan on Lake Pátzcuaro by a king the Spaniards called the cazonci, had by one estimate about a million people (others say up to 1.5 million) and had held off the Aztec Empire for half a century. In 1520 the cazonci Zuangua refused a Mexica request for an alliance against the Spaniards, and he died in the smallpox epidemic that followed. After the fall of Tenochtitlan his son Tangáxuan II (Tzintzicha) sent envoys to Cortés, and in 1522 Cristóbal de Olid marched into Michoacán with Spanish soldiers and many Mexica warriors. Tangáxuan chose not to fight his large army against them, fled for a time and then submitted; Olid occupied Tzintzuntzan for about four months and carried off its treasure in gold and silver, and the Purépecha helped the Spaniards reach the Pacific at Zacatula and conquer Colima in 1523. Tangáxuan was baptised Francisco and went on ruling, so that for some years Michoacán paid tribute both to him and to the Spanish encomenderos. In 1529 Nuño de Guzmán, president of the first Audiencia of Mexico, set out on his conquest of the west, took the cazonci with him and, with the help of a rival noble, Don Pedro Cuinierángari, had him tried for plotting rebellion, hiding treasure and other charges. Tangáxuan was tortured, and on 14 February 1530 he was executed by burning; his ashes were thrown into the Lerma River. Michoacán then came under direct Spanish rule, with Purépecha nobles as governors under Spanish oversight; Vasco de Quiroga, its first bishop, later founded his hospital towns there. Most of what is known of the Purépecha state comes from the Relación de Michoacán, written down about 1540 from the accounts of Purépecha nobles."
