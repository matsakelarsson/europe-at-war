notes:
  - "The Spaniards called the Purépecha Tarascans, a name many Purépecha today reject; the kingdom is also known as the Irechikwa or the Purépecha Empire. Guzmán’s conquest of the west, which began with the cazonci’s execution, has its own entry (Conquest of Nueva Galicia)."
