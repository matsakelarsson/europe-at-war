id: shan-conquest-of-ava
name: Shan conquest of Ava
start: "1523"
end: "1527"
tier: C
summary: "The conquest of Ava, the Burmese kingdom of Upper Burma, by the Confederation of Shan States led by Sawlon, the saopha (ruler) of Mohnyin, and its ally Prome, and the rule of Shan kings at Ava until 1555. From the early 1500s Mohnyin’s armies raided ever deeper into Ava’s lands, in 1505–1506 as far south as Dabayin and in 1511 taking Bhamo, while Prome broke away in the south and Toungoo in 1510. Late in 1523 the Confederation and Prome attacked together from north and south; Ava, helped by its loyal Shan ally Hsipaw, was slowly worn down, and on 22 March 1525 the allies sacked the capital. In 1527 they returned and besieged Ava again, and King Shwenankyawshin was killed by a gunshot in the fighting, on 14 March 1527 by one reckoning (others say April). Sawlon made his son Thohanbwa king of Ava, which became in effect another Shan state. In 1533 Sawlon and Thohanbwa sacked Prome, which they accused of failing them, and Sawlon was murdered by his own ministers on the way home. Thohanbwa’s rule is remembered in the chronicles for his hostility to the Buddhist clergy; in 1540 he had 360 monks killed and their manuscripts burned. Many Burmans fled to Toungoo, which grew strong enough to conquer Lower Burma in 1534–1541. Thohanbwa was assassinated by his chief minister in May 1542 and the throne passed to Hkonmaing of Hsipaw; Shan and Burman rulers then contested Ava until Bayinnaung of Toungoo took the city in January 1555."
