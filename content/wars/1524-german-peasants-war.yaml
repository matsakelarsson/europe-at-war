id: german-peasants-war
name: German Peasants’ War
start: "1524"
end: "1526"
tier: B
summary: The largest popular rising in Europe before the French Revolution, in which peasants, miners and townspeople across southern and central Germany and the Austrian Alps rose against their lords in 1524–1525, many of them inspired by the Reformation and the Twelve Articles. The armies of the Swabian League and the princes crushed the bands one after another, and by common estimates about 100,000 people were killed.
countries: [de, at, it, fr]
sides:
  - id: peas
    name: Rebel peasants and townspeople
    ink: red
    moves: Rebel moves
    success: Rebel success
  - id: lords
    name: Swabian League and the princes
    polities: [bavaria, habsburg, hesse, saxony, brunswick, salzburg]
    ink: navy
    moves: Moves of the League and the princes
    success: Success for the League and the princes
notes:
  - The rebel armies were known as Haufen, “bands”, named after their home districts. Numbers of rebels and of dead are uncertain; about 100,000 dead is the figure most often given.
  - Württemberg was ruled by the Habsburgs from 1520 to 1534, after the Swabian League had driven out Duke Ulrich, and Archduke Ferdinand governed it at the time of the war.
