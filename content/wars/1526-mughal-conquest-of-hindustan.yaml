notes:
  - Dates are in the Julian calendar, as the sources give them; the Gregorian calendar was introduced only in 1582.
  - Babur’s own memoir, the Baburnama, is the main source for these campaigns. Its figures for his enemies’ armies (100,000 men at Panipat, 200,000 at Khanwa) are generally thought to be much exaggerated, and modern estimates vary widely.
  - "“Mughal” is the name later given to the dynasty, from the Persian word for Mongol. Babur called himself a Timurid and his people Turks."
