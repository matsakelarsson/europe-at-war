steps:
  - title: Kabul and the Punjab
    date: 1519–1525
    when: "1525-11"
    borders: "1525-12-16"
    countries: [af, pk]
    body:
      - "Zahir al-Din Muhammad Babur was a Timurid prince, descended from Timur on his father’s side and from Genghis Khan on his mother’s. Driven out of his home in the Fergana valley, and twice out of Samarkand, by the Uzbeks of Muhammad Shaybani, he took Kabul in 1504 and made it his kingdom. After a last attempt on Samarkand failed in 1512, he turned east, claiming the Punjab as land once conquered by Timur."
      - "In January 1519 he stormed the fortress of Bajaur and had its garrison put to death; the town of Bhera on the Jhelum then submitted to him. More raids followed. In 1524 Daulat Khan Lodi, the governor of Lahore, and Alam Khan, an uncle of the Delhi sultan Ibrahim Lodi, asked Babur for help against the sultan. Babur defeated a Lodi army near Lahore, took the city and went on to Dipalpur, but he quarrelled with Daulat Khan, who wanted the Punjab for himself, and went back to Kabul."
      - "In November 1525 Babur set out again, joined by his son Humayun with troops from Badakhshan. He crossed the Indus in mid-December with, by his own count, about 12,000 fighting men, forced Daulat Khan to give up his hill fort, and marched south-east towards Delhi. In February 1526 Humayun scattered a Lodi force near Hisar."
    facts:
      - [Kabul taken by Babur, "1504"]
      - [Storming of Bajaur, "January 1519"]
      - [Lahore taken, "1524"]
      - [Indus crossed, "December 1525"]
