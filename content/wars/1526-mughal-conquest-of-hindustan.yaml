id: mughal-conquest-of-hindustan
name: Babur’s conquest of Hindustan
start: "1526"
end: "1530-12-26"
tier: A
summary: "The campaigns in which Babur, the Timurid ruler of Kabul, conquered the heart of northern India and founded the Mughal Empire. Invited by rebels against the Delhi sultan Ibrahim Lodi, he crossed the Indus in December 1525 with about 12,000 men and, with field guns and a line of carts lashed together, destroyed Ibrahim’s much larger army at Panipat on 21 April 1526. He went on to defeat the Rajput confederacy of Rana Sanga of Mewar at Khanwa in 1527, stormed the fortress of Chanderi in 1528 and broke the Afghan chiefs of the east and the army of Bengal on the Ghaghra in 1529. When he died at Agra in December 1530, his son Humayun inherited a new and unsettled realm that reached from Kabul and Kandahar to the borders of Bihar."
