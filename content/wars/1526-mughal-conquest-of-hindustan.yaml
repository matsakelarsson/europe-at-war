  - title: Khanwa
    date: 16 March 1527
    when: "1527-03-16"
    borders: "1527-03-16"
    countries: [in]
    body:
      - "Rana Sangram Singh of Mewar, known as Rana Sanga, was the strongest ruler in Rajasthan and had fought the sultans of Delhi, Gujarat and Malwa with success. He seems to have expected Babur to plunder and leave, as Timur had done in 1398. When Babur stayed, Sanga gathered a confederacy of Rajput rulers and chiefs, among them Medini Rai of Chanderi, and was joined by Afghans opposed to Babur, among them Hasan Khan Mewati, the ruler of Mewat, and Mahmud Lodi, a brother of Ibrahim who claimed the throne. In February 1527 a Mughal advance force was badly beaten near Bayana."
      - "Babur’s men were shaken by the defeat and by an astrologer’s warning. Babur answered with a public act of repentance. He gave up wine, had his gold and silver drinking cups broken up, abolished a tax on Muslims and declared the coming battle a holy war. On 16 March he drew up his army near the village of Khanwa, about 60 km west of Agra, as he had at Panipat, behind chained carts and ditches, with guns and matchlocks in the centre."
      - "For hours Rajput charges fell on the Mughal line. Babur held his centre with gunfire and sent his flanking parties round the wings, and in the afternoon the confederate army broke. Hasan Khan Mewati was among the dead, and Sanga was carried from the field wounded. Losses were heavy on both sides. Babur had a tower of enemy heads raised and took the title ghazi, warrior of the faith."
      - "Babur put the Rajput army at 200,000, which historians regard as greatly exaggerated. Sanga planned a new campaign but died at Kalpi in January 1528, reportedly poisoned by nobles who did not want another war. After Khanwa no single power in northern India could challenge Babur in the field, and he took Mewat a few weeks later."
    facts:
      - [Battle of Khanwa, "16 March 1527, Mughal victory"]
      - [Hasan Khan Mewati, "killed in the battle"]
      - [Rana Sanga, "wounded; died January 1528"]
