  - title: Delhi and Agra
    date: April 1526 – February 1527
    when: "1526-04-24"
    borders: "1526-06"
    countries: [in]
    body:
      - "Babur sent Humayun ahead to secure Agra and its treasury, and rode to Delhi, where on 27 April the Friday prayer was read in his name. At Agra the family of Raja Vikramajit of Gwalior, who had died fighting for Ibrahim, gave Humayun their jewels, among them a great diamond that is often identified with the Koh-i-Noor. Babur reached Agra in early May and gave away much of Ibrahim’s treasure to his officers, to his family in Kabul and to the holy cities of Mecca and Medina."
      - "The victory gave Babur Delhi and Agra, but not yet Hindustan. Afghan nobles held most of the forts around Agra and the lands to the east, villages emptied as his troops approached, and many of his own officers, worn down by the heat of the Indian summer, wanted to take their plunder home to Kabul. Babur decided to stay, and in a speech recorded in his memoir persuaded most of them to stay with him."
      - "Over the winter several Afghan chiefs came over to him, the forts of Dholpur, Bayana and Gwalior passed into Mughal hands, and early in 1527 Humayun marched east and took Jaunpur and Ghazipur. He was recalled to Agra when news came that Rana Sanga of Mewar was advancing."
    facts:
      - [Friday prayer read for Babur in Delhi, "27 April 1526"]
      - [Babur reaches Agra, "early May 1526"]
      - [Jaunpur taken by Humayun, "early 1527"]
