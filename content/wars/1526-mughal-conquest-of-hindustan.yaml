  - title: Chanderi and the east
    date: January – June 1528
    when: "1528-01"
    borders: "1528-03"
    countries: [in]
    body:
      - "In the winter of 1527–28 Babur marched against Medini Rai, the Rajput lord of Chanderi, a strong hill fortress on the borders of Malwa. Medini Rai refused Babur’s offer of another fort in exchange. In January 1528 Babur’s men stormed the walls. The women and children inside died in a jauhar, the mass self-immolation of Rajput women facing capture, and the defenders fought to the death, Medini Rai among them according to most accounts. Babur had another tower of heads raised."
      - "He had meant to go on against Raisen and Mewar, but news came that the Afghan chiefs Biban and Bayazid had pushed his officers back across the Ganges and taken Kannauj. Babur turned north-east, built a bridge of boats over the Ganges at Kannauj under fire from the Afghans on the far bank and crossed in March 1528; the Afghans fell back beyond Awadh. Babur spent the following months securing the lands between the Ganges and the Ghaghra, the old kingdom of Awadh."
    facts:
      - [Chanderi stormed, "January 1528"]
      - [Ganges bridged at Kannauj, "March 1528"]
    markers:
