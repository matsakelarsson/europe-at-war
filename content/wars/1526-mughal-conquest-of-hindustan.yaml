  - title: Panipat
    date: 21 April 1526
    when: "1526-04-21"
    borders: "1526-04-20"
    countries: [in]
    body:
      - "Ibrahim Lodi, sultan of Delhi since 1517, had fallen out with many of his Afghan nobles, but he could still raise a far bigger army than Babur’s. He marched north from Agra, and in April 1526 the two armies met near Panipat, about 90 km north of Delhi. Babur rested one flank on the town, protected the other with ditches and felled trees, and across his front lashed together some 700 carts with ropes of rawhide, leaving gaps through which his horsemen could charge. Behind them stood his matchlockmen and the guns of his gunners Ustad Ali Quli and Mustafa."
      - "For about a week neither side attacked. Early on 21 April Ibrahim advanced. His columns crowded against Babur’s line, where guns and matchlocks fired into them at close range, while Babur’s mounted archers swept round both flanks and shot into them from the rear, a Central Asian manoeuvre Babur called the tulughma. By midday the sultan’s army had broken. Ibrahim was killed with thousands of his men; Babur was told that 15,000 to 16,000 lay dead around him, and later estimates run higher."
      - "Babur put Ibrahim’s army at 100,000 men and 1,000 elephants against his own 12,000. Modern historians agree that he was heavily outnumbered but treat his figures as round numbers, and some estimate the sultan’s army at 50,000 or fewer. The battle ended the Lodi dynasty and with it the Delhi Sultanate, which had ruled much of northern India since the early 13th century."
    facts:
      - [First Battle of Panipat, "21 April 1526, Mughal victory"]
      - [Babur’s army, "about 12,000 fighting men (his own figure), with field guns"]
      - [Ibrahim Lodi, "killed in the battle"]
    markers:
