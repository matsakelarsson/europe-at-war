  - title: The Ghaghra
    date: 1529–1530
    when: "1529-05-06"
    borders: "1529-05-06"
    countries: [in]
    body:
      - "Early in 1529 the Afghan chiefs of Bihar proclaimed Mahmud Lodi, who had escaped from Khanwa, as their sultan, and advanced up the Ganges. Babur marched east from Agra and the Afghans fell back before him. The army of Nusrat Shah, sultan of Bengal, who had given the Afghan leaders shelter, stood on the far bank of the Ghaghra where it flows into the Ganges, near today’s Revelganj."
      - "On 6 May 1529 Babur’s guns under Ustad Ali Quli bombarded the Bengal camp and its boats across the river while Mughal columns crossed the Ghaghra upstream and attacked from the flank. The Bengal army was routed. Many Afghan chiefs, among them Jalal al-Din Lohani, the young ruler of Bihar, submitted to Babur, and Nusrat Shah soon accepted the peace Babur had offered before the battle, keeping his kingdom and promising not to shelter Babur’s enemies. It was Babur’s last battle."
      - "Babur went back to Agra. In 1530 Humayun fell gravely ill, and Mughal tradition says that Babur walked round his son’s bed and offered his own life in exchange. Humayun recovered, and Babur died at Agra on 26 December 1530, aged 47. He was buried in Agra and later, as he had wished, in a garden at Kabul. His empire reached from Kabul and Kandahar to the borders of Bihar, but the Afghan chiefs of the east, among them Sher Khan Sur, had not given up, and within ten years Humayun had lost it."
    facts:
      - [Battle of the Ghaghra, "6 May 1529, Mughal victory"]
      - [Peace with Bengal, "1529"]
      - [Death of Babur, "26 December 1530, at Agra"]
    markers:
