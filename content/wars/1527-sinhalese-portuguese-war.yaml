  - title: Randeniwela
    date: 1630–1634
    when: "1630-08-25"
    borders: "1630-08-25"
    countries: [lk, pt]
    body:
      - "The captain-general Constantino de Sá de Noronha set out to finish Kandy. In August 1630 he invaded the eastern province of Uva with about 1,500 Portuguese and many lascarins, and burned Badulla. As his army withdrew, it was caught at Randeniwela near Wellawaya on 25 August 1630 by the Kandyan army under King Senarat’s son, Prince Maha Astana. The lascarins went over to the Kandyans, and heavy rain soaked the Portuguese powder and the slow matches of their muskets. The army was destroyed, and Sá de Noronha died with most of his men."
      - "The Kandyans swept into the lowlands and besieged Colombo for more than a year, until reinforcements from Goa saved it. In 1634 Kandy and the Portuguese made peace, but neither side kept it for long. Senarat died in 1635, and Maha Astana became king as Rajasinghe II."
    facts:
