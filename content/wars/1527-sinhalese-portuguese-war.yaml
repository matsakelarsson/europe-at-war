  - title: Kotte inherited, Kandy defiant
    date: 1597–1621
    when: "1597-05"
    borders: "1597-06"
    countries: [lk, pt]
    body:
      - "Dharmapala died in Colombo in May 1597, and under his will the king of Portugal, Philip I (Philip II of Spain), became king of Kotte. According to Portuguese accounts, the chiefs of the lowlands met at Malwana and accepted the new king on condition that their laws and customs were kept. For the next sixty years the Portuguese ruled the coastal lowlands, collecting cinnamon, land revenue and taxes through the old Sinhalese officials. The captain-general Jerónimo de Azevedo (1594–1612) put down risings in the lowlands with great harshness."
      - "Azevedo also invaded Kandy, but Vimaladharmasuriya defeated him at Balana in 1602, and in 1603 a Portuguese advance on Kandy collapsed when the lascarins rose behind it. Kandy began to look for other European allies. In 1602 the Dutch captain Joris van Spilbergen landed at Batticaloa and visited the king. Vimaladharmasuriya died in 1604, and his cousin Senarat, who married Dona Catarina, carried on the war of raids until a peace in 1617 under which he paid the Portuguese a small tribute. In the 1620s the Portuguese built forts at Trincomalee and Batticaloa, Kandy’s outlets to the sea, to keep foreign help away."
    facts:
      - [Death of Dharmapala, "May 1597"]
      - [Battle of Balana, "1602, Kandyan victory"]
      - [Peace with Senarat, "1617"]
    markers:
