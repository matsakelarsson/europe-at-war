  - title: Kandy rises, Sitawaka falls
    date: 1588–1593
    when: "1592"
    borders: "1593-06"
    countries: [lk, pt]
    body:
      - "Kandy rose against Sitawaka in 1588. In 1592 the Portuguese placed a Kandyan prince they had brought up, Yamasinghe Bandara, baptised Dom Filipe, on the throne of Kandy, but he soon died, it was rumoured by poison. The throne was then taken by Konappu Bandara, a Kandyan noble who had served the Portuguese as a soldier under the name Dom João of Austria. He returned to Buddhism and ruled as Vimaladharmasuriya I."
      - "Rajasinghe I marched to recover Kandy but failed. Wounded in the foot by a bamboo splinter at Pethangoda, he died in March 1593 (some sources say 1592), probably of an infected wound. Sitawaka fell into a struggle over the succession, and its nobles began to go over to the Portuguese. A Portuguese force of about 950 Portuguese and 6,000 Sinhalese under Pedro Homem Pereira won a series of battles and sacked Sitawaka."
    facts:
      - [Vimaladharmasuriya I seizes Kandy, "1592"]
      - [Death of Rajasinghe I, "March 1593"]
    markers:
