notes:
  - Most Portuguese armies in Sri Lanka were largely made up of lascarins, Sinhalese and other local soldiers serving the Portuguese, whose loyalty often decided battles. Kotte, under the Christian king Dharmapala from 1551, fought on the Portuguese side.
  - The main sources are Portuguese chroniclers (Diogo do Couto, Fernão de Queiroz, João Ribeiro) and the Sinhalese chronicles (the Rajavaliya, the Culavamsa and war poems). They differ widely on numbers and sometimes on dates; the Battle of Mulleriyawa, for instance, is dated 1559 or 1562.
  - Dates before 1582 are in the Julian calendar. The last phase of the war, from 1638, is told in the Dutch–Portuguese War in Ceylon.
