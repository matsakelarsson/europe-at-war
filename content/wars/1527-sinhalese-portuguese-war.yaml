  - title: Gannoruwa
    date: March 1638
    when: "1638-03-28"
    borders: "1638-03-28"
    countries: [lk, pt]
    body:
      - "Rajasinghe II opened talks with the Dutch, who were at war with Spain and Portugal and had been attacking Portuguese ships off the island. To strike before the Dutch could come, the captain-general Diogo de Melo de Castro marched on Kandy in March 1638 with about 900 Portuguese and several thousand lascarins. He found the city abandoned and burned it."
      - "On the way back the army was surrounded on the hill of Gannoruwa, above the Mahaweli river near Peradeniya. On 28 March 1638 the Kandyans attacked; the lascarins deserted, and the Portuguese were killed almost to a man, by one account only 33 surviving. Melo de Castro was among the dead. It was the last great battle between the Portuguese and a Sinhalese king. Two months later a Dutch fleet took Batticaloa, and Rajasinghe signed a treaty with the Dutch East India Company to drive the Portuguese from the island."
    facts:
      - [Battle of Gannoruwa, "28 March 1638, Kandyan victory"]
      - [Portuguese losses, "almost the whole army; about 33 Portuguese survived by one account"]
