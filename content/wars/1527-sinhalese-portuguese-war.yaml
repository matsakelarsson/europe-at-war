steps:
  - title: Kotte divided
    date: 1521–1551
    when: "1527"
    borders: "1527"
    countries: [lk, pt]
    body:
      - "Portuguese ships first reached Sri Lanka in 1505 or 1506, and in 1518 the king of Kotte, the main Sinhalese kingdom, allowed them to build a fort at Colombo, the island’s chief port for cinnamon. In 1521 three sons of King Vijayabahu VII killed their father and divided the kingdom in an event remembered as the Vijayaba Kollaya. Bhuvanekabahu VII kept Kotte, Mayadunne took Sitawaka in the hills to the east, and their brother took Raigama in the south."
      - "Mayadunne wanted all of Kotte. From 1527, allied with the Zamorin of Calicut, whose fleets fought the Portuguese along the coasts of India, he attacked his brother again and again. Bhuvanekabahu turned to the Portuguese, and troops sent from Goa and Cochin helped him drive back the Sitawaka armies in 1527–28 and four more times between 1537 and 1543. In 1538 Mayadunne annexed Raigama, but the next year, after the Portuguese destroyed a Calicut fleet at Vedalai on the Indian coast, he gave up the alliance with Calicut."
      - "In 1543 Bhuvanekabahu had a golden statue of his grandson Dharmapala crowned in Lisbon, to secure Portuguese backing for the boy as his heir. Portuguese help came at a price: missionaries, demands for cinnamon, and Portuguese captains who acted on their own account. In 1550 a viceroy, Afonso de Noronha, came with several hundred soldiers and sacked Sitawaka, and in 1551 Bhuvanekabahu was shot dead by a Portuguese soldier, by accident according to the Portuguese."
    facts:
      - [Portuguese fort at Colombo, "1518"]
      - [Partition of Kotte, "1521"]
      - [Death of Bhuvanekabahu VII, "1551"]
