  - title: Rajasinghe I and the siege of Colombo
    date: 1581–1588
    when: "1582"
    borders: "1587-06-04"
    countries: [lk, pt]
    body:
      - "Mayadunne died in 1581 and Tikiri Bandara succeeded him as Rajasinghe I. In 1580 Dharmapala, who had no heir, had left his kingdom by deed to the king of Portugal, a claim Sitawaka did not accept. In 1582 Rajasinghe conquered the hill kingdom of Kandy; its king fled to the Portuguese at Trincomalee with his young daughter Kusumasana Devi, who was raised as a Christian under the name Dona Catarina."
      - "On 4 June 1587 Rajasinghe laid siege to Colombo with, according to the Portuguese, some 50,000 men, thousands of pack animals, cannon and a fleet of light galleys to blockade the harbour. The garrison under João Correia de Brito had about 300 Portuguese soldiers and 700 lascarins, with tens of thousands of townspeople and refugees inside the walls. A great assault on 3 August was beaten back with heavy losses, and through the monsoon ships from Goa and Malacca brought in more men and food."
      - "In February 1588 a fleet of 18 galleys arrived with some 2,000 more Portuguese soldiers, and Rajasinghe lifted the siege. Portuguese accounts put his losses over the eight months at about 5,000 men. In the years that followed, Kandyan nobles rose against his rule, and Buddhist chronicles condemn him for turning to Shaivism and persecuting monks."
    facts:
      - [Kandy conquered by Sitawaka, "1582"]
      - [Siege of Colombo, "4 June 1587 – February 1588"]
      - [Garrison, "about 300 Portuguese and 700 lascarins"]
