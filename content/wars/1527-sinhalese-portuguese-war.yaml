  - title: Mulleriyawa, and the end of Kotte
    date: 1551–1565
    when: "1557-11"
    borders: "1559"
    countries: [lk, pt]
    body:
      - "Dharmapala, still a boy, ruled Kotte under Portuguese protection, and in 1557 he was baptised as Dom João. Many Buddhist monks and nobles turned to Mayadunne, who now posed as the defender of Sinhalese Buddhism. In November 1557, according to the Portuguese, some 50,000 Sitawaka troops laid siege to Kotte. It held out for a year until Portuguese reinforcements arrived and the besiegers withdrew."
      - "In 1559 Mayadunne’s son Tikiri Bandara, later King Rajasinghe I, caught a Portuguese army in the marshes of the Kelani valley at Mulleriyawa, a few kilometres from Kotte. According to the Sinhalese chronicle Rajavaliya, 1,600 Portuguese and lascarins were killed. It was the worst defeat Portuguese arms had yet suffered in Asia."
      - "Sitawaka pressed on. In 1564 its armies besieged Kotte and Colombo, and in 1565 the Portuguese abandoned Kotte, the old capital, and moved Dharmapala and his court into Colombo. Sitawaka now held most of the old kingdom’s lands, while the Portuguese held Colombo and a few coastal points, supplied by sea."
    facts:
      - [Siege of Kotte, "November 1557 – November 1558"]
      - [Battle of Mulleriyawa, "1559 (some sources 1562), Sitawaka victory"]
      - [Kotte abandoned, "1565"]
