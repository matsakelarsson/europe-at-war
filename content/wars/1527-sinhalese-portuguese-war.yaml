id: sinhalese-portuguese-war
name: Sinhalese–Portuguese War
start: "1527"
end: "1658"
tier: A
summary: "More than a century of wars between the Portuguese and the Sinhalese kingdoms of Sri Lanka. The Portuguese, who had a fort at Colombo from 1518, came in as protectors of the kingdom of Kotte against Mayadunne of Sitawaka, one of the three kingdoms into which Kotte split in 1521. Sitawaka besieged Kotte, defeated the Portuguese at Mulleriyawa in 1559 and forced them to abandon Kotte in 1565; under Rajasinghe I it conquered Kandy and in 1587–88 besieged Colombo for eight months. After Rajasinghe’s death in 1593 Sitawaka collapsed, and in 1597 the Portuguese crown inherited Kotte and ruled the lowlands. The hill kingdom of Kandy resisted every Portuguese invasion, destroying their armies at Danture in 1594, Randeniwela in 1630 and Gannoruwa in 1638. In 1638 Kandy allied with the Dutch, who by 1658 had taken every Portuguese fort on the island."
countries: [lk, pt]
sides:
  - id: pt
    name: Portugal and Kotte
    polities: [portugal, sinhala]
    ink: blue
    moves: Portuguese and allied moves
    success: Portuguese success
  - id: sit
