  - title: Danture
    date: July – October 1594
    when: "1594-07-05"
    borders: "1594-07-05"
    countries: [lk, pt]
    body:
      - "In 1594 the Portuguese set out to make Dona Catarina, the heir of the old Kandyan line, queen of Kandy under their protection. The captain-general Pedro Lopes de Sousa led some 20,000 men, about 1,000 of them Portuguese and most of the rest lascarins under the Sinhalese commander Jayavira Bandara, with Badaga mercenaries from south India and 47 elephants. On 5 July they forced the Balana pass, the gateway to the hill country, and entered Kandy, where Catarina was crowned."
      - "Vimaladharmasuriya withdrew into the hills and wore the invaders down with raids. When Portuguese captains, suspecting him of treachery, killed Jayavira, the lascarins began to desert, and a column of about 3,000 sent into Uva was destroyed. In October the Portuguese began to retreat towards Colombo. At Danture, a few kilometres west of Kandy, the Kandyan army, swollen by deserters to perhaps 10,000 to 20,000, fell on the remnant on 8 October. The next day Lopes de Sousa surrendered with 93 Portuguese and died of his wounds; only a handful of men reached Colombo."
      - "Vimaladharmasuriya married Dona Catarina, which gave his rule the legitimacy of the old royal line, and Kandy remained independent until 1815."
    facts:
      - [Balana pass forced, "5 July 1594"]
      - [Battle of Danture, "8 October 1594, Kandyan victory"]
      - [Portuguese surrender, "9 October 1594"]
