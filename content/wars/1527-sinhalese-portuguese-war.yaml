        lonlat: [80.635, 7.293]
      - kind: taken
        side: pt
        name: Sitawaka
        date: 1593
        text: Sacked by Pedro Homem Pereira after Rajasinghe’s death. The kingdom did not survive.
        lonlat: [80.21, 6.95]
