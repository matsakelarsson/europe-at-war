steps:
  - title: First contacts
    date: "1511–1519"
    when: "1517"
    borders: "1517-03-01"
    countries: [mx]
    body:
      - After the fall of Mayapan in the 1440s, northern Yucatán was divided among sixteen to twenty-four Maya provinces, each with its own lords, often at war with one another. Two of the strongest were Maní, ruled by the Xiu, and Sotuta, ruled by the Cocom, and they were bitter enemies. There was no capital whose fall would bring down the rest, and the conquest took twenty years.
      - The first Spaniards to stay in Yucatán were the survivors of a shipwreck in 1511. Their captain and several others were sacrificed; Gerónimo de Aguilar and Gonzalo Guerrero escaped and lived as slaves of Maya lords, and Guerrero later married and rose to high rank in Chetumal. In 1517 Francisco Hernández de Córdoba sailed from Cuba with about 100 men to explore and take slaves. The Maya ambushed his men near Cape Catoche, warned them off at Campeche, and at Champotón attacked them at dawn; the Spaniards lost more than fifty men in an hour’s fighting and called the place the Coast of the Disastrous Battle. Hernández died of his wounds in Cuba.
      - Juan de Grijalva followed the same coast in 1518 with four ships and 240 men and brought back news of the Aztec Empire, and Hernán Cortés stopped at Cozumel in 1519, where Aguilar joined him while Guerrero stayed with the Maya. Cortés sent one of his captains, Francisco de Montejo, a veteran of the Grijalva voyage, to Spain with treasure for the king. Montejo stayed seven years and on 8 December 1526 received the right to conquer and settle Yucatán, with the hereditary title of adelantado.
    facts:
      - [Shipwreck of Aguilar and Guerrero, "1511"]
      - [Hernández de Córdoba defeated at Champotón, "1517"]
      - [Montejo’s royal grant, "8 December 1526"]
