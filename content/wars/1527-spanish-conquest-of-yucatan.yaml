  - title: Ciudad Real and the withdrawal
    date: "1532–1540"
    when: "1533"
    borders: "1533-06-01"
    countries: [mx]
    body:
      - Montejo the Younger was sent north into the Cupul province, whose lord Naabon Cupul reluctantly let him found a Spanish town, Ciudad Real, among the ruins of Chichen Itza. Montejo divided the province among his soldiers, giving each two to three thousand Maya in encomienda. After six months Naabon Cupul was killed trying to kill Montejo, and in mid-1533 the Cupul besieged the garrison. Montejo slipped away by night and fled west to the Chel, Pech and Xiu provinces, which stayed loyal; Namux Chel received him at Dzilam, and in the spring of 1534 he rejoined his father near Tʼho, where Mérida stands today. His father had meanwhile visited the Xiu ruler at Maní, and the friendship of the Xiu would be the Spaniards’ greatest asset.
      - News of Francisco Pizarro’s plunder in Peru drew Montejo’s men away, and in seven years they had found very little gold in Yucatán. At the end of 1534 or early in 1535 the Montejos withdrew from Campeche to Veracruz, and the elder Montejo became caught up in a dispute with Pedro de Alvarado over the government of Honduras. In 1535 the Franciscan friar Jacobo de Testera began a peaceful mission at Champotón, until soldiers sent by Montejo the Younger arrived and he left; Champotón stayed the only Spanish outpost on the peninsula. Gonzalo Guerrero was killed in 1536 fighting the Spaniards in Honduras.
      - In 1536, while the Spaniards were away, Nachi Cocom, lord of Sotuta, had the members of a Xiu embassy killed at Otzmal in his province, renewing the old feud between the Cocom and the Xiu.
    facts:
      - [Ciudad Real besieged, "mid-1533"]
      - [Spaniards leave Yucatán, "end of 1534 or early 1535"]
      - [Xiu envoys killed at Otzmal, "1536"]
    markers:
