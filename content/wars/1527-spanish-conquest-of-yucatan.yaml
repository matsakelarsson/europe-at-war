  - title: Campeche and Mérida
    date: "1540–1542"
    when: "1542-01-06"
    borders: "1542-02-01"
    countries: [mx]
    body:
      - In 1540 the elder Montejo, now in his late sixties, handed his rights over to his son. Early in 1541 Montejo the Younger joined his cousin at Champotón and moved on to Campeche with 300 to 400 Spanish soldiers and Nahua auxiliaries from central Mexico, and there set up the first permanent Spanish town council on the peninsula. He summoned the Maya lords to submit; many did, among them the Xiu, but the Canul refused, and his cousin marched against them.
      - Near Tʼho, the old Maya city in the province of Chakan, the cousin founded the town of Mérida on 6 January 1542. On 23 January Tutul Xiu, lord of Maní and ruler of the most powerful province in the north, came to the camp in peace with food, attended a mass, and was baptised Melchor. His submission led the lords of the western provinces to accept Spanish rule.
      - The eastern provinces did not. Nachi Cocom of Sotuta led the resistance and, according to some accounts, attacked Mérida with a large Maya army on 10–11 June 1542, but was defeated among the ruins of Tʼho; he later submitted and was baptised Juan Cocom.
    facts:
      - [Campeche town council, "1541"]
      - [Mérida founded, "6 January 1542"]
      - [Tutul Xiu submits, "23 January 1542"]
