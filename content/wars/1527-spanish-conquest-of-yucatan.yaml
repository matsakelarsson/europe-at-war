  - title: Montejo’s first entrada
    date: "1527–1528"
    when: "1528"
    borders: "1528-01-01"
    countries: [mx, bz]
    body:
      - Montejo left Spain in 1527 with 400 men in four ships, collected more horses at Santo Domingo and reached Cozumel in the second half of September, where its lord, Aj Naum Pat, received him in peace. He landed near Xelha in the province of Ekab and founded the first Spanish town on the peninsula, Salamanca de Xelha, leaving forty men there under Alonso d’Ávila and twenty more at Pole. Food soon ran out, the Spaniards seized what they could from the Maya villages, and many villagers fled into the forest; Montejo burned his ships so that his discontented men could not leave.
      - With 125 men Montejo marched north through towns that no longer exist, made the lords of Belma swear loyalty to the Spanish crown and stayed two months at Conil, a town of some 5,000 houses. In the spring of 1528 he went on to Chauaca, whose people abandoned it by night and attacked the Spaniards in the morning, and then to Aké, north of Tizimín, where in a major battle the Spaniards killed more than 1,200 Maya and the neighbouring lords surrendered. But when Montejo returned to Xelha he had only 60 of his men left; only 12 of the 40 at Xelha were alive, and the garrison at Pole had been wiped out.
      - Sailing south on the supply ship, Montejo reached Chaktumal, the capital of Chetumal province, where Gonzalo Guerrero refused his invitation to rejoin the Spaniards, and the Maya misled him about Ávila’s whereabouts. Ávila moved the colony to Xamanha, today’s Playa del Carmen. Late in 1528 Montejo left for New Spain to raise more men.
    facts:
      - [Montejo lands, "September 1527"]
      - [Battle of Aké, "spring 1528"]
      - [Maya killed at Aké, "more than 1,200"]
