  - title: The eastern provinces
    date: "1542–1545"
    when: "1543"
    borders: "1543-06-01"
    countries: [mx]
    body:
      - Montejo the Younger sent his cousin east. At Chauaca most of the eastern lords received him in peace; the Cochuah resisted fiercely but were defeated, and a rising of the Cupul was put down. The Spaniards reached the east coast at Pole, where nine of them drowned trying to cross to Cozumel in a storm and another was killed by the Maya. Rumours of the disaster grew as they spread, and the Cupul and Cochuah rose again.
      - On 27 May 1543 the cousin founded Valladolid by a lagoon in the north of Cupul; on 24 March 1545 the town was moved south to the Maya town of Zací, whose buildings were pulled down to provide stone for the Spanish town. In the south-east the Pachecos’ campaign of 1543–1544 took Bacalar in Uaymil, the first place in the region the Spaniards were able to hold, and Gaspar Pacheco founded the town of Salamanca de Bacalar there in 1545. Still, Spanish control of the east was weak, and Chetumal, Cochuah, Cupul, Sotuta and the Tazes remained largely independent.
    facts:
      - [Valladolid founded, "27 May 1543"]
      - [Valladolid moved to Zací, "24 March 1545"]
      - [Salamanca de Bacalar founded, "1545"]
    markers:
