id: spanish-conquest-of-yucatan
name: Spanish conquest of Yucatán
start: "1527"
end: "1547"
tier: A
summary: "The twenty-year struggle of Francisco de Montejo, his son and his nephew to conquer the Maya provinces of the Yucatán Peninsula. Northern Yucatán had no single ruler to overthrow, only sixteen or more rival provinces, and two attempts, from the east coast in 1527–1528 and from Campeche in 1531–1535, ended in retreat. In 1540–1542 Montejo the Younger returned with a larger force, founded Campeche and Mérida and, with the help of the Xiu of Maní, brought the western provinces under Spanish rule; the eastern provinces were subdued in 1542–1545 and rose together in the Great Maya Revolt of November 1546, which was put down early in 1547. Many Maya fled south to the Petén, where the Itza held out until 1697."
countries: [mx]
sides:
  - id: es
    name: Spaniards under the Montejos, with Nahua auxiliaries
    polities: [spain, new-spain]
    ink: gold
    moves: Spanish moves
    success: Spanish success
  - id: xiu
    name: Maya allies of the Spaniards (the Xiu of Maní and others)
    polities: [xiu]
    ink: orange
    moves: Xiu moves
    success: Xiu success
  - id: my
    name: Maya provinces of Yucatán (Cupul, Cochuah, Sotuta, Chetumal, Ekab and others)
    polities: [maya-provinces]
    ink: green
    moves: Maya moves
    success: Maya success
notes:
  - "The conquest is known mainly from Spanish sources, above all the reports and lawsuits of the Montejos and their men, the histories of Gonzalo Fernández de Oviedo and Diego López de Cogolludo, and the account of Bishop Diego de Landa, who wrote about 1566. Maya sources include the books of Chilam Balam and the records of noble families such as the Xiu. Places named in the Spanish accounts, such as Conil, Chauaca and Belma, cannot all be located today."
  - "Francisco de Montejo the Elder (about 1479–1553) held the royal grant; his son Francisco de Montejo the Younger (1508–1565) and his nephew, also called Francisco de Montejo, led the final campaigns."
