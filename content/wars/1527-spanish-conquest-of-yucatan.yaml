        via: [[-89.60, 20.97], [-88.90, 20.90], [-88.20, 20.75], [-87.60, 20.62], [-87.15, 20.58]]
  - title: The Great Maya Revolt
    date: "1546–1547"
    when: "1546-11-08"
    borders: "1546-11-08"
    countries: [mx]
    body:
      - On 8 November 1546 the eastern provinces rose together. Cupul, Cochuah, Sotuta, the Tazes, Uaymil, Chetumal and Chikinchel joined in a concerted attempt to drive the Spaniards from the peninsula. Eighteen Spaniards caught in the eastern towns were killed as sacrifices, and a contemporary account tells of more than 400 Maya allies of the Spaniards killed, along with the Spaniards’ livestock.
      - Mérida and Campeche had been warned in time. The elder Montejo came to Mérida from Chiapas in December 1546 with reinforcements raised at Champotón and Campeche, and early in 1547, after four months of revolt, the rebels were defeated in a single battle in which twenty Spaniards and several hundred of their Maya allies were killed. It was the end of the conquest of northern Yucatán.
      - Many Maya of the east and south fled to the Petén, in the far south of the peninsula, where the Itza kingdom of Nojpetén stayed independent until 1697. The elder Montejo took office as governor of Yucatán in 1546, was recalled to Spain in 1550 after complaints against him, and died there in 1553. Epidemics did the greatest harm; modern estimates of the fall in the Maya population after contact range from 75 to 90 per cent, and Conil, with some 5,000 houses in 1528, had only 80 tributaries in 1549.
    facts:
      - [Revolt begins, "8 November 1546"]
      - [Killed in the first days, "18 Spaniards and over 400 Maya allies"]
      - [Revolt defeated, "early 1547"]
    markers:
      - kind: event
        side: my
        name: Valladolid
        date: "November 1546"
        text: The town stood in the Cupul province, one of the leaders of the revolt.
        lonlat: [-88.202, 20.689]
        lp: t
      - kind: held
        side: es
        name: Mérida
        date: "1546–1547"
        text: Warned in time, the town held; the elder Montejo arrived here with reinforcements in December 1546.
        lonlat: [-89.624, 20.967]
        lp: t
      - kind: held
        side: es
        name: Campeche
        date: "1546–1547"
        text: Montejo the Younger and his cousin were here when the revolt broke out.
        lonlat: [-90.531, 19.850]
        lp: l
      - kind: event
        side: my
        name: Sotuta
        date: "November 1546"
        text: The Cocom province of Sotuta joined the revolt.
        lonlat: [-89.008, 20.597]
        lp: b
      - kind: event
        side: my
        name: Bacalar
        date: "November 1546"
        text: The provinces of Uaymil and Chetumal in the south-east joined the revolt.
        lonlat: [-88.395, 18.677]
        lp: r
    arrows:
      - side: es
        label: Montejo
        via: [[-89.60, 20.97], [-89.20, 20.85], [-88.70, 20.75], [-88.25, 20.70]]
