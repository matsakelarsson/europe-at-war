  - title: Tabasco, Campeche and Chetumal
    date: "1529–1533"
    when: "1531"
    borders: "1531-06-01"
    countries: [mx, bz]
    body:
      - Montejo now tried from the west. Appointed alcalde mayor of Tabasco in 1529, he subdued the province with his son, Francisco de Montejo the Younger, who founded Salamanca de Xicalango as a base. In 1530 Alonso d’Ávila set up Salamanca de Acalan in the Chontal Maya land south-east of the Laguna de Términos, found no gold, abandoned it and crossed the forests of the Kejache to Champotón, where the Montejos joined him.
      - In 1531 Montejo moved his base to Campeche. The Maya gathered a large force under Aj Canul, lord of the province to the north, and attacked the town; the Spaniards drove them off, Montejo was nearly killed, and Aj Canul surrendered. Ávila was sent overland to the east. At Maní the Xiu received him well, and he went on to Chetumal, where he founded a Spanish town, Villa Real. The Maya of Chetumal, perhaps with Gonzalo Guerrero’s help, fought the settlement so fiercely that Ávila and his men abandoned it and escaped by canoe to Honduras.
    facts:
      - [Montejo’s base moves to Campeche, "1531"]
      - [Villa Real at Chetumal, "1531–1533"]
    markers:
      - kind: event
        side: es
