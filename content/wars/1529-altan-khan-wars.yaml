    moves: Mongol moves
    success: Mongol success
notes:
  - The Ming records date events by the Chinese lunar calendar and cyclical days; they are converted here to the Julian calendar, as in most English accounts (so the Mongols reached Beijing on 1 October 1550, the 22nd day of the 8th month of the 29th year of Jiajing). The Gengxu incident takes its name from the cyclical year 1550.
  - Altan was not the grand khan of the Mongols, who was the Chahar khan in the east, but he was the most powerful Mongol ruler of his time. The Ming sources call him Anda and his people Dada (Tatars). Numbers of raiders and victims in the Ming records are rough.
