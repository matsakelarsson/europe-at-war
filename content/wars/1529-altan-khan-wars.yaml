id: altan-khan-wars
name: Altan Khan’s wars with the Ming
start: "1529"
end: "1571-04-21"
tier: B
summary: "Four decades of raiding on the northern frontier of Ming China by Altan Khan (1507/08–1582), ruler of the Tümed Mongols and leader of the right wing of the Eastern Mongols, who wanted regular trade and tribute relations with China and was repeatedly refused. His horsemen raided Shanxi, the Ordos frontier and the region of Beijing almost every year; in 1542 they plundered the country around Taiyuan, and in the autumn of 1550, in the Gengxu incident, they broke through the wall at Gubeikou and burned the suburbs of Beijing for three days while the Ming armies stayed behind the walls. Horse markets opened in 1551 were closed again within a year. Peace came in 1570–1571, after Altan’s grandson defected to the Ming: in April 1571 the Longqing Emperor named Altan Shunyi Wang (Obedient and Righteous Prince), and regular markets on the frontier kept the peace with the western Mongols for decades."
countries: [cn, mn]
sides:
