steps:
  - title: Raids and refused trade
    date: 1529–1549
    when: "1542-08"
    borders: "1542-08-01"
    countries: [cn, mn]
    body:
      - Dayan Khan had divided the Eastern Mongols among his sons and grandsons. His grandson Altan, born in 1507 or 1508, received the Tümed, who pastured north of the bend of the Yellow River and the Shanxi frontier, while his elder brother Gün Bilig held the Ordos. The Mongols needed grain, cloth, iron pots and tea, and wanted the official tribute and markets the Ming had allowed in the past; the Jiajing Emperor, suspicious of every Mongol approach, refused them. Altan raided the frontier from 1529 onwards, and after Gün Bilig’s death in 1542 he led the whole right wing.
      - In the autumn of 1541 Altan sent an envoy, Shi Tianjue, to the wall at Datong to ask for tribute relations. The court refused and put a price on Altan’s head, and his horsemen came down through the Shiling Pass towards Taiyuan. When Shi Tianjue came back in the summer of 1542, the governor of Datong seized him and sent him to Beijing, where he was executed in the market. Altan answered with the largest raid yet. His army defeated the Ming at Guangwu on 4 August, plundered the suburbs of Taiyuan and went south as far as Qinzhou and Changzi before leaving by the Yanmen Pass.
      - Raids followed almost every year, against Datong, Xuanfu, the Ordos frontier and Shaanxi. Altan asked again for trade in 1546, 1547 and 1548; one of his envoys was killed by frontier soldiers. A plan by the supreme commander Zeng Xian to drive the Mongols out of the Ordos, backed by the grand secretary Xia Yan, ended in 1548 with both men executed after the emperor changed his mind.
    facts:
      - [Altan’s envoy executed, "1542"]
      - [Battle of Guangwu, "4 August 1542, Mongol victory"]
      - [Zeng Xian and Xia Yan executed, "1548"]
