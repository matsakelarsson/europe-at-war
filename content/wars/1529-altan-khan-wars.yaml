  - title: Raids, a defection and the Longqing peace
    date: 1551–1571
    when: "1570-11"
    borders: "1571-04-21"
    countries: [cn, mn]
    body:
      - The raids continued for twenty years, from Liaodong to Gansu; in 1557 the Mongols besieged Datong’s Right Garrison for six months, and in 1567 they sacked Shizhou in western Shanxi, where the Ming records say tens of thousands of people were killed. Altan meanwhile built up a settled base around the old Yuan town of Fengzhou, near today’s Hohhot. Chinese deserters and refugees, many of them followers of the White Lotus sect led by Zhao Quan and Qiu Fu, farmed the land in villages called baishing (banshen, “houses”) and advised Altan in war.
      - In the winter of 1570 Altan took for himself the bride promised to his grandson Daiching Ejei (Bahanaji in Chinese), and the young man rode to the Ming frontier with ten followers and surrendered at Datong. The governor of Datong, Fang Fengshi, and the supreme commander Wang Chonggu saw a chance for peace. They gave Daiching Ejei a Ming rank and offered to return him in exchange for Zhao Quan and the other Chinese leaders at Altan’s court. Altan handed them over, and they were executed; his grandson came home.
      - Wang Chonggu then proposed a settlement, supported by the grand secretaries Gao Gong and Zhang Juzheng against much opposition at court. On 21 April 1571 the Longqing Emperor named Altan Shunyi Wang, gave Ming titles to his brothers, sons and nephews, and allowed yearly tribute and markets at Datong, Xuanfu and the Shanxi and Shaanxi frontiers. The first fair, in the autumn of 1571, traded more than 500 horses. Altan kept the peace and punished raiders; his town was named Guihua by the Ming. After his death in 1582 his widow, Jönggen Qatun (Sanniangzi), kept the treaty for decades, while the eastern Mongols under the Chahar khans went on raiding Liaodong.
    facts:
      - [Shizhou sacked, "1567"]
      - [Daiching Ejei defects, "winter 1570"]
      - [Altan named Shunyi Wang, "21 April 1571"]
      - [Altan’s death, "1582"]
