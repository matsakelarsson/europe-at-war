  - title: The Gengxu incident
    date: July – October 1550
    when: "1550-10-01"
    borders: "1550-10-01"
    countries: [cn]
    body:
      - In the spring of 1550 Altan moved his camp to the lake of Weining Haizi beyond Datong. On 8 July his horsemen defeated the Datong army, killing its commanders Zhang Da and Lin Chun. Their successor, Qiu Luan, chose to pay the Mongols to move along the frontier rather than fight them. Altan called up the other Mongol chiefs and came east along the Chao river, and on 26 September he attacked Gubeikou. While part of his army held the defenders’ attention at the pass, picked horsemen broke through the wall by a side route, and the Jizhou garrison fled.
      - The Mongols plundered Huairou, besieged Shunyi and on 27 September reached Tongzhou, east of Beijing, where they burned the imperial stables and spread out across the capital region. On 1 October they were at the walls of Beijing. Qiu Luan and other commanders arrived with relief armies, but neither they nor the minister of war, Ding Ruqi, dared to attack, and the gates were kept shut while the suburbs burned. After three days and nights of plunder the Mongols withdrew on 3 October. On 6 October they turned on Qiu Luan’s pursuing army at the Baiyang Pass and routed it, and then left at their leisure through Gubeikou.
      - The emperor had Ding Ruqi and the governor Yang Shouqian executed. While at the walls, Altan had sent a captured eunuch into the city with a letter asking for tribute relations, and in the spring of 1551 the court opened horse markets at Datong and Xuanfu. Altan’s raids soon resumed, and in the autumn of 1552 the markets were closed again; Qiu Luan, who had championed them, died in disgrace and his corpse was mutilated.
    facts:
      - [Datong army defeated, "8 July 1550"]
      - [Gubeikou broken through, "26 September 1550"]
      - [Mongols at Beijing, "1–3 October 1550"]
      - [Horse markets, "opened spring 1551, closed autumn 1552"]
