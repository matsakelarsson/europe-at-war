id: conquest-of-nueva-galicia
name: Conquest of Nueva Galicia
start: "1529-12-21"
end: "1531"
tier: C
summary: "Nuño Beltrán de Guzmán’s campaign of conquest in western Mexico, in what are now Michoacán, Jalisco, Nayarit, Zacatecas and Sinaloa. Guzmán, president of the first Audiencia of Mexico and a rival of Hernán Cortés, left Mexico City on 21 December 1529 with 300 to 400 Spaniards and between 5,000 and 8,000 Indigenous auxiliaries, Mexica, Tlaxcalans and others, many of them pressed into service. In Michoacán he had the Purépecha king Tangáxuan II tortured and burned (14 February 1530), then crossed the Lerma into lands of small independent lordships of many languages, the Tecuexe, Coca, Caxcanes, Cora, Totorame, Tahue and others. Some received him peacefully and others fought, as at Tonalá in March 1530, in Nayarit and on the coast of Sinaloa; his men seized food, burned towns, tortured lords for gold that was rarely there and took thousands of people as slaves. Guzmán reached Culiacán, where he founded San Miguel de Culiacán in September 1531, and the expedition also founded Compostela, Chiametla and, in 1532, the first Guadalajara, near Nochistlán. He wanted to call the province Mayor España; the crown named it Nueva Galicia. The bishop of Mexico, Juan de Zumárraga, denounced the campaign, Guzmán lost his offices in the mid-1530s and was arrested in 1537, and modern historians have called his expedition one of the most brutal of the conquest. The seizure of land and labour and the slave raids that followed it led to the Mixtón War of 1540–1542."
