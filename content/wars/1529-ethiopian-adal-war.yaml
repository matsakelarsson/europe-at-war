  - title: Antukyah, Amba Sel and the fall of Shewa
    date: February – October 1531
    when: "1531-02-23"
    borders: "1531-10-28"
    countries: [et]
    body:
      - Ahmad returned in 1531 with more men and with cannon. The frontier province of Dawaro submitted, and on 23 February 1531, at Antukyah in northern Shewa, the guns of his small artillery train panicked the Ethiopian army under the general Eslamu, which fled. A second victory followed at Ayfars in March. Muslim communities inside the empire, at Wis and elsewhere, gave him gold, guides and information, and he entered Barara, the emperor’s chief residence.
      - Shewa, Fatagar and the old lands of Ifat fell to Adal. The Futuh describes the plunder and burning of the great churches and monasteries of Shewa, among them Debre Libanos, founded by the 13th-century saint Tekle Haymanot, and the royal church of Makana Selassie in Amhara. On 28 October 1531 Lebna Dengel made a stand at the mountain of Amba Sel in Wollo and was defeated again, barely escaping capture; the Adal commander Garad Matan was among the dead.
    facts:
      - [Battle of Antukyah, "23 February 1531, Adal victory"]
      - [Battle of Amba Sel, "28 October 1531, Adal victory"]
