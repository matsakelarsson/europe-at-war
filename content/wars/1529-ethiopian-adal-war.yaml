notes:
  - "Imam Ahmad ibn Ibrahim al-Ghazi is known in Ethiopia as Grañ, “the left-handed”, and in Somali as Gurey. Emperor Lebna Dengel’s throne name was Dawit II; his son Gelawdewos is also called Claudius."
  - "The main sources come from all sides. The Futuh al-Habasha (Conquest of Abyssinia) by Shihab ad-Din Arab Faqih, an Adal chronicler, tells the campaigns to about 1537 from Ahmad’s side; Ethiopian royal chronicles tell them from the emperors’; Miguel de Castanhoso, one of da Gama’s soldiers, and João Bermudes wrote the Portuguese accounts. Their numbers of soldiers and dead are very large and often implausible, and the dates differ by days or months between them."
  - Many places in the accounts cannot be located with certainty. Markers for Shimbra Kure, Antukyah, Amba Sel, Baçente, Jarte, Wofla and Wayna Daga show the areas where historians place them.
  - The base map shows Ethiopia and Adal throughout; the lands Adal occupied are drawn as areas.
