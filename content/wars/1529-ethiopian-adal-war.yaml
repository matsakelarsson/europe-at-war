steps:
  - title: The imam of Harar and Shimbra Kure
    date: 1527 – March 1529
    when: "1529-03-09"
    borders: "1529-03-09"
    countries: [et, so, dj]
    body:
      - At the start of the 16th century the Christian empire of Ethiopia was still the leading power of the Horn, and the Muslim sultanate of Adal, ruled by the Walashma dynasty from the Harar plateau, paid it tribute when it could not avoid it. Adal’s commanders kept up raids on the frontier provinces, and in 1516–1517 the young emperor Lebna Dengel defeated and killed Mahfuz, the emir of Zeila who had led them. In the 1520s power in Adal passed to Ahmad ibn Ibrahim, a young commander married to Mahfuz’s daughter Bati del Wambara, who took the title of imam, kept the sultans only as figureheads, made Harar his base and refused to pay tribute.
      - Ahmad called the war a jihad and drew fighters from many peoples of the lowlands, among them the Harari, the Harla, Somali clans such as the Marehan, Girri and Harti, and Afar groups, with cavalry, archers and a growing number of matchlock men; firearms and later a few cannon reached him through Zeila and the Ottoman ports of Arabia. After raids and counter-raids in 1527–1528, in which an Ethiopian force under Lebna Dengel’s brother-in-law Degalhan struck into Adal, Ahmad advanced into the empire’s south-eastern frontier provinces.
      - On 9 March 1529 he met Lebna Dengel’s much larger army at Shimbra Kure, a marshy plain whose name means “chickpea swamp”. After hard fighting the Harari cavalry broke the Ethiopians, and many nobles were killed. The Futuh al-Habasha gives figures in the hundreds of thousands, which modern historians do not accept. Ahmad held the field but withdrew to Adal and did not challenge the emperor’s army again for two years.
    facts:
      - [Battle of Shimbra Kure, "9 March 1529, Adal victory"]
      - [Adal army, "about 12,500 men according to the Futuh al-Habasha"]
