  - title: Wayna Daga
    date: 21 February 1543
    when: "1543-02-21"
    borders: "1543-02-21"
    countries: [et, pt]
    body:
      - Gelawdewos and the Portuguese came down from Semien in early 1543 and advanced on Ahmad’s camp east of Lake Tana. On 21 February 1543 they attacked at Wayna Daga. According to the accounts, Gelawdewos had about 8,000 foot and 500 horse with some 130 Portuguese, Ahmad about 14,000 foot, 1,200 horse and 200 Ottoman musketeers. In the fighting Ahmad was shot from his horse, struck in the chest by a musket ball. Castanhoso gives the credit to the Portuguese, later writers to the musketeer João de Castilho, and an Ethiopian chronicle to one of Gelawdewos’s own soldiers. He was beheaded, his army broke and fled, and his son was captured, while his widow Bati del Wambara escaped with the remaining Ottoman musketeers and part of the treasure.
      - With Ahmad dead, Adal’s hold on the highlands collapsed within months. Many who had converted returned to Christianity, and Gelawdewos recovered the provinces one by one; in October 1544 he defeated and killed Ahmad’s governor Abbas at Waj, regaining Bale, Fatagar, Dawaro and Hadiya. Bati del Wambara married Ahmad’s nephew Nur ibn Mujahid on condition that he avenge her husband, and in 1559 Nur defeated and killed Gelawdewos.
      - No count of the dead survives. Both states had been devastated, with whole provinces depopulated, churches and mosques destroyed, and large numbers enslaved, and neither could resist the Oromo, who moved into the frontier provinces in the following decades. The Portuguese who stayed in Ethiopia were followed by Jesuit missionaries, whose attempts to convert the kingdom to Catholicism led to a civil war in the 1620s. In later centuries the war became a powerful memory in both Ethiopian and Somali national histories, where Ahmad Grañ is remembered as a destroyer and Ahmad Gurey as a hero.
    facts:
      - [Battle of Wayna Daga, "21 February 1543, Ethiopian–Portuguese victory"]
      - [Imam Ahmad, "killed in the battle"]
      - [Battle of Waj, "October 1544, Ethiopian victory"]
