  - title: The highlands under Adal
    date: 1531–1540
    when: "1535"
    borders: "1535-06-01"
    countries: [et, er]
    body:
      - For the next decade Ahmad’s armies moved through the highlands almost unopposed. They took Amhara and Lasta, reached Lake Tana and Begemder, and in 1535 turned north into Tigray, where they took Aksum and destroyed the cathedral of Maryam Seyon, the coronation church of the emperors, and sent raiding columns into Serae beyond the Mareb. Christian nobles and whole districts submitted and accepted Islam, some under compulsion; others fled to the mountain fortresses (ambas) and fought on. Captives were taken in large numbers and sold, and much of the church’s treasure, manuscripts and buildings was lost.
      - Ahmad appointed governors in the conquered provinces and tried to settle Muslim colonists, but his army suffered from disease, hunger and the strain of so many garrisons, and his hold on Tigray lasted only about a year. Lebna Dengel kept moving from one mountain refuge to another. He had sent the Portuguese priest João Bermudes to Lisbon to ask King João III for help, and he died at the mountain monastery of Debre Damo in Tigray on 2 September 1540. His son Gelawdewos, about eighteen years old, became emperor with only a small following.
    facts:
      - [Aksum taken, "1535"]
      - [Death of Lebna Dengel, "2 September 1540, Debre Damo"]
      - [New emperor, "Gelawdewos (1540–1559)"]
    markers:
      - kind: taken
        side: ad
