  - title: Baçente and Jarte
    date: February – April 1542
    when: "1542-02-02"
    borders: "1542-04-16"
    countries: [et, er, pt]
    body:
      - At the end of the rains the Portuguese and their Ethiopian allies marched south into Tigray. On 2 February 1542 they stormed Amba Senayt in Haramat, a mountain fortress held by Adal troops, in the fight the Portuguese called Baçente. Ahmad came north with his army, and in April two battles were fought near Antalo, on the plain the Portuguese called Jarte, on 4 and 16 April. Facing an enemy with firearms and cannon for the first time, Ahmad was wounded and his horse killed under him, and his army fell back.
      - The Portuguese had lost a number of men and camped for the rains at Wofla near Lake Ashenge. Ahmad withdrew to the lowlands and appealed to the Ottoman governor of Zabid in Yemen, offering to become a vassal of Sultan Süleyman. The Ottomans sent him musketeers, about 900 according to Portuguese accounts, together with Arab matchlock men and ten field guns.
    facts:
      - [Baçente (Amba Senayt), "2 February 1542, Portuguese victory"]
      - [Jarte, "4 and 16 April 1542, Portuguese victories"]
      - [Ottoman reinforcement, "about 900 musketeers and 10 guns"]
