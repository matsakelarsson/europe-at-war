  - title: Cristóvão da Gama lands at Massawa
    date: February – July 1541
    when: "1541-02"
    borders: "1541-07-20"
    countries: [er, pt]
    body:
      - The Portuguese, who had been in the Indian Ocean since 1498, had long hoped for an alliance with the Christian kingdom they identified with the realm of Prester John, and they were at war with the Ottomans, who had taken Egypt in 1517 and Yemen in the 1530s. In 1541 the governor of Portuguese India, Estêvão da Gama, son of Vasco da Gama, sailed into the Red Sea with a fleet to attack the Ottoman base at Suez. At Massawa he left about 400 Portuguese soldiers, most of them musketeers, with some 130 slaves, a thousand matchlocks and a few guns, under his brother Cristóvão da Gama.
      - The Bahr Negash Yeshaq, governor of the coastal province, welcomed them, and in July they marched up to his capital, Debarwa, where they arrived on 20 July and waited out the rains. Lebna Dengel’s widow, Empress Sabla Wangel, came down from Debre Damo to join them with her followers, and some Christian lords who had submitted to Adal came over to them. Miguel de Castanhoso, one of the soldiers, wrote the account of the campaign that followed.
    facts:
      - [Portuguese force, "about 400 men under Cristóvão da Gama"]
      - [Arrival at Debarwa, "20 July 1541"]
