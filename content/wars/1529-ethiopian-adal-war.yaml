  - title: Wofla and the death of Cristóvão da Gama
    date: 28–29 August 1542
    when: "1542-08-28"
    borders: "1542-08-28"
    countries: [et, pt]
    body:
      - With the Ottoman musketeers, Ahmad attacked the Portuguese camp at Wofla on 28 August 1542. The Portuguese, outnumbered and outgunned, were overrun. Cristóvão da Gama, wounded, escaped with a few men but was captured the next day; when he refused to convert, Ahmad had him beheaded. About half of the Portuguese were killed, and the survivors, about 170 men, fled with Sabla Wangel.
      - Believing the danger over, Ahmad sent most of the Ottoman musketeers back, keeping about 200, and moved his camp to the shores of Lake Tana. The Portuguese survivors made their way west to Semien, where in October 1542 they joined the young emperor Gelawdewos, who had gathered a new army in the mountains. They still had their matchlocks and rebuilt their strength with the arms they had stored.
    facts:
      - [Battle of Wofla, "28 August 1542, Adal and Ottoman victory"]
      - [Cristóvão da Gama, "captured and killed, 29 August 1542"]
      - [Portuguese survivors, "about 170"]
