id: ethiopian-adal-war
name: Ethiopian–Adal War
start: "1529-03-09"
end: "1543-02-21"
tier: A
summary: "The conquest of most of the Christian Ethiopian highlands by the sultanate of Adal under Imam Ahmad ibn Ibrahim al-Ghazi, and their recovery with Portuguese help. Ahmad, a commander who had taken power in Adal from its sultans and made Harar his base, refused tribute to the emperor and declared a jihad. His army of Harari, Somali, Afar and Harla fighters, with matchlocks and a few cannon, defeated Emperor Lebna Dengel at Shimbra Kure in 1529 and at Antukyah and Amba Sel in 1531, and in the next years overran Dawaro, Shewa, Amhara, Lasta and much of Tigray, burning churches and monasteries, taking captives and converting many Christians. Lebna Dengel died a fugitive in 1540. In 1541 a Portuguese fleet landed about 400 musketeers under Cristóvão da Gama at Massawa; they won at Baçente and Jarte in 1542 but were overwhelmed at Wofla, where da Gama was captured and killed, after Ahmad had received Ottoman musketeers from Yemen. The survivors joined the new emperor Gelawdewos, and at Wayna Daga near Lake Tana on 21 February 1543 Ahmad was shot and killed and his army broke up. The war exhausted both states and opened the way for the Oromo expansion."
countries: [et, er, so, dj, pt]
sides:
