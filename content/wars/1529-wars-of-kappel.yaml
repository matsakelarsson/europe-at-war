notes:
  - The armies’ meal together at Kappel in 1529, when soldiers from Zug are said to have brought milk and those from Zürich bread, became known as the Kappeler Milchsuppe, a symbol of Swiss reconciliation.
  - Both sides belonged to the Swiss Confederacy, which the map shows as one state.
