id: wars-of-kappel
name: Wars of Kappel
start: "1529"
end: "1531"
tier: C
summary: Two wars between the Protestant and Catholic cantons of the Swiss Confederacy during the Reformation, named after Kappel am Albis on the border between Zürich and Zug. In June 1529 Zürich, led by the reformer Huldrych Zwingli, declared war on the five Catholic cantons of central Switzerland (Lucerne, Uri, Schwyz, Unterwalden and Zug), but the armies did not fight, and the First Peace of Kappel on 26 June made the Catholics give up their alliance with Austria. In 1531 a food blockade by Zürich and Bern drove the five cantons to declare war on 9 October. Two days later they routed the outnumbered Zürich army at Kappel, killing some 500 men, among them Zwingli, and on the night of 23–24 October beat a larger Protestant force on the Gubel near Menzingen. The Second Peace of Kappel, signed on 20 November 1531, let each canton choose its own faith but favoured Catholicism in the common territories, and checked the spread of the Reformation in Switzerland.
