  - title: Van, Erivan and the Peace of Amasya
    date: 1548–1555
    when: "1548-07-27"
    borders: "1555-05-29"
    countries: [tr, ir, am, az, ge]
    body:
      - In 1547 Tahmasp’s brother Alqas Mirza, governor of Shirvan, rebelled, was defeated and fled to Suleiman, promising to win Persia for him. In 1548 Suleiman marched east with Alqas. Tahmasp emptied Tabriz and fell back to Qazvin, and the Ottomans entered the city on 27 July without resistance. After five days Suleiman turned to Van, which surrendered on 25 August after a siege in which French advisers helped place the guns. Alqas raided deep into Persia, plundering Hamadan and Qom, but was later captured and died in prison. Van stayed Ottoman.
      - In 1552–1553 Tahmasp’s son Ismail Mirza invaded eastern Anatolia, beat the governor of Erzurum and took Ahlat and Erciş. Suleiman answered with his third campaign in 1553–1554, laying waste to the country around Erivan, Nakhchivan and Karabakh, though again no great battle was fought. Both sides were exhausted, and on 29 May 1555 they made peace at Amasya. Persia kept Tabriz, Azerbaijan, eastern Armenia and eastern Georgia; the Ottomans kept Baghdad and lower Iraq, Van, western Armenia and western Georgia. Kars was declared neutral and its fortress razed, Persian pilgrims were allowed to travel to Mecca and the Shi‘i shrines of Iraq, and Tahmasp agreed to stop the ritual cursing of the first caliphs.
    facts:
      - [Tabriz taken again, "27 July 1548"]
      - [Van surrenders, "25 August 1548"]
      - [Peace of Amasya, "29 May 1555"]
