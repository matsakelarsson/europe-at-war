id: ottoman-safavid-war-1532
name: Ottoman–Safavid War (1532–1555)
start: "1532"
end: "1555-05-29"
tier: B
summary: The second great war between Suleiman the Magnificent and Shah Tahmasp I of Persia, fought in three Ottoman campaigns. In 1534 Suleiman and his grand vizier Ibrahim Pasha took Tabriz and then Baghdad, in 1548 the Ottomans took Tabriz again and the fortress of Van, and in 1553–1554 they ravaged Armenia and Karabakh. Tahmasp avoided pitched battles and laid waste to the land in the Ottoman path. The Peace of Amasya (1555) left Tabriz and the eastern Caucasus to Persia, while the Ottomans kept Baghdad and Iraq, Van and western Armenia and Georgia.
