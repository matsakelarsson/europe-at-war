steps:
  - title: Tabriz and Baghdad
    date: 1532–1536
    when: "1534-07-15"
    borders: "1535-01"
    countries: [tr, ir, iq]
    body:
      - The frontier set after Chaldiran was unstable. The Kurdish lord of Bitlis put himself under Persian protection, the Safavid governor of Baghdad, who had leant towards Suleiman, was murdered, and the Safavid governor of Azerbaijan, Ulama Beg Takkalu, went over to the Ottomans and told them of Persia’s troubles with the Uzbeks and its own tribes. Suleiman had also learnt that Tahmasp was in contact with the Habsburgs. Ottoman raids began in 1532, and in 1534 the grand vizier Ibrahim Pasha took Bitlis and occupied Tabriz on 15 July without a fight, where Suleiman joined him.
      - Tahmasp hurried back from Khorasan but would not risk a battle. He withdrew before the Ottomans and stripped the country of food. In the autumn Suleiman marched south through the Zagros mountains and at the end of 1534 entered Baghdad, which the Safavid garrison had abandoned. He wintered there, restored the tomb of Abu Hanifa that Ismail I had destroyed, and set up an Ottoman province. In 1535 he returned north and occupied Tabriz once more, but as soon as he left, Tahmasp took back Tabriz and Van. Baghdad stayed Ottoman, and Basra submitted in 1538.
    facts:
      - [Tabriz taken by Ibrahim Pasha, "15 July 1534"]
      - [Baghdad taken, "late 1534"]
