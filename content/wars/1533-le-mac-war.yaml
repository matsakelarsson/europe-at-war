id: le-mac-war
name: Lê–Mạc war
start: "1533"
end: "1677"
tier: B
summary: "The civil war between the Mạc dynasty, founded when the general Mạc Đăng Dung took the throne of Đại Việt in 1527, and supporters of the Later Lê dynasty, a period Vietnamese historians call the Southern and Northern Dynasties. In 1533 the general Nguyễn Kim, from exile in Lan Xang, proclaimed a Lê prince emperor and won back Thanh Hóa and Nghệ An. The Mạc, who held the Red River delta and the capital Đông Kinh (Hanoi), bought off a Ming invasion in 1540–1541 by submitting to the Ming at the border. For half a century the two courts fought along the Mã River and on the coasts of Thanh Hóa, while real power on the Lê side passed after Nguyễn Kim’s death to his son-in-law Trịnh Kiểm and the Trịnh lords. In 1592 Trịnh Tùng took Đông Kinh and the Mạc ruler Mạc Mậu Hợp was captured and executed. Members of the Mạc family held out in Cao Bằng on the Chinese border, under Ming and then Qing protection, until 1677."
countries: [vn]
sides:
  - id: le
    name: Lê dynasty (Nguyễn Kim, then the Trịnh lords)
    polities: [dai-viet]
    ink: red
    moves: Lê moves
    success: Lê success
  - id: mac
    name: Mạc dynasty
    polities: [mac]
    ink: purple
    moves: Mạc moves
    success: Mạc success
notes:
  - The war is known mainly from the Vietnamese chronicles, which were written under the restored Lê and the Trịnh and treat the Mạc as usurpers; modern Vietnamese historians judge the Mạc more favourably. Army sizes are those of the chronicles. The English-language accounts are thin, and dates of individual campaigns are given here to the year where they disagree.
  - The Ming called the Lê side the legitimate dynasty until 1540 and then recognised the Mạc ruler as their commissioner in Annam; after 1597 they recognised the Lê court as well. The base map shows the Mạc in the north and the Lê in the south until 1592, and the Mạc in Cao Bằng until 1677.
