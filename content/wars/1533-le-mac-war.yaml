  - title: The Mạc in Cao Bằng
    date: 1593–1677
    when: "1600"
    borders: "1600-01-01"
    countries: [vn, cn]
    body:
      - Members of the Mạc family fled to Cao Bằng, in the mountains on the Chinese border, recruited Tày and other upland peoples and kept a court there under the protection of the Ming, who for a time continued to recognise them as the rulers of Annam. In 1597 the Lê court sent the envoy Phùng Khắc Khoan to Beijing, and the Ming recognised the Lê as well, leaving the Mạc in Cao Bằng as a buffer.
      - For eight decades the Mạc of Cao Bằng and their allies, among them the Vũ lords (chúa Bầu) in today’s Hà Giang, raided the Trịnh lands and were raided in turn. Trịnh armies finally took Cao Bằng in 1677, and the last Mạc ruler, Mạc Kính Vũ, fled to China. The long war left the north devastated and divided Đại Việt between the Trịnh in the north and the Nguyễn in the south, who fought each other from 1627.
    facts:
      - [Ming recognition of the Lê court, "1597"]
      - [Cao Bằng taken by the Trịnh, "1677"]
