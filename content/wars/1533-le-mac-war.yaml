  - title: Mạc offensives and the fall of Đông Kinh
    date: 1570–1593
    when: "1592"
    borders: "1592-12-01"
    countries: [vn]
    body:
      - After Trịnh Kiểm’s death in 1570 his sons quarrelled; the elder, Trịnh Cối, went over to the Mạc, and the younger, Trịnh Tùng, took command. In the same year Mạc Kính Điển invaded Thanh Hóa by land and sea with, the chronicles say, 100,000 men and 700 ships, looted the Lê country and in 1571 reached the Cả River in Nghệ An before withdrawing in 1572. Four more Mạc offensives followed; in 1577 a Mạc army of 40,000 was defeated at Khoái Lạc in Thanh Hóa and its general Lại Thế Mỹ killed. Mạc Kính Điển died in 1580, and under the young Mạc Mậu Hợp the Mạc state weakened while Trịnh Tùng raided the delta.
      - In early 1592 Trịnh Tùng marched north with about 60,000 men, defeated Mạc Mậu Hợp’s army and took Đông Kinh. Mạc Mậu Hợp fled, was captured in the autumn and was executed; his son Mạc Toàn was killed soon after. In April 1593 the Lê emperor Lê Thế Tông entered Đông Kinh. The restored Lê emperors reigned there until 1789, but power stayed with the Trịnh lords in the north, while Nguyễn Hoàng, who had helped in the war, went back to his southern provinces and ruled them more and more on his own.
    facts:
