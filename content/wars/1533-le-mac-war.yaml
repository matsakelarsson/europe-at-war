steps:
  - title: Two courts
    date: 1527–1561
    when: "1545"
    borders: "1545-01-01"
    countries: [vn, la, cn]
    body:
      - After decades of court intrigue and civil war, the general Mạc Đăng Dung, who had made himself master of the court, deposed and killed the young Lê emperor in 1527 and founded his own dynasty. Lê loyalists fled to the hills and to Lan Xang, and in 1533 the general Nguyễn Kim proclaimed a Lê prince, Lê Duy Ninh, emperor as Lê Trang Tông. Within a few years the Lê forces had won back Thanh Hóa and Nghệ An and set up their court in the uplands of Thanh Hóa. Lê Trang Tông appealed to the Ming, and the Jiajing Emperor massed troops on the border. In 1540 Mạc Đăng Dung went to the Nam Quan pass and submitted to the Ming officials, giving up border land in today’s Guangxi and his imperial title; the Ming made him their commissioner in Annam.
      - Nguyễn Kim was poisoned in 1545 by a Mạc defector, and command of the Lê armies passed to his son-in-law Trịnh Kiểm, who sidelined Nguyễn Kim’s sons. One of them, Nguyễn Hoàng, had himself sent south as governor of Thuận Hóa in 1558. In 1555 and 1557 the Mạc general Mạc Kính Điển sailed up the Mã River with large fleets and was ambushed by the Lê, who had adopted Portuguese-style matchlocks. In 1559 Trịnh Kiểm marched north with 60,000 men and elephants and reached the outskirts of Đông Kinh, but could not take it or Hải Dương, and in 1561 a Mạc landing in Thanh Hóa and Nghệ An forced him back.
    facts:
