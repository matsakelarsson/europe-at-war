summary: Denmark’s civil war of 1534–1536, in which Lübeck tried to restore the deposed Christian II and Christian III won the throne with Swedish help and then made Denmark–Norway Lutheran, followed by the Dacke War, the great peasant rising in Småland against Gustav Vasa in 1542–1543.
