    body:
      - In Denmark’s civil war, the Count’s Feud, Lübeck tried to restore the deposed Christian II. Gustav Vasa, deep in debt to Lübeck, sided with the Danish nobles and Duke Christian, later Christian III. Swedish troops took Halmstad in October 1534 and won at Helsingborg in January 1535, and in June 1535 a Swedish, Danish and Prussian fleet beat Lübeck’s ships off Bornholm. Lübeck’s defeat broke its grip on the Swedish economy.
      - Gustav’s heavy taxes and his Lutheran Reformation provoked the most serious revolt of his reign. In 1542 Nils Dacke led the peasants of Småland in a rising that almost toppled the king. Gustav’s Swedish and German troops crushed it in 1543, and Dacke was killed that August.
    facts:
      - - Swedish victory at sea
        - Off Bornholm, June 1535
      - - Dacke War
        - 1542–1543
