  - title: The siege of Copenhagen and the Reformation
    date: 1534–1537
    when: "1535-07"
    borders: "1536-07-29"
    countries: [dk, "no", de]
    body:
      - The civil war began in 1534, when Lübeck, under its mayor Jürgen Wullenwever, hired Count Christopher of Oldenburg to restore the imprisoned Christian II. Copenhagen and Malmö opened their gates to him, and in north Jutland the privateer Skipper Clement raised the peasants, who beat the nobles at Svenstrup in October. The frightened nobles of Jutland and Funen chose the Lutheran Duke Christian of Holstein as king. His general, Johan Rantzau, stormed Aalborg on 18 December 1534, killing some 2,000 people, and crushed the rising.
      - In June 1535 Rantzau destroyed the Count’s army at Øksnebjerg on Funen, while the allied fleet beat Lübeck’s at sea. Christian III then besieged Copenhagen for a year. Malmö gave in in April 1536, and Copenhagen, starving, surrendered on 29 July. Christian used his victory to carry out the Reformation. In August he had the Catholic bishops arrested; an assembly in October deposed them and gave their estates to the crown, and a Lutheran church order followed in 1537. Norway, whose archbishop had opposed Christian III, lost its own council of the realm and was ruled from Copenhagen as part of the Danish realm.
    facts:
      - [Aalborg stormed, "18 December 1534, some 2,000 killed"]
      - [Copenhagen surrenders, "29 July 1536, after a siege of a year"]
      - [Catholic bishops arrested, "12 August 1536"]
