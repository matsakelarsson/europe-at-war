id: kildare-rebellion
name: Kildare Rebellion
start: "1534-06-11"
end: "1535-08"
tier: C
summary: The revolt of Thomas FitzGerald, Lord Offaly, known as Silken Thomas, against Henry VIII. Left in charge of the government in Dublin when his father, the Earl of Kildare, was summoned to London, Thomas renounced his allegiance on 11 June 1534 after hearing a false rumour that his father had been executed; the earl in fact died in the Tower that September. Thomas’s men murdered Archbishop John Alen and besieged Dublin Castle without success. In March 1535 the new lord deputy, Sir William Skeffington, battered the FitzGerald stronghold of Maynooth with artillery, and most of the surrendered garrison were executed, the “pardon of Maynooth”. Thomas surrendered that August on a promise of his life, and was executed at Tyburn in 1537 with five of his uncles. The fall of the house of Kildare opened the way for direct Tudor rule and, in 1542, the Kingdom of Ireland.
