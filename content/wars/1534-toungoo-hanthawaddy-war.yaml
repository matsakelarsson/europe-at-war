id: toungoo-hanthawaddy-war
name: Toungoo–Hanthawaddy War
start: "1534"
end: "1547-02"
tier: A
summary: "The war in which the small Burmese kingdom of Toungoo, in the Sittaung valley, conquered Hanthawaddy, the larger and richer Mon-speaking kingdom of Lower Burma, and began the second unification of Burma. Toungoo’s young king Tabinshwehti and his general and brother-in-law, later known as Bayinnaung, raided Pegu without success in three dry seasons from 1534. In 1538 a ruse led King Takayutpi to execute his best ministers; he then abandoned Pegu, and Bayinnaung destroyed his retreating army at Naungyo. Tabinshwehti made Pegu his capital, won over the Mon lords and hired Portuguese gunners, and in May 1541, after a seven-month siege, took and sacked the port of Martaban, whose viceroy had held out with Portuguese help. This entry also tells in brief the wars that followed until 1547: the conquest of Prome (1542) against armies sent by Ava, the Confederation of Shan States and Arakan; Toungoo’s advance to Pagan (1544); and the failed invasion of Arakan, where Mrauk U held out in January 1547."
