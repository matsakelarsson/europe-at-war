  - title: Prome and the new capital
    date: 1539–1540
    when: "1539"
    borders: "1539-06-01"
    countries: [mm]
    body:
      - A few weeks after Naungyo, Toungoo’s land and river forces, about 7,000 men, besieged Prome. Ava, ruled by the Shan king Thohanbwa, sent 5,000 troops in 300 war boats down the Irrawaddy; they broke the siege and drove Toungoo back to the delta, but their advance stopped at Inbyaw island, where six of their commanders were captured. Takayutpi died at Prome in about March 1539, and King Narapati of Prome soon after him.
      - Tabinshwehti moved his capital to Pegu. He offered the Hanthawaddy lords generous terms and kept many in office, and over the following years adopted Mon customs, married a Mon queen and wore his hair in the Mon style. Through the delta ports he gained access to Portuguese mercenaries and firearms. Only the south held out. Saw Binnya, the viceroy of Martaban, refused to submit, declared himself king and fortified his port with Portuguese help, while Arakan and the Shan rulers of Ava drew together against Toungoo.
    facts:
      - [Siege of Prome broken, "early 1539"]
      - [Death of Takayutpi, "about March 1539"]
