  - title: The fall of Pegu and Naungyo
    date: Late 1538
    when: "1538"
    borders: "1539-01-15"
    countries: [mm]
    body:
      - Unable to take Pegu by force, the Toungoo court turned to a ruse. According to the chronicles, messages were contrived that made Takayutpi believe that Binnya Law and Binnya Kyan, his former tutors, were plotting with Toungoo, and he had them executed. In late 1538 Tabinshwehti invaded again with about 7,000 men. Takayutpi abandoned his capital, which Toungoo took without a fight, and retreated towards Prome, whose king was his ally. He sent five divisions overland and sailed with the rest of his forces, in about 700 boats, through the channels of the delta and up the Irrawaddy.
      - Bayinnaung pursued the land army with a light force and caught it at Naungyo, in the delta, in November or December 1538. The Hanthawaddy army was far larger, 80,000 men against 10,000 in the chronicles, 8,000 against 1,000 by Harvey’s estimate, and had Portuguese and Indian mercenaries with guns. A river lay between them and the enemy held all the boats, so Bayinnaung had his men cross on rafts and then destroyed them, leaving no way back. He attacked in three columns and charged the Hanthawaddy commander Binnya Dala, who fled; his fellow commander Minye Aung Naing was killed, and the army broke up. When Tabinshwehti arrived the next day he gave his general the title of Bayinnaung. Only a remnant of Takayutpi’s army reached Prome.
    facts:
      - [Pegu taken, "late 1538, without a fight"]
      - [Battle of Naungyo, "November or December 1538, Toungoo victory"]
    markers:
      - kind: taken
        side: tg
