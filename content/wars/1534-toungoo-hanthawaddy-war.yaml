  - title: The siege of Martaban
    date: November 1540 – May 1541
    when: "1541"
    borders: "1541-06-01"
    countries: [mm]
    body:
      - When Saw Binnya rejected an offer of amnesty, Toungoo’s armies and river fleet, about 13,000 men, besieged Martaban in November 1540. The rich port was defended by seven Portuguese ships under Paulo de Seixas, while about 700 Portuguese mercenaries under João Caeiro fought for Tabinshwehti. A month into the siege an attack by 300 war boats failed, and most of them were destroyed by the Portuguese ships. Saw Binnya offered a tribute of 30,000 viss of silver and then asked for safe conduct; Tabinshwehti refused both, and Caeiro turned down Saw Binnya’s bribe.
      - In May 1541, seven months into the siege, Admiral Smim Payu sent fire rafts into the harbour. Three Portuguese ships fled and four were burned or taken. Rafts carrying bamboo towers were brought against the harbour wall, Toungoo troops gained a foothold, and a section of the wall was mined. The city was sacked for three days. Tabinshwehti had Saw Binnya, his family and the defenders put to death, and the governors of Moulmein and the southern towns submitted. The Mon lord Saw Lagun Ein became viceroy of Martaban, and all of Lower Burma was in Toungoo’s hands.
    facts:
      - [Siege of Martaban, "November 1540 – May 1541"]
      - [Toungoo forces, "about 13,000 men, with Portuguese mercenaries"]
      - [Martaban sacked, "May 1541, for three days"]
