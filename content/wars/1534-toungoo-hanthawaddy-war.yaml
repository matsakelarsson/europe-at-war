notes:
  - The war proper ended with the fall of Martaban in May 1541; the last three steps tell in brief the wars Tabinshwehti fought next, against Prome and Ava (1541–1545) and Arakan (1545–1547). His war with Siam, which followed in 1547–1549, is a separate story.
  - The main sources are the Burmese chronicles and the Mon and Arakanese chronicles, with some Portuguese accounts. The dates are those of modern reconstructions from the chronicles. The chronicles’ army sizes, given here where they help, are thought to be inflated by up to ten times. The Portuguese adventurer Fernão Mendes Pinto, who claimed to have seen the sack of Martaban and the fall of Prome, left vivid accounts that historians such as G. E. Harvey judged unreliable.
  - "Places are given by their names of the time, with today’s in brackets: Pegu (Bago), Martaban (Mottama), Prome (Pyay), Bassein (Pathein), Sandoway (Thandwe). Bayinnaung, “the king’s elder brother”, is the title Tabinshwehti gave his general Kyawhtin Nawrahta after Naungyo."
