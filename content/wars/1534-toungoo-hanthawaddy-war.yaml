  - title: Salin and Pagan
    date: December 1543 – 1545
    when: "1544"
    borders: "1544-08-01"
    countries: [mm]
    body:
      - The Shan chiefs chose Hkonmaing of Hsipaw as king of Ava, and on 7 December 1543 he set out with about 16,000 men by land and 12,000 in some 1,100 boats to win back Prome. They attacked the city without success. Toungoo’s fleet beat Ava’s war boats, and a detachment of 4,000 men occupied Thayet and Myede behind them, cutting their supplies, so that by early 1544 the Confederation army was falling back up the river towards Salin.
      - Tabinshwehti with the fleet and Bayinnaung with the army followed. They took Salin within three days by mining its walls and went on to Pagan, where Tabinshwehti was crowned in the manner of the old kings of Pagan. He returned to Pegu in mid-1544, leaving garrisons on the border, and in 1545 was crowned again at Pegu in the tradition of the Hanthawaddy kings. Salin changed hands twice more, and in 1545, after Hkonmaing’s death, Ava made peace and gave up central Burma as far north as Pagan.
    facts:
      - [Ava’s counter-invasion, "from 7 December 1543"]
      - [Tabinshwehti crowned at Pagan, "1544"]
      - [Peace with Ava, "1545"]
