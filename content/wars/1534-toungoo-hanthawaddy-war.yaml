  - title: The conquest of Prome
    date: November 1541 – May 1542
    when: "1542"
    borders: "1542-05-20"
    countries: [mm]
    body:
      - On 19 November 1541 Toungoo invaded Prome with about 17,000 men, a fleet of 13 squadrons and an army under Tabinshwehti and Bayinnaung, but could not break its walls and settled down to a siege. In April 1542 an army of the Confederation of Shan States, about 16,000 men under Thohanbwa of Ava and Hkonmaing of Hsipaw, came down to relieve the city. Bayinnaung, commanding one of three Toungoo armies of about 3,000 men each, defeated it north of Prome and took more than 2,000 prisoners and 60 elephants.
      - Late in April an Arakanese army of about 5,000 under Min Aung Hla, the viceroy of Sandoway, crossed the Arakan Yoma. Bayinnaung sent false messengers to draw it into an ambush at the Padaung pass, where more than 2,000 Arakanese were captured and Min Aung Hla barely escaped. The Arakanese fleet, which had taken Bassein and Myaungmya, sailed home. Tabinshwehti named Bayinnaung his heir, and on 19 May 1542 King Minkhaung of Prome surrendered on a promise of amnesty. In Ava, Thohanbwa was murdered by his chief minister that month.
    facts:
      - [Toungoo invasion, "19 November 1541, about 17,000 men"]
      - [Battle of Padaung Pass, "late April 1542, Toungoo victory"]
      - [Prome surrenders, "19 May 1542"]
