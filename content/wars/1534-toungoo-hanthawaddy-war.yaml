  - title: Mrauk U
    date: 1545–1547
    when: "1547"
    borders: "1547-01-24"
    countries: [mm]
    body:
      - Arakan had sided with Ava, and when Min Aung Hla, the former viceroy of Sandoway, lost his post to a son of King Min Bin of Mrauk U, he turned to Tabinshwehti for help. A first Toungoo force of about 4,000 found Sandoway held by Arakanese troops in late 1545 and turned back. On 28 October 1546 Tabinshwehti launched a full invasion with about 19,000 men, 15,000 of them by sea in some 1,400 boats and 4,000 marching over the mountains. The Arakanese fleet at Cape Negrais, largely crewed by Portuguese, did not engage; Sandoway was taken and Min Aung Hla made viceroy again.
      - In January 1547 the invaders closed in on Mrauk U, ringed by eleven forts and defended by some 20,000 men. Launggyet, the old capital nearby, fell on 23 January, and the next day Toungoo troops broke into the city’s eastern outworks. Min Bin then opened the sluices of the city’s reservoirs, drowning many of the attackers and surrounding the walls with water, and Toungoo’s Portuguese guns made little impression on the stone. With news that Siamese forces had occupied Tavoy, in the south, Tabinshwehti agreed to a truce on 30 January 1547 and began to withdraw on 2 February. Arakan kept its independence, and Tabinshwehti turned against Siam.
    facts:
      - [Invasion of Arakan, "28 October 1546, about 19,000 men"]
      - [Launggyet taken, "23 January 1547"]
      - [Truce, "30 January 1547"]
