steps:
  - title: Toungoo’s raids on Pegu
    date: 1534–1537
    when: "1535"
    borders: "1535-01-01"
    countries: [mm]
    body:
      - After the Confederation of Shan States took Ava in 1527, many Burmans fled south to Toungoo, a small kingdom in the Sittaung valley that had broken away from Ava in 1510. Its king Tabinshwehti came to the throne on 24 November 1530 at the age of fourteen. His boyhood companion and brother-in-law Kyawhtin Nawrahta, the future Bayinnaung, became his leading general. In about 1532 the young king rode with a small escort into Hanthawaddy territory to have his ears pierced at the Shwemawdaw pagoda in Pegu, a provocation that went unpunished. When the Shan armies sacked Prome in 1533, Toungoo’s leaders decided to strike before they too were overrun.
      - Hanthawaddy, the Mon kingdom of the delta, was larger and richer, with ports trading across the Bay of Bengal, but its king Takayutpi, on the throne since 1526, was weak and its lords divided. In late 1534, probably in November, Tabinshwehti and Bayinnaung led their first raid against Pegu. In the dry seasons of 1534–1535, 1535–1536 and 1536–1537 armies of 4,000 to 7,000 men failed before the walls of Pegu, which were defended by foreign mercenaries with firearms and by Takayutpi’s able ministers Binnya Law and Binnya Kyan.
    facts:
      - [Tabinshwehti’s accession, "24 November 1530, aged 14"]
      - [Raids on Pegu, "three dry seasons, 1534–1537"]
      - [Toungoo armies, "4,000–7,000 men"]
