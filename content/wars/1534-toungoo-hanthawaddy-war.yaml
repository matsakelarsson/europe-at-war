        lonlat: [96.479, 17.336]
      - kind: battle
        side: tg
        name: Naungyo
        date: November or December 1538
        text: Bayinnaung’s light force crossed a river on rafts, burned them and routed the much larger Hanthawaddy army. The site is uncertain; a survey of 1982 placed it in today’s Einme township.
        lonlat: [95.183, 16.900]
