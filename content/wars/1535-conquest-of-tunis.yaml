notes:
  - Dates are Julian. Figures for the size of the expedition and for the dead in the sack of Tunis vary widely between sources.
  - Charles’s campaign was celebrated across Europe as a crusade; the Flemish painter Jan Cornelisz Vermeyen went with the army, and his drawings became the basis of a famous set of tapestries woven by Willem de Pannemaker. Charles’s attack on Algiers in 1541 has its own entry.
