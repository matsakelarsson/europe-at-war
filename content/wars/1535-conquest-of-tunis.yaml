steps:
  - title: La Goulette and Tunis
    date: June–September 1535
    when: "1535-05"
    borders: "1535-07-21"
    countries: [tn, es, it, pt, mt, dz, tr]
    body:
      - Hayreddin Barbarossa, the corsair ruler of Algiers whom Suleiman had made admiral of the Ottoman fleet, raided the coasts of Italy in 1534 and on 16 August took Tunis from its Hafsid sultan, Muley Hasan. From there his galleys could close the narrows between Sicily and Africa. Charles V decided to lead a crusade against him in person. A fleet of several hundred ships carrying about 30,000 soldiers gathered from Spain, Genoa under Andrea Doria, Naples, Sicily, Portugal, the Papal States and the Knights of St John; Francis I of France, then seeking an Ottoman alliance, refused to help. The fleet assembled at Cagliari and landed near the ruins of Carthage in mid-June.
      - La Goulette, the fortress guarding the channel into the lagoon of Tunis, was stormed on 14 July after a month’s siege, and most of Barbarossa’s fleet was taken in the lagoon. As the army marched on Tunis on 21 July, thousands of Christian captives broke out of the kasbah and seized it, and Barbarossa fled to Bône. Charles’s troops then sacked the city, killing many thousands of its people, perhaps 10,000 or more, and enslaving others. Muley Hasan was restored as a vassal of Spain, which kept a garrison in La Goulette. In September Barbarossa struck back by sacking Mahón on Minorca.
    facts:
      - [La Goulette stormed, 14 July 1535]
      - [Tunis taken, 21 July 1535]
      - [Expedition, "about 30,000 soldiers in several hundred ships"]
