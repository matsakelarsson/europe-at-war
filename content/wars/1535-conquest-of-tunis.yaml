id: conquest-of-tunis
name: Conquest of Tunis
start: "1535-05"
end: "1535-08"
tier: B
summary: Emperor Charles V’s expedition against Tunis, which the Ottoman admiral and corsair Hayreddin Barbarossa had seized from its Hafsid sultan in 1534. A fleet from Spain, Genoa, Portugal, the papacy, the Hospitallers and Charles’s Italian kingdoms took the fortress of La Goulette and Tunis in July 1535, sacked the city and restored the Hafsid Muley Hasan as a Spanish vassal, but Barbarossa escaped.
