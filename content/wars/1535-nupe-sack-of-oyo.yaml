id: nupe-sack-of-oyo
name: Nupe wars with Oyo
start: "1535"
end: "1610"
tier: C
summary: "Wars between the Nupe kingdom, on the middle Niger, and the Yoruba kingdom of Oyo, which drove the alaafins (kings) of Oyo from their capital for about three quarters of a century. Oyo tradition, recorded by the Yoruba historian Samuel Johnson in the nineteenth century, tells that in the reign of Alaafin Onigbogi the Nupe, whom the Yoruba call Tapa, defeated Oyo’s armies, besieged the capital, Oyo-Ile, and entered it almost unopposed; the historian Robert Smith dates this to about 1535. Onigbogi fled to Borgu, where he died, and his son Ofinran led the court from place to place on the borders of Borgu and Yorubaland. Eguguojo founded a new capital at Igboho, protected by hills and three walls, where four alaafins were buried. Orompoto, whom some traditions remember as a woman, and Ajiboyede won victories over Borgu and the Nupe, and Oyo rearmed with horses and armour on the Nupe model; the cavalry it built up later made it the strongest power of the savanna west of the Niger. About 1610, in Smith’s chronology, Alaafin Abipa brought the court back to rebuild Oyo-Ile. All dates come from king lists and oral tradition and are approximate; other chronologies put the start of Onigbogi’s reign as early as about 1500."
