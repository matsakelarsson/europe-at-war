  - title: The Dutch join the war
    date: 1606–1610
    when: "1606-08"
    borders: "1606-08-18"
    countries: [my, id, pt, nl]
    body:
      - After 1600 Dutch and English ships reached the strait, and the Dutch East India Company (VOC), founded in 1602, set out to break Portugal’s hold on the trade of the East. In 1606 the viceroy of Portuguese India, Martim Afonso de Castro, sailed with a large fleet to drive the Dutch from the islands and on the way attacked Aceh. The Portuguese landed near the capital and met fierce resistance, in which a young prince, Perkasa Alam, the future Iskandar Muda, was released from prison and distinguished himself; at news of a Dutch attack on Malacca, the viceroy broke off and sailed on.
      - "The VOC fleet of eleven ships under Cornelis Matelief de Jonge had reached Johor on 1 May 1606, and on 17 May Matelief and Raja Bongsu, the brother of Sultan Alauddin Riayat Shah III, signed an alliance: Johor would help to take Malacca, which the Dutch would keep, and the Dutch would trade freely at Johor. The Dutch besieged Malacca, held by André Furtado de Mendonça, but with few soldiers and only limited help from Johor they could not storm it. On 14 August Martim Afonso de Castro’s fleet of about twenty ships arrived, and the siege was lifted. On 16–18 August the two fleets fought off Cape Rachado, the largest sea battle yet fought between Europeans in the archipelago; in the grappling and fires the Dutch lost two ships and about 150 men, the Portuguese two ships and about 500 men, and Matelief broke off and withdrew to Johor. The Portuguese held the field, but two months later the Dutch returned and sank the ten ships left at Malacca."
      - In December 1607 a Portuguese fleet of 13 galleons appeared before Batu Sawar; the sultan set fire to his capital and fled upriver, and the Johor fleet was destroyed. In 1610 Johor made peace with the Portuguese.
    facts:
      - [Johor–VOC alliance, "17 May 1606"]
      - [Battle of Cape Rachado, "16–18 August 1606"]
      - [Johor–Portuguese peace, "1610"]
