  - title: The Ottoman connection and the siege of 1568
    date: 1561–1570
    when: "1568-01"
    borders: "1568"
    countries: [id, my, pt, tr]
    body:
      - Alauddin al-Kahar sent envoys to the Ottoman sultan Suleiman the Magnificent around 1561–1562 and again in 1564, calling him the caliph of Islam and asking for help against the Portuguese, who were attacking the Acehnese pepper ships on their way to the Red Sea. Suleiman’s successor, Selim II, fitted out a fleet of 15 galleys under Kurtoğlu Hızır Reis, but it was diverted to put down a rising in Yemen; only two ships, with guns, gunners and gun-founders, reached Aceh in 1566–1567. The Ottoman experts taught the Acehnese to cast their own bronze cannon; Acehnese ships seem to have been allowed to fly the Ottoman flag, and in the 19th century Aceh claimed to be an Ottoman dependency.
      - In 1564 Alauddin sailed with a fleet that was said to be bound for Patani and instead fell on Johor. The capital, Johor Lama, was sacked and burned, and Sultan Alauddin Riayat Shah II was carried off to Aceh, where he died; Aceh put Muzaffar Shah II on the Johor throne and took Aru for itself. In January 1568 Alauddin led some 15,000 men, with Ottoman gunners and heavy guns, against Malacca itself. The captain, Leonis Pereira, had about 1,500 defenders, only 200 of them Portuguese, and asked Johor and Kedah for help; the Acehnese bombarded the walls and tried to scale them with ladders but were thrown back, and after a Portuguese sortie destroyed their siege works, the sultan sailed home. Alauddin’s eldest son, the ruler of Aru, was killed. Angered by Johor’s help to the Portuguese, the Acehnese burned Johor villages on the way back. Another Acehnese fleet, said to number 100 ships, was ambushed at the mouth of the Formoso river south of Malacca in November 1570, and the heir to the throne was killed.
    facts:
      - [Johor sacked by Aceh, "1564"]
      - [Siege of Malacca, "January 1568, about 15,000 men"]
      - [Ottoman help, "guns and gunners, 1566–1567"]
