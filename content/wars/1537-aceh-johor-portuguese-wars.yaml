notes:
  - Most of what is known about the fighting comes from Portuguese chronicles and letters, which count the enemy’s ships and dead generously; the Acehnese chronicles (the Hikayat Aceh and the Bustan as-Salatin) and the Malay Annals tell parts of the story from the other side, and Dutch reports add detail after 1600. The numbers in this story are those of the sources and are often uncertain.
  - The dates of the Acehnese sultans are disputed in places; Alauddin al-Kahar took power in 1537 or 1539. The Portuguese called the Batu Pahat river the Formoso. The fall of Malacca to the Dutch and Johor in 1641 is told in its own story.
