  - title: Johor between Aceh and Portugal
    date: 1577–1587
    when: "1587"
    borders: "1587"
    countries: [my, id, pt]
    body:
      - The three powers now changed sides as their interests shifted. On 1 January 1577 a Portuguese squadron under Matias de Albuquerque defeated an Acehnese fleet, said to have had 150 ships, near Johor. In 1582 another Acehnese fleet of 150 vessels attacked Malacca, burning a Portuguese galliot with all its crew, then sailed on to attack Johor; at Johor’s request the Portuguese sent twelve ships, which burned some of the largest Acehnese galleys, and the Acehnese lifted the siege.
      - Under Sultan Ali Jalla Abdul Jalil Shah II, who had moved the capital back to Johor Lama in the early 1570s, Johor grew strong on trade and turned against the Portuguese. After a dispute over the cargo of a wrecked Portuguese ship, Johor diverted shipping from Malacca to its own port and in 1586 drew merchant ships through the Singapore Strait to Johor Lama; in January 1587 its fleet attacked Malacca. The viceroy at Goa sent Paulo de Lima with three galleons and 500 men. In 1587, after a bombardment, the Portuguese stormed the fortified town of Johor Lama, defended, by their account, by 12,000 men, and destroyed it; they reported taking more than 1,000 guns, most of them small, and burning about 2,000 vessels. The sultan withdrew upriver and built a new capital at Batu Sawar.
    facts:
      - [Johor Lama destroyed by the Portuguese, "1587"]
      - [New Johor capital, "Batu Sawar"]
