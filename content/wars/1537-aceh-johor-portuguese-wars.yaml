  - title: Johor and Japara besiege Malacca
    date: 1550–1551
    when: "1551"
    borders: "1551"
    countries: [my, id, pt]
    body:
      - Sultan Alauddin Riayat Shah II of Johor broke the peace of 1536 and gathered a coalition to take back his father’s city. Perak and Pahang sent ships, and in answer to a request sent to Java in 1550, Ratu Kalinyamat, the queen of Japara and daughter of Sultan Trenggana of Demak, sent some 40 junks with about 4,000 soldiers. In 1551 the allied fleet of about 200 vessels and 10,000 men attacked Malacca, which had a garrison of about 400 Portuguese.
      - The allies took much of the town north of the river but could not break into the fortress or cut its supply by sea. After three months the Malay forces withdrew, according to Portuguese accounts after the captain, Pedro da Silva, spread rumours of an attack on their own coasts. The Javanese held on alone until their commanders were killed, and were then defeated on the beach as they tried to re-embark, losing, by the Portuguese count, more than 2,000 men; two of their ships were driven ashore by a storm. Johor did not try again by itself, and Japara’s queen waited more than twenty years to send a second fleet.
    facts:
      - [Allied fleet, "about 200 vessels, 10,000 men"]
      - [Siege, "three months, 1551"]
