  - title: Three sieges in three years
    date: 1573–1575
    when: "1574-10"
    borders: "1575"
    countries: [id, my, pt]
    body:
      - In October 1573, when most of the Malacca garrison was away on trading voyages, Sultan Ali Riayat Syah I of Aceh sent about 7,000 men in some 90 vessels, having asked the queen of Japara to join him. The Acehnese landed south of the city on 13 October and set fires inside it with incendiary shot, but a storm put the fires out and scattered their fleet. Their commander then tried to starve the city out from a base on the Muar, until a small Portuguese fleet under Tristão Vaz da Veiga captured his flagship and the rest of the fleet dispersed.
      - Japara’s fleet arrived only after Aceh had gone. In October 1574 Ratu Kalinyamat’s commander, Kyai Demang (Quilidamão in Portuguese accounts), anchored in a river near Malacca with 70 to 80 junks, more than 200 smaller craft and, by the Portuguese count, 15,000 men, but few guns. The city had only about 300 Portuguese defenders. Tristão Vaz sent a galley and four smaller craft into the river by night, which burned about thirty junks, then destroyed the stockades the Javanese built at the river mouth and blockaded it. In December the trapped Javanese tried to break out in their few remaining ships and were hunted down at sea; the Portuguese reckoned their losses after three months at about 7,000 dead.
      - At the end of January 1575 a new Acehnese fleet of 113 vessels appeared. It destroyed the Portuguese ships that came out against it, killing 75 men and three captains, and the garrison was down to about 150 Portuguese soldiers, with little food or powder left. Tristão Vaz kept the besiegers guessing with small sorties, and after seventeen days the Acehnese, fearing a trap, lifted the siege and sailed home. In June a fleet from Goa brought 500 men to relieve the city.
    facts:
      - [Acehnese siege, "October 1573"]
      - [Japara’s siege, "October – December 1574, about 7,000 Javanese dead"]
      - [Acehnese siege, "January – February 1575, 17 days"]
