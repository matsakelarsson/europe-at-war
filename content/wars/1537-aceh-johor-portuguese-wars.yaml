id: aceh-johor-portuguese-wars
name: Aceh, Johor and Portugal’s wars for the Strait of Malacca
start: "1537-09"
end: "1629-12"
tier: A
summary: "The century of wars between Portuguese Malacca, the sultanate of Aceh in northern Sumatra and the sultanate of Johor, heir of the old Malacca sultanate, for control of the Strait of Malacca, the main sea route between the Indian Ocean and the China Sea. Historians call it a triangular war, because each of the three fought the other two in turn. Aceh, which had grown rich on the pepper trade that Muslim merchants moved there after 1511 and that it shipped to the Red Sea in defiance of the Portuguese, attacked Malacca again and again from 1537, with gunners and guns from the Ottoman Empire after the 1560s. Johor, which wanted Malacca back, besieged it with Javanese help in 1551, but feared Aceh more and often sided with the Portuguese; Aceh sacked the Johor capital in 1564, the Portuguese in 1587. Japara, the Javanese port ruled by Ratu Kalinyamat, sent its fleets against Malacca in 1551 and 1574. After 1600 the Dutch East India Company joined the war as Johor’s ally against Portugal, besieging Malacca in 1606. Aceh reached its height under Iskandar Muda (1607–1636), who conquered Pahang, Kedah and Perak, carried their people off to Aceh and sacked Johor three times, until his great armada was destroyed at the Duyon River outside Malacca in 1629 by the Portuguese, helped by Johor and Patani. Aceh never again threatened Malacca, and in 1641 the Dutch and Johor took the city from the Portuguese."
countries: [id, my, sg, th, pt, nl, tr]
