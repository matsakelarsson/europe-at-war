  - title: Disaster at the Duyon River
    date: 1628–1629
    when: "1629-10"
    borders: "1629-12"
    countries: [my, id, th, pt]
    body:
      - In 1628 the Portuguese destroyed an Acehnese advance fleet in the Langat river; about 3,000 Acehnese were killed, captured or lost. Iskandar Muda pressed on with his plan to take Malacca before the Dutch or the English could. In early June 1629 an Acehnese armada of 236 vessels, among them 38 great galleys, appeared before the city with about 19,000 men and siege guns. The sultan soon went home and left the command to his admiral, the laksamana, who sheltered the fleet in the Duyon river, a few kilometres south-east of the city, and from 6 June pushed the defenders, some 260 Portuguese soldiers, 120 armed residents and 400 local Christian auxiliaries, back behind the walls. Johor sent 2,000 warriors from Pahang and then a fleet that kept the sea open, so that Malacca never ran short of supplies, while disease spread in the Acehnese camp.
      - A relief fleet of about thirty light vessels and 900 Portuguese soldiers sailed from Goa under Nuno Álvares Botelho and arrived on 21 October. Botelho blocked the mouth of the Duyon by sinking a ship loaded with stones, trapping the Acehnese, who withdrew to their ships and stockades along the river. On 8 November their flagship, a huge galley the Portuguese called the Wonder of the World, tried to break out at the spring tide, struck the sunken ship and was towed back in flames. On 30 November a fleet of 60 vessels from Johor and 100 from Patani arrived with 9,000 men under the sultan of Johor himself. The laksamana, refusing to surrender unconditionally, burned his ships and on 6 December led the survivors overland towards Pahang, where he was captured and handed over to the Portuguese. The Portuguese claimed that none of the 19,000 men and none of the ships returned to Aceh.
      - The disaster ended Aceh’s expansion. Perak went over to the Portuguese side, and Iskandar Muda sent only two more expeditions to the peninsula, against revolts in Pahang. He died on 27 December 1636. His successor Iskandar Thani made peace overtures to Malacca, and the queens who ruled Aceh after 1641 did not pursue his conquests. Johor became the leading Malay power in the strait, and in 1641, with the Dutch, it took Malacca from the Portuguese.
    facts:
      - [Acehnese armada, "236 vessels, about 19,000 men"]
      - [Portuguese relief, "21 October 1629"]
      - [Aceh’s army withdraws, "6 December 1629"]
