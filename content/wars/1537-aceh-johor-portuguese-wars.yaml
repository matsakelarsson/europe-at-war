  - title: Iskandar Muda
    date: 1612–1623
    when: "1617"
    borders: "1620"
    countries: [id, my, sg, pt]
    body:
      - Iskandar Muda, “the young Alexander”, became sultan of Aceh in April 1607 and built up a navy of heavy galleys, some carrying 600 to 800 men, an elephant corps and more than 2,000 guns. He conquered Deli in 1612 and Aru in 1613. On 4 May 1613 an armada of 60 to 70 ships and, by different counts, 20,000 to 40,000 men entered the Johor river; Batu Sawar fell on 6 June, and the sultan’s brother Raja Bongsu and 22 Dutchmen who had fought for Johor were taken to Aceh. Raja Bongsu was married to Iskandar Muda’s sister and sent back to rule Johor as Sultan Abdullah Ma’ayat Shah, a vassal of Aceh, but in 1614 he made a truce with the Portuguese. In 1615 an even larger armada destroyed Batu Sawar again; on its way back it met the Portuguese at the mouth of the Formoso river, in one of the bloodiest battles the Portuguese fought in Southeast Asia, and after heavy losses on both sides Iskandar Muda gave up his attack on Malacca.
      - Iskandar Muda then turned on the tin- and pepper-producing states of the peninsula. In 1617 he conquered Pahang and took its sultan, Ahmad, to Aceh; Ahmad’s son later became his son-in-law and successor, Iskandar Thani. In 1619 his forces laid waste the capital of Kedah and carried its surviving inhabitants to Aceh, and in July 1620 an armada took Perak, capturing its sultan and some 5,000 people, many of whom died in Aceh; one aim of Iskandar Muda’s campaigns was to bring captives to work the land. In 1623 an Acehnese fleet took Lingga, where the Johor sultan had moved his court; Abdullah fled to the Tambelan islands and died there. Johor, under Sultan Abdul Jalil Shah III from 1623, held out in alliance with Pahang, Palembang, Jambi and other Sumatran ports, and the Portuguese at Malacca strengthened their walls.
    facts:
      - [Batu Sawar taken, "6 June 1613; again 1615"]
      - [Pahang, Kedah and Perak conquered, "1617, 1619, 1620"]
      - [Lingga taken, "1623"]
