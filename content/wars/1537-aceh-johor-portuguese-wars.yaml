steps:
  - title: Aceh’s first attacks, and the Perlis River
    date: 1537–1547
    when: "1547-12"
    borders: "1547-12-06"
    countries: [id, my, pt]
    body:
      - Aceh, at the northern tip of Sumatra, had become a power under Sultan Ali Mughayat Syah, who in the 1520s took the neighbouring ports of Pedir and Pasai, driving the Portuguese from their fort at Pasai in 1524. Many Muslim merchants who had left Malacca after the Portuguese conquest moved to Aceh, and its pepper went to the Red Sea and the Ottoman Empire by routes that avoided Portuguese strongholds. Ali’s son Alauddin al-Kahar, who seized the throne in 1537 or 1539, made war on Malacca his aim. In September 1537 about 3,000 Acehnese landed by night near Malacca and ravaged its outskirts, but after two nights of fighting they were driven out with the loss, the Portuguese reported, of 500 men.
      - In 1539 Alauddin turned against Aru, the kingdom on the east coast of Sumatra opposite Malacca, and killed its ruler, but Johor, the sultanate founded by the son of Malacca’s last sultan, sent an army that forced him to withdraw, and Aru stayed in Johor’s sphere until 1564. Johor itself had fought the Portuguese in 1533–1536, until they captured its fleet and it made peace. In 1547 an Acehnese fleet of about 60 vessels and 5,000 men, under the king of Pedir and with some Ottoman soldiers, tried to surprise Malacca by night, but was discovered as it landed and withdrew to the north. Urged on by the missionary Francis Xavier, who was in the city, the Portuguese sent a small squadron after it under Francisco de Eça; on 6 December it found the Acehnese fleet in the Perlis river and destroyed or captured nearly all of it. The ruler of Perlis became a tributary ally of Portugal.
    facts:
      - [First siege of Malacca, "September 1537, 3,000 men"]
      - [Battle of the Perlis River, "6 December 1547, Portuguese victory"]
