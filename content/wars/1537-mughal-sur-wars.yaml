  - title: Hemu and the Second Battle of Panipat
    date: October 1556 – July 1557
    when: "1556-10-07"
    borders: "1556-10-07"
    countries: [in, pk]
    body:
      - "Hemu was a Hindu of humble origins from Rewari, south-west of Delhi, who had risen under Islam Shah from market superintendent to high office and become Adil Shah’s chief minister and general. He is said to have won some twenty battles for his master against rival Sur claimants. When Humayun died, Hemu marched west from Bengal, drove the Mughal garrisons out of the towns of the Ganges plain and took Agra. On 7 October 1556 he defeated the Mughal governor of Delhi, Tardi Beg Khan, at Tughlaqabad and entered the city, where he took the royal title Vikramaditya. Historians disagree on whether he meant to rule in his own name or still for Adil Shah."
      - "Bairam Khan had Tardi Beg executed for his retreat and led Akbar’s army south. Before the battle Mughal cavalry under Ali Quli Khan captured Hemu’s artillery train, which had been left weakly guarded. On 5 November 1556 the armies met at Panipat, on the field of Babur’s victory thirty years earlier. Hemu, riding a war elephant, broke both Mughal wings, but an arrow struck him in the eye and he fell unconscious in his howdah. Seeing their leader down, his army fled."
      - "Hemu was brought to the Mughal camp and beheaded; Mughal chronicles later claimed that Akbar refused to strike a helpless man, which many historians doubt. Adil Shah was killed in Bihar in April 1557 by the ruler of Bengal, and Sikandar Shah, besieged in the hill fort of Mankot, surrendered on 25 July 1557. The Sur empire was gone, and under Akbar the Mughals ruled northern India for two centuries."
    facts:
      - [Battle of Tughlaqabad, "7 October 1556, Sur victory"]
      - [Second Battle of Panipat, "5 November 1556, Mughal victory"]
      - [Sikandar Shah surrenders at Mankot, "25 July 1557"]
    markers:
