  - title: Chausa
    date: 26 June 1539
    when: "1539-06-26"
    borders: "1539-06-26"
    countries: [in]
    body:
      - "Early in 1539 Humayun left Gaur and marched back up the Ganges. Sher Khan barred his way at Chausa, near where the Karmanasa river flows into the Ganges, and for about three months the two armies faced each other while envoys discussed terms. The monsoon broke and flooded the low ground where the Mughals were camped."
      - "Before dawn on 26 June 1539 Sher Khan’s men fell on the Mughal camp from several sides. Many of Humayun’s soldiers were killed or drowned in the swollen river, perhaps 7,000 to 8,000 in all. Humayun escaped across the Ganges; according to Mughal tradition he was kept afloat by a water-carrier named Nizam, whom he later rewarded by letting him sit on the throne for half a day. The camp, the guns and many of the women of the court were captured; Sher Khan had the women sent back with honour."
      - "After the victory Sher Khan took the title Sher Shah and had coins struck and the Friday prayer read in his name. Humayun reached Agra and made peace with his brothers, but Kamran, ill and suspicious, soon took his troops back to Lahore."
    facts:
      - [Battle of Chausa, "26 June 1539, Sur victory"]
      - [Mughal losses, "about 7,000–8,000 killed or drowned"]
    markers:
