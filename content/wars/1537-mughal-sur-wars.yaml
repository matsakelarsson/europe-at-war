steps:
  - title: Chunar and Gaur
    date: 1537–1538
    when: "1537-10"
    borders: "1538-04"
    countries: [in, bd]
    body:
      - "Humayun inherited his father’s realm in 1530, but not his authority. His brother Kamran took Kabul and the Punjab, and in 1535–36 Humayun spent his strength conquering Gujarat, which he lost again within a year. Meanwhile Sher Khan, an Afghan of the Sur clan who had risen in the service of the Lohani rulers of Bihar, made himself master of Bihar. He held the fortress of Chunar on the Ganges, and in 1537 he invaded Bengal."
      - "In late 1537 Humayun marched east and laid siege to Chunar, which held out for about six months. Sher Khan used the time well. In March 1538 he took the hill fortress of Rohtasgarh by a ruse and lodged his family and treasure there, and in April he captured Gaur, the capital of Bengal, and carried off its wealth."
      - "Humayun followed him into Bengal and entered Gaur in the late summer of 1538, but stayed there through the rains. Behind him Sher Khan’s men took Benares, besieged Jaunpur and raided as far as Kannauj, cutting the road to Agra, while at Agra Humayun’s brother Hindal had the Friday prayer read in his own name."
    facts:
      - [Siege of Chunar, "late 1537 – 1538"]
      - [Rohtasgarh taken by Sher Khan, "March 1538"]
      - [Gaur taken by Sher Khan, "April 1538"]
