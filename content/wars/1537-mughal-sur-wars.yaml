  - title: Sher Shah’s empire
    date: 1540–1545
    when: "1542"
    borders: "1544-06"
    countries: [in, pk, bd]
    body:
      - "Sher Shah ruled for only five years, but his reign left a mark on the government of India. He had the land surveyed and taxed by its yield, rebuilt the great road from Bengal to the Indus, later called the Grand Trunk Road, with inns and wells along it, set up a mounted post, and issued a silver coin of a fixed weight, the rupiya, the ancestor of the rupee."
      - "He also kept fighting. In 1542 he took Malwa. In 1543 he besieged Raisen, and when its Rajput garrison under Puran Mal came out under terms, his troops attacked and killed them, an act his own historians found hard to excuse. In January 1544 he defeated the army of Marwar at Sammel, where the Rathore commanders Jaita and Kumpa died fighting after their ruler Maldeo had withdrawn; Sher Shah is said to have remarked that he had nearly lost the empire of Hindustan for a handful of millet. Jodhpur fell, and the rana of Mewar handed over Chittorgarh."
      - "In November 1544 Sher Shah besieged Kalinjar, the fortress of the Bundela country. On 22 May 1545, as the final assault began, a store of gunpowder or a rebounding rocket exploded near him, and he died of his burns the same day, after hearing that the fort had fallen. He was buried in the great tomb he had built at Sasaram. His son Jalal Khan succeeded him as Islam Shah."
    facts:
      - [Malwa annexed, "1542"]
      - [Battle of Sammel, "5 January 1544, Sur victory"]
      - [Death of Sher Shah, "22 May 1545, at Kalinjar"]
