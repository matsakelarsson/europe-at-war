  - title: Exile
    date: 1541–1545
    when: "1541"
    borders: "1545-11-18"
    countries: [pk, af, ir, in]
    body:
      - "For two years Humayun tried to find a base in Sindh, whose Arghun ruler, Shah Husain, gave him no help. There he married Hamida Banu Begum. In 1542 he crossed the Thar desert to seek the help of Rao Maldeo of Marwar, but learning that Maldeo had come to terms with Sher Shah, he turned back across the sand, losing men and animals to thirst. At Umarkot, whose Rajput ruler took him in, Hamida gave birth to their son Akbar on 15 October 1542."
      - "In 1543 Humayun left Sindh for Kandahar, held by his brother Askari, who tried to seize him. Humayun fled into Persia, leaving the infant Akbar behind, and in 1544 was received by Shah Tahmasp at Qazvin. Tahmasp gave him about 12,000 horsemen on condition that Kandahar be handed to Persia, and Humayun had to outwardly accept the Shia faith."
      - "With the Persian army Humayun besieged Kandahar from March 1545. Askari gave it up in September and it went to the Persians, but Humayun soon took it for himself. On 18 November 1545 he entered Kabul unopposed and found Akbar again. For eight more years he fought Kamran for Kabul, until in 1553 he had his brother blinded and sent to Mecca."
    facts:
      - [Birth of Akbar, "15 October 1542, at Umarkot"]
      - [Humayun meets Shah Tahmasp, "1544, at Qazvin"]
      - [Kandahar surrenders, "3 September 1545"]
      - [Kabul entered, "18 November 1545"]
