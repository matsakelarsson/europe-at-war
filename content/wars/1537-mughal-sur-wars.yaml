  - title: Kannauj, and the loss of India
    date: May 1540 – 1541
    when: "1540-05-17"
    borders: "1540-05-17"
    countries: [in, pk]
    body:
      - "Humayun gathered a new army at Agra, though Kamran sent only a few troops, and marched down the Ganges to meet Sher Shah near Kannauj. On 17 May 1540 the armies met near Bilgram, on the east bank opposite Kannauj, after weeks of waiting in which the rains again flooded the Mughal camp. Humayun’s cousin Mirza Haidar Dughlat, who fought in the battle and later wrote about it, said the Mughal army was routed almost without a fight."
      - "Humayun fled through Agra and Delhi to Lahore, where his brothers met but could not agree. As Sher Shah’s army approached in the autumn of 1540, the Mughals abandoned the Punjab. Kamran and Askari went to Kabul and Kandahar, Mirza Haidar went off to conquer Kashmir, and Humayun, with a dwindling band of followers, turned south towards Sindh."
      - "Sher Shah, crowned again as ruler of Hindustan, secured the north-west by building the great fortress of Rohtas near the Jhelum to watch the Gakhar tribes and the road from Kabul."
    facts:
      - [Battle of Kannauj (Bilgram), "17 May 1540, Sur victory"]
      - [Mughals leave the Punjab, "autumn 1540"]
