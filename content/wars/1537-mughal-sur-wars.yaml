  - title: The Sur split, and Humayun’s return
    date: 1554–1556
    when: "1554-11-22"
    borders: "1555-07-23"
    countries: [in, pk]
    body:
      - "Islam Shah held his father’s empire together until his death in late 1554. His young son Firuz was murdered within days by his uncle, who took the throne as Muhammad Adil Shah, and the empire broke apart. Ibrahim Shah Sur seized Delhi and Agra, Sikandar Shah Sur proclaimed himself in the Punjab, and Bengal went its own way. Adil Shah held the east, with his able Hindu minister Hemu as his general."
      - "Humayun saw his chance. He crossed the Indus with a small army led by his general Bairam Khan, and in February 1555 occupied Lahore. In May his troops won a battle at Machhiwara on the Sutlej, and on 22 June 1555 at Sirhind they routed Sikandar Shah, who had driven Ibrahim from Delhi and Agra and come north with a much larger army. Sikandar fled into the Siwalik hills."
      - "On 23 July 1555 Humayun entered Delhi, fifteen years after he had lost it. His restoration was short. On 24 January 1556 he slipped on the steep stairs of his library in the Purana Qila in Delhi, and he died three days later. Bairam Khan had his 13-year-old son Akbar proclaimed emperor at Kalanaur in the Punjab, where they were campaigning against Sikandar."
    facts:
      - [Death of Islam Shah, "22 November 1554"]
      - [Battle of Sirhind, "22 June 1555, Mughal victory"]
      - [Humayun re-enters Delhi, "23 July 1555"]
      - [Death of Humayun, "27 January 1556"]
