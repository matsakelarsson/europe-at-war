id: mughal-sur-wars
name: Mughal–Sur wars
start: "1537"
end: "1557-07-25"
tier: A
summary: "The struggle between Babur’s son Humayun and the Afghan Sur dynasty for northern India. Sher Khan Sur, an Afghan chief of Bihar, took Bengal in 1538, destroyed Humayun’s army at Chausa in 1539 and beat him again at Kannauj in 1540, driving the Mughals out of India. As Sher Shah he ruled from Bengal to the Indus until his death in 1545, building roads, forts and a new silver coinage. Humayun wandered through Sindh and the desert, where his son Akbar was born, and found help in Safavid Persia, which let him take Kandahar and Kabul in 1545. When the Sur empire split between rival claimants after 1554, he came back, won at Sirhind and re-entered Delhi in July 1555, but died six months later. Hemu, general of the Sur ruler Adil Shah, then took Agra and Delhi, until the Mughal army of the 13-year-old Akbar and his regent Bairam Khan defeated him at the Second Battle of Panipat on 5 November 1556."
countries: [in, pk, af, bd]
sides:
  - id: mug
    name: Mughals (Humayun, then Akbar)
    polities: [mughals]
    ink: green
    moves: Mughal moves
    success: Mughal success
  - id: sur
    name: Sur dynasty (Sher Shah and his successors)
    polities: [sur-empire]
    ink: orange
    moves: Sur moves
    success: Sur success
notes:
  - Dates are in the Julian calendar, as the sources give them.
  - The main sources are Mughal court histories written later (Abu’l-Fazl’s Akbarnama, Gulbadan Begum’s memoir of her brother Humayun, Jauhar’s memoir) and the Afghan histories of Abbas Khan Sarwani and others. Army sizes in them are unreliable.
  - Humayun’s quarrels with his brothers Kamran, Askari and Hindal, who held Kabul, Kandahar and the Punjab at different times, run through the whole story; they are mentioned only where they shaped the war with the Surs.
