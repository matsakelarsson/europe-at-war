id: third-ottoman-venetian-war
name: Third Ottoman–Venetian War
start: "1537"
end: "1540-10-02"
tier: B
summary: A war that began when Suleiman the Magnificent, gathering forces in Albania to invade Italy in concert with France, turned instead on Venetian Corfu. The siege of 1537 failed, but Hayreddin Barbarossa took Venice’s Aegean islands, beat the Holy League fleet of Venice, the pope and Charles V at Preveza in 1538 and retook Castelnuovo in 1539. In the peace of 1540 Venice gave up its last towns in the Morea and paid 300,000 ducats.
countries: [gr, al, it, me, es, mt, tr]
sides:
  - id: ve
    name: Republic of Venice
    polities: [venice]
    ink: red
    moves: Venetian moves
    success: Venetian success
  - id: hl
    name: Charles V and the pope
    polities: [spain, habsburg, genoa, papal-states, malta, naples, sicily]
    ink: gold
    moves: Imperial and papal moves
    success: Imperial and papal success
  - id: ot
    name: Ottoman Empire
    polities: [ottoman]
    ink: teal
    moves: Ottoman moves
    success: Ottoman success
notes:
  - Dates are Julian. The size of the fleets at Preveza differs widely between sources; most give the Holy League well over 100 galleys and many sailing ships, and Barbarossa about 120 galleys and galliots.
  - Venetian and imperial writers blamed each other for the defeat at Preveza. Venetians accused Andrea Doria, the Genoese admiral of Charles V, of holding back his ships on purpose, while imperial writers said the Venetians would not follow his orders.
