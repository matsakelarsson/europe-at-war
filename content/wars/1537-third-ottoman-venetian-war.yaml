steps:
  - title: Corfu
    date: 1537
    when: "1537-07"
    borders: "1537-09-15"
    countries: [gr, al, it, tr]
    body:
      - In 1537 Suleiman brought a great army to Valona in Albania, meaning to cross to Italy with Hayreddin Barbarossa’s fleet while his ally Francis I of France attacked Charles V in the north. At the end of July Ottoman troops landed near Otranto and ravaged the country, carrying thousands of people into slavery, but the French attack was slow to come and they were withdrawn. A series of clashes at sea with Venetian galleys gave the sultan a reason to turn on Venice, which had tried to stay neutral.
      - In late August some 25,000 Ottoman troops landed on Corfu, Venice’s key to the Adriatic. They burned the countryside and carried off many islanders, but the guns of the citadel, rebuilt to withstand artillery, held them off. With rain, disease in the camp and the season ending, Suleiman lifted the siege in mid-September. Barbarossa then swept through the Aegean, sacking Aegina and taking or forcing tribute from the Venetian islands and the Duchy of Naxos.
    facts:
      - [Siege of Corfu, "late August – mid-September 1537"]
      - [Ottoman troops on Corfu, "about 25,000"]
      - [Islands lost by Venice, "Aegina, Paros, Ios, Karpathos and others"]
    markers:
