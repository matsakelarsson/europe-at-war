  - title: Preveza and the peace
    date: 1538–1540
    when: "1538-02"
    borders: "1540-10-02"
    countries: [gr, it, es, me, mt, tr]
    body:
      - In February 1538 Pope Paul III, Venice and Charles V formed a Holy League. In September its fleet, under the Genoese admiral Andrea Doria with the Venetians under Vincenzo Capello and the papal galleys under Marco Grimani, found Barbarossa’s smaller fleet sheltering in the Gulf of Arta, near the old battlefield of Actium. Doria would not force the narrow entrance under the guns of Preveza. On 28 September, as the League ships moved off down the coast, Barbarossa came out and attacked. The League lost a number of ships, and Doria withdrew to Corfu with the rest.
      - In October Spanish troops took Castelnuovo at the mouth of the Bay of Kotor, but in the summer of 1539 Barbarossa besieged it by land and sea and killed almost all of its garrison. Venice made a separate peace on 2 October 1540. It gave up Nauplia and Monemvasia, its last towns in the Morea, recognised the loss of the Aegean islands and paid 300,000 ducats. The Ottoman fleet was now the strongest in the eastern Mediterranean.
    facts:
      - [Holy League, February 1538]
      - [Battle of Preveza, "28 September 1538, Ottoman victory"]
      - [Peace, "2 October 1540; Venice cedes Nauplia and Monemvasia and pays 300,000 ducats"]
    markers:
      - kind: naval
        side: ot
        name: Battle of Preveza
        date: 28 September 1538
        text: Barbarossa sallied from the Gulf of Arta and attacked the larger League fleet as it moved off. Doria broke off the fight.
        lonlat: [20.75, 38.96]
      - kind: taken
        side: ot
        name: Castelnuovo
        date: August 1539
        text: Taken by Spanish troops in 1538 and retaken by Barbarossa after a hard siege, in which most of the garrison died.
        lonlat: [18.53, 42.45]
      - kind: treaty
        side: ot
        name: Nauplia
        date: 2 October 1540
        text: Venice gave up Nauplia and Monemvasia in the peace. It won them back only in 1686.
        lonlat: [22.8, 37.57]
      - kind: event
        side: ot
        name: Monemvasia
        date: 1540
        text: The rock fortress, Venetian since 1464, was handed over to the Ottomans under the peace.
        lonlat: [23.06, 36.69]
    arrows:
      - side: hl
        label: Andrea Doria
        via: [[19.92, 39.6], [20.3, 39.25], [20.62, 38.98]]
