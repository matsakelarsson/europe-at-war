  - title: Al-Mutahhar’s revolt and Sinan Pasha
    date: 1567–1585
    when: "1567"
    borders: "1585"
    countries: [ye, sa]
    body:
      - Özdemir’s successors governed harshly and set Yemen’s rival groups against Ottoman rule. In 1567 al-Mutahhar, now imam, led the highland tribes to take Sanaa. The Ottoman commander Murad Pasha was ambushed and, in a last battle near Dhamar around 1568, killed; his head was sent to al-Mutahhar. Only Zabid was left in Ottoman hands.
      - Sultan Selim II ordered the whole Ottoman army of Egypt to Yemen under Sinan Pasha. In 1569–1570 Sinan retook Aden, Taiz and Ibb and besieged the stronghold of Shibam Kawkaban for seven months, until a truce was made; al-Mutahhar was pushed back into the mountains but not defeated. After his death in 1572 the Zaydis were divided, and in 1583 the Ottomans took Sanaa, Sa‘dah and Najran. The imam al-Nasir Hasan was captured in 1585 and sent to Constantinople, and a dozen years of peace followed.
    facts:
      - [Sanaa taken by al-Mutahhar, "1567"]
      - [Siege of Shibam Kawkaban, "1570, seven months"]
      - [Sa‘dah and Najran taken by the Ottomans, "1583"]
    markers:
