steps:
  - title: Aden, Zabid and Sanaa
    date: 1538–1561
    when: "1538"
    borders: "1552"
    countries: [ye]
    body:
      - The Ottomans had inherited a foothold in the Tihama when they conquered Mamluk Egypt in 1517, and they wanted Yemen as a base against the Portuguese, who were trying to close the Red Sea. In 1538 the governor of Egypt, Hadım Suleiman Pasha, sailed with a fleet of some 90 ships on his way to attack the Portuguese at Diu in India. At Aden he seized the last Tahirid sultan, ‘Amir ibn Da’ud, and had him killed, and the port became Ottoman. In 1539 the Ottomans took Zabid, which became the seat of their province, and then the whole Tihama.
      - The northern highlands, with Sanaa, were ruled by the Zaydi imam al-Mutawakkil Yahya Sharaf al-Din. When he chose his son Ali as his successor, another son, al-Mutahhar, turned to the Ottomans. With his tribal allies they stormed Taiz and in August 1547 entered Sanaa. Al-Mutahhar soon turned against the Ottomans and retook Sanaa, but Özdemir Pasha drove him back to his mountain fortress of Thula and governed Yemen from 1552 to 1560, building forts and securing the roads. Ottoman losses were heavy throughout; an Ottoman official wrote that Yemen melted armies “like salt dissolved in water”.
    facts:
      - [Aden taken, "1538"]
      - [Sanaa taken, "August 1547"]
