  - title: Al-Qasim and the Ottoman withdrawal
    date: 1597–1636
    when: "1629-03-09"
    borders: "1636"
    countries: [ye]
    body:
      - Resentment at Ottoman rule and at the promotion of the Sunni Hanafi school over Zaydi teaching grew, and in September 1597 the scholar al-Qasim ibn Muhammad proclaimed himself imam as al-Mansur. His first years were hard, but after 1604 the lord of the mountain stronghold of Hajjah and others came over to him, and by 1608 he held most of the highlands and agreed a ten-year truce with the Ottomans. He died in 1620.
      - His son al-Mu’ayyad Muhammad broke the truce in 1626, and the northern tribes, now well armed with muskets, rose behind him while the Ottomans were also fighting Shah Abbas in Iraq. Most of the Tihama fell; in 1627 Aden and Lahej were lost. On 9 March 1629, by one account, the Ottoman governor handed over Sanaa and withdrew to the coast, and Taiz fell the same year. A last Ottoman offensive failed, and the Ottomans agreed to give up Zabid, Mocha and Kamaran island, leaving Yemen by 1636. The Qasimid imams went on to rule most of Yemen, including the south, until the 18th century.
    facts:
      - [Al-Qasim proclaims the imamate, "September 1597"]
      - [Sanaa handed over, "1628 or 1629"]
      - [Last Ottoman garrisons leave, "1635–1636"]
