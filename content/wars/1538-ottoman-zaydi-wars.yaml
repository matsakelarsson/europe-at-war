id: ottoman-zaydi-wars
name: Ottoman–Zaydi wars in Yemen
start: "1538"
end: "1636"
tier: B
summary: The century-long struggle between the Ottoman Empire and the Zaydi imams of the Yemeni highlands. The Ottomans took Aden and the coastal plain of the Tihama in 1538–1539, as a base against the Portuguese in the Indian Ocean, and Sanaa in 1547. Imam al-Mutahhar drove them almost out of the country in 1567–1568, but Sinan Pasha reconquered it in 1569–1570 and by 1583–1585 the whole of Yemen was Ottoman. In 1597 Imam al-Mansur al-Qasim began a new revolt, and his son al-Mu’ayyad Muhammad took Sanaa in 1629 and forced the last Ottoman garrisons to leave Zabid and Mocha by 1636. Yemen remained an independent Zaydi state until the Ottomans returned in 1849.
countries: [ye, sa]
sides:
  - id: ot
    name: Ottoman Empire
    polities: [ottoman]
    ink: teal
    moves: Ottoman moves
    success: Ottoman success
  - id: zy
    name: Zaydi imamate
    polities: [zaydi-imamate]
    ink: green
    moves: Zaydi moves
    success: Zaydi success
  - id: tah
    name: Tahirid sultanate
    polities: [tahirids-yemen]
    ink: orange
    moves: Tahirid moves
    success: Tahirid success
notes:
  - Dates for the last phase differ between sources. Sanaa is said to have been handed over in 1628 or on 9 March 1629, and the final Ottoman withdrawal from Zabid and Mocha is dated 1634, 1635 or 1636.
  - Ottoman writers describe Yemen as the graveyard of their soldiers; one figure, of 80,000 men sent from Egypt in 1539–1547 of whom only 7,000 survived, comes from an Ottoman official and cannot be checked.
