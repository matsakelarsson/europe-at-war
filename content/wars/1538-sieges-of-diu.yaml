steps:
  - title: The siege of 1538
    date: June – November 1538
    when: "1538-06-26"
    borders: "1538-06-26"
    countries: [in, pt, tr]
    body:
      - "In 1535, threatened by the Mughal invasion of Humayun, Sultan Bahadur Shah of Gujarat let the Portuguese build a fortress at Diu in return for their help. When the danger passed he tried to be rid of them, and at the same time asked the Ottoman sultan Suleiman for a fleet. In February 1537 Bahadur drowned off Diu during a meeting with the Portuguese governor, each side accusing the other of treachery. The next year the Gujarati commander Khadjar Safar laid siege to the fort with a large army, and on 4 September an Ottoman fleet of about 70 galleys and other ships arrived under Hadım Suleiman Pasha, governor of Egypt, who had seized Aden on the way."
      - "The garrison under António da Silveira numbered about 600 Portuguese soldiers, with servants and the families of the town. The Ottomans landed heavy guns and bombarded the walls for two months, and several assaults were beaten back with heavy losses on both sides. By the end of October only a few dozen of the defenders could still fight. But Suleiman Pasha had fallen out with the Gujarati nobles, who stopped supplying his men and feared Ottoman ambitions as much as Portuguese ones, and rumours of a Portuguese relief fleet from Goa reached him. On 6 November the Ottoman fleet sailed away, leaving behind some of its guns."
      - "The Gujaratis gave up the siege soon after, and made peace with the Portuguese in 1539. The failure was a blow to Ottoman hopes of driving the Portuguese from the Indian Ocean; Suleiman Pasha’s fleet did not come to India again."
    facts:
      - [Siege of Diu, "26 June – 6 November 1538"]
      - [Ottoman fleet arrives, "4 September 1538"]
      - [Portuguese garrison, "about 600 men under António da Silveira"]
