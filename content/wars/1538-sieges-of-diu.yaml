  - title: The siege of 1546
    date: April – November 1546
    when: "1546-04-20"
    borders: "1546-04-20"
    countries: [in, pt]
    body:
      - "In 1546 Khadjar Safar, now one of the leading nobles of Gujarat, tried again, with about 10,000 men and Turkish gunners and engineers. He cut off the fort on the landward side from 20 April and bombarded it for months. The captain, João de Mascarenhas, had only a few hundred men at first, and reinforcements had to slip in by sea. Khadjar Safar was killed by a cannonball in June, but his son Rumi Khan carried on the siege. In August a mine blew up one of the bastions, killing many defenders, among them Fernando de Castro, son of the governor of Portuguese India."
      - "The governor, João de Castro, gathered every ship and soldier he could, and arrived off Diu in early November with about 3,000 Portuguese and several hundred Indian troops. On 11 November 1546 the defenders and the relief army sallied out and stormed the Gujarati siege works. Rumi Khan was killed, and the besiegers, who lost some 3,000 dead, were routed."
      - "Castro rebuilt the fortress and celebrated a Roman-style triumph in Goa in 1547. Diu remained a Portuguese possession for more than four centuries, until Indian forces took it, with Goa and Daman, in December 1961."
