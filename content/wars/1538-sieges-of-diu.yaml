id: sieges-of-diu
name: Sieges of Diu
start: "1538-06-26"
end: "1546-11-11"
tier: B
summary: "Two attempts by the Gujarat Sultanate to drive the Portuguese out of the fortress they had built at Diu, the island port at the tip of the Kathiawar peninsula. In 1538 a Gujarati army under Khadjar Safar besieged the fort and an Ottoman fleet of about 70 ships under Hadım Suleiman Pasha, sent from Suez, joined the attack; the small Portuguese garrison under António da Silveira held out until the Ottomans, at odds with their Gujarati allies, sailed away in November. In 1546 Khadjar Safar besieged Diu again for seven months, until the governor of Portuguese India, João de Castro, arrived with a relief fleet and routed the besiegers on 11 November. Diu stayed Portuguese until India annexed it in 1961."
countries: [in, pt, tr]
