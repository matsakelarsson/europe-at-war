notes:
  - Dates are in the Julian calendar, as the sources give them.
  - Most of what is known comes from Portuguese chroniclers such as Gaspar Correia and Diogo do Couto, and from Lopo de Sousa Coutinho, who fought in the first siege; numbers of besiegers in them are probably inflated.
  - Khadjar Safar (Khoja Zufar), the Gujarati commander, was a convert, said to be of Italian or Albanian birth, who had served the Mamluks and Ottomans before entering the service of Gujarat. The Portuguese called him Coge Sofar.
