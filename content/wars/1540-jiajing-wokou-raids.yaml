  - title: Qi Jiguang and the end of the raids
    date: 1561–1567
    when: "1561"
    borders: "1563-05-01"
    countries: [cn]
    body:
      - Qi Jiguang, posted to Zhejiang in 1555, recruited miners and farmers from Yiwu, drilled them in small squads that combined long and short weapons, the “mandarin duck” formation, and built warships. In the spring of 1561, when raiders landed in force around Taizhou, his army beat them in a series of battles at Xinhe, Huajie, Shangfengling and elsewhere; Chinese accounts speak of nine victories in nine battles. After this the raids on Zhejiang died down.
      - The bands moved to Fujian. In July 1562 Qi marched south with 6,000 men and in two months destroyed their camps at Hengyu, Niutian and Lindun. When he returned to Zhejiang the raiders took the prefectural city of Xinghua (today Putian) in December 1562 after a month’s siege. In the spring of 1563 Qi, Yu Dayou and Liu Xian, under the new grand coordinator of Fujian, Tan Lun, defeated them at Pinghai Wei and retook Xinghua. In 1565 Qi and Yu Dayou destroyed the band of Wu Ping on Nan’ao island, and the last raiders in Guangdong were defeated by 1566.
      - The Jiajing Emperor died in January 1567. In the same year the court of his successor, the Longqing Emperor, allowed licensed merchants to sail from Yuegang (Moon Harbour) near Zhangzhou, renamed Haicheng, and trade overseas anywhere but Japan; weapons and metals stayed banned. Raiding fell to a low level. Many historians see the raids as the product of the trade ban more than of a foreign invasion.
    facts:
      - [Taizhou victories, "spring 1561"]
      - [Xinghua taken by raiders, "December 1562"]
      - [Pinghai Wei and Xinghua retaken, "spring 1563"]
      - [Sea ban relaxed at Yuegang, "1567"]
