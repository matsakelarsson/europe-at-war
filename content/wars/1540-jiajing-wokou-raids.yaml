  - title: The great raids of the 1550s
    date: 1552–1559
    when: "1555"
    borders: "1555-05-10"
    countries: [cn]
    body:
      - From 1552 raiding fleets, some of them thousands strong, fell on the coast of Zhejiang and southern Jiangsu, the richest part of China. At their peak in 1555 they numbered up to 20,000 men. They built fortified camps on the shore, such as Zhelin south of Shanghai, sacked market towns and marched far inland, while the Ming coastal garrisons, run down by a century of peace, often failed to stop them. Wang Zhi denied leading any raid in person, but the court held him responsible and ordered his capture.
      - The court sent Zhang Jing with troops from Guangxi and elsewhere. On 10 May 1555 he won the greatest Ming victory of the decade at Wangjiangjing near Jiaxing, where Ming reports counted 1,900 heads, but he had been accused of delay by the court’s envoy Zhao Wenhua and was executed in November. Hu Zongxian, supreme commander from 1556, mixed war with negotiation. When Xu Hai’s band besieged Tongxiang from 31 May 1556, Hu persuaded Xu to submit and turn on other leaders, then destroyed his band at the Shen family estate near Pinghu at the end of September; up to 1,600 raiders were killed and Xu Hai was found dead in a stream.
      - Hu also sent envoys to Wang Zhi in Japan with the promise of a pardon and open trade. Wang came to Cengang on Zhoushan in October 1557 to negotiate, but the court would not pardon him; he was imprisoned at Hangzhou and beheaded on 22 January 1560. His followers held out at Cengang against Yu Dayou and Qi Jiguang in 1558 and then moved south to Fujian. By the summer of 1559 the bands in the Yangtze delta had been destroyed.
    facts:
      - [Raiders at their peak, "up to 20,000 men (1555)"]
      - [Battle of Wangjiangjing, "10 May 1555"]
      - [Xu Hai killed, "September 1556"]
      - [Wang Zhi executed, "22 January 1560"]
