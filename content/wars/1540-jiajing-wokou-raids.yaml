id: jiajing-wokou-raids
name: Jiajing wokou raids
start: "1540"
end: "1567"
tier: B
summary: "Raids on the coasts of Zhejiang, Jiangsu, Fujian and Guangdong in the reign of the Jiajing Emperor, at their height in the 1550s. The Ming had banned private sea trade since 1371 (the haijin), but Japanese silver and the demand for Chinese silk and porcelain made smuggling very profitable, and from about 1540 merchants of Fujian and Zhejiang ran an illegal trading port at Shuangyu off Ningbo with Japanese and Portuguese partners. When officials enforced the ban, destroying Shuangyu in 1548, the trade turned into raiding. The Ming called the raiders wokou, “Japanese pirates”, but most of them were Chinese: Chinese records put the Japanese at about three in ten. Fleets of up to 20,000 men plundered towns far inland in the 1550s. The supreme commander Hu Zongxian destroyed the band of Xu Hai in 1556 and lured the merchant chief Wang Zhi back from Japan, to be executed in 1560; the armies that Qi Jiguang and Yu Dayou trained drove the last large bands out of Zhejiang in 1561 and Fujian in 1563–1565. The raids ended for good after the court in 1567 allowed licensed merchants to trade overseas from Yuegang, except with Japan."
countries: [cn, jp]
sides:
  - id: mg
    name: Ming China
    polities: [ming]
    ink: red
    moves: Ming moves
    success: Ming success
  - id: wk
    name: Wokou (smugglers and raiders)
    polities: [wokou]
    ink: navy
    moves: Wokou moves
    success: Wokou success
notes:
  - "Wokou (in Japanese wakō, in Korean waegu) means “Japanese pirates”. The raiders of the 14th century were mostly Japanese; those of the 16th century were mostly Chinese merchants and sailors, with Japanese, Portuguese and others among them. Zhu Wan, the official who destroyed Shuangyu, wrote that “doing away with foreign pirates is easy, but doing away with Chinese pirates is difficult”."
  - "Dates are converted from the Chinese lunar calendar as the sources give them, in the Julian calendar. Numbers of raiders and of heads taken come from Ming reports and are uncertain."
