steps:
  - title: Smugglers and the sea ban
    date: 1540–1550
    when: "1548"
    borders: "1548-06-01"
    countries: [cn, jp]
    body:
      - Since 1371 the Ming had forbidden private sea trade, allowing foreign trade only with tribute missions. After the Ningbo incident of 1523, when the rival Japanese embassies of the Ōuchi and the Hosokawa fought each other in the streets of Ningbo, the court restricted Japanese trade still further. Yet Japan had silver, newly mined in quantity, and wanted Chinese silk, porcelain and copper coins, and the profits of smuggling were great. From about 1540 merchants from Fujian and Huizhou, among them the Xu brothers and, from 1544, Wang Zhi, made Shuangyu, an anchorage on Liuheng island off Ningbo, into a busy illegal port where Chinese, Japanese and Portuguese traders met, with the protection of coastal gentry families who invested in the trade.
      - In 1547 the court made Zhu Wan grand coordinator of Zhejiang and Fujian with orders to enforce the ban. His fleet sailed from Wenzhou in April 1548 and in June attacked Shuangyu at night; estimates of the smugglers killed range from 55 to a few hundred, and the harbour was blocked with stones. In March 1549 he had 96 captured smugglers executed after a fight at Zoumaxi in southern Fujian. The gentry who had lost by his campaign had him impeached, and he poisoned himself in January 1550.
      - Wang Zhi gathered the remnants of the Shuangyu trade, moved his base to the Gotō Islands and Hirado in Japan under the protection of local lords, and styled himself King of Hui. In 1551 the court rejected his request to make the trade legal. Shut out of lawful trade, the smuggling fleets turned more and more to raiding.
    facts:
      - [Sea ban (haijin), "from 1371"]
      - [Ningbo incident, "1523"]
      - [Shuangyu destroyed, "June 1548"]
      - [Zhu Wan’s suicide, "January 1550"]
