steps:
  - title: The rising
    date: "1540–1541"
    when: "1540"
    borders: "1540-06-01"
    countries: [mx]
    body:
      - The Caxcanes lived in the valleys of northern Jalisco and southern Zacatecas, the northernmost of the farming, town-dwelling peoples of western Mexico; beyond them lived the Zacatecos and other mostly nomadic peoples whom the Spaniards called Chichimecs. Since Nuño de Guzmán’s conquest of 1529–1531 the Spaniards of New Galicia had divided them among encomenderos and raided their lands for slaves.
      - Early in 1540 Francisco Vázquez de Coronado led more than 1,600 Spaniards and Indigenous allies north from New Galicia in search of the Seven Cities of Cíbola, leaving the province short of soldiers. In the middle of the year the Spaniards arrested eighteen Caxcan leaders and hanged nine of them. Later in the year Caxcanes killed the encomendero Juan de Arce, the Spaniards heard of dances they called devilish, and after two priests were killed many people left the encomiendas for fortified hills in the mountains, above all Mixtón.
      - The acting governor, Cristóbal de Oñate, marched against them with Spanish and Indigenous troops. The Caxcanes killed a delegation of one priest and ten soldiers sent to them, and beat back Oñate’s assault on the summit of Mixtón, and Oñate asked Mexico City for help. The most prominent of the Caxcan leaders was Francisco Tenamaztle, the baptised lord of Nochistlán.
    facts:
      - [Coronado’s expedition leaves, "early 1540"]
      - [Rising begins, "mid-1540"]
