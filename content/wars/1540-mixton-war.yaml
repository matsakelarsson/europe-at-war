id: mixton-war
name: Mixtón War
start: "1540"
end: "1542"
tier: B
summary: "A rising of the Caxcanes of New Galicia, in today’s Jalisco and southern Zacatecas, and their Zacateco and other allies against Spanish rule, named after the fortified hill of Mixtón where many of them made their stand. Ten years after Nuño de Guzmán’s conquest of the west, slave raids and forced labour drove the Caxcanes to revolt in 1540. They beat off the first Spanish attacks, and Pedro de Alvarado, conqueror of Guatemala, died of injuries received in a failed assault in June 1541. Viceroy Antonio de Mendoza then led 450 Spaniards and tens of thousands of Indigenous warriors from central Mexico against the strongholds, taking Nochistlán in November 1541 and Mixtón early in 1542. Thousands of captives were executed or enslaved; the Caxcan leader Francisco Tenamaztle held out in the mountains until 1550 or 1551."
countries: [mx]
sides:
  - id: cx
    name: Caxcanes, Zacatecos and their allies (Francisco Tenamaztle, Don Diego the Zacateco)
    polities: [caxcanes, chichimecs]
    ink: brown
    moves: Caxcan moves
    success: Caxcan success
  - id: ns
    name: New Spain and New Galicia (Cristóbal de Oñate, Pedro de Alvarado, Viceroy Antonio de Mendoza), with Indigenous allies from central Mexico
    polities: [new-spain]
    ink: gold
    moves: Spanish moves
    success: Spanish success
notes:
  - "Almost all the sources are Spanish: the reports of the viceroy and his captains, the inquiry into Mendoza’s conduct, and the chronicles of the friars. The Caxcan side survives mainly in Tenamaztle’s petition to the Council of the Indies in 1555, written with the help of Bartolomé de las Casas. The sources disagree on where Alvarado was defeated, at the fortified hill of Nochistlán or at Mixtón, and date the fall of Mixtón to December 1541 or early 1542."
  - "Guadalajara, founded at Nochistlán in 1532, stood at Tlacotán during the war and was moved to its present site in the valley of Atemajac in February 1542. The Caxcanes are sometimes counted among the Chichimecs, but unlike most of them they were farmers living in towns."
