  - title: Mendoza’s campaign
    date: "October 1541 – early 1542"
    when: "1541-11-09"
    borders: "1541-11-09"
    countries: [mx]
    body:
      - Mendoza now led the campaign himself, with 450 Spaniards and 30,000 to 60,000 Nahua, Tlaxcalan and other Indigenous warriors from central Mexico, and took the Caxcan strongholds one by one in a war without quarter. On 9 November 1541 he took Nochistlán and captured Tenamaztle, who later escaped. Mixtón fell early in 1542, and the rising was over.
      - Thousands of captives were led off in chains to the mines, and many of the survivors, mostly women and children, were taken from their homeland to work on Spanish farms. On the viceroy’s orders many of those captured at Mixtón were executed, some blown apart by cannon, some torn apart by dogs and others stabbed, and reports of the killings led the Council of the Indies to open a secret inquiry into Mendoza’s conduct. In February 1542 Guadalajara was moved to the valley of Atemajac, where it stands today.
      - Tenamaztle held out in the mountains until 1550 or 1551, when he gave himself up to the bishop of New Galicia. He was sent to Spain and in 1555, with the help of Bartolomé de las Casas, told the Council of the Indies that the Caxcanes had not rebelled but had fled the cruelty of men such as Guzmán and Oñate; nothing is known of his fate after 1556. The Caxcanes later served as auxiliaries of the Spaniards in their advance north, which led to the silver of Zacatecas and the Chichimeca War.
    facts:
      - [Mendoza’s army, "450 Spaniards and 30,000–60,000 Indigenous allies"]
      - [Nochistlán taken, "9 November 1541"]
      - [Mixtón falls, "early 1542"]
    markers:
