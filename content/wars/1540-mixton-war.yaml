        lonlat: [-103.240, 20.864]
        lp: b
      - kind: event
        side: ns
        name: Compostela
        date: "early 1540"
        text: The capital of New Galicia, from which Coronado’s expedition set out north, taking many of the province’s soldiers.
        lonlat: [-104.901, 21.237]
        lp: b
    arrows:
      - side: ns
        label: Oñate
        via: [[-103.24, 20.88], [-103.20, 21.15], [-103.10, 21.40], [-103.06, 21.47]]
  - title: Alvarado and Guadalajara
    date: "June–September 1541"
    when: "1541-06-24"
    borders: "1541-06-24"
    countries: [mx]
    body:
      - Viceroy Antonio de Mendoza called on Pedro de Alvarado, the conqueror of Guatemala, who was preparing a fleet on the Pacific coast. Alvarado would not wait for reinforcements and attacked in June 1541 with 400 Spaniards and Indigenous allies, against a Caxcan and Zacateco army that the Spaniards put at 15,000 under Tenamaztle and Don Diego the Zacateco. The first assault was beaten back with ten Spaniards and many of their allies killed, and later attacks also failed. On 24 June a horse fell on Alvarado, and he died of his injuries on 4 July 1541.
      - Encouraged by the victory, the Caxcanes and their allies attacked Guadalajara in September 1541 but were driven off, and withdrew to Nochistlán and their other strongholds. The Spanish authorities feared that the rising would spread across New Spain.
    facts:
      - [Alvarado crushed by a horse, "24 June 1541"]
      - [Death of Alvarado, "4 July 1541"]
      - [Attack on Guadalajara, "September 1541"]
    markers:
      - kind: battle
        side: cx
        name: Nochistlán
        date: "June 1541"
        text: Alvarado’s assaults on the Caxcan stronghold failed; the sources place them at the fortified hill of Nochistlán or at Mixtón. A horse fell on Alvarado during the fighting, and he died on 4 July.
        lonlat: [-102.846, 21.363]
        lp: r
      - kind: held
        side: cx
        name: Mixtón
        date: "1541"
        text: The main Caxcan stronghold.
        lonlat: [-103.050, 21.490]
        lp: l
      - kind: battle
        side: ns
        name: Guadalajara (Tlacotán)
        date: "September 1541"
        text: The Caxcanes and their allies attacked the town and were driven off.
        lonlat: [-103.240, 20.864]
        lp: b
    arrows:
      - side: ns
        label: Alvarado
        phase: 1
        via: [[-103.24, 20.88], [-103.05, 21.10], [-102.90, 21.33]]
