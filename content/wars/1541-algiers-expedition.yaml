id: algiers-expedition
name: Algiers Expedition
start: "1541-10-19"
end: "1541-11"
tier: C
summary: Emperor Charles V’s attempt to take Algiers, the corsair base ruled for the Ottomans by Hasan Agha, Hayreddin Barbarossa’s deputy. Charles sailed late in the year, against the advice of his admiral Andrea Doria, with a fleet of over 500 sails gathered at Majorca and some 24,000 German, Spanish and Italian soldiers, joined by Knights of Malta; Hernán Cortés, the conqueror of Mexico, came as a volunteer. The army landed east of the city on 23 October, but on the night of 24–25 October a violent storm drenched the troops’ powder, wrecked many ships on the shore and allowed the defenders to make a fierce sortie, held off at the Bab Azoun gate largely by the knights. Doria gathered what was left of the fleet at Cape Matifou, and the army re-embarked and sailed to Spanish Bougie, from where Charles left for Spain in late November. About 150 ships were lost, with many soldiers and sailors, and so many were taken prisoner that slaves were said to be sold in Algiers for almost nothing. The defeat left the corsairs of Algiers secure for the rest of the century.
