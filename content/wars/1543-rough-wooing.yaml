id: rough-wooing
name: Rough Wooing
start: "1543-12"
end: "1551"
tier: B
summary: The war in which Henry VIII and then the Duke of Somerset tried to force Scotland to marry its infant queen, Mary, to the English heir, Edward, and break Scotland’s alliance with France. English armies burned Edinburgh in 1544 and won at Pinkie in 1547, but the Scots called in the French, sent Mary to France to marry the Dauphin, and wore down the English garrisons until England withdrew in 1550.
countries: [gb, fr]
sides:
  - id: en
    name: England
    polities: [england]
    ink: red
    moves: English moves
    success: English success
  - id: sco
    name: Scotland
    polities: [scotland]
    ink: navy
    moves: Scottish moves
    success: Scottish success
  - id: fr
    name: France
    polities: [france]
    ink: purple
    moves: French moves
    success: French success
notes:
  - Also called the Eight Years’ War. The name “Rough Wooing” is usually traced to a remark attributed to the Earl of Huntly, who is said to have disliked not the marriage but the manner of the wooing.
  - Dates are Julian (Old Style), as used in both countries at the time. Some Scots, especially Protestants, sided with England, and some English borderers changed sides as raiding offered.
