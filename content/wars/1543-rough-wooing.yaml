steps:
  - title: Greenwich, Edinburgh and Ancrum Moor
    date: 1542–1547
    when: "1543-07-01"
    borders: "1546-05-29"
    countries: [gb]
    body:
      - James V of Scotland died in December 1542, weeks after his army was routed by an English force at Solway Moss, leaving a daughter a few days old, Mary, as queen. Henry VIII wanted her as a bride for his son Edward, and in July 1543 the Treaty of Greenwich promised the marriage. But the party around Cardinal David Beaton, which favoured France and the old Church, gained the upper hand, and in December the Scottish Parliament rejected the treaty and renewed the alliance with France. Henry answered with force. In May 1544 an English army under the Earl of Hertford landed at Leith, sacked the port and burned Edinburgh.
      - Raids across the border went on through the year, while Henry himself took Boulogne. On 27 February 1545 a Scottish army under the Earl of Angus routed an English raiding force at Ancrum Moor, and its commander, Sir Ralph Eure, was killed. That September Hertford came back and laid waste to the Borders, burning abbeys, towns and villages. In May 1546 Protestant conspirators murdered Cardinal Beaton in St Andrews Castle and held it, hoping for English help, until a French fleet forced its surrender in July 1547. Among the prisoners sent to the French galleys was the preacher John Knox.
    facts:
      - [Treaty of Greenwich, "1 July 1543"]
      - [Burning of Edinburgh, "7 May 1544"]
      - [Battle of Ancrum Moor, "27 February 1545, Scottish victory"]
    markers:
      - kind: battle
        side: en
        name: Battle of Solway Moss
        date: 24 November 1542
        text: A large Scottish army invading Cumberland was routed by a much smaller English force between the Esk and the Sark. James V died at Falkland three weeks later.
        lonlat: [-3.026, 55.011]
      - kind: taken
        side: en
        name: Edinburgh
        date: 7 May 1544
        text: Hertford’s army sacked Leith and burned the city over several days, but could not take Edinburgh Castle, whose guns harried the English.
        lonlat: [-3.19, 55.953]
      - kind: battle
        side: sco
        name: Battle of Ancrum Moor
        date: 27 February 1545
        text: Angus caught the English raiders, among them many Scottish borderers who changed sides during the battle, as they returned from sacking Melrose.
        lonlat: [-2.608, 55.537]
      - kind: event
        side: en
        name: Kelso
        date: September 1545
        text: Hertford’s soldiers stormed the abbey, held by a small garrison, and burned it, as they did Jedburgh and Dryburgh and scores of villages.
        lonlat: [-2.433, 55.597]
        lp: t
      - kind: event
        name: St Andrews Castle
        date: May 1546 – July 1547
        text: Beaton’s murderers held the castle for more than a year. French galleys bombarded it into surrender, and the prisoners were taken to France.
        lonlat: [-2.79, 56.342]
