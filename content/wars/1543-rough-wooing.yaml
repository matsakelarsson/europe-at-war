        via: [[-2.2, 55.65], [-2.43, 55.6], [-2.55, 55.48]]
  - title: Pinkie and the French
    date: 1547–1551
    when: "1547-09-10"
    borders: "1550-03-24"
    countries: [gb, fr]
    body:
      - Henry VIII died in January 1547, and Hertford, now Duke of Somerset and Protector for the nine-year-old Edward VI, invaded Scotland that September with about 16,000 men and a fleet. On 10 September he met the larger Scottish army of the regent, the Earl of Arran, at Pinkie near Musselburgh. The Scots crossed the Esk to attack, came under fire from the English ships and guns, and broke under cavalry charges; thousands were killed in the pursuit, and the Scots remembered the day as Black Saturday. Somerset did not march on Stirling, where Mary was kept, but planted garrisons, at Haddington, Broughty Castle on the Tay, Lauder and elsewhere, to hold the Lowlands down.
      - The Scots turned to France. A French army landed at Leith in June 1548, and on 7 July, by the Treaty of Haddington, signed in the camp besieging the English-held town, the Scots agreed that Mary would marry the Dauphin Francis. She sailed from Dumbarton in August and grew up at the French court. Short of supplies and wasted by disease, the English abandoned Haddington in September 1549. Henry II of France attacked Boulogne, and by the Treaty of Boulogne in March 1550 England returned it to France and withdrew from Scotland; the Treaty of Norham restored the border in 1551. The war had driven Scotland towards France, not England.
    facts:
      - [Battle of Pinkie, "10 September 1547, English victory"]
      - [Treaty of Haddington, "7 July 1548"]
      - [Treaty of Boulogne, "24 March 1550"]
    markers:
      - kind: battle
        side: en
        name: Battle of Pinkie
        date: 10 September 1547
        text: The last pitched battle between the Scottish and English kingdoms before the union of the crowns. An English eyewitness, William Patten, wrote a detailed account of it.
        lonlat: [-3.021, 55.93]
      - kind: event
        side: fr
        name: Leith
        date: June 1548
        text: Several thousand French and German soldiers in French pay landed here to help the Scots against the English garrisons.
        lonlat: [-3.17, 55.98]
        lp: l
      - kind: held
        side: en
        name: Haddington
        date: September 1547 – September 1549
        text: The English fortified the town with modern artillery bastions and beat off a French and Scottish assault in July 1548, but disease and raids wore the garrison down.
        lonlat: [-2.781, 55.956]
      - kind: held
        side: en
        name: Broughty Castle
        date: 1547–1550
        text: An English garrison on the Tay estuary near Dundee, supplied by sea, held out until February 1550.
        lonlat: [-2.87, 56.463]
      - kind: held
        side: en
        name: Lauder
        date: 1548–1550
        text: One of the forts with which the English tried to control the Borders and the roads to Edinburgh.
        lonlat: [-2.749, 55.719]
      - kind: event
        side: sco
        name: Dumbarton
        date: 7 August 1548
        text: The five-year-old queen sailed from the castle on the Clyde, avoiding English ships, and landed in Brittany a week later.
        lonlat: [-4.563, 55.936]
