id: schmalkaldic-war
name: Schmalkaldic War
start: "1546-07"
end: "1547-05"
tier: B
summary: A war in which the Emperor Charles V, allied with the Lutheran Duke Maurice of Saxony, defeated the Schmalkaldic League of Protestant princes and cities. After the Elector John Frederick of Saxony was captured at Mühlberg in April 1547, the Saxon electorate passed from his Ernestine line of the House of Wettin to Maurice’s Albertine line.
countries: [de, at, cz, es, it]
sides:
  - id: league
    name: Schmalkaldic League
    polities: [thuringia, hesse, wurttemberg]
    ink: orange
    moves: Moves of the League
    success: Success for the League
  - id: emp
    name: Charles V and Maurice of Saxony
    polities: [hre, habsburg, saxony, spain]
    ink: purple
    moves: Imperial and allied moves
    success: Imperial and allied success
notes:
  - The League’s leaders were John Frederick, Elector of Saxony, of the Ernestine branch of the Wettins, which ruled Wittenberg and most of Thuringia, and Landgrave Philip of Hesse. Maurice, of the Albertine branch, ruled the duchy of Saxony around Dresden, Meissen and Leipzig.
  - Pope Paul III sent troops and money for the campaign of 1546 but withdrew his troops early in 1547.
