steps:
  - title: The Danube campaign
    date: July – December 1546
    when: "1546-07"
    borders: "1546-11"
    countries: [de, at, es, it]
    body:
      - The Schmalkaldic League, the alliance of Lutheran princes and cities formed in 1531 under Elector John Frederick of Saxony and Landgrave Philip of Hesse, had grown strong while Charles V was busy with France and the Ottomans. Once he had made peace with France at Crépy in 1544, Charles prepared to break it, with papal money and troops and a secret pact with the Lutheran Duke Maurice of Saxony, who was promised his cousin John Frederick’s electoral title. In July 1546 League troops seized Füssen and the passes towards Tyrol, and on 20 July Charles outlawed John Frederick and Philip.
      - The League’s army, at first larger than the Emperor’s, was led by a divided council and missed its chance. Papal troops joined Charles at Landshut in mid-August. At the end of the month the League bombarded his entrenched camp at Ingolstadt but did not storm it, and in September the Count of Buren brought him reinforcements from the Netherlands. Through the autumn the armies manoeuvred along the Danube without a battle. In late October Maurice and King Ferdinand invaded Electoral Saxony, John Frederick hurried home, and the League’s southern army broke up. That winter Ulm, Augsburg, Württemberg and the Elector Palatine submitted to Charles one by one and paid heavy fines.
    facts:
      - [Imperial ban, "20 July 1546, on John Frederick and Philip of Hesse"]
      - [Emperor’s army, "About 52,000 Germans, Italians, Spaniards and Netherlanders"]
      - [League’s army, "About 50,000 in 1546"]
    markers:
      - kind: event
        side: league
        name: Schmalkalden
        date: "1531"
        text: The Thuringian town, then shared by Hesse and the counts of Henneberg, where the Protestant princes and cities founded their defensive league in February 1531.
        lonlat: [10.446, 50.721]
      - kind: taken
        side: league
        name: Füssen
        date: July 1546
        text: Troops of the Protestant imperial cities under Sebastian Schertlin opened the war by seizing the bishop of Augsburg’s town and the Ehrenberg pass beyond it, to bar the way from Italy. The League’s princes would not let them push on into Tyrol.
        lonlat: [10.702, 47.571]
      - kind: event
        side: emp
        name: Regensburg
        date: 20 July 1546
        text: Charles, who had gathered his first troops here during the imperial diet, put the League’s leaders under the imperial ban.
        lonlat: [12.102, 49.013]
      - kind: held
        side: emp
        name: Ingolstadt
        date: Late August – September 1546
        text: The League’s guns pounded the Emperor’s fortified camp outside the Bavarian fortress for days, but its leaders could not agree to attack, and Charles held on until reinforcements arrived.
        lonlat: [11.426, 48.766]
        lp: l
      - kind: taken
        side: emp
        name: Ulm
        date: December 1546
        text: The leading Protestant city of Swabia made its submission and paid a large fine, followed by Augsburg in January 1547.
        lonlat: [9.992, 48.398]
        lp: l
