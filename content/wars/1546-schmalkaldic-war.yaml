  - title: Mühlberg and the Saxon electorate
    date: January – June 1547
    when: "1547-04-24"
    borders: "1547-05-19"
    countries: [de, cz, es]
    body:
      - John Frederick won back his lands over the winter and overran most of Maurice’s duchy, though Leipzig held out, and on 2 March he captured Margrave Albert Alcibiades of Brandenburg-Kulmbach, fighting for the Emperor, at Rochlitz. In April Charles marched north from Eger in Bohemia with the Duke of Alba’s Spanish veterans, joined by Ferdinand and Maurice. On 24 April, at Mühlberg on the Elbe, his cavalry crossed by a ford while Spanish soldiers swam out to seize boats. The Elector’s retreating army was overtaken and routed on the Lochau heath, and John Frederick, wounded in the face, was taken prisoner.
      - Sentenced to death by a court martial, John Frederick signed the Capitulation of Wittenberg on 19 May. He gave up the electoral title and the lands around Wittenberg to Maurice, keeping only Thuringian territories for his sons, and stayed a prisoner until 1552. Philip of Hesse gave himself up at Halle in June and was imprisoned too. The League was finished, though Bremen and Magdeburg held out and a League army beat imperial troops at Drakenburg on the Weser. At the diet of Augsburg in 1548 Charles imposed the Augsburg Interim, a stopgap religious settlement that pleased neither side.
    facts:
      - [Battle of Mühlberg, "24 April 1547, imperial victory"]
      - [Capitulation of Wittenberg, "19 May 1547"]
      - [New elector, "Maurice of Saxony, proclaimed 4 June 1547"]
    markers:
      - kind: held
        side: emp
        name: Leipzig
        date: January 1547
        text: Maurice’s main city withstood a siege by John Frederick’s army.
        lonlat: [12.373, 51.34]
        lp: l
      - kind: battle
        side: league
        name: Rochlitz
        date: 2 March 1547
        text: John Frederick surprised and captured the Margrave Albert Alcibiades, who had come to help Maurice.
        lonlat: [12.804, 51.046]
      - kind: event
        side: emp
        name: Eger
        date: April 1547
        text: Charles joined his brother Ferdinand here, on the border of Bohemia, before marching into Saxony. The town is today’s Cheb in the Czech Republic.
        lonlat: [12.374, 50.08]
      - kind: battle
        side: emp
        name: Battle of Mühlberg
        date: 24 April 1547
        text: Alba’s cavalry and Hungarian hussars caught the Saxon army on the march and destroyed it. Titian later painted Charles as the victor of Mühlberg in armour on horseback.
        lonlat: [13.217, 51.433]
      - kind: treaty
        side: emp
        name: Capitulation of Wittenberg
        date: 19 May 1547
        text: To save his life John Frederick gave up the electorate and the lands around Wittenberg, and his family moved its seat to Weimar.
        lonlat: [12.648, 51.867]
      - kind: event
        side: emp
        name: Halle
        date: June 1547
        text: Philip of Hesse came to submit to the Emperor here and was arrested, which outraged Maurice and Joachim II of Brandenburg, who had guaranteed his freedom.
        lonlat: [11.97, 51.483]
        lp: l
      - kind: battle
        side: league
        name: Drakenburg
        date: 23 May 1547
        text: A Protestant army beat Duke Eric II of Brunswick-Calenberg, fresh from a failed siege of Bremen, and imperial troops left northern Germany.
        lonlat: [9.213, 52.677]
