  - title: The siege, the retreat and the truce
    date: January – February 1549
    when: "1549-01"
    borders: "1549-02"
    countries: [mm, th]
    body:
      - "Ayutthaya stood on an island ringed by the Chao Phraya, Lopburi and Pa Sak rivers, with heavy cannon on its walls and gunboats on its canals; fifty Portuguese under Galeote Pereira held the weakest stretch of wall. The Burmese, with only light guns, could encircle the city but not breach it, and the floods would come by July. After about a month, with supplies short, sickness in the camp, news of a Mon rising at home, and Maha Thammaracha of Phitsanulok marching south with a relief army, Tabinshwehti ordered a retreat north towards the Mae Lamao pass. A Cambodian raid on Prachinburi, in the east, added to Siam’s troubles."
      - "On the way the Burmese tried to plunder Kamphaeng Phet, but its governor, with Portuguese help, drove them off. Pursuing Siamese forces were drawn into an ambush, and Prince Ramesuan, the heir, and Maha Thammaracha were captured. Maha Chakkraphat sued for peace and, under a truce in February 1549, the princes were returned in exchange for two royal war elephants. The Burmese army was back at Pegu on 1 March 1549. Neither side gained territory; Tabinshwehti was assassinated on 30 April 1550, and it was his successor Bayinnaung who returned to Siam in 1563."
    facts:
      - ["Siege of Ayutthaya", "about one month, early 1549"]
      - ["Truce", "February 1549; Ramesuan and Thammaracha exchanged for two war elephants"]
      - ["Result", "Inconclusive; Tavoy stayed Burmese"]
