steps:
  - title: Tavoy, and Tabinshwehti’s march on Ayutthaya
    date: January 1547 – January 1549
    when: "1548-10"
    borders: "1548-12"
    countries: [mm, th]
    body:
      - "Tabinshwehti of Toungoo had taken Pegu in 1539 and Martaban, with the Mon coast down to Tavoy, in 1541. Ayutthaya claimed the Tenasserim coast too, and frontiers there were loosely drawn. By January 1547, according to the Burmese chronicles, a Siamese force of about 6,000 men had occupied Tavoy; the Burmese commander Saw Lagun Ein retook it late in the year with about 12,000 men, 8,000 by land and 4,000 by sea. Ayutthaya itself was in turmoil. King Chairacha had died in 1546; his young son Yot Fa was put aside by the regent, Lady Si Sudachan, and her lover, who reigned as Worawongsathirat until nobles ambushed and killed them both. Chairacha’s brother Thianracha left the monkhood and became king as Maha Chakkraphat."
      - "Tabinshwehti saw the moment to strike. On 14 October 1548 three armies, under Bayinnaung, the king himself and Thado Dhamma Yaza, viceroy of Prome, left Martaban, crossed the Three Pagodas Pass and came down the Khwae Noi. They found Kanchanaburi deserted, took Suphanburi and crossed the Chao Phraya to camp north of Ayutthaya. The Burmese chronicles give the army as 12,000 men, 1,680 horses and 48 elephants; about 400 Portuguese under Diogo Soares served with it, while Portuguese mercenaries also fought for Siam."
      - "Maha Chakkraphat came out to test the invaders. In the Siamese account, he met the viceroy of Prome in single combat on elephants; when the king’s elephant bolted, Queen Suriyothai, dressed as a man, drove her own elephant between them and was cut down by the viceroy, with one of her daughters. Her sons Ramesuan and Mahin drove the viceroy off and carried the bodies back to the city. The Burmese chronicles say instead that the Siamese pressed the viceroy’s decoy force, were encircled by Bayinnaung’s and Tabinshwehti’s armies and were driven back into the city."
    facts:
      - ["Tavoy", "occupied by Siam by January 1547, retaken by Burma late 1547"]
      - ["Burmese army", "about 12,000 men, 1,680 horses, 48 elephants (Burmese chronicles)"]
      - ["Invasion begins", "14 October 1548, from Martaban"]
