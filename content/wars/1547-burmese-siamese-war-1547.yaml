notes:
  - "The war is known mainly from Burmese and Siamese chronicles written down long afterwards, which differ on numbers and details; the Siamese chronicles give the Burmese army as 300,000 men. The army sizes here are those of the Burmese chronicles as given by modern historians, and the dates their Gregorian equivalents."
  - "Queen Suriyothai’s death comes from the Siamese tradition and is not mentioned in the Burmese chronicles, which describe a Burmese ambush that broke the Siamese army; the duel on elephants is told in the Siamese chronicles and later works. In Thailand the war is called the war in which Queen Suriyothai was lost."
  - "Names: Tavoy is today’s Dawei, Martaban Mottama and Pegu Bago. Thai names are in the Royal Thai General System (Maha Chakkraphat, Ramesuan, Kamphaeng Phet)."
