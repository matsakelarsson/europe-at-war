id: burmese-siamese-war-1547
name: Burmese–Siamese War (1547–1549)
start: "1547-10"
end: "1549-02"
tier: B
summary: "The first war between Toungoo Burma and the Siamese kingdom of Ayutthaya, and the first of the Burmese–Siamese wars that went on into the 19th century. According to the Burmese chronicles a Siamese force occupied Tavoy (Dawei), on the Tenasserim coast, by January 1547; a Burmese army retook it later that year. In October 1548, after a succession crisis in Ayutthaya, King Tabinshwehti of Toungoo invaded Siam with about 12,000 men, among them several hundred Portuguese mercenaries, by the Three Pagodas Pass. In a battle outside Ayutthaya, by Thai tradition, Queen Suriyothai was killed on her war elephant shielding her husband, King Maha Chakkraphat. The Burmese could not take the walled island city and withdrew after a month. On the retreat they failed before Kamphaeng Phet but captured the Siamese heir Ramesuan and Prince Thammaracha, who were released under a truce in February 1549 in exchange for two royal war elephants. Tabinshwehti was murdered in 1550; his successor Bayinnaung invaded again in 1563."
countries: [mm, th]
sides:
