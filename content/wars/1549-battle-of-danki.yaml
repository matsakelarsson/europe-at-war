notes:
  - The story of Danki comes from the traditions of the damels of Cayor, written down by Senegalese chroniclers in the twentieth century. Its date is uncertain; 1549 is the date most accounts give.
  - "Titles: the buurba was the king of Jolof, the damel the king of Cayor, the teigne the king of Baol and the brak the king of Waalo; lamane was the older title of Cayor’s rulers under Jolof."
