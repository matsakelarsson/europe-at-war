steps:
  - title: The ambush at Danki
    date: "1549"
    when: "1549"
    borders: "1549-06-01"
    countries: [sn]
    body:
      - In the fifteenth century the buurba of Jolof was overlord of the Wolof and Serer kingdoms between the Senegal and the Gambia, among them Waalo on the lower Senegal, Cayor along the coast, Baol, Sine and Saloum, and early in the sixteenth century his empire was said to field 100,000 foot soldiers and 10,000 horsemen. But the Portuguese, trading on the coast from the fifteenth century, dealt with the coastal rulers, who kept most of the new wealth and grew stronger than their overlord. Early in the sixteenth century Koli Tenguella’s Fulbe took Futa Toro, on the middle Senegal, from Jolof’s governors, and Sine and Saloum broke away in the south.
      - Cayor’s tradition tells how the end came. Its lamane, Dece Fu Njogu Fall, fell ill and for several years sent no tribute to the buurba, Leele Fuli Fak. In 1549 his son Amari Ngoone Sobel Fall offered to take it, and raised an army with the help of his mother’s brother, Niokhor Ndiaye, teigne of Baol. He marched east to Lake Danki, on the southern edge of Jolof, left most of his men there and went on with a small party, burying javelins every few kilometres along the road. The buurba received them with insults, and Amari declared in public that Cayor no longer needed such a chief. As the Jolof pursued him, his men seemed to find fresh weapons by magic; at Danki the whole Cayor army fell on the pursuers, killed the buurba and routed his army.
      - Dece Fu Njogu was acclaimed damel, “the breaker”, but was killed when the bulls brought for the feast stampeded, and Amari Ngoone was chosen damel in his place. He gave Cayor a new constitution and a new capital at Mboul, and when his uncle died he was also elected teigne of Baol, the first king of both; he beat off several Jolof invasions in his first years and reigned until 1593. Waalo and Baol, too, left the empire. Jolof survived as an inland kingdom; its buurbas tried several times in the late sixteenth and early seventeenth centuries to retake Cayor, without success, and both Jolof and Waalo came under the largely nominal overlordship of the Denianke kings of Futa Toro.
