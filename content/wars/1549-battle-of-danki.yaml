id: battle-of-danki
name: Battle of Danki and the breakup of the Jolof Empire
start: "1549"
end: "1556"
tier: B
summary: "The war in which Cayor, on the coast of today’s Senegal, threw off the overlordship of the Jolof Empire, which had united the Wolof and Serer kingdoms between the Senegal and the Gambia since the fourteenth century. Jolof had already lost Futa Toro to Koli Tenguella early in the sixteenth century, and the coastal vassals, enriched by the Portuguese trade, had grown stronger than their overlord. When the lamane of Cayor, Dece Fu Njogu Fall, stopped sending tribute, his son Amari Ngoone Sobel Fall, with help from his uncle the teigne of Baol, led an army to the buurba Leele Fuli Fak, lured the Jolof army into an ambush at Lake Danki and killed him. Dece Fu was acclaimed damel, but died during the celebrations, and Amari Ngoone, damel from 1549 to 1593, also became teigne of Baol, the first ruler of both kingdoms, and beat off several Jolof attempts at reconquest. Waalo and Baol left the empire, Sine and Saloum had gone their own way before, and Jolof became an inland kingdom whose buurba kept only prestige. Cayor’s chronicles date Danki to 1549; Britannica dates Cayor’s independence to 1556."
