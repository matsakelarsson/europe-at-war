id: chichimeca-war
name: Chichimeca War
start: "1550"
end: "1590"
tier: B
summary: "Forty years of war between New Spain and the peoples the Spaniards called Chichimecs, the Guachichiles, Zacatecos, Guamares and Pames of the dry plateau north of the old Aztec lands, set off by the silver strike at Zacatecas in 1546 and the roads, mining towns and slave raids that followed. From 1550 Chichimec raiders attacked wagon trains, ranches and towns along the silver road; by 1561 they had killed more than 4,000 Spaniards and allies. Neither a line of presidios nor the “war of fire and blood” declared in 1567 stopped them, and the raids were at their worst in 1575–1585. From 1586 the viceroys bought peace instead, with food, clothing, tools and land, missions and settlements of Tlaxcalan families; in 1590 the roads to Zacatecas were declared safe for the first time in forty years."
countries: [mx]
sides:
  - id: ns
    name: New Spain, with Otomí, Purépecha, Caxcan and Tlaxcalan allies
    polities: [new-spain]
    ink: gold
    moves: Spanish moves
    success: Spanish success
  - id: ch
    name: Chichimeca peoples (Guachichiles, Zacatecos, Guamares and Pames)
    polities: [chichimecs]
    ink: orange
    moves: Chichimec moves
    success: Chichimec success
notes:
  - "Chichimec was a Nahuatl name, taken over by the Spaniards, for the hunting, gathering and partly farming peoples of the north; it covers many peoples who never formed one state. Almost everything known about the war comes from Spanish letters, reports and chronicles, gathered above all by the historian Philip Wayne Powell, and Spanish accounts of Chichimec cruelty were also used to justify their enslavement."
  - "The war is often dated 1550–1600, since the purchase of peace went on for years after 1590 and fighting continued in places; San Luis Potosí was founded after the surrender of the Guachichiles in 1592."
