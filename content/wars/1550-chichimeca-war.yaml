  - title: Fire and blood
    date: "1562–1585"
    when: "1575"
    borders: "1575-06-01"
    countries: [mx]
    body:
      - The Spaniards built presidios to guard the road, the first at San Miguel and San Felipe in 1562 and Nombre de Dios in 1563, about a dozen in all, garrisoned by Spanish and Indigenous soldiers, and settled new towns that grew into Celaya, León and Aguascalientes. In 1567, after offers and threats had both failed, the government declared a “war of fire and blood” that promised the Chichimecs death, enslavement or mutilation.
      - The raids only spread. By 1571 most of the Chichimec nations were raiding towns and roads, in the 1570s the Pames attacked near Querétaro, and from 1575 to 1585 the attacks grew stronger still; in 1581 the viceroy wrote to Philip II that many mines in Zacatecas had closed. The Chichimecs learned to ride and fight on horseback, perhaps the first time the Spaniards in North America met mounted Native warriors. Many presidios held only three Spaniards, and soldiers added to their pay by taking slaves, which fed the war. Otomí, Purépecha and Caxcan allies did much of the fighting for the Spaniards and were rewarded with land and the right to ride horses and carry swords.
      - In 1574 the Dominicans declared the war unjust and caused by Spanish aggression, and more and more churchmen and officials came to blame the enslavement of the Chichimecs for it.
    facts:
