  - title: Peace by purchase
    date: "1585–1592"
    when: "1590"
    borders: "1592-12-01"
    countries: [mx]
    body:
      - The war was emptying the royal treasury. In 1584 the bishop of Guadalajara proposed new towns with priests, soldiers and friendly Indigenous families, and in 1586 the viceroy, Álvaro Manrique de Zúñiga, Marquis of Villamanrique, withdrew many soldiers from the frontier, forbade new campaigns and opened talks with the Chichimec leaders, offering them food, clothing, tools and land. One of the men behind the talks was Captain Miguel Caldera, the son of a Castilian soldier and a Guachichil woman, who had seen the cruelty and failure of the war by force.
      - From 1590 the Spaniards sent large quantities of goods north to be handed out to the Chichimecs, a policy that went on for decades, and in that year the viceroy declared the roads to Zacatecas safe for the first time in forty years. In 1591 the next viceroy, Luis de Velasco, with Caldera’s help, persuaded 400 Tlaxcalan families to found eight settlements among the Chichimecs, among them Colotlán and Mexquitic, in return for land, freedom from tribute, the right to bear arms and two years’ provisions; Franciscan missionaries followed.
      - On 3 November 1592 San Luis Potosí was founded near the new mines of Cerro de San Pedro, at a place where the Franciscan Diego de la Magdalena and Caldera had gathered Guachichil families who had made peace. Most Chichimecs gradually settled in towns and became Christian, and the purchase of peace became the pattern of Spanish policy on the northern frontier for nearly three centuries. The Pame and the Chichimeca Jonaz of Guanajuato still speak their languages today.
    facts:
      - [Peace policy of Villamanrique, "1586"]
      - [Roads to Zacatecas declared safe, "1590"]
      - [Tlaxcalan colonies founded, "1591"]
