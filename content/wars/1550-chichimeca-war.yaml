steps:
  - title: Silver and the road
    date: "1546–1561"
    when: "1553"
    borders: "1553-06-01"
    countries: [mx]
    body:
      - The dry basin north of the old Aztec and Purépecha lands, from Querétaro and Guadalajara to Saltillo and Durango, was home to peoples who lived mainly by hunting and gathering, some of whom also grew maize. The Spaniards counted four main nations among them, the Guachichiles around what became San Luis Potosí, the most numerous and most feared, the Zacatecos, who had fought in the Mixtón War, the Guamares of Guanajuato and the Pames north of Querétaro; together they may have numbered 30,000 to 60,000. Their archers, with short bows and obsidian-tipped arrows, were feared even by men in armour.
      - On 8 September 1546 local people showed the Spaniard Juan de Tolosa silver ore near the hill of La Bufa, where the city of Zacatecas grew up. Thousands of Spaniards rushed north, mining towns such as Sombrerete and Fresnillo followed, soldiers raided for slaves to work the mines, and new roads were built across Chichimec lands from Querétaro and Jalisco to carry goods and silver.
      - Late in 1550 Zacatecos attacked Purépecha supply trains on the road and then Spanish settlements just south of Zacatecas. In 1551 Guachichiles and Guamares killed fifteen Spanish soldiers at San Miguel, which was abandoned, and raids around Tlaltenango killed 120 Spaniards in a few months. In 1553 and 1554 whole wagon trains on the road to Zacatecas were destroyed, with goods worth 32,000 and 40,000 pesos, when a soldier earned 300 pesos a year. By the end of 1561 more than 4,000 Spaniards and their Indigenous allies had been killed, and prices in Zacatecas had doubled or tripled.
    facts:
      - [Silver found at Zacatecas, "8 September 1546"]
      - [First attacks, "late 1550"]
      - [Killed by 1561, "more than 4,000 Spaniards and allies"]
