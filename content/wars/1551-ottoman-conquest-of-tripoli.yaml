id: ottoman-conquest-of-tripoli
name: Ottoman conquest of Tripoli
start: "1551-07"
end: "1551-08-15"
tier: C
summary: "The siege in which an Ottoman fleet took Tripoli from the Knights of St John (the Hospitallers) in August 1551. Spain had captured the city in 1510 and handed it to the Knights, with Malta and Gozo, in 1530. After a Spanish and Hospitaller force drove the corsair captain Turgut Reis (Dragut) out of Mahdia in 1550, Sultan Suleiman sent a fleet of about 145 ships with 10,000–12,000 soldiers under Sinan Pasha, with Turgut. It struck Malta first, landing on 18 July and failing before Mdina, then took the citadel of Gozo on 26 July and carried off some 5,000–7,000 of the island’s people into slavery. On 8 August it landed before Tripoli, joined by Murad Agha and the people of Tajura, who had resisted the Knights for years. The governor, Gaspard de Vallier, held only a few dozen knights and 500–600 soldiers, many of them Calabrian and Sicilian mercenaries who mutinied, and he surrendered on 14 August after six days of bombardment. The French ambassador to the Porte, Gabriel d’Aramon, who had come to dissuade the Ottomans, obtained the release of the knights and some others, who sailed to Malta; about 200 local auxiliaries of the Knights were executed and the rest of the garrison was enslaved. Sinan made Murad Agha governor; Turgut, who had hoped for the post, received it in the 1550s and made Tripoli a base for the corsairs and for the Ottoman fleet. Tripoli stayed Ottoman, directly or under the Karamanli dynasty (1711–1835), until the Italian invasion of 1911."
countries: [ly, mt, tr]
