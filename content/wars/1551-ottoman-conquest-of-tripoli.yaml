notes:
  - Dates are Julian. Sources give different numbers for the garrison (from about 30 to 200 knights) and for the men the French ambassador saved.
  - The Spanish attempt to retake Tripoli ended in the Battle of Djerba (1560), and the Ottoman attack on Malta in the Great Siege of Malta (1565), in which Turgut was killed; both have their own entries.
