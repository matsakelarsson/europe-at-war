notes:
  - Dates are Julian. Hungarian historians often treat these years as the last phase of the wars of 1526–1568 for the Hungarian crown.
  - The defence of Eger is the subject of Géza Gárdonyi’s novel Egri csillagok (1901, in English Eclipse of the Crescent Moon), one of the best-loved books in Hungary.
