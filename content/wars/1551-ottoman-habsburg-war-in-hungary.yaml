  - title: Stalemate and the truce of 1562
    date: 1553–1562
    when: "1553"
    borders: "1562"
    countries: [hu, ro, hr, sk, tr]
    body:
      - Fighting went on along a frontier of castles. The Ottomans took Fülek in 1554 and made it the seat of a sanjak. In 1556, with Castaldo’s unpaid troops gone, the Transylvanian estates called back Isabella and John Sigismund, who ruled again as Ottoman vassals. That summer the governor of Buda besieged Szigetvár; Nikola Zrinski, ban of Croatia, attacked the nearby Ottoman fort of Babócsa, beat the pasha’s army when it came to its rescue, and the siege was given up.
      - Suleiman, busy with Persia and with a struggle between his sons, wanted peace, and Ferdinand, emperor since his brother Charles V had abdicated, could not afford war. His envoy in Constantinople, the Flemish scholar Ogier Ghiselin de Busbecq, spent years negotiating. In 1562, after an Ottoman victory at Szécsény in March, a truce of eight years was agreed. The Ottomans kept their conquests, and Ferdinand went on paying 30,000 florins a year for his part of Hungary.
    facts:
      - [Fülek taken by the Ottomans, 1554]
      - [Szigetvár besieged, "1556, relieved"]
      - [Truce, "1562, for eight years; tribute of 30,000 florins a year"]
    markers:
      - kind: taken
        side: ot
        name: Fülek
        date: 1554
        text: The castle became the seat of an Ottoman sanjak in the hills of Upper Hungary until 1593.
        lonlat: [19.82, 48.27]
      - kind: event
        side: tv
        name: Alba Iulia
        date: 1556
        text: Isabella and John Sigismund returned to rule Transylvania from here as vassals of the sultan.
        lonlat: [23.57, 46.07]
      - kind: held
        side: hb
        name: Szigetvár
        date: summer 1556
        text: The fortress in the marshes held out until its besiegers withdrew.
        lonlat: [17.8, 46.05]
      - kind: battle
        side: hb
        name: Babócsa
        date: July 1556
        text: Nikola Zrinski besieged the Ottoman fort here and beat the army sent from Szigetvár to relieve it.
        lonlat: [17.35, 46.04]
        lp: l
      - kind: battle
        side: ot
        name: Battle of Szécsény
        date: 27 March 1562
        text: The Ottoman sanjak-bey of Fülek defeated the Hungarian forces of Upper Hungary.
        lonlat: [19.52, 48.08]
