id: ottoman-habsburg-war-in-hungary
name: Ottoman–Habsburg War in Hungary (1551–1562)
start: "1551"
end: "1562"
tier: B
summary: The war that followed Ferdinand I’s attempt to take over Transylvania in 1551. The Ottomans answered in 1552 by taking Temesvár, Szolnok and many castles, founding a new province in the Banat, but were held at Eger by István Dobó’s small garrison. Transylvania returned to John Sigismund Zápolya under Ottoman protection in 1556, and after years of border fighting a truce of 1562 confirmed the Ottoman gains.
