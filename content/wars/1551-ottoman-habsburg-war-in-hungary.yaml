steps:
  - title: Temesvár and Eger
    date: 1551–1552
    when: "1551-07"
    borders: "1552-10-18"
    countries: [hu, ro, rs, sk, tr]
    body:
      - In 1551 the monk George Martinuzzi, who governed Transylvania for the young John Sigismund, persuaded Queen Isabella to hand the eastern kingdom and the Holy Crown to Ferdinand I, and imperial troops under Giovanni Battista Castaldo moved in. Martinuzzi, now a cardinal, went on negotiating with the Ottomans, and on 17 December 1551 Castaldo’s men murdered him at Alvinc, with Ferdinand’s consent. In 1552 two Ottoman armies invaded. Hadım Ali Pasha, governor of Buda, took Veszprém and Drégely, whose captain György Szondi died rather than surrender, while Kara Ahmed Pasha took Temesvár on 27 July and killed most of its garrison as it marched out, its commander István Losonczy among them.
      - Lippa and Szolnok fell too, and the two armies, perhaps 35,000–40,000 strong, joined to besiege Eger in September. Its captain, István Dobó, had about 2,000 defenders, soldiers, peasants and townspeople, women among them. For five weeks they repaired the walls by night and threw back five great assaults, and on 18 October the Ottomans withdrew. The defence became a Hungarian legend. Still, the campaign had won the Ottomans the Banat, which became the province of Temesvár, and dozens of castles in northern Hungary.
    facts:
      - [Temesvár surrenders, 27 July 1552]
      - [Siege of Eger, "September – 18 October 1552, Hungarian victory"]
      - [Defenders of Eger, "about 2,000 under István Dobó"]
    markers:
      - kind: event
        side: hb
