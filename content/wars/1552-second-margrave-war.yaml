id: second-margrave-war
name: Princes’ Revolt and Second Margrave War
start: "1552"
end: "1554"
tier: C
summary: In the spring of 1552 Elector Maurice of Saxony, who had helped Charles V win the Schmalkaldic War, turned against him with other Protestant princes and an alliance with Henry II of France, who occupied the bishoprics of Metz, Toul and Verdun. The rebels nearly captured the Emperor at Innsbruck, and the Peace of Passau in August 1552 freed the imprisoned John Frederick of Saxony and Philip of Hesse and prepared the way for the religious Peace of Augsburg in 1555; Charles’s siege of Metz that winter failed. One of the rebels, Margrave Albert Alcibiades of Brandenburg-Kulmbach, refused the peace and went on plundering Franconia and the Rhineland, extorting land and money from Nuremberg and the bishops of Bamberg and Würzburg. Maurice and Henry of Brunswick-Wolfenbüttel beat him at Sievershausen on 9 July 1553, a battle in which Maurice was killed, and by June 1554 Albert had been driven from Franconia and his lands confiscated.
