notes:
  - Dates are converted from the lunar calendar to the Julian calendar as English sources give them; the fourth battle was fought on the 10th day of the ninth month of Eiroku 4.
  - Names. Takeda Harunobu took the Buddhist name Shingen in 1559; Nagao Kagetora became Uesugi Masatora when he was adopted by Uesugi Norimasa, the Kantō deputy, in 1561, and took the name Kenshin in 1570. They are called by their best-known names throughout.
  - Much of the detail of the 1561 battle, including Yamamoto Kansuke’s plan and the duel between Kenshin and Shingen, comes from the Kōyō Gunkan, a Takeda chronicle compiled decades later, and is doubted by historians. Its casualty figures, about 4,000 Takeda and 3,000 Uesugi dead, are often repeated; one account gives losses of 72 per cent of the Takeda and 62 per cent of the Uesugi army, while more cautious estimates put them at around a fifth.
