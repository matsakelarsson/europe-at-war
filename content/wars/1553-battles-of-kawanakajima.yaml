id: battles-of-kawanakajima
name: Battles of Kawanakajima
start: "1553"
end: "1564"
tier: B
summary: "Five campaigns fought between Takeda Shingen of Kai and Uesugi Kenshin of Echigo for the Kawanakajima plain in northern Shinano, where the Sai and Chikuma rivers meet, around today’s city of Nagano. After Shingen drove the Murakami and Ogasawara out of Shinano in 1553, they turned to Kenshin, then still called Nagao Kagetora, and he crossed the mountains to stop the Takeda advance towards his own province. The armies met at Kawanakajima in 1553, 1555, 1557, 1561 and 1564. Most of these campaigns were long stand-offs, but the fourth, fought at Hachimanbara on 18 October 1561, was one of the bloodiest battles of the Sengoku period, in which Shingen’s brother Takeda Nobushige was killed and both armies lost thousands of men. Neither side won the plain outright, though the Takeda kept most of northern Shinano; the rivalry of the two lords became one of the most retold stories of Japanese warfare."
