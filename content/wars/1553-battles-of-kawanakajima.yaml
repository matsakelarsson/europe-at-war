  - title: Hachimanbara
    date: September 1561 – 1564
    when: "1561-10-18"
    borders: "1561-10-18"
    countries: [jp]
    view:
      center: [138.180, 36.585]
      size: [34, 30]
    body:
      - By 1561 the Takeda had built a strong castle at Kaizu, on the south-east edge of the plain, held by Kōsaka Masanobu. Kenshin, back from a campaign against the Hōjō of Odawara, marched south in September with about 13,000 men and camped on Saijōsan, a hill overlooking Kaizu from the south-west, with the Chikuma river between him and the plain. Shingen came up from Kōfu with about 16,000 men, gathered more in Shinano and moved into Kaizu. According to the Takeda chronicle, his strategist Yamamoto Kansuke proposed that a detachment of about 8,000 men climb Saijōsan by night and drive the Uesugi down onto the plain, where Shingen would be waiting with the rest of the army at Hachimanbara.
      - Kenshin, perhaps warned by the smoke of cooking fires in Kaizu, came down from Saijōsan the same night, crossed the Chikuma at the ford of Amenomiya and at dawn on 18 October 1561 fell on Shingen’s army out of the morning mist. In the hours of fighting that followed Shingen’s brother Takeda Nobushige and Yamamoto Kansuke were killed, and the story was told that Kenshin rode into the Takeda headquarters and struck at Shingen, who parried with his iron war fan. The Takeda detachment found Saijōsan empty, hurried back and attacked the Uesugi from the rear, and Kenshin withdrew across the Sai river towards Zenkō-ji and then home to Echigo. Both sides claimed the victory; the losses are put at several thousand on each side.
      - In 1564 the armies met on the plain for a fifth time, at Shiozaki, and skirmished for about sixty days without a battle. After that the rivalry moved elsewhere. Shingen kept northern Shinano and turned south against the Imagawa and Tokugawa, Kenshin fought the Hōjō in the Kantō and later Oda Nobunaga in the Hokuriku, and neither ever gained a decisive advantage over the other. Shingen died in 1573 and Kenshin in 1578.
