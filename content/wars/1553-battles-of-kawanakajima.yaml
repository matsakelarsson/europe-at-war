steps:
  - title: Shinano divided
    date: 1553–1557
    when: "1553"
    borders: "1553-09-01"
    countries: [jp]
    body:
      - From 1541 Takeda Shingen, lord of Kai, set out to conquer the neighbouring province of Shinano. He beat the Ogasawara in 1548 and 1550, and although Murakami Yoshikiyo threw him back at Uedahara (1548) and at Toishi castle (1550), Toishi fell to Takeda’s men in 1551, and in 1553 Shingen took Murakami’s main castle, Katsurao. Murakami and Ogasawara Nagatoki fled north to Echigo and asked its young lord, Nagao Kagetora, the later Uesugi Kenshin, to restore them. For Kenshin the Takeda advance was also a threat to Echigo itself, and the Kawanakajima plain, the last flat land of northern Shinano before the mountains, became the frontier between them.
      - In 1553 Shingen pushed north along the Chikuma river and Kenshin came down to meet him; after clashes near Hachiman, south of the plain, and at Fuse, both withdrew. In 1555 Shingen camped south of the Sai river while Kenshin held the hills by the great temple of Zenkō-ji, and the two armies faced each other for about two hundred days, from August to November, until Imagawa Yoshimoto arranged a truce. In 1557 Shingen took Katsurayama, a fortress overlooking Zenkō-ji, and threatened Iiyama castle in the north, but withdrew when Kenshin marched out. Between the campaigns the Takeda took over most of the local lords of the plain.
