id: conquest-of-astrakhan
name: Russian conquest of Astrakhan
start: "1554"
end: "1556"
tier: C
summary: Ivan IV’s conquest of the Astrakhan khanate at the mouth of the Volga, two years after the fall of Kazan. In 1554 a Russian river army took Astrakhan without a fight and made Dervish Ali khan; when he broke with Moscow and turned to the Crimean Tatars, a small force of Cossacks and streltsy took the city again in 1556 and the khanate was annexed, giving Russia the whole course of the Volga to the Caspian Sea.
