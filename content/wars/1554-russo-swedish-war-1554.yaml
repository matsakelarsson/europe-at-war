    body:
      - Border clashes in Karelia turned into war in 1554. Ivan IV, “the Terrible”, refused to treat Gustav as an equal and made his envoys deal with the governor of Novgorod instead. In 1555 a Swedish army under Admiral Jakob Bagge besieged Nöteborg, but the siege was badly planned and failed.
      - That winter a Russian army struck back, plundering the land around Viborg without trying to take the town. Gustav asked for peace, and the Treaty of Novgorod in 1557 brought a forty-year truce, with the border unchanged.
    facts:
      - - Swedish commander
        - Jakob Bagge
      - - Treaty of Novgorod
        - March 1557, a forty-year truce
