id: battle-of-itsukushima
name: Battle of Itsukushima
start: "1555-10-16"
end: "1555-10"
tier: C
summary: "The surprise attack on the shrine island of Itsukushima (Miyajima) in which Mōri Motonari destroyed the army of Sue Harukata and made the Mōri the leading power of western Japan. In 1551 Sue Harukata, chief retainer of the Ōuchi, rose against his lord Ōuchi Yoshitaka, who took his own life at the temple of Tainei-ji, and ruled the Ōuchi lands from Yamaguchi through a puppet lord, Ōuchi Yoshinaga. Motonari, a lord of Aki who had served the Ōuchi, broke with Sue in 1554 and beat a Sue army at Oshikibata. He then built a small fort, Miyao, on Itsukushima, across the strait from the mainland, as bait. Sue landed on the island with an army put at 20,000 or more and laid siege to the fort. On the night before the battle Motonari, with 4,000 men or perhaps a few thousand more and the help of the Murakami sea lords of the Inland Sea, crossed to the island in a storm and landed behind Sue’s camp at the Tō-no-oka hill, while his son Kobayakawa Takakage brought ships round to attack from the sea. At dawn on 16 October 1555 (the 1st day of the tenth month) they fell on the Sue army from both sides. Sue’s men broke; many drowned trying to reach the mainland, and some 4,700 were killed. Sue escaped from the fort but found no boat and took his own life. Motonari had the bodies taken to the mainland and the island cleansed, since death polluted the sacred ground. In 1557 his advance into Suō and Nagato drove Ōuchi Yoshinaga to take his own life, ending the Ōuchi, and the Mōri went on to rule most of western Honshu."
countries: [jp]
