notes:
  - The date is converted from the lunar calendar to the Julian calendar as given in English sources; the fighting on the island lasted from the night before the battle until about 18 October.
  - Estimates of the two armies vary widely, from 20,000 to 30,000 for Sue and from 4,000 to 10,000 for the Mōri.
