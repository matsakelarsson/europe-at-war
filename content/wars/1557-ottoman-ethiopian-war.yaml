id: ottoman-ethiopian-war
name: Ottoman–Ethiopian border wars
start: "1557"
end: "1589"
tier: B
summary: "Wars between the Ottoman Empire and the Ethiopian emperors for the Red Sea coast and the highlands behind it in the second half of the 16th century. To shut the Portuguese out of the Red Sea, the Ottomans proclaimed a province of Habesh and in 1557 sent Özdemir Pasha, who took Massawa, Arqiqo and Debarwa, the capital of the Bahr Negash, ruler of the coastal highlands of Medri Bahri. The Bahr Negash Yeshaq first fought the Ottomans with Emperor Gelawdewos, then rebelled against Emperor Minas and joined them, and with Ottoman musketeers defeated Minas in Enderta in 1562. Emperor Sarsa Dengel defeated Yeshaq and the Ottomans at Addi Qarro in 1578, killing both Yeshaq and the pasha, and destroyed the Ottoman fort at Debarwa; after a last Ottoman push inland he raided Arqiqo in 1589, and the two sides made peace. The Ottomans kept Massawa and the coast, soon governed for them by the local na’ibs, and gave up their ambitions in the highlands."
countries: [er, et]
sides:
  - id: ot
    name: Ottoman Empire (Habesh eyalet)
    polities: [ottoman]
    ink: teal
    moves: Ottoman moves
    success: Ottoman success
  - id: et
    name: Ethiopian Empire
    polities: [ethiopia]
    ink: gold
    moves: Ethiopian moves
    success: Ethiopian success
  - id: mb
    name: Bahr Negash Yeshaq of Medri Bahri
    polities: [medri-bahri]
    ink: navy
    moves: Moves of the Bahr Negash
    success: Success of the Bahr Negash
notes:
  - "The Bahr Negash (“king of the sea”) governed Medri Bahri, the highlands of today’s Eritrea, for the Ethiopian emperors, from Debarwa. Yeshaq fought on both sides: with the emperor against the Ottomans in 1557–1560, and with the Ottomans against the emperor in 1561–1562 and 1576–1578."
  - The Ethiopian chronicles and the Ottoman records give different years for several events. Addi Qarro is dated 1577 or 1578, and the fight at Arqiqo 1587, 1588 or 1589. Arqiqo is also written Hirgigo or Arkiko.
