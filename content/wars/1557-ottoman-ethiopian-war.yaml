steps:
  - title: Özdemir Pasha and the province of Habesh
    date: 1557–1560
    when: "1557"
    borders: "1557-12-01"
    countries: [er, et]
    body:
      - After the Ottoman conquest of Egypt in 1517 and of Yemen in the 1530s, the Red Sea became a front in the Ottoman struggle with the Portuguese, who had helped Ethiopia defeat Adal in 1543. In 1555 Istanbul proclaimed a province (eyalet) of Habesh, “Abyssinia”, and gave its conquest to Özdemir Pasha, an officer who had served in Egypt and Yemen. In 1557 he landed on the coast with about 3,000 janissaries, 1,000 horsemen from Egypt and men from Suakin, took the port of Massawa, nearby Arqiqo and Beylul farther south, and marched inland to Debarwa, the capital of the Bahr Negash Yeshaq, where he built a fort and a mosque and imposed a poll tax.
      - Yeshaq, reinforced by Emperor Gelawdewos’s army, retook Debarwa and the treasure the Ottomans had stored there. Özdemir took Zeila from the weakened sultanate of Adal in 1559 and died in 1560, by most accounts at Debarwa. His successors held Massawa and Arqiqo, with Suakin the other main port of the province.
    facts:
      - [Ottoman landing, "1557"]
      - [Ottoman force, "about 3,000 janissaries and 1,000 horsemen"]
      - [Death of Özdemir Pasha, "1560"]
