  - title: Sarsa Dengel, Addi Qarro and Arqiqo
    date: 1576–1589
    when: "1578"
    borders: "1589-12-01"
    countries: [er, et]
    body:
      - Minas’s son Sarsa Dengel, emperor from 1563, defeated an army of Adal at the Webi river and executed its sultan, and then turned north. When Yeshaq rebelled again with Ottoman support and took Debarwa, Sarsa Dengel defeated the Ottomans and their Medri Bahri allies at Addi Qarro in 1577 or 1578; both the Ottoman commander, Ahmad Pasha, and Yeshaq were killed. The Ottoman garrison of Debarwa surrendered with its firearms, and the emperor had the fort and the mosque destroyed. His forces also attacked the coast, but could not take Massawa.
      - Egypt sent reinforcements, and in 1579 the new governor, Hızır Pasha, retook Arqiqo, beat the Ethiopian forces near Massawa and Debarwa and pushed inland again. In 1588 the Ottomans named their own Bahr Negash and advanced inland again. Sarsa Dengel crossed the Mareb, raided the Ottoman fort at Arqiqo and killed its commander, Kedwart Pasha. The Ottomans sent gifts and asked for peace, which he accepted, sparing the fort.
      - The border settled where it would stay for nearly three centuries. The Ottomans kept Massawa, Arqiqo and the coast; from 1591 a local Beja chief, the na’ib of Arqiqo, governed them for the Ottomans, with a small garrison at Massawa, while the highlands, Debarwa included, remained Ethiopian.
    facts:
      - [Battle of Addi Qarro, "1577 or 1578, Ethiopian victory"]
      - [Killed, "Bahr Negash Yeshaq and Ahmad Pasha"]
      - [Raid on Arqiqo, "1589 (some sources 1587), Ethiopian success"]
