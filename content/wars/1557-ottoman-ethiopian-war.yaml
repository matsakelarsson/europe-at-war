  - title: Yeshaq changes sides
    date: 1560–1572
    when: "1562-04-20"
    borders: "1562-04-20"
    countries: [er, et]
    body:
      - Gelawdewos was killed fighting Adal in 1559, and his brother Minas, who had spent years as a prisoner of Adal, succeeded him. In 1560 or 1561 Yeshaq rebelled against the new emperor, was defeated, and fled to the Ottomans, promising them Debarwa, Massawa and Arqiqo in return for their help.
      - On 20 April 1562 the Ottoman governor and Yeshaq, with Ottoman musketeers and local allies, defeated Minas in Enderta in southern Tigray. The emperor fled and died the next year, a fugitive. Yeshaq ruled Medri Bahri as an ally of the Ottomans, who garrisoned Debarwa until 1572; when they withdrew he occupied it briefly and then handed it back to them as agreed.
    facts:
      - [Yeshaq’s revolt, "1560 or 1561"]
      - [Battle in Enderta, "20 April 1562, Ottoman victory"]
      - [Ottoman withdrawal from Debarwa, "1572"]
    markers:
      - kind: battle
        side: ot
        name: Enderta
        date: 20 April 1562
        text: The Ottomans and Yeshaq defeated Emperor Minas in this province of southern Tigray, around today’s Mekele. The exact site is not recorded.
        lonlat: [39.47, 13.50]
      - kind: held
        side: ot
        name: Debarwa
        date: 1562–1572
        text: Garrisoned by the Ottomans as allies of the Bahr Negash.
        lonlat: [38.83, 15.10]
        lp: l
