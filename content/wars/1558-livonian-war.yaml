id: livonian-war
name: Livonian War
start: "1558"
end: "1583"
tier: B
summary: A war for Old Livonia, today’s Estonia and Latvia, between Russia, Poland–Lithuania, Sweden and Denmark–Norway. Ivan IV’s early conquests broke up the Livonian Confederation, but Polish–Lithuanian and Swedish offensives from 1578 reversed them, and the truces of Jam Zapolski (1582) and Plussa (1583) divided Livonia between Poland–Lithuania and Sweden.
