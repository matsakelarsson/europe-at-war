  - title: Báthory’s campaigns and the Truce of Jam Zapolski
    date: 1579–1582
    when: "1579"
    borders: "1582-01-15"
    countries: [pl, lt, by, ru, lv, ee]
    side_names: {foe: Russian success}
    move_names: {foe: Russian moves}
    body:
      - "Stefan Báthory, Prince of Transylvania, was elected king of Poland and grand duke of Lithuania in 1576. With Polish hussars, Hungarian and German mercenary infantry and Lithuanian troops, he struck not at Livonia, which Ivan IV had largely overrun in 1577, but at the Russian strongholds behind it. On 30 August 1579 he took Polotsk back after a three-week siege. In 1580 his army took Velizh and Usvyaty, and on 5 September the burning fortress of Velikiye Luki."
      - "In August 1581 Báthory laid siege to Pskov, one of the strongest towns in Russia. Its garrison and townspeople under Prince Ivan Shuisky beat off every assault, and through the winter Jan Zamoyski kept up a blockade while Polish raiders ranged deep into Russia. With the papal envoy Antonio Possevino as mediator, a ten-year truce was signed at Jam Zapolski on 15 January 1582. Ivan gave up all his Livonian conquests and Polotsk, and Báthory handed back Velikiye Luki and lifted the siege."
    facts:
      - [Polotsk retaken, 30 August 1579]
      - [Siege of Pskov, August 1581 – February 1582]
      - [Truce of Jam Zapolski, "15 January 1582, for ten years"]
    markers:
      - kind: siege
        side: pl
        name: Polotsk
        date: 30 August 1579
        text: Báthory’s army set fire to the wooden walls and forced the garrison to surrender.
        lonlat: [28.8, 55.4833]
      - kind: siege
        side: pl
        name: Velikiye Luki
        date: 5 September 1580
        text: The wooden fortress caught fire under bombardment and surrendered on 5 September. As the attackers looted it, the fire reached the powder store, which blew up and killed many on both sides. It was returned to Russia in 1582.
        lonlat: [30.5333, 56.3333]
      - kind: held
        side: foe
        name: Siege of Pskov
        date: August 1581 – February 1582
        text: Prince Ivan Shuisky’s defenders repelled more than thirty assaults. The last Polish–Lithuanian troops left on 4 February 1582.
        lonlat: [28.3333, 57.8167]
      - kind: treaty
        side: pl
        name: Truce of Jam Zapolski
        date: 15 January 1582
        text: Signed at the village of Kiverova Gora near Jam Zapolski, south-east of Pskov; Russian sources date it 6 January, Old Style. Russia gave up its claims to Livonia and Polotsk.
        lonlat: [29.67, 57.3]
