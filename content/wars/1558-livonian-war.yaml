  - title: Polotsk lost, Lublin united
    date: 1562–1570
    when: "1563"
    borders: "1569-07-01"
    countries: [pl, lt, by, ru]
    side_names: {foe: Russian success}
    move_names: {foe: Russian moves}
    body:
      - "Lithuania had taken southern Livonia under its protection in 1559, and in 1561 the Livonian Order was dissolved: its last master became Duke of Courland as a vassal of Sigismund II Augustus, and the rest of its land passed to the Grand Duchy. When a truce ran out in 1562, Ivan IV struck at Lithuania itself. A large Russian army laid siege to Polotsk on the Dvina at the end of January 1563, and after a heavy bombardment the town surrendered on 15 February. According to widely repeated accounts, Jews of Polotsk who refused baptism were drowned in the river on Ivan’s orders."
      - "On 26 January 1564 a Lithuanian army under Mikołaj Radziwiłł the Red surprised and destroyed a Russian force on the Ula river, but Polotsk stayed Russian for sixteen years. The war convinced the Lithuanian nobles that they could not hold out alone. At a joint diet in Lublin in 1569 King Sigismund II Augustus moved Podlasie, Volhynia and the Kiev region from Lithuania to the Polish crown, and on 1 July the two states became one Commonwealth, with a single elected king and parliament but separate armies, treasuries and laws. A truce with Russia followed in 1570."
    facts:
      - [Fall of Polotsk, 15 February 1563]
      - [Battle of the Ula, "26 January 1564, Lithuanian victory"]
      - [Union of Lublin, 1 July 1569]
    markers:
      - kind: treaty
        side: pl
        name: Treaty of Vilnius
        date: 28 November 1561
        text: The Livonian Order was dissolved. Gotthard Kettler became Duke of Courland, and Livonia north of the Dvina passed to Lithuania.
        lonlat: [25.28, 54.6872]
      - kind: siege
        side: foe
        name: Polotsk
        date: January–February 1563
        text: Ivan IV took the old capital of a Ruthenian principality after a two-week siege. It was Ivan’s greatest gain at Lithuania’s expense.
        lonlat: [28.8, 55.4833]
      - kind: battle
        side: pl
        name: Battle of the Ula
        date: 26 January 1564
        text: Radziwiłł caught a Russian army on the march and routed it. Its commander, Pyotr Shuisky, was killed.
        lonlat: [29.155, 54.8975]
      - kind: treaty
        side: pl
        name: Union of Lublin
        date: 1 July 1569
        text: Poland and Lithuania became the Polish–Lithuanian Commonwealth, one of the largest states in Europe.
        lonlat: [22.5667, 51.25]
