    body:
      - When Russia invaded Livonia in 1558, the old Livonian Order collapsed and its neighbours carved up its lands. In 1561 Reval and the nobles of northern Estonia placed themselves under Swedish rule, Sweden’s first foothold south of the Gulf of Finland.
      - From 1570 Sweden fought Russia for Estonia. Reval beat off Russian sieges, and in 1580–81 Pontus De la Gardie went on the offensive, taking Kexholm, Wesenberg and, on 6 September 1581, Narva, where many inhabitants were massacred. Ivangorod, Jama and Koporye followed. The Truce of Plussa on 10 August 1583 left Sweden holding Estonia, Ingria and Kexholm.
