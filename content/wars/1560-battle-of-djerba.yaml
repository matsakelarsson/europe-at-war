notes:
  - Dates are Julian. The size of the allied fleet and the numbers killed and captured vary widely between sources; one modern estimate puts the dead at more than 5,000, with about as many taken prisoner.
  - The Ottoman victory was followed by the Great Siege of Malta in 1565, which has its own entry.
