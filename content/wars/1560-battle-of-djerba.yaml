id: battle-of-djerba
name: Battle of Djerba
start: "1560-02-10"
end: "1560-07-31"
tier: C
summary: A Spanish-led expedition to retake Tripoli, which the corsair Turgut Reis (Dragut) had taken from the Knights of Malta in 1551, that ended in one of the worst Christian defeats at sea of the century. Philip II’s allies, Genoa, the papacy, Naples, Sicily, Florence and the Knights, assembled perhaps 50–60 galleys and many smaller ships under the young Giovanni Andrea Doria and the Duke of Medinaceli, viceroy of Sicily. Delayed by weather and disease, they gave up on Tripoli and in March occupied the island of Djerba, where they built a fort. In May an Ottoman fleet of about 86 galleys and galliots under Piyale Pasha arrived unexpectedly fast and caught the allied ships as they tried to leave, taking or sinking some 27 galleys and many other vessels. The fort, held by Álvaro de Sande with several thousand soldiers and civilians, held out until the Ottomans cut off its water in July; after a last sortie at the end of the month it fell, and thousands were killed or carried off as slaves. A tower of the defenders’ skulls stood on the island until the 19th century. The defeat crippled the Spanish galley fleet for several years.
countries: [tn, ly, mt, it, es]
