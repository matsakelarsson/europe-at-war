id: battle-of-okehazama
name: Battle of Okehazama
start: "1560-06-12"
end: "1560-06-12"
tier: C
summary: "The battle in which Oda Nobunaga, a young lord of Owari, killed Imagawa Yoshimoto and broke the strongest house of the Tōkaidō. Yoshimoto, who ruled Suruga, Tōtōmi and Mikawa, marched west into Owari in 1560 with an army of about 25,000; whether he meant to go on to Kyoto or only to secure the border is debated. His vanguard took the Oda border forts of Washizu and Marune, the second stormed by the young Matsudaira Motoyasu, the later Tokugawa Ieyasu, who served the Imagawa. Nobunaga could raise perhaps 2,000 to 3,000 men. He rode out from Kiyosu by way of the Atsuta shrine to the fort at Zenshō-ji, left banners there to suggest a larger force, and moved against Yoshimoto’s headquarters, which had halted in the narrow valley of Dengaku-hazama near the village of Okehazama. Under cover of a sudden thunderstorm the Oda troops fell on the Imagawa headquarters on 12 June 1560 (the 19th day of the fifth month of Eiroku 3). Yoshimoto was killed in the fight by two Oda samurai, Hattori Koheita and Mōri Shinsuke (accounts differ on which of them struck him down), and most of his commanders died with him. The traditional account has the Oda swing round through the hills to strike from the flank; many historians now think Nobunaga attacked head on. The Imagawa never recovered. Motoyasu went home to Okazaki, made himself independent and in 1562 allied with Nobunaga, and Nobunaga, secure in the east, turned to the conquest of Mino."
