id: french-wars-of-religion
name: French Wars of Religion
start: "1562-03-01"
end: "1598-05-02"
tier: A
summary: A series of civil wars between French Catholics and Protestants (Huguenots), tangled with the rivalry of great noble families and foreign intervention by Spain, England and German princes. Begun with the massacre at Vassy in 1562 and marked by the St Bartholomew’s Day massacre of 1572, they ended when the Protestant Henry of Navarre, heir to the throne from 1584, became a Catholic, won over the Catholic League, granted the Huguenots toleration in the Edict of Nantes and made peace with Spain at Vervins in 1598.
countries: [fr, es, gb, be, de, ch]
sides:
  - id: hug
    name: Huguenots
    polities: [bearn]
    ink: orange
    moves: Huguenot moves
    success: Huguenot success
  - id: roy
    name: The crown and the Catholics
    polities: [france]
    ink: navy
    moves: Royal and Catholic moves
    success: Royal and Catholic success
  - id: lea
    name: Catholic League
    polities: []
    ink: purple
    moves: League moves
    success: League success
  - id: es
    name: Spain
    polities: [spain, habsburg-netherlands]
    ink: gold
    moves: Spanish moves
    success: Spanish success
  - id: en
    name: England
    polities: [england]
    ink: red
    moves: English moves
    success: English success
notes:
  - Historians usually count eight wars between 1562 and 1598, separated by edicts of pacification that rarely held for long. The Huguenot risings of the 1620s, ended by the Peace of Alès in 1629, are sometimes counted as a continuation.
  - France adopted the Gregorian calendar in December 1582; dates after that are New Style. Contemporary English accounts are ten days behind.
  - The Huguenots’ princely leaders came from the house of Bourbon, kings of Navarre and lords of Béarn, which is shown as their land. After Henry of Navarre became king in 1589, his royalists and the Huguenots fought on the same side against the League and Spain.
  - Numbers killed in the massacres and sieges are uncertain and disputed. The wars as a whole are thought to have cost between two and four million lives, through violence, famine and disease.
