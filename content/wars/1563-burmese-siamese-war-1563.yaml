notes:
  - "Army sizes are those of the Burmese chronicles as given by modern historians; the Siamese chronicles give much larger figures (546,000 men in 1568), which are not taken literally. Dates are Gregorian equivalents of the Burmese chronicle dates. The Burmese chronicles date the fall of Ayutthaya to 2 August 1569; some accounts give 7 August."
  - "The Siamese chronicles name Phraya Chakri, a noble taken to Pegu as a hostage in 1564, as the man who opened the gate in 1569; the Burmese chronicles speak of a Siamese noble sent into the city as a feigned deserter. In Thailand the war of 1568–1569 is known as the war of the first fall of Ayutthaya."
  - "The base map keeps Siam as Ayutthaya, a Burmese vassal kingdom from 1564 to 1584. Phitsanulok, the seat of Maha Thammarachathirat, was part of the Siamese kingdom."
