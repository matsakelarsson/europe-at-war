steps:
  - title: The white elephants
    date: July 1563 – February 1564
    when: "1563-11"
    borders: "1564-02-18"
    countries: [mm, th]
    body:
      - "Bayinnaung, king of Toungoo Burma since 1550, had taken Ava and the Shan states in 1555–1557, Manipur and Lan Na in 1558–1560. On 16 July 1563 he sent an embassy to Ayutthaya demanding one of the white elephants owned by King Maha Chakkraphat, animals that marked their owner as a universal Buddhist ruler. The demand was refused, as expected. On 1 November 1563 five armies, by the Burmese chronicles 60,000 men, 2,400 horses and 360 elephants, left Pegu; a Lan Na army that was to join them did not come, because King Mekuti of Lan Na had revolted."
      - "The Burmese entered Siam from the north-west and took Kamphaeng Phet on 4 December 1563. Three armies fanned out to Sukhothai, Phitsanulok and Sawankhalok; apart from a five-day battle at Phitsanulok they met little opposition, and the rulers of these towns and of Phichit submitted and kept their posts. Among them was Maha Thammarachathirat of Phitsanulok, the king’s son-in-law. The armies then marched down the Chao Phraya to Ayutthaya, where a fort, three Portuguese warships and shore batteries held them off for weeks."
      - "On 7 February 1564 the Burmese took the Portuguese ships and batteries, the fort fell, and on 18 February the king surrendered. Bayinnaung took all four white elephants and the king himself to Pegu, with Prince Ramesuan and, by Thai accounts, the chancellor Phraya Chakri and the commander Phra Sunthon Songkhram as hostages; Siam was to send 30 elephants and silver every year and hand over the customs of Mergui. Maha Chakkraphat’s son Mahinthrathirat became vassal king with a Burmese garrison of 3,000. By Thai tradition the young Naresuan, son of Maha Thammarachathirat, was also taken to Pegu as a hostage. Bayinnaung then put down Mekuti’s revolt, entering Chiang Mai in November 1564."
    facts:
      - ["Burmese army", "about 60,000 men, 2,400 horses, 360 elephants (Burmese chronicles)"]
      - ["Kamphaeng Phet taken", "4 December 1563"]
      - ["Ayutthaya surrenders", "18 February 1564"]
