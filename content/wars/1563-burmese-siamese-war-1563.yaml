id: burmese-siamese-war-1563
name: Burmese–Siamese wars of 1563–1564 and 1568–1569
start: "1563-11-01"
end: "1569-08-02"
tier: B
summary: "Two invasions of Siam by Bayinnaung of Toungoo, who had brought the Shan states, Manipur and Lan Na under his rule. In 1563 he demanded one of the Siamese king’s white elephants, the emblems of a universal ruler; when Maha Chakkraphat refused, five Burmese armies took the towns of the north and forced Ayutthaya to surrender in February 1564. Siam became a vassal kingdom, gave up four white elephants and sent hostages to Pegu. In 1568 the former king, allowed home as a monk, renounced the robe and rose in alliance with Setthathirath of Lan Xang, while Maha Thammarachathirat of Phitsanulok stayed loyal to Burma. A Burmese army of about 70,000 besieged Ayutthaya from December 1568, beat a Lao relief army in May 1569, and took the city on 2 August 1569 when a gate was opened from inside. Maha Thammarachathirat was made king of a vassal Siam; Bayinnaung then marched on Vientiane, where the Lao fought a guerrilla war until he withdrew in 1570."
countries: [mm, th, la]
sides:
