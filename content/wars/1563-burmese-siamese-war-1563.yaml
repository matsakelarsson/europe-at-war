  - title: A vassal Siam, and the Lao guerrilla war
    date: September 1569 – April 1570
    when: "1569-10"
    borders: "1570-01"
    countries: [th, la, mm]
    body:
      - "On 29 September 1569 Bayinnaung made Maha Thammarachathirat king of Siam, a Burmese vassal. Ayutthaya had lost many of its people to deportation; for fifteen years Siamese troops served in Burmese campaigns, while Cambodian raids struck the weakened kingdom. Naresuan, the new king’s son, came back from Pegu in 1571 to govern Phitsanulok, and it was he who threw off Burmese rule in 1584."
      - "In October 1569 Bayinnaung led two armies into Lan Xang. Setthathirath defended Vientiane for a few months and then, in February 1570, withdrew into the forests north-east of the city, around the Nam Ngum, to wage a guerrilla war. The Burmese combed the countryside for two months without finding him; many died of hunger and the long marches, and in April 1570 Bayinnaung gave up and went home with few men of his original army. Lao accounts claim large numbers of prisoners and elephants taken from the retreating Burmese."
    facts:
      - ["Maha Thammarachathirat made king", "29 September 1569"]
      - ["Vientiane", "taken by the Burmese late 1569, left April 1570"]
