  - title: The revolt of 1568 and the first fall of Ayutthaya
    date: May 1568 – August 1569
    when: "1568-12"
    borders: "1569-08-02"
    countries: [th, la, mm]
    body:
      - "Maha Chakkraphat, honoured at Pegu, was allowed to return to Ayutthaya on pilgrimage as a monk. There he left the robe and, with his son Mahinthrathirat, declared Siam independent; Bayinnaung heard of it on 12 May 1568. Setthathirath of Lan Xang, who had retaken Vientiane from the Burmese, joined him. Maha Thammarachathirat of Phitsanulok stayed loyal to Burma. From June, in the rains, Siamese and Lao armies besieged Phitsanulok, but its walls, reinforced by 6,000 Burmese troops, held, and the besiegers withdrew in late October. The Siamese carried off Maha Thammarachathirat’s family from Phitsanulok to Ayutthaya."
      - "Bayinnaung’s five armies, 54,600 men, 5,300 horses and 530 elephants by the Burmese count, reached Phitsanulok on 27 November 1568, and about 70,000 men marched down the river to lay siege to Ayutthaya in December. Siamese cannon stopped the Burmese from digging up to the walls, and sorties broke up their bridge-building. When Setthathirath came down the Pa Sak valley with a relief army, Bayinnaung met him with half his force and defeated him north-east of the city on 8 May 1569. Maha Chakkraphat died during the siege; his son Mahinthrathirat offered a conditional surrender, which was refused."
      - "Bayinnaung then sent a Siamese noble into the city as a feigned deserter; Mahinthrathirat gave him a command, and on the night of 2 August 1569, by the Burmese chronicles, a gate was opened and the city fell. It was sacked, and the king, his family and nobles, with many townspeople, were taken to Burma; Mahinthrathirat died on the way."
    facts:
      - ["Siege of Phitsanulok", "June – October 1568, failed"]
      - ["Siege of Ayutthaya", "December 1568 – 2 August 1569"]
      - ["Lao relief army defeated", "8 May 1569"]
