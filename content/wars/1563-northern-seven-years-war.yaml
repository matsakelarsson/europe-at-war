id: northern-seven-years-war
name: Northern Seven Years’ War
start: "1563"
end: "1570"
tier: B
summary: A war between Sweden and an alliance of Denmark–Norway, Lübeck and Poland–Lithuania over the control of the Baltic and the legacy of the Kalmar Union. After seven years of destructive fighting the Peace of Stettin in 1570 left the borders unchanged, but Sweden had to pay a ransom for the fortress of Älvsborg.
