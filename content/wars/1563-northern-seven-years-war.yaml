  - title: War with Denmark and Lübeck
    date: 1563–1565
    when: "1563"
    borders: "1561"
    countries:
      - se
      - dk
      - no
      - de
    view:
      center:
        - 13.7829
        - 57.3877
      size:
        - 523
        - 501
    body:
      - Frederick II of Denmark resented the end of the Kalmar Union, and Eric XIV of Sweden wanted to break Denmark’s hold on the Baltic. Denmark–Norway, Lübeck and Poland–Lithuania went to war with Sweden in 1563. The Danes took Älvsborg, Sweden’s only port on the west coast, in September 1563, and beat a Swedish force at Mared in November.
      - The Swedes did better at sea, and in August 1565 they took the Halland fortress of Varberg. But on 20 October 1565 a Danish army under Daniel Rantzau defeated a larger Swedish army at Axtorna nearby, the only major land battle of the war.
    facts:
      - - Älvsborg
        - Lost to Denmark, September 1563
      - - Battle of Axtorna
        - 20 October 1565, Danish victory
