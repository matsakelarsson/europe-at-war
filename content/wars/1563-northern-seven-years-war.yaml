  - title: Rantzau’s raid and the Peace of Stettin
    date: 1566–1570
    when: "1566"
    borders: "1561"
    countries:
      - se
      - dk
      - no
    view:
      center:
        - 14.1279
        - 57.342
      size:
        - 663
        - 959
    body:
      - In spring 1567 the Swedes attacked south-eastern Norway, took Hamar and besieged Akershus. In the winter of 1567–68 Daniel Rantzau led some 4,000 men on one of the most destructive raids of the war, deep into central Sweden, until supply problems forced him back. In 1568 Eric XIV, by now unstable and guilty of murdering nobles, was deposed by his brothers.
      - Peace came at Stettin on 13 December 1570. No land changed hands, but Sweden had to buy back Älvsborg for 150,000 riksdaler, the First Älvsborg Ransom.
    facts:
