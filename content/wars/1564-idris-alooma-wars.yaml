id: idris-alooma-wars
name: Idris Alooma’s wars
start: "1564"
end: "1596"
tier: B
summary: "The campaigns of Mai Idris b. Ali, called Alooma after his burial place, the most famous king of Bornu. With a reorganised cavalry, a corps of musketeers trained by Turks, camel troops and large boats for crossing rivers and Lake Chad, he fought the peoples of the Bornu heartland who would not submit, expelling some of them and taking towns such as Amsaka by storm, raided as far as Kano, and in a series of expeditions to Kanem broke the power of the Bulala, who had driven his ancestors out two centuries earlier. Kanem was divided, with the Bulala under Bornu’s loose overlordship, and many Kanem peoples were moved to Bornu. Idris exchanged embassies with the Ottoman sultan Murad III and with Ahmad al-Mansur of Morocco, and was killed on campaign near present-day Maiduguri. His imam Ahmad ibn Furtu wrote an account of his first twelve years, the earliest detailed history of a West African king’s wars by a contemporary."
countries: [ng, td, ne, cm]
sides:
