notes:
  - "The dates of Idris’s reign are uncertain. The UNESCO General History, following Dierk Lange, gives 1564–1596; other historians give about 1570–1603, 1571–1603 or later ranges, and the dates of single campaigns (such as 1575 for Amsaka) shift with the chronology. Ahmad ibn Furtu’s two works, the “Book of the Bornu wars” and the “Book of the Kanem wars”, translated by H. R. Palmer in 1926 and edited by Lange in 1987, are panegyrics written for the king; they give his side only, and rarely give dates."
