  - title: Kanem and the Bulala
    date: about 1571–1596
    when: "1575"
    borders: "1590"
    countries: [td, ng]
    body:
      - "Idris then turned to Kanem, to end the Bulala threat for good. In more than five expeditions, which Palmer dated about 1571–1575, he defeated the Bulala and their allies, among them the Kananiya, devastated three of the most fertile valleys of Kanem and destroyed towns such as Ikima, Aghafi and Ago. A peace was made with the Bulala king Abdullah, and a border agreed. When Abdullah died, his uncle Abd al-Jalil pushed aside his heir Muhammad and refused the alliance; Idris won a hard war, took Njimi and the lands east of it into Bornu and restored Muhammad. By the last two decades of the century Kanem had been divided by agreement between Bornu and the Bulala, who accepted a loose Bornu overlordship."
      - "Many Kanem peoples were moved to Bornu: Tubu, Koyam, Kulu and Shuwa Arabs were settled south of Lake Chad, in the west of the kingdom and on the desert edge, as herders, traders, camel troops and salt workers. Idris made the pilgrimage to Mecca about 1571 and sent an embassy to Istanbul about 1574. In his reply of 5 May 1577 Sultan Murad III granted his requests for the safety of Bornu’s travellers in Ottoman lands and for joint action against Tuareg raiders, but not the cession of the fort of Guran south of the Fezzan. About 1583 Idris sent an embassy to Ahmad al-Mansur of Morocco; Moroccan sources say he asked for firearms and acknowledged al-Mansur as caliph in a written oath of allegiance, which al-Mansur used to support his claim to rule the Sudan (see “Moroccan invasion of the Songhai Empire”). Late in his reign Idris met setbacks against Mandara and on his southern frontier, and he was killed near present-day Maiduguri by an archer hidden in a tree while campaigning among the Gamergu. He was buried by Lake Alau, which gave him his posthumous name."
    facts:
      - [Expeditions to Kanem, "more than five, about 1571–1575"]
      - [Njimi annexed, "after the war with Abd al-Jalil"]
      - [Embassy to Morocco, "about 1583"]
