steps:
  - title: The wars in Bornu
    date: 1564–about 1580
    when: "1570"
    borders: "1575"
    countries: [ng, ne, cm]
    body:
      - "Idris b. Ali came to the throne of Bornu, by the usual reckoning, in 1564, and set out to bring the whole of the Bornu heartland under the control of the mais. He reorganised the cavalry, the core of his army, and strengthened the corps of Turkish musketeers that his predecessors had begun; the gunners and their instructors are generally thought to have come across the Sahara from Ottoman Tripoli, perhaps as mercenaries. He added camel troops, drawn from the Koyam, and had larger boats built so that his army could cross rivers and Lake Chad more quickly. Fortified posts (ribats) were built in the south against peoples such as the Gamergu."
      - "Groups that would not submit were attacked year after year: the Ngafata, Talata, Dugurti, Maya, Ngizim and Bedde among them. Some, like the Mukhulum, kept their homes in return for a tribute in grain; others, the Ngafata, Talata and Dugurti, were driven out of Bornu. The walled town of Amsaka, near today’s Dikwa, resisted a first assault by Idris and his ally Yamtarawalla, chief of the Babur; at the second attempt his men filled in its ditch, his musketeers fired from raised platforms and the stockade was cut down. The town was sacked, about 1575 by one chronology, and its people were killed. Ibn Furtu also tells of an expedition that reached Kano, and of Bornu’s influence over Aïr and Bilma on the Saharan routes; captives taken in these wars were married into Bornu society or traded, and the Kanuri people spread through the heartland."
    facts:
      - [Musketeers, "a corps trained by Turks"]
      - [Peoples expelled, "Ngafata, Talata and Dugurti"]
      - [Amsaka stormed, "about 1575"]
