  - title: The sack of Vijayanagara
    date: 1565
    when: "1565-02"
    borders: "1565-06"
    countries: [in]
    body:
      - "Rama Raya’s brother Tirumala escaped from the battle, gathered what treasure he could, and fled with the emperor Sadashiva to the fortress of Penukonda, 250 km to the south-east. The capital was left without defenders. The sultans’ armies entered it and plundered it for months; palaces, temples and gardens were burned and broken up. When the Italian traveller Cesare Federici passed through in 1567, he found the city almost deserted."
      - "Vijayanagara was never again a capital. Tirumala made himself king around 1570, founding the Aravidu dynasty, which ruled from Penukonda and later from Chandragiri and Vellore. The empire lost the Raichur doab to Bijapur, and over the next decades its nayakas, the governors of Madurai, Thanjavur, Gingee and Keladi, became rulers in their own right. The victorious alliance did not last; within a few years the sultans were fighting each other again."
