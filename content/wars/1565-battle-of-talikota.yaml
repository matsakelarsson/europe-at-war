notes:
  - Dates are in the Julian calendar, as the sources give them. Some accounts date the battle to 26 January 1565, and estimates of its length range from a few hours to several days.
  - The armies’ sizes in the chronicles, several hundred thousand men on each side, are not credible. How much of the city of Vijayanagara was destroyed is also debated; older accounts, following Robert Sewell’s A Forgotten Empire (1900), describe its utter ruin, while recent archaeology suggests the destruction fell mainly on the royal centre and some temples.
