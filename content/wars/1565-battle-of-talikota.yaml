steps:
  - title: Talikota
    date: 23 January 1565
    when: "1565-01-23"
    borders: "1565-01-23"
    countries: [in]
    body:
      - "Since the Bahmani Sultanate broke up in the early 16th century, its successor states in the Deccan had fought each other and Vijayanagara, the Hindu empire south of the Krishna and Tungabhadra rivers, over the fertile Raichur doab between them. From the 1540s Vijayanagara was ruled in practice by Aliya Rama Raya, regent for the emperor Sadashiva. He allied with one sultan against another, and in the early 1560s his armies, together with Bijapur and Golconda, ravaged the lands of Ahmadnagar. His demands for territory and the conduct of his troops turned all the sultans against him."
      - "In 1564 Hussain Nizam Shah of Ahmadnagar, Ali Adil Shah of Bijapur, Ibrahim Qutb Shah of Golconda and Ali Barid Shah of Bidar formed an alliance, sealed by marriages; Berar stayed out. Their armies gathered near Talikota and crossed the Krishna. Rama Raya, then in his seventies or older, led the Vijayanagara army to meet them, and the two armies clashed near Rakkasagi and Tangadagi on 23 January 1565."
      - "The Vijayanagara army seems to have had the better of the first fighting, but the allies’ massed artillery broke its attacks. According to one account, two Muslim commanders in Rama Raya’s service changed sides during the battle, which many historians doubt. Rama Raya was captured and beheaded on the orders of Hussain Nizam Shah, and his army fled."
