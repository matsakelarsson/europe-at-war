id: battle-of-talikota
name: Battle of Talikota
start: "1565-01-23"
end: "1565"
tier: B
summary: "The battle in which an alliance of four Deccan sultanates, Bijapur, Ahmadnagar, Golconda and Bidar, defeated the army of the Vijayanagara Empire, the great power of southern India, on 23 January 1565. Aliya Rama Raya, who ruled Vijayanagara in the name of the emperor Sadashiva, had for twenty years played the sultanates against each other; his growing demands drove them to unite. The armies met south of the Krishna river, near the villages of Rakkasagi and Tangadagi, some 30 km from Talikota, after which the battle is usually named. Rama Raya was captured and beheaded, his army broke, and the sultans’ troops sacked the undefended capital, Vijayanagara (Hampi), over the following months. The empire survived under Rama Raya’s brother Tirumala and the Aravidu dynasty, ruling from Penukonda and later Chandragiri, but never recovered its power."
countries: [in]
