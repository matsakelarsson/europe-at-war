id: great-siege-of-malta
name: Great Siege of Malta
start: "1565-05-18"
end: "1565-09-13"
tier: B
summary: The Ottoman attempt to take Malta from the Knights of St John in 1565. A large Ottoman army besieged the knights, the Maltese and their Spanish and Italian soldiers for nearly four months, taking Fort St Elmo at great cost but failing against Birgu and Senglea, until a relief army from Sicily landed in September and the invaders sailed away.
countries: [mt, tr, es, it]
sides:
