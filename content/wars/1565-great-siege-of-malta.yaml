  - title: Birgu, Senglea and the relief
    date: July–September 1565
    when: "1565-07-03"
    borders: "1565-09-13"
    countries: [mt, tr, es, it]
    body:
      - Next the Ottomans turned on Birgu and Senglea, ringing them with some 65 guns. A small relief of about 600 men slipped into Birgu in early July. On 15 July Mustafa sent boats, dragged overland into the Grand Harbour, against Senglea, while corsairs stormed Fort St Michael; a battery hidden at the foot of Fort St Angelo sank most of the boats. On 7 August, with the walls breached, a great double assault was close to success when cavalry from Mdina fell on the Ottoman camp at Marsa, and the attackers, thinking a relief army had come, drew back.
      - Through August the defenders beat off assaults, mines and siege towers. Valette, about seventy, fought in the breach himself and refused to abandon the towns for Fort St Angelo. On 7 September García de Toledo, viceroy of Sicily, landed about 8,000 men in the north of the island. The Ottomans began to embark, turned back to attack the relief army, were routed near St Paul’s Bay on 11 September and sailed away. About a third of the knights and of Malta’s people had died; the Ottomans had lost perhaps 25,000 or more. In March 1566 Valette laid the first stone of a new fortified city on Mount Sciberras, Valletta.
    facts:
      - [Great assault on Birgu and Senglea, 7 August 1565]
      - [Relief army lands, 7 September 1565]
      - [Ottoman losses, "perhaps 25,000 or more, estimates vary"]
    markers:
      - kind: held
        side: kn
        name: Birgu and Senglea
        date: July–September 1565
        text: The two fortified towns, with Fort St Angelo and Fort St Michael, withstood four months of bombardment and assaults; at the end they were largely in ruins.
        lonlat: [14.52, 35.887]
      - kind: event
        side: kn
        name: Marsa
        date: 7 August 1565
        text: Cavalry from Mdina under Vincenzo Anastagi attacked the lightly guarded Ottoman camp and field hospital, killing the sick and wounded, and broke off the great assault.
        lonlat: [14.495, 35.877]
        lp: l
      - kind: held
        side: kn
        name: Mdina
        date: early September 1565
        text: When the Ottomans marched on the old capital, its guns opened fire at long range, a bluff that made it seem well supplied, and they turned back.
        lonlat: [14.403, 35.886]
        lp: l
      - kind: event
        side: sp
        name: The great relief
        date: 7 September 1565
        text: García de Toledo’s relief army, the Gran Soccorso, landed unopposed in the north of the island and marched inland to Mdina.
        lonlat: [14.36, 35.96]
        lp: t
      - kind: battle
        side: sp
        name: St Paul’s Bay
        date: 11 September 1565
        text: Mustafa’s attack on the relief army failed, and his men were cut down as they fled to the boats.
        lonlat: [14.4, 35.948]
    arrows:
