notes:
  - Dates are Julian, as usual for the period. In Malta the end of the siege is celebrated on 8 September, the day the Ottomans began to embark; their last attack came on 11 September, and their forces had left the islands by 13 September.
  - The size of the Ottoman army is uncertain. One knight who fought in the siege, Francisco Balbi di Correggio, counted about 48,000; letters written during the siege give 22,000 or fewer, and most historians suggest 30,000–40,000 including sailors.
  - The Knights Hospitaller, a military religious order, held Malta from 1530 as a fief of the Kingdom of Sicily, paying a yearly falcon to its king. The new capital, Valletta, is named after Grand Master Jean de Valette.
