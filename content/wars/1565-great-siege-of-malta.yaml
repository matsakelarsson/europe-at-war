steps:
  - title: Fort St Elmo
    date: 18 May – 23 June 1565
    when: "1565-05-18"
    borders: "1565-06-23"
    countries: [mt, tr, es, it]
    body:
      - The Knights of St John, driven from Rhodes by the Ottomans in 1522, had held Malta since 1530, and their galleys preyed on Muslim shipping. In 1565 Sultan Suleiman sent a fleet of about 200 ships under Piyale Pasha with an army under Mustafa Pasha, perhaps 30,000 or more fighting men. Grand Master Jean de Valette had about 500 knights and some 6,000 soldiers, Maltese militia, Spanish and Italian troops, behind the walls of Birgu and Senglea, two promontories on the Grand Harbour, with Fort St Elmo guarding its mouth.
      - The fleet anchored at Marsaxlokk, and the Ottomans chose to take St Elmo first, to open Marsamxett harbour to their ships. From late May guns on Mount Sciberras pounded the small fort to rubble, but Valette ferried in fresh men each night. The corsair Turgut Reis (Dragut) was mortally wounded by a cannon shot. St Elmo fell on 23 June; almost all of its more than 1,500 defenders were killed, and the Ottomans had lost perhaps 6,000 men. Mustafa is said to have floated the bodies of knights across the harbour, and Valette to have answered by firing the heads of Turkish prisoners from his guns.
    facts:
      - [Ottoman fleet arrives, 18 May 1565]
      - [Fall of Fort St Elmo, 23 June 1565]
      - [Defenders, "about 500 knights and 6,000 soldiers"]
    markers:
      - kind: event
        name: Marsaxlokk
        date: 20 May 1565
        text: The Ottoman fleet anchored in this bay in the south-east of the island. The army set up its main camp at Marsa, at the head of the Grand Harbour.
        lonlat: [14.545, 35.842]
      - kind: taken
        side: ot
        name: Fort St Elmo
        date: 23 June 1565
        text: The star-shaped fort at the tip of Mount Sciberras held for a month against continuous bombardment and repeated assaults. Nine knights were taken alive by corsairs.
        lonlat: [14.519, 35.902]
        lp: t
      - kind: held
        side: kn
        name: Birgu and Senglea
        date: May–June 1565
        text: Valette directed the defence from Birgu, at the foot of Fort St Angelo, and sent men across the harbour to St Elmo by night.
        lonlat: [14.52, 35.887]
        lp: b
      - kind: held
        side: kn
        name: Mdina
        date: 1565
        text: The old walled capital in the centre of the island stayed in Maltese and Christian hands, and its cavalry raided the Ottoman lines.
        lonlat: [14.403, 35.886]
        lp: l
    arrows:
