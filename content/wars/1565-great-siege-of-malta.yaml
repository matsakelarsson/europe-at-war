    name: Knights of St John and the Maltese
    polities: [malta]
    ink: red
    moves: Moves by the Knights and their allies
    success: Success for the Knights and their allies
  - id: sp
    name: Spain and Sicily
    polities: [spain, sicily]
    ink: gold
    moves: Spanish relief
    success: Spanish success
  - id: ot
