steps:
  - title: Szigetvár
    date: 1565–1568
    when: "1565"
    borders: "1568-02-17"
    countries: [hu, hr, ro, at, tr]
    body:
      - After Ferdinand I died in 1564, fighting broke out over the borderlands between his son Maximilian II and John Sigismund of Transylvania, and in 1565 the imperial general Lazarus von Schwendi took Tokaj. Suleiman, over seventy and ill, set out on his last campaign in May 1566. He meant to attack Eger, but turned on Szigetvár after its captain, Nikola Zrinski, raided an Ottoman camp at Siklós. From 5 August the Ottoman army, led in practice by the grand vizier Sokollu Mehmed Pasha, besieged the fortress, held by Zrinski with about 2,300 Croatian and Hungarian soldiers. Further east Pertev Pasha took Gyula on 2 September.
      - The defenders lost the new town and the old town and withdrew into the castle, which mines and fire slowly destroyed. On 6 September Suleiman died in his tent; Sokollu kept his death secret for weeks so that the army would not break up. On 8 September, with the castle in flames, Zrinski led his last few hundred men out and was killed, and almost all of the garrison died; more than 20,000 Ottomans are thought to have died in the siege. Maximilian’s army lay at Győr and did not move. In February 1568 the Treaty of Adrianople made an eight-year truce, renewed for many years after.
    facts:
      - [Siege of Szigetvár, "5 August – 8 September 1566, Ottoman victory"]
      - [Garrison, "about 2,300, almost all killed"]
      - [Treaty of Adrianople, "17 February 1568, an eight-year truce"]
