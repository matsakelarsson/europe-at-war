notes:
  - Dates are Julian. Sources differ by a day on the date of Suleiman’s death (5–7 September) and on the date of Zrinski’s last sortie (7 or 8 September 1566).
  - Zrinski is a hero to both Croats and Hungarians, who know him as Nikola Šubić Zrinski and Zrínyi Miklós. His great-grandson, the poet and general Miklós Zrínyi, wrote the epic The Siege of Sziget about him, and Ivan Zajc’s opera Nikola Šubić Zrinski (1876) is one of the best known Croatian operas.
