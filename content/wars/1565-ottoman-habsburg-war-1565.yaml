id: ottoman-habsburg-war-1565
name: Ottoman–Habsburg War (1565–1568)
start: "1565"
end: "1568-02-17"
tier: B
summary: A short war between the Habsburg emperor Maximilian II and the Ottoman Empire, allied with John Sigismund of Transylvania. Suleiman the Magnificent led his last campaign in 1566 and died in his tent during the siege of Szigetvár, whose defender, Nikola Zrinski, fell in a final sortie; the Ottomans also took Gyula. The Treaty of Adrianople of 1568 began a quarter of a century of uneasy peace in Hungary.
