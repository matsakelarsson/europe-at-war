  - title: The Japanese of Cagayan
    date: 1581–1582
    when: "1582"
    borders: "1582"
    countries: [ph, es, jp]
    body:
      - Japanese traders and raiders had long visited northern Luzon. In 1581 the authorities in Manila heard that a band of Japanese wokou, the armed traders and raiders of the East Asian seas, had built a settlement near Aparri at the mouth of the Cagayan river, which the Spaniards called Puerto de Japón. Their leader, called Tay Fusa in the Spanish sources, traded weapons for gold and raided the villages around. In 1582 Governor Gonzalo Ronquillo de Peñalosa sent the veteran captain Juan Pablo de Carrión, about 70 years old, with a galley, a carrack and five smaller ships, about 40 soldiers, most of them born in the Americas, and Tagalog, Kapampangan and Visayan auxiliaries.
      - Off Cape Bojeador Carrión’s galley fought a Japanese junk with some 200 men aboard and took it after a hard fight. In the Cagayan river he scattered a flotilla of smaller boats, then entrenched his men near the settlement, which was held by 600 to 1,000 men. The wokou attacked the Spanish earthworks several times and were beaten off by arquebus fire and pikes, whose shafts Carrión had greased so that they could not be seized; in the end they abandoned the settlement and sailed away. Some Japanese historians hold that Tay Fusa withdrew without a battle. Carrión founded the town of Nueva Segovia (today’s Lal-lo) on the river, and the Cagayan valley came under Spanish rule.
    facts:
      - [Carrión’s force, "about 40 soldiers and Filipino auxiliaries"]
      - [Wokou settlement abandoned, "1582"]
    markers:
      - kind: battle
        side: es
        name: Puerto de Japón (Aparri)
