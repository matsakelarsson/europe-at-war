notes:
  - The conquest is known almost entirely from Spanish letters, reports and chronicles, written by the conquerors and the friars; the peoples of the islands left no written accounts of it, and their side comes down through Spanish records and later oral tradition. The Spaniards called the Muslims of the islands Moros, after the Moors of Spain, and the Spanish word “pacification” in the sources stands for conquest and submission. Dates and numbers differ between the chronicles.
  - Several rulers of Manila bore the name Sulayman, and later writers often confused Rajah Sulayman of Manila, who lived past 1574, with the Kapampangan chief, now called Tarik Sulayman, who was killed at Bangkusay in 1571. The war against Brunei in 1578 and the wars against the sultanates of Mindanao and Sulu are told in their own stories.
