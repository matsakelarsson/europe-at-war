  - title: Salcedo in the north
    date: 1572–1574
    when: "1572"
    borders: "1574"
    countries: [ph, es]
    body:
      - Legazpi died in Manila on 20 August 1572 and was succeeded by Guido de Lavezaris. In May 1572 Juan de Salcedo, now 23, sailed north from Manila with 45 Spaniards and many Filipino auxiliaries along the coasts of Pangasinan and the Ilocos. On the way they drove off three Japanese boats. At Vigan, whose chief resisted them, they occupied the town, and Salcedo left 30 men there and went on around the northern tip of Luzon to the mouth of the Cagayan river, where he survived an ambush, then made peace with the people. He returned to Manila three months later with gold and was granted Vigan and estates in the Ilocos.
      - "The Spanish system of encomiendas, grants of the tribute of a district to a conqueror, followed the conquest everywhere: the islanders paid tribute in kind or in gold, worked on Spanish ships and forts, and were gathered by the friars into Christian towns. By 1574 the Ilocos coast, Pangasinan and the Bicol peninsula, where the Spaniards had first landed in 1567, were under Spanish rule, and so were the remaining Visayan islands, Leyte, Samar, Negros and Bohol. In the mountains of the Cordillera, in Zambales and in the Muslim south, the Spaniards were resisted for much longer."
    facts:
      - [Death of Legazpi, "20 August 1572"]
      - [Salcedo’s northern voyage, "May – August 1572, 45 Spaniards"]
