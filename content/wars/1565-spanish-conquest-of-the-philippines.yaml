  - title: The Tondo conspiracy, and Mindanao’s north coast
    date: 1587–1597
    when: "1588"
    borders: "1597"
    countries: [ph, es, bn, mx]
    body:
      - The datus who had come to terms with Spain lost much of their power under Spanish rule, above all over their dependants, whose tribute now went to the Spaniards. In 1587 a group of Tagalog and Kapampangan nobles, led by Agustin de Legazpi of Tondo, the son-in-law of the sultan of Brunei, and his cousin Martin Pangan, met at Tambobong (Malabon) and swore to drive out the Spaniards. They sought arms and men from a Japanese Christian captain, Juan Gayo, and help from Brunei, and in 1588 sent Magat Salamat of Tondo as envoy to the sultan. On the way, in the Calamianes islands, he confided in Antonio Surabao, a servant of a Spanish encomendero, who betrayed the plan. The leaders were hanged and their property seized, and others were fined or exiled to New Spain, among the first Filipinos to settle in Mexico.
      - In the south, Legazpi had already granted the gold-producing districts of Butuan and Caraga on Mindanao’s north coast as encomiendas in 1571, but Spanish rule there began only with the arrival of Jesuit missionaries in 1596; the first church at Butuan was dedicated on 8 September 1597. The sultanates of Maguindanao, Lanao and Sulu remained independent, and the Spanish wars against them, begun in 1578, went on for three centuries.
    facts:
      - [Tondo conspiracy discovered, "1588"]
      - [Jesuit mission at Butuan, "1596"]
    markers:
      - kind: event
        side: ph
        name: Tondo
        date: 1587–1588
        text: The home of Agustin de Legazpi and Magat Salamat, leaders of the conspiracy of the Tagalog nobility.
        lonlat: [120.967, 14.617]
        lp: l
      - kind: event
