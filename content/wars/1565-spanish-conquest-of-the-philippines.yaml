steps:
  - title: Legazpi in the Visayas
    date: February – June 1565
    when: "1565-04"
    borders: "1565-06-04"
    countries: [ph, es, mx]
    body:
      - Spain had claimed the islands since Magellan’s voyage of 1521, which ended with his death at Mactan, but later expeditions had failed, and by the Treaty of Zaragoza of 1529, in which Spain recognised Portugal’s claim to the Moluccas, the islands lay on the Portuguese side of the line. Philip II, after whom the islands were named, sent a new expedition from New Spain to settle them and to find a way back across the Pacific. Miguel López de Legazpi sailed from Barra de Navidad in November 1564 with four or five ships and, by different counts, 380 to 500 men, more than half of them born in Mexico, with the Augustinian friar and navigator Andrés de Urdaneta. They sighted Samar on 13 February 1565. Earlier Portuguese slave raids made many islanders wary of strangers, and the Spaniards had to look for allies. On Samar Legazpi made a blood compact with Datu Urrao, and in March, off Bohol, he sealed peace with the chiefs Sikatuna and Sigala by the same rite, the sandugo, each side drinking wine mixed with the other’s blood.
      - On 27 April 1565 the fleet anchored at Cebu, the largest trading town of the Visayas, whose ruler Rajah Tupas was the nephew of Humabon, Magellan’s ally of 1521. Tupas refused to submit and his warriors resisted, but they were driven off by the Spanish guns and withdrew inland, and much of the town was burned. In one of the houses the Spaniards found an image of the Christ Child (the Santo Niño), believed to be the one Magellan gave to the queen of Cebu in 1521, and they named their settlement the Villa del Santísimo Nombre de Jesús. On 1 June Urdaneta sailed north-east to find the westerly winds that carried his ship back to Mexico, opening the route of the Manila galleons, and on 4 June 1565 Tupas signed a treaty that recognised Spanish sovereignty.
    facts:
      - [Spanish expedition, "380–500 men, half of them from Mexico"]
      - [Cebu taken, "27 April 1565"]
      - [Treaty with Tupas, "4 June 1565"]
