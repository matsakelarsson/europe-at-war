  - title: Limahong
    date: November 1574 – August 1575
    when: "1574-12"
    borders: "1575-08-04"
    countries: [ph, es, cn, jp]
    body:
      - Limahong (Lin Feng), a Chinese captain whom the Ming fleets had driven from the coasts of Guangdong and Fujian, decided to make Luzon his base after he learned from a captured Chinese merchant ship that Manila had a garrison of only about 200 soldiers. His fleet of 60 to 70 junks carried, by Spanish accounts, about 2,000 fighting men, many of them Japanese under a commander the Spaniards called Sioco, as well as sailors and some 1,500 settlers with their families, tools and seed. The Spaniards and the Ming court called him a pirate; his fleet carried settlers as well as fighters, and he meant to stay. On 30 November 1574 a force of 400 to 600 men landed at Parañaque and marched on Manila; it killed Martín de Goiti and his men in his house outside the walls, but the alarm was raised and it was driven back. Juan de Salcedo, who had seen the fleet pass the Ilocos coast, arrived with 50 arquebusiers by night. On 3 December Limahong’s whole force attacked; it burned the church of San Agustín and broke into the defences, but was thrown back with heavy losses.
      - During the attacks the towns of Navotas, Tondo and Mindoro rose against the Spaniards, led by Rajah Sulayman and Lakandula, whose properties Lavezaris had seized after Legazpi’s death; Sulayman’s son was among those killed. Some accounts say instead that Lakandula helped the Spaniards against Limahong. Salcedo and the friar Gerónimo Marín ended the rising by negotiation, and both rulers made peace again; Lakandula died in 1575.
      - Limahong sailed north to Pangasinan and built a fortified town on the Agno river delta. On 23 March 1575 Salcedo sailed from Manila with 256 Spaniards and about 2,500 Filipino allies in 59 vessels; at the Agno he burned the Chinese ships and laid siege to Limahong’s fort. After four months, during which Limahong built new boats inside his walls, he broke out on 4 August 1575 and escaped to sea. A Ming officer, Wang Wanggao, who had come to look for him, took Spanish envoys, among them friars, back to Fujian, opening official contacts between Spanish Manila and Ming China.
    facts:
      - [Attacks on Manila, "30 November and 3 December 1574"]
      - [Limahong’s fleet, "60–70 junks, about 2,000 fighting men"]
      - [Siege of Pangasinan, "March – August 1575"]
