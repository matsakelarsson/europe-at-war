id: spanish-conquest-of-the-philippines
name: Spanish conquest of the Philippines
start: "1565-02-13"
end: "1597"
tier: A
summary: "The conquest that made the islands the Spanish Philippines, from Miguel López de Legazpi’s landing in 1565 to the occupation of Mindanao’s north coast in the 1590s. The islands were not one state but many: hundreds of independent communities (barangays and their federations) ruled by datus and rajahs, among them the trading towns of Cebu, Manila and Tondo, the last two with close ties to the Muslim sultanate of Brunei. Sent by Philip II from New Spain with a few hundred Spanish and Mexican soldiers, Legazpi made blood compacts with chiefs in Bohol, took Cebu from Rajah Tupas in April 1565, withstood a Portuguese blockade in 1568, and moved to Panay in 1569. In 1570 his captain Martín de Goiti fought Rajah Sulayman at Manila, and in 1571 Legazpi returned with Visayan allies, made peace with the rulers of Manila and Tondo, defeated the Kapampangan fleet at Bangkusay and founded Spanish Manila. In the next few years Juan de Salcedo and Goiti brought most of the coasts of Luzon under Spanish rule, often through agreements with local chiefs, sometimes by force. The Chinese captain Limahong’s attack on Manila in 1574, Japanese settlers in Cagayan in 1582 and a conspiracy of the Tagalog nobility in 1587–1588 were defeated, and missions reached northern Mindanao in the 1590s. For Spain it was the beginning of an empire in Asia that lasted until 1898 and of the galleon trade between Manila and Acapulco; for the peoples of the islands it brought tribute, forced labour and Christianity. The Muslim sultanates of Mindanao and Sulu, which Spain fought from 1578, were never fully conquered."
countries: [ph, es, mx, pt, cn, jp]
