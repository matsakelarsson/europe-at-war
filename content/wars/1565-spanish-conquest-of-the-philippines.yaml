  - title: The Portuguese blockade, and the move to Panay
    date: 1568–1570
    when: "1569"
    borders: "1569"
    countries: [ph, es, pt]
    body:
      - The Portuguese regarded the islands as theirs under the Treaty of Zaragoza. In 1568 a Portuguese fleet from the Moluccas blockaded Cebu to force the Spaniards out; the small colony held on, and the Portuguese withdrew when typhoid broke out on their ships. Food was short at Cebu, where the Spaniards depended on what the islanders would sell or could be made to give, and the settlers were few. In March 1568 Tupas was baptised as Felipe, under pressure by most accounts, and he died later that year.
      - In 1569 Legazpi moved his headquarters to Panay, a richer island, and founded a settlement on the Panay river, now Roxas in Capiz. From there his grandson Juan de Salcedo, who had arrived from Mexico in 1567, was sent in 1570 against the Muslim towns of Mindoro, whose raids on Panay the Spaniards wanted to stop, and destroyed their forts on the islands of Ilin and Lubang. Thousands of Visayan warriors from Panay and Cebu joined the Spanish expeditions that followed.
    facts:
      - [Portuguese blockade of Cebu, "1568"]
      - [Spanish base moved to Panay, "1569"]
