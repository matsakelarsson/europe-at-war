  - title: Manila and Bangkusay
    date: May 1570 – November 1571
    when: "1571-06"
    borders: "1571-06-24"
    countries: [ph, es]
    body:
      - Legazpi had heard of a rich, walled Muslim town on Luzon, Maynila, on the Pasig river delta, ruled by the elderly Rajah Matanda and his nephew and heir Rajah Sulayman, with Tondo, across the river, ruled by Lakandula. In May 1570 Martín de Goiti and Salcedo sailed north with about 120 Spaniards and many Visayan warriors and anchored at Cavite. Talks began well, but Sulayman refused to accept Spanish sovereignty, saying that the Tagalogs would not submit. On 24 May, when the Spanish ships fired their guns, Sulayman’s men took it for an attack and fought. The fighting was short, and the town burned, whether set on fire by Goiti’s men, as the Spanish accounts say, or by its defenders as they withdrew. Knowing he was outnumbered, Goiti returned to Panay.
      - In 1571 Legazpi himself came north with about 280 Spaniards and Mexicans and 600 Visayan allies. The people of Maynila burned their town and withdrew, then came to terms; Rajah Matanda, Sulayman and Lakandula made peace with Legazpi, who on 19 May declared Manila a city. But the Kapampangan chief of Macabebe, whose name is not recorded and whom later writers call Tarik Sulayman, refused to submit and gathered a fleet of about forty war boats (caracoas) from Macabebe and Hagonoy. On 3 June 1571 Goiti met it in the channel of Bangkusay off Tondo; the Spaniards lashed their boats together, let the enemy surround them and broke the fleet with gunfire, and the chief of Macabebe was killed. On 24 June Legazpi set up the city council of Spanish Manila and ordered a walled city, later called Intramuros, to be built. In the following months Goiti brought the towns of Pampanga and Bulacan, among them Lubao, Betis, Calumpit and Malolos, under Spanish rule.
    facts:
      - [First battle of Manila, "24 May 1570"]
      - [Battle of Bangkusay, "3 June 1571"]
      - [Spanish Manila founded, "24 June 1571"]
