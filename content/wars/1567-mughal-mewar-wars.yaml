steps:
  - title: Chittorgarh
    date: October 1567 – 1569
    when: "1567-10-23"
    borders: "1567-10-23"
    countries: [in]
    body:
      - "By the 1560s the young emperor Akbar had won over most Rajput rulers, beginning with an alliance and marriage with the Kachhwaha house of Amber in 1562. Rana Udai Singh II of Mewar, heir to the oldest and proudest Rajput line, would not submit, and had sheltered Akbar’s enemies. In October 1567 Akbar marched on Chittorgarh, Mewar’s hilltop fortress capital. Udai Singh withdrew to the hills to the west, where he had founded a new capital, Udaipur, and left the fort to the Rathore chief Jaimal of Merta and Patta of Kelwa."
      - "The siege began on 23 October. Thousands of labourers dug covered approach trenches, called sabats, and mines towards the walls; two mines blew a breach in December, but the defenders sealed it. On the night of 22 February 1568 Akbar shot and killed Jaimal with a musket as he directed repairs to the walls. That night the women of the fort died in a jauhar, and at dawn the Rajputs came out to fight to the death. After the fort fell, Akbar’s troops killed many of the people who had taken refuge in it; the usual figure, from the Mughal chronicles, is 30,000."
      - "Akbar followed up with the capture of Ranthambore, surrendered by its Hada chief in March 1569, and Kalinjar later that year. Udai Singh held out in the hills until his death in 1572."
    facts:
      - [Siege of Chittorgarh, "23 October 1567 – 23 February 1568, Mughal victory"]
      - [Jaimal Rathore, "shot by Akbar, 22 February 1568"]
      - [Ranthambore surrenders, "March 1569"]
