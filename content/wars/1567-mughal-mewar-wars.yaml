id: mughal-mewar-wars
name: Mughal–Mewar wars
start: "1567-10-23"
end: "1615-02"
tier: B
summary: "The wars between the Mughal emperors Akbar and Jahangir and the Rajput kingdom of Mewar, the one major Rajput state that refused to accept Mughal overlordship. Akbar stormed Mewar’s fortress capital, Chittorgarh, in February 1568 after a four-month siege, and many of its people were killed. Rana Udai Singh II and then his son Pratap Singh fought on from the Aravalli hills. A Mughal army under Raja Man Singh of Amber defeated Pratap at Haldighati in 1576, but he escaped and in later years won back most of Mewar except Chittorgarh. Under Jahangir, repeated campaigns, the last led by Prince Khurram, the future Shah Jahan, exhausted the country, and in February 1615 Pratap’s son Amar Singh I made peace on honourable terms: he was excused from attending the Mughal court and Chittorgarh was returned, though it was not to be refortified."
countries: [in]
sides:
  - id: mug
    name: Mughal Empire
    polities: [mughals]
    ink: green
    moves: Mughal moves
    success: Mughal success
  - id: mew
