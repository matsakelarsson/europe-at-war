notes:
  - Dates before 1582 are in the Julian calendar, as the sources give them.
  - Mughal court histories (Abu’l-Fazl, Badauni, who fought at Haldighati) and the later bardic traditions of Mewar tell the story very differently, and Rana Pratap has become a figure of Rajput and Indian national memory. Numbers in both traditions are unreliable; where modern historians differ, both figures are given.
  - Many Rajput rulers, among them the Kachhwahas of Amber and later the Rathores of Marwar, fought in the Mughal armies against Mewar.
