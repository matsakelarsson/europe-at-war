  - title: Haldighati and Pratap’s war
    date: 1576–1597
    when: "1576-06-18"
    borders: "1576-06-18"
    countries: [in]
    body:
      - "Udai Singh’s son Pratap Singh, rana from 1572, turned away several Mughal embassies. In 1576 Akbar sent an army under Raja Man Singh of Amber, with Asaf Khan, into the hills. On 18 June 1576 (21 June according to Badauni, who fought in the battle) Pratap met it at the Haldighati pass near Gogunda. His force, perhaps 3,000 horsemen with some 400 Bhil archers by Badauni’s count, included an Afghan contingent under Hakim Khan Sur; the Mughal army may have numbered 5,000 to 10,000. After a hard fight in the narrow ground the Mewar army was driven off. Pratap was wounded but escaped, while his kinsman Jhala Man covered the retreat and was killed. Mughal accounts give about 500 Mewar and 150 Mughal dead."
      - "Haldighati was a Mughal victory, but not the end of the war. The Mughals occupied Gogunda and in 1578 took the fortress of Kumbhalgarh, yet Pratap kept up a war of raids from the hills, supported by Bhil and Rajput clansmen, and moved his capital to Chavand in the south. After 1585 Akbar’s attention turned to the north-west, and by the time of his death on 19 January 1597 Pratap had recovered most of Mewar, though not Chittorgarh or Mandalgarh. Mewar tradition celebrates a victory at Dewair in 1582 as the turning point."
    facts:
