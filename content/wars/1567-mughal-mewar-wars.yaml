  - title: Jahangir and the peace of 1615
    date: 1606–1615
    when: "1606"
    borders: "1615-02"
    countries: [in]
    body:
      - "Pratap’s son Amar Singh I faced a new emperor, Jahangir, who sent one army after another into Mewar: under his son Parviz in 1606, under Mahabat Khan in 1608 and under Abdullah Khan from 1609, who took Chavand but was beaten at Ranakpur in 1611. In 1613 Jahangir moved his court to Ajmer and gave the command to his son Prince Khurram, the future Shah Jahan. Khurram’s troops occupied the valleys, set up posts throughout the hills and laid waste the countryside, and by the end of 1614 Mewar was exhausted."
      - "Amar Singh sent envoys, and in February 1615 he met Khurram at Gogunda. The terms were generous. The rana accepted Mughal overlordship but was excused from attending the court in person; his heir Karan Singh went instead and received a high rank. Mewar sent 1,500 horsemen to serve the emperor and was not required to give a daughter in marriage to the Mughal family. Chittorgarh and the other occupied lands were returned, on condition that the fort was not repaired. Jahangir had statues of Amar Singh and Karan Singh set up in the palace gardens at Agra."
    facts:
      - [Battle of Ranakpur, "1611, Mewar victory"]
      - [Peace agreed at Gogunda, "February 1615"]
