steps:
  - title: Iconoclasm, Alba and Heiligerlee
    date: 1566–1568
    when: "1566-08-10"
    borders: "1568-07-21"
    countries: [nl, be, fr, de, es]
    body:
      - In the 1560s the seventeen provinces of the Netherlands were governed from Brussels for Philip II of Spain, who enforced harsh laws against Protestants and sidelined the great nobles. In April 1566 several hundred lesser nobles petitioned the regent, Margaret of Parma, to suspend the heresy laws; a courtier is said to have called them beggars (gueux), and they took up the name. That summer Calvinist preachers drew huge crowds, and on 10 August a sermon near Steenvoorde in Flanders was followed by an attack on a church. Within weeks the Beeldenstorm, the iconoclastic fury, had stripped hundreds of churches of their images from Flanders to Groningen.
      - Philip sent the Duke of Alba, who reached Brussels in August 1567 with about 10,000 veteran troops. His Council of Troubles condemned almost 9,000 people, most in their absence, and about 1,000 were executed, among them the counts of Egmont and Horn. William of Orange, the greatest noble of the Netherlands, had withdrawn to Germany and raised armies. His brother Louis of Nassau beat a royal force at Heiligerlee on 23 May 1568, usually taken as the start of the war, but Alba destroyed Louis’s army at Jemmingen on the Ems on 21 July, and William’s invasion of Brabant that autumn ran out of money.
    facts:
      - [Battle of Heiligerlee, "23 May 1568, rebel victory"]
      - [Battle of Jemmingen, "21 July 1568, Spanish victory"]
      - [Council of Troubles, "almost 9,000 condemned, about 1,000 executed"]
    markers:
      - kind: event
        name: Steenvoorde
        date: 10 August 1566
        text: After an open-air Calvinist sermon, a crowd broke into a nearby church and smashed its images, the start of the Beeldenstorm.
        lonlat: [2.581, 50.811]
      - kind: event
        name: Antwerp
        date: 20 August 1566
        text: Iconoclasts wrecked the interior of the great Church of Our Lady, now the cathedral, and dozens of other churches and convents in the city.
        lonlat: [4.401, 51.221]
      - kind: battle
        side: es
        name: Battle of Oosterweel
        date: 13 March 1567
        text: Government troops destroyed a Calvinist force outside Antwerp, while William of Orange kept the city gates shut to prevent a rising inside.
        lonlat: [4.385, 51.244]
        lp: t
      - kind: event
        side: es
        name: Brussels
        date: 5 June 1568
        text: The counts of Egmont and Horn, Catholic nobles who had opposed Philip’s policies, were beheaded on the Grand Place.
        lonlat: [4.353, 50.847]
      - kind: battle
        side: nl
        name: Battle of Heiligerlee
        date: 23 May 1568
        text: Louis of Nassau’s army, raised in East Frisia, beat the royal stadtholder of Friesland, the Count of Aremberg, who was killed, as was Louis’s brother Adolf.
        lonlat: [7.003, 53.157]
        lp: b
      - kind: battle
        side: es
        name: Battle of Jemmingen
        date: 21 July 1568
        text: Alba trapped Louis’s army against the Ems, and thousands of rebels were killed or drowned.
        lonlat: [7.385, 53.266]
    arrows:
      - side: es
        label: Alba
        phase: 1
        via: [[6.13, 49.61], [5.2, 50.2], [4.4, 50.8]]
      - side: nl
        label: Louis of Nassau
        phase: 2
        via: [[7.206, 53.367], [7.12, 53.25], [7.03, 53.17]]
      - side: es
        label: Alba
        phase: 3
        via: [[6.57, 53.21], [6.95, 53.2], [7.36, 53.26]]
  - title: Brill and the revolt of Holland
    date: 1572
    when: "1572-04-01"
    borders: "1572-12-01"
    countries: [nl, be, es]
    body:
      - Alba’s demand for a permanent sales tax, the Tenth Penny, turned even loyal towns against him. On 1 April 1572 the Sea Beggars, Calvinist privateers sailing under William’s commission who had just been expelled from English ports, seized the little port of Brill at the mouth of the Maas. Flushing rose within days, and over the summer most towns of Holland and Zeeland let the rebels in, often under pressure from armed Calvinist minorities. In July the States of Holland met at Dordrecht and recognised William as their stadtholder.
      - The rebels counted on France. Louis of Nassau surprised Mons in Hainaut on 24 May with Huguenot help, and William invaded Brabant from Germany. But the Massacre of St Bartholomew in Paris on 24 August killed the Huguenot leaders and any hope of French aid. Mons surrendered to Alba in September, and his son Don Fadrique marched north to punish the rebel towns. Mechelen was sacked in October, and many of the people of Zutphen and Naarden were massacred in November and December. William withdrew to Holland, resolved, he wrote, to make his grave there.
    facts:
      - [Capture of Brill, "1 April 1572"]
      - [Massacre of St Bartholomew, "24 August 1572, Paris"]
      - [Siege of Mons, "May–September 1572, retaken by Alba"]
    markers:
      - kind: taken
        side: nl
        name: Brill
        date: 1 April 1572
        text: About 600 Sea Beggars under the Lord of Lumey took the undefended port. Its capture is still celebrated every 1 April in Brielle.
        lonlat: [4.167, 51.9]
        lp: l
      - kind: taken
        side: nl
        name: Flushing
        date: April 1572
        text: The town rose against the government, giving the rebels control of the mouth of the Scheldt.
        lonlat: [3.567, 51.45]
        lp: l
      - kind: event
        side: nl
        name: Dordrecht
        date: July 1572
        text: The first free meeting of the States of Holland recognised William of Orange as stadtholder and voted money for the war.
        lonlat: [4.678, 51.796]
      - kind: siege
        side: es
        name: Mons
        date: May–September 1572
        text: Louis of Nassau held the town with French Huguenots until William’s relief army was driven off, then surrendered on terms.
        lonlat: [3.95, 50.45]
      - kind: taken
        side: es
        name: Mechelen
        date: October 1572
        text: Don Fadrique’s troops sacked the town for days because it had admitted a garrison of William’s.
        lonlat: [4.481, 51.028]
      - kind: taken
        side: es
        name: Zutphen
        date: November 1572
        text: After the rebel garrison fled, Spanish troops killed many of the townspeople.
        lonlat: [6.195, 52.14]
      - kind: taken
        side: es
        name: Naarden
        date: 1 December 1572
        text: The town surrendered, but the soldiers killed most of the inhabitants and burned it.
        lonlat: [5.162, 52.295]
    arrows:
      - side: nl
        label: Sea Beggars
        phase: 1
        via: [[1.6, 51.2], [2.8, 51.65], [4.05, 51.9]]
      - side: nl
        label: William
        phase: 2
        via: [[6.0, 51.2], [5.0, 50.85], [4.05, 50.48]]
      - side: es
        label: Don Fadrique
        phase: 3
        via: [[4.48, 51.05], [5.86, 51.84], [6.17, 52.12]]
      - side: es
        phase: 4
        via: [[6.17, 52.15], [5.39, 52.16], [5.16, 52.3], [4.68, 52.38]]
    areas:
      - style: occupied
        side: nl
        label: Held by the rebels, end of 1572 (approximate)
        atoms: [NL-NH, NL-ZH, NL-ZE!]
  - title: Haarlem, Leiden and the Pacification of Ghent
    date: 1573–1576
    when: "1573"
    borders: "1576-11-08"
    countries: [nl, be, es]
    body:
      - Haarlem held out for seven months. When hunger forced it to surrender on 13 July 1573, the townspeople bought themselves free, but most of the garrison was executed. Alkmaar then beat off Don Fadrique after the rebels flooded the land around his camp, the Sea Beggars beat a royal fleet on the Zuiderzee in October, and Alba was recalled. His successor, Luis de Requesens, destroyed a relief army at Mookerheyde on 14 April 1574, where Louis and Henry of Nassau were killed. But Leiden, besieged from May, was saved on 3 October when the rebels cut the dykes and sailed flat-bottomed boats across the flooded fields.
      - Unpaid for years, the Spanish troops mutinied again and again. Requesens died in March 1576, leaving no one in charge, and on 4 November mutineers sacked Antwerp, the richest city in northern Europe; at least 7,000 people were killed in the “Spanish Fury”. Four days later the States General of the loyal provinces and the rebels of Holland and Zeeland signed the Pacification of Ghent. They agreed to drive out the Spanish troops together and to suspend the heresy laws, leaving the question of religion for later.
    facts:
      - [Siege of Haarlem, "December 1572 – 13 July 1573"]
      - [Relief of Leiden, "3 October 1574"]
      - [Pacification of Ghent, "8 November 1576"]
    markers:
      - kind: siege
        side: es
        name: Haarlem
        date: December 1572 – July 1573
        text: After a seven-month siege the town surrendered. Its governor was beheaded and most of the garrison killed; the townspeople paid 240,000 guilders to escape a sack.
        lonlat: [4.633, 52.383]
        lp: l
      - kind: held
        side: nl
        name: Alkmaar
        date: August–October 1573
        text: The defenders beat off an assault, and the rebels opened the sluices to flood the land around the Spanish camp. “Victory begins at Alkmaar”, runs the Dutch saying.
        lonlat: [4.75, 52.63]
        lp: l
      - kind: naval
        side: nl
        name: Battle on the Zuiderzee
        date: 11 October 1573
        text: Rebel ships beat the royal fleet and captured its commander, the Count of Bossu.
        lonlat: [5.167, 52.55]
      - kind: battle
        side: es
        name: Battle of Mookerheyde
        date: 14 April 1574
        text: Requesens’s army destroyed the relief force of Louis of Nassau by the Maas near Mook; Louis and his brother Henry were among the dead.
        lonlat: [5.9, 51.75]
      - kind: held
        side: nl
        name: Leiden
        date: May – 3 October 1574
        text: After four months of hunger the Sea Beggars reached the town across the floods, and the besiegers fled. The next year William founded Leiden University.
        lonlat: [4.483, 52.15]
        lp: l
      - kind: siege
        side: es
        name: Zierikzee
        date: 1575–1576
        text: Spanish troops waded through the shallows to the island of Duiveland in September 1575 and starved the town into surrender in July 1576, but then mutinied for their pay.
        lonlat: [3.916, 51.65]
        lp: l
      - kind: taken
        side: es
        name: Spanish Fury
        date: 4 November 1576
        text: Mutinous soldiers sacked Antwerp for three days. At least 7,000 people died; an English witness put the toll at 17,000.
        lonlat: [4.403, 51.213]
      - kind: treaty
        name: Pacification of Ghent
        date: 8 November 1576
        text: The provinces agreed to expel the Spanish troops and to suspend the persecution of Protestants.
        lonlat: [3.725, 51.054]
        lp: b
    arrows:
      - side: nl
        label: Louis of Nassau
        phase: 1
        via: [[6.45, 51.2], [6.15, 51.5], [5.93, 51.73]]
      - side: nl
        label: Sea Beggars
        phase: 2
        via: [[4.48, 51.92], [4.53, 52.04], [4.5, 52.14]]
    areas:
      - style: occupied
        side: nl
        label: Held by the rebels, 1574 (approximate)
        atoms: [NL-NH, NL-ZH, NL-ZE!]
  - title: The Unions of Arras and Utrecht
    date: 1577–1581
    when: "1577-02-12"
    borders: "1581-07-26"
    countries: [nl, be, fr, es]
    body:
      - The new governor, Philip’s half-brother Don John of Austria, accepted the Pacification in February 1577 and sent the Spanish troops away, but soon seized the citadel of Namur and called them back. On 31 January 1578 he and his nephew Alexander Farnese, later Duke of Parma, routed the army of the States General at Gembloux. Don John died that October, and Parma, a skilled soldier and diplomat, took over. The rebels were divided too. Calvinists seized power in Ghent, Brussels and other cities, alarming the Catholic nobles and the Walloon provinces.
      - On 6 January 1579 Artois, Hainaut and the town of Douai formed the Union of Arras, and in May they made peace with Philip on condition that only Catholicism be allowed. On 23 January Holland, Zeeland, Utrecht, Guelders and the Groningen countryside formed the Union of Utrecht, later joined by Friesland, Overijssel, Drenthe and the great cities of Flanders and Brabant. Parma took Maastricht by storm in June after a four-month siege. Philip outlawed William in 1580, and on 26 July 1581 the States General renounced Philip as their sovereign in the Act of Abjuration.
    facts:
      - [Battle of Gembloux, "31 January 1578, Spanish victory"]
      - [Union of Utrecht, "23 January 1579"]
      - [Act of Abjuration, "26 July 1581"]
    markers:
      - kind: battle
        side: es
        name: Battle of Gembloux
        date: 31 January 1578
        text: Don John’s cavalry caught the States army on the march and scattered it.
        lonlat: [4.75, 50.55]
      - kind: treaty
        side: es
        name: Union of Arras
        date: 6 January 1579
        text: The Walloon provinces of Artois and Hainaut and the town of Douai united to defend the Catholic faith; their peace with Philip followed in May.
        lonlat: [2.78, 50.292]
      - kind: treaty
        side: nl
        name: Union of Utrecht
        date: 23 January 1579
        text: The northern provinces agreed to act together in war, taxation and foreign affairs “as if they were one province”. The union became the constitution of the Dutch Republic.
        lonlat: [5.122, 52.091]
      - kind: siege
        side: es
        name: Maastricht
        date: March–June 1579
        text: Parma’s army stormed the city on 29 June after a four-month siege, and many of the inhabitants were killed in the sack.
        lonlat: [5.683, 50.85]
      - kind: event
        side: nl
        name: Act of Abjuration
        date: 26 July 1581
        text: Meeting in The Hague, the States General declared that a prince who oppressed his subjects could be deposed, and renounced Philip II.
        lonlat: [4.31, 52.08]
        lp: l
    areas:
      - style: outline
        side: nl
        label: Union of Utrecht, northern provinces (approximate)
        atoms: [NL-NH, NL-ZH, NL-ZE!, NL-UT, NL-GE, NL-OV, NL-FR, NL-GR, NL-DR]
      - style: outline
        side: es
        label: Union of Arras (approximate)
        atoms: [FR-62!, FR-59!, FR-59~flandre, BE-WHT]
  - title: Parma’s reconquest and the fall of Antwerp
    date: 1582–1585
    when: "1582"
    borders: "1585-08-17"
    countries: [be, nl, gb, es]
    body:
      - With Spanish troops back from 1582, Parma took the rebel towns of Flanders and Brabant one by one, by siege, blockade and generous terms. The States had invited Francis, Duke of Anjou, brother of the French king, to be their sovereign, but his attempt to seize Antwerp by force, the “French Fury” of 17 January 1583, failed and discredited him. On 10 July 1584 William of Orange was shot dead in his house in Delft by Balthasar Gérard, a Catholic who hoped for the reward Philip had offered. Ypres, Bruges and Ghent fell to Parma in 1584, Brussels and Mechelen in 1585.
      - Parma cut Antwerp off from the sea with a fortified bridge of boats across the Scheldt. In April 1585 the defenders sent fireships packed with explosives, the “hellburners”, against it, killing hundreds of soldiers, but the bridge was repaired, and the city surrendered on 17 August. Protestants were given four years to leave, and of about 100,000 inhabitants only some 40,000 remained; many merchants and craftsmen moved north to Amsterdam and Middelburg. Alarmed, Elizabeth I of England agreed in the Treaty of Nonsuch to send several thousand soldiers under the Earl of Leicester, bringing England openly into the war with Spain.
    facts:
      - [William of Orange assassinated, "10 July 1584, Delft"]
      - [Fall of Antwerp, "17 August 1585"]
      - [Treaty of Nonsuch, "August 1585, England allies with the States"]
    markers:
      - kind: event
        name: Delft
        date: 10 July 1584
        text: Balthasar Gérard shot William on the stairs of his residence, the Prinsenhof. The bullet holes can still be seen in the wall.
        lonlat: [4.359, 52.012]
        lp: l
      - kind: taken
        side: es
        name: Ghent
        date: 17 September 1584
        text: The Calvinist city, heart of the revolt in Flanders, surrendered to Parma after a long blockade.
        lonlat: [3.725, 51.054]
        lp: b
      - kind: taken
        side: es
        name: Brussels
        date: 10 March 1585
        text: The hungry city surrendered on terms after a blockade of several months.
        lonlat: [4.353, 50.847]
      - kind: siege
        side: es
        name: Antwerp
        date: July 1584 – 17 August 1585
        text: Parma’s bridge across the Scheldt cut the city off from the sea. Its surrender ended Antwerp’s golden age.
        lonlat: [4.4, 51.218]
    arrows:
      - side: es
        label: Parma
        phase: 1
        via: [[3.39, 50.61], [3.6, 50.85], [3.72, 51.03], [4.3, 51.2]]
      - side: en
        label: Leicester
        phase: 2
        via: [[1.4, 51.36], [2.5, 51.5], [3.52, 51.45]]
  - title: Maurice’s campaigns and Nieuwpoort
    date: 1588–1600
    when: "1588"
    borders: "1600-07-02"
    countries: [nl, be, de, gb, es]
    body:
      - In 1588 Parma’s army waited on the Flemish coast to cross to England, but the Spanish Armada, beaten off Gravelines and scattered by storms, never collected it, and Dutch flyboats blockaded the shallow coast. Philip then sent Parma into France against Henry IV, which gave the Dutch a breathing space. William’s son Maurice of Nassau and his cousin William Louis drilled their small, regularly paid army in volley fire and siege work. In March 1590 soldiers hidden in a peat barge took Breda; Zutphen, Deventer and Nijmegen fell in 1591, Steenwijk and Coevorden in 1592, and Groningen in July 1594.
      - In January 1597 Maurice’s cavalry routed a Spanish force at Turnhout, and that summer he took the towns along the eastern border, from Rheinberg to Lingen. In 1598, shortly before his death, Philip II handed the Netherlands to his daughter Isabella and her husband, Archduke Albert. In 1600 the States General sent Maurice into Flanders to take Dunkirk, the base of the privateers who preyed on Dutch shipping. Albert caught him on the beach at Nieuwpoort on 2 July; the Dutch and English won a hard-fought battle, but Maurice had to withdraw, and Dunkirk was never taken.
    facts:
      - [Capture of Breda, "4 March 1590"]
      - [Battle of Turnhout, "24 January 1597, Dutch victory"]
      - [Battle of Nieuwpoort, "2 July 1600, Dutch and English victory"]
    markers:
      - kind: naval
        side: en
        name: Battle of Gravelines
        date: 8 August 1588
        text: After fireships drove the Armada from its anchorage off Calais, the English fleet broke its formation. The Spanish ships fled north around Scotland and Ireland, losing many in storms.
        lonlat: [2.0, 51.1]
        lp: l
      - kind: taken
        side: nl
        name: Breda
        date: 4 March 1590
        text: About 70 soldiers hidden under the turf in a peat barge were taken into the castle and opened it to Maurice.
        lonlat: [4.776, 51.589]
      - kind: siege
        side: nl
        name: Nijmegen
        date: October 1591
        text: Maurice took the city after a short bombardment, ending a year of rapid conquests along the rivers.
        lonlat: [5.862, 51.847]
      - kind: siege
        side: nl
        name: Coevorden
        date: 1592
        text: The fortress, key to the north-east, surrendered to Maurice in September.
        lonlat: [6.75, 52.667]
      - kind: siege
        side: nl
        name: Groningen
        date: May–July 1594
        text: Its capture brought the city and its countryside into the Union of Utrecht and secured the north-east for the Republic.
        lonlat: [6.567, 53.219]
      - kind: battle
        side: nl
        name: Battle of Turnhout
        date: 24 January 1597
        text: Maurice’s cavalry caught a retreating Spanish army on the heath and routed it.
        lonlat: [4.9, 51.27]
      - kind: battle
        side: nl
        name: Battle of Nieuwpoort
        date: 2 July 1600
        text: Fought on the beach and in the dunes as the tide went out. Albert was beaten, but Maurice’s expedition had failed.
        lonlat: [2.738, 51.156]
        lp: b
    arrows:
      - side: nl
        label: Maurice
        phase: 2
        via: [[3.75, 51.28], [3.5, 51.18], [3.0, 51.17], [2.79, 51.15]]
      - side: nl
