  - title: France joins, and the Downs
    date: 1635–1639
    when: "1635-02-08"
    borders: "1639-10-21"
    countries: [be, nl, fr, de, gb, es]
    body:
      - In February 1635 the Republic allied with France to conquer and divide the Spanish Netherlands. In May a French army beat the Spaniards at Les Avins and joined Frederick Henry, but their armies sacked Tienen and then failed before Leuven, and the people of the south rallied to the new governor, Philip IV’s brother, the Cardinal-Infante Ferdinand. Spanish troops even seized the Dutch fortress of Schenkenschans on the Rhine in July 1635; it took nine months to win back. Frederick Henry retook Breda in October 1637, but a Dutch attack on Antwerp ended in defeat at Kallo in June 1638.
      - With French armies astride the Spanish Road through Alsace, Spain tried to reinforce Flanders by sea. In September 1639 a fleet under Antonio de Oquendo, about 50 warships and 30 transports carrying some 9,000 soldiers, was attacked in the Channel by Maarten Tromp and took shelter in the Downs off the Kent coast, in neutral English waters. Most of the troops were ferried to Dunkirk in small, fast ships, but on 21 October Tromp attacked with fireships. About ten Spanish ships were captured or destroyed and a dozen more ran aground. Spain never again sent a great fleet into the North Sea.
    facts:
