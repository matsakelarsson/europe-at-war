  - title: ’s-Hertogenbosch and Maastricht
    date: 1626–1633
    when: "1627"
    borders: "1632-08-22"
    countries: [nl, de, be, es]
    body:
      - Frederick Henry, who earned the name “taker of towns”, began with Groenlo in 1627. In September 1628 Piet Hein of the Dutch West India Company captured the Spanish silver fleet off Matanzas in Cuba, and the booty helped pay for the next campaign. In April 1629 Frederick Henry surrounded ’s-Hertogenbosch, a fortress city guarded by marshes, with miles of siege lines, and drained the water around it. A Spanish and imperial army struck into the Veluwe and took Amersfoort in August, but the Dutch surprised Wesel, its supply base, on 19 August, and ’s-Hertogenbosch surrendered on 14 September.
      - In September 1631 a Spanish flotilla carrying troops to invade Zeeland was destroyed among the islands at the Slaak. The next summer Frederick Henry marched up the Maas, taking Venlo and Roermond and, on 22 August 1632, Maastricht, while nobles in the Spanish Netherlands plotted with him. The loyal provinces called their own States General and opened peace talks, which failed in 1633. Frederick Henry took Rheinberg that year, and the war in the north settled into a stalemate along the rivers.
    facts:
      - [Siege of ’s-Hertogenbosch, "30 April – 14 September 1629"]
