  - title: Breda
    date: 1621–1625
    when: "1621-04-09"
    borders: "1625-06-05"
    countries: [nl, be, de, es]
    body:
      - The truce expired in April 1621, as the Thirty Years’ War was spreading through Germany. Spain’s chief minister, the Count-Duke of Olivares, hoped economic war would bring better terms. Dutch ships were banned from Spanish ports, and privateers from Dunkirk took hundreds of Dutch merchantmen and fishing boats. On land Spain took the Dutch-held fortress of Jülich in February 1622, but Spinola failed before Bergen op Zoom, which the Dutch supplied by water and relieved in October.
      - In August 1624 Spinola laid siege to Breda, the Nassau family’s town in Brabant, surrounding it with lines too strong to break. Maurice died in The Hague on 23 April 1625, aged 57, while his armies tried in vain to relieve it, and his half-brother Frederick Henry succeeded him. Breda surrendered on 5 June 1625 after eleven months, and its garrison marched out with full honours, a scene Diego Velázquez painted about ten years later as The Surrender of Breda. It was the high point of Spanish fortunes in the later war.
    facts:
      - [Siege of Bergen op Zoom, "July–October 1622, relieved"]
      - [Siege of Breda, "28 August 1624 – 5 June 1625"]
      - [Maurice of Nassau dies, "23 April 1625"]
