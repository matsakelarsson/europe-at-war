id: eighty-years-war
name: Eighty Years’ War
start: "1568-05-23"
end: "1648-05-15"
tier: A
summary: The revolt of the Netherlands against Philip II of Spain, which grew out of Calvinist iconoclasm and the Duke of Alba’s repression into a long war between Spain and the northern provinces, interrupted by the Twelve Years’ Truce of 1609–1621. The Peace of Münster in 1648 recognised the independence of the Dutch Republic, while the southern provinces stayed under Spanish rule.
countries: [nl, be, es, fr, de, gb, lu]
sides:
  - id: nl
    name: Dutch rebels and the Dutch Republic
    polities: [dutch-republic]
    ink: orange
    moves: Dutch moves
    success: Dutch success
  - id: es
    name: Spain and the royal Netherlands
    polities: [spain, habsburg-netherlands]
    ink: gold
    moves: Spanish and royal moves
    success: Spanish and royal success
  - id: en
    name: England (allied with the Dutch 1585–1604)
    polities: [england]
    ink: red
    moves: English moves
    success: English success
  - id: fr
    name: France (allied with the Dutch from 1635)
    polities: [france]
    ink: navy
    moves: French moves
    success: French success
notes:
  - The war is usually dated from the Battle of Heiligerlee on 23 May 1568 to the ratification of the Peace of Münster on 15 May 1648. It paused during the Twelve Years’ Truce of 1609–1621, and from 1621 it merged with the Thirty Years’ War and, from 1635, the Franco-Spanish War.
  - Dates are New Style (Gregorian). The Spanish Netherlands, Holland and Zeeland adopted it in 1582–1583, but several northern provinces and England kept the Julian calendar, ten days behind, until 1700 or later.
  - Places are named in the forms usual in English, with the Dutch name where it differs, such as Brill (Den Briel), Flushing (Vlissingen) and ’s-Hertogenbosch (Den Bosch). The “States General” was the assembly of the provinces’ delegates; the “States” of a province was its own assembly.
