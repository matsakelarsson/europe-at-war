  - title: The Peace of Münster
    date: 1640–1648
    when: "1640"
    borders: "1648-05-15"
    countries: [nl, be, es, de]
    body:
      - In 1640 Catalonia and Portugal rose against Philip IV, and Spain, fighting France on several fronts, could no longer hope to win in the Netherlands. The Dutch were tiring of the war too. Frederick Henry took Sas van Gent in 1644 and Hulst in 1645, winning the strip of Flanders south of the Scheldt, but Holland’s merchants now feared a powerful France more than a weakened Spain. Peace talks opened at Münster in Westphalia, beside the congress that was ending the Thirty Years’ War, and the Dutch envoys made peace without waiting for France.
      - The treaty was signed on 30 January 1648 and sworn in Münster’s town hall on 15 May. Spain recognised the seven United Provinces as free and sovereign states. The Republic kept the lands it had conquered in Brabant, Flanders and around Maastricht, ruled directly by the States General as the Generality Lands. The Scheldt stayed closed to shipping, to Amsterdam’s benefit and Antwerp’s cost, and the Dutch kept their conquests in Asia and the Americas. Frederick Henry, who had died in March 1647, did not see the peace.
    facts:
      - [Peace of Münster, "signed 30 January 1648, sworn 15 May 1648"]
      - [Hulst taken, "November 1645"]
      - [Recognised, "the seven United Provinces, as free and sovereign states"]
