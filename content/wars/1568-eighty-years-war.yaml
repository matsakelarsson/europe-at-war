  - title: Ostend and the Twelve Years’ Truce
    date: 1601–1609
    when: "1601-07-05"
    borders: "1609-04-09"
    countries: [be, nl, de, gb, es]
    body:
      - The siege of Ostend, the last rebel foothold on the Flemish coast, began on 5 July 1601 and became one of the longest and bloodiest of the age. Supplied by sea, the garrison was relieved in turns while the besiegers dug and stormed in the dunes; more than 100,000 people may have been killed, wounded or died of disease. The Genoese commander Ambrogio Spinola finally took the ruins on 20 September 1604, but Maurice had meanwhile captured Sluis, a better harbour. England, under James I, had made peace with Spain in the Treaty of London that August.
      - Spinola carried the war across the great rivers in 1605–1606, taking Oldenzaal, Lingen, Groenlo and Rheinberg, but Spain’s money ran out. In April 1607 a Dutch fleet under Jacob van Heemskerk destroyed a Spanish fleet in the bay of Gibraltar, and that autumn the Spanish crown suspended its payments. On 9 April 1609 the two sides signed the Twelve Years’ Truce in Antwerp. Spain treated the United Provinces as free states over which it claimed no authority, though it did not formally recognise their independence, and each side kept what it held.
    facts:
      - [Siege of Ostend, "5 July 1601 – 20 September 1604"]
      - [Battle of Gibraltar, "25 April 1607, Dutch naval victory"]
      - [Twelve Years’ Truce, "signed 9 April 1609 at Antwerp"]
