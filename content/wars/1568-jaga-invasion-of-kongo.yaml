notes:
  - "Almost everything known about the invasion comes from Portuguese and Italian writers, above all Pigafetta’s Relatione del reame di Congo (1591), written from Duarte Lopes’s account two decades later, and from Jesuit letters. Their dates disagree: the invasion is put in 1568 or 1567, the Portuguese landing in 1570, 1571 or 1574, and the final expulsion in the early or mid-1570s. Some historians see the invasion as linked to a dispute over Álvaro’s succession; others doubt it."
  - "The Jaga of the Kongo story should not be confused with the Imbangala, the warrior bands south of the Kwanza River who fought for and against the Portuguese in Angola from about 1600 (see the Portuguese–Ndongo wars)."
