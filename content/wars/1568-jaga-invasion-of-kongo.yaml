id: jaga-invasion-of-kongo
name: Jaga invasion of Kongo
start: "1568"
end: "1575"
tier: C
summary: "The invasion of the Kingdom of Kongo by warriors the Portuguese called “Jaga”, and the Portuguese expedition that restored King Álvaro I. In the traditional account, taken from the book that Kongo’s ambassador Duarte Lopes gave to Filippo Pigafetta in Rome (1591), the Jaga crossed into Kongo from the east in 1568, soon after Álvaro I came to the throne, routed his army and sacked the capital, Mbanza Kongo. The king and his court fled to an island in the Congo River, where, Pigafetta wrote, hunger and disease killed many and starving refugees sold one another as slaves to Portuguese traders from São Tomé for food. Álvaro appealed to King Sebastian of Portugal, who sent about 600 soldiers, most of them from São Tomé, under Francisco de Gouveia Sottomaior, the island’s governor. With them and Kongo’s own forces Álvaro took back his capital and drove the invaders out by the mid-1570s; the Jaga remained a power on the eastern frontier and later served Kongo’s rival kings as mercenaries. The price of the rescue was Portuguese influence: Álvaro let Paulo Dias de Novais found a colony at Luanda in 1575–1576, on land that Kongo claimed, and Portuguese priests gained a voice at court. Who the Jaga were is debated. Older writers linked them with the Imbangala of Angola, whom the Portuguese also called Jaga; Joseph Miller (1972) showed that the two were different groups, and many historians have identified the invaders with people from the Kwango valley later known as the Yaka. John Thornton (2022), using newly found documents, among them a petition by the Jesuit João Ribeiro Gaio, who served with the Portuguese relief army from 1571 to 1575, argues that the invasion had begun by 1567, under King Bernardo I, whom a contemporary testimony says the Jaga killed; that the invaders were a small, skilled army that came through the empire of Mwene Muji, near Lake Mai-Ndombe, and had “no domicile nor a king of their own”, rather than a migrating people; and that they were expelled around 1575."
