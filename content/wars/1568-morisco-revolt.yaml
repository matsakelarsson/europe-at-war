    moves: Morisco moves
    success: Morisco success
  - id: sp
    name: Spain
    polities: [spain]
    ink: gold
    moves: Spanish moves
    success: Spanish success
notes:
  - Dates are Julian, as usual for the period. It is also called the War of the Alpujarras or the second rebellion of the Alpujarras, after the rising of 1499–1501.
  - The three main chronicles, by Luis del Mármol Carvajal, Ginés Pérez de Hita and Diego Hurtado de Mendoza, were all written from the Christian side; there is no contemporary account by the Moriscos. Numbers of rebels and dead are uncertain.
  - The Moriscos of all Spain were expelled in 1609–1614.
