id: morisco-revolt
name: Rebellion of the Alpujarras
start: "1568-12-24"
end: "1571-03"
tier: B
summary: The revolt of the Moriscos of the Kingdom of Granada, descendants of Muslims forced to convert to Christianity, against Philip II’s ban on their language, dress and customs. Beginning in the Alpujarras, the mountain valleys south of the Sierra Nevada, it was fought with great cruelty on both sides and put down by Don John of Austria; afterwards about 80,000 of Granada’s Moriscos were deported to other parts of Castile.
countries: [es, dz]
