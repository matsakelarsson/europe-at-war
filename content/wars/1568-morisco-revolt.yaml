steps:
  - title: Christmas Eve 1568
    date: December 1568 – 1569
    when: "1568-12-24"
    borders: "1569-10-01"
    countries: [es]
    body:
      - Granada’s Muslims had been made to convert after the revolt of 1499–1501, but most of the Moriscos, as the converts were called, still spoke Arabic and kept their own dress and customs. Philip II’s Pragmatic Sanction of 1 January 1567 banned all of these, and appeals to suspend it failed. On Christmas Eve 1568 the mountain villages of the Alpujarras rose in arms and proclaimed a young nobleman, Fernando de Válor, king under the name Aben Humeya. An attempt to raise the Albaicín, Granada’s Morisco quarter, the same night failed.
      - The rebels killed priests and many other Old Christians in the villages, often with great cruelty. In January 1569 the Marquis of Mondéjar marched in from Granada through the snow and broke the rising in the western Alpujarras, while the Marquis of Los Vélez attacked from Almería. Their troops, mostly unpaid volunteers, plundered, killed and enslaved, and in March a crowd murdered more than a hundred Morisco prisoners in Granada’s jail. The revolt flared up again and spread east to the Almanzora valley and west towards Málaga. In October Aben Humeya was murdered by rivals, and his cousin Aben Aboo took his place.
    facts:
      - [Pragmatic Sanction, 1 January 1567]
      - [Rising in the Alpujarras, 24–25 December 1568]
      - [Rebels under arms, "about 4,000 in January 1569, perhaps 25,000 by 1570"]
    markers:
      - kind: event
        side: sp
        name: Albaicín
        date: 24–25 December 1568
        text: Farax Aben Farax entered Granada’s Morisco quarter with a band of mountain men, but few townspeople joined him, and the capital never rose.
        lonlat: [-3.59, 37.18]
      - kind: taken
        side: sp
        name: Órgiva
        date: January 1569
        text: Mondéjar forced the broken bridge of Tablate and relieved the Christians besieged in Órgiva’s tower, then crossed into the high Alpujarras.
        lonlat: [-3.42, 36.9]
        lp: l
      - kind: taken
        side: sp
        name: Juviles
        date: January 1569
        text: One of the rebel strongholds in the high Alpujarras. Many of its people were sold as slaves in Granada.
        lonlat: [-3.22, 36.95]
        lp: t
      - kind: event
        name: Laujar de Andarax
        date: October 1569
        text: Aben Humeya was killed here by rivals among the rebel leaders. His cousin Diego López, Aben Aboo, was chosen king in his place.
        lonlat: [-2.88, 36.99]
    arrows:
      - side: sp
