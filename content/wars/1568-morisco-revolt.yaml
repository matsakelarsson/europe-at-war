        side: mor
        label: The Alpujarras, heart of the revolt
        polygon: [[-3.55, 36.86], [-3.45, 37.02], [-3.1, 37.06], [-2.75, 37.06], [-2.55, 36.99], [-2.75, 36.88], [-3.2, 36.83]]
  - title: Don John and the deportations
    date: 1570–1571
    when: "1570-01"
    borders: "1570-11-01"
    countries: [es, dz]
    body:
      - Philip II replaced Mondéjar with his half-brother, Don John of Austria, aged twenty-two, and in October 1569 declared a war “of fire and blood”, letting soldiers keep the plunder and captives they took. A few thousand volunteers and some arms came from Algiers and Morocco, but the Ottomans sent their fleets against Tunis and Cyprus instead. In January 1570 Don John took the field with about 12,000 men and besieged Galera, a hill town near Huéscar. When it fell on 10 February most of its people were killed or enslaved, and the town was razed and its ground sown with salt.
      - Serón fell in March, and in the spring Don John and the Duke of Sessa swept through the Alpujarras from both ends, burning crops and villages. Thousands of Moriscos surrendered; others fled to North Africa or hid in caves, where many were suffocated by fires lit at the entrances. From November 1570 the crown deported the Moriscos of Granada, rebels or not, to towns across Castile. About 80,000 were marched away in winter, and many died on the road. Aben Aboo was killed by his own men in a cave near Bérchules in March 1571, and settlers from the north were brought in to farm the emptied villages.
    facts:
      - [Fall of Galera, 10 February 1570]
      - [Deportations from Granada, "from November 1570, about 80,000 people"]
      - [Death of Aben Aboo, March 1571]
    markers:
      - kind: taken
        side: sp
        name: Galera
        date: 10 February 1570
        text: The hill town held out for two months. Don John ordered it destroyed after its capture.
        lonlat: [-2.55, 37.74]
      - kind: taken
        side: sp
        name: Serón
        date: March 1570
        text: A rebel stronghold in the Almanzora valley, taken in Don John’s advance from the north-east.
        lonlat: [-2.5, 37.34]
      - kind: event
        name: Granada
        date: November 1570
        text: Moriscos from across the kingdom were gathered in churches and marched under escort to Córdoba, Toledo and other towns of Castile; those of the Almería region were shipped to Seville.
        lonlat: [-3.6, 37.18]
      - kind: event
        name: Bérchules
        date: March 1571
        text: Aben Aboo, the last rebel king, was killed in a cave nearby by his own followers, who hoped for pardon.
        lonlat: [-3.18, 36.97]
    arrows:
      - side: sp
        label: Don John
        phase: 1
        via: [[-3.6, 37.18], [-3.14, 37.3], [-2.77, 37.49], [-2.57, 37.72]]
