  - title: Azuchi and the wars on every front
    date: 1576–1581
    when: "1578"
    borders: "1580-09-01"
    countries: [jp]
    body:
      - In 1576 Nobunaga began building a new castle at Azuchi, on the shore of Lake Biwa between Gifu and Kyoto, with a richly painted keep of several storeys finished in 1579, the first of the great castles of the period; below it he founded a town with a free market. From there his generals fought on several fronts at once. In the north, Uesugi Kenshin of Echigo turned against him, took the castle of Nanao in Noto and on 3 November 1577 defeated an Oda army under Shibata Katsuie at the Tedori river in Kaga. Kenshin was preparing a new campaign when he died in April 1578, and the Uesugi fell into a war over his succession.
      - In the west, Nobunaga sent Hashiba Hideyoshi against the Mōri, who supported the Hongan-ji and sheltered the exiled shogun. Hideyoshi’s campaigns in Harima, Tajima and Inaba were long sieges. Miki castle was starved into surrender in 1580 after almost two years, and Tottori castle in 1581 after its defenders had been reduced to famine. Akechi Mitsuhide conquered Tanba; the revolt of Araki Murashige in Settsu was put down in 1579, and hundreds of his family members and retainers were executed. In 1580 the Hongan-ji finally gave up its fortress at Osaka, and in 1581 Oda armies overran the province of Iga, whose leagues of local warriors had defeated an earlier invasion.
    facts:
