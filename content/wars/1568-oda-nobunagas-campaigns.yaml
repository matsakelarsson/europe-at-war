  - title: Shingen marches west
    date: November 1572 – May 1573
    when: "1573-01-25"
    borders: "1573-01-25"
    countries: [jp]
    body:
      - By 1572 Yoshiaki had built a wide alliance against Nobunaga, with the Azai and Asakura, the Hongan-ji, the Miyoshi and, above all, Takeda Shingen of Kai, the most feared general in Japan. In the tenth month of 1572 (November), having made peace with the Hōjō and waited for the snows to close the passes against Uesugi Kenshin, Shingen marched south with about 30,000 men into Tōtōmi, the province of Nobunaga’s ally Tokugawa Ieyasu, while other Takeda columns entered Mikawa and Mino. He took Futamata castle after a siege of about two months, and in January 1573 moved west past Ieyasu’s castle at Hamamatsu.
      - Ieyasu, with about 8,000 of his own men and 3,000 sent by Nobunaga, followed the Takeda army onto the plateau of Mikatagahara north of the castle, and on 25 January 1573, late in the afternoon, Shingen turned and attacked him. The Tokugawa and Oda army was routed with heavy losses and Ieyasu escaped to Hamamatsu; according to a later story he left the gates open and the fires burning, and the Takeda did not risk an assault. Shingen went on into Mikawa and took Noda castle early in 1573, but he was ill; his army turned back, and he died on the way home in May 1573. The Takeda tried to keep his death secret, but the danger to Nobunaga from the east had passed for the moment.
    facts:
