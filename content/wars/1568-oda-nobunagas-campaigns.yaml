steps:
  - title: From Owari to Kyoto
    date: 1560–1568
    when: "1568-10"
    borders: "1568-11-01"
    countries: [jp]
    body:
      - Oda Nobunaga inherited his father’s lands in Owari in 1551 and spent his first years as lord fighting his own relatives for control of the province. His victory over Imagawa Yoshimoto at Okehazama in 1560 removed the threat from the east, and in 1562 he made an alliance with Matsudaira Motoyasu, later Tokugawa Ieyasu, who had broken away from the Imagawa in Mikawa; it lasted for the rest of Nobunaga’s life. He then turned north against the Saitō of Mino, and in 1567 took their castle of Inabayama, which he renamed Gifu and made his seat. From that year he used a seal reading “Tenka fubu”, usually translated as “the realm under military rule”. In these years he married his sister Oichi to Azai Nagamasa of northern Ōmi, whose lands lay on the road to Kyoto.
      - In 1565 the shogun Ashikaga Yoshiteru was killed in Kyoto by the Miyoshi and by Matsunaga Hisamichi, the son of Matsunaga Hisahide, and his brother Yoshiaki, a monk, escaped and looked for a lord who would restore him. In 1568 he came to Nobunaga. In the autumn Nobunaga marched on Kyoto with a large army, joined by Tokugawa and Azai troops. The Rokkaku of southern Ōmi, who barred the road, abandoned their castle of Kannonji after Nobunaga stormed its outworks, and the Miyoshi forces withdrew from the capital. Nobunaga entered Kyoto in the ninth month and the next month had Yoshiaki appointed the fifteenth Ashikaga shogun. He turned down the high offices the grateful shogun offered him, asking instead for control of the trading towns of Sakai, Ōtsu and Kusatsu.
    facts:
      - [Inabayama taken and renamed Gifu, "1567"]
      - [Nobunaga enters Kyoto, "ninth month of 1568"]
      - [Yoshiaki becomes shogun, "tenth month of 1568"]
