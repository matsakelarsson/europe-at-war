id: oda-nobunagas-campaigns
name: Oda Nobunaga’s campaigns
start: "1568"
end: "1582-06-21"
tier: A
summary: "The wars by which Oda Nobunaga, lord of Owari and Mino, made himself master of central Japan between 1568 and 1582, the first stage of the unification of the country after a century of civil war. In 1568 he marched on Kyoto and installed Ashikaga Yoshiaki as shogun, but within two years he faced a coalition of the Azai and Asakura, the Miyoshi, the Ikkō-ikki of the Hongan-ji, the monks of Mount Hiei, Takeda Shingen and finally the shogun himself. He burned the monastery of Enryaku-ji in 1571, survived the advance of Shingen, who beat his ally Tokugawa Ieyasu at Mikatagahara in 1573, drove Yoshiaki out of Kyoto in the same year and destroyed the Asakura and Azai. In 1575 Oda and Tokugawa musketeers behind palisades broke the Takeda army at Nagashino. From his new castle at Azuchi, Nobunaga’s generals then fought the Uesugi in the north, the Mōri in the west and the Hongan-ji at Osaka, which surrendered in 1580. In the spring of 1582 his armies destroyed the Takeda; weeks later Nobunaga was killed at Honnō-ji by his general Akechi Mitsuhide."
