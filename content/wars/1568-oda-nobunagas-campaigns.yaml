notes:
  - Japanese dates are in the lunar calendar. Where English sources give a Western equivalent it is in the Julian calendar, which Europe still used until October 1582; otherwise the lunar month is given. Some English sources print lunar dates as if they were Western ones, for example 11 March 1582 for the death of Takeda Katsuyori, which fell on the 11th day of the third month.
  - Nobunaga’s seal “Tenka fubu”, used from 1567, is usually translated as “the realm under military rule”; some historians read “tenka” here as meaning the capital region around Kyoto rather than all Japan.
  - The main source for Nobunaga’s wars is the Shinchō Kōki, the life of Nobunaga written by his retainer Ōta Gyūichi. Many famous details, such as the three alternating ranks of musketeers at Nagashino, come from later works and are doubted by historians.
  - The war against the Ishiyama Hongan-ji, the Honnō-ji Incident and the battles of Okehazama and Kawanakajima have their own entries.
