  - title: Mount Hiei
    date: autumn 1570 – September 1571
    when: "1571-09-30"
    borders: "1571-09-30"
    countries: [jp]
    body:
      - In the autumn of 1570, while Nobunaga was fighting the Miyoshi on the edge of Osaka, the Ishiyama Hongan-ji, head temple of the Jōdo Shinshū, called on its followers, the Ikkō-ikki, to rise against him, the start of a war that lasted ten years. At the same time the Azai and Asakura marched down the west shore of Lake Biwa towards Kyoto, killed Nobunaga’s brother Oda Nobuharu and his commander Mori Yoshinari near Usayama castle, and took refuge on Mount Hiei, where the monks of the great Tendai monastery of Enryaku-ji let them in. Nobunaga hurried back and blockaded the mountain for months, while the Ikkō-ikki of Nagashima killed another of his brothers, Oda Nobuoki, in Owari. At the end of the year the shogun and the emperor arranged a truce.
      - Nobunaga did not forgive the monks. On 30 September 1571 his army, put at 30,000 men, surrounded Mount Hiei, burned the town of Sakamoto at its foot and the lakeside town of Katata, and climbed the mountain, burning the temple halls and killing monks, lay people, women and children who had fled there. Contemporary estimates of the dead range from about 1,500, in a letter of the Jesuit Luís Fróis, to 3,000–4,000 in the diary of the courtier Yamashina Tokitsugu, and the Shinchō Kōki speaks of several thousand. Archaeologists who have excavated on the mountain suggest that many of its buildings had already fallen out of use before the attack, so the destruction may have been less complete than the chronicles say. Nobunaga gave the lands below the mountain to Akechi Mitsuhide, who built a castle at Sakamoto.
    facts:
      - [Hongan-ji rises, "autumn 1570"]
      - [Burning of Mount Hiei, "30 September 1571"]
      - [Dead, "estimates range from 1,500 to 4,000"]
