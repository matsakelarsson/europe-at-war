  - title: The end of the Takeda
    date: March – June 1582
    when: "1582-04"
    borders: "1582-06-20"
    countries: [jp]
    body:
      - In 1582 Nobunaga turned on the Takeda. Early in the year Kiso Yoshimasa, Katsuyori’s brother-in-law in southern Shinano, went over to Nobunaga, and in the spring Oda armies under Nobunaga’s heir Oda Nobutada invaded Shinano from Mino while Tokugawa Ieyasu advanced from Suruga and the Hōjō from the east. Takeda castles surrendered one after another; only Takatō, held by Katsuyori’s brother Nishina Morinobu, resisted, and it was stormed on the 2nd day of the third month.
      - Katsuyori set fire to his unfinished new castle at Shinpu and fled east with his family, hoping to find refuge with Oyamada Nobushige at Iwadono castle, but Oyamada turned against him. Trapped by Oda troops at Tano, near Mount Tenmoku, on the 11th day of the third month, Katsuyori, his son Nobukatsu and their last followers took their own lives, and the house of Takeda, which had ruled Kai for centuries, came to an end. Nobunaga divided its lands among his generals, giving Suruga to Ieyasu, and toured the conquered provinces before returning to Azuchi.
      - By the early summer of 1582 Nobunaga ruled, directly or through his vassals and allies, most of central Japan, from Kōzuke and Kai in the east to Harima and Inaba in the west. His son Nobutaka was preparing an invasion of Shikoku, and Hideyoshi was besieging the Mōri castle of Takamatsu in Bitchū. On 21 June 1582, staying at the temple of Honnō-ji in Kyoto on his way west, Nobunaga was attacked by his own general Akechi Mitsuhide and died in the burning temple.
    facts:
