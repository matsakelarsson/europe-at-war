  - title: Kanegasaki and Anegawa
    date: 1570
    when: "1570-07-30"
    borders: "1570-07-30"
    countries: [jp]
    body:
      - Relations with the new shogun soon soured. In 1569 and 1570 Nobunaga issued rules restricting Yoshiaki’s right to act without his approval, and Yoshiaki began to look for allies against him. In the fourth month of 1570 Nobunaga invaded Echizen to punish Asakura Yoshikage, who had ignored his summons to Kyoto, and took the fortress of Kanegasaki. Then news came that Azai Nagamasa, long allied with the Asakura, had turned against him and threatened to cut off his retreat. Nobunaga escaped with a few followers through the mountains of Kutsuki to Kyoto, while Kinoshita Hideyoshi, the later Toyotomi Hideyoshi, and others held off the pursuers.
      - Nobunaga came back with Tokugawa Ieyasu and on 30 July 1570 met the armies of the Azai and Asakura on the Ane river, south of the Azai castle of Odani. Accounts give the Oda and Tokugawa about 28,000 men and their enemies about 18,000. Reliable details of the fighting are few, since most of the famous stories come from books written long afterwards; the Azai and Asakura were driven back with the loss of perhaps 1,700 men. But Odani held out, and Nobunaga’s enemies were far from beaten.
    facts:
      - [Retreat from Kanegasaki, "fourth month of 1570"]
      - [Battle of Anegawa, "30 July 1570"]
      - [Strength, "about 28,000 Oda and Tokugawa, 18,000 Azai and Asakura"]
