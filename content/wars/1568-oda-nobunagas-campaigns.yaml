  - title: Nagashima and Nagashino
    date: 1574–1575
    when: "1575-06-28"
    borders: "1575-06-28"
    countries: [jp]
    body:
      - With Shingen dead and the shogun gone, Nobunaga dealt with his enemies one at a time. In 1574 he destroyed the Ikkō-ikki of Nagashima, blockading their river islands with a fleet and burning the last defenders inside their stockades, and in 1575 he retook Echizen from the leagues that had seized it after the fall of the Asakura; tens of thousands of people were killed in the two campaigns. In the east, Shingen’s son Takeda Katsuyori took the Tokugawa castle of Takatenjin in 1574, and in 1575 laid siege to Nagashino, a small castle in Mikawa held by Okudaira Sadamasa, who had deserted the Takeda for Ieyasu. The garrison of about 500 held out, and one of its men, Torii Sune’emon, slipped out to call for help; he was caught on his way back and killed before the walls after shouting to the defenders that help was coming.
      - Nobunaga and Ieyasu came to the rescue with about 38,000 men and took up position on the low hills of Shitarabara, west of the castle, behind a line of wooden palisades along the Rengo stream. On 28 June 1575 Katsuyori, leaving about 3,000 men at the castle, attacked with about 12,000. The Takeda charges broke down before the palisades and the fire of the Oda musketeers, of whom the Shinchō Kōki counts about 1,000; the later figure of 3,000 guns firing in three alternating ranks is regarded as an embellishment. By early afternoon the Takeda army was broken. Katsuyori escaped, but he had lost, by most estimates, about 10,000 men, among them many of his father’s leading generals, such as Baba Nobuharu, Yamagata Masakage and Naitō Masatoyo, and the Takeda never recovered their strength.
    facts:
      - [Fall of Nagashima, "1574"]
      - [Battle of Nagashino, "28 June 1575"]
      - [Strength, "about 38,000 Oda and Tokugawa, 15,000 Takeda"]
      - [Takeda losses, "about 10,000 (estimates)"]
