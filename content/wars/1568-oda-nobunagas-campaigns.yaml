  - title: The fall of the shogunate, the Asakura and the Azai
    date: April – September 1573
    when: "1573-08"
    borders: "1573-09-30"
    countries: [jp]
    body:
      - In the spring of 1573, counting on Shingen, Yoshiaki openly broke with Nobunaga. Nobunaga came to Kyoto, burned the upper city to put pressure on the shogun, and forced him into a truce. In the seventh month Yoshiaki rose again and fortified himself in Makishima castle, on the river south of Kyoto; Nobunaga’s army crossed the river and stormed its outworks, and Yoshiaki surrendered. Nobunaga spared his life but drove him out of the capital in August 1573. Yoshiaki kept the title of shogun for another fifteen years, living from 1576 under the protection of the Mōri, but the Muromachi shogunate, which had ruled from Kyoto since 1338, is usually considered to have ended in 1573, and the era name was changed to Tenshō.
      - Nobunaga then turned on the Azai. When Asakura Yoshikage came to relieve Odani castle and then withdrew, Nobunaga pursued him into Echizen, beat his army at Tonezaka and burned his capital of Ichijōdani; Yoshikage, betrayed by his cousin Asakura Kageakira, took his own life. Nobunaga went back to Odani, and in September Azai Nagamasa and his father Hisamasa took their own lives as the castle fell. Nagamasa’s wife Oichi, Nobunaga’s sister, and their three daughters were sent out to Nobunaga, but Nagamasa’s young son was put to death. Nobunaga gave the Azai lands to Hideyoshi, who built a new castle at Nagahama.
    facts:
      - [Yoshiaki expelled from Kyoto, "August 1573"]
      - [Fall of Ichijōdani, "September 1573"]
      - [Fall of Odani, "September 1573"]
