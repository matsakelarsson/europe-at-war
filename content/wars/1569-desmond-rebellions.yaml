id: desmond-rebellions
name: Desmond Rebellions
start: "1569"
end: "1583-11-11"
tier: C
summary: Two risings in Munster by the FitzGeralds of Desmond and their allies against the spread of English government and Protestantism into the south of Ireland. In the first (1569–1573), James FitzMaurice FitzGerald rose while the Earl of Desmond was held in London, and was crushed by campaigns of deliberate terror under Sir Humphrey Gilbert. In the second (1579–1583), FitzMaurice landed with a small papal force and was soon killed; Gerald FitzGerald, Earl of Desmond, joined the revolt, which spread to Leinster, where Irish forces routed Lord Grey’s army at Glenmalure in 1580. That November several hundred papal soldiers, mostly Italian and Spanish, surrendered at Smerwick and were put to death on Grey’s orders. The English answered the revolt with scorched earth, and war-related famine and disease are thought to have killed up to a third of Munster’s people. The earl was hunted down and killed in November 1583, and his lands were confiscated for the Plantation of Munster.
