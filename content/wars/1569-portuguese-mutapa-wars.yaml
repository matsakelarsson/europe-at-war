notes:
  - The events are known almost entirely from Portuguese chronicles, letters and missionary accounts, read alongside Shona oral traditions and archaeology; dates for the plateau before 1700, including that of the battle of Maungwe (given as 1683 or 1684), are approximate.
  - “Mwenemutapa” (Monomotapa in Portuguese) was the title of the ruler; the Portuguese also used it for the kingdom.
