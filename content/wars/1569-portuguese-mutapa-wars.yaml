  - title: The fall of Kapararidze and the treaty of 1629
    date: 1607–1632
    when: "1629"
    borders: "1629-06-01"
    countries: [zw, mz, pt]
    body:
      - In the early 1600s the kingdom of Mutapa was torn by rebellions and rival claimants. The Mwenemutapa Gatsi Rusere, who had lost his capital to a rebel, Matuzianhe, turned to the Portuguese of Tete, and in about 1607 granted them all the mines of his kingdom in return for their help; the backland captain Diogo Simões Madeira fought his wars and built a fort at Chicova. Gatsi later stopped paying the tribute the Portuguese owed and his men attacked the fort, and relations swung between alliance and limited war.
      - His son Nyambo Kapararidze, Mwenemutapa from about 1623, broke with the Portuguese in 1628, when a Portuguese envoy was killed at his court, and declared war on them. The Portuguese of the Zambezi, with the Mutapa prince Mavura (Mamvura) and his followers, defeated his army in 1629 and installed Mavura in his place. On 24 May 1629 Mavura signed a treaty declaring himself a vassal of the king of Portugal; he promised to expel the Muslim traders, admit missionaries, open the mines and let the Portuguese trade freely. The historian S. I. Mudenge wrote that its terms had more teeth on paper than in reality.
      - In 1631 Kapararidze came back and raised the Zambezi valley against the Portuguese settlers, who fled to Tete, Sena and the fairs; many who did not escape were killed. In 1632 a Portuguese force from the coast, with Mavura’s army, defeated him again, and he fled. For the next half-century Portuguese traders, prazo holders and their African soldiers were the strongest power on the northern plateau, and Mavura and his successors depended on them.
