  - title: Changamire Dombo drives the Portuguese from the plateau
    date: 1684–1695
    when: "1684"
    borders: "1695-06-01"
    countries: [zw, mz, pt]
    body:
      - Changamire Dombo came from the north-east of the plateau, between the Mazowe and Nyadire rivers. Portuguese records first mention him in the 1670s, as a herdsman of the Mwenemutapa’s cattle who had become a war leader with a following of his own. In about 1684, at Maungwe (in the Makoni country near today’s Rusape), his army defeated a Portuguese force led, Portuguese sources say, by the governor of Mozambique, and then the army the Mwenemutapa sent against him. He turned south-west, took over the kingdom of Butua, the heir of the Torwa state around Khami, and built the Rozvi state, with its capital at Danamombe (Dhlo-Dhlo).
      - In 1693, invited, by most accounts, by the new Mwenemutapa Nyakunembire, whom the Portuguese opposed and who wanted to be rid of them, Dombo’s army fell on the fair of Dambarare, north of today’s Harare. It killed the Portuguese and their dependants and destroyed the church. The other fairs on the plateau were abandoned, and the traders fled to Tete. In 1695 Dombo invaded Manyika, closed its fair at Masekesa and placed his own candidate on its throne. He died in about 1696, and the Portuguese, who had feared for Tete, Sena and Sofala, were spared further attacks by a succession dispute among his sons.
      - The Portuguese never regained the plateau. They reopened a fair in Manyika in about 1715 and founded Zumbo, at the meeting of the Luangwa and the Zambezi, in about 1720, but they traded there on Rozvi terms. The Rozvi state dominated most of the plateau for over a century, and the Mwenemutapa dynasty, reduced to the Zambezi valley, held out until the Portuguese conquests of the late nineteenth and early twentieth centuries.
    facts:
      - [Battle of Maungwe, "about 1684"]
      - [Sack of Dambarare, "1693"]
      - [Invasion of Manyika, "1695"]
