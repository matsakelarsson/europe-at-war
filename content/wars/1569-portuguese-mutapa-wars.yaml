steps:
  - title: Barreto’s army and the road to the mines
    date: 1569–1575
    when: "1571"
    borders: "1572-01-01"
    countries: [mz, zw, pt]
    body:
      - The Portuguese had held Sofala since 1505 and Mozambique Island since 1507, hoping to take over the gold trade that Swahili merchants carried from the plateau to the coast. Its source was the kingdom of Mutapa, whose ruler, the Mwenemutapa, held court between the Zambezi escarpment and the Mazowe. In 1561 the Jesuit Gonçalo da Silveira reached the court and baptised the young ruler Negomo, but was strangled within weeks, on the advice, Portuguese writers said, of Muslim traders who called him a spy. His death gave Lisbon a reason for war; the gold gave it a motive.
      - "King Sebastião named Francisco Barreto, a former governor of Portuguese India, “conqueror of the mines”. He sailed from Lisbon on 16 April 1569 with three ships and an army that Portuguese sources put at about 1,000 to 2,000 men, and after long delays at Mozambique took them up the Zambezi in November 1571, reaching Sena on 18 December. There, with the Jesuit Francisco de Monclaros at his side, he had the Muslim traders of the town killed, blaming them for the sickness among his men and horses. In 1572 his army marched up the river against the Tonga of the Mongas country, who barred the way to the plateau. Its guns won several fights, but fever, hunger and the loss of horses and oxen wore it down. Barreto had to go back to Mozambique to deal with a rival officer, and he died at Sena soon after his return, on 9 July 1573."
      - His successor, Vasco Fernandes Homem, gave up the Zambezi route and in 1574–1575 marched from Sofala through the kingdom of Uteve to Manyika, burning villages on the way. In Manyika he found the gold that was panned and dug in small workings, not the great mines of legend, and made a treaty with its ruler. A garrison he left at the reputed silver mines of Chicova, above Tete, was later wiped out. The Mwenemutapa, who had lost nothing and gained from the Portuguese defeats, let them trade at fairs under his authority.
    facts:
      - [Barreto leaves Lisbon, "16 April 1569"]
      - [Arrival at Sena, "18 December 1571"]
      - [Death of Barreto, "9 July 1573, at Sena"]
