id: portuguese-mutapa-wars
name: Portuguese–Mutapa wars
start: "1569-04-16"
end: "1695"
tier: B
summary: "More than a century of Portuguese attempts to reach and control the gold of the Zimbabwe plateau, and of resistance by its rulers. The Portuguese, established at Sofala and Mozambique Island since the early 1500s and as traders at Sena and Tete on the Zambezi, sent Francisco Barreto with a royal army in 1569 to conquer the mines of the Mwenemutapa, the ruler of the kingdom of Mutapa; disease and the Tonga peoples of the Zambezi valley destroyed the expedition, and his successor Vasco Fernandes Homem found only modest gold workings in Manyika. In the 1600s the Portuguese exploited Mutapa’s succession wars: Gatsi Rusere granted them the mines for help against rebels, and in 1629 they drove out the Mwenemutapa Kapararidze and made his rival Mavura sign a treaty of vassalage to the Portuguese crown. Portuguese traders and backland adventurers then spread over the plateau, living at trading fairs such as Masapa and Dambarare. Their power there was broken by Changamire Dombo, the founder of the Rozvi state, who defeated a Portuguese army at Maungwe in about 1684, sacked Dambarare in 1693 and drove the Portuguese from the plateau; they kept only the Zambezi towns and, later, the fairs of Manyika and Zumbo."
countries: [zw, mz, pt]
