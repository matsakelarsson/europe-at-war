steps:
  - title: Nicosia
    date: 1570
    when: "1570-03"
    borders: "1570-09-15"
    countries: [cy, tr, gr]
    body:
      - Cyprus had been Venetian since 1489, and Venice paid the sultan a tribute for it, but the island lay deep in Ottoman waters and its harbours sheltered Christian corsairs. Selim II and his war party, against the advice of the grand vizier Sokollu Mehmed Pasha, decided to take it. In March 1570 an envoy demanded that Venice give up the island; the Senate refused. On 3 July a large Ottoman army under the sultan’s old tutor Lala Mustafa Pasha, carried by Piyale Pasha’s fleet, landed unopposed at Salines, near Larnaca, and marched on the capital, Nicosia.
      - Nicosia had new star-shaped walls but too few trained soldiers. The siege began on 22 July, and on 9 September the Ottomans stormed the city. Some 20,000 of its people are thought to have been killed, and many women and children were sold as slaves. Kyrenia then surrendered without a fight, and on 15 September Ottoman cavalry appeared before Famagusta, the last Venetian stronghold. A relief fleet of Venetian, papal and Spanish galleys, assembled late at Crete, heard of Nicosia’s fall at sea and turned back.
    facts:
      - [Ottoman landing, 3 July 1570]
      - [Nicosia stormed, 9 September 1570]
      - [Killed in Nicosia, "about 20,000, by some estimates"]
    markers:
      - kind: event
        side: ot
