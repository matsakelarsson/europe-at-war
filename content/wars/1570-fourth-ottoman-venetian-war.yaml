  - title: Famagusta
    date: September 1570 – August 1571
    when: "1570-09-15"
    borders: "1571-08-05"
    countries: [cy, tr, it]
    body:
      - Famagusta was held by Marco Antonio Bragadin with about 8,500 men and 90 guns. In January 1571 Venetian ships slipped through the blockade with men and supplies, and Selim recalled Piyale Pasha in anger, leaving Lala Mustafa in sole command. From 12 May the Ottomans bombarded the walls without pause, dug mines and made repeated assaults. Meanwhile Pope Pius V brought Venice and a reluctant Philip II of Spain together in a Holy League, concluded in May, but its fleet was not ready in time to save the city.
      - On 1 August, with powder and food exhausted and few men left fit to fight, Bragadin surrendered on terms that let the survivors leave for Crete. A few days later, after an angry meeting in which Lala Mustafa accused him of killing Muslim prisoners, Bragadin was arrested, his officers were executed, and he was mutilated and flayed alive; his stuffed skin was later sent to Constantinople. The siege had cost the Ottomans very heavy losses, by some estimates tens of thousands of dead.
    facts:
      - [Siege of Famagusta, "15 September 1570 – 1 August 1571"]
      - [Defenders, "about 8,500 under Marco Antonio Bragadin"]
      - [Holy League concluded, May 1571]
    markers:
      - kind: taken
        side: ot
        name: Famagusta
        date: 1 August 1571
        text: The city surrendered after almost a year’s siege. Its commander, Bragadin, was put to death in breach of the terms.
        lonlat: [33.94, 35.12]
      - kind: treaty
        side: hl
        name: Rome
        date: May 1571
        text: Pope Pius V brought Spain and Venice together in the Holy League against the Ottomans.
        lonlat: [12.48, 41.9]
  - title: Lepanto and the peace
    date: 1571–1573
    when: "1571-09"
    borders: "1573-03-07"
    countries: [gr, it, es, cy, hr, mt, tr]
    body:
      - The League fleet gathered at Messina under Don John of Austria, Philip II’s half-brother, and sailed in mid-September, still unaware that Famagusta had fallen. It had about 206 galleys and six Venetian galleasses, heavy gun-ships, against the Ottoman admiral Müezzinzade Ali Pasha’s 210 or so galleys and some 60 galliots, which lay at Lepanto. On 7 October the fleets met at the mouth of the Gulf of Patras. The galleasses broke up the Ottoman line, and after hours of fighting at close quarters Ali Pasha was killed and his flagship taken. Only the squadron of Uluç Ali, governor of Algiers, escaped in good order.
      - The League captured about 117 galleys and sank or burned many others; some 30,000 Ottomans and 7,500 of the allies are thought to have died, and thousands of Christian galley slaves were freed. Among the wounded was Miguel de Cervantes. The victory was celebrated across Catholic Europe, but it was not followed up. Over the winter the Ottomans built a new fleet, and in 1572 Uluç Ali, now called Kılıç Ali, avoided battle off Modon. Venice made a separate peace on 7 March 1573, giving up Cyprus and paying 300,000 ducats.
    facts:
      - [Battle of Lepanto, "7 October 1571, Holy League victory"]
      - [Fleets, "about 210 galleys on each side"]
      - [Peace, "7 March 1573; Venice cedes Cyprus and pays 300,000 ducats"]
    markers:
      - kind: event
        side: hl
        name: Messina
        date: September 1571
        text: The Holy League fleet assembled here under Don John of Austria.
        lonlat: [15.55, 38.19]
      - kind: naval
        side: hl
        name: Battle of Lepanto
        date: 7 October 1571
        text: The Ottoman fleet was all but destroyed in the largest galley battle ever fought, but the Ottomans rebuilt it within a year.
        lonlat: [21.25, 38.25]
      - kind: event
        side: ot
        name: Lepanto
        date: September – October 1571
        text: The Ottoman fleet lay at anchor behind this fortress in the Gulf of Corinth before sailing out to fight.
        lonlat: [21.83, 38.39]
        lp: t
      - kind: event
        side: ot
        name: Modon
        date: 1572
        text: Kılıç Ali’s new fleet sheltered under the guns of the fortress, and the League failed to force a battle.
        lonlat: [21.71, 36.81]
      - kind: treaty
        side: ot
        name: Constantinople
        date: 7 March 1573
        text: Venice signed a separate peace, recognising the loss of Cyprus.
        lonlat: [28.98, 41.01]
    arrows:
      - side: hl
        label: Don John of Austria
        via: [[15.6, 38.15], [19.9, 39.5], [20.6, 38.3], [21.15, 38.25]]
