id: fourth-ottoman-venetian-war
name: Fourth Ottoman–Venetian War
start: "1570"
end: "1573-03-07"
tier: B
summary: The War of Cyprus, in which Sultan Selim II took Venice’s richest colony. Nicosia fell in September 1570 and Famagusta in August 1571 after a siege of almost a year. Two months later the fleet of the Holy League of Spain, Venice and the pope destroyed the Ottoman fleet at Lepanto, the largest galley battle in history, but the Ottomans rebuilt their navy and Venice made a separate peace in 1573, giving up Cyprus.
countries: [cy, gr, it, tr, es, hr, mt]
sides:
  - id: ve
    name: Republic of Venice
    polities: [venice]
    ink: red
    moves: Venetian moves
    success: Venetian success
  - id: hl
    name: Holy League
    polities: [spain, naples, sicily, papal-states, genoa, savoy, tuscany, malta]
    ink: gold
    moves: Holy League moves
    success: Holy League success
  - id: ot
    name: Ottoman Empire
    polities: [ottoman, algeria]
    ink: teal
    moves: Ottoman moves
    success: Ottoman success
notes:
  - Dates are Julian. Figures for the fleets and the dead at Lepanto vary; the commonest estimates are about 7,500 dead on the League side and about 30,000 on the Ottoman side, and some sources give more.
  - The Holy League was formed in May 1571 by Pope Pius V; besides Venice, Spain and the Papal States, it included Genoa, Savoy, Tuscany, the Knights of Malta and smaller Italian states. Its fleet is shown here as a separate side from Venice’s own forces on Cyprus.
