steps:
  - title: The call to arms, Nagashima and Echizen
    date: 1570–1575
    when: "1570"
    borders: "1574-10-01"
    countries: [jp]
    body:
      - The Ishiyama Hongan-ji stood on a rise between the rivers and marshes at the mouth of the Yodo, a temple town of moats, walls and towers that controlled the approaches to Kyoto from the Inland Sea. After Nobunaga took Kyoto for Ashikaga Yoshiaki in 1568 he demanded heavy contributions from the temple, and in 1570 he seemed ready to take the site itself. In the autumn of 1570, while Nobunaga was fighting the Miyoshi at Noda and Fukushima, just west of the temple, the abbot Kennyo called on the faithful to defend the Buddha’s law, and the temple’s men attacked the Oda camps. Nobunaga had to withdraw, and the Hongan-ji joined the alliance against him with the Azai, the Asakura, the Miyoshi, the monks of Mount Hiei and later the shogun Yoshiaki and the Takeda.
      - The leagues rose elsewhere too. At Nagashima, among the river islands where Owari meets Ise, they killed Nobunaga’s brother Oda Nobuoki at Kokie in 1570 and beat off his attacks in 1571 and 1573. In the summer of 1574 Nobunaga came back with a great army and a fleet under Kuki Yoshitaka, drove the defenders into their last strongholds and starved them; when the leagues tried to surrender, his men fell on them, and the last two forts were surrounded by palisades and set on fire with everyone inside. Some 20,000 people are said to have died. In Echizen, where the leagues had driven out Nobunaga’s governors after the fall of the Asakura, his army returned in 1575 and killed, by his own count, over 12,000 people in a few days.
    facts:
      - [Kennyo’s call to arms, "autumn 1570"]
      - [Fall of Nagashima, "1574, some 20,000 dead"]
      - [Echizen retaken, "1575"]
