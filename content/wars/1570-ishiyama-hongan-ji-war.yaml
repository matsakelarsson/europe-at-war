notes:
  - Dates are converted from the lunar calendar to the Julian calendar where English sources give them; otherwise the lunar month is given.
  - The figures for the dead at Nagashima and in Echizen come from Nobunaga’s own letters and the Shinchō Kōki, Ōta Gyūichi’s life of Nobunaga, and may be exaggerated or rounded; they are nonetheless the largest massacres of the period.
  - The Hongan-ji was later divided into two branches, the Nishi (western) Hongan-ji and the Higashi (eastern) Hongan-ji founded in 1602, partly as a result of the quarrel between Kennyo and his son Kyōnyo over the surrender.
