id: ishiyama-hongan-ji-war
name: Ishiyama Hongan-ji War
start: "1570"
end: "1580"
tier: B
summary: "Oda Nobunaga’s ten-year war against the Ishiyama Hongan-ji, the fortified head temple of the Jōdo Shinshū at Osaka, and the leagues of its followers, the Ikkō-ikki. The Hongan-ji had moved to Ishiyama, on the site of today’s Osaka Castle, in 1532, and its abbot commanded the loyalty of hundreds of thousands of farmers, townsmen and local warriors from Kaga to Kii. When Nobunaga, master of Kyoto since 1568, demanded money and the temple’s site, the abbot Kennyo called on his followers to fight in 1570. The war was fought at Osaka, where Oda armies ringed the temple with forts for years, and in the provinces: the leagues of Nagashima in Owari and Ise were wiped out in 1574 and those of Echizen in 1575, with tens of thousands killed. The Mōri kept the temple supplied by sea and beat Nobunaga’s fleet at Kizugawaguchi in 1576, but after Nobunaga’s new fleet fought them again in 1578 and his enemies fell one by one, Kennyo accepted a peace arranged by the emperor in 1580 and left Osaka. The temple burned, and Hideyoshi later built Osaka Castle on its site."
countries: [jp]
