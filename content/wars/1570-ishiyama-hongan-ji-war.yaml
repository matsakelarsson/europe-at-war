  - title: Kennyo’s surrender
    date: 1580
    when: "1580-04"
    borders: "1580-09-01"
    countries: [jp]
    body:
      - By 1580 the Hongan-ji was isolated. Uesugi Kenshin, who had joined the alliance against Nobunaga, died in 1578, Arioka fell in 1579, and Hideyoshi’s campaign against the Mōri took Miki in Harima, the castle of their allies the Bessho. With food and powder running low, Kennyo accepted the mediation of Emperor Ōgimachi. In April 1580 (the intercalary third month) he agreed to leave Osaka, and he went to Saginomori in Kii. His son Kyōnyo refused the terms and held the temple with his followers until the eighth month, when he too left. The temple then burned to the ground; accounts differ on whether Nobunaga’s men or the departing defenders set the fire.
      - Nobunaga spared the defenders, and the leagues of Kaga were crushed by his general Shibata Katsuie later that year. Ten years of war had ended the Hongan-ji as a military power, though not the Jōdo Shinshū, which remained one of Japan’s largest Buddhist schools. In 1583 Hideyoshi began building Osaka Castle on the temple’s site.
    facts:
      - [Peace agreed, "April 1580"]
      - [Kyōnyo leaves, "eighth month of 1580"]
      - [Osaka Castle begun on the site, "1583"]
