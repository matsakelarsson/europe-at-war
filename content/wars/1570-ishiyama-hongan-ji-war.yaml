  - title: Kizugawaguchi
    date: 1576–1578
    when: "1576"
    borders: "1576-08-01"
    countries: [jp]
    body:
      - In 1576 Nobunaga closed in on the temple itself. His attack at Tennōji in the spring was beaten back, and in the fighting that followed he was wounded in the leg by a musket ball and one of his generals, Harada Naomasa, was killed. The Oda then built a ring of forts, by 1577 some fifty, around the temple town and tried to starve it. The Hongan-ji held out because it was supplied by sea by the Mōri, the lords of western Honshu, who had taken in the exiled shogun Yoshiaki, and with the help of the musketeers of Saika in Kii. In the seventh month of 1576 a Mōri fleet led by the Murakami sea lords, several hundred vessels, fought its way through Nobunaga’s ships at the mouth of the Kizu river, burned them with fire weapons and brought rice into the temple.
      - Nobunaga answered on land and sea. In 1577 he invaded Saika and forced its leaders to submit for a time, and he ordered Kuki Yoshitaka to build six great warships at Ise, heavily armed with cannon and said in some accounts to have been plated with iron. In the eleventh month of 1578 they met the Mōri fleet again off Kizugawaguchi. The Shinchō Kōki describes an Oda victory; Mōri records suggest supplies still got through, and historians disagree over how decisive the battle was. In the same year Araki Murashige, Nobunaga’s commander in Settsu, went over to the Mōri and the Hongan-ji, and his castle of Arioka (Itami) held out for a year.
    facts:
