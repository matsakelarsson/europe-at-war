id: russo-crimean-war-1570
name: Russo-Crimean War, 1570–1572
start: "1570"
end: "1572"
tier: B
summary: A war in which the Crimean khan Devlet I Giray, backed by the Ottoman Empire, tried to force Russia to give up Kazan and Astrakhan. In 1571, with most of the Russian army in Livonia, he slipped past the defences on the Oka and burned Moscow; in 1572 he came again and was defeated at Molodi, south of the city.
countries: [ru, ua]
sides:
  - id: ru
    name: Russia
    polities: [russia]
    ink: green
    moves: Russian moves
    success: Russian success
  - id: cr
    name: Crimean khanate
    polities: [crimean-khanate]
    ink: olive
    moves: Crimean moves
    success: Crimean success
notes:
  - Dates are Julian (Old Style). The sources disagree on the dates of the fighting at Molodi as well as on numbers; Russian historians usually date it from 29 or 30 July to 2 August 1572.
  - The Crimean army included Nogai and Circassian contingents and, in 1572, Ottoman janissaries and guns. Russia was at the same time fighting the Livonian War against Sweden and Poland–Lithuania.
  - The Crimean raids, which were above all slave raids, continued after Molodi, and in 1591 a Crimean army again reached the outskirts of Moscow.
