  - title: Molodi
    date: July – August 1572
    when: "1572-07-30"
    borders: "1572-08-02"
    countries: [ru]
    body:
      - "Devlet now demanded Kazan and Astrakhan as the price of peace. Ivan rebuilt the southern defences under Prince Mikhail Vorotynsky, and in July 1572 the khan came back with perhaps 40,000–60,000 men, including Nogais, Circassians and Ottoman janissaries. The Russians held the main fords, but around 27 July the Tatars crossed the Oka at Senkin ford, above Serpukhov, scattered a small detachment and rode for Moscow, leaving Vorotynsky’s army behind them. Vorotynsky followed, and his vanguard under Prince Dmitry Khvorostinin caught the Tatar rear near the village of Molodi, about 50 kilometres south of the city."
      - "With an army at his back, Devlet turned round. For several days the Tatars attacked the Russian gulyay-gorod, a mobile fortress of wooden shields mounted on carts, on a hill by the Rozhayka river, while musketeers and cannon fired from behind it. Divey Murza, the khan’s chief commander, was captured early in the fighting. On 2 August, as the Tatars made a last assault, Vorotynsky led part of his army round the hill and fell on their rear. The Tatars fled back across the Oka with heavy losses, and Russia kept Kazan and Astrakhan."
    facts:
      - [Battle of Molodi, "About 29 July – 2 August 1572, Russian victory"]
      - [Commanders, "Mikhail Vorotynsky and Dmitry Khvorostinin against Devlet I Giray"]
      - [Captured, "Divey Murza, the khan’s chief commander"]
