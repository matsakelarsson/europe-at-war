steps:
  - title: The burning of Moscow
    date: 1570 – May 1571
    when: "1571-05-24"
    borders: "1571-05-24"
    countries: [ru]
    body:
      - "After Russia took Kazan and Astrakhan, the Crimean khan Devlet I Giray, a vassal of the Ottoman sultan, demanded them back. A Crimean and Ottoman expedition against Astrakhan failed in 1569, and in 1570 the khan’s sons ravaged the lands of Ryazan and Kashira. Russia was badly placed: most of its army was fighting in Livonia, famine and plague had struck in 1570, and Ivan IV’s oprichnina terror had divided the country. In the spring of 1571 Devlet led perhaps 40,000 men north, and Russian defectors showed him a way across the upper Oka and the Ugra, round the army waiting at Serpukhov."
      - "Ivan fled north to Rostov, and the Russian commanders fell back on Moscow. On 24 May the Tatars set fire to its wooden suburbs, and a strong wind carried the flames into the city, which burned down in about six hours. People who took refuge in stone churches and cellars died there, others drowned in the Moskva river, and the powder magazine in the Kremlin exploded, though the Kremlin itself was not taken. The Tatars left by the Ryazan road. Estimates of the dead range from 10,000 to 120,000, with 60,000–150,000 people carried off into slavery."
    facts:
      - [Burning of Moscow, "24 May 1571"]
      - [Khan, "Devlet I Giray (r. 1551–1577)"]
      - [Captives, "Estimated at 60,000–150,000"]
