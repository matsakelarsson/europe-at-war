id: ternate-portuguese-war
name: Ternatean–Portuguese war
start: "1570-02-25"
end: "1575-07-15"
tier: C
summary: "The war in which the sultanate of Ternate, the great clove-producing kingdom of northern Maluku, drove the Portuguese from their fortress on the island. The Portuguese had built the fort of São João Baptista on Ternate from 1522 as allies of the sultans, but their captains’ behaviour, their missions and their attempts to control the clove trade led to growing conflict with Sultan Hairun (Khairun), who fought them in Ambon and Halmahera in the 1560s. On 25 February 1570 the captain Diogo Lopes de Mesquita invited Hairun into the fort for a meal of reconciliation, and his nephew Martim Afonso Pimentel stabbed the sultan to death at the gate. Hairun’s son Babullah was proclaimed sultan on the island of Hiri and swore enmity to the Portuguese until his father’s killers were punished. Ternate’s forces took the smaller Portuguese posts on the island and besieged São João Baptista, letting in only small rations of sago, while Ternatan fleets attacked Portuguese and mission positions in Halmahera and Morotai, and in Ambon, Buru and western Seram; the Portuguese kept their new fort at Ambon only with difficulty. Tidore at first sided with Ternate. After five years Babullah gave the garrison 24 hours to leave, and on 15 July 1575 the captain Nuno Pereira de Lacerda handed over the fort; the Portuguese left unharmed for Ambon, Malacca and the sandalwood islands of Solor and Timor. Babullah made the fort his palace and went on to build Ternate’s widest sphere of influence, while the Portuguese were allowed a fort on Tidore in 1578. Indonesians count the victory as the first of a state of the archipelago over a European power; Babullah was made a National Hero of Indonesia in 2020."
countries: [id, pt]
