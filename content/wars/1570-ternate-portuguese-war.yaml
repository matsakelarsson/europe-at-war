notes:
  - The account follows the Portuguese chronicles and later Ternatan traditions, which differ on details; some accounts give Álvaro de Ataíde as the captain who held the fort during the siege. Pimentel was killed later in Java, and Babullah’s envoy to Philip II in Lisbon asked in vain for the punishment of Hairun’s murderers.
