id: mughal-conquest-of-gujarat
name: Mughal conquest of Gujarat
start: "1572-07"
end: "1573-09"
tier: C
summary: "Akbar’s conquest of the Gujarat Sultanate, the rich kingdom of western India with the ports of Cambay and Surat. Gujarat had been torn by rivalries among its nobles under the young sultan Muzaffar Shah III, and one faction leader, Itimad Khan, invited Akbar in. Akbar left Fatehpur Sikri in July 1572 and reached Ahmedabad in November with little resistance; Muzaffar Shah was taken prisoner and Itimad Khan and the nobles submitted. The Mirzas, rebel Timurid cousins of Akbar who had taken refuge in Gujarat, fought on. Akbar, with only a few hundred men, defeated Ibrahim Husain Mirza at Sarnal in December 1572, and Surat surrendered on 26 February 1573 after a siege of about six weeks. Soon after Akbar went home, Muhammad Husain Mirza and Gujarati nobles under Ikhtiyar-ul-Mulk rose and besieged Ahmedabad. Akbar rode from Fatehpur Sikri to Ahmedabad, about 900 km, in some eleven days, and routed them outside the city in early September 1573; both rebel leaders were killed. Gujarat became a Mughal province, and the Buland Darwaza at Fatehpur Sikri was later built to mark the conquest. Muzaffar Shah escaped from captivity in 1583 and retook Ahmedabad, but Abdul Rahim Khan-i-Khanan defeated him near Sarkhej in 1584; captured in 1592, he took his own life."
