  - title: The fall of La Goulette and the fort
    date: July – September 1574
    when: "1574-07"
    borders: "1574-09-13"
    countries: [tn, es, it, tr, dz]
    view:
      center: [10.25, 36.85]
      size: [70, 50]
    body:
      - The Ottoman fleet, by different accounts 230 to 300 galleys with smaller ships, under Kılıç Ali Pasha (as Uluç Ali was now called) and the commander of the land army, Koca Sinan Pasha, arrived in mid-July 1574 and landed its troops among the ruins of Carthage. Contingents came from the governors of Algiers and Tripoli and from Tunisia itself. The Ottomans battered La Goulette for weeks. Its garrison of about 7,000 men beat off assault after assault until the fortress was stormed on 24 August; Portocarrero was taken prisoner and died on the way to Istanbul.
      - The new fort beside Tunis, unfinished and poorly supplied, held out under Serbelloni for three more weeks. Cervantes, who served in the relief forces, wrote that the Ottomans made 22 assaults on it and lost 25,000 men, and that only 300 of the defenders were taken alive. It surrendered on 13 September, and Serbelloni went into captivity. Don John gathered ships in Naples and Sicily, but storms scattered his relief and Philip II, close to bankruptcy, sent little help.
      - The Hafsid Muhammad, wounded in the fighting, was captured and sent to Istanbul, where he was held in the Yedikule fortress and died about 1594. Tunis became an Ottoman province under a pasha, until the janissary officers (deys) and later the beys of the Muradid and Husainid families took power in the 17th and 18th centuries. Spain and the Ottomans soon turned to other wars, Spain against the Dutch and the Ottomans against Persia, and agreed to truces; Spain kept Oran, Melilla and its other presidios, and the Ottomans held the coast from Algiers to Tripoli.
