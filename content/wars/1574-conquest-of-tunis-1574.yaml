notes:
  - Dates are Julian. The size of the Ottoman fleet and army varies widely between sources (from about 40,000 to 75,000 men in the fleet, and up to 100,000 with the North African contingents); the Spanish figure of 25,000 Ottoman dead comes from Miguel de Cervantes and is best read as a claim. Some sources date the surrender of the fort at Tunis to 3 September.
  - Cervantes, who had served in Don John’s expedition of 1573, retold the fall of La Goulette and the fort in the Captive’s Tale in Don Quixote (Part I, chapters 39–41). The Moroccan prince Abd al-Malik, who won the Battle of Alcácer Quibir four years later, fought on the Ottoman side.
  - Charles V’s capture of Tunis in 1535 has its own entry (Conquest of Tunis), as do the Battle of Djerba (1560) and the Fourth Ottoman–Venetian War with Lepanto (1571).
