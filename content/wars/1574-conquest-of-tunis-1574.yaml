steps:
  - title: Tunis between two empires
    date: 1569–1573
    when: "1569"
    borders: "1573-10-15"
    countries: [tn, dz, es, it]
    body:
      - After Charles V’s expedition of 1535, the Hafsid sultans ruled Tunis as Spanish vassals, while a Spanish garrison held La Goulette, the fortress on the channel between the Gulf of Tunis and the lagoon. The Hafsid state was weak and divided, and many in Tunis resented its dependence on Spain. In the winter of 1569–1570 Uluç Ali, the Calabrian-born corsair who had become the sultan’s governor (beylerbey) of Algiers, marched east from Algiers, drove out the Hafsid sultan Ahmad and took Tunis. Ahmad fled to the Spanish in La Goulette, which the Ottomans blockaded but did not take.
      - Two years later Uluç Ali commanded the Ottoman left wing at Lepanto and was the only Ottoman admiral to bring his squadron home in good order. In the autumn of 1573, with the Holy League dissolved and Venice at peace with the sultan, Don John of Austria took about 100 galleys and 20,000 soldiers to Tunis. He reached La Goulette on 8 October; the Ottoman garrison of Tunis was overwhelmed by the townspeople, and Don John entered the city without a fight. Ahmad refused Spain’s terms, so Don John made his brother Muhammad ruler under Spanish protection. Philip II had doubted the value of the enterprise, but Don John began a new fort between Tunis and the lagoon and left it, unfinished, to the Italian engineer and soldier Gabrio Serbelloni, while Pedro Portocarrero commanded in La Goulette.
