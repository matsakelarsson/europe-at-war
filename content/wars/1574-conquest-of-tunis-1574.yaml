id: conquest-of-tunis-1574
name: Conquest of Tunis (1574)
start: "1574-07-12"
end: "1574-09-13"
tier: B
summary: "The Ottoman capture of La Goulette and Tunis in 1574, which ended both Spain’s forty-year hold on La Goulette and the Hafsid dynasty that had ruled Tunis since the 13th century. Uluç Ali, the Ottoman governor of Algiers, had taken Tunis in 1569–1570; after Lepanto, Don John of Austria retook it without a fight in October 1573 and set up the Hafsid prince Muhammad as a Spanish client, leaving garrisons in La Goulette and in a new, unfinished fort beside Tunis. In July 1574 Sultan Selim II sent a fleet of about 230–300 galleys under Kılıç Ali Pasha (Uluç Ali) and Koca Sinan Pasha, with troops from Algiers, Tripoli and the Tunisian interior. La Goulette, held by about 7,000 men, was stormed on 24 August, and the fort at Tunis surrendered on 13 September after repeated assaults. Most of the defenders died; the survivors went to the galleys or to captivity in Istanbul, and so did Muhammad, the last Hafsid. Don John’s attempts at relief were defeated by storms and lack of money. Tunis became an Ottoman province, and the frontier between the Habsburg and Ottoman Mediterranean settled into the line it kept for two centuries."
