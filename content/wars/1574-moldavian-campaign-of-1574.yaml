id: moldavian-campaign-of-1574
name: Moldavian Campaign of 1574
start: "1574-04"
end: "1574-06"
tier: C
summary: The revolt of John III the Terrible (Ioan Vodă cel Cumplit), voivode of Moldavia, against Ottoman overlordship, and its suppression. John, who had taken the throne in 1572 with Ottoman backing and ruled harshly against the boyars, refused a demand to double Moldavia’s tribute, and the Porte named Peter the Lame as voivode in his place. With an army of perhaps 30,000–40,000 Moldavians, joined by about 1,200 Zaporozhian Cossacks under Ivan Svirhovsky, he struck first, and on 24 April 1574 routed an Ottoman, Wallachian and Tatar army at Jiliște near Focșani, then sacked Brăila, overran Wallachia and attacked the Ottoman fortresses of Tighina and Cetatea Albă (Bender and Akkerman). A much larger Ottoman and Crimean Tatar army then entered Moldavia. In June, at Lake Cahul near the Danube, part of the Moldavian army under the boyar Ieremia Cernevici, reportedly bribed, went over to the enemy; John fought on, then retreated to a fortified camp at Roșcani, where he surrendered after several days on a promise that his men would be spared. He was executed, according to tradition by being tied to camels driven apart, and much of his army was massacred. Moldavia remained an Ottoman vassal, and John became a Romanian hero of resistance to the Ottomans.
