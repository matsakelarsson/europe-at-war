notes:
  - Dates are Julian. Romanian historians often give double dates, such as 14/24 April 1574 for Jiliște; sources also differ on the dates of the battle at Lake Cahul (9 or 10 June) and of John’s death (11 or 14 June). The size of the Ottoman army is very uncertain, with estimates from about 50,000 to 200,000.
  - Wallachia fought on the Ottoman side under its voivode Alexander II Mircea, the brother of Peter the Lame.
