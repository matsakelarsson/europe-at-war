id: mughal-conquest-of-bengal
name: Mughal conquest of Bengal
start: "1574"
end: "1612-03-12"
tier: B
summary: "The long conquest of Bihar and Bengal by the Mughal Empire. In 1574 Akbar took Patna from Daud Khan Karrani, the Afghan sultan of Bengal, and his generals pursued Daud into Odisha and defeated him at Tukaroi in March 1575. Daud broke the peace that followed, and at Rajmahal on 12 July 1576 he was defeated again, captured and executed, ending the Karrani dynasty and the Bengal Sultanate. The Mughals held western and northern Bengal, but the river country of the east, the Bhati, stayed in the hands of local lords known as the Baro-Bhuyans, led by Isa Khan of Sonargaon, who beat back Mughal fleets in 1584 and 1597. Only under Jahangir did the governor Islam Khan Chishti, with a large river fleet, subdue Isa Khan’s son Musa Khan in 1610–1611 and make Dhaka the capital of Mughal Bengal. The last Afghan chief, Khwaja Usman, was killed in Sylhet in 1612."
countries: [bd, in]
