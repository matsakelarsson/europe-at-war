  - title: Islam Khan and Dhaka
    date: 1608–1612
    when: "1608-06"
    borders: "1612-03-12"
    countries: [bd, in]
    body:
      - "In 1608 Jahangir made Islam Khan Chishti governor of Bengal. He set out from Rajmahal at the end of the rains with an army and a large fleet of war boats, and won over or defeated the western zamindars before moving into the Bhati. In mid-1610 his troops took Musa Khan’s forts at Jatrapur and Dakchara on the rivers west of Dhaka, and he made Dhaka the capital of the province, renaming it Jahangirnagar. Over the next year his commanders, among them Mirza Nathan, took Katrabo by a night attack and forced Musa Khan out of Sonargaon, which was handed over in April 1611. Musa Khan and his allies submitted and were held at Dhaka; he later served the Mughals."
      - "The Afghan chief Khwaja Usman, who had held out at Bokainagar in Mymensingh, withdrew east to Sylhet. On 12 March 1612 a Mughal army under Shuja’at Khan met him at Daulambapur, south of today’s Moulvibazar; Usman was mortally wounded, and his followers surrendered. Sylhet, Jessore and the coastal kingdoms were brought under Mughal rule, and Bengal was at last a settled province of the empire. Islam Khan died in 1613."
    facts:
      - [Islam Khan appointed governor, "1608"]
      - [Dhaka made the capital, "1610"]
      - [Sonargaon handed over, "April 1611"]
      - [Battle of Daulambapur, "12 March 1612, Mughal victory"]
    markers:
