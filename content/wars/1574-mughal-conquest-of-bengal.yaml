steps:
  - title: Patna, Tukaroi and Rajmahal
    date: 1574–1576
    when: "1574-08"
    borders: "1574-08"
    countries: [in, bd]
    body:
      - "The Karrani dynasty, Afghans who had served Sher Shah, ruled Bengal and Bihar from Tanda near Gaur, and under Sulaiman Khan Karrani had also conquered Odisha. Sulaiman had been careful to acknowledge Akbar as overlord, but his son Daud Khan, who succeeded in 1572, had the Friday prayer read in his own name and seized a Mughal frontier fort. In 1574 Akbar came down the Ganges in person, took Hajipur and then Patna in August, and sent his general Munim Khan, with Raja Todar Mal, after Daud, who fled to Bengal. The Mughals entered Tanda in September and followed Daud into Odisha."
      - "On 3 March 1575 the armies met at Tukaroi, between Midnapore and Jaleswar. Daud’s general Gujar Khan was killed and the Afghans were defeated. By the treaty that followed at Katak (Cuttack), Daud gave up Bengal and Bihar and kept Odisha as a Mughal vassal. But in October 1575 an epidemic at Gaur, where Munim Khan had moved his headquarters, killed him and many of his officers, and Daud came back and retook much of Bengal."
      - "Akbar sent a new army under Khan Jahan Husain Quli Beg. On 12 July 1576, near Rajmahal, where the Ganges turns south into Bengal, Daud was defeated, captured and beheaded. The Bengal Sultanate, which had lasted more than two centuries, came to an end, and Bengal became a Mughal province, though Afghan chiefs and, in 1580–82, rebellious Mughal officers kept it unsettled for years."
    facts:
      - [Patna taken by Akbar, "August 1574"]
      - [Battle of Tukaroi, "3 March 1575, Mughal victory"]
      - [Battle of Rajmahal, "12 July 1576, Mughal victory; Daud Khan Karrani executed"]
