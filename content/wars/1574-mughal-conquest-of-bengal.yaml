notes:
  - Dates before 1582 are in the Julian calendar, as the sources give them.
  - Much of the later story comes from the Baharistan-i-Ghaibi of Mirza Nathan, a Mughal officer who fought under Islam Khan. Sources differ on details and dates of the fighting in the Bhati; the dates of Musa Khan’s submission range from 1610 to 1611.
  - “Baro-Bhuyan” (Bengali for “twelve landlords”) is a traditional name; the number of these chiefs, Muslim and Hindu, varied.
