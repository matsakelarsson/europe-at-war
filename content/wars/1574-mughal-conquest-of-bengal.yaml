  - title: Isa Khan and the Bhati
    date: 1576–1599
    when: "1584"
    borders: "1584"
    countries: [bd]
    body:
      - "Beyond the great rivers in the east of Bengal lay the Bhati, the lowlands of the Meghna and the old Brahmaputra, a country of channels and islands where war was fought from boats. Its lords, the Baro-Bhuyans, were Muslim and Hindu landholders with their own forts and river fleets. Their leader was Isa Khan, whose family held Sarail and who made his seat at Sonargaon and Katrabo near today’s Dhaka. He gave refuge to Afghan chiefs and to Mughal officers who had rebelled against Akbar, such as Masum Khan Kabuli."
      - "In 1584 Akbar’s governor Shahbaz Khan attacked Sonargaon and Katrabo, but Isa Khan and Masum Khan beat him on land and water near Egarasindur and Bhawal, and he fell back to Tanda. Isa Khan offered a nominal submission in 1586. Raja Man Singh of Amber, governor from 1594, founded a new capital at Rajmahal and in 1597 sent a fleet and an army under his son Durjan Singh against Katrabo. In September 1597, about twelve miles from Bikrampur, Isa Khan’s boats surrounded the Mughal fleet, and Durjan Singh was killed. Isa Khan died in September 1599, still undefeated, and his son Musa Khan succeeded him."
    facts:
      - [Shahbaz Khan driven back, "1584"]
      - [Durjan Singh killed, "September 1597"]
      - [Death of Isa Khan, "September 1599"]
    markers:
