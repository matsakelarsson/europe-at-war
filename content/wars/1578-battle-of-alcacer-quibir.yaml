notes:
  - Dates are Julian, as usual for the period. The size of the Moroccan army is very uncertain; accounts give from about 50,000 to 100,000 men. Figures for the dead and captured also vary between Moroccan, Portuguese and Spanish sources.
  - Many Portuguese refused to believe that Sebastian was dead, and several pretenders later claimed to be him. The hope of his return, Sebastianism, lived on in Portuguese popular culture for centuries.
  - Philip II’s conquest of Portugal in 1580 has its own entry (War of the Portuguese Succession).
