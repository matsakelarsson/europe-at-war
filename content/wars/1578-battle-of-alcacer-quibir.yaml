steps:
  - title: A Saadian succession war
    date: 1574–1576
    when: "1574"
    borders: "1576-03-11"
    countries: [ma, dz, tn]
    body:
      - The Saadian dynasty had ruled Morocco from Marrakesh and Fez since the 1550s. When Sultan Abdallah al-Ghalib died in 1574, his son Abu Abdallah Mohammed, later called al-Mutawakkil, took the throne, setting aside the claims of his uncles, the brothers Abd al-Malik and Ahmad, who had lived for years in exile in the Ottoman Empire. Abd al-Malik had served the Ottomans and fought on their side at the conquest of Tunis in 1574; he went to Istanbul and won the backing of the Ottoman sultan.
      - In 1576 the governor of Algiers, Ramazan Pasha, invaded Morocco with Abd al-Malik and an army of janissaries and Algerian troops. Near Fez, at al-Rukn, al-Mutawakkil was beaten after the commander of his Andalusian contingent went over to the other side, and on 11 March Abd al-Malik entered Fez. He took Marrakesh soon after, and al-Mutawakkil fled to the Sous and then to the Spanish and Portuguese. Abd al-Malik had the khutba read in the Ottoman sultan’s name, paid the Algerian troops a large sum to go home, kept a guard of janissaries and Zwawa (Kabyle) soldiers and rebuilt his army on Ottoman lines.
    facts:
      - [Death of Abdallah al-Ghalib, "1574"]
      - [Abd al-Malik enters Fez, "11 March 1576"]
