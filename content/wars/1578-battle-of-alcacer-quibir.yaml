id: battle-of-alcacer-quibir
name: Battle of Alcácer Quibir
start: "1578-06"
end: "1578-08-04"
tier: C
summary: The defeat of King Sebastian of Portugal in northern Morocco on 4 August 1578, also called the Battle of the Three Kings or of Wadi al-Makhazin. The young king had taken up the cause of the deposed Saadi sultan Abu Abdallah Mohammed II against his uncle Abd al-Malik, who had taken the throne with Ottoman help in 1576. Sebastian landed at Asilah with an army of perhaps 17,000–23,000 men, including German, Flemish, Spanish and Italian soldiers, and marched inland. Near Ksar el-Kebir it was surrounded by a much larger Moroccan army, strong in cavalry and firearms, and destroyed; thousands were killed and most of the rest captured. Sebastian and Mohammed II died in the battle, and Abd al-Malik died of illness during it. His brother Ahmad al-Mansur succeeded him and grew rich on the ransoms of Portuguese nobles. Sebastian was childless, and the succession crisis that followed brought Portugal under Philip II of Spain in 1580.
countries: [pt, ma]
