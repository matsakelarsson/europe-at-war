  - title: The battle of the three kings
    date: 4 August 1578
    when: "1578-08-04"
    borders: "1578-08-04"
    countries: [pt, ma]
    view:
      center: [-6.00, 35.18]
      size: [80, 70]
    body:
      - On the morning of 4 August the Portuguese army, drawn up in a great square with its baggage inside, faced the Moroccans on the plain between the Wadi al-Makhazin and the Loukkos. The Moroccan army, by most accounts 50,000 men or more, with about 12,000 cavalry, Andalusian exiles, renegades, Turkish troops and Zwawa musketeers, advanced on a broad front and enveloped it. Abd al-Malik directed the battle from a litter. Stukley was killed early by a cannon shot; the Portuguese flanks gave way under the Moroccan cavalry and the musket fire, and after about four hours the square broke.
      - Sebastian charged into the enemy and was cut down; remains said to be his were later handed over to Philip II and buried in the Jerónimos monastery at Belém, though they could never be identified. Al-Mutawakkil drowned in the river as he fled. Abd al-Malik died during the battle, of his illness or, some said, of poison; his death was kept from the troops until the battle was won. By Moroccan figures about 8,000 of the Portuguese army were killed and some 15,000 captured, and only about a hundred escaped to the coast; Portuguese sources give about 7,000 dead.
      - Ahmad was proclaimed sultan on the battlefield as al-Mansur, “the Victorious”. The ransoms of the captured nobles, and the prestige of the victory, made him one of the richest and most powerful rulers of his time; some of the captives later served in the army he sent across the Sahara against Songhai in 1590–1591. In Portugal, where much of the nobility had been killed or captured, Sebastian’s great-uncle, the aged Cardinal Henry, became king and spent his short reign raising the ransoms. When he died in January 1580, Philip II invaded and was crowned king of Portugal in 1581.
    facts:
