  - title: Sebastian’s crusade
    date: June – August 1578
    when: "1578-06"
    borders: "1578-08-01"
    countries: [pt, ma, es]
    body:
      - King Sebastian of Portugal, who had come of age in 1568, had grown up dreaming of a crusade in Africa, where Portugal still held Tangier, Mazagan and Ceuta. He had visited the Portuguese towns in Morocco in 1574, and when al-Mutawakkil asked for help, he saw a chance to win a Moroccan client and to keep the Ottomans away from the Atlantic. His uncle Philip II of Spain and his own advisers warned against it. Sebastian raised an army of perhaps 17,000–23,000 men, including German and Flemish mercenaries, Castilian volunteers and Italian soldiers under the English Catholic adventurer Thomas Stukley, and spent much of the crown’s wealth on it.
      - The fleet left Lisbon on 24 or 25 June 1578, called at Lagos, Cádiz and Tangier, and landed the army at Asilah, where al-Mutawakkil joined it with his followers (6,000 men by one account, far fewer by others). Sebastian then waited nineteen days, giving Abd al-Malik time to gather his forces. On 29 July the army set out overland towards Larache, which it meant to take, but turned inland towards Ksar el-Kebir, marching through the summer heat with its baggage and camp followers. Abd al-Malik, already gravely ill, and his brother Ahmad brought their army north to Ksar el-Kebir, and the two armies camped facing each other near the Loukkos.
    facts:
      - [Fleet leaves Lisbon, "24 or 25 June 1578"]
      - [March from Asilah, "29 July 1578"]
      - [Portuguese army, "about 17,000–23,000 men"]
