id: battle-of-alcacer-quibir
name: Battle of Alcácer Quibir
start: "1576"
end: "1578-08-04"
tier: B
summary: "The defeat of King Sebastian of Portugal in northern Morocco on 4 August 1578, also called the Battle of the Three Kings or, in Morocco, of Wadi al-Makhazin. It grew out of a Saadian succession war: in 1576 Abd al-Malik, with troops from Ottoman Algiers, drove his nephew, the sultan Abu Abdallah Mohammed al-Mutawakkil, from Fez and Marrakesh, and al-Mutawakkil turned to Portugal. Sebastian, young, unmarried and set on a crusade, landed at Asilah with an army of perhaps 17,000–23,000 men, including German, Flemish, Castilian and Italian soldiers, and marched inland. Near Ksar el-Kebir it was surrounded by a much larger Moroccan army, strong in cavalry and firearms, and destroyed; thousands were killed and most of the rest captured. Sebastian and al-Mutawakkil died in the battle, and Abd al-Malik died of illness during it. His brother Ahmad al-Mansur succeeded him and grew rich on the ransoms of Portuguese nobles. Sebastian was childless, and the succession crisis that followed brought Portugal under Philip II of Spain in 1580."
