  - title: Withdrawal from Brunei, and Sulu
    date: May – June 1578
    when: "1578-06"
    borders: "1578-06-26"
    countries: [bn, ph, es]
    body:
      - The Spaniards were soon struck by disease, which the sources describe as cholera or dysentery, and harried by Bruneian forces; Bruneian tradition credits a counter-attack led by the bendahara, Sakam, with about 1,000 men. After 72 days Sande abandoned Kota Batu and sailed back to Manila, which he reached on 26 June 1578. The sultan returned and rebuilt the capital.
      - "From Brunei, Sande sent Captain Esteban Rodríguez de Figueroa with part of the fleet to Sulu and Mindanao. The sultan of Sulu submitted at Jolo and promised tribute, though the submission did not last, and the Spaniards went on to Maguindanao. These voyages opened the long wars between Spain and the sultanates of the south. Spain made no further attempt on Brunei, and relations slowly improved: in 1599 the governor Francisco Tello de Guzmán wrote to ask for normal trade. Brunei, cut off from Luzon, turned to its own coasts of Borneo."
    facts:
      - [Spanish withdrawal, "26 June 1578, after 72 days"]
      - [Sulu, "submitted to Spain, 1578"]
