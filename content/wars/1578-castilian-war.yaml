steps:
  - title: Sande’s expedition and the fall of Kota Batu
    date: March – April 1578
    when: "1578-04"
    borders: "1578-04-16"
    countries: [bn, ph, es]
    body:
      - "In the early 16th century Brunei was the main trading power of the seas between Borneo and Luzon. Its royal family was related to the rulers of Manila and Sulu, and Spanish sources record Bruneian influence as far as Manila Bay. When the Spaniards made Manila their capital in 1571, they found themselves rivals of Brunei for the trade and the allegiance of the islands, and the Visayans of Cebu and Panay, long at odds with Brunei’s allies, took the Spanish side. Governor Francisco de Sande, who arrived in 1575, regarded Brunei as the source of the spread of Islam in the archipelago. In a letter of 13 April 1578 he accused Sultan Saiful Rijal of stirring up the people of Luzon against Spain and ordered him to send no more preachers to the islands. A dispute at the Bruneian court gave him an opening: two nobles who had fallen out with the sultan, Pengiran Seri Lela and Pengiran Seri Ratna, offered the Spaniards their help."
      - Sande sailed from Manila in March 1578 with about 40 vessels and, by the counts in the sources, 2,000 to 2,200 men, among them about 400 Spaniards and Mexicans, 1,500 Filipino auxiliaries and 300 Bruneians. Off Brunei he sent a second demand, which was again refused. On 14 April the Spanish fleet attacked the Bruneian ships in the harbour and destroyed about fifty of them, and by 16 April it held the capital, Kota Batu, on the Brunei river. The palace and its treasures were taken, many townspeople were killed and the great mosque was burned. Saiful Rijal and his court withdrew to Jerudong on the coast to the west, and later inland up the Brunei river, to gather his forces.
    facts:
      - [Spanish fleet, "about 40 ships, 2,000–2,200 men"]
      - [Kota Batu taken, "14–16 April 1578"]
