notes:
  - The war is known mainly from Spanish letters and reports and from the Bruneian genealogies (the Silsilah Raja-Raja Brunei); the two disagree on many details. The Spaniards called Brunei “Borneo”, a name that later passed to the whole island. The sultan is called Lixar or Nula Alam in Spanish records.
  - The Spanish–Moro wars that began with the expeditions to Sulu and Mindanao in 1578 are told in their own story.
