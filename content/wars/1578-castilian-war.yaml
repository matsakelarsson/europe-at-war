id: castilian-war
name: Castilian War
start: "1578-03"
end: "1578-06-26"
tier: B
summary: "The Spanish attack on the sultanate of Brunei in 1578, which the Malays call the Perang Kastila, “the war of the Castilians”. Brunei, the leading Muslim power of northern Borneo, had family and trading ties with Manila and the Sulu archipelago, and the Spaniards, who had taken Manila in 1571, saw its merchants and preachers as rivals to their own rule and missions in the islands. When Sultan Saiful Rijal rejected Governor Francisco de Sande’s demands to stop Muslim preaching and to admit Christian missionaries, Sande sailed from Manila in March 1578 with about 40 ships and more than 2,000 men, most of them Filipino auxiliaries, taking with him two Bruneian nobles, Pengiran Seri Lela and Pengiran Seri Ratna, who hoped for Spanish help against the sultan. On 14 April the fleet destroyed Brunei’s ships in the harbour, and by 16 April the Spaniards held the capital, Kota Batu; they burned its great mosque, and the sultan withdrew to Jerudong. Disease and Bruneian counter-attacks forced the Spaniards out after 72 days, and on 26 June they sailed back to Manila; the sultan returned and rebuilt his capital. A Spanish force sent on to Sulu obtained the submission of Jolo, the start of three centuries of wars between Spain and the Muslim states of the southern Philippines. Brunei kept its independence but never regained its influence in Luzon."
