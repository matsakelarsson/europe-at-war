  - title: Tabriz and the Treaty of Constantinople
    date: 1585–1590
    when: "1585-09-23"
    borders: "1590-03-21"
    countries: [ir, az, am, ge, tr]
    body:
      - In September 1585 Osman Pasha, with Ferhad Pasha and Crimean and Circassian troops, took Tabriz, the old Safavid capital; he died of illness a few weeks later, but the city stayed Ottoman for eighteen years and its governor built a great fortress on the site of the Aq Qoyunlu palace. Hamza Mirza tried to win it back and was murdered by courtiers in 1587. In 1587 the governor of Baghdad took Luristan and Hamadan, and in 1588 Ferhad Pasha marched through Georgia into Karabakh and took Ganja. Many Qizilbash chiefs submitted to the Ottomans to save their lands, while in the east the Uzbeks took Herat and Mashhad.
      - In 1588 the Qizilbash leader Murshid Quli Khan put the sixteen-year-old Abbas on the throne in place of his father. Unable to fight on two fronts, Abbas made peace at Constantinople on 21 March 1590. Persia gave up Tabriz and most of Azerbaijan, Karabakh, Ganja, Shirvan, Dagestan, eastern Georgia and Armenia, and parts of Luristan and Kurdistan, and sent his young nephew Haydar Mirza to Constantinople as a hostage. It was the greatest extent of the Ottoman Empire in the east, but it lasted only until Abbas, with his new army, struck back in 1603.
    facts:
      - [Tabriz taken, "23–25 September 1585"]
      - [Ganja taken, "1588"]
      - [Treaty of Constantinople, "21 March 1590"]
