steps:
  - title: Çıldır, Shirvan and the Battle of Torches
    date: 1578–1583
    when: "1578-08-09"
    borders: "1583-05"
    countries: [tr, ge, az, ru]
    body:
      - Tahmasp I died in 1576, and Persia fell into civil war between the Qizilbash tribes under his sons Ismail II and the half-blind Mohammad Khodabanda. Against the advice of his grand vizier Sokollu Mehmed Pasha, Sultan Murad III went to war. In August 1578 Lala Mustafa Pasha marched from Erzurum into Georgia and on 9 August destroyed a Safavid and Georgian army at Çıldır; thousands of prisoners were killed after the battle. Tiflis fell on 24 August, the king of Kakheti agreed to pay tribute, and in September the Ottomans took Sheki and Shirvan.
      - Lala Mustafa left Özdemiroğlu Osman Pasha to hold Shirvan from Derbent. The Safavids struck back under the crown prince Hamza Mirza and the vizier Mirza Salman. In November 1578 they routed a Crimean Tatar army at Mollahasanli and captured its commander, Adil Giray, who was later killed in Qazvin, and in 1581 they defeated another Ottoman and Crimean force. But in May 1583, in a battle at Baştepe near Derbent that went on through the night by torchlight, Osman Pasha defeated the Safavid army of Imam Quli Khan. Shirvan and Dagestan stayed in Ottoman hands until the end of the war, and Lezgin and other Sunni mountaineers helped the Ottomans clear out the Safavid garrisons.
    facts:
      - [Battle of Çıldır, "9 August 1578, Ottoman victory"]
      - [Tiflis taken, "24 August 1578"]
      - [Battle of Torches, "9–11 May 1583, Ottoman victory"]
