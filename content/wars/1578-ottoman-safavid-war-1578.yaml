id: ottoman-safavid-war-1578
name: Ottoman–Safavid War (1578–1590)
start: "1578"
end: "1590-03-21"
tier: B
summary: A war in which the Ottoman Empire, under Murad III, exploited the turmoil in Safavid Persia after the death of Shah Tahmasp I to conquer the Caucasus and north-western Iran. Lala Mustafa Pasha won at Çıldır in 1578 and took Tiflis and Shirvan; Özdemiroğlu Osman Pasha secured Shirvan and Dagestan in the Battle of Torches (1583) and took Tabriz in 1585. With the Uzbeks overrunning Khorasan at the same time, the young Shah Abbas I made peace at Constantinople in 1590, giving up Tabriz, Azerbaijan, the Caucasus and parts of western Iran.
countries: [tr, ir, az, am, ge, ru]
sides:
  - id: ot
    name: Ottoman Empire and the Crimean Khanate
    polities: [ottoman]
    ink: teal
    moves: Ottoman and Crimean moves
    success: Ottoman success
  - id: saf
    name: Safavid Persia and its Georgian vassals
    polities: [persia]
    ink: green
    moves: Safavid moves
    success: Safavid success
notes:
  - The Georgian kingdoms changed sides during the war. Kakheti paid tribute to the Ottomans from 1578, and Simon I of Kartli, released by the Safavids, fought the Ottomans for years.
  - The treaty of 1590 is also called the Treaty of Ferhad Pasha, after the Ottoman commander who negotiated it.
