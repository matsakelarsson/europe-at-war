notes:
  - "“Moro” is the Spanish word for Moor, given to the Muslims of the Philippines by people who had fought the Muslims of Spain; it covers many peoples, among them the Tausug of Sulu, the Maguindanao, the Maranao, the Iranun, the Sama and the Yakan. Long a term of contempt, it has since been taken up by many as a common name (Bangsamoro, the Moro nation)."
  - "The Spanish and British called the sultanates’ raiders pirates (piratas); the Malay word lanun, pirate, comes from the name of the Iranun. To the sultanates the raids were war against Spain and its Christian subjects and a trade in captives on which their economy depended; to the Visayans and Tagalogs who suffered them, they were the terror of the coasts. Both sides took and kept slaves."
  - Most of the record is Spanish. Numbers of dead and captured are Spanish figures and are best read as orders of magnitude; Sulu and Maguindanao traditions and the sultanates’ own letters give the other side in part. Sources differ on some dates, among them that of the treaty of 1851 (19 or 30 April).
  - The base map shows Spanish rule spreading to Zamboanga (1718), Davao (1848), Cotabato (1861), southern Palawan (1872) and Lake Lanao (1895); Sulu is shown as its own state until 1904, as the sultan kept his internal rule.
