  - title: Zamboanga rebuilt and the raids of the 1750s
    date: 1718–1764
    when: "1718"
    borders: "1720-12-01"
    countries: [ph]
    body:
      - In 1712 the king ordered Zamboanga reoccupied, and under Governor Fernando Manuel de Bustillo Bustamante the engineer Juan Sicarra rebuilt the fort in 1718–1719 as the Real Fuerte de Nuestra Señora del Pilar de Zaragoza. In 1720–1721 an army put at 3,000 to 5,000 men, led by Dalasi, raja of Bulig, or by the datu of Butig in other accounts, besieged it for two months, but the governor of the fort, Amorrea, held out. From then on Zamboanga remained a Spanish stronghold and a base for the fleets sent against the raiders.
      - In Sulu, Sultan Azim ud-Din I, opposed by a faction led by his brother Bantilan, fled to Manila, where he arrived in January 1749 and was baptised as Fernando I in 1750. The Spanish meant to restore him as a Christian ally, but after a letter of 1751 was read as treachery he was arrested and held for about ten years. Bantilan ruled Sulu, and the raids on the Christian provinces, by Sulu, Maguindanao and Iranun fleets, reached their height in the 1750s; Spanish fleets sent from Iligan and Zamboanga burned raiders’ boats and settlements in return.
      - The Visayan towns built stone watchtowers, forts and fortified churches along the coasts, among them the fortress church of Miagao in Panay (1786–1797), and organised boat patrols to warn of and fight off the raiders. When the British took Manila in 1762 they freed Azim ud-Din, who returned to Jolo in 1764 and ruled until 1773.
    facts:
      - [Fort Pilar rebuilt, "1718–1719"]
      - [Siege of Zamboanga, "1720–1721, two months, Spanish held"]
      - [Azim ud-Din I in Manila, "1749–1763"]
