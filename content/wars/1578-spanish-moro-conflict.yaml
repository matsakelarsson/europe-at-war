id: spanish-moro-conflict
name: Spanish–Moro conflict
start: "1578"
end: "1899"
tier: A
summary: "The three centuries of war between Spain and the Muslim sultanates of Mindanao and the Sulu archipelago, whose peoples the Spanish called Moros. After taking Manila in 1571, the Spanish tried again and again to bring Sulu, Maguindanao and the Maranao of Lake Lanao under their rule and to stop the raids that the sultanates’ fleets made on the Christian towns of the Visayas and Luzon. In the 1630s Governor Sebastián Hurtado de Corcuera built a fort at Zamboanga, defeated Sultan Kudarat of Maguindanao and occupied Jolo, but the Spanish gave up Jolo in 1646 and Zamboanga in 1663. From the rebuilt fort at Zamboanga (1718) they fought a long war of raids and counter-raids, which reached its height in the 1750s and again from the 1770s, when Iranun and Banguingui fleets sailing under the protection of Sulu’s datus raided across Southeast Asia for the slave markets of Jolo; historians estimate that 200,000 to 300,000 people were taken between 1770 and 1870. Steam gunboats turned the balance: the Spanish destroyed the Banguingui strongholds on Balangingi in 1848, took Jolo in 1851 and again in 1876, occupied Cotabato, Davao and Palawan, and reached Lake Lanao in 1895. Spain never fully subdued the sultanates, and handed its claim to the United States in 1898–1899."
countries: [ph, bn, my]
