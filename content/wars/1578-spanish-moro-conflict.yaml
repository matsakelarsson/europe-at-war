steps:
  - title: Brunei, Jolo and the Rio Grande
    date: 1578–1599
    when: "1578"
    borders: "1596-04-01"
    countries: [ph, bn]
    body:
      - By 1578 the Spanish, who had made Manila their capital in 1571, ruled the coasts of Luzon and the Visayas. To the south lay Muslim states with older ties to Brunei, Ternate and the Malay world. The Sultanate of Sulu, founded by its own tradition in about 1450, ruled the islands from Basilan to Tawi-Tawi from its capital at Jolo; in the Cotabato valley of Mindanao the sultanate of Maguindanao at the mouth of the Rio Grande and the rajahs of Buayan upstream were rivals and sometimes allies. In 1578 Governor Francisco de Sande attacked Brunei, whose royal house was related to the former Muslim rulers of Manila (the Castilian War, told on its own), and sent Esteban Rodríguez de Figueroa to Jolo. Figueroa reached the town in June 1578, won a fight with its defenders and was promised tribute, but he did not occupy Jolo, and the tribute was not paid for long.
      - In 1596 Figueroa, who had been granted the right to conquer Mindanao at his own expense, sailed up the Rio Grande (the Pulangi) in February with 214 Spanish soldiers and many Visayan auxiliaries. Tampakan and Lumakan, rivals of Buayan, joined him. At Buayan the warriors of Rajah Silongan, led by the datus Silonga, Malaria and Bulusan, attacked the Spanish from several sides in swamp and thick forest; Figueroa was struck on the head and died the next day. His master of the camp, Juan de la Xara, withdrew down the river and set up a post near friendly Tampakan.
      - Juan Ronquillo, sent from Manila with reinforcements, defeated Buayan and a fleet that the Sultan of Ternate had sent to help it, but the Spanish could not hold the river. They kept a small garrison at La Caldera, near the western tip of Mindanao, and in 1599, when English ships were reported, the governor had it burned and withdrawn.
    facts:
      - [Figueroa at Jolo, "June 1578"]
      - [Figueroa’s expedition, "February 1596, 214 Spaniards and Visayan auxiliaries"]
      - [Battle at Buayan, "1596, Buayan victory; Figueroa killed"]
