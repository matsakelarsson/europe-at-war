  - title: The Rio Grande and Lake Lanao
    date: 1886–1899
    when: "1887-01"
    borders: "1895-03-10"
    countries: [ph]
    body:
      - On the Rio Grande, Datu Utto of Buayan had become the strongest chief of the valley and fought the Spanish posts. In January 1887 Governor-General Emilio Terrero led about 1,000 men up the river; his columns took the forts of Lintunkan on 12 February, and on 10 March Utto signed peace terms. The campaign cost the treasury more than a million pesos and did not bring the upriver datus under Spanish rule.
      - Lake Lanao was the next aim. In April 1891 Governor-General Valeriano Weyler landed at Parang on Illana Bay and attacked the Maranao settlements between the bay and the lake; at Maladi on 30 April Sultan Benidel and eleven datus were among 85 Maranao killed. Weyler’s columns burned settlements but withdrew, and he was relieved in November 1891. In 1894 Governor-General Ramón Blanco gathered about 3,000 troops at Iligan, built a road and a railway up the Agus valley and carried gunboats to the lake. On 10 March 1895, after a four-hour fight, his troops stormed the kota (fort) of Marawi, whose defender, Amai Pakpak, was killed with most of his family and men.
      - The destruction of the Spanish fleet at Manila Bay on 1 May 1898 cut the south off from Manila. The garrisons on Lake Lanao scuttled their gunboats and left Marawi, and the Spanish gathered their troops at Zamboanga. Under the Treaty of Paris they handed their claim to the United States, whose troops arrived at Jolo in May 1899 and at Zamboanga in December 1899. The Moros’ war against the Americans is told in the Moro Rebellion.
    facts:
      - [Terrero’s campaign, "January – March 1887"]
      - [Battle of Maladi, "30 April 1891"]
      - [Marawi taken, "10 March 1895"]
      - [Americans at Jolo, "May 1899"]
