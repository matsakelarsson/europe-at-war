  - title: Zamboanga, Kudarat and Jolo
    date: 1635–1640
    when: "1635-06-23"
    borders: "1637-03-13"
    countries: [ph]
    body:
      - The strongest ruler in Mindanao was now Kudarat, Sultan of Maguindanao from about 1619, who had allied himself with the Dutch East India Company and whose fleets raided the Visayas. To block the raiders’ route into the Visayan seas, the Spanish began a stone fort at Zamboanga, at the south-western tip of Mindanao, on 23 June 1635; the Jesuit engineer Melchor de Vera laid out the Real Fuerza de San José, and Captain Juan de Chaves led the troops who built and held it.
      - The new governor, Sebastián Hurtado de Corcuera, led an army against Kudarat himself. On 13 March 1637 he sailed from Zamboanga and landed at Lamitan, Kudarat’s fortified capital, with about 800 soldiers, most of them recruited in Peru. The town was taken by surprise and Spanish captives were freed; the Spanish took eight bronze cannon, 27 lantakas (swivel guns) and 100 muskets, but Kudarat escaped to the hills and fought on. Corcuera returned to Manila in triumph.
      - On 4 January 1638 Corcuera sailed against Jolo with about 500 Spanish soldiers and 1,000 Filipino auxiliaries in 80 vessels. The town was defended by about 4,000 men, among them allies from Borneo and Makassar. After three months of siege, in which both sides lost heavily, a truce was agreed, the sultan withdrew and the Spanish put a garrison in Jolo. In April 1639 a Spanish expedition under Francisco de Atienza went up from Iligan to Lake Lanao. Kudarat called the datus of the lake to a council; a Spanish envoy recorded his speech urging them to resist (“Be men. Let me aid you to resist.”), and in 1640 the Maranao drove the Spanish garrison from the lake. The Spanish did not return to the inland of Lanao for more than 250 years.
    facts:
      - [Fort at Zamboanga begun, "23 June 1635"]
      - [Lamitan taken, "March 1637"]
      - [Siege of Jolo, "January – April 1638"]
      - [Spanish driven from Lake Lanao, "1640"]
