  - title: Raids on the Visayas
    date: 1599–1605
    when: "1599-07"
    borders: "1600-06-01"
    countries: [ph]
    body:
      - Within months of the Spanish withdrawal from Mindanao, the sultanates struck back. In July 1599 a fleet of about 50 caracoas, large outrigger warships, with some 3,000 men from Maguindanao and Buayan under the datus Sali and Silongan, sailed past Negros to Panay, sacked the town where the Spanish alcalde mayor lived, burned houses, churches and boats, and carried off about 800 people, most of them Christian Visayans. Other bands raided Cebu and Negros. The Visayans under Spanish rule had been disarmed and could do little to defend themselves; many fled to the hills.
      - In 1600 the same datus, joined by chiefs from Sulu, came back with about 70 ships and 4,000 men and attacked Arévalo on Panay. Its commander, Juan García de Sierra, gathered the townspeople, repaired the wooden fort and, with about 70 Spaniards and their Visayan allies, drove off the attackers, who stopped at Guimaras and went home. In the following years raids reached Leyte, the Calamianes and Batangas.
      - To stop the raids at their source, Governor Francisco de Tello sent Juan Juárez Gallinato with about 200 Spaniards against Jolo in February 1602. Jolo stood on a hill reached by two narrow roads, and its defenders, about 1,000 men under Sultan Batarah Shah Tengah, held out; by late May Gallinato’s men were sick and short of food, and he burned his camp and withdrew. In 1605 the Jesuit Melchor Hurtado negotiated a peace between the Spanish, Maguindanao and Buayan, but raids and Spanish reprisals went on.
    facts:
      - [Raid on Panay, "July 1599, about 50 ships and 3,000 men; about 800 captives"]
      - [Attack on Arévalo, "1600, beaten off"]
      - [Spanish expedition to Jolo, "February – May 1602, Sulu victory"]
    markers:
