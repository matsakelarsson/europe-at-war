  - title: Steam gunboats, Balangingi and Jolo
    date: 1848–1861
    when: "1848-02-16"
    borders: "1848-02-16"
    countries: [ph]
    body:
      - Governor-General Narciso Clavería bought steam gunboats, which could chase the raiders against wind and current, and in early 1848 sent a fleet of 19 warships, among them two steamers led by the Reina de Castilla, under Brigadier José Ruiz de Apodaca, with infantry, artillery and about 150 auxiliaries from Zamboanga, against Balangingi. The swampy island, covered in mangroves, was defended by about 1,000 men in four forts. Between 16 and 22 February the Spanish stormed them one after another; at Sipac they burned 340 bodies after the fighting. About 450 Banguingui were killed and some 150 civilians taken prisoner, the Spanish lost 22 killed and about 200 wounded, and they freed several hundred captives and burned about 150 boats.
      - In the same year José Oyanguren founded a Spanish settlement at Davao, and in 1849 Sulu signed a treaty with the British, represented by James Brooke of Sarawak, which alarmed the Spanish. Governor Antonio de Urbiztondo attacked Jolo, and at the end of February 1851 his troops took its forts; Spanish accounts give about 300 defenders killed and more than 100 guns taken, for 3 Spanish killed and 92 wounded. In April 1851 Sultan Muhammad Pulalun signed a treaty that the Spanish read as accepting their sovereignty and the Tausug as a treaty of friendship between equals.
      - Raiding declined but did not end. The Spanish set up a military government of Mindanao, built up a fleet of steam gunboats and in 1861 occupied Cotabato, the centre of Maguindanao; the datus of the upper valley, led by Buayan, kept up the fight.
