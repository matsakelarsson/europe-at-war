  - title: Truces, Koxinga and the retreat from Mindanao
    date: 1645–1671
    when: "1645-06-25"
    borders: "1663-01-15"
    countries: [ph]
    body:
      - The cost of Corcuera’s wars, and Dutch attacks in the north, led the Spanish to seek peace. On 25 June 1645 Governor Diego Fajardo signed a treaty with Kudarat that allowed Spanish missionaries to serve the Christians in his lands, a church to be built and trade to go on. In 1646 the Spanish made peace with Sulu and withdrew their garrison from Jolo; the Dutch, who came to attack it that year, found it empty.
      - The peace did not last. In 1655 Kudarat was at war with the Spanish again, and Moro fleets raided the Visayas and the coasts of Luzon; in 1656 a Spanish fleet burned his town and the Moro settlements of Sibuguey Bay. Then a threat from the north changed everything. In 1662 Zheng Chenggong (Koxinga), who had just driven the Dutch from Taiwan, demanded tribute from Manila. Governor Sabiniano Manrique de Lara called in his outlying garrisons to defend the capital. Zamboanga and Iligan were evacuated in January 1663, and the posts in the Moluccas were given up.
      - Koxinga died in June 1662 without attacking, but the Spanish did not come back. Jesuit attempts to have the fort at Zamboanga rebuilt in 1666 and 1672 came to nothing. Kudarat died at Simuay in 1671, aged about ninety, after a reign of more than fifty years in which Maguindanao was the strongest power in the southern Philippines. For half a century the sultanates’ fleets met no Spanish post south of the Visayas except on the north-east coast of Mindanao.
    facts:
      - [Treaty with Kudarat, "25 June 1645"]
      - [Spanish leave Jolo, "1646"]
      - [Zamboanga evacuated, "January 1663"]
      - [Death of Kudarat, "1671"]
