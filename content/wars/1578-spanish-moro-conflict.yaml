  - title: Jolo occupied, and North Borneo
    date: 1876–1887
    when: "1876-02"
    borders: "1876-03-01"
    countries: [ph, my]
    body:
      - In February 1876 Governor-General José Malcampo sailed from Manila with ten steamers, gathered transports and gunboats at Zamboanga, and landed near Jolo on 22 February. After a turning column lost its way and suffered badly from thirst, the main attack on 29 February took the forts of the datus and of the sultan. Sultan Jamal ul-Azam withdrew inland to Maimbung, and the Spanish built a walled town and a fort at Jolo, with Pascual Cervera as its first governor. Fevers killed many of the garrison, and in September 1877 about 2,000 Tausug attacked the town for three days before they were driven off.
      - From 1878 the garrison and townspeople of Jolo were attacked again and again by juramentados, as the Spanish called men who had sworn, in a ritual the Tausug call parang sabil, to die killing Christians. On 22 July 1878, at Licup, the sultan signed a treaty by which, in the Spanish reading, he accepted Spanish sovereignty over the archipelago, keeping his internal rule and receiving a pension. The Spanish attacked Maimbung in 1887.
      - Sulu also claimed north-eastern Borneo, which by its account Brunei had ceded to it. On 22 January 1878 Sultan Jamal ul-Azam signed an agreement giving the land to Gustav Overbeck and Alfred Dent, whose company became the British North Borneo Company, for a yearly payment. The Malay text’s key word, pajakkan, has been read by the sultan’s heirs and the Philippines as a lease and by Britain and later Malaysia as a cession. In the Madrid protocol of 1885 Britain and Germany recognised Spanish sovereignty over Sulu, and Spain gave up its claim to North Borneo. The dispute over Sabah is still open.
    facts:
      - [Jolo taken, "29 February 1876"]
      - [Grant of North Borneo, "22 January 1878"]
      - [Treaty of Licup, "22 July 1878"]
      - [Madrid protocol, "7 March 1885"]
