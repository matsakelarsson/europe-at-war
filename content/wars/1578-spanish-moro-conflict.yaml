  - title: The Iranun, the Banguingui and the slave trade
    date: 1768–1848
    when: "1768"
    borders: "1800-01-01"
    countries: [ph, my, id]
    body:
      - From the 1760s British country traders brought guns, opium and cloth to Jolo and carried away sea cucumbers, pearls, birds’ nests and other goods for the China market. To gather them the datus of Sulu needed labour, and slave raiding grew into an industry. Its seamen were the Iranun of the coast of Illana Bay and the Banguingui (Balangingi Sama) of the islands of Tongkil and Balangingi, east of Jolo, who formed the bulk of the sultan’s navy and sailed under the protection of Sulu’s datus in large oared warships, the lanong of the Iranun and the garay of the Banguingui, rowed by captives.
      - Fleets set out every year, usually in August and September, the season the colonial towns called the “pirate wind”. From 1774 to 1794 about 100 to 200 vessels sailed each year from the Sulu Sea. They struck the coasts of the Visayas and Luzon, Borneo, Sulawesi and the Moluccas and reached as far as Java and the Strait of Malacca. Historians estimate that between 1770 and 1870 some 200,000 to 300,000 people were taken, most of them Tagalogs, Visayans and Malays; they were sold in the markets of Jolo and Tawi-Tawi or put to work fishing, diving and farming, and by 1850 slaves may have made up half the population of the Sulu sultanate.
      - The Spanish answered with more coastal forts and watchtowers, with flotillas of armed boats and with expeditions against the raiders’ bases, and British and Dutch warships patrolled their own coasts, but sailing ships were no match for the fast oared fleets. For the sultans and datus of Sulu, the raiding fleets were also a weapon in their wars with Spain and a source of wealth and power.
    facts:
      - [Raiding vessels a year, "about 100–200 (1774–1794)"]
      - [People enslaved, "an estimated 200,000–300,000 (1770–1870)"]
