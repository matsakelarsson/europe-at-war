id: fall-of-pajajaran
name: Banten’s conquest of Sunda (fall of Pajajaran)
start: "1579"
end: "1579"
tier: C
summary: "The end of the Hindu kingdom of Sunda in western Java, whose capital, Pakuan Pajajaran, near today’s Bogor, was taken and destroyed by the Muslim sultanate of Banten in 1579. Sunda had lost its main ports to the forces of Demak and Cirebon in 1527, when Fatahillah took Sunda Kelapa and renamed it Jayakarta, and Banten, until then a Sundanese port, became the seat of a new sultanate under Hasanuddin, a son of Sunan Gunungjati of Cirebon. The Sundanese king Surawisesa is credited with fifteen battles against the Muslim forces before a peace of 1531, but the attacks resumed under his successors. In the 1550s Hasanuddin sent his son Maulana Yusuf against Pakuan; its walls and moats held, but the kings of Sunda often could not live there. The last king, Raja Mulya (Prabu Surya Kencana, the Nusiya Mulya of the Carita Parahyangan), moved his court west to Pulasari on the slopes of Mount Pulasari, and after 1576 the kingdom fell apart under Banten’s pressure. In 1579 Maulana Yusuf, sultan since 1570, took Pakuan, according to tradition after a guard opened the gates; the city was razed, and the sacred stone that served as the throne of the Sundanese kings was carried to Banten to become the throne of its sultans. Banten took over most of Sunda’s lands, while the regalia of the Sundanese kings were taken to Sumedang Larang in the east, whose ruler, Geusan Ulun, claimed Sunda’s succession until Mataram absorbed his principality. The Baduy of the Banten highlands, former subjects of Sunda, were left to keep their old religion."
