steps:
  - title: Paulo Dias de Novais and the first war
    date: 1575–1589
    when: "1579"
    borders: "1585-09-30"
    countries: [ao]
    body:
      - Ndongo, a Kimbundu-speaking kingdom between the Lucala and Kwanza rivers, had once paid tribute to Kongo. In the 1550s its ngola broke away and asked Portugal for recognition, and an embassy of 1560 led by Paulo Dias de Novais, grandson of the navigator Bartolomeu Dias, was held at the ngola’s court for years. Its letters spoke of silver mines in the interior. King Sebastian then granted Dias de Novais Angola as a hereditary captaincy, and on 11 February 1575 he landed with soldiers and settlers near the island of Luanda, whose shell money belonged to Kongo; he founded São Paulo de Luanda the next year. At first relations with Ngola Kilombo kia Kasenda were friendly, and Dias de Novais sent an envoy, Pero da Fonseca, to live at the capital, Kabasa.
      - "Portuguese traders already in the country resented the newcomer. In 1579 one of them, Francisco Barbudo, told the ngola that Dias de Novais meant to conquer Ndongo for its mines and that his envoy was a spy. The ngola had the Portuguese at Kabasa killed, and with them almost a thousand Kongo people living there, and seized Portuguese traders’ goods across the kingdom. Dias de Novais, with about 60 Portuguese and 200 African soldiers, fortified a camp at Anzele, between the Kwanza and the Bengo, and with two cannon threw back an army reported at 12,000. Reinforcements arrived on 23 February 1580, and Kongo’s King Álvaro I, who had been restored with Portuguese help after the Jaga invasion, sent an army said to number 60,000, with 120 Portuguese, but it failed to cross the Bengo in 1581."
      - Dias de Novais pushed up the Kwanza by boat, made many sobas his vassals, and in 1582 founded the fort of Massangano at the meeting of the Kwanza and the Lucala. On 25 August 1585, at Casicola, Captain André Ferreira Pereira with 130 Portuguese and as many as 10,000 African auxiliaries defeated an Ndongo army that included much of its nobility, and in September the ngola himself was ambushed and routed on the Lucala. Many sobas of the Ilamba district near Luanda went over to the Portuguese, who took the captives of these wars to Luanda and sold them to Brazil and São Tomé. Dias de Novais died at Massangano on 9 May 1589, ruined by the cost of the conquest.
    facts:
      - [Dias de Novais lands at Luanda, "11 February 1575"]
      - [Massacre at Kabasa, "1579"]
      - [Massangano founded, "1582"]
      - [Battle of Casicola, "25 August 1585, Portuguese victory"]
