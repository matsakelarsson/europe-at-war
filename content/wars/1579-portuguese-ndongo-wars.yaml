  - title: Queen of Matamba
    date: 1631–1641
    when: "1631"
    borders: "1635-12-31"
    countries: [ao]
    body:
      - Left without allies, Njinga moved north-east into Matamba, a kingdom on the upper Kwango that had recently been forced to accept Ndongo’s overlordship and where women had ruled before. In 1631 she captured and deposed its queen, Mwongo Matamba, and by 1635 she ruled the whole kingdom. She reorganised her army on Imbangala lines and turned Matamba into a trading power, gaining control of slave-supplying lands along the Kwango and selling captives to traders who carried them to the coast, so drawing trade away from the Portuguese.
      - Njinga built up an alliance of Matamba, the Ndongo lords still loyal to her and, for a time, Kasanje, and she found friends among the people of Kisama and the Dembos and in Kongo. After 1635 the Kisama attacked Portuguese posts between the Kwanza and the Bengo, and the Portuguese, isolated, made peace with Kasanje in 1639. Njinga sent peace overtures to Luanda, offering an alliance if Portugal would let her return to Ndongo, but refused to rejoin the Church, and no treaty was made.
    facts:
      - [Mwongo Matamba deposed, "1631"]
      - [Njinga rules all of Matamba, "By 1635"]
      - [Portuguese peace with Kasanje, "1639"]
