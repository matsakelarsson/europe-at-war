  - title: Peace and Njinga’s last years
    date: 1648–1663
    when: "1656-10-12"
    borders: "1657-01-31"
    countries: [ao]
    body:
      - The war with Portugal dragged on, but both sides were exhausted. Talks began in 1651; Njinga wanted the release of her sister Kambu, now known as Barbara, and a settled succession, and feared that Njinga a Mona and the Imbangala in her army might replace her. She had begun to return to Christianity, welcoming Italian Capuchins to her court. A treaty was agreed in 1656, and on 12 October Kambu arrived at her court. Matamba gave up its claims to the Dembos and to land west of the Lucala, which became the border; Portugal recognised Njinga as queen, promised to help her against Kasanje and Filipe, and agreed to concentrate the slave trade in a market at her capital. On 31 January 1657 Njinga announced the peace to her assembled army and threw down her bow.
      - In her last years Njinga built churches, resettled her people, allowed the women of her war camp to raise children, which Imbangala custom had forbidden, and sought recognition from the pope as a Christian ruler. She died on 17 December 1663 and was buried with both Catholic and Mbundu rites. Her rival Filipe de Sousa died in 1664, and his son João Hari succeeded him at Pungo Andongo, resentful that the treaty had recognised Njinga as queen of Ndongo and Matamba while he was left with a small domain.
    facts:
      - [Peace treaty, "1656 (Kambu returned 12 October)"]
      - [Peace announced to the army, "31 January 1657"]
      - [Death of Njinga, "17 December 1663"]
    markers:
      - kind: capital
        side: pt
        name: Luanda
        date: "1656"
        text: The governor, Luís Martins de Sousa Chichorro, negotiated the peace with Njinga’s envoys.
        lonlat: [13.244, -8.827]
      - kind: capital
        side: ph
        name: Pungo Andongo
        date: 1648–1664
        text: Seat of Filipe de Sousa until his death in 1664, then of his son João Hari.
        lonlat: [15.584, -9.663]
