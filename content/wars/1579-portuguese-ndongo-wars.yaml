  - title: The Dutch alliance
    date: 1641–1648
    when: "1647-10-29"
    borders: "1647-11-01"
    countries: [ao]
    body:
      - "When the Dutch West India Company took Luanda in August 1641 and the Portuguese retreated to Massangano, Njinga quickly allied with the Dutch, opened her slave trade to them and received firearms. Her lieutenant Njinga a Mona brought most of the Dembos, between Luanda and Kongo, under her control, and she moved her war camp west to Kavanga, north of the Bengo, from where she won back large parts of Ndongo between 1641 and 1644. Her advance also alarmed her neighbours: she occupied the Wandu district of Kongo, which angered King Garcia II, and Kasanje led a coalition of Imbangala against her. In 1644 she defeated the Portuguese at Ngoleme."
      - "In March 1646 the captain-major Gaspar Borges Madureira, with 16 horsemen, 330 Portuguese infantry and more than 20,000 African troops, among them the army of Filipe de Sousa and Imbangala mercenaries, surprised her camp at Kavanga. She escaped, but her sister Kambu was captured, together with her archives, which revealed that her other captive sister, Funji, had been sending her Portuguese secrets; the Portuguese reportedly drowned Funji in the Kwanza. The Dutch now sent troops to help her. On 29 October 1647 (25 November in some accounts) at Kombi, north of Massangano, Njinga’s army, a Kongo force and 400–500 Dutch soldiers, some 8,000 men, defeated a Portuguese army of about 30,000, most of them African, killing Madureira and many officers."
      - The allies besieged Massangano, Muxima and Ambaca, but without artillery they could not break the forts, and the Ndongo of Filipe de Sousa stayed loyal to Portugal. In August 1648 a Portuguese fleet from Brazil under Salvador Correia de Sá retook Luanda; the Dutch left without consulting their African allies, and Njinga lifted her sieges and withdrew to Matamba.
    facts:
