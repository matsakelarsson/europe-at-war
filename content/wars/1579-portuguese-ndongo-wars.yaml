id: portuguese-ndongo-wars
name: Portuguese–Ndongo wars
start: "1579"
end: "1671-11-18"
tier: A
summary: "The near-century of wars by which Portugal turned its trading post at Luanda into the colony of Angola and destroyed the Mbundu kingdom of Ndongo, whose kings bore the title ngola. Paulo Dias de Novais, sent to found a colony, landed in 1575, and war broke out in 1579 when the ngola had the Portuguese at his capital, Kabasa, killed. With few soldiers of their own, the Portuguese fought with the levies of African lords (sobas) who submitted to them and, from about 1615, with the Imbangala, warrior bands from south of the Kwanza. They built a line of forts up the Kwanza (Massangano, Cambambe, Ambaca) and in 1618–1619 sacked Kabasa. Ndongo’s great war leader was Njinga (Nzinga) Mbande, who negotiated peace in Luanda in 1622, took power in 1624 and fought Portugal and its puppet king of Ndongo, based at the rock fortress of Pungo Andongo, from 1626. Driven out, she conquered the kingdom of Matamba, allied with the Dutch when they took Luanda in 1641 and won at Kombi in 1647, before the Portuguese recovered Luanda in 1648; in 1656 she made peace as queen of Matamba. In 1671 the Portuguese stormed Pungo Andongo, whose king had turned against them, and annexed what remained of Ndongo; Matamba accepted Portuguese overlordship in 1683. The wars were above all slave wars: captives taken by the Portuguese, their allies and their enemies made Luanda one of the largest slave ports of the Atlantic, from which hundreds of thousands of people were shipped, most of them to Brazil."
countries: [ao]
