  - title: Lucala, Cambambe and the peace of 1604
    date: 1590–1604
    when: "1590-12-29"
    borders: "1604-06-30"
    countries: [ao]
    body:
      - In 1590 the Portuguese tried to strike at the heart of Ndongo and marched on Kabasa. Ndongo had just allied with its eastern neighbour, Matamba, and in late December 1590, near the Lucala, the combined armies crushed the Portuguese. Many sobas who had gone over to Portugal now returned to the ngola, and a counter-offensive won back part of the lost land; but the Portuguese kept most of their earlier conquests, and in 1599 the two sides agreed on a border.
      - With reinforcements from Portugal the governors went on with smaller campaigns, fought largely by African auxiliaries supplied by vassal lords. They took the salt mines of Kisama, south of the Kwanza, which had provided Ndongo’s most valuable trade goods, and in 1602–1604 built a fort at Cambambe, at the falls of the Kwanza, to reach the silver mines they had heard of. There was no silver, only lead. Ndongo’s new king, Ngola Mbandi Kiluanje, asked for peace, and in 1604 governor Manuel Cerveira Pereira’s council agreed to it. With no silver, the slave trade became the colony’s reason for being, and Luanda grew into a great slave port.
    facts:
      - [Portuguese defeat near the Lucala, "December 1590"]
      - [Border agreed, "1599"]
