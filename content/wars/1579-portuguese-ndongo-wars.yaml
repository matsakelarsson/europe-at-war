  - title: Njinga’s embassy and the war for Ndongo
    date: 1621–1629
    when: "1626"
    borders: "1626-10-12"
    countries: [ao]
    body:
      - "Correia de Sousa thought the war unprofitable and opened talks, and Ngola Mbandi sent his sister Njinga to Luanda in 1621–1622. In a famous story, when the governor received her seated with only a mat for her on the floor, an attendant knelt to serve as her chair, so that she could speak to him as an equal. She agreed to an end of hostilities and offered to open Ndongo to Portuguese traders and return runaway slaves, but refused to pay tribute; the Portuguese promised to withdraw from Ambaca, return captured ijiko and drive the Imbangala out of Ndongo. She was baptised in Luanda as Ana de Sousa. The Portuguese did not keep their promises."
      - In 1624 Ngola Mbandi died, by suicide or by poison, and Njinga took power, first as regent for his young son. The boy was in the care of the Imbangala leader Kaza; Njinga married Kaza and had the child killed, took the Imbangala title of tempaza and adopted their war customs and rituals. Many Mbundu nobles did not accept a woman, and one whose mother had been a slave, as ruler, and the new governor, Fernão de Sousa, backed her rival, Hari a Kiluanje of Pungo Andongo. Early in 1626 Njinga besieged Pungo Andongo, but Bento Banha Cardoso relieved it, received the submission of the lords of Ndongo and besieged Njinga on the Kindonga islands from April; after two months, with an epidemic in the camp, she slipped through the lines.
      - Hari a Kiluanje died of the epidemic, and on 12 October 1626 Fernão de Sousa crowned his brother at Pungo Andongo as king of Ndongo, under the name Filipe de Sousa (Ngola Hari). Njinga lived on the run. In 1628 Sousa’s army defeated her again and captured her sisters Kambu and Funji; she escaped, with only a few hundred followers, down the cliffs on ropes into the Baixa de Cassanje, and on 29 May 1629 the Portuguese gave up the pursuit. Kaza and the other Imbangala went over to the Portuguese, and Kasanje turned her away.
    facts:
