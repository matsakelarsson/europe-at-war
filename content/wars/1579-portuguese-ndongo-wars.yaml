  - title: The Imbangala and the fall of Kabasa
    date: 1611–1622
    when: "1618"
    borders: "1621-12-31"
    countries: [ao]
    body:
      - Around 1600 the Portuguese met the Imbangala south of the Kwanza, bands of warriors who lived by raiding, recruited captured boys into their ranks and practised ritual killing and cannibalism, as the English sailor Andrew Battell, who lived among them, described. In 1611 Ngola Mbandi Kiluanje began attacking the markets where Portuguese traders bought slaves inland, and the interim governor Bento Banha Cardoso, a successful and cruel commander, answered with a new war. He made alliances with Imbangala leaders, who from then on served the Portuguese as mercenaries; the most powerful band, that of Kulashingo of Kasanje, crossed north over the Kwanza. Cardoso built a fort at Ambaca on the Lucala and brought the number of Mbundu sobas under Portuguese overlordship to 78.
      - "In 1617 a new ngola, Ngola Mbandi, killed his rivals at court, among them a half-brother, had his sisters Funji, Kambu and Njinga sterilised and killed Njinga’s young son. In Luanda the new governor, Luís Mendes de Vasconcelos, planned to annex Ndongo, and he was joined by discontented Mbundu lords, among them Hari a Kiluanje, lord of Pungo Andongo, who claimed the throne. In 1618, after the Imbangala routed an Ndongo army besieging Ambaca, Vasconcelos marched on Kabasa almost unopposed and sacked it. The war went on for four years, in a time of severe drought, and devastated the country: 190 sobas became Portuguese vassals, thousands of people were captured and shipped as slaves, among them many of Ndongo’s ijiko, the serfs bound to the land, and the ngola fled with his court to the islands of Kindonga in the Kwanza."
      - The Imbangala soon turned on everyone. Kasanje’s band broke with the Portuguese, raided Ndongo and Portuguese vassals alike and sheltered fugitives, until the next governor, João Correia de Sousa, defeated it; Kulashingo was executed in Luanda on 25 May 1622, and the survivors, under a new leader, Kalunga, moved east to the lowlands between the Kwango and the Lui, the Baixa de Cassanje, where they founded the kingdom of Kasanje.
    facts:
