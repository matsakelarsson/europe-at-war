notes:
  - "The main narrative source is António de Oliveira de Cadornega’s História geral das guerras angolanas (1680), written by a soldier who fought in the later wars and told from the Portuguese side; others are governors’ and Jesuit letters and the accounts of the Capuchins Giovanni Antonio Cavazzi and Antonio da Gaeta, who knew Njinga in her last years. Njinga’s own letters survive. Ndongo’s side is otherwise known mostly through these Portuguese and Italian writers and through later Mbundu traditions; army sizes are their estimates and dates often differ by a year."
  - "Njinga’s reputation has changed with the times. Portuguese and missionary writers stressed her adoption of Imbangala customs, including ritual killings, and her later conversion; since the 20th century she has been honoured in Angola as a symbol of resistance to colonial rule, and historians such as Linda Heywood and John Thornton stress her skill as a ruler and diplomat. Estimates of the number of people enslaved through Luanda in the 17th century vary; the Trans-Atlantic Slave Trade Database records several hundred thousand embarked from West Central Africa in these decades."
  - "Kongo’s wars with Angola, and the Dutch occupation of Luanda in 1641–1648, have files of their own; the wars of Matamba after 1671 (Katole, 1681) are described in the last step."
