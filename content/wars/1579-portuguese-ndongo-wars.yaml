      - style: outline
        side: nj
        label: Matamba under Njinga, recognised by Portugal in 1656 (approximate)
        polygon: [[15.9, -7.6], [17.6, -7.4], [17.9, -9.0], [16.4, -9.3]]
  - title: The fall of Pungo Andongo
    date: 1670–1671
    when: "1671-11-18"
    borders: "1671-12-01"
    countries: [ao]
    body:
      - After the Portuguese defeat at Kitombo in Soyo in October 1670, João Hari, urged on by Matamba’s ruler António Carrasco (Njinga a Mona), turned against Portugal. He cut the road between Luanda and Kasanje, attacked trade caravans, and sent his brother Dom Diogo Cabanga, commander of his army, to rouse neighbouring lords. Governor Francisco de Távora asked for reinforcements from Brazil and gathered Imbangala and African troops from the garrisons of Ilamba, Massangano, Cambambe, Muxima and other forts for the largest campaign the Portuguese had yet fought in Angola.
      - On 2 August 1671 the army marched from Ambaca under Luís Lopes de Sequeira, the victor of Mbwila, fought its way through skirmishes and built a fortified camp before Pungo Andongo, a fortress among great black rocks. On 27 August it threw back a strong attack led by Dom Diogo. After a siege of about three months, hearing that Matamba was preparing a relief army, Sequeira stormed the fortress on the night of 18 November 1671. The royal family was captured; João Hari fled, but was taken by a hostile lord, handed over to the Portuguese and beheaded. Ndongo ceased to exist, its land was annexed to Angola, and the Portuguese built a fort at Pungo Andongo.
      - "The Portuguese went on to annex Libolo, south of the Kwanza, in 1679. In 1681, after Matamba’s King Francisco Guterres attacked Kasanje and raided Portuguese caravans, the governor sent an army against him; at Katole the Portuguese were ambushed and Sequeira was killed, but they won the battle, and Francisco fell. His sister and successor, Verónica Guterres, signed a treaty of vassalage on 7 September 1683, which ended the Angolan wars."
    facts:
      - [Army leaves Ambaca, "2 August 1671"]
      - [Pungo Andongo stormed, "18 November 1671"]
      - [Battle of Katole, "1681"]
      - [Matamba’s treaty of vassalage, "7 September 1683"]
    markers:
