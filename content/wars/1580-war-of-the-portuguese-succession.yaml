notes:
  - Dates up to early October 1582 are Julian. Spain and Portugal adopted the Gregorian calendar in October 1582, so the dates of 1583 are Gregorian.
  - Under the Iberian Union Portugal kept its own laws, coinage, Cortes and empire, and was ruled by the Spanish kings as a separate kingdom. On the map it stays Portugal.
