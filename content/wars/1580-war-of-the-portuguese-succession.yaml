  - title: The Azores
    date: 1581–1583
    when: "1581-07-25"
    borders: "1583-08-01"
    countries: [pt, es, fr, gb]
    body:
      - Only the Azores held out for António, above all Terceira, whose harbour at Angra was a port of call for the fleets returning from the Indies and America. On 25 July 1581 a Spanish landing at Salga Bay on Terceira was beaten off when the islanders drove half-wild cattle into the troops. Catherine de’ Medici, herself a claimant, backed a fleet of about 60 ships under the Florentine exile Filippo Strozzi, which reached the islands in July 1582. On 26 July, off São Miguel, Santa Cruz defeated it with fewer but larger ships. Strozzi was killed, and Santa Cruz had many prisoners executed as pirates, since France and Spain were not formally at war.
      - António went back to France for more men, and in 1583 Santa Cruz returned with nearly 100 ships and about 15,000 men. On 26 July he landed at the Baía das Mós, away from the defended harbours, stormed the beach defences and took Angra within days. The French and English soldiers were allowed to leave, but leading Portuguese supporters of António were executed, and the other islands submitted. António lived on in exile in France and England, joined an English attempt on Lisbon in 1589 and died in Paris in 1595. Portugal remained united with Spain until 1640.
    facts:
      - [Battle of Salga, "25 July 1581, Spanish landing repulsed"]
      - [Battle of Ponta Delgada, "26 July 1582, Spanish victory"]
      - [Conquest of Terceira, "July–August 1583"]
    markers:
      - kind: event
        name: Belle-Île
        date: June 1582
        text: Strozzi’s fleet of about 60 ships sailed from this island off Brittany for the Azores, which lie far out in the Atlantic, beyond the edge of this map.
        lonlat: [-3.17, 47.33]
      - kind: event
        name: Lisbon
        date: 1582–1583
        text: Santa Cruz fitted out his fleets here. He sailed in July 1582 to meet Strozzi and in June 1583 with the invasion force, nearly 100 ships and more than 15,000 men, that took Terceira.
        lonlat: [-9.14, 38.71]
    arrows:
