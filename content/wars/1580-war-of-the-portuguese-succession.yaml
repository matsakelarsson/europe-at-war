id: war-of-the-portuguese-succession
name: War of the Portuguese Succession
start: "1580-06"
end: "1583-08"
tier: B
summary: The war in which Philip II of Spain made good his claim to the Portuguese throne after the deaths of King Sebastian in 1578 and Cardinal-King Henry in 1580. The Duke of Alba defeated the rival claimant, António, Prior of Crato, at Alcântara outside Lisbon in 1580, and the Marquis of Santa Cruz won the Azores in 1582–1583, beginning sixty years of union between the Spanish and Portuguese crowns.
