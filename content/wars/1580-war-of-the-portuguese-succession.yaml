steps:
  - title: Alcântara
    date: 1580–1581
    when: "1580-01-31"
    borders: "1580-08-25"
    countries: [pt, es]
    body:
      - King Sebastian’s death at Alcácer Quibir left the throne to his great-uncle, Cardinal Henry, who was old and childless and died on 31 January 1580 without naming an heir. The strongest claimants were Philip II of Spain, a grandson of King Manuel I through his mother; Catherine, Duchess of Braganza, a granddaughter through a son; and António, Prior of Crato, Manuel’s grandson in the male line but born out of wedlock. Most of the nobles and higher clergy, many won over with Spanish money, accepted Philip. The common people of Lisbon and many towns favoured António, who was acclaimed king at Santarém on 24 July.
      - Philip had already sent his army in. The aged Duke of Alba crossed the border near Elvas in late June with a large army, many of them German and Italian mercenaries, while a fleet under the Marquis of Santa Cruz took Setúbal and carried the troops round to Cascais. On 25 August Alba routed António’s hastily raised army of townsmen, peasants and freed slaves at the bridge of Alcântara, just west of Lisbon, and the city surrendered. Sancho Dávila took Porto in October; António hid for months and escaped to France. In April 1581 the Cortes at Tomar acclaimed Philip king, and he promised that Portugal would keep its own laws and offices.
    facts:
      - [Death of Cardinal-King Henry, 31 January 1580]
      - [Battle of Alcântara, "25 August 1580, Spanish victory"]
      - [Cortes of Tomar, "April 1581, Philip acclaimed king"]
    markers:
      - kind: event
        side: sp
        name: Elvas
        date: late June 1580
        text: Alba’s army crossed the border here from Badajoz and met little resistance in the Alentejo.
        lonlat: [-7.16, 38.88]
      - kind: event
        side: ant
        name: Santarém
        date: 24 July 1580
        text: António, Prior of Crato, was acclaimed king by the townspeople and then entered Lisbon.
        lonlat: [-8.69, 39.23]
      - kind: taken
        side: sp
        name: Setúbal
        date: July 1580
        text: The port surrendered to Alba and Santa Cruz, and the army embarked here for Cascais.
        lonlat: [-8.89, 38.52]
      - kind: taken
        side: sp
        name: Cascais
        date: late July 1580
        text: Alba’s troops landed nearby and took the town and its fortress; he had its commander executed.
        lonlat: [-9.42, 38.7]
        lp: l
      - kind: battle
        side: sp
        name: Battle of Alcântara
        date: 25 August 1580
        text: António’s army held the line of the Alcântara stream but broke when Spanish troops crossed upstream. Lisbon surrendered two days later.
        lonlat: [-9.18, 38.71]
      - kind: taken
