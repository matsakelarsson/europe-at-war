  - title: Karacha’s revolt and the night on the Vagay
    date: March – August 1585
    when: "1585-08-06"
    borders: "1585-08-06"
    countries: [ru]
    body:
      - In March 1585 Karacha, who had made peace with Yermak, asked him for men to protect him against the Nogais and then killed the forty Cossacks sent under Ivan Koltso. The Tatar villages rose, and Karacha besieged Qashliq behind a ring of wagons. On the night of 12 June a sortie under Matvey Meshcheryak broke into his camp and drove him off, but the Cossacks lost heavily.
      - In early August Yermak went up the Irtysh with a few dozen men, reportedly to meet a caravan of Bukharan merchants. On the night of 5–6 August, as his men slept in their camp near the mouth of the Vagay during a storm, Kuchum’s warriors crossed the river and attacked; according to the chronicles only one or a handful escaped. Yermak was drowned trying to reach the boats, and a later tradition says the coat of mail the tsar had given him dragged him under. On 15 August the remaining Cossacks, about 150 men under Ivan Glukhov, abandoned Qashliq and went back over the Urals. Kuchum’s son Ali briefly held the town, and then the Taibugid prince Seydak took it.
    facts:
      - [Siege of Qashliq lifted, "12 June 1585"]
      - [Yermak killed, "night of 5–6 August 1585 (1584 in some accounts)"]
      - [Qashliq abandoned, "15 August 1585"]
    markers:
