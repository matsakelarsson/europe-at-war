id: yermaks-conquest-of-sibir
name: Yermak’s campaign and the conquest of the Khanate of Sibir
start: "1581-09-01"
end: "1598-08-20"
tier: A
summary: "The Russian conquest of the Khanate of Sibir, the Tatar state on the Tobol and Irtysh rivers east of the Urals, which opened Siberia to Russia. In 1581 or 1582 the Stroganov merchant family, who held frontier lands on the Kama and the Chusovaya, sent a band of about 840 Volga Cossacks and hired men under the ataman Yermak Timofeyevich over the Urals. Armed with muskets and a few small guns, they beat Khan Kuchum’s army at Chuvash Cape and took his capital, Qashliq, in October 1582. Ivan IV pardoned the Cossacks and sent troops, but famine, revolts and Tatar attacks wore the force down, and in August 1585 Kuchum surprised Yermak’s camp at the mouth of the Vagay, where Yermak drowned. The survivors left Siberia. Government expeditions then built forts at Tyumen (1586), Tobolsk (1587), Tara, Surgut and elsewhere, and on 20 August 1598 a force from Tara destroyed Kuchum’s camp on the upper Ob. Kuchum escaped and died in exile a few years later; his sons and grandsons raided the Russian frontier for decades."
countries: [ru]
sides:
  - id: ru
    name: Yermak’s Cossacks and Muscovy
    polities: [russia]
    ink: red
    moves: Russian moves
    success: Russian success
  - id: sib
