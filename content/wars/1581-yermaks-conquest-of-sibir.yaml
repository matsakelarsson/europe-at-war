  - title: Irmen and the end of Kuchum
    date: 1595 – August 1598
    when: "1598-08-20"
    borders: "1598-09-01"
    countries: [ru]
    body:
      - Kuchum refused offers of lands in Russia in return for his surrender and kept raiding the Tatar villages that paid tribute to the Russians. In August 1598 Andrei Voeikov led a force from Tara of a few hundred Cossacks, streltsy and service Tatars (sources give 400 to 1,000 men) across the Baraba steppe. At dawn on 20 August he surprised Kuchum’s camp on the Ob near the mouth of the Irmen, south of today’s Novosibirsk; the site now lies under the Novosibirsk Reservoir.
      - The fighting lasted half a day. Many of Kuchum’s people were killed, among them two of his sons, and five sons, eight wives and eight daughters were captured and taken to Moscow. Kuchum escaped across the Ob with a few dozen followers. He died a few years later in exile, killed among the Nogais or, by other accounts, in Bukhara. The same year Verkhoturye was founded on the road over the Urals. Kuchum’s sons and grandsons, allied at times with the Kalmyks and Bashkirs, raided the Siberian frontier until the second half of the 17th century, but the khanate was gone and Russia pushed on to the Yenisei.
    facts:
      - [Battle of Irmen, "20 August 1598, Russian victory"]
      - [Kuchum’s family captured, "five sons, eight wives and eight daughters"]
    markers:
