  - title: Tyumen, Tobolsk and the forts
    date: 1585–1594
    when: "1587"
    borders: "1594-06-01"
    countries: [ru]
    body:
      - Moscow now took over the conquest itself. A detachment of 100 men under Ivan Mansurov arrived in September 1585, found Qashliq empty and wintered in a fort at the junction of the Irtysh and the Ob. In 1586 the voivodes Vasily Sukin and Ivan Myasnoy came with about 300 men and built a fort at Tyumen, and in 1587 Danila Chulkov founded Tobolsk on the Irtysh a few kilometres from Qashliq, which was soon deserted. In 1588 Chulkov invited Seydak, the Kazakh prince Uraz-Muhammad and Karacha to a feast at Tobolsk, seized them and sent them to Moscow.
      - A chain of forts followed, each with a garrison that collected fur tribute from the Tatars, Khanty and Mansi around it and held hostages from their leading families. Pelym and Berezov were built in 1593, Surgut on the middle Ob in 1594, and Tara on the Irtysh in the same year, on the edge of the steppe where Kuchum still roamed with his followers. In 1591 a Russian force caught Kuchum on the Ishim and captured two of his wives and his son Abul-Khair. The forest peoples resisted with raids and risings, among them the Mansi of Pelym, whose prince was defeated in 1594.
    facts:
      - [Tyumen founded, "1586"]
      - [Tobolsk founded, "1587"]
      - [Seydak seized, "1588"]
      - [Surgut and Tara founded, "1594"]
