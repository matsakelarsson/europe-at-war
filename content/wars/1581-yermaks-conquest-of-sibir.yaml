  - title: Mametkul, Moscow and the Ob
    date: December 1582 – 1584
    when: "1583"
    borders: "1583-06-01"
    countries: [ru]
    body:
      - In December 1582 Mametkul ambushed and killed a Cossack fishing party at Lake Abalak near Qashliq, but in the early spring of 1583 a small band of Cossacks surprised his camp on the Vagay and captured him. In the summer Yermak sailed down the Irtysh and the Ob, demanding tribute from the Tatar and Khanty towns along the rivers; the Khanty town of Nazym on the Ob was stormed, and the ataman Nikita Pan was killed in the fighting.
      - Yermak sent his lieutenant Ivan Koltso with furs and letters to the Stroganovs and to Moscow. Ivan IV, who had just rebuked the Stroganovs for sending armed men away while the Perm lands were raided, now pardoned the Cossacks, sent Yermak gifts, among them a coat of mail, and ordered Mametkul sent to Moscow, where he later served the tsar. The tsar also sent Prince Semyon Bolkhovsky with 300 to 500 streltsy, who reached Qashliq only in November 1584, short of food and sick. In the winter of 1584–1585 a famine struck the town, and Bolkhovsky and many of his men died.
    facts:
      - [Mametkul captured, "spring 1583"]
      - [Reinforcements, "300–500 streltsy under Semyon Bolkhovsky, arrived November 1584"]
