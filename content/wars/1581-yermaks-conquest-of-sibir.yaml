    moves: Moves of Kuchum and his allies
    success: Siberian Tatar success
notes:
  - The story is known mainly from Russian chronicles written decades later (the Stroganov, Esipov and Remezov chronicles), which disagree on many dates and numbers. Historians date the departure of Yermak’s band to 1579, September 1581 or September 1582, and his death to August 1584 or August 1585; this story follows the chronology most modern historians use (departure in 1581, death in 1585). Dates are Old Style (Julian), as in the Russian sources; add ten days for the Gregorian calendar.
  - Russian sources call the Khanty “Ostyaks” and the Mansi “Voguls”. Kuchum’s subjects were Siberian Tatars, Khanty, Mansi and Selkups, many of whom paid him tribute in furs without being Muslims or Tatars themselves.
  - Yermak’s origins are uncertain; he had led Cossack bands on the Volga before he entered the Stroganovs’ service.
