        side: ru
        name: Chuvash Cape
        date: 23 October 1582
        text: A headland on the Irtysh near today’s Tobolsk. The Cossacks broke Kuchum’s barricade and Mametkul was wounded.
        lonlat: [68.310, 58.170]
        lp: l
      - kind: taken
        side: ru
        name: Qashliq
