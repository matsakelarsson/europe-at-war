steps:
  - title: Kuchum and the Stroganovs
    date: 1555–1581
    when: "1563"
    borders: "1581-08-01"
    countries: [ru]
    body:
      - The Khanate of Sibir was one of the Tatar states that grew out of the Golden Horde. Its rulers came from two rival houses, the Taibugids and the Shaybanids, who both claimed descent from Genghis Khan, and its capital was Qashliq (also called Sibir or Isker) on the Irtysh. After Muscovy took Kazan in 1552 and Astrakhan in 1556, the Taibugid khan Yadegar sent envoys to Ivan IV and agreed to pay a tribute in sable furs. His Shaybanid rival Kuchum, a grandson of Khan Ibak, fought him with help from the steppe and in 1563 killed him and took the throne.
      - Kuchum promoted Islam among his subjects and, after the Crimean Tatars burned Moscow in 1571, stopped paying tribute. In 1573 his nephew Mametkul raided the Chusovaya, where the Stroganovs, a family of merchants and salt producers, held huge grants of frontier land from the tsar. A charter of 1574 also gave the Stroganovs the right to build forts on the Tura and the Tobol, in Kuchum’s own lands, and to hire armed men. In the late 1570s they took on Cossacks from the Volga, among them the ataman Yermak Timofeyevich, to guard their towns against raids by Kuchum’s vassals and the Mansi princes of Pelym.
    facts:
      - [Kuchum takes the throne, "1563"]
      - [Raid on the Chusovaya, "1573"]
      - [Stroganov charter for the Tobol lands, "1574"]
