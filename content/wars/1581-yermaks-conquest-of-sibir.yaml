  - title: Chuvash Cape and the fall of Qashliq
    date: October 1582
    when: "1582-10-23"
    borders: "1582-10-26"
    countries: [ru]
    body:
      - Kuchum gathered his forces below Qashliq, at Chuvash Cape on the Irtysh, where his men built an abatis of felled trees. His army included Tatar cavalry under Mametkul and contingents of Khanty and Mansi from the forest, and some accounts speak of up to 10,000 men, though his best troops were away raiding the Perm lands. After several days of skirmishing, the Cossacks attacked the barricade on 23 October. Mametkul led a sortie, the Cossacks formed up and fired volleys into the attackers, and Mametkul was wounded and carried off across the river. The Khanty and Mansi contingents, who had never faced firearms, went home.
      - Kuchum left Qashliq in the night and withdrew to the steppe of the Ishim. On 26 October the Cossacks entered the empty town, having lost about 107 men in the battle; some 500 remained. Within days Khanty chiefs came in with gifts of food and furs, and several Tatar notables returned to their villages and submitted. Yermak began to collect tribute in furs (yasak) in the tsar’s name, as the khans had done in their own.
    facts:
      - [Battle of Chuvash Cape, "23 October 1582 (Old Style), Russian victory"]
      - [Qashliq occupied, "26 October 1582 (5 November New Style)"]
      - [Cossack losses, "about 107 killed"]
    markers:
