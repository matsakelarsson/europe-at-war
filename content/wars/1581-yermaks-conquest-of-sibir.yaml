        lonlat: [65.534, 57.153]
  - title: Over the Urals
    date: September 1581 – summer 1582
    when: "1581-09-01"
    borders: "1582-08-01"
    countries: [ru]
    body:
      - On 1 September 1581, by the most accepted dating, Yermak’s band set off up the Chusovaya in some 80 river boats. It numbered about 840 men, some 540 of them Yermak’s Cossacks and about 300 provided by the Stroganovs, among them German and Lithuanian prisoners of war; the Stroganovs supplied muskets, powder, a few light guns and food. The boats were hauled up the Serebryanka and across the low watershed to the Tagil, where the band wintered in a stockade.
      - In the spring of 1582 the Cossacks floated down the Tagil into the Tura. Near today’s Turinsk they scattered the riders of a local prince, Yepancha, with musket and cannon fire, and they took Chingi-Tura, the old capital on the Tura, with little fighting. Kuchum’s nephew Mametkul tried to stop them on the Tobol, but the boats forced their way downstream through a series of skirmishes, and in August the Cossacks plundered the town of Karacha, Kuchum’s chief minister, taking its stores.
    facts:
      - [Departure, "1 September 1581 (other accounts 1579 or 1582)"]
      - [Yermak’s band, "about 840 men, in some 80 boats"]
      - [Route, "Chusovaya, Serebryanka, Tagil, Tura, Tobol"]
