  - title: Yamazaki and Kiyosu
    date: June – July 1582
    when: "1582-07-02"
    borders: "1582-07-02"
    countries: [jp]
    body:
      - The news reached Hideyoshi at Takamatsu on the night of 22 June. He kept it secret, made peace with the Mōri at once, accepting the surrender of the castle and the suicide of its commander Shimizu Muneharu, and on 25 June started east with an army of almost 30,000. In what became known as the Great Return from the Chūgoku, he covered the roughly 200 km to the edge of the Kyoto basin by way of Himeji and Amagasaki in about a week, gathering Oda commanders on the way, among them Nobunaga’s third son Oda Nobutaka and Niwa Nagahide. Tokugawa Ieyasu, who had been visiting the port of Sakai, escaped to his own lands by a dangerous journey through the mountains of Iga.
      - Mitsuhide, with perhaps 10,000 to 16,000 men, met the Oda army on 2 July at Yamazaki, where the road from the west enters the Kyoto basin between the Yodo river and the hill of Tennōzan. Hideyoshi’s army, at least twice as large, broke the Akechi line in a few hours. Mitsuhide fell back to Shōryūji castle and fled by night towards Sakamoto, and was killed by villagers, probably near Ogurusu, south-east of Kyoto, on the way. At the conference of the Oda generals at Kiyosu castle on 16 July, Hideyoshi carried the choice of Nobutada’s infant son, Sanbōshi (later Oda Hidenobu), as head of the house, with himself among his guardians, against Shibata Katsuie, who favoured Nobutaka, and Nobunaga’s lands were shared out among the generals.
    facts:
      - [Peace with the Mōri at Takamatsu, "23–25 June 1582"]
      - [Battle of Yamazaki, "2 July 1582"]
      - [Strength, "Hashiba and allies 20,000–36,000, Akechi 10,000–16,000"]
      - [Kiyosu conference, "16 July 1582"]
