steps:
  - title: The temple of Honnō-ji
    date: 21 June 1582
    when: "1582-06-21"
    borders: "1582-06-21"
    countries: [jp]
    body:
      - In the summer of 1582 Nobunaga stood at the height of his power. The Takeda had been destroyed in the spring, his son Nobutaka was preparing to invade Shikoku, and Hideyoshi was besieging the Mōri castle of Takamatsu in Bitchū, flooding it by damming the river around it. When Hideyoshi asked for help, Nobunaga ordered Akechi Mitsuhide, lord of Tanba and of Sakamoto on Lake Biwa, to march west, and set out for Kyoto himself, lodging at the temple of Honnō-ji with a guard of about 150 men while his heir Nobutada stayed nearby.
      - Mitsuhide gathered about 13,000 men at Kameyama castle in Tanba and set off on the night of 20 June as if for the west, then turned east over the hills towards Kyoto. Before dawn on 21 June his troops surrounded Honnō-ji and attacked. Nobunaga fought for a while and, as the temple burned, took his own life inside; his body was never found. Nobutada moved to the Nijō palace (Nijō Shin-gosho), which had stronger walls, and was overwhelmed there and took his own life the same morning. Mitsuhide then took Nobunaga’s castle of Azuchi and its treasures and asked the court and the lords of the region to recognise him, but few of Nobunaga’s vassals joined him; Hosokawa Fujitaka and Tsutsui Junkei, on whom he had counted, held back.
    facts:
      - [Honnō-ji attacked, "before dawn, 21 June 1582"]
      - [Akechi army, "about 13,000"]
      - [Nobunaga’s escort, "about 150"]
