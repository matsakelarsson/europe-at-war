  - title: Shizugatake
    date: January – June 1583
    when: "1583-06-10"
    borders: "1583-06-14"
    countries: [jp]
    body:
      - The settlement at Kiyosu did not last. Hideyoshi held Kyoto and the inner provinces and acted in Nobunaga’s name; against him stood Shibata Katsuie in Echizen, Oda Nobutaka at Gifu and Takigawa Kazumasu in Ise. In the winter, while snow closed the roads from Echizen, Hideyoshi took Nagahama castle, which had been given to Shibata’s adopted son, and forced Nobutaka to submit at Gifu in January 1583. In the spring Shibata came south with his army to the hills north of Lake Yogo, and the two armies faced each other from lines of forts. When Nobutaka rose again, Hideyoshi went to Ōgaki to deal with him.
      - Shibata’s nephew Sakuma Morimasa seized the chance and on 10 June stormed the fort of Ōiwayama, killing its commander Nakagawa Kiyohide, but he ignored Shibata’s order to fall back. Hideyoshi hurried back from Ōgaki with his men, about 50 km in a few hours of the evening and night, and at dawn on 11 June fell on Sakuma’s men at Shizugatake. The young warriors who led the attack were celebrated as the Seven Spears of Shizugatake. Maeda Toshiie, on Shibata’s side, withdrew from the field, and Shibata’s army broke up. Shibata fled to his castle of Kitanoshō, where Hideyoshi’s army stormed it on 14 June; Shibata killed his household and himself, and his wife Oichi died with him, while her three daughters were sent out to Hideyoshi. Nobutaka was made to take his own life soon afterwards, and Takigawa surrendered. Within months Hideyoshi began building Osaka Castle, and the next challenge to him came from Oda Nobukatsu and Tokugawa Ieyasu in 1584.
    facts:
      - [Nobutaka submits at Gifu, "January 1583"]
      - [Battle of Shizugatake, "10–11 June 1583"]
      - [Fall of Kitanoshō, "14 June 1583"]
      - [Strength, "Hashiba about 50,000, Shibata about 30,000"]
