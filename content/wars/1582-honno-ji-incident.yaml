notes:
  - Dates in 1582 are converted from the lunar calendar to the Julian calendar, and dates from 1583 to the Gregorian calendar, as English and Japanese sources give them. Honnō-ji fell on the 2nd day of the sixth month of Tenshō 10, Yamazaki was fought on the 13th, and Shizugatake on the 20th–21st day of the fourth month of Tenshō 11.
  - Mitsuhide’s motive has never been settled; more than fifty theories have been put forward, from personal grievances to a plan to restore the Ashikaga shogunate or to head off Nobunaga’s coming invasion of Shikoku. Theories that Hideyoshi, Tokugawa Ieyasu, the court or others were behind him have little support.
