id: honno-ji-incident
name: Honnō-ji Incident and the Oda succession war
start: "1582-06-21"
end: "1583-06"
tier: B
summary: "The killing of Oda Nobunaga by his general Akechi Mitsuhide, and the year of fighting from which Hashiba (later Toyotomi) Hideyoshi emerged as Nobunaga’s heir in all but name. Before dawn on 21 June 1582 Mitsuhide, sent with his army to reinforce Hideyoshi against the Mōri, turned instead on Kyoto and surrounded the temple of Honnō-ji, where Nobunaga was staying with a small escort; Nobunaga died in the burning temple, and his heir Oda Nobutada was killed at the Nijō palace the same morning. Hideyoshi, besieging Takamatsu castle in Bitchū, made peace with the Mōri and marched his army back in about a week, and on 2 July he beat Mitsuhide at Yamazaki; Mitsuhide was killed as he fled. At the Kiyosu conference the Oda generals chose Nobutada’s infant son as heir, but Hideyoshi and Shibata Katsuie, the senior Oda general, soon fell out, and in June 1583 Hideyoshi defeated Shibata’s army at Shizugatake and took his castle of Kitanoshō, where Shibata and his wife Oichi, Nobunaga’s sister, killed themselves."
countries: [jp]
