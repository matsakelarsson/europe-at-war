id: cologne-war
name: Cologne War
start: "1583"
end: "1588"
tier: C
summary: A war over the Electorate of Cologne, set off when the Archbishop-Elector Gebhard Truchsess von Waldburg became a Protestant in December 1582, married Agnes von Mansfeld in February 1583 and tried to turn the archbishopric into a secular principality, against the ecclesiastical reservation of the Peace of Augsburg. The pope deposed him, and in May 1583 the cathedral chapter elected Ernest of Bavaria in his place. Gebhard was backed by John Casimir of the Palatinate and by Dutch and English help, Ernest by his brother Ferdinand’s Bavarian troops, the pope and, from 1586, the Spanish army of the Netherlands under the Duke of Parma. The Bavarians stormed and blew up Godesberg castle in late 1583 after sappers mined its walls, and in July 1586 Parma took and sacked Neuss. In 1588 Gebhard gave up and withdrew to Strasbourg, though his captains Adolf von Neuenahr and Martin Schenck fought on until they were killed in 1589. The war devastated the electorate and left it in Wittelsbach hands until 1761, strengthening the Catholic cause in north-west Germany.
countries: [de, nl]
sides:
  - id: geb
    name: Gebhard Truchsess and his Protestant allies
    polities: [palatinate, dutch-republic]
    ink: orange
  - id: ern
    name: Ernest of Bavaria and the Catholic powers
    polities: [bavaria, habsburg-netherlands, spain]
    ink: navy
notes:
  - Also called the Seneschal’s War (Truchsessischer Krieg), after Gebhard’s hereditary title. It was fought alongside the Dutch Revolt, and the Spanish and Dutch armies went on fighting in the electorate for years afterwards; Rheinberg did not fall to the Spanish until 1590.
  - Catholic territories adopted the Gregorian calendar in 1583–1584 and Protestant ones did not, so dates in the sources can differ by ten days.
