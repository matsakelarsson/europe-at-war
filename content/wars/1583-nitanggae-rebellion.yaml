id: nitanggae-rebellion
name: Nitanggae’s rebellion
start: "1583-02"
end: "1583-09"
tier: C
summary: "A rising of the Jurchens of the Tumen valley against Joseon, the largest conflict on the northern frontier since the six garrisons were set up there in the 15th century. In early 1583 Ueulji, a Jurchen chief living under Korean protection, attacked the outpost of Asanbo, and with some ten thousand horsemen took and plundered the town of Gyeongwon and the forts around it. Sin Rip, the magistrate of Onseong, broke the siege of Hunyung and pursued the raiders across the Tumen. In the early summer Nitanggae, another chief settled at Hoeryeong, united several Jurchen groups and attacked Jongseong from three sides with perhaps twenty thousand men; the scattered Korean garrisons were overrun one by one, but Jongseong held with its firearms, and Nitanggae fell back when a rival chief raided his villages, then attacked Donggwan. Other Jurchen chiefs fought on the Korean side. Ueulji was captured and beheaded in the seventh lunar month and Nitanggae fled. The court punished the commanders who had lost Gyeongwon, and the experience led Joseon to replace its system of local garrison commands with the jeseung bangnyak, the gathering of provincial troops under commanders sent from the capital, which it used against Japan in 1592. Sin Rip, Yi Il and Yi Sun-sin all gained their first experience of war on this frontier."
countries: [kp, cn]
