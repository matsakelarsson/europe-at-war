notes:
  - The chief’s name is written 尼湯介 or 尼蕩介 and is also romanised Itanggae; Korean sources disagree on whether Ueulji’s raid and Nitanggae’s attack were one rising or two. The Korean Wikipedia article dates the war from the 28th day of the first lunar month to the 19th day of the seventh (about 20 February to early September 1583, allowing for the leap month of that year); the Encyclopedia of Korean Culture gives only the year.
  - Some historians treat the frontier fighting, which went on after 1583, as a war lasting over four years.
