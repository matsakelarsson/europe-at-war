id: burmese-siamese-war-1584
name: Burmese–Siamese War (1584–1593)
start: "1584-05-03"
end: "1593"
tier: B
summary: "The war in which Siam threw off Burmese overlordship. In 1584 Naresuan, the son of Siam’s vassal king Maha Thammarachathirat, led a Siamese army to help Nanda Bayin of Toungoo against a rising at Ava, then withdrew and declared Siam independent on 3 May 1584. Nanda sent five invasions in nine years: a pursuit force beaten at the Sittaung river, an army caught by the floods, attacks from Lan Na in 1586 and 1590–1591, and a siege of Ayutthaya from December 1586 that ended in a disastrous retreat in April 1587. In January 1593 the last Burmese army met Naresuan near Suphanburi; the Burmese crown prince, Mingyi Swa, was killed, in a duel on elephants by the Siamese chronicles, by a gunshot by the Burmese. Siam then took Tavoy and Tenasserim and carried the war into Burma, and the Toungoo empire began to break up."
countries: [th, mm]
