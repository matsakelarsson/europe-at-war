  - title: Nong Sarai, and the war carried into Burma
    date: 1590–1593
    when: "1593-01"
    borders: "1593-12"
    countries: [th, mm]
    body:
      - "Naresuan became king on his father’s death in 1590. Nanda raised 30,000 men for a new war but had to divide them when the Shan state of Mogaung revolted: in November 1590 Mingyi Swa invaded northern Siam from Lan Na with 20,000 and was routed in March 1591. Naresuan went over to the attack, raiding the upper Tenasserim coast in 1591–1592 with 5,000 men; the Burmese garrisons drove him back, but the balance had turned."
      - "On 4 November 1592 a Burmese army of 24,000 under Mingyi Swa crossed the Three Pagodas Pass and after seven weeks reached Suphanburi, west of Ayutthaya. There, in January 1593, the armies met at Nong Sarai. The Burmese chronicles say that the two commanders fought on their elephants and that Mingyi Swa was felled by a gunshot; the Siamese chronicles that the two princes fought a duel on elephants and Naresuan cut Mingyi Swa down with his sword, while his brother Ekathotsarot defeated another Burmese commander. The Burmese army retreated with heavy losses under constant attack."
      - "It was the last invasion from Pegu. Later in 1593 Siamese armies took Tavoy and, under Phraya Chakri, the Tenasserim coast, and in the following years Naresuan carried the war into Lower Burma, besieging Pegu in 1595 while Nanda’s vassals broke away; the end of the Toungoo empire is told in the fall of Pegu (1599)."
    facts:
      - ["Burmese army", "24,000 men (Burmese chronicles)"]
      - ["Battle of Nong Sarai", "8 January 1593 (Burmese chronicles) or 18 January 1593 (Siamese chronicles); Siamese victory"]
      - ["Tavoy", "taken by Siam in 1593"]
