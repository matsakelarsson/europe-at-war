notes:
  - "Army sizes are those of the Burmese chronicles as given by modern historians; the Siamese chronicles give the Burmese armies as hundreds of thousands of men."
  - "Nong Sarai. The Burmese chronicles date the battle to 8 January 1593 and say that Mingyi Swa was shot. The Siamese chronicles describe a duel on elephants in which Naresuan cut him down; their date was long read as 25 January 1593 and is now usually given as 18 January, Royal Thai Army Day since 2006. Jan Terwiel (2013), combining Siamese, Burmese and European accounts, doubts that a formal duel took place. The site is also disputed: Prince Damrong placed it at Don Chedi in Suphanburi, where the main monument stands, while others argue for Phanom Thuan in Kanchanaburi."
  - "Names: Pegu is today’s Bago, Martaban Mottama, Tavoy Dawei and Mergui Myeik. Thai names are in the Royal Thai General System."
