steps:
  - title: Naresuan breaks with Pegu
    date: May 1584 – April 1587
    when: "1584-05"
    borders: "1586-12"
    countries: [th, mm]
    body:
      - "Bayinnaung died in 1581, and his son Nanda Bayin had to fight to keep the vassal kings in line. When the viceroy of Ava rose in 1584, Siam’s vassal king Maha Thammarachathirat sent his son Naresuan with 6,000 men, officially to help. The Siamese army lingered near Pegu instead, and after Ava fell quickly to Nanda it withdrew to the Mon country, where on 3 May 1584 Naresuan declared Siam independent, at Martaban by the Burmese account and at Muang Khraeng by the Siamese. He took thousands of Siamese who had been deported to Burma home with him."
      - "Nanda sent 4,000 men after him. They caught up with the Siamese at the Sittaung river, where, by the Siamese account, Naresuan shot their commander, Suragamma, with a musket across the river, and the pursuit broke off. A second Burmese army of 7,000 under Nanda and his son Mingyi Swa followed in the rainy season, was caught in the flooded plain of the Chao Phraya and was nearly destroyed by Siamese war canoes."
      - "In March 1586 Mingyi Swa invaded from Lan Na with 12,000 men but was stopped at a fortified post on the northern frontier (Lampang in the Burmese chronicles) and withdrew in June. On 19 October 1586 Nanda himself set out with 25,000 men, his largest army but a third of Bayinnaung’s in 1568. Two columns reached Ayutthaya by December, but the army was not equipped for a long siege; from February 1587 men died by thousands from hunger and exposure, supplies reached the city through gaps in the lines, and on 20 April 1587 the Burmese began a retreat on which few of them came home."
    facts:
      - ["Independence declared", "3 May 1584"]
      - ["Siege of Ayutthaya", "December 1586 – 20 April 1587, failed"]
