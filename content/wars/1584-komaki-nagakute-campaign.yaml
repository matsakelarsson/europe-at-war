id: komaki-nagakute-campaign
name: Komaki–Nagakute Campaign
start: "1584-04"
end: "1584-12"
tier: C
summary: "The only war between the two men who would unify Japan, Hashiba (later Toyotomi) Hideyoshi and Tokugawa Ieyasu. After Shizugatake (1583) Hideyoshi treated Nobunaga’s second son, Oda Nobukatsu, as a subordinate, and in the third month of 1584 Nobukatsu had three of his senior retainers, suspected of dealing with Hideyoshi, put to death and called on Ieyasu for help. Hideyoshi’s ally Ikeda Tsuneoki seized Inuyama castle in Owari, but Ieyasu beat Mori Nagayoshi at Haguro and fortified Mount Komaki, a hill commanding the Owari plain. Hideyoshi arrived with a much larger army, put at up to 100,000 against about 30,000, and the two sides dug lines of earthworks facing each other. To break the deadlock Ikeda Tsuneoki proposed a raid on Ieyasu’s home province of Mikawa, and a force of about 20,000 under Hideyoshi’s nephew Miyoshi (later Toyotomi) Hidetsugu set out in secret. Ieyasu learned of it and followed, and on the 9th day of the fourth month (May 1584) he routed Hidetsugu’s column and destroyed the troops of Ikeda and Mori at Nagakute; Ikeda Tsuneoki, his son Motosuke and Mori Nagayoshi were killed, with losses put at 2,500 by some sources and far more by others. The armies then faced each other again, and the war moved to Ise and to Kanie castle, which Ieyasu and Nobukatsu retook in the summer. Hideyoshi instead put pressure on Nobukatsu’s lands in Ise, and in the eleventh month (December) Nobukatsu made a separate peace and submitted. Ieyasu, left without a cause, made peace too and sent his son Ogimaru (later Yūki Hideyasu) to Hideyoshi as an adopted son and hostage. Ieyasu had won the battles but Hideyoshi the war; in 1586 Ieyasu came to Osaka and did homage."
