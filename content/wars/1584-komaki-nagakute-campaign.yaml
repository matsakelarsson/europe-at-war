notes:
  - Japanese dates are in the lunar calendar; after October 1582 their equivalents are in the Gregorian calendar. Some English accounts give the lunar month and day as if they were Western dates.
  - Estimates of the armies and losses vary widely; the larger figures for the losses at Nagakute come from the Jesuit Luís Fróis and other contemporary reports.
  - Hideyoshi took the surname Toyotomi in 1586; in 1584 he was Hashiba Hideyoshi.
