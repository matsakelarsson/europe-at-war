notes:
  - Dates are New Style (Gregorian), as used in Spain from 1582. England kept the Julian calendar, ten days behind, so English accounts date the Armada’s arrival off Cornwall to 19 July 1588 and Gravelines to 29 July.
  - Philip II was also king of Portugal from 1580, and the Armada sailed from Lisbon. The war ran alongside the Dutch revolt (the Eighty Years’ War), the French Wars of Religion, in which England and Spain backed opposite sides, and the Nine Years’ War in Ireland.
