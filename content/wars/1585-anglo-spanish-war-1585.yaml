id: anglo-spanish-war-1585
name: Anglo-Spanish War of 1585–1604
start: "1585-08-20"
end: "1604-08-28"
tier: B
summary: An undeclared war between Elizabeth I’s England and Philip II’s Spain, fought over religion, English help for the Dutch revolt and English raids on Spain’s Atlantic trade. Its best-known episode is the defeat of the Spanish Armada in 1588; England’s counter-attack failed in 1589, Cádiz was sacked in 1596, and Spanish troops landed in Ireland in 1601. James I made peace in the Treaty of London in 1604, restoring the position before the war.
