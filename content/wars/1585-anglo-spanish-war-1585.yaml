  - title: The English Armada and Cádiz
    date: 1589–1597
    when: "1589-05-04"
    borders: "1596-07-01"
    countries: [gb, es, pt, fr]
    body:
      - In 1589 Elizabeth sent a fleet of her own under Drake and Sir John Norris to destroy the surviving Spanish ships, raise Portugal for the pretender Dom António and seize the Azores. It wasted two weeks at A Coruña, failed to take Lisbon and lost thousands of men to disease, and Philip rebuilt his navy. England turned to helping Henry IV of France against the Catholic League and Spain, sending troops to Normandy and to Brittany, where a Spanish force held Blavet; in 1594 English and French troops stormed the Spanish fort at Crozon near Brest. In 1595 Spanish soldiers from Brittany burned Mousehole and Penzance.
      - In June 1596 an English and Dutch fleet under Lord Howard and the Earl of Essex attacked Cádiz. It destroyed or took the warships in the bay, and its soldiers stormed and sacked the city and held it for two weeks, while the Spanish burned the merchant fleet to keep it from them. Philip answered with two more armadas. In October 1596 a storm off Cape Finisterre wrecked many ships of the first, and the second was scattered by gales off the Channel in October 1597. Drake and John Hawkins had both died on a failed raid on the Caribbean, and Essex’s voyage to the Azores in 1597 also failed.
    facts:
      - [English Armada, "1589, repulsed at A Coruña and Lisbon"]
      - [Capture of Cádiz, "1–15 July 1596"]
      - [Spanish armadas of 1596 and 1597, "scattered by storms"]
    markers:
      - kind: held
        side: es
        name: A Coruña
        date: May 1589
        text: The English took and plundered the lower town but could not take the upper town, whose defenders included the townswoman María Pita, remembered as its heroine.
        lonlat: [-8.396, 43.371]
      - kind: held
        side: es
        name: Lisbon
        date: June 1589
        text: Norris marched on the city from Peniche, but the Portuguese did not rise for Dom António, and the English withdrew.
        lonlat: [-9.15, 38.725]
      - kind: held
        side: es
        name: Blavet
        date: 1590–1598
        text: The Spanish base in southern Brittany, from which ships could threaten England’s south coast.
        lonlat: [-3.352, 47.707]
      - kind: taken
        side: en
        name: Crozon
        date: November 1594
        text: English troops under Norris and French royalists stormed the Spanish fort on the peninsula opposite Brest. Almost all of the garrison of about 400 was killed.
        lonlat: [-4.535, 48.34]
      - kind: event
        side: es
        name: Mount’s Bay
        date: 2 August 1595
        text: Four Spanish galleys landed soldiers who burned Mousehole, Newlyn and Penzance, the only Spanish landing in England during the war.
        lonlat: [-5.539, 50.083]
      - kind: taken
        side: en
        name: Cádiz
        date: 1 July 1596
        text: The city was sacked and partly burned, and leading citizens were taken to England for ransom. Two Spanish galleons were captured.
        lonlat: [-6.298, 36.535]
      - kind: event
        name: Cape Finisterre
        date: October 1596
        text: The armada sent to avenge Cádiz was caught by a storm soon after sailing; dozens of ships and some thousands of men were lost.
        lonlat: [-9.272, 42.883]
        lp: l
    arrows:
