steps:
  - title: The Armada
    date: 1585–1588
    when: "1585-08-20"
    borders: "1588-08-08"
    countries: [gb, es, pt, fr, be, nl, ie]
    body:
      - Relations between Elizabeth I and Philip II had soured over religion, English raids on Spain’s American trade and English sympathy for the Dutch rebels. When the Duke of Parma’s reconquest of the southern Netherlands took Antwerp in August 1585, Elizabeth made the Treaty of Nonsuch with the rebels and sent an army under the Earl of Leicester, while Francis Drake raided the Spanish Caribbean. Philip began to plan an invasion of England, and after Mary, Queen of Scots, was executed in February 1587 he had no reason to wait for a Catholic succession. That spring Drake raided Cádiz and destroyed dozens of ships gathering for the expedition.
      - The Armada, about 130 ships under the Duke of Medina Sidonia, left Lisbon in May 1588 to escort Parma’s army across from Flanders. Sighted off Cornwall on 29 July, it sailed up the Channel in a tight crescent, harried by the English under Lord Howard and Drake, but lost few ships. Anchored off Calais, it was scattered by fireships on the night of 7–8 August, and the next day the English attacked it off Gravelines. Parma’s barges, blockaded by Dutch ships, never came out. The wind drove the Armada north, round Scotland and Ireland, where storms wrecked many ships; around a third never returned, and thousands of men died.
    facts:
      - [Drake’s raid on Cádiz, "29 April – 1 May 1587"]
      - [Battle of Gravelines, "8 August 1588, English victory"]
      - [Spanish Armada, "about 130 ships; around a third lost"]
    markers:
      - kind: naval
        side: en
        name: Cádiz
        date: April 1587
        text: Drake sailed into the harbour and burned or took some two dozen ships and their stores, “singeing the King of Spain’s beard”, as he put it.
        lonlat: [-6.298, 36.535]
      - kind: event
        side: es
        name: Lisbon
        date: May 1588
        text: The Armada sailed from the Tagus, but storms forced it into A Coruña to refit, and it did not leave Spain until late July.
        lonlat: [-9.15, 38.725]
      - kind: naval
        name: Off Plymouth
        date: 31 July 1588
        text: The English fleet slipped out of harbour, got to windward of the Armada and bombarded it from long range. Two Spanish ships were lost by accident and captured.
        lonlat: [-4.142, 50.3]
      - kind: naval
        name: Off Portland and the Isle of Wight
        date: 2–4 August 1588
        text: Two more running fights did little damage, but kept the Armada from anchoring in the Solent.
        lonlat: [-2.0, 50.45]
      - kind: naval
        side: en
        name: Calais
        date: 7–8 August 1588
        text: Eight fireships sent in at night made the Spanish captains cut their cables and scatter, breaking the Armada’s formation.
        lonlat: [1.856, 50.948]
        lp: l
      - kind: naval
        side: en
        name: Battle of Gravelines
        date: 8 August 1588
        text: In close fighting the English sank or drove ashore several ships and damaged many more, before the wind carried the Armada into the North Sea.
        lonlat: [2.128, 50.986]
      - kind: held
        side: es
        name: Nieuwpoort
        date: August 1588
        text: Parma’s army of invasion waited around Dunkirk and Nieuwpoort, but Dutch flyboats in the shallows kept its barges in port.
        lonlat: [2.75, 51.13]
      - kind: event
        side: en
        name: Tilbury
        date: 19 August 1588
        text: Elizabeth reviewed the army guarding the Thames and made her famous speech, claiming “the heart and stomach of a king”.
        lonlat: [0.375, 51.453]
      - kind: event
        name: Streedagh
        date: September 1588
        text: Three Armada ships were wrecked on this Sligo beach; more than a thousand men drowned or were killed ashore.
        lonlat: [-8.565, 54.41]
      - kind: event
        name: Girona
        date: October 1588
        text: The galleass Girona, crowded with survivors of other wrecks, struck rocks near the Giant’s Causeway. Nearly all of about 1,300 men aboard died.
        lonlat: [-6.512, 55.241]
