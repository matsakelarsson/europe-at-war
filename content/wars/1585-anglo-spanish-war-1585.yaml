  - title: Kinsale and the Treaty of London
    date: 1600–1604
    when: "1600-07-02"
    borders: "1604-08-28"
    countries: [gb, ie, es, be, nl]
    body:
      - The war’s last years were fought mainly in the Low Countries and Ireland. English regiments under Sir Francis Vere fought in the Dutch army that beat Archduke Albert at Nieuwpoort on 2 July 1600, and from 1601 helped hold Ostend, whose siege lasted more than three years. In Ireland, where Hugh O’Neill, Earl of Tyrone, had been at war with the crown since the mid-1590s, Spain at last sent help. About 3,500 Spanish soldiers under Juan del Águila landed at Kinsale in October 1601. Lord Mountjoy besieged them, and on 3 January 1602 routed the Irish army that came to their relief; del Águila surrendered on terms and sailed home.
      - Elizabeth died on 24 March 1603, and James VI of Scotland, who had never been at war with Spain, became James I of England and soon stopped the fighting. In 1604 English and Spanish envoys met at Somerset House in London, and the treaty was signed in August. Neither side gained land. England ended its official help to the Dutch, though English volunteers went on serving them; Spain gave up hope of restoring Catholicism in England, and English merchants could trade with Spain again. Ostend fell to Spain three weeks after the peace.
    facts:
      - [Battle of Nieuwpoort, "2 July 1600, Dutch and English victory"]
      - [Battle of Kinsale, "3 January 1602 (24 December 1601 in English reckoning), English victory"]
      - [Treaty of London, "28 August 1604 (18 August in England)"]
    markers:
      - kind: battle
        side: nl
        name: Battle of Nieuwpoort
        date: 2 July 1600
        text: Maurice of Nassau’s army, with Vere’s English troops in the front line, beat the Spanish army of Flanders on the dunes and beach.
        lonlat: [2.738, 51.156]
        lp: l
      - kind: siege
        side: es
        name: Ostend
        date: July 1601 – September 1604
        text: One of the longest sieges in history; by some estimates more than 100,000 people were killed, wounded or died of disease. Ambrogio Spinola took the ruined town on 20 September 1604.
        lonlat: [2.917, 51.233]
      - kind: battle
        side: en
        name: Battle of Kinsale
        date: 3 January 1602
        text: Mountjoy’s cavalry broke the Irish army of O’Neill and O’Donnell before it could join the besieged Spaniards.
        lonlat: [-8.512, 51.699]
      - kind: treaty
        name: Somerset House
        date: 28 August 1604
        text: The peace conference met in the queen’s palace on the Strand, and the treaty is sometimes named after it.
        lonlat: [-0.118, 51.511]
    arrows:
      - side: es
        label: Del Águila, from Lisbon
        phase: 1
        via: [[-9.8, 47.0], [-9.6, 50.0], [-8.53, 51.66]]
      - side: ir
