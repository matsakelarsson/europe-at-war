notes:
  - Japanese dates are in the lunar calendar, with Gregorian equivalents. The armies sailed on the 16th day of the sixth month of Tenshō 13; English Wikipedia dates Motochika’s submission to the 11th day of the seventh month (6 August 1585).
  - Whether Motochika had really united all of Shikoku before the invasion is debated, since parts of Iyo may still have been outside his control. The army sizes are those given in Japanese accounts and are uncertain.
