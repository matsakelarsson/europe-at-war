id: invasion-of-shikoku
name: Toyotomi Invasion of Shikoku
start: "1585-07"
end: "1585-08"
tier: C
summary: "Hideyoshi’s conquest of Shikoku from Chōsokabe Motochika. From his home province of Tosa, Motochika had spent the 1570s and early 1580s overrunning Awa, Sanuki and Iyo; Oda Nobunaga had been about to send an army against him when he was killed in 1582, and in 1584 Motochika sided with Tokugawa Ieyasu and Oda Nobukatsu against Hideyoshi. By the spring of 1585, with the surrender of the Kōno of Iyo, he held nearly all of the island. Talks broke down over how much he would give up, and in the sixth month of 1585 Hideyoshi, who was ill, sent his brother Hashiba Hidenaga in his place with an army put at about 113,000 men, carried over the Inland Sea in hundreds of ships. Hidenaga and Hideyoshi’s nephew Hidetsugu crossed by way of Awaji and landed in Awa with some 60,000; Ukita Hideie’s army of about 23,000 landed at Yashima in Sanuki; and the Mōri, now Hideyoshi’s allies, sent 25,000 to 40,000 under Kobayakawa Takakage and Kikkawa Motonaga to Iyo, where they stormed Takao castle and killed Kaneko Motoie, Motochika’s chief ally in the east of the province. Motochika, with 20,000 to 40,000 men, had made his headquarters at Hakuchi castle in the west of Awa, where the four provinces meet, but the invaders came from three sides at once. The castle of Ichinomiya in Awa held out against Hidenaga for weeks until he cut off its water, and other Chōsokabe strongholds fell. Motochika wanted to fight on, but his retainers persuaded him that it was hopeless, and in the seventh month (August 1585) he submitted, keeping Tosa only. Awa went to Hachisuka Iemasa, Sanuki to Sengoku Hidehisa and Sogō Masayasu, and Iyo to Kobayakawa Takakage. Hideyoshi had become imperial regent (kampaku) during the campaign; Motochika and his men served him in Kyushu the next year."
