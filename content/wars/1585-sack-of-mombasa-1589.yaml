notes:
  - "The Portuguese chroniclers Diogo do Couto and João dos Santos are the main sources, with Ottoman records studied by Giancarlo Casale. Numbers of ships, men and plunder differ between them."
  - "Who the Zimba were is uncertain. The name was a Portuguese label for several warrior bands of the Zambezi region; many historians link these to the mercenaries of Lundu, a ruler of the Maravi, who fought the Portuguese on the lower Zambezi in the 1590s. Dos Santos’s claims that they ate their captives, 3,000 at Kilwa, and that 20,000 of them attacked Mombasa, are not accepted by most historians."
