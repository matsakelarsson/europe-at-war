steps:
  - title: Mir Ali Bey on the Swahili coast
    date: 1585–1587
    when: "1586"
    borders: "1586-06-01"
    countries: [ke, so, ye]
    body:
      - "By the 1580s the Swahili towns had paid tribute to Portugal for two generations, and the Ottomans, masters of the Red Sea and Yemen since the 1540s, were looking for openings in the Indian Ocean. In 1583 Sultan Murad III sent two galliots to Yemen, and the governor Hasan Pasha gave them to Mir Ali Bey, a corsair who had raided Portuguese Muscat in 1581, for a raid on the Swahili coast. One galliot turned back; with the other and about 80 men he sailed south in 1585."
      - "Mogadishu declared for Murad III and gave him armed boats, and Barawa, Lamu, Pemba, Mombasa and other towns followed, many of them with old grievances against Portuguese tribute and customs; only Malindi refused. At Lamu the townspeople handed over the Portuguese captain Roque de Brito and his ship, which Mir Ali Bey manned with local volunteers and used to take another Portuguese vessel. In 1586 he returned to Mocha with a flotilla of some twenty ships, plunder said to be worth 150,000 cruzados and about 60 Portuguese prisoners, promising to come back."
      - "In January 1587 the viceroy in Goa sent Martim Afonso de Melo with two galleons, three galleys, thirteen smaller oared ships and about 650 soldiers. They found no trace of the Ottomans. At Faza, on Pate Island, the king gathered some 4,000 warriors against them; he was killed and the town was sacked. Pate submitted again, Mombasa paid 4,000 cruzados to be spared, and the fleet returned to Goa by way of Malindi."
    facts:
      - [Mir Ali Bey’s first force, "one galliot, about 80 men"]
      - [Returned to Mocha with, "some 20 ships and about 60 Portuguese prisoners"]
      - [Faza sacked, "1587"]
