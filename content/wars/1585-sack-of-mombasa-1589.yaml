id: sack-of-mombasa-1589
name: Mir Ali Bey’s expeditions and the sack of Mombasa
start: "1585"
end: "1589-03"
tier: B
summary: "The Ottoman challenge to Portugal on the Swahili coast in the 1580s and its end at Mombasa. The corsair Mir Ali Bey sailed from Yemen with a single galliot in 1585–1586 and was welcomed by town after town, from Mogadishu to Mombasa, as a deliverer from Portuguese tribute; only Malindi held out. He returned to Mocha with captured Portuguese ships, plunder and prisoners. A Portuguese fleet from Goa sacked Faza in 1587 and fined Mombasa. In 1588 Mir Ali Bey came back with five galleys and fortified Mombasa, and in March 1589 a fleet under Tomé de Sousa Coutinho attacked him there just as the Zimba, a mysterious army that had come up the coast from the Zambezi, crossed from the mainland. Caught between them, the Ottomans were destroyed and Mir Ali Bey surrendered to the Portuguese; Mombasa was sacked, and the Zimba were then beaten at Malindi by the Segeju. The Portuguese punished the towns that had joined the Ottomans, made Mombasa their headquarters and in 1593 began Fort Jesus."
countries: [ke, tz, so, ye, pt]
