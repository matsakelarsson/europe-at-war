  - title: Mombasa, 1589
    date: 1588 – March 1589
    when: "1589-03-05"
    borders: "1589-03-07"
    countries: [ke, tz]
    body:
      - "Mir Ali Bey sailed again from Mocha in 1588 with five galleys and about 300 men, and the towns of the coast once more paid him tribute. A Portuguese battery drove his ships off from Malindi, and he made Mombasa his base, building a fort with a tower and guns at the harbour mouth. Meanwhile an army the Portuguese called the Zimba was moving up the coast from the south. It had appeared near the Kerimba islands in about 1585, and in 1587 or 1588 it sacked Kilwa. By early 1589 it was camped on the mainland opposite Mombasa island."
      - "The viceroy sent Tomé de Sousa Coutinho with two galleons, about nineteen galleys and smaller oared ships and some 900 soldiers, which reached the coast late in February 1589. On 5 March they forced the harbour, silenced Mir Ali Bey’s guns and took or burned his galleys; two days later 500 Portuguese landed in a town that its people had abandoned. The Zimba were now allowed to cross to the island. Townspeople and Ottoman soldiers fled into the sea, where many drowned trying to reach the Portuguese ships; Mir Ali Bey, after hiding for two days, threw himself into the water and was taken prisoner by the Portuguese. He was taken to Goa and then to Lisbon, became a Christian and lived out his life in Portugal."
      - "The Zimba marched on to Malindi and were attacking its walls when the Segeju, a people of the hinterland who were Malindi’s allies, fell on them from behind with some 3,000 men and destroyed them; according to dos Santos only their leader and about a hundred men got back to the Zambezi. The Portuguese beheaded the ruler of Lamu, sacked Manda and Pate for siding with the Ottomans, and rewarded Malindi: in 1593 its ruler was installed at Mombasa, which became the seat of the Portuguese captain of the coast, and on 11 April 1593 the building of Fort Jesus began. The Ottomans never returned to the coast, and Fort Jesus held until Oman took it in 1698."
    facts:
      - [Coutinho’s fleet, "about 20 ships and 900 soldiers"]
      - [Battle of Mombasa, "5–7 March 1589"]
      - [Fort Jesus begun, "11 April 1593"]
