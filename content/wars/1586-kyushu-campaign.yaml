id: kyushu-campaign
name: Kyushu Campaign
start: "1586-07"
end: "1587-06-13"
tier: B
summary: "Toyotomi Hideyoshi’s conquest of Kyushu from the Shimazu of Satsuma. From their base in the far south the Shimazu had beaten the Ōtomo at Mimikawa (1578) and the Ryūzōji at Okitanawate (1584) and by 1586 were close to ruling the whole island. The Ōtomo lord Sōrin appealed to Hideyoshi, who ordered the Shimazu to stop and, when they refused his division of the island, sent an advance force to Bungo. The Shimazu took Iwaya in Chikuzen, invaded Bungo and beat Hideyoshi’s vanguard at Hetsugigawa in January 1587. In the spring Hideyoshi came himself with an army put at 200,000 or more, in two great columns: his brother Hidenaga marched down the east coast and beat the Shimazu at Nejirozaka in Hyūga, while Hideyoshi went down the west through Higo into Satsuma. On 13 June 1587 Shimazu Yoshihisa came to Hideyoshi’s camp at the temple of Taihei-ji in Sendai, his head shaved as a monk, and surrendered. The Shimazu kept Satsuma, Ōsumi and part of Hyūga; the rest of Kyushu was shared among Hideyoshi’s vassals, and at Hakozaki he issued his edict expelling the Jesuit missionaries."
countries: [jp]
sides:
