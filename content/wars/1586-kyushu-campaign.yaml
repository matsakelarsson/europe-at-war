notes:
  - Japanese dates are in the lunar calendar; the Gregorian equivalents are those given in English and Japanese sources. Hetsugigawa was fought on the 12th day of the twelfth month of Tenshō 14 (20 January 1587); Yoshihisa surrendered on the 8th day of the fifth month of Tenshō 15.
  - Japanese Wikipedia gives the Toyotomi armies 200,000 to 270,000 men and the Shimazu 20,000 to 50,000; such figures are estimates from the orders for troops and supplies.
  - The Ōtomo lord Ōtomo Sōrin, a Christian convert, had bought cannon from the Portuguese; one of them, called “Kunikuzushi” (destroyer of provinces), was used in the defence of his castle at Usuki.
