  - title: Hideyoshi comes to Kyushu
    date: April – July 1587
    when: "1587-05"
    borders: "1587-06-13"
    countries: [jp]
    body:
      - Hideyoshi had ordered some thirty-seven provinces to send 200,000 men and had rice gathered for 300,000. His brother Hidenaga set out first, and Hideyoshi left Osaka in April 1587, reached Kokura in early May and divided his forces. Hidenaga, with the Mōri, Ukita and other lords, marched through Bungo, where the Shimazu fell back before him, into Hyūga and laid siege to Takajō castle. On 24 May the Shimazu brothers came to relieve it with about 20,000 men and attacked the fortified camp at Nejirozaka; they were beaten off when Tōdō Takatora, Kuroda Yoshitaka and Kobayakawa Takakage came to its help, and with this defeat their organised resistance ended.
      - Hideyoshi himself took the western road. His men stormed Ganjaku castle in Buzen in a day, the Akizuki submitted, and he marched south through Higo by Kumamoto and Yatsushiro, then went by sea to Izumi on the Satsuma border, meeting little resistance. Yoshihisa, who had already sent word to Hidenaga that he would make peace, shaved his head, took the Buddhist name Ryūhaku, and on 13 June came to Hideyoshi’s headquarters at the temple of Taihei-ji in Sendai and surrendered; Yoshihiro followed. Hideyoshi spared them and left the Shimazu Satsuma, Ōsumi and part of Hyūga. On his way back he stopped at Hakozaki, by Hakata, where he announced the division of Kyushu among his vassals, ordered the rebuilding of the ruined port and, on 24 July, issued the edict expelling the Jesuit missionaries. Ōtomo Sōrin had died in June.
    facts:
      - [Hideyoshi leaves Osaka, "April 1587"]
      - [Hideyoshi lands at Kokura, "early May 1587"]
      - [Battle of Nejirozaka, "24 May 1587"]
      - [Surrender at Taihei-ji, "13 June 1587"]
      - [Edict expelling the missionaries, "24 July 1587"]
