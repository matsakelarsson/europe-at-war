steps:
  - title: The Shimazu advance
    date: July 1586 – January 1587
    when: "1586-09"
    borders: "1587-01-20"
    countries: [jp]
    body:
      - The Shimazu, lords of Satsuma and Ōsumi since the twelfth century, united their home provinces in the mid-1500s under Shimazu Takahisa and his four sons, Yoshihisa, Yoshihiro, Toshihisa and Iehisa. In 1578 they routed the army of the Christian lord Ōtomo Sōrin of Bungo at Mimikawa in Hyūga, and in 1584 they killed Ryūzōji Takanobu, the lord of Hizen, at Okitanawate near Shimabara. By 1586 they held or dominated most of Kyushu, and only the Ōtomo in Bungo and their retainers in Chikuzen stood in their way. Sōrin went to Osaka in person to ask Hideyoshi for help. Hideyoshi, now imperial regent, ordered the Kyushu lords to keep the peace and proposed a division of the island; the Shimazu rejected it.
      - In the summer of 1586 the Shimazu marched north into Chikuzen to finish the conquest before Hideyoshi could arrive. In September they stormed Iwaya castle near Dazaifu, where the Ōtomo commander Takahashi Jōun and all his garrison died, but his son Tachibana Muneshige held Tachibana castle and they turned back. Hideyoshi sent an advance force of Shikoku lords under Sengoku Hidehisa, with Chōsokabe Motochika and his son Nobuchika and Sogō Masayasu, to help the Ōtomo in Bungo. Late in 1586 the Shimazu invaded Bungo from two sides, Yoshihiro over the mountains from Higo and Iehisa from Hyūga. Iehisa laid siege to Tsurugajō castle, and on 20 January 1587, when the allied army crossed the Hetsugi river to relieve it, his men fell on them; Chōsokabe Nobuchika and Sogō Masayasu were killed and the survivors fled. The Shimazu took Funai, the Ōtomo capital, but Sōrin held out in his island castle of Usuki with the help of Portuguese cannon.
    facts:
      - [Fall of Iwaya, "September 1586"]
      - [Battle of Hetsugigawa, "20 January 1587, Shimazu victory"]
      - [Strength at Hetsugigawa, "about 20,000 allies, 10,000–13,000 Shimazu"]
