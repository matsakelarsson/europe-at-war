id: mughal-conquest-of-kashmir
name: Mughal conquest of Kashmir
start: "1585-12"
end: "1589"
tier: C
summary: "Akbar’s annexation of the Kashmir Sultanate, ruled since 1561 by the Chak dynasty. In December 1585, while Akbar was at Attock on the Indus, he sent an army of about 5,000 horsemen under Raja Bhagwant Das of Amber and Mirza Shah Rukh across the mountains in winter. Sultan Yusuf Shah Chak met them at the Buliasa pass, but with his nobles divided he came to the Mughal camp and agreed terms on 14 February 1586. Akbar would not accept the agreement and kept Yusuf Shah a prisoner; he later held a Mughal rank in Bihar and died in exile in 1592. The Kashmiri nobles made his son Yaqub Shah sultan and fought on. A second Mughal army under Qasim Khan entered the valley later in 1586 and took Srinagar in the autumn, while Yaqub Shah kept up resistance from the hills until he submitted in 1589. Akbar visited the valley that year, and Kashmir became part of the Mughal province of Kabul and a favourite summer retreat of the Mughal emperors."
countries: [in, pk]
