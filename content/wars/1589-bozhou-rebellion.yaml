notes:
  - "Most of what is known comes from Ming officials’ reports and histories, which call the war the pacification of Bozhou; Yang Yinglong’s side of the story survives only through them. Dates are converted from the Chinese lunar calendar as the sources give them."
  - "Bozhou’s people were of many groups. Ming sources call most of Yang’s soldiers Miao, a name they used loosely for the non-Han peoples of the south-west; many troops on the Ming side came from the same peoples."
