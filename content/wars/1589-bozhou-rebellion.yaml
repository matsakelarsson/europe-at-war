id: bozhou-rebellion
name: Bozhou rebellion
start: "1589"
end: "1600-07-15"
tier: B
summary: "The war between the Ming and Yang Yinglong, hereditary chieftain (tusi) of Bozhou, around today’s Zunyi in northern Guizhou, whose family had ruled the region for some seven centuries under the Tang, Song, Yuan and Ming. From 1589 Yang fought rival chiefs and raided Ming territory, while the court, busy with the war against Japan in Korea, alternated between campaigns and pardons. After his forces took Qijiang in Sichuan in 1599, the court gave Li Hualong command of Sichuan, Guizhou and Huguang. In March 1600 eight Ming columns, about 240,000 men, most of them indigenous troops, invaded Bozhou, and on 15 July 1600 they stormed Yang’s mountain fortress of Hailongtun; Yang took his own life. The chieftaincy was abolished and its lands divided between Sichuan and Guizhou under appointed officials. The Ming counted the war among the Wanli Emperor’s Three Great Campaigns, with the Ningxia campaign of 1592 and the war in Korea."
