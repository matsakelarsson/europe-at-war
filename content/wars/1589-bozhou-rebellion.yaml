  - title: Li Hualong’s eight armies and Hailongtun
    date: March – July 1600
    when: "1600-03-26"
    borders: "1600-07-15"
    countries: [cn]
    body:
      - With the war in Korea over, the court could turn south. Li Hualong, appointed in 1599 with authority over Sichuan, Guizhou and Huguang, gathered an army of about 240,000 men, among them veterans of Korea such as Liu Ting; about three in ten were Chinese soldiers and the rest indigenous troops raised by other tusi chiefs. At a council in Chongqing in March 1600 he divided them into eight columns of about 30,000 men, which set out from Sichuan, Guizhou and Huguang on 26 March.
      - Liu Ting’s column, advancing from Qijiang, defeated Yang’s son Yang Chaodong in April and fought its way through the passes into Bozhou. In May Yang Yinglong attacked it, was beaten and fell back to Hailongtun. The Ming armies surrounded the fortress in early June; a week of heavy rain stopped the siege, but at the end of June they took the outworks, and on 15 July 1600 they stormed the fortress, which Yang had held with about 17,000 men. Yang Yinglong took his own life, and his brother and eldest son were taken to Beijing and executed.
      - Ming reports counted 22,687 rebels killed and more than 126,000 people who surrendered, after 104 days of fighting at a cost of about 1.5 million taels of silver. The Yang chieftaincy was abolished; its lands were divided into Zunyi prefecture under Sichuan and Pingyue under Guizhou and governed by appointed officials, with settlers and schools. The ruins of Hailongtun are part of the Tusi Sites on UNESCO’s World Heritage List.
