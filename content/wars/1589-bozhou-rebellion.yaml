steps:
  - title: Yang Yinglong and the court
    date: 1589–1599
    when: "1589"
    borders: "1599-08-07"
    countries: [cn]
    body:
      - In the mountains of the south-west the Ming ruled through hereditary chiefs, the tusi, who kept their own lands and armies in return for tribute and military service. The greatest of them was the Yang family of Bozhou, said to descend from a Tang general of the 9th century and given the title of pacification commissioner (xuanweishi) under the Yuan. Yang Yinglong succeeded his father in 1571 and served the Ming in several campaigns, but he fell out with neighbouring chiefs and with Ming officials. In 1587 he had his wife and her mother killed; her family accused him before the provincial authorities, and from 1589 his men fought rival chiefs and raided Ming lands.
      - The court wavered between force and pardon, in part because it needed troops for the war against the Japanese in Korea. Yang surrendered in Sichuan in 1593 and was condemned to death at Chongqing, but was released when he offered silver and soldiers for Korea; a Ming expedition under Wang Jiguang was ambushed and broke up in the spring of 1594, and in 1595 Yang was fined 40,000 taels of silver and made to hand over his office to his son. His son Yang Kedong died while held hostage in Chongqing.
      - In the late 1590s Yang called himself emperor and raided Sichuan, Guizhou and Huguang. In the spring of 1599 his men beat a force of 3,000 in south-eastern Sichuan, and that summer his army, said to be 80,000 strong, took Qijiang and killed its garrison and commander, opening the road to Chongqing.
