id: moroccan-invasion-of-the-songhai-empire
name: Moroccan invasion of the Songhai Empire
start: "1590-10"
end: "1599"
tier: A
summary: "The conquest of the Niger bend by an army sent across the Sahara by the Saadian sultan Ahmad al-Mansur of Morocco, which destroyed the Songhai Empire and founded the Pashalik of Timbuktu. Al-Mansur wanted the gold and the salt trade of the Sudan and recognition as caliph; a quarrel over the Taghaza salt mines gave him his pretext. In October 1590 Judar Pasha left Marrakesh with some 3,000–4,000 soldiers, most of them musketeers, many of them Spanish-born renegades and Andalusi exiles, and after a march of about five months across the desert defeated the far larger army of Askia Ishaq II at Tondibi, near Gao, on 13 March 1591. Gao and Timbuktu were occupied; al-Mansur rejected the askiya’s offer of tribute and sent Mahmud ibn Zarqun, who beat Ishaq again in October 1591, seized his successor Muhammad Gao by treachery and fought the new askiya, Nuh, in Dendi for two years. Timbuktu rose against its garrison, and in 1593 its leading scholars, among them Ahmad Baba, were arrested and deported to Marrakesh. Mahmud was killed in the hills of al-Hajar in 1595; his successor routed Nuh, and in 1599 a Malian attempt on Djenné failed. The Moroccans held the river from Djenné to Gao and Kukiya, but never ruled the countryside; the Songhai kept an independent kingdom in Dendi, and the descendants of the soldiers, the Arma, ruled Timbuktu under their own pashas until the nineteenth century."
countries: [ml, ne, ma]
sides:
  - id: mor
    name: Saadian Morocco and its army in the Sudan
    polities: [morocco, pashalik-timbuktu]
    ink: red
    moves: Moroccan moves
    success: Moroccan success
  - id: son
    name: Songhai (Askia Ishaq II, then the askias of Dendi)
    polities: [songhai]
    ink: orange
    moves: Songhai moves
    success: Songhai success
  - id: mali
