  - title: Gao, Timbuktu and the rejected peace
    date: March – August 1591
    when: "1591-03"
    borders: "1591-05-30"
    countries: [ml, ma]
    body:
      - "Judar entered Gao, where the khatib Mahmud Darami received him. He stayed only seventeen days. The askiya’s palace disappointed him: he wrote that the house of the head of the donkey drivers in Morocco was better. His men were sick and exhausted, and when Ishaq offered to pay 100,000 pieces of gold and to deliver 1,000 slaves if the Moroccans went home, Judar sent the offer on to Marrakesh with a recommendation to accept it."
      - "While he waited, Judar moved to Timbuktu. He camped south of the town from 25 April for 35 days and entered it on 30 May 1591, building a fortress (kasbah) in the quarter of the Ghadames merchants, whose owners were turned out of their houses. The qadi of Timbuktu, Umar, sent only a muezzin to greet him. With Songhai authority gone, Fulbe and Bambara raiders spread through the countryside around Djenné and the inland delta."
      - "Al-Mansur rejected the askiya’s offer. He dismissed Judar and sent a new commander, Mahmud ibn Zarqun, with orders to conquer the whole country. Mahmud reached Timbuktu on 17 August 1591, took over the army and kept Judar as his subordinate."
    facts:
      - [Gao occupied, "March 1591, for 17 days"]
      - [Askia Ishaq’s offer, "100,000 pieces of gold and 1,000 slaves"]
      - [Moroccans enter Timbuktu, "30 May 1591"]
      - [Mahmud ibn Zarqun arrives, "17 August 1591"]
