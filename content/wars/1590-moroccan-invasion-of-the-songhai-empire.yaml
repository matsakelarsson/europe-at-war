  - title: Across the Sahara
    date: October 1590 – March 1591
    when: "1590-10"
    borders: "1591-03-01"
    countries: [ma, dz, ml]
    body:
      - "Command went to Judar Pasha, a eunuch of Spanish birth who had been brought up at the Saadian court; the Tarikh al-Sudan describes him as short and blue-eyed. His army is usually put at 3,000–4,000 fighting men; the Tarikh al-Sudan says 3,000 horse and foot, with twice as many followers of all kinds. Most were musketeers: converts of European origin, many of them former Christian captives, Andalusi Muslims expelled from Spain and Moroccan troops, with some lancers, about 8,000 camels, 1,000 packhorses and a few light guns. Its captains included the caïds Mustafa al-Turki, Ahmad ibn al-Haddad and Ahmad ibn Atiya, and two renegades, Ba Hassan Friro and Qasim Waradui, led the wings."
      - "The army left Marrakesh in October 1590, crossed the High Atlas and went down the valley of the Draa to the Ktawa oases at the desert’s edge. From there it marched for about two months across the Sahara, passing east of Arawan and seizing the camels of a caravan it met on the way. It reached the Niger near Karabara, close to Bamba, at the end of February or on 1 March 1591, where Judar gave a feast to celebrate. How many men died of thirst and sickness on the way is not known."
      - "At Gao, the Tarikh al-Sudan says, Askia Ishaq’s council rejected every useful plan, such as harassing the invaders in the desert or filling in the wells on their route. The askiya had Hammou, the Songhai agent at Taghaza, arrested as a spy, and called up his army only at the last moment."
    facts:
      - [Departure from Marrakesh, "October 1590 (16 or 30 October)"]
      - [Moroccan army, "about 3,000–4,000 fighting men, most of them musketeers"]
      - [Niger reached, "about 1 March 1591"]
