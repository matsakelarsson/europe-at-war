  - title: Tondibi
    date: 13 March 1591
    when: "1591-03-13"
    borders: "1591-03-13"
    countries: [ml]
    view:
      center: [-0.500, 16.650]
      size: [340, 260]
    body:
      - "Judar marched down the Niger towards Gao and met the Songhai army at Tondibi, about 50 km north of the capital, on 13 March 1591 (12 March in some accounts). The Tarikh al-Sudan gives Askia Ishaq 12,500 horsemen and 30,000 foot soldiers, the Tarikh al-Fattash 18,000 horsemen and 9,700 foot; either way the Songhai far outnumbered the invaders, but they had almost no firearms."
      - "The Songhai drove a herd of cattle at the Moroccan lines, but the gunfire turned the animals back into their own ranks. The musketeers then broke the Songhai cavalry. According to the Tarikh al-Fattash, a body of Songhai foot soldiers, refusing to flee, sat down on their shields and were killed where they were. Within a few hours the askiya’s army was in flight."
      - "Ishaq ordered Gao and Timbuktu to be evacuated and crossed to the Gourma bank of the Niger with what was left of his army; many people drowned in the crossing. The harbour master of Timbuktu took the town’s boats away upriver. Songhai never again met the Moroccans in a pitched battle with its full strength."
    facts:
      - [Battle of Tondibi, "13 March 1591, Moroccan victory"]
      - [Songhai army, "about 27,700 (Tarikh al-Fattash) to 42,500 (Tarikh al-Sudan)"]
      - [Moroccan army, "about 3,000–4,000"]
    markers:
