steps:
  - title: Salt, gold and a caliph’s claim
    date: 1556–1590
    when: "1583"
    borders: "1590-10-01"
    countries: [ma, dz, ml]
    body:
      - "The salt mines of Taghaza, in the middle of the Sahara, supplied the markets of the Sudan and were held by Songhai through a local agent. The Saadian sultans of Morocco claimed them from the 1540s; in 1556–1557 Muhammad al-Shaykh briefly occupied Taghaza and had the askiya’s agent killed, and the Tuareg who worked the salt opened a new mine further south. Ahmad al-Mansur, who came to the throne after the battle of Alcácer Quibir in 1578 and grew rich on the ransoms of Portuguese captives, demanded the mines’ revenues, and Askia Dawud sent him a gift of gold instead."
      - "Al-Mansur’s aims went further. He needed gold to pay his army, wanted slaves for his sugar estates and claimed, as a sharif of the Prophet’s family, to be caliph of all Muslims. In 1583 his troops took the oases of Touat and Gourara, officially to restore order; about 1583 the king of Bornu, Idris Alooma, sent him an embassy and, according to Moroccan sources, an oath of allegiance; about 1585 a force of some 200 musketeers occupied Taghaza, and the salt workers moved to Taoudenni. Moroccan chroniclers record that his council objected to sending an army across the desert, and that al-Mansur answered that merchants crossed it every year and that firearms would decide the war."
      - "Songhai was weakened by quarrels within the ruling family after Askia Dawud’s death in 1582; in 1588 Askia Ishaq II had to crush a revolt by his brother, the balama al-Saddiq, who had made Timbuktu his base. At the turn of 1590 a letter from al-Mansur reached Gao demanding a tax on every load of salt from Taghaza; Ishaq refused in insulting terms and, the Tarikh al-Sudan says, sent back spears and a pair of iron sandals. A fugitive from the Songhai court, Wuld Kirinfil, was meanwhile in Marrakesh urging the sultan to invade."
    facts:
      - [Taghaza first occupied, "1556–1557"]
      - [Touat and Gourara taken, "1583"]
      - [Taghaza occupied again, "about 1585"]
      - [Ishaq II refuses al-Mansur’s demand, "about January 1590"]
