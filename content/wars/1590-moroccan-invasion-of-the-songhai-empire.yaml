  - title: Kukiya and the war in Dendi
    date: 1592–1594
    when: "1592"
    borders: "1593"
    countries: [ml, ne]
    body:
      - "The new askiya, Muhammad Gao, sent the Moroccans his oath of allegiance to al-Mansur and, when they ran short of food and began to eat their pack animals, a supply of millet. Mahmud then invited him to swear in person. Ignoring warnings, Muhammad Gao came to the Moroccan camp at Tenchi, near Kukiya, where he and 83 of his companions, princes and officials, were seized. They were taken to Gao and later killed; the Tarikh al-Sudan notes that Askia Muhammad had seized as many of Sonni Ali’s family at the same place a century before. Mahmud made Sulayman, a son of Askia Dawud who had gone over to him, askiya of the Songhai on the Moroccan side."
      - "The Songhai who refused to submit gathered in Dendi, in the south-east of the empire, and chose another son of Dawud, Nuh, as askiya. Mahmud followed them and built a kasbah at Kolen with a garrison of 200 musketeers. For two years the Moroccans fought Nuh in the bush and the forests along the river. The Songhai, who had learned the cost of pitched battles, turned to ambushes; in one fight, at Birnai, Mahmud lost 80 of his best infantry, and the chronicler, who calls Nuh’s ambushes treacherous, admits that Nuh achieved with a few men what Ishaq could not have done with a hundred times more. Kebbi helped the askiya of Dendi, and the Moroccans also lost many men to disease. Mahmud went back to Timbuktu in 1593 without having beaten Nuh."
    facts:
      - [Muhammad Gao seized at Tenchi near Kukiya, "late 1591 or early 1592, with 83 companions"]
      - [Askia Nuh chosen in Dendi, "1592"]
      - [Battle of Birnai, "about 1592–1593, 80 Moroccan infantry killed"]
