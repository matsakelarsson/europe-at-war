  - title: Djenné, 1599, and the Pashalik
    date: 1598–1599
    when: "1599-04-26"
    borders: "1599-04-26"
    countries: [ml, ne, ma]
    body:
      - "In 1599 the mansa of Mali, Mahmud IV, tried to take advantage of the Moroccans’ troubles. With Mande and Bambara troops he advanced on Djenné and camped on the dune of Sanuna, expecting the Fulbe of Masina to join him; their chief, Hammad Amina, went over to the Moroccans instead. On 26 April 1599 Moroccan reinforcements sent by boat from Timbuktu fought their way into the town, and their musketeers drove back the Malian army; after Friday prayers the garrison attacked and routed it. Mahmud IV fled, and Mali ceased to be a regional power."
      - "The same year Judar was recalled to Morocco, and soldiers of Christian birth were sent home. In Dendi Nuh’s brothers deposed him, while the Moroccans kept an askiya of their own for the Songhai under their rule. The Moroccans held garrisons in a line of kasbahs along the river, at Djenné, Konna, Tendirma, Kabara, Timbuktu, Bamba, Bourem, Gao and Kukiya among others, and sent settlers from southern Morocco; away from the river their authority was intermittent, and the Tuareg, Fulbe and Bambara were left largely to themselves."
      - "The conquest did not bring al-Mansur the riches he had hoped for. Gold reached Marrakesh for some years, but the trade routes were disrupted, and after al-Mansur’s death in 1603 Morocco fell into civil war. From 1612 the soldiers chose their own pashas, and from 1618 Morocco no longer appointed them or sent reinforcements. The Arma, descendants of the soldiers, ruled Timbuktu and the towns of the Niger bend under their own pashas until the early nineteenth century. The Songhai kingdom of Dendi made peace with them in 1630 and kept its independence, divided into several small kingdoms, until the nineteenth century."
    facts:
      - [Battle of Djenné, "26 April 1599, Moroccan victory"]
      - [Judar recalled, "1599"]
      - [Pashas chosen by the soldiers, "from 1612"]
