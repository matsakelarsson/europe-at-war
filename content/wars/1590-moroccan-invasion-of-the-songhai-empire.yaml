  - title: The end of Askia Ishaq and the Timbuktu rising
    date: August – December 1591
    when: "1591-08"
    borders: "1591-12-31"
    countries: [ml, bf, ne]
    body:
      - "Mahmud had two boats built from the trees of Timbuktu and the doors of its houses, and on 21 September 1591 marched downriver with about 3,500 musketeers; the Tarikh al-Sudan counts 174 tents of twenty men. On 14 October he met Ishaq again near Bamba, by the hill of Zenzen, and routed him. The askiya’s commanders then deserted him, proclaimed his brother Muhammad Gao askiya and took the royal insignia. Ishaq went with a few companions to the Gourma, whose people he had fought the year before; they killed him, his son and his followers, probably in March or April 1592."
      - "In Timbuktu, the Timbuktu-mondzo Yahya attacked the kasbah held by the caïd Mustafa al-Turki on 10 October 1591 and was shot dead; his head was carried round the town on a pole. Soldiers struck at people in the streets and the town rose. The garrison was besieged in its kasbah until December, while the Maghsharen Tuareg under their chief Awsanba sided with the Moroccans and plundered the town. Mahmud sent the caïd Mami ibn Barrun with 324 musketeers; he reached Timbuktu at the end of December, calmed the town and made peace with its people. Djenné, too, accepted Moroccan rule without a fight."
    facts:
      - [Battle near Bamba (Zenzen), "14 October 1591, Moroccan victory"]
      - [Timbuktu rising, "10 October – late December 1591"]
      - [Death of Askia Ishaq II, "probably March–April 1592"]
    markers:
