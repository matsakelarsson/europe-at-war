    polities: [mali-empire]
    ink: green
    moves: Malian moves
    success: Malian success
notes:
  - "The main sources are the Timbuktu chronicles of the seventeenth century, above all the Tarikh al-Sudan of al-Sa’di, whose family lived through the occupation, and the Tarikh al-Fattash, with the Moroccan court histories of al-Fishtali and al-Ifrani and reports by Europeans in Marrakesh. Dates are their Hijri dates as converted by modern historians; some differ by a day or more (Tondibi is dated 12 or 13 March 1591, Judar’s departure 16 or 30 October 1590), and the old French translation of the Tarikh al-Sudan gives some conversions a month too late. Numbers are very uncertain: the Moroccan army is usually put at 3,000–4,000 fighting men plus followers, the Songhai army at Tondibi at anything from about 27,000 to over 40,000."
  - "Most of Judar’s musketeers were converts of European origin, many of them former Christian captives, and Muslim exiles from Spain; contemporary Europeans and later writers called them renegades. Their descendants with local wives, the Arma, became a ruling caste in the towns of the Niger bend."
