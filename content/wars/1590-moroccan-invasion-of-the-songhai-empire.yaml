        text: The scholars were arrested in the Sankore mosque; fourteen were killed on the way to the kasbah.
        lonlat: [-3.008, 16.773]
      - kind: event
        side: mor
        name: Marrakesh
        date: 1594–1596
        text: The deported scholars, among them Ahmad Baba and the qadi Umar, were held here until 1596.
        lonlat: [-7.990, 31.630]
    arrows:
