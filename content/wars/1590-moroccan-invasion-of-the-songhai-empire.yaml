  - title: Al-Hajar
    date: 1594–1596
    when: "1595"
    borders: "1595-06"
    countries: [ml, ng]
    body:
      - "Askia Nuh left Dendi for al-Hajar, the hill country of Hombori and the Bandiagara escarpment, whose peoples had long resisted outside rulers. Mahmud followed and took Hombori and Danka. Al-Mansur, told that Mahmud had squandered the revenues of the conquest, sent the caïd Mansur ibn Abd al-Rahman to arrest and execute him. Warned by the sultan’s son Abu Faris, Mahmud set out by night to storm the rocks of Almina-Walo with forty Moroccan soldiers and ten men of Timbuktu, and at dawn he was killed by arrows, early in 1595 by most accounts. The hill people sent his head to Nuh, who sent it on to the king of Kebbi; it was set on a pole in the market of Leka."
      - "Mansur reached Timbuktu on 12 March 1595 and in June marched into al-Hajar with 3,000 men to avenge Mahmud. He routed Nuh more completely than Mahmud ever had and carried off the whole population that had followed the askiya, men and women, young and old, whom he put under Askia Sulayman. Nuh withdrew to Dendi. Al-Mansur divided authority in the Sudan between Judar, who ran the administration, and Mansur, who commanded the troops. Mansur died at Timbuktu on 9 November 1596 as he prepared a new campaign in Dendi; it was rumoured that Judar had poisoned him."
    facts:
      - [Mahmud ibn Zarqun killed, "early 1595 (late 1594 in some accounts)"]
      - [Mansur ibn Abd al-Rahman routs Nuh, "mid-1595"]
      - [Death of Mansur, "9 November 1596"]
