  - title: The scholars of Timbuktu
    date: October 1593 – mid-1594
    when: "1593-10-20"
    borders: "1593-10-20"
    countries: [ml, ma]
    body:
      - "Back in Timbuktu, Mahmud set out to break the town’s scholars, whom the Moroccans held responsible for its resistance. In October 1593 he called the people to the Sankore mosque to swear allegiance to al-Mansur, group by group; on 20 October, when only the scholars were left, the doors were shut and they, their friends and their followers were arrested. One group was marched to the kasbah outside the town; when one of the prisoners seized a soldier’s sword, the soldiers killed fourteen of them on the spot. The scholars’ houses were plundered; Ahmad Baba, the most famous of them, later wrote that he had lost 1,600 books, and that his was the smallest library in his family."
      - "After about five months in prison the scholars and their families, chained, were sent across the desert to Marrakesh. The caravan left Timbuktu on 18 March 1594 and reached Marrakesh in the late spring of 1594. They were held there until May 1596; Ahmad Baba taught in Marrakesh and returned to Timbuktu only in 1608, after al-Mansur’s death. Mahmud moved the town’s market next to the gate of the kasbah."
    facts:
      - [Scholars arrested, "20 October 1593"]
      - [Deportation caravan leaves Timbuktu, "18 March 1594"]
      - [Scholars freed in Marrakesh, "May 1596"]
    markers:
      - kind: event
        side: mor
        name: Timbuktu
