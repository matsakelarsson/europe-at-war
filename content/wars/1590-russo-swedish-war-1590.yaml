summary: A war in which Boris Godunov’s Russia won back Ingria and Kexholm from Sweden but failed to take Narva; the Treaty of Teusina in 1595 left Estonia and Narva Swedish and replaced the Treaty of Nöteborg of 1323 as the basis of the border.
