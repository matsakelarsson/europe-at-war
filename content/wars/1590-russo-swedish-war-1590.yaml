    body:
      - When the truce ran out in 1590, Boris Godunov’s Russia attacked to win back the coast. In January 1590 a Russian army crossed the Narva river and besieged Narva, which held, but Jama fell within two weeks, and the local Swedish commander signed an armistice handing back Jama, Koporye and Ivangorod.
      - King John III would not accept it, and fighting dragged on until talks began in 1593. The Treaty of Teusina on 18 May 1595 returned Ingria and Kexholm to Russia, but Russia gave up all claims to Estonia and Narva. It replaced the Treaty of Nöteborg of 1323 as the basis of the border.
