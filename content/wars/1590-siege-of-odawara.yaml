id: siege-of-odawara
name: Odawara Campaign
start: "1590-04"
end: "1590-08-04"
tier: B
summary: "Toyotomi Hideyoshi’s campaign against the Later Hōjō, the last great independent house of eastern Japan. From their castle at Odawara the Hōjō had ruled most of the Kantō for almost a century, and Hōjō Ujimasa, the retired head who still led the house, put off Hideyoshi’s demands that he come to Kyoto and submit. When a Hōjō commander seized the Sanada castle of Nagurumi at the end of 1589, Hideyoshi declared war. In the spring of 1590 he led an army put at over 200,000 men, with Tokugawa Ieyasu, along the Tōkaidō, while a second army under Maeda Toshiie and Uesugi Kagekatsu came over the mountains from the north and a fleet sailed round the Izu peninsula. Yamanaka castle on the Hakone pass fell in a day, and from May Odawara was surrounded. The Hōjō castles in the Kantō fell one by one, and on 4 August 1590 Hōjō Ujinao surrendered Odawara. Ujimasa and his brother Ujiteru were made to take their own lives, Ujinao was sent into exile on Mount Kōya, and the Hōjō lands were given to Ieyasu, who made Edo his capital. With Date Masamune and the northern lords submitting, all Japan now acknowledged Hideyoshi."
countries: [jp]
