notes:
  - Japanese dates are in the lunar calendar (Tenshō 18); Western dates are given where English sources give them, otherwise the month. Odawara surrendered on the 5th day of the seventh month (4 August 1590).
  - The figures for the armies are estimates. English Wikipedia gives about 220,000 on Hideyoshi’s side (170,000 on the Tōkaidō, 35,000 in the northern army and a navy of 10,000–20,000) and 82,000 for the Hōjō, of whom about 50,000 held Odawara.
  - “Odawara hyōjō” (the Odawara council), from the long debates in the castle over whether to fight on or surrender, became a Japanese phrase for a meeting that talks without deciding.
