  - title: The surrender of Odawara
    date: June – August 1590
    when: "1590-08-04"
    borders: "1590-08-04"
    countries: [jp]
    body:
      - Hideyoshi did not storm Odawara. His army camped around it for three months, with merchants, entertainers and the wives of the lords brought to the camp, and he held tea gatherings with the tea master Sen no Rikyū. On the hill of Ishigakiyama, overlooking the castle, he built a stone-walled castle hidden behind the trees, which were cut down when it was finished at the end of July so that it seemed to have appeared overnight. Meanwhile the northern army took Hachigata in July and stormed Hachiōji in a single day; the heads of many of its defenders, and their captured wives and children, were displayed before Odawara to break the garrison’s spirit; Ishida Mitsunari tried to flood out the castle of Oshi, which held out until after Odawara had fallen. Date Masamune, on whom the Hōjō had pinned their hopes, came to Hideyoshi’s camp in July and submitted.
      - Inside the castle the Hōjō leaders argued for weeks. On 4 August 1590 Ujinao came out and offered his own life to save the garrison. Hideyoshi instead ordered Ujimasa and his brother Ujiteru to take their own lives, which they did on 10 August; Ujinao, who was Ieyasu’s son-in-law, was spared and sent to Mount Kōya with a few retainers, and died the next year. Hideyoshi gave the Hōjō provinces to Ieyasu in exchange for his old lands of Mikawa, Tōtōmi, Suruga, Kai and Shinano, and Ieyasu made the small castle town of Edo, the later Tokyo, his seat. Hideyoshi went on north to Utsunomiya and Aizu and settled the lands of Mutsu and Dewa, and the risings that followed, ending with the Kunohe rebellion in 1591, were the last resistance to his rule.
    facts:
      - [Fall of Hachiōji, "July 1590"]
      - [Odawara surrenders, "4 August 1590"]
      - [Ujimasa and Ujiteru die, "10 August 1590"]
      - [Ieyasu moves to Edo, "August 1590"]
