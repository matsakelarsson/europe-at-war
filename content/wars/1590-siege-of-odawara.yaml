steps:
  - title: The road over Hakone
    date: April – May 1590
    when: "1590-05"
    borders: "1590-05-07"
    countries: [jp]
    body:
      - The Hōjō, descended from Ise Sōzui (Hōjō Sōun), who took Odawara in the 1490s, had built up the largest domain in eastern Japan, from Izu to the borders of Shimotsuke and Hitachi. Hideyoshi, who had banned private wars between lords, demanded that Ujimasa or his son Ujinao come to Kyoto. They sent Ujimasa’s brother Ujinori in 1588 and quarrelled with Hideyoshi’s vassals the Sanada over the district of Numata; in late 1589 Inomata Kuninori, the Hōjō commander at Numata, took the Sanada castle of Nagurumi. Hideyoshi announced war at the end of the year and called up troops from across Japan, while the Hōjō strengthened Odawara with a ring of earthworks around the whole town and garrisoned the castles guarding the Hakone pass.
      - Hideyoshi left Kyoto in April 1590 and met Ieyasu at Sunpu. On the same day in early May his armies attacked Yamanaka castle on the Hakone pass, which fell within the day with the loss of most of its garrison, and laid siege to Nirayama in Izu, where Hōjō Ujinori held out until July. The vanguard reached Odawara a few days later, and Hideyoshi’s army surrounded the castle by land while his fleet, led by Kuki Yoshitaka, Katō Yoshiaki and Chōsokabe Motochika, took the Hōjō ports on the Izu coast and closed the sea. In the north Maeda Toshiie and Uesugi Kagekatsu, with the Sanada, crossed the Usui pass into Kōzuke and took Matsuida castle.
    facts:
      - [Hideyoshi declares war, "end of 1589"]
      - [Fall of Yamanaka, "early May 1590"]
      - [Odawara surrounded, "from May 1590"]
      - [Strength, "about 220,000 against about 82,000"]
