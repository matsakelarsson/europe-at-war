notes:
  - Dates are Gregorian; Spain adopted the Gregorian calendar in 1582.
  - The Kingdom of Aragon kept its own laws, the fueros, under the Spanish crown. Its Justicia was a judge whose court could take prisoners under its protection, a right called manifestación. Pérez later lived in France and England, where his writings helped spread the ‘black legend’ about Philip II, and died in Paris in 1611.
