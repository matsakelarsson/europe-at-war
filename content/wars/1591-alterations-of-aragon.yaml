id: alterations-of-aragon
name: Alterations of Aragon
start: "1591-05-24"
end: "1591-12-20"
tier: C
summary: The rising in Zaragoza in 1591 over Antonio Pérez, Philip II’s fallen secretary, who had escaped from prison in Castile in April 1590 and claimed the protection of Aragon’s laws. When the king turned to the Inquisition, which those laws could not block, crowds in Zaragoza freed Pérez from its custody on 24 May and again on 24 September 1591; the king’s representative, the Marquis of Almenara, was mortally wounded in the first riot, and more than thirty people died in the second. The Justicia of Aragon, Juan de Lanuza, declared the coming of a Castilian army a breach of the kingdom’s liberties and called out its men, but only about 2,000 answered. A royal army of some 14,000 under Alonso de Vargas entered Zaragoza unopposed on 12 November, Pérez fled to France, and on 20 December Lanuza was beheaded in the market square without trial. Other leaders were executed or died in prison. In 1592 the Cortes of Tarazona kept Aragon’s laws and institutions but gave the crown more power over them.
