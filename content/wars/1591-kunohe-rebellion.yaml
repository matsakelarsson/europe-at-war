id: kunohe-rebellion
name: Kunohe Rebellion
start: "1591"
end: "1591"
tier: C
summary: "The rising of Kunohe Masazane against the Nanbu lord and Toyotomi Hideyoshi in the far north of Honshu, the last campaign of the unification of Japan. When Nanbu Harumasa died in 1582 the great northern house of the Nanbu split over the succession; Masazane, head of the powerful Kunohe branch, backed his brother against Nanbu Nobunao, who won. In 1590, after the fall of Odawara, Hideyoshi confirmed Nobunao as lord of the Nanbu lands and ordered the other branches to obey him, while his settlement of the north (the Ōshu shioki) took land from many local lords and set off risings across Mutsu and Dewa. Masazane refused to attend Nobunao’s New Year ceremony in 1591, and in the third month rose with about 5,000 men and attacked castles loyal to Nobunao. Unable to defeat him, Nobunao appealed to Hideyoshi, who sent a second northern expedition under his nephew Toyotomi Hidetsugu and Tokugawa Ieyasu, with Gamō Ujisato, Asano Nagamasa and other lords, an army put at about 60,000 that also put down risings in the Waga and Hienuki districts. Gamō and Asano besieged Kunohe castle at the beginning of the ninth month. After four days Masazane surrendered on a promise, carried by an envoy of Asano, that the defenders would be spared, but the men left in the castle were killed in its second bailey and the castle burned, and Masazane and the other leaders were executed at Sanhasama, in today’s Kurihara (Miyagi). Nobunao took over the castle, renamed it Fukuoka, and later moved his seat south to Morioka. With the end of the rebellion no lord in Japan was left in arms against Hideyoshi, who began his invasion of Korea the next spring."
