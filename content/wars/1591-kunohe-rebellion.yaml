notes:
  - Japanese dates are in the lunar calendar (Tenshō 19). English Wikipedia gives the lunar dates as if they were Western ones (13 March to 4 September 1591); the siege fell in the ninth month, in the autumn of 1591.
  - Accounts of the killing of the garrison come largely from later chronicles; excavations at the castle have found remains of people killed at about that time.
