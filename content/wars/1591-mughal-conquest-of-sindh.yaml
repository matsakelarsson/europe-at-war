id: mughal-conquest-of-sindh
name: Mughal conquest of Sindh
start: "1591"
end: "1593"
tier: C
summary: "Akbar’s conquest of lower Sindh, the kingdom of Thatta in the Indus delta, ruled by Mirza Jani Beg of the Tarkhan dynasty. Upper Sindh, with the island fortress of Bhakkar, had been Mughal since 1574. In 1591 Akbar, then at Lahore, sent his leading noble, Abdul Rahim Khan-i-Khanan, down the Indus with an army and river boats, partly to secure the route to Kandahar. Jani Beg raised tribal levies and a war fleet, partly built and manned with the help of Portuguese mercenaries from the coast, and fought the Mughals several times on the borders of Sehwan and on the river. He held out for about two years, but after defeats, a siege of his fortified camp and growing hunger he came to terms; Thatta was handed over in late 1592, and in 1593 Jani Beg went to Akbar’s court at Lahore. Akbar made him a commander of 5,000 and left him Thatta and Sehwan to govern as a Mughal officer, and his family governed it until 1612. Sindh became part of the Mughal province of Multan, and later a province of its own, Thatta."
