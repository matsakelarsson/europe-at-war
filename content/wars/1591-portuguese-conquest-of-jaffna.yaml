id: portuguese-conquest-of-jaffna
name: Portuguese conquest of the Jaffna Kingdom
start: "1591"
end: "1619"
tier: C
summary: "The Portuguese conquest of the Tamil kingdom of Jaffna in the north of Sri Lanka. A first expedition under the viceroy Constantino de Bragança in 1560 took the capital, Nallur, but could not hold it and withdrew, keeping only the island of Mannar. In 1591 an expedition from Goa under André Furtado de Mendonça defeated and killed King Puviraja Pandaram and put his son Ethirimana Cinkam on the throne as a vassal paying tribute. After his death in 1617, his nephew Cankili II seized power by killing the regent and other princes, refused to pay tribute, and relied on troops sent by Raghunatha Nayak of Thanjavur. In 1619 two Portuguese expeditions were sent against him; a naval force was beaten off, but a land army of about 5,000 under Phillippe de Oliveira defeated him and annexed the kingdom. Cankili was taken to Goa, tried for treason and executed, in 1621 according to the chronicler Queiroz. Risings in the 1620s, some backed by the Thanjavur Nayak, were put down, and the Portuguese ruled Jaffna until the Dutch took it in 1658."
