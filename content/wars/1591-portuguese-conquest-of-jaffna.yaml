notes:
  - The expedition of 1560 is part of the background; this entry starts with the decisive Portuguese intervention of 1591. The main sources are Portuguese chroniclers such as Fernão de Queiroz and the Tamil chronicle Yalpana Vaipava Malai, which differ on names and dates.
