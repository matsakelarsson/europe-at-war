  - title: Yi Sun-sin at sea, from Okpo to Hansan
    date: June – October 1592
    when: "1592-06"
    borders: "1592-08-14"
    countries: [kr]
    body:
      - When the Japanese landed, the Gyeongsang fleets nearest to Busan were scuttled or scattered without a fight. The fleet of Jeolla Left Province, based at Yeosu under Yi Sun-sin, was intact. Its panokseon, heavy oared warships carrying cannon, were built to fight at a distance, and Yi had a few turtle ships, panokseon with a covered, spiked deck that could not be boarded. With Won Gyun’s few remaining ships and Yi Eok-gi’s fleet from Jeolla Right Province, he made four cruises along the Gyeongsang coast in 1592.
      - On 16 June at Okpo, on Geoje Island, Yi caught Tōdō Takatora’s transports at anchor while their crews were plundering ashore and burned 26 of them. On 8 July at Sacheon a turtle ship went into action for the first time, and Yi was wounded in the shoulder by a musket ball. Hideyoshi ordered his admirals to destroy the Korean fleet, but on 14 August, off Hansan Island, Yi lured Wakisaka Yasuharu’s fleet out of the narrow Gyeonnaeryang strait into open water and enveloped it; 47 Japanese ships were sunk and 12 taken, and no Korean ship was lost. Two days later he destroyed most of the ships of Kuki Yoshitaka and Katō Yoshiaki at Angolpo.
      - Hideyoshi ordered his commanders to stop seeking battle at sea. On 5 October Yi attacked the Japanese base at Busan itself and destroyed about a hundred ships, though he could not take the town. The Japanese could no longer send troops and supplies by sea along the west coast to their armies in the north, and Jeolla, the granary of Korea, stayed out of their reach. In 1593 Yi was made naval commander of the three southern provinces, with his headquarters on Hansan Island.
    facts:
      - [Battle of Okpo, "16 June 1592, 26 Japanese ships burned"]
      - [Battle of Hansan Island, "14 August 1592, 59 Japanese ships sunk or taken"]
      - [Korean ships lost at Hansan, none]
