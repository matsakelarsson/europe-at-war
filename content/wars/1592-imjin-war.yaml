  - title: Three years of talks, and the second invasion
    date: 1593–1597
    when: "1594"
    borders: "1597-03-01"
    countries: [kr, jp, cn]
    body:
      - For three years there was little fighting. Konishi Yukinaga and Shen Weijing, each anxious for peace, carried terms between Hideyoshi and Beijing that neither ruler would have accepted. Hideyoshi asked for a Ming princess as consort for the Japanese emperor, the southern provinces of Korea, the reopening of trade and Korean hostages, while the Ming court was led to believe that he wished only to be invested as a vassal king. Korea was kept out of the talks. Most of the Ming army went home, leaving about 16,000 men, and many Japanese troops returned to Japan while garrisons held the coastal forts.
      - In the autumn of 1596 a Ming embassy reached Hideyoshi at Osaka with a patent naming him King of Japan, and nothing more. Hideyoshi dismissed the envoys and ordered a second invasion, aimed this time at the southern provinces. Joseon had used the respite to rebuild its army, setting up the Military Training Agency to train musketeers, archers and spearmen on the Ming model; the Ming executed Shen Weijing and sent new armies.
      - Early in 1597 a Japanese agent fed the Korean court a report that Katō Kiyomasa would cross from Japan on a given day. Yi Sun-sin, suspecting a trap, would not take his fleet out to intercept him; he was arrested, brought to Hanseong in chains and reduced to the ranks, and Won Gyun took over the fleet. From the spring of 1597 Japanese armies, about 140,000 men in all, crossed again to Busan and the coastal forts.
    facts:
      - [Ming troops left in Korea, "about 16,000"]
      - [Ming embassy at Osaka, "autumn 1596"]
      - [Second invasion force, "about 140,000 men"]
