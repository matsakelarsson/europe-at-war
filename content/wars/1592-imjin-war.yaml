  - title: North to Pyongyang and the Tumen
    date: June – September 1592
    when: "1592-07"
    borders: "1592-08-29"
    countries: [kr, kp]
    body:
      - From Hanseong the Japanese commanders divided the provinces between their divisions. Konishi and Katō pushed north to the Imjin River, where Kim Myeong-won held the crossings for about two weeks. In late June the Japanese pulled back from the bank as if retreating; part of the Korean army crossed to attack, was routed, and lost its boats, and the road to Kaesong lay open. King Seonjo moved on to Pyongyang and from there to Uiju on the Yalu, the border with Ming China, and asked the Wanli Emperor for help.
      - Konishi’s and Kuroda’s divisions reached the Taedong River opposite Pyongyang, held by about 10,000 men. A Korean night attack across the river failed and showed the Japanese where the fords were, and the defenders left the city, which the Japanese entered in late July with its stores of grain. A first Ming force of about 5,000 cavalry under Zu Chengxun rode into Pyongyang in a rainstorm on 23 August and was driven out with heavy losses. Konishi, with no reinforcements coming by sea, stayed in Pyongyang through the winter.
      - Katō Kiyomasa marched across the peninsula to Anbyeon and up the east coast into Hamgyong. He took Hamhung, defeated the provincial army at Songjin, and in late August at Hoeryong on the Tumen received two Korean princes, Imhae and Sunhwa, whom local people had seized and handed over. He crossed the Tumen to attack a Jurchen stronghold and was driven back. Mōri Yoshinari’s Fourth Division took the towns of Gangwon. By the end of the summer Japanese garrisons held the towns and roads of most of the country; only Jeolla in the south-west and the north-west beyond Pyongyang had not been overrun.
    facts:
      - [Battle of the Imjin River, "late June 1592, Japanese victory"]
      - [Pyongyang taken, "late July 1592"]
      - [Princes captured, "Hoeryong, late August 1592"]
