  - title: Chilcheollyang, Namwon and Jiksan
    date: August – October 1597
    when: "1597-08"
    borders: "1597-10-16"
    countries: [kr]
    body:
      - Won Gyun, ordered to attack, took the whole Korean fleet, more than a hundred warships, towards Busan. With his crews exhausted he anchored in the Chilcheollyang strait between Geoje and Chilcheon islands, where a Japanese fleet under Tōdō Takatora, Katō Yoshiaki and Wakisaka Yasuharu attacked at dawn on 28 August 1597. The Korean fleet was destroyed and Won Gyun was killed ashore; only the dozen ships that Bae Seol had kept out of the fight escaped westward. It was Japan’s only decisive victory at sea in the war.
      - With the sea open, two Japanese armies invaded Jeolla and Chungcheong. The Army of the Left under Ukita Hideie besieged Namwon, held by 3,000 Ming troops under Yang Yuan with Korean soldiers and townspeople, and took it on 26 September; Japanese records count the noses of 3,726 dead taken there. The Army of the Right under Mōri Hidemoto and Katō Kiyomasa stormed the mountain fortress of Hwangseoksan. The two armies met at Jeonju, abandoned by its defenders, and turned north towards Hanseong.
      - The Ming had sent new armies under Yang Hao and Ma Gui. In mid-October a Ming force met Kuroda Nagamasa’s vanguard at Jiksan, near today’s Cheonan and about 80 km south of Hanseong, and held it in a day’s fighting. It was the farthest north the Japanese came in the second invasion. With winter coming, and their fleet checked at Myeongnyang, the Japanese armies turned back towards the coast, burning and killing as they went.
    facts:
      - [Battle of Chilcheollyang, "28 August 1597, Japanese victory"]
      - [Siege of Namwon, "23–26 September 1597"]
      - [Battle of Jiksan, "October 1597, Ming victory"]
