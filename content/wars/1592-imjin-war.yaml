  - title: The righteous armies and the siege of Jinju
    date: June – November 1592
    when: "1592-07"
    borders: "1592-11-13"
    countries: [kr]
    body:
      - As the government armies collapsed, local gentry, former soldiers and monks raised volunteer militias, which Koreans call uibyeong, righteous armies. In Uiryeong, by the Nam River, the landowner Gwak Jae-u gathered a few dozen men within days of the landing; his guerrillas, known for their leader’s red coat, ambushed Japanese parties along the Nakdong and Nam rivers and helped keep the Sixth Division out of Jeolla. Go Gyeong-myeong raised about 6,000 men in Jeolla and was killed attacking the Japanese at Geumsan in July. By the summer the militias numbered some 22,000 men and tied down Japanese troops across the south.
      - At the king’s request the old monk Hyujeong called on Buddhist monks to fight, and thousands answered. The monk Yeonggyu and Jo Heon’s militia retook Cheongju on 6 September. On 22 September Jo Heon attacked Kobayakawa Takakage’s far larger force at Geumsan with 700 men; they were surrounded and all killed, and Yeonggyu’s monks met the same fate there soon after. In the far north-east, militias rose against Katō Kiyomasa’s garrisons in Hamgyong and besieged them through the winter.
      - In November about 30,000 Japanese under Hosokawa Tadaoki and others attacked Jinju, the fortress that guarded the road west into Jeolla. Kim Si-min held it with about 3,800 soldiers and 170 newly made muskets, while Gwak Jae-u’s militia lit fires on the surrounding hills to make the relief force look larger than it was. After six days of assaults, from 8 to 13 November, the Japanese withdrew with heavy losses. Kim Si-min was killed in the last assault.
    facts:
      - [Militia strength, "about 22,000 men by summer 1592"]
      - [Second battle of Geumsan, "22 September 1592, Jo Heon’s 700 killed"]
      - [First siege of Jinju, "8–13 November 1592, Korean victory"]
