  - title: Ulsan, Sacheon and Suncheon
    date: January – November 1598
    when: "1598-01"
    borders: "1598-10-30"
    countries: [kr, jp]
    body:
      - The Japanese dug in along the south coast in a line of stone castles, wajō, from Ulsan in the east to Suncheon in the west. On 29 January 1598 Yang Hao and Ma Gui, with about 40,000 Ming and 10,000 Korean troops under Gwon Yul, attacked Katō Kiyomasa’s unfinished castle at Ulsan. The garrison, short of water and food in the winter cold, was close to surrender when relief armies under Mōri Hidemoto arrived, and on 19 February the allies withdrew in disorder with heavy losses.
      - Reinforced to about 75,000 men, with a fleet under Chen Lin that joined Yi Sun-sin in the summer, the Ming attacked again in the autumn in three columns, Ma Gui against Ulsan, Dong Yiyuan against Shimazu Yoshihiro at Sacheon, and Liu Ting with Chen Lin and Yi Sun-sin against Konishi Yukinaga at Suncheon. All three failed. At Sacheon on 30 October an explosion in the allied camp turned the assault into a rout; Japanese accounts claim 30,000 or more heads, while Korean records speak of 7,000 to 8,000 Chinese dead. At Suncheon the land and sea attacks of October and November were beaten off.
      - Toyotomi Hideyoshi had died at Fushimi on 18 September 1598, leaving a five-year-old heir, Hideyori. The council of regents he had appointed kept his death secret and ordered the armies home.
    facts:
      - [First siege of Ulsan, "29 January – 19 February 1598"]
      - [Battle of Sacheon, "30 October 1598, Japanese victory"]
      - [Death of Hideyoshi, "18 September 1598"]
