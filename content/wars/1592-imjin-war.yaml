  - title: Haengju, Jinju and the withdrawal to the coast
    date: March – July 1593
    when: "1593-03"
    borders: "1593-07-27"
    countries: [kr]
    body:
      - Gwon Yul, governor of Jeolla, had beaten back the Sixth Division at Ichi in 1592 and moved north to join the Ming. With about 2,300 soldiers, monks and militiamen he fortified Haengju, a hilltop above the Han River west of Hanseong. On 14 March 1593 some 30,000 Japanese attacked it in nine assaults over a single day. The defenders fired hwacha, carts that launched volleys of rocket arrows, and the women of the district are said to have carried stones up to the walls in their skirts. The Japanese withdrew with heavy losses.
      - The Japanese armies, weakened by cold and disease and short of food after a Ming raid burned their granaries at Yongsan, were down from about 150,000 men to about 53,000. Konishi opened talks with the Ming envoy Shen Weijing, and in May 1593 the Japanese left Hanseong and marched back to the south coast. Katō Kiyomasa had already withdrawn his division from Hamgyong.
      - Hideyoshi ordered revenge for the failure at Jinju. In July about 90,000 men, the largest Japanese force of the war, besieged the fortress, held by Kim Cheon-il and Hwang Jin with a few thousand soldiers and a great many townspeople and refugees. On 27 July, after a week of assaults, the wall was breached in a rainstorm and almost everyone in the town was killed. Korean accounts give about 60,000 dead; Japanese accounts claim 20,000 heads. The Japanese then fell back to a chain of forts, wajō, along the coast between Ulsan and Geoje Island.
    facts:
      - [Battle of Haengju, "14 March 1593, Korean victory"]
      - [Japanese leave Hanseong, "May 1593"]
      - [Second siege of Jinju, "20–27 July 1593"]
      - [Dead at Jinju, "20,000 (Japanese claims) to 60,000 (Korean accounts)"]
