  - title: Noryang and the end of the war
    date: December 1598
    when: "1598-12"
    borders: "1598-12-16"
    countries: [kr]
    body:
      - Konishi Yukinaga, blockaded at Suncheon by the allied fleet, tried to buy his way out, while Shimazu Yoshihiro gathered ships at Sacheon and along the coast to break the blockade, some 300 to 500 according to different accounts. Yi Sun-sin and Chen Lin sailed to meet them, and before dawn on 16 December 1598 attacked them in the Noryang strait between Namhae Island and the mainland.
      - The battle lasted until late morning. About half of the Japanese ships were sunk, burned or taken, and Shimazu escaped with the rest. Yi Sun-sin was hit by a musket shot while pursuing them; he told those around him to hide his death until the battle was won. The Ming admiral Deng Zilong was also killed.
      - While the fleets fought, Konishi slipped out of Suncheon around the south of Namhae. The Japanese armies gathered at Busan, and the last ships left for Japan around 24 December. Korea had lost much of its population, farmland and records, and its palaces in Hanseong were in ruins. An estimated 50,000 to 60,000 Koreans had been carried off to Japan, where some were sold on as slaves and others, potters among them, founded new crafts such as the porcelain of Arita. After the Sō of Tsushima arranged the return of some captives, relations with Japan, now ruled by Tokugawa Ieyasu, were restored in the following decade. Ming China, whose treasury the war had drained, fell to rebels and the Manchus within half a century.
    facts:
      - [Battle of Noryang, "16 December 1598, Korean and Ming victory"]
      - [Yi Sun-sin, "killed in the battle"]
      - [Last Japanese ships leave Busan, "about 24 December 1598"]
      - [Koreans taken to Japan, "an estimated 50,000 to 60,000"]
