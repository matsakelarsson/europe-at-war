id: imjin-war
name: Japanese invasions of Korea (Imjin War)
start: "1592-05-23"
end: "1598-12-16"
tier: A
summary: "Two invasions of Korea ordered by Toyotomi Hideyoshi, who had just unified Japan and meant to go on to conquer Ming China. In May 1592 about 160,000 men landed at Busan, took Hanseong (Seoul) within three weeks and Pyongyang in July, and pushed into the far north-east. At sea Yi Sun-sin’s fleet cut the Japanese supply route along the south coast, volunteer righteous armies rose behind the Japanese lines, and in February 1593 a Ming army retook Pyongyang. The Japanese fell back to forts on the south coast while Ming and Japanese envoys negotiated for three years. When the talks failed, Hideyoshi sent a second army in 1597; it destroyed the Korean fleet at Chilcheollyang and overran Jeolla, but was stopped short of Hanseong at Jiksan and at sea at Myeongnyang. After Hideyoshi’s death in September 1598 the Japanese withdrew, fighting a last sea battle at Noryang, where Yi Sun-sin was killed. Korea was devastated; estimates of the dead, soldiers and civilians, run to about a million."
countries: [kr, kp, jp, cn]
sides:
