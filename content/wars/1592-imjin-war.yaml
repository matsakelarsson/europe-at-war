steps:
  - title: Busan and the march on Hanseong
    date: May – June 1592
    when: "1592-05"
    borders: "1592-06-12"
    countries: [kr, jp]
    body:
      - Toyotomi Hideyoshi, who had brought all of Japan under his rule by 1590, declared that he would go on to conquer Ming China and demanded that Joseon Korea let his armies pass or join them. The Korean court, given opposite reports by the two envoys it had sent to Japan, refused and made few preparations. From his new castle at Nagoya in Hizen, on the north coast of Kyushu, about 160,000 men in nine divisions crossed to Korea by way of the islands of Iki and Tsushima, whose lords, the Sō, had long handled Japan’s trade with Korea and had tried to delay the war.
      - Konishi Yukinaga’s First Division sailed from Tsushima on 23 May 1592 and landed outside Busan that evening. The fort of Busanjin fell the next day and its commander Jeong Bal was killed; on 25 May the walled town of Dongnae fell after twelve hours of fighting. Its magistrate Song Sang-hyeon had refused to let the Japanese pass, and Konishi ordered that no prisoners be taken; about 3,000 defenders and townspeople were killed. Katō Kiyomasa’s Second Division landed at Busan on 27 May and Kuroda Nagamasa’s Third Division near Gimhae the next day.
      - The divisions raced north by separate roads. Konishi routed Yi Il’s small army at Sangju on 4 June, crossed the Joryeong pass and on 7 June destroyed Sin Rip’s cavalry army, drawn up with its back to the rivers at Tangeumdae outside Chungju; Sin Rip drowned himself as his army broke. King Seonjo left Hanseong on the night of 9 June and fled north. The Japanese entered the abandoned capital a few days later, about twenty days after the landing, and found that parts of it, among them the offices that kept the slave registers, had already been looted and burned.
    facts:
      - [Japanese invasion force, "about 160,000 men in nine divisions"]
      - [Landing at Busan, "23 May 1592"]
      - [Battle of Chungju, "7 June 1592, Japanese victory"]
      - [Hanseong taken, "June 1592"]
