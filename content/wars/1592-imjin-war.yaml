  - title: Ming intervention, Pyongyang and Byeokjegwan
    date: January – February 1593
    when: "1593-01"
    borders: "1593-02-08"
    countries: [kp, kr, cn]
    body:
      - The Ming court, busy putting down the Ningxia rising in the north-west, sent its main army only when that campaign was over. Li Rusong, who had just taken Ningxia, crossed the Yalu in January 1593 with about 40,000 men from the northern garrisons, among them southern troops trained against the wokou (Japanese, Korean and Chinese raiders of the coasts) in the manner of Qi Jiguang, and a strong train of artillery. At Uiju the Korean court received him, and Korean troops, militias and Hyujeong’s monks joined the advance.
      - The allied army reached Pyongyang on 5 February. Hyujeong’s monks stormed the Japanese position on Moranbong, north of the city, and on 8 February Li’s cannon, fire arrows and scaling parties carried the walls. Konishi’s men held out in an earthwork citadel in the east of the city and slipped away that night, losing many more men in ambushes on the road south. Accounts of the Japanese losses range from under 2,000 killed in the fighting to about 12,000 dead including those who burned or drowned; the Ming lost about 800 killed.
      - Li Rusong followed, retook Kaesong and pushed on towards Hanseong with a vanguard of mostly cavalry. On 27 February, at Byeokjegwan, a post station on the road north of the capital, it ran into the main Japanese army under Kobayakawa Takakage and Tachibana Muneshige. After a hard fight in the hills the Ming fell back to Kaesong and then Pyongyang, with losses that range from a few hundred in Li’s report to 6,000 or more in Japanese claims. Li did not attack again, and the war on land settled into a stalemate north of Hanseong.
    facts:
      - [Ming army, "about 40,000 men under Li Rusong"]
      - [Pyongyang retaken, "8 February 1593"]
      - [Battle of Byeokjegwan, "27 February 1593, Japanese victory"]
