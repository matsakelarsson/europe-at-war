notes:
  - Korean, Chinese and Japanese records date events by the lunar calendar. The dates here are the Gregorian equivalents given in the English sources cited (the landing at Busan, on the 13th day of the 4th month, was 23 May 1592); where the sources disagree by days, or give only a month, the text gives a month.
  - "Names: Hanseong is today’s Seoul. Korean names are in Revised Romanization (Gwak Jae-u, Won Gyun, Gwon Yul); many English books use McCune–Reischauer (Kwak Chaeu, Wŏn Kyun, Kwŏn Yul). Japanese names are family name first. Koreans call the war the Imjin War (Imjin waeran), after the year 1592 in the sixty-year cycle, and its second phase the Jeongyu War; in Japan it is the Bunroku and Keichō campaigns, and in China the war to resist Japan and aid Korea."
  - Army sizes and losses differ widely between Korean, Chinese and Japanese records, which often counted heads and noses for rewards. The numbers below are those of the sources cited and are best read as orders of magnitude.
  - The base map shows Joseon throughout; the areas entered or held by Japanese armies are drawn in the steps. The war in Korea was one of the Wanli Emperor’s Three Great Campaigns, with the Ningxia campaign (1592) and the Bozhou rebellion.
