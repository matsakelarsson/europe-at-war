  - title: Myeongnyang and the mound of noses
    date: September – October 1597
    when: "1597-10"
    borders: "1597-10-26"
    countries: [kr, jp]
    body:
      - After the disaster at Chilcheollyang the king restored Yi Sun-sin to command. He gathered the surviving warships and a few hundred men on the south-west coast, and when the court suggested that he give up the fleet and fight on land, he answered in a famous letter that he still had twelve warships; a thirteenth joined him before the battle. The Japanese fleet, moving west along the coast to support the armies in Jeolla, had to pass the Myeongnyang strait between Jindo Island and the mainland, a narrow channel whose tidal current runs at about 10 knots and turns every few hours.
      - On 26 October 1597 Yi anchored his ships across the strait. More than 130 Japanese warships came in on the tide; only some could engage at once, and for hours Yi’s flagship held the front almost alone. When the current turned, the Japanese ships fouled one another. About 30 Japanese warships were destroyed and their commander Kurushima Michifusa was killed; no Korean ship was lost. The victory gave the Korean navy back the initiative and kept the Japanese fleet from supplying the armies along the west coast.
      - In the second invasion Hideyoshi demanded proof of the killing, and Japanese troops cut off the noses of soldiers and civilians, which were salted and shipped to Japan. They were buried in Kyoto in a mound dedicated in September 1597, now called the Mimizuka, the “mound of ears”; it holds the noses of at least 38,000 Koreans and 30,000 Chinese. One count from Japanese records gives 185,738 Korean and 29,014 Chinese heads taken in the war. Many more dead were never counted; one widely cited estimate puts all deaths in Korea, soldiers and civilians, at about a million, and combat casualties at 250,000 to 300,000.
    facts:
      - [Battle of Myeongnyang, "26 October 1597, Korean victory"]
      - [Korean warships, "13"]
      - [Japanese warships, "about 130, with some 200 transports in support"]
      - [Mimizuka, "dedicated 28 September 1597 in Kyoto"]
    markers:
      - kind: naval
