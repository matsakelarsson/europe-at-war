id: ningxia-campaign
name: Ningxia campaign
start: "1592-03"
end: "1592-10-20"
tier: C
summary: "A rising of the Ming garrison at Ningxia, on the Yellow River at the north-western frontier, put down after a siege of six months; it is counted as the first of the Wanli Emperor’s Three Great Campaigns. Its leading figure was Pubei, a Mongol chief from the Chahar who had gone over to the Ming at the end of the Jiajing reign (before 1567) with a few hundred followers and risen to be regional vice commander of Ningxia, with a guard of some 3,000 men. Long disputes over pay and supplies with the grand coordinator Dang Xin ended in late March 1592, when soldiers led by Liu Dongyang killed Dang Xin and took the city, with Pubei as their adviser and his son Bo Cheng’en as a deputy. The rebels, 20,000 to 30,000 strong, took 47 forts around Ningxia and brought in Ordos Mongols under Jorightu. Ming forces under Wei Xuezeng retook the forts but failed in assaults on the city in May and July, even after Li Rusong arrived with reinforcements at the end of July and Ye Mengxiong with artillery and Miao troops. Under Ye Mengxiong the besiegers then built a dike about 5 km long around the city and flooded it from September; an attempt by 18,000 Mongols to relieve it was driven off. On 12 October the water broke through the walls and Ming troops entered, and on 20 October 1592 the city was taken. The rebel leaders had already turned on each other; Pubei killed himself, and Bo Cheng’en surrendered and was executed. Many of the troops were then sent with Li Rusong to fight the Japanese in Korea."
