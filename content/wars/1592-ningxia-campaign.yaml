notes:
  - The dates follow the Wikipedia article, which converts them from the Chinese calendar of the Ming records. The Three Great Campaigns of the Wanli reign were the Ningxia campaign (1592), the war in Korea against Japan (1592–1598) and the Bozhou campaign against Yang Yinglong (1589–1600).
