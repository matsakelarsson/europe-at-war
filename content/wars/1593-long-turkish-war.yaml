id: long-turkish-war
name: Long Turkish War
start: "1593"
end: "1606-11-11"
tier: A
summary: A war of thirteen years between the Habsburg Monarchy and the Ottoman Empire, fought mainly in Hungary, Croatia and the Danubian principalities, and known in Hungary as the Fifteen Years’ War. Transylvania, Wallachia and Moldavia joined the Habsburg side in 1594–1595, and Michael the Brave of Wallachia briefly ruled all three principalities in 1600. Neither empire could break the other’s chain of fortresses, and after the Hungarian rising led by Stephen Bocskai the war ended in the Peace of Zsitvatorok of 1606, which left the border much as it had been.
countries: [hu, hr, sk, at, ro, md, ba, si, bg, pl, it, tr]
