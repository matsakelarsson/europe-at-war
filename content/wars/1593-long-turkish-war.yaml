  - title: Eger and Mezőkeresztes
    date: 1596
    when: "1596-09"
    borders: "1596-10-26"
    countries: [hu, ro, at, tr]
    body:
      - In 1596 Mehmed III became the first sultan in thirty years to lead his army in person. The imperial army under Archduke Maximilian had taken Hatvan in September and killed its garrison and inhabitants, women and children among them. The Ottomans besieged Eger, which had held out against them in 1552, from 21 September, and on 12 October the fortress capitulated. Its defenders, mostly foreign mercenaries, were then killed in revenge for Hatvan.
      - Maximilian and Sigismund Báthory joined forces and met the Ottoman army on the marshy plain of Mezőkeresztes, south of the Bükk hills, on 24–26 October. On the last day the Christian army broke into the Ottoman camp, but its soldiers turned to plunder; the camp servants fought back with whatever came to hand, and cavalry under Cığalazade Sinan Pasha struck the scattered troops and routed them. Both sides lost tens of thousands of men. It was the only great field battle of the war, but Mehmed went home without following it up.
    facts:
      - [Eger capitulates, 12 October 1596]
      - [Battle of Mezőkeresztes, "24–26 October 1596, Ottoman victory"]
      - [Losses, "perhaps 20,000–30,000 on each side"]
    markers:
      - kind: taken
        side: hb
        name: Hatvan
        date: September 1596
        text: The imperial army stormed the town and massacred its Muslim garrison and people.
        lonlat: [19.67, 47.67]
      - kind: taken
        side: ot
        name: Eger
        date: 12 October 1596
        text: The fortress that had defied the Ottomans in 1552 fell to Mehmed III and became the seat of an Ottoman province until 1687.
        lonlat: [20.37, 47.9]
        lp: l
      - kind: battle
        side: ot
        name: Battle of Mezőkeresztes
        date: 24–26 October 1596
        text: A near victory for the imperial and Transylvanian army turned into a rout when its men stopped to plunder the sultan’s camp.
        lonlat: [20.69, 47.83]
        lp: b
