notes:
  - Dates are Gregorian, which the Habsburg lands, Hungary and Transylvania used by then. Wallachia and Moldavia kept the Julian calendar, ten days behind, so Romanian sources often give Michael the Brave’s battles ten days earlier (Călugăreni 13 August, Șelimbăr 18 October).
  - The sides changed during the war. Transylvania fought with the Habsburgs in 1595–1598 but later turned against them; Moldavia was ruled in turn by princes allied to Transylvania, to Poland and to Michael the Brave. Numbers of soldiers and dead come mostly from accounts of the time and are uncertain.
  - The rising led by Stephen Bocskai in 1604–1606 has its own entry. The Hundred Years’ Croatian–Ottoman War, which ended at Sisak, has its own entry too.
