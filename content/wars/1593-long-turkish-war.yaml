steps:
  - title: Sisak and the outbreak of war
    date: 1593–1594
    when: "1593-06-15"
    borders: "1594-09-29"
    countries: [hr, ba, hu, sk, at, si, tr]
    body:
      - Along the Croatian border the fighting had never really stopped. In 1592 Telli Hasan Pasha, the Ottoman governor of Bosnia, took Bihać, and on 15 June 1593 he crossed the Kupa to besiege Sisak, a fortress where the Kupa meets the Sava, with perhaps 12,000–16,000 men. A relief army of 5,000–6,000 Croats, Styrians and Carniolans under Ruprecht von Eggenberg, the ban Tamás Erdődy and Andreas von Auersperg attacked on 22 June while the garrison sallied out. The Ottomans were routed; Hasan Pasha and some 8,000 of his men were killed or drowned in the Kupa.
      - Sultan Murad III answered with open war. In August the Ottomans took Sisak, and in October the grand vizier Koca Sinan Pasha took Veszprém and Várpalota in Transdanubia, while an imperial winter campaign won back Fülek and other castles in Upper Hungary. In 1594 the imperial army besieged Esztergom without success, and Sinan marched up the Danube and took Győr on 29 September. Győr, the strongest fortress on the road to Vienna, was a heavy loss, and Emperor Rudolf II and the Imperial Diet voted large sums for what Germans called the Turkish war.
    facts:
      - [Battle of Sisak, "22 June 1593, Habsburg victory"]
      - [Ottoman losses at Sisak, "about 8,000, with Hasan Pasha"]
      - [Győr surrenders, 29 September 1594]
    markers:
      - kind: battle
        side: hb
        name: Battle of Sisak
        date: 22 June 1593
        text: The relief army fell on the besiegers between the Kupa and the Odra. Most of the Ottoman army was cut down or drowned in the river.
        lonlat: [16.39, 45.47]
      - kind: taken
        side: ot
        name: Veszprém
        date: October 1593
        text: Sinan Pasha’s first conquest in Hungary, followed by nearby Várpalota.
        lonlat: [17.91, 47.09]
      - kind: taken
        side: hb
        name: Fülek
        date: late 1593
        text: Imperial and Hungarian troops took this castle in Upper Hungary, held by the Ottomans since 1554, in their winter campaign.
        lonlat: [19.82, 48.27]
      - kind: taken
        side: ot
        name: Győr
        date: 29 September 1594
        text: The great fortress of Győr (Raab) surrendered to Sinan Pasha after a month’s siege, opening the road towards Vienna.
        lonlat: [17.63, 47.68]
    arrows:
      - side: ot
        label: Sinan Pasha, 1594
        via: [[19.04, 47.5], [18.5, 47.6], [17.72, 47.68]]
  - title: Michael the Brave and Călugăreni
    date: 1594–1595
    when: "1594-11"
    borders: "1595-10-30"
    countries: [ro, bg, hu, md, tr]
    body:
      - Pope Clement VIII worked to bring the Ottoman vassals into the war, and in the winter of 1594–1595 Sigismund Báthory of Transylvania, Michael of Wallachia and Aron of Moldavia joined the emperor. In November 1594 Michael had the Ottoman creditors and soldiers in Bucharest killed and attacked the Ottoman fortresses on the Danube, among them Giurgiu, Brăila and Silistra. In the summer of 1595 Koca Sinan Pasha crossed the Danube with a large army to make Wallachia an Ottoman province, and on 23 August Michael, with about 16,000 men, met him in the marshy valley of the Neajlov at Călugăreni.
      - The Wallachians held the field and drove back the Ottoman attacks, but Michael was too weak to follow up and withdrew to the mountains. Sinan occupied Bucharest and Târgoviște and fortified them. In October Sigismund Báthory came down from Transylvania with his army, joined by Michael and by imperial and Tuscan troops; they retook Târgoviște on 18 October and Bucharest soon after, and caught Sinan’s army as it crossed the Danube at Giurgiu, destroying its rearguard. In Hungary the imperial army had taken Esztergom on 2 September.
    facts:
      - [Battle of Călugăreni, "23 August 1595, Wallachian victory"]
      - [Battle of Giurgiu, late October 1595]
      - [Esztergom retaken, 2 September 1595]
    markers:
      - kind: event
        side: wa
        name: Bucharest
        date: November 1594
        text: Michael began his revolt here by having the sultan’s creditors and soldiers in the city killed.
        lonlat: [26.1, 44.43]
      - kind: battle
        side: wa
        name: Battle of Călugăreni
        date: 23 August 1595
        text: Michael’s small army stopped Sinan Pasha at a bridge over the Neajlov. Legend says Sinan fell from his horse into the marsh.
        lonlat: [25.83, 44.16]
        lp: l
      - kind: taken
        side: wa
        name: Târgoviște
        date: 18 October 1595
        text: The Ottoman garrison left by Sinan was overwhelmed by the Transylvanian and Wallachian army.
        lonlat: [25.46, 44.92]
      - kind: battle
        side: wa
        name: Battle of Giurgiu
        date: late October 1595
        text: The allies caught Sinan’s retreating army at the Danube crossing and inflicted heavy losses before it reached the southern bank.
        lonlat: [25.97, 43.9]
    arrows:
      - side: ot
        label: Sinan Pasha
        via: [[25.97, 43.85], [25.9, 44.0], [25.84, 44.15], [26.08, 44.4]]
