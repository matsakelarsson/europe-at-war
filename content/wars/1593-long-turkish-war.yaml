  - title: Kanizsa
    date: 1598–1601
    when: "1598-03-29"
    borders: "1601-11-18"
    countries: [hu, hr, at, it, tr]
    body:
      - The war in Hungary became a war of sieges. On 29 March 1598 imperial troops under Adolf von Schwarzenberg and Miklós Pálffy blew open a gate of Győr with a petard and took it back by surprise. In the autumn of 1600 the grand vizier Damat İbrahim Pasha besieged Kanizsa, the main fortress covering Styria and Croatia, and in October its commander Georg Paradeiser surrendered; he was later tried and executed for it. Kanizsa became the seat of a new Ottoman province only a few days’ march from Graz.
      - In September 1601 Archduke Ferdinand of Inner Austria laid siege to Kanizsa with an army of perhaps 30,000–35,000, including papal troops under Gian Francesco Aldobrandini and soldiers from Mantua, Tuscany and Spain. The garrison under Tiryaki Hasan Pasha, a few thousand strong, held out against bombardment and assaults while rain, disease and desertion wore the besiegers down. Aldobrandini died, and in mid-November, with snow falling, the army retreated, leaving its guns and many sick behind. The same autumn an army under the Duke of Mercœur took Székesfehérvár, which the Ottomans won back in 1602.
    facts:
      - [Győr retaken, 29 March 1598]
      - [Kanizsa falls, October 1600]
      - [Siege of Kanizsa, "September–November 1601, failed"]
    markers:
      - kind: taken
        side: hb
        name: Győr
        date: 29 March 1598
        text: A surprise attack at dawn, with a petard against the gate, won back the fortress lost in 1594.
        lonlat: [17.63, 47.68]
      - kind: held
        side: ot
        name: Kanizsa
        date: 1600–1601
        text: Taken by the Ottomans in October 1600, the fortress held out under Tiryaki Hasan Pasha against a far larger Christian army in 1601.
        lonlat: [16.99, 46.46]
      - kind: taken
        side: hb
        name: Székesfehérvár
        date: September 1601
        text: The Duke of Mercœur, a French Catholic nobleman in imperial service, took the old coronation city; it was lost again the next year.
        lonlat: [18.41, 47.19]
    arrows:
