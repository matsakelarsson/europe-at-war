      - style: occupied
        side: bo
        label: Held by Bocskai’s forces in 1605 (approximate)
        atoms: [SK-KI, SK-PV, HU-BZ, HU-MI, HU-SZ, HU-NY, HU-HB, HU-DE]
  - title: The peace of Zsitvatorok
    date: 1606
    when: "1606-06-23"
    borders: "1606-11-11"
    countries: [sk, hu, at, ro, tr]
    body:
      - With Rudolf II unable to govern, the Habsburg archdukes made his brother Matthias head of the family in 1606, and Matthias made peace first with the rebels. In the Peace of Vienna of 23 June 1606 Lutherans and Calvinists in Hungary were promised freedom of worship, Hungarians were to hold the kingdom’s offices, and Bocskai was recognised as prince of Transylvania with several counties of eastern Hungary. Bocskai settled his hajdús on the land as free men, and died that December.
      - Talks with the Ottomans began on 24 October at the mouth of the Zsitva on the Danube, and the peace was signed there on 11 November 1606, for twenty years. The border stayed much as it was. The Ottomans kept Eger, Kanizsa and Esztergom, and the Habsburgs Győr and Komárom. The emperor no longer paid a yearly tribute but sent a single gift of 200,000 florins, and for the first time the sultan addressed him as an equal, as padishah rather than as a king of Vienna. The peace held, with border raids, for more than half a century.
    facts:
      - [Peace of Vienna, 23 June 1606]
      - [Peace of Zsitvatorok, "11 November 1606, for 20 years"]
      - [Payment, "a single gift of 200,000 florins instead of yearly tribute"]
    markers:
      - kind: treaty
        name: Peace of Vienna
        date: 23 June 1606
        text: Archduke Matthias and Bocskai’s envoys agreed on religious freedom and the restoration of Hungarian offices.
        lonlat: [16.37, 48.21]
      - kind: treaty
        name: Peace of Zsitvatorok
        date: 11 November 1606
        text: Signed in tents at the mouth of the Zsitva (Žitava) on the Danube, on the border between Royal and Ottoman Hungary.
        lonlat: [18.32, 47.76]
      - kind: held
        side: ot
        name: Eger
        date: 1606
        text: Kept by the Ottomans at the peace, with Kanizsa and Esztergom.
        lonlat: [20.37, 47.9]
      - kind: held
        side: hb
        name: Győr
        date: 1606
        text: Kept by the Habsburgs, with Komárom, as the main fortresses guarding Vienna.
        lonlat: [17.63, 47.68]
