  - title: Michael the Brave’s union
    date: 1599–1601
    when: "1599-10"
    borders: "1601-08-19"
    countries: [ro, md, pl, hu]
    body:
      - Sigismund Báthory gave up Transylvania twice, and in 1599 handed it to his cousin, Cardinal Andrew Báthory, who looked to Poland and demanded that Michael step down. Michael, with the emperor’s approval, crossed the Carpathians and beat Andrew at Șelimbăr near Sibiu on 28 October 1599; Andrew was killed by Székelys as he fled. On 1 November Michael entered Alba Iulia and ruled Transylvania as the emperor’s governor. In May 1600 he drove Ieremia Movilă out of Moldavia, and for a few months he styled himself prince of Wallachia, Transylvania and Moldavia.
      - Since the 19th century Romanian nationalists have seen this as the first union of the lands that now form Romania. In his own time Michael relied on the Hungarian, Székely and Saxon estates and did not give new rights to the Romanian peasants, and his rule was short. The Transylvanian nobles rose against him and, with the imperial general Giorgio Basta, beat him at Mirăslău on 18 September 1600, while the Polish chancellor Jan Zamoyski restored Movilă in Moldavia and defeated Michael at Bucov in October. Michael won back the emperor’s support and, with Basta, beat Sigismund Báthory at Guruslău on 3 August 1601, but days later Basta’s soldiers killed him near Câmpia Turzii.
    facts:
      - [Battle of Șelimbăr, "28 October 1599 (18 October Old Style)"]
      - [Ruler of all three principalities, "May–September 1600"]
      - [Michael killed, "19 August 1601 (9 August Old Style)"]
    markers:
      - kind: battle
        side: wa
        name: Battle of Șelimbăr
        date: 28 October 1599
        text: Michael’s Wallachian, Székely and mercenary army defeated Andrew Báthory and won Transylvania.
        lonlat: [24.2, 45.77]
      - kind: event
        side: wa
        name: Alba Iulia
        date: 1 November 1599
        text: Michael entered the Transylvanian capital and received the keys of the fortress.
        lonlat: [23.57, 46.07]
        lp: b
      - kind: taken
        side: wa
        name: Iași
        date: May 1600
        text: Michael’s army overran Moldavia in a few weeks, and Ieremia Movilă fled to Poland.
        lonlat: [27.59, 47.16]
      - kind: battle
        side: hb
        name: Battle of Mirăslău
        date: 18 September 1600
        text: The Transylvanian nobles and Basta’s imperial troops defeated Michael, who lost Transylvania.
        lonlat: [23.72, 46.37]
        lp: l
      - kind: battle
        side: pl
        name: Battle of Bucov
        date: 20 October 1600
        text: Zamoyski’s Polish army and Movilă’s Moldavians beat Michael on the Teleajen, and a Movilă was put on the Wallachian throne.
        lonlat: [26.08, 44.97]
      - kind: battle
        side: hb
        name: Battle of Guruslău
        date: 3 August 1601
        text: Michael and Basta together defeated Sigismund Báthory, who had returned to Transylvania.
        lonlat: [23.02, 47.25]
      - kind: event
        name: Câmpia Turzii
        date: 19 August 1601
        text: Michael was killed in his camp here by Walloon soldiers sent by Basta.
        lonlat: [23.88, 46.55]
