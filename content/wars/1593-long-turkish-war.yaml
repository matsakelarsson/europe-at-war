  - title: Bocskai’s rising and the Ottoman recovery
    date: 1602–1605
    when: "1602"
    borders: "1605-10"
    countries: [hu, sk, ro, at, cz, tr]
    body:
      - By 1602 both empires were exhausted. Unpaid mercenaries plundered the country they were meant to defend; in Transylvania Basta’s soldiers and the Tatars left famine behind them, and in the Ottoman Empire the Celali revolts spread across Anatolia and war with Persia began in 1603. Imperial troops took Pest in 1602 but could not take Buda. Meanwhile Rudolf II’s officials tried Protestant nobles for treason and seized churches from the Lutheran towns of Upper Hungary.
      - In October 1604 Stephen Bocskai, a Calvinist lord in Bihar, rose against the emperor with the hajdús, the free soldiers of the plain, and defeated an imperial column at Álmosd. He took Kassa in November, was elected prince of Transylvania in February 1605 and prince of Hungary at Szerencs in April, and his horsemen raided Moravia, Styria and Lower Austria. The Ottomans backed him, and their grand vizier, Lala Mehmed Pasha, took Esztergom back in October 1605 and in November handed Bocskai a crown on the field of Rákos near Pest.
    facts:
      - [Battle of Álmosd, "14–15 October 1604, Bocskai’s victory"]
      - [Bocskai elected prince of Hungary, "17 April 1605, at Szerencs"]
      - [Esztergom retaken by the Ottomans, October 1605]
    markers:
      - kind: battle
        side: bo
        name: Battle of Álmosd
        date: 14–15 October 1604
        text: In a night attack in the woods, Bocskai’s hajdús destroyed an imperial column sent to arrest him.
        lonlat: [21.98, 47.42]
      - kind: taken
        side: bo
        name: Kassa
        date: 11 November 1604
        text: The chief town of Upper Hungary opened its gates to Bocskai and became his headquarters.
        lonlat: [21.25, 48.72]
      - kind: event
        side: bo
        name: Szerencs
        date: 17 April 1605
        text: A diet of the Hungarian estates who had joined the rising elected Bocskai prince of Hungary.
        lonlat: [21.21, 48.16]
        lp: b
      - kind: taken
        side: ot
        name: Esztergom
        date: October 1605
        text: Lala Mehmed Pasha took back the fortress lost in 1595, after a siege of more than a month.
        lonlat: [18.74, 47.79]
      - kind: event
        side: ot
        name: Rákos
        date: November 1605
        text: The grand vizier presented Bocskai with a jewelled crown from the sultan. Bocskai accepted it as a gift but never had himself crowned.
        lonlat: [19.2, 47.5]
