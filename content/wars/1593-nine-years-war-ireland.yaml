  - title: Mountjoy and Kinsale
    date: 1599–1601
    when: "1599-04-15"
    borders: "1601-12-24"
    countries: [ie, gb, es]
    body:
      - In 1599 Elizabeth sent the Earl of Essex with the largest English army yet seen in Ireland, about 16,000 men. He spent months in Leinster and Munster while his troops dwindled through disease and desertion, and on 15 August O’Donnell destroyed a column at the Curlew Pass. Essex agreed a truce with O’Neill and went home against orders. His successor, Lord Mountjoy, who arrived in 1600, waged a different war. He planted garrisons deep in Ulster, at Derry on Lough Foyle and along the Blackwater, campaigned through the winter, and destroyed crops and cattle so as to starve the country into submission.
      - In September 1601 about 3,500 Spanish soldiers under Juan del Águila landed at Kinsale, at the far end of Ireland from O’Neill’s country. Mountjoy besieged them, and O’Neill and O’Donnell marched the length of the island in winter to relieve the town. On 24 December 1601 their army was caught as it moved into position, and Mountjoy’s cavalry broke it. Del Águila surrendered on terms and sailed home with his men in early 1602. O’Donnell went to Spain to plead for more help and died there that September.
    facts:
      - [Battle of Curlew Pass, "15 August 1599, Irish victory"]
      - [Spanish landing at Kinsale, "September 1601, about 3,500 men"]
      - [Battle of Kinsale, "24 December 1601, English victory"]
    markers:
      - kind: battle
        side: ir
        name: Battle of Curlew Pass
        date: 15 August 1599
        text: Sir Conyers Clifford’s column, marching to relieve a castle in Sligo, was ambushed in the Curlew Mountains near Boyle. Clifford was killed.
        lonlat: [-8.312, 53.998]
      - kind: held
        side: cr
        name: Derry
        date: May 1600
        text: Sir Henry Docwra landed about 4,000 men on Lough Foyle and fortified Derry, behind O’Neill’s and O’Donnell’s lands.
        lonlat: [-7.32, 54.998]
      - kind: battle
        name: Battle of Moyry Pass
        date: September – October 1600
        text: O’Neill’s earthworks and barricades held Mountjoy’s army in the pass into Ulster for weeks, at heavy cost to both sides.
        lonlat: [-6.385, 54.064]
      - kind: event
        side: es
        name: Castlehaven
        date: December 1601
        text: A second Spanish force of about 700 men landed west of Kinsale and held Castlehaven, Baltimore and Dunboy with Irish allies.
        lonlat: [-9.18, 51.52]
      - kind: battle
        side: cr
        name: Battle of Kinsale
        date: 24 December 1601
        text: The Irish army, unused to fighting in open country, was routed before the Spaniards in the town could join in.
        lonlat: [-8.512, 51.699]
