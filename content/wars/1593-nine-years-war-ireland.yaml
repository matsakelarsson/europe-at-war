  - title: Mellifont
    date: 1602–1603
    when: "1602-06-05"
    borders: "1603-03-30"
    countries: [ie, gb]
    body:
      - After Kinsale the confederacy fell apart. In the south Sir George Carew took Dunboy, the O’Sullivan castle on Bantry Bay, in June 1602 and hanged most of its defenders. In midwinter Donal Cam O’Sullivan Beare led about 1,000 of his people north from Glengarriff, fighting off attacks across Munster and Connacht, to O’Rourke’s country in Leitrim; about 35 arrived. In Ulster Mountjoy’s armies burned crops, killed cattle and broke the stone chair at Tullaghoge on which the O’Neills had been inaugurated. Famine killed many thousands, and O’Neill retreated into the woods of Glenconkeyne.
      - On 30 March 1603, at Mellifont Abbey near Drogheda, O’Neill submitted to Mountjoy, not knowing that Elizabeth had died six days before. The terms were lenient. He kept most of his lands as Earl of Tyrone but gave up the Gaelic title of The O’Neill and his power over lesser lords, and Ulster came under English law and sheriffs, completing the Tudor conquest of Ireland. In 1607 O’Neill, O’Donnell’s brother and other northern lords left for the Continent in the Flight of the Earls, and their lands were confiscated for the Plantation of Ulster.
    facts:
      - [Siege of Dunboy, "5–18 June 1602, English victory"]
      - [O’Sullivan Beare’s march, "about 1,000 set out, about 35 reached Leitrim"]
      - [Treaty of Mellifont, "30 March 1603"]
    markers:
      - kind: taken
        side: cr
        name: Dunboy
        date: 18 June 1602
        text: About 140 defenders held the castle for eleven days against Carew’s army of several thousand. Most of the survivors were hanged.
        lonlat: [-9.924, 51.633]
      - kind: event
        side: ir
        name: Glengarriff
        date: 31 December 1602
        text: O’Sullivan Beare set out with his soldiers and their families, about 1,000 people, to join the northern lords still in arms.
        lonlat: [-9.552, 51.75]
        lp: t
      - kind: event
        side: ir
        name: Leitrim
        date: January 1603
        text: After about two weeks and some 500 km, the survivors reached Brian Óg O’Rourke’s castle.
        lonlat: [-8.064, 53.991]
      - kind: event
        side: cr
        name: Tullaghoge
        date: "1602"
        text: Mountjoy had the inauguration stone of the O’Neills smashed, a blow at the old order in Ulster.
        lonlat: [-6.723, 54.61]
      - kind: treaty
        name: Mellifont
        date: 30 March 1603
        text: O’Neill made his submission in the house of Mountjoy’s ally Sir Garret Moore, built in the ruins of the Cistercian abbey.
        lonlat: [-6.466, 53.742]
