notes:
  - Also called Tyrone’s Rebellion. Dates are Old Style, as used by the English in Ireland; the Spanish at Kinsale used the Gregorian calendar, ten days ahead, so the battle there is also dated 3 January 1602.
  - The war began with Hugh Maguire’s rising in Fermanagh in 1593; O’Neill joined openly only in 1595. It was also part of the wider Anglo-Spanish War of 1585–1604.
