steps:
  - title: Clontibret and the Yellow Ford
    date: 1593–1598
    when: "1593-05"
    borders: "1598-10-15"
    countries: [ie, gb]
    body:
      - After the Tudor conquest of Munster and Connacht, English sheriffs, garrisons and officials pressed into Ulster, the last region still ruled by Gaelic lords. In 1593 Hugh Maguire of Fermanagh rose against a newly appointed sheriff, and in August 1594 his men ambushed a column bringing supplies to the English garrison of Enniskillen. Hugh O’Neill, Earl of Tyrone, brought up at the English court but the most powerful lord in Ulster, kept in the background while he trained a modern army of musketeers and pikemen. In 1595 he joined openly with Hugh Roe O’Donnell, lord of Tír Chonaill, and in May ambushed Sir Henry Bagenal’s column at Clontibret.
      - Truces and talks alternated with fighting while O’Neill sought help from Spain. On 14 August 1598 Bagenal led about 4,000 men from Armagh to relieve the besieged Blackwater Fort. At the Yellow Ford O’Neill’s army cut the column apart; Bagenal was shot dead, a powder wagon exploded, and about 1,500 English soldiers were killed. It was the worst defeat English arms had suffered in Ireland. The fort surrendered, many lords who had stayed neutral joined O’Neill, and in October revolt swept through Munster. The English settlers there fled to the walled towns, among them the poet Edmund Spenser, whose castle at Kilcolman was burned.
    facts:
      - [Battle of Clontibret, "May 1595, Irish victory"]
      - [Battle of the Yellow Ford, "14 August 1598, Irish victory"]
      - [English losses at the Yellow Ford, "about 1,500 killed"]
    markers:
      - kind: battle
        side: ir
        name: Battle of the Ford of the Biscuits
        date: 7 August 1594
        text: Maguire’s men routed a column of about 650 men on its way to Enniskillen. The battle is named after the biscuits left floating in the river.
        lonlat: [-7.639, 54.277]
      - kind: battle
        side: ir
        name: Battle of Clontibret
        date: May 1595
        text: O’Neill’s larger army attacked Bagenal’s column on its way back from relieving Monaghan, and inflicted heavy losses. It was the first severe English setback of the war.
        lonlat: [-6.853, 54.215]
      - kind: event
        side: ir
        name: Dungannon
        date: 1595–1602
        text: O’Neill’s chief seat. In 1602, as Mountjoy advanced, he burned it and withdrew.
        lonlat: [-6.77, 54.5]
        lp: l
      - kind: battle
        side: ir
        name: Battle of the Yellow Ford
        date: 14 August 1598
        text: The English column was split by Irish attacks and halted by a great trench dug across its path near the River Callan.
        lonlat: [-6.686, 54.401]
      - kind: event
        side: ir
        name: Kilcolman
        date: October 1598
        text: The rising destroyed the Munster plantation, settled on land confiscated after the Desmond Rebellions. Spenser’s castle was burned, and he fled to Cork.
        lonlat: [-8.61, 52.25]
