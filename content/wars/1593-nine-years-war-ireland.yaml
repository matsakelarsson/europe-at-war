id: nine-years-war-ireland
name: Nine Years’ War in Ireland
start: "1593-05"
end: "1603-03-30"
tier: B
summary: A war between a confederacy of Gaelic Irish lords, led by Hugh O’Neill, Earl of Tyrone, and Hugh Roe O’Donnell, and the English crown, which was extending its rule into Ulster, the last part of Ireland under Gaelic lordship. The Irish won at Clontibret and the Yellow Ford, but after Lord Mountjoy’s scorched-earth campaign and the defeat of the Irish and their Spanish allies at Kinsale in 1601, O’Neill submitted at Mellifont in 1603, completing the Tudor conquest of Ireland.
