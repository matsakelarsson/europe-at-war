id: spanish-expedition-to-cambodia
name: Spanish expedition to Cambodia (Cambodian–Spanish War)
start: "1593"
end: "1599"
tier: C
summary: "Siamese invasions of Cambodia and the attempt of Spanish and Portuguese adventurers, backed in the end by Spanish Manila, to make Cambodia a client of Spain. After Naresuan had thrown off Burmese rule, Siamese armies attacked Cambodia in 1593, and King Satha I sent the Portuguese Diogo Veloso and the Spaniard Gregorio Vargas to Manila to ask for help. In 1594 the Siamese took and sacked the capital, Longvek; Satha fled to Lan Xang, where he died, and the Siamese carried off thousands of Cambodians, among them Prince Soriyopor. In 1596 an expedition of three ships under Juan Juárez Gallinato left Manila with Spanish and Mexican soldiers and Japanese and Filipino auxiliaries, between about 120 and 400 men by different accounts. At Phnom Penh, Blas Ruiz de Hernán González and Veloso fought the Chinese merchants and stormed the palace of the new king, Reamea Chung Prey (Preah Ram I), who was killed; Gallinato withdrew. Ruiz and Veloso then brought Satha’s son Barom Reachea II back from Lan Xang and put him on the throne in 1597, receiving two provinces. In 1599, when more ships from Manila had been wrecked, Cham and Malay forces under the Laksmana, with Cambodian allies, killed Ruiz, Veloso and almost all the Spaniards and Portuguese at Phnom Penh; the young king was killed soon after. Soriyopor returned from Ayutthaya with Siamese support, and the Spanish plans for Cambodia were given up."
