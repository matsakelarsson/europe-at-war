notes:
  - "The sources for these years are Spanish and Portuguese chronicles and much later Cambodian chronicles, and they disagree on many dates and numbers. Longvek’s fall is dated January 1594, July 1594 or 1593 in different works, and the size of the 1596 expedition is given from 120 to 400 men. Spain and Portugal then had one king, Philip II, which is why Spaniards and Portuguese acted together."
  - "Names: Longvek is also written Lovek; Phnom Penh appears in Spanish accounts as Churdumuco (Chaktomuk). Reamea Chung Prey, an official who seized the throne after Satha’s flight, reigned as Preah Ram I."
