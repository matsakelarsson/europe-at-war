id: mughal-conquest-of-the-deccan-sultanates
name: Mughal wars in the Deccan (1595–1636)
start: "1595-11"
end: "1636-05"
tier: B
summary: "The Mughal Empire’s first push into the Deccan, against the sultanates of Ahmadnagar and Khandesh, and the settlement that followed with Bijapur and Golconda. Akbar’s armies besieged Ahmadnagar in 1595–96, when it was famously defended by Chand Bibi, and forced it to cede Berar. In 1600 they stormed Ahmadnagar fort, and in January 1601 Akbar took Asirgarh, the fortress of Khandesh, which was annexed. But the Ahmadnagar state survived under the Ethiopian-born regent Malik Ambar, who with Maratha light cavalry held the Mughals at bay for a quarter of a century and beat a Mughal and Bijapuri army at Bhatvadi in 1624. After his death in 1626 the sultanate weakened. Shah Jahan’s general Mahabat Khan took the fortress of Daulatabad in 1633, and in 1636 Ahmadnagar was divided between the Mughals and Bijapur, while Bijapur and Golconda accepted Mughal overlordship by treaty."
