  - title: Malik Ambar
    date: 1600–1626
    when: "1600-08"
    borders: "1624-09"
    countries: [in]
    body:
      - "The fall of Ahmadnagar fort did not end the kingdom. Malik Ambar, born around 1548 in Harar in Ethiopia, sold as a slave and brought to the Deccan, had risen to command in the Nizam Shahi army. In 1600 he set up a new sultan, Murtaza Nizam Shah II, at Paranda, and as his regent ruled what remained of the state for a quarter of a century. He moved the capital to Junnar and then founded a new city at Khadki, later renamed Aurangabad, and reorganised the land revenue in a way the Mughals later copied."
      - "Malik Ambar’s strength lay in light cavalry raised among the Marathas, led by chiefs such as Maloji and Shahaji Bhonsle and Lakhuji Jadhav, which harassed Mughal armies and cut their supplies. Jahangir’s generals recovered ground in campaigns led by Prince Khurram in 1617 and 1621, but could not destroy him. In September 1624, at Bhatvadi near Ahmadnagar, Malik Ambar broke a dam on the Keli river, flooding the ground in front of a combined Mughal and Bijapuri army, then fell on its camp and captured many of its commanders. He died on 14 May 1626, aged nearly eighty."
    facts:
      - [Malik Ambar regent, "1600–1626"]
      - [Battle of Bhatvadi, "September 1624, Ahmadnagar victory"]
      - [Death of Malik Ambar, "14 May 1626"]
