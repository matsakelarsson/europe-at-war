notes:
  - Bijapur and Golconda changed sides more than once. They helped Ahmadnagar against Akbar in the 1590s, fought on the Mughal side against Malik Ambar in the 1620s, and backed the last Nizam Shahi claimant in 1633–36.
  - The main sources are the Mughal histories (the Akbarnama, Jahangir’s memoirs, the Padshahnama) and Deccani and Maratha chronicles. Dates differ by a few days between them; dates after 1582 are Gregorian.
