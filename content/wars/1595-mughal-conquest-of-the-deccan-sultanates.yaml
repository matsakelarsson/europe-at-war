  - title: Daulatabad and the treaties of 1636
    date: 1629–1636
    when: "1629"
    borders: "1636-05"
    countries: [in]
    body:
      - "Shah Jahan, who had campaigned in the Deccan as a prince, came to Burhanpur in 1630 to hunt down the rebel general Khan Jahan Lodi, who had fled to Ahmadnagar, and to finish the war. Famine ravaged the Deccan in 1630–32. In Ahmadnagar Malik Ambar’s son Fath Khan killed the sultan and put a child, Hussain Nizam Shah III, on the throne. In March 1633 Mahabat Khan laid siege to Daulatabad, the great rock fortress that was now the Nizam Shahi capital. Bijapuri troops, with the Maratha general Shahaji Bhonsle, tried to break the blockade but failed. Mines breached the outer walls, Fath Khan surrendered, and on 27 June 1633 Mahabat Khan entered the fort. Hussain Shah was imprisoned at Gwalior."
      - "Shahaji then set up another child of the Nizam Shahi family as sultan and held the western hill forts with Bijapur’s backing. In 1636 Shah Jahan came south with a large army. Abdullah Qutb Shah of Golconda accepted Mughal overlordship, agreeing to pay tribute and have the Friday prayer read in Shah Jahan’s name. Bijapur, its lands ravaged by Mughal columns, made peace in May 1636. Muhammad Adil Shah recognised Mughal overlordship and paid a large indemnity, and in return received part of the Ahmadnagar lands on condition that he stop supporting Shahaji. Shahaji surrendered his forts later that year and entered Bijapuri service. The Ahmadnagar Sultanate was at an end, and Shah Jahan’s son Aurangzeb became viceroy of the Mughal Deccan."
    facts:
      - [Siege of Daulatabad, "1 March – 27 June 1633, Mughal victory"]
      - [Treaties with Golconda and Bijapur, "1636"]
