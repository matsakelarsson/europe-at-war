steps:
  - title: Chand Bibi, Ahmadnagar and Asirgarh
    date: 1595–1601
    when: "1595-11"
    borders: "1595-11"
    countries: [in]
    body:
      - "Having conquered the north, Akbar called on the Deccan sultans to accept his overlordship; only Raja Ali Khan of Khandesh did. When the death of Burhan Nizam Shah II in 1595 set off a succession war in Ahmadnagar, one faction called in the Mughals. In November 1595 Prince Murad and Abdul Rahim Khan-i-Khanan besieged Ahmadnagar fort. It was defended by Chand Bibi, a princess of the Nizam Shahi house and widow of Ali Adil Shah of Bijapur, acting as regent for the child sultan Bahadur. She is remembered for leading the repair of a breach under fire. On 23 February 1596 she made peace by ceding Berar, and the Mughals withdrew."
      - "The war soon resumed. On 8–9 February 1597 the Mughals defeated an army of Ahmadnagar, Bijapur and Golconda near Sonpet on the Godavari, in a battle in which Raja Ali Khan of Khandesh, fighting for Akbar, was killed. In 1599 Akbar came south himself. His son Daniyal besieged Ahmadnagar again; Chand Bibi, who was negotiating terms, was killed by her own soldiers, and on 18 August 1600 the fort was stormed. The young sultan was sent as a prisoner to Gwalior."
      - "Meanwhile Raja Ali Khan’s son, Bahadur Shah of Khandesh, had shut himself up in Asirgarh, one of the strongest fortresses in India, and refused to submit. Akbar besieged it, lured Bahadur to his camp and held him there, and the garrison, weakened by disease and won over by bribes, surrendered on 17 January 1601. Khandesh was annexed, and with Berar and the conquered part of Ahmadnagar it formed the Mughal Deccan."
    facts:
