tier: B
summary: "Sigismund III Vasa, king of both Poland–Lithuania and Sweden, landed in Sweden in 1598 to assert his rule against his uncle Duke Charles. Beaten at Stångebro, he was deposed in 1599, which began a long feud between the Swedish and Polish branches of the Vasa dynasty."
