    body:
      - Sigismund, son of John III, was king of Poland–Lithuania as well as Sweden, and a Catholic. His Lutheran uncle Duke Charles governed Sweden and had himself chosen regent against the king’s will. In 1598 Sigismund landed at Kalmar with an army of mercenaries to take back control.
      - He won a first clash at Stegeborg in September but let Charles escape. Two weeks later, on 25 September 1598, Charles attacked his army at the Stångebro bridges in Linköping and won. Sigismund went back to Poland and was deposed as king of Sweden in 1599, starting a long feud between the Polish and Swedish branches of the Vasa family.
