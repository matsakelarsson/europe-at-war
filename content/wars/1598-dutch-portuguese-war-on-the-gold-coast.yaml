  - title: The fall of Elmina and Axim
    date: 1637–1642
    when: "1637-08"
    borders: "1642-03-01"
    countries: [gh, nl, pt]
    body:
      - Neglected by Lisbon and Madrid, the garrison of São Jorge went unpaid for years and in 1634 mutinied against its new governor. The Dutch commander at Fort Nassau, Nicolaes van Ypren, who had shipped about a thousand enslaved Africans from Moree to Dutch Brazil in 1636, wanted Elmina as a better base. He won most of the African states nearby to alliance or neutrality with gifts, persuading Elmina’s neighbours of Komenda (Eguafo) and Fetu to turn against the Portuguese, and in 1637 a fleet came from Brazil with about 800 soldiers and 500 sailors under Colonel Hans Coine. About a thousand African fighters joined them.
      - The troops landed near Cape Coast and marched on the hill of St Jago, which overlooks the castle. Africans allied to the Portuguese held its foot and destroyed the first companies sent against them, but a second column took the hill from the other side, and the Dutch allies overran the African town by the castle. Coine dragged a mortar and two guns up the hill and bombarded the castle for two days; short of food, with his men falling sick, he threatened to give no quarter. The governor capitulated, and on 29 August 1637, by most accounts, the Portuguese left for São Tomé without their weapons. Elmina became the Dutch headquarters on the coast.
      - The other Portuguese posts followed. Shama fell in 1640 or 1642, and early in 1642 the Company took Fort Santo António at Axim, the last Portuguese stronghold, letting the Portuguese and their African allies leave. On 17 February 1642 the director-general, Jacob Ruychaver, signed a treaty with the two chiefs of Axim, Atty Ansi and Peter Agoey, who recognised the Company and promised to trade with no other Europeans. Portugal, independent again since December 1640, had signed a ten-year truce with the Dutch Republic on 12 June 1641, but the States-General ratified it only on 20 February 1642, after Axim had fallen. The Dutch held the forts until they handed their Gold Coast to Britain in 1872.
    facts:
      - [Dutch force, "about 1,300 men from Brazil, with about 1,000 African allies"]
      - [Elmina surrenders, "29 August 1637 (dates vary)"]
      - [Axim taken, "early 1642; treaty of 17 February 1642"]
