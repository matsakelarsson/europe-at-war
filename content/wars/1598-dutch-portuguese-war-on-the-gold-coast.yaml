id: dutch-portuguese-war-on-the-gold-coast
name: Dutch–Portuguese war on the Gold Coast
start: "1598"
end: "1642-02-17"
tier: B
summary: "The struggle in which Dutch traders, and from 1621 the Dutch West India Company, broke Portugal’s hold on the Gold Coast, part of the wider Dutch–Portuguese War. The Portuguese had traded for Akan gold from São Jorge da Mina at Elmina since 1482, with outposts at Shama and Axim, and paid for much of it with captives brought from Benin. Dutch ships came from the 1590s; about 1598 they opened a post at Moree, which the Portuguese burned in 1610, and in 1612, by treaty with the rulers of Asebu, they built Fort Nassau there. The Company’s first attack on Elmina, on 25 October 1625, was ambushed and beaten by the small garrison and its African allies. In August 1637 a second force from Dutch Brazil, joined by about a thousand African fighters whom the Dutch commander had won over, took the hill of St Jago above the castle and forced its surrender. Shama fell in 1640 or 1642 and Axim early in 1642, and the treaty the Company made with Axim’s chiefs on 17 February 1642 ended Portuguese rule on the coast, three days before the States-General ratified the truce of 1641 between the Dutch and the newly independent Portugal. Both sides relied on African rulers and fighters, who chose their allies for trade and gifts; the Dutch used Elmina, as the Portuguese had, for the trade in gold and increasingly in slaves."
countries: [gh, nl, pt]
sides:
  - id: nl
    name: Dutch Republic (Dutch traders, from 1621 the West India Company)
    polities: [dutch-republic]
    ink: orange
    moves: Dutch moves
    success: Dutch success
  - id: pt
