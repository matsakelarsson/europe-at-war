steps:
  - title: Fort Nassau and the first attack on Elmina
    date: 1598–1625
    when: "1612"
    borders: "1625-10-25"
    countries: [gh, nl, pt]
    body:
      - For more than a century after building São Jorge da Mina at Elmina in 1482, the Portuguese kept other Europeans off the Gold Coast by force. They bought gold from Akan traders at the castle and at their outposts of Shama and Axim, and paid for much of it with captives brought by sea from Benin and the Niger delta. By the 1590s the trade was in decline, weakened by smuggling, corruption and unpaid garrisons. Dutch ships, the first of them Barent Eriksz’s in 1591, began trading along the coast with cheaper and more plentiful goods; a Dutch attempt on the castle in 1596 failed, and about 1598 the Dutch opened a trading post at Moree, 15 km east of Elmina.
      - During the Twelve Years’ Truce of 1609–1621, which left Portugal freer to defend its monopoly, the Portuguese attacked the Dutch posts, and in 1610 the Dutch factory at Moree was burned. The Dutch traders asked the States-General for a fort. In 1612, after a treaty with the rulers of Asebu, whose land included Moree, Jacob Clantius, the first Dutch general on the coast, built Fort Nassau there. In 1621 the new West India Company received the monopoly of the trade, and its “great design” against Portugal’s possessions in the Atlantic included Elmina.
      - In October 1625 fifteen Company ships brought about 1,200 soldiers to Elmina. The governor, Francisco de Souto-Maior, had about 56 Portuguese soldiers, but he had enlisted African fighters from near the castle, about 200 of them, and paid neighbouring rulers to stay neutral. On 25 October, as the Dutch advanced on the castle after bombarding it, they were ambushed from hidden positions and routed; the Dutch admitted the loss of more than 400 men, the Portuguese reported fewer than 30 dead, and the fleet sailed away in November.
    facts:
      - [Dutch post at Moree, "about 1598"]
      - [Fort Nassau built, "1612"]
      - [Battle of Elmina, "25 October 1625, Portuguese victory"]
