notes:
  - From 1580 to 1640 the kings of Spain were also kings of Portugal, which was therefore at war with Spain’s Dutch enemies; Portugal regained its independence in December 1640. The Dutch–Portuguese War was fought also in Brazil, Angola, the Indian Ocean and Asia.
  - Dates differ between sources. The surrender of Elmina is given as 27, 28 or 29 August 1637 (29 August in most accounts), and the capture of Shama as 1640 or 1642. Numbers come from Dutch and Portuguese reports.
  - The African states of the coast between Axim and Moree, among them Asebu, Fetu, Eguafo (Komenda), Ahanta and the town of Elmina itself, are not on the base map; their land is shown without a state.
