id: fall-of-pegu
name: Fall of Pegu and the Portuguese at Syriam
start: "1599-04"
end: "1613-03-26"
tier: B
summary: "The break-up of the Toungoo empire of Bayinnaung and its restoration from Ava. After the defeat at Nong Sarai (1593) Nanda Bayin lost the Tenasserim coast and the Mon country to Siam, Naresuan besieged Pegu in 1595, and Prome, Toungoo, Ava, Lan Na and Lan Xang broke away. In 1599 the lord of Toungoo, Minye Thihathu II, and King Min Razagyi of Arakan, whose fleet carried Portuguese mercenaries, besieged Pegu; Nanda surrendered on 19 December 1599 and was taken to Toungoo, where he was killed in 1600. The Arakanese burned the city and carried off its people and treasures, and a Siamese army arriving too late besieged Toungoo in vain. Filipe de Brito, the Portuguese whom Arakan left as governor of the port of Syriam, made it a Portuguese fort in 1603. Meanwhile Nyaungyan, Nanda’s half-brother, rebuilt the kingdom from Ava; his son Anaukpetlun took Prome (1608) and Toungoo (1610), and in 1613 took Syriam after a 36-day siege and had de Brito executed. Lower Burma was again united with the Irrawaddy valley, now ruled from Ava."
