steps:
  - title: The empire breaks up, and Pegu falls
    date: 1594 – May 1600
    when: "1599-04"
    borders: "1600-01"
    countries: [mm, th]
    body:
      - "After Nong Sarai the Toungoo empire came apart. In 1594 Martaban and the Mon country went over to Siam; in January 1595 Naresuan besieged Pegu for three months and withdrew only when the viceroys of Prome, Ava and Toungoo came to its relief. Then the viceroys themselves broke away: Prome in 1595, Lan Na and Lan Xang, Toungoo under Minye Thihathu II, and Ava, where Nanda’s half-brother, the Nyaungyan prince, made himself master of the north in 1597. Nanda, with a capital emptied by war, famine and flight, held little more than Pegu."
      - "Minye Thihathu allied with Min Razagyi of Arakan, whose fleet, under Prince Khamaung and with Portuguese mercenaries led by Filipe de Brito, left Mrauk U in November 1598 and took the port of Syriam in March 1599. From April the armies of Toungoo and Arakan besieged Pegu. Its defenders went over or slipped away, and on 19 December 1599 Nanda surrendered; he was taken to Toungoo. The victors divided the treasure: Arakan received a white elephant, a daughter of Nanda and about thirty bronze statues that Bayinnaung had brought from Ayutthaya in 1564. The Arakanese burned Pegu in March 1600 and deported thousands of households."
      - "Naresuan, who had marched on Pegu again, found the city in ashes. He besieged Toungoo from April 1600 but, short of supplies and harried by the Arakanese, withdrew on 6 May. On the night of 30 November 1600 Nanda was killed at Toungoo by Minye Thihathu’s son Natshinnaung, against his father’s wishes."
    facts:
      - ["Siege of Pegu", "April – 19 December 1599"]
      - ["Pegu burned", "March 1600"]
      - ["Siege of Toungoo", "April – 6 May 1600, Siamese withdrawal"]
