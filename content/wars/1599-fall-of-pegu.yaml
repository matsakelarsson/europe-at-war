notes:
  - "Burmese chronicles, Portuguese accounts and Siamese chronicles describe these years very differently, and many dates and numbers are uncertain. The Portuguese gave Anaukpetlun’s army at Syriam as 120,000 men and 400 boats; these are their figures, not counts. Siamese chronicles count Naresuan’s army of 1595 at 120,000."
  - "Names: Pegu is today’s Bago, Syriam Thanlyin, Martaban Mottama, Prome Pyay, Dagon Yangon and Tavoy Dawei. Filipe de Brito e Nicote is called Nga Zinga in Burmese chronicles. Martaban was ruled by a Mon lord, Binnya Dala, as a Siamese vassal from 1594 to 1613."
  - "The war over Tavoy, Tenasserim and Lan Na that went on between Burma and Siam after 1609 (the Burmese–Siamese War of 1609–1622) is mentioned only in brief."
