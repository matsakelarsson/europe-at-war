  - title: The siege of Syriam
    date: February – March 1613
    when: "1613-02"
    borders: "1613-12"
    countries: [mm]
    body:
      - "Anaukpetlun answered the raid with a land and river army, which reached Syriam on 19 February 1613. The Portuguese counted it at 120,000 men and 400 vessels; the garrison was 100 to 200 Portuguese and 2,000 to 3,000 local troops. For 36 days the Burmese mined and stormed the walls while the Portuguese held out short of powder. An Arakanese fleet that came to relieve the fort was beaten and its boats taken. On 26 March 1613 the fort fell. De Brito was impaled on a stake, and Natshinnaung was executed with him. More than 400 Portuguese and other foreigners were taken to Upper Burma, where their descendants, the bayingyi, served the kings as gunners."
      - "Martaban submitted to Ava later in 1613, and Anaukpetlun went on against Tavoy, Tenasserim and Lan Na; the fighting with Siam went on until 1622. Anaukpetlun later made Pegu his capital (1617); Thalun moved the court back to Ava in 1635. The kingdom that Anaukpetlun restored, the Restored Toungoo or Nyaungyan kingdom, held Lower and Upper Burma together until the Mon rising of 1740."
    facts:
      - ["Siege of Syriam", "19 February – 26 March 1613"]
      - ["Garrison", "100–200 Portuguese and 2,000–3,000 local troops"]
      - ["Captives", "more than 400 Portuguese and others taken to Upper Burma"]
