  - title: De Brito’s Syriam and the rise of Ava
    date: 1600–1610
    when: "1603"
    borders: "1610"
    countries: [mm]
    body:
      - "Arakan left Filipe de Brito, a Portuguese who had come to Arakan as a mercenary, as its governor at Syriam with a small garrison. He fortified the port, drew Portuguese settlers to it and in 1603 declared it a possession of the Portuguese crown; the viceroy at Goa named him captain of Syriam and gave him the title of king of Pegu. When Arakan and Toungoo attacked, his ships defeated the Arakanese fleet and captured Prince Khamaung, who was ransomed. De Brito allied by marriage with Binnya Dala of Martaban. Buddhist chronicles remember his rule for the pillage of shrines; in 1608 his men removed the great Dhammazedi bell from the Shwedagon to melt it for cannon, but it sank in the river."
      - "In the north, Nyaungyan rebuilt the kingdom from Ava and brought back the Shan states before his death in November 1605. His son Anaukpetlun took Prome in 1608 after a long siege and made his brother Thalun its governor. Natshinnaung, lord of Toungoo since his father’s death in 1609, surrendered his city to Anaukpetlun on 4 September 1610 and was kept on as governor. Late that year de Brito and the forces of Martaban sailed up the Sittaung, sacked Toungoo and took Natshinnaung back to Syriam, where he became his ally."
    facts:
      - ["Syriam declared Portuguese", "1603"]
      - ["Prome taken by Anaukpetlun", "1608"]
      - ["Toungoo submits to Ava", "1610"]
