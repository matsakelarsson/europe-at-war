id: kwararafa-raids
name: Kwararafa wars with Kano and Bornu
start: "1600"
end: "1680"
tier: C
summary: "Raids and invasions of the Hausa kingdoms and of Bornu by Kwararafa, a state or confederation in the Benue valley of central Nigeria, from the late sixteenth century to about 1680. The Kano Chronicle tells that under Sarki Muhammad Zaki (1582–1618 in its reckoning) the king of Kwararafa attacked Kano and ravaged the country, and that the people fled to Daura; in the 1650s, under Muhammad Kukuna, Kwararafa forces under their king Adashu attacked Kano again and damaged its Kawayi gate while the sarki was away, and in 1653, by one account, Kano’s ruler was forced into exile; in 1671 the people of Kano fled once more to Daura. Kano and Katsina, long at war with each other, made peace about 1650 to face the threat. About 1680 Kwararafa armies attacked Katsina and Zazzau and invaded Bornu, reaching its capital, Birni Ngazargamu; Mai Ali ibn Umar drove them out, and some accounts say the city was sacked. Kwararafa then declined: by the end of the eighteenth century it paid tribute to Bornu, and a Jukun kingdom at Wukari later claimed its succession. Almost everything known about these wars comes from the chronicles of the Hausa and Bornu states that Kwararafa attacked; the Benue valley’s own traditions say little about them. The identification of Kwararafa with the Jukun was first made by the colonial officer Richmond Palmer, and a minority of historians doubt that a single confederation existed."
