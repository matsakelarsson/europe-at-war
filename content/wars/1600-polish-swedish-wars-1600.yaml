  - title: Riga, Prussia and the Truce of Altmark
    date: 1617–1629
    when: "1617"
    borders: "1629"
    countries:
      - se
      - pl
      - lt
      - lv
      - ee
    view:
      center:
        - 21.8511
        - 56.0092
      size:
        - 661
        - 558
    body:
      - Gustav II Adolf renewed the war on Sigismund. In September 1621 he took Riga, which his father had failed to capture, and by 1625 he had overrun Livonia, including Dorpat. On 17 January 1626 he beat a Polish-Lithuanian army at Wallhof, the first Swedish victory over the Commonwealth in open battle.
      - "In July 1626 he landed in Prussia to strike at Danzig and the Vistula trade. There were Swedish successes at Mewe and Dirschau, where the king was badly wounded in 1627, but the Danzig fleet beat a Swedish squadron off Oliwa that November, and in June 1629 Stanisław Koniecpolski and Imperial troops mauled his army at Trzciana. France helped broker the Truce of Altmark on 26 September 1629: Sweden kept Livonia and tolls from the Prussian ports, and Gustav Adolf was free to turn to Germany."
