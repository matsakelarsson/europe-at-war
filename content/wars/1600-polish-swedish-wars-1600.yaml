id: polish-swedish-wars-1600
name: Polish–Swedish wars, 1600–1629
start: "1600"
end: "1629"
tier: B
summary: "Sweden and Poland–Lithuania, ruled by rival branches of the Vasa dynasty, fought on and off for Livonia and the Prussian coast. After a crushing Polish–Lithuanian victory at Kircholm in 1605, Gustav II Adolf took Riga and Livonia and invaded Prussia, and the Truce of Altmark in 1629 left most of Livonia Swedish."
