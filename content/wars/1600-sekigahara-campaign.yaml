  - title: Gifu, Ueda and the race to Mino
    date: September – October 1600
    when: "1600-09-29"
    borders: "1600-10-01"
    countries: [jp]
    body:
      - The Eastern vanguard, some 30,000 to 35,000 men, gathered at Kiyosu and waited for Ieyasu, who stayed in Edo writing letters to win over waverers in the Western camp. Stung by a message asking whether they meant to fight, they crossed the Kiso River and on 29 September stormed Gifu Castle, held for the West by Oda Hidenobu, Nobunaga’s grandson. Ishida Mitsunari, who had advanced to Ōgaki Castle, was now faced by an Eastern army only a few kilometres away.
      - Ieyasu left Edo on 7 October with about 30,000 men and marched along the Tōkaidō. Hidetada, with the larger Tokugawa army, laid siege on his way to Ueda Castle in Shinano, held by Sanada Masayuki and his son Yukimura (Nobushige), whose other son Nobuyuki served the Tokugawa. The siege failed, the roads were slowed by rain, and Hidetada would reach Mino days after the battle.
      - Behind the Eastern lines the West still had successes. Western troops under Mōri Motoyasu and Tachibana Muneshige besieged Ōtsu Castle on Lake Biwa, whose lord Kyōgoku Takatsugu had gone over to Ieyasu, from 13 October; it surrendered on the morning of 21 October. These troops, about 15,000 men, and the army before Tanabe never reached Sekigahara.
    facts:
      - [Gifu Castle taken, "29 September 1600"]
      - [Ieyasu leaves Edo, "7 October 1600"]
      - [Siege of Ueda, "October 1600"]
      - [Siege of Ōtsu, "13–21 October 1600"]
