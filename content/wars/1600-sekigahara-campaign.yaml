  - title: The battle of Sekigahara
    date: 21 October 1600
    when: "1600-10-21"
    borders: "1600-10-21"
    countries: [jp]
    body:
      - On 20 October Ieyasu reached the Eastern camp at Akasaka, and Shima Sakon, Ishida’s chief retainer, won a skirmish on the Kuise River. Fearing that Ieyasu would bypass Ōgaki and march on Ishida’s castle of Sawayama and on Osaka, Ishida led the Western army out of Ōgaki that night through the rain to Sekigahara, a narrow valley where the Nakasendō and the roads to Hokuriku and Ise met. By dawn his men held the hills on three sides of the valley. Ishida stood on Sasaoyama in the north-west, Shimazu Yoshihiro and Konishi Yukinaga to his south, Ukita Hideie, with the largest contingent, and Ōtani Yoshitsugu below Mount Matsuo, where Kobayakawa Hideaki waited with 15,600 men. Behind the Eastern army, on Mount Nangū, stood the Mōri army under Mōri Hidemoto and Kikkawa Hiroie, with Ankokuji Ekei and Chōsokabe Morichika. The Eastern army followed and deployed in the valley, with Ieyasu’s headquarters first on Momokubariyama.
      - Fighting began in the morning when the fog lifted, as Ii Naomasa and Fukushima Masanori attacked Ukita’s troops. For several hours the battle was even. Ishida lit the signal fires for Kobayakawa and the Mōri to attack, but Kikkawa Hiroie, who had secretly agreed with Ieyasu to stay out, blocked the road down Mount Nangū, and the Mōri army never moved. Kobayakawa also hesitated, until, according to the traditional account, Ieyasu had his musketeers fire towards Mount Matsuo. Around noon Kobayakawa’s men charged down the hill into Ōtani Yoshitsugu’s flank, and four smaller daimyo placed to watch him, Wakisaka Yasuharu, Kutsuki Mototsuna, Ogawa Suketada and Akaza Naoyasu, turned on Ōtani too. Ōtani’s troops were destroyed and he took his own life.
      - The Western line collapsed from south to north. Konishi, Ukita and Ishida fled into the mountains, and Shima Sakon was killed. Shimazu Yoshihiro, whose men had barely fought, broke out through the middle of the Eastern army towards Ise; his nephew Toyohisa was killed covering the retreat and only some 80 to 200 men reached Satsuma with him, but Ii Naomasa was badly wounded by Shimazu musketeers in the pursuit. By early afternoon the battle was over. Estimates of the Western dead range from about 8,000 to over 30,000; the Eastern losses are put at 4,000 to 10,000.
    facts:
      - [Armies, "about 80,000 on each side (estimates vary)"]
      - [Mōri army on Mount Nangū, "about 25,000, did not fight"]
      - [Kobayakawa Hideaki, "15,600 men, changed sides around noon"]
      - [Western dead, "estimates from about 8,000 to over 30,000"]
