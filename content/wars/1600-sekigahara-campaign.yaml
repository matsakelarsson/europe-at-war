  - title: The West rises
    date: August – September 1600
    when: "1600-08-25"
    borders: "1600-09-01"
    countries: [jp]
    body:
      - In late August 1600 Ishida Mitsunari, with the commissioners Mashita Nagamori and Nagatsuka Masaie and his friend Ōtani Yoshitsugu, published a list of thirteen charges against Ieyasu and called the daimyo to arms in Hideyori’s name. Mōri Terumoto, the greatest lord of the west, came to Osaka Castle as commander-in-chief, and Ukita Hideie, Kobayakawa Hideaki, Shimazu Yoshihiro, Konishi Yukinaga, Chōsokabe Morichika and many others joined. Ishida tried to take the wives and children of Ieyasu’s allies in Osaka as hostages; the wife of Hosokawa Tadaoki, Gracia, a Christian, had herself killed rather than be taken, and the plan was dropped.
      - The Western army besieged Fushimi from 27 August. Torii Mototada and about 2,000 men held out for about ten days; the castle fell on 8 September (some accounts say the 6th), and Torii and nearly all his men died. Western forces also besieged Tanabe Castle in Tango, held by the old poet-general Hosokawa Fujitaka, and Anōtsu Castle in Ise, which surrendered at the end of September. In Kaga, Maeda Toshinaga, who had sided with Ieyasu, took the Western stronghold of Daishōji in early September.
      - Ieyasu learned of the rising at Oyama in Shimotsuke, where, according to the traditional account, he held a council with the daimyo marching with him in early September and they agreed to turn west against Ishida. He sent most of them ahead along the Tōkaidō under Fukushima Masanori and Ikeda Terumasa to gather at Fukushima’s castle of Kiyosu in Owari, ordered his son Hidetada to march west along the Nakasendō with some 36,000 to 38,000 men, and left his second son Yūki Hideyasu and the Date and Mogami to watch the Uesugi.
    facts:
