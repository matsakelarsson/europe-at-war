  - title: The new order
    date: November 1600 – March 1603
    when: "1600-11-06"
    borders: "1603-03-24"
    countries: [jp]
    body:
      - Ishida Mitsunari, Konishi Yukinaga and Ankokuji Ekei were caught in the mountains, paraded through Osaka and Sakai and beheaded at the Rokujō riverbank in Kyoto on 6 November 1600. Mōri Terumoto left Osaka Castle without a fight, trusting Kikkawa Hiroie’s promise that the Mōri lands would be spared; instead Ieyasu took away six of the Mōri’s eight provinces, leaving them Suō and Nagato. Ukita Hideie fled to Satsuma and was later exiled to the island of Hachijō, the Chōsokabe lost Tosa, and some 90 daimyo lost or had their domains reduced, while Ieyasu’s allies and his own vassals received the confiscated lands.
      - Toyotomi Hideyori kept Osaka Castle but was reduced to a domain of about 650,000 koku around Osaka. On 24 March 1603 the emperor appointed Ieyasu shogun, and the Tokugawa shogunate was founded at Edo; in 1605 Ieyasu passed the title to his son Hidetada to show that it would remain in his family. The settlement after Sekigahara, which divided the daimyo into Tokugawa vassals (fudai) and “outside lords” (tozama), lasted until the 19th century, when the descendants of the defeated Mōri and Shimazu led the overthrow of the shogunate.
    facts:
      - [Execution of Ishida Mitsunari, "6 November 1600, Kyoto"]
