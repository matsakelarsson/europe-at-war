id: sekigahara-campaign
name: Sekigahara campaign
start: "1600-07"
end: "1600-12"
tier: A
summary: "The war of 1600 in which Tokugawa Ieyasu defeated a coalition of daimyo loyal to the Toyotomi house and made himself master of Japan. When Toyotomi Hideyoshi died in 1598, leaving a five-year-old heir, Hideyori, power passed to a council of five regents, of whom Ieyasu was by far the strongest, and five commissioners led by Ishida Mitsunari. In the summer of 1600 Ieyasu led an army north-east against Uesugi Kagekatsu of Aizu, whom he accused of preparing war. In his absence Ishida raised the western daimyo in Hideyori’s name, with Mōri Terumoto as nominal commander-in-chief in Osaka Castle, and took Fushimi Castle and other strongholds of Ieyasu’s allies around Kyoto. Ieyasu turned back. His allies took Gifu Castle in late September, and on 21 October 1600 the Eastern and Western armies, each of perhaps 80,000 to 90,000 men, met at Sekigahara in Mino, where the defection of Kobayakawa Hideaki decided a battle of a few hours. Ishida, Konishi Yukinaga and Ankokuji Ekei were executed in Kyoto. In the north the Uesugi failed to take Hasedō from the Mogami and withdrew, and in Kyushu Kuroda Josui and Katō Kiyomasa overran the lands of western daimyo. Ieyasu confiscated or reduced the domains of some 90 daimyo, kept Hideyori as a mere great lord in Osaka, and in 1603 was appointed shogun, founding the Tokugawa shogunate that ruled Japan until 1867."
countries: [jp]
sides:
  - id: east
    name: Eastern Army (Tokugawa Ieyasu and his allies)
    polities: [tokugawa-shogunate]
    ink: navy
    moves: Eastern moves
    success: Eastern success
  - id: west
    name: Western Army (Ishida Mitsunari, the Mōri, Uesugi, Shimazu and their allies)
    polities: [western-army-1600, mori-clan, uesugi-clan, shimazu-clan]
    ink: orange
    moves: Western moves
    success: Western success
notes:
  - The Japanese sources date the campaign by the lunar calendar. The Gregorian dates here are those given by the English sources (the battle of Sekigahara, on the 15th day of the 9th month of Keichō 5, was 21 October 1600); some dates of the sieges are approximate, and sources disagree on a few of them by a day or two.
  - The sizes of the armies and the losses at Sekigahara come from later chronicles and are uncertain. Estimates of the Western dead range from about 8,000 to more than 30,000, those of the Eastern dead from about 4,000 to 10,000.
  - The Tokugawa shogunate did not yet exist in 1600; the Eastern side is shown with it because the campaign founded it. Many daimyo changed sides or stayed neutral, and some families, such as the Sanada and the Kuki, had members on both sides.
