  - title: The north, Uesugi against Mogami and Date
    date: September – November 1600
    when: "1600-09"
    borders: "1600-10-21"
    countries: [jp]
    body:
      - In the north-east the Uesugi, though they had provoked the war, did not march south into the Kantō after Ieyasu turned back. Date Masamune, Ieyasu’s ally, took the Uesugi castle of Shiroishi in early September, while Mogami Yoshiaki of Yamagata, the other Eastern lord in the region, waited to be attacked. On 14 October Naoe Kanetsugu set out from Yonezawa with about 20,000 men against Mogami. Hataya Castle fell after fierce fighting, and from about 21 October Naoe besieged Hasedō, a small castle guarding the approach to Yamagata, defended by Shimura Akiyasu with about 1,000 men.
      - Hasedō held. Mogami brought up his army, and Date Masamune sent about 3,000 men under his uncle Rusu Masakage. When news of Sekigahara reached the armies at the beginning of November, Naoe broke off the siege and retreated to Yonezawa, fighting off the pursuing Mogami troops with his musketeers. Fighting between the Date and the Uesugi in Fukushima went on into 1601. Uesugi Kagekatsu submitted to Ieyasu, and in 1601 his domain was cut from 1.2 million koku to the 300,000 koku of Yonezawa.
    facts:
      - [Naoe Kanetsugu marches on Yamagata, "14 October 1600"]
      - [Siege of Hasedō, "about 21 October – early November 1600"]
      - [Uesugi domain reduced, "1.2 million to 300,000 koku (1601)"]
