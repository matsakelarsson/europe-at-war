  - title: Kyushu, Kuroda Josui and Katō Kiyomasa
    date: October – December 1600
    when: "1600-10-19"
    borders: "1600-10-21"
    countries: [jp]
    body:
      - Kuroda Yoshitaka, better known by his Buddhist name Josui, had retired in favour of his son Nagamasa, who marched with Ieyasu. Left at Nakatsu in Buzen, Josui used his treasury to hire an army of some 9,000 rōnin and peasants. Ōtomo Yoshimune, the former lord of Bungo dispossessed by Hideyoshi, landed in Bungo with Mōri support to win back his lands for the West and attacked Kitsuki, the Hosokawa castle. Josui marched to its relief and on 19 October, two days before Sekigahara, defeated Ōtomo at Ishigakibaru near Beppu; Ōtomo surrendered.
      - Katō Kiyomasa of Kumamoto, Ieyasu’s ally, attacked the lands of his rival Konishi Yukinaga, who was with the Western army, and took Uto Castle after Konishi’s execution. Josui swept through northern Kyushu, and with Katō and with Nabeshima Katsushige of Saga, who had changed to the Eastern side after Sekigahara, he forced Tachibana Muneshige to surrender Yanagawa in Chikugo. The allied armies made ready to invade Satsuma, but Ieyasu called off the campaign, and the Shimazu negotiated instead. In 1602 Shimazu Tadatsune went to Ieyasu and the Shimazu kept their whole domain, the only Western daimyo of the first rank to do so.
    facts:
      - [Battle of Ishigakibaru, "19 October 1600"]
      - [Yanagawa surrendered, "late 1600"]
      - [Shimazu make peace with Ieyasu, "1602"]
