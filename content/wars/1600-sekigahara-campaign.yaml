steps:
  - title: After Hideyoshi
    date: September 1598 – August 1600
    when: "1598-09-18"
    borders: "1600-07-01"
    countries: [jp]
    body:
      - Toyotomi Hideyoshi, who had united Japan, died at Fushimi on 18 September 1598, while his armies were still fighting in Korea. His son Hideyori was five. Hideyoshi left the government to a council of five great lords, the regents (tairō), headed by Tokugawa Ieyasu, lord of the eight Kantō provinces from his castle at Edo, and to five commissioners (bugyō), Hideyoshi’s own administrators, among whom Ishida Mitsunari was the most forceful. The armies were brought home from Korea, and the generals who had fought there, such as Katō Kiyomasa and Fukushima Masanori, blamed Ishida for their hardships.
      - Ieyasu broke Hideyoshi’s rules by arranging marriages between his family and other daimyo without the council’s consent. After the death of the respected regent Maeda Toshiie in 1599, seven of the generals tried to kill Ishida. He escaped, and Ieyasu settled the quarrel by sending him into retirement at his castle of Sawayama. Ieyasu moved into Osaka Castle, where Hideyori lived, and ran the government himself.
      - In 1600 Ieyasu accused Uesugi Kagekatsu, the regent who held Aizu with a domain of 1.2 million koku, of building castles and gathering troops. Kagekatsu’s chief retainer Naoe Kanetsugu sent back a defiant reply. Ieyasu called the daimyo to a punitive expedition against Aizu, left Osaka in July with most of his allies and reached Edo in August, leaving Torii Mototada with a small garrison in Fushimi Castle. Whether by agreement or not, his departure gave Ishida the chance he wanted.
    facts:
      - [Death of Hideyoshi, "18 September 1598"]
      - [Ieyasu’s domain, "about 2.5 million koku, the largest in Japan"]
      - [Ieyasu leaves Osaka for Aizu, "July 1600"]
