  - title: Erivan besieged and the Treaty of Serav
    date: 1610–1618
    when: "1616"
    borders: "1618-09-26"
    countries: [ir, am, az, tr]
    body:
      - In 1610 the grand vizier Kuyucu Murad Pasha, who had crushed the Celali revolts, marched on Tabriz, but Abbas avoided battle and the Ottomans withdrew. On 20 November 1612 the two sides made peace through the grand vizier Nasuh Pasha. The Ottomans gave up everything gained in 1590 and returned to the frontier of 1555, and Persia was to send 200 loads of silk every year.
      - Abbas did not send the silk. In 1614–1616 he invaded Kakheti, whose king Teimuraz I had turned against him and fled to the Ottomans; tens of thousands of Georgians were killed or deported to Persia, and the war with the Ottomans resumed. In 1616 the grand vizier Öküz Mehmed Pasha besieged Erivan for 44 days but had to retreat in the autumn rains, and was dismissed. In 1618 the grand vizier Halil Pasha marched towards Ardabil with Crimean Tatar help. The Safavid governor of Tabriz, Qarachaqay Khan, fought the Ottoman and Crimean troops near Serav, and Abbas asked for peace, which was signed there on 26 September 1618. The Treaty of Serav confirmed the frontier of 1612, with small changes, and halved the silk tribute to 100 loads. The peace lasted only until 1623.
    facts:
      - [Treaty of Nasuh Pasha, "20 November 1612"]
      - [Siege of Erivan, "1616, 44 days"]
      - [Treaty of Serav, "26 September 1618"]
