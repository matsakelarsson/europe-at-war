id: ottoman-safavid-war-1603
name: Ottoman–Safavid War (1603–1618)
start: "1603-09-26"
end: "1618-09-26"
tier: B
summary: The war in which Shah Abbas I of Persia, with his reorganised army of slave soldiers, musketeers and artillery, won back the provinces lost to the Ottomans in 1590. While the Ottomans were tied down by their long war with the Habsburgs and the Celali revolts in Anatolia, Abbas took Tabriz in 1603, Erivan in 1604 after a long siege and Shirvan in 1606, and defeated an Ottoman army near Lake Urmia in 1605. The Treaty of Nasuh Pasha (1612) restored the frontier of 1555. Fighting resumed in 1615; the Ottomans failed before Erivan in 1616 and the Treaty of Serav (1618) confirmed the settlement.
countries: [ir, az, am, ge, tr, iq]
sides:
  - id: saf
    name: Safavid Persia
    polities: [persia]
    ink: green
    moves: Safavid moves
    success: Safavid success
  - id: ot
    name: Ottoman Empire
    polities: [ottoman]
    ink: teal
    moves: Ottoman moves
    success: Ottoman success
notes:
  - The date and place of the great Safavid victory of 1605 differ between sources; it is given as 9 September near Lake Urmia, or as the Battle of Sufiyan near Tabriz in November.
  - During the retreat of 1604–1605 Abbas had the country between Kars and the Aras laid waste and deported its people, above all Armenians from Julfa and the Erivan plain, to the interior of Persia. Many died on the way; reliable numbers are not known, and the estimates given in the literature vary by tens of thousands.
