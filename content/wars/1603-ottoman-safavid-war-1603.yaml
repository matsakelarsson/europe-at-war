steps:
  - title: Abbas retakes Tabriz, Erivan and Shirvan
    date: 1603–1607
    when: "1603-10-21"
    borders: "1607"
    countries: [ir, az, am, ge]
    body:
      - By 1603 the Ottomans were fighting the Habsburgs in Hungary, and much of Anatolia was in the hands of rebel Celali bands. Abbas had spent fifteen years building a standing army of Georgian, Armenian and Circassian slave soldiers (ghulams), Persian musketeers and artillerymen. He attacked on 26 September 1603, catching the Ottomans unprepared, first destroying their advance base at Nahavand and then marching on Tabriz, held by the Ottomans since 1585. The city fell on 21 October; its people rose against the Ottoman soldiers and killed many of them.
      - Abbas went on to Nakhchivan, which the Ottomans had abandoned, and on 15 November laid siege to Erivan. The fortress held out through the winter and fell only in June 1604; Tiflis was taken as well, and Kartli and Kakheti became Persian dependencies again. When an Ottoman army under Cığalazade Sinan Pasha approached later that year, Abbas fell back, laying waste to the country behind him and driving its people into Persia. On 9 September 1605 his mainly cavalry army defeated the Ottomans near Lake Urmia, the first Safavid victory over an Ottoman army in a pitched battle; some 20,000 Ottoman soldiers are said to have been killed. Sinan Pasha died during the retreat, and in 1606–1607 the Safavids retook Ganja, Shamakhi and the rest of Shirvan.
    facts:
      - [Tabriz retaken, "21 October 1603"]
      - [Erivan surrenders, "June 1604, after a siege of seven months"]
      - [Victory near Lake Urmia, "9 September 1605"]
