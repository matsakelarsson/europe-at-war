steps:
  - title: Fez against Marrakesh
    date: 1603–1609
    when: "1603-08"
    borders: "1607-01-01"
    countries: [ma]
    body:
      - Ahmad al-Mansur, the victor of Alcácer Quibir and conqueror of Songhai, died of plague on 25 August 1603, during an epidemic that struck much of Morocco. He had named his son Mohammed al-Shaykh al-Ma’mun as heir, but had later imprisoned him for rebellion. Another son, Zidan, was proclaimed in Fez, with the backing of the mufti, while a third, Abu Faris, took Marrakesh. Al-Ma’mun, Abu Faris’s full brother, joined the fight against Zidan, and in 1604 he defeated Zidan and drove him from Fez.
      - For the next five years the two capitals fought each other. Abu Faris held Marrakesh until 1606, when it changed hands several times in a few months; al-Ma’mun’s son Abdallah held it until 1609. After defeats by Zidan, al-Ma’mun asked Tuscany for help and in March 1608 fled to Spain. In 1609 Zidan, with arms bought from the Ottomans, the English and the Dutch, retook Marrakesh, and Abdallah, who had Abu Faris killed, made himself master of Fez as Abdallah al-Ghalib II. From then on two Saadian sultans ruled Morocco, one from Marrakesh and the south, the other from Fez and the north, while governors and tribes in between obeyed whoever was strongest.
    facts:
      - [Death of Ahmad al-Mansur, "25 August 1603"]
      - [Al-Ma’mun defeats Zidan, "1604"]
      - [Zidan retakes Marrakesh, "1609"]
