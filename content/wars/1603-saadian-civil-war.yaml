  - title: Al-Ayyashi, Salé and reunification
    date: 1614–1627
    when: "1614"
    borders: "1627-09-30"
    countries: [ma, es, pt]
    body:
      - Zidan made Muhammad al-Ayyashi, a marabout, governor of Azemmour, close to Portuguese Mazagan. Angered by the sultans’ failure to defend the country, al-Ayyashi waged his own war on the Spanish garrisons of La Mamora and Larache and on the Portuguese, with support from the Moriscos and the English, and his power came to reach as far as Taza. The Moriscos expelled from Spain in 1609–1614 had settled at Salé and Rabat, at the mouth of the Bou Regreg, where they built a corsair republic that answered to no sultan. In April 1627 al-Ayyashi broke openly with Zidan and took Salé, and the English and the Dutch treated with him as an independent ruler.
      - In the far south Abu Hassun al-Simlali made himself master of the Sous from Iligh in 1614, and in the Middle Atlas the Sufi lodge of Dila was growing into a power of its own. Zidan died in September 1627, and his nephew Abd al-Malik al-Mu’tasim, who had ruled Fez since 1623, died the same year; Zidan’s son Abu Marwan Abd al-Malik II reunited the two states, but regional powers soon challenged him. The Dila’iyya defeated al-Ayyashi, who was killed in 1641, took Fez and Salé the same year, and the last Saadian sultan was murdered in 1659.
    facts:
      - [Al-Ayyashi takes Salé, "April 1627"]
      - [Death of Zidan, "September 1627"]
      - [Reunification under Abd al-Malik II, "1627"]
    markers:
