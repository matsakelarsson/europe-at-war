id: saadian-civil-war
name: Saadian succession war
start: "1603-08-25"
end: "1627"
tier: B
summary: "The war among the sons of Ahmad al-Mansur that split Saadian Morocco for a quarter of a century. When al-Mansur died of plague in August 1603, his sons Zidan, Abu Faris and Mohammed al-Shaykh al-Ma’mun fought over the throne, and the realm divided between a sultanate ruled from Marrakesh and one ruled from Fez. Marrakesh changed hands again and again; al-Ma’mun fled to Spain in 1608 and in 1610 handed over the port of Larache in return for Spanish help, a cession that cost him and the dynasty much of their standing. A scholar who proclaimed himself the Mahdi, Ahmad ibn Abi Mahalli, drove Zidan out of Marrakesh in 1612–1613; Spain took al-Ma’mura (Mehdya) in 1614; Moriscos expelled from Spain built a corsair state at Salé; and religious war leaders such as Muhammad al-Ayyashi fought the Spanish and Portuguese garrisons and defied the sultans. Plague added to the toll. The two Saadian states were reunited in 1627 under Zidan’s son Abd al-Malik II, but the dynasty never recovered its authority, and the zawiya of Dila and the Alaouites of Tafilalt divided the country after it."
