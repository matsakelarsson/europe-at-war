  - title: Larache, the Mahdi and Mamora
    date: 1610–1614
    when: "1610"
    borders: "1614-08-31"
    countries: [ma, es]
    body:
      - In 1610 al-Ma’mun bought Spanish support with the port of Larache, at the mouth of the Loukkos, which Spain had long coveted. Spanish troops took possession in November 1610 and al-Ma’mun came back with them, but the surrender of a Muslim town to Christians outraged many Moroccans and fed the uprisings that followed. Al-Ma’mun was assassinated in 1613, and his son Abdallah went on ruling Fez.
      - In the south, Ahmad ibn Abi Mahalli, a Sufi scholar of Sijilmasa who argued that the Saadians had lost their right to rule by failing to protect Muslims from the Christians, proclaimed himself the Mahdi, took Tafilalt and the Draa and in 1612 entered Marrakesh. Zidan fled to Safi; the ship he had hired to carry his household to Agadir sailed off with it and was seized by Spanish ships, and his library of about 4,000 manuscripts ended up in the Escorial, where part of it survives. Zidan called on Yahya ibn Abdallah al-Hahi, a marabout of the Haha country, whose army reached Marrakesh in October 1613; Ibn Abi Mahalli rode out against it and was shot dead, and Zidan returned to his capital. In 1614 a Spanish fleet took al-Ma’mura, the corsair harbour at the mouth of the Sebou, which Spain held as La Mamora.
    facts:
      - [Larache handed to Spain, "November 1610"]
      - [Ibn Abi Mahalli in Marrakesh, "1612–1613"]
      - [Spain takes al-Ma’mura (Mehdya), "1614"]
