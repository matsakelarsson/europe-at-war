notes:
  - The sources, mainly Moroccan chronicles such as al-Ifrani’s and the reports of European envoys and captives, disagree on many dates and on how often Marrakesh and Fez changed hands; the dates here are approximate, and the areas drawn for the two Saadian states are rough.
  - Zidan, whom the mufti of Fez recognised as heir, counts as sultan of Morocco for 1603–1627 in most lists; his brothers and nephews ruled from Fez in rivalry with him.
