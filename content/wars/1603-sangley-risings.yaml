notes:
  - "Sangley (Sangley, Sangleyes) was the Spanish name for the Chinese of the Philippines, probably from a Hokkien word for trade or traders. Christian Chinese, many married to Filipino women, were often treated differently from the non-Christian Chinese, and their mestizo descendants became a class of their own."
  - The numbers of dead come from Spanish accounts and differ between them; none were counted. The war of 1662 is told in the Spanish–Moro conflict for its effect on Zamboanga, and the British occupation of Manila for the Chinese of Pampanga in 1762.
