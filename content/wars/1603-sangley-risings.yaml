id: sangley-risings
name: Chinese risings in Manila (Sangley risings)
start: "1603-10-03"
end: "1662-06"
tier: C
summary: "Risings of the Chinese of Spanish Manila, whom the Spanish called Sangleys, and the massacres that ended them. The Chinese traders and craftsmen who came with the junks from Fujian far outnumbered the Spanish in and around Manila, lived under fees, curfews and limits on their numbers, and were confined to their own quarter, the Parián, outside the walls. In March 1603 a Ming mission came to look for a “mountain of gold” said to be at Cavite; the Spanish took it for a scouting party for an invasion, and the Chinese of Manila were threatened by Spaniards, Tagalogs and Japanese alike. On 3 October 1603 they rose. They beat back an attack led by Luis Pérez Dasmariñas, who was killed with his men, but their assault on the walls on 6 October was stopped by artillery, and in the following weeks Spanish soldiers, Japanese residents of Dilao and Tagalog auxiliaries hunted them down. Estimates of the Chinese dead range from 15,000 to 25,000; about 128 of the Spanish side died. Trade with Fujian soon resumed and the Chinese community grew again. On 20 November 1639 Chinese labourers who had been settled by force on the crown estate at Calamba, in Laguna, and made to pay heavy rents rose in their turn; they took the church of San Pedro Macati, held the north bank of the Pasig for a week, and on 5 December Governor Sebastián Hurtado de Corcuera ordered every Chinese found to be killed. The last 6,000 to 7,000 surrendered on the shore of Laguna de Bay on 15 March 1640; estimates of the dead range from 17,000 to 24,000. In 1662 Zheng Chenggong (Koxinga), who had just taken Taiwan from the Dutch, sent the Dominican Vittorio Riccio to demand tribute from Manila. The Spanish withdrew their garrisons from Zamboanga and the Moluccas to defend the city, a clash in the Chinese quarter on 24 May led to the expulsion of the non-Christian Chinese, and on 4 June the governor ordered the killing of those who had not reported; many who fled to the hills died of hunger. Koxinga died in Taiwan on 23 June 1662 before any attack was made. Killings of Chinese followed again in 1762–1763, when Simón de Anda ordered the execution of Chinese who had sided with the British during their occupation of Manila."
countries: [ph, cn]
