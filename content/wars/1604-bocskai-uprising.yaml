steps:
  - title: The hajdús rise
    date: 1604–1606
    when: "1604-10"
    borders: "1606-06-23"
    countries: [hu, sk, ro, at, cz, tr]
    body:
      - By 1604 the long war had ruined much of Hungary, and Rudolf II’s government was using treason trials to seize the estates of rich nobles, while in Upper Hungary churches were taken from the Protestants; in January 1604 the cathedral of Kassa was handed to the Catholics. In the autumn the imperial commander Giovanni Giacomo Barbiano di Belgioioso moved against István Bocskai, a magnate and former Transylvanian commander whose letters to exiles in Ottoman territory had been intercepted. Bocskai won over the hajdús, cattle drovers turned frontier soldiers, and on the night of 14–15 October they routed an imperial force near Álmosd and Diószeg. In November Kassa opened its gates to him.
      - Giorgio Basta, brought back from the Ottoman front, beat the rebels at Osgyán but could not take Kassa, and in the spring of 1605 he withdrew to Pozsony. Bocskai’s forces overran Upper Hungary and the lands east of the Tisza, and hajdú raiders plundered Moravia, Lower Austria and Styria. The Transylvanian estates elected him prince in February 1605, and the Hungarian diet at Szerencs made him prince of Hungary in April. In November the grand vizier Lala Mehmed Pasha gave him a crown, which he accepted only as a gift. He chose to negotiate, and on 23 June 1606 the Peace of Vienna restored the Hungarian estates’ rights, allowed Protestants to worship freely and left Transylvania and several eastern counties to Bocskai.
    facts:
      - [Battle of Álmosd, "14–15 October 1604, hajdú victory"]
      - [Bocskai elected prince of Hungary, "Szerencs, April 1605"]
