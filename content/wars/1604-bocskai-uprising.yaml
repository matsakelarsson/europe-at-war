id: bocskai-uprising
name: Bocskai Uprising
start: "1604-10"
end: "1606-06-23"
tier: B
summary: A revolt in Royal Hungary and Transylvania against Emperor Rudolf II, led by the Calvinist magnate István Bocskai during the Long Turkish War. Provoked by treason trials, confiscations and the seizure of Protestant churches, it was carried by the hajdús, free soldiers of the frontier, and backed by the Ottomans. Bocskai was elected prince of Transylvania and of Hungary, and the Peace of Vienna of 1606 guaranteed the estates’ rights and freedom of worship.
