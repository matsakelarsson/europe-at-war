notes:
  - Dates are Gregorian. Hungarian historians call the revolt Bocskai’s War of Independence. The Long Turkish War, of which it was part, has its own entry.
  - Bocskai died in Kassa on 29 December 1606, a few weeks after the Peace of Zsitvatorok ended the Long Turkish War. His followers suspected poison and killed his chancellor, Mihály Káthay. Shortly before his death he settled thousands of hajdús as a privileged free community in the Hajdúság region.
