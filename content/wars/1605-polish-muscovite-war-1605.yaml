notes:
  - Russia used the Julian calendar, ten days behind the Gregorian calendar used in Poland–Lithuania. Dates are New Style unless marked; Russian accounts of the same events are often ten days earlier.
  - Polish historians often treat the pretenders’ campaigns of 1604–1609 (the “Dymitriads”) as separate from the royal war of 1609–1618.
