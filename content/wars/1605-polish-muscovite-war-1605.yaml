        via: [[33.87, 51.34], [37.61, 52.42], [38.5, 52.62], [37.7, 55.6]]
    areas:
      - style: gained
        side: pl
        label: Gained by Poland–Lithuania
        atoms: [RU-SMO, UA-74]
