id: polish-muscovite-war-1605
name: Polish–Muscovite War, 1605–1618
start: "1605"
end: "1618"
tier: A
summary: During Russia’s Time of Troubles, Polish and Lithuanian backers of two pretenders, and then King Sigismund III himself, intervened in Muscovy. They won at Klushino and held the Moscow Kremlin for two years before being driven out, and the Truce of Deulino in 1618 left Smolensk and the Chernihiv–Seversk lands with the Commonwealth.
