id: bolotnikov-rebellion
name: Bolotnikov rebellion
start: "1606"
end: "1607"
tier: C
summary: A rising in Russia’s Time of Troubles, led by Ivan Bolotnikov, a former slave and galley oarsman, in the name of the supposedly surviving Tsar Dmitry and against Tsar Vasily Shuisky. His army of Cossacks, runaway peasants, townsmen and provincial gentry marched from Putyvl and besieged Moscow in late 1606, but fell back after the gentry of Ryazan and Tula went over to the tsar, and surrendered at Tula in October 1607.
countries: [ru, ua]
