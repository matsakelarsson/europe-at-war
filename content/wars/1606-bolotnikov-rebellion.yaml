    name: Tsar Vasily Shuisky
    polities: [russia]
    ink: green
    moves: Tsarist moves
    success: Tsarist success
  - id: reb
    name: Bolotnikov’s rebels
    polities: []
    ink: red
    moves: Rebel moves
    success: Rebel success
notes:
  - Dates are Julian (Old Style). Putyvl, where the rising began, is in Ukraine today.
  - The rebels claimed to fight for Tsar Dmitry, said to have escaped when the first False Dmitry was killed in Moscow in May 1606. A second pretender, the self-styled Tsarevich Peter, joined them at Tula in 1607. Bolotnikov was later blinded and drowned at Kargopol.
