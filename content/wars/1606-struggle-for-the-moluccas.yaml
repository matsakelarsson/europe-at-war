notes:
  - Spain and Portugal had the same king from 1580 to 1640, and the Spanish expedition of 1606 was sent from Manila to recover the Portuguese position in the Moluccas. Spanish sources call the fort on Ternate Nuestra Señora del Rosario; it stood at Gamalama, the Portuguese town on the south-west coast, near today’s Kastela.
  - The sultans of Ternate and Tidore changed sides and made separate peaces more than once; the alignment given in the sides is the usual one for most of the period.
