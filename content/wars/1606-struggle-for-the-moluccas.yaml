id: struggle-for-the-moluccas
name: Spanish and Dutch in the Moluccas
start: "1606"
end: "1663"
tier: C
summary: "Half a century of war between Spain and the Dutch East India Company (VOC) over the clove islands of the northern Moluccas, fought alongside the old rivalry of the sultanates of Ternate and Tidore. In 1605 a VOC fleet under Steven van der Hagen took the Portuguese forts on Ambon and Tidore; Portugal then shared its king with Spain, and the governor of the Philippines, Pedro Bravo de Acuña, answered with an expedition from Manila that stormed Ternate on 1 April 1606 and carried Sultan Said and many nobles off to Manila, where Said died in exile. In May 1607 Cornelis Matelief de Jonge and Ternatean leaders who had fled to Halmahera built Fort Oranje at Malayu on the east coast of Ternate, and from then on the island was divided: the Spanish held the old Portuguese town of Gamalama in the south-west and allied with Tidore, while the VOC backed Ternate’s new sultans, who granted it the clove trade. Forts on Ternate, Tidore, Makian, Moti, Bacan and the coasts of Halmahera changed hands in raids and sieges, the Twelve Years’ Truce of 1609 did not stop the fighting in Asia, and Dutch fleets tried repeatedly to cut the Spanish supply route from Manila. The Peace of Münster in 1648 left both sides where they were. In 1662, when Zheng Chenggong (Koxinga), who had just taken Taiwan, demanded tribute from Manila, the governor of the Philippines called in his outlying garrisons to defend the city, and in 1663 the Spanish left Ternate and Tidore; a small post on Siau held out until the VOC took it in 1677. The war left the VOC the dominant power in the northern Moluccas."
