id: russian-conquest-of-eastern-siberia
name: Russian conquest of eastern Siberia
start: "1607"
end: "1689-08-27"
tier: B
summary: "The advance of Russian Cossacks and fur traders from the Ob to the Pacific in the 17th century, and the resistance of the peoples of eastern Siberia. Small parties of servicemen built forts (ostrogs) along the rivers, from Turukhansk (1607) and Yeniseysk (1619) to Krasnoyarsk (1628), Bratsk (1631), Yakutsk (1632), Okhotsk (1647) and Irkutsk (1661), and forced the Kets, Evenks, Yakuts (Sakha), Buryats, Yukaghirs and others to pay a tribute in furs (yasak), taking hostages to make sure it was paid. The Yakuts rose in 1634 and 1642, the Evens burned Okhotsk in 1653, the Buryats fought the Russians for decades and some of their clans fled to Mongolia, and on the upper Yenisei the Kyrgyz princes and the Dzungars, who claimed the same tribute, attacked Krasnoyarsk. Epidemics of smallpox killed far more people than the fighting. By the Treaty of Nerchinsk with the Qing in 1689, Russia kept the lands around Lake Baikal and east to the Pacific north of the Amur basin."
countries: [ru, mn]
