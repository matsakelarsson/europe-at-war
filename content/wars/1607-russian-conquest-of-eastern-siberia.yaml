notes:
  - This was not one war but a long series of expeditions, raids and risings, most of them known only from the Russian servicemen’s own reports and petitions. The Siberian peoples had no single leadership, and many clans also fought each other and used the Russians against their rivals.
  - The Amur valley, where the Cossacks clashed with the Qing from 1652, is told in the entry on the Sino-Russian border conflicts; the Chukchi and Kamchatka have their own entries.
  - Historians estimate that the whole native population of Siberia was no more than about 300,000 in the 17th century. Smallpox reached western Siberia in 1630 and in the 1650s killed up to 80% of the Evenks and Yakuts east of the Yenisei in some areas.
