steps:
  - title: The Yenisei and the Kyrgyz
    date: 1607–1667
    when: "1628"
    borders: "1640-01-01"
    countries: [ru]
    body:
      - From the Ob, Russian servicemen crossed by portage to the Yenisei, founding Turukhansk near its lower course in 1607 and Yeniseysk in 1619. The Kets and the Evenks (Tungus) of the taiga were made to pay yasak in sable furs, and the Russians held members of leading families as hostages (amanats) in the forts. Some groups paid and traded; others killed tribute collectors and moved away. Up the Angara, the Cossacks reached the lands of the Buryats, who drove them back more than once; the fort of Bratsk, built in 1631, was burned three times and rebuilt each time.
      - On the upper Yenisei the Russians met the Kyrgyz principalities of the Minusinsk basin, whose princes, themselves vassals of the Mongol Altan Khans and later the Dzungars, collected tribute from the same forest peoples. Krasnoyarsk was founded on 19 August 1628 as a frontier fort against them, and Kyrgyz horsemen raided its villages for the rest of the century. In 1665–1667 the Dzungar ruler Sengge, with Kyrgyz support, defeated a Russian force, blockaded Krasnoyarsk and forced the Russians to recognise his claim to the Kyrgyz tribute. Only in the early 18th century, after the Dzungars moved many of the Kyrgyz south into their own lands, did Russian settlers take over the Minusinsk basin.
    facts:
      - [Turukhansk founded, "1607"]
      - [Yeniseysk founded, "1619"]
      - [Krasnoyarsk founded, "19 August 1628"]
      - [Dzungar blockade of Krasnoyarsk, "1667"]
