  - title: Baikal and the Buryats
    date: 1641–1689
    when: "1658"
    borders: "1689-08-27"
    countries: [ru, mn]
    body:
      - The Buryats, Mongol-speaking herders around Lake Baikal, were numerous (estimates range from about 28,000 to 60,000 in the mid-17th century) and many of their clans paid tribute to the Khalkha khans of Mongolia. Cossack parties reached Lake Baikal in 1643, fought the Buryats of the Angara steppe in 1644–1645, and in 1647 Ivan Pokhabov crossed the frozen lake to the Selenga. Russian sources themselves describe the seizure of Buryat women and children and of hostages. In 1658, under Pokhabov’s rule, the Buryats of the Balagansk fort killed the tribute collectors and fled south to Mongolia. In 1661 a fort was built on the Angara at the mouth of the Irkut, the start of Irkutsk.
      - East of the lake the Russians built Nerchinsk in the 1650s and Selenginsk and Udinsk in 1665–1666, which brought them into conflict with the Khalkha Mongols, who claimed the Buryats as their subjects. In 1688 the Khalkha besieged Selenginsk, where the Russian envoy Fyodor Golovin was waiting to negotiate with the Qing, for two months, and withdrew only when Galdan’s Dzungars invaded their homeland. The Treaty of Nerchinsk, signed by Golovin and the Qing envoys on 27 August 1689, gave up the Amur valley but left Russia the lands around Lake Baikal; the border with Mongolia was fixed only by the Treaty of Kyakhta in 1727, which separated the Buryats from the Mongols.
    facts:
      - [Cossacks reach Lake Baikal, "1643"]
      - [Buryat rising at Balagansk, "1658"]
      - [Irkutsk founded, "1661"]
      - [Treaty of Nerchinsk, "27 August 1689"]
