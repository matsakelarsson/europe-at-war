  - title: The Lena and the Yakuts
    date: 1623–1653
    when: "1642-03"
    borders: "1642-03-01"
    countries: [ru]
    body:
      - Russian trappers reached the Lena in the 1620s, and in 1632 a party from Yeniseysk under Pyotr Beketov built the Lensky fort among the Yakuts (Sakha), a Turkic people of horse and cattle breeders on the middle Lena. Rival bands of Cossacks from Yeniseysk and Mangazeya competed for their tribute, and in 1634 the Yakuts destroyed one detachment and besieged the fort. In 1641 the first voivode, Pyotr Golovin, arrived with 395 Cossacks. His heavy tribute demands and a census of the Yakuts’ herds set off a general rising in February 1642, and in March more than 700 Yakuts besieged the fort, then withdrew when their leaders disagreed. In April and May Golovin’s men hanged 23 men after torture, killed many clan leaders and burned Yakut strongholds with the people inside. In 1643 the fort was moved to the Tuymaada valley, where Yakutsk stands today; an inquiry later sent Golovin back to Moscow under guard.
      - From the Lena the Cossacks went on to the Pacific. Ivan Moskvitin reached the Sea of Okhotsk in 1639, and in 1647 Semyon Shelkovnikov built winter quarters at Okhotsk, which local Evens (Lamuts) burned in 1653. Mikhail Stadukhin reached the Kolyma in 1643, and in 1648 Semyon Dezhnev sailed from the Kolyma round the eastern tip of Asia to the Anadyr. Everywhere the pattern was the same, forts, hostages and fur tribute, and in the 1650s smallpox swept through the Yakut and Evenk camps.
    facts:
      - [Lensky fort founded, "1632"]
      - [Yakut rising, "February–May 1642"]
      - [Okhotsk founded, "1647; burned by the Evens in 1653"]
