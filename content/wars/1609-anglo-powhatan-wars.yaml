  - title: Opechancanough’s last war and the treaty of 1646
    date: April 1644 – October 1646
    when: "1644-04"
    borders: "1646-10-01"
    countries: [us]
    body:
      - On 18 April 1644 Opechancanough, by then very old and carried on a litter, launched a second great assault with Pamunkey, Chickahominy, Weyanoke, some of the Nansemond and possibly others. About four hundred colonists were killed, more than in 1622, but the colony now numbered some 8,000 people and the loss was less than a tenth of them. As in 1622, the warriors withdrew rather than follow up the attack.
      - Governor Sir William Berkeley’s militia struck back at the Powhatan towns. In 1645–1646 the colony built frontier forts at the falls of the James (Fort Charles), on the Chickahominy (Fort James), on the Pamunkey (Fort Royal) and at the falls of the Appomattox (Fort Henry, at Petersburg). In 1646 Berkeley led an expedition far up the Pamunkey and captured Opechancanough at his fort. He was taken to Jamestown, where people came to stare at him in his cell, and within two weeks one of his guards shot him.
      - In October 1646 his successor Necotowance made peace with the General Assembly. The Powhatan nations became tributaries of the king, owing twenty beaver skins a year to the governor, and gave up the land between the York and the Blackwater rivers below the falls; north of the York they kept their land, and neither people could cross the line except at the frontier forts and, for the Powhatan, with a badge or pass. The paramount chiefdom broke up, and Necotowance’s successors were chiefs of the Pamunkey. English settlement soon crossed the line, and the next war, after Bacon’s Rebellion, ended with the Treaty of Middle Plantation in 1677, which set aside reservations.
    facts:
      - [Assault of 1644, "18 April 1644, about 400 colonists killed"]
      - [Opechancanough captured, "1646; shot in captivity at Jamestown"]
      - [Treaty with Necotowance, "October 1646"]
