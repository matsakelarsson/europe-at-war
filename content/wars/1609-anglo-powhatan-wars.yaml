  - title: Pocahontas and the peace of 1614
    date: April 1613 – 1618
    when: "1613-04"
    borders: "1614-04-01"
    countries: [us]
    body:
      - In April 1613 Captain Samuel Argall, trading on the Potomac, learned that Pocahontas was staying at Passapatanzy, a town of the Patawomeck. With threats and promises he persuaded its chief Iopassus to help him lure her aboard his ship, and carried her to Jamestown as a hostage for the return of English prisoners, guns and tools. Powhatan sent back part of what was asked and then stalled for a year, while Pocahontas was taught English and baptised as Rebecca.
      - In March 1614 Dale and Argall sailed up the Pamunkey with about 150 soldiers and Pocahontas. Showered with arrows at the meeting of the rivers at what is now West Point, they landed and burned a town, then found Powhatan’s new seat at Matchcot. There, by the English account, Opechancanough, who now held “command of all the people”, negotiated the end of the war. In April 1614 Pocahontas married the colonist John Rolfe, and the Chickahominy made a separate treaty that made them subjects of King James. The years that followed are called the Peace of Pocahontas.
      - Rolfe had begun to grow a sweet West Indian tobacco, and its sale in London made Virginia’s fortune. Plantations spread along the James on Powhatan land, and from 1618 the headright system gave fifty acres for every person brought to the colony; the first enslaved Africans were landed in 1619. Pocahontas went to England with Rolfe and died at Gravesend in March 1617. Powhatan died in April 1618; his brother Opitchapam succeeded him, but Opechancanough held the real power.
    facts:
      - [Pocahontas captured, "April 1613"]
      - [Marriage to John Rolfe, "April 1614"]
      - [Death of Powhatan, "April 1618"]
