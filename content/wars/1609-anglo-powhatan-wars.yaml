steps:
  - title: Tsenacomoco and James Fort
    date: May 1607 – summer 1609
    when: "1607-05"
    borders: "1607-06-01"
    countries: [us]
    body:
      - When about a hundred English colonists of the Virginia Company built a fort on Jamestown Island in May 1607, they settled inside Tsenacomoco, a paramount chiefdom of twenty-eight to thirty-two Algonquian-speaking nations and petty chiefdoms between the falls of the rivers and the sea, from south of the James to beyond the Rappahannock. Its paramount chief (mamanatowick) Wahunsenacawh, whom the English called Powhatan after his home town, had built it up by inheritance and conquest and ruled from Werowocomoco on the York River. The Chickahominy in its heart kept their independence, and the Patawomeck on the Potomac paid tribute but went their own way. Its enemies were the Siouan-speaking Monacan beyond the falls.
      - Powhatan first tested the newcomers. Warriors attacked the fort within weeks of the landing, and in December 1607 a hunting party led by his brother Opechancanough captured John Smith and brought him to Werowocomoco. The story that Pocahontas, Powhatan’s young daughter, saved Smith’s life comes from Smith’s own later writings; many scholars now read the scene as an adoption ritual by which Powhatan meant to make the English a subject people. In 1608 Smith and Christopher Newport in turn crowned Powhatan as a vassal of King James I.
      - The colonists arrived at the start of the worst drought in the region in some 770 years (1606–1612). Unable to feed themselves, they lived on corn traded, demanded or taken from the Powhatan towns, and Smith’s forays for food made enemies. In 1609 Powhatan moved his capital west from Werowocomoco to Orapax, farther from English ships.
    facts:
      - [James Fort founded, "May 1607, about 100 colonists"]
      - [Tsenacomoco, "28–32 nations and petty chiefdoms"]
      - [John Smith captured, "December 1607"]
