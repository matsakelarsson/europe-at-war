  - title: The siege of Jamestown and the Starving Time
    date: August 1609 – June 1610
    when: "1609-08"
    borders: "1609-11-01"
    countries: [us]
    body:
      - In the summer of 1609 a new fleet brought hundreds of colonists but no leaders, since the flagship Sea Venture had been wrecked on Bermuda. Smith sent men to live off the land. Downriver, George Percy and John Martin attacked the Nansemond, burned their houses and robbed the tombs of their chiefs; half their hundred men were killed in the fighting that followed. Upriver, Francis West tried to take the town of Powhatan at the falls from Parahunt and lost half of his 120 men. Encyclopedia Virginia dates the outbreak of war from these fights.
      - Smith left for England in October 1609. In November John Ratcliffe and about fifty men went to Orapax to trade for corn and were ambushed; about thirty-three were killed and Ratcliffe was tortured to death. Powhatan’s warriors then closed the woods and the river around James Fort. Through the winter of 1609–1610, the Starving Time, the colonists ate their horses, dogs, rats and, by some accounts, the dead; of some 240 people in the fort, about sixty were alive in May 1610.
      - On 24 May the Sea Venture’s survivors arrived from Bermuda in two small ships they had built, and Thomas Gates decided to abandon Virginia. On 8 June, as the colonists sailed down the James, they met the new governor, Thomas West, Lord De La Warr, with three ships, supplies and some 150 soldiers, and turned back.
    facts:
      - [Ratcliffe’s party ambushed, "November 1609, about 33 killed"]
      - [Colonists alive in May 1610, "about 60 of some 240"]
      - [Lord De La Warr arrives, "June 1610"]
