  - title: The second war and the palisade
    date: 1622–1632
    when: "1622-06"
    borders: "1632-09-30"
    countries: [us]
    body:
      - The English answered with summer campaigns against the crops on which the Powhatan towns lived, marching out nearly every year to burn the corn of the Chickahominy, Nansemond, Warraskoyack, Weyanoke and Pamunkey, while the Accomac and Patawomeck sold them corn. In May 1623 Opitchapam invited the English to talks to ransom the captive women; Captain William Tucker’s party served the Powhatan leaders wine that the colony’s doctor had poisoned and then opened fire. An English report claimed about two hundred dead; Opechancanough was badly hurt but escaped.
      - In 1624, the year the Crown took over Virginia from the bankrupt Virginia Company, Governor Francis Wyatt with about sixty men fought some eight hundred Pamunkey bowmen for two days in their own fields, until the Pamunkey withdrew and their corn was cut down. A shortage of gunpowder stopped the English in 1625–1626, and the raids resumed in 1627. A truce in 1628 broke down, and a final peace was made in 1632, when Opechancanough had succeeded Opitchapam as paramount chief.
      - By 1634 the colonists had built a palisade about six miles long across the peninsula between the James and the York at Middle Plantation (Williamsburg), and their farms spread to the south bank of the James, the Eastern Shore and the York. Tobacco planters took up ever more land, and by the early 1640s they were claiming land on the Rappahannock and Potomac.
    facts:
      - [Poisoned peace talks, "May 1623"]
      - [Battle of Pamunkey, "1624, about 60 English against about 800 Pamunkey"]
      - [Virginia a royal colony, "1624"]
      - [Peace, "1632"]
