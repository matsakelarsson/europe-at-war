id: anglo-powhatan-wars
name: Anglo-Powhatan Wars
start: "1609"
end: "1646-10"
tier: A
summary: "Three wars between the English colony of Virginia and Tsenacomoco, the paramount chiefdom of some thirty Algonquian-speaking nations of the Virginia coastal plain ruled by Powhatan (Wahunsenacawh) and later by his brother Opechancanough. In the first (1609–1614), Powhatan cut off the starving colony at Jamestown, and the English, reinforced in 1610, burned towns along the James River, killed women and children and took Pocahontas hostage; it ended with her marriage to John Rolfe. As tobacco planting spread up the rivers, Opechancanough’s warriors struck the English settlements on 22 March 1622 and killed 347 colonists, opening a second war (1622–1632) in which the English destroyed Powhatan crops year after year. His last attack, on 18 April 1644, killed about 400 colonists, but the colony now numbered some 8,000. Opechancanough was captured in 1646 and shot by a guard at Jamestown, and by the treaty of October 1646 his successor Necotowance made the Powhatan nations tributaries of the English crown and gave up the land between the York and the Blackwater rivers. Several tribes descended from the nations of Tsenacomoco are recognised by Virginia today, among them the Pamunkey and Mattaponi, who still hold reservations set aside in the 1600s."
countries: [us]
sides:
  - id: pw
    name: Powhatan paramount chiefdom (Tsenacomoco)
    polities: [powhatan]
    ink: brown
    moves: Powhatan moves
    success: Powhatan success
  - id: va
    name: Colony of Virginia
    polities: [british-america, england]
    ink: red
    moves: English moves
    success: English success
notes:
  - The English used the Julian calendar (Old Style) and began the year on 25 March, so the attack of 22 March 1622 is often written 1621/22. The dates here are Old Style, with the year beginning on 1 January, as in the standard references.
  - The wars are known almost only from English writers (John Smith, George Percy, Ralph Hamor, Edward Waterhouse and the colony’s records), many of whom wrote to justify the colony or themselves; Powhatan aims and numbers come from their reports and from later oral tradition and archaeology. Some historians question whether the years 1609–1614 were one distinct war from the Powhatan point of view, since small-scale fighting and diplomacy ran side by side; the term “Anglo-Powhatan War” was coined by the historian J. Frederick Fausz.
  - The killings of 22 March 1622 and 18 April 1644 are often called the Indian massacres of 1622 and 1644; the English killings of Paspahegh, Kecoughtan and Nansemond townspeople in 1609–1611 and of the guests at the 1623 peace talks are described in the same plain terms here.
  - The base map shows the English colony; the lands of Tsenacomoco are drawn as an area in the steps.
