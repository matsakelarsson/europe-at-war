  - title: De La Warr and Dale on the James
    date: July 1610 – December 1611
    when: "1610-07"
    borders: "1611-12-01"
    countries: [us]
    body:
      - De La Warr came with orders to capture Powhatan, kill his priests and make his chiefs pay their tribute to the English. On 9 July 1610 Gates lured the Kecoughtan out of their town near the mouth of the James with a drummer and attacked them, and the English took their fields. In August, after Paspahegh warriors attacked the blockhouse at Jamestown, Percy led some seventy men against the Paspahegh town, killed fifteen or sixteen people and burned the houses and corn; the soldiers threw the children of the chief Wowinchopunck overboard and shot them in the water, and their mother was put to death. The Warraskoyack and Chickahominy towns were also burned. Encyclopedia Virginia compares these methods to those of the English conquest of Ireland.
      - The Powhatan fought back. In November 1610 the Appamattuck under their female chief Opossunoquonuske beat an English expedition to the falls, which then destroyed their town; Wowinchopunck was killed in a skirmish in February 1611. When De La Warr left in March, several hundred warriors killed the twenty men of the Jamestown blockhouse.
      - Sir Thomas Dale, who arrived as deputy governor in May 1611 and ruled the colony by martial law, burned the Nansemond towns in June. In September he founded Henricus on a bend of the James far upriver, and around Christmas he seized the Appamattuck town at the mouth of their river and fenced off the neck as Bermuda Hundred. Ageing and losing authority to Opechancanough, Powhatan was squeezed between the English on the James and the Monacan beyond the falls.
    facts:
      - [Kecoughtan attacked, "9 July 1610"]
      - [Paspahegh town burned, "August 1610"]
      - [Henricus founded, "September 1611"]
