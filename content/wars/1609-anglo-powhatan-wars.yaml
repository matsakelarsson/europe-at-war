  - title: The assault of 22 March 1622
    date: March 1622
    when: "1622-03"
    borders: "1622-03-22"
    countries: [us]
    body:
      - Opechancanough concluded that small-scale fighting would not stop the English from spreading over his people’s land. He kept up a friendly face, even telling the councillor George Thorpe that he wished to learn about Christianity, while preparing a coordinated blow. In 1621 he asked the Accomac chief on the Eastern Shore for poison to use against the colonists; the Accomac refused and warned the English, who did not take it seriously. Two weeks before the attack colonists killed Nemattanew, a war leader close to Opechancanough.
      - On the morning of 22 March 1622 Powhatan men who had come into English houses and fields as usual, to trade or work, attacked at some thirty settlements along the James from its mouth to Henricus and the ironworks at Falling Creek. The colony counted 347 dead, between a quarter and a third of its English population; at Martin’s Hundred alone 73 were killed, and Thorpe died at Berkeley Hundred. Jamestown and some other places were warned in time, among others by a Powhatan man named Chauco and by a youth living with the planter Richard Pace, who rowed across the river to raise the alarm. About twenty women were taken captive.
      - Opechancanough meant the blow as a warning that would make the English leave or stay within bounds; he told the Patawomeck that within two moons there would not be an Englishman in the country. The colonists instead pulled back into a few defended places, abandoned the outlying plantations, and resolved, in the words of the Virginia Company’s secretary Edward Waterhouse, to take the Powhatan lands “by right of Warre”.
    facts:
      - [Colonists killed, "347 (the colony’s count)"]
      - [Settlements attacked, "about 30"]
      - [Killed at Martin’s Hundred, "73"]
