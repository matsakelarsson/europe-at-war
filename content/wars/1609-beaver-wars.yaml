  - title: Denonville and Lachine
    date: 1684–1689
    when: "1687"
    borders: "1689-08-05"
    countries: [ca, us]
    body:
      - War with New France resumed over the western trade. Governor La Barre led an army against the Seneca in 1684, but it fell sick at La Famine on the shore of Lake Ontario and he had to accept a humiliating peace. His successor, the Marquis de Denonville, gathered some 2,000 regulars and militia and several hundred allied warriors from the upper lakes in 1687. At Fort Frontenac his men seized Haudenosaunee people from nearby villages and men invited to a council; dozens of them were sent to France as galley slaves, of whom only a few came home.
      - In July 1687 Denonville’s army beat off an ambush near Ganondagan, the largest Seneca town, and burned it and three other Seneca towns with their fields and stores of corn. He built a fort at Niagara, which was abandoned the next year. The Seneca, rather than submit, fled to their neighbours, and the Haudenosaunee besieged Fort Frontenac and raided the colony.
      - Before dawn on 5 August 1689, in the rain, about 1,500 Haudenosaunee warriors crossed Lake Saint-Louis and fell on Lachine at the western end of Montreal Island, burning houses and carrying off prisoners. Modern research counts about 24 colonists killed on the spot and more than 70 taken, several of whom were later killed; older accounts gave 200 or more dead. Denonville, with troops in Montreal, did not pursue. Fort Frontenac was abandoned, and Louis XIV sent the old governor Frontenac back to New France. By then England and France were at war, and the Haudenosaunee war merged into King William’s War.
    facts:
      - [La Barre’s expedition, "1684, failed"]
      - [Seneca towns burned by Denonville, "July 1687"]
      - [Attack on Lachine, "5 August 1689"]
