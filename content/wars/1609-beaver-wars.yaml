notes:
  - New France used the Gregorian calendar; dates in New Netherland and English New York were often written in both styles. Dates here are Gregorian (New Style).
  - Much of what is known comes from French sources, above all Champlain’s journals and the yearly Jesuit Relations, written by missionaries to the Wendat and their enemies; Haudenosaunee and Wendat views come through them, through Dutch and English records and through oral tradition. Numbers of warriors, captives and dead are rough. Several village sites, among them the Haudenosaunee town Champlain attacked in 1615, are known only approximately.
  - Historians have explained the wars by competition for furs and trade routes (George T. Hunt), by the “mourning war” in which captives were taken to replace the dead after the epidemics of the 1630s (Daniel Richter), and by the wish to bring other Iroquoian peoples under the Great Law of Peace (Francis Jennings, José António Brandão); most now see these explanations as complementary. Whether the destruction of the Wendat, Erie and others should be called genocide is debated, since the Haudenosaunee adopted thousands of the defeated.
  - The base map shows New France and the English and Dutch colonies; the lands of the Native nations are drawn as areas in the steps. The war of 1689–1697 between New France and the English colonies is told in King William’s War.
