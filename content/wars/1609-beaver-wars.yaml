  - title: The Susquehannock war and the west
    date: 1660–1684
    when: "1663"
    borders: "1675-01-01"
    countries: [us, ca]
    body:
      - At peace with the French, the Haudenosaunee fought the Susquehannock of the lower Susquehanna, an Iroquoian people allied with Maryland, which sent men and guns to help defend their main town. In May 1663 some eight hundred Seneca, Cayuga and Onondaga besieged the town and were driven off. The war went on for a decade. Weakened by disease and, most historians think, a heavy defeat by the Seneca about 1674, the Susquehannock moved south into Maryland in 1675, where Virginia and Maryland militia besieged them and killed five of their chiefs at a parley, one of the sparks of Bacon’s Rebellion. In 1676–1677 most of the survivors settled among the Haudenosaunee.
      - In 1677 Governor Edmund Andros of New York and the Five Nations made the Covenant Chain, an alliance that bound the Haudenosaunee and the English colonies for a century. In the west, French traders and missionaries reached the upper lakes and the Mississippi; Frontenac built Fort Frontenac (Kingston) in 1673, and La Salle traded with the Illinois and the Miami, who now got guns. Haudenosaunee war parties went far west for furs and captives. In September 1680 several hundred warriors attacked the Grand Village of the Illinois on the Illinois River, which its people abandoned, and in 1684 they besieged La Salle’s Fort Saint-Louis at Starved Rock.
    facts:
      - [Siege of the Susquehannock town, "May 1663, Haudenosaunee repulsed"]
      - [Covenant Chain, "1677"]
      - [Fort Frontenac built, "1673"]
      - [Grand Village of the Illinois attacked, "September 1680"]
