id: beaver-wars
name: Beaver Wars (French and Iroquois Wars)
start: "1609-07-30"
end: "1701-08-04"
tier: A
summary: "Nearly a century of intermittent war around the St. Lawrence and the Great Lakes between the Haudenosaunee (Iroquois) Confederacy of the Mohawk, Oneida, Onondaga, Cayuga and Seneca, armed by Dutch and later English traders at Fort Orange (Albany), and New France with its allies, the Wendat (Huron), Algonquin, Innu and later the nations of the upper Great Lakes. It began when Samuel de Champlain joined his Native allies against the Mohawk at Lake Champlain in 1609. After epidemics in the 1630s halved the populations of the region, Haudenosaunee war parties blockaded the St. Lawrence and the Ottawa, and in 1648–1650 destroyed Wendake, the Wendat homeland on Georgian Bay; the Petun, the Neutral and the Erie were defeated and dispersed in turn, and thousands of captives were adopted into the Five Nations. New France, near collapse, was saved by royal troops who burned the Mohawk towns in 1666. War resumed in the 1680s over the western fur trade: the Haudenosaunee attacked the Illinois, Denonville burned the Seneca towns in 1687, and in 1689 Haudenosaunee warriors struck Lachine, near Montreal. French, Anishinaabe and Wyandot counter-attacks in the 1690s drove them back, and at the Great Peace of Montreal of 1701 the Haudenosaunee and some forty nations allied with France made peace. Historians explain the wars by the fur trade, by the mourning-war custom of taking captives to replace the dead, and by the Haudenosaunee aim of bringing other peoples under the Great Law of Peace."
countries: [ca, us]
