  - title: The Carignan-Salières regiment and the peace of 1667
    date: 1663–1667
    when: "1665-06"
    borders: "1666-10-17"
    countries: [ca, us]
    body:
      - Louis XIV made New France a royal province in 1663 and in 1665 sent the Carignan-Salières regiment, some 1,200 regular soldiers, under the Marquis de Tracy. They built a chain of forts up the Richelieu towards Lake Champlain. The Seneca, Cayuga, Onondaga and Oneida opened peace talks; the Mohawk did not. In 1664 the English had taken New Netherland, and Fort Orange became Albany.
      - In January 1666 Governor Courcelle led about five hundred men on snowshoes, many without proper winter clothing, against the Mohawk. They lost their way, skirmished with Mohawk warriors near the Dutch village of Schenectady and turned back, losing dozens of men to cold and hunger. In September Tracy set out with some 1,300 soldiers, militia and Wendat and Algonquin warriors. The Mohawk abandoned their towns, and in October the French burned four of them with their longhouses and stores of corn and claimed the country for the king.
      - Faced with a winter without food, Mohawk and Oneida envoys came to Quebec in July 1667 and made peace, accepting Jesuit missionaries. Missions were founded in all five nations, and many Catholic Haudenosaunee, most of them Mohawk, moved to new towns near Montreal, the origin of Kahnawake and Kanesatake.
    facts:
      - [Carignan-Salières regiment, "about 1,200 soldiers, 1665"]
      - [Courcelle’s winter expedition, "January–March 1666"]
      - [Mohawk towns burned by Tracy, "October 1666"]
      - [Peace, "July 1667"]
