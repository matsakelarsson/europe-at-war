steps:
  - title: Champlain at Lake Champlain
    date: 1609–1615
    when: "1609-07"
    borders: "1609-07-30"
    countries: [ca, us]
    body:
      - When Samuel de Champlain founded Quebec in 1608, the St. Lawrence valley was empty of the Iroquoian towns that Jacques Cartier had seen in the 1530s; the Mohawk may have driven out their people. To the north and west lived the Innu (Montagnais) and the Algonquin, who traded with the French at Tadoussac, and beyond them, between Lake Simcoe and Georgian Bay, the Wendat (Huron), a confederacy of four or five nations and perhaps 20,000 or more people in fortified towns. South of Lake Ontario, from the Hudson to the Genesee, lived the Five Nations of the Haudenosaunee, the people of the Longhouse, joined by the Great Law of Peace. The Wendat, Algonquin and Innu had long been at war with them.
      - To secure his allies and their furs, Champlain joined them. On 30 July 1609, near what is now Ticonderoga on the lake he named after himself, he and two other Frenchmen with some sixty Innu, Algonquin and Wendat warriors met about two hundred Mohawk; his first arquebus shot killed two of their war chiefs and wounded a third, and the Mohawk broke and fled. On 19 June 1610 Champlain helped his allies storm a Mohawk barricade near the mouth of the Richelieu, killing or capturing nearly all its defenders.
      - In 1615 Champlain travelled to Wendake and joined a Wendat war party that crossed Lake Ontario and attacked a fortified Haudenosaunee town, probably Onondaga or Oneida, in October. The attack failed, and Champlain, wounded in the leg, had to winter among the Wendat. The Wendat began to bring their furs to Quebec every summer, and the Haudenosaunee remembered the French as enemies.
    facts:
      - [Quebec founded, "1608"]
      - [Battle at Lake Champlain, "30 July 1609"]
      - [Battle of Sorel, "19 June 1610"]
      - [Attack on a Haudenosaunee town, "October 1615, failed"]
