  - title: The destruction of Wendake
    date: July 1648 – June 1650
    when: "1648-07"
    borders: "1649-06-15"
    countries: [ca]
    view:
      center: [-79.85, 44.68]
      size: [110, 90]
    body:
      - On 4 July 1648 Haudenosaunee warriors stormed Teanaostaiaé (St. Joseph), one of the largest Wendat towns, while many of its men were away; the Jesuit Antoine Daniel was killed and some seven hundred people were killed or carried off. That winter more than a thousand Seneca and Mohawk warriors, many with Dutch muskets, camped north of Lake Ontario, and on 16 March 1649 they took the palisaded town of Taenhatentaron (St. Ignace) before dawn and then stormed the neighbouring town of St. Louis. The Jesuits Jean de Brébeuf and Gabriel Lalemant were captured there and tortured to death at Taenhatentaron.
      - Wendat warriors from the western towns fought the invaders around St. Louis for days and inflicted heavy losses, and the Haudenosaunee withdrew with their captives. But the Wendat did not believe they could hold their country. They burned their remaining towns and scattered, and in mid-June 1649 the Jesuits set fire to their mission centre, Sainte-Marie, and moved with several thousand Wendat to Gahoendoe (Christian Island) in Georgian Bay.
      - On the island most of the refugees died of hunger and disease in the winter of 1649–1650. In June 1650 a few hundred survivors went with the Jesuits to Quebec, where their descendants are the Huron-Wendat Nation of Wendake. Others joined the Petun and later moved west as the Wyandot; many, perhaps the largest number, were taken in or went over to the Haudenosaunee, and whole towns settled among the Seneca and the Mohawk. The Wendat Confederacy ceased to exist as a nation in its homeland.
    facts:
      - [Teanaostaiaé (St. Joseph) taken, "4 July 1648"]
      - [Taenhatentaron (St. Ignace) and St. Louis taken, "16 March 1649"]
      - [Sainte-Marie abandoned and burned, "June 1649"]
      - [Survivors reach Quebec, "June–July 1650"]
