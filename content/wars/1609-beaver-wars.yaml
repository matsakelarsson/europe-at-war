  - title: Fort Orange, epidemics and guns
    date: 1614–1640
    when: "1624"
    borders: "1630-01-01"
    countries: [us, ca]
    body:
      - Dutch traders built Fort Nassau on the upper Hudson in 1614 and replaced it with Fort Orange (Albany) in 1624, in the country of the Mahican. In the Mohawk–Mahican war of 1624–1628 the Mohawk defeated the Mahican, who withdrew east of the Hudson; in 1626 the fort’s commander Daniel van Krieckebeeck and several of his men were killed when they joined a Mahican war party. From then on the Mohawk traded at Fort Orange directly, exchanging beaver pelts for cloth, metal tools and, from the late 1630s, muskets, which private Dutch traders sold despite the West India Company’s rules. By then the beaver of the Haudenosaunee country had been hunted out.
      - New France was small and weak; English privateers under the Kirke brothers took Quebec in 1629 and held it until 1632. The French allied themselves ever more closely with the Wendat, sent Jesuit missionaries into Wendake from 1634, and sold guns only to converts.
      - Between 1634 and 1640 smallpox and other epidemics brought by Europeans swept the region. The Wendat fell from perhaps 20,000 or more to about 9,000 or 10,000, and the Haudenosaunee lost a similar share. Many Wendat blamed the Jesuits. In 1638 the Wenro, left without protection between the Neutral and the Seneca, fled to the Wendat. The losses fed the mourning war, in which Haudenosaunee war parties took captives to replace their dead.
    facts:
      - [Fort Orange built, "1624"]
      - [Mohawk–Mahican war, "1624–1628, Mohawk victory"]
      - [Quebec held by the English, "1629–1632"]
      - [Wendat population, "from 20,000 or more to about 9,000–10,000 after the epidemics of 1634–1640"]
