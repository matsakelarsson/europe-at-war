  - title: New France besieged
    date: 1650–1665
    when: "1652"
    borders: "1660-05-01"
    countries: [ca, us]
    body:
      - With the Wendat gone, Mohawk war parties pressed on the French settlements and on the Wendat refugees near Quebec, whom they urged to join them. In August 1653 about six hundred Mohawk besieged Trois-Rivières for nine days until the militia captain Pierre Boucher talked them into a truce. In 1656 Mohawk warriors carried off dozens of Wendat from the Île d’Orléans below Quebec.
      - The Onondaga, rivals of the Mohawk inside the Confederacy, invited the French to build a mission on their land, and in 1656 some fifty Frenchmen founded Sainte-Marie de Gannentaha on Onondaga Lake. In March 1658, fearing they were being held as hostages, they slipped away by night. The Mohawk leader Canaqueese, the son of a Dutch father, carried prisoners and offers of truce to Quebec, while his people rearmed at Fort Orange.
      - In May 1660 Adam Dollard des Ormeaux, sixteen young Frenchmen, about forty Wendat under Annahotaha and a few Algonquin were besieged in an old palisade at the Long Sault rapids on the Ottawa by some two hundred Haudenosaunee, soon joined by five hundred more. After five days nearly all the defenders were killed. French Canadian tradition long held that they saved Montreal; historians now doubt that they knew an army was coming, though the fight may have turned it back. In 1661 Haudenosaunee war parties killed or captured more than a hundred colonists, and Pierre Boucher went to France to ask Louis XIV for help.
    facts:
      - [Siege of Trois-Rivières, "August 1653, nine days"]
      - [Sainte-Marie de Gannentaha, "1656–1658"]
      - [Battle of Long Sault, "May 1660"]
