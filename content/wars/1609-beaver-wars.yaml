  - title: The Petun, the Neutral and the Erie
    date: December 1649 – 1657
    when: "1649-12"
    borders: "1655-01-01"
    countries: [ca, us]
    body:
      - The Haudenosaunee then turned on the nations that had taken in Wendat refugees. In December 1649 they destroyed Etharita, the chief town of the Petun (Tionontati) west of Wendake, and killed the Jesuit Charles Garnier; the Petun and the Wendat with them fled north-west, by way of Michilimackinac and the upper lakes, and became the Wyandot. In 1650–1651 the Haudenosaunee attacked the Neutral Confederacy north of Lake Erie, the most populous of the Iroquoian nations, which had stayed out of the wars between its neighbours. Their towns fell one after another; many people were adopted by the Seneca and others fled west, and the land between Lake Ontario and Lake Erie was left almost empty.
      - The Erie, south of Lake Erie, took in Neutral and Wendat refugees and clashed with the Onondaga; when an Erie embassy of thirty men was killed at Onondaga, war followed. In 1654 an Onondaga and Seneca army of about 1,200 warriors stormed the main Erie fort, using their canoes as shields and ladders; by 1656–1657 the Erie had been defeated and many survivors adopted. Some may have gone south and become the Westo of the Savannah River.
      - In a decade the Haudenosaunee had dispersed four Iroquoian confederacies. Adopted captives, by Jesuit estimates a majority of the Five Nations’ people by the 1660s, replaced the dead of war and disease, and the lands from Georgian Bay to the Ohio became Haudenosaunee hunting grounds.
    facts:
      - [Etharita (Petun) destroyed, "December 1649"]
      - [Neutral Confederacy dispersed, "1650–1651"]
      - [Erie fort stormed, "1654"]
