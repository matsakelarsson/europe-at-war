  - title: The blockade of the rivers
    date: 1641–1647
    when: "1641"
    borders: "1645-07-01"
    countries: [ca, us]
    body:
      - From the late 1630s Mohawk war parties waylaid the Wendat and Algonquin fur canoes on the Ottawa and the St. Lawrence, and in the 1640s they all but closed the rivers. Governor Charles de Montmagny refused a Mohawk offer of peace in 1641 that would have left out the Wendat. In 1642 the French founded Ville-Marie (Montreal), a mission settlement at the head of navigation, and Fort Richelieu at the mouth of the Richelieu, the Mohawk road north; the Mohawk attacked both. In August 1642 a war party captured the Jesuit Isaac Jogues and some Wendat on the St. Lawrence and took them to Ossernenon in the Mohawk valley; Jogues escaped with Dutch help in 1643, came back as a peace envoy, and was killed there in October 1646.
      - Small raids made farming and travel outside the palisades of Montreal, Trois-Rivières and Quebec dangerous, a time remembered in Canada as the petite guerre. In 1645, at Trois-Rivières, the Mohawk orator Kiotseaeton made peace with the French, the Algonquin and the Wendat, and that year a record cargo of furs reached Quebec. The peace broke down in 1646, and the Seneca, Cayuga and Onondaga turned on Wendake itself, while talks between the Wendat and the Onondaga in 1647 failed against Mohawk and Seneca opposition.
    facts:
      - [Ville-Marie (Montreal) founded, "May 1642"]
      - [Peace of Trois-Rivières, "July 1645"]
      - [Isaac Jogues killed, "October 1646, at Ossernenon"]
