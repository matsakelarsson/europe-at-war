  - title: The 1690s and the Great Peace of Montreal
    date: 1690–1701
    when: "1690"
    borders: "1701-08-04"
    countries: [ca, us]
    body:
      - Through the 1690s Frontenac, the colonial militia and their Native allies carried the war into the Haudenosaunee country, while Haudenosaunee and English parties from Albany raided the St. Lawrence; Peter Schuyler’s Albany militia with Mohawk and Mahican warriors fought two battles near La Prairie in August 1691. In February 1693 a French and Native force burned the Mohawk towns, and in 1696 Frontenac, aged 74 and carried in a chair, led some 2,000 men to Onondaga and destroyed its towns and crops and those of the Oneida. Ojibwe, Mississauga, Odawa and Wyandot war parties drove the Haudenosaunee from their hunting grounds north of Lake Ontario, where Mississauga and other Anishinaabe people settled. The English did little to help their allies and made peace with France at Ryswick in 1697.
      - Worn down by war, disease and the fall in fur prices, the Haudenosaunee opened talks at Onondaga and Montreal in 1700. In the summer of 1701 about 1,300 delegates of thirty-nine nations, from the Haudenosaunee to the Wyandot, Odawa, Ojibwe, Potawatomi, Miami, Illinois and Abenaki, gathered at Montreal. The Wyandot leader Kondiaronk of Michilimackinac, who had argued for peace, fell ill during the talks and died on 2 August; he was buried with honours. On 4 August Governor Louis-Hector de Callière and the delegates signed the treaty, the nations marking it with the symbols of their clans.
      - The Great Peace ended the Beaver Wars. The Haudenosaunee promised to stay neutral in wars between France and England and to share the western hunting grounds, and the French undertook to settle quarrels between their allies; at Albany the same summer the Five Nations put their western hunting lands under the English king’s protection. Cadillac founded Detroit in July 1701, and the Great Lakes nations returned to lands emptied in the wars. Many of the nations that signed it still regard the treaty as valid.
    facts:
      - [Battle of La Prairie, "August 1691"]
      - [Frontenac at Onondaga, "August 1696"]
      - [Great Peace of Montreal, "4 August 1701, 39 nations"]
