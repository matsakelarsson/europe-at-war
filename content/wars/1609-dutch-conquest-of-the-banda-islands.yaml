notes:
  - Almost all the written sources are Dutch and English, among them the letters of Jan Pieterszoon Coen; the Bandanese side survives in a few letters, such as their appeal of 1615 to the English at Banten, and in the oral traditions of Banda Eli and Banda Elat in the Kei Islands, whose people descend from refugees of 1621.
  - The numbers of dead, enslaved and fled are estimates. Coen himself reported that about 2,500 people on Lontor died “of hunger and misery or by the sword” and that not more than 300 escaped. Estimates of the whole population before the conquest are about 15,000; the archaeologist Peter Lape estimates that about 90 per cent of the islanders were killed, enslaved or driven out.
  - The Banda Islands are about 20 km across; Banda Neira and Lontor (Banda Besar) face each other across a narrow strait. The base map shows the Company’s territory in the Moluccas from the capture of Ambon in 1605.
