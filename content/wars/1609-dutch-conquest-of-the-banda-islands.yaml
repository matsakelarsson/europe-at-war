steps:
  - title: Verhoeff, Fort Nassau and the first expeditions
    view:
      center: [129.8, -4.53]
      size: [56, 46]
    date: 1609–1615
    when: "1609-05"
    borders: "1609-08"
    countries: [id, nl]
    body:
      - The six small volcanic islands of Banda were the only place on earth where nutmeg trees grew. Their people lived in fortified villages governed by councils of orang kaya, the rich men, and had long sold nutmeg and mace to Javanese, Malay, Arab and Chinese traders, who carried them to India and Europe. The first Dutch ships arrived in 1599 and signed contracts with some of the elders; after the Dutch East India Company (VOC) was founded in 1602, it demanded that the Bandanese sell to it alone, at prices it set. The orang kaya, who preferred to sell to the highest bidder and could not bind every village, kept trading with others.
      - In April 1609 a large Dutch fleet under Admiral Pieter Willemsz Verhoeff anchored off Banda Neira and began building a fort on the ruins of a Portuguese one. In late May, during talks, Bandanese fighters ambushed Verhoeff and his escort in the woods and killed him and 45 other Dutchmen. The Dutch burned villages and boats in reprisal, finished Fort Nassau and in August forced a treaty recognising their monopoly. Punitive expeditions against Lontor and Run followed in 1610–1611, and in 1611 the Dutch built Fort Belgica on the hill above Fort Nassau.
      - The Bandanese went on selling to the English, who offered better prices, and to Asian traders who passed the spices on to the Portuguese. In 1614 the Company’s directors decided that the islands had to be conquered. On 14 May 1615 Governor-General Gerard Reynst landed on Ai with a strong force; his troops took the island’s defences but scattered to plunder, and a night counterattack by the islanders, with English help from Run, killed about 200 of them. Reynst withdrew and died of illness in December. The Bandanese wrote to the English at Banten offering their nutmeg to the King of England in return for guns and help against the Dutch.
    facts:
      - [Verhoeff killed, "late May 1609, with 45 of his men"]
      - [Treaty with the Company, "August 1609"]
      - [Dutch attack on Ai, "14 May 1615, repulsed"]
