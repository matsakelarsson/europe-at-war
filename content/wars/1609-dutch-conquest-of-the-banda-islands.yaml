  - title: Ai, Run and Courthope
    view:
      center: [129.8, -4.53]
      size: [56, 46]
    date: 1616–1620
    when: "1616-04"
    borders: "1616-05"
    countries: [id, nl, gb]
    body:
      - In April 1616 Jan Dirkszoon Lam landed on Ai with a new force and, against fierce resistance, took the island. Defenders who fought were killed, and about 400 islanders, many of them women and children, drowned trying to reach Run in small boats. The Dutch built a fort on Ai that they named Revenge (Fort der Wrake), and the elders of the other islands signed new contracts.
      - On 25 December 1616 the English merchant Nathaniel Courthope landed on Run with 39 men, fortified the island and the islet of Nailaka beside it, and had the islanders accept King James I as their sovereign. For four years the Dutch blockaded Run, cutting off food and water, while Courthope, with Bandanese support and few supplies from Banten, held out. The Lontorese kept trading with the English and with Asian merchants.
      - From 1618 the two companies fought openly across the archipelago, and the Dutch seized eleven English ships. In Europe, however, the Dutch Republic and England made a treaty in 1619 by which the English were to receive a third of the spices of the Moluccas and Banda. Jan Pieterszoon Coen, governor-general since 1618, protested that the English “cannot lay claim to a single grain of sand” there, and in October 1620 wrote that Banda had to be subdued and “populated with other people”. Courthope was killed in a skirmish at sea in October 1620, and the English on Run soon gave up.
    facts:
