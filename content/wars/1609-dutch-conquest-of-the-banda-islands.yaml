  - title: Coen on Lontor and the destruction of the Bandanese
    view:
      center: [129.8, -4.53]
      size: [56, 46]
    date: February – December 1621
    when: "1621-03"
    borders: "1621-05"
    countries: [id, nl]
    body:
      - Coen sailed from Batavia at the end of 1620, gathered more ships and men at Ambon and reached Banda Neira on 21 February 1621 with 19 ships, about 1,650 European soldiers and some 290 Japanese mercenaries, joined there by the garrison of Fort Nassau. The Lontorese had fortified the shores and hills of their island. After two days of reconnaissance and a failed landing on 7 March, the Dutch attacked at several points on 11 March and by the end of the next day held the whole island, losing six men killed.
      - The orang kaya submitted and accepted Company rule, but many villagers took to the hills and fought on. On 21 April, after confessions extracted under torture, Coen accused the orang kaya of conspiring against the Company. Hundreds of them and their families, at least 789 people, were shipped to Batavia, where many were enslaved, and on 8 May Japanese mercenaries beheaded 44 orang kaya at Fort Nassau (some accounts give 24). Through the following months Company troops burned villages and hunted the people in the hills; many died of starvation, and some threw themselves from the cliffs rather than surrender.
      - Coen reported that about 2,500 people on Lontor had died of hunger, misery or the sword. Estimates of the islands’ people before the conquest are about 15,000; about 1,000 remained, and the rest had been killed, enslaved or deported, or had fled east to the Kei Islands and Seram. On Run the Dutch killed or enslaved the men, deported the women and children and cut down the nutmeg trees. The land was divided into about seventy plantations (perken) leased to Dutch planters, worked by enslaved people brought from across Asia and by surviving Bandanese. England gave up its claim to Run at the Treaty of Breda in 1667, the treaty that confirmed its possession of New Amsterdam (New York).
    facts:
      - [Coen’s army, "about 1,650 European soldiers and some 290 Japanese mercenaries, 19 ships"]
      - [Lontor overrun, "11–12 March 1621"]
      - [Orang kaya executed, "8 May 1621, 44 by the most cited count"]
      - [Bandanese population, "about 15,000 before the conquest, about 1,000 after"]
