id: dutch-conquest-of-the-banda-islands
name: Dutch conquest of the Banda Islands
start: "1609-04"
end: "1621"
tier: B
summary: "The conquest of the Banda Islands, the world’s only source of nutmeg and mace, by the Dutch East India Company (VOC), which ended in the killing, starvation, enslavement and expulsion of most of their people. The Bandanese, governed by councils of village elders (orang kaya), sold their spices to all comers and refused to keep to contracts giving the Company a monopoly. In 1609 they killed the Dutch admiral Pieter Verhoeff and 45 of his men during talks on Banda Neira, where the Dutch then built Fort Nassau. Punitive expeditions followed, and the English East India Company, which offered better prices, encouraged the islanders’ resistance from Ai and Run. In 1616 the Dutch took Ai, and Nathaniel Courthope held Run for the English until he was killed in 1620. In 1621 Governor-General Jan Pieterszoon Coen invaded the main island, Lontor, with about 1,900 Dutch soldiers and Japanese mercenaries. After an accused conspiracy, orang kaya were tortured and beheaded, and through 1621 Company troops hunted the islanders through the hills. Of a population estimated at about 15,000, sources estimate that only about 1,000 remained on the islands: thousands died of violence, hunger and disease, about 1,700 or more were enslaved or deported to Batavia, and others fled to the Kei Islands and Seram. The Company divided the nutmeg groves among Dutch planters (perkeniers) worked by enslaved people. Many historians describe the conquest as a genocide."
countries: [id, nl, gb]
