id: invasion-of-ryukyu
name: Invasion of Ryukyu
start: "1609-04"
end: "1609-05"
tier: B
summary: "The conquest of the Ryukyu Kingdom by the Shimazu lords of Satsuma in the spring of 1609, with the permission of the Tokugawa shogunate. King Shō Nei had ignored repeated demands from Satsuma and from Tokugawa Ieyasu that he send an embassy to thank Ieyasu for returning shipwrecked Ryukyuan sailors and acknowledge the new regime, and Satsuma, deep in debt after the Korean wars, wanted a share of Ryukyu’s trade with China. About 3,000 Satsuma soldiers in some 100 ships under Kabayama Hisataka and Hirata Masumune sailed from Yamakawa in early April. They took Amami Ōshima without resistance, overcame armed islanders on Tokunoshima and passed Okinoerabu, then landed at Unten on Okinawa, burned the deserted castle of Nakijin and marched on the capital, Shuri, from the west coast while their ships forced the harbour of Naha. Shō Nei surrendered in early May. He was taken to Kagoshima, brought before Ieyasu at Sunpu and the shogun Hidetada at Edo in 1610, and in 1611 made to swear oaths of loyalty to the Shimazu and accept the Fifteen Injunctions, which put Ryukyu’s foreign trade under Satsuma control. Satsuma annexed the Amami Islands and took a yearly tribute, while the kingdom kept its king, its government and its tribute relations with China, which Satsuma and Ryukyu hid from the Chinese court. This dual subordination lasted until Japan annexed Ryukyu as Okinawa Prefecture in 1879."
countries: [jp]
sides:
