notes:
  - The dates of the campaign come from the diary of a Satsuma soldier and other Japanese records kept in the lunar calendar; the Gregorian dates here are converted and may be a day or two out. The fleet sailed on the fourth day of the third month of Keichō 14, and Shō Nei left Shuri Castle on the fourth day of the fourth month.
  - Losses are not well recorded. Japanese and Ryukyuan accounts mention about 50 islanders killed at Wanya and 20 to 30 at Akitoku on Tokunoshima; the overall figures sometimes given, around 1,500 Ryukyuan and 500 Satsuma dead, are uncertain.
  - The Amami Islands stayed part of Satsuma and are today in Kagoshima Prefecture.
