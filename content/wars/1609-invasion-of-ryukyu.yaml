  - title: The fall of Shuri
    date: late April – May 1609
    when: "1609-04-29"
    borders: "1609-05-01"
    countries: [jp]
    body:
      - The fleet anchored at Unten on the Motobu Peninsula of Okinawa on about 29 April. Satsuma troops found Nakijin Castle, the old seat of the northern kingdom, deserted and set fire to it and to the villages around it. A Ryukyuan peace mission led by the Zen master Kikuin, who had lived in Satsuma, met Kabayama at Nakijin and was told to wait for him at Naha.
      - Learning that a chain closed the entrance of Naha harbour, Kabayama landed his army at Ōwan on the west coast near Yomitan and marched south overland, burning Urasoe on the way, while part of the fleet sailed for Naha. Peace talks began at Naha in early May; when a fire broke out in Shuri, Satsuma troops surged towards the capital and had to be called back by their officers. Shō Nei handed over his brother and his three chief ministers as hostages, and a few days later left Shuri Castle; Satsuma officers entered it and drew up an inventory of its treasures. Resistance had been short, for the kingdom had no army able to face musket-armed veterans.
    facts:
      - [Landing at Unten, "about 29 April 1609"]
      - [Peace talks at Naha, "early May 1609"]
      - [Shō Nei leaves Shuri Castle, "early May 1609"]
