steps:
  - title: Through the Amami Islands
    date: April 1609
    when: "1609-04"
    borders: "1609-04-01"
    countries: [jp]
    body:
      - In the spring of 1609 the Shimazu gathered about 3,000 men, many of them veterans of the Korean war and armed with muskets, in some 100 ships at Yamakawa at the southern tip of Satsuma. Kabayama Hisataka commanded, with Hirata Masumune as his deputy. The fleet sailed in early April, passed the Tokara Islands and reached Amami Ōshima, the largest of the northern islands that Ryukyu had ruled since the 15th century, around 11 April. The island’s chiefs did not resist; the chief of Kasari, who had dealings with Kabayama, called on the islanders to submit, and others supplied the army.
      - On Tokunoshima the islanders fought. About a thousand people surrounded the first Satsuma ships to arrive at Wanya and were driven off with musket fire, losing about 50 dead, and 20 to 30 more were killed when the people of Akitoku attacked the landing parties at the water’s edge. The fleet moved on to Okinoerabu, which gave in, and bypassed Yoron. In Shuri, Shō Nei sent a Zen priest to seek terms, but the envoys missed the Satsuma fleet.
    facts:
      - [Satsuma force, about 3,000 men in some 100 ships]
      - [Commanders, Kabayama Hisataka and Hirata Masumune]
      - [Amami Ōshima occupied, "about 11 April 1609"]
      - [Fighting on Tokunoshima, "about 21–24 April 1609"]
