  - title: The king before the shogun
    date: 1609–1611
    when: "1609-06"
    borders: "1611-12-31"
    countries: [jp]
    body:
      - In the summer of 1609 Shō Nei sailed from Unten for Satsuma with about a hundred of his officials. In 1610 he was brought before the retired shogun Tokugawa Ieyasu at Sunpu and the shogun Tokugawa Hidetada at Edo. Meanwhile Satsuma officials surveyed the islands, and Kabayama and his deputy governed them for the Shimazu lord Tadatsune.
      - At Kagoshima in 1611 the king and his councillors had to swear that Ryukyu had always been a dependency of Satsuma and that the invasion had been deserved. One of the king’s councillors, Tei Dō (Jana Ueekata), refused to sign and was beheaded. The Fifteen Injunctions put Ryukyu’s trade and diplomacy under Satsuma’s control, Satsuma annexed the Amami Islands, and the king returned to Shuri in 1611 as Satsuma’s vassal. Ryukyu went on sending tribute to the Ming and later the Qing court, and Satsuma and Ryukyu took care to hide Satsuma’s hold from Chinese envoys.
    facts:
      - [Audience with Ieyasu at Sunpu, "1610"]
      - [Oaths and the Fifteen Injunctions, "Kagoshima, 1611"]
      - [Annexed by Satsuma, the Amami Islands]
