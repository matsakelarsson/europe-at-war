id: war-of-the-julich-succession
name: War of the Jülich Succession
start: "1609"
end: "1614-11-12"
tier: B
summary: A war over the inheritance of the united duchies of Jülich, Cleves and Berg on the lower Rhine, claimed by Brandenburg and Palatinate-Neuburg after the last duke died in 1609, which drew in the Emperor, France, the Dutch Republic and Spain. The Treaty of Xanten in 1614 divided the lands, giving the Hohenzollerns of Brandenburg their first territories in western Germany.
