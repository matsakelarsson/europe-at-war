steps:
  - title: Jülich, Wesel and the partition of Xanten
    date: 1609–1614
    when: "1609-06-10"
    borders: "1614-11-12"
    countries: [de, nl, fr, es]
    body:
      - When the mentally ill Duke John William of Jülich-Cleves-Berg died childless on 25 March 1609, two Lutheran princes claimed his rich lands through his sisters, Elector John Sigismund of Brandenburg and Wolfgang William of Palatinate-Neuburg. On 10 June they agreed at Dortmund to rule jointly, but Emperor Rudolf II sent Archduke Leopold, who took over the fortress of Jülich. France, the Dutch Republic and the Protestant Union backed the claimants. Henry IV of France was preparing to intervene in force when he was assassinated on 14 May 1610, yet Dutch, French, English and Union troops besieged Jülich, which surrendered on 1 September.
      - The two princes then fell out. In 1613 Wolfgang William became a Catholic and married a sister of Maximilian of Bavaria, and John Sigismund turned Calvinist. In 1614 the Dutch seized Jülich and Wolfgang William took Düsseldorf. Spain’s army under Ambrogio Spinola restored Aachen’s Catholic council in August and took Wesel, while Maurice of Nassau occupied Cleves and Mark. The two armies did not fight, and on 12 November the Treaty of Xanten divided the inheritance, giving Cleves, Mark and Ravensberg to Brandenburg and Jülich and Berg to Neuburg. Spanish and Dutch garrisons stayed on.
    facts:
      - [Treaty of Dortmund, "10 June 1609"]
      - [Siege of Jülich, "Surrendered 1 September 1610"]
      - [Treaty of Xanten, "12 November 1614"]
    markers:
      - kind: event
        side: pn
        name: Düsseldorf
        date: 1609 and 1614
        text: The capital of the united duchies, where Duke John William died in 1609. Wolfgang William seized it in 1614 and made it the seat of his new duchy of Jülich-Berg.
        lonlat: [6.774, 51.228]
      - kind: treaty
        name: Treaty of Dortmund
        date: 10 June 1609
        text: Brandenburg and Neuburg agreed to hold the duchies jointly until their claims were settled, in defiance of the Emperor.
        lonlat: [7.465, 51.514]
      - kind: siege
        side: nl
        name: Siege of Jülich
        date: July – 1 September 1610
        text: Archduke Leopold’s garrison surrendered to an army of more than 30,000 Dutch, French, English and German Protestant troops under Maurice of Nassau.
        lonlat: [6.358, 50.922]
        lp: l
      - kind: siege
        side: hab
        name: Aachen
        date: August 1614
        text: Spinola enforced the Emperor’s order to restore the Catholic council of the imperial city, where Protestants had taken power in 1611.
        lonlat: [6.084, 50.775]
        lp: l
      - kind: taken
        side: hab
        name: Wesel
        date: September 1614
        text: The loss of this Rhine crossing near their border shocked the Dutch. Spain kept it, with Orsoy and Rheinberg, after the treaty.
        lonlat: [6.618, 51.659]
      - kind: treaty
        name: Treaty of Xanten
        date: 12 November 1614
        text: Negotiated by Spanish and Dutch envoys for the two princes, with English and French mediation. Both armies stayed close by while the talks went on.
        lonlat: [6.454, 51.662]
        lp: l
