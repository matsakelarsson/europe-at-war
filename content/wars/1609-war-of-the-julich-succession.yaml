    success: Imperial and Spanish success
notes:
  - The two claimants first fought together as the “possessing princes” against the Emperor’s commissioner in 1609–1610, then fell out. In 1614 Spain backed Neuburg and the Dutch backed Brandenburg, though the Spanish and Dutch armies avoided fighting each other during their Twelve Years’ Truce.
  - Catholic and Protestant territories used different calendars, ten days apart; dates are as usually given. The partition was provisional and was confirmed by the Treaty of Cleves in 1666.
