summary: "In Russia’s Time of Troubles Sweden first sent troops to help Tsar Vasily Shuisky against Poland, then, after the defeat at Klushino, turned on Russia and occupied Novgorod. The Treaty of Stolbovo in 1617 gave Sweden Ingria and Kexholm and cut Russia off from the Baltic."
