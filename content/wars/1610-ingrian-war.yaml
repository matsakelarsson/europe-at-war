    body:
      - In Russia’s Time of Troubles, Tsar Vasily Shuisky called in Swedish help against a Polish-backed pretender. In 1609 Jacob De la Gardie’s corps of Swedish and foreign mercenaries joined Prince Skopin-Shuisky’s Russian army and helped relieve Moscow. But on 4 July 1610 the Poles crushed the combined army at Klushino, between Moscow and Smolensk, and the unpaid mercenaries gave up.
      - Sweden then turned on Russia. De la Gardie stormed Novgorod on 16 July 1611, and the occupied city even talked of a Swedish prince as tsar. In 1615 the young Gustav II Adolf besieged Pskov but could not take it. At Stolbovo on 27 February 1617 Russia gave Sweden Ingria and Kexholm, cutting itself off from the Baltic, and got Novgorod back.
