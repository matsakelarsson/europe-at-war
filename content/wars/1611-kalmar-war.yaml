    body:
      - Christian IV of Denmark–Norway declared war in 1611, partly over Charles IX’s claims to the far north of Norway. The Danes besieged and took Kalmar that summer, and Charles IX died in October, leaving the throne to his 16-year-old son Gustav II Adolf.
      - In 1612 the Danes held the sea, took Öland and in May captured Älvsborg and Gullberg, cutting Sweden off from the west coast again. The young king raided Danish Scania and narrowly escaped at Vittsjö. At Knäred on 20 January 1613, Sweden had to agree to a ransom of one million riksdaler to get Älvsborg back, a sum that took six years to pay.
    facts:
      - - Treaty of Knäred
        - 20 January 1613
      - - Second Älvsborg Ransom
        - 1 million riksdaler, paid by 1619
