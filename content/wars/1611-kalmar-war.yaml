summary: A war between Denmark–Norway and Sweden, begun by Christian IV partly over Swedish claims to the far north of Norway. The Danes took Kalmar and Älvsborg, and by the Peace of Knäred in 1613 Sweden had to pay one million riksdaler to get Älvsborg back.
