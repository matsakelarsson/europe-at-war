id: war-of-the-montferrat-succession
name: War of the Montferrat Succession
start: "1613-04"
end: "1617-10-09"
tier: C
summary: A war between Charles Emmanuel I of Savoy and Spain over Montferrat, the Gonzaga dukes of Mantua’s duchy in Piedmont. When Duke Francesco IV of Mantua died in December 1612 leaving a daughter, Charles Emmanuel, her grandfather, claimed Montferrat for her and invaded it in April 1613, taking Trino, Alba and Moncalvo. Spain, ruling Milan and anxious about the fortress of Casale on the road between Milan and Genoa, backed Francesco’s brother Ferdinando and drove the Savoyards out. In 1614–1615 the governor of Milan, the Marquis of Hinojosa, invaded Piedmont, until French mediation brought the Peace of Asti in June 1615. Spain disowned it, and in 1616–1617 Savoy fought on with Venetian money, help from the French governor of Dauphiné, Lesdiguières, and German mercenaries under Ernst von Mansfeld. The new governor of Milan, Pedro de Toledo, took Vercelli in July 1617. Treaties at Madrid in September and Pavia in October 1617 restored all conquests, and Ferdinando kept Montferrat. The question came back ten years later in the War of the Mantuan Succession.
