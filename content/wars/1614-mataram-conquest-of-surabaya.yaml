notes:
  - The course of the wars is known mainly from the Javanese chronicles (babad), written later at the Mataram court, and from Dutch reports from the north coast; the order of events and the years of some campaigns differ between them by a year or so.
  - Sultan Agung, then called Raden Mas Rangsang, took the title of susuhunan (often written sunan) in 1624 and that of sultan only in 1641.
