id: mataram-conquest-of-surabaya
name: Mataram’s conquest of Surabaya and the east
start: "1614"
end: "1625"
tier: C
summary: "The wars in which Sultan Agung of Mataram, the inland kingdom of Central Java, brought the trading cities and principalities of East Java and Madura under his rule. Surabaya, the richest port of the north coast, led a league of the eastern states and had resisted Agung’s father and grandfather. In 1614, a year after his accession, Agung raided the lands of Surabaya and Malang and the eastern end of Java; in 1615 he took Wirasaba (near today’s Mojokerto), and in 1616 an army sent by Surabaya and its allies against Mataram was crushed at Siwalan near Pajang. Lasem fell in 1616, Pasuruan in 1617 and Tuban, one of the oldest ports of Java, in 1619; Pajang, which rose against Mataram in 1617, was destroyed. To isolate Surabaya, Agung took its ally Sukadana in south-western Borneo in 1622 and in 1624 conquered Madura after hard fighting, deporting its princes to his court and installing one of them, Prince Prasena (Cakraningrat I), as his vassal. Surabaya itself was besieged for years; its water supply was cut by damming the Brantas river, and the starving city surrendered in 1625. Its ruler’s son, Pangeran Pekik, was taken to the Mataram court and married to Agung’s sister. Mataram now ruled all of Central and East Java except Banten, the new Dutch base at Batavia and the Balinese-ruled east, and Agung took the title of susuhunan; his attempts on Batavia followed in 1628–1629. The conquests ruined the old north-coast ports, and the grievances of Madura and Surabaya resurfaced fifty years later in the Trunajaya rebellion."
