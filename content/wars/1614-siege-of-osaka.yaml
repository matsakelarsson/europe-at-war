notes:
  - The English sources give Gregorian dates converted from the Japanese lunar calendar (for example 2 June 1615, the 6th day of the 5th month of Keichō 20, for Dōmyōji). The figures for the size of both armies are those of later Japanese chronicles and are probably too high.
  - Accounts of the fall of the castle, including a report by an employee of the Dutch East India Company at Hirado, describe looting, killing and the abduction of women by the victorious troops; the Dutch account put the dead in the fire at about 10,000.
