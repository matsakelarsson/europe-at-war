steps:
  - title: The winter campaign
    date: November 1614 – January 1615
    when: "1614-11"
    borders: "1614-12-01"
    countries: [jp]
    body:
      - The quarrel was set off by the inscription on the great bell of the Hōkō-ji in Kyoto, whose phrase “May the state be peaceful and prosperous” (kokka ankō) split the characters of Ieyasu’s name, which Tokugawa scholars read as a curse. Hideyori’s envoys failed to calm Ieyasu, and the Toyotomi invited rōnin to Osaka, offering pay and the hope of a new war; among the captains who came were Sanada Yukimura, Gotō Mototsugu, Chōsokabe Morichika and Akashi Takenori. None of the great daimyo joined them. Ieyasu moved from Sunpu to Nijō Castle in Kyoto and on to Osaka with an army counted at 164,000.
      - The siege began on 19 November 1614 when Tokugawa troops destroyed the Toyotomi fort at the mouth of the Kizu River, and in late November they fought their way across the marshes east of the castle at Imafuku and Shigino. Osaka Castle, ringed by rivers and moats, held out. South of it, where the ground offered no water barrier, Sanada Yukimura had built the Sanada-maru, an earthwork barbican, and in December his 7,000 men threw back the Maeda and other besiegers with heavy losses. Ieyasu then turned to his artillery, including cannon bought from the English and Dutch through the pilot William Adams, and from 8 January 1615 bombarded the castle by night and at dawn while miners dug under the walls. A ball that struck Yodo-dono’s quarters and killed two of her maids frightened her into negotiations, led on her side by her sister Ohatsu. Under the peace of 22 January Hideyori kept Osaka and his rōnin were pardoned, but the outer moat was to be filled; the Tokugawa labourers filled the inner moats too.
