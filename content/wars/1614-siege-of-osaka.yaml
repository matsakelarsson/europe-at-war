  - title: The summer campaign and the fall of the castle
    date: May – June 1615
    when: "1615-05"
    borders: "1615-06-04"
    countries: [jp]
    body:
      - With its moats filled, Osaka could no longer stand a siege. When the Toyotomi began re-digging them and kept recruiting rōnin, Ieyasu ordered Hideyori to leave Osaka; he refused, and in May 1615 the Tokugawa armies, about 150,000 men, marched again. The Toyotomi commanders chose to fight in the open. On 26 May a Toyotomi force under Ōno Harufusa and Ban Danemon was beaten by the Asano at Kashii, south of Osaka, and Ban was killed.
      - On 2 June the Toyotomi tried to stop the Tokugawa armies coming from Yamato and Kawachi. At Dōmyōji Gotō Mototsugu was killed and Sanada Yukimura fought the Date to a standstill; at Yao Chōsokabe Morichika beat Tōdō Takatora, but at Wakae Kimura Shigenari was killed fighting Ii Naotaka’s men. On 3 June the two armies met south of the castle around the Shitennō-ji temple and the hill of Chausuyama. Sanada’s charge reached Ieyasu’s headquarters before it was broken and he was killed, and the Toyotomi line collapsed. Fire spread through the castle. On 4 June Hideyori and Yodo-dono, refused a pardon, killed themselves in a storehouse in the burning castle. Hideyori’s son Kunimatsu was caught and beheaded in Kyoto, and Chōsokabe was executed. Hideyori’s wife Senhime, Hidetada’s daughter, was rescued. The era name was changed to Genna, “the beginning of peace”.
