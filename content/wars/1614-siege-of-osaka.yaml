id: siege-of-osaka
name: Siege of Osaka
start: "1614-11-19"
end: "1615-06-04"
tier: B
summary: "The two campaigns in which the Tokugawa shogunate destroyed the Toyotomi family, the last power in Japan that could rival it. After Sekigahara, Toyotomi Hideyoshi’s son Hideyori kept Osaka Castle, the strongest fortress in the country, with his mother Yodo-dono and a large fortune, while Tokugawa Ieyasu became shogun in 1603 and passed the title to his son Hidetada in 1605. In 1614 Ieyasu took offence at the inscription on a bell cast for the Hōkō-ji temple that Hideyori had rebuilt in Kyoto, and when tens of thousands of masterless samurai (rōnin), many of them men dispossessed after Sekigahara, gathered in Osaka, he marched on the city with about 164,000 men. In the winter campaign (November 1614 – January 1615) the defenders, perhaps 100,000 strong, held the castle; Sanada Yukimura’s earthwork, the Sanada-maru, threw back the attackers, and Ieyasu turned to European cannon bought from English and Dutch merchants. A shot into Yodo-dono’s quarters helped bring about a peace on 22 January 1615 by which the outer moats were to be filled; the Tokugawa filled the inner moats as well. In the summer campaign (May–June 1615) the Toyotomi generals came out to fight in the open and were defeated at Kashii, Dōmyōji, Yao and Wakae, and on 3 June in the decisive battle around Tennōji, where Sanada was killed. The next day the castle burned and Hideyori and Yodo-dono killed themselves; Hideyori’s eight-year-old son Kunimatsu was beheaded. The shogunate then decreed one castle to a province and issued the first Laws for the Military Houses, and Japan saw no war on this scale until the 1860s."
countries: [jp]
