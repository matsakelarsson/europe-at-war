id: ahom-mughal-wars
name: Ahom–Mughal wars
start: "1615-11"
end: "1682-08-16"
tier: A
summary: "The long struggle between the Mughal Empire and the Ahom kingdom of the Brahmaputra valley, in today’s Assam, for the borderland of Kamrup and the town of Guwahati. The wars began when the Mughals, having conquered the Koch kingdom of Hajo, pushed up the river in 1615. After two decades of frontier fighting, the Treaty of Asurar Ali in 1639 left Guwahati to the Mughals. In 1661–62 Mir Jumla, governor of Bengal, invaded with a large army and fleet and took the Ahom capital, Garhgaon, but the monsoon, disease and Ahom raids wore his army down, and the Treaty of Ghilajharighat (1663) only bought a tribute and western Assam. The Ahoms took Guwahati back in 1667 under their general Lachit Borphukan, held it against the army of Raja Ram Singh of Amber, and won a decisive river battle at Saraighat in 1671. Guwahati was betrayed to the Mughals in 1679, but in 1682 the Ahoms under King Gadadhar Singha won it back at Itakhuli and pushed the Mughal frontier back to the Manas river, where it stayed."
countries: [in, bd]
sides:
  - id: ahom
    name: Ahom kingdom
    polities: [ahom]
    ink: red
    moves: Ahom moves
    success: Ahom success
  - id: mug
    name: Mughal Empire
    polities: [mughals]
    ink: green
    moves: Mughal moves
    success: Mughal success
notes:
  - The Ahom side of the story is told in the Buranjis, the court chronicles of the Ahom kingdom; the Mughal side in Persian histories, above all the Fathiya-i Ibriya of Shihabuddin Talish, who went with Mir Jumla. They differ on numbers and on some dates; army sizes are rough estimates.
  - The Koch kingdom of Cooch Behar, west of Kamrup, was a Mughal vassal and at times fought on the Mughal side.
  - Lachit Borphukan is honoured in Assam today, and the Indian National Defence Academy gives a medal in his name.
