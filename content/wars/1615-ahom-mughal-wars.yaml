steps:
  - title: Kamrup and the first wars
    date: 1615–1639
    when: "1615-11"
    borders: "1615-11"
    countries: [in]
    body:
      - "The Ahoms, a Tai people who had come over the mountains from the east in the 13th century, ruled the upper Brahmaputra valley from their capital at Garhgaon. To the west lay the Koch lands, which in 1581 had split into Koch Bihar, a Mughal ally, and Koch Hajo, centred on Kamrup. In 1612–13 the Mughals, with Koch Bihar’s help, conquered Koch Hajo and captured its king, Parikshit Narayan, which brought them to the Ahom border."
      - "In November 1615 a Mughal army under Syed Abu Bakr and Raja Satrajit pushed up the river and took the Ahom frontier post of Kajali, but the Ahom king Pratap Singha struck back and inflicted a heavy defeat on it at the Bharali river. For the next twenty years the frontier saw raids, risings in Kamrup and fighting on land and water. The Ahoms backed Parikshit’s brother Balinarayan as a rival king in Kamrup, and in 1636 they beat the Mughals at Sualkuchi and took Hajo, but a larger Mughal force under Allah Yar Khan recovered Kamrup in 1637–38."
      - "Neither side could win outright. In February 1639 the Ahom minister Momai Tamuli Borbarua and Allah Yar Khan agreed the Treaty of Asurar Ali. The Mughals kept Kamrup with Guwahati; the Ahoms kept the valley east of the Barnadi river on the north bank and of the Asurar Ali, an old embankment road, on the south bank."
    facts:
      - [Kajali taken by the Mughals, "November 1615"]
      - [Battle of Sualkuchi, "1636, Ahom victory"]
      - [Treaty of Asurar Ali, "February 1639"]
