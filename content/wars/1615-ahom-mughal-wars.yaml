  - title: The rains, and Ghilajharighat
    date: 1662–1663
    when: "1662-05"
    borders: "1663-01"
    countries: [in]
    body:
      - "Then the rains came. The Brahmaputra and its tributaries flooded, the fleet was cut off downstream, and the Mughal army at Garhgaon and the camp at Mathurapur were isolated. The Ahoms, led by the minister Atan Burhagohain, came down from the hills and waged a war of night attacks and ambushes on the Mughal posts and supply lines. Cholera broke out in August, and thousands of Mughal soldiers and animals died."
      - "When the floods fell, Mir Jumla advanced again towards the hills, but he was seriously ill and his exhausted men were refusing to go on. Both sides wanted an end. Under the Treaty of Ghilajharighat, agreed in January 1663, Jayadhwaj Singha became a Mughal vassal, sent a daughter to the imperial harem, and promised a large indemnity in gold, silver and elephants, an annual tribute of 20 elephants, hostages, and the cession of the land west of the Bharali and the Kalang rivers. Mir Jumla died on the way back to Dhaka on 30 March 1663."
    facts:
      - [Cholera in the Mughal camps, "August 1662"]
      - [Treaty of Ghilajharighat, "January 1663"]
      - [Death of Mir Jumla, "30 March 1663"]
    markers:
      - kind: held
        side: mug
        name: Garhgaon
        date: May – October 1662
        text: The Mughal garrison held the capital through the rains, under constant Ahom attack.
        lonlat: [94.735, 26.938]
      - kind: event
        side: ahom
        name: Namrup
        date: 1662
        text: The hill country where Jayadhwaj Singha took refuge and from which the Ahom counter-attacks came.
        lonlat: [95.33, 27.19]
    arrows:
