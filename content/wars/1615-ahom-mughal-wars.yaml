  - title: Lachit Borphukan retakes Guwahati
    date: 1667
    when: "1667-08-20"
    borders: "1667-11-02"
    countries: [in]
    body:
      - "Jayadhwaj Singha died in 1663 soon after the treaty, ashamed, the chronicles say, of its terms. His successor, Chakradhwaj Singha, stopped paying the tribute and rebuilt the army, and gave the command to Lachit, who held the office of Borphukan, the Ahom viceroy of the lower valley."
      - "In August 1667 Lachit’s army and fleet moved down the Brahmaputra. On 2 November 1667 the Ahoms took the Mughal fort of Itakhuli and Guwahati, and they pursued the Mughals down the valley to the Manas river. The Mughal faujdar of Guwahati, Syed Firuz Khan, was captured. Aurangzeb ordered a new army to be sent under Raja Ram Singh of Amber."
    facts:
