  - title: Guwahati lost and won
    date: 1679–1682
    when: "1679-03"
    borders: "1682-08-16"
    countries: [in]
    body:
      - "After Lachit’s death the Ahom court fell into a decade of intrigue, in which several kings were raised and deposed by rival ministers. In March 1679 Laluk Sola Borphukan, the Ahom viceroy at Guwahati, handed the town to the Mughal governor of Bengal, Aurangzeb’s son Muhammad Azam, in return for a large payment and a promise of support for his own claim to the throne."
      - "In 1681 Gadadhar Singha, of the Tungkhungia branch of the royal family, became king and restored order. In the summer of 1682 the Ahom army under Dihingia Alun Borbarua moved down the valley in three columns and besieged the Mughal fort at Itakhuli. On 15 August the Mughal fleet was defeated and surrendered, and at dawn on 16 August the garrison abandoned the fort. The Ahoms pursued the Mughals to the Manas river, which remained the frontier until the Burmese invasions of Assam in the early 19th century."
    facts:
      - [Guwahati handed to the Mughals, "March 1679"]
      - [Battle of Itakhuli, "15–16 August 1682, Ahom victory"]
