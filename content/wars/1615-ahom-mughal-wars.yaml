  - title: Ram Singh and Alaboi
    date: 1669–1670
    when: "1669-02"
    borders: "1669-08-05"
    countries: [in]
    body:
      - "Ram Singh, a Rajput prince in Mughal service, reached the frontier post of Rangamati in February 1669 with a large army, including Rajput contingents, and moved up to Guwahati. Lachit had turned the town into a fortress, with earthworks between the hills and the river and the Ahom fleet on the Brahmaputra, and avoided battle in the open, where the Mughal and Rajput cavalry were strongest."
      - "According to the Ahom chronicles, Ram Singh taunted King Chakradhwaj Singha with a challenge to single combat, and the king ordered his generals to attack. Around 5 August 1669, on the plain of Alaboi on the north bank, the Ahom army attacked the Mughal camp and was badly defeated, losing about 10,000 men by the chronicles’ count. Even so the Mughals could not break Lachit’s lines. For more than a year the war turned into a deadlock of skirmishes and negotiations, while disease and the climate weakened Ram Singh’s army."
    facts:
      - [Ram Singh reaches Rangamati, "February 1669"]
      - [Battle of Alaboi, "about 5 August 1669, Mughal victory"]
    markers:
      - kind: event
        side: mug
