  - title: Saraighat
    date: March 1671
    when: "1671-03"
    borders: "1671-03"
    countries: [in]
    body:
      - "In March 1671 Ram Singh made a last attempt to take Guwahati from the river. The Mughal fleet, with about 40 large boats under Admiral Munnawar Khan, attacked at Saraighat, where the Brahmaputra narrows to about a kilometre between the hills. The Ahom fleet was smaller, but its boats were lighter and its crews knew the river. Lachit, seriously ill, watched the first fighting from his headquarters at Itakhuli; when the Ahom line began to waver, he had himself carried to a boat and led the counter-attack."
      - "The Ahom boats struck the Mughal fleet from the front and the flanks, and some were lashed together to block the river. Munnawar Khan was killed, three senior Mughal officers fell, and the Mughals lost about 4,000 men. Ram Singh withdrew to Rangamati in April. Lachit died a year later, in April 1672, at Kaliabor. Saraighat is remembered in Assam as the battle that kept the valley free of Mughal rule."
    facts:
      - [Battle of Saraighat, "March 1671, Ahom victory"]
      - [Mughal losses, "about 4,000 men, by Ahom accounts"]
    markers:
