  - title: Mir Jumla’s invasion
    date: November 1661 – March 1662
    when: "1661-11-01"
    borders: "1661-11"
    countries: [in, bd]
    body:
      - "During the Mughal war of succession of 1657–59 the Ahom king Jayadhwaj Singha drove the Mughals out of Guwahati and beyond the Manas river, and his troops raided towards Dhaka. When Aurangzeb had won the throne, he sent his best general, Mir Jumla, as governor of Bengal, with orders to punish both the Ahoms and Koch Bihar, which had also seized Mughal land."
      - "Mir Jumla set out from near Dhaka on 1 November 1661 with, by different accounts, 12,000 horse and 30,000 foot, or the reverse, and a fleet of over 300 war boats with European gunners. He took Koch Bihar in December, then moved up the Brahmaputra, the army on the banks and the fleet on the river. The Ahoms abandoned Jogighopa and Guwahati. On about 25 February 1662 Dilir Khan stormed the stockade of Simalugarh at night, and the Ahoms gave up their great fort at Samdhara across the river. On 3 March the Ahom fleet was beaten near Kaliabor."
      - "On 17 March 1662 Mir Jumla entered the Ahom capital, Garhgaon. Jayadhwaj Singha fled into the hills of Namrup. The Mughals seized a great treasure, with guns, elephants and boats, and Mir Jumla wrote to Aurangzeb that Assam was conquered."
    facts:
      - [Mir Jumla sets out, "1 November 1661"]
      - [Koch Bihar taken, "19 December 1661"]
      - [Garhgaon entered, "17 March 1662"]
