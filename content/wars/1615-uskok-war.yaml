notes:
  - Dates are Gregorian. A truce on the Isonzo front was agreed on 6 November 1617, and fighting at sea went on into that month.
  - The war ran alongside the War of the Montferrat Succession and was settled by the same treaties. Ferdinand, soon to be emperor, made peace partly to be free for the troubles in Bohemia that began the Thirty Years’ War.
