id: uskok-war
name: Uskok War
start: "1615-12"
end: "1617-11"
tier: C
summary: A war between Venice and Archduke Ferdinand of Inner Austria, also called the War of Gradisca, fought mainly around Gradisca and Gorizia on the Isonzo. Its cause was the Uskoks of Senj, refugees from the Ottoman advance who served the Habsburgs as frontier troops and, often unpaid, raided Ottoman and Venetian shipping in the Adriatic. After Uskok raids on Venetian territory in late 1615, Venice besieged the Habsburg fortress of Gradisca in 1616 and again in 1617, without taking it; the young Albrecht von Wallenstein helped to relieve it. Venice hired some 4,000 Dutch soldiers and English volunteers, while Spain, Ferdinand’s ally, sent money, and the Duke of Osuna, viceroy of Naples, sent his ships into the Adriatic, where his fleet fought the Venetians off Ragusa in November 1617. The Peace of Madrid of September 1617 restored the conquests; many Uskoks were executed or driven from Senj, and a permanent imperial garrison was placed in the town.
