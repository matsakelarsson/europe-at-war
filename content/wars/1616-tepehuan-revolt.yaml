id: tepehuan-revolt
name: Tepehuán Revolt
start: "1616-11-16"
end: "1620"
tier: C
summary: "A rising of the Tepehuán of the Sierra Madre Occidental in Nueva Vizcaya, today’s Durango, against Spanish rule and the Jesuit missions. The Tepehuán were farmers living in scattered settlements on the eastern slopes of the sierra. Spanish miners and ranchers had moved into their lands from the 1570s, and the Jesuits founded missions among them from 1596, at Santiago Papasquiaro, Santa Catarina de Tepehuanes and El Zape; epidemics in 1594, 1601–1602, 1606–1607, 1610 and 1616–1617 may have killed more than four-fifths of the peoples of the region. In 1616 a baptised Tepehuán prophet, Quautlatas, carrying a broken cross, preached that the old gods were angry and that the Spaniards and the missionaries must be killed or driven out, promising that the dead would rise again. The revolt began on 16 November 1616 with an attack on a wagon train near Santa Catarina, and in coordinated attacks in the following days the Tepehuán, under six war leaders of whom Francisco Gogoxito was the best known, killed about 100 people in the church at El Zape and a similar number at Santiago Papasquiaro; all but one of the Jesuits in their country were killed. Governor Gaspar de Alvear, fearing an attack on Durango, ordered the execution of some 75 Indigenous leaders held there and led a column into the sierra in December; further expeditions in 1617 and 1618, with Concho and other Indigenous allies, fought a war “by fire and blood” and killed the last of the war leaders in 1618. Raiding went on until the revolt was declared over in 1620. More than 200 Spaniards, ten missionaries, and unknown numbers of Indigenous, African and mestizo people on the Spanish side died, and perhaps 4,000 Tepehuán, many of hunger and disease; mines and churches were burned and the province took decades to recover. Fifteen years earlier, in December 1601, the Acaxee of the sierra to the west, led by an elder called Perico, had risen against the mining camps around Topia; after the Jesuit Hernando de Santarén failed to make peace, Francisco de Urdiñola put the rising down with Spanish and Indigenous troops and executed Perico and about 48 others in 1602–1603."
