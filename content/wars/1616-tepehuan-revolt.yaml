notes:
  - "The main accounts are those of the Jesuits, above all Andrés Pérez de Ribas, who blamed the revolt on the devil and denied that the Spaniards had caused it; the Tepehuán said that the missionaries had brought disease and death with baptism. Numbers of the dead are those of the sources cited and are approximate."
