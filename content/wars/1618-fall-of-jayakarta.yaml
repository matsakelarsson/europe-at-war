  - title: Coen razes Jayakarta
    date: May 1619
    when: "1619-05-28"
    borders: "1619-06-01"
    countries: [id, nl]
    body:
      - Coen came back from Ambon with sixteen ships and about a thousand soldiers, and reached the fort on 28 May 1619. On 30 May his troops attacked the town, held by Bantenese soldiers, drove them out and burned Jayakarta to the ground; its people fled inland or to Banten. Only the old Portuguese stone pillar (padrão) of 1522 was left standing among the ruins.
      - On the site Coen built the castle and walled town of Batavia, laid out with canals like a Dutch town, and settled it with Chinese, Mardijkers, Japanese and enslaved people from across Asia, while Javanese were long kept out of the town for fear of revolt. The Company’s directors refused Coen’s choice of the name New Hoorn, after his birthplace, and in 1621 the town was formally named Batavia. In Europe the Dutch and English companies had agreed in 1619 to cooperate, and for a few years the English kept a post at Batavia, but Banten blockaded the town on and off for decades, and Mataram besieged it in 1628 and 1629.
    facts:
      - [Coen’s return, "28 May 1619, with 16 ships and about 1,000 men"]
      - [Jayakarta stormed and burned, "30 May 1619"]
      - [Batavia formally named, "1621"]
