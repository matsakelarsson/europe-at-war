steps:
  - title: The English, Jayakarta and the Dutch fort
    date: December 1618 – March 1619
    when: "1618-12"
    borders: "1619-01-15"
    countries: [id, nl, gb]
    body:
      - Jayakarta was a small pepper port of a few thousand people at the mouth of the Ciliwung, ruled by its own prince under the sultan of Banten, the great pepper port 80 km to the west. The Dutch East India Company (VOC) had bought land for a warehouse there in 1610 and the English East India Company had a post across the river. Jan Pieterszoon Coen, who became governor-general in 1618, wanted a permanent headquarters free of Banten’s tolls and began to fortify the Company’s buildings, against the wishes of the prince, Wijayakrama. Relations with Mataram were also breaking down; in 1618 Mataram’s regent burned the Company’s post at Jepara, and Dutch ships burned the town in reprisal.
      - In December 1618 an English fleet of about fifteen ships under Sir Thomas Dale arrived off Jayakarta. The two fleets fought on 20 December and faced each other again at the end of the month without a decision, and Coen, outnumbered, sailed east to the Moluccas to gather ships and men, leaving a garrison in the fort. The prince and the English set up batteries against it; in January 1619 the prince’s men seized the fort’s commander, Pieter van den Broecke, during talks, and the garrison, short of food and powder, negotiated terms for handing the fort over to the English.
      - Banten intervened before the handover. Its regent, Pangeran Arya Ranamanggala, would not see the English replace the Dutch in his vassal’s port. In February 1619 his troops occupied Jayakarta, deposed Wijayakrama and sent him into exile at Tanara, and forced the English to withdraw. The Dutch garrison stayed in its fort, which in March it named Batavia, after the ancient people of the Netherlands.
