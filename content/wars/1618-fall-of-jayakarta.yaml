notes:
  - Jayakarta, the old Sunda Kelapa, was ruled by princes descended from Fatahillah, who had taken it for Demak in 1527, under the overlordship of Banten. Sources name the prince of 1618–1619 Wijayakrama, Pangeran Jayakarta or Jayawikarta. Banten’s regent Ranamanggala distrusted both the Dutch and his vassal’s alliance with the English, so Jayakartans and Bantenese did not always fight on the same side.
  - Dutch, English and Indonesian accounts differ on the dates of the fighting in January–March 1619 and on whether the Dutch garrison actually surrendered; the account here follows the main events on which they agree.
