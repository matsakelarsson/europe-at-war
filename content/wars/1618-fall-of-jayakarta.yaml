id: fall-of-jayakarta
name: Fall of Jayakarta and the founding of Batavia
start: "1618-12"
end: "1619-05-30"
tier: B
summary: "The struggle for the port of Jayakarta (Jakarta), at the mouth of the Ciliwung in western Java, between the Dutch East India Company (VOC), the English East India Company, the town’s ruler and the sultanate of Banten, which ended with the Dutch destruction of the town and the founding of Batavia, the Company’s capital in Asia for more than three centuries. Governor-General Jan Pieterszoon Coen had turned the Company’s warehouses at Jayakarta into a fort. In December 1618 an English fleet under Sir Thomas Dale arrived, and after inconclusive fighting at sea Coen sailed to the Moluccas for reinforcements. The prince of Jayakarta, Wijayakrama, and the English besieged the Dutch fort and seized its commander, Pieter van den Broecke, at talks, and the garrison agreed to surrender to the English. But Banten, Jayakarta’s overlord, would not let the English have the fort: in February 1619 its regent, Pangeran Arya Ranamanggala, sent troops who removed the prince and pushed the English out, and the Dutch held on, naming their fort Batavia. Coen returned with about 1,000 men and 16 ships on 28 May 1619, stormed Jayakarta on 30 May and burned it to the ground. On its site the Company built the castle and walled town of Batavia, settled with people from elsewhere, while Banten remained hostile for decades."
