  - title: Hong Taiji at Beijing
    date: December 1629 – June 1630
    when: "1629-12"
    borders: "1630-02-01"
    countries: [cn]
    body:
      - In the summer of 1629 Yuan Chonghuan had Mao Wenlong put to death on an island off Lüshun, on charges of insubordination and misuse of funds, which weakened the Ming command on the sea. Hong Taiji, unable to break the line at Ningyuan and Jinzhou, went around it. With his Mongol allies he marched west through the lands of the Kharachin and in the winter of 1629 broke through the Great Wall at the Longjing and Da’an passes, north-east of Beijing, the first time a Later Jin army had crossed the Wall. Zunhua fell with the help of defectors. The episode is known in China as the Jisi incident, after the name of the year in the sixty-year cycle.
      - Yuan hurried from Shanhai Pass with his best troops and fought the Jurchens outside the gates of Beijing in December, driving them back from the walls. But the capital was in panic, Yuan was blamed for letting the enemy through, and Hong Taiji let captured eunuchs overhear talk of a secret agreement with him. The Chongzhen Emperor had Yuan arrested on 13 January 1630, and on 22 September 1630 he was executed by slow slicing in a Beijing market. Man Gui, who took over the defence, was killed in battle near the capital.
      - In January 1630 the Later Jin took Yongping and held it with Zunhua, Qian’an and Luanzhou when Hong Taiji went back to Shenyang in the spring. Ming troops under Sun Chengzong, recalled to command, retook the four cities by June 1630. Amin, who had commanded there and killed many of the townspeople before retreating, was stripped of his rank and imprisoned by Hong Taiji.
    facts:
      - [Great Wall breached, "winter 1629"]
      - [Battles outside Beijing, "December 1629 – January 1630"]
      - [Yuan Chonghuan arrested, "13 January 1630"]
      - [Yuan Chonghuan executed, "22 September 1630"]
    markers:
      - kind: taken
        side: jin
        name: Zunhua
        date: December 1629
        text: The first walled city inside the Great Wall to fall to the Later Jin.
        lonlat: [117.965, 40.189]
      - kind: battle
        side: mg
        name: Beijing
        date: December 1629 – January 1630
        text: Yuan Chonghuan and Zu Dashou drove the Jurchens back from the walls. Yuan was arrested in the city on 13 January 1630.
        lonlat: [116.397, 39.908]
        lp: l
      - kind: taken
        side: jin
        name: Yongping
