  - title: Songshan and Jinzhou
    date: 1640–1643
    when: "1641-09"
    borders: "1642-04-30"
    countries: [cn]
    body:
      - From 1640 the Qing set up farming garrisons at Yizhou, close to Jinzhou, to keep a besieging army in the field, and in the spring of 1641 Jirgalang closed the ring round Jinzhou, where Zu Dashou held out again. The Chongzhen Emperor sent Hong Chengchou, his ablest general, with about 130,000 men and eight commanders, among them Wu Sangui. Hong wanted to advance slowly and fortify as he went, but the court pressed for a quick relief, and in 1641 his army camped at Songshan, a few kilometres south of Jinzhou.
      - In the autumn of 1641 Hong Taiji came from Shenyang with fresh troops, cut the Ming army’s communications with the coast and Xingshan and seized its grain stores. The Ming commanders broke ranks and fled south along the coast towards Xingshan, Tashan and Ningyuan, and many of their men were cut down or drowned; the Qing claimed some 50,000 to 60,000 killed. Wu Sangui escaped to Ningyuan. Hong Chengchou was shut up in Songshan with about 10,000 men.
      - In March 1642 an officer opened Songshan to the Qing, and Hong Chengchou was taken; he later served the Qing and directed much of their conquest of the south. Zu Dashou surrendered Jinzhou on 8 April 1642, and Tashan and Xingshan fell in April. The Ming kept only Ningyuan and the forts between it and Shanhai Pass, held by Wu Sangui. In the winter of 1642–1643 a Qing army under Abatai crossed the Wall again and ravaged north China as far as southern Shandong for seven months. Hong Taiji died on 21 September 1643; his five-year-old son Fulin succeeded as the Shunzhi Emperor, with Dorgon and Jirgalang as regents, and in the autumn Jirgalang took three of the forts between Ningyuan and the pass.
    facts:
      - [Hong Chengchou’s army, "about 130,000"]
      - [Ming losses near Songshan, "about 50,000–60,000"]
      - [Songshan falls, "March 1642"]
      - [Zu Dashou surrenders Jinzhou, "8 April 1642"]
      - [Death of Hong Taiji, "21 September 1643"]
