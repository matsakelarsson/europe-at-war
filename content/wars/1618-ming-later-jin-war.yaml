  - title: Dalinghe
    date: September – November 1631
    when: "1631-09-01"
    borders: "1631-11-21"
    countries: [cn]
    body:
      - In 1631 the Ming began a new fort on the Daling river, beyond Jinzhou, as a first step back into Liaodong. Zu Dashou was inspecting the work with about 14,000 soldiers, and as many workers and civilians, when Hong Taiji arrived at the beginning of September. This time the Later Jin brought heavy guns of their own, European-type cannon cast in Shenyang that year and served by a new corps of Han Chinese gunners under Tong Yangxing. They surrounded Dalinghe with trenches and walls and bombarded the outlying forts into surrender.
      - The Ming sent relief armies from Jinzhou, Songshan and Shanhai Pass, and on 19 October the main relief force under Zhang Chun was beaten in the field. Inside the fort the food ran out and people turned to cannibalism; of about 30,000 people, fewer than 12,000 survived. On 21 November Zu Dashou surrendered. Zu promised to deliver Jinzhou by a ruse, was let go, and once inside its walls stayed with the Ming, holding the city for ten more years. Many of his officers stayed in Later Jin service and strengthened its Han Chinese corps.
    facts:
      - [Siege, "September – 21 November 1631"]
      - [Garrison, "about 14,000 soldiers, about 30,000 people in all"]
      - [Survivors, "fewer than 12,000"]
    markers:
