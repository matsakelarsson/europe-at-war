  - title: The Qing and the great raids
    date: 1636–1639
    when: "1636-05-15"
    borders: "1639-02-15"
    countries: [cn]
    body:
      - After the Chahar Mongols submitted in 1635, Hong Taiji renamed the Jurchens Manchus, and in May 1636, in Shenyang, he took the title of emperor of a new dynasty, the Great Qing, before Manchu, Mongol and Han Chinese officials. That winter he invaded Korea again and forced it to break with the Ming. In the summer of 1636 an army under Ajige crossed the Great Wall north of Beijing, fought around the capital and withdrew with many captives and much livestock.
      - "In the autumn of 1638 two larger armies, under Dorgon and Yoto, broke through the Wall east and west of Beijing, passed the capital and swept south through Hebei into Shandong; Britannica counts forty cities sacked. The Ming supreme commander Lu Xiangsheng, left with a few thousand starving men, was killed fighting at Jiazhuang near Julu in January 1639. In February the Qing took Jinan, the capital of Shandong, and carried off the Prince of De, a member of the imperial family; Yoto died there of illness. In the spring of 1639 the armies returned through the Wall with a huge train of captives and plunder."
      - The raids did not aim to hold land. They brought the Qing wealth and people, many of them made bondservants, showed how weak the Ming defences inside the Wall had become, and pulled the Ming’s best commanders, Hong Chengchou and Sun Chuanting among them, away from fighting the rebels in the interior.
    facts:
      - [Qing dynasty proclaimed, "May 1636, in Shenyang"]
      - [Raids through the Great Wall, "1636, 1638–1639 (and 1642–1643)"]
      - [Death of Lu Xiangsheng, "January 1639"]
      - [Jinan taken, "February 1639"]
