  - title: Rebel troops, cannon and Lüshun
    date: 1631–1634
    when: "1632-02-22"
    borders: "1633-08-01"
    countries: [cn]
    body:
      - The Ming had their own modern guns. In Dengzhou on the Shandong coast, the governor Sun Yuanhua, a Christian convert and student of Western gunnery, trained troops with Portuguese instructors and cannon, among them former officers of Mao Wenlong such as Kong Youde and Geng Zhongming. In late 1631 Kong’s regiment, sent overland to relieve Dalinghe without pay or food, rose against its officers at Wuqiao in Hebei and turned back. On 22 February 1632 the rebel troops took Dengzhou with the help of Geng inside the walls, capturing its cannon and arsenal. Ming troops besieged them for a year. Sun Yuanhua was blamed and executed in 1633.
      - In the spring of 1633 Kong and Geng escaped by sea with their followers, their ships and many cannon and went over to the Later Jin, whom Hong Taiji received with honour. With their help Later Jin forces took Lüshun at the tip of the Liaodong peninsula, the Ming naval base that had supplied the islands; its commander, Huang Long, killed himself. Most accounts date the siege to 1633, the Wikipedia article on it to the summer of 1634. In 1634 Shang Kexi, another of Mao Wenlong’s officers, came over from the islands. The three were later made princes of the Qing.
      - In the summer of 1634, after his campaign against the Chahar, Hong Taiji led an army through the Wall into the Ming frontier districts of Xuanfu and Datong and plundered them.
    facts:
      - [Revolt at Wuqiao, "late 1631"]
      - [Dengzhou taken by Kong Youde’s troops, "22 February 1632"]
      - [Kong Youde and Geng Zhongming join the Later Jin, "spring 1633"]
      - [Lüshun taken, "1633 (some accounts 1634)"]
    markers:
      - kind: event
        name: Wuqiao
        date: Late 1631
        text: Kong Youde’s regiment, on its way to Dalinghe, rose against its officers here and turned back towards Shandong.
        lonlat: [116.390, 37.630]
      - kind: event
