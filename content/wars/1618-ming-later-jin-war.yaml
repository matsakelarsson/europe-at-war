  - title: Guangning and the retreat to Shanhai Pass
    date: 1622–1625
    when: "1622-02-10"
    borders: "1622-03-11"
    countries: [cn]
    body:
      - The Ming made Guangning, west of the Liao river, their new headquarters, under the governor Wang Huazhen, while Xiong Tingbi, recalled as military commissioner, sat at Shanhai Pass with few troops. Wang wanted to strike back with Mao Wenlong and the Mongols; Xiong wanted to hold the line. In February 1622 Nurhaci crossed the frozen Liao, took the fort of Xiping and destroyed the armies sent to relieve it. The officer Sun Degong handed Guangning to the Jurchens, Wang fled, and Xiong could only cover the retreat of soldiers and refugees to Shanhai Pass, the eastern end of the Great Wall. More than forty Ming forts west of the Liao were abandoned. Both commanders were later executed, Xiong in 1625 and Wang in 1632.
      - Nurhaci did not hold the empty lands of Liaoxi, and the Ming slowly came back. Sun Chengzong, grand secretary and from 1622 commander at Shanhai Pass, built a new line of forts from the pass to Ningyuan and on towards Jinzhou, and gave Ningyuan to a young official, Yuan Chonghuan, who rebuilt its walls in 1623 and armed them with Portuguese-type cannon, some of them obtained through Macau, which the Ming called “red barbarian cannon” (hongyipao). In April 1625 Nurhaci moved his capital to Shenyang.
      - At the end of 1625 Sun was replaced by Gao Di, who ordered all forces outside Shanhai Pass to withdraw. Yuan Chonghuan refused to leave Ningyuan.
    facts:
      - [Battle of Guangning, "10 February – 11 March 1622"]
      - [Ming troops at Guangning, "about 36,000; 16,000 or more lost"]
      - [Ningyuan rebuilt, "1623"]
