  - title: Ningyuan and Jinzhou
    date: May – June 1627
    when: "1627-05"
    borders: "1627-06-01"
    countries: [cn]
    body:
      - Hong Taiji first secured his rear. Early in 1627 a Later Jin army under his cousin Amin invaded Joseon, Mao Wenlong’s supplier, and forced its king to make peace on Later Jin terms. In May he turned on the Ming with about 40,000 men and besieged Jinzhou, at the front of Yuan Chonghuan’s line. Zhao Shuaijiao held the walls against repeated assaults, one of which cost the Jurchens two to three thousand men.
      - Hong Taiji then marched on Ningyuan, where Man Gui, You Shilu and Zu Dashou met his army outside the walls with Yuan’s cannon behind them. After losing several thousand more men he withdrew. The Ming court called it the great victory of Ning–Jin, but Yuan was attacked by the faction of the eunuch Wei Zhongxian for holding talks with the enemy and for failing to help Korea, and he resigned. After the Tianqi Emperor died, his brother, the Chongzhen Emperor, who came to the throne on 2 October 1627, recalled Yuan in 1628 as commander of the whole north-east, and Yuan promised to recover Liaodong within five years.
    facts:
      - [Later Jin army, "about 40,000"]
      - [Jurchen losses, "several thousand at Ningyuan, 2,000–3,000 in one assault on Jinzhou"]
