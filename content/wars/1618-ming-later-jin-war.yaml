  - title: Sarhu
    date: April – autumn 1619
    when: "1619-04-14"
    borders: "1619-04-18"
    countries: [cn, kr]
    body:
      - "Yang Hao gathered about 88,000 Ming troops at Shenyang, with some 10,000 Yehe warriors and 13,000 soldiers sent by Joseon Korea under Gang Hong-rip; the Ming announced a force of 470,000. His plan was for four columns to converge on Hetu Ala from four directions: Du Song from Shenyang by way of Fushun, Ma Lin with the Yehe from Kaiyuan in the north, Liu Ting with the Koreans from Kuandian in the south-east and Li Rubai from Qinghe in the south. Snow delayed the start, the commanders were at odds, and the columns were too far apart to support each other. Nurhaci, with perhaps 60,000 men, kept his army together and struck the columns one at a time."
      - Du Song, eager to arrive first, crossed the Hun river on 14 April, left part of his army in a camp at Sarhu and led the rest against the Jurchen fort at Jiefan. Nurhaci overran the camp at Sarhu, then the force at Jiefan; Du Song was killed. The next day the Jurchens routed Ma Lin’s camps at Shangjianya, north-west of Sarhu, and the Yehe turned back. Liu Ting, who had not heard of the defeats, was ambushed at the Abudali ridge in today’s Huanren county and killed, and the Korean troops at Fuca, beyond him, surrendered; Gang Hong-rip was kept prisoner. Li Rubai was ordered back before he reached the enemy. By the Ming count 45,870 soldiers and 310 officers were lost in five days.
      - Sarhu decided the war in Liaodong. Nurhaci took Kaiyuan in July and Tieling in September 1619, and in the autumn he destroyed the Yehe, completing the union of the Jurchens. The Ming sent Xiong Tingbi to Liaodong, who rebuilt its defences in 1619–1620 before he was recalled.
    facts:
      - [Ming army, "about 88,000, with 13,000 Koreans and some 10,000 Yehe"]
      - [Later Jin army, "about 60,000"]
      - [Battles, "14–18 April 1619"]
      - [Ming losses, "45,870 soldiers and 310 officers (Ming count)"]
      - [Kaiyuan and Tieling, "July and 3 September 1619"]
