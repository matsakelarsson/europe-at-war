  - title: Shenyang and Liaoyang
    date: Spring 1621
    when: "1621"
    borders: "1621-06-01"
    countries: [cn]
    body:
      - In the spring of 1621 Nurhaci attacked the heart of Liaodong. Shenyang, defended by He Shixian and You Shigong, fell after the Jurchens lured part of the garrison out of the walls; both commanders were killed. A relief army coming up from the south, including troops from Sichuan, was destroyed on the Hun river. A few days later the Jurchens took Liaoyang, the seat of the Ming government of Liaodong, after its defenders sortied and were beaten; the governor, Yuan Yingtai, killed himself. The Ming lost some 70,000 men in the campaign, and with the two cities went all of Liaodong east of the Liao river.
      - Nurhaci made Liaoyang his capital and kept many Ming officials and officers in their posts. For the first time the Later Jin ruled a large Han Chinese farming population, which it settled together with the Jurchens and taxed in grain. Refugees fled to the coast, to Korea and to the islands of the Bohai Sea, and there was unrest that Nurhaci met with harsh measures. In July 1621 the Ming officer Mao Wenlong, with fewer than two hundred men, seized Zhenjiang on the Yalu by night; from 1622 he held the island of Pi (Ka) off the Korean coast, from which his troops raided behind the Jurchen lines for the rest of the decade.
    facts:
      - [Shenyang and Liaoyang taken, "spring 1621, within days of each other"]
      - [Ming losses, "about 70,000"]
      - [Later Jin capital, "Liaoyang from 1621, Shenyang from April 1625"]
    markers:
