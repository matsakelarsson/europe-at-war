  - title: Ningyuan
    date: February 1626
    when: "1626-02"
    borders: "1626-02-10"
    countries: [cn]
    body:
      - In February 1626 Nurhaci crossed the Liao with an army that Later Jin records put at 130,000 men; modern estimates are much lower. He passed the forts the Ming had abandoned on Gao Di’s orders and laid siege to Ningyuan, held by Yuan Chonghuan with about 20,000 men and his cannon, served by gunners from Fujian. Yuan had burned the suburbs, brought the people inside and sworn his officers, Man Gui and Zu Dashou among them, to hold.
      - For several days the Jurchens attacked the walls in bitter cold, with shielded carts and parties trying to dig through the frozen ramparts, and the guns on the walls cut them down. Meanwhile Nurhaci sent Mongol cavalry under Wunage across the sea ice to Juehua Island, where they killed thousands of defenders and burned the grain stores. But Ningyuan held, and Nurhaci withdrew to Shenyang, his first defeat in more than forty years of war.
      - Nurhaci died on 30 September 1626. Ming accounts say he had been wounded by cannon fire at Ningyuan, and the story is often repeated, but Later Jin records mention only illness. His eighth son, Hong Taiji, was chosen khan.
    facts:
      - [Siege of Ningyuan, "February 1626"]
      - [Ming garrison, "about 20,000, with 7,000 on Juehua Island"]
      - [Death of Nurhaci, "30 September 1626"]
    markers:
