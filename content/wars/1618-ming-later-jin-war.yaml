steps:
  - title: The Seven Grievances and Fushun
    date: May – summer 1618
    when: "1618-05-07"
    borders: "1618-07-01"
    countries: [cn]
    body:
      - Nurhaci, a chief of the Jianzhou Jurchens in the hills east of the Ming province of Liaodong, had spent thirty years uniting the Jurchen tribes by war and marriage, while holding Ming titles and trading horses, furs and ginseng at the Ming frontier markets. He organised his people into the military and social units of the Eight Banners and had a script made for the Jurchen language, and in 1616 he proclaimed himself khan of a new state, the Later Jin, at his capital Hetu Ala. Only the Yehe in the north, protected by the Ming, still held out against him.
      - On 7 May 1618 Nurhaci announced the Seven Grievances, a list of complaints against the Ming that began with the killing of his father and grandfather by Ming troops in 1583 and went on to Ming support for the Yehe, border violations and the loss of Jurchen farmland, and set out with about 20,000 men. He reached Fushun, the trading town at the edge of Ming territory, on 9 May, and its commander, Li Yongfang, surrendered after a brief fight; Li married into Nurhaci’s family and became the first prominent Ming officer to serve the Later Jin. On 15 May a relief force of about 10,000 under Zhang Chengyin was destroyed. In the summer the Jurchens stormed Qinghe to the south, where the garrison of about 6,400 and its commander Zou Chuxian were killed.
      - The court in Beijing put a price of 10,000 taels of silver on Nurhaci’s head, levied a new surtax for the Liaodong war and began to gather an army under the military commissioner Yang Hao. The war taxes, raised again and again over the next decades, weighed heavily on the Ming countryside.
    facts:
      - [Seven Grievances proclaimed, "7 May 1618"]
      - [Fushun surrenders, "9 May 1618"]
      - [Ming relief force routed, "15 May 1618, about 8,000 killed"]
      - [Qinghe stormed, "summer 1618"]
