  - title: Shanhai Pass
    date: April – May 1644
    when: "1644-05-27"
    borders: "1644-05-27"
    countries: [cn]
    body:
      - In the spring of 1644 the rebel Li Zicheng, who had proclaimed the Shun dynasty at Xi’an, marched on Beijing. The Chongzhen Emperor ordered Wu Sangui to bring his army from Ningyuan to defend the capital, abandoning the last Ming land outside the Great Wall. Wu was on his way when Beijing fell on 24–25 April and the emperor took his own life. Li held Wu’s father in Beijing and called on Wu to submit; Wu turned back to Shanhai Pass, beat two Shun detachments in early May and wrote to Dorgon, the Qing regent, asking for help against the rebels.
      - Dorgon’s army made a forced march to the pass and arrived at dawn on 27 May 1644, when Wu formally submitted to the Qing. Li Zicheng’s army, put at 60,000 or more, attacked Wu’s lines and fought them for hours; in the afternoon, by one account in a sandstorm, the Qing cavalry charged the Shun left wing, and the Shun army broke. Li withdrew to Beijing, had Wu’s father killed and left the city in early June, and Dorgon’s troops entered it. The Qing conquest of the rest of China, which followed, is a story of its own.
    facts:
      - [Fall of Beijing to Li Zicheng, "24–25 April 1644"]
      - [Battle of Shanhai Pass, "27 May 1644"]
      - [Qing troops enter Beijing, "early June 1644"]
    markers:
      - kind: battle
        side: jin
