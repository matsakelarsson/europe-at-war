notes:
  - Chinese and Manchu records date events by the lunar calendar and by reign years. The dates here are the Gregorian dates given in the sources cited; where they convert only a month or a season, so do we. Some English accounts disagree by days or, for Lüshun, by a year.
  - "Names: the Jurchens were renamed Manchus by Hong Taiji in 1635, and the Later Jin (Aisin, “golden”) became the Great Qing in May 1636. Shenyang, the Later Jin capital from 1625, is also known as Mukden or Shengjing. Liaodong here means the Ming province of that name; Liaoxi is its part west of the Liao river, between Jinzhou and Shanhai Pass."
  - Ming and Qing records both tended to inflate the enemy’s numbers and their own victories. Army sizes and losses below are those of the sources, often contemporary claims, and are best read as orders of magnitude.
  - The Later Jin invasions of Joseon Korea in 1627 and 1636–1637, which were part of the same struggle, will be told with the wars of Korea.
