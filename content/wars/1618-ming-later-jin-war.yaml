id: ming-later-jin-war
name: Ming–Later Jin war
start: "1618-05-07"
end: "1644-05-27"
tier: A
summary: "The war in which the Jurchen state of Nurhaci and his son Hong Taiji, the Later Jin, renamed Qing in 1636, took the Ming province of Liaodong and brought Ming China to the edge of collapse. Nurhaci declared war with his Seven Grievances in May 1618 and took Fushun; in April 1619 he destroyed a Ming army of about 90,000 men with a Joseon contingent at Sarhu, and in 1621 he took Shenyang (Mukden) and Liaoyang, the heart of Liaodong. The Ming fell back on a line of fortresses from Shanhai Pass to Ningyuan and Jinzhou, armed with Portuguese-type cannon, and Yuan Chonghuan beat off Nurhaci at Ningyuan (1626) and Hong Taiji at Ningyuan and Jinzhou (1627). Hong Taiji then went round the line through Mongol lands, raiding to the walls of Beijing in 1629–1630, deep into north China in 1636, 1638–1639 and 1642–1643, while his new Han Chinese artillery took Dalinghe (1631) and his allies from the Ming navy brought him Lüshun (1633). After the siege of Jinzhou and the battle of Songshan (1640–1642) only Ningyuan and the approaches to Shanhai Pass were left to the Ming. When Li Zicheng’s rebels took Beijing in April 1644, the Ming general Wu Sangui let the Qing through Shanhai Pass, and the battle there on 27 May 1644 opened the Qing conquest of China."
countries: [cn, kr]
