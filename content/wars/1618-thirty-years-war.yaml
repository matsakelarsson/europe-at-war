  - title: Magdeburg and Breitenfeld
    date: "1631"
    when: "1631"
    borders: "1630"
    countries:
      - se
    view:
      center:
        - 11.0017
        - 52.1361
      size:
        - 667
        - 634
    body:
      - In May 1631 Imperial troops under Tilly stormed the Protestant city of Magdeburg before the Swedes could relieve it, killing some 20,000 people. The massacre pushed wavering Protestant princes toward Sweden, and Saxony joined Gustav Adolf.
      - On 17 September 1631, at Breitenfeld north of Leipzig, the Swedish-Saxon army of about 40,000 routed Tilly’s 31,000, even after the Saxons fled early in the battle. The king then swept west through Franconia to winter at Mainz on the Rhine.
    facts:
      - - Swedish-Saxon army
        - About 40,000
      - - Imperial army
        - About 31,000
    markers:
      - kind: siege
        side: foe
        name: Sack of Magdeburg
        date: 20 May 1631
        lonlat:
          - 11.6301
          - 52.1303
        lp: l
        text: Tilly’s army stormed the city after a two-month siege. Most of its inhabitants died in the massacre and fire that followed.
      - kind: battle
        side: se
        name: Battle of Breitenfeld
        date: 17 September 1631
        lonlat:
          - 12.3786
          - 51.42
        text: The first great Protestant victory of the war. The Saxons broke, but the Swedish brigades held and destroyed Tilly’s army.
      - kind: event
        side: se
        name: Winter quarters at Mainz
        date: Winter 1631–32
        lonlat:
          - 8.2692
          - 50.0007
        lp: b
        text: After conquering Franconia the king set up his winter quarters on the Rhine.
