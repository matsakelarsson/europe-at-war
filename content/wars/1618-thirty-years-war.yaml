  - title: Magdeburg and Breitenfeld
    date: "1631"
    when: "1631"
    borders: "1630"
    countries:
      - se
      - de
    view:
      center:
        - 11.0017
        - 52.1361
      size:
        - 667
        - 634
    body:
      - In May 1631 Imperial troops under Tilly stormed the Protestant city of Magdeburg before the Swedes could relieve it, killing some 20,000 people. The massacre pushed wavering Protestant princes toward Sweden, and Saxony joined Gustav Adolf.
      - On 17 September 1631, at Breitenfeld north of Leipzig, the Swedish-Saxon army of about 40,000 routed Tilly’s 31,000, even after the Saxons fled early in the battle. The king then swept west through Franconia to winter at Mainz on the Rhine.
    facts:
