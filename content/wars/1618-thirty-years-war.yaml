  - title: France enters the war, and the Year of Corbie
    date: 1635–1636
    when: "1635-05-19"
    borders: "1636-11-14"
    countries: [fr, be, es, de]
    side_names:
      foe: Imperial and Bavarian success
    move_names:
      foe: Imperial and Bavarian moves
    body:
      - After the Swedish defeat at Nördlingen and the Peace of Prague, Cardinal Richelieu could no longer fight the Habsburgs only through allies and subsidies. When Spanish troops seized Trier in March 1635 and carried off its archbishop-elector, who was under French protection, France declared war on Spain on 19 May. A French army won at Les Avins in the Spanish Netherlands the next day, but with its Dutch allies it failed before Leuven and melted away through disease and desertion. In October France took Bernhard of Saxe-Weimar’s German army into its pay.
      - In July 1636 the Cardinal-Infante Ferdinand, governor of the Spanish Netherlands, invaded Picardy with Spanish troops and imperial cavalry under Ottavio Piccolomini and the Bavarian general Johann von Werth. They took La Capelle and Le Catelet, forced the Somme on 5 August and took Corbie on 15 August, while their horsemen raided as far as Compiègne and panic spread in Paris, about 120 km away. Louis XIII raised a new army, the invaders withdrew, and Corbie was retaken on 14 November. In the east an imperial invasion of Burgundy under Matthias Gallas stalled at Saint-Jean-de-Losne.
    facts:
      - [France declares war on Spain, "19 May 1635"]
      - [Corbie, "Taken by Spain 15 August, retaken 14 November 1636"]
      - [Known in France as, "l’année de Corbie, the Year of Corbie"]
    markers:
      - kind: taken
        side: es
        name: Trier
        date: 26 March 1635
        text: Spanish troops from Luxembourg surprised the city and captured Archbishop-Elector Philipp Christoph von Sötern, who had put himself under French protection. He was held prisoner for ten years.
        lonlat: [6.637, 49.75]
      - kind: event
        side: fr
        name: Brussels
        date: 19 May 1635
        text: A French herald brought the declaration of war to the capital of the Spanish Netherlands, opening a war with Spain that lasted until 1659.
        lonlat: [4.352, 50.847]
        lp: l
      - kind: battle
        side: fr
        name: Battle of Les Avins
        date: 20 May 1635
        text: Marshals Châtillon and Brézé beat a smaller Spanish army under Prince Thomas of Savoy near Huy.
        lonlat: [5.283, 50.4]
      - kind: held
        side: es
        name: Leuven
        date: June – July 1635
        text: The French and Dutch besieged the city for about ten days and then withdrew, their armies wasted by disease, hunger and desertion.
        lonlat: [4.701, 50.879]
      - kind: taken
        side: es
        name: La Capelle
        date: 8 July 1636
        text: The frontier fortress surrendered after a short siege, opening the road into Picardy.
        lonlat: [3.916, 49.973]
      - kind: siege
        side: es
        name: Corbie
        date: 15 August 1636
        text: The fortress on the Somme above Amiens surrendered after a week. A French army of some 50,000 men won it back on 14 November after a six-week siege.
        lonlat: [2.508, 49.91]
      - kind: held
        side: fr
        name: Saint-Jean-de-Losne
        date: November 1636
        text: The small Burgundian town on the Saône held out against Gallas’s army, which then retreated, weakened by hunger and disease.
        lonlat: [5.264, 47.103]
    arrows:
      - side: es
        label: Cardinal-Infante
        phase: 1
        via: [[3.95, 50.45], [3.92, 50.0], [3.0, 49.92], [2.55, 49.91]]
