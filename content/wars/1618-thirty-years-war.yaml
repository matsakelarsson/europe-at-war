  - title: France against Bavaria in the south
    date: 1643–1645
    when: "1643-11-24"
    borders: "1645-08-03"
    countries: [de, fr]
    side_names:
      foe: Bavarian and Imperial success
    move_names:
      foe: Bavarian and Imperial moves
    body:
      - In 1638 Bernhard of Saxe-Weimar, a German Protestant general in French pay, took the Habsburg fortress of Breisach on the upper Rhine, and after his death in 1639 France took over his army and his conquests. It fought Bavaria for south-west Germany. In November 1643 Marshal Guébriant took Rottweil but died of his wounds, and on 24 November the Bavarian general Franz von Mercy, with Johann von Werth and Lorraine troops, surprised the French army in its winter quarters at Tuttlingen and captured most of it. In July 1644 Mercy took Freiburg im Breisgau.
      - The young Duke of Enghien, the future Great Condé, joined Turenne with fresh troops, and on 3, 5 and 9 August they stormed Mercy’s entrenchments on the wooded hills around Freiburg in some of the bloodiest fighting of the war. Mercy withdrew in good order, but the French went on to take Philippsburg, Speyer, Worms and Mainz. In May 1645 Mercy surprised Turenne at Herbsthausen, but on 3 August Enghien, Turenne and their Hessian allies beat the Bavarians at Allerheim near Nördlingen. Mercy was killed, and both armies were so badly mauled that the French fell back to the Rhine.
    facts:
      - [Battle of Tuttlingen, "24 November 1643, Bavarian victory"]
      - [Battle of Freiburg, "3–9 August 1644, indecisive"]
      - [Battle of Allerheim, "3 August 1645, French victory; Mercy killed"]
    markers:
      - kind: held
        side: fr
        name: Breisach
        date: 1638–1648
        text: Bernhard of Saxe-Weimar starved the Rhine fortress into surrender in December 1638. France kept it in the Peace of Westphalia, together with the Habsburg lands in Alsace.
        lonlat: [7.584, 48.033]
        lp: l
      - kind: taken
        side: fr
        name: Rottweil
        date: 19 November 1643
        text: Guébriant took the imperial city but was mortally wounded during the siege, leaving the army to the less able Josias Rantzau.
        lonlat: [8.625, 48.168]
      - kind: battle
        side: foe
        name: Battle of Tuttlingen
        date: 24 November 1643
        text: Mercy’s and Werth’s cavalry fell on the scattered French quarters. Some 7,000 men were captured, Rantzau among them, and the French army in Germany ceased to exist for a time.
        lonlat: [8.821, 47.981]
      - kind: battle
        name: Battle of Freiburg
        date: 3–9 August 1644
        text: Three days of assaults on Mercy’s fortified lines cost the French perhaps 8,000 men and the Bavarians about half as many. Mercy then withdrew through the Black Forest.
        lonlat: [7.87, 47.98]
      - kind: taken
        side: fr
        name: Philippsburg
        date: 12 September 1644
        text: The capture of this fortress, and of the cities of the middle Rhine, gave France control of the river. The Peace of Westphalia let it keep a garrison here.
        lonlat: [8.455, 49.237]
      - kind: battle
        side: foe
        name: Battle of Herbsthausen
        date: 5 May 1645
        text: Mercy surprised Turenne’s army near Mergentheim in Franconia and destroyed most of his infantry.
        lonlat: [9.829, 49.402]
      - kind: battle
        side: fr
        name: Battle of Allerheim
        date: 3 August 1645
        text: Also called the Second Battle of Nördlingen. Each side lost about 4,000 men killed, wounded or captured, and Mercy was killed in the fighting.
        lonlat: [10.617, 48.85]
    arrows:
