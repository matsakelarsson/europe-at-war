steps:
  - title: Defenestration and the Bohemian Revolt
    date: 1618–1619
    when: "1618-05-23"
    borders: "1619-11-04"
    countries: [cz, at, de, sk]
    side_names:
      foe: Imperial success
    move_names:
      foe: Imperial moves
    body:
      - The mostly Protestant estates of Bohemia had won religious freedom from Rudolf II in his Letter of Majesty of 1609, but the choice of the strictly Catholic Ferdinand of Styria as their next king, and quarrels over Protestant churches on church land, convinced them that their rights were in danger. On 23 May 1618 Protestant nobles led by Count Heinrich Matthias Thurn threw two of the king’s regents and their secretary from a window of Prague Castle. All three survived. The estates set up a government of thirty directors and raised an army.
      - In November the mercenary general Ernst von Mansfeld took the Catholic stronghold of Plzeň for the rebels. After Emperor Matthias died in March 1619, Thurn marched through Moravia, which now joined the revolt, to the edge of Vienna, but turned back when the imperial general Bucquoy beat Mansfeld at Sablat on 10 June. On 31 July Bohemia, Moravia, Silesia and the two Lusatias formed a confederation, and in August the estates deposed Ferdinand and elected the Calvinist Elector Palatine, Frederick V. He was crowned in Prague on 4 November, two months after Ferdinand had been elected Emperor.
    facts:
      - [Defenestration of Prague, "23 May 1618"]
      - [Bohemian Confederation, "31 July 1619"]
      - [Frederick V crowned, "4 November 1619, in St Vitus Cathedral"]
    markers:
      - kind: event
        side: pal
        name: Defenestration of Prague
        date: 23 May 1618
        text: The regents Vilém Slavata and Jaroslav Bořita of Martinice and the secretary Philipp Fabricius fell some 20 metres from a window of the Bohemian Chancellery into the castle moat and escaped with their lives. Catholics called it a miracle.
        lonlat: [14.4, 50.091]
      - kind: taken
        side: pal
        name: Plzeň
        date: 21 November 1618
        text: Mansfeld, whose army was paid by the Duke of Savoy, stormed the royal town after a two-month siege.
        lonlat: [13.378, 49.748]
      - kind: battle
        side: foe
        name: Battle of Sablat
        date: 10 June 1619
        text: Bucquoy’s imperial army caught Mansfeld’s smaller force on the march in southern Bohemia and destroyed it. Mansfeld escaped, but the defeat forced Thurn to leave Vienna.
        lonlat: [14.276, 49.132]
      - kind: held
        side: foe
        name: Vienna
        date: June and November 1619
        text: Ferdinand held out in his capital when Thurn reached its suburbs in June, and again in November, when Thurn and Gabriel Bethlen of Transylvania besieged it for a few days.
        lonlat: [16.374, 48.208]
      - kind: taken
        side: pal
        name: Pressburg
        date: October 1619
        text: Gabriel Bethlen, Prince of Transylvania, took the seat of the Hungarian diet as an ally of the Bohemians. The town is today’s Bratislava.
        lonlat: [17.108, 48.149]
        lp: b
    arrows:
      - side: pal
        label: Thurn, 1619
        phase: 1
        via: [[15.0, 49.35], [16.0, 49.1], [16.4, 48.6], [16.37, 48.27]]
      - side: foe
        label: Bucquoy
        phase: 2
