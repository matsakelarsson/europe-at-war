  - title: Banér holds on
    date: 1636–1641
    when: "1636"
    borders: "1630"
    countries:
      - se
      - de
      - cz
    view:
      center:
        - 12.4962
        - 51.4174
      size:
        - 597
        - 725
    body:
      - With Saxony now an enemy, Johan Banér fought back from Sweden’s Baltic base. On 4 October 1636 he and the Scottish general Alexander Leslie beat a larger Imperial-Saxon army at Wittstock in Brandenburg, restoring Swedish power in northern Germany. A new subsidy treaty with France followed in 1638.
      - Banér beat the Saxons again at Chemnitz in 1639 and pushed into Bohemia. In the winter of 1640–41 he struck at Regensburg with French help, then had to fall back. He died at Halberstadt in May 1641.
    facts:
      - - At Wittstock
        - About 18,000 Swedes against about 25,000
      - - French subsidies
        - Treaty of Hamburg, 1638
    markers:
      - kind: battle
        side: se
        name: Battle of Wittstock
        date: 4 October 1636
        lonlat:
          - 12.4907
          - 53.1586
        text: A decisive victory over the Imperial-Saxon army, 93 km north-west of Berlin, which showed the Swedes were not a spent force after Nördlingen.
      - kind: battle
        side: se
        name: Battle of Chemnitz
        date: "1639"
        lonlat:
          - 12.9204
          - 50.8284
        text: Banér defeated the Saxons, opening the way into Bohemia. It may have been his finest battle.
      - kind: event
        side: foe
        name: Strike at Regensburg
        date: Winter 1640–41
        lonlat:
          - 12.0967
          - 49.0178
        text: Banér and the French under Guébriant tried a surprise attack on the city where the Imperial Diet was meeting, but could not take it.
      - kind: event
        side: none
        name: Banér dies
        date: May 1641
        lonlat:
          - 11.0496
          - 51.9005
        lp: l
        text: Worn out by the retreat, Banér died at Halberstadt after naming Lennart Torstenson his successor.
