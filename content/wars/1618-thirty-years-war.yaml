id: thirty-years-war
name: Thirty Years’ War
start: "1618"
end: "1648"
tier: A
summary: The long war in the Holy Roman Empire between the Catholic Emperor and his allies and Protestant princes backed by foreign powers, which devastated much of Germany. Denmark–Norway fought in it in 1625–1629 and Sweden from 1630; by the Peace of Westphalia in 1648 Sweden gained Western Pomerania, Wismar and Bremen-Verden.
