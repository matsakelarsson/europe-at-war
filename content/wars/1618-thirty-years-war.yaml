  - title: Into Bavaria, and death at Lützen
    date: "1632"
    when: "1632"
    borders: "1630"
    countries:
      - se
      - de
    view:
      center:
        - 10.8532
        - 49.8155
      size:
        - 524
        - 530
    body:
      - In April 1632 the Swedes forced the river Lech at Rain over a pontoon bridge. Tilly was mortally wounded, and on 17 May the king rode into Munich. Wallenstein, back in command of the Emperor’s armies, then pinned him at Nuremberg, where a costly assault on Wallenstein’s camp at the Alte Veste failed in September.
      - The armies met again at Lützen on 16 November 1632. Sweden won the battle, but Gustav II Adolf was killed. His five-year-old daughter Christina became queen, and Chancellor Axel Oxenstierna took charge of the war.
    facts:
      - - Killed at Lützen
        - Gustav II Adolf, aged 37
      - - New ruler
        - Queen Christina, with a regency
    markers:
      - kind: battle
        side: se
        name: Battle of Rain
        date: 15 April 1632
        lonlat:
          - 10.908
          - 48.6794
        lp: l
        text: Finnish cavalry crossed first, under fire. Tilly was badly wounded and died two weeks later.
      - kind: taken
        side: se
        name: Munich
        date: 17 May 1632
        lonlat:
          - 11.5789
          - 48.1394
        text: The Bavarian capital paid a heavy ransom to avoid being plundered. It was the deepest Swedish thrust into the Empire.
      - kind: battle
        side: foe
        name: Battle of the Alte Veste
        date: 3–4 September 1632
        lonlat:
          - 10.969
          - 49.4498
        text: Gustav Adolf attacked Wallenstein’s entrenched camp outside Nuremberg and was beaten back with heavy losses.
      - kind: battle
        side: se
        name: Battle of Lützen
        date: 16 November 1632
        lonlat:
          - 12.1398
          - 51.2597
        text: A hard-fought Swedish victory over Wallenstein, paid for with the life of the king, who was killed in the fighting.
