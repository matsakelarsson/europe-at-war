  - title: Nördlingen and the Peace of Prague
    date: 1633–1635
    when: "1633"
    borders: "1630"
    countries:
      - se
      - de
      - pl
      - es
    view:
      center:
        - 13.4599
        - 51.4604
      size:
        - 981
        - 898
    body:
      - Oxenstierna kept the war going through the Heilbronn League of German Protestant states, paid for by France. But on 6 September 1634 an Imperial army, reinforced by 15,000 Spanish troops, crushed the Swedish-German army at Nördlingen. The Swedes had to pull out of Bavaria.
      - In May 1635 Saxony and other Lutheran princes made the Peace of Prague with the Emperor, leaving Sweden almost alone. To free up troops, Sweden also gave up its Prussian ports in the Truce of Stuhmsdorf with Poland in September 1635, while keeping Livonia with Riga.
    facts:
      - - Swedish losses at Nördlingen
        - About 21,000 killed or captured
      - - Allies lost
        - Saxony and most Lutheran princes
    markers:
      - kind: event
        side: se
        name: Heilbronn League
        date: "1633"
        lonlat:
          - 9.2192
          - 49.1384
        lp: l
        text: An alliance of German Protestant states under Swedish leadership, formed after the king’s death and funded by France.
      - kind: battle
        side: foe
        name: Battle of Nördlingen
        date: 6 September 1634
        lonlat:
          - 10.4875
          - 48.8495
        lp: l
        text: A crushing Imperial-Spanish victory that destroyed the Swedish field army in the south. Some historians call it the pivotal battle of the war.
      - kind: treaty
        side: foe
        name: Peace of Prague
        date: 30 May 1635
        lonlat:
          - 14.4205
          - 50.0784
        text: Saxony and most German Lutheran rulers made peace with the Emperor and abandoned their Swedish alliance.
      - kind: treaty
        side: none
        name: Truce of Stuhmsdorf
        date: 12 September 1635
        lonlat:
          - 19.0309
          - 53.9195
        text: The truce with Poland was extended by 26 years. Sweden gave up the Prussian ports and their tolls, and kept most of Livonia, including Riga.
