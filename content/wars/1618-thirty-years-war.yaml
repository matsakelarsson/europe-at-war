  - title: The last campaigns and the Peace of Westphalia
    date: 1646–1648
    when: "1646"
    borders: "1648"
    countries:
      - se
      - de
      - cz
      - fr
    view:
      center:
        - 11.3785
        - 51.481
      size:
        - 798
        - 919
    body:
      - Carl Gustaf Wrangel and the French under Turenne beat the last Imperial-Bavarian field army at Zusmarshausen on 17 May 1648. Königsmarck’s flying column then surprised Prague in July and looted the castle and the Lesser Town, but students and citizens held the Charles Bridge.
      - Peace was signed at Osnabrück and Münster on 24 October 1648. Sweden gained Western Pomerania with Stettin and Rügen, the port of Wismar, and the bishoprics of Bremen and Verden, together with 5 million thalers and a seat in the Imperial Diet.
    facts:
      - - Gained
        - Western Pomerania, Wismar, Bremen-Verden
      - - Indemnity
        - 5 million thalers
      - - Also
        - Brandenburg got Farther Pomerania, France most of Alsace
    markers:
      - kind: battle
        side: se
        name: Battle of Zusmarshausen
        date: 17 May 1648
        lonlat:
          - 10.5984
          - 48.3996
        text: The last major battle of the war on German soil, won by a Franco-Swedish army under Wrangel and Turenne.
      - kind: siege
        side: none
        name: Battle of Prague
        date: 25 July – 1 November 1648
        lonlat:
          - 14.4205
          - 50.0784
        text: The Swedes took and plundered the west bank of the city, including the castle, but never got across the river. Fighting stopped when news of the peace arrived.
      - kind: treaty
        side: se
        name: Treaty of Osnabrück
        date: 24 October 1648
        lonlat:
          - 8.0482
          - 52.2797
        lp: l
        text: Sweden negotiated its part of the Peace of Westphalia here, in a city held by Protestant forces.
      - kind: taken
        side: se
        name: Wismar
        date: "1648"
        lonlat:
          - 11.4713
          - 53.8891
        lp: l
        text: The Mecklenburg port and the island of Poel became Swedish under the peace.
