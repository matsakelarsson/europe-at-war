  - title: Torstenson on the offensive
    date: 1642–1645
    when: "1642"
    borders: "1630"
    countries:
      - se
    view:
      center:
        - 14.0685
        - 50.2507
      size:
        - 663
        - 592
    body:
      - Lennart Torstenson moved fast. He took Olomouc in Moravia in June 1642 and destroyed an Imperial army at the second battle of Breitenfeld on 2 November 1642.
      - After a lightning campaign against Denmark (next step), he turned south again. At Jankau in Bohemia on 6 March 1645 he routed the Emperor’s army and headed for Vienna, but a long siege of Brno failed and he had to withdraw.
    facts:
      - - Commander
        - Lennart Torstenson
      - - Brno siege
        - 3 May – 23 August 1645, failed
    markers:
      - kind: taken
        side: se
        name: Olomouc
        date: 14 June 1642
        lonlat:
          - 17.2496
          - 49.5885
        text: The Moravian city fell after a short siege and stayed in Swedish hands for the rest of the war.
      - kind: battle
        side: se
        name: Second Battle of Breitenfeld
        date: 2 November 1642
        lonlat:
          - 12.3786
          - 51.42
        text: Fought on the same ground as in 1631. Torstenson turned on the army that had lifted his siege of Leipzig and won crushingly.
      - kind: battle
        side: se
        name: Battle of Jankau
        date: 6 March 1645
        lonlat:
          - 14.979
          - 49.6478
        lp: l
        text: One of the bloodiest battles of the war, about 50 km south-east of Prague. It opened the road to Vienna.
      - kind: held
        side: foe
        name: Siege of Brno
        date: May – August 1645
        lonlat:
          - 16.6075
          - 49.1976
        text: The last fortress between Torstenson and Vienna held out for more than three months. When his Transylvanian allies made peace, he gave up.
