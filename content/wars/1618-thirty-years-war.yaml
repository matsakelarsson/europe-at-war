      - side: pal
        label: Bethlen
        phase: 3
        via: [[18.4, 48.3], [17.6, 48.2], [17.15, 48.16], [16.55, 48.2]]
    areas:
      - style: outline
        side: pal
        label: The Bohemian Confederation, 1619
        atoms: [CZ-PR, CZ-ST, CZ-JC, CZ-PL, CZ-KA, CZ-US, CZ-LI, CZ-KR, CZ-PA, CZ-VY, CZ-JM, CZ-OL, CZ-ZL, CZ-MO, PL-DS, PL-OP, PL-SL~de1930, PL-SL~austria, PL-SL!, DE-SN~olaus, DE-BB~sax~nlaus, PL-LB~sax]
  - title: White Mountain
    date: 1620–1621
    when: "1620"
    borders: "1620-11-08"
    countries: [cz, at, de]
    side_names:
      foe: Imperial and Catholic League success
    move_names:
      foe: Imperial and Catholic League moves
    body:
      - Ferdinand found allies where Frederick found none. In the Treaty of Munich of October 1619 Duke Maximilian of Bavaria put the army of the Catholic League at his disposal in return for his costs and, secretly, Frederick’s electoral title. Lutheran Saxony joined the Emperor for the promise of Lusatia, and Spain sent money and troops. In July 1620 the Protestant Union agreed at Ulm to stay neutral. Maximilian and his general Tilly then occupied Upper Austria, whose estates had joined the rebels, while John George of Saxony took Lusatia and a Spanish army invaded the Rhenish Palatinate.
      - The League and imperial armies under Tilly and Bucquoy marched into Bohemia, and on 8 November 1620 they attacked the Bohemian army under Christian of Anhalt on the White Mountain outside Prague. Within two hours it was routed, and Frederick fled, mocked ever after as the “Winter King”. On 21 June 1621 twenty-seven leaders of the revolt were executed on Prague’s Old Town Square. The rebels’ estates were confiscated, Bohemia became a hereditary Habsburg kingdom, Protestant worship was banned, and tens of thousands of Protestants went into exile.
    facts:
      - [Battle of White Mountain, "8 November 1620, Imperial and League victory"]
      - [Armies, "About 23,000 Imperial and League troops against about 21,000"]
      - [Executions in Prague, "27 leaders of the revolt, 21 June 1621"]
    markers:
      - kind: taken
        side: foe
        name: Linz
        date: August 1620
        text: Maximilian’s League army occupied Upper Austria, which Ferdinand pledged to him for his war costs. Bavaria ruled it until 1628, and its harsh rule led to a great peasant rising in 1626.
        lonlat: [14.286, 48.306]
      - kind: siege
        side: foe
        name: Bautzen
        date: September – October 1620
        text: John George of Saxony, a Lutheran fighting for the Emperor, besieged and took the capital of Upper Lusatia.
        lonlat: [14.424, 51.181]
      - kind: battle
        side: foe
        name: Battle of White Mountain
        date: 8 November 1620
        text: The Bohemian army lost some 2,800 men and its opponents about 650. Prague surrendered the next day without a fight.
        lonlat: [14.321, 50.078]
        lp: l
      - kind: event
        side: foe
        name: Old Town Square
        date: 21 June 1621
        text: Three lords, seven knights and seventeen burghers were beheaded or hanged, and the heads of twelve of them were displayed on the Charles Bridge tower for ten years.
        lonlat: [14.421, 50.087]
        lp: b
      - kind: event
        side: pal
        name: Breslau
        date: Winter 1620–1621
        text: Frederick fled to the Silesian capital, today’s Wrocław, and from there by way of Brandenburg into exile in the Dutch Republic.
        lonlat: [17.039, 51.108]
    arrows:
      - side: foe
        label: Tilly and Bucquoy
        phase: 1
        via: [[14.29, 48.32], [14.47, 48.97], [14.2, 49.5], [14.3, 50.04]]
      - side: foe
        label: John George
        phase: 1
        via: [[13.74, 51.05], [14.1, 51.12], [14.4, 51.17]]
      - side: pal
        label: Frederick’s flight
        phase: 2
        via: [[14.45, 50.1], [15.5, 50.45], [16.4, 50.9], [16.98, 51.1]]
    areas:
      - style: pledged
        side: foe
        label: Upper Austria, pledged to Bavaria 1620–1628
        atoms: [AT-4!, AT-4~muhl]
      - style: occupied
        side: foe
        label: Lusatia, occupied by Saxony
        atoms: [DE-SN~olaus, PL-DS~sax, DE-BB~sax~nlaus, PL-LB~sax]
  - title: The Palatinate lost
    date: 1621–1623
    when: "1621"
    borders: "1623-02-25"
    countries: [de, be, nl, es]
    side_names:
      foe: Imperial and Catholic League success
      pal: Success for Frederick’s allies
    move_names:
      foe: Imperial and Catholic League moves
      pal: Moves by Frederick’s allies
    body:
      - Frederick was placed under the imperial ban in January 1621, and the Protestant Union dissolved itself that spring. Spanish troops already held the Palatinate west of the Rhine, and in the autumn Maximilian’s army took the Upper Palatinate. Frederick’s cause was kept alive by three commanders, Mansfeld, Margrave George Frederick of Baden-Durlach and Christian of Brunswick, the Protestant administrator of Halberstadt. In 1622 Mansfeld beat Tilly at Mingolsheim on 27 April, but Tilly, joined by Spanish troops under Gonzalo de Córdoba, routed Baden-Durlach at Wimpfen on 6 May and caught Christian crossing the Main at Höchst on 20 June.
      - Tilly took Heidelberg in September after a two-month siege, and Mannheim in November. Mansfeld and Christian cut their way through a Spanish army at Fleurus and went into Dutch service. On 25 February 1623, at an assembly of princes at Regensburg, Ferdinand transferred Frederick’s electoral title to Maximilian of Bavaria, despite Protestant protests and Spanish misgivings. When Christian marched again that summer, Tilly caught him at Stadtlohn near the Dutch border on 6 August and destroyed his army. The war in the Empire seemed over, and Frederick lived on in exile in The Hague.
    facts:
      - [Electorate transferred, "25 February 1623, to Maximilian of Bavaria"]
      - [Battle of Wimpfen, "6 May 1622, Catholic victory"]
      - [Battle of Stadtlohn, "6 August 1623; about 6,000 of Christian’s men killed and 4,000 captured"]
    markers:
      - kind: battle
        side: pal
        name: Mingolsheim
        date: 27 April 1622
        text: Mansfeld beat Tilly south of Heidelberg, the only victory of Frederick’s allies in the campaign.
        lonlat: [8.658, 49.217]
        lp: l
      - kind: battle
        side: foe
        name: Battle of Wimpfen
        date: 6 May 1622
        text: Tilly and Córdoba broke the Baden army after an explosion among its powder wagons.
        lonlat: [9.172, 49.197]
      - kind: battle
        side: foe
        name: Battle of Höchst
        date: 20 June 1622
        text: Christian got across the Main with his cavalry and part of his army, but lost his baggage and many men.
        lonlat: [8.547, 50.099]
      - kind: siege
        side: foe
        name: Heidelberg
        date: 23 July – 19 September 1622
        text: The capital of the Palatinate fell to Tilly. Maximilian sent its famous library, the Bibliotheca Palatina, to Rome as a gift to the pope.
        lonlat: [8.705, 49.41]
      - kind: taken
        side: foe
        name: Amberg
        date: "1621"
        text: Bavarian troops occupied the capital of the Upper Palatinate. In 1628 Ferdinand granted the region to Maximilian, and it stayed Bavarian.
        lonlat: [11.858, 49.445]
      - kind: event
        side: foe
        name: Regensburg
        date: 25 February 1623
        text: Ferdinand invested Maximilian with the Palatine electorate, at first for his lifetime only, giving the Catholics a clear majority among the electors.
        lonlat: [12.102, 49.013]
      - kind: battle
        side: es
        name: Battle of Fleurus
        date: 29 August 1622
        text: Córdoba’s Spanish army failed to stop Mansfeld and Christian on their way to the Dutch Republic, but they lost thousands of men, and Christian lost his left arm.
        lonlat: [4.55, 50.483]
      - kind: battle
        side: foe
        name: Battle of Stadtlohn
        date: 6 August 1623
        text: Tilly overtook Christian’s retreating army some 15 km from the Dutch border and destroyed it. Christian himself escaped into the Dutch Republic.
        lonlat: [6.947, 52.02]
    arrows:
      - side: pal
        label: Christian of Brunswick
        phase: 1
        via: [[8.75, 51.72], [8.8, 50.8], [8.58, 50.15]]
      - side: foe
        label: Tilly
        phase: 1
        via: [[9.1, 49.25], [8.85, 49.7], [8.6, 50.05]]
      - side: pal
        label: Mansfeld and Christian
        phase: 2
        via: [[6.2, 49.4], [5.3, 49.9], [4.6, 50.45], [4.8, 51.3]]
      - side: foe
        phase: 3
        via: [[8.9, 51.8], [7.9, 51.95], [7.05, 52.0]]
    areas:
      - style: occupied
        side: foe
        label: Occupied by Bavaria and the League
        atoms: [DE-BY~bav~opf, DE-BW~baden~kpf]
      - style: occupied
        side: es
        label: Occupied by Spain
        atoms: [DE-RP~pfalz, DE-SL~pfalz]
  - title: Christian IV enters the war
    date: 1625 – spring 1626
    when: "1625"
    borders: "1625"
    countries: [dk, de]
    side_names:
      foe: Imperial and Catholic League success
    move_names:
      foe: Imperial and Catholic League moves
    body:
      - By 1625 the Emperor Ferdinand II and the Catholic League had crushed the Bohemian revolt and overrun the Palatinate, and the Protestant princes of northern Germany feared that their lands and their former church estates would be next. Christian IV of Denmark–Norway, who as Duke of Holstein was also a prince of the Empire, took command of the forces of the Lower Saxon Circle in May 1625. He hoped as well to win north German bishoprics for his sons.
      - Christian had few trained troops, and England and the Dutch Republic agreed to pay for more only in the Treaty of The Hague in December 1625. Meanwhile the Emperor gained an army of his own, raised by the Bohemian nobleman Albrecht von Wallenstein and fed by the lands it occupied. In April 1626 Wallenstein beat Christian’s ally Ernst von Mansfeld at the Dessau Bridge on the Elbe, and Mansfeld’s army marched off towards Silesia and Hungary.
    facts:
      - [Christian IV, "King of Denmark–Norway and Duke of Holstein"]
      - [Allies, "German Protestant princes, with English and Dutch subsidies"]
      - [Battle of Dessau Bridge, "25 April 1626, Imperial victory"]
    markers:
      - kind: held
        side: dk
        name: Wolfenbüttel
        date: "1626"
        text: Christian’s headquarters in the duchy of Brunswick, from where he set out against Tilly in the summer of 1626.
        lonlat: [10.537, 52.162]
      - kind: event
        side: foe
        name: Halberstadt
        date: "1625"
        text: Catholic League troops under Tilly occupied this Protestant-held bishopric early in 1625, while Wallenstein’s new imperial army moved against nearby Magdeburg.
        lonlat: [11.05, 51.9]
      - kind: battle
        side: foe
        name: Battle of Dessau Bridge
        date: 25 April 1626
        text: Mansfeld’s attack on Wallenstein’s fortified bridgehead over the Elbe was beaten off with heavy losses.
        lonlat: [12.237, 51.884]
    arrows:
      - side: dk
        label: Christian IV
        via: [[9.6, 53.75], [9.8, 53.0], [10.5, 52.2]]
  - title: Lutter
    date: Summer 1626
    when: "1626-08-27"
    borders: "1626"
    countries: [dk, de]
    side_names:
      foe: Imperial and Catholic League success
    move_names:
      foe: Imperial and Catholic League moves
    body:
      - In late July 1626 Christian led his army out of Wolfenbüttel to seek battle with Tilly’s Catholic League army, not knowing that Wallenstein had sent Tilly more than 4,000 reinforcements. Outmanoeuvred and soaked by torrential rain, the Danes turned back, and for three days their rearguard fought off Tilly’s cavalry. On 27 August Christian decided to stand at Lutter am Barenberge.
      - An unauthorised attack by his right wing drew the whole army into a general advance, which was thrown back with heavy losses. Christian had four horses shot under him and fled with his cavalry. He left behind about 3,000 dead and wounded and all his artillery, and 2,500 more men surrendered the next day; Tilly lost about 700. Most of Christian’s German allies now abandoned him, and he withdrew to winter quarters at Stade.
    facts:
      - [Battle of Lutter, "27 August 1626, Catholic League victory"]
      - [Danish losses, "About 3,000 killed or wounded and 2,500 captured"]
      - [League losses, "About 700 killed or wounded"]
    markers:
      - kind: battle
        side: foe
        name: Battle of Lutter
        date: 27 August 1626
        text: Tilly’s veterans broke the Danish-German army at the foot of the Barenberg, twenty miles from Wolfenbüttel. The survivors who took refuge in Lutter castle surrendered the next day.
        lonlat: [10.27, 51.98]
      - kind: held
        side: dk
        name: Stade
        date: Winter 1626–1627
        text: Unable to hold Wolfenbüttel, Christian moved his winter quarters north to the lower Elbe.
        lonlat: [9.476, 53.6]
    arrows:
      - side: foe
        label: Tilly
        phase: 1
        via: [[9.93, 51.53], [10.1, 51.8], [10.24, 51.96]]
      - side: dk
        label: Retreat to Stade
        phase: 2
        via: [[10.3, 52.05], [9.9, 52.9], [9.5, 53.55]]
  - title: Wallenstein in Jutland
    date: "1627"
    when: "1627-09"
    borders: "1627"
    countries: [dk, de]
    side_names:
      foe: Imperial and Catholic League success
    move_names:
      foe: Imperial and Catholic League moves
    body:
      - In the summer of 1627 Wallenstein brought his army north and joined Tilly, and the Danish forces were swept out of Lower Saxony. In September the two armies invaded Holstein and then pushed up through Schleswig and the Jutland peninsula as far as the Limfjord, while Christian withdrew to the Danish islands, which his navy kept safe. The occupying troops lived off the land, and Jutland suffered heavy requisitions, looting and violence.
      - The Emperor rewarded Wallenstein with the duchy of Mecklenburg, whose dukes had sided with Christian, and in April 1628 named him “General of the Oceanic and Baltic Seas”. Together with Spain he planned an imperial fleet on the Baltic, to be built in the captured ports of Wismar, Rostock and Greifswald. The prospect of Habsburg power on the Baltic alarmed both Denmark and Sweden, which made an alliance in April 1628.
    facts:
      - [Invasion of Holstein, "September 1627"]
      - [Occupied, "Holstein, Schleswig and Jutland, 1627–1629"]
      - [Wallenstein, "Duke of Mecklenburg from January 1628"]
    markers:
      - kind: held
        side: dk
        name: Glückstadt
        date: 1627–1628
        text: Christian IV’s new fortress town on the Elbe held out, supplied by sea.
        lonlat: [9.422, 53.792]
        lp: l
      - kind: taken
        side: foe
        name: Aalborg
        date: "1627"
        text: Imperial troops reached the Limfjord, and Wallenstein planned to use the port for his fleet. The Danes later raided it from the sea and destroyed the naval works.
        lonlat: [9.917, 57.05]
      - kind: event
        side: foe
        name: Güstrow
        date: "1628"
        text: Wallenstein made the castle of the deposed dukes his residence as the new Duke of Mecklenburg.
        lonlat: [12.175, 53.794]
    arrows:
      - side: foe
        label: Wallenstein and Tilly
        via: [[10.5, 53.5], [9.9, 54.3], [9.4, 55.3], [9.7, 56.6]]
    areas:
      - style: occupied
        side: foe
        label: Occupied by Imperial and League troops, 1627–1629
        atoms: [DE-SH~holstein, DE-SH~schleswig, DK-83~jut, DK-82, DK-81]
  - title: Stralsund, Wolgast and the Peace of Lübeck
    date: 1628–1629
    when: "1628-05"
    borders: "1629-05-22"
    countries: [dk, de]
    side_names:
      foe: Imperial and Catholic League success
    move_names:
      foe: Imperial and Catholic League moves
    body:
      - The Pomeranian port of Stralsund refused to take an imperial garrison, and in May 1628 imperial troops laid siege to it. Denmark sent help by sea, including 900 Scots of Donald Mackay’s regiment, of whom 500 were killed in the fighting. Swedish troops followed, and in June the town made a twenty-year alliance with Sweden. Wallenstein took command himself but lifted the siege on 4 August, his first serious setback.
      - Christian IV used his command of the sea to raid the coasts. In August he landed on Usedom with 7,000 men and took Wolgast, but on 2 September Wallenstein beat him outside the town and the Danes re-embarked. Both men now wanted peace. By the Peace of Lübeck, signed on 22 May 1629, Christian got back all his lands without paying anything, but gave up his claims to the north German bishoprics and promised to stay out of the Empire’s affairs. The next year Sweden entered the war.
    facts:
      - [Siege of Stralsund, "13 May – 4 August 1628, abandoned"]
      - [Battle of Wolgast, "2 September 1628, Imperial victory"]
