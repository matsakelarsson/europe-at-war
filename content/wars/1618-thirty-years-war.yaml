  - title: Sweden enters the war
    date: "1630"
    when: "1630"
    borders: "1630"
    countries:
      - se
      - de
      - pl
    view:
      center:
        - 15.5455
        - 54.3354
      size:
        - 871
        - 592
    body:
      - The Truce of Altmark with Poland in 1629 let Sweden keep Livonia and several Prussian ports, and it freed King Gustav II Adolf to intervene in Germany. In July 1630 he landed at Peenemünde on the island of Usedom with about 13,000 men.
      - Stettin fell within weeks, and a treaty with the Duke of Pomerania turned the duchy into Sweden’s bridgehead. In January 1631 France promised to pay for the war in the Treaty of Bärwalde.
    facts:
      - - King
        - Gustav II Adolf
      - - Landing force
        - About 13,000 men (10,000 foot, 3,000 horse)
    markers:
      - kind: event
        side: se
        name: Landing at Peenemünde
        date: 6 July 1630 (New Style)
        lonlat:
          - 13.8012
          - 54.1382
        text: A fleet of 27 ships brought the king and some 13,000 troops to Usedom, at the mouth of the Peene.
      - kind: taken
        side: se
        name: Stettin
        date: July 1630
        lonlat:
          - 14.5495
          - 53.4289
        lp: b
        text: The Pomeranian capital was taken soon after the landing. By the autumn it held the largest Swedish garrison in the duchy, over 4,200 men.
      - kind: taken
        side: se
        name: Stralsund
        date: "1630"
        lonlat:
          - 13.0918
          - 54.3095
        lp: l
        text: Already a Swedish ally. In the autumn of 1630 about 3,100 Swedish soldiers were based here.
      - kind: event
        side: se
        name: Prussian ports
        date: 1629–1635
        lonlat:
          - 19.8989
          - 54.6291
        text: Under the Truce of Altmark Sweden held coastal towns such as Pillau, Memel and Elbing and took a share of the tolls on Polish trade, which helped pay for the war in Germany.
