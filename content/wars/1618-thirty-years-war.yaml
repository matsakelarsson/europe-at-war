notes:
  - Dates in Germany and Poland are New Style (Gregorian); Scandinavian dates are mostly Old Style (Julian), as usually cited, which ran ten days behind.
  - The Swedish phase (1630–1648) was migrated from Sweden at War and is told from Sweden’s side. The Danish phase (1625–1629), the Bohemian and Palatine phases (1618–1623) and France’s war against Spain and Bavaria (1635–1645) were added for Europe at War.
