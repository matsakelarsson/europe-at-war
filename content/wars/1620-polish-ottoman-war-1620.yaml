summary: A war over Moldavia and over Cossack and Tatar raiding. The Ottomans destroyed a Polish army at Cecora in 1620, but a year later the Commonwealth and the Zaporozhian Cossacks held their camp at Khotyn against Sultan Osman II, and the peace left the border on the Dniester.
