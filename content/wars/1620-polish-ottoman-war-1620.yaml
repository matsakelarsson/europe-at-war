steps:
  - title: Disaster at Cecora
    date: 1620
    when: "1620-09"
    borders: "1620"
    countries: [pl, ua, md, ro, tr]
    body:
      - For decades Polish magnates had meddled in Moldavia, an Ottoman vassal, while Zaporozhian Cossacks raided Ottoman ports on the Black Sea and Tatars raided Poland–Lithuania in return. In 1620 the Moldavian prince Gaspar Graziani rebelled against the sultan and asked for help. The elderly Crown Grand Hetman Stanisław Żółkiewski crossed the Dniester with perhaps 5,000–9,000 men, many of them magnates’ private troops, but few Moldavians joined him.
      - From 17 September his camp at Cecora (Țuțora) on the Prut was attacked by Ottoman troops under Iskender Pasha and Tatars of Khan Temir. On 29 September the Poles began to retreat in a moving fort of wagons, fighting off attacks for a week. Close to the Dniester, on 6–7 October, the column broke up. Żółkiewski was killed and his head was sent to the sultan. Field Hetman Stanisław Koniecpolski was among the many taken prisoner, as was the young Bohdan Khmelnytsky, whose father died in the battle.
    facts:
      - [Battle of Cecora, "17 September – 7 October 1620, Ottoman victory"]
      - [Killed, Crown Grand Hetman Stanisław Żółkiewski]
    markers:
      - kind: battle
        side: ot
        name: Battle of Cecora
        date: 17–29 September 1620
        text: The Polish camp beside the Prut held for twelve days but was surrounded, and many of the private troops deserted.
        lonlat: [27.78, 47.13]
      - kind: event
        side: ot
        name: Death of Żółkiewski
        date: 6–7 October 1620
        text: The retreating army was overrun a few miles short of the Dniester, near Mohyliv. The hetman refused to escape and was killed.
        lonlat: [27.70, 48.38]
    arrows:
