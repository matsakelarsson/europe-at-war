  - title: The camp at Khotyn
    date: September – October 1621
    when: "1621-09"
    borders: "1621-10-09"
    countries: [pl, lt, ua, tr, md]
    body:
      - In 1621 the young Sultan Osman II led a huge army north, with Tatar and Moldavian and Wallachian contingents, by most estimates well over 100,000 men. Lithuanian Grand Hetman Jan Karol Chodkiewicz entrenched about 30,000 Polish and Lithuanian troops beside the fortress of Khotyn on the Dniester, and some 25,000–40,000 Zaporozhian Cossacks under Hetman Petro Sahaidachny joined him.
      - From 2 September the Ottomans attacked the camp again and again and were beaten off with heavy losses. Chodkiewicz, ill, handed over command to Stanisław Lubomirski and died on 24 September. With autumn coming and his army shrinking, Osman agreed to the Treaty of Khotyn on 9 October. The border stayed on the Dniester, the Commonwealth promised to curb the Cossacks and stop meddling in Moldavia, and the sultan to restrain the Tatars. Osman blamed his janissaries, and they killed him in a revolt the next year.
    facts:
      - [Siege of the camp, 2 September – 9 October 1621]
      - [Treaty of Khotyn, "9 October 1621, no change of borders"]
      - [Cossack hetman, "Petro Sahaidachny, wounded, died in 1622"]
    markers:
      - kind: held
        side: pl
        name: Camp at Khotyn
        date: 2 September – 9 October 1621
        text: Polish, Lithuanian and Cossack troops held their entrenched camp beside the fortress through five weeks of assaults.
        lonlat: [26.50, 48.52]
      - kind: treaty
        name: Treaty of Khotyn
        date: 9 October 1621
        text: Both sides claimed victory. Moldavia stayed under Ottoman control.
        lonlat: [26.60, 48.47]
        lp: b
