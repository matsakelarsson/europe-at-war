id: valtellina-war
name: Valtellina War
start: "1620-07-19"
end: "1639-09-03"
tier: C
summary: A long struggle for the Valtellina, the Alpine valley between Milan and the Tyrol that was ruled by the Protestant-led Three Leagues of the Grisons and offered Spain its best road from Italy to Austria. On 19 July 1620 Catholic Valtellinese rose and killed several hundred Protestants, and Spanish troops from Milan occupied the valley while the Austrians invaded the Grisons. Papal troops took over the Valtellina forts in 1623, and in November 1624 a French army drove them out. The Treaty of Monzón of 1626 left the valley to the Grisons, self-governing and Catholic. In 1635 the Duke of Rohan led French and Grisons troops into the valley and beat Spanish and imperial armies, but France would not hand it back, and in 1637 the Grisons, led by Jürg Jenatsch, turned on the French and forced Rohan to leave. By the Treaty of Milan of 3 September 1639 Spain restored the valley to the Grisons, on condition that only Catholic worship was allowed, and gained free passage for its troops.
countries: [it, ch, fr, es, at]
sides:
  - id: gr
    name: The Grisons
    polities: [three-leagues]
    ink: red
  - id: fr
    name: France and its allies
    polities: [france, venice, savoy]
    ink: navy
  - id: sp
    name: Spain, Austria and the Valtellinese Catholics
    polities: [spain, milan, habsburg]
    ink: gold
notes:
  - Dates are Gregorian. The war was a side theatre of the Thirty Years’ War; Wikipedia’s article covers only the years 1620–1626.
  - The killings of 1620 are known in Italian as the Sacro Macello, the ‘holy butchery’. Accounts give between about 400 and 600 dead.
  - The sides changed over time. In 1637–1639 the Grisons came to terms with Spain against France.
