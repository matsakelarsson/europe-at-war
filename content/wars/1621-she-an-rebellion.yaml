  - title: Zhu Xieyuan’s war
    date: 1623–1630
    when: "1629"
    borders: "1629-09-01"
    countries: [cn]
    body:
      - The war settled into years of raids and ambushes in the mountains of western Guizhou. The Ming could not supply large armies there while the war in Liaodong took most of its money, and Ming reports of thousands of rebels killed each year brought no end. She Yin was killed by his own followers in 1626.
      - In 1628 the new Chongzhen Emperor gave Zhu Xieyuan, the defender of Chengdu, command of the armies of five south-western provinces. In 1629 She Chongming, now calling himself King of Daliang, and An Bangyan gathered their forces and in August attacked Chishui and Yongning. Ming armies beat An Bangyan at Wufengshan and Taohongba and drove him back; the pursuers then trapped the rebel leaders at Hongtuchuan, where She Chongming and An Bangyan were killed.
      - Zhu Xieyuan then blockaded Shuixi until An Wei surrendered in 1630. He kept his family’s office, though in 1637 part of Shuixi’s land was given to lesser chiefs and to Chinese who had served in the war; Yongning was governed by appointed officials. The south-west was quiet only a few years before the rebellions that ended the dynasty.
    facts:
      - [Zhu Xieyuan in command, "from 1628"]
      - [She Chongming and An Bangyan killed, "1629"]
      - [An Wei surrenders, "1630"]
