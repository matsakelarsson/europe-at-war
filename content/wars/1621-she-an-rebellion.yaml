  - title: Shuixi and the siege of Guiyang
    date: 1622–1623
    when: "1622-03"
    borders: "1622-06-01"
    countries: [cn]
    body:
      - Shuixi, the land west of the Wu River in north-western Guizhou, was held by the An family, Nuosu chiefs with the rank of pacification commissioner. The chief, An Wei, was a child, and his uncle An Bangyan governed for him. In early 1622, when the Ming would not feed the troops he had sent instead of grain, An Bangyan joined the revolt, with Song Wanhua of Shuidong on the other side of the river. His forces took Bijie, Anshun and Zhanyi and laid siege to Guiyang, the capital of Guizhou, with an army that the sources put at 100,000 men or more.
      - The grand coordinator Li Yun held Guiyang with a few thousand soldiers from about March 1622 into January 1623, nearly ten months; Chinese accounts count 296 days. Relief attempts failed. Food ran out, and most of the people in the city died of hunger; accounts of how many survived range from a few hundred defenders to some twenty thousand people. The new grand coordinator, Wang Sanshan, fought his way through and relieved the city at the beginning of 1623.
      - The Ming then struck at Yongning, which fell in 1623; the Yongning chieftaincy was abolished and She Chongming and his son fled to Shuixi to join An Bangyan. Wang Sanshan pushed on into Shuixi but was killed when his army withdrew.
    facts:
      - [Siege of Guiyang, "about March 1622 – January 1623"]
      - [Yongning taken by the Ming, "1623"]
