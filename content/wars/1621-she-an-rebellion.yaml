steps:
  - title: Yongning rises
    date: October 1621 – summer 1622
    when: "1621-10"
    borders: "1621-12-01"
    countries: [cn]
    body:
      - The Ming governed much of the south-west through hereditary chiefs, the tusi, who owed troops and tribute. She Chongming, of the Nuosu (Yi) family that held the Yongning pacification commission in southern Sichuan, was one of the chiefs called on in 1621 to send soldiers and grain for the war against the Later Jin in Liaodong. He sent his son She Yin with some 20,000 men, who gathered at Chongqing. In the autumn, after the grand coordinator of Sichuan, Xu Keqiu, ordered most of them home without supplies for the march, they rose, killed Xu and other officials and took the city. She Chongming proclaimed the state of Daliang (Great Liang). Some Ming writers believed he had planned the rising from the start.
      - His forces took Hejiang, Naxi and Zunyi in the south and a string of towns up the river valleys towards Chengdu, the provincial capital, which they besieged from about the beginning of December 1621. Zhu Xieyuan, the senior official in the city, held it for 102 days with a small garrison, luring the attackers under the walls with false offers of surrender, until the siege was lifted in March 1622.
      - Relief came from the east. Troops sent by Qin Liangyu of Shizhu and the regional commander Du Wenhuan took the passes guarding Chongqing, and in the summer of 1622 the Ming retook the city and killed the rebel commanders there.
    facts:
      - [Rising at Chongqing, "about the end of October 1621"]
      - [Siege of Chengdu, "December 1621 – March 1622, 102 days"]
      - [Chongqing retaken, "summer 1622"]
