notes:
  - "Dates are converted from the Chinese lunar calendar; the Chongqing rising on the 17th day of the 9th month of the first Tianqi year fell at about the end of October 1621. Ming accounts are the main source, and their numbers of troops and dead vary widely."
  - "Some modern accounts call She Chongming’s state Shu; the Chinese histories give its name as Daliang (Great Liang)."
  - Many of the soldiers on the Ming side were themselves raised by hereditary chiefs (tusi), among them the troops of Qin Liangyu, the woman commander of Shizhu.
