id: she-an-rebellion
name: She–An rebellion
start: "1621-10"
end: "1630"
tier: B
summary: "A revolt of two Nuosu (Yi) chieftains of the south-west against the Ming, named after She Chongming of Yongning in southern Sichuan and An Bangyan of Shuixi in north-western Guizhou. Ordered to send troops and grain for the war against the Later Jin in Liaodong, She Chongming’s soldiers rose at Chongqing in the autumn of 1621, killed the grand coordinator of Sichuan and proclaimed the state of Daliang; they besieged Chengdu for 102 days but failed to take it. In 1622 An Bangyan, regent of Shuixi, joined the revolt and besieged Guiyang for about ten months, until early 1623; most of the city’s people died of hunger. The Ming retook Chongqing in 1622 and Yongning in 1623, but the war dragged on in the mountains of Guizhou until Zhu Xieyuan’s armies killed She Chongming and An Bangyan in 1629. Shuixi surrendered in 1630. The war drew money and soldiers from the Ming at the time it was fighting the Later Jin in the north-east."
countries: [cn]
sides:
