id: capture-of-ormuz-1622
name: Capture of Ormuz (1622)
start: "1622-02-09"
end: "1622-04-23"
tier: B
summary: A joint campaign of Safavid Persia and the English East India Company that took the island fortress of Hormuz from the Portuguese, who had controlled it and the trade of the Persian Gulf since 1515. Shah Abbas I had already taken Bahrain in 1602 and the mainland port of Comoran (Gombroon) in 1614–1615. In 1622 English ships bombarded the Portuguese fort on Qeshm and then Hormuz, while Persian troops under Imam Quli Khan besieged the castle, which surrendered on 23 April. The Portuguese moved their base to Muscat, and Abbas built up Gombroon as Bandar Abbas.
countries: [ir, om]
