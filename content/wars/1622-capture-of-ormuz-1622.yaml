steps:
  - title: Qeshm and Hormuz
    date: February – April 1622
    when: "1622-02-09"
    borders: "1622-04-23"
    countries: [ir, om]
    body:
      - Shah Abbas wanted Persian silk to reach Europe without passing through Ottoman or Portuguese hands. His governor of Fars, Allahverdi Khan, had taken Bahrain from the vassals of Hormuz in 1602, and by 1615 the Persians held Lar and the mainland port of Comoran, opposite Hormuz. When the Portuguese commander Rui Freire de Andrade built a fort on the island of Qeshm in 1621 to secure Hormuz’s water and food, Persian troops besieged it. Imam Quli Khan, the son of Allahverdi Khan, then won the help of the English East India Company, whose ships were trading at Jask, in return for half of the spoils and of the customs of Hormuz.
      - The English fleet of five warships and four pinnaces bombarded the fort on Qeshm, which surrendered quickly; the explorer William Baffin was among the few English dead. On 9 February 1622 the allies moved against Hormuz. The Persians, about 3,000 strong with the English, landed and took the town, and the English guns pounded the castle and sank the Portuguese ships in the harbour. The garrison of about 1,000 held out for two months, until it mutinied on 22 April; the castle was occupied the next day. The kingdom of Hormuz, ruled by its own kings for some six centuries, came to an end. The Portuguese moved their headquarters to Muscat and tried in vain to retake Hormuz in 1623–1627, while trade shifted to Bandar Abbas, where the English and later the Dutch opened trading posts.
