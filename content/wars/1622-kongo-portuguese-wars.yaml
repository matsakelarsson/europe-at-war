id: kongo-portuguese-wars
name: Kongo–Portuguese wars
start: "1622-12"
end: "1670-10-18"
tier: B
summary: "Three wars between the Kingdom of Kongo, Christian since the early 16th century and long Portugal’s partner in trade, and the Portuguese colony of Angola, founded in 1575 on land that Kongo claimed. In 1622 the governor João Correia de Sousa, hoping for captives as his predecessor had taken them from Ndongo, sent an army with Imbangala mercenaries into Kongo’s southern province of Mbamba; it won at Mbumbi on 18 December 1622, killing the duke of Mbamba, but King Pedro II beat it at Mbanda Kasi in January 1623, the governor was driven out by Luanda’s own settlers, and Kongo captives were returned. Pedro II then proposed an alliance to the Dutch, which bore fruit when the Dutch held Luanda in 1641–1648 (see the Dutch occupation of Luanda). After the Portuguese came back, the rivalry turned on the Dembos, the small states between the two powers. In 1665 a succession dispute in one of them, Mbwila, brought both armies into the field, and on 29 October 1665 the Portuguese under Luís Lopes de Sequeira destroyed the Kongo army; King António I was killed and beheaded, and his death opened the Kongo Civil War. In 1670 an Angolan army invaded Soyo, the breakaway coastal province that dominated Kongo’s politics, but on 18 October 1670 the Soyo army, with troops from Ngoyo and guns from the Dutch, annihilated it at Kitombo. Portugal did not attack Kongo again until the 19th century, and a papal mediation later secured recognition of Soyo’s independence. Each war fed the Atlantic slave trade: captives taken by the Angolan armies and their Imbangala allies were shipped from Luanda, mostly to Brazil."
countries: [ao]
