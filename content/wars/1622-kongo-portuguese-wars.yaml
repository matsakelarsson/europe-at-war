  - title: Mbwila
    date: "1665"
    when: "1665-10-29"
    borders: "1665-11-01"
    countries: [ao]
    body:
      - After the Dutch were expelled from Luanda in 1648, Kongo’s King Garcia II had to sign a harsh treaty in 1649, and the governors of Angola pressed into the Dembos, the zone of small states between the colony and Kongo that both claimed. Garcia’s son António I, king from 1661, sought help from Spain against Portugal and sent envoys into the Dembos to win them over. In 1665 Mbwila, one of these states, fell into a succession dispute between a claimant and his aunt, Dona Isabel; Kongo backed the claimant and Angola, under governor André Vidal de Negreiros, the regent, and both sent armies.
      - "They met on 29 October 1665 in the valley of the Ulanga River, just south of Mbwila’s capital. The Portuguese force under Luís Lopes de Sequeira had about 450 musketeers, among them soldiers from Brazil of African and Native American descent, two light guns and some 15,000 Imbangala and other African troops. The Kongo army had perhaps 15,000 archers, 5,000 heavy infantry with shields and swords, and 380 musketeers, 29 of them Portuguese. The musketeers formed a diamond-shaped formation around the guns and held against the Kongo attacks; when António I was killed the Kongo army broke. Some 5,000 Kongo soldiers were killed or captured, among them two of the king’s sons, two nephews, four governors, 95 title holders and 400 other nobles. His head was buried in the chapel of Our Lady of Nazareth on the bay of Luanda, and his crown and sceptre were sent to Lisbon. Captives were shipped to Brazil; Brazilian tradition holds that the princess Aqualtune, mother of Ganga Zumba, the leader of the maroon kingdom of Palmares, was taken at Mbwila."
    facts:
      - [Battle of Mbwila (Ambuila), "29 October 1665"]
      - [Kongo losses, "King António I, much of the nobility, thousands killed or captured"]
      - [Result, "Portuguese victory; Kongo falls into civil war"]
