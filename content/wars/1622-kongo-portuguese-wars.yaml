  - title: Kitombo
    date: "1670"
    when: "1670-10-18"
    borders: "1670-11-01"
    countries: [ao]
    body:
      - After Mbwila, Soyo, the coastal province at the mouth of the Congo that had been all but independent since the 1640s and traded freely with the Dutch, made and unmade kings in São Salvador. In 1670 King Rafael I, who had come to the throne against Soyo’s will, asked Angola for help against it. The governor, Francisco de Távora, sent João Soares de Almeida with the strongest colonial army yet raised in Central Africa, about 400 musketeers, a detachment of cavalry, four light guns, bowmen and Imbangala auxiliaries, with ships along the coast. In June 1670 it won a battle on the Mbidizi River, in which, by some accounts, Soyo’s ruler was killed.
      - Soyo called on its northern neighbour Ngoyo, which sent soldiers, and rearmed with guns and light field pieces from the Dutch. On 18 October 1670, St Luke’s Day, the Soyo–Ngoyo army met the invaders at the forest of Nfinda Ngula near Kitombo, where the Portuguese artillery could not be brought into play, and charged and routed them. Almeida was killed, and almost none of his army escaped death or capture; many drowned trying to cross the river. Portugal made no further attempt to conquer Kongo until the 19th century, and Soyo, through Capuchin missionaries, persuaded the pope to obtain from Portugal a recognition of its independence. The victory is still celebrated in parts of northern Angola on St Luke’s Day.
    facts:
      - [Battle of the Mbidizi River, "June 1670, Portuguese victory"]
      - [Battle of Kitombo, "18 October 1670, Soyo victory"]
      - [Portuguese force, "About 400 musketeers, cavalry, 4 guns, Imbangala and bowmen"]
