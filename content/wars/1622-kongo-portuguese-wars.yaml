notes:
  - "The Portuguese side is known from governors’ letters and from António de Oliveira de Cadornega’s História geral das guerras angolanas (1680), written by a veteran of the Angolan army; Kongo’s side from the kings’ letters, Capuchin missionaries and, for Mbanda Kasi, a letter preserved in the Dutch archives and published by John Thornton and Andrea Mosterman (2010). Army sizes are contemporary estimates and differ widely."
  - "Accounts of the 1670 campaign differ on who led Soyo: in some, its ruler Estêvão da Silva was killed in a first battle on the Mbidizi River in June and his brother Pedro led the army at Kitombo; in others Estêvão commanded and died at Kitombo."
