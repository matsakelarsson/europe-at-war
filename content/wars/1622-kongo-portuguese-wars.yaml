steps:
  - title: Mbumbi and Mbanda Kasi
    date: 1622–1623
    when: "1622-12-18"
    borders: "1623-01-31"
    countries: [ao]
    body:
      - "Governor João Correia de Sousa, who took office in Luanda in 1621, first sent his troops against Kazanze, a forested district on Kongo’s border that sheltered slaves who had fled from the colony, and then ordered Captain-Major Pedro de Sousa Coelho, with an army said to number 20,000 Mbundu archers and 10,000 Portuguese soldiers and Imbangala, into Nambu a Ngongo in the province of Mbamba. When its lord fled to the market town of Mbumbi, the duke of Mbamba, Paulo Afonso, and the marquis of Pemba, Cosme, brought a few thousand archers and about 200 heavy infantry to meet the invaders. On 18 December 1622 the Kongo troops first routed the Mbundu archers, but the Imbangala counter-attacked and destroyed them; the duke, the marquis, 90 lesser nobles and thousands of soldiers were killed. According to Jesuit accounts, the Portuguese took many slaves and sacked the town, and the Imbangala ate many of the dead and the prisoners."
      - "The defeat set off anti-Portuguese riots across Kongo, and the new king, Pedro II, took the Portuguese he could save into his camp at Mbanda Kasi while he gathered his army. In January 1623 he defeated the Portuguese army there and drove it out of Kongo. A battle that Portuguese writers hardly mention, it is known mainly from Kongo letters to the Dutch. In Luanda the settlers, fearing the loss of the Kongo trade, forced Correia de Sousa out of office, and many Kongo captives were sent back. Pedro II wrote to the States General of the Dutch Republic proposing a joint attack on Luanda; a Dutch fleet under Piet Hein tried to take the town in late 1624, after Pedro’s death, and failed."
    facts:
      - [Battle of Mbumbi, "18 December 1622, Portuguese victory"]
      - [Battle of Mbanda Kasi, "January 1623, Kongo victory"]
      - [Kongo’s first proposal to the Dutch, "1622–1623"]
