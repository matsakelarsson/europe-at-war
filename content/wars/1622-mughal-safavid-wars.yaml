id: mughal-safavid-wars
name: Mughal–Safavid wars over Kandahar
start: "1622-05-20"
end: "1653-09-29"
tier: B
summary: The struggle between Safavid Persia and the Mughal Empire for Kandahar, the fortress city on the trade road between India and Iran. Shah Abbas I took it from the Mughals in 1622 after a 45-day siege. Its Persian governor, Ali Mardan Khan, handed it to Shah Jahan in 1638, but Shah Abbas II won it back in February 1649. Three great Mughal sieges, two under Prince Aurangzeb and one under Prince Dara Shikoh, failed in 1649, 1652 and 1653, and Kandahar stayed Persian until the Hotaki revolt of 1709.
countries: [af, ir, in, pk]
sides:
