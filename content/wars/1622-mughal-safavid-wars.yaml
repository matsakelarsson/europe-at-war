steps:
  - title: Abbas takes Kandahar
    date: 1622–1638
    when: "1622-06-22"
    borders: "1623"
    countries: [af, ir]
    body:
      - After his peace with the Ottomans in 1618, Shah Abbas I was free to turn east. In 1621 he gathered an army at Nishapur and, giving out that he was going hunting along the Helmand, appeared before Kandahar on 20 May 1622. The Mughal governor, Abdul Aziz Khan, refused to surrender, and his garrison of about 3,000 held out while the Persians, short of heavy guns, dug mines under the walls. Emperor Jahangir ordered his son Khurram, the future Shah Jahan, to lead a relief army, but the prince, afraid of losing his place at court, did not go. After 45 days, on 22 June, the towers collapsed and the garrison surrendered.
      - Abbas made Ganj Ali Khan governor and returned through Ghur. Khurram rebelled against his father, and in the spring of 1623 Jahangir’s envoy accepted the loss of Kandahar. Fifteen years later, in 1638, the Persian governor Ali Mardan Khan, fearing the new shah Safi, handed the city to Shah Jahan and entered Mughal service.
    facts:
      - [Siege of Kandahar, "20 May – 22 June 1622"]
      - [Mughal garrison, "about 3,000"]
      - [Handed to the Mughals by Ali Mardan Khan, "1638"]
