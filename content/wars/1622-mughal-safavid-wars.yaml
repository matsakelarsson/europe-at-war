  - title: Kandahar retaken and the Mughal sieges
    date: 1648–1653
    when: "1649-02-22"
    borders: "1653-10"
    countries: [af, ir, in, pk]
    body:
      - In 1648, while the Mughal army was worn out by its failed campaign in Balkh and Badakhshan, Shah Abbas II marched on Kandahar with some 40,000 men, took Bost and on 28 December laid siege to the city. The Mughal garrison of 7,000 under Daulat Khan had left two hilltop watchtowers unguarded, and Persian guns firing from them reached the inside of the fort. Part of the garrison mutinied, and on 22 February 1649 Daulat Khan surrendered in exchange for safe passage to India.
      - Shah Jahan sent three armies to win it back. Prince Aurangzeb, with about 50,000 men, besieged it from May to 5 September 1649, but lacked heavy guns and lost some 3,000 men. A second siege under Aurangzeb, from 2 May 1652, failed against the more accurate Persian gunners and was called off on 9 July. In 1653 Prince Dara Shikoh brought 70,000 men and new siege guns, but his assaults failed too, and on 29 September 1653 the Mughals gave up. They never tried again, and the war cost them much money and prestige.
    facts:
      - [Kandahar taken by Abbas II, "22 February 1649"]
      - [Mughal sieges, "1649, 1652 and 1653, all failed"]
