  - title: Zheng Zhilong and Liaoluo Bay
    date: 1628–1633
    when: "1633-07-07"
    borders: "1633-10-22"
    countries: [cn, tw]
    body:
      - Zheng Zhilong, a Fujianese merchant and sea captain who had worked as an interpreter for the Dutch and then led his own fleet of armed junks, accepted a Ming commission in 1628 as patrolling admiral and used it to destroy his rivals on the coast. The Company still had no direct trade with the mainland. In 1633 its governor at Tayouan, Hans Putmans, decided to force it. On 7 July 1633, without a declaration of war, his ships attacked Zheng’s new fleet in the harbour of Xiamen, which was not yet fully manned, and burned it. The Dutch then raided the coast, joined by the junks of the pirate Liu Xiang.
      - The governor of Fujian, Zou Weilian, gave Zheng the means to rebuild. On 22 October 1633 Zheng’s fleet of about 150 junks, some 50 of them large war junks, attacked Putmans’ eight ships and Liu Xiang’s junks in Liaoluo Bay on the south coast of Kinmen, using fire ships. Two Dutch ships were burned or sunk and one captured, with about 250 Dutch killed and wounded; Ming officials hailed a “miracle at sea”. Putmans withdrew to Tayouan, and his superiors told him to stay away from the coast. Trade then passed through Zheng Zhilong’s merchants, who sailed to Tayouan, and Zheng became one of the richest men in China.
    facts:
      - [Dutch attack at Xiamen, "7 July 1633"]
      - [Battle of Liaoluo Bay, "22 October 1633"]
      - [Dutch losses at Liaoluo Bay, "2 ships lost, 1 captured, about 250 killed and wounded"]
