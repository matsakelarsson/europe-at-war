id: sino-dutch-conflicts
name: Sino-Dutch conflicts
start: "1622-06"
end: "1633-10-22"
tier: B
summary: "Fighting between the Dutch East India Company (VOC) and Ming China over the Company’s demand for trade on the coast of Fujian. After the Portuguese beat off a Dutch attack on Macau in June 1622, a VOC fleet under Cornelis Reijersen occupied the Penghu (Pescadores) islands, built a fort with forced Chinese labour and raided the Fujian coast to force the Ming to open trade. In 1624 Ming troops under Yu Zigao landed on Penghu and besieged the fort; in August the Dutch agreed to pull down the fort and withdraw to Tayouan on Taiwan, outside Ming rule, where they built what became Fort Zeelandia and the colony of Dutch Formosa. Trade with Taiwan grew through Chinese merchants, but in 1633 the governor Hans Putmans, allied with the pirate Liu Xiang, burned the new fleet of the Ming admiral Zheng Zhilong at Xiamen (Amoy) to force direct trade. On 22 October 1633 Zheng defeated the Dutch and Liu Xiang’s junks with fire ships in Liaoluo Bay off Kinmen. The Company afterwards traded through Zheng Zhilong’s merchants at Tayouan."
countries: [cn, tw, nl]
sides:
  - id: mg
    name: Ming China
    polities: [ming]
    ink: red
    moves: Ming moves
    success: Ming success
  - id: nl
    name: Dutch East India Company (VOC)
    polities: [dutch-republic]
    ink: orange
    moves: Dutch moves
    success: Dutch success
notes:
  - "Dutch dates are in the Gregorian calendar; Chinese records use the lunar calendar. Numbers of ships and troops differ between Dutch and Chinese accounts."
  - "Taiwan was not then ruled by the Ming. The Ming tolerated the Company’s move there in 1624 because it took the Dutch out of Penghu, which the Ming regarded as Chinese territory."
