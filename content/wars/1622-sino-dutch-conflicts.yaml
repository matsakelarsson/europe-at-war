steps:
  - title: Macau and the Pescadores
    date: 1622–1623
    when: "1622-07"
    borders: "1622-08-01"
    countries: [cn, tw]
    body:
      - The Dutch East India Company wanted a share of the trade in Chinese silk and porcelain that the Portuguese carried on from Macau and the Spanish from Manila. In June 1622 a fleet sent from Batavia under Cornelis Reijersen attacked Macau and was beaten off by the Portuguese. Reijersen sailed on to the Penghu (Pescadores) islands in the Taiwan Strait, where the Ming kept only seasonal patrols, and in the summer of 1622 began a fort at Fengguiwei on the main island, at the mouth of Magong harbour. Chinese captured at sea and local people were forced to build it; by one account 1,300 of the 1,500 labourers died.
      - From Penghu the Dutch demanded the right to trade on the Fujian coast and seized Chinese junks to press their demand. The governor of Fujian, Shang Zhouzuo, told them on 19 September 1622 to withdraw to Taiwan, outside Ming rule; in October and November they raided Xiamen (Amoy) and the nearby coast. His successor, Nan Juyi, prepared for war. In 1623 a Dutch ship was lost off Liuao, and in October Chinese forces at Xiamen captured the Dutch commander Christiaen Francx, who had come to negotiate, and burned one of his ships.
    facts:
      - [Dutch attack on Macau, "June 1622"]
      - [Fort at Fengguiwei begun, "summer 1622"]
      - [Raids on Xiamen, "October – November 1622"]
