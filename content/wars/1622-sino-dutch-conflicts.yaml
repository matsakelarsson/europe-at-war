  - title: The siege of the Penghu fort
    date: February – September 1624
    when: "1624-02"
    borders: "1624-08-03"
    countries: [cn, tw]
    body:
      - In February 1624 Ming forces under Yu Zigao landed on Penghu. Over the following months they built up a force that Chinese and Dutch accounts put at 5,000 to 10,000 soldiers and 40 to 200 ships, and on 30 July 1624, under Yu and Wang Mengxiong, they closed in on the Dutch fort, which was commanded by the new governor, Martinus Sonck.
      - Outnumbered and cut off from supplies, the Dutch asked for terms on 3 August, and the Chinese merchant Li Dan, known to Europeans as Captain China, helped to broker a settlement. They agreed to pull down the fort and leave Penghu, and the Ming let them settle at Tayouan, a sandbank off the south-west coast of Taiwan (today Anping in Tainan), where Chinese merchants could trade with them. The last Dutch left Penghu in September. At Tayouan they built a fort that was later rebuilt in stone as Fort Zeelandia, the seat of the colony of Dutch Formosa until Zheng Chenggong (Koxinga) took it in 1662.
    facts:
      - [Ming landing on Penghu, "February 1624"]
      - [Dutch ask for terms, "3 August 1624"]
      - [Move to Tayouan, "August – September 1624"]
