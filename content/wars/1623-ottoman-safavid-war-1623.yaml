  - title: Baghdad retaken and the Treaty of Zuhab
    date: 1638–1639
    when: "1638-12-25"
    borders: "1639-05-17"
    countries: [iq, ir, tr]
    body:
      - In 1638 Murad IV marched on Baghdad with an army of about 100,000 men; an eyewitness gives 108,589. The siege began on 15 November. The Persian commander, Bektash Khan, had strengthened the walls and greatly enlarged the garrison, which made costly sorties. After 40 days Murad ordered a general assault, and the city fell on 25 December; the grand vizier Tayyar Mehmed Pasha was shot dead the day before. The defenders were promised free passage, but fighting broke out again and many soldiers and townspeople were massacred and the city was sacked.
      - Peace talks began soon after, and on 17 May 1639 the two sides signed the Treaty of Zuhab at Qasr-e Shirin. Iraq, with Baghdad and Basra, went to the Ottomans for good, as did western Armenia, western Georgia and all of Samtskhe. Persia kept Erivan, eastern Armenia, Azerbaijan, Shirvan, Dagestan and eastern Georgia. The frontier drawn through the Zagros mountains stayed, with small changes, the frontier of Iran with Turkey and Iraq, and the treaty ended more than a century of war between the two empires.
    facts:
      - [Siege of Baghdad, "15 November – 25 December 1638"]
      - [Treaty of Zuhab, "17 May 1639"]
    markers:
