id: ottoman-safavid-war-1623
name: Ottoman–Safavid War (1623–1639)
start: "1623"
end: "1639-05-17"
tier: B
summary: The last of the great wars between the Ottoman Empire and Safavid Persia, fought mainly over Iraq. Shah Abbas I took Baghdad in January 1624, exploiting a mutiny there, and held it against Ottoman sieges in 1625–1626 and 1630. Sultan Murad IV took Erivan and plundered Tabriz in 1635 and retook Baghdad after a 40-day siege in December 1638. The Treaty of Zuhab (1639) left Iraq to the Ottomans and drew a frontier that still roughly divides Iran from Turkey and Iraq.
countries: [iq, ir, am, tr]
sides:
  - id: saf
    name: Safavid Persia
    polities: [persia]
    ink: green
    moves: Safavid moves
    success: Safavid success
  - id: ot
    name: Ottoman Empire
    polities: [ottoman]
    ink: teal
    moves: Ottoman moves
    success: Ottoman success
notes:
  - Both captures of Baghdad were followed by killings. After 1624 many Sunni inhabitants were killed; after the storming of 1638 the Ottoman troops sacked the city and massacred part of the garrison and population. Reliable numbers are not known; one encyclopedia cited on Wikipedia gives more than 20,000 killed in 1638.
