  - title: Hamadan, Erivan and Tabriz
    date: 1629–1636
    when: "1635-08-08"
    borders: "1635-09"
    countries: [ir, am, iq, tr]
    body:
      - Abbas died in January 1629 and was succeeded by his grandson Safi. That spring the new grand vizier Gazi Hüsrev Pasha found central Iraq flooded and turned east into Persia instead. On 4 May 1630 he routed a Persian army at Mahidasht near Kermanshah and sacked Hamadan, then besieged Baghdad in November, but had to withdraw before the winter. For several years there were only raids and skirmishes.
      - In 1635 Sultan Murad IV took command himself. He took Erivan on 8 August after a short siege and occupied and plundered Tabriz in September, then returned in triumph to Constantinople. His gains did not last; in the spring of 1636 Shah Safi retook Erivan and defeated an Ottoman army.
    facts:
      - [Battle of Mahidasht, "4 May 1630, Ottoman victory"]
      - [Erivan taken by Murad IV, "8 August 1635"]
      - [Erivan retaken by Persia, "1636"]
    markers:
      - kind: battle
        side: ot
        name: Mahidasht
        date: 4 May 1630
        text: Hüsrev Pasha routed the Persian army of Zainal Khan Shamlu and went on to sack Hamadan.
        lonlat: [46.84, 34.27]
        lp: l
