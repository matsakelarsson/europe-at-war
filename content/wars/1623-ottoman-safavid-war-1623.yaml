steps:
  - title: Abbas takes Baghdad
    date: 1623–1626
    when: "1624-01-14"
    borders: "1624-02"
    countries: [iq, ir]
    body:
      - After the murder of Sultan Osman II in 1622 the Ottoman Empire was in turmoil. Since 1621 Baghdad had been held by a Janissary officer, Bakr the subashi, who wanted to be recognised as its pasha. When the sultan sent the governor of Diyarbakır against him, Bakr turned to Abbas for help, then made his peace with the Ottomans when Persian troops approached. Abbas besieged the city anyway, and on 14 January 1624 Bakr’s son Muhammad let the Persians in. Bakr was put to death, and many of the Sunni inhabitants were massacred as Abbas set out to make Baghdad a Shi‘i city.
      - Ottoman garrisons and tribes went over to the Persians, who took Kirkuk and Mosul and the Shi‘i shrine cities of Najaf and Karbala, and Abbas visited the shrines. In the south the pasha of Basra, with Portuguese ships from Muscat, beat off the Persian general Imam Quli Khan. In November 1625 the grand vizier Hafız Ahmed Pasha laid siege to Baghdad. His troops broke through the outer walls but could not take the city before Abbas arrived with a relief army and cut the supply routes. After a failed attack on the Persian army, the Ottomans lifted the siege on 4 July 1626 and fell back to Mosul.
    facts:
      - [Baghdad taken by Abbas, "14 January 1624"]
      - [Ottoman siege lifted, "4 July 1626"]
    markers:
