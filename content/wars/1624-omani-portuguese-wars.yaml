id: omani-portuguese-wars
name: Omani–Portuguese wars
start: "1624"
end: "1698-12-13"
tier: B
summary: The wars in which the Ya‘rubi imams of Oman drove the Portuguese from the Omani coast and then fought them across the western Indian Ocean. Imam Nasir bin Murshid, elected in 1624, united the tribes of the interior and took Julfar in 1633, Sohar in 1643 and the other ports until only Muscat was left. His successor Sultan bin Saif captured Muscat in January 1650, ending Portuguese rule in Oman. With captured ships the Omanis built a navy that raided Portuguese ports in India and East Africa, and in 1698, after a siege of almost three years, took Fort Jesus at Mombasa, which made Oman the leading power on the Swahili coast.
countries: [om, ae, ke, tz, in]
sides:
  - id: om
    name: Imamate of Oman (Ya‘rubi dynasty)
    polities: [oman]
    ink: red
    moves: Omani moves
    success: Omani success
  - id: pt
    name: Portugal
    polities: [portugal]
    ink: green
    moves: Portuguese moves
    success: Portuguese success
notes:
  - The accounts of the fall of Muscat differ. Omani tradition tells of a night attack at Christmas helped by an Indian storekeeper who spoiled the powder; a Portuguese report gives the arrival of 700 refugees at Diu on 18 January 1650, and other sources date the surrender of the last fort to 28 January 1650. Portuguese sources give the Omani dead as 4,000–5,000, a number that cannot be checked.
  - Persia also lost its forts on the coast to the Omanis, among them Julfar in 1633.
