steps:
  - title: The Ya‘rubi imams take the coast
    date: 1624–1648
    when: "1633"
    borders: "1648-10-31"
    countries: [om, ae]
    body:
      - After Hormuz fell to Persia in 1622, the Portuguese governed their forts on the Omani coast directly from Muscat. Inland, the old Nabhani dynasty had collapsed, and in 1624 an assembly of notables at Rustaq elected Nasir bin Murshid of the Ya‘ariba tribe as imam of the Ibadi community. He spent his first years subduing rival chiefs and made Nizwa his capital, then united the tribes against the Portuguese, who held Muscat, Sohar, Qurayyat, Sur and other ports.
      - In 1633 his armies took the two forts of Julfar, one Persian and one Portuguese, and Dibba, but failed before Muscat. A long blockade of Sohar began the same year, and Sur and Qurayyat fell. On 7 November 1643, after ten years, the Omanis stormed Sohar. By 1648 the Portuguese held only Muscat, Muttrah and Khasab. That August the Omanis besieged Muscat, and on 31 October 1648 the garrison, short of powder and struck by plague, agreed to a treaty that gave the Omanis free trade and required the Portuguese to demolish their outer forts. In Lisbon the king was so displeased that he had the captain of Muscat arrested.
    facts:
      - [Nasir bin Murshid elected imam, "1624"]
      - [Julfar taken, "1633"]
      - [Sohar taken, "7 November 1643"]
