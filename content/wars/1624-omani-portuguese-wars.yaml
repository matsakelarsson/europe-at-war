  - title: Muscat falls
    date: 1649–1650
    when: "1650-01"
    borders: "1650-02"
    countries: [om]
    body:
      - Nasir bin Murshid died in April 1649 and was succeeded by his cousin Sultan bin Saif, who prepared at once to take Muscat. The town was held by a garrison of Portuguese and Indian soldiers from Goa, in the two harbour forts of São João and Capitão and in posts on the surrounding hills. The first Omani assaults on the hills were thrown back, but the Portuguese then withdrew into the forts and were besieged.
      - According to Omani tradition, an Indian officer in charge of the stores, angry with the Portuguese captain, spoiled the gunpowder, and the Omanis stormed the walls at dawn while the garrison was celebrating Christmas. Most of the defenders were killed; about 700 refugees reached Diu on 18 January 1650, and the last fort surrendered at the end of January. Muttrah surrendered too. A Portuguese fleet sent from Goa in 1652 failed to retake Muscat, and the Portuguese left Khasab in the mid-1650s, ending their rule in Oman.
    facts:
      - [Muscat taken, "January 1650"]
      - [Portuguese relief fleet fails, "1652"]
    markers:
      - kind: taken
        side: om
        name: Muscat
        date: January 1650
        text: Stormed by Sultan bin Saif’s army. Nearly the whole garrison was killed; according to Portuguese sources only 60 or 70 survived.
        lonlat: [58.59, 23.62]
      - kind: held
        side: pt
        name: Khasab
        date: until about 1655
        text: The last Portuguese post in Oman, on the Musandam peninsula.
        lonlat: [56.24, 26.18]
    arrows:
      - side: om
        label: Sultan bin Saif
        via: [[57.43, 23.39], [58.1, 23.58], [58.56, 23.61]]
  - title: The war at sea and Mombasa
    date: 1650–1698
    when: "1696-03-13"
    borders: "1698-12-13"
    countries: [ke, tz, in, om]
    body:
      - With ships captured at Muscat and others built or bought, Sultan bin Saif made Oman a naval power. Omani fleets raided Portuguese ports in India, attacking Bombay in 1661 and sacking Diu in 1668, and on the East African coast towns that resented Portuguese rule asked for Omani help. In 1660 the Omanis sacked the town of Mombasa, though the Portuguese held out in Fort Jesus.
      - On 13 March 1696 an Omani army sent by Imam Saif bin Sultan besieged Fort Jesus, where the Portuguese garrison of between 50 and 70 soldiers and several hundred Africans and townspeople had taken refuge. Famine and disease, including smallpox, wore them down, and relief ships from Goa brought too few men. On 13 December 1698, after 33 months, the Omanis stormed the fort, where only a handful of defenders were left; a Portuguese relief fleet arrived a week later. Omani rule or overlordship spread along the coast of Kenya and Tanzania, with Pemba and Zanzibar, and the Omanis went on to take Kilwa and to attack Mozambique Island and Salsette near Bombay. The Portuguese held Mombasa again only briefly in 1728–1729.
    facts:
      - [Siege of Fort Jesus, "13 March 1696 – 13 December 1698"]
      - [Portuguese garrison at the start, "50–70 soldiers"]
    markers:
      - kind: siege
        side: om
        name: Fort Jesus, Mombasa
        date: 1696–1698
        text: Besieged for almost three years. The fort fell on 13 December 1698, a week before a Portuguese relief fleet arrived.
        lonlat: [39.68, -4.06]
        lp: l
      - kind: taken
        side: om
        name: Zanzibar
        date: c. 1698
        text: The Omanis drove out the remaining Portuguese and made the island’s ruler a vassal. Omani settlement of Zanzibar began.
        lonlat: [39.19, -6.16]
        lp: l
      - kind: event
        side: om
        name: Diu
        date: "1668"
        text: The Portuguese town in Gujarat was sacked by an Omani fleet. It was attacked again in 1670 and 1676.
        lonlat: [70.99, 20.71]
      - kind: event
        side: om
        name: Bombay
        date: "1661"
        text: Attacked by an Omani fleet in 1661, the year Portugal promised the island to England as part of Catherine of Braganza’s dowry.
        lonlat: [72.83, 18.94]
        lp: r
