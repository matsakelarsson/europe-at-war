id: yi-gwal-rebellion
name: Yi Gwal’s rebellion
start: "1624-03-11"
end: "1624-04-01"
tier: C
summary: "A revolt by Yi Gwal, a general who had helped put King Injo on the throne in the coup of 1623 and was then sent north as deputy commander at Yeongbyeon against the Later Jin. Rewarded less than he expected, and accused of plotting by the ruling Westerners’ faction, he killed the officials sent to arrest his son and rose on 11 March 1624 with about 12,000 men, among them some 100 Japanese soldiers who had gone over to Korea in the Imjin War. Avoiding Pyongyang, where the commander-in-chief Jang Man had too few troops to stop him, he marched south by side roads, beat government forces at Hwangju and on the Imjin River, and on 26 March crossed the Imjin. Injo fled south to Gongju, and Yi Gwal entered Hanseong, the first rebel to take the capital in Joseon history, and set up Prince Heungan as king. On 29 March Jang Man and Jeong Chung-sin defeated him on the hill of Gilmajae (Anhyeon), just outside the city. He fled towards Icheon, where his own officers killed him and Han Myeong-ryeon and gave themselves up. The revolt weakened the northern defences, and Han Myeong-ryeon’s son, who escaped to the Later Jin, urged them to invade Korea, which they did in 1627."
