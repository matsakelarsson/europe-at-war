notes:
  - Korean records date the revolt by the lunar calendar (it began on the 22nd day of the first month). The English Wikipedia article gives these lunar dates as if they were Gregorian; the dates here are the Gregorian equivalents given in the Korean article. Yi Gwal was killed on the night of 1–2 April.
  - The English Wikipedia article spells his name Yi Kwal, in McCune–Reischauer romanisation.
