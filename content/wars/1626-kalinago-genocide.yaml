notes:
  - "The numbers come from colonial accounts, above all the French missionary Jean-Baptiste du Tertre, who wrote decades later; the plot attributed to Tegremond rests only on the colonists’ word. Some accounts date the killings to 1625 or 1627."
  - Bloody Point lies at the mouth of the Stone Fort River on the west coast, between today’s Challengers and Old Road; a carved rock with Kalinago petroglyphs survives nearby at Wingfield.
