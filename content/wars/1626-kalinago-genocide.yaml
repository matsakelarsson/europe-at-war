id: kalinago-genocide
name: Kalinago genocide on Saint Kitts
start: "1626"
end: "1626-08"
tier: C
summary: "The killing of the Kalinago of Saint Kitts (Liamuiga) by English and French colonists in 1626, two years after the island became the first English and French colony in the Caribbean. The English under Thomas Warner had landed in 1624 with the consent of the Kalinago leader Ouboutou Tegremante (Tegremond), and the French under Pierre Belain d’Esnambuc followed in 1625; as the colonists cleared more land for tobacco, relations broke down. In 1626, in August by local tradition, a Kalinago woman named Barbe told Warner and d’Esnambuc that Tegremond was summoning warriors from other islands to drive the colonists out. Acting on this report, which the historian Melanie Newton calls “slim intelligence”, the English and French attacked the Kalinago by night after a feast, killing about 120 people, Tegremond among them. They then drove the remaining Kalinago, some 3,000 to 4,000 people by the usual estimates, towards the river and point on the west coast still called Bloody River and Bloody Point, and killed most of them; the historian Vincent Hubbard puts the dead at about 2,000, many of them killed as they tried to surrender, while about 100 colonists also died. The survivors fled into the mountains; by 1640 those who had not been enslaved had been forced to leave for Dominica. In 1627 the English and French divided the island between them. Historians such as Andreas Buser have argued that the killings meet the definition of genocide; Saint Kitts and Nevis marked their 400th anniversary at Challengers, beside the Bloody River, in August 2026."
