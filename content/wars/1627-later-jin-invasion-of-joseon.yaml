notes:
  - Korean records date the war by the lunar calendar. The English Wikipedia article gives these lunar dates as if they were Gregorian (Uiju taken on “14 January”); the dates here are the Gregorian equivalents given in the Korean article (the invasion began on the 13th day of the first month, 28 February 1627, and peace was made on the 3rd day of the third month, 18 April 1627).
  - The war was part of the long struggle between the Ming and the Jurchen state founded by Nurhaci; see the Ming–Later Jin war (1618–1644). The Later Jin was renamed Qing in 1636.
