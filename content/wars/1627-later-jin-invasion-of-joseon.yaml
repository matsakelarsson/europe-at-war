  - title: Ganghwa and the brothers’ treaty
    date: March – April 1627
    when: "1627-03"
    borders: "1627-04-18"
    countries: [kr, kp]
    body:
      - As the Jin army neared, King Injo and his court left Hanseong in mid-March and crossed to Ganghwa Island, which the Jurchen cavalry could not reach without ships; the crown prince Sohyeon went south to Jeonju. Militias rose behind the Jin lines in Pyongan, among them Jeong Bong-su’s in Cheolsan and Yi Rip’s at Yongcheon, which won several fights and threatened the invaders’ communications. A Ming relief force was on its way.
      - Amin wanted more, but Hong Taiji, anxious about the Ming front, ordered him to settle. At Ganghwa, on 18 April 1627, the two sides agreed that the Later Jin and Joseon would be elder and younger brothers and would respect each other’s borders. Joseon stopped using the Ming era name in its dealings with the Jin, sent a royal kinsman, Yi Gak, as a hostage, opened markets on the border and paid tribute in horses, skins and cloth. The Jin army withdrew to Mukden. Korea went on supplying the Ming in secret, and in 1636 Hong Taiji, now emperor of the Qing, invaded again.
    facts:
      - [King Injo, "took refuge on Ganghwa Island"]
      - [Peace of Ganghwa, "18 April 1627"]
