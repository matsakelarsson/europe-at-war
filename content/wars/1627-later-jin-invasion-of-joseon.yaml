id: later-jin-invasion-of-joseon
name: Later Jin invasion of Joseon
start: "1627-02-28"
end: "1627-04-18"
tier: B
summary: "The first Manchu invasion of Korea, called Jeongmyo Horan in Korean after the year 1627 in the sixty-year cycle. Hong Taiji, the new khan of the Later Jin, wanted to secure his rear before fighting the Ming, to stop Korean support for the Ming general Mao Wenlong, who raided Liaodong from Ka Island off the Korean coast, and to obtain grain and trade for his people. At the end of February 1627 about 30,000 men under his cousin Amin crossed the Yalu, guided by the Korean general Gang Hong-rip, who had surrendered at Sarhu in 1619, and by fugitives from Yi Gwal’s rebellion. They took Uiju, Anju and Pyongyang within two weeks, and King Injo fled to Ganghwa Island. With militias active behind his lines and the war with the Ming in mind, Amin made peace at Ganghwa on 18 April 1627. Joseon and the Later Jin became “elder and younger brothers”, Korea opened border markets and sent tribute, but kept its ties with the Ming, which led to the second invasion of 1636."
