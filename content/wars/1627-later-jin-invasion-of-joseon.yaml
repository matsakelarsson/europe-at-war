steps:
  - title: Across the Yalu to Pyongyang
    date: February – March 1627
    when: "1627-02"
    borders: "1627-03-12"
    countries: [kp, cn]
    body:
      - After King Injo came to the throne in a coup in 1623, his government turned away from the cautious neutrality of his predecessor Gwanghaegun and sided openly with the Ming. It let the Ming general Mao Wenlong base his raids on Liaodong on Ka Island, off the coast of Pyongan, and station troops at Uiju. When Nurhaci died in 1626 after his defeat at Ningyuan, his son Hong Taiji decided to deal with Korea before turning on the Ming again. Korean fugitives from Yi Gwal’s failed rebellion of 1624 urged him on, telling him that Joseon’s northern army had been weakened.
      - On 28 February 1627 about 30,000 troops under Amin, with Jirgalang, Ajige and Yoto, crossed the Yalu. They took Uiju on 1 March, while Mao Wenlong fled out to sea, and Jeongju the next day; the mountain fortress of Neunghan fell on 8 March. At Anju, held by Nam I-heung, the garrison blew itself up in its powder magazine rather than surrender. Pyongyang was abandoned by its governor and taken without a fight, and the Jin vanguard reached Hwangju.
    facts:
      - [Later Jin army, "about 30,000 men under Amin"]
      - [Yalu crossed, "28 February 1627"]
      - [Anju, "fell 8 March 1627"]
