  - title: The Nguyễn offensive
    date: 1655–1660
    when: "1656"
    borders: "1656-01-01"
    countries: [vn]
    body:
      - Nguyễn Phúc Tần, now lord, went over to the attack in 1655. His generals Nguyễn Hữu Tiến and Nguyễn Hữu Dật crossed the Gianh, took Bố Chính and Hà Tĩnh and advanced into Nghệ An as far as the Lam River. Trịnh Tráng died during the campaign and was succeeded by his son Trịnh Tạc, who sent his own son Trịnh Căn south.
      - The Nguyễn advance stalled when the two generals fell out and would not support each other. Over the following seasons the Trịnh pushed them back, and by 1660 the Nguyễn armies were back behind the Gianh and their walls.
    facts:
      - [Nguyễn advance to the Lam River, "1655–1656"]
      - [Nguyễn back behind the walls, "1660"]
    markers:
