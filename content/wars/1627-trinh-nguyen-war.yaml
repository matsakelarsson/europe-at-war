  - title: The walls of Đào Duy Từ
    date: 1630–1633
    when: "1633"
    borders: "1633-06-01"
    countries: [vn]
    body:
      - After the first campaign Đào Duy Từ, a scholar from Thanh Hóa who had gone south to serve the Nguyễn, planned two great earthen walls across the narrow plain of Quảng Bình, where the mountains come close to the sea. The Trường Dục wall was built in 1630, and in 1631 the wall of Đồng Hới, later called Lũy Thầy (“the master’s wall”) after him, ran from the Nhật Lệ estuary to the hills. The walls were about six metres high and some ten kilometres long, and were defended with cannon cast with Portuguese help.
      - In 1633 Trịnh Tráng tried to get around the walls by sea. His fleet entered the Nhật Lệ estuary and was defeated by the Nguyễn fleet, and the land army withdrew. Đào Duy Từ died later that year. Both sides turned to Europeans for help, the Nguyễn to the Portuguese of Macau and the Trịnh to the Dutch East India Company, which began to trade in Tonkin in 1637.
    facts:
      - [Trường Dục wall built, "1630"]
      - [Lũy Thầy built, "1631"]
      - [Second Trịnh campaign, "1633"]
    markers:
