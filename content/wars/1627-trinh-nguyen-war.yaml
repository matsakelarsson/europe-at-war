id: trinh-nguyen-war
name: Trịnh–Nguyễn war
start: "1627"
end: "1672"
tier: A
summary: "The intermittent war between the two families that ruled Đại Việt in the name of the powerless Lê emperors, the Trịnh lords in the north (Đàng Ngoài, known to Europeans as Tonkin) and the Nguyễn lords in the south (Đàng Trong, or Cochinchina). When the Nguyễn refused to send taxes and accept orders from the Trịnh-controlled court, Trịnh Tráng sent an army south in 1627. Over the next 45 years the Trịnh, with a much larger population, attacked seven times across the narrow coastal plain of Quảng Bình, but were held by the Nguyễn walls designed by Đào Duy Từ near Đồng Hới and by the Nguyễn’s cannon, made with Portuguese help; the Dutch East India Company, allied to the Trịnh, lost a warship at the Gianh River in 1643. A Nguyễn counter-offensive in 1655 reached Nghệ An before it was driven back. After a last failed Trịnh assault in 1672 the two sides made a truce with the Gianh River as the border. It held for a hundred years, while the Nguyễn expanded south into Champa and the Mekong delta."
countries: [vn]
sides:
  - id: tr
    name: Trịnh lords (Lê dynasty)
    polities: [dai-viet]
    ink: red
    moves: Trịnh moves
    success: Trịnh success
  - id: ng
    name: Nguyễn lords
    polities: [nguyen]
    ink: gold
    moves: Nguyễn moves
    success: Nguyễn success
notes:
  - Vietnamese historians count seven campaigns, in 1627, 1633, 1643, 1648, 1655–1660, 1661–1662 and 1672. The English-language accounts are thin and differ on several dates (the Nguyễn offensive is dated 1653–1656 in some and 1655–1660 in others; the last campaign 1671, 1672 or 1673). Army sizes are those of the chronicles and of European observers.
  - Both families ruled in the name of the Lê emperors, so the war was formally a rebellion of the Nguyễn against the court; the Nguyễn presented it as resistance to the Trịnh usurpation of imperial power. The base map shows the Nguyễn domain from 1627 and the border at the Gianh River.
