steps:
  - title: The break between the lords
    date: 1600–1627
    when: "1627"
    borders: "1627-06-01"
    countries: [vn]
    body:
      - Nguyễn Hoàng, governor of Thuận Hóa and Quảng Nam since 1558, had helped the Trịnh drive the Mạc from Đông Kinh, but in 1600 he left the court for good and ruled his southern provinces as his own. His son Nguyễn Phúc Nguyên traded with the Portuguese, Japanese and Chinese at Hội An, and by 1615 had Portuguese gunfounders casting bronze cannon for him. In 1620, after Trịnh Tùng had a Lê emperor killed and set up another, Nguyễn Phúc Nguyên stopped sending taxes to the court.
      - Trịnh Tráng, who succeeded his father in 1623, demanded the taxes and a Nguyễn son as hostage. The Nguyễn adviser Đào Duy Từ sent back a gift tray with a hidden refusal in a cryptic poem. In 1627 Trịnh Tráng marched south with a large army and attacked across the Gianh River towards the Nhật Lệ estuary at Đồng Hới. The Nguyễn held, and after four months, with news of trouble in the north, the Trịnh withdrew.
    facts:
      - [Nguyễn stop paying taxes, "1620"]
      - [First Trịnh campaign, "1627, about four months"]
    markers:
