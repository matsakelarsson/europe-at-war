  - title: Trường Dục, 1648
    date: "1648"
    when: "1648"
    borders: "1648-06-01"
    countries: [vn]
    body:
      - In 1648, shortly after the death of the Nguyễn lord Nguyễn Phúc Lan, Trịnh Tráng launched another offensive, crossed the Gianh and besieged the walls. The new lord’s son, Nguyễn Phúc Tần, led a night attack from the walls at Trường Dục with war elephants in front, and the Trịnh army broke and fled north with heavy losses. The Lê emperor Lê Chân Tông, who had accompanied the campaign, died soon afterwards. The Nguyễn settled their Trịnh prisoners on new land in the south.
    facts:
      - [Battle of Trường Dục, "1648, Nguyễn victory"]
    markers:
