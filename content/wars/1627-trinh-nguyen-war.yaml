  - title: The last assaults and the Gianh border
    date: 1661–1672
    when: "1672"
    borders: "1672-12-01"
    countries: [vn]
    body:
      - Trịnh Tạc attacked the walls in 1661–1662 without success. After ten years of truce, during which Trịnh Tạc fought the Mạc in the north and the Nguyễn turned south against Champa and Cambodia, the Trịnh made a final effort in 1672. Trịnh Tạc and Trịnh Căn crossed the Gianh with the largest army of the war, which the sources put at 80,000 or more men, and assaulted the Đồng Hới wall, defended by Prince Tôn Thất Hiệp and the general Nguyễn Hữu Dật. The assault failed; by one account the Trịnh lost 17,000 men in the first three days.
      - Trịnh Tạc offered a truce, and Nguyễn Phúc Tần accepted it. The Gianh River, also called the Linh River, became the border between Đàng Ngoài and Đàng Trong, and there was no more fighting between the lords for a century. The Nguyễn kept paying nominal respect to the Lê emperors while ruling the south as an independent state, which pushed its frontier into the Mekong delta in the following decades. War returned in 1774, when the Trịnh took advantage of the Tây Sơn rising to invade the Nguyễn domain.
    facts:
      - [Trịnh assault on the walls, "1672"]
      - [Trịnh army (sources), "about 80,000"]
      - [Truce and border at the Gianh, "1672"]
