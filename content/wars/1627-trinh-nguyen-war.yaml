  - title: The Dutch at the Gianh River
    date: 1642–1643
    when: "1643-07"
    borders: "1643-07-07"
    countries: [vn]
    body:
      - The Trịnh, now armed with Dutch cannon, attacked the walls again in 1642–1643, broke through the outer wall but failed to take the second. The Dutch East India Company, at odds with the Nguyễn since 1641 over seized Dutch ships and men, agreed to help. In 1642 a Dutch squadron raided the Nguyễn coast and was driven off at the Chàm islands off Hội An, and in the summer of 1643 three ships under Pieter Baeck sailed to the Gianh River to join a Trịnh army of 10,000 under Trịnh Tạc.
      - On 7 July 1643 the Nguyễn prince Nguyễn Phúc Tần attacked the Dutch ships with 50 to 60 coastal galleys about five miles south of the Gianh. A shot set off the magazine of the flagship Wijdenes, which blew up, and Baeck was killed; the other two ships escaped damaged. The Dutch reported that they had sunk seven galleys and killed 800 men. The Trịnh army nearby did not intervene and called off the campaign, and the Company made peace with the Nguyễn in 1651.
    facts:
      - [Battle of the Gianh River, "7 July 1643, Nguyễn victory"]
      - [Dutch ships, "3"]
      - [Nguyễn galleys, "50–60"]
