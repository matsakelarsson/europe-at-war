  - title: Xiangyang, Wuchang and Xi’an
    date: 1643
    when: "1643-01"
    borders: "1643-12-01"
    countries: [cn]
    body:
      - In January 1643 Li Zicheng took Xiangyang, renamed it Xiangjing and proclaimed himself King of the New Shun, with ministers and a civil government. He had two rival leaders, Luo Rucai and He Yilong, killed and took over their men. Zhang Xianzhong went his own way down the Yangtze; in the summer of 1643 he took Wuchang, killed the Prince of Chu and proclaimed himself King of the West, then moved south and took Changsha and much of Hunan.
      - The court ordered Sun Chuanting, released from prison and given command in Shaanxi, to attack. In the autumn of 1643 he advanced into Henan, but heavy rains cut his supplies at Jia county and his army fell apart in retreat. Li followed him to Tongguan, where Sun was killed fighting in November, and later that month Li’s army entered Xi’an without a fight. By the end of the year he held Shaanxi, Henan and much of Huguang.
    facts:
