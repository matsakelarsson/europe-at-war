  - title: The Great Xi in Chengdu
    date: 1644
    when: "1644-09-09"
    borders: "1644-11-01"
    countries: [cn]
    body:
      - Early in 1644 Zhang Xianzhong left Hunan and led about 100,000 men up the Yangtze into Sichuan, where he had raided many times. He took Chongqing on 25 July 1644 after several days of fighting and Chengdu on 9 September. He renamed Chengdu Xijing, the Western Capital, founded the Great Xi dynasty and late in 1644, in the tenth lunar month, took the title of emperor with the reign name Dashun. Ming officials and local militias went on resisting in much of the province.
      - Zhang’s rule in Sichuan in 1645–1646 became notorious for mass killings, of officials, scholars, soldiers suspected of disloyalty and townspeople. The Ming History claims 600 million dead, an impossible figure for a province of a few million people; one modern estimate puts the deaths at up to about one million out of some three million, while other historians argue that much of Sichuan’s later depopulation came from the decades of war, famine and epidemic that followed and doubt parts of the story. Zhang was killed by Qing troops at Xichong on 2 January 1647.
    facts:
      - [Chongqing taken, "25 July 1644"]
      - [Chengdu taken, "9 September 1644"]
      - [Great Xi proclaimed, "autumn 1644"]
      - [Death of Zhang Xianzhong, "2 January 1647"]
    markers:
      - kind: taken
        side: zx
