  - title: Xingyang and Fengyang
    date: Early 1635
    when: "1635"
    borders: "1635-03-01"
    countries: [cn]
    body:
      - Early in 1635 the rebels took Xingyang in Henan, and, by tradition, their leaders, from as many as thirteen bands, met there to plan their next moves; Li Zicheng is said to have proposed that they divide and strike in several directions at once. Whether the meeting happened as later told is uncertain, but in the following weeks Gao Yingxiang and Zhang Xianzhong marched east into the Huai valley.
      - In the first lunar month of 1635 they took Fengyang, the home town of the dynasty’s founder, the Hongwu Emperor, which the Ming honoured as their Middle Capital. The rebels burned the ancestral temple and the halls at the tomb of the emperor’s parents, and the great monastery that stood for the temple where Hongwu had once been a novice monk. Ming reports counted more than 4,000 dead and some 2,600 buildings burned. The Chongzhen Emperor issued an edict blaming himself, and the officials responsible were punished. The rebels then broke up again, Zhang going south to Huguang and Gao and Li back towards Shaanxi.
    facts:
      - [Meeting of rebel leaders at Xingyang, "early 1635 (by tradition)"]
      - [Fengyang burned, "first lunar month of 1635"]
      - [Buildings burned, "about 2,600 (Ming report)"]
