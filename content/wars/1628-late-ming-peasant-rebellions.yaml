  - title: Henan, Luoyang and Xiangyang
    date: 1640–1641
    when: "1641-03"
    borders: "1641-04-01"
    countries: [cn]
    body:
      - Drought and locusts brought famine to Henan in 1640 and 1641, and Li Zicheng, who had rebuilt his following in the hills between Shaanxi and Huguang, came down into the province. Promises of equal land and no grain taxes, later credited to a scholar adviser called Li Yan, whose very existence some historians doubt, drew the hungry to him, and his army grew from a few thousand to tens of thousands. Early in March 1641 he took Luoyang. The Prince of Fu, Zhu Changxun, a son of the Wanli Emperor famous for his wealth, was caught in a temple and executed before a crowd on 2 March, and Li is said to have opened the prince’s granaries to the starving.
      - Zhang Xianzhong, beaten by Zuo Liangyu at Mount Manao in Sichuan early in 1640, had led Yang Sichang’s armies round the Sichuan basin for a year. Early in 1641 he broke out to the east and in March took Xiangyang, Yang’s base, by surprise, killing the Prince of Xiang. Yang Sichang died a few weeks later, by some accounts by his own hand.
    facts:
