notes:
  - Chinese records date events by the lunar calendar and by reign years. The dates here are the Gregorian dates given in the sources cited; where they give only a month or season, so do we.
  - Ming officials and the official Ming History called the rebels “roving bandits” (liukou), and historians in the People’s Republic long celebrated them as leaders of peasant uprisings. Neither label fits every band, which included famine refugees, deserters and soldiers in revolt, local strongmen and outlaws, and changed sides and leaders often.
  - Numbers of rebels, soldiers and dead come from Ming and Qing records and later histories and are often exaggerated or guessed. The killings attributed to Zhang Xianzhong in Sichuan after 1644 are especially disputed.
  - The fighting in Liaodong and the Qing raids are told in the Ming–Later Jin war; the fall of Shun and of the Great Xi after 1644 belongs to the Qing conquest of the Ming.
