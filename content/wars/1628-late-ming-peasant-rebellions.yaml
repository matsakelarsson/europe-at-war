  - title: Kaifeng and the flood
    date: 1641 – October 1642
    when: "1642-10-07"
    borders: "1642-10-08"
    countries: [cn]
    body:
      - Li Zicheng besieged Kaifeng, the great city on the Yellow River and seat of the Prince of Zhou, three times. The first siege, in the spring of 1641, and the second, in the winter of 1641–1642, failed; Li himself is said to have lost an eye to an arrow on its walls. Between the sieges he beat the Ming field armies sent against him across Henan, and his forces were said to number hundreds of thousands.
      - The third siege began in the spring of 1642. The rebels blockaded the city for months and its people starved. On the night of 7–8 October 1642 the dykes of the Yellow River north of the city were cut; who cut them, the defenders hoping to drown the besiegers, the rebels, or both, is disputed. The river poured into Kaifeng and over the plain. Of about 378,000 people in the city, estimates of the dead from the flood and the famine and disease that followed range from about 270,000 to more than 300,000. Li withdrew to the south-west.
    facts:
      - [Sieges of Kaifeng, "spring 1641, winter 1641–1642, spring – October 1642"]
      - [Dykes cut, "7 or 8 October 1642"]
      - [Dead, "estimates from about 270,000 to over 300,000 of about 378,000"]
    markers:
