  - title: The rebels near defeat
    date: 1636–1639
    when: "1636-08"
    borders: "1638-06-01"
    countries: [cn]
    body:
      - In August 1636 Sun Chuanting, the governor of Shaanxi, ambushed Gao Yingxiang at Heishuiyu, a valley south of Zhouzhi, and captured him. Gao was taken to Beijing and executed by slicing. Li Zicheng took over many of his men and his title of Chuang Wang. The minister of war, Yang Sichang, planned to close a ring of armies round the rebels, paid for with yet more taxes, and Xiong Wencan took command in the south.
      - The plan nearly worked. In 1638 Zhang Xianzhong, wounded in a defeat by Zuo Liangyu, surrendered to Xiong Wencan at Gucheng in Huguang, keeping his army and his arms, and other leaders surrendered too. In the summer of 1638 Hong Chengchou and Sun Chuanting caught Li Zicheng near Tongguan and destroyed his army; Li escaped into the Shangluo mountains with fewer than twenty followers.
      - Then the Qing raid of 1638–1639 drew Hong and Sun north to defend the capital, and Sun was later imprisoned. In 1639 Zhang Xianzhong rose again at Gucheng, killed the local officials and ambushed Zuo Liangyu at Mount Luoying, where the Ming lost about 10,000 men. Xiong Wencan was arrested, and Yang Sichang himself took command at Xiangyang.
    facts:
      - [Gao Yingxiang captured, "August 1636 (seventh lunar month)"]
      - [Zhang Xianzhong surrenders at Gucheng, "1638"]
      - [Li Zicheng’s army destroyed near Tongguan, "summer 1638"]
      - [Zhang Xianzhong rises again, "1639"]
