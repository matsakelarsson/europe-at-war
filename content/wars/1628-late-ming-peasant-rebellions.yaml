  - title: Shun and the fall of Beijing
    date: February – June 1644
    when: "1644-04-25"
    borders: "1644-04-25"
    countries: [cn]
    body:
      - On 8 February 1644, the first day of the lunar year, Li Zicheng proclaimed the Shun dynasty at Xi’an, with the reign name Yongchang. He then crossed the Yellow River into Shanxi with an army whose size the sources give very differently, took Taiyuan in March and stormed Ningwu Pass, where the Ming commander Zhou Yuji resisted to the death at heavy cost to the rebels. The great frontier garrisons of Datong and Xuanfu surrendered, and so did Juyong Pass, the gateway to Beijing from the north-west.
      - Shun troops reached the suburbs of Beijing on 23 April and the gates were opened to them on 24 April. Early the next morning, 25 April 1644, the Chongzhen Emperor, having ordered the empress to take her own life and killed one of his daughters and wounded another with a sword, hanged himself on Meishan (Coal Hill, now Jingshan Park) behind the palace. Li Zicheng entered the Forbidden City the same day. The Ming dynasty, which had ruled China since 1368, was over in the north.
      - Li’s officers extorted silver from Ming officials under torture, and order in the city broke down. The Ming general Wu Sangui, whose army stood at Shanhai Pass, would not submit, and when Li marched against him he called in the Qing; Li’s army was routed at Shanhai Pass on 27 May. He hurried back to Beijing, proclaimed himself emperor on 3 June and left the city, setting the palace on fire, the next day or the day after. He was driven from Xi’an by the Qing early in 1645 and died that year in Hubei.
    facts:
      - [Shun dynasty proclaimed at Xi’an, "8 February 1644"]
      - [Taiyuan taken, "March 1644"]
      - [Beijing entered, "24 April 1644"]
      - [Death of the Chongzhen Emperor, "25 April 1644"]
      - [Battle of Shanhai Pass, "27 May 1644"]
