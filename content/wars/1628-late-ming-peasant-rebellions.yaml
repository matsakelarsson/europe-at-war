        text: Taken after several days of fighting on Zhang Xianzhong’s march up the Yangtze.
        lonlat: [106.550, 29.560]
      - kind: capital
        side: zx
        name: Chengdu (Xijing)
        date: 9 September 1644
        text: Zhang Xianzhong took the city, renamed it the Western Capital and made it the seat of his Great Xi dynasty.
