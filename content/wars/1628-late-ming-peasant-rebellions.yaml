id: late-ming-peasant-rebellions
name: Late Ming peasant rebellions
start: "1628"
end: "1644"
tier: A
summary: "The risings of famine victims, deserters and unpaid soldiers that began in Shaanxi in 1627–1628 and, over sixteen years, overthrew the Ming dynasty. Bands under leaders such as Wang Jiayin, Gao Yingxiang, Li Zicheng and Zhang Xianzhong roamed across northern and central China, surrendering when cornered and rising again, while the Ming armies were stretched between them and the Later Jin (Qing) in Liaodong. In 1635 they burned the Ming ancestral city of Fengyang; in 1636 Gao Yingxiang was captured and executed, and by 1638 the rebels seemed beaten. Famine in Henan and the Qing raids in the north revived them: Li Zicheng took Luoyang in 1641, Zhang Xianzhong Xiangyang the same year, and the siege of Kaifeng ended in October 1642 with a flood from the broken Yellow River dykes that killed most of the city’s people. In 1643 Li took Xiangyang and Xi’an, and Zhang Wuchang and Changsha. Li proclaimed the Shun dynasty at Xi’an in February 1644 and took Beijing on 24–25 April, when the Chongzhen Emperor hanged himself; Zhang founded the Great Xi in Chengdu later that year. Within weeks Li was defeated at Shanhai Pass by the Ming general Wu Sangui and the Qing, who took the empire for themselves."
countries: [cn]
