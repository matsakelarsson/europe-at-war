steps:
  - title: Famine and revolt in the north-west
    date: 1627–1634
    when: "1628"
    borders: "1628-06-01"
    countries: [cn]
    body:
      - In the 1620s the cold and drought of what climate historians call the Little Ice Age struck the poor north-western province of Shaanxi. Harvests failed in 1627 and 1628, and contemporaries reported people eating bark, earth and, in the end, each other. The frontier garrisons along the Great Wall, whose pay was months in arrears, deserted or rose against their officers; the new taxes for the war in Liaodong fell on villages that had nothing left; and cuts to the imperial courier service put many men out of work. In July 1627 Wang Er rose in the Guanzhong plain and killed a county magistrate, and in the spring of 1628 Wang Jiayin rose at Fugu with about 6,000 followers. Gao Yingxiang, a horse dealer from Ansai, joined him and took the name Chuang Wang, the Dashing King.
      - The bands, mounted and moving fast, lived off the land and swelled with deserters and the hungry. By about 1631 Ming officials counted some 200,000 rebels in 36 bands. Among the new leaders were Li Zicheng, a former courier and soldier from Mizhi, who led a soldiers’ revolt over unpaid wages in 1629, and Zhang Xianzhong of Yan’an, a deserter who called himself the Eighth Great King. The supreme commander Yang He tried amnesty, but rebels who surrendered rose again when the promised food did not come. Wang Jiayin was killed by his own men in 1631, and Hong Chengchou and Cao Wenzhao pushed the bands out of Shaanxi into Shanxi.
      - In 1633 the rebels spread into Henan, Huguang and Sichuan, crossing the frozen Yellow River in the winter of 1633–1634. In 1634 Chen Qiyu trapped many of them, Li Zicheng among them, in the Chexiang Gorge in the mountains of southern Shaanxi. About 13,000 surrendered and were to be escorted home, but when local officials executed some of them they rose again. The pattern of surrender and revolt was repeated for years.
    facts:
      - [Wang Er’s rising, "July 1627"]
      - [Wang Jiayin’s rising, "spring 1628, about 6,000 men"]
      - [Rebels about 1631, "some 200,000 in 36 bands (Ming estimate)"]
      - [Chexiang Gorge, "1634, about 13,000 surrender"]
