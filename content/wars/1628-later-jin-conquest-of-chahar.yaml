  - title: Ejei’s surrender and the seal
    date: 1635–1636
    when: "1635"
    borders: "1635-10-01"
    countries: [cn]
    body:
      - In 1635 Hong Taiji sent an army of about 10,000 horsemen under his brother Dorgon, with Yoto, Sahaliyan and Hooge, to find Ligdan’s son Ejei and the remaining Chahar beyond the Yellow River. Surrounded early in the year, Ejei and his mother Sutai surrendered without a fight and handed over a seal said to have been carried from China by the last Yuan emperor in 1368. Whether it was the Yuan dynasty’s seal has long been doubted, but Hong Taiji used it as a sign that the mandate of the Mongol emperors had passed to him.
      - In November 1635 Hong Taiji renamed his people Manchus. In the spring of 1636 the princes of the southern Mongols, gathered at Shenyang, acknowledged him as their khan, and in May he proclaimed the Great Qing dynasty. Ejei was made a prince of the first rank and married a Qing princess; he died in 1641. The Chahar were organised into banners under the Qing, and after Ejei’s nephew Burni rose against the Qing in 1675 they were moved to the lands north of Zhangjiakou. The southern Mongols, in today’s Inner Mongolia, stayed under the Qing until the end of the dynasty.
    facts:
