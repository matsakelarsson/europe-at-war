  - title: The flight of Ligdan Khan
    date: 1632–1634
    when: "1632-05-19"
    borders: "1632-07-01"
    countries: [cn]
    body:
      - On 19 May 1632 Hong Taiji set out from Shenyang with the Later Jin banners and the troops of his Mongol allies to destroy Ligdan. Ligdan did not wait for him. He fled west across the Yellow River with perhaps 100,000 Chahar, abandoning his lands and much of his wealth, and many of his people were captured or went over to the Later Jin; the non-Chahar tümens no longer recognised him at all. Hong Taiji followed as far as Köke Khota and then turned to the Ming frontier at Xuanfu, where he pressed the Ming commanders to trade with him.
      - Ligdan spent the next two years in the Ordos and on the edge of the Gansu corridor. In 1634 he set out for Kokonor (Qinghai), where his ally, the Khalkha prince Tsogt Taiji, was fighting the Gelug school of Tibetan Buddhism, but he died of smallpox at Shira Tala in today’s Gansu. Many of the Chahar leaders and their people then submitted to Hong Taiji, who in the summer of 1634 crossed the old Chahar lands to raid the Ming frontier at Xuanfu and Datong.
    facts:
