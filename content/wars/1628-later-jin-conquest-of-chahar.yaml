notes:
  - Mongol chronicles, Manchu records and Chinese sources often disagree on the years and outcomes of these campaigns, and English accounts repeat the differences. The dates here are Gregorian, mostly by year or season.
  - The Mongols south of the Gobi were divided into tümens and smaller groups under their own princes (the Chahar, Khalkha of the south, Khorchin, Kharachin, Tümed, Ordos and others). Only the Chahar were Ligdan’s own people. The Khalkha north of the Gobi stayed independent until 1691.
  - The war with the Ming in Liaodong at the same time is told in the Ming–Later Jin war.
