steps:
  - title: Ligdan Khan against the princes
    date: 1604–1631
    when: "1628"
    borders: "1628-06-01"
    countries: [cn]
    body:
      - Ligdan became khan of the Chahar in 1604, at about sixteen. He held the title of great khan of all the Mongols, but the other tümens obeyed him little, and he tried to rule them directly, from a new capital, Chaghan, in the Chahar lands on the Shira Muren. A patron of Tibetan Buddhism, he had the Buddhist canon translated into Mongolian. In 1618 he made a treaty with the Ming against Nurhaci in return for silver; from 1620 the Ming paid him 40,000 taels a year. His high-handedness drove the eastern princes to the Jurchens. The Khorchin allied with Nurhaci, and when Ligdan attacked them in the mid-1620s, Jurchen troops came to their aid and he withdrew.
      - In 1627 Ligdan moved his people west, towards the Ming frontier at Xuanfu and Datong. He attacked the Kharachin and the Tümed and took Köke Khota (Hohhot), the city Altan Khan had built. The western princes, the Kharachin, Tümed, Ordos and Yöngshiyebü, fought him near the city in 1627–1628; accounts differ on who won, but Ligdan lost many men, and the Kharachin and others turned to Hong Taiji. In 1628 Hong Taiji led his first campaign against the Chahar with his Mongol allies, and Ligdan fled before it. Squeezed between his Mongol enemies and the Jurchens, he raided the Ming frontier to force larger payments, which rose to 81,000 taels a year. In 1631 his last offensive against the Khorchin failed; his allies deserted him, and a Mongol coalition destroyed some 4,000 Chahar near Köke Khota and 3,000 more escorting his Ming silver.
    facts:
      - [Ligdan Khan, "khan 1604–1634"]
      - [Ming payments, "40,000 taels a year from 1620, later 81,000"]
