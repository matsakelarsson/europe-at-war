id: later-jin-conquest-of-chahar
name: Later Jin conquest of Chahar
start: "1628"
end: "1635"
tier: B
summary: "The wars in which Ligdan Khan of the Chahar, the last Mongol great khan of the line of Kublai and Dayan Khan, lost the southern Mongols to Hong Taiji’s Later Jin. Ligdan, khan from 1604, tried to rule the other Mongol tümens directly and took Ming silver to fight the Jurchens; instead the Khorchin, the Kharachin, the Tümed and others allied with the Later Jin. In 1627–1628 he moved his people west from the Shira Muren to Köke Khota (Hohhot) and fought a coalition of the western tümens there, and in 1628 Hong Taiji made his first campaign against him. In 1632 Hong Taiji and his Mongol allies marched west; Ligdan fled across the Yellow River without fighting, and in 1634 he died of smallpox on his way to Kokonor. In 1635 a Later Jin army under Dorgon received the surrender of his son Ejei and a seal said to be that of the Yuan emperors. Hong Taiji, acknowledged as khan by the southern Mongol princes, proclaimed the Qing dynasty in 1636."
countries: [cn]
