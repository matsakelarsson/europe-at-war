id: sieges-of-batavia
name: Mataram’s sieges of Batavia
start: "1628-08"
end: "1629-10"
tier: B
summary: "Two attempts by Sultan Agung of Mataram, master of Central and East Java since the fall of Surabaya in 1625, to take Batavia, the fortified headquarters that the Dutch East India Company (VOC) had built on the ruins of Jayakarta in 1619. Agung meant to rule all of Java and saw Batavia as the stepping stone to Banten. In August 1628 a Mataram fleet landed troops beside the castle and an army followed overland, about 10,000 men in all; they tried to storm the outworks and to dam the Ciliwung river, but the garrison of a few hundred held out, and by December the besiegers had run out of food. Agung had the two commanders executed, and the army withdrew, leaving hundreds of beheaded bodies. For the second siege in 1629 Mataram stocked rice at depots along the coast, but Dutch ships found and burned the stores at Tegal and Cirebon, and the Sundanese regent Dipati Ukur turned against Mataram. A weakened army of perhaps 14,000 to 20,000 besieged Batavia from August to early October 1629, when hunger and disease drove it home; Governor-General Jan Pieterszoon Coen died of illness during the siege. Mataram never attacked Batavia again, the Company held its base on Java, and Agung turned his armies east, against Blambangan."
countries: [id, nl]
