notes:
  - Most of the detail comes from the VOC’s records at Batavia; the Javanese chronicles (babad) tell the sieges with legendary elements. Numbers of besiegers and of their losses are Dutch estimates.
  - Mataram camps of 1628–1629 are remembered in Jakarta place names such as Matraman, from “Mataraman”.
