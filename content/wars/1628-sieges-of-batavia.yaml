steps:
  - title: The first siege
    date: August – December 1628
    when: "1628-08-22"
    borders: "1628-09-01"
    countries: [id, nl]
    body:
      - Sultan Agung had made peace overtures to the Company in the early 1620s in the hope of naval help against Surabaya, but the Dutch would not fight for him, and after Surabaya fell in 1625 he turned against them. In April 1628 his envoy proposed terms that the Company refused. In August Mataram ships arrived off Batavia, at first asking to land cattle and rice for trade; on 25–26 August, as more ships arrived, troops began to come ashore north of the castle, and the Dutch pulled everyone inside and burned the bamboo suburbs to deny the attackers cover. The fleet was commanded by Tumenggung Bahureksa, regent of Kendal, and an army under Pangeran Mandurareja marched overland.
      - On 29 August the Javanese attacked Fort Hollandia, an outwork south-east of the town, and were driven off with heavy losses by about 120 men; reinforcements from Banten roads and Onrust island brought the garrison to about 730. By October the overland army had arrived, bringing the besiegers to about 10,000. They blocked the roads and tried to dam the Ciliwung to cut off Batavia’s water, and made repeated attempts to storm the walls with ladders, without success.
      - The Mataram commanders had not prepared for a long siege far from home, and by December their army was starving. Sultan Agung sent executioners to punish Bahureksa and Mandurareja for their failure, and on 3 December the Dutch found that the besiegers had marched away, leaving 744 headless bodies of their own men behind.
