  - title: The second siege and the burned rice stores
    date: June – October 1629
    when: "1629-08"
    borders: "1629-08-01"
    countries: [id, nl]
    body:
      - Sultan Agung saw that supply had defeated him, and for the second campaign he had rice stored at depots along the north coast of West Java, at Tegal and Cirebon and in the newly settled lands of Karawang, and boats gathered to carry it. In July 1629 Dutch ships found the stores at Tegal and Cirebon and burned them with the boats. Meanwhile Dipati Ukur, the Sundanese regent of the Priangan highlands, who was to march with the Mataram army, quarrelled with its commander, killed Mataram officials and rose in rebellion; it took Mataram until 1632 to crush him.
      - The main army under Adipati Juminah, perhaps 14,000 to 20,000 strong, reached Batavia hungry and stricken by malaria and dysentery. It camped south of the town, at the place still called Matraman, attacked the redoubts and fouled the Ciliwung, spreading disease in the town. On 21 September 1629 Coen died in the castle, probably of dysentery or cholera. In early October the besiegers, starving, gave up and retreated, many dying on the way.
      - Agung never attacked Batavia again. He turned his armies against Blambangan, the Hindu kingdom at the eastern end of Java backed by Bali, and in 1630–1636 against rebels in his own lands. The Company was left secure behind its walls, and many Javanese soldiers who dared not return to Mataram settled on the north coast of West Java, where the rice lands of Karawang, Bekasi and Indramayu grew from their villages. Mataram and the Company made peace only in 1646, after Agung’s death.
    facts:
      - [Rice stores burned, "Tegal and Cirebon, July 1629"]
      - [Besiegers, "perhaps 14,000 to 20,000"]
      - [Coen’s death, "21 September 1629"]
      - [Withdrawal, "early October 1629"]
