steps:
  - title: Casale and the Pass of Susa
    date: 1628–1629
    when: "1627-12-26"
    borders: "1629-03-11"
    countries: [it, fr, es]
    body:
      - Vincenzo II Gonzaga died on 26 December 1627, three days after his niece Maria, heiress of Montferrat, had married the son of his cousin Charles Gonzaga, Duke of Nevers, a French peer. Nevers took over in Mantua in January 1628. The Spanish governor of Milan, Gonzalo Fernández de Córdoba, had already agreed with Charles Emmanuel I of Savoy to share Montferrat. The emperor had placed both duchies under sequestration until he decided the succession, but in March Córdoba laid siege to Casale, one of the strongest fortresses in Europe, and the Savoyards took Trino and Nizza Monferrato.
      - Casale held out through the year, defended by Nevers’ troops with French volunteers, and a relief force Nevers raised in France was destroyed by the Savoyards in the Alps. Once the Huguenot stronghold of La Rochelle had surrendered in October 1628, France could act. In March 1629 Louis XIII and Cardinal Richelieu brought an army over the Montgenèvre and on 6 March stormed the barricades the Savoyards had built across the Pass of Susa. Charles Emmanuel came to terms at once, the Spanish lifted the siege of Casale, and French troops moved into Susa and Casale.
    facts:
      - [Death of Vincenzo II, 26 December 1627]
      - [First siege of Casale, "March 1628 – March 1629"]
      - [Pass of Susa, "6 March 1629, French victory"]
    markers:
