id: war-of-the-mantuan-succession
name: War of the Mantuan Succession
start: "1628-03"
end: "1631-06-19"
tier: B
summary: A war over the succession to Mantua and Montferrat after the last Gonzaga duke of the main line died in December 1627. France backed his heir, the French-born Duke of Nevers, while Spain, Savoy and the emperor tried to keep him out; the fighting, a side theatre of the Thirty Years’ War, centred on the fortress of Casale and ended with Nevers confirmed as duke and France holding Pinerolo.
countries: [it, fr, es, at]
sides:
  - id: fr
    name: France, Nevers and Venice
    polities: [france, mantua, montferrat, venice]
    ink: navy
    moves: French and Venetian moves
    success: French success
  - id: sp
    name: Spain and the emperor
    polities: [spain, milan, habsburg]
    ink: gold
    moves: Spanish and imperial moves
    success: Spanish and imperial success
  - id: sav
    name: Savoy
    polities: [savoy]
    ink: teal
    moves: Savoyard moves
    success: Savoyard success
notes:
  - Dates are Gregorian. Savoy fought with Spain in 1628, made peace with France at Susa in March 1629, and joined Spain again late that year.
  - Plague, brought by the armies, killed perhaps a third of the people of northern Italy in 1629–1631; Milan and Venice lost about half their inhabitants. The epidemic is the background of Alessandro Manzoni’s novel The Betrothed.
  - Wikipedia’s article dates the French capture of Pinerolo to March 1629; it fell to Richelieu’s army on 29 March 1630.
