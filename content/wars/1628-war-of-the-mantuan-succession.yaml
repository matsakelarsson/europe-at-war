        side: fr
        name: Pinerolo
        date: 29 March 1630
        text: Richelieu’s army took the Savoyard fortress at the foot of the Alps. France kept it, with a road into Piedmont, until 1696.
        lonlat: [7.33, 44.88]
      - kind: battle
        side: fr
        name: Battle of Avigliana
        date: 10 July 1630
