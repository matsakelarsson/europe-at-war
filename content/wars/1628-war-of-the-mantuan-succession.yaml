        lonlat: [7.4, 45.08]
        lp: t
      - kind: event
        name: Ostiglia
        date: April 1630
        text: After armed locals attacked an imperial foraging party and the garrison, imperial troops killed about 600 people in the town.
        lonlat: [11.13, 45.07]
      - kind: battle
        side: sp
        name: Battle of Villabuona
        date: 29 May 1630
        text: A Venetian army marching to relieve Mantua was surprised and routed by the imperialists under Gallas.
        lonlat: [10.71, 45.26]
        lp: l
      - kind: taken
        side: sp
        name: Mantua
        date: 18 July 1630
        text: The lakes around the city had kept the imperialists out for months. The sack that followed was one of the worst of the century.
        lonlat: [10.79, 45.16]
      - kind: held
        side: fr
        name: Casale
        date: May–October 1630
        text: The French garrison held out against Spinola, who died during the siege. On 26 October Mazarin, riding out between the armies, announced the truce.
        lonlat: [8.45, 45.13]
      - kind: treaty
        name: Treaty of Cherasco
        date: 6 April and 19 June 1631
        text: Signed by France, the emperor and Savoy, it confirmed Nevers as duke of Mantua and Montferrat.
        lonlat: [7.87, 44.65]
