  - title: Mantua, the plague and Cherasco
    date: 1629–1631
    when: "1629-06"
    borders: "1631-06-19"
    countries: [it, fr, es, at]
    body:
      - Spain sent Ambrogio Spinola to try again, and Emperor Ferdinand II, now free of his war with Denmark, sent an army from Germany under Count Collalto. Spinola besieged Casale again, Savoy rejoined Spain, and the imperial army besieged Mantua from late 1629. A French army under Montmorency overran Savoy, and in March 1630 Richelieu took Pinerolo, the key to the western Alps. Plague came with the armies and killed perhaps a third of the people of northern Italy. The war grew savage. In April 1630, at Ostiglia, imperial soldiers killed about 600 villagers, women and children among them, in revenge for an attack by local bandits.
      - On 29 May 1630 the imperialists routed a Venetian relief army at Villabuona, and on 18 July they stormed Mantua, whose garrison plague had cut to about 700 fit men. The city and the Gonzaga collections were plundered for three days. Casale held out, and in late October, as a French relief army arrived, the papal envoy Giulio Mazarin rode between the lines to arrange a truce. Ferdinand, now facing Gustavus Adolphus of Sweden in Germany, made peace at Cherasco on 6 April and 19 June 1631. Nevers kept Mantua and Montferrat, Savoy gained Trino and Alba, and by a secret agreement Savoy let France keep Pinerolo, which it held until 1696.
    facts:
      - [Sack of Mantua, 18 July 1630]
      - [Plague of 1629–1631, "perhaps a third of northern Italians died"]
      - [Treaty of Cherasco, "6 April and 19 June 1631"]
