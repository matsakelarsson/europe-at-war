id: siege-of-hooghly
name: Siege of Hooghly
start: "1632-06-24"
end: "1632-09"
tier: C
summary: "The Mughal siege and capture of Hooghly (Hugli), the Portuguese trading town on the Hooghly river in western Bengal. The Portuguese settlement had grown from about 1579 into the chief port of Bengal, but Mughal officials accused its people of evading customs, of piracy and of raiding the delta for slaves, often together with the Arakanese, and of converting people by force. Shah Jahan, who is said also to have resented the Portuguese for refusing him help when he was a rebel prince in Bengal, ordered the governor of Bengal, Qasim Khan Juvayni, to take it. A large Mughal army and fleet laid siege to the town from 24 June 1632. The garrison of about 300 Portuguese and some 700 Indian Christians held out for about three months, until the Mughals blew a breach with a mine and stormed it in September (Banglapedia gives 13 September, other accounts 24 September). Many were killed in the fighting and as they tried to escape down the river, and about 4,000 men, women and children were taken prisoner and sent to Agra. Some Portuguese later came back to trade at Hooghly and the neighbouring Bandel, but the town never recovered its importance."
