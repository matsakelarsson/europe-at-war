id: smolensk-war
name: Smolensk War
start: "1632"
end: "1634"
tier: B
summary: In 1632, during the interregnum after the death of Sigismund III and as the Truce of Deulino neared its end, Russia sent an army under Mikhail Shein to retake Smolensk. The new Polish king, Władysław IV, relieved the city in 1633 and surrounded Shein’s army, which surrendered early in 1634. At Polyanovka that June Russia accepted the Deulino border with small changes and paid Władysław to give up his claim to the Russian throne.
