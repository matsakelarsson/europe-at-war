id: franco-spanish-war-1635
name: Franco-Spanish War of 1635–1659
start: "1635-05-19"
end: "1659-11-07"
tier: B
summary: The long war between Bourbon France and Habsburg Spain that began as part of the Thirty Years’ War and went on for eleven years after the Peace of Westphalia. France won at Rocroi in 1643 and Lens in 1648, Spain recovered ground while France was torn by the Fronde, and an Anglo-French victory at the Dunes in 1658 led to the Treaty of the Pyrenees, which gave France Roussillon and Artois and marked the shift of power in Europe from Spain to France.
