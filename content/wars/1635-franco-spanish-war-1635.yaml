  - title: Lens and the Fronde
    date: 1646–1653
    when: "1648-08-20"
    borders: "1652-10-21"
    countries: [fr, be, nl, de, es]
    body:
      - France pushed into Flanders and took Dunkirk in October 1646, with the Dutch fleet blockading the port. But in January 1648 the Dutch made a separate peace with Spain at Münster, and the Peace of Westphalia that October ended France’s war with the Emperor, not with Spain. On 20 August 1648 Condé, as Enghien now was, beat Archduke Leopold Wilhelm’s army at Lens, the last great battle of the Thirty Years’ War. Days later Paris rose against Mazarin and his war taxes, and barricades went up in the streets. It was the start of the Fronde, a series of revolts that lasted until 1653.
      - The Paris Parlement’s revolt was settled in 1649, but the great nobles took up the fight. Condé, arrested in 1650 and freed in 1651, rebelled and allied with Spain. On 2 July 1652 Turenne, now loyal to the crown, nearly destroyed Condé’s army against the walls of Paris, until the king’s cousin, the Grande Mademoiselle, had the gates opened and the guns of the Bastille fired on the royal troops. Spain used France’s disorder to retake Dunkirk and Gravelines in 1652, and Barcelona surrendered to Philip IV that October, ending the Catalan revolt. Louis XIV returned to Paris the same month, and Condé went over to Spain.
    facts:
      - [Peace of Münster, "30 January 1648, Spain and the Dutch Republic"]
      - [Battle of Lens, "20 August 1648, French victory"]
      - [Battle of the Faubourg Saint-Antoine, "2 July 1652"]
    markers:
      - kind: taken
        side: es
        name: Dunkirk
        date: 1646 and 1652
        text: Condé took the port, base of the privateers that preyed on Dutch and English shipping, in October 1646. Spain won it back in September 1652.
        lonlat: [2.377, 51.038]
      - kind: treaty
        name: Münster
        date: 30 January 1648
        text: Spain recognised the independence of the Dutch Republic, ending eighty years of war, and France lost its ally in the Netherlands.
        lonlat: [7.626, 51.962]
      - kind: battle
        side: fr
        name: Battle of Lens
        date: 20 August 1648
        text: Condé feigned a retreat to draw the Spanish army off its strong position on the heights, then turned and routed it.
        lonlat: [2.833, 50.417]
      - kind: battle
        side: fr
        name: Faubourg Saint-Antoine
        date: 2 July 1652
        text: Trapped between Turenne’s army and the city wall, Condé’s men fought among the houses of the suburb. The cannon of the Bastille covered their escape into Paris.
        lonlat: [2.369, 48.853]
      - kind: held
        side: con
        name: Bordeaux
        date: 1650–1653
        text: The Fronde lasted longest here, where a radical movement, the Ormée, ruled the city until it submitted to royal troops in July 1653.
        lonlat: [-0.58, 44.84]
