  - title: The Dunes and the Peace of the Pyrenees
    date: 1654–1659
    when: "1654-08-25"
    borders: "1659-11-07"
    countries: [fr, be, es, gb]
    side_names:
      con: Success for Condé
    move_names:
      con: Moves by Condé
    body:
      - With the Fronde over, Turenne took the offensive. On 25 August 1654 he broke the lines of the Spanish army besieging Arras, though Condé beat him in turn at Valenciennes in 1656. Mazarin then allied with Oliver Cromwell’s England, at war with Spain since 1655, and in 1657 some 6,000 English soldiers joined Turenne, with Dunkirk promised to England. On 14 June 1658 a Spanish army under Don Juan José of Austria and Condé, with English Royalist exiles, tried to relieve besieged Dunkirk and was routed in the dunes east of the town. Dunkirk surrendered on 25 June and was handed to England, and that summer Gravelines, Oudenaarde and Ypres fell to the French.
      - Both crowns were exhausted, and Mazarin and Philip IV’s minister Luis de Haro negotiated for months on Pheasant Island in the Bidasoa, on the border. The Treaty of the Pyrenees, signed on 7 November 1659, gave France Roussillon and northern Cerdagne, most of Artois and a string of fortresses in Flanders, Hainaut and Luxembourg, among them Gravelines, Thionville and Montmédy. France gave up Catalonia, and Condé was pardoned. Louis XIV married Philip’s daughter Maria Theresa, who renounced her claim to the Spanish throne in return for a dowry that Spain never paid.
    facts:
      - [Battle of the Dunes, "14 June 1658, French and English victory"]
      - [Dunkirk, "English from 1658 until sold to France in 1662"]
      - [Treaty of the Pyrenees, "7 November 1659"]
    markers:
      - kind: battle
        side: fr
        name: Battle of Arras
        date: 25 August 1654
        text: Turenne attacked the Spanish siege lines at night and routed them; Condé saved the rest of the army by an orderly retreat to Cambrai.
        lonlat: [2.781, 50.29]
      - kind: battle
        side: es
        name: Battle of Valenciennes
        date: 16 July 1656
        text: Don Juan José and Condé fell on Turenne’s army, divided by the floods the defenders had let loose, and broke the siege.
        lonlat: [3.523, 50.358]
      - kind: battle
        side: fr
        name: Battle of the Dunes
        date: 14 June 1658
        text: Cromwell’s redcoats stormed a high dune held by Spanish infantry, while English ships fired on the Spanish flank from the sea. The Spanish army broke within hours.
        lonlat: [2.45, 51.06]
      - kind: taken
        side: en
        name: Dunkirk
        date: 25 June 1658
        text: The port surrendered to Turenne and was handed over to England as agreed. Charles II sold it to France in 1662.
        lonlat: [2.377, 51.038]
        lp: b
      - kind: taken
        side: fr
        name: Gravelines
        date: August 1658
        text: The fortress fell after a siege and was kept by France in the peace.
        lonlat: [2.128, 50.986]
        lp: l
      - kind: taken
        side: fr
        name: Ypres
        date: September 1658
        text: Turenne’s last conquest of the war. France returned the town to Spain in 1659.
        lonlat: [2.885, 50.851]
      - kind: treaty
        name: Pheasant Island
        date: 7 November 1659
        text: The two chief ministers met in a pavilion built on the island, half on each side of the border. The island is still a French–Spanish condominium.
        lonlat: [-1.766, 43.343]
