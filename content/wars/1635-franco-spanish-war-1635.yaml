steps:
  - title: Rocroi
    date: 1639–1643
    when: "1643-05-19"
    borders: "1643-05-19"
    countries: [fr, be, es]
    body:
      - After the Spanish invasion of Picardy in 1636 was thrown back, the war slowly turned France’s way. The French took Hesdin in 1639 and Arras, the capital of Artois, after a long siege in 1640. That year Catalonia and Portugal rose against Philip IV’s government; the Catalans put themselves under Louis XIII, and French troops helped them, taking Perpignan in 1642 and with it Roussillon. Cardinal Richelieu died in December 1642 and Louis XIII on 14 May 1643, leaving a four-year-old king, Louis XIV, under the regency of his mother, Anne of Austria, and Cardinal Mazarin.
      - Spain’s commander in the Netherlands, Francisco de Melo, hoped to exploit the change of reign. In May 1643 he invaded through the Ardennes and besieged the small fortress of Rocroi. The 21-year-old Duke of Enghien marched to relieve it and attacked on 19 May. His cavalry routed the Spanish horse on one wing and then fell on the Spanish infantry, the famous tercios, which beat off several attacks before they were broken; Spanish losses in dead and prisoners were very heavy. Rocroi ended the tercios’ reputation for invincibility, and Enghien went on to take Thionville in August.
    facts:
      - [Arras taken by France, "9 August 1640"]
      - [Death of Louis XIII, "14 May 1643"]
      - [Battle of Rocroi, "19 May 1643, French victory"]
