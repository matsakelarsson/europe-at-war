notes:
  - The war’s first years, France’s entry in 1635–1636 and its campaigns in Germany, are told in the Thirty Years’ War. Spain also faced the revolts of Catalonia (the Reapers’ War, 1640–1652), in which the Catalans placed themselves under the French crown, and of Portugal (1640–1668), which France supported. Fighting in northern Italy is left out here.
  - Dates are New Style. The English, allies of France from 1657, still used the Julian calendar, ten days behind.
  - Louis, Duke of Enghien, became Prince of Condé on his father’s death in 1646 and is known as the Great Condé. He won Rocroi and Lens for France, and from 1651 to 1659 fought for Spain.
