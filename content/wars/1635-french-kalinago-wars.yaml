id: french-kalinago-wars
name: French–Kalinago wars
start: "1635-06"
end: "1660-03-31"
tier: C
summary: "The wars in which French colonists took Guadeloupe, Martinique and Grenada from the Kalinago (Island Caribs) between 1635 and 1660. The Compagnie des Îles de l’Amérique, founded under Cardinal Richelieu, sent Charles Liénard de l’Olive and Jean du Plessis to Guadeloupe with 554 people in June 1635; short of food, they turned on the Kalinago, and a war of raids and reprisals lasted until a peace of 1640, after which the Kalinago withdrew from most of the island. On Martinique, settled from Saint Kitts by Pierre Belain d’Esnambuc in September 1635, his nephew Jacques Dyel du Parquet agreed a truce in 1637 that left the Kalinago the windward side, the Cabesterre. In 1649 du Parquet landed on Grenada, where an agreement with the Kalinago leader Kairouane soon gave way to five years of war; in 1650 or 1651 Kalinago fighters cornered at Sauteurs in the north threw themselves from the cliff rather than surrender, and by 1654 Kalinago resistance on the island had been crushed. Kalinago from Saint Vincent and Dominica attacked Martinique and Saint Lucia in 1654–1657, and after du Parquet’s death in 1658 the colonists drove the remaining Kalinago from the Cabesterre. On 31 March 1660, at Basse-Terre on Guadeloupe, the French governor Charles Houël and English representatives signed a treaty with Kalinago leaders that left them Dominica and Saint Vincent, which became their last refuges; the English and French later broke it."
countries: [fr, gd, lc, dm, vc]
