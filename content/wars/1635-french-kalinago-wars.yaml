notes:
  - "The wars are known almost only from French missionaries and officials, above all the Dominican Jean-Baptiste du Tertre and Raymond Breton, who lived among the Kalinago of Dominica; dates, numbers and the terms of the treaties vary between their accounts, and no Kalinago account survives from the period."
  - The Kalinago on Saint Vincent were by then mixing with Africans who had escaped slavery or survived shipwrecks, the ancestors of the Garifuna; the British wars against them on that island are told in the First and Second Carib Wars.
