  - title: Between Russia and Galdan Tseren
    date: 1730–1743
    when: "1731-10-10"
    borders: "1741-03-01"
    countries: [kz, ru]
    body:
      - Abulkhair looked to Russia for help against the Dzungars and his Kazakh rivals. Empress Anna accepted his request for Russian subjecthood on 19 February 1731, and on 10 October 1731 Abulkhair and 29 elders of the Junior Zhuz swore the oath before the Russian envoy Alexei Tevkelev; leaders of the Middle Zhuz followed in the next years. Many Kazakhs saw the oath as a betrayal, and Abulkhair went on raiding the Bashkirs and Kalmyks, but Russia built the fortress of Orenburg in 1735 at the mouth of the Or, the start of a line of forts along the Yaik. Galdan Tseren, at peace with the Qing from 1739, made the Senior Zhuz send hostages and pay a tribute of one fox skin per household.
      - In the spring of 1739 some 24,000 Dzungar horsemen invaded the Middle Zhuz in two columns, and in February 1741 an army of about 30,000 under Septen and Lama Dorji came again from three directions. Khan Abilmambet fled towards the Russian forts, and the Dzungars went home with about 3,000 captives, among them the young sultan Ablai, captured with a scouting party of 200 men. In 1742 the khans of the Middle Zhuz sent hostages and promised tribute, and Abulkhair sent one of his sons to the Dzungar court. Ablai was released in 1743, after Russian envoys interceded and another sultan was sent as a hostage in his place.
    facts:
      - [Abulkhair’s oath to Russia, "10 October 1731"]
      - [Orenburg founded at the Or, "1735"]
      - [Dzungar invasion of the Middle Zhuz, "February 1741, about 30,000 men"]
      - [Ablai captured, "1741, released 1743"]
    markers:
