  - title: Ordabasy, Bulanty and Anyrakay
    date: 1726–1730
    when: "1726"
    borders: "1729-12-01"
    countries: [kz]
    body:
      - In the autumn of 1726 the leaders of the three zhuzes met on a hill on the Badam river near Shymkent, a place since called Ordabasy, and chose Abulkhair as commander of a united militia; among them were the khans Abulmambet and Semeke and the judges Tole Bi and Kazybek Bi, and the batyrs Bogenbay and Kabanbay. In the spring of 1727, by tradition, the militia defeated a Dzungar army on the Bulanty and Bileuty rivers in the Ulytau hills, a place later called Qalmaq Qyrylghan, “where the Kalmyks perished”. The same year Tsewang Rabtan died, and his son Galdan Tseren fought his half-brother Lobzang Shono for the throne.
      - The last great battle of these years was fought at Anyrakay, in the hills south of Lake Balkhash, in the winter of 1729–1730 or the spring of 1730; the Dzungars were driven back east, and Kazakhs returned to the pastures north of the Ili. Both battles are known mainly from oral tradition, first written down in the early 20th century, and their exact sites and dates are uncertain. After Anyrakay, the alliance fell apart over who should be khan of all the Kazakhs, and the Kazakhs did not recover Zhetysu or the Syr Darya towns.
    facts:
