  - title: The kurultai of 1710 and the Ayagoz
    date: 1708–1720
    when: "1717"
    borders: "1717-06-01"
    countries: [kz, ru]
    body:
      - New Dzungar raids reached the Senior Zhuz in 1708, and in 1710 an assembly (kurultai) of the three zhuzes in the Karakum desert north of the Aral Sea chose the batyr Bogenbay to lead a common militia, which won several victories in the next years; sources date them between 1711 and 1714. Tauke Khan died in 1715 or 1718, and with him ended what Kazakh tradition calls its golden age; his successor Kaip had little authority.
      - In 1717 a Kazakh militia of about 30,000 men attacked a Dzungar force that had dug in on the Ayagoz river, south-east of today’s Semey, and was beaten when Dzungar reinforcements arrived. In 1718 the Dzungars raided towards Turkestan. At the same time Russia was pushing up the Irtysh towards the Dzungar lands in search of gold, founding Omsk in 1716, Semipalatinsk in 1718 and Ust-Kamenogorsk in 1720; the Dzungars besieged the Russian fort at Yamyshevo in 1716 and fought a Russian expedition at Lake Zaysan in 1720. In 1720 the Qing drove the Dzungars out of Tibet, which kept Tsewang Rabtan busy in the east.
    facts:
      - [Kurultai in the Karakum, "1710"]
      - [Battle of the Ayagoz, "1717, Dzungar victory"]
      - [Death of Tauke Khan, "1715 or 1718"]
