  - title: Galdan, Tauke and the Syr Darya towns
    date: 1681–1698
    when: "1681"
    borders: "1684-06-01"
    countries: [kz, uz, kg]
    body:
      - Galdan, who took power among the Dzungars in 1671, turned west in 1681 and besieged Sayram, the main town of the Senior Zhuz. The siege failed, as did another in 1683, but in 1684 the Dzungars took and plundered Sayram, captured other Syr Darya towns that recognised the Kazakh khan Tauke and received the submission of Tashkent. Tauke, remembered by Kazakhs for the law code called the Zhety Zhargy, sent a son to Lhasa as a hostage.
      - When Galdan turned east against the Khalkha Mongols and the Qing, Tauke struck back. With some 10,000 men from Subhan Quli Khan of Bukhara he retook Tashkent in 1688 and raided Dzungar lands. Galdan’s defeat by the Qing at Jao Modo in 1696 and his death the next year brought his nephew Tsewang Rabtan to power. In 1698 a Dzungar army, reported at 40,000 men, defeated the Senior Zhuz on the Chu and the Talas, killing several thousand and taking about 10,000 prisoners.
    facts:
      - [Sayram taken and plundered, "1684"]
      - [Tashkent retaken by Tauke, "1688"]
      - [Defeat on the Chu and Talas, "1698, about 10,000 Kazakhs taken prisoner"]
