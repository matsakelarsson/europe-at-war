steps:
  - title: Jangir Khan and Orbulaq
    date: 1635–1652
    when: "1643"
    borders: "1643-06-01"
    countries: [kz, kg]
    body:
      - In the 1630s the Oirat tribes of the upper Irtysh and the Ili united under the Choros prince Erdeni Batur, who took the title of khong tayiji in 1638; his realm became known as the Dzungar Khanate. In 1635 the Kazakh sultan Jangir, son of Khan Esim, raided the Oirats and was defeated and captured in a winter battle; he was later freed. In 1640 another Dzungar campaign carried off thousands of Kazakh and Kyrgyz families from the lands between Lake Issyk-Kul and the Chu.
      - In 1643 Erdeni Batur invaded Zhetysu with a large army; later accounts give 50,000 men, which is certainly exaggerated. Jangir, now khan, met him with a few hundred men in the gorge of the Orbulaq on the south-western edge of the Dzungarian Alatau, where they dug trenches and a rampart and fired on the Dzungars from cover. When the Dzungars broke through to the open valley, a relief force sent by Yalangtush Bahadur, the Bukharan governor of Samarkand, attacked them from the rear, and Erdeni Batur withdrew. The fighting went on. The Dzungars campaigned again in 1645–1646 and subdued the Kyrgyz in 1652, and Jangir died fighting them about 1652, though some historians date his death a few years later.
    facts:
      - [Battle of Orbulaq, "1643, Kazakh victory"]
      - [Kazakh force at the gorge, "about 600 men, by tradition"]
      - [Jangir Khan killed, "about 1652"]
