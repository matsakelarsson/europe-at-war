  - title: The fall of the Dzungars
    date: 1745–1757
    when: "1755"
    borders: "1757-09-01"
    countries: [kz, cn]
    body:
      - Galdan Tseren died in 1745, and his heirs fought each other for the throne. Ablai, now the strongest leader of the Middle Zhuz, sheltered the Dzungar princes Dawachi and Amursana in 1752 and refused to hand them over; with Kazakh help Dawachi seized power, and Kazakh raiders drove off Dzungar herds. When Amursana fell out with Dawachi he went over to the Qing, and in the spring of 1755 a Qing army, with Amursana among its commanders, overran the Dzungar Khanate and took Ghulja. That autumn Amursana rose against the Qing, was defeated and fled to the Kazakhs.
      - Ablai refused to give him up. Qing columns entered the Kazakh steppe in 1756 and 1757, and in August 1756 a combined Qing and Dzungar force defeated Ablai’s men. In the summer of 1757 Ablai made terms, and his envoys went to Beijing, where the Qing court treated their gifts as tribute and counted him a vassal; he kept his ties with Russia as well. Amursana fled to Russia and died of smallpox at Tobolsk in September 1757. In the Qing campaigns of 1755–1758 the Dzungars were all but destroyed; the historian Wei Yuan estimated that of some 600,000 people about 40% died of smallpox, 30% were killed by Qing troops and 20% fled to Russia or the Kazakhs. Kazakh and Kyrgyz herders moved into the emptied pastures of Zhetysu and the Tarbagatai.
    facts:
      - [Death of Galdan Tseren, "1745"]
      - [Qing conquest of Dzungaria, "1755"]
      - [Ablai comes to terms with the Qing, "1757"]
    markers:
