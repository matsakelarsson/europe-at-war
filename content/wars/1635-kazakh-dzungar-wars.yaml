notes:
  - The Kazakhs were divided into three hordes or zhuzes, the Senior Zhuz in Zhetysu and the south, the Middle Zhuz in the centre and north-east and the Junior Zhuz in the west, each with its own khans and sultans; a khan of all the Kazakhs had real power only at times. The Dzungars were the leading tribe of the Oirat confederation, ruled by a khong tayiji from the Ili valley.
  - Russian envoys’ reports and Qing and Bukharan chronicles give the main written record. Many episodes, among them the battles of Bulanty and Anyrakay, are known mainly from Kazakh oral tradition recorded in the 19th and 20th centuries, so their dates and places are uncertain and numbers are often legendary. Wikipedia counts the wars as ending in 1742 or 1745; this entry follows them to the fall of the Dzungars.
  - The Qing conquest of the Dzungar Khanate and the mass killing of the Dzungars in 1755–1758 are told in their own entry.
