id: kazakh-dzungar-wars
name: Kazakh–Dzungar wars
start: "1635"
end: "1757"
tier: A
summary: "A century of wars between the Kazakh Khanate and the Dzungar Khanate, the last great Oirat (western Mongol) steppe empire, for the pastures of Zhetysu (Semirechye) and the towns of the middle Syr Darya. The Dzungars, better organised and with firearms of their own, won most of the campaigns, though the Kazakhs held them at the gorge of Orbulaq in 1643. Galdan took Sayram and Tashkent in the 1680s, Tsewang Rabtan defeated the Senior Zhuz on the Chu and Talas in 1698, and in 1723 a sudden Dzungar invasion took Turkestan, Tashkent and Sayram and drove many Kazakh clans from their lands in what Kazakhs remember as the Aqtaban Shubyryndy, the “barefoot flight”. A united Kazakh militia under Abulkhair won battles at Bulanty and Anyrakay in 1727–1730, but rivalry among the khans ended the alliance. Abulkhair’s Junior Zhuz swore allegiance to Russia in 1731, the Senior Zhuz paid tribute to the Dzungars, and Galdan Tseren’s armies invaded the Middle Zhuz again in 1739–1742. The wars ended when the Dzungar Khanate fell apart after 1745 and was destroyed by the Qing in 1755–1758; the Kazakh sultan Ablai, after supporting rival Dzungar princes, came to terms with the Qing in 1757, and Kazakh clans moved into the emptied pastures."
countries: [kz, kg, uz, cn]
sides:
