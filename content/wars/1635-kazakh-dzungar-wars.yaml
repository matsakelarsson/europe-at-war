  - title: Aqtaban Shubyryndy, the barefoot flight
    date: 1723–1725
    when: "1723"
    borders: "1723-06-01"
    countries: [kz, uz, kg]
    body:
      - After the Kangxi emperor died in December 1722, Tsewang Rabtan made peace with the Qing and turned his armies west. In the spring of 1723, after a hard winter and as the herders were preparing to move to their summer pastures, a Dzungar army of more than 30,000 under his son Lobzang Shono (Shono Lauzan) fell on the Kazakhs without warning. It took Sayram, Tashkent and Turkestan and captured the family of Abulkhair, khan of the Junior Zhuz; in early 1724 a second attack hit the winter camps of the Senior Zhuz on the Chu and destroyed Sozak and other towns.
      - Whole clans fled, abandoning their herds and belongings. Kazakhs of the Senior and Middle Zhuz fled south towards Khojand, Samarkand and Bukhara, while others crossed the Syr Darya towards Khiva, and much of the Junior Zhuz moved north-west towards the Yaik (Ural) and the Volga, where they clashed with the Kalmyks, Bashkirs and Cossacks. Kazakhs remember these years as the Aqtaban Shubyryndy, “the flight until the soles were white”, and the Alqakol Sulama, “the collapse at Lake Alqakol”. Many died of hunger and disease on the way; there are no reliable figures. Abulkhair retook Turkestan for a time, but in 1725 the Dzungars recaptured the Syr Darya towns.
    facts:
      - [Dzungar invasion, "spring 1723"]
      - [Dzungar army, "more than 30,000 under Lobzang Shono"]
      - [Towns taken, "Sayram, Tashkent, Turkestan (1723), Sozak (1724)"]
