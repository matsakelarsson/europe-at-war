notes:
  - The main sources are the Fifth Dalai Lama’s own chronicle and autobiography and later Gelug histories, written by the victors; the Tsangpa and Karma Kagyu side survives mostly in later accounts. Tibetan dates are in the Tibetan lunar calendar and are converted only approximately; accounts differ by a year on several events (the battle in Kokonor is dated 1636 or 1637, the end of the Beri king 1640 or 1641).
  - How much power the Dalai Lama held after 1642 is debated. Some historians see Güshi Khan and his successors as the real rulers, others the regent (desi) Sonam Rapten, and others the Dalai Lama himself, whose authority grew after the regent’s death in 1658. Sonam Rapten is also known as Sonam Chöphel.
