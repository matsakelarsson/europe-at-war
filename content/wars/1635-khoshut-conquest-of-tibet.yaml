steps:
  - title: Choghtu and the battle in Kokonor
    date: 1634–1637
    when: "1637"
    borders: "1637-03-01"
    countries: [cn, mn]
    body:
      - Central Tibet had been divided for decades between the patrons of the Karma Kagyu school, the princes of Tsang ruling from Shigatse, and those of the Gelug, the school of the Dalai Lamas, based in Lhasa and its great monasteries. The Tsangpa kings Karma Phuntsok Namgyal and, from 1620, his son Karma Tenkyong took control of most of Ü-Tsang, attacked the Gelug in Lhasa in 1618 and forbade a search for the Fourth Dalai Lama’s successor. A Mongol force defeated the Tsangpa army at Lhasa in 1621 and restored much of the Gelug position, and the Fifth Dalai Lama, born in 1617, was found and enthroned. His chief attendant, Sonam Rapten, looked for stronger Mongol protectors.
      - The Tsangpa had allies of their own among the Mongols. Ligdan Khan of the Chahar was marching towards Tibet when he died in 1634, and the Khalkha prince Choghtu Khong Tayiji, a poet and a patron of the Karma Kagyu, took up the venture, conquered the Tümed living at Kokonor (Qinghai Lake) and settled there. In 1635 he sent his son Arslan with an army into central Tibet. Arslan plundered around Drepung and Lhasa, but then turned on the Tsang army instead of helping it, and was killed on his father’s orders.
      - Sonam Rapten’s envoys found help among the Oirats, whose chiefs had recently adopted the Gelug faith. In 1636 Güshi Khan of the Khoshut and the Dzungar chief Erdeni Batur crossed into Kokonor with about 10,000 men. In early 1637 they met Choghtu’s army, said to number 30,000, and routed it at a place later called the Bloody Hill (Ulaan Khoshuu). Choghtu hid in a marmot hole, was found and killed. The Khoshut took over the pastures of Kokonor, which became their base.
    facts:
      - [Choghtu settles at Kokonor, "1634"]
      - [Arslan’s expedition, "1635"]
      - [Battle of the Bloody Hill, "early 1637 (some accounts 1636), Khoshut victory"]
