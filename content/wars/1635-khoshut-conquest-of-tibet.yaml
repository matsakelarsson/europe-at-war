  - title: Lhasa and Beri
    date: 1638–1641
    when: "1640"
    borders: "1641-01-06"
    countries: [cn]
    body:
      - In 1638 Güshi Khan came to Lhasa as a pilgrim. The Fifth Dalai Lama gave him teachings and the title of “Holder of the Doctrine, Dharma King”, and Güshi returned to Kokonor. The Khoshut now held the north-eastern approaches to Tibet.
      - In Kham, in the east, the king of Beri, Donyo Dorje, was a patron of the Bön religion, hostile to the Gelug and an ally of the Tsangpa. Gelug agents intercepted a letter in which he proposed to Karma Tenkyong a joint attack on the Gelug monasteries, and in June 1639 Güshi Khan marched against him with his Oirats and Tibetan tribesmen from Amdo. After more than a year of campaigning Donyo Dorje was captured, according to the Dalai Lama’s chronicle on 6 January 1641, and put to death, and the rest of Kham submitted. Part of Beri’s land went to the neighbouring kingdom of Derge.
      - The Dalai Lama had opposed further war in his name, but Sonam Rapten encouraged Güshi Khan to go on against Tsang without his knowledge.
    facts:
      - [Güshi Khan in Lhasa, "1638"]
      - [Campaign against Beri begins, "June 1639"]
      - [Donyo Dorje captured, "6 January 1641 (or 1640)"]
