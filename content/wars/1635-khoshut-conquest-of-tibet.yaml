id: khoshut-conquest-of-tibet
name: Khoshut conquest of Tibet
start: "1635"
end: "1642"
tier: B
summary: "The campaigns in which Güshi Khan, chief of the Khoshut Oirats, made the Gelug school of Tibetan Buddhism and its leader, the Fifth Dalai Lama, rulers of Tibet. In the early 17th century the Tsangpa kings of Shigatse, patrons of the Karma Kagyu school, ruled most of central Tibet and were hostile to the Gelug. When the Khalkha prince Choghtu Khong Tayiji, an ally of the Tsangpa, settled at Kokonor (Qinghai Lake) in 1634, the Gelug turned to the Oirats. Güshi Khan defeated and killed Choghtu in Kokonor in 1637, destroyed the Bön-patron king of Beri in Kham in 1640–1641, and in 1641–1642 invaded Tsang and took Shigatse after a long siege. In 1642 the Dalai Lama was installed as ruler of Tibet, with his regent Sonam Rapten running the new Ganden Phodrang government and Güshi Khan as king and protector, the start of the Khoshut Khanate and of the Dalai Lamas’ government, which lasted until 1959."
countries: [cn]
