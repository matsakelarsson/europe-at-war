  - title: Shigatse and the Ganden Phodrang
    date: 1641–1642
    when: "1642-03"
    borders: "1642-05-01"
    countries: [cn]
    body:
      - In 1641 Güshi Khan led his army from Kham into central Tibet and invaded Tsang. His Mongols overran thirteen districts, while Sonam Rapten took over the Tsangpa districts in Ü. Karma Tenkyong shut himself up in the fortress of Samdruptse at Shigatse, whose archers held out for several months; a Tibetan mission to the Manchu ruler Hong Taiji at Mukden came back without help, since he would not take sides. The town of Shigatse fell in the first Tibetan month of 1642, and on the 25th day of the second month, in March 1642, the fortress surrendered. Karma Tenkyong and his family were taken prisoner and held at Neu near Lhasa.
      - In the spring of 1642 the Fifth Dalai Lama was brought to Shigatse and enthroned in the Tsangpa palace as ruler of Tibet, and Güshi Khan was proclaimed king of the three provinces of Tibet. Güshi gave the Dalai Lama authority over Ü, Tsang and part of eastern Tibet, and Sonam Rapten became regent (desi). The government took its name, Ganden Phodrang, from the Dalai Lama’s residence at Drepung. Güshi Khan kept the title of king and the command of the army, with the Khoshut based at Kokonor.
      - Later in 1642 supporters of the Karmapa rose in several districts of Tsang and in Kongpo. The rising was crushed, and the Khoshut killed some 7,000 rebels in Kongpo. Güshi Khan had Karma Tenkyong and two of his ministers put to death; the king was sewn into an ox-hide bag and drowned in the river near Neu. The Tenth Karmapa fled into exile, and many Karma Kagyu monasteries were converted to the Gelug. In 1645 work began on the Potala Palace in Lhasa, the new seat of government.
    facts:
      - [Shigatse fortress surrenders, "March 1642"]
      - [Dalai Lama enthroned at Shigatse, "spring 1642"]
      - [Karma Tenkyong executed, "1642"]
