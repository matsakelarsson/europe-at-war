steps:
  - title: Block Island, Saybrook and Wethersfield
    date: July 1636 – April 1637
    when: "1636-07"
    borders: "1636-08-01"
    countries: [us]
    body:
      - In the 1630s the Pequot, under their sachem Tatobem and from 1634 his son Sassacus, held the lands from the Niantic River to the Wecapaug and took tribute from smaller nations along the coast and on Long Island. Epidemics had swept southern New England since 1616, and the Pequot, the Narragansett east of them and the Mohegan, who had broken away under Uncas, competed for the trade in furs and wampum with the Dutch on the Connecticut River and the English colonists, who founded Windsor, Wethersfield and Hartford there in 1633–1635 and Fort Saybrook at its mouth in 1636. In 1634 Western Niantic warriors, clients of the Pequot, killed the English trader John Stone and his crew; the Pequot said it was revenge for Tatobem, whom Dutch traders had seized and killed after taking his ransom. Massachusetts demanded the killers and a large payment in wampum.
      - On 20 July 1636 another trader, John Oldham, was killed on his boat off Block Island by Manisseans, people of the island who were allied with the Narragansett. The killers were said to have found refuge with the Pequot. In August Governor Henry Vane sent John Endecott with about 90 men to Block Island, where they burned two villages and their stores of corn, and then to the Pequot coast at the mouth of the Pequot (Thames) River, where they burned a village and its fields after talks failed. Lion Gardiner, the commander of Fort Saybrook, protested that the raid had stirred up “a nest of wasps” around his fort.
      - Through the autumn and winter Pequot warriors besieged Fort Saybrook, killing men who went out to the fields. Sassacus tried to win the Narragansett to an alliance against the English, but Roger Williams, the founder of Providence, persuaded Miantonomoh and his uncle Canonicus to side with Massachusetts, and Uncas offered the Mohegan to Connecticut. On 23 April 1637 the Wangunk sachem Sequin, with Pequot warriors, attacked Wethersfield and killed six men and three women and took two girls captive. About thirty colonists had been killed by the spring. On 1 May the Connecticut towns declared war on the Pequot.
    facts:
      - [John Oldham killed, "20 July 1636"]
      - [Endecott’s expedition, "August 1636, about 90 men"]
      - [Attack on Wethersfield, "23 April 1637"]
      - [Connecticut declares war, "1 May 1637"]
