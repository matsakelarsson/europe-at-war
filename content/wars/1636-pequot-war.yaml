  - title: Mystic, 26 May 1637
    date: May 1637
    when: "1637-05"
    borders: "1637-05-26"
    countries: [us]
    body:
      - John Mason left Hartford with 90 Connecticut men and about 70 Mohegan under Uncas, and was joined at Fort Saybrook by John Underhill with twenty more. Instead of going up the Pequot River, where the Pequot expected them, they sailed east to Narragansett Bay, where Miantonomoh gave them two hundred or more Narragansett and Eastern Niantic warriors, and marched back west overland. Sassacus and many of his warriors were at Weinshauks, the main Pequot town near the Pequot River, a few kilometres west of the fortified town on the Mystic River that Mason chose to attack.
      - Before dawn on 26 May the English surrounded the palisaded town on its hill above the Mystic. The first men to force the two entrances met hard fighting among the houses, and Mason ordered the town set on fire. As it burned, the English shot those who tried to climb the palisade, and their Native allies, in a ring outside, caught those who got out. Underhill wrote that about four hundred people had been in the fort and that hardly five escaped; estimates of the dead range from 400 to 700, most of them women, children and old men. Two English soldiers were killed and about twenty wounded, and some forty Narragansett were wounded, many by the English, who mistook them for Pequot.
      - The Narragansett told the English their way of war was “too furious, and slays too many men”. Warriors from Weinshauks attacked the column as it withdrew to its ships at the mouth of the Pequot River. Mason and Underhill described the burning as a judgement of God on the Pequot. Historians since the 1990s have debated whether it, and the war, should be called genocide.
    facts:
      - [English force, "about 110 colonists, about 70 Mohegan, 200 or more Narragansett and Niantic"]
      - [Pequot dead, "estimates range from 400 to 700"]
      - [English dead, "2 killed, about 20 wounded"]
