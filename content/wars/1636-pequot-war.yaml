id: pequot-war
name: Pequot War
start: "1636-08"
end: "1638-09-21"
tier: B
summary: "A war between the Pequot, the strongest nation of what is now eastern Connecticut, and the English colonies of Massachusetts Bay, Plymouth and Connecticut, with the Mohegan under Uncas and the Narragansett as their allies. After years of rivalry over the trade in furs and wampum, the killing of two English traders, John Stone in 1634 and John Oldham in 1636, led Massachusetts to send John Endecott to burn villages on Block Island and on the Pequot coast in August 1636. The Pequot besieged Fort Saybrook and raided the Connecticut River towns. On 26 May 1637 a force under John Mason and John Underhill, with Mohegan and Narragansett warriors, set fire to the fortified Pequot town on the Mystic River and killed most of the people inside; estimates of the dead, most of them women, children and old people, range from 400 to 700. The surviving Pequot fled west and were defeated near Fairfield in July; their sachem Sassacus was killed by the Mohawk. Hundreds of captives were enslaved in New England or shipped to Bermuda and the West Indies, and the Treaty of Hartford in 1638 divided the survivors between the Mohegan and the Narragansett and forbade them to call themselves Pequot. The Mashantucket and Eastern Pequot nations survive today."
countries: [us]
