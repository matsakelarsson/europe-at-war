  - title: The swamp at Sasqua and the Treaty of Hartford
    date: June 1637 – September 1638
    when: "1637-06"
    borders: "1638-09-21"
    countries: [us]
    body:
      - After Mystic the Pequot abandoned their towns. Some went to the Narragansett, the Mohegan or the Montaukett on Long Island; Sassacus led several hundred people west along the coast towards the Mohawk. Massachusetts troops under Israel Stoughton and Connecticut men under Mason followed with Mohegan scouts, killing the men they caught and taking women and children captive. In July 1637 they surrounded the refugees in a swamp near Sasqua, a Paugussett village at what is now Fairfield. Several hundred people, mostly women and children, surrendered; Sassacus broke out with about eighty men. The Mohawk killed him and sent his head and hands to Hartford.
      - The captives were divided. Some were given to the Mohegan, Narragansett and Niantic; others were enslaved in English households. Massachusetts sold some to the West Indies on the ship Desire, which came back in 1638 with cotton, tobacco and enslaved Africans, among the first in New England; others were taken to Bermuda. By the Treaty of Hartford of 21 September 1638 Connecticut, the Mohegan and the Narragansett divided the roughly two hundred surviving Pequot between Uncas and Miantonomoh, forbade them to live in their old lands or call themselves Pequot, and gave the Pequot country to Connecticut.
      - The war left Connecticut and Massachusetts dominant in southern New England and Uncas the colonists’ chief ally; rivalry between him and Miantonomoh ended with Miantonomoh’s capture and killing by the Mohegan, with the colonies’ consent, in 1643. From the 1650s the colonies let the Pequot gather again under their own leaders, Robin Cassacinamon in the west and Harmon Garrett in the east, on reservations at Mashantucket (1666) and Lantern Hill (1683). The Mashantucket Pequot Tribal Nation was recognised by the United States in 1983, and the Eastern Pequot by Connecticut.
    facts:
      - [Fairfield (Sasqua) Swamp Fight, "13–14 July 1637"]
      - [Treaty of Hartford, "21 September 1638"]
      - [Pequot killed or captured in the war, "about 700 (estimates vary)"]
