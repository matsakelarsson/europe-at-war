notes:
  - The English colonies used the Julian calendar (Old Style), ten days behind the Gregorian; the dates here are Old Style, as in the standard accounts (the attack at Mystic, 26 May 1637, was 5 June in the Gregorian calendar).
  - Almost everything written about the war at the time comes from its English commanders and ministers (John Mason, John Underhill, Lion Gardiner, Philip Vincent, William Bradford), who wrote to justify it; Pequot and Narragansett accounts survive only as they reported them and in later oral tradition. Numbers of dead and captives are those of these sources and of modern estimates.
  - The war was fought in the lands between the Connecticut River and Narragansett Bay. The English settlements on the Connecticut River (Windsor, Wethersfield, Hartford, Springfield) and Fort Saybrook were only a few years old; the base map shows them as part of English America.
