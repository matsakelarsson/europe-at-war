notes:
  - Korean and Qing records date the war by the lunar calendar. The English Wikipedia article gives most of these lunar dates as if they were Gregorian (the invasion on “9 December 1636”); the dates here are Gregorian conversions, as in the Korean article (the Qing army set out on the 2nd day of the twelfth month, 28 December 1636, and Injo submitted on the 30th day of the first month, 24 February 1637). Some accounts differ by a day.
  - The war was part of the long struggle between the Ming and the Manchu state; see the Ming–Later Jin war (1618–1644) and the Later Jin invasion of Joseon (1627). The base map shows Joseon throughout, since the Qing did not annex Korean land.
