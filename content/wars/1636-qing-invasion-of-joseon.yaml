id: qing-invasion-of-joseon
name: Qing invasion of Joseon
start: "1636-12-28"
end: "1637-02-24"
tier: B
summary: "The second Manchu invasion of Korea, called Byeongja Horan in Korean after the year 1636 in the sixty-year cycle. Hong Taiji had proclaimed the Qing dynasty in 1636, and the Joseon court, loyal to the Ming, refused to recognise him as emperor. He set out from Mukden at the end of December 1636 with Manchu, Mongol and Han banner troops, about 120,000 men by Korean accounts, crossed the Yalu at the start of January 1637 and, bypassing the northern fortresses, reached Hanseong within two weeks. Cut off from Ganghwa Island, King Injo shut himself up in the mountain fortress of Namhansanseong with about 13,800 men. Relief armies from the provinces were beaten one by one, and when Ganghwa fell on 16 February with the king’s family, Injo came out and submitted to Hong Taiji at Samjeondo on the Han River on 24 February 1637. Joseon broke with the Ming, became a tributary of the Qing and sent two princes as hostages to Mukden, and large numbers of Koreans were carried off as captives."
countries: [kr, kp, cn]
