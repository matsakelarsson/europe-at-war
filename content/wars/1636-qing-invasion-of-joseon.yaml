steps:
  - title: The Qing cavalry and the flight to Namhansanseong
    date: December 1636 – January 1637
    when: "1636-12"
    borders: "1637-01-10"
    countries: [kp, kr, cn]
    body:
      - In 1636 Hong Taiji renamed his state the Great Qing and took the title of emperor. The Korean envoys at his enthronement refused to bow to him, King Injo would not receive the Manchu envoys sent to Hanseong, and a letter calling on Pyongan province to prepare for war fell into Manchu hands. After a raid deep into Ming territory in the summer, Hong Taiji turned on Korea, sending other forces to watch the coast so that the Ming could not send help by sea.
      - The Qing army left Mukden on 28 December 1636, led by Hong Taiji himself, and its vanguard crossed the Yalu on 3 January 1637. Joseon had planned to hold the walled mountain fortresses along the road and force the invaders into long sieges; Im Gyeong-eop held the Baengma fortress near Uiju with 3,000 men. But the Qing simply rode past the fortresses. A vanguard of Manchu and Mongol cavalry made straight for Hanseong to stop the king escaping to Ganghwa Island, as he had in 1627.
      - The road to Ganghwa was already cut when Injo tried to leave. On the night of 9 January he took refuge instead in Namhansanseong, a fortress on the mountains south-east of the capital, with the crown prince and about 13,800 soldiers, but with food for little more than a month. The crown princess, Prince Bongnim and other members of the royal family were sent to Ganghwa with the royal ancestral tablets. Hanseong was occupied without a fight.
