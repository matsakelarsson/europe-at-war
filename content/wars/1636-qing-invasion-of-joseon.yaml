  - title: Namhansanseong and the submission at Samjeondo
    date: January – February 1637
    when: "1637-01"
    borders: "1637-02-24"
    countries: [kr]
    body:
      - The main Qing army surrounded Namhansanseong. The fortress held off assaults, and sorties destroyed some of the siege batteries, but the relief armies the king called for were beaten one by one before they could reach it. The Gangwon army was routed near Geomdansan and the Chungcheong army at Heomcheon; the vanguard of the large Gyeongsang army, some 8,000 musketeers, broke at Ssangnyeong when charged by a few hundred Manchu horsemen. The Jeolla army won a fight at Gwanggyosan but fell back for lack of supplies, and the Pyongan army was beaten at Gimhwa, where its commander Hong Myeong-gu was killed. The commander-in-chief, Kim Ja-jeom, kept his troops at Yanggeun (today’s Yangpyeong) and did not move. Inside the fortress food and firewood ran short in the bitter cold, and Qing cannon fired into it from the heights.
      - In the fortress the court was divided between those, led by Kim Sang-heon, who wanted to fight on, and those, led by Choe Myeong-gil, who urged terms. On 16 February Qing troops crossed to Ganghwa in boats, with former Ming naval officers such as Kong Youde and Geng Zhongming among them, and took the island, capturing the crown princess, Prince Bongnim and the ancestral tablets; many of the inhabitants were killed. When the news reached Namhansanseong, Injo decided to surrender.
      - On 24 February 1637 Injo came down from the fortress and, at Samjeondo, a ferry on the Han, knelt three times and bowed nine times before Hong Taiji. Joseon gave up the Ming seals and era name and took the Qing calendar, sent the crown prince Sohyeon and Prince Bongnim to Mukden as hostages, promised troops for Qing campaigns and yearly tribute, and undertook not to build fortresses. Three officials who had argued for war were handed over and executed. In the spring Korean troops had to help the Qing take Ka Island from the Ming. A stele praising the virtues of the Qing emperor was set up at Samjeondo in 1639; Joseon remained a Qing tributary until 1895.
