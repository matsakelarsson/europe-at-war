id: shimabara-rebellion
name: Shimabara rebellion
start: "1637-12-17"
end: "1638-04-15"
tier: B
summary: "A rising of peasants, fishermen and former samurai in the Shimabara peninsula and the Amakusa Islands of western Kyushu, the last large armed conflict in Japan until the 1860s. Both areas had once been ruled by Christian lords and had many Christian converts. Their new lords, Matsukura Katsuie of Shimabara and the Terasawa of Karatsu, who held Amakusa, levied crushing taxes during years of crop failure, punished defaulters with torture and persecuted the Christians. On 17 December 1637 the people of the southern Shimabara peninsula killed the local magistrate, and Amakusa rose at the same time. Under a charismatic sixteen-year-old, Amakusa Shirō, the rebels attacked the castles of Tomioka and Hondo on Amakusa and Shimabara Castle, failed to take them and gathered, some 27,000 to 37,000 strong with their families, in the ruined castle of Hara on the Shimabara coast. The shogunate’s first commander, Itakura Shigemasa, was killed in a failed assault; his successor Matsudaira Nobutsuna besieged the castle with about 125,000 men from the Kyushu domains, and the Dutch at Hirado lent cannon and the ship de Ryp to bombard it. When the defenders’ food and powder ran out, the castle was stormed on 12–15 April 1638. Estimates put the rebels and sympathisers killed in the assault and the executions that followed at about 37,000, women and children among them; Amakusa Shirō’s head was displayed at Nagasaki. Matsukura was beheaded for misrule. The shogunate treated the rising as a Christian revolt, expelled the Portuguese in 1639 and tightened its persecution of Christians and its closure of the country."
countries: [jp, nl]
