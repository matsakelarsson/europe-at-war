notes:
  - Historians disagree on how far the rising was a religious one. The shogunate presented it as a Christian rebellion, and the rebels fought under Christian banners; most modern historians see heavy taxation and famine as its main causes, with Christianity giving the rebels unity and hope.
  - Figures for the armies and the dead come from Japanese records and later chronicles and vary widely. The rebels and their families in Hara Castle are usually counted at 27,000 to 37,000; nearly all were killed. Estimates of the shogunate’s losses range from several thousand to well over 10,000.
