steps:
  - title: The rising in Shimabara and Amakusa
    date: December 1637 – January 1638
    when: "1637-12-17"
    borders: "1637-12-17"
    countries: [jp]
    body:
      - Matsukura Shigemasa and his son Katsuie, lords of Shimabara since 1616, built a new castle far beyond the means of their small domain and raised the land tax to pay for it. In a famine year, peasants who could not pay were tortured, their wives and daughters taken as hostages. In neighbouring Amakusa, governed by the Terasawa of Karatsu, conditions were much the same. Both lands had been Christian under the Arima and Konishi lords, and the persecution of the Christians was harsh. Former retainers of the old lords, now rōnin farming in the villages, plotted a rising and found a leader in Amakusa Shirō, a sixteen-year-old said to work miracles.
      - On 17 December 1637 villagers in the south of the Shimabara peninsula killed the magistrate Hayashi Hyōzaemon, and within days most of the peninsula’s south and much of Amakusa had risen, forcing villagers who held back to join. The rebels besieged Shimabara Castle, and on Amakusa the Terasawa castles of Hondo and Tomioka, but troops from the neighbouring domains came to the castles’ relief. The rebels then crossed the Ariake Sea in boats and gathered in the ruined castle of Hara, the old seat of the Arima, which they rebuilt with palisades made from the timber of their boats and stocked with food and arms taken from the Matsukura storehouses.
    facts:
      - [Start of the rising, "17 December 1637"]
      - [Leader, Amakusa Shirō (Masuda Shirō Tokisada)]
      - [Rebels in Hara Castle, "about 27,000–37,000, with their families"]
