  - title: The siege of Hara Castle
    date: January – April 1638
    when: "1638-01"
    borders: "1638-04-15"
    countries: [jp, nl]
    body:
      - The shogun Tokugawa Iemitsu sent Itakura Shigemasa to command the armies of the Kyushu domains against Hara. His assaults failed, and on 14 February 1638, the first day of the new year by the lunar calendar, he was killed leading an attack to forestall his replacement, the senior councillor Matsudaira Nobutsuna. Nobutsuna surrounded the castle with about 125,000 men, the largest contingents from Saga, Kumamoto and Fukuoka; the swordsman Miyamoto Musashi served with the Hosokawa of Kumamoto. At the shogunate’s request Nicolaes Couckebacker, head of the Dutch trading post at Hirado, brought the ship de Ryp to bombard the castle from the sea, with little result; the Japanese commanders sent it away after the rebels mocked them for calling on foreigners.
      - Nobutsuna chose to starve the defenders. By early April they were gathering seaweed below the cliffs to eat, and a desperate night sortie failed. The general assault was set for 13 April, but on 12 April the Saga troops of Nabeshima Katsushige attacked a day early and the other contingents followed; by 15 April the last defenders had been killed. Estimates put the rebels and sympathisers killed in the assault and in the executions that followed at about 37,000, women and children among them; the castle was razed and the dead buried in its ruins. Amakusa Shirō’s head was displayed at Nagasaki. Matsukura Katsuie was beheaded in Edo, the only daimyo executed in the Edo period, and the Terasawa lost Amakusa. Blaming Portuguese priests for the rising, the shogunate expelled the Portuguese in 1639, leaving the Dutch at Hirado, later at Dejima in Nagasaki, as the only Europeans allowed to trade with Japan.
    facts:
      - [Shogunate army, "about 125,000"]
      - [Itakura Shigemasa killed, "14 February 1638"]
      - [Final assault, "12–15 April 1638"]
      - [Rebels and sympathisers killed, "about 37,000 (estimate)"]
