id: dutch-portuguese-war-in-ceylon
name: Dutch–Portuguese War in Ceylon
start: "1638-05"
end: "1658-06"
tier: B
summary: "The conquest of Portuguese Ceylon by the Dutch East India Company (VOC), at first in alliance with King Rajasinghe II of Kandy. After the Kandyans destroyed a Portuguese army at Gannoruwa in March 1638, a Dutch fleet took Batticaloa in May and Rajasinghe signed a treaty with the Company. Trincomalee fell in 1639 and Galle, stormed on 13 March 1640, became the Dutch headquarters. A truce between the Dutch Republic and newly independent Portugal halted the fighting in the 1640s, and the allies quarrelled over the captured forts, which the Dutch kept. When war resumed, the Dutch besieged Colombo from late 1655 and took it on 12 May 1656, then turned on Mannar and Jaffna in 1658, ending Portuguese rule in the island. Rajasinghe found that he had exchanged one European power on the coast for another, and Kandy fought the Dutch on and off until 1766."
countries: [lk, nl, pt]
sides:
  - id: nl
    name: Dutch East India Company and Kandy
    polities: [dutch-republic, dutch-ceylon, kandy]
    ink: orange
    moves: Dutch and Kandyan moves
    success: Dutch or Kandyan success
  - id: pt
    name: Portuguese Ceylon
    polities: [portugal]
    ink: blue
    moves: Portuguese moves
    success: Portuguese success
notes:
  - Kandy fought alongside the Dutch in 1638–1640 and again from 1649, but the allies were often at odds, and at times in the 1640s and after 1656 Kandyan and Dutch troops fought each other.
  - The treaty of 1638 survives in Dutch and Portuguese versions and in Sinhala; the versions differ on who was to hold the captured forts, which became the main cause of the quarrel.
  - Dates are Gregorian, as in the Dutch records.
