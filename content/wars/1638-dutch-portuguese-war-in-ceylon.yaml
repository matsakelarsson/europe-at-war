steps:
  - title: Batticaloa, Trincomalee and Galle
    date: 1638–1640
    when: "1638-05-18"
    borders: "1638-05-18"
    countries: [lk, nl, pt]
    body:
      - "The Dutch East India Company had been fighting the Portuguese across Asia for three decades, and Rajasinghe II of Kandy had been asking for its help. In May 1638, weeks after the Kandyan victory at Gannoruwa, a Dutch fleet under Adam Westerwolt landed at Batticaloa on the east coast and, with Kandyan troops, took the Portuguese fort on 18 May. Five days later Rajasinghe and the Company signed a treaty: the Dutch would drive out the Portuguese and receive a monopoly of the island’s trade, above all its cinnamon, and the king would pay the costs of the war."
      - "On 2 May 1639 the Dutch took Trincomalee after a siege of about forty days. In February 1640 they captured Negombo, the centre of the cinnamon country north of Colombo, and in March a Dutch force under Willem Jacobsz Coster landed near Galle, the best harbour in the south. After a bombardment, the town was stormed on 13 March 1640. The Dutch kept Galle and Negombo rather than handing them to the king, and Galle became the seat of the Company’s power in Ceylon for the next sixteen years."
    facts:
      - [Batticaloa taken, "18 May 1638"]
      - [Treaty with Kandy, "23 May 1638"]
      - [Trincomalee taken, "2 May 1639"]
      - [Galle stormed, "13 March 1640"]
