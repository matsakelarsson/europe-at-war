  - title: Colombo
    date: 1640–1656
    when: "1655-10"
    borders: "1656-05-12"
    countries: [lk, nl, pt]
    body:
      - "In 1641 the Dutch Republic agreed a ten-year truce with Portugal, which had just broken away from Spain, and once news of it reached Asia the fighting in Ceylon died down in the mid-1640s. The Kandyans, angry that the Dutch kept the forts they had helped to take, fought both Europeans at times. Rajasinghe renewed his alliance with the Dutch in 1649, and the war resumed when the truce ran out in 1652."
      - "In 1655 a large fleet arrived from Batavia under Gerard Pietersz Hulft. The Dutch took Kalutara in October and laid siege to Colombo, the Portuguese capital, while Kandyan troops blockaded it by land. The defenders under António de Sousa Coutinho beat off a great assault, and on 10 April 1656 Hulft was killed while inspecting the siege works. Starving and short of powder, the garrison surrendered on 12 May 1656, after about seven months."
      - "Rajasinghe expected Colombo to be handed over to him. Instead the Dutch kept it, pulling down part of the old town to make it easier to defend, and the alliance turned to hostility; Kandyan forces devastated the country around the city."
    facts:
