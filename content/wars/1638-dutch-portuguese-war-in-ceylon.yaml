  - title: Mannar and Jaffna
    date: 1658
    when: "1658-02"
    borders: "1658-06"
    countries: [lk, nl, pt, in]
    body:
      - "The Portuguese still held the north: the island of Mannar and the Jaffna peninsula, which they had annexed in 1619. In 1658 Rijckloff van Goens came from Batavia with 21 ships and about 2,100 soldiers. He took Mannar in February, besieged the fort of Jaffna and received its surrender in June, and on the coast of India took Tuticorin and Nagapattinam. The towns surrendered after little fighting, though their walls were stronger than van Goens had expected."
      - "With Jaffna gone, Portuguese rule in Sri Lanka was at an end after a century and a half. The Dutch held the coasts, the cinnamon lands and the ports; Kandy held the interior, about half the island, and the old allies became enemies. The Dutch held their part of Ceylon until the British took it in 1796."
    facts:
      - [Mannar taken, "February 1658"]
      - [Jaffna surrenders, "June 1658"]
