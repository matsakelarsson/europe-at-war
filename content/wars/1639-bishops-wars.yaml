id: bishops-wars
name: Bishops’ Wars
start: "1639"
end: "1640-10-26"
tier: C
summary: Two short wars between Charles I and the Scottish Covenanters, who had rejected his new prayer book in 1637, signed the National Covenant in 1638 and abolished the bishops of the Church of Scotland. In 1639 the two armies faced each other near Berwick without a battle and agreed the Pacification of Berwick on 18 June. After the Short Parliament refused him money, Charles tried again in 1640, but a Covenanter army under Alexander Leslie crossed the Tweed, routed the King’s troops at Newburn on 28 August and occupied Newcastle and the north-east. By the Treaty of Ripon of 26 October Charles had to pay the Scottish army £850 a day while it stayed, which forced him to summon the Long Parliament; the Treaty of London ended the war in August 1641. The wars opened the Wars of the Three Kingdoms.
