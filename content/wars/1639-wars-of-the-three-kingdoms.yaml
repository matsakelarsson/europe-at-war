  - title: Naseby
    date: 1645–1646
    when: "1645-02-15"
    borders: "1646-06-24"
    countries: [gb, ie]
    body:
      - Parliament reorganised its forces as the New Model Army under Sir Thomas Fairfax, with Cromwell commanding the cavalry. On 14 June 1645, at Naseby in Northamptonshire, it destroyed the King’s main field army. Some 4,500 Royalist infantry were captured, and so was the King’s correspondence, which showed him seeking Irish and foreign troops; Parliament published it. Fairfax beat the western Royalists at Langport in July, and in September Rupert surrendered Bristol. The remaining Royalist garrisons fell one by one.
      - In Scotland, James Graham, Marquis of Montrose, leading Highlanders and Irish troops sent from Ulster, won six victories in a year, the last at Kilsyth on 15 August 1645. At Philiphaugh on 13 September a Covenanter army destroyed his force, and prisoners and camp followers were massacred. In Ireland Owen Roe O’Neill beat the Scottish army in Ulster at Benburb in June 1646. By then the war in England was over. On 5 May 1646 Charles gave himself up to the Scottish army besieging Newark, and Oxford surrendered on 24 June.
    facts:
      - [Battle of Naseby, "14 June 1645, Parliamentarian victory"]
      - [Montrose’s victories, "Tippermuir to Kilsyth, September 1644 – August 1645"]
      - [Charles surrenders, "5 May 1646, to the Scots"]
    markers:
      - kind: battle
        side: parl
        name: Battle of Naseby
        date: 14 June 1645
        text: The New Model Army destroyed the King’s infantry after Cromwell’s cavalry beat the Royalist horse on its wing.
        lonlat: [-0.96, 52.41]
      - kind: battle
