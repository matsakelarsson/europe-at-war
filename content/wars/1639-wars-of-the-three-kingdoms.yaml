  - title: The regicide and Cromwell in Ireland
    date: 1649–1650
    when: "1649-01-30"
    borders: "1650-05-26"
    countries: [gb, ie]
    body:
      - A High Court of Justice set up by the purged Commons tried Charles for treason against his people, and he was beheaded outside the Banqueting House in Whitehall on 30 January 1649. England abolished the monarchy and the House of Lords and became a Commonwealth. The Scots, who had not been consulted, proclaimed his son King Charles II. In Ireland the Confederates and the Royalists under the Marquis of Ormond joined forces and held almost all the country except Dublin and Derry.
      - On 2 August Colonel Michael Jones routed Ormond’s army at Rathmines, outside Dublin, and on 15 August Cromwell landed with about 12,000 veterans. He stormed Drogheda on 11 September, and his troops killed most of the garrison, many after they had surrendered, together with Catholic clergy and an unknown number of civilians. At Wexford in October between 1,500 and 2,000 soldiers and townspeople died in the sack. At Clonmel in May 1650 Hugh O’Neill’s garrison inflicted the New Model Army’s heaviest losses before slipping away. Cromwell returned to England that month, leaving the war to his son-in-law Henry Ireton.
    facts:
      - [Execution of Charles I, "30 January 1649"]
      - [Storming of Drogheda, "11 September 1649"]
      - [Cromwell in Ireland, "15 August 1649 – 26 May 1650"]
    side_names:
      roy: Royalists and Irish Confederates
    markers:
      - kind: event
        side: parl
        name: Whitehall
        date: 30 January 1649
        text: Charles I was beheaded on a scaffold outside the Banqueting House.
        lonlat: [-0.126, 51.504]
      - kind: battle
        side: parl
        name: Battle of Rathmines
        date: 2 August 1649
        text: Michael Jones’s Dublin garrison surprised and routed Ormond’s besieging army, letting Cromwell land unopposed.
        lonlat: [-6.27, 53.32]
        lp: b
      - kind: siege
        side: parl
        name: Drogheda
        date: 3–11 September 1649
        text: Cromwell listed about 2,800 of the garrison killed after the storm. How many civilians died is not known.
        lonlat: [-6.35, 53.714]
      - kind: siege
        side: parl
        name: Wexford
        date: 11 October 1649
        text: The town was stormed during negotiations, and soldiers and civilians were killed in the streets or drowned fleeing across the River Slaney.
        lonlat: [-6.457, 52.334]
      - kind: taken
        side: parl
        name: Kilkenny
        date: March 1650
        text: The former Confederate capital surrendered to Cromwell on terms.
        lonlat: [-7.251, 52.651]
      - kind: siege
        side: parl
        name: Clonmel
        date: April–May 1650
        text: The defenders trapped the stormers in a lane behind the breach and killed perhaps 2,000 of them, then left by night.
        lonlat: [-7.712, 52.354]
    arrows:
