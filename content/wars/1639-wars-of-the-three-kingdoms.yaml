id: wars-of-the-three-kingdoms
name: Wars of the Three Kingdoms
start: "1639"
end: "1653"
tier: A
summary: The linked wars in Scotland, Ireland and England under Charles I and the Commonwealth, from the Scottish Covenanters’ revolt and the Irish rising of 1641 to the English Civil Wars between King and Parliament. They ended with the execution of Charles I in 1649, the abolition of the monarchy and the conquest of Ireland and Scotland by the English Commonwealth.
countries: [gb, ie]
sides:
  - id: roy
    name: Royalists
    polities: []
    ink: red
    moves: Royalist moves
    success: Royalist success
  - id: parl
    name: Parliament and the Commonwealth
    polities: [england]
    ink: orange
    moves: Parliamentarian moves
    success: Parliamentarian success
  - id: sco
    name: Scottish Covenanters
    polities: [scotland]
    ink: navy
    moves: Scottish moves
    success: Scottish success
  - id: irl
    name: Irish Confederates
    polities: [ireland]
    ink: green
    moves: Irish Confederate moves
    success: Irish Confederate success
notes:
  - Also called the British Civil Wars. The fighting in England is usually called the English Civil War (the First, 1642–1646, and the Second, 1648), and the war in Ireland the Irish Confederate Wars.
  - Alliances shifted. The Scots fought Charles I in 1639–1640 and 1644–1646, invaded England for him in 1648 (the Engagers), and fought for Charles II in 1650–1651. The Irish Confederates, Catholic rebels who governed most of Ireland from Kilkenny, made truces and treaties with the King’s Lord Lieutenant, the Marquis of Ormond, and joined him against the Commonwealth in 1649.
  - Dates are Old Style (Julian), as usual in British history, ten days behind the calendar used on the Continent, with the year starting on 1 January.
