  - title: The Solemn League and Marston Moor
    date: 1643–1644
    when: "1643"
    borders: "1644-07-16"
    countries: [gb, ie]
    body:
      - The year 1643 went the King’s way. The Earl of Newcastle beat the Fairfaxes at Adwalton Moor in June and took most of Yorkshire, Royalist cavalry won at Roundway Down in July, and Rupert stormed Bristol, England’s second city, on 26 July. Essex saved Gloucester in September and fought his way home at Newbury. Both sides looked for allies. Charles made a truce with the Irish Confederates so that he could bring troops home, and Parliament agreed the Solemn League and Covenant with the Scots, promising to reform the Church of England on Presbyterian lines in return for an army.
      - In January 1644 about 20,000 Scots under the Earl of Leven crossed the Tweed, and with the Fairfaxes and the Earl of Manchester’s army they besieged York. Rupert relieved the city, then attacked them at Marston Moor on 2 July. More than 40,000 men fought, and Oliver Cromwell’s cavalry broke the Royalist right and won the battle; about 4,000 Royalists were killed. York surrendered on 16 July, and the north was lost to the King. In the south he did better, trapping Essex’s army in Cornwall, where its infantry surrendered at Lostwithiel in September.
    facts:
      - [Battle of Marston Moor, "2 July 1644, Parliamentarian and Scottish victory"]
      - [Solemn League and Covenant, "September 1643"]
      - [Lostwithiel, "2 September 1644, Essex’s infantry surrenders"]
    markers:
