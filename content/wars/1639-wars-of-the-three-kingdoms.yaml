steps:
  - title: The Covenant and the Irish rising
    date: 1637–1641
    when: "1637-07-23"
    borders: "1641-12-31"
    countries: [gb, ie]
    body:
      - Charles I ruled three kingdoms with three different churches. In 1637 he imposed a new prayer book on Scotland without consulting its Parliament or Kirk, and on 23 July its first reading in St Giles’ in Edinburgh set off a riot. In February 1638 thousands signed the National Covenant to defend the Reformed Kirk, and that December the General Assembly in Glasgow abolished the bishops. In the Bishops’ Wars Charles twice failed to force the Scots back into line, and in August 1640 a Covenanter army routed his troops at Newburn and occupied Newcastle.
      - To pay the Scots to leave, Charles had to summon the Long Parliament in November 1640, which sent his minister Strafford to the block and dismantled his personal rule. Irish Catholics feared a Puritan Parliament would take their land and religion. On 23 October 1641 a plot to seize Dublin Castle was betrayed, but in Ulster the rising led by Sir Phelim O’Neill spread fast. Thousands of Protestant settlers were robbed, driven out or killed, about 4,000 in the attacks and perhaps up to 12,000 with those who died of cold and disease, and settlers and soldiers killed Catholics in revenge. Exaggerated reports of massacre inflamed England and Scotland.
    facts:
      - [National Covenant, "28 February 1638"]
      - [Battle of Newburn, "28 August 1640, Scottish victory"]
      - [Irish rising, "from 23 October 1641"]
