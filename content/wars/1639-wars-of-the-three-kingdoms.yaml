  - title: The Second Civil War and Preston
    date: 1647–1648
    when: "1647-01-30"
    borders: "1648-12-06"
    countries: [gb]
    body:
      - The Scots handed Charles over to Parliament in January 1647 on payment of part of the money owed to their army. Parliament’s Presbyterian majority then tried to disband the New Model Army without its arrears of pay, and the army seized the King and marched on London; at Putney its officers and the radical Levellers debated who should have the vote. Charles escaped in November but was held at Carisbrooke Castle on the Isle of Wight, where he signed a secret Engagement with Scottish nobles, who would restore him in return for three years of Presbyterianism in England.
      - In 1648 risings broke out in South Wales, Kent and Essex, and part of the navy mutinied. The army crushed them one by one, the Welsh at St Fagans in May, Kent at Maidstone on 1 June, and Colchester after a siege of eleven weeks, after which two Royalist commanders were shot. On 8 July the Duke of Hamilton led the Engagers’ army into England, and on 17–19 August Cromwell, with fewer men, destroyed it around Preston. On 6 December soldiers under Colonel Thomas Pride kept out of the Commons the members who still wanted a settlement with the King.
    facts:
      - [Battle of Preston, "17–19 August 1648, Parliamentarian victory"]
      - [Siege of Colchester, "13 June – 28 August 1648"]
      - [Pride’s Purge, "6 December 1648"]
    side_names:
      roy: Royalists and the Scottish Engagers
    markers:
      - kind: event
        name: Carisbrooke Castle
        date: November 1647 – September 1648
        text: Charles was held here after his escape from Hampton Court and twice tried to get away.
        lonlat: [-1.313, 50.687]
      - kind: battle
        side: parl
        name: Battle of St Fagans
        date: 8 May 1648
        text: Colonel Horton’s troops routed the Welsh rebels, many of them former Parliamentarian soldiers angry at being disbanded unpaid.
        lonlat: [-3.27, 51.49]
      - kind: siege
        side: parl
        name: Pembroke
        date: May–July 1648
        text: Cromwell starved the castle into surrender on 11 July.
        lonlat: [-4.921, 51.677]
      - kind: battle
        side: parl
        name: Battle of Maidstone
        date: 1 June 1648
        text: Fairfax took the town in a fight from street to street, breaking the Kentish rising.
        lonlat: [0.524, 51.27]
      - kind: siege
        side: parl
        name: Colchester
        date: 13 June – 28 August 1648
        text: The Royalists held out until the townspeople were starving. Sir Charles Lucas and Sir George Lisle were shot after the surrender.
        lonlat: [0.9, 51.89]
      - kind: battle
        side: parl
        name: Battle of Preston
        date: 17–19 August 1648
        text: Cromwell fell on Hamilton’s strung-out army from the flank and destroyed it in three days of fighting and pursuit.
        lonlat: [-2.679, 53.753]
      - kind: event
        side: parl
        name: Pride’s Purge
        date: 6 December 1648
        text: Soldiers at the door of the Commons arrested or turned away more than 100 members, leaving the “Rump”.
        lonlat: [-0.125, 51.5]
    arrows:
