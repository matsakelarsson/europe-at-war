  - title: Edgehill
    date: 1642
    when: "1642-01-04"
    borders: "1642-11-13"
    countries: [gb]
    body:
      - In London, King and Parliament quarrelled over who should command the army needed to crush the Irish rising. On 4 January 1642 Charles came to the House of Commons with soldiers to arrest five members, who had fled, and soon afterwards he left the capital. In April the governor of Hull shut its gates and its arsenal against him, and on 22 August Charles raised his standard at Nottingham. Most of the north, the west and Wales sided with the King, and London, the south-east, East Anglia and the navy with Parliament, though almost every county was divided.
      - The King recruited in the Welsh borders and marched on London. At Edgehill in Warwickshire on 23 October he met Parliament’s army under the Earl of Essex. Prince Rupert’s cavalry swept away the horse in front of them but rode off in pursuit, and the infantry fought to a bloody draw. Charles took Banbury and Oxford and pressed on, and his troops sacked Brentford on 12 November. The next day some 24,000 Parliamentarian soldiers and London trained bands barred the road at Turnham Green, and he fell back to Oxford, his capital for the rest of the war.
    facts:
      - [Battle of Edgehill, "23 October 1642, indecisive"]
      - [Commanders, "Charles I and Prince Rupert; the Earl of Essex"]
      - [Turnham Green, "13 November 1642, the King turns back"]
    markers:
      - kind: held
        side: parl
        name: Hull
        date: 23 April 1642
        text: Sir John Hotham refused the King entry to the town and its great arsenal.
        lonlat: [-0.332, 53.744]
      - kind: event
        side: roy
        name: Nottingham
        date: 22 August 1642
        text: Charles raised the royal standard at the castle, in effect declaring war on Parliament.
        lonlat: [-1.155, 52.949]
      - kind: battle
        name: Battle of Edgehill
        date: 23 October 1642
        text: The first pitched battle of the war. Both sides claimed victory, but the road to London lay open to the King.
        lonlat: [-1.482, 52.151]
      - kind: event
        side: roy
        name: Oxford
        date: October 1642 – June 1646
        text: The King’s headquarters and capital, where he held court and his own Parliament.
        lonlat: [-1.258, 51.752]
        lp: l
      - kind: taken
        side: roy
        name: Brentford
        date: 12 November 1642
        text: Rupert’s men drove two Parliamentarian regiments out of the town and plundered it.
        lonlat: [-0.309, 51.478]
        lp: b
      - kind: held
        side: parl
        name: Turnham Green
        date: 13 November 1642
        text: Facing a much larger army, the King withdrew without a battle.
        lonlat: [-0.26, 51.49]
        lp: t
