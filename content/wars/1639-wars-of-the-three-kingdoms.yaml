  - title: The Cromwellian settlement
    date: 1651–1653
    when: "1651-10-27"
    borders: "1653-12-16"
    countries: [ie, gb]
    body:
      - In Ireland, Ireton took Limerick in October 1651 after a long siege and died of plague a month later. Galway, the last city, surrendered on 12 May 1652, and the last organised Irish force gave up at Cloughoughter in County Cavan on 27 April 1653, though guerrillas fought on. War, famine and plague had cost Ireland perhaps a fifth of its people. Tens of thousands of Irish soldiers left to serve in Spain and France, and thousands of prisoners and destitute people were shipped as servants to the colonies, Barbados above all.
      - The Act for the Settlement of Ireland of August 1652 confiscated the land of those who had fought against Parliament, to pay the soldiers and the investors who had financed the war. Catholic landowners allowed to keep any land were to be moved west of the Shannon, to Connacht and Clare, and by some estimates Catholic ownership fell to about 8%. Scotland was declared united with the Commonwealth in February 1652 and held down by Monck’s garrisons. In England Cromwell dissolved the Rump in April 1653, and on 16 December he became Lord Protector of England, Scotland and Ireland.
    facts:
      - [Galway surrenders, "12 May 1652"]
      - [Act for the Settlement of Ireland, "12 August 1652"]
      - [Lord Protector, "Oliver Cromwell, from 16 December 1653"]
    markers:
      - kind: siege
        side: parl
        name: Limerick
        date: June–October 1651
        text: Ireton’s army starved the city into surrender on 27 October; plague killed many inside and outside the walls.
        lonlat: [-8.624, 52.665]
      - kind: siege
        side: parl
        name: Galway
        date: August 1651 – May 1652
        text: The last city held by Irish Catholic forces surrendered after hunger and plague.
        lonlat: [-9.042, 53.273]
