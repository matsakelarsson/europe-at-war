  - title: Dunbar and Worcester
    date: 1650–1651
    when: "1650-06-23"
    borders: "1651-09-03"
    countries: [gb]
    body:
      - Charles II landed in Scotland in June 1650 after swearing to the Covenants, and the Commonwealth struck first. Cromwell invaded in July, but David Leslie’s army blocked him outside Edinburgh until, short of food and sick, the English fell back to Dunbar. On 3 September Cromwell attacked the Scots as they came down from the hills and routed them. Estimates of the Scottish dead range from a few hundred to several thousand, and at least 6,000 were captured; thousands of the prisoners died on the march south and in captivity at Durham, and many survivors were sent to the colonies.
      - Charles was crowned at Scone on 1 January 1651. In July an English army crossed the Firth of Forth and won at Inverkeithing, and Charles gambled on invading England with a mainly Scottish army, hoping English Royalists would rise. Few did. Cromwell caught him at Worcester on 3 September 1651, a year to the day after Dunbar, and destroyed his army. Charles escaped, hiding at one point in an oak tree at Boscobel, and reached France six weeks later. In Scotland General George Monck took Stirling and stormed Dundee, and the country was occupied.
    facts:
      - [Battle of Dunbar, "3 September 1650, English victory"]
      - [Charles II crowned, "1 January 1651, Scone"]
      - [Battle of Worcester, "3 September 1651, Parliamentarian victory"]
    side_names:
      sco: Scots and Charles II
    move_names:
      sco: Scottish and Royalist moves
