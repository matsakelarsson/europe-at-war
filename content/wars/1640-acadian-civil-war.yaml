id: acadian-civil-war
name: Acadian Civil War
start: "1640"
end: "1645-04"
tier: C
summary: "A war in French Acadia between two rival commanders, Charles de Saint-Étienne de La Tour, based at Fort Sainte-Marie (Fort La Tour) at the mouth of the Saint John River, and Charles de Menou d’Aulnay, based at Port-Royal across the Bay of Fundy, over the fur trade and the right to govern the colony. After the death of the governor Isaac de Razilly in 1635, the French crown divided Acadia between them in 1638 in a way that left each with a fort inside the other’s lands. In 1640 the two came to blows when La Tour was refused entry at Port-Royal. D’Aulnay won royal orders charging La Tour with disloyalty and calling him to France, and in 1642–1643 blockaded Fort Sainte-Marie, while La Tour’s wife, Françoise-Marie Jacquelin, slipped out to plead his case in France. La Tour turned to Puritan Boston, where Governor John Winthrop let him hire ships and volunteers; in July 1643 he returned with four ships and some 270 men, broke the blockade, chased d’Aulnay to Port-Royal, burned his mill and seized his furs, and skirmished with him again at Penobscot. D’Aulnay’s first attack on Fort Sainte-Marie, in February 1645, was beaten off. In April, learning that La Tour was again in Boston, he returned with about two hundred men. Jacquelin held the fort for several days before surrendering on a promise of quarter; d’Aulnay then had the garrison hanged, all but one man who was made to act as executioner, and forced her to watch with a rope around her neck. She died there three weeks later. D’Aulnay ruled all Acadia until he drowned in 1650; in 1653 La Tour, restored as governor, married his widow, Jeanne Motin. The rivalry weakened Acadia, which a New England expedition under Robert Sedgwick took in 1654."
