notes:
  - Some historians date the rivalry from 1635 to La Tour’s marriage to d’Aulnay’s widow in 1653; the fighting took place in 1640–1645. France used the Gregorian calendar and Massachusetts the Julian, so dates differ by ten days between French and English sources.
  - The Mi’kmaq and Wolastoqiyik (Maliseet), who traded furs with both forts and lived around them, took no recorded part as nations. Françoise-Marie Jacquelin’s defence of the fort is known from French accounts and later tradition; accounts date the surrender between 16 and 18 April 1645 and differ on how many men were hanged.
