  - title: The storm of Malacca
    date: January 1641
    when: "1641-01-14"
    borders: "1641-01-14"
    countries: [my, nl, pt]
    body:
      - On 5 January 1641 the new commander, Minne Willemsz Caertekoe, announced that the council had decided to storm the walls after a day of fasting and prayer. Caertekoe was ill himself, and on 14 January Sergeant Major Johannes Lamotius led about 650 men over the walls. The starving garrison could resist no longer, and Governor Manuel de Sousa Coutinho surrendered. He died of illness two days later.
      - The Portuguese reported about 7,000 dead in the siege, soldiers and townspeople, most from famine and disease; the Dutch had lost about 1,000 men. Wealthier Portuguese were allowed to leave for Goa with their goods and slaves. Johor asked for no share in the town, its aim having been to drive out the Portuguese, and Sultan Iskandar Thani of Aceh, who had opposed the alliance, died the same month. The Company made Malacca a governorship under Jan van Twist but kept its trade secondary to Batavia; the town passed to Britain in 1795 during the wars with France and finally by exchange for Bencoolen in 1824.
    facts:
      - [Storm, "14 January 1641, about 650 men under Johannes Lamotius"]
      - [Losses, "about 7,000 dead in the town by Portuguese count; about 1,000 Dutch"]
