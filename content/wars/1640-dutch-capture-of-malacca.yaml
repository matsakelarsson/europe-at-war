notes:
  - The Portuguese figure of about 7,000 dead does not say whether it counts soldiers, civilians or both; some modern estimates of civilian deaths in the town, mostly from famine and disease, range up to 13,000. The Dutch reported losing just under 1,000 men, most of them to disease.
  - A story long told in Portugal, that the governor was bribed to open the gates and then killed by the Dutch, has no support in the records; Dutch reports say he died of illness two days after the surrender and was buried with military honours.
