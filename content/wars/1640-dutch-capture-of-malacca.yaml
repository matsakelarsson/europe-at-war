steps:
  - title: Blockade and siege
    date: August – December 1640
    when: "1640-08-03"
    borders: "1640-08-03"
    countries: [my, nl, pt]
    body:
      - Malacca had been the greatest port of the Strait before the Portuguese took it in 1511, and they had held it since behind the walls of the fortress they called A Famosa, against repeated attacks by Johor and Aceh. The Dutch East India Company (VOC) had besieged it with Johor in 1606 and again in 1608 and in the 1620s, and from the 1630s its ships blockaded the Strait, seizing the town’s supply ships. In May 1640 the Company’s government at Batavia resolved to take Malacca by negotiation or by force. Aceh, Johor’s rival, was angered by the Johor alliance and stayed out.
      - On 3 August 1640 the Dutch landed about 600 men, 130 of them sailors, with 95 Javanese, Bandanese and Mardijker auxiliaries, and Johor brought 500–600 men in its own boats. They drove the defenders back through two lines of trenches to the suburbs outside the walls, where the Portuguese burned houses to clear their field of fire and the Dutch dug in their batteries. The walls, ten metres high, with about 70 heavy guns, withstood the bombardment; the garrison was only 260 Portuguese soldiers, but 2,000–3,000 Malay, Indian and mixed-descent townspeople fought beside them.
      - Through the autumn the swampy ground, waist-deep at low tide, and disease weighed on both sides. Johor’s men raided the Portuguese for cattle and fruit, and by November famine had set in within the walls and deserters came out daily. The Dutch commander Adriaen Antonisz fell sick and died, his successor Pieter van den Broecke died on 3 December, and the next, Jacob Cooper, on 3 January 1641.
    facts:
      - [Dutch landing, "3 August 1640, about 600 men and 95 auxiliaries"]
      - [Johor contingent, "500–600 men"]
      - [Defenders, "260 Portuguese soldiers and 2,000–3,000 townspeople"]
