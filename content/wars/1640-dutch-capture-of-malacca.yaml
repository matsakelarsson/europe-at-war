id: dutch-capture-of-malacca
name: Dutch capture of Malacca
start: "1640-08-03"
end: "1641-01-14"
tier: B
summary: "The siege and capture of Portuguese Malacca, the fortified port on the Strait of Malacca that Portugal had held since 1511, by the Dutch East India Company (VOC) and its ally Johor, the sultanate founded by the heirs of the Malay kings whom the Portuguese had driven out. After failed attempts in 1606, 1608 and the 1620s, and years of blockade that cut the town’s trade, the Company landed about 600 soldiers and sailors with Javanese, Bandanese and Mardijker auxiliaries on 3 August 1640, and Johor sent 500–600 men. The Portuguese garrison of 260 soldiers, with 2,000–3,000 local and mixed-descent defenders, held the walls of the fortress of A Famosa for five months, while famine and disease killed thousands in the town and in the besiegers’ camps; three Dutch commanders in turn died of illness. On 14 January 1641 about 650 Dutch troops under Johannes Lamotius stormed the walls and the governor, Manuel de Sousa Coutinho, surrendered. The Portuguese reported about 7,000 dead, and the Dutch lost about 1,000 men. Dutch Malacca remained a secondary post beside Batavia until it passed to Britain in 1825."
