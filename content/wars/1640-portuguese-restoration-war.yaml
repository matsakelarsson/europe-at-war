id: portuguese-restoration-war
name: Portuguese Restoration War
start: "1640-12-01"
end: "1668-02-13"
tier: B
summary: The war by which Portugal broke away from the Spanish monarchy after sixty years of union under the same kings. Begun by a coup in Lisbon on 1 December 1640 that made the Duke of Braganza King John IV, it was fought mostly along the border of the Alentejo and Spanish Extremadura, and ended after Portuguese victories at Elvas, Ameixial and Montes Claros with the Treaty of Lisbon of 1668, in which Spain recognised Portugal’s independence.
countries: [pt, es]
sides:
  - id: pt
    name: Portugal
    polities: [portugal]
    ink: green
    moves: Portuguese moves
    success: Portuguese success
  - id: sp
    name: Spain
    polities: [spain]
    ink: gold
    moves: Spanish moves
    success: Spanish success
notes:
  - Dates are Gregorian. Portuguese historians call the war the Guerra da Restauração, and 1 December is a public holiday in Portugal.
  - Portugal stays a separate kingdom on the base map during the union with Spain, so the coup of 1640 does not change the map. Ceuta, which kept its loyalty to Philip IV in 1640, is shown as Spanish only from the treaty of 1668.
  - France helped Portugal with money and officers, and England sent a brigade after the marriage of Charles II and Catherine of Braganza in 1662. Their soldiers fought under Portuguese command.
