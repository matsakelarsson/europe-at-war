        atoms: [ES-BA~olivenza]
  - title: Montes Claros and the Treaty of Lisbon
    date: 1664–1668
    when: "1664-07-07"
    borders: "1668-02-13"
    countries: [pt, es]
    body:
      - In the north, on 7 July 1664, Pedro Jacques de Magalhães beat the Duke of Osuna, who was besieging Castelo Rodrigo, near the border of Beira. In June 1665 a new Spanish commander, the Marquis of Caracena, marched into the Alentejo with some 23,000 men and took the town of Vila Viçosa, though its citadel held out. On 17 June the Portuguese army under Meneses, now Marquis of Marialva, and Schomberg met him at Montes Claros, between Vila Viçosa and Estremoz. Their infantry and guns threw back repeated cavalry charges, and the Spanish army was destroyed.
      - It was the last great battle of the war. Philip IV died that September, leaving a sickly three-year-old son, Charles II, and his regents wanted peace. In Portugal Afonso VI was pushed aside in 1667–1668 by his brother Peter, who became regent. With English mediation, the Treaty of Lisbon was signed on 13 February 1668. Spain recognised the House of Braganza and Portugal’s independence, and each side gave back what it had taken, except that Ceuta, which had stayed loyal to Philip IV, remained Spanish.
    facts:
      - [Battle of Castelo Rodrigo, "7 July 1664, Portuguese victory"]
      - [Battle of Montes Claros, "17 June 1665, Portuguese victory"]
      - [Treaty of Lisbon, 13 February 1668]
    markers:
      - kind: battle
        side: pt
        name: Battle of Castelo Rodrigo
        date: 7 July 1664
        text: About 3,000 Portuguese came to the rescue of the small garrison and routed Osuna’s 7,000, taking all their guns. Osuna is said to have escaped disguised as a monk.
        lonlat: [-6.95, 40.87]
      - kind: taken
        side: sp
        name: Vila Viçosa
        date: June 1665
        text: Caracena took the town, seat of the dukes of Braganza, but not its citadel; he hoped to go on to Setúbal and Lisbon. The Portuguese recovered the town after Montes Claros.
        lonlat: [-7.42, 38.78]
        lp: l
      - kind: battle
        side: pt
        name: Battle of Montes Claros
        date: 17 June 1665
        text: Often counted the most important battle in Portuguese history. Thousands of Spanish soldiers were killed or captured, along with their guns.
        lonlat: [-7.47, 38.76]
        lp: b
      - kind: treaty
        name: Treaty of Lisbon
        date: 13 February 1668
        text: Signed under English mediation, it ended twenty-seven years of war and the union of the crowns.
        lonlat: [-9.14, 38.71]
    arrows:
      - side: sp
        label: Osuna
        phase: 1
        via: [[-6.53, 40.6], [-6.75, 40.75], [-6.92, 40.85]]
      - side: sp
        label: Caracena
        phase: 2
        via: [[-6.97, 38.86], [-7.18, 38.79], [-7.39, 38.78]]
      - side: pt
        label: Marialva and Schomberg
        phase: 2
        via: [[-7.59, 38.84], [-7.53, 38.8], [-7.49, 38.77]]
    areas:
      - style: gained
        side: sp
        label: Ceuta, left to Spain by the treaty
        atoms: [ES-CE]
