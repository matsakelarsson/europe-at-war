steps:
  - title: The revolution of 1640
    date: 1640–1656
    when: "1640-12-01"
    borders: "1644-05-26"
    countries: [pt, es]
    body:
      - Under the Spanish kings Portugal had kept its own laws and institutions, but by the 1630s many Portuguese felt their empire was being lost to the Dutch while Olivares raised new taxes and tried to draw Portugal into Castile’s wars. In 1640, with Spain fighting France and facing revolt in Catalonia, Portuguese nobles struck. On 1 December a group of conspirators burst into the palace in Lisbon, killed the hated Secretary of State, Miguel de Vasconcelos, and arrested the vicereine, Margaret of Savoy. The Duke of Braganza was acclaimed King John IV, and almost all of the empire followed, except Ceuta.
      - Spain could not spare a large army, and for years the war along the frontier of the Alentejo and Extremadura was one of raids, cattle-rustling and burnt villages. Portugal rebuilt its border fortresses, above all Elvas, facing the Spanish base at Badajoz. On 26 May 1644 Matias de Albuquerque, a veteran of the wars in Brazil, beat a Spanish army under the Marquis of Torrecuso at Montijo, and that autumn Elvas held out against a nine-day siege. Through the following decade neither side could mount a major campaign; Portugal used the time to win back north-eastern Brazil from the Dutch, who surrendered there in 1654.
    facts:
      - [Coup in Lisbon, 1 December 1640]
      - [Battle of Montijo, "26 May 1644, Portuguese victory"]
      - [King of Portugal, "John IV (1640–1656)"]
    markers:
      - kind: event
        side: pt
        name: Lisbon
        date: 1 December 1640
        text: The conspirators took the royal palace on the Terreiro do Paço and threw Vasconcelos’s body from a window. John IV was acclaimed on 15 December.
        lonlat: [-9.14, 38.71]
      - kind: battle
        side: pt
        name: Battle of Montijo
        date: 26 May 1644
        text: Torrecuso’s army caught Albuquerque’s men returning from a raid into Extremadura; after a hard fight the Spanish withdrew to Badajoz.
        lonlat: [-6.6, 38.89]
      - kind: held
        side: pt
        name: Elvas
        date: late 1644
        text: The main Portuguese border fortress, a few hours’ march from Badajoz, beat off a nine-day Spanish siege.
        lonlat: [-7.16, 38.88]
    arrows:
      - side: pt
        label: Albuquerque, 1644
        phase: 1
        via: [[-7.16, 38.88], [-6.9, 38.97], [-6.64, 38.91]]
      - side: sp
        label: Torrecuso
        phase: 2
        via: [[-6.97, 38.86], [-6.8, 38.86], [-6.65, 38.88]]
  - title: Elvas, Évora and Ameixial
    date: 1657–1663
    when: "1657"
    borders: "1663-06-08"
    countries: [pt, es]
    body:
      - After John IV died in November 1656, leaving his widow Luisa de Guzmán as regent for the young Afonso VI, Spain went on the offensive and in 1657 took Olivença after a long siege. A Portuguese siege of Badajoz in 1658 failed, and Luis de Haro, Philip IV’s chief minister, besieged Elvas, whose garrison was dying of disease. On 14 January 1659 a relief army under António Luís de Meneses, Count of Cantanhede, stormed the Spanish siege lines and routed the besiegers. That November, however, the Peace of the Pyrenees ended the war with France and freed Spain’s armies, and France formally left Portugal to its fate.
      - Portugal turned to England. In 1662 Charles II married Afonso’s sister Catherine of Braganza, who brought Tangier and Bombay as her dowry, and an English brigade came to Portugal, while the German-born Frederick Schomberg, a soldier in French service, came to train the Portuguese army. In May 1663 Don Juan José of Austria invaded the Alentejo with a large army and took Évora, alarming Lisbon. On 8 June, as he fell back towards the border, a Portuguese and English army under the Count of Vila Flor and Schomberg routed him at Ameixial, and Évora was soon retaken.
    facts:
      - [Battle of the Lines of Elvas, "14 January 1659, Portuguese victory"]
      - [Marriage of Charles II and Catherine of Braganza, 1662]
      - [Battle of Ameixial, "8 June 1663, Portuguese victory"]
    markers:
      - kind: taken
        side: sp
        name: Olivença
        date: 1657
        text: The Duke of San Germán took the border town after a long siege. Spain returned it in 1668.
        lonlat: [-7.1, 38.69]
      - kind: held
        side: sp
        name: Badajoz
        date: 1658
        text: The Spanish base on the Guadiana held out against a Portuguese siege.
        lonlat: [-6.97, 38.88]
      - kind: battle
        side: pt
        name: Battle of the Lines of Elvas
        date: 14 January 1659
        text: Cantanhede’s relief army broke through Haro’s siege works in a single day. The Spanish lost their guns and baggage.
        lonlat: [-7.18, 38.89]
        lp: t
      - kind: taken
        side: sp
        name: Évora
        date: May 1663
        text: The Alentejo’s largest city surrendered to Don Juan José after a short siege. It was retaken in late June after Ameixial.
        lonlat: [-7.9, 38.57]
      - kind: battle
        side: pt
        name: Battle of Ameixial
        date: 8 June 1663
        text: Fought near Estremoz. Don Juan José’s army lost its artillery and baggage and retreated to Badajoz with heavy losses.
        lonlat: [-7.65, 38.85]
    arrows:
