        phase: 3
        via: [[1.6, 41.25], [1.0, 40.95], [0.56, 40.82]]
    areas:
      - style: occupied
        side: fr
        label: Under French rule, 1648
        atoms: [FR-66, ES-B, ES-GI]
      - style: contested
        label: Divided between the two sides
        atoms: [ES-L, ES-T]
  - title: The fall of Barcelona and the Peace of the Pyrenees
    date: 1650–1659
    when: "1650"
    borders: "1659-11-07"
    countries: [es, fr]
    body:
      - From 1648 the Fronde, a series of revolts against the regency government, kept France from sending help, while famine and plague killed many in Catalonia from 1650. The Spanish retook Tortosa late that year, and in the summer of 1651 Don Juan José of Austria, Philip IV’s illegitimate son, laid siege to Barcelona by land and sea. After fifteen months the city surrendered on 11 October 1652. Philip pardoned most of the rebels and confirmed Catalonia’s laws, but kept a garrison in Barcelona and control over who could hold office. The French held on in the north and attacked Girona in 1653 without success.
      - Fighting along the Pyrenees went on until the Franco-Spanish War ended. By the Treaty of the Pyrenees, signed on Pheasant Island in the Bidassoa on 7 November 1659, Spain ceded Roussillon and the northern part of Cerdanya to France, and the border was drawn along the crest of the mountains. The town of Llívia, which was not counted among the villages ceded, stayed Spanish as an enclave. In the ceded lands French institutions replaced the Catalan ones, and in 1700 Louis XIV made French compulsory in official documents.
    facts:
      - [Siege of Barcelona, "July 1651 – October 1652"]
      - [Barcelona surrenders, 11 October 1652]
      - [Treaty of the Pyrenees, 7 November 1659]
    markers:
      - kind: taken
        side: sp
        name: Tortosa
        date: late 1650
        text: Spanish troops retook the town, opening the way up the coast to Barcelona.
        lonlat: [0.52, 40.81]
      - kind: taken
        side: sp
        name: Barcelona
        date: 11 October 1652
        text: Starved by a fifteen-month siege and struck by plague, the city surrendered to Don Juan José. The French garrison under La Mothe-Houdancourt was allowed to leave.
        lonlat: [2.17, 41.39]
      - kind: held
        side: sp
        name: Girona
        date: 1653
        text: A French army besieged the city and withdrew when a Spanish relief army approached.
        lonlat: [2.82, 41.98]
      - kind: event
        name: Llívia
        date: 1660
        text: Llívia was a town, not one of the villages handed over, and remained a Spanish enclave inside France.
        lonlat: [1.98, 42.46]
        lp: l
      - kind: treaty
        name: Treaty of the Pyrenees
        date: 7 November 1659
        text: Signed by Cardinal Mazarin and Luis de Haro on an island in the border river, it also arranged the marriage of Louis XIV and the Infanta Maria Theresa.
        lonlat: [-1.77, 43.34]
    arrows:
      - side: sp
        label: Don Juan José, 1651
        via: [[1.25, 41.12], [1.7, 41.22], [2.08, 41.35]]
    areas:
      - style: gained
        side: fr
        label: Roussillon and northern Cerdanya, ceded to France
        atoms: [FR-66]
