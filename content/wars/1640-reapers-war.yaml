id: reapers-war
name: Reapers’ War
start: "1640-06-07"
end: "1659-11-07"
tier: B
summary: The revolt of Catalonia against the government of Philip IV and his minister Olivares, set off by the billeting of royal troops during the war with France. The Catalans placed themselves under the French king in 1641 and were ruled by France for over a decade, until Spanish troops retook Barcelona in 1652; at the Peace of the Pyrenees in 1659 Spain ceded Roussillon and northern Cerdanya to France.
countries: [es, fr]
sides:
  - id: cat
    name: Catalan rebels
    polities: []
    ink: red
    moves: Catalan moves
    success: Catalan success
  - id: fr
    name: France
    polities: [france]
    ink: navy
    moves: French and Franco-Catalan moves
    success: French and Franco-Catalan success
  - id: sp
    name: Spain
    polities: [spain]
    ink: gold
    moves: Spanish moves
    success: Spanish success
notes:
  - Dates are Gregorian. The revolt is named after the reapers, segadors, who sparked the riot of June 1640; the song Els Segadors is now the anthem of Catalonia.
  - The revolt was part of the wider Franco-Spanish War of 1635–1659, which has its own entry. This entry follows events in Catalonia and Roussillon.
  - On the base map Catalonia stays under Spain throughout; the rule of the rebel government and of France is drawn in areas.
