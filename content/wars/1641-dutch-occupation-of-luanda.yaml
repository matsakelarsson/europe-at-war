  - title: Salvador de Sá’s reconquest
    date: May – August 1648
    when: "1648-08-24"
    borders: "1648-09-01"
    countries: [ao, br, st]
    body:
      - "Salvador Correia de Sá e Benevides, governor of Rio de Janeiro, was appointed governor of Angola and charged with recovering it. He sailed from Rio in May 1648 with about fifteen ships and some 900 to 1,500 men. He reached Luanda in August and found it held by about 1,200 Dutch troops, many of the Company’s soldiers being away in the interior with Njinga. After a bombardment and a costly assault on the forts, in which the Portuguese lost 163 killed, the Dutch commander agreed on 24 August 1648 to surrender the town and leave Angola."
      - About 300 Dutch soldiers returning from the interior also surrendered; Njinga’s army, which had come with them, was beaten and fell back to Matamba. Sá sent forces that took back Benguela and the islands of São Tomé and Príncipe. Kongo, left without its ally, signed a peace on 13 April 1649 by which it lost Luanda Island, the source of its shell money (nzimbu). The loss of Angola deprived Dutch Brazil of enslaved labour, and the Company, near bankruptcy, surrendered Recife to Portugal in 1654, although the Company kept trading north of the Congo and from about 1670 bought slaves regularly at Loango.
    facts:
      - [Sá sails from Rio de Janeiro, "May 1648"]
      - [Dutch surrender of Luanda, "24 August 1648"]
      - [Peace between Kongo and Portugal, "13 April 1649"]
    markers:
