id: dutch-occupation-of-luanda
name: Dutch occupation of Luanda
start: "1641-08-25"
end: "1648-08-24"
tier: B
summary: "The seven years in which the Dutch West India Company (WIC) held Luanda, the capital and slave port of Portuguese Angola, part of the worldwide Dutch–Portuguese war. The Company, which had conquered the sugar lands of north-eastern Brazil, needed enslaved Africans for its plantations, and in August 1641 a fleet sent from Recife by Johan Maurits of Nassau under Admiral Cornelis Jol took Luanda; the Company also held Benguela in the south. The Portuguese governor and settlers withdrew up the Kwanza to the fort of Massangano. Garcia II of Kongo and Queen Njinga of Ndongo and Matamba, both enemies of the Portuguese, allied with the Dutch, and Soyo sent an embassy to the Dutch Republic. The Company wanted trade more than conquest: truces in 1643 left the Portuguese in their inland forts, and only after Njinga’s defeat at Kavanga in 1646 did it send troops to help her, winning at Kombi in 1647. Portugal, independent again from Spain since 1640, answered from Brazil: in August 1648 Salvador Correia de Sá, governor of Rio de Janeiro, arrived with a fleet and about a thousand men, and on 24 August 1648, after a short siege, the Dutch garrison agreed to leave Angola. Kongo had to make peace on harsh terms in 1649 and Njinga withdrew to Matamba. Without Angola’s slaves Dutch Brazil declined, and it fell to Portugal in 1654."
countries: [ao]
