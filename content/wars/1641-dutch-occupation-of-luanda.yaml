  - title: War in the interior
    date: 1643–1647
    when: "1647-10-29"
    borders: "1647-11-01"
    countries: [ao]
    body:
      - The truces did not hold. Njinga, who did not accept them, kept fighting from her war camp north of the Bengo and defeated the Portuguese at Ngoleme in 1644. The Dutch attacked the Portuguese on 17 May 1643, suspecting a plot against Luanda; hunger on both sides brought a new truce on 1 July, but it was broken again in 1645, and both sides raided each other’s allies among the lords of the Ilamba district around Luanda. In October 1645 a new governor, Francisco de Souto-Maior, slipped past the Dutch with reinforcements from Brazil, landing at Suto near Cabo Ledo and marching inland to Massangano. In March 1646 the captain-major Gaspar Borges Madureira, with Portuguese troops, Imbangala and the army of the Portuguese vassal king of Ndongo, Filipe Hari a Ngola, surprised Njinga’s camp at Kavanga, captured her sister Kambu and seized her archives, which revealed her correspondence with Kongo and the Dutch.
      - The Company now decided to support Njinga with soldiers. In 1647 a combined army of Njinga’s troops, a Kongo force under Dom Cristóvão Corte-Real and 400–500 Dutch soldiers, over 8,000 men in all, caught Madureira’s army of some 30,000, including 600 Portuguese and Luso-Africans, in its camp at Kombi, north of Massangano, on 29 October 1647 (25 November in some accounts). Madureira and many of his officers were killed. The allies went on to besiege Ambaca, Massangano and Muxima, but without artillery they could not take the forts, and the Portuguese held on.
    facts:
      - [Souto-Maior lands with reinforcements, "October 1645"]
      - [Battle of Kavanga, "March 1646, Portuguese victory"]
      - [Battle of Kombi, "29 October 1647, allied victory"]
