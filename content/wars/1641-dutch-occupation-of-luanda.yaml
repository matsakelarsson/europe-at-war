steps:
  - title: The fall of Luanda
    date: 1641–1643
    when: "1641-08-26"
    borders: "1641-09-01"
    countries: [ao]
    body:
      - The West India Company had first tried to take Luanda in 1624, at the invitation of Kongo’s King Pedro II, and failed. After it conquered Pernambuco in Brazil in 1630, the slave trade from Angola became vital to its sugar colony. In 1641, although Portugal had broken away from Spain in December 1640 and was negotiating a truce with the Dutch Republic, Johan Maurits sent Admiral Cornelis Jol from Recife with a fleet of about twenty ships. On 25 August 1641 the Dutch landed 2,145 soldiers near Luanda, and the next day the governor, Pedro César de Meneses, abandoned the town. Some 800 Portuguese, soldiers and civilians, regrouped inland; driven from Kilunda on 19 September, they fell back to their plantations on the Bengo River and, after Kongo and Dutch attacks there, to the fort of Massangano on the Kwanza, which they reached in December. The Company also held Benguela, in the south.
      - "Garcia II, king of Kongo since January 1641, concluded an alliance with the Company on 28 March 1642, and on 24 September 1642 his army, with Dutch support, routed the Portuguese. Njinga, who had been at war with Portugal since 1626, sent an embassy to Luanda and opened her slave trade to the Dutch. The count of Soyo sent his cousin Dom Miguel de Castro to the Netherlands, where he was received by the stadtholder at The Hague in July 1643. But the Company’s directors in Luanda, Pieter Moortamer and Cornelis Nieulant, had no wish to conquer the interior: they needed the Portuguese trading network, and on 30 January 1643 Nieulant signed a truce with Meneses that left the Portuguese in Massangano, Muxima and Ambaca and the Dutch in Luanda and on the coast. The truce angered Garcia II, who turned to his quarrel with Soyo."
    facts:
      - [Dutch landing near Luanda, "25 August 1641 (2,145 soldiers)"]
      - [Luanda taken, "26 August 1641"]
      - [Truces with the Portuguese, "1643"]
