notes:
  - "Dates differ in the sources: Luanda fell on 25 or 26 August 1641 (one account gives 23 August), Kombi is dated 29 October or 25 November 1647, and the Dutch surrender of 1648 is put between 15 and 24 August, the date the capitulation was signed. Troop numbers also vary: Jol is said to have landed 2,145 or about 3,000 men, and Sá to have brought 900 to about 1,500."
  - "On both sides most of the fighting was done by Africans: the Portuguese relied on the army of their vassal king of Ndongo, Filipe Hari a Ngola, on Imbangala mercenaries and on the levies of subject lords, the Dutch on their Kongo and Njinga allies. Njinga’s war in these years is told more fully in the Portuguese–Ndongo wars."
