id: wars-of-castro
name: Wars of Castro
start: "1641-10-12"
end: "1649-09-02"
tier: C
summary: Two wars between the papacy and the Farnese dukes of Parma over the Duchy of Castro, their fief in northern Lazio. After Odoardo Farnese quarrelled with Pope Urban VIII’s Barberini nephews, Rome stopped buying grain from Castro, and Odoardo could not pay his Roman creditors. On 12 October 1641 a papal army took Castro almost without a fight, and the pope excommunicated Odoardo. In 1642 Odoardo’s cavalry rode deep into the Papal States and threatened Rome, and Venice, Tuscany and Modena allied with him. After fighting in the Po valley and around Lake Trasimeno, the papal army was beaten at Lagoscuro, near Ferrara, on 17 March 1644, and a peace signed at Ferrara on 31 March gave Castro back. In 1649 Odoardo’s son Ranuccio II stopped paying the creditors, and after the new bishop of Castro was murdered, Pope Innocent X sent troops who took the town. On 2 September 1649 Castro was razed on the pope’s orders, and a column was put up saying ‘Here stood Castro’. The duchy passed to the Papal States.
