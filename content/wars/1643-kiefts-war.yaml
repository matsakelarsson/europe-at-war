id: kiefts-war
name: Kieft’s War (Wappinger War)
start: "1643-02-25"
end: "1645-08-30"
tier: B
summary: "A war between the Dutch colony of New Netherland and the Munsee-speaking Lenape and Wappinger peoples around New Amsterdam (New York), named after the colony’s director, Willem Kieft. From 1639 Kieft demanded tribute in corn, furs and wampum from the nations around Manhattan, and quarrels over stray livestock, killings and revenge followed. In February 1643, against the advice of the colonists’ elected council, he sent soldiers against Wecquaesgeek and Tappan refugees who had fled from Mohawk raids to Pavonia and Corlears Hook; some 120 men, women and children were killed in the night. The nations of the lower Hudson and Long Island rose, burned farms and villages from Staten Island to Westchester and killed many colonists, among them Anne Hutchinson and most of her family. Hired by Kieft, the Pequot War veteran John Underhill led Dutch and English soldiers who attacked Native villages in the winter of 1643–1644, killing some 500 to 700 people at Pound Ridge in March 1644. Peace was made at Fort Amsterdam on 30 August 1645. The Native losses in the war are usually put at more than a thousand; New Netherland’s farms were ruined and the West India Company recalled Kieft, who drowned on his way home in 1647."
