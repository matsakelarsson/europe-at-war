notes:
  - New Netherland used the Gregorian calendar; the English towns on Long Island and in New England used the Julian (Old Style), so some events are dated ten days apart in different sources.
  - The war is known almost entirely from Dutch and English writings, among them the journal of the patroon David Pietersz. de Vries, who opposed Kieft, the colonists’ complaints to the West India Company, and Underhill’s own account. Native numbers and losses come from these sources and are rough; the site of the Pound Ridge village is disputed, and some accounts date the attack to February rather than March 1644.
  - The bands of the lower Hudson, Long Island and northern New Jersey, among them the Hackensack, Tappan, Raritan, Wecquaesgeek, Siwanoy, Canarsee and Matinecock, spoke Munsee, a Lenape (Delaware) language; the sources group some of them as the Wappinger Confederacy.
