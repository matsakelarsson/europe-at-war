steps:
  - title: Tribute, revenge and the killings at Pavonia
    date: 1639 – February 1643
    when: "1643-02"
    borders: "1643-02-25"
    countries: [us]
    view:
      center: [-74.00, 40.70]
      size: [60, 55]
    body:
      - Willem Kieft arrived as director of New Netherland in 1638, when the colony had grown from a trading post into a string of farms around New Amsterdam on lands bought from, or claimed against, the Munsee bands of the lower Hudson. In 1639, to pay for the garrison of Fort Amsterdam, he demanded tribute in corn, furs and wampum from the nearby nations, who refused. In 1640, blaming the Raritan for pigs stolen on Staten Island, which were later found to have been taken by colonists, he sent soldiers who killed several of them; the Raritan answered by burning David de Vries’s farm and killing four of his men, and Kieft put a bounty on Raritan heads. In August 1641 a Wecquaesgeek man killed the old wheelwright Claes Swits at Turtle Bay, in revenge, he said, for his uncle, killed by Dutchmen years before.
      - Kieft called the colony’s first elected body, the Twelve Men, to back a war; they urged patience and asked for a say in government, and Kieft dissolved them. In February 1643 Mohawk and Mahican war parties armed with Dutch guns attacked the Wecquaesgeek and Tappan, and hundreds of refugees fled to the Hackensack country at Pavonia and to Corlears Hook on Manhattan, where they hoped for Dutch protection. On the night of 25–26 February Kieft’s soldiers and volunteers fell on both camps and killed some 120 people, by most accounts about 80 at Pavonia and 40 at Corlears Hook, many of them women and children. De Vries, who had warned Kieft against it, wrote of infants torn from their mothers’ breasts and hacked to pieces; Kieft rewarded the soldiers.
