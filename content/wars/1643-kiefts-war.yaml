  - title: Two years of war and the peace of 1645
    date: March 1643 – August 1645
    when: "1643-08"
    borders: "1645-08-30"
    countries: [us]
    body:
      - The killings united the Munsee bands against the colony. Warriors from the Hackensack, Tappan, Wecquaesgeek, Raritan and Long Island bands burned farms and villages from Staten Island and Pavonia to the Bronx and Westchester, killed men and carried off women and children, and drove the colonists into New Amsterdam. A truce with some bands in the spring of 1643 did not last, and from August the Wappinger under the Tankiteke sachem Pacham attacked boats on the Hudson. In late August or September 1643 Siwanoy warriors killed the Puritan dissenter Anne Hutchinson and most of her household near Split Rock in what is now the Bronx; English refugees in Dutch territory were not spared.
      - Kieft hired John Underhill, who had led the attack on the Pequot fort at Mystic in 1637, and a company of English and Dutch soldiers. In the winter of 1643–1644 they burned Wecquaesgeek villages and their winter stores and, by the colonists’ accounts, killed some 120 people on western Long Island. In March 1644 about 130 men guided from Stamford surrounded a large Wappinger village near what is now Pound Ridge by night and set it on fire with its people inside. The colonists reported 500 to 600 dead, the Native survivors more than 600; estimates range from 500 to 700, and only a handful escaped.
      - The colonists blamed Kieft and petitioned the company to remove him. Worn down on both sides, the bands made peace one after another, and on 30 August 1645 the sachems, among them Oratam of the Hackensack, with Mohawk envoys as witnesses, made a general peace with Kieft at Fort Amsterdam. The war set back New Netherland for years. Kieft was recalled and drowned when his ship was wrecked off Wales in 1647, and Peter Stuyvesant took his place. Ten years later, on 15 September 1655, while Stuyvesant’s soldiers were away taking New Sweden, some five hundred Munsee came to New Amsterdam in canoes; fighting broke out that evening, and in the raids that followed on Pavonia and Staten Island, the Peach War, some forty colonists were killed and about a hundred taken captive.
    facts:
