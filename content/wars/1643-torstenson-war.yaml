id: torstenson-war
name: Torstenson War
start: "1643"
end: "1645"
tier: B
summary: A war in which Sweden, in the middle of the Thirty Years’ War, attacked Denmark–Norway from Germany and from Sweden. By the Peace of Brömsebro in 1645 Denmark–Norway lost Gotland, Ösel, Jämtland and Härjedalen, handed over Halland for 30 years and freed Swedish ships from the Sound Dues.
