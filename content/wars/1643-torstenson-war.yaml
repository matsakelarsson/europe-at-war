    view:
      center:
        - 14.6636
        - 59.0219
      size:
        - 1123
        - 1305
    body:
      - In the middle of the German war Sweden turned on Denmark–Norway. Torstenson overran Jutland from the south in December 1643 and January 1644, Gustav Horn invaded Scania, and a Swedish-Dutch fleet destroyed the Danish navy off Fehmarn in October 1644. Bremen and Verden were occupied in 1645.
      - At the Peace of Brömsebro on 13 August 1645, Denmark–Norway gave up Gotland, Ösel, Jämtland, Härjedalen, Idre and Särna, handed over Halland for 30 years, and freed Swedish ships from the Sound Dues.
    facts:
      - - Ceded for good
        - Gotland, Ösel, Jämtland, Härjedalen, Idre, Särna
      - - For 30 years
        - Halland
