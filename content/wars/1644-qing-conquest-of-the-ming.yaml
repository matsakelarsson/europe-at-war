  - title: Li Dingguo’s offensive
    date: 1652–1655
    when: "1652-08"
    borders: "1652-12-01"
    countries: [cn]
    body:
      - "The former Great Xi armies in Yunnan and Guizhou had made an alliance with the Yongli court, and in early 1652 Sun Kewang brought the fugitive emperor to Anlong in south-western Guizhou, where he lived under Sun’s protection and control. That summer the alliance went over to the attack. Li Dingguo led an army into Hunan and Guangxi, while Liu Wenxiu marched into Sichuan."
      - "In early August 1652 Li Dingguo took Guilin by storm; Kong Youde killed himself, and most of Guangxi returned to the Ming side. Li then turned north into Hunan, and at Hengzhou (Hengyang) he drew the Qing army sent against him into an ambush and killed its commander, the Manchu prince Nikan, late in 1652. These were the heaviest defeats the Qing had suffered since 1644. In Sichuan, though, Liu Wenxiu was beaten by Wu Sangui at Baoning, and Sun Kewang, jealous of Li’s success, failed to support him."
      - "Li Dingguo turned east into Guangdong, hoping to join forces with Zheng Chenggong’s fleet. He failed to take Zhaoqing in 1653, and in 1654 his siege of Xinhui in the Pearl River delta was broken by Qing relief before Zheng’s ships arrived. In 1655 he fell back to Nanning, and the next year he brought the Yongli Emperor from Anlong to Kunming, away from Sun Kewang."
    facts:
      - [Guilin retaken by Li Dingguo, "August 1652"]
      - [Death of Prince Nikan, "late 1652, Hengzhou (Hengyang)"]
      - [Siege of Xinhui, "1654, Qing relief"]
