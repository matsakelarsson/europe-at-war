id: qing-conquest-of-the-ming
name: Qing conquest of the Ming
start: "1644-05-27"
end: "1662-06"
tier: A
summary: "The war in which the Manchu Qing dynasty, with the help of the Ming generals who went over to it, took China from the rebels who had overthrown the Ming and from the Ming princes who tried to restore it. In April 1644 the rebel leader Li Zicheng took Beijing and the last Ming emperor at Beijing hanged himself. The Ming commander at Shanhai Pass, Wu Sangui, let the Qing army through the Great Wall, and on 27 May 1644 their combined armies routed Li Zicheng; the Qing regent Dorgon entered Beijing in June and made it the capital of the Qing. Over the next two years Qing armies drove Li Zicheng out of Shaanxi, took Yangzhou, where the city was sacked, and Nanjing, and put down risings in the Yangtze delta against the order that all men shave their heads in the Manchu style. A succession of Ming princes, the Southern Ming, held parts of the south, helped from 1648 by Ming generals who changed sides again and from 1652 by the armies of the late rebel Zhang Xianzhong under Li Dingguo. In 1658–1659 Qing armies took Guizhou and Yunnan, and the last Ming claimant, the Yongli Emperor, fled to Burma. Handed over to Wu Sangui in January 1662, he was executed at Kunming that June. Ming loyalists held Taiwan until 1683."
