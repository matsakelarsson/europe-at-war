  - title: Yangzhou and Nanjing
    date: May – June 1645
    when: "1645-05-20"
    borders: "1645-06-08"
    countries: [cn]
    body:
      - "The Hongguang court was divided. The chief minister, Ma Shiying, and his allies fought the reform-minded officials of the Donglin faction, and the defence of the north bank of the Yangtze was left to Shi Kefa, the minister of war, with four quarrelsome generals. In April 1645 Zuo Liangyu, the commander at Wuchang, turned his army downriver to purge the court; he died on the way, and his son went over to the Qing. Ming troops were drawn off to meet him just as Dodo, freed from the war against Li Zicheng, marched south-east from Henan."
      - "Dodo reached Yangzhou, on the Grand Canal north of the Yangtze, in May. Shi Kefa refused to surrender, and the city fell on 20 May 1645. Shi Kefa was executed, and Dodo let his troops sack the city for several days. The survivor Wang Xiuchu, in his Account of Ten Days at Yangzhou, put the dead at more than 800,000; historians regard this as a great exaggeration, since the city itself probably had no more than about 300,000 people, but the killing was on a very large scale."
      - "The Qing army crossed the Yangtze near Zhenjiang at the beginning of June. The Hongguang Emperor fled to the camp of the general Huang Degong near Wuhu, and Nanjing surrendered without a fight on 8 June. Huang was killed and the emperor was handed over by his own officers; taken to Beijing, he was put to death there in 1646. Shi Kefa became a symbol of loyalty to the Ming, and the sack of Yangzhou of the cruelty of the conquest."
    facts:
      - [Fall of Yangzhou, "20 May 1645"]
      - [Dead in the sack, "more than 800,000 according to Wang Xiuchu; historians consider this greatly exaggerated"]
      - [Nanjing surrenders, "8 June 1645"]
