  - title: Changing sides again
    date: 1648–1650
    when: "1648-05"
    borders: "1650-11-24"
    countries: [cn]
    body:
      - "Many of the Ming generals who had gone over to the Qing felt poorly rewarded, and in 1648 several changed sides again. Jin Shenghuan declared for the Yongli Emperor at Nanchang in Jiangxi early in the year, Li Chengdong, the conqueror of Guangzhou, followed in Guangdong in May, and at Datong in Shanxi Jiang Xiang rose at the turn of 1649. For a moment the Yongli court, back at Zhaoqing, held most of the south, while Ming loyalists in Hunan under He Tengjiao pressed north towards Changsha."
      - "The Qing answered with their best armies. Nanchang was starved out and stormed in early 1649 and Jin Shenghuan was killed; He Tengjiao was caught and executed at Xiangtan; Li Chengdong drowned during a retreat in Jiangxi; and Datong fell in the autumn of 1649 after a long siege and was sacked. In 1650 Shang Kexi and Geng Jimao, Liaodong generals who had served the Qing since the 1630s, besieged Guangzhou for ten months. When it fell on 24 November 1650 the city was sacked: the Southern Ming article gives up to 70,000 dead, and a local history’s figure of 700,000 is widely doubted."
      - "Within days Kong Youde, another Liaodong general, took Guilin; Qu Shisi stayed in the city and was executed when he refused to submit. The Yongli Emperor fled west to Nanning."
    facts:
