  - title: The fall of Fujian and the Zheng family
    date: 1646
    when: "1646-10-06"
    borders: "1646-10-06"
    countries: [cn]
    body:
      - "The Longwu court depended on Zheng Zhilong, a former pirate who had become the Ming admiral of Fujian and controlled the coastal trade from Xiamen and Anping. The emperor wanted to march into Jiangxi to rally the loyalists there; Zheng Zhilong held back his troops and money, and opened talks with the Qing. In the summer of 1646 a Qing army under Bolo crossed the Qiantang River, scattered the Prince of Lu’s regime, which fled to the Zhoushan islands, and in the autumn marched into Fujian through the mountain passes, which Zheng had left unguarded."
      - "The Longwu Emperor fled west towards Jiangxi and was caught at Tingzhou, where he died on 6 October 1646. Fuzhou fell, and in November Zheng Zhilong surrendered to the Qing and was taken north; he was kept in Beijing and executed in 1661. His son Zheng Chenggong refused to follow him. Longwu had given him the imperial surname, and Europeans called him Koxinga, from the title Guoxingye, “lord of the imperial surname”. From Xiamen and Jinmen (Kinmen) he gathered his father’s ships and men and began the maritime war against the Qing that his family would carry on for 37 years."
    facts:
      - [Death of the Longwu Emperor, "6 October 1646, Tingzhou"]
      - [Surrender of Zheng Zhilong, "November 1646"]
