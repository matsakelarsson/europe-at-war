  - title: The end of the Yongli court
    date: 1661–1662
    when: "1662-01-22"
    borders: "1662-06-01"
    countries: [cn, mm]
    body:
      - "In Burma the emperor’s followers were disarmed and kept under guard. Li Dingguo and Bai Wenxuan tried several times to fight their way to him, and besieged Ava in 1660–1661 without success. In May 1661 Pye Min overthrew his brother Pindale, and soon after his men killed most of the emperor’s officials and attendants at a meeting to which they had been summoned to swear an oath. In December 1661 Wu Sangui entered Burma with about 20,000 men and demanded the emperor. On 22 January 1662 the Burmese sent him by boat to Wu Sangui’s camp near Ava."
      - "Wu took him back to Kunming, where the Yongli Emperor and his son were strangled in June 1662. Li Dingguo, who was still trying to raise help in the borderlands, died at Mengla near the Laotian border in August. Zheng Chenggong, who had taken Taiwan from the Dutch East India Company that year, died there on 23 June 1662. The last loyalist armies in the mountains of eastern Sichuan and western Hubei, the Kuidong Thirteen Houses, were destroyed in 1664; Zheng Chenggong’s heirs ruled Taiwan as the Kingdom of Tungning until 1683."
      - "The conquest left the south in the hands of the Chinese generals who had won it for the Qing: Wu Sangui in Yunnan and Guizhou, Shang Kexi in Guangdong and Geng Jimao in Fujian, each with his own army and revenues. Their rise against the Kangxi Emperor in 1673 began the Revolt of the Three Feudatories."
    facts:
      - [Yongli Emperor handed over, "22 January 1662, near Ava"]
      - [Execution of the Yongli Emperor, "June 1662, Kunming"]
      - [Death of Li Dingguo, "August 1662, Mengla"]
    link: { href: "#/war/revolt-of-the-three-feudatories", text: Revolt of the Three Feudatories }
