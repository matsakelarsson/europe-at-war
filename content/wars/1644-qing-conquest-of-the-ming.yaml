notes:
  - "The Qing armies that conquered China were mostly Chinese. Han Chinese bannermen from Liaodong, the Green Standard troops formed from surrendered Ming armies, and generals such as Wu Sangui, Shang Kexi, Geng Jimao, Kong Youde, Hong Chengchou and Li Chengdong did much of the fighting, alongside the Manchu and Mongol banners. The war is told here from 1644; the earlier war between the Ming and the Later Jin, and the rebellions that brought Li Zicheng to Beijing, are separate stories."
  - "Numbers of dead in the sacks of Yangzhou, Jiangyin, Jiading and Guangzhou and in Sichuan come from contemporary accounts and local histories, and many are exaggerated; the text gives the range the sources give. For the whole period of war, famine and epidemic from the 1610s to 1683, a figure of about 25 million dead is often cited, but it is an estimate."
  - Dates are converted from the Chinese calendar and differ by a day or more between sources. Places are given by their names of the time, with today’s names where they differ (Yongchang for Baoshan, Tengyue for Tengchong).
