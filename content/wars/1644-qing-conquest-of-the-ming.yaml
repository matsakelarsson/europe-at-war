  - title: The pursuit of Li Zicheng
    date: October 1644 – 1645
    when: "1645-02"
    borders: "1645-03-01"
    countries: [cn]
    body:
      - "After taking Beijing, the Qing put down risings in Hebei and Shandong and in October 1644 sent two armies against Li Zicheng. Ajige marched west by the northern route through Datong and the Ordos into northern Shaanxi, while Dodo marched through Henan to Tongguan, the pass where the Yellow River turns east. Dodo’s army defeated the Shun army at Tongguan in January 1645, and in February Li Zicheng abandoned Xi’an."
      - "Li retreated south-east through the mountains to Xiangyang and down the Han River to Wuchang on the Yangtze, with Ajige close behind. Defeated again, his army broke up. Li Zicheng died in the Jiugong Mountains on the border of Hubei and Jiangxi in 1645, either killed by a local militia or by his own hand; the month is uncertain. Much of what was left of his army, under his nephew Li Guo and others, made peace with the Ming loyalists in Huguang and later fought for them."
      - "The Hongguang court at Nanjing had hoped that the Qing would destroy the rebels and then withdraw, and sent envoys to Beijing with gifts of silver and silk. Dorgon replied that the Qing had taken the empire from the rebels, not from the Ming, and that the southern court was itself illegitimate."
    facts:
      - [Battle of Tongguan, "January 1645, Qing victory"]
      - [Xi’an abandoned by Li Zicheng, "February 1645"]
      - [Death of Li Zicheng, "1645, Jiugong Mountains"]
