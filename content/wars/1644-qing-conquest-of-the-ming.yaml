  - title: Collapse in the south-west
    date: 1657–1659
    when: "1659-01"
    borders: "1659-03-01"
    countries: [cn, mm]
    body:
      - "In 1657 Sun Kewang marched on Kunming to settle his quarrel with Li Dingguo by force. In battle in eastern Yunnan many of his officers went over to Li, and Sun fled; in December 1657 he surrendered to the Qing at Changsha, bringing them detailed knowledge of the south-west. Hong Chengchou, the former Ming commander who had directed the Qing war in the south since 1653, now prepared the final offensive."
      - "In 1658 three Qing armies converged on Guizhou: Wu Sangui from Sichuan, Loto from Hunan and Jobtei from Guangxi. Under the overall command of the Manchu prince Doni they marched into Yunnan at the end of the year, and in late January 1659 they took Kunming. The Yongli Emperor fled west through Yongchang and Tengyue. Li Dingguo fought a costly rearguard battle at Mopanshan in the Gaoligong Mountains west of the Salween in the spring of 1659, and the emperor crossed the border into Burma, where King Pindale allowed him to settle at Sagaing, across the Irrawaddy from Ava."
      - "That summer Zheng Chenggong sailed up the Yangtze with a large fleet and besieged Nanjing, but his army was routed there in September and he fell back to Xiamen (see Zheng Chenggong’s northern expedition). On the mainland, organised Ming resistance was nearly over."
    facts:
      - [Surrender of Sun Kewang, "December 1657, Changsha"]
      - [Kunming taken by the Qing, "late January 1659"]
      - [Yongli Emperor enters Burma, "1659"]
