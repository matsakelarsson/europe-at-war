  - title: Guangzhou, Zhaoqing and Sichuan
    date: November 1646 – 1647
    when: "1647-01-02"
    borders: "1647-02-01"
    countries: [cn]
    body:
      - "After the death of Longwu, two princes claimed the throne in Guangdong within a few weeks of each other: his younger brother as the Shaowu Emperor at Guangzhou (Canton), and the Prince of Gui, Zhu Youlang, as the Yongli Emperor at Zhaoqing on 24 December 1646. Their armies fought each other while a Qing army under Li Chengdong came down the coast from Fujian. Guangzhou fell on 20 January 1647 and the Shaowu Emperor killed himself. The Yongli Emperor fled up the West River to Wuzhou and Guilin, where the loyal minister Qu Shisi beat off Qing attacks."
      - "In Sichuan, Zhang Xianzhong, the other great rebel of the late Ming, had taken Chengdu on 9 September 1644 and ruled the province as emperor of the Great Xi. His rule is remembered for mass killings. The official History of Ming gives an impossible figure of 600 million dead; one modern estimate is about one million of a population of some three million. Some historians argue that the Ming loyalists, the Qing and the warlord armies of the following years did as much killing, and Sichuan lost most of its people to war, famine and epidemics between the 1640s and the 1660s."
      - "In late 1646 Zhang abandoned Chengdu and marched north. A Qing army under Hooge met him at Xichong, where he was killed on 2 January 1647. His four leading generals, Sun Kewang, Li Dingguo, Liu Wenxiu and Ai Nengqi, led what was left of his army south through Chongqing into Guizhou and Yunnan, where they took Kunming in 1647 and made it their base."
    facts:
      - [Yongli Emperor enthroned, "24 December 1646, Zhaoqing"]
      - [Fall of Guangzhou, "20 January 1647"]
      - [Death of Zhang Xianzhong, "2 January 1647, Xichong"]
