  - title: The queue order and the Yangtze delta
    date: July – October 1645
    when: "1645-07-21"
    borders: "1645-10-09"
    countries: [cn]
    body:
      - "From Nanjing the Qing armies spread through the Yangtze delta and took Hangzhou on 6 July 1645, where another Ming prince surrendered. Most towns of the delta had submitted when, on 21 July, Dorgon ordered that all men in the conquered lands shave the front of the head and wear their hair in a braided queue, as the Manchus did, within ten days. An order of 1644 to the same effect had been withdrawn; this one was enforced, summed up in the saying “keep your hair and lose your head, or keep your head and lose your hair”."
      - "For men raised to regard their hair as a gift from their parents, the order was a humiliation, and it turned surrendered towns into rebels across the delta: Jiangyin, Jiading, Kunshan, Songjiang and many others. At Jiangyin the townspeople, led by the former officials Yan Yingyuan and Chen Mingyu, held their walls for more than eighty days. When Qing cannon breached them on 9 October the town was sacked; sources put the dead at about 74,000 to 100,000. At Jiading the Qing commander Li Chengdong, a former Ming general, ordered three massacres within a month, killing tens of thousands."
      - "Resistance also took the form of new courts. In August 1645 the Prince of Lu, Zhu Yihai, became regent at Shaoxing south of Hangzhou Bay, and the Prince of Tang was enthroned at Fuzhou as the Longwu Emperor. The two courts did not recognise each other, and their armies could only hold the line of the Qiantang River."
    facts:
      - [Hangzhou taken, "6 July 1645"]
      - [Queue order, "21 July 1645"]
      - [Siege of Jiangyin, "July – 9 October 1645"]
      - [Longwu Emperor enthroned at Fuzhou, "18 August 1645"]
