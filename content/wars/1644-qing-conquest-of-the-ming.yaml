steps:
  - title: Shanhai Pass and Beijing
    date: April – June 1644
    when: "1644-05-27"
    borders: "1644-06-06"
    countries: [cn]
    body:
      - "By the spring of 1644 the Ming dynasty was fighting on two fronts. In the north-west, peasant armies had been rising since 1628, and their strongest leader, Li Zicheng, proclaimed the Shun dynasty at Xi’an in February 1644, marched east through Shanxi and broke into Beijing on 24 April. The next day the Chongzhen Emperor hanged himself on the hill behind the Forbidden City. Beyond the Great Wall stood the Qing, the state the Jurchen leader Nurhaci had founded as the Later Jin in 1616 and his son Hong Taiji had renamed in 1636, calling his people Manchus. Since the fall of Songshan and Jinzhou in 1642 the Qing held all the land outside the Wall. Hong Taiji had died in 1643, and his brother Dorgon ruled as regent for his five-year-old son, the Shunzhi Emperor."
      - "Between the two stood Wu Sangui, the Ming commander at Ningyuan, who had been called south to save the capital and had just passed through Shanhai Pass, where the Great Wall meets the sea, when Beijing fell. He went back to the pass. Li Zicheng tried to win him over, and when that failed marched against him with an army of perhaps 60,000 to 100,000 men. Wu appealed to Dorgon, who was already on the march and demanded that Wu submit to the Qing. On 27 May 1644 Wu’s troops fought the Shun army in front of the pass all morning, until Qing cavalry rode round their right wing and broke Li’s flank. The Shun army fled to Beijing, where Li executed Wu’s father, proclaimed himself emperor on 3 June and left the next day, setting fire to the palaces."
      - "Dorgon entered Beijing on 6 June (some sources give 5 June), saying that the Qing had come to avenge the Chongzhen Emperor, whom he gave an imperial burial. Most Ming officials in the capital kept their posts. The Shunzhi Emperor was brought from Shenyang (Mukden) and enthroned in Beijing on 8 November 1644. In the south, officials at Nanjing, the Ming secondary capital, had already enthroned a grandson of the Wanli Emperor, the Prince of Fu, as the Hongguang Emperor on 19 June: the first of the Southern Ming courts."
    facts:
      - [Beijing taken by Li Zicheng, "24 April 1644"]
      - [Battle of Shanhai Pass, "27 May 1644, Qing and Wu Sangui victory"]
      - [Qing army enters Beijing, "6 June 1644"]
      - [Hongguang Emperor enthroned at Nanjing, "19 June 1644"]
