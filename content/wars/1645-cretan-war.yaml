id: cretan-war
name: Cretan War
start: "1645"
end: "1669-09-27"
tier: B
summary: The fifth Ottoman–Venetian war, also called the War of Candia, in which the Ottoman Empire took Crete from Venice. The Ottomans landed in 1645 and overran most of the island within three years, but the capital, Candia, held out for over twenty years while the Venetian fleet fought to blockade the Dardanelles. With help from the papacy, Malta and France, Venice won most of the battles at sea, yet in 1669 Francesco Morosini surrendered Candia after one of the longest sieges in history.
countries: [gr, tr, hr, mt, it, fr]
sides:
  - id: ve
    name: Republic of Venice
    polities: [venice]
    ink: red
    moves: Venetian moves
    success: Venetian success
  - id: al
    name: Venice’s allies
    polities: [malta, papal-states, tuscany, france, savoy]
    ink: gold
    moves: Allied moves
    success: Allied success
  - id: ot
    name: Ottoman Empire
    polities: [ottoman]
    ink: teal
    moves: Ottoman moves
    success: Ottoman success
notes:
  - Dates are Gregorian. Morosini agreed the terms of surrender on 5–6 September 1669; the city was handed over on 27 September.
  - Casualty figures for the siege of Candia come mostly from Venetian and other Christian accounts and are uncertain. The war was also fought in Dalmatia, where Venice lost Novigrad in 1646 but in 1647–1648 retook it, beat off an Ottoman siege of Šibenik and took the fortress of Klis.
