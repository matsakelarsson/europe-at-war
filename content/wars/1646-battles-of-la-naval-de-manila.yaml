notes:
  - The account of the battles comes almost entirely from Spanish and Dominican sources written to celebrate them; the numbers of ships and dead are theirs. Spanish writers call the galleon commander Lorenzo de Orella y Ugalde or Lorenzo Ugalde de Orellana.
  - The image of Our Lady of the Rosary of La Naval was moved in 1954 to the new Santo Domingo Church in Quezon City; the old church in Intramuros was destroyed in the Second World War.
