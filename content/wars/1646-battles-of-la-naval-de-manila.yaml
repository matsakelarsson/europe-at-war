id: battles-of-la-naval-de-manila
name: Battles of La Naval de Manila
start: "1646-03-15"
end: "1646-10-04"
tier: C
summary: "Five sea battles fought in 1646 in Philippine waters between the Spanish and the Dutch East India Company (VOC), in the last years of the Eighty Years’ War. The VOC, which had taken the Spanish fort on Formosa (Taiwan) in 1642, sent two squadrons to blockade Manila, intercept the galleons from Acapulco and the junks from China, and win over the people of the coasts. Governor Diego Fajardo had only two old merchant galleons fit for war, the Encarnación and the Rosario, with a galley and a few brigantines, manned by Spanish and Filipino crews under Lorenzo Ugalde de Orellana and Sebastián López. On 15 March they fought four Dutch ships off Bolinao in Pangasinan. On 29 July, between Banton and Marinduque, they fought seven Dutch ships and sank a fire ship; on 31 July, between Mindoro and Maestre de Campo, a second fire ship was sunk and the Dutch withdrew. On 16 September the Encarnación fought three Dutch ships off Ambil and Lubang for four hours, and on 4 October, at the entrance of Manila Bay off Mariveles, the galleon and the galley drove off the last three. Dutch landings in Ilocos and Pangasinan and an attack on Zamboanga, where the Dutch were driven back from Caldera, also failed. Spanish accounts give about 15 Spanish dead in the five battles and about 500 Dutch. The crews had made a vow to Our Lady of the Rosary and walked barefoot to the church of Santo Domingo when they came home; on 9 April 1652 (1662 in some accounts) the cathedral chapter of Manila declared the victories miraculous, and La Naval is still celebrated on the second Sunday of October. The Peace of Münster ended the war between Spain and the Dutch Republic in 1648."
