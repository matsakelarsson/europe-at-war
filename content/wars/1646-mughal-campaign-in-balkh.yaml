id: mughal-campaign-in-balkh
name: Mughal campaign in Balkh
start: "1646-02"
end: "1647-10"
tier: C
summary: Shah Jahan’s attempt to win Balkh and Badakhshan, the land north of the Hindu Kush that his Timurid ancestors had once ruled. In 1645 the Uzbek khan of Bukhara, Nadr (Nazr) Muhammad, was overthrown by his son Abd al-Aziz and kept only Balkh. In February 1646 Shah Jahan sent an army of some 60,000 under his son Murad Bakhsh from Kabul across the mountains, nominally to help Nadr Muhammad; it occupied Badakhshan and Balkh, while Nadr Muhammad, distrusting the Mughals, fled to Persia. Murad soon left his post, and in 1647 Prince Aurangzeb took command. He defeated the Uzbek armies of Abd al-Aziz outside Balkh, but the Mughals could not hold a hostile and poor country against constant raids, and in the autumn of 1647 Aurangzeb withdrew, losing many men and animals in the snow of the Hindu Kush passes. Balkh was handed back to the Uzbeks. The campaign cost some 20 million rupees and weakened the Mughal frontier, which helped Persia take Kandahar in 1649.
