id: neapolitan-revolt
name: Neapolitan Revolt of 1647
start: "1647-07-07"
end: "1648-04-06"
tier: B
summary: A popular rising in Naples against Spanish rule and the taxes raised for Philip IV’s wars, first led by the young fisherman Masaniello. After his murder the revolt revived, and rebels proclaimed a Neapolitan Republic under French protection, led by the Duke of Guise; Spanish forces retook the city in April 1648.
