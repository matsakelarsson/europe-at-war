steps:
  - title: Masaniello and the Neapolitan Republic
    date: 1647–1648
    when: "1647-07-07"
    borders: "1648-04-06"
    countries: [it, es]
    body:
      - Naples, one of the largest cities in Europe, had been squeezed for decades to pay for Spain’s wars, and in 1647 the viceroy, the Duke of Arcos, put a new tax on fruit, the food of the poor. On 7 July a quarrel between fruit sellers and tax collectors in the market square turned into a riot. Led by Tommaso Aniello, called Masaniello, a 27-year-old fish seller, and advised by the old priest Giulio Genoino, crowds burned the tax offices and the houses of tax farmers, and Arcos took refuge in the castles. On 13 July he agreed to abolish the new taxes and pardon the rebels.
      - Masaniello, now ‘captain-general of the people’, began to behave erratically, and on 16 July he was killed by a band of armed men. In October a Spanish fleet under Don Juan José of Austria bombarded the city, which rose again, and on 22 October the gunsmith Gennaro Annese proclaimed a republic. Henry, Duke of Guise, who claimed descent from the Angevin kings of Naples, arrived in November to lead it. But the Spanish held the castles, and the barons controlled the provinces. On 6 April 1648, while Guise was outside the walls, Spanish troops entered the city with the help of rebels who had changed sides. Guise was captured, and Annese was executed in June.
