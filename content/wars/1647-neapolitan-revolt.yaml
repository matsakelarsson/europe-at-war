notes:
  - Dates are Gregorian. Sicily had risen first, in Palermo in May 1647, and the revolt in Naples spread to the provinces, where peasants rose against their barons.
  - The Kingdom of Naples stays a separate polity on the base map, ruled by Spanish viceroys. The rebel republic held only the city and parts of the countryside and is not drawn.
