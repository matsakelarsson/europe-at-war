id: fronde
name: The Fronde
start: "1648-08-26"
end: "1653"
tier: C
summary: A series of civil wars in France during the minority of Louis XIV, against the government of the Queen Regent, Anne of Austria, and her chief minister, Cardinal Mazarin, whose taxes for the war with Spain had become unbearable. When the government arrested leaders of the Parlement of Paris in August 1648, barricades went up in the streets; the court fled the capital in January 1649 and the Prince of Condé blockaded it until the Peace of Rueil in March. Mazarin then had Condé and other princes arrested, setting off the “Fronde of the princes”, in which Condé allied with Spain. Turenne, now fighting for the crown, met Condé at the Faubourg Saint-Antoine outside Paris on 2 July 1652, where the guns of the Bastille covered Condé’s retreat into the city. Louis XIV re-entered Paris in October 1652 and Mazarin returned in February 1653; Bordeaux, the last centre of revolt, surrendered in the summer of 1653. Condé fought for Spain until 1659, and the young king never forgot the humiliations of these years.
