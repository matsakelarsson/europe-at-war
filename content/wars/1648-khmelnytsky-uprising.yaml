notes:
  - Dates are New Style (Gregorian), as used in Poland–Lithuania. The Cossacks and Russia used the Julian calendar, ten days behind, so Ukrainian and Russian accounts often give dates ten days earlier.
  - Casualty figures for this war, above all for the killings of Jews, have been disputed for centuries. The text gives ranges where historians differ.
