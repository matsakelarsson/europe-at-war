id: khmelnytsky-uprising
name: Khmelnytsky Uprising
start: "1648"
end: "1657"
tier: A
summary: A Cossack rising led by Bohdan Khmelnytsky, allied at first with the Crimean Tatars, became a peasant war across Ukraine, with mass killings of Jews, Polish nobles and Catholic clergy and brutal reprisals. It created a Cossack state, the Hetmanate, which placed itself under the Russian tsar at Pereiaslav in 1654.
