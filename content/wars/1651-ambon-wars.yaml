notes:
  - The main contemporary accounts are Dutch, among them Livinus Bor’s Amboinse Oorlogen (1663), written in praise of De Vlaming, and the later Ambonsche Historie of Georg Everhard Rumphius, who lived in Ambon from 1653. No count of the dead or deported survives; historians describe Hoamoal as almost depopulated after 1656.
  - Earlier rounds of the same struggle include the war of the VOC against Hitu under Kakiali and Telukabessy (1641–1646); the fighting on Banda in 1609–1621 is a separate war.
