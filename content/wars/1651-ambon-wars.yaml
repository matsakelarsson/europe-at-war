id: ambon-wars
name: Ambon wars (Great Ambon War)
start: "1651"
end: "1656"
tier: C
summary: "The war in which the Dutch East India Company (VOC) completed its monopoly of cloves in the central Moluccas by crushing the Muslim communities of Hoamoal, the western peninsula of Seram, and their allies on the nearby islands. Hoamoal, the main clove-growing area outside Company control, was ruled for the sultan of Ternate by a governor (kimelaha), and Makassar (Gowa) traders bought its cloves in defiance of the Company. In 1650 a court faction in Ternate drove out Sultan Mandar Syah, whom the VOC restored; the kimelaha Majira sided with the rebels, and in 1651 the Hoamoal villages and allied communities on the neighbouring islands rose, killing Company soldiers and Christian Ambonese and attacking VOC posts. Arnold de Vlaming van Oudshoorn, sent from Batavia, fought them from 1651 to 1656. In 1652 he made Mandar Syah cede Ternate’s rights in Hoamoal and agree to the destruction of all clove trees outside Ambon and the Lease islands, in return for a yearly payment. Makassar sent fleets and troops to Hoamoal in 1653–1655. De Vlaming’s campaign of 1654–1655 destroyed villages, crops and clove groves; the stronghold of Asahudi fell in July 1655, and on 6 August 1655 his troops took a hill fort in the Kalike mountains, where the Ternatean prince Kaicili Saidi was captured and killed. Majira escaped to Makassar. The war ended in early 1656, when news reached Ambon of a peace between the VOC and Makassar. The surviving people of Hoamoal were moved to Ambon and its neighbouring islands, the peninsula was left almost empty, and clove growing was confined to Company-controlled Ambon and the Lease islands."
