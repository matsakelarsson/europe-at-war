id: first-anglo-dutch-war
name: First Anglo-Dutch War
start: "1652-05-19"
end: "1654-04-05"
tier: B
summary: A naval war between the Commonwealth of England and the Dutch Republic, caused mainly by trade rivalry and the English Navigation Act of 1651. The fleets fought a series of great battles in the Channel and the North Sea; after English victories at the Gabbard and Scheveningen, where the Dutch admiral Maarten Tromp was killed, and a costly blockade of the Dutch coast, the Treaty of Westminster of 1654 ended the war on terms that settled little.
countries: [gb, nl]
