    name: England
    polities: [england]
    ink: red
    moves: English moves
    success: English success
  - id: nl
    name: Dutch Republic
    polities: [dutch-republic]
    ink: orange
    moves: Dutch moves
    success: Dutch success
notes:
  - Dates are Old Style, as used in England. The Dutch used the Gregorian calendar, ten days ahead, so Dutch accounts date the battle of Scheveningen to 10 August 1653.
  - The war was fought almost entirely at sea; battle markers show the approximate area of each action. Fighting in the Mediterranean, where a Dutch squadron destroyed an English one off Livorno in March 1653, is left to the text.
