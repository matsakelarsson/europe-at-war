steps:
  - title: Dover to Dungeness
    date: 1651–1652
    when: "1652-05-19"
    borders: "1652-11-30"
    countries: [gb, nl]
    body:
      - The Dutch carried much of Europe’s seaborne trade, and the English resented it. In October 1651 the Commonwealth, victorious in the civil wars, passed a Navigation Act that barred goods from being brought to England in third countries’ ships, a blow aimed at the Dutch, and English warships and privateers began seizing Dutch merchantmen. England also demanded that foreign ships salute its flag in the seas around Britain. On 19 May 1652 Lieutenant-Admiral Maarten Tromp, at sea off Dover with a Dutch fleet, was slow to dip his flag, and Robert Blake opened fire. The fight began a war that neither government had quite decided on.
      - Dutch trade had to pass through the Channel or go the long way round Scotland, and both fleets fought for the sea lanes. In August Michiel de Ruyter beat off an English squadron near Plymouth and saw a convoy through. On 28 September Blake beat a divided Dutch fleet under Witte de With at the Kentish Knock, and the English, thinking the war as good as won, sent ships away to the Mediterranean. On 30 November Tromp, back in command, defeated Blake off Dungeness and held the Channel through the winter. Denmark, a Dutch ally, closed the Sound to English ships.
    facts:
      - [Navigation Act, "October 1651"]
      - [Battle of the Kentish Knock, "28 September 1652, English victory"]
      - [Battle of Dungeness, "30 November 1652, Dutch victory"]
    markers:
      - kind: naval
        name: Battle of Dover
        date: 19 May 1652
        text: Blake and Tromp fought until dark. The Dutch lost two ships, but historians disagree on who had the better of it.
        lonlat: [1.508, 51.274]
      - kind: naval
        side: nl
        name: Battle of Plymouth
        date: 16 August 1652
        text: De Ruyter, escorting a large outward-bound convoy, fought off Sir George Ayscue’s squadron and brought the merchant ships safely into the Atlantic.
        lonlat: [-4.21, 49.964]
      - kind: naval
        side: en
        name: Battle of the Kentish Knock
        date: 28 September 1652
        text: Fought near a shoal off the Thames estuary. Several Dutch captains held back, and the fleet withdrew after losing two ships.
        lonlat: [1.2, 51.5]
      - kind: naval
        side: nl
        name: Battle of Dungeness
        date: 30 November 1652
        text: Tromp, escorting a convoy with a much larger fleet, beat Blake, who lost several ships. The defeat led to reforms of the English navy.
        lonlat: [0.994, 50.998]
        lp: b
    arrows:
      - side: nl
        label: De Ruyter’s convoy
        via: [[3.4, 51.45], [1.5, 50.95], [-3.0, 49.9], [-5.8, 49.6]]
  - title: Portland, the Gabbard and Scheveningen
    date: 1653–1654
    when: "1653-02-18"
    borders: "1654-04-05"
    countries: [gb, nl]
    body:
      - In February 1653 Tromp was bringing a large homeward convoy up the Channel when Blake attacked it off Portland. In three days of running battle the Dutch lost a number of warships and dozens of merchant ships, but saved most of the convoy. In June the English fleet under George Monck and Richard Deane, joined later by Blake, won a clear victory off the Gabbard shoal, helped by its heavier ships and new instructions to fight in a line. The English then blockaded the Dutch coast. Trade almost stopped, ships lay idle in the harbours, and there was hunger and unrest in the Dutch towns.
      - On 31 July Tromp came out to break the blockade, and the fleets met off Scheveningen. Tromp was killed by a musket ball early in the battle, and the Dutch lost heavily, but the battered English fleet withdrew to refit and the blockade was lifted. Both sides were exhausted, and Oliver Cromwell, Lord Protector from December 1653, wanted peace with a fellow Protestant republic. By the Treaty of Westminster of 5 April 1654 the Dutch agreed to salute the English flag and to pay compensation, and in a secret annex the province of Holland undertook never to appoint the young William III of Orange, nephew of the exiled Charles II, as its stadtholder.
    facts:
      - [Battle of Portland, "18–20 February 1653"]
      - [Battle of the Gabbard, "2–3 June 1653, English victory"]
      - [Treaty of Westminster, "5 April 1654"]
    markers:
      - kind: naval
        side: en
        name: Battle of Portland
        date: 18–20 February 1653
        text: The Three Days’ Battle, fought along the Channel from Portland towards Cap Gris-Nez. Both sides claimed victory, but the English took or sank many more ships.
        lonlat: [-2.5, 50.4]
      - kind: naval
        side: en
        name: Battle of the Gabbard
        date: 2–3 June 1653
        text: Off the Suffolk coast, the English fleet in line of battle beat Tromp’s fleet, and Blake’s arrival on the second day turned defeat into a rout. Deane was killed.
        lonlat: [1.75, 51.95]
      - kind: naval
        side: en
        name: Battle of Scheveningen
        date: 31 July 1653
        text: Also called the battle of Ter Heijde. The death of Tromp, the most famous Dutch admiral of his day, ended the battle.
        lonlat: [4.17, 52.07]
      - kind: treaty
        name: Westminster
        date: 5 April 1654
        text: The treaty restored peace but left the trade disputes unresolved. They led to a second war in 1665.
        lonlat: [-0.125, 51.499]
    arrows:
      - side: nl
        label: Tromp
        phase: 1
