steps:
  - title: Khabarov and Stepanov on the Amur
    date: 1652–1658
    when: "1652"
    borders: "1655-01-01"
    countries: [ru, cn, kr]
    body:
      - In 1649–1650 the Yakutsk promyshlennik Yerofey Khabarov led a band of Cossacks and hunters over the mountains to the Amur, where the Daur and Ducher peoples farmed and paid tribute to the Manchus. He took the Daur stronghold of Albazin in 1651, sailed down the river taking hostages and fur tribute, and wintered at Achansk in the country of the Nanai. Early in the spring of 1652 a force from the Qing base at Ninguta, about 600 Manchu soldiers with some 1,500 Daurs and Duchers, attacked the fort and was driven off with heavy losses; its commander, Haise, was executed for the failure. Khabarov left Achansk when the ice broke and withdrew upriver.
      - Khabarov was recalled to Moscow in 1653, and Onufriy Stepanov led the 400–500 men who stayed. In 1654, sailing up the Sungari in search of grain, they met a Qing army under Sarhuda with a contingent of Korean musketeers sent by Joseon under Byeon Geup, and were driven back. In March 1655 a Qing army of about 1,000 bannermen with 15 guns and several thousand Daur and Ducher auxiliaries, under Minggadari, besieged Stepanov at Kumarsk, a fort on an island at the mouth of the Kumara river; after three weeks and a failed assault they withdrew, short of food. The Qing then moved the Daurs and Duchers south, away from the river, leaving the Cossacks nothing to take.
      - In 1658 Sarhuda came down the Sungari again with some forty boats and about 1,400 men, among them 260 Korean musketeers under Shin Ryu. On 10 July they caught Stepanov’s eleven boats on the Amur below the mouth of the Sungari. Stepanov and more than two hundred of his men were killed, and only one boat got away. For a few years there were no Russians on the middle Amur.
    facts:
      - [Attack on Achansk, "spring 1652"]
      - [Battle on the Sungari, "1654"]
      - [Siege of Kumarsk, "March–April 1655"]
