id: sino-russian-border-conflicts
name: Sino-Russian border conflicts
start: "1652"
end: "1689-09-06"
tier: B
summary: "Intermittent fighting between Russian Cossack bands and the Qing empire over the Amur valley, ending with the Treaty of Nerchinsk. From 1650 Yerofey Khabarov and his successor Onufriy Stepanov raided the Daur and Ducher peoples along the Amur for fur tribute and grain. The Qing, who counted these peoples as their tributaries, attacked Khabarov’s winter fort at Achansk in 1652, fought Stepanov on the Sungari in 1654 with the help of Korean musketeers, besieged him at Kumarsk in 1655 and destroyed his flotilla in 1658. The Russians returned in 1665, when a band of fugitives settled at Albazin, which became the centre of Russian farming and tribute-taking on the upper Amur. After crushing the Revolt of the Three Feudatories, the Kangxi emperor built forts at Aigun and besieged Albazin twice, taking it in 1685 and starving its rebuilt fort in 1686. The Treaty of Nerchinsk (6 September 1689), the first between China and a European state, set the border on the Argun river and the Stanovoy watershed; Russia gave up the Amur and gained the right to trade."
countries: [ru, cn]
sides:
  - id: qing
    name: Qing China, with Daur and Ducher allies and Korean musketeers
    polities: [qing]
    ink: gold
    moves: Qing moves
    success: Qing success
  - id: rus
    name: Russia (the Cossacks of the Amur)
    polities: [russia]
    ink: green
    moves: Russian moves
    success: Russian success
notes:
  - Russian documents of the 17th century use the Julian calendar, ten days behind the Gregorian; Qing and Korean records use the lunar calendar. The sources therefore give different dates for the same events (the 1654 battle on the Sungari is dated anywhere from April to July). The treaty is dated 27 August 1689 in the Julian calendar, 6 September in the Gregorian.
  - The site of Khabarov’s fort at Achansk is disputed; the most widely accepted view places it at the Nanai village of Odzhal, renamed Achan in 1977. The 1654 battle site on the Sungari is not known exactly.
  - The Russian advance across Siberia that brought the Cossacks to the Amur is told in the Russian conquest of eastern Siberia (1607–1689).
