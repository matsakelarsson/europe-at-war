  - title: Albazin
    date: 1665–1687
    when: "1685-06"
    borders: "1685-06-26"
    countries: [ru, cn]
    view:
      center: [126.0, 52.0]
      size: [900, 700]
    body:
      - In 1665 Nikifor Chernigovsky, a Polish exile who had killed the voivode of Ilimsk, fled with his band to the Amur and rebuilt the fort at Albazin. Moscow pardoned him in 1672 and made Albazin the seat of its own voivode in 1682. Peasants settled around it, and its Cossacks took tribute from the peoples of the Zeya and the Bureya. Peking protested for years. Once the Three Feudatories were defeated, the Kangxi emperor turned north. In 1683 his general Sabsu built forts at Aigun on the Amur, and Qing troops cleared the Russian posts on the Zeya and the lower river.
      - In June 1685 an army of about 3,000 men with siege guns, under Pengchun and Langtan, came up the Amur to Albazin, held by about 450 men under Alexei Tolbuzin. After a day’s bombardment, as the besiegers piled brushwood against the wooden walls, Tolbuzin surrendered. The garrison was allowed to leave for Nerchinsk; about 45 men chose to stay and were taken to Beijing, where they formed a company of the Bordered Yellow Banner, the origin of the city’s small Russian Orthodox community. The Qing burned the fort but left the fields standing.
      - Tolbuzin came back within weeks, brought in the harvest and, with the Prussian officer Afanasy Beiton, built a stronger fort of earth and timber. Langtan returned in July 1686 with about 3,000 men. Tolbuzin was killed by a cannon shot early in the siege, and Beiton held out through the autumn, while scurvy and hunger reduced some 800 defenders to little more than a hundred, and by some accounts a few dozen. When Russian envoys reached Beijing proposing talks, the emperor called off the siege in December 1686, and the Qing army withdrew in 1687.
