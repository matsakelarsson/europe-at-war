  - title: The Treaty of Nerchinsk
    date: 1686–1689
    when: "1689-09-06"
    borders: "1689-09-06"
    countries: [ru, cn]
    body:
      - In 1686 Moscow sent Fyodor Golovin east with an escort of streltsy and Cossacks to negotiate a frontier. His journey took three years; while he waited in Transbaikalia, the Dzungar ruler Galdan invaded the lands of the Khalkha Mongols in 1688, which made the Qing more willing to settle with Russia. The talks were held outside Nerchinsk in August and September 1689. The Qing envoys, Songgotu and Tong Guogang, came with an army and a river fleet, put at anything from 3,000 to 15,000 men, against a Russian garrison and escort of a few thousand at most. The Jesuits Jean-François Gerbillon and Thomas Pereira interpreted for the Qing, and the negotiations were conducted in Latin.
      - The treaty was signed on 6 September 1689 (27 August in the Russian calendar). The border ran up the Argun river, then from the Shilka along the little Gorbitsa river and the crest of the Stanovoy mountains to the Sea of Okhotsk; the land between the Uda river and the mountains was left undecided. Russia agreed to destroy Albazin and gave up the whole Amur basin, and subjects of both states with passports could cross the border to trade. The Latin text was authoritative, with Russian and Manchu versions; boundary stones were later inscribed in five languages. The treaty kept the peace on this frontier for 170 years, until Russia annexed the left bank of the Amur by the treaties of Aigun (1858) and Peking (1860).
    facts:
      - [Treaty of Nerchinsk, "6 September 1689"]
      - [Negotiators, "Fyodor Golovin; Songgotu and Tong Guogang"]
      - [Border, "the Argun, the Gorbitsa and the Stanovoy watershed"]
    markers:
