id: swiss-peasant-war
name: Swiss Peasant War
start: "1653-02"
end: "1653-09"
tier: C
summary: A rising of the rural subjects of Lucerne, Bern, Solothurn and Basel against their city governments, set off when the end of the Thirty Years’ War brought falling grain prices and Bern, Fribourg and Solothurn devalued their coins in December 1652. It began in February 1653 in the Entlebuch valley of Lucerne and spread to the Emmental and beyond, and on 14 May peasants from all four territories swore a league at Huttwil under Niklaus Leuenberger of Bern, demanding the right to hold their own assemblies. Peasant armies blockaded Bern and Lucerne, and Bern made terms at Murifeld on 28 May, but the Confederation’s army under Konrad Werdmüller beat the rebels at Wohlenschwil on 3 June and Bernese troops crushed them at Herzogenbuchsee on 8 June. Bern then repudiated its treaty. Leaders were executed, including Christian Schybi of the Entlebuch and Leuenberger, beheaded in Bern on 6 September, and many others were sent to the galleys or banished.
