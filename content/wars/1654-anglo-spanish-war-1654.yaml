id: anglo-spanish-war-1654
name: Anglo-Spanish War of 1654–1660
start: "1654-12"
end: "1660"
tier: C
summary: A war between Oliver Cromwell’s Protectorate and Spain, begun with the “Western Design” against Spain’s Caribbean empire. An expedition was beaten off at Santo Domingo in April 1655 but took Jamaica in May. At sea Robert Blake’s fleet blockaded Cádiz, captured part of a silver fleet in 1656 and destroyed the Spanish fleet sheltering at Santa Cruz de Tenerife on 20 April 1657, though its silver had already been landed. Allied with France from March 1657, English troops helped Turenne beat the Spanish army and its French and English Royalist allies, led by Condé and the future James II, at the Battle of the Dunes on 14 June 1658, and Dunkirk, which surrendered soon afterwards, was handed to England. The fighting stopped after the Restoration of Charles II in 1660, and treaties signed at Madrid in 1667 and 1670 formally ended the war. England kept Jamaica; Charles II sold Dunkirk to France in 1662.
