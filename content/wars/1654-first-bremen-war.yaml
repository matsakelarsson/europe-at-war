    body:
      - The city of Bremen insisted it was a free imperial city, not part of Swedish Bremen-Verden. In 1654 Swedish troops under Königsmarck occupied part of the city’s lands without attacking the town itself.
      - "In the First Stade Recess of 28 November 1654, Bremen pledged allegiance to the Swedish king while keeping its walls, and Sweden kept the districts it had seized. That king was new: Queen Christina had given up the throne at Uppsala on 6 June 1654 in favour of her cousin, Charles X Gustav."
