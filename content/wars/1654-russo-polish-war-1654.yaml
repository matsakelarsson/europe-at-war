steps:
  - title: The tsar invades
    date: 1654–1656
    when: "1654"
    borders: "1655-08-08"
    countries: [ru, by, lt, pl, ua]
    body:
      - Having taken the Cossack Hetmanate under his protection at Pereiaslav, Tsar Alexis went to war with Poland–Lithuania in 1654. Russian armies, joined by Cossacks under Ivan Zolotarenko, poured into the Grand Duchy of Lithuania. They beat Janusz Radziwiłł at Shepeleviche in August, and Smolensk, lost to Lithuania in 1611, surrendered that autumn after a long siege. Polotsk, Vitebsk and Mogilev fell too.
      - In 1655 the invaders took Minsk, and on 8 August Vilnius, the capital, fell for the first time in its history. For days soldiers and Cossacks looted the city and killed its people, and the Jewish quarter was burned; an eyewitness’s figures of a 17-day fire and over 20,000 dead are thought exaggerated. Alexis styled himself Grand Duke of Lithuania. When Sweden overran the rest of the Commonwealth that summer, Russia came to see it as the greater threat, and in November 1656 the two sides agreed a truce near Vilnius.
    facts:
      - [Vilnius taken, "8 August 1655 (29 July Old Style)"]
      - [Truce of Vilnius, "November 1656, against Sweden"]
    markers:
      - kind: battle
        side: ru
        name: Battle of Shepeleviche
        date: August 1654
        text: Janusz Radziwiłł’s Lithuanian army was routed, leaving eastern Lithuania open.
        lonlat: [29.56, 54.13]
      - kind: siege
        side: ru
        name: Smolensk
        date: July – autumn 1654
        text: The fortress surrendered to the tsar after a siege of more than two months. It never returned to Poland–Lithuania.
        lonlat: [32.05, 54.78]
      - kind: taken
        side: ru
        name: Vilnius
        date: 8 August 1655
        text: Russian troops and Cossacks under Yakov Cherkassky and Ivan Zolotarenko took the capital and sacked it. Russian forces held it until 1661.
        lonlat: [25.29, 54.69]
    arrows:
      - side: ru
        label: Alexis
        phase: 1
        via: [[34.3, 55.2], [33.3, 54.95], [32.15, 54.8]]
      - side: ru
        label: Cherkassky and Zolotarenko
        phase: 2
        via: [[27.56, 53.9], [26.5, 54.3], [25.4, 54.66]]
    areas:
      - style: occupied
        side: ru
