notes:
  - Dates are New Style (Gregorian), as used in Poland–Lithuania. Russian sources, in the Julian calendar, give dates ten days earlier.
  - The Cossacks fought on Russia’s side until 1658, then split, some hetmans siding with Poland and others with Russia.
