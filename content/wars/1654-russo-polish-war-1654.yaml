        atoms: [RU-SMO, BY-VI, BY-MA, BY-HO, BY-MI, BY-HM, BY-HR, LT-VL, LT-UT, LT-AL, LT-KU]
  - title: The tide turns
    date: 1658–1661
    when: "1658"
    borders: "1661"
    countries: [ua, by, lt, pl, ru]
    body:
      - War resumed in 1658. That September Hetman Ivan Vyhovsky signed the Treaty of Hadiach, which was to make the Cossack lands a third member of the Commonwealth, and in 1659 his Cossacks and their Tatar allies inflicted a heavy defeat on a Russian army at Konotop. The Hetmanate soon split again, but the Commonwealth, at peace with Sweden from May 1660, could now turn east.
      - On 27 June 1660 Stefan Czarniecki and Paweł Sapieha crushed Ivan Khovansky’s army at Polonka in Lithuania. In Ukraine Stanisław Potocki and Jerzy Lubomirski, with Tatar help, surrounded Vasily Sheremetev’s army at Chudniv; the Cossacks of Yurii Khmelnytsky changed sides, and Sheremetev surrendered in early November. In December 1661 the Russian garrison in Vilnius castle gave up after a long siege.
    facts:
      - [Polonka, "27 June 1660, Polish–Lithuanian victory"]
      - [Chudniv, "September – November 1660, Russian army surrendered"]
    markers:
      - kind: battle
        side: zc
        name: Battle of Konotop
        date: Summer 1659
        text: Vyhovsky’s Cossacks and the Crimean Tatars routed a Russian army besieging Konotop.
        lonlat: [33.16, 51.22]
      - kind: battle
        side: pl
        name: Battle of Polonka
        date: 27 June 1660
        text: Czarniecki and Sapieha destroyed Khovansky’s army, ending the Russian threat to central Lithuania.
        lonlat: [25.71, 53.15]
      - kind: battle
        side: pl
        name: Battle of Chudniv
        date: September – November 1660
        text: Sheremetev’s army, abandoned by its Cossack allies, surrendered. He spent more than twenty years in Tatar captivity.
        lonlat: [28.18, 50.06]
      - kind: taken
        side: pl
        name: Vilnius castle
        date: December 1661
        text: The starving Russian garrison surrendered. Its commander, Danila Myshetsky, was tried and executed.
        lonlat: [25.29, 54.69]
    arrows:
      - side: ru
        label: Sheremetev
        via: [[30.5, 50.45], [29.4, 50.25], [28.3, 50.08]]
  - title: The Truce of Andrusovo
    date: 1662–1667
    when: "1662"
    borders: "1667-02-09"
    countries: [ru, pl, lt, ua, by]
    body:
      - Neither side could finish the war. John II Casimir led an army across the Dnieper in the winter of 1663–1664 but failed before Hlukhiv and had to retreat with heavy losses. Ukraine was now split between rival hetmans on the two banks of the Dnieper, a time Ukrainians call the Ruin, and in 1665–1666 the Commonwealth was paralysed by Jerzy Lubomirski’s rebellion against the king.
      - At the village of Andrusovo near Smolensk the two sides signed a truce for thirteen and a half years in January 1667. Russia kept Smolensk and the Chernihiv–Seversk lands and gained Ukraine east of the Dnieper, while the Commonwealth kept the right bank and got back Vitebsk, Polotsk and Daugavpils. Kyiv, on the right bank, was to stay Russian for two years only, but it was never returned, and the Eternal Peace of 1686 made the settlement permanent.
    facts:
      - [Truce of Andrusovo, "30 January 1667 Old Style (9 February New Style)"]
      - [Ceded to Russia, "Smolensk, Chernihiv–Seversk lands, left-bank Ukraine, Kyiv"]
    markers:
      - kind: held
        side: ru
        name: Hlukhiv
        date: January – February 1664
        text: The town held out against the king’s army, which retreated through the winter.
        lonlat: [33.92, 51.68]
      - kind: treaty
        side: ru
        name: Truce of Andrusovo
        date: January 1667
        text: Signed in a village south-west of Smolensk after months of talks. The border it drew lasted until the partitions of Poland.
        lonlat: [31.51, 54.30]
    areas:
      - style: gained
        side: ru
        label: Gained by Russia
        atoms: [RU-SMO, UA-74, UA-53, UA-30]
