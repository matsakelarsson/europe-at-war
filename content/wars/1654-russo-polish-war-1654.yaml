id: russo-polish-war-1654
name: Russo-Polish War, 1654–1667
start: "1654"
end: "1667"
tier: B
summary: After the Cossack Hetmanate accepted the tsar’s protection, Russia invaded Poland–Lithuania, took Smolensk and Vilnius and occupied much of the Grand Duchy. The Commonwealth fought back from 1658, but at Andrusovo in 1667 it gave up Smolensk, Kyiv and Ukraine east of the Dnieper.
