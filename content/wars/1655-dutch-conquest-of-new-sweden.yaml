steps:
  - title: Fort Casimir and Fort Trinity
    date: 1651 – May 1654
    when: "1654-05"
    borders: "1654-06-01"
    countries: [us]
    view:
      center: [-75.38, 39.76]
      size: [90, 70]
    body:
      - New Sweden was small. Under Governor Johan Printz (1643–1653) its colonists, mostly Swedes and Finns with some Dutch and Germans, built Fort Nya Elfsborg on the east bank to control shipping, and Printz built his house at Fort Nya Göteborg on Tinicum Island. The Swedes bought land from the Lenape, who later said that they had sold far less than the colonists took, and traded cloth, metal goods and guns to the Susquehannock for beaver; they also helped the Susquehannock against Maryland. New Netherland had never given up its claim to the river. In 1651 Peter Stuyvesant came to the river with soldiers and ships, bought land from Lenape sachems and built Fort Casimir at what is now New Castle, a few miles below Fort Christina, so that ships bound for the Swedish forts had to pass Dutch guns.
      - Printz left for Sweden in 1653, and the colony waited years for help. In May 1654 the ship Örn brought some 250 new colonists and Johan Risingh, the new commissioner, who on Trinity Sunday landed soldiers at Fort Casimir and demanded its surrender. Its small garrison had no powder and gave up without firing a shot; Risingh renamed it Fort Trinity (Trefaldighet). In June he renewed the Swedish alliance with the Lenape sachems.
