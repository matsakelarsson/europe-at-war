  - title: Stuyvesant takes New Sweden
    date: September 1655
    when: "1655-09"
    borders: "1655-09-15"
    countries: [us]
    view:
      center: [-75.40, 39.75]
      size: [90, 70]
    body:
      - The West India Company ordered Stuyvesant to drive the Swedes from the river. Stuyvesant sailed from New Amsterdam with seven ships, among them the Amsterdam warship De Waag, and 317 soldiers. Fort Trinity, outnumbered and outgunned, was surrendered by its commander, Sven Skute, on 11 September. Stuyvesant then landed at Fort Christina, where Risingh had only a few dozen men, and surrounded it with batteries; the Dutch soldiers plundered the farms and killed the cattle around it. On 15 September Risingh signed the surrender. Swedes and Finns who wished could stay and keep their property and Lutheran faith; Risingh and some others were shipped home.
      - The same morning about five hundred Munsee in sixty-four canoes landed at New Amsterdam, left almost undefended. After a day of searching houses and talks with the council they agreed to leave, but in the evening a colonist was wounded by an arrow and the guard opened fire. In the raids that followed on Pavonia and Staten Island, the Peach War, some forty colonists were killed and about a hundred taken captive, and Stuyvesant hurried back to ransom them.
      - The Delaware became part of New Netherland. Fort Christina was renamed Fort Altena, and in 1656 the West India Company sold Fort Casimir and the land around it to the city of Amsterdam, which settled colonists there as New Amstel. The Swedish and Finnish colonists kept their own courts and militia, as they did again after the English took New Netherland in 1664.
