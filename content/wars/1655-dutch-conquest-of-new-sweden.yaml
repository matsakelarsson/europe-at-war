id: dutch-conquest-of-new-sweden
name: Dutch conquest of New Sweden
start: "1655-09"
end: "1655-09-15"
tier: B
summary: "The seizure of the Swedish colony on the Delaware River by New Netherland in 1655. New Sweden, founded at Fort Christina (Wilmington) in 1638 on land the Dutch claimed, traded for furs with the Lenape and the Susquehannock, and its few hundred Swedish and Finnish colonists farmed both banks of the river. In 1651 Peter Stuyvesant built Fort Casimir (New Castle) a few miles below Fort Christina to cut off its trade; in May 1654 the new Swedish governor, Johan Risingh, took it without a fight and renamed it Fort Trinity. On orders from the West India Company, Stuyvesant sailed from New Amsterdam in 1655 with seven ships and 317 soldiers. Fort Trinity surrendered on 11 September, and Fort Christina, besieged and short of men and powder, on 15 September; no one was killed in the fighting. The same day hundreds of Munsee entered New Amsterdam, leading to the Peach War. New Sweden became part of New Netherland, but its colonists kept their lands, church, courts and militia, and Swedish Lutheran congregations survived on the Delaware for more than a century. It was a conflict between the two trading companies, not between the Dutch Republic and Sweden, which were not at war."
countries: [us]
