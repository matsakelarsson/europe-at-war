notes:
  - Sweden used the Julian calendar (Old Style) and New Netherland the Gregorian, so Swedish dates are ten days earlier than Dutch ones; dates here are Gregorian. Fort Casimir was taken on Trinity Sunday, 21 May 1654 by the Swedish calendar, 31 May by the Dutch.
  - The main sources are Risingh’s journal and reports and Dutch official papers. The Lenape and the Susquehannock (whom the Swedes and Dutch called the Minquas) traded with both colonies and were courted by both; whether the Susquehannock had a hand in the Munsee entry into New Amsterdam on 15 September 1655 is debated.
