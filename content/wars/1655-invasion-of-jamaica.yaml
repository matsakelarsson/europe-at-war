notes:
  - "England kept the Julian calendar (Old Style), ten days behind the Gregorian calendar used by Spain: the English landed on Jamaica on 10 May 1655 by their own reckoning, 20 May by the Spanish. English dates in this story are Old Style unless stated otherwise."
  - "The numbers in the English expedition vary by source because some counts include sailors; Spanish and English accounts of the fighting on Hispaniola disagree on the size of the defending force."
  - The wider war between England and Spain, including the battles at Cádiz and Santa Cruz de Tenerife and the Battle of the Dunes, is told in the Anglo-Spanish War (1654–1660).
