steps:
  - title: The defeat at Santo Domingo
    date: "April 1655"
    when: "1655-04"
    borders: "1655-04-25"
    countries: [do, gb]
    body:
      - "Cromwell, at peace with the Dutch and looking for employment for his army and revenue for his treasury, was persuaded that Spain’s Caribbean colonies were weakly held and that a Protestant blow there would serve both God and trade. Penn’s fleet of some 38 ships left Portsmouth late in 1654 with about 2,500 soldiers, many of them raw recruits, and in Barbados, Montserrat, Nevis and Saint Kitts the commanders raised 3,000 to 4,000 more from indentured servants and freemen. Penn and Venables quarrelled, and supplies, arms and discipline were short."
      - "Santo Domingo had been warned. Rather than land close to the city, Venables put the army ashore at the mouth of the Nizao river on 13–14 April 1655 (Old Style), some 50 km to the west, with scarcely any water. After days of marching in the heat through forest, the vanguard was ambushed near the city walls by Spanish lancers, mostly local militia and cattle hunters, sent by Governor Bernardino de Meneses, Count of Peñalba; a second advance a week later met the same fate. Some 600 English soldiers were killed and 400 wounded or captured, many of them men who broke and fled. Spanish tradition says the night-time noise of the land crabs on the beach at Haina alarmed the English, and the city later paraded a golden crab in thanks. The army re-embarked at the end of April."
    facts:
      - [English landing at the Nizao, "13–14 April 1655 (Old Style)"]
      - [English losses, "about 600 killed, 400 wounded or captured"]
      - [Spanish defenders in the ambush, "about 300 militia"]
