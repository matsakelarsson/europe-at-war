  - title: The capture of Jamaica
    date: "May 1655"
    when: "1655-05"
    borders: "1655-05-20"
    countries: [jm, gb]
    body:
      - "To salvage something from the expedition, Penn and Venables sailed west to Jamaica, a neglected Spanish colony of a few thousand people, many of them enslaved Africans, ruled from Santiago de la Vega, now Spanish Town. The Taíno who had lived there were almost gone. On 10 May 1655 (Old Style) the fleet entered the shallow bay at Caguaya, where the Passage Fort stood, silenced the small Spanish battery and put the army ashore, and the next day the English marched into Santiago de la Vega, which the colonists had abandoned."
      - "Governor Juan Ramírez de Arellano agreed on 17 May (Old Style) to terms that required the Spanish colonists to leave the island, but many withdrew to the north coast and the hills instead, sending their families to Cuba. Before they went, many of them freed the Africans they held in slavery, who fled to the mountains and formed free communities; the largest, under Juan de Bolas, lay at Lluidas Vale in the centre of the island, and another, under Juan de Serras, at Los Vermejales. Penn and Venables sailed for England separately, each to blame the other, and Cromwell sent both to the Tower of London. The army left behind, unpaid and short of food, was dying of dysentery and fever: within a year thousands of the some 7,000 men who had landed were dead."
    facts:
      - [English land at Caguaya, "10 May 1655 (Old Style)"]
      - [Ramírez agrees to capitulate, "17 May 1655 (Old Style)"]
      - [English soldiers dead within a year, "thousands of some 7,000"]
    markers:
      - kind: taken
        side: eng
        name: Santiago de la Vega (Spanish Town)
        date: "May 1655"
