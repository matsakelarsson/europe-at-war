  - title: Guerrilla war, Ocho Rios and Rio Nuevo
    date: "1655–1660"
    when: "1658"
    borders: "1658-06-27"
    countries: [jm, cu, gb]
    body:
      - "From the north coast and the hills Francisco de Proenza, and after him Cristóbal Arnaldo de Ysassi, whom the Crown named governor, waged a guerrilla war with a few hundred Spaniards and the maroons of Juan de Bolas and Juan de Serras, ambushing English soldiers who strayed from their camps and hoping for help from Cuba. The English governors Robert Sedgwick and William Brayne died within months of arriving, and Edward D’Oyley, a veteran of the invasion, took command."
      - "In 1657 Ysassi gathered nearly 300 soldiers from Cuba and about 100 guerrillas at Las Chorreras, now Ocho Rios. D’Oyley sailed round the island with some 900 men, landed nearby and scattered them in late October. In May 1658 a larger force of 467 soldiers with their officers, recruited in New Spain, landed at the mouth of the Rio Nuevo and dug in. D’Oyley arrived by sea with 700 men in June, seized their transports, bombarded their redoubt for two days and broke it; the Spaniards lost over 300 killed and wounded and 150 prisoners, the English about 60. It was the largest battle ever fought in Jamaica."
      - "D’Oyley then persuaded Juan de Bolas to change sides in return for freedom and land for his people, and de Bolas’s men led the English to the Spanish camps. In May 1660 Ysassi and his last followers left by canoe for Cuba. Juan de Bolas became colonel of a Black militia and hunted the maroons who refused terms; he was killed in an ambush in 1664, perhaps by de Serras’s people, who stayed free in the mountains and whose descendants are thought to have joined the maroons who fought Britain in the 1720s and 1730s. Buccaneers based at Port Royal now raided the Spanish Main, and Spain recognised English rule in Jamaica in the Treaty of Madrid in 1670."
    facts:
      - [Battle of Ocho Rios (Las Chorreras), "late October 1657"]
      - [Battle of Rio Nuevo, "June 1658"]
      - [Ysassi leaves for Cuba, "May 1660"]
      - [Treaty of Madrid, "1670"]
