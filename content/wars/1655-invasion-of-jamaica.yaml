id: invasion-of-jamaica
name: Western Design and the conquest of Jamaica
start: "1655-04"
end: "1660-05"
tier: B
summary: "Oliver Cromwell’s attack on Spain’s Caribbean empire, the Western Design, and the five-year war for Jamaica that followed. A fleet under Admiral William Penn and an army under General Robert Venables, swelled in Barbados and the Leeward Islands to some 7,000 to 8,000 poorly trained men, landed on Hispaniola in April 1655 to take Santo Domingo, but the army was routed by a few hundred Spanish militia lancers and lost about a thousand men. Unwilling to return empty-handed, the commanders sailed for lightly defended Jamaica, where they landed in May 1655 and forced Governor Juan Ramírez de Arellano to capitulate. The Spanish colonists had freed many of the people they held in slavery, who formed free communities in the mountains, and under Francisco de Proenza and then Cristóbal Arnaldo de Ysassi the Spanish fought a guerrilla war alongside these maroons, led by Juan de Bolas and Juan de Serras. Disease killed most of the English troops, but Edward D’Oyley defeated Spanish landings from Cuba at Ocho Rios in 1657 and Rio Nuevo in 1658, and in 1660 won over Juan de Bolas, after which Ysassi left the island. Spain recognised English rule in Jamaica in the Treaty of Madrid of 1670."
countries: [jm, do, cu, gb, es]
sides:
  - id: eng
    name: England (the Commonwealth and Protectorate of Oliver Cromwell)
    polities: [england, british-west-indies]
