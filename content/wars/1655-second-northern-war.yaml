      - kind: held
        side: foe
        name: Jasna Góra
        date: 18 November – 27 December 1655
        lonlat:
          - 19.1006
          - 50.8088
        lp: l
        text: Monks and a small garrison under Prior Augustyn Kordecki beat off a month-long Swedish siege, the only Polish stronghold the invaders failed to take.
      - kind: held
