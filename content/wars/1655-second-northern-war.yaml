  - title: Norway and Bornholm fight back
    date: 1658 – 1660
    when: "1658"
    borders: "1658"
    countries:
      - se
      - dk
      - no
    view:
      center:
        - 11.5009
        - 59.4554
      size:
        - 643
        - 1134
    body:
      - "Swedish rule over the newly ceded lands began to crumble once the war restarted. The Norwegian commander Jørgen Bjelke marched on Trondheim and won it back in 1658. On Bornholm the islanders rose on 8–9 December 1658: the Swedish commandant Johan Printzensköld was shot in Rønne and his garrison gave up."
      - Further south, the Norwegian border town of Halden beat off Swedish attacks in 1658, 1659 and 1660.
    facts:
      - - Norwegian name
        - Bjelkefeiden
      - - Halden attacked
        - 1658, 1659 and 1660
