  - title: The allies close in
    date: 1658 – 1659
    when: "1658"
    borders: "1658"
    countries:
      - se
      - dk
      - no
      - pl
      - de
    view:
      center:
        - 11.6075
        - 55.0222
      size:
        - 519
        - 545
    body:
      - An allied army of about 30,000 Brandenburg, Imperial and Polish troops marched into Jutland in late 1658 and stormed the island of Als. By 1659 all of Jutland was in allied hands, and Imperial troops besieged Stettin in the autumn.
      - After a failed landing in June, the allies crossed to Funen in November 1659. On 14 November they crushed the Swedish army at Nyborg, with Dutch ships under Michiel de Ruyter in support. The Swedes lost Funen and were left holding Zealand.
    facts:
      - - Allied army
        - 14,500 Brandenburg, 10,600 Imperial, 5,000 Polish
      - - Last major battle
        - Nyborg, 14 November 1659
