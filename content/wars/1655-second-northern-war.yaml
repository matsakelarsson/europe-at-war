        - 53.332
      size:
        - 1331
        - 1130
    body:
      - Charles X Gustav allied with George II Rákóczi of Transylvania, whose army of about 25,000 invaded Poland in January 1657 and even took Warsaw in June. The campaign then fell apart and Rákóczi had to surrender. Austria joined Poland, and Brandenburg switched sides in return for full sovereignty over Ducal Prussia.
      - Denmark declared war in June 1657, hoping to win back its losses. Charles welcomed the chance to leave Poland. He marched his army across Germany into Holstein and Jutland, and in late October his troops stormed the fortress of Frederiksodde.
    facts:
      - - New enemies
        - Denmark–Norway, Austria, Brandenburg
      - - Ally
        - George II Rákóczi of Transylvania
