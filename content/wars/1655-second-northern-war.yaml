        date: 5 February 1658
        lonlat:
          - 10.7815
          - 54.9509
        lp: l
        text: The king and the cavalry crossed from Langeland to Lolland, with the infantry and guns following the next day.
      - kind: event
        side: se
        name: Onto Zealand
        date: February 1658
        lonlat:
          - 11.9096
          - 55.0089
        text: From Falster the army reached Zealand and turned north toward Copenhagen.
      - kind: treaty
