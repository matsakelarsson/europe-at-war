      - kind: battle
        side: se
        name: Battle of Warsaw
        date: 28–30 July 1656
        lonlat:
          - 21.0112
          - 52.2296
        text: A three-day battle in which Swedish and Brandenburg troops beat a bigger Polish-Lithuanian army and retook the city, but could not hold it.
      - kind: battle
        side: foe
        name: Battle of Prostki
        date: 8 October 1656
        lonlat:
          - 22.4319
          - 53.6976
        text: Polish-Lithuanian and Tatar forces defeated a Swedish-Brandenburg army in Ducal Prussia.
      - kind: treaty
