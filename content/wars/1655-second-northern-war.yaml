  - title: Lithuania between Russia and Sweden
    date: 1655–1656
    when: "1655-08"
    borders: "1655"
    countries: [lt, by, pl, ru]
    side_names:
      foe: Polish–Lithuanian success
    body:
      - Lithuania was invaded from two sides. Russian armies and Cossacks had taken Smolensk, Vitebsk and Mogilev in 1654, and in the summer of 1655 they took Minsk, Grodno and Kaunas. On 8 August they captured Vilnius, the capital, and looted and burned it for days, killing many of its people. Tsar Alexis took the title Grand Duke of Lithuania. It was in the shadow of these defeats that Janusz Radziwiłł turned to Sweden at Kėdainiai.
      - Many Lithuanian nobles rejected his union with Sweden and stayed loyal to John II Casimir, led by Paweł Sapieha, voivode of Vitebsk. Radziwiłł died on 31 December 1655 in his castle at Tykocin while Sapieha’s troops besieged it, and in 1656 Samogitia rose against its Swedish garrisons. Alarmed by Swedish gains, Russia turned on Sweden, and in November 1656 Russian and Polish–Lithuanian envoys agreed a truce at Niemież near Vilnius. Russian troops stayed in much of the Grand Duchy until 1661.
    facts:
      - [Vilnius taken by Russia, "8 August 1655 (29 July Old Style)"]
      - [Truce of Niemież, "November 1656, between Russia and Poland–Lithuania"]
    markers:
      - kind: taken
        side: ru
        name: Vilnius sacked
        date: 8 August 1655
        lonlat: [25.29, 54.69]
        lp: l
        text: Russian troops and Cossacks under Yakov Cherkassky and Ivan Zolotarenko took the Lithuanian capital, which had never fallen to an enemy before.
      - kind: event
        side: foe
        name: Tykocin
        date: 31 December 1655
        lonlat: [22.77, 53.20]
        text: Janusz Radziwiłł died in his besieged castle. His garrison surrendered to the loyalists soon afterwards.
      - kind: treaty
        name: Truce of Niemież
        date: November 1656
        lonlat: [25.37, 54.64]
        text: Russia and Poland–Lithuania stopped fighting each other to face Sweden. The Poles even held out the prospect of electing the tsar as John Casimir’s successor.
    arrows:
      - side: ru
        label: Cherkassky and Zolotarenko
        via: [[27.56, 53.9], [26.5, 54.3], [25.4, 54.66]]
    areas:
      - style: occupied
        side: ru
        label: Occupied by Russia, 1655
        atoms: [RU-SMO, BY-VI, BY-MA, BY-HO, BY-MI, BY-HM, BY-HR, LT-VL, LT-UT, LT-AL, LT-KU]
      - style: occupied
        side: se
        label: Under Swedish protection after Kėdainiai
        atoms: [LT-SA, LT-TE, LT-PN, LT-TA]
  - title: The Commonwealth rallies
    date: Dec 1655 – Jul 1656
    when: "1655-12"
    borders: "1655"
    countries: [pl, ua]
    side_names:
      foe: Polish–Lithuanian success
    move_names:
      foe: Polish–Lithuanian moves
    body:
      - Swedish requisitions and plunder, and the attack on Jasna Góra, turned many Poles who had submitted against Charles X Gustav. On 29 December 1655 nobles and soldiers loyal to John II Casimir formed the Confederation of Tyszowce and called the country to arms, and the Crown hetmans went back to the king. John Casimir returned from Silesia through the mountains to Lwów. In its cathedral, on 1 April 1656, he vowed to place the kingdom under the protection of the Virgin Mary and to ease the burdens of the peasants.
      - Charles X Gustav struck deep into the south-east that winter. He beat Stefan Czarniecki at Gołąb in February, but failed to take Zamość, and in late March he was nearly trapped where the San meets the Vistula, escaping with heavy losses. Czarniecki’s raids and ambushes wore down the Swedish columns, and on 1 July 1656 a Polish–Lithuanian army retook Warsaw, capturing the Swedish commander Arvid Wittenberg.
    facts:
      - [Confederation of Tyszowce, 29 December 1655]
      - [Lwów Oath, 1 April 1656]
      - [Warsaw retaken, 1 July 1656]
    markers:
      - kind: event
        side: foe
        name: Confederation of Tyszowce
        date: 29 December 1655
        lonlat: [23.71, 50.62]
        text: The confederates declared their loyalty to John Casimir and called for a general rising against the Swedes.
      - kind: event
        side: foe
        name: Lwów Oath
        date: 1 April 1656
        lonlat: [24.03, 49.84]
        text: The king made his vows in the Latin cathedral, naming the Virgin Mary Queen of Poland.
      - kind: battle
        side: se
        name: Battle of Gołąb
        date: 18 February 1656
        lonlat: [21.88, 51.49]
        text: Charles X Gustav scattered Czarniecki’s cavalry, but could not catch it.
      - kind: held
        side: foe
        name: Zamość
        date: February 1656
        lonlat: [23.25, 50.72]
        text: The fortress refused to open its gates, and the Swedish king, without siege guns, moved on.
      - kind: event
        side: foe
        name: Trap at the San
        date: March – April 1656
        lonlat: [21.80, 50.70]
        lp: l
        text: Hemmed in between the rivers and Polish troops, the Swedish army broke out after about two weeks and retreated north.
      - kind: taken
        side: foe
        name: Warsaw retaken
        date: 1 July 1656
        lonlat: [21.01, 52.23]
        text: After a siege of more than a month the Swedish garrison surrendered.
    arrows:
      - side: foe
        label: John Casimir
        via: [[17.85, 50.35], [20.69, 49.3], [22.5, 49.6], [23.95, 49.83]]
      - side: se
        label: Charles X Gustav
        via: [[21.0, 52.15], [21.9, 51.45], [23.1, 50.75], [22.7, 50.1]]
  - title: Victory at Warsaw, and Russia attacks
    date: "1656"
    when: "1656"
    borders: "1654"
    countries:
      - se
      - pl
      - lt
      - ru
      - de
      - lv
      - ee
    view:
      center:
        - 24.7945
        - 55.9502
      size:
        - 1030
        - 1069
    body:
      - "Polish resistance grew fast, and a Swedish force was destroyed at Warka in April. Frederick William of Brandenburg had already become Charles’s vassal for Ducal Prussia, and on 28–30 July 1656 their combined army beat a larger Polish-Lithuanian army at Warsaw. The victory changed little: the allies were beaten at Prostki in October, and in November Charles had to grant Frederick William full sovereignty in Prussia at Labiau."
      - Meanwhile Tsar Alexis declared war in May 1656. A Russian army besieged Riga from August to October without success, but another took Dorpat.
    facts:
      - - Battle of Warsaw
        - Swedish-Brandenburg victory
      - - New front
        - Russo-Swedish War, 1656–1658
    markers:
      - kind: battle
        side: foe
        name: Battle of Warka
        date: 7 April 1656
        lonlat:
