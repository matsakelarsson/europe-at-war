        - 1055
        - 917
    body:
      - Charles X Gustav invaded Poland–Lithuania in July 1655, while it was already fighting Russia and the Cossacks. At Ujście on 25 July the nobles of Greater Poland surrendered without a real fight, and on 17 August Janusz Radziwiłł placed Lithuania under Swedish protection at Kėdainiai.
      - Charles entered Warsaw on 8 September. Kraków fell in October, and King John II Casimir fled to Silesia. Only the fortified monastery of Jasna Góra at Częstochowa held out, and its defence rallied Polish resistance. Far away, on the Delaware, the Dutch took the colony of New Sweden that September.
    facts:
      - - Polish name
        - Potop, the Deluge
      - - Overseas
        - New Sweden surrendered to the Dutch, 15 September 1655
