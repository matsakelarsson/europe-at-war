  - title: The siege of Copenhagen
    date: Aug 1658 – Feb 1659
    when: "1658"
    borders: "1658"
    countries:
      - se
      - dk
      - no
    view:
      center:
        - 11.9427
        - 55.5645
      size:
        - 326
        - 248
    body:
      - Barely six months later Charles broke the peace, now aiming to wipe out Denmark as an independent state. His army landed at Korsør on 7 August 1658 and laid siege to Copenhagen, and Kronborg fell on 6 September.
      - The Dutch would not let one power hold both shores of the Sound. Their relief fleet of about 45 ships beat the Swedish fleet in the Battle of the Sound on 29 October 1658 and got supplies and troops into the city. On the night of 10–11 February 1659 a Swedish storming of Copenhagen was thrown back with heavy losses.
    facts:
      - - Dutch relief fleet
        - About 45 ships
      - - City gates closed
        - For 22 months
    markers:
      - kind: event
        side: se
        name: Landing at Korsør
        date: 7 August 1658
        lonlat:
          - 11.1405
          - 55.3291
        lp: l
        text: About 5,700 men crossed in some 70 ships. News of the landing reached Copenhagen the next day.
      - kind: siege
        side: se
        name: Siege of Kronborg
        date: 16 August – 6 September 1658
        lonlat:
          - 12.6213
          - 56.0406
        text: Wrangel took the fortress that guards the Sound and turned its 77 captured guns on the siege.
      - kind: naval
        side: nl
        name: Battle of the Sound
        date: 29 October 1658
        lonlat:
          - 12.7001
          - 55.9302
        text: The Dutch under Admiral Obdam broke the Swedish blockade and joined the Danish fleet trapped in Copenhagen.
      - kind: battle
        side: dk
        name: Assault on Copenhagen
        date: 10–11 February 1659
        lonlat:
          - 12.5693
          - 55.6804
        lp: b
        text: Warned of the plan, the Danes and Dutch beat off the night attack. Afterwards Charles tried to starve the city out instead.
