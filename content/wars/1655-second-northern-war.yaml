  - title: Peace at Oliva and Copenhagen
    date: "1660"
    when: "1660"
    borders: "1660"
    countries:
      - se
      - dk
      - no
      - pl
      - lt
      - ru
      - lv
      - ee
    body:
      - Charles X Gustav died at Gothenburg on 13 February 1660, aged 37, while planning yet another campaign. His son Charles XI was four, and the regency quickly made peace. At Oliva near Danzig on 3 May 1660, Poland–Lithuania recognised Swedish Livonia, John II Casimir gave up his claim to the Swedish crown, and all occupied land was returned.
      - In the Treaty of Copenhagen on 27 May 1660, Sweden gave back Trøndelag and Bornholm but kept Scania, Halland, Blekinge and Bohuslän. Peace with Russia followed at Cardis in 1661, restoring the borders of 1617.
    facts:
      - - Kept by Sweden
        - Scania, Halland, Blekinge, Bohuslän
      - - Returned
        - Trøndelag and Bornholm
    markers:
      - kind: event
        side: none
        name: Charles X Gustav dies
        date: 13 February 1660
        lonlat:
          - 11.9706
          - 57.7105
        lp: l
        text: The king fell ill and died while the Riksdag was meeting in Gothenburg.
      - kind: treaty
        side: se
        name: Treaty of Oliva
        date: 3 May 1660
        lonlat:
          - 18.5598
          - 54.4099
        text: Peace with Poland–Lithuania, the Emperor and Brandenburg. Brandenburg’s sovereignty over Ducal Prussia was also confirmed.
      - kind: treaty
        side: se
        name: Treaty of Copenhagen
        date: 27 May 1660
        lonlat:
          - 12.5693
          - 55.6804
        lp: l
        text: Sweden kept everything east of the Sound and its exemption from the Sound Dues. Four days later the remaining Swedish troops began to leave the outskirts of the city.
      - kind: treaty
        side: se
        name: Treaty of Cardis
        date: "1661"
        lonlat:
          - 26.4511
          - 58.7378
        text: Russia handed back its conquests in Livonia, confirming the 1617 Treaty of Stolbovo.
    arrows: []
