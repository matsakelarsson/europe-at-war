  - title: The March across the Belts
    date: Jan – Feb 1658
    when: "1658"
    borders: "1654"
    countries:
      - se
      - dk
      - no
    view:
      center:
        - 10.9466
        - 55.3629
      size:
        - 330
        - 252
    body:
      - The winter was so harsh that the Danish straits froze and the Danish fleet was stuck in port. On 30 January 1658 Charles led his army across the ice of the Little Belt from Jutland to Funen and overwhelmed the defenders.
      - On 5 February he crossed the Great Belt via Langeland to Lolland, then over Falster to Zealand, losing two cavalry squadrons through the ice on the way. Copenhagen had not expected an attack before spring, and Denmark asked for peace. A preliminary treaty was signed at Taastrup in mid-February.
    facts:
      - - Across the Great Belt
        - About 7,500 men and 20 guns
      - - Losses
        - Two cavalry squadrons drowned
    markers:
      - kind: battle
        side: se
        name: Across the Little Belt
        date: 30 January 1658
        lonlat:
          - 9.8013
          - 55.4494
        text: Between 6,000 and 12,000 Swedes crossed the ice to Funen and beat the Danish troops waiting there.
      - kind: event
