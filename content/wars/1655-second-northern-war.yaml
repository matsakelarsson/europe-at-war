  - title: The Treaty of Roskilde
    date: 26 February 1658
    when: "1658"
    borders: "1654"
    countries:
      - se
      - dk
      - no
    view:
      center:
        - 11.4649
        - 59.1871
      size:
        - 1034
        - 1316
    body:
      - "Denmark–Norway lost about a third of its territory: Scania, Blekinge and Halland, the island of Bornholm, and from Norway the provinces of Bohuslän and Trøndelag (then including Nordmøre and Romsdal). Halland, held since 1645 on a 30-year pledge, became Swedish for good."
      - Denmark also had to renounce its anti-Swedish alliances and keep hostile warships out of the Baltic. Sweden had never been larger.
    facts:
      - - Ceded by Denmark
        - Scania, Blekinge, Halland, Bornholm
      - - Ceded by Norway
        - Bohuslän, Trøndelag
    markers:
      - kind: treaty
        side: se
        name: Treaty of Roskilde
        date: 26 February 1658
        lonlat:
          - 12.0803
          - 55.6385
        lp: l
        text: The final peace, celebrated afterwards with a banquet for both kings at Frederiksborg Castle.
      - kind: event
        side: se
        name: Trondheim
        date: May 1658
        lonlat:
          - 10.4062
          - 63.4298
        text: Lorentz Creutz arrived with about 530 soldiers to take over the province for Sweden.
