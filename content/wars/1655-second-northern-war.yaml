id: second-northern-war
name: Second Northern War
start: "1655"
end: "1660"
tier: A
summary: "Charles X Gustav’s invasion of Poland–Lithuania in 1655, the Deluge, drew in Russia, Brandenburg, Transylvania, the Habsburgs, Denmark–Norway and the Dutch. Sweden could not hold Poland, but after marching across the frozen Danish straits it won Scania, Halland, Blekinge and Bohuslän from Denmark–Norway, which it kept at the peace of 1660."
