      - kind: event
        side: dk
        name: Bornholm uprising
        date: 8–9 December 1658
        lonlat:
          - 14.6997
          - 55.1004
        lp: l
        text: Islanders led by men such as Jens Kofoed and Villum Clausen seized the Swedish commandant, who was shot in Rønne’s main street.
      - kind: held
