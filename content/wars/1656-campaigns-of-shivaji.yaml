  - title: Panhala and Pavan Khind
    date: March – September 1660
    when: "1660-07"
    borders: "1660-07-13"
    countries: [in]
    body:
      - In 1660 Bijapur and the Mughals moved against Shivaji at the same time. An Abyssinian general of Bijapur, Siddi Jauhar, besieged him in Panhala from March with a large army, helped by artillerymen and grenades from the English factory at Rajapur. The siege dragged on through the monsoon. In the end Shivaji slipped out of the fort at night with a small force and made for Vishalgad, some 60 km to the west, with Bijapuri cavalry under Siddi Masud close behind.
      - At the narrow pass of Ghod Khind his commander Baji Prabhu Deshpande stayed behind with part of the troops to hold off the pursuers. The rearguard fought until, by tradition, the guns of Vishalgad announced that Shivaji had arrived; Baji Prabhu and many of his men were killed, and the pass has since been called Pavan Khind, the “sacred pass”. Panhala itself was handed over to Bijapur by agreement in September. Shivaji made peace with Bijapur soon after, which left him free to face the Mughals.
    facts:
      - [Siege of Panhala, "March – September 1660"]
      - [Battle of Pavan Khind, "1660, Maratha rearguard action"]
      - [Maratha dead at Pavan Khind, "about 700, according to most accounts"]
