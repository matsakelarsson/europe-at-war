  - title: The southern campaign
    date: 1677 – April 1680
    when: "1677-05"
    borders: "1678-07"
    countries: [in]
    body:
      - In 1677 Shivaji led his largest campaign, some 30,000 cavalry and 40,000 infantry, far to the south. He went first to Hyderabad, where he made an alliance with Abul Hasan Qutb Shah of Golconda and his Brahmin ministers Madanna and Akkanna, who paid for the campaign in return for a share of the conquests. He then marched into the Bijapuri lands of the Carnatic. Gingee, one of the strongest forts in the south, was handed over in May 1677, and Vellore fell in July 1678 after a siege of more than a year. Shivaji also claimed a share of his father’s lands from his half-brother Venkoji (Ekoji), the Maratha ruler of Thanjavur, whose army was beaten in November 1677.
      - The new southern territories were to save the Maratha state a decade later, when Gingee became its refuge. In his last years Shivaji faced a rift with his eldest son, Sambhaji, who went over to the Mughal general Diler Khan in 1678 and returned a year later. Shivaji died at Raigad on 3 April 1680, at about fifty. Aurangzeb came south himself the next year to finish the Marathas off.
    facts:
      - [Alliance with Golconda, "early 1677"]
      - [Gingee taken, "May 1677"]
      - [Vellore taken, "July 1678"]
      - [Death of Shivaji at Raigad, "3 April 1680"]
