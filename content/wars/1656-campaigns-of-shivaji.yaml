id: campaigns-of-shivaji
name: Campaigns of Shivaji
start: "1656-01"
end: "1680-04-03"
tier: A
summary: "The wars by which Shivaji Bhonsle, son of a Maratha general in the service of Bijapur, built an independent Maratha kingdom in the hills and coast of the western Deccan. He seized the hill forts around Pune and the valley of Javli, killed the Bijapuri general Afzal Khan at Pratapgad in 1659 and escaped the siege of Panhala in 1660. Against the Mughals he raided the governor Shaista Khan’s quarters in Pune in 1663 and sacked the port of Surat in 1664, but Jai Singh’s campaign forced him to cede most of his forts at Purandar in 1665, and on a visit to Aurangzeb’s court at Agra he was put under house arrest and escaped. From 1670 he won back his forts, sacked Surat again and defeated Mughal armies in the open. On 6 June 1674 he was crowned Chhatrapati at Raigad, and in 1677–1678, allied with Golconda, he conquered Gingee and Vellore in the far south. He died in 1680, leaving a kingdom that resisted the Mughals for the next generation."
