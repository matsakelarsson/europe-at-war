notes:
  - Much of what is told about Shivaji comes from Maratha chronicles (bakhars) written decades after his death, from the Persian histories of the Mughal and Bijapur courts and from the letters of English, Dutch and Portuguese traders. They often disagree, above all on who struck first at Pratapgad, and Shivaji has been claimed by many later causes; this story follows the dates and events most historians accept.
  - Mughal-period dates in English books often follow Jadunath Sarkar, partly in the Julian calendar (ten days behind the Gregorian). The battle of Pavan Khind is dated July 1660 in Maratha tradition and September 1660 in some modern accounts.
  - The extent of Shivaji’s lands is drawn as approximate areas in the steps; his kingdom was a chain of hill forts and the districts around them rather than a block of territory with fixed borders.
