  - title: Purandar and Agra
    date: 1665–1666
    when: "1665-06-11"
    borders: "1665-06-11"
    countries: [in]
    body:
      - In 1665 Aurangzeb sent Mirza Raja Jai Singh of Amber, his most experienced general, with Diler Khan and an army of some 15,000 men. Jai Singh used diplomacy as well as force, bribing Shivaji’s allies and neighbours, and besieged the fort of Purandar, whose commander, Murarbaji Deshpande, was killed in a sortie. With Purandar about to fall, Shivaji came to Jai Singh’s camp. By the Treaty of Purandar, on 11 June 1665, he gave up 23 forts with the lands around them, keeping 12, and agreed to serve the emperor; his son Sambhaji was made a Mughal officer. Shivaji then fought for the Mughals in Jai Singh’s unsuccessful campaign against Bijapur.
      - Jai Singh persuaded him to go to Aurangzeb’s court at Agra. There, on 12 May 1666, Shivaji was made to stand among officers of the third rank, protested angrily in open court and was placed under house arrest. On 17 August 1666 he escaped with Sambhaji, by tradition hidden in large baskets of sweets sent out as gifts, and made his way home in disguise. Aurangzeb, busy in the north, made peace with him in 1667 and recognised his title of raja.
    facts:
      - [Treaty of Purandar, "11 June 1665"]
      - [Forts ceded, "23 of 35"]
      - [Audience at Agra, "12 May 1666"]
      - [Escape from Agra, "17 August 1666"]
