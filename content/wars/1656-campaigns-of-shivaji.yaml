steps:
  - title: Javli and Pratapgad
    date: 1656 – December 1659
    when: "1659-11-10"
    borders: "1659-11-10"
    countries: [in]
    body:
      - Shivaji’s father, Shahji Bhonsle, was a general of the Bijapur Sultanate who held a large fief around Bangalore and an older one around Pune, which Shivaji grew up in with his mother Jijabai. From the 1640s the young Shivaji took over the hill forts of the Pune country, Torna, Rajgad and Kondana, often by winning over their keepers rather than by force. In January 1656 he seized the forested valley of Javli from the Maratha chief Chandrarao More, a loyal vassal of Bijapur, and with it the fort of Rairi, later called Raigad. In 1657, while Aurangzeb was at war with Bijapur, he raided the Mughal districts of Junnar and Ahmednagar.
      - In 1659 the regent of Bijapur sent one of its foremost generals, Afzal Khan, with a strong army to bring him to heel. Afzal Khan camped at Wai and, unable to lure Shivaji out of the mountains, agreed to meet him alone below the new fort of Pratapgad. At the meeting, on 10 November 1659, Shivaji killed him; Maratha accounts say Afzal Khan tried to strangle and stab him first, while Bijapuri accounts say Shivaji had planned the killing. Maratha troops hidden in the forest then fell on the leaderless army, and over 3,000 Bijapuri soldiers were killed. Shivaji went on to take Panhala on 28 November and defeated a second army under Rustam Zaman near Kolhapur on 28 December.
    facts:
      - [Javli taken, "January 1656"]
      - [Afzal Khan killed at Pratapgad, "10 November 1659"]
      - [Battle of Kolhapur, "28 December 1659, Maratha victory"]
