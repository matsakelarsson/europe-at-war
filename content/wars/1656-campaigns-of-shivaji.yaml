  - title: Chhatrapati
    date: 6 June 1674
    when: "1674-06-06"
    borders: "1674-06-06"
    countries: [in]
    body:
      - Although he ruled a state, Shivaji was legally still a rebel vassal of Bijapur and a landholder in the eyes of the Mughals, and many Brahmins regarded the Bhonsles as farmers rather than Kshatriyas, the warrior caste from whom kings were drawn. A learned Brahmin from Benares, Gaga Bhatt, was brought to Raigad, accepted a genealogy tracing the family to the Sisodia Rajputs of Mewar and performed the Vedic rites. On 6 June 1674, before a great gathering that included an English envoy from Bombay, Shivaji was crowned Chhatrapati, lord of the umbrella, and began a new era in his own name. A second, Tantric coronation followed in September.
      - The coronation gave the Maratha state a king equal in rank to the sultans and a court with Sanskrit titles for its eight ministers. It came at the end of a costly year. Prataprao Gujar had been killed in a reckless charge against a Bijapuri army at Nesari in February, and Shivaji’s mother, Jijabai, died twelve days after the ceremony.
    facts:
      - [Coronation at Raigad, "6 June 1674"]
      - [Second coronation, "24 September 1674"]
