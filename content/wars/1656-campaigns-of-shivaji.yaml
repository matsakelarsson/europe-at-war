  - title: Shaista Khan and Surat
    date: 1660 – January 1664
    when: "1663-04-05"
    borders: "1663-04-05"
    countries: [in]
    body:
      - Aurangzeb, now emperor, sent his maternal uncle Shaista Khan, governor of the Deccan, against Shivaji with a large army. Shaista Khan occupied Pune in May 1660 and took up quarters in the Lal Mahal, the house where Shivaji had grown up; the fort of Chakan fell in August after a siege of nearly two months. For three years the Mughals held the plain, while the Marathas held the hills and raided. On the night of 5 April 1663, during Ramadan, Shivaji and a few hundred men slipped into Pune among a wedding party, broke into the Lal Mahal and attacked Shaista Khan in his bedroom. He escaped with the loss of three fingers, but one of his sons and several of his household were killed. Aurangzeb, angered, transferred his uncle to Bengal.
      - In January 1664 Shivaji rode north with a few thousand horsemen to Surat, the richest port of the Mughal empire and the gateway for pilgrims to Mecca. The Mughal governor shut himself in the citadel, and for four days, from 5 to 10 January, the Marathas plundered the town and burned much of it; the English and Dutch factories defended themselves and were left alone. The booty was said to be worth more than ten million rupees.
    facts:
