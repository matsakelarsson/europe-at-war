  - title: The forts retaken
    date: 1670–1673
    when: "1670-02-04"
    borders: "1672-02-15"
    countries: [in]
    body:
      - In 1670 Shivaji broke the peace. On the night of 4 February his commander Tanaji Malusare climbed the cliffs of Kondana with a picked force and took the fort from its Rajput garrison; Tanaji was killed in the fighting, and the fort was renamed Sinhagad. Purandar and most of the forts ceded in 1665 followed within months. In October Shivaji sacked Surat a second time and, on the way home, beat the pursuing Mughal army under Daud Khan at Vani-Dindori.
      - Maratha armies now fought the Mughals in the open as well as from the hills. In February 1672, at Salher in the Baglan hills, Maratha cavalry and infantry under Prataprao Gujar and Moropant Pingle relieved the besieged fort and defeated a Mughal army, one of the largest Maratha victories of Shivaji’s life. In 1673 Shivaji turned on Bijapur again and took Panhala for good.
    facts:
      - [Sinhagad taken, "4 February 1670"]
      - [Second sack of Surat, "October 1670"]
      - [Battle of Salher, "February 1672, Maratha victory"]
      - [Panhala retaken, "March 1673"]
