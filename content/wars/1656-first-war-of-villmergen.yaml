notes:
  - Fribourg and Solothurn stayed neutral, and Schaffhausen sent troops to defend Zürich but took no part in the fighting.
  - Bern and Zürich used the Julian calendar until 1701, ten days behind the Gregorian calendar of the Catholic cantons; dates here follow the Historical Dictionary of Switzerland.
