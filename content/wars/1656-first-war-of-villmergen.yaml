id: first-war-of-villmergen
name: First War of Villmergen
start: "1656-01-06"
end: "1656-03-07"
tier: C
summary: A short war between the Protestant cantons of Zürich and Bern and the five Catholic cantons of central Switzerland, set off when Schwyz executed four Protestants from Arth whose fellow believers had fled to Zürich in 1655. Zürich and Bern declared war on 6 January 1656, hoping to overturn the Catholic advantage written into the Second Peace of Kappel of 1531. Zürich’s army under Hans Rudolf Werdmüller laid siege to Rapperswil, but on 24 January Lucerne and Zug troops under Christoph Pfyffer surprised and routed the Bernese army of Sigmund von Erlach at Villmergen in the Freie Ämter. After Werdmüller’s assault on Rapperswil failed on 3 February, Bern and then Zürich sought peace, and the Third Peace of Baden on 7 March 1656 restored the old order, confirming each canton’s right to decide its own religion.
countries: [ch]
