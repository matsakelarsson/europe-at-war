notes:
  - The Mughals had no fixed rule of succession; every son of an emperor could claim the throne, and wars between brothers had followed the deaths of Akbar (1605) and Jahangir (1627).
  - Many English-language accounts follow Jadunath Sarkar’s History of Aurangzib, whose dates for these years are partly in the Julian (Old Style) calendar, ten days behind the Gregorian. Dara’s execution, for example, is dated 30 August 1659 in the Julian and 9 September in the Gregorian calendar. Dates here are given as the cited sources usually give them.
  - The chroniclers of Aurangzeb’s court wrote the official history of the war; the accounts of the French physician François Bernier and the Venetian Niccolò Manucci, who served Dara, give the other side.
