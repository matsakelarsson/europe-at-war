  - title: Deorai and the death of Dara
    date: June 1658 – September 1659
    when: "1659-03-11"
    borders: "1659-03-11"
    countries: [in, pk]
    body:
      - Dara fled from Delhi to Lahore, where he raised a new army, then down the Indus past Multan and Bhakkar to Thatta in Sindh, with Aurangzeb’s generals behind him. He crossed the Rann of Kutch to Gujarat, where its governor, Shah Nawaz Khan, gave him money and men. Jaswant Singh promised to join him, then made his peace with Aurangzeb and stayed home. Dara dug in on the hills of Deorai, the pass south of Ajmer, and for three days, from 11 March 1659, held off Aurangzeb’s attacks, until his lines were turned and his army fled.
      - Dara fled again through Gujarat and Sindh towards Persia. His wife Nadira Banu died on the way. At Dadar, near the Bolan Pass, the Afghan chief Malik Jiwan, whose life Dara had once saved, seized him and handed him over to Aurangzeb’s officers in June. Brought to Delhi, Dara was paraded through the streets on a filthy elephant, which caused riots among the people of the city. A council of nobles and theologians condemned him for apostasy, and he was killed in prison on the night of 30 August 1659. His son Sulaiman Shikoh, who had taken refuge with the raja of Garhwal, was handed over in 1661 and died at Gwalior in 1662.
    facts:
      - [Battle of Deorai, "11–14 March 1659, victory for Aurangzeb"]
      - [Dara handed over at Dadar, "June 1659"]
      - [Dara executed in Delhi, "30 August 1659 (Julian); 9 September (Gregorian)"]
