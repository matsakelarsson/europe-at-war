id: mughal-war-of-succession-1658
name: Mughal war of succession (1658–1659)
start: "1657-09-06"
end: "1660-05"
tier: A
summary: The war between the four sons of the Mughal emperor Shah Jahan after he fell ill in September 1657. The eldest, Dara Shikoh, held the court as his father’s favourite; Shah Shuja in Bengal and Murad Bakhsh in Gujarat crowned themselves, and Aurangzeb, viceroy of the Deccan, joined Murad. Dara’s son Sulaiman Shikoh beat Shuja at Bahadurpur, but Aurangzeb and Murad routed the imperial army at Dharmat and Dara himself at Samugarh near Agra in 1658. Aurangzeb confined Shah Jahan in Agra fort, arrested Murad and had himself proclaimed emperor. He defeated Shuja at Khajwa and Dara again at Deorai near Ajmer in 1659; Dara was betrayed, paraded through Delhi and executed for apostasy, and Shuja fled to Arakan in 1660. Aurangzeb ruled until 1707.
countries: [in, pk, bd]
sides:
  - id: aur
    name: Aurangzeb (with Murad Bakhsh until June 1658)
    polities: [mughals]
