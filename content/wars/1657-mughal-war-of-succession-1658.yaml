  - title: Khajwa
    date: November 1658 – May 1660
    when: "1659-01-05"
    borders: "1659-01-05"
    countries: [in, bd]
    body:
      - While Aurangzeb chased Dara into the Punjab, Shah Shuja marched again from Bengal, took Benares and Allahabad and advanced towards Agra. Aurangzeb hurried back and was joined by Mir Jumla, the former minister of Golconda who had become his best general. The armies met at Khajwa, between the Ganges and the Yamuna, on 5 January 1659. The night before, Jaswant Singh, who had submitted to Aurangzeb, plundered the emperor’s camp and rode away with his Rajputs, hoping to throw the army into confusion. Aurangzeb kept his men in hand, and the next day his artillery and elephants broke Shuja’s attack.
      - Mir Jumla pursued Shuja down the Ganges for more than a year, through Bihar and Bengal, taking Monghyr, Rajmahal and Tanda; Aurangzeb’s eldest son, Muhammad Sultan, went over to Shuja for a time and then came back. In May 1660 Shuja fled from Dhaka by boat with his family to the kingdom of Arakan, where he and most of his family were killed the next year after a quarrel with its king. Mir Jumla became governor of Bengal.
    facts:
      - [Battle of Khajwa, "5 January 1659, victory for Aurangzeb"]
      - [Shuja flees to Arakan, "May 1660"]
