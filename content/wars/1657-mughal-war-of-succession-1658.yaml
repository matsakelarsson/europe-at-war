  - title: Dharmat
    date: April 1658
    when: "1658-04-15"
    borders: "1658-04-15"
    countries: [in]
    body:
      - Aurangzeb crossed the Narmada and joined Murad at Dipalpur in Malwa. Jaswant Singh, who had expected to face Murad alone, found both princes in front of him on the plain of Dharmat near Ujjain. On 15 April 1658 the princes’ artillery, served partly by European gunners, broke up the charges of the Rajput cavalry. Jaswant Singh’s Rathors and the other Rajput clans fought hard, and thousands of them were killed; Qasim Khan and many of the Mughal officers held back. Jaswant Singh, wounded, rode home to Jodhpur, where, according to Bernier, his queen shut the gates of the fort against a husband who had not won or died.
      - The battle showed the strength of Aurangzeb’s seasoned Deccan army and made him the leader of the alliance. It also made him enemies among the Rajputs, whose losses had been heavy while Dara’s Muslim commanders had done little.
    facts:
      - [Battle of Dharmat, "15 April 1658, victory for Aurangzeb and Murad"]
      - [Rajput dead, "at least 6,000, according to Jadunath Sarkar"]
    markers:
