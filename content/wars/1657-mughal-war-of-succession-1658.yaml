  - title: Samugarh and Agra
    date: May – July 1658
    when: "1658-05-29"
    borders: "1658-06-08"
    countries: [in]
    body:
      - Dara marched out of Agra with an army of perhaps 50,000 to 60,000 to hold the line of the Chambal, but Aurangzeb found an unguarded ford and crossed behind him. On 29 May 1658 the armies met at Samugarh, about 16 km east of Agra. Dara’s Rajputs under Rao Chhatrasal Hada of Bundi broke into Murad’s division and wounded him, but Aurangzeb held the centre. At the height of the fighting Dara got down from his war elephant, perhaps to escape a rocket or to mount a horse; his troops, seeing the howdah empty, believed he was dead and began to scatter. By evening his army had dissolved, and he fled to Agra and then to Delhi with a few followers.
      - Aurangzeb besieged Agra fort and cut off its water from the Yamuna. On 8 June Shah Jahan opened the gates; he was kept a prisoner in the fort, cared for by his daughter Jahanara, until his death in January 1666. Murad, who still thought himself the senior partner, was invited to a feast in Aurangzeb’s camp near Mathura on 25 June, made drunk and arrested; he was later held at Gwalior and executed there in December 1661. On 31 July Aurangzeb was proclaimed emperor in the Shalimar garden outside Delhi, taking the title Alamgir.
    facts:
      - [Battle of Samugarh, "29 May 1658, victory for Aurangzeb"]
      - [Agra fort surrenders, "8 June 1658"]
      - [Murad arrested, "25 June 1658"]
      - [Aurangzeb proclaimed emperor, "31 July 1658"]
    markers:
      - kind: battle
        side: aur
        name: Samugarh
        date: 29 May 1658
        text: The decisive battle of the war. Rao Chhatrasal Hada and Rustam Khan were killed fighting for Dara.
        lonlat: [78.150, 27.160]
