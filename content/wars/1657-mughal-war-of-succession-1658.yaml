steps:
  - title: Four princes and a sick emperor
    date: September 1657 – February 1658
    when: "1657-09-06"
    borders: "1658-01-01"
    countries: [in, bd]
    body:
      - On 6 September 1657 Shah Jahan, now 65, fell seriously ill in Delhi. His eldest son, Dara Shikoh, a scholar of Sufism and Hindu philosophy whom the emperor openly favoured, took charge of the government and kept the court closed; rumours spread that the emperor was dead. Each of his brothers governed a great province with its own army and treasury. Shah Shuja, governor of Bengal for nearly twenty years, proclaimed himself emperor at Rajmahal and marched up the Ganges. Murad Bakhsh, the youngest, had himself crowned at Ahmedabad in December and seized the treasure of Surat. Aurangzeb, viceroy of the Deccan, who had just been called back from wars against Bijapur and Golconda, moved more carefully. He agreed with Murad to divide the empire between them and gathered his army at Burhanpur.
      - Shah Jahan recovered enough to be carried to Agra, but he left the war to Dara. Dara sent his son Sulaiman Shikoh, with the Rajput general Mirza Raja Jai Singh of Amber, against Shuja, and a second army under Maharaja Jaswant Singh of Marwar and Qasim Khan to Malwa to stop the princes from the south. On 14 February 1658 Sulaiman surprised Shuja’s camp at Bahadurpur near Benares and routed him. Shuja fled back to Bengal, and in May Dara, needing his son’s army against Aurangzeb, made a treaty that left him Bengal, Orissa and much of Bihar.
    facts:
      - [Shah Jahan falls ill, "6 September 1657"]
      - [Battle of Bahadurpur, "14 February 1658, victory for Dara’s son Sulaiman Shikoh"]
