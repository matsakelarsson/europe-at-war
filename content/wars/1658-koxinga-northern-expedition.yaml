id: koxinga-northern-expedition
name: Zheng Chenggong’s northern expedition
start: "1658-06"
end: "1659-09-10"
tier: C
summary: "The greatest attempt of the Ming loyalists to win back the lower Yangtze from the Qing. Zheng Chenggong (Koxinga), who held Xiamen and Kinmen on the Fujian coast in the name of the Southern Ming Yongli emperor, sailed north with a large fleet in the summer of 1658, but a typhoon off the Yangshan islands in Zhejiang that autumn sank many of his ships; Chinese accounts speak of more than 8,000 drowned, among them three of his sons. He sailed again in July 1659 with, by the loyalists’ own count, well over 100,000 men, entered the Yangtze, broke the river barriers at Guazhou and took Zhenjiang in early August, while his ally Zhang Huangyan went upriver past Nanjing to Wuhu and won the submission of four prefectures and some two dozen counties in southern Anhui. Koxinga reached Nanjing in mid-August and invested it from 24 August, but he waited for the city to surrender instead of storming it, and his troops grew careless. Reinforced, the Qing garrison under the governor-general Lang Tingzuo sallied out on 9–10 September 1659 and routed the besiegers; Koxinga lost thousands of men and several of his best commanders, among them Gan Hui, who was captured and executed. He fell back to Xiamen, where he beat off a Qing fleet in June 1660, and Zhang Huangyan escaped overland to the coast. The defeat ended hopes of a Ming restoration in the south-east and led Koxinga to turn to Taiwan in 1661."
