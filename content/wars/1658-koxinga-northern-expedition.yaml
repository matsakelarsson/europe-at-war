notes:
  - Dates are converted from the lunar calendar of the Chinese sources; the Yongli-reign accounts of the loyalists and the Qing records disagree on the size of the armies and on losses, and the loyalist figures for Koxinga’s army are likely inflated.
  - What followed is told in the Siege of Fort Zeelandia (1661–1662).
