notes:
  - Dates are Gregorian. Sources differ by a day on the date of Kemény’s death (22 or 23 January 1662) and give different dates in May 1660 for the battle near Gyalu.
  - Transylvanian politics in these years were split between Rákóczi and Kemény on one side and princes backed by the Ottomans, Francis Rhédey, Ákos Barcsay and Michael Apafi, on the other. Rákóczi’s Polish campaign of 1657 belongs to the Second Northern War, which has its own entry.
