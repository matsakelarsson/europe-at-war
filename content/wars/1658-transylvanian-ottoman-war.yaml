id: transylvanian-ottoman-war
name: Transylvanian–Ottoman War (1658–1662)
start: "1658"
end: "1662-01-23"
tier: C
summary: The war in which the Ottoman Empire crushed the attempts of George II Rákóczi and then John Kemény to free the Principality of Transylvania from Ottoman control. Rákóczi’s unauthorised invasion of Poland in 1657 ended in disaster, and the grand vizier Köprülü Mehmed Pasha ordered him deposed. When he refused to go, an Ottoman and Crimean Tatar army invaded in 1658; the Tatars ravaged the country, burning Gyulafehérvár (Alba Iulia) and carrying off many thousands of people, and the Ottomans annexed Jenő and the districts of Lugos and Karánsebes and installed Ákos Barcsay as prince. Rákóczi fought on, but in May 1660 he was defeated near Gyalu (Szászfenes) and died of his wounds at Várad on 7 June. The Ottomans besieged Várad, the key fortress of eastern Hungary, which surrendered on 27 August 1660 and became the seat of a new province. John Kemény, elected prince on 1 January 1661, declared Transylvania’s break with the Porte and asked Vienna for help; Leopold I sent Raimondo Montecuccoli, but the imperial troops did little and withdrew. The Ottomans installed Michael I Apafi as prince, and Kemény was killed in battle at Nagyszőllős in January 1662. Transylvania survived as a smaller, poorer Ottoman vassal, and the conflict led directly to the Austro-Turkish War of 1663–1664.
