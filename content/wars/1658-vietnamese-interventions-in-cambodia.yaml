notes:
  - "Cambodian kings changed sides, abdicated and returned several times in these years (Chey Chettha IV reigned four times between 1675 and 1706), and the Cambodian, Vietnamese and Siamese chronicles disagree on many dates. Vietnamese histories count Nguyễn campaigns in Cambodia in 1658, 1674, 1689–1690, 1699–1700, 1705 and 1714–1715; the Siamese invasion with an army and a fleet is dated 1717. This entry covers them together; the Nguyễn–Siamese wars over Cambodia from 1769 are part of Taksin’s reign and the Tây Sơn wars."
  - "In Vietnamese history the southward advance is called Nam tiến (the march to the south). The base map shows the Nguyễn gaining the land around Saigon in 1698, Vĩnh Long in 1732 and the rest of the delta, with Hà Tiên, in 1757."
