id: vietnamese-interventions-in-cambodia
name: Nguyễn interventions in Cambodia
start: "1658"
end: "1757"
tier: C
summary: "A century of wars in which the Nguyễn lords of Đàng Trong, the southern Vietnamese state, intervened in the quarrels of the Cambodian royal family, usually backing one branch while Ayutthaya backed another, and in the process took over the Mekong delta. Vietnamese settlers had been allowed to settle at Prey Nokor (Saigon) since about 1623, after a Nguyễn princess married King Chey Chettha II. In 1658, when Buddhist princes rose against King Ramathipadi I (Ponhea Chan), a convert to Islam, a Nguyễn army invaded at their call, captured the king and took him to Quảng Bình, where he died in 1659. After a further invasion in 1674 the Nguyễn recognised Ang Sor (Chey Chettha IV) as king at Longvek and Ang Nan as second king at Prey Nokor, both paying them tribute. In 1679 they settled some 3,000 Ming loyalist soldiers, under Dương Ngạn Địch and Trần Thượng Xuyên, at Mỹ Tho and Biên Hòa, and they fought again in Cambodia in 1688–1691. In 1698 Nguyễn Hữu Cảnh organised the region of Saigon as the prefecture of Gia Định, and in 1700 his army defeated Chey Chettha IV and entered Phnom Penh. Rivalry between Siamese-backed kings and the Nguyễn-backed prince Ang Em brought new wars in 1705 and 1714–1717, when Vietnamese armies besieged Longvek and Siam sent armies and a fleet; the settlement left Ang Em king, under Siamese overlordship. Hà Tiên, a port ruled by the Chinese merchant Mạc Cửu, became a Nguyễn vassal in 1708 and was sacked by a Siamese-backed Cambodian army in 1715. Cambodian attempts from 1739 to recover the delta failed; the Nguyễn gained Vĩnh Long in 1732 and, after new wars in the 1750s led by Nguyễn Cư Trinh, the rest of the delta by 1757."
