steps:
  - title: From Taza to Fez
    date: 1659–1666
    when: "1659"
    borders: "1664-08-02"
    countries: [ma, dz]
    body:
      - The Saadian sultanate had shrunk to Marrakesh and its plains when its last sultan, Ahmad al-Abbas, was murdered by his mother’s kin, the Shabana Arabs, in 1658 or 1659. The strongest power was the Dila’iyya, whose leader Muhammad al-Hajj had governed Fez since 1641 and was proclaimed sultan there in 1659; but Salé rose against his governor in 1660–1661 and Fez threw off his rule in 1662. In the north-west al-Khadir Ghailan, who had fought the Portuguese and English at Tangier, ruled the Habt and the Gharb. In Tafilalt the Alaouite sharifs, who had taken power in 1631, ruled under Muhammad ibn Sharif.
      - When their father died in 1659, al-Rashid refused to swear allegiance to his half-brother Muhammad, was imprisoned, escaped and fled. He entered the service of a chief near Taza, rose to command troops of his own, and in 1664 seized and plundered the citadel of Dar Ibn Mash’al in the Beni Snassen hills, whose riches paid for his army; he had himself proclaimed sultan at Oujda. Muhammad ibn Sharif marched north against him, and on 2 August 1664 he was killed early in the battle on the plain of Angad, near Oujda, and his army broke up. In 1665 al-Rashid took Sijilmasa after a nine-month siege and was recognised in Tafilalt, then routed the forces of Fez near Taza. After besieging Fez for eleven months he entered the city on 6 June 1666, and Meknes surrendered in October.
    facts:
      - [Death of Muhammad ibn Sharif at Angad, "2 August 1664"]
      - [Sijilmasa taken, "1665"]
      - [Al-Rashid enters Fez, "6 June 1666"]
