id: alaouite-rise-to-power
name: Alaouite rise to power
start: "1659"
end: "1672-04-09"
tier: B
summary: "The wars in which Moulay al-Rashid, a prince of the Alaouite sharifs of Tafilalt, reunited Morocco after the fall of the Saadians and founded the dynasty that still reigns. By 1659, when the last Saadian sultan was murdered, the country was divided between the Dila’iyya, a Sufi lodge of the Middle Atlas whose leader had been proclaimed sultan in Fez; the war leader al-Khadir Ghailan in the north-west; the Shabana Arabs in Marrakesh; the Semlali lords of Iligh in the Sous; the corsair town of Salé; and the Alaouites of Tafilalt under Muhammad ibn Sharif. Al-Rashid, who had refused to accept his half-brother Muhammad and fled, built a following around Taza and the east, and in August 1664 Muhammad was killed fighting him at Angad. Al-Rashid then took Sijilmasa (1665) and Fez (June 1666), defeated Ghailan, destroyed the zawiya of Dila (June 1668), took Marrakesh (July 1668) and subdued the Sous (1670). He died in Marrakesh in April 1672 after a fall from his horse, and his half-brother Moulay Ismail succeeded him."
countries: [ma, dz]
