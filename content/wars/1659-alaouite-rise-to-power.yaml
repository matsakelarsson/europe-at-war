notes:
  - The main sources are Moroccan chronicles written under the Alaouites, notably al-Ifrani and al-Nasiri, and European reports. They disagree on several dates, such as the year the Dila’iyya lost Fez (1661 or 1662) and the order of al-Rashid’s campaigns after 1666; the areas drawn are approximate.
  - Dates are Gregorian. The dynasty’s name is also written Alawite or ʿAlawi; its founders claimed descent from the Prophet through al-Hasan and had come to Tafilalt from Arabia in the 13th century.
