  - title: Dila, Marrakesh and the Sous
    date: 1666–1672
    when: "1666-10"
    borders: "1670-06-01"
    countries: [ma]
    body:
      - From Fez al-Rashid turned on the north-west. He defeated Ghailan near Ksar el-Kebir; Ghailan escaped through Asilah to Algiers, and Tetouan, Ksar el-Kebir and Salé submitted. In 1667 he struck at the Dila’iyya, and on 18 June 1668, at Fezzaz in the Middle Atlas, defections in their ranks delivered their army and its leader, a son of Muhammad al-Hajj, into his hands. The zawiya of Dila was razed, and Muhammad al-Hajj and his family were sent into exile in Tlemcen.
      - On 31 July 1668 al-Rashid took Marrakesh after a brief resistance and had its Shabana ruler executed. In the next two years he campaigned in the south, and in 1670 he took the Sous, with Taroudant and Iligh, the seat of the Semlali lords, bringing all of Morocco under one ruler for the first time since 1603. He minted a new coinage and built bridges over the Sebou and in Fez. On 9 April 1672 he died in Marrakesh after a fall from his horse. His half-brother Moulay Ismail, his governor of Meknes, succeeded him and spent his first years putting down rivals in his own family, among them their nephew Ahmad ibn Muhriz.
    facts:
      - [Dila’iyya defeated at Fezzaz, "18 June 1668"]
      - [Marrakesh taken, "31 July 1668"]
      - [Death of al-Rashid, "9 April 1672"]
