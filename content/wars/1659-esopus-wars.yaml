notes:
  - New Netherland used the Gregorian calendar. The wars are known from Dutch records, above all the journal of Martin Cregier and the papers of the colony’s council; numbers of dead and captives come from them.
  - The Esopus were one of several Munsee peoples of the lower and middle Hudson; earlier conflicts with these peoples are told in Kieft’s War.
