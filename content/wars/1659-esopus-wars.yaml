id: esopus-wars
name: Esopus Wars
start: "1659-09-20"
end: "1664-05-16"
tier: C
summary: "Two wars between New Netherland and the Esopus, a Munsee-speaking Lenape people of the mid-Hudson valley around what is now Kingston, New York, over the spread of Dutch farms onto their cornlands. They followed the Peach War of September 1655, when some five hundred Munsee entered New Amsterdam and, after fighting broke out, raided Pavonia and Staten Island, killing some forty colonists and taking about a hundred captive; afterwards Director Peter Stuyvesant made the scattered colonists gather in stockaded villages, among them Wiltwijck at Esopus in 1658. The first war began on 20 September 1659, when colonists fired on a group of Esopus men who had been drinking brandy given to them as wages. The Esopus burned farms and besieged Wiltwijck for weeks; the Dutch burned Esopus fields and stores, and Stuyvesant sent some captured Esopus men as slaves to Curaçao. Peace on 15 July 1660 cost the Esopus land. On 7 June 1663, angered by the land losses and the enslaved captives, Esopus warriors entered Wiltwijck as if to trade, set it on fire and destroyed the new village of Nieuw Dorp (Hurley), killing some twenty colonists and taking about forty-five captive, mostly women and children. Dutch soldiers and militia under Captain Martin Cregier, guided by Mohawk and Wappinger allies, burned the Esopus fields and in September 1663 stormed their new fort near the Shawangunk Mountains, killing the sachem Papequanaehen and freeing many of the captives. A peace in May 1664 ceded more land; under English rule the Esopus sold the rest of their lands over the following decades and many moved away."
