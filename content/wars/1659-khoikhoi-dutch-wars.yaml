  - title: Gonnema’s war
    date: 1673–1677
    when: "1673-07"
    borders: "1674-03-01"
    countries: [za]
    body:
      - By the 1670s the Company traded and allied with several Khoikhoi communities beyond the peninsula, among them the Chainouqua, whose chief the Dutch called Klaas. Gonnema, chief of the Cochoqua, the largest Khoikhoi community near the Cape, with its herds in the Swartland and around Saldanha Bay, resented the Company’s dealings with his rivals. In 1672 and June 1673 his men killed parties of Dutch hunters, and on 6 July 1673 Cochoqua men posing as traders attacked the Company’s post on Saldanha Bay and killed four soldiers.
      - The Company answered with mounted expeditions of soldiers and burghers, guided and joined by Chainouqua allies. In July 1673 Ensign Hieronymus Cruse found a deserted Cochoqua camp and drove off about 800 cattle and 900 sheep, beating off a Cochoqua attempt to recover them. In March 1674 a second expedition seized about 800 cattle and 4,000 sheep near the kloof at present-day Tulbagh. Gonnema struck back at the Company’s allies, raiding Chainouqua herders at the Tygerberg in November 1675, and a further expedition in 1676 took more of his livestock.
      - Weakened by the loss of his herds, Gonnema sent envoys in June 1677, and on 24 June a peace was signed. The Cochoqua were to pay the Company 30 cattle a year, stop raiding and leave its allies alone. The Company, no longer facing a strong Khoikhoi neighbour, founded Stellenbosch in 1679 and spread its farms inland; the Khoikhoi of the south-western Cape, divided and stripped of their cattle, were drawn into colonial service, and the smallpox epidemic of 1713 completed the collapse of their independent communities.
    facts:
      - [Attack on Saldanha Bay post, "6 July 1673"]
      - [Peace with the Cochoqua, "24 June 1677"]
      - [Cochoqua tribute, "30 cattle a year"]
