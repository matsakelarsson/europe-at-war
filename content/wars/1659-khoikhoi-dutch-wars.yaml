steps:
  - title: Doman’s war for the Liesbeek grazing
    date: May 1659 – April 1660
    when: "1659-05"
    borders: "1659-06-01"
    countries: [za]
    view:
      center: [18.50, -33.96]
      size: [70, 55]
    body:
      - The Company’s fort on Table Bay, founded by Jan van Riebeeck in April 1652, depended on cattle and sheep bartered from the Khoikhoi, who moved their herds around the Cape peninsula and the Cape Flats with the seasons. To cut costs the Company released some of its servants in 1657 as free burghers and gave them farms along the Liesbeek River, behind Table Mountain. The farms took the best grazing and water of the Goringhaiqua and Gorachouqua, the Peninsula Khoikhoi, and blocked their routes. Van Riebeeck also seized cattle and hostages in 1658 to force the trade, and sent the interpreter Autshumao, leader of the small Goringhaicona community, to Robben Island.
      - In May 1659 Doman, called Nommoa by his people, a Khoikhoi interpreter who had been taken to Batavia and come back convinced that the Dutch meant to stay, led the Goringhaiqua and Gorachouqua in raids on the burghers’ cattle. He timed them for the wet winter, when the settlers’ matchlock muskets could not be fired. The burghers abandoned their farms and took refuge at the fort, and the Company ordered that Khoikhoi found near the settlement be seized or shot. In August it built three redoubts, Kijkuit, Keert de Koe and Ruijterwacht, along the Liesbeek. Doman was wounded in a skirmish, and his raiders lost the initiative.
      - At the peace talks in April 1660, Van Riebeeck recorded, the Khoikhoi envoys complained that the Dutch were taking more and more of the land that had always been theirs, and asked whether they would be allowed to do the same if they came to Holland. He told them that they had lost the land in war and could not expect it back. By the peace of 6 April 1660 the settlers kept their farms, the Khoikhoi were to enter the settlement only by fixed paths for trade, and neither side would punish the other for the war. Van Riebeeck then closed the boundary with a line of watch-houses linked by fences and a hedge of wild almond, part of which still grows at Kirstenbosch.
