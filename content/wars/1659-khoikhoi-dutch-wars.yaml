id: khoikhoi-dutch-wars
name: Khoikhoi–Dutch wars
start: "1659-05"
end: "1677-06-24"
tier: B
summary: "Two wars between the Dutch East India Company’s station at the Cape of Good Hope and the Khoikhoi, the herding peoples of the south-western Cape. The Company founded its refreshment station on Table Bay in 1652 to supply its ships with meat bought from the Khoikhoi. In 1657 it settled free burghers on farms along the Liesbeek River, on the dry-season grazing of the Peninsula Khoikhoi, and in May 1659 Doman (Nommoa), a Khoikhoi interpreter who had been to Batavia, led the Goringhaiqua and Gorachouqua in raids on the farms’ cattle, striking in the rain when the settlers’ matchlocks would not fire. The Company built a line of watch-houses and later planted a hedge of wild almond to close the settlement, and the peace of April 1660 left the settlers on the land they had taken. In 1673–1677 the Company fought the Cochoqua of the chief Gonnema, the largest Khoikhoi community near the Cape, who had killed hunting parties and attacked the Company’s post at Saldanha Bay. Company soldiers, burghers and Khoikhoi allies, the Chainouqua among them, raided the Cochoqua and carried off thousands of cattle and sheep, until Gonnema made peace in June 1677 and agreed to a yearly tribute of cattle. The wars opened the way for Dutch settlement beyond the peninsula; over the next decades the Khoikhoi of the south-western Cape lost their herds and grazing, and with the smallpox epidemic of 1713 their independence, and most became labourers on colonial farms."
countries: [za, nl]
sides:
