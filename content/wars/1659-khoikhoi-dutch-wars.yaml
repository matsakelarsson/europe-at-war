notes:
  - "Almost everything known about the wars comes from the Company’s own records, above all Jan van Riebeeck’s journal; there is no Khoikhoi account. The names of Khoikhoi groups are given as the Dutch wrote them. Older writers called the Khoikhoi “Hottentots”, a name now regarded as offensive."
