  - title: The Utrecht redoubt and the surrender
    date: January – February 1662
    when: "1662-01-25"
    borders: "1662-02-01"
    countries: [tw, nl]
    view:
      center: [120.19, 23.01]
      size: [40, 40]
    body:
      - Late in 1661 a German sergeant, Hans Jürgen Radis, deserted to Koxinga and told him that the castle depended on the Utrecht redoubt, a small fort on the dune above it. Coyett’s account blames him for what followed; Chinese records do not mention him. Koxinga built batteries in the European manner and, on 25 January 1662, bombarded the redoubt with some 2,500 shots in a day. The Dutch abandoned it that evening, leaving a charge that blew it up, and Koxinga’s guns could now fire down into the castle.
      - On 27 January Coyett’s council voted to negotiate. Under the treaty of 1 February 1662 the Company gave up the castle, its guns and its stores of trade goods, and its people were allowed to leave with their personal belongings and enough food to reach Batavia. They sailed on 9 February. Koxinga renamed Tayouan Anping, after his home town in Fujian, and began settling his soldiers and their families on the land. He died on 23 June 1662, probably of malaria, aged 37, and his son Zheng Jing ruled Taiwan after him. The Dutch returned to the coast in 1663–1664 in alliance with the Qing, helping to drive the Zheng from Xiamen and Kinmen, and held Keelung in the north of the island from 1664 to 1668, but never regained Tayouan.
    facts:
      - [Utrecht redoubt abandoned, "25 January 1662"]
      - [Treaty of surrender, "1 February 1662"]
      - [Dutch departure, "9 February 1662"]
      - [Death of Koxinga, "23 June 1662"]
