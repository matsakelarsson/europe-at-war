id: siege-of-fort-zeelandia
name: Siege of Fort Zeelandia
start: "1661-04-30"
end: "1662-02-01"
tier: B
summary: "The Ming loyalist commander Zheng Chenggong (Koxinga) took Taiwan from the Dutch East India Company (VOC) in 1661–1662. Defeated before Nanjing in 1659 and squeezed by the Qing on the Fujian coast, he needed a new base. On 30 April 1661 his fleet of several hundred junks, carrying about 25,000 men, slipped through the shallow Luermen channel into the bay behind Tayouan, landed on the main island, routed a Dutch sortie and forced Fort Provintia to surrender within days. Governor Frederick Coyett held Fort Zeelandia, the Company’s castle on the Tayouan sandbar, through a nine-month siege. A relief fleet from Batavia failed to break the blockade, and after a deserter showed Koxinga how to take the Utrecht redoubt overlooking the castle, Coyett surrendered on 1 February 1662. Koxinga made Taiwan the seat of a Zheng state, later called the Kingdom of Tungning, and died there in June 1662."
countries: [tw, cn, nl]
