steps:
  - title: The landing at Luermen
    date: April – May 1661
    when: "1661-04-30"
    borders: "1661-04-29"
    countries: [tw, cn, nl]
    body:
      - The Dutch East India Company had held Tayouan, on the south-west coast of Taiwan, since 1624. Its castle, Fort Zeelandia, stood on a long sandbar across the bay from the main island, where the smaller Fort Provintia guarded the Chinese settlers’ town of Sakam. Tens of thousands of farmers from Fujian worked the land under Company rule, and many villages of the plains peoples paid it tribute. After his defeat at Nanjing in 1659 and a narrow victory over a Qing fleet at Xiamen in 1660, Zheng Chenggong, known to Europeans as Koxinga, looked for a base beyond the Qing’s reach. A former Company interpreter, He Bin, brought him maps and told him that his junks could enter the bay at high tide by the shallow Luermen channel, which the Dutch thought unusable for large ships.
      - Koxinga sailed from Kinmen in late April 1661 and, after waiting for wind at Penghu, appeared off Tayouan at dawn on 30 April. While the castle watched, his junks passed through the Luermen channel and landed thousands of men on the main island and on the Baxemboy sandbar north of the castle. On 1 May the Dutch struck back on land and sea. Captain Thomas Pedel led about 240 musketeers against the troops on Baxemboy, expecting the Chinese to run; they were outflanked, and Pedel and about half his men were killed. In the bay the Company’s largest ship, the Hector, blew up in battle with the junks.
      - Fort Provintia, held by about 140 soldiers under the landdrost Jacobus Valentijn, was cut off without water and surrendered on 4 May. Koxinga demanded the surrender of Zeelandia as well, offering the Dutch free departure with their goods. Coyett refused, and the Dutch burned the Chinese town around the castle and pulled its people inside.
    facts:
      - [Zheng force, "about 25,000 men in several hundred junks"]
      - [Garrison of Fort Zeelandia, "about 1,700 people, some 900 of them soldiers"]
      - [Pedel’s sortie, "1 May 1661, about 240 men, half killed"]
      - [Fort Provintia surrendered, "4 May 1661"]
