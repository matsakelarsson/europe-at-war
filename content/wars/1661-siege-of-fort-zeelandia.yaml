notes:
  - Dates are given in the Western (Gregorian) calendar used by the Dutch records. Chinese accounts use the lunar calendar of the Yongli reign, which Koxinga still followed; the landing on the first day of the fourth month corresponds to 29–30 April 1661.
  - Most of the detail comes from the Dutch side, from the Zeelandia daily journals and from ’t Verwaerloosde Formosa (1675), a defence written for Coyett after the Company had tried him and banished him to the Banda Islands. Chinese sources include the memoir of Koxinga’s quartermaster Yang Ying. Numbers of troops and losses differ between them.
