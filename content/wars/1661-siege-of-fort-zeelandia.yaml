  - title: Nine months behind the walls
    date: May 1661 – January 1662
    when: "1661-08"
    borders: "1661-08-12"
    countries: [tw, nl]
    view:
      center: [120.25, 23.05]
      size: [110, 110]
    body:
      - In late May Koxinga’s gunners bombarded the castle and his troops stormed it, but Dutch cannon fire broke the assault with heavy losses; Dutch accounts put the attackers’ dead at about a thousand. Koxinga settled down to a blockade and sent much of his army out across the plains to grow food, for his own supplies were running short. Many villages of the plains peoples submitted to him. Dutch men caught in the countryside, among them the minister Antonius Hambroek, were taken prisoner; Hambroek, sent into the castle with a call to surrender, urged the garrison to hold out, returned to Koxinga’s camp as he had promised, and was later executed with other prisoners.
      - A ship that slipped past the junks on 1 May reached Batavia in June, and the Company sent a relief fleet of about ten ships and 700 soldiers under Jacob Caeuw. It came in sight of Tayouan on 12 August, but storms drove it out to sea for weeks. When the Dutch finally attacked the Zheng positions and junks in the bay that autumn, the assault failed with the loss of two ships, several boats and about 130 men. In November the Qing governor-general of Fujian offered to join the Dutch against the Zheng bases on the mainland; Caeuw left with three ships in December to meet the Qing fleet, but sailed on to Siam and Batavia instead.
      - Disease and hunger thinned the garrison. By the winter only a few hundred men were fit to fight, while the castle’s guns kept the besiegers at a distance.
    facts:
      - [Failed assault on the castle, "late May 1661"]
      - [Relief fleet, "about 10 ships and 700 soldiers, sighted 12 August 1661"]
      - [Dutch counter-attack in the bay, "autumn 1661, about 130 men lost"]
