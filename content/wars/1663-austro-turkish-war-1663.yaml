notes:
  - Dates are Gregorian. Sources disagree on the date of Érsekújvár’s surrender, giving dates between 13 and 26 September 1663.
  - Nikola Zrinski (in Hungarian Zrínyi Miklós), poet and general, was the great-grandson of the defender of Szigetvár in 1566. He died in a hunting accident in November 1664. The anger at the Peace of Vasvár fed the Magnate Conspiracy, whose leaders, among them his brother Petar Zrinski and Fran Krsto Frankopan, were executed in 1671.
  - The war grew out of the Transylvanian–Ottoman war of 1658–1662, which has its own entry.
