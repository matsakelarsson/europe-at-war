id: austro-turkish-war-1663
name: Austro-Turkish War (1663–1664)
start: "1663"
end: "1664-08-10"
tier: B
summary: A war between Emperor Leopold I and the Ottoman Empire, revived under the Köprülü grand viziers. Fazıl Ahmed Pasha took Érsekújvár in 1663, and the Croatian–Hungarian ban Nikola Zrinski answered with a daring winter raid that burned the Ottoman bridge at Osijek. An imperial army with German and French contingents under Raimondo Montecuccoli won at Saint Gotthard in August 1664, but the Peace of Vasvár nine days later left the Ottomans their conquests and angered the Hungarian nobility.
