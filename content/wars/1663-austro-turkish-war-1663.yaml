  - title: Saint Gotthard and Vasvár
    date: April – August 1664
    when: "1664-04-28"
    borders: "1664-08-10"
    countries: [hu, hr, at, sk, ro, tr]
    body:
      - In late April Zrinski and the imperial general Wolfgang Julius von Hohenlohe besieged Kanizsa, but they could not breach its walls, and on 2 June, as the grand vizier’s army approached, they withdrew. The Ottomans then besieged Novi Zrin, and Montecuccoli would not risk an attack to save it; the fortress was destroyed on 7 July. Fazıl Ahmed marched north towards Styria. On 1 August Montecuccoli’s imperial army, with troops of the Empire and a French corps of 6,000 sent by Louis XIV, met him at the Rába between Mogersdorf and the abbey of Szentgotthárd. Ottoman troops crossed the river and drove back the imperial centre, but a counter-attack threw them back into the swollen river with heavy losses.
      - In the north Jean-Louis Raduit de Souches retook Nitra and won at Léva. Yet on 10 August, nine days after the battle, Leopold’s envoy signed the Peace of Vasvár. The emperor, worried about France and the Spanish succession, accepted a twenty-year truce in which the Ottomans kept Várad, Érsekújvár and Nógrád, both armies left Transylvania, whose Ottoman-backed prince Michael I Apafi was recognised, and Leopold sent the sultan a “gift” of 200,000 florins. Many Hungarian and Croatian nobles saw it as a betrayal.
    facts:
      - [Battle of Saint Gotthard, "1 August 1664, imperial victory"]
      - [Peace of Vasvár, "10 August 1664, a twenty-year truce"]
      - [Ottomans keep, "Várad, Érsekújvár and Nógrád"]
