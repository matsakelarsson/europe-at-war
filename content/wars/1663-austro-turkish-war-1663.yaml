steps:
  - title: Érsekújvár and the winter campaign
    date: 1663 – February 1664
    when: "1663-04"
    borders: "1664-02-01"
    countries: [sk, hu, hr, cz, tr]
    body:
      - After the Ottomans crushed Transylvania’s bid for independence and took Várad in 1660, Leopold I sent troops under Raimondo Montecuccoli into Transylvania, and the ban of Croatia, Nikola Zrinski, raided Ottoman land from his new fortress of Novi Zrin on the Mura. In 1663 the grand vizier Köprülü Fazıl Ahmed Pasha led a large army, perhaps 100,000 men, up the Danube. On 7 August it routed a force under Ádám Forgách, commander of Érsekújvár, at Párkány, and then besieged his fortress, the chief Habsburg stronghold north of the Danube, which surrendered on terms in September.
      - Ottoman and Tatar raiders crossed the Váh and devastated western Upper Hungary and Moravia, carrying off thousands of captives, and Nógrád fell too. Zrinski struck back in midwinter. In January 1664, with about 25,000 Croatian, Hungarian and German troops, he marched some 240 kilometres down the Drava, taking Berzence and Babócsa and burning the town of Pécs, and on 1 February he set fire to the Ottoman army’s great wooden bridge across the Drava marshes at Osijek. The raid made him famous throughout Europe.
    facts:
      - [Battle of Párkány, "7 August 1663, Ottoman victory"]
      - [Érsekújvár surrenders, September 1663]
      - [Osijek bridge burned, 1 February 1664]
