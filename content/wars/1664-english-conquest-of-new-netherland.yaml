steps:
  - title: Nicolls takes New Amsterdam
    date: August – October 1664
    when: "1664-08"
    borders: "1664-09-08"
    countries: [us]
    body:
      - New Netherland had grown to some 7,000 to 9,000 colonists, Dutch, Walloon, German, Scandinavian and English, with enslaved Africans, but it lay between New England and Virginia, and English towns on Long Island and in Connecticut pressed on its borders. In March 1664 Charles II gave his brother James, Duke of York, a charter for all the land between the Connecticut and the Delaware, and in late August four ships under Richard Nicolls, carrying some 450 men, most of them soldiers, anchored in Gravesend Bay below New Amsterdam. Militia from Long Island and Connecticut joined them, and Nicolls offered the colonists their property, trade and religion if they surrendered.
      - Peter Stuyvesant, with about 150 soldiers, little powder and a fort open on the land side, wanted to fight. The town’s leading citizens, among them his own son, petitioned him to give up rather than see the town sacked, and the West India Company had sent no help. The articles of surrender were agreed on 6 September, and on 8 September the Dutch garrison marched out of Fort Amsterdam. The town and the province were renamed New York after the duke, and when Fort Orange surrendered later that month it became Albany. On the Delaware, Sir Robert Carr attacked the fort at New Amstel in October, killed three of its defenders, plundered the town and sold some of the captured soldiers as servants in Virginia.
      - England declared war on the Dutch Republic in March 1665. In the Treaty of Breda, signed on 31 July 1667, each side kept what it held, so England kept New Netherland and the Dutch kept Suriname, which they had taken that year.
    facts:
      - [Nicolls’s force, "4 ships, about 450 men"]
      - [New Amsterdam surrendered, "8 September 1664"]
      - [Treaty of Breda, "31 July 1667"]
