notes:
  - England and its colonies used the Julian calendar (Old Style) and the Dutch the Gregorian, which ran ten days ahead; dates here are Gregorian. The surrender of New Amsterdam is often dated 27 August or 29 August 1664 (Old Style), and the Dutch recapture 30 July 1673 (Old Style).
  - The naval wars in Europe are told in the Second and Third Anglo-Dutch Wars. The Munsee, Mohawk and Mahican nations around the colony, whose lands both powers claimed, took no part in the fighting; the Mohawk renewed their alliance with the English at Albany in 1664.
