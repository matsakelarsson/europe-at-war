id: english-conquest-of-new-netherland
name: English conquest of New Netherland
start: "1664-08"
end: "1674-11-10"
tier: B
summary: "The English seizure of the Dutch colony of New Netherland in 1664, its brief Dutch recapture in 1673–1674 and its final return to England. In March 1664 Charles II granted the land between the Connecticut and the Delaware to his brother James, Duke of York, and sent four ships with some 450 men under Richard Nicolls, though England and the Dutch Republic were at peace. Outnumbered, short of powder and pressed by the townspeople, Peter Stuyvesant surrendered New Amsterdam without a fight on 8 September 1664; it became New York, Fort Orange became Albany, and in October Sir Robert Carr took New Amstel on the Delaware by storm. The seizure was one of the causes of the Second Anglo-Dutch War, and at the Peace of Breda in 1667 the Dutch let England keep the colony while they kept Suriname. In the Third Anglo-Dutch War a Dutch squadron under Cornelis Evertsen the Youngest and Jacob Binckes retook New York on 9 August 1673 and renamed it New Orange, but the Treaty of Westminster gave it back, and the Dutch governor Anthony Colve handed it over to Edmund Andros on 10 November 1674. The Dutch colonists kept their property, religion and inheritance customs under the English."
countries: [us]
sides:
  - id: en
    name: England (the Duke of York’s province of New York)
    polities: [british-america, england]
    ink: red
    moves: English moves
    success: English success
  - id: nn
