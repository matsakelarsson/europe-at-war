  - title: The Dutch recapture, 1673–1674
    date: August 1673 – November 1674
    when: "1673-08"
    borders: "1673-08-09"
    countries: [us]
    body:
      - In the Third Anglo-Dutch War a squadron from Zeeland under Cornelis Evertsen the Youngest and one from Amsterdam under Jacob Binckes raided the English and French West Indies and in July 1673 fell on the Virginia and Maryland tobacco fleet in the James River, taking or burning much of it. Learning that New York was weakly held, they sailed north and on 7 August anchored off Manhattan with some twenty ships and about 1,600 men. Governor Francis Lovelace was away in Connecticut. After a short bombardment some six hundred Dutch marines landed north of the town under Anthony Colve, and on 9 August Captain John Manning surrendered Fort James and its garrison of fewer than a hundred men.
      - The Dutch renamed the city New Orange and Albany Willemstad, and made Colve governor. The Dutch towns and New Jersey submitted; the English towns at the east end of Long Island, backed by Connecticut, refused, and in December 1673 Maryland troops burned the Dutch settlement at the Whorekill (Lewes) on the Delaware. Colve strengthened the fort against an attack from New England. But in the Treaty of Westminster in February 1674 the Dutch Republic, needing peace with England, gave the colony back. On 10 November 1674 Colve handed New Orange to the new English governor, Edmund Andros, and it became New York for good.
    facts:
