  - title: A kingdom of mountain strongholds
    date: 1678–1704
    when: "1688"
    borders: "1700-01-01"
    countries: [ao]
    body:
      - With São Salvador in ruins, the claimants ruled from mountain fortresses. The Kinlaza line of Pedro III held Mbula, or Lemba, in the north; Pedro III was murdered under a flag of truce in 1680 by Manuel de Nóbrega, brother of Daniel I, and his younger brother João II succeeded him there. Another Kinlaza branch held the mountain of Kibangu, in the Serra do Canda, which João II tried and failed to take. The Kimpanzu, led by Manuel de Nóbrega and the old queen Suzana de Nóbrega, ruled Mbamba Lovata on the southern border of Soyo and, with Soyo’s backing, made war on the Kinlaza within their reach. In 1688 two brothers of the Água Rosada family, born of a Kimpanzu father and a Kinlaza mother, overthrew the king of Kibangu; the elder, Álvaro X, ruled there until his death in December 1695, and the younger succeeded him as Pedro IV.
      - Without a centre for trade and government, the kingdom ceased to function as a state for two decades. Whole populations were called up for the armies, neighbouring peoples were hired as soldiers, and the captives every faction took, its rivals’ partisans and their families, were sold to Atlantic slave traders, at Loango to the Dutch and English and at Luanda to the Portuguese. Pedro IV worked for a settlement through negotiation, with the help of the Kinlaza matriarch, Queen Ana Afonso de Leão, and of Capuchin missionaries; most claimants, even the Kimpanzu, came to acknowledge him, but João II did not, and Pedro, briefly crowned in the ruined capital in the 1690s, withdrew again to Kibangu. After 1700 he sent groups of settlers to reoccupy São Salvador.
    facts:
      - [Pedro III murdered, "1680"]
      - [Água Rosada take Kibangu, "1688"]
      - [Pedro IV king at Kibangu, "December 1695"]
