  - title: Kimpa Vita and Pedro IV’s restoration
    date: 1704–1709
    when: "1709-02-15"
    borders: "1709-10-04"
    countries: [ao]
    body:
      - "Beatriz Kimpa Vita, a young noblewoman born near Mount Kibangu about 1684, fell ill in 1704 and declared that St Anthony had taken possession of her. She preached that Christ was angered by the civil wars and that Kongo must be reunited under one king, taught that Jesus, Mary and St Francis had been Kongolese, burned charms (minkisi) and denounced the Capuchin missionaries. After Pedro IV and João II refused to heed her, she led her followers into the ruins of São Salvador in late 1704 or 1705, and thousands, most of them peasants tired of war, came to resettle the capital. Her movement, the Antonians, spread into Mbamba Lovata, and Pedro Constantinho da Silva Kibenga, a commander Pedro IV had sent to reoccupy the city, joined her and turned against the king. In 1706 she was captured near her home, tried under Kongo law with the counsel of the Capuchins Bernardo da Gallo and Lorenzo da Lucca, and burned as a heretic at Evululu, Pedro IV’s camp, on 2 July 1706."
      - On 15 February 1709 Pedro IV marched on São Salvador and routed the Antonians; Kibenga was beheaded as he tried to surrender, and most of the movement’s noble followers returned to the Church. More than 30,000 Antonians are said to have been sold into the Atlantic slave trade. The survivors fled to Mbula, and on 4 October 1709, St Francis’s Day, João II’s army, coming south against Pedro, was defeated in the Mbula country; Pedro renamed his base São Francisco de Kibangu in gratitude. He then pardoned the Kimpanzu, made their leading claimant, Manuel Makasa, his son-in-law and heir, and established a rotation of the crown between the branches. When Pedro IV died in 1718 the capital was again at São Salvador, but Kongo remained a loose union of provinces. Kimpa Vita’s movement left its mark on Kongo religious art, and some see later Congolese prophetic churches, such as Kimbanguism, as its successors.
    facts:
      - [Antonians reoccupy São Salvador, "Late 1704 or 1705"]
      - [Kimpa Vita burned at Evululu, "2 July 1706"]
      - [Pedro IV takes São Salvador, "15 February 1709"]
