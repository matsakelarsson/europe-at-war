notes:
  - "The war is unusually well documented for its last years, thanks to the reports of Italian Capuchin missionaries, above all Bernardo da Gallo and Lorenzo da Lucca, and the records of Kimpa Vita’s trial, studied by John Thornton in The Kongolese Saint Anthony (1998). The early years rest on fewer sources, and the order and dates of the kings of the 1660s and 1670s differ in detail between historians."
  - "Kongo’s factions were branches (kanda) of one royal lineage descended from King Afonso I; the Água Rosada of Kibangu, Pedro IV’s family, descended from both the Kinlaza and the Kimpanzu. All of them were Catholic. The exact locations of Kibangu (in the Serra do Canda), Mbula and Mbamba Lovata are not shown on the map."
