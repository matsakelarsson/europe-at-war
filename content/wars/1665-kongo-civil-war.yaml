id: kongo-civil-war
name: Kongo Civil War
start: "1665-10-29"
end: "1709-10-04"
tier: B
summary: "The war of succession that divided the Kingdom of Kongo for more than forty years after King António I was killed by the Portuguese at Mbwila in 1665. Two branches of the royal family, the House of Kinlaza, to which António belonged, and the House of Kimpanzu, fought for the throne, while the rulers of Soyo, the da Silva, made and unmade kings. In 1678 the Kinlaza king Pedro III, with hired Jaga soldiers, attacked São Salvador (Mbanza Kongo), killed the Kimpanzu king Daniel I and burned the city, and the old capital was abandoned. For a generation rival kings ruled from mountain strongholds: the Kinlaza at Mbula (Lemba) and Kibangu, the Kimpanzu at Mbamba Lovata on Soyo’s border. From 1704 a young noblewoman, Beatriz Kimpa Vita, who said that St Anthony had possessed her, led thousands of followers, the Antonians, to resettle the ruined capital and demand a reunited kingdom; King Pedro IV of Kibangu had her burned as a heretic on 2 July 1706. On 15 February 1709 Pedro IV took São Salvador from the Antonians, and on 4 October 1709 he defeated his last Kinlaza rival, João II, at Mbula. He pardoned the Kimpanzu and arranged for the crown to rotate between the branches, which kept a fragile peace for half a century, but Kongo never regained its former power. The war fed the Atlantic slave trade: every faction sold captives, and more than 30,000 Antonians are said to have been sold after Pedro IV’s victory, through Loango to Dutch and English ships bound for the Caribbean and North America and through Luanda to Brazil."
