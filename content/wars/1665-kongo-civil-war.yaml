steps:
  - title: Soyo’s kings and the fall of São Salvador
    date: 1665–1678
    when: "1666"
    borders: "1678-12-31"
    countries: [ao]
    body:
      - At Mbwila the Portuguese killed António I and many of the Kinlaza nobility and captured the boy heir, and Kongo had no undisputed successor. The Kinlaza, the line of Garcia II and António, were opposed by the Kimpanzu, an older branch whose partisans had found refuge in Soyo, the coastal province ruled by the da Silva family that had become all but independent in Garcia’s reign. A Kimpanzu partisan, Afonso II, took the throne first, but the Kinlaza forced him out in favour of Álvaro VII. Álvaro made himself hated, and in 1666 the army of Soyo marched on São Salvador and helped the people overthrow and kill him. Under Soyo’s eye the electors chose Álvaro VIII, another Kinlaza, and when the next Kinlaza king, Pedro III, crowned in January 1669, proved less pliant, Soyo removed him too and put a Kimpanzu, Álvaro IX, on the throne. Pedro III fled north to Mbula (Lemba).
      - In 1670 Rafael I, a Kinlaza, overthrew Álvaro IX and called in the Portuguese against Soyo, whose army destroyed theirs at Kitombo on 18 October 1670 (see the Kongo–Portuguese wars). Kings followed one another quickly. In 1678 Pedro III marched on São Salvador with Jaga mercenaries; in the battle the Kimpanzu king Daniel I was killed and most of the city was burned. The capital, with its cathedral and churches, was abandoned, and rival claimants could only crown themselves among the ruins and withdraw before their enemies came.
    facts:
      - [Soyo overthrows Álvaro VII, "1666"]
      - [Pedro III crowned, "January 1669"]
      - [São Salvador sacked and abandoned, "1678"]
