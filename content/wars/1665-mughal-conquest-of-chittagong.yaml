id: mughal-conquest-of-chittagong
name: Mughal conquest of Chittagong
start: "1665-11"
end: "1666-01-27"
tier: C
summary: "The campaign in which the Mughal governor of Bengal, Shaista Khan, took Chittagong from the kingdom of Arakan (Mrauk U). For decades Arakanese fleets and the Portuguese freebooters settled at Chittagong had raided the rivers of lower Bengal for slaves and plunder, and Arakan had sheltered Aurangzeb’s fugitive brother Shah Shuja. Shaista Khan built a new war fleet at Dhaka, took the island of Sandwip in November 1665 with Dutch help and won over the Portuguese of Chittagong, who changed sides with their ships. His son Buzurg Umed Khan advanced with an army along the coast while the fleet beat the Arakanese navy at the mouth of the Karnaphuli; after a short siege the fort of Chittagong surrendered on 27 January 1666. The town was renamed Islamabad and became the seat of a Mughal faujdar. Arakan’s attempts to retake it failed, and Chittagong remained part of Mughal Bengal until it was ceded to the East India Company in 1760."
