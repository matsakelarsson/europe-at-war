steps:
  - title: Lowestoft and the Four Days’ Battle
    date: 1664–1666
    when: "1665-03-04"
    borders: "1666-08-20"
    countries: [gb, nl]
    body:
      - Rivalry over trade in Africa, Asia and America brought the two Protestant sea powers back to war, eleven years after their first. English ships seized Dutch trading posts in West Africa in 1664 and New Amsterdam, which became New York, in September, and England declared war in March 1665. On 13 June 1665 the fleets met off Lowestoft. The English, under the King’s brother James, Duke of York, won. The Dutch flagship blew up with Lieutenant-Admiral van Wassenaer van Obdam, and the Dutch lost about 17 ships. The Grand Pensionary, Johan de Witt, rebuilt the fleet under Michiel de Ruyter, while England was struck by the Great Plague.
      - France and Denmark–Norway joined the Dutch in 1666, though France did little. On 11–14 June 1666 de Ruyter beat the English fleet under George Monck and Prince Rupert in the Four Days’ Battle, one of the longest sea battles ever fought; the English lost about ten ships and thousands of men killed or captured. The English replied by winning the St James’s Day Battle on 4–5 August, and on 19–20 August Sir Robert Holmes burned about 150 merchant ships in the Vlie and the town of West-Terschelling, a raid remembered as Holmes’s Bonfire. Weeks later the Great Fire destroyed much of London.
    facts:
      - [Battle of Lowestoft, "13 June 1665, English victory"]
      - [Four Days’ Battle, "11–14 June 1666, Dutch victory"]
      - [Holmes’s Bonfire, "19–20 August 1666"]
