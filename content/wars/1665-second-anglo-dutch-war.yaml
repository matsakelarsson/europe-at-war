id: second-anglo-dutch-war
name: Second Anglo-Dutch War
start: "1665-03-04"
end: "1667-07-31"
tier: B
summary: A naval war between England and the Dutch Republic over trade and colonies, in which France and Denmark–Norway joined the Dutch and the Bishop of Münster attacked them by land. After an English victory off Lowestoft and a Dutch one in the Four Days’ Battle, the Dutch raid on the Medway in 1667 hastened the Treaty of Breda, which left England with New York and the Dutch with Suriname.
