  - title: The Medway and the Peace of Breda
    date: 1667
    when: "1667-06-19"
    borders: "1667-07-31"
    countries: [gb, nl]
    body:
      - Short of money after the plague and the fire, Charles II laid up his largest ships at Chatham while peace talks went on at Breda. Johan de Witt decided to force the issue. In June 1667 a Dutch fleet under de Ruyter, with de Witt’s brother Cornelis on board, entered the Thames estuary, took the unfinished fort at Sheerness on 20 June and pushed up the Medway. On 22–23 June Dutch sailors broke the chain across the river at Gillingham, burned several of the greatest English warships off Chatham and towed away the flagship Royal Charles.
      - It was one of the worst defeats in the history of the Royal Navy, and the Dutch fleet blockaded the Thames for weeks, causing panic in London. The Treaty of Breda was signed on 31 July 1667. Each side kept what it held, so England kept New York and the Dutch kept Suriname, which they had taken that year, and the spice island of Run in the East Indies. The Navigation Acts were eased to let Dutch ships carry goods from Germany to England. The stern of the Royal Charles is still on show in the Rijksmuseum in Amsterdam.
    facts:
      - [Raid on the Medway, "20–24 June 1667, Dutch victory"]
      - [Treaty of Breda, "31 July 1667"]
      - [Kept by England, "New York (New Netherland)"]
