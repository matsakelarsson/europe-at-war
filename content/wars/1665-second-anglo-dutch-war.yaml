notes:
  - Dates are New Style (Gregorian), as used in the Dutch Republic. English accounts usually give Old Style dates, ten days earlier; the Four Days’ Battle, for example, was 1–4 June 1666 Old Style.
  - The war was also fought off West Africa, in North America and in the Caribbean, which are not shown on the map.
