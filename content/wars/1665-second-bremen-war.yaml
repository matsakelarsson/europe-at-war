tier: B
summary: A second Swedish attempt to subdue the city of Bremen, which refused to do homage to the young Charles XI. German princes, Denmark–Norway and the Dutch Republic backed the city, and Sweden had to give up the attempt at the Peace of Habenhausen in 1666.
