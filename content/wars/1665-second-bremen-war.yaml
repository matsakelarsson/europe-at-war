    body:
      - Bremen refused to swear allegiance to the new boy king, Charles XI, and in March 1665 the Swedish council decided on war. Early in 1666 Carl Gustaf Wrangel marched from Pomerania with about 14,000 men, and by the summer Swedish troops held all of Bremen’s lands except the city itself.
      - Bremen found allies. Brunswick-Lüneburg and the Elector of Cologne raised a relief army, and Brandenburg, Denmark–Norway and the Dutch Republic joined against Sweden. Wrangel could not take the city and opened talks at his headquarters in Habenhausen.
