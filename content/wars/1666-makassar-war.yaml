  - title: The war renewed, Siang and Maros
    date: April – October 1668
    when: "1668-08-12"
    borders: "1668-08"
    countries: [id, nl]
    body:
      - In April 1668 Gowa took up arms again. An epidemic that spring and summer killed hundreds of Company soldiers and thousands of local people, and at one point only 250 European soldiers were fit for duty; Speelman sent to Batavia for reinforcements.
      - On 11–12 August Gowa’s troops came out of their fortifications, and a large army marched north, half of it to Maros and half to Siang, with Hasanuddin’s own bodyguard and Malay fighters among them. At Siang on 12 August the Makassarese attacked the Bugis with cannon and small arms and were beaten off, losing 65 men; at Maros they were forced to retreat by 14 August. Some 5,000 Bugis then marched on Gowa while 2,000 held Maros, and the Company rewarded their leaders.
      - On 12 October 1668 the Company and the Bugis defeated Gowa’s forces in a major battle before Makassar. Speelman thought it could have decided the war if the victory had been pressed, but Arung Belo Tosa’deng, Arung Palakka’s closest companion, was killed, and his death was a heavy blow to Bugis morale.
    facts:
      - [War resumes, "April 1668"]
      - [Battles of Siang and Maros, "12–14 August 1668"]
      - [Battle before Makassar, "12 October 1668"]
