  - title: Speelman’s fleet and the Makassarese at Buton
    date: November 1666 – January 1667
    when: "1667-01-04"
    borders: "1667-01-04"
    countries: [id, nl]
    body:
      - On 24 November 1666 Admiral Cornelis Speelman sailed from Batavia with the flagship Tertholen and twenty other ships carrying about 1,860 men, 818 Dutch sailors, 578 Dutch soldiers and 395 Ambonese troops under Captain Jonker and Bugis under Arung Palakka and Arung Belo Tosa’deng. The Sultan of Ternate promised war canoes. In December the fleet arrived off Makassar; talks led nowhere, and Speelman bombarded the shore and sailed south along the coast, burning villages and rice stores at Bantaeng and elsewhere.
      - Meanwhile a large Makassarese army under Karaeng Bontomarannu had landed on Buton, the island sultanate south-east of Sulawesi that was the Company’s ally, and was besieging its capital, Wolio. Speelman sailed there at the end of December. Arung Palakka called on the Bugis serving in the Makassar army to change sides, and on 4 January 1667 the Makassarese army surrendered to the Company. Thousands were taken prisoner, many of the Bugis among them joined Arung Palakka, and on 31 January the Company and Buton made an alliance.
    facts:
      - [Speelman’s fleet, "21 ships, about 1,860 men"]
      - [Makassarese army at Buton surrenders, "4 January 1667"]
      - [Alliance with Buton, "31 January 1667"]
