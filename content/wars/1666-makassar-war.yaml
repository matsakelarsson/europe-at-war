  - title: The Treaty of Bungaya
    date: November 1667
    when: "1667-11-18"
    borders: "1667-11-18"
    countries: [id, nl]
    body:
      - On 18 November 1667, at Bungaya near Barombong, Sultan Hasanuddin and the princes of Gowa and Tallo signed the treaty that Speelman dictated. All Europeans other than the Dutch were to leave Makassar, and the English traders there were taken prisoner. The Company received a monopoly of Makassar’s trade and the fort of Ujung Pandang north of Somba Opu, and all of Gowa’s other forts except Somba Opu were to be razed. Gowa gave up its claims to Bone and the Bugis lands, to Buton and to its overseas dependencies, paid a large indemnity and became a vassal of the Company.
      - To the Company the treaty was a triumph, and Batavia held a day of celebration when the news arrived in March 1668. To Gowa’s nobles it was a humiliation they had signed under duress, and Gowa did not carry it out. Speelman, his force reduced by disease, knew that Somba Opu still stood with its guns.
    facts:
      - [Treaty of Bungaya, "18 November 1667"]
      - [Ceded to the Company, "Ujung Pandang, later Fort Rotterdam"]
    markers:
