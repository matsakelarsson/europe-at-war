  - title: The fall of Somba Opu
    date: June 1669
    when: "1669-06-22"
    borders: "1669-06-24"
    countries: [id, nl]
    body:
      - With reinforcements from Batavia Speelman began the siege of Somba Opu, the brick citadel at the mouth of the Garassi (Jeneberang) river. For the final assault he gathered about 2,000 Bugis, 572 men from Ternate, Tidore, Bacan, Buton and Pampanga in the Philippines, and only 83 Dutch soldiers and 11 sailors; three small ships and a sloop were sent up the river to attack from the south. The Bugis were divided into six bodies, and Arung Palakka’s men were to clear the eastern side.
      - On 14 June 1669 a mine dug under the wall blew a breach about 27.5 metres wide. The defenders plugged it with stakes and fought off the attackers, who lost 50 dead and 68 wounded, and Speelman admitted that he had never seen such resistance. On 22 June, after six days of rain, Arung Palakka led his Bugis, with men from Bacan and Ambon, into the breach. They drove the defenders from the eastern and western bastions with fire, and the Makassarese fell back to the southern half of the citadel, firing their greatest cannon, Anak Mangkasar, as they went. Then word came that Hasanuddin and his men had abandoned Somba Opu.
      - Some 8,000 Bugis plundered the palace before Speelman and Arung Palakka arrived. The Company threw the guns off the ramparts, 33 large cannon among them, and Somba Opu was never used again. Hasanuddin abdicated and died on 12 June 1670.
    facts:
      - [Assault force, "about 2,000 Bugis, 572 allied troops, 83 Dutch soldiers and 11 sailors"]
      - [Mine breach, "14 June 1669, about 27.5 m"]
      - [Somba Opu stormed, "22 June 1669"]
