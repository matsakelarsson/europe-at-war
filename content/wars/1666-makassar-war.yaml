  - title: Bone’s ascendancy and the Makassarese diaspora
    date: 1669–1696
    when: "1672"
    borders: "1672"
    countries: [id, nl]
    body:
      - Speelman razed Somba Opu and rebuilt Ujung Pandang as Fort Rotterdam, named after his birthplace, the Company’s headquarters in Sulawesi until the 20th century. Gowa survived as a small vassal kingdom; its trade passed to the Company, and its overseas empire fell apart.
      - Arung Palakka was formally made arung (king) of Bone in 1672 and became the dominant ruler of South Sulawesi until his death in 1696. He and the Company divided power, the Company controlling external affairs and trade, Arung Palakka the affairs of the kingdoms, and his rule became harsh and intrusive in the politics of his neighbours.
      - Thousands of Makassarese and Bugis who would not live under the new order left Sulawesi. Bands of fighters settled in Banten and then at Demung in East Java, and under Karaeng Galesong joined Trunajaya’s rebellion against Mataram and the Company in 1675; others went to Jambi, Palembang, the Malay peninsula and as far as Siam, where Makassarese exiles rose against King Narai in 1686.
    facts:
      - [Arung Palakka king of Bone, "1672"]
      - [Death of Arung Palakka, "1696"]
