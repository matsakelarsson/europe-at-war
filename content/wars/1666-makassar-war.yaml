id: makassar-war
name: Makassar War
start: "1666-11-24"
end: "1669-06-24"
tier: A
summary: "The war in which the Dutch East India Company (VOC) and the Bugis of Bone under Arung Palakka broke the power of Gowa, the Makassar sultanate of South Sulawesi. Under Sultan Hasanuddin Gowa ruled a maritime empire from the fortified port of Makassar, open to all traders, and stood in the way of the Company’s spice monopoly. Arung Palakka, a Bone prince who had led a failed Bugis revolt against Gowa in 1660, took refuge with the Company in Batavia. In November 1666 Admiral Cornelis Speelman sailed with 21 ships and about 1,860 men, among them Ambonese and Bugis troops. He forced a Makassarese army that had invaded Buton to surrender (January 1667), and Arung Palakka raised the Bugis of Bone and Soppeng. On 18 November 1667 Hasanuddin signed the Treaty of Bungaya, which gave the Company a trade monopoly and Makassar’s fort of Ujung Pandang and made Gowa a vassal. The war broke out again in 1668, and only after a long siege did Bugis and Company troops storm Gowa’s citadel, Somba Opu, on 22 June 1669. Gowa’s empire ended; Speelman built Fort Rotterdam as the Company’s base, and Arung Palakka, king of Bone from 1672, became the most powerful man in South Sulawesi. Thousands of Makassarese went into exile across the archipelago, where many fought on against the Company."
countries: [id, nl]
