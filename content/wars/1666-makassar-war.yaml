notes:
  - The main sources are Speelman’s reports and the Company’s records, studied above all by Leonard Andaya in The Heritage of Arung Palakka (1981), and the chronicles of Gowa, Tallo and Bone. Dates for the fall of Somba Opu differ by a few days between accounts (12, 22 or 24 June 1669).
  - Arung Palakka and Sultan Hasanuddin are both remembered as heroes in their homelands. Hasanuddin, whom the Dutch called “the rooster of the east”, was made a National Hero of Indonesia in 1973, while Arung Palakka, honoured in Bone as the prince who freed the Bugis from Gowa, has often been called a collaborator in Indonesian national histories; historians such as Andaya stress that he fought for Bone’s freedom, not for the Company.
  - The treaty is spelled Bungaya or Bongaya (Dutch Bongaais), after a village near Barombong south of Somba Opu.
