steps:
  - title: Gowa, Bone and the Company
    date: 1660–1666
    when: "1666-10-05"
    borders: "1666-10"
    countries: [id, nl]
    body:
      - In the early 17th century the twin Makassar kingdoms of Gowa and Tallo, Muslim since 1605, built the greatest power of eastern Indonesia. From the port and citadel of Somba Opu they ruled or overawed South Sulawesi, Sumbawa, parts of Borneo and the islands as far as the Moluccas, and welcomed Portuguese, English, Danish, Chinese and Malay traders. Makassar became the outlet for cloves and nutmeg smuggled past the Dutch East India Company (VOC), which wanted to close it. In 1660 a Company fleet under Johan van Dam took Gowa’s southern fort of Panakkukang and forced a treaty on Sultan Hasanuddin, but Gowa kept its independence.
      - The Bugis kingdoms of Bone, beaten by Gowa at Passempe in 1646, and Soppeng were Gowa’s vassals, and Bugis men were drafted to dig Gowa’s defences. In 1660 Bone rose in revolt, led by the regent Tobala’ and the young prince Arung Palakka, whose army grew to 10,000 by August, but Gowa crushed the rising. Arung Palakka fled with his followers, first to Buton and in 1663 to Batavia, where his Bugis fought for the Company in Sumatra and earned its trust.
      - Hasanuddin prepared for the next war, sealing the shore of Makassar with a brick wall about 11 km long and keeping the Portuguese, enemies of the Dutch, in the city; the Company closed its trading post there in 1665. In 1666 Hasanuddin sent about 6,000 men against Ternate, the Company’s ally, and on 5 October 1666 the Company declared war on Gowa.
    facts:
      - [Bone revolt, "1660, up to 10,000 men under Arung Palakka"]
      - [Arung Palakka in Batavia, "from 1663"]
      - [Company declaration of war, "5 October 1666"]
