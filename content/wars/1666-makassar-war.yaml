  - title: The Bugis rising and the summer campaign
    date: February – October 1667
    when: "1667-07"
    borders: "1667-07"
    countries: [id, nl]
    body:
      - Speelman spent the following months in the Moluccas, securing Ternate and the clove islands against Gowa and its allies, while Arung Palakka prepared his return. A first Bugis rising in Bone in May 1667 failed. About a week after 19 June the fleet sailed from Buton for Sulawesi. Arung Palakka set out from the island of Kabaena to raise the Bugis lands, and for a while the Company lost track of him, but Bone and Soppeng rose against Gowa.
      - The war now had two fronts. Speelman’s ships bombarded Makassar’s sea wall and blockaded the coast, but the Company had too few soldiers to storm the city; Arung Palakka’s Bugis fought a hard land campaign through the rice plains, against Gowa’s armies and its ally Wajo. Through the summer and autumn of 1667 the Company and the Bugis closed in on Makassar from the south, and disease thinned the Company’s ranks.
    facts:
      - [Failed Bugis rising, "May 1667"]
      - [Fleet leaves Buton, "late June 1667"]
