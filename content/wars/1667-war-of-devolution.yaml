id: war-of-devolution
name: War of Devolution
start: "1667-05-24"
end: "1668-05-02"
tier: C
summary: Louis XIV’s war to claim part of the Spanish Netherlands for his wife, Maria Theresa, daughter of Philip IV of Spain, under a custom of Brabant (the right of “devolution”) that favoured the children of a first marriage over those of a second. After Philip’s death in 1665, Turenne’s army invaded in May 1667 and took Charleroi, Tournai, Douai, Oudenaarde and, on 28 August, Lille, meeting little resistance from the weak Spanish forces. In February 1668 the Prince of Condé overran Franche-Comté in about two weeks. Alarmed by French success, England, the Dutch Republic and Sweden formed the Triple Alliance in January 1668 to press for peace. In the Treaty of Aix-la-Chapelle (Aachen) of 2 May 1668 France gave back Franche-Comté but kept Lille, Douai, Tournai, Oudenaarde, Courtrai, Charleroi and other towns in Flanders and Hainaut, which Vauban soon fortified. Louis resented the Dutch for the alliance, and four years later attacked them.
