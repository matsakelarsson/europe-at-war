notes:
  - "The dates are given by the Japanese lunar calendar in the sources: the rising began in the sixth month of Kanbun 9 and Shakushain was killed in the tenth month of the same year (1669). The number of Japanese killed comes from Japanese records; no count of Ainu dead survives."
  - Older Japanese and English accounts call the war a rebellion; Ainu and many recent historians see it as a war of the Ainu against the encroachment of Japanese traders and the Matsumae.
