id: shakushains-revolt
name: Shakushain’s revolt
start: "1669"
end: "1672"
tier: C
summary: "The largest Ainu rising against Japanese rule in Ezo (Hokkaido). In the 17th century the Tokugawa shogunate gave the Matsumae clan of southern Ezo the sole right to trade with the Ainu, and the Matsumae parcelled the trade out to their retainers at trading posts that set low prices for Ainu goods and fished the salmon rivers. A feud over hunting and fishing grounds on the Shibuchari River (today Shinhidaka) between the Menashikur Ainu under Shakushain and the Sumunkur under Onibishi turned outward when an envoy sent to Matsumae for help died of smallpox on the way home and Ainu came to believe he had been poisoned. In the sixth month of 1669 (summer) Shakushain called on the Ainu to rise, and Ainu from Shiranuka in the east to Mashike in the west attacked trading ships, posts and Japanese hunters; Japanese records count 356 Japanese killed. The Matsumae held the line at Kunnui, the shogunate ordered the Tsugaru, Nanbu and Akita domains to stand by and sent the Matsumae lord’s kinsman Matsumae Yasuhiro to take command, and firearms turned the fighting. In the tenth month (November 1669) Shakushain was invited to peace talks at Pipok (Niikappu) and killed at the banquet, and his fort at Shibuchari was burned the next day. Fighting with other groups went on until 1672. The Ainu had to swear a seven-article oath of obedience to the Matsumae, and the trading-post system was tightened, leaving the Ainu dependent on Japanese merchants."
