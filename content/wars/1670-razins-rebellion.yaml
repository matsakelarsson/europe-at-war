  - title: Simbirsk and the end of the rising
    date: July 1670 – November 1671
    when: "1670-07"
    borders: "1671-06-06"
    countries: [ru]
    body:
      - In late July Razin left Astrakhan and sailed up the Volga with some 200 boats. Saratov and Samara opened their gates, and his agents spread letters calling on the people to kill the boyars, nobles and officials. Peasants rose across the middle Volga, joined by Chuvash, Mari, Mordvins and Tatars, and the rising spread west towards Tambov, Penza and Nizhny Novgorod. In September Razin laid siege to Simbirsk, but its governor, Ivan Miloslavsky, held the citadel. On 1 and 4 October a relief army under Prince Yury Baryatinsky beat the rebels on the Sviyaga, and Razin, wounded, fled down the Volga to the Don.
      - His followers fought on into 1671, and the government’s revenge was savage. From Arzamas, Prince Yury Dolgorukov’s troops burned rebel villages and hanged, quartered or impaled thousands of people. Razin’s prestige was broken, the Church anathematised him, and in April 1671 the Don Cossack elders, led by his godfather Kornila Yakovlev, captured him at Kagalnik and handed him over. He was quartered on Red Square in Moscow on 6 June 1671. Astrakhan held out under his lieutenants until November.
    facts:
      - [Battles on the Sviyaga, "1 and 4 October 1670, government victory"]
      - [Razin executed, "6 June 1671, Moscow"]
      - [Astrakhan surrendered, November 1671]
