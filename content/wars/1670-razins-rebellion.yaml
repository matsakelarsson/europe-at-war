id: razins-rebellion
name: Razin’s Rebellion
start: "1670"
end: "1671"
tier: B
summary: A rising of Cossacks, runaway peasants, townspeople and the non-Russian peoples of the Volga led by the Don Cossack Stepan (Stenka) Razin, who took Astrakhan, Saratov and Samara in 1670 and called on the people to kill the boyars and officials. Beaten at Simbirsk in October 1670, Razin was handed over by the Don Cossack elders and executed in Moscow in June 1671, and the rising was put down with mass executions.
