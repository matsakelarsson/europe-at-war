steps:
  - title: Down the Volga to Astrakhan
    date: 1667 – July 1670
    when: "1670-04"
    borders: "1670-06-24"
    countries: [ru]
    body:
      - Stepan Razin, known as Stenka, was a Don Cossack who in 1667 led a band of Cossacks and runaway peasants down the Volga on a raiding expedition. They seized Yaitsk on the Yaik (today’s Oral in Kazakhstan), plundered the Persian shores of the Caspian Sea and in 1669 destroyed a Persian fleet sent against them. Razin came back rich to Astrakhan, where the tsar’s governors pardoned him. His fame spread among the poor of the south, many of them peasants who had fled the taxes, conscription and tightened serfdom of the years after the Law Code of 1649.
      - In the spring of 1670 he turned against the government. He declared war on the boyars and officials, though not on the tsar, took Tsaritsyn and sailed down the Volga with about 7,000 men. At Cherny Yar in June the streltsy (musketeers) rose against their officers and joined him. On 24 June the rebels broke into Astrakhan, again helped by a rising inside the city. The governor, Prince Ivan Prozorovsky, and many nobles and officials were killed, the bazaars were looted, and Razin set up a Cossack government under a general assembly, which proclaimed him its sovereign.
    facts:
      - [Leader, Stepan (Stenka) Razin]
      - [Astrakhan taken, 24 June 1670]
