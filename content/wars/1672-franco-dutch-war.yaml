  - title: Maastricht, Seneffe and Turenne’s winter campaign
    date: 1673–1675
    when: "1673-06-30"
    borders: "1675-07-27"
    countries: [nl, be, de, fr, es]
    body:
      - In June 1673 Louis took Maastricht after a siege directed by Vauban, in which the musketeer d’Artagnan was killed. But France’s gains alarmed Europe. The Emperor, Spain and the Duke of Lorraine allied with the Dutch, William retook Naarden and, with the imperial army, Bonn, and in 1674 the French left almost all of the Republic. England made peace in February 1674. That spring Louis conquered Franche-Comté from Spain, and in August William and the Prince of Condé fought the bloody battle of Seneffe, both claiming victory.
      - On the Rhine Marshal Turenne faced larger imperial armies. He beat them at Sinsheim on 16 June 1674 and then laid waste much of the Palatinate. In the autumn the allies took up winter quarters in Alsace, but Turenne marched south behind the Vosges in midwinter, came out at Belfort and surprised them at Turckheim on 5 January 1675, driving them back over the Rhine. On 27 July 1675, while manoeuvring against the imperial general Raimondo Montecuccoli near Sasbach in Baden, Turenne was killed by a cannonball.
    facts:
      - [Siege of Maastricht, "surrendered 30 June 1673"]
      - [Battle of Seneffe, "11 August 1674, indecisive"]
      - [Battle of Turckheim, "5 January 1675, French victory"]
    markers:
      - kind: siege
        side: fr
        name: Maastricht
        date: June 1673
        text: Vauban’s systematic trenches took the fortress in under three weeks. D’Artagnan fell in an assault on 25 June.
        lonlat: [5.683, 50.85]
      - kind: siege
        side: nl
        name: Naarden
        date: September 1673
        text: William’s first success, retaking the fortress town on the edge of the Water Line.
        lonlat: [5.162, 52.295]
      - kind: siege
        side: al
        name: Bonn
        date: November 1673
        text: William and the imperial army took the Elector of Cologne’s capital, cutting the French supply line down the Rhine.
        lonlat: [7.1, 50.73]
      - kind: siege
        side: fr
        name: Besançon
        date: May 1674
        text: Louis took the capital of Franche-Comté in person; the rest of the province fell by July.
        lonlat: [6.02, 47.24]
      - kind: battle
        name: Battle of Seneffe
        date: 11 August 1674
        text: Condé attacked William’s army on the march. After a day of slaughter, with some 15,000 or more killed and wounded, both sides claimed victory.
        lonlat: [4.26, 50.53]
      - kind: battle
        side: fr
        name: Battle of Sinsheim
        date: 16 June 1674
        text: Turenne beat an imperial force before the main allied army could gather.
        lonlat: [8.808, 49.233]
      - kind: battle
        side: fr
        name: Battle of Turckheim
        date: 5 January 1675
        text: Turenne surprised the allies near Colmar after his march behind the Vosges, and they withdrew across the Rhine.
        lonlat: [7.27, 48.086]
      - kind: event
        name: Sasbach
        date: 27 July 1675
        text: Turenne was killed by a cannonball while reconnoitring. The French army retreated across the Rhine.
        lonlat: [8.092, 48.638]
    arrows:
      - side: fr
        label: Turenne
        via: [[6.55, 48.6], [6.55, 48.05], [6.85, 47.66], [7.25, 48.06]]
    areas:
      - style: occupied
        side: fr
        label: Conquered by France, 1674
        atoms: [FR-25, FR-39, FR-70]
  - title: Valenciennes, Cassel and Nijmegen
    date: 1676–1678
    when: "1676"
    borders: "1678-09-17"
    countries: [fr, be, nl, es]
    body:
      - The war became a contest of sieges in the Spanish Netherlands, which Louis waged with Vauban’s engineering. Valenciennes was taken by storm on 17 March 1677, and Cambrai and Saint-Omer fell that spring. When William marched to relieve Saint-Omer, the King’s brother, Philippe of Orléans, beat him at Cassel on 11 April. In November 1677 William married Mary, daughter of the Duke of York, drawing England closer to the Dutch, and in March 1678 the French took Ghent and Ypres.
      - Dutch merchants wanted peace, and the Republic made a separate treaty with France at Nijmegen on 10 August 1678. It lost no territory, Maastricht was handed back, and France lowered its tariffs. Four days later William, who may already have known of the peace, attacked the French at Saint-Denis near Mons. Spain made peace on 17 September and paid for the war. France gained Franche-Comté and a belt of towns in the south, among them Valenciennes, Cambrai, Maubeuge, Saint-Omer, Ypres and Cassel, but returned others such as Charleroi, Oudenaarde, Courtrai and Ghent. The Emperor followed in February 1679.
    facts:
      - [Battle of Cassel, "11 April 1677, French victory"]
      - [Peace of Nijmegen, "10 August 1678 (the Dutch), 17 September 1678 (Spain)"]
      - [Gained by France, "Franche-Comté, Valenciennes, Cambrai, Saint-Omer, Ypres and other towns"]
    markers:
      - kind: siege
        side: fr
        name: Valenciennes
        date: March 1677
        text: The musketeers broke into the town in a daylight assault planned by Vauban.
        lonlat: [3.523, 50.358]
      - kind: siege
        side: fr
        name: Cambrai
        date: March–April 1677
        text: The town fell in early April and the citadel soon after, ending Spanish rule in the Cambrésis.
        lonlat: [3.236, 50.177]
      - kind: battle
        side: fr
        name: Battle of Cassel
        date: 11 April 1677
        text: Philippe of Orléans beat William’s relief army at the Peene stream below Mont Cassel.
        lonlat: [2.488, 50.801]
      - kind: siege
        side: fr
        name: Saint-Omer
        date: March–April 1677
        text: The town surrendered after William’s defeat at Cassel.
        lonlat: [2.262, 50.746]
        lp: l
      - kind: taken
        side: fr
        name: Ghent
        date: March 1678
        text: Louis took the great Flemish city in a surprise campaign, then returned it at the peace.
        lonlat: [3.725, 51.054]
      - kind: siege
        side: fr
        name: Ypres
        date: March 1678
        text: Taken within days of Ghent, and kept by France at the peace.
        lonlat: [2.885, 50.851]
      - kind: battle
        name: Battle of Saint-Denis
        date: 14 August 1678
        text: William attacked Marshal Luxembourg’s army, which was blockading Mons; thousands fell on both sides in a battle fought after the peace was signed.
        lonlat: [4.017, 50.483]
      - kind: treaty
        name: Peace of Nijmegen
        date: 10 August and 17 September 1678
        text: France made peace with the Dutch and then with Spain; the treaty with the Emperor followed in February 1679.
        lonlat: [5.862, 51.847]
    areas:
      - style: gained
        side: fr
        label: Gained by France at Nijmegen (approximate)
        atoms: [FR-25, FR-39, FR-70, FR-59!]
