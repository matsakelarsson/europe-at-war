id: franco-dutch-war
name: Franco-Dutch War
start: "1672-04-06"
end: "1678-09-17"
tier: B
summary: A war launched by Louis XIV against the Dutch Republic, which nearly fell in the disaster year of 1672 before flooding Holland and finding allies in Spain, the Emperor and Brandenburg. The war spread to the Rhine, the Spanish Netherlands and the Baltic, where it was fought as the Scanian War. The Peace of Nijmegen in 1678 left the Republic intact but gave France Franche-Comté and a string of towns in the Spanish Netherlands.
countries: [nl, fr, be, de, es, gb]
sides:
  - id: fr
    name: France and its allies
    polities: [france]
    ink: navy
    moves: French and allied moves
    success: French and allied success
  - id: nl
    name: Dutch Republic
    polities: [dutch-republic]
    ink: orange
    moves: Dutch moves
    success: Dutch success
  - id: al
    name: Spain, the Emperor and their allies
    polities: [spain, habsburg-netherlands, habsburg, hre, prussia]
    ink: gold
    moves: Spanish, imperial and allied moves
    success: Spanish, imperial and allied success
notes:
  - France’s allies were England (until February 1674, in the Third Anglo-Dutch War), the Prince-Bishop of Münster and the Elector of Cologne (until 1674) and Sweden (from 1675). The Dutch were joined by Brandenburg (1672–1673 and again from 1674), the Emperor, Spain and the Duke of Lorraine (1673), the Empire (1674) and Denmark–Norway (1675). For the war in the north, see the Scanian War.
  - Dates are New Style (Gregorian). Some Dutch provinces, such as Groningen, still used the Julian calendar, ten days behind.
