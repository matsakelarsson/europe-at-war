steps:
  - title: The Rampjaar and the Water Line
    date: 1672
    when: "1672-04-06"
    borders: "1672-08-28"
    countries: [nl, de, be, gb]
    body:
      - Louis XIV meant to punish the Dutch for checking his conquests in the Spanish Netherlands in 1668. Having bought England’s alliance in the secret Treaty of Dover and isolated the Republic, he declared war on 6 April 1672 and marched down the Meuse with well over 100,000 men, bypassing Maastricht. On 12 June his army crossed the Rhine at Tolhuis near Lobith, outflanking the Dutch defences on the IJssel, and Utrecht opened its gates. France’s allies, the Bishop of Münster and the Elector of Cologne, overran Overijssel and Drenthe and laid siege to Groningen.
      - The Dutch remember 1672 as the Rampjaar, the disaster year, when the people were said to be irrational, the government desperate and the country beyond saving. They saved Holland by opening the sluices of the Water Line from Muiden to Gorinchem, flooding a belt of land the French could not cross. At sea de Ruyter attacked the Anglo-French fleet at Solebay on 7 June and prevented a landing. In the panic the young William III was made stadtholder and captain-general, and on 20 August a mob in The Hague murdered Johan de Witt and his brother Cornelis.
    facts:
      - [Rhine crossing, "12 June 1672, at Tolhuis"]
      - [Battle of Solebay, "7 June 1672, indecisive"]
      - [Murder of the De Witt brothers, "20 August 1672"]
    markers:
      - kind: event
        side: fr
        name: Tolhuis
        date: 12 June 1672
        text: Louis’s cavalry forded and swam the Rhine under fire, outflanking the Dutch line on the IJssel.
        lonlat: [6.118, 51.862]
      - kind: taken
        side: fr
        name: Utrecht
        date: June 1672
        text: The city surrendered without a fight and became the French base in the occupied provinces.
        lonlat: [5.122, 52.091]
      - kind: held
        side: nl
        name: Muiden
        date: June 1672
        text: Dutch troops reached the fortress just ahead of French cavalry, securing the northern end of the Water Line and Amsterdam’s sluices.
        lonlat: [5.067, 52.333]
      - kind: held
        side: nl
        name: Groningen
        date: July–August 1672
        text: The city held out against the armies of Münster and Cologne, and the siege was lifted in late August, an event still celebrated on 28 August.
        lonlat: [6.567, 53.219]
      - kind: naval
        name: Battle of Solebay
        date: 7 June 1672
        text: De Ruyter surprised the English and French fleets at anchor off Southwold. The battle was indecisive, but it stopped the allies from landing troops in Holland.
        lonlat: [1.8, 52.33]
      - kind: event
        name: The Hague
        date: 20 August 1672
        text: Johan and Cornelis de Witt were dragged from the Gevangenpoort prison and killed by a mob.
        lonlat: [4.309, 52.08]
        lp: l
