steps:
  - title: Kamianets and the Peace of Buchach
    date: 1672
    when: "1672"
    borders: "1672-10-18"
    countries: [ua, pl, tr]
    body:
      - Ukraine west of the Dnieper was still fought over after the Truce of Andrusovo. Its hetman, Petro Doroshenko, placed himself under the sultan in 1669, and in August 1672 Mehmed IV and his grand vizier Köprülü Fazıl Ahmed Pasha invaded with an army of perhaps 80,000. The Commonwealth, under the weak King Michael Korybut Wiśniowiecki and divided by noble feuds, was unready. Kamianets, the great fortress of Podolia, surrendered on 27 August after a siege of about ten days, and its cathedral became a mosque.
      - The Ottomans then besieged Lviv, while Tatar raiders spread across south-eastern Poland. Crown Grand Hetman Jan Sobieski, with only about 3,000 horsemen, struck at the raiding parties in October and freed many thousands of captives. But on 18 October the king’s envoys signed the Peace of Buchach. Podolia became an Ottoman province, the Bratslav lands and southern Kyiv region went to Doroshenko, and the Commonwealth was to pay an annual tribute of 22,000 ducats. The Sejm refused to ratify it.
    facts:
      - [Kamianets surrendered, 27 August 1672]
      - [Peace of Buchach, "18 October 1672, never ratified by the Sejm"]
    markers:
      - kind: siege
        side: ot
        name: Kamianets
        date: August 1672
        text: The garrison gave up after Ottoman guns and mines breached the old castle. As the troops withdrew the castle’s powder magazine exploded, killing Colonel Jerzy Wołodyjowski among others.
        lonlat: [26.56, 48.67]
      - kind: siege
        name: Lviv
        date: September – October 1672
        text: The city held out and bought off the besiegers with a ransom.
        lonlat: [24.03, 49.84]
      - kind: battle
