id: polish-ottoman-war-1672
name: Polish–Ottoman War, 1672–1676
start: "1672"
end: "1676"
tier: B
summary: Sultan Mehmed IV, backing the Cossack hetman Petro Doroshenko, took the fortress of Kamianets and forced Poland–Lithuania to cede Podolia at Buchach in 1672. Jan Sobieski’s victory at Khotyn in 1673 helped make him king, but the Treaty of Żurawno in 1676 left Podolia Ottoman.
