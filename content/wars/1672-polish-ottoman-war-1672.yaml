  - title: Khotyn and Żurawno
    date: 1673–1676
    when: "1673"
    borders: "1676-10-17"
    countries: [ua, pl, lt, tr, md]
    body:
      - The Sejm voted money for an army instead of tribute. In November 1673 Sobieski, with about 30,000 Polish and Lithuanian troops, marched on the fortified Ottoman camp at Khotyn. After a freezing night his men stormed it at dawn on 11 November, and much of Hüseyin Pasha’s army was killed or drowned when the bridge over the Dniester collapsed. King Michael had died the day before, and in May 1674 the nobles elected Sobieski king as John III.
      - He could not win back Kamianets. In 1675 an Ottoman and Tatar army advanced again, and Sobieski beat it outside Lviv in August, while the small garrison of Terebovlia held out for three weeks. In 1676 a much larger Ottoman army besieged his camp at Żurawno on the Dniester for two weeks, and on 17 October the two sides made peace. Poland–Lithuania no longer had to pay tribute and got back part of Ukraine, but Podolia stayed Ottoman.
    facts:
      - [Battle of Khotyn, "11 November 1673, Polish–Lithuanian victory"]
      - [Treaty of Żurawno, "17 October 1676"]
      - [New king, "John III Sobieski, elected May 1674"]
    markers:
      - kind: battle
        side: pl
        name: Battle of Khotyn
        date: 11 November 1673
        text: Sobieski’s infantry broke into the Ottoman camp, and his hussars finished the rout. Moldavian and Wallachian troops changed sides.
        lonlat: [26.50, 48.49]
      - kind: battle
        side: pl
        name: Battle of Lviv
        date: August 1675
        text: Sobieski beat a Tatar army approaching the city.
        lonlat: [24.03, 49.84]
      - kind: held
        side: pl
        name: Terebovlia
        date: 20 September – 11 October 1675
        text: A garrison of a few hundred soldiers and townspeople under Jan Samuel Chrzanowski held the castle until relief came. His wife, Anna Dorota, is remembered for urging them on.
        lonlat: [25.69, 49.30]
      - kind: treaty
        side: ot
        name: Treaty of Żurawno
        date: 17 October 1676
        text: Agreed in the besieged Polish camp. The Sejm never ratified it, but the border held until 1683.
        lonlat: [24.28, 49.26]
    areas:
      - style: lost
        side: ot
        label: Held by the Ottoman Empire
        atoms: [UA-68]
