id: third-anglo-dutch-war
name: Third Anglo-Dutch War
start: "1672-03"
end: "1674-02-19"
tier: C
summary: England’s part in Louis XIV’s attack on the Dutch Republic, agreed in the secret Treaty of Dover of 1670 in return for French subsidies. An English attack on the Dutch Smyrna convoy in March 1672 opened the war. On 7 June 1672 Michiel de Ruyter surprised the Anglo-French fleet at Solebay off the Suffolk coast, and in 1673 his smaller fleet fought the allies to a standstill in two battles at the Schooneveld off Zeeland and at the Texel (Kijkduin) on 21 August, preventing a landing in Holland; a Dutch squadron also briefly retook New York. The war was unpopular and expensive in England, where suspicion of Catholic influence at court grew. By the Treaty of Westminster of 19 February 1674 the Dutch handed New York back to England and agreed to pay an indemnity, and England left the war, which went on as the Franco-Dutch War.
