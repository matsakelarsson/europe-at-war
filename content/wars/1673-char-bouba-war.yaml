notes:
  - "The war is often dated 1644–1674 and called a “thirty years’ war”; that dating goes back to the colonial writer Paul Marty and is now rejected by most historians, who place the fighting in about 1673–1677. Mauritanian sources call it Shurr Bubba (Char Bouba); in Senegal it is remembered as the Marabout War. The Moorish sources are traditions written down much later; the French reports from Saint-Louis are the only contemporary accounts. Historians disagree on its causes: Boubacar Barry stresses the Atlantic slave trade and the crisis it brought to the Senegal valley, others the Saharan trade and the clerics’ wish to rule the farming peoples of the valley."
  - The wars centred in Senegal (Futa Toro, Waalo, Kayor and Jolof) will be told in more detail when Africa south of the Sahara is added.
