id: char-bouba-war
name: Char Bouba war
start: "1673"
end: "1677"
tier: C
summary: "A war in the south-western Sahara and the Senegal valley between the clerical Berber tribes (the zawaya) led by the imam Nasir al-Din and the warrior Arab tribes of the Banu Hassan, which ended the zawaya’s political power and left the Hassan emirates of Trarza and Brakna dominant in what is now southern Mauritania. Nasir al-Din (Awbek b. Ashfaga), a scholar of the Lamtuna, preached repentance and the rule of Islamic law, demanded zakat from the tribes of the region and condemned the kings of the Senegal valley for selling their own subjects to European slave traders. The war takes its Berber name, “Bubba’s war”, from a tributary of the Lamtuna who persuaded his chief to call on Haddi b. Ahmad b. Daman of the Trarza to resist the zakat. In 1673 Nasir al-Din’s followers, called the Toubenan (“penitents”) by Europeans, overthrew the Denianke ruler of Futa Toro and the rulers of Kayor and Jolof, with the support of Torodbe clerics, peasants and Muslim Wolof, and later took Waalo. The French at Saint-Louis, whose trade the clerics disrupted, backed the old ruling families. Nasir al-Din was killed at Tirtilass by May 1674; his successors Uthman, Munir al-Din and al-Mukhtar were killed or died in turn, the Wolof and Denianke aristocracies regained their thrones with French help, and the movement collapsed in 1677. The defeated zawaya had to pay tribute to the Hassan and give them rights to water and milk. A famine from 1676 drove many people in the Senegal valley to sell themselves into slavery."
