  - title: To the Yangtze
    date: 1674
    when: "1674-03"
    borders: "1674-06-01"
    countries: [cn]
    body:
      - "Wu Sangui’s armies marched through Guizhou into Hunan and in the first months of 1674 took Changde, Changsha, Hengzhou and Yuezhou on the Dongting Lake, while the governor and the army commander of Sichuan joined him and handed over that province. In Guangxi, Sun Yanling, the son-in-law of the late Kong Youde, killed the provincial commander and declared for Wu."
      - "At Beijing the Kangxi Emperor had Wu’s son, Wu Yingxiong, who lived at court as a hostage, executed in April 1674. He sent Manchu princes south with banner armies, but relied above all on the Green Standard troops, Chinese soldiers under Chinese generals. The Qing held Jingzhou and Wuchang on the Yangtze, and Wu Sangui, perhaps hoping for a negotiated division of the empire, did not try to cross the river. The front settled along the Yangtze and the Dongting Lake around Yuezhou, where it stayed for almost five years."
    facts:
      - [Wu Sangui takes Hunan, "early 1674"]
      - [Execution of Wu Yingxiong, "April 1674"]
