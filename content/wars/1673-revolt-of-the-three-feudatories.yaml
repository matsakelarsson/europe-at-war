  - title: The siege of Kunming
    date: 1681
    when: "1681-12"
    borders: "1681-12-08"
    countries: [cn]
    body:
      - "In 1681 three Qing armies converged on Yunnan: Zhangtai’s from Guizhou, Laita’s from Guangxi and Zhao Liangdong’s from Sichuan. They defeated the Zhou army outside Kunming and laid siege to the city, which held out for months while the besiegers cut off its supplies. In the autumn Zhao Liangdong’s troops broke into the outer defences."
      - "In early December 1681 Wu Shifan hanged himself, and the next day his generals surrendered the city. Wu Sangui’s body was exhumed and its remains were sent to the provinces as a warning, and his officers were executed. The Kangxi Emperor, now 27, had broken the power of the generals who had won China for his house; the south was governed by ordinary officials from then on. Two years later his admiral Shi Lang took Taiwan from the Zheng family."
    facts:
      - [Siege of Kunming, "1681"]
      - [Suicide of Wu Shifan and fall of Kunming, "early December 1681"]
