  - title: Emperor of Zhou
    date: 1676–1678
    when: "1678-03-23"
    borders: "1678-10-02"
    countries: [cn]
    body:
      - "By 1677 Wu Sangui stood alone. He had Sun Yanling killed on suspicion of planning to change sides, and his armies in Jiangxi were driven back from Ji’an and the Gan valley. In Hunan the front on the Dongting Lake held, and Wu’s troops fought a long siege of Yongxing in the south of the province in 1678, but Qing armies were gathering on every side."
      - "On 23 March 1678 Wu Sangui proclaimed himself emperor of a new dynasty, Zhou, at Hengzhou (Hengyang), with the reign name Zhaowu. Five months later he fell ill, and he died at Hengzhou on 2 October 1678. His grandson Wu Shifan succeeded him and withdrew to Yunnan, leaving the generals in Hunan to fight on."
    facts:
      - [Wu Sangui proclaimed emperor, "23 March 1678, Hengzhou"]
      - [Death of Wu Sangui, "2 October 1678"]
