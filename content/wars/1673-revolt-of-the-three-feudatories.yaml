notes:
  - "“Feudatory” (fan) translates the Chinese term for the three princely domains. Wu Sangui’s rising called for the Ming to be restored, but he did not enthrone a Ming prince, and in 1678 proclaimed his own dynasty, Zhou. Some Chinese histories call the war the Rebellion of Wu Sangui."
  - "Army sizes are uncertain. Modern accounts give the Qing some 400,000 Green Standard soldiers and 150,000 bannermen, and Wu Sangui about 200,000 men at the start; casualty totals are not known. Dates are converted from the Chinese calendar."
