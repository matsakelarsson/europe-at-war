steps:
  - title: The princes of the south
    date: 1673
    when: "1673-12-28"
    borders: "1673-12-28"
    countries: [cn]
    body:
      - "The Qing had conquered southern China with the help of Ming generals who went over to them, and rewarded three of them with princely titles and the government of whole provinces. Wu Sangui, who had let the Qing through Shanhai Pass in 1644 and hunted down the last Ming emperor in Burma, held Yunnan and Guizhou; Shang Kexi held Guangdong; and Geng Jimao, followed in 1671 by his son Geng Jingzhong, held Fujian. Each had his own army, appointed his own officials and kept the taxes of his province, and the court paid huge subsidies for their armies."
      - "In 1673 the aged Shang Kexi asked to retire to Liaodong and leave Guangdong to his son Shang Zhixin. The 19-year-old Kangxi Emperor accepted his retirement but not the succession. Wu Sangui and Geng Jingzhong then offered to retire too, expecting to be asked to stay; against the advice of most of his council, the emperor accepted and ordered all three domains abolished and the princes resettled in Manchuria."
      - "On 28 December 1673 Wu Sangui rose at Kunming. He had the governor of Yunnan, Zhu Guozhi, killed, called on the country to drive out the Manchus and restore the Ming, and ordered his men to let their hair grow and wear Ming-style dress. The governor of Guizhou declared for him at once."
    facts:
      - [Shang Kexi asks to retire, "1673"]
      - [Wu Sangui rises at Kunming, "28 December 1673"]
      - [Wu Sangui’s army, "about 200,000 men"]
