id: revolt-of-the-three-feudatories
name: Revolt of the Three Feudatories
start: "1673-12-28"
end: "1681-12"
tier: A
summary: "A civil war in southern and western China between the Kangxi Emperor of the Qing and the three Chinese generals who had conquered the south for the dynasty and ruled it as princes: Wu Sangui in Yunnan and Guizhou, Shang Kexi and his son Shang Zhixin in Guangdong, and Geng Jingzhong in Fujian. When the young emperor accepted their offers to retire in 1673 and ordered their domains abolished, Wu Sangui rose at Kunming in December 1673 and took Hunan and Sichuan within months; Geng Jingzhong in Fujian, Sun Yanling in Guangxi and Wang Fuchen in Shaanxi joined him, and Zheng Jing crossed from Taiwan to the Fujian coast. The rebels never crossed the Yangtze, and the Qing defeated them one at a time: Wang Fuchen and Geng Jingzhong surrendered in 1676 and Shang Zhixin in 1677. Wu Sangui proclaimed himself emperor of Zhou at Hengzhou in March 1678 but died that October. Qing armies, most of them Chinese Green Standard troops, retook Hunan in 1679 and Sichuan and Guizhou in 1680, and in December 1681 Kunming fell and Wu’s grandson Wu Shifan killed himself. The victory left the Kangxi Emperor master of all China except Taiwan, which the Qing took in 1683."
countries: [cn, tw]
