  - title: The north-west and the Chahar
    date: 1674–1676
    when: "1675"
    borders: "1676-07-01"
    countries: [cn]
    body:
      - "In December 1674 Wang Fuchen, the Qing commander in western Shaanxi, mutinied at Ningqiang; the Qing commissioner Mo Luo was killed by an arrow. Wang declared for Wu Sangui and his forces spread into Gansu, taking Pingliang, Lanzhou and other towns, so that the rising now stretched from Yunnan to the Yellow River."
      - "In 1675, with many banner troops in the south, the Chahar Mongol prince Burni rose beyond the Great Wall. The court raised an army of household slaves and bannermen under Tuhai, who defeated Burni within weeks; Burni was killed. Tuhai was then sent to Shaanxi, where he besieged Wang Fuchen at Pingliang and took the heights that commanded the city. Wang surrendered in the summer of 1676 and was pardoned, and the north-west was quiet again."
    facts:
