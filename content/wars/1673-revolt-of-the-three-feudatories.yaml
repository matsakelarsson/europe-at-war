  - title: Hunan, Sichuan and Guizhou retaken
    date: 1679–1680
    when: "1679-01"
    borders: "1680-12-01"
    countries: [cn, tw]
    body:
      - "Without Wu Sangui his generals lost heart. In early 1679 the Qing took Yuezhou, after cutting it off on the lake with a fleet built for the purpose, and then Changsha, Changde and Hengzhou, and the Zhou armies fell back into Guizhou and western Hunan. In Guangxi too the Qing recovered the towns held by Sun Yanling’s former followers."
      - "In 1680 the Green Standard generals Zhao Liangdong and Wang Jinbao advanced from Shaanxi into Sichuan and took Chengdu and Chongqing, while armies from Hunan and Guangxi entered Guizhou. In Fujian, Zheng Jing’s forces were driven from Xiamen and the coast and returned to Taiwan. Shang Zhixin, suspected of disloyalty, was ordered to kill himself in 1680, and Geng Jingzhong was arrested; he was executed in 1682. By the end of 1680 Wu Shifan held only Yunnan."
    facts:
      - [Yuezhou retaken, "early 1679"]
      - [Chengdu retaken, "1680"]
      - [Zheng Jing leaves the mainland, "1680"]
