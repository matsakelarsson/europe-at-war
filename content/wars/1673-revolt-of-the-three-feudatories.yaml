  - title: Fujian, Taiwan and the sea
    date: 1674–1677
    when: "1674-04"
    borders: "1676-11-01"
    countries: [cn, tw]
    body:
      - "Geng Jingzhong rose at Fuzhou in April 1674, imprisoned the governor-general of Fujian and sent armies into Zhejiang and Jiangxi. He invited Zheng Jing, the son of Zheng Chenggong (Koxinga), who ruled Taiwan as the Kingdom of Tungning, to join him. Zheng Jing’s fleet occupied Xiamen and the coast, and in 1674–1676 held Quanzhou, Zhangzhou and, with the help of its commander, Chaozhou, but the two allies soon fell out over the coastal towns and fought each other."
      - "A Qing army under the prince Giyesu cleared Zhejiang and in 1676 crossed the mountains into northern Fujian. With his army divided and Zheng Jing’s men in the south of his province, Geng Jingzhong surrendered in the autumn of 1676 and joined the Qing against Zheng. Shang Zhixin, who had seized power in Guangdong from his father and declared for Wu in early 1676, changed sides again in 1677. Zheng Jing held on to Xiamen and the Haicheng coast until 1680, when he withdrew to Taiwan."
    facts:
      - [Geng Jingzhong rises, "April 1674"]
      - [Geng Jingzhong surrenders, "autumn 1676"]
      - [Shang Zhixin returns to the Qing, "1677"]
      - [Zheng Jing withdraws to Taiwan, "1680"]
    markers:
