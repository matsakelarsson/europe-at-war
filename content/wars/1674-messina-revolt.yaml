notes:
  - The unrest began in 1672 as a revolt of Messina’s artisans against the patricians who ran the city, which the Spanish authorities had at first encouraged. It turned against Spain in July 1674.
  - The naval war off Sicily belongs to the Franco-Dutch War of 1672–1678, which is told separately; Sicily stayed Spanish at the Peace of Nijmegen.
