  - title: Stromboli, Augusta and Palermo
    date: January 1676 – March 1678
    when: "1676-01-08"
    borders: "1678-03-13"
    countries: [it, fr, es, nl]
    body:
      - De Ruyter, now nearly seventy, brought 18 Dutch warships, too lightly manned after years of war. On 8 January 1676 he fought Abraham Duquesne’s French fleet of 20 ships for eight hours off Stromboli and Alicudi, without result. On 22 April the Dutch and Spanish, under the Spanish admiral de la Cerda, met Duquesne again off Augusta. The Spanish centre hung back, the Dutch van bore the brunt, and de Ruyter was hit in the legs by a cannonball; he died at Syracuse a week later. On 2 June Vivonne caught the battered allied fleet at anchor in the bay of Palermo and sent fireships among it. Several Spanish and Dutch ships blew up, and both Spanish admirals and the Dutch commander, Jan den Haen, were killed.
      - France now ruled the seas around Sicily, but Louis XIV had never meant to conquer the island. When England and the Dutch Republic allied in January 1678, he decided to pull out. The Duke of La Feuillade arrived in February, supposedly as the new viceroy, and on 13 March 1678 embarked the French troops on the pretext of an attack on Palermo, then told the city that the French were leaving for good. A few hundred leading families sailed with them. The Spanish viceroy returned unopposed, promising an amnesty that was not kept. Messina lost its privileges and its senate, and the Spanish built a citadel to hold it down. The Peace of Nijmegen that summer left Sicily Spanish.
    facts:
      - [Battle of Stromboli, "8 January 1676, inconclusive"]
      - [Battle of Augusta, "22 April 1676; de Ruyter mortally wounded"]
      - [Battle of Palermo, "2 June 1676, French victory"]
    markers:
      - kind: naval
        name: Battle of Stromboli
        date: 8 January 1676
        text: Also called the Battle of Alicudi. Twenty French ships fought nineteen Dutch and Spanish ships, and the Dutch lost one.
        lonlat: [14.5, 38.62]
      - kind: naval
        name: Battle of Augusta
        date: 22 April 1676
        text: Neither side lost a ship, but de Ruyter, the most famous admiral of his age, was mortally wounded.
        lonlat: [15.3, 37.36]
        lp: l
      - kind: naval
        side: fr
        name: Battle of Palermo
        date: 2 June 1676
        text: French fireships destroyed the Spanish flagship and several other ships at anchor. Vivonne then broke off and returned to Messina.
        lonlat: [13.38, 38.14]
      - kind: event
        side: es
        name: Messina
        date: 13 March 1678
        text: The French left without warning, taking a few hundred leading families into exile, and the Spanish took back the city without a fight.
        lonlat: [15.554, 38.193]
