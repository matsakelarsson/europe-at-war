id: messina-revolt
name: Messina revolt
start: "1674-07-07"
end: "1678-03-13"
tier: B
summary: The rising of the Sicilian port of Messina against Spanish rule in 1674, which drew in France during the Franco-Dutch War. French squadrons broke the Spanish blockade, and the French fleet beat the Spanish and their Dutch allies off Sicily, killing the great Dutch admiral de Ruyter. But Louis XIV saw Sicily as a sideshow, and in March 1678 his troops sailed away, leaving Messina to Spanish reprisals.
