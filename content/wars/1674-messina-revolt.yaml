steps:
  - title: Messina rises
    date: July 1674 – December 1675
    when: "1674-07-07"
    borders: "1675-08"
    countries: [it, fr, es]
    body:
      - Messina, a city of some 120,000 people, proud of its privileges and run by a few patrician families, had been at odds with the Spanish viceroys of Sicily for years. On 7 July 1674 its trade guilds and patricians joined forces, besieged the Spanish governor in his palace and drove the garrison out of the city and four of its five forts. Spanish troops and galleys closed in by land and sea, and the city appealed to Louis XIV, then at war with Spain and the Dutch Republic. On 27 September a small French squadron under the Chevalier de Valbelle ran past the Spanish galleys into the harbour with provisions for about five weeks and helped take the last fort, at the harbour mouth.
      - Valbelle came back in January 1675 with a few troops, and found the Spanish camped outside the city and about to take it. On 11 February the Duke of Vivonne arrived with more warships, and with a combined fleet of 20 sail the French beat Melchor de la Cueva’s Spanish fleet off the Lipari Islands and sailed into Messina with large convoys of food. Vivonne governed the city as Louis XIV’s viceroy. The French were too few to march inland, but in August they took the port of Augusta, south of Catania, and the war on Sicily became mainly a war at sea. Spain asked its Dutch allies for help, and Michiel de Ruyter sailed for the Mediterranean.
    facts:
      - [Revolt against Spain, "7 July 1674"]
      - [First French relief, "27 September 1674"]
      - [Battle off the Lipari Islands, "11 February 1675, French victory"]
