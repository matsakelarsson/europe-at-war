        date: 28 June 1675
        lonlat:
          - 12.769
          - 52.8088
        text: Brandenburg’s cavalry attacked the retreating Swedes and beat them. The Swedes fell back to Pomerania, and Fehrbellin became a founding legend of the Prussian army.
