    body:
      - Sweden was allied to France, then at war with the Dutch, and was paid French subsidies to help. In December 1674, at Louis XIV’s urging, a Swedish army marched from Pomerania into Brandenburg and occupied the Uckermark.
      - "The Elector Frederick William hurried north from his winter quarters in Franconia. On 28 June 1675 his cavalry caught the Swedes under Waldemar Wrangel at Fehrbellin and beat them. It was a small battle, but it showed that the Swedish army could be beaten, and Sweden’s enemies piled in: Denmark–Norway declared war that autumn, joined by the Dutch, the Emperor and several German princes."
    facts:
      - - Swedish commander
        - Waldemar Wrangel
      - - New enemies
        - Brandenburg, Denmark–Norway, the Dutch Republic, the Emperor, Münster, Brunswick-Lüneburg
    markers:
