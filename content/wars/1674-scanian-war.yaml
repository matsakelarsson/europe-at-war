id: scanian-war
name: Scanian War
start: "1674"
end: "1679"
tier: A
summary: A war in which Denmark–Norway, Brandenburg and the Dutch Republic fought Sweden, an ally of France, and the Danes tried to win back Scania. Despite Danish victories at sea and the loss of Sweden’s German lands, French pressure restored almost all the pre-war borders in the peace of 1679.
