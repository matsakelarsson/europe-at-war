  - title: Lund, the bloodiest battle
    date: 1676–1677
    when: "1676"
    borders: "1660"
    countries:
      - se
      - dk
      - no
    view:
      center:
        - 13.0631
        - 56.9593
      size:
        - 364
        - 488
    body:
      - Charles XI marched back into Scania in October 1676 with about 12,000 men. On 4 December, north of Lund, the two kings met in one of the bloodiest battles ever fought in Scandinavia. By some estimates nearly half of the men engaged were killed, and the Swedes won.
      - Lund saved Scania but not the sea. On 1–2 July 1677 the Danish admiral Niels Juel smashed the Swedish fleet in Køge Bay. On land the Danes failed to storm Malmö in June and were beaten again at Landskrona on 14 July, while Gyldenløve’s Norwegians took Marstrand and won at Uddevalla. Far to the south, the Elector of Brandenburg forced Stettin to surrender in December 1677.
    facts:
      - - Battle of Lund
        - 4 December 1676, Swedish victory
      - - Køge Bay
        - Danish naval victory under Niels Juel, 1–2 July 1677
    markers:
      - kind: battle
        side: se
        name: Battle of Lund
        date: 4 December 1676
        lonlat:
          - 13.189
          - 55.7004
        text: Both kings commanded in person. Part of the Danish army was driven onto the ice of a stream, which broke, and many drowned.
      - kind: held
        side: se
        name: Siege of Malmö
        date: 11 June – 5 July 1677
        lonlat:
          - 13.0007
          - 55.5986
        lp: b
        text: The only Scanian stronghold the Danes had not taken. Their night assault on 25–26 June failed and the siege was given up.
      - kind: battle
        side: se
        name: Battle of Landskrona
        date: 14 July 1677
        lonlat:
          - 12.8307
          - 55.8705
        text: Fought on Ylleshed moor outside the Danish-held town. A clear Swedish victory, though it changed little.
      - kind: naval
        side: dk
        name: Battle of Køge Bay
        date: 1–2 July 1677
        lonlat:
          - 12.3987
          - 55.4488
        lp: l
        text: Niels Juel destroyed or captured much of the Swedish fleet, leaving Denmark master of the Baltic for the rest of the war.
      - kind: siege
