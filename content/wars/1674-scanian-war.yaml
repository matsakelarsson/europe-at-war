  - title: Germany lost, Scania invaded
    date: 1675–1676
    when: "1675"
    borders: "1660"
    countries:
      - se
      - dk
      - no
      - de
    view:
      center:
        - 13.3557
        - 56.3725
      size:
        - 757
        - 754
    body:
      - Swedish Germany crumbled. Allied troops marched into Bremen-Verden and Pomerania from September 1675, and Stade, the last Swedish stronghold in Bremen-Verden, surrendered on 13 August 1676.
      - The Danes and Dutch won control of the Baltic. They took Gotland in the spring of 1676, and off Öland on 1 June the giant Swedish flagship Kronan capsized and blew up. On 29 June about 14,000 Danish troops landed at Råå near Helsingborg; many Scanians welcomed them, and Kristianstad fell in August. Charles XI beat a Danish force at Halmstad, while a Norwegian army under Ulrik Frederik Gyldenløve took Uddevalla and Vänersborg.
    facts:
      - - Danish commander
        - King Christian V
      - - Norwegian name for the war
        - Gyldenløvefeiden, after Gyldenløve
    markers:
      - kind: siege
        side: foe
        name: Stade surrenders
        date: 13 August 1676
        lonlat:
          - 9.4791
          - 53.5992
        lp: l
        text: The capital of Swedish Bremen-Verden held out longest. Its surrender left Sweden almost nothing between the Elbe and the Weser.
      - kind: siege
        side: dk
        name: Gotland taken
        date: Spring 1676
        lonlat:
          - 18.29
          - 57.6383
        text: A Danish expedition seized the island, which stayed in Danish hands until the peace.
      - kind: naval
        side: dk
        name: Battle of Öland
        date: 1 June 1676
        lonlat:
          - 16.7515
          - 56.4182
        text: A Danish-Dutch fleet under the Dutch admiral Cornelis Tromp beat the Swedes. The flagship Kronan, one of the largest warships of its day, capsized in a sharp turn and exploded, and most of its crew died.
      - kind: event
        side: dk
        name: Danes land at Råå
        date: 29 June 1676
        lonlat:
          - 12.7318
          - 55.9984
        lp: l
        text: The Danish army came ashore just south of Helsingborg, which gave up at once. Many Scanians, Danish subjects until 1658, sided with the invaders.
      - kind: siege
        side: dk
        name: Kristianstad
        date: 10–15 August 1676
        lonlat:
          - 14.1599
          - 56.0295
        text: Christian V took the fortress town and let his soldiers plunder it for three hours.
      - kind: battle
        side: se
        name: Battle of Halmstad
        date: 17 August 1676
        lonlat:
          - 12.8597
          - 56.6702
        text: Charles XI, aged 20, beat a Danish force that had marched north into Halland.
      - kind: taken
