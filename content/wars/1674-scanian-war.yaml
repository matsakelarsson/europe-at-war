  - title: Peace without gain
    date: 1678–1679
    when: "1678"
    borders: "1679"
    countries:
      - se
      - dk
      - no
      - de
    view:
      center:
        - 16.3381
        - 55.1619
      size:
        - 942
        - 589
    body:
      - "In 1678 the Swedes won back Kristianstad, though the Danes held on to Helsingborg. In Germany everything was lost: Brandenburg took Stralsund in October and Greifswald in November. That winter a Swedish army from Livonia invaded Ducal Prussia, and in January 1679 the Elector chased it out, moving his troops on sledges across the frozen lagoons. It got home having lost nearly half its men."
      - France, not Sweden, decided the peace. At Saint-Germain on 29 June 1679 Brandenburg gave back Pomerania except a strip east of the Oder. French pressure then forced Denmark to return all its conquests at Fontainebleau, confirmed at Lund on 26 September 1679. Sweden came out with almost no losses, but only because Louis XIV insisted.
    facts:
      - - Lost
        - The strip of Pomerania east of the Oder, to Brandenburg
      - - Treaties
        - Saint-Germain (29 June), Fontainebleau (2 September) and Lund (26 September 1679)
      - - Earlier in 1679
        - Peace with the Emperor, Brunswick-Lüneburg and Münster
    markers:
      - kind: siege
        side: foe
        name: Stettin
        date: Summer – December 1677
        lonlat:
          - 14.5495
          - 53.4289
        text: After a long siege the capital of Swedish Pomerania surrendered to the Elector.
      - kind: siege
        side: foe
        name: Stralsund
        date: October 1678
        lonlat:
          - 13.0918
          - 54.3095
        lp: l
        text: The Elector of Brandenburg forced the great Pomeranian port to surrender.
      - kind: siege
        side: foe
        name: Greifswald
        date: November 1678
        lonlat:
          - 13.3782
          - 54.0998
        text: Sweden’s last possession on the Continent fell.
      - kind: siege
        side: se
        name: Kristianstad
        date: "1678"
        lonlat:
          - 14.1599
          - 56.0295
        text: A Swedish siege won the fortress town back from the Danes.
      - kind: event
        side: foe
        name: The Great Sleigh Drive
        date: January 1679
        lonlat:
          - 21.872
          - 55.0785
        text: Frederick William’s troops crossed the frozen Frisches Haff and Curonian Lagoon on sledges to drive the Swedes out of Prussia.
      - kind: treaty
        side: se
        name: Peace of Lund
        date: 26 September 1679
        lonlat:
          - 13.189
          - 55.7004
        text: Denmark and Sweden confirmed the borders of 1660, and Sweden kept its exemption from the Sound Dues. Secret articles even made the two old enemies allies.
