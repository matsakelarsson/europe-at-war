  - title: Surabaya, the fall of Plered and the Company’s price
    date: "1677"
    when: "1677-05"
    borders: "1677-07"
    countries: [id, nl]
    body:
      - Amangkurat I asked the Company for help, and in April 1677 Admiral Cornelis Speelman sailed for Surabaya with a fleet carrying European, Ambonese and Bugis troops. After talks failed, his men stormed Surabaya in May after hard fighting, taking 69 iron and 34 bronze guns. Company forces burned Trunajaya’s residence on Madura, and Trunajaya fled inland to Kediri, which he made his new capital.
      - In the interior the rebels were winning. In June 1677 they took the royal capital, Plered, almost without a fight and plundered it, carrying off the treasury to Kediri. The sick king fled west with the crown prince and died at Tegal in July. The crown prince, now Amangkurat II, had no army and no treasury; his brother Pangeran Puger occupied the ruins of Plered and claimed the throne.
      - Amangkurat II sailed to Jepara on Company ships and in September and October 1677 agreed to Speelman’s terms. The Company was to receive the revenues of all the north-coast ports and repayment of its war costs, Mataram would cede it the Priangan highlands south of Batavia and the town of Semarang, and non-Javanese in the kingdom would come under Company courts. In return the Company would restore him to his throne.
    facts:
