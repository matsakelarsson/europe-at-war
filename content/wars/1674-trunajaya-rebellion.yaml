id: trunajaya-rebellion
name: Trunajaya rebellion
start: "1674"
end: "1680-04"
tier: B
summary: "A rebellion against King Amangkurat I of Mataram, led by Trunajaya, a prince of Madura, and joined by Makassarese fighters who had left South Sulawesi after the Makassar War, by the spiritual lord of Giri and by Javanese nobles weary of the king’s cruelty. Raids on the north coast of Java from 1674 grew into open war: in 1676 a rebel army of about 9,000 crossed from Madura, routed the royal army at Gegodog near Tuban and took most of the north coast. In 1677 the Dutch East India Company (VOC), called in by Mataram, took Surabaya from Trunajaya, but the rebels took and plundered the royal capital, Plered; Amangkurat I died in flight, and his son Amangkurat II bought the Company’s help with sweeping concessions. Company troops, Bugis under Arung Palakka and Javanese levies took Trunajaya’s new capital, Kediri, in November 1678; Trunajaya surrendered in December 1679 and was stabbed to death by Amangkurat II in January 1680, and the last rebels at Giri were crushed in April. Amangkurat II built a new capital at Kartasura with a Company garrison beside his palace: Mataram survived, but the Company had become the arbiter of Javanese politics."
countries: [id, nl]
