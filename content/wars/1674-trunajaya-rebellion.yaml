  - title: Kediri and the end of the rebellion
    date: 1678–1680
    when: "1678-11-25"
    borders: "1679-12"
    countries: [id, nl]
    body:
      - The restored king and the Company made slow progress at first; at the start of 1678 they held only a few towns on the central north coast. In September 1678 a combined army, more than 13,000 Javanese levies with about 1,750 Company troops and 1,500 Bugis under Arung Palakka, marched inland from the coast in three columns, gathering local lords as it went. On 25 November 1678 an assault led by Captain François Tack took Kediri, and Amangkurat II set up his court at Surabaya.
      - Trunajaya escaped into the mountains of East Java. In 1679 Company and Bugis forces defeated his allies one by one. Raden Kajoran, a revered holy man who had backed him, was defeated at Mlambang near Pajang in September and executed after he surrendered, and Bugis under Arung Palakka drove the Makassarese from their stronghold at Keper in November. Isolated and starving, Trunajaya surrendered to the Company on 26 December 1679. In January 1680, during a ceremonial visit to the king at Payak, Amangkurat II and his courtiers stabbed him to death; the king claimed that Trunajaya had tried to kill him. In April 1680, after what the Company called the fiercest battle of the war, the lord of Giri was defeated and most of his family executed.
      - Amangkurat II built a new capital at Kartasura in 1680, with a Company fort beside the palace, and drove Pangeran Puger from Plered; Puger submitted only in November 1681. The rebellion left Mataram heavily in debt and dependent on Company troops, and began the pattern of the Company backing Javanese kings and claimants in return for land and trade.
