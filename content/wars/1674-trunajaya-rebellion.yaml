notes:
  - The Makassarese bands that joined Trunajaya were exiles who had refused the Treaty of Bungaya of 1667; the Dutch called them pirates. Their leader, Karaeng Galesong, was a son of Sultan Hasanuddin of Gowa and married Trunajaya’s daughter.
  - The rebellion is known from VOC reports and from the Javanese chronicles (babad), which present Trunajaya’s rise as foretold. Many Javanese supported him in the expectation that the Mataram dynasty’s time had run out, and the crown prince had at first conspired with him against his own father.
  - Amangkurat II’s brother Pangeran Puger held the ruined capital, Plered, as a rival king from 1677 until he submitted in 1681; he later reigned as Pakubuwono I.
