steps:
  - title: Madura, the Makassarese and Gegodog
    date: 1674–1676
    when: "1676-10"
    borders: "1676-10"
    countries: [id]
    body:
      - Amangkurat I, who succeeded Sultan Agung in 1646, ruled by terror, killing rivals, Islamic teachers and even his own kin, and the crown prince was estranged from him. In 1670 the crown prince found an ally in Trunajaya, a prince of the Madurese royal house, who by 1671 had made himself master of Madura. Trunajaya joined forces with bands of Makassarese, exiles from the Makassar War who had settled at Demung on the east coast of Java and raided the north coast; the Dutch called them pirates. Their leader, Karaeng Galesong, married Trunajaya’s daughter. In 1675 they burned the coastal towns from Pajarakan to Surabaya and Gresik, and the lord of Giri, the most revered Islamic teacher of East Java, gave the rising his blessing. Trunajaya took the title Panembahan Maduretna.
      - In September 1676 a rebel army of about 9,000, Madurese, Makassarese and Javanese, crossed from Madura to Java and took Surabaya. Mataram sent a much larger army under the crown prince, which met the rebels at Gegodog, east of Tuban, in October and was routed; the king’s uncle Pangeran Purbaya was killed and the crown prince fled home. By January 1677 the rebels held nearly every port on the north coast from Surabaya to Cirebon, except Jepara, where the Company held out.
