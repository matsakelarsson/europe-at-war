  - title: The Native offensive, February – April 1676
    date: February – April 1676
    when: "1676-02"
    borders: "1676-03-29"
    countries: [us]
    body:
      - Metacom spent the winter at Schaghticoke on the Hoosic River in New York, hoping for help or arms from the Mohawk or the French. Instead, in February 1676 the Mohawk, old enemies of the New England Algonquian nations, attacked his camp, whether on their own account or encouraged by New York’s governor Edmund Andros; estimates of the dead range from about 70 to over 400. Metacom’s people fell back east, and the Mohawk threat hung over them for the rest of the war.
      - The Native coalition nonetheless struck deep into the colonies. On 10 February Nipmuc, Narragansett and Wampanoag warriors burned Lancaster and took Mary Rowlandson and others captive; her account, published in 1682, became one of the most read books of its time. Medfield, Weymouth, Groton, Marlborough, Rehoboth, Warwick and many other towns were attacked. On 26 March Narragansett warriors under Canonchet destroyed Captain Michael Pierce’s company of Plymouth soldiers and Christian Indians near the Pawtucket River, and on 29 March they burned Providence, though they spared its founder Roger Williams. On 21 April a large force attacked Sudbury, only some 30 km from Boston, and ambushed Captain Samuel Wadsworth’s relief column, killing him and about thirty of his men.
      - The colonies’ Native allies hit back. In early April Connecticut troops with Mohegan, Pequot and Niantic warriors captured Canonchet near the Pawtucket River as he went to fetch seed corn; he refused to make peace and was put to death at Stonington by his Native captors.
    facts:
      - [Mohawk attack at Schaghticoke, "February 1676"]
      - [Lancaster burned, "10 February 1676"]
      - [Providence burned, "29 March 1676"]
      - [Sudbury fight, "21 April 1676"]
