  - title: The war spreads, from Pocasset to the Connecticut valley
    date: July – October 1675
    when: "1675-07"
    borders: "1675-10-05"
    countries: [us]
    body:
      - In July colonial troops trapped Metacom in the Pocasset swamps, but he and Weetamoo slipped away with their people across the Taunton and the Seekonk rivers into Nipmuc country. The Nipmuc, among whom Massachusetts had been gathering converts into praying towns, joined the war. On 2 August Nipmuc warriors under Muttawmp ambushed a Massachusetts party under Edward Hutchinson and Thomas Wheeler near Brookfield and besieged the survivors and the townspeople in a garrison house for two days until Simon Willard’s troops arrived; Brookfield was abandoned.
      - The fighting moved to the Connecticut River valley, the granary of New England, where the Pocumtuck and other valley peoples joined the war. Northfield and Deerfield were attacked and abandoned. On 18 September Pocumtuc, Nipmuc and Wampanoag warriors, with Muttawmp and Monoco among their leaders, ambushed Captain Thomas Lathrop’s company escorting carts of grain from Deerfield at Bloody Brook, killing some sixty to seventy soldiers and teamsters. On 5 October the Agawam and their allies burned most of Springfield, the largest town of the valley; an attack on Hatfield on 19 October was beaten off. The United Colonies (Massachusetts Bay, Plymouth and Connecticut) had declared war on 9 September.
      - Fear and anger turned against the Christian Indians, many of whom served the colonies as scouts and soldiers. In October Massachusetts removed the people of the praying towns, between 500 and about 1,100, most of them women and children, to Deer Island in Boston Harbor, where with little food or shelter many died over the winter, by some estimates about half.
    facts:
      - [Brookfield (Wheeler’s Surprise), "2–4 August 1675"]
      - [Bloody Brook, "18 September 1675, some 60–70 colonists killed"]
      - [Springfield burned, "5 October 1675"]
