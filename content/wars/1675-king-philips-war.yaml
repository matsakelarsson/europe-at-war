  - title: The war in Maine and the Treaty of Casco
    date: September 1675 – April 1678
    when: "1675-09"
    borders: "1678-04-12"
    countries: [us]
    body:
      - In Maine, then part of Massachusetts, English fishing and trading settlements stretched along the coast to the Kennebec and beyond. After the outbreak in the south, colonists went up the Kennebec in 1675 to demand that the Wabanaki give up their guns, without which they could not hunt, and English sailors overturned the canoe of the wife of the Saco sagamore Squando, whose infant son died. From September 1675 Wabanaki warriors under Mogg Heigon of the Androscoggin, Squando and others attacked the settlements from Saco and Scarborough to Falmouth (Casco) and Arrowsic, and in 1677 they took some twenty fishing ketches and destroyed the Maine fishery.
      - In September 1676 Major Richard Waldron at Cochecho (Dover, New Hampshire) invited about four hundred Native people, half of them local Pennacook and half refugees from the south, to a mock battle and took them prisoner. He sent the refugees and those who resisted to Boston, where leaders such as the Nashaway sachem Monoco were hanged and most of the rest were sold into slavery abroad, mostly in Barbados. The Pennacook took their revenge on Waldron in 1689. Massachusetts expeditions into Maine achieved little.
      - The Wabanaki sued for peace in 1677. By the Treaty of Casco of 12 April 1678, made by New York, which then governed the coast east of the Kennebec, and Massachusetts with Wabanaki leaders headed by the Penobscot sagamore Madockawando, the colonists could return to their farms but each English family was to pay the Wabanaki a peck of corn a year, an acknowledgement that the land was still theirs. Some 400 colonists had died in the northern war, and the Wabanaki kept their power in eastern Maine; the next war came with King William’s War in 1688–1689.
    facts:
      - [Wabanaki attacks begin, "September 1675"]
      - [Waldron’s seizure at Cochecho, "7 September 1676, about 400 people"]
      - [Treaty of Casco, "12 April 1678"]
