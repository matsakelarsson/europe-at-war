id: king-philips-war
name: King Philip’s War (Metacom’s War)
start: "1675-06-20"
end: "1678-04-12"
tier: A
summary: "A war between the English colonies of New England and the Wampanoag under their sachem Metacom, whom the English called King Philip, joined by the Nipmuc, the Pocumtuck and, after the colonists attacked them, the Narragansett, while the Mohegan, the Pequot, many Christian Indians and the Mohawk fought against them. Half a century of English expansion over Native land, the colonies’ claims to judge and disarm their Native neighbours, and the hanging of three Wampanoag men by Plymouth in June 1675 led to the first attacks at Swansea. Native forces struck more than half of New England’s towns and destroyed a dozen of them, among them Springfield, Lancaster and Providence, and won at Bloody Brook and Sudbury. The colonists burned the Narragansett fort in the Great Swamp in December 1675, killing hundreds of women and children, and from the spring of 1676, with their Native allies, hunger and a Mohawk attack on Metacom’s winter camp, they wore the coalition down. Metacom was killed at Mount Hope on 12 August 1676; the war in Maine went on until the Treaty of Casco in April 1678. Estimates of the dead range from about 600 to over 1,000 colonists and from about 3,000 to more than 5,000 Native people, killed or dead of hunger and disease; hundreds, perhaps over a thousand, Native captives were sold into slavery in the West Indies and elsewhere. In proportion to population it was among the deadliest wars in American history."
countries: [us]
