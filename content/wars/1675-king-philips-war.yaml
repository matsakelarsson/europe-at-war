  - title: The Great Swamp, 19 December 1675
    date: November – December 1675
    when: "1675-12"
    borders: "1675-12-19"
    countries: [us]
    body:
      - The Narragansett, the largest nation of southern New England, tried to stay out of the war. Their sachem Canonchet signed a treaty of neutrality with Massachusetts in October, but they sheltered Wampanoag women and children and would not hand them over. The United Colonies decided to strike first, and on 2 November declared war on them. Governor Josiah Winslow of Plymouth led about a thousand Plymouth, Massachusetts and Connecticut soldiers, with about 150 Mohegan and Pequot warriors, around Narragansett Bay, burning abandoned towns.
      - Guided by a captive, they found the Narragansett winter town, a fort of several acres on an island in a frozen swamp near what is now South Kingstown, on 19 December. The troops broke in after heavy losses among their officers and set fire to the wigwams and the winter stores. Estimates of the Narragansett dead range from several hundred to about a thousand, most of them women, children and old people; at least 97 were warriors. About seventy colonists were killed or died of wounds on the night march back through the snow, and some 150 were wounded.
      - Most of the Narragansett warriors escaped into the swamp. The attack brought the Narragansett into the war under Canonchet, with thousands of people who had lost their food for the winter. Historians have called it one of the most lopsided and brutal fights in New England’s history; the Narragansett remember it as a massacre.
    facts:
      - [Colonial army, "about 1,000 soldiers and 150 Mohegan and Pequot"]
      - [Narragansett dead, "estimates range from several hundred to about 1,000"]
      - [Colonists killed, "about 70, and some 150 wounded"]
    markers:
