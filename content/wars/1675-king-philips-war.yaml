  - title: Peskeompscut and the turn of the tide
    date: May – July 1676
    when: "1676-05"
    borders: "1676-07-02"
    countries: [us]
    body:
      - By spring the Native coalition was short of food and powder; its people had lost their fields and stores, and many were sick. Thousands gathered in May at the falls of the Connecticut River, the fishing place of Peskeompscut, while Massachusetts opened talks with some Nipmuc leaders and ransomed captives, Mary Rowlandson among them. At dawn on 19 May Captain William Turner with about 150 militiamen fell on the camp at the falls and killed between 100 and 200 people, by some counts more, most of them women, children and old people. Warriors from the camps nearby counter-attacked, and Turner and some 38 of his men were killed in the retreat.
      - The coalition attacked Hadley on 12 June and was beaten off with the help of Mohegan warriors. Colonial companies of volunteers and Native allies, among them Benjamin Church’s mixed force of Plymouth men and Sakonnet warriors whom Awashonks brought over to the English side, now hunted down bands that were trying to plant or fish. On 2 July Connecticut troops with Mohegan and Pequot warriors caught the Narragansett saunkskwa Quaiapen and her people near Nipsachuck in northern Rhode Island and killed or captured more than a hundred; Quaiapen was killed.
      - Hundreds of Nipmuc, Narragansett and Wampanoag people surrendered in June and July in return for promises of mercy; many were still executed or sold. Others went north to the Pennacook and Wabanaki, west to the Mahican or to the French missions in Canada.
    facts:
      - [Peskeompscut (Turners Falls), "19 May 1676, 100–200 or more Native people killed; 38 colonists killed"]
      - [Attack on Hadley beaten off, "12 June 1676"]
      - [Nipsachuck, "2 July 1676"]
