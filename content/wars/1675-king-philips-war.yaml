steps:
  - title: Metacom, Plymouth and John Sassamon
    date: 1662 – June 1675
    when: "1675-01"
    borders: "1675-06-01"
    countries: [us]
    body:
      - Massasoit (Ousamequin), the Wampanoag sachem who had allied with the Plymouth colonists in 1621, died about 1661. His elder son Wamsutta, whom the English called Alexander, died in 1662 soon after being taken to Plymouth for questioning, and the younger, Metacom (Philip), became sachem of the Pokanoket and leader of the Wampanoag at Montaup (Mount Hope). Over fifty years English settlement had spread across southern New England; colonists bought or claimed Native land, their unfenced livestock trampled Native fields, Puritan missionaries gathered Christian Indians into “praying towns”, and colonial courts claimed to judge Native people. Plymouth also bought land from men who had no right to sell it, slighting the women sachems (saunkskwas) Weetamoo of Pocasset and Awashonks of Sakonnet, whose people held it. In 1671 Plymouth made Metacom accept its authority and hand over his people’s guns.
      - In January 1675 John Sassamon, a Christian Massachusett man educated at Harvard who had been Metacom’s interpreter and had warned Plymouth that Metacom was preparing for war, was found dead under the ice of Assawompset Pond. On the word of a single Native witness Plymouth arrested three Wampanoag men, one of them a counsellor of Metacom, and a jury of twelve colonists with six Native elders sitting beside them found them guilty. They were hanged at Plymouth on 8 June 1675.
      - Young Pokanoket men began plundering the houses of Swansea, the English town nearest Mount Hope. After a colonist shot one of them, they attacked on 24 June and killed several settlers. Plymouth and Massachusetts sent troops, who found Mount Hope empty on 28 June; Metacom and his people had crossed to Pocasset, Weetamoo’s country across the Taunton River.
    facts:
      - [Sassamon’s body found, "January 1675"]
      - [Three Wampanoag men hanged, "8 June 1675"]
      - [First attacks at Swansea, "20–24 June 1675"]
