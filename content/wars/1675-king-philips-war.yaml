notes:
  - The New England colonies used the Julian calendar (Old Style), ten days behind the Gregorian; the dates here are Old Style, as in the standard accounts (Metacom was killed on 12 August 1676 Old Style, 22 August New Style).
  - Most accounts of the war were written by colonists, among them the ministers Increase Mather and William Hubbard, the soldier Benjamin Church and the captive Mary Rowlandson; Native views survive in their reports, in a few petitions and in Wampanoag, Narragansett and Nipmuc oral tradition. Numbers of fighters and dead are rough, and estimates differ widely.
  - Estimates put New England’s colonists at some 50,000 to 80,000 in 1675 and the Native people of southern New England at perhaps 10,000 to 20,000, their numbers cut by epidemics since 1616. The base map shows the English colonies; the lands of the Native nations are drawn as areas in the steps.
  - The Narragansett tried to stay neutral until the colonies attacked them in December 1675; Rhode Island, whose towns of Providence and Warwick were burned, did not join the United Colonies’ war.
