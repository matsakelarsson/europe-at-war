  - title: The death of Metacom
    date: July – August 1676
    when: "1676-08"
    borders: "1676-08-12"
    countries: [us]
    body:
      - Metacom returned to his own country with a dwindling band, pursued by Church’s company. Weetamoo drowned in the Taunton River on 6 August trying to escape her pursuers; the colonists cut off her head and set it on a pole at Taunton. Metacom’s wife Wootonekanuske and their nine-year-old son had been captured a few days before. On 12 August Church’s men, guided by a deserter, surrounded Metacom in a swamp at Mount Hope, and John Alderman, a Wampanoag man serving with the English (by the Mathers’ account one of Weetamoo’s people), shot him dead.
      - Metacom’s body was quartered and his head set on a pole at Plymouth, where it stayed for some twenty years; Wampanoag tradition holds that his people later took the skull and buried it in secret. On 28 August Church captured Anawan, Metacom’s old war captain, at Anawan Rock; Plymouth executed him. Captive men were hanged or sold, and the colonies sold hundreds of Native captives, Metacom’s son among them, as slaves to Bermuda, Barbados, Jamaica, Spain, Portugal and the Atlantic islands; women and children were bound to colonial households.
      - The war in southern New England was over. Estimates of the colonists killed range from about 600 to over 1,000, a tenth of the men of military age in Plymouth and Rhode Island, and a dozen towns were destroyed. Native losses were far greater. Estimates range from about 3,000 to more than 5,000 dead in battle or of hunger and disease, out of a population that may have fallen by half or more, and most of the survivors lost their land. Wampanoag communities endured on Cape Cod, Martha’s Vineyard and Nantucket and at Mashpee; the Mashpee and Aquinnah Wampanoag, the Narragansett, the Mashantucket Pequot and the Mohegan are federally recognised nations today.
    facts:
      - [Death of Metacom, "12 August 1676, Mount Hope"]
      - [Colonists killed in the war, "estimates range from about 600 to over 1,000"]
      - [Native dead, "estimates range from about 3,000 to more than 5,000"]
      - [Native captives sold into slavery, "hundreds, perhaps over 1,000"]
    markers:
      - kind: battle
        side: uc
        name: Mount Hope
        date: 12 August 1676
        text: Metacom was shot by John Alderman, a Wampanoag man in Benjamin Church’s company, in a swamp below the hill.
        lonlat: [-71.261, 41.687]
        lp: b
      - kind: event
        side: uc
        name: Taunton River
        date: 6 August 1676
        text: Weetamoo, saunkskwa of Pocasset, drowned here while escaping; her head was displayed at Taunton.
        lonlat: [-71.140, 41.780]
        lp: t
      - kind: event
        side: uc
        name: Anawan Rock
        date: 28 August 1676
        text: Metacom’s old war captain Anawan surrendered to Church here.
        lonlat: [-71.220, 41.860]
        lp: t
      - kind: event
        side: uc
        name: Plymouth
        date: August 1676
        text: Metacom’s head was displayed here for some twenty years. Plymouth sold captives as slaves to the West Indies.
        lonlat: [-70.668, 41.958]
