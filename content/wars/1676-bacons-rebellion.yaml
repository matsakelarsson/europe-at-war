id: bacons-rebellion
name: Bacon’s Rebellion
start: "1676-04"
end: "1677-01"
tier: C
summary: "An armed rising in the Colony of Virginia in 1676 against Governor William Berkeley, led by the young planter Nathaniel Bacon, which began as unauthorised war on Native peoples. In July 1675 a quarrel between colonists and the Doeg on the Potomac led Virginia militia to kill fourteen Susquehannock by mistake; in September 1675 Maryland and Virginia militia besieged the Susquehannock fort on Piscataway Creek and killed five of their chiefs who had come out to parley. The Susquehannock answered with raids that killed dozens of colonists in Maryland and Virginia in early 1676. Frontier planters, angered by low tobacco prices, high taxes and Berkeley’s defensive plan of forts and his trade with Native allies, followed Bacon without a commission. In May 1676 his men killed many of the Occaneechi on the Roanoke River, who had just fought the Susquehannock for them, and in August and September they hunted the Pamunkey, allies of the colony, through the swamps of their country and took 45 prisoners. Berkeley declared Bacon a rebel; Bacon forced a commission from the assembly at gunpoint, issued a “Declaration of the People” against the governor on 30 July, and on 19 September 1676 (Old Style) burned Jamestown. Bacon promised freedom to servants and enslaved people who joined him, and in the last months indentured servants and enslaved Africans were among the rebels’ last holdouts. Bacon died of dysentery on 26 October 1676, and his successor, John Ingram, surrendered to Royal Navy captains in November and January; Berkeley had at least thirteen and by most counts twenty-three rebels hanged; a royal commission and 1,000 soldiers arrived in early 1677, and he was recalled. The Treaty of Middle Plantation of May 1677 with the Pamunkey queen Cockacoeske and other nations confirmed their reserved lands as tributaries of the Crown. Historians long saw the rebellion as a forerunner of the Revolution; most now stress its war on Native peoples and the planters’ turn from indentured servants to enslaved Africans that followed."
