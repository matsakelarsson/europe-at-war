notes:
  - Virginia used the Julian calendar; dates are Old Style, as the standard references give them.
  - The rebellion is known from Berkeley’s and the rebels’ papers, the report of the royal commissioners of 1677 and later accounts by planters; the Native nations’ side comes through them. Estimates of the Occaneechi killed range from about 100 to 400.
  - The Susquehannock had been weakened by their long war with the Haudenosaunee, told in the Beaver Wars.
