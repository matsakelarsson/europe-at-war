id: russo-turkish-war-1676
name: Russo-Turkish War of 1676–1681
start: "1676"
end: "1681"
tier: C
summary: A war between Russia and the Cossack Hetmanate of left-bank Ukraine on one side and the Ottoman Empire and the Crimean Khanate on the other, fought above all for Chyhyryn, the Cossack capital that the Ottoman vassal hetman Petro Doroshenko surrendered to Russian and Cossack forces in 1676. The Ottomans failed to take it in 1677 but took and destroyed it in 1678. The Treaty of Bakhchisarai of 1681, a twenty-year truce, made the Dnieper the border and left Kyiv to Russia.
