notes:
  - Also called the Chyhyryn campaigns. Some accounts date the war from 1672, when the Ottomans invaded Podolia.
  - The Treaty of Bakhchisarai is dated 3 January 1681 in the Julian calendar used in Russia, 13 January in the Gregorian calendar.
