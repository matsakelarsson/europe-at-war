id: thokoly-uprising
name: Thököly Uprising
start: "1678-06"
end: "1685-10"
tier: C
summary: A rising of the kuruc, the Hungarian rebels against Habsburg rule, led by the young Upper Hungarian magnate Imre Thököly. After the Magnate Conspiracy of 1670–1671 Leopold I suspended the Hungarian constitution, ruled through a governing council and persecuted Protestants, and thousands of dispossessed nobles, discharged soldiers and runaway serfs fled to Ottoman Hungary and Transylvania. With French subsidies and Transylvanian help, Thököly took command in 1678 and invaded Royal Hungary, seizing the mining towns of Upper Hungary. In 1681 Leopold restored some of the estates’ rights at the Diet of Sopron, but Thököly turned to the Ottomans. In 1682, helped by the pasha of Buda, he took Kassa and Fülek, and the sultan recognised him as “King of Upper Hungary”, a title he used as prince, in return for tribute. In the same year he married Ilona Zrínyi, widow of Francis I Rákóczi. In 1683 his kuruc fought alongside the grand vizier’s army that besieged Vienna. After the Ottoman defeat his support melted away; imperial armies retook Upper Hungary, he was defeated near Eperjes in 1685, and in October the Ottoman pasha of Várad, suspecting him of dealing with the emperor, had him arrested and sent in chains to Edirne. Ilona Zrínyi held out in the castle of Munkács until January 1688. Thököly, later briefly prince of Transylvania, died in exile in İzmit in 1705.
