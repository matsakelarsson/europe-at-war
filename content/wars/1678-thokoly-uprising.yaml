notes:
  - Dates are Gregorian. Kuruc bands had fought the Habsburg authorities since the early 1670s; the uprising is usually dated from Thököly’s leadership in 1678. The war of 1683–1699, including the siege of Vienna and Thököly’s later campaigns, is told in the entry on the Great Turkish War.
  - Ilona Zrínyi’s son by her first marriage, Francis II Rákóczi, led the next great kuruc rising in 1703–1711, which has its own entry.
