  - title: The long Rathor war
    date: 1681 – March 1707
    when: "1707-03-12"
    borders: "1707-03-12"
    countries: [in]
    body:
      - In Marwar the war went on for another quarter-century. Ajit Singh was kept hidden in the hills, and the Rathor clans raided Mughal posts, collected revenue from villages and made the Mughal hold on the country little more than the towns and the roads. Durgadas returned from the Deccan in 1687 and led the resistance; in 1698 he handed back Prince Akbar’s two children, whom he had brought up as Muslims, and Aurangzeb gave him a rank at court, but the war soon flared again. Ajit Singh’s attempts on Jodhpur in 1701 and 1706 failed.
      - Aurangzeb died in the Deccan on 3 March 1707. On 12 March Ajit Singh entered Jodhpur, drove out the Mughal garrison and took Sojat, Pali and Merta. The new emperor, Bahadur Shah I, marched on Rajasthan in 1708, but the Rathors, now allied with the rulers of Mewar and Amber, held out, and he soon had to recognise Ajit Singh as king of Marwar.
    facts:
      - [Durgadas returns from the Deccan, "1687"]
      - [Ajit Singh enters Jodhpur, "12 March 1707"]
