steps:
  - title: Jodhpur under Mughal rule
    date: November 1678 – 1679
    when: "1679-07"
    borders: "1679-07"
    countries: [in]
    body:
      - Jaswant Singh, the Rathor king of Marwar and one of the great Rajput nobles of the empire, died on duty at Jamrud near the Khyber Pass in November 1678. He left no living son, and early in 1679 Aurangzeb placed Jodhpur under Mughal officers; temples in the city were pulled down. Two of Jaswant’s widows gave birth to sons at Lahore in February, one of whom, Ajit Singh, survived. In May the emperor gave the throne of Marwar to a great-nephew of Jaswant, Inder Singh of Nagaur, for a large payment, and in April he reimposed the jizya on all his non-Muslim subjects.
      - Aurangzeb wanted Ajit Singh brought up in the imperial household. In July 1679 Jaswant’s widows and the infant were in Delhi, guarded by Mughal troops, when the Rathor captain Durgadas Rathore and his companions fought their way out of the city; most of the escort were killed in the streets, while the baby was carried away in disguise. Aurangzeb declared the child an impostor. In the autumn he moved to Ajmer and sent armies into Marwar, which occupied Jodhpur and the plains.
    facts:
      - [Death of Jaswant Singh, "November 1678, at Jamrud"]
      - [Jizya reimposed, "April 1679"]
      - [Escape of Ajit Singh from Delhi, "July 1679"]
