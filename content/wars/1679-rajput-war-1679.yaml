notes:
  - The war is also called the Rathore rebellion. Aurangzeb’s reimposition of the jizya, the poll tax on non-Muslims, in April 1679, and the destruction of temples in Jodhpur and Udaipur, made it in Rajput memory a war of faith as well as of succession; historians still debate how far religion or politics drove Aurangzeb’s policy.
  - Dates follow the usual English-language accounts, which go back to Jadunath Sarkar and are partly in the Julian calendar.
