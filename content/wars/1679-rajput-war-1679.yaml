  - title: Mewar and Prince Akbar
    date: 1680–1681
    when: "1681-01"
    borders: "1681-01"
    countries: [in]
    body:
      - Rana Raj Singh of Mewar sheltered the Rathors and refused the jizya. In January 1680 Aurangzeb invaded Mewar. The Rana abandoned Udaipur and Chittor and withdrew into the Aravalli hills, from where his forces cut Mughal supply lines; temples in Udaipur were destroyed, but the Mughal armies could not catch the Rajput forces in the hills. Raj Singh died in November 1680, and his son Jai Singh carried on the war.
      - The emperor’s fourth son, Prince Akbar, commanding in Rajasthan, was persuaded by the Rajput leaders that his father’s policies were ruining the empire. On 1 January 1681 he proclaimed himself emperor and marched on Ajmer with the Rathor and Sisodia forces, while most of Aurangzeb’s troops were away. Aurangzeb had a letter written to Akbar praising him for luring the Rajputs into a trap and let it fall into their hands; the Rajputs, suspecting betrayal, left Akbar’s camp, and his own army dissolved. Durgadas, learning the truth too late, took Akbar south to the court of the Maratha king Sambhaji. In June 1681 Rana Jai Singh made peace, ceding three districts in lieu of the jizya, and the Mughal army left Mewar.
    facts:
      - [Mughal invasion of Mewar, "January 1680"]
      - [Akbar proclaims himself emperor, "1 January 1681"]
      - [Peace with Mewar, "June 1681"]
