id: rajput-war-1679
name: Rajput war (1679–1707)
start: "1679"
end: "1707-03-12"
tier: B
summary: "The war between Aurangzeb and the Rajput kingdoms of Marwar and Mewar. When Maharaja Jaswant Singh of Marwar died at Jamrud in 1678 without a living heir, Aurangzeb took Jodhpur under direct rule and tried to bring Jaswant’s posthumous son, Ajit Singh, up at his court. The Rathor nobles under Durgadas Rathore smuggled the boy out of Delhi, and Rana Raj Singh of Mewar took up their cause. Mughal armies occupied both kingdoms in 1679–1680, and in 1681 Aurangzeb’s son Prince Akbar went over to the Rajputs and proclaimed himself emperor, but his army melted away and he fled to the Marathas. Mewar made peace in 1681; the Rathors fought on in a guerrilla war for a quarter of a century, until Ajit Singh retook Jodhpur days after Aurangzeb’s death in 1707."
