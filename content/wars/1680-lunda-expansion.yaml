notes:
  - "Almost all of this history rests on Lunda, Kazembe and Luba oral traditions recorded in the 19th and 20th centuries and on the reports of Portuguese traders and travellers. The traditions speak of perpetual kingship (each ruler “became” his predecessor and took his name), which makes the order and dates of the early rulers uncertain; dates before about 1800 are approximate, and some writers date the first mwant yav to the 1660s."
  - "The Lunda “empire” was a loose commonwealth: most of the land shown as Lunda was held by chiefs who paid tribute to the mwant yav’s capital, the musumba, and kept their own rulers. Its frontier wars were mostly raids and expeditions rather than battles that the sources record."
