id: lunda-expansion
name: Lunda expansion
start: "1680"
end: "1850"
tier: C
summary: "The growth of the Lunda state of the mwant yav (Mwata Yamvo), from its heartland on the upper Kasai and Bushimaie rivers in south-western Katanga, into a commonwealth of tributary chiefdoms that reached from the Kwango in the west to the Luapula in the east. Lunda traditions trace the kingship to the marriage of Ilunga Tshibinda, a hunter-prince from the Luba country, with the Lunda princess Ruwej (Lueji). The first ruler whom historians regard as well attested is Nawej, from about 1695: he campaigned against the Sala Mpasu to the north and was killed when an army of the Luba-speaking Kanyok kingdom invaded Lunda, until his successor Muland drove the Kanyok out. Under Yav a Nawej, in the 1720s or thereabouts, the war leader Mai pushed the frontier west across the Kasai against the Lulua, and Muteb led settlers and soldiers north-west along the Kwilu. Around 1740 a Lunda general, the first Mwata Kazembe, Ng’anga Bilonda, led a force east in pursuit of a rival; his successor Kanyembo crossed the Luapula, conquered the Shila and founded the Kingdom of Kazembe, which grew rich on the fisheries of Lake Mweru, the copper of Katanga and trade with the east coast, and which the Portuguese said could raise 20,000 men. The Lunda absorbed conquered chiefs as tributaries rather than replacing them, and their state reached perhaps 300,000 km² at its height in the 19th century. Their wars fed the Atlantic slave trade: Lunda caravans sold captives and ivory to the Imbangala kingdom of Kasanje and to Matamba, which passed them on to Portuguese traders at Luanda, and in the 1760s the Lunda attacked Kasanje and Matamba, apparently to trade with the Portuguese directly, but could not subdue them. Kazembe traded with Portuguese Mozambique and with Swahili and Arab merchants, and turned away the Portuguese missions of 1798 (Francisco de Lacerda, who died at Kazembe’s court) and 1831 (José Monteiro and António Gamito). From the 1850s the Yeke of Msiri took Kazembe’s lands west of the Luapula, and in the 1880s Chokwe hunters and traders, armed with guns bought from the Ovimbundu, overran the Lunda heartland."
