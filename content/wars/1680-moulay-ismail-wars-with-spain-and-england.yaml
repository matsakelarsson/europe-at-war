steps:
  - title: Tangier and La Mamora
    date: 1680–1684
    when: "1680-03"
    borders: "1684-02-06"
    countries: [ma, gb, es]
    body:
      - Moulay Ismail spent his first years as sultan putting down rivals and building a standing army, including the Abid al-Bukhari, a corps of enslaved and free Black soldiers, and he made Meknes his capital. He then turned on the European footholds on the coast. The English garrison of Tangier had built some fifteen forts outside the walls by the late 1670s, and had fought al-Khadir Ghailan in the 1660s. On 25 March 1680, after a first attempt in 1679, the qaid Omar ben Haddu laid siege to the town with 7,000–15,000 men; by the time a truce stopped the fighting from 19 May to 15 September most of the outer forts had fallen. When fighting resumed, reinforcements from England, Ireland and Scotland and Spanish cavalry had brought the garrison to over 3,000 men, and on 27 October 1680 the garrison drove the besiegers back and filled in their trenches. A truce and then a four-year peace followed.
      - Omar ben Haddu also moved against La Mamora, the Spanish fort at the mouth of the Sebou held since 1614. It fell on 3 May 1681; its commander and about 300 men were captured, and the town was renamed al-Mahdiya. In England, Parliament, in the middle of the Exclusion Crisis, would not pay for Tangier, and Charles II decided to give it up. Lord Dartmouth’s fleet arrived in 1683; over the winter the English blew up the great mole and the fortifications, and they left in early February 1684. Ali ben Abdallah er-Riffi, whose Rifian forces had blockaded the town, took possession; he and later his son governed Tangier and the north for decades.
    facts:
      - [Great Siege of Tangier, "25 March – 27 October 1680"]
      - [La Mamora taken, "3 May 1681"]
      - [English evacuation of Tangier, "February 1684"]
