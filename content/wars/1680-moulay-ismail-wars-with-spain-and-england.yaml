notes:
  - English dates for Tangier are Old Style (Julian), Spanish dates New Style. The numbers of the besiegers and of the dead come mostly from European reports and vary widely.
  - The presidios were small fortified towns, too small to show on the base map; Ceuta and Melilla, which Spain still holds, have their own atoms. England had received Tangier in 1661 as part of the dowry of Catherine of Braganza.
  - European writers made much of the Christian slaves of Meknes; historians judge that they numbered a few thousand at most at any one time, fewer than some accounts claimed.
