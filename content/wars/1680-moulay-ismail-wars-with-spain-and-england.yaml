  - title: Larache and Asilah
    date: 1689–1691
    when: "1689-07"
    borders: "1691-12-31"
    countries: [ma, es]
    body:
      - Spain had held Larache since al-Ma’mun handed it over in 1610. In July 1689 a Moroccan army under the qaid Ali ben Abdallah, by one account 30,000 horsemen, closed in on the town, defended by about 2,000 Spaniards. After a siege of four months the Spanish surrendered on 11 November 1689. About 400 of them had been killed, and some 1,600 were taken prisoner. Ismail broke the promise that the governor and a hundred officers could go free; the rest of the garrison was held at Meknes, and those who did not convert were put to forced labour until an exchange of Spanish officers for about 1,000 Moroccan prisoners was carried out at Ceuta in 1691.
      - Ahmed ben Haddu then besieged the Spanish garrison of Asilah, a town the Portuguese had first taken in 1471. After a year’s siege the garrison slipped away by sea at night in 1691, and the Rifian troops occupied the town; some sources date its fall to 1692. Larache remained Moroccan until Spain occupied it again in 1911.
    facts:
      - [Larache surrendered, "11 November 1689"]
      - [Spanish prisoners from Larache, "about 1,600–1,700"]
      - [Asilah evacuated, "1691"]
    markers:
