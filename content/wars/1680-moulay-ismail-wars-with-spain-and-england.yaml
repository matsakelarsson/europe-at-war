  - title: The siege of Ceuta
    date: 1694–1727
    when: "1694-10-23"
    borders: "1720-11-30"
    countries: [ma, es, gb]
    body:
      - On 23 October 1694 Ali ben Abdallah opened the siege of Ceuta, Spain’s stronghold on the African side of the Strait, which had passed from Portugal to Spain in 1640–1668. In July 1695 the besiegers briefly seized the Plaza de Armas of its fortifications in a surprise attack in fog, before a Spanish counter-attack drove them out. Melilla was besieged at the same time, from 1694 to 1696, and held. When an Anglo-Dutch fleet took Gibraltar in 1704, in the War of the Spanish Succession, Ceuta lost its main supply route, while Gibraltar supplied the besiegers; an envoy of the Habsburg claimant Charles demanded Ceuta’s surrender, and the governor refused.
      - The siege dragged on for a quarter of a century, with long periods of blockade and occasional assaults. In 1720 the Marquis of Lede brought about 16,000 Spanish soldiers, drove the Moroccans back to Tetouan and broke the siege; but plague broke out, the army was withdrawn in 1721 and the Moroccans returned. A storm destroyed the fleet Ismail was preparing in 1722. Moulay Ismail died in March 1727, and in the succession war among his sons the besiegers left; on 22 April 1727 a Spanish patrol found their camp empty. Ceuta and Melilla have stayed Spanish to this day.
    facts:
      - [Siege of Ceuta, "23 October 1694 – April 1727"]
      - [Relief by the Marquis of Lede, "1720, about 16,000 men"]
      - [Siege of Melilla, "1694–1696"]
    markers:
      - kind: siege
        side: es
        name: Ceuta
        date: 1694–1727
        text: Besieged for more than thirty years. The Spanish garrison held, and the relief of 1720 broke the siege for a time.
