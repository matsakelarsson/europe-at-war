id: moulay-ismail-wars-with-spain-and-england
name: Moulay Ismail’s wars with Spain and England
start: "1680-03-25"
end: "1727-04"
tier: B
summary: "The campaigns in which Sultan Moulay Ismail (r. 1672–1727) won back most of the Atlantic and Mediterranean ports that Portugal, Spain and England held in Morocco. His commanders, leading the Rifian volunteers of the Jaysh al-Rifi and the sultan’s troops, besieged English Tangier in 1680, took Spanish La Mamora (Mehdya) in 1681 and saw the English give up Tangier, after blowing up its mole and walls, in February 1684. Larache fell to them in November 1689, with some 1,600 Spanish prisoners, and Asilah in 1691. In October 1694 they laid siege to Ceuta, a siege that went on, with a Spanish relief in 1720, until after Ismail’s death in 1727; Melilla also held out. The captives of these wars were put to work on Ismail’s buildings at Meknes or ransomed through envoys and the redemptionist religious orders."
countries: [ma, es, gb]
sides:
  - id: ma
    name: Morocco under Moulay Ismail
    polities: [morocco]
    ink: red
    moves: Moroccan moves
    success: Moroccan success
  - id: en
