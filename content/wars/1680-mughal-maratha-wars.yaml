  - title: Gingee
    date: 1689–1698
    when: "1690-09"
    borders: "1694-01-01"
    countries: [in]
    body:
      - Rajaram, crowned in his brother’s place, escaped from Raigad before it fell and travelled in disguise across the peninsula to Gingee, the fortress Shivaji had taken in 1677, which he reached in November 1689. A Maratha court and government in exile gathered there, while the war in the west was left to the commanders. Zulfiqar Khan laid siege to Gingee from September 1690, but the fort of three hills could not be fully surrounded, the siege army was itself harassed by Maratha horsemen, and Zulfiqar Khan was suspected of letting it drag on. It lasted, with breaks, for more than seven years.
      - Meanwhile two Maratha generals, Santaji Ghorpade and Dhanaji Jadhav, roamed the Deccan with fast cavalry armies, living off the land, collecting tribute and attacking Mughal columns. In the winter of 1695–1696 Santaji surrounded a Mughal army under Qasim Khan at Dodderi in the Carnatic and destroyed it; Qasim Khan took poison. Santaji fell out with Rajaram and Dhanaji, and was murdered in 1697. In January 1698 Zulfiqar Khan finally stormed Gingee, after letting Rajaram slip away to the west.
    facts:
      - [Rajaram reaches Gingee, "November 1689"]
      - [Siege of Gingee, "September 1690 – January 1698"]
      - [Battle of Dodderi, "1695–1696, Maratha victory"]
