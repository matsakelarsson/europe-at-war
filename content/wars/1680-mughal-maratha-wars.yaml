  - title: The siege of the forts
    date: 1699–1705
    when: "1700-04-21"
    borders: "1703-04"
    countries: [in]
    body:
      - At the end of 1699 Aurangzeb, now over eighty, set out to take the Maratha forts himself. Satara fell in April 1700 after a five-month siege; Parli, Panhala, Vishalgad, Sinhagad, Rajgad and Torna followed between 1700 and 1704, several of them bought rather than stormed. Each siege cost months, thousands of lives and huge sums, and the monsoon rains often turned the camp into a swamp. In 1705 the emperor spent three months besieging Wagingera, the stronghold of the Berad chief Pidia Nayak, which fell in April.
      - Rajaram died at Sinhagad on 2 March 1700. His widow, Tarabai, proclaimed her young son king as Shivaji II and led the war for the next seven years, moving her court from fort to fort and appointing commanders herself. The Marathas retook most forts soon after the Mughal army moved on. War and drought brought the Deccan famine of 1702–1704, in which, according to the Venetian Niccolò Manucci, who lived in India at the time, more than two million people died.
    facts:
      - [Death of Rajaram at Sinhagad, "2 March 1700"]
      - [Satara surrenders, "April 1700"]
      - [Siege of Wagingera, "February – April 1705"]
      - [Deccan famine, "1702–1704; over two million dead, according to Manucci"]
