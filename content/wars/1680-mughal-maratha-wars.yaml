id: mughal-maratha-wars
name: Mughal–Maratha wars
start: "1680-04"
end: "1707-03-03"
tier: A
summary: "The twenty-seven years’ war in the Deccan between the Mughal emperor Aurangzeb and the Maratha kingdom founded by Shivaji. Aurangzeb came south in 1681 with the court and an army of several hundred thousand, sheltered by no city, and stayed for the rest of his life. After conquering Bijapur and Golconda he captured Shivaji’s son and successor Sambhaji in 1689 and had him executed, and took the Maratha capital Raigad. Sambhaji’s brother Rajaram escaped to Gingee in the far south, which held out until 1698, while Maratha cavalry under Santaji Ghorpade and Dhanaji Jadhav raided across the Deccan and beat Mughal armies in the field. From 1699 the aged emperor besieged the Maratha hill forts one by one; under Rajaram’s widow Tarabai the Marathas retook them as soon as he left and carried their raids north of the Narmada. Aurangzeb died at Ahmednagar in 1707 with the war unwon, his treasury drained and the Deccan devastated."
countries: [in]
