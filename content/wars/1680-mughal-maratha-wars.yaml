steps:
  - title: The emperor comes south
    date: 1680–1684
    when: "1681-09-08"
    borders: "1682-03"
    countries: [in]
    body:
      - Shivaji’s death in April 1680 left a disputed succession. His eldest son, Sambhaji, seized Raigad, imprisoned his half-brother Rajaram and had his father’s ministers who opposed him executed. In 1681 Aurangzeb’s son Prince Akbar, who had rebelled against his father in Rajasthan, fled with the Rathor leader Durgadas to Sambhaji’s court, hoping for Maratha help to take the throne. To deal with both threats at once, Aurangzeb left Ajmer on 8 September 1681 and marched south. He made Aurangabad his headquarters in March 1682, with the court, the treasury and an army of perhaps 500,000 soldiers and followers.
      - The first Mughal offensives went badly. The small hill fort of Ramsej near Nashik held out for years, and armies sent into the wet, roadless Konkan under Prince Muazzam (Shah Alam) lost thousands of men and animals to disease and raids. Sambhaji, for his part, fought on several fronts at once. He attacked the island fortress of Janjira, held by the Siddis, African-descended admirals in Mughal service, without success, and late in 1683 invaded Portuguese Goa, until a Mughal army coming down the Ghats forced him to withdraw in January 1684.
    facts:
      - [Aurangzeb leaves Ajmer for the Deccan, "8 September 1681"]
      - [Mughal headquarters, "Aurangabad, from March 1682; later Ahmednagar and moving camps"]
