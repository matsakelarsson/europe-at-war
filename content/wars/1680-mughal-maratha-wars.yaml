  - title: Beyond the Narmada
    date: 1705 – March 1707
    when: "1707-03-03"
    borders: "1707-03-03"
    countries: [in]
    body:
      - With the emperor tied down in the south, Maratha armies carried the war north. In 1705 they crossed the Narmada into Malwa, reaching as far as Bhopal, and in 1706 Dhanaji Jadhav raided Gujarat, defeated a Mughal force near Baroda and plundered the province. Aurangzeb fell gravely ill in 1705 and was carried back to Ahmednagar early in 1706, harassed by Maratha horsemen on the way. He died there on 3 March 1707, aged 88. He left letters to his sons lamenting that his life had been spent in vain.
      - His sons fought over the throne, and Muazzam won it as Bahadur Shah I after the battle of Jajau in June 1707. To divide the Marathas, Prince Azam released Shahu, now 25, in May 1707. Shahu claimed the throne against his aunt Tarabai, and with the help of the Brahmin official Balaji Vishwanath, whom he made Peshwa, he defeated her at Khed in October and took Satara in 1708. The Maratha civil war that followed and the weakness of the Mughal empire after Aurangzeb opened the way to the Maratha expansion of the next decades.
    facts:
      - [Death of Aurangzeb at Ahmednagar, "3 March 1707"]
      - [Shahu released, "May 1707"]
      - [Battle of Khed, "12 October 1707, victory for Shahu over Tarabai’s army"]
    markers:
