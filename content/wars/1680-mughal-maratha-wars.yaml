notes:
  - The war is sometimes called the Deccan wars of Aurangzeb, or by Marathi historians the War of Maratha Independence. Numbers of soldiers are rough; the Mughal camp, with traders, servants and families, may have held half a million people.
  - Dates follow the usual English-language accounts, many of which go back to Jadunath Sarkar and are partly in the Julian calendar, ten days behind the Gregorian.
  - The conquest of Bijapur and Golconda (1685–1687) is told in its own story.
