  - title: Sambhaji’s capture
    date: 1685–1689
    when: "1689-02-01"
    borders: "1689-03-11"
    countries: [in]
    body:
      - From 1685 Aurangzeb turned on the two remaining Deccan sultanates, taking Bijapur in 1686 and Golconda in 1687 and so cutting the Marathas off from their old allies. The Maratha commander-in-chief, Hambirrao Mohite, was killed in a battle near Wai in 1687. Early in 1689 Sambhaji held a council at Sangameshwar in the Konkan with only a small escort. A Mughal officer, Muqarrab Khan, guided by local informants, made a forced march through the hills and on 1 February captured him and his minister Kavi Kalash.
      - Sambhaji was brought to Aurangzeb’s camp at Tulapur near Pune. Made to wear a fool’s cap and paraded on a camel, he refused, according to the chroniclers, to give up his forts or convert to Islam. After weeks of torture he was put to death on 11 March 1689. His death, meant to end Maratha resistance, hardened it instead; Marathas remember him as a martyr. Mughal troops under Zulfiqar Khan besieged Raigad, and in the autumn of 1689 it surrendered; Sambhaji’s widow Yesubai and his seven-year-old son Shahu were taken prisoner and brought up at the Mughal court.
    facts:
      - [Sambhaji captured at Sangameshwar, "1 February 1689"]
      - [Sambhaji executed at Tulapur, "11 March 1689"]
      - [Raigad surrenders, "autumn 1689"]
