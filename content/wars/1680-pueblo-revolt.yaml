  - title: Vargas returns, 1692
    date: August – December 1692
    when: "1692-08"
    borders: "1692-09-14"
    countries: [us, mx]
    body:
      - Spain wanted New Mexico back as a buffer against the French, who had reached the Mississippi, and against the Apache. The new governor, Diego de Vargas, left El Paso in August 1692 with about sixty soldiers, a hundred Native auxiliaries and a few cannon, guided by Bartolomé de Ojeda, a war captain of Zia. On 13 September he surrounded Santa Fe, where about a thousand Tano and Tewa people lived in the old palace, and promised pardon to all who would swear allegiance to the king and return to the church. After a day of tense talks they agreed, and on 14 September Vargas proclaimed the province repossessed; the Fiestas de Santa Fe still celebrate it.
      - Over the next three months Vargas rode from pueblo to pueblo, to Taos, Pecos, the Keres and Jemez towns, Acoma, Zuni and the Hopi, and accepted their submission, and the friars baptised more than two thousand children born since 1680. He wrote that he had won back the province without bloodshed. But many pueblos had only bowed to him for the moment, and he went back to El Paso to gather colonists.
    facts:
      - [Vargas’s force, "about 60 soldiers and 100 Native auxiliaries"]
      - [Santa Fe repossessed, "14 September 1692"]
