id: pueblo-revolt
name: Pueblo Revolt
start: "1680-08-10"
end: "1696-12"
tier: A
summary: "The rising of the Pueblo peoples of the upper Rio Grande against Spanish rule in the province of Santa Fe de Nuevo México, and the Spanish reconquest that followed. After eighty years of forced labour and tribute under the encomienda, the suppression of Pueblo religion by Franciscan missionaries, drought, famine and Apache raids, leaders of some two dozen pueblos speaking six languages, among them Popé (Po’pay) of Ohkay Owingeh, coordinated a revolt with runners carrying knotted cords. On 10 August 1680 they rose together and killed about 400 colonists, among them 21 of the province’s 33 Franciscans, besieged Governor Antonio de Otermín in Santa Fe and forced some 2,000 survivors to retreat to El Paso del Norte. For twelve years the Pueblos governed themselves, though drought, raids and quarrels divided them. Diego de Vargas returned in 1692 and won the submission of most pueblos without a battle; when he brought colonists back in 1693 he retook Santa Fe by force, executed seventy defenders and gave their families to colonists as servants. A second revolt in 1696 was put down by the end of the year, but the Spanish did not restore the encomienda, granted land to each pueblo and largely left Pueblo religion alone. The Hopi stayed independent."
countries: [us, mx]
sides:
  - id: pb
    name: Pueblo peoples (Popé, Luis Tupatú, Alonso Catiti and others)
    polities: [pueblo-peoples]
    ink: brown
    moves: Pueblo moves
    success: Pueblo success
  - id: sp
    name: Spanish New Mexico
    polities: [new-spain, spain]
    ink: gold
    moves: Spanish moves
    success: Spanish success
  - id: pa
    name: Pueblo allies of the Spanish
    polities: [pueblo-peoples]
    ink: olive
    moves: Allied Pueblo moves
    success: Allied Pueblo success
notes:
  - Spain used the Gregorian calendar; the dates are those of the Spanish records.
  - The revolt is known mainly from Spanish sources, above all the testimonies Otermín took from Pueblo prisoners in 1680–1681 and Vargas’s journals; Pueblo memory of it is kept in oral tradition, which the pueblos share only in part. The number of Pueblo dead is not known; Spanish figures for battles, such as those of Zia in 1689 and the Jemez mesa in 1694, are those of the Spanish reports.
  - The pueblos were self-governing towns of different languages (Tiwa, Tewa, Towa, Keres, Zuni, Hopi, Piro and Tano). Most joined the revolt; the southern Tiwa of Isleta and the Piro did not, and from 1692 Zia, Santa Ana, San Felipe and Pecos fought beside the Spanish. Some Apache and Navajo may have joined in 1680. Popé’s exact role, and how far he led rather than shared leadership, is debated.
  - Native nations north of Mexico are not drawn on the base map; the lands the Pueblos held after 1680 are shown as areas.
