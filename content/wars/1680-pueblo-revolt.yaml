  - title: The battle for Santa Fe and the campaigns of 1694
    date: December 1693 – September 1694
    when: "1693-12"
    borders: "1694-07-24"
    countries: [us]
    body:
      - Vargas came back in late 1693 with about 800 people, among them some seventy families of colonists, a hundred soldiers and Franciscan friars. The Tano and Tewa people in Santa Fe would not leave the town, and colonists camped outside in the snow died of cold. On 29 December Vargas, with Pecos warriors as allies, stormed the walls; on 30 December the town surrendered. Seventy defenders were executed, and about four hundred women and children were handed to the colonists as servants for ten years.
      - In 1694 Vargas and his Pueblo allies, from Pecos and the Keres towns of Zia, Santa Ana and San Felipe, fought the pueblos that held out. Tewa people from many towns took refuge on Black Mesa (Tunyo) near San Ildefonso; they held out against a siege in March and came to terms during a second in September. On 24 July Vargas and his Keres allies stormed Astialakwa, the Jemez refuge on a mesa above the Jemez River; 84 Jemez were killed, some leaping from the cliffs rather than be taken, and over 360 women and children were captured. Many Jemez fled to the Navajo.
    facts:
      - [Santa Fe stormed, "29–30 December 1693"]
      - [Defenders executed, "70; about 400 women and children given as servants"]
      - [Astialakwa (Jemez) stormed, "24 July 1694"]
