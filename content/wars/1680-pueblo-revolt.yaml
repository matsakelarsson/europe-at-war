  - title: Twelve years of Pueblo independence
    date: 1680–1692
    when: "1681"
    borders: "1689-09-01"
    countries: [us, mx]
    body:
      - Popé, Tupatú and Catiti went from pueblo to pueblo calling for a return to the ways of their ancestors. Churches were burned and Christian images destroyed; people washed off their baptism in the rivers, took back their own names and set aside Christian marriages, and the kivas and dances returned. Spanish sources say Popé also ordered the destruction of Spanish crops and livestock; Pueblo tradition remembers his rule as harsh. The pueblos remained self-governing, and their unity did not last. Drought continued, and Apache, Navajo and Ute raids grew worse. Popé lost his authority within a few years, Tupatú led for a time, and Popé probably died about 1688.
      - In November 1681 Otermín marched north again with 146 Spaniards and about as many Native allies. Isleta surrendered after a short fight, but the northern pueblos only pretended to negotiate while gathering warriors, and in early 1682 Otermín turned back, burning several Tiwa pueblos and taking 385 people from Isleta south with him, who founded Ysleta del Sur. In August 1689 Governor Domingo Jironza Petriz de Cruzate attacked Zia, which resisted fiercely; Spanish reports claimed some 600 dead and 70 captives.
      - Some Pueblo leaders began to seek terms. About 1683 Tupatú sent Juan Punsilli of Picurís to El Paso to offer peace if the Spanish came back without killing or burning, and Pueblo historians hold that several pueblos later invited the Spanish to return.
    facts:
      - [Otermín’s return, "November 1681 – February 1682, failed"]
      - [People of Isleta taken south, "385"]
      - [Zia attacked, "August 1689"]
    markers:
