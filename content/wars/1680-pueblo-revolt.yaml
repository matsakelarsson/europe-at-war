  - title: The siege of Santa Fe and the retreat to El Paso
    date: 13 August – October 1680
    when: "1680-08-13"
    borders: "1680-08-21"
    countries: [us, mx]
    body:
      - About a thousand colonists and their servants crowded into the governor’s palace and its walled compound in Santa Fe. From 13 August Tano, Tewa, Taos, Picurís and Keres warriors, some 2,500 by Spanish estimate, gathered around the town, burned the outlying houses and the church and cut the water channel. Otermín’s men fought sorties, and on 20 August a desperate charge drove the besiegers off with heavy losses; the Spanish claimed some 300 Pueblo dead and took 47 prisoners, whom they questioned and executed.
      - On 21 August Otermín led the survivors out of Santa Fe and south down the Rio Grande. Pueblo warriors watched the column from the hills but let it go. At Isleta they found García’s people gone; the two groups met in early September near Socorro, 1,946 people in all, about 500 of them Native servants and slaves, and with them the Piro and many southern Tiwa. By October they had reached El Paso del Norte, the mission of Guadalupe on the Rio Grande, where the Spanish governed New Mexico in exile for twelve years. The Piro and Tiwa settled nearby at Senecú, Socorro and Ysleta del Sur.
    facts:
      - [Siege of Santa Fe, "13–21 August 1680"]
      - [Pueblo prisoners executed, "47"]
      - [Survivors who reached El Paso, "about 1,946, about 500 of them Native servants and slaves"]
