  - title: The revolt of 1696 and its aftermath
    date: June 1696 – 1700
    when: "1696-06"
    borders: "1696-12-01"
    countries: [us]
    body:
      - On 4 June 1696 people of fourteen pueblos, among them Taos, Picurís, the Tewa towns, Jemez, Cochití and Santo Domingo, rose again and killed five friars and thirty-four colonists. They were short of food and divided, and Pecos and the Keres towns of Zia, Santa Ana and San Felipe stayed with the Spanish. Vargas campaigned through the summer and autumn, destroying fields and stores and receiving the surrender of one pueblo after another; by the end of 1696 the revolt was over.
      - Many Pueblo people left the Rio Grande rather than submit. Tewa families went to the Hopi, where their descendants still live at Hano; Jemez and others joined the Navajo; and the people of Picurís went to the Plains with Jicarilla Apache allies at El Cuartelejo in what is now Kansas, returning only in 1706. In 1700 other Hopi destroyed Awatovi, the one Hopi town that had taken back the friars, and the Hopi remained independent.
      - The reconquest did not bring back the old order. The encomienda was not restored, each pueblo received a land grant, a protector of the Indians represented them in Spanish courts, and the friars no longer tried to stamp out kachina ceremonies. In the 1700s Pueblo and Spanish militias fought side by side against Comanche, Apache and Navajo raiders. The revolt is remembered as one of the most successful Native risings against colonial rule in North America; in 2005 a statue of Po’pay was placed in the United States Capitol.
    facts:
      - [Second revolt, "4 June 1696, fourteen pueblos"]
      - [Killed, "5 friars and 34 colonists"]
      - [Awatovi destroyed, "1700"]
