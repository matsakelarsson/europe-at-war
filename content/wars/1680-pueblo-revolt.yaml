steps:
  - title: Nuevo México under Spanish rule
    date: 1598–1675
    when: "1598"
    borders: "1675-06-01"
    countries: [us]
    body:
      - In 1598 Juan de Oñate led some 130 soldiers, ten Franciscans and several hundred colonists, servants and slaves up the Rio Grande and claimed the land of the Pueblos for Spain; there were then perhaps 40,000 Pueblo people. When Acoma warriors killed Juan de Zaldívar and about a dozen of his men in their mesa-top town in December 1598, Oñate’s soldiers stormed the mesa in January 1599 and killed some 500 men and 300 women and children; survivors were sentenced to twenty years of servitude, and 24 men were sentenced to have a foot cut off. Santa Fe became the capital about 1610.
      - The colonists, never more than a few thousand, lived on Pueblo labour and tribute in corn, cloth and hides under the encomienda and on forced labour (repartimiento). Franciscan missionaries built churches in the pueblos and fought the kachina ceremonies and the kivas where Pueblo religion was practised; in the 1660s the friars had masks and prayer sticks seized and burned. Governors and friars quarrelled bitterly over who should profit from the Pueblos. Epidemics, drought and famine in the 1660s and 1670s, and raids by Apache and Navajo who were themselves hungry, cut the Pueblo population to about 17,000.
      - In 1675 Governor Juan Francisco Treviño arrested 47 Pueblo religious leaders for sorcery. Three were hanged and one hanged himself, and the rest were whipped and jailed in Santa Fe until armed Tewa men came to the governor’s palace and forced their release. Among them was Popé (Po’pay), a religious leader from Ohkay Owingeh (San Juan).
    facts:
      - [Oñate’s colony, "1598"]
      - [Acoma, "January 1599, some 800 Acoma killed"]
      - [Pueblo population, "about 40,000 in 1598, about 17,000 in 1680 (estimates)"]
      - [Arrest of 47 religious leaders, "1675"]
