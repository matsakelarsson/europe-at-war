  - title: Knotted cords and the rising of 10 August 1680
    date: August 1680
    when: "1680-08"
    borders: "1680-08-10"
    countries: [us]
    body:
      - After his release Popé went to Taos and spent five years, with leaders such as Luis Tupatú of Picurís, Alonso Catiti of Santo Domingo and Domingo Naranjo of Santa Clara, preparing a rising of the pueblos of the Rio Grande, Pecos, the Jemez, Acoma, Zuni and the Hopi mesas, some two dozen towns speaking six languages and spread over some 600 km. Popé promised that when the Spanish were gone the old gods would bring health and rain. Runners carried knotted cords to each pueblo; one knot was to be untied each day, and on the day the last was untied all were to rise.
      - The southern Tiwa and the Piro, who were closer to the Spanish, did not join, and on 9 August the governor, Antonio de Otermín, learned of the plan and seized two runners from Tesuque, Nicolás Catua and Pedro Omtua. The leaders moved the rising forward. On 10 August the Pueblos rose across the province, killed colonists on their farms and the friars in the missions, took the colonists’ horses and cut the roads. About 400 colonists were killed, men, women and children, among them 21 of the 33 Franciscans; the Hopi killed the friars in their towns on the day first planned. In the south the lieutenant governor, Alonso García, gathered the colonists of the Rio Abajo at Isleta and, believing everyone in the north dead, led them south on 14–15 August.
    facts:
      - [Rising, "10 August 1680"]
      - [Colonists killed, "about 400, with 21 of 33 Franciscans"]
      - [Pueblo fighters, "2,000 or more; the Spanish could arm about 170 men"]
