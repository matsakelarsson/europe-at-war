steps:
  - title: The relief of Vienna
    date: 1683
    when: "1683-07"
    borders: "1683-09-12"
    countries: [at, pl, tr, de, sk]
    body:
      - In 1683 the grand vizier Kara Mustafa Pasha marched up the Danube with the main Ottoman army and on 14 July laid siege to Vienna, the Habsburg capital. Count Ernst Rüdiger von Starhemberg held the city with soldiers and armed citizens through two months of mining and assaults, while disease and hunger spread inside the walls. Emperor Leopold I had signed an alliance with Poland–Lithuania in March, and John III Sobieski came south with his army to join Imperial, Bavarian, Saxon and other German troops at Tulln.
      - The relief army, some 70,000–80,000 men under Sobieski’s overall command, came down from the Kahlenberg on 12 September. Late in the afternoon a huge cavalry charge, led by the Polish hussars, broke the Ottoman army, which fled leaving its camp behind. Sobieski followed up with a victory at Párkány on the Danube in October, after a defeat there two days before. Kara Mustafa was executed at Belgrade on the sultan’s orders that December, and in 1684 the Emperor, Poland, Venice and the Pope formed the Holy League.
    facts:
      - [Battle of Vienna, "12 September 1683, allied victory"]
      - [Relief army, "About 70,000–80,000, roughly a quarter to a third of them Polish"]
