  - title: Belgrade, Kosovo and the Great Migration
    date: 1688–1690
    when: "1688-07"
    borders: "1690-10-08"
    countries: [rs, xk, mk, bg, hu, hr, de, tr]
    body:
      - In 1688 the Elector of Bavaria crossed the Sava and took Belgrade by storm on 6 September. Weeks later Louis XIV invaded the Rhineland, and many imperial troops were sent west. Even so, in 1689 Louis William of Baden beat the Ottomans at Batočina and at Niš on 24 September and took Vidin. General Enea Silvio Piccolomini pushed on into Kosovo and Macedonia with a small force, joined by Serbian and Albanian volunteers and by the rising of the outlaw Karposh around Kumanovo. In late October Piccolomini burned Skopje, reportedly for fear of plague, and in November he died of plague at Prizren.
      - The new grand vizier, Fazıl Mustafa Pasha, struck back. On 2 January 1690 an Ottoman and Tatar army destroyed the imperial and Serbian force at Kačanik, and Christian villages suffered harsh reprisals. In 1690 the Ottomans retook Niš and, on 8 October, Belgrade, after its powder magazine exploded. Thousands of Serbs, with some Albanians, fled north with Patriarch Arsenije III of Peć and settled in Habsburg Hungary, where Leopold I granted them church autonomy. Arsenije wrote of more than 30,000 people; Serbian tradition speaks of 37,000 families. How far this Great Migration changed the population of Kosovo is still debated by Serbian and Albanian historians.
    facts:
      - [Belgrade taken, 6 September 1688]
      - [Battle of Kačanik, "2 January 1690, Ottoman victory"]
      - [Belgrade retaken by the Ottomans, 8 October 1690]
    markers:
      - kind: siege
        name: Belgrade
        date: 1688 and 1690
        text: Stormed by the Elector of Bavaria on 6 September 1688 after a month’s siege, and retaken by the Ottomans on 8 October 1690 after a shell blew up its main powder magazine.
        lonlat: [20.45, 44.82]
      - kind: battle
        side: hb
        name: Battle of Niš
        date: 24 September 1689
        text: Louis William of Baden defeated the Ottoman army and took the city, a month after his victory at Batočina.
        lonlat: [21.9, 43.32]
      - kind: event
        side: hb
        name: Skopje
        date: October 1689
        text: Piccolomini’s troops set fire to the city, reportedly to stop the plague that had broken out there.
        lonlat: [21.43, 42.0]
      - kind: event
