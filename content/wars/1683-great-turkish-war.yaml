  - title: Zenta
    date: 1697
    when: "1697-09-11"
    borders: "1697-10-23"
    countries: [rs, hu, ba, at, tr]
    body:
      - In 1697 Mustafa II marched again from Belgrade, crossed the Danube, took Titel and turned up the Tisza towards Transylvania. Prince Eugene of Savoy, newly given command in Hungary at the age of 34, followed from Petrovaradin with about 50,000 men. On the afternoon of 11 September his cavalry found the Ottoman army crossing the Tisza at Zenta on a bridge of boats, with the sultan and part of the army already on the eastern bank and the rest behind earthworks on the western one.
      - With only a few hours of daylight left, Eugene attacked at once. His wings worked round the earthworks to the river and cut the defenders off from the bridge, which broke under the fleeing crowd. Estimates of the Ottoman dead run from about 20,000 to 30,000, many of them drowned, among them the grand vizier Elmas Mehmed Pasha; the imperial army reported fewer than 500 casualties. Eugene took the army’s treasury and the sultan’s seal. In October he raided Bosnia with 6,000 horsemen, and after his envoys were killed he let his troops plunder and burn Sarajevo.
    facts:
      - [Battle of Zenta, "11 September 1697, imperial victory"]
      - [Ottoman dead, "about 20,000–30,000, many drowned"]
      - [Sarajevo burned, 22–23 October 1697]
    markers:
      - kind: event
        side: hb
        name: Petrovaradin
        date: August 1697
        text: Eugene gathered his army at this Danube fortress before following the sultan up the Tisza.
        lonlat: [19.86, 45.25]
        lp: l
