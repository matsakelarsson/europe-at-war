  - title: Podolia regained
    date: 1684–1699
    when: "1684"
    borders: "1699-01-26"
    countries: [pl, ua, tr, md, ro]
    body:
      - Poland–Lithuania gained much less than its allies from the long war that followed. Its armies blockaded Ottoman-held Kamianets but could not take it, and Sobieski’s campaigns into Moldavia in 1686 and 1691 achieved little. To bring Russia into the League, the Commonwealth signed the Eternal Peace of 1686, giving up its claim to Kyiv. Sobieski died in 1696, and in 1698 Feliks Potocki beat a large Tatar army at Podhajce in one of the last battles of the war.
      - The great victories were Habsburg ones, in Hungary and the Balkans, and the war ended with the Treaty of Karlowitz on 26 January 1699. The Ottomans returned Podolia and Kamianets to Poland–Lithuania and gave up their claims to Ukraine west of the Dnieper. The Habsburgs gained almost all of Hungary and Transylvania, and Venice the Morea. It was the first time the Ottoman Empire had given up so much territory by treaty.
    facts:
      - [Treaty of Karlowitz, "26 January 1699"]
      - [Regained by Poland–Lithuania, "Podolia, with Kamianets"]
