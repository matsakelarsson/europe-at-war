        text: The sultan’s army took this small fortress where the Tisza meets the Danube.
        lonlat: [20.29, 45.21]
      - kind: battle
        side: hb
        name: Battle of Zenta
        date: 11 September 1697
        text: Caught astride the Tisza, the Ottoman army was destroyed in a few hours while the sultan watched from the far bank.
        lonlat: [20.09, 45.93]
      - kind: event
        side: hb
        name: Sarajevo
        date: 22–23 October 1697
        text: Eugene’s raiders sacked and burned the city, then withdrew north with their booty.
        lonlat: [18.41, 43.86]
