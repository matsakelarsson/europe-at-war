        text: A Venetian shell set off the gunpowder stored in the temple, blowing out its roof and most of its walls.
        lonlat: [23.73, 37.97]
      - kind: held
        side: ot
        name: Negroponte
        date: July–October 1688
        text: Supplied across the Euripus strait, the Ottoman garrison of about 6,000 beat off the Venetian siege.
        lonlat: [23.6, 38.46]
        lp: t
    arrows:
