  - title: The Treaty of Karlowitz
    date: 1698–1699
    when: "1698-11"
    borders: "1699-01-26"
    countries: [rs, hu, hr, ro, sk, ba, me, gr, it, pl, at, tr]
    body:
      - After Zenta the Ottomans accepted the mediation of England and the Dutch Republic, whose ambassadors, Lord Paget and Jacob Colyer, wanted the emperor free to face France. In November 1698 envoys of all the warring powers met at Karlowitz, on the Danube below Petrovaradin; the Ottoman side was led by Rami Mehmed Efendi and the dragoman Alexander Mavrocordatos. The talks took more than two months. They were based on uti possidetis, the principle that each side kept what it held, and the treaties were signed on 26 January 1699, for twenty-five years.
      - The emperor kept all of Hungary except the Banat of Temesvár, together with Transylvania, Slavonia and most of Croatia; the Ottomans kept Belgrade and the Banat. Venice kept the Morea and its new conquests in Dalmatia, and Poland–Lithuania regained Podolia. Ragusa had the Ottoman border brought down to the sea at Neum and Sutorina, so that Venetian land would not surround it. It was the first time the Ottoman Empire gave up so much by treaty, and the border was marked on the ground in the following years. Thököly and his followers went into exile in the Ottoman Empire.
    facts:
      - [Treaty of Karlowitz, "26 January 1699, for 25 years"]
      - [Principle, "uti possidetis: each side keeps what it holds"]
      - [Mediators, England and the Dutch Republic]
    markers:
      - kind: treaty
