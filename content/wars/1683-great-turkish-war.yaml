        lonlat: [20.45, 44.82]
      - kind: held
        side: ot
        name: Temesvár
        date: 1699
        text: The Banat of Temesvár was the only part of the Hungarian kingdom left in Ottoman hands.
        lonlat: [21.23, 45.76]
      - kind: event
        name: Neum
        date: 1699
        text: Ragusa had this strip of coast given to the Ottomans, so that it bordered the empire and not only Venice. It still divides Croatia’s coast.
        lonlat: [17.61, 42.92]
