  - title: Slankamen and the stalemate
    date: 1690–1696
    when: "1690-08-21"
    borders: "1695-09-21"
    countries: [rs, ro, hu, tr]
    body:
      - The Ottoman recovery went on. On 21 August 1690 Thököly, with Ottoman and Tatar troops, defeated an imperial force at Zărnești and was proclaimed prince of Transylvania, though Louis William of Baden drove him out within weeks. In 1691 Fazıl Mustafa Pasha led about 50,000 men up the Danube to win back Hungary. On 19 August Louis of Baden, with about 33,000, attacked him at Slankamen, where the Tisza joins the Danube. It was one of the bloodiest battles of the century; late in the day the grand vizier was killed by a bullet, and his army broke, leaving its guns and treasury behind.
      - Leopold I’s Diploma Leopoldinum, published in December 1691, made Transylvania a Habsburg land with its own estates and laws. Nagyvárad fell after a long blockade in 1692 and Gyula in 1695. But the main imperial armies were fighting France in the Nine Years’ War, and the war in the south stalled. From 1695 Sultan Mustafa II led his army in person, and on 21 September 1695 he defeated an imperial corps near Lugos in the Banat, where its general, Federico Veterani, was mortally wounded.
    facts:
      - [Battle of Slankamen, "19 August 1691, imperial victory"]
      - [Armies at Slankamen, "about 33,000 imperial troops, about 50,000 Ottomans"]
      - [Battle of Lugos, "21 September 1695, Ottoman victory"]
    markers:
      - kind: battle
        side: ot
        name: Battle of Zărnești
        date: 21 August 1690
        text: Thököly and his Ottoman and Tatar allies broke into Transylvania through the mountains and beat its imperial defenders.
        lonlat: [25.33, 45.57]
      - kind: battle
        side: hb
        name: Battle of Slankamen
        date: 19 August 1691
        text: The death of the grand vizier, Fazıl Mustafa Pasha, turned a hard-fought battle into an Ottoman rout.
        lonlat: [20.25, 45.14]
      - kind: taken
        side: hb
        name: Nagyvárad
        date: June 1692
        text: The fortress, Ottoman since 1660, surrendered after a long blockade.
        lonlat: [21.92, 47.07]
      - kind: taken
        side: hb
        name: Gyula
        date: 1695
        text: One of the last Ottoman strongholds north of the Maros, starved into surrender.
        lonlat: [21.28, 46.65]
      - kind: battle
        side: ot
        name: Battle of Lugos
        date: 21 September 1695
        text: Mustafa II’s army overwhelmed Veterani’s outnumbered corps, which was trying to join the main imperial army.
        lonlat: [21.93, 45.71]
    arrows:
