        label: Taken by Venice, 1685–1687
        atoms: [GR-J, GR-G~achaea]
  - title: Buda
    date: 1684–1686
    when: "1684-07"
    borders: "1686-10-23"
    countries: [hu, sk, at, de, tr]
    body:
      - After Vienna, the imperial army under Charles of Lorraine moved down the Danube. Esztergom was taken in October 1683, and in 1684 Lorraine besieged Buda for more than three months, but disease and the autumn rains forced him to give up. In August 1685 he beat an Ottoman army near Esztergom and stormed Érsekújvár, the great fortress north of the Danube, killing most of its garrison. That autumn the Ottomans, blaming him for their defeats, arrested Imre Thököly, and many of his Hungarian kuruc rebels made terms with the emperor.
      - On 18 June 1686 the siege of Buda began again, with an army of perhaps 65,000–75,000 under Lorraine and Maximilian II Emanuel of Bavaria, joined by volunteers from across Europe. The garrison under the veteran governor Abdurrahman Abdi Pasha held out for eleven weeks, and a relief army under the grand vizier could not break through. The city was stormed on 2 September; Abdurrahman died fighting. The soldiers sacked it for days, killing over 3,000 Muslims and about half of its Jewish community. Szeged, Pécs and other towns fell that autumn.
    facts:
      - [Érsekújvár stormed, 19 August 1685]
      - [Buda stormed, "2 September 1686, after 145 years of Ottoman rule"]
      - [Besiegers, "perhaps 65,000–75,000"]
    markers:
      - kind: battle
        side: hb
        name: Esztergom
        date: 16 August 1685
        text: Lorraine’s army defeated an Ottoman army that had come to retake the town.
        lonlat: [18.74, 47.79]
        lp: b
      - kind: taken
        side: hb
        name: Érsekújvár
        date: 19 August 1685
        text: The fortress the Ottomans had taken in 1663 was stormed, and most of its garrison killed.
        lonlat: [18.16, 47.99]
      - kind: taken
        side: hb
        name: Buda
        date: 2 September 1686
        text: Stormed after an eleven-week siege. The Ottoman capital of Hungary was plundered and much of it burned.
        lonlat: [19.04, 47.5]
      - kind: taken
        side: hb
        name: Szeged
        date: October 1686
        text: The fortress on the Tisza surrendered to the imperial army in the weeks after Buda.
        lonlat: [20.15, 46.25]
      - kind: taken
        side: hb
        name: Pécs
        date: October 1686
        text: Taken by imperial troops in a push into southern Transdanubia.
        lonlat: [18.23, 46.07]
