summary: After the failed Ottoman siege of Vienna in 1683, the Habsburg Monarchy, Poland–Lithuania, Venice and later Russia formed the Holy League against the Ottoman Empire. Sixteen years of war ended at Karlowitz in 1699 with the Ottomans giving up Hungary and Transylvania to the Habsburgs and Podolia to Poland–Lithuania.
