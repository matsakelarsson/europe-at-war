steps:
  - title: The relief of Vienna
    date: 1683
    when: "1683-07"
    borders: "1683-09-12"
    countries: [at, pl, tr, de, sk]
    body:
      - In 1683 the grand vizier Kara Mustafa Pasha marched up the Danube with the main Ottoman army and on 14 July laid siege to Vienna, the Habsburg capital. Count Ernst Rüdiger von Starhemberg held the city with soldiers and armed citizens through two months of mining and assaults, while disease and hunger spread inside the walls. Emperor Leopold I had signed an alliance with Poland–Lithuania in March, and John III Sobieski came south with his army to join Imperial, Bavarian, Saxon and other German troops at Tulln.
      - The relief army, some 70,000–80,000 men under Sobieski’s overall command, came down from the Kahlenberg on 12 September. Late in the afternoon a huge cavalry charge, led by the Polish hussars, broke the Ottoman army, which fled leaving its camp behind. Sobieski followed up with a victory at Párkány on the Danube in October, after a defeat there two days before. Kara Mustafa was executed at Belgrade on the sultan’s orders that December, and in 1684 the Emperor, Poland, Venice and the Pope formed the Holy League.
    facts:
      - [Battle of Vienna, "12 September 1683, allied victory"]
      - [Relief army, "About 70,000–80,000, roughly a quarter to a third of them Polish"]
    markers:
      - kind: held
        side: hb
        name: Siege of Vienna
        date: 14 July – 12 September 1683
        text: The garrison and citizens held out for two months against Ottoman mines and assaults.
        lonlat: [16.37, 48.21]
        lp: b
      - kind: event
        name: Allies meet at Tulln
        date: Early September 1683
        text: Polish and German armies joined Charles of Lorraine’s Imperial army on the Danube west of Vienna.
        lonlat: [16.05, 48.33]
        lp: l
      - kind: battle
        side: pl
        name: Battle of Vienna
        date: 12 September 1683
        text: The relief army attacked down the wooded slopes of the Kahlenberg. By evening the Ottoman army was in flight.
        lonlat: [16.33, 48.27]
        lp: t
      - kind: battle
        side: pl
        name: Battle of Párkány
        date: 7 and 9 October 1683
        text: Beaten in a first clash, Sobieski and Charles of Lorraine destroyed the Ottoman force two days later, opening the way to Esztergom.
        lonlat: [18.72, 47.80]
    arrows:
      - side: pl
        label: Sobieski
        via: [[19.94, 50.06], [18.0, 49.9], [16.6, 49.2], [16.1, 48.4]]
      - side: ot
        label: Kara Mustafa
        via: [[19.04, 47.5], [17.9, 47.75], [16.5, 48.15]]
  - title: Podolia regained
    date: 1684–1699
    when: "1684"
    borders: "1699-01-26"
    countries: [pl, ua, tr, md, ro]
    body:
      - Poland–Lithuania gained much less than its allies from the long war that followed. Its armies blockaded Ottoman-held Kamianets but could not take it, and Sobieski’s campaigns into Moldavia in 1686 and 1691 achieved little. To bring Russia into the League, the Commonwealth signed the Eternal Peace of 1686, giving up its claim to Kyiv. Sobieski died in 1696, and in 1698 Feliks Potocki beat a large Tatar army at Podhajce in one of the last battles of the war.
      - The great victories were Habsburg ones, in Hungary and the Balkans, and the war ended with the Treaty of Karlowitz on 26 January 1699. The Ottomans returned Podolia and Kamianets to Poland–Lithuania and gave up their claims to Ukraine west of the Dnieper. The Habsburgs gained almost all of Hungary and Transylvania, and Venice the Morea. It was the first time the Ottoman Empire had given up so much territory by treaty.
    facts:
      - [Treaty of Karlowitz, "26 January 1699"]
      - [Regained by Poland–Lithuania, "Podolia, with Kamianets"]
    markers:
      - kind: event
        side: pl
        name: Iași
        date: 1686
        text: Sobieski’s army reached the Moldavian capital but had to retreat, harried by Tatars and short of supplies.
        lonlat: [27.59, 47.16]
      - kind: held
        side: ot
        name: Kamianets
        date: 1684–1699
        text: The Ottoman garrison held out against a long Polish blockade. The fortress was handed back only after the peace.
        lonlat: [26.56, 48.67]
      - kind: battle
        side: pl
        name: Battle of Podhajce
        date: 9 September 1698
        text: Feliks Kazimierz Potocki’s army beat a large Tatar raiding force.
        lonlat: [25.14, 49.27]
      - kind: treaty
        name: Treaty of Karlowitz
        date: 26 January 1699
        text: Signed at Karlowitz (Sremski Karlovci) on the Danube after English and Dutch mediation.
        lonlat: [19.93, 45.20]
    areas:
      - style: gained
        side: pl
        label: Regained by Poland–Lithuania
        atoms: [UA-68]
  - title: Venice in the Morea and Athens
    date: 1684–1688
    when: "1684-04-25"
    borders: "1688-10-22"
    countries: [gr, it, de, mt, tr]
    body:
      - For once Venice declared war on the Ottomans rather than the other way round, joining the Holy League in 1684 to win back what it had lost in Greece. Francesco Morosini, the defender of Candia in the Cretan War, sailed with papal, Tuscan and Maltese galleys and took Lefkada in August 1684. In 1685 his army, strengthened with Hanoverian and Saxon mercenaries, landed at Koroni; the fortress surrendered on 11 August, but its garrison was massacred during the talks. The Maniots rose again, and in 1686 the Swedish marshal Otto Wilhelm Königsmarck took Navarino, Modon and, on 29 August, Nauplia, the capital of the Morea.
      - In July 1687 the Venetians routed the Ottoman army at Patras, and within weeks all of the Peloponnese except Monemvasia was theirs. In September Königsmarck landed near Athens and besieged the Acropolis. On the evening of 26 September a Venetian mortar shell hit the Parthenon, which the garrison used as a powder store; the explosion killed about 300 people and wrecked the temple. The garrison surrendered two days later, but Athens was abandoned in April 1688, and some 4,000–5,000 Athenians left with the Venetians. A siege of Negroponte that summer failed, with about 9,000 men lost to battle and plague, Königsmarck among them. In Dalmatia Venetian troops took Herceg Novi in 1687 and Knin in 1688.
    facts:
      - [Nauplia surrenders, 29 August 1686]
      - [Parthenon explosion, "26 September 1687, about 300 dead"]
      - [Siege of Negroponte, "July–October 1688, failed"]
    markers:
      - kind: taken
        side: ve
        name: Lefkada
        date: 6 August 1684
        text: The castle of Santa Maura surrendered after a siege of 16 days, the first Venetian conquest of the war.
        lonlat: [20.71, 38.84]
      - kind: taken
        side: ve
        name: Koroni
        date: 11 August 1685
        text: A former Venetian fortress in Messenia. The garrison was killed during the surrender talks, suspected of treachery.
        lonlat: [21.96, 36.8]
      - kind: taken
        side: ve
        name: Navarino
        date: June 1686
        text: Both castles of Navarino fell in June, the new one after a powder magazine blew up and killed its commander.
        lonlat: [21.7, 36.91]
        lp: l
      - kind: taken
        side: ve
        name: Nauplia
        date: 29 August 1686
        text: The Ottoman capital of the Morea surrendered after its relief army was beaten. It became the Venetians’ main base.
        lonlat: [22.8, 37.57]
      - kind: battle
        side: ve
        name: Patras
        date: July 1687
        text: Morosini’s 14,000 men routed the Ottoman camp, and the garrisons of Patras and the castles of the Gulf of Corinth fled.
        lonlat: [21.73, 38.25]
      - kind: event
        side: ve
