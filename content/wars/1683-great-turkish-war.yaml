  - title: Peter the Great takes Azov
    date: 1695–1700
    when: "1695-06"
    borders: "1700-07-14"
    countries: [ru, ua]
    body:
      - In 1695 the young Peter I turned instead against Azov, the Ottoman fortress at the mouth of the Don. About 31,000 men under Franz Lefort, Patrick Gordon and Avtonom Golovin besieged it from midsummer, with Peter himself serving as a bombardier. They could not stop supplies coming in by river, two assaults failed, and the siege was lifted in October. A larger army under Boris Sheremetev, with Mazepa’s Cossacks, took the Ottoman forts on the lower Dnieper, among them Gazi-Kerman, whose powder magazine blew up.
      - Over the winter Peter had galleys, fire ships and two ships of the line built at Voronezh. In May 1696 about 75,000 men under Aleksei Shein came down the Don, and the new fleet under Lefort closed the river mouth and drove off an Ottoman relief squadron. After a heavy bombardment and a Cossack attack on the outer rampart, the garrison surrendered on 29 July. It was the first great Russian victory over the Ottomans, and it showed Peter what a fleet could do.
      - Peter chose Taganrog, along the coast, for a naval base. When his allies made peace with the Ottomans at Karlowitz in 1699, Russia agreed only a truce. But in the Treaty of Constantinople of 14 July 1700 the sultan recognised Russian rule over Azov and Taganrog. The Dnieper forts, razed by the Russians, went back to the Ottomans, and Russia no longer had to pay a yearly tribute to the Crimean khan.
    facts:
      - [Azov surrendered, "29 July 1696 (19 July Old Style)"]
      - [Peter’s fleet in 1696, "2 ships of the line, 23 galleys, 4 fire ships and smaller craft"]
      - [Treaty of Constantinople, "14 July 1700, a thirty-year truce"]
    markers:
      - kind: event
        side: ru
        name: Voronezh
        date: Winter 1695–1696
        text: Peter’s first fleet was built at shipyards here and floated down the Don in the spring.
        lonlat: [39.2, 51.67]
      - kind: taken
        side: ru
        name: Azov
        date: 1695–1696
        text: The first siege failed in 1695. In 1696 the fleet cut the fortress off from the sea, and the garrison surrendered on 29 July.
        lonlat: [39.42, 47.11]
      - kind: event
        side: ru
        name: Taganrog
        date: 1696–1698
        text: Chosen by Peter as a harbour for his fleet in 1696 and founded in 1698. The Ottomans recognised it as Russian in 1700.
        lonlat: [38.9, 47.21]
        lp: l
      - kind: taken
        side: ru
        name: Gazi-Kerman
        date: 1695
        text: The main Ottoman fort on the lower Dnieper fell to Sheremetev and Mazepa when its powder magazine blew up. It was given back, razed, in 1700.
        lonlat: [33.42, 46.84]
