notes:
  - Dates are New Style (Gregorian).
  - Russia still used the Julian calendar, so Russian sources give the dates of the Crimean and Azov campaigns ten days earlier (eleven days from March 1700).
  - The Venetian campaigns in Greece and Dalmatia are often called the Morean War, or the Sixth Ottoman–Venetian War.
