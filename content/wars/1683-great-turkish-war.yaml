  - title: Mohács and Transylvania
    date: 1687
    when: "1687-06"
    borders: "1687-12-09"
    countries: [hu, hr, ro, sk, de, tr]
    body:
      - In the summer of 1687 Charles of Lorraine, with about 40,000 men, and the Elector of Bavaria, with about 20,000, advanced on Osijek, where the grand vizier Sarı Süleyman Pasha had entrenched some 60,000 men to guard the long wooden bridge across the Drava marshes. Lorraine turned away north, and on 12 August, near Mount Harsány, not far from the battlefield of 1526, the Ottomans attacked his marching columns. The imperial wings held and counter-attacked, and the Ottoman army broke, losing perhaps 10,000 dead and most of its guns. It then mutinied; the grand vizier fled, and on 8 November Sultan Mehmed IV was deposed in favour of his brother Suleiman II.
      - Imperial troops took Osijek and most of Slavonia that autumn, and Eger surrendered in December after a long blockade. Lorraine marched into Transylvania, and Prince Michael I Apafi had to accept imperial garrisons in his towns. At Eperjes the imperial general Antonio Caraffa set up a court that tortured and executed more than twenty Hungarian nobles and burghers suspected of backing Thököly. In the autumn the Hungarian diet at Pozsony accepted the Habsburgs as hereditary kings and gave up the nobles’ old right to resist an unlawful ruler, and Archduke Joseph was crowned on 9 December.
    facts:
      - [Battle of Mohács (Harsány), "12 August 1687, imperial victory"]
      - [Mehmed IV deposed, 8 November 1687]
      - [Hereditary Habsburg kingship, "accepted at Pozsony; Joseph I crowned 9 December 1687"]
    markers:
      - kind: battle
        side: hb
        name: Battle of Mohács
        date: 12 August 1687
        text: The Ottoman attack on Lorraine’s army at the foot of Mount Harsány ended in a rout. It is also called the battle of Harsány.
        lonlat: [18.4, 45.85]
      - kind: taken
        side: hb
        name: Osijek
        date: September 1687
        text: The Ottomans abandoned the Drava crossing, and Slavonia fell to imperial and Croatian troops.
        lonlat: [18.69, 45.56]
      - kind: taken
        side: hb
        name: Eger
        date: December 1687
        text: Starved out after a long blockade, the fortress surrendered after 91 years of Ottoman rule.
        lonlat: [20.37, 47.9]
      - kind: event
        side: hb
        name: Blaj
        date: 27 October 1687
        text: Under an agreement made here, Transylvania took in imperial garrisons and paid for their upkeep.
        lonlat: [23.91, 46.18]
      - kind: event
        side: hb
        name: Eperjes
        date: March–September 1687
        text: Caraffa’s tribunal, remembered in Hungary as the “slaughterhouse of Eperjes”, had suspected Thököly supporters tortured and beheaded.
        lonlat: [21.24, 49.0]
      - kind: event
        side: hb
        name: Pozsony
        date: October–December 1687
        text: The diet made the Hungarian crown hereditary in the House of Habsburg.
        lonlat: [17.11, 48.14]
    arrows:
