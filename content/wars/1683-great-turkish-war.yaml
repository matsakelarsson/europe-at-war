  - title: Golitsyn’s Crimean campaigns
    date: 1687 and 1689
    when: "1687-05"
    borders: "1689-05-30"
    countries: [ru, ua]
    body:
      - Russia joined the Holy League through the Eternal Peace of May 1686, in which Poland–Lithuania recognised Russian rule over Kyiv and left-bank Ukraine. Its task was to tie down the Crimean Tatars. In May 1687 Prince Vasily Golitsyn, chief minister of the regent Sophia, set out from Okhtyrka with about 90,000 men, and some 50,000 Cossacks under Hetman Ivan Samoilovych joined him on the Dnieper. The huge column of men, wagons and horses crawled south in the summer heat. The Tatars set fire to the steppe, and with the horses starving and water short the army turned back in late June, still far from Perekop.
      - Samoilovych was made the scapegoat and exiled to Siberia, and the Cossack officers elected Ivan Mazepa hetman in his place. Golitsyn set out again in the spring of 1689 with about 112,000 men and 350 guns, joined by 30,000–40,000 Cossacks under Mazepa. Marching in separate columns, they beat off Tatar attacks in late May and reached the Perekop isthmus on 30 May. There was no grass or drinking water, and a deep ditch barred the way into the peninsula, so Golitsyn turned back the next day. The failure helped to bring down Sophia’s government later that year, when the young Peter I took power and Golitsyn was exiled.
    facts:
      - [Eternal Peace, "6 May 1686, Russia joins the Holy League"]
      - [First campaign, "1687, about 140,000 Russians and Cossacks; turned back in June"]
      - [Second campaign, "1689, reached Perekop on 30 May and turned back"]
    markers:
      - kind: event
        side: ru
        name: Okhtyrka
        date: May 1687
        text: Golitsyn’s army set out from this town on the Belgorod defensive line.
        lonlat: [34.91, 50.31]
      - kind: event
        side: ru
        name: Novobohorodytska fortress
        date: 1687–1688
        text: Built by Golitsyn where the Samara joins the Dnieper, as a base for the next campaign.
        lonlat: [35.13, 48.5]
        lp: l
      - kind: event
        name: Kolomak
        date: August 1687
        text: In the army’s camp on the way home, Samoilovych was deposed and Ivan Mazepa elected hetman of left-bank Ukraine.
        lonlat: [35.27, 49.83]
      - kind: held
        side: ot
        name: Konskie Vody
        date: June 1687
        text: On burnt steppe near this river, short of water and fodder, the first expedition gave up and turned back.
        lonlat: [35.35, 47.55]
      - kind: held
        side: ot
        name: Perekop
        date: 30–31 May 1689
        text: The second expedition reached the fortified isthmus but found no water or grazing and turned back the next day.
        lonlat: [33.7, 46.16]
