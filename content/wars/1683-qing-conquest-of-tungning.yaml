  - title: Surrender and annexation
    date: August 1683 – 1684
    when: "1683-10-05"
    borders: "1683-10-05"
    countries: [tw, cn]
    body:
      - With the fleet gone, Liu Guoxuan advised surrender, and Feng Xifan agreed. A first petition in August asked that the Zheng family keep Taiwan as a vassal; Shi Lang rejected it, and a second, offering unconditional surrender, reached Penghu on 5 September. The Ming prince Zhu Shugui, Prince of Ningjing, who had lived on Taiwan since the 1660s, hanged himself rather than submit. Shi Lang’s fleet entered the bay of Tainan by the Luermen channel and he came ashore in early October. The Zheng leaders shaved their heads in the Manchu style, the Yongli calendar was given up, and there were no executions; the people were excused taxes for three years.
      - Zheng Keshuang, his family and his chief officers were taken to Beijing, where he was made Duke of Hanjun and enrolled in the Eight Banners. Seventeen Ming princes living on the island were sent back to the mainland, and many Zheng soldiers were resettled there. At court some officials argued that the island should be abandoned; Shi Lang argued for keeping it as a shield for the coast, and in 1684 the emperor made Taiwan a prefecture of Fujian, with the counties of Taiwan, Fengshan and Zhuluo and a garrison of about 10,000 men. The Qing then lifted the sea ban on the coast, though migration to the island was restricted for decades.
    facts:
      - [Unconditional surrender offered, "5 September 1683"]
      - [Shi Lang takes over Taiwan, "early October 1683"]
      - [Taiwan Prefecture created, "1684"]
