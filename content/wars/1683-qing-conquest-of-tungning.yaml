steps:
  - title: The battle of Penghu
    date: July 1683
    when: "1683-07-16"
    borders: "1683-07-18"
    countries: [tw, cn]
    body:
      - Zheng Jing, Koxinga’s son, had used the Revolt of the Three Feudatories to land again in Fujian in 1674, but by 1680 he had lost all his mainland ports. He died in March 1681, and his ministers Feng Xifan and Liu Guoxuan backed a coup in which his eldest son and regent, Zheng Kezang, was killed and a younger son, the boy Zheng Keshuang, put on the throne. In Beijing the Kangxi emperor, his hands now free, appointed Shi Lang commander of the Fujian fleet in 1681. Shi had served Koxinga until the two fell out in 1651; Koxinga then had his father and brother killed, and Shi spent thirty years urging the Qing to invade Taiwan.
      - After two attempts in 1683 were turned back by the winds, Shi sailed from Tongshan on the southern Fujian coast on 8 July with about 240 ships and 21,000 men. Liu Guoxuan held the Penghu islands, halfway to Taiwan, with some 200 ships and more than 20,000 men behind shore batteries. In a first clash on 10 July the Qing fleet was beaten back and Shi was hit in the eye; he regrouped at Bazhao island in the south of the group and waited for reinforcements. On 16 July he attacked again, his main fleet in squadrons of seven ships, each concentrating its fire on one Zheng ship at a time while two flotillas made feints. By the end of the next day the Zheng fleet was destroyed. Shi reported about 12,000 Zheng soldiers killed or drowned and nearly 5,000 taken, against 329 Qing dead. Liu Guoxuan escaped to Taiwan with a few dozen small boats, and the garrisons of Penghu surrendered on 18 July.
    facts:
      - [Qing fleet, "about 240 ships, 21,000 men"]
      - [Zheng forces at Penghu, "about 200 ships, over 20,000 men"]
      - [Main battle, "16–17 July 1683, in the bay of Magong"]
      - [Losses (Qing report), "about 12,000 Zheng dead, 329 Qing dead"]
