id: qing-conquest-of-tungning
name: Qing conquest of Taiwan
start: "1683-07-08"
end: "1683-10-05"
tier: B
summary: "The campaign that ended the Zheng kingdom on Taiwan, the Kingdom of Tungning, the last state to keep the Ming calendar. After the Three Feudatories were defeated, the Kangxi emperor gave command of the Fujian fleet to Shi Lang, a former officer of Zheng Chenggong (Koxinga) who had gone over to the Qing. In July 1683 Shi sailed from Tongshan with about 240 ships and 21,000 men and, on 16–17 July, destroyed the Zheng fleet under Liu Guoxuan in the bay of Magong in the Penghu islands; Qing reports counted about 12,000 Zheng dead against a few hundred of their own. The court of the young king Zheng Keshuang, divided since a succession coup in 1681, offered unconditional surrender in September, and Shi Lang took over Taiwan without further fighting in October 1683. Zheng Keshuang was taken to Beijing and given a dukedom. In 1684 the Qing made Taiwan a prefecture of Fujian province, its first rule over the island."
countries: [tw, cn]
