notes:
  - Dates are converted to the Gregorian calendar from the lunar dates of the Chinese sources. The Zheng state counted years by the reign of the Yongli emperor of the Southern Ming, who had died in 1662.
  - The figures for the battle of Penghu come mainly from Shi Lang’s own reports to the throne; the Zheng side left few records. The name Tungning (Dongning, “eastern pacification”) was used by the Zheng government for Taiwan; Western writers also call the state the Kingdom of Formosa or Ming Zheng.
