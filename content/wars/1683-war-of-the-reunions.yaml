id: war-of-the-reunions
name: War of the Reunions
start: "1683-09"
end: "1684-08-15"
tier: C
summary: A short war between France and Spain over Louis XIV’s “reunions”, the annexation of towns and lands along France’s eastern border, from Montbéliard to Luxembourg, which special courts, the Chambers of Reunion, claimed had once belonged to territories ceded to France. Strasbourg was seized in 1681 in the same policy. With the Emperor tied down by the Ottoman siege of Vienna, French troops entered the Spanish Netherlands in September 1683, and Spain declared war in October. The French took Courtrai and Dixmude, bombarded Luxembourg in December and besieged it in the spring; Vauban took the fortress in June 1684. In the Truce of Ratisbon (Regensburg) of 15 August 1684 Spain and the Emperor accepted France’s possession of Strasbourg, Luxembourg and the reunited lands for twenty years, and France gave back Courtrai and Dixmude.
countries: [fr, be, lu, es]
