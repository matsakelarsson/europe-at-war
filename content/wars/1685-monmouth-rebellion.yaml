id: monmouth-rebellion
name: Monmouth Rebellion
start: "1685-06-11"
end: "1685-07-15"
tier: C
summary: A rising in the West Country by James Scott, Duke of Monmouth, the Protestant illegitimate son of Charles II, against his Catholic uncle, James II. Monmouth landed at Lyme Regis on 11 June 1685 with 82 followers and raised an army of several thousand, mostly farm workers and craftsmen, and was proclaimed king at Taunton. He failed to take Bristol, and on 6 July his night attack on the royal army under the Earl of Feversham and John Churchill at Sedgemoor was beaten off and his army routed. Monmouth was captured and beheaded on Tower Hill on 15 July. At the “Bloody Assizes” led by Judge George Jeffreys, more than 1,400 prisoners were tried; fewer than 300 were hanged and some 800 transported to the West Indies. A linked rising in Scotland by the Earl of Argyll failed in June.
