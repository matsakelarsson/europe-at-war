id: mughal-conquest-of-bijapur-and-golconda
name: Mughal conquest of Bijapur and Golconda
start: "1685-04-01"
end: "1687-09-21"
tier: B
summary: "Aurangzeb’s conquest of the last two Deccan sultanates, the Adil Shahi kingdom of Bijapur and the Qutb Shahi kingdom of Golconda, which had paid tribute to the Mughals for decades but kept their independence and were accused of helping the Marathas. A Mughal army besieged Bijapur from April 1685; Aurangzeb took command himself in July 1686, and the starving city surrendered on 12 September. His son Shah Alam had already occupied Hyderabad in 1685, and in January 1687 the emperor laid siege to the fortress of Golconda, which held out for eight months against mines, famine and plague until one of its officers opened a gate on the night of 21 September 1687. Both kingdoms were annexed, bringing the Mughal empire to its greatest extent and leaving the Marathas as Aurangzeb’s only enemy in the Deccan."
