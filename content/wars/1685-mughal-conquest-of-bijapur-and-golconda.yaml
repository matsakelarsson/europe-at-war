  - title: Golconda
    date: January – September 1687
    when: "1687-01-28"
    borders: "1687-09-21"
    countries: [in]
    body:
      - Aurangzeb then turned on Golconda. Its Brahmin ministers Madanna and Akkanna, the architects of the alliance with the Marathas, had been murdered by court rivals in 1686, but the emperor demanded the kingdom itself. On 28 January 1687 the Mughal army began the siege of the fortress of Golconda, on its granite hill west of Hyderabad. The defenders under Abul Hasan Qutb Shah fought hard. Mughal mines blew up in the faces of their own troops, heavy rains flooded the trenches, and famine and plague swept the camp. Several Golconda nobles went over to the Mughals, but the fortress held out for eight months.
      - In the end treachery decided it. On the night of 21 September 1687 an officer of the garrison opened a postern gate to a Mughal storming party, which let the army in. One noble, Abdur Razzaq Lari, fought on alone and was left for dead with many wounds. Abul Hasan, who received the victors in his audience hall, was sent as a prisoner to Daulatabad, where he spent the rest of his life. Golconda and its diamond country became the Mughal province of Hyderabad, which in the next century passed to the Nizams.
    facts:
      - [Siege of Golconda, "28 January – 21 September 1687"]
      - [Mughal army, "about 100,000 with some 100 siege guns"]
