steps:
  - title: The fall of Bijapur
    date: April 1685 – September 1686
    when: "1686-09-12"
    borders: "1686-09-12"
    countries: [in]
    body:
      - Bijapur, once the strongest kingdom of the Deccan, was ruled by the boy sultan Sikandar Adil Shah and torn by rival factions. On 1 April 1685 a Mughal army of about 80,000 under Prince Azam Shah dug its trenches before the city, defended by some 30,000 troops and a Maratha contingent. Bijapuri cavalry and Maratha raiders cut off the besiegers’ supplies, and famine in the Mughal camp nearly forced a retreat. Meanwhile Prince Muazzam (Shah Alam) defeated a Golconda army at Malkhed and occupied Hyderabad in October 1685; Abul Hasan Qutb Shah fled to his fortress of Golconda and bought peace with a large indemnity.
      - Aurangzeb took over the siege himself, arriving outside Bijapur on 3 July 1686. With food and water running out, the garrison and townspeople could hold no longer, and on 12 September Sikandar Adil Shah surrendered the citadel. Aurangzeb entered the city a week later. Bijapur was made a Mughal province, the last Adil Shahi sultan was kept a prisoner, first at Daulatabad and then in the imperial camp, and he died at Satara in 1700. The city’s population and trade declined quickly once the court was gone.
