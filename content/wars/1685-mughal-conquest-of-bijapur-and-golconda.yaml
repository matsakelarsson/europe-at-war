notes:
  - Both sultanates were Shia states, which Aurangzeb’s court used as an argument for the war; the payment of subsidies to the Marathas and the alliance of Golconda with Shivaji in 1677 weighed at least as much. Dates follow the usual English-language accounts, partly in the Julian calendar.
