  - title: The siege of Bombay
    date: 1688–1690
    when: "1689-02-15"
    borders: "1689-02-15"
    countries: [in]
    body:
      - On the western coast Sir John Child, the Company’s governor at Bombay, seized Mughal ships, including vessels carrying pilgrims to Mecca. Aurangzeb, then besieging the Maratha forts, ordered the Company’s factories across the empire seized and its servants arrested; at Surat the English merchants were imprisoned. In February 1689 his admiral, Siddi Yaqub Khan of Janjira, landed on Bombay island with some 14,000 men. He took the outer forts at Sewri and Mazagaon and confined the English to Bombay Castle and the town around it for more than a year. Famine and disease, and the fighting, cost the garrison very heavily.
      - The Company had to give in. Its envoys went to the imperial camp and, according to the Mughal account, prostrated themselves before Aurangzeb. A farman of February 1690 pardoned the Company on condition that it pay 150,000 rupees, return what it had taken and send Child, who had died that month, out of India. The Siddi left Bombay in June 1690. The emperor needed the trade and the customs revenue, and the Company’s privileges were restored; on 24 August 1690 Charnock landed again at Sutanuti and founded the settlement that became Calcutta.
    facts:
