steps:
  - title: Hooghly and Hijli
    date: October 1686 – January 1689
    when: "1686-10"
    borders: "1687-05"
    countries: [in, bd]
    body:
      - The Company’s merchants in Bengal complained that Mughal officials ignored their old privileges and demanded duties and presents at every turn. Josiah Child, who dominated the Company in London, persuaded it to send a fleet with about 600 soldiers under Vice-Admiral Nicholson to seize and fortify Chittagong. Only part of it reached the Hooghly. In October 1686 a brawl between three English soldiers and the governor’s men in the market at Hooghly turned into a battle; Company troops drove off the Mughal force and bombarded the town. The governor of Bengal, Shaista Khan, gathered an army, and Job Charnock, chief of the Company’s Bengal factories, withdrew downriver, first to Sutanuti and in February 1687 to the island of Hijli at the mouth of the river.
      - On Hijli the English were besieged by a Mughal army, and fever and dysentery killed about half of them within three months. In June 1687 a truce let Charnock return upriver, but the Company sent out Captain William Heath with new ships. Rejecting the terms on offer, Heath took the Company’s staff off in November 1688, attacked Balasore and sailed to Chittagong, which he found too strong to attack, and on to Madras. For the moment the English had left Bengal.
