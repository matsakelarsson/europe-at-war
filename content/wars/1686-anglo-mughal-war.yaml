id: anglo-mughal-war
name: Child’s War (Anglo-Mughal war)
start: "1686-10"
end: "1690-06"
tier: B
summary: "The English East India Company’s first war against an Indian power, named after Sir Josiah Child, the Company’s head in London, who decided to win better trading terms and a fortified base in Bengal by force. In 1686 Company troops fought the Mughal governor’s men at Hooghly, and Job Charnock withdrew the Company’s Bengal staff down the river to the island of Hijli, where they were besieged and decimated by disease. In 1688–1689 English ships seized Mughal merchant and pilgrim ships off the western coast; Aurangzeb ordered the Company’s factories across India seized, and his admiral, the Siddi of Janjira, besieged Bombay for more than a year. In 1690 the Company sued for peace, paid a fine of 150,000 rupees and was allowed to trade again. Charnock returned to Bengal and in August 1690 set up the settlement at Sutanuti that grew into Calcutta."
countries: [in, bd]
sides:
  - id: eic
    name: English East India Company
    polities: [british-india]
    ink: red
    moves: Company moves
    success: Company success
  - id: mug
    name: Mughal Empire and the Siddis of Janjira
    polities: [mughals]
    ink: green
    moves: Mughal moves
    success: Mughal success
notes:
  - The war was fought by the Company with a small force of ships and some hundreds of soldiers, authorised by King James II; to the Mughals it was a rebellion by foreign merchants, not a war between states.
  - Job Charnock is traditionally called the founder of Calcutta, and 24 August 1690 its founding date; in 2003 the Calcutta High Court ruled that the city had no single founder or founding date, as villages and markets had existed there long before.
