notes:
  - Mataram changed sides during the war. Amangkurat II sheltered Surapati in 1686 and sent an army against him only in 1690; Amangkurat III allied with him; Pakubuwono I, installed by the Company, fought him from 1704.
  - Much of Surapati’s story comes from the Javanese chronicles (babad), which tell it with legendary detail, and from the VOC’s Dagh-Register; the two agree on the main events of 1684–1706.
