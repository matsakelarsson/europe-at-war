id: surapati-rebellion
name: Surapati’s rebellion
start: "1686-02"
end: "1706-12"
tier: C
summary: "The twenty-year resistance to the Dutch East India Company (VOC) of Untung Surapati, a Balinese-born former slave who built his own domain in East Java. Sold as a child in Batavia, Surapati escaped in the late 1670s and led a band of runaway slaves and Balinese in the hills of West Java. In 1683 the Company enlisted him and his men as a Balinese unit in the civil war in Banten, but in January 1684, after a Dutch officer insulted him and threatened to return his men to slavery, they attacked the officer’s camp and went east. Surapati was taken into the service of Amangkurat II of Mataram, whose chief minister led the court party opposed to the Company. When the VOC sent Captain François Tack to Kartasura to take him, Surapati’s men, with the connivance of the court, killed Tack and 74 of his soldiers on 8 February 1686. Surapati then moved to Pasuruan in East Java, where, under the name Tumenggung Wiranegara, he ruled a domain that by the 1690s reached from the eastern salient to Madiun; a Mataram army sent against him in 1690 was defeated. After Amangkurat II’s death in 1703 the Company backed his brother Pangeran Puger (Pakubuwono I) against the new king, Amangkurat III, who joined Surapati after the VOC and Puger took Kartasura in 1705. In 1706 a combined army of the Company, Kartasura and Madura attacked Surapati’s fortifications at Bangil; he was wounded and died on 5 December 1706. His sons and Amangkurat III fought on in the hills until 1708. Surapati was declared a National Hero of Indonesia in 1975."
