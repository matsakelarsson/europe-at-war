id: anglo-siamese-war
name: Anglo-Siamese War
start: "1687-06"
end: "1688"
tier: C
summary: "A short war between the English East India Company and the kingdom of Siam under King Narai, fought almost entirely at Mergui (Myeik), Siam’s port on the Bay of Bengal. Narai’s Greek minister Constantine Phaulkon had made two Englishmen, Richard Burnaby and Samuel White, governor and harbour master of Mergui, and from 1685 they seized Indian ships, above all those of Golconda, in a private vendetta that the Company and Golconda regarded as piracy and blamed on Siam. In 1687 the Company, armed with a royal order recalling Englishmen from foreign service, sent the warships Curtana and James under Anthony Weltden to take the English out of Siamese service and to hold the port’s shipping until Narai paid £65,000 in damages. On the night of 14 June 1687, while the English were ashore, Siamese troops under the governor of Tenasserim fired on the ships and attacked the English in the town; about sixty were killed, by most accounts including Burnaby, and the James was sunk. Weltden and White escaped. Siam declared war on the Company in August 1687, and in September a Company frigate sent to occupy Mergui was captured on arrival, by which time a French governor had taken over the port. There was little more fighting; no peace was signed, because the Company kept its claim for damages, and after the revolution of 1688 Siam closed its ports to Company ships until 1708."
