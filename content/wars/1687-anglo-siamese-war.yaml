notes:
  - "Dates are those of the sources cited; English records of the time used the Julian calendar, then ten days behind the Gregorian. Narai had the governor of Tenasserim executed after the massacre."
  - "The war belongs to the rivalry of the English, Dutch and French companies in Siam in the 1680s; Phaulkon had offered Mergui to France, and French troops arrived in 1687 to garrison it and Bangkok. Their expulsion is told in the Siamese revolution of 1688."
