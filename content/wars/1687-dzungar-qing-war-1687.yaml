steps:
  - title: Galdan and the Khalkha quarrel
    date: 1671–1687
    when: "1687"
    borders: "1687-06-01"
    countries: [mn, cn]
    body:
      - Galdan, a younger son of the Dzungar ruler Erdeni Batur, was trained as a lama in Lhasa under the Fifth Dalai Lama. When his brother Sengge, the Dzungar khong tayiji, was murdered by their half-brothers in 1670, Galdan came home, defeated the murderers and took power in 1671. Over the next decade he subdued the other Oirat peoples, and in 1678–1679 the Dalai Lama gave him the title Boshugtu (“blessed by Heaven”) Khan. At the request of the exiled Afaqi Khoja, a Sufi leader of Kashgar, his armies conquered the oasis cities of the Tarim basin in 1680, ending the independence of the Yarkent Khanate, and took Turfan and Hami in about 1682. In the 1680s his generals also campaigned against the Kazakhs and reached the Syr Darya.
      - East of the Altai lay Khalkha, the land of the eastern Mongols, divided among three khans who fought each other over people and pastures. The Kangxi emperor, who had received tribute missions from Khalkha for decades, and the Dalai Lama tried to settle the quarrel between the Tüsheet Khan Chakhundorj and the Zasagtu Khan at an assembly at Khüren Belchir in 1686. There Chakhundorj’s brother Zanabazar, the Jebtsundamba Khutugtu, was seen by the Dzungars to put himself on a level with the Dalai Lama’s envoy, an insult Galdan did not forget.
      - In 1687 Chakhundorj attacked the Zasagtu Khan, Shira, who was Galdan’s ally, and killed him. When Galdan’s brother Dorjijab went to help the Zasagtu Khan’s people, he too was killed. Galdan prepared for war.
    facts:
      - [Galdan takes power, "1671"]
      - [Conquest of the Tarim basin, "1680"]
      - [Assembly of Khüren Belchir, "1686"]
      - [Zasagtu Khan Shira killed, "1687"]
