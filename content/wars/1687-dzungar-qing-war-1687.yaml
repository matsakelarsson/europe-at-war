  - title: Ulan Butung
    date: 1690
    when: "1690-09-03"
    borders: "1690-09-03"
    countries: [mn, cn]
    body:
      - In the summer of 1690 Galdan pursued the Khalkha into eastern Mongolia and then turned south towards the Great Wall, defeating a Qing vanguard on the Ulahui river. Kangxi sent two columns north from the passes of Gubeikou and Xifengkou under his elder brother Fuquan and his younger brother Changning, and set out himself, until a fever forced him back to Beijing.
      - The armies met at Ulan Butung (“red jar”), a hill in today’s Hexigten Banner, about 300 km north of Beijing, on 3 September 1690. Galdan’s men made a wall of about 10,000 camels, roped together and covered with felt, and fired from behind it. The Qing artillery and two assaults across marshy ground failed to break the line; the emperor’s uncle Tong Guogang was killed leading the left wing. The Qing army was much larger, but the numbers given vary widely.
      - Galdan withdrew in good order in the night and sent a promise not to attack Qing subjects again. Fuquan, who did not pursue him, was blamed and dismissed, but Galdan’s army suffered from hunger and disease on the long retreat back to the Kherlen and the Khovd region. Both sides claimed a victory.
    facts:
      - [Battle of Ulan Butung, "3 September 1690, indecisive"]
      - [Qing commanders, "Fuquan and Changning"]
      - [Camel wall, "about 10,000 camels"]
