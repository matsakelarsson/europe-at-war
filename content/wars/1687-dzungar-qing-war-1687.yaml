  - title: Jao Modo
    date: April – June 1696
    when: "1696-06-12"
    borders: "1696-06-12"
    countries: [mn, cn]
    body:
      - In the spring of 1696 three Qing armies set out to trap Galdan on the Kherlen. The Kangxi emperor led the central army of about 32,000 men with 235 cannon across the Gobi from the north of Beijing (some accounts give much larger numbers); Fiyanggu led a western army of about 30,000 from Guihua (Hohhot) and Ningxia towards the Tuul river; a third force of about 10,000 marched in the east. The western army lost many horses on the way and arrived late and short of supplies.
      - When the emperor reached the Kherlen in early June, Galdan, outnumbered, fled west. His army ran into Fiyanggu’s at Jao Modo (Zuunmod), on the upper Tuul river east of today’s Ulaanbaatar, on 12 June 1696. The Qing troops seized a wooded hill, and their artillery and a cavalry attack on the Dzungar rear and baggage broke Galdan’s army. Galdan’s wife Anu, who led a counter-attack, was killed; Qing accounts put the Dzungar dead at several thousand and claim tens of thousands of cattle and sheep captured.
      - Galdan escaped with a few dozen men. Kangxi, who had turned back from the Kherlen because his army was running out of food, celebrated the victory as the decisive blow.
    facts:
