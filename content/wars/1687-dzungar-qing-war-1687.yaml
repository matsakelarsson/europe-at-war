  - title: The invasion of Khalkha
    date: 1688–1689
    when: "1688"
    borders: "1688-09-01"
    countries: [mn, cn]
    body:
      - In 1688 Galdan crossed the Khangai mountains with an army usually put at about 30,000 men. He defeated the Tüsheet Khan’s son and sacked the monastery of Erdene Zuu, and in a three-day battle at Olgoi Nor in early August he routed Chakhundorj himself. The Khalkha had no army able to stop him.
      - Chakhundorj, Zanabazar and many other Khalkha nobles fled south across the Gobi with their people and herds and in September 1688 asked the Kangxi emperor for protection. Estimates of the refugees range from about 20,000 to several hundred thousand people. Some Khalkha considered seeking protection from Russia, but Zanabazar is said to have advised turning to the Qing, who shared their Buddhist faith in the Dalai Lama’s church and were nearer. The Qing settled the refugees in Inner Mongolia and fed them through the winter.
      - Kangxi ordered Galdan to withdraw, while hurrying to settle his own border with Russia on the Amur; the Treaty of Nerchinsk of August 1689 kept Russia out of the war. In 1689 Galdan suffered a second blow, when his nephew Tsewang Rabtan, Sengge’s son, broke with him and took the Dzungar homeland in the Ili valley, leaving Galdan with only the army he had in Khalkha.
    facts:
      - [Battle of Olgoi Nor, "early August 1688, Dzungar victory"]
      - [Khalkha nobles submit to the Qing, "September 1688"]
      - [Treaty of Nerchinsk, "27 August 1689"]
      - [Tsewang Rabtan breaks with Galdan, "1689"]
