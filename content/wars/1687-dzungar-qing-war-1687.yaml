notes:
  - Dates are converted from the Chinese lunar calendar and from Mongolian accounts; sources sometimes differ by days or weeks (Ulan Butung is dated 3 September 1690 in most English accounts, 26 August in some Chinese ones), and Galdan’s death is dated 4 April or 3 May 1697.
  - "Numbers are uncertain. Qing records, which are the main source, tend to enlarge Dzungar losses and the scale of Qing victories; Dzungar and Russian sources survive only in fragments."
  - The Dzungars were one of the four Oirat (western Mongol) peoples; Khalkha was the land of the eastern Mongols, divided in the 17th century among the Tüsheet, Zasagtu and Setsen khans. The Jebtsundamba Khutugtu was the highest lama of Khalkha.
  - The site of Jao Modo (Zuunmod, “hundred trees”) on the upper Tuul east of today’s Ulaanbaatar and the site of Ulan Butung in Hexigten Banner are shown approximately.
