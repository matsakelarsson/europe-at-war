id: dzungar-qing-war-1687
name: Dzungar–Qing War (1687–1697)
start: "1687"
end: "1697-04"
tier: A
summary: "The first war between the Dzungar Khanate of the western Mongols (Oirats) and the Qing empire, fought over Khalkha, the land of the eastern Mongols. Galdan Boshugtu Khan, who had made the Dzungars the leading power of Inner Asia and conquered the oases of the Tarim basin, took a quarrel among the Khalkha khans as his reason to invade Khalkha in 1688. He defeated the Tüsheet Khan at Olgoi Nor and drove the Khalkha nobles, the Jebtsundamba Khutugtu Zanabazar and tens of thousands of their people south into Qing territory, where they submitted to the Kangxi emperor. In 1690 Galdan advanced to Ulan Butung, about 300 km north of Beijing, and fought a Qing army to a standstill before withdrawing. At Dolon Nor in 1691 the Khalkha formally became Qing subjects. In 1696 the Kangxi emperor led three armies across the Gobi, and Fiyanggu’s western army destroyed Galdan’s forces at Jao Modo on the upper Tuul river. Galdan died in the Altai in April 1697. Khalkha remained part of the Qing empire until 1911, while the Dzungar Khanate survived under Galdan’s nephew Tsewang Rabtan."
countries: [mn, cn]
