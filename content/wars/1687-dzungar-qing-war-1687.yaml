  - title: Dolon Nor
    date: 1691–1695
    when: "1691-05"
    borders: "1691-06-01"
    countries: [mn, cn]
    body:
      - In May 1691 the Kangxi emperor met the Khalkha khans and nobles at Dolon Nor, the old summer capital of the Yuan near the Inner Mongolian border. In an assembly with feasts, gifts and a review of the Qing army and its artillery, the Tüsheet, Setsen and Zasagtu khans (the last represented by the dead khan’s heir) declared themselves Qing subjects. Khalkha was organised into banners like the Inner Mongols, its nobles received Qing ranks and salaries, and Kangxi founded a monastery at Dolon Nor to mark the occasion. Khalkha remained under the Qing until 1911.
      - Galdan, now cut off from the Ili valley by Tsewang Rabtan, spent the next years in the Khovd region and western Khalkha, seeking allies among the Russians, the Khoshut of Kokonor and the Inner Mongols, with little success. His men killed a Qing envoy in 1692. In 1695 he moved east to the Kherlen river, inside the lands of the Khalkha who were now Qing subjects.
      - Kangxi used the years of truce to prepare a campaign that would cross the Gobi, gathering grain, camels and horses, and cannon cast under the direction of Jesuit missionaries.
    facts:
      - [Assembly of Dolon Nor, "May 1691"]
      - [Galdan on the Kherlen, "1695"]
