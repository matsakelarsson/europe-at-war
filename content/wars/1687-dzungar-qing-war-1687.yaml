  - title: The end of Galdan
    date: June 1696 – April 1697
    when: "1697-04-04"
    borders: "1697-04-04"
    countries: [mn, cn]
    body:
      - After Jao Modo Galdan wandered west with a few hundred followers, refused Kangxi’s offers of surrender and lost one ally after another. In 1696–1697 the ruler of Hami, ʿAbd Allah Beg, went over to the Qing and handed over Galdan’s son, and Galdan’s nephew Tsewang Rabtan barred the way to the Ili valley. In February 1697 Kangxi set out on a third expedition, to Ningxia on the Yellow River, to direct the final hunt.
      - Galdan died in the Altai near Khovd on 4 April 1697. Qing accounts say he took poison; the historian Peter Perdue and others think he died of illness. Tsewang Rabtan later sent his remains and his surviving children to Beijing. The emperor’s three campaigns had brought the Qing frontier to the Altai; Khalkha remained part of the Qing empire, and Hami became a Qing dependency. The Dzungar Khanate itself, rebuilt by Tsewang Rabtan, fought the Qing again from 1715.
    facts:
      - [Kangxi at Ningxia, "spring 1697"]
      - [Death of Galdan, "4 April 1697 (some sources 3 May)"]
