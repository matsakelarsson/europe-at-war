  - title: Phips at Port Royal and Quebec
    date: May – October 1690
    when: "1690-05"
    borders: "1690-10-24"
    countries: [ca, us]
    body:
      - Massachusetts struck back at Acadia. Sir William Phips, a Maine-born ship’s carpenter turned treasure hunter, sailed with seven ships and some 450 to 700 militia, and on 21 May 1690 Port Royal, whose governor Menneval had about seventy soldiers and no mounted guns, surrendered. Phips’s men looted the town and church in breach of the terms and made the Acadians swear allegiance to William and Mary; the French governor of Acadia, Villebon, moved his base inland to the Saint John River.
      - That summer New York and New England planned a double attack on Canada. Fitz-John Winthrop’s overland army against Montreal broke up from smallpox, lack of supplies and quarrels, and only a small party under John Schuyler raided La Prairie in September. Phips sailed up the St. Lawrence with some 32 to 34 ships and 2,000 to 2,300 militia and reached Quebec on 16 October. His envoy demanded surrender within an hour, and Frontenac answered that he would reply “by the mouth of my cannons”. About 1,200 men under John Walley landed at Beauport, east of the city, but were held at the Saint-Charles River by Canadian militia, while the ships’ bombardment did little harm and the French guns on the cliffs damaged the fleet. After a failed attack on 20 October Walley’s men fell back to the boats on 22 October, and after an exchange of prisoners the fleet sailed for Boston on 24 October. On the way home storms wrecked several ships, and smallpox and shipwreck cost about a thousand men, far more than the fighting.
    facts:
      - [Port Royal surrendered, "21 May 1690"]
      - [Phips’s fleet at Quebec, "32–34 ships, 2,000–2,300 men"]
      - [Fleet sails for Boston, "24 October 1690"]
      - [New England losses, "about 1,000, mostly to disease and shipwreck"]
