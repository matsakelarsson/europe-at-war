  - title: Raids, Newfoundland, Hudson Bay and the Peace of Ryswick
    date: 1691–1697
    when: "1694"
    borders: "1697-09-20"
    countries: [us, ca]
    body:
      - The frontier war went on without decisive battles. Wabanaki warriors with French officers raided York in Maine on 3 February 1692 (24 January Old Style), killing many of its people and carrying off dozens, and on 28 July 1694 (18 July Old Style) some 250 Abenaki under the sachem Bomazeen and the officer Villieu killed about a hundred people at Oyster River (Durham, New Hampshire). Benjamin Church led New England raids into Maine and Acadia, burning Wabanaki villages and Acadian farms at Chignecto. New Englanders built a stone fort at Pemaquid, Fort William Henry, but in August 1696 d’Iberville, Saint-Castin and Wabanaki warriors forced it to surrender.
      - D’Iberville then went to Plaisance, the French base in Newfoundland, and in November 1696, with some 124 Canadians, Acadians, Abenaki and Mi’kmaq, marched overland across the Avalon Peninsula. In about three months they destroyed some 23 English fishing settlements, took St. John’s, killed over a hundred people and sent almost five hundred back to England or France. In Hudson Bay, where French expeditions had seized the Hudson’s Bay Company’s posts on James Bay in 1686, d’Iberville took York Factory in 1694; the English retook it in 1695. On 5 September 1697 his single ship, the Pélican, fought three English ships off York Factory, sank HMS Hampshire and captured the Hudson’s Bay, and the post surrendered days later.
      - In Europe the Peace of Ryswick, signed on 20 September 1697, ended the war and returned all conquests, though the French kept York Factory until 1713; the Hudson’s Bay Company, which had retaken Fort Albany in 1693, held on there. Neither side had changed the frontier. The Wabanaki made peace with Massachusetts at Casco Bay in 1699, and the Haudenosaunee, whom the English had left to fight New France alone, made peace at Montreal in 1701.
    facts:
      - [Raid on Oyster River, "28 July 1694 (18 July Old Style), about 100 killed"]
      - [Fort William Henry (Pemaquid) taken, "August 1696"]
      - [Avalon Peninsula campaign, "November 1696 – early 1697, 23 settlements destroyed"]
      - [Battle of Hudson’s Bay, "5 September 1697"]
      - [Peace of Ryswick, "20 September 1697"]
