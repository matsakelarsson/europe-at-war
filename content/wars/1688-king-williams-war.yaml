steps:
  - title: The frontier war and Frontenac’s winter raids
    date: 1688–1690
    when: "1689-06"
    borders: "1690-02-19"
    countries: [us, ca]
    body:
      - In Maine, English colonists had moved east towards the Kennebec and the Penobscot, land the French counted as Acadia and the Wabanaki as their own. In April 1688 Governor Edmund Andros plundered the house of Jean-Vincent d’Abbadie de Saint-Castin, a French officer married to a daughter of the Penobscot leader Madockawando, and quarrels over colonists’ cattle in Wabanaki cornfields led to the seizure of hostages on both sides. From August 1688 Wabanaki war parties attacked English settlements along the coast of Maine. When news of the Glorious Revolution reached Boston in April 1689, the colonists overthrew Andros and the frontier garrisons went home. On the night of 7–8 July 1689 (27–28 June Old Style) Pennacook warriors under Kancamagus and Mesandowit killed Richard Waldron, who had seized some four hundred Native people at Dover in 1676, and more than twenty others there and took 29 captives; in August Saint-Castin and Abenaki warriors took the fort at Pemaquid.
      - England declared war on France in May 1689. On 5 August some 1,500 Haudenosaunee warriors struck Lachine near Montreal, and in October Frontenac, whom Louis XIV had sent back to New France as governor, arrived at Quebec. Frontenac answered with three winter war parties of French Canadians and Native allies. The first, about 114 French and 96 Kahnawake Mohawk and Algonquin warriors under Le Moyne de Sainte-Hélène and d’Ailleboust de Manthet, with Pierre Le Moyne d’Iberville, crossed the frozen lakes and on the night of 18–19 February 1690 (8–9 February Old Style) found the gates of Schenectady unguarded. They burned the village, killed about sixty people, among them eleven enslaved Africans, and took 27 captives, sparing the Mohawk who were there. In March a second party destroyed Salmon Falls in New Hampshire, and in May the third, joined by Wabanaki warriors, forced the surrender of Fort Loyal at Casco (Portland), where many of the defenders and their families were killed or carried off after the surrender.
    facts:
      - [Raid on Dover, "7–8 July 1689 (27–28 June Old Style)"]
      - [Pemaquid taken, "August 1689"]
      - [Raid on Schenectady, "18–19 February 1690 (8–9 February Old Style), about 60 killed, 27 captured"]
      - [Fort Loyal (Casco) taken, "May 1690"]
