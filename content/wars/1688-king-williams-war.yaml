notes:
  - The English colonies used the Julian calendar (Old Style), ten days behind the Gregorian calendar of New France. All dates here are New Style; where the standard English accounts give an Old Style date, it follows in brackets (Schenectady, for example, was attacked on the night of 18–19 February 1690, 8–9 February by the English calendar).
  - The war between New France and the Haudenosaunee, including the attack on Lachine in 1689, Frontenac’s campaign against Onondaga in 1696 and the Great Peace of Montreal of 1701, is told in the Beaver Wars; the war in Europe in the Nine Years’ War. In New England it was also called the Second Indian War; in Maine and Acadia it is sometimes named after Saint-Castin or the missionary Jean Baudoin.
  - Numbers of the dead and captives in the raids come from colonial records and vary between sources. Hundreds of English colonists were taken captive to Canada; some were ransomed, while others were adopted into Kahnawake and Abenaki families or stayed in New France.
