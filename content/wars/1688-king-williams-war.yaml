id: king-williams-war
name: King William’s War
start: "1688-08-13"
end: "1697-09-20"
tier: B
summary: "The North American part of the Nine Years’ War between Louis XIV’s France and William III’s England, fought between New France and its Wabanaki and other Native allies on one side and the English colonies of New England, New York and Hudson Bay and their Haudenosaunee allies on the other. It grew out of border quarrels in Maine and Acadia and the war between New France and the Haudenosaunee: Wabanaki warriors under leaders such as Kancamagus and Madockawando, with the French officer Saint-Castin, attacked English towns in Maine and New Hampshire from 1688, and after the Haudenosaunee raid on Lachine in 1689 Governor Frontenac sent French and Native war parties against Schenectady and the New England frontier in the winter of 1690. Sir William Phips and the Massachusetts militia took Port Royal in Acadia in May 1690 but were beaten off at Quebec in October, and an overland attack on Montreal failed. For the rest of the war the frontier from Maine to the Mohawk valley suffered raids and counter-raids; Pierre Le Moyne d’Iberville took the fort at Pemaquid in 1696, destroyed most English settlements in Newfoundland in the winter of 1696–1697, and won York Factory on Hudson Bay in 1697. The Peace of Ryswick in September 1697 restored the pre-war borders. The Haudenosaunee, left to fight alone, made peace with New France and its allies at Montreal in 1701, and the Wabanaki with Massachusetts in 1699."
countries: [us, ca]
