steps:
  - title: The devastation of the Palatinate
    date: 1688–1689
    when: "1688-09-24"
    borders: "1689-09-08"
    countries: [de, fr, be]
    body:
      - Louis XIV wanted the Emperor, victorious against the Ottomans since the siege of Vienna, to turn the twenty-year Truce of Ratisbon into a permanent peace that would confirm the reunions, and he claimed part of the Palatinate for his sister-in-law, the Duchess of Orléans. In late September 1688 French armies crossed the Rhine, besieged Philippsburg, which fell on 30 October, and occupied Mainz, Heidelberg, Mannheim and much of the Rhineland, expecting a short war. Instead William of Orange sailed for England, and the German princes, the Emperor, the Dutch and England combined against France.
      - To deny the allied armies food and shelter, the war minister Louvois ordered the systematic destruction of the land the French could not hold. In the winter and spring of 1689 French troops burned Mannheim, Heidelberg, Speyer, Worms, Oppenheim and dozens of other towns and villages, driving out their people. The devastation united Germany against Louis and was remembered there for centuries. In May 1689 the Emperor and the Dutch formed the Grand Alliance, which England soon joined, and that year the allies beat a French army at Walcourt on 25 August, retook Mainz on 8 September and Bonn in October.
    facts:
      - [Siege of Philippsburg, "27 September – 30 October 1688, French victory"]
      - [Mannheim burned, "March 1689"]
      - [Grand Alliance, "the Emperor, the Dutch Republic, England, Spain, Savoy and German princes"]
    markers:
      - kind: siege
        side: fr
        name: Philippsburg
        date: September–October 1688
        text: The Dauphin, guided by Vauban, took the imperial fortress on the Rhine after a month’s siege.
        lonlat: [8.455, 49.237]
      - kind: taken
        side: fr
        name: Heidelberg
        date: 1688–1689
        text: Taken in October 1688. The French burned the town and blew up parts of the castle when they left in 1689, and burned it again in 1693.
        lonlat: [8.717, 49.417]
      - kind: event
        name: Mannheim
        date: March 1689
        text: French troops razed the town and its fortress and drove out the inhabitants.
        lonlat: [8.466, 49.488]
        lp: l
      - kind: event
        name: Speyer
        date: May–June 1689
        text: The town was burned and the imperial cathedral badly damaged; the tombs of the medieval emperors were plundered.
        lonlat: [8.442, 49.317]
        lp: l
      - kind: event
        name: Worms
        date: May–June 1689
        text: Burned at the same time as Speyer, with most of its churches and houses.
        lonlat: [8.365, 49.632]
        lp: l
      - kind: siege
        side: ga
        name: Mainz
