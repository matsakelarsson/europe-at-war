id: nine-years-war
name: Nine Years’ War
start: "1688-09-24"
end: "1697-10-30"
tier: B
summary: A war between Louis XIV’s France and a European coalition, the Grand Alliance, led by William III of the Dutch Republic and England, fought in the Spanish Netherlands, on the Rhine, in Italy and Catalonia, at sea, in Ireland and in North America. After the devastation of the Palatinate and years of costly sieges, the Peace of Ryswick in 1697 made France give back most of its gains since 1678, except Strasbourg, and recognise William as King of England.
countries: [fr, be, nl, de, gb, es, lu]
sides:
  - id: fr
    name: France
    polities: [france]
    ink: navy
    moves: French moves
    success: French success
  - id: ga
    name: The Grand Alliance
    polities: [dutch-republic, england, scotland, habsburg, hre, spain, habsburg-netherlands, savoy, bavaria, prussia, palatinate, saxony, hanover]
    ink: orange
    moves: Allied moves
    success: Allied success
notes:
  - Also called the War of the Grand Alliance, the War of the League of Augsburg and the War of the Palatine Succession. Its campaigns in Ireland (the Williamite War) and Scotland (the Jacobite rising of 1689) have their own entries; those in Italy, Catalonia and North America (King William’s War) are not shown here.
  - Dates are New Style (Gregorian), as used on the Continent. English accounts give Old Style dates, ten days earlier; Beachy Head, for example, was 30 June 1690 Old Style.
