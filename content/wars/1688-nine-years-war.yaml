  - title: Fleurus, Beachy Head and La Hogue
    date: 1690–1692
    when: "1690-07-01"
    borders: "1692-08-03"
    countries: [be, fr, gb, nl]
    body:
      - In the Spanish Netherlands, the main theatre of the war, Marshal Luxembourg crushed the allied army of the Prince of Waldeck at Fleurus on 1 July 1690. Nine days later Admiral Tourville’s fleet beat the Anglo-Dutch fleet off Beachy Head, where the Dutch squadron suffered most, and for a time France commanded the Channel. But William’s victory at the Boyne the next day secured Ireland for him. In 1691 Louis took Mons, and in June 1692 Namur, after a siege directed by Vauban.
      - Louis planned to land James II in England with a French and Irish army in 1692. Tourville, ordered to fight whatever the odds, met a much larger Anglo-Dutch fleet under Edward Russell off Cape Barfleur on 29 May. He held it off, but in the retreat many of his ships were trapped, and at La Hogue on 2–4 June English boats burned twelve French ships of the line in sight of James and his army. The invasion was abandoned. On land Luxembourg beat William again at Steenkerque on 3 August 1692.
    facts:
      - [Battle of Fleurus, "1 July 1690, French victory"]
      - [Battle of Beachy Head, "10 July 1690, French victory"]
      - [Barfleur and La Hogue, "29 May – 4 June 1692, Anglo-Dutch victory"]
    markers:
      - kind: battle
        side: fr
        name: Battle of Fleurus
        date: 1 July 1690
        text: Luxembourg enveloped Waldeck’s army from both flanks, one of the most complete French victories of the reign.
        lonlat: [4.55, 50.483]
      - kind: naval
        side: fr
        name: Battle of Beachy Head
        date: 10 July 1690
        text: The Earl of Torrington, outnumbered, fought cautiously and retreated to the Thames; he was court-martialled and acquitted.
        lonlat: [0.25, 50.6]
      - kind: siege
        side: fr
        name: Mons
        date: March–April 1691
        text: Louis took the capital of Hainaut in person while William’s army was still gathering.
        lonlat: [3.95, 50.45]
      - kind: siege
        side: fr
        name: Namur
        date: May–June 1692
        text: Vauban took the town and its citadel, defended by his Dutch rival, the engineer Menno van Coehoorn.
        lonlat: [4.864, 50.461]
      - kind: battle
        side: fr
        name: Battle of Steenkerque
        date: 3 August 1692
        text: William surprised Luxembourg’s camp, but the French recovered and beat off the attack with heavy losses on both sides.
        lonlat: [4.067, 50.633]
        lp: l
      - kind: naval
        name: Battle of Barfleur
        date: 29 May 1692
        text: Tourville’s 44 ships fought about 80 English and Dutch ships through the day and escaped in fog.
        lonlat: [-1.1, 49.8]
      - kind: naval
        side: ga
        name: La Hogue
        date: 2–4 June 1692
        text: Russell’s boats burned the French ships that had taken refuge under the shore batteries at Saint-Vaast-la-Hougue.
        lonlat: [-1.266, 49.589]
        lp: b
  - title: Namur and Ryswick
    date: 1693–1697
    when: "1693-07-29"
    borders: "1697-10-30"
    countries: [be, nl, fr, gb, es, de, lu]
    body:
      - Luxembourg won his last great victory at Neerwinden (Landen) on 29 July 1693, one of the bloodiest battles of the century, and took Charleroi in October. But France was exhausted. The harvest failures of 1693–1694 caused a famine that killed perhaps 1.3 million people in France, and the navy turned from fleet battles to privateering. In 1695 William besieged Namur, defended by Marshal Boufflers, and took the citadel at the start of September. To draw him off, Marshal Villeroi bombarded Brussels on 13–15 August, destroying thousands of buildings around the Grand Place.
      - Savoy made a separate peace in 1696, and in 1697 the French took Ath and Barcelona. Peace talks met at Rijswijk near The Hague, and the Peace of Ryswick was signed on 20 September 1697 with the Dutch, England and Spain, and on 30 October with the Emperor. Louis recognised William as king, returned Luxembourg, Mons, Charleroi, Courtrai and the Catalan conquests to Spain, gave Lorraine back to its duke and gave up Freiburg, Breisach and Philippsburg on the right bank of the Rhine, but kept Strasbourg and the rest of Alsace. The Dutch won the right to garrison fortresses in the Spanish Netherlands.
    facts:
      - [Battle of Neerwinden, "29 July 1693, French victory"]
      - [Siege of Namur, "July – September 1695, allied victory"]
      - [Peace of Ryswick, "20 September and 30 October 1697"]
    markers:
      - kind: battle
        side: fr
        name: Battle of Neerwinden
        date: 29 July 1693
        text: Luxembourg stormed William’s entrenched villages after repeated assaults; tens of thousands were killed or wounded.
        lonlat: [5.038, 50.766]
      - kind: siege
        side: fr
        name: Charleroi
        date: September–October 1693
        text: The French besieged the fortress on the Sambre, which surrendered on 11 October.
        lonlat: [4.447, 50.408]
        lp: b
      - kind: siege
        side: ga
        name: Namur
        date: July–September 1695
        text: William’s greatest success. Coehoorn’s batteries and costly assaults forced Boufflers to give up the town and then the citadel.
        lonlat: [4.864, 50.461]
      - kind: event
        name: Brussels
        date: 13–15 August 1695
        text: French mortars set fire to the city centre. Most of the Grand Place was destroyed, though the town hall’s tower survived, and the square was soon rebuilt.
        lonlat: [4.352, 50.847]
        lp: l
      - kind: siege
        side: fr
        name: Ath
        date: May–June 1697
        text: Vauban’s last siege of the war, a model of his methods, took the town in two weeks.
        lonlat: [3.767, 50.617]
        lp: l
      - kind: treaty
        name: Peace of Ryswick
        date: 20 September 1697
        text: Signed at the Huis ter Nieuwburg palace in Rijswijk; the Emperor’s treaty followed on 30 October.
        lonlat: [4.317, 52.033]
    areas:
      - style: lost
        side: fr
        label: Given up by France at Ryswick (approximate)
        atoms: [LU-L, LU-D, LU-G, BE-WLX, FR-54, FR-88, FR-57!, FR-55]
