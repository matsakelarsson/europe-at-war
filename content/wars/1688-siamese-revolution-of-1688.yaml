    polities: [france]
    ink: navy
    moves: French moves
    success: French success
notes:
  - "The events are known mainly from French accounts by participants (Desfarges, Vollant des Verquains, de la Touche) and from the Siamese chronicles, which present Phetracha’s seizure of power as a defence of the kingdom and its religion. French sources accused the Dutch of helping the Siamese during the siege; the Dutch factor Johan Keyts was charged with collaborating with them."
  - "Some historians call the events a coup rather than a revolution; the French writers of the time called them the revolution of Siam. The French East India Company’s attempt to hold Phuket in 1689–1690 is mentioned in the last step."
