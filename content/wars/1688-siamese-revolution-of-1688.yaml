  - title: The siege of the French at Bangkok
    date: June – November 1688
    when: "1688-06"
    borders: "1688-11"
    countries: [th, fr]
    body:
      - "On 6 June Desfarges and his officers decided to resist. Phetracha’s forces, about 40,000 men with more than a hundred cannon, surrounded the French in Bangkok. The French gave up the smaller fort on the Thonburi bank, spiking its guns, and when the Siamese mounted cannon there a French attack on it failed with eight dead. At Mergui the French garrison under du Bruant, attacked by Siamese forces, abandoned its fort on 24 June and escaped under fire, with many casualties, on a captured Siamese warship. The same day Phetracha released Desfarges’s sons and other prisoners, and the siege settled into a stalemate with exchanges of fire and, later, of food."
      - "The French warship Oriflamme reached the mouth of the river with 200 men on 9 September but could not pass the Siamese barrier. At the end of September Desfarges agreed to leave with his men on the Oriflamme and two Siamese ships. A last dispute arose over Maria Guyomar de Pinha, Phaulkon’s widow, who had taken refuge with the French; Desfarges handed her over on 18 October after Phetracha seized dozens of French residents. On 13 November 1688 the French sailed for Pondicherry, taking two of the three hostages who were to stay behind; the Siamese in turn held the bishop of Ayutthaya, Louis Laneau, and the French left in the country."
      - "On 14 November Phetracha renewed Siam’s treaty with the Dutch East India Company. From Pondicherry Desfarges occupied the island of Phuket in April 1689 but gave it up in January 1690. In Siam, a rising led by Thammathian in 1690 and the resistance of several provincial governors were put down by 1691."
    facts:
      - ["Siamese forces", "about 40,000 men, over 100 cannon"]
      - ["French garrison", "200 men at Bangkok, 90 at Mergui"]
      - ["French losses at Bangkok", "8 dead in the attack on the Thonburi fort"]
      - ["French depart", "13 November 1688"]
