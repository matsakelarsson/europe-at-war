steps:
  - title: The coup at Lopburi
    date: March – August 1688
    when: "1688-05"
    borders: "1688-06"
    countries: [th, fr]
    body:
      - "King Narai had sought French friendship as a counterweight to the Dutch, on the advice of Constantine Phaulkon, a Greek adventurer who had risen to direct Siam’s foreign affairs. In 1687 a French expedition of 1,361 soldiers, envoys and crews arrived; Narai let General Desfarges garrison the fortress of Bangkok with 200 men and Mergui with 90 under du Bruant. Courtiers resented Phaulkon’s power and the presence of foreign troops near the capital, and the clergy distrusted the Jesuits, who hoped to convert the king. Their leader was Phra Phetracha, commander of the royal elephants."
      - "Narai fell gravely ill in March 1688 at his palace in Lopburi. On 17–18 May Phetracha seized the palace and placed the king under guard, and arrested Phaulkon; Narai’s adopted son, Mom Pi, was killed on 20 May. Desfarges came to Lopburi on 2 June, where Phetracha made him promises and asked him to bring his troops to Lopburi; he left his two sons as hostages and returned to Bangkok. On 5 June Phaulkon was beheaded. Narai’s two brothers, his heirs by right, were put to death on 9 July, and Narai died in detention on 10–11 July. Phetracha was crowned king on 1 August 1688."
    facts:
      - ["Narai arrested", "17–18 May 1688, at Lopburi"]
      - ["Phaulkon executed", "5 June 1688"]
      - ["Phetracha crowned", "1 August 1688"]
