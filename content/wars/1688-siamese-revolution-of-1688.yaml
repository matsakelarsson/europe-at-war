id: siamese-revolution-of-1688
name: Siamese revolution of 1688
start: "1688-05-17"
end: "1688-11-13"
tier: B
summary: "The coup in which Phetracha, commander of King Narai’s elephant corps, seized power in Siam and drove out the French garrisons that Narai had admitted. Narai’s Greek minister Constantine Phaulkon had brought a French expedition to Siam in 1687, whose troops held fortresses at Bangkok, guarding the river to Ayutthaya, and at Mergui. With Narai gravely ill, Phetracha, backed by much of the court and the Buddhist clergy, took over the palace at Lopburi on 17–18 May 1688 and arrested the king. Phaulkon was beheaded on 5 June and Narai’s adopted son and his brothers were killed; Narai died in July, and Phetracha was crowned on 1 August. About 40,000 Siamese troops with more than a hundred cannon besieged the 200 French in Bangkok for four months, while the Mergui garrison escaped by sea under fire. Neither side could win, and on 13 November 1688 the French under General Desfarges sailed for Pondicherry under a negotiated agreement. Siam renewed its treaty with the Dutch East India Company the next day and kept the Western powers at a distance for a century and a half."
countries: [th, fr]
sides:
  - id: ph
    name: Phetracha and the Siamese nobles
    polities: [ayutthaya]
    ink: blue
    moves: Siamese moves
    success: Siamese success
  - id: fr
