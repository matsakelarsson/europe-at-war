notes:
  - The main sources are Sikh writings, among them the Guru’s own Bachittar Natak and Zafarnama and later works such as Sainapati’s Gursobha, and the Persian histories of the Mughal court. They differ on numbers and on many details; Sikh tradition gives much higher numbers of enemy soldiers than the Persian sources.
  - The departure from Anandpur and the battle of Chamkaur are dated December 1704 in most accounts, but some historians argue for 1705, and the conversion of the Bikrami dates is disputed. The earlier battles of Guru Hargobind with the Mughals (1628–1635) are not part of this story.
