  - title: Chamkaur, Sirhind and Muktsar
    date: May 1704 – 1708
    when: "1704-12"
    borders: "1704-12-06"
    countries: [in]
    body:
      - In May 1704 a Mughal army under Wazir Khan joined the hill rajas in a siege of Anandpur that lasted until December. Starving, the Sikhs accepted an offer of safe conduct, sworn, according to Sikh accounts, on the Quran and on a cow, and in December the Guru left the town by night. His party was attacked as it crossed the flooded Sarsa river and broke apart. With about forty men he held out in a mud house at Chamkaur, where his elder sons, Ajit Singh and Jujhar Singh, aged 18 and 14, were killed; the Guru escaped at night. His younger sons, Zorawar Singh and Fateh Singh, aged about 9 and 6, were captured with their grandmother Mata Gujri and taken to Sirhind, where Wazir Khan had them put to death after they refused to convert to Islam; Mata Gujri died soon after.
      - The Guru went south into the Malwa plain, where he gathered new followers, and in 1705 defeated a pursuing Mughal force at Khidrana, renamed Muktsar after forty Sikhs who had earlier deserted him and came back to die there. From Dina he sent Aurangzeb the Zafarnama, a Persian letter reproaching him for the broken oath. After Aurangzeb’s death in 1707 he accompanied the new emperor, Bahadur Shah, to the Deccan, where at Nanded in October 1708 he was stabbed by an Afghan assassin and died of his wounds. Before his death he declared the scripture, the Guru Granth Sahib, to be the Guru after him.
    facts:
      - [Siege of Anandpur, "May – December 1704"]
      - [Battle of Chamkaur, "December 1704"]
      - [Battle of Muktsar, "29 December 1705, Sikh victory"]
      - [Death of Guru Gobind Singh at Nanded, "7 October 1708"]
