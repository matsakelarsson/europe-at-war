  - title: Banda Singh Bahadur
    date: 1709–1716
    when: "1710-05-12"
    borders: "1710-05-14"
    countries: [in, pk]
    body:
      - Before his death the Guru gave a Hindu ascetic he had met at Nanded, who took the name Banda Singh, the authority to lead the Sikhs in the Punjab. Banda arrived in 1709, and peasants and Sikhs flocked to him. He sacked Samana in November 1709 and took Sadhaura, and on 12 May 1710, at Chappar Chiri, his army defeated and killed Wazir Khan. Two days later Sirhind was taken and sacked. Banda made the hill fort of Mukhlisgarh, renamed Lohgarh, his capital, struck coins in the name of the Gurus, and gave land to those who tilled it in the country between the Sutlej and the Yamuna.
      - Bahadur Shah came north himself and took Lohgarh in December 1710, but Banda escaped into the hills, and after the emperor’s death in 1712 the Sikhs recovered much of their ground. In 1715 the governor of Lahore, Abd al-Samad Khan, trapped Banda and several thousand followers in the walled enclosure of Gurdas Nangal and starved them out; it fell on 7 December 1715. Banda and some 700 to 800 prisoners were taken to Delhi in a procession; the prisoners were beheaded over several days, and on 9 June 1716 Banda was put to death after torture. Persecution drove the Sikhs into the hills and forests for a generation, until the misls rose in the 1740s and 1750s.
    facts:
      - [Battle of Chappar Chiri, "12 May 1710, Sikh victory"]
      - [Sirhind sacked, "14 May 1710"]
      - [Lohgarh taken by Bahadur Shah, "December 1710"]
      - [Gurdas Nangal falls, "7 December 1715"]
      - [Banda executed in Delhi, "9 June 1716"]
