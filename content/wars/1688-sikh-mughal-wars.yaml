steps:
  - title: Anandpur and the hill rajas
    date: 1688–1704
    when: "1688"
    borders: "1700-01-01"
    countries: [in]
    body:
      - Gobind Rai became Guru as a boy of nine in 1675, after his father, Guru Tegh Bahadur, was executed in Delhi on Aurangzeb’s orders. He grew up at Anandpur in the Shivalik foothills, which the Sikh community had bought from the raja of Kahlur, and the growing armed following there alarmed the Hindu hill rajas around it. In 1688, while the Guru was staying at Paonta on the Yamuna, Raja Fateh Shah of Garhwal and his allies attacked him at Bhangani; several Pathan captains in the Guru’s pay deserted to the enemy, but his men, helped by the Sufi Pir Budhu Shah and his followers, won the day. In 1691 he fought beside the hill rajas against a Mughal force at Nadaun.
      - At the Vaisakhi festival of 1699 at Anandpur, the Guru founded the Khalsa, a brotherhood of initiated Sikhs bound by a common discipline, with the name Singh for men (and later Kaur for women), and took the name Gobind Singh himself. The hill rajas, led by Ajmer Chand of Kahlur, saw the Khalsa as a threat to their authority and to caste order. They attacked Anandpur several times from 1700 onwards and asked the Mughal governor of Sirhind, Wazir Khan, and the emperor for help.
    facts:
      - [Battle of Bhangani, "1688, victory for the Guru"]
      - [Founding of the Khalsa, "Vaisakhi 1699, at Anandpur"]
