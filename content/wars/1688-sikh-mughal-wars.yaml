id: sikh-mughal-wars
name: Sikh–Mughal wars (1688–1716)
start: "1688"
end: "1716-06-09"
tier: B
summary: "The wars of the tenth Sikh Guru, Gobind Singh, and of his follower Banda Singh Bahadur against the hill rajas of the Punjab Himalaya and the Mughal governors of Sirhind and Lahore. From his base at Anandpur the Guru fought the hill rajas at Bhangani in 1688 and founded the Khalsa, the order of initiated Sikhs, in 1699. In 1704 a Mughal and hill army besieged Anandpur; leaving under a promise of safe conduct, the Guru’s party was attacked, his two elder sons were killed at Chamkaur and his two younger sons put to death at Sirhind. After a last battle at Muktsar he made peace with Aurangzeb’s successor and was assassinated at Nanded in 1708. Banda Singh, sent to the Punjab, raised the peasantry, sacked Sirhind in 1710 and ruled the country between the Sutlej and the Yamuna from Lohgarh, until Mughal armies drove him into the hills and besieged him at Gurdas Nangal; he was captured in 1715 and executed in Delhi with hundreds of his followers in 1716."
