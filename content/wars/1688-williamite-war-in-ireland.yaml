        lonlat: [-7.366, 54.184]
      - kind: event
        side: wil
        name: Carrickfergus
        date: 14 June 1690
        text: William landed here to take command of the war himself.
        lonlat: [-5.808, 54.714]
      - kind: battle
        side: wil
        name: Battle of the Boyne
        date: 1 July 1690
        text: Two kings commanded in person. William’s troops forded the river at Oldbridge and upstream, and James’s army withdrew towards Dublin.
        lonlat: [-6.424, 53.723]
      - kind: held
        side: jac
