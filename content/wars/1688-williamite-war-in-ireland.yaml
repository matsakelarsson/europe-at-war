id: williamite-war-in-ireland
name: Williamite War in Ireland
start: "1688-11-05"
end: "1691-10-03"
tier: B
summary: The war that followed the Glorious Revolution of 1688, when William of Orange landed in England and James II fled to France. Backed by France, James held Ireland until William’s victory at the Boyne in 1690 and Ginkel’s at Aughrim in 1691. The Treaty of Limerick sent the Jacobite army to France and opened a century of Protestant Ascendancy in Ireland.
countries: [ie, gb, nl, fr]
sides:
  - id: wil
    name: William III and his allies
    polities: [england, scotland, dutch-republic]
    ink: orange
    moves: Williamite moves
    success: Williamite success
  - id: jac
    name: James II, the Irish Jacobites and France
    polities: [ireland, france]
    ink: green
    moves: Jacobite moves
    success: Jacobite success
notes:
  - Dates are Old Style (Julian), as used in Britain and Ireland, ten days behind the New Style used in France and the Dutch Republic. The Boyne was fought on 1 July 1690 Old Style (11 July New Style) and is commemorated on 12 July.
  - The war in Ireland was part of the Nine Years’ War between France and the Grand Alliance. For the rising in Scotland, see the Jacobite rising of 1689.
