  - title: Derry and the Boyne
    date: 1689–1690
    when: "1689-03-12"
    borders: "1690-10-15"
    countries: [ie, gb, fr, nl]
    body:
      - James landed at Kinsale on 12 March 1689 with French officers, money and arms, and the Irish Parliament he called to Dublin restored land confiscated from Catholics. From April his army besieged Derry. Crowded with Protestant refugees, the city held out for 105 days through famine and disease until on 28 July the ship Mountjoy broke the boom across the River Foyle and brought food; the siege was lifted on 1 August. On 31 July men from Enniskillen had beaten a Jacobite force at Newtownbutler. In August the Duke of Schomberg landed with a Williamite army, but disease ravaged it in camp near Dundalk.
      - William came himself, landing at Carrickfergus on 14 June 1690 with an army of English, Dutch, Danish, German and Huguenot troops, some 36,000 men. On 1 July he forced the crossing of the Boyne near Drogheda against James’s smaller Irish and French army. Schomberg was killed, but the Jacobites retreated in good order, and James fled to France. William entered Dublin, but in August his siege of Limerick failed after Patrick Sarsfield’s cavalry destroyed his siege train at Ballyneety. In the autumn John Churchill, now Earl of Marlborough, took Cork and Kinsale.
    facts:
      - [Siege of Derry, "18 April – 1 August 1689"]
      - [Battle of the Boyne, "1 July 1690 (11 July New Style), Williamite victory"]
      - [First siege of Limerick, "August 1690, abandoned"]
    markers:
