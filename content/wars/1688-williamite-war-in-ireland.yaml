steps:
  - title: Torbay and James’s flight
    date: 1688–1689
    when: "1688-06-10"
    borders: "1689-02-13"
    countries: [gb, nl, ie]
    body:
      - James II, a Catholic, had alarmed his Protestant subjects by appointing Catholics to the army and government and suspending the laws against them. The birth of his son on 10 June 1688 promised a Catholic dynasty, and on 30 June seven English politicians invited William of Orange, stadtholder of the Dutch Republic and husband of James’s Protestant daughter Mary, to intervene. William, expecting war with France, wanted England on his side. He sailed with a fleet of over 400 ships and about 15,000 soldiers and landed at Brixham in Torbay on 5 November 1688.
      - James’s army, larger on paper, melted away as officers such as John Churchill went over to William, and after a skirmish at Reading on 9 December James tried to flee. Fishermen caught him near Faversham, but William let him escape, and he reached France on 25 December. A Convention declared that James had abandoned the throne and on 13 February 1689 offered the crown to William and Mary jointly, with a Declaration of Rights; Scotland followed in April. In Ireland, however, the Lord Deputy, the Earl of Tyrconnell, held the country for James, and only Protestant towns in Ulster, led by Derry, defied him.
    facts:
      - [William lands, "5 November 1688, Brixham"]
      - [James reaches France, "25 December 1688"]
      - [Crown offered to William and Mary, "13 February 1689"]
    markers:
      - kind: event
        side: wil
        name: Brixham
        date: 5 November 1688
        text: William’s army came ashore unopposed; an easterly “Protestant wind” had carried his fleet down the Channel and kept the English fleet in the Thames.
        lonlat: [-3.516, 50.394]
      - kind: event
        side: wil
        name: Salisbury
        date: November 1688
        text: James joined his army here, but as officers deserted to William he fell back towards London without a battle.
        lonlat: [-1.795, 51.07]
      - kind: battle
        side: wil
        name: Reading
        date: 9 December 1688
        text: William’s advance guard drove Irish troops of James’s army out of the town, the only real fight of the invasion.
        lonlat: [-0.97, 51.456]
      - kind: event
        name: Faversham
        date: December 1688
        text: James was recognised and held by local fishermen as he tried to sail for France, and was brought back to London.
        lonlat: [0.893, 51.318]
      - kind: event
        side: wil
        name: Banqueting House
        date: 13 February 1689
        text: The Convention offered the crown to William and Mary, who accepted it with the Declaration of Rights.
        lonlat: [-0.126, 51.504]
      - kind: event
        side: wil
        name: Derry
        date: 7 December 1688
        text: Thirteen apprentice boys shut the city gates against a Jacobite regiment sent to garrison it.
        lonlat: [-7.326, 54.994]
