  - title: Aughrim and Limerick
    date: 1691
    when: "1691-06-19"
    borders: "1691-10-03"
    countries: [ie, fr, gb]
    body:
      - In 1691 William’s Dutch general, Godert de Ginkel, took command in Ireland. After a ten-day bombardment his troops forded the Shannon and stormed Athlone on 30 June. The French general the Marquis de Saint-Ruth, sent by Louis XIV with officers and supplies, made a stand at Aughrim on 12 July. The Jacobites held until Saint-Ruth was killed by a cannonball and their left wing gave way. Estimates of the Jacobite dead run from 4,000 to 7,000, making Aughrim the bloodiest battle ever fought in Ireland. Galway surrendered on 21 July.
      - Limerick, besieged again from late August, negotiated a surrender, and the Treaty of Limerick was signed on 3 October 1691. Its military articles let Jacobite soldiers go to France, and some 12,000 to 14,000 sailed with Sarsfield to serve Louis XIV, the “Flight of the Wild Geese”. Its civil articles promised Catholics the religious freedom they had had under Charles II and protected the estates of those who submitted. But the Protestant-controlled Irish Parliament ratified only part of them, in 1697, and passed the Penal Laws, which barred Catholics from public office and most professions and restricted their right to own land for much of the 18th century.
    facts:
      - [Battle of Aughrim, "12 July 1691, Williamite victory"]
      - [Treaty of Limerick, "3 October 1691"]
      - [Flight of the Wild Geese, "about 12,000–14,000 soldiers to France"]
    markers:
      - kind: siege
        side: wil
        name: Athlone
        date: June 1691
        text: Ginkel’s grenadiers forded the Shannon on 30 June and took the Irish town by surprise.
        lonlat: [-7.942, 53.424]
      - kind: battle
        side: wil
        name: Battle of Aughrim
        date: 12 July 1691
        text: Saint-Ruth’s death at the height of the battle left the Jacobites without a commander, and their army broke.
        lonlat: [-8.312, 53.295]
      - kind: taken
        side: wil
        name: Galway
        date: 21 July 1691
        text: The town surrendered on terms that let its garrison march to Limerick.
        lonlat: [-9.049, 53.272]
      - kind: taken
        side: wil
        name: Sligo
        date: September 1691
        text: The last Jacobite stronghold in the north-west surrendered.
        lonlat: [-8.483, 54.267]
