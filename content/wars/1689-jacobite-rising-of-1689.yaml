id: jacobite-rising-of-1689
name: Jacobite rising of 1689
start: "1689-03"
end: "1692-02"
tier: C
summary: A rising in the Scottish Highlands for the deposed James VII (James II of England), led by John Graham of Claverhouse, Viscount Dundee, who raised the Stuart standard in April 1689 after the Scottish Convention offered the crown to William and Mary. On 27 July his Highlanders routed the government army of Hugh Mackay at Killiecrankie with a downhill charge, but Dundee was killed, and on 21 August the newly raised Cameronian regiment held Dunkeld against them. Major fighting ended when government cavalry surprised and scattered the Jacobites at Cromdale on 1 May 1690. The Highland chiefs agreed to swear allegiance to William and Mary in 1691, and the war is often taken to end with the Massacre of Glencoe in February 1692, when government soldiers killed more than 30 MacDonalds whose chief had been late to take the oath.
