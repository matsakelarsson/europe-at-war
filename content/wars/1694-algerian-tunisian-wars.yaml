steps:
  - title: Algiers in Tunis, and the rise of the Husainids
    date: 1694–1705
    when: "1694-06"
    borders: "1705-07-12"
    countries: [tn, dz]
    body:
      - After the death of Murad II Bey in 1675, the Muradid family fought over Tunis for two decades, and Algiers repeatedly took sides; in 1686 an Algerian army sacked Tunis. In 1694 Mohamed Ben Cheker, a tribal chief of the north-west who had fallen out with Mohamed Bey, persuaded the dey of Algiers, Hadj Chabane, to make him bey as an Algerian vassal. An Algerian army crossed the border in June 1694, crushed the Tunisian army at El Kef and besieged Tunis, which fell in the autumn and was plundered. Mohamed Bey fled. Algerian taxes and occupation soon set Tunis, Sousse and Kairouan in revolt; Ben Cheker was driven out in April 1695, and Mohamed Bey, restored, beat him at Kairouan on 1 May 1695. Tunis then allied with the Moroccan sultan Moulay Ismail and with Tripoli, and in the war of 1699–1702 its army, after a victory near Constantine, was routed by the Algerians near Sétif on 3 October 1700.
      - In 1702 the janissary officer Ibrahim Sharif killed the last Muradid and took power. In July 1705 Dey Hadj Mustapha invaded with an army joined by some Arab tribes of the border; Ibrahim Sharif, deserted by part of his troops, shut himself in El Kef, surrendered and was taken to Algiers. In Tunis, his officer Husayn ibn Ali had himself proclaimed bey on 12 July 1705 and held the city through a siege by an Algerian army of tens of thousands, paying, by one account, 150,000 piastres towards its withdrawal. Short of food and ammunition and facing the winter, the dey withdrew in early October, beating a Tunisian force that pursued him near Medjez el-Bab. Husayn ibn Ali’s family, the Husainids, ruled Tunisia until 1957.
    facts:
      - [Algerian invasion, "June 1694"]
      - [Mohamed Bey restored, "1695"]
      - [Husayn ibn Ali proclaimed bey, "12 July 1705"]
