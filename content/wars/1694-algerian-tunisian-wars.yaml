  - title: Hammouda Pasha breaks free
    date: 1807
    when: "1807"
    borders: "1807-07-31"
    countries: [tn, dz]
    body:
      - Hammouda Pasha, bey of Tunis from 1782, had strengthened his army and resented the tribute. When the dey of Algiers, Ahmed, demanded more tribute and control of Tabarka, he refused and in 1807 sent an army, by one account more than 50,000 men, under Slimane Kahia against Constantine. After failing to carry the Mansoura plateau that guards the city, the Tunisians laid siege to it; about a month later reinforcements from Algiers under Hussein Bey reached the defenders, and the Tunisian army fell back in disorder.
      - The Algerians followed it into Tunisia, but near the Wadi Serrat, close to El Kef, Hammouda’s minister Youssef Saheb Ettabaa attacked them with artillery and cavalry and drove them back. Tunis paid no more tribute to Algiers. The two regencies fought again at sea in 1811, and in 1813, when an Algerian fleet attacked La Goulette and a Tunisian invasion of the Beylik of Constantine was repulsed, before making peace at the end of that year. Both soon faced a greater danger, France, which conquered Algiers in 1830 and made Tunisia a protectorate in 1881.
    facts:
      - [Siege of Constantine, "1807"]
      - [Battle of the Wadi Serrat, "1807, Tunisian victory"]
    markers:
      - kind: siege
        side: al
        name: Constantine
        date: "1807"
        text: Besieged by the Tunisian army of Slimane Kahia. Reinforcements from Algiers relieved the city after about a month.
        lonlat: [6.61, 36.36]
      - kind: battle
        side: tn
        name: Wadi Serrat
        date: "1807"
        text: Youssef Saheb Ettabaa defeated the invading Algerian army on this border river near El Kef. The exact site is uncertain.
        lonlat: [8.40, 35.95]
