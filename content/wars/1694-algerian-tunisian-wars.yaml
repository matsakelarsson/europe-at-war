id: algerian-tunisian-wars
name: Wars between Algiers and Tunis
start: "1694-06"
end: "1807-07"
tier: B
summary: "A series of wars between the two Ottoman regencies of Algiers and Tunis, nominal vassals of the same sultan, fought over their border, over tribute and over Tunis’s ruling families. An earlier war, in 1628, had ended with a treaty fixing the border along the Mellègue. In 1694 an Algerian army took Tunis for a rival claimant, until a revolt brought the Muradid bey back in 1695; in 1705 another Algerian invasion captured the bey Ibrahim Sharif at El Kef, but the officer Husayn ibn Ali held Tunis and founded the Husainid dynasty. Algiers backed Husayn’s nephew Ali Pasha against him in 1735, and in 1756 helped Husayn’s sons overthrow Ali Pasha, storming and sacking Tunis; for half a century afterwards Tunis paid tribute to Algiers. In 1807 Hammouda Pasha refused to pay, failed to take Constantine but beat the Algerian counter-invasion near El Kef, ending Tunis’s dependence. Fighting flared again in 1811 and 1813 before a peace at the end of 1813."
countries: [tn, dz]
sides:
  - id: al
    name: Regency of Algiers and its Tunisian allies
    polities: [algiers-regency]
    ink: red
    moves: Algerian moves
    success: Algerian success
  - id: tn
    name: Beylik of Tunis (the reigning bey)
    polities: [tunisia]
    ink: green
    moves: Tunisian moves
    success: Tunisian success
notes:
  - The main sources are Tunisian and Algerian chronicles and the reports of European consuls, and many details, dates and numbers are uncertain or disputed; recent popular accounts on both sides tend to inflate their own side’s victories. Some wars between the two regencies (1628, 1686, the war of 1699–1702 in which Tunis and Tripoli joined Morocco against Algiers, 1746, 1811, 1813) are mentioned here only in passing. Sources give 10, 12 or 15 July 1705 for Husayn ibn Ali’s proclamation, and 13 May or 13 September 1740 for his death.
  - Both regencies acknowledged the Ottoman sultan, who sometimes tried to mediate, but by the late 17th century each was ruled by its own deys or beys and made war and peace on its own account. The Beylik of Constantine, the eastern province of the Regency of Algiers, usually led the Algerian armies against Tunis.
