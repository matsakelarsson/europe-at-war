  - title: Algiers chooses the bey
    date: 1735–1756
    when: "1735"
    borders: "1756-09-22"
    countries: [tn, dz]
    body:
      - Husayn ibn Ali had named his nephew Ali Pasha, governor of Sousse, as his heir, then passed him over for his own son. Ali rose against him with tribal support, and when that failed he fled to Algiers, whose dey sent an army of about 7,000 men to put him in power. On 4 September 1735 Husayn was beaten at Smindja; the Algerians reached Tunis, the gates were opened at night and many of the defenders were massacred, and Ali Pasha was installed as bey on 7 September, paying the Algerian troops a large indemnity and promising the dey a yearly tribute. Husayn held out at Kairouan for five years until Ali’s son Younes took the town in 1740 and had him killed. Husayn’s sons Muhammad and Ali escaped to Constantine and Algiers.
      - Algiers kept the brothers as a lever against Ali Pasha, whose relations with the deys soured. In 1756 the bey of Constantine, Hassan Bey, invaded with them, by one report 5,000 infantry, 1,000 spahis and Arab cavalry. He took El Kef on 23 July, and on 31 August 1756 the Algerians broke the defences of Tunis and stormed the city. Thousands were killed, the city, the Bardo palace and the houses of Christians, Turks and Jews were plundered, and many people were carried off to the Algerian camp. Ali Pasha was deposed, taken to Algiers and strangled there; Muhammad ar-Rashid became bey on 22 September. For the next half-century Tunis paid Algiers a yearly tribute and acknowledged its overlordship.
    facts:
      - [Battle of Smindja, "4 September 1735"]
      - [Death of Husayn ibn Ali, "1740"]
      - [Tunis stormed, "31 August 1756"]
