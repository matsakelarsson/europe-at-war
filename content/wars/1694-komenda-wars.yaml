id: komenda-wars
name: Komenda Wars
start: "1694-11"
end: "1700-05-09"
tier: C
summary: "Four wars fought in 1694–1700 round Komenda, on the Gold Coast between Elmina and Cape Coast, in which the Dutch West India Company and the English Royal African Company, rivals for the trade of the kingdom of Eguafo, paid and armed African allies against each other and against Eguafo’s kings. The Dutch had built Fort Vredenburgh at Komenda in 1682 and in 1688 helped put a prince, Takyi, on Eguafo’s throne. In November 1694 John Kabes (Cabess), a Komenda merchant long at odds with the Dutch, brought the English back to build a fort beside theirs and attacked Dutch miners outside the town. In the first war (1694–1695) his men besieged Vredenburgh and on 28 April 1695 defeated an army from Twifo hired by the Dutch. In the second (1696) a young claimant, Takyi Kuma, rose against the king with Dutch, Adom and Akani support and was defeated on 20 March 1696. In the third (1698) forces paid by the English from Asebu, Kabes’s town and Akani attacked; Takyi was killed in November 1698, but the kingdom’s forces routed Takyi Kuma’s army. In the fourth, from November 1699, a larger force paid by the English took Eguafo on 9 May 1700 and made Takyi Kuma king. The English came out with the better trade position, though little land changed hands. The wars, the hiring of armies, the seizure of people as pledges for debts (panyarring) and a smallpox epidemic in the early 1700s depopulated the coast; historians see in them part of the change by which the slave trade overtook the gold trade on the Gold Coast, and of the disorder that let Asante expand. The Dutch chief factor Willem Bosman, who took part, wrote the main contemporary account."
