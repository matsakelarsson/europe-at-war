id: conquest-of-kamchatka
name: Russian conquest of Kamchatka
start: "1697"
end: "1731"
tier: C
summary: "The Russian conquest of the Kamchatka peninsula and the resistance of its peoples, the Itelmens (Kamchadals) and the Koryaks. In 1697 Vladimir Atlasov, commander of the fort of Anadyrsk, led about 65 Cossacks and 60 Yukaghirs south across the Koryak lands, killed about 150 Koryaks who had taken his reindeer, reached the Kamchatka river and claimed the peninsula for the tsar. Forts followed at Verkhnekamchatsk, Nizhnekamchatsk and Bolsheretsk (1703). Cossack demands for fur tribute (yasak), hostage-taking and the enslavement of Itelmens brought repeated risings: Koryaks killed tribute collectors in 1706, rebellious Cossacks of his own command killed Atlasov at Nizhnekamchatsk in 1711, and Itelmens and Koryaks burned the Cossack leader Danila Antsiferov to death in 1712. By 1715 the crown had lost five years of tribute and at least 200 Russians. The largest rising came in 1731, when Itelmens led by the baptised Fyodor Kharchin seized Nizhnekamchatsk. Survivors reached a Russian ship bound for the Anadyr, whose crew landed with cannon and retook the fort, which burned when its powder store exploded; the Cossacks killed their prisoners. Kharchin was captured about a month later, and some of his followers killed themselves and their families rather than surrender. Kamchatka was then put under Okhotsk, and an inquiry under Dmitry Pavlutsky and his fellow officer Merlin (1733–1739) punished Russians and Itelmens alike. War, flight and above all epidemics, smallpox in 1768–1769 worst of all, cut the Itelmens from about 12,000–13,000 people in the late 17th century to fewer than 2,000 by 1827."
