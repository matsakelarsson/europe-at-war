notes:
  - Dates are Old Style (Julian), as in the Russian records. Accounts differ on Atlasov’s route and timing, and on the course of the 1731 rising and Kharchin’s fate.
  - Estimates of the peninsula’s native population before the conquest range from about 12,000–13,000 Itelmens to as many as 50,000 Kamchadals of all peoples; the higher figure is not well supported.
  - The Koryaks of the north, the Chukchi and the Russian–Chukchi wars of 1701–1778 have their own entry.
