id: rise-of-the-asante-empire
name: Rise of the Asante Empire
start: "1699"
end: "1750"
tier: A
summary: "The wars by which Asante grew, in half a century, from a coalition of small Akan states round Kumasi into the strongest power of the Gold Coast forest. In the 1690s Osei Tutu of Kwaaman led the northern tributaries of Denkyira, the great gold- and slave-trading kingdom of the Ofin and Oda valleys, against its king Ntim Gyakari, and many Denkyira towns went over to him. At Feyiase in 1701 Ntim Gyakari was defeated and killed and his capital Abankeseso sacked; Osei Tutu became the first Asantehene, and the Golden Stool, which tradition says the priest Okomfo Anokye called down from the sky, became the symbol of the union. Asante then subdued Denkyira’s old subjects, Twifo, Wassa and Aowin, until Osei Tutu was killed fighting Akyem on the Pra in 1717 and an Aowin army sacked Kumasi in 1718. His successor Opoku Ware conquered Bono (1723), forced Gyaman, western Gonja and Banda to pay tribute, defeated Akyem in 1742 and took over the rents the Europeans paid at Accra, and in 1744–1745 sent armies into eastern Gonja and Dagbon. By his death about 1750 Asante ruled, or took tribute from, most of the forest and southern savanna of today’s Ghana except the Fante coast. Its wars yielded gold, tribute and captives, many of whom were sold to the Dutch, English and Danish forts."
countries: [gh, ci]
