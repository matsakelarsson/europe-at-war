  - title: Akyem and Accra
    date: 1730–1742
    when: "1742"
    borders: "1742-12-01"
    countries: [gh]
    body:
      - East of the Pra, Akyem grew strong. In 1730 its forces joined rebels inside Akwamu in an attack that toppled the Akwamu state, one of the most decisive victories in Gold Coast history in the words of the historian J. K. Fynn; the Akwamu heartland was annexed, and survivors fled east across the Volta, where a smaller Akwamu state survived. Akyem’s three rulers, Frempong Manso, Ba Kwante and Owusu, shared the conquered lands, including Accra and the Adangbe districts, with the payments the European forts there had made to Akwamu, until Ba Kwante’s claim to Accra’s rents set them against one another in the 1730s.
      - Their quarrel paused when Asante threatened about 1739, and in 1742 Opoku Ware invaded. Apau, Frempong Manso’s successor, and Owusu were killed, and Ba Kwante was captured and later took his own life. Asante installed captured heirs as rulers under its authority; Akyem groups that rejected Asante rule fled to the Fante, to Kwahu and to Little Popo.
      - With Akyem Asante took over Accra and the coast round it. The Danes at Christiansborg began paying the Asantehene ground rent in May 1742, the Dutch paid rent for their fort and land at Accra, and the English company later paid as well. By the 1740s Asante controlled the coast except the stretch between the Pra and the Ga lands, round Cape Coast and Anomabu, where the Fante states stood between Asante and the English.
    facts:
      - [Akyem overthrows Akwamu, "1730"]
      - [Asante conquest of Akyem, "1742"]
      - [Danish rent to the Asantehene, "from May 1742"]
