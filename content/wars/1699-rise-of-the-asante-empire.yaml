notes:
  - "Most of this history rests on Asante, Denkyira, Bono and other stool histories recorded from oral tradition in the nineteenth and twentieth centuries, and on the letters of Dutch, English and Danish traders on the coast, who heard of inland events late and often confusedly. Dates are therefore approximate: Osei Tutu’s death is put by most historians in 1717 and by some about 1712, Opoku Ware’s installation between 1718 and 1722, and the fall of Bono in 1722, 1723 or 1723–1724."
  - The Golden Stool’s descent from the sky, Okomfo Anokye’s other deeds and the details of single battles are told as Asante tradition tells them. The site of Abankeseso, the Denkyira capital, is not known today; it lay in the Ofin–Oda valleys south-west of Kumasi, in today’s Amansie district.
  - "Asante (Ashanti) is the usual English name; the Dutch wrote “Assjantee”. Takyiman is today’s Techiman, Dwaben is also written Juaben, and Dagbon is also called Dagomba."
