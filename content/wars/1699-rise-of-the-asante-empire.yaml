  - title: The Pra and the sack of Kumasi
    date: 1717–1722
    when: "1717"
    borders: "1720"
    countries: [gh]
    body:
      - In 1717 Asante went to war with Akyem, Denkyira’s old ally, on behalf of the Agona. Dutch reports say that Akonno, king of Akwamu, revealed the Asante army’s route, and the Akyem trapped it in the forest. The aged Osei Tutu was shot while crossing the Pra and his body was never recovered; Apenten, one of Akyem’s three rulers, also died in the war, and Amankwatia soon after. Smallpox weakened the Asante army, and in 1718 Denkyira, Wassa and Twifo were said to be seeking an alliance with Akyem.
      - While the army was still in the field, Ebiri Moro, king of Aowin, attacked and sacked Kumasi in 1718. The Dutch factor at Axim put his army at about 9,000 men and reported that it carried off much gold and beads and 20,000 Asante women and children, a figure that rests on this one report and is probably inflated; Asante tradition remembers that members of the royal family, among them Opoku Ware’s mother, were killed or carried off. Asante troops hurried back from Akyem and chased the Aowin far to the west, through the thinly peopled forest of Ahafo, which Asante annexed and shared out among the generals who had driven off the raiders.
      - Asante and Akyem made peace about 1718 and kept it after 1720. After years of strife over the succession, Opoku Ware, a grand-nephew of Osei Tutu, was installed as Asantehene about 1720. In 1721–1722 his armies attacked Aowin, the Nzima and Wassa; Aowin suffered a complete defeat, and many Aowin prisoners were sold as slaves at Elmina, Cape Coast and Anomabu.
    facts:
      - [Death of Osei Tutu, "1717 (some say about 1712), on the Pra"]
      - [Aowin sack of Kumasi, "1718"]
      - [Opoku Ware installed, "about 1720"]
