  - title: Securing Denkyira’s lands
    date: 1702–1716
    when: "1706"
    borders: "1715"
    countries: [gh, ci]
    body:
      - Asante’s hold was not yet secure. In 1702 an Akyem and Denkyira army is reported to have defeated an Asante force. Osei Tutu resettled the Denkyira gold-mining villages north of the Ofin under his own authority, sent people from Kumasi’s towns to settle among them and watch the Denkyira, and made Bekwai responsible for the captured towns; gold nuggets found at places such as Mpatuom were to go to the Asantehene. In 1706 Denkyira rose again under Boadu Akufu, the ruler Asante had accepted; Amankwatia, the Asante general who had served Osei Tutu since his years at the Denkyira court, joined Wassa against it, Boadu Akufu was captured and executed, and Denkyira was made tributary. Many Denkyira fled south over the Ofin to Twifo Heman, and in the early nineteenth century their descendants moved south of the Pra to a new homeland round Jukwa.
      - Control of Denkyira’s old lands gave Asante a springboard towards the coast and the trade of Elmina and Cape Coast. Between 1712 and 1715 Asante and Wassa defeated Twifo, which became tributary under a new ruler. Aowin, in the far west, bought powder and guns and closed its roads to keep news from Kumasi; Asante campaigns in 1715 defeated it and imposed a fine of about £2,000 in gold and a number of slaves, and the Dutch at Axim reported that Cape Apollonia, on the coast, had been “ruined”. To the north-west, Asante attacked Wenchi in 1711, by one account, and sacked its capital.
    facts:
      - [Denkyira rising, "1706–1707, suppressed"]
      - [Twifo, "made tributary, 1712–1715"]
      - [Aowin, "defeated 1715, fined about £2,000"]
