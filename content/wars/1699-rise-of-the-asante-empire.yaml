  - title: Gonja, Dagbon and the empire of 1750
    date: 1744–1750
    when: "1745"
    borders: "1750"
    countries: [gh]
    body:
      - "In the savanna to the north, Asante armies absorbed eastern Gonja by 1744 and in 1744–1745 invaded Dagbon; a Gonja chronicle, the Kitab Ghunja, records an Asante attack on Yendi, the Dagbon capital, in 1745. Dagbon came to send slaves to Kumasi as tribute, a payment that went on, with interruptions, until 1874, but how far it was conquered is debated: the historians Ward and Arhin speak of conquest, while others see a relationship of mutual interest, begun when a faction in a Dagbon civil war invited Asante in. About 1772, in the reign of Osei Kwadwo, an Asante force returned and took the Dagbon king, Abdallah Gariba, prisoner."
      - Late in his reign Opoku Ware tried to curb the power of the provincial chiefs, and a conspiracy forced him to flee to Dwaben; he defeated the rebels, reoccupied Kumasi and died about 1750, succeeded by Kusi Obodom. In fifty years Asante had grown from a coalition of forest states into an empire that reached from Gyaman and Aowin in the west to Akyem and Accra in the east, and from the forest’s southern edge to Gonja and Dagbon, held together by tribute, by Kumasi’s roads and by the Golden Stool.
      - The wars that built it yielded gold dust, tribute and captives. Many captives were sold at the coast, where by the early eighteenth century the trade in slaves had overtaken the trade in gold; others were settled in Asante, some of them to wash gold for the Asantehene. The Fante states, on the coast between Asante and the English, remained independent and hostile, and the struggle between Asante and the Fante shaped the coast’s history into the nineteenth century.
    facts:
