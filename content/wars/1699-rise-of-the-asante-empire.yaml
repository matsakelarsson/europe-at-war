  - title: Bono and the road to the north
    date: 1722–1740
    when: "1723"
    borders: "1735"
    countries: [gh, ci]
    body:
      - North of the forest lay the old Bono state, whose capital Bono Manso, near the Tano river, stood on the routes that linked the Akan goldfields with the markets of Djenné and Timbuktu. Drought, quarrels over the succession and the shift of trade to the coast had weakened it, and it had lost several of its allies; Asante won over the Akan settlers of Nkoranza, and its commander Baffo Pim prepared the attack. Asante invaded in 1722–1723. The last Bonohene, Ameyaw Kwaakye, was defeated and died in 1723, and Takyiman tradition says the king and queen were taken to Kumasi with the court’s craftsmen. Bono Manso was destroyed. The old royal line was later re-established at Takyiman (Techiman), which paid yearly tribute to Asante, and Bono refugees scattered to Gyaman, Domaa, Nkoranza and Berekum. A Dutch letter of 1724 reported the war, and the Gonja chronicle records Baffo Pim’s attack.
      - Nkoranza, whose first king was Baffo Pim, became Asante’s base for expansion to the north. Gyaman, the gold-rich kingdom round Bonduku, was forced to pay a heavy tribute in gold; Asante armies invaded western Gonja and Gyaman in 1732 and Banda in 1740. In the south-west Wassa, whose king Intsiful tried to keep firearms from reaching Asante, was invaded in 1726, when Wassa, Fante and reportedly English help forced the Asante army back, and defeated in 1729. In 1726 the Dutch director-general, who wanted the trade roads open, ordered that Asante be supplied with arms and gunpowder.
    facts:
      - [Bono conquered, "1722–1723"]
      - [Western Gonja and Gyaman invaded, "1732"]
