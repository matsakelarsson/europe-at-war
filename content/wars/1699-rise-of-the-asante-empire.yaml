steps:
  - title: Kwaaman under Denkyira
    date: c. 1670–1699
    when: "1690"
    borders: "1695"
    countries: [gh]
    body:
      - Between the 1660s and the 1690s Denkyira was the dominant power among the Twi-speaking Akan of the forest. Its capital, Abankeseso, lay among the gold workings of the Ofin and Oda valleys, south-west of today’s Kumasi. Denkyira was the most important inland supplier of gold and of slaves to the Dutch at Elmina and the English at Cape Coast, and the richest buyer of European guns and gunpowder, and it fought wars to keep the 200-km trading corridor to the coast open. Its king Boamponsem, who reigned for some forty years until about 1694, took tribute in gold and palm oil from the small states to the north.
      - One of them was Kwaaman, ruled by the Oyoko clan, which had moved north from Asantemanso by way of Kokofu about 1650. Kwaaman had to send a royal to live at the Denkyira court, and it sent Osei Tutu. In the 1670s, traditions say, he offended Boamponsem and fled east to Akwamu, whose king Ansa Sasraku conquered the Ga kingdom of Accra in 1677–1681; there, by Asante tradition, he met the priest Okomfo Anokye. After his uncle Obiri Yeboa was killed in a war with Domaa, Osei Tutu came home in the 1680s to rule Kwaaman, fought a series of wars against his neighbours, defeated Domaa and made Kumasi his seat.
      - When Boamponsem died, Ntim Gyakari won the Denkyira succession against Asensu Kufuor, a royal of Nkawie, Denkyira’s second town. The new king raised his demands on his own people and his tributaries, and in the mid- to late 1690s a coalition of Denkyira’s northern subjects, led by Osei Tutu and, traditions say, Okomfo Anokye, refused them. Many Denkyira towns and lineages went over to Osei Tutu with their followers, Asensu Kufuor first among them, taking with him, it is said, gold and guns. At the end of the decade Abankeseso faced the coalition with many enemies and few friends.
    facts:
      - [Boamponsem of Denkyira, "reigned c. 1650s–1694"]
      - [Akwamu takes Accra, "1677–1681"]
      - [Osei Tutu rules Kwaaman, "from the 1680s"]
