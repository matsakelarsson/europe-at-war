  - title: Feyiase and the fall of Denkyira
    date: 1699–1701
    when: "1701"
    borders: "1701-12-01"
    countries: [gh]
    body:
      - "The Dutch at Elmina left the best record of the war. In August 1699 they reported that trade had dwindled because the peoples of the interior had “war on their minds”, and by June 1700 nothing sold better than firearms. Akyem, east of the Pra, sided with Denkyira, and in 1699 Akyem and Asante’s allies fought each other to a standstill. The peoples along the trade road cut off Ntim Gyakari’s supply of munitions, and in May 1701 the Dutch heard of “heavy warfare” between Denkyira and the coalition they called “Assjantee”, which they thought much stronger in men and well provided with everything."
      - Denkyira and Asante traditions tell the battle in much the same way. Ntim Gyakari’s army marched north-east from Abankeseso and drove Asante forces out of Adunku, Aboatem and Aputuogya, south-east of Kumasi, a withdrawal that some accounts call a lure. A mile north of Aputuogya, at Feyiase, it met Osei Tutu’s main army. Denkyira’s army was routed, the two or three Dutch cannon it had brought were taken, and Ntim Gyakari was killed; traditions differ on whether he died on the field or was captured and executed. The remnants of his army fled south across the Ofin.
      - Osei Tutu then turned on the undefended Abankeseso, which his men sacked for fifteen days, carrying its stored gold to Kumasi. In November 1701 the Dutch reported that Denkyira’s “towering pride” was “in ashes” and its people in flight from enslavement. They sent an envoy, David van Nyendael, to the victor; he saw booty worth several thousand marks of gold in Osei Tutu’s war camp and stayed at his court for more than a year, the first European to do so.
      - The victory gave the new union control of the Ofin–Pra basin. Kumasi was its centre and Osei Tutu its first Asantehene, and the Golden Stool (Sika Dwa Kofi), which tradition says Okomfo Anokye called down from the sky onto the king’s lap, became the seat of the spirit of the Asante nation, “living, dead and yet to be born”. Asensu Kufuor was confirmed as chief of Nkawie, which became an Asante town.
    facts:
      - [War with Denkyira, "1699–1701"]
      - [Battle of Feyiase, "1701, Asante victory"]
      - [Ntim Gyakari, "killed at or after the battle"]
      - [Abankeseso, "sacked for fifteen days"]
