      center:
        - 18.3763
        - 57.4396
      size:
        - 1582
        - 904
    body:
      - Denmark–Norway, Saxony–Poland and Russia agreed to attack the young Charles XII from three sides. In February 1700 Saxon troops of Augustus II, Elector of Saxony and King of Poland, invaded Livonia and tried to take Riga. In March the Danes marched into Holstein-Gottorp, Sweden’s ally, and besieged Tönning.
      - Charles, aged 18, struck at Denmark first. With English and Dutch ships covering the crossing, he landed at Humlebæk on Zealand on 4 August, and Frederick IV made peace at Travendal two weeks later. Charles then shipped his army to Pernau and marched on the Russians besieging Narva. On 30 November, in a snowstorm, about 10,500 Swedes routed an army more than three times their size.
    facts:
      - - The coalition
        - Denmark–Norway, Saxony–Poland and Russia
      - - Narva
        - About 10,500 Swedes against 35,000–38,000 Russians
