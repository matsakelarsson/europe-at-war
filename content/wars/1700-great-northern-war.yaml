  - title: The end of an empire
    date: 1719–1721
    when: "1719"
    borders: "1721"
    countries:
      - se
      - dk
      - no
      - de
      - pl
      - ru
      - ee
      - lv
      - fi
    body:
      - Charles XII’s sister Ulrika Eleonora, and then her husband Frederick I, made peace on the best terms they could get. In the Treaties of Stockholm Sweden gave up Bremen-Verden to Hanover (November 1719) and Pomerania south of the Peene, with Stettin, Usedom and Wolin, to Prussia (February 1720). At Frederiksborg in July 1720 Denmark–Norway handed back Stralsund, Rügen and Wismar for 600,000 riksdaler, but Sweden lost its exemption from the Sound Dues and its alliance with Holstein-Gottorp.
      - Peace with Russia came last, at Nystad on 10 September 1721. Sweden gave up Livonia, Estonia with Ösel, Ingria and south-eastern Finland with Viborg and Kexholm. Russia returned the rest of Finland and paid 2 million riksdaler. Sweden’s time as a great power was over, and Russia had taken its place.
    facts:
      - - To Hanover
        - Bremen-Verden
      - - To Prussia
        - Pomerania south of the Peene, with Stettin
      - - To Russia
        - Livonia, Estonia, Ösel, Ingria, Kexholm and Viborg
      - - Kept
        - Finland, Wismar, and Pomerania north of the Peene
    markers:
      - kind: treaty
        side: se
        name: Treaties of Stockholm
        date: 1719–1720
        lonlat:
          - 18.0729
          - 59.3281
        lp: l
        text: Peace with Hanover in November 1719 and with Prussia in February 1720. Hanover paid 1 million riksdaler and Prussia 2 million thalers.
      - kind: treaty
        side: se
        name: Treaty of Frederiksborg
        date: July 1720
        lonlat:
          - 12.3
          - 55.9285
        text: Peace with Denmark–Norway, named after the castle at Hillerød. Sweden also stopped backing the Duke of Holstein-Gottorp, whose part of Schleswig Denmark kept.
      - kind: treaty
        side: se
        name: Treaty of Nystad
        date: 10 September 1721
        lonlat:
          - 21.4121
          - 60.7991
        text: Signed in a small town on the Finnish coast. Russia kept its conquests on the eastern Baltic and handed back the rest of Finland within weeks.
