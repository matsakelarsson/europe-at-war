  - title: Peter wins the Neva
    date: 1701–1704
    when: "1701"
    borders: "1700"
    countries:
      - se
      - dk
      - no
      - ru
      - ee
      - lv
    view:
      center:
        - 27.3539
        - 59.0279
      size:
        - 662
        - 573
    body:
      - With the main army in Poland, small Swedish forces had to hold the Baltic provinces. Russian armies under Boris Sheremetev beat Wolmar Anton von Schlippenbach at Erastfer in January 1702 and at Hummelshof that July, then laid waste to much of Livonia and Estonia.
      - Peter the Great’s real goal was the sea. In October 1702 he took Nöteborg, where the Neva leaves Lake Ladoga, and in May 1703 Nyenskans near its mouth. On 27 May 1703 he founded St Petersburg there. In the summer of 1704 the Russians stormed Dorpat and then Narva, the town they had failed to take four years before.
    facts:
      - - Russian commander
        - Boris Sheremetev
      - - New city
        - St Petersburg, founded 27 May 1703
    markers:
      - kind: battle
        side: foe
        name: Battle of Erastfer
        date: January 1702
        lonlat:
          - 26.5979
          - 57.9986
        text: The first real Russian victory of the war, over a much smaller Swedish force.
      - kind: battle
        side: foe
        name: Battle of Hummelshof
        date: July 1702
        lonlat:
          - 25.9488
          - 57.9192
        lp: l
        text: Schlippenbach was beaten again, and Livonia lay open to Russian raids.
      - kind: siege
        side: foe
        name: Nöteborg
        date: October 1702
        lonlat:
          - 31.0372
          - 59.9491
        text: The island fortress surrendered after a short siege. Peter renamed it Shlisselburg, “key fortress”.
      - kind: siege
        side: foe
        name: Nyenskans and St Petersburg
        date: May 1703
        lonlat:
          - 30.4099
          - 59.9488
        lp: l
        text: The Swedish fort at the mouth of the Neva fell after a few days. Within weeks Peter laid the foundations of the Peter and Paul Fortress nearby, the start of his new city.
      - kind: siege
        side: foe
        name: Dorpat
        date: June – July 1704
        lonlat:
          - 26.7196
          - 58.3787
        text: The university town surrendered to a Russian siege.
      - kind: siege
        side: foe
        name: Narva stormed
        date: August 1704
        lonlat:
          - 28.1886
          - 59.3797
        text: The Russians took the town by storm, avenging their defeat of 1700.
