  - title: The siege of Stralsund
    date: "1715"
    when: "1715"
    borders: "1700"
    countries:
      - se
      - dk
      - no
      - de
    view:
      center:
        - 12.3106
        - 54.0786
      size:
        - 446
        - 305
    body:
      - Charles found new enemies waiting. Prussia, already holding Stettin, and Hanover, whose elector was now King George I of Great Britain and had been promised Bremen-Verden by Denmark, both declared war on Sweden in 1715.
      - From July 1715 an allied army of some 55,000 besieged Stralsund, held by about 11,500 men. On 16 November Prussian, Danish and Saxon troops landed on Rügen at Stresow, and Charles’s counterattack failed. He escaped by boat just before Christmas and the town surrendered. Wismar, Sweden’s last foothold in Germany, fell in April 1716.
    facts:
      - - Allied army
        - 55,000–58,000 men
      - - Swedish garrison
        - About 11,500 men
    markers:
      - kind: siege
        side: foe
        name: Usedom
        date: April – August 1715
        lonlat:
          - 13.9207
          - 53.87
        text: Charles seized the island in a pre-emptive strike in April, but the Prussians took it back in the summer.
      - kind: naval
        side: none
        name: Battle of Rügen
        date: August 1715
        lonlat:
          - 13.9517
          - 54.5195
        text: The Swedish and Danish fleets clashed off Rügen without a clear winner.
      - kind: battle
