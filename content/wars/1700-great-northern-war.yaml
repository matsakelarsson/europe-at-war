  - title: Helsingborg, and the Baltic lost
    date: 1709–1710
    when: "1709"
    borders: "1700"
    countries:
      - se
      - dk
      - no
      - pl
      - ru
      - lv
      - ee
    view:
      center:
        - 20.5599
        - 58.2165
      size:
        - 1405
        - 937
    body:
      - Poltava revived the coalition. Augustus took back the Polish throne and Denmark–Norway declared war again. In November 1709 a Danish army of 15,000 landed at Råå, took Helsingborg and marched through Scania into Blekinge. Magnus Stenbock raised a new army, largely of fresh recruits, and on 10 March 1710 beat the Danes outside Helsingborg. They left Scania for good.
      - The east was lost. In 1710 the Russians took Viborg in June, Riga in July, Pernau in August and Reval in the autumn, and the nobles and towns of Livonia and Estonia submitted to the tsar. Plague swept through the besieged towns and on into Sweden itself.
    facts:
      - - Battle of Helsingborg
        - Two armies of about 14,000 each; Swedish victory
      - - Lost to Russia in 1710
        - Viborg, Kexholm, Riga, Pernau, Ösel, Reval
    markers:
      - kind: battle
        side: se
        name: Battle of Helsingborg
        date: 10 March 1710
        lonlat:
          - 12.6911
          - 56.05
        text: On the Ringstorp heights just outside the town, Stenbock routed the Danish army that had landed at Råå the previous November. It was the last major battle of the war on Swedish soil.
      - kind: siege
        side: foe
        name: Viborg
        date: June 1710
        lonlat:
          - 28.727
          - 60.7098
        text: The fortress guarding south-eastern Finland fell after a siege of nearly three months.
      - kind: siege
        side: foe
        name: Riga
        date: July 1710
        lonlat:
          - 24.1122
          - 56.9489
        lp: l
        text: After a siege of about eight months, with plague raging inside the walls, the capital of Livonia surrendered to Sheremetev.
      - kind: siege
        side: foe
        name: Pernau
        date: August 1710
        lonlat:
          - 24.4991
          - 58.3791
        lp: l
        text: The Livonian port surrendered after a short siege.
      - kind: siege
        side: foe
        name: Reval
        date: Autumn 1710
        lonlat:
          - 24.7477
          - 59.4389
        text: The capital of Estonia gave up after plague had ravaged the town and its garrison.
