  - title: Into Poland
    date: 1701–1704
    when: "1701"
    borders: "1700"
    countries:
      - se
      - dk
      - no
      - pl
      - lv
      - de
    view:
      center:
        - 20.9999
        - 53.573
      size:
        - 925
        - 885
    body:
      - On 19 July 1701 Charles forced a crossing of the Düna near Riga, drove the Saxons out of Livonia and occupied Courland. Instead of turning on Russia, he set out to drive Augustus off the Polish throne.
      - He took Warsaw in May 1702, beat the Saxons and their Polish allies at Kliszów on 19 July and went on to Kraków. In 1703 he won again at Pułtusk and starved Thorn into surrender after a siege of nearly five months. In July 1704 a Swedish-backed assembly in Warsaw elected Stanisław Leszczyński king of Poland, but Augustus fought on.
    facts:
      - - Düna crossing
        - 19 July 1701
      - - New king of Poland
        - Stanisław Leszczyński, elected July 1704
    markers:
      - kind: battle
        side: se
        name: Crossing of the Düna
        date: 19 July 1701
        lonlat:
          - 24.1122
          - 56.9489
        lp: l
        text: Under cover of smoke from burning straw, the Swedes crossed the wide river in boats and drove off the Saxon army.
      - kind: taken
