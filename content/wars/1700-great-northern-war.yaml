        text: The Danes bombarded and took the capital of Bremen-Verden.
      - kind: battle
        side: se
        name: Battle of Gadebusch
        date: 20 December 1712
        lonlat:
          - 11.1204
          - 53.6989
        text: Stenbock attacked the Danish and Saxon army at Wakenstädt near Gadebusch and won decisively.
      - kind: event
        side: none
        name: Altona burned
        date: January 1713
        lonlat:
          - 9.9406
          - 53.5494
        lp: l
        text: Stenbock had the Danish town next to Hamburg burned down in midwinter, which badly damaged his reputation.
      - kind: siege
        side: dk
        name: Surrender at Tönning
        date: 16 May 1713
        lonlat:
          - 8.9409
          - 54.3195
        lp: l
        text: Trapped by Danish, Russian and Saxon forces, Stenbock’s army surrendered to Frederick IV. Another Swedish field army was gone.
      - kind: siege
