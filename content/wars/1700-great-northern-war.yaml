  - title: Gadebusch and Tönning
    date: 1711–1713
    when: "1711"
    borders: "1700"
    countries:
      - se
      - dk
      - no
      - de
      - pl
      - ru
    view:
      center:
        - 11.5623
        - 54.3848
      size:
        - 521
        - 405
    body:
      - With Charles away, Danish, Saxon and Russian troops attacked Swedish Pomerania in 1711 and began a long blockade of Stralsund. In 1712 Denmark and Hanover occupied Bremen-Verden between them, and Stade surrendered to the Danes in September.
      - Magnus Stenbock crossed to Pomerania with a new army and on 20 December 1712 beat the Danes and Saxons at Gadebusch, the last great Swedish victory of the war. Pursued by Russian and Saxon forces, he burned the Danish town of Altona in January 1713 and took refuge in the Holstein-Gottorp fortress of Tönning, where he had to surrender on 16 May 1713. That autumn the Russians took Stettin and handed it to Prussia to hold.
    facts:
      - - Gadebusch
        - 14,000 Swedes against 16,000 Danes and 3,000 Saxons
      - - Stenbock
        - Died a prisoner in Copenhagen in 1717
    markers:
      - kind: held
        side: se
        name: Stralsund
        date: 1711–1715
        lonlat:
          - 13.0918
          - 54.3095
        text: Blockaded on and off from 1711, the fortress held out for four years.
      - kind: siege
