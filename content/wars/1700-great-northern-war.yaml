  - title: Finland falls
    date: 1713–1714
    when: "1713"
    borders: "1700"
    countries:
      - se
      - dk
      - no
      - ru
      - fi
    view:
      center:
        - 25.3154
        - 62.2296
      size:
        - 820
        - 823
    body:
      - In May 1713 Peter’s galley fleet appeared off Helsingfors, and over the summer Russian troops occupied southern Finland, including Åbo. That August Carl Gustaf Armfeldt took command of a starving, ragged army.
      - On 2 March 1714 the Russians under Mikhail Golitsyn crushed Armfeldt’s army at Storkyro in Ostrobothnia. That summer the Swedish fleet tried to block the coastal route at Hangö, but on 7 August 1714 Russian galleys slipped past and captured a squadron under Rear Admiral Nils Ehrenskiöld in the Battle of Gangut. Åland fell, and all of Finland stayed under Russian occupation until 1721, years Finns remember as the Great Wrath.
    facts:
      - - Storkyro
        - 2 March 1714, the last land battle in Finland
      - - Finnish name for the occupation
        - Isoviha, the Great Wrath (1714–1721)
    markers:
