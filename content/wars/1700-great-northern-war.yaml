  - title: Russian raids on the coast
    date: 1719–1721
    when: "1719"
    borders: "1700"
    countries:
      - se
      - dk
      - no
      - ru
      - fi
    view:
      center:
        - 19.438
        - 61.7668
      size:
        - 591
        - 885
    body:
      - After Charles’s death Sweden made peace with Hanover, Prussia and Denmark, but Russia kept up the pressure to force it to give up the Baltic provinces. In the summer of 1719 Russian galleys landed troops along the coasts of Uppland and Södermanland, burning towns, manors and ironworks from near Gävle down to Norrköping. A thrust toward Stockholm was stopped at Stäket in August.
      - A British fleet came to Sweden’s aid in 1720 but could not stop the galleys. Russian troops burned Umeå that year, and in 1721 Sundsvall, Härnösand, Hudiksvall, Söderhamn and Piteå. Among the islands of Åland, Russian galleys defeated a Swedish squadron at Grengam in August 1720. On the west coast, Tordenskjold had taken Marstrand in 1719.
    facts:
      - - Swedish name
        - Rysshärjningarna, the Russian ravages
      - - Towns burned
        - Norrköping, Södertälje, Umeå, Sundsvall, Härnösand, Piteå and others
    markers:
      - kind: event
        side: foe
        name: Norrköping
        date: Summer 1719
