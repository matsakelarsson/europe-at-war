  - title: Fraustadt and Altranstädt
    date: 1705–1707
    when: "1705"
    borders: "1700"
    countries:
      - se
      - dk
      - no
      - lv
      - by
      - pl
      - de
      - ru
    view:
      center:
        - 17.8315
        - 53.4525
      size:
        - 1059
        - 913
    body:
      - In Courland, Adam Ludwig Lewenhaupt beat Sheremetev at Gemauerthof on 26 July 1705. Early in 1706 Charles hemmed a Russian army into Grodno, while in the west Carl Gustaf Rehnskiöld destroyed a much larger Saxon-Russian army at Fraustadt on 13 February 1706.
      - In August Charles marched straight into Saxony, Augustus’s home. At Altranstädt near Leipzig on 24 September 1706 Augustus gave up the Polish crown and his alliance with the tsar. Even so, on 29 October a Russian-Saxon army beat a Swedish-Polish force at Kalisz, an embarrassment for Augustus, who had secretly made peace. The Swedish army stayed in Saxony for a year and set out against Russia in September 1707.
    facts:
      - - Fraustadt
        - Swedish victory over a Saxon-Russian army almost twice its size
      - - Treaty of Altranstädt
        - Augustus II gives up the Polish crown
