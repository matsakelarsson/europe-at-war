  - title: The king in exile
    date: 1709–1714
    when: "1709"
    borders: "1700"
    countries:
      - se
      - dk
      - no
      - ru
      - de
      - md
      - ro
    view:
      center:
        - 21.5452
        - 51.0013
      size:
        - 1838
        - 1031
    body:
      - From his camp near Bender, Charles worked to bring the Ottoman Empire into the war, and late in 1710 it declared war on Russia. Peter marched into Moldavia, and in July 1711 a huge Ottoman army trapped him on the Pruth. To Charles’s fury, the grand vizier let the tsar go in return for giving back Azov.
      - In time the sultan wanted his troublesome guest gone. On 1 February 1713 Ottoman troops and Tatars stormed Charles’s house at Bender, a fight remembered as the Kalabalik. In the autumn of 1714 he finally left, riding in disguise across the Habsburg lands and Germany, and reached Stralsund in about two weeks, in November 1714.
    facts:
      - - Pruth campaign
        - About 38,000 Russians against about 130,000 Ottomans
      - - The ride home
        - About 14 days and nights, autumn 1714
    markers:
      - kind: event
        side: none
        name: Bender and the Kalabalik
        date: 1709–1713
        lonlat:
          - 29.4802
          - 46.8371
        lp: t
        text: Charles lived near this Ottoman fortress on the Dniester for more than three years. In February 1713 he and his small household fought off Ottoman troops for hours before he was captured.
      - kind: battle
        side: none
        name: Pruth campaign
        date: July 1711
        lonlat:
          - 28.1809
          - 46.6286
        lp: l
        text: Surrounded by a much larger Ottoman army, Peter had to make peace and hand back Azov, which Russia had won in 1696.
      - kind: event
        side: se
        name: Arrival at Stralsund
        date: November 1714
        lonlat:
          - 13.0918
          - 54.3095
        text: Charles and a single companion reached the gates of the Swedish fortress on a dark November night, filthy from the road.
