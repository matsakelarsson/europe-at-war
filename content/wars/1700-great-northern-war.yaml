  - title: Norway, and death at Fredriksten
    date: 1716–1718
    when: "1716"
    borders: "1700"
    countries:
      - se
      - dk
      - no
    view:
      center:
        - 11.1143
        - 60.9083
      size:
        - 525
        - 830
    body:
      - Back in Sweden, Charles attacked Norway to strike at Denmark. He crossed the border in March 1716 and briefly occupied Christiania, but could not take Akershus fortress. An assault on Fredrikshald failed, and on 8 July Tordenskjold destroyed the Swedish supply fleet at Dynekilen, ending the campaign.
      - In the autumn of 1718 Charles invaded again with about 36,000 men in three armies and besieged Fredriksten. On the evening of 11 December 1718, while inspecting the siege trenches, he was shot through the head. Further north, Carl Gustaf Armfeldt had failed to take Trondheim. Ordered home, his army was caught by a blizzard in the Tydal mountains in January 1719, and thousands froze to death.
    facts:
      - - Charles XII killed
        - 11 December 1718, aged 36
      - - The death march
        - About 3,000 of Armfeldt’s men died
    markers:
      - kind: taken
        side: se
        name: Christiania
        date: March – April 1716
        lonlat:
          - 10.7532
          - 59.9103
        text: The Swedes held the town for some weeks, but Akershus fortress held out and they withdrew.
      - kind: held
        side: dk
        name: Fredriksten
        date: 1716 and 1718
        lonlat:
          - 11.3932
          - 59.1205
        text: The fortress above Fredrikshald beat off the Swedes in 1716. During the second siege Charles XII was killed in the trenches on 11 December 1718, and his army went home.
      - kind: naval
        side: dk
        name: Battle of Dynekilen
        date: 8 July 1716
        lonlat:
          - 11.1836
          - 58.98
        lp: l
        text: Peter Tordenskjold sailed into the narrow fjord and captured or destroyed most of the Swedish transport ships supplying the army.
      - kind: held
        side: dk
        name: Trondheim
        date: Autumn 1718
        lonlat:
          - 10.4062
          - 63.4298
        lp: l
        text: Armfeldt’s army of about 10,000 advanced on the city but could not take it.
      - kind: event
        side: none
        name: The Carolean Death March
        date: January 1719
        lonlat:
          - 12.1544
          - 63.0788
        text: Retreating across the mountains toward Jämtland, Armfeldt’s men were caught by a storm. Thousands froze to death.
