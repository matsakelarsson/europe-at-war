  - title: Disaster at Poltava
    date: 1708–1709
    when: "1708"
    borders: "1700"
    countries:
      - se
      - dk
      - no
      - pl
      - lt
      - by
      - ua
      - ru
      - lv
    view:
      center:
        - 29.241
        - 51.5252
      size:
        - 1171
        - 1215
    body:
      - Charles marched east through Poland and Lithuania in 1708 and won at Holowczyn on 14 July. The Russians burned the land ahead of him, so instead of heading for Moscow he turned south into Ukraine, where the Cossack hetman Ivan Mazepa had promised help. On 9 October the Russians caught Lewenhaupt’s relief column at Lesnaya and destroyed the supplies it was bringing from Riga. Mazepa brought only a few thousand Cossacks, and Menshikov razed his capital, Baturyn.
      - After one of the coldest winters in memory, Charles besieged Poltava. He had been wounded in the foot, so Rehnskiöld commanded when, on 8 July 1709, about 22,700 Swedes attacked Peter’s fortified camp and were crushed. Three days later most of the survivors surrendered at Perevolochna on the Dnieper. Charles and Mazepa escaped to Ottoman territory at Bender.
    facts:
      - - Poltava
        - About 22,700 Swedes against 50,000–55,000 Russians
      - - Swedish commander
        - Carl Gustaf Rehnskiöld, as Charles XII was wounded
    markers:
      - kind: battle
        side: se
        name: Battle of Holowczyn
        date: 14 July 1708
        lonlat:
          - 29.9002
          - 54.0588
        text: Charles led his men across a marshy river at dawn and drove off the Russians, his last big victory in the field.
      - kind: battle
        side: foe
        name: Battle of Lesnaya
        date: 9 October 1708
        lonlat:
          - 31.0519
          - 53.3784
        text: Peter attacked Lewenhaupt’s column and its wagon train. Lewenhaupt reached the king with about half his men and none of the supplies.
      - kind: siege
        side: foe
        name: Baturyn razed
        date: November 1708
        lonlat:
          - 32.8797
          - 51.3399
        text: Menshikov stormed Mazepa’s capital before the Swedes could get there, and many of its people were killed.
      - kind: battle
        side: foe
        name: Battle of Poltava
        date: 8 July 1709
        lonlat:
          - 34.5524
          - 49.5894
        text: The Swedish infantry advanced past Russian redoubts against a much larger army with far more guns, and was shattered.
      - kind: event
        side: foe
        name: Surrender at Perevolochna
        date: 11 July 1709
