id: great-northern-war
name: Great Northern War
start: "1700"
end: "1721"
tier: A
summary: "Denmark–Norway, Saxony–Poland and Russia attacked Sweden in 1700. Charles XII beat them one by one and drove Augustus II from the Polish throne, but his invasion of Russia ended in disaster at Poltava in 1709. By the peace of Nystad in 1721 Sweden had lost its Baltic provinces and most of its German lands, and Russia had taken its place as the great power of the north."
