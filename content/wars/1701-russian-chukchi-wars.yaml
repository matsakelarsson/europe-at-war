id: russian-chukchi-wars
name: Russian–Chukchi wars
start: "1701"
end: "1778"
tier: B
summary: "The long and, for Russia, unsuccessful attempt to bring the Chukchi of the far north-east of Siberia under fur tribute (yasak). From the fort of Anadyrsk, founded on the Anadyr river in the 1650s, Cossack expeditions against the Chukchi began in 1701. In 1730 the Chukchi killed Afanasy Shestakov, commander of a new expedition, near the mouth of the Penzhina, and his successor Dmitry Pavlutsky led punitive campaigns in 1731 and 1744–1747 that burned camps, took reindeer and captives and killed many, but never forced the Chukchi to submit. Pavlutsky himself was killed in battle near Anadyrsk in March 1747. Judging the war too costly, Catherine II’s government ordered Anadyrsk abandoned in 1764; it was burned and evacuated in 1771. At Gizhiga in 1778 Chukchi leaders agreed to become Russian subjects on their own terms, and the empress freed them from tribute. Trade at fairs on the Kolyma and the Anyui replaced war, and Russian rule over the Chukchi remained largely nominal until the Soviet period."
countries: [ru]
sides:
  - id: rus
    name: Russia, with Koryak and Yukaghir auxiliaries
    polities: [russia]
    ink: green
    moves: Russian moves
    success: Russian success
  - id: chu
    name: Chukchi
    polities: [siberian-peoples]
    ink: brown
    moves: Chukchi moves
    success: Chukchi success
notes:
  - Dates are Old Style (Julian), as in the Russian records; add 11 days for the Gregorian calendar. Sources disagree on several dates, among them Shestakov’s death (March or May 1730) and Pavlutsky’s (14 or 21 March 1747).
  - Almost all written sources are Russian reports, which give Russian numbers and often exaggerate enemy losses. In Chukchi oral tradition Pavlutsky is remembered as the most feared of the Russians.
  - The Koryaks fought on both sides. Many paid tribute and served with the Cossacks against the Chukchi, who raided their herds, while others rose against Russian rule in the 1740s and 1750s. The conquest of Kamchatka has its own entry.
  - The site of Anadyrsk is given differently in the sources, upstream of Markovo or about 20 km north-east of it; the map uses the first.
