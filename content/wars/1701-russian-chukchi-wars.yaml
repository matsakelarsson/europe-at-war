  - title: Pavlutsky’s campaigns
    date: 1731–1747
    when: "1731-03"
    borders: "1747-03-14"
    countries: [ru]
    view:
      center: [172.0, 67.0]
      size: [1300, 1000]
    body:
      - Pavlutsky, now in command, left Anadyrsk in March 1731 with about 375 Cossacks and sailors and a band of Yukaghirs. He marched to the Chukchi Peninsula, beat the Chukchi in three battles, burned their camps and carried off women and children, and came back along the Arctic coast by Cape Shelagsky to Anadyrsk in October. Russian reports claimed about 1,000 Chukchi killed and more than 40,000 reindeer taken in 1731–1732. In February 1732 he put down Koryaks at Gizhiga. Yet the Chukchi did not submit, and from 1733 Pavlutsky was busy in Kamchatka after the Itelmen rising and then as governor of Yakutsk.
      - Chukchi raids on the tribute-paying Koryaks went on, and in 1742 the Senate ordered a new war; its instructions spoke of “totally extirpating” the hostile Chukchi. Pavlutsky returned to Anadyrsk, campaigned on the Chukchi Peninsula in 1744 and towards Chaun Bay in 1746. On 12 March 1747 about 500 Chukchi raided the herds at Anadyrsk. Pavlutsky followed with 96 Cossacks and 35 Koryaks, caught them near today’s Markovo and attacked without waiting for the rest of his men. Surrounded on a hill, he was killed with most of his detachment on 14 March; the Chukchi took its cannon, flag and drum, and are said to have kept his head for years.
    facts:
      - [First campaign, "March–October 1731"]
      - [Senate order for a new war, "1 June 1742"]
      - [Pavlutsky’s last battle, "14 March 1747"]
      - [Forces, "96 Cossacks and 35 Koryaks against about 500 Chukchi"]
