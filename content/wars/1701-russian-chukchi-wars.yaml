steps:
  - title: Anadyrsk and Shestakov
    date: 1701–1730
    when: "1701"
    borders: "1730-03-14"
    countries: [ru]
    view:
      center: [157.0, 64.0]
      size: [2000, 1300]
    body:
      - The Chukchi lived in the far north-east of Asia, reindeer herders in the tundra of the interior and hunters of walrus and whales on the coasts; around 1700 they numbered perhaps 6,000. Russians reached the Kolyma in the 1640s and the Anadyr in 1649, where Semyon Dezhnev’s winter quarters grew into the fort of Anadyrsk. From there the Cossacks collected fur tribute from the Yukaghirs and Koryaks, and from there Vladimir Atlasov set out for Kamchatka in 1697. The Chukchi refused tribute and raided the reindeer herds of the peoples who paid it, and Russian expeditions against them began in 1701. Those of 1708, 1709 and 1711 were bloody but changed little.
      - In 1727 a decree sent the Yakutsk Cossack head Afanasy Shestakov and the dragoon captain Dmitry Pavlutsky, with about 400 Cossacks, to bring the Koryaks and Chukchi under the crown and look for new lands. The two quarrelled and went separate ways. Pavlutsky marched by Nizhnekolymsk to Anadyrsk, which he reached in September 1730. Shestakov sailed from Okhotsk in 1729, collected tribute and hostages from the Koryaks on the coast of the Sea of Okhotsk and wintered at the mouth of the Gizhiga. On 14 March 1730, near the mouth of the Penzhina, he met a Chukchi war party on the Egach and was killed by an arrow in the throat; a relief party was wiped out too.
    facts:
      - [Anadyrsk, "winter quarters 1649, fort about 1660"]
      - [First expedition against the Chukchi, "1701"]
      - [Shestakov killed, "14 March 1730"]
