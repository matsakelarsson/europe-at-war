  - title: Abandonment and peace
    date: 1756–1789
    when: "1756"
    borders: "1778-02-25"
    countries: [ru]
    view:
      center: [165.0, 65.5]
      size: [1500, 1200]
    body:
      - The war cost far more than the tribute it brought in; by one calculation Anadyrsk had raised about 29,000 roubles between 1710 and 1764 and cost the treasury some 1.38 million. From 1756 Chukchi leaders offered peace, and about a dozen meetings followed over ten years. Catherine II’s government changed course. It forbade the taking of hostages, dropped the demand for tribute, and by a Senate decree of 5 March 1764, approved by the empress in 1766, abolished Anadyrsk. In March 1771 the last inhabitants left and the fort was burned; the Russians fell back on the Kolyma and on Gizhiga, a fortress founded in 1752 on the Sea of Okhotsk to guard the road to Kamchatka against the Koryaks. Clashes did not stop at once, and in 1768 a meeting with Chukchi at Gizhiga ended in a massacre.
      - On 25 February 1778 an agreement was concluded at Gizhiga, after talks that ran until 3 March, by Captain Timofey Shmalev and the baptised Chukchi interpreter Nikolai Daurkin with the Chukchi chief Amulyat Khergyntov; a Koryak prince and his elders also signed. The Chukchi accepted Russian subjecthood on condition that any tribute be handed over on the Anadyr, and left five hostages. An imperial decree then freed them from tribute for ten years and allowed them to hunt and trade freely. In practice they never paid regular tribute, and Russian rule over them remained largely nominal until the Soviet period. Trade took the place of war, first at a fair on the Angarka in 1775, then at a yearly fair on the lower Kolyma from 1788, and later at the Anyui fair near the fort on an island in the Maly Anyuy, the largest in Chukotka, where Chukchi traded furs and walrus ivory, some of it from Alaska, for tea, tobacco and iron.
    facts:
      - [Decree to abolish Anadyrsk, "5 March 1764"]
      - [Anadyrsk abandoned and burned, "March 1771"]
      - [Agreement at Gizhiga, "25 February 1778"]
