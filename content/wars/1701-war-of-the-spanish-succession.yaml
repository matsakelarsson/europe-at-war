        via: [[3.2, 50.3], [3.55, 50.3], [3.84, 50.32]]
  - title: Denain
    date: 1710–1712
    when: "1710"
    borders: "1712-10-19"
    countries: [fr, be, es, gb, nl, at]
    body:
      - Talks at Geertruidenberg in 1710 broke down on the same issue, and the allies took Douai, Béthune, Aire and Saint-Venant. In Spain the allied army won at Almenara and Saragossa and entered Madrid for the second time in September 1710, but Castile stood by Philip V, and in December Vendôme beat the allies at Brihuega and Villaviciosa. In April 1711 the Emperor Joseph I died, and his brother, Archduke Charles, succeeded him; a Habsburg ruling both Spain and the Empire now worried the British almost as much as a Bourbon one. The new Tory ministry negotiated secretly with France, and Marlborough, who had slipped through Villars’s “Ne Plus Ultra” lines and taken Bouchain in 1711, was dismissed at the end of the year.
      - The Duke of Ormonde, Marlborough’s successor, had secret orders not to fight, and in July the British withdrew under an armistice and took over Dunkirk as a pledge of peace. Eugene took Le Quesnoy and besieged Landrecies, but his supplies came from the depot at Marchiennes along a long fortified corridor across the Scheldt. On 24 July Villars feinted towards Landrecies and fell instead on the Earl of Albemarle’s Dutch and imperial troops at Denain, driving many of them into the river. Villars then took Marchiennes and retook Douai, Le Quesnoy and Bouchain. Denain ended the threat of an invasion of France and strengthened Louis XIV’s hand at the peace talks.
    facts:
      - [Battle of Denain, "24 July 1712, French victory"]
      - [British armistice, "17 July 1712"]
      - [Marlborough dismissed, "31 December 1711"]
