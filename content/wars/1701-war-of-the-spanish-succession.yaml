steps:
  - title: Carpi, Chiari and Cremona
    date: November 1700 – August 1702
    when: "1701"
    borders: "1702-02-01"
    countries: [it, at, fr, es, nl, be, gb]
    body:
      - When Charles II of Spain, the last of the Spanish Habsburgs, died childless on 1 November 1700, his will left the whole Spanish monarchy – Spain and its American empire, the Spanish Netherlands, Milan, Naples, Sicily and Sardinia – to Philip, Duke of Anjou, a grandson of Louis XIV, who accepted it for him. The Emperor Leopold I claimed it for his younger son, Archduke Charles. England and the Dutch at first recognised Philip V, but in February 1701 French troops replaced the Dutch garrisons in the barrier fortresses of the Spanish Netherlands, and Louis kept Philip’s right to the French throne. On 7 September 1701 the Emperor, England and the Dutch Republic formed the Grand Alliance at The Hague; they declared war in May 1702.
      - The fighting began in Italy, where Leopold wanted the Duchy of Milan, an imperial fief. In May 1701 Prince Eugene of Savoy led about 30,000 imperial troops over mountain tracks from Tyrol into the neutral Venetian lands, and on 9 July he drove a French force from Carpi on the Adige. On 1 September Marshal Villeroi attacked his entrenchments at Chiari and was thrown back with heavy losses. On the night of 31 January 1702 imperial soldiers got into Cremona through an old aqueduct and seized Villeroi, but Irish regiments in French service drove them out. In August Eugene fought Villeroi’s successor, the Duke of Vendôme, to a bloody draw at Luzzara, and by the end of 1702 the French had won back most of the lost ground.
    facts:
      - [Grand Alliance of The Hague, "7 September 1701: the Emperor, England and the Dutch Republic"]
      - [Battle of Chiari, "1 September 1701, imperial victory"]
      - [Raid on Cremona, "1 February 1702; Marshal Villeroi captured"]
    markers:
      - kind: battle
        side: at
        name: Battle of Carpi
        date: 9 July 1701
        text: The first battle of the war, a clash with part of Marshal Catinat’s army on the lower Adige. Catinat fell back westwards and was soon replaced by Villeroi.
        lonlat: [11.34, 45.14]
      - kind: battle
        side: at
        name: Battle of Chiari
        date: 1 September 1701
        text: Villeroi’s French, Spanish and Savoyard troops attacked Eugene’s entrenched infantry in front of the small fortress and lost several thousand men, against light imperial losses.
        lonlat: [9.933, 45.533]
      - kind: held
        side: fr
        name: Raid on Cremona
        date: 1 February 1702
        text: Imperial troops slipped into the town and seized Villeroi, but the Irish regiments of Dillon and Burke held the gate on the Po, and Eugene withdrew with his prisoner.
        lonlat: [10.033, 45.133]
      - kind: held
        side: fr
        name: Mantua
        date: 1701–1702
        text: Duke Ferdinando Carlo Gonzaga sided with France and let in a French garrison. Eugene blockaded the city until Vendôme relieved it in 1702.
        lonlat: [10.792, 45.156]
        lp: b
      - kind: battle
        name: Battle of Luzzara
        date: 15 August 1702
        text: Eugene attacked Vendôme’s army by the Po. The fighting went on until midnight; the imperials lost about 2,000 men and the French perhaps twice as many, but neither side gave way.
        lonlat: [10.683, 44.967]
    arrows:
      - side: at
        label: Eugene
        phase: 1
        via: [[11.04, 45.89], [11.3, 45.6], [11.4, 45.32], [11.34, 45.16]]
      - side: at
        phase: 2
        via: [[11.1, 45.25], [10.55, 45.42], [9.96, 45.52]]
  - title: Blenheim
    date: May 1702 – November 1704
    when: "1702-05-15"
    borders: "1704-11-07"
    countries: [de, nl, be, at, fr, gb]
    body:
      - In the Low Countries the Earl of Marlborough, who commanded the allied army there, took the fortresses of the Meuse – Venlo, Roermond and Liège – in the autumn of 1702, and Bonn in May 1703. Maximilian II Emanuel, Elector of Bavaria, sided with Louis XIV and seized the imperial city of Ulm in September 1702, as his brother, the Elector of Cologne, had already done. Marshal Villars crossed the Rhine and fought the Margrave of Baden at Friedlingen, and in 1703 he joined the Elector on the Danube, where they beat an imperial army at Höchstädt on 20 September. With Hungary in revolt under Francis II Rákóczi, Vienna seemed in danger. But in 1703 Portugal joined the Grand Alliance, and Savoy changed sides.
      - In May 1704 Marlborough marched an allied army some 400 km from near Cologne to the Danube in five weeks, keeping friend and foe guessing where he was going. On 2 July he stormed the Schellenberg above Donauwörth, and his troops burned villages across Bavaria to force the Elector to change sides. On 13 August, near the village of Blindheim, Marlborough and Prince Eugene attacked the armies of the Elector and Marshals Tallard and Marsin. Marlborough broke the French centre, and some 10,000 French infantry trapped in Blindheim surrendered. Tallard was taken prisoner; the Franco-Bavarian army lost more than 30,000 men killed, wounded and captured, against some 12,000 allies. The Emperor occupied Bavaria until the peace.
    facts:
      - [Battle of Blenheim, "13 August 1704, allied victory"]
      - [Commanders, "Marlborough and Eugene; Tallard, Marsin and the Elector of Bavaria"]
      - [Treaty of Ilbersheim, "7 November 1704: Bavaria handed over to imperial administration"]
    markers:
      - kind: siege
        side: gb
        name: Liège
        date: October 1702
        text: Marlborough’s troops stormed the citadel on 23 October 1702, opening the Meuse to the allies.
        lonlat: [5.571, 50.64]
      - kind: siege
        side: gb
        name: Bonn
        date: May 1703
        text: The Elector of Cologne’s residence, held by a French garrison, surrendered on 15 May 1703 after a short siege.
        lonlat: [7.102, 50.735]
      - kind: battle
        side: fr
        name: Battle of Friedlingen
        date: 14 October 1702
        text: Villars attacked the army of Louis William of Baden as it fell back from the Rhine. Neither side won clearly, but Villars was made a marshal of France.
        lonlat: [7.611, 47.595]
      - kind: battle
        side: fr
        name: First Battle of Höchstädt
        date: 20 September 1703
        text: Villars and the Elector beat an imperial army under Count Limburg Stirum, on much of the ground where Blenheim was fought a year later.
        lonlat: [10.55, 48.6]
        lp: l
      - kind: battle
        side: gb
        name: Battle of the Schellenberg
        date: 2 July 1704
        text: The allies stormed the fortified hill above Donauwörth at heavy cost, winning a crossing of the Danube into Bavaria.
        lonlat: [10.79, 48.72]
      - kind: battle
        side: gb
        name: Battle of Blenheim
        date: 13 August 1704
        text: France’s first great defeat in the field for decades. It saved Vienna and knocked Bavaria out of the war.
        lonlat: [10.6, 48.645]
        lp: b
      - kind: siege
        side: at
        name: Landau
        date: September – November 1704
        text: Louis William of Baden besieged the fortress, which surrendered on 23 November 1704.
        lonlat: [8.117, 49.2]
    arrows:
      - side: gb
        label: Marlborough
        phase: 1
        via: [[6.57, 51.0], [7.6, 50.36], [8.65, 49.45], [10.75, 48.72]]
      - side: at
        label: Eugene
        phase: 2
        via: [[8.05, 48.78], [9.2, 48.76], [10.45, 48.64]]
      - side: fr
        label: Tallard
        phase: 2
        via: [[7.75, 48.58], [8.46, 48.06], [9.95, 48.4], [10.55, 48.63]]
    areas:
      - style: occupied
        side: at
        label: Bavaria under imperial occupation, 1704–1714
        atoms: [DE-BY~bav, DE-BY~oger~bav, DE-BY~bav~opf]
  - title: Gibraltar and Barcelona
    date: 1704–1706
    when: "1704-08-04"
    borders: "1706-10-01"
    countries: [es, gb, nl, pt, fr, at]
    body:
      - Portugal joined the Grand Alliance in 1703, and in March 1704 Archduke Charles, proclaimed Charles III of Spain, landed at Lisbon. In May an Anglo-Dutch fleet under Admiral Sir George Rooke, carrying Prince George of Hesse-Darmstadt, a former viceroy of Catalonia, failed to raise Barcelona for Charles. Rooke then turned on Gibraltar. After a heavy bombardment, English and Dutch marines and sailors stormed the town, and on 4 August 1704 its governor surrendered his small garrison; most of the townspeople left. On 24 August the French fleet from Toulon fought Rooke off Málaga in the largest sea battle of the war. Neither side lost a ship, but the French battle fleet did not put to sea in strength again during the war, and a Franco-Spanish siege of Gibraltar by land was given up in April 1705.
      - In 1705 the allies turned to the lands of the Crown of Aragon, where many feared that a Bourbon king would govern them as the kings of France governed their provinces. An allied army under the Earl of Peterborough landed near Barcelona in August, stormed the hill fort of Montjuïc on 14 September, where Prince George was killed, and forced the city to surrender on 9 October. Catalonia and Valencia, and in 1706 Aragon and Mallorca, accepted Charles III. In April 1706 Philip V besieged Barcelona, but when an English fleet arrived with reinforcements he abandoned his guns and retreated into France. An allied army from Portugal under the Earl of Galway and the Marquis of Minas then marched on Madrid and entered it in June, but Castile rose for Philip, and by the autumn the allies had fallen back to Valencia.
    facts:
      - [Capture of Gibraltar, "4 August 1704"]
      - [Battle of Málaga, "24 August 1704, indecisive"]
      - [Barcelona taken by the allies, "9 October 1705"]
    markers:
      - kind: taken
        side: gb
        name: Gibraltar
        date: 4 August 1704
        text: Taken in the name of Charles III after a bombardment by Rooke’s fleet. Most of the Spanish townspeople moved to nearby San Roque. A Franco-Spanish siege from October 1704 to April 1705 failed, and Britain kept Gibraltar at the peace.
        lonlat: [-5.353, 36.14]
      - kind: naval
        name: Battle of Málaga
        date: 24 August 1704
        text: Also called the Battle of Vélez-Málaga. About fifty ships of the line on each side fought all day; the French then returned to Toulon.
        lonlat: [-4.5, 36.45]
      - kind: siege
        side: gb
        name: Barcelona
        date: 1705–1706
        text: Taken by the allies in October 1705 after the storming of Montjuïc. Charles III made it his capital, and Philip V’s siege in April and May 1706 failed.
        lonlat: [2.17, 41.387]
      - kind: taken
        side: gb
        name: Madrid
        date: June 1706
        text: Galway’s and Minas’s army from Portugal held the capital for a few weeks. Castilians stayed loyal to Philip, and the allies withdrew in August.
        lonlat: [-3.703, 40.417]
    arrows:
      - side: gb
        label: Rooke
        phase: 1
        via: [[-9.4, 38.6], [-9.2, 36.95], [-6.6, 36.15], [-5.4, 36.12]]
      - side: gb
        label: Galway and Minas
        phase: 2
        via: [[-6.88, 39.72], [-6.53, 40.6], [-5.66, 40.97], [-3.75, 40.45]]
    areas:
      - style: occupied
        side: at
        label: Held for Charles III, 1706 (approximate)
        atoms: [ES-B, ES-GI, ES-L, ES-T, ES-V, ES-CS, ES-A, ES-Z, ES-HU, ES-TE, ES-PM]
  - title: Ramillies and Turin
    date: 1705–1706
    when: "1705"
    borders: "1706-10-01"
    countries: [be, nl, fr, it, at, gb, es]
    body:
      - The year 1705 settled little. The allies took Barcelona for Archduke Charles, proclaimed King Charles III of Spain, but Marlborough’s invasion of France along the Moselle came to nothing. In May 1706 Louis XIV ordered Marshal Villeroi to seek battle in the Spanish Netherlands. On 23 May his French, Spanish and Bavarian army of about 60,000 met Marlborough’s Dutch, British and Danish army of similar size at Ramillies, north of Namur. Marlborough moved troops from his right to his centre unseen behind a ridge, the Dutch and Danish cavalry broke through on the left, and Villeroi’s army fled. Within weeks Leuven, Brussels, Antwerp, Ghent and Bruges opened their gates and recognised Charles III, and Ostend, Menin and Ath fell to sieges.
      - In Italy the French had overrun most of Piedmont, and from June 1706 an army under the Duke of La Feuillade besieged Turin, the capital of Victor Amadeus II of Savoy. Prince Eugene marched an imperial army from the Adige along the south bank of the Po, outpacing the French under the Duke of Orléans, and joined the Savoyard cavalry near Turin. On 7 September they stormed the French siege lines and routed the besiegers. The garrison had held out for three months; on the night of 29 August the miner Pietro Micca had blown up a tunnel, and himself, to stop French grenadiers getting into the citadel. The French left northern Italy, and Milan passed to Austrian rule.
    facts:
      - [Battle of Ramillies, "23 May 1706, allied victory"]
      - [Battle of Turin, "7 September 1706, imperial and Savoyard victory"]
      - [Convention of Milan, "13 March 1707; the French evacuate northern Italy"]
    markers:
      - kind: battle
        side: gb
        name: Battle of Ramillies
        date: 23 May 1706
        text: Fought between the Mehaigne and the Petite Gette. Villeroi lost close to 20,000 men killed, wounded or captured, against some 3,600 allies.
        lonlat: [4.915, 50.636]
      - kind: taken
        side: gb
        name: Brussels
        date: May 1706
        text: The capital of the Spanish Netherlands opened its gates days after the battle and proclaimed Charles III. The provinces were then governed in his name by Britain and the Dutch.
        lonlat: [4.353, 50.847]
        lp: l
      - kind: taken
        side: gb
        name: Antwerp
        date: June 1706
        text: The great port surrendered without a siege.
        lonlat: [4.4, 51.218]
      - kind: battle
        side: fr
        name: Battle of Calcinato
        date: 19 April 1706
        text: Vendôme surprised and beat the imperial army in Eugene’s absence, before he was recalled to Flanders after Ramillies.
        lonlat: [10.417, 45.45]
      - kind: siege
        side: at
        name: Battle of Turin
        date: 7 September 1706
        text: Eugene and Victor Amadeus broke through the French lines, ending a siege that had begun in June. It decided the war in Italy.
        lonlat: [7.674, 45.071]
      - kind: battle
        side: fr
        name: Battle of Castiglione
        date: 9 September 1706
        text: Two days after Turin, a French force beat a Hessian corps of the imperial army near Mantua, too late to change anything.
        lonlat: [10.489, 45.392]
        lp: b
    arrows:
      - side: gb
        label: Marlborough
        phase: 1
        via: [[5.68, 50.85], [5.3, 50.74], [4.95, 50.65]]
      - side: fr
        label: Villeroi
        phase: 1
        via: [[4.7, 50.88], [4.92, 50.8], [4.9, 50.66]]
      - side: gb
        phase: 2
        via: [[4.85, 50.67], [4.42, 50.84], [3.78, 51.04]]
      - side: at
        label: Eugene
        phase: 2
        via: [[11.6, 45.0], [10.6, 44.72], [9.0, 44.9], [7.75, 44.98]]
    areas:
      - style: occupied
        side: gb
        label: Taken by the allies, 1702–1706
        atoms: [BE-BRU, BE-VBR, BE-VAN, BE-VOV, BE-VWV, BE-WBR, BE-VLI, BE-WLG]
      - style: occupied
        side: at
        label: Taken by the Emperor’s army, 1706–1707
        atoms: [IT-MI, IT-MB, IT-CO, IT-LC, IT-VA, IT-LO, IT-CR, IT-PV, IT-NO, IT-AL]
  - title: Oudenaarde and Lille
    date: 1707–1708
    when: "1707"
    borders: "1708-12-10"
    countries: [be, fr, es, it, nl, gb, at]
    body:
      - The year 1707 went badly for the allies. In Spain the Duke of Berwick crushed the allied army at Almansa on 25 April, and Philip V took back Valencia and Aragon; in Germany Villars broke through the Lines of Stollhofen and raided deep into Swabia; and an attack on Toulon by Eugene and the Duke of Savoy, supported by the British fleet, failed in August. In Italy, though, Austrian troops marched through the Papal States and took Naples from Philip V. In July 1708 a French army under the Duke of Burgundy, Louis XIV’s grandson, and Vendôme retook Ghent and Bruges, whose citizens had tired of allied rule.
      - Marlborough, joined by Eugene, caught the French crossing the Scheldt at Oudenaarde on 11 July 1708. The battle was a scramble in which units joined as they arrived. Burgundy and Vendôme quarrelled, much of the French army never fought, and by nightfall Dutch troops under Overkirk had almost surrounded the French right. The allies then besieged Lille, one of France’s richest cities and its strongest fortress, rebuilt by Vauban. Marshal Boufflers held out for 120 days, while a convoy of munitions from Ostend fought its way through at Wijnendale. The town surrendered on 22 October and the citadel on 10 December, and early in 1709 the allies retook Ghent and Bruges.
    facts:
      - [Battle of Oudenaarde, "11 July 1708, allied victory"]
      - [Siege of Lille, "12 August – 10 December 1708"]
      - [Battle of Almansa, "25 April 1707, Bourbon victory in Spain"]
    markers:
      - kind: taken
        side: fr
        name: Ghent and Bruges
        date: July 1708
        text: Townspeople let French troops into both cities by surprise, cutting the allies’ waterways to the sea.
        lonlat: [3.725, 51.054]
      - kind: battle
        side: gb
        name: Battle of Oudenaarde
        date: 11 July 1708
        text: Marlborough’s army force-marched to the Scheldt and attacked the French as they crossed it. The French lost about 15,000 men, many of them captured.
        lonlat: [3.433, 50.85]
      - kind: battle
        side: gb
        name: Battle of Wijnendale
        date: 28 September 1708
        text: A British-led escort under John Webb beat off a larger French force and brought a vital convoy from Ostend to the siege of Lille.
        lonlat: [3.066, 51.092]
        lp: l
      - kind: siege
        side: gb
        name: Siege of Lille
        date: 12 August – 10 December 1708
        text: The largest siege of the war. Boufflers surrendered the town in October and the citadel in December, with the honours of war.
        lonlat: [3.063, 50.637]
    arrows:
      - side: fr
        label: Burgundy and Vendôme
        phase: 1
        via: [[4.3, 50.72], [3.8, 50.98], [3.47, 50.87]]
      - side: gb
        label: Marlborough
        phase: 2
        via: [[4.25, 50.68], [3.83, 50.71], [3.47, 50.84]]
      - side: gb
        label: Convoy
        phase: 3
        via: [[2.92, 51.22], [3.07, 51.09], [3.06, 50.68]]
    areas:
      - style: occupied
        side: gb
        label: Held by the allies, end of 1708
        atoms: [BE-BRU, BE-VBR, BE-VAN, BE-VOV, BE-VWV, BE-WBR, BE-VLI, BE-WLG, FR-59~flandre]
  - title: Almansa and Villaviciosa
    date: 1707–1710
    when: "1707-04-25"
    borders: "1710-12-10"
    countries: [es, gb, pt, nl, fr, at, it]
    body:
      - On 25 April 1707 the Duke of Berwick, an illegitimate son of James II of England and a marshal of France, met the allied army of Galway, a French Huguenot in British service, and the Marquis of Minas at Almansa, on the road from Valencia to Madrid. Berwick’s Franco-Spanish army broke the Portuguese, British and Dutch regiments; the allies lost some 4,000 killed and wounded and thousands of prisoners. Valencia and Aragon returned to Philip V, and Lleida fell in the autumn. By the decrees of Nueva Planta of June 1707 Philip abolished the separate laws and institutions of Valencia and Aragon as punishment for their rebellion, and the town of Xàtiva, which had resisted, was burned. The allies held on in Catalonia, and in 1708 their fleet took Sardinia for Charles, while General James Stanhope captured Minorca and its harbour of Port Mahon.
      - In 1710 the allies tried once more. Under the Austrian general Guido Starhemberg and Stanhope they beat Philip at Almenar on 27 July and at Saragossa on 20 August, and Charles entered Madrid in September. Again the Castilians would not accept him. The city stayed sullen, guerrillas cut the roads, and a French army under the Duke of Vendôme came to join Philip. In December the allies retreated towards Catalonia in separate columns. On 8–9 December Vendôme trapped Stanhope’s British rearguard in the walled town of Brihuega and forced it to surrender, and then at Villaviciosa he fought Starhemberg in a bloody battle that both sides claimed. Starhemberg went on retreating, and only some 7,000 men reached Barcelona. Charles’s cause in Castile was finished.
    facts:
      - [Battle of Almansa, "25 April 1707, Bourbon victory"]
      - [Nueva Planta decrees, "1707: Valencia and Aragon lose their own laws"]
