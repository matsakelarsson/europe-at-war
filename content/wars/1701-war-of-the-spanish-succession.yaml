  - title: Malplaquet
    date: 1709
    when: "1709"
    borders: "1709-10-20"
    countries: [fr, be, nl, gb, at]
    body:
      - The winter of 1708–1709 was the coldest in Europe for centuries, and frost and a failed harvest brought famine to France. Louis XIV sought peace, and his envoys at The Hague accepted almost all of the allies’ demands. But the allies insisted that if Philip V would not give up Spain within two months, Louis must help drive his own grandson out. Louis refused and explained why in a public letter to his subjects. The allies took Tournai, whose citadel surrendered on 3 September after a grim underground war of mines, and Marshal Villars, now France’s chief commander, entrenched his army among the woods near Malplaquet to stop them besieging Mons.
      - On 11 September Marlborough and Eugene attacked Villars’s lines in the bloodiest battle of the war. Dutch infantry under the young Prince of Orange suffered terribly in repeated assaults on the French right, while the allies forced the French left back through the woods. Villars was badly wounded, and Boufflers withdrew the army in good order. The allies held the field and took Mons on 20 October, but they had lost about 21,000 men killed and wounded, perhaps twice the French losses. In Britain the cost turned many against the war, and in 1710 the Whig ministry gave way to a Tory one that wanted peace.
    facts:
      - [Battle of Malplaquet, "11 September 1709, allied victory at great cost"]
      - [Commanders, "Marlborough and Eugene; Villars and Boufflers"]
      - [Losses, "About 21,000 allied and 11,000 French killed and wounded (estimates vary)"]
    markers:
      - kind: event
        name: Peace talks at The Hague
        date: May – June 1709
        text: Louis XIV’s foreign minister, the Marquis de Torcy, came to negotiate in person. The preliminaries of 28 May failed over the demand that Louis help remove Philip V from Spain.
        lonlat: [4.31, 52.08]
      - kind: siege
        side: gb
        name: Tournai
        date: June – September 1709
        text: The town fell at the end of July and the citadel on 3 September, after weeks of fighting in the tunnels beneath it.
        lonlat: [3.388, 50.606]
      - kind: battle
        side: gb
        name: Battle of Malplaquet
        date: 11 September 1709
        text: The allies attacked the French entrenchments in the gap between two woods. The French lost the field, but the allies’ losses shocked Europe.
        lonlat: [3.876, 50.336]
        lp: b
      - kind: siege
        side: gb
        name: Mons
        date: September – October 1709
        text: The capital of Hainaut surrendered on 20 October, the allies’ last gain of the year.
        lonlat: [3.953, 50.455]
    arrows:
