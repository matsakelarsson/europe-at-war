id: war-of-the-spanish-succession
name: War of the Spanish Succession
start: "1701"
end: "1714-09-07"
tier: A
summary: A European war over the inheritance of Charles II of Spain, in which France and Bourbon Spain, with Bavaria, fought the Emperor, Britain, the Dutch Republic and their allies to decide whether Louis XIV’s grandson Philip V or the Habsburg Archduke Charles would rule the Spanish monarchy. Marlborough’s and Eugene’s victories drove the French from Germany, Italy and the Spanish Netherlands, but the peace of Utrecht, Rastatt and Baden in 1713–1714 left Philip V on the Spanish throne and gave Spain’s lands in Italy and the Low Countries to Austria.
countries: [fr, be, nl, lu, de, at, it, es, pt, gb]
sides:
  - id: fr
    name: France, Spain and Bavaria
    polities: [france, spain, bavaria, habsburg-netherlands, milan]
    ink: navy
    moves: French and Bourbon moves
    success: French and Bourbon success
  - id: gb
    name: Britain, the Dutch Republic and their allies
    polities: [england, scotland, united-kingdom, dutch-republic, hanover, prussia, portugal]
    ink: red
    moves: Moves by Marlborough and the Maritime Powers
    success: British and Dutch success
  - id: at
    name: The Emperor, the Empire and Savoy
    polities: [habsburg, hre, savoy]
    ink: purple
    moves: Imperial moves
    success: Imperial success
notes:
  - Dates are New Style (Gregorian). England and Scotland still used the Julian calendar, eleven days behind, so British sources of the time date Blenheim 2 August 1704.
  - England and Scotland joined as the Kingdom of Great Britain on 1 May 1707, during the war. Savoy fought on the French side until 1703 and then joined the allies, as did Portugal; Prussia, Hanover, Denmark and other German states supplied troops to the allied armies, many of them paid by Britain and the Dutch.
  - The war in Spain and Portugal, at sea, and in the colonies (in North America called Queen Anne’s War) is only outlined here. Blenheim is called the Second Battle of Höchstädt in German and French; Oudenaarde is often spelt Oudenarde in English.
