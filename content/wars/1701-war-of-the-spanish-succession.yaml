  - title: Utrecht and Rastatt
    date: 1713–1714
    when: "1713-04-11"
    borders: "1714-09-07"
    countries: [nl, de, ch, fr, es, gb, it, be, lu, at, pt]
    body:
      - The Peace of Utrecht was a set of treaties signed from April 1713 between France and Spain and the allies, except the Emperor. Philip V kept Spain and its empire but renounced his rights to the French throne. Britain kept Gibraltar and Minorca, taken in 1704 and 1708, and won Newfoundland, Acadia and Hudson Bay from France, and from Spain the asiento, the right to supply enslaved Africans to Spanish America. Victor Amadeus of Savoy received Sicily and a royal crown, and Prussia gained Upper Guelders and recognition of its kingship. France recognised the Protestant succession in Britain and promised to destroy Dunkirk’s fortifications.
      - The Emperor Charles VI fought on alone for another year, but in 1713 Villars took Landau and Freiburg. Villars and Eugene, old opponents, made peace at Rastatt on 7 March 1714, confirmed for the Empire at Baden in Switzerland on 7 September. Austria received the Spanish Netherlands, Milan, Naples and Sardinia; France kept Landau; and the Electors of Bavaria and Cologne got their lands back. Barcelona, which had fought on for Charles after the allied troops left Catalonia, fell to a Franco-Spanish army on 11 September 1714 after a siege of more than a year, and Philip V abolished the separate laws and institutions of the Crown of Aragon.
    facts:
      - [Peace of Utrecht, "11 April 1713 (France and the allies); 13 July 1713 (Spain and Britain)"]
      - [Treaty of Rastatt, "7 March 1714, France and the Emperor"]
      - [Treaty of Baden, "7 September 1714, France and the Empire"]
