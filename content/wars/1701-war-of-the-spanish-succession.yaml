  - title: The siege of Barcelona
    date: July 1713 – July 1715
    when: "1713-07-09"
    borders: "1714-09-11"
    countries: [es, fr, at, gb]
    body:
      - Under the peace the allied troops left Catalonia, and Charles VI, emperor since 1711, called his wife home from Barcelona. The Catalans were promised an amnesty, but not their own laws. In July 1713 the Junta de Braços, an assembly of the Catalan estates, voted to fight on alone to defend the country’s constitutions. A Bourbon army under the Duke of Popoli blockaded Barcelona from late July. The city’s defence was led by its chief councillor, Rafael Casanova, at the head of the Coronela, the citizen militia, and by the general Antonio de Villarroel. Catalan irregulars fought on in the countryside, and the castle of Cardona and the island of Mallorca also held out for Charles.
      - In July 1714 Louis XIV sent the Duke of Berwick with French troops and a siege train, and the trenches crept towards the walls. The final assault began at half past four in the morning of 11 September. The attackers broke through in several places and fought their way into the streets; Casanova and Villarroel were both wounded, and that day the defenders asked for terms. Cardona surrendered a week later, and Mallorca and Ibiza in July 1715. Philip V abolished Catalonia’s government and laws by the Nueva Planta decree of 1716, and much of Barcelona’s Ribera quarter was pulled down to build a citadel to hold the city. Catalans mark 11 September as their national day, the Diada.
    facts:
      - [Siege of Barcelona, "July 1713 – 11 September 1714"]
      - [Commanders, "Popoli, then Berwick; Villarroel and Casanova for Barcelona"]
      - [Nueva Planta decree for Catalonia, "16 January 1716"]
    markers:
      - kind: siege
        side: fr
        name: Barcelona
        date: 11 September 1714
        text: The Bourbon assault broke into the city after a siege of more than a year. Terms were agreed the next day, and Berwick’s troops took over the city.
        lonlat: [2.177, 41.385]
      - kind: taken
        side: fr
        name: Cardona
        date: 18 September 1714
        text: The mountain castle, the last Catalan stronghold on the mainland, surrendered a week after Barcelona.
        lonlat: [1.681, 41.914]
      - kind: taken
        side: fr
        name: Mallorca
        date: July 1715
        text: A Bourbon expedition under the Chevalier d’Asfeld landed in June 1715, and Palma surrendered in early July, ending the war in Spain.
        lonlat: [2.65, 39.57]
    arrows:
      - side: fr
        label: Berwick
        via: [[2.9, 42.69], [2.82, 41.98], [2.3, 41.5]]
    areas:
