id: camisard-revolt
name: Camisard revolt
start: "1702-07-24"
end: "1704"
tier: C
summary: A rising of the Protestants of the Cévennes in southern France against the persecution that followed Louis XIV’s revocation of the Edict of Nantes in 1685, which had made Protestant worship illegal. It began on 24 July 1702, when insurgents killed the abbé du Chayla, who had imprisoned and mistreated Protestants, at Le Pont-de-Montvert. Inspired by prophets and led by young commanders such as Jean Cavalier and Roland (Pierre Laporte), a few thousand Camisards fought a guerrilla war in the mountains and the plain around Nîmes, killing priests and burning churches, against royal troops that grew to many thousands. Marshal Montrevel answered with mass reprisals, and from the autumn of 1703 hundreds of villages and hamlets in the upper Cévennes were burned and their people driven out. Marshal Villars, sent in 1704, combined force with offers of amnesty; Cavalier made terms in May 1704 and later left France, and Roland was killed in August. Scattered resistance went on until about 1710.
