notes:
  - Also called the War of the Cévennes. The revolt coincided with the War of the Spanish Succession; France’s enemies hoped to exploit it, but little outside help reached the Camisards.
  - Protestants in France were given civil rights again by the Edict of Versailles (the Edict of Tolerance) in 1787.
