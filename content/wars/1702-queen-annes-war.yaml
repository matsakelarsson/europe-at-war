  - title: The Walker expedition
    date: 1711
    when: "1711-08-10"
    borders: "1711-09-02"
    countries: [ca, us, gb, fr]
    body:
      - "In 1711 the new Tory ministry in London sent the largest force yet seen in North America to take Quebec: seven regiments under Brigadier John Hill, five of them from Marlborough’s army in Flanders, and a fleet under Rear-Admiral Sir Hovenden Walker. Joined by about 1,500 New England provincials, some 7,500 soldiers and 6,000 sailors in nine warships and about 60 transports sailed from Boston on 10 August 1711 (30 July Old Style). At the same time Nicholson led a provincial army from Albany towards Montreal."
      - "Walker had no reliable pilots for the St. Lawrence. On the night of 2–3 September 1711 (22–23 August Old Style), in fog and a rising gale, the fleet was driven onto the reefs near Île aux Œufs on the north shore of the estuary. Seven transports and a storeship were lost, and about 890 people drowned, some 705 soldiers, 150 sailors and 35 women who had come with the regiments. A council of war abandoned the attack, and the fleet sailed home; Nicholson, camped near Lake George, turned back when he heard the news."
      - "In Quebec, which had prepared for a siege, the deliverance was celebrated as a miracle, and the church of Notre-Dame-de-la-Victoire in the Lower Town, named for the defeat of Phips’s attack in 1690, became Notre-Dame-des-Victoires. Britain and France were already negotiating peace, and there were no more great expeditions."
    facts:
      - [Fleet sails from Boston, "10 August 1711 (30 July Old Style)"]
      - [Wreck at Île aux Œufs, "2–3 September 1711 (22–23 August Old Style)"]
      - [Ships lost, "seven transports and a storeship"]
      - [Drowned, "about 890"]
