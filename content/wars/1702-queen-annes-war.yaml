  - title: Newfoundland
    date: 1705–1709
    when: "1705-01"
    borders: "1705-01-15"
    countries: [ca, fr, gb]
    body:
      - "On Newfoundland, English fishing settlements lined the east coast from Ferryland to Bonavista, while the French held Plaisance (Placentia) on the south coast, the base of their fishery. In the winter of 1704–1705 the governor of Plaisance, Daniel d’Auger de Subercase, led several hundred French soldiers, Canadians, privateers and Mi’kmaq warriors overland to St. John’s. They besieged Fort William for five weeks in January and February 1705 and burned the town but could not take the fort. They then destroyed the settlements of Conception Bay and Trinity Bay, though the people of Carbonear held out on their fortified island; Subercase put the damage at four million livres."
      - "Four years later Joseph de Monbeton de Brouillan de Saint-Ovide, with about 160 French, Canadians and Mi’kmaq, surprised St. John’s on 1 January 1709 (21 December 1708, Old Style), took both its forts and some 500 prisoners. The French could not hold it, destroyed the fortifications and left in the spring, and the English fishermen returned. A French attack on Fort Albany, the Hudson’s Bay Company’s one remaining post, on James Bay, failed the same year."
    facts:
      - [Siege of St. John’s, "January – February 1705"]
      - [Capture of St. John’s, "1 January 1709"]
      - [Prisoners taken, "about 500"]
