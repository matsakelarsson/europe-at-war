id: queen-annes-war
name: Queen Anne’s War
start: "1702-05"
end: "1713-07"
tier: A
summary: "The North American part of the War of the Spanish Succession, fought between England (Great Britain from 1707) and its colonies on one side and France, Spain and their colonies on the other, each with Native allies who fought for their own reasons. In the south, Governor James Moore of Carolina burned the town of Saint Augustine in 1702 but could not take its stone fort; in 1704 he and some 1,000 Muscogee (Creek) warriors destroyed the Apalachee missions of Spanish Florida and carried thousands of people into slavery, and a French and Spanish attack on Charles Town in 1706 was beaten off. In the north, French officers and Wabanaki, Kahnawake Mohawk and Wendat warriors raided the New England frontier, most famously at Deerfield in 1704, and the French twice ravaged the English settlements of Newfoundland. New England failed twice to take Port Royal in 1707 but captured it in 1710, renaming it Annapolis Royal. A great British expedition against Quebec in 1711 ended when Admiral Walker’s fleet ran onto the reefs of the St. Lawrence, drowning about 890 people. At the Peace of Utrecht in 1713 France ceded Acadia (Nova Scotia), Newfoundland and Hudson Bay to Britain but kept Cape Breton, where it built Louisbourg; the Wabanaki made a separate peace at Portsmouth. The unclear borders of Acadia and the slave trade on the southern frontier led directly to the wars that followed."
countries: [us, ca, gb, fr, es]
sides:
  - id: brit
    name: England (Great Britain from 1707), its colonies and their Native allies (Muscogee, Yamasee and others in the south)
    polities: [british-america, england, united-kingdom, muscogee, yamasee]
    ink: red
    moves: English and British moves
    success: English and British success
  - id: fr
    name: France, New France and their Native allies (Wabanaki, Kahnawake Mohawk, Wendat, Mi’kmaq and others)
    polities: [new-france, france, wabanaki]
    ink: blue
    moves: French and allied moves
    success: French and allied success
  - id: es
    name: Spain and Spanish Florida, with the Apalachee and Timucua mission towns
    polities: [spain, new-spain]
    ink: gold
    moves: Spanish moves
    success: Spanish success
notes:
  - The English colonies used the Julian calendar (Old Style), eleven days behind the Gregorian calendar of France and Spain. All dates here are New Style; where the standard English accounts give an Old Style date, it follows in brackets. The year is counted from 1 January.
  - The war is named after Queen Anne, who reigned in England (Great Britain from 1707) from 1702 to 1714. In French it is often called the Guerre de la Conquête or the third intercolonial war; for the European war see the War of the Spanish Succession.
  - Much of what is known of the war’s Native side comes from French, English and Spanish accounts. The Wabanaki, Muscogee, Yamasee and Kahnawake Mohawk fought for their own aims (trade, captives, land, revenge and keeping the colonists in check) and changed or limited their alliances when it suited them; the Haudenosaunee Confederacy, at peace with New France since the Great Peace of Montreal in 1701, stayed mostly neutral.
  - Numbers killed, captured and enslaved in the raids on Florida rest on reports made by the raiders themselves and are uncertain; the ranges given here are those of modern historians.
