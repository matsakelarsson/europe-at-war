  - title: Utrecht and Portsmouth
    date: 1713–1714
    when: "1713-04-11"
    borders: "1713-04-12"
    countries: [ca, us, gb, fr]
    body:
      - "By the Treaty of Utrecht, signed by France and Britain on 11 April 1713, France ceded Acadia “with its ancient boundaries”, which Britain called Nova Scotia; Newfoundland, where the French kept the right to fish and dry their catch on the northern “French Shore”; and the lands of Hudson Bay, which went back to the Hudson’s Bay Company. France kept Île Royale (Cape Breton) and Île Saint-Jean (Prince Edward Island), moved the people of Plaisance to Cape Breton and began building the fortress of Louisbourg. France also recognised British sovereignty over the Haudenosaunee, a claim the Haudenosaunee did not accept, and the treaty left the borders of Acadia undefined: Britain claimed the land to the St. Lawrence, France only the peninsula."
      - "The Native nations were not party to the treaty. The Wabanaki made their own peace with New England at Portsmouth, New Hampshire, signed on 24 July 1713 (13 July Old Style). The English text declared them subjects of the Crown; the Wabanaki understood it as a peace that kept their lands. Most Acadians stayed in Nova Scotia under British rule but would not swear an unconditional oath of allegiance, a dispute that ended in their deportation in 1755. In the south, Carolina’s trade in Native captives went on and helped to bring on the Tuscarora and Yamasee wars."
    facts:
      - [Treaty of Utrecht, "11 April 1713"]
      - [Treaty of Portsmouth, "24 July 1713 (13 July Old Style)"]
      - [Ceded to Britain, "Acadia (Nova Scotia), Newfoundland, Hudson Bay"]
      - [Kept by France, "Île Royale and Île Saint-Jean"]
