  - title: Deerfield and Church’s raid on Acadia
    date: 1704
    when: "1704-03-11"
    borders: "1704-03-11"
    countries: [us, ca]
    body:
      - "Vaudreuil also sent war parties against the Connecticut valley. Jean-Baptiste Hertel de Rouville gathered 48 French soldiers and militiamen and some 200 warriors, Abenaki, Kanien’kehá:ka (Mohawk) from Kahnawake near Montreal, Wendat from Lorette and Pocumtuck, whose people had once lived where Deerfield now stood; 30 to 40 Pennacook joined them on the way. They marched some 300 miles through the winter from Chambly by Lake Champlain. Before dawn on 11 March 1704 (29 February Old Style, the date of the English accounts) they crossed the palisade of Deerfield on drifted snow. They killed 56 people, 44 villagers among them 25 children, as well as soldiers of the garrison and men who came to help from Hadley, and took 109 villagers captive. Vaudreuil reported 11 of the raiders killed."
      - "On the march north through the snow about 20 of the captives died or were killed when they could not keep up, among them Eunice Williams, wife of the minister John Williams. Of the survivors, about 60 were later ransomed and returned to New England, while 36 stayed in Canada or in Native communities. For Kahnawake and the Abenaki, captives could replace kin lost to war and disease, and many children were adopted. John Williams’s daughter Eunice, aged seven or eight, grew up at Kahnawake, married a Mohawk man and lived there as Marguerite Kanenstenhawi Arosen; her father’s account of their captivity, The Redeemed Captive Returning to Zion (1707), became one of the best-known captivity narratives."
      - "In revenge, Massachusetts sent Benjamin Church, a veteran of King Philip’s War, with about 500 men in ships against Acadia. In the summer of 1704 they raided Passamaquoddy, Grand-Pré on the Minas Basin, where they broke the Acadians’ dikes and burned houses, and Beaubassin at Chignecto, but a council of war decided not to attack the fort at Port Royal."
    facts:
      - [Raid on Deerfield, "11 March 1704 (29 February Old Style)"]
      - [Killed, "56"]
      - [Taken captive, "109 villagers, of whom 89 reached Canada"]
      - [Church’s expedition, "summer 1704, about 500 men"]
