steps:
  - title: Carolina against Saint Augustine
    date: 1702
    when: "1702-09"
    borders: "1702-11-10"
    countries: [us, es, gb]
    body:
      - "When Charles II of Spain died in 1700 and left his empire to Philip of Anjou, grandson of Louis XIV, England and the Dutch Republic went to war with France and Spain, and England declared war in May 1702. In North America the English colonies had many times the population of New France and Spanish Florida together, but the French had strong alliances with the Native nations of the interior. On the southern frontier the war joined an older struggle: Carolina’s traders, with their Muscogee (Creek), Yamasee and other allies, had for years raided the mission towns of Spanish Florida for captives to sell into slavery, and in 1702 Pierre Le Moyne d’Iberville and his brother Bienville founded Mobile as the base of French Louisiana, now allied with Spain."
      - "In the autumn of 1702 a Spanish-led force of Apalachee and other mission warriors under Francisco Romo de Uriza set out to strike the Muscogee towns trading with Carolina. Muscogee warriors, led by English traders, ambushed it at the Flint River and killed or captured about 500 of its men."
      - "Governor James Moore of Carolina then sailed against Saint Augustine with some 500 colonists and 300 to 600 Native allies, mostly Yamasee under Arratommakaw, with Tallapoosa and Alabama warriors, while his deputy Robert Daniell marched overland by Amelia Island. They entered the town unopposed on 10 November. Governor José de Zúñiga y la Cerda had gathered some 1,500 townspeople, his small garrison and the town’s cattle inside the Castillo de San Marcos, whose coquina walls Moore’s few light guns could not breach. While Daniell went to Jamaica for heavier guns, Moore burned the town and the Franciscan friary. When a relief fleet from Havana appeared at the end of December and landed troops, Moore burned his trapped ships and retreated overland on 30 December. He lost the governorship, and the cost of the failure caused riots in Charles Town."
    facts:
      - [Siege of Saint Augustine, "10 November – 30 December 1702"]
      - [Carolina force, "about 500 colonists and 300–600 Native allies"]
      - [Sheltered in the Castillo, "about 1,500 people"]
