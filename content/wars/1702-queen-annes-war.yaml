  - title: Wells to Casco
    date: August 1703
    when: "1703-08-21"
    borders: "1703-08-21"
    countries: [us, ca]
    body:
      - "In the north the Wabanaki, the Abenaki, Penobscot, Wolastoqiyik (Maliseet), Mi’kmaq and their neighbours, had fought New England through King William’s War and made peace in 1699. They had their own grievances: English settlement creeping along the coast and up the rivers onto their fishing and hunting grounds, and traders’ dishonesty. In early July 1703 (late June Old Style) Wabanaki leaders met Governor Joseph Dudley of Massachusetts at Casco and promised to stay at peace, but New France wanted the frontier at war, to keep the Wabanaki tied to the French alliance and New England on the defensive. The new governor of New France, Philippe de Rigaud de Vaudreuil, sent the officer Alexandre Leneuf de La Vallière de Beaubassin to lead them."
      - "On 21 August 1703 (10 August Old Style) Beaubassin, with a few Frenchmen and some 500 Wabanaki warriors under leaders such as Moxus, Wanongonet and Escumbuit, attacked the Maine settlements from Wells to Casco Bay. At Wells 39 people were killed or captured; Saco, Spurwink, Purpooduck and Black Point were raided, and the garrison of Winter Harbor surrendered. John March held the fort at Casco until a ship under Cyprian Southack relieved it on 30 August (19 August Old Style). Estimates of the colonists killed or captured range from about 150 to more than 300."
      - "Massachusetts answered by offering bounties for Native scalps and sending winter expeditions on snowshoes against the Wabanaki villages, most of which they found empty; in early 1705 a force under Winthrop Hilton burned the mission church at Norridgewock on the Kennebec. Raids and counter-raids went on along the frontier from Maine to the Connecticut River for the rest of the war, and families lived in fortified garrison houses."
    facts:
      - [Raids begin, "21 August 1703 (10 August Old Style)"]
      - [Force, "a few French and about 500 Wabanaki warriors"]
      - [Colonists killed or captured, "estimates from about 150 to over 300"]
