  - title: The Apalachee missions destroyed
    date: 1704–1707
    when: "1704-01-25"
    borders: "1704-01-25"
    countries: [us, es, gb, fr]
    body:
      - "In January 1704 Moore returned to Florida with about 50 Carolinians and some 1,000 Muscogee warriors, this time against Apalachee Province, the mission country around San Luis (today’s Tallahassee) that fed Saint Augustine. On 25 January they attacked the mission of Ayubale, where Father Ángel de Miranda and 26 men held the church compound for nine hours until their arrows ran out. Captain Juan Ruiz de Mexía came from San Luis with about 30 Spanish cavalry and 400 Apalachee warriors and was routed; more than 200 Apalachee were killed or captured and Mexía was taken prisoner. Moore’s force burned at least five missions, and some of the prisoners were tortured to death."
      - "Moore reported more than 1,000 people killed and over 4,000 captured as slaves. Historians doubt his figures but agree that the raid destroyed the province; the historian Alan Gallay estimates that 2,000 to 4,000 people were enslaved in 1704 alone. Some survivors were resettled under Carolina’s control on the Savannah River, where fewer than 650 remained in 1715, and others fled to Saint Augustine, Pensacola or French Mobile, where Bienville counted about 600 refugees. The Spanish burned and abandoned San Luis later in 1704, and further raids emptied the Timucua missions, leaving Spain little more than Saint Augustine and Pensacola."
      - "The French and Spanish struck back. In September 1706 a squadron of French privateers and Spanish troops under Captain Jacques Lefebvre sailed from Havana by way of Saint Augustine and demanded a ransom of 50,000 pesos from Charles Town. Governor Nathaniel Johnson refused, and the Carolina militia drove off the landing parties, taking a ship and many prisoners. In 1707 Muscogee warriors and Carolina traders attacked Pensacola twice and burned the town, but the Spanish fort held."
    facts:
      - [Battle of Ayubale, "25 January 1704"]
      - [Moore’s force, "about 50 Carolinians and 1,000 Muscogee warriors"]
      - [Enslaved in 1704, "about 2,000–4,000 (Gallay’s estimate)"]
      - [Attack on Charles Town, "September 1706, repulsed"]
