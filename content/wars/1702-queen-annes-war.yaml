  - title: Port Royal becomes Annapolis Royal
    date: 1707–1711
    when: "1710-10-05"
    borders: "1710-10-13"
    countries: [ca, us, gb, fr]
    body:
      - "In May 1707 Governor Dudley sent about 1,600 New England militia under Colonel John March against Port Royal, the capital of Acadia. Subercase, now governor of Acadia, held the fort with a small garrison, Acadian militia and Wabanaki warriors, and a second attempt in August also failed. The war of raids went on: in September 1708 (late August Old Style) a French and Native war party struck Haverhill in Massachusetts. In 1709 Samuel Vetch and Francis Nicholson planned to take all of Canada, with a provincial army marching on Montreal by Lake Champlain and a British fleet sailing for Quebec, but the fleet was sent to Portugal instead and the army, waiting at Wood Creek, broke up in sickness. To press for help, three Mohawk leaders and a Mahican went with Nicholson and Peter Schuyler to London in 1710, where they were received by Queen Anne as the “Four Indian Kings”."
      - "In September 1710 Nicholson sailed from Boston with about 2,000 men, 400 British marines and provincial regiments from Massachusetts, Connecticut, Rhode Island and New Hampshire, in 36 transports escorted by warships. Subercase, with fewer than 300 soldiers and militia and short of supplies, surrendered after a siege of a week, on 13 October 1710 (2 October, Old Style). His garrison marched out with the honours of war and was shipped to France, and the Acadians living near the fort were allowed to stay if they swore allegiance to the queen."
      - "The British renamed the town Annapolis Royal and made Samuel Vetch governor of Nova Scotia, but their rule reached little beyond the fort. In June 1711 Acadian militia and Wabanaki warriors ambushed a British detachment at Bloody Creek, up the river, and blockaded the fort for a time."
    facts:
      - [First siege of Port Royal, "June 1707"]
      - [Siege of Port Royal, "5–13 October 1710"]
      - [Nicholson’s force, "about 2,000 marines and provincials"]
      - [French garrison, "fewer than 300"]
