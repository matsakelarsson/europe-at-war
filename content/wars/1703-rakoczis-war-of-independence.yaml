  - title: Romhány and the Peace of Szatmár
    date: 1709–1711
    when: "1710-01-22"
    borders: "1711-05-01"
    countries: [hu, sk, ro, ua]
    body:
      - After Trencsén the imperial armies won back the country fortress by fortress, while plague spread across Hungary from 1708 to 1711 and killed far more people than the fighting. Many nobles made their peace with the emperor. At Romhány on 22 January 1710 Rákóczi’s last field army, with Polish, Swedish and French soldiers among its ranks, came close to beating an imperial force before being driven back. Érsekújvár surrendered that autumn, and the Kurucs were pushed back to the north-east, around Munkács and Szatmár.
      - Field Marshal János Pálffy, a loyalist Hungarian, opened talks with the Kuruc commander Sándor Károlyi in late 1710. Rákóczi rejected the terms and left for Poland on 21 February 1711 to seek help from Peter the Great, forbidding further talks, but Károlyi went on. Joseph I died in April, and his brother Charles VI wanted peace. Under the Peace of Szatmár, agreed on 29 April and signed on 1 May 1711, the Kurucs who swore loyalty received an amnesty and their estates, and the crown promised to respect the laws, diet and religious freedoms of Hungary and Transylvania. About 12,000 Kurucs laid down their flags at Majtény. Rákóczi refused the amnesty and died in exile at Rodosto on the Sea of Marmara in 1735.
    facts:
      - [Battle of Romhány, "22 January 1710, indecisive"]
      - [Peace of Szatmár, "29 April – 1 May 1711"]
      - [Surrender at Majtény, "1 May 1711, about 12,000 Kurucs"]
    markers:
      - kind: battle
        name: Battle of Romhány
        date: 22 January 1710
        text: The last major battle of the war. The Kurucs nearly won but were broken by an imperial counter-attack.
        lonlat: [19.25, 47.93]
      - kind: taken
        side: hb
        name: Érsekújvár
        date: September 1710
        text: The great fortress on the Nyitra surrendered to the imperial army, one of the last Kuruc strongholds in the west.
        lonlat: [18.158, 47.986]
        lp: l
      - kind: treaty
        name: Peace of Szatmár
        date: 29 April 1711
        text: Agreed between Pálffy and Károlyi with the emperor’s envoys. It granted an amnesty and confirmed the rights of the Hungarian and Transylvanian estates.
        lonlat: [22.89, 47.79]
      - kind: event
        side: hb
        name: Majtény
        date: 1 May 1711
        text: The remaining Kuruc army surrendered its flags and swore allegiance to the House of Habsburg on the fields outside the village.
        lonlat: [22.601, 47.688]
        lp: b
      - kind: taken
        side: hb
        name: Munkács
        date: June 1711
        text: The last Kuruc fortress surrendered several weeks after the peace.
        lonlat: [22.688, 48.432]
