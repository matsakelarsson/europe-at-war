  - title: Szécsény, Ónod and Trencsén
    date: 1705–1708
    when: "1705-09"
    borders: "1708-08-03"
    countries: [hu, sk, ro, at]
    body:
      - In September 1705 a diet near Szécsény formed the Confederated Estates of Hungary and elected Rákóczi their ruling prince, with a senate to share the conduct of the war and of peace talks. Emperor Joseph I, who had succeeded Leopold I in May, opened negotiations through English and Dutch mediators, but neither side would give up Transylvania. In November an imperial army under Ludwig Herbeville, with Danish auxiliaries and Serbian light cavalry, forced its way into Transylvania and beat Rákóczi at Zsibó, while in December János Bottyán’s Kurucs won at Szentgotthárd. Rákóczi paid his troops in copper coins that quickly lost their value.
      - Believing that only a clean break would win him foreign allies, Rákóczi had the diet at Ónod declare the House of Habsburg deposed from the Hungarian throne on 13 June 1707; two county delegates who argued for peace were cut down in the hall. Louis XIV still refused a treaty, and talks with Peter the Great of Russia came to nothing. In August 1708, marching north to reach Silesia, Rákóczi attacked Heister at Trencsén. His horse stumbled at a ditch and threw him unconscious, and his army, thinking him dead, broke and fled, losing about 3,000 killed and wounded and all its guns.
    facts:
      - [Diet of Szécsény, "September 1705"]
      - [Habsburgs deposed at Ónod, "13 June 1707"]
      - [Battle of Trencsén, "3 August 1708, imperial victory"]
    markers:
      - kind: event
        side: kr
        name: Szécsény
        date: September 1705
        text: Bishops, magnates and about a thousand lesser nobles formed the Confederation and elected Rákóczi its ruling prince.
        lonlat: [19.517, 48.083]
      - kind: battle
        side: hb
        name: Battle of Zsibó
        date: 15 November 1705
        text: Herbeville’s Austrian, Danish and Serbian troops turned the Kuruc flank and won back Transylvania for the emperor.
        lonlat: [23.25, 47.267]
      - kind: battle
        side: kr
        name: Szentgotthárd
        date: 13 December 1705
        text: János Bottyán’s Kurucs defeated an imperial force on the Styrian border.
        lonlat: [16.279, 46.949]
      - kind: event
        side: kr
        name: Ónod
        date: 13 June 1707
        text: The diet dethroned the Habsburgs. The killing of two delegates from Turóc county in the hall shocked many of Rákóczi’s supporters.
        lonlat: [20.917, 48.0]
      - kind: battle
        side: hb
        name: Battle of Trencsén
        date: 3 August 1708
        text: About 8,000 imperial and Serbian troops under Heister and János Pálffy routed a Kuruc army nearly twice their size. Many Kuruc leaders soon changed sides.
        lonlat: [18.011, 48.857]
    arrows:
      - side: hb
