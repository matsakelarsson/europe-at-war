id: rakoczis-war-of-independence
name: Rákóczi’s War of Independence
start: "1703-06"
end: "1711-05-01"
tier: B
summary: A rising of Hungarian nobles, soldiers and peasants, the Kurucs, led by Prince Francis II Rákóczi against Habsburg rule, fought while most imperial troops were away in the War of the Spanish Succession. At its height the rebels held most of Hungary and Transylvania and raided Austria and Moravia, but after their defeat at Trencsén in 1708 the rising collapsed, and the Peace of Szatmár in 1711 brought an amnesty and a promise to respect Hungary’s constitution.
countries: [hu, sk, ro, ua, at]
sides:
  - id: kr
    name: Kurucs (Confederated Estates of Hungary)
    polities: [kuruc-confederation]
    ink: orange
    moves: Kuruc moves
    success: Kuruc success
  - id: hb
    name: Habsburg Monarchy
    polities: [habsburg]
    ink: purple
    moves: Imperial moves
    success: Imperial success
notes:
  - Dates are New Style (Gregorian).
  - The rebels were called kuruc, a name first used for crusading peasants in 1514; Hungarians loyal to the Habsburgs were called labanc. Serbs of the southern border, Croats, the Transylvanian Saxons and Danish auxiliaries fought on the imperial side, while Slovaks, Rusyns, many Romanians, Polish volunteers and French officers served with the Kurucs.
  - Places are given their Hungarian names, as in most accounts; Trencsén is Trenčín and Nagyszombat Trnava in Slovakia, Munkács is Mukachevo in Ukraine, and Szatmár is Satu Mare, Zsibó Jibou and Gyulafehérvár Alba Iulia in Romania.
