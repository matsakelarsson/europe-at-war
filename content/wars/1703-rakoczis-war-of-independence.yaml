steps:
  - title: The Kurucs rise
    date: 1703–1704
    when: "1703-06-15"
    borders: "1704-12-26"
    countries: [hu, sk, ro, ua, at]
    body:
      - After the Ottomans were driven out of Hungary, Habsburg rule weighed heavily on the country. Taxes were raised, soldiers were quartered on the villages, Protestants were pressed to convert, and reconquered estates were returned only to owners who could prove their title and pay a tenth of their value. Francis II Rákóczi, the richest landowner in Hungary and grandson of princes of Transylvania, was arrested in 1700 for contacts with France, escaped from prison at Wiener Neustadt and fled to Poland. When the War of the Spanish Succession drew most imperial troops west, peasants and former soldiers of the north-east, led by Tamás Esze, rose in the spring of 1703 and asked Rákóczi to lead them.
      - On 15 June 1703 Rákóczi met Esze’s men at Lavochne, on the Polish side of the Carpathians, and led them into Hungary by the Verecke Pass; his friend Count Miklós Bercsényi brought French money and Polish mercenaries. Most nobles at first held back from what looked like a peasant revolt, but by late September the Kurucs held most of Hungary east and north of the Danube. In 1704 they crossed into Transdanubia and raided Lower Austria, Styria and Moravia, and Vienna threw up an earthwork, the Linienwall, against them. The Transylvanian diet elected Rákóczi prince on 8 July 1704. The allied victory at Blenheim in August ended hopes of joining the French and Bavarians, and on 26 December General Sigbert Heister beat the Kurucs at Nagyszombat.
    facts:
      - [Rákóczi crosses the Carpathians, "June 1703"]
      - [Elected Prince of Transylvania, "8 July 1704"]
      - [Battle of Nagyszombat, "26 December 1704, imperial victory"]
    markers:
