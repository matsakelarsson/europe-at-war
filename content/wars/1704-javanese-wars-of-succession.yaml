notes:
  - The two wars are counted with the war of 1746–1757, which partitioned Mataram, as the three Javanese Wars of Succession. Some historians date the first from 1703 or 1704 to 1705 or 1708, and the second from 1719 to 1722 or 1723.
  - Surapati’s own war against the Company, from 1686 to 1706, has its own entry.
