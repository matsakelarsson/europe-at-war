id: javanese-wars-of-succession
name: First and Second Javanese Wars of Succession
start: "1704"
end: "1723"
tier: C
summary: "Two wars over the throne of Mataram in which the Dutch East India Company (VOC) backed its own candidate and was paid in land and trade. When Amangkurat II died in 1703, his son Amangkurat III succeeded him, but the Company, suspecting him of sympathy for Surapati, the former slave who ruled a domain in East Java, recognised his uncle Pangeran Puger as king. Puger took the title Pakubuwono I in June 1704 and, in the First War of Succession (1704–1708), Company troops and Madurese allies put him in the capital, Kartasura, in August 1705. Amangkurat III fled east to Surapati, who was killed in 1706 when the allies stormed Bangil; the king held out in the hills of Malang until 1708, when he surrendered on a promise of lands and was exiled to Ceylon. In return Pakubuwono I confirmed the Company’s possession of Semarang and the Priangan highlands, ceded the eastern half of Madura and promised yearly deliveries of rice. The Second War of Succession (1719–1723) began when Pakubuwono I died and his son Amangkurat IV was challenged by his brothers, the princes Blitar and Purbaya, who attacked the palace in June 1719 and were driven off by the guns of the Company’s fort, and by his uncle Arya Mataram, who proclaimed himself king near Jepara and was put to death the same year. The rebels joined risings of the regents of Surabaya in East Java; Prince Blitar died in 1721, and in May–June 1723 the last rebel leaders surrendered. Most were exiled to Ceylon, while Purbaya was kept in Batavia as a possible replacement for the king. Each war left Mataram more dependent on the Company and the VOC deeper in Javanese politics; the third war followed in 1746."
