id: bulavin-rebellion
name: Bulavin Rebellion
start: "1707"
end: "1708"
tier: C
summary: A rising of Don Cossacks and runaway peasants against Peter the Great’s government, begun in October 1707 when the ataman Kondraty Bulavin and his men killed Prince Yury Dolgorukov, sent to hunt down fugitive serfs on the Don. In 1708 Bulavin took the Don Cossack capital, Cherkassk, but a government army under Yury’s brother Vasily burned Cossack settlements, Bulavin died that July when Cossacks turned against him, and some 2,000 of his followers fled to the Kuban.
