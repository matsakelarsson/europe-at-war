  - title: O’Reilly and Barceló at Algiers
    date: 1775–1786
    when: "1775-07"
    borders: "1786-06-14"
    countries: [dz, es, it, pt, mt]
    body:
      - Charles III wanted to restore Spain’s military reputation after the Seven Years’ War and to end the corsair raids. In June 1775 an armada of about 74 warships and 230 transports, with some 20,000 troops under the Irish-born general Alejandro O’Reilly and Tuscan ships under John Acton, sailed from Cartagena for Algiers. On 8 July the troops landed on the beach east of the city, but the boats put them ashore in the wrong place and most of their artillery sank in the wet sand. The defenders, led by Dey Mohammed ben Osman with the dey’s guard and the levies of the beys of Constantine, the West and Titteri, among them Kabyle and tribal fighters, fell back, drew the Spanish inland and ambushed them from cover. The Spanish were routed and fled to their boats, covered by the guns of Acton’s ships. Estimates of their dead run from 500 to 2,000, with about 2,000 wounded and many taken prisoner, against some 300 Algerian dead and wounded by Algerian figures.
      - In 1783 Admiral Antonio Barceló brought a fleet of gunboats and bomb vessels and bombarded Algiers from 4 to 8 August, damaging or destroying some 560 buildings but sinking only one Algerian gunboat. In July 1784 he returned with a larger allied fleet, with ships from Naples, Malta and Portugal, and bombarded the city from 12 to 21 July, again without bringing the dey to terms. Spain’s chief minister, the Count of Floridablanca, then turned to diplomacy, and on 14 June 1786 Spain and Algiers made peace. Spain paid a large sum and opened a consulate in Algiers, and the corsairs stopped attacking Spanish ships.
    facts:
      - [O’Reilly’s landing, "8 July 1775, Algerian victory"]
      - [Bombardments of Algiers, "4–8 August 1783 and 12–21 July 1784"]
      - [Peace between Spain and Algiers, "14 June 1786"]
