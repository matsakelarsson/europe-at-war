id: spanish-algerian-wars
name: Spain against Algiers
start: "1708"
end: "1792-03"
tier: B
summary: "Spain’s long struggle with the Regency of Algiers over Oran and Mers el-Kébir, its last fortresses on the Algerian coast, and over the corsair war at sea. During the War of the Spanish Succession the bey of the west, Mustapha Bouchelaghem, took Oran in January 1708 and Mers el-Kébir in April. In 1732 a Spanish armada of some 25,000 men under the Count (later Duke) of Montemar landed near Mers el-Kébir and recovered both, and for the next sixty years the Spanish garrison lived under constant blockade. Charles III tried to strike at Algiers itself: Alejandro O’Reilly’s landing of about 20,000 men in July 1775 was routed on the beaches, and Antonio Barceló’s fleets bombarded the city in 1783 and 1784 without forcing it to terms. Spain made peace with Algiers in 1786. After an earthquake ruined Oran in October 1790 and Bey Mohammed el-Kebir besieged it, Spain agreed to give up Oran and Mers el-Kébir, and handed them over in early 1792."
countries: [dz, es]
sides:
