notes:
  - Oran and Mers el-Kébir, about 7 km apart, were fortified towns with a few outlying forts, much smaller than today’s province of Oran; they had been Spanish since 1505–1509. Figures for the armies, and for the dead of 1775 in particular, vary widely between Spanish and Algerian sources.
  - Spain’s war with Algiers was part of the wider corsair war in the western Mediterranean, in which Algerian corsairs, licensed by the dey, took Spanish ships and coastal captives for ransom or sale, and Spanish and Maltese ships did the same to Muslim shipping. Europeans called the Algerian corsairs pirates; the regency treated them as privateers in a lawful war.
