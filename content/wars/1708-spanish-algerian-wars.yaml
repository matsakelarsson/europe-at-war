steps:
  - title: Oran lost and retaken
    date: 1707–1732
    when: "1708"
    borders: "1732-07-02"
    countries: [dz, es]
    body:
      - While Spain was torn by the War of the Spanish Succession, the dey of Algiers, Mohamed Bektash, sent about 8,500 soldiers and volunteers to join Mustapha Bouchelaghem, bey of the western province (the Beylik of the West) at Mascara, against Spanish Oran. The siege began on 1 November 1707 with the capture of the fort of San Felipe; Oran surrendered on 20 January 1708, and Mers el-Kébir, the fortified harbour to the west, fell on 4 April after heavy fighting. About 2,000 prisoners were taken. The victory was celebrated across the Muslim world, and Bouchelaghem moved his seat to Oran.
      - Philip V, secure on his throne, prepared to recover the fortresses, paying for the expedition partly with two million pesos that Blas de Lezo had forced Genoa to pay. A fleet of about 12 ships of the line and some 300 other vessels left Alicante on 16 June 1732 with about 23,000 infantry and 3,400 cavalry under the Count of Montemar, made a duke a few years later. It reached the coast on 27 June, landed the next day on the beach of Las Aguadas, west of Mers el-Kébir, and drove back an Algerian army of some 20,000. The garrison of Mers el-Kébir capitulated on terms, Bouchelaghem’s forces left Oran by night, and the Spanish entered it on 1 July. Montemar sailed home in August, leaving 6,000 men; Bouchelaghem’s counter-attacks in 1732 and 1733 failed, and the garrison held out under a blockade that lasted, with intervals, for sixty years.
    facts:
      - [Oran surrendered to Algiers, "20 January 1708"]
      - [Mers el-Kébir fell, "4 April 1708"]
      - [Spanish landing at Las Aguadas, "28 June 1732"]
      - [Spanish army of 1732, "about 26,000 men"]
