  - title: The earthquake and the cession of Oran
    date: 1790–1792
    when: "1790-10"
    borders: "1792-03-31"
    countries: [dz, es]
    body:
      - On the night of 9–10 October 1790 an earthquake, followed by a tsunami, destroyed most of Oran and killed an estimated 2,000–3,000 people, among them hundreds of soldiers of the garrison. The bey of the west, Mohammed el-Kebir, immediately besieged the ruined town with about 5,000 men; his first assaults were beaten off, but the Spanish could neither rebuild the defences nor see much value in keeping them.
      - In August or September 1791 Spain opened negotiations with Algiers and agreed to give up Oran and Mers el-Kébir. The Spanish garrison and the town’s Spanish inhabitants left at the end of February and in March 1792, many of them for Ceuta, and the bey took possession, ending almost three hundred years of Spanish rule. Mohammed el-Kebir made Oran the capital of the Beylik of the West, which it remained until the French took the city in 1831.
    facts:
      - [Oran earthquake, "night of 9–10 October 1790"]
      - [Spanish evacuation, "early 1792"]
      - [Handover to Algiers, "27 February – March 1792"]
