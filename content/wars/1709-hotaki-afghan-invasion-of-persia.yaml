steps:
  - title: Revolt in Kandahar
    date: 1709–1717
    when: "1709-04-21"
    borders: "1717"
    countries: [af, ir]
    body:
      - By 1700 Safavid Persia was in decline under the pious and indecisive Shah Sultan Husayn. Kandahar, on the eastern frontier, was governed for him by the Georgian prince George XI of Kartli, known in Persia as Gurgin Khan, whose harsh rule and Shi‘i officials were resented by the Sunni Ghilzai Pashtuns. Mirwais, chief of the Hotaki clan, was sent to Isfahan as a prisoner but won the shah’s trust and returned. On 21 April 1709, while most of Gurgin Khan’s Georgian troops were away, Mirwais and his followers killed him at a feast outside the city and seized Kandahar.
      - The Persian court first tried to negotiate, then sent army after army. The largest, said to number 42,000 under Gurgin Khan’s nephew Khusraw Khan, beat Mirwais near Girishk on the Helmand and besieged Kandahar in 1711, but the Afghans cut its supplies; in the retreat that autumn Khusraw Khan was killed and his army destroyed. Later expeditions fell apart for lack of money. Mirwais ruled Kandahar as an independent prince until his death in November 1715. In 1716–1717 the Abdali Afghans of Herat also threw off Persian rule. Mirwais’s brother Abdul Aziz wanted to make peace with Persia, and in 1717 Mirwais’s son Mahmud killed him and took power.
    facts:
      - [Gurgin Khan killed, "21 April 1709"]
      - [Khusraw Khan’s army destroyed, "1711"]
      - [Death of Mirwais, "November 1715"]
