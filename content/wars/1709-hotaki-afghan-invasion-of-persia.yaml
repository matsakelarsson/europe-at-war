  - title: Kerman and Gulnabad
    date: 1719 – March 1722
    when: "1722-03-08"
    borders: "1722-03-08"
    countries: [ir, af]
    body:
      - Mahmud, still in his early twenties, began raiding Persia. His first attack on Kerman, across the deserts of Sistan, was beaten off in 1719–1720; he then defeated the Abdalis of Herat in 1720. In October 1721 he returned with about 10,000–18,000 men, took the town of Kerman but not its citadel, and in early 1722 failed again before Yazd. Rather than give up, he struck straight for Isfahan.
      - Sultan Husayn’s court was divided, and his best commanders had been dismissed. An army of 42,000–50,000, with artillery, met the Afghans at Gulnabad, some 20 km east of Isfahan, on 8 March 1722. The Persian right wing drove back the Afghans, but the left was routed, the Afghan camel-mounted swivel guns (zamburaks) broke up the Persian centre, and the gunners were cut down beside their cannon. Between 5,000 and 15,000 Persians were killed, and the survivors fled to Isfahan.
    facts:
      - [Battle of Gulnabad, "8 March 1722, Afghan victory"]
      - [Safavid army, "42,000–50,000"]
      - [Afghan army, "10,000–18,000"]
