  - title: The siege of Isfahan
    date: March – October 1722
    when: "1722-10-23"
    borders: "1722-10-25"
    countries: [ir]
    body:
      - Mahmud had no siege guns, so he blockaded the great city, which may have had half a million inhabitants. He occupied the royal gardens at Farahabad and the Armenian suburb of New Julfa, which had to pay a large ransom, and gradually cut off the roads. Attempts to relieve the city came to nothing; Vakhtang VI of Kartli, angry at the court, refused to send his Georgians. In June the shah’s son Tahmasp escaped through the lines with about 600 men to raise an army, but achieved little.
      - By the summer the city was starving. People ate horses, dogs and leather, and the historian Michael Axworthy estimates that more than 80,000 died of hunger, disease and fighting. On 23 October 1722 Sultan Husayn rode out to the Afghan camp, abdicated and placed the royal plume on Mahmud’s turban. Mahmud entered Isfahan as shah on 25 October. At first he ruled with moderation, keeping many Persian officials in their posts.
    facts:
      - [Siege of Isfahan, "8 March – 23 October 1722"]
      - [Deaths in the city, "more than 80,000 (Axworthy)"]
      - [Sultan Husayn abdicates, "23 October 1722"]
    markers:
      - kind: siege
        side: hot
        name: Isfahan
        date: 8 March – 23 October 1722
        text: Blockaded for seven months until famine forced the shah to surrender. Tens of thousands died.
        lonlat: [51.67, 32.65]
      - kind: event
        side: hot
