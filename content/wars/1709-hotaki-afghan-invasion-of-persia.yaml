notes:
  - Army sizes and death tolls in the Persian, Afghan and European accounts vary widely. For Gulnabad the Safavid army is given as 42,000–50,000 and the Afghan as 10,000–18,000; for the siege of Isfahan the historian Michael Axworthy gives more than 80,000 deaths from hunger, disease and fighting.
  - The Russian campaign of 1722–1723 on the Caspian coast is told in the story of the Russo-Persian War of 1722–1723.
