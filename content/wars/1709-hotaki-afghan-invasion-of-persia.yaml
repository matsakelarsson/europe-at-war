id: hotaki-afghan-invasion-of-persia
name: Hotaki Afghan invasion of Persia
start: "1709-04-21"
end: "1730"
tier: A
summary: The revolt of the Ghilzai Afghans of Kandahar against Safavid Persia and their conquest of its capital. In 1709 the Hotaki chief Mirwais killed the Persian governor of Kandahar and beat off every army sent against him. His son Mahmud invaded Persia, routed the Safavid army at Gulnabad in March 1722 and starved Isfahan into surrender after a seven-month siege in which tens of thousands died; Shah Sultan Husayn gave him the crown. Russia and the Ottoman Empire seized the north and west of the country, while the Safavid prince Tahmasp held out in the north. Mahmud’s cousin Ashraf beat an Ottoman army in 1726, but from 1729 Tahmasp’s general Nader drove the Afghans out of Persia in a few months, and Ashraf was killed in 1730.
