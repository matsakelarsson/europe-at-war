  - title: Nader and the fall of the Hotaki
    date: 1726–1730
    when: "1729-11-13"
    borders: "1730"
    countries: [ir, af]
    body:
      - In 1726 Tahmasp II won the support of Nader Qoli, an Afshar Turkmen chief who had made himself master of the country around Kalat and Abivard in northern Khorasan. In late 1726 Nader took Mashhad for Tahmasp, and in May 1729 he defeated the Abdali Afghans near Herat. Nader drilled his men in the use of muskets and field guns, and when Ashraf marched east against him, the two armies met at Mihmandust near Damghan on 29 September 1729. The Afghan cavalry charges broke against the Persian musket volleys and cannon, and some 10,000 Afghans are said to have been killed.
      - Ashraf fell back towards Isfahan and took a stand at Murche-Khort, about 55 km to the north, with Ottoman guns and gunners. On 13 November 1729 Nader broke his army again. Ashraf fled south with captured Safavid princesses and treasure, and Nader entered Isfahan on 16 November; Tahmasp followed in December. Nader’s troops then plundered the townspeople to pay the army. In January 1730 Nader routed Ashraf once more at Zarghan near Shiraz. Ashraf fled east towards Kandahar and was killed on the way in 1730, probably by Baluch tribesmen or his own followers. Afghan rule in Persia was over, though Mirwais’s son Husayn held Kandahar until Nader took it in 1738.
    facts:
      - [Battle of Damghan, "29 September – 5 October 1729, Persian victory"]
      - [Battle of Murche-Khort, "13 November 1729, Persian victory"]
      - [Isfahan retaken, "16 November 1729"]
    markers:
