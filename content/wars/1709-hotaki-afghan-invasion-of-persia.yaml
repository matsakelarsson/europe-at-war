  - title: Persia partitioned
    date: 1722–1727
    when: "1724-06"
    borders: "1727-10"
    countries: [ir, az, ge, am, ru]
    body:
      - Mahmud never ruled more than central and southern Persia. Tahmasp II held out in the north, and in January 1723 the people of Qazvin rose and drove out the Afghan garrison sent against him. Fearing a general revolt, Mahmud invited Persian nobles and officials to a gathering and had them killed, and executed up to 3,000 of the former royal guards. Meanwhile Peter the Great of Russia took Derbent in 1722 and Rasht and Baku in 1723, and the Ottomans invaded from the west, taking Tiflis in 1723, Hamadan and Erivan in 1724 and Tabriz in 1725. In June 1724 Russia and the Ottoman Empire agreed in the Treaty of Constantinople to divide north-western Persia between them.
      - In February 1725 Mahmud, now sick in body and mind, had the Safavid princes in his hands put to death, and in April he died or was killed and his cousin Ashraf took the throne. The Ottomans declared Ashraf a rebel, and in 1726 the governor of Baghdad, Ahmad Pasha, marched on Isfahan with some 70,000–80,000 men. Before the battle Ashraf had the former shah, Sultan Husayn, executed and sent his head to the Ottoman commander. In the battle that followed, late in 1726, Ashraf’s 12,000–17,000 Afghans defeated the much larger Ottoman army, many of whose Kurdish soldiers deserted. In the peace of Hamadan in October 1727 the Ottomans recognised Ashraf as shah, and he in turn recognised the Ottoman conquests in western Persia.
    facts:
      - [Treaty of Constantinople, "June 1724"]
      - [Ashraf takes power, "April 1725"]
      - [Peace of Hamadan, "October 1727"]
