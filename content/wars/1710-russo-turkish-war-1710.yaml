steps:
  - title: Into Moldavia
    date: November 1710 – July 1711
    when: "1710-11-20"
    borders: "1711-07-01"
    countries: [md, ro, ua, ru, tr]
    body:
      - After his defeat at Poltava in 1709, Charles XII of Sweden took refuge with the Ottomans at Bender on the Dniester. With the Crimean khan Devlet II Giray, he urged Sultan Ahmed III to fight Russia, and when Peter the Great kept demanding that Charles be sent away, the Ottomans declared war on 20 November 1710. Early in 1711 Tatars, Zaporozhian Cossacks under Pylyp Orlyk, the exiled successor of Hetman Mazepa, and Polish supporters of Stanisław Leszczyński raided right-bank Ukraine, but they failed to take Bila Tserkva.
      - Peter decided to carry the war to the Danube, hoping the sultan’s Orthodox subjects would rise. On 13 April 1711 at Lutsk he made a treaty with Dimitrie Cantemir, the prince of Moldavia, who promised troops and supplies in return for Russian protection. Constantin Brâncoveanu, prince of Wallachia, held back. In June the Russian army crossed the Dniester and joined Cantemir near Iași, but it was short of food. Field Marshal Boris Sheremetev failed to stop the grand vizier, Baltacı Mehmed Pasha, from crossing the Danube at Isaccea with a far larger Ottoman army.
    facts:
      - [Ottoman declaration of war, 20 November 1710]
      - [Treaty of Lutsk, "13 April 1711, Russia and Moldavia"]
    markers:
      - kind: event
