  - title: Trapped on the Pruth
    date: July 1711 – June 1713
    when: "1711-07-13"
    borders: "1711-07-23"
    countries: [md, ro, ru, tr]
    body:
      - Peter marched south along the right bank of the Pruth, while a detachment under General Carl Ewald von Rönne, joined by Wallachian troops whose commander Toma Cantacuzino had defied his prince, took the Ottoman port of Brăila on 14 July. On 18–19 July janissaries and Tatars crossed the Pruth and drove back the Russian advance guard, and Peter fell back into a fortified camp at Stănilești. The Ottomans surrounded it. Their assaults were beaten off with heavy losses, but their guns kept the Russians from the river, and the army, fewer than 40,000 Russians and a few thousand Moldavians, was soon short of water and food.
      - Peter sent his vice-chancellor, Pyotr Shafirov, to the grand vizier, ready to give up a great deal. Under the Treaty of the Pruth, signed on 23 July, Russia was to hand back Azov, raze Taganrog and other new forts in the south, keep out of Polish affairs and let Charles XII go home. Shafirov and Mikhail Sheremetev, the field marshal’s son, went to Constantinople as hostages, and to Charles’s fury the Russian army was allowed to march away. Peter delayed handing over Azov, the Ottomans declared war twice more, and the Treaty of Adrianople in June 1713 confirmed the terms. Cantemir went into exile in Russia.
    facts:
      - [Battle of Stănilești, "18–22 July 1711, Ottoman victory"]
      - [Treaty of the Pruth, "23 July 1711"]
      - [Russia gave up, "Azov, with Taganrog and other forts razed"]
    markers:
      - kind: taken
        side: ru
        name: Brăila
        date: 13–14 July 1711
        text: Rönne’s Russians and Cantacuzino’s Wallachians took the Ottoman port after a two-day siege, but had to give it up after the peace.
        lonlat: [27.96, 45.27]
      - kind: battle
        side: ot
        name: Battle of Stănilești
        date: 18–22 July 1711
        text: Surrounded in their camp, the Russians beat off the janissaries’ assaults but could not reach water. The peace was signed nearby on 23 July.
        lonlat: [28.18, 46.63]
      - kind: event
        side: ot
        name: Azov
        date: 1712
        text: Handed back to the Ottomans under the treaty, sixteen years after Peter had taken it.
        lonlat: [39.42, 47.11]
      - kind: event
        side: ot
        name: Taganrog
        date: 1712
        text: Peter’s naval base on the Sea of Azov was razed under the terms of the treaty.
        lonlat: [38.9, 47.21]
        lp: l
