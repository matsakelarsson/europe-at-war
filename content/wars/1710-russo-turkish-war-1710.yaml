notes:
  - Also called the Pruth River Campaign. Further Ottoman declarations of war in 1711–1713 led to no fighting, and some accounts date the war 1710–1713.
  - Dates are New Style (Gregorian). Russia used the Julian calendar, eleven days behind, so Russian sources date the Treaty of the Pruth 12 July 1711.
  - The war is also told briefly, from Sweden’s side, in the Great Northern War.
