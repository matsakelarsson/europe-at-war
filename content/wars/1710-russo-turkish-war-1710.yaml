id: russo-turkish-war-1710
name: Russo-Turkish War of 1710–1711
start: "1710-11-20"
end: "1711-07-23"
tier: B
summary: A war that grew out of the Great Northern War, after Charles XII of Sweden took refuge in the Ottoman Empire following his defeat at Poltava. Peter the Great marched into Moldavia in 1711, allied with its prince Dimitrie Cantemir, but was surrounded by a much larger Ottoman army on the Pruth and had to agree to hand back Azov, terms confirmed at Adrianople in 1713.
