steps:
  - title: The rising of September 1711
    date: September 1711
    when: "1711-09-22"
    borders: "1711-09-22"
    countries: [us]
    body:
      - "The Tuscarora lived in towns along the rivers of the North Carolina coastal plain, the northern towns on the Roanoke under Tom Blount and the southern ones around Catechna on Contentnea Creek under the leader the English called Hancock. For years they had complained of colonists taking their land, of traders who cheated them and of raiders who seized their people to sell as slaves in Virginia, South Carolina and the Caribbean. In 1710 some Tuscarora asked to move north to Pennsylvania, which would only accept them with a certificate of good conduct from North Carolina. The same year Christoph von Graffenried founded New Bern with Swiss and German Palatine settlers on land at the meeting of the Neuse and Trent rivers, and the colony, divided by the armed quarrel known as Cary’s Rebellion, was weak."
      - "In September 1711 Hancock’s men seized the colony’s surveyor-general John Lawson, who had laid out New Bern, and Graffenried as they travelled up the Neuse. A council at Catechna sentenced Lawson to death and spared Graffenried. From 22 September the southern Tuscarora and their allies, the Coree, Pamlico, Neuse, Bear River, Machapunga and Mattamuskeet, attacked the farms along the Neuse, Trent and Pamlico rivers and around Bath. Graffenried put the number killed in the first attacks at more than 130, and many more were taken captive; the survivors gathered in fortified houses. North Carolina appealed to Virginia and South Carolina for help. Tom Blount’s northern Tuscarora did not join the war, and Virginia’s governor Alexander Spotswood kept them neutral with talks and threats."
