  - title: Barnwell, Moore and Neoheroka
    date: 1712–1715
    when: "1712-01"
    borders: "1713-03-20"
    countries: [us]
    body:
      - "South Carolina sent Colonel John Barnwell north with about 30 colonists and some 500 Native warriors, most of them Yamasee, with Catawba and smaller Piedmont peoples; about 50 North Carolina militiamen joined them. In January 1712 they stormed the Tuscarora fort of Narhantes, after which many of the Native warriors went home with their captives. Barnwell then besieged Hancock’s fort at Catechna and in April agreed a truce under which the Tuscarora freed their prisoners. Soon after, some of Barnwell’s men seized Tuscarora people to sell as slaves, and the war began again."
      - "A second South Carolina force under Colonel James Moore Jr., son of the former governor, arrived in December 1712 with 33 colonists and nearly 1,000 Native warriors, among them Cherokee, Yamasee, Catawba and Apalachee. By then Tom Blount had sided with North Carolina in return for recognition as leader of all the Tuscarora, and his men captured Hancock, who was executed. In March 1713 Moore besieged Neoheroka, the largest Tuscarora fort, near today’s Snow Hill. After about three weeks his men set the fort on fire and stormed it, and it fell on 22 March. Hundreds of men, women and children died in the fire, some 170 were killed outside it, and about 400 were taken to South Carolina and sold into slavery, about 950 people in all."
      - "Most of the southern Tuscarora left North Carolina for the north, where the Oneida took them in, and in about 1722 the Haudenosaunee accepted them as the sixth nation of their confederacy. The Coree, Machapunga and others fought on in the swamps until a peace of 11 February 1715. In 1717–1718 the Tuscarora who stayed were given a reservation at Indian Woods on the Roanoke; the last of them moved to New York in 1802. The war opened the interior of North Carolina to colonists, and the Yamasee and Catawba who had fought in it rose against South Carolina in 1715."
