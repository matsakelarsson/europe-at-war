notes:
  - English dates are in the Julian calendar (Old Style) used in the British colonies until 1752, as the standard references give them; the Gregorian (New Style) date was eleven days later, so the attacks of 22 September 1711 began on 3 October New Style.
  - The numbers of colonists killed in 1711 and of Tuscarora killed and enslaved at Neoheroka come from colonial reports, above all those of Christoph von Graffenried and James Moore Jr., and are approximate. The Tuscarora’s own view of the war survives mainly in their oral history and in what colonial officials recorded of their complaints.
  - Fort Neoheroka is also spelled Nooherooka; its site near Snow Hill is on the National Register of Historic Places, and Tuscarora from New York and North Carolina marked its 300th anniversary there in 2013.
