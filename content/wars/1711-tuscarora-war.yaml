id: tuscarora-war
name: Tuscarora War
start: "1711-09-22"
end: "1715-02-11"
tier: B
summary: "A war in North Carolina between the colony and the southern Tuscarora and their allies. The Tuscarora, an Iroquoian-speaking people of the coastal plain, had lost land to colonists, most recently to the Swiss and German settlers of New Bern, and many of their people had been kidnapped and sold as slaves. In September 1711 the southern Tuscarora under Hancock, with the Coree, Pamlico, Neuse, Bear River, Machapunga and other peoples, executed the surveyor John Lawson and attacked the farms along the Neuse, Trent and Pamlico rivers, killing well over a hundred colonists, while the northern Tuscarora under Tom Blount stayed out of the war. South Carolina sent two armies made up mostly of Native allies: John Barnwell’s in 1712, mainly Yamasee, and James Moore Jr.’s in 1712–1713, with many Cherokee and Catawba. In March 1713 Moore stormed the Tuscarora fort of Neoheroka, where about 950 people were killed or captured and sold into slavery. Most of the southern Tuscarora moved north and were accepted into the Haudenosaunee Confederacy as its sixth nation in about 1722; those who stayed received a reservation on the Roanoke River."
countries: [us]
