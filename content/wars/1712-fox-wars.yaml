  - title: The siege on the Illinois prairie
    date: 1722–1730
    when: "1730-08"
    borders: "1730-09-08"
    countries: [us]
    body:
      - "The peace did not hold. Meskwaki war parties fought the Illinois, and in 1722 besieged them on Le Rocher (Starved Rock) above the Illinois River, after which many Illinois moved south towards the Mississippi. Among the Meskwaki a faction led by Kiala wanted war with the French and their allies, another under Ouashala wanted peace. A new peace made at La Baye (Green Bay) in 1726 broke down the following year, and the governor of New France, Charles de La Boische de Beauharnois, resolved to destroy the Meskwaki. In 1728 Constant Le Marchand de Lignery led an army of French and allied warriors up the Fox River, but the Meskwaki had gone, and he could only burn their villages and fields."
      - "As the Ho-Chunk, Kickapoo and Mascouten turned against them, the Meskwaki decided in 1730 to move east to the Seneca, who had offered them a home. In the summer they were caught on the prairie of central Illinois by Illinois, Kickapoo and Mascouten warriors and fortified themselves in a grove. French officers came with soldiers, militia and allies from three directions: Robert Groston de Saint-Ange from Fort de Chartres, Nicolas-Antoine Coulon de Villiers from the post on the St. Joseph River and Nicolas-Joseph de Noyelles from the Miami posts, with Potawatomi, Sauk, Miami, Wea and other warriors, about 1,400 in all by one account. After a siege of 23 days, in which the Meskwaki were reduced to eating leather, they tried to break out on a stormy night in early September. Their enemies caught them on the open prairie; French reports claimed some 200 warriors and 300 or more women and children killed, and hundreds were taken captive."
    facts:
      - [Siege of Starved Rock, "1722"]
      - [Lignery’s expedition, "1728"]
      - [Siege of the Meskwaki fort, "August – September 1730, 23 days"]
      - [Meskwaki killed, "by French reports about 200 warriors and 300 or more women and children"]
