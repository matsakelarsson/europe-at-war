  - title: Refuge with the Sauk
    date: 1731–1738
    when: "1733-09-16"
    borders: "1733-09-16"
    countries: [us, ca]
    body:
      - "In the winter of 1731–1732 a war party of Haudenosaunee from the mission villages near Montreal and Wendat fell on the surviving Meskwaki and killed many more. The last of them, about 40 warriors with women and children, came to La Baye to beg for peace. Coulon de Villiers took Kiala and three other leaders to Montreal, where Beauharnois ordered the survivors scattered among the mission villages and Kiala deported; in September 1734 he was shipped to Martinique, where he probably died enslaved on a plantation."
      - "The Sauk, neighbours of the Meskwaki at La Baye, took the survivors in and refused to give them up. On 16 September 1733 Coulon de Villiers tried to force his way into the Sauk fort and was killed with one of his sons, his son-in-law and other Frenchmen. The Sauk and Meskwaki moved west towards the Mississippi, and an expedition under Noyelles in 1734–1735 followed them as far as the Des Moines River without result. France’s allies, tired of the war and wary of a France that destroyed a whole nation, urged peace, and Beauharnois pardoned the Meskwaki in 1737–1738. Reduced to a few hundred people, they lived on alongside the Sauk; their descendants include today’s Meskwaki Nation (the Sac and Fox Tribe of the Mississippi in Iowa)."
    facts:
      - [Coulon de Villiers killed at La Baye, "16 September 1733"]
      - [Kiala deported to Martinique, "September 1734"]
      - [General pardon, "1737–1738"]
    markers:
