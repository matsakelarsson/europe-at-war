id: fox-wars
name: Fox Wars
start: "1712-05"
end: "1733"
tier: B
summary: "Two wars between the Meskwaki (Fox) and New France with its many Native allies in the western Great Lakes and the Illinois country. The Meskwaki held the Fox–Wisconsin waterway between Lake Michigan and the Mississippi and fought the French over trade and over French arms sales to their enemies. In 1712 a large Meskwaki and Mascouten community that had settled at Detroit was besieged by the French and their Odawa, Potawatomi, Wendat and Illinois allies; when it broke out it was destroyed, with about 1,000 people killed or enslaved. A French expedition under Louvigny forced a peace in 1716, but war resumed in the 1720s, and Governor Beauharnois set out to destroy the Meskwaki as a people. In 1730, as they tried to reach refuge with the Seneca, the Meskwaki were besieged on the prairie of Illinois and hundreds were killed or captured in their breakout. Survivors found shelter with the Sauk, who killed the French commander Coulon de Villiers at La Baye (Green Bay) in 1733. Beauharnois finally pardoned the Meskwaki in 1737–1738; reduced to a few hundred people, they lived on alongside the Sauk."
countries: [us, ca]
sides:
  - id: fox
    name: Meskwaki (Fox), with the Mascouten and Kickapoo in 1712 and the Sauk from 1733
    polities: [meskwaki]
    ink: orange
    moves: Meskwaki moves
    success: Meskwaki success
  - id: fr
    name: New France and its allies (Odawa, Potawatomi, Wendat, Illinois, Ojibwe, Miami and others)
    polities: [new-france, odawa, illinois-confederation, wendat]
    ink: blue
    moves: French and allied moves
    success: French and allied success
notes:
  - The Meskwaki call themselves Meskwakiaki, the Red Earth People; the French called them Renards (Foxes) after the name of one clan. Almost all written sources are French officers’ reports, which give round numbers for those killed and captured and do not agree with one another.
  - Historians differ on how to describe the war. Some call Beauharnois’s policy of destroying the Meskwaki as a people genocidal; others stress that France’s Native allies fought the Meskwaki for their own reasons, took many of them as captives for adoption or slavery, and in the end pressed the French to make peace. Brett Rushforth has shown how many Meskwaki captives were sold as slaves in Montreal and the French Caribbean.
  - The site of the Meskwaki fort of 1730 is disputed; most recent work places it near Arrowsmith, in McLean County, Illinois.
