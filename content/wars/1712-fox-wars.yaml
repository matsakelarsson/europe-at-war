steps:
  - title: Detroit, 1712
    date: 1712–1716
    when: "1712-05"
    borders: "1712-05-15"
    countries: [us, ca]
    body:
      - "The Meskwaki lived around the Fox River and Lake Winnebago in today’s Wisconsin, on the waterway that linked the Great Lakes with the Mississippi. They quarrelled with the French over trade, and above all over the guns the French sold to the Dakota and the Illinois, their enemies, and they demanded tolls from traders passing through their country. In 1710–1711, at the invitation of Antoine de La Mothe Cadillac, founder of Detroit, a large group of Meskwaki, with Mascouten and Kickapoo, moved to Detroit, alarming the Odawa, Potawatomi and Wendat who already lived around the fort."
      - "In May 1712, after the Odawa and Potawatomi attacked a Mascouten camp, the Meskwaki and Mascouten fortified their village beside the fort. Its commander, Jacques-Charles Renaud Dubuisson, with about 30 soldiers, called in his allies, and some 600 warriors, Odawa under Saguima, Potawatomi under Makisabé, Wendat, Illinois and others, besieged the village for nineteen days. The Meskwaki under their war leader Pemoussa and peace leader Lamyma escaped during a night storm and dug in at the head of the Detroit River, where after four more days of fighting they were overwhelmed. About 1,000 Meskwaki and Mascouten men, women and children were killed, many of them after being taken, and many more were carried off as captives and enslaved."
      - "Meskwaki war parties took revenge on the allied nations and closed the Fox–Wisconsin route to French traders. In 1716 Louis de La Porte de Louvigny led some 800 French and allied warriors, with two cannon and a mortar, against the main Meskwaki fort near Little Lake Butte des Morts on the Fox River. After a three-day siege the Meskwaki agreed to a peace, promising to return captives, to give captives of their own to replace the allies’ dead and to pay for the war in furs."
    facts:
      - [Siege at Detroit, "May 1712, nineteen days"]
      - [Meskwaki and Mascouten killed or enslaved, "about 1,000"]
      - [Louvigny’s expedition and peace, "1716"]
