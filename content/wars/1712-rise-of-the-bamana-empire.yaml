notes:
  - "The history of Ségou in the 18th century rests mainly on oral traditions, above all the Bamana epic of Ségou recorded by griots, and on a few later chronicles from Timbuktu and Walata. Dates are approximate, and the sources differ on the year of the Kong invasion (about 1739, or 1725) and of Biton’s accession (about 1712)."
  - "Bamana is the people’s own name; Bambara is the older form in French and English writing. Biton (Bitòn) was a title, “commander” of the ton; his personal name was Mamari."
