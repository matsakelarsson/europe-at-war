id: rise-of-the-bamana-empire
name: Rise of the Bamana Empire of Ségou
start: "1712"
end: "1755"
tier: C
summary: "The wars by which Mamari Coulibaly, known as Biton, made the Bamana (Bambara) kingdom of Ségou on the middle Niger the strongest state between the Senegal and the Niger bend. About 1712 he was chosen leader of the ton, the association of young men of Ségou, and turned it into a standing army: the tonjon, warriors who were in principle captives of the ton but in practice formed a military class, reinforced with runaway slaves and men taken in war or given as tribute. Biton fortified Ségou, kept a fleet of war canoes on the Niger and paid his men from the booty and tribute of yearly campaigns. His greatest danger came from the south, when Famagan Watara of the Kong Empire marched up from the Black Volta, besieged Ségou for about nine months and was driven off with the help of a Fulbe relief force; the sources date this invasion about 1739, and some give 1725. Biton fought a long war with the Massassi Coulibaly of Kaarta to the north-west, capturing their king Foulakoro outside Mourdiah about 1754 (he died in captivity), and imposed tribute on the Fulbe of Massina, the towns of the Marka and Somono and the country around Djenné and Bamako; he took Timbuktu, but held it only briefly. War captives were the main product of these campaigns: some were enrolled in the army or settled on the king’s farms, and many were sold north into the Saharan trade and west towards the Atlantic. After Biton’s death in 1755 his sons were killed or deposed by the tonjon, and after a decade of disorder one of the tonjon’s own commanders, Ngolo Diarra, took the throne in 1766 and founded the dynasty that ruled Ségou until Umar Tall took it in 1861."
