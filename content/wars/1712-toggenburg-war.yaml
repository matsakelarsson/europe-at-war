id: toggenburg-war
name: Toggenburg War (Second War of Villmergen)
start: "1712-04"
end: "1712-08-11"
tier: C
summary: The last religious war of the old Swiss Confederacy, which grew out of a long dispute between the Prince-Abbot of St Gall and his mostly Protestant subjects in the Toggenburg valley. In April 1712 Zürich and Bern took the Toggenburgers’ side against the abbot, and the five Catholic cantons of central Switzerland joined him. The Protestant armies occupied the Thurgau and the abbey’s lands, took Mellingen, won at Bremgarten on 26 May and then took Baden. A first peace agreed at Aarau in July was rejected by the inner cantons, and on 25 July the Bernese decisively beat the Catholic army at Villmergen, where more than 3,000 men died. The Peace of Aarau of 11 August 1712 took the county of Baden and the lower Freie Ämter from the Catholic cantons, joining Zürich’s and Bern’s territories, and ended the Catholic majority’s control of the common lordships with equal rights for both faiths.
countries: [ch]
sides:
  - id: ref
    name: Zürich and Bern
    ink: blue
  - id: cat
    name: The five Catholic cantons and the Abbot of St Gall
    ink: red
notes:
  - Also called the Zwölferkrieg. Geneva, Neuchâtel and Biel supported Zürich and Bern, and the Valais the Catholic side; Basel, Schaffhausen, Fribourg, Solothurn, Glarus and Appenzell stayed neutral.
  - The abbot regained the Toggenburg in the Peace of Baden in 1718. The Catholic cantons, angry at the loss of Baden, refused to meet there, and the Diet moved to Frauenfeld in 1713.
