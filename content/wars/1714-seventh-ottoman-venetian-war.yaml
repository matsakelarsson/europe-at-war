  - title: Corfu, Matapan and Passarowitz
    date: 1716 – July 1718
    when: "1716-07-08"
    borders: "1718-07-21"
    countries: [gr, al, hr, it, tr, mt, pt, rs]
    body:
      - In 1716 the Ottomans turned on the Ionian Islands. They occupied Lefkada and Butrint on the mainland opposite Corfu, and on 8 July landed an army of about 33,000 men on Corfu itself. Count Johann Matthias von der Schulenburg, a German soldier in Venetian service, defended the town with about 8,000 men and beat off several assaults. After a violent storm on 9 August, which the Corfiots credited to their patron saint, Spyridon, and with Austria now in the war and victorious at Petrovaradin, the Ottomans gave up the siege and had left the island by 20 August.
      - Austria had renewed its alliance with Venice in April 1716, drawing the main Ottoman effort to the Danube. At sea the Venetian fleet, joined by Portuguese, Maltese and papal ships, fought the Ottomans off Imbros in June 1717 and off Cape Matapan in July without decisive result. Venice took Preveza on the Epirote coast and Imotski in Dalmatia, where Sinj had held out against a siege in 1715. At Passarowitz on 21 July 1718 Venice kept the Ionian Islands, with Kythira, Preveza and its small Dalmatian gains, but gave up the Morea, Tinos, Aegina and the Cretan forts. It was the last war between the two powers.
    facts:
      - [Siege of Corfu, "8 July – 20 August 1716, Venetian success"]
      - [Battle of Matapan, "19 July 1717, indecisive"]
      - [Treaty of Passarowitz, 21 July 1718]
    markers:
