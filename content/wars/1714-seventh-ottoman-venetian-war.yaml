id: seventh-ottoman-venetian-war
name: Seventh Ottoman–Venetian War
start: "1714-12-09"
end: "1718-07-21"
tier: B
summary: The last war between Venice and the Ottoman Empire, in which the Ottomans retook the Peloponnese (the Morea), won by Venice in the 1680s, in a single campaign in 1715, along with Tinos, Aegina and the last Venetian forts on Crete. Venice held Corfu against a siege in 1716 and was saved from worse by Austria’s entry into the war, but at the Peace of Passarowitz in 1718 it kept only the Ionian Islands, Preveza and small gains in Dalmatia.
countries: [gr, it, hr, al, tr]
sides:
  - id: ven
    name: Venice and its allies
    polities: [venice, papal-states, malta, portugal]
    ink: red
    moves: Venetian moves
    success: Venetian success
  - id: tr
    name: Ottoman Empire
    polities: [ottoman]
    ink: teal
    moves: Ottoman moves
    success: Ottoman success
notes:
  - Also called the Second Morean War or, in Croatia, the War of Sinj. The papacy, the Knights of Malta, Portugal, Spain and Tuscany sent ships to help Venice in 1716–1717.
  - Austria’s war against the Ottomans in 1716–1718, with Petrovaradin and Belgrade, is told in the Austro-Turkish War of 1716–1718.
  - The size of the Ottoman army in 1715 comes from the journal of the French interpreter Benjamin Brue and may be exaggerated.
