        name: Battle of Matapan
        date: 19 July 1717
        text: Venetian, Portuguese and Maltese ships fought the Ottoman fleet in the Laconian Gulf; both sides withdrew.
        lonlat: [22.483, 36.389]
      - kind: taken
        side: ven
        name: Preveza
        date: 1717
        text: The Venetians took the town and kept it until the end of the Republic in 1797.
        lonlat: [20.752, 38.958]
      - kind: siege
        side: ven
        name: Sinj
        date: 1715
        text: The Venetian garrison and local people beat off the army of the pasha of Bosnia, a victory still celebrated each year in the Sinjska alka.
        lonlat: [16.638, 43.703]
      - kind: taken
        side: ven
        name: Imotski
        date: 1717
        text: Taken from the Ottomans and kept by Venice at the peace.
        lonlat: [17.217, 43.45]
        lp: l
      - kind: treaty
        name: Treaty of Passarowitz
        date: 21 July 1718
        text: Signed at Požarevac in Serbia, it ended both the Venetian and the Austrian wars with the Ottomans.
        lonlat: [21.183, 44.617]
