steps:
  - title: The Ottomans retake the Morea
    date: December 1714 – September 1715
    when: "1714-12-09"
    borders: "1715-09-13"
    countries: [gr, it, tr]
    body:
      - At Karlowitz in 1699 the Ottomans had ceded the Morea to Venice, and they were determined to win it back. Victory over Russia in 1711 and the distraction of the other European powers gave them their chance. The pretexts were the seizure of an Ottoman ship and the shelter Venice had given Danilo I, the prince-bishop of Montenegro, after a rising against the Ottomans, and on 9 December 1714 the Sultan declared war. In the spring the grand vizier, Silahdar Damat Ali Pasha, gathered an army of perhaps 70,000 men in Macedonia, while the fleet took Tinos and Aegina, the last Venetian islands in the Aegean.
      - Venice had only about 8,000 mercenaries in the Morea, and its Greek subjects, who resented Venetian rule and taxes, supplied the Ottomans. The army crossed the Isthmus of Corinth on 25 June 1715. Acrocorinth surrendered on terms, but Janissaries broke in and killed or enslaved most of the garrison and townspeople. Nafplio, the Venetian capital, fell on 20 July after a mine breached the Palamidi fort. Navarino and Koroni were abandoned and Methoni capitulated, as did Souda and Spinalonga, the last Venetian outposts on Crete. Within a hundred days the whole peninsula was Ottoman again.
    facts:
      - [Ottoman declaration of war, 9 December 1714]
      - [Fall of Nafplio, "20 July 1715, after a nine-day siege"]
      - [Commanders, "Silahdar Damat Ali Pasha; Captain-General Daniel Delfin"]
