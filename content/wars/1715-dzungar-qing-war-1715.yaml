  - title: Khoton Nor and Erdene Zuu
    date: 1729–1732
    when: "1731-07"
    borders: "1731-07-01"
    countries: [cn, mn]
    body:
      - Lobzang Danjin had fled to the Dzungars in 1724. When Tsewang Rabtan’s son and successor Galdan Tseren refused to hand him over, the Yongzheng emperor resumed the war in 1729. A northern army under Furdan advanced to Khovd in western Khalkha; a western army under Yue Zhongqi gathered at Barkol. The council the emperor set up to run the war in secret grew into the Grand Council, the inner cabinet of the later Qing.
      - In the summer of 1731 Furdan, misled by false reports that the Dzungars were weak and scattered, marched west from Khovd into the Altai. At Khoton Nor (Hetong po) the two Dzungar generals named Tseren Dondub surrounded his army of about 10,000 men; several of his senior officers were killed, and Chinese accounts say only about 2,000 men got back to Khovd. It was the worst Qing defeat of the Dzungar wars. Yue Zhongqi’s raid on Ürümqi the same year gained nothing lasting.
      - The Dzungars then invaded Khalkha. In August 1732 the Khalkha prince Tsering, a son-in-law of the Kangxi emperor, ambushed the smaller Tseren Dondub’s army near the monastery of Erdene Zuu on the Orkhon and inflicted heavy losses; many Dzungars drowned crossing the river. The Qing general Marsai failed to cut off their retreat and was executed for it. In the same year the Dzungars attacked Turfan, and Emin Khoja led its people east to resettle at Guazhou in Gansu.
    facts:
      - [Battle of Khoton Nor, "June–July 1731, Dzungar victory"]
      - [Battle of Erdene Zuu, "August 1732, Khalkha and Qing victory"]
      - [Turfanis resettled at Guazhou, "1732"]
