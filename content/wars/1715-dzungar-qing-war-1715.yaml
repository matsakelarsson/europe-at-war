notes:
  - "The Dzungar invasion of Tibet in 1717 and the Qing expedition of 1720, and the revolt of Lobzang Danjin in Kokonor (1723–1724), were part of the same contest; they have their own entries."
  - Dates are converted from the Chinese lunar calendar. Qing records are the main source for numbers, and figures for the battles of 1731 and 1732 differ widely between them and later accounts.
  - The fighting of these years against the Kazakhs, which the Dzungars waged at the same time, is told in the Kazakh–Dzungar wars.
