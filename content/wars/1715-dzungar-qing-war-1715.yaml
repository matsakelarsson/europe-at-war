steps:
  - title: Hami, Barkol and Turfan
    date: 1715–1722
    when: "1715"
    borders: "1715-06-01"
    countries: [cn]
    body:
      - Tsewang Rabtan had rebuilt the Dzungar Khanate after his uncle Galdan’s death and pushed its power west against the Kazakhs. Hami, whose ruler ʿAbd Allah Beg had gone over to the Qing in 1696–1697, lay between the two empires on the road from the Tarim oases to Gansu. In the spring of 1715 about 2,000 Dzungar horsemen attacked it. Its defenders held out until Qing troops came up, and the Dzungars withdrew.
      - The Kangxi emperor answered by moving armies to the frontier. A western army under Funingga was stationed at Barkol, north-west of Hami, and a northern army in Khalkha, and military farms were opened at Barkol and Hami to feed them. Two years later the Dzungars struck instead at Tibet. In 1720, while the main Qing effort went to Lhasa, Qing columns from Barkol advanced to Turfan and raided Dzungar lands; the Muslims of Turfan, led by Emin Khoja, rose against the Dzungars and went over to the Qing.
      - Kangxi died in December 1722. His son, the Yongzheng emperor, faced with the revolt of Lobzang Danjin in Kokonor in 1723, agreed to a truce with the Dzungars and pulled back much of the army from Barkol.
    facts:
      - [Dzungar attack on Hami, "spring 1715, repulsed"]
      - [Turfan goes over to the Qing, "1720"]
      - [Death of the Kangxi emperor, "20 December 1722"]
