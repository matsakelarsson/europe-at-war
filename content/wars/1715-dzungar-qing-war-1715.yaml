id: dzungar-qing-war-1715
name: Dzungar–Qing War (1715–1739)
start: "1715"
end: "1739"
tier: B
summary: "The second round of wars between the Dzungar Khanate and the Qing empire, fought on the oasis road east of the Tian Shan, in Khalkha and, in 1717–1720, in Tibet. It began in 1715 when Tsewang Rabtan’s Dzungars attacked Hami, a Qing dependency since 1696–1697. The Kangxi emperor stationed armies and military farms at Barkol and Hami, and in 1720 Qing troops reached Turfan, whose people, led by Emin Khoja, went over to the Qing. After a truce under the Yongzheng emperor the war flared up again in 1729, when the Dzungars refused to hand over the Khoshut rebel Lobzang Danjin. At Khoton Nor in the Altai, in July 1731, Galdan Tseren’s army destroyed the Qing northern army under Furdan, but in 1732 the Khalkha prince Tsering defeated a Dzungar invasion of Khalkha near Erdene Zuu. Talks from 1734 ended in an agreement in 1739 that fixed the line between the Dzungar and Khalkha pastures in the Altai and opened trade, and the frontier stayed at peace until the Dzungar civil wars of the 1740s and 1750s."
countries: [cn, mn]
