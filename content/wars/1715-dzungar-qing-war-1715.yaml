  - title: The Altai line
    date: 1733–1739
    when: "1739"
    borders: "1739-12-01"
    countries: [cn, mn]
    body:
      - Both sides were exhausted. Talks began in 1734 and went on after the Qianlong emperor came to the throne in 1735. They ended in 1739 with an agreement that fixed the line between the Khalkha and Dzungar pastures in the Altai mountains, with a belt between them that neither side’s herders were to enter, though scholars differ on exactly where the line ran.
      - The Dzungars were allowed to send trade missions to Beijing and to the border town of Suzhou (Jiuquan) and to make pilgrimages to Tibet under Qing supervision. The Qing kept Hami and Barkol; Turfan, abandoned by its people, stayed in Dzungar hands. The frontier was quiet until Galdan Tseren’s death in 1745 opened a succession struggle that ended with the Qing conquest of the khanate in 1755–1758.
    facts:
      - [Peace talks, "1734–1739"]
      - [Boundary, "the Altai mountains"]
    markers:
