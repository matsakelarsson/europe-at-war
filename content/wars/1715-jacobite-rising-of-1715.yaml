id: jacobite-rising-of-1715
name: Jacobite rising of 1715
start: "1715-09-06"
end: "1716-02-04"
tier: C
summary: A rising in Scotland and northern England to put James Francis Edward Stuart, son of the deposed James II and VII, on the British throne in place of the Hanoverian George I. The Earl of Mar raised James’s standard at Braemar on 6 September 1715 and soon held Perth and much of the north-east, but he moved slowly. A smaller force of Lowland Scots, Northumbrian and Lancashire Jacobites marched into England and surrendered at Preston on 14 November, the day after Mar’s larger army fought the Duke of Argyll to a draw at Sheriffmuir and then fell back. James himself landed at Peterhead in December, too late; with Dutch troops reinforcing Argyll, he and Mar sailed for France from Montrose on 4 February 1716. Two Jacobite earls were beheaded, and hundreds of prisoners were transported to the colonies.
