steps:
  - title: Pocotaligo, Good Friday 1715
    date: April 1715
    when: "1715-04-15"
    borders: "1715-04-15"
    countries: [us]
    body:
      - "By 1715 South Carolina’s trade reached across the Southeast. Traders exchanged guns, cloth and rum for deerskins and for Native captives, whom the colony sold as slaves at home and in the Caribbean, and the Yamasee near Port Royal, the Muscogee of the Ochese Creek towns and their neighbours owed them large debts. Traders seized the wives and children of debtors as slaves and beat and cheated those they dealt with, while planters’ cattle and rice fields spread onto Yamasee land. With the deer thinning and fewer captives to be had after the wars in Florida and North Carolina, the debts could not be paid, and rumours of a rising reached Charles Town in the spring."
      - "On 14 April 1715 the colony’s Indian agent Thomas Nairne and other officials came to the Yamasee town of Pocotaligo to hear their complaints. At dawn on Good Friday, 15 April, the Yamasee killed the traders in the town and took Nairne, who was put to death slowly over several days. Yamasee war parties fell on St. Bartholomew’s Parish and the plantations around Port Royal, killing more than a hundred settlers and enslaved people; the townspeople of Port Royal escaped on a ship in the harbour. Across the Southeast the Muscogee, Apalachee, Savannah River Shawnee, Catawba and others joined in, and about 90 of the colony’s 100 traders in the Native towns were killed in the first weeks."
      - "Refugees crowded into Charles Town. Governor Charles Craven called out the militia, armed some enslaved men and marched south with about 240 men; at the Yamasee town of Salkehatchie, at the end of April, he defeated a larger Yamasee force in a fight that cost each side some two dozen men."
    facts:
      - [Attack at Pocotaligo, "15 April 1715 (Good Friday, Old Style)"]
      - [Traders killed, "about 90 of 100 in the first weeks"]
      - [Craven’s militia at Salkehatchie, "about 240 men"]
