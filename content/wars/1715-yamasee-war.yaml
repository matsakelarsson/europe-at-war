  - title: The Cherokee alliance and the peace
    date: 1716–1717
    when: "1716-01-27"
    borders: "1716-01-27"
    countries: [us]
    body:
      - "Everything now depended on the Cherokee, the largest nation near Carolina, whose towns were divided between the Muscogee alliance and the Carolina trade. In the winter of 1715–1716 a Carolina force under Maurice Moore went to the Cherokee towns to win them over. On 27 January 1716 Cherokee at Tugaloo, the town of the Conjuror Charitey Hagey, killed a delegation of 11 or 12 Muscogee leaders who had come to bring the Cherokee into the war. What happened there is unclear; the Cherokee told the Carolinians that the delegates had come with a war party to ambush them. The Cherokee allied with Carolina, beginning a war with the Muscogee that lasted for decades, and the Ochese Creek Muscogee moved their towns west to the Chattahoochee River, further from Carolina’s reach."
      - "Carolina took the trade into public hands and made peace with the Muscogee towns in late 1717. Brims, the leader of Coweta, now steered a course between the British, the French, who built Fort Toulouse on the Coosa in 1717, and the Spanish, a policy of neutrality his successors followed for decades, and the war helped bind the Muscogee towns into a stronger confederacy. About 400 colonists had been killed, some seven per cent of South Carolina’s settlers. The Native slave trade, already shrinking, collapsed, and the colonists, blaming the Lords Proprietors for their weak defence, overthrew proprietary rule in 1719. In 1733 Georgia was founded on the land between the Savannah and the Altamaha, in part as a buffer against Spanish Florida."
    facts:
      - [Killing of the Muscogee delegates at Tugaloo, "27 January 1716"]
      - [Peace with the Muscogee, "late 1717"]
      - [Colonists killed, "about 7 per cent of South Carolina’s settlers"]
