  - title: Two fronts
    date: May 1715 – 1716
    when: "1715-06-13"
    borders: "1715-06-13"
    countries: [us]
    body:
      - "In the north the Catawba and their Piedmont neighbours raided the plantations of the Santee and Goose Creek. On 17 May a party of colonists under Thomas Barker was ambushed and 26 of them were killed, but on 13 June Captain George Chicken’s militia routed a Catawba force at the Ponds, near Goose Creek. Virginia and North Carolina sent about 300 men, and in the summer of 1715 the Catawba made peace and soon fought on Carolina’s side."
      - "In the south the militia and the scout boats of the inland waterways struck the Yamasee in their camps, killing 35 in a fight on Daufuskie Island. The Yamasee, who had lost perhaps a quarter of their people killed or enslaved in the first year, abandoned their towns and moved south to Spanish Florida, where they settled near Saint Augustine and raided Carolina for years to come. Others went to live among the Muscogee."
    facts:
      - [Battle of the Ponds, "13 June 1715"]
      - [Help from Virginia and North Carolina, "about 300 men"]
      - [Yamasee losses in the first year, "about a quarter of their people killed or enslaved"]
