notes:
  - English dates are in the Julian calendar (Old Style) used in the British colonies until 1752, as the standard references give them; the Gregorian (New Style) date was eleven days later. Good Friday, 15 April 1715, is an Old Style date.
  - The war’s causes are debated. Historians point to traders’ abuses and the debts owed to them, the enslavement of Native people, the decline of deer and of captives after the Tuscarora War, and land seized for cattle and rice; others stress that the Muscogee and other nations acted on their own strategy of breaking Carolina’s power over their trade. Accounts of the outbreak come from Carolinians, among them a trader who escaped Pocotaligo.
  - Some historians call the war the Yamasee and Creek War, as the Muscogee of the Ochese Creek towns were the strongest members of the alliance.
