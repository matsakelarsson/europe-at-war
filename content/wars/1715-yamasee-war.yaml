id: yamasee-war
name: Yamasee War
start: "1715-04-15"
end: "1717-11"
tier: B
summary: "A war between South Carolina and a broad alliance of the Native nations of the Southeast, led by the Yamasee and the Muscogee (Creek). Carolina’s trade in deerskins and in Native captives sold as slaves had left the Yamasee and their neighbours deep in debt to traders who abused them, enslaved their kin and let planters’ cattle onto their lands. On Good Friday, 15 April 1715, the Yamasee killed the colony’s Indian agent Thomas Nairne and the traders at Pocotaligo, and within weeks the Muscogee, Catawba, Apalachee and others had killed some 90 of the 100 traders in their towns and raided the settlements to within a few miles of Charles Town. Governor Charles Craven’s militia, with help from Virginia and North Carolina, drove the Yamasee south into Spanish Florida, and the Catawba made peace in 1715. The war turned when the Cherokee allied with Carolina and killed a delegation of Muscogee leaders at Tugaloo in January 1716; the Muscogee moved their towns west to the Chattahoochee and made peace in late 1717. About seven per cent of South Carolina’s colonists had been killed; the war hastened the end of the Native slave trade and of proprietary rule, and set the Muscogee on a course of balancing the British, French and Spanish."
countries: [us]
sides:
  - id: yam
    name: Yamasee, Muscogee (Creek), Catawba and allied nations (Apalachee, Savannah River Shawnee, Waxhaw, Santee and others)
    polities: [yamasee, muscogee, catawba]
    ink: olive
    moves: Yamasee and allied moves
    success: Yamasee and allied success
  - id: car
    name: South Carolina, with help from Virginia and North Carolina, and from 1716 the Cherokee
