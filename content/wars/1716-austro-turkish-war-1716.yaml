steps:
  - title: Petrovaradin and Temesvár
    date: April – October 1716
    when: "1716-08-05"
    borders: "1716-10-13"
    countries: [rs, ro, hu, at, tr]
    body:
      - In 1715 the Ottomans took the Morea from Venice. Emperor Charles VI, a guarantor of the Treaty of Karlowitz, allied with the Venetians in April 1716 and demanded that the conquests be returned, and the Ottomans declared war. Grand Vizier Silahdar Damat Ali Pasha led a large army from Belgrade across the Sava into Syrmia. On 2 August it routed an imperial cavalry detachment near Karlowitz and closed in on Petrovaradin, the fortress on the Danube that its builders called the Gibraltar of the Danube, where Prince Eugene of Savoy had gathered an army perhaps half the size of the Ottoman one in an entrenched camp.
      - On 5 August Eugene attacked out of his lines. The janissaries at first broke into the imperial centre, but Eugene’s cavalry turned the Ottoman flank, and the army fled back towards Belgrade, leaving its camp and some 250 guns. Damat Ali was mortally wounded; Ottoman losses are often put at about 20,000 men. Eugene then marched into the Banat and besieged Temesvár, the last Ottoman fortress in Hungary, which surrendered in mid-October. Its garrison was allowed to leave for Belgrade, and the Banat, Ottoman since 1552, came under Habsburg rule.
    facts:
      - [Battle of Petrovaradin, "5 August 1716, Habsburg victory"]
      - [Commanders, "Prince Eugene of Savoy; Grand Vizier Damat Ali Pasha"]
      - [Temesvár surrenders, "October 1716"]
    markers:
      - kind: battle
        side: ot
        name: Karlowitz
        date: 2 August 1716
        text: The Ottoman vanguard surprised and scattered an imperial cavalry detachment sent out to watch the advance, the first fight of the war.
        lonlat: [19.934, 45.203]
        lp: b
      - kind: battle
        side: hb
        name: Battle of Petrovaradin
        date: 5 August 1716
        text: Eugene’s army broke out of its entrenched camp under the fortress and routed the Ottoman army besieging it. The grand vizier died of his wounds.
        lonlat: [19.863, 45.252]
        lp: l
