  - title: Belgrade
    date: June – August 1717
    when: "1717-06-18"
    borders: "1717-08-21"
    countries: [rs, ro, at, hu, tr]
    body:
      - In June 1717 Eugene crossed the Danube below Belgrade, approaching the city from the east where the Ottomans did not expect him, and on 18 June closed the siege. His troops dug lines 16 kilometres long from the Danube to the Sava, facing both the fortress, held by about 30,000 men under Mustafa Pasha, and the open country behind, while a flotilla guarded the river. On 28 July the new grand vizier, Hacı Halil Pasha, arrived with a relief army of perhaps 140,000 and dug in on the heights behind the besiegers. Caught between two fires and weakened by dysentery and malaria, the imperial army dwindled.
      - On 14 August a mortar bomb fired from Zemun blew up the main powder store inside the fortress, killing some 3,000 defenders. Before dawn on 16 August, in thick fog, Eugene attacked the relief army with about 60,000 men. Some units lost their way, and the janissaries broke into a gap in the centre, but Eugene led his reserve cavalry into their flank and the Ottoman army fled, leaving its camp and guns. The garrison surrendered on 21 August and marched out with the Muslim townspeople. The victory made Eugene a hero across Europe and is remembered in the soldiers’ song “Prinz Eugen, der edle Ritter”.
    facts:
      - [Battle of Belgrade, "16 August 1717, Habsburg victory"]
      - [Belgrade surrenders, "21 August 1717"]
      - [Losses in the battle, "Ottoman 15,000–20,000; Habsburg under 6,000"]
    markers:
      - kind: event
        side: hb
        name: Danube crossing
        date: June 1717
        text: Eugene crossed below Belgrade near Pančevo and made his first camp on the heights at Višnjica, east of the city.
        lonlat: [20.64, 44.871]
      - kind: battle
        side: hb
        name: Battle of Belgrade
        date: 16 August 1717
        text: Eugene’s night attack in fog routed the grand vizier’s relief army on the heights east of the city. The grand vizier fled to Smederevo and then Niš.
        lonlat: [20.52, 44.79]
        lp: b
      - kind: taken
        side: hb
        name: Belgrade
        date: 21 August 1717
        text: The garrison, cut off from relief, surrendered in return for free passage. Belgrade passed to the Habsburgs after 196 years of Ottoman rule.
        lonlat: [20.45, 44.823]
        lp: l
    arrows:
