  - title: The Peace of Passarowitz
    date: June – July 1718
    when: "1718-07-21"
    borders: "1718-07-21"
    countries: [rs, ro, ba, hr, at, hu, tr]
    body:
      - Peace talks opened at Passarowitz, a small town on the Morava south-east of Belgrade, in June 1718, with British and Dutch envoys mediating. Both sides wanted an end. The Ottomans had lost two armies, and Charles VI needed his troops in Italy, where Spain had seized Sardinia in 1717 and landed in Sicily in July 1718. Venice wanted the Morea back but found no support. The treaty, signed on 21 July 1718, kept what each side held. The Habsburgs gained the Banat of Temesvár, lower Syrmia, Belgrade with most of the Ottoman province of Smederevo south of the Sava and Danube, a strip of northern Bosnia, and Oltenia, the part of Wallachia west of the Olt.
      - Venice gave up the Morea but kept the Ionian Islands and small gains in Dalmatia. A trade treaty signed the same day opened the Ottoman Empire to Habsburg merchants. The new lands were ruled directly from Vienna. Under its governor, Count Claudius Florimund Mercy, the Banat was drained, fortified and settled with German colonists, Serbs and Romanians; northern Serbia became the Kingdom of Serbia and Oltenia the Banat of Craiova. It was the furthest the Habsburgs had yet reached into the Balkans, but they lost Serbia and Oltenia again in 1739.
    facts:
      - [Treaty of Passarowitz, "21 July 1718"]
      - [Mediators, Great Britain and the Dutch Republic]
      - [Habsburg gains, "The Banat, lower Syrmia, northern Serbia, a strip of Bosnia, Oltenia"]
    markers:
      - kind: treaty
        name: Treaty of Passarowitz
        date: 21 July 1718
        text: Signed in tents outside the town between the Habsburg, Venetian and Ottoman envoys, on the basis that each side kept what it held.
        lonlat: [21.183, 44.617]
      - kind: event
        side: hb
        name: Craiova
        date: "1718"
        text: Seat of the Habsburg Banat of Craiova, as Oltenia was called under Austrian rule until 1739.
        lonlat: [23.817, 44.333]
      - kind: event
        side: hb
        name: Temesvár
        date: "1718"
        text: Capital of the Banat of Temeswar, a crown land run from Vienna under Count Mercy rather than by the Hungarian estates.
        lonlat: [21.23, 45.76]
    areas:
