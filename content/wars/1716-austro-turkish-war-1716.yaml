id: austro-turkish-war-1716
name: Austro-Turkish War of 1716–1718
start: "1716-04"
end: "1718-07-21"
tier: B
summary: A war in which the Habsburg Monarchy, allied with Venice, fought the Ottoman Empire after the Ottomans had retaken the Morea from the Venetians. Prince Eugene of Savoy won at Petrovaradin in 1716, took Temesvár the same year and Belgrade in 1717, and the Treaty of Passarowitz gave the Habsburgs the Banat, Belgrade with northern Serbia, and Oltenia, the greatest extent of their rule in the Balkans.
countries: [rs, ro, hu, at, tr]
sides:
  - id: hb
    name: Habsburg Monarchy
    polities: [habsburg]
    ink: purple
    moves: Habsburg moves
    success: Habsburg success
  - id: ot
    name: Ottoman Empire
    polities: [ottoman]
    ink: teal
    moves: Ottoman moves
    success: Ottoman success
notes:
  - Dates are New Style (Gregorian). Numbers of soldiers and dead come from contemporary reports and vary between sources, especially for the Ottoman armies.
  - Venice’s war with the Ottomans in Greece and the Ionian Sea, including the siege of Corfu in 1716, is told in the Seventh Ottoman–Venetian War.
  - Places are named as in most accounts of the war; Peterwardein (Pétervárad) is Petrovaradin, today part of Novi Sad, Temesvár is Timișoara, Karlowitz is Sremski Karlovci and Passarowitz is Požarevac.
