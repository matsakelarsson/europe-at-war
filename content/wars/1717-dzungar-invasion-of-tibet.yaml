notes:
  - Dates come from Tibetan, Chinese and missionary accounts (the Jesuit Ippolito Desideri was in Lhasa in 1717) and often differ by days or weeks. Numbers are uncertain; the Dzungar army is put at 6,000 to 7,000 men.
  - "The status of Tibet after 1720 is disputed. The People’s Republic of China regards the expedition as confirming Chinese sovereignty over Tibet. The Tibetan government in exile and many Tibetan and Western historians describe a protectorate, in which the Dalai Lama’s government ran its own affairs under the supervision of Qing residents (ambans, from 1727) and a small garrison, framed in Tibetan eyes as a relationship between a lama and a lay patron."
  - The Seventh Dalai Lama was called the Sixth by the Qing at first, since they had recognised Lhazang Khan’s candidate as the Sixth.
