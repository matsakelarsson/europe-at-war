  - title: Defeat on the Salween
    date: 1718
    when: "1718-09"
    borders: "1718-09-01"
    countries: [cn]
    body:
      - The Kangxi emperor sent a first relief force from Xining in 1718 under the officers Erentei and Sereng, a few thousand men by most accounts. It crossed the Kokonor highlands and reached the Nag Chu, the upper Salween, near Nagqu, where the Dzungars surrounded it. The Qing troops ate their horses and then their dead; Erentei was killed, and when the survivors left under an agreement in September 1718 they were massacred.
      - The disaster convinced the emperor that Tibet needed a far larger effort. He appointed his fourteenth son, Yinti, commander-in-chief with headquarters at Xining, and prepared armies in Kokonor, Sichuan and Yunnan. In Tibet the Dzungars lost support as their exactions and violence grew; in Tsang the noble Polhané Sönam Topgyé and in Ngari, in the far west, Kangchenné raised forces against them.
    facts:
      - [Battle of the Salween River, "September 1718, Dzungar victory"]
      - [Qing commander killed, "Erentei"]
    markers:
      - kind: battle
        side: dz
        name: Nagqu (Salween)
        date: September 1718
        text: The Qing relief force was surrounded on the upper Salween, starved, and destroyed after its surrender.
        lonlat: [92.051, 31.476]
      - kind: capital
        side: qing
        name: Xining
        date: 1718–1720
        text: Qing headquarters for the Tibetan expeditions, under the emperor’s fourteenth son Yinti from 1718.
        lonlat: [101.780, 36.622]
    arrows:
