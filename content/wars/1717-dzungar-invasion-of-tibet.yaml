id: dzungar-invasion-of-tibet
name: Dzungar invasion of Tibet
start: "1717"
end: "1720-10"
tier: B
summary: "In 1717 an army of the Dzungar Khanate under Tseren Dondub crossed the Kunlun and the uninhabited Changtang plateau from Yarkand, defeated Lhazang Khan, the Khoshut Mongol ruler of Tibet, and took Lhasa in late November; Lhazang Khan was killed on 3 December 1717. The Dzungars deposed the Dalai Lama Lhazang had installed, plundered Lhasa and its monasteries and persecuted the Nyingma school, and soon lost the support they had first found among the Gelug clergy. A Qing relief force from Xining was destroyed on the Salween river near Nagqu in September 1718. In 1720 two larger Qing armies, from Kokonor and from Sichuan, with Tibetan forces under Polhané and Kangchenné, drove the Dzungars out. The Qing brought the young Kelzang Gyatso from Kumbum and enthroned him as the Seventh Dalai Lama in the Potala, and left a garrison in Lhasa. The Qing date their rule in Tibet from this expedition; how far it made Tibet part of the Qing empire is disputed."
countries: [cn]
