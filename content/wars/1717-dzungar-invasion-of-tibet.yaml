  - title: The Qing expedition of 1720
    date: April – October 1720
    when: "1720-09"
    borders: "1720-10-01"
    countries: [cn]
    body:
      - In 1720 two Qing armies marched on Lhasa. The northern army under Yanxin, largely made up of Kokonor Khoshut and other Mongol troops, escorted the twelve-year-old Kelzang Gyatso from Kumbum and beat off Dzungar attacks north of Lhasa. The southern army under Galbi, with Yue Zhongqi in the van, marched from Sichuan by Dartsedo, Batang and Chamdo, gathering the submission of the chiefs of Kham on the way. Polhané and Kangchenné attacked the Dzungars from Tsang and Ngari.
      - Outnumbered and without supplies, Tseren Dondub retreated north across the Changtang; only a fraction of his men reached Dzungaria. Yue Zhongqi’s troops from Sichuan entered Lhasa first, and the northern army arrived with the Dalai Lama on 24 September 1720. Kelzang Gyatso was enthroned in the Potala that autumn, Taktsepa and other collaborators of the Dzungars were executed, and a garrison of about 3,000 men was left in Lhasa.
      - In 1721 the Qing replaced the office of regent with a council of ministers, the Kashag, led by Kangchenné, with Polhané among its members. Their rivalry led to the civil war of 1727–1728, after which the Qing stationed two residents (ambans) in Lhasa.
    facts:
      - [Qing armies, "from Kokonor (Yanxin) and Sichuan (Galbi, Yue Zhongqi)"]
      - [Dalai Lama arrives in Lhasa, "24 September 1720"]
      - [Kashag created, "1721"]
