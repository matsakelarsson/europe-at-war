steps:
  - title: Tseren Dondub takes Lhasa
    date: 1714 – December 1717
    when: "1717-11"
    borders: "1717-12-03"
    countries: [cn]
    body:
      - Lhazang Khan, the grandson of Güshi Khan and the last Khoshut khan to rule Tibet, had made many enemies. In 1705 he killed the regent Sangye Gyatso, in 1706 he deposed the Sixth Dalai Lama, Tsangyang Gyatso, who died on the way to exile, and he installed a monk of his own choice, Ngawang Yeshe Gyatso, in his place. Many Tibetans, the great Gelug monasteries and the Khoshut princes of Kokonor rejected him and recognised instead a boy born in Lithang in 1708, Kelzang Gyatso, whom the Qing took under their protection at Kumbum monastery in 1715.
      - Tsewang Rabtan, the Dzungar ruler, offered his daughter in marriage to Lhazang’s son, and then held him in the Ili valley. In 1717 his cousin Tseren Dondub led an army of 6,000 to 7,000 men from Yarkand over the Kunlun into north-western Tibet and across the Changtang plateau, a route no army was expected to take; many men and animals died on the way. They let it be known that they came to bring back the true Dalai Lama and expel the Khoshut.
      - The Dzungars appeared north of Lhasa in the summer and defeated Lhazang’s troops in the Damshung area. Lhazang withdrew behind the walls of Lhasa, which the Dzungars stormed at night in late November with help from inside. On 3 December 1717 Lhazang rode out from the Potala and was killed. The Dzungars deposed his Dalai Lama, put the Tibetan noble Taktsepa in charge as regent, plundered Lhasa and its monasteries, and destroyed the Nyingma monasteries of Mindrolling and Dorje Drak.
    facts:
      - [Dzungar army, "6,000 to 7,000 men under Tseren Dondub"]
      - [Lhasa stormed, "late November 1717"]
      - [Death of Lhazang Khan, "3 December 1717"]
