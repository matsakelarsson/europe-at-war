notes:
  - The Quadruple Alliance was agreed in London on 2 August 1718 by Britain, France and Austria; Savoy joined later in the year, and the Dutch Republic, whose name the alliance anticipated, in 1719.
  - Britain and Spain fought at sea from 1718, but Britain declared war only in December 1718 and France in January 1719. There was also minor fighting in North America, around Pensacola.
