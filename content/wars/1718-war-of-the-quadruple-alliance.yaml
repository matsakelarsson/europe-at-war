steps:
  - title: Sardinia, Sicily and Cape Passaro
    date: August 1717 – December 1718
    when: "1717-08-22"
    borders: "1718-12-17"
    countries: [es, it, gb, at]
    body:
      - Philip V’s queen, Elisabeth Farnese, and his minister, Cardinal Alberoni, wanted to win back the Italian lands Spain had lost at Utrecht. In August 1717 a Spanish expedition from Barcelona landed at Cagliari and by the end of October had taken all of Sardinia from the Emperor. On 1 July 1718 about 30,000 Spanish troops under the Marquis of Lede landed near Palermo, in the Kingdom of Sicily, which Victor Amadeus of Savoy had held since 1713. Palermo opened its gates, and the Spaniards overran most of the island and besieged the citadel of Messina. On 2 August Britain, France and Austria formed the Quadruple Alliance in London to force Spain to withdraw.
      - Admiral Sir George Byng had already sailed with a British fleet. On 11 August, off Cape Passaro at the south-eastern tip of Sicily, he caught the Spanish fleet strung out along the coast and attacked, although Britain and Spain were not at war. In a running fight the Spanish lost seven ships of the line and six frigates, and more were scuttled by their crews. The Spanish army was now cut off on the island. It took the citadel of Messina at the end of September and beat an Austrian force from Naples at Milazzo on 15 October, but the Austrians held on to a bridgehead there. Britain declared war on Spain in December, and France in January 1719.
    facts:
      - [Sardinia taken by Spain, "22 August – 30 October 1717"]
      - [Spanish landing in Sicily, "1 July 1718"]
      - [Battle of Cape Passaro, "11 August 1718, British victory"]
