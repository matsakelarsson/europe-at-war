id: war-of-the-quadruple-alliance
name: War of the Quadruple Alliance
start: "1718-07"
end: "1720-02-17"
tier: B
summary: A war in which Spain, led by Philip V’s minister Cardinal Giulio Alberoni and Queen Elisabeth Farnese, tried to win back the Italian lands lost at Utrecht, and Britain, France, Austria and Savoy, later joined by the Dutch Republic, combined to stop it. Spain had seized Austrian Sardinia in 1717, and in July 1718 it landed an army in Sicily, then ruled by Savoy; on 11 August Admiral George Byng destroyed the Spanish fleet off Cape Passaro. Austrian troops fought the Spaniards in Sicily, losing at Francavilla in June 1719 but taking Messina that autumn, while a French army under the Duke of Berwick invaded northern Spain and took Fuenterrabía and San Sebastián, and a British force raided Vigo. Spain also backed the Jacobite rising of 1719 in Scotland. Philip V dismissed Alberoni in December 1719 and accepted the allies’ terms in the Treaty of The Hague of 17 February 1720. Spain left Sicily and Sardinia; Austria took Sicily and Savoy received Sardinia in exchange, and the Emperor Charles VI gave up his claim to Spain, while Don Carlos, Elisabeth Farnese’s son, was promised the succession to Parma and Tuscany.
countries: [es, it, fr, gb, at]
sides:
  - id: es
    name: Spain
    polities: [spain]
    ink: gold
    moves: Spanish moves
    success: Spanish success
  - id: qa
    name: The Quadruple Alliance
    polities: [united-kingdom, france, habsburg, savoy, dutch-republic, naples, sicily]
    ink: red
    moves: Allied moves
    success: Allied success
notes:
  - The Quadruple Alliance was agreed in London on 2 August 1718 by Britain, France and Austria; Savoy joined later in the year, and the Dutch Republic, whose name the alliance anticipated, in 1719.
  - Britain and Spain fought at sea from 1718, but Britain declared war only in December 1718 and France in January 1719. There was also minor fighting in North America, around Pensacola.
