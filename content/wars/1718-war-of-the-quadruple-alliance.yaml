  - title: Francavilla, Messina and the exchange
    date: 1719 – August 1720
    when: "1719-01-09"
    borders: "1720-08-08"
    countries: [es, it, fr, gb, at]
    body:
      - In 1719 France attacked by land. The Duke of Berwick, who had won Almansa for Philip V twelve years before, led a French army into the Basque country and took Fuenterrabía in June and San Sebastián in August, and in October a British expedition seized Vigo. Spain backed a Jacobite landing in Scotland, which failed at Glen Shiel in June. In Sicily, an Austrian army of about 24,000 men under Count Mercy, ferried over by the British fleet, attacked the Spanish lines at Francavilla on 20 June and was beaten back with heavy losses. Mercy then besieged Messina, which fell in the autumn, but Lede’s army still held most of the island.
      - Philip V dismissed Alberoni in December 1719 and accepted the allies’ terms in the Treaty of The Hague of 17 February 1720. The Spanish troops left Sicily and Sardinia, and the two islands changed rulers as the allies had agreed in 1718. Austria took Sicily, which was reunited with Naples under the Emperor, and Victor Amadeus received Sardinia instead, taking the title King of Sardinia; the island was handed over to him on 8 August 1720. The Emperor Charles VI recognised Philip V as king of Spain, and Elisabeth Farnese’s son Don Carlos was promised the succession to Parma and Tuscany.
    facts:
