id: jacobite-rising-of-1719
name: Jacobite rising of 1719
start: "1719-03"
end: "1719-06-10"
tier: C
summary: A Jacobite rising backed by Spain during the War of the Quadruple Alliance. Philip V’s minister, Cardinal Alberoni, planned to land some 5,000 Spanish troops under the exiled Duke of Ormonde in south-west England, with a smaller diversion in Scotland, but storms scattered the main fleet off Cape Finisterre in late March. The Scottish expedition, a few hundred Spanish marines with Jacobite exiles under the Earl Marischal and the Marquess of Tullibardine, landed on Lewis and then at Loch Alsh, using Eilean Donan castle as its base until Royal Navy ships bombarded the castle and blew it up in May. About 1,000 Highlanders joined, but on 10 June 1719 government troops under General Joseph Wightman beat the Jacobites at Glen Shiel. The Highlanders dispersed, and the Spaniards surrendered and were later sent home.
