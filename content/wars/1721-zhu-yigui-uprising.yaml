notes:
  - Dates are converted to the Gregorian calendar from the lunar dates of the Qing records (the rising began on the 19th day of the 4th month of the 60th year of Kangxi; Zhu was captured on the 5th day of the intercalary 6th month).
  - Zhu Yigui is still honoured in local temples in southern Taiwan, and the Liudui militia formed in 1721 remained a force among the Hakka of the Pingtung plain throughout the Qing period.
