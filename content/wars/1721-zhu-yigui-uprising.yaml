id: zhu-yigui-uprising
name: Zhu Yigui uprising
start: "1721-05-14"
end: "1721-07-28"
tier: C
summary: "A rising of Han settlers in southern Taiwan that briefly drove out the Qing authorities. Angered by the exactions of the Taiwan prefect Wang Zhen and his officials, settlers in the hills of Fengshan county chose as their leader Zhu Yigui, a duck farmer of Zhangzhou origin whose surname was that of the Ming emperors. They rose on 14 May 1721 at Gangshan, joined forces with a band under Du Junying, a settler from Guangdong whose followers were largely Hakka, defeated the garrison troops at Chishan on 22 May and took the prefectural city (Tainan) on 26 May, while officials fled to Penghu. Zhu proclaimed himself Zhongxing Wang (“king of the restoration”) with the reign name Yonghe, and within days the rebels held most of the settled plains. Their coalition soon split along lines of origin, between Zhu’s Hoklo followers and Du’s Hakka, and the Hakka villages of the Liudui settlements in the south formed a militia that defeated the rebels on the Xia Danshui river in early July. A Qing fleet from Fujian under Shi Shibiao and Lan Tingzhen forced the Luermen channel on 10 July, took Anping on 12 July and retook the prefectural city on 17 July; the expedition grew to some 18,000 men. Zhu was handed over by village militia leaders on 28 July and executed by slicing in Beijing, and Du Junying later surrendered. The rising led the Qing to strengthen their garrison and administration in Taiwan, and Lan Tingzhen’s kinsman and adviser Lan Dingyuan wrote influential essays urging fuller settlement of the island."
