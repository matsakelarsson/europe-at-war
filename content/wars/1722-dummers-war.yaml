notes:
  - Also called Father Rale’s War, Lovewell’s War, Gray Lock’s War (for the western front), the Three Years War and the Wabanaki–New England War. New France was officially at peace with Britain but supplied the Wabanaki and urged them on.
  - English dates are in the Julian calendar (Old Style) used in the British colonies until 1752. Numbers killed at Norridgewock come from the New England commanders’ reports and later accounts and differ.
