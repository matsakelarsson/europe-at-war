id: dummers-war
name: Dummer’s War
start: "1722-07-25"
end: "1725-12-15"
tier: C
summary: "A war between the Wabanaki Confederacy and New England and Nova Scotia over the lands between the Kennebec River and Acadia. The Wabanaki had never accepted the British sovereignty written into the Treaty of Portsmouth of 1713, and as New England settlers and forts spread east of the Kennebec they resisted, encouraged and armed by New France and by the Jesuit missionary Sébastien Rale at Norridgewock. After New Englanders raided Norridgewock in January 1722 to seize Rale, the Wabanaki burned the settlement of Brunswick, and Governor Samuel Shute of Massachusetts declared war on 25 July 1722; Lieutenant Governor William Dummer, after whom the war is named, directed it once Shute left for England. In Nova Scotia the Mi’kmaq and Wolastoqiyik (Maliseet) blockaded Annapolis Royal, seized New England fishing boats and fought at Winnepang (Jeddore Harbour) in 1722, and attacked Annapolis Royal again in 1724, while in the west the Abenaki leader Gray Lock raided the towns of the Connecticut valley. On 12 August 1724 (23 August New Style) some 200 rangers under Jeremiah Moulton and Johnson Harmon surprised Norridgewock, killing Rale, the sachem Mog and, by most accounts, about 80 Abenaki, many of them women and children, and burning the village. On 9 May 1725 John Lovewell’s company of volunteer scalp hunters fought the Pequawket Abenaki under Paugus at Pequawket (Fryeburg, Maine); both leaders were killed, only about 20 of Lovewell’s men survived, and the Pequawket afterwards left their town for Canada. Penobscot leaders led by Loron (Sauguaaram) negotiated a peace, signed at Boston on 15 December 1725 and confirmed with the Mi’kmaq at Annapolis Royal in 1726 and at Falmouth in 1727. The English text declared the Wabanaki subjects of the Crown; Loron said publicly that they had agreed to peace, not to submission."
countries: [us, ca]
