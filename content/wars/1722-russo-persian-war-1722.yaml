notes:
  - Russian accounts date events in the Julian calendar, eleven days behind the Gregorian; the Treaty of Saint Petersburg was signed on 12 September 1723 Old Style, 23 September New Style.
  - Known in Russian historiography as the Persian campaign of Peter the Great. The 1724 Treaty of Constantinople then divided the Persian lands in the Caucasus between Russia and the Ottoman Empire.
