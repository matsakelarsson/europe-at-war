id: russo-persian-war-1722
name: Russo-Persian War of 1722–1723
start: "1722"
end: "1723"
tier: C
summary: Peter the Great’s campaign along the western shore of the Caspian Sea, launched as Safavid Persia collapsed under an Afghan invasion. Russian forces took Derbent in 1722 and Rasht and Baku in 1723, and by the Treaty of Saint Petersburg that September the shah’s envoy ceded Derbent, Baku and the provinces of Shirvan, Gilan, Mazandaran and Astarabad. Disease killed many thousands of the occupying troops, and Russia gave the lands back in 1732 and 1735.
