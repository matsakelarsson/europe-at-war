id: lobzang-danjin-rebellion
name: Lobzang Danjin’s rebellion
start: "1723-06"
end: "1724-03"
tier: C
summary: "A rising of the Khoshut Mongols of Kokonor (Qinghai) against the Qing, which ended their autonomy. The Khoshut princes of Kokonor, descendants of Güshi Khan, had ruled Tibet until the Dzungar invasion of 1717, and when the Qing expedition of 1720 drove out the Dzungars, Güshi’s grandson Lobzang Danjin hoped to take his forebears’ place in Lhasa. Instead the Qing ruled Tibet through Tibetan ministers and kept the Kokonor princes as titled vassals. In the summer of 1723 Lobzang Danjin called the princes to an assembly, told them to drop their Qing titles and took the old Mongol title of Dalai Hong Taiji; princes who refused, among them Erdeni Erke Toqtonai and Chaghan Danjin, were attacked and fled into Gansu. The rebels raided the forts and villages around Xining, and many monks of the great monasteries of Amdo, among them Gönlung and Kumbum, joined them. The Yongzheng emperor gave command to Nian Gengyao, governor-general of Sichuan and Shaanxi, with Yue Zhongqi as his field commander. In the winter of 1723–1724 Qing troops stormed the rebel monasteries; at Gönlung, burned on 11 February 1724, estimates of the dead range from some thirty monks in the monastery’s own chronicle to more than 6,000 monks and lay people in other accounts. In March 1724 Yue Zhongqi led a fast column of picked cavalry deep into the Tsaidam and scattered the rebel camps in a few weeks; Lobzang Danjin escaped to the Dzungar ruler Tsewang Rabtan. Nian’s regulations of 1724 then divided the Kokonor Mongols into banners under Qing control, limited the size of monasteries and opened supervised border markets, and from 1725 an imperial commissioner (amban) at Xining governed Kokonor. Lobzang Danjin was handed over to the Qing when Dzungaria fell in 1755 and was pardoned by the Qianlong emperor."
