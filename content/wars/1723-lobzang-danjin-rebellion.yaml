notes:
  - Dates are converted from the lunar calendar of the Qing records; the rising began in the 5th month of the first year of Yongzheng (June 1723). Most of what is known comes from the Manchu and Chinese reports of Nian Gengyao and from Tibetan monastic chronicles, which differ sharply over the killings at the monasteries.
