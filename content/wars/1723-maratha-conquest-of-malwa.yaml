id: maratha-conquest-of-malwa
name: Maratha conquest of Malwa
start: "1723"
end: "1738-01-07"
tier: B
summary: "The campaigns by which the Peshwa Baji Rao I carried Maratha power north of the Narmada into the Mughal province of Malwa and into Bundelkhand. Maratha armies raided Malwa from 1723; in 1728 Baji Rao’s brother Chimaji Appa defeated and killed its governor, Giridhar Bahadur, at Amjhera, and Maratha chiefs, Holkar, Scindia and the Pawars, began to collect its revenue. In 1729 Baji Rao relieved the Bundela king Chhatrasal, besieged by the Mughal general Muhammad Khan Bangash, and was rewarded with a third of his kingdom. In 1737 he rode to the outskirts of Delhi, and when the Nizam of Hyderabad came north with an imperial army, the Marathas surrounded him at Bhopal and forced him to agree, at Doraha in January 1738, that Malwa would be ceded to them. The emperor formally made the Peshwa deputy governor of Malwa in 1741."
