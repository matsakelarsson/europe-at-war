  - title: Delhi and Bhopal
    date: 1735 – January 1738
    when: "1737-12-24"
    borders: "1738-01-07"
    countries: [in]
    body:
      - Talks with the Mughal court through Jai Singh II of Amber, governor of Malwa, produced only partial concessions, so in 1737 Baji Rao marched on the capital itself. When the governor of Awadh, Saadat Khan, beat a Maratha detachment under Malhar Rao Holkar in the Doab and boasted that he had driven the Marathas back, Baji Rao made a swift march round the Mughal armies and on 28 March 1737 appeared outside Delhi, where he routed a force sent out against him. Rather than risk a battle with the main Mughal armies returning to the city, he withdrew south with his point made.
      - The emperor called on the Nizam, Asaf Jah I, who marched north with an army and a strong artillery train. Baji Rao, with some 80,000 horsemen, crossed the Narmada in December and caught him near Bhopal; the Nizam took refuge behind the town’s walls, and the Marathas cut off his supplies and surrounded him. After a month of hunger, the Nizam signed the convention of Doraha on 7 January 1738, promising to obtain for the Marathas the whole of Malwa and the land between the Narmada and the Chambal, and 50 lakh rupees for their expenses. The cession was delayed by Nader Shah’s invasion of 1739, but in 1741 the emperor formally made the new Peshwa, Baji Rao’s son Balaji Rao, deputy governor of Malwa.
    facts:
      - [Marathas before Delhi, "28 March 1737"]
      - [Battle of Bhopal, "December 1737"]
      - [Convention of Doraha, "7 January 1738; Malwa and 50 lakh rupees promised to the Marathas"]
