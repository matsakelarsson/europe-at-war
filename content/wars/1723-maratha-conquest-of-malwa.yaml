  - title: Bundelkhand
    date: December 1728 – 1731
    when: "1729-03"
    borders: "1729-03"
    countries: [in]
    body:
      - Bundelkhand, the hilly country north-east of Malwa, was ruled by Chhatrasal, a Bundela Rajput who had won its independence from Aurangzeb. In December 1728 Muhammad Khan Bangash, the Afghan governor of Allahabad, invaded it and besieged the old king, by then nearly eighty, in his fort at Jaitpur. Chhatrasal appealed to Baji Rao, who in March 1729 marched from the Deccan with some 25,000 horsemen, joined the Bundelas and surrounded Bangash in turn. Short of food, the Mughal general had to withdraw, promising never to attack Bundelkhand again.
      - In gratitude Chhatrasal gave Baji Rao a large estate, and before his death in December 1731 he left the Peshwa a third of his kingdom, around Jhansi, Sagar and Kalpi. He also gave him in marriage Mastani, a daughter of his by a Muslim wife, whose life with Baji Rao became a famous and much-romanticised story.
    facts:
      - [Siege of Jaitpur, "December 1728 – 1729"]
      - [Baji Rao’s army, "about 25,000 horsemen"]
      - [Death of Chhatrasal, "December 1731"]
