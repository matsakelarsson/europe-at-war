notes:
  - Maratha armies in this period lived on chauth and sardeshmukhi, claims to a quarter and a further tenth of a district’s revenue. The conquest of Malwa began as a right to collect these and became rule over the land; the Holkars of Indore, the Scindias of Gwalior and the Pawars of Dhar founded their states on it.
  - The battles against the Nizam in the Deccan (Palkhed, 1728) are told in the story of the Maratha–Nizam wars.
