steps:
  - title: Across the Narmada
    date: 1723–1728
    when: "1728-11"
    borders: "1728-12"
    countries: [in]
    body:
      - Baji Rao became Peshwa, chief minister of King Shahu, in 1720 at the age of 19, and argued that the Marathas should strike at the decaying Mughal empire in the north rather than spend their strength in the south. From 1723 Maratha armies crossed the Narmada each dry season to raid Malwa, the rich plateau between the Deccan and the Ganges plain, and to demand chauth from its towns. The Mughal governor, Giridhar Bahadur, a Nagar Brahmin, resisted for five years.
      - In late 1728 Baji Rao’s younger brother, Chimaji Appa, caught Giridhar Bahadur and his cousin Daya Bahadur at Amjhera, near Dhar, and both were killed in the battle. Maratha commanders, among them Malhar Rao Holkar and Ranoji Scindia, took over the collection of revenue in much of the province, though its towns and forts remained in Mughal hands for some years.
    facts:
      - [Baji Rao becomes Peshwa, "April 1720"]
      - [Battle of Amjhera, "late 1728, Maratha victory"]
