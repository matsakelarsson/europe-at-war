  - title: Whydah and the European forts
    date: February – April 1727
    when: "1727-02"
    borders: "1727-06-01"
    countries: [bj]
    body:
      - Whydah, ruled since 1708 by King Huffon from his capital at Savi, had become one of the busiest slave-trading ports in Africa. The Dutch, English, French and Portuguese companies had compounds beside his palace and forts near the beach at Ouidah, mud-walled stores for captives and goods whose cannon could not protect the ships offshore, and they competed for his favour; the French gave him a throne and the English a crown. In 1726 the ruler of Gomè, Whydah’s vassal, went over to Agaja, and Agaja’s daughter Na Gueze, married to Huffon, is said to have spoiled Whydah’s gunpowder.
      - On 26 February 1727 Agaja attacked. In five days of fighting, by European reports, about 5,000 people were killed and 10,000 to 11,000 taken captive. Huffon and the Whydah court fled to fortified islands off the coast, from which they harassed Dahomey with boats and guns for years. In April Agaja burned the European factories; in 1728 his troops destroyed the French fort by blowing up its magazine. Dahomey had more than doubled its territory and could now trade directly with the Europeans.
      - "Agaja’s aims have long been debated. The trader John Atkins wrote in 1735 that he fought to free captured Dahomeans, and the historian I. A. Akinjogbin argued that he wanted to end the slave trade; Robin Law and others reject both views, and others again stress that Dahomey needed the imported goods, guns among them, that only the trade could buy. Agaja made the sale of captives a royal monopoly in 1733 and later relaxed it when it proved unpopular."
