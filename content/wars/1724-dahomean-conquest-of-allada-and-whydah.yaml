notes:
  - The numbers of dead and captives come from European traders on the coast and are uncertain. The Oyo invasions that followed are told in a separate entry, Oyo invasions of Dahomey (1726–1748).
  - Whydah is the old English name for the kingdom of Hueda and for its port, today’s Ouidah; its capital was Savi, a few kilometres inland, where the European companies had compounds beside the king’s palace.
