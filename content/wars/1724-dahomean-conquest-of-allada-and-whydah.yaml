steps:
  - title: The fall of Allada
    date: March – April 1724
    when: "1724-03"
    borders: "1724-04-30"
    countries: [bj]
    body:
      - Dahomey, the kingdom of the Fon on the Abomey plateau, had grown through the seventeenth century in the hinterland of the coastal kingdoms of Allada and Whydah, through which European ships bought captives in such numbers that they called this shore the Slave Coast; a visitor in the 1690s described Whydah as selling “some thousand slaves a month”. All three kingdoms had paid tribute to Oyo since the 1680s. Agaja, who took the throne of Dahomey in 1718 after a short and violent struggle, set out to reach the coast and its trade.
      - A succession dispute in Allada gave him his chance. On 30 March 1724 his army entered Allada in support of the defeated claimant, Hussar; after three days of fighting it killed the king and burned the palace, and Agaja then drove out Hussar as well and kept the kingdom. In April he took Godomey, on the coast to the south-east. Among his captives was the English trader Bulfinch Lambe, who stayed at Agaja’s court until 1726, when Agaja sent him to England with an envoy, Adomo Tomo, and a proposal of trade for King George I.
    facts:
      - [Allada stormed, "30 March 1724, after three days of fighting"]
      - [Godomey taken, "April 1724"]
