id: dahomean-conquest-of-allada-and-whydah
name: Dahomey’s conquest of Allada and Whydah
start: "1724-03-30"
end: "1727"
tier: B
summary: "The wars by which King Agaja of Dahomey, an inland kingdom on the Abomey plateau, conquered the two coastal kingdoms through which Europeans bought captives on the Slave Coast, in today’s Benin. Allada and Whydah (Hueda), like Dahomey, were tributaries of the Yoruba empire of Oyo, and their ports, with the forts and compounds of the Dutch, English, French and Portuguese, exported thousands of enslaved people a year. Taking advantage of a succession dispute, Agaja’s army stormed Allada on 30 March 1724, killing its king and burning the palace, and took Godomey on the coast in April. On 26 February 1727 he attacked Whydah, whose king Huffon fled; contemporary reports speak of about 5,000 killed and 10,000 to 11,000 captured in five days, and in April Agaja burned the European trading factories. Dahomey more than doubled its territory and gained direct access to the Atlantic trade, which Agaja made a royal monopoly in 1733. Whether he meant to control the slave trade or, as some writers argued, to end it has long been debated. The conquests brought Oyo’s armies down on Dahomey, and the Whydah exiles fought on from the coastal islands for years."
