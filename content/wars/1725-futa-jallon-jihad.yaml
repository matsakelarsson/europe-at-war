steps:
  - title: Talansan and the nine provinces
    date: c. 1725–1751
    when: "1727"
    borders: "1740"
    countries: [gn]
    body:
      - Fulbe herders had moved into the Futa Jallon highlands since the fifteenth century, living among the Yalunka (Jallonke) and Susu farmers, whose chiefs held the land. After Europeans set up trading posts on the Upper Guinea coast in the seventeenth century, the trade in hides and in captives grew, and Muslim traders and clerics, among them Torodbe from Futa Toro, spread a more militant Islam among the Fulbe and the Malinke of the highlands.
      - About 1725 Muslim leaders meeting at Fugumba, called together by the cleric Alfa Ba, decided on a holy war against the non-Muslims. Alfa Ba died before it began, and his son Ibrahima Sambegu, the hereditary ruler of Timbo, was chosen to lead it, as Karamokho Alfa. Tradition says that his cousin Ibrahima Sori opened the war about 1727 by cutting the great ceremonial drum of the Yalunka with his sword. At Talansan, east of Timbo on the Bafing river, a force that tradition puts at 99 Muslims is said to have defeated an army ten times larger. Many Yalunka were driven out of the highlands, and many Susu moved south and west towards the coast. The jihad drew in bands of young men, outlaws and slaves as well as clerics.
      - The nine ulama who had led the jihad, one for each province (diwal, plural diwe), founded the new state and chose Karamokho Alfa as almami. He ruled his own province of Timbo, while the council of elders at Fugumba, the religious capital, limited his power, so that the state was always a loose federation. Fulbe herders who had not converted resisted the clerics for years. Karamokho Alfa was a scholar rather than a commander; from about 1748, when his devotions had left him unable to rule, Ibrahima Sori led the state, and he succeeded him when Karamokho Alfa died in 1751.
    facts:
      - [Call to jihad at Fugumba, "about 1725"]
      - [Battle of Talansan, "about 1727 (some say 1747–1748)"]
      - [Death of Karamokho Alfa, "1751"]
