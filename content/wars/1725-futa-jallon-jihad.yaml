notes:
  - The history of the jihad rests on Fulbe chronicles and oral traditions written down in the nineteenth century, and its dates are uncertain. The battle of Talansan is dated to about 1727 (1140 AH) by most sources and to 1747 or 1748 by others; the death of Ibrahima Sori is given as 1784 or 1791.
  - Futa Jallon (Fouta Djallon) is the highland region; Fulbe (Fula, Peul) is the people’s name for themselves. Almami, from the Arabic al-imam, was the title of the head of state.
