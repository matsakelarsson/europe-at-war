id: futa-jallon-jihad
name: Futa Jallon jihad
start: "1725"
end: "1776"
tier: B
summary: "The holy war by which Muslim Fulbe and their allies took power in the Futa Jallon highlands of today’s Guinea and founded the Imamate of Futa Jallon, the first of the Fulbe Islamic states of West Africa. About 1725 Muslim leaders meeting at Fugumba called for jihad against the non-Muslim Yalunka (Jallonke) and Fulbe chiefs; led by the scholar Ibrahima Sambegu, known as Karamokho Alfa, and the commander Ibrahima Sori, they won a battle at Talansan, dated by most sources to about 1727, and founded a federation of nine provinces under an almami (imam) at Timbo, checked by a council of elders at Fugumba. Many Yalunka and Susu left the highlands. After Karamokho Alfa’s death in 1751 Ibrahima Sori fought on, allied with the Yalunka kingdom of Solima to raid for captives, was defeated in Wasulu in 1762 and nearly lost Fugumba to Konde Burama of Sankaran, and finally defeated Solima in 1776. The wars produced captives in large numbers: many were sold to European traders on the coast for cloth, iron and guns, and many more were settled as slaves in farming villages that fed the Fulbe elite."
countries: [gn, sl, ml]
