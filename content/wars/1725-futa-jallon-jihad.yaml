  - title: Ibrahima Sori’s wars
    date: 1751–1776
    when: "1762"
    borders: "1776"
    countries: [gn, sl, ml]
    body:
      - Ibrahima Sori, whose aims the sources describe as more commercial than religious, made war a source of captives. He allied with the Yalunka king of Solima, to the south, to raid for slaves, who were sold to European traders on the coast for cloth, iron and weapons, or settled in farming villages (runde) inside the imamate; a great slave revolt in 1785 was put down, though many escaped. In 1762 a Futa Jallon and Solima army invaded Wasulu, to the east, and was defeated. The alliance broke up, Solima joined the Wasulunke in raiding Futa Jallon, and Konde Burama, king of Sankaran, invaded and was only with difficulty kept from taking Fugumba.
      - At home Sori quarrelled with the council of elders, who resented his power; he had his opponents executed at Fugumba and called an assembly that confirmed his authority. In 1776 he defeated Solima decisively, forcing it to accept Futa Jallon’s supremacy and ending the threat from Sankaran. He took the title almami and is remembered as Sori Mawdo, Sori the Great. The imamate he consolidated, in which the descendants of Karamokho Alfa (the Alfaya) and of Sori (the Soriya) later took turns to rule, lasted until the French conquest of 1896.
    facts:
      - [Defeat in Wasulu, "1762"]
      - [Konde Burama’s invasion, "1762"]
      - [Victory over Solima, "1776"]
