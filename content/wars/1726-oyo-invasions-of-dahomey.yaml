    moves: Dahomean moves
    success: Dahomean success
notes:
  - The number and dates of the Oyo invasions are known mostly from European traders on the coast and from Dahomean and Oyo tradition, and sources differ. Some date the first great invasion to 1728 rather than 1726, and the start of Dahomey’s tributary status to 1730, 1732 or 1748; the end of the tribute is put in 1823 or 1832.
  - The terms of the tribute of 1730 are those given by one account; the details of the settlement of 1748 are not recorded in the sources used here.
