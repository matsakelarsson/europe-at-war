steps:
  - title: Oyo’s cavalry and the burning of Abomey
    date: 1726–1730
    when: "1726-04"
    borders: "1728-04-01"
    countries: [bj, ng]
    body:
      - Oyo, the Yoruba empire of the savanna north of the forest, had raided southwards since 1682 and had taken tribute from the Aja kingdoms, Dahomey among them, since the 1680s. Agaja’s conquest of Allada in 1724 alarmed his neighbours, who asked Oyo for help, and Agaja seems to have reduced his own tribute. The alaafin Ojigi sent four expeditions against Dahomey. On 14 April 1726 the first took Abomey and burned it; Agaja escaped into the marshes.
      - Oyo’s strength was its cavalry. Dahomey had no horses but many firearms, whose noise frightened the Oyo horses and stopped their charges, and it dug trenches and other defences; but it could not stop the Oyo armies from crossing the open country to Abomey. When Agaja held back a larger tribute, the Oyo army returned on 22 March 1728. One account tells of a battle of four days that Oyo won only when reinforcements arrived; in another, Agaja buried his treasure, burned the food stores and abandoned Abomey, and the Oyo army withdrew in April.
      - Oyo sent larger armies in 1729 and 1730, and each time Agaja and his troops withdrew into the marshes. In 1730 the Oyo pretended to accept his gifts and then ambushed the Dahomean forces as they returned to Abomey. Agaja made peace. One account gives Dahomey’s yearly tribute as forty men, forty women, forty guns and 400 loads of cowries and coral; the Ouémé river became the border, and tradition says Agaja sent his son Tegbesu to Oyo as a guarantee. Agaja moved his capital south to Allada.
    facts:
      - [Abomey taken and burned, "14 April 1726"]
      - [Second invasion, "22 March – April 1728"]
      - [Peace and tribute, "1730"]
