id: oyo-invasions-of-dahomey
name: Oyo invasions of Dahomey
start: "1726-04-14"
end: "1748"
tier: B
summary: "The campaigns by which the Yoruba empire of Oyo forced Dahomey, which had just conquered the coastal kingdoms of Allada and Whydah, to accept its overlordship. Oyo had taken tribute from the Aja kingdoms since the 1680s, and states threatened by King Agaja asked it for help. In April 1726 Oyo’s army, strong in cavalry, invaded, took and burned Abomey, while Agaja escaped into the marshes; it came again in 1728, when Agaja evacuated and burned his capital rather than defend it, and with larger armies in 1729 and 1730. Dahomey had no horses but many muskets, whose fire frightened the Oyo horses, and it dug trenches against them. In 1730 Agaja agreed to pay a yearly tribute, sent his son Tegbesu to Oyo as a guarantee, by tradition, and moved his capital to Allada. War broke out again in 1739 and went on under Tegbesu, until Oyo, after eleven invasions in all, brought Dahomey to submit in 1748. Dahomey paid tribute to Oyo until the reign of Ghezo, in the 1820s or 1830s, while it grew rich on the sale of captives through Ouidah."
countries: [bj, ng]
sides:
  - id: oy
    name: Oyo Empire
    polities: [oyo]
    ink: red
    moves: Oyo moves
    success: Oyo success
  - id: dh
    name: Kingdom of Dahomey
    polities: [dahomey]
