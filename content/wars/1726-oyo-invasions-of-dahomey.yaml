  - title: Tribute to Oyo
    date: 1730–1748
    when: "1740"
    borders: "1748-12-01"
    countries: [bj, ng]
    body:
      - Agaja used the peace to fight the Mahi, north of Abomey, who had supplied Oyo, in 1731, and the Whydah exiles, whom he defeated with French help in 1734 after their king Huffon’s death; in 1732 he burned Godomey, where the Portuguese and Dutch had tried to build forts, and took thousands of captives. In 1739 war with Oyo broke out again. Agaja died at Allada in 1740, a few months after returning from it.
      - His son Tegbesu, king from 1740, moved the capital back to Abomey and faced further Oyo invasions. Oyo invaded Dahomey eleven times in all before Dahomey finally submitted in 1748. Dahomey then paid tribute to Oyo for some eighty years, until King Ghezo ended it, while under Tegbesu the sale of captives through Ouidah became the largest part of the royal income.
    facts:
      - [War renewed, "1739"]
      - [Death of Agaja, "1740"]
      - [Dahomey submits to Oyo, "1748"]
