id: anglo-spanish-war-1727
name: Anglo-Spanish War of 1727–1729
start: "1727-02-11"
end: "1729-11-09"
tier: C
summary: A short war in which Philip V’s Spain, counting on its new alliance with the Emperor Charles VI, tried to win back Gibraltar, which it had ceded to Britain at Utrecht in 1713. On 11 February 1727 a Spanish army under the Count de las Torres, put at between 12,000 and 25,000 men and many of them foreign regiments, opened a siege from the isthmus below the Rock. The Royal Navy held the Strait, and the garrison, about 1,500 men at first, was reinforced by sea to some 5,000. Spanish batteries pounded the north front, but rain, sickness and fire from the Rock wore the besiegers down, and the promised Austrian help never came. Fighting stopped in June 1727 after preliminaries signed in Paris, having cost Spain over 1,400 men against about 300 British. Meanwhile a British squadron blockading Porto Bello in Panama lost some 4,000 men to disease. The Convention of El Pardo (March 1728) and the Treaty of Seville (9 November 1729) restored the position before the war, and Gibraltar stayed British.
