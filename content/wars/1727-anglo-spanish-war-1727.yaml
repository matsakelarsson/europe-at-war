notes:
  - Dates are New Style (Gregorian). Britain still used the Julian calendar, eleven days behind. Some historians date the start of the war to 1726, when Britain sent a fleet to the Spanish Caribbean.
  - Spanish historians count this as the thirteenth siege of Gibraltar.
