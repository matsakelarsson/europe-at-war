steps:
  - title: Palkhed
    date: August 1727 – March 1728
    when: "1728-02-25"
    borders: "1728-03-06"
    countries: [in]
    body:
      - In 1724 the Mughal viceroy of the Deccan, Asaf Jah I, the Nizam-ul-Mulk, defeated the emperor’s candidate at Shakarkheda and made himself master of the six Deccan provinces. He disliked the Maratha claim to chauth and sardeshmukhi, a quarter and a further tenth of their revenue, granted by the emperor in 1719, and backed Sambhaji II of Kolhapur, Shahu’s cousin and rival, as the true Maratha king. In 1727 he marched into Maratha country towards Pune. Baji Rao, instead of meeting him, struck north in August with his light cavalry, raided the Nizam’s lands from Jalna to Burhanpur and rode on into Gujarat, forcing the Nizam to turn back.
      - When the Nizam’s army, slowed by its artillery and baggage, moved north again, Baji Rao came back at speed and surrounded it in dry country near Palkhed, west of Aurangabad, on 25 February 1728, cutting it off from water and food. The Nizam had to come to terms. By the treaty of Mungi Shevgaon, on 6 March 1728, he recognised Shahu as the only Maratha king, abandoned Sambhaji II and accepted the Maratha right to collect chauth and sardeshmukhi in the Deccan. The campaign made Baji Rao’s name as a general.
    facts:
      - [Battle of Palkhed, "25 February 1728, Maratha victory"]
      - [Treaty of Mungi Shevgaon, "6 March 1728"]
