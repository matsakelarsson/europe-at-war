  - title: Udgir
    date: 1759 – February 1760
    when: "1760-02-03"
    borders: "1760-02-03"
    countries: [in]
    body:
      - In 1759 the Peshwa’s cousin, Sadashivrao Bhau, led a great army against Salabat Jang and Nizam Ali. The armies manoeuvred in the country around Udgir, and on 3 February 1760 the Marathas defeated the Nizam’s forces in a battle in which the Maratha artillery played a large part. Surrounded and short of supplies, the Nizam’s brothers came to terms.
      - By the treaty that followed, the Nizam ceded territory said to yield 60 to 62 lakh rupees a year, including Ahmednagar, Daulatabad, Burhanpur and Bijapur. The Maratha state stood at the height of its power, and the Bhau was sent north with the victorious army to meet Ahmad Shah Durrani; a year later most of that army was destroyed at Panipat, and the Nizam won back part of the ceded land.
    facts:
