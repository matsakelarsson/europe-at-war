  - title: Bhopal, Bhalki and Sindkhed
    date: 1737–1757
    when: "1751-11-22"
    borders: "1752-11"
    countries: [in]
    body:
      - The Nizam tried once more to stop the Marathas, when he came north to defend Malwa for the emperor in 1737; Baji Rao surrounded him at Bhopal and forced him to promise the province to the Marathas in January 1738. In 1739–1740 Baji Rao fought the Nizam’s son Nasir Jang in the Deccan and gained two districts on the Narmada. After Asaf Jah’s death in 1748 his sons and grandson fought for the succession, drawing in the French and British. Salabat Jang, made Nizam with French help, marched on Pune in 1751 with a French corps under Bussy; French guns and disciplined infantry won several actions, including a surprise attack on the Maratha camp at the Kukadi river during a lunar eclipse on 22 November 1751, but the Nizam’s unpaid army could not go on, and he accepted a truce at Shingwa in January 1752.
      - By the treaty of Bhalki in November 1752 the Peshwa, Balaji Rao, gained the land between the Tapti and the Godavari west of Berar. In December 1757, at Sindkhed, a Maratha army beat Salabat Jang’s brother Nizam Ali and won more territory, and in 1759 the commander of Ahmednagar was bribed to hand its fort over to the Peshwa.
    facts:
      - [Convention of Doraha after the battle of Bhopal, "7 January 1738"]
      - [Truce of Shingwa, "7 January 1752"]
      - [Treaty of Bhalki, "November 1752"]
      - [Battle of Sindkhed, "December 1757, Maratha victory"]
