notes:
  - Asaf Jah I, the first Nizam, was still in name a Mughal governor, and his successors called themselves subahdars of the Deccan; the state took the name of its capital, Hyderabad, later. The wars of the 1760s–1790s (Rakshasbhuvan 1763, Kharda 1795) are not part of this story.
  - Many of the battles are known mainly from Maratha chronicles and the Peshwa’s papers. Dates and numbers vary between accounts; the date of the battle of Palkhed is given as 25 or 28 February 1728.
