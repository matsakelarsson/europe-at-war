id: maratha-nizam-wars
name: Maratha–Nizam wars
start: "1727-08"
end: "1760-02"
tier: B
summary: "The wars between the Marathas and the Nizams of Hyderabad, the Mughal viceroys who made the Deccan their own state after 1724. The first Nizam, Asaf Jah I, refused the Marathas’ claim to a share of the Deccan revenue and backed a rival Maratha king; Peshwa Baji Rao I outmanoeuvred him and cornered his army at Palkhed in 1728, forcing him to recognise Shahu and the Maratha claims. In 1737–1738 the Marathas surrounded the Nizam again at Bhopal. After his death in 1748 his sons fought over the succession, and the Marathas under Peshwa Balaji Rao fought Salabat Jang and his French allies in 1751–1752, won land in the treaty of Bhalki and defeated the Nizam’s armies at Sindkhed in 1757 and decisively at Udgir in 1760, which gave them much of the northern Deccan. The two powers fought again later, and were allies as often as enemies."
countries: [in]
