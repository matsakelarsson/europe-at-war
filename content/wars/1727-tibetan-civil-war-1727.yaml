notes:
  - The status of Tibet under the Qing is described differently by Chinese and Tibetan historians, as a part of China under imperial administration or as a protectorate whose own government ran its internal affairs; after 1728 two Qing ambans and a garrison were stationed in Lhasa beside the Tibetan government. Dates follow the sources cited and are Gregorian.
