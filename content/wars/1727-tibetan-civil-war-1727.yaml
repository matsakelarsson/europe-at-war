id: tibetan-civil-war-1727
name: Tibetan civil war of 1727–1728
start: "1727-08-05"
end: "1728-11-01"
tier: C
summary: "A war between the nobles of Ü and Tsang over the government of Tibet, which brought a permanent Qing garrison and resident officials (ambans) to Lhasa. After the Qing expedition of 1720 drove the Dzungars out, Tibet was governed by a council of ministers under Khangchenné Sönam Gyalpo, a noble from western Tsang favoured by the Qing, with the Ü nobles Ngapö Dorje Gyalpo, Lumpané Tashi Gyalpo and Jarraba Lodrö Gyalpo and the Tsang noble Polhané Sönam Topgyé. Rivalry between the two regions and over the Qing’s favour came to a head on 5 August 1727, when Ngapö, Lumpané and Jarraba had Khangchenné killed in Lhasa, with the backing of the young Seventh Dalai Lama’s father. Polhané, away at his estate, escaped the men sent to seize him, raised the levies of Tsang, allied with Khangchenné’s brother, the governor of Ngari, and appealed to the Yongzheng emperor. After about half a year of fighting he defeated Ngapö’s army near Gyantse, marched on Lhasa with some 9,000 men and took the city; his enemies, who had shut themselves in the Potala, were taken prisoner on 5 July 1728. A Qing army arrived in Lhasa on 4 September, after the fighting was over. On 1 November 1728 Qing officials had Ngapö and Lumpané executed by slicing, two lamas hanged and thirteen others beheaded, and some of their relatives killed or exiled. The Dalai Lama was sent to Gartar near Litang in Kham until 1735, Polhané was given charge of the government, ruling Tsang himself and Ü through two ministers under his direction, with two ambans supervising, and Qing troops were stationed in Lhasa. He governed Tibet until his death in 1747."
