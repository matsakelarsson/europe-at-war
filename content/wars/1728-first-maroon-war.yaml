steps:
  - title: Nanny Town and the Windward war
    date: "1728–1734"
    when: "1732"
    borders: "1734"
    countries: [jm, gb]
    body:
      - "By the 1720s Jamaica was a sugar colony of perhaps 80,000 enslaved Africans and fewer than 8,000 whites, and Maroon communities held much of its mountainous interior. In the east, in the rain-soaked Blue Mountains, the Windward Maroons lived at Nanny Town, high above the Rio Grande valley, under Nanny, a spiritual and military leader of Akan origin, and her brother Quao, with captains such as Jeddo and Welcome. They grew food in hidden provision grounds, traded and raided along the coast, and took in people who had escaped from the plantations."
      - "In 1728 Governor Robert Hunter arrived with orders to end the Maroon threat, and more troops followed. Jeddo’s warriors attacked the new settlement at Port Antonio, and when Lieutenant Soaper’s militia pursued them they were ambushed; in 1730 a larger force under Soaper was beaten again. Two regular regiments arrived in 1731. Using lookouts, horns to signal and ambushes from the forest, the Maroons repeatedly cut up the columns of soldiers, militia and the “Black Shot”, enslaved and free Black auxiliaries, sent up the river valleys. In 1732 three parties occupied Nanny Town, but the cost of holding it was too great, and the Maroons returned when they left."
      - "In 1734 Captain Stoddart led a party up the mountains by night, dragged small swivel guns to the heights above Nanny Town and bombarded it; the Windward Maroons abandoned the town and moved east into the John Crow Mountains, where they kept up the war. By the end of 1734 the colony was under martial law, sugar exports had fallen, and planters were abandoning estates exposed to Maroon raids."
    facts:
      - [Governor Hunter arrives, "1728"]
      - [Nanny Town occupied, "1732, and again in 1734"]
      - [Regular regiments sent from outside, "two in 1731"]
