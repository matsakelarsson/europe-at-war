  - title: Cudjoe and the Leeward treaty
    date: "1735 – March 1739"
    when: "1738"
    borders: "1739-03-01"
    countries: [jm, gb]
    body:
      - "In the west, the Leeward Maroons held the Cockpit Country, a maze of steep limestone hills and hollows. They were led by Cudjoe, by Maroon tradition the son of a leader of the rising at Sutton’s estate in 1690, who had united the western bands, with Accompong and other brothers and captains. In 1735 more than a hundred of Cudjoe’s warriors overran a military barracks in western Jamaica. Governors Ayscough and Gregory built new barracks and outposts around the Maroon country and ordered parties to keep pressing into it, but the Maroons ambushed them in the narrow passes and raids on coastal estates continued."
      - "In 1738 Governor Edward Trelawny, convinced that the war could not be won, authorised Colonel John Guthrie to offer peace. Guthrie advanced into the Cockpit Country with a strong force, and after a tense approach Cudjoe met him and Lieutenant Francis Sadler at Petty River Bottom. The treaty they signed on 1 March 1739 (Old Style) declared Cudjoe’s people free and gave them some 1,500 acres between Trelawny Town (Cudjoe’s Town) and the Cockpits, with the right to grow and sell crops and hunt. Cudjoe was to govern them for life, with Accompong, Johnny, Cuffee and Quaco to succeed him, and two white residents were to live among them. In return the Maroons were to return future runaways for a reward, help put down rebellions and fight any invader."
    facts:
      - [Cudjoe’s warriors take a barracks, "1735"]
      - [Leeward treaty, "1 March 1739 (Old Style)"]
      - [Land granted to Cudjoe’s people, "about 1,500 acres"]
