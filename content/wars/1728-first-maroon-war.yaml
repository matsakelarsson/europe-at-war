  - title: The Windward treaty and Nanny’s land
    date: "1739–1740"
    when: "1739"
    borders: "1740"
    countries: [jm, gb]
    body:
      - "Under pressure from the British and from the Leeward peace, the Windward Maroons also negotiated. Quao signed a treaty with Captain Robert Bennett, after the two men by tradition cut their fingers and mixed their blood in a calabash with rum; most accounts date it to June 1739, others to 1740. Its terms were harsher than Cudjoe’s: the Windward Maroons were to return even the runaways who had joined them in the last three years. Quao’s people settled at Crawford’s Town on the western edge of the Blue Mountains, while Nanny’s went east to the land granted to her by a patent of 1740, about 500 acres in Portland, where New Nanny Town, later Moore Town, grew up."
      - "The treaties ended the war and made the Maroons free people under their own leaders. They also bound them to the slave system: in 1760 Maroons from the eastern towns would help put down Tacky’s Revolt. Disputes over land and the terms of the treaty led Trelawny Town into the Second Maroon War of 1795–1796, after which most of its people were deported to Nova Scotia and then Sierra Leone. Toussaint Louverture is said to have cited the Jamaican Maroons as proof that Black people could force a European power to make terms."
    facts:
      - [Windward treaty, "June 1739 (Old Style), or 1740"]
      - [Nanny’s land patent, "1740, about 500 acres"]
    markers:
      - kind: treaty
        side: mar
        name: Crawford’s Town
        date: "1739–1740"
        text: Quao’s people settled here after the treaty; the town was destroyed in the 1750s and its people moved to Charles Town and Scott’s Hall.
        lonlat: [-76.670, 18.180]
        lp: l
      - kind: held
        side: mar
        name: Moore Town (New Nanny Town)
        date: "1740"
        text: Founded on the land granted to Nanny in 1740; still the main Windward Maroon town.
        lonlat: [-76.430, 18.070]
        lp: r
