id: first-maroon-war
name: First Maroon War
start: "1728"
end: "1740"
tier: B
summary: "The war between the British colony of Jamaica and the Maroons, free communities of Africans and their descendants who had escaped slavery and lived in the island’s mountains. The Windward Maroons of the Blue Mountains, led by Nanny and Quao, and the Leeward Maroons of the Cockpit Country in the west, led by Cudjoe (Kojo), raided plantations, freed enslaved people and ambushed the troops sent against them. From 1728 Governor Robert Hunter, reinforced by regular regiments, sent expeditions into the mountains; the militia took Nanny Town more than once, the last time in 1734, but each time the Maroons slipped away and fought on, while the cost of the war, martial law and the flight of planters weakened the colony. In 1739 Governor Edward Trelawny made peace: Cudjoe signed a treaty with John Guthrie on 1 March 1739 (Old Style), and Quao one with Robert Bennett later that year or in 1740. The treaties recognised the Maroons’ freedom and their lands, about 1,500 acres for Cudjoe’s people, with self-government under their own leaders and a British superintendent, in return for returning runaways, helping to put down revolts and defending the island against invaders. Nanny received a grant of 500 acres in 1740, where Moore Town now stands. She is today Jamaica’s only female National Hero."
countries: [jm, gb]
sides:
  - id: gb
    name: Great Britain (the colony of Jamaica, its militia and regular troops)
    polities: [united-kingdom, british-west-indies]
    ink: red
    moves: British moves
    success: British success
  - id: mar
    name: Jamaican Maroons (Windward Maroons under Nanny and Quao, Leeward Maroons under Cudjoe)
    polities: [jamaican-maroons]
    ink: green
    moves: Maroon moves
    success: Maroon success
notes:
  - "Jamaica used the Julian calendar (Old Style) until 1752. Cudjoe’s treaty is dated 1 March 1738 in documents of the time, which began the year on 25 March; it is 1 March 1739 by the modern reckoning of the year. The Windward treaty is dated June 1739 in some accounts and 1740 in others."
  - "Much of what is known about Nanny comes from Maroon oral tradition and a few colonial records, including the 1740 land patent in her name; British sources barely mention her. Moore Town tradition holds that she did not sign the treaty with the British."
  - "Earlier Maroon communities went back to the Spanish period and to the English conquest of 1655; the Leeward group grew from revolts of enslaved people in St Ann in 1673 and at Sutton’s estate in Clarendon in 1690."
