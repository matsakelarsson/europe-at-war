id: yi-in-jwa-rebellion
name: Yi In-jwa’s rebellion
start: "1728-04-23"
end: "1728-05"
tier: C
summary: "A revolt against King Yeongjo, also called the Musin rebellion after the year 1728 in the sixty-year cycle. Members of the radical Soron faction, driven from power after Yeongjo’s accession in 1724, and of the excluded Namin faction claimed that Yeongjo had poisoned his half-brother King Gyeongjong and was not King Sukjong’s son, and planned to replace him with Prince Milpung, a descendant of Crown Prince Sohyeon. The plan in the capital was betrayed, but in the provinces Yi In-jwa’s band, entering as a funeral party, took Cheongju on the night of 23 April 1728, killing the provincial army commander, and spread to the towns around it; in Gyeongsang, Jeong Hui-ryang raised troops and took Anui, Geochang, Hamyang and Hapcheon. A government army of some 2,300 men under O Myeong-hang, with Bak Mun-su as his aide, defeated Yi In-jwa at Anseong and Juksan at the start of May; Yi was captured and executed in Hanseong, local gentry retook Cheongju, and troops from Gyeongsang put down Jeong Hui-ryang. Yeongjo answered the revolt with his tangpyeong policy of appointing men from all factions."
