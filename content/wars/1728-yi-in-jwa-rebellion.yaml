notes:
  - Korean records date the revolt by the lunar calendar (Cheongju was taken on the 15th day of the third month, and the main rebel force was defeated around the 24th). The English Wikipedia article gives these lunar dates as if they were Gregorian; the dates here are Gregorian conversions. The last rebels in Gyeongsang were put down in May.
  - The provincial and central plotters, among them Bak Pil-hyeon in Jeolla and the Pyongan army commander Yi Sa-seong, did not rise as planned, which left the rebels in Chungcheong and Gyeongsang isolated.
