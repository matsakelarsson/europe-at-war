  - title: Karnal
    date: February 1739
    when: "1739-02-24"
    borders: "1739-02-24"
    countries: [in]
    body:
      - Muhammad Shah came out from Delhi with his nobles and took up a fortified position at Karnal, about 120 km north of the capital. His fighting men are given as about 75,000, with a huge train of servants and camp followers; Nader had about 55,000 men, mostly cavalry and musket-armed horsemen, with light guns carried on camels.
      - On 24 February 1739 one of the Mughal nobles, Saadat Khan, rode out to attack Persian raiders, and the battle spread before the rest of the Mughal army was ready. Nader drew the Mughal cavalry and war elephants into his musket and swivel-gun fire and routed them in about three hours. Saadat Khan was captured and the Mughal commander-in-chief, Khan Dauran, mortally wounded. Mughal losses are given as 8,000–10,000 by some historians and 20,000–30,000 by others, the Persian as a few thousand. Muhammad Shah, surrounded in his camp, came to Nader’s tent and submitted.
    facts:
      - [Battle of Karnal, "24 February 1739, Persian victory"]
      - [Persian army, "about 55,000"]
      - [Mughal army, "about 75,000 fighting men"]
    markers:
      - kind: battle
        side: per
        name: Battle of Karnal
        date: 24 February 1739
        text: The Mughal army was routed in about three hours. Emperor Muhammad Shah submitted to Nader.
        lonlat: [76.98, 29.69]
    arrows:
      - side: per
        label: Nader
        via: [[74.32, 31.55], [75.6, 30.9], [76.39, 30.64], [76.95, 29.75]]
