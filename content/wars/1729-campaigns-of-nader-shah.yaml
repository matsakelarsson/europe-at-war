  - title: Kabul, the Khyber and Lahore
    date: May 1738 – January 1739
    when: "1738-11-26"
    borders: "1739-01"
    countries: [af, pk]
    body:
      - The Mughal emperor Muhammad Shah had given refuge to Afghan fugitives and ignored Nader’s envoys, and his empire, still immensely rich, was weakened by quarrelling nobles and the rise of the Marathas. In May 1738 Nader marched north-east from Kandahar. He took Ghazni and, in June, Kabul, the Mughal frontier city, and spent the summer gathering supplies.
      - The governor of Peshawar held the Khyber Pass with a large army. Nader left his heavy baggage behind and led about 10,000 men on a hard march over a little-used mountain track, falling on the Mughal force at the mouth of the pass on 26 November 1738. It was routed and its commander captured. Nader took Peshawar, bridged the Indus at Attock and crossed the rivers of the Punjab; in January 1739 the governor of Lahore, Zakariya Khan, submitted and paid a large sum.
    facts:
      - [Kabul taken, "June 1738"]
      - [Battle of the Khyber Pass, "26 November 1738, Persian victory"]
    markers:
