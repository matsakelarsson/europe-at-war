  - title: Shah, and Kandahar
    date: 1736–1738
    when: "1738-03"
    borders: "1738-03"
    countries: [af, ir, az]
    body:
      - After winning back the Caucasus from the Ottomans, Nader called the notables of Persia to an assembly on the Mughan plain, where in early 1736 they asked him to take the crown in place of the infant Safavid shah Abbas III. He was crowned on 8 March 1736. As a condition he made them give up the Shi‘i practices most offensive to Sunnis, such as the cursing of the first caliphs, and tried to have Persia’s faith recognised as a fifth school of Islam, the Ja‘fari.
      - In late 1736 Nader marched from Isfahan through Kerman and Sistan against Kandahar, where Husayn Hotaki, a son of Mirwais, still ruled. The fortress was too strong to storm, so Nader built a new town, Naderabad, beside it and besieged it for a year. In March 1738 his troops stormed the citadel. Husayn surrendered and was sent to Mazandaran, many Ghilzai were moved to Khorasan, and old Kandahar was razed. Among the prisoners freed were Zulfaqar Khan and Ahmad Khan Abdali, who now entered Nader’s service. Meanwhile Nader’s son Reza Qoli took Balkh and crossed the Amu Darya against Bukhara.
    facts:
      - [Nader crowned shah, "8 March 1736"]
      - [Siege of Kandahar, "spring 1737 – March 1738"]
    markers:
      - kind: event
        side: per
        name: Mughan plain
        date: January – March 1736
        text: An assembly of Persia’s notables offered Nader the crown here.
        lonlat: [48.4, 39.85]
      - kind: siege
        side: per
        name: Kandahar
        date: 1737 – March 1738
        text: The last Hotaki stronghold was stormed after a year-long siege. Nader built Naderabad beside it, and the old city was razed.
        lonlat: [65.62, 31.59]
      - kind: taken
        side: per
        name: Balkh
        date: "1737"
        text: Taken by Nader’s son Reza Qoli, who went on to raid across the Amu Darya.
        lonlat: [66.9, 36.76]
    arrows:
