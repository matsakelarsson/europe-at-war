notes:
  - Nader’s wars against the Afghans of Isfahan (1729–1730) and against the Ottomans (1730–1735 and 1743–1746) are told in their own stories; this story follows his other campaigns.
  - The Battle of Karnal is often dated 13 February 1739 in English books, which use the Old Style calendar; the Gregorian date is 24 February.
  - The court history of Mirza Mahdi Astarabadi and the reports of the Dutch East India Company are the main sources. Numbers of soldiers and dead vary widely between them and later historians.
