  - title: Dagestan
    date: 1741–1743
    when: "1741"
    borders: "1743"
    countries: [ru, az, ir]
    body:
      - In 1738, while Nader was campaigning in the east, his brother Ebrahim had been ambushed and killed by Lezgins near Jar, on the southern edge of the Dagestan mountains. In 1741 Nader set out to punish them with an army said to number 100,000–150,000. On the way, in the forests of Mazandaran, a gunman fired at him and wounded him lightly. Nader came to suspect his eldest son, Reza Qoli, and in 1742 had him blinded, an act he later regretted.
      - Many Dagestani rulers came to submit, but the Lezgins, Avars and Laks retreated into their mountain strongholds and waged a guerrilla war. Nader’s columns were ambushed in the narrow valleys, and cold, hunger and disease killed far more of his men than the fighting; one Dagestani historian puts the Persian losses above 100,000. Nader failed to take the last fortresses and withdrew in 1743, leaving the mountains unconquered. His temper and health were now failing, and he raised taxes ever higher to pay for his wars.
    facts:
      - [Assassination attempt in Mazandaran, "1741"]
      - [Persian army, "100,000–150,000 at its height (claimed)"]
      - [Withdrawal, "1743"]
    markers:
