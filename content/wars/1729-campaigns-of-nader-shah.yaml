  - title: Kars, Kerden and Quchan
    date: 1743–1747
    when: "1747-06-20"
    borders: "1747-06-20"
    countries: [ir, iq, tr, af]
    body:
      - In 1743 Nader went to war with the Ottomans again, hoping to take Iraq and win recognition for the Ja‘fari school. He took Kirkuk but failed before Mosul after a 40-day siege, besieged Kars without success in 1744, and in August 1745 destroyed an Ottoman army near Kars. Meanwhile revolts broke out across Persia against his taxes and cruelty, and Nader put them down with mass executions and towers of skulls. The Treaty of Kerden in September 1746 restored the frontier of 1639.
      - In June 1747, camped at Fathabad near Quchan in Khorasan on his way to crush a Kurdish revolt, Nader became convinced that his guards meant to kill him and ordered the commanders of his Afghan troops, among them Ahmad Khan Abdali, to arrest them at dawn. The plot leaked, and in the night of 19–20 June officers of his guard, led by Muhammad Quli Khan Afshar and Salah Khan, broke into his tent and killed him. His nephew Ali Qoli took the throne as Adel Shah, but the empire fell apart. Ahmad Khan Abdali led the Afghan contingent home to Kandahar, where he was proclaimed king and founded the Durrani Empire, and Persia sank into decades of civil war.
    facts:
      - [Battle of Kars, "9–19 August 1745, Persian victory"]
      - [Treaty of Kerden, "4 September 1746"]
      - [Nader killed at Quchan, "19–20 June 1747"]
