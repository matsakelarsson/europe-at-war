  - title: Bukhara and Khiva
    date: 1740
    when: "1740-09"
    borders: "1740-12"
    countries: [uz, tm]
    body:
      - Back in Persia, Nader turned against the Uzbek khanates, whose Turkmen and Uzbek raiders had long carried off people from Khorasan as slaves. In the summer of 1740 he marched from Herat to Balkh and down the Amu Darya, where his engineers built a bridge at Charjui wide enough for two loaded camels, guarded by forts on both banks. The khan of Bukhara, Abu al-Fayz, met Nader’s army and was overwhelmed by its guns. He submitted, kept his throne as Nader’s vassal and gave up the lands south of the Amu Darya; Uzbek soldiers were taken into Nader’s army.
      - Ilbars Khan of Khiva had killed Nader’s envoys. Nader marched down the river into Khwarazm, defeated the Khivan army near Pitnak and besieged Ilbars in the fortress of Khanqah, where he surrendered. Ilbars was executed with some twenty of his amirs in revenge for the envoys, and a ruler chosen by Nader was put in his place. The campaign, some 3,000 km of marching, brought Persian power in Central Asia to a height not seen for centuries, but revolts soon broke out against Nader’s appointees.
    facts:
      - [Bukhara submits, "1740"]
      - [Ilbars Khan of Khiva executed, "1740"]
    markers:
