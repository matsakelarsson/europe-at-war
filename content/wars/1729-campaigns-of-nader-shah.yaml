id: campaigns-of-nader-shah
name: Campaigns of Nader Shah
start: "1729-05"
end: "1747-06-20"
tier: A
summary: The wars of Nader, an Afshar Turkmen soldier who rose from leading a band in northern Khorasan to be shah of Persia (1736–1747) and the most feared conqueror of his age. After expelling the Afghans from Persia in 1729 and winning back the west from the Ottomans, he subdued the Abdali Afghans of Herat, made himself shah, took Kandahar, the last Hotaki stronghold, in 1738 and invaded Mughal India. He routed the Mughal army at Karnal in 1739, sacked Delhi and carried off the Peacock Throne. In 1740 he forced Bukhara and Khiva to submit. His later years were spent in a costly war in Dagestan, a new war with the Ottomans and the bloody suppression of revolts against his heavy taxes, until his own officers killed him in 1747 and his empire fell apart.
