  - title: The sack of Delhi
    date: March – May 1739
    when: "1739-03-22"
    borders: "1739-05"
    countries: [in, pk, af]
    body:
      - Nader entered Delhi with Muhammad Shah on 20 March 1739. The next evening a rumour that Nader had been killed set off riots in which some 900 Persian soldiers were killed. On 22 March Nader ordered his troops to take revenge. In about six hours, in the Chandni Chowk and the surrounding quarters, they killed men, women and children; estimates of the dead range from about 20,000 to 30,000, and some contemporary accounts give far more. As many as 10,000 women and children were carried off as slaves. The killing stopped only when Muhammad Shah pleaded for mercy.
      - Nader then stripped the Mughal treasury and the nobles. He took the Peacock Throne and the Koh-i-Noor and Darya-ye Noor diamonds, with booty estimated at up to 700 million rupees, and was able to remit Persia’s taxes for three years. He married his son to a Mughal princess, restored Muhammad Shah to his throne, and took for Persia all the Mughal lands west of the Indus. In May 1739 he left Delhi. On the way back through the Punjab his overloaded columns were harried by Sikh bands, who seized part of the booty and freed many captives.
    facts:
      - [Massacre in Delhi, "22 March 1739, 20,000–30,000 killed (estimates)"]
      - [Booty, "up to 700 million rupees (estimate)"]
      - [Nader leaves Delhi, "May 1739"]
    markers:
      - kind: event
        side: per
        name: Delhi
        date: 22 March 1739
        text: Nader’s troops massacred the people of the city for six hours. Estimates of the dead range from 20,000 to 30,000.
        lonlat: [77.23, 28.65]
    arrows:
