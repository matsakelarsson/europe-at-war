steps:
  - title: Herat and the Abdalis
    date: 1729–1732
    when: "1729-05"
    borders: "1732-02"
    countries: [af, ir]
    body:
      - The Abdali Afghans of Herat had ruled the city since 1717 and raided Khorasan. In May 1729, before marching against the Hotaki Afghans in Isfahan, Nader met their cavalry near Kafer Qal‘eh, west of Herat, and in a series of battles his musketeers and guns broke their charges. Their leader, Allahyar Khan, submitted and was left as governor of Herat, and many Abdalis joined Nader’s army.
      - In 1730, while Nader fought the Ottomans in the west, the Abdalis rose again under Zulfaqar Khan, with backing from Husayn Hotaki in Kandahar, and besieged Nader’s brother Ebrahim in Mashhad. Nader hurried back from Tabriz and in April 1731 laid siege to Herat. After months of fighting the city surrendered, rose again, and finally gave in early in 1732; Zulfaqar Khan fled to Kandahar and Ebrahim took Farah. Nader moved thousands of Abdali families to Khorasan and enlisted their fighters. Zulfaqar Khan and his young brother Ahmad Khan were held as prisoners by Husayn in Kandahar.
    facts:
      - [Battle of Kafer Qal‘eh, "May 1729, Persian victory"]
      - [Siege of Herat, "April 1731 – early 1732"]
    markers:
