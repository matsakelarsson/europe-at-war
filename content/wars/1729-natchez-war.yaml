steps:
  - title: Fort Rosalie, 28 November 1729
    date: November – December 1729
    when: "1729-11-28"
    borders: "1729-11-28"
    countries: [us]
    body:
      - "The French had built Fort Rosalie on the bluff above the Mississippi in 1716, after a first clash with the Natchez, and the Company of the Indies granted tobacco concessions around it, worked by enslaved Africans. Disputes over cattle, debts and killings had led to fighting in 1722 and 1723, when Governor Bienville burned Natchez villages. The Great Sun and his brother Tattooed Serpent, the war chief, had kept the peace with the French, but Tattooed Serpent died in 1725 and the Great Sun in 1728. In 1729 the commandant of the fort, the Sieur de Chépart, demanded the land of the village of White Apple, where the Natchez had their temple and the graves of their ancestors, for his own plantation."
      - "On the morning of 28 November 1729 Natchez men came to the fort and the plantations as if to trade, and at a signal attacked. They killed almost all the Frenchmen at the post, about 20 escaped, and Chépart was among the dead. A year later the dead were counted as 138 men, 35 women and 56 children, about 230 in all. Most of the women and children and the enslaved Africans were taken captive, and some of the enslaved joined the Natchez. In December the Yazoo and Koroa, to the north, killed the Jesuit missionary and the garrison of Fort St. Pierre on the Yazoo River."
      - "The news caused panic in New Orleans, the capital of a colony that depended on the labour of thousands of enslaved Africans. Governor Étienne Périer sent armed enslaved men with French soldiers to destroy the village of the Chaouacha, a small nation below the city that had no part in the rising, to set Africans and Native peoples against each other, and called on the Choctaw for help."
    facts:
      - [Attack on Fort Rosalie, "28 November 1729"]
      - [French killed, "about 230 (138 men, 35 women, 56 children)"]
      - [Fort St. Pierre destroyed, "December 1729"]
