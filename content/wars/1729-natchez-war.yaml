id: natchez-war
name: Natchez War
start: "1729-11-28"
end: "1731-10"
tier: B
summary: "The rising of the Natchez against French Louisiana and the French war that followed. The Natchez, whose towns lay along St. Catherine Creek near the Mississippi, were among the last peoples of the river ruled by a hereditary chief, the Great Sun. French tobacco plantations worked by enslaved Africans had spread over their land, and in 1729 the commandant of Fort Rosalie demanded the village of White Apple, with its temple and ancestral graves, for his own plantation. On 28 November 1729 the Natchez rose, killing about 230 French men, women and children at the fort and the plantations and taking the other women and children and most of the enslaved Africans captive; the Yazoo destroyed the French post on their river. The governor, Étienne Périer, struck back with Choctaw allies, who attacked the Natchez in January 1730, and a French siege of the Natchez forts; the Natchez escaped across the Mississippi. In January 1731 Périer besieged their new fort near Sicily Island, and about 500 Natchez who surrendered, among them the Great Sun, were shipped to Saint-Domingue and sold as slaves. The others found refuge among the Chickasaw, the Muscogee and the Cherokee, and the war led on to the French wars against the Chickasaw."
countries: [us]
sides:
  - id: nat
    name: Natchez, with the Yazoo and Koroa
    polities: [natchez]
    ink: brown
    moves: Natchez moves
    success: Natchez success
  - id: fr
    name: French Louisiana, with the Choctaw, Tunica and other allies
    polities: [new-france, choctaw]
    ink: blue
    moves: French and Choctaw moves
    success: French and Choctaw success
notes:
  - Louisiana was then governed by the Company of the Indies, which held the colony’s trade monopoly; it gave Louisiana back to the crown after the war.
  - Most of what is known comes from French officials, soldiers and missionaries, among them Antoine-Simon Le Page du Pratz, who had lived among the Natchez. Numbers, especially of Natchez losses, are approximate. Enslaved Africans fought on both sides; the French feared above all an alliance between them and the Native nations.
  - The Natchez are also known for the earlier clashes of 1716, 1722 and 1723, sometimes counted as the first, second and third Natchez wars; this entry covers the war of 1729–1731.
