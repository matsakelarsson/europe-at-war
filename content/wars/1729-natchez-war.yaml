  - title: Sicily Island and the dispersal of the Natchez
    date: 1731
    when: "1731-01-21"
    borders: "1731-01-25"
    countries: [us, ht]
    body:
      - "With reinforcements from France, Périer led an army up the Mississippi and the Red and Black rivers to the new Natchez fort near today’s Sicily Island, and besieged it from 21 January 1731. On 25 January some 45 men and 450 women and children surrendered, among them the Great Sun; the rest escaped in the night. Périer shipped the prisoners to Saint-Domingue, where they were sold as slaves."
      - "The Natchez who escaped fought on. In October 1731 they attacked the French post of Natchitoches on the Red River, where Louis Juchereau de St. Denis drove them off with heavy losses. Most of the survivors found refuge among the Chickasaw, and later among the Muscogee and the Cherokee, where they lived as Natchez towns for generations; their descendants live today among the Muscogee (Creek) and Cherokee nations. The Company of the Indies, ruined by the war, gave Louisiana back to the crown, and the Chickasaw refusal to hand over the refugees led to the French wars against them in 1736 and 1739–1740."
    facts:
      - [Siege of the Sicily Island fort, "21–25 January 1731"]
      - [Natchez sent to Saint-Domingue as slaves, "about 500"]
      - [Attack on Natchitoches, "October 1731"]
