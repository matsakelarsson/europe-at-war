  - title: The siege of the Natchez forts
    date: January – February 1730
    when: "1730-01-27"
    borders: "1730-02-15"
    countries: [us]
    body:
      - "The Choctaw, who saw a chance to win captives, goods and French favour, struck first. On 27 January 1730 several hundred Choctaw warriors, with the French officer Jean-Paul Le Sueur, attacked the Natchez villages, killed about 100 Natchez and freed many of the French women and children and enslaved Africans held there."
      - "French troops, militia and Tunica warriors under Henri de Louboëy arrived from New Orleans in February and besieged the two forts the Natchez had built near their Grand Village, which the French called Fort de la Valeur and Fort de la Farine. Enslaved Africans fought on both sides, some helping to defend the forts. After several weeks the Natchez agreed to give up their remaining captives if the French drew back their guns, and in the night at the end of February they slipped out of the forts and crossed the Mississippi. The French rebuilt Fort Rosalie, and the Choctaw demanded payment for the captives they had freed."
    facts:
      - [Choctaw attack, "27 January 1730"]
      - [Natchez killed by the Choctaw, "about 100"]
      - [Natchez escape, "end of February 1730"]
