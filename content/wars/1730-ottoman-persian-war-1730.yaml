steps:
  - title: Western Iran won back, the Caucasus lost
    date: 1730–1732
    when: "1730"
    borders: "1732-01"
    countries: [ir, am, ge, az]
    body:
      - After driving the Afghans from Isfahan, Nader demanded that the Ottomans give back the lands they had taken in the 1720s. When they refused, he attacked in the spring of 1730 and in a few months retook Hamadan, Kermanshah and the rest of western Iran, and Tabriz and southern Azerbaijan. Then news came that the Abdali Afghans of Herat had risen and were besieging his brother Ebrahim in Mashhad, and Nader had to march east, where the fighting took fourteen months.
      - In his absence Tahmasp II, jealous of his general, led his own campaign against Erivan in 1731. He was beaten, lost Nader’s gains in the west, and in January 1732 made a treaty with Ahmad Pasha of Baghdad that gave the Ottomans Georgia, Armenia and the eastern Caucasus while Persia kept Tabriz. Nader denounced the treaty, and in 1732 in Isfahan he deposed Tahmasp, reportedly after showing him drunk to the courtiers, and put Tahmasp’s infant son on the throne as Abbas III, with himself as regent.
    facts:
      - [Nader retakes western Iran, "1730"]
      - [Treaty with Ahmad Pasha, "January 1732"]
      - [Tahmasp II deposed, "1732"]
