id: ottoman-persian-war-1730
name: Ottoman–Persian War (1730–1735)
start: "1730"
end: "1736-09-24"
tier: B
summary: The war in which Nader, the general of the restored Safavid shah Tahmasp II, won back the lands the Ottomans had taken from Persia during the Afghan invasion. In 1730 he cleared western Iran and Azerbaijan, but while he was fighting the Abdali Afghans in the east, Tahmasp lost a campaign and gave up the Caucasus in a treaty, and Nader deposed him in 1732. Nader besieged Baghdad in 1733 and suffered his only defeat in battle against Topal Osman Pasha, then defeated and killed him at Kirkuk. In 1735 his victory at Yeghevard won back Armenia and Georgia, and the Treaty of Constantinople (1736) restored the frontier of 1639.
countries: [ir, iq, az, am, ge, tr]
sides:
  - id: per
    name: Persia (Nader for the Safavid shahs)
    polities: [persia]
    ink: green
    moves: Persian moves
    success: Persian success
  - id: ot
    name: Ottoman Empire
    polities: [ottoman]
    ink: teal
    moves: Ottoman moves
    success: Ottoman success
notes:
  - Army sizes come mostly from Nader’s court historian Mirza Mahdi Astarabadi and from later Persian works, and are likely exaggerated for the Ottoman side.
  - In March 1735 Russia, by the Treaty of Ganja, agreed to give back the Caspian provinces it still held, and soon went to war with the Ottomans itself.
