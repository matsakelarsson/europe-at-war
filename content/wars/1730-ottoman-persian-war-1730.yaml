  - title: Baghdad and Kirkuk
    date: 1733
    when: "1733-07"
    borders: "1733-12"
    countries: [iq]
    body:
      - Nader planned to take Baghdad and exchange it for the lost Caucasian provinces. In February 1733 he crossed the Tigris with a few thousand men and beat the army of Ahmad Pasha, the governor of Baghdad, and then blockaded the city with a ring of towers. Famine and disease spread inside; a later historian put the dead at more than 100,000. In July a relief army under Topal Osman Pasha, the former grand vizier, came down the Tigris. Nader met it near Samarra and was defeated in a long battle in the heat, losing some 30,000 men. It was the only defeat of his career, and the siege was lifted.
      - Revolts broke out at once in Persia, but Nader rebuilt his army within three months. On 24–26 October 1733 he met Topal Osman again near Kirkuk and destroyed his army; Topal Osman was killed. Nader could not follow up the victory, because a rebellion led by Muhammad Khan Baluch had spread in the south, and in December he made a truce with Ahmad Pasha and marched to Fars to crush it.
    facts:
      - [Siege of Baghdad, "17 January – 24 July 1733"]
      - [Defeat near Samarra, "July 1733"]
      - [Battle of Kirkuk, "24–26 October 1733, Persian victory"]
    markers:
