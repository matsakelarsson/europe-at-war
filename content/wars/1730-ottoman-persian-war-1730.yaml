  - title: Yeghevard and the Caucasus
    date: 1734–1736
    when: "1735-06-19"
    borders: "1736-09-24"
    countries: [az, am, ge, ir]
    body:
      - In 1734 Nader turned north. He took Shamakhi, the capital of Shirvan, in August and on 3 November arrived before Ganja, which he besieged, while other troops invested Tiflis and Erivan. In the spring of 1735 a new Ottoman army of some 80,000 under Köprülüzade Abdullah Pasha marched from Kars to relieve the fortresses. On 19 June 1735 Nader, with only his advance guard of about 15,000, attacked it at Yeghevard near Erivan and routed it; Abdullah Pasha was killed, and the Ottoman losses are put at 40,000–50,000 killed and wounded.
      - With no hope of relief, Ganja, Tiflis and Erivan surrendered in the summer, and Armenia, Georgia and the eastern Caucasus were Persian again. Russia, which had agreed in March 1735 to hand back Baku and Derbent, was about to go to war with the Ottomans, and the Porte made peace. In January 1736 an assembly on the Mughan plain proclaimed Nader shah in place of the infant Abbas III. By the Treaty of Constantinople of 24 September 1736 the Ottomans recognised him and gave up the Caucasus, restoring roughly the frontier of the Treaty of Zuhab.
    facts:
      - [Shamakhi taken, "August 1734"]
      - [Battle of Yeghevard, "19 June 1735, Persian victory"]
      - [Treaty of Constantinople, "24 September 1736"]
