notes:
  - "The main sources are Danish company records and the account of the French planter Pierre Pannet; the rebels left no record of their own, and accounts differ on whether they meant to free all the enslaved or to rule the island and keep other Africans in bondage. Some 150 Akwamu are usually said to have taken part; other Africans on the island did not all join them, and some sided with the planters."
  - Tradition places the death of the last rebels, who are said to have leapt from the cliffs, at Ram Head at the southern tip of the island, where a law of December 2022 directed the National Park Service to place a plaque commemorating the rising; the records do not say clearly where the suicides took place.
