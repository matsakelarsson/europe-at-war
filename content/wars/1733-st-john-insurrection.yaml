id: st-john-insurrection
name: Akwamu insurrection on St John
start: "1733-11-23"
end: "1734-08-25"
tier: C
summary: "The rising of enslaved Akwamu people on St John (Sankt Jan) in the Danish West Indies, which held most of the island for six months. The Danish West India and Guinea Company had settled St John in 1718, and by 1733 its 109 plantations held 1,087 enslaved Africans and 206 Europeans. Many of the enslaved were Akwamu from the Gold Coast, some of them former nobles and soldiers, sold after their state was overthrown in 1730. In 1733 drought, a hurricane and insect plagues brought hunger, and the colony answered growing flight with a harsh slave code. On 23 November 1733 the Akwamu rose: men carrying wood into the company’s fort at Coral Bay drew hidden cane knives, killed most of the garrison and fired the signal gun, and rebels led by King June (Juni), Kanta, King Claes, Breffu, Prince Akwasi and others took the estates around Coral Bay and much of the north shore, killing many of the colonists, while other planters and some of the enslaved held out at the fortified Durloo plantation, which the rebels nearly took twice, and many escaped by boat to St Thomas. Danish soldiers sent from St Thomas were driven off, and some 60 British troops from Tortola were ambushed as they landed and withdrew. The Danes then appealed to France, and on 23 April 1734 two ships from Martinique landed some 400 French and Swiss troops, who restored the planters’ control by late May; many rebels, Breffu among them, took their own lives rather than be captured. The militia declared the rising over on 25 August 1734, and captured rebels were executed. Many planters moved to St Croix, which Denmark had bought from France in 1733. The rising is remembered in the US Virgin Islands as a fight for freedom."
countries: [vi, dk, fr]
