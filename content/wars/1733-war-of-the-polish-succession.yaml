id: war-of-the-polish-succession
name: War of the Polish Succession
start: "1733"
end: "1735"
tier: B
summary: After Augustus II died in 1733, most of the Polish nobility elected Stanisław Leszczyński with French backing, while Russia and Austria put Augustus III of Saxony on the throne. Russian troops took Danzig, where Stanisław had taken refuge, in 1734, and the war between France, Spain and Sardinia and the Emperor was fought mostly in the Rhineland and Italy. The peace agreed at Vienna in 1735 left Augustus III king of Poland and gave Stanisław the Duchy of Lorraine for life.
countries: [pl, de, ru, at, fr, it, es]
sides:
  - id: aug
    name: Augustus III, Russia and the Emperor
    polities: [saxony, russia, habsburg, milan]
    ink: green
    moves: Moves by Augustus III’s allies
    success: Success for Augustus III’s allies
  - id: sta
    name: Stanisław Leszczyński, France and allies
    polities: [france, spain, savoy, parma]
    ink: navy
    moves: French, Spanish and Sardinian moves
    success: French, Spanish and Sardinian success
notes:
  - The preliminary peace of 1735 was confirmed in the Treaty of Vienna in 1738.
