  - title: The Peace of Vienna
    date: 1735–1738
    when: "1735-10-03"
    borders: "1738-11-18"
    countries: [fr, pl, it, at, de, es, ru]
    body:
      - By 1735 Austria, with no help from Britain or the Dutch Republic, had lost almost all its Italian lands except Mantua, and a Russian corps sent to help it reached the Rhine too late to fight. Preliminaries of peace were agreed at Vienna on 3 October 1735, and after long negotiations the Treaty of Vienna was signed on 18 November 1738. Augustus III kept Poland. Stanisław gave up the crown and received the duchies of Lorraine and Bar for life, after which they were to pass to France, as they did when he died in 1766. Lorraine’s own duke, Francis Stephen, who married Maria Theresa in 1736, received Tuscany instead when the last Medici grand duke died in 1737.
      - Don Carlos was recognised as king of Naples and Sicily, and gave up Parma and Piacenza to the Emperor, though he took the Farnese art collections to Naples with him. Charles Emmanuel of Sardinia gained Novara and Tortona from the Duchy of Milan, which returned to Austria. France also recognised the Pragmatic Sanction, the law by which Charles VI wanted his daughter Maria Theresa to inherit all his lands. When he died in 1740, that promise did not hold.
    facts:
      - [Preliminary peace, "Vienna, 3 October 1735"]
      - [Treaty of Vienna, "18 November 1738"]
      - [Changes, "Lorraine to Stanisław (then France), Tuscany to Francis Stephen, Naples and Sicily to Don Carlos, Parma to Austria"]
    markers:
      - kind: treaty
        name: Treaty of Vienna
        date: 18 November 1738
        text: It confirmed the preliminaries of 1735, which had settled the war three years before, after long haggling over the details.
        lonlat: [16.37, 48.21]
      - kind: event
        name: Lunéville
        date: 1737–1766
        text: Stanisław held court here as Duke of Lorraine. When he died in 1766 Lorraine became part of France.
        lonlat: [6.496, 48.591]
      - kind: event
        name: Florence
        date: July 1737
        text: Gian Gastone, the last Medici grand duke, died, and Tuscany passed to Francis Stephen of Lorraine.
        lonlat: [11.256, 43.77]
    areas:
      - style: gained
        label: To Stanisław for life, then to France (approximate)
        atoms: [FR-54, FR-55, FR-88, FR-57!]
      - style: gained
        label: Novara, to Sardinia
        atoms: [IT-NO]
