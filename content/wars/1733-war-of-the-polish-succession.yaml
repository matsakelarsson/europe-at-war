steps:
  - title: Danzig and Philippsburg
    date: February 1733 – July 1734
    when: "1733-02-01"
    borders: "1734-07-18"
    countries: [pl, ru, de, fr, at]
    body:
      - When Augustus II, king of Poland and elector of Saxony, died on 1 February 1733, the Polish nobles gathered near Warsaw elected Stanisław Leszczyński, who had been king under Swedish protection in 1704–1709 and whose daughter was married to Louis XV. Russia and Austria backed Augustus’s son, Frederick Augustus of Saxony; a Russian army crossed the border, and on 5 October a minority of nobles under its protection elected him Augustus III. Stanisław took refuge in Danzig, which Russian troops under Field Marshal Münnich, later joined by the Saxons, besieged from February 1734. A French force of about 2,000 men landed at the mouth of the Vistula in May but had to surrender, and the city capitulated at the end of June. Stanisław had escaped days before, disguised as a peasant.
      - France declared war on the Emperor Charles VI on 10 October 1733, allied with Spain and with Charles Emmanuel III of Sardinia, who was promised Milan. A French army crossed the Rhine and took Kehl at the end of October, and in 1734 it besieged Philippsburg. Prince Eugene, now seventy, could not gather an army strong enough to relieve it. The French commander, the Duke of Berwick, was killed by a cannonball in the trenches on 12 June, but the fortress surrendered on 18 July. After that the Rhine saw little fighting, and the war was decided in Italy.
    facts:
      - [Elections, "Stanisław on 12 September, Augustus III on 5 October 1733"]
      - [Siege of Danzig, "February – June 1734"]
      - [Siege of Philippsburg, "1734; Berwick killed on 12 June"]
    markers:
      - kind: event
        name: Royal elections
        date: September – October 1733
        text: Most of the nobility chose Stanisław at the electoral field of Wola. A smaller assembly, protected by Russian troops, elected Augustus III across the Vistula.
        lonlat: [21.01, 52.23]
      - kind: siege
        side: aug
        name: Danzig
        date: February – June 1734
        text: The great Baltic port held out for Stanisław for four months. After its surrender it had to accept Augustus III.
        lonlat: [18.646, 54.352]
      - kind: taken
        side: sta
        name: Kehl
        date: October 1733
        text: The fortress across the Rhine from Strasbourg fell within days of France’s declaration of war.
        lonlat: [7.81, 48.573]
        lp: l
      - kind: siege
        side: sta
        name: Philippsburg
        date: May – July 1734
        text: Berwick, the victor of Almansa, was killed here. The fortress fell to the French under Marshal d’Asfeld.
        lonlat: [8.455, 49.234]
    arrows:
      - side: aug
        label: Münnich
        phase: 1
        via: [[21.0, 52.3], [19.8, 53.3], [18.7, 54.28]]
      - side: sta
        phase: 1
        via: [[7.75, 48.58], [8.15, 48.95], [8.42, 49.2]]
  - title: Bitonto, Parma and Guastalla
    date: November 1733 – July 1735
    when: "1733-11-03"
    borders: "1735-07-03"
    countries: [it, at, fr, es]
    body:
      - In Italy the Austrians were caught unprepared. In the autumn of 1733 a French and Sardinian army under Charles Emmanuel and the aged Marshal Villars overran the Duchy of Milan, and only the fortress of Mantua held out. In 1734 the Austrians under Count Mercy came back over the Alps and pressed the allies back to Parma, but on 29 June Mercy was killed attacking their lines outside the city, at San Pietro or La Crocetta, in a battle that cost both sides heavily. On 19 September his successor, Count Königsegg, attacked the allies again at Guastalla on the Po and was beaten, and the Austrians fell back on Mantua and the Tyrol.
      - Meanwhile Elisabeth Farnese’s son Don Carlos, Duke of Parma since 1731, led a Spanish army of some 21,000 men south through the Papal States to claim Naples. He entered the city in May 1734, and on 25 May the Count of Montemar beat the outnumbered Austrians at Bitonto in Apulia. Gaeta fell in August and Capua in November, and Spanish troops crossed to Sicily, where the last Austrian fortresses fell in 1735. Philip V gave his son both kingdoms, and Carlos was crowned king of Sicily at Palermo on 3 July 1735. For the first time in more than two centuries Naples had a king who lived there.
    facts:
      - [Battle of San Pietro, "29 June 1734, Franco-Sardinian victory"]
      - [Battle of Bitonto, "25 May 1734, Spanish victory"]
      - [Battle of Guastalla, "19 September 1734, Franco-Sardinian victory"]
    markers:
      - kind: taken
        side: sta
        name: Milan
        date: November – December 1733
        text: The allies entered the city on 3 November; its castle held out until the turn of the year.
        lonlat: [9.19, 45.464]
      - kind: held
        side: aug
        name: Mantua
        date: 1733–1735
        text: The great fortress on the Mincio was the only important stronghold in Lombardy the Austrians kept.
        lonlat: [10.792, 45.156]
      - kind: battle
        side: sta
        name: Battle of San Pietro
        date: 29 June 1734
        text: Mercy, in poor health and half-blind, led the attack on the French and Sardinian lines north of Parma and was killed early in the fighting.
        lonlat: [10.31, 44.82]
        lp: l
      - kind: battle
        side: sta
        name: Battle of Guastalla
        date: 19 September 1734
        text: Königsegg, who had surprised the allies at Quistello four days earlier, attacked thinking he faced only a rearguard, and was driven off.
        lonlat: [10.655, 44.92]
      - kind: taken
        side: sta
        name: Naples
        date: May 1734
        text: Don Carlos entered the city with hardly any resistance; the Austrian viceroy had withdrawn to Apulia.
        lonlat: [14.25, 40.85]
      - kind: battle
        side: sta
        name: Battle of Bitonto
        date: 25 May 1734
        text: Montemar’s Spanish army routed the Austrians, ending organised resistance on the mainland outside a few fortresses.
        lonlat: [16.69, 41.108]
      - kind: siege
        side: sta
        name: Gaeta
        date: May – August 1734
        text: The sea fortress was blockaded from the start of the campaign and surrendered after a short siege.
        lonlat: [13.57, 41.21]
        lp: l
