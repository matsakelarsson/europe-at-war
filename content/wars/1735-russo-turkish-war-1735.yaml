        side: ru
        name: Battle of Stavuchany
        date: 28 August 1739
        text: Münnich feinted at the Ottoman entrenchments, then bridged the Shulanets on his right and turned their flank. The Ottomans fled, leaving their camp and guns.
        lonlat: [26.38, 48.44]
        lp: l
      - kind: taken
