notes:
  - Dates are New Style (Gregorian). Russia used the Julian calendar, eleven days behind, so Russian sources date the battle of Stavuchany 17 August 1739, for example, and the Treaty of Belgrade 18 (29) September.
  - Austria’s war of 1737–1739 against the Ottomans in Serbia, Bosnia and Wallachia is only touched on here.
