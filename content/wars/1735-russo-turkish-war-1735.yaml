  - title: Ochakov and the plague years
    date: 1737–1738
    when: "1737-04"
    borders: "1737-07-14"
    countries: [ua, ru, tr, at]
    body:
      - In 1737 Münnich marched on Ochakov, the Ottoman fortress where the Dnieper and the Bug flow into the sea, with about 70,000 men. On the third day of the siege, in July, red-hot shot set the town on fire, the powder magazine blew up, killing thousands, and the garrison of some 20,000 surrendered, though many were cut down in the slaughter that followed. An Ottoman attempt to retake the fortress that autumn failed. Lacy invaded the Crimea again from the east, bridging the Henichesk strait with casks to march down the Arabat Spit behind the khan’s army at Perekop, and burned Karasubazar before lost supplies and sickness drove him back.
      - Austria entered the war that summer, but after early gains in Serbia its armies were beaten in Bosnia, and peace talks at Nemyriv in Poland broke down. In 1738 plague spread through the Black Sea lands and into Moldavia, Poland and Ukraine. Münnich’s march towards the Dniester came to nothing, and Lacy’s third raid into the Crimea, across the shallows of the Syvash, achieved little. In September the Russians abandoned Ochakov and Kinburn rather than lose their garrisons to plague and a new Ottoman attack.
    facts:
      - [Ochakov taken, July 1737]
      - [Ochakov and Kinburn abandoned, September 1738]
    markers:
