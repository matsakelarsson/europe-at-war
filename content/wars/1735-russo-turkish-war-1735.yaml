steps:
  - title: Perekop, Bakhchisarai and Azov
    date: 1735–1736
    when: "1735-10"
    borders: "1736-07-01"
    countries: [ua, ru, tr]
    body:
      - Crimean Tatar raids on the Hetmanate, and the khan’s march across the North Caucasus in 1735 to fight Persia for the Ottomans, gave Russia its pretext. The Polish succession had been settled in Russia’s favour, and Persia had become an ally when Russia handed back its Caspian conquests. Empress Anna’s government struck first. A raid on the Crimea under General Mikhail Leontiev set out too late in October 1735, was caught by cold and snow on the steppe and turned back, having lost some 9,000 of its 40,000 men.
      - In the spring of 1736 Field Marshal Burkhard Christoph von Münnich led about 54,000 men south along the Dnieper. They stormed the Perekop lines at the end of May and, for the first time, a Russian army entered the Crimea. It burned Gözleve (Yevpatoria) and the khan’s capital, Bakhchisarai, but with dysentery spreading and food and water short Münnich turned back after a month. About half his army was lost, only some 2,000 men of them in battle. Meanwhile General Peter Lacy, helped by the Don flotilla, took Azov, and another detachment took Kinburn at the mouth of the Dnieper.
    facts:
      - [Russian commanders, Münnich and Lacy]
      - [Münnich’s losses in 1736, "About half his army, mostly to disease"]
