  - title: Stavuchany and the Peace of Belgrade
    date: 1739
    when: "1739-07"
    borders: "1739-10-03"
    countries: [ua, md, ro, rs, ru, tr, at]
    body:
      - In 1739 Münnich took the war west. He led about 60,000 men across Polish territory and over the Dniester, and on 28 August, near Khotyn, he outflanked and routed an Ottoman and Tatar army under Veli Pasha at Stavuchany. Münnich reported only a handful of dead, but other estimates put Russian casualties at about 2,000. Khotyn surrendered two days later. Münnich crossed the Pruth, entered the Moldavian capital, Iași, on 14 September and pressed the boyars to accept Russian rule.
      - Austria, meanwhile, had been beaten at Grocka in July. On 18 September it made peace at Belgrade, giving up Belgrade, northern Serbia and Oltenia. Threatened by Sweden and left on its own, Russia accepted terms the French ambassador, the Marquis de Villeneuve, had negotiated for it, signed in Belgrade the same day and confirmed at Niš on 3 October. Russia kept Azov, but only as a razed fortress in an empty border zone, and it could keep no ships on the Black Sea. Khotyn and Moldavia went back to the Ottomans, and Kabarda in the Caucasus was to stay independent between the two empires.
    facts:
      - [Battle of Stavuchany, "28 August 1739, Russian victory"]
      - [Treaty of Belgrade, "18 September 1739, Austria and, as a preliminary, Russia"]
      - [Treaty of Niš, "3 October 1739"]
