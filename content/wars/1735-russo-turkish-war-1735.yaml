id: russo-turkish-war-1735
name: Russo-Turkish War of 1735–1739
start: "1735"
end: "1739-10-03"
tier: B
summary: A war in which Russia, joined by the Habsburg Monarchy in 1737, fought the Ottoman Empire and the Crimean Khanate for the northern shore of the Black Sea. Russian armies took Azov and Ochakov, burned the Crimean capital and beat the Ottomans at Stavuchany in 1739, but lost tens of thousands of men to disease. After Austria made a separate peace, the treaties of Belgrade and Niš left Russia little more than Azov, with its walls razed, and no right to keep ships on the Black Sea.
