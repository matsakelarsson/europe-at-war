        side: ru
        name: Ochakov
        date: July 1737
        text: Fires started by Russian shot reached the powder magazine, and after the explosion the garrison surrendered. The Russians abandoned the fortress the next year.
        lonlat: [31.54, 46.62]
      - kind: event
