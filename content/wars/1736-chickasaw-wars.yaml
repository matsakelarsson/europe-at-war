notes:
  - The account rests mainly on French reports, among them Bienville’s, and on the memory of the Chickasaw, who celebrated Ackia as a great victory. The sites of Ackia and Ogoula Tchetoka lie in and near Tupelo; the location of Ackia has been debated.
  - The wider conflict between the Chickasaw and the French and Choctaw is sometimes dated from 1721 to 1763. A French expedition of 1752 often mentioned in older works probably never took place, though the Choctaw did attack the Chickasaw that year.
