id: chickasaw-wars
name: Chickasaw Wars
start: "1736-03"
end: "1740"
tier: C
summary: "Two French campaigns against the Chickasaw, whose towns stood near today’s Tupelo, Mississippi. The Chickasaw traded with the British of Carolina, raided French traffic on the Mississippi and had taken in Natchez refugees after the Natchez War, and Governor Jean-Baptiste Le Moyne de Bienville of Louisiana, encouraged by the Choctaw, set out to crush them. In 1736 two armies were to meet at the Chickasaw towns. The northern one, French troops and Illinois and other allied warriors from the Illinois country under Pierre d’Artaguiette, arrived first and attacked the village of Ogoula Tchetoka on 25 March 1736; it was routed, and d’Artaguiette, the Jesuit Antoine Sénat, François-Marie Bissot de Vincennes and other prisoners were burned to death. Bienville, coming up the Tombigbee from Mobile with about 1,200 French soldiers and Choctaw warriors, attacked the fortified town of Ackia on 26 May 1736 and was beaten off with heavy losses. In 1739 Bienville gathered a larger army, with troops and allied warriors from Canada and the Illinois country under Charles Le Moyne de Longueuil and Pierre-Joseph Céloron de Blainville, at Fort de l’Assomption on the Chickasaw Bluffs (today’s Memphis), but sickness and the impossibility of hauling his artillery through the forest stopped him, and in the spring of 1740 Céloron made a peace with the Chickasaw that left them undefeated. The Chickasaw remained allies of the British, and Choctaw and Chickasaw raids on each other went on until France left North America in 1763."
