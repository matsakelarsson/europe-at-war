  - title: Grocka and the Peace of Belgrade
    date: July – September 1739
    when: "1739-07-21"
    borders: "1739-09-18"
    countries: [rs, ro, at, hu, tr]
    body:
      - In 1739 Count George Oliver Wallis took command with about 40,000 men. Hearing that the main Ottoman army under Grand Vizier Elhac Ivaz Mehmed Pasha was camped at Grocka, on the Danube below Belgrade, he hurried his cavalry forward. On the morning of 22 July they came out of a narrow defile into the Ottoman army drawn up on the hills, and were shot down as they arrived; the infantry that followed fought all day under fire from above. That night Wallis retreated to Belgrade, and the Ottomans followed and laid siege to the city.
      - Vienna sent Count Wilhelm Reinhard von Neipperg to make peace. Isolated in the grand vizier’s camp and relying on the French ambassador, the Marquis de Villeneuve, he agreed on 1 September to give up Belgrade, not knowing that the emperor had meanwhile decided to hold it. The Treaty of Belgrade, signed on 18 September, returned Belgrade, northern Serbia and the strip of Bosnia south of the Sava to the Ottomans and Oltenia to Wallachia; the Austrians had to demolish the fortifications they had built at Belgrade. The border was again the Sava and the Danube. Wallis and Neipperg were imprisoned until Maria Theresa freed them in 1740, and many Serbs who had sided with the Habsburgs fled north across the rivers.
    facts:
      - [Battle of Grocka, "21–22 July 1739, Ottoman victory"]
      - [Treaty of Belgrade, "18 September 1739"]
      - [Returned by the Habsburgs, "Belgrade, northern Serbia, Oltenia"]
    markers:
      - kind: battle
        side: ot
        name: Battle of Grocka
        date: 22 July 1739
        text: Wallis’s army attacked piecemeal out of a defile and was cut down from the surrounding heights. The defeat decided the war.
        lonlat: [20.72, 44.67]
        lp: b
      - kind: siege
        side: ot
        name: Belgrade
        date: July – September 1739
        text: The Ottoman army besieged the fortress after Grocka. It was handed over under the peace, after the Austrians had pulled down their new works.
        lonlat: [20.457, 44.818]
        lp: l
      - kind: treaty
        name: Treaty of Belgrade
        date: 18 September 1739
        text: Signed in the grand vizier’s camp through French mediation. It set the Habsburg–Ottoman border on the Sava and the Danube.
        lonlat: [20.5, 44.76]
        lp: b
