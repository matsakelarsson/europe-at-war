steps:
  - title: Niš and Banja Luka
    date: 1737–1738
    when: "1737-07"
    borders: "1738-08-15"
    countries: [rs, ba, ro, at, hu, tr]
    body:
      - Bound by its alliance of 1726 to help Russia, and hoping for easy gains, the Habsburg Monarchy entered the Russo-Turkish war in July 1737. Field Marshal Friedrich Heinrich von Seckendorff led the main army up the Morava from Belgrade and took Niš in late July, and Serbs in the Ottoman lands rose in support. In the west, an army under Prince Joseph of Saxe-Hildburghausen invaded Bosnia and besieged Banja Luka, but on 4 August it ran into a relief army raised by the governor of Bosnia, Hekimoğlu Ali Pasha, from the local captains and their men, and was routed. A third force from Oltenia achieved little in Wallachia.
      - The Ottomans struck back in the autumn and retook Niš in October; its commander, General Nikolaus Doxat, was later beheaded by the Austrians for giving it up. Seckendorff was recalled, tried and imprisoned at Graz. Peace talks with Russia and the Ottomans at Nemyriv in Poland failed. In 1738 a large Ottoman army under Grand Vizier Yeğen Mehmed Pasha advanced into the Banat, took Mehadia and the island fortress of Orsova on the Danube, while plague spread through both armies and the towns of the region.
    facts:
      - [Niš taken and lost, "July and October 1737"]
      - [Battle of Banja Luka, "4 August 1737, Ottoman victory"]
      - [Orsova taken by the Ottomans, "August 1738"]
