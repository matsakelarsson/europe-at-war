notes:
  - Dates are New Style (Gregorian).
  - Russia’s war with the Ottomans in 1735–1739, on the Black Sea, in the Crimea and in Moldavia, is told in the Russo-Turkish War of 1735–1739, which also covers the Russian peace signed at Belgrade and Niš.
