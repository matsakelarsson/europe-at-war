id: austro-turkish-war-1737
name: Austro-Turkish War of 1737–1739
start: "1737-07"
end: "1739-09-18"
tier: B
summary: A war in which the Habsburg Monarchy, as Russia’s ally, attacked the Ottoman Empire in Serbia, Bosnia and Wallachia. After brief early gains it was beaten at Banja Luka and lost Niš, and after its defeat at Grocka in 1739 the Treaty of Belgrade gave Belgrade, northern Serbia and Oltenia back to the Ottomans and Wallachia, undoing most of the gains of Passarowitz.
