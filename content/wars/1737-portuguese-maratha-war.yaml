steps:
  - title: Arnala, Thane and Salsette
    date: March 1737 – 1738
    when: "1737-03-28"
    borders: "1737-12"
    countries: [in]
    body:
      - The Portuguese Northern Province, with its capital at Bassein (Vasai), had been Portuguese since 1534 and was one of the richest parts of their Asian empire, but its forts were undermanned and Goa could spare little help. In March 1737 Maratha forces seized the island fortress of Arnala at the mouth of the Vaitarna, which cut the sea route from Bassein to the north. Chimaji Appa’s armies then crossed into Salsette island and took Thane, with most of the island, later in the year.
      - The Portuguese sent reinforcements from Goa and held on to Bassein and a few forts on the creeks, but could not win back what had been lost. The Marathas built a fort of their own at Bhavangad to watch Bassein and waited for the next campaigning season.
    facts:
      - [Arnala taken, "28 March 1737"]
      - [Thane and most of Salsette taken, "1737"]
