  - title: Bassein
    date: November 1738 – October 1740
    when: "1739-05-16"
    borders: "1739-05-23"
    countries: [in]
    body:
      - In the winter of 1738–1739 the Marathas took the coast north of Bassein, Dahanu in November and Mahim on 20 January 1739, then Kelve, Shirgaon and Tarapur, while their troops occupied Versova and Dharavi to close the creeks around Bassein. On 17 February Chimaji Appa laid siege to the city with a large army; a Portuguese account speaks of 40,000 infantry and 25,000 horsemen, against a garrison of about 1,200 Portuguese and Indian soldiers. Maratha engineers drove mines under the walls from May, and several assaults were beaten back with heavy losses before the garrison commander, Caetano de Souza Pereira, surrendered on 16 May. The Portuguese were allowed eight days to leave with their property, and on 23 May the Maratha flag was raised over the fort.
      - In 1739 another Maratha army overran the outer districts of Goa, and according to Britannica only the unexpected arrival of a new viceroy with a fleet saved the city. The war ended with the help of the English governor at Bombay, whose envoy, Captain Inchbird, negotiated the peace signed on 14 October 1740. Portugal gave up its northern province and Chaul, south of Bombay, keeping Daman, Diu and Goa until 1961.
    facts:
      - [Siege of Bassein, "17 February – 16 May 1739"]
      - [Portuguese garrison, "about 1,200"]
      - [Peace treaty, "14 October 1740; Chaul ceded to the Marathas"]
