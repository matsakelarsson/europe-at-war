id: portuguese-maratha-war
name: Portuguese–Maratha war (1737–1740)
start: "1737-03"
end: "1740-10-14"
tier: B
summary: "The war in which the Marathas under Chimaji Appa, brother of the Peshwa Baji Rao I, conquered the Portuguese Northern Province, the coastal strip north of Bombay that Portugal had held for two hundred years. In 1737 the Marathas took the island fort of Arnala, Thane and most of Salsette island. In 1738–1739 they captured the forts of the coast up to Daman one after another and besieged Bassein, the capital of the province, which surrendered on 16 May 1739 after a three-month siege and costly assaults. Another Maratha army attacked the outer districts of Goa itself. By the peace of 1740, mediated by the English at Bombay, Portugal also gave up Chaul, keeping only Daman, Diu and Goa on the Indian coast."
countries: [in, pt]
sides:
  - id: mar
    name: Marathas
    polities: [marathas]
    ink: orange
    moves: Maratha moves
    success: Maratha success
  - id: pt
    name: Portuguese State of India
    polities: [portugal]
    ink: blue
    moves: Portuguese moves
    success: Portuguese success
notes:
  - Maratha accounts present the war partly as a response to the Portuguese authorities’ treatment of their Hindu subjects, including forced conversions and the destruction of temples in the Northern Province; Portuguese accounts stress the military weakness of the province after years of neglect. The English at Bombay, who feared both a Maratha neighbour and a Portuguese collapse, sent supplies to the Portuguese and then brokered the peace.
