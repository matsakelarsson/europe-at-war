id: war-of-jenkins-ear
name: War of Jenkins’ Ear
start: "1739-10"
end: "1748-10-18"
tier: B
summary: "A war between Great Britain and Spain in the Caribbean and on the border between Georgia and Spanish Florida. British merchants resented the Spanish coast guards who searched their ships for contraband, and the opposition to Robert Walpole made a cause of Captain Robert Jenkins, whose ear a Spanish officer had cut off in 1731; Spain and Britain also disputed the land between Georgia, founded in 1733, and Florida. Britain declared war in October 1739. Admiral Edward Vernon took Porto Bello on the Isthmus of Panama in November 1739, but the great expedition against Cartagena de Indias in 1741 was beaten by Blas de Lezo’s defence and by yellow fever, and an attempt on Santiago de Cuba also failed. On the mainland James Oglethorpe of Georgia besieged Saint Augustine in 1740 and was defeated at Fort Mose by Spanish troops and the free Black militia of Francisco Menéndez; in 1742 a Spanish invasion of Georgia was turned back on St. Simons Island at Gully Hole Creek and Bloody Marsh. From 1742 the war merged into the War of the Austrian Succession, and the Treaty of Aix-la-Chapelle in 1748 restored the state before the war."
countries: [gb, es, us, cu, jm, pa, co]
sides:
  - id: brit
    name: Great Britain, with Georgia, South Carolina and the other colonies, and Muscogee, Chickasaw, Yamacraw and other Native allies
    polities: [united-kingdom, british-america, british-west-indies, muscogee]
    ink: red
    moves: British moves
    success: British success
  - id: es
    name: Spain, with Cuba, Florida and New Granada, and the free Black militia of Fort Mose
    polities: [spain, cuba, new-spain]
    ink: gold
    moves: Spanish moves
    success: Spanish success
notes:
  - The name was given by Thomas Carlyle in 1858; the Spanish call it the Guerra del Asiento. Whether Jenkins really showed his ear, kept in a jar, to the House of Commons in 1738 is uncertain.
  - British dates were in the Julian calendar (Old Style), eleven days behind the Spanish. Dates of British operations are given in Old Style, as the standard references give them, and marked where it matters; recent works sometimes give the New Style dates (Bloody Marsh, 7 July Old Style, is 18 July New Style). Casualty figures for Cartagena vary widely between British and Spanish sources.
  - Porto Bello is in today’s Panama and Cartagena in Colombia; the wars of Central and South America are told in their own region.
