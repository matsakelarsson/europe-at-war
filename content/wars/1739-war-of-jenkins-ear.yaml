  - title: Oglethorpe at Saint Augustine
    date: January – July 1740
    when: "1740-06-13"
    borders: "1740-06-26"
    countries: [us, es, gb]
    view:
      center: [-81.43, 29.95]
      size: [90, 70]
    body:
      - "James Oglethorpe had founded Georgia in 1733 on land Spain claimed as part of Florida, and built Fort Frederica on St. Simons Island. Spanish Florida offered freedom to people who escaped slavery in the British colonies if they became Catholics and served in its militia, and in 1738 Governor Manuel de Montiano settled them at Gracia Real de Santa Teresa de Mose, north of Saint Augustine, the first legally free Black town in what is now the United States, under Captain Francisco Menéndez, himself formerly enslaved. In September 1739 enslaved Africans rose at Stono in South Carolina and marched towards Florida, which deepened Carolina’s fears."
      - "In January 1740 Oglethorpe took the Spanish posts of Picolata and San Francisco de Pupo on the St. Johns River. In May he advanced on Saint Augustine with about 1,000 regulars and Georgia and South Carolina provincials and, by one count, some 1,200 Native warriors, among them Muscogee, Chickasaw, Yuchi and Yamacraw under Toonahowi, while a Royal Navy squadron blockaded the harbour. Mose’s people withdrew into the town, and from mid-June British guns on Anastasia Island bombarded the Castillo de San Marcos, whose coquina walls absorbed the shot."
      - "Before dawn on 26 June about 300 Spanish soldiers, Menéndez’s free Black militia and Native allies attacked the Scottish Highlanders and rangers holding the ruins of Mose, killing 68 and capturing 34 for the loss of about ten. Spanish supply boats from Havana slipped through the shallow Matanzas inlet, the naval commander would not risk his ships in the hurricane season, and on 20 July Oglethorpe gave up the siege and withdrew to Georgia, leaving guns behind."
    facts:
      - [Siege of Saint Augustine, "13 June – 20 July 1740 (Old Style)"]
      - [Battle of Fort Mose, "26 June 1740 (Old Style)"]
      - [British losses at Mose, "68 killed and 34 captured"]
