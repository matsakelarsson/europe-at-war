  - title: The invasion of Georgia
    date: July 1742 – 1748
    when: "1742-07-07"
    borders: "1742-07-07"
    countries: [us, es, gb, cu]
    view:
      center: [-81.40, 31.15]
      size: [70, 70]
    body:
      - "In 1742 Montiano led an invasion of Georgia with Saint Augustine’s garrison, the free Black soldiers of Mose and grenadiers from Havana, some 2,000 men in a fleet of several dozen ships. On 5 July 1742 (Old Style) the fleet ran past the guns of Fort St. Simons and landed on the island; Oglethorpe abandoned the fort and fell back on Frederica."
      - "On 7 July a Spanish advance party on the road to Frederica ran into Oglethorpe’s rangers, Highlanders and Native allies at Gully Hole Creek, about a mile from the town, and lost 12 killed and 10 captured. Later that day British troops ambushed the Spanish grenadiers at a marsh to the south; some of the regulars broke, but the Highlanders held, and Montiano reported seven killed. The name Bloody Marsh comes from later legend. Misled by false news of British reinforcements that Oglethorpe planted through a released prisoner, and by the sight of ships from Charles Town, Montiano destroyed Fort St. Simons and sailed back to Florida on 15 July."
      - "Oglethorpe raided to the gates of Saint Augustine again in 1743. By then the conflict had merged into the wider War of the Austrian Succession, and from 1744 France and Britain were also at war; in October 1748 British and Spanish squadrons fought off Havana. The Treaty of Aix-la-Chapelle restored the state before the war, and in 1750 Britain gave up the asiento for £100,000. Georgia’s southern border remained disputed until Britain took Florida in 1763."
    facts:
      - [Spanish landing on St. Simons, "5 July 1742 (Old Style)"]
      - [Gully Hole Creek and Bloody Marsh, "7 July 1742 (Old Style)"]
      - [Spanish withdrawal, "15 July 1742 (Old Style)"]
