steps:
  - title: Porto Bello and Cartagena
    date: 1739–1741
    when: "1739-11-21"
    borders: "1739-11-22"
    countries: [pa, co, cu, jm, gb, es]
    body:
      - "Under the Treaty of Utrecht Britain held the asiento, the right to sell enslaved Africans in Spanish America, and could send one trading ship a year to its fairs, but British merchants smuggled far more, and Spanish coast guards (guardacostas) stopped and searched British ships. In 1731 a coast guard officer cut off an ear of Robert Jenkins, master of the Rebecca, and in 1738 Jenkins told his story to the House of Commons. Merchants and the opposition pressed Walpole’s government for war; the Convention of El Pardo of January 1739, which was to settle the claims, collapsed, and Britain declared war in October."
      - "Vice-Admiral Edward Vernon sailed from Jamaica with six ships of the line and took Porto Bello on the Isthmus of Panama, the port of the Spanish treasure fairs, on 21–22 November 1739, destroying its forts. The victory made him a hero in Britain; streets were named after it, and Lawrence Washington later named his Virginia estate Mount Vernon after the admiral. In March 1740 Vernon bombarded Cartagena de Indias and took the fort of San Lorenzo at the mouth of the Chagres."
      - "In 1741 Britain sent its largest overseas expedition yet: about 180 ships and some 27,000 men, soldiers, sailors and a regiment of 3,500 to 4,000 men raised in the North American colonies. They landed at Cartagena in March and took the forts guarding the bay, but the Spanish under Blas de Lezo and the viceroy Sebastián de Eslava, with about 3,000 soldiers, militia and six ships, held the city. A night assault on the fortress of San Felipe de Barajas in April failed, and with yellow fever killing thousands, Vernon withdrew in May. British dead, mostly from disease, are usually put at about 9,000 to 11,500. In July Vernon and General Thomas Wentworth landed at Guantánamo Bay to march on Santiago de Cuba but never got there, and sickness forced them to leave at the end of the year."
    facts:
      - [Capture of Porto Bello, "21–22 November 1739 (Old Style)"]
      - [Siege of Cartagena de Indias, "March – May 1741"]
      - [British force at Cartagena, "about 180 ships and 27,000 men"]
