steps:
  - title: The massacre in Batavia
    date: October 1740
    when: "1740-10-09"
    borders: "1740-10"
    countries: [id, nl]
    body:
      - Chinese settlers had helped build Batavia from its founding, as artisans, traders and shopkeepers, and by the 1730s many thousands worked in the sugar mills of the countryside around the town. When sugar prices fell, the Company tried to limit their numbers by registration and deportation. In July 1740 Governor-General Adriaan Valckenier decreed that suspect Chinese could be deported to Ceylon, and rumours spread that the deportees were thrown overboard at sea. Unemployed mill workers armed themselves in the countryside, and on 7 October they killed 50 Company soldiers at Meester Cornelis and Tanah Abang. The next day the Company turned back a large band at the town gates, and a curfew was imposed on the Chinese within the walls.
      - Rumours that the Chinese meant to kill or enslave the other inhabitants spread among Batavia’s Europeans, enslaved people and Asian soldiers. On 9 October Chinese houses along the river were set on fire, and from about five in the afternoon Company troops fired cannon into the Chinese quarter. Over the following days soldiers, sailors, militia and gangs of other townspeople killed Chinese in their houses and in the streets; on 10 October Chinese patients were dragged from the hospital and killed, and on 13 October the council offered two ducats for every Chinese head brought in. The killing inside the walls was ordered to stop on 22 October. Most accounts estimate that about 10,000 Chinese were killed, and estimates of survivors range from 600 to about 3,400.
      - Outside the walls the Chinese fought on into late November from fortified sugar mills such as Salapadjang, until Company cavalry drove them out. Survivors led by Khe Pandjang, blocked from Banten by its sultan’s troops, set out east along the coast towards Semarang.
