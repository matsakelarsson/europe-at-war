notes:
  - The number killed in Batavia is uncertain. Most accounts estimate that about 10,000 Chinese were killed inside the walls in October 1740; estimates of survivors range from 600 (Johannes Theodorus Vermeulen) to 3,000 (A. R. T. Kemasang) and 3,431 (Benny G. Setiono). Between 600 and 700 Chinese houses were plundered and burned. In Indonesia the massacre is known as Geger Pacinan, the “Chinese tumult”.
  - The Company’s board in the Netherlands blamed Governor-General Adriaan Valckenier, who was arrested in 1741, sentenced to death in 1744 and died in prison in 1751 while his appeal was pending. After the massacre the Chinese of Batavia were made to live outside the walls, in what became Glodok.
  - Mataram changed sides twice, so it has its own colour here; Cakraningrat IV of Madura fought for the Company in the hope of a kingdom of his own in East Java, which he did not receive.
