id: chinese-war-in-java
name: Batavia massacre and the Chinese War in Java
start: "1740-10-07"
end: "1743-11-11"
tier: B
summary: "The killing of the Chinese of Batavia by the Dutch East India Company (VOC) and its soldiers and auxiliaries in October 1740, and the war that followed across Central and East Java. Chinese sugar-mill workers around Batavia, threatened with deportation to Ceylon and hit by falling sugar prices, rose in early October 1740 and killed 50 Company soldiers. Rumours of a Chinese plot spread in the town, and from 9 to 22 October Company troops, sailors, militia and other townspeople killed the Chinese inside the walls; historians estimate at least 10,000 dead, and survivors at between 600 and about 3,400. Survivors under Khe Pandjang fled east, where the Chinese of the north coast rose under Singseh and were joined by Javanese lords and, from July 1741, by the court of Mataram under Pakubuwono II, which stormed the Company’s garrison at Kartasura. Semarang was besieged by about 3,500 Chinese and 20,000 Javanese, but Company reinforcements and Cakraningrat IV of Madura turned the tide. Pakubuwono II changed sides in 1742; the rebels proclaimed his nephew Raden Mas Garendi king and took Kartasura in June, until Cakraningrat retook it in December. By the treaty of November 1743 the restored Pakubuwono II ceded the north coast of Java, Madura and the east of the island to the Company, which never again faced a Javanese state it could not dominate."
