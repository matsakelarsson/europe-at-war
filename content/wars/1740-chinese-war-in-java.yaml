  - title: The fall of Kartasura and the price of peace
    date: 1742–1743
    when: "1742-06-30"
    borders: "1743-11-11"
    countries: [id, nl]
    body:
      - With the rebels in retreat, Pakubuwono II made peace with the Company in early 1742 and gave hostages. The princes and Chinese leaders who fought on disowned him on 6 April and proclaimed his young nephew Raden Mas Garendi king, as Sunan Kuning. On 30 June 1742 Javanese rebels and Khe Pandjang’s Chinese took and plundered Kartasura; Pakubuwono II and the Company officers escaped on horseback across the Solo River and fled east to Ponorogo.
      - On the coast, Company reinforcements from Sulawesi and Ambon retook Demak from Singseh and Raden Suryakusuma after several days of fighting, and Kudus surrendered without a fight on 28 August; the regents began to submit. In December 1742 Cakraningrat IV drove the rebels out of Kartasura. He wanted to keep the kingdom for himself, but the Company made him hand the palace back to Pakubuwono II. The last Chinese fighters, who had retreated towards Prambanan, surrendered by early 1743.
      - The restored king paid dearly. By the treaty of November 1743 Pakubuwono II ceded to the Company the north coast of Java, Madura and the east of the island, agreed to a yearly tribute in rice and forbade Javanese to sail beyond Java, Madura and Bali. Because Kartasura had been desecrated, he built a new palace at Surakarta. Cakraningrat IV, left with Madura alone, rebelled in 1745 and was exiled to the Cape of Good Hope. The war left the dynasty divided and dependent on the Company, and led within a few years to the Third Javanese War of Succession.
    facts:
      - [Sunan Kuning proclaimed, "6 April 1742"]
      - [Kartasura taken by the rebels, "30 June 1742"]
      - [Kartasura retaken, "December 1742"]
      - [Treaty, "November 1743"]
