  - title: The rising on the north coast and the siege of Semarang
    date: "1741"
    when: "1741-07"
    borders: "1741-08"
    countries: [id, nl]
    body:
      - On 1 February 1741 a band of Chinese killed a Company corporal at Pati, and the Chinese of Demak and Grobogan gathered and chose a leader of their own, Singseh, whom they called emperor. The court of Mataram, at Kartasura, debated for months whether to save the Company or join the rebels. Pakubuwono II secretly encouraged attacks on the Company while his regents staged sham battles with the Chinese to deceive it. The Company’s commander at Semarang, Bartholomeus Visscher, had fewer than 300 fit soldiers and broke down under the strain.
      - In late May the Chinese attacked the Company posts at Juwana and Rembang, and in June they and their Javanese allies besieged Semarang, the Company’s headquarters on the north coast. Rembang fell on 27 July and Jepara on 31 July. On 20 July Pakubuwono II’s soldiers, pretending to help defend the Company’s garrison at Kartasura, opened fire on it; the garrison held out for three weeks, then surrendered, and its commander was killed.
      - Cakraningrat IV of Madura, estranged from the Mataram court, offered the Company his alliance in return for a kingdom of his own, and his troops cleared East Java of the rebels, killing the Chinese they found. At Semarang the Company built up its garrison with reinforcements by sea to about 3,400 men, against about 3,500 Chinese and 20,000 Javanese with 30 cannon by November. In late 1741 Company firepower scattered Pakubuwono II’s troops, and the siege was broken.
    facts:
