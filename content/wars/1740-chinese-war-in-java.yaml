      - [Company soldiers killed, "50, on 7 October 1740"]
      - [Massacre, "9–22 October 1740"]
      - [Chinese killed in Batavia, "about 10,000 (most estimates)"]
      - [Survivors, "estimates range from 600 to 3,431"]
