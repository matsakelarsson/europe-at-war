id: konbaung-hanthawaddy-war
name: Mon revolt and the Konbaung–Hanthawaddy War
start: "1740-11-29"
end: "1757-05-06"
tier: A
summary: "The war in which the Mon south of Burma broke away from the declining Toungoo kingdom of Ava, destroyed it, and was in turn conquered by Alaungpaya, the founder of the Konbaung dynasty. In 1740 the people of Pegu killed Ava’s governor and restored the old kingdom of Hanthawaddy, which by 1745 held Lower Burma up to Prome and Toungoo. Under Binnya Dala, with French arms, it invaded the north in 1751 and took Ava in March 1752, ending the Toungoo dynasty. But a village headman of Moksobo (Shwebo), Aung Zeya, proclaimed himself king as Alaungpaya, beat the Hanthawaddy garrisons and by January 1754 had retaken Ava. A Hanthawaddy counter-offensive in 1754 failed; Pegu’s execution of the captive Toungoo king and persecution of southern Burmans turned the war into a conflict between Burmans and Mon. In 1755 Alaungpaya overran the Irrawaddy delta and founded Yangon; the French-held port of Syriam fell in July 1756 after fourteen months, and Pegu was stormed on 6 May 1757, its people massacred and its walls razed. Burma was united under the Konbaung dynasty, and thousands of Mon fled to Siam."
countries: [mm]
