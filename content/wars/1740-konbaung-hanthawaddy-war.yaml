  - title: The fall of Ava
    date: November 1751 – March 1752
    when: "1751-11"
    borders: "1752-04"
    countries: [mm]
    body:
      - "In November 1751 Binnya Dala sent his whole army north under his brother, the Upayaza or heir, and the general Talaban. The Hanthawaddy forces, with French muskets, advanced slowly up the Irrawaddy against little resistance and early in 1752 laid siege to Ava. They broke through the outer walls and pushed the defenders into the palace enclosure, and on 23 March 1752 the city fell. King Mahadhammaraza Dipadi and his family were taken to Pegu; the Toungoo dynasty, which had ruled since the 16th century, was at an end."
      - "The Upayaza proclaimed that the chiefs of Upper Burma must swear allegiance to Pegu. Believing the war won, and worried that Siam had taken advantage of it to occupy the upper Tenasserim coast, the Hanthawaddy command sent two-thirds of the army home and left Talaban with fewer than 10,000 men to finish the work. Resistance was already gathering. At Moksobo, a village in the Mu valley about 60 miles north-west of Ava, its headman Aung Zeya brought 46 villages together, proclaimed himself king as Alaungpaya, the future Buddha, and stockaded his village, renamed Shwebo. Other resistance groups formed at Salin on the middle Irrawaddy and at Mogaung in the far north."
    facts:
      - ["Hanthawaddy invasion", "from November 1751"]
      - ["Ava taken", "23 March 1752"]
      - ["Garrison left in the north", "fewer than 10,000 men under Talaban"]
    markers:
