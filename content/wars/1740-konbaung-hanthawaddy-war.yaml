  - title: Alaungpaya wins the north
    date: April 1752 – January 1754
    when: "1752-04"
    borders: "1754-01-04"
    countries: [mm]
    body:
      - "On 20 April 1752 Alaungpaya and forty of his men wiped out a Hanthawaddy detachment of fifty sent from Singu to take the oath of the Mu valley; it is from this skirmish at Halin that the war is often dated. A larger detachment met the same fate. In May Talaban came with several thousand well-armed men but no cannon to break the stockade, and laid siege to Shwebo. On 20 June 1752 Alaungpaya led a sortie that routed the besiegers, who left behind scores of muskets."
      - "Success brought recruits from all over Upper Burma, including officers of the disbanded palace guard. Alaungpaya chose 68 commanders, among them Minhla Minkhaung Kyaw, Maha Thiha Thura and Balamindin, who would lead Konbaung armies for the next thirty years. By October 1752 he had driven the Hanthawaddy outposts and their allies, the Gwe Shans of Madaya, from the country north of Ava and defeated a rival resistance leader, Chit Nyo of Khin-U. Pegu sent no reinforcements, only a new general. On 3 January 1754 Alaungpaya’s seventeen-year-old son, the later king Hsinbyushin, retook Ava, which the garrison left ruined and burnt. The Shan chiefs nearest to Upper Burma came to pay homage."
    facts:
      - ["Skirmish at Halin", "20 April 1752"]
      - ["Siege of Shwebo broken", "20 June 1752"]
      - ["Ava retaken", "3 January 1754"]
    markers:
