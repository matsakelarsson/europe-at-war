notes:
  - "Dates are the Gregorian equivalents of Burmese chronicle dates, as given by modern historians (above all Harvey, Htin Aung, Lieberman and Myint-U). Army sizes are those of the chronicles and approximate."
  - "The war is often described as one between Burmans and Mon, and became one; but in 1740 the rising drew in Burmans and Karens of the south who resented Ava’s rule, and the first king of the restored Hanthawaddy, Smim Htaw Buddhaketi, is described in different sources as a Burman of royal descent or a Gwe Shan. Mon nationalists and Burmese nationalist historiography remember the war very differently: for the first it ended Mon independence, for the second it is the founding of the third Burmese empire."
  - "Names: Pegu is today’s Bago, Syriam Thanlyin, Dagon Yangon (Rangoon), Prome Pyay, Ava Inwa, Moksobo Shwebo and Martaban Mottama. The French in Lower Burma were agents of the French East India Company at Pondicherry; three ships of the English East India Company joined a Hanthawaddy attack on Yangon in June 1755 without orders, while the Company’s settlement at Negrais declared for Alaungpaya."
