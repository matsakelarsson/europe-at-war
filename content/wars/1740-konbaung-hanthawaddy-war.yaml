  - title: Down the Irrawaddy to Yangon
    date: April – June 1755
    when: "1755-04"
    borders: "1755-06"
    countries: [mm]
    body:
      - "From Prome Alaungpaya struck into the Irrawaddy delta in early April 1755. He took Lunhse and renamed it Myanaung, speedy victory; his vanguard beat the Hanthawaddy forces at Hinthada and took Danubyu by mid-April, before the Burmese new year. By late April the delta was his, and local lords as far as Thandwe in Arakan sent homage."
      - "On 5 May 1755 Konbaung troops defeated a Hanthawaddy division at Dagon, the town around the Shwedagon Pagoda across the river from Syriam. Alaungpaya made it his port, settled people around it and named it Yangon, end of strife. A first attempt on Syriam failed against its walls and French guns. In June a Hanthawaddy counter-attack on Yangon, joined by three English East India Company ships, the Arcot, Hunter and Elizabeth, apparently without orders, was beaten off. The English, with a settlement on Negrais island since 1753, hurried to send Captain Baker to Alaungpaya with cannon and muskets; Alaungpaya let them stay at Negrais but signed no treaty."
    facts:
      - ["Danubyu taken", "mid-April 1755"]
      - ["Dagon taken and renamed Yangon", "5 May 1755"]
      - ["Hanthawaddy attack on Yangon", "June 1755, beaten off"]
