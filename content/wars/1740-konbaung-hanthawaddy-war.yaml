steps:
  - title: The Mon rising and the restored Hanthawaddy
    date: 1740–1751
    when: "1740-11"
    borders: "1745"
    countries: [mm]
    body:
      - "By the 1730s the Toungoo kings at Ava could no longer defend their realm. Manipuri horsemen had raided the Chindwin valley and deep into Upper Burma every year since 1724, Lan Na had broken away in 1727, and the Qing had taken over Shan states in the north. In the south, heavy taxes and the arbitrary rule of Ava’s governors bred revolt among the Mon, Burmans and Karens of the delta."
      - "On 29 November 1740 the court at Pegu killed Ava’s governor, and on 8 December it chose as king a former monk with the Mon title Smim Htaw Buddhaketi. The old kingdom of Hanthawaddy, conquered by Toungoo two centuries before, was restored. Some 8,000 Burmans living in the south were massacred in 1740, by the chronicles’ count, although many southern Burmans also served the new kingdom. Ava’s attempts to win back the south in the early 1740s failed. From 1742 Hanthawaddy fleets raided up the Irrawaddy as far as Ava every dry season, and by 1745 Pegu held Lower Burma and the frontier towns of Prome and Toungoo. Martaban and Tavoy put themselves under Siamese protection."
      - "In 1747 Smim Htaw was replaced by Binnya Dala, a former elephant master. The French East India Company, whose governor Dupleix sought influence on the Bay of Bengal, sent an agent, the Sieur de Bruno, to Pegu in 1751; French arms and gunners strengthened the Hanthawaddy army, and the French held a factory at Syriam."
    facts:
      - ["Governor of Pegu killed", "29 November 1740"]
      - ["Smim Htaw Buddhaketi elected", "8 December 1740"]
      - ["Binnya Dala king", "1747"]
