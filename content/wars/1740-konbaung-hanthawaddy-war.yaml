  - title: The fall of Pegu
    date: October 1756 – May 1757
    when: "1756-10"
    borders: "1757-06"
    countries: [mm, th]
    body:
      - "After the rains one Konbaung army marched on Pegu from Syriam and another from Toungoo, advancing slowly against Hanthawaddy cannon, and by mid-October 1756 they had surrounded the city; Konbaung war boats turned aside fire-rafts and closed the ring. By January 1757 Pegu was starving. Binnya Dala asked for terms, but Alaungpaya demanded unconditional surrender, and the king’s commanders, determined to fight on, put him under restraint."
      - "On 6 May 1757 the Konbaung armies broke in at moonrise and massacred men, women and children. Alaungpaya entered by the Mohnyin gate with his guards and French gunners and prostrated himself before the Shwemawdaw Pagoda; the walls and twenty gates built by Tabinshwehti and Bayinnaung were razed. The governors of Martaban and Tavoy, who had sought Siamese protection, sent tribute. Binnya Dala was kept a prisoner and executed in 1774."
      - "Thousands of Mon fled to Siam, and Burman families from the north settled in the delta; a rising across Lower Burma in 1758 was put down by Konbaung garrisons. Mon resistance in the hills of the upper Tenasserim coast, with Siamese support, was one of the reasons for Alaungpaya’s invasion of Siam in 1759. In 1759 Alaungpaya’s forces also destroyed the English settlement at Negrais, suspecting it of supplying the Mon."
    facts:
      - ["Siege of Pegu", "mid-October 1756 – 6 May 1757"]
      - ["Result", "Konbaung victory; Lower Burma united with the north"]
    markers:
