  - title: The siege of Syriam
    date: May 1755 – July 1756
    when: "1755-06"
    borders: "1756-08"
    countries: [mm, fr]
    body:
      - "Syriam, the fortified port across the river from Yangon, was held by Hanthawaddy troops and the French under the Sieur de Bruno, with modern cannon. Alaungpaya, without the guns to breach its walls and unable to get the English to send military help, settled down to a siege that lasted the rest of 1755. He returned to the front with his sons in January 1756. The French waited for help from Pondicherry. In July, attacking by water and land, the Konbaung forces took the last French ship in port and the French factory outside the town; on 14 July Minhla Minkhaung Kyaw, Alaungpaya’s leading general, was mortally wounded by cannon fire. De Bruno, caught trying to negotiate secretly with Alaungpaya, was imprisoned by the Hanthawaddy commanders."
      - "Fearing that French reinforcements would arrive, Alaungpaya called for volunteers to storm the walls and chose 93, the Golden Company of Syriam. On the evening of 25 July 1756, while drums and music suggested a festival in the Konbaung camp, they scaled the walls, and at dawn on 26 July they forced open the gates after hand-to-hand fighting. The city was overrun and many of its people were killed; 20 of the 93 survived. Three days later, on 29 July, two French relief ships from Pondicherry, the Galatée and the Fleury, sailed in and were seized. Alaungpaya took 35 ship’s guns, five field guns and 1,300 muskets, and pressed some 200 French officers and men into his army as gunners; de Bruno was executed. French involvement in Burma was over."
    facts:
      - ["Siege of Syriam", "May 1755 – 26 July 1756"]
      - ["Golden Company", "93 volunteers, 20 survived"]
      - ["French relief ships taken", "29 July 1756; 35 ship’s guns, 5 field guns, 1,300 muskets"]
    markers:
