  - title: The Hanthawaddy counter-offensive and the siege of Prome
    date: March 1754 – February 1755
    when: "1754-03"
    borders: "1754-10"
    countries: [mm]
    body:
      - "In March 1754 Binnya Dala sent his whole army north again under the Upayaza and Talaban, with a river flotilla that controlled the Irrawaddy. They beat Alaungpaya’s sons Naungdawgyi and Hsinbyushin at Myingyan, besieged Hsinbyushin in Ava and pursued Naungdawgyi as far as Kyaukmyaung, a few miles from Shwebo. There the advance stalled. In May Alaungpaya counter-attacked with, by the chronicles, 10,000 men, 1,000 horses and 100 elephants, drove the invaders back to Sagaing while Hsinbyushin broke the siege of Ava, and with the rains coming the Hanthawaddy army retreated south."
      - "Burmans who had escaped killings by the delta Mon seized Prome behind the retreating army and shut its gates. Binnya Dala ordered it retaken at any cost, and Talaban besieged it with 10,000 men and 200 war boats, holding off Konbaung relief forces through 1754. At Pegu, some commanders plotted to put the captive Mahadhammaraza Dipadi on the throne; Binnya Dala discovered the plot and in October 1754 executed the conspirators, the former king and other captives from Ava. Burmans in the south were now ordered to wear an earring stamped with the Upayaza’s seal and to cut their hair in the Mon fashion; many came over to Alaungpaya."
      - "In January 1755 Alaungpaya came to Prome with a large army, including Shan, Kachin and Chin levies. His troops advanced behind huge rolling baskets of hay against heavy musket fire and in mid-February took the Mayanbin stockade, lifting the siege. They captured muskets, cannon and ammunition that Hanthawaddy had bought from Europeans at Syriam, and 5,000 prisoners."
    facts:
      - ["Hanthawaddy counter-offensive", "March – May 1754, failed"]
      - ["Siege of Prome", "mid-1754 – February 1755"]
      - ["Former Toungoo king executed", "October 1754"]
