id: war-of-the-austrian-succession
name: War of the Austrian Succession
start: "1740-12-16"
end: "1748-10-18"
tier: A
summary: A European war over the inheritance of Maria Theresa, in which Prussia seized Silesia and France, Bavaria, Spain and Saxony tried to divide the Habsburg lands, while Britain, Hanover, the Dutch Republic and Sardinia supported Austria. It spread to Italy, the Low Countries, the seas and the colonies, and the Treaty of Aix-la-Chapelle in 1748 confirmed Maria Theresa’s inheritance but left Silesia to Prussia.
countries: [de, at, cz, pl, sk, hu, fr, be, nl, gb, it, es]
sides:
  - id: pr
    name: Prussia
    polities: [prussia]
    ink: slate
    moves: Prussian moves
    success: Prussian success
  - id: at
    name: Austria
    polities: [habsburg, austrian-netherlands]
    ink: purple
    moves: Austrian moves
    success: Austrian success
  - id: fr
    name: France, Bavaria and their allies
    polities: [france, bavaria, palatinate]
    ink: navy
    moves: French and Bavarian moves
    success: French and Bavarian success
  - id: gb
    name: Great Britain, Hanover and the Dutch Republic
    polities: [united-kingdom, hanover, dutch-republic]
    ink: red
    moves: Pragmatic Army moves
    success: British and allied success
  - id: sx
    name: Saxony
    polities: [saxony]
    ink: brown
    moves: Saxon moves
    success: Saxon success
  - id: es
    name: Spain, Naples and Genoa
    polities: [spain, naples, sicily, genoa]
    ink: gold
    moves: Spanish and allied moves
    success: Spanish and allied success
  - id: sa
    name: Sardinia
    polities: [savoy]
    ink: teal
    moves: Sardinian moves
    success: Sardinian success
notes:
  - Dates are New Style (Gregorian). Britain still used the Julian calendar, eleven days behind, so British sources of the time date Dettingen 16 June 1743.
  - The First (1740–1742) and Second (1744–1745) Silesian Wars between Prussia and Austria were part of this war. Saxony fought against Austria in 1741–1742 and on its side in 1744–1745.
  - Places in Silesia, Bohemia and Moravia are named in their German forms of the time; the markers give today’s names.
  - The war in the Low Countries and Italy, at sea and overseas is only outlined here.
