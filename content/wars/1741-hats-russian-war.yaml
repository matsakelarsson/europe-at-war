    body:
      - The Hats, the party then in power in Sweden, wanted revenge for the Great Northern War and had French backing. Sweden declared war on Russia in the summer of 1741, but on 3 September a Russian army under Peter Lacy stormed Villmanstrand and routed the Swedish force there.
      - The main army, badly led and ravaged by disease, fell back across Finland. Surrounded near Helsingfors, it capitulated in August 1742, and Russia occupied all of Finland, a time Finns call the Lesser Wrath. At Åbo in August 1743 Sweden got Finland back but gave up a strip of the south-east beyond the Kymi river, with Fredrikshamn, Villmanstrand and Nyslott.
