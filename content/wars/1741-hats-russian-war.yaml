id: hats-russian-war
name: Hats’ Russian War
start: "1741"
end: "1743"
tier: B
summary: "Sweden, governed by the Hats party, attacked Russia to win back what it had lost in 1721. Its army was beaten at Villmanstrand and surrendered near Helsingfors, and Russia occupied Finland; at Åbo in 1743 Sweden got Finland back but gave up a strip of the south-east."
