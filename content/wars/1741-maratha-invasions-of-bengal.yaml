notes:
  - Much of what is remembered of the raids comes from Bengali sources, above all Gangaram’s poem Maharashtra Purana, and from the reports of the European companies; the Maratha side is known from the letters of its commanders. The suffering of Bengal’s villagers, and the flight of weavers and peasants east of the Bhagirathi, are described in all of them. Estimates of the dead vary; the figure of about 400,000 comes from the Dutch official Jan Kersseboom.
  - The Maratha Ditch, a defensive moat dug by the East India Company around part of Calcutta in 1742, was named after the raids; the Marathas never attacked the town.
