  - title: Two Maratha armies, and Mankara
    date: 1743–1744
    when: "1744-03-31"
    borders: "1744-03-31"
    countries: [in]
    body:
      - In 1743 Raghuji Bhonsle came himself, while the Peshwa, Balaji Rao, his rival among the Marathas, entered Bihar with another army at the emperor’s request to help the Nawab. Alivardi agreed to pay the Peshwa a subsidy and the chauth of Bengal, and Balaji drove Raghuji out. The Peshwa and the Bhonsle then settled their quarrel at Satara and divided their spheres, leaving Bengal and Orissa to Raghuji.
      - Bhaskar returned in 1744. Unable to beat him in the field, Alivardi offered talks, and at the end of March invited Bhaskar and his commanders to a meeting in a great tent at Mankara, not far from Murshidabad. Men hidden in the tent killed Bhaskar and about twenty of his officers, and the leaderless Maratha army fled back to Nagpur.
    facts:
      - [Peshwa’s army in Bengal, "1743"]
      - [Bhaskar Ram killed at Mankara, "30 or 31 March 1744"]
    markers:
      - kind: event
        side: ben
        name: Murshidabad
        date: March 1744
        text: Bhaskar and his officers were killed at a meeting in a tent at Mankara, near the capital.
        lonlat: [88.272, 24.175]
      - kind: event
        side: pes
        name: Patna
        date: 1743
        text: The Peshwa’s army came down the Ganges through Bihar to help Alivardi against Raghuji.
        lonlat: [85.137, 25.594]
