steps:
  - title: The first invasion and Katwa
    date: April – December 1742
    when: "1742-09-27"
    borders: "1742-09-27"
    countries: [in, bd]
    body:
      - Alivardi Khan had made himself Nawab of Bengal in 1740 by defeating and killing his master’s son, Sarfaraz Khan, and some of Sarfaraz’s friends turned to the Marathas. In April 1742 Raghuji Bhonsle, the Maratha ruler of Nagpur, sent his general Bhaskar Ram Kolhatkar with a large cavalry army to collect chauth from Bengal. They took Cuttack in Orissa, came through the hills by Panchet and caught Alivardi near Burdwan; the Nawab fought his way through to Katwa with heavy losses. In May a Maratha detachment guided by the Persian Mir Habib raided Murshidabad, the capital, and plundered the house of the banker Jagat Seth, and through the monsoon the Marathas held Hooghly and the country west of the Bhagirathi.
      - The raiders spread terror in the villages, burning, looting and killing, and thousands fled across the river. While Bhaskar celebrated the Durga Puja in his camp at Katwa, Alivardi crossed the river at night and fell on it on 27 September 1742. The Marathas fled west and were driven out of Bengal by December.
    facts:
      - [Cuttack taken by the Marathas, "April 1742"]
      - [Raid on Murshidabad, "May 1742"]
      - [Battle of Katwa, "27 September 1742, victory for the Nawab"]
