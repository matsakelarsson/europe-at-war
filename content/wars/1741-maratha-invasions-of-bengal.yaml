id: maratha-invasions-of-bengal
name: Maratha invasions of Bengal
start: "1741"
end: "1751-06"
tier: B
summary: "The raids of the Maratha armies of Raghuji Bhonsle of Nagpur into the Mughal province of Bengal, Bihar and Orissa, ruled by the Nawab Alivardi Khan. Known in Bengal as the bargis, from the Persian word for a mounted soldier, the Maratha horsemen came almost every year from 1742, led at first by Raghuji’s general Bhaskar Ram Kolhatkar, plundering western Bengal and Bihar and demanding chauth, a quarter of the revenue. Alivardi won many battles, surprised the Maratha camp at Katwa in 1742 and had Bhaskar and his officers killed at a meeting in 1744, but could not stop the raids, which joined forces with a revolt of Alivardi’s own Afghan officers. A Dutch East India Company official estimated that some 400,000 people died. In 1751 Alivardi made peace, giving up the revenue of Orissa and agreeing to pay 12 lakh rupees a year for Bengal."
countries: [in, bd]
sides:
  - id: nag
    name: Raghuji Bhonsle of Nagpur
    polities: [nagpur-kingdom]
