  - title: Afghans, Orissa and the peace
    date: 1745–1751
    when: "1748-04"
    borders: "1751-06"
    countries: [in, bd]
    body:
      - Raghuji returned in 1745, and Alivardi’s Afghan general Mustafa Khan rebelled and joined him. Alivardi beat Raghuji near Katwa in December 1745, but the Marathas came back with Bhaskar’s son and Raghuji’s son Janoji. In January 1748 Afghan rebels seized Patna and killed Alivardi’s nephew, its governor; Alivardi defeated the Afghans and their Maratha allies at Rani Sarai, east of Patna, on 16 April 1748. The Marathas kept their hold on Orissa and raided Bengal every year.
      - Now over seventy, Alivardi made peace in 1751. Mir Habib was made governor of Orissa in the Nawab’s name, with its revenue going to the Marathas, and the Subarnarekha river became the frontier; the Nawab agreed to pay 12 lakh rupees a year as chauth for Bengal, with 32 lakh in arrears. When Mir Habib was killed in 1752, Orissa passed fully under the Bhonsles of Nagpur, who held it until 1803.
    facts:
      - [Battle near Katwa, "December 1745, victory for the Nawab"]
      - [Battle of Rani Sarai, "16 April 1748, victory for the Nawab"]
      - [Peace treaty, "May or June 1751; Orissa revenue and 12 lakh rupees a year to the Marathas"]
    markers:
