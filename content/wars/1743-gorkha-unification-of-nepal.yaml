  - title: Kinloch, Kathmandu and Bhaktapur
    date: August 1767 – November 1769
    when: "1768-09-26"
    borders: "1769-11-25"
    countries: [np, in]
    body:
      - In 1767 Jaya Prakash Malla asked the East India Company for help, and the Company, whose trade through Nepal had been cut off, agreed. Captain George Kinloch marched into the Tarai in August 1767 with a small force of sepoys and reached the hill fort of Sindhuli, but the monsoon, floods, failing grain supplies and malaria wore his men down, and Gorkha attacks around Sindhuli (dated 6 November 1767) forced him back to the plains. It was the first clash between the Company and the Gorkhas.
      - On 26 September 1768, while the people of Kathmandu were celebrating the festival of Indra Jatra, Gorkha troops entered the city from three sides and took the palace. Jaya Prakash Malla fled to Lalitpur, which surrendered a few weeks later, and then to Bhaktapur, where the three Malla kings made a last stand. The Gorkhas took Bhaktapur in 1769; a Kathmandu journal records 2,001 killed. Prithvi Narayan made Kathmandu the capital of his kingdom, which later took the name Nepal.
    facts:
      - [Battle of Sindhuli, "6 November 1767, Gorkha victory"]
      - [Kathmandu taken, "26 September 1768"]
      - [Lalitpur taken, "October 1768"]
      - [Bhaktapur taken, "1769 (14 April or 25 November)"]
