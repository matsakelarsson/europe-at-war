id: gorkha-unification-of-nepal
name: Gorkha conquest of the Kathmandu Valley
start: "1743-04"
end: "1769-11-25"
tier: B
summary: "The wars in which Prithvi Narayan Shah, king of the small hill state of Gorkha, conquered the rich Newar kingdoms of the Kathmandu Valley and founded the Kingdom of Nepal. Starting in 1743, he took the fort of Nuwakot above the valley in 1744 and then, over two decades, cut the valley off from its trade routes to Tibet and India. He took Makwanpur in 1762, beat off an army sent by the Nawab of Bengal, Mir Qasim, in 1763, and finally took Kirtipur after two failed assaults. In 1767 the British East India Company sent a small expedition under Captain George Kinloch to help Jaya Prakash Malla, king of Kathmandu, but it was driven back from the hills. Prithvi Narayan took Kathmandu in September 1768, Lalitpur soon after and Bhaktapur in 1769, and made Kathmandu his capital. The conquests of his successors in the east and west are not part of this story."
