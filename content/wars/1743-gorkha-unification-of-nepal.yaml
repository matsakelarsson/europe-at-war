notes:
  - Dates come from Nepali chronicles, Newar journals and the letters of Capuchin missionaries in the valley, and often differ by a year or more. Prithvi Narayan’s accession is given as 1742 or 1743, the fall of Kirtipur as 1766 or 1767, and the fall of Bhaktapur as 14 April or 25 November 1769; the November date comes from a journal kept at the Jana Baha monastery in Kathmandu.
  - The size of Kinloch’s force is uncertain; accounts give figures from about 800 to about 2,500 men.
