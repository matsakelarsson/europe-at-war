  - title: Makwanpur, Mir Qasim and Kirtipur
    date: 1762–1767
    when: "1763-01-21"
    borders: "1767"
    countries: [np, in]
    body:
      - In August 1762 the Gorkhas took Makwanpur, the hill kingdom south of the valley that controlled the road to the Indian plains, and in October the fort of Hariharpur. The Sen king of Makwanpur, Digbardhan Sen, appealed to Mir Qasim, Nawab of Bengal, who sent some 3,500 men under his Armenian general Gurgin Khan. They attacked the Makwanpur fort on 21 January 1763, but a Gorkha night attack routed them and they fled back to Bengal.
      - A second assault on Kirtipur failed in 1764. The Gorkhas then blockaded the town, and in 1766 or 1767 a Lalitpur noble let them in and it surrendered. Prithvi Narayan ordered that the noses and ears of its inhabitants be cut off; Capuchin missionaries in the valley described this, and Nepali sources confirm it. With Kirtipur and the passes in Gorkha hands, the valley was surrounded and its trade cut off.
    facts:
      - [Makwanpur taken, "August 1762"]
      - [Mir Qasim’s army defeated, "21 January 1763"]
      - [Kirtipur surrenders, "1766 or 1767, after assaults in 1757 and 1764"]
