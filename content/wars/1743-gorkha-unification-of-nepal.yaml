steps:
  - title: Nuwakot
    date: 1743–1757
    when: "1744-09-26"
    borders: "1744-09-26"
    countries: [np]
    body:
      - Prithvi Narayan Shah became king of Gorkha, one of the many small hill states of central Nepal, in 1743. The Kathmandu Valley to the east was divided between three related Newar kingdoms, Kathmandu (Kantipur), Lalitpur (Patan) and Bhaktapur, ruled by kings of the Malla dynasty, which grew rich on the trade between India and Tibet. A first Gorkha attack on Nuwakot, the fort that guarded the valley’s road to Tibet, failed, but on 26 September 1744 the Gorkhas took it; they lost it in 1745 and won it back for good.
      - From Nuwakot and the hills around the valley Prithvi Narayan began to cut off the valley’s trade. In 1757 he attacked Kirtipur, a hill town on the south-west edge of the valley belonging to Lalitpur, but the Newar defenders, helped by Jaya Prakash Malla of Kathmandu, threw the Gorkhas back, and their commander Kalu Pande was killed.
    facts:
      - [Nuwakot taken, "26 September 1744"]
      - [First attack on Kirtipur, "1757, repulsed; Kalu Pande killed"]
