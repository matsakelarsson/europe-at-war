id: ottoman-persian-war-1743
name: Ottoman–Persian War (1743–1746)
start: "1743"
end: "1746-09-04"
tier: C
summary: Nader Shah’s last war, fought to win Iraq from the Ottomans and to force them to recognise Persia’s Ja‘fari form of Shi‘ism as a fifth school of Islam. In 1743 his army took Kirkuk and Erbil and besieged Mosul from 14 September, killing many Yazidis in the countryside, but the city held out for 40 days under its governor Hajji Husayn al-Jalili, and Nader withdrew as revolts against his taxes spread in Persia. His siege of Kars in 1744 also failed. In August 1745 he destroyed an Ottoman army near Kars, but his own country was in revolt. By the Treaty of Kerden, signed near Qazvin on 4 September 1746, the frontier of the Treaty of Zuhab (1639) was restored, Nader dropped the Ja‘fari demand, and the Ottomans recognised his dynasty and promised to protect Persian pilgrims. Nader was assassinated the following year.
