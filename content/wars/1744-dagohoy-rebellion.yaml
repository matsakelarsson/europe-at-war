notes:
  - Dagohoy’s name is explained as a nickname, from dagon (amulet) and hoyohoy (breeze), for an amulet said to give him the power of the breeze. The details of the revolt’s beginning come from Jesuit and later Spanish accounts, and its numbers are uncertain.
