id: dagohoy-rebellion
name: Dagohoy rebellion
start: "1744"
end: "1829-08-31"
tier: C
summary: "A revolt on the island of Bohol that lasted 85 years, the longest against Spanish rule in the Philippines. It began in 1744; the killing of Giuseppe Lamberti, the Jesuit priest of Jagna, is dated to January 1744 in some accounts and January 1745 in others. Francisco Dagohoy (Francisco Sendrijas), a cabeza de barangay of Inabanga, turned against the Spanish when the Jesuit Gaspar Morales refused a Christian burial to his brother Sagarino, a constable killed while pursuing a fugitive, on the ground that he had died in a duel; forced labour, tribute and church dues fed the anger of many Boholanos. Dagohoy led about 3,000 people into the hills of the interior, where from December 1745 they ran their own government and farmed their own fields, with a base in the caves of Danao and the mountains behind Inabanga. Their numbers grew, by some accounts to 20,000. Expeditions sent by about twenty governors-general, and offers of pardon carried by the Jesuits and, after the Jesuits were expelled in 1768, by the Augustinian Recollects, failed to end the revolt, which outlived Dagohoy himself, whose death date is not known. In May 1827 Governor-General Mariano Ricafort sent José Lázaro Cairo to Bohol with 2,200 Spanish and Filipino troops and artillery. Two years of campaigning followed, in which people who had surrendered were beheaded at Inabanga and others were later deported from the island; by 31 August 1829 19,420 people had surrendered, and most were pardoned. The revolt is shown on the provincial flag of Bohol, and the town of Dagohoy is named after him."
