id: king-georges-war
name: King George’s War
start: "1744-03-15"
end: "1748-10-18"
tier: B
summary: "The North American part of the War of the Austrian Succession, fought between Britain and France and their colonies and allies in Nova Scotia, Cape Breton and on the frontier of New England and New York. When France declared war in March 1744, troops from the French fortress of Louisbourg on Cape Breton burned the New England fishing post of Canso, and French troops and Mi’kmaq and Wolastoqiyik warriors twice besieged Annapolis Royal, the capital of British Nova Scotia, without taking it. In 1745 some 4,200 New England volunteers under William Pepperrell, with a Royal Navy squadron under Peter Warren, besieged Louisbourg for 47 days and took it, the greatest victory of colonial New England. A great French fleet sent to retake it in 1746 under the Duc d’Anville was destroyed by storms and disease. French, Canadian and Native war parties raided the frontier from Maine to Saratoga, and in February 1747 a Canadian and Mi’kmaq force surprised and defeated a New England detachment at Grand-Pré. The Treaty of Aix-la-Chapelle in 1748 returned Louisbourg to France in exchange for Madras, to the fury of New England."
countries: [ca, us, fr, gb]
sides:
  - id: brit
    name: Great Britain, New England and Nova Scotia, with some Mohawk allies
    polities: [united-kingdom, british-america, nova-scotia]
    ink: red
    moves: British and New England moves
    success: British and New England success
  - id: fr
    name: France and New France, with the Wabanaki (Mi’kmaq, Wolastoqiyik and Abenaki) and other Native allies
    polities: [new-france, france, wabanaki]
    ink: blue
    moves: French and allied moves
    success: French and allied success
notes:
  - The British colonies used the Julian calendar (Old Style) until 1752, eleven days behind the French; dates here are in the New Style unless marked. New England accounts give the siege of Louisbourg as 30 April – 17 June 1745.
  - Named after George II, who reigned from 1727 to 1760. In French it is often called the Guerre de Succession d’Autriche or the third intercolonial war; for the European war see the War of the Austrian Succession, and for the war with Spain in the south that preceded it, the War of Jenkins’ Ear.
  - The Haudenosaunee Confederacy stayed largely neutral, although William Johnson persuaded some Mohawk to raid towards Canada. Most Acadians also stayed neutral, which both sides held against them.
