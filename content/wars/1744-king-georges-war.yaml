  - title: D’Anville’s fleet, the frontier and Grand-Pré
    date: 1745–1748
    when: "1746-09"
    borders: "1747-02-11"
    countries: [ca, us, fr, gb]
    body:
      - "The war of raids went on along the frontier. On 28 November 1745 Paul Marin led French troops and Native warriors from Fort St. Frédéric at Crown Point against Saratoga on the Hudson, killing about 30 people and carrying off some 60 to 100 as prisoners; in August 1746 a large French and Native force under François-Pierre de Rigaud de Vaudreuil forced the surrender of Fort Massachusetts in the Hoosac valley; and in April 1747 the post of Number 4 on the Connecticut River held out against a three-day siege. William Johnson persuaded some Mohawk to raid towards Canada, but the Haudenosaunee as a whole kept out of the war."
      - "In 1746 France sent the largest fleet it had yet sent to America, under the Duc d’Anville, to retake Louisbourg and Annapolis Royal. Storms scattered it on a crossing of three months, and typhus and scurvy killed thousands of its sailors and soldiers. D’Anville died at Chebucto, where Halifax now stands, on 27 September 1746, and the fleet sailed home without attacking. The sickness spread to the Mi’kmaq, many of whom died."
      - "In the winter of 1746–1747 Massachusetts sent about 500 men under Colonel Arthur Noble to hold Grand-Pré on the Minas Basin. Several hundred Canadians, Mi’kmaq and Wolastoqiyik under Nicolas-Antoine Coulon de Villiers marched three weeks through the snow from Beaubassin and, guided by Acadians, fell on the houses where the New Englanders were billeted in a snowstorm before dawn on 11 February 1747 (31 January, Old Style). Noble and about 70 of his men were killed and many captured before the rest surrendered. The Treaty of Aix-la-Chapelle of 18 October 1748 handed Louisbourg back to France in exchange for Madras in India, and Britain founded Halifax in 1749 as a counterweight."
    facts:
      - [Raid on Saratoga, "28 November 1745"]
      - [D’Anville’s death at Chebucto, "27 September 1746"]
      - [Battle of Grand-Pré, "11 February 1747"]
      - [Treaty of Aix-la-Chapelle, "18 October 1748"]
