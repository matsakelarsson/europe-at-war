steps:
  - title: Canso and Annapolis Royal
    date: 1744
    when: "1744-05-23"
    borders: "1744-05-23"
    countries: [ca, fr, gb]
    body:
      - "France declared war on Britain on 15 March 1744, and the news reached Louisbourg before it reached Boston. On 23 May François Du Pont Duvivier sailed from Louisbourg with several hundred soldiers and privateers and took Canso, the New England fishing station on the Nova Scotia shore, burned it and carried its garrison and families to Louisbourg as prisoners."
      - "In July about 300 Mi’kmaq and Wolastoqiyik warriors, with the missionary Jean-Louis Le Loutre, besieged Annapolis Royal, the small capital of British Nova Scotia, and withdrew after four days when ships brought 70 soldiers from Boston. From September Duvivier besieged the town again with French troops and Mi’kmaq, but the lieutenant governor, Paul Mascarene, held out, most Acadians would not join the French, and the warships Duvivier expected never came. In late September John Gorham arrived from Massachusetts with a company of Native rangers from Cape Cod, who raided a nearby Mi’kmaq camp and killed women and children; the Mi’kmaq withdrew, and on 5 October Duvivier gave up. The Canso prisoners, released from Louisbourg, brought news of its weakness to Boston, and Governor William Shirley of Massachusetts began to plan an attack."
    facts:
      - [France declares war, "15 March 1744"]
      - [Raid on Canso, "23 May 1744"]
      - [Sieges of Annapolis Royal, "July and September – October 1744"]
