  - title: The siege of Louisbourg
    date: May – June 1745
    when: "1745-05-11"
    borders: "1745-06-28"
    countries: [ca, us, fr, gb]
    view:
      center: [-60.00, 45.89]
      size: [50, 45]
    body:
      - "Shirley persuaded the Massachusetts assembly, by a single vote, to attack Louisbourg, the fortress that guarded the French fisheries and sheltered the privateers that preyed on New England shipping. William Pepperrell, a merchant of Kittery in Maine with no experience of war, led some 4,200 volunteers from Massachusetts, Connecticut and New Hampshire in about 90 ships; Rhode Island sent a ship and New York guns. At Canso they were joined by a Royal Navy squadron under Commodore Peter Warren. Inside the fortress the governor, Louis Du Pont Duchambon, had a garrison that had mutinied over pay and food the winter before."
      - "The New Englanders landed at Gabarus Bay on 11 May. The French abandoned the Royal Battery across the harbour, and the attackers turned its guns on the town. Warren’s ships captured the French warship Vigilant with supplies for the garrison, and in June a night assault on the Island Battery at the harbour mouth was beaten off with about 60 killed and 116 captured, but a battery dragged to Lighthouse Point silenced it. With his walls breached and no help in sight, Duchambon surrendered on 28 June 1745, after 47 days."
      - "About 100 attackers were killed or wounded in the siege, and the French lost about 130; the garrison and some 1,400 people in all were shipped to France. Far more of the New Englanders who held the fortress through the following winter died of disease, about 900 by one count. The news set off celebrations across New England, and Pepperrell was made a baronet."
    facts:
      - [Siege of Louisbourg, "11 May – 28 June 1745"]
      - [New England force, "about 4,200 volunteers, with Warren’s squadron"]
      - [Captured and shipped to France, "about 1,400"]
