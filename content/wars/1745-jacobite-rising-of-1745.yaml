id: jacobite-rising-of-1745
name: Jacobite rising of 1745
start: "1745-07-23"
end: "1746-09-20"
tier: B
summary: The last Jacobite rising, in which Charles Edward Stuart, the grandson of the deposed James II and VII, tried to win back the British thrones for his father. Raising the Highland clans in August 1745, he took Edinburgh, routed the government army at Prestonpans and marched into England as far as Derby, but turned back, and after a last victory at Falkirk his army was destroyed at Culloden in April 1746. Harsh repression in the Highlands followed.
countries: [gb, fr]
sides:
  - id: jac
    name: Jacobites
    polities: []
    ink: blue
    moves: Jacobite moves
    success: Jacobite success
  - id: gb
    name: Great Britain
    polities: [united-kingdom]
    ink: red
    moves: Government moves
    success: Government success
notes:
  - Dates are Old Style (Julian), as usual in British accounts; on the Continent, which used the Gregorian calendar, they were eleven days later, so Culloden was fought on 27 April 1746 New Style.
  - Known in Scotland as “the Forty-Five”. Britain and France were at war in the War of the Austrian Succession; France sent the Jacobites money, arms and a few hundred regular soldiers of its Scottish and Irish regiments, but its planned invasion of England never sailed. Many Scots, including whole clans and most of the Lowlands, sided with the government.
