  - title: The march to Derby
    date: November – December 1745
    when: "1745-11-08"
    borders: "1745-12-06"
    countries: [gb]
    body:
      - Charles insisted on invading England, against the doubts of his commanders, hoping that English Jacobites would rise and that France would land an army in the south. On 8 November about 5,500 men crossed the border. They took Carlisle after a short siege on 15 November and marched south through Lancashire, avoiding Marshal Wade’s army at Newcastle. Few Englishmen joined them, apart from the 300 or so of the Manchester Regiment, raised in Manchester. On 4 December the Jacobites reached Derby, about 200 km from London, where the news caused alarm and a run on the Bank of England.
      - By then the Duke of Cumberland’s army was in the Midlands, Wade’s was moving south behind the Jacobites, and a third was gathering to defend London. At a council of war in Derby on 5 December Lord George Murray and the other commanders, seeing no sign of an English rising or a French landing, insisted on retreat, and Charles bitterly gave way. A government agent had also falsely reported another army blocking the road at Northampton. The retreat began on 6 December. Murray’s rearguard fought off Cumberland’s advance guard at Clifton Moor on 18 December, and the army recrossed the border on 20 December, leaving a garrison in Carlisle that surrendered to Cumberland ten days later.
    facts:
      - [Carlisle taken, "15 November 1745"]
      - [Retreat from Derby, "decided 5 December, begun 6 December 1745"]
      - [Clifton Moor, "18 December 1745, rearguard action"]
    markers:
      - kind: siege
        side: jac
        name: Carlisle
        date: 15 November 1745
        text: The town and castle surrendered after a short siege. The garrison the Jacobites left there on their retreat surrendered to Cumberland on 30 December.
        lonlat: [-2.936, 54.895]
      - kind: held
        side: gb
        name: Newcastle
        date: November 1745
        text: Marshal George Wade’s army waited here on the eastern road. It set out across the Pennines in the snow, too late to stop the invaders.
        lonlat: [-1.614, 54.978]
      - kind: taken
        side: jac
        name: Manchester
        date: 29 November 1745
        text: Charles was welcomed, and about 300 men joined the Manchester Regiment, the only English unit of the rising. Many of its officers were later executed.
        lonlat: [-2.245, 53.479]
      - kind: event
        side: jac
        name: Derby
        date: 4–6 December 1745
        text: The furthest point of the invasion. At Exeter House Charles’s council of war decided to turn back.
        lonlat: [-1.478, 52.925]
      - kind: battle
        side: jac
        name: Clifton Moor
        date: 18 December 1745
        text: At dusk Lord George Murray’s rearguard held off Cumberland’s dragoons near Penrith, letting the army get away.
        lonlat: [-2.718, 54.627]
        lp: l
    arrows:
