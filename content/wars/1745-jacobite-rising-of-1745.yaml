steps:
  - title: Glenfinnan and Prestonpans
    date: July – September 1745
    when: "1745-07-23"
    borders: "1745-09-21"
    countries: [gb]
    body:
      - Britain was at war with France, and in 1744 a French invasion planned in support of the Stuarts had been called off after storms wrecked its transports. Charles Edward Stuart, the 24-year-old son of the exiled James Francis Edward, decided to go anyway. He landed on Eriskay in the Outer Hebrides on 23 July 1745 with seven companions, and two days later on the mainland at Loch nan Uamh. Many clan chiefs urged him to go home, but Donald Cameron of Lochiel and the MacDonalds of Keppoch and Clanranald joined him, and on 19 August he raised his father’s standard at Glenfinnan.
      - Most of the British army was fighting in Flanders. Sir John Cope marched north with the small army in Scotland but avoided the Jacobites waiting in the Corrieyairack Pass and went on to Inverness, leaving the road south open. The Jacobites entered Perth and, on 17 September, Edinburgh, though its castle held out; Charles proclaimed his father king as James VIII. Cope brought his army back by sea to Dunbar, and at dawn on 21 September the Highlanders charged it across the fields at Prestonpans. Cope’s army broke within minutes and lost most of its infantry killed or captured, and for a time the Jacobites controlled most of Scotland.
    facts:
      - [Standard raised at Glenfinnan, "19 August 1745"]
      - [Edinburgh taken, "17 September 1745; the castle held out"]
      - [Battle of Prestonpans, "21 September 1745, Jacobite victory"]
    markers:
      - kind: event
        side: jac
        name: Eriskay
        date: 23 July 1745
        text: Charles landed from the French ship Du Teillay; its escort, carrying most of his arms, had been driven back by a British warship.
        lonlat: [-7.29, 57.07]
      - kind: battle
        side: jac
        name: Highbridge skirmish
        date: 16 August 1745
        text: MacDonalds of Keppoch ambushed two companies of government troops marching to Fort William, the first fight of the rising.
        lonlat: [-4.957, 56.895]
      - kind: event
        side: jac
        name: Glenfinnan
        date: 19 August 1745
        text: More than a thousand clansmen, most of them Camerons and MacDonalds, gathered at the head of Loch Shiel to see the standard raised.
        lonlat: [-5.437, 56.869]
        lp: l
      - kind: taken
        side: jac
        name: Edinburgh
        date: 17 September 1745
        text: Highlanders rushed a city gate opened to let out a coach. Charles held court at Holyroodhouse, but the castle garrison held out throughout the rising.
        lonlat: [-3.189, 55.953]
        lp: l
      - kind: battle
        side: jac
        name: Battle of Prestonpans
        date: 21 September 1745
        text: The Highland charge routed Cope’s army in a few minutes. Some 1,500 government soldiers were taken prisoner.
        lonlat: [-2.96, 55.955]
