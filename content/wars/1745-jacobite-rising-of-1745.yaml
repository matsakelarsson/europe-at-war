  - title: Falkirk and Culloden
    date: January – September 1746
    when: "1746-01-17"
    borders: "1746-04-16"
    countries: [gb, fr]
    body:
      - Back in Scotland the Jacobites gathered reinforcements, among them French regulars of the Royal Écossais and the Irish Picquets who had landed on the east coast, and besieged Stirling Castle. On 17 January 1746 General Henry Hawley marched to relieve it and was beaten at Falkirk Muir in a storm of wind and rain, but the Jacobites did not follow up. Stirling held out, and as Cumberland advanced from Edinburgh the clan chiefs insisted on a retreat into the Highlands. They took Inverness and Fort Augustus but failed to take Fort William, while Cumberland drilled his army at Aberdeen and the Royal Navy stopped most French supplies from getting through.
      - In April Cumberland marched west from Aberdeen. A Jacobite night march to surprise his camp at Nairn failed, and on 16 April the hungry and exhausted Jacobite army, about 5,000 strong, stood on open moorland at Culloden, east of Inverness, against about 8,000 government troops. Cumberland’s artillery tore into the Highland line, and its charge, when it came, broke on musketry and bayonets within an hour. Some 1,500 to 2,000 Jacobites died, many of them wounded men and fugitives killed after the battle; the government lost about 50 killed and 250 wounded. Charles, helped by Flora MacDonald among others, escaped to France in September. Government troops burned and plundered across the Highlands; about 120 Jacobites were executed and hundreds transported, and Parliament banned Highland dress and abolished the chiefs’ hereditary jurisdictions.
    facts:
      - [Battle of Falkirk Muir, "17 January 1746, Jacobite victory"]
      - [Battle of Culloden, "16 April 1746, government victory"]
      - [Charles leaves Scotland, "20 September 1746"]
    markers:
      - kind: battle
        side: jac
        name: Battle of Falkirk Muir
        date: 17 January 1746
        text: The Highlanders broke Hawley’s dragoons and part of his infantry on a hillside south of Falkirk, but government regiments on the right held, and the Jacobites did not pursue.
        lonlat: [-3.814, 55.987]
      - kind: held
        side: gb
        name: Stirling Castle
        date: January 1746
        text: General William Blakeney’s garrison held out, and the Jacobites gave up the siege on 1 February.
        lonlat: [-3.946, 56.124]
        lp: l
      - kind: taken
        side: jac
        name: Inverness
        date: February 1746
        text: The government’s Earl of Loudoun withdrew north as the Jacobites approached; they took the fort and made the town their base.
        lonlat: [-4.225, 57.478]
        lp: t
      - kind: held
        side: gb
        name: Fort William
        date: March – April 1746
        text: Supplied by sea, the garrison withstood a Jacobite siege.
        lonlat: [-5.105, 56.82]
      - kind: battle
        side: gb
        name: Battle of Culloden
        date: 16 April 1746
        text: The last pitched battle fought in Britain. It ended the rising and with it any real hope of a Stuart restoration.
        lonlat: [-4.093, 57.477]
        lp: b
      - kind: event
        name: Loch nan Uamh
        date: 20 September 1746
        text: Charles sailed for France on the privateer L’Heureux from the loch where he had come ashore fourteen months before. He never returned.
        lonlat: [-5.849, 56.85]
        lp: l
