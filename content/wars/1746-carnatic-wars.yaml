  - title: Trichinopoly and Srirangam
    date: 1752–1754
    when: "1752-06"
    borders: "1752-06"
    countries: [in]
    body:
      - In April 1752 Major Stringer Lawrence and Clive brought a relief force to Trichinopoly, and the French under Jacques Law fell back to the island of Srirangam in the Kaveri. Clive cut off their retreat, and in June Law surrendered with some 800 Europeans and 2,000 sepoys. Chanda Sahib gave himself up to the commander of the Thanjavur troops, who were allied to the British, in the hope of escaping; he was beheaded in the Thanjavur camp.
      - The war did not end there. The regent of Mysore and the Maratha chief Morari Rao, promised Trichinopoly as the price of their help, changed sides when Muhammad Ali refused to hand it over, and with the French they besieged the city again until 1754. In Paris the French company’s directors, alarmed at the cost of Dupleix’s wars, recalled him in 1754. His successor, Charles Godeheu, signed a treaty with the British at the end of 1754 by which both companies promised not to interfere in the quarrels of Indian princes; in effect it left Muhammad Ali as Nawab of Arcot.
    facts:
      - [Surrender of Law at Srirangam, "June 1752"]
      - [Death of Chanda Sahib, "June 1752"]
      - [Dupleix recalled, "1754"]
    markers:
