  - title: Ambur and the rival nawabs
    date: 1749–1751
    when: "1749-08-03"
    borders: "1749-08-03"
    countries: [in]
    body:
      - The death of the old Nizam, Asaf Jah I, in 1748 left a disputed succession in Hyderabad, between his son Nasir Jang and his grandson Muzaffar Jang. Dupleix backed Muzaffar Jang and, in the Carnatic, Chanda Sahib, a rival of Anwaruddin who had just been released from Maratha captivity. On 3 August 1749 their armies, with some 400 French soldiers, defeated and killed Anwaruddin at Ambur. Chanda Sahib became nawab at Arcot, and Anwaruddin’s son Muhammad Ali fled to the fortress of Trichinopoly, where the British supported him.
      - Nasir Jang came south with a huge army and drove the French back, but in December 1750 he was killed by Pathan nobles in his own camp who had been in touch with Dupleix. Muzaffar Jang became Nizam and was himself killed in February 1751; the French commander Charles de Bussy then made his uncle Salabat Jang Nizam and stayed at his court with a French corps, while French troops took the fortress of Gingee. For a time Dupleix, honoured with a Mughal title, was the most powerful European in India.
    facts:
      - [Battle of Ambur, "3 August 1749, victory for Chanda Sahib and the French"]
      - [Death of Nasir Jang, "December 1750"]
      - [Gingee taken by the French, "September 1750"]
    markers:
