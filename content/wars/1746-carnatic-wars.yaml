  - title: Adyar and Pondicherry
    date: October 1746 – August 1749
    when: "1746-10-24"
    borders: "1748-10"
    countries: [in]
    body:
      - The Nawab, angry that the French had not handed Madras over to him as promised, sent his son Mahfuz Khan with about 10,000 men to take it. On 24 October 1746, at the Adyar river south of the town, a French force of some 350 Europeans and 700 sepoys under the Swiss engineer Louis Paradis attacked across the river and broke the Nawab’s army with musket volleys and the bayonet. The battle showed how small disciplined European-style forces could beat far larger Indian armies, and it changed the way both companies saw their position in India.
      - The French tried several times to take Fort St David in 1746–1748, but failed. In August 1748 a British fleet and army under Admiral Edward Boscawen besieged Pondicherry from the land and sea, but the siege was badly managed, and in October the monsoon forced him to raise it. The Treaty of Aix-la-Chapelle restored Madras to Britain in exchange for Louisbourg in North America, and the French handed it back in August 1749.
    facts:
      - [Battle of Adyar, "24 October 1746, French victory"]
      - [Nawab’s army, "about 10,000"]
      - [French force, "about 350 Europeans and 700 sepoys"]
      - [Siege of Pondicherry, "August – October 1748, abandoned"]
