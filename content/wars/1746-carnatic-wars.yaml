id: carnatic-wars
name: Carnatic Wars
start: "1746-07"
end: "1763-02-10"
tier: A
summary: "Three wars between the British and French East India Companies and their Indian allies for influence in the Carnatic, the coastal plain of south-eastern India, and the Deccan. In the first (1746–1748), an offshoot of the War of the Austrian Succession, the French took Madras and beat the Nawab of Arcot’s army at the Adyar, but gave Madras back at the peace. In the second (1749–1754) the companies backed rival claimants to the thrones of Arcot and Hyderabad: the French governor Dupleix made his candidates nawab and Nizam, but Robert Clive’s seizure and defence of Arcot in 1751 and the French surrender at Srirangam in 1752 turned the tide, and the British candidate, Muhammad Ali, kept Arcot. In the third (1757–1763), part of the Seven Years’ War, the comte de Lally took Fort St David and besieged Madras, but Eyre Coote defeated him at Wandiwash in 1760 and took Pondicherry in 1761. The French kept their trading posts but never again challenged British power in India."
countries: [in]
sides:
