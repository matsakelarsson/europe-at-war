  - title: Lally
    date: April 1758 – April 1759
    when: "1758-12-14"
    borders: "1758-12-14"
    countries: [in]
    body:
      - War broke out again in Europe in 1756, and in 1757 Clive, now in Bengal, took the French settlement of Chandernagore. France sent out the comte de Lally, an Irish Jacobite general, with a large force. He reached Pondicherry in April 1758 and took Fort St David on 2 June, razing it, but an attack on Thanjavur to raise money failed. He recalled Bussy and his troops from Hyderabad, and on 14 December laid siege to Madras with some 4,000 Europeans and 3,400 sepoys. The garrison under Colonel William Draper held out for two months, and when a British fleet arrived on 16 February 1759, Lally gave up the siege.
      - Meanwhile Clive sent a force from Bengal under Colonel Francis Forde to the Northern Circars, the coastal districts that the Nizam had granted to the French. Forde defeated the French at Condore in December 1758 and on 7 April 1759 stormed Masulipatam, after which Salabat Jang ceded the town and its district to the British. At sea, the squadrons of Admiral George Pocock and the comte d’Aché fought three indecisive battles off the coast in 1758 and 1759, after which the French fleet left Indian waters for good.
    facts:
      - [Fort St David taken by Lally, "2 June 1758"]
      - [Siege of Madras, "14 December 1758 – 16 February 1759"]
      - [Masulipatam stormed by Forde, "7 April 1759"]
