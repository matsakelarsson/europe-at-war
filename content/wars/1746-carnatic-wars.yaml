  - title: Pondicherry
    date: September 1760 – February 1763
    when: "1761-01-15"
    borders: "1761-01-16"
    countries: [in]
    body:
      - From September 1760 Coote’s army blockaded Pondicherry by land while a British squadron closed it by sea. A storm on the night of 1 January 1761 wrecked several of the blockading ships, but the British soon restored the blockade. With his garrison and the townspeople starving, Lally surrendered on 15 January 1761. The British razed the walls and public buildings of the city. The French posts at Mahé on the Malabar coast and the fortress of Gingee fell soon after.
      - Lally was taken to England as a prisoner, returned to France to answer charges of treason and was beheaded in Paris in 1766; his son later had the verdict annulled. The Treaty of Paris of 10 February 1763 gave Pondicherry and the other French posts back to France, but forbade fortifications and troops in Bengal. Muhammad Ali remained Nawab of Arcot, deeply in debt to the Company, whose power in the south now rested on its army and on its alliance with him.
    facts:
      - [Siege of Pondicherry, "September 1760 – 15 January 1761"]
      - [Lally executed in Paris, "9 May 1766"]
      - [Treaty of Paris, "10 February 1763"]
