steps:
  - title: Madras falls
    date: July – October 1746
    when: "1746-09-21"
    borders: "1746-09-21"
    countries: [in]
    body:
      - Britain and France had been at war in Europe since 1744, and the news reached their trading companies in India, whose main settlements on the Coromandel Coast, British Madras and French Pondicherry, lay only 150 km apart. The French governor-general, Joseph-François Dupleix, had asked the Nawab of Arcot, Anwaruddin Khan, to keep the peace on the coast, but a British squadron seized French ships in 1745. In 1746 a French fleet from Mauritius under Bertrand-François Mahé de La Bourdonnais fought an indecisive action with the British squadron off Negapatam in July and drove it off the coast.
      - In September La Bourdonnais landed troops south of Madras and bombarded Fort St George. The town, with a weak garrison of a few hundred Europeans, capitulated on 21 September 1746 almost without loss. La Bourdonnais agreed to give it back for a ransom, but Dupleix refused to honour the agreement, and after a cyclone wrecked part of his fleet in October La Bourdonnais sailed away. Among the Company clerks who were taken prisoner and escaped to the British post of Fort St David, south of Pondicherry, was the 21-year-old Robert Clive.
    facts:
      - [Naval action off Negapatam, "6 July 1746, indecisive"]
      - [Madras capitulates to the French, "21 September 1746"]
