notes:
  - British dates before September 1752 are often given in the Old Style (Julian) calendar, eleven days behind the Gregorian; the French used the Gregorian. Madras fell on 21 September 1746 by the French and modern reckoning, 10 September in contemporary English letters.
  - The armies were small by Indian standards, a few hundred to a few thousand European soldiers with larger numbers of sepoys, Indian soldiers trained and armed in the European way. The Indian rulers who fought with or against them, the Nawabs of Arcot, the Nizams, Mysore, Thanjavur and the Marathas, pursued their own aims and changed sides more than once.
  - The fighting in Bengal in 1756–1757, including the British capture of the French settlement of Chandernagore, is told in the story of the British conquest of Bengal; the Seven Years’ War has its own story for the war in Europe and elsewhere.
