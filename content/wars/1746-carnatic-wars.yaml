  - title: Arcot
    date: August 1751 – February 1752
    when: "1751-09-23"
    borders: "1751-11-14"
    countries: [in]
    body:
      - By 1751 Chanda Sahib and the French were besieging Muhammad Ali in Trichinopoly. To draw them off, the British at Madras sent Robert Clive, now a captain, with about 200 European soldiers, 300 sepoys and three small guns to seize Chanda Sahib’s capital, Arcot. Clive marched through monsoon storms, and the garrison fled as he arrived at the end of August. Chanda Sahib sent his son Raza Sahib with several thousand troops and a French contingent, who entered the town on 23 September and laid siege to the fort.
      - For fifty days Clive held the crumbling walls with a dwindling garrison, at the end some 120 Europeans and 200 sepoys. A Maratha force under Morari Rao, hired by Muhammad Ali, gathered nearby. On 14 November Raza Sahib launched a general assault with elephants against the gates; it was beaten off, and the besiegers withdrew. Clive followed up with victories at Arni in December and at Kaveripak in February 1752. The defence of Arcot made his name and gave the British cause new heart.
    facts:
      - [Siege of Arcot, "23 September – 14 November 1751"]
      - [Clive’s force, "about 200 Europeans and 300 sepoys"]
      - [Battle of Arni, "December 1751, British victory"]
      - [Battle of Kaveripak, "February 1752, British victory"]
