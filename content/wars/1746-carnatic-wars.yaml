  - title: Wandiwash
    date: 22 January 1760
    when: "1760-01-22"
    borders: "1760-01-22"
    countries: [in]
    body:
      - In late 1759 Colonel Eyre Coote arrived with reinforcements and took the fort of Wandiwash, between Madras and Pondicherry. Lally marched to retake it, and on 22 January 1760 the two armies met outside the town. Coote had about 1,900 European infantry, 2,100 sepoys and 26 guns; Lally had about 2,250 European infantry, 1,300 sepoys, 300 European cavalry and a contingent of Maratha horsemen, who took little part in the fighting.
      - The French cavalry charge was broken by British artillery, and a shot exploded a French ammunition cart, throwing their left into disorder. The British infantry then rolled up the French line. The French lost some 600 to 800 killed, wounded and captured, among them Bussy, who was taken prisoner; the British lost under 200. It was the decisive battle of the war in south India. Coote went on to take the remaining French forts one by one.
    facts:
      - [Battle of Wandiwash, "22 January 1760, British victory"]
      - [British force, "about 1,900 European infantry, 2,100 sepoys, 26 guns"]
      - [French force, "about 2,250 European infantry, 1,300 sepoys, 300 European cavalry"]
      - [Losses, "British about 190; French 600–800"]
    markers:
