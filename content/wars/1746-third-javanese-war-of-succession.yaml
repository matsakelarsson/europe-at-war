notes:
  - Many accounts date the war from Pakubuwono II’s death and Mangkubumi’s proclamation in December 1749, but Mangkubumi’s revolt began when he left the court in May 1746, and that date is used here.
  - Javanese tradition and the Indonesian state honour both Hamengkubuwono I and Mangkunegara I, whom his followers called Pangeran Sambernyawa, “the prince who reaps lives”, as National Heroes. The Treaty of Giyanti is remembered in Java as the Palihan Nagari, the division of the realm.
  - The outer provinces of the two courts were divided in a patchwork; the base map simplifies them.
