  - title: Giyanti and Salatiga
    date: 1755–1757
    when: "1755-02-13"
    borders: "1755-02-13"
    countries: [id, nl]
    body:
      - On 13 February 1755, at the village of Giyanti east of Surakarta, Mangkubumi, Hartingh and the representatives of Pakubuwono III signed the treaty that divided Mataram. Pakubuwono III kept Surakarta and the eastern half of the kingdom; Mangkubumi, as Sultan Hamengkubuwono I, received the western half and built a new palace at Yogyakarta, near Kotagede, the burial place of Mataram’s founder. The north coast stayed with the Company, Mangkubumi received half of the yearly rent it paid for it, and the heirlooms of the palace were shared.
      - Raden Mas Said refused to accept the division and fought both courts and the Company for two more years. By the Treaty of Salatiga of 17 March 1757 he received a domain carved out of Surakarta’s lands and the title of Mangkunegara I, with his own palace, the Puro Mangkunegaran, in Surakarta. Central Java now had three courts, each bound to the Company and none able to defy it alone, and the Mataram lands saw no major war until the British attack on Yogyakarta in 1812.
    facts:
      - [Treaty of Giyanti, "13 February 1755"]
      - [Treaty of Salatiga, "17 March 1757"]
