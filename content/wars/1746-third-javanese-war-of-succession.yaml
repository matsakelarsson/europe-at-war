steps:
  - title: Mangkubumi’s revolt and the cession of Mataram
    date: 1746–1749
    when: "1749-12"
    borders: "1749-12-11"
    countries: [id, nl]
    body:
      - After the Chinese War Pakubuwono II ruled from his new palace at Surakarta as a client of the Company, which held the north coast. His nephew Raden Mas Said, a grandson of Amangkurat IV, had joined the rebels of 1742 and was still in arms in the country of Sukawati, north-east of Surakarta. The king’s younger brother Mangkubumi drove him out and was promised Sukawati as a fief. But when Governor-General Gustaaf Willem van Imhoff visited the court in 1746, he rebuked Mangkubumi in public, and with the chief minister Pringgalaya persuaded the king to take back the grant. In May 1746 Mangkubumi left Surakarta with his followers, rose against the Company and the king, and made common cause with Raden Mas Said, who married his daughter.
      - In late 1749 Pakubuwono II fell gravely ill. On 11 December, at the urging of the Company’s commander at the court, Johan Andries van Hohendorff, he signed a document handing the “sovereignty” of Mataram to the Company, and he died soon after. The Company installed his son as Pakubuwono III on 15 December, while Mangkubumi’s followers proclaimed Mangkubumi king, and much of the Javanese nobility regarded him as the rightful ruler.
    facts:
      - [Mangkubumi leaves the court, "May 1746"]
      - [Mataram ceded to the Company, "11 December 1749"]
      - [Pakubuwono III installed, "15 December 1749"]
