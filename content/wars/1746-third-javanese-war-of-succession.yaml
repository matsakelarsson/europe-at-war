id: third-javanese-war-of-succession
name: Third Javanese War of Succession
start: "1746-05"
end: "1757-03-17"
tier: B
summary: "The war that split the kingdom of Mataram in two, and later three. Prince Mangkubumi, a younger brother of King Pakubuwono II, left the court at Surakarta in 1746 after the Dutch East India Company (VOC) had humiliated him and the king had taken back a fief promised to him, and joined his nephew Raden Mas Said, who had been in revolt since the Chinese War. In December 1749 the dying Pakubuwono II signed over the “sovereignty” of Mataram to the Company, which installed his son as Pakubuwono III, while Mangkubumi’s followers proclaimed him king. Mangkubumi and Raden Mas Said fought the Company and Pakubuwono III across Central Java and destroyed a Company army at the Bogowonto River in 1751, but neither side could win. Mangkubumi fell out with Raden Mas Said and made peace with the Company, and by the Treaty of Giyanti of 13 February 1755 Mataram was divided: Pakubuwono III kept Surakarta and the east, and Mangkubumi became Sultan Hamengkubuwono I of Yogyakarta in the west. Raden Mas Said fought on until the Treaty of Salatiga of 17 March 1757 gave him a principality of his own, Mangkunegaran, as Mangkunegara I. The partition, with the Company as overlord of all three courts, lasted until Indonesian independence."
countries: [id, nl]
