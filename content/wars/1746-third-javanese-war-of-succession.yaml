  - title: The war in Central Java
    date: 1750–1754
    when: "1751-12"
    borders: "1751-12"
    countries: [id, nl]
    body:
      - Mangkubumi and Raden Mas Said waged a war of movement across the interior and the north coast, fighting the Company and Pakubuwono III’s forces at Grobogan, Demak and elsewhere, while the Company, short of troops and money, held the coast and the courts. In 1751 Mangkubumi’s army crushed a Company force under de Clerck on the Bogowonto River in Bagelen, west of Yogyakarta.
      - Neither side could win. In 1752 Mangkubumi and Raden Mas Said quarrelled over the succession, and Mangkubumi began to look for terms. Governor-General Jacob Mossel sent Nicolaas Hartingh, the Company’s governor of the north-east coast, to negotiate; on 22–23 September 1754 Hartingh and Mangkubumi agreed that Mangkubumi would take the title of sultan and half of the kingdom, and Pakubuwono III accepted the terms in November.
    facts:
      - [Battle of the Bogowonto, "1751"]
      - [Hartingh meets Mangkubumi, "22–23 September 1754"]
