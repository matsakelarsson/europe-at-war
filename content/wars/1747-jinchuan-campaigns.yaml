  - title: Muguomu
    date: 1771–1773
    when: "1773-07"
    borders: "1773-07-01"
    countries: [cn]
    body:
      - "Slob dpon died in 1760, and in 1771 his grandson Sonom, now chief of Greater Jinchuan, killed the chief of Geshitsa and took his lands, while his ally Senggesang of Lesser Jinchuan attacked the chiefdoms of Okshi and Chakla. Both refused the emperor’s order to give the lands back. The emperor sent the minister Wenfu, with Agui and an army drawn from several provinces. In the winter of 1772–1773 Agui overran Lesser Jinchuan, and Senggesang fled to Sonom."
      - "Wenfu then pushed into Greater Jinchuan from the south and set up a large fortified camp at Muguomu. In the summer of 1773 the Jinchuan fighters, joined by men of Lesser Jinchuan who had risen again behind the Qing lines, cut the camp’s supply route and stormed it. Wenfu was killed with several thousand of his men, and the Qing lost all of Lesser Jinchuan in a few days. It was one of the worst defeats of the Qianlong reign."
    facts:
      - [Sonom and Senggesang seize neighbouring chiefdoms, "1771"]
      - [Lesser Jinchuan overrun by Agui, "winter 1772–1773"]
      - [Fall of the camp at Muguomu, "summer 1773, Wenfu killed"]
    markers:
