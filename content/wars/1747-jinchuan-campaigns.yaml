steps:
  - title: The first war
    date: 1747–1749
    when: "1747"
    borders: "1749-03-01"
    countries: [cn]
    body:
      - "The Gyalrong valleys were held by some eighteen hereditary chiefs who had accepted Ming and then Qing titles but ruled their people themselves from fortified villages and stone watchtowers. In 1746 Slob dpon, the chief of Greater Jinchuan, seized the chief of Lesser Jinchuan, Tsewang, who was married to his daughter, and in 1747 attacked the neighbouring chiefdom of Chakla (Mingzheng), whose chief guarded the road to Tibet at Dartsedo (Kangding). The Qianlong Emperor decided to make an example of him."
      - "The governor-general Zhang Guangsi, who had fought the Miao in Guizhou, led some 30,000 men into the valleys in 1747. His troops could not take the stone towers, each of which had to be besieged on its own, and the Jinchuan fighters raided their supply lines in the narrow gorges. The emperor sent his chief minister Necin to oversee the war, then had both men put to death for their failure, Zhang in December 1748 and Necin early in 1749. Fuheng, the emperor’s brother-in-law, took command with the old general Yue Zhongqi, who knew Slob dpon from earlier campaigns. In the spring of 1749 Slob dpon submitted, returned his conquests and was allowed to keep his chiefdom."
    facts:
      - [Qing army, "about 30,000 at first, later more"]
      - [Zhang Guangsi executed, "December 1748"]
      - [Slob dpon submits, "spring 1749"]
