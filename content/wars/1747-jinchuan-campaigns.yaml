id: jinchuan-campaigns
name: Jinchuan campaigns
start: "1747"
end: "1776"
tier: B
summary: "Two wars of the Qianlong Emperor against the Gyalrong chiefdoms of Greater and Lesser Jinchuan (Chuchen and Tsanlha), in the deep valleys of the upper Dadu River on the eastern edge of the Tibetan plateau, in today’s north-western Sichuan. The chiefs held their lands as hereditary Qing chieftains (tusi). In 1747 the emperor sent an army when Slob dpon of Greater Jinchuan attacked his neighbours; his commanders failed against the stone towers of the valleys, two of them were put to death, and in 1749 the chief submitted and kept his lands. In 1771 Slob dpon’s grandson Sonom and Senggesang of Lesser Jinchuan seized the lands of other chiefs. This time the war lasted five years. A Jinchuan attack destroyed the Qing camp at Muguomu in 1773 and killed the commander Wenfu, but Agui’s army took the valleys tower by tower with heavy cannon, and Sonom surrendered early in 1776. He was executed in Beijing, the chiefdoms were abolished and the region was put under Qing officials and military colonies. The second war, which cost the Qing tens of thousands of men and some 60 to 70 million taels of silver, was the most expensive of the Ten Great Campaigns."
countries: [cn]
sides:
  - id: qing
    name: Qing dynasty
    polities: [qing]
    ink: gold
    moves: Qing moves
    success: Qing success
  - id: jin
    name: Greater and Lesser Jinchuan
    polities: [jinchuan]
    ink: slate
    moves: Jinchuan moves
    success: Jinchuan success
notes:
  - "The Gyalrong (Rgyal rong) are a Tibetan people whose language is distinct from Tibetan; their chiefs followed the Bon religion. Their own names for the two chiefdoms were Chuchen (Greater Jinchuan) and Tsanlha (Lesser Jinchuan); Jinchuan, “gold stream”, is the Chinese name of the river. The chiefs’ names are given in their Tibetan forms, with the Chinese forms Shaluoben (Slob dpon), Suonuomu (Sonom) and Sengge Sang (Senggesang)."
  - "Figures for troops, losses and costs come from Qing records and vary between modern accounts; the wars counted as two of the Qianlong Emperor’s Ten Great Campaigns."
