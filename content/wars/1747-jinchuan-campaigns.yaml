  - title: Agui takes the valleys
    date: 1773–1776
    when: "1775"
    borders: "1776-04-01"
    countries: [cn]
    body:
      - "Agui, now in command with Mingliang and Fengsheng’e, retook Lesser Jinchuan in the autumn of 1773 and spent the next two years advancing up the valleys of Greater Jinchuan, taking the towers and walled villages one by one. Heavy cannon were cast in the field, with advice from the Jesuits at the court, and dragged up the mountains; the Qing used tens of thousands of soldiers and porters, including Tibetan and other Gyalrong levies. In 1775 Sonom poisoned Senggesang and sent his body to Agui in the hope of peace, but the emperor wanted the chiefdom destroyed."
      - "In the late summer of 1775 Agui took Le’uwi, Sonom’s seat, and laid siege to his last stronghold, Gharai. Sonom surrendered with his family and followers early in 1776. He and his chief followers were taken to Beijing, presented to the emperor at the Meridian Gate and executed. The chiefdoms were abolished, their land was divided among Qing military colonies and garrisons, and the Bon monastery of the chiefs was rebuilt as a Gelug Buddhist one. The court commemorated the victory in a series of engravings, but the war had cost tens of thousands of lives and some 60 to 70 million taels."
    facts:
      - [Le’uwi taken, "late summer 1775"]
      - [Surrender of Sonom, "early 1776"]
      - [Cost of the second war, "about 60 to 70 million taels"]
