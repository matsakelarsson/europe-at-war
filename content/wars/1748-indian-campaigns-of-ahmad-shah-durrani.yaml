  - title: The Punjab, Multan and Kashmir
    date: 1748–1752
    when: "1752-03-06"
    borders: "1752-06"
    countries: [pk, in]
    body:
      - Ahmad Shah came back at the end of 1748, and Muin-ul-Mulk, without help from Delhi, bought him off with the revenue of four districts north of Lahore, Sialkot, Pasrur, Gujrat and Aurangabad, worth some 1.4 million rupees a year. When the money was not paid, Ahmad Shah invaded again late in 1751 and besieged Lahore for four months. Muin-ul-Mulk fought a battle outside the city on 6 March 1752, was beaten and surrendered; Ahmad Shah kept him on as his own governor.
      - On 3 April 1752 the Mughal emperor, Ahmad Shah Bahadur, signed away the Punjab and Multan to the Durrani king, and in May an Afghan army took Kashmir. The Durrani Empire now reached from Herat to Sirhind, less than 250 km from Delhi.
    facts:
      - [Revenue of four districts ceded, "1748"]
      - [Muin-ul-Mulk surrenders at Lahore, "6 March 1752"]
      - [Punjab and Multan ceded by the emperor, "3 April 1752"]
      - [Kashmir taken, "May 1752"]
