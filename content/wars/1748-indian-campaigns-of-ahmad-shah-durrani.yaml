  - title: The sack of Delhi
    date: November 1756 – April 1757
    when: "1757-01-28"
    borders: "1757-04"
    countries: [in, pk]
    body:
      - After Muin-ul-Mulk died in 1753, the new Mughal wazir, Imad-ul-Mulk, seized Lahore in 1756. Ahmad Shah crossed the Indus in November with a large army, retook Lahore in December and marched on Delhi, which no army defended. He reached the capital on 28 January 1757 and stayed for about a month. The city was plundered systematically; nobles were tortured to give up their hidden wealth, and Imad-ul-Mulk alone handed over some 10 million rupees. The emperor Alamgir II kept his throne, and the Rohilla chief Najib-ud-Daula, Ahmad Shah’s ally, was made commander of the Mughal army.
      - In February and March Afghan troops marched south into the land of the Jats. They massacred the people of Mathura, crowded with pilgrims for the Holi festival, and then those of Vrindavan, both cities sacred to Krishna; at Gokul armed ascetics fought them off. Cholera broke out in the army in the hot season, and in April Ahmad Shah turned back with his plunder, leaving his son Timur Shah as governor of Lahore.
    facts:
      - [Lahore retaken, "20 December 1756"]
      - [Afghans reach Delhi, "28 January 1757"]
      - [Massacres at Mathura and Vrindavan, "late February – March 1757"]
