  - title: Panipat
    date: 14 January 1761
    when: "1761-01-14"
    borders: "1761-01-14"
    countries: [in]
    body:
      - With his men and horses starving, the Bhau broke out of his camp on the morning of 14 January 1761 and attacked the Afghan army drawn up to the south. Wikipedia gives some 55,000 Maratha cavalry and 9,000 infantry, against about 42,000 Afghan cavalry and 32,000 Rohilla infantry, with camel guns. Ibrahim Khan Gardi’s infantry broke the Rohillas on the Afghan right, and for some hours the Marathas had the advantage in the centre. In the afternoon Ahmad Shah threw in his reserve, some 5,000 fresh horsemen; Vishwasrao was shot dead, the Bhau disappeared into the fighting and was killed, and the Maratha army broke.
      - Britannica estimates that 60,000 to 70,000 people died in the battle and the pursuit. The Afghans then killed many of the prisoners and camp followers; the chronicler Kashi Raj, who was in the Afghan camp, reported some 40,000 prisoners killed the day after the battle, and many women and children were enslaved. The Peshwa Balaji Rao died a few months later. Ahmad Shah entered Delhi, recognised the exiled Shah Alam II as emperor and went home in March. The Marathas recovered in the north within ten years, but their hold on the Punjab was gone for good.
    facts:
      - [Third Battle of Panipat, "14 January 1761, Afghan victory"]
      - [Maratha army, "about 55,000 cavalry and 9,000 infantry, with tens of thousands of camp followers"]
      - [Afghan and allied army, "about 42,000 cavalry and 32,000 Rohilla infantry"]
      - [Dead, "60,000–70,000 in the battle (Britannica), with many prisoners killed afterwards"]
    markers:
      - kind: battle
        side: afg
        name: Panipat
        date: 14 January 1761
        text: The main Maratha army was destroyed; Sadashivrao Bhau and Vishwasrao were killed.
        lonlat: [76.960, 29.410]
      - kind: event
        side: afg
        name: Delhi
        date: January – March 1761
        text: Ahmad Shah recognised Shah Alam II as emperor before going home.
        lonlat: [77.241, 28.656]
    arrows:
