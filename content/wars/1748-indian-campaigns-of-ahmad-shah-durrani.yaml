  - title: Delhi and Kunjpura
    date: March – December 1760
    when: "1760-10-17"
    borders: "1760-10-17"
    countries: [in]
    body:
      - Sadashivrao Bhau left the Deccan in March 1760 with the Peshwa’s young son Vishwasrao, a strong cavalry army, the trained infantry and artillery of Ibrahim Khan Gardi, and a huge train of camp followers and pilgrims. The Rajput princes and the Jats gave little help. At the end of July the Marathas took Delhi, and to pay his troops the Bhau stripped the silver ceiling of the hall of audience in the Red Fort. The Nawab of Awadh, Shuja-ud-Daula, joined Ahmad Shah.
      - In October the Bhau marched north and stormed the Afghan post at Kunjpura on the Yamuna, killing its commander. But late in October Ahmad Shah crossed the river behind him near Baghpat, cutting the Marathas off from Delhi and the south. The Bhau dug in at Panipat, and through November and December the two armies faced each other while Afghan cavalry cut off the Maratha supplies. A Maratha commander bringing money and food from the Doab, Govind Pant Bundele, was caught and killed in December, and hunger spread through the Maratha camp.
    facts:
      - [Delhi taken by the Marathas, "late July 1760"]
      - [Kunjpura stormed, "16–17 October 1760"]
      - [Afghans cross the Yamuna, "late October 1760"]
