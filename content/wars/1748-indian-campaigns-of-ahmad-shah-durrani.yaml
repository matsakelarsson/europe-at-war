steps:
  - title: Lahore and Manupur
    date: December 1747 – March 1748
    when: "1748-03-11"
    borders: "1748-03-11"
    countries: [pk, in]
    body:
      - After Nader Shah was murdered in June 1747, the commander of his Afghan bodyguard, Ahmad Khan of the Abdali tribe, was chosen king at Kandahar, took the name Ahmad Shah Durr-i-Durran and seized Nader’s eastern provinces with Kabul and Peshawar. In December, invited by Shah Nawaz Khan, one of two brothers fighting over the governorship of the Mughal Punjab, he crossed the Indus with a small army. Shah Nawaz changed his mind and resisted, but was beaten outside Lahore on 11 January 1748, and Ahmad Shah entered the city the next day.
      - The Mughal emperor Muhammad Shah sent his son Ahmad Shah Bahadur and the wazir Qamar-ud-din Khan north with a far larger army, said to be some 60,000 to 70,000 fighting men against about 12,000 Afghans. The armies met at Manupur near Sirhind on 11 March 1748. The wazir was killed by a cannonball at prayer before the battle, but his son Muin-ul-Mulk (Mir Mannu) took command, and when a fire in captured rockets set off the Afghan powder store, Ahmad Shah withdrew to the Indus. Muin-ul-Mulk became governor of the Punjab.
    facts:
      - [Lahore taken, "12 January 1748"]
      - [Battle of Manupur, "11 March 1748, Mughal victory"]
      - [Armies at Manupur, "Mughals 60,000–70,000; Afghans about 12,000"]
