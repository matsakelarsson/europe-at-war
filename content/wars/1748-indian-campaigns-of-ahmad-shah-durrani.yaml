id: indian-campaigns-of-ahmad-shah-durrani
name: Indian campaigns of Ahmad Shah Durrani
start: "1748-01"
end: "1767-05"
tier: A
summary: "The invasions of northern India by Ahmad Shah Durrani, the Afghan commander of Nader Shah who made himself king at Kandahar in 1747 and founded the Durrani Empire. Beaten back by a Mughal army at Manupur in 1748, he returned again and again, took the Punjab, Multan and Kashmir from the Mughal Empire by 1752, and in 1757 sacked Delhi, Mathura and Vrindavan. When the Marathas, now the strongest power in India, drove his son out of the Punjab in 1758, he came back, and on 14 January 1761, at the Third Battle of Panipat, his Afghan army and its Rohilla and Awadh allies destroyed the main Maratha army in one of the largest and bloodiest battles of the century. He could not hold the Punjab, however. The Sikh misls fought on through repeated defeats, including the massacre of 1762, took Lahore in 1765 and held the country between the Indus and the Yamuna after his last campaigns."
countries: [in, pk, af]
