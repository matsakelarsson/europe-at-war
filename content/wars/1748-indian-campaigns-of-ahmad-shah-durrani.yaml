notes:
  - Historians count the invasions differently, from seven to nine, depending on whether the smaller campaigns of 1749 and 1768–1769 are included. This story ends with the eighth, in 1766–1767; a last advance in 1768–1769 got no further than the Jhelum.
  - Figures for the Third Battle of Panipat and for the killing of Sikhs in 1762 vary widely between sources; the ranges given here are those cited by Britannica and Wikipedia. The later wars between the Durrani state and the Sikh Empire of Ranjit Singh are told separately.
  - Nader Shah’s invasion of India in 1739, in which Ahmad Shah served, is part of the story of Nader Shah’s campaigns.
