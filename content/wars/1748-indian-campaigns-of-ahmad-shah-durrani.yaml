  - title: The Marathas in the Punjab
    date: March 1758 – late 1759
    when: "1758-04"
    borders: "1758-05"
    countries: [in, pk]
    body:
      - The Marathas, who already collected tribute across much of northern India, had their own ambitions in Delhi. In 1757 a Maratha army under Raghunath Rao, the Peshwa’s brother, forced Najib-ud-Daula to leave the capital. Then Adina Beg Khan, a former Mughal officer in the Punjab who had risen against Timur Shah with Sikh support, asked for their help. In March 1758 Raghunath Rao and Malhar Rao Holkar, with the Sikh bands of Jassa Singh Ahluwalia and Ala Singh, took Sirhind and sacked it.
      - In April Timur Shah and his general Jahan Khan abandoned Lahore and fled west, and the Maratha cavalry followed them to Attock on the Indus and, according to several sources, to Peshawar. It was the furthest north-west a Maratha army ever went. But the Maratha commanders soon went back south, Adina Beg died in 1758, and the Maratha garrisons left behind were too weak to hold the country against the Afghans and the Sikhs.
    facts:
      - [Sirhind taken, "21 March 1758"]
      - [Lahore abandoned by the Afghans, "April 1758"]
      - [Attock and Peshawar reached, "April – May 1758"]
    markers:
