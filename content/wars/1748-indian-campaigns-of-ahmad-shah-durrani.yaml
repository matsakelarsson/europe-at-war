  - title: Taraori, Barari Ghat and Sikandarabad
    date: October 1759 – March 1760
    when: "1760-01-09"
    borders: "1760-03-04"
    countries: [in, pk]
    body:
      - Ahmad Shah crossed the Indus on 25 October 1759 and swept the Marathas out of the Punjab, taking Sirhind in November. He crossed into the Doab east of the Yamuna and joined Najib-ud-Daula and the Rohillas, while the Maratha commander in the north, Dattaji Shinde, fell back on Delhi. After a defeat at Taraori in December, Dattaji tried to stop the Afghans crossing the Yamuna at Barari Ghat, just north of Delhi, on 9 January 1760; he was killed and his army scattered.
      - The Afghans now held the country around Delhi. Malhar Rao Holkar, raiding the Doab, was surprised at Sikandarabad on 4 March 1760 and lost most of his men. In Pune the Peshwa, Balaji Rao, decided to send his cousin Sadashivrao Bhau, the victor of Udgir, north with the best of the Maratha army.
    facts:
