  - title: The Sikhs take the Punjab
    date: 1761–1767
    when: "1762-02-05"
    borders: "1765-05"
    countries: [pk, in]
    body:
      - With the Marathas gone, the Sikh misls, the bands of Sikh fighters who had harried every Afghan army since 1748, began to take the Punjab for themselves. Ahmad Shah returned in February 1762 and caught a large Sikh column, with many women, children and old people, near Kup, north of Malerkotla, on 5 February. In the Vadda Ghallughara, the great massacre, his army killed thousands as the column fought its way south-west towards Barnala; estimates range from about 5,000 to 50,000, with Jadunath Sarkar giving about 10,000. In April he blew up the Harmandir Sahib, the Golden Temple at Amritsar, and desecrated its sacred pool.
      - The Sikhs recovered quickly. They beat Jahan Khan at Sialkot in 1763, took Sirhind in January 1764, killing its Afghan governor Zain Khan, and on 16 April 1765 the Bhangi chiefs Lehna Singh and Gujjar Singh and Sobha Singh Kanhaiya took Lahore. Ahmad Shah came twice more, in 1764–1765 and in 1766–1767, and reoccupied Lahore in December 1766, but the Sikhs avoided pitched battles and returned as soon as he left. When he went home in 1767 the Punjab east of the Indus was in Sikh hands. He died at Kandahar in 1772.
    facts:
      - [Vadda Ghallughara, "5 February 1762"]
      - [Sikh dead, "estimates from about 5,000 to 50,000"]
      - [Golden Temple blown up, "April 1762"]
      - [Sirhind taken by the Sikhs, "14 January 1764"]
      - [Lahore taken by the Sikhs, "16 April 1765"]
    markers:
