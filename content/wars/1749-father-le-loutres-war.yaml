id: father-le-loutres-war
name: Father Le Loutre’s War
start: "1749-06"
end: "1755-06-16"
tier: C
summary: "A war in Nova Scotia between the British and the Mi’kmaq, Wolastoqiyik (Maliseet) and many Acadians, encouraged by New France and by the missionary Jean-Louis Le Loutre, in the years of nominal peace between Britain and France after 1748. In June 1749 Edward Cornwallis arrived with some 2,500 settlers and founded Halifax on Mi’kmaq land at Chebucto without any treaty with them; in September the Mi’kmaq wrote to him, through the missionary Pierre Maillard, that the land was theirs, and attacked woodcutters at Dartmouth. On 2 October 1749 Cornwallis’s council offered a bounty of ten guineas for every Mi’kmaq killed or captured, raised to fifty in 1750. Le Loutre urged the Acadians to leave British territory, and in 1750 he and his Mi’kmaq allies burned the village of Beaubassin so its people would move across the Missaguash River into French-held land. The British built Fort Lawrence on the Chignecto isthmus and the French faced it from Fort Beauséjour. Raids struck the new settlements around Halifax, Dartmouth (where about 20 settlers were killed in May 1751) and Lunenburg; the British officer Edward How was killed under a flag of truce in October 1750. Governor Peregrine Hopson made a peace treaty with the Mi’kmaq leader Jean-Baptiste Cope in 1752, but it did not hold. Between a third and almost half of the Acadians of the peninsula, by different estimates, moved to French-held Île Saint-Jean, Île Royale and the Chignecto isthmus. The war ended when a British and New England force took Fort Beauséjour on 16 June 1755, at the start of the French and Indian War, and the expulsion of the Acadians followed."
