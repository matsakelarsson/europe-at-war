notes:
  - The name comes from the British view of Le Loutre as the war’s instigator; historians have also called it the Anglo-Mi’kmaq War of 1749–1755. Whether the Mi’kmaq letter of September 1749 was a declaration of war is debated.
  - Cornwallis’s scalp proclamation remains controversial in Nova Scotia; his statue in Halifax was removed in 2018.
  - British dates before September 1752 are in the Julian calendar (Old Style), as the standard references give them; the Gregorian date was eleven days later.
