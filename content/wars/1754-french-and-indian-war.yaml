  - title: Sainte-Foy and Montreal
    date: April – September 1760
    when: "1760-04-28"
    borders: "1760-09-08"
    countries: [ca, us, gb, fr]
    body:
      - "Montcalm’s successor, the Chevalier de Lévis, made one more attempt. In April 1760 he came down the river from Montreal with about 7,000 regulars and militia, and on 28 April at Sainte-Foy, just west of Quebec, he defeated Murray’s 3,800, who had marched out to meet him; the British lost about 1,100 killed and wounded, the French about 830. Lévis besieged the city, knowing that the first ships up the river would decide its fate. They were British: HMS Lowestoffe arrived on 9 May and more warships followed, and Lévis retreated. In July a small French relief convoy that had reached the Baie des Chaleurs was destroyed in the Battle of the Restigouche."
      - "That summer three British armies converged on Montreal. Amherst brought about 10,000 men from Oswego down the St. Lawrence, taking Fort Lévis after a siege in August and losing boats and men in the rapids; William Johnson persuaded about 700 Haudenosaunee to go with him. Brigadier William Haviland came down Lake Champlain and forced the French out of Île aux Noix, and Murray came up the river from Quebec. The Canadian militia went home, and the Seven Nations of Canada, the Catholic Native communities of the St. Lawrence, made peace with the British at Oswegatchie and Kahnawake in return for promises to respect their lands and their religion."
      - "Surrounded by some 17,000 men, Governor Vaudreuil signed the capitulation of Montreal on 8 September 1760, surrendering all of Canada. The Canadians kept their property and the free exercise of their Catholic religion, but the French troops were refused the honours of war, and Lévis burned his regiments’ colours rather than give them up. Major Robert Rogers took over Detroit in November, and Canada was governed by the British army until the peace."
    facts:
      - [Battle of Sainte-Foy, "28 April 1760"]
      - [Siege of Quebec lifted, "May 1760"]
      - [Battle of the Restigouche, "July 1760"]
      - [Capitulation of Montreal, "8 September 1760"]
