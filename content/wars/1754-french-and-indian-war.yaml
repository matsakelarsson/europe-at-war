id: french-and-indian-war
name: French and Indian War
start: "1754-05-28"
end: "1763-02-10"
tier: A
summary: "The war in North America between Great Britain and France, with their colonies and Native allies, that began two years before the Seven Years’ War in Europe and decided the fate of New France. It started in 1754 in the Ohio country, claimed by both empires and home to the Lenape, Shawnee and Mingo, when George Washington’s Virginians and Tanaghrisson’s Mingo attacked a French party at Jumonville Glen and were forced to surrender at Fort Necessity. In 1755 a British army under Edward Braddock was destroyed on the Monongahela by French troops and Native warriors, and the British began the expulsion of the Acadians from Nova Scotia. Under Montcalm the French took Oswego in 1756 and Fort William Henry in 1757, where Native warriors attacked the surrendered garrison, and beat a far larger British army at Carillon in 1758. But William Pitt poured troops, ships and money into America, the Royal Navy cut New France off from France, and the treaty of Easton drew the Ohio nations out of the war. The British took Louisbourg, Fort Frontenac and Fort Duquesne in 1758, Niagara, Ticonderoga and Quebec in 1759, after Wolfe’s victory on the Plains of Abraham, and in 1760, after a last French victory at Sainte-Foy, three British armies converged on Montreal, where Governor Vaudreuil surrendered Canada. France gave Louisiana west of the Mississippi to Spain by the secret Treaty of Fontainebleau of 1762, and by the Treaty of Paris of 1763 ceded Canada and its lands east of the river to Britain, while Spain ceded Florida to Britain. The Native nations, not consulted, rose within months in Pontiac’s War."
countries: [us, ca, gb, fr]
sides:
  - id: brit
    name: Great Britain, British America and their Native allies (Mohawk and, from 1759, other Haudenosaunee; Cherokee and Catawba; Stockbridge Mohican)
    polities: [united-kingdom, british-america, nova-scotia, haudenosaunee]
    ink: red
    moves: British and colonial moves
    success: British and colonial success
  - id: fr
    name: France, New France and their Native allies (the nations of the Great Lakes and the Ohio, the Wabanaki, the Seven Nations of Canada), with Acadian militia
    polities: [new-france, france, odawa, shawnee, lenape, wabanaki, acadians]
    ink: blue
    moves: French and allied moves
    success: French and allied success
notes:
  - The name is the one used in the United States; Canadians usually call it the Seven Years’ War, and in Quebec it is often called la guerre de la Conquête. For the war in Europe, India and at sea see the Seven Years’ War; for the British campaigns against Guadeloupe, Martinique and Havana see the Seven Years’ War in the Caribbean, and for the war with the Cherokee, the Anglo-Cherokee War.
  - Britain and its colonies adopted the Gregorian calendar in September 1752, so all dates here are New Style.
  - The Native nations who fought in the war did so as allies, not subjects, for their own aims, among them trade, gifts, captives, revenge and the defence of their lands; many changed sides or made peace as the war turned. At the start the British colonies had well over a million people and New France fewer than 80,000, but New France had far more Native allies.
  - Numbers killed are often uncertain, especially in the Native war on the frontier, and are given as the sources give them.
