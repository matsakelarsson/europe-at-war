  - title: Braddock’s defeat
    date: 1755
    when: "1755-07-09"
    borders: "1755-07-09"
    countries: [us, gb, fr]
    body:
      - "Britain sent Major General Edward Braddock with two regiments of regulars to take command in America. At Alexandria in April 1755 he and the colonial governors planned four attacks: on Fort Duquesne, on Fort Niagara, on Crown Point on Lake Champlain and on Fort Beauséjour in Acadia. Braddock himself led some 2,200 regulars and provincials from Fort Cumberland, cutting a road over the mountains. When the Lenape leader Shingas asked him whether the peoples of the Ohio would keep their land if the French were driven out, Braddock, as Shingas later told it, answered that the English would inherit it; few Ohio warriors went with him, and he had only eight Mingo scouts."
      - "Braddock pushed ahead with a flying column of about 1,300 men. On 9 July 1755, just after it had crossed the Monongahela some ten miles from Fort Duquesne, it met a force under Captain Daniel Liénard de Beaujeu of 108 troupes de la marine, 146 Canadian militiamen and some 600 warriors, Odawa, Ojibwe, Potawatomi, Wendat, Lenape, Abenaki and others from the Great Lakes, the Ohio and Canada, some of them led by Charles Langlade. Beaujeu was killed in the first volleys, but Jean-Daniel Dumas took command, and the warriors spread through the woods along both flanks and fired into the crowded column for three hours. About 456 of Braddock’s men were killed and 422 wounded, against perhaps 30 or 40 French and Native dead. Braddock was mortally wounded and died on 13 July; Washington, serving as his aide, helped lead the retreat. Colonel Thomas Dunbar destroyed the army’s stores and marched what was left of it east."
      - "With no army left in the west, Lenape and Shawnee war parties under leaders such as Shingas and Captain Jacobs struck the backcountry of Pennsylvania, Maryland and Virginia from October 1755, at Penn’s Creek, at the Moravian mission of Gnadenhütten and at hundreds of farms. Many settlers were killed or carried off as captives, and thousands fled east. Pennsylvania built a chain of forts along the Blue Mountain and in 1756 declared war on the Lenape, offering bounties for scalps."
    facts:
      - [Battle of the Monongahela, "9 July 1755"]
      - [Braddock’s column, "about 1,300 men"]
      - [British losses, "about 456 killed and 422 wounded"]
      - [French and Native force, "about 850, some 600 of them Native warriors"]
