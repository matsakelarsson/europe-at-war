steps:
  - title: The Forks of the Ohio
    date: 1753–1754
    when: "1754-05-28"
    borders: "1754-07-03"
    countries: [us, gb, fr]
    body:
      - "The upper Ohio valley was the home of Lenape and Shawnee who had moved west from Pennsylvania, and of Mingo, Haudenosaunee who lived apart from the confederacy. British traders from Pennsylvania had won much of their trade, and in 1749 the Ohio Company of Virginia was granted 200,000 acres there. For New France the Ohio was the link between Canada and Louisiana. In 1752 French-allied Odawa and Ojibwe under Charles Langlade destroyed Pickawillany, a Miami town that traded with the British, and in 1753 Governor Duquesne sent troops to build forts at Presque Isle and Le Boeuf on the route south from Lake Erie. Robert Dinwiddie, governor of Virginia, sent the 21-year-old George Washington to tell them to leave; the commander at Le Boeuf refused."
      - "In April 1754 some 500 French troops under Claude-Pierre Pécaudy de Contrecœur forced a handful of Virginians to give up the fort they were building at the Forks of the Ohio and began Fort Duquesne. Washington was marching west with about 160 Virginians. On 28 May, guided by the Mingo leader Tanaghrisson, the Half King, and about a dozen of his warriors, he surprised a French party of some 35 men under Ensign Joseph Coulon de Villiers de Jumonville in a rocky glen. Ten French were killed, among them Jumonville, who by several accounts was killed by Tanaghrisson as he lay wounded, and 21 captured. The French said Jumonville had been carrying a summons to leave French territory."
      - "Washington fell back to a stockade at Great Meadows, Fort Necessity. On 3 July Jumonville’s half-brother Louis Coulon de Villiers attacked it with about 600 French and 100 Native warriors, and after a day of fighting in the rain Washington, with about 400 men, surrendered. The capitulation he signed, written in French, called Jumonville’s death an assassination. That summer delegates of seven colonies met the Haudenosaunee at Albany, where Benjamin Franklin’s plan for a union of the colonies was drawn up and then rejected by every colonial assembly. Most of the Ohio nations now sided with the French."
    facts:
      - [Jumonville Glen, "28 May 1754"]
      - [Fort Necessity, "3 July 1754"]
      - [Albany Congress, "June – July 1754"]
