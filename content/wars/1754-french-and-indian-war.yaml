  - title: Quebec
    date: June – September 1759
    when: "1759-09-13"
    borders: "1759-09-18"
    countries: [ca, gb, fr]
    view:
      center: [-71.21, 46.83]
      size: [60, 50]
    body:
      - "Vice-Admiral Charles Saunders brought Wolfe’s army of some 8,500 men up the St. Lawrence in 49 warships and about 140 transports and smaller craft, through channels charted by sailors such as James Cook, and landed it on the Île d’Orléans at the end of June. From 12 July British batteries at Point Lévis, across the river, bombarded the city and ruined much of the Lower Town. Montcalm, with some 15,000 regulars, troupes de la marine, Canadian militia and Native allies, held the Beauport shore from the St. Charles River to the falls of the Montmorency."
      - "On 31 July Wolfe attacked the Beauport lines near the Montmorency and was beaten back with about 450 casualties against some 60 French. Through August his troops and rangers burned farms and villages along both shores, some 1,400 houses by one estimate, to break the will of the Canadians; British ships slipped past the city, and Louis-Antoine de Bougainville, with about 3,000 men, shadowed them along the north shore upstream."
      - "In the night of 12–13 September British troops landed at the Anse au Foulon, climbed the cliff path, overpowered the post at the top and by morning had about 4,400 men drawn up on the Plains of Abraham, west of the city. Montcalm attacked at once with about 3,500, without waiting for Bougainville. Two British volleys broke the French line, and the battle was over in less than an hour. Wolfe was killed on the field, and Montcalm, mortally wounded in the retreat, died the next morning. The British lost about 60 killed and 600 wounded, the French more than 600 killed and wounded. The governor, Pierre de Rigaud de Vaudreuil, took the army west to Jacques-Cartier, and on 18 September Jean-Baptiste-Nicolas-Roch de Ramezay surrendered Quebec. Brigadier James Murray held it through a winter of cold and scurvy."
    facts:
      - [Montmorency, "31 July 1759"]
      - [Battle of the Plains of Abraham, "13 September 1759"]
      - [Forces on the Plains, "about 4,400 British, 3,500 French"]
      - [Surrender of Quebec, "18 September 1759"]
